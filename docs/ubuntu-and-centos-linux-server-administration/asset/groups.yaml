  mdcn: "\n\n# UBUNTU CENTOS 管理员\n\n普通正则表达式可以匹配多个文件，但规则只能有一个\n\n这里还有一个 `FileMatch`\
    \ 指令，它的作用与 `DirectoryMatch` 指令类似，用于通过复杂的正则表达式处理多个文件。\n\n→ 节点标签 (Location tags)：\n\
    \nlocation 标签用法与文件和目录标签类似，唯一的区别是文件和目录标签用于控制其对应位置内部（如 Directory 和子目录），而 location\
    \ 标签用于控制系统外部的内容。例如，Web 服务器的数据库交互可以通过 location 标签进行控制。\n\n→ 重定向 (Redirect)：\n\n\
    重定向设置允许重定向 URL。它允许 Web 服务器重到一个新域名，如果你更改域名或尝试重定向到另一个站点，可以通过此指令来实现。\n配置语法如下：\n\n\
    ```apache\n<IfModule alias_module>\nRedirect permanent /<yoursite.html> <your_target_site_url>\n\
    Redirect permanent /index.html http://www.facebook.com\n</IfModule>\n```\n\n#\
    \ 虚拟主机 (Virtual Hosts)\n\n在 Apache 服务器中，你可以在单台计算机上运行多个网站。这是一个非常强大且灵活的功能。它可以基于\
    \ IP 或名称运行。\n\n虚拟主机可以运行 `httpd.conf` 文件中使用的所有选项。你可以将每个虚拟主机视为一个独立的配置文件。它就像是嵌套在一个\
    \ `httpd.conf 文件` 中的嵌套配置文件。\n\n```apache\n<VirtualHost *:80>\nDocumentRoot /var/www/html/first_site\n\
    ServerName www.first.com\n#其他指令\n</VirtualHost>\n```\n\n这是基础级的 VPS 配置文件。\n\n#\
    \ 创建两个虚拟主机\n\n# 步骤 1\n\n首先，我们必须创建一个存放网站数据的目录结构。默认情况下，主 Apache 服务器的 Document root\
    \ 是 `/var/www/`。\n\n我们在 Document Root 内部为两个不同的虚拟主机创建了两个目录，并在每个文件夹内创建一个 \"public\"\
    \ 文件夹。public 文件夹中的文件可以通过 public 访问。\n\n```bash\n=>sudo mkdir -p /var/www/first_site.com/public\n\
    =>sudo mkdir -p /var/www/second_site.com/public\n```\n\n我们将通过我们的 VPS 服务器提供两个网站：\n\
    \n- 1) first_site.com\n- 2) second_site.com\n\n# 步骤 2\n\n我们可以看到使用 `sudo` 命令创建了目录，这意味着它属于\
    \ root 用户。如果不更改权限，它将只能由 root 用户进行修改。\n\n```bash\n=>chown -R <user>:<group> /var/www/first_site.com/public\n\
    =>chown -R <user>:<group> /var/www/second_site.com/public\n```\n\n# 步骤 3\n\n我们给\
    \ `/var/var/www` 赋予了递归权限 755。\n=>sudo chmod -R 755 /var/www\n\n为什么是 755：\n-----------------\n\
    =>意味着用户可以读取、写入和执行\n=>用户组只能读取和执行\n=>其他人只能读取和执行\n\n# 步骤 4\n\n我们必须在 `first_site`\
    \ 和 `second_site` 的 `public` 文件夹内各创建一个 `index.html` 文件，并放入一些 HTML 代码，这样在配置完成后我们就能判断它是否正常工作。\n\
    \n# 步骤 5\n\n现在我们必须添加虚拟主机的配置。你可以添加其中两个：\n\n```apache\n<VirtualHost *:80>\n...\n\
    </VirtualHost>\n```\n\n在主 `httpd.conf` 文件中添加。但我们有一种更高效的方法，因此我们会在 `/etc/httpd/`\
    \ 目录下创建两个目录：\n\n- 1) sites-available\n- 2) sites-enabled\n\n`sites-available`\
    \ 目录存放主机文件，`sites-enabled` 目录将包含这两个文件的符号链接。这样当我们需要时，只需添加符号链接；当我们要禁用 VPS 时，只需删除符号链接。我们无需删除整个虚拟主机文件。\n\
    \n```bash\n=>sudo mkdir /etc/httpd/sites-available\n=>sudo mkdir /etc/httpd/sites-enabled\n\
    ```\n\n# 步骤 6\n\n现在我们编辑主 `httpd.conf` 文件，并包含 `sites-enabled` 链接中的所有配置文件。\n\n```bash\n\
    =>vim /etc/httpd/conf/httpd.conf\n=>IncludeOptional sites-enabled/*.conf\n```\n\
    \n但 `sites-enabled` 目录中目前还没有配置。让我们创建它。\n\n# 步骤 7\n\n```bash\n=>vim /etc/httpd/sites-available/first_site.conf\n\
    ```\n\n```apache\n<VirtualHost <ip>:80>\nServerName first_site.com\nDocumentRoot\
    \ /var/www/first_site.com/public\nErrorLog /var/www/first_site.com/error.log\n\
    </VirtualHost>\n```\n\n# 步骤 8\n\n```bash\n=>vim /etc/httpd/sites-available/second_site.conf\n\
    ```\n\n```apache\n<VirtualHost *:81>\n  ServerName second_site.com\n  DocumentRoot\
    \ /var/www/second_site.com/public\n  ErrorLog /var/www/second_site.com/error.log\n\
    </VirtualHost>\n```\n\n好了，现在我们可以创建指向 `sites-enabled` 的链接。\n\n# 步骤 9\n\n```bash\n\
    =>sudo ln -s /etc/httpd/sites-available/first_site.conf /etc/httpd/sites-enabled/first_site.conf\n\
    =>sudo ln -s /etc/httpd/sites-available/second_site.conf /etc/httpd/sites-enabled/second_site.conf\n\
    ```\n\n完成……让我们启动服务器。\n\n# 步骤 10\n\n进入 '/' 并重启服务器。\n\n```bash\n=>systemctl restart\
    \ httpd\n```\n\n"
