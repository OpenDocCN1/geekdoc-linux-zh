    # COCKPIT


    Cockpit 是一款免费开源系统监控应用程序，被认为一种基础基于 Web 的工具，用于监控和配置基本服务、系统健康状况并监控多台服务器及其性能。它允许你通过图形化界面启动/停止服务、生成诊断报告、管理用户、网络、VLAN
    以及多台服务器。你可以通过单一界面监控多台服务器。对于初级系统管理员来说，这是一个非常重要的工具，并让你监控系统的几乎一切。


    # 为 UBUNTU 服务器配置 COCKPIT


    # 步骤 1


    为你的 UBUNTU 系统分配静态 IP 地址 [你可以在 IP 地址部分找到]


