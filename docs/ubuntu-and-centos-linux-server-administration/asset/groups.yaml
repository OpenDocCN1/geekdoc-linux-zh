    \n**语法：**\ncal <month> <year>\n\n**命令名：clear**\n\n**描述：**\n清除屏幕\n\n**语法：**\n```\n\
    clear\n```\n\n**命令名：bc**\n\n**描述：**\n基础计算器\n\n**语法：**\n```\nbc\n```\n\n**命令名：mkdir**\n\
    \n**描述：**\n创建目录\n\n**语法：**\n```\nmkdir <directory> : 用于创建单个目录\nmkdir -p <directory>:\
    \ 用于创建递归目录\n```\n\n**命令名：rmdir**\n\n**描述：**\n删除空目录。你无法用此命令删除任何包含文件的目录\n\n**语法：**\n\
    rmdir <empty_directory>\n\n**命令名：file**\n\n**描述：**\n显示文件类型\n\n**语法：**\nfile <filename>\n\
    \n**命令名：ln**\n\n**描述：**\n创建文件名的链接。在硬链接的情况下，你删除主文件链接不会被删除；但在软链接的情况下，如果你删除主文件，链接的文件将被删除。\n\
    \n**语法：**\nln <option> <source_file> <shortcut_file>\n\n- ln -s : 用于创建软链接\n- ln\
    \ -P : 用于创建硬链接\n\n**命令名：history**\n\n**描述：**\n显示用户的命令历史，它将显示最后 100 条命令，你可以根据需要设置限制\n\
    \n**语法：**\nhistory\n\n**命令名：locate**\n\n**描述：**\n在整个系统中搜索该文件[你需要运行 `updateddb`\
