    # 城域网


    城域网（MAN）通过连接多个局域网（LAN）跨越整个园区。MAN 比 LAN 大，因为它由多个 LAN 组成。MAN 的工作方式更像互联网服务提供商（ISP），但它并不由单一组织所有。相反，MAN
    为所有用户提供共享的网络连接。


    # 广域网


    在大地理区域内的广域网称为 WAN。它是通过远距离连接不同的局域网创建的。其传输速度通常比 LAN 或 MAN 慢，但数据传输速率正在增加。


    # TCP/IP 协议族


    大多数互联网用户使用一种称为互联网协议族的协议族，也称为 TCP/IP 协议族。这两个协议是 TCP（传输控制协议）和 IP（网协议）。在这里，TCP 是一种面向连接的协议，意味着它按顺序传输数据并具有确认机制。如果没有收到确认，则数据将重新传输；它可以保证数据送达目标主机，而
    IP 则用于维护特定主机的地址。


    | OSI 参考模型 | TCP/IP 参考模型 |

    | --- | --- |

    | 表示层 | 传输层 |

    | 会话层 | 接口层 |

    | 传输层 | 网络层 |

    | 网络层 | |

    | 数据链路层 | |

    | 物理层 | |


    ![](img/b48bb5eea64d70d0c5160c63325a327c_65_0.png)


    # IP 地址


    IP 路由是网络技术中最重要的主题。IP 地址基本上是一个用于识别机器的数字标识符。IP 地址是软件地址而非硬件地址，这意味着它可以根据你连接的网络而改变。硬件地址是网卡地址（NIC
    地址），称为物理地址，它是无法更改的。


    ## IP 地址的重要元素


    **比特（Bit）：** 比特是 0 或 1 的一个数字。


    **字节（Byte）：** 由 8 位比特组成，是一个普通的 8 位二进制数。


    **网络地址（Network Address）：** 网络地址用于向网络发送数据包；例如 10.0.0.0、192.168.0.0 等。


    **广播地址（Broadcast Address）：** 主机用于向网络上的所有节点发送信息。地址如 192.168.0.255、172.166.255.255。


    每个 IP 地址都有两个不同部分：


    1) 网络部分

    2) 主机部分


    每个 IP 地址都提供了关于网络和主机的信息。


    # 子网掩码


    子网掩码是一个 32 位数，用于掩码 IP 地址并将 IP 地址划分为网络地址和主机地址。通过将所有网络位设置为“1”并将主机位设置为“0”来实现。


    留了两个主机 IP 地址用于特殊用途：“0”地址和“255”地址。“0”地址留给网络使用，因此如果任何 IP 地址的最后一个字节为“0”，则它就是网络地址。而“255”是广播地址，它们不能分配给主机。


    # 5 种 IP 地址：


    1) A 类 IP 地址

    2) B 类 IP 地址

    3) C 类 IP 地址

    4) D 类 IP 地址

    5) E 类 IP 地址


    # A 类 IP 地址：


    在 A 类 IP 地址中，第一个字节留作网络地址，其余三个字节用于主机。[它从 0.0.0.0 开始，到 127.255.255.255 结束]子网掩码：255.0.0.0。


    | 类 | 字节 1 | 字节 2 | 字节 3 | 字节 4 |

    |---|---|---|---|---|

    | A 类 | 网络 ID | | 主机 ID | |

    | B 类 | 网络 ID | | 主机 ID | |

    | C 类 | | 网络 ID | | 主机 ID |

    | D 类 | | 组播 | 地址 | |

    | E 类 | | | 预留 | |


    它具有包含大量主机的型网络。


    # B 类 IP 地址：


    在 B 类 IP 地址中，前两个字节留作网络地址，其余两个字节用于主机。网络多，主机少 [它从 128.0.0.0 开始，到 191.255.255.255
    结束]子网掩码：255.255.255.0。


    # C 类 IP 地址：


    C 类 IP 地址的前三个字节留作网络地址，剩余的一个字节用于主机。如果你需要大量的网络且每个网络中的主机数量较少，则使用 C 类 IP 地址。[它从 192.0.0.0
    开始，到 223.255.255.255 结束]子网掩码：255.255.255.0。


    # D 类 IP 地址：


    D 类 IP 地址是一种特殊地址。它被称为组播地址。它基本上用于寻找路由器 [它从 224.0.0.0 开始，到 239.255.255.255 结束]。


    # E 类 IP 地址：


    保留给实验用。


    # 私有 IP：


    私有地址在公网上不可路由。它们用于本地网络内部。NAT（网络地址转换）允许将私有 IP 映射到公共 IP。


    | 类 | 范围 | 子网掩码 |

    |---|---|---|

    | A | 10.0.0.0 - 10.255.255.255 | 255.0.0.0 |

    | B | 172.16.0.0 - 172.31.255.255 | 255.255.0.0 |

    | C | 192.168.0.0 - 192.168.255.255 | 255.255.255.0 |


    # 回环地址（Loopback）


    回环地址用于测试本地网络接口。通常是 127.0.0.1。


    # Ping


    Ping 用于测试节点之间的连通性。它使用 ICMP 请求和响应消息。


    # Traceroute


    Traceroute 用于查找数据到达目的地的路径。


    # 在 CentOS 7 中设置静态 IP


    ## 方法


    服务器都需要连接。没有静态 IP 就无法运行服务器。当你安装服务器时，通常通过 DHCP 获取 IP 地址。但要使用静态 IP 运行服务器，你需要进行配置。


    # 第一步


    你需要找到设置静态 IP 的网络接口。在我们的虚拟机中有两个接口。可以通过此命令查看接口：


    ```bash

    ifconfig

    ```

    或

    ```bash

    ip address show

    ```


    # 第二步


    使用 nmtui 命令，你必须拥有 root 权限执行此命令：


    ```bash

    sudo nmtui

    ```


    执行此命令后会出现此界面。从那里选择“编辑连接”。


    # 第三步


    它会显示所有接口。在本例中我们选择 eth1。


    ![](img/b48bb5eea64d70d0c5160c63325a327c_76_0.png)


    # 第四步


    我们选择 ipv4，从选项中选择“手动”并编辑菜单。


    ![](img/b48bb5eea64d70d0c5160c63325a327c_77_0.png)


    # 第五步


    输入 IP 地址。提供 CIDR 格式的子网掩码、网关和 DNS 地址，并点击确定。最后退出程序。在这个示例中使用了：


    IP 地址：192.168.0.10

    子网掩码：255.255.255.0

    网关：192.168.0.1

    DNS：8.8.8.8


    '
