    # INTRODUCTION


    An operating system is a software that runs on our computer. Handling all the
    instructions between a user and the computer hardware. But the operating system
    is not just one software, it also consists of a lot of other smaller programs
    that run on this operating system to help users to do their work. We run these
    smaller programs on top of this operating system to do everything.


    Linux is just another operating system. It''s a rock solid operating system. Linux
    works both as a server and desktop operating system.


    Linux operating system is great for a lot of reasons. Which are the following:


    # Tanvir Rahman


    - Multi user OS: Linux is a multi-user operating system. That means more than
    one user can work on a system at the same time.

    - multitasking OS: Linux is a multitasking operating system, you can run multiple
    programs at once. This allows the operating system to run several processes all
    at once.

    - Multi Platform OS: Linux can currently run on more than 24 types of platforms
    and 64-bit Intel-based personal computers. All variants of Apple Mac, Sun Spark,
    and iPod, even the Microsoft Xbox.

    - Interoperable OS: Linux can operate with most network protocols and also most
    languages; it can easily interact with Windows OS, NOVEL, UNIX and other operating
    systems that have a smaller market.

    - Scalable OS: Linux operating system has support for even Raspberry Pi which
    is a credit card-size computer to very powerful servers. Most of the servers in
    the world are running Linux OS. They have also run in low power computers.

    - Portable OS: Linux is a portable operating system. Linux is mostly written in
    C programming language. C is a language that is specially for writing operating
    system-level software. And it can be ported to run on a new computer.

    - Flexible OS: Linux operating system can be used to make a router, graphical
    workstation, home entertainment computer, file server, web server, mail server,
    cluster, just any computing purpose.

    - Stable: Linux kernel is very mature. For being stable, it is used for most of
    the servers in the world.

    - Efficient: The design of Linux enables you to include only the things you need,
    that''s why it can run on both Raspberry Pi and on a big server.

    - Free: Linux is a free operating system.

