    数据库是一种在计算机系统中以非常有组织的方式存储数据的应用程序。具有复杂设计的复杂数据可以很容易地存储在数据库应用程序中，几乎所有的 Web应用程序都使用某种数据库。数据库有不同类型：SQL、NoSQL
    数据库。SQL 数据库使用 SQL 来查询、更新、存储和删除数据。SQL 是用于管理数据库的语言。


