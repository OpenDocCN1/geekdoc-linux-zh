- md: '

    # MAN


    A metropolitan area network (MAN) spans an entire campus by connecting multiple
    LANs. MAN is larger than the LAN, because it consists of a number of LANs. MAN
    works like more of an ISP but it is not owned by a single organization. instead
    MAN provides a shared network connection to all its users.


    # WAN


    A wide area network (WAN) within a large scale of geographical area is called
    WAN. It is created by connecting different LANs from a long distance. And the
    transmission speed generally is slower than the LAN or MAN but the data transfer
    rate is increasing.


    # TCP/IP PROTOCOL SUITE


    A majority of the internet users use a protocol suite called Internet protocol
    suite which is also known as the TCP/IP protocol suite. The two protocols are
    TCP (Transmission Control Protocol) & IP (Internet Protocol). In here TCP is a
    connection-oriented protocol means it transmits data in a sequence and it has
    an acknowledgment process. If the acknowledgments are not received, then the data
    will be retransmitted; it can guarantee the delivery of the data to the host and
    IP is used to maintain the address of the specific host.


    | OSI Reference Model | TCP/IP Reference Model |

    | --- | --- |

    | Presentation | Transport |

    | Session | Internet |

    | Transport | Link |

    | Network | |

    | Datalink | |

    | Physical | |


    ![](img/b48bb5eea64d70d0c5160c63325a327c_65_0.png)


    # IP Addressing


    IP addressing is the most important topic in networking. IP address is basically
    a numeric identifier used to identify a Machine. IP address is a software address
    not a hardware address, which it means it can change depending on the network
    you are connected to. The hardware address is the NIC address that''s called the
    Physical address that cant be changed.


    ## Important Element of a IP address


    **Bit:** Bit is one digit either 0 or 1.


    **Byte:** made up with 8 bits, it''s just an ordinary 8-bit binary number.


    **Network Address:** Network address is used to send packets to the network; for
    example 10.0.0.0, 192.168.0.0, etc.


    **Broadcast Address:** It is used by the host to send information to all the nodes
    on a network. The addresses are like 192.168.0.255, 172.166.255.255.


    Every IP address there are two different parts:


    1) Network part

    2) Host Part


    Every IP address gives the information about the network and the hosts.


    # Subnet Mask


    A subnet mask is a 32-bit number that masks an IP address and divides the IP address
    into a network address and hosts address. It is done by setting all the network
    bits to ''1'' and setting hosts bit to ''0''.


    Two host IP addresses are reserved for special purpose: the ''0'' address and
    the ''255'' address. The ''0'' address is reserved for the Network, so if any
    IP address has a ''0'' on its last octet its the network address. And ''255''
    is the broadcast address, they cant assign to a host.


    # 5 types of IP address:


    1) class A IP address

    2) class B IP address

    3) class C IP address

    4) class D IP address

    5) class E IP address


    # Class A IP address:


    In class A IP address the first byte is reserved for the network address and three
    remaining bytes are for the hosts. [it starts with 0.0.0.0 and ends with 127.255.255.255]
    subnet mask: 255.0.0.0.


    | Class | Byte 1 | Byte 2 | Byte 3 | Byte 4 |

    |---|---|---|---|---|

    | Class A | NET ID | | HOST ID | |

    | Class B | NET ID | | HOST ID | |

    | Class C | | NET ID | | HOST ID |

    | Class D | | MULTICAST | ADDRESS | |

    | Class E | | | RESERVED | |


    It has a small network with a huge number of hosts.


    # Class B IP address:


    In class B IP address the first two bytes are reserved for the network address
    and two remaining bytes are for the hosts. More network, less hosts [it starts
    with 128.0.0.0 and ends with 191.255.255.255] subnet mask: 255.255.255.0.


    # Class C IP address:


    class C IP address the first three bytes are reserved for the network address
    and remaining one byte is for the hosts. If you need a lot of network and a small
    number of hosts in every network, class C IP address is used. [it starts with
    192.0.0.0 and ends with 223.255.255.255] subnet mask: 255.255.255.250.


    # Class D IP address:


    class D IP address is a special address. It is called a multicast address. It
    is basically used for finding routers [it starts with 224.0.0.0 and ends with
    239.255.255.255].


    # Class E IP address:


    Reserved for experimental.


    # Private IP:


    Private addresses are not routable on the public internet. They are used within
    local networks. NAT (Network Address Translation) allows a mapping of private
    IPs to a public IP.


    | Class | Range | Subnet Mask |

    |---|---|---|

    | A | 10.0.0.0 - 10.255.255.255 | 255.0.0.0 |

    | B | 172.16.0.0 - 172.31.255.255 | 255.255.0.0 |

    | C | 192.168.0.0 - 192.168.255.255 | 255.255.255.0 |


    # Loopback


    The loopback address is used to test the local network interface. It is usually
    127.0.0.1.


    # Ping


    Ping is used to test connectivity between two nodes. It uses ICMP echo request
    and reply messages.


    # Traceroute


    Traceroute is used to find the path data takes to reach a destination.


    # SETTING STATIC IP IN CENTOS 7


    ## EASY WAY


    Every server needs a connection. Without a static IP, you cant run a server. When
    you install a server, it usually gets an IP address from DHCP. But to run a server
    with a static IP, you need to configure it.


    # step 1


    You need to find the network interface that you give the static IP. In our virtual
    machine there are two interfaces. We can see the interface from this command:


    ```bash

    ifconfig

    ```

    or

    ```bash

    ip address show

    ```


    # step 2


    Use the nmtui command and you have to be root to give this command:


    ```bash

    sudo nmtui

    ```


    After giving this command this screen appears. From there select "Edit a connection".


    # step 3


    It will show you all the interfaces. In this case we will choose eth1.


    ![](img/b48bb5eea64d70d0c5160c63325a327c_76_0.png)


    # step 4


    We choose the ipv4 and from the option we choose ‘manual'' and Edit the menu.


    ![](img/b48bb5eea64d70d0c5160c63325a327c_77_0.png)


    # step 5


    We give the IP address. We have to give the subnet mask with CIDR notation, gateway
    and the DNS address, and click ok. Then quit the program. In this example we used:


    IP ADDRESS: 192.168.0.10

    SUBNET M: 255.255.255.0

    GATEWAY: 192.168.0.1

    DNS: 8.8.8.8

