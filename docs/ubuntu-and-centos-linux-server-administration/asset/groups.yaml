    root 24rc.. watchdog\nroot 26rc.. worker/u2:1\nroot 33rc.. kswap0\nroot 34rc..\
    \ ksmsd\nroot 35rc.. khugepage\nroot 36rc.. crypto\nroot 44rc.. throttled\nroot\
    \ 45rc.. kmpath_rdacad\nroot 46rc.. kaluad\n```\n\n[杀死进程]\n\n假设你想知道哪个进程正在使用特定的\
    \ file.txt。例如，创建一个 ping.txt 文件并存储 ping www.google.com 的输出\n\n```bash\n=>ping www.google.com\
    \ > ping.txt &\n```\n\n现在由 ping 命令创建的进程正在使用该文件，让我们用 fuser 命令检查一下\n\n=> fuser -v\
    \ ping.txt\n\n```bash\n[vagrant@localhost ~]$ ping 8.8.8.8 >ping.txt &\n[1] 4882\n\
    [vagrant@localhost ~]$ sudo fuser -v ping.txt\n               USER PID ACCESS\
    \ COMMAND\n/home/vagrant/ping.txt:\n               vagrant         4882 F....\
    \ ping\n[vagrant@localhost ~]$ |\n```\n\n用于列出进程号和进程的用户登录名。\n\n"
