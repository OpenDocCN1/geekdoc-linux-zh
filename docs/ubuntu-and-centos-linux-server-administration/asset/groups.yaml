    # ACCESS WEBMIN WITH FQDN


    We need to make a virtual hosting in our apache configuration to make the website
    accessible using the domain name.(method is giving in the apache web server confimation)


    suppose our domain name: example.com


    # STEP 1


    edit the configuration file =>vim /etc/apache2/sites-available/example.com


    # STEP 2


    add this configuration


    ```

    <VirtualHost *:80>

    ServerAdmin user.example.com

    ServerName example.com

    ProxyPass / http://localhost:10000/

    ProxyPassReverse http://localhost:10000/

    </VirtualHost>

    ```


    # STEP 3


    change the firewall rules'
- md: '

    =>sudo ufw allow from any to any port 10000 proto tcp


    # STEP 4


    change the ssl to avoid the secure connection

    =>vim /etc/webmin/miniserv.conf


    ssl=0


    # STEP 5


    Add this domain to the allowed domain

    =>vim /etc/webmin/config


    referers=example.com


    # STEP 6


    restart the webmin service and the httpd service to apply the change

    =>systemctl restart webmin

    =>systemctl restart apache2


    you can access the webmin with FQDN now


