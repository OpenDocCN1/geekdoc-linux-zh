    # WEBMIN


    Webmin 是一个基于 Web 的系统管理工具，你可以将 webmin 与基于 UNIX/LINUX 系统的 cockpit 进行比较，你可以完成每项管理任务，监控服务器、网络、防火墙、安全、身份验证过程，最重要的是带宽监控。和控制


    你可以使用带宽监控工具在不同的网络接口上控制带宽，这是一个控制服务器带宽的有用工具。


    要求：

    - 已安装 Apache web server

    - FQDN (Fully Qualified Name)

    - CentOS server

    - ubuntu server


    # 在 CENTOS 中配置 WEBMIN


    ### 第 1 步


    在 ''/etc/yum.repos.d/'' 创建仓库文件，因为不在 CentOS 官方仓库

    ```

    [webmin]

    baseurl = http://download.webmin.com/download/

    mirrorlist=http://download.webmin.com/download/

    enabled=1

    gpgcheck=0

    ```


    ### 第 2 步


    使用 yum 安装软件包

    yum install webmin


    ### 第 3 步


    安装成功后，它将向你显示进入 Web 界面的消息和 URL。现在可以使用 https://localhost:10000/ 以 root 身份登录。


    ### 第 4 步


    在 webmin 中以 root 用户密码登录


    硬件监控

    你可以在 webmin 页面中监控硬件负载


    # 登录和身份验证


    | 登录和身份验证选项 | |

    | :--- | :--- |

    | 允许密码登录？ | [x] 是 [ ] |

    | 允许空密码登录？ | [x] 是 [ ] |

    | 通过 root 登录？ | 是 |

    | 允许 RSA (1) 身份验证？ | [x] 是 [ ] |

    | 允许 RSA (2) 身份验证？ | [ ] 是 [ ] |

    | 检查密钥权限？ | [x] 是 [ ] |

    | 登录时显示/主机密钥？ | [x] 是 [ ] |

    | 忽略未知主机文件？ | [ ] 是 [ ] |

    | 登录前消息文件 | 无 |

    | 用户授权密钥文件 | 默认: (~ssh/authorized_keys) 位于目录 .ssh/authorized_keys |

    | 每个连接的最大登录次数 | 默认: (6) |

    | 使用挑战响应身份验证？ | [x] 是 [ ] |

    | 忽略 /hosts 文件？ | [x] 是 [ ] |


    # 在 UBUNTU 中配置 WEBMIN


    ### 第 1 步


    添加 gpg 密钥和仓库

    ```

    wget -qO- http://www.webmin.com/jameron-key.asc | sudo apt-key add

    ```

    ```

    sudo add-apt-repository "deb http://download.webmin.com/download/repository sarge
    contrib"

    ```


    ### 第 2 步


    使用 apt 命令安装软件包

    ```

    sudo apt install webmin

    ```


    ### 第 3 步


    安装成功后，它将向向你显示进入 Web 界面的消息和 URL。


    # 使用 FQDN 访问 WEBMIN


    我们需要在 Apache 配置中创建一个虚拟主机，以便可以使用域名访问网站。（方法在 Apache Web 服务器确认中给出）


    假设我们的域名是：example.com


    ### 第 1 步


    编辑配置文件 vim /etc/apache2/sites-available/example.com


    ### 第 2 步


    添加此配置


    ```

    <VirtualHost *:80>

    ServerAdmin user.example.com

    ServerName example.com

    ProxyPass / http://localhost:10000/

    ProxyPassReverse http://localhost:10000/

    </VirtualHost>

    ```


