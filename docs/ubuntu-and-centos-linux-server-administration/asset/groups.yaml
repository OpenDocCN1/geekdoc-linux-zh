    \ MINIX。他编写了作为 Linux Core 的内核。之后，许多开发者帮助他添加了更多功能和特性，当时 GNU 项目正在为计算机开发自由软件，为了创建一个操作系统，他们需要一个与硬件通信的功能性内核。他们采用了\
    \ Linux 内核并在内核之上添加了 GNU 软件，制作了 GNU/LINUX 操作系统。\n\nLinus Torvalds 仍然被视为 Linux 内核的独裁。他最终决定哪些特性将添加到\
