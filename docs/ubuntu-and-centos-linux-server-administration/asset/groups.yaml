- md: "\n[server]\nin the administration page go to\n\n[NETWORK SERVICES] -> [DNS]\
    \ -> [DNS ZONES] -> [ADD.ARPA] -> [ADD]\n\nRECORD NAME : 103 //because the last\
    \ number of ip is 103 [192.168.0.103]\n\nRECORD TYPE: PTR\n\nHOSTNAME: client\
    \ 1.it.local.\n\n[remember the (.) after the client.it.local in the hostname is\
    \ important]\n\nThat's all the server configuration now we have to configure the\
    \ client\n\n# CONFIGURE IPA CLIENT IN CENTOS\n\n# STEP 1\n\nsetting up a static\
    \ ip address for the server and the host. In this lab the client address\n\n```\n\
    IP: 192.168.0.103\nGATEWAY: 192.168.0.1\nDNS: 192.168.0.102 [SERVER ADDRESS]\n\
    ```\n\n[see the ip address section for the process of giving a static ip address]\n\
    \n# UBUNTU $ CENTOS ADMINISTRATOR\n\n# STEP 2\n\nsetting up hostname\n\n=>hostnamectl\
    \ set-hostname client 1.it.local\n\n# STEP 3\n\nedit the '/etc/hosts' file\n\n\
    =>vim /etc/hosts\n\n192.168.0.103 client 1.it.local client 1\n192.168.0.102 ipa.it.local\
    \ ipa\n\n# STEP 4\n\nrestart the NIC to take in effect\n\n=> nmcli device down\
    \ <NIC/device> / ifdown <NIC>\n=> nmcli device up <NIC/device> / ifup <NIC>\n\n\
    # STEP 5\n\ntest with ping\n\n=>ping client 1.it.local\n\n=>ping ipa.it.local\n\
    \n# STEP 6\n\ninstall ipa-client-packages\n=> yum install ipa-client\n\n# STEP\
    \ 7\n\ninstall ipa-client\n\n=>ipa-client-install [yes]\n\n- → authorize enroll\
    \ computer : admin\n- password : open12345\n=>authconfig -enablemkhomedir -update\n\
    \n[now logout from the session and login with the domain username and password\
    \ that is in the server by admin]\n\n# CONFIGURE NFS SERVER ON IPA\n\n# WHY INSTALL\
    \ NFS SERVER?\n\nbecause when you login from a computer with a domain user and\
    \ password and store some file in ipa server if you login with other computer,\
    \ you may login with domain user and password because of the central authentication\
    \ system(ipa) but you will not find the resources that you make on the other computer\
    \ with the same domain name, that means your data is not roaming. it stuck with\
    \ the pc that you use. so it fails to complete the central management cause our\
    \ target is no matter what ip client pc you are using you can login your domain\
    \ username and password and also you will get your file. you don't need to sit\
    \ in the same computer. To make that happen we make a nfs server\n\n# WHERE WE\
    \ INSTALL OUR NFS SERVER?\n\nyou can install the nfs server inside the IPA server,\
    \ but it is not\n\n# UBUNTU $ CENTOS ADMINISTRATOR\n\nrecommended . Although in\
    \ this example we use the ipa server as nfs server. you can install nfs server\
    \ at any active ipa client[for example you can install it on “client1()]. Basically\
    \ we choose a client which has a lot of space all the users resources will save\
    \ in the nfs server\n\n![](img/b48bb5eea64d70d0c5160c63325a327c_521_0.png)\n\n\
    Tanvir Rahman\n\n# NFS SERVER\n\n# STEP 1\n\nChoose the server we choose the ipa\
    \ server as a nfs server [ipa.it.local]\n\n# STEP 2\n\nInstall the nfs server\
    \ packages => sudo yum install nfs-utils\n\n# STEP 3\n\nEdit the file /etc/exports\
    \ =>vim /etc/exports\n\n```\n/home *(rw,sync)\n```\n\n# STEP 4\n\nstart the nfs\
    \ server =>systemctl enable nfs-server =>systemctl start nfs-server\n\n# STEP\
    \ 5\n\n# UBUNTU $ CENTOS ADMINISTRATOR\n\nstart the rpcbind\n1) systemctl enable\
    \ rpcbind\n2) systemctl start rpcbind\n\n# STEP 6\n\nadding firewall rules\n=>firewall-cmd\
    \ -permanent -add-service nfs\n=>firewall-cmd -reload\n\n# STEP 7\n\nsee the mounted\
    \ volume for nfs server\n=>showmount -e\n[if everything goes right you will see\
    \ the directory that is mounted ]\n\n# IPA CLIENT CONFIGURATION\n\n[you have to\
    \ configure the client1 again to sync data with nfs server ]\n\n# STEP 1\n\ninstall\
    \ the nfs utils packages\n=>sudo yum install nfs-utils\n\n# STEP 2\n\nedit /etc/auto.master\n\
    =>vim /etc/auto.master\n\nadd this line:\n\n/home /etc/auto.autofs\n\n# STEP 3\n\
    \ncreate /etc/auto.autofs\n=>vim /etc/auto.autofs\n\nadd this line:\n\nsyntax:\
    \ * <ipa_server>:/home/&\n*ipa:/home/&\n\n[ for example if the client1 is the\
    \ nfs server the command will be\n=>* client1:/home/&\nremember, not the whole\
    \ domain name just the client name is used ]\n\n# STEP 4\n\nstart the autofofs\n\
    \n=> systemctl enable autofofs\n=> systemctl start autofofs\n\nafter that you\
    \ can login with any ipa client with domain and password and you will find your\
    \ own resources\n\n# CONFIGURE SAMBA SERVER ON IPA\n\n_requirements :\n\n- 1)\
    \ Centos server , ip: 192.168.0.50\n- 2) client (ubuntu or centros), ip: 192.168.0.100\n\
    - 3) internet connection\n\n![](img/b48bb5eea64d70d0c5160c63325a327c_526_0.png)\n\
    \n# STEP 1\n\n1) Create two user 'smbuser1' and 'smbuser2' with the IPA server.\
    \ You can add it with the web interface or with the terminal. [this has to be\
    \ done with the IPA server]\n\nThe samba server have to be a client of the IPA\
    \ server . We make a client of the IPA server a samba server. And we have to add\
    \ user from the IPA server and also add this user as a samba client . All the\
    \ user creation is done by the IPA server. samba server will add the user as a\
    \ samba user while creating the server.\n\n# STEP 2\n\nupdate repository and install\
    \ the necessary samba packages\n\n```\n=> yum update -y\n=>yum install samba samba-client\
    \ samba-common\n```\n\n# STEP 3\n\nCreate a directory and give proper permission\
    \ for that user and group\n\n```\n=>mkdir /share\n=>chmod 777 /share\n```\n\n\
    # STEP 4\n\nwe have to add the user of the test group to the samba\n\n```\n=>smbpasswd\
    \ -a smuser1\n=>smbpasswd -a smuser2\n```\n\n# STEP 5\n\nConfigure SElinux .you\
    \ can either disable the SELinux or set the proper Boolean value and security\
    \ otherwise it will not let you connect to the server. In this we are not going\
    \ to disable SELinux we will change the Boolean value.\n\n```\n=> setsebool -P\
    \ samba_export_home on\n```\n\n# UBUNTU $ CENTOS ADMINISTRATOR\n\n```\n[root@localhost\
    \ ~]# setsebool -P samba_export_home on\n[root@localhost ~]# getsebool | grep\
    \ samba_export\nsamba_export_home off \nsamba_export_home on\n[root@localhost\
    \ ~]# semanage fcontext -t samba_share \"/share(/?\"\n[root@localhost ~]# restorecon\
    \ /share\n```\n\n# STEP 6\n\nwe have to change the firewall settings for allowing\
    \ the connection\n\n=>firewall-cmd --permanent --add-service=samba\n\n=>firewall-cmd\
    \ --reload\n\n```\n[root@localhost ~]# firewall-cmd --permanent --add-service=samba\n\
    success\n[root@localhost ~]# firewall-cmd --reload\nsuccess\n```\n\n# STEP 7\n\
    \nThis is the most important path of the part. we need to edit the configuration\
    \ of samba share\n\n```\n=> vim /etc/samba/smb.conf\n```\n\n[share]\ncomment=Directory\
    \ for samba\nbrowsable=yes\npath=/share\nwritable=no\nwrite list = smuser1\n\n\
    # STEP 7\n\nTest the configuration with the 'testparm' command. if there is any\
    \ error in the configuration this command will tell you\n\n```\n=>testparm\n```\n\
    \n# STEP 8\n\nrestart the samba server to make the change in effect\n\n=>systemctl\
    \ start smb\n\n=>systemctl start nmb\n\n```\n[root@localhost ~]# systemctl start\
    \ smb\n[root@localhost ~]# systemctl start nmb\n```\n\n# STEP 9\n\nwe have to\
    \ enable the smb and nmb service to make start on boot time\n\n=>systemctl enable\
    \ smb\n\n=>systemctl enable nmb\n\n```\n[root@localhost ~]# systemctl enable smb\n\
    Created symlink from /etc/systemd/system/multi-user.target.wants/smb.service to\
    \ /usr/lib/systemd/system/smb.service.\n[root@localhost ~]# systemctl enable nmb\n\
    Created symlink from /etc/systemd/system/multi-user.target.wants/nmb.service to\
    \ /usr/lib/systemd/system/nmb.service.\n```\n\n# STEP 10\n\nTest the connection\
    \ from the server\n\n=>smclient -L localhost -U smuser1\n"
  mdcn: "\n\n[server]\n在管理页面中转到\n\n[网络服务] -> [DNS] -> [DNS 区域] -> [ADD.ARPA] -> [添加]\n\
    \n记录名称：103 //因为 ip 的最后一位数字是 103 [192.168.0.103]\n\n记录类型：PTR\n\n主机名：client 1.it.local.\n\
    \n[记住主机名中 client.it.local 之后的后的点 (.) 是重要的]\n\n服务器配置现已完成，现在我们必须配置客户端\n\n# 在 CENTOS\
    \ 中配置 IPA 客户端\n\n# 步骤 1\n\n为服务器和主机设置静态 IP 地址。在本实验中，客户端地址为：\n\n```\nIP: 192.168.0.103\n\
    GATEWAY: 192.168.0.1\nDNS: 192.168.0.102 [服务器地址]\n```\n\n[查看 IP 地址部分以获取设置静态 IP\
    \ 地址的过程]\n\n# UBUNTU $ CENTOS 管理员\n\n# 步骤 2\n\n设置主机名\n\n=>hostnamectl set-hostname\
    \ client 1.it.local\n\n# 步骤 3\n\n编辑 '/etc/hosts' 文件\n\n=>vim /etc/hosts\n\n192.168.0.103\
    \ client 1.it.local client 1\n192.168.0.102 ipa.it.local ipa\n\n# 步骤 4\n\n重启网卡以生效\n\
    \n=> nmcli device down <NIC/device> / ifdown <NIC>\n=> nmcli device up <NIC/device>\
    \ / ifup <NIC>\n\n# 步骤 5\n\n使用 ping 进行测试\n\n=>ping client 1.it.local\n\n=>ping\
    \ ipa.it.local\n\n# 步骤 6\n\n安装 ipa-client-packages\n=> yum install ipa-client\n\
    \n# 步骤 7\n\n安装 ipa-client\n\n=>ipa-client-install [yes]\n\n- → 授权注册计算机：admin\n\
    - 密码：open12345\n=>authconfig -enablemkhomedir -update\n\n[现在注销会话，并使用管理员提供的提供的域用户名和密码登录]\n\
    \n# 在 IPA 上配置 NFS 服务器\n\n# 为什么要安装 NFS 服务器？\n\n因为当你使用域用户和密码登录计算机并在 IPA 服务器上存储某些文件时，如果你从另一台计算机登录，由于中央身份认证系统\
    \ (ipa)，你可能可以使用域用户名和密码登录，但你将找不到在具有相同域名的另一台计算机上创建的资源，这意味着你的数据不是漫游的。它被留在你使用的电脑上。因此，它无法完成集中管理，因为我们的目标是无论你使用哪个\
    \ IP 客户端电脑，都可以登录你的域用户名和密码，并获取你的文件。你不需要坐在同一台电脑前。为了实现这一点，我们制作了一个 NFS 服务器。\n\n# 我们在哪里安装\
    \ NFS 服务器？\n\n你可以将 NFS 服务器安装在 IPA 服务器内部，但这不是推荐\n\n# UBUNTU $ CENTOS 管理员\n\n推荐的做法。尽管在这个例子中我们使用\
    \ IPA 服务器作为 NFS 服务器。你可以在任何活跃的 IPA 客户端上安装 NFS 服务器[例如你可以将其安装在“client1”上]。基本上，我们选择一个空间较大的客户端，所有用户的资源都将保存在\
    \ NFS 服务器中。\n\n![](img/b48bb5eea64d70d0c5160c63325a327c_521_0.png)\n\nTanvir Rahman\n\
    \n# NFS 服务器\n\n# 步骤 1\n\n选择服务器，我们选择 IPA 服务器作为 NFS 服务器 [ipa.it.local]\n\n# 步骤 2\n\
    \n安装 NFS 服务器包 => sudo yum install nfs-utils\n\n# 步骤 3\n\n编辑文件 /etc/exports =>vim\
    \ /etc/exports\n\n```\n/home *(rw,sync)\n```\n\n# 步骤 4\n\n启动 NFS 服务器 =>systemctl\
    \ enable nfs-server =>systemctl start nfs-server\n\n# 步骤 5\n\n# UBUNTU $ CENTOS\
    \ 管理员\n\n启动 rpcbind\n1) systemctl enable rpcbind\n2) systemctl start rpcbind\n\
    \n# 步骤 6\n\n添加防火墙规则\n=>firewall-cmd -permanent -add-service nfs\n=>firewall-cmd\
    \ -reload\n\n# 步骤 7\n\n查看用于 NFS 服务器的挂载卷\n=>showmount -e\n[如果一切顺利，你将看到已挂载的目录]\n\
    \n# IPA 客户端配置\n\n[你必须再次配置 client1 以与 NFS 服务器同步数据]\n\n# 步骤 1\n\n安装 nfs utils 包\n\
    =>sudo yum install nfs-utils\n\n# 步骤 2\n\n编辑 /etc/auto.master\n=>vim /etc/auto.master\n\
    \n添加此行：\n\n/home /etc/auto.autofs\n\n# 步骤 3\n\n创建 /etc/auto.autofs\n=>vim /etc/auto.autofs\n\
    \n添加此行：\n\nsyntax: * <ipa_server>:/home/&\n*ipa:/home/&\n\n[例如，如果 client1 是 NFS\
    \ 服务器，命令将是\n=>* client1:/home/&\n记住，使用的不是整个域名，只是客户端名称]\n\n# 步骤 4\n\n启动 autofofs\n\
    \n=> systemctl enable autofofs\n=> systemctl start autofofs\n\n之后，你就可以使用域用户名和密码登录任何\
    \ IPA 客户端，并找到你自己的资源。\n\n# 在 IPA 上配置 SAMBA 服务器\n\n_要求：\n\n- 1) Centos 服务器，ip: 192.168.0.1\n\
    - 2) 域用户和密码\n- 3) 网络连接\n\n# UBUNTU $ CENTOS 管理员\n\n# 步骤 1\n\n配置 IPA 上的 Samba 服务器\n\
    \n# 步骤 2\n\n安装 samba 包\n\n```\n=>yum install -y samba-common\n```\n\n# 步骤 3\n\n\
    创建目录并赋予权限\n\n```\n=>mkdir /share\n=>chmod 777 /share\n```\n\n# 步骤 4\n\n添加用户\n\n\
    ```\n=>smbpasswd -a smuser1\n=>smbpasswd -a smuser2\n```\n\n# 步骤 5\n\n配置 SELinux\
    \ 否则它将不允许连接\n\n```\n=> setsebool -P samba_home\n```\n\n# UBUNTU $ CENTOS 管理员\n\
    \n```\n[root@localhost]# setsebool -P samba_home on\n[root@localhost]# getsebool\
    \ | grep samba_export\nsamba_export_home off \nsamba_export_home on\n[root@localhost]#\
    \ semanage fcontext -t samba_share \"/share(/?\"\n[root@localhost]# restorecon\
    \ /share\n```\n\n# 步骤 6\n\n更改防火墙设置允许连接\n\n=>firewall-cmd --permanent --add-service\
    \ samba\n\n=>firewall-cmd --reload\n\n```\n[root@localhost]# firewall-cmd --permanent\
    \ --add-service=samba\nsuccess\n[root@localhost]# firewall-cmd --reload\nsuccess\n\
    ```\n\n# 步骤 7\n\n这是最重要的部分。我们需要编辑 Samba 共享配置\n\n```\n=> vim /etc/samba/smb.conf\n\
    ```\n\n[share]\ncomment=Samba 目录\nbrowsable=yes\npath=/share\nwritable=no\nwrite\
    \ list = smuser1\n\n# 步骤 7\n\n使用 'testparm' 命令测试配置。如果配置有误，此命令将告诉你\n\n```\n=>testparm\n\
    ```\n\n# 步骤 8\n\n重启 Samba 服务器使更改生效\n\n=>systemctl start smb\n\n=>systemctl start\
    \ nmb\n\n```\n[root@localhost]# systemctl start smb\n[root@localhost]# systemctl\
