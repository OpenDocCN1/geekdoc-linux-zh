    # WHAT DOES IT DO


    It creates a database from the regular expression rules that finds from the config
    files.Once the database is created it is used to check the he intrigity of the
    files.It uses several message digest algorithm that are used to check the integrity
    of the file.and they can detect the version of files


    # FEATURES


    +   - supported message digest algorithms: md5, sha1, rmd160, tiger, crc32, sha256,
    sha512, whirlpool (additionally with libmhash: gost, haval, crc32b)

    - supported file attributes: File type, Permissions, Inode, Uid,id, Link name,
    Size, Block count, Number of links, Mtime, Ctime and Atime

    - support for Posix ACL, SELinux, XAttrs and Extended file system attributes if
    support is compiled in

    - plain text configuration files and database for simplicity

    - powerful regular expression support to selectively include or exclude files
    and directories to be monitored

    - gzip database compression if zlib support is'
