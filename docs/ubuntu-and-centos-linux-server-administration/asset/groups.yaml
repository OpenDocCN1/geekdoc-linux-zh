    # AIDE

    ADVANCE INTRUSION ENVIRONMENT


    Any person who have knowledge about IT knows that “No system is 100% secure”.In
    today’s IT world maintaining server security is one of the biggest challenge ,
    even the best available security is insufficient for the latest vulnerabilities
    in various products, and against malware/attacks created to target those vulnerabilities.
    While cyber-security cannot be 100 cent fool-proof, we can still try to achieve
    the maximum security possible. unauthorized intrusion in the system is one of
    the biggest problem ,detecting attackers and the unauthorized access to a server
    is one of the most important work for a server admin. Because having basic security
    only gives you the misleading feeling of being secure, rather than actual security.
    Modern attackers are experts who exploit software vulnerabilities by using technical
    tools, and devise methods to break into a network to achieve their goals. To handle
    smart attack attempts, an even smarter security mechanism is needed, Thats why
    checking system integrity and detecting intrusion is very important. For checking
    integrity in Linux server we use a packages called AIDE(Advance Intrusion Detection
    Environment).Its file and directory integrity'
