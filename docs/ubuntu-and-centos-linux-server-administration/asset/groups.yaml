    # CONFIGURE IPA

    SERVER IN UBUNTU


    ## STEP 1


    Setting up a static ip address for the server and the host


    In this lab the server address is:


    ```

    IP: 192.168.0.102

    GATEWAY: 192.168.0.1

    DNS: 8.8.8.8

    ```


    And the client address:


    ```

    IP: 192.168.0.103

    GATEWAY: 192.168.0.1

    DNS: 192.168.0.102 [SERVER ADDRESS]

    ```


    restart the connection to take effect:


    ```

    nmcli device down <NIC/device> / ifdown <NIC>

    nmcli device up <NIC/device> / ifup <NIC>

    ```


    [important note: if you give the client dns to the server address you have to
    install packages from local repository unless you have a second nic connected
    to the internet because in order to work online repository you need a public dns
    like 8.8.8.8 but if you use the local repo in the client its all fine]


    [see the ip address section for the process of giving a static ip address]


    ## STEP 2


    set a static host name of the server using `hostnamectl` command [server]


    ```

    => hostnamectl set-hostname "ipa.it.local"

    ```


    ```

    => exec bash

    ```


    ## STEP 3


    edit the "etc/hosts" of the server


    ```

    => vim /etc/hosts

    ```


    [add this line:

    ```

    192.168.0.102 ipa.it.local ipa

    192.168.0.103 client 1.it.local client 1

    ```


    ## STEP 4


    Test with ping command


    ```

    => ping ipa.it.local

    ```


    ## STEP 5


    update the server repository


    ```

    => apt update -y

    ```


    ## STEP 6


    (additional): reboot the system


    ```

    => reboot

    ```


    ## STEP 7


    install "rng-tools" packages in server machine

    rng-tools is basically used for cryptography

    => apt install rng-tools -y


    ## STEP 8


    configure rng-tools

    => vim /etc/default/rng-tools


    ### set the input source for random data by adding line


    ```

    HRNGDEVICE=/dev/random

    ```


    # Tanvir Rahman


    ## STEP 9


    Enable and start rng-tools


    ```

    => systemctl enable rng-tools

    => systemctl start rng-tools

    ```


    ## STEP 10


    install *free-Ipa* packages in server machine


    ```bash

    [server]

    => apt install freeipa-server -y

    ```


    It will prompt you with these options:


    Enter the Hostname for kerberos server

    ```

    => ipa.it.local

    ```


    ![](img/b48bb5eea64d70d0c5160c63325a327c_502_0.png)


    ## UBUNTU $ CENTOS ADMINISTRATOR


    Enter administrative server for kerberos realm

    => ipa.it.local


    ![](img/b48bb5eea64d70d0c5160c63325a327c_503_0.png)


    ## STEP 11


    Install IPA server in server machine


    [server]

    => ipa-server-install


    - 11-1: Do you want to configure integrated DNS

    => no

    - 11-2: Server Host name [ipa.test.system]

    =>> [Enter]

    - 11-3: Please confirm Domain name [test.system]


