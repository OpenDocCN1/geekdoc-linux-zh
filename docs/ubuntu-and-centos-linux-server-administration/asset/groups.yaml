    \ -s : 使连续的空行压缩\n- 12) less -N : 显示行号\n\n**命令名：strings**\n\n**描述：**\n显示文件的内容\n\
    \n**语法：**\nstrings <filename>\n\n**命令名：tree**\n\n**描述：**\n以树形格式显示目录\n\n**语法：**\n\
