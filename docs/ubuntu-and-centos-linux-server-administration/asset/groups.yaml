    -''T'' 表示已停止，可能是由作业控制信号停止

    -''D'' 表示不可中断的睡眠


    %CPU 上一个轮询周期（通常为 5 秒）使用的 CPU 数量


    %MEM 上一个轮询周期（通常为 5 秒）使用的内存量


    TIME 表示进程自启动以来使用的总 CPU 时间


