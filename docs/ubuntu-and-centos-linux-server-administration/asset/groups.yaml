    ## Tanvir Rahman


    The main advantage of the aptitude is when you run the aptitude program without
    any flag


    ```bash

    => aptitude

    ```


    this will open a menu-based installer inside the terminal. That means you will
    get almost a gui-based installer inside a terminal.


    ## Graphical Package management System:


    If you want to use a graphical Package management system you can use synaptic
    package management software. its very easy to install, remove, and upgrade packages
    with synaptic package management.


    ## Apt Repository


    when we install or search a package with apt command it will search some online
    repository for that packages. The list of that url is stored in a file ''/etc/apt/sources.list''
    and the file contained in ''/etc/apt/sources.list.d''


    if we see the ''sources.list'' file with this command


    ```bash

    => cat /etc/apt/sources.list

