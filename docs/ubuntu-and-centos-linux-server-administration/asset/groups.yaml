    \ Linux 系统都可以配置为支持匿名登录。ftp 服务器软件基于两点：\n\n- =>ftp 守护进程 (daemon)\n=>配置文件\n\n# UBUNTU\
    \ / CENTOS 管理员\n\ndaemon 是一个持续检查远程用户 ftp 请求的程序。当它收到请求时，它管理登录并为用户账户设置连接，为用户提供相应的目录。对于匿名\
    \ ftp 访问，ftp 守护进程允许远程用户使用 anonymous 作为用户名登录此服务器。为了安全起见，Linux 系统将相应的家目录设置为根目录，这样用户就无法访问计算机的其他文件和文件夹。用户只能看到其家目录，且用户只能看到其家目录（它将保持隐藏）。Linux\
    \ 系统有多个 ftp 服务器软件包，其中最流行的是 vsftpd 和 proftpd。proftpd 是一种基于 Apache Web 服务器设计的流行\
    \ ftp 守护进程，它配置简单并支持虚拟 FTP 主机。另一个在许多 Linux 发行版中预装的流行软件是 vsftpd（非常安全的 FTP 服务器）。它支持匿名\
