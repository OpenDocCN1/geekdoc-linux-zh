    将所有更改更改用户和组\n=>sudo chown -R ftpuser:ftpgroup /home/ftp/files\n为 ftp 用户授予只读权限，该目录不可被删除，并为\
    \ root 用户授予写入权限\n```\n=>sudo chmod 555 /home/ftp\n=>sudo chmod 775 /home/ftp/files\n\
    ```\n\n# 第 4 步\n\n=>/bin/systemctl restart vsftpd\n或\n=>service vsftpd restart\n\
