    \ command\n    command\n    ...\n    command;\npatn) command\n    command\n  \
    \  ...\n    command;\nesac\n```\n\nThe word value is successively compared against\
    \ pat1, pat2, ..., pat until a match is found. The commands that appear immediately\
    \ after the matching pattern are executed until a double semicolon (;) is encountered.\
    \ At that point, execution of the case is terminated.\n\nIf no pattern matches\
    \ value, none of the commands inside the case are executed. The pattern * matches\
    \ anything and is often used as the last pattern in a case as the \"catchall\"\
    \ case\n\nThe shell metacharacters * (zero or more characters), ? (match any single\
    \ character), and [...] (match any character enclosed between brackets) can be\
    \ used in patterns. The character | can be used to specify a logical OR of two\
    \ patterns, as in\n\n```\npat1|pat2\n```\n\nwhich means to match either pat1 or\
    \ pat2;\n\nExamples"
