  md: '# Chapter 14. Rolo Revisited


    IN THIS CHAPTER


    +   - Design Considerations

    - rolo

    - add

    - lu

    - display

    - rem

    - change

    - listall

    - Sample Output

    - Exercises


    This chapter presents a final version of the rolo program. This version is enhanced
    with additional options and also allows for more general types of entries (other
    than just names and numbers). The sections in this chapter discuss the individual
    programs in rolo, starting with rolo itself. At the end of this chapter, sample
    output is shown.


    # Design Considerations


    A more practical type of rolodex would permit more than just the names and numbers
    to be stored in the phone book. You''d probably want to keep addresses (maybe
    even electronic mail addresses) there as well. The new rolo program allows entries
    in the phone book to consist of multiple lines. For example, a typical entry might
    be


    > Steve''s Ice Cream

    444 6th Avenue

    New York City 10001

    212-555-3021


    To increase the flexibility of the program, we''re allowing an individual entry
    to contain as many lines as desired. So another entry in the phone book might
    read


    > YMCA

    (201) 555-2344


    To logically separate one entry from the inside phone book file, each entry is
    "packed" into a single line. This is done by replacing the terminating newline
    characters in each entry with a special character. We arbitrarily choose the caret
    ^. The only restriction here is that this character not used as part of the entry
    itself.


    Using this technique, the first entry would be stored in the phone book as


    > Steve''s Ice Cream "444 6th Avenue New York City 10001-212-555-3021"


