  md: '# Interactive and Nonstandard Shell Features


    Arithmetic performed on integer variables with the (...}) construct is slightly
    faster than on non-integer ones because the shell internally stores the value
    of an integer variable as a binary number and not as a character string.


    An integer variable cannot be assigned anything but an integer value or an integer
    expression. If you attempt to assign a noninteger to it, the message bad number
    is printed by the Korn shell:


    ```

    $ type -i i

    $ i=bad number

    ksh: i had bad number

    ```


    Bash simply ignores strings that do not contain numeric values and generates an
    error for anything that contains both numbers and other characters:


    ```

    $ typeet -i i

    $ i=ibello

    $ echo $i

    0

    $ i=hello

    bash: value too great for base (error token "ibello")

    $ i=85

    $ echo $i

    0

    ```


    The preceding example shows that integer-valued expressions can be assigned to
    an integer variable, without even having to use the({...}) construct. This holds
    true for both Bash and the Korn shell.


    # Numbers in Different Bases


    The Korn shell and Bash allow you to perform arithmetic in different bases. To
    write a number in a different base with these shells, you use the notation


    ```

    base#=number

    ```


    For example, to express the value 100 in base 8 (octal) you write


    ```

    8#100

    ```


    You can write constants in different bases anywhere an integer value is permitted.
    To assign octal 100 to the integer variable i, you can write


    ```

    $ typeet -i i=8#100

    $ echo $i

    100

    $ i=50

    $ echo $i

    80

    $ (( i = 16*a5 + 16*120 ))

    $ echo $i

    700

    ```


    Note that with the Korn shell the base of the first value assigned to an integer
    variable fixes the base of all subsequent substitutions of that. In other words,
    if the first value you assign to the variable i is an octal number, each time
    you subsequently substitute the value of i on the command line, the Korn shell
    substitutes the value as an octal number using the notation 8$ value.


