    Suppose you''re working on a proposal called sys.caps and the following command
    sequence is needed every time you want to print a new copy of the proposal:


    ```

    $ sys.caps | nroff -mm -Tlp | lp

    ```


    Once again, you can save yourself by simply placing this command sequence into
    a file—let it run—making it executable, and then just using the name whenever
    you want to get a new copy of the proposal:


    ```

    $ cat

    $ sys.caps | nroff -mm -Tlp | lp

    $ chmod +x run

    $ run

    request id is laserfi-15 (standard input)

    ```


    (The Request id message is issued by the lp command.) For the next example, suppose
    you want to write a shell program stats that prints the date and the time, the
