  md: '# Shell Summary


    # vi. Line Edit Mode


    The shell has a built-in implementation of the vi screen editor, scaled down to
    single lines. When vi mode is turned on, you are by default placed in a state
    similar to vi''s input mode. Commands can be typed just the same as when vi mode
    is off. At any time, however, you can press the Esc to be placed in edit mode.
    At this point, vi commands will be interpreted by the shell. The current command
    line can be edited, as any of the lines in the command history. Press Enter at
    any point in either command or input mode causes the command to be executed.


    Table 4.4 lists all the editing commands in vi mode: [count] is any integer and
    may be omitted.


    | Command | Meaning |

    | --- | --- |

    | erase | (Erase character, usually Ctrl+h or ;) delete previous character. |

    | Ctrl+w | Delete the previous blank-separated word. |

    | kill | (Line character, usually Ctrl+a or ;) delete the entire line. |

    | EOF | (End-of-line character, Ctrl+d) terminate the shell if the current line
    is empty.

    | characters may be entered in a command line or in a search string if preceded
    by a Ctrl+v.

    | Ctrl+v | Next character; editing characters and the erase and kill characters
    may be entered in a command line or in a search string if preceded by a Ctrl+v.

    | Enter | Execute the current line.

    | Esc | Enter edit mode. |


    # Input Mode Commands


    | Command | Meaning |

    | --- | --- |

    | [count] | Get previous command from history.

    | [count]- | Get previous command from history.

    | [count]+ | Get next command from history.

    | [count]* | Get the next command from history; the default is the oldest stored
