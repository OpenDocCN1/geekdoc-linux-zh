  md: '# Your Environment


    # PS1 and PS2


    The characters that the shell displays as command prompt are stored in the variable
    PS1. You can change this variable to be anything you want. As soon as you change
    it, it''ll be used by the shell from that point.


    ```

    $ echo PS1

    $ PS1=''\w''

    $ pwd

    /users/steve

    $ PS1=''await your next command, master:''

    Wed Sep 18 14:46:28 EDT 2002

    $ I await your next command, master: PS1=''$


    ```


    Your secondary command prompt, normally , is kept in the variable PS2, where you
    can change it to your heart content:


    ```

    $ echo PS2

    $ PS2=''\w''

    $ for x in 1 2 3

    doe

    =======

    echo $x

    =======\n1

    2

    3


    ```


    Like any other shell variables, after you log off the system, the values of those
    variables go with it. If you change it PS1, the shell will use the new value for
    the remainder of your login session. Next time you log in, however, you''ll get
    the old value again. You can make the change every time you log in, or you can
    have the change made automatically by adding it to your .profile file (discussed
    later in this chapter).


    # HOME, James


    Your home directory is where you''re placed whenever you log on to the system.
    A special shell variable called HOME is also automatically set whenever this directory
    you log on:


    ```

    $ echo HOME

    /users/steve


    ```


    This variable can be used by your programs to identify your home directory. It''s
    also used by the cd command whenever you type cd with no arguments:


    ```

    $ pwd                               Where am I?

    /usr/local/lib/libc/port/stdio

    $ cd

    $ pwd                               There''s no place like home

    /users/steve


    ```


    You can change your HOME variable to anything you want, but be warned that doing
    so may affect the operation of any programs that rely on:


