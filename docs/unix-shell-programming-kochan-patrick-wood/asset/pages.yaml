  md: '# Introduction


    This book assumes that you are familiar with the fundamentals of the Unix system;
    that is, that you know how to log in; how to create files, edit them, and remove
    them; how to work with directories. But in case you have not used Unix for a while,
    we will explain the basics in Chapter 2, "A Quick Review of Basics.\ Beyond the
    basic file commands, filename substitution, I/O redirection, and pipes are also
    reviewed in Chapter 2.


    Chapter 3, "What is the Shell?", reveals what that is really. You''ll learn every
    time you log in the system, how the shell program starts, how it parses the command
    line, and how it executes other programs for you. A key point in Chapter 3 is
    that the shell is just a program; nothing more, nothing less.


    Chapter 4, "Tools of the Trade", provides many useful tools in shell programming.
    You will learn to use cut, patch, grep, sort, and uniq. Admit it, the selection
    of it sets the stage for programs that you will develop throughout the remainder
    of the book. In Chapter 4 is a detailed discussion of regular expressions, which
    are used by many Unix commands such as sed, grep, and ed.


    Chapter 5 teaches you how to put the shell to work for writing programs. You''ll
    learn how to use your own commands; what variables are; make decisions; use the
    shell''s for, while, and until loops; and how to make the command read data from
    the terminal or from a file. Chapter 6, "Can I Quote You on That,? is devoted
    to a discussion on one of the most intriguing (and often confusing) aspects of
    the shell: why we interpret quotes.


    By this point, all the basic programming constructs in the shell will have been
    covered, and you will be able to write shell programs to solve your problems.


    Chapter 11, "Environment", covers a topic of great importance for a real understanding
    of how the shell operates; you''ll learn about local and environment variables;
    special variables such as HOME, PATH, and CPATH; and how to set up .profile file.


    Chapter 12, "More on Parameters," covers Chapter 13, "Loose Ends, tie up some
    loose ends, and Chapter 14, "Rololist," presents a final version of a file directory
    command called role that is developed throughout the book.


    Appendix A, "Summary," summarizes the features of the IEEE POSIX standard shell.


    Appendix B, "For More Information," lists references and resources, including
    the Web sites where different shells can be downloaded.


    The philosophy of this book is to teach by example. Chosen examples are more effective
    than many words. The "old picture" is worth... adage seems to apply just as well
    as examples. You are encouraged to type in each example and test it on your system,
    for by doing so you can become adept at shell programming. You should not be afraid
    to experiment. Changing commands in the program examples to see the effect, or
    add different options to make the programs more useful or robust.


    At the end of most chapters you will find exercises. These can be used as assignments
    in a classroom environment or by yourself to test your progress.


    This book teaches the IEEE POSIX standard shell. Incompatibilities with earlier
    Bourne shell versions are noted in the text, and these tend to be more.


