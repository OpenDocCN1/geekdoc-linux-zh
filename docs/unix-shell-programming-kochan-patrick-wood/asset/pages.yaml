    # The Login Shell


    A terminal is connected to a Unix system through a direct wire, modem, or network.
    In the first case, as soon as you turn on the terminal (and press the Enter key
    a couple of times if necessary), you should get a login: message on your screen.
    In the second case, you must first dial the computer''s number and get connected
    before the login: message appears. In the last case, you may connect over the
    network via a program such as ssh, telnet, login, or you may use some kind of
    networked windowing system (for example, X Window System) to start up a terminal
    emulation (for example, xterm).


    For each physical terminal port on a system, a program called getty will be active.
    This is depicted in Figure 3.2.


