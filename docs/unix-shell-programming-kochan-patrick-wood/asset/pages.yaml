    \  echo $x\n\n```\n\nThe real value of this construct is that it allows arithmetic\
    \ expressions to be used rather than test in if, while, and until commands. The\
    \ comparison operators set the exit status to a nonzero value if the result of\
    \ the comparison is false and to a zero value if the result is true. So\n\n```\n\
