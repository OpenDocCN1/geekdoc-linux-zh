    # Standard Input/Output and I/O Redirection


    # Standard Input and Output


    Most Unix system commands take input from your terminal and send the resulting
    output back to your terminal. A command normally reads its input from a place
    called standard input, which pens to your terminal by default. Similarly, a command
    normally writes its output to standard output, which is also your terminal by
    default. This concept is depicted in Figure 2.9.


    ![](img/f721b95d36c075f0637b85b379ede747_29_0.png)


    Recall that executing the who command results in the display of the currently
    logged-in users. More formally, the who command writes a list of the logged-in
    users to standard output. This is depicted in Figure 2.10.


    ![](img/f721b95d36c075f0637b85b379ede747_29_1.png)


    If a sort command is executed without a filename argument, the command takes its
    input from standard input. As with standard output, this is your terminal by default.


