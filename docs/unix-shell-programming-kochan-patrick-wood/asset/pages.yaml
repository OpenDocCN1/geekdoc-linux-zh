  md: '# What Is the Shell?


    We mentioned earlier that the shell searches the disk until it finds the program
    you want to execute and asks the Unix kernel to initiate its execution. This is
    true most of the time. However, there are some commands that the shell knows how
    to execute itself. These built-in commands include cd, pwd, and echo. So before
    the shell goes searching the disk for a command, the shell first determines whether
    it is a built-in command and if it is, the shell executes the command directly.


    # Variable and Filename Substitution


    Like any other programming language, the shell lets you assign values to variables.
    Whenever you specify one of these variables on the command line, preceded by a
    dollar sign, the shell substitutes the value assigned to the variable at that
    point. This topic is covered in detail in Chapter 5, "And Away We Go."


    The shell also performs filename substitution on the command line. In fact, the
    shell scans the command line looking for filename characters *, ?, or [...] before
    determining the name of the program to execute and its arguments. Suppose that
    your current directory contains the files as shown:


    ```

    $ ls

    mrs.todd

    progi

    shortcut

    sweeney $

    ```


    Now let''s use filename substitution for the echo command:


    ```

    $ echo * List all files

    mrs.todd progi shortcut sweeney $

    ```


    How many arguments do you think were passed to the echo command, one or four?
    Because we said that the shell is the one that performs the filename substitution,
    the answer is four. When the shell analyzes the line


    ```

    echo *

    ```


    it recognizes the special character * and substitutes on the command line names
    of all files in the current directory (it alphabetizes them for you):


    ```

    echo mrs.todd progi shortcut

    ```


    Then the shell determines the arguments to be passed to the command. As far as
    it''s concerned, four arguments were typed over the command line (see Figure 3.11).


    ![](img/f721b95d36c075f0637b85b379ede747_47_0.png)


