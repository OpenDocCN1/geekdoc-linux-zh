  md: '# Shell Summary


    The pipe symbol | be used to connect the standard output of one command to the
    standard input of another, as in


    ```

    who | wc -l

    ```


    The exit status is that of the last command in the pipeline. Placing a at the
    beginning of the pipeline causes the exit status of the pipeline to be the logical
    negation of the command in the pipeline.


    If the command sequence is terminated by an ampersand character (&),it runs asynchronously
    in the background. The shell displays the process id and job id of the command
    at the terminal.


    Typing of a command can continue to the next line if the last character on the
    line is a backslash (\).


    The characters && cause the command that follows to be executed only if the preceding
    command returns a zero exit status. The || cause the command that follows to be
    executed only if the preceding command returns a nonzero exit status. As an example,
    in


    ```

    who | grep "fred" >/dev/null echo "fred logged on

    ```


    the echo is executed only if the grep returns a zero exit status.


    # Comments


    If a word begins with the character #, the shell treats the remainder of the line
    as a comment and simply ignores it.


    # Parameters and Variables


    There are different "types" of parameters: shell variables, special parameters,
    and positional parameters.


    # Shell Variables


    A shell variable name must start with an alphabetic or underscore (_) character,
    and can be followed by any number of alphanumeric or underscore characters. Shell
    variables can be assigned values on the command line by writing:


    ```

    variable=value

    ```


    Filename substitution is not performed on value.


    # Positional Parameters


    Whenever a shell program is executed, the name of the program is assigned to the
    variable $0 and the arguments typed on the command line to the variables $1, $2,
    ..., respectively. Positional parameters can also be assigned values with the
    set command. Parameters 1 through 9 can be explicitly referenced. Parameters greater
    than nine must be enclosed inside braces, as in ${10).


    # Special Parameters


    Table A1 summarizes the special shell parameters.'
