  md: "# Shell Summary\n\n# The hash Command\n\nGeneral Format: hash commands\n\n\
    This command tells the shell to look for the specified commands and to remember\
    \ what directories they are located in. If *hash* is not specified, a list of\
    \ the hashed commands is displayed.\n\nIf the format\n\n```\nhash -r\n```\n\n\
    is used, the shell removes all commands from its hash list. Next time any command\
    \ is executed, the shell uses its normal search methods to find the command.\n\
    \nExamples\n\n```\nhash role whoq\nAdd role and whoq to hash list\nhash\nPrint\
    \ hash list\nhash -r\nRemove hash list\n```\n\n# The if Command\n\nGeneral Format:\n\
    \n```\nif command,\nthen\n    command\ncommand\n```\n\ncommand; is executed and\
    \ its exit status tested. If it is zero, the commands that follow up to the fi\
    \ are executed. Otherwise, the commands that follow up to the fi are skipped.\n\
    \nExample\n\n```\nif grep fsysnames > /dev/null\nthen\n    echo \"fsys is a valid\
    \ system name\"\nfi\n```\n\nIf the grep returns an exit status of zero (which\
    \ it will find $sys in the file fsysnames), the echo command is executed; otherwise\
    \ it is skipped.\n\nThe built-in command test is often used as the command following\
    \ if.\n\nExample\n\n```\nif [ $# -eq 0 ];\nthen\n    echo \"Usage: [-i] file...\"\
    \n    exit 1\nfi\n```\n\nAn else clause is added to the if to be executed if the\
    \ command returns a nonzero exit status. In this case, the general format of the\
    \ if becomes\n\n```\nelse command,\nthen\n    command\ncommand\nelse\n```\n\n\
    Unix® Shell Programming, Third Edition. Unix® Shell Programming, Third Edition,\
