    Here the shell supplies all the lines up to FOOB as the input to cat. It substitutes
    the value for HOME but not for foobar because it''s preceded by a backslash. The
    date command is also executed because back quotes are interpreted.


    ```

    $ cat <<FOOB

    > <<

    > SHONE

    > FOOB

    > \

    > date

    HOME

    $

    ```


    The backslash before FOOB tells the shell to leave the following lines alone.
    It ignores the dollar signs, backslashes, and back quotes.

    Use care when the word that follows the << is a dash (-), just make sure it''s
    weird enough so that the chances of it accidentally indenting the following lines
    are remote.

    If the first character that follows the << is a dash (-), leading tab characters
    in the input will be removed by the shell. This is useful for indenting the redirected
    text.


    ```

