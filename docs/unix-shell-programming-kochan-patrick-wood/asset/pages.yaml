  md: '# Chapter 6. Can I Quote You on That?


    IN THIS CHAPTER


    +   * The Single Quote

    * The Double Quote

    * The Backslash

    * Command Substitution

    * Exercises


    This chapter teaches you about a unique feature of the shell programming language:
    the way it interprets quote characters. Basically, the shell recognizes four different
    types of quote characters:


    +   * The single quote character ''''

    * The double quote character ""

    * The backslash character \

    * The back quote character `


    The first two and the last characters in the preceding list must occur in pairs,
    whereas the backslash character is unary in nature. Each of these quotes has a
    distinct meaning to the shell. We will cover them in separate sections of this
    chapter.


    # The Single Quote


    There are several reasons that you might need to use quotes in the shell. One
    of these is to keep characters otherwise separated by whitespaces characters.
    Let''s look at an example. Here''s a file phonebook that contains names and phone
    numbers:


    ```

    $ phonebook

    Alice Smith 973-555-2015

    Barbara Swingle 201-555-2257

    Liz Stern 212-555-2298

    Susan Goldberg 201-555-3776

    Susan Topple 212-555-4932

    Tony Iannino 973-555-1295

    ```


    To look up someone in our phonebook file—which has been kept small here for the
    sake of example

    —use grep:


    ```

    $ grep phonebook

    Alice Cheeba 973-555-2015

    $

    ```


    Look what happens when you look up Susan:


