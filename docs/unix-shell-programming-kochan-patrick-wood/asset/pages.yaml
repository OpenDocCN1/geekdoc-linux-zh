  md: '# A Quick Review of the Basics


    $ ln writeback

    Now instead of two copies of the file existing, only one exists with two different
    names: wb and writeback. The two files have been logically linked by the Unix
    system. As far as you''re concerned, it appears as though you have two different
    files. Executing an ls command shows the two files separately:


    ```

    $ ls

    collect

    mon

    wb

    writeback

    ```


    Look what happens when you execute an ls -1:


    ```

    $ ls -1

    total 5

    -EWK-KE-X steve 33725 358 Jun 25 13:31 collect

    -EWK-KE-X steve 33725 1219 Jun 25 13:31 mon

    -EWK-KE-X steve 33725 89 Jun 25 13:30 wb

    -EWK-KE-X steve 33725 89 Jun 25 13:30 writeback

    ```


    The number right before steve is 1 for collect and 2 for wb and writeback. The
    number is the number of links to a file, normally 1 for unlinked, directory files.
    Because wb and writeback are linked, there are 2 for these files. This implies
    that you can link to a file more than once.


    You can remove either of the two linked files at any, and the other will remain:


    ```

    $ rm writeback

    $ ls -1

    total 4

    -EWK-KE-X steve 33725 358 Jun 25 13:31 collect

    -EWK-KE-X steve 33725 1219 Jun 25 13:31 mon

    -EWK-KE-X steve 33725 89 Jun 25 13:30 writeback

    ```


    Note that the number of links goes from 2 to 1 because one of its links was removed.

    Most often, it is to use links for directories. For example, suppose pat wanted
    to access steve''s wb program. Instead of making a copy for himself (subject to
    the same problems described previously) or including steve''s programs in his
    PATH (described in detail in Chapter 11, ''Your Environment''), he can simply
    link to the file from his own program directory:


    ```

    $ ls -l

