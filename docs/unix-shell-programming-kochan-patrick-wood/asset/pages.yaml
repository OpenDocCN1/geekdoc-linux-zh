    # The shift Command


    The shift command allows you to effectively left shift your positional parameters.
    If you execute

    the command


    ```

    shift

    ```


    whatever was previously stored inside $2 will be assigned to $1, whatever was
    previously stored

    in $3 will be assigned to $2, and so on. The old value of $1 will be irretrievably
    lost.


    When this command is executed, $ (the number of arguments variable) is also automatically
    de-

    cremented by one.


    ```

    $t shift      Program to test the shift

    echo $t *

    shift

    echo $t *

    shift

    echo $t *

    shift

    echo $t *

    shift

    echo $t *

    shift

    echo $t *

    $t shift a b c d e

    5 a b c d e

    4 b c d e

