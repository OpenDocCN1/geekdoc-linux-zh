    # Functions


    Bash and the Shell both have function features not available in the POSIX standard
    shell.


    # Local Variables


    Bash and Shell functions can have local variables, making recursive functions
    possible. They are defined with the typeset command, as in


    ```

    typeset j

    ```


    After using the shell for a while, you may develop a set of functions that you
    like to use during your interactive work sessions. A good place to define such
    functions is inside your ENV file so that they be defined whenever you start up
    a new shell.


    # Automatically Loaded Functions


    The Shell allows you to set up a special variable called FPATH that is similar
    to your PATH variable. If you try to execute a function that is not yet defined,
    the Shell searches the colon-delimited list of directories in your FPATH variable
    for a file that matches the function name. If it finds such a file, it executes
    it in the current shell. Presumably, somewhere inside the file will be a definition
    for the specified function.


    # Integer Arithmetic


    Both Bash and the Shell support evaluating arithmetic expressions without arithmetic
    expansion. The syntax is $((...)) but without the dollar sign. Because expansion
    is not performed, the construct can be used without variable assignment or the
    colon operator:


