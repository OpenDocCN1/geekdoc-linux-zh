    # 218


    # The wait Command


    If you submit a command to the background for execution, command line runs in
    a subshell independent of your current shell (the job is said to run asynchronously).
    At times, you may want to wait for the background process (also known as a child
    process because it''s spawned from your current shell—the *parent*) to finish
    execution before proceeding. For example, you may have sent a large sort into
    the background and now want to wait for the sort to finish because you need to
    use the sorted data.


    The *wait* command is for such purpose. Its general format is


    ```

    wait process-id


    process-id is the process number of the process you want to wait for. If omitted,
    the shell waits for all processes to complete. Execution of your current shell
    will be suspended until the process or processes finish. You can try the wait
    command at your terminal:


    # sort big-data > sorted_data &

    # [3452]

    $ date

    # Oct 2 15:05:42 EDT 2002

    $ wait 3453

    ```


    ![](img/f721b95d36c075f0637b85b379ede747_223_0.png)


    # The $ Variable


    If you have only one process running in the background, then wait with no argument
    suffices. However, if you''re running more than one command in the background
    and you want to wait on a particular one, you can take advantage of the fact that
    the shell stores the process id of the last command executed in the background
    inside the special variable $. So the command is


    ```

    wait $$


    waits for the last process you sent to the background to complete execution. As
    mentioned, if you send several commands to the background, you can save the value
    of this variable for later use with:


    # prog1

    pid1=$!


    # prog2

    pid2=$!


    wait $pid1

    # wait for prog1 to finish

    nwait $pid2

    # wait for prog2 to finish

    ```


    # The trap Command


    When you press the *Delete* or Break key at your terminal during execution of
    a shell program, normally that program is immediately terminated, and your command
    prompt returned. This may not always be desirable. For instance, you may end up
    leaving a bunch of temporary files that you haven''t cleaned up.


    > Some Unix systems use Ctrl+c rather than the Delete key for this purpose. You
    can determine which sequence is used with the st command.


