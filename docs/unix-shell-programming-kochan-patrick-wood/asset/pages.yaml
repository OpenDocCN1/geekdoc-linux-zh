  md: '# Tools of the Trade


    # cut


    This section teaches you about a useful command known as cut. This command comes
    in handy when you need to extract (that is, "cut out") various fields of data
    from a data file or the output of a command. The general format of the cut command
    is


    ```

    cut [-chars] file

    ```


    where chars specifies what characters you want to extract from each line of file.
    This can consist of a single number, as in -c5 to extract 5, a comma-separated
    list of numbers, as in -c1,13,50 to extract characters 1, 13, and 50; or a dash-separated
    range of numbers, as in -c20-50 to extract characters 20 through 50, inclusive.
    To extract characters to the end of the line, you can omit the second number of
    the range;


    ```

    cut -c-5 data

    ```


    extracts 5 characters through the end of the line from each line and writes the
    results to standard output.


    If file is not specified, cut reads its input from standard input, meaning that
    you can use cut as a filter in the pipeline.


    Let''s take another look at the output from the:


    ```

    $ who

    root    console Feb 24 08:54

    steve   tty02 Feb 24 12:55

    george  tty08 Feb 24 05:15

    dawn    tty10 Feb 24 13:35

    ```


    As shown, four people are logged in. Suppose that you want to know the names of
    the logged-users and don''t care what terminals they are or when they were logged
    in. You can use the cut command to cut out the usernames from the who command''s
    output:


    ```

    $ who cut -c-8 Extract the first 8 characters

    root

    steve

    george

    dawn

    $

    ```


    The -c-8 option to cut specifies that characters 1 through 8 are to be extracted
    from each line of input and written to standard output.


    The following shows how you can tack a sort to the end of the preceding pipeline
    to get a sorted list of the logged-in:


    ```

    $ who cut -c-8 | sort

    dawn

    george

    root

    steve

    $

    ```


    If you wanted to see what terminals were currently being used, you could cut out
    just the tty numbers from the who command''s output:


