    Barbara Swangle

    Jeff Goldberg

    Liz Stearns

    Susan Goldberg

    Tony Iannino

    ```


    Much better! Recall that you don''t have to specify the delimiter character with
    the -d option because cut assumes a tab character is the delimiter by default.


    But how do you know whether fields are delimited by blanks or tabs? One way to
    find out is by trial and error as shown previously. Another way is to type the
    command


    ```

    $ - -n file

    ```


    at your terminal. If a tab character separates the fields, t will be displayed
    instead of the tab:


    ```

    $ cat -n 1 phonebook

