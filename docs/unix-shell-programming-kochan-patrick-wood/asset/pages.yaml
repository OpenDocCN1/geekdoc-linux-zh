    writes the last 20 commands to standard output, not preceded by line numbers (-n).
    Suppose that you''ve just executed a long command line and decide that it would
    be nice to turn that command into a shell program called runx.. You can use fc
    to get the command from your history and/or redirection to turn that command into
    a:


    ```

    $ fc -n -1 > runx

    ```


    (That''s the letter 1 followed by the number -1.) fc is described in full detail
    in Appendix A.


    # The r Command


    A simple Korn shell command allows you to re-execute previous commands using even
    a fewer number of keystrokes than described. If you simply type in the r command,
    the Korn shell reexecutes your last command:


    ```

    $ date

    Thu Oct 24 14:24:48 BST 2002

    r$ Re-execute previous command

    date

    Thu Oct 24 14:25:13 BST 2002

    ```


    When you type in the r command, the Korn shell redisays the previous command and
    then immediately executes it.


    ```

    $ cat docs/planA

    $pwd

    /users/steve

    $r cat Rerun last cat command

    cat docs/planA

    $

    ```


    Once again, the Korn shell redisplays the command line from its history before
    automatically executing it.


    The final form of the command allows you to substitute the first occurrence of
    one string with the next. To re-execute the last cat command on the file planB
    instead of planA, you could:


    ```

    $ r cat planA-planB

    cat docs/planB

    $

    ```


    or even more simply, you could have typed:


    ```

    $ r cat A-B

    cat docs/planB

    $

    ```


    Bash has the built-in command; !! re-executes the previous command, and ! string
    re-executes the most recent command line from your history that begins with string:


