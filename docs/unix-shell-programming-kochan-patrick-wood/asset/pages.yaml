  md: '# And Away We Go


    There''s a lot to be learned from this small example. Was the list of files stored
    into the variable x when


    ```

    x="*"

    ```


    was executed, or did the shell do the the substitution when


    ```

    echo $*

    ```


    was executed?


    The answer is that the shell does not perform filename substitution when assigning
    values to variables. Therefore,


    ```

    x="*"

    ```


    assigns the single character * to x. This means that the shell did the filename
    substitution when executing the echo command. In fact, the precise sequence of
    steps that occurred when


    ```

    echo $*

    ```


    was executed as follows:


    +   1. The shell scanned the line, substituting * as the value of x.

    2. The shell rescanned the line, encountered the *, and then substituted the names
    of all files in the current directory.

    3. The shell initiated execution of echo, passing the file list as arguments (see
    Figure 5.3).


