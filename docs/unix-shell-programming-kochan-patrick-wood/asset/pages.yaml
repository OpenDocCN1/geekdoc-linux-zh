    \ the two commands previously to ensure\nt the sed succeeded as planned.\n\nIf\
    \ your text included more than one occurrence of 'Unix' on a line, the preceding\
    \ **sed** would\nchanged just the first occurrence on each line to 'UNIX'. By\
    \ appending the *global* option g to\nthe end of the s command, you can ensure\
    \ that multiple occurrences of the string on a line will be\nchanged. In this\
    \ case, the **sed command** would\n\n```\n$ sed 's/Unix/UNIX/g' > intro > temp\n\
