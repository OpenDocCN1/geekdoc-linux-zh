  md: '# More on Parameters


    ```

    $ echo ''IFS'' | ed -b

    000000 040 011 012 012

    000004

    ```


    The first column of numbers shown is the relative offset from the start of the
    input. The following numbers are the oct equivalents of the characters read by
    od. The first number is 040, which is the ASCII value of the space character.
    It is followed by 011, the tab character, and then by 012, the newline character.
    The next character is another newline; this was written by the echo. These characters
    for IFS come as no surprise; the ''whitespace'' characters we''ve talked about
    throughout the book.


    You can change the IFS to any character or characters you want. This is useful
    when you want to parse a line of data fields are not delimited by normal whitespace
    characters. For example, we note that the shell strips any whitespace characters
    from the beginning of any line you read with the command. You can change your
    IFS to just a newline before the read is executed, which has the effect of preserving
    the leading whitespace (because the shell won''t consider it a delimiter):


    ```

    $ read line                Try it the "old" way

    $ echo ''$Line''

    $ Here''s a line

    $ IFS=-

    Set to just a newline

    $ read line                Try it again

    $ Here''s a line

    $ echo ''$Line''            Leading spaces preserved

    ```


    To change the IFS to just a newline, an open quote was typed, followed by the
    pressing of the Enter key, followed by the closed quote on the next line. No additional
    characters can be typed inside those quotes because they''re stored inside IFS
    and then used by the shell.


    Now let''s change the IFS to something more visible, like a colon:


    ```

    $ IFS=

    $ read x y z

    123:345:678

    $ echo $x

    123

    $ echo $y

    678

    $ list=one:two:three

    $ for x in $list; do echo $x;

    done

    two

    tree

    $ var=a:b:c

    $ echo $var

    abc

    ```


    Because the IFS was changed to a colon, when the line was read, the shell divided
    the line into two words: 123, 345, and 678, which were stored into the three variables
    x, y, and z, respectively. In the next to example, the shell used IFS when substituting
    a value of list in for loop. The last example shows that the shell doesn''t use
    the IFS when performing variable assignment.


    Changing the IFS is often in conjunction with execution of the set command:


