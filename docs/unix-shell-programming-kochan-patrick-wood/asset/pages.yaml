    characters, such as *, |, and \ , are ignored. If you have dollar signs, back
    quotes, or backslashes in these lines that you don''t want interpreted by the
    shell, you can precede them with a backslash character. Alternatively, if you
    want the shell to leave the input lines completely untouched, you can precede
    the word that follows the << with a backslash.

    ```


