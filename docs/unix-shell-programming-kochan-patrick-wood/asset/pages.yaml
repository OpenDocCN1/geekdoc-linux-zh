    Unless you already know where this discussion is leading, you are likely to get
    the preceding results. Whenever you type the name of a program to execute, the
    shell searches a list of directories until it finds the executable. When found,
    it initiates its execution. This list of directories is contained in a special
    shell variable called PATH. This variable is automatically set for you when you
    log on the system. Here is what we''ve set to:


    ```

    $ echo PATH

    /bin:/usr/bin

    ```


    Chances that your PATH has a slightly different value. As noted, the PATH specifies
    the directories that are separated from one another by colons (:). In the preceding
    example, three directories are: /bin, /usr/bin, and . (which, you''ll recall,
    stands for the current directory). Whenever you type the name of a program, say
    for example rolo, the shell searches the directories listed in PATH from left
    to right until it finds an executable file called. It first looks in /bin, then
    in /usr/bin, and finally in the current directory for an executable file called
    rolo. As soon as it finds rolo, the shell executes it; if the shell doesn''t find
    it, the shell issues a "not found" message.


    The path


    ```

    /bin:/usr/bin

    ```


    > Actually, the shell is a bit more intelligent, it keeps track of where it finds
    each command you execute. When you re-execute one of these commands, the shell
    remembers where it was found and doesn''t go searching for it again. This feature
    is known as hashing.


