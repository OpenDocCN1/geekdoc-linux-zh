  md: "# Round and Round She Goes\n\n```\nfor i in 1 2 3\ndo  echo $i\ndone\n```\n\
    \nTo try it out, you can type this in directly at the terminal, just like any\
    \ other shell command:\n\n```\nfor i in 1 2 3\n> do\n  echo $i\n> done\n```\n\n\
    While the shell is waiting for the done to be typed to close off the for command,\
    \ it displays its secondary command prompt. When it gets done, the shell proceeds\
    \ to execute the loop. Because three words are listed after the in (1,2, 3), the\
    \ body of the loop—in this case a single echo command—will be executed a total\
    \ of three times.\n\nThe first time through the loop, the first word in the list,\
    \ 1, is assigned to the variable 1. Then the body of the loop is executed. The\
    \ next word in the list, 2, is assigned to 1 and the echo command re-executed,\
    \ in the display of 2 at the terminal. The third word in the list, 3, is assigned\
    \ to the third time through the loop and the echo command executed. This results\
    \ in 3 being displayed at the terminal. At this point, no more words are in the\
    \ list so the loop is complete, and the shell displays your command prompt to\
    \ let you know it's done.\n\nRecall the run command from Chapter 7, \"Passing\
    \ Arguments,\" that enabled you to run a file through tbl, nor ip:\n\n```\ncat\
    \ run\ntbl $1 | mroff - $1 | ip\n```\n\nIf you wanted to run the files memo memo2\
    \ memo4 through this program, you could type the following at the terminal:\n\n\
    ```\nfor file in memo1 memo2 memo3 memo4\n> do\n  run $file\ndone\nrequest id\
    \ is laseri-33 (standard input)\nrequest id is laseri-34 (standard input)\nrequest\
    \ id is laseri-35 (standard input)\nrequest id is laseri-36 (standard input)$\n\
    ```\n\nThe four words memo1, memo2, memo3, and memo4 will be assigned to the variable\
    \ i in order, and the run program will be executed with the value of this variable\
    \ as the argument. Execution will be just as you typed in the following commands:\n\
    \n```\nrun memo1\nrequest id is laseri-33 (standard input)\nrun memo2\nrequest\
    \ id is laseri-34 (standard input)\nrun memo3\nrequest id is laseri-35 (standard\
    \ input)\nrun memo4\nrequest id is laseri-36 (standard input)$\n```\n\nUnix Shell\
    \ Programming. Third Edition. Unix Shell Programming, Third Edition, ISBN: 0-672-32490-3\n\
    Prepared for students@openpress.com. This download file is for personal use only\
    \ and is subject to the Terms of Service. Any other use requires prior written\
