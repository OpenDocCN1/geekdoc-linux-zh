    ```

    $ ls -1

    total 2

    drwxr-xr-x 2 steve DP3725 80 Jun 25 13:27 documents

    drwxr-xr-x 2 steve DP3725 96 Jun 25 13:31 programs

    ```


    The first line of the display is a count of the total blocks (1,024 bytes) of
    storage that the listed files use. Each successive line displays the ls -1 command
    contained detailed information about a file in the directory. The first character
    on each line tells whether it is a directory. If the character is d, it is a directory;
    if it is -, it is an ordinary file; if it is b, c, l, or p, it is a special file.


    The next nine characters on the line tell every user on the system how to access
    the particular file. These access modes apply to the file''s owner (the first
    three characters), others in the same group as the file owner (the next three
    characters), and finally to all users on the system (the last three). They tell
    whether the user can read the file, write to the file, or execute the contents
    of the file.


    The ls -1 command lists the link count (see "Linking Files: The In Command," later
    in this chapter), the owner of the file, the group owner of the file, how large
    the file is (that is, how many characters are contained in it), and when the file
    was last modified. The information displayed last on the line is the filename
    itself.


    ```

    $ ls -l

    total 2

    drwxr-xr-x 2 steve DP3725 358 Jun 25 13:31 collect

    drwxr-xr-x 2 steve DP3725 1219 Jun 25 13:31 mon

    drwxr-xr-x 1 steve DP3725 89 Jun 25 13:30 wb

    $

    ```


    The dash in the column of each line indicates that the three files collect, mon,
    and wb are ordinary files and not directories.


    # Creating a Directory: mkdir


    To create a directory, the mkdir command must be used. The argument to this command
    is simply the name of the directory you want to make. For example, assume that
    you are still working with the directory structure depicted in Figure 2.7 and
    that you want to create a new directory called misc on the same level as the documents
    and programs. If you were currently in your home directory, typing the command
    mkdir misc would achieve the desired effect:


    ```

    $ mkdir misc

    ```


    Now if you execute an ls command, you should get the new directory listed:


    ```

    $ ls

    documents

    misc

    programs

    $

    ```


    The directory structure now appears as shown in Figure 2.8.


