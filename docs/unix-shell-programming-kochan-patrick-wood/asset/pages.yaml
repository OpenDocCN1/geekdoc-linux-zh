  md: '# Your Environment


    Here''s another example. This program is called vartest2:


    ```

    $ cat vartest2

    echo x=50

    echo fx:

    $ x=100

    Execute it

    $vartest2

    :

    ```


    Now the question is: What''s the value of x?


    ```

    $ echo fx

    100

    $

    ```


    So you see that vartest2 didn''t change the value of x that you set to 100 in
    your login shell.


    # Subshells


    The behavior exhibited by vartest and vartest2 is due to the fact that these two
    programs are run as subshells by your login shell. A subshell is, for all intents
    and purposes, an entirely new shell executed by your login shell to run the desired
    program. When you ask your login shell to execute vartest, it starts up a new
    shell to execute the program. Whenever a new shell runs, it runs in its own environment,
    with assigned values by the login shell (the ''parent'' shell). A subshell has
    no knowledge of local variables that were assigned values a subshell cannot change
    the value of a variable in the parent shell, as evidenced by vartest2.


    Let''s review the process that goes on. Before executing vartest2, your login
    shell has a variable called x that has been assigned the value 100 (assume for
    now that this is the only variable in the shell). This is depicted in Figure 11.1.


    ![](img/f721b95d36c075f0637b85b379ede747_182_0.png)


    Figure 11.1. Login shell with x=100.


    When you ask to have vartest2 executed, your login shell starts up a subshell
    to run it, giving it an empty list of local variables to start with (see Figure
    11.2).


