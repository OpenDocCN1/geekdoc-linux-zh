  md: '# Decisions, Decisions


    # The Logical Negation Operator


    The unary logical negation operator can be placed in front of any other test expression
    to negate the result of the evaluation of that expression. For example,


    ```

    [ -r /users/steve/phonebook ]

    ```


    returns a zero exit status (true) if /users/steve/phonebook is not readable; and


    ```

    [ -f "mailfile" ]

    ```


    returns true if the file specified by $mailfile does not exist or is not an ordinary
    file. Finally,


    ```

    [ $x1 != "$x2" ]

    ```


    returns true if $x1 is not identical to $x2 and is obviously equivalent to


    ```

    [ $x1 = "$x2" ]

    ```


    # The Logical AND Operator -a


    The operator -a performs a logical AND of two expressions and returns true only
    if the two joined expressions are true. So


    ```

    [ -f "mailfile" -a r "mailfile" ]

    ```


    returns true if the file specified by $mailfile is an ordinary file and is readable
    by you. An extra space was placed around the -a operator to aid the expression''s
    readability and has no effect on its execution.


    The command


    ```

    [ "count" -ge 0 -a "count" -lt 10 ]

    ```


    will be true if the variable $count contains an integer value greater than equal
    to zero but less than 10. The -a operator has lower precedence than the integer
    comparison operators (and the string and file operators, for that matter), meaning
    that the preceding expression gets evaluated as


    ```

    [ ("count" -ge 0) -a ("count" -lt 10 )

    ```


    as you would expect.


    # Parentheses


    Incidentally, you can use parentheses in a test expression to alter the order
    of evaluation; just make sure that the parentheses are quoted because they have
    a special meaning to the shell. So to translate the preceding example into a test
    command, you would write


    ```

    [ \[("count" -ge 0\) -a \[("count" -lt 10\) ]

    ```


    As is typical, spaces must surround the parentheses because test expects to see
    them as separate arguments.'
