    # Your .profile File


    In Chapter 3, "What is the Shell?", you learned the login sequence. This sequence
    is completed when your shell executes your command and waits for you to type your
    first command. Just before it does, however, login shell executes two special
    files on the system. The first is /etc/profile. This file is set up by the system
    administrator and usually does things like checking whether you have mail (Where
    do you think "You have mail." message comes from?), setting your default file
    creation (your umask), assigning values to standard exported variables, and ensuring
    that the administrator has executed executed when you log in.


    The second file that gets automatically executed is .profile in your home directory.
    Your system administrator may have given you a default .profile file when you
    got your account. See what is in it:


    ![](img/f721b95d36c075f0637b85b379ede747_203_0.png)


    ```

    $ SHELL/.profile

    PATH=$HOME/bin:/usr/bin:/usr/sbin:$PATH

    export PATH

    ```


    Here you see a .profile file that simply sets the PATH and exports it.


    You can change your .profile file to include any commands that you wanted whenever
    you log in. You can put commands in your .profile file that override settings
    (usually environment variables) made in /etc/profile. Note that the commands in
    /etc/profile and .profile are executed by your login shell (as if you typed


    ```

    $ /etc/profile

    $ .profile

    ```


    as soon as you log in), which makes changes to your environment remain after the
    programs are executed.


    Here''s a sample .profile that sets your PATH to include your own bin, sets your
    CDPATH, changes your primary and secondary command prompts, changes your erase
    character to a backspace (CtrlH), and prints a friendly message with the greetings
    program from Chapter 8 ("Decisions, Decisions")


    ```

    $ HOME/.profile

    PATH=$HOME/bin:/usr/bin:/usr/bin::

    CDPATH=$HOME:$HOME/documents

    PS1=""

    PS2=""

    export PATH CDPATH PS1 PS2

    ```


    ```

    stty echo erase CTRL+

    echo

    greetings

    ```


