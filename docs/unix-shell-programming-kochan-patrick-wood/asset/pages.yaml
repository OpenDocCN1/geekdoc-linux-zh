  md: '# A Quick Review of the Basics


    Here, three users are logged in: pat, ruth, and steve. Along with each user id,
    the ty number of user and the day and time that user logged in is listed. The
    ty is a unique identification number the Unix system gives to each terminal or
    network device that a user has logged into.

    The who command can also be used to get information about yourself.


    ```

    $ who am i

    pat tty29 Jul 19 14:40

    $

    ```


    who and who am i are exactly the same command: who. In the latter case, the am
    and i are arguments to the who command.


    # Echoing Characters: The echo command


    The echo command prints (or echoes) at the terminal whatever you happen to type
    on the line (there are some exceptions to that you''ll learn about:)


    ```

    $ echo this is a test

    echo this is a test

    $ echo not print out a longer line with echo?

    why not print out a longer line with echo?

    $ echo

    ```


    ```

    echo one two three four five

    one two three four five $

    ```


    You will notice from the preceding example that echo squeezes extra blanks between
    words. That''s because on a Unix system, words are important: the blanks are merely
    to separate the words. Generally, the Unix system ignores extra blanks (you''ll
    learn more about this in the next chapter).


    # Working with Files


    The Unix system recognizes only three types of files: ordinary files, directory
    files, and special files. An ordinary file is just that: any file on the system
    contains data, text, program instructions, or are described later in this chapter.
    As its name implies, a special file has a special meaning to the Unix system and
    is typically associated with some form of I/O.


    A filename can be composed of just any character available from the keyboard (and
    even some that aren''t!) provided that the total number of characters in the name
    is not greater than 255. If more than 255 characters are specified, the Unix system
    ignores the extra characters.


    The Unix system provides many tools that make working with files easy. Here we''ll
    review basic file manipulation commands.


    # Listing Files: The  ls Command


    To see what files you have stored in your directory, you can type the  ls command:


    > Modern Unix and Windows systems support long filenames, however, some older
    Unix and Windows systems only allow much shorter filenames.


