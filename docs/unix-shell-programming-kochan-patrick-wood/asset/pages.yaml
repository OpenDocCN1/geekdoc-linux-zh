  md: '# Putting eval in front of the command sequence gives the desired results:


    ```

    ```

    eval ls | wc -l

    16

    ```

    ```


    The first time the shell scans the command line, it substitutes | as the value
    of pipe. Then eval causes it to reason the line, at which point | is recognized
    by the shell pipe symbol.


    The eval command is frequently used in shell programs that build up command lines
    inside one or more variables. If the variables contain any characters that must
    be seen by the shell directly on the command line (that is, not the result of
    substitution), eval can be useful. Command terminator (;), I/O redirection (<,>),
    and quote characters are among the characters that must appear directly on the
    command line to have any special meaning to the shell.


    For the next example, consider writing a last whose purpose is to display the
    last argument passed to it. You needed to get the last argument in the mycp program
    in Chapter 10, "Reading and Printing Data." You did so by shifting the arguments
    until the last one was left. You can also use eval to get it at as shown:


    ```

    ```

    cat last

    echo $$

    sl last one two three four

    sl last *

    $ zoo_report Get the last file

    $

    ```

    ```


    The first time the shell scans


    ```

    ```

    echo $$

    ```

    ```


    the backslash tells it to ignore the $ that immediately follows. After that, it
    encounters the special parameter #$, so it substitutes its value on the command
    line. The new command looks like this:


    ```

    ```

    echo $4

    ```

    ```


    (the backslash is removed by the shell after the first scan). When the shell scans
    this line, it substitutes the value of $4 and then executes echo.


    This same technique could be used if you had a variable arg that contained a digit,
    for example, and you wanted to display the positional parameter referenced by
    arg. You could simply write


    ```

    ```

    echo echo $arg

    ```

    ```


    The only problem is just that the first nine positional parameters can be accessed
    this way; to access positional parameters 10 and greater, you must use the $(n)
    construct:


    ```

    ```

    echo echo $(arg)

    ```

    ```


    Here''s how eval command can be used to effectively create "pointers" to variables:


    ```

    ```

    $ var ptrx=100

    $ eval echo $ptrx      Dereference ptrx

    100

