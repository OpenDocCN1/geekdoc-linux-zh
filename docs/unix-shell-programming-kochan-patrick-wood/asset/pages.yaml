    ![](img/f721b95d36c075f0637b85b379ede747_123_0.png)


    Other operators can be used to test character strings. These operators are summarized
    in Table 8.1.


    | Operator | Returns TRUE (status of if) | |

    | --- | --- | |

    | string1 = string | string is identical to string | |

    | string1 != string | string is not identical to string | |

    | string | is not null | |

    | -n string | is not null (and must be seen by test) | |

    | -z string | is not null (and must be seen by test).


    You''ve seen how the - operator is used. The != operator is similar, it only tests
    two strings for inequality. If the exit status from test is zero if the two strings
    are not equal, and nonzero if they are.


    Let''s look at three similar examples.


    ```

    $ day="monday"

    $ test "$day" = monday

    echo $?


    True

    ```


    The command returns an exit status of 0 because the value of day is equal to the
    characters monday. Now look at the following:


    ```

    $ day="monday"

    $ test "$day" = monday

    echo $?


    False

    ```


    We have aligned the characters monday—including the space character that immediately
    followed -to day. Therefore, if the previous test was made, test returned false
    because the characters "monday" were not identical to the characters "monday".


    If you wanted these values to be considered equal, omitting the double quotes
    would have caused the shell to "eat up" the trailing space, and test would have
    never seen it:


    ```

    $ day="monday"

    $ test "$day" = monday

    echo $?


    True

    ```


    Although this violates our rule about quoting shell variables that are arguments
    to test, it''s okay to ensure you''re sure the variable is not null (and not entirely
    of whitespace characters).'
