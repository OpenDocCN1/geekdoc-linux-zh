  md: "# Decisions, Decisions\n\n```\nmv /tmp/phonebook phonebook\n$ rm Susan Goldberg\
    \ Try it out\nIncorrect number of arguments.\nUsage: rem name\n```\n\nThe exit\
    \ command returns an exit status of 1, to signal \"Failure,\" in case some other\
    \ program wants to check it. How could you have written the preceding program\
    \ with an if-else instead of using the exit (hint: look at the last version of\
    \ on)?\n\nWhether you use the exit or an if-else is up to you. Sometimes the exit\
    \ is a more convenient way to get out of the program quickly, particularly if\
    \ it's done early in the morning.\n\n# The elif Construct\n\nAs your programs\
    \ become more complex, you may find yourself needing to write nested if-statements\
    \ of the following form:\n\n```\nif command;\n    command\n    ...\nelse\n   \
    \ if command;\n        command\n        ...\n    else\n        if command;\n \
    \           command\n            ...\n        else\n            command\n    \
    \        ...\\n    fi\nfi\n```\n\nThis type of command sequence is useful when\
    \ you need to make more than just a two-way decision afforded by an if-else construct.\
    \ In this case, a multilevel decision is made, with the last else clause executed\
    \ if one of the preceding conditions is satisfied.\n\nAs an example, suppose that\
    \ you wanted to write a program called greetings that would print a friendly \"\
    Good morning,\" \"Good afternoon,\" or \"Good evening\" whenever you logged on\
    \ to the system. For purposes of the example, consider any time from midnight\
    \ to the morning, noon to 6:00 p.m. the afternoon, and 6:00 p.m. to the evening.\n\
    \nTo write this program, you have to find out what time it is. date serves just\
    \ fine for this purpose. Take another look at the output from this command:\n\n\
    ```\n$ date\nWed Aug 26 10:42:01 EDT 2002\n$\n```\n\nUnix® Shell Programming,\
    \ Third Edition. Unix® Shell Programming, Third Edition, ISBN: 0-672-32490-3\n\
    \nPrepared for architect@gmail.com. This download file is made available for personal\
    \ use only and is subject to the Terms of Service. Any other use requires prior\
    \ written consent from the copyright owner. ©2002 O'Reilly Publishing. Unauthorized\
    \ use, reproduction and/or distribution are strictly prohibited and violate applicable\
    \ laws. All rights reserved."
