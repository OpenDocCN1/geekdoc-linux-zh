    # # The -l Option


    At times, you may want to see the actual lines that match a pattern but may be
    interested in knowing only the names of the files that contain the pattern. For
    example, suppose that you have a set of programs in your current directory (these
    filenames end with characters .c), and you want to know which files used a variable
    called `move_history`. The following example shows one way of finding the answer:


    ```

    $ grep -l Move_history *.c Find Move_history in all C files

    exec.c: move_history[100] = 0;

    exec.c: cymove(move_history[Number_half_halves], -1);

    exec.c: undo(move_history[Number_half_halves-1]);

    exec.c: (list_move_history[Number_half_halves-1]);

    exec.c: convert(move_history[Number_half_halves-1]);

    exec.c: copymove(move_history[Number_half_halves-1]);

    exec.c: convert(move_history[Number_half_halves-1]);

    makeemove.c: IMPORT MOVE_history[];

    if (move_history[j] == BOOK(i,j)) OR

    makeemove.c: move_history[j] = BOOK(i,j);

    test.c: GLOBAL MOVE_history[100] = 0;

    test.c: Move_history[Number_half_halves-1].from = move.from;

    test.c: Move_history[Number_half_halves-1].to = move.to;

    ```


    Sifting through the preceding output, you discover that three files—exec.c, makemove.c,
    and test.c—use the variable.


    The -l grep gives you a list of files that contain the specified pattern, not
    the matching lines from the files:


    ```

    $ grep -l ''Move_history'' *.c List the files that contain Move_history

    exec.c

    makemove.c

    test.c

    ```


    Because grep conveniently lists the files one per line, you can pipe the output
    from grep -l to wc count the number of files that contain a particular pattern:


    ```

    $ grep -l ''Move_history'' *.c | wc -l

    ```


    So the preceding says that precisely three C program files reference the variable
    Move_history. (What are you if you use grep without the -l option?)


    # # The -n Option


    If the -n option is used with grep, each line from the file where the specified
    pattern is preceded by its relative line number in the file. From previous examples,
    you saw that the test.c was one of the three files that referenced the Move_history;
    the following shows how you can pinpoint the lines in the file that reference
    the variable:


    ```

    $ grep -n ''Move_history'' test.c Precede matches with line numbers

    13:GLOBAL MOVE_history[100] = (0);

    197: Move_history[Number_half_halves-1].from = move.from;

    198: Move_history[Number_half_halves-1].to = move.to;

    ```


    As you can see, Move_history is used on lines 13, 197, and 198 in test.c.'
