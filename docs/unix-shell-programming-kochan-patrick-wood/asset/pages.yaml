    \n(note the absence of the in), the shell automatically sequences through all\
    \ the arguments typed on the command line, just as you had written\n\n```\nfor\
    \ var in \"$@\"\n  do\n    command\n  done\n```\n\nHere's the third and last version\
    \ of the args program:\n\n```\ncat args\necho Number of arguments passed is: $#nfor\
    \ arg\n  do\n    echo $arg\n  done\nargs a b c\nNumber of arguments passed is:\
    \ 3\na\nb\nc\nargs 'a b' 'c'\nNumber of arguments passed is: 2\na b\nc\nargs\n\
    $0\n```\n\n# The while Command\n\nThe second type of looping command to be described\
    \ in this chapter is the while. The format of this command is\n\n```\nwhile command\n\
    \  do\n    command\n  done\n```\n\ncommand is executed and its exit status tested.\
    \ If it's zero, the commands enclosed between the do and done are executed. Then,\
    \ command is executed again and its exit status tested. If it's zero, the commands\
    \ enclosed between the do and done are once again executed. This process continues\
    \ until command, returns a nonzero exit status. At that point, execution of the\
    \ loop is terminated. Execution proceeds with the command that follows done.\n\
    \nNote that the commands between the do and done might never be executed if command,\
    \ returns a nonzero exit status the first time it's executed.\n\nHere's a program\
    \ called while that simply counts to 5:\n\n```\ncat while\ni=1\nwhile [ \"$i\"\
    \ -le 5 ];\n  echo $i\n  i=$((i+1))\ndone\n```"
