    Suppose you''re writing a shell program and want to assign the current date and
    time to a variable now, perhaps to display it later at the top of a report, or
    log it into a file. The problem here is that you somehow want to take the output
    date and assign it to the variable. Command substitution can be used for this:


    ```

    $ now=$(date) Execute date and store the output in now

    $ echo See what got assigned

    Wed Aug 28 14:47:26 EST 2002

    ```


    When you write


    ```

    now=$(date)

    ```


    the shell realizes that the entire output from date is be assigned to now. Therefore,
    you don''t need to enclose $(date) double quotes.


    Even commands produce more than a single line of output can be stored in a variable:


    ```

    $ filelist=$(ls)

    $ echo filelist

