  md: '# Tools of the Trade


    cut -dchar -fields


    where dchar is the character that delim each field of the data, and fields specifies
    the fields to be extracted from file. Field numbers start at 1, and same type
    of formats can be used to specify field numbers as was used to specify character
    positions before (for example, -f1,2,8,-f1-3,-f4-).


    To extract the names of all users of your system from /etc/passwd, you could type
    the following:


    ```

    cut -f1 /etc/passwd      Extract field 1

    root

    daemon

    bin

    uucpamp

    steve

    other

    ```


    Given that the home directory of each user is in field 6, you can associate each
    user of the system with or her home directory as:


    ```

    cut -f1,6 /etc/passwd      Extract fields 1 and 6

    root/

    daemon/

    bin/

    uucp:/usr/uucp

    amp/

    steve:/home/steve

    other/

    ```


    If the command is used to extract fields from a file and the -d option is not
    supplied, cut uses the tab character as the default delimiter.


    The following depicts a common pitfall when using the cut command. Suppose that
    you have a file called phonebook that has the following contents:


    ```

    cat phonebook

    Alice Graham    973-555-2015

    Beatrice Swingle 201-555-2257

    Jeff Goldberg   201-555-3378

    Liz Stachaus    212-555-2298

    Susan Goldberg   201-555-7776

    Tony Iannino    973-555-1295

    ```


    If you want to get the names of the people in your phone book, your first impulse
    would be to use as shown:


    ```

    cut -c1-15 phonebook

    Alice Graham    9

    Beatrice Swingle 2

    Jeff Goldberg   2

    Liz Stachaus    212

    Susan Goldberg   9

    Tony Iannino    97

    ```


    Not quite what you wanted! This happened because the name is separated from the
    phone number by a tab character and not blank spaces in the phonebook file. And
    as far as is concerned, tabs count as a single character when using the -c option.
    So extracts the first 15 characters from each line in the previous example, giving
    the results as shown.


