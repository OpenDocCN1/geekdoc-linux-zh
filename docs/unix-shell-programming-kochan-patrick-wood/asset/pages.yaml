    \ 4\n[1] 5418\nvi nevemno\nWork continues\nYou have\nmail\nfrom Steve Wed Aug\
    \ 28 17:44:46 EDT 2002\nsandy logged on\n```\n\nOf course, we could have written\
    \ mon to accept the -m option as either the first or second argument, but that\
    \ goes against the recommended command standard, which specifies that all options\
    \ should precede any other types of arguments on the command line.\\ Also that\
