  md: '# More on Parameters


    ```

    $ x -x

    $ set -x

    $ echo -dx

    $ echo greetings lu rem rolo

    add greetings lu rem rolo

    $ cmdwc

    $ cmdx

    $ ls | scmd -1

    + in

    + wc -1

    $

    ```


    Set command trace option


    You can turn off trace mode at any time by executing set with the +x option:


    ```

    $ set +x

    $ set -x

    $ ls | wc -1

    $

    ```


    Back to normal


    You should note that the trace option is not passed to subshells. But you can
    trace a subshell''s execution by running the shell with the -x option followed
    by the name of the program to be executed, as in


    ```

    sh -x rolo

    ```


    or you can insert a set -x command inside the file itself. In fact, you can insert
    any number of set -x and set +x commands into your program to trace mode on and
    off as desired.


    # set with No Arguments


    If you don''t give any arguments to set, you''ll get an alphabetized list of all
    the variables that exist in your environment, be they local or exported:


    ```

    $ set

    show all variables

    CDPATH=/users/steve/usr/spool

    EDITOR=/bin/vi

    HOME=/users/steve

    IFS=

    LOGNAME=steve

    MAIL=/usr/spool/mail/steve

    MAIL_RECEIVED=

    PATH=/usr/bin:/users/steve/bin:

    PHONEBOOK=/users/steve/phonebook

    PS1=

    PWD=/users/steve/misc

    SHELL=/bin/sh

    TERM=xterm

    TTY=

    TEST=

    cmdwc\*

    $

    ```


    # Using set to Reassign Positional Parameters


    There is no way to directly assign a value to a positional parameter; for example,


    ```

    1=100

    ```


