    Instead of requiring that the user have a phone book file in his or her home directory,
    the program checks on startup to see whether the variable PHONEBOOK has set. If
    isn''t, it''s set to $HOME/phonebook as the default. In either case, the program
    checks to see whether the phone book file exists, and if it doesn''t, immediately
    exiting, asks the user whether he would like to have an initial file created.
    This was added so first-time users of rolo can have an empty phone book file created
    for them by the program.


    This version of rolo also has a couple of items added to the menu. Because individual
    entries can be long, an editing option has been added to allow you to edit a particular
    entry. Formerly, the only way to change an entry was to remove it and add a new
    one, a strategy that was perfectly acceptable when the entries were small.


    Another option allows for listing of the entire phone book. With this option,
    the first and last lines of each entry are displayed. This assumes that the user
    follows some convention such as putting the name on the first line and the number
    on the last.


    The entry selection process was placed inside a while loop so that rolo will continue
    to display menus until the "exit" option is picked from the menu.'
