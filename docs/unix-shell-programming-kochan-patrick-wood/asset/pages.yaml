  md: "# Decisions, Decisions\n\n```\ncommand\n  ...\n  command;\n\nesac\n```\n\n\
    The word value is successively compared against the values pat, ..., pat, ...,\
    \ until a match is found. When a match is found, the commands listed after the\
    \ matching value, up to the double semicolons, are executed. After the double\
    \ semicolons are reached, execution of the case is terminated. If a match is not\
    \ found, none of the commands listed in the case is executed.\n\nAn example of\
    \ the use of case, the following program called number takes a single digit and\
    \ translates it to its English equivalent:\n\n```\ncat number\n# Translate a digit\
    \ to English\n#\nif [ \"$\" -ne 1 ];\nthen\n  echo \"Usage: number digit\"\n \
    \ exit 1\nfi\ncase \"$1\"\n  0) echo zero;\n  1) echo one;\n  2) echo two;\n \
    \ 3) echo three;\n  4) echo four;\n  5) echo five;\n  6) echo six;\n  7) echo\
    \ seven;\n  8) echo eight;\n  9) echo nine;\nesac\n```\n\nNow to test it:\n\n\
    ```\n$ number 0\nzero\n$ number 3\ntree\n$ number\nUsage: number digit\nTry no\
    \ arguments\n$ number 17\nTry a two-digit number doesn't match any of the values\
    \ listed in the case, so none of the echo commands executed.\n```\n\nThe last\
    \ case shows what happens when you type in more than one digit: $1 doesn't match\
    \ any of the values listed in the case, so none of the echo commands executed.\n\
    \n# Special Pattern Matching Characters\n\nThe shell uses you the same special\
    \ characters for the patterns in a case as you can with filename substitution.\
    \ That is, ? can be used to specify any single character; * can be used to specify\
    \ zero or more occurrences of any character; and [...] can be used to specify\
    \ any single character enclosed between the brackets.\n\nUnix® Shell Programming,\
    \ Third Edition. Unix® Shell Programming, Third Edition, ISBN: 0-672-32490-3\n\
    Prepared for open.serv. This download file is made available for personal use\
    \ only and is subject to the Terms of Service. Any other use requires prior written\
    \ consent from the copyright owner © 2002 John Wiley Publishing. Unauthorized\
    \ reproduction and/or distribution is strictly prohibited and will violate applicable\
    \ laws. All rights reserved."
