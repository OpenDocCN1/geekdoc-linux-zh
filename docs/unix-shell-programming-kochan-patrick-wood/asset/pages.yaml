    # The $ {variable} Construct


    Suppose that you have the name of a file stored in the variable filename. If you
    wanted to rename file so that the new name was the same as the old, except with
    an X added to the end, your first impulse would be type


    ```

    $filename $filenameX

    ```


    When the shell scans this command line, it substitutes the value of the variable
    filename and also the value of the variable filenameX. The shell thinks filenameX
    is the full name of the variable because it''s composed entirely of valid name
    characters. To avoid this problem, you can delimit the end of the variable by
    enclosing the entire name (but not the leading dollar sign) in a pair of curly
    braces, as


    ```

    $$(filename)

    ```


    This removes the ambiguity, and the mv command then works as:


    ```

    mv $filename $filenameX

    ```


