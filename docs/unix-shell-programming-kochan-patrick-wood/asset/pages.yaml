  md: '# Reading and Printing Data


    says to take the previous value of filelist, add a space followed by the value
    of $1, and then store the result back into filelist. The shift command is executed
    to "move" all arguments over by one. Eventually, $ will be equal to one, and at
    that point, filelist will contain a space-delimited list of all the files to be
    copied, and $ will contain the last argument, which is the destination file (or
    directory). To see how this works, consider execution of while loop when the command
    is executed


    ```

    mycp names prog1 prog2 lu

    ```


    Figure 10.1 depicts the changing values of the variables through each iteration
    of the loop. The first line shows the state of the variables before the loop is
    entered.


    $$ $1 $2 $3 $4 $5 filelist

    5 names prog1 prog2 lu null

    4 prog1 prog2 lu bin names

    3 prog2 lu bin names prog1

    2 lu bin names prog2

    1 bin names prog1 prog2 lu


    Figure 10.1. Processing-command-arguments.


    After the loop is exited, the last argument contained in $1 is stored in the variable.
    Next, a test is made to ensure that at least two arguments were typed on the command
    line and if more than two were typed, that argument is a directory. If either
    condition is unsatisfied, usage information is displayed to the user, and the
    program exits with status of 1.


    Following this, a for loop is entered for the purpose of individually examining
    each file in the list to see whether it exists. If it does, the user is prompted
    as. If the user wants to overwrite the file, or if the file doesn''t already exist,
    the file is added to the variable copylist. The technique used here is the same
    used to accumulate the arguments inside filelist.


    When the for loop is exited, copylist contains a list of all the files to be copied.
    This list will be null if each of the destination files exists or if the user
    types "no" for each. So a test is made to ensure copylist is non-null, and if
    it is, the copy is performed.


    Take some time to review the logic of mycp; it does a good job at illustrating
    many of the features you''ve learned in this book. Some exercises at the end of
    this chapter will help test your understanding of this program.


