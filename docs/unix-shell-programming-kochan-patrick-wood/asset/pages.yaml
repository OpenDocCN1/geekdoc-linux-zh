    just a command prompt will be returned. In the next section, you''ll see how to
    test whether the correct number of arguments has been supplied to a program, and
    if not, take some action.


    # The test Command


    A built-in shell command called test is often used for testing one or more conditions
    in an command. Its general format is


    ```

    test expression

    ```


    where expression represents the condition you''re testing. test evaluates expression,
    and if the result is true, it returns an status of zero; otherwise, the result
    is false, and it returns a nonzero exit status.


    # String Operators


    As an example of use of test, the following command returns a zero exit status
    if the shell variable name contains the characters julio:


    ```

    test "name" = julio

    ```


    The = is used to test whether two values are identical. In this case, we''re testing
    to see whether the contents of the shell variable name are identical to the characters
    julio. If it is, test returns an exit status of zero; otherwise nonzero.


    Note that test must see all operands (name and julio) and operators (= as separate
    arguments, meaning they must be delimited by one or more whitespace characters.


