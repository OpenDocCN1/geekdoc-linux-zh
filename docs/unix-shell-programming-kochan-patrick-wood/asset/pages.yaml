    # The fc Command


    General Format: fc -e -lnr first last


    ```

    fc -s=old-new first

    ```


    The fc command is used to edit commands in the command history. A range of commands
    is specified from first to last, where first and last can be either command numbers
    or strings; a negative number is taken as an offset from the current number; a
    string specifies the most recently entered command with that string. The commands
    are read into the editor and executed upon exit from the editor. If editor is
    not specified, the value of the shell variable FCEDIT is used; if FCEDIT is not
    set, ed is used.


    The -l option lists the commands from first to last (that is, an editor is not
    invoked). If the -n option is also selected, these commands are not preceded by
    command numbers.


    The -r option to fc reverses the order of the commands.


    If last is not specified, it defaults to first. If first is not specified, it
    defaults to the previous command for editing and to -18 for listing.


    ```

    fc -s=old-new first

    ```


    causes the first command to be re-executed after the string old in the command
    is replaced with new. If first isn''t specified, the previous command is used,
    and if old=new isn''t specified, the command is not changed.


    # Examples


    | fc -1 | List the last 16 commands |

    | fc -e vi | Read the last ned command into vi |

    | fc 100 110 | Read commands 100 to 110 into FCEDIT |

    | fc - | Re-execute the previous command |

    | fc -s abc=def 104, replacing command abc with def |


