    # Displaying the Values of Variables


    The echo command is used to display the value stored inside a a shell variable.
    To do this, you simply write


    ```

    echo $variable

    ```


    The $ character is a special character to the shell. If a valid variable name
    follows the $, the shell takes this as an indication that the value stored inside
    that variable is to be substituted at that point. So, when you type


    ```

    echo $count

    ```


    the shell replaces $count with the value stored there; then it executes the echo
    command:


    ```

    echo $count

    ```


    Remember, the shell performs variable substitution before it executes the command
    (see Figure 5.1).


    ![](img/f721b95d36c075f0637b85b379ede747_87_0.png)


    You can have the value of more than one variable substituted at a time:


    ```

    $ echo $my_bin

    /users/steve/bin

    $ echo $my_bin $count

    /users/steve/bin 1

    ```


    In the second example, the shell substitutes the value of my_bin and count and
    then executes the echo command (see Figure 5.2).


    ![](img/f721b95d36c075f0637b85b379ede747_87_1.png)


    The values of variables can be used anywhere on the command line, as the next
    examples illustrate:


    ```

    $ ls $my_bin

    mon

    text

    $ pwd

    /users/steve/documents/memos Where are we?

    $ cd $my_bin Change to my bin directory

    $ pwd

    /users/steve/bin

    ```


