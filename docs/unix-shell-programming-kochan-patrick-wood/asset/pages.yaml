    \ follows the # to the end of the line as comments and ignores them. If the #\
    \ starts the line, the entire line is treated as a comment by the shell. Here\
    \ are examples of valid comments:\n\n```\n# Here is an entire comment line\nwho\
    \ | wc -l      # count the number of users\n```\n\n```\n# Test to see if the correct\
    \ arguments were supplied\n#\n```\n\nComments are useful for documenting commands\
    \ of commands whose purposes may not be obvious or sufficiently complex that if\
    \ you were to look at the program in a week you might forget why they're there\
    \ or what they do. Judicious use of comments can help shell programs easier to\
    \ debug and maintain—both by you and by someone else who may have to support your\
    \ programs.\n\nLet's get back to the stats program and insert some comments:\n\
