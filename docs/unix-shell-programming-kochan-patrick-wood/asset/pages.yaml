    enclosed within the single quotes alone, which results in the display of *. In
    the final case, the double quotes indicate to the shell that variable substitution
    is to be performed inside the quotes. So the shell substitutes for $. Because
    filename substitution is not done inside double quotes, * is then passed to echo
    as the value to be displayed.


    So you want to have the value of a variable substituted, but don''t want the shell
    to treat the substituted characters properly, you must enclose the variable inside
    double quotes.


    Here''s another example illustrating the difference between double quotes and
