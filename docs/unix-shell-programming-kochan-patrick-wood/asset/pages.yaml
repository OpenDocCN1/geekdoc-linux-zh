    The option -c1-8,18- says "extract characters 1 through 8 (the username) and also
    characters 18 through the end of the line (the login time)."^3


    # - d and -f Options


    The cut command as described previously is useful when you need to extract data
    from a file or command that has a fixed format.


    For example, you could use cut on the who command because the usernames are always
    displayed in character positions 1-8, in 10-16, and the login time in 18-29. Unfortunately,
    not all your data will be well organized! For instance, take a look at the /etc/passwd:


    ```

    $ cat /etc/passwd

    root:x:0:0:The Super User:/root:/bin/bash

    cron:x:1:Daemon for tasks:

    bin:x:2:The bin user

    nnp:x:3:/usr/sbin:/usr/sbin/nologin

    gami:x:4:The Owner of asirable Devices:

    steve:x:100:/home/steve:/bin/bash

    other:x:99:Seeded by system program:

    ```


    /etc/passwd contains the names of all users on your computer system. It also contains
    other information such as your user id, your home directory, and the name of the
    program to start up when you log in. Getting back to the cut command, you can
    see that the data in this file does not align the same way who''s output does.
    So getting a list of all the possible users of your system cannot be done using
    the -c option to cut.


