    +   - Cannot redirect output (> and >>)

    - Cannot execute programs


    These restrictions are enforced after the .profile is executed when logging in,
    and the user is logged off if they Break or Delete while the .profile is being
    interpreted.


    These simple restrictions allow the writer of a restricted user''s .profile to
    control what commands that user can use. The following example shows a simple
    setup for a restricted environment:


    ```

    $ cat .profile

    PATH=/usr/bin/restrict/bin

    export PATH

    SHELL=/usr/bin/rbsh

    export SHELL

    cd /usr/restrict/cddir

    ls -l .profile

    ls -l /1 group 176 Sec

    ls /usr/bin

    cat

    echo

    mail

    red

    write

    ls /users/restrict/bin

    adventure

    backgam

    chews

    heats

    rogue

    ```


    User restrict''s .profile

    Some commands SHELL variable

    Don''t leave user in HOME directory

    Restricted shell doesn''t own his .profile

    Directory of restricted commands

    Harmless commands

    Let them send us mail

    Restricted editors

    restrict''s command directory

    Lots of games


    Here we have a restricted environment for a user. When this user logs in, his
    PATH is changed to search the directories /usr/bin and /users/restrict/bin. He
    can run only commands in these two directories. Any other command will get a command:
    not found. The user is effectively locked out of /users/restrict and cannot cd
    out of. The .profile is owned by a user other than the restricted one, and the
    permissions are such that only the owner can change the file. (Don''t let a restricted
    user alter his or her .profile because the .profile is executed before any restrictions
    are applied)


    One quick note about the /usr/bin: They were simply copied from the /bin and /usr/bin.
    rbsh uses some sense in the commanding that allow restricted users to use. For
    example, some commands may be used to bypass the restricted shell. The mail escapes
    the shell and runs restricted if the first character of its name is "c". The restricted
    editor is the same as ed, it doesn''t allow shell escapes, and it only allows
    editing of files in the current directory.


    Note that most restricted shells are not very secure. They should not contain
    hostile. Even though restricted shells are more secure than others, if you give
    a restricted user certain commands (such as any), he will be able to break out
    into a nonrestricted environment.


    If you can''t find a restricted shell on your system, you can copy or link any
    old Bourne to a filename that begins with "c" and make that the login shell of
    the restricted user. When the shell starts up, it checks the first of the command
    name that was used to invoke it; if that letter is "c", it will be a restricted
    shell.


