  md: "# Shell Summary\n\n296\nuntil command,\ndo\n  command\n  command\n  ...\n\n\
    done\ncommand, is executed and its exit status tested. If it is nonzero, the commands\
    \ enclosed between\nthe do and done are executed. Then command, is executed again\
    \ and its status tested. If it is\nnonzero, the commands between the do and done\
    \ are once again executed. Execution of com-\\mand; and subsequent execution of\
    \ the commands between the do and done continues until com-\\mand; returns a zero\
    \ exit status, at which point the loop is terminated. Execution continues\nwith\
    \ the command that follows the.\n\nNote that because command, gets evaluated immediately\
    \ on entry into the loop, the commands\nthe do and done may never be executed\
    \ if it returns a zero exit status the first time.\n\nExample\n\n```\n# sleep\
    \ for 60 seconds until jack logs on\nuntil ps | grep jack > /dev/null\n  sleep\
    \ 60\ndone\necho jack has logged on\n```\n\nThe preceding loop continues until\
    \ it returns a zero exit status (that is, finds jack in who's\noutput). At that\
    \ point, the loop is terminated, and the echo command that follows is executed.\n\
    \n# The Wait Command\n\nGeneral Format: wait *job\n\nThis command causes the shell\
    \ to suspend its execution until the process identified as job finishes\nexecuting.\
    \ Job can be a process id or a job_id. If job is not supplied, the shell waits\
    \ for all\nchild processes to finish executing. If more than one process is listed,\
    \ Wait will wait for them all\nto complete.\n\nwait is useful for waiting for\
    \ processes that have been sent to the background for execution.\n\nExample\n\n\
    ```\nsort large_file > sorted_file &\n  Continue processing\n  Now wait for sort\
    \ to finish\n...\n  wait\nplotdata sorted_file\n```\n\nThe variable $ can be used\
    \ to obtain the process id of the last process sent to the back-\nground.\n\n\
    # The while Command\n\nGeneral Format:\n\n```\nwhile command;\ndo\n  command\n\
    \  command\n  ...\ndone\n```\n\nUnix® Shell Programming, Third Edition. Unix®\
    \ Shell Programming, Third Edition, ISBN: 0-672-32490-3\nPrepared for Michael\
    \ Stevens, Terry Wyatt\n© 2002-2003 by O'Reilly Media. All rights reserved.\n\
    Copyright (c) 2003 by O'Reilly Media. This download file is made for personal\
    \ use only and is subject to the Terms of Service. Any other use requires prior\
