    # Deleting Lines


    To delete entire lines of text, use the d command. By specifying a line number
    or range of numbers, you can delete specific lines from the input. The following
    example, sed used to delete the first two lines of text from intro:


    ```

    sed ''1,24d''    Delete lines 1 and 2

    in the late 1960s. One of the primary goals in

    the the UNIX system was to create an

    environment that promoted efficient program

    development.


    ```


    Remembering that by sed delete all lines of the input to output, the remaining
    lines in text—that is, lines 3 through end—simply get to written output.


    By preceding the d command with a string of text, you can use sed to delete all
    lines that contain that text. In the following example, sed is used to delete
    all lines of text containing the word UNIX:


    ```

    sed ''/UNIX/a''    Delete all lines containing UNIX

    Thompson and Dennis Ritchie at Bell Laboratories

    in the late 1960s. One of the primary goals in

    environment that promoted efficient program

    development.


    ```


    The power and flexibility of sed goes far beyond what we have shown here. sed
    has facilities enable to loop, build text in a buffer, and combine many commands
    into a single editing script. Table 4.2 sed Examples


    # Table 4.2 sed Examples


    | Command | Description |

    |---|---|

    | sed ''5d'' | Delete all lines containing Test or text |

    | sed ''/20,25$d'' | Print lines only 20 through 25 from text |

    | sed ''1,10$s/unix/g'' | Change unix to wherever it appears in the first 10 lines
    of intro |

    | sed ''/jan/ -1/-5/'' | Change the first -1 to -5 on all lines containing Jan
    |

    | sed ''s/.../d'' | Delete the first 3 characters from each line of data |

    | sed ''s/...$/d'' | Delete the last 3 characters from each line of data |

    | sed -n ''1'' text | Print all lines from text, showing nonprinting characters
    as \m (where m is the value of the character), and tab characters as \t |


