    and get the same results. The shell automatically substitutes the names of all
    the files in the current directory for the *. The same substitution occurs if
    you use * with the echo command:


    ```

    $ echo *

    chap1 chap2 chap3 chap4

    $

    ```


    Here the * is again replaced with the names of all the files contained in the
    current directory, and the echo command displays them at the terminal.


    Any place that * appears on the command line, the shell performs its substitution:


    ```

    $ echo *

    chap1 chap2 chap3 chap4 : chap1 chap2 chap3 chap4

    $

    ```


    The * can also be used in combination with other characters to limit the filenames
    that are substituted. For example, let''s say that in your current directory you
    have not only chap1 through chap4 but also files a, b, and c:


    ```

    $ ls *

    a

    bchap1:

    chap2

    chap3

    chap4

    ```


    To display the contents of just the files beginning with chap, you can type in


    ```

    $ cat chap*

    ```


    The chap matches any filename that begins with chap. All such filenames are substituted
    on the command line.


    The * is not limited to the end of a filename; it can be used at the beginning
    or in the middle as well:


    ```

    $ echo *t1

    chap1

    $ echo *t*

    chap1 chap2 chap3 chap4

    $ echo *x

    $

    ```


    In the first echo, the *t1 specifies all filenames that end in the characters
    t1. In the second echo, the first * matches everything up to t and the second
    everything after; thus, all filenames containing t are printed. Because there
    are no files ending with x, no substitution occurs in the last case. Therefore,
    the echo command displays *x.


