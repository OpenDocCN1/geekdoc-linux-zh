    # Built-in Integer Arithmetic


    The POSIX standard shell provides a mechanism for performing integer arithmetic
    on shell variables called arithmetic expansion. Note that some older shells do
    not support this feature.


    The format for arithmetic expansion is


    ```

    $((expression))

    ```


    where expression is an arithmetic expression using variables and operators. Valid
    variables are those that contain numeric values (leading and trailing whitespace
    is allowed). Valid operators are taken from the C programming language and are
    listed in Appendix A, "Shell Summary.". The result of computing expression is
    substituted on the command line. For example,


    ```

    echo $((i))

    ```


    adds one value to the shell variable i and prints the result. Notice that the
    variable doesn''t have to be preceded by a dollar sign. Because the shell knows
    that the only valid items that can appear in arithmetic expansions are operators,
    numbers, and variables. If the variable is not defined or contains a NULL string,
    its value is assumed to be zero. So if we have not assigned any value to the variable,
    we can still use it in an integer expression:


    ```

    $ echo Sa               Variable a not set

    $ echo $((a = a + 1))   Equivalent to a = 0 + 1

    $ echo Sa               Now contains 1

    ```


    Note that assignment is a valid operator, and the assignment is substituted in
    the second echo command in the preceding example.


    Parentheses may be used freely inside expressions to force grouping, as in


    ```

    echo $((i = (10) * 3))

    ```


    If you want to perform an assignment without echo or some other command, you can
    move the assignment before the arithmetic expansion.


    To multiply the variable i by 5 and assign the result back to i you write


    ```

    i=$((i * 5))

    ```


    Note that spaces are optional inside the double parentheses, but are not allowed
    when the assignment is outside them.


    Finally, to test whether i is greater than 0 or less than equal to 100, you can
    write


    ```

    result=$((i > 0 && i <= 100))

    ```


    which assigns result 1 if the expression is true or 0 if its false:


