  md: '# Can Quote You on That?


    # The Back Quote


    The back quote is unlike any of the previously encountered types of quotes. Its
    purpose is not to protect characters from the shell but to execute the enclosed
    command and insert the standard output from the command at that point on the command
    line. The general format for using back quotes is


    ```

    command

    ```


    where command is the name of the command to be executed and where output is to
    be inserted at that point.


    Here is an example:


    ```

    echo The Date and time is: date

    date and time is: Wed Aug 28 14:28:43 EST 2002

    ```


    When the shell starts its initial scan of the command line, it notices the back
    quote and expects the name of a command to follow. In this case, the shell finds
    that the date command is to be executed. So it executes date and replaces the
    "date" on the command line with the output from the date. After it directs the
    command line into arguments in the normal manner and initiates execution of the
    echo command.


    ```

    echo Your current working directory is: pwd

    Your current working directory is: /users/steve/shell/chaf

    ```


    Here the shell executes pwd, inserts its output on the command line, and then
    executes the echo. Note that in the following section, back quotes can be used
    in all the places where the $(...) is used.


    # The $(...) Construct


    The POSIX standard shell supports the $(...) construct for command substitution.
    The general format is


    where, in the back quoting method, command is the name of the command whose standard
    output is to be substituted on the command line. For example:


    ```

    echo The Date and time is: $(date)

    date and time is: Wed Aug 28 14:28:43 EST 2002

    ```


    This is better than back quotes for a couple of reasons. First, complex commands
    that use combinations of forward and back quotes can be easier to read, particularly
    if the type you''re using doesn''t visually different single quotes and back quotes;
    second, $(...) constructs can be easily nested, allowing command substitution
    within command substitution. nesting can also be performed with back quotes, it''s
    a little tricky. You''ll see an example of nested command substitution in this
    section.


    > Note that using the back quote for command substitution is no longer the preferred
    method; however we cover it here because of the large number of older, shell programs
    that still use it. Also, you should know about back quotes in case you ever need
    to write shell programs that are portable to Unix systems that do not support
    the newer $(...) construct.


