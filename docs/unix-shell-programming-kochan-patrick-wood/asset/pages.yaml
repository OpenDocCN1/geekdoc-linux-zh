    # Inline Input Redirection


    If the << characters follow a command in the format


    ```

    command <<$word

    ```


    the shell uses the lines that follow as the standard input for command, until
    a line that contains just word is found. Here''s a small example at the terminal:


    ```

    wc -l <<ENDOFDATA      Use lines to ENDOFDATA as standard input

    > here''s a line

    > and another

    > and yet another

    > ENDOFDATA

    $

    ```


    Here the shell fed every line typed into the standard input of wc until it encountered
    the line containing just ENDOFDATA.


    Inline redirection is a powerful feature when used inside shell programs. It lets
    you to specify the standard input to a command directly in the program, thus avoiding
    the need to write it into a sep\u000arate file first, or to use echo to get it
    into the standard input of the command.


    ```

    $ cat mailbox

    mail $ <<END-OF-DATA

    ```


    Attention:


    Our monthly computer users group meeting

    will take place on Friday, October 4, 2002 at

    Sam in Room LA-308. Please try to attend.


    ```

    END-OF-DATA

    ```


