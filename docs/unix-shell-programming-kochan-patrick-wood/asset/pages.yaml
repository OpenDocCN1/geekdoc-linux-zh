  md: "# Decisions, Decisions\n\n$ date\nWed Aug 28 15:45:12 EDT 2002\n$ greetings\n\
    Good afternoon\nI\n\nThis seems about as good a time as any to talk about the\
    \ shell's built-in null command. The format\nof this command is simply\n\nand\
    \ the purpose of it is—you guessed it—to do nothing. So what is good? Well, in\
    \ most cases it's\nis to satisfy the requirement that a command appears, particularly\
    \ in if commands. Suppose that\nYou want to make sure that the value stored in\
    \ the variable system exists in the file /users/\nve/mail/systems, and if it doesn't,\
    \ you want to issue an error message and exit from the\nprogram. So you start\
    \ by writing something like\n\n```\nif grep \"system\" /users/steve/mail/systems\
    \ > /dev/null\nthen\n```\n\nbut you don't know what to write after the then you\
    \ want to test for the nonexistence\nof system in the file and don't want to do\
    \ anything special if the grep succeeds. Unfortunately,\nshell requires that you\
    \ write a command after the then. Here's where the null command comes\nto the\
    \ rescue:\n\n```\nif grep \"system\" /users/steve/mail/systems > /dev/null\nelse\n\
    \ necho \"system is not a valid system\"\nexit 1\nfi\n```\n\nSo if the system\
    \ is valid, nothing is done. If it's not valid, the error message is issued and\
    \ the program\nxited.\n\nRemember this simple command when these types of situations\
    \ arise.\n\n# && and || Constructs\n\nThe shell has two special constructs that\
    \ enable you to execute a command based on whether the\npreceding command succeeds\
    \ or fails. In case you think this sounds similar to the if command,\nwell it\
    \ is. It's sort of a shorthand form of the if.\n\nIf you write\n\ncommand, command;\n\
    \nanywhere the shell expects to see a command, command, will be executed, and\
    \ if it returns\nan exit status of zero, command, will be executed. If command\
    \ returns an status of nonzero,\ncommand, gets skipped.\n\nFor example, if you\
    \ write\n\nsort bigdata > /tmp/sortout mv /tmp/sortout bigdata\n\nUnix® Shell\
    \ Programming, Third Edition. Unix® Shell Programming, Third Edition, ISBN: 0-672-32490-3\n\
    Prepared for architect by Louis Publishing. This download file is made for personal\
    \ use only and is subject to the Terms of Service. Any other use requires prior\
    \ written consent from the\ncopyright owner. © 2003 by Louis Publishing. Unauthorized\
    \ use, reproduction and/or distribution are strictly prohibited and violate applicable\
    \ laws. All rights reserved."
