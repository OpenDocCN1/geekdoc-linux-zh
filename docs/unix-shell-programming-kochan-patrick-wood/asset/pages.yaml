    The cd executed in cdtest had no effect on your current directory. Because the
    current directory is part of the environment, when a cd is executed from a subshell,
    the current directory of that subshell is altered. There is no way to change the
    current directory of a parent shell from a subshell. When cd is invoked, it sets
    the PWD variable to the full pathname of the new current directory,


