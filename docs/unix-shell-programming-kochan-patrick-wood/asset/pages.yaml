  md: "# Shell Summary\n\nGeneral Format: echo args\n\nThis command causes args to\
    \ be written to standard output. Each word from args is delimited by a blank space.\
    \ A newline character is written at the end. If args is omitted, the effect is\
    \ to simply skip a line.\n\nCertain backslashed characters have a special meaning\
    \ to echo as shown in Table A.8.\n\nTable A.8. echo Escape Characters\n\n| Character\
    \ | Description |\n| --- | --- |\n| \\a | Alert |\n| \\b | Backspace |\n| \\c\
    \ | The line without a terminating newline |\n| \\f | Formfeed |\n| \\n | Carriage\
    \ return |\n| \\t | Tab character |\n| \\v | Vertical tab character |\n| \\ |\
    \ Backslash character |\n| \\nn | The character whose ASCII value is n, where\
    \ n is a one-to-three-digit octal number that starts with a zero |\n\nRemember\
    \ to quote these characters so that the echo interprets them and not the shell.\n\
    \nExamples\n\n+   * echo hello\n  bin docs mail miss src\n  * echo\n\n+   * List\
    \ all files in the current directory\n  * Skip a line\n\n+   * echo 'XAY'\n  *\
    \ Y\n  * echo 'Sales Report'\n\n+   * Print X and Y, separated by a tab\n  * Skip\
    \ two lines before displaying Sales Report\n\n+   * Sales Report\n  * echo \"\
    Wake up!!\"a\"\n  Wake up !$\n\n+   * Print message and beep terminal\n\n# The\
    \ eval Command\n\nGeneral Format: eval args\n\nExecution of this command causes\
    \ the shell to evaluate args and then execute the results. This is useful for\
    \ causing the shell to effectively \"double-scan\" a command line.\n\nExample\n\
    \n```\n$ x=abc def\n$ y=$sx\n$ echo $y\n$ eval echo $y\nabc def\n$\n```\n\nAssign\
    \ sx to y\n\n# The exec Command\n\nGeneral Format: exec args\n\nUnix® Shell Programming,\
