    | $ (parameter:=value) | Substitute the value of parameter if it''s set; otherwise,
    substitute value. |

    | $ (parameter+=value) | Substitute the value of parameter if it''s set and non-null;
    otherwise, substitute value and assign it to parameter. |

    | $ (parameter*=value) | Substitute the value of parameter if it''s set; otherwise,
    substitute value and assign it to parameter. |

    | $ (parameter?:value) | Substitute the value of parameter if it''s set and non-null;
    otherwise, write value to standard error and exit. If it is omitted, write: parameter
