  md: "# Decisions, Decisions\n\nBecause the pattern matches anything (just as it's\
    \ used for filename substitution matches all the files in your directory). It's\
    \ frequently used at the end of the case as the \"catchall\" value. That is, if\
    \ none of the previous values in the case match, this one is guaranteed to match.\
    \ Here's a second version of the number program that has a catchall case.\n\n\
    ```\ni cat number\n# Translate a digit to English -- version 2\n#\nif [ \"$number\"\
    \ -ne i ];\nthen\n  echo \"Usage: number digit\"\n  exit 1\nfi\ncase \"$i\" in\n\
    \  0) echo zero;\n  1) echo one;\n  2) echo two;\n  3) echo three;\n  4) echo\
    \ four;\n  5) echo five;\n  6) echo six;\n  7) echo seven;\n  8) echo eight;\n\
    \  9) echo nine;\n  *) echo \"Bad argument; please specify a single digit\";\n\
    nesac\nis number 9\nnine\nis number 99\nBad argument; please specify a single\
    \ digit\n```\n\nHere's another program called ctype that prints the type of the\
    \ single character given as an argument. Character types are recognized digits,\
    \ uppercase letters, lowercase letters, and special characters (anything not in\
    \ the first three categories). As an added check, the program makes sure that\
    \ just a single character is given as the argument.\n\n```\ni cat ctype\n# Classify\
    \ character given as argument\n#\nif [ $# -ne i ];\nthen\n  echo Usage: ctype\
    \ char\n  exit 1\nfi\n# Ensure that only one character was typed\nchar=\"$1\"\n\
    numchars=$(echo \"$char\" | wc -c)\nif [ \"$numchars\" -ne 1 ];\nthen\n  echo\
    \ Please type a single character\n  exit 1\nfi\n# Now classify it\n```\n\nUnix®\
    \ Shell Programming, Third Edition. Unix® Shell Programming, Third Edition, ISBN:\
    \ 0-672-32490-3\nPrepared for openlinux.com users. This download file is available\
    \ for personal use only and is subject to the Terms of Service. Any other use\
