    ```


    What happened here? You end up with a horizontal list of files unless the newlines
    from ls were stored inside the filelist variable (take word for it). The newlines
    got eaten up when the value of filelist was substituted by the shell in processing
    the echo command line. Double quotes around the variable will preserve the newlines:


    ```

