  md: "# More on Parameters\n\n# Pattern Matching Constructs\n\nThe POSIX shell provides\
    \ four parameter substitution constructs that perform pattern matching. Note that\
    \ some older shells do not support this feature.\n\nIn each case, the construct\
    \ takes two arguments: a variable name (or parameter number) and a pattern. The\
    \ shell searches through the contents of the specified variable to match the supplied\
    \ pattern. If the pattern is matched, the shell substitutes the value of the variable\
    \ on the command line, with the matching portion of the pattern deleted. If the\
    \ pattern is not matched, the entire contents of the variable are substituted\
    \ on the command line. In any case, the contents of the variable remain unchanged.\n\
    \nThe term pattern is used here because the shell allows you to use the same pattern\
    \ matching characters that it accepts in filename substitution and case values:\
    \ * to match zero or more characters, [...] to match any single character from\
    \ the specified set, and ! to match any single character not in the set.\n\nWhen\
    \ you write the construct\n\n```\n$variable@pattern\n```\n\nthe shell looks inside\
    \ variable to see whether it ends with the specified pattern. If it does, the\
    \ contents of variable are substituted on the command line with the shortest matching\
    \ pattern removed from the right.\n\nIf you use the construct\n\n```\n$variable#pattern\n\
    ```\n\nthe shell once again inside variable to see whether it ends with pattern.\
    \ This time, however, it removes the longest matching pattern from the right.\
    \ This is relevant only if the * is used in pattern. Otherwise, the % and # behave\
    \ the same way.\n\nthe # is used in a similar way to force the pattern matching\
    \ to occur on the left rather than the right. So, the construct\n\n```\n$variable%pattern\n\
    ```\n\nells the shell to substitute the value of variable on the command line,\
    \ with pattern removed from the left.\n\nFinally, the construct\n\n```\n$variable##pattern\n\
    ```\n\nworks like the # form, the longest occurrence of pattern is removed from\
    \ the left.\n\nRemember that in all cases, no permanent changes are made to the\
    \ variable itself; you are affecting only what gets substituted on the command\
    \ line. Also, remember that the pattern matches anchored. In the case of the %\
    \ and # constructs, the variables must end with the specified pattern; in the\
    \ case of the # and ## constructs, the variable must begin with the left.\n\n\
    Here are some examples to show how these constructs work:\n\n```\n$ var-testcase\n\
    \ echo Svar\ntestcase\n echo $(variable)\ntestcase             Remove e from right\n\
    \             Svar               Variable is unchanged\ntestcase             Remove\
    \ smallest match from right\n echo $(var*)\n```"
