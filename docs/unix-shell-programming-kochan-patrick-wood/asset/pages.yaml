  md: "# Round and 'Round She Goes\n\nfoo -a -r -i\nlike this:\n\n```\nfoo -ari\n\
    ```\n\nusing this stacking feature.\nThe getopts also handles the case where an\
    \ option must be followed by an argument.\nFor example, the new -t option to be\
    \ added to the mon command requires a following argument.\nTo handle options that\
    \ take arguments, getopts requires at least one whitespace character\nseparate\
    \ the option from the argument. Furthermore, such options cannot be stacked.\n\
    \nTo indicate to getopts that an option takes a following argument, write a colon\
    \ after\nthe option on the getopts command line. So our mon program, which takes\
    \ -m and -t options, should call getopts like this:\n\n```\ngetopts mt: option\n\
    ```\n\nIf getopts doesn't find an argument after an option that requires one,\
    \ it stores a question mark\ninside the specified variable and writes an error\
    \ message to standard error. Otherwise, it stores the\nactual image called OPTARG.\n\
    \nOne final note about getopts: Another special variable OPTIND is used by the\
    \ command.\nThis variable is initially set to one and is updated each time getopts\
    \ returns to number the\nnext command-line argument to be processed.\n\nHere is\
    \ the third version of mon that uses the getopts command to process the command-line\n\
    arguments. It also incorporates the properly noted change to send mail to the\
    \ user running the\nprogram.\n\n```\n# cat mon\n#\n# Wait until a specified user\
    \ logs on -- version 3\n#\n# Set up default values\nmailopt=FALSE\ninterval=0\n\
    \n# process command options\nwhile getopts mt: option\ndo\n  case \"$option\"\n\
    \  in\n    m) mailopt=TRUE;\n    t) interval=$OPTARG;\n    echo) echo \"mon: [-m]\
    \ [-t] user\"\n      echo \" -m means to be informed by mail\"\n      echo \"\
    \ -t means check every secs.\"\n      exit 1;;\n  esac\ndone\n\n# Make sure a\
    \ user name was specified\nif [ \"$OPTIND\" -gt \"$\" ];\nthen\n  echo \"Missing\
