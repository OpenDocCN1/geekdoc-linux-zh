  md: '# For More Information


    David Korn, the developer of the Korn shell, maintains kshell.com. It contains
    documentation, downloads, information on books on the Korn shell, and links to
    information on other shells.


    If you want to experiment with the Korn shell, or use a system that doesn''t have
    a POSIX compliant shell, you can download the Korn shell executable for a variety
    of Unix systems for free from www.research.att.com/unix/download/


    If you only have access to Windows systems but still want to try your hand at
    shell programming, or you just want to get a taste of Unix, install the Cygwin
    package from cygwin.com. The base system includes Bash, and you can also download
    other shells as zsh. The total feel of the system is remarkably Unix, even though
    it''s running on Windows. There is an X Window System available to enhance the
    Unix look and feel. Best of all, the entire Cygwin package is free.


    # Books


    # O''Reilly & Associates


    One of the best sources of books on Unix-related topics is O''Reilly & Associates
    (www.ora.com). Their books cover a wide variety of subjects and are available
    from their Web site, from booksellers online, and in book stores. Their Web site
    also has many useful articles on Unix and Linux


