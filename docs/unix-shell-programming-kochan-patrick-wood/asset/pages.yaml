    \    sleep 60\ndone\n\n# When we reach this point, the user has logged on\n\n\
    if [ \"$mailopt\" = FALSE ];\nthen\n    echo \"$user has logged on\"\nelse\n \
    \   echo \"$user has logged on\" | mail\nfi\n```\n\nThe first test checks to see\
