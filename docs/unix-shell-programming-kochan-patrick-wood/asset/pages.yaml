    # ${parameter?:value}


    If parameter is not null, the shell substitutes its value; otherwise, the shell
    writes value to standard error and then exits (exits zero—if it''s done from your
    login shell, you will be logged off). If value is omitted, or not set


    ```

    prog: parameter null or not set

    ```


    Here''s an example from the terminal:


    ```

    PHONEBOOK-

    $ (PHONEBOOK:"PHONEBOOK file")

    No PHONEBOOK file!

    $ (PHONEBOOK?:)

    Don''t give a value

    sh: parameter null or not set $

    ```


    With this construct, you can easily check whether a set of variables named by
    a program are all set and null, in


    ```

    $ (TOOLS?) $(EXTFOOLS?) $(TOBLIN?)

    ```


    # ${parameter:+value}


    This one substitutes value if parameter is not null; otherwise, it substitutes
    nothing.


    ```

    tracecept-

    $ echo options:$(tzacept:"trace mode")

    options: trace mode

    tracecept-

    $ echo options:$(tzacept:"trace mode")

    options: $

    ```


    The value part for any of the constructs in this section can be a command substitution;
    it''s executed by the shell only if its value is used to be in.


    ```

    WORKDIR=$(DBDIR:-$(pwd))

    ```


    WORKDIR is assigned the value of DBDIR if it''s not null; otherwise, the pwd command
    is executed and the result assigned to WORKDIR. pwd is executed only if$DBDIR
    is null.


