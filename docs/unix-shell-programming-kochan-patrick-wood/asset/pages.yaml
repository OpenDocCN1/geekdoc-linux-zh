  md: '# What Is the Shell?


    program-name arguments


    The line that is typed to the shell is known more formally as the command line.
    The shell scans the command line and determines the name of the program to be
    executed and what arguments to pass to the program.


    The shell uses special characters to determine where the program name starts and
    ends, and where each argument starts and ends. These characters are collectively
    whitespace characters, and the space character, the horizontal tab character,
    and the end-of-line character, known more formally as the newline character. Multiple
    occurrences of whitespace characters are simply ignored by the shell. When you
    type the command


    ```

    mv tmp/mazewers games

    ```


    the shell scans the command line and takes everything from the start of the shell
    to the first white space character as the name of the program to execute: mv.
    The set of characters up to the next whitespace character is the first argument
    to mv: tmp/mazewers. The set of characters up to the next whitespace character
    (known as a word to the shell)—in this case, the newline—is the second argument
    to mv: games. After analyzing the command line, the shell then proceeds to execute
    the mv command, giving it the two arguments tmp/mazewers and games (see Figure
    3.9).


    ![](img/f721b95d36c075f0637b85b379ede747_46_0.png)


    Figure 3.9: Execution of mv with two arguments.


    As mentioned, multiple occurrences of whitespace characters are ignored by the
    shell. This means that when the shell processes this command line:


    ```

    echo      when    do    we    eat?

    ```


    it passes four arguments to the echo program: when, do, we, and eat (see Figure
    3.10).


    ![](img/f721b95d36c075f0637b85b379ede747_46_1.png)


    Figure 3.10: Execution of echo with four arguments.


    Because echo takes its arguments and simply displays them at the terminal, separating
    each by a space character, the output from the following becomes easy to understand:


    ```

    echo      when    do    we    eat?

    when do we eat?

    ```


    The fact is that the echo never sees these blank spaces; they have been "gobbled
    up" by the shell. When we discuss quotes in Chapter 6, "Can I Quote On That?,
    you''ll see how you can include blank spaces in arguments to programs.


