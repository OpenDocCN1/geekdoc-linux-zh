    # Tilde Substitution


    Each word and variable on a command line is checked to see whether it begins with
    an unquoted ~. If it exists, the rest of the word or variable to a / is considered
    a login name and is looked up in a system file, user home directory replaces the
    ~ and login name. If that user does not exist, the text is unchanged. A ~ by itself
    or followed by a / is replaced by the HOME variable.


    # Arithmetic Expressions


    General Format: $ ( expression )


    The shell evaluates the integer expression. expression can contain constants,
    shell variables (which don''t have to be preceded by dollar signs), and operators.
    The operators, in order of decreasing precedence, are


    +   - unary minus

    - bitwise NOT

    - logical negation

    - multiplication, division, remainder

    - addition, subtraction

    - left shift, right shift

    - <= >= <

    - comparison

    - equal, not equal

    - bitwise AND

    - bitwise exclusive OR

    - bitwise OR

    - logical AND

    - logical OR

    - expr1 ? expr2 : expr3

    - conditional operator

    - =, ,,, ;, =

    - assignment

    - +=, <<, >>, &=

    - ^, |


    Examples


    Parentheses by themselves is zero (true) if the last expression is nonzero and
    one (false) if the last expression is zero.


    The C operators sizeof, ++, and -- may be available in your shell implementation
    but are not required by the standard.


