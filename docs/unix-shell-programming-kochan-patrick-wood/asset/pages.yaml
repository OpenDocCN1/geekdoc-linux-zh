    # The Exit Status from read


    read returns an exit status of zero unless an end of file is detected on the input.
    If the data is coming from the terminal, this means that Ctrl+D has been typed.
    If the data is coming from a file, it means there''s no more data to read from
    the file.


    Knowing about the exit status returned by read makes it easy to write a loop that
    will read any number of lines of data from a file or from the terminal. The next
    program, called addi, reads in lines containing pairs of integers. Each pair of
    numbers is summed, and the result written to standard output.


    ```

    # addi

    #

    # add pairs of integers on standard input

    while read n1 n2

    do

    echo $((n1 + n2))

    d

    ```


    The while loop is executed as long as the read command returns an exit status
    of zero; that is, as long as there''s still data to read. Inside the loop, the
    two values read from the line (presumably integers--no error checking is done
    here) are summed and the result written to output by echo.


    ```

    # addi

    10 25

    35

    -5 12

    7

    123 3

    126

    $

    ```


    It goes without saying standard input for addi can be redirected, as can standard
    output:


    ```

    # cat data

    1234 7940

    591 -505

    395 304

    3214 599

    -394 -491

    # addi < data > sums

    # cat sums

    9194

    -2

    699

    4233

    -887

    $

    ```


