  md: "# Shell Summary\n\nThis command causes the positional parameters $1, $2, ...,\
    \ $n to be \"shifted left\" one place. That is, $2 is assigned to $1, $3 to $2,\
    \ ..., and $n to $n-1. # is adjusted accordingly.\n\nIf the format\n\n```\nshift\
    \ n\n```\n\nis used instead, the shift is to the left n places.\n\nExamples\n\n\
    +   * set a b c d\n* echo $#ns*\n  4\n* a b c\n* shift\n* echo $#ns*\n  3\n* b\
    \ d\n* shift 2\n* echo $#ns*\n  2\n* d\n\n# The Test Command\n\nGeneral Format:\n\
    \ntest condition\n\nor\n\n[ condition ]\n\nThe shell evaluates condition and if\
    \ the result of the evaluation is TRUE, returns a zero exit status. If the result\
    \ of the evaluation is FALSE, a nonzero exit status is returned. If the format\
    \ [ condition ] is used, a space must appear immediately after the [ and before\
    \ the ].\n\ncondition is composed of one or more operators as shown in Table A.11.\
    \ The -operator has higher precedence than the -o operator. In any case, parentheses\
    \ can be used to group subexpressions. Just remember that the parentheses are\
    \ significant to the shell and must be quoted. operands (including parentheses)\
    \ must be delimited by one or more spaces so that test sees them as arguments.\n\
    \ntest is often to test conditions in an if, while, or until command.\n\nExamples\n\
    \n```\n# see if perms is executable\nif test -x /etc/perms\nthen\n...\n# see if\
    \ it's a directory or a normal file that's readable\nif [ -d sfile -o \\ -f sfile\
    \ -r sfile ]\nthen\n...\n```\n\nUnix® Shell Programming, Third Edition. Unix®\
    \ Shell Programming, Third Edition, ISBN: 0-672-32490-3\n\nPrepared for architect@openservice.\
    \ This download file is available for personal use only and is subject to the\
    \ Terms of Service. Any other use requires prior written consent from the copyright\
    \ over. Unauthorized use, reproduction and/or distribution are strictly prohibited\
    \ and violate copyright. All rights reserved."
