    # The alias Command


    An alias is a shorthand notation provided by the shell to allow customization
    of commands. The shell keeps a list of aliases that is searched when a command
    is entered. If the first word of a line is an alias, it is replaced by the text
    of the alias. An alias is defined by the alias command. The format is


    ```

    alias name=string

    ```


    where name is the name of the alias, and string is any string of characters. For
    example,


    ```

    alias ls=''ls -l''

    ```


    assigns ls = -l to the alias ls. Now when the alias ls is typed in the shell,
    the shell replaces it with ls -l. You can pass arguments after the alias name
    on the command line, as in


    ```

    ls -l *

    ```


    which looks like this alias substitution has been performed:


    ```

    ls -l *

    ```


    The shell performs its normal command-line processing both when the alias is set
    and when it is used, so quoting can be tricky. For example, recall that the shell
    keeps track of your working directory inside a variable called PWD:


