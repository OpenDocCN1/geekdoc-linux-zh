    # Input Redirection


    As just as the output of a command can be redirected to a file; so the input of
    a command be

    redirected from a file. And as the greater-than > is used for output redirection,
    the less-

    character < is used to redirect the input of a command. Of course, only commands
    that normallyntake input from standard input can have their input redirected from
    a file in this manner.


    To redirect the input of a command, you use the < character followed by the name
    of the file that

    t input is to be read from. So, for example, you can count the number of lines
    in the file users, you

    know that you can execute the command wc -l users:


    ```

    $ wc -l users

    2 users

    $

    ```


    Note that there is a difference in the output produced by the two forms of the
    wc command. In the

    first case, the name of the file users is listed with the line count; in the second
    case, it is not. This\points out the subtle distinction between the execution
    of the two commands. In the first case, we

    know that it is reading its input from the file users. In the second case, it
    only knows that it

    reading its input from standard input. The shell redirects the input so that it
    comes from the file

    users and not the terminal (more about this in the next chapter). As far as wc
    is concerned, it doesn''t

    know whether its input is coming from the terminal or from a file!


    # Pipes


    As you will recall, the file users that was created previously contains a list
    of all the users currently

    logged in to the system. Because you know that there will be one line in the file
    for each user logged

    to the system, you can easily determine the number of users logged in by simply
    counting the

    number of lines in the file users:


    ```

    $ wc > users

    $ wc -l < users

    $

    ```


