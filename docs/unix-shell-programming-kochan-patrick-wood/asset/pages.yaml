  md: '# Your Environment


    ![](img/f721b95d36c075f0637b85b379ede747_187_0.png)


    To summarize the local and exported variables work:


    +   - Any variable that is not exported is a local variable whose existence will
    not be known to subshells.

    - Exported variables and their values are copied into a subshell''s environment,
    where they may be accessed and changed. However, such changes have no effect on
    the variables in the parent shell.

    - Exported variables retain this characteristic not only for directly spawned
    subshells, but also for subshells spawned by those subshells (and so on down the
    line).

    - A variable can be exported before or after it is assigned a value.


    export -p


    If you simply type -p, you''ll get a list of the variables and those you exported
    by your shell:


    ```

    $ export -p

    EXPORT LOGHOME=/archive

    EXPORT PATH=/usr/bin:

    EXPORT TIMEOUT=600

    EXPORT TZ=TZ53EDT

    export y=5

    ```


    As you can see, there are actually more exported variables here than initially
    led to believe. Note that y shows up on the list, together with other variables
    that were exported when you logged on.


    Note that the variables listed include those that have been inherited from a parent
    shell.


