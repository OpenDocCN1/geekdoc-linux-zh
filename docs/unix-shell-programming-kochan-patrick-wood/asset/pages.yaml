  md: '# Other Ways to Access Your History


    There are several other ways to access your command history that are worth noting.


    # The history Command


    The operation of the history command differs between the Korn shell and Bash because
    it is not part of the POSIX standard.


    The Korn shell history writes your last 16 commands to standard output:


    ```

    $ history

    507 cd shell

    508 cd child

    509 vi in

    510 ps

    511 echo HISTSIZE

    512 cat /etc

    513 cp int.sv

    514 history

    515 exit

    516 cd shell

    517 cd child

    518 vi all

    519 run -n5 all

    520 ps

    521 lpr all.out

    522 history

    ```


    The numbers to the left are simply relative command numbers (command number 1
    would be the first, or oldest, command in your history).


    Without any arguments, the Bash history command lists your entire history (as
    specified by the HISTSIZE variable) to standard output. If you want to see the
    last few commands, you must specify the number of commands to display as an argument:


    ```

    $ history 10

    512 cp int.sv

    513 history

    514 exit

    515 cd shell

    516 cd child

    517 vi all

    518 run -n5 all

    519 ps

    520 lpr all.out

    521 history

    ```


    # The fc Command


    The fc command allows you to start up an editor on one or more commands from your
    history to simply write a list of history commands to your terminal. In the latter
    form, which is indicated by the -l option to fc, it is like typing in history,
    only more flexible (you can specify a range of commands to be listed or get fewer
    or more than the last 16 commands listed). For example, the command


    ```

    $ fc -l 510 515

    ```


    writes commands 510 through 515 to standard output, whereas the command


    ```

    $ fc -n -1 -20

    ```'
