    In this chapter you''ll learn about shell features that are either useful to interactive
    users or not part of the POSIX shell standard. These features are available in
    Bash and the Korn shell, the two most commonly available POSIX-compliant shells.


    The Korn shell was developed by David Korn of AT&T Bell Laboratories. It was designed
    to be "upward compatible with the System V Bourne shell and the POSIX shell standard.
    It is available in the standard Unix distributions from Sun, HP, and IBM, and
    is the default shell on MIPS workstations.


    Bash (for Bourne-Again Shell) was developed by Brian Fox for the Free Software
    Foundation. It was also designed to be upward compatible with the System V Bourne
    shell and the POSIX shell standard, and also contains many extensions from the
    Korn and C shells. Bash is the standard shell on Linux systems.


    Except for a few minor differences, Bash and the Korn shell provide all the POSIX
    standard''s features, as well as many new ones. To give you an idea of the compatibility
    of these shells with the POSIX standard, all programs in the previous chapters
    work both Bash and the Korn shell.


