  md: '# Appendix B. For More Information


    IN THIS APPENDIX


    +   - Online Documentation

    - Documentation on the Web

    - Books


    Many sources of information on the Unix system are available; however, we have
    selectively listed some titles and Web sites here that of particular value to
    shell programmers. All Web sites and URLs are valid as the publication of this
    book, but as is often the case on the Internet, some may not be available by the
    time you read this.


    There is one reference that you cannot do. This is the Unix documentation for
    your particular system. It gives detailed descriptions on the syntax and various
    options for each of the commands.


    # Online Documentation


    If a printed version of your system''s documentation isn''t available, you can
    use the man command to get information (referred to as the "man pages" by Unix
    users) about any specific Unix command. The format is


    ```

    man command

    ```


    Some systems have an interactive documentation called info. To invoke it, simply
    type info. After it starts up, just type h for a tutorial.


    Note that some smaller systems may not have online documentation due to disk space
    limitations. However, all this information is also available on the Web and in
    printed form.


    # Documentation on the Web


    The authors of this book maintain the Web at www.kochan-wood.com. You can download
    the role program; get answers to the exercises; and find out more about Unix,
    the C programming language, and programming there.

    The best place on the Web for documentation on the POSIX standard is at www.open.org.
    This site is maintained by The Open Group, an international consortium that worked
    with the IEEE to create the current POSIX specification is available on its Web
    site. You must register first to read it, registration is free. The URL for accessing
    the documentation is www.open.org/html. You can also purchase for a printable
    copy of the Open Group Unix documentation at www.open.org/pubs/catalog/inf.html.
    (The standards are only available for download or on CD-ROM, although you may
    still be able to find some older, out-of-print hard copies at Amazon.com).


    The Free Software Foundation maintains online documentation for a variety of Unix
    utilities, including Bash, at www.fsf.org/manual.'
