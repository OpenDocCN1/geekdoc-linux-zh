  md: "# Decisions, Decisions\n\nThe format of date's output is fixed, a fact that\
    \ you can use to your advantage when writing greetings because this means that\
    \ the time will always appear in character positions 12 through 19. Actually,\
    \ for this program, you only need the hour displayed in positions 12 and 13. So\
    \ to get the hour from date, you can write\n\n```\n$ date | cut -c12-13\n10\n\
    $\n```\n\nNow the task of writing the greetings program is straightforward:\n\n\
    ```\n$ cat greetings\n#\n# Program to print a greeting\n#\nhour=$(date | cut -c12-13)\n\
    \nif [ \"$hour\" -ge 0 -a \"$hour\" -le 11 ];\nthen\n    echo \"Good morning\"\
    \nelse\n    if [ \"$hour\" -ge 12 -a \"$hour\" -le 17 ];\n    then\n        echo\
    \ \"Good afternoon\"\n    else\n        echo \"Good evening\"\nfi\n```\n\nIf hour\
    \ is greater than or equal to 0 (midnight) and less than or equal to 11 (up to\
    \ 11:59:59), “Good morning” is displayed. If hour is greater than or equal to\
    \ 12 (noon) and less than or equal to 17 (up to 5:59:59 p.m.), “Good afternoon”\
    \ is displayed. If neither of the preceding two conditions is satisfied, “Good\
    \ evening” is displayed.\n\n```\n$ greetings\nGood morning\n$\n```\n\nAs noted,\
    \ the nested if command sequence used in greetings is so common that a special\
    \ elif construct is available to more easily express this sequence. The general\
    \ format of this construct is\n\n```\nif command;\nthen\n    command\n    ...\n\
    elif command2;\nthen\n    command\n    ...\nelif command3;\nthen\n    command\n\
    \    ...\nelelse\n    command\n    ...\nfi\n```\n\nUnix\\00 Shell Programming,\
    \ Third Edition. Unix\\00 Shell Programming, Third Edition, ISBN: 0-672-3290-3\n\
    \nCopyright © 2003 Prentice Publishing. This download file is made available for\
    \ personal use only and is subject to the Terms of Service. Any other use requires\
    \ prior written consent from the copyright owner. Unauthorized use, reproduction\
    \ and/or distribution are strictly prohibited and violate applicable laws. All\
    \ rights reserved.\n\n![](img/f721b95d36c075f0637b85b379ede747_133_0.png)"
