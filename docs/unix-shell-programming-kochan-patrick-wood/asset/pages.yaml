    # Order of Search


    It''s worth listing the ordering of which shell uses when you type a command name:


    +   1. The shell first checks to see whether the command is a reserved word (such
    as for and do).

    2. If it''s not a reserved word and not quoted, the next shell checks its alias
    list, and if it finds a-match, performs the substitution. If the alias definition
    ends in a space, it attempts alias subst-tion on the name. The final result is
    then checked against the reserved word list, and if it''s not a reserved word,
    the shell proceeds to step 3.

    3. Next, the shell checks to check the command against its function list and executes
    it if found.

    4. The shell checks to see whether the command is a built-in command (such as
    cd and pwd).

    5. Finally, the shell searches the PATH to locate the command.

    6. If the command still is not found, a "command not found" error message is issued.


