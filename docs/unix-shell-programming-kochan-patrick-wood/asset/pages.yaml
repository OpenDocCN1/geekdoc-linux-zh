    name() { command, command, ...command; }


    where name is the name of the function defined to the current shell (functions
    can''t be exported). The function definition can span as many lines as necessary.
    A return command can be executed to cause execution of the function to be terminated
    without also terminating the shell (see the return command description).


    For example,


    ```

    nf() { ls | wc -l; }

    ```


    defines a function called nf to count the number of files in your current directory.


    # Job Control


    Shell Jobs

    Every command sequence run in the background is assigned a job number. The lowest
    available number not in use is assigned. A job may be referred to by a job ID,
    which is as followed by the job number, followed by the first letters of the filename,
    or by ? string. The following built-in commands may be given as an argument: kill,
    fg, bg, and wait. The conventions & and % refer to the current and previous jobs,
    respectively; % refers to the current job. The current job is the most recent
    job in the background or the job running in the foreground. The previous job is
    the previous job. The convention $string refers to the job whose name contains
    string; $$string refers to the job whose contains string. The jobs command may
    be used to list the status of all running jobs.


    If the monitor option of the set command is turned on, the shell prints a message
    when each job finishes. If you have jobs running when you try to exit the shell,
    a message is printed to alert you of. If you immediately try to exit the shell,
    the exit monitor is enabled by default for interactive shells.


    # Stopping Jobs


    If the shell is running on a system with job control, and the monitor option of
    the set command is turned on, jobs that are running in the foreground may be placed
    in the background and vice versa. Ctrl+z stops the current job. The bg command
    stops a job in the background. The fg command brings a background or stopped job
    to the foreground.


    Whenever a job in the background attempts to read from the terminal, it is stopped
    until it is brought to the foreground. Output from background jobs normally comes
    to the terminal. If kitty is executed, output from background jobs is disabled,
    and a job writing to the terminal is stopped until it is brought to the foreground.
    When the shell exits, all stopped jobs are killed.


    # Command Summary


    This section summarizes the shell''s built-commands. Actually, some of these commands
    (as echo and test) are not built into the shell but must be provided as a utility
    by a POSIX-compliant system. They are built in Bash and the Korn shell and are
    so often used in shell scripts that we decided to list them here anyway.


    The following commands are organized alphabetically for easy reference.


