    The only stipulation on linking files is that for ordinary links, the files to
    be linked together must reside on the same file system. If they don''t, you''ll
    get an error in you try to link them. To determine the different file systems
    on your system, execute the df command. The first field on each line of output
    is the name of a file.


    To create links on different file systems (or perhaps on different networked systems),
    you can use the -s option to the ln command. Symbolic link behaves like a normal
    link, except the symbolic link points to the original file; if the original file
    is removed, the symbolic link no longer works. Let''s see how symbolic links work
    with the previous example:


    ```

    $ rm wb

    $ ls -l

    total 6

    -lrwxr-xr-x 1 pat 38322 1358 Jan 15 11:01 loc

    -lrwxr-xr-x 1 pat 38322 504 Apr 21 18:30 xtr

    symbolic link to wb

    $ ls -l

    total 6

    -lrwxr-xr-x 1 pat 38322 1358 Jan 15 11:01 locat

    -lrwxr-xr-x 1 pat 38322 15 Jul 20 15:22 symb -> /users/steve/wb

    -lrwxr-xr-x 1 pat 38322 504 Apr 21 18:30 xtr

    ```


    Note that pat is listed as the owner of symb, and the file type is 1, which indicates
    a symbolic link. The size of the symbolic link is 5 (the file actually contains
    the string/steve/wb), but if we attempt to access the contents of the file, we
    are presented with the contents of its symbolic link, /users/steve/wb:


    ```

    $ rm /users/steve/wb  Assume pat can remove this file

    $ ls -l

    total 5

    -lrwxr-xr-x 1 pat 38322 1358 Jan 15 11:01 loc

    -lrwxr-xr-x 1 pat 38322 15 Jul 20 15:22 wb -> /users/steve/wb

    -lrwxr-xr-x 1 pat 38322 504 Apr 21 18:30 xtr

    $ rm wb

    Cannot open wb: No file or directory

    ```


    Removing the file that a symbolic link points to invalidates the symbolic link
    (because symbolic links are maintained as filenames), although the symbolic link
    continues to stick:


    This type of file is called dangling symbolic link and should be removed unless
    you have a specific reason to keep it around (for example, if you intend to replace
    the file).


