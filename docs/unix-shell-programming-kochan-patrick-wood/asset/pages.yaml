  md: '# Decisions, Decisions


    Getting back to the if, to echo the message “Would you like to play a game?” if
    name contains the characters julio, you would write your if command like this:


    ```

    if test "$name" = jul

    echo "Would you like to play a game?"

    ```


    ( is it better to play it safe and echo the message that is displayed by echo
    inside quotes?) When the if command gets executed, the command that follows the
    if is executed, and its exit status is tested. The test command passes the three
    arguments $name (with its value substituted, of course), =, and then tests to
    see whether the first argument is identical to the third argument and returns
    a zero exit status if it is or a nonzero exit status if it is not.


    The exit status returned by test is then tested. If it''s zero, the commands between
    then and fi are executed; in this case, the single echo command is executed. If
    the exit status is nonzero, the echo command is skipped.


    It''s good programming practice to enclose shell variables that are arguments
    to test inside a pair of double quotes. This ensures that test sees the argument
    in the case where its value is null. For example, consider the following example:


    ```

    $name = set null

    $ test $Name = jul

    ish: argument expected

    ```


    Because name was null, only two arguments were passed to test: = julio because
    the shell substituted the value of name before parsing the command line into arguments.
    In fact, after $name was substituted by the shell, it was as if you typed the
    following:


    ```

    test = julio

    ```


    When executed, it saw only two arguments (see Figure 8.1) and therefore issued
    the error message.


    ![](img/f721b95d36c075f0637b85b379ede747_122_0.png)


    Figure 8.1. test $name = julio with name null.


    By placing double quotes around the variable, you ensure that test sees the argument
    correct as a “placeholder” when the argument is null.


    ```

    $ test "$Name" = julio

    echo $ ?

    ```


    Even if name is null, the shell still passes three arguments to test, the first
    one null (see Figure 8.2).


