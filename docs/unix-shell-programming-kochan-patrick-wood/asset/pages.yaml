  md: '# A Program to Remove Someone from the Phone Book


    No set of programs that enable you to look up or add someone to the phone book
    would be complete without a program to remove someone from the phone book. We
    will call the program rem and have it as its argument the name of the person to
    be removed. What should the strategy for developing the program? Essentially,
    you want to remove the line from the file that contains the specified name. The
    -v option to grep can be used here because it prints lines from a file that don''t
    match:


    ```

    $ cat rem

    # Remove someone from the phone book

    $ grep -v "$1" phonebook > /tmp/phonebook

    $ mv /tmp/phonebook phonebook

    ```


    The grep writes all lines that don''t match the file to /tmp/phonebook. After
    the grep is done, the old phone book is replaced by the new one from /tmp.


    ```

    $ rem Stromboli Pizza"

    $ cat phonebook

    Alice Cheeba 973-555-2015

    Barbara Swingle 201-555-8257

    Billy Bach 201-555-7618

    Liz Stachiah 212-555-2298

    Susan Goldberg 201-555-9979

    Susan Tepple 212-555-4932

    Tommy Inanni 973-555-1295

    $ rem Susan

    ```


    The first case, where Stromboli Pizza was removed, worked fine. In the second
    case, however, both entries were removed because they both matched the pattern.
    You can use the program to add them back to the phone book:


    ```

    $ add "Susan Goldberg" 201-555-7776

    $ add "Susan Tepple" 212-555-4932

    ```


    In Chapter 8, ‘Decisions, Decisions,’ you’ll learn how to determine whether more
    than one matching entry is found and if that is the case. For example, you might
    want to alert the user that more than one match has found and further qualification
    of the name is required. (This can be very helpful, because most implementations
    of grep will everything if an empty string is passed as the parameter).


    Incidentally, leaving this program, note that sed could also be used to delete
    the matching entry. In such case, the grep could be replaced with


    ```

    sed "s/$1/" phonebook > /tmp/phonebook

    ```


    > /tmp is a directory on all Unix systems that It’s used by programs to create
    ‘temporary’ files. Each time the system reboots, all the files in /tmp are usually
    removed.


