    # sort


    You''re familiar with the basic operation of sort:


    By default, sort takes each line of the specified input file and sorts it into
    ascending order. Special characters are sorted according to the Internal encoding
    of the characters. For example, on a machine that encodes characters in ASCII,
    the space character is represented internally as the number 32, and a double quote
    as the number 34. This means that the former would be sorted before the latter.
    Note that the sorting order is implementation dependent, although you are generally
    assured that sort will perform as expected on alphabetic input, the ordering of
    numbers, punctuation, and special characters is not always guaranteed. We assume
    we''re working with the ASCII character set in all our examples here.


    sort has many options that provide more flexibility in performing your sort. We''ll
    describe a few of the options here:


    # The -u Option


    The -u option sorts to eliminate duplicate lines from the output.


    +   $ sort -u names

    Charlie

    Emmanuel

    Fred

    Lucy

    Ralph

    Tony

    $


    Here you see that the duplicate line contained Tony was eliminated from the output.


    # The -r Option


    Use the -r option to reverse the order of the sort:


    +   $ sort -r names Reverse sort

    Tony

    Ralph

    Lucy

    Fred

    Emmanuel

    Charlie

    $


    # The -o Option


    By default, sort writes the sorted data to standard output. To go it into a file,
    you can use output redirection:


