  md: "# Decisions, Decisions\n\ncommand, command,..., command, are executed in turn\
    \ and their exit statuses. As soon one returns an exit status of zero, the commands\
    \ listed after the then that follows are executed up to another elif,else, or\
    \ fi. If none of the commands returns a zero exit status, the commands listed\
    \ after the optional else are executed.\n\nYou could rewrite the greetings program\
    \ using this new format as shown:\n\n```\n# cat greetings\n# Program to print\
    \ a greeting -- version 2\n#\nhour=\"$(date | cut -c12-13\")\n\nif [ \"$hour\"\
    \ -ge \"06\" -le \"11\" ]; then\nthen\n    echo \"Good morning\"\nelif [ \"$hour\"\
    \ -ge \"12\" -le \"17\" ];\\nthen\n    echo \"Good afternoon\"\nelse\n    echo\
    \ \"Good evening\"\nfi\n```\n\nThis version is easier to read, and it doesn't\
    \ have the tendency to disappear off the right margin due to excessive indentation.\
    \ Incidentally, you should note that date provides a wide assortment of options.\
    \ One of these, %H, can be used to get the hour directly from date:\n\n+   * date\
    \ +%H\n10\n1\n\nAs an exercise, you should change greetings to make use of this\
    \ fact.\n\n# Yet Another Version of rem\n\nAnother way to add some robustness\
    \ to the rem program would be to check the number of entries that matched before\
    \ doing the removal. If there's more than one match, you could issue a message\
    \ to the effect and terminate execution of the program. But how do you determine\
    \ the number of matching entries? One approach is to do a normal grep on the phonebook\
    \ file and count the number of matches that came out with. If the number of matches\
    \ is greater than one, the appropriate message can be issued.\n\n```\n# cat rem\n\
    # Remove someone from the phonebook -- version 3\n#\nif [ \"$1\" -ne 1 ]; then\n\
    then\n    echo \"Incorrect number of arguments\"\n    echo \"Usage: rem name\"\
    \n    exit 1\nfi\nname=$1\n```\n\n+   * Find matching of entries\nmatches=$$(grep\
    \ \"$name\" phonebook | -l)\n\nUnix® Shell Programming, Third Edition. Unix® Shell\
    \ Programming, Third Edition, ISBN: 0-672-32490-3\n\nPrepared for @open.source.com.\
    \ This download file is made available for personal use only and is subject to\
    \ the Terms of Service. Any other use requires prior written consent from the\
    \ copyright owner © 2003 Prentice Hall Publishing. Unauthorized use, reproduction\
    \ and/or distribution are strictly prohibited and violate applicable laws. All\
    \ rights reserved."
