  md: "# Decisions, Decisions\n\n```\n$ ctype u\nlowercase letter\n$ ctype ''\nspecial\
    \ character\n$ ctype xx\nnPlease type a single character\n\n```\n\n# Back to the\
    \ case\n\nThe symbol has the effect of a logical OR when used between two patterns.\
    \ That is, the pattern\n\n```\npat1 | pat2\n```\n\nspecifies that either pat1,\
    \ or pat2 is to be matched. For example,\n\n```\n-1 | -list\n```\n\nmatches either\
    \ the value -1 or -list, and\n\n```\ndmd 5620 | tty5620\n```\n\nmatches either\
    \ dmd 5620 or tty5620 can be rewritten to use a case state-\nment rather than\
    \ the if-else. Here is a version of the program. This time, we took advantage\n\
    of the fact that the date with the %H option writes a two-digit hour to standard\
    \ output.\n\n```\n$ cat greetings\n#\n# Program to print a greeting -- case version\n\
    \nhour=$(date +%H)\n```\n\n```\ncase $hour\nin\n  07 | [1[0]] echo \"Good morning\"\
    ;\n      echo \"Good afternoon\";\n  1[2-7]      echo \"Good evening\";\nesac\n\
    \n```\n\nThe two-digit hour obtained from date is assigned to the shell variable\
    \ hour. Then the case state-\nment is executed. The value of hour is compared\
    \ against the first pattern:\n\n```\n07 | [1[0]]\n```\n\nmatches any value that\
    \ starts with a zero followed by any character (midnight through 9:00\na.m.),\
    \ or any value that starts with an one and is followed by a zero or one (10:00\
    \ or 11:00 a.m.).\nThe second pattern\n\n```\n1[[2-7]]\n```\n\nmatches a value\
    \ that starts with an one and is followed by any one of the digits two through\
    \ seven\n(noon through 5:00 p.m.).\n\nThe last case, the catchall, matches anything\
    \ else (6:00 p.m. through 11:00 p.m.).\n\nUnix® Shell Programming, Third Edition.\
    \ Unix® Shell Programming, Third Edition, ISBN: 0-672-32490-3\nPrepared for credit@open.services.\
    \ This download file is made available for personal use only and is subject to\
    \ the Terms of Service. Any other use requires prior written consent without\n\
    copyright © 2003 by Squid Publishing. Unauthorized use, reproduction and/or distribution\
    \ are strictly prohibited and violate applicable laws. All rights reserved.\n\n\
    * Uint"
