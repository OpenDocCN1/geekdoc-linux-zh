  md: "# Interactive and Nonstandard Shell Features\n\n$ who -l & \n[1] 032\n$\n\n\
    When a job finishes, the shell prints the message\n\n```\n$ [n] + sequence\n```\n\
    \nwhere n is the number of the job finished, and sequence is the text of the command\
    \ sequence used to create the job.\n\nThe jobs command may be used to print the\
    \ status of jobs that haven't yet finished.\n\n```\n$ jobs \n[2] + Running make\
    \ bah & \n[1] Running monitor &\n[1] Running pic chapcht | troph > aps.out\n```\n\
    \nThe + - after the job number mark the current and previous jobs, respectively.\
    \ The current job is the last job sent to the background, and the previous job\
    \ is the next-to-last job sent to the background. Built-in commands may be given\
    \ a job number or the current or previous jobs as arguments.\n\nThe shell's built-in\
    \ command can be used to terminate a job in the background. The argument to it\
    \ can be a process number or a percent sign (%) followed by a job number, a +\
    \ (current job), a - (previous job), or another % (current job).\n\n```\n$ pic\
    \ chapcht i | troph > aps.out & \n$ jobs \n[2] + Running | troph > aps.out & \n\
    $ kill ! \n[1] Done pic chapcht | troph > aps.out\n```\n\nThe preceding kill could\
    \ have used %+ or %% to refer to the same job.\n\nThe first characters of the\
    \ command sequence can also be used to refer to a job; for example, kill %% would\
    \ have worked in the preceding example.\n\n# Stopped Jobs and the eg and bg Commands\n\
    \nIf you are running a job in the foreground (without &) and you want to suspend\
    \ it, you can press the Ctrl+z key. The job stops execution, and the shell prints\
    \ the message\n\n```\n$ [n] Stopped (SIGTSTP) sequence\n```\n\nThe stopped job\
    \ is the current job. To continue execution, you must use the eg or bg command.\
    \ The eg command with arguments causes the current job to resume execution in\
    \ the foreground, and bg causes the job to resume execution in the background.\
    \ You can also use a job number with the eg or bg, a +, -, or a % preceded by\
    \ a to specify any job to the eg and bg commands. These commands print the command\
    \ sequence to remind you what is brought to the foreground or sent to the background.\n\
    \n```\n$ troph memo | photo \nCtrl+z \n[1] Stopped (SIGTSTP) troph memo | photo\
    \ \n$ bg \n[1] troph memo photo &\n```"
