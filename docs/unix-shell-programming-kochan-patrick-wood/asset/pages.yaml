    # uniq


    The uniq command is useful when you need to find duplicate lines in a file. The
    basic format of the command is


    ```

    uniq in_file out_file

    ```


    If out_file is not specified, the result will be written to standard output. If
    in_file is also not specified, uniq acts as a filter and reads its input from
    standard input.


    Here are some examples to see how uniq works. Suppose that you have a file called
    names with contents as shown:


    ```

    $ cat names

    Charlie

    Tony

    Emanuel

    Lucy

    Ralph

    Fred

    Tony

    I

    ```


    You can see that the name Tony appears twice in the file. You can use uniq to
    "remove" such duplicate entries:


    ```

    Print unique lines

    $ uniq names

    Charlie

    Tony

    Emanuel

    Lucy

    Ralph

    Fred

    Tony

    I

    ```


    Tony still appears twice in the preceding output because the multiple occurrences
    are not consecutive in the file, and thus uniq''s definition of duplicate is not
    satisfied. To remedy this situation, sort is often used to get the duplicate lines
    adjacent to each other. The result of the sort is then run through uniq:


