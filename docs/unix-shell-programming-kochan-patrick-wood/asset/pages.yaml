    \ input file. To make the changes permanent, you must redirect the output\nfrom\
    \ **sed** into a temporary file and then move the file back to the old one:\n\n\
    ```\n$ sed 's/Unix/UNIX/' > intro temp Make And make permanent\n mv temp intro\n\
    ```\n\nAlways make sure that the correct changes were made to the file before\
