    ```


    The output verifies that each name is separated from each phone number by a tab
    character. sed is covered in more detail shortly.


    # paste


    The paste command is the inverse of cut: Instead of breaking lines apart, it puts
    them together. The general format of the paste command is


    ```

    paste files

    ```


    where corresponding lines from each of the specified files are "pasted" together
    to form single lines that are then written to standard output. The dash character
    - can be used in files to specify that input is from standard input.


    Suppose that you have a set of names in a file called names:


    ```

    $ cat names

    Tony

    Manuel

    Lucy

    Ralph

    Fred

    ```


    Suppose that you also have a file called numbers that contains corresponding phone
    numbers for each name in names:


