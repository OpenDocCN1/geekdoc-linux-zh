  md: "# More on Parameters\n\n# The $0 Variable\n\nWhenever you execute a shell program,\
    \ the shell automatically stores the name of the program inside the special variable\
    \ $0. This can be used to advantage when you have two or more programs that are\
    \ linked under different names and you want to know which one was executed. It\
    \ is also useful for displaying error messages because it removes the dependency\
    \ of the filename from the program. If the name of the program is referenced by\
    \ $0, subsequently renaming the program will not require the program to be edited:\n\
    \n```\n# cat lu\n# Look someone up in the phone book\n#\nif [ \"$1 -ne 1 ];\n\
    then\n    echo \"Incorrect number of arguments\"\n    echo \"Usage: $0\"\n   \
    \ exit 1\nfi\n\nname=$1\ngrep \"$name\" PHONEBOOK\nif [ \"$1 -ne 0 ];\nthen\n\
    \    echo \"I couldn't find $name in the phone book\"\nfi\n$ PHONEBOOK=$$HOME/phonebook\n\
    $ export PHONEBOOK\n$ lu Trak\nTerri Zak 201-555-0000\n$ lu Terri Zak\nIncorrect\
    \ number of arguments\nUsage: name\n$ mv lu lookup\n$ lookUp Terri Zak\nIncorrect\
    \ number of arguments\nUsage: lookup name\n```\n\n# The set Command\n\nThe shell's\
    \ set command is a dual-purpose command: it's used both to set shell options as\
    \ well as to reposition the positional parameters $1, $2, and so on.\n\n# The\
    \ -x Option\n\nThis option turns on trace mode in the shell. It does to the current\
    \ shell what the command\n\nsh -x ctype a\n\ndid for the execution of the c program\
    \ in Chapter 8, \"Decisions, Decisions.\". From the point that the\n\nset -x\n\
    \ncommand is executed, all subsequently executed commands will be printed to standard\
    \ error by the shell, after filename, variable, and command setting and I/O redirection\
    \ have been performed. The traced commands are preceded by plus signs.\n\nUnix\
    \ Programming, Third Edition. Unix® Programming, Third Edition, ISBN: 0-672-32490-3\n\
    Prepared for architect@open.source.com\nCopyright © 2003 by Wiley Publishing.\
