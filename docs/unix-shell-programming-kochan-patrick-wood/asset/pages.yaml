  md: '# A Quick Review of the Basics


    # The Home Directory and Pathnames


    The Unix system always associates each user of the system with a particular directory.
    When you log in to the system, you are placed automatically into a directory called
    your home directory.


    Although the location of users'' home directories can vary from one Unix version
    to the next, and even one user to the next, let''s assume that your home directory
    is called steve and that your directory is actually a subdirectory of a directory
    called users. Therefore, if you had the documents and programs, the overall directory
    structure would actually look something like Figure 2.3. A special directory known
    as / (pronounced slash) is shown at the top of the directory tree. This directory
    is known as the root.


    ![](img/f721b95d36c075f0637b85b379ede747_16_0.png)


    Figure 2.3. Hierarchical directory structure.


    Whenever you are "inside" a particular directory (called your current working
    directory), the files contained within that directory are immediately accessible.
    If you want to access a file from another directory, you can either issue a command
    to "change" to the appropriate directory and access the particular file, or you
    can specify the particular file by its pathname.


    A pathname enables you to uniquely identify a particular file to the Unix system.
    In the specification of a pathname, successive directories along the path are
    separated by the slash character /. A pathname that begins with a slash character
    is absolute, such as /pathname because it specifies a complete path from the root.
    So, for example the pathname /users/steve identifies the directory steve contained
    under the directory users. Similarly, the pathname /users/steve/documents references
    the directory documents as contained in the directory steve under users. As a
    final example, the pathname /users/steve/documents/letters/AMG.reply identifies
    the file AMG.reply contained along the appropriate directory path.


    To reduce some of the typing that would otherwise be required, Unix provides certain
    conveniences. Pathnames that do not begin with a slash character are known as
    relative pathnames. The path is relative to your current working directory. For
    example, if you just logged into the system and were placed into your home directory/users/steve,
    you could directly refer the directory documents simply by typing documents. Similarly,
    the relative pathname programs/mon could be typed to access the file contained
    inside your programs directory.'
