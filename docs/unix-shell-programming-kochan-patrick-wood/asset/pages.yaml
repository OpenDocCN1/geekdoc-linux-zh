  md: '# Interactive and Nonstandard Shell Features


    The Ctrl+r is used to search the command history for a command containing a string.
    The Ctrl+r is entered followed by the string to search for, followed by the Enter
    key. The shell then searches the command history for the most recently executed
    command that contains that string on the line. If the command is displayed; otherwise,
    the shell "beeps" the terminal. When the Ctrl+r is typed, the shell replaces the
    current line with


    ```

    $ Ctrl+r test  $ Rtest_

    ```


    The search is initiated when Enter is pressed.


    ```

    $ Rtest_  Enter  $ echo this is a test_

    ```


    To execute the command that is displayed as a result of the search, Enter must
    be pressed again.


    ```

    $ echo this is a test  Hit Enter again

    this is a test $

    ```


    To continue the search through the command history, you simply type Ctrl+r followed
    by an Enter. Bash handles Ctrl+r a little differently. When you type Ctrl+r, Bash
    replaces the current line with (reverse-i-search)-


    ```

    $ Ctrl+s  (reverse-i-search) :

    ```


    ```

    (reverse-i-search) '' c echo this is a test

    (reverse-i-search) c echo this is a test d (reverse-i-search) cd: /tmp

    ```


    Note how Bash handles the editing of the command by placing the cursor on it.
    As with the shell, the command is executed by pressing Enter.


    When you''ve found the command in the history (either Ctrl+p, Ctrl+n, or Ctrl+u),
    you can edit the command using the other emacs commands we''ve discussed. Note
    that you don''t actually change the command in the history: that command cannot
    be changed after it is entered. Instead, you are editing a copy of the command
    in the history, which will be entered in the history when you press Enter.


    Table 15.2 summarizes the basic line edit commands.


    | Command | Meaning |

    | Ctrl+b | Move left one character |

    | Ctrl+f | Move right one character |

    | Ctrl+e | Move forward one word |

    | Ctrl+b | Move back one word |

    | Ctrl+a | Move to start of line |

    | Ctrl+e | Move to end of line |

    | Ctrl+d | Delete current character |

    | Ctrl+x | Delete current line |

    | erase char | (User-defined erase character, usually # or Ctrl+h), delete previous
    character |

    | Ctrl+p | Get previous command from history |

    | Ctrl+n | Get next command from history |

    | Ctrl+r | Search for the most recent command line containing string |


