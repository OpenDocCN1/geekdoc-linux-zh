    # Command Re-entry


    The shell keeps a list, of recently entered commands available is determined by
    the HISTSIZE variable (default at 128), and the file in which the history is kept
    by the HISTFILE variable (default $HOME/.sh_history). Because the command history
    is stored in a file, these commands are available after you log off and back.

    There are three ways you can access the command.


    # The fc Command


    The built-in fc allows you to run an editor on one or more commands in the command
    history. When the command(s) is written and you leave the editor, the edited version
    of the command(s) is executed. The editor is determined by the FCEDIT variable
    (default ed). The -e option may be used with fc to specify the editor rather than
    FCEDIT.


    The -s option causes commands to be executed without first invoking an editor.
    A simple editing capability is built into the fc -s command; an argument of the
    form

    old=new


    may be used to change the first occurrence of the string to the new string in
    the command(s) to be re-executed.


