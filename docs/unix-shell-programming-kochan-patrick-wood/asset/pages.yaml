  md: '# Your Environment


    Any commands subsequently read data from standard input will read from file.

    irection of standard output is done similarly. The command


    ```

    exec > report

    ```


    redirects all subsequent output written to standard output to the file report.
    Note here that exec

    is not used to start execution of a new program as previously described; here
    it is used to reassign

    standard input or standard output.


    If you use exec to reassign standard input and later to reassign it somewhere
    else, you can

    imply execute another exec. To reassign standard input back to the terminal, you
    would write


    ```

    exec < /dev/tty

    ```


    The same discussion applies to reassignment of standard output.


    # The (...) and { ...; } Constructs


    Sometimes you may want to group a set of commands for some reason. For example,
    you

    mant to send a sort followed by execution of your plotdata program into the background

    execution. You can group set of commands by enclosing them in a set of parentheses

    braces. The first form allows the commands to be executed by a subshell, the latter
    form is by

    current shell.


    Here are some examples to illustrate how they work:


    ```

    $ x=50

    $ (x=100)

    Execute this in a subshell

    $ echo $x

    50

    id''t change

    $ (x=100; )

    Execute this in the current shell

    $ echo $x

    100

    $ pwd

    Where am I ?

    /users/steve

    $ cd bin; ls

    Change to bin and do an ls

    add

    greetings

    number

    phonebook

    rem

    role

    $ pwd

    No change

    /users/steve

    $ { cd bin; }

    This should change me

    $ pwd

    /users/steve/bin

    $

    ```


    If the commands enclosed in the braces are all to be typed on the same line, a
    space must follow

    the left brace, and a semicolon after the last command.


    As the example


    ```

    (cd bin; ls)

    ```


    shows, the parentheses are useful for doing some commands without affecting your
    current envi-nment. You can also use them for other purposes:


    ```

    $ (next 2002data - 2002data; plotdata 2002data) &

    [1]

    3421

    ```


