    # Saving Matched Characters: \(...\)


    It is possible to capture the characters matched within a regular expression by
    enclosing the char-

    acters inside backslashed parentheses. These captured characters are stored in
    "registers" num-

    bered 1 through 9.


    For example, the regular expression


    ```

    \(\(\)

    ```


    matches the first character on the line, whatever it is, and stores it in register
    1. To retrieve the

    characters stored in a particular register, the construct \n is used, where \n
    is from 1–9.


    So the regular expression


    ```

    \*(.*?\)

    ```


    matches the first character on the line and stores it in register 1. Then the
    expression matches

    whatever is stored in register 1, as specified by the \1. The net effect of this
    regular expression is

    to match the first two characters on a line if they are both the same character.
    Go over this example

    if it doesn''t seem clear.


    The regular expression


    ```

    \*(.*)\\*

    ```


    matches all lines in which the first character on the line (*) is the same as
    the last character

    on the line (15). The \* matches all characters-between.


    Successive occurrences of \(...\) get assigned to successive registers. So when

    the following regular expression is used to match some text


    ```

    \(\(\...\)\)\)

    ```


    the first three characters on the line will be stored into register 1, and the
    next three characters into

    register 2.


    When using the substitute command in de, a register can also be referenced as
    part of the

    replacement string:


