  md: '# # Chapter 4. Tools of the Trade


    IN THIS CHAPTER


    +   - Regular Expressions

    - cut

    - paste

    - sed

    - tr

    - grep

    - sort

    - uniq

    - Exercises


    This chapter provides detailed descriptions of some commonly used shell programming
    tools. Covered are cut, paste, sed, grep, uniq, and sort. The more proficient
    you become at using these tools, the easier it will be to write shell programs
    to solve your problems. In fact, that goes for all the tools provided by the Unix
    system.


    # Regular Expressions


    Before getting into the tools, you need to learn about regular expressions. Regular
    expressions are used by several different Unix commands, including ed, sed, awk,
    grep, and to a more limited extent, vi. They provide a convenient and consistent
    way of specifying patterns to be matched.


    The shell recognizes a limited form of regular expressions when you use filename
    substitution. Recall that the asterisk (*) specifies zero or more characters to
    match, the question mark (?) specifies any single character, and the construct
    [...] specifies any character enclosed between the brackets. The regular expressions
    recognized by the aforementioned programs are far more sophisticated than those
    recognized by the shell. Also be advised that the asterisk and the question mark
    are treated differently by these programs and by the shell.


    Throughout this section, we assume familiarity with a line-based editor such as
    ex or ed. See Appendix B, "For More Information," for more information on these
    editors.


    # Matching Character: The Period (.)


    A period in a regular expression matches any single character, no matter what
    it is. The regular expression


    +   - r. specifies a pattern that matches r followed by any single character.


