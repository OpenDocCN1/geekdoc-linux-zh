  md: '# Standard Error


    In addition to standard input and standard output, there is another place known
    as standard error. This is where most Unix commands write their error messages.
    And with the other two "standard" places, standard error is associated with your
    terminal by default. In most cases, you never know the difference between standard
    output and standard error:


    ```

    ```

    ls n

    * not found


    ```

    ```


    Here the "not found" message is actually written to standard error and not standard
    output by the ls command. You can verify that this message is not being written
    to standard output by redirecting the ls command''s output:


    ```

    ```

    ls n > foo

    * not found


    ```

    ```


    So, you still get the message printed out at the terminal, even though you redirected
    standard output to the file foo.


    The preceding example shows the reason for standard error: so that error messages
    you want on the screen will still be displayed at the terminal even if standard
    output is redirected to a file or piped to another command.


    You can redirect standard error to a file by using the notation


    ```

    ```

    command 2> file

    ```

    ```


    No space is permitted between the 2 and the >. Any error messages normally intended
    for standard error will be diverted into the specified file, similar to the way
    standard output gets redirected.


    ```

    ```

    ls 2> errors

    cat errors

    * not found


    ```

    ```


    # More on Commands


    # Typing More Than One Command on a Line


    You can type more than one command on a line provided that you separate each command
    with a semicolon. For example, you can find the current time and also your current
    working directory by typing in the date and pwd commands on the same line:


    ```

    ```

    date; pwd

    Sat Jul 20 14:43:25 EDT 2002

    /users/pat/bin


    ```

    ```


    You can string out as many commands as you want on the line, as long as each command
    is delimited by a semicolon.


