  md: "# Decisions, Decisions\n\n```\nif [ \"nchars\" -ne 2 ]\nthen\n    echo Please\
    \ type a single character\n    exit 1\nfi\n```\n\ntry it again.\n\n```\n$ ctype\
    \ a\nlowercase letter\n$ ctype abc\nPlease type a single character\n$ ctype B\n\
    digit\n$ ctype K\nuercase letter\n$ ctype\nspecial character\n$ ctype\nUsage:\
    \ ctype char\n```\n\nNow it seems to work just fine. (What do you think happens\
    \ if you use ctype * without enclosing the * in quotes?)\n\nIn Chapter 12, \"\
    More on Parameters,\" you'll learn how you can turn this trace feature on and\
