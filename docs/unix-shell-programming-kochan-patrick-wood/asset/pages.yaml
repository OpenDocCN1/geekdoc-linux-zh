  md: '# Tools of the Trade


    This is not atypical for the Unix system; there''s always more than one approach
    to solving a particular problem. In the case we just saw, either approach is satisfactory
    (that is, tr or sed); however, tr is a better choice in this case because it is
    a smaller problem and likely to execute a bit faster.


    Table 4.4 summarizes how to use tr for translating and deleting characters. Bear
    in mind that tr works only on single characters. If you need to translate anything
    longer than a single character (say all occurrences of unix to UNIX), you have
    to use a different program as set instead.


    Table 4.4 tr Examples


    | Command | Description |

    | --- | --- |

    | tr ''A'' ''a'' | Translate all capital X''s to small x''s |

    | tr ''('' '')'' | Translate all open braces to open braces, all closed braces
    to closed braces |

    | tr ''[a-z]'' ''[A-Z]'' | Translate all lowercase to uppercase |

    | tr ''[A-M]'' ''[N-Z]'' | Translate uppercase letters: A-M to N-Z, and N-Z to
    A-M, respectively |

    | tr '' '' '' '' | Translate all tabs (in first pair of quotes) to spaces |

    | tr -d ''144'' | Delete all formed (octal 14) characters |

    | tr -d ''[0-9]'' | Delete all digits |


    # grep


    grep allows you to search for one or more files for particular patterns. The general
    format of this command is


    ```

    grep pattern files

    ```


    Every line of each file that contains pattern is displayed at the terminal. If
    more than one file is specified to grep, each line is immediately preceded by
    the name of the file, enabling you to identify the particular file that pattern
    was found in.


    Let''s say you want to find every occurrence of the word shell in the file ed.cmd.


    ```

    $ grep shell ed.cmd

    files, and is independent of a shell.

    to the shell, just type in a q.

    $

    ```


    This output indicates that two lines in the file ed.cmd contain the word shell.


    If the pattern does not exist in the specified file(s), the grep command displays
    nothing:


    ```

    $ grep cracker ed.cmd

    $

    ```


    You saw in the section on sed you could print all lines containing the string
    Unix from the file intro with the command


    ```

    sed -n ''/Unix/p'' intro

    ```


    But you could also use the following grep command to achieve the same result:


    ```

    grep Unix intro

    ```


