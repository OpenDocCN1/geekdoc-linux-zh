    The usual arithmetic operators are recognized by expr: + for addition, - for subtraction,
    / for division, * for multiplication, and % modulus (remainder).


    ```

    $ expr 10 + 20 / 2

    20

    ```


    Multiplication, division, and modulus have higher precedence than subtraction.
    Thus, in the preceding example the division was performed before the addition.


    ```

    $ expr 17 * 6

    expr: syntax error

    $

    ```


    What happened? The answer: The shell saw the * and substituted the names of all
    the files in your directory! It has to be quoted to keep it from the shell:


    ```

    $ expr ''17'' * 6

    102

    $

    ```


    That''s not the way to do it. Remember that expr must see every operator and operand
    as a separate argument; the preceding example sends the whole expression as a
    single argument.


    ```

    $ expr 17 \* 6

    102 $

    ```


    Naturally, one or more of the arguments to expr can be the value stored inside
    a shell variable the shell takes care of the substitution anyway:


    ```

    $ i=1

    $ expr $(expr i + 1)

    $ echo i

    $

    ```


    This is the older method for performing arithmetic on shell variables. The same
    type of thing as shown previously only use the command substitution mechanism
    to assign the output from expr back to the variable:


    ```

    $ i=1

    $ expr $(expr i + 1)      Add 1 to i

    $ echo i

    $

    ```


    In legacy shells, you''re more likely to see expr used with back quotes:


    ```

    $ `expr i + 1`      Add 1 to i

    $ echo i

    $

    ```


    Note that the shell''s built-in arithmetic, expr only evaluates integer arithmetic
    expressions. You can use awk if you need to do floating point calculations. Also
    note that expr has other operators. One of the most frequently used ones is :
    operator, which is used to match characters in the first operand against a regular
    expression given as the second operand. By default, it returns the number of characters
    matched.


    The expr command


    ```

    expr "file" - ".*"

    ```


