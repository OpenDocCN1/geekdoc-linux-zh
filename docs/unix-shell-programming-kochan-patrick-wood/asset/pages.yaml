    Another approach to determine the number of logged-in users bypasses the use of
    a file. The Unix system allows you to effectively connect two commands together.
    This connection is known as a pipe, and it enables you to take the output from
    one command and feed it directly into the input of another command. A pipe is
    effected by the character |, which is placed between the two commands. So to make
    a pipe between the who and wc -1 commands, you simply type who | wc -


