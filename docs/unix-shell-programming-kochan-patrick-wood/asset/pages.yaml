    Finally, command substitutions can be nested. Suppose you want to change every
    occurrence of the first character to something else. In a previous example, firstchar=$(echo
    $filename cut -cl) gets the first character from filename, how do we use this
    character to change every occurrence in filename? A two-step process is one:


    ```

    $ filename=/users/steve/memos

    $ firstchar=$(echo $filename | cut -cl)

    $ filename=$(echo $filename | tr "$firstchar*") translate to "u"

    $ echo $filename

    /users/steve/memos

    ```


    Or a single nested command substitution can perform the same operation:


    ```

    $ filename=/users/steve/memos

    $ filename=$(echo $filename | tr "$firstchar$(cut -cl)\*")

    $ echo $filename

    /users/steve/memos

    ```


    If you have trouble understanding this example, compare it to the previous one:
    the firstchar variable in the earlier example is replaced by the nested command
    substitution; otherwise, the two examples are the same.


    # The expr Command


    Although the POSIX standard supports built-in integer arithmetic operations, older
    shells don''t. It''s likely that you may see command substitution with a Unix
    program called expr, which evaluates an expression to it on the command line:


    ```

    $ expr 1 + 2

    3

    ```


    Each operand and given to expr must be a separate argument, thus explaining the
    output from the following:


    ```

    $ expr 1-2

    -1

