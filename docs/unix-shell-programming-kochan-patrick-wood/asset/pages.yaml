    # Functions


    The POSIX standard shell supports the concept of functions; note that other shells
    may not support this feature.


    To define a function, you use the general format:


    ```

    name () { command; ... command; }

    ```


    where name is the name of the function, the parentheses denote to the shell that
    a function is being defined, and the commands enclosed between the curly braces
    define the body of the function. These commands will be executed whenever the
    function is executed. Note that at least one white space character must separate
    the ( from the first command, and a semicolon must separate the last command from
    the closing brace if they occur on the same line.


    The following defines a function nu that displays the number of logged-in users:


    ```

    nu () { wc -l; }

    ```


    You execute a function the same way you execute an ordinary command: simply by
    typing its name to the shell:


    ```

    $ nu

    $ 22

    ```


    Arguments listed after the function command on the command line are assigned to
    the positional parameters $1, $2, ..., as as any other command. A function called
    nrun runs tbl, nroff, and ip on the file as its argument:


    ```

    $ nrun () { tbl $1 | nroff -m -Tip | ip; }

    $ nrun mem

    Run it on memol

    request id is laser-33 (standard input):

    $

    ```


    Functions exist only in the shell in which they are defined; that is, they cannot
    be passed to subshells. Further, because the function is executed in the current
    shell, changes made to the current directory or variables remain after the function
    has completed execution:


    ```

    $ db () {

    PATH_PATH=/usr2/data

    PS1=$DB

    cd /usr2/data

    }

    $ db

    Execute it

    ```


    As you see, a function definition can continue over as many lines as necessary.
    The shell displays your secondary command prompt until you close the function
    with the } .


