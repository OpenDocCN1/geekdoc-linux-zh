  md: "# Special echo Characters\n\nA slight annoyance with mycp is that the echo\
    \ command is executed to alert the user that the file already exists, the response\
    \ that is typed by the user appears on the next line. This happens because the\
    \ echo command always automatically displays a terminating newline after the last\
    \ argument.\n\nThis can be suppressed if the last characters given to echo are\
    \ the special characters \\. This tells echo to leave the cursor right where after\
    \ displaying the last argument and not to go to the next line. If you changed\
    \ the echo command in mycp to read like this:\n\n```\necho \"to already exists;\
    \ overwrite (yes/no) \\\"\n```\n\nthe user's input will be typed right after the\
    \ same line. Bear in mind that the \\c is interpreted by echo and not by the shell,\
    \ meaning that it be quoted so that the backslash makes it echo.\n\necho interprets\
    \ other special characters. These must each be preceded by a backslash. They're\
    \ summarized in Table 10.1.\n\nTable 10.1. echo Escape Characters\n\n| Character\
