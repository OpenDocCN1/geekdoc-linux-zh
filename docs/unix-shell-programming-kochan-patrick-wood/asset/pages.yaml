    Now it is time for another question: What do you think happens if a subshell changes
    the value of an exported variable? Will the parent shell know about it after the
    subshell has finished? To answer this, here''s a program called vartest4:


    ```

    $ vartest4

    export x=30

    y=5 $

    ```


    We''ll assume that you haven''t changed the values of x and y, and that y is still
    exported.


    ```

    $ vartest4

    echo $x

    100 $

    ```


    The subshell couldn''t even change the value of the exported variable y; it merely
    changed the copy of y that was passed to its environment when it was executed
    (see Figure 11.5). Just as with local variables, when a subshell goes away, so
    do the values of the exported variables. There is no way to change the value of
    a variable in a parent shell from within a subshell.


