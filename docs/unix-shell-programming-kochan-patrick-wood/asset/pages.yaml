  md: "# More on Parameters\n\nMV filex\nbecause the shell would substitute the value\
    \ of filex for the second argument.\n\nAs mentioned in Chapter 7, \"Passing Arguments,\"\
    \ to access positional parameters 10 and above, you must enclose the number inside\
    \ the curly braces, as in ${11}.\n\n${parameter:-value}\n\nThis construct says\
    \ to substitute the value of parameter if it is not null, and to substitute value\
    \ otherwise. For example, in the command line\n\n```\necho Using editor ${EDITOR:-bin/vi}\n\
    ```\n\nthe shell substitutes the value of EDITOR if it's not null, and the value\
    \ /bin/vi otherwise. It has the same effect as writing\n\n```\nif [ -n \"$EDITOR\"\
    \ ]\nthen\n    echo Using editor $EDITOR\nelse\n    echo Using editor /bin/vi\n\
    fi\n```\n\n# The command line\n\n```\n${EDITOR:-bin/ed} /tmp/ed\n```\n\nstarts\
    \ up the program stored in the variable EDITOR (presumably a text editor), or\
    \ /bin/ed if EDITOR is null.\n\nHere's a simple test of this construct following:\n\
    \n```\n$ ${EDITOR:-bin/ed}\necho ${EDITOR:-bin/vi}\n/bin/ed\n$ ${EDITOR:-} Set\
    \ it null\necho ${EDITOR:-bin/vi}\n/bin/vi\n```\n\n# ${parameter:-value}\n\nThis\
    \ version is similar to the last, only if parameter is not null; only value is\
    \ used, but it is also assigned to parameter as well (note the construct). You\
    \ can't assign values to positional parameters this way (that means that parameter\
