    # 217


    The pressing of the Delete key at the terminal sends what''s known as a signal
    to the executing program. The program can specify the action that should be taken
    on receipt of the signal. This is done with the trap command, whose general format
    is


    ```

    trap commands signals

    ```


    where commands are one or more commands that will be executed whenever any of
    the signals specified by signals is received.

    Numbers are assigned to the different types of signals, and the more commonly
    used ones are summarized in Table 13.1. A more complete list is given under the
    trap command in Appendix A, "Shell.\"


    Table 13.1. Commonly Used Signal Numbers


    | Signal | Generated for |

    |---|---|

    | 0 | Exit from the shell |

    | 1 | Hangup |

    | 2 | Interrupt (for example, Delete, Ctrl+c) |

    | 15 | Software termination signal (sent by kill default) |


    As an example of the trap command, the following shows how you can remove files
    and exit if someone tries to abort the program from the terminal:


    ```

    trap "rm WORKDIR/work WORKDIR/dataout; exit" 2

    ```


    From the point in the shell program that this is executed, the two files work$
    will be automatically removed if signal 2 is received by the program. If the user
    interrupts execution of the program after this trap is executed, you can be assured
    that these two files will be cleaned up. The exit that follows is necessary because
    without execution it would continue in the program at the point it left off when
    the signal was received.


    Signal 1 is generated for hangup: Either intentionally hangs up the line or the
    line in files gets accidentally disconnected. You may modifying the trap to remove
    the two protected files by adding signal 1 to the list of signals:


    ```

    trap "rm WORKDIR/work WORKDIR/dataout; exit" 1 2

    ```


    Now these files will be removed if the shell hangs up or if the Delete key gets
    pressed.

    The commands specified to trap must be enclosed in quotes if they contain more
    than one command. Note also that the shell scans the command line at the time
    that the trap command gets executed and also when one of the listed signals is
    received. In the preceding example, the value of WORKDIR and WORKDIR$ will be
    substituted at the time that the trap command is executed. If you wanted to use
    the value at the time that signal 1 or 2 is received (for example, WORKDIR may
    not have been defined yet), you can put the commands inside single quotes:


    ```

    trap ''\''''rm WORKDIR/work WORKDIR/dataout; exit'''' 1 2

    ```


    The trap command can be used to make your programs more user friendly. In the
    next chapter, when we revisit the rolo program, the signal generated by the Delete
    brings the user back to the main menu. In this way, this key can be used to abort
    the current operation without exiting the program.


    Unix® Shell Programming, Third Edition. Unix® Shell Programming, Third Edition,
    ISBN: 0-672-32490-3


    Prepared for open@text.com, Trevor

