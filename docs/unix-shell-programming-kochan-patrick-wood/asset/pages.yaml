    This last brings up an interesting point of discussion. If you''re one of Unix
    users who have to support different directory hierarchies, you can create programs
    like db whenever you have to work on one of your directories. In program, you
    can also include definitions for other variables; for example, you might want
    to change your prompt in PS1 to look like DB-—let you know that your databases
    have been set up. You may also want to change PATH to include a directory that
    has programs related to the database and your PATH variable so that directories
    in the database are easily accessible with the cd command. You can even change
    HOME so that a cd without any arguments returns directly to your database directory.


    If you make sorts of changes, you''ll probably want to execute db in a subshell
    the current shell leaving all the modified variables around after you''ve finished
    your work on the database. The trying to do it right is to start up a new shell
    inside the subshell, with all the modified variables exported to it. Then, when
    you''re finished working with the database, you can "log off" the shell by pressing
    Ctrl-D. Let''s take a look at how this works. Here is a new version of db:


    ```

    $ cat db

    # Set up and export variables related to the data base

    #

    HOME=/usr/2/data

    BIN=$HOME/bin

    RPTS=$HOME/rpts

    DATA=$HOME/data


    PATH=$BIN:$PATH

    CD=$HOME:$RPTS


