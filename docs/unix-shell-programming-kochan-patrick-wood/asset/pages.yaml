    When you log on to the system, you''re effectively given your own copy of the
    shell program. This shell maintains what''s known as your environment—an environment
    that is distinct from other users on the system. This environment is maintained
    from the moment you log on until the moment you log off. In this chapter you''ll
    learn about this environment in detail, and you''ll see how it relates to writing
    and running programs.


    # Local Variables


    Type the following program called vartest into your computer:


    ```

    $ cat vartest

    echo $x

    ```


    Vartest consists of a solitary echo command that displays the value of the variable
    x, surrounded by colons. Assign any value you want to the variable x from your
    terminal:


    ```

    $ x=100

    ```


    Here we chose 100. Question: What do you think will be displayed when vartest
    is executed?

    Answer:


    ```

    $ vartest

    :

    ```


    Vartest doesn''t know the value of x. Therefore, its value is null. The variable
    x that assigned the 100 in the login shell is known as a local/variable. The reason
    why it has this name will become clear shortly.


