  md: "# Your Environment\n\nWhen vart2 finishes execution, the subshell goes away,\
    \ together with any variables assigned\nvalues.\n\n# Exported Variables\n\nThere\
    \ is a way to make the value of a variable known to a subshell, and that's by\
    \ exporting it with\nthe export command. The format of this command is simply\n\
    \n```\nexport variables\n```\n\nwhere variables is the list of variable names\
    \ that you exported. For any subshells that get\nexecuted from that point on,\
    \ the value of the exported variables will be passed down to the subshell.\n\n\
    Here's a program called vart3 to help illustrate the difference between local\
    \ and exported\nvariables:\n\n```\n$ cat vart3\necho x = $x\necho y = $y\n$\n\
    ```\n\nAssign values to the variables x and y in the login shell, and then run\
    \ vart3:\n\n```\n$ x=100\n$ y=10\n$ vart3\nx =\ny =\n $\n```\n\nx and y are both\
    \ local variables, so their values aren't passed down to the subshell that runs\n\
    vart3. Now let's export the variable y and try it again:\n\n```\n$ export y\n\
    $ vart3\nMake y known to subshells\nx =\ny = 10\n $\n```\n\nThis time, vart3 knew\
    \ about y because it is an exported variable. Conceptually, whenever a\nsubshell\
    \ is executed, the list of exported variables gets \"copied down\" to the subshell,\
    \ whereas a\nlist of local variables does not (see Figure 11.4).\n\nUnix® Shell\
    \ Programming, Third Edition. Unix® Shell Programming, Third Edition, ISBN: 0-672-32490-3\n\
