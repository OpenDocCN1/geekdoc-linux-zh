    # Skipping Fields


    If you had to sort your data file by the y-value—that is, the second number in
    each line—you could tell sort to skip the first number on the line by using the
    option


    ```

    +in

    ```


    instead of -n. The +1 says to skip the first field. Similarly, +5n would mean
    to skip the first five fields on each line and sort the data numerically. Fields
    are delimited by space or tab characters by default. If a different delimiter
    is used, the -t option must be used.


    ```

    $ sort -in data Skip the first field in the sort

    | 14 | -9 |

    | 23 | 2 |

    | 15 | 6 |

    | -5 | 12 |

    | 2 | 27 |

    | 3 | 33 |

    ```


    # The -t Option


    As mentioned, if you skip over fields, sort assumes the fields being skipped are
    delimited by space or tab characters. The -t option says otherwise. In this case,
    the character that follows the -t is taken as the delimiter character.


