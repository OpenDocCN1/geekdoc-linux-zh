  md: '# Interactive and Nonstandard Shell Features


    The preceding sequence is one of the most often used with job control: sending
    a job mistakenly started in the foreground to the background.


    If a job running in the background needs to read from the terminal, it is stopped,
    and the message


    ```

    [n] - Stopped (SOTTIN) sequence

    ```


    is printed. It can then be brought to the foreground with the fg command. After
    entering input to the fg job, it can be stopped (with the Ctrl+Z) and returned
    to the background until it again requests input from the terminal.


    Output from a background job normally goes directly to the terminal. The command


    ```

    stty ttstop

    ```


    causes any background job that attempts to write to the terminal to be stopped
    and the message


    ```

    [n] - Stopped (SOTTOU) sequence

    ```


    to printed. (Note that Bash generates slightly different messages than the ones
    shown here.).

    The following shows how job control might be used:


    ```

    $ stty ttstop          Start up data base program

    777 find green red      Find green and red objects

    Ctrl+z                  This may take a while

    [2] + Stopped           So put it in the background

    $ bg                    Do some other stuff

    $ jobs

    [1] + Stopped (tty output) Bring back to foreground

    $ fg

    1973 Ford               Mustang      red

    1975 Chevy             Monte Carlo  green

    1976 Ford               Granada     green

    1980 Buick             Cincy       red

    1983 Chevy             Cavalier

    ??? find blue           Find objects

    Stop it again

    [2] + Stopped           Back to the background

    $ bg                    Keep working until it''s ready

    ```


    # The Restricted Shell r


    Although the restricted shell is not part of the POSIX standard, it is supported
    by Bourne variant we know of.


    The restricted shell is much same as the regular shell


    +   - Cannot change directory (cd)

    - Cannot change PATH, ENV, or SHELL variables

    - Cannot specify a path to a command'
