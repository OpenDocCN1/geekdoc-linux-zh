  md: "# Shell Summary\n\nThis command tells the shell that the listed variables cannot\
    \ be assigned values. These variables may optionally be assigned values on the\
    \ readonly command line. If you subsequently try to assign a value to a readonly\
    \ variable, the shell issues an error message.\n\nreadonly variables are useful\
    \ for ensuring that you don't accidentally overwrite the value of a variable.\
    \ They are also good for ensuring that other people using a shell program can't\
    \ change the values of particular variables (for example, their HOME directory\
    \ or their PATH). The readonly attribute is not passed down to subshells.\n\n\
    readonly with a -p option prints a list of your readonly variables.\n\nExample\n\
    \n```\n$ readonly db=/users/steve/database  Assign value to DB and make it readonly\n\
    $ db=0-672-3290-3\n$ db is read-only              Try to assign it a value\n message\
    \ from the shell\n$ echo db                            But can still access its\
    \ value\n/users/steve/database\n```\n\n# The return Command\n\nGeneral Format:\
    \ return n\n\nThis command causes the shell to stop execution of the current function\
    \ and immediately return to the caller with an exit status of n. If n is omitted,\
    \ the exit status is that of the command executed prior to the return.\n\n# The\
    \ set Command\n\nGeneral Format: set options args\n\nThis command is used to turn\
    \ on or off options as specified by options. It is also used to set positional\
    \ parameters, as specified by args.\n\nEach single option is enabled if it is\
    \ preceded by a minus sign (-), or disabled if preceded by a plus sign (+). Options\
    \ can be grouped, as in\n\n```\nset -fx\n```\n\nwhich enables the f and x options.\n\
    \nTable A.9 summarizes the options that can be selected.\n\n| Meaning | Option\
    \ |\n| --- | --- |\n| | Don't treat subsequent argument preceded by - as options.\
    \ If there are none, the positional parameters are unset. |\n| -a | Automatically\
    \ export all variables that are subsequently defined. |\n| -b | If supported by\
    \ the implementation, the shell to notify you when background jobs finish. |\n\
    | -c | Does allow output redirection to overwrite existing files. | can still\
    \ be used to force individual files if this option is specified. |\n| -e | Exit\
