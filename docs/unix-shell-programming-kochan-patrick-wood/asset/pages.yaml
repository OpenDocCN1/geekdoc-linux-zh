  md: 'Reading and Printing Data,


    In Chapter 12, "More on format" you''ll learn how to preserve the leading whitespace
    characters and also how to have some control over the parsing of the input data.


    # The printf Command


    Although echo is adequate for displaying simple messages, sometimes you''ll want
    to print formatted output: for example, lining up columns of data. Unix systems
    provide the printf command. Those of you familiar with the C programming language
    will notice many similarities.


    The general format of printf command is


    ```

    printf("%s", arg);

    ```


    where format is a string that describes the remaining arguments to be displayed.
    (Note that the format string is a single argument, so it''s a good idea to get
    into the head of enclosing it in quotes because it contains whitespaces.) Characters
    in the format string that are not preceded by a percent sign (\%) are written
    to standard output. One or more characters preceded by a percent sign are called
    conversion specifications and tell printf the corresponding argument should be
    displayed. For each percent sign in the format string there should be a corresponding
    argument, except for the special conversion specification %%, which causes a single
    percent sign to be displayed.


    Here''s a simple example of printf:


    ```

    printf("%d\n", 10);

    This is a number: 10

    $

    ```


    printf doesn''t add a newline character to output like echo; however, printf understands
    the same escape characters that echo does (refer to Table 10.1 earlier in this
    chapter), so adding \n to the end of the format string causes the prompt to appear
    on the next line.


    Although this is a simple case that could easily be handled by echo, it helps
    to illustrate how the conversion (%d) is interpreted by printf: When the format
    string is scanned by printf, it outputs each character in the string without modification
    until it reads the percent sign; then it reads the d and recognizes that it should
    be replaced by the next argument, which might be an integer. After that argument
    (10) is sent to standard output, printf sees the \n and outputs a newline.


    Table 10.2 summarizes the conversion specification characters.


    | Character | Description |

    |---|---|

    | d | Integers |

    | u | Unsigned integers |

    | o | Octal integers |

    | x | Hexadecimal integers, using a-f |

    | X | Hexadecimal integers, using A-F |

    | c | Single characters |

    | s | Literal strings |

    | b | Strings containing backslash escape characters |

    | % | Percent signs |


    Table 10.2 printf Conversion Specification Characters


