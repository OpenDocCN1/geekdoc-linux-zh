    ```


    You can create an alias called dir that gives you the base directory of your current
    working directory using the PWD variable and one of the parameter substitution
    constructs described in an earlier section of this chapter:


    ```

    alias dir="echo $(PWD)"

    ```


    Let''s see how this alias works:


    | alias dir="echo $(PWD)"* | Define alias |

    | pwd | Where are we? |

    | /users/steve | Execute alias |

    | dir | Change directory |

    | steve | Execute the alias again |

    | cd letters | |

    | dir | |

    | steve | |

    | cd /fuzz/ | | One more try |

    | dir | |

    | steve |


    It seems that no matter what the current directory is, the dir alias prints steve.
    That''s because we weren''t careful about our quotes when we defined the dir alias.
    Recalling that the shell performs parameter substitution inside double quotes,
    the shell evaluated


    ```

    $(PWD)/

    ```


    at the time the alias was defined. This means, for all intents and purposes, the
    dir alias was defined as though you were typing in the following:


    ```

    $ alias dir=''echo $(PWD)\''

    ```


    The solution is to use single rather than double quotes when defining the dir
    alias to defer the parameter substitution until the time the alias is executed:


    | alias dir=''echo $(PWD)\'' | Define alias |

    | pwd | Where are we? |

    | /users/steve | Execute alias |

    | dir | Change directory |

    | steve | Execute the alias again |

    | cd letters | |

    | dir | |

    | steve | |

    | cd /fuzz/ | | One more try |

    | dir | |

    | steve |


    Now the alias works just fine.


    If an alias ends with a space, the word following the alias is also checked for
    alias substitution. For example:


    ```

    alias nohop="/bin/nohup"

    $ nohop ll

    ```


    causes the shell to perform alias checking the string 11 after replacing nohop
    with /bin/nohup.

