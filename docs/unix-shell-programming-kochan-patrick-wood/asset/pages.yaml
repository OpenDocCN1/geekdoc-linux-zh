    In this chapter, you''ll learn how to write your own commands and how to use shell
    variables.


    # Command Files


    A shell program can be typed directly at the terminal, as in


    ```

    $ who | we -l

    ```


    or it can be first typed into a file and then the file can be executed by the
    shell. For example, suppose that you need to find out the number of logged-in
    users several times throughout the day. It''s not unreasonable to be typing in
    the pipeline file each time you want the information, but for the sake of example,
