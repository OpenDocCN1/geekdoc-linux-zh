  md: "# Interactive and Nonstandard Shell Features\n\nNote that not only can you\
    \ omit the dollar signs and the curly braces when referencing array elements inside\
    \ double parentheses, you can also omit them when the array is declared to be\
    \ of integer type. Also note that dollar signs are not needed before variables\
    \ used in subscript.\n\nThe following program, called reverse, reads in up to\
    \ 4096 lines from standard input and then writes them back to standard output\
    \ in reverse order:\n\n```\n# cat reverse\n# read lines to array buf\ntypeset\
    \ line=0\n\nwhile (( line < 4096 )) && read -a buf[line];\ndo\n\tline=$((line\
    \ + 1))\ndone\n\n# now print the lines in reverse order\nwhile (( line >= 0 ));\
    \ do\n\tline=$((line - 1))\n\techo \"${buf[line]}\"\ndone\n\n# reverse\nline one\n\
    line two\nline three\n$ line three\nline two\nline one\n$\n```\n\nThe first while\
