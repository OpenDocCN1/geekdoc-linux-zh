  md: "# Round and Round She Goes\n\n```\nuntil command,\ndo\n  command\n  command\n\
    \  ...\n```\n\nLike the while, the commands between the time do and done might\
    \ never be executed if command, returns a zero exit status the first time it's\
    \ executed.\n\nThe until command is useful for programs that wait for a particular\
    \ event to occur. For example, suppose that you want to see whether sandy is logged\
    \ on because you have to give her something important. You could send her electronic\
    \ mail, but you know that she usually doesn't get around to reading her mail late\
    \ in the day. One approach is to use the on from Chapter 8 \"Decisions, Decisions,\"\
    \ to see whether sandy's logged on:\n\n```\n$ sandy\nsandy is not logged on\n\
    ```\n\nYou could execute this program throughout the day, until sandy eventually\
    \ logs on, or you could write your own program to continually check until she\
    \ does. Let's call the program mon and have it take a single argument: the name\
    \ of the user you want to monitor. Instead of having the program continually check\
    \ for that user logging on, we'll check only once every minute. To do this, you\
    \ will have to know about a command called sleep that suspends execution of program\
    \ for a specified number of seconds. So the Unix command (this isn't a built-in)\n\
    \nsleep n\nsuspends execution of the program for n seconds. At the end of that\
    \ interval, the program resumes execution where it left off—with the command that\
    \ immediately follows the sleep.\n\n```\n$ cat mon\n# Wait until a specified user\
    \ logs on\n#\nif [ \"$\" -ne i ];\nthen\n  echo \"Usage: mon user\"\n  exit 1\n\
    fi\nuser=\"$1\"\n# Check every minute for user logging on\n#\nuntil who | grep\
    \ \"$user\" > /dev/null\ndone\n  sleep 0\ndone\n# When we reach this point, the\
    \ user has logged on\n#\necho \"$user has logged on\"\n#\n```\n\nUnix Shell Programming,\
    \ Third Edition. Unix Shell Programming, Third Edition, ISBN: 0-672-32490-3\n\
    Prepared for architect: open@open-source.com\nCopyright © 2003 by likely Publishing.\
    \ This download file is available for personal use only and is subject to the\
    \ Terms of Service. Any other use requires prior written consent from the copyright\
    \ owner. Unauthorized use, reproduction and/or distribution are strictly prohibited\
    \ and violate applicable laws. All rights reserved."
