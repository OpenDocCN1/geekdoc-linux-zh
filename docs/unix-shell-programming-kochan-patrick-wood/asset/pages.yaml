    # # Filename Substitution


    After parameter substitution (*), is performed on the command line, the shell
    looks for the special characters *, ?, and [. If they''re not quoted, the shell
    searches the current directory, or another directory preceded by /, and substitutes
    the names of all files that match (these names are first alphabetized by the shell).
    If no match is found, the characters remain untouched.


    Note that filenames beginning with a. must be explicitly mentioned (so echo *
    won''t display your hidden files: echo *).


    The filename substitution characters are summarized in Table A.6.


    Table A.6. Filename Substitution Characters

    | Character(s) | Meaning |

    |---|---|

    | ? | Matches any single character. |

    | * | Matches zero or more characters. |

    | [chars] | Matches any single character in chars; the format Cr-Cd can be used
    to match any character in the range Cr through Cd, inclusive (for example, [A-Z]
    matches any uppercase). |

    | ![chars] | Matches any single character not in chars; a range of characters
    may be specifically specified.|


    # # I/O Redirection


    When scanning the command line, the shell looks for the special redirection <
    >. If found, they are processed and removed (with any associated arguments) from
    the command line. Table A.7 summarizes the types of I/O redirection that the shell
    supports.


    Table A.7. I/O Redirection

    | Construct | Meaning |

    |---|---|

    | <file | Redirect input from file. |

    | >file | Redirect output to file, file is created if it doesn''t exist and zerosed
    if it does. |

    | >1file | Redirect output to file, file is created if it exists and zerosed if
    it does; the shell -C option is ignored. |

    | >>file | Like >, only output is redirected to file if it already exists. |

    | <<word | Redirect input from lines until a limit line is reached; parameter
    substitution occurs on the lines, and back-quoted commands are executed and the
    backslash character interpreted; if any word in word is quoted, no processing
    occurs and if word is preceded by a -, leading tabs on the lines are removed.
    |

    | <4digit | Standard input is redirected from the file associated with file descriptor
    digit. |

    | >4digit | Standard output is redirected to the file associated with file descriptor
    digit. |

    | <4- | Standard input is closed. |

    | >- | Standard output is closed. |

    | <>file | Open for both reading and writing.|


    Note that filename substitution is not performed on file. Any of the constructs
    listed in the first column of the table may be preceded by a file descriptor to
    have the same effect on the file associated with that file descriptor.


