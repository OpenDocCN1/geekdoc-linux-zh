  md: '# Shell Summary


    291


    | Meaning | Option |

    | --- | --- |

    | -m | Turn on mode m (see Table A.10). |

    | -u | Issue an error if a variable is referenced without being assigned or if
    a positional parameter is referenced without having been set. |

    | -v | Print each command line as it is read. |

    | -x | Print each command and its arguments as it is executed, preceded by a +.
    |


    Shell modes are turned on or off by using the - and +o options, respectively,
    followed by an option name. These options are summarized in Table A.10.


    Table A.10. Shell Modes

    | Mode | Meaning |

    | --- | --- |

    | allexport | Same as -a |

    | errxit | Same as -e |

    | ignoreeof | The exit command must be used to leave the shell |

    | monitor | Same as -m |

    | noclobber | Same as -c |

    | noexec | Same as -n |

    | noglob | Same as -f |

    | nolog | Don''t put function definitions in the header. |

    | nounset | Same as -u |

    | verbose | Same as -v |

    | vi | The inline editor is set to vi. |

    | xtrace | Same as -x. |


    The command -o without any following options has the effect of listing all shell
    modes and their settings.


    The shell variable $- contains the current options settings.


    Each word in args is set to the positional parameters $1, $2, ..., respectively.
    If the first word might start with a minus sign, the -- option to set to avoid
    interpretation of that value.


    If args is supplied, the $* will be set to the number of parameters assigned after
    execution of the command.


    Examples


    | set -v | Print all command lines as they are read, and each command and its
    arguments as it is executed |

    | set "name" "address" "iphone" | Set $1 to name, $2 to address, and $3 to iphone
    |

    | set --i | Set $1 to -i |

    | set -o vi | Turn on vi mode |

    | set to verbose -o noglob | Turn verbose mode off, noglob on |


