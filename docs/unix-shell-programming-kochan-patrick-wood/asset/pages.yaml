    If you are thinking about moving the cursor around repeatedly pressing h and l1
    is slow, you''re right. The h and l1 commands may be preceded by a number that
    specifies the number of spaces to move to the cursor.


    ```

    $ mary had a little lambda Esc $ mary had a little lamb

