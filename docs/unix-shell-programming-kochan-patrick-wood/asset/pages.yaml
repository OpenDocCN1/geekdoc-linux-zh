    & Associates, 2002 (ISBN 0596002416)

    - Programming Perl, 3rd Edition, L. Wall, T. Christiansen, and J. Orwant, O''Reilly
    & Associates, 2000 (ISBN 0596000278)


    Advanced Perl Programming, S. Srinivasan, O''Reilly & Associates, 1997 (ISBN 1569522024)


    A good book covering the POSIX standards versions of awk and well as the GNU versions:


