  md: '# Interactive and Nonstandard Shell Features


    ```

    cat .profile

    SHELL=/usr/bin/ksh

    export SHELL

    ```


    This variable is used by certain applications (such as vi) to determine what shell
    to start up when you execute a shell escape. In such cases, you want to make sure
    that each time you start up a new shell, you get the shell you want and not an
    older Bourne.


    # Command-Line Editing


    Line edit mode is a feature of the shell that allows you to edit a command line
    using built-in commands that mimic those found in two popular editors. The POSIX
    standard provides the capability to mimic vi; however, both Bash and the Korn
    also support an emacs line edit mode. We list the complete set of vi commands
    in Table A.4 in Appendix A, "Summary."


    If you''ve used any of these editors, you''ll find that the built-in editors in
    the shell are faithful reproductions of their full-screen counterparts. If you''ve
    never used a screen editor, don''t be intimidated. This is one of the most useful
    features in the shell. In fact, after learning how to use one of the shell''s
    built-in editors, you''ll be able to learn vi or emacs with little effort.


    To turn on a line edit mode, use the set command with the -o mode option, where
    mode is either vi or emacs:


    ```

    set -o vi

    ```


    Note that you can put this in your .profile or ENV file to automatically start
    the shell with the one of your edit modes turned on.


    # Command Shell History


    As said before, the shell keeps a history of previously entered commands. Each
    time you press the Enter key to execute a command, that command gets added to
    the end of this history list. The command list is actually stored inside a file,
    which means you can access previously entered commands across login sessions.
    By default, the history list is kept in your home directory under the name .sh_history
    (.bash_history for Bash, unless it starts with the --POSIX option). You can change
    the name to anything you want by setting the HISTFILE variable to the name of
    your file. This variable can be set and exported in your .profile file.


    Naturally, there is a limit to the number of commands the shell recalls. The default
    value of this limit varies by implementation, but the POSIX standard requires
    it to be at least 128; the default value for the Korn shell is 128; the default
    value for Bash is 500. Each time you log in, the shell automatically truncates
    your history to this length.


    You can control the size of your history through the HISTFILE variable. You may
    find that the default size is inadequate for your needs, in which case you may
    want to set the HISTSIZE variable to a larger value, such as 500 or 1000. The
    value you assign to HISTSIZE can be set and exported in your .profile:


    ```

    cat .profile

    HISTSIZE=500

    export HISTSIZE

    ```'
