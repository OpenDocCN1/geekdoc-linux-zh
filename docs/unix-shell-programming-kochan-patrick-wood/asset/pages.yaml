    \ destructive program like rem and to be certain as possible that the action intended\
    \ by the user is consistent with the action that the program is taking.\n\nOne\
    \ of the first checks that can be made in rem is for the correct number of arguments,\
    \ as was done before with them. This time, we'll use the exit command to terminate\
    \ the program if the correct number of arguments is not supplied:\n\n```\ncat\
    \ rem\n#\n# Remove someone from the phone book -- version 2\n\nif [ \"$1\" -ne\
    \ 1 ];\nthen\n\techo \"Incorrect number of arguments.\n\techo \"Usage: rem name\"\
    \n\texit 1\nfi\n\ngrep -v \"$1\" phonebook > /tmp/phonebook\n```\n\nUnix Shell\
    \ Programming, Third Edition. ISBN: 0-672-3490-3\n\nPrepared for architect@openview.com.\
