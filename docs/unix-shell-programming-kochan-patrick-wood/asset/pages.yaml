  md: '# What Is the Shell?


    34


    The Unix system—more precisely a program called init—automatically starts up a
    getty program on each terminal port whenever the system is allowing users to log
    in. getty determines the baud rate, displays the message login: at its assigned
    terminal, and then waits for someone to type in something. As soon as someone
    types in characters followed by Enter, the getty program disappears; but before
    it goes away, it starts up a program login to finish the process of logging in
    (see Figure 3.3). It also gives login the characters you typed in at the terminal—characters
    that presumably represent your login name.


    ![](img/f721b95d36c075f0637b85b379ede747_41_0.png)


    Figure 3.3. login started on sue''s terminal.


    When login begins execution, it displays the string Password: at the terminal
    and waits for you to type your password. After you have typed it, login proceeds
    to verify your login name and password against the corresponding entry in the
    file /etc/passwd. This file contains one line for each user of the system. The
    line specifies—among other things—the login name, home directory, and program
    to start up when the user logs in. The last bit of information (the program to
    start up) is stored after the last colon of each line. If nothing follows the
    default shell is /bin/sh. The following three typical lines from /etc/passwd for
    three users of the system: sue, pat, and bob:


    > * The file''s name (passwd) derives from a time when encrypted versions of the
    user''s passwords were stored in this file along with other information. The encrypted
    passwords are no longer stored in /etc/passwd but for security reasons are now
    kept in /etc/shadow which is not readable by normal users.


