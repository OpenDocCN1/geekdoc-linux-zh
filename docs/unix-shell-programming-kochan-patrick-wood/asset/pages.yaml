    \ preceded by the value of lineneno, whose value is incremented by one.\n\n```\n\
    $ number phonebook\n1: Alice Arinkle 973-555-2015\n2: Barbara Swingle 201-555-9257\n\
    3: Billy Bach 212-555-9728\n4: Ed Coyote 212-555-3212\n5: Liz Stekhin 212-555-2298\n\
    6: Dean Goldberg 201-555-7776\n7: Teri Lake 201-555-6000\n8: Tony Lammiso 973-555-1295\n\
    ```\n\nNote that this will not work well for lines that contain backslashes or\
