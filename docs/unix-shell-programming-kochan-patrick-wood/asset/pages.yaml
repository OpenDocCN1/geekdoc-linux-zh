  md: "# Round and Round She Goes\n\nIncidentally, she permits filename substitution\
    \ in the list of words in the for, meaning that the previous loop could have also\
    \ been written this way:\n\n```\nfor file in memo[1-4]\ndo\n    run tfile\ndone\n\
    ```\n\nAnd if you wanted to run all the files in your current directory through\
    \ run, you could type\n\n```\nfor file in i\ndo\n    run tfile\ndone\n```\n\n\
    If the file fileelist contains a list of files that you want to run through run,\
    \ you could type\n\n```\nfiles*(cat filelist)\nfor file in tfiles\ndo\n    run\
    \ tfile\ndone\n```\n\nto run each of the files, or more succinctly,\n\n```\nfor\
    \ file in t*(cat filelist)\ndo\n    run tfile\ndone\n```\n\nIf you found that\
    \ you were using the run program to process several files at once, you could go\
    \ inside the run program and modify it to allow any number of files to be passed\
    \ as arguments to the program.\n\n```\n# cat run\n# process files through nroff\
    \ -- version 2\n#\nfor file in f*\ndo\n    tbl tfile | nroff -Tlp | ip\ndone\n\
    ```\n\nRecall that the special $* stands for all the arguments typed on the command\
    \ line. So if you executed the new version of run by typing\n\n```\nrun memol\
    \ memo2 memo3 memo4\n```\n\nthe $* in the for's list would be replaced by the\
    \ four arguments memo1, memo2, memo3, and memo4. Of course, you could also type\n\
    \n```\nrun memo[1-4]\n```\n\nto achieve the same results.\n\n# The Variable\n\n\
    While we're on the subject of $* let's look at it in a bit more detail. We'll\
    \ write program program args that displays all the arguments typed on the command\
    \ line, one per line."
