    We''ve put commands and features into this chapter that for one reason or another
    did not logically fit into earlier chapters. There''s no particular rationale
    for their order of presentation.


    # The eval Command


    This section describes another of the more unusual commands in the shell: eval.
    Its format is as follows:


    ```

    eval command-line

    ```


    where command-line is a normal command line that you would type at the terminal.
    When you put eval in front of it, however, the effect is that the shell scans
    the command line twice executing it. For the simple case, this really has no effect:


    ```

    $ eval echo hello

    hello

    $

    ```


    But consider the following example without the use of eval:


    ```

    $ pipe|1

    $ ls Pipes wc -l

    ii: No such file or directory

    wc: No such file or directory

    l-1: No such file or directory

    $

    ```


    These errors come from ls. The shell takes care of pipes and I/O redirection before
    variable substitution, so it never recognizes the pipe symbol inside pipe. The
    three arguments 1, wc, and -1 are passed to ls as arguments.


