  md: '# Decisions, Decisions


    Table 8.2 test Integer Operators


    | Operator | Returns TRUE (exit status of 0) if |

    |---|---|n| int -eq int2 | is equal to int2 |

    | int -ge int2 | is greater or equal to int2 |

    | int -gt int2 | is greater than int2 |

    | int -le int2 | is less than equal to int2 |

    | int -lt int2 | is less than int2 |

    | int -ne int2 | is not equal to int2 |


    For example, the operator -eq tests to see whether two integers are equal. So
    if you had a shell variable called count and you wanted to see whether its value
    was equal to zero, you would write


    ```

    [ $count -eq 0 ]

    ```


    Other integer operators behave similarly,


    ```

    [ $choice -lt 5 ]

    ```


    tests to see whether variable choice is less than 5; the command


    ```

    [ $index -ne "max" ]

    ```


    tests to see whether the value of index is not equal to the value of max; and,
    finally


    ```

    [ $? -ne 0 ]

    ```


    tests to see whether the number of arguments passed to the command is not equal
    to zero.

    The test command interprets the value as an integer when an integer operator is
    used, and not the shell, so these comparisons work regardless of the shell''s
    type.


    Let''s reinforce the difference between string and integer operators by taking
    a look at a few examples.


    | $x="005" | |

    | $x="10" | String comparison |

    | [ $x="5" ] | String comparison |

    | $echo $? | False |

    | [ $x -eq 5 ] | Integer comparison |

    | $echo $? | True |

    | [ $x -eq 10 ] | String comparison |

    | $echo $? | False |

    | [ $x -eq 10 ] | Integer comparison |

    | $echo $? | True |


    The first test


    ```

    [ $x = 5 ]

    ```


    uses the string comparison operator = to test whether the strings are identical.
    They''re not, because the first string is composed of the three characters 005,
    and the second single character 5.


