  md: '# What Is the Shell?


    When we begins execution this time, it sees that it passed the single argument
    -1. Because no filename was specified, we takes this as an indication that the
    number of lines appearing on standard input is to be counted. we counts the number
    of lines on standard input, unaware that it''s actually counting the lines in
