  md: '# A Quick Review of the Basics


    # Matching Single Characters


    The asterisk (*) matches zero or more characters, meaning that x* matches the
    file x as well as x1, x2, xabc, and so on. The question mark (?) matches exactly
    one character. So cat? prints all files with one-character names, just as cat?
    prints all files with two-character names beginning with x.


    ```

    $ ls le

    aaa

    aax

    alice

    h

    bb

    cc

    report1

    report2

    report3

    $ echo *

    a b c

    $ echo *

    aaa

    $ echo ??

    aaa bb cc

    $ echo ***

    aax alice bb cc report1 report2


    ```


    In the preceding example, the ?? matches two characters, and the * matches zero
    or up to the end. The effect is not to match filenames of two or more characters.


    Another way to match a single character is to give a list of characters to use
    in the match inside square brackets [ ]. For example, [abc] matches one letter
    a, b, or c. It is similar to the ^, but it allows you to choose the characters
    that will be matched. The specification [0-9] matches the characters 0 through
    9. The only restriction in specifying a range of characters is the first character
    must be alphabetically less than the last, so that [z-f] is not a valid range
    specification.


    By mixing matching ranges in the list, you can perform some complicated substitutions.
    For example, [a-np-z] matches all files that start with a letter n or p through
    two (or more simply, any lowercase but o).


    If the first character following the is [ a ], the sense of the match is inverted.
    That is, any character is matched except enclosed in the brackets.


    ```

    [a-z]

    ```


    matches any character except a lowercase letter,


    ```

    *[!o]

    ```


    matches any file that doesn''t end with the lowercase letter o.


    Table 2.1. gives a few examples of filename substitution.


    | Command | Description |

    |--- | --- |

    | echo * | Print the names of the files beginning with a |

    | cat *.c | Print all files ending in .c |

    | rm * | Remove all files containing a period |


