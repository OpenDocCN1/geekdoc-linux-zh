  md: "# Shell Summary\n\nEach time getopts is called, it processes the next command-line\
    \ argument. If a valid option is found, getopts stores the matching option letter\
    \ inside the specified variable `var` and returns a zero exit status.\n\nIf an\
    \ invalid option is specified (that is, not listed in options), getopts stores\
    \ a `?` in `var` and returns with a zero exit status. It also writes an error\
    \ message to standard error.\n\nIf an option takes a following argument, getopts\
    \ stores the matching option letter inside `var` and returns the following command-line\
    \ argument inside the special variable `OPTARG`. If no arguments are left on the\
    \ command line, getopts stores a `?` in `var` and writes an error message to standard\
    \ error.\n\nIf no more options remain on the command line (that is, if the next\
    \ command-line argument does not begin with a -), getopts returns a non-zero exit\
    \ status.\n\nThe special variable `OPTIND` is also used by getopts. It is initially\
    \ set to 1 and is adjusted each time getopts returns to indicate the number of\
    \ the next command-line argument to be processed.\n\nThe argument `-- can be placed\
    \ on the command-line to specify the end of the command-line arguments.\n\ngetopts\
    \ supports stacked arguments, as in\n\n```\nrepx -iau\n```\n\nwhich is equivalent\
    \ to\n\n```\nrepx -i -a -u\n```\n\nOptions that take following arguments may not\
    \ be stacked.\n\nIf the format\n\n```\ngetopts var args\n```\n\nis used, getopts\
    \ parses the arguments specified by `args` rather than the command-line arguments.\n\
    \nExample\n\n```\nusage=\"Usage: foo [-r] [-O outfile] infile\"\nwhile getopts\
    \ ro: opt; do\n  case $opt in\n    r)\n      rflag=1;\n    o)\n      flag=1;\n\
    \      outfile=$OPTARG;\n      echo \"$usage\"\n      exit 1;;\n    esacn  esac\n\
    done\nif [ $OPTIND -gt $# ]; then\n  echo \"Usage input file!\"\n  exit 2\nfi\n\
    shift $((OPTIND - 1))\nfile=$1\n\n\n...\n```\n\nUnix® Shell Programming, Third\
    \ Edition. Unix® Shell Programming, Third Edition, ISBN: 0-672-32490-3\n\nPrepared\
    \ for architect@openunix.com. © 2003 by Prentice Publishing. This download file\
    \ is available for personal use only and is subject to the Terms of Service. Any\
    \ other use requires prior written consent from the copyright owner. Unauthorized\
    \ use, reproduction and/or distribution are strictly prohibited and violate copyright\
    \ laws. All rights reserved."
