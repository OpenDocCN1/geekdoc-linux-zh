    $ grep Susan phonebook

    Susan Goldberg 201-555-7776

    Susan Topple 212-555-4932

    $


    There are two lines that contain Susan, explaining the two lines of output. One
    way to overcome this problem would be to properly qualify the name. For example,
    you could specify the last name as well:


    $ grep Susan Goldberg phonebook

    grep: can''t open Goldberg

    Susan Goldberg 201-555-7776

    Susan Topple 212-555-4932

    $


    Recalling that the shell uses one or more whitespace characters to separate the
    arguments on the line, the preceding command line results in grep being passed
    three arguments: *Susan, Goldberg, and phonebook* (see Figure 6.1).


    ![](img/f721b95d36c075f0637b85b379ede747_96_0.png)


    When grep is executed, it takes the first argument as the pattern and the remaining
    arguments as the names of the files to search for the pattern. In this case, grep
    thinks it''s supposed to look for Susan in the files **Goldberg and phonebook**.
    So it tries to open the file Goldberg, can''t find it, and issues the error message:


    ```

    grep: can''t open Goldberg

    ```


    Then it goes to the next line, *phonebook*, opens it, searches for the pattern
    *Susan*, and prints the two matching lines. The problem boils down to trying to
    parse whitespace characters as arguments to programs. This can be done by enclosing
    the entire argument inside a pair of single quotes, as:


    ```

    grep ''Susan Goldberg'' ''phonebook''

    ```


    When the shell sees the first quote, it ignores any special characters that until
    it sees the closing quote.


    ```

    $ grep ''Susan Goldberg'' ''phonebook''

    Susan Goldberg 201-555-7776

    $

    ```


    In this case, the shell encountered the first '', and ignored any special characters
    until it found the closing ''. So the space between Susan and Goldberg, which
    would normally delimited the two arguments, was ignored by the shell. The shell
    therefore divided the command line into two arguments, the first Susan Goldberg
    (which includes the space character) and the second phonebook. It then executed
    grep, passing it these two arguments (see Figure 6.2).


