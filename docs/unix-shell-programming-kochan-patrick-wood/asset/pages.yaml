    # The exec Command


    After you started the new shell from db, you weren not interested in doing anything
    further after the shell finished, as evidenced by the fact that no commands followed
    /usr/bin/sh in the program. Instead of having db wait for the new shell to finish,
    you can use the exec command to replace the current program (db) with the new
    one (/usr/bin/sh). The general format of exec is


    exec program


    where program is the name of the program to be executed. Because the exec''ed
    program replaces the current one, there''s one less process hanging around; also,
    startup time of an exec''ed program is quicker, than the way the Unix system executes
    processes.


    To use exec in the db program, you simply replace the last line with


    ```

    exec /usr/bin/sh

    ```


    As noted, after this executed, db will be replaced by /usr/bin/sh. This means
    that it''s point-less to have any commands follow the exec because they will never
    be executed.


    exec can be used to close standard input and reopen it with any file that you
    want to read. To change standard input to file, you use the exec command in the
    form


    ```

    exec < file

    ```'
