    # The pwd Command


    General Format: pwd


    This command tells the shell to print your working directory, which is written
    to standard output.


    Examples


    ```

    $ pwd

    /users/steve/documents/memos

    $ cd

    $ pwd

    /users/steve

    ```


    # The read Command


    General Format: read vars

    This command causes the shell to read a line from standard input and assign successive
    white-space-delimited words from the line to the variables vars. If fewer variables
    are listed than there are words on the line, the excess words are stored in the
    last variable.


    Specifying just one variable has the effect of reading and assigning an entire
    line to the variable.

    The exit status of read is zero unless an end-of-file condition is encountered.


    Examples


    ```

    $ read hours mins

    10 15

    $ echo "Hours: $mins"

    10 15


    $ read num rest

    3 East 12th Street, New York City 10003

    $ echo "Num: $rest"

    3 East 12th Street, New York City 10003


    $ read line

    Here is an entire line \

    $ echo "Line: $line"

    Here is an entire line      r

    ```


    Note in the final example that leading whitespace characters get "eaten" by the
    shell when read.

    You can change IFS if this poses a problem.


    Also note that backslash characters get interpreted by the shell when you read
    the line, and any that make it through (double backslashes will get through as
    a single backslash) get interpreted by echo if you display the value of the variables.


    -r option to read says not to treat a character at the end of a line as line continuation.


