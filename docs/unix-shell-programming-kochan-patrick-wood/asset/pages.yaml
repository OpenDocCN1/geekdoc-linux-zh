    # The format


    alias name


    causes the value of the alias name to be listed, and the alias command without
    arguments causes all aliases to be listed.


    The following aliases are automatically defined when the Korn shell starts up:


    ```

    onload=''typeset -fu''

    functions=''typeset -f''

    history=-f''

    integer=''typeset -i''

    local=''typeset''

    nowup=noh

    r=''fc -s''

    suspend=''kill -STOP $$''

    ```


    Note from the preceding example that r is actually an alias for the fc command
    with the -e option, and history is an alias for fc -l. Bash does not automatically
    define any aliases by default.


    # Removing Aliases


    The unalias command is used to remove aliases from the alias list. The format
    is


    ```

    unalias name

    ```


    which removes the alias name and -


    ```

    unalias name

    ```


    which removes all aliases.

    This concludes this section on aliases. If you develop a set of alias definitions
    that you like to use during your login sessions, you may want to define them inside
    your ENV file so that they will always be available for you.


    # Arrays


    The Korn shell and Bash provide a limited array capability (arrays are not part
    of the POSIX standard shell). Arrays may contain an unlimited number of elements
    (subject to memory limitations); Korn arrays are limited to 4096 elements. Array
    indexing in both shells starts at zero. An array is accessed with a subscript,
    which is an integer-valued expression inside a pair of brackets. You do not declare
    the maximum size of a shell array, you simply assign values to elements you need
    them. The values that you can assign are the same as for ordinary variables.


    ```

    arr[0]=hello

    arr[1]=some text

    arr[2]=users/step/memos

    ```


    To retrieve an element from an array, you write the array name followed by the
    element number, enclosed inside a pair of brackets as before. The construct must
    be enclosed inside a pair of curly braces, which is preceded by a dollar sign.


    ![](img/f721b95d36c075f0637b85b379ede747_263_0.png)'
