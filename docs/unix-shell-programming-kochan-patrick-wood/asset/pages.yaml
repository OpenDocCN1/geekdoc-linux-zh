  md: '# Interactive and Nonstandard Shell Features


    Be reasonable about the values that you assign to HISTSIZE. The larger value,
    the more disk space you will need to store the history file, and the longer it
    will take the shell to search through the entire history file.


    # The vi Line Edit Mode


    After turning on the vi line editor, you will be in input mode. You probably won''t
    notice anything different about input mode because you can type in and execute
    commands almost the same as before you started the vi line editor:


    ```

    $ set -a vi

    echo hello

    bell

    pwd

    /users/pat

    ```


    To use the line editor, you must enter command mode by pressing the ESCAPE or
    Esc key, usually in the upper-left of the keyboard. When you enter command mode,
    the cursor moves to the left, to the last character typed. The current character
    is whatever character the cursor is; you may say more about the current character
    in a moment. When you enter mode, you can vi commands. Note that vi commands are
    not followed by an.


    One problem encountered when typing in long commands is that you may notice an
    error in a command line after typing it. Invariably, the error is at the beginning
    of the line. In command mode, you can move the cursor around without disturbing
    the command. After you''ve moved the cursor to where the error is, you can change
    the letter or letters to whatever you want.


    In the following examples, the underline (_) represents a character. A command
    line will be shown, by one or more keystrokes, by what the line looks like after
    applying the keys:


    +   before keystrokes after


    First, let''s look at moving the cursor. The H key moves the cursor to the left
    and the L key moves it to the right. Try this by entering command mode and pressing
    the H and L a few times. The cursor should move around the line. If you try to
    move the cursor past the left or right side of the line, it "beeps" at


    | mary had a little lab | $ mary had a little lab |

    | mary had a little la | $ mary had a little la |

    | h | $ mary had a little la |

    | l | $ mary had a little lab |

    | mary had a little lab | $ mary had a little lab |


    After the cursor is the character you want to change, you can use the x to delete
    the current character ("X" out).


    ```

    $ mary had a little lab x $ mary had a little lab

    ```


    Note that the b moved to the left when the r was deleted and is now the current
    character.


    To add characters to the command line, you can use the i and a commands. The i
    command inserts characters before the current character, and the a command adds
    characters after the current character. Both of these commands put you into input
    mode; you must press Esc to go back to command mode.


