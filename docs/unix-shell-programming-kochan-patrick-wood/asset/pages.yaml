    Please type a single character\n$ ctype 7\nPlease type a single character\n```\n\
    \n# The -x Option for Debugging Programs\n\nSomething seems to be amiss. The countless\
    \ portion of our program doesn't seem to be working properly. This seems like\
    \ a good point to introduce the shell's x option. You can trace the execution\
    \ of any program by typing sh -x followed by the name of the program and its arguments.\
    \ This starts a new shell to execute the program with the -x option enabled. In\
    \ this mode, commands are printed at the terminal as they are executed, preceded\
    \ by a plus sign. Let's try it out.\n\n```\n$ sh -x ctype a\n+ echo i\n+ char=\n\
    + echo a\n+ wc=\n+ numbers=\n+ [ -ne i ]\n+ echo Please type a single character\n\
    please type a single character\n+ exit\nTrace execution\n+ equals = i\n+ Assignment\
    \ of $1 to char\n+ wc returned 2\n+ That's why this test succeeded\n```\n\nThe\
    \ trace output indicates that wc returned 2 when\n\n```\necho \"char\"\ni wc -\n\
    ```\n\nwas executed. But why? There seemed to be only one character in wc's input.\
    \ The truth of the matter is that two characters were actually given to wc: the\
    \ \"invisible\" newline character that echo automatically prints at the end of\
    \ each line. So the program really be testing for the number of characters equal\
    \ to two: the character typed plus the newline added by echo.\n\nGo back to the\
    \ ctype program and replace the if command that reads\n\n```\nif [ \"numchars\"\
    \ -ne i ];\nthen\n  echo Please type a single character\n  exit 1\n```\n\nwith\n\
    \nUnix Shell Programming, Third Edition. Unix® Shell Programming, Third Edition,\
