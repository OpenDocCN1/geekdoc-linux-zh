  md: "# Shell Summary\n\ncommand, is executed and its exit status tested. If it is\
    \ zero, the commands enclosed between the do and done are executed. Then command,\
    \ is executed again and its status tested. If it is zero, the commands between\
    \ the do and done are once again executed. Execution of command, and subsequent\
    \ execution of the commands between the do and done continues until command, returns\
    \ a nonzero exit status, at which point the loop is terminated. Execution then\
    \ continues with the command that follows the done.\n\nNote that because command,\
    \ gets evaluated immediately on entry into the loop, the commands between the\
    \ do and done may never be executed if it returns a nonzero exit status the first\
    \ time.\n\nExample\n\n```\n# fill up the rest of the buffer with blank lines\n\
    while [ $lines -le $maxlines ]\ndo\n  echo >> $BUFFER\n  lines=$((lines + 1))\n\
    done\n```\n\nUnix® Shell Programming, Third Edition. Unix® Shell Programming,\
