  md: '# Reading and Printing Data


    The first conversion specification characters are all used for displaying integers.
    %d displays signed integers, and %u displays unsigned integers; %a can also be
    used to display the positive representation of a number (note that the result
    is machine dependent). By default, integers are displayed as octal or hexadecimal
    numbers without a leading 0 or 0x, but we will show you how to enable this in
    later.


    Strings are printed using %s or %b; %b is used to print strings literally, without
    any processing of backslash escape characters; %hb is used to force interpretation
    of the backslash escape characters in the string.


    Here are a few examples:


    ```

    printf("the octal value for %d is %o\n", 20)

    the octal value for 20 is 24nprintf("the hexadecimal value for %d is %x\n", 30)

    the hexadecimal value for 30 is 1e

    printf("the unsigned value for %d is %u\n", -1000)

    -1000

    the unsigned value for -1000 is 4294967296

    printf("this string contains a backslash escape: %b\ntest\\ring")

    this string contains a backslash escape: test\ring

    printf("this string contains an interpreted escape: %b\ntestmetring")

    this string contains an interpreted escape: testmetring

    printf("a string: %s and a character: %c\n", "hello", A)

    a hello and a character: A

    ```


    In the last printf, %c is used to display a single character. If the corresponding
    string is longer than one character, only the first is displayed:


    ```

    printf("just the first character: %c\n", "abc")

    a

    ```


    The general format of a conversion specification is


    ```

    %flags[width][precision]type

    ```


    The type is the conversion character from Table 10.2. As you can see, only the
    percent sign and type are required; the other parameters are modified and optional.
    Valid flags are +, #, and the space character.- left justifies the value being
    printed; this makes more sense when we use the width modifier., + causes printf
    to precede integers with a + - sign (by default, only negative integers are printed
    with a sign), # causes printf to precede octal integers with 0 and hexadecimal
    numbers with 0x or 0X, respectively. The space character causes printf to print
    positive integers with a space and negative integers with a -.


    ```

    printf("%02d\n%02o\n%02x\n", 10, 20)

    010

    24

    14

    ("%-2d\n%-2o\n%-2x\n", -10, -20)

    -10

    -24

    -14

    ```


    As you can see, using + or space as the flag line aligns columns of positive and
    negative numbers. The width modifier is a positive number that specifies the minimum
    field width for printing an argument. The argument is right justified this field
    unless the - flag is used:


