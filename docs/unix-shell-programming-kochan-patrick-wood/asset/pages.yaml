    # Removing a Function Definition


    To remove the definition of a function from the shell, you use the unset command
    with the -f option. This is the same command you use to remove the definition
    of a variable to the shell.


    ```

    $ unset -f nu

    #

    sh: nu: not found

    #

    ```


    # The return Command


    If you execute an exit command inside a function, its effect is not only to terminate
    execution of the function but also of the shell program that called the function.
    If you want to just terminate execution of the function, you can use the return
    command, which format is


    ```

    return n

    ```


    The value n is used as the return status of the function. If omitted, the status
    returned is that of the last command executed. This is what gets returned if you
    don''t execute a return at all in your function. The return status is in all other
    ways equivalent to the exit status: You can access its value through the shell
    variable $?, and you can test it in if, while, and until commands.


