  md: "# Chapter 9. 'Round and Round She Goes\n\n# IN THIS CHAPTER\n\n+   - The for\
    \ Command\n- The until Command\n- More on Loops\n- The getops Command\n- Exercises\n\
    \nIn this chapter you'll learn how to set up program loops. These loops will enable\
    \ you to execute repeatedly a set of commands either a specified number of times\
    \ or until some condition is met. The three built-in looping commands are\n\n\
    +   - for\n- While\n- until\n\nYou'll learn about each one of these loops in separate\
    \ sections of this chapter.\n\n# The for Command\n\nThe for command is used to\
    \ execute a specified number of times. Its basic format is as shown:\n\n```\n\
    for var in word; word; ... word_n\ndo\n    command\n    command\ndone\n```\n\n\
    The commands enclosed between the do and the done form what's known as the body\
    \ of the loop. These commands are executed for as many words as you have listed\
    \ after the in. When the loop is executed, the first word, word_, is assigned\
    \ to the variable var, and the body of the loop is then executed. Next, the second\
    \ word in the list, word_2, is assigned to var, and the body of the loop is executed.\
    \ This process continues with successive words in the list being assigned to var\
    \ and the commands in the loop being executed until the last word in the list,\
    \ word_n, is assigned to var and the body of the loop executed. At that point,\
    \ no words are left in the list, and execution of the for command is finished.\
    \ Then execution continues with the command that immediately follows the done.\
    \ So if there are n words listed after the in, the body of the loop will be executed\
    \ a total of n times after the loop has finished.\n\nHere's a loop that will be\
    \ executed a total of three times:\n\nUnix Shell Programming, Third Edition. Unix\
    \ Shell Programming, Third Edition, ISBN: 0-672-32490-3\n\nPrepared for architect@ognx.com,\
    \ Jeremy\n© 2003 O'Reilly Publishing. This download file is meant for personal\
    \ use only and is subject to the Terms of Service. Any other use requires prior\
    \ written consent from the copyright owner. Unauthorized use, reproduction and/or\
    \ distribution are strictly prohibited and violates applicable laws. All rights\
    \ reserved."
