  md: '# Shell Summary


    When the shell executes the exec command, it initiates execution of the specified
    command with the indicated arguments. Unlike other commands executed as a new
    process, command replaces the current process (that is, no new process is created).
    After command starts execution, there is no return to the program that initiated
    the exec.


    If just I/O redirection is specified, the input and output for the shell is accordingly
    redirected.


    # Examples


    | exec /bin/sh | Replace current process with sh |

    | exec < datafile | Reassign standard input to datafile |


    # The exit Command


    General Format: exit n


    Execution of exit causes the current shell program to be immediately terminated.
    The exit status of the program is the value of the integer n, supplied. If n is
    not supplied, the exit status is that of the last command executed prior to the
    exit.


    An exit status of zero is used by convention to indicate "success," and nonzero
    to indicate "failure" (such as an error condition). This convention is used by
    the shell in evaluation of conditions for if, while, and until commands, and with
    the && and | constructs.


    # Examples


    | who grep user > /dev/null | Exit with status of last grep |

    | exit i | Exit with status of i |

    | if finduser | If finduser returns an exit status of zero then... |

    | then |

    | fi |


    Note that executing exit from a login shell has the effect of logging out.


    # The export Command


    General Format: export variables


    The export command tells the shell that the indicated variables are to be marked
    as exported; that, their values are to be passed down subshells.


    # Examples


    ```

    export PATH PSI

    export dbhome x1 date

    ```


    Variables may be set when exporting using the form


    ```

    export variable=value...

    ```


    So lines like as


    ```

    PATH=$HOME:/bin; export PATH

    CDPATH=$HOME:/usr/local/uocpublic; export CDPATH

    ```


    can be rewritten as


