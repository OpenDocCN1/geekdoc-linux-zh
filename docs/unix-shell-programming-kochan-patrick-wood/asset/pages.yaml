  md: '# Resetting


    After you''ve changed the default action to be taken on receipt of a signal, you
    can change it back again with trap if you simply omit the first argument; so


    ```

    trap 1 2

    ```


    resets the action to be taken on receipt of signals 1 or 2 back to the default.


    # More on I/O


    You know about the standard constructs <, >, >> for input redirection, output
    redirection, and output redirection with append, respectively. You also know that
    you can redirect standard error from any command simply by writing


    ```

    command 2> file

    ```


    Sometimes you may want to explicitly write standard error in your program. You
    can redirect the standard output for a command to standard error by writing


    ```

    command > & 2

    ```


    The notation > redirects output to a file associated with the file descriptor
    that follows. File descriptor 0 is standard input, descriptor 1 is standard output,
    and descriptor 2 is standard error. Note that no space is permitted between the
    > and the


    So to write an error message to standard error, you write


    ```

    echo "Invalid number of arguments" >&2

    ```


    Frequently, you may want to collect the standard output and the standard error
    output from a program into the same file. If you know the name of the file, this
    is straightforward enough:


    ```

    command >file 2>&

    ```


    Here, both the standard output and the standard error output from command will
    be written to foo. You can also write


    ```

    command >foo 2>&1

    ```


    to achieve the same effect; standard output is redirected to foo, and standard
    error is redirected to standard output (which has already been redirected to foo).
    Note that the shell evaluates redirection from left to right along the command
    line, the last example cannot be written


    ```

    command 2>&1

    ```


    because this would first redirect standard error to standard output (your terminal
    by default) and then standard output to foo.


    You recall that you can also redirect standard input or output in a program using
    the exec command:


    ```

    exec < datafile

    ```


    redirects standard input from the file datafile. Subsequent commands executed
    that read from standard input will read from datafile instead. The command


    ```

    exec > /tmp/output

    ```'
