    $ mary had a little lambda_ Esc c $ mary had a little lambda_

    $ mary had a little lambda_ Esc e $ mary had a little lambda_

    $ mary had a little lambda_ Esc f $ mary had a little lambda_

    ```


    At any time you can press the Enter key and the current line will be executed
    as a command.


    ```

    $ mary had a little lambda_ Enter: enters command

    sh: mary: not found

    ```


    # Accessing Commands From Your History


    So, you''ve learned how to edit the current line. As we said before, the shell
    keeps a history of recently entered commands. To access these commands, you can
    use the emacs Ctrl +p and Ctrl+r. The Ctrl+p replaces the current line on your
    terminal with the previously entered command, putting the cursor at the end of
    the line. Let''s assume that these commands have just entered:


    ```

    $ pwd

    /users/jat

    $ cd /tmp

    $ echo this is a test

    this is a test

    ```


    Now use Ctrl+p to access them:


    ```

    $ Ctrl+p $ echo this is a test_

    ```


    Every time Ctrl+p is used, the current line is replaced by the previous line from
    the command history.


    ```

    $ echo this is a test_ $ cd /tmp_

    $ cd /tmp_ $ Ctrl+p $ pwd_

    ```


    To execute the command displayed, just press Enter.


    ```

    $ pwd_

    /tmp_

    $

    ```


    The Ctrl+n is the reverse of the Ctrl+p command and is used to display the next
    command in the history.


