    5 names

    ```


    Some commands require the options to be listed before the filename arguments.
    For example, sort names -r is acceptable, whereas wc -l is not. Let''s generalize
    by saying that command options should precede filenames on the command line.


    # Making a Copy of File: the cp Command


    To make a copy of a file, the cp command is used. The first argument to the command
    is the name of the file to be copied (known as the source file), and the second
    argument is the name of the file to place the copy (known as the destination file).
    You can make a copy of the file names and call it saved_names as follows:


    ```

    $ cp names saved_names

    ```


    Execution of this command causes the file names to be copied into a file named
    saved_names. As with many Unix commands, the fact that a command prompt was displayed
    after the cp command was executed successfully.


    # Renaming a File: the mv Command


    A file can be renamed with the mv command. The arguments to the mv command follow
    the same format as the cp command. The name of the file to be renamed, and the
    second argument is the new name. To change the name of the file saved_names to
    hold_it, for example, the following command would do the trick:


    ```

    $ mv saved_names hold_it

    ```


    When executing an mv or cp command, the Unix system does not care whether the
    file specified as the second argument already exists. If it does, the contents
    of the file will be lost. For example, if a file called old_names exists, executing
    the command


    ```

    $ cp old_names old_names

    ```


    would copy the file to old_names, destroying the previous contents of old_names
    in the process. Similarly, the command


    ```

    $ mv names old_names

    ```


    would rename names to old_names, even if the file old_names existed prior to execution
    of the command.


