    \ the if command is\n\n```\nif command;\n  then\n    command\nfi\n```\n\nwhere\
    \ command, is executed and its exit status is tested. If the exit status is zero,\
    \ the commands that follow between the then and the fi are executed; otherwise,\
    \ they are skipped.\n\n# **Exit Status**\n\nWhenever any program completes execution\
    \ under the Unix system, it returns an exit status back to the system. This is\
    \ a number that usually indicates whether the program successfully ran. By convention,\
    \ an exit status of zero indicates a program succeeded, and nonzero indicates\
    \ that it failed. Failures can be caused by invalid arguments passed to the program,\
    \ or by an error detected by the program. For example, the cp command returns\
    \ a nonzero exit status if the copy fails for some reason (for example, if it\
    \ cannot create the destination file), or if the arguments are not correctly specified\
    \ (for example, wrong number of arguments, or more than two arguments and the\
    \ last one is not a directory). In the case of grep, an exit status of zero (success)\
    \ is returned if it finds the pattern in at least one of the files; a nonzero\
    \ value is returned if it can't find the pattern or if an error occurs (the arguments\
    \ are not correctly specified, or it can't open one of the files)\n\nIn a pipeline,\
    \ the exit status is that of the last command in the pipe. So"
