  md: "# Round & Round She Goes\n\nAfter checking that argument was provided, the\
    \ program assigns $1 to user. Then an until loop is entered. This loop will be\
    \ executed until the exit status returned by grep is zero; that is, until the\
    \ specified user logs on. As long as the user is not logged on, the body of the\
    \ loop—the sleep command—is executed. This command stands suspension of the program\
    \ for one minute (60 seconds). At the end of the minute, the pipeline listed after\
    \ the until is reexecuted and the process repeated.\n\nWhen the until loop is\
    \ exited—signaling that the monitored user has logged on—a message is displayed\
    \ at the terminal to that effect.\n\n+   * mon sandy Time passes\n  sandy has\
    \ logged on\n\nUsing the program as shown here is not very practical because it\
    \ ties your until sandy logs on. A better idea is to run it in the background\
    \ so that you can use your terminal for other work:\n\n+   * mon sandy Run it\
    \ in the background\n  [!] 4356 Job number and process id\n  next nextemo Do work\n\
    \nsandy has logged on Happens later\n\nSo now you can do work and the mon program\
    \ continuing in the background until sandy logs on, or until the loop goes off\
    \ system.\n\nBecause mon only checks once per minute for the user's logging on,\
    \ it won't have the chance you miss that one-line message (you may be beating\
    \ a file editor and not even notice when it come and right off your screen). Also\
    \ if you're editing a file editor such as vi when the message comes, it may turn\
    \ your screen into a mess, and you will still miss that. A better alternative\
    \ to writing the message to the terminal might be to mail it. Actually, you can\
    \ let the user select his or her preference by adding an option to the program\
    \ that if selected, indicates that the message is to be mailed. If the option\
    \ is not selected, the message can be displayed at the terminal.\n\nIn the version\
    \ of mon that, -m option has been added for this purpose:\n\n```\ncat mon\n# Wait\
    \ until a specified user logs on -- version 2\n#\nif [ \"$1\" = \"-m\" ]\nthen\n\
    \  mailopt=TRUE\n  shift\nelse\n  mailopt=FALSE\nfi\nif [ \"$#\" -eq 0 ] || [\
    \ \"$#\" -gt 1 ]; then\necho \"Usage: [-m] user\"\necho \" means to be informed\
    \ by mail\"\n```\n\n> All processes are automatically terminated when you log\
    \ off the system. If you want a program to continue executing after you've logged\
    \ off, you can run it with nohup, or schedule it to run at some time. Consult\
    \ the Unix User's Manual for more details.\n\nUnix Shell Programming, Third Edition.\
    \ Unix Shell Programming, Third Edition, ISBN: 0-672-32490-3\nCopyright © 2006\
    \ by Prentice Publishing. This download file is made available for personal use\
    \ and is subject to the Terms of Service. Any other use requires prior written\
    \ consent of the copyright owner. Unauthorized use, reproduction and/or distribution\
    \ is strictly prohibited and violates applicable laws. All rights reserved."
