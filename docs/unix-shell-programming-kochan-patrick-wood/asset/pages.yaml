  md: '# Your Environment


    In the case of a subshell executing another subshell (for example, the role program
    executing the lu program), the process is repeated. Exported variables from the
    subshell are copied to the new subshell. These exported variables may have been
    exported from above, or newly exported from within the subshell.


    After a variable is exported, it remains exported to all subshells subsequently
    executed.


    Consider a modified version of vertest4:


    ```

    # cat vertest4

    x=50

    y=5

    z=1

    export x

    vertest5

    $

    ```


    and also consider vertest5:


    ```

    # cat vertest5

    echo x=$x

    echo y=$y

    echo z=$z

    $

    ```


    When vertest4 gets executed, the exported variable y will be copied into the subshell''s
    environment. vertest4 sets the value of x to 50, changes the value of y to 5,
    and sets the value of z to 1. Then it exports z. This makes the value of z accessible
    to any subshell subsequently run by vertest4, and when it is executed, the shell
    copies into its environment the exported variables from vertest4:y and z. This
    should explain the following output:


    ```

    $ vertest4

    x=

    y=

    z=1

    $

    ```


    This entire operation is depicted in Figure 11.6.


