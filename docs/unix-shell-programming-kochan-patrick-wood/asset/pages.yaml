  md: '# A Quick Review of the Basics


    # Sending a Command to the Background


    Normally, you type in a command and then wait for the results of the command to
    be displayed at the terminal. For all the examples you have seen thus far, this
    waiting time is typically short—maybe a second or two. However, you may have to
    run commands that require many seconds or even minutes to execute. In such cases,
    you will have to wait for the command to finish executing before you can continue
    further work, or send the command to the background.


    If you type a command followed by the ampersand character (&), that command will
    be sent to the background for execution. You can then proceed with other work.
    The standard output from the command will still be directed to your terminal;
    if the command does not read any standard input, it will be stopped and wait for
    you to bring it to the foreground (we''ll discuss this in more detail in Chapter
    15, "Interactive and Nonstandard Shell Features")


    ```

    $ sort data > & Send the work to the background

    [1]  Process id

    $ date Your terminal is immediately available to do work

    Sat Jun 20 14:55:09 EDT 2002

    ```


    When a command is sent to the background, the Unix system automatically displays
    two numbers. The first is called the job number and the second the process id.
    In the preceding example, 1 was the job number and 1258 the the process id. The
    job number is used by some shell commands that you''ll learn more about in Chapter
    15. The process id uniquely identifies the command that you sent to the background
    and can be used to obtain status information about the command. This is done with
    the ps command.


    # The ps Command


    The ps command gives you information about the processes running on the system.
    ps without any options prints status of your processes. If you type ps at your
    terminal, you''ll get a few lines describing the processes that you have running:


    ```

    $ ps

    PID TTY TIME COMMAND

    1955 01 0:21 sh The shell

    1953 01 0:00 ps This ps command

    1258 01 0:10 sort The previous sort

    ```


    The ps command prints four columns of information: PID, the process id; TTY, the
    terminal number that the process was run from; TIME, the amount of time in minutes
    and seconds that the process has used; and COMMAND, the name of the process. (The
    sh in the process example is the shell that was started when you logged in, and
    it has used 2 seconds of computer time.) Until the command is finished, it shows
    up in the output of the ps command as a running process. Process number 1353 in
    the preceding example is the ps command that typed in, and 1258 is the sort from
    the preceding example.


    When used with the -f option, ps prints out more information about your processes,
    including the parent process id (PPID), the time started (STIME), and the command
    arguments:'
