    # The getsopt command


    Let''s extend our mon program further. We will add a -t option to it that specifies
    the time interval, in seconds, to perform the check. Now our mon program takes
    -m and -t options. We will allow it to take these options in any order on the
    command line, provided that they are used, they appear before the name of the
    user that we''re monitoring. Valid mon command lines look like this:


    ```

    mon -m ann

    mon -t 600 ann

    mon -m ann -t 400 ann

    mon -t 400 -m ann

    ```


    and invalid ones like this:


    ```

    mon -t 600 ann

    Missing user name

    mon ann

    Need space after -t

    mon -t

    Options not appear first

    ```


    If you writing the code to allow this sort of flexibility on the command line,
    you will discover that it can start to get a bit complex. Ideally, the shell built-in
    command getsopt exists for the express process of processing command-line arguments.
    The general format of the command is


    ```

    getsopt options variable

    ```


    The getsopt command is designed to be executed inside a loop. Each time through
    the loop, getsopt determines the next command line argument and whether it is
    a value. This determination is made by checking whether the argument begins with
    a minus sign and is followed by any single character inside option. If it does,
    getsopt returns the matching option letter in the specified variable and returns
    zero status.


    If the letter that follows the sign is not inside getsopt, getsopt stores a question
    mark variable before returning with a zero exit status. It also writes an error
    message to standard error.


    If no arguments are left on the command line or if the next argument does not
    begin with a minus sign, getsopt returns a nonzero status.


    Suppose that you want getsopt to recognize the options -a, -i, and -r for a command
    called foo.


    foo getsopt might look like this:


    ```

    getsopt air option

    ```


    Here the first argument--air-specifies the three acceptable options to the command,
    and option variable specifies the variable getsopt will use as previously described.


    The getsopt command permits options to be "stacked" on the command line. This
    is done by following a single minus sign with one or more consecutive options
    letters. For example, our foo command can be executed like this:


