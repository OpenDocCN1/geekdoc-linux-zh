    - The IFS Variable

    - The readonly Command

    - The unset Command

    - Exercises


    In this chapter, you''ll learn more about parameters. Technically, parameters
    include the arguments passed to a program (the positional parameters), the special
    shell variables such as $# and ?, ordinary variables, also known as keyword parameters.


    Positional parameters cannot be assigned values general than shown; however, they
    can be reassigned values with the set command. Keyword parameters are assigned
    values simply by writing


    ```

    variablevalue

    ```


    The format is a bit more general than that; actually, you can assign several keyword
    parameters at once using the format


    ```

    variablevalue=variablevalue...

    ```


    as the following example illustrates:


    ```

    $ x=100 y=200 z=50

    $ echo $x $y $z

    100 200 50 $

    ```


    # Parameter Substitution


    In the simplest form, to have the value of a parameter substituted, you simply
    precede the parameter with a dollar sign, as in $1 or $5.


    ```

    ${parameter}

    ```


    If there''s a potential conflict caused by the characters that follow the parameter
    name, you can enclose the name inside curly braces, as in


    ```

    mv file ${file}

    ```


    This command would add an x to the end of the filename specified by $file and
    could not be written as


