    # Copying a File from One Directory to Another


    The cp command can be used to copy a file from one directory into another. For
    example, you can copy the file wb from the programs directory into a file wbx
    in the misc directory as:


    ```

    $ cp programs/wb misc/wbx

    ```


    Because the two files are contained in different directories, it is not even necessary
    that they be given different names:


    ```

    $ cp programs/wb misc/wb

    ```


    When the destination file has the same name as the source file (in a different
    directory, of course), it is necessary to specify only the destination directory
    as the second argument:


    ```

    $ cp wb collect mon ..misc

    ```


    When this command executed, the Unix system recognizes that the second argument
    is the name of a directory and copies the source file into that directory. The
    new file is given the same name as the source file. You can copy more than one
    file into a directory by listing the files to be copied before the name of the
    destination directory. If you were currently in the programs directory, the command


    ```

    $ pwd

    /users/steve/misc

    $ cp ../programs/misc collect

    ```


    To copy a file from another directory into your current one and give it the same
    name, use the fact that the current directory can always be referenced as ".


    The preceding command copies the file collect from the directory ../programs into
    the current directory (/users/steve/misc).


