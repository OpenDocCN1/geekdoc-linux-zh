  md: '# What Is the Shell?


    I/O Redirection


    It is the shell''s responsibility to take care of input and output on the command
    line. It scans the command line for the occurrence of the special redirection
    characters <, or > (also << as you learn in Chapter 13, "Loose Ends")


    When you type the command


    ```

    echo Remember | tee Law and Order > reminder

    ```


    the shell recognizes the special redirection character - and takes the next word
    on the command line as the name of the file that the output is redirected to.
    If reminder, if reminder already exists and you have write access to it, the previous
    contents are lost (if you don''t have access to it, the shell gives you an error
    message)


    Before the shell starts execution of the desired program, it redirects the standard
    output of the program to the indicated file. As far as the program is concerned,
    it knows that its output is being redirected. It just goes about its merry writing
    to standard output (which is normally your terminal, if you''ll recall), unaware
    that the shell has redirected it to a file.


    Let''s another look at two nearly identical commands:


    ```

    $ wc -l users

    5 users

    $ wc -l < users

    5

    ```


    In the first case, the shell analyzes the command line and determines that the
    name of the program to execute is wc and that -1 and users are passed as arguments
    (see Figure 3.12).


    ![](img/f721b95d36c075f0637b85b379ede747_48_0.png)


    When wc begins execution, it sees that it was passed two arguments. The first
    argument, -1, tells it to count the number of lines. The second argument specifies
    the name of the file whose lines are to be counted. So wc opens the file users,
    counts its lines, and then prints the count together with the filename at the
    terminal.


    Operation of wc in the second case is slightly different. The shell spots the
    input redirection character < when it scans the command line. The word that follows
    the command line is the name of the file input is to be redirected from. Having
    "gobbled up" the users from the command line, the shell then starts execution
    of the wc program, redirecting its standard input from the file users and passing
    it as the single argument -1 (see Figure 3.13).


    ![](img/f721b95d36c075f0637b85b379ede747_48_1.png)


