    The difference in execution of the two commands is important for you to understand.
    If you''re still unclear on this point, review the preceding section.


    # Pipeline Hookup


    Just as the shell scans the command line looking for redirection characters, it
    also looks for the pipe character |. For each such character that it finds, connects
    the standard output of the command preceding the to the standard input of the
    one following the |. It initiates execution of both programs.


    So when you type


    ```

    who | we -l

    ```


    the shell finds the pipe symbol separating the commands who and we. It connects
    the standard output of the former command to the standard input, and then initiates
    execution of both commands. When the who command executes, it makes a list of
    who logged in and writes the results to standard output, unaware that it is not
    going to the terminal but another command instead.


    When the we command executes, it recognizes that no filename was specified and
    counts the lines on standard input, unaware that standard input is not coming
    from the terminal but from the output of the who command.


    # Environment Control


    # Interpreted Programming Language


    The shell has its built-in programming language. This language is interpreted,
    meaning that the shell analyzes every statement in the language one line at a
    time and then executes it. This differs from programming languages such as C and
    FORTRAN, in which the programming statements are typically compiled into a machine-executable
    form before they are executed.


    Programs developed in interpreted languages are typically easier to debug and
    modify than compiled ones. However, they usually take much longer to execute than
    their equivalents.


    The shell programming language provides features you''d find in most other programming
    languages. It has looping constructs, decision-making statements, variables, and
    functions, and is procedure-oriented. Modern shells built on the IEEE POSIX standard
    have many other features including arrays, data typing, and built-in arithmetic
    operations.


