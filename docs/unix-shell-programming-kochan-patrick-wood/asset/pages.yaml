  md: '# Output Redirection


    The output from a command normally intended for standard output can be easily
    diverted to a file instead. This capability is known as output redirection.


    If the notation >file is appended to any command that normally writes its output
    to standard output, the output of that command will be written to file instead
    of your:


    ```

    $ who > users

    oko tty1 Sep 12 07:10

    as tty1 Sep 12 13:12

    ruth tty2 Sep 12 10:10

    pat tty24 Sep 12 13:07

    steve tty25 Sep 12 13:03

    ```


    This command line executes the who to be executed and its output to be written
    into the file users. Notice that no output appears at the terminal. This is because
    the output has been redirected from the default output device (the terminal) into
    the specified file:


    ```

    $ cat users

    oko tty1 Sep 12 07:10

    as tty1 Sep 12 13:12

    ruth tty2 Sep 12 10:10

    pat tty24 Sep 12 13:07

    steve tty25 Sep 12 13:03

    ```


    If a command has output to a file and the file already contains some data, that
    data will be lost. Consider this example:


    ```

    $ echo line 1 > users

    $ cat users

    line 1

    $ echo line 2 >> users

    $ cat users

    line 1

    line 2

    ```


    The second echo command uses a different type of output redirection indicated
    by the characters >>. This character pair appends to the specified file. Therefore,
    the previous contents of the file are not lost, and the new output simply gets
    added onto the end.


    By using the redirection append characters >> you can use cat to append the content
    of one file to the end of another:


    ```

    $ cat file1

    This is in file1.

    $ cat file2

    This is in file2.

    $ cat file1 >> file2

    Append file1 to file2

    This is in file2.

    This is in file1.

    ```


    Recall that specifying more than one filename to cat results in the display of
    the first file followed immediately by the second file, and so on:


    ```

    $ cat file1

    This is in file1.

    $ cat file2

    This is in file2.

    $ cat file1 file2

    This is in file1.

    This is in file2.

    $ cat file1 file2 > file3

    Redirect the output of both to file3

    ```'
  merge: -1
