    ```


    As you can see from the preceding example, if no subscript is specified, element
    zero is used.

    If you forget the curly braces when performing the substitution, here''s what
    happens:


    ```

    $ echo ${array[1]}

    hello[1]

    ```


    In the preceding example, the value of array is substituted (hello--the value
    inside array[0]) and then echoed with [1]. (Note that because the shell does filename
    substitution after variable substitution, the shell would attempt to match the
    pattern hello[1] against the files in your current directory.)


    The construct [* can be used to substitute all the elements of the array on the
    command line, with each element delimited by a single space character.


    ```

    $ echo ${array[*]}

    hello some text/users/steve/memos

    ```


    The construct ($#*) can be used to substitute the number of elements in the array.


    ```

    $ echo ${#[*]}

    ```


    Note that the number reported here is the actual number of values stored inside
    the array, not the largest subscript used to store an element in the array.


    | array[10--] | Display all elements |

    | echo ${#array} | hello some text/users/steve/memos foo |

    | echo ${#array} | Number of elements |

    | 4 |


    You can declare an array of integers to the shell by giving the array name to
    typeset -i


