    # More on Subshells


    It''s important for you to understand the way subshells work and how they interact
    with your environment. Now you know that a subshell can''t change the value of
    a variable in a parent shell, nor can it change its current directory. Suppose
    that you want to write a program to set values for some variables that you would
    like to use whenever you log on. For example, assume that you have the following
    file named:


    ```

    $ set var

    BOOK=/users/steve/book

    PATH=/usr/spool/ucypublic

    CDPATH=/users/steve/docs/memos

    DB=/usr/local/data

    ```


    You know that if you execute vars, the values assigned to these variables will
    not be accessible by you after this program has finished executing vars will be
    run in a subshell:


    ```

    $ vars

    $ echo BOOK

    /users/steve/book

    ```


    # The . Command


    Luckily, there is a shell built-in command called . (pronounced "dot") whose general
    format is


    +   - file


    and whose purpose is to execute the contents of file in the current shell. That
    is, commands from file are executed as if they were typed at that point. A subshell
    is not spawned to execute the program. The shell uses your PATH variable to find
    file, just like it does when executing other programs.


    ```

    $ vars      Execute vars in the current shell

    $ echo BOOK

    Noozah!

    $ /users/steve/book

    ```


    Because a subshell is not spawned to execute the program, any variable that gets
    assigned a value stays after execution of the program is completed. It then follows
    that if you have a program db that has the following commands in:


