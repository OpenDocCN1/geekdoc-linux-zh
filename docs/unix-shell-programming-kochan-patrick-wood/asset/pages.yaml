  md: "# Shell Summary\n\n# The ~fg Command\n\nGeneral Format: fg job_id\n\nIf job\
    \ control is enabled, the job specified by job_id is brought to the foreground.\
    \ If no argument is given, the most recently suspended job, or the job last sent\
    \ to the background is brought to the foreground.\n\nExample\n\n```\nfg $2\n```\n\
    \n# The ~for Command\n\nGeneral Format:\n\n```\nfor var in word1; word2 ... wordn\n\
    do\n  command\n  command\n  ...\n  done\n```\n\nExecution of this command causes\
    \ the commands enclosed between the do and done to be executed as many times as\
    \ there are words listed after the in.\n\nThe first time through the loop, the\
    \ first—word—is assigned to var and the commands between the do and done executed.\
    \ The second time through the loop, the second listed—word—is assigned to var\
    \ and the commands in the loop executed again. This process continues until the\
    \ last variable in the list—word—is assigned to var and the commands between the\
    \ do and done executed. At that point, execution of the loop is terminated. Execution\
    \ then continues with the command that immediately follows the done.\n\nThe special\
    \ format\n\n```\nfor var\ndo\n  ...\nndone\n```\n\nindicates that the positional\
    \ parameters \"1\", \"2\", ... are to be used in the list and is equivalent to\n\
    \n```\n...\ndone\n```\n\nExample\n\n```\n# nroff all of the files in the current\
    \ directory\nfor file in *\ndo\n  nroff -tip file | lpr\ndone\n```\n\n# The getopts\
    \ Command\n\nGeneral Format: getopts options var\n\nThis command processes command-line\
    \ arguments. options is a list of valid single letter options. If any letter in\
    \ options is followed by a :, that option takes a following argument on the command\
    \ line, which must be separated from the option by at one whitespace character.\n\
    \nUnix® Shell Programming, Third Edition. Unix® Shell Programming, Third Edition,\
    \ ISBN: 0-672-32490-3\n\nCopyright © 2003 Prentice Publishing. This download file\
