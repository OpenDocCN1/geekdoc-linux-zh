  md: '# Chapter 1. Introduction


    It''s no secret that the Unix operating system has emerged as a standard operating
    system. For programmers who have been using Unix for many years now, this came
    as no surprise: The Unix system provides an elegant and efficient environment
    for program development. After all, this is what Dennis Ritchie and Ken Thompson
    strive for when they developed Unix at Bell Laboratories in the 1960s.


    One of the strongest features of the Unix system is its wide collection of programs.
    More than 200 basic commands are distributed with the standard operating system.
    These commands (also known as tools) do everything from counting the number of
    lines in a file, to sending electronic mail, to displaying a calendar for any
    desired year.


    But the real strength of Unix system comes not entirely from this large collection
    of commands also from the elegance and ease with which these commands can be combined
    to perform far sophisticated functions.


    To fulfill this end, and also to provide a buffer between the user and the guts
    of the Unix system (the kernel), the shell was developed. The shell is simply
    a program that reads the commands you type and converts into a form readily understood
    by the Unix system. It also includes some fundamental programming constructs that
    let you make decisions, loop, and store values in variables.


    The standard shell distributed with Unix systems was delivered by AT&T''s distribution,
    which evolved from a version written by Stephen Bourne the Bourne shell and other
    recent shells. The current version of this standard as this revision is the Shell
    and Utilities of IEEE Std 1003.1-2001, also known as the POSIX standard. This
    shell is what we propose to teach you about in this book.


    The examples in this book were written on SunOS 5.7 running on a Sparcstation
    Ultra-30 and Silicon Graphics IRUX 6.5 running on Octane; some examples were also
    run on Red Hat Linux 7.1 and Cygwin. All examples, except Bash examples in Chapter
    15, were using the Korn shell, although many were run with Bash.


    Many Unix systems are all that Bourne shell derivatives and utilities not compliant
    with the POSIX standard. We''ll try to note this wherever possible, however, there
    are so many versions of Unix from many different vendors that it''s not possible
    to meet every difference. For an Unix system that doesn''t supply a POSIX-compliant
    shell, we''ll hope for resources at the end of this book which you can obtain
    free copies of there POSIX-compliant shells.


    Because the shell offers an interpreted programming language, programs can be
    written, modified, and debugged quickly and easily. We turn to the shell as our
    first choice of programming language. After you become adept at programming in
    the shell, you may too turn to it first.


    Unix® Shell Programming, Third Edition. Unix® Shell Programming, Third Edition,
    ISBN: 0-672-32490-3


