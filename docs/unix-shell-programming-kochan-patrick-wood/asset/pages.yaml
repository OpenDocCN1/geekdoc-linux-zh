  md: '# A Quick Review of the Basics


    ls

    READ_ME

    names

    tmp


    This output indicates that three files called READ_ME, names, and tmp are contained
    in the current directory. (Note that the output of ls may vary from system to
    system. For example, on Unix systems ls produces multicolumn output when sending
    its output to a terminal; on others, different colors may be used for different
    types of files. You can always force single-column output with the -1 option).


    # Displaying the Contents of a File: The cat Command


    You can examine the contents of a file by using the cat command. The argument
    to cat is the name of the file whose contents you want to examine.


    ```

    cat names

    Susan

    Jeff

    Benny

    Allan

    Ken

    ```


    ![](img/f721b95d36c075f0637b85b379ede747_13_0.png)


    # Counting the Number of Words in a File: The wc Command


    With the wc command, you can get a count of the total number of lines, words,
    and characters of information contained in a file. Once again, the name of the
    file is needed as the argument to this command:


    ```

    wc names

    1 5 27 names

    ```


    The wc command lists three numbers followed by the filename. The first number
    represents the number of lines contained in the file (5), the second number of
    words contained in the file (in this case also 5), and the third number of characters
    contained in the file (27).


    # Command Options


    Most commands allow the specification of options at the time a command is executed.
    These options generally follow the same format:


    ```

    -letter

    ```


    That is, a command option is a sign followed immediately by a single letter. For
    example, to count the number of lines contained in a file, the option -l (that''s
    the letter l) is given to the wc command:


    ```

    wc -l names

    5 27 names

    ```


    To count the number of characters in a file, the -c option is specified:


    ```

    wc -c names

    5 27 names

    ```


