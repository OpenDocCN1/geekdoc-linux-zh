  md: '# Decisions, Decisions


    Note that test can be picky about its arguments. For example, if the shell variable
    symbol contains an equals sign, look at what happens if you try to test it for
    zero length:


    ```

    $ echo symbol

    $ test -z ''Symbol''

    sh test: argument expected

    ```


    The operator has higher precedence than the -z operator, so test expects an argument
    to follow. To avoid this problem, you can write your command as


    ```

    test "$symbol" = =

    ```


    will be true if symbol is null, and false if it''s not. The X in front of symbol
    prevents test from interpreting the characters stored in symbol as an operator.


    # An Alternative Format for test


    The test command is so often used by shell programmers that alternative format
    of the command is recognized. This format improves the readability of the command,
    especially when used in if commands.


    You''ll recall the general format of the test command


    ```

    test expression

    ```


    This can also be expressed in the alternative format as


    ```

    [ expression ]

    ```


    The [ is the name of the command (who said anything about command names having
    to be alphanumeric characters?). It initiates execution of the test command, only
    in this format, test expects to see a closing ] at the end of the expression.
    Naturally, spaces must appear after the and before the ].


    You can rewrite the test command shown in a previous example with this alternative
    format:


    ```

    $ -z "$nullvar"

    $ echo $?

    ```


    When used in if command, this alternative format looks like this:


    ```

    if [ "$name" = julie ]

    then echo "Would you like to play a game?nfi

    ```


    Which format of the command you use is up to you; we prefer the [...] format,
    so that''s what we use throughout the remainder of the book.


    # Integer Operators


    test has an assortment of operators for performing integer comparisons. Table
    8.2 summarizes these operators.


