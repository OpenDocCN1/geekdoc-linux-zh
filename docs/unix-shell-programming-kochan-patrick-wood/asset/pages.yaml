  md: '# More on Parameters


    # The readonly command


    The readonly command is used to specify variables whose values cannot be subsequently
    changed. For example:


    ```

    readonly PATH HOME

    ```


    makes the PATH and HOME variables read-only. Subsequently attempting to assign
    a value to these variables causes the shell to throw an error message:


    ```

    $ PATH=/bin/usr/bin:

    readonly PATH

    $ PATH=/users/steve/bin

    ash: PATH: read-only

    ```


    Here you see that after the variable PATH was made read-only, the shell printed
    an error message when an attempt was made to assign a value to it.


    To get a list of your read-only variables, type readonly -p without any arguments:


    ```

    $ readonly -p

    readonly PATH=/bin/usr/bin:

    ```


    unset removes both exported and local shell variables.


    You should be aware that the read-only attribute is not passed down to subshells.
    Also, after a variable has been made read-only in a shell, there is no way to
    "undo" it.


    # The unset Command


    Sometimes you may want to remove the definition of a variable from your environment.
    To do so, you type unset followed by the names of the variables:


    ```

    $ x=100

    $ echo $x

    100

    $ unset x

    Remove x from the environment

    $ echo $x

    ```


    You can''t unset a read-only variable. Furthermore, the variables IFS, MAILCHECK,
    PATH, PS1, and PS2 cannot be unset. Also, some others do not support the unset
    command.


