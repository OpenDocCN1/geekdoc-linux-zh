  md: '# Shell Summary


    295


    # The true Command


    General Format: true


    This command returns a zero exit status.


    # The type Command


    General Format: type commands


    This command prints information about the indicated commands.


    Examples


    ```

    $ type troff echo

    troff is /usr/bin/troff

    echo is a shell builtin


    ```


    # The umask Command


    General Format: umask mask


    umask sets the default file creation mask to mask. Files that are subsequently
    created are ANDed with this mask to determine the mode of the file.


    umask with no arguments prints the current mask. The -s option says to produce
    symbolic output.


    Examples


    ```

    $ umask             Print current mask

    0002                No write to others

    umask 022           No write to group either


    ```


    # The aliases Command


    General Format: unalias names


    The alias''s names are removed from the alias list. The -a option says to remove
    all aliases.


    # The unset Command


    General Format: unset names


    This causes the shell to erase definitions of the variables or functions listed
    in names. Read-only variables cannot be unset. The -v option specifies that a
    variable name follows, whereas the -f option specifies a function name. If neither
    option is used, it is assumed that variable name(s)

    follow.


    Example


    ```

    unset dlist files       Remove definitions of variables dlist and files


    ```


