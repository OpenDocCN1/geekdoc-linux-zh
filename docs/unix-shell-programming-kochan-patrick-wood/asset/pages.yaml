  md: '# Tools of the Trade


    # The -s Option


    The -s option tells paste to paste lines from the same file, not from alternate
    files. If just one file is specified, the effect is to merge all the lines from
    the file together, separated by tabs, or by the delimiter characters specified
    with the -d option.


    ```

    $ paste -s names

    Tony Emanuel Lucy Fred

    $ lo | paste -d= file''s output, use space as delimiter

    addresses into lotmpaces names numbers phonebook

    ```


    In the preceding example, the output is piped to paste, which merges the (-s option)
    from standard input (-), separating each field with a space (-d'' option). Of
    course, you''ll recall from Chapter 2, "A Review of Basics," that the command


    ```

    echo *

    ```


    would have worked just as well (and is certainly more straightforward).


    # sed


    sed is a program for editing data. It stands for stream editor. Unlike ed, sed
    cannot be used interactively. However, its commands are simple. The general form
    of the sed command is


    ```

    sed command file

    ```


    where command is an ed-style command applied to each line of the specified file.
    If no file is specified, standard input is assumed. As sed applies the indicated
    command to each line of the input, it writes the result to standard output.


    Recall the file intro from previous examples:


    ```

    $ cat intro

    The Unix operating system was pioneered by Ken

    Thompson and Dennis Ritchie at Bell Laboratories

    in the late 1960s. One of the primary goals in

    the design of the Unix system was to create an

    environment that promoted efficient program

    ```


    Suppose that you want to change all occurrences of "Unix" to the text "UNIX."
    This can be easily done in sed:


    ```

    $ sed ''s/Unix/UNIX/'' intro Substitute Unix with UNIX

    The Unix operating system was pioneered by Ken

    Thompson and Dennis Ritchie at Bell Laboratories

    in the late 1960s. One of the primary goals in

    the design of the UNIX system was to create an

    environment that promoted efficient program

    ```


    For now, get into the habit of using your sed command in a pair of single quotes.
    Later, you''ll know when the quotes are necessary and how to use double quotes
    instead.'
