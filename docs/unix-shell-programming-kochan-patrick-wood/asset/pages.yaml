  md: "# Decisions, Decisions\n\n```\n# If more than one match, issue message, else\
    \ remove it\nif [ \"matches\" -gt 1 ];\nthen\n    echo \"More than one match;\
    \ please qualify further\"\nelif [ \"matches\" -eq 1 ];\nthen\n    grep -v \"\
    name\" > /tmp/phonebook\n    mv /tmp/phonebook phonebook\nelse\n    echo \"I couldn't\
    \ find name in the phone book\"\n```\n\nThe positional parameter $1 is assigned\
    \ to the variable name after the number of arguments check is performed to add\
    \ readability to the program. Subsequently $name is a lot clearer than using $1.\n\
    \nThe if...elif...else command first checks to check whether the number of matches\
    \ is greater than one. If it is, \"More than one match\" is printed. If it's not,\
    \ a test is made to see whether the number of matches is equal to one. If it is,\
    \ the entry is removed from the phone book. If it's not, the number of matches\
    \ must be zero, in which case a message is displayed to alert the user of this\
    \ fact.\n\nNote that the grep command is used twice in this program: first to\
    \ determine the number of matches and then with the -v option to remove the single\
    \ matching entry.\n\nHere are some sample runs of the third version of rem:\n\n\
    ```\n$ rem\nIncorrect numbers of arguments.\n$ rem name\n$ Susan\nMore than one\
    \ match; please qualify further\n$ rem Susan Topple\n$ rem 'Susan Topple'\n$ couldn't\
    \ find Susan Topple in the phone book    She's history\n```\n\nNow you have a\
    \ fairly robust rem program: it checks for the correct number of arguments, printing\
    \ the proper usage if the correct number isn't supplied; it also checks to make\
    \ sure that precisely one entry is removed from the phonebook file.\n\n# The case\
    \ Command\n\nThe case command allows you to compare a single value against other\
    \ values and to execute one or more commands when a match is found. The general\
    \ format of this command is\n\n```\ncase value in\n  pat1)\n    command\n    command\n\
    \    ...\n    command;\n  pat2)\n    command\n    command\n    ...\n    command;\n\
    \  patm)\n    command\n```\n\nUnix Shell Programming, Third Edition. Unix® Shell\
    \ Programming, Third Edition, ISBN: 0-672-32490-3\nPrepared for architect@opencss.\
    \ This download file is made available for personal use only and is subject to\
    \ the Terms of Service. Any other use requires prior written consent from the\
    \ copyright owner. © 2003 O'Reilly Media Publishing. Unauthorized use, reproduction\
    \ and/or distribution are strictly prohibited and violate applicable laws. All\
    \ rights reserved.\n* Susan"
