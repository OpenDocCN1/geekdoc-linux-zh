    To be moving to the beginning of the line, use the $0 (that''s a zero) command:


    ```

    $ had a little lambda 0 $ had a little lambda

    $ had a little lambda 2w $ had a little lambda

    $ had a little lambda 3b $ had a little lambda

    ```


    Two other commands useful in moving the cursor are the w and b commands. The w
    command moves the cursor forward to the beginning of the next word, where a word
    is a string of letters, numbers, and underscores delimited by blanks or punctuation.
    The b command moves the cursor backward to the beginning of the previous word.
    These commands may also be preceded by a number to specify the number of words
    to move forward or backward.


    At any time you press Enter and the current line will be executed as a command:


    ```

    $ had a little lambda Hit Enter

    knh: not found

    $

    ```


    After a command is executed, you are placed back in input mode.


    # Accessing Commands From Your History


    So far, you''ve learned how to edit the current line. You can use the vi commands
