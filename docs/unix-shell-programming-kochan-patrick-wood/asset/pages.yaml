  md: '# Interactive and Nonstandard Shell Features


    We''ll note any nonstandard features that we discuss in this chapter, and Table
    15.4 at the end of this chapter lists the features supported by the different
    shells.


    # Getting the Right Shell


    Most shells follow a convention that allows you to select a specific program to
    run a file. If the first two characters on the first line of a file are #!, the
    remainder of the line specifies an interpreter for the file. So


    ```

    #/usr/bin/ksh

    ```


    specifies the Korn shell and


    ```

    #/usr/bin/bash

    ```


    specifies Bash. If you constructs specific to one shell, you can use this feature
    to force that shell to run your programs, avoiding compatibility problems.


    Note that you can put any program you want here, as a Perl program beginning with


    ```

    #/usr/bin/perl

    ```


    forces the shell to execute this feature with caution, however, because many programs,
    such as Perl, don''t reside in a standard place on every Unix system. Also, this
    is not a feature specified by the POSIX standard, even though it''s in every modern
    shell we''ve seen and is implemented at the operating system level on many Unix
    versions.


    # The ENV File


    When you start the shell, one of the first things it does is look in your environment
    for a variable called ENV. If it finds the file specified by ENV will be executed,
    much like the profile executed when logging in. The ENV file usually contains
    commands to set up the shell''s environment. Throughout this chapter, we''ll mention
    various things that you may want to put into this file.


    If you decide to have an ENV file, you should export the ENV variable inside your
    .profile file:


    ```

    $ cat profile

    ENVPATH=/alias

    export ENV

    ```


    For Bash, the ENV file is read only when Bash is invoked with the name sh or with
    the posix command-line option, or after set -posix is executed (all of which force
    POSIX standard compliance). By default, when noninteractive Bash shell is started
    (for example when you run a shell program), it reads commands from the file specified
    by the BASH_ENV environment variable, and when an interactive Bash shell is started
    (for example, by typing bash at the command prompt), it does.


    You should also set and export your .profile variable called SHELL.


    Unix® Shell Programming, Third Edition. Unix Shell Programming, Third Edition,
    ISBN: 0-672-32490-3


