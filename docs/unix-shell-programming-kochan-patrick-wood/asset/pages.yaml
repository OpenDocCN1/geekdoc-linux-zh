    $ echo PWD

    /users/steve/bin

    ```


    cd also sets OLDPWD to the full pathname of the previous current directory.

    Incidentally, cd is a shell built-in command.


    # CDPATH


    The CDPATH variable works like the PATH variable: It specifies a list of directories
    to be searched by the shell whenever you execute a cd command. This search is
    done only if the specified directory is not given by a pathname and if CDPATH
    is not null (obviously). If you type in


    ```

    $ cd /users/steve

    ```


    the shell changes your directory directly to /users/steve; but if you type


    ```

    cd memos

    ```


    the shell looks up your CDPATH to find the memos directory, and if your CDPATH
    looks like this:


    ```

    $ echo CDPATH

    .:/users/steve:/users/steve/docs

    ```


    the shell first looks in your current directory for a memos directory, and if
    not found looks in /users/steve for a memos directory, and if not found there
    /users/steve/docs in a last ditch effort to find the directory. If the directory
    it finds is not relative to your current one, the cd command prints the full pathname
    to let you know where it is taking you:


    ```

    $ cd /users/steve

    $ cd memos

    /users/steve/docs/memos

    $ cd bin

    /users/steve/bin

    ```


    Like the PATH variable, use of the period for specifying the current directory
    is optional, so


