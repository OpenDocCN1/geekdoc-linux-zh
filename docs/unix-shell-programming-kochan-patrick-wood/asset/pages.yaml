  md: '# Loose Ends with No Arguments


    Executing trap with no arguments results in the display of any traps that you
    have changed.


    ```

    $ trap echo logged off at $(date) >>$HOME/logoffs: 0

    $ trap

    trap List changed traps

    trap ''echo logged off at $(date) >>$HOME/logoffs'' EXIT

    Ctrl+D log off

    login: log back in

    Password:

    $ cat $HOME/logoffs See what happened

    logged off at Wed Oct 25 15:11:38 EST 2002

    ```


    A trap was set whenever signal 0 was received by the shell. This signal is generated
    whenever the shell is exited. Because this was set in the login shell, the trap
    will be taken when you log off. The purpose of this trap is to write the time
    you logged into the file $HOME/logoffs. The command is enclosed in single quotes
    to prevent the shell from executing date the trap is defined.


    The trap command is then executed with no arguments, which results in the display
    of the changed action to be for signal 0 (EXIT). Next, steve logs off and then
    again to see whether the trap works. Displaying the contents of $HOME/logoffs
    verifies that the echo command was executed when steve logged off.


    # Ignoring Signals


    If the command listed for trap is null, the specified signal is ignored when received.
    For example, the command


    ```

    trap "" 2

    ```


    specifies that the interrupt signal is to be ignored. You might want to ignore
    certain signals when performing some operation that you don''t interrupted.


    Note that the first argument must be specified for a signal to be ignored and
    is not equivalent to the following, which has a separate meaning of its own:


    ```

    trap 2

    ```


    If you ignore a signal, all subshells ignore that signal. However, if you specify
    an action to be taken on receipt of a signal, all subshells will still take the
    default action on receipt of that signal. For the signals we''ve described, this
    means that the subshells will be terminated.


    Suppose that you execute the command


    ```

    trap "" 2

    ```


    and then execute a subshell, which in turn executes other programs as subshells.
    If an interrupt signal is generated, it will have no effect on the shells or subshells
    that are executing because they will ignore the signal.


    If instead executing the previous trap command you execute


    ```

    trap : 2

    ```


    and then execute your subshells, on receiving the interrupt signal the current
    shell will do nothing (it will execute the null command), but all active subshells
    will be terminated (it will take the action-termination—)


