    # Typing Commands to the Shell


    When the shell starts up, it displays a command prompt--typically a dollar sign--at
    your terminal and waits for you to type a command (see Figure 3.6, Steps 1 and
    2). Each time you type in a command and press the Enter key (Step 3), the shell
    analyzes the line you typed and then proceeds to carry out your request (Step
    4). If you ask it to execute a particular program, the shell searches the disk
    until it finds the named program. When found, the kernel will initiate the program''s
    execution and then the shell "goes to sleep" until the program has finished (Step
    5). The kernel copies the specified program into memory and begins its execution.
    This copied program is called a process; however, the distinction is made between
    a program that is kept in a file on the disk and a process that is in memory doing
    things.


