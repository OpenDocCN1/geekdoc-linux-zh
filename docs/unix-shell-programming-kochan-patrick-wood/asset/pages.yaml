  md: "# Decisions, Decisions\n\nthen the mv command will be executed only if the\
    \ sort is successful. Note that this is equivalent to\nwriting\n\n```\nif sort\
    \ bigdata > /tmp/sortout\nthen\n    mv /tmp/sortout bigdata\nfi\n```\n\nThe command\n\
    \n```\n[ -z \"EDITOR\" ] && EDITOR=/bin/ed\n```\n\ntests the value of the variable\
    \ EDITOR. If it's null, /bin/ed is assigned to it.\nThe || works similarly, except\
    \ that the second command gets executed only if the exit\nstatus of the first\
    \ is nonzero. If you write\n\n```\ngrep \"$name\" phonebook || echo \"Couldn't\
    \ find $name\"\n```\n\nthe echo command will get executed only if the grep fails\
    \ (that is, if it can't find $name in phone or if it can't open the phonebook).\
    \ In this case, the equivalent command would look like\n\n```\nif grep \"$name\"\
    \ phonebook\nthen\nelse\n    echo \"Couldn't find $name\"\nfi\n```\n\nYou can\
    \ write a pipeline on either the left- or right-hand sides of these commands.\
    \ On the left, the\nexit status tested is that of the last command in the pipeline;\
    \ thus\n\n```\nwho | grep \"$name\" > /dev/null || echo \"$name's not logged on\"\
    \n```\n\ncauses the effect of the echo if the grep fails.\n\nthe && || can also\
    \ be combined on the command line:\n\n```\nwho | grep \"$name\" > /dev/null &&\
    \ echo \"$name's not logged on\"\n|| echo \"$name's logged on\"\n```\n\n(Recall\
    \ that when is used at the end of the line, it signals line continuation to the\
    \ shell.) The first\necho gets executed also if the grep succeeds; the second\
    \ if it fails.\n\nThese constructs are often used in if commands:\n\n```\nif validys\
    \ \"$days\" && timeout\nthen\n    sendmail \"$user@$days\" $message\nfi\n```\n\
    \nIf validys returns an exit status of zero, timeout is executed. The exit status\
    \ from this program\nis tested for the if. If it's zero, the sendmail program\
    \ is executed. If validys returns\nnonzero exit status, timeout is not executed,\
    \ and this is used as the exit status that is tested by the\nif. In that case,\
    \ sendmail won't executed.\n\nThe use of && operator in the preceding command\
    \ is like a \"logical AND\"; both programs must return\nan exit status of zero\
    \ for the sendmail program to be executed. In fact, you could have even written\n\
    the preceding as\n\n```\nvalidys \"$days\" && timeout sendmail \"$user@$days\"\
    \ $message\n```\n\nUnix Shell Programming, Third Edition. Unix Shell Programming,\
    \ Third Edition, ISBN: 0-672-32490-3\n\nPrepared for becht@example.com. This download\
