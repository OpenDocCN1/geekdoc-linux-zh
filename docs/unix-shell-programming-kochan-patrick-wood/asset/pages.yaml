    \ to take advantage of the fact that $# will be\\u00a0\nasigned the number of\
    \ words on the line. The --w option is supplied to set just in case any of the\n\
    lines reads with a - or consists entirely of whitespace characters.\n\nThe value\
    \ of $# is then added into the variable count, and the next line is read. When\
    \ the loop is\nited, the value of count is displayed. This represents the total\
    \ number of words read.\n\n+   * words < /etc/passwd\n567\n* wc -w < /etc/passwd\n\
    567\n\nCheck against wc\n\n(Our version is a lot slower than wc because the latter\
    \ is written in C.)\n\nHere's a quick way to count the number of files in your\
    \ directory:\n\n+   * set a\n* echo $#n0\n\nThis is much faster than\n\nls | wc\n\
    \nbecause the first method uses only built-in commands. In general, your shell\
    \ programs run\nmuch faster if you try to get as much as you can using the shell's\
    \ built-in commands.\n\n# Other Options to set\n\nset accepts several other options,\
    \ each of enabled by preceding the option with a -,\ndisabled by preceding it\
    \ with a +. The -x option that we have described here is perhaps the most\ncommonly\
    \ used. Others are summarized in Table A.9 in Appendix A.\n\n# The IFS Variable\n\
    \nThere is a special variable called IFS, which stands for Internal Field Separator.\
    \ The shell\\uses the value of this variable when parsing input from the read\
    \ command, output from command\nsubstitution (the back-quoting mechanism), and\
    \ when performing variable substitution. If it's typed\nto the command line, it\
    \ treats it as a normal whitespace character (that is, as a word-\nlimiter).\n\
    \nSee what is set to:\n\n```\n$ echo \"IFS\"\n```\n\nWell, that was not very illuminating!\
    \ To determine the actual characters stored in there, pipe the output\necho into\
