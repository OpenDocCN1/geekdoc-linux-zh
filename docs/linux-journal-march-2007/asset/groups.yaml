    # Next Month


    # SECURITY


    Reinventing Linux but does mean your systems as secure as they need to be? Next
    month, we''ll help you find out how we can lock down and manage your Linux environments.
    We''ll tell you why Single Packet Authorization (SPA) is a step up from port knocking,
    and then we''ll follow up in the next issue with instructions on how to implement
    SPA security stack. With eCryptify, we''ll take you under the hood of Multi-Category
    SELinux and explain the details.


    As always, it''s much more. We''ll show how to create dynamic forms and reports
    with XSLT, and how to use information about time-zone processing with Asterisk.
