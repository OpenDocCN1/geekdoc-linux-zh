    ## 构建一个多房间数字音乐系统


    使用嵌入式 Linux 和开源软件构建了一个网络音频设备。


    CHAD 的文件


    像如今的许多媒体爱好者一样，我家里也有一台媒体中心电脑。它是一台装在 Casetronic C158 外壳中的小型 VIA M10000 Mini-ITX
    系统，运行在 Gentoo Linux 上的 Freevo 系统。它位于我的媒体柜内，并从位于房屋后方衣柜里的一台大得 AMD64 Gentoo 服务器获取数据，为提供电视、视频、照片和其他其他信息服务。这两台机器通过有线网络使用
    NFS（网络文件系统）进行通信。我想要先告诉你们，将所有的音乐、视频和照片都以数字格式存储并易于访问，这种感觉太棒了。


    本着和我媒体中心电脑同样的精神，我想要有几个小型系统，它们可以放在架子上或房间里，为家里的不同区域提供音乐服务。市场上有许多产品可以从电脑广播音频，还有许多产品在播放流媒体。对我来说，这些大多数产品的问题在于只有一个可用的流媒体。我希望能够在每个房间播放不同的音乐，并用一个设备进行控制。——也就是
    Sonos 数字音乐系统的新成员，它在 2006 年 6 月份的《Linux Journal》上亮相。然而，我想亲手解决这个问题。


    我的目标是构建一个 Mini-ITX 设备，从我的文件服务器获取内容并使用 MPD（音乐播放守护进程）进行播放。为了控制这个设备，我在设备上运行了 lightt（一个
    PHP-Web 服务器）和 phpmp（一个控制 MPD 的 PHP 应用程序）。这使得网络上的任何电脑都拥有了基于浏览器的控制该设备的能力。我选择的控制器是诺基亚
    770。通过 Opera，我可以将浏览器指向每台设备，并通过我的无线网络对它们进行控制。


    ## 设备的硬件


    对于设备，我选择从一块 VIA ML6000E Mini-ITX 主板开始。这块板具有许多功能，使其非常适合这类设备。最主要的的特点是 VIA 600MHz
    Edenless 处理器。这个处理器的性能足以运行应用程序；而且它完全没有噪音。其他功能还包括六声道环绕音频、板载以太网、1GB 内存插槽以及一个 PCI
    插槽。


    由于我希望设备保持静音，我决定放弃标准硬盘。取而代之的是了一个插入 40  IDE 插槽的 256MB 闪存盘。闪存盘也通过标准的四引脚 molex 供电，并配备了
    256MB 的 DDR-400 内存完成内部配置。


    图 1。以诺基亚 770 作为控制器的媒体中心


    图 2。带有主板的 Casetronic 外壳


    即使使用了 Casetronic C158 外壳，也能呈现时尚的外观。这个外壳正面是光滑的，使其看起来更像一台设备。尽管外壳有空间放置薄型 ROM 驱器，但我没有放一个，因为
    MPD 不支持从 CD 播放音频。外壳右侧还有挂钩，方便使用媒体耳机。该外壳的另一个很棒的功能是可选的 CompactFlash 读卡器，它可以安装在 CD-ROM
    驱器托的内部下方。


    构建这个设备并不困难。如果你曾经免费安装过 Gentoo，那么跨越到嵌入领域并不难。有几件事让我的构建过程变得有趣。


    我完全遵循了 Hearth 的说明，完成后，我拥有了一个可以工作的嵌入式 Gentoo 系统。在测试并确保一切运行正常后，我去安装其余所需的软件（MPD、lightmap
    和 phpMyAdmin）。该项目证明是可移植的（我想要在系统中安装一些我并不想要或需要的软件包）。我从零开始，仔细地安装了所需软件的依赖项。然后，我使用
    `nodeps` 标志安装了三部分软件，以确保我没有安装不软件。


