    \ cases, we replace our <div> with\n\n```\n<textarea name=\"text\" class=\"Dojo-Editor\"\
    >\nHello from the Dojo editor!\n</textarea>\n```\n\nListing 2 shows how this might\
    \ look when incorporated into a simple HTML form. When the contents are sent to\
    \ the server, all formatting is preserved using HTML tags. Your application will\
    \ need to parse the HTML to understand any formatting that might appear in the\
    \ text.\nof course, if your plan is to parse the input and display it in a web\
    \ browser, not (much) if you're working on it. You can click the input into a\
    \ database and then render it wherever you need it needed. If you haven't checked\
    \ the security of this widget to make sure it's immune to cross-site scripting\
    \ attacks, you might want to investigate it before simply submitting, accounting\
    \ and displaying your data.\n\n# Conclusion\n\nAs you can see, Dojo offers a wide\
    \ variety of functions and doesn't take much effort to show. By using many of\
    \ the other widgets, such as an attached DataGrid, we realized that Dojo's spaghetti\
    \ event handler, which we did not examine here. Next month, we will look at events\
