    was not difficult. If you have ever installed Gentoo free, making the leap into
    the embedded realm is not very hard. Several things did my building interesting.


    I followed Hearth''s instructions to the letter, and when I finished, had a working
    embedded Gentoo system. After testing and making sure it all worked, I went to
    install the rest of the software needed (MPD, lightmap, and phpMyAdmin). The project
    proved to be portable (the system I wanted to install some software packages that
    I did not want or need. I started from scratch and carefully installed the dependencies
    for the software needed. Then, I installed three pieces of software with nodeps
    flag to ensure that I did not install unnecessary software.


    # Embedded Linux


    Because I chose to use a Flash-based drive, I needed to make sure my installation
    was fast, less than 250MB, and did not write to the code. Flash-based drives and
    only have a certain number of cycles that can be performed before they give out.
    My particular drive, made by Intel Global Sourcing, has more than one-million
    cycles. With such support, I did not fear stopping working in a short amount of
    time due to clicks, especially if there was a swap partition on the drive. In
    all of this I factored in, I decided an embedded Linux system was the best.


    Embedded Linux systems are created in a variety of ways. I chose to go with embedded
    Gentoo (Resources). Because my development, a Dell 600m laptop, I didn''t need
    to create a custom build chain. I simply downloaded a snapshot from the Gentoo
    Web site and used my laptop as a host to build the embedded system.


    Before I attempted to build the system, I took a long look at Building Embedded
    Linux Systems by Karim Yaghmour (Resources). This provides a very detailed view
    of the exact ingredients that make a functional Linux operating system. And with
    the title, it shows the reader how to build embedded Linux systems. I also followed
    the instructions written by Heath Holm on construct an embedded Gentoo system
    (Resources). Heath''s instructions describe all the needed steps for building
    an embedded Gentoo system and making it operational. Without these resources,
    this project would not have been possible. I strongly recommend you take a look
    at it if you are considering doing anything with embedded Linux.


    During the build, I tested the system several times. I wanted to make sure each
    step I made was perfect and not breaking what had worked previously. To test the
    system, I used a USB media reader to copy the embedded Gentoo system then plugged
    the CompactFlash card into a card reader plugged directly into my computer. This
    allowed me to test the appliance and operate once everything was working.


    It should be noted that if you want to build an appliance like this, but you would
    rather use a hard drive and save yourself some time, you can use any Linux distribution.
    Most of them come with all of the software for this project already ready in their
    package.


