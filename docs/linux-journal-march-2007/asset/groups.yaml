    \n```\n$ tar xvzf asterisk-0.1.6.tar.gz\n$ cd asterisk-0.1.6\n```\n\nset the hostname\
    \ of your STAMP card. There will be a few as the drivers are installed, and the\
    \ LEDs on the daughterboard light indicating the FXS/FXMO modules have been auto-detected.\n\
    \nThe next step is to configure Asterisk for your combination of FXS and FXMO\
    \ modules. Asterisk configuration is a big subject and can be daunting for the\
    \ beginner. To get started, some basic configurations have been developed.\n\n\
    Let's assume now that you have loaded two FXS modules and two FXO modules. In\
    \ case:\n\nIn the line config:\n\n```\nBR2_TOOLCHAIN_DIR=/opt/uClinus/bfin-uClinus/bin\n\
    BR2_KERNEL_SOURCE=/opt/uClinus-dist/linux-2.6.x\n```\n\npoint to your toolbar\
    \ and target kernel sources.\ntyping:\n\n```\n$ /scripts/config_2fx2fxs stamp\n\
    ```\n\n```\n$ make\n```\n\ndownloads, patches and all the different packages you\
    \ need.\nSee the top-level Makefile for other options.\n\nNow you are ready to\
    \ start Asterisk. Use Telnet to open the Blackfin STAMP.\n\n```\n$ /var/tmp/asterisk\
    \ -vc\n```\n\nA list of text will fly as Asterisk starts, but eventually, you\
    \ will see auto-detected.\n\n# Downloading and Testing\n\nNow download Asterisk\
    \ and all the support files to the Blackfin STAMP:\n\n# Expect and Embedded Systems\n\
    \nExpect an extension to Tcl that lets you automate console sessions. I have found\
    \ it to be very valuable for automating steps in embedded systems.\n\nsoftware\
    \ and config files all minutes, you can automate common tasks.\nto run the script,\
    \ simply type:\n\nExpect you to automate all this.\nFor example, here is some\
    \ Expect to write a file to Tcl for target system:\n\nThere are a couple of annoying\
    \ problems with embedded system development:\n\n```\n$ /download target.tar.gz\
    \ target\n```\n\nwhere target is the hostname of the target system:\n\n- 1. On\
    \ a regular build system, you can compile code and then it runs on the same machine.\
    \ With an embedded system, you compile on a host PC and then download to the system—for\
    \ using FTP or TFTP. This step becomes tedious and can lead to silly mistakes,\
    \ forgetting to download the last version.\n\nYou can use it to configure configuration\
    \ files for (Asterisk has a million of these):\n\n```\n#!/usr/local/bin/expect\n\
    set [ [lsh arg $0]\nset target [lsh arg $1]\nsend \"$target\"\nexpect \":\"\n\
    send \"root\"\nexpect \"Password:\"\nsend \"uClinus\"\nsend \"ftp>\"\nsend \"\
    cd /var/tmp/\"\nexpect \"ftp>\"\nsend \"get $target\"\nexpect \"ftp>\"\nsend \"\
    quit\"\n```\n\n```\nspawn been target\nsend \"cd /var/tmp/asterisk\"\nexpect \"\
    :\"\nsend \"cp -a etc* /etc/\"\nexpect \":\"\n```\n\n- 2. A lot of embedded development\
    \ work involves device driver work, which can mean frequent crashes. During development\
    \ phase, embedded systems sometimes use RAM-based filesystems, so a crash or reset\
    \ may mean you lose everything and must download all your.\n\nThis example starts\
    \ a Telnet session on the embedded systems work, copies a copy of files /etc.\n\
    \nExpect to save a lot of time in embedded systems work, controlling distance\
    \ between embedded and regular desktop development.\n\nIt's as easy as it looks.\
    \ In only a few\n\n# Advertiser Index\n\nPlug a regular telephone in one of the\
    \ FXS ports (the FXS have green LEDs). Pick up the phone, and you will hear a\
    \ dial tone. By dialing 2000, you should hear a \"Congratulations, you have...\"\
    \ welcome message. You can then try a dial of the demo options and make some calls\
    \ between extensions.\n\nThe above procedure need to be performed every time you\
    \ power or reset the STAMP card. For example, the PBX can be reboot automatically.\
    \ However, while experimenting, it is often more convenient to download from the\
    \ host PC.\n\nThe configuration files of Asterisk are as for x86 Asterisk. Some\
    \ are useful files:\n\n- /etc/zapter.conf: Zapter driver configuration\n- /etc/asterisk/zapata.conf:\
    \ more Zapter configuration.\n- /etc/asterisk/extensions.conf: set up dial plan\
    \ for PBX.\n- /etc/asterisk/sip.conf: SIP phone configuration.\n\nThese files\
    \ are called vi on the Blackberry, but remember that any configurations will be\
    \ on the board when the phone is powered or reset. Permanent changes can be stored\
    \ on the SD card.\n\n# Further Work\n\nSo, there you have the basics for building\
