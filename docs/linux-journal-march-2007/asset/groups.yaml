    The system has three devices for receiving and placing calls, and they can be
    accessed by five extension numbers.


    # Calling the World


    Although calling between extensions is certainly cool and useful, calling out
    of the system via Outside Routes is what gap is bridged. For ease of configuration
    and for fixed dialed numbers, I configured the system so that all dialed numbers
    through the phone call a menu, I defined a 9_outside (Figure 17) for parsing out
    to the PSTN trunk, which is ZAP9.


    ZAP9 is a group containing all the ZAP channels that connect to the phone company,
    which is defined by default at installation. By the system concept of a hunt group:
    the groups are called in sequence and the first one that is used


    The dial patterns directs it to then 9 and 911. The former number indicates when
    911 is dialed by an extension, the system dials 911 by extension. The latter pattern
    matches any dialed number that begins with 9


    The system strips off the 9, as indicated by the vertical bar (|), and sends the
    remainder of the digits to the trunk. It handles 911 separately from other 9-referenced
    numbers so I have to know or remember to prefix 911 with 9 to get out (9911).
    Because there only one group for dialing out and outgoing numbers must be prefixed


    with a a, the outbound routes would be easy to define.


    # Incoming Calls


    The most complex part of the system is handling calls as defined. There are two
    parts to configuring incoming calls: audio messages to be played to the caller,
    Digital Receptionist, Interactive Voice Response (IVR), and the Time determines
    which Digital Receptionist will handle the.


    To keep the system simple, I used only two outgoing messages. The first, Night
    says: ''We are unavailable at this time, please press 1 to leave a message, or
    if there is another matter press 0 to ring the phones.'' The second, Weekly calls
    to ring the house, 21; to ring the office, 22; to ring all phones, phones 20 or
    stay on the line.


