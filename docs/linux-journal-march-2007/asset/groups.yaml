    # 深度解析


    设置主机名并启用 DHCP。


    构建 uClinus 的通用说明包含在 Blackfin uClinus 文档中。请阅读这些说明并使用 uClinus。如果构建成功，系统将创建一个 `uClinus-dist/images`
    目录，其中包含 uClinus 镜像。


    - 下载 uClinus 压缩包，然后：


    ```bash

    $ tar xvzf asterisk-0.1.6.tar.gz

    $ cd asterisk-0.1.6

    ```


    设置你的 STAMP 卡的主机名。随着驱动程序的安装，会有几个驱动，扩展板上的 LED 会亮起，表示 FXS/FXMO 模块已自动检测。


    下一步是针对你的 FXS 和 FXMO 模块组合配置 Asterisk。Asterisk 配置是一项庞大的工作，对初学者来说可能非常无从。为了入门，我们已经开发了一些基础配置。


    现在假设你已经加载了两个 FXS 模块和两个 FXO 模块。在情况下：


    在行配置中：


    ```bash

    BR2_TOOLCHAIN_DIR=/opt/uClinus/bfin-uClinus/bin

    BR2_KERNEL_SOURCE=/opt/uClinus-dist/linux-2.6.x

    ```


    指向你的工具链和目标内核源码。

    输入：


    ```bash

    $ /scripts/config_2fx2fxs stamp

    $ make

    ```


    这将下载、补丁以及你需要的所有不同包。

    查看顶层 `Makefile` 可获取其他选项。


    现在你已经准备好启动 Asterisk 了。使用 Telnet 打开 Blackfin STAMP。


    ```bash

    $ /var/tmp/asterisk -vc

    ```


    Asterisk 启动时会飞快出一串文本，但最终你会看到自动检测的完成。


    # 下载与测试


    现在将 Asterisk 和所有支持文件下载到 Blackfin STAMP：


    # Expect 与嵌入式系统


    Expect 是 Tcl 的一个扩展，允许你自动化控制会话。我发现它对于自动化嵌入式系统的步骤非常有价值。


    在软件和配置文件的几分钟内，你可以自动化常用任务。

    要运行脚本，只需输入：


    Expect 将帮助你自动化这一切。

    例如，这里有一些 Expect 代码可以为目标系统将文件写入 Tcl：


    嵌入式系统开发中有一些令人烦恼的问题：


    - 1. 在普通的构建系统上，你可以编译代码并在同一台机器上运行。在嵌入式系统中，你需要在主机 PC 上编译，然后下载到系统（使用 FTP 或 TFTP）。这一步变得非常枯燥，并且容易导致低级错误，例如忘记下载最新版本。


    - 2. 大量嵌入式开发工作涉及设备驱动，这可能意味着频繁崩溃。在开发阶段，嵌入式系统有时使用基于内存的文件系统，因此崩溃或重置可能意味着丢失所有内容，必须重新下载所有文件。


    你可以使用它来配置文件（Asterisk 有无数这样的文件）：


    ```expect

    #!/usr/local/bin/expect

    set [ [lsh arg $0]

    set target [lsh arg $1]

    send "$target"

    expect ":"

    send "root"

    expect "Password:"

    send "uClinus"

    send "ftp>"

    send "cd /var/tmp/"

    expect "ftp>"

    send "get $target"

    expect "ftp>"

    send "quit"

    ```


    ```expect

    spawn target

    send "cd /var/tmp/asterisk"

    expect ":"

    send "cp -a etc* /etc/"

    expect ":"

    ```


    此示例在嵌入式系统上启动 Telnet 会话，复制 `/etc` 文件的副本。


    Expect 将在嵌入式系统工作中节省大量时间，缩小嵌入式开发与常规桌面开发之间的距离。


    它看起来非常简单。只需在几分钟内……


    80 | 2007年3月 - www.linuxjournal.org


    *此处广告索引部分略）*


    # 后续工作


    现在，你已经掌握了构建自己的嵌入式 Asterisk PBX 的基础。扩展板和模块可以从作者处获得。我们正在进行进一步开发——例如专门为电话工作设计的自定义
    Asterisk 硬件以及其他接口卡，如 BR-ISDN。这是一个令人兴奋的项目，具有开放硬件这一新颖特性。


    David Rowe 在基于 IP 的电话和硬件/软件开发方面拥有 25 年的经验。David 拥有广泛的技能，包括软件、硬件和项目管理，并拥有电子工程博士学位。他曾在卫星通信行业担任高管职位，并在
    www.rowel.com 建立并成功运营了一家小企业。然而，他是许多文章的作者，因此他选择全职投入电话硬件和软件的研究。


    # 资源


    免费电话：

    www.rowel.com/ucasterisk/index.html


    Black uClinus 站点：www.asterisk.com/clinux.org


    构建嵌入式 Asterisk PBX，第1部分：

    www.rowel.com/blog?tp=15


    构建嵌入式 Asterisk PBX，第2部分：

    www.rowel.com/blog?tp=16


    针对代码 PBX 优化：www.rowel.com/blog?tp=5


    gEDA 开源 EDA 工具：www.geda.org


    > 欲了解信息，请联系我们的销售部门：1-733-344-1956 分机 2 或邮件 ads@linuxjournal.com。

    '
