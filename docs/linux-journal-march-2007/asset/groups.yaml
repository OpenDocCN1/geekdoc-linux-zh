    19 中的屏幕，上面有录制消息的说明。在满意每个每个消息后，我保存了录音。


    数字接待员由三个菜单组成。我通过选择右侧菜单顶部的“添加 IVR（Add IVR）”链接来定义其中每一个。一旦知道每个选项的作用，数字接待员就非常直观。顶部的通用部分允许定义或更改
    IVR 的名称。接下来，必须进入一个选项，使用哪个选项？


    - 启用目录和目录上下文（Enable Directory and Directory Context）允许呼叫者通过输入 # 进入自动系统

    - 直接拨号（Direct Dial）意味着呼叫者可以直接拨打扩展列表中定义的任何分机

    - 公（Announcement）是在提供可用选项之前播放给呼叫者的音频消息。


    通用部分显示了其他呼叫者可以在哪里选择进入系统的其他部分。不符合任何分机的选项取决于安装的模块，在系统中解释得最详细。可能性的之一是另一个 IVR，它的功能非常强大。有了对数字接待员的理解，我们可以查看我定义的上下文（context）。分机用于工作/白天（图
    22）。它允许直接拨打任何分机，这会响铃分机组（Ring Groups），如果呼叫者没有这样做（图 21 和图 22），全响（Ring-all）适用于所有人。相反，所有分机号码都会被重定向到响铃。最后一个
    IVR，Voicemail-aft，用于在孩子睡觉后到达的电话（图 23）。人们可以输入 0 响铃整个房子，或者进入留言箱。


    接下来定义根据接收电话的时间由哪个数字接待员处理。我想定义三个时间条件：正常、工作日和晚上。我定义了周末和晚上晚间的时间条件（图 24），使得早上 7 点到晚上
    10 点（22:00）之间的电话转到全响 IVR，在该时间段，电话由 Voicemail-dto 处理。然后，创建一个条件来处理工作日时间（图 25），它会检查时间是否在工作时间内，如果是，则传递分机。如果电话在周一至周五的上午
    7:30 到下午 5 点（17:00）之间打入，且不在该时间段，则由周末时间条件控制。此外，可以激活隐私管理器（Privacy Manager），要求没有主叫
    ID 的呼叫者在继续通过系统之前输入他们的号码。我没有主叫 ID 服务，所以我让我的手机识别许多推销电话。通过这种方式我识别了许多推销电话。


    ### 处理 VoIP 主道


    通过外线路由（Outside Routes）拨打非常有用。为了方便固定拨号号码的配置，我配置了系统，使得通过电话拨打的所有号码都直接呼出到 PSTN 主话道，即
    ZAP9。


    ZAP9 是一个组，包含了所有连接到电话公司的 ZAP 通道，这些通道是在安装时定义的。根据呼叫组（hunt group）的概念：这些组会按顺序被呼叫，第一个空闲的组将进行接听。后一种模式匹配任何以
    9 开头的拨号号码；系统会如竖线（|）所示剥离 9，并将剩余的数字发送到主话道。它会单独处理 911 和其他号码，因此我必须知道或记住在 911 前加上缀
    9 才能呼出（即拨打 9911）。因为只有一个用于呼出的组，所以出站路由（路由）很容易定义。


    入站电话


    系统最复杂的部分是按定义处理来电。配置入站电话包含两个部分：

    - 给呼叫者播放的音频消息

    - 数字接待员（交互式语音响应 - IVR）

    - 时间决定由哪个数字接待员来处理


    为了保持系统简单，我只使用了两个出站消息。第一个是“晚上（Night）”，内容：“我们现在无法服务，请按 1 留言，如果有其他事情，请按 0 响铃电话。”第二个是“每周（Weekly）”，用于响铃家里（21）；响铃办公室（22）；响铃所有电话（20）或保持在路上。


