    \ 5 个不可读的密码，每个的长度为 15 个字符：</strong>\n<br>\n<?php\n$passwords = Text_Password::createMultiple(5,\n\
    'unpronounceable');\nforeach ($passwords as $password) {\n<li><?php echo $password;\
    \ ?></li>\n}\n?>\n</body>\n</html>\n```\n\n```html\n<p>\n<?php\n<strong>这里有 5\
    \ 个不可读的密码，也称为，每个的长度为 15 个字符：</strong>\n<br>\n<ul>\n<<li>-E3_JuR1XXY25dp/</li>\n\
    <<li>-G0bhXYZk5De/</li>\n<<li>-8tAagoJR7CI1co2/</li>\n<<li>-E5#FASHJ1weJa80/</li>\n\
    <<li>-L1cb7fc7@HMm</li>\n</ul>\n</p>\n</body>\n</html>\n```\n\n工作原理：\n可以静态调用 `Text_Password::create()`\
    \ 方法。它返回一个默认长度为十字符的可读密码，如输出所示。\n`Text_Password::createMultiple(5, 'unpronounceable')`\
    \ 方法允许生成多个不可读密码。\n\n## 数据获取与控制\n\n| 设备 | 联系 |\n| :--- | :--- |\n| 环rus | www.cirrus.com\
