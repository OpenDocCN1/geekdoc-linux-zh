    # 一个 Asterisk 瘾者的故事


    我使用 Asterisk 系统已经一年半了。现在，通过阅读这篇文章，你对使用 Asterisk 构建的配置以及每个功能的工作原理将有所了解，同时也了解它以以前其他通话系统无法实现的方式处理通话的灵活性。对于那些不知道什么是
    Asterisk 的人，它是一个可以与交换电话网（PSTN）及其他协议接口的软件程序。


    我也不必亲自去[查看]是谁在来电。Asterisk 系统能够与我的 MyVoIP 共享通话 ID（call-ID），我们通过我们的连接进行通话。将通话 ID
    作为最新的邮件并同步到我的工作站非常简单。但当有非常棒的入座电话时，我通常可以直接听到是谁在来电，而无需跑到电话或通话 ID 处。这种感觉就像是在通话开始前完全不想被打扰。


    我初次接触 Asterisk 是通过在网络上搜索它是如何工作的！当我开始使用 Asterisk 时，发现它是如此简单。一旦我安装好，我就可以下载可以像普通电话一样使用的软件，但我可以拨打网络上用户的电话。这很有趣，现在我已经习惯了在电话里听到我父亲的声音。


    事实证明这比我预期的要困难。因为我仍然想使用 Asterisk 进行通话处理，我立即启用了几个供应商。许多供应商不允许你使用 Asterisk，或不支持在其服务时使用
    Asterisk。对于像 VoIP 这样简单且对我家庭电话一样重要的东西，它运行得很好。当我研究需求时，我发现许多供应商不允许你使用该服务进行任何通话，包括电话营销和慈善捐款电话。这些功能需要它，但如果你找到了正确的供应商，那么产生费用的惩罚可能是非常高的。在某一点，我转向了批发供应商，但这带来了额外的好处：可以接收电话，因为供应商没有提供任何管理语音信箱的通话功能。


    尽管这个系统运行起来很快，但并不容易，因此我决定为系统添加一个接口卡，以便我通过我们的常规 PSTN 线路接收电话。在这一阶段，我能够写邮件，并像使用电话一样使用我的电脑。即使在我们离线时，电话也会响起。到那时，我已经真正掌握了
    VoIP。


    我和妻子也时候对现在的答录机感到不满意了，于是我配置了 Asterisk 来代替它的功能。作为一台答录机，它非常有用。我使用系统将通话转接给他们，我们都可以接收语音信箱消息作为附件。我们现在可以定期阅读每条消息，通过邮件客户端收到了我们的邮件，我们可以轻松地验证它们。


    此时 Asterisk 的主要问题是如何建立 Asterisk 系统与电话之间的连接。例如，我们无法使用真实的电话拨回。解决这个问题的方案是使用 Asterisk
    电话。我买了一个 SPA202；该 SPA 有两个电话端口，支持 SIP VoIP 协议。该产品界面可以通过 Web 轻松配置。一旦 Asterisk 和手机连接上，我就可以随所欲地拨打和接听。


    有一次，我想让系统尽可能透明，于是我尝试了不同的方法。我买了一个双线电话分线器并将其插入电话。然后，我将线路插入两个插座，每个插座都使用分线器作为开关。现在我可以使用走廊里的任何电话和一条线路，以及其他任何地方。在大多数情况下，如果有人在通话，我可以使用另一条线路。这样来，如果有人在一条线路上通话，我们会在另一条线上接到电话。这被证明是非常方便的。


    随后出现了电话无法工作且不知道如何修复的问题。在解决问题后，我意识到决定一定是问题出在你们那边。那么，现在你能打电话了吗？并不真的，因为你们的支持质量并没有什么帮助。这是一种苦乐参半的福。一方面，这意味着你没有获得拨打给活生人的即时满足感；另一方面，它给了你机会更多地了解你正在使用的系统。


    一旦我让家庭 VoIP 系统运行到我满意，我决定迈出大一步，切断我们与 Qwest 的线路并订阅 VoIP 服务。选择一个……


    问候语并不是像“你好，Tara Banks，你接到了我的超级智能答录机。请留言。”之类的之类的。然后它从未真正打过我的电话，但我确定她只是在忙。


