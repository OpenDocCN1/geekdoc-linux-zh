    \    write something!\n  </textarea>\n    <input type=\"submit\" />\n  </form>\n\
    </body>\n</html>\n```\n\n# Resources\n\nThe main source for information about\
    \ Dojo, as well as Dojo software releases, is at dojoit.org. For documentation\
    \ it is a bit sparse, but it has improved significantly in the last few months,\
    \ and continuous improvements seen lately, given Dojo's growing popularity. The\
