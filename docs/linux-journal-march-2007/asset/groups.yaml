    Figure 5 shows four streams, each audio stream separate and the PBX being the
    connection between the two phases. The initial problem of the first stream is
    error loss where there are VoIP-related problems. The Max Delta (latency) was
    84ms for traffic, which is good. The Max Jitter was also at 111ms (150ms of one-way
    latency and 20ms of jitter are the limits of what is considered acceptable). However,
    nearly 20% packet loss was detected, which is unacceptable!


    # intrusion protection


