    # How to set up a powerful home PBX system with Trixbox and FreePBX.


    # Home Box to Trixbox


    Michael George


    A little than two years ago, I built a home phone system using Asterisk and analog
    interface cards. It has served us quite well, but it is time for an upgrade. Since
    first constructing that system, great strides have been taken in simplifying Asterisk
    configuration. Asterisk@Home (now called Trixbox) is a system that makes it possible
    to implement a powerful phone system for work or home using a Web-based GUI. I
    decided to use Trixbox for my new phone system to see if it has the flexibility
    to achieve all the features of my current system. This article discusses the installation
    and configuration of my new home phone system.


    I have several goals for the new phone system. The first goal is to be able to
    call from one part of the house to another. Next, I want to minimize telemarketing
    calls and direct calls after 9 pm to voice mail, rather than ringing the phones
    (unless the call is urgent). I work at home much of the time, I want to use a
    VoIP extension to the office system.


