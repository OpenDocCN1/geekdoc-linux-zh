    \ FXO 或 FXS 模块。在示例中，左侧有两个 FXS 模块，右侧有两个 FXO 模块。每个 LED 的颜色指示插入的模块类型。\n\n这里是电话术语的简要回顾：\n\
    \n- FXO 端口连接到模拟电话线\n- FXS 端口连接到模拟电话听筒。\n\n![](img/25da851b464310ec6d84b814147617d9_79_0.png)\n\
    \n图 2 是 PBX 硬件和软件组件的框图。SIP 电话或模拟电话可以作为听筒（分机），它们通过 LAN 连接到 PBX。外部电话通过互联网或模拟 FXO\
    \ 端口路由。PBX 端口之间的内部通话通过 LAN 路由。\n\n该 PBX 支持在 ARM PC 上运行的 Asterisk 的绝大多数功能。由于没有硬盘，SD\
    \ 卡用于语音信箱存储。\n\n# 为什么要将 Asterisk 移植到 uClinx/Blackfin？\n\n我有开发计算硬件的历史，并且一直想构建一个小型嵌入式盒子，将核心处理器、DSP、线路接口硬件和软件结合。这是我必须解决的难题！\n\
