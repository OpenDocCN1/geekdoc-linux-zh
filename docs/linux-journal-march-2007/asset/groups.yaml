    # # Network Setup


    As mentioned earlier, all of my media is on a server. Having media there allows
    any number of computers to access the files as if they were stored locally. In
    order to save the files, I set up NFS on the server. Using NFS, I can allow IP
    addresses or sets of IPs to connect to specific directories on the server and
    have security rules.


    For convenience, I set up two shares. The primary share is where all the content
    is stored. This share is read-only; I do not want anything except this directory
    to be able to modify it. The second share is a writable share where all the MPD
    metadata is stored. Both shares are set up with NFS, which I designed using without
    any user authentication for reasons of simplicity.


    To complete the network setup on the server, I made NFS started on boot. Then,
    I added the mount lines to a startup script on.


    # # The Music Player Dement


    At the core of this app, MPD can play almost any audio format: MP3, Ogg, AAC (without
    DRM), FLAC and so on. For me, installed Ogg AAC and all of my music files are
    in MPD also play music. This gives me the ability to play any of my favorite internet
    streams. Configuring MPD is fairly easy. Only few settings are needed for MPD
    to function correctly.


    The two most obvious settings needed to manage the playlist were setting it to
    the first NFS mount (the one with all the audio files). The playlist directory
    setting was pointed to a playlist directory on the second NFS mount. By pointing
    the playlist to a common directory, all of the applications on the network can
    share it.


    The next setting was defined by dbus. This setting points to a file where all
    of the metadata of the audio files on the system. I pointed this setting to a
    file named mpd.db on the NFS share. This allows the playlist, and all of the applications,
    to share the information. This also allows me to update the MPD metadata.


    The final setting was state file. This setting points to a file that holds information
    about what state MPD is when it stops. Again, this points to a file on the writable
    NFS mount, which is unique for each instance. When I run the app back on, it starts
    with the state of another.


    # # Controlling the Appliance


    Because the appliance does not have a screen, I needed a way to control the audio
    playback. Fortunately, the folks who developed MPD also developed lightmpd. phpmpd
    is a simple web application designed to control of MPD using the extension in
    PHP. To get phpmpd, I installed a web server using Apache. However, I wanted to
    be conscious of application usage. Since using Apache takes too many resources,
    I decided to use lightmpd, a small, full-featured web server that can run PHP
    scripts.


    ![](img/25da851b464310ec6d84b814147617d9_89_0.png)


    Out of the box, lightmpd and phpmpd were very little configured, which is a great
    feature. Because the appliance is headless, I had to make lightmpd started automatically
    with the boot process.


    # # Problems and Challenges


    All things considered, I had very few problems experiencing everything. The issues
    I had were with the OS being embedded. Fortunately, they were easily resolved.


    The first challenge was application logging. MPD, and the OS are configured to
    log to everything. With my hard drive read-only, I found a few issues. To solve
    the problem, I added a link in the file system to mount /tmp as a tmp directory.
    Then, I redirected all of the logging to /tmp directory. This allowed all of the
    applications to log without a recurring failure.


    The next issue was with the ALSA (Advanced Linux Sound Architecture) device. Most
    Linux systems use udev to create device files dynamically. On boot the files created
    by udev are the sound device files that ALSA uses. Because they were never created,
    I had to make them part of the embedded system.


    The last challenge was turning the appliance off. Because there is no console
    to tell the system to shut down, I had to use the power button on the appliance.
    I used the embedded system with ACPI (Advanced Configuration and Power Interface)
    to configure the system to shut down when the power button is pressed. As the
    operating system is so small and has few resources, running tasks times out with
    split split. Eventually, I would like to add support for the shutdown timer, but
    now the power function works fine.


    # # Enhancements and Improvements


    Through the course of this system, I thought of several things I would like to
    enhance the appliance, such as adding an LCD to the front of the case that would
    show the track, album and name of the current track. LCDd support for MPD, and
    LCD-linux is adding support, so installing an LCD would be trivial. I would like
    to build a smaller amplifier that could fit into the case so I would


