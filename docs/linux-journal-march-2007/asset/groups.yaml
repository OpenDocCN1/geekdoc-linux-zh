    # 列


    # 偏执企鹅


    ![](img/25da851b464310ec6d84b814147617d9_33_0.png)


    图 1. RHEL 4 的 system-config-security 工具


    彩色化的、有针对性的，强调了类型强制（Type Enforcement），快速简化了 RBAC 并忽略了 MLS 标记。


    事实上，RHEL 的目标策略（targeted policy）并没有在全局实施类型强制，它仅为 12 个特定域定义了策略，允许其他用户和对象进入默认的、不受限制的（unconfined）域，该域没有
    SELinux 留存（除了那 12 个应用程序之外的）域。


    RHEL 4 和 5 目标策略中带有 SELinux 域的守护进程有：


    - dhcpcd

    - httpd

    - mysqld

    - named

    - nscd

    - ntpd

    - portmap

    - postgresres

    - snmpd

    - squid

    - syslog

    - winbind


    你可能会疑惑，这并不等同于一个全局策略，而“强制访问控制”（Mandatory Access Control）本应提供的“默认拒绝”立场并没有精确地表达这一点？然而，它也不等同于允许“默认拒绝”的策略，因为
    Linux DAC（自主访问控制）仍然有效。因此，如果目标策略是层层叠加在文件系统权限、应用级控制、防火墙规则以及你在加固的 SELinux 系统中所拥的其他类型控制之上，而不是取代它们，你可以看到
    SELinux 策略仍然可以防止许多麻烦的发生。


    事实上，我还会进一步说，Red Hat 的目标 SELinux 策略通过默认启用 SELinux 策略是其（维持发行版）的最佳希望；如果该策略安装不当，或者应用程序在没有适当配置的情况下运行了构建，大多数用户会轻易地禁用
    SELinux（这实际上是 Fedora 2 出厂时带有“默认拒绝” SELinux 策略时发生的情况）。


    通过启用仅适用于有限的、经过良好测试的应用程序集的 SELinux 策略，RHEL 正在减少其大部分用户将 SELinux 与不便和低生产力联系起来的可能性。此外，目标策略可以通过简单的
    GUI 工具 system-config-securitylevel 进行管理，它不需要用户了解任何关于 SELinux 的知识。

    目标策略随 RHEL 4 和 5、Fedora Core 3 及更高版本，以及 CentOS 4 和 5 提供。


    最初为 Fedora Core 2 开发的全方位“默认拒绝”策略被称为 strict，它目前仍在 RHEL、Fedora 和 CentOS 中维护，并可以替代目标策略安装。然而，由于在大多数系统上需要通过编辑
    /selinux 目录中的文件并使用标准的 SELinux 命令如 chmon, geofence, getenforce, new, set 和 enforce
    本身进行大量的可能会调优，strict 策略在 RHEL 中未获得官方（商业）支持。


    请注意 Tresys (www.tresys.com) 维护了一套工具，主要是基于 GUI 的，包括 SePCut、SeUser 和 ASeudit。这些由
    RHEL 的 redhat 包提供。另注意，在非 Red Hat 衍生的 Linux 发行版中，SELinux 策略通常位于 /etc/security/selinux。


    要在 RHEL 4 上自定义和使用 strict 策略，请参阅 Russell Cole 的教程《SELinux 4 简介》（见资源部分）。你需要安装软件包
    `selinux-policy-strict`，在 Fedora 丰富的仓库中可用；Fedora 5 或 6 中的 `selinux-policy-strict`
    软件包可能也适用于 (RHEL 4)。


