    **供应商们会让你认为**，你需要花费数千美元购买协议分析软件来排查越网 IP（VoIP）网络中的故障。毕竟，如果数据包延迟、丢失或乱序，语音质量就会受到影响。幸运的是，Wireshark
    是一个开源软件包，可以完成这些工具能做的一切，甚至更多。


    Wireshark 以前被称为 Ethereal，是一种网络协议分析器。它的工作是监听网络流量，以易于理解的格式显示，并帮助你发现问题。VoIP 涉及一套复杂的协议，Wireshark
    可以对其解码并将它们关联起来。例如，建立通话的程序涉及的与语音流量本身不同的协议。Wireshark 使用来自通话设置的信息来更好地理解语音流。有了这些数据，你就可以隔离
    VoIP 问题的产生。


    # Wireshark：捕获选项


    ## 监控：关键在于位置


    如果你正在寻找的数据包没有到达运行 Wireshark 的机器接口，那么你就遇到问题了。交换机的设计初衷是尝试将流量限制在有通信的端口上，以提高性能。生成树路由（Spanning
    tree routing）只会让试图寻找数据包去向的问题变得更加复杂。


    最好的办法是直接在涉及的机器之一上捕获流量。如果它运行在 Windows 上，你无法在该机器上获取 Wireshark，但你可以通过分路器（taps）和镜像分析器（span
    analyzer）捕获流量。如果不可能，或者流量跨越多台机器，那么该从你的硬件网络中获取了。


    大多数交换机都提供一项功能，可以将一个接口帧镜像到另一个接口。因此，你可以将 Wireshark 工作站连接到带有互联网连接的交换机，将路由器的所有流量镜像到你的工作站，然后使用告警过滤器进行分析。带有
    SPAN 分析器的 Cisco 交换机将其称为 Monitor Port，Cisco 将其称为移动分析端口（Roving Analysis Port）。


    选择哪一个取决于你的网络，但通常连接到其他交换机或路由器的连接是稳妥的选择。此外，捕获过滤器有助于减少你必须处理的头疼问题。


