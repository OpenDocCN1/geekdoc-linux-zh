    \ |\n| 串口端口 | www.serial.com |\n| 日历 | www.calendar.com |\n| Linux 开发 | www.linux.com\
    \ |\n| EMAC 包含 | www.emac.com |\n| 逻辑 | www.logic.com |\n\n## 锁定文件\n\n任何读取或写入锁文件的脚本都需要一种可靠的方式来锁定。许多发行版（包括\
    \ Linux 和 Mac OS）已经安装了 lockfile。你可以检查系统是否安装了 lockfile。如果收到消息，说明你运气不错！如果没有，请从 www.procm.org\
    \ 下载并在系统中安装 lockfile。本节脚本假设你拥有 lockfile。\n\n代码部分：\n\n```sh\n#!/bin/sh\n# lock\
    \ - 一个灵活的文件锁定机制。\n\nretries=\"10\"      # 默认重试次数\naction=\"lock\"     # 默认动作\n\
    nulled=/dev/null # 空空计数\n\nwhile get opt in \"l:ur\"; do\n  case $opt in\n   \
    \ l ) action=\"lock\")\n    u ) action=\"unlock\")\n    r ) retries=\"$OPTARG\"\
    )\n  esac\ndone\n\nif [ $# -eq 0 ]; then\n  cat << EOF >&2\nUsage: $0 [-l][-r\
    \ X] lockfile\n-l 读取锁文件，-u 创建解锁，-r X 指定在失败前的最大重试次数（默认=$retries）\nEOF\n  exit 1\n\
    fi\n```\n\n```sh\nif [ -z \"$lockfile\" | grep -v 'no' ]; then\n  echo 'Error:\
    \ lockfile' 工具未在 PATH 中找到。' >&2\n  exit 1\nfi\n\nif [ \"$action\" = \"lock\" ];\
    \ then\n  if [ -f \"$lockfile\" ]; then\n    echo \"Error: $retries\" >/dev/null\n\
    \    在时间 $(date) 创建了锁文件\n  fi\n  touch \"$lockfile\"\nelif [ \"$action\" = \"\
    unlock\" ]; then\n  if [ ! -f \"$lockfile\" ]; then\n    echo \"Warning: 锁文件 $1\
    \ 不存在，无法解锁\" >&2\n    exit 1\n  fi\n  rm -f \"$lockfile\"\nfi\n```\n\n"
