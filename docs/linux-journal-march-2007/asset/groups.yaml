    - 双 VGA \n- 带有虚拟媒体的 IPM 2.0 双管理接口\n- 可选 KVM-over-LAN\n- 980W 高效电源\n\n![](img/25da851b464310ec6d84b814147617d9_42_0.png)\n\
    \n# 优势与利益\n\n- 1U 16核 - 42U 标准机架中可容纳 8 台服务器\n- 双倍密度和计算能力 - 每个节点都有自己的面板框\n- 独立电源冷却\
