    # Multi-Level Security


    The third security model in SELinux is Multi-Level Security (MLS). MLS is in turn
    based on the Bell-Padula model for labeling. The core principle of both the model
    is "no read up, no write down". That is to say, a process (user) may not read
    data of (more sensitive) classification nor write data of a given classification
    anywhere in it is accessed by processes (users) only to view data of (less sensitive)
    classifications. Note that by "non-hierarchical", I mean that compartments within
    the same classification are each, neither considered more sensitive than the other.
    For Linux, each object on the system must be associated with a security clearance—that
    is to say, the maximum sensitivity of data to which they may have access. Every
    file (object) must also


    # Multi-Category Security


    I''ve mentioned SELinux security models (TE, RBAC and MLS). In Red Hat Enterprise
    5, there''s actually a fourth: Multi-Category Security (MCS). As you imagine,
    the complexity of hierarchical and non-hierarchical compartments makes MLS well
    suited to large organizations, such as military and intelligence agencies, but
    too complex for more general purposes. Red Hat has therefore implemented an alternative
    classification model in RHEL 5''s implementation of SELinux. MCS uses SELinux
    Range field, essentially by informing the classification field (assigning 0 to
    all objects) and instead only the Compartment field. In this way, the power of
    labeling is similar to MLS, but lacks the added complexity of hierarchical classifications.


    # But, what about actual users, who perform a variety of tasks on the system and,
    therefore, may need to traverse domains? labeled with classification that specifies
    the minimum clearance a subject must have in order to access it. The MLS range
