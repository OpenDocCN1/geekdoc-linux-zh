    # INDEPTH


    Generally, engineers use Asterisk in two of ways: using the extensions.conf file
    or using an Asterisk Gateway Interface (AGI script). While we generally use the
    former, in cases where integration is needed for flexibility, developers write
    Ruby scripts for the execution of Asterisk. This makes a machine, which can operate
    plain text via STDIN and STDOUT.


    But, when you use Bash it executes this as a subprocess because of complexity.
    Asterisk executes this script as whatever binary is needed for the AGI program
    (example, the Perl interpreter or a database script), executes the code and then
    it all again. Although tolerable in scale, it is not great for saving time as
    usage increases. Without a framework, this script can contain substantial amounts
    of memory.


