    And Scripticulitous GUI-related functionality on top of it. Dojo is designed with
    a different organizational philosophy in mind, providing a wide array of functions,
    of which might seem unrelated to one another.


    For example, Dojo provides GUI elements (element, a rich-text editor, a date picker,
    interfaces to mapping and layout controls). But it also provides an event system,
    making development much easier. Dojo provides a client-side system with more sophistication
    than HTTP requests. It provides a number of utilities for JavaScript programmers,
    making it possible to create new classes and standards.


    Each of these pieces of functionality is available inside a separate package,
    which is both loaded and identified with a hierarchical structure. Thus, Dojo
    functions begin with do (for example, declare and define), and they are also part
    of a similarly named library.


    Loading a package is as simple as putting:


    ```

    <script type="text/javascript">

    dojo.require(''PACKAGE'');

    </script>

    ```


    inside your HTML. You can load more than one package, using multiples of dojo.require.
    Dojo loader is smart enough to take care of any dependencies that might exist.


    # JavaScript Helpers


    Once you have included Dojo, you can use some of its improvements to the JavaScript
    language. Dojo includes a number of convenience functions to make programming
    easier, some of which are quite similar to what jQuery provides. For example,
    when you need to select nodes by their id (if an id is supposed to be in a particular
    page of HTML, then Dojo allows us to use a unique id) assigning the varNode to
    the node with the ID target, we would normally need to


    ```

    var myNode = document.getElementById(''target'');

    ```


    Dojo allows us to approve this to:


    ```

    var myNode = dojo.byId(''target'');

    ```


    This is not quite as short as Prototype''s Object ($), but it is still a significant
    improvement, making programs both shorter and more readable.


    Dojo also provides new mechanisms to work with arrays and other enumerated lists.
    For example, it provides a foreach:


    ```

    dojo.lang.forEach(arrayName, iterationFunctionName);

    ```


    The above code uses iterationFunctionName to be invoked for each element of arrayName.
    Thus, we could say:


    ```

    var names = ["Atara", "Shika", "Amotz"];jo.lang.forEach(names, alert);

    ```


    print each of these names in an alert box. Dojo provides several other functions
    for use with arrays, including dojo.map (which invokes an operation on an array,
    producing a new array as result) and dojo.filter (which returns an array of items
    for which a function returns true). Stylistically, the documentation for Prototype
    seems to encourage users to write inline functions, whereas Dojo documentation
    encourages users to write named functions and refer to them. However, you can
    adapt whatever style is more appealing to you.


