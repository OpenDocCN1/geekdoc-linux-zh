    > ZACK BROWN

    Sources: 1–6: Committee to Project Journalists | 7–16: XITI | 17–19: IDC | 20:
    Reuters


    ## Cast Freely


    A broadcasting system running on Linux (Debian and Ubuntu, so far) and is made
    to scale distribution from individuals to multiple stations in a network. Features:
    independent news and media organizations in emerging democracies. Others are Campsite
    (multilingual news publishing), Cream (customer relationship management and DRM)
    and Dream (distribution links to all and more at campware.org.


    ### They Said It


    - Live in-studio layout

    - Web-based remote automation

    - Playlists

    - Centralized program material archives

    - Fast playback (using GStreamer)

    - Program sharing

    - Search-based lookup

    - Open, extensible architecture (including use of XML-RPC APIs).


    > Just because it''s hard doesn''t make it worth doing.

    —Britt Glas


    If you''re interested in Campsite, you may find Riveland, a heavy-duty broadcast
    automation system developed by Radio Labs, a division of CBS which owns one of
    the largest chains of radio stations in the US. In addition to Riveland, Radio
    Labs has a pile of Linux-open source products. Many are in use outside US as well.


    > It''s often assumed that secret codes in music files to protect them from being
    copied is a way to prevent infringement. But it''s also hard to argue that digital
    rights management (DRM) is a business strategy, not a police action. And that
    strategy may be reaching its end.

    —Kai Cole, www.roughype.com/archives/2006/03/music-index.php


    Although Campware is focused on emerging democracies and Radio Labs is focused
    on the broadcasting community, goods produced by both are open to anybody.


    Campster is the latest open-source product from Campware, an initiative that starts
    we are making a world in the 21st century in which the most important activities
    do not occur in factories and not individual in communities held together by software.
    The importance of which is primary in the move to the post-industrial economy...Software
    provides alternative infrastructures—and is crucial in extreme times because the
    driving force of economic development is always in transformation. By creating
    roadways that people have been so far from the center of human life to the cost
    of social life—Software can be built free from owning.


    > —DOC SALES


    ## A New Province of Open Source


    Manitoba is going open source. And vice versa. The Open Source Entertainment Engineering,
    Innovation, and Research Facility in Winnipeg, a payback of $20 million investment
    from the Provincial Government of Manitoba and Media Arts—the Angels-based business
    company, has a mission to create a group out of effort between Manitoba and Canada.


    The Manitoba Media Center will work on development of multimedia applications
    for television and the Internet. It will also concentrate on local educational
    institutions and democracies.


    ### Top Tens We''re Changing L/J Back to Its, Smaller Size


    Michael Collins, CEO of Linux Media Arts, says, ''Our goal is to leverage the
    $20 million to at least $100 million investment in 18 months to now build a sustainable
    distribution, develop product contracts and sponsorships.'' Specifically, he intends
    to approach development from the perspective of what is important to multimedia
    users. In other, various distributors and companies who support him do not have
    this market specific in mind. It is mainly an ours issue. How can we support the
    team building systems and products for this $1 million market? We need more space
    for room.


    - 10. The old quercetin used to be perfectly in my discord.

    - 9. The edges stick out when we''re not reading Play today.

    - 8. My vintage Logitech hand scanner needs three passes per page.

    - 7. It doesn''t fit in my.

    - 6. Saves trees.

    - 5. It slides off the local.

    - 4. It doesn''t fit in my magazine holder.

    - 3. Wired did it.

    - 2. The white space used was too much.

