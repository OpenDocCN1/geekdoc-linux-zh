    ## 特性：TRIXBOX


    ![](img/25da851b464310ec6d84b814147617d9_63_0.png)

    ![](img/25da851b464310ec6d84b814147617d9_63_1.png)

    ![](img/25da851b464310ec6d84b814147617d9_63_2.png)

    ![](img/25da851b464310ec6d84b814147617d9_63_3.png)

    ![](img/25da851b464310ec6d84b814147617d9_63_4.png)

    ![](img/25da851b464310ec6d84b814147617d9_63_5.png)


    ### 呼出世界


    通过外线路由（Outside Routes）拨打非常有用。为了方便固定拨号号码的配置，我配置了系统，使得通过电话拨打的所有号码都直接呼出到 PSTN 主话道，即
    ZAP9。


    ZAP9 是一个组，包含了所有连接到电话公司的 ZAP 通道，这些通道是在安装时定义的。根据呼叫组（hunt group）的概念：这些组会按顺序被呼叫，第一个空闲的组将进行接听。后一种模式匹配任何以
    9 开头的拨号号码；系统会如竖线（|）所示剥离 9，并将剩余的数字发送到主话道。它会单独处理 911 和其他号码，因此我必须知道或记住在 911 前加上缀
    9 才能呼出（即拨打 9911）。因为只有一个用于呼出的组，所以出站路由（路由）很容易定义。


    ### 入站电话


    系统最复杂的部分是按定义处理来电。配置入站电话包含两个部分：

    - 给呼叫者播放的音频消息

    - 数字接待员（交互式语音响应 - IVR）

    - 时间决定由哪个数字接待员来处理


    为了保持系统简单，我只使用了两个出站消息。第一个是“晚上（Night）”，内容：“我们现在无法服务，请按 1 留言，如果有其他事情，请按 0 响铃电话。”第二个是“每周（Weekly）”，用于响铃家里（21）；响铃办公室（22）；响铃所有电话（20）或保持在路上。


    ![](img/25da851b464310ec6d84b814147617d9_64_0.png) 图 22。完成全响铃默认值的设置。

    ![](img/25da851b464310ec6d84b814147617d9_64_1.png) 图 23。设置语音邮箱默认值。

    ![](img/25da851b464310ec6d84b814147617d9_64_2.png) 图 24。设置数字接待员工作方式的时间条件。

    ![](img/25da851b464310ec6d84b814147617d9_64_3.png) 图 25。工作日的时间条件

    ![](img/25da851b464310ec6d84b814147617d9_64_4.png) 图 26.入站路由配置

