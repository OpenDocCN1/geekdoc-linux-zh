    # Coyote Point Equalizer E550si 负载均衡器


    ## 负载均衡器帮助网站变得至关重要 LOGAN G. HARBAUGH


    负载均衡器提供了容错能力以及扩展单服务器容量的能力，对于任何业务网站来说，它们实际上是必不可少的。由于特定网站的流量可能会发生数量级的波动（对于像 Victoria''s
    Secret 或世界杯足球网站这样的站点，波动可能达到六倍），如果网站无法访问，每分钟可能会损失数千美元，因此能够将负载分散到许多服务器上，并确保即使一个或多个物理服务器故障或停止，用户仍然能够继续操作，这是至关重要的。


    Coyote Point Systems 最新的负载均衡器是 E550si。


    你可能会问：“我为什么需要负载均衡器？”或者“我需要花多少钱？”或者“为什么负载均衡——简单地在轮询方案中将进入的请求分发到虚拟集群中的几台服务器之一——会导致服务器之间出现混乱？”DNS
    服务器可以通过将 IP 地址映射到同一个主机名来实现这一点：


    ![](img/25da851b464310ec6d84b814147617d9_49_0.png)


    客户端通过其会话连接到服务器，通过 DNS 轮询时间步无法确保这一点。


    > Apache 和 Tomcat 在 Apache 和 Tomcat 服务器集群上分发负载，使用专门的 Tomcat Worker 知识进行设置和维护。还有开源的负载均衡器，例如
    Ultra Monkey，它们提供软件负载均衡算法、持久会话、监控以及到备份负载均衡器的故障转移，这些工具可以安装在任何 Linux 服务器上，仅需一或两个网卡（NIC）即可开始创建虚拟集群。因此，只需
    10,995 美元，你就可以获得一个几百美元的负载均衡器。


    # 带有两个标准网卡的单处理器服务器无法与 Equalizer 的数百万并发用户和流量相比，而 Equalizer 仅凭精心调优的操作系统和 20 吉比特端口就能做到。


    首先，一个带有两个标准网卡的单处理器服务器无法与 Equalizer 的数百万并发用户和流量相比，尽管后者 拥有精心调优的操作系统和 20 吉比特端口。


    其次，Equalizer 的用途。Equalizer 可以处理直通转发的 NAT 流量，任何网络管理员都可以为企业级负载均衡集群创建此类流量。


    - www.com 192.168.0.1

    - www.com 192.168.0.11

    - www.com 192.168.0.1


    第三，Equalizer 可以处理任何基于 IP 的协议，如 HTTP、HTTPS、FTP。它支持 DNS、UDP、RADIUS、SMTP、IMAP、NTP、FTP
    和流媒体，以及其他 UDP 和 TCP/IP 协议。它还可以处理静态 Web 页面、应用程序服务器以及任何类型的 SQL 数据库服务器。


    实例类型的负载均衡要复杂得多，它允许检查以确保主机可用，并允许比简单轮询更复杂的算法，允许将新请求发送到负载的服务器。这种类型的负载均衡确保客户端在整个会话期间连接到同一台服务器。然而，这种方法不适用于其他
    Web 服务器，并且需要一些特殊的解码，这可以大幅减少服务器负载，并且多个 Equalizer 可以联网以提供地理位置负载均衡，这允许你设置地理位置分离的站点，它们都提供相同的
    URL，这样如果一个数据中心离线，其他站点将继续提供服务。地理负载均衡软件可以确定哪个数据中心最适合响应给定的客户端，并将这些客户端发送到将接收其及所有其他流量的站点，或者匹配分配给特定国家的
    IP 范围以在其他语言中本地化网站。Equalizer 可以自动复制返回给客户端的 HTTP 流中的 cookie，这可以识别特定的客户端，并确保所有流量返回到同一台服务器。例如，你可以定义一条规则，如果用于订单计数的电子邮件地址超过
    70%，则向集群添加额外的服务器。


    Equalizer 还提供了一个可选的 SSL 加速卡，可以提供 SSL 加速。


    # Coyote Point Equalizer E550si


    设置集群是一个多过程，首先通过串行终端执行初始网络配置，然后通过浏览器登录配置一个或多个服务器。通过填写集群中服务器的 IP 地址并从下拉框中管理它们，设置集群非常简单。


    虽然也有比 Equalizer E550si 便宜的负载均衡解决方案（许多甚至更贵），但其高性能、易用性和编程便利性的结合是比拟的。


    - Coyote Point Systems: www.coyotepoint.com。

    - 价格从 10,995 美元起。

    - 无限制数量的虚拟集群。

    - 每个集群最多 18 台服务器。

    - 带宽：20GB/s。

    - 并发连接数：约 10,000,000。

    - 端口：1–10/100, 20–100/10,000。


    选择取决于负载均衡的方法和集群类型。负载均衡选项有轮询、权重（每台服务器占总连接数的百分比）、自适应、快速响应、连接或服务器代理。在大多数情况下，任何方法都是默认的。


    # 简评


    48 | 2007年3月 www.linuxjournal.com


    # 使用 ASTERISK 进行时区处理

    第一部分


    去年，我去亚洲旅行了。为了保持联系，我带了一部 GSM 手机，可以在我访问的国家接电话。能够使用和家里相同的号码接电话听起来非常酷——直到接一个电话打进来为止！一位同事决定在周五中午给我打电话，那是我周六的清晨，这醒了我，因为电话“隐藏”了我的位置。回到家里后，我问人们为什么我的手机公司不能在时区变化超过四或五小时时简单地播放一段消息，但我预计使用每分钟一美元的移动电话。回到我的想法，我开始使用
    Asterisk，因为它为设计 PBX 服务提供了丰富的工具包。任何可以用计算机编写的都可以 Asterisk 服务。在理解基础之后，我开始实现一个功能，记录我访问的时间并防止在不方便的时间来电。两个主要部分是时间的偏移。（我的代码仅实现整小时偏移，尽管可以扩展到半小时或刻钟）。当设备连接到
    Asterisk 时，其 IP 地址映射到位置并设置偏移。在将偏移程序写入系统后，入站电话将根据远程位置进行检查：在手机响铃之前，检查远程位置的时间，如果拨号者尝试在不方便的时间通话则会收到警告。


    '
