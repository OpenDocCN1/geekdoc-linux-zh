    ## 前言

    + 趣味


    ## diff -u


    Promise 已经发布了由 `sata_promise` 驱动支持的全线硬件规范。这是一个极好的消息，特别是考虑到 Promise 一直以来不愿与 Jeff
    Garzik 就此问题进行谈判，而正如这一新闻所示，他已经强调了这种紧迫性。


    ### 内核开发新动态


    ### LI 索引，2007年3月


    - 1. 2006年12月7日全球入狱记者总数：134

    - 2. 与前一年相比，入狱记者人数增加：9

    - 3. 拥有入狱记的国家数量：24

    - 4. 互联网从业的入狱记者人数：62

    - 5. 中国在世界入狱记者人数国家中的排名：第1

    - 6. 中国入狱记者人数：31

    - 7. Firefox 在斯洛文尼亚的市场占率：39

    - 8. Firefox 在芬兰的市场占率：35.4

    - 9. Firefox 在斯洛伐克的市场占率：34.3

    - 10. Firefox 在波兰的市场占率：32.3

    - 11. Firefox 在捷克的的市场占率：31

    - 12. Firefox 在法国的市场占率增长率：19.5

    - 13. Firefox 在北美的市场占率：13.5

    - 14. Firefox 在大洋洲的市场占率：21.4

    - 15. 移动端访问网站平均时长（分秒）：25

    - 16. 无 Linux PC 访问网站平均时长（分秒）：53

    - 17. 测量季度 Linux 服务器收入（十亿美元计）：1.5

    - 18. 同比收入增长率：5.4

    - 20. 基于 Linux 的 Tiscal 排名：1


    此前一直在致力于 `util-linux` 项目或准备从 Adrian Burk 手中接管。Karl 维护着 Red Hat 软件包，而 Adrian 的活跃度已不如该项目。Karl
    能够撰写良好的内核邮件列表文章，解释他为项目创建 git 仓库的计划，并发送给代码库中的每个人。尽可能平稳地过渡并由 Adrian 完成良好的交接至关重要。正如
    H. Peter Unwin 指出的，将代码开源可能是实现这种平稳过渡的最佳方式。由于 Adrian 看到 Karl 能够胜任工作，并让实验接管。


    Mikulas 发布了 Spads 的初始版本，这是作为他博士论文的一部分创建的新文件系统。其旨在解决许多青睐记者经常重启的问题。与 Firefox 不同，它在安装后，还会为数据打上标签信息，直到数据被写入适当的系统中。如果电脑崩溃并重启，Firefox
    将通知它状态与当前状态不匹配，然后恢复最近的数据。在 Linux Torvalds 的支持下，Spads 正处于恢复速度最快的轨道上。因此，不可能会有所谓的“丢失数据”的说法。


    全新的 ext4 文件系统已被引入内核。实际上，在其开发状态下，让并发变为一个比其他文件系统不困难的前景要容易得多。但与 ext4 不同，代码近期将继续积累新功能和变化。这些重大变化是
    Linux Torvalds 坚持要求开发人员开发新内核的主要原因。如果他认为应该，应该考虑弃用旧文件系统，那样就结束了。这是强制推出内核 2.6 的动力，也是避免修复各种补丁（hacks）的唯一方法。


    最近内核开发中通过总线接口向用户提供系统源码并不是首要任务。直到每种类型的电池都有其自己的 Linux 内核接口，尽管已有一些异议声音。例如，Richard
    Hughes 认为电池和交流电源足以为它们各自编写不同的驱动程序。在 David 看来，两个接口将比为了空间而复制更易管理。到目前为止，还没有一个通用的电源驱动程序，但这在内核黑客中似乎得到了许多支持。


    > ZACK BROWN

    来源：1–6: 记者保护委员会 | 7–16: XITI | 17–19: IDC | 20: 路透社


    ## 自由发布 (Cast Freely)


    这是一个运行在 Linux 上（目前为 Debian 和 Ubuntu）的广播系统，旨在实现从个人到网络中多个站点的分发扩展。特性：适用于新兴民主国家的独立新闻和媒体机构。其他项目还有
    Campsite（多语言新闻出版）、Cream（客户关系管理和 DRM）以及 Dream（所有分发链接，更多信息请见 campware.org）。


    ### 他们曾说


    - 现场直播布局

    - 基于 Web 的远程自动化

    - 播放列表

    - 集中式节目素材存档

    - 快速播放（使用 GStreamer）

    - 程序共享

    - 基于搜索的查找

    - 开放、可扩展架构（包括使用 XML-RPC API）。


    > 仅仅因为困难并不意味着它值得做。

    —Britt Glas


    如果你对 Campsite 感兴趣，可能会发现 Riveland，这是一个由 Radio Labs 开发的重型广播自动化系统。Radio Labs 是 CBS
    的一个部门，拥有美国最大的广播站连锁之一。除了 Riveland 之外，Radio Labs 还有许多 Linux 开源产品。许多产品在美国境外也在使用。


    > 人们通常认为音乐文件中保护免被复制的秘密代码是防止侵权的一种方法。但很难论证数字权利管理（DRM）是一种商业策略而非执法行动。而且这种策略可能正在走向终点。

    —Kai Cole, www.roughype.com/archives/2006/03/music-index.php


    尽管 Campware 专注于新兴民主国家，而 Radio Labs 专注于广播社区，但双方生产的产品对任何人开放开放。


    Campster 是 Campware 的最新开源产品，该倡议始于我们正在创建一个 21 世纪的世界，在这个世界里，最重要的活动不再发生在工厂，而是发生在由软件连接的社区中的个人身上。这在向后工业经济转型中具有主要意义……软件提供了替代性的基础设施——并在极端时期至关重要，因为经济发展的动力始终在转型中。通过创造人们一直远离人类生活中心到社会生活成本的道路——软件可以在不受所有权限制的情况下构建。


    > —DOC SALES


    ## 开源的新领域


    曼尼托巴省将走向开源。反之亦然。位于温尼伯的开源娱乐工程、创新与研究设施，是对曼尼托巴省政府和 Media Arts（一家总部位于 Angels 的商业公司）
    2000 万美元投资的回报，其使命是在曼尼托巴省和加拿大之间创建一个努力的集体。


    曼尼托巴媒体中心将致力于适用于电视和互联网的多媒体应用。它还将关注当地教育机构和民主进程。


    ### 我们正在让 L/J 回到更小尺寸十大


    Media Arts 首席执行官 Michael Collins 表示：“我们的目标是利用这 2000 万美元，在 18 个月内获得至少 1 亿美元的投资，以建立可持续的分发、开发产品合同和赞助。”具体来说，他打算从多媒体用户的角度进行开发。此外，支持他的各种分销商和公司并没有考虑到这个市场。这主要是我们内部的问题。我们如何支持构建这个百万美元市场的团队？我们需要更多的空间。


    - 10. 旧的 quercetin 以前完美契合我的 discord。

    - 9. 当我们今天不读《Play》时，它的边缘会伸出来。

    - 8. 我的老式 Logitech 手持扫描仪每页需要扫描三次。

    - 7. 放不下我的。

    - 6. 保护树木。

    - 5. 它会从本地上滑落。

    - 4. 它放不下我的杂志架。

    - 3. 《Wired》杂志做过。

    - 2. 留白太多了。

    - 1. 第一点无关无关——当订单到来时你不需要 L/J。


    了解更多信息请访问 manitobamediacenter.com


    > —Allen Megan, 主题演讲于,,

    www.youtube.com/watch?v=Hforgj2JV8


