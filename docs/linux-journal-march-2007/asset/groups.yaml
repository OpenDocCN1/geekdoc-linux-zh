  mdcn: "\n\n# 拆解数字\n\n我很有兴趣地读了《拆解数字》（Dave Taylor 的 Work The Shell, 2006年12月），因为最近我也处理过这个问题。我认为\
    \ `bc` 通常被忽视了，但它非常强大。Utility 的脚本很好地说明了 `bc` 的用法，遗憾的是，它在面对巨大的二进制前缀（[en.wikipedia.org/wiki/binary_prefixes））范围时扩展性并不良好。\n\
    \n第一个 `numeric-test` 用于找到第一个非零（k）兆字节；它在处理大于 2^31 的数字时会失败（至少在内核 2.6.24-25 下运行 3.0-8.2\
    \ 版本时）。\n\n其次，要找到拍字节、艾字节、泽字节和尤字节，总共必须调用 16 次，每次调用都会产生相应的系统开销。\n\n另一种方案会更有效，并且可以避免\
    \ shell 无法处理的巨大数字，如下：\n\n```bash\n# 总字符数\necho -n $1 | wc -c\n\n# 数字列表\necho -n\
    \ $1 | tr -cd '[0-9]' | wc -l\n\nif [ -z \"$1\" ] || [ $1 -ne 0 ]; then\n  echo\
    \ \"bc <integer\"\n  echo\n  if [ 0 <= integer <= (2^100)-1 ]; then\n  fi\nfi\n\
    ```\n\n```bash\n# echo \"$prefix\" | cut -c $order\n\nif [ $nn -gt 3 ];\nthen\
    \ scale=3\nelse scale=0\nfi\nvalue=scale=$scale; $1($order)\n```\n\n```bash\n\
    bc -1\necho \"$valueletter\"\n```\n\n这个版本包含了两次 `bc` 调用和一次 `cut` 调用。对 `bc` 的调用报告了以下内容：\n\
    \n```bash\n# 最接近 1024 的幂次是多少\necho (1/1024)=9.765625e-4388590417\necho scale=0\
    \ | 1\necho $((6/9.765625e-438859954390417) | bc -1)\n```\n\n通过以下事实确定最接近的 2^10\
    \ 幂次：除以 n 的对数等于以 1 为基取 n。偏移是通过 `cut` 使用 `bc` 加载 `bc` 的数学功能实现的。\n\n```bash\nvalue=scale=$scale\
    \ :\n$1/(1024^($order-1)) | bc -1\n```\n\n1024 除以正确的阶级，并缩放到适当的小数位数。\n\n通过对 400\
    \ 个二进制数字计算两个脚本的平均时间，我发现基于对数的脚本快了三倍以上。另一方面，对于具有几百个网关的大数字，原始脚本则无效；原始脚本是：\n\n```bash\n\
    # 最接近 1024 的幂次是多少\necho (1/1024)=9.765625e-4388590417\necho scale=0 | 1\necho\
    \ $((6/9.765625e-438859954390417) | bc -1)\n```\n\nJohn\n\nJohn \"maddog\" Hall\
    \ 回复：我同意“公司”（或其他任何人）不应该能够窃取你的工作，但我不同意软件专利是实现这一目标的方法。\n\n关于大小——大多数软件创作者没有能力在法庭上进行软件之战。考虑到\
    \ RTP 和 NTP 现实之间的背景，NTP 声称的三项专利被推翻，花费了数百万美元的法律费用。人们可能预料会被推翻，但 NTP 决定“和解”。赢得这场辩论的少数人中有你们。\n\
    \n例如，在我的 #2 回复中，我希望获得关于为什么并行编程并不是“令人疯狂的困难”的见解。遗憾的是，McKenna 的解释无非是宣布了“它并没有那么困难”。在看到我自己看到实质性的论据来反驳这种说法之前，我仍然倾向于相信编程确实是那种事实。\n\
    \n我并没有主张没有“复制保护”，只是主张软件专利。关于音乐和艺术形象顺带一句，如果我可以复制 O Day，然后在曲子末尾添加两个音符并声称是我的。如果我能将其市场化，并且比原作曲家（贝多芬）更有影响力，我能说出到底是谁写的吗？\n\
    \n更重要的是，如果贝多芬发生了这种事，他能在不成为任何人的东西的情况下写出一首音乐吗？他会在那里写音乐吗？\n\n这种情况不会发生。版权和许可法在 1995\
    \ 年专利产生之前的很久以前就已经应用于编写软件时代了。在软件专利普遍可用之前，它们就在保护软件了。\n\n为什么要发明？偷取别人的想法，让它变得廉价，并把这件事搞得比原作曲家的作品更高级（假设他生活在那个时代）更好吗？\n\
    \n# Nedija Diego\n\n它保护了每一个能够夺取他们市场的人，或者如果没有发生，那也是一个教训，但会发布免费版本。尊重版权、商标和商业秘密以保护人的完整性。自由软件依赖版权进行许可。\n\
    \nPhrase E. Lee：这是说要不断重复相同的话，直到结果变得不同；因此，并行系统的程序员们必须是疯了。\n\n关于 Gretchen，贝多芬会用它来侵犯版权，并且可能无法阻止你使用\
    \ Unix 或其他“进程”。\n\n遗憾的是，在我的 #5 回复中，McKenna 博士可能是一个神话而不是值得坚持的。他指出可以使用代理、防火墙、数据库创建网站，或者每个服务器的响应时间必须首先进入实时领域。他将“实时”等同于“真实事实”。\n\
    \n# 玩玩有趣的玩具。\n\nGarmin International 位于堪萨斯斯州的奥拉特海，是全球 GPS 技术的领导者，正在快速增长。我们正在寻找最优秀、最聪明的人才来帮助我们继续创造尖端技术。\n\
    \n![](img/25da851b464310ec6d84b814147617d9_12_0.png)\n\n## 职位\n\n- Linux工程师 IRC26\
    \ 此人将负责为 Garmin 的通信和导航产品开发软件。这要求候选人具有 C、C++ 或或其他语言的经验，根据 Garmin 软件开发方法进行 Linux\
    \ 的嵌入式或应用开发。职责包括使用调试器、仿真器、逻辑分析仪、性能发布和质量保证活动进行软件测试，以及对已生产产品的维护和新软件的设计。\n\n- 系统管理员\
    \ - INTERNET IRC35 此人将主要负责维护 Garmin 网站的基础设施。这要求候选人精通开源技术，包括 Linux、Apache、Java\
    \ 和 MySQL 负载均衡设备、安全工具以及协助开发者。候选人必须证明具备支持高可用网站以及提供互联网稳定性、安全性和扩展性的基础设施的能力。这包括 LDAP、JEE、电子邮件和广域安全。清晰交流这些概念和知识的能力至关重要。\n\
    \n理想候选人拥有四年大学的计算机科学、电气或计算机工程学士学位，或同等教育背景。学术成绩优异，GPA 在 3.0 以上，并具有 C、C++ 等编程语言的经验，无论是嵌入式还是桌面\
    \ Linux。熟悉用于软件开发的 GNU 工具链，并具有 Gtk、Gtkmm、Qt 和 Qobject 等应用程序框架的经验。\n\n理想候选人应具有2\
    \ 年以上网络或 Web 工程师的工作经验，支持每天承受数百万访问量的网站，包括宣传页以及电子商务和高级数据功能。需要与应用程序和网站开发者合作部署可扩展、安全且稳定的系统。需要对\
    \ IIS、MS SQL、Windows 和 Oracle IAS 的支持。在托管或远程托管以及全球平衡环境中的运行经验者加分。预计对新兴互联网技术和标准有了解。需要值班支持。\n\
    \n欲了解更多信息或在线申请，请访问我们的网站 www.garmin.com/careers。\n\n![](img/25da851b464310ec6d84b814147617d9_12_1.png)\n\
