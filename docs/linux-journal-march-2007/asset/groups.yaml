    # Introduction to SELinux, Part II


    Understanding SELinux''s security models is the first step in harnessing its power.


    In last column, we began exploring the concepts, terms and theory behind Security-Enhanced
    Linux (SELinux). This month we conclude our overview, with a description of the
    SELinux implementation in Red Hat Enterprise, Fedora and CentOS.


    As much as I''d like to dive right in with the new matter, SELinux is one of the
    most complex topics I''ve tackled in this column, so summarizing last month''s
    column, here''s a list of SELinux terms:


    - Discretionary Access Controls (DACs): the underlying security model in Linux,
    in which every file has three sets of controls, known as permissions: one set
    for user-owner, group-owner and others. these permissions can be changed arbitrarily,
    at the discretion of the file owner.

    - Mandatory Access Controls (MACs): a much stronger security model, of which SELinux
    is an implementation, in which access controls are preconfigured in a system security
    policy that does not allow users or processes to change access controls (permissions)
    on the objects they view.

    - Subject: a process that initiates some action against some resource.

    - Action: a system function (writing a file, executing a process, reading data
    from a socket and so on).

    - Object: any system resource (process, file, socket and so) on which subjects
    may operate.

    - User: in SELinux, an SELinux-specific user account is separate from underling
    Linux user accounts and owns initiates a process.

    - Role: analogous to Linux groups in that it represents a set of access controls
    that to a specific list of possible users. In SELinux, a user may be associated
    with multiple roles, but only active (act within) one role at a time.

    - Domain: a combination of subjects and objects permitted to interact with each
    other.

    - Type: synonymous with domain in SELinux.

    - Security context: the user, role and domain/type-associated with a given object.

    - Transition: when a process attempts to change from one role to another by spawning
    a new process that "runs" as the new role, or when a process attempts to change
    a file or directory that belongs to a different role than its current.

    - Type Enforcement: the security model in SELinux which processes are confined
    via security contexts.


    As mentioned last time, Type Enforcement is the most important of the three security
    models implemented in SELinux. In, Red Hat Linux (RHEL) targeted, which I cover
    later in this article, Type Enforcement is the only SELinux model I use.


