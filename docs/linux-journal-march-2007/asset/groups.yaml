    At any point, any SIP or RTP packet from the Internet will be forwarded to the
    internal server for routing.


    Using a configuration for working with NAT gateway, with some details to make
    the RTP packets through relay Asterisk. are, of course, more solutions.


    As I said, if you can avoid NAT in the first place, it''s best to avoid all the
    endpoints configured to use NAT. If you have a NAT, you have to apply it to all—that
    is necessary to use UDP 5060 for sip or RTP range is defined in rtp.conf. Asterisk
    can contact both the endpoints and the rest of the internet.


    The most promising solution to the NAT problem is the firewall rewrite. The firewall
    modifies the SIP special field where RTP to use is replaced by the firewall itself,
    which would also take care of the RTP stream once it starts. Some Linux distros
    have shipped with nat_sip and ipt_conrack, some modules since kernel 2.6.18. These
    modules are used for handling NAT for RTP SIP, but it was not possible to get
    it working. I had success with others NAT from a provider with remote-disabled,
    but that is


    ## FEATURE: SIP NAT

    The easiest solution is to use NAT entirely. This may work if you have a public
    IP available for your call, or if Asterisk server is behind a private network.
    In the latter case, the port must be mapped from the internet to the server. The
    port must be reachable from both ends. In the firewall, the SIP packets will be
    forwarded in the course of the iptables. Asterisk will stay in the media stream
    because of the connectivity-nat command, and it will see the external address
    of the few SDP packets by the NAT. The media stream will be forwarded to the Asterisk
    server because of the configuration of iptables routing and ports defined in rtp.conf.


    The range of ports used is Asterisk''s choice of RTP ports from 10000 to 10100:


    ```

    rtpstart=10000 : first to use

    tpend=10100 : last to use

    roued = up

    ```


