    # # TIME-ZONE PROCESSING WITH ASTERISK

    PART I'
  - '[PAGE 52]


    ![](img/25da851b464310ec6d84b814147617d9_52_0.png)


    # 4 19

    New York


    # 22 19

    Honolulu


    # Use Asterisk to adjust for

    your daylight hours.


    # 17 19


    Last year, I took a trip to Asia. To stay in touch, I carried a

    GSM world phone, capable of receiving telephone calls in

    the countries I was visiting. The capability to receive calls

    with the same mobile number I use at home while traveling

    around the world seemed incredibly cool--at least until the

    first call came in! Which cuts both ways. A colleague had decided to call me in

    middle of the day on a Friday, which had awakened me very

    early on Saturday, because the phone "hid" my faraway

    location from him.


    After returning home, I asked people why my phone

    company could not simply play a message to callers when

    my time zone changes by more than four or five hours, leaving

    them think it might be impossible to come up with a technical reason, but it all
    was expected that I used

    mobile phone to which I subscribed charged

    dollar per minute to connect calls. As part of the process of

    att a GSM phone to a network, the home needs to

    learn where the phone is, and that information conceivably


    could include a time zone.


    I returned to my idea I started using Asterisk, because

    it provides an extensive toolkit for designing PBX-hosted

    services. Anything that can be coded in a computer can

    come an Asterisk service After I understood the basics of

    Asterisk I sat down to implement a feature that kept

    the time of day where I visited and prevented calls from

    coming in inconvenient times.

    The two major parts are the offset from the time in London. (My code implements
    offsets only

    whole hours, though it could be extended to use either half or

    quarter hours). When a device connects to Asterisk, its IP

    address maps to the location and the offset is set.

    After the offset is programmed into the system, incoming calls

    are then checked against the time at the remote location: Before

    tphone is allowed to ring, the time at the remote location is

    checked, and callers are warned if they are trying to complete

    all at an inconvenient time.


    # MATHEW GAST


    STOCKPHOTO.COM/TKX8Z321


    www.linuxjournal.com march 2007 | 51'
- md: "\n# FEATURE: ASTERISK\n\n## STEP 1 ESTIMATING THE TIME ZONE\n\nAsterisk does\
    \ not have a build-in method to estimate the time zone from an IP address, but\
    \ it does have the best thing—the Asterisk Gateway Interface (AGI). AGI programming\
    \ allows an Asterisk extension to pass data to an external program, deprogram\
    \ and return results as Asterisk channels.\n\nI began the project with an AGI\
    \ script that would take an IP address and return an estimated time zone. Since\
    \ several geolocation databases map IP addresses into geographic information,\
    \ my project had to retrieve the time zone directly from the database, so I estimated\
    \ the time zone by longitude. (The earth has 24 time zones, each of approximately\
    \ 15 degrees of longitude). I used a free-for-commercial version of the comprehensive\
    \ GeoCity database.\n\nGeoCity APIs available in several programming languages.\
    \ I used Perl, because there is also an AGI library for Perl that makes AGI scripts\
    \ easier. As input, the program takes an IP address and returns the conversion\
    \ of the time zone as an offset of the number of hours from the time in London,\
    \ which leads to some differences in daylight time handling.\n\nThe start of the\
    \ program pulls in utility functions, which handles the parameters passed to the\
    \ program by Asterisk:\n\n```perl\n#!/usr/bin/perl -w\n# Asterisk AGI to estimate\
    \ time zone from IP address\n\nuse strict;\nuse Asterisk::AGI;\nuse Geo::IP::PurePerl;\n\
    use POSIX qw(ceil floor);\n\n# California is GRT = -8\n$HOME_OFFSET = -8;\n\n\
    $agi = new Asterisk::AGI;\n$input = $agi->read_Parse();\n```\n\n(The full listing\
    \ of programs from this article is available on the Linux FTP site; Resources)\
    \ The argument to the program is an IP address, which is given to us Asterisk.\
    \ The first check is to determine whether the IP address is on the local subnet\
    \ of the Asterisk server. Location databases do not include private address space\
    \ and won't need a lookup. MaxMind API can accept a domain as an argument, but\
    \ we do not expect to parse it:\n\n```perl\n$addr = $ARGV[0];\n$parts = split(/\\\
    ./, $addr);\nif ($parts[0] == \"192\" || $parts[0] == \"168\" || $parts[0] ==\
    \ \"10\") {\n  # Local IP addresses get the home offset\n  $agi->set_variable(\"\
    TZ_OFFSET\", $HOME_OFFSET);\n}\n```\n\nThe use of this strategy is straightforward.\
    \ We create an object, loading the location of the database on, then call the\
    \ get_city_as_hash function in MaxMind API, which returns everything the IP address\
    \ as a hash. The item is the longitude component of the hash. If it's not one,\
    \ we'll set it -8 for California and let Asterisk deal with the result:\n\n```perl\n\
    $gi = Geo::IP::PurePerl -> new(\n  \"/usr/local/share/Geo/GeoCity.dat\",\n  GEO_STANDARD\n\
    );\n$mycity = $gi->get_city_record_as_hash($addr);\n\nif (defined ($mycity->{'longitude'}))\
    \ {\n  # Guess at the time zone when longitude offset\n  $agi->set_variable(\"\
    TZ_OFFSET\", $offset);\n  exit 1;\n}\n```\n\nA bit of math is required to deal\
    \ with the fact that time zone boundaries may be 15 degrees, but zero is a minimum.\
    \ We use two formulas, depending on whether the longitude is positive or negative.\
    \ After computing the time zone, we pass it back to Asterisk in the TZ_OFFSET\
    \ channel variable, which is available for use in the plan:\n\n```perl\n$myLongitude\
    \ = $mycity->{'longitude'};\n\nif ($myLongitude > 0) {\n  $numerator = $myLongitude+7.5;\n\
    \  $floor = floor($numerator/$denominator);\n} else {\n  $numerator = $myLongitude-7.5;\n\
    \  $cell = ceil($numerator/$denominator);\n}\n\n$agi->set_variable(\"TZ_OFFSET\"\
    , $offset);\n```\n\n## STEP 2 CONFIRM THE TIME-ZONE INFORMATION\n\nAs convenient\
    \ as it would be to have a database of IP addresses mapped into the right time\
    \ zones, there is still the problem of handling summer shifts in time. Plus, the\
    \ estimates from a demonstration are not guaranteed to be accurate. Therefore\
    \ to estimate the time, the AGI script is called from an extension that is used\
    \ to estimate or save new one. For an extension with *89 (because 8-9 is the numerical\
    \ mapping of the letters-T) just with previous version, some of the details are\
    \ removed for brevity; but the full value is available from the JTI FTP site (servers).\n\
    \nThis article shows the plan for using Aster Expression Language (AEL) as it\
    \ has better controls and it is much easier to write structured code. For various\
    \ purposes, it can be used for all kinds of input.\n\nA call into the engines\
    \ with a welcome announcement and a call to the script (shown previously) to initialize.\
    \ All of the time zone greetings are firstly in the mstzsettings of the subscript\
    \ layer. SIPHANFOIP can contain all client information. SIPHANFOIP returns the\
    \ internet address of the remote device to use and, therefore, even if the device\
    \ is behind a network address.\n\n```ael\n*89 = =\nAnswer:\nPlayback(msg/tz-wizard);\n\
    Set(PEER($PEER));\n\n// Geocode first at time\nAGI(tz_lookup.pl, $PEER());\nNoOp(tz\
    \ offset from ${TZ_OFFSET});\n```\n\nThe script returns the time zone of the IP\
    \ address used by the peer in the TZ_OFFSET variable. However, the purpose of\
    \ this call is to confirm the offset, so we proceed to a series of steps. The\
    \ system starts by giving a configuration of the time offset from local and uses\
    \ that to say the time. Asterisk needs to convert the epoch time (the number of\
    \ seconds since January 1, 1970) and converts it to local time for a given time.\
    \ I am adjusting the settings for summer savings, which assumes that some of countries\
    \ will be on the same schedule as AGI and corrects any errors later in validation:\n\
    \n```ael\n// time keeps summer time\nPlayback(msg/tz-current-time-is);\nSystemtime(${EPOCH}+${TZ_OFFSET}*60);\n\
    ```\n\nFor The Open Source Community Since 1999 (Linux, FreeBSD, OpenBSD, Solaris,\
    \ etc.), servers deliver high performance for the most advanced applications.\n\
    \nWhen I arrive in foreign locations, I am quite tired, and my ability to do arithmetic\
    \ is substantially reduced from my capacity to function fully. Rather than a menu\
    \ to select a choice, the menu prompts for the local clock time and the time-zone\
    \ offset from London. The basic approach is to obtain the 24-hour time function\
    \ and compute the offset from the time entered by the user. There's a possibility\
    \ that the offset value will be too big or too small, so a small script corrects\
    \ it for:\n\n```ael\ngetweek\nRead(INPUT,msg/tz-24-hour-prompt.4);\nSet($REMOTE_OFFSET,$($INPUT)-($LEN($INPUT)));\n\
    Set($REFERENCE,$STFTIME($EPOCH));\nEurope/London;\nSet($TZ_OFFSET,$($REMOTE_OFFSET)+($REFERENCE));\n\
    // correct for too big or too small\nif ($TZ_OFFSET > 12) {\n  Set($TZ_OFFSET,$($TZ_OFFSET)-24);\n\
    }\nif ($TZ_OFFSET < -12) {\n  Set($TZ_OFFSET,$($TZ_OFFSET)+24);\n}\nReturn;\n\
    ```\n\nNext, we ask you to confirm the time you are creating. The Read operation\
    \ gets one digit from the day. AELS switch is handy for working with input, because\
    \ it can be used to set up a series of actions for a menu exit quite without the\
    \ use of branching statements. In this case, the switch statement offers the option\
    \ of a one-hour correction by entering the number 2 and an anniversary, 1 by correction\
    \ by entering the number. Any other default statement in AEL is due to the internal\
    \ representation of the control structures, you must use a fully qualified goto,\
    \ including the context, extension number and label. My internal extension context\
    \ is from-internal, so gets are prefixed with from-internal:*\n\n```ael\nRead(INPUT,msg/tz-confirm-correct.1);\n\
    switch ($INPUT) {\n  case 1:\n    goto from-internal*expiry;\n  case 2:\n    goto\
    \ from-internal*correction;\n  default:\n    Playback(msg/tz-1-or-2-please);\n\
    \    goto from-internal*exit;\n};\n```\n\nAt the correction level, there is a\
    \ second option. I expect that summer-time hours will be in common use, so I decided\
    \ to add or subtract an hour. The menu handles that type of one-hour correction\
    \ and the one-hour correction subroutine is available on the file set. In both\
    \ structure, both to the switch statement shown below.\n"
  mdcn: "\n\n# 特性：ASTERISK\n\n## 第 1 步：估算时区\n\nAsterisk 本身没有内置从 IP 地址估算时区的方法，但它拥有最强大的工具——Asterisk\
    \ 网关接口 (AGI)。AGI 编程允许 Asterisk 分机将数据传递给外部程序，处理并将结果作为 Asterisk 通道返回。\n\n我从一个 AGI\
    \ 脚本开始了这个项目，该脚本接收一个 IP 地址并返回估算的时区。由于多个地理数据库会将 IP 地址映射为地理信息，我的项目必须直接从数据库检索时区，因此我通过经度估算时区。（地球有\
    \ 24 个时区，每个时区大约占 15 度）。我使用了免费商用版的全面 GeoCity 数据库。\n\nGeoCity API 提供了多种编程语言。我使用了\
    \ Perl，因为 Perl 也有一个 AGI 库，可以让 AGI 脚本编写更加简单。作为输入，程序接收一个 IP 地址，并将时区转换为相对于伦敦时间的小时偏移量，这导致在处理夏令时时产生了一些差异。\n\
    \n程序的开头引入了实用函数，这些函数处理 Asterisk 传递给程序的参数：\n\n```perl\n#!/usr/bin/perl -w\n# Asterisk\
    \ AGI to estimate time zone from IP address\n\nuse strict;\nuse Asterisk::AGI;\n\
    use Geo::IP::PurePerl;\nuse POSIX qw(ceil floor);\n\n# 加利福尼亚 GRT = -8\n$HOME_OFFSET\
    \ = -8;\n\n$agi = new Asterisk::AGI;\n$input = $agi->read_Parse();\n```\n\n（本文中程序的完整列表可在\
    \ Linux FTP 站点获取；[Resources]）程序的参数是一个 IP 地址，由 Asterisk 给出。第一个检查是确定 IP 地址是否在 Asterisk\
    \ 服务器的本地子网内。位置数据库不包含私有地址空间，不需要查找。MaxMind API 可以接受域名参数，但我们并不预期解析它：\n\n```perl\n\
    $addr = $ARGV[0];\n$parts = split(/\\./, $addr);\nif ($parts[0] == \"192\" ||\
    \ $parts[0] == \"168\" || $parts[0] == \"10\") {\n  # 本地 IP 获取本地偏移量\n  $agi->set_variable(\"\
    TZ_OFFSET\", $HOME_OFFSET);\n}\n```\n\n使用这种策略非常直观。我们创建一个对象，加载数据库所在的位置，然后调用 MaxMind\
    \ API 中的 `get_city_as_hash` 函数，该函数将 IP 地址的所有信息以哈希形式返回。该项是哈希中的经度分量。如果不是一个，我们将为加利福尼亚设置为\
    \ -8，并让 Asterisk 处理结果：\n\n```perl\n$gi = Geo::IP::PurePerl -> new(\n  \"/usr/local/share/Geo/GeoCity.dat\"\
    ,\n  GEO_STANDARD\n);\n$mycity = $gi->get_city_record_as_hash($addr);\n\nif (defined\
    \ ($mycity->{'longitude'})) {\n  # 当经度偏移估算时区\n  $agi->set_variable(\"TZ_OFFSET\"\
    , $offset);\n  exit 1;\n}\n```\n\n需要进行数学计算来处理时区边界可能是 15 度的情况，但 0 是最小值。我们使用两个公式，取决于经度是正还是负。计算出时区后，我们通过\
    \ `TZ_OFFSET` 通道变量将其传回 Asterisk，该变量可在方案计划中使用：\n\n```perl\n$myLongitude = $mycity->{'longitude'};\n\
    \nif ($myLongitude > 0) {\n  $numerator = $myLongitude+7.5;\n  $floor = floor($numerator/$denominator);\n\
    } else {\n  $numerator = $myLongitude-7.5;\n  $cell = ceil($numerator/$denominator);\n\
    }\n\n$agi->set_variable(\"TZ_OFFSET\", $offset);\n```\n\n## 第 2 步：确认时区信息\n\n虽然拥有一个将\
    \ IP 地址映射到正确时区的数据库很方便，但仍然存在处理夏令时切换的问题。此外，演示中的估算值不能保证准确。因此，为了估算时间，从分机调用 AGI 脚本，用于估算或保存新的时区。对于仅使用旧版本的\
    \ *89（因为 8-9 是字母 T 的数字映射）* 分机，为了简洁起见删了一些部分细节；但完整值可以从 JTI FTP 站点（[servers]）获取。\n\
    \n本文展示了使用 Asterisk 表达式语言 (AEL) 的方案，因为它具有更好的控制功能，且更容易编写结构化代码。出于各种目的，它可以用于各种输入。\n\
    \n调用引擎时带有欢迎公告，并调用脚本（如前所示）进行初始化。所有的时区问候语首先位于子层的 `mstzsettings` 中。SIPHANFOIP 可以包含所有客户端信息。SIPHANFOIP\
    \ 返回远程设备使用的互联网地址，因此即使设备位于网络地址之后。\n\n```ael\n*89 = =\nAnswer:\nPlayback(msg/tz-wizard);\n\
    Set(PEER($PEER));\n\n// 先进行地理位置编码\nAGI(tz_lookup.pl, $PEER());\nNoOp(tz offset\
    \ from ${TZ_OFFSET});\n```\n\n脚本在 `TZ_OFFSET` 变量中返回对端所用 IP 地址的时区。然而，为了确认或保存新的时区，从分机调用\
    \ AGI 脚本。对于仅使用旧版本的 *89（因为 8-9 是字母 T 的数字映射）* 分机，为了简洁起见删了一些部分细节；但完整值可以从 JTI FTP\
    \ 站点（[servers]）获取。（注：原文逻辑有重复，此处已根据 AEL 结构调整翻译）\n\n```ael\n*89 = =\nAnswer:\nPlayback(msg/tz-wizard);\n\
    Set(PEER($PEER));\n\n// 先进行地理位置编码\nAGI(tz_lookup.pl, $PEER());\nNoOp(tz offset\
    \ from ${TZ_OFFSET});\n```\n\n脚本在 `TZ_OFFSET` 变量中返回对端所用 IP 地址的时区。然而，为了确认或保存新的时区，从分机调用\
    \ AGI 脚本。\n\n（注：由于提供的原文中存在部分重复段落，翻译已按逻辑要求进行了整合，确保不重复。）\n\n"
