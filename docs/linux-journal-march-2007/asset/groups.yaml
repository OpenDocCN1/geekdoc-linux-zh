    # EXPOSE VOIP PROBLEMS USING Wireshark


    Sniff out VoIP problems with Wireshark.

    SEAN WALBERG


    VENDORS WOULD HAVE YOU BELIEVE you need to spend thousands of dollars on protocol
    analyzer software to troubleshoot Voice over IP (VoIP) networks. After all, voice
    quality suffers if packets are late, missing or out of order. Fortunately, Wireshark
    is an open-source package that can do everything these tools can and more.


    Wireshark, formerly known as Ethereal, is a network protocol analyzer. Its job
    is to listen to network traffic, display it in a format that makes sense and help
    you find problems. VoIP involves a complex set of protocols that Wireshark can
    decode and relate to each other. For example, the procedure to set up a call involves
    a different protocol than the voice traffic itself. Wireshark uses the information
    from the call setup to better understand the voice flow. With this data in your
    hands, you can isolate the cause of VoIP problems.


    # Wireshark: Capture Options


    ## Monitoring: It''s All About Location


    If the packets you are looking for don''t reach the interface of the machine running
    Wireshark, you''ve got a problem. Switches by design, try to limit the traffic
    to only the ports with communication in order to improve performance. Spanning
    tree routing will only complicate the matter of trying to find out where your
    packet goes.


    Your best bet is to capture traffic directly on one of the machines involved.
    If it runs on Windows, you can''t get Wireshark on that machine but you can always
    capture traffic with taps and span analyzer. If that is not possible, or if the
    traffic spans multiple machines, it''s time to get it from your hardware network.


    Most switches offer a feature that will mirror all the frames from one interface
    to another. Thus, you could join your Wireshark station to a switch with your
    internet connection, mirror all the traffic from the router to your workstation,
    and you''ll be able to analyze it with alert filters. Cisco switches with SPAN
    analyzer, or SPAN calls it a Monitor Port, and Cisco calls it a Roving Analysis
    Port.


    The choice of which one depends on your network, but generally that connects to
    other switches or routers is a good bet. Also where capture filters help reduce
    the headache you have to deal with.


