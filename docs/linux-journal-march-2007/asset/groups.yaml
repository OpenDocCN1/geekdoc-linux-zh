- md: "\n# Coyote Point Equalizer E550si Load Balancer\n\n## Load balancers help make\
    \ a Web site-critical. LOGAN G. HARBAUGH\n\nProviding fault tolerance as well\
    \ as the ability to scale the capacity of a single server, load balancers are\
    \ practically a necessity for any business site. Because a given Web site can\
    \ fluctuate by orders of magnitude (or six, in the case of sites like Victoria's\
    \ Secret or the World Cup Soccer site), and that thousands of dollars a minute\
    \ may be lost if the site is unavailable, being able to spread the load across\
    \ many servers and ensures that users can still continue, even if one or more\
    \ physical servers fails or stops is crucial.\n\nThe latest load balancer from\
    \ Coyote Point Systems is the E550si.\n\nYou may be asking, \"Why do I need a\
    \ load balancer?\" Or \"Why can I get it for?\" Or \"Why load balancing, simply\
    \ distributing requests as they come to one of several servers in a virtual cluster,\
    \ should lead to chaos among the servers in a round-robin scheme? A DNS server\
    \ can do this by mapping IP addresses to the same host name:\n\n![](img/25da851b464310ec6d84b814147617d9_49_0.png)\n\
    \na client is connected to the server through its session, and there's no way\
    \ to ensure this with a DNS round-robin timestep.\n\n> Apache and Tomcat load\
    \ loads across a cluster of Apache and Tomcat servers, using a specialized Tomcat\
    \ Worker knowledge to set up and maintain. There are also open-source load balancers,\
    \ such as Ultra Monkey, which offer software load-balancing algorithms, persistent\
    \ sessions, monitoring, and failover to a backup load balancer that can be installed\
    \ on any Linux server and simply need one or two NICs to begin creating a virtual\
    \ cluster. So for $10,995 you can get a load balancer for a few hundred.\n\n#\
    \ A single-processor server with two standard NICs can't hope to match the millions\
    \ of concurrent users and the traffic of the Equalizer can, with a carefully tuned\
    \ OS and 20 gigabit ports alone.\n\nFirst, a single-processor server with two\
    \ standard NICs can't hope to match the millions of concurrent users and the traffic\
    \ of the Equalizer, with a carefully tuned OS and 20 gigabit ports.\n\nSecond,\
    \ use of the Equalizer. The Equalizer can handle straight-through forward-based\
    \ NAT traffic that any network admin can create for an enterprise-class load-balanced\
    \ cluster.\n\n- www.com 192.168.0.1\n- www.com 192.168.0.11\n- www.com 192.168.0.1\n\
    \nThird, the Equalizer can handle any IP-based protocols like HTTP, HTTPS, FTP.\
    \ It supports DNS, UDP, RADIUS, SMTP, IMAP, NTP, FTP and streaming media, as well\
    \ as other UDP and TCP/IP protocols. It can also handle static Web Pages, as well\
    \ as application servers, and pretty any kind of SQL-backed database server.\n\
    \ninstance type of load balancing is much more sophisticated, allowing for checks\
    \ to ensure that host is available and allowing more sophisticated algorithms\
    \ than simple round-robin, allowing new requests to be sent to the latest loaded\
    \ server. This type of load balancing ensures a client will be connected to the\
    \ same server for the duration of the session. However, this method will not work\
    \ with other Web servers and will take some specialized decoding, which can reduce\
    \ server loads quite substantially, and multiple Equalizers can be networked to\
    \ provide geographic load balancing, which allows you to set up geographically\
    \ separate sites that all serve the same URL, so that if one data center is off-line,\
    \ the others continue to service. The geographic load-balancing software, can\
    \ determine which data center will be best to respond to the given clients and\
    \ send those clients to the site that will give them there and all other traffic\
    \ to, or match IP ranges assigned to specific countries to localize a Web site\
    \ in other languages. The Equalizer can automatically copy cookies in the HTTP\
    \ stream returned to a client that can identify a specific client and ensure that\
    \ for all traffic comes back to the same server. In instance, you could define\
    \ a rule that if an e-mail address for the order count exceeds 70% or adds additional\
    \ servers to the cluster. \n\nThe Equalizer also offers an optional SSL acceleration\
    \ card that can provide SSL acceleration.\n\n# Coyote Point Equalizer E550si\n\
    \nSetting up the cluster is a multiple process of performing the initial network\
    \ configuration via serial terminal, then logging in via the browser to configure\
    \ one or more servers. Setting up the cluster is easy by filling in the IP addresses\
    \ of the servers in the cluster and managing them from drop-down boxes.\n\nThere\
    \ are also load-balancing solutions that are less expensive than the Equalizer\
    \ E550si (and many are more expensive), the mix of high performance, ease and\
    \ use of programming is hard to match.\n\n- Coyote Point Systems: www.coyotepoint.com.\n\
    - Pricing starts at $10,995 US.\n- Unlimited numbers of virtual clusters.\n- Up\
    \ to 18 servers per cluster.\n- Bandwidth: 20GB/s.\n- Number of concurrent connections:\
    \ approximately 10,000,000.\n- Ports: 1–10/100, 20–100/10,000.\n\nThe choices\
    \ are the method of load balancing and the type of cluster. The load-balancing\
    \ options are round-robin, weight (percent of the total number of connections\
    \ to each server), adaptive, fast response, connections or server agent. Any method\
    \ would be default in most cases.\n\n# QUICK TAKES\n\n48 | march 2007 www.linuxjournal.com\n\
    \n# TIME-ZONE PROCESSING WITH ASTERISK\nPART I\n\nLast year, I took a trip to\
    \ Asia. To stay in touch, I carried a GSM phone, capable of receiving calls in\
    \ the countries I was visiting. The capability to receive calls with the same\
    \ number I use at home seemed incredibly cool--at least until the first call came\
    \ in! A colleague had decided to call me in middle of the day on a Friday, which\
    \ had awakened me very early on Saturday, because the phone \"hid\" my location.\
    \ After returning home, I asked people why my phone company could not simply play\
    \ a message to callers when my time zone changes by more than four or five hours,\
    \ but expected that I used mobile phone to which I subscribed dollar per minute\
    \ to connect calls. I returned to my idea I started using Asterisk, because it\
    \ provides an extensive toolkit for designing PBX-hosted services. Anything that\
    \ can be coded in a computer can come an Asterisk service After I understood the\
    \ basics of Asterisk I sat down to implement a feature that kept the time of day\
    \ where I visited and prevented calls from coming in inconvenient times. The two\
    \ major parts are the offset from the time in London. (My code implements offsets\
    \ only whole hours, though it could be extended to use either half or quarter\
    \ hours). When a device connects to Asterisk, its IP address maps to the location\
    \ and the offset is set. After the offset is programmed into the system, incoming\
    \ calls are then checked against the time at the remote location: Before tphone\
    \ is allowed to ring, the time at the remote location is checked, and callers\
    \ are warned if they are trying to complete all at an inconvenient time.\n\nLogan\
    \ G. HARBAUGH is a freelance reviewer and consultant located in California. He\
    \ has been working in it over 15 years and has two books on networking, as well\
    \ as articles for major publications.\n\nIron Systems, Inc.\nStreet, San Jose,\
    \ CA 95131\nwww.ironsystems.com\n1-800-921-IRON\n\nMATHEW GAST\nSTOCKPHOTO.COM/\n\
    \nMATHEW GAST \nSTOCKPHOTO.COM/TKX8Z321\n\nwww.linuxjournal.com march 2007 | 51\n"
