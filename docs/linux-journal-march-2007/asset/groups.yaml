- md: "\n## IN DEPTH\n\narguments to be more informative. Functions have two types\
    \ of contracts, pre and post, signed by the in and out blocks preceding a function.\
    \ The in contract must be fulfilled before the rest of the function is executed;\
    \ otherwise, an AssertionError occurs. The post contract must check the return\
    \ value of the function what was supposed to do before the value is passed to\
    \ the application. When a program is compiled with the release option on, all\
    \ asserts and contracts are removed for speed purposes:\n\nThe static statement\
    \ allows for the compile-time checking of constants:\n\n```cpp\nconst int CONFIGSOMETHING\
    \ = 1;\n\nvoid doSomothing() {\n  static if (CONFIGSOMETHING == 1) {\n    //\n\
    \  }\n}\n```\n\n```cpp\nint sqrt(int i)\n{\n  assert(i > 0);\n  out(result); //\
    \ the return value is\n  // assigned to result\n  assert(result == result);\n\
    }\n```\n\n## Scope Statement\n\nThe scope statement is designed for a more natural\
    \ organization of code by allowing a scope's cleanup, success and failure code\
    \ to be logically grouped:\n\nAnother type of contract is the unit test. Its purpose\
    \ is to ensure that a particular function or set of functions is working according\
    \ to specification with various arguments. Suppose we have the following assertion:\n\
    \n```cpp\nint add(int x, int y) { return x + y; }\n\nassert(add(1,2) == 3);\n\
    assert(add(-1,-2) == -3);\n```\n\nThe unit test will be defined in the same module,\
    \ and if the unit test is enabled, it will run as soon as the module is imported\
    \ and function from it. In this case, it probably would look something like this:\n\
    \n## Conditional Compilation\n\nBecause D has no processor, conditional statements\
    \ are not part of the language. This removes the headers introduced by the processor\
    \ with the infinite ways in which it can be used, allowing for a faster compile.\
    \ The version statement is a like header \"#ifdef\". If a version is defined,\
    \ the code gets compiled in; otherwise, it isn't:\n\n```d\nversion(linux)\nimport\
    \ std.c.linux;\nelse\nversion(Win32)\nimport std.c.windows;\n```\n\nThe debug\
    \ statement is like the version statement, but it doesn't necessarily need an\
    \ identifier. Debugging code can be placed in the global debug context or in a\
    \ specific function:\n\n```d\ndebug writein(\"Debug: something is happening.\"\
    );\ndebug (socket) writein(\"Debug: something is\");\n```\n\nScope contracts are\
    \ executed at runtime. Script DMD, the reference D compiler, supports the --run\
    \ option, which runs the program from standard input. This allows you to as long\
    \ as the appropriate line is at the top, like:\n\n```bash\n#!/usr/bin/dmd -run\n\
    ```\n\n## Type Inference\n\nD allows the inference of the optimal type of value\
    \ with the auto-declaration:\n\n```d\nauto i = 1; // int\nauto s = \"hi\"; //\
    \ char[4];\n```\n\nThis allows compiler to choose the optimal type when functions\
    \ is needed.\n\n## foreach\n\nSome of you may be familiar with the foreach construct;\
    \ it essentially says, \"do to every element of this array\" or \"do this a number\
    \ of times, which happens to be the length of the array\"; foreach loops iteration\
    \ through arrays immensely, meaning the programmer no longer has to care about\
    \ the counter value. The compiler handles it with making each element of the array\
    \ available:\n\n```d\nchar[n] str = \"abcdefghijklmnopqrstuvwxyz\";\nforeach(char\
    \ c) {\n  writein(c);\n```\n\nYou can also obtain the index of the element by\
    \ declaring it in the loop:\n\n```d\nint [] y = {5, 4, 3, 2, 1};\nforeach(int\
    \ i=0; i<5; i++) {\n    printf(\"number is %d\\n\", y[i]);\n}\n```\n\nFinally,\
    \ you can avoid worrying about the types of the variables, and instead use type:\n\
    \n```d\nforeach(char c\n```\n\nThis opens up the field for numerous complex optimizations\
    \ that could be performed--because the compiler is taking of care as much as possible\
    \ while providing the programmer with the flexibility to accomplish any task.\n\
    \nand -this:\n\n```d\nclass MyClass {\n    this() { printf(\"Constructor called\"\
    ); }\n    this(int i) {\n        printf(\"Constructor called %d\\n\", i);\n  \
    \  }\n    ~this() { printf(\"Goodbye\"); }\n}\n```\n\nClasses have access to constructors\
    \ of their base class:\n\n```d\nthis(int i) {\n    super(1, 32); // super is the\
    \ name of the\n    base constructor\n}\n```\n\nClasses can be declared inside\
    \ other classes or functions, and they have access to the variables in that scope.\
    \ They can also overload operators, such as assignment, to make them more obvious,\
    \ as in C++.\n\nClasses have instances, which are contracts that are created at\
    \ the end of constructors, destructors before public members, but removed when\
    \ release:\n\n## Exceptions\n\nAs a rule, D uses exceptions for error handling\
    \ as opposed to error codes. D uses cleanup to be inserted conveniently in the\
    \ finally block. For those cases when the finally block is insufficient, scope\
    \ statements come in quite handy.\n\n## Classes\n\nLike object-oriented language,\
    \ D has the ability to create classes. The major difference is the lack of a virtual\
    \ keyword, which is handled by the compiler. D uses single-inheritance paradigm,\
    \ relying on interfaces and mixes, which are discussed later to fill in the gaps.\
    \ Classes are passed by reference rather than value, so the programmer doesn't\
    \ have to worry about it like a pointer. Furthermore, there is no -> operator.\n\
    \n## Interfaces\n\nAn interface is a set of functions that any class deriving\
    \ from must implement:\n\n```d\ninterface Animal {\n    void eat(Food);\n    void\
    \ walk(int direction);\n    void makeSound();\n}\n```\n\nNotice that every string\
    \ are concatenated and passed to the function. The lazy storage means that the\
    \ strings are put together only if they are called, increasing performance efficiency.\n\
    \n## Functions\n\nIn D, there is no inline keyword—the compiler decides which\
    \ functions to inline, so the programmer doesn't have to worry about it. Functions\
    \ can be overloaded—that is, with two functions with the same name take different\
    \ parameters, but the compiler is smart to know which one you're talking about:\n\
    \n## Nested Functions\n\nNested functions in D allow the nesting of functions\
    \ within functions. Nested functions have read/access to the variables of t enclosing\
    \ function:\n\n## Templates\n\nD has a totally redesigned and highly flexible\
    \ system. For structures, the operator is used for template instantiation. This\
    \ eliminates numerous ambiguities caused by <> instantiation and is more recognizable.\
    \ Here is a simple copy template:\n\n```d\ntemplate T copy(T)\n    void copy(T\
    \ from, out T)\n```\n"
  mdcn: "\n\n## 深度解析\n\n使参数更具信息量。函数具有两种类型的合约：前置（pre）和后置（post），它们由函数前的 `in` 和 `out`\
    \ 块签名。`in` 合约必须在执行其余部分之前满足；否则会发生 `AssertionError`（断言错误）。后置合约必须在值传递给应用程序之前检查函数预期的返回值。当开启\
    \ release 选项编译程序时，为了速度考虑，所有的断言（assert）和合约都会移除：\n\n`static` 语句允许在编译时检查常量：\n\n```cpp\n\
    const int CONFIGSOMETHING = 1;\n\nvoid doSomothing() {\n  static if (CONFIGSOMETHING\
    \ == 1) {\n    //\n  }\n}\n```\n\n```cpp\nint sqrt(int i)\n{\n  assert(i > 0);\n\
    \  out(result); // 返回值\n  // 赋值给 result\n  assert(result == result);\n}\n```\n\
    \n## 范围语句\n\n范围语句旨在提供更自然的代码组织，允许将范围的清理、成功和失败代码进行逻辑分组：\n\n另一种类型的合约是单元测试。其目的是确保特定的函数或一组函数能够根据各种参数按照规范工作。假设我们有有以下断言：\n\
    \n```cpp\nint add(int x, int y) { return x + y; }\n\nassert(add(1,2) == 3);\n\
    assert(add(-1,-2) == -3);\n```\n\n单元测试将定义在同一个模块中，如果启用了单元测试，它会在导入模块并调用其中的函数时立即运行。在这种情况下，它看起来可能像这样：\n\
    \n## 条件编译\n\n由于 D 语言没有预处理器，因此条件语句不是语言的一部分。这消除了由于预处理器的无限使用方式而引入的头文件，从而实现了更快的编译。`version`\
    \ 语句类似于头文件 \"#ifdef\"。如果定义了版本，代码就会被编译；否则不会：\n\n```d\nversion(linux)\nimport std.c.linux;\n\
    else\nversion(Win32)\nimport std.c.windows;\n```\n\n`debug` 语句类似于 `version` 语句，但它并不需要标识符。调试代码可以放在全局\
    \ `debug` 上下文中，也可以放在特定的函数中：\n\n```d\ndebug writein(\"Debug: something is happening.\"\
    );\ndebug (socket) writein(\"Debug: something is\");\n```\n\n范围合约在运行时执行。脚本版 DMD（D\
    \ 的引用编译器）支持 `--run` 选项，它可以从标准输入运行程序。这允许你在只要顶部有适当行的情况下运行，例如：\n\n```bash\n#!/usr/bin/dmd\
    \ -run\n```\n\n## 类型推断\n\nD 语言允许通过 `auto` 声明推断值的最优类型：\n\n```d\nauto i = 1; //\
    \ int\nauto s = \"hi\"; // char[4];\n```\n\n这允许编译器在需要函数时选择最优类型。\n\n## foreach\n\
    \n你们中的一些可能熟悉 `foreach` 结构；它本质上是“对此数组的每个元素执行操作”或“执行若干次，次数恰好是数组的长度”；`foreach` 循环遍历数组，这意味着程序员不再需要关心计数器的值。编译器通过使数组的每个元素可用来处理它：\n\
    \n```d\nchar[n] str = \"abcdefghijklmnopqrstuvwxyz\";\nforeach(char c) {\n  writein(c);\n\
    ```\n\n你可以通过在循环中声明来获取元素的索引：\n\n```d\nint [] y = {5, 4, 3, 2, 1};\nforeach(int\
    \ i=0; i<5; i++) {\n    printf(\"number is %d\\n\", y[i]);\n}\n```\n\n最后，你可以避免担心变量的类型，而是使用类型标记：\n\
    \n```d\nforeach(char c\n```\n\n这为可以执行的许多复杂优化开启了领域——因为编译器在尽可能处理工作的同时，为程序员提供了完成任何任务的灵活性。\n\
    \n以及 `-this`：\n\n```d\nclass MyClass {\n    this() { printf(\"Constructor called\"\
    ); }\n    this(int i) {\n        printf(\"Constructor called %d\\n\", i);\n  \
    \  }\n    ~this() { printf(\"Goodbye\"); }\n}\n```\n\n类可以访问其基类的构造函数：\n\n```d\n\
    this(int i) {\n    super(1, 32); // super 是基类\n    基构造函数的名称\n}\n```\n\n类可以声明在其他类或函数内部，并且它们可以访问该范围内的变量。它们还可以重载运算符（例如赋值），就像在\
    \ C++ 中一样，使其更加直观。\n\n类拥有实例，即在构造函数结束时、析构函数公共成员之前创建的合约，但在 release 下会被移除：\n\n## 异常\n\
    \n原则上，D 使用异常来处理错误，而不是错误代码。D 使用 `cleanup` 方便地在 `finally` 块中插入代码。对于 `finally` 块不足的情况，范围语句变得非常有用。\n\
    \n## 类\n\n像面向对象的语言一样，D 具有创建类的能力。主要的区别在于缺乏 `virtual` 关键字，它由编译器处理。D 使用单继承范式，依赖接口和混入（mixins），这些将在稍后讨论。类通过引用而非值传递，因此程序员不需要像处理指针那样担心它。此外，没有\
    \ `->` 运算符。\n\n## 接口\n\n接口是一组任何派生类必须实现的函数：\n\n```d\ninterface Animal {\n    void\
    \ eat(Food);\n    void walk(int direction);\n    void makeSound();\n}\n```\n\n\
    注意每个字符串都会拼接并传递给函数。延迟存储意味着字符串仅在被调用时组合，从而提高了执行效率。\n\n"
