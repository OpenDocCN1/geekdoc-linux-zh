    \ GC 可能导致某些减慢的情况下，也有完全关闭它或使用 C 语言的 `malloc` 和 `free` 管理的选项。\n\n模块具有路径分隔符。模块中的每个符号都有两个名称：符号的名称以及带有模块名前缀的名称，称为全限定名或\
    \ FQN。例如，`writeln` 可以被引用为 `writeln` 或 `std::writeln`。如果你更倾向于使用限定名，可以通过将它们放入全局命名空间来导入模块的符号。例如，`std.string`\
    \ 和 `std.methods` 都包含了 `replace` 和 `split` 的函数。由于我更有可能使用纯字符串函数而不是正则表达式，我会进行静态导入。\n\
