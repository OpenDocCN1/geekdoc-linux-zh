    icon, and a small window appears (figure 7). Enter your phone number (the plus-sign
    front number) or select it from your address, enter your message. A counter lets
    you know how many characters you have used and how many remain available. When
    you are done, click Send.


    today you might also want to check Kphone or Linux. I''ll leave you to explore
