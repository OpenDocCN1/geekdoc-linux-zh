    ## HOW TO CONFIGURE SIP and NAT


    ## Can you hear me now?

    Making VoIP work through a NAT gateway.


    SEAN WALBERG


    For all the technology Voice over IP (VoIP), you''d expect that it would work
    on every network, but unfortunately this isn''t the case. Network Address Translation
    (NAT) is a common practice used in networks, and it doesn''t play well with VoIP.
    Solving this problem within your VoIP setup: This article focuses on the SIP protocol
    and the Asterisk VoIP software, but the problems and solutions are addressed by
    most other strategies.


    NAT maps multiple internal private IP addresses. As a packet leaves the gateway,
    the source address is rewritten to the new external address. When the return packet
    arrives, the gateway replaces the destination address with that of the original
    host before sending the packet along. The gateway also can use the same external
    address for multiple hosts. The source port of the connection may be changed to
    ensure that the connection is identified uniquely by the gateway, so that the
    return packets can have the proper address replaced.


    This last scenario is also called Port Address Translation (PAT), or IP mapping.
    It allows multiple internal hosts to use a single home IP address assigned by
    the carrier. The hosts must be hidden because they are using special, private
    addresses that can''t be routed on the Internet (such as 192.168.1.1). NAT solves
    the connectivity problem by giving the host a proper source address on external
    connections, which allows the response. The gateway is inside the original connection
    in order to build the translation table entries required for NAT.


    The problem with VoIP and NAT is that both ends of the connection must be able
    to initiate a connection to each other. Consider the simplified sequence of events
    that happens when PhoneA calls PhoneB using their respective SIP servers, PBXA
    and PBXB.


    - PBXA sends a SIP invitation to PBXB on PhoneA''s behalf. In this invitation,
    it is PhoneA''s IP address.

    - PBXB invites PhoneB to the conversation specifying PhoneA''s address to the
    other end.

    - If PhoneB calls PhoneA, PBXB responds to PBXA with an acknowledgment that identifies
    PhoneB''s ID address.

    - PBXA tells PhoneA about PhoneB.

    - PhoneA sends audio using the Real-Time Control Protocol (RTP) to PhoneB.

    - PhoneB sends audio using RTP to PhoneA.


    NAT can cause problems in reality if one of the PBXs is behind a NAT gateway,
    the other PBX will not be able to connect with without some additional network
    setup. If one or more of the phones are behind a NAT gateway, they will fail to
    send audio at normal. This results in failed calls or missing audio. Asterisk
    asking for help in fixing the call in steps 2 and 4 about a re-invite or a native
    bridge. The steps show that the phone talks to its local PBX, which in turn to
    the remote PBX. The local PBX then re-invites the two sides of the call, to either
    that, or to the remote end. Ideally, both sides will do this, and the phones are
    free to talk freely, leaving the server out of the connection.


    The alternative to re-invite is to have the PBX receive the voice packets between
    the two endpoints. We look at in more detail the most common scenario.


    The simplest solution is when a SIP client gateway to the server. The client creates
    the translation for the SIP traffic if it first registers. As there is frequent
    communication between the two, such as one party channel will stay open. The configuration
    needed to have the client use its external address in all SDP packets. On clients
    that support it, enable STUN (Simple Traversal of UDP through NAT) so that, the
    client can determine the external address dynamically, or in manually. Asterisk
    does not support STUN at that, so no configuration must be done manually. The
    following is in [general] asterisk/conf.conf set up the NAT property:


    ```

    local=192.168.0.0/255.255.255.0 : your address

    exext=x

    ```


    ```

    [YOURPEER]

    nat=yes : your peer''s name

    qualify=forcekeep

    ```


    With this configuration, Asterisk uses the address defined by except for all the
    phones configured with names. By quality of qualifies Asterisk tries to test the
    connection frequently so that the NAT aren''t restarted from the firmware. With
    two Asterisks the phone will be a communication channel between them when sending
    messages.


    If you have multiple phones and an Asterisk behind a NAT gateway, the solution
    gets more complex. The phones behind the NAT will not be connected. For for you
    and other systems on the Internet, there will be problems. Unless you register
    to the remote side as a client (as done in the previous example), you will not
    be able to accept calls. Select, the address information in the


