    # Tales of an Asterisk Addict


    I''ve been using Asterisk system for a year and a half. Now by reading this article,
    you get an idea of the configurations that can be built with Asterisk and how
    each function works, as well as the flexibility to handle calls in ways that were
    previously impossible with other calling systems. For those who don''t know what
    Asterisk is, it is a software program that can interface with Switched Telephone
    Network, PSTN, and other protocols.


    It was also not mine to have to get up [to] who was calling. The Asterisk system
    was able to share call-ID with MyVoIP, which we called over our connection. Sharing
    call-ID as an up-to-date mail as well as my workstation was pretty simple. But
    when there was really nice incoming calls, I was usually able to hear who was
    calling without having to run over to a phone or call ID. It is quite rather not
    wanting to be bothered before it starts.


    I first started with Asterisk by searching the Web to find out how it worked!
    When I started using Asterisk, it turned out to be so easy. Once I got it installed,
    I was able to download software that I could use like a regular telephone, but
    I could call other users on my network. This was a fun, and now I am used to hearing
    my dad''s voice on the phone.


    It turned out to be more difficult than I had expected. Because I still wanted
    to use Asterisk for call processing, I was able to enable several providers right
    away. Many providers don''t allow you to use Asterisk or support the use of Asterisk
    with their service. With something as simple as VoIP, and as important as my home
    phone, it worked. As I researched the requirements, I discovered that many providers
    won''t allow you to use the service for any calls, including telemarketing and
    charitable calls. These features require it, but if you find the right one, then
    the penalty for getting billed can be steep. At point, I went down to wholesale
    providers, but this came with the added bonus of being able to receive calls because
    the provider isn''t providing any call features to manage a voice-mail.


    As fast as this system to play, it wasn''t very easy, so I decided to add an interface
    card to the system that I could receive calls over our regular PSTN line. In this
    phase, I was able to write my mail and I was able to use my computers just like
    telephones. The calls came ringing even when we were offline. By this time, I
    had really mastered VoIP.


    It was also time that I and wife had grown dissatisfied with our current answering
    machine, so I configured Asterisk to function in its place. As an answering machine,
    it was quite useful. I used my system to forward calls to them, and and every
    on we could receive voice-mail messages as attachments. We could now read each
    message regularly, having our mail from email-client which we could easily verify.


    The main problem with Asterisk at this point was how to make the connection between
    the Asterisk system and the phone. For example, we weren''t able to use our real
    phones to call back. The solution to this problem was to use an Asterisk phone.
    I bought a SPA202; the SPA has two phone ports, supports the SIP VoIP protocol.
    The product interface is easy to configure with a Web. Once the Asterisk and phone
    were connected, I was able to dial and receive in as I wanted.


    Once, I wanted to make the system as transparent as possible, so I tried a different
    approach. I bought a two-line telephone splitter and plugged it into the phone.
    Then, I plugged the line into two receptacles, each using the splitter as a switch.
    Now I could use any phone in the hall and one line and everywhere else. In most
    cases, if someone is on the phone, I was able to use the other line. With this,
    if someone is on the phone on one line, we get the call on the other. This has
    proven to be very convenient.


