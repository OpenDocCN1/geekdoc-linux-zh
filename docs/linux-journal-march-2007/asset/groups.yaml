    build-out to the monopolists who felt threatened by it, our federal and state
    governments have assured limits on our economic growth and reduced our competitiveness
    in the world marketplace.


    How have the carriers crippled our Internet service?


    The Internet was originally designed as a research system. When the "upstream"
    and "downstream" speeds are the same that the kind of Internet connectivity we
    find in universities and inside large companies. But it is what the phone and
    cable companies provide to home and small businesses with much higher downstream
    than upstream. The reasons are not really obvious. Most of us consume far more
    data than we produce. When we download large files, watch a YouTube video or have
    a live stream of video on the Net. The carriers have optimized their systems for
    asymmetries between production and consumption.


    The problem is, these asymmetries level every body as a consumer and prevent us
    from benefiting from what could be called "port blocks". This is where our phone
    companies prevent us from setting up our own Web server or running our own server.
    Again, they have some reasons for blocking the ports on our computers that those
    depend on. Spam, the advantage of open mail servers on our computers. These port
    blocks also prevent all types of uses, including the ability to set up home businesses
    of many kinds.


    So, of itself, offering services that aid the development of small and home businesses,
    the carriers just shut off possibilities to do that might detract from their core
    phone and cable TV services.


    There is also, in the telephone and cable business, a high-tier orientation business
    nothing other than to get you to pay a lot more for the same level of service
    provided to "consumers" who produce nothing other than a monthly payment. The
    carriers will talk about providing a higher grade of service for the market, but
    the costs are often so high that they drive business away. In fact, they have
    to offer the lowest-offering price and stick to browsing the web and e-mail to


    Isn''t this different from what we''re seeing in cities that rollout "triple-play"
    fiber systems?


    Yes, it is. By installing the "transport," and leaving the services up to other
    parties (including the phone and cable companies), we are doing two things. First,
    we save money by not getting into businesses and facilities that actually cost
    a lot to start and maintain. Second, we are reclaiming the Net as the simple utility
    it is. In a city, we need roads, water and waste services, and so we also know
    how to support better businesses than that. With what we are doing today.


    What will it cost to bring fiber-optic cable to homes and businesses?


    We have estimates of up to $2,500 per drop--the cost of a flat-screen TV (which
    we need and certain demand). The cost of fiber-optic cable itself is cheap in
    most cases, but laying it in the ground or hanging it from poles costs more. We
    can do the work of laying the cable and to make it easy for citizens to connect
    to the network they need. For example, if we can conduit and bring the fiber into
    place, a needs is a lot easier. We also need a regulatory and policy environment
    that encourages local businesses and cities to build their own neighborhood fiber
    networks, which can then connect to our public or private backbone. We would like
    to have an environment where local businesses do much of the build and make money
    in the process.


    If you''re not selling phone and cable TV services, how are you going to pay the
    cost of installing the fiber?


    We''ll have to approach this same way--just as we build our water systems, our
    power grids, and our public infrastructure. We need to think critically about
    this too, but also take advantage of what we already know building utility infrastructure.


    What do you expect to be the economic benefits of this?


    We can begin to think how by looking at what the Net has for us, and our economies,
