    ## Building a Multi-Room Digital Music System


    Used embedded Linux and open-source software to build a networked audio appliance.


    CHAD FILES


    Like many media buffs these days, I have a media center computer in my house.
    It is a small VIA M10000 Mini-ITX system in a Casetronic C158 case running Freevo
    on top of Gentoo Linux. It sits inside my media cabinet and serves TV, video,
    photos and other bits of information from a much larger AMD64 Gentoo server that
    resides in a closet near the back of the house. The two machines talk to each
    other over a wired network using NFS (Network File System). I will the first to
    tell you that it is great to have all of my music, videos and photos in digital
    format and easily accessible.


    In the same spirit of my media center computer, I wanted to have a few small systems
    that could sit on a shelf or in a room and serve music to different parts of the
    house. Many products on the market exist that broadcast audio from a computer
    and many others are playing the stream. Problem with most of these, to me, is
    that there is only one stream available. I wanted the ability to play different
    music in each room and control it with one device.—namely newcomers to the Sonos
    Digital Music System, which was revealed in the June 2006 issue of Linux Journal.
    However, I wanted to tackle this myself.


    My goal was to build a Mini-ITX device that would grab content from my file server
    and play it using MPD (Music Player Daemon). To control the appliance, I used
    lightt (a PHP-Web server) and phpmp (a PHP application that controls MPD), running
    on the appliance. This gives any computer on the network a browser-based power
    to control the appliance. My controller of choice is a Nokia 770. Using Opera,
    I can point the browser to each of the appliances and control them over my wireless
    network.


    ## Hardware for the Appliance


    For the appliance, I chose to start with a VIA ML6000E Mini-ITX motherboard. This
    board has many features that make it perfect for this type of appliance. The main
    one is the VIA 600MHz Edenless processor. This processor is not enough to push
    the applications; it makes absolutely no noise. Other features include six-channel
    surround audio, onboard LAN, slot for 1GB of memory and a PCI slot.


    Because I wanted the appliance to be silent, I decided to forgo a standard hard
    drive. I installed instead a 256MB flash drive that plugs into a 40-pin IDE slot.
    The flash also draws its power from a standard four-pin molex, and also 256MB
    of DDR-400 memory to finish out the internals.


    Figure 1. The Media Center with the Nokia 770 as the Controller


    Figure 2. The Casetronic Case with Motherboard


    To give out a sleek look, even with a Casetronic C158 case. This case has a smooth
    front, which makes it more like an appliance. Even though the case has room for
    a slim ROM drive, I did not put one in, MPD does not have support for playing
    audio from a CD. The case also has hooks on the right side to provide easy access
    with media headphones. Another nice feature on this case is the optional CompactFlash
    card reader that can be mounted on the inside and below the CD-ROM tray.


    Building this was not difficult. If you have ever installed Gentoo free, making
    the leap into the embedded realm is not very hard. Several things made my building
    interesting.


    I followed Hearth''s instructions to the letter, and when I finished, had a working
    embedded Gentoo system. After testing and making sure it all worked, I went to
    install the rest of the software needed (MPD, lightmap, and phpMyAdmin). The project
    proved to be portable (the system I wanted to install some software packages that
    I did not want or need). I started from scratch and carefully installed the dependencies
    for the software needed. Then, I installed three pieces of software with the nodeps
    flag to ensure that I did not install unnecessary software.


    ## Embedded Linux


    Because I chose to use a Flash-based drive, I needed to make sure my installation
    was fast, less than 250MB, and did not write to the code. Flash-based drives have
    only a certain number of cycles that can be performed before they give out. My
    particular drive, made by Intel Global Sourcing, has more than one-million cycles.
    With such support, I did not fear it working in a short amount of time due to
    clicks, especially if there was a swap partition on the drive. In all of this
    I factored in, I decided an embedded Linux system was the best.


    Embedded Linux systems are created in a variety of ways. I chose to go with embedded
    Gentoo (Resources). Because my development, a Dell 600m laptop, I didn''t need
    to create a custom build chain. I simply downloaded a snapshot from the Gentoo
    Web site and used my laptop as a host to build the embedded system.


    Before I attempted to build, I followed Hearth''s instructions to the letter,
