- md: "\n# TECH TIPS\n\n## Make Kpilot with Ubuntu, watch processes, lock files and\
    \ create phrases in PHP.\n\n## Making Kpilot With Ubuntu\n\nThe version of Kpilot\
    \ that comes with Ubuntu Kubuntu Eddy does not work well with Palm devices, such\
    \ as the Palm TX, many Treo phones and others. Although many people are complaining\
    \ about the difficulty of setting up the USB port to address that problem. To\
    \ get the USB port work sync, it doesn't matter to me, unless you compile it.\
    \ For example, in many cases, Kpilot copies the records from your Palm devices\
    \ and erases the records from Palm in the process.\n\nAt this time the good Kpilot\
    \ for Ubuntu has not yet been installed on my system. I want you download the\
    \ latest Kpilot, and install yourself. I downloaded it without any help.\n\nYou\
    \ must have the KDE development libraries to compile Kpilot, so you will need\
    \ to install kde-dev at the very least. You also need to install pilot-link separately\
    \ in Ubuntu. You need to install the latest version of pilot-link as well, and\
    \ compile it, first. I installed pilot-link in /usr/local/pilot-link-0.12.1. I\
    \ also set the following environment variables for my platform (this is optional\
    \ and may not match your platform):\n\n```\nexport CFLAGS=\"-march=64 -O2\"\n\
    export CFLAGS=\"$CFLAGS\"\nexport CPPFLAGS=\"$CPPFLAGS\"\nexport CXX=\"g++\"\n\
    ```\n\n```\ncd /local/src\nsvn sv ~/annons.kde.org/kde/branches/KDE/\n- ~/dev/kpilot\n\
    cd kpilot\n./configure --prefix=usr --with-pilot-link=usr\n/local/src/pilot-link-0.12.1\n\
    make -f Makefile.cmake\nmake -f Makefile.cmake install\n```\n\nIf you already\
    \ have Kpilot running, need to exit, and you may even have to kill the daemon\
    \ with the following:\n\n```\nkillall KpilotDaemon\n```\n\nRestart Kpilot, and\
    \ now you should be able to sync without problems. If you want to keep up to date\
    \ with the latest changes, you need to update the source code with the following\
    \ command (obviously, you need to configure and install again after):\n\n```\n\
    svn update kpilot\n```\n\n> * Nicholas Petletei\n\n## Linux watch Command\n\n\
    Much open-source software for Linux has good monitoring commands for observing\
    \ process activity. Some of the commands do not have graphical interfaces, and\
    \ in other cases, administrators prefer to use the command line. Monitoring the\
    \ progress of an activity is a common task.\n\nThe watch command (linux.about.com/index.php#cmd/watch.html)\
    \ is a useful tool for monitoring progress. It runs a command and watch the output\
    \ in a terminal. It shows differences (-d) between successive updates.\n\nMany\
    \ Amanda (amanda.com) users, myself included, use the watch command to observe\
    \ the Amanda backup progress. The Amanda status command (wiki.amanda.com) can\
    \ be used with the watch command to monitor the progress for each filesystem backed\
    \ up:\n\n```\nwatch --differences=cumulative\n    --interval=60 amanda status\
    \ backup\n```\n\nThe above command watches the backup progress for the Amanda\
    \ configuration backup. Another use for it is to watch memory usage in:\n\n```\n\
    watch cat /proc/meminfo\n```\n\n> * — Sweeney\n\n## PHP Secret courtesy of FEAR\n\
    \nThe following code is courtesy of FEAR: Rapid PHP by Nathan A. Good and Alan\
    \ Kent, published by Apex (www.amazon.com/book/bookDisplay.html?id=db7ld10).\n\
    \nThis tip shows how to get strings using a PEAR package Text. To use the code\
    \ in this snippet, you need to have PEAR installed along with PHP, and you need\
    \ to install the Text_Package download. To install the Text_Package package, type:\n\
    \nThe Code:\nThe PHP script creates the password process looks like this:\n\n\
    ```html\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n<title>Password\
    \ Example</title>\n<style>\nli {\n  font-style: italic;\n}\n</style>\n</head>\n\
    <body>\n<?php\n// require the Text_Pronounceable package\n// to be included in\
    \ the page\nrequireonce \"Text/Password.php\";\n?>\n<strong>Here is a pronounceable\
    \ password, defaulting\nto 10 characters:</strong>\n<br>\n<?php echo Text_Password::create();\
    \ ?>\n\n<strong>Here are 5 unpronounceable passwords, with\na length of 15 characters\
    \ each:</strong>\n<br>\n<?php\n$passwords = Text_Password::createMultiple(5,\n\
    'unpronounceable');\nforeach ($passwords as $password) {\n<li><?php echo $password;\
    \ ?></li>\n}\n?>\n</body>\n</html>\n```\n\n```html\n<p>\n<?php\n<strong>Here are\
    \ 5 unpronounceable passwords, also called,\na length of 15 characters each:</strong>\n\
    <br>\n<ul>\n<li>-E3_JuR1XXY25dp/</li>\n<li>-G0bhXYZk5De/</li>\n<li>-8tAagoJR7CI1co2/</li>\n\
    <li>-E5#FASHJ1weJa80/</li>\n<li>-L1cb7fc7@HMm</li>\n</ul>\n</p>\n</body>\n</html>\n\
    ```\n\nHow It Works:\nThe Text_Password::create() method can be called statically.\
    \ It returns a pronounceable password with a default length of ten characters,\
    \ as shown in the output.\nThe Text_Password::create(Multiple) method, also called,\
    \ allows you to define the number of characters and how many passwords you want,\
    \ the return of which are either pronounceable or unpronounceable, depending on\
    \ the desired complexity for the password. Passwords that are unpronounceable\
    \ have numbers and punctuation marks in them.\nUsing the Text_Password quickly,\
    \ you can write PHP scripts that allow your application or web site to have capacity\
    \ to generate passwords.\n\n## Data Acquisition & Control\n\n| Equipment | Contact\
    \ |\n| :--- | :--- |\n| Cirrus Logic | www.cirruslogic.com |\n| Floating Point\
    \ Math | www.floatingpointmath.com |\n| ARM Processor | www.arm.com |\n| USB Host\
    \ | www.usb.org |\n| SDMMC Flash Slot | www.sdcard.com |\n| Gigabit Ethernet |\
    \ www.gigabitethernet.com |\n| Base Ethernet Port | www.ethernetport.com |\n|\
    \ Serial Port | www.serial-port.com |\n| Backed Real Time clock | www.calendar.com\
    \ |\n| Linux Development | www.linuxdevelopment.com |\n| EMAC, inc. | www.emacinc.com\
    \ |\n\n## Locking Files\n\nAny script that reads or writes to a shared file, needs\
    \ a reliable way to lock the file so that other instantiations of the script don't\
    \ conflict on the data. The idea is that a separate file serves as a semaphore,\
    \ and cannot be used. The scripting script waits until the file can be freed properly,\
    \ deactivating by its lockfile.\n\nLockfiles are tricky to work with, because\
    \ simple solutions fail to work properly. For example, the following is a typical\
    \ approach to solve this:\n\n```\nwhile [ -f $lockfile ];\n  sleep 1\ndone\ntouch\
    \ $lockfile\n```\n\nSeems like work, doesn't it? If the lockfile doesn't exist,\
    \ then you can ensure that you unlock the lockfile, and safely modify the base\
    \ file. If another script uses the same lock file, it will wait until the lock\
    \ is gone. However, in fact, although it seems that scripts run without being\
    \ swapped out by other processes, they're actually not. Imagine what would happen\
    \ if the right one swaps you out, but before the touch, then the script searches\
    \ for the lock, find it and creates its own. Then, the script would swap back\
    \ and in touch, with the result that the two scripts would both had exclusive\
    \ access, which is bad.\n\nFurthermore, Stephen von Berg and Philip Gutierrez,\
    \ of the popular e-mail filtering program, include a lockfile that lets us work\
    \ reliably with lockfiles in shell scripts. Many distributions, including Linux\
    \ and Mac OS, have lockfile already installed. You can check whether your system\
    \ has lockfile installed. If you get a message, you're in luck! If not, download\
    \ the package from www.procm.org, and install the lockfile command on your system.\
    \ The script in this section assumes you have the lockfile.\n\nThe Code:\n\n```sh\n\
    #!/bin/sh\n# lock - A flexible file locking mechanism.\n\nretries=\"10\"     \
    \ # default number of retries\naction=\"lock\"     # default action\nnulled=/dev/null\
    \ # null count for lockfile\n\nwhile get opt in \"l:ur\"; do\n  case $opt in\n\
    \    l ) action=\"lock\")\n    u ) action=\"unlock\")\n    r ) retries=\"$OPTARG\"\
    )\n  esac\ndone\n\nif [ $# -eq 0 ]; then\n  cat << EOF >&2\nUsage: $0 [-l][-r\
    \ X] lockfile\n-l reads the lockfile, -u creates an\nunlock, -r X specifies a\
    \ maximum number of retries\nbefore it fails (default=$retries)\nEOF\n  exit 1\n\
    fi\n```\n\n```sh\nif [ -z \"$lockfile\" | grep -v 'no' ]; then\n  echo 'Error:\
    \ lockfile' utility not\n  found in PATH.' >&2\n  exit 1\nfi\n\nif [ \"$action\"\
    \ = \"lock\" ]; then\n  if [ -f \"$lockfile\" ]; then\n    echo \"Error: $retries\"\
    \ >/dev/null\n    Created lockfile in time $(date)\n  fi\n  touch \"$lockfile\"\
    \nelif [ \"$action\" = \"unlock\" ]; then\n  if [ -f \"$lockfile\" ]; then\n \
    \   echo \"Warning: lockfile $1 doesn't\n    exist to unlock\" >&2\n    exit 1\n\
    \  fi\n  rm -f \"$lockfile\"\nfi\n```\n"
