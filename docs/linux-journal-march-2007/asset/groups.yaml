    # Become a black belt in JavaScript within your own Dojo.


    REUMEN N MERER


    JavaScript has experienced a renaissance in the past year or two. Whereas many
    developers long saw JavaScript as a second-class programming language, useful
    for (at best) decorating pages, it is an increasingly central technology for Web
    Developers. Whether you are adding Ajax (Asynchronous JavaScript and XML), HTML
    to your web pages, or have begun to use JavaScript in the past year or two or
    before.


    Luckily for all developers, the rapid and widespread interest in JavaScript has
    resulted in the development of JavaScript libraries and tools, many released an
    open-source framework. In my last few months, we looked at Prototype, which makes
    general JavaScript programming easier, and Scriptulous, which provides visual
    effects and interface widgets. Prototype has become a popular open-source framework
    largely because of its inclusion in the Ruby on Rails application framework.


    But, Prototype and Scriptulous are far from the only ones in town. Another popular
    open-source framework is Dojo, a project of convenience by Alex Rust of Dojospot,
    which started popularity in 2006. Success continues to grow, but with contributions
    and money now coming from other sources as well, including companies such as Sun
    and IBM. Dojo is now used as a Web application framework, giving it additional
    leverage.


    This make, an initial look at Dojo, how it divides code into packages, then even
    of the convenience functions for JavaScript programming, and finally, at a scale
    when you have no intention of using Dojo, you will find this approach interesting.
    I almost always have to see how other libraries and tools do, if only to get some
    better performance on what I am doing.


    developer, I installed the "everything" version, labeled as kitchen sink on the
    download site. But, if you are interested in Dojo solely for its text-editor,
    or for use in Ajax or charting, you might want to download one of Dojo''s smaller
    versions, each identified by its functionality. For the purposes of this column,
    however, I experimented with several different Dojo versions.


    At the time of writing, Dojo is version 0.4.1, and the kitchen sink is available
    at the URL dojojitkit.com/release/0.4.1/dojo-0.4.1-kitchen-sink.tar.


    Once you have downloaded the file, unpack it:


    ```

    tar xvf dojo-0.4.1-kitchen-sink.tar

    ```


    The directory that you open contains a number of different items, including a
    framework, single flash archive (*.swf) files for Dojo''s persistent storage engine,
    you will find Dojo JavaScript files and script directories, including one containing
    demos (called demos), the source code for each Dojo functionality, and test scripts
    for testing and development of Dojo features.


    To get up and running on it, you must put Dojo and the sc subdirectory under your
    root directory. You can then put my Web scripts in /var/www/SENAME/, and the JavaScript
    files in the javascript directory where you want them. For a further reference,
    make sure both Dojo and the sc subdirectory are there. Thus, well, the path to
    Dojo is in your filesystem as /var/www/SENAME/javascript/dojo/dojo.js, and the
    URL that you will use to load it from a web page at /javascript/dojo/dojo.js


    And next, is how to load Dojo into our web pages using the <script> tag:


    ```

    <script type="text/javascript">

    src="javascript/dojo/dojo.js";</script>

    ```


    Although the line above loads Dojo''s into the memory, that doesn''t mean all
    of Dojo''s code is available. Rather, Dojo makes it possible to load one or more
    individual packages. You can think of Dojo as a bootloader, in that its purpose
    is to make Dojo available to later on, rather than to perform any tasks on it.


    # Installing Dojo


    The first thing to understand about Dojo is that it is large, at least by JavaScript
    standards. (Remember that all JavaScript can be downloaded from the browser and
    executed within memory, as much as possible. A large JavaScript library might
    offer many features, but it will make performance unacceptable slow.) Thus, although
    we might consider Dojo to be a single, large library, it is actually a collection
    of smaller packages.


    A relevant point when choosing the download site is that you chose combination
    of features to use. Knowing that your server is on a relatively high-speed line,
    may make your sites tend to be lightweight and that plan to explore Dojo as


    # Dojo Packages


    As we saw during the first few months, Prototype and Scriptulous have well-defined
    roles, and thus they separate packages. Prototype provides a large number of convenience
    functions for JavaScript programmers,


    18 | march 2000 www.lijournal.com'
