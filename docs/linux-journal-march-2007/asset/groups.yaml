    Plug a regular telephone in one of the FXS ports (the FXS have green LEDs. Pick
    up the phone, and you will hear a dial tone. By dialing 2000, you should hear
    a "Congratulations, you have..." welcome message. You can then try a dial of the
    demo options and make some calls between extensions.


    The above procedure need to be performed every time you power or reset the STAMP
    card. For example, the PBX can be reboot automatically. However, while experimenting,
    it is often more convenient to download from the host PC.


    The configuration files of Asterisk are as for x86 Asterisk. Some are useful files:


    +   - /etc/zapter.conf: Zapter driver configuration

    - /etc/asterisk/zapata.conf: more Zapter configuration.

    - /etc/asterisk/extensions.conf: set up dial plan for PBX.

    - /etc/asterisk/sip.conf: SIP phone configuration.


    These files are called vi on the Blackberry, but remember that any configurations
    will be on the board when the phone is powered or reset. Permanent changes can
    be stored on the SD card.


    # Further Work


    So, there you have the basics for building your own embedded Asterisk PBX. Kits
    the daughterboards and modules are available from the author. We are working on
    further development—example custom Asterisk hardware designed specifically for
    telephony work and other interface cards, such as BR-ISDN. It''s an exciting project,
    with the novel feature of open hardware.


