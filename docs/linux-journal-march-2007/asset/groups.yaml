    shared in December 2006 cron.


    His question: "Why so much extra code"

    His snippet of code to do this advantage of the built-in capabilities of the Bash:


    ```

    value=1

    kilo=1024

    mega=1024

    giga=1024

    echo $value bytes = $kilo $mega $giga

    ```


