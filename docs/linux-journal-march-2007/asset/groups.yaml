- md: "\n# STEP 3: LETTING CALLERS KNOW THE TIME\n\nAt this point, Asterisk needs\
    \ to restrict calls based on the time of day. The Asterisk dial plan can be used\
    \ to check the time at the remote site; if it is before 8 am or after 10 pm, the\
    \ phone plays the caller.\n\nAsterisk needs to pick the phone and compare the\
    \ current local time to the 8 am to 10 pm window. STRTIME function converts an\
    \ epoch into time of day. By adjusting the current epoch with the offset value,\
    \ the STRTIME function returns a time of day. A call that is too early or late\
    \ jumps to calls to silence the ringer. When a call is silenced, anyone else calls\
    \ the caller.\n\nOnly the Dial application, and the ring case has been set. Alternatively,\
    \ the call can be sent to voice mail:\n\n```\nnormal-ring:\nDial(SIP/300:20)\n\
    ```\n\n```\nvext-only:\nVoiceMail(umatthew)\nHangup();\n```\n\nFor enhanced code,\
    \ the time-day-of calls can be integrated into a macro that is part of every extension.\n\
    \n# USING THIS PROJECT\n\nAs a first step, use the GeoCity database and install\
    \ the time-zone lookup script /var/lib/asterisk/agi-bin. To add that script, add\
    \ the time-zone configuration extension *98 to your dial plan. Every extension\
    \ needs to have dial similar code to show that in Step 3 of this article.\n\n\
    Then as a user of PRX, every SIP extension is registered, and then call *99 to\
    \ set their time zone. This needs to initiate the process manually without restarting.\
    \ Asterisk provides an interface that can be used to tell the user automatically,\
    \ which will be described in a follow-up article.\n\nOn a PRX that supports multiple\
    \ users, several items would benefit from this extension. In this example, location\
    \ is stored in the Asterisk database. By storing data there it would be possible\
    \ to let users change their time-of-day schedules without...\n\nFinally we also\
    \ have added PRX with \"friends and family\" to complete a call even if it is\
    \ blocked. The caller can request the time of day at location and be allowed to\
    \ ring a call even if...\n\n```\n300 =>\nAnswer:\nPlayback(msg-remote-extension-ring:)\n\
    Set(TZ_OFFSET=$($08/ts($EPOCH)-TIMESECONDS))\nSet(RMT_EPOCH=$($EPOCH+$($TZ_OFFSET*60)))\n\
    Set(CLOCK_START=$STRTIME($RMT_EPOCH,Europe/London,NY))\nif([${CLOCK_START} < \"\
    08:00\"])\n  Go(too-early)\nelseif([${CLOCK_START} >= \"22:00\"])\n  Go(too-late)\n\
    endif\nGo(goto-normal);\n```\n\nThe configuration code starts by silencing the\
    \ ring, but allows the user to enable ringing by request. I've added a call to\
    \ handle the flexibility over months, which can be handled by only select selectors\
    \ to be active. The \"star-caller\" when the ring tone is set to the ALERT_INFO\
    \ variable. My ATA is a SIP, which allows the definition of eight ring calls.\
    \ We have defined a called silence, a ring that never uses...\n\n```\ntoo-early:\n\
    Noop(Too early to ring):\n\ntoo-late:\nNoop(Too late to ring):\n\nSet(ALERT_INFO=$silence)\n\
    overrides:\nPlayback(msg/my-remote-zone-time-is):\nSystemTime($($RMT_EPOCH),Europe/London)\n\
    A \\agi/imp.\nRead(CONF,press-1-to-confirm,1)\nif([${CONF}==1])\n  Set({ALERT_INFO=Bellcore-1):\n\
    g\n```\n\nRinging the phone is straightforward, but it requires us using...\n\n\
    Resources\nFull lists of all:\n- fftp.linux.com/pub/list/issue/15990.txt, the\
    \ dial code for the time-zone conference menu is 19101.txt, the dial plan for\
    \ an extension that is time-zone-aware is 19902.txt, and the AGI script for time-zone\
    \ geolocation lookup is 91903.txt.\n- MaxMind GeoCity Database (Download Only):\
