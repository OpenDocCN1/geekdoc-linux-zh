  mdcn: "\n\n## Mixins (混合)\n\nMixin 就像是将模板代码剪粘贴到类中；它不会创建自己的作用域。\n\n```cpp\n{\n  to\
    \ = from;\n}\n\nvoid main() {\n  int from = 7;\n  int to;\n  TCopy(int!).copy(from,\
    \ to);\n}\n```\n\n模板声明可以设置别名：\n\n```cpp\nalias TFoo<int> temp;\n```\n\n模板可以针对不同的类型进行特化，编译器会推导出你所指的类型：\n\
    \n```cpp\ntemplate TFoo<T> { ... } // #1\ntemplate TFoo<T[]> { ... } // #2\ntemplate\
    \ TFoo<char> { ... } // #3\ntemplate TFoo<T U> { ... } // #4\nalias TFoo<int>\
    \ foo;\nalias TFoo<double> foo;\n// 当 T 为 double\nalias TFoo<char> foo; // #3\n\
    alias TFoo<char, int> foo;\n// 当 T 为 unsigned\nalias TFoo<char, int, int> foo;\
    \ // #4\n```\n\n```cpp\ntemplate TFoo() {\n  t i1;\n}\n```\n\n```cpp\nclass test\
    \ {\n  mixin TFoo(int!) {\n    this() {\n      int i = 5;\n    }\n  }\n}\n```\n\
    \n```cpp\nvoid main() {\n  Test t = new Test;\n  writein(t.i);\n}\n```\n\n## 结论\n\
    \nD 是一种极具前景的语言，支持编程社区的许多不同需求。数组、语法和类型推断等特征使得 D 在这些方面可以与 Ruby 和 Python 等语言组合，同时通过内联汇编器和其他特性为低级系统留了敞门。D\
    \ 可以应用于许多范式——无论是带有类和接口的面向对象编程、带有模板的泛型编程，或其他任何形式。垃圾回收减轻了手动管理内存块的需求，同时在偏好手动管理时仍然可以实现。\n\
    \n它引入了命令式语言的特性，带有惰性存储类，极大地提高了效率。该语言相对简单，偶尔会添加特性或进行更改。\n\n简而言之，D 是一门已好实战开发的语言。\n\
    \n## 函数模板\n\n如果一个模板只有一个成员函数且没有其他内容，可以像这样声明：\n\n```cpp\nvoid TFoo(T I) {\n}\n```\n\
    \n## 隐式模板实例化\n\n函数模板可以隐式实例化，并推导出参数的类型：\n\n```cpp\nTFoo(int, char) (2,\"foo\");\n\
    TFoo(2,\"foo\");\n```\n\n## 类模板\n\n在需要声明一个模板且其唯一成员是一个类的情况下，请使用以下语法：\n\n```cpp\n\
    class MyTemplateClass(T) {\n}\n```\n\n## 资源\n\n- D 规范与参考编译器：www.digitalmars.com/d\n\
    - GDC: dgcc.net\n- 众多开源项目和教程：www.dsource.org\n\n## 与魔鬼交易（应对之道）\n\n### 谁在赞美那些从阿尔·卡波恩（Al\
    \ Capone）那里发财的人？\n\n微软是 Linux 的敌人，也是任何人的敌人。有不同意见的人需要读读史夫·鲍尔（Steve Ballmer）的声明，每个人都欠微软钱。但情况比这糟。微软是一家由权力狂经营的公司，控制并主导着公司进入的每一个市场。每当微软做一笔交易，其最终目标都是边缘化竞争——而不是摧毁所有竞争（以防冒两皆失的风险），而是边缘化到足够程度，以防止其成为对其市场的威胁。\n\
    \n我以前将微软和阿尔·卡波恩做过比较。上一次我这样做时，我引用了电影《不可触摸者》作为处理微软的方法。马龙（萧·康纳利 饰）说明了如何对付卡波恩：他拔出刀，用芝加哥的方式，然后把其中一个送进了停尸房！这就是对付卡波恩的方法。现在，你想这样做吗？\n\
    \n对于微软看似对任何人都有利的交易，微软会在其中发现一个别有用动机——也许当你感觉到 Windows 慈善交易的背层逻辑时，你会发现那个插入报价的内部机制，除非对方是\
    \ Linux。\n\n上一次在专栏中出现时，马克·阿斯特朗（Mark Armstrong）写信告诉他，他敲击浴室镜子来提醒自己如何处理“微软”——我没有任何好的建议，也没有希望！我希望这给了了网景（Netscape）去做那事的勇气。\n\
    \n### 尼克·佩利（Nick Petley），总编辑\n\n那些不学习历史的人注定会重蹈。微软没有从历史中吸取教训，在与微软交易后注定会重演。\n\n\
    有些人支持微软/诺瓦（Novell）的交易是因为微软要进入 PROSE，而 Newell 想在短期内赚钱。但阿尔·卡波恩的时间到了，我们是从卡波恩那里获得了财富吗？还是我们想要像《不可触摸者》那样的英雄，他们不愿意与魔鬼交易？\n\
    \n在我继续之前，我想说我不是他们之一。我觉得 Linux 倡导者中的宗教色彩较少。我不认为来自可靠来源的优质专有软件有什么问题。我认为，只有当微软表现像一个控制性的垄断者，不符合客户最佳利益时，问题所在；我反复认为\
    \ IBM 长期依赖垄断性的经营行为。我不是 IBM 的粉丝。但我的批评并不是针对微软。如果微软能改变它的经营方式，就像 IBM 那样，我将乐意赞美。微软尚未显示出其马基雅维权术的任何迹象……\n\
    \n历史是由血肉躯书写的。如果我觉得在每笔交易中听到“合作”有些不可幻的话。现在，[此处原文似乎不完整或乱码]\n\n"
