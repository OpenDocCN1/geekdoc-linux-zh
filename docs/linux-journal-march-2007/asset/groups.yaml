    让我们来看一些 SIP 电话，从一个名为 Ekika 的小程序开始。曾经，有一个名为 VideoMeeter 的程序。现在它被称为 Ekika，它是一个非常棒
    VoIP 程序，配合 SIP 电话和 H323 终端，它也是一个极好的免费电话应用程序以及一个出色的视频会议工具。它可以与 NetMeeting 工作。如果你有一个免费账户，就可以使用同步支持、通话历史、即时消息等许多功能。


    Ekika 可以在网站（Resources）上获取，你可以在那里找到许多流行的发行版本。Ekika 还有一set设置，你可以从中选择自己的 SIP 地址，这样设置好电话后就可以拨打你，或者在目录中找到你。然后，当第一次启动
    Ekika 时，会向你展示“首次配置向导”(1)。你可以通过注册你的 SIP 账户（如果你已经有一个）来继续。你可以在这里输入你的地址，或者点击链接设置一个。


    当你对提供的信息满意时，点击“下一步”继续，系统会要求你选择你正在使用的视频类型和速度。当你点击“下一步”跳过第一个屏幕时，你会看到一个面对屏幕的框，就在我之前提到的屏幕正中间。标记为“检测
    NAT 类型”的框，Ekika 和向导将确定你需要哪种路由协助。如果提示你正处于 NAT 防火墙后，你将获得启用 STUN 设置的机会。


    点击“下一步”。在接下来的几个屏幕中，向导将帮助配置你的声卡、麦克风和摄像头。通过配置向导，你将能够测试选择的设置，无论是音频还是视频。顺便说一下，Ekika
    还通过插件支持 FireWire 数字相机（比如你买来拍摄你新宝宝视频的那种）。如果你计划使用这些设备，请确保安装了 lavish-av-package。你随时可以通过点击
    Ekika 的菜单栏，选择“偏好”，然后在“视频设备”下查看配置不同的摄像头。更改右侧的视频插件（图 2），你的摄像头就会被检测。


    当然，如果你只是打算把 Ekika 当作 SIP 电话，你不需要摄像头（或任何类型的相机）。点击最后一个屏幕，Ekika 就会启动。你可以通过菜单向导或重启首次向导来选择软件包中的若干选项。


    要拨打 SIP 电话，在菜单栏下方的地址栏中输入 `sips:friendsaddress@ekika.net`——这确保了你朋友的 SIP 地址是一个注册过的
    Ekika 地址（图 3）。当有来电时，电脑上会弹出一个小窗口。如果你接受连接，双方就可以通信。


    注意图 3 中的按钮栏。你可以开启或关闭视频，还可以带出一个聊天窗口进行文本消息交换。事实上，Ekika 会显示你的消息和配置。如果你有摄像头且朋友在附近，别担心，他们仍然能看到你。当然，知道外面的某人可以看到功能丰富的内容可能会让人有些局促。


