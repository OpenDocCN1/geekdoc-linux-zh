    and thank you for that.


    # David MacDougall


    A few months ago, I had to say we break up--you had too much confidence and opinion-for
    me. I have to say that it turned out was lovely. I love you too, and regretted
    myself.


    # Forgiveness


    You did a dip in quality, and things have gotten better the last couple of months.
    More important, the fact is that you started from such high-quality base that
    when you dipped, there was the only Linux publication for me.


    # Struan Bamart


    > Point taken. if the source code is available, as it under GPL v2, then you can
