    # Tales of an Asterisk Addict


    I''ve been using Asterisk system for a year and a half. Now by reading this article,
    you get an idea of the configurations that can be built with Asterisk and how
    each function works, as well as the flexibility to handle calls in ways that were
    previously impossible with other calling systems. For those who don''t know what
    Asterisk is, it is a software program that can interface with Switched Telephone
    Network, PSTN, and other protocols.


    It was also not mine to have to get up who was calling. The Asterisk system was
    able to share call-ID with MyVoIP, which we called over our connection. Sharing
    call-ID as an up-to-my mail as well as my workstation was pretty simple. But when
    there was really nice incoming calls, I was usually able to hear who was calling
    without having to run over to a phone or call ID. It is quite rather not wanting
    to be bothered before it starts.


    I first started with Asterisk by searching the Web to find out how it worked!
    When I started using Asterisk, it turned out to be so easy. Once I got it installed,
    I was able to download software that I could use like a regular telephone, but
    I could call other users on my network. This was a fun, and now I am used to hearing
    my dad''s voice on the phone.


    turned out to be more difficult than I had expected. Because I still wanted to
    use Asterisk for call processing, I was able to enable several providers right
    away. Many providers don''t allow you to use Asterisk or support the use of Asterisk
    with their service. With something as simple as VoIP, and as important as my home
    phone, it worked. As I researched the requirements, I discovered that many providers
    won''t allow you to use the service for any calls, including telemarketing and
    charitable calls. These features require it, but if you find the right one, then
    the penalty for getting billed can be steep. At point, I went down to wholesale
    providers, but this came with the added bonus of being able to receive calls because
    the provider isn''t providing any call features to manage a voice-mail.


    As fast as this system to play, it wasn''t very easy, so I decided to add an interface
    card to the system that I could receive calls over our regular PSTN line. In this
