    # How to set up a powerful home PBX system with Trixbox and FreePBX.\n\n# Home\
    \ Box to Trixbox\n\nMichael George\n\nA little than two years ago, I built a home\
    \ phone system using Asterisk and analog interface cards. It has served us quite\
    \ well, but it is time for an upgrade. Since first constructing that system, great\
    \ strides have been taken in simplifying Asterisk configuration. Asterisk@Home\
    \ (now called Trixbox) is a system that makes it possible to implement a powerful\
    \ phone system for work or home using a Web-based GUI. I decided to use Trixbox\
    \ for my new phone system to see if it has the flexibility to achieve all the\
    \ features of my current system. This article discusses the installation and configuration\
    \ of my new home phone system.\n\nI have several goals for the new phone system.\
    \ The first goal is to be able to call from one part of the house to another.\
    \ Next, I want to minimize telemarketing calls and direct calls after 9 pm to\
    \ voice mail, rather than ringing the phones (unless the call is urgent). I work\
    \ at home much of the time, I want to use a VoIP extension to the office system.\n\
    \n![](img/25da851b464310ec6d84b814147617d9_57_0.png)\n\n# Assembling and Installing\
    \ the Phone System\n\nBefore configuring the phone system, you must assemble it\
    \ and install the software. Although Trixbox makes it easy, our process is here\
    \ so that those who want to try it for themselves know what to expect.\n\nThe\
    \ first things to consider are the hardware and software needs here. If you have\
    \ an old computer to use (a Pentium II 266MHz with 256MB of RAM and 6GB HDD),\
    \ you will also need an interface card for the phone. When I first built my system,\
    \ I got a Digium TDM218 (XFXS) and one compatible phone (FXO), which...\n\n##\
    \ Installing the Trixbox Software\n\nAfter downloading Trixbox (ISO), I installed\
    \ it onto a CD. After reboot, a browser window opened and directed me to the static\
    \ address. I then saw the Trixbox screen, which was shown in Figure 1. By then\
    \ selecting FreePBX, the FreePBX is very modularized, and all modules needed to\
    \ be installed and activated before I...\n\n![](img/25da851b464310ec6d84b814147617d9_58_0.png)\n\
    \nFigure 1. Trixbox Web Page and Running\n\n![](img/25da851b464310ec6d84b814147617d9_58_1.png)\n\
    \nFigure 2. Main Menu After Logging In\n\n![](img/25da851b464310ec6d84b814147617d9_58_2.png)\n\
    \n| Enabled Modules | Type | Status | Version |\n|---|---|---|---|\n| Asterisk\
    \ | module | Enabled | 1.10.0 |\n| Core | module | Enabled | 2.4.0 |\n| Call Routing\
    \ | module | Enabled | 2.4.0 |\n| PJSIP | module | Enabled | 2.4.0 |\n| CDR Report\
    \ | module | Enabled | 2.4.0 |\n| UCM | module | Enabled | 2.4.0 |\n| Voicemail\
    \ | module | Enabled | 2.4.0 |\n| Trunk | module | Enabled | 2.4.0 |\n\nFigure\
    \ 3. Module Setup in Trixbox\n"
