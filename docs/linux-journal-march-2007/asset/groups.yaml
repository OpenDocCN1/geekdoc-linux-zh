    \ <div class=\"dojo-Editor\">\n    编辑器位于此处\n  </div>\n</body>\n</html>\n```\n\n\
    在保存文档时，你只需要对它们进行操作，并且可以期望计算机可靠地保存你所做的。本月我们采用了一种更简单的方法，将我们的富编辑器包含在 HTML 表单提交中。遗憾的是，我们仍然不清楚如何实现这一点，因为\
    \ HTML 表单是由 `<input>` 和 `<textarea>` 标签组成的。Dojo 考虑到了这一点：我们通过类来定义一个小部件（widget）。通过这个标签，我们可以将\
    \ Dojo 编辑器附加到任何地方，而不仅仅是一个编辑 `div`。如果我们将其附加到作为块元素的 `<textarea>`，就像 `<dojo>` 一样——我们的文本编辑器将附加到\
    \ textarea 上，该 textarea 将提交到服务器。在其他情况下，我们将我们的 `<div>` 替换为：\n\n```html\n<textarea\
    \ name=\"text\" class=\"Dojo-Editor\">\n来自 Dojo 编辑器的问！\n</textarea>\n```\n\n列表\
    \ 2 显示了当其整合到简单的 HTML 表单中时的样子。当内容发送到服务器时，所有的格式都将使用 HTML 标签保留。你的应用程序需要解析 HTML 以理解文本中可能出现的任何格式。\n\
    \n当然，如果你的计划是解析输入并在 Web 浏览器中显示它，那么就不（太）麻烦了。你可以将输入点击到数据库，然后在任何你需要的地方渲染。如果你还没有检查过此小部件的安全性以确保它免受跨站脚本攻击，那么在简单地提交、记账和显示你的数据之前，你可能想要调查一下它。\n\
