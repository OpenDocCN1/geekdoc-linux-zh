    Let''s look at some SIP phones, starting with a little called Ekika. Once upon
    a time, there was a program called VideoMeeter. Now, it''s called Ekika, and it
    is a great VoIP program, which with SIP phones and H323 endpoints, is an excellent
    free telephone application as well a great video conferencing tool. It will work
    with NetMeeting. If you have a free account you can use features like simultaneous
    support, call history, instant messaging and a lot more.


    Ekika is available from the web site (Resources), where you''ll find a number
    of popular distributions. Ekika also has a set of settings from which you can
    choose your own SIP address so that set up phone you can call or look you up in
    the on-directory. Then, when starting Ekika for the first time, you are presented
    with the First Time Configuration Assistant (1). You may proceed by registering
    your SIP account (if you have already one). You can enter your address here, or
    click the link to set up one.


    When you are happy with the information you have provided, click the Forward to
    continue, and you will be asked to select the type and speed of video you are
    using. When you click Forward past this first screen, you''ll see a box to face
    with the face of the screen I mentioned earlier. The box labeled Detect NAT type,
    Ekika and the Assistant will determine what kind of routing assistance you need.
    If the prompt tells you that you are behind a NAT firewall, you''ll be given the
    opportunity to enable STUN setup.


    Click Forward. For the next few screens, the Assistant will help configure your
    sound card, microphone and Webcam. By using the Configuration Assistant, you will
    be able to test your chosen settings, whether they be audio or video. By the way,
    Ekika also provides support for FireWire digital cameras (like the one you bought
    to take videos of your new baby) through plugins. If you are planning to use these,
    make sure you install the lavish-av-package. You can always configure a different
    camera by clicking on Ekika''s menu bar, selecting Preferences, and then looking
    under Video Devices. Change the Video Plugin on the right (Figure 2) and your
    camera will be detected.


    Of course, you don''t need a Webcam (or kind of camera) if you just plan to use
    Ekika as a SIP phone. Click on the final screen, and Ekika fires up. You can choose
    several options with the package through the menu Assistant or restart the First
    Time Assistant.


