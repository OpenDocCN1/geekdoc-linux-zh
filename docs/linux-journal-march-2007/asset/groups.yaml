    # Ryan Woodman


    # Docbook XML and SSL


    David Lynch''s 2006 article looking at Docbook XML to double site sets was very
    helpful for me. For years, I have been working on my open-source projects in HTML,
    but I''ve seen the “light now” and now come use of Docbook and SSL. However, my
    deployment-approach is different from David''s. The main difference is the ability
    to convert XML to HTML--from the complications this brings--simply convert the
    Docbook XML to HTML off-site, then upload the output to my site. This high quality
    preserves the advantages of Docbook. I recommend it to writing software manuals
    or mens web sites, looking for a clean split between content and presentation.


    This is one thing everyone knows about patents. Patents are there to protect the
    public good; it is not the way you argue. It may look like that, as the the implementation
    and development of software may be patents, but ultimately, the best idea is to
    protect your invention.


