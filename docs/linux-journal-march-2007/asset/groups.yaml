    Adhesion, most users use RubyGems. If you read Linux Journal''s "Ruby 0.6 on issue
    and how you picked it up, you''ve likely built this into your. If not, not packages
    for any popular Linux distro besides. The Adhesion install process constitutes
    installing Ruby and RubyGems, then pulling Adhesion with a command.


    # Make Call Instructions


    When a call comes in on Asterisk managed by Adhesion, Asterisk acts as the kernel
    for the call. For the logic it should perform during the call, such as playing
    messages, connecting to someone or taking input, it establishes a TCP connection
    to a Ruby daemon and runs commands one at a time. Adhesion utilizes Asterisk''s
    FastAG for making calls from another IP address. In this way, RAM and CPU are
    no impact on the Asterisk box, and as important, Adhesion has already utilized
    the overhead for each call it comes in.


