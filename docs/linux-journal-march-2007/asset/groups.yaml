    对于 IP 语音（VoIP）的所有技术，你可能认为它在任何网络上都能运行，但遗憾的是事实并非如此。网络地址翻译（NAT）是网络中的常用做法，它与 VoIP\
    \ 的兼容性并不好。在您的 VoIP 设置中解决这个问题：本文侧重于 SIP 协议和 Asterisk VoIP 软件，但大多数其他策略也能解决问题和解决方案。\n\
    \nNAT 映射多个内部私有 IP 地址。当数据包离开网关时，源地址会被重写为新的外部地址。当返回的数据包到达时，网关会将目标地址替换为原始主机的地址，然后发送数据包。网关还可以为多个主机使用同一个外部地址。连接的源端口可能会更改，以确保网关能够唯一识别该连接，从而对返回包进行正确的替换。\n\
    \n最后这种情况也被称为端口地址翻译（PAT）或 IP 映射。它允许多个内部主机使用运营商分配的单一家庭 IP 地址。主机必须被隐藏，因为它们使用的是、无法在互联网上路由的私有地址（如\
    \ 192.168.1.1）。NAT 通过为外部连接提供主机正确的源地址来解决连接问题，从而允许响应产生。网关位于原始连接内部，以便构建 NAT 所需的翻译表项。\n\
    \nVoIP 和 NAT 的问题在于连接的两端都必须能够发起连接。考虑当 PhoneA 使用各自的 SIP 服务器 PBXA 和 PBXB  PhoneB\
    \ 时的简化事件序列：\n\n- PBXA 代表 PhoneA 向 PBXB 发送 SIP 邀请。在次邀请中，是 PhoneA 的 IP 地址。\n- PBXB\
    \ 邀请 PhoneB 加入对话，向另一端指定 PhoneA 的地址。\n- 如果 PhoneB 对应 PhoneA，PBXB 向 PBXA 确认并识别 PhoneB\
    \ 的 ID 地址。\n- PBXA 告诉 PhoneA 关于 PhoneB 的信息。\n- PhoneA 使用实时控制协议（RTP）向 PhoneB 发送音频。\n\
    - PhoneB 使用 RTP 向 PhoneA 发送音频。\n\n在现实中，如果一个 PBX 位于 NAT 网关之后，由于没有额外的网络设置，另一个 PBX\
    \ 将无法连接。如果一个或多个电话位于 NAT 网关之后，它们将无法正常发送音频。这会导致通话失败或音频丢失。Asterisk 在第 2 步和第 4 步请求帮助修复通话，关于重新邀请或原生桥接。步骤显示电话与其本地\
