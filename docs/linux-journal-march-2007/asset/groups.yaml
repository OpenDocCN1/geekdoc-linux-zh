    \ C 的 ABI 兼容性，允许你轻松使用所有的 C 语言库。D 的标准库包含了这两类函数的列表。\n\n# Hello World\n\n在 D 中，Hello\
    \ World 程序看起来如下：\n\n```d\nimport std.stdio; // 标准输入/输出模块\nint main(char[]) args\
