    ### Calling the World


    Calling out via Outside Routes is certainly useful. For ease of configuration
    for fixed dialed numbers, I configured the system so that all dialed numbers through
    the phone call direct out to the PSTN trunk, which is ZAP9.


    ZAP9 is a group containing all the ZAP channels that connect to the phone company,
    which is defined at installation. By the concept of a hunt group: the groups are
    called in sequence and the first one that is free directs it. The latter pattern
    matches any dialed number that begins with 9; the system strips off the 9, as
    indicated by the vertical bar (|), and sends the remainder of the digits to the
    trunk. It handles 911 separately from other numbers so I have to know or remember
    to prefix 911 with 9 to get out (9911). Because only one group for dialing out,
    the outbound routes would be easy to define.


    ### Incoming Calls


    The most complex part of the system is handling calls as defined. There are two
    parts to configuring incoming calls:

    - Audio messages to be played to the caller

    - Digital Receptionist (Interactive Voice Response - IVR)

    - Time determines which Digital Receptionist will handle the


    To keep the system simple, I used only two outgoing messages. The first, Night
    says: ''We are unavailable at this time, please press 1 to leave a message, or
    if there is another matter press 0 to ring the phones.'' The second, Weekly calls
    to ring the house (21); to ring the office (22); to ring all phones (20) or stay
    on the line.


    ![](img/25da851b464310ec6d84b814147617d9_64_0.png) Figure 22. Finish setting up
    ring-all defaults.

    ![](img/25da851b464310ec6d84b814147617d9_64_1.png) Figure 23. Set up voice-mail
    default.

    ![](img/25da851b464310ec6d84b814147617d9_64_2.png) Figure 24. Set up time conditions
    on how the Digital Receptionist works.

    ![](img/25da851b464310ec6d84b814147617d9_64_3.png) Figure 25. Time Condition for
    Weekdays

    ![](img/25da851b464310ec6d84b814147617d9_64_4.png) Figure 26. Inbound Route Configuration

    ![](img/25da851b464310ec6d84b814147617d9_64_5.png) Figure 27. Fax Handling for
    Inbound


    Recordings from the left-side menu and select Add Recording to get the first screen
    (Figure 18). It is possible to upload a WAV file directly. I used an extension
    to record into the system. After clicking, I saw the screen in Figure 19 with
    instructions for recording the message. After recording each message to satisfaction,
    I saved the recording.


    The Digital Receptionist is built with three menus. I defined each of these by
    selecting the Add IV link at the top of the right-side menu. The Digital Receptionist
    is quite straightforward once you know what each option does. The general section
    at the top allows for defining or changing the name of the IVR. Next, the extension
    has to enter an option, which option is used?


    - Enable Directory and Directory Context allow the caller to go to the automated
    system by entering #

    - Direct Dial means that the caller can directly extend any extension defined
    in Extensions;

    - Announcement is the audio message played to the caller before the options available.


    The general section shows where other callers can select them to other parts of
    the system. The option to not conform with any extension depends on the modules
    installed, and in the system, are most-explained. One of the possibilities is
    another IVR that allows for very powerful. With this understanding of Digital
    Receptionists, we can look at the context I defined. Extension is intended for
    the work/day (Figure 22). It allows direct dialing of any extension, which rings
    out Ring Groups, and if the caller does not (Figures 21 and 22), Ring-all is for
    everyone. Rather, all extension numbers are redirected to ring. The last IVR,
    Voicemail-aft, is for calls arriving after the children are in bed (Figure 23).
    One can enter 0 to ring the whole house or so to leave a voice-box.


    Next to define which Digital Receptionist handles calls by the time they are received.
    There are three conditions of time I want to define: normal, workday and evening.
    I defined the weekend and evening Time Condition (Figure 24) so that calls between
    7 am and 10 pm (22:00) go to the Ring-all IVR, and that time, calls are handled
    by Voicemail-dto. Then, create Condition to handle weekday times (Figure 25),
    which checks whether the time is during the work day, and if so, it passes the
    extension. If a call comes in Monday through Friday between 7:30 am and 5:00 pm
    (17:00), and it is not that time, the Weekend Time Condition controls it. Solicitors,
    the Privacy Manager can be activated, requiring callers with no caller ID to enter
    their number before proceeding through the system. I do not have caller-ID service,
    so I have that my phone identifies many solicitations we use beginning of this
    article when I changed the context for trunk. So now all calls coming from the
    office will ring my phone. If the call is between 7 am and 10 am of the day, the
    Ring-at-7 IVR handles it. Otherwise, the Voicemail-dto IVR takes control.


    ### Handling the VoIP Trunk


    The last thing to deal with is routing calls from external trunks. To route calls
    from trunk to my office, I need to modify the dial plan files, which are edited
    via the WebUI. I selected the remaining segment for incoming calls to decide what
    to do with calls they arrive in the inbox. I used Direct Route and manner caller
    ID correctly only one route (Figures 26 and 27) for all incoming calls, so the
    DID Number and CID fields belong, and the Default Route works for the calls to
    the initial condition. Administration, Config Edit, and extensions. Adding the
    lines in Listing 1 to From-trunk allows all internal extensions to connect to
    my VoIP trunk. Incoming calls that do not need to go through the PSTN line because
    they were already filtered by the PBX. So I also created the custom-from-work
    (Listing 2), which does nothing but ring my extension (ZAP/2) when a caller arrives.
    The Inbound Route also allows for faxing and setting a distinctive ringing on
    SIP phones (not for ZAP calls).


    ### Conclusion


    I now have a full-answering system that meets my goals. I am able to call from
    one part of the house to another by dialing an extension or ring group. The calls
    we pick up the line when we hear a phone ring, we have cut some spans of time.
    If no call comes, they are related to the direction to voice mailbox so I can
    still get there. I am able to make and receive calls from the PBX as though I
    were in the same building. All this and the only investment I had to make was
    the DM and my card. I have used here, and we used it for analog phones when we
    were here.


    So I do that too to promote much free communication and ease of use. There are
    still some features I would like the system, however. Most notably, I would like
    the phones to ring my home calls, and my intra-office calls from my incoming calls.
    For those topics in a future.


    #### Listing 1. How to Call a Trunk

    ```bash

    * Call the work trunk

    NoOp(Incoming Work trunk) - comment log file

    DID(ZAP/work) - dial extension "bat" on the trunk

    NoOp(After dial) - comment for the log file

    Hangup() : if we are here, hang up the line

    ```


    #### Listing 2. How to Direct Trunk to ZAP/2

    ```bash

    * custom-from-work receives the calls from the trunk

    and directs to ZAP/2

    * we don''t worry about VM because the work system

    will get it

    [custom-from-work]

    NoOp(${CONTEXT}) - (${EXTEN})

    prio:PRIORITY - cid(${CALLERID}) - Info

    Dial(ZAP/2) - ring indefinitely

    NoOp(${CONTEXT}) - (${EXTEN})

    prio:PRIORITY - after DIAL

    Hangup()

    ```


