    \n# COLUMNS\n专为 sites 提供的 LINUX。\n\n# 而且，网络远不仅仅是电子邮件、搜索和浏览。它正在成为文明不可或缺的骨干\n\n\
    对于感到威胁的垄断者对其进行建设，我们的联邦和州政府已确保限制了我们的经济增长，并降低了我们在全球市场上的竞争力。\n\n运营商是如何是如何瘫痪我们的互联网服务的？\n\
    \n互联网最初被设计为一个研究系统。当“上行”和“下行”速度相同时，那是我们在大学和大型公司内部找到的互联网连接类型。但电话和电缆公司提供给家庭和小企业的下行速度远高于上行速度。原因并不显而易见。我们大多数消耗的数据远多于产生的数据。当我们下载大文件、观看\
    \ YouTube 视频或在网络上观看视频直播时。运营商已经针对生产与消费之间的不对称性对其系统进行了优化。\n\n问题是，这些不对称性让每个消费者都处于劣势，并阻止了我们从所谓的“端口阻塞”中获益。这就是我们的电话公司阻止我们建立自己的\
    \ Web 服务器或运行自己的服务器的地方。再次，他们阻止我们电脑上某些所需的端口是有理由的。垃圾邮件、我们电脑上开放邮件服务器的优势。这些端口阻塞还阻止了所有类型的用途，包括各种小型业务的建立。\n\
    \n因此，网络本身，提供有助于小型和业务发展的服务，运营商可能会削弱这些核心电话和电缆业务。\n\n在电话和电缆业务中，还有一种情况，即让消费者支付更多费用。运营商会谈论提供更高水平的服务，但成本往往高到将业务赶走。这与我们在城市看到的“三位一体”系统不同吗？\n\
    \n是的。通过安装“传输”并让其他方（包括电话和电缆公司）使用，我们正在做两件事。第一，通过不进入实际上需要大量资金启动和维护的业务来节省资金；第二，我们正在收回网络作为简单的事业。在城市，我们需要道路、水务服务，我们同时也知道如何更好地支持业务。\n\
    \n将光纤缆带到家庭和业务的成本是多少？\n\n我们预计每个接入点高达 $2500——平显示电视（我们需要以及某些需求）。光纤缆本身是廉价的，但将其埋入地下或悬在电线杆上的成本更高。我们可以铺设电缆并让光纤到位，这使得网络变得容易得多。我们还需要一种鼓励本地业务和城市建立自己的社区光网络的环境，这些网络可以连接到我们的公共或私有骨干。我们希望在这一过程中实现盈利。\n\
    \n如果你不销售电话和电缆服务，你将如何支付安装光纤的费用？\n\n我们将以相同的方式处理——就像我们建设水务系统、电网和公共基础设施一样。我们还需要对此进行批判性思考，也要利用我们已有的基础设施。\n\
    \n这里的经济效益是什么？\n\n我们可以通过观察网络对我们的意义开始思考，在过去的几年里——并通过公民和业务使其倍增。本地基础设施的建设是政府利益吗？\n\
    \n不。这是一种解决双头垄的方法。我们正在做的不是竞争。我们想让包括我们在内的任何人都使用我们的新基础设施。通过建设基础设施——而不是与电缆和电话系统竞争——我们正在保护并确保他们的核心。\n\
    \n建设这些有什么缺点吗？\n\n不。它有一个正确的底部。\n\nDec Searle 是 Linux Journal 的高级编辑。他还是加州大学芭拉分分区的访问学者以及\
    \ Berkman 网络与社会中心的成员。\n\n40 | 2007年3月 | www.linuxjournal.com\n\n# SUPERMICRO\n\
    1U 双 DP 系统\n1U 高达 16 核 Xeon\n\nSuperServer 6015T-T/INF\n\n- 双 Intel® 四核/双核 CPU\n\
