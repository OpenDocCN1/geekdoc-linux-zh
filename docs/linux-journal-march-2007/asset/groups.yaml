    \n```d\nalias size_t;\ntypedef int; // 不能转换为 int\nalias someReallyLongFunctionName\
    \ func;\n```\n\n# 数组\n\n在 D 中，数组是一等类型。有三种数组：静态数组、动态数组和关联数组。数组的声明从左到右读取；`char[]`\
    \ 被解释为字符数组：\n\n```d\nint[]; // int 的动态数组\nint[2][4] matrix; // 一个 2x4 矩阵\n```\n\
    \n所有数组都有 `length`（长度）和 `size`（大小）属性。关联数组是其中\n\n# 模块\n\n```d\nimport std.stdio;\n\
    int main(char[]) args {\n    int[] numbers = {1, 2, 3, 4, 5, 6, 7};\n}\n```\n\n\
    动态和静态数组可以使用 `.` 操作符切片。起始参数包含包含，但结束参数不包含。因此，如果你从零切片到结尾，就会得到整个数组。\n\n此外 D 有三种类型的字符串：`char`\
    \ (UTF-8)、UTF-16 以及 `dchar` (UTF-32)，都带有标准库，让 D\n\n```d\nimport std.stdio;\nint\
    \ main(char[]) args {\n    int[] numbers = {1, 2, 3, 4, 5, 6, 7};\n}\n```\n\n\
