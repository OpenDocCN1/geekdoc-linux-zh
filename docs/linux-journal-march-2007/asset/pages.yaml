  md: "# FEATURE ASTERISK\n\nEurope/London_\\digits/at' Imp;\n\nNext, we ask you to\
    \ confirm the time you are creating. The Read operation gets one digit from the\
    \ day. AELS switch is handy for working with input, because it can be used to\
    \ set up a series of actions for a menu exit quite without the use of branching\
    \ statements. In this case, the switch statement offers the option of a one-hour\
    \ correction by entering the number 2 and an anniversary, 1 by correction by entering\
    \ the number. Any other default statement in AEL is due to the internal representation\
    \ of the control structures, you must use a fully qualified goto, including the\
    \ context, extension number and label. My internal extension context is from-internal,\
    \ so gets are prefixed with from-internal:*9\n\n```\nRead(INPUT,msg/tz-confirm-correct.1);\n\
    witch ($INPUT) {\n  case 1:\n    goto from-internal\\*89(expiry);\n  case 2:\n\
    \    goto from-internal\\*89(correction);\n  default:\n    Playback(msg/tz-1-or-2-please);\n\
    \    goto from-internal\\*89(exit);\n};\n```\n\nAt the correction level, there\
    \ is a second option. I expect that summer-time hours will be in common use, so\
    \ I decided to add or subtract an hour. The menu handles that type of one-hour\
    \ correction and the one-hour correction subroutine is available on the LI file\
    \ set. In both structure, both to the switch statement shown below.\n\nWhen I\
    \ arrive in foreign locations, I am quite tired, and my ability to do arithmetic\
    \ is substantially reduced from my capacity to function fully. Rather than a menu\
    \ to select a choice, the menu prompts for the local clock time and the time-zone\
    \ offset from London. The basic approach is to obtain the 24-hour time function\
    \ and compute the offset from the time entered by the user. There's a possibility\
    \ that the offset value will be too big or too small, so a small script corrects\
    \ it for:\n\n```\ngetweek\nRead(INPUT,msg/tz-24-hour-prompt.4);\nSet($REMOTE_OFFSET,$($INPUT)-($LEN($INPUT))));\n\
    Set($REFERENCE,$STFTIME($EPOCH));\nEurope/London;\nSet($TZ_OFFSET,$($REMOTE_OFFSET)+($REFERENCE));\n\
    // correct for too big or too small\nif ($TZ_OFFSET) > 12) {\n  Set($TZ_OFFSET,$($TZ_OFFSET)-24);\n\
    }\nif ($TZ_OFFSET) < -12) {\n```\n\n```\n:\nSet($TZ_OFFSET,$($TZ_OFFSET)+24);\n\
    Return;\nWhen the user confirms the time offset, the changes are saved in the\
    \ Asterisk database with the DB function. Saving of changes is to ask the user\
    \ how long the offset should be saved. The code prompts for the number of days,\
