    Although there is debate over how the GPL is applied to hardware, the key ideas
    are similar to open-source software—the designs are free as in sharing, and a
    community exists that is working together on extending and enhancing the designs.
    Intellectual property (IP) is shared for the mutual benefit of all.


    The community is organised around the Free Project, and consists of private hackers,
    researchers and companies sharing time and other resources to the project. A series
    of hardware designs are being developed, for example, analog and digital design
    hardware, and DSP manufactured boards. Significant software development is also
    occurring, for example, open cancellation software and drivers for the hardware.


    The products produced are high-quality, professionally designed telephony hardware,
    freely available for all. Hardware development is a little different from software—design
    cycles are much longer (for example, a bug might mean a new board needs to be
    manufactured), and of course, it costs more to make a "copy" of hardware design.
    The benefits of open hardware are similar to software:


    +   Peer review is wonderful to trap bugs early, leading to big savings in development
    time.


    +   Re-open designs enables innovative products to be developed quickly and with
    very small number of bucks.


    +   Discussion and comments bring everyone from over the world to lead a much
    higher-quality product than a product developed by one company in its office


    +   Using open hardware, an individual or small company can build significantly-dedicated
    telephony products without needing large company resources.


    +   The part I like best—get to work with a community of talented hardware and
    software peers! Some of the best minds seem out there to naturally navigate open
    projects.


    Business models are being developed that function within the open-hardware environment.
    For example one sponsoring our efforts has a service model based around low-cost
    telephony hardware—maintenance of open hardware is not a critical part of business
    plan.


    # A Really Open Hardware/Software Project


    This PCB runs open-source software (Asterisk), on an open-source operating system
    (uClinux). The development system, drivers and applications are built using GNU
    gcc toolchain.


    The hardware designs are open and designed using open source software. Schematics
    were generated using gicm, and the PCBs were developed using a program called
    PCB—both in design and implementation of open operating systems.


    Verilog was used to implement programmable logic on the motherboard. Verling is
    a language used to describe logic in circuits. The Verilog code was developed
    with Icarus Verilog, also part of the geda package.


