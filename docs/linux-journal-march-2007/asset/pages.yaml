  md: '# STEP 3

    LETING CALLERS

    KNOW THE TIME


    At this point, Asterisk needs to restrict calls based on the time of day. The
    Asterisk dial plan can be used to check the time at the remote site, if it is
    before, 8 am or after 10 pm, the phone plays the caller


    Asterisk needs to pick the phone and compare the current local time to be 8 am
    to 10 window. STRTIME function converts an epoch into time of day. By adjusting
    the current epoch with the offset value, the STRTIME function returns a time of
    day. A call that is too early or late jumps to calls to silence the ringer. When
