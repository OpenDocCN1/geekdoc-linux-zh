  md: '# # Assembling and Installing

    The Phone System


    Before configuring the phone system, you must assemble it and install the software.
    Although Trixbox makes it easy, our process is here so that those who want to
    try it for themselves know what to expect.


    The first things to consider are the hardware and software needs here. If you
    have an old computer to use (a Pentium II 266MHz with 256MB of RAM and 6GB HDD),
    you will also need an interface card for the phone. When I first built my system,
    I got a Digium TDM218 (XFXS) and one compatible phone (FXO), which cost me around
    $350 US. Purchasing from Digium helps support Asterisk, because it is our primary
    requirement for the system software, Trixbox which can be downloaded from Trixbox.org


    The Digium card with ports 1-3 for the phone and port 4 for the extension. Because
    managing phone interfaces has real-time, it is best to keep the Digium on its
    own interrupt, especially in older machines like mine. Isolating the card on its
    own interrupt is tricky—disabling unnecessary devices in the BIOS will do the
    trick. It is not because of the high interrupt rate of these interface cards,
    one should not run other devices or applications with high priority, except X11.


