  md: '# Combine uClinx and Asterisk on a Card


    # Embedding Asterisk on a Digikey Blackfin STAMP card. DAVID ROWE


    This article describes how to build an embedded Asterisk-PBX with four analog
    (FXO or FXS) ports. Total part cost is about $500 US, which is competitive with
    PC/PCI-based Asterisk solutions. Embedded solutions have the advantage of small
    size, low power and no moving parts. Figure 1 is a photo of the PBX hardware in.
    The PBX is built around a Blackfin STAMP card, available off the shelf from Digikey
    for around $225 US. The Blackfin is a powerful DSP that runs uClinx. Sitting on
    top of the Blackfin STAMP card is a daughterboard, which contains interface hardware
    and the SD card socket. Into the daughterboard plugs FXO or FXS modules, for each
    port. In this example, there are two FXS modules on the left and two FXO modules
    on the right. The color of each LED indicates the type of module inserted.


    Here''s a brief review of telephone jargon:


    +   - FXO ports connect to analog تلیفون lines and the

    - FXS ports connect to analog telephone handsets.


    ![](img/25da851b464310ec6d84b814147617d9_79_0.png)


    Figure 2 is a block-diagram of the PBX hardware and software components. SIP phone
    or analog phones can be used for handsets (extensions), which are connected via
    a LAN to the PBX. External calls are routed over the internet or through the analog
    FXO ports. Internal calls between PBX ports are routed over the LAN.


    The PBX supports most of the features of Asterisk running on an ARM PC. As there
    is no hard disk, the SD card is used for voice-mail storage.


    # Why Port Asterisk to uClinx/Blackfin?


    I have a history of developing computing hardware and they are have always wanted
    to build a small embedded box that combines a core processor, DSP, line interface
    hardware and software. It''s an itch I need to scratch!


    There are some few things about the Blackfin processor chip:


    ![](img/25da851b464310ec6d84b814147617d9_79_1.png)


    | Daughter Board | BF531 STAMP Board |

    |---|---||

    | Analog Phones | FXS Modules | Drivers |

    | Phone Line Exchange | FXO Modules | Asterisk |

    | SIP Phones | Ethernet | Internet |


    Figure 2. Sample PBX Configuration


    +   3. The Blackfin chips are good for the value, running for $4.95 US each (BF531
    in 10k volume), which makes low-cost embedded telephone hardware a real possibility.
    This makes possible to build an IP PBX including analog or E1/E11 line interfaces
    far cheaper than comparable-PCI card solutions.


    +   4. Best of all is an Open Source community that has developed hardware (the
    family of STAMP boards).


    # Open-Source Hardware


    The hardware designs for this project are open—thematics and PCB layouts are freely
    available to download, copy and modify. The hardware designs have been released
    under the GPL.


    78 | march 2007 www.linuxjournal.com'
