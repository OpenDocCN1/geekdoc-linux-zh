  md: '# VoIP with CommuniGate Pro


    How to set up the VoIP features in CommuniGate Pro with a Sipura 3000 and Polycom
    phone.


    DANIEL SADOWDSKI AND STEPHEN PRAT


    Setting up your CommuniGate Pro (CGP) VoIP phone system is as simple as just installing
    the program. VoIP functionality is part of the base product, so no special configuration
    or licensing is necessary. After you have downloaded and installed the platform,
    you simply need to start the CommuniGate Pro. To do this, refer to http://www.communigate.com/manual
    or a UNIX prompt on your server, type /etc/init.d/CommuniGate start.


    Once you have launched CommuniGate Pro, you will need to locate the randomly generated
    postmaster password for your account. The default location is /var/CommuniGate/Accounts/postmaster.macint/account.settings
    - select this file to obtain the random postmaster password.


    When you have found the postmaster password, open a Web browser and log in to
    your account to connect to the CommuniGate Pro Web Administration Interface at
    either of these locations (where mail.example.com is the name of your CGP server
    in DNS): http://mail.example.com:8080 or http://mail.example.com:9010.


    The next step is to set up your CGP server. To do this, in the window, CommuniGate
    Pro will ask you to authenticate—do so with the postmaster password, which you
    found in account settings. Select Domains, sub-tab. Select the domain name corresponding
    to the domain where the user will be added. Click the button Create Account (Figure
    1). Enter the login name in the user field to the right of the button. Now, click
    Create.


    aliases for an account. Finally, click the Update button located near the Aliases
    field. The new user has been provisioned and has access to all services, by default,
    including VoIP.


    Repeat the provisioning process for additional users by clicking the Accounts
    tab near the top of the tabs. Enter the login for the next user and so on.


    Now that users are provisioned on the CGP server, the next step is to install
    and configure a device or service known as a VoIP-to-PSTN gateway. The function
    of this gateway is to route calls and media through the gateway and convert signaling
    from IP to PSTN and back.


    PSTN gateway devices supported by CommuniGate Pro include AudioCodes Routers with
    SIP module, Mediatrix, VegaStream and Alisa. Also, we support VoiceIP, Voexo,
    and Tamo.


    Suppose, if you elect to purchase the Sipura 3000. This device provides decent
    quality, and supports three types of:


    +   1. An analog (RJ-11) line from your phone (such as SBC).

    2. A Ethernet connection (RJ-45).

    3. A second analog (RJ-11) for connecting a standard telephone.


    Note: if you''re using a SIP device as those listed above, you will need to pay
    for a PSTN line to connect. The smaller devices (such as Sipura and Mediatrix)
    can use RJ-11 lines as input. The larger devices typically require a T1 PRI for
    their service.


    To configure the Sipura 3000 with CGP, follow these steps:


    +   1. Plug in the SIP-power-over analog line (to your wall socket) and Ethernet
    (to the LAN).

    2. By default, the device will get a DHCP address on your network and start its
    administration interface (accessible via a Web browser).

    3. Connect to the administration interface http://IP_Address.of_server. The login
    is required, and there is no default password (it should accept a blank password).


    The Sipura 3000 uses an administration interface similar to CGP. The Info tab
    displays the configuration. The system tab (Figure 2) should be configured for
    a hostname and any other information you need to provide (DHCP, DNS, DNS and so
    on).


    If you are just using the PSTN and Ethernet ports, then other configuration changes
    need to be set on the PSTN line interface. This changes includes the following
    for a very simple setup:


    ![](img/25da851b464310ec6d84b814147617d9_83_0.png)


    Figure 1. Create the account.


