    discussed among the MPD developers, but it has not been added yet. Another nice
    addition would be a tag editor that allows users to update the meta information
    stored in the audio.


    # Conclusion


    The Mini-ITX line of motherboards, coupled with Linux, provide a solid foundation
    for building all kinds of appliances like the one described in this article. It
    took me just short of a month to build and test the appliance. It was also fairly
    cheap for something so small. All the hardware for the appliance cost about $320
    US.


    # Acknowledgements


