  md: "# Breaking Numbers Down\n\nI read with interest \"Breaking Numbers Down\" [Dave\
    \ Taylor's Work The Shell, December 2006], having recently dealt with this problem\
    \ myself. I believe bc is generally overlooked, but very powerful. Utility's script\
    \ nicely illustrates the use of bc, and but unfortunately, it doesn't scale well\
    \ with the immense range of binary prefixes (en.wikipedia.org/wiki/binary_prefixes).\n\
    \nThe first, numeric-test is used to find the first non-zero (k)megajailfalt fails\
    \ with numbers larger than 2^31 (at least 3.0-8.2 running under kernel 2.6.24-25).\n\
    \nSecond, to find this with petabytes, exabytes, zettabytes and yottabytes, a\
    \ total of 16 calls must be employed, with attendant overhead out to the system\
    \ for each.\n\nAn alternative would be more efficient and avoids a number too\
    \ large for shell, follows:\n\n```\n# total letters\necho -n $1 | wc -c\n\n# numeric\
    \ lists\necho -n $1 | tr -cd '[0-9]' | wc -l\n\nif [ -z \"$1\" ] || [ $1 -ne 0\
    \ ]; then\n  echo \"bc <integer\"\n  echo\n  if 0 <= integer (2^100)-1 ]; then\n\
    fi\n```\n\n```\n# echo \"$prefix\" | cut -c $order\n\nif [ $nn -gt 3 ];\nthen\
    \ scale=3\nelse scale=0\nfi\nvalue=scale=$scale; $1($order)\n```\n\n```\nbc -1\n\
    echo \"$valueletter\"\n```\n\nThis version contains two calls to bc and one to\
    \ the cut. The calls to bc metric report: the following\n\n```\n# what is the\
    \ closest power of 1024\necho (1/1024)=9.765625e-4388590417\necho scale=0 | 1\n\
    echo $((6/9.765625e-438859954390417) | bc -1)\n```\n\ndetermines the closest power\
    \ of 2^10 by the fact that dividing a logarithm of n is the same as taking the\
    \ n of one-based. The offset by the fact that cut is loading bc's math by using\
    \ bc.\n\n```\nvalue=scale=$scale :\n$1/(1024^($order-1)) | bc -1\n```\n\n1024\
    \ divides the correct order and scales to as appropriate number of decimal places.\n\
    \nAveraging the time for both scripts on 400 binary numbers, I find that logarithm-based\
    \ script is a little more than three times faster. On the other hand, larger numbers\
    \ several hundred gateways are of none; the original script is\n\n```\n# what\
