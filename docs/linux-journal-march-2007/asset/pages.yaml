  md: '# # EXPOSE VOIP PROBLEMS USING

    Wreshark


    Sniff out VoIP

    problems with Wireshark.

    SEAN WALBERG


    VENDORS WOULD HAVE YOU BELIEVE you need to spend thousands of dollars on protocol
    analyzer software to troubleshoot Voice over IP (VoIP) networks. After all, voice
    quality suffers if packets are late, missing or out of order. Fortunately, Wireshark
    is an open-source package that can do everything these tools can and more.


    Wreshark, formerly known as Ethereal, is a network protocol analyzer. Its job
    is to listen to network traffic, display it in a format that makes sense and help
    you find problems. VoIP involves a complex set of protocols that Wireshark can
    decode and relate to each other. For example, the procedure to set up a call involves
    a different protocol than the voice traffic itself. Wireshark uses the information
    from the call setup to better understand the voice flow. With this data in your
    hands, you can isolate the cause of VoIP problems.'
