    # An open-source angle on mini-Net infrastructure build-out.


    We want something that works for everybody; a infrastructural tide lifts all boats
    like Linux, and still does.


    Though Moore''s Law drives up power, network speeds lagging. I moved to Santa
    Barbara in 2001 that Internet connectivity was much better than here in Silicon
    Valley, where for the preceding 16 years. Six years later, my connections in Santa
    Barbara are barely better, and the city appears to be growing faster than Cox,
    our local cable/telco duopoly. Although Verizon is home to dozens of communities
    around the country, Santa Barbara isn''t one of them. And Cox is also rolling
    out higher-speed servers, making Cox''s antenna ahead of any other.


    work my way to local Net infrastructure that favors everybody, and not just de-jumbent
    carriers.


    So here goes.


    > Why does-your town or region here- need fiber-optic infrastructure?


    For this reason it needs roads, water, waste management and electricity. The Internet
    is a fifth utility, no less than those other five. Fiber-optic cabling is the
    best form of ''pipe'' for carrying copper or any form of fiber. It is also the
    most ''green'' and has enormous capacity. One fiber optic can carry thousands—millions—of
    times more data than any other form of connection.


    > Why do we need wireless infrastructure instead of fiber?


    Even wireless needs a backbone. We think it''s bringing the best connections to
    everybody. We can add lots of wireless service on top of fiber. Existing options
    for wired builds require backbones. We want to be able to make the maximum possible
    use of fiber-optic connections to homes, businesses, libraries, government offices
    and other fixed locations—or as closely as possible. After that we can add all
    the wireless or wired we want.


    And, we''re not alone. The same kind of history is happening in communities across
    the US. Why are hundreds of communities doing what Linux and open-source developers
    have done—taking into their own hands, developing for themselves and groups that
    businesses and industries can''t or won''t roll own infrastructure?


    That''s why I''ve been trying in a local effort to build infrastructure that the
    local market hasn''t provided. This has involved lots of meetings and discussions—not
    only ours, but with local deans, civic leaders, representatives, infrastructure
    (fiber, wireless) developers and others—building something that works for everybody,
    a new infrastructure that lifts all boats—like Linux, and still does.


    This is why emphasis is more on fiber than we need. We want maximum capacity for
    the largest number of people and locations—as we might be doing if the change
    were building roads or railways.


    It''s still early, and we''re pioneering here, with many other communities. To
    help get useful thinking at this pioneering stage, I''ve put together a draft
    plan for anyone who wants the benefit of the same thing. Because of this being
    informed by, and by model, the successful experiences of Linux and the Open Source
    Movement, I''d share my draft frame here.


    But keep in mind that this is just one point of view, and I''m in hope that it
    works for you and in order to to help other folks in towns who are trying to do
    the same kind of thing. I also think it is fair that the readers of Linux will
    help me and others with this


