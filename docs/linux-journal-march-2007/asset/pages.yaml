  md: '# # Linux the Negus Way.


    The Results:

    First, create a locked file:


    ```

    $ filelock /tmp/exclusive.lck

    $ ls -l /tmp/exclusive.lck

    -r--r--r-- 1 taylor wheel 1 Mar 21 15:35

    ~/tmp/exclusive.lck

    ```


    The second time you attempt to lock the file, filelock tries the denied number
    of times (ten) and then fails, as follows:


    ```

    $ filelock /tmp/exclusive.lck

    filelock : Failed: Couldn''t create lockfile in time

    ```


    When the first process is done with the file, you can release the lock:


    ```

    $ filelock -u /tmp/exclusive.lck

    ```


    To see how filelock script works with two terminals, run the command in one window
    while the other window spins to establish its own exclusive lock.


    Hacking the Script:

    Because this script relies on a lockfile as proof that a lock is still enforced,
    it would be useful to add an additional parameter to say, the length of time for
    which a lock should be. If the lock times out, the last access time of the lock
    is recorded, and if the lock is older than the value of this parameter, it can
    safely be cleared. A stray, with a warning message, perhaps helps.

    This is unlikely to affect you, but filelock doesn''t work with NFS-mounted disks.
    It is quite complex. A better strategy that sidesteps the entire problem is to
    keep locks only on local disks.

