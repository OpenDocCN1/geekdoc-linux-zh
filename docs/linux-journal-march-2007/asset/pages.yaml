    \ the latest Kpilot, and install yourself. I downloaded it without any help.\n\
    \nYou must have the KDE development libraries to compile Kpilot, so you will need\
    \ to install kde-dev at the very least. You also need to install pilot-link separately\
    \ in Ubuntu. You need to install the latest version of pilot-link as well, and\
