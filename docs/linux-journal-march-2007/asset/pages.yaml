    your daylight hours.


    # 17 19


    Last year, I took a trip to Asia. To stay in touch, I carried a

    GSM world phone, capable of receiving telephone calls in

    the countries I was visiting. The capability to receive calls

    with the same mobile number I use at home while traveling

    around the world seemed incredibly cool--at least until the

    first call came in! Which cuts both ways. A colleague had decided to call me in

    middle of the day on a Friday, which had awakened me very

    early on Saturday, because the phone "hid" my faraway

    location from him.


    After returning home, I asked people why my phone

    company could not simply play a message to callers when

    my time zone changes by more than four or five hours, leaving

    them think it might be impossible to come up with a technical reason, but it all
    was expected that I used

    mobile phone to which I subscribed charged

    dollar per minute to connect calls. As part of the process of

    att a GSM phone to a network, the home needs to

    learn where the phone is, and that information conceivably


    could include a time zone.


    I returned to my idea I started using Asterisk, because

    it provides an extensive toolkit for designing PBX-hosted

    services. Anything that can be coded in a computer can

    come an Asterisk service After I understood the basics of

    Asterisk I sat down to implement a feature that kept

    the time of day where I visited and prevented calls from

    coming in inconvenient times.

    The two major parts are the offset from the time in London. (My code implements
    offsets only

    whole hours, though it could be extended to use either half or

    quarter hours). When a device connects to Asterisk, its IP

    address maps to the location and the offset is set.

    After the offset is programmed into the system, incoming calls

    are then checked against the time at the remote location: Before

    tphone is allowed to ring, the time at the remote location is

    checked, and callers are warned if they are trying to complete

    all at an inconvenient time.


    # MATHEW GAST


