    ```\n\n```\ncd /local/src\nsn sv ~/annons.kde.org/kde/branches/KDE/\n- ~/dev/kpilot\n\
    cd kpilot\n./configure --prefix=usr --with-pilot-link=usr\n/local/src/pilot-link-0.12.1\n\
    make -f Makefile.cmake\nmake -f Makefile.cmake install\n```\n\nIf you already\
