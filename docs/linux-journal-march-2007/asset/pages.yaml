  md: "# FEATURE: ASTERISK\n\nSTEP 1 ESTIMATING THE TIME ZONE\nAsterisk does not have\
    \ a build-in method to estimate the time zone from an IP address, but it does\
    \ have the best thing—the Asterisk Gateway Interface (AGI). AGI programming allows\
    \ an Asterisk extension to pass data to an external program, deprogram and return\
    \ results as Asterisk channels.\n\nI began the project with an AGI script that\
    \ would take an IP address and return an estimated time zone. Since several geolocation\
    \ databases map IP addresses into geographic information, my project had to retrieve\
    \ the time zone directly from the database, so I estimated the time zone by longitude.\
    \ (The earth has 24 time zones, each of approximately 15 degrees of longitude).\
    \ I used a free-for-commercial version of the comprehensive GeoCity database.\n\
    \nGeoCity APIs available in several programming languages. I used Perl, because\
    \ there is also an AGI library for Perl that makes AGI scripts easier. As input,\
    \ the program takes an IP address and returns the conversion of the time zone\
    \ as an offset of the number of hours from the time in London, which leads to\
    \ some differences in daylight time handling.\n\nThe start of the program pulls\
    \ in utility functions, which handles the parameters passed to the program by\
    \ Asterisk:\n\n```\n#!/usr/bin/perl -w\n# Asterisk AGI to estimate time zone from\
    \ IP address\n\nuse strict;\nuse Asterisk::AGI;\nuse Geo::IP::PurePerl;\nuse POSIX\
    \ qw(cell floor);\n\n# California is GRT = -8\n$HOME_OFFSET = -8;\n\n$agi = new\
    \ Asterisk::AGI;\n$input = $agi->read_Parse();\n```\n\n(The full listing of programs\
    \ from this article is available on the Linux FTP site; Resources) The argument\
    \ to the program is an IP address, which is given to us Asterisk. The first check\
    \ is to determine whether the IP address is on the local subnet of the Asterisk\
    \ server. Location databases do not include private address space and won't need\
    \ a lookup. MaxMind API can accept a domain as an argument, but we do not expect\
    \ to parse it:\n\n```\n$addr = \\$ARGV[0];\n\\$parts = split(/\\./, \\$addr);\n\
    if (\\$parts[0] == \"192\" || \\$parts[0] == \"168\" || \\$parts[0] == \"10\"\
    ) {\n  # Local IP addresses get the home offset\n  \\$agi->set_variable(\"TZ_OFFSET\"\
    , \\$HOME_OFFSET);\n}\n```\n\nThe use of this strategy is straightforward. We\
    \ create an object, loading the location of the database on, then call the get_city_as_hash\
    \ function in MaxMind API, which returns everything the IP address as a hash.\
    \ The item is the longitude component of the hash. If it's not one, we'll set\
    \ it -8 for California and let Asterisk deal with the result:\n\n```\n$gi = Geo::IP::PurePerl\
    \ -> new(\n  \"/usr/local/share/Geo/GeoCity.dat\",\n  GEO_STANDARD\n);\n\\$mycity\
    \ = \\$gi->get_city_record_as_hash(\\$addr);\n\nif (defined (\\$mycity->{'longitude'}))\
    \ {\n  # Guess at the time zone when longitude offset\n  \\$agi->set_variable(\"\
    TZ_OFFSET\", \\$offset);\n  exit 1;\n}\n```\n\nA bit of math is required to deal\
    \ with the fact that time zone boundaries may be 15 degrees, but zero is a minimum.\
    \ We use two formulas, depending on whether the longitude is positive or negative.\
    \ After computing the time zone, we pass it back to Asterisk in the TZ_OFFSET\
    \ channel variable, which is available for use in the plan:\n\n```\n$myLongitude\
    \ = \\$mycity->{'longitude'};\n\nif (\\$myLongitude > 0) {\n  \\$numerator = \\\
    $myLongitude+7.5;\n  \\$floor = floor(\\$numerator/\\$denominator);\n} else {\n\
    \  \\$numerator = \\$myLongitude-7.5;\n  \\$cell = ceil(\\$numerator/\\$denominator);\n\
    }\n\n\\$agi->set_variable(\"TZ_OFFSET\", \\$offset);\n```\n\n![](img/25da851b464310ec6d84b814147617d9_53_0.png)\n\
    \n52 | march 2007 www.linuxjournal.com"
