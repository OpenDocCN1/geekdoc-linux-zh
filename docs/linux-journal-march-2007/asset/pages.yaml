    \ have the capacity to generate passwords.\n\nNathan A. Good and Allan Kient\n\
    \n# Locking Files\n\nThis time covers features of Linux columnist Dave Taylor\
    \ and No Starch Press.\n\nAny script that reads or writes to a shared file, a\
    \ lock file, needs a reliable way to lock the file so that other instantiations\
    \ of the script don't conflict on the data. The idea is that a separate lock file\
    \ serves as a semaphore, and cannot be used. The scripting script waits until\
    \ the file can be freed up properly, deactivating by its lockfile.\n\nLockfiles\
    \ are tricky to work with, because many simple solutions fail to work properly.\
    \ For example, the following is a typical approach to solve this:\n\n```\nwhile\
    \ [ -f $lockfile ];\n  sleep 1\ndone\ntouch $lockfile\n```\n\nSeems like work,\
    \ doesn't it? If you unlock the lockfile doesn't exist, then you can ensure that\
    \ you unlock the lockfile, and safely modify the base file. If another script\
    \ uses the same lock file, it will wait until the lock is gone. However, in fact\
    \ work, although it seems that scripts are run without being swapped out while\
    \ other processes are theirs, they're actually not. Imagine what would happen\
    \ if the right one in the lock swaps you out, but before the touch, then the script\
    \ searches for the lock, find it and creates its own. Then, the script would swap\
    \ back and in a touch, with the result that the two scripts would both had exclusive\
    \ access, which is bad.\n\nFurthermore, Stephen von Ben Berg and Philip Gutierrez,\
    \ of the popular e-mail filtering program, include a lockfile that lets us safely\
    \ work reliably with lockfiles in shell scripts.\nMany distributions, including\
    \ Linux and Mac OS, have lockfile already installed. You can check whether your\
    \ system has lockfile installed. If you get a message, you're in luck! If not,\
    \ download the package from www.procmack.org, and install the lockfile command\
    \ on your system. The script in this section assumes you have the lockfile.\n\n\
    The Code:\n\n```\n#!/bin/sh\n```\n\n```\n# lock - A flexible file locking mechanism.\n\
    \nretries=\"10\"      # default number of retries\naction=\"lock\"     # default\
    \ action\nnulled=/tmp/bin/null # null count for lockfile\n\nwhile get opt in \"\
    l:-u\"; do\n  case $opt in\n    l ) action=\"lock\")\n    u ) action=\"unlock\"\
    )\n    r ) retries=\"$OPTARG\")\n  esac\nndone\n\nif [ $# -eq 0 ]; then\n  cat\
    \ << EOF >&2\nUsage: $0 [-l][-r X] lockfile\n-l reads the lockfile, -u creates\
    \ an\nunlock, -r X specifies a maximum number of retries\nbefore it fails (default=$retries)\n\
    EOF\n  exit 1\nfi\n```\n\n```\nif [ -z \"$lockfile\" | grep -v 'no' ]; then\n\
    \  echo '50: Error: 'lockfile' utility not\n  found in PATH.' >&2\n  exit 1\n\
    fi\n\nif [ \"$action\" = \"lock\" ]; then\n  if [ -f \"$lockfile\" ]; then\n \
    \   echo \"50: Error: $retries\" >/dev/null\n    Created lockfile in time $(date)\n\
    \  fi\n  touch \"$lockfile\"\n\nel [ \"$action\" = \"unlock\" ]; then\n  if [\
    \ -f \"$lockfile\" ]; then\n    echo \"50: Warning: lockfile $1 doesn't\nexist\
    \ to unlock\" >&2\n    exit 1\n  fi\n  rm -f \"$lockfile\"\nfi\n```\n\nRunning\
    \ the Script:\nThe lockfile isn't something that you've used by itself, so try\
    \ to test it by having two terminal windows open. To create a lock, specify the\
    \ name of the file you want to lock as an argument of lock. To remove it, add\
    \ the -u option.\n\n44 | march 2007 www.linuxjournal.com"
