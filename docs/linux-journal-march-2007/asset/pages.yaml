    # Organized Republic


    Your Ivaropion [January 2007] regarding the trade-offs between GPL versions 2
    and 3, reminded me of a wry remark that was worth repeating: “There’s no such
    thing as freedom—it’s just a question of how the freedom is organised!”


    For an example of how it’s done, download the HR-XSL Project (hr-xsl.sourceforge.net),
    and look in the doc directory.


    # Trevor Harmon


    # Ode to Joy


    John Hall is making some extreme arguments against patents [Beachhead, January
    2007] First and foremost, the argument should not be if we have better software
    patents. The argument should be on how software patents are implemented and maintained.


    # More Than Just Developers


    You claim that “the only people who are to having the software on rome are the
    tiny minority of hackers who want to run a modified version on the gadget [January
    2007] Ivaropion.” This is false. Hackers are not the majority whose goals are
    impeded by immutable embedded software. But where the software is created by hackers
    trendy then we know less about the software than how to link the device and make
    use of whatever features it provides. The “vast majority” of users are harmed
    by the effect of a “tiny minority” of developers who do not free the software
    that otherwise would have been impeded.


    Although it may take several years to come up with a completely new operating
    system, it may take someone only a few weeks or months. This does not mean that
    new operating system should be built and protected so that companies can earn
    it.


    You see, to invent something, the invention is ultimately invested in field or
    research. Sometimes the best ideas just appear out of nowhere. The idea might
    be easy or hard to implement, which matters more or less, but what matters in
