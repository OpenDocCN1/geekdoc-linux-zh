    # Multi-Category Security


    I''ve mentioned SELinux three security models (TE, RBAC and MLS). In Red Hat Enterprise
    5 line, there''s actually a fourth: Multi-Category Security (MCS).


    As you imagine, the complexity of hierarchical and non-hierarchical compartments
    makes MLS well suited to large organizations, such as military and intelligence
    agencies, but too complex for more general purposes. Red Hat has therefore implemented
    an alternative classification model in RHEL 5''s implementation of SELinux.


    MCS uses SELinux Range field, essentially by informing the classification field
