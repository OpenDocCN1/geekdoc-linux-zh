  md: '# # The D Programming Language


    # ## Familiarize yourself with the powerful and managed language D.


    **AMEER AMALI**


    During the past decades, programming languages have come a long way. From the
    dawn of UNIX and C, when compiled languages were just getting their start, today''s
    world is full of languages with sorts of goals and features. In this article,
    I discuss one language, D, a natively compiled, multadigm-C-like language. Its
    aim is to simplify development of any type of application—from kernels to games—by
    combining the performance and flexibility of C with the productivity-boosting
    factors of languages, such as Ruby and Python. It was originally conceived by
    Walter Bright, who made the first D reference compiler which is freely downloadable
    for both Windows and Linux, and that is licensed under both the GPL and Artistic
    License.


    D is a compiled language that uses the GC and destructors. The language includes
    lack of a garbage collector, a fast inline allocator and more. With all this,
    it still maintains ABI compatibility with C, allowing you to use all of your C
    libraries with ease. The D standard library includes lists of both functions.


    # Hello World


    In D, the Hello World program looks like this:


    ```

    import std.stdio; // standard i/o module

    int main(char[]) args

    ```


    ```

    writeln("Hello world!");

    return 0;

    ```


    writeln is D''s version of printf; it adds a newline character at the end. Garbage
    collection includes an automatic garbage collector, removing the programmer of
    the need to manage memory and allowing them to focus on the task at hand, instead
    of having to worry about the correctness of each memory chunk. Furthermore, it
    eliminates a whole of bugs dealing with pointers and invalid memory references.
    In times when the GC would allow some slowdown, there is also the option to turn
    it off altogether or use C''s malloc and free memory management.


    path separator. Each symbol in a module has two names: the name of the symbol
    and the name prefixed by the module name, which is called the fully qualified
    name or FQN. For example, writeln can be referred to as writeln or std::writeln.
    If you prefer the qualified name, you import the module''s symbols by putting
    them in the global namespace. For example, both the std.string and std.methods
    include functions for replace and split. Because I''m more likely to use pure
    string functions than regular expressions, I would statically import


    Modules have static constructors and destructors. If the static constructor is
    invoked before main(), after main has returned the status, ~this function is invoked
    when the imported module is destroyed. There are no header files. Everything is
    declared and once only, eliminating the need for declarations in place or declaring
    classes in two places to keep declarations clean.


    # alias and typedefed


    In D, there is a difference between alias and a type. A typedef introduces a new
    type to type-checking and function overloading, which are discussed below. An
    alias is a simple replacement for a type, or optionally:


    ```

    alias size_t;

    typed int; // can''t convert to int

    alias someReallyLongFunctionName func;

    ```


    # Arrays


    In D, arrays are first-class types in D. There are three types of arrays: static,
    dynamic and associative arrays. Array declarations read from left to right; char[]
    is interpreted as an array of characters:


    ```

    int[]; // dynamic array of int

    int[2][4] matrix; // a 2x4 matrix

    ```


    All arrays have length and size properties. Associative arrays are arrays where
    the index is something other than integers, possibly text strings, or arbitrary
    integers:


    ```

    import std.stdio;

    int main(char[]) args

    {

    ```


