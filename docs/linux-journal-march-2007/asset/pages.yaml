    One of the parts of Dojo to begin is its collection of widgets. From the time
    HTML was first standard, developers have wanted a wider set of widgets to choose
    from, in order to provide adapters that remain-style, as well as power-parallel
    widgets for applications. Dojo provides a number of widgets, making it possible
