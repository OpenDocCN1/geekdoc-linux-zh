  md: '# Line length


    There is a long tradition in programming that lines should contain no more than
    80 characters. Although it is not necessary to follow this practice, many programmers
    still do. The programs in this book generally have short lines, but it is easy
    to make longer lines when you start nesting lots of blocks. If you find yourself
    writing extremely long lines that force you to scroll sideways, consider breaking
    the line into pieces. A line such as this:


    ```

    if ($my_car_is_in_the_shop == 1 and $the_buses_are_not_running == 1) {

    can be re-written like this:

    if ($my_car_is_in_the_shop == 1 and

    $the_buses_are_not_running == 1) {

    ```


    As well as splitting the single line of code across two lines in our coding editor,
    we also make sure the variables are aligned with each other. Furthermore, we insert
    spaces after the first variable to line up the equality operators.


    # Variable and function names


    In general, variable names should be lower case. There are, of course, exceptions.
    Global variables should begin with upper-case characters and constants should
    be all capitals.


    ```

    my $local;

    my $Global;

    my $CONSTANT = 5; # pseudo-constant

    use constant PI => 3.1415926; # true constant

    ```


    Variables with small scopes should have small names. For example, using $i as
    a counter in a loop is not only okay, but it is preferred. Variables with larger
    scope should have longer, more descriptive names. When variables contain multiple
    words, there are two common conventions: underscores and CamelCase. We prefer
    underscores, but both styles are completely acceptable. Don''t mix them in the
    same program, however.


    ```

    my $long_variable_name; # underscore

    my $LongVariableName; # CamelCase

    ```


    Variable tend to be nouns. Function names tend to be verbs. Function names follow
    the same general rule as variables. Class names begin with a capital letter. Class
    methods are generally capitalized (except new). Instance methods and attributes
    are lowercase


    ```

    my $obj = new Something; # capital class name

    $obj->attribute; # lowercase

    $obj->method_name; # underscore

    $obj->methodName; # CamelCase with first letter underscore

    ```'
