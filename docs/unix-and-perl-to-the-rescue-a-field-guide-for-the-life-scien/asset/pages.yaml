    # 6.7 Adding command-line options


    The use of options is also optional


    Most of the Unix command-line programs you will use options that control how they
    behave. For example, the Unix ls command lists the current directory, but if you
    want to sort files by date, you can use ls -lt. Your Perl programs can easily
    have this same behavior. There are two built-in modules for processing command-line
    options, Getopt::Std and Getopt::Long. Using these modules'
