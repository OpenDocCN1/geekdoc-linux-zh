    You should have noted that Perl handles quoted and unquoted numbers in the same
    way, and all three variables ($x, $y, and $z) should print the value 3. Behind
    the scenes, Perl has two basic data types: numbers and strings. If we include
    the warnings pragma in a script, then we have learned that strings should be quoted,
    but this doesn''t apply to numbers.


    Perl is generally smart enough to know that we will use numbers as strings, and
    if you have created a string which only contains numbers, then Perl will treat
    it as a number instead. Actually, this is only true in situations where you are
    trying to use a string as a number. For example, in line 8 of the script, we use
    $x, $y, and $z to put their sum in a new variable $sum. When we print $sum we
    get the expected answer 9. However, internally noted that $x and $y are actually
    strings not (because of the quotes). They stay as strings until we try adding
    them together at which point Perl sensibly realizes you probably want to treat
    them as numbers instead of strings.


    If this sounds terribly confusing, don''t worry. The take-home message is that
    Perl will try to make sense of your numbers and strings for you. This is in contrast
    to most programming languages, where you cannot interchange numbers and strings
    like this. Remember that you don''t need to quote numbers when you first declare
    them.


