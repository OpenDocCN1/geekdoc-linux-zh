  md: '# Installing Unix and Perl


    # 2.1 What do I need in order to learn Unix and Perl?


    In addition to time, patience, and a beverage of your choice...

    This book is primarily intended to teach you how to program in Perl. But in order
    to do that we want to first learn some Unix skills. You will need access to a
    computer that is capable of running the Perl programming language and a Unix or
    Linux (OS). You will also need to use a code editor to write your Perl scripts.
    We''ll talk about what specific software to choose in the next chapter, but first
    let''s consider the bigger picture, including a brief overview of how Unix and
    linux differ and what matters.


    # What computers can run Perl?


    As a programming language, Perl is platform agnostic. You can write (and run)
    Perl scripts on just any modern computer.¹ We will assume that >99% of the people
    reading this use a PC (running Microsoft Windows and/or Linux), or an Apple Mac.
    A small proportion of you may be using some other of dedicated Unix platform,
    such as a Sun or SGI machine. None of this really matters too. All of the Perl
    examples that we demonstrate in this book should work on any machine that you
    can install Perl.


    # What computers can run Unix?


    While you can easily install Perl on most computers, the same is not quite true
    for Unix. We decided that this book should include an introduction to Unix because
    of silico biological research happens on Unix/Linux platforms. So it makes sense
    to learn how to run your Perl scripts within the context of an Unix OS. As mentioned
    in Chapter 1.1, all modern Mac computers use Unix. This means that if you own
    (or have access to) a Mac that runs OS X, then you don''t need to download or
    install anything in order to work through this book.³ If you don''t have access
    to a Mac and own a PC running Windows, then we suggest you add Linux to your machine
    (an overview of how to do this is provided in the next chapter).


    # Linux


    If you don''t have access to Unix, then hopefully you can install Linux. Linux
    is often called a Unix-like OS, though this claim may offend any Unix purists
    it is unusual in its core components are all based on free and open-source software.
    This doesn''t make it any less powerful or secure than other OSs, and you


    > ¹ If your definition of “modern” is running Windows 3.1 on a PC that features
    a 386DX processor, you might be pointed to discover that you will probably need
    to purchase a new computer.


    > ² For installing a code editor.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'might feel more comfortable knowing that the majority of web servers around
    the world run Linux. Because the underlying code used by all Linux systems is
    freely available, many companies have packaged together slightly different versions
    of the OS³ that can download for free. This very attractive price point, coupled
    with the fact that it is possible to run Linux having to install anything on your
    computer''s hard drive (see the next chapter) means that Linux is a great solution
    for PC owners wanting to work through this book.


    # Unix vs. Linux: part 1


    When we say that we want to teach you Unix, we are not talking about learning
    the entire OS⁴. We want to teach you about a few of the Unix commands that you
    will have to type into a program as a *terminal* (which we will explore in Chapter
    3.2). There are probably few thousand Unix commands, but we are only aiming to
    teach you 20 or so of the most essential ones. All of the commands we will teach
    you are also available on Linux. This means that all we need from a Unix or Linux
    OS is the ability to open a terminal program and run some Unix commands. All other
    differences between Unix and Linux are not important for this book.


    # Unix vs. Linux: part 2


    You do know that there is an exception to every rule, right? While we are confident
    in saying that there are no important differences between Unix and Linux, you
    should be aware that there are still differences, both between Unix and Linux
    and between versions of Unix/Linux. These differences can mean that some of the
    commands that you may produce slightly different output to what we show in this
    book. Sometimes this is because one OS might have a newer version of a Unix command
    compared to another OS.


    This means it would be impossible to write this book in a way that makes it fully
    compatible with all Unix and Linux variants, so we have written this book using
    Apple''s version of Unix⁵ We are 99.9% sure that every Unix command we mention
    will be available on whatever form of Unix or Linux you use, but bear in mind
    that the output of our examples might look different to yours.


    # Learning Perl without learning Unix?


    If you are using a Windows PC, then you might not want to install Linux and you
    just want to learn Perl. That''s fine, but bear in mind that our Perl examples
    are written from a Unix point-of-view, so we will show examples of how run Perl
    scripts from the perspective of a Unix system.


    ³ Such packages are known as distributions and usually contain a slightly different
    mix of software tools and sometimes a different GUI.


    ⁴ Otherwise you could argue that learning to use a Mac is a way of learning how
    to use Unix.


    ⁵ We have chosen Apple because we use Apple computers for our work (including
    Unix commands and writing Perl scripts).'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# 2.2 Installing Linux on a PC


    There are virtually a dozen solutions

    There are four ways you can install a Linux OS on your Windows PC:


    +   - Install Cygwin. This provides a Linux-like environment on your PC; it is
    free to download.

    - Run Linux from a CD-ROM or install on a bootable flash drive. This is a good
    solution for people who don''t want (or do not have permission) to modify the
    contents of their drive.

    - Install a full Linux distribution on your computer, either as a replacement
    for Windows or as a dual-boot option.

    - Run Linux using virtualization software. There are many software packages that
    will allow you to effectively install an OS inside another one.


    We will discuss each of these options in a little more detail, though it is beyond
    the scope of this book to provide more detailed installation instructions, not
    least because any we would quickly become out of date (the world of Linux moves
    very quickly). Bear in mind that the internet contains a lot of information about
    installing Linux on PCs.


    # Linux distributions


    If you didn''t already know, you should be aware that there are many different
    versions of Linux in existence. They differ in many respects, but the core functionality
    is very similar no which one you choose. The website www.livedist.com lists most
    of the popular variants are there and provide a good starting point for choosing
    a distribution. Distributions come and go in computing, and it is likely that
    this list will look very different in a few years'' time. One of the most popular-featured
    Linuxs out at the time of writing is Ubuntu (available at ubuntu.com). For the
    purposes of working through this book, any of the popular distributions will be
    fine, and if you want to install Linux on a CD-ROM or flash drive you might want
    to choose a distribution that requires less space (the relevant section).


    # Installing Cygwin


    It is important to note that Cygwin is not a true form of Unix or Linux. It is
    software that will result in having a terminal window through which you can use
    many Unix programs (including Perl). There are some differences between Cygwin
    and other types of Unix, which may mean that every example in this book will work
    exactly as described, but overall it should be sufficient for you to learn the
    basics of Unix. At the time of writing, Cygwin is free and is under active development.
    You can download it at www.cygwin.com.


    # Running from a CD-ROM or flash drive


    Storage capacities of USB flash drives continue to increase (and prices decrease),
    and means it is possible to store entire OSs on them. It is also possible to boot
    your computer'
  merge: -1
