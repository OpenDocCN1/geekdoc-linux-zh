    \ to only compare lines in the input files if these lines start with a certain\
    \ character. This modification requires just the subroutine, and not two different\
    \ loops. Example 7.4.5 is longer than Example 7.4.1, and it takes more initial\
    \ effort to program with abstraction. However, the reward is reaped many times\
    \ over the long run. As such, the code is more aesthetically pleasing.\n\nYou\
