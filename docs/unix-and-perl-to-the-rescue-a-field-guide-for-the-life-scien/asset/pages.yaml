    You can make many kinds of sorting function. These do not need to use the <=>
    cmp operators. As long as your function returns -1, 0, or +1, it will work with
    Perl''s change.


    # When to use subroutines?


    Subroutines should be used any time, perhaps even every time, you find yourself
    writing the same lines of code in multiple places. Even if repeated code is only
    a few lines long, there are benefits to be gained by placing it in a subroutine.
    Imagine you have ten lines of code that are reused in ten different places in
    your script. If you decide to update the functionality of that (or fix a bug),
    you would have to edit your script in ten different places. If you put the code
    in a subroutine, you would only have to make one change.


    Subroutines can help improve the readability of your code. Rather than see all
    of the details of how you calculate some mathematical function, it might be cleaner
    to keep that code in a subroutine, which keeps it hidden from the main body of
    the code.


    Once you develop your own useful functions using subroutines, you will find that
    you want to use them again and again. One way to reuse code is simply copy-and-paste
    your functions from one program to another. However, an better way is to place
    that subroutine in a function library. This will be explored in Chapter 6.2.'
