    before we could mention the @ARGV array, but expect to see @ARGV used a lot from
    this point onwards. Let''s see some examples of how you can use it in your scripts.


    # Example 4.16.1


    This script makes a simple calculator that uses the exponentiation operator to
    calculate X to the power of Y. You must specify both numbers as command-line arguments
    when you run the script.


    +   1. #!/usr/bin/perl

