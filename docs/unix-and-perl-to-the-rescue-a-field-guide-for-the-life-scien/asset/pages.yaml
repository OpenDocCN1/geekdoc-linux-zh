    # Where do modules live?


    Whatever OS you are using, there usually be one default location where Perl modules
    are installed. For example, on modern Mac computers, which are based on a Unix
    OS, this will be the following directory:

    /System/Library/Perl/5.10.0


    It is common to refer to a collection of modules as a “library” and it is therefore
    common to also name directories that contain modules “library” or “lib”. If you
    add new Perl modules (using the method above) they will be added to the default
    location. As mentioned previously, you might not have permission to add files
    to this directory. If you don''t have permission to install them in the default
    location, you should be able to add them to your home directory. You can do this
    (on Unix systems) by changing one of the installation steps above, namely:


    ```

    $ perl Makefile.PL PREFIX=/Users/nigel/lib

    ```


    This would work on a Unix system where /Users/nigel is a subdirectory to your
    home directory, and lib is a subdirectory you want to use for Perl modules (though
    you can name anything you want). Obviously, this would only work if the user “nigel”
    is the person installing the module.


    > ³ This will obviously different if you have a different version of Perl.'
