  md: '# Making a string by joining together elements in an array


    We have seen that if you try printing an array between double quotes, then Perl
    interprets the array and prints each element separated by a space. What if we
    want other than spaces? An easy way to do this in Perl is with the join() function;
    this allows you to create a string from an array and put whatever you want between
    the elements of the array. The syntax of the join() function is:


    ```

    join(''separator'', @array)

    ```


    The separator can be a single character or a longer string, or a variable that
    contains a string. The array name will be the thing you join to form a string.
    You could also write a list of items rather than an array, and you could even
    include a list of arrays:


    ```

    join(''separator'', @array_A, @array_B, @array_C)

    ```


    # Example 4.15.4


    Let''s say we want to create a CSV (comma-separated values) formatted string from
    an array of gene names from the nematode Caenorhabditis elegans.


    +   1. #/usr/bin/perl

    2. # array_to_string.pl

    3. use strict; use warnings;

    4.

    5. my @gene_names = qw(unc-10 cyc-1 act-1 let-7 dyf-2);

    6.

    7. my $joined_string = join(",", @gene_names);

    8. print "\$joined_string\n";


    # Understanding the script


    Line 7 uses the join() function to combine all the elements in the array that
    should be joined with a comma character.


    Note that the output of the join() function is assigned to a string. If we didn''t
    need to store the string in a new variable, we could have used the following:


    +   5. print join(",", @gene_names), "\n";


    Also note that the join() function does not affect the contents of the array that
    is being joined.


    # Making an array by splitting a string at delimiters


    The opposite behavior of join() is provided by the split() function. This divides
    a string into an array. But we have to tell it character or pattern to use in
    order to split the array.'
