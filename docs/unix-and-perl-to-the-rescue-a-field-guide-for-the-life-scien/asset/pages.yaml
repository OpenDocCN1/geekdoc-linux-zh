    output of ls. As we will see, Unix uses some of these hidden files for special
    reasons.


    # How to hide a file


    Hiding a file is very easy. Change the file’s name to include a dot character
    as the very first character.


    # Example 3.24.1


    Let’s try hiding the “aliases” file that we created in the last chapter.


    ```

    $ ls

