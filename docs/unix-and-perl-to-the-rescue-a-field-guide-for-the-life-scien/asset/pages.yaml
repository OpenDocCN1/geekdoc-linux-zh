  md: 'Other combinations of redirecting standard output and standard error are also
    possible,30 but it is perhaps more useful to let you know that you can effectively
    “turn off” standard error – sometimes you want to see a standard output on the
    screen but without it interrupted by error messages. The solution is to redirect
    error to a file on the filesystem the null device: /dev/null. This file is common
    to all Unix systems and as a “black hole” that essentially discards any data it
    receives and doesn''t produce any data you can read. It might sound a strange
    concept, but it''s useful for when you want to do things like this:


    ```

    $ cat villain 2> /dev/null

