  md: '# How are Unix editors different from word processors?


    The Unix text editors that we are talking about are those that run within the
    terminal window.⁷² These editors do not have any mouse control and all editing
    must therefore done using keyboard shortcuts. You will not be able to do such
    things as italicize text, add tables, or add images. Indeed, you will not be able
    to do any of the functions that you might be used to doing with a typical word-processor
    program. Instead, you will be able to create and edit text, though such editing
    may include a variety of tools and manipulations.


    You might be thinking that Unix editors sound primitive and limiting. That is
    not the case at all. They excel at doing what needs to be done when working with
    plain-text files, and some programs contain many complex features. The most common
    Unix editors are available on just any Unix machine you will use. This means that
    if you take some time to learn the subtleties of one (or more) of these programs,
    you will be set up for editing files for the foreseeable future.


    # Which Unix editor to use?


    We should proceed this section by warning that the subject of editor to use is
    a topic that inspires a vibrant debate within the Unix community. In fact, two
    of the most venerable Unix editors inspire an almost religious fervor among their
    followers.⁷³ One of the oldest editors is v1 and dates back to 1976. This is the
    editor that you can guarantee will be installed on all Unix systems. When you
    use v1, you are either in sometimes insert mode or normal mode. This distinction
    can be confusing to the newcomer and Vi has a steeper learning curve than others.
    Despite this, it remains one of the most popular and widely used editors.


    In 1991, an extended form of Vi was created vim (Vi Improved). Compared to vi,
    there are many enhancements in vim, and it offers a far higher degree of customization.
    By and large, the operation of vim is very compatible with v1, and it remains
    a popular editor for Unix users.


    After vi, the next most popular editor is Emacs (though the Unix command is just
    emacs in lower case) and vi was also developed in 1976. As in the Unix world,
    there are many different versions of Emacs, though the main functionality is common
    to all variants. The rivalry between vi and Emacs has less of a learning curve
    than Vi, and is very customizable. It is the rivalry that became a famous part
    of Unix culture.⁷⁴


    For the purposes of this book, we just want to get you up and running, using Unix
    as quickly as possible. Therefore we are not going to tell you more about vim,
    Emacs, though we suggest that you learning the basics of at least one of these
    editors. Instead, we are going to introduce you to a basic editor nano.


    ⁷² Though there are many Unix text editors that can run within a windowed environment
    and support mouse control.


    ⁷³ We are not kidding about this. When meeting other Unix users, you should be
    careful when discussing editor you use. If they discover that you use what they
    consider to be the wrong editor, you might find that they stop returning your
    phone calls.


    ⁷⁴ See Wikipedia''s page on "Editor War" for a good overview.'
  merge: -1
