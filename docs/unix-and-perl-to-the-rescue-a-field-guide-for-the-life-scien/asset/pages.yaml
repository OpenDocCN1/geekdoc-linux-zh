  md: '# 338 Programming topics


    we mentioned a perdoc command that can be used to view any documentation contained
    within a Perl script (see Chapter 7.6). This command can also help you in many
    other ways.


    You can look up a description for any Perl by simply providing the -f argument
    to the perdoc command and then adding a valid function name. Imagine you wanted
    to refresh your memory as Perl''s integer function works:


    ```

    $ perdoc -f int

    int EXPR

    ```


    Returns the integer portion of EXPR. If EXPR is omitted, uses $. You should not
    use this function for rounding: one because it truncates towards 0, and two because
    machine representations of floating point numbers sometimes counterintuitive results.
    For example, "int(-6.725/0.025) produces -268 rather than the correct -269; that
    is because it''s really more like -268.999999999999431568 instead. Usually, the
    "sprintf," or the POSIX::floor and POSIX::ceil functions will serve you better
    than will int().


    You can also use this command with the -m option to find out any of the built-in
    Perl modules that are active. Maybe you can''t remember the syntax of Getopt::std
    module:


    ```

    $ perdoc -m Getopt::Std

    package Getopt::Std;

    require 5.000;

    require Exporter;

    ```


    ```

    =head1 NAME

    getopt - Process single-character switches with switch clustering

    =head1 SYPSIS

    ```


    ```

    use Getopt::Std;

    getopt(''oDI''); # -o, -D -I take arg. Sets $opt* as a side-effect.

    getopt(''oDI'', \opts); # -o, -D -I take arg. Values in %opts

    getopts(''oif: # -o & -i are boolean flags, -f takes an argument

    # Sets $opt* as a side-effect.

    getopts(''oif:'', \opts); # options as value. Values in %opts

    ```


    ```

    =head1 DESCRIPTION

    ```


    The getopt() function processes single-character switches with clustering. Pass
    one argument which is a string containing all switches that take an argument.
    For each switch, sets $opt_x (where x is the switch name) to the value of the
    argument if an argument is expected, or 1 otherwise. Switches which take argument
    don''t care whether there is a space between the switch and the argument.'
