  md: "To convert from Mac to Unix, the script needs to change every occurrence of\
    \ a car-riage return to a line feed (also called newline characters). Just as\
    \ we have seen that Perl uses \\n to represent newline characters, Perl uses \\\
    r as the special symbol for carriage return. You can imagine writing a program\
    \ that looks something like this:\n\n```\n#!/usr/bin/perl\nuse strict; use warnings;\n\
    while (my $line = <>) {\n  $line ~ s/r\\n/g;\n  print $line;\n}\n```\n\nFor Windows\
    \ files, you would need to change the substitution part to s\\r\\n/n/.\nIt turns\
    \ out that Perl has some convenient command-line options that will help us accomplish\
    \ this task. The -e option on the perl command is used to execute a piece of code\
    \ on the command line. ³⁴ This means we can briefly revisit Chapter 4.1 and learn\
    \ a new way of printing \"hello world\":\n\n```\nperl -pe \"hello world\\n\"\n\
    ```\n\nThere are a few other command-line options that are frequently used in\
    \ conjunction with -e, and one of the most common is the -p option, which allows\
    \ you to print each line of any input file (after applying some perl code to the\
    \ line). The following Perl command – and it is a command and not a script – will\
    \ convert a Mac or Windows file to:\n\n```\nperl -pe 's/r\\n?/n/g' < mac_or_windows_file.txt\
    \ > unix_file.txt\n```\n\nThis simple command will loop over each line of the\
    \ specified input, apply the Perl code to that line, and print the output, which\
    \ we redirect into a new output file. Note that we have changed the regex in the\
