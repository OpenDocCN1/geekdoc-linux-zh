  md: "# Matching operators\n\n| Operator | Meaning | Example |\n|---|---|---|\n|\
    \ =~ m// | match | if ($s =~ m/GAATTC/) |\n| =~ // | match | if ($s =~ /GAATTC/)\
    \ |\n| != // | not match | if ($s != m/GAATTC/) |\n| ~ s// | substitution | $s\
    \ ~ s/thing/other/ |\n| ~ tr// | transliteration | $count = $s =~ tr/A/A/ |\n\n\
    # Substitution\n\nIn addition to matching things, we often want to substitute\
    \ a pattern with a string; we can do this using the substitution operator. that\
    \ operator can only substitute things if it first finds a match. The syntax is\
    \ very similar to the matching operator, but we obviously need to specify a replacement\
    \ string in addition to the pattern that we are trying to match. The basic syntax\
    \ is as follows:¹\n\n```\n$string ~ s/match/replacement;\n```\n\nNote that we\
    \ use an s instead of an m to indicate that this will be a substitution. The only\
    \ other difference is that we include a second string that will replace the matching\
    \ pattern. Let's see how this works in practice.\n\n# Example 4.11.3\n\nThis script\
    \ turns one into another, and then subsequently modifies just of the new string.\n\
    \n+   1. #!/usr/bin/perl\n2. # currency_conversion.pl\n3. use strict; use warnings;\n\
    4. \n5. my $currency = \"pounds\";n6. print \"I used to get paid in $currency\\\
    n\";n7. \n8. $currency ~ s/pounds/dollars/;\n9. print \"But now I get paid in\
    \ $currency\\n\";n10. \n11. my $replacement = \"nuts\";n12. $currency ~ s/llars/replacement;\n\
    13. print \"Ideally, I'd like to get paid in $currency\\n\";\n\nThis script should\
    \ produce the output:\nI to get paid in pounds\nBut now I get paid in dollars\n\
    Ideally, I'd like to get paid in donuts\n\n> ¹ The syntax of this operator very\
    \ closely resembles the syntax of the Unix sed command, which performs a very\
    \ similar function (among many other things). We will mention sed very briefly\
    \ in Chapter 5.8."
