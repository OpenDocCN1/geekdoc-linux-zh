  md: '# Unix and Perl to the Rescue!


    Your research has generated gigabytes of data and now you need to analyze it.
    You hate using spreadsheets but it''s all you know, so what else can you do? This
    book will transform how you work with large and complex data sets, teaching you
    powerful programming tools for slicing and dicing data to suit your needs.


    Written in a fun and accessible style, this step-by-step guide will inspire and
    inform non-programmers about the essential aspects of Unix and Perl. It shows
    how, with just a little programming knowledge, you can write programs that could
    save you hours, or even days. No prior experience is required and new concepts
    are introduced using numerous code examples that you can try out for yourself.
    Going beyond the basics, the authors touch upon many broader topics that will
    help those new to programming, including debugging and how to write in a good
    programming style.


    KEITH BRADNAM is a project scientist in the Genome Center at the University of
    California, Davis. He has extensive experience working with model organism databases
    and spent four years as a project leader at WormBase, helping to develop this
    important bioinformatics resource.


    IAN KORF is an Associate Professor in Molecular and Cellular Biology at the University
    of California, Davis. His research seeks to understand structure and function
    in genomic DNA. He has developed new tools for gene prediction, co-authored the
    only book devoted to BLAST and helped in the development of BioPerl.'
