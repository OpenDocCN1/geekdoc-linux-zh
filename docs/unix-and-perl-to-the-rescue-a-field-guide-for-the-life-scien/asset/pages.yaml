    \ Then the entire logic of the program would be stated in the first three lines.\
    \ But this is going a little too far. If the code is not used multiple times,\
    \ it is a littlezeous to make it into a subroutine.\n\n# Libraries\n\nAs shown,\
    \ subroutines make parts of your code re-usable. But if you want to share the\
    \ same clever piece of code in several different programs? For example, you have\
    \ written a program that reads a DNA sequence and calculates the codon usage.\
    \ Later, you decide to make another program that reads a DNA sequence and calculates\
    \ its melting temperature. One way to get from the first program to the second\
    \ is to copy and paste it. STOP! Don't do Copy and paste. Not only is it dangerous,\
    \ but is a more general, and more beautiful solution. Subroutines can be shared\
    \ between different programs. You can write code and share it with as many programs\
    \ as you like. All you have to do is place your subroutines into a library (also\
    \ called a module)¹ This is easier than you might imagine. A library that contains\
    \ various DNA analysis subroutines might be called SequenceTools. A library file\
    \ ends with the suffix .pm, so the library file would then be called SequenceTools.pm.\n\
    \nThe simplest form of library is just a file of subroutines. Example 7.4.6 shows\
    \ how to create a library. Perl requires that libraries return a true value when\
    \ read, so it is custom the last line of a file contains the number 1:\n\n¹¹ We\
    \ explain libraries in more detail in Chapter 6.2."
