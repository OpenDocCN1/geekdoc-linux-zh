  md: '# When to use OOP


    Many software libraries use OOP syntax (see the next chapter), so all programmers
    should be able to use objects. However, not everyone needs to write their own
    classes; many expert Perl programmers have never written a class, and you don''t
    have to either. In fact, we suggest you don''t classes just yet. Eventually you
    will see where OOP is useful and where it is a burden, and you will choose your
    programming style appropriately.


    # 6.9 CPAN


    It''s comprehensive

    If you have come so far in the book, take a moment to celebrate! Put down the
    book. Sing at the top of your lungs, watch a movie, eat a delicious dessert, run
    around the block marked, or whatever it is that you do.^31 You have mastered the
    most important parts of Unix and Perl!


    Are you back? Your job as a programmer is to become a lot easier. In this chapter
    we are going to show you how to tap into a huge world of free Perl software: the
    Comprehensive Perl Archive Network (CPAN).32


    # Searching for free code


    Before you start writing a complex piece of software, check CPAN first! It''s
    possible that someone has already done some of the hard work. Good programmers
    reuse code. Great programmers reuse code: Go to://search.cpan.org and searching
    for something. You might be amazed at what you can find.


    # Installing modules


    One way to install a new module is to use one of the CPAN modules that comes pre-installed
    with Perl. You can use this by entering the command on the line:


    ```

    $ perl -MCPAN -e shell

    ```


    This opens a CPAN shell where you can type commands. The "sudo" part is necessary
    to be able to have permission to copy the Perl module to somewhere on your filesystem
    outside of your home directory. Note that you might not have permission to do
    this if you are not the administrator on the computer you are using. If this works,
    you should see the following prompt:


    ```

    cpan[1]>

    ```


    Try asking for help:


    ```

    cpan[1]> help

    ```


    > 31 You may also do all of these things at the same time if you desire.

    32 Not to be confused with the US cable network station that covers political
    news: C-SPAN.'
