    scripts get longer becomes harder to keep track of which element of @ARGV contains
    which piece of data. Therefore you should adopt the following “good practice":


    > Always assign contents of @ARGV to another array or set of variables.


    In many cases, this would be the first thing your script does. @ARGV is not a
