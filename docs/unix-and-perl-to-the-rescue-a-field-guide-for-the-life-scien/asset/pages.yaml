  md: '# Combining multiple functions at once


    Functions are incredibly useful in Perl, particularly because we can sometimes
    place one function call inside another. We often want to generate random integers
    but as we have just seen, the rand() function generates fractional numbers. Luckily,
    Perl has the int() function to turn fractional numbers into integers.


    # Example 4.4.4


    Add the following line to your script to make your code generate a random integer.


    +   19. print "a random integer up to $sum is , int(rand($sum)),\n";


    # Understanding the script


    Notice how we place the rand() function call inside the int() function call. You
    might be wondering how Perl knows what to do with these nested calls. It makes
    no sense to calculate the integer part of the code until you have first generated
    the random number. In situations like this, Perl will first attempt to resolve
    the inner-most part of the code. Once the rand() function returns a number, then
    this can be passed to the int() function.


    This part of the code could also have been written as int rand $sum. This is another
    example where you can omit parentheses if you like. But just because you can,
    doesn''t always mean you should.


    Hopefully, you also noticed that this line reuses the $sum variable earlier in
    the script. If we didn''t reuse the variable we could instead write $x + $y instead
    of $sum. However, if we changed our method and wanted $sum to be the product of
    $x and $y we would have to change our code in three separate places. By using
    $sum as a container for our desired mathematical operation, we only have to change
    the one line which first defines $sum. The idea of reusing code is an important
    one and we elaborate on in Chapter 7.4.


    # Operator precedence


    Let''s quickly discuss something operator precedence. Some operators have higher
    precedence than others. We''re used to see this in math when multiplication and
    division come before addition and subtraction: 3+2*5=13. If you want to force
    addition before multiplication, you can do this as (3+2)*5=25. Perl has a lot
    of operators in addition to the mathematical operators and there are a lot of
    precedence rules. Don''t bother memorizing them. The universal precedence rule
    is this: Multiplication comes before addition, use parentheses for everything.


    > This line of code will be processed by Perl in the following order:


    +   (1) Determine contents of $sum

    (2) Calculate random number using $sum

    (3) Pass random number to integer function

    (4) Send integer value with text string to the print() function'
