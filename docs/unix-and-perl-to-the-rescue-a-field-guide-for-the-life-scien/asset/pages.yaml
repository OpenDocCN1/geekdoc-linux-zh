  md: '# Advanced Perl


    The -> operator lets you *dereference* individual elements of an array. Some-times
    you need to dereference an entire array. For example, we use arrays when sorting.
    To dereference the whole array, we can prefix the scalar with the array symbol.
    Alternatively, we can use the array symbol in front of a block containing the
    scalar. The following three statements are identical:

    nThe only difference is that the first example is adding a string to an array
    whereas the last two examples are adding a string to a dereferenced array; but
    it is always the same array that is modified.

    Seeing the combination of @ and $ signs together can take a while to get used
    to.

    ```perl

    ush @author, ''Nigel'';

    push @author, ''Nigel'';

    push @{$author_ref}, ''Nigel'';

    ```

    foreach my $author (@author_ref) { print "$author\n"; }

    As we will see, there are times when the syntax of the block format @{$sca-lar}
    is preferred.

    **Anonymous array composer**

    In the examples, $author_ref was a reference to @author. Creating references to
    arrays this way makes sense when the array was created before you needed to create
    the reference. But what if you want to create the array at the same time as you
    make a reference? In this scenario we can actually skip making the @author array
    and go straight to the array reference using something called the anonymous array
    composer. This is a complicated name, but in practice, it means replacing the
    parentheses with square brackets:

    my $author_ref = [''Keith'', ''Ian''];

    The reason we is that we call this anonymous because it has no name.¹⁴ The array
    ref-ference has a name (@author_ref), but it points to does not. Just be clear,
    the two strategies both do the same thing.


    | Named array | Anonymous array |

    | --- | --- |

    | my $array = (''Keith'', ''Ian''); | my $array_ref = [''Keith'', ''Ian'']; |

    | my $array_ref = \array; | print $array_ref->[0]; |


    > ¹⁴ This is the shortcut/alias breaks down. An anonymous array is like an invisible
    file with no name that can only be accessed by its alias.'
