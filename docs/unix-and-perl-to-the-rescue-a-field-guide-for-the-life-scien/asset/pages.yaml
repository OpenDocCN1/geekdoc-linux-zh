  md: '# Example 4.1.2


    Let us explore the use of hash characters a little more. We have suggested that
    you can use hash characters to initiate a comment in your script. But what if
    you wanted to print a hash character?


    +   1. # hashcheck.pl

    2. print("This is a hash character: #\n")

    3. # this is a comment

    4. print("This is a print statement...\n"); # followed by a comment

    5. # print("This line will never be printed\n");


    # Understanding the script


    As in the previous example, to run this script you need to be in the same directory
    as the file, and just type perl hashcheck.pl (assuming you named the script "hashcheck.pl")


    The lessons to learn from this short script are three-fold. First, you can obviously
    print a # character, so Perl is smart enough to know that if a # appears within
    a pair of quotation characters, you probably want to print the character, rather
    than start a comment. Second, you can have comments as lines themselves (lines
    1 and 3) or add-on comments that immediately follow some code (line 4). Finally,
    you can add a hash character to the start of an existing line of code to effectively
    silence that line of code (line 5). This is known as commenting-out a line, and
    is frequently used when writing and debugging Perl scripts.


    # Problem 4.1.1


    The world of programming would quickly become very tedious if your scripts only
    said "Hello world" to modify the program to output three different lines of text.
    Note that there are two different ways to do this.


    # Problem 4.1.2


    Try making a "deleterious mutation" to your program. For example, leave the semi-colon
    or one of the parentheses. Observe the error message when you try to run it. One
    of the most important aspects of programming is debugging. Probably more time
    is spent debugging programming, so it''s a good idea to start recognizing errors
    now. Try making multiple mutations to your script and see whether you see multiple
    error messages. Finally, ensure you can remove the errors and get your script
    working again.


    # 4.2 Scalar variables


    # Variables making programming very able


    Imagine that we want to write a program to calculate some property of a DNA sequence.
    The program might do something as simple as the length of the sequence, or'
