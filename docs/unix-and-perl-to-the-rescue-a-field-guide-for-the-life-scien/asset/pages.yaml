  md: 'fraction of those input lines. It would therefore be more efficient to use
    grep only to find the lines that we are interested in, and use tr to format the
    text:^{36}


    ```

    $ cat yeast_chr1_dna.fa | grep ''ATGTAG'' | tr ''A-Z'' ''a-z''

    ```


    In this example, you might not notice difference in speed between the two methods.
    This is because our pipeline is short and the yeast chromosome sequence in question
    is (relatively) small. However, if you run the pipeline against the entire human
    genome sequence, the difference between the two methods becomes much more noticeable.
    On our Mac computer the former method took three minutes to produce a file containing
    the human genome sequence, whereas the latter method took just one minute.{37}
    In general you should always try to put commands like grep, which might be filtering
    the data, earlier in the pipeline. This will reduce the work for any commands
    that follows.


    # 5.8 Advanced text manipulation


    # In which we come to the end of the line


    Unix is a great OS for working with bioinformatics data because such often exists
    in the form of structured files and there are many useful commands that can be
    used to slice-and-dice text files. This is the final chapter in this part of the
    book and it will introduce two other extremely powerful commands that can be used
    to manipulate text. But first we will take a quick look at an issue that can arise
    when working with text files produced on a non-Unix OS.


    # Line endings


    When you press the return/enter key on your keyboard you might think that this
    causes the same effect no matter what computer you are using. The effects of hitting
    this key are the same – if you are in a word processor or text editor, then your
    cursor will move down one line. However, the underlying effects of pressing enter
    can differ depending on what OS your computer is running.


    Technically speaking, pressing enter generates something called a newline, which
    is a special character that is represented internally by a line feed or carriage
    return, or a combination of both characters. It all depends on your OS. This is
    something that you normally need to know about, except if you are a Unix user
    and receive a text file that was generated on a non-Unix system. If this happens
    then you find that what looked like a multi-line text now looks like one long
    line of text with strange ^M characters appearing where you would expect the newlines
    to be. For example, a text file that looks like this on a non-Unix computer:


    ```

    a,1,alpha

    b,2,beta

    ```


