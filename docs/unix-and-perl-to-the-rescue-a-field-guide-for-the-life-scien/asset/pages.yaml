  md: "# Using pipes to send and receive output from a program\n\nPreviously we saw\
    \ that the open function allows one to read from, or write to, files. You can\
    \ also use the open function to read from, or write to, programs. This is done\
    \ by appending or pending a pipe character to the command to be as part of the\
    \ open function.¹106 The syntax can look very similar to how you open a file for\
    \ reading:\n\n```\nopen(my fh, \"file\"); # open the file called 'file' for reading\n\
    open(my fh, \"prog\"); # run the command 'prog' and capture output\nopen(my fh,\
    \ \"l prog\"); # send input to the command called 'prog'\n```\n\n# Example 42.9.4\n\
    \nThis script uses two pipes: one to read output from the ls command, and one\
    \ to send input to the wc command.\n\n+   1. #!/usr/bin/perl\n2. # pipes.pl\n\
    3. use strict; use warnings;\n4. \n5. open(my sin, \"ls\") or die \"Can’t open\
    \ pipe: $\";\n6. while (<$sin>) {print}\n7. close sin;\n8. \n9. open(my out, \"\
    l wc\") or die \"Can’t open pipe: $\";\n10. print out\"this sentence has 1 line,\
    \ 10 words, and 51 letters\\n\"\n11. close out;\n\n# Understanding the script\n\
    \nLines 5–7 show how you can read from a process. Line 5 associates the $in handle\
    \ with the ls command. Note the pipe symbol that follows the command. Once the\
    \ handle is connected to ls, each file handle the $in is access, one line of output\
    \ from the ls command will be.\n\nLine 6 uses a while loop to read one line at\
    \ a time from the output of the ls command. Each line is stored in $ and printed.\
    \ Line 7 closes the pipe.¹⁰⁷⁷\n\nLines 9–11 show how you can write to a process,\
    \ in this case the wc command. Here, the pipe symbol is placed before the program\
    \ name, just as you would do on a Unix command line (see Chapter 5.7).\n\nLine\
    \ 10 prints to the filehandle specified by $out, which effectively means that\
    \ the print command is being used to send input to the wc. The wc command will\
    \ only print its output when the filehandle is closed or when the script is terminated.\
    \ This line does not print the text “this sentence has 1 line, 10 words, and 51\
    \ letters” to the screen. This string is only used as input to the wc command.\n\
    \n> The syntax borrows a lot from how we use pipelines in Unix (see Chapter 5).\
    \ You don't have to close your pipes whenever, because they will automatically\
    \ close when the variable goes out of scope. But it's never a bad idea."
  merge: -1
