  md: '# Comments


    One of the simplest ways to beautify your program is to employ comments to break
    up code into sections based on what the code does. Major sections of code can
    be commented with larger blocks of comments. There are many ways you can do this.
    Unlike indentation, religious wars were not fought about this, and you could invent
    your own style without without offending anyone:


    ```

    ############################################################

    # Major subheading

    # some descriptive text about this section

    ############################################################

    ```


    ```

    ############################

    # Minor subheading #

    cute, but maybe too much!

    ############################

    O_O /

    #--------------------------

    (o.o)

    # Minor subheading #

    O_O,

    #--------------------------

    ```


    minor subheading


    Proper, whitespace characters (tabs, newlines, spaces) can improve the readability
    of your code. However, if used improperly they can confuse people, especially
    if you are breaking with standard practices. As we saw earlier, tabs are used
    to show hierarchy in block structure. Spaces are used to separate operators and
    functions, and to align related statements on different lines. Newlines are used
    to separate lines and parts of the program that do different things. For a quick
    summary:


