    Sometimes it is really to work out what a module is doing (even when you have
    never used it). In this script, we first have to make an object ($stat) that will
    handle the statistical computations (line 6 (the previous chapter) for more information
    about using objects). We then use the add_data() function to generate some data
    for the object to work with (line 7). The following lines then call functions
    to calculate the mean, median, and harmonic mean of those


    The documentation that accompanies each module should always provide full details
    of how it should be used. Do not assume you will understand everything about the
    module without first reading the documentation!


    # Using modules installed in non-standard locations


    If you have installed a Perl module in a non-standard location, your script may
    not know where to find it. Perl will first look in the default location and also
    in the current working directory. If the module is installed elsewhere then, Perl
    will not know about it and therefore not able to use it. One solution is to specify
    the alternative location of the module inside the script by adding the following
    line:


    +   4. use lib "/Users/nigel/lib";


    Perl will now know to look for modules in the specified directory in addition
    to the default locations. This is not the best solution, however, if you want
    to move your own Perl library to another directory you would have to change all
    of your scripts to use that library.


    On Unix systems you can specify an environment variable called $PERLLIB. This
    variable stores the location of the directory (or directories) that you want to
    use for'
