    # Reverse-sorting


    Sometimes you will want to perform a reverse-sort. This is easily done by just
    switching the position of $a and $b when using either of the comparison operators:


    ```

    @data = sort {$b cmp $a} @data; # reverse alphabetic sort

    @data = sort { <=> $a} @data; # reverse numeric sort

    ```


    Alternatively, Perl also has a reverse() function which, surprisingly, can reverse
    the order of an array. This function also works on strings.


    # Example 4.18.2


    This short script shows how you can use the reverse() function in combination
    with sort().


    +   1. #!/usr/bin/perl

    2. # reverse.pl

    3. use strict; use warnings;

    4.

    5. my @array = qw(b c h d e a f); # unsorted

    6. my $string = "reverse";n7.

    8. my @reversed_array = reverse(sort(@array));

    9. my $reversed_string = reverse($string);

    10. print "reversed_string:@reversed_array\n";


    # Understanding the script


    After declaring an array and a string on lines 5 and 6, we use the reverse() function
    to take the sorted array and then assign the result to a new array.

    Line 9 shows how reverse can also be used on a string in exactly the same way.


