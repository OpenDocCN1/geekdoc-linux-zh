    your home directory. Use the pwd and ls commands to keep on checking where you
    are and what files and directories are present as you navigate.


    # 3.8 Absolute and relative paths


    We''re absolutely sure that this part is all relative

    In the last chapter we saw how we could navigate up a level using the .. command,
    which signifies the parent directory. What if we wanted to navigate up some levels
    and then back down in one single operation? Can you think how might navigate from
    inside David’s “Desktop” directory to David’s “Docs” directory in one go? Clearly
    we could do this with two separate cd commands:


    ```

    $pwd

    /home/david/Desktop

    $ cd

    $ cd Docs

    ```


    But rather run two separate commands, we can simply combine both paths from each
    command:


    ```

    $ cd ../Docs

    ```


    You can read this as “navigate up one level and navigate down one level into the
    Docs directory.” In Unix this is known as a relative path – i.e., relative to
    our current location (/home/david/Desktop), we can get to the Docs directory by
    navigating up one level and then down level. This has the net effect of traversing
    sideways in the directory structure. A slightly longer example of a relative path
    would be:


    ```

    $ cd ../../tmp

    ```


    We are now going up three levels and then down one level into the “tmp” directory.
    The third “up” operation takes us to the root level. From it becomes easier to
    navigate to the “tmp” from the root level:


    ```

    $ cd /tmp

    ```


    This syntax is known as an absolute path. All absolute paths start from the root
    level of the OS and specify a file or directory relation to this fixed starting
    point. It is important to understand the difference between these two types of
    path. When we start moving and copying files, we often have to specify paths for
    both the source and destination directories, and using the wrong type of path
    will be a likely source of errors.21


    21 Being able to specify the correct path will be important for some other Unix
    commands, and also for when we want to start running our Perl programs.'
