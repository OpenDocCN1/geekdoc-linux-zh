  md: 'many of the most common error messages, along with a quick explanation as to
    how you can fix them.


    # Non-Perl error messages


    Permission denied


    Do you have the permission to run the script? Have you run the Unix chmod command
    to add executable permissions (see Chapter 3.29)?


    command not found


    You''ve mistyped the name of your Perl program''or the program is not in a directory
    Unix system knows about (technically speaking the directory is not in your path).
    If you are using a specific directory to contain all of your Perl scripts, make
    sure that this directory has been added to your PATH environment variable (see
    Chapter 3.28).


    # bad interpreter: No such file or directory


    The first line of a Perl script should let the Unix system know where to find
    a copy of the Perl program that will understand your code. This will often be
    /usr/bin/perl. If you make any type in this line (e.g., omitting a slash), then
    Unix will be looking for Perl in the wrong place, and things will fail.


    use: command not found


    Remember we told you that you can include whitespace anywhere in your program?
    Well, there is one exception to the rule: the first line of your script cannot
    be blank! This is sometimes a very hard error to spot as everything else can seem
    normal. Unix only looks at the first line of a file in order to determine whether
    it should be sent off to be interpreted by another program (e.g., Perl). If the
    line is blank, Unix will attempt to execute all of the following lines of Perl
    code as Unix commands. Because Unix also supports the use of hash characters to
    comment out lines, it will not report any error until it gets to the first line
    of Perl code, which is nearly always a use declaration.


    # Common Perl error messages


    There are a lot of different error messages, though in common practice a small
    number of messages will cover most of the problems you encounter. If you are using
    a Unix system you can find a description of these errors by looking at the perdiag
    page. You can also tell Perl to produce more informative error messages by including
    the diagnostics pragma in your scripts:


    use diagnostics;'
