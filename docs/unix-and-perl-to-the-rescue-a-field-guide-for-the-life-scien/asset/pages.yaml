  md: 'look awful lot like Perl functions.” Well, that''s because they are! Writing
    a subroutine is just the same as writing your own function, and in this sense
    the words “subroutine” and “function” are pretty interchangeable.


    # Passing data to subroutines


    Subroutines become much more powerful when you pass data to them and you can pass
    one or more items to a subroutine in a number of ways. Items to be passed should
    be between the parentheses that the subroutine name:


    ```

    fruits(@"apples"); # passes one to the ‘fruits’ subroutine

    add_them_up(1, 5, 4); # passes three numbers

    mean_size($small, @big); # passes two variables

    math("mean", @numbers); # pass a string and an array

    how_many_words(@words); # passes the contents of the @words array

    count(split /\+/, $text); # passes the results of the split() function

    ```


    No matter how you specify the parameters to be, they are always passed as a single
