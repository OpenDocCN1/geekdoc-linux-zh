  md: 'There are three quantifiers that are very commonly used in regular expressions,
    but which can be difficult to understand:


    +   + # match 1 or more times

    ? # match 0 or 1 time

    * # match 0 or more times


    The last two quantifiers can be the most confusing because the concept of matching
    zero times is not always easy to grasp. Consider the following regex:


    ```

    $text =~ m/A/

    ```


    This reads as "match $text contains zero or more copies of the A." This means
    it will always match because every possible string contains either the letter
    A or it doesn''t. Therefore this quantifier should always be used as part of some
    larger pattern:


    ```

    $text =~ m/[a-z]*[0-9]+/

    ```


    This pattern matches a word (one or more letters) followed by any number of spaces
    (including one at all) and followed by one or more numbers.


    We can now use all the regexes we have seen so far in order to tackle the telephone
    number problem. First, let us ignore the issues of parentheses that might occur
    in phone numbers, and see if we have one regex that catches all other possibilities:


    ```

