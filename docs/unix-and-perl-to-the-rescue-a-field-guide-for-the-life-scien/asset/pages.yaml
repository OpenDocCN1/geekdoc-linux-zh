    # The rm command


    Potentially, rm is a very dangerous command; if you delete something with rm,
    you will

    not get it back. It does not go into the trash or recycle can; it is permanently
    removed.⁸nWith rm, it is possible to delete everything in your home directory
    (all files, directories,

    and subdirectories);⁹⁰ that is why it is such a dangerous command.


    Let us repeat that last part. If you misuse the rm command, it is possible to

    delete every file you have created! Are you sure yet? You should be. Luckily there
    is

    is a way of making rm a little bit safer. We can use it with the -i command-line
    option,

    which will ask for confirmation before deleting anything.⁶⁰


    # Example 3.18.1


    Let''s see the difference that the -i option makes to the rm command. To do this,
    we''ll

    create two temporary files inside the "Unix_and_Perl" directory:


    ```

    $ test1 test2

    $ ls

    Code Temp test1 test2

    $ rm test1

    $ ls

    Code Temp test2

    $ rm -i test2

    remove test2? y

    ```


    Explanation

    We use the touch command to make two test files. The first is deleted by rm without

    using the -i option. Notice how there is no warning - the file is deleted as soon
    as we

    press enter, never to return. When we are deleting the second file, we use the
    -i

    option and this time we are prompted as to whether we really want to remove the
    file.


    # Making the rm command even more dangerous


    Just as we can use wildcard characters with the ls command, we can also use them
    with

    t rm command. For example, we could have removed both temporary files in Example

    3.18.1 by using the following:


    ```

    $ rm test?

    ```


