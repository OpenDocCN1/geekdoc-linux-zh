    \ In Perl, we do this with the concatenate operator, which is represented by a\
    \ single dot (.) character.\n\n# Example 4.9.1\n\nCreate the following program\
    \ and run it. This program introduces the concatenate operator and uses it to\
    \ join two variables.\n\n+   1. #!/usr/bin/perl\n2. # strings.pl\n3. use strict;\
