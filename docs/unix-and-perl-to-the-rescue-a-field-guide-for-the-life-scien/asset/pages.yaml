  md: 'The namespace of the main body of a Perl program is, appropriately, called
    main.

    So, the subroutine called get_lines_from_file() that we saw back in Example

    7.4.5 is more formally main::get_lines_from_file(). Code inside particular

    namespace does not need to use the longer name. But when you want to call a function

    another namespace, you must include the namespace (which is generally the same
    as

    the library name). Let''s look at an example to make this clear.


    # Example 7.4.9


    +   1. #!/usr/bin/perl

    2. use strict; use warnings;

    3. use SequenceTools;

    4. my $dna = SequenceTools::read_sequence($ARGV[0]);

    5. my $tm = SequenceTools::melting_temperature($dna);


    Libraries make code easier to share, maintain, and extend. With other general-

    ing methods, there is a little initial cost in making a library. But the cost
    is incredibly

