    (4) $seq has a length that is a multiple of three nt, i.e., $seq consists of codons.


    # 4.29 Interacting with other programs


    Perl is like the Force: it has a light side, a dark side, and it holds the Universe¹⁰⁰


    One of the things Perl excels at is being the glue between different programs.
    Consider the following scenario. Your boss emails you .doc files and instructs
    you to perform the following procedures on each file: (1) count the number of
    words; (2) determine if the word “patient” appears in the text; (3) convert the
    .doc file to a text file, making sure that all characters are uppercase. If you
    were emailed one file, you would probably open the document in a word processing
    program to complete the tasks. But what would you do if there were thousands of
    files? If you''re a Perl programmer, you write a few lines of code to glue a couple
    of programs together and then go home'
