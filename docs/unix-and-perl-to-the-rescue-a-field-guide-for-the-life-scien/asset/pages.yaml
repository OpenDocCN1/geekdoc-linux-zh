- img_proc: true
  md: '# General strategies for debugging


    Programming languages like Perl have sophisticated, and therefore complicated,
    debugging tools. But for simple scripts, these tools can be overkill. Here is
    some basic advice on how to go about fixing your scripts:


    +   (1) Stay calm and don''t blame the computer. In nearly all cases, the computer
    is only doing what you have told it to do.

    (2) Check and re-check your code. Most errors – probably the vast majority – are
    due to very simple types in your script. You will probably looked right at the
    error without realizing it.

    (3) Start with the first error message you see. Subsequent error messages are
    likely to stem from the first problem in your script. Fix one, and you may fix
    them all.

    (4) Use the ability to "comment out" lines of code to see if "turning off" a single
    line of code removes the error message (on this later).

    (5) Sometimes a program will start to work but then fail at some unknown point
    within your code. Consider adding print statements to work out where the program
    is failing.

    (6) Use a suitable code editor. Most editors will provide syntax highlighting,
    meaning they will color various parts of code depending on their content/function.
    This often provides visual feedback that you have not noticed a piece of code
    correctly.


    # Compile-time vs. run-time errors


    In general, there are two kinds of bugs in a program, compile-time errors and
    run-time errors. A program that does not even begin to run has a compile-time
    error. A program that exhibits errors (like crashing) after it starts has runtime
    errors.


    # Example 7.1.1


    The line below contains errors (unbalanced quotes and parentheses). Any program
    containing this line of code will not run because it produces a compile-time error.

    print("hello world\));


    # Example 7.1.2


    The following line will lead to a run-time error if the value of $z is zero or
    undefined (which Perl treats as zero in a numeric context).


    ```

    $x = $y / $z;

    ```


    Obviously, we want our programs to be error-free, but if you had to choose compile-time
    and run-time errors, compile-time errors are better. Those that show up only after
    a program has been running for minutes or hours can be laborious to debug.'
  merge: -1
