  md: '# Why add documentation?


    When you first write a script, it will seem as obvious and intuitive to you.

    The idea that you might ever forget why you wrote a particular piece of code will
    seem unlikely. Why you will be tempted to add any comments, and to omit any documentation.
    After you finish a script it becomes very easy to forget about the gory details
    of how it works. More importantly, it becomes easy to forget about why you chose
    to come up with the particular solution your code contains. Many of the scripts
    you write will solve particular problems and may only be used frequently. It is
    very likely that you will sometimes need to return to a script you haven''t looked
    at or run for many months (or even years). Let''s consider the four likely scenarios
    that will arise in a script that has remained dormant for over a year:


    +   (1) You need to run the script.

    (2) Someone wants to run your script.

    (3) You need to edit the code (to add a new feature or fix a bug).

    (4) Someone wants to edit your code.


    Without proper documentation you might only have "vague ideas" of how to use your
    script. You might have to look at all the code again and spend hours, if not days,
    deciphering it. When someone wants to use it, you will quickly realize that people
    can ask away questions, like "How do I run it to X? "Is there an option to do
    X and Y? "Can you explain to me, in detail, how I gain performance from your script?"
    If you don''t document your code, you will always need to explain your program
    to others.


    As tedious as it can be to verbally explain how your program works to someone,
    this is still infinitely more fun than having to edit a script that contains no
    comments or other documentation. When you do this with your own script, you will
    be shocked at little you remember of how it worked. You might also find yourself
    troubled as to what the subroutine called "process_data" is actually doing or
    why you ever thought that "stuff" was a good name for an array. At least then
    any lies with you and no one else was hurt or injured by your lack of documentation.
    Finally, consider the fourth item on the list. When you''s code contains not so
    much as a single comment, then the whole experience can become one of the most
    frustrating and bitter experiences in your life. Frequently, the only way you
    will properly understand a script that has no documentation is to rewrite the
    whole thing from scratch. Even if you only do this in your entire career as a
    programmer, it will be enough to create a deep resentment toward the person who
    first wrote the script. Don''t be that person!


    > We don''t care if you lie, cheat, or steal. We do care if you don''t document
    code. 21


    20 The authors can claim this with direct personal experience.

    21 Okay, we do care a little bit when people lie, cheat, or steal ... just not
    as much as when people don''t add any comments or we documentation.'
