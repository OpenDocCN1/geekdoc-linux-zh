  md: 'multiple commands together without having to write any intermediate output
    to a file.

    Unix achieves this by letting you build pipelines.


    # How pipelines work


    A pipeline refers to a set of commands that are linked together. You can take
    the output of any Unix command and tell Unix to use that output as input for a
    subsequent command. There is no practical limit to how many commands you can combine
    in this way, though it is necessary that any command in the pipeline actually
    produces output and in turn passes it to another command that can receive standard
    input. The actual magic of joining commands together is done by the pipe character
    l.³32 This means we recount the earlier example in a single-pipeline, like so:


    ```

    $ grep > yeast_chr1_orfs.fa | grep -v "Dubious" | wc -l

    102

    ```


    This pipeline uses two pipes: the output of the first grep command is sent "down
    a pipe" to the second grep command; in turn, the grep command sends its output
    to the wc command. Note that the pipeline does not write to any files.


    # Piping output into the less command


    It is very common to use a pipeline to just send the final output of a command
    (or set of commands) to a program like less so you can have more control over
    the output. If we wanted to look at some of the initial input of the last example,
    we could do this:


    ```

    $ grep > yeast_chr1_orfs.fa | less

    ```


    The output of the grep command is passed to the less program. At this point the
    user would have access to the results and be able to use any of the tools available
    in the less program, e.g., jump to the end of the data or search for a specific
    pattern. Note that the output is not stored in any file. If you work with large
    data files, then it becomes very useful to always send the output from any manipulations
    to less.


    # Using cat to start a pipeline


    A common use of the cat command is to start a pipeline. This allows you to avoid
    redirecting standard input with the < operator. We could take the file of yeast
    ORFs and send it to the tr command to modify the DNA sequence:


    ```

    $ cat yeast_chr1_orfs.fa | tr ''ACGT'' ''acgt'' > modified_dna.fa

    ```


    Using cat in this way achieves the same result as if you had instead replaced
    tr with redirected standard input. However, the underlying behavior is a little
    different, as Unix will need to run an additional process (the cat command) to
    complete the task. For practical purposes you won''t lose any performance by constructing
    your pipeline in this way.


    > ³² This is one of those characters that have different places on different computer
    keyboards, but you will need to use the "shift" key in order to produce this character.'
