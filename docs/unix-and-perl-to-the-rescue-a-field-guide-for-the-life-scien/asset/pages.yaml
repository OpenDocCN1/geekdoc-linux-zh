    # Using wildcard characters


    In Example 3.16.2, above, we moved files in two steps. But it is usually possible,
    and often desirable, to move many files in a single step. We can do this by using
    called wildcard characters. Using wildcard characters is yet another way Unix
    can help save yourself from a lot of typing. The most common wildcard character
    in Unix is the asterisk (*), and it is used to match "match anything." We could
    have used an asterisk in Example 3.16.2 to move both files in one:


    ```

    $ mv *.txt Temp/

    ```


    You can read as "move any files whose name start with anything but end with \*.txt".
    This would move any file from the current directory into the Temp directory as
    its name is ended with \*.txt". Given that we only had two files in the current
    directory, we could have also used the following commands:


    ```

    $ mv *t Temp/

    $ mv *ea Temp/

    ```


    The first example would work because there are no other files or directories in
    the directory that end with the letter "t" (if there were, then they would be
    moved). Likewise, the second example works because the two files are the only
    items in the directory that contains the "ea" in their names. This example also
    reveals that the asterisk wildcard can match "nothing at all" as well as "anything."
    This means that *ea\* will also match any files that were named only "ea".


    # Problem 3.16.1


    The second common wildcard character is the question mark (?)Try to understand
    what the mark does by first using the touch command to create four files "fat",
    "fit", "feet", and "feat" inside the "Temp" directory. Then see what happens when
    you run the following commands:


    ```

    $ ls *

    $ ls f*

    $ ls f*t

    $ ls *at

    $ ls f?

    $ ls f??

    ```


    > 55 See Chapter 3.8 for a refresher about absolute and relative paths.'
