  md: '# 6.8 OOP basics


    Not oops, but object-oriented programming


    Object-oriented programming (OOP) is a style of programming that focuses on data.
    OOP actually encompasses a large body of programming practices that would take
    a long time to discuss in detail. In this chapter we give a brief overview of
    OOP and focus on the parts that will help you use objects. We have intentionally
    omitted some aspects of OOP.²⁷


    # Objects and classes


    An object is some kind of thing. A person is an object. A dog is an object. Although
    people and dogs are mammals, they are not the same kind of thing. People are,
    dogs are dogs.²⁸ Look different: dogs have sharp teeth and visible tails. They
    behave differently: dogs bark when they are excited and greet one another sniffing.
    In the language of OOP, we say that people and dogs belong to different classes.
    All objects are instances of a class. You are an instance of the person class,
    as is each of the authors of this book. We are all different objects, but we all
    belong to the same class. In OOP, all data belongs to a class.


    # The new constructor


    In Perl, to create an object (an instance of a class), we use something called
    the new constructor. When we use new, we also have to specify the class from which
    we are creating a new object. The syntax looks like this:


    ```

    $myObject = new Class;

    ```


    The new constructor is actually a function inside a file called Class.pm. Essentially
    this means that if you want to write the code to create a class (for people, dogs,
    proteins, etc.), that class has to have a function called new that will let you
    create a new object. As new behaves like a Perl function, we could also write
    the above code as:


    ```

    $myObject = Class::new();

    ```


    As you can see, $object is a scalar variable. The het contents of scalar is a
    hash reference? An array reference? Don''t ask. It''s an object, and the internals
    are intentionally hidden.


    # Attributes


    An object has certain attributes. For example'
  merge: -1
  pgno: 293
- img_proc: true
  md: 'have object-oriented class that lets us access various fictional attributes
    of the “person” class:


    ```

    print $chris->hair_color; # print attributes for the $chris object

    print $chris->height;

    print $chris->date_of_birth;


    print $alex->hair_color; # print attributes for the $alex object

    print $alex->height;

    print $alex->date_of_birth;

    ```


    Is $chris some kind of alternative syntax for a hash reference? No. $chris is
    an object and hair_color is an attribute. We don''t ask questions about the internals
    of an object.


    # Methods


    An object can perform specific actions called methods. A method is the name for
    a function/subroutine. To call a method, you may use the familiar -> operator.
    Some methods take parameters, others do not. The syntax for calling a method is:


    ```

    $object->method(@parameters); # with parameters

    $object->method(); # no parameters

    $object->method; # no parameters

    ```


    You may have noticed that calling a method with no parameters ($object->method)
    appears very similar to accessing an attribute for an object ($object->attribute).
    The reason for this is that attributes are hidden behind accessor methods. That
    is, functions that return some attribute of the object.


    Note that Perl does not interpolate functions/methods inside double quotes. The
    following syntax does not work as expected:


    ```

    print "$alex->height\n"; # incorrect syntax

    ```


    # Encapsulation


    One of the most important OOP concepts is encapsulation. This strives to separate
    the interface (how you interact with) from the implementation (the actual code).
    The only way to interact with an object is through its methods. What actually
    happens when a method is invoked is irrelevant to the user. From a developer''s
    standpoint, encapsulation allows one to change the underlying code without breaking
    programs that depend on the object. As long as the interface to the object remains
    consistent, any programs that use the object will be unaffected.


    # OOP code reads better


    Statements in OOP code often look more readable than code which doesn''t OOP.
    This is because they put the code at the center of attention. Consider the clarity
    of the following code:


    ```

    $ian->eat(''pizza'', ''salad'') if $ian->is_hungry;

    ```'
