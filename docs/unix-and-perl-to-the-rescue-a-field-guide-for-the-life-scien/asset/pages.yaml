  md: '# Mathematical shortcuts


    There are a few operations that are so common that Perl provides a shorthand way
    of using them. Consider the following:


    ```

    $n = 2;

    $n = $n + 5;

    ```


    In this example we have a variable ($n) which we assign an initial value of 2,
    and then we add $5 to reassign it back to itself. The result being that $n now
    contains a value of 7. To save you some time when doing this, there is a simpler
    way:


    ```

    $n += 5;

    ```


    The += operator takes whatever variable is on the left of the operator and increments
    it by whatever value is on the right of the operator. There are similar operators
    for subtraction (--), multiplication (*=), and division (/=). Here is a quick
    summary of operators in action (the current value of $n is included in a comment):


    ```

    $n = 8

    $n += 7; # $n is now 15

    $n /= 3; # $n is now 5

    $n -= 1; # $n is now 4

    $n *= 2; # $n is now 8

    ```


    One other shortcut is for when you just want to increase or decrease a variable
    by 1. Perl uses two operators to do this: the increment (++) and decrement (--)
    operator.


    ```

    $n = $n + 1; # the longest way to write this

    $n += 1; # a shorter way of writing the same thing

    $n++; # even easier!

    $n--; # and this subtracts 1 from $n

    ```


    Earlier we mentioned how the rand() function generates a random number between
    0 and the number you specify in function. How did we learn that, and more importantly,
    could you learn that? Whereas we seem to think like that learn by osmosis, the
    mundane truth is that every Perl function has an associated set of documentation.
    One to find out this documentation would be the book "Programming Perl", published
    by O''Reilly Media (this book also contains a whole of other stuff). But you can
    more easily find out Perl functions by going to http://perdoc.perl.org/index-functions.html.
    This web page provides an A-Z list of all Perl functions, and you should really
    get into the habit of making any function you use. The functions we have seen
    so far (print(), rand(), etc.) are relatively straightforward, but many other
    functions are slightly complex.'
