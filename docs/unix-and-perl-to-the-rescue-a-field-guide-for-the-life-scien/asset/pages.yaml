    3.

    4. my @data = qw(3.14 1000 21 red yellow);

    5. print "before: @data\n"

    6. @data = sort @data;

    7. print "after: @data\n";


    # Understanding the script


    Line 4 creates an array that contains both numbers and strings.

    Line 6 does the actual sorting using the appropriately sort() function. Note that
    we assigned the sorted output back to same array, but we could have also assigned
    it to a new array (e.g., @sorted_array).

    The output from the program should look like this:


    before: 3.14 1000 21 red yellow

    after: 1000 21 3.14 red yellow


    This might not be what you were expecting. The three strings were sorted correctly,
    but the numbers appear to be out of order. This is because all of the elements
    were sorted alphabetically by their ASCII values (see Chapter 4.9). In ASCII,
    1 is less than 2, which is less than 3. Alphabetically, 1000 is less than 21.
    If we want to sort numerically, we have to change the default sorting behavior
    of Perl.


    # Sorting numbers vs. sorting strings


    A sorting function must compare one value to another. In Perl, there are two operators
    that allow you to compare pairs of values:


    ```

    <== compares numbers;

    cmp strings.

    ```


    These operators return -1, 0, or +1, depending on whether the left-hand operand
    is less than, or greater than the right-hand operand.


    +   “a" cmp "b"; # -1 because 1 is less than b alphabetically

    "b" cmp "a"; # +1

    "a" cmp "a"; # 0

    1 <= 2; # -1 because 1 is less than 2 numerically'
