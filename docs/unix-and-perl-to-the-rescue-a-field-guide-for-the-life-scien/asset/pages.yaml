- img_proc: true
  md: '# Explanation


    The first character in the \-ls command tells you whether something is a file
    or directory ("-" or "d"). The next nine characters tell you the read, write,
    and execute permissions at the level of user, group, and other. Read, write, and
    execute permissions are denoted by "r", "w", and "x", respectively. Lack of permission
    is denoted by "-". Following the permissions is information related to the user
    ("nigel") and the primary group they belong to ("staff").


    We can now see that the "Code" and "Temp" directories are readable and executable
    by anyone (user, group, or other) but are writable only by the user. Directories
    require execute permission for you to be able to navigate into them with the cd
    command.


    When we look at the long listing for "hello.sh" we see that it lacks any permission,
    is readable to anyone,93 but is writable by the user.


    The chmod command can run in many different ways, but the simplest usage can be
    understood with the following examples (using a fictional file called "file.txt"):


    ```

    $ chmod u+x file.txt add executable permission at the "user" level

    $ chmod g-r file.txt remove read permission at the "group" level

    $ chmod o+w file.txt add write permission at the "other" level

    ```


    Just use+" or "-" to add or remove permissions and "u","g","o" or to denote the
    level. You can also change permissions for all levels in one go, and also change
    permissions for multiple files or directories:


    ```

    $ chmod a-w file.txt remove write permission at all levels

    $ chmod a+*-# add write permission at all levels to all files

    ```


    As you work through this book you will create many Perl scripts (and a few Unix
    scripts too), and you will ever need to add execute permission to a file at the
    user level. Please be aware that chmod is potentially a dangerous command if misused.
    Not only can you do things94 like this:


    ```

    $ chmod u-r hello.sh

    $ ls hello.sh

    hello.sh: Permission denied

    ```


    but you also have the potential to let all users on your computer or have the
    ability to read and/or delete your files.


    > Always check the results of using the chmod command!


    93 The default set of permissions for new files between different Unix OSs can
    also be changed. On some systems (such as Macs), any files created outside of
    the default set of directories (Desktop, Documents, Music, etc.) are readable
    by any other user on that computer.


    94 Actually, this might be useful for parent types who you want to ensure that
    people who have access to their computer can''t easily see their files.'
