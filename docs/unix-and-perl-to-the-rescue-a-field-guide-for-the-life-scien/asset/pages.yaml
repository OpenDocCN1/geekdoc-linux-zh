    11. print "AFTER: @list\n"


    Apart from being to use the splice() function properly, the other issue is to
    solve for this problem is how to calculate the middle position of an odd-length
    array. You can do this simply by dividing the array length by 2, and then taking
    the integer of that value. If your array has seven elements, the middle position
    is provided by int(7/2). Because int() rounds down, this will give you the value
    "3," which is the fourth (middle) position in the array.


    Putting all together, here is one solution to the problem.


    +   1. #/usr/bin/perl

    2. # $these_are_few_of_my_favorite_things.pl

    3. use strict; use warnings;

    4.

    5. my @things_i_like = qw(cheese meat spiders perlin cinema)

    6. print "OLD: @things_i_like\n"

    7. my @more_things_i_like = qw(gadgets satire macs);

    8.

    9. my $length_of_array = @things_i_like;

    10. my $middle_position = int($length_of_array / 2);

    11.

    12. splice(@things_i_like, $middle_position, 1, @more_things_i_like);

    13.

    14. print "NEW: @things_i_like\n"


    Note that if we wanted to, we could have avoided writing to lines 9 and 10, and
    instead of combining this information directly into line 12:


    ```

    splice(@things_i_like, int(@things_i_like/2), 1, @more_things_i_like)

    ```


    As always, Perl will know that these parts of line have to be evaluated before
    other parts. Perl would deduce that if we are using int() this requires a number
    and therefore the @things_i_like array will be evaluated in scalar context to
    give its length. That length then be divided by 2 and the resulting value be passed
    to the int() function. Only then can Perl perform the entire splice() command.
    If you find this confusing, it''s perfectly fine to do things in multiple steps.
    As always, it is most important that things are clear and understandable.'
