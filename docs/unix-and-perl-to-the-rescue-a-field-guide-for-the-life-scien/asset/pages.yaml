  md: 'sections aims to bring you back down to earth, as we are now going to ask you
    to rewrite all of the scripts you''ve just written.


    There are several habits that are widely considered to be “good working practices”
    when writing Perl scripts. However, they are not the easiest concepts to explain
    (especially when you have just started to learn Perl) and we will introduce them
    in bite-sized chunks.


    The first “good practice” we want to introduce stems from the fact that Perl is
    a very tolerant programming language. It will often attempt to understand what
    you are trying to do even if you haven''t written the code in the best possible
    way. This can be a good thing, particularly if you are a sloppy programmer. However,
    this can also be a bad thing as it will very well make you a sloppy programmer.
    Frankly, Perl has a few ways of forcing you to write better code and by “better”,
    we mean more accurate, understandable code that is less prone to causing unintended
    effects.


    # Example 4.3.1


    The first and easiest way to get Perl to improve our code is by making warn us
    when we are doing something stupid or undesirable. We can achieve this by adding
    a single line of code to the header section of our scripts:


    +   1. # helloworld.pl by _insert_your_name_here_

    2. use warnings;

    3. print("Hello World!\n");


    Understanding the script

    Line 2 is the only difference between this script and the original version. This
    line effectively tells Perl that we would like to be warned if we start writing
    certain types of “bad” code. You can read this line of code as “Before we go any
    further with this script, please turn on all of the extra checks that are specified
    in the set of rules warn-warnings.” Technically, these sets of rules are known
    as pragmas and Perl has more than 40 of them. However, in common practice you
    will probably only use a few of them.


    When you run this script you might be disappointed to see the new use-warnings;
    line makes no difference whatsoever. This is because the script doesn''t contain
    any code that would cause a warning. However, as you don''t know what all of the
    bad things are might cause warnings, you should get into the habit of including
    this in every script you write. This is another point that bears repeating:


    > Always, always, always include “use warnings” in your Perl scripts!


    # Example 4.3.2


    Let''s write a script where the warnings pragma will actually be of use.


    +   1. # warn.pl by _insert_your_name_here_

    2. # use warnings;'
