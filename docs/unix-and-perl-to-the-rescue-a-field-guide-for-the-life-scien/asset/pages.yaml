  md: '# Nested conditionals


    Conditional statements can contain other conditional statements. To show the hierarchy,
    we will increase the indentation of the code, again by using the tab character.


    # Example 4.6.2


    ```

    1. #!/usr/bin/perl

    2. # nested_conditional.pl

    3. use warnings;

    4.

    5. $x = int rand 20;

    6. print "$x is $x\n";n7.

    8. if ($x < 10) {

    9. print "$x has a single digit\n";

    10. if ($x % 2 == 0) {

    11. print "$x is an even number\n";n12. }

    13. }

    ```


    Understanding the script

    Line 5 creates a random number which is then printed on line 6. Note how we omitted
    the parameters from the int() and rand() functions. Line 8 starts a nested conditional
    and we add a second conditional statement on line 10. The print statement on line
    11 will be executed if $x is less than 10 and $x is an even number. In case you
    forgot the % operator does, it performs an integer divide and returns the remainder.

    Note the extra indentation on line 11; it is common to see Perl scripts with many
    levels of indentation. With experience, it becomes easy to glance at a Perl script
    and see which parts of the code are “at the same level.


    Evaluating truth in Perl

    So far have shown that we can use conditional statements to test whether certain
    mathematical operations evaluate to true or false. But Perl, along with most programming
    languages, lets you test anything evaluate to true or false. This initially seem
    strange, but it becomes a very powerful tool of programming. Compare the following:


    ```

    if ($x > 0) { code if true }

    if ($x) { code if true }

    ```


    The second example might confuse you. What does it mean to ask whether a variable
    (or string) is true? Well, in Perl, most things evaluate as (logically) true,
    and it is therefore more important to first consider what is evaluated as false.
    Zero is logically false.'
