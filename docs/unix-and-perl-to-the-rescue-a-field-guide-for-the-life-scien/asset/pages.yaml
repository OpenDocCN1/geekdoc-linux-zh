    # Numeric precision and conditionals


    Although Perl hides the details, numbers in a computer are generally stored either
    as

    integer or floating point (decimal). Both ints and floats have minimum and

    maximum values, and floats have limited precision. You have probably run into
    these

    concepts with your calculator. If you keep squaring a number greater 1.0 you

    will run into an overflow error. In Perl, this will happen at approximately

    1e+308. Similarly, if you repeatedly square a number less than 1.0, you will event-\ually
    reach an underflow error. In Perl, the closest you can get to zero is approximately

    1e-308.


    Floating point numbers do not have the exact value you expect. For example, 0.1

    is not exactly one-tenth. Perl hides these details. Consider the following:


    ```

    $x = 0.1 + 0.1 + 0.1;

    $y = 0.3;

    $answer = $x - $y;

    ```


    From this code you might expect $answer to store a value of zero. However, if
    you

    trying out the value you would see that it equals some small number such as

    5.55111513212578e-17. This is because adding the imprecise 0.1 three times does
    not

    result in the same value as the imprecise 0.3.


    Since floating point numbers are approximations, you should not compare them in

    conditional statements. Never ask whether ($x == $y) if the values are both floats'
