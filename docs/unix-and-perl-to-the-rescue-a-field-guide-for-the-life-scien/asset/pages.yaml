  md: '# Essential Unix


    plain-text files.⁶⁶ The plain-text format is the lingua franca of the computing
    world, and as such can be viewed on any type of computer. Programs that are written
    in any scripting language (Perl, Python, etc.) always use plain text, and it is
    common to see plain text used for documentation, particularly installation instructions.


    # How to tell which files are text files


    The name of a file will help, particularly if it ends with .txt or .text. However,
    because a file is named something like "info.txt" doesn''t absolutely mean that
    it will be a text file. It is perfectly possible, though pointless, to have a
    PNG image file and instead give it a .txt file suffix. Luckily, there is a Unix
    command which can help you determine whether something is a text file or not.
    Here is some example output to show how you can use the file command:


    ```

    $ file Unix_and_Perl

    Unix_and_Perl: directory

    ```


    ```

    $ file manual.pdf

    manual.pdf: PDF document, version 1.4

    ```


    ```

    $ file stuff.gz

    stuff.gz: compressed data, was "stuff," last modified: Thu Jul 29

    ```


    ```

    $ file test.pl

    test.pl: /usr/bin/perl script executable

    ```


    ```

    $ file README

    README: ASCII text

    ```


    Notice that the file command can give you some specific information about different
    file types. It even items when you have a text file which is also an executable
    (in the penultimate example with a Perl script). Finally, notice the name of the
    last file in the list. "README" (in upper-case) is commonly used in Unix as names
    for files that contain useful information. This might be installation instructions
    for a program, or it might be a description/summary of all the files in the current
    directory.


    # Why you should avoid using text-editor applications to view text files


    From time to time you will come across a text file, and your first thought will
    be to switch to the graphical file browser and double click on the file in order
    to open it. This is a bad idea for a few reasons. First, we are teaching you to
    use Unix, so you should avoid using the mouse and graphical managers.


    > ⁶⁶ Note that plain-text files are different from "rich-text" format, which additionally
    let you store basic formatting information (alignment, bold and italics fonts,
    etc.). Plain-text files do not contain any additional formatting. Note that programs
    like Microsoft Word create *.doc files which are actually stored in text, but
    which have a lot of metadata associated with them. This means that you can use
    regular Unix text viewers to look at them, they might not make sense as any meaningful
    content in the document will be buried in a sea of XML tags.'
