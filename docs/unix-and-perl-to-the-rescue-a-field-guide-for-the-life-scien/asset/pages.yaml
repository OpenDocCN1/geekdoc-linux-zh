    # 0.7 Revision control


    This chapter is now at version 1.12


    When you first learn to program in Perl (or any language), you are usually focused
    on the short-term goal of writing a program to solve a specific problem. This
    is obviously an important goal, but in an ideal world you should also consider
    longer-term goals, namely:


    +   (1) What is the best way of upgrading your program to meet future needs?

    (2) Will you ever need to let other people contribute to a script?

    (3) What can you do if you want to use a script on multiple computers?


    You may think that these goals do not apply to your program; you might think your
    script is just a small program that might not need to use again after a week or
    two of use. However, it is often hard to predict what the future holds. Maybe
    your little program grows to be a central tool in your research, and other people''s
    research too. Maybe you get requests to add features to your program or you form
    a partnership with someone who wants to collaborate on the development of the
    code. You may end up having to install your program on every computer in your
    lab, and then you will need a way to keep them all updated with the latest version
    of your code.'
  merge: -1
