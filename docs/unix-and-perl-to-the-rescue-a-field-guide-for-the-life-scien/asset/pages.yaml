    # Hash references and the anonymous hash constructor


    In the last chapter we showed you how to make references to arrays, so it makes
    sense to show how you can also make references to hashes. Surprisingly, hash references
    work in a very similar way to array references. To make a hash reference, you
    also need to use the backslash operator. Let create a simple hash and then make
    a reference to it:


    ```

    my $sound = (dog => ''woof'', cat => ''meow'');

    my $sound_ref = \$sound;

    ```


    As you can see, the syntax for making references is exactly the same as the syntax
    for making array references. As you might expect, there is also an anonymous hash
    constructor that allows you to make a reference without a named hash. The syntax
    is a little different than before; simply substitute curly braces for the parentheses:


    ```

    my $sound_ref = {dog => ''woof'', cat => ''meow''};

    ```


    This produces a hash which has no name, but is referenced by the variable $sound_ref.
    To dereference a single element of a hash, you need to use the -> operator:


    ```

    print $sound_ref->{dog}; # prints ''woof''

    ```


    You can read this as "print the value for the hash key ''dog'', which is pointed
    by the $sound_ref reference." To dereference the entire hash, you prefix the scalar
    with %'
