  md: "will give you a brief explanation at the end of this chapter. But if it seems\
    \ a little complex, don't worry – you will get it when you're older. The main\
    \ take-away message is here that misspelled variable names are now an error that\
    \ will prevent your program from running.\n\n# Scope\n\nScope can be a confusing\
    \ topic. If this section makes your head hurt, feel free to come back to it later.\
    \ But please take this piece of advice with you:\n\n> Always use strict!\n\nVariables\
    \ declared with my are called lexical variables. Lexical variables exist within\
    \ a hierarchy defined by block structure (as denoted by curly braces). A lexical\
    \ variable exists from the line where it is declared until the closing brace.\
    \ Note that every file is also a block, so you can imagine that there are invisible\
    \ braces at the start and end of every file. This means that all of your Perl\
    \ scripts will always contain at least one block of code.\n\n# Example 4.7.6\n\
    \nCreate the following program and run it. The output should be x=1 y=2.\n\n```\n\
    1. #!/usr/bin/perl\n2. # scope.pl\n3. use strict;\n4. \n5. my $x = 1;\n6. if ($x\
    \ == 1) {\n7. my $y = 2;\n8. print \"x=$x y=$y\"\n9. }\n10.\n```\n\n# Understanding\
    \ the script\n\nIn this program, $x is created on line 5 and exists until the\
    \ end of the program (which is also the end of a block). This is not true of $y,\
    \ which is created on line 7 and exists only until line 9. At line 10, $y no longer\
    \ exists. To use the technical jargon, we say that $y is in the scope of the block\
    \ containing the conditional (if) statement. Of the reasons we indent inside blocks\
    \ is to show that all the indented statements belong to the block. That is, $y\
    \ belongs to the block from lines 6–9. It does not exist outside this scope.\n\
    \n² If you find the use of the phrase \"in the scope of\" confusing, you can replace\
    \ it with \"seen by\" or \"available to\"."
