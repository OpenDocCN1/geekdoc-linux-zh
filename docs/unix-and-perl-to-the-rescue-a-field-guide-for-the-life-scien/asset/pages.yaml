    # Reading the contents of text files with the source command


    There is an easy way of telling Unix to read the contents of a text file and treat
    each line of the file as Unix command. You can do this by simply using the source
    command followed by the name of a text file that contains instructions.


    # Example 3.23.1


    Use nano to create a text file in your “Unix_and_Perl” directory that simply contains
    one line with the following:


    ```

