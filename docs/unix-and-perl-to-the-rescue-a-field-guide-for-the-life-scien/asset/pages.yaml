  md: "are separated by semicolons. In this loop we first declare a new variable ($i)\
    \ to act as our loop counter. It is a convention in programming to use $i as a\
    \ loop variable because of the use of $i as a counter in mathematical notation;\
    \ e.g.:\n\n$$\\sum_{i=1}^{d} x_i$\n\nYou could name your loop counter anything\
    \ you wanted to, but we suggest that for now you use i. Let's look at the three\
    \ main components of our loop:\n\n```\n$i = 0 # initialization: start our loop\
    \ with $i equal to zero\n$i < 10 # validation: keeps the loop going as long as\
    \ $i is less than 10\n$i++ # update: $i is incremented by 1 during each loop iteration\n\
    ```\n\nThe contents of a loop are placed in a block of code just like we have\
    \ an if statement. This means that the code has to be enclosed within a pair of\
