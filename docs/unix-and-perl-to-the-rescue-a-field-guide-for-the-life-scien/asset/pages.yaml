    of a class.\nYou are an instance/example of the person class. A mammal is a class.
    For now, let''s consider

    simple car class. All cars have various attributes such as year, model, and color.
    In

    Perl, you access an object''s attributes with the arrow syntax as $object->attribute

    or optionally as $object->attribute Why the trailing parentheses? Because the\attributes
    are actually parameterless functions.'
