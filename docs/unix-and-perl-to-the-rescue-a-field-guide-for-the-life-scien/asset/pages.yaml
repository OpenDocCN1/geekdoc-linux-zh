  md: 'maybe it is going to do something more complex, as count all of the dinucleotide
    frequencies in the sequence. Whatever it we want to do, we clearly need to start
    with the DNA sequence itself. It is conceivable that we might ever want to work
    with a single DNA sequence and therefore could write a Perl script that is specific
    to that one sequence. This is unlikely, however. We should expect any DNA-processing
    program to work on any DNA sequence (within reason: long sequences take up too
    much memory). Our program will need to be somewhere and manipulate the sequence,
    no matter what it is. That''s where variables come in.


    Variables hold data, and the data they are held to vary. In some cases you might
    want to change the data between separate runs of your program – e.g., the first
    run of your program sequence A, and the second run processes B. In other cases,
    you might want to change the data during a single run of the program – e.g., you
    start with a DNA sequence and then you want to clip the ends of the sequence for
    some reason and with the shorter, clipped version.


    In Perl, the main variable type is called scalar variable. A scalar holds one
    thing. This could be a number, text, or an entire genome. We will see other types
    later. You can always tell a scalar variable because it has a $ on the front (the
    dollar sign is a mnemonic for scalar). For example, a variable might be named
    $x. When speaking aloud, we do not say "dollar x"; we just call it "x".


    # Example 4.2.1


    Create a new plain-text document in this editor. Enter the text below and save
    it as scalar.pl in your Code directory (or wherever you are saving your Perl scripts).


    ```

    1. # scalar.pl by _insert_your_name_here_

    2. $x = 3;

    4. print($x, "\n");

    ```


    Understanding the script

    Line 2 is deliberately blank. You should use spaces and blank lines to improve
    the readability of your code. In this script, the header is just a single line
    containing a comment; as we learn more Perl, this header section we are separating
    the script from the rest will get longer and longer.


    Line 3 contains a variable assignment and it is actually doing two things. First,
    it''s telling us that we''re going to be working with a new variable called $x,
    and it''s assigning that a value of 3. Sometimes in Perl, we do these two steps
    (declaration and assignment) separately, and we do them together.


    Line 4 contains the value of $x and then prints a new line. Notice the use of
    the comma inside the print() function. Although we frequently use the print()
    function to print one thing at a time, it can also print multiple things if they
    are separated by commas. A better way of putting this is that the print function
    supports multiple arguments.'
