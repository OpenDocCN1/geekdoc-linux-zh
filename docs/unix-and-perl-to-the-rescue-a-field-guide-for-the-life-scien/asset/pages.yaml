    # 4.22 Data input and output


    The ins and outs of getting data in and out

    So far our programs have only managed to include external data using command-line
    arguments when we run a script. This is a workable solution for simple scripts,
    but generally is not a very common way to receive data. It is much more common
    to have external data in a file, which is then read by a program. Fortunately,
    reading files in Perl is incredibly simple.


    Reading from a file specified on the command line

    The easiest way to read a file with Perl is to specify the file name after it
    is added to @ARGV array); this allows us to use a new operator which looks like
    <. This is Perl''s file operator; it is used to read lines of files and also keeps
    track how many lines it has seen.


