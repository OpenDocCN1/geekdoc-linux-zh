    # Using backreferences


    We have already seen how grouped patterns are stored in the special $1, $2, etc.
    These variables can be used outside of the regex. However, you can also refer
    to any matches from patterns using a regex by something called backreferences.
    These have a syntax of `\1`, `\2`, etc.


    ```

    print "Match\n" if ("woof woof") ~ m/(w{4}) \1/); # matches

    ```


    In this example the `\1` backreference is referring to the pattern that matches
    the preceding grouping characters. So whatever is matched by `\w{4}` will also
    be used as `\1`. Backreferences are therefore well suited for detecting duplicate
    strings — for example, you might want to check whether a DNA sequence contains
    a tandem duplication of any nucleotides:


    ```

    my ($match) = "ATGCGCGCACACCCCTAG" ~ m/([ACGT]{3})\1/

    print "match\n"; # match gets ‘GCA’

    ```


