  md: '# Subroutines


    Subroutines can make the logic of a complicated program much easier to see. We
    use subroutines every day in life. For example, you may think about the errands
    you need to do in a day as “grocery shopping, clean the kitchen, make dinner.”
    Each of these activities encapsulates a great number of specific subactivities.
    Defining subroutines means you can think about the big picture without getting
    distracted by the details.


    # Example 7.4.4


    The following code opens two files and identifies any lines between the files.
    Lines 1–3 read one file, and lines 5–7 read the other. The comparisons are in
    lines 1–9.


    +   1. open(my $fh1, “<", $ARGV[0]) or die “error opening $ARGV[0]"

    2. @line1 = <fh1>

    3. close $fh1;

    4.

    5. open(my $fh2, “<", $ARGV[1]) or die “error opening $ARGV[1]"

    6. @line2 = <fh2>

    7. close $fh2;

    8.

    9. foreach $line1 (@line1) {

    10. foreach $line2 (@line2) {

    11. print $line1 if $line1 eq $line2;

    12. }

    13. }


    This part of the book is about abstraction, but we need to make a slight digression
    for safety. Lines 1–3 and 5–7 are nearly identical. You might rewrite lines 1–3,
    copy-and-paste to get lines 5–7, and then do a little editing as needed. This
    kind of copy-paste programming sometimes leads to horrific run-time bugs. The
    practice is born of laziness, and can do more damage than you possibly imagine.
    Please, try not to do this! Instead, you need to write code twice, write a subroutine
    instead.


    # Example 7.4.5


    This script is functionally identical to Example 7.4.4, but defines a single subroutine
    to retrieve lines from a file.


    +   1. @line1 = get_lines_from_file($ARGV[0])

    2. @line2 = get_lines_from_file($ARGV[1])

    3.

    4. foreach $line1 (@line1) {

    5. foreach $line2 (@line2) {

    6. print $line1 if $line1 eq $line2;'
