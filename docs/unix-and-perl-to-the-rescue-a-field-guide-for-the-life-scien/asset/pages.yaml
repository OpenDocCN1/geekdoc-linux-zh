  md: "# 4.19 Introduction to read this section over and again\n\nYou might are one\
    \ of the most important constructs in programming. Once you have mastered loops,\
    \ you can do really useful programming. Loops allow us to do things count from\
    \ 1 to 100, cycle through each element in an array, or even process line in an\
    \ input file. In general, loops allow us to iterate through a list of numbers\
    \ or a list of things and do or more actions in each iteration of the loop. There\
    \ are three main loops that are used in programming, the for loop, the foreach\
    \ loop, and the while loop; this chapter will focus on the first of these three\
    \ looping mechanisms.\n\n# The for loop\n\nThe for loop generally iterates over\
    \ series of integers, usually from zero to some other number. You can think of\
    \ the integer as a “loop counter” which keeps track of how many times you have\
    \ been through the loop (just like a lap counter during a car race). The for loop\
    \ has three starting components that are specified each time we create a loop:\n\
    \n+   (1) Initialization – provide some starting value for the loop counter.\n\
    (2) Validation – provide a condition for when the loop should end.\n(3) Update\
    \ – specify how the loop counter should be changed in each loop cycle.\n\nIf we\
    \ return to the car analogy, we can imagine a car having to drive 10 laps around\
    \ a circular track. At the start of the race the car has not completed any laps,\
    \ so the loop counter would be initialized at zero. The race is clearly over when\
    \ the counter reaches 10 and each lap of the track updates the counter by 1.\n\
    \n# Example 4.19.1\n\nCreate and run the following program that produces a simple\
    \ for loop which will just count from zero to nine. This is a very short script\
    \ because all loop is going to do is print out the for each iteration of the loop.\n\
    \n```\n#!/usr/bin/perl\n# loop.pl\nuse strict; use warnings;\nfor ($i = 0; $i\
    \ < 10; $i++) {\n    print \"$i\\n\";\n}\n```\n\n# Understanding the script\n\n\
    On line 5 we set up the loop by specifying the three required components (initialization,\
    \ validation, and update). These components are always placed inside parentheses,\
    \ and\n\n> We count from 1–10, but we are sticking with the programming concept\
    \ that arrays start at position 0 rather than 1. This will become more useful\
    \ later, when we start looping through arrays."
