  md: '# Advanced Unix


    +   (4) use the **cut** command to cut$^{34}$ out those values in column 3 (-f
    3), which is the GFF "feature" field;


    +   (5) sort the resulting output alphabetically;


    +   (6) pass the sorted output to the `uniq` command, which removes redundancies
    and keeps only unique output.$35}$


    The second pipeline is identical to the first except that the first `sort` command
    uses the -r option to do a reverse-sorting, it will get the last features on chromosome
    IV (with the highest start coordinates).


    # How to test pipelines


    You may be tempted to write a pipeline that chains together a dozen or so commands.
    If you run a complex pipeline testing it only then it doesn''t find that it work,
    then you will have no idea of how many steps are causing the problem. Therefore,
    when you construct complex pipelines in this way, it is essential to get into
    the habit of testing each step. Check that the output of the first command in
    the pipeline produces what you are expecting (remember, you can always pipe output
    to less or head commands). Then add the second command in the pipeline and test
    again. Repeat for every step until you know what effect every command is having
    on the final output. Also, when testing pipelines you may not need the entire
    input. If your initial data file is large, as GFF and FASTA files are, then might
    take several minutes to run your pipeline. If you had a GFF file which had over
    one million lines, you could first do something like this:


    ```

    $ head -n 10000 big_file.gif > small_file.gif

    ```


    As long as the smaller file is representative of the bigger file, then you can
    use it for all of your testing and things will be much quicker. When your pipeline
    is working with your small test file you should consider moving to working with
    your very large file.


    # How to optimize pipelines


    If you are constructing a pipeline to process a very large file, sometimes the
    order of the commands within the pipeline can be very important. You want to convert
    the DNA sequence of a yeast chromosome to lower-case characters and then use grep
    to show any lines which contain a particular DNA pattern ("atcg"). We could do
    this like so:


    ```

    $ yeast_chr1_dna.fa | tr ''A-Z'' ''a-z'' | grep ''atcg''

    ```


    However, in this we are using the `tr` command to modify every line that is in
    the input file, even though the subsequent grep command might only be keeping
    a small


    34 By default, the cut command assumes that columns are tab-delimited (which is
    the case with GFF files), but you can specify to use other delimiters too (see
    the man page).


    35 This step is not strictly necessary because the sort command has a -u option
    which achieves the same thing.'
