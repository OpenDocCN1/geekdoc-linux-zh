  md: 'the closing brace at line 3, the reference count is decremented by 1 to 0.
    Any memory location with a reference count of 0 is given back to your computer.
    The act of freeing unused memory is called garbage collection.


    Now let''s consider a problem we solved in Chapter 6.3. Specifically, how the
    contents of the @array exist in @table if @array is recreated with each pass through
    the loop?


    +   1. #!/usr/bin/perl

    2. # csv_reader.pl

    3. use strict; use warnings;

    4.

    5. my @table; {

    6. while (<) {

    7. my @array = split(/, /, $_);

    8. push @table, @array;

    9.}


    If you make a reference to a variable with the backslash operator, you increase
    its reference count by one. This is how the memory associated with @array is not
    destroyed each time through the loop. The reference count of the memory associated
    with @array on line 7 is equal to 1. But on line 8, its reference count is increased
    to 2 by the backslash. At line 9, the reference count is reduced by 1 when @array
    goes out of scope. But the memory location still has a reference of 1, so it is
    not freed. Consequently, @table fills up with array references.


    Reference count garbage collection is very efficient, but it has problems with
    circular references. The code assigns $variable a reference to itself, so its
    reference count drops to 1 and never 0. Consequently, $variable keeps allocating
    and never freeing memory.


    +   1. while (1) {

    2. my $variable;

    3. $variable = \variable;

    4.}


