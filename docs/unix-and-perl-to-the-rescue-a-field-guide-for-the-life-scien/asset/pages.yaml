    \ chapter we continue to explore more of references.\n\nPass arrays and hashes\
    \ to subroutines as references\n\nUp to now we have never passed multiple arrays\
    \ or hashes to a subroutine. Why? Because they would get damaged by passing through\
    \ the special @_ variable. Consider the following code:\n\n```\ncompare_two_arrays(@a,\
    \ @b);\nsub compare_two_arrays {\n    my (@array1, @array2) = @;\n    # etc.\n\
    }\n```\n\nThe intention is to fill up $array1 and $array2 in the subroutine from\
    \ the @a and @b arrays via _. Unfortunately, in list context, Perl cannot determine\
    \ the size of the arrays. So what happens is @array1 gets all the data from @a\
    \ and @b, whereas @array2 ends containing nothing. This means you can't ever pass\
    \ multiple arrays to a subroutine. The solution to this problem is to pass references\
    \ to:\n\n```\ncompare_two_arrays(\\a, \\@b);\nsub compare_two_arrays {\n    my\
    \ ($ar1, $ar2) = @;\n    foreach my $e1 (@ar1) {\n        foreach my $e2 (@ar2)\
    \ {\n            # something\n        }\n    }\n}\n```\n\nNow the subroutine is\
    \ passed two things which we can assign to a pair of variables. Those variables\
