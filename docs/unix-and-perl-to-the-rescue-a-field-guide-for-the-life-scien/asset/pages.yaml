    # 4.30 Using functions and subroutines


    Subroutines can get you out of a dysfunctional relationship


    Writing efficient code

    Good Perl programs should not try to reinvent the wheel, and the environmentally
    friendly mantra of "Reduce, Reuse, Recycle" works as well as a manifesto for programming.
    What should you do if two (or more) parts of your Perl script need to do exactly
    the same thing? Maybe you have a script that needs to process two files and count
    how many lines match a pattern in both files. Part of your script might end looking
    like this:


    ```

    my ($file_A, $file_B, $pattern) = @ARGV;

    # file 1

    my $line_count1 = 0;

    open($input_A, "$file_A") or die "Can’t open $file_A!"

    while (<$input_A>) {

    chomp;

    $line_count1++ if m/$pattern;

    }

    close($input_A);

    print "$line_count1 lines matched $pattern\n";n# file 2

    my $line_count2 = 0;

    open($input_B, "$file_B") or die "Can’t open $file_B!"

    while (<$input_B>) {

    chomp;

    $line_count2++ if m/$pattern;

    }

    close($input_B);

    print "$line_count2 lines matched $pattern\n";

    ```'
