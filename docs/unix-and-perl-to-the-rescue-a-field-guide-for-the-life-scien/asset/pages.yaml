    | Argument "xyz" isn''t numeric... | Perl is expecting a number, and you have
    given Perl something else, eq, or a variable containing text |

    | Array found where operator expected... | An operator (e.g., +, =, >, eq) is
    missing and an array has been used instead |

    | bad interpreter: No such file or directory... | Check the first line of your
    script (#/usr/bin/perl); you probably made a typo |

    | Bareword found where operator expected... | Most likely due to a typo in a Perl
    operator; e.g., typing "eq" rather than "eq" |

    | Bareword "x" not allowed while "strict subs" in | You probably left off a $
    @ % on a variable name, or quotation marks of a string |

