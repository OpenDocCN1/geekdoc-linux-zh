  md: '# # Introduction and background


    # ## 1.1 Introduction


    ### Why this book?

    If this book had to have a mission statement, we would say that it is designed
    to help you make the transition from computer user to computer programmer.¹

    We wrote this book with life scientists in mind. But it is equally appropriate
    for anyone who needs to slice and dice large, diverse sets. A few years ago, biologists
    did not need to know how to program. With the arrival of the Human Genome Project
    and other -omic technologies, biology has been transformed into an incredibly
    data-driven science. While the science is moving ahead at a staggering rate, most
    people have not changed themselves to match. Not everyone needs how to program,
    but for those that desire it, this book will help them catch up quickly.

    We have both watched students struggle with trying to analyze amounts of data,
    and sometimes the struggle has not been because the students lack the ability
    to tackle the problem. Rather, it is because they frequently lack the tools to
    program. For many people, data analysis means a "spreadsheet." This is all you
    need, for many problems solution will be faster, easier, and more powerful.

    This is not a book for dummies or idiots. Conversely, it''s also not for super-geniuses.
    It''s for ordinary people who haven''t needed to program until now. Whether the
    topic is language, mathematics, or programming, some people learn faster than
    others. But we all learn to read, write, multiply, and divide. And we can all
    learn to program.\ Rest assured, you can program. We are happy to be your guides.

    Learning to program is a journey. Like other journeys, it takes time and effort.
    But the rewards are worth every step. Not only will you be learning a new skill
    that you can apply to your work, but you will be seeing the world of data from
    a completely different perspective. We guarantee you will find this personally
    enlightening, and we are not exaggerating when your new knowledge will empower
    you more than you can imagine.


    ### Unix?

    The Unix OS has been around since 1969 and it is unlikely to disappear any soon.
    Back then there was no such thing as a graphical user interface (GUI). You typed
    everything. It may seem archaic to use a keyboard to issue commands, but it''s
    much easier to automate keyboard-driven tasks than mouse-driven tasks. There are
    several variants of Unix (including Linux), though the differences do not matter
    much. Although you may not have noticed, Apple has been using the underlying OS
    on all of their computers since 2001.²


    > ¹ Note that this doesn''t mean you need to grow a beard, start reading science-fiction
    books, or wear T-shirts unfashionable geeks slogans. All of these clichés about
    programmers should be tossed aside. Programmers are real people ... most of us
    are anyway.


    > ² If you haven''t noticed it, it''s probably because it is "hidden" behind a
    very sleek-looking GUI. But there''s it nonetheless.'
