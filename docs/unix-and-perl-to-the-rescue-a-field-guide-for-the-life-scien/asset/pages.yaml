  md: 'This will show you quite a bit of information.


    Let''s install a module for descriptive statistics:


    cpan[2>] install Statistics::Descriptive


    You should see some output showing that the module is being built, tested, and
    installed.

    To quit, hit ''q''; now all of your programs can use this module. For starters,
    try getting help about the module using the perdoc command:


    $ perdoc Statistics::Descriptive


    It''s also possible to download a module from the CPAN web site and install it
    without using the CPAN shell. However, the method for doing this is not quite
    user-friendly. After downloading and unpacking the module, there will be a directory
    (based on the module name) which should contain a README and INSTALL file. Read
    and follow the instructions in these files. These will usually be the lines of
    running the following:


    ```

    $ cd module-name

    $ perl Makefile.PL

    $ make

    $ make test

    $ make install

