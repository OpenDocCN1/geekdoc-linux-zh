    terminal and typed:


    ```

    perl helloworld.pl

    ```


    Let''s consider what is happening when we type this. Perl, the programming language,
    is executed on Unix systems by running perl.¹¹¹ Unlike other Unix commands (ls,
    cd, grep, etc.) the perl command is just a file that lives somewhere in the Unix
    directory. On many systems, the perl command (along with many other commands)
    lives inside the /usr/bin directory. If we wanted, we could run a Perl script
    by typing:


    ```

    /usr/bin/perl helloworld.pl

    ```


    We can actually take the location of the perl command and include it within each
    Perl script. With a couple of other small changes, we can run Perl scripts just
    by typing their names.


