  md: 'The combination of Perl and an SQL database is incredibly powerful. But it
    is also a little complicated. We suggest you read the entirety of this book and
    also an introductory SQL book before you mix the two.


    # Relationships


    The previous examples showed how you can use Perl to interact with a simple SQL
    database. However, the database we created was not actually relational. Did you
    notice that the “occupation” field contained redundant data? You may have hundreds
    or thousands of people, yet only a handful of different occupations. We can factor
    out the occupations into a separate table so we have two tables that share a relationship.


    | Name | Address | Occupation_id |

    |---|---|---|n| Steve Jobs | Cupertino | 1 |

    | Jennifer Jones | Nottingham | 2 |

    | Willy Loman | Brooklyn | 2 |

    | Nigel Tufnel | Squatney | 3 |


    | Occupation | Occupation_id |

    |---|---|n| Tycoon | 1 |

    | Sales | 2 |

    | Musician | 3 |


    Factoring out all the common data into separate tables is called normalizing.
    The reverse is called de-normalizing. For greatest data integrity, data should
    be normalized as much as possible. One reason for this is that it makes it much
    easier to change many records at a time. For example, suppose one wanted to change
    the “Tycoon” occupation to “Business.” In a nonnormalized database, one would
    have to change each value of “Tycoon” to “Business.” The normalized database also
    uses less memory, though queries are slower than in de-normalized databases. It
    is therefore a common practice to have two databases with the same information.
    One database is normalized and keeps live data. a de-normalized version is created
    for searching. In a sense, the normalized database is the DNA and the de-normalized
    versions are RNA.¹⁹


    # Documentation


    # Self-help for programmers


    As your software becomes more complex, documentation becomes increasingly important.
    Documentation can take the form of personal notes to yourself, instructions for
    other developers, or manuals for non-programming users.


    > ¹ Probably not the best analogy, but this is what you get from biologist authors.'
