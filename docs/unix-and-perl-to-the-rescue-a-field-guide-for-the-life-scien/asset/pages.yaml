    The first method just reassigns the %@ array to a new list of variables. This
    is useful if the things being shift represent different categories of data. Alternatively,
    if you are passing a list of the same type of things, it is often better to assign
    the data to an array (method 2). For example, if your subroutine was calculating
    some property from a set of numbers, you would probably want to keep those numbers
    in a single array. Method 3 shows that you can keep some items as single scalars,
    and items as an array. The last method exploits a special property of the shift()
    function. Inside a subroutine, each invocation of shift will remove an item from
    the @_ array – shift is just a shortcut for shift(@). It is important to note
    that all of these methods pass copies of the original data. You can modify data
    in a subroutine and it won''t affect the original version of that data.¹¹²


    # Alternative syntaxes when calling subroutines


    So far we have calling all of our subroutines in exactly the same way, placing
    parentheses after the subroutine name, and optionally specifying a list inside
    the parentheses. This is our preferred syntax, and it is also the syntax used
    by most programming languages. We suggest you do not deviate from this practice.
    However, you will see some alternative syntaxes. Let''s look at all the ways that
    we could potentially call the print_error subroutine we saw.


    +   1. print_error(); preferred, with no parameters

    2. print_error(2, 3); preferred, with two parameters

    3. print_error; omitting trailing parentheses

    4. print_error 2, 3); # two parameters, no parentheses

    5. &print_error; prefixed by an ampersand character

    6. main::print_error; prefixed by package name

    7. &:print_error(2, 3); # oh, we make a break!

    8. $obj->print_error(); # OOP syntax


    Lines 1 and 2 demonstrate the preferred syntax. Please use this always.


    Lines 3 and 4 omit the trailing parentheses. It is common to omit parentheses
    for Perl built-in functions like print. You can omit parentheses if you declare
    your subroutines before you call them (i.e., at the start of your program). You
    can also omit parentheses if you prototype your functions.¹¹³


    ¹² There is a reference for a subroutine to process the original version of data
    and not a copy, but we won''t be able to explain this until we have introduced
    the subject of references in Chapter 6.3. This means that if your script has a
    large array that takes up 1 GB of memory, and then you pass that to a subroutine,
    your script will need an extra 1 GB of memory.


    ¹³ Prototyping a subroutine tells what kinds of arguments it takes. This is generally
    necessary in compiled programming languages. In Perl, it is unnecessary and provides
    only a minor convenience. We have omitted its description.'
