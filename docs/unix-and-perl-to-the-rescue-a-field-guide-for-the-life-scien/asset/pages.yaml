  md: 'The second reason is that you might not know what your computer will use the
    default application for opening a text file. It might be Notepad (Windows) or
    TextEdit (on a Mac), but it''s possible that your computer may be set up to a
    program like Microsoft Word to open text files. Using Word to view the contents
    of a file which may contain only one or two lines of plain text is like using
    a sledgehammer to crack a nut.


    Another reason is that you won''t always know the size of the text file you are
    trying to open. In science, and bioinformatics in particular, it is certain that
    a lot of raw data is stored in very large text files - e.g., a file containing
    the human genome sequence might be about 3GB in size. The aforementioned text
    editors will try to open the entire file at once, which may cause problems if
    your computer does not have sufficient memory. It may even crash the program –
    if it doesn''t, it might make program run very, slowly.


    A final reason for not using text editors to view text files is that editors can
    also edit it. If you accidentally slip on a key while viewing a file you might
    change the contents, and many editors have an autosave function, you might be
    permanently changing the contents. For data files used in science, this is generally
    known as a very bad thing! If you only want to view a text file, use a viewer,
    not an editor.


    # The less program


    Once upon a time the most popular text-viewing program on Unix was a program called
    more. But then someone came with a similar program that offered more functionality,
    and they decided to make less. Any time you need to view a text file in Unix,
    we suggest using the less program. One nice feature of less is that it handles
    very large text files easily, and if the file is large, it doesn''t try to read
    the entire contents of the file into memory. To view a text file with less, simply
    type less by the file (or files) that you want to view:


    ```

    $ less somefile.txt

    ```


    We have already seen the less program in use; any time you view a main page you
    are probably seeing less in action (see Chapter 3.13). We documented the most
    basic keyboard controls that are in earlier chapter. Some additional keyboard
    controls that are useful to know:


    +   - access "help" page (press "q" to quit help)

    - jump to start of file

    - jump to end of file

    - start searching forwards in the file

    - start searching backwards in the file


    If you searching you must also specify a pattern to search for – e.g., if you
    are viewing a file with less and you type:


    ```

    /cheese<enter>

    ```


    > 67 The "more" program is still installed on most Unix systems.'
