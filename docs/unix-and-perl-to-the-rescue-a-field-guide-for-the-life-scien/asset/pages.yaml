    # Solution 4.18.1


    We use @ARGV to store our items, but we also want a suitable die() state to check
    that @ARGV contains at least three elements. Then we can use the sort() function
    to (numerically) sort @ARGV and assign the output to a new array. Highest and
    lowest values will be the first and last elements of this array. To remove the
    elements, we use the shift() and pop() functions:


    +   1. #!/usr/bin/perl

    2. # sort_input.pl

    3. use strict; @ warnings;

    4.

    5. # stop script if there are not enough numbers

    6. die "Specify at least 3 numbers\n" if (@ARGV < 3);

    7.

    8. my @sorted_input = sort { $a <=> $b } @ARGV;

    9.

    10. # discard ends of array

    11. shift(@sorted_input); # discard first array element

    12. pop(@sorted_input); # discard last array element

    13.

    14. print "Final output is @sorted_input\n";'
