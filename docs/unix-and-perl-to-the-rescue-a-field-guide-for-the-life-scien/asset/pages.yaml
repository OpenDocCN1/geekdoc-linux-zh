    # Two-dimensional arrays


    Enough talk, time for some action. Let''s make a two-dimensional array. Here is
    the data we want represent:


    | Mouse | Mus musculus | Rodent |

    |---|---|---|

    | Human | Homo sapiens | Primate |


    We can make ordinary arrays for each row as follows:


    ```

    @row0 = (''Mouse'', ''Mus musculus'', ''Rodent'');

    @row1 = (''Human'', ''Homo sapiens'', ''Primate'');

    ```


    Now we need to put both of these one-dimensional arrays into another array to
    make two-dimensional. There are four different ways we can do this. Let''s start
    using array references:


    ```

    $row_ref0 = @row0;

    $row_ref1 = @row1;

    $table = (

    $row_ref0,

    $row_ref1,

    );

    ```


    Now we have a two-element array, where each element is a reference to another
    array. It is worth pausing to contemplate the data structure we have just created.
    We have a regular array (@table) that can be used just like other array we have
    shown you. The only difference is rather than containing regular scalars, it contains
    scalars that references to other arrays. Also note that this is still a one-dimensional
    array until such a point that you will need to dereference the contents of any
    array element. Only at that point you will be dealing with a two-dimensional data
    structure.


    We can simplify the creation of the @table by omitting the first named references
    for each array – we can add references to the row arrays directly:


    ```

    @table = (

    @row0,

    @row1,

    );

    ```


    Unless you had a specific need to have a named reference to a specific row, this
    is a more straightforward way of creating the two-dimensional table. Now we want
    to show you an even simpler way of creating this through the use of anonymous
    array constructors and named variables:'
