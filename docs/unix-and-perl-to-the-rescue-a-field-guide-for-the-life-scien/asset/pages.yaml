    # Redirecting standard error


    Most of the time you will probably be happy with the default situation, where
    standard output is redirected to a file. But there are occasions when you might
    want to capture standard error to a file too, or maybe turn off standard error
    altogether. This can all be accomplished by Unix, though the implementation can
    vary a little between types of Unix shell.


    The basic point to remember is that Unix uses some "labels" for these data streams;standard
    output is labeled data "1" and standard error is data stream "2". For the sake
    of completeness, we''ll let you know that standard input is data stream "0." You
    mostly need to know how these numbers to redirect standard error. In practice,
    you just need to use these numbers before the redirect operator – let’s look at
    how we can redirect the standard error stream of a command to a file:


    ```

    $ cat hero villain

    ```


    cat: villain: No such file or directory


    ```

    $ cat hero villain 2> errors

    ```


    Spiderman


    ```

    $ cat errors

    ```


    cat: villain: No such file or directory


    The first cat command is the same as in Example 5.6.1 and both output and standard
    error streams get displayed on the screen. The second cat command uses 2> to redirect
    standard error to a file called "errors." When using this syntax, the only thing
    you see on the screen is the standard output (the contents of the "hero" file).
    Note that you must not put a space between the 2 and the when redirecting standard
    error like this. If you wanted to append standard error to the end of an existing
    file, you can do this by using 2>> instead of 2>


    Another common practice is to combine standard output and standard error into
    one stream. If you want to capture errors from a program, they would end up in
    the same file as you redirect standard output. When combining both output streams,
    you need to use ">>" for the redirect:


    ```

    $ cat hero villain &> hero_and_villain

    ```


    ```

    $ cat hero_and_villain

    ```


    Spiderman


    cat: villain: No such file or directory


    > 28 More precisely, these "labels" are known as "file descriptors," but that
    sounded a little boring to us, so we’re calling them labels.


    > 29 Again we warn that your syntax of data redirection can vary slightly between
    different Unix shells and that there are also different syntaxes for achieving
    the same thing.'
