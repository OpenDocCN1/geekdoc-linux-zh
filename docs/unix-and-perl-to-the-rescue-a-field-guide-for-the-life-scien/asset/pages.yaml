    If we wanted to change the "chr" to instead say "chromosome," we could do like
    this:


    ```

    $ cat yeast_genome.gff | sed ''s/chr/Chromosome / | cut -f 1-3 | head

    Chromosome I SGD chromosome

    Chromosome I SGD repeat_region

    Chromosome I SGD telomere

    Chromosome I SGD repeat_region

    Chromosome I SGD gene

    Chromosome I SGD CDS

    Chromosome I SGD repeat_region

    Chromosome I SGD nucleotide_match

    Chromosome I SGD binding_site

    Chromosome I SGD gene

    ```


    The "s" part of the sed command puts it in "substitute" mode, where you specify
    one pattern (between the first set of forward-slashes) to be replaced by another
    pattern (specified between the second set of forward-slashes). Note that this
    doesn''t actually change the contents of the file, it changes the screen output
    from the previous command in the pipeline.


    By default, sed only changes the first occurrence of the pattern that it finds.
    Just like in Perl, we can make it perform all possible replacements on each line
    by using a "global" switch. If we wanted to "highlight" potential start codons³⁹
    in a DNA sequence, we could make them stand out like:


    ```

    $ cat yeast_chr1_dna.fa | sed ''s/ATG-/ATG/g'' | grep ATG | head

    AAACCACTGCACACCATACCATACCATACCATCATATC-ATG-ACTCTGACATCACCTGT

    TTTGCTTTACACCATCCATGATGAAAGCTGCTACAA-ATG-ATGCTGAAATAAACACAGCTGGT

    TAGCCACCTATACCACACACC-ATG--CATCCACTCACTTACGTGATGTACTGATTT

    TACGTACCACACGG-ATG-CTACAGATATACCTCATATGCACTTACCTCACTCAGATTC

    TCACTCCTCATC-ATG-GCCCCTCATATCTTGAGTGAGAGTCAAA-ATG-CACTCACCATCATT-ATG

    AGATACAGATATACACCTTTGCTGTGTGTGAACATTC-ATG-GTATACCTAACGTACA

    AATAAGACACAATATGCACTTGAATCTTGTGCCTAGG-ATG-CTATTTCAGAATTTGCTGTTACTTACA

    CAGCCCATACATAGCTTAAGAAT-ATG-CTACACTGTGACATCACTTCTTGATTACCGAGG

    AAATAATGACGAGTGGTCAAACTTC-ATG--GGGGT-ATG-AATACAATATTACTATTTCTT

    ```


    In this example the sed command will process each line in turn, and change all
    occurrences of "ATG" to "-". The -g option on the command, sed would only change
    the first occurrence it finds. Remember, this replacement is occurring on a line-by-line
    basis. If a potential start codon spans two lines in the file, then sed will not
    "see". The sed command is worthy of further study, so you are encouraged to look
    up its man page/or read more about it on the internet.


    ³⁹ Start codons are represented by the nucleotides ATG and are retained at the
    start of protein-coding genes.'
