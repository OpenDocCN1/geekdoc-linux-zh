    ```

    $=$1;for($i=1;$i=$n; $i++){$f=$i}#factorial

    ```


    # Good


    ```

    # factorial

    $f = 1;

    for($i = 1; $i <= $n; $i++){

    $f *= $i;

    }

    ```


    # Spaces


    Keywords like if, else, for, and my, should have whitespace on either side:


    ```

    if($x == 1) # bad

    if ($x == 1) # good

    ```'
