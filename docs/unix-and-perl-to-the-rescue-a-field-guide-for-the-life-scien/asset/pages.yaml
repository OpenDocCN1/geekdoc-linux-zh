    Explanation

    We create a new alias("saycheese") which simply replaces the word "cheese". After
    testing, we modify the alias to instead print "CHEESE" in upper-case characters.
    This new functionality replaces the old behavior and we confirm that there is
    only one alias called "saycheese" by running the alias.


    Aliases that change existing commands

    If you been thinking "Hey, can I make an alias which has the same name as an existing
    command?" then the answer is "Yes you can, but are you sure you want to?" This
    is something that has both advantages and disadvantages. One advantage is that
    you can effectively change the default behavior of a command to include one or
    more command-line options – back in Chapter 3.12 we introduced to you ls -p which
    makes easier to tell whether an item is a file or directory. Some people might
    always like to know this, and think that the extra info you get from this command-line
    option should be the default. No problem! Simply type:


    ```

    $ alias ls=''ls -p''

    ```


    If you do this you will changed the default behavior of the ls command. The ability
    to do this can be really useful to make certain commands safer than normal. For
    instance, if you make alias to rm -i, then you will no longer be able to delete
    a file without first confirming that you really want to delete it. Sounds good,
    right? The problem, though, is what if you forgot you made an alias? Or worse,
    if someone else is using your computer who doesn''t know you have changed the
    default behavior of their favorite command? There is also the potential for causing
    mischief by aliases performing undesirable actions, so please bear in mind that:


    Changing the behavior of common Unix commands with aliases can be dangerous!


    > 71 Just imagine what would happen if someone made an alias called mv that actually
    ran the copy command (cp) instead?'
