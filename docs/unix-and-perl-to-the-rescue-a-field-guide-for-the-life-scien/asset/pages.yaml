    # Reading from standard input


    In addition to reading data from files, and specifying arguments on the command
    line, there is one other way to input data into a program. On Unix systems, standard
    input usually refers to the data that is sent to a program.⁶ When you are typing
    commands in a Unix terminal, standard input is provided by the text you type on
    your keyboard. We can make our Perl programs interactive by allowing them to receive
    input while the program is running. This is done by using a special Perl filehandle
    called STDIN.⁶ The following code will require a user to type some input:


    ```

    print "What is your name?\n"

    my $name = <STDIN>;

    print "Hello $name\n";

    ```


    If you include code like this in your scripts, every time Perl sees <STDIN>, it
    will wait until you enter some text. As soon as you press enter on your keyboard,
    Perl will take all of the text you have typed and, in this case, place it in a
    variable.

    The <STDIN> filehandle can be abbreviated to just <>, but you might remember,
    this is also used to process any files that are specified on the command line.
    Imagine you had the following code:


    ```

    #!/usr/bin/perl

    # stdin.pl

    use strict;

    my $input = <>;

    print "$input\";

    ```


    > ⁶ We explore the concepts of standard input and output in more detail in Chapter
    5.3.


    > ⁶ This is the common name for standard input on all Unix computers.'
