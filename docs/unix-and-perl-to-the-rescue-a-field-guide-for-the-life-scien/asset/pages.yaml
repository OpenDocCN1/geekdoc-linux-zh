    what they are. The one thing to note from this schematic is that there is a “home”
    directory which in turn contains the home directories of three users (“david,”derek,”
    and “nigel”). We then show that David’s home directory contains more directories,
    one of


    ¹⁴ On a standard Windows OS the equivalent to the root level would be C:\


    ¹⁵ These are the directories that occur on nearly all Unix systems.'
