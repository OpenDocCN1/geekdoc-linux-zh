  md: '# Standard input


    Now that we have grasped the concept of standard output and how to redirect it,
    we can learn about the related, opposite, data stream standard input.^25 This
    refers to the data, usually text, that are provided as input for a Unix program.
    Just as there is a default destination for the standard output of commands (the
    computer screen), there is a default source for data standard input – the keyboard.


    Standard input can be a little confusing, but remember that it is only referring
    to the input used by commands. Most Unix commands we have seen so far take their
    input, if required, from a file that you specify on the command line. Consider
    the following simple command:


    ```

    $ some_text_file.txt

    ```


    In this scenario the less command sees "some_text_file.txt" is specified as an
    argument to the command. This is separate from standard input and when you run
    commands like less, you are never prompted to type any input. However, a few Unix
    programs – as tr – will require some typed input after the command starts, and
    this will come from standard input. The tr command functions like the transliteration
    operator in Perl (Chapter 4.12); you can specify a character (or range of characters)
    that are to be changed into another character (or range of characters). After
    specifying which characters are to be changed, you press enter and then the command
    will wait for you to provide some input text that the modifications will affect:


    ```

    $ tr ''A'' ''a''

    CAT

    cat

    BANANA

    banana

    ```


    In this example the user typed "CAT" and the tr command changed the "A" to "a"
    and printed the output. The user typed "BANANA" and the tr command changed it
    to "Banana". To get out of the text input you may use Control + d, which is the
    Unix shortcut that ends text entry. This is a different from how we have using
    Unix, and in this example the text input would rely solely on providing data via
    standard input.


    # Redirecting standard input


    Just as we can redirect standard output to a file, so can redirect standard input
    to come from a file. To do this we use the < operator. Generally, this is used
    less than redirecting standard output, but there are occasions where it is useful
    or necessary. It makes using the tr command much straightforward, as than having
    to type the text we want to change, we can just read it from a file:


    ```

    $ tr ''A027W'' ''a'' < yeast_chr1_orfs.fa

    ```


    >YaOl27 SGDID:S0000000025, Chr I from 94688–95473, Verified ORF'
