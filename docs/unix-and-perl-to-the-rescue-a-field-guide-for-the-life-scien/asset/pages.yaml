    # Searching man pages


    One useful thing to know about the man command is you can use it to search through
    the documentation of all Unix commands. This can be very helpful when you can’t
    remember the name of the command that you are looking for. To achieve this behavior,
    you just need to use the -k command-line option, followed by a keyword that you
    want to search for.³


    # Example 3.13.3


    If you want to see which commands might be related to compressing files, you could
    try the following command:


    +   $ -k compress

    compress(1),uncompress(1) – compress and expand data

    gze(1) – compress executable files in place

    gzip(1),gunzip(1),zcat(1) – compress or expand files

    zcmp(1),zdiff(1) – compared compressed files

    zip(1) – package and compress (archive) files

    zlib(3) – compression/decompression library

    new(1) – recompress .Z files to .gz files

    zopen(3) – compressed stream open function


    # Explanation


    The output consists of a list of other Unix commands that feature the keyword,
    along with a brief description of that. Don’t worry too much about the numbers
    that appear parentheses after the command names.³ Note that we are only showing
    some of the output from this command; one of the problems of searching man pages
    is that a simple keyword can appear in the text of dozens of different man pages.
    If you have more than a page of output, you’ll have to use the man page viewer
    to exit back to the command-prompt (i.e., press q to quit).


    > ³You can also use a completely different command (apropos) to search man pages.
    The apropos command requires a -k command-line option. Sometimes allows you to
    achieve the same goal in two different ways.

    ⁴Man pages are divided into numbered sections, and the number of the section that
    appears after the command name. Regular Unix commands are in section 1 (you will
    probably never need to know any more about what the other sections cover).'
