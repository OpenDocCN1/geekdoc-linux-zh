  md: '# Advanced Unix


    You should try to ensure that any redirected output file makes sense and informs
    you about what data it might contain.23 The simplicity to redirect program output
    gives you much more power as you can now save the results of your commands.


    # Appending to an existing file


    Sometimes you will want to create a new file from the output of a Unix command,
    but many times you might want to add to an existing file instead. You can easily
    do this with the append redirect operator. Imagine that you had a text file which
    you just needed to add one more line to. Rather than using a text editor, you
    could use the echo command and append the output to the file like:


    ```

    echo "P.S. I''m learning Unix ... it''s great! >> letter_to_grandad.txt

    ```


    Bear in mind that appended text gets immediately after the last character in a
    file; Unix won''t insert a blank line for you.


    # Using redirects with the cat command


    The cat command that was used in the previous chapter becomes much powerful when
    used in conjunction with the redirection operators. For example, imagine you have
    some files that you want to combine into one larger text file. You could do this
    like so:


    ```

    $ cat a.txt > all.txt

    $ cat b.txt >> all.txt

    $ cat c.txt >> all.txt

    $ cat 1.txt >> all.txt

    $ cat 2.txt >> all.txt

    $ cat 3.txt >> all.txt

    ```


    In this example the contents of each successive file are added to the contents
    of all.txt, which is created by the first command (the only one to use the standard
    redirect operator rather than the append operator). Of course, you could also
    do this in one line, like:


    ```

    $ cat a.txt b.txt c.txt 1.txt 2.txt 3.txt >> all.txt

    ```


    The cat command will read each file and redirect all output to a single file.
    You can further shorten this operation by a wildcard character:


    ```

    $ cat *.txt >> all.txt

    ```


    However, this method does not give you any control as the order in which files
    will be combined.24 They will be combined in an order determined by the ASCII
    values of their file names, meaning that files that start with numbers would appear
    in the final output before any file that starts with letters.


    > 23 The world of Unix practitioners is full of people who stare at their directory
    listings and ponder what might be contained in file names "output" or "file."
    Just because you know today that a file called "stuff" contains some really important
    results, does not mean this in a week to come.


    > 24 It would also capture txt files that you might not want included in all.txt.'
