    # GFF


    GFF (generic feature format) is a text-file format used extensively in bioinformatics.
    It is used to describe details of genomic features, notably their coordinates
    in relation to a larger sequence (e.g., a gene, a BAC clone, or an entire chromosome).
    Historically, GFF was mostly used to describe details of genes (e.g., their exon/intron
    structure), but is now used to describe just about any feature that can be localized
    to a region of the sequence. The region in range from a single nucleotide (nt)
    up to the entire length of the sequence.

    GFF files always consist of nine tab-delimited columns of information. Each column
    contains a certain type of information:


    +   (1) Sequence name – this could be the name of a BAC clone or the name/number
    of a chromosome or chromosome arm.

    (2) Source – when most gene information was provided in the form of predictions,
    the source column would typically list the program that was used to predict the
    gene structure. These days this field is often repurposed for different means,
    and might contain the name of the database from which the GFF file was produced.

    (3) Feature – the feature is the item that the line is referring to. It might
    be a well-known biological entity such as an exon or an intron, or it might refer
    to more generic elements such as “repeat_region” or “similarity”. Typically, this
    field does not contain spaces.

    (4) Start coordinate of feature.

    (5) End coordinate of feature.

    (6) Score – this field was commonly used to describe details of whatever score
    a gene prediction program assigned to a feature, i.e., how accurate it believed
    the feature to be. These days this field is typically left empty, though the file
    format requires there to be something present, so you will very commonly use a
    dot character in this column.'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# Introduction to process control


    (7) Strand information – either a plus or minus symbol to represent which strand
    of DNA the feature is associated with.


    (8) Frame – another field associated with gene structure. Specifically, this refers
    to the reading frame of the "exon" or "CDS" feature and the relationship between
    the first nt of the exon/CDS and the codon that the nucleotide is contained in.
    Exons/CDS can be in frame 0, 1, or 2, which means they begin with the first, second,
    or third nt of a codon. As this field is meaningless for any feature which isn''t
    an exon or CDS, it is also common to see this field contain a dot character.


    (9) Attribute field – often used to include one or more database identifiers that
    relate to the feature in question. Some databases add a lot of information to
    this field which makes the whole line wrap around your screen.


    Here is a short example of a GFF file, taken again from the SGD database:


    ```

    chrI SGD repeat_region  1 62      - - ID=TEL01L

    chrI SGD telomere        1 801      ID=TEL01L

    chrI SGD repeat_region  63 336      - ID=YAL069W

    chrI CDS                335 649     +,- + 0 Parent=YAL069

    ```


    Note that different lines can overlap in their coordinate space. GFF files will
    sometimes contain a feature called "chromosome", the coordinates of which define
    the range of all features. Also note that in the case of the last two lines, there
    are two different features ("gene" and "CDS") that occupy the same range of coordinates.
    Overall, each line in a GFF file should be unique.


    As we learn more about the myriad of features that can describe any given genome,
    the size of the respective GFF file for genome continues to grow. It is not uncommon
    to see GFF files that contain over one million lines. Some databases produce GFF
    files for each chromosome, that the first column is the column for all lines in
    the file. Other databases will produce a single GFF file for an entire genome.
    Because each record is contained on one line, GFF files are very suitable for
    processing using Unix commands and Perl scripts.


    # 5.2 Introduction to process control


    # Unix users are licensed to use the) kill (command)


    This book will happily equip you with the skills to run Unix commands and to write
    (and run) Perl scripts. These skills will be treasured; mastery of this knowledge
    will allow you to write many amazing programs and utilize powerful Unix commands.
    However, knowing how to start a program is less important than knowing how to
    stop it. In computer terminology, programs that are running on your computer (including
    Unix commands and Perl scripts) are known as processes; the ability to stop, pause,
    and restart such programs is known as process control.'
