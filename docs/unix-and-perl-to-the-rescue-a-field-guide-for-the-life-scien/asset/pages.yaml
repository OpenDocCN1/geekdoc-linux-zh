  md: '# How to check whether program output using the backticks operator ran successfully


    If you capture program output using the backticks operator, there is always the
    possibility the program didn''t run properly. This may cause your captured output
    to consist of an error message, or may be completely blank. It is a good idea
    to test whether programs ran properly or not; we can do this by inspecting the
    value of yet another of Perl''s special variables, $. This variable stores the
    exit status from any program you are running. If a program runs successfully then
    the value of $ will be zero.


    # Example 4.2.9


    This script uses backticks to run the Unix which command in order to determine
    the location of a program specified on the command line.


    +   1. #!/usr/bin/perl

    2. # backtick_error_test.pl

    3. use strict; use warnings;

    4.

    5. die "Please specify the name of a Unix command\n" if (@ARGV != 1);

    6. my $program = shift;

    7.

    8. my $location = `$program`;

    9.

    10. if ($?) {

    11.     print "Error running \''$program\'' command\n";

    12. } else {

    13.     print "$program is located at $location";

    14. }


    Understanding the script

    As long as one, and only one, is specified on the command line, it gets passed
    to a variable $program using the shift function (lines 5–6).

    On line 8, we use backticks to run the Unix command and the results are saved
    to a variable. We then test the status of $ using an if-else block which either
    prints an error message or the location of the specified command.


    # Running other programs with the system() function


    The backticks operator should mostly be used when you want to capture the output
    from a command. Sometimes you might want your Perl script to run other commands
    (including other Perl scripts) which don''t return any output. In these situations
    you should use the system function. Like the backticks operator, system runs a
    command in the shell and sets $ to zero if it succeeds, or a non-zero error code
    if it.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# Example 4.29.3


    Here is a short script that just runs the Unix clear command to the screen. As
    this command produces no output, we will use system to run it.\103


    +   1. #!/usr/bin/perl

    2. # clearscreen.pl

    3. use strict; use warnings;

    4.

    5. system("clear\n");

    6. die("error running clear\n" (\$)?);


    # Understanding the script


    On line 5 we run the clear command via then we test the exit status on line 6
    by inspecting $?, and issue a die command if the clear command did not return
    correctly.\104


    In practice there are easier ways of testing the exit status of a system function
    call than the way I just showed you. If the system worked without any problem
    it will return a zero. This can be tested immediately as part of a logical test
    using the OR operator. Remember that when we use the OR operator, we provide a
    list of conditions to test. Perl checks each condition in turn and as soon as
    any condition returns true, Perl knows it doesn''t need to check the remaining
    conditions. Previously we have used the OR operator as an if statement, but let''s
    see how it can be used on our system with the system function:


    ```

    system("command") == 0 or die "error running command\n";

    ```


    If the system function returns zero, then the "==0" part of the code will evaluate
    and therefore Perl does not need to evaluate the rest of the condition. This means
    that nothing else happens, which is what you want. Alternatively, if system fails,
    it will contain a non-zero exit status. This is not equal to zero and so Perl
    proceeds to evaluate the next part of the condition. In this case, the die function
    must be before Perl can evaluate the truth of the entity, and running the die
    function means the script will run correctly.\105


    The system function is useful when you want to run a command and don''t capture
    the output directly into your script. If you need the output, you can redirect
    the output of the system call to a file and read the output from a file following
    open statement.


    You can use the system() function by passing a list of items, where the first
    item would specify the program you want to run, and the subsequent items would
    become arguments to that program:


    ```

    system("ls -l", $file) == 0 or die "Can''t run ls -l $file\n";

    ```


    > \103 This would be a somewhat pointless script if is all going to run the clear
    command. But for the sake of teaching you Perl, we will lower our standards and
    be a little bit pointless.

    104 Having a die command as the last line of a script is also a little bit pointless.
    Perhaps we should rename this script to pointless.

    105 Alternatively, the syntax: system("command") && die "Can''t run command\n";'
  merge: -1
