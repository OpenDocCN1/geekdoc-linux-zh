    # Understanding the script


    Lines 3–20 define a global variable containing the genetic code.⁸ Since this variable
    is not designed to change its contents, it is declared in all upper-case characters
    to convey that it is a constant.


    21–35 contain two functions that both use the $GENCODE variable. The first simply
    returns a single amino acid character that corresponds to the codon that is passed
    to the function. The second function then extracts a string consisting of three
    nucleotides, i.e., codons. These are used as a look-up key in the %GENCODE hash
    to extract the corresponding amino acid. Each amino acid is then concatenated
    onto the end of a variable that stores the peptide sequence and is returned by
    the function.


    You might wonder why `translate_sequence()` does not call `translate_codon()`.
    This could replace lines 30–32 with a single function call:

    $pep .= translate_codon(substr($seq, i, 3));


    While it is true that such a substitution would make the code more compact and
    abstract, nucleotide sequences can be very long. If you translated an entire chromosome,
    you would end up making millions of calls to `translate_codon()`. Generally, we
    advocate abstraction over performance, but there are situations, like this, where
    the gain from abstraction is minor compared to the obvious overhead.


    # Nested namespaces


    Namespaces can contain other namespaces separated by the double-colon operator.
    This helps organize related libraries. The concept is similar to folders that
    contain other folders. In fact, this is what you need a library that provides
    some descriptive statistics.¹⁰ You would include a statement in your script such
    as the following:


    ```

    use Statistics::Descriptive;

    ```


    This instructs Perl to look for a file called "Descriptive.pm" inside a directory
    called "Statistics". Note that you can have both a directory "Statistics" and
    a library called "Statistics.pm" in the same directory. While nested libraries
    are useful features,


