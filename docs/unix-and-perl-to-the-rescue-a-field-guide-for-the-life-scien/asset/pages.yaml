  md: '# How to turn files into programs


    There are two reasons why the “hello.sh” program did not work. The first reason
    is that, in Unix, you need to explicitly give permissions to files that are going
    to be run as programs. Specifically, you need to add something known as the executable
    permission. The second reason concerns the location of the program. Unix will
    only work in certain locations for files that can run as programs. You either
    have to make Unix know about the location of the “Code” directory or perform a
    little shortcut in to force Unix to look for programs in the current directory.
    We will address both of these issues in the following chapters.


    # 3.27 Unix file permissions


    Permit you to read this chapter

    Files and directories in Unix have three main types of permission:⁹⁰ read, write,
    and execute. A file or directory can have any combination of these permissions
    and they are either “on” or “off.” If you create a new file it will automatically
    read and write,⁹¹ but will not execute permission; this is something we have to
    add manually. Further complicating the issue is the fact that there are different
    levels of permissions: user, group, and other. In Unix, any can belong to one
    or more groups of similar users (e.g., staff, grad students, administrators, etc.).
    It is sometimes useful to have permission to read, execute, or write to files
    owned by other people in the same group as you. Conversely, you might not have
    people who are not in your group have permissions to do anything with your files.
    This is what the “other” level of permissions is for. You can think of this level
    as permissions that control what files and directories are publicly accessible.


    Unix has a single command chmod that controls the read, write, execute permissions
    for any file or directory at all three levels (user, group, and other). We can
    see the current permissions for a file or directory by running ls -l:


    # Example 3.27.1


    Let’s look at the permissions of some files and directories:


    ```

    $ Unix_and_Perl/

    $ ls -l

    total 0

    drwxr-xr-x 3 miguel staff 12 Aug 6 10:01 Code/

    drwxr-xr-x 2 miguel staff 68 Aug 4 14:26 Temp/

    $ ls -l Code/

    total 8

    -rw-r--r-- 1 miguel staff 49 Aug 6 10:01 hello.sh

    ```


    > ⁹⁰These permissions are more technically called “modes”, but we figured that
    “permissions” would make more sense to you.

    ⁹¹It would be odd if this didn’t happen as otherwise you wouldn’t be able to view,
    modify, or remove your own files.

    ⁹²You can think of “user” permissions as those that concern the other of the files
    or directories in question.'
