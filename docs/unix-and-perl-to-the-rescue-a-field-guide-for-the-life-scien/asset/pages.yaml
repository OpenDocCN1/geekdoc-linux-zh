    # README files


    Common way to document your programs is to separate a plain-text file, called
    README. All by itself, a file named README might be confusing, larger programs
    are generally distributed in a directory containing several files. So a file called
    README is not going to be confusing. Other files distributed with software often
    include INSTALLATION, LICENSE, and HISTORY contents of a README are up to you.
    Ideally, you should include some generic information from the outset to let know
    what kind of software it is. You should also include some examples of how to use
    the software in addition to explicit instructions.


    # Plain Old Documentation (pod)


    Perl has a very powerful documentation system called pod. this is a kind of mark-up
    language you can use within your programs. This keeps the documentation and code
    in one file. One of the advantages of pod is that you can export it to a variety
    of formats. This gives your software documentation a professional look.


    A section of pod begins with =head1 and ends with =cut. In the code below, lines
    3–8 are not part of the code, they are part of the documentation. The blank lines
    at 2, 4, 7, and 9 improve readability, and may be necessary depending on the pod
    tool you use (see below).'
