    # 7.3 Code beautification


    # Appearance matters


    Beautiful flawed programs are better than ugly correct programs.

    What? How can a flawed program possibly be better than a correct? Programs evolve
    over time. Features are added and removed. The data they interact with change.
    Programmers also change (even if it is the same person, their programming practices
    change over time). While it is important for a program to complete a task now,
    any really useful program must complete tasks many times in the future. Beautiful
    code is easier to understand, maintain, and extend. Ugly code can be nearly impossible
    to modify or even comprehend.


    You will be in situations where you need to write a short script which is only
    intended to be used once. This will tempt you to write the script quickly and
    you will probably care too much about how it looks. However, when you discover
    that the program will be very useful you promise yourself you will tidy it up
    and make it pretty, "but not right now." A year later you find yourself needing
    to amend that script and open it in your code editor only to realize that you
    no longer have any idea what it is because you never got around to tidying it
    up. It will an ugly mess and you find yourself needing to rewrite the whole thing
    so you can understand it. The obvious solution to this undesirable situation is
    to make all your scripts look beautiful ... all the time.


    Beauty in programming occurs in a variety of different contexts. The code is itself:
    comments, spacing, variable names, etc that lead to outward beauty. There is also
    the inner beauty of abstraction. This chapter deals with the code you see. The
    next chapter addresses abstraction.


