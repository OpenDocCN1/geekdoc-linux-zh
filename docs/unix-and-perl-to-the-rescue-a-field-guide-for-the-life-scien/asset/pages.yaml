    # Repetition operator


    There are many operators and functions in Perl that you may need to use very frequently,
    and the repetition operator is in this category. However, it fulfills a simple
    role of just letting you make multiple repeats of any string. The repetition operator
    is represented by a “X” character.²⁷


    # Example 4.9.3


    As you write these scripts, try to predict what each line is going to do before
    you read the explanation. Also, any time you write a script that uses the rand()
    function, you should make sure run it several times to check if it is giving different
    output time.


    ```

    #!/usr/bin/perl

    # haha.pl

    use strict; use warnings;

    my $number = int rand(20) + 1;

    my $string = ''Ha'' x $number;

    print "$string\n"

    ```


    # Understanding the script


    Lines 5 generates a random number from 1 to 20 and line creates a variable length.
    This does this by using the repetition operator (X). The left-hand operand of
    the repetition operator is a string, and the right-hand operand is a number. When
    you run the program, it will report strings such as “Ha Ha” and “Ha Ha Ha Ha”
    depending on the random number generated.


    > ²⁶ Wikipedia provides a good overview of ASCII along with a list of the ASCII
    values for many different characters: http://en.wikipedia.org/wiki/ASCII.


    > ²⁷ Some people will see this and think it looks like a multiplication operator,
