  md: "Hopefully you have noticed the tremendous amount of redundancy in this code.\
    \ The two halves of the script are essentially identical, except that they are\
    \ working with different files, and use different counter variables. It would\
    \ be much more efficient if we could parcel up all the lines of code that are\
    \ doing the same thing, and treat them almost as a separate script. Then we could\
    \ send it the name of a file and a pattern as input, and get the back line count\
    \ as output. Well, what we have just described is something called a subroutine,\
    \ which are used by all programming languages, including Perl.\n\n# The syntax\
    \ of a subroutine\n\nTo make a basic subroutine we just need to create a block\
    \ of code and give it a name using the special Sub keyword. We then call it from\
    \ somewhere else in the script using the name we have given it. The simplest subroutines\
    \ can be used to achieve some repetitive tasks, by printing a set of error messages\
    \ and exiting a script:\n\n```\nsub print_error {\n    print \"You did something\
    \ wrong\\n\";n    print \"We cannot be held accountable for your stupidity\\n\"\
    ;n    print \"Goodbye\\n\";\n    exit();\n}\n```\n\nThis code describes a subroutine\
    \ called print_error. It is declared with the sub keyword and all the code inside\
    \ the subroutine is indented within a block. Subroutines can be defined anywhere\
    \ in a program, but it is common to put them at the end of a Perl script. In other\
    \ languages you might find them here at the beginning.¹¹⁰⁹You can do either way,\
    \ but try to be consistent. We can run the code contained within a subroutine\
    \ by specifying the name of it from somewhere else in the script. Sometimes you\
    \ might want to call a subroutine if some condition has been met, but you can\
    \ also call it on its own:\n\n```\n# subroutine call with no conditionals\nprint_error();\n\
    ```\n\n```\n# subroutine calls based on conditional statements\nprint_error();\
    \ if ($bad_thing_happened) {\n    print_error();\n}\n```\n\nWe can imagine this\
    \ code being used in a script that has to check for errors in many different places.\
    \ The advantage of using a subroutine for this is that if you need to change the\
    \ error message, you only have to change the code in one place.\n\nNote that when\
    \ calling subroutines we generate parentheses after the subroutine name.¹¹⁰ Because\
    \ of this, you might be thinking. \"Hmm, those subroutine calls\n\n¹¹⁰ Subroutine\
    \ definitions are global, so your script will know how to find them even if the\
    \ code that uses a subroutine occurs earlier in the script than the subroutine\
    \ itself.\n\n¹¹¹ But also the last section of this chapter."
  merge: -1
