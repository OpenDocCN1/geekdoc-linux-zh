  md: '# Library PATH


    From the Unix section of this book, you should be familiar with your $PATH environment
    variable (Chapter 3.28). Just like Unix commands, Perl libraries can exist in
    various places on your computer. In the example, we saw two files Library.pm and
    library_test.pl in the same directory (where we hope did). If you didn''t save
    them in the same directory, you would have seen an error that looks something
    like this:⁵


    Can''t locate Library.pm in @INC @INC contains: /path1/:path2


    Perl looks for libraries in a variety of places, including the current working
    directory. If you want to see all the places Perl is looking, try printing the
    @INC variable.


    +   1. #!/usr/bin/perl

    2. print join("\n", @INC), "\n";\⁶


    If you move Library.pm to any of the locations listed in the @INC array, Perl
    will be able to find it. Some of these locations may be protected, however, you
    shouldn''t put your libraries in those. Instead, you should add your personal
    library location to @INC. Other things there, there''s more than one way to do
    it. First, let''s move Library.pm to another location so Perl can''t find it.


    ```

    $ mkdir lib

    $ mv Library.pm lib/

    $ perl library_test.pl

    ```


    Now running library_test.pl again. If you didn''t see error messages before, you
    should see them now. Perl can''t find Library.pm anymore. There are several ways
    to tell Perl where. One way is to use a use statement in the header of your script.⁷


    ```

    use "/complete/path/to/your/code/directory/lib";

    ```


    The disadvantage of this is if you take your script and move to another computer
    Library.pm file will probably end up in a new location, so you may have to edit
    the script accordingly. An alternative is to use Perl''s -I-command line that
    lets you specify the location of a Perl library:


    ```

    $ perl -I /path/to/library script.pl

    ```


    You can also use this -I as part of the "shebang" line:


    ```

    #!/usr/bin/perl -I /path/to/library

    ```


    However, this raises the same issue as before—you may have to edit your script
    depending on the computer you are working on. On the best way to have Perl library
    paths set is to use the $PERLLIB environment variable. This works similarly to
