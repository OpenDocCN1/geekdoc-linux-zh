    # How to capture parts of a matching pattern


    It is not always enough to know that some texts match a pattern. Unfortunately,
    it is very easy to do extract the specific parts that match. In Perl, we have
    already seen the grouping metacharacters, (), which are used in conjunction with
    the alternation metacharacter 1. These grouping metacharacters can also be used
    to surround parts of a pattern that we want to be extract. If a pattern matches,
    the grouped parts of the pattern are stored in special variables. The first group
    gets saved in a variable called $1, the second group gets in $2, the third group
    in $3, and so on. Imagine that we want to capture two names from a string and
    put those in special variables:


    ```

    "Batman vs Catwoman" ~ m/(\w+)\s(\w+)/;

    $myhero = $1;

    $myvillain = $2;

    ```


    In this example we make groups from the two parts of the pattern that specify
    words. These matches are automatically transferred to the special variables $1
    and $2, which we immediately assign to new variables. It is common to reassign
    the special variables as soon as possible because the contents of $1 be replaced
    if the matching operator is used:


    ```

    "Weather is sunny" ~ m/(\w+); $1 contains ‘sunny’

    "Weather is cloudy" ~ m/(\w+); $1 contains ‘cloudy''

    ```


    # Example 4.28.2


    Imagine we have a file ("dates.txt") which contains dates as part of some longer
    sentences. It might look something like this:


    ```

    I was born on 03/01/1982

    On 11/23/2010 it will be my thirtieth birthday

    I am going to be 21 year

    I’m looking forward to starting my new job on 06/15/10

    Something big is going to happen on 8/8 this year

    10/29/64 was the day that we were married

    ```


    Notice that the third line does not contain any date at all, and the fifth line
    contains an incomplete date (no year is specified). Also, some dates use four
    digits for the year, and others use two. The following script will process this
    file and print out the month, day,'
