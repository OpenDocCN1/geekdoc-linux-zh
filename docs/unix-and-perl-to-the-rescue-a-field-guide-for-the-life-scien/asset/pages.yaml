  md: '# Aligned pipeline construction


    The ability to combine different Unix commands in a pipeline means that knowledge
    of just a handful of commands gives you a diverse toolkit to solve different problems.
    For example, let''s consider how we can create a pipeline to perform a series
    of manipulations to a GFF file (see Chapter 5.1).


    Let''s imagine we are interested in the genomic features that occur at end of
    yeast chromosome IV (the longest chromosome in the genome) are very different
    from each other. We have a single GFF file which contains details of all features
    across the 16 chromosomes of the yeast (17000 features in total). About 2000 of
    these features are on chromosome IV, so we can aim to compare 20 features (1%)
    that occur at end of this chromosome. Before we show you one way of doing this
    with a Unix pipeline, just imagine how you might attempt to do this without knowledge
    of Unix. Would you try to write a Perl script? As you will soon see, many problems
    that might be hard to achieve in Perl can be relatively straightforward in Unix.
    Here is one solution (note that this command wraps on a second line):


    ```

    $ grep -E "^chIV yeast_genome.gff | sort -n -k 4 | head -n 20 | cut -f 3 | sort
    | uniq

    ARS

    CDS

    binding_site

    chromosome

    gene

    nucleotide_match

    repeat_region

    telomere

    $ grep -E "^chIV yeast_genome.gff | sort -r -n -k 4 | head -n 20 | cut -f 3 |
    sort | uniq

    CDS

    binding_site

    gene

    nucleotide_match

    repeat_region

    telomere

    ```


    In just two pipelines we get all the information we wanted and see that the types
    of feature that occur at either end of yeast chromosome IV are mostly the same.
    These pipelines introduce some new Unix commands, which also use command-line
    options. Here is a brief breakdown of how these pipelines work (remember to view
    the pages for these to find out):


    +   (1) Use grep in lines in GFF file which start with the pattern “chIV";

    (2) sort the resulting output with the sort command, but numerically (-n) using
    the values in column 4 (-k 4), which is the start coordinate of each feature;

    (3) use only the first 20 lines of resulting output using the head command;'
  merge: -1
  pgno: 252
