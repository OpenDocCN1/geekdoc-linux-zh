    > Error messages are usually there for a good reason!


    # 5.7 Connecting commands with pipelines


    Improvements to your understanding of Unix is definitely in the pipeline

    Being able to redirect the output of a command to a file, and then being able
    to use that file as input to another command starts to give us the ability to
    build workflows. For example, we could use grep to extract the header lines from
    a FASTA file and then use grep to extract those lines that didn’t contain the
    “Dubious” keyword. Finally, we could count how many lines are in the final output
    by using a program such as the word-count command, wc:


    ```

    $ grep > yeast_chr1_orfs.fa > yeast_headers

    $ grep -v "Dubious" yeast_headers > not_dubious

    $ wc -l not_dubious

    102 not_dubious

