    of chapters, we will learn another way of providing input to commands which will
    be easier to understand.


    # Redirecting standard input and output


    One final thing to mention is that you can redirect both the `input` and `output`
    of a single Unix command. If we revisit the `tr` command one more time, we can
    specify that it reads text input from one file and sends the output to a new file,
    all in one go:


    ```

    $ tr ''A'' ''a'' < yeast_chr1_orfs.fa > processed_dna.fa

    ```


    Once again, we should point out that you won''t see this very much, and if you''d
    prefer not to know about this then we give you our full consent to immediately
    forget about this example.


    > ²⁶ However, there are some command-line options that might not work as expected
    when reading from redirected input. Note, that redirected standard input can only
    read from a single file, whereas you might want `grep` (or other commands) to
    read multiple files.'
