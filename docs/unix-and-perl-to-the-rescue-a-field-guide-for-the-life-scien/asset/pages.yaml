  md: '# Why would we need to stop a program?


    In an ideal world we would all write Perl scripts that are perfectly constructed
    and which always work first. However, we do not live in that world! Let''s consider
    a problematic Perl script:


    # Example 5.2.1


    The aim of this script is to use a for loop to count to 100, but to also print
    an additional message when the counter reaches a user-specified number. Can you
    spot what the problem is?


    +   1. #!/usr/bin/perl

    2. # liveforever.pl

    3. use strict; use warnings;

    4.

    5. # set target number, check it is less than 100

    6. die "Usage: liveforever.pl <target integer>\n" unless (@ARGV == 1);

    7. my ($target) = @ARGV;

    8. die "Target integer must be less than 100\n" if ($target >= 100);

    9.

    10. for (my $i = 0; $i < 100; $i++) {

    11.

    12. # count up to 100

    13. print "$i\n";

    14.

    15. # special message when $i reaches target number

    16. print "$target was your magic number!\n" if ($i = $target);

    17.

    18. }


    # Understanding the script


    The error in this script occurs on line 16. The condition for the if statement
    should only be executed if $i is equal to $target. However, the author of this
    program has a common mistake of making a variable assignment ($i = $target) rather
    than testing for equality ($i == $target). The result is that each iteration of
    the for loop will see line 15 evaluated, and every time we get to line 15 we reset
    $i to the value of whatever $target is. This value will always be less than 100
    (the condition of the for loop) and so the loop will run forever.


    The result of running the code in the example will be a script that will never
    terminate and will fill your terminal window with never-ending output. We therefore
    need to stop the program. But how?


    > In this case, the variable assignment becomes the test for the if statement.
    Because you can always assign a value to a variable, it will always evaluate as
    true.'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# Interrupting a program


    The first thing you can do with runaway programs that need to be stopped is to
    press Control + c. This keyboard combination will send the special interrupt signal
    to stop the command. This should stop most basic Perl scripts that are stuck in
    any sort of endless loop. In fact, this keyboard shortcut works with most Unix
    commands⁶ and is an essential piece of Unix to know if you ever get "stuck." Depending
    on what it is that you are interrupting, you may or not see any additional output.
    In many cases, the command/program will just stop immediately.


    Bear in mind that there may be problems if you interrupt a program before it finished
    – a program may have just made a large temporary file, but was interrupted before
    it deleted it. Trying to stop a program by sending the interrupt signal can be
    useful, but you should also appreciate that not all programs can be interrupted
    in this way.


    # Why you might want to stop a program?


    Having a Perl script stuck in an endless loop is a problem that is easy to quit
    (assuming you are looking at the terminal). However, sometimes an error in a Perl
    script might be causing other problems that might not lead to any suspicious output


    Sometimes you will run a program and not be sure how long it should to finish.
    If you sit there waiting for the final output of the program to appear in your
    terminal window, you might not be able to tell whether the program is still running
    or has crashed (or got "stuck."). Errant Perl scripts might cause your computer
    to run out of memory, or might try to open too many files at once. These types
    of problem can often be "felt" as your computer becomes very sluggish and unresponsive.
    A complication might arise if you are running several (different) Perl scripts
    and/or Unix commands at once.


    In these situations, you ideally need to be able to (1) identify which command
    or program is causing the problem, and (2) stop it. There are several Unix commands
    that exist exactly for this type of process control, and we will briefly introduce
    you to three of them.


    # The top command


    At any time a Unix computer might be running between 50 and 500 different processes.
    Of of the Perl scripts we have seen so far will become a single process when they
    are running. However, more complex programs can be written such that – a word
    processor program might initially consist of a single process, but launch additional
    processes to handle tools such as the spell-checker. Normally, you don''t care
    any of these details, but if you


    ⁵ Try by running a Unix command that will take a long time (such as a recursive
    directory listing of the root directory: ls -R) and then press Control + c to
    check that you can interrupt the command.

    ⁶ Thousands. It depends on the computer, how many users are logged in, and what
    they are doing. After booting up, a typical Mac computer (with a single user logged
    in) might launch between 50 and 100 processes.'
