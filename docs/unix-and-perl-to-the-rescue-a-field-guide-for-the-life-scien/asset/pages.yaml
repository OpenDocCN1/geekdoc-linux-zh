  md: '# The transliteration operator


    part of the substitution operator itself? To cut a long story short, Perl won''t
    be able to process this. There are two solutions to this problem. The first involves
    the process of escaping a character. We first saw this in Chapter 4.10, when we
    were escaping certain printed characters. However, you can also escape characters
    in the matching operators:


    ```

    $text ~ s:http:\\\///;

    ```


    This tells Perl that the first two forward-slashes (which are escaped) are part
    of the pattern. This will work, but it can be confusing to look at, particularly
    when the strings that you are including forward- and backward-slashes. Thankfully,
    Perl allows you to choose alternative delimiters instead of the two forward-slashes.
    The following examples will all do exactly the thing but each uses a different
    set of characters to act as the delimiters for the substitution operator:


    ```

    $text ~ s!http!//@;

    $text ~ s@http://@@;

    $text ~ s#hash##;

    ```


    The last example is another, relatively rare, occasion where a hash character
    doesn''t denote the start of a comment.


    If you use an alternative character that naturally comes in a pair (e.g., curly
    or square brackets, or parentheses), then the syntax is a little different and
    you have to make sure you use the opening and closing character to match the matching
    part of the pattern, and then the same pair of characters to surround the replacement
    part of the pattern. This can actually make things a lot easier to understand,
    as with this example with the tr operator:


    ```

    $text ~ tr [abcdefgh]

    hgfedcba];

    ```


    In this case we use two pairs of square brackets to define the range of characters,
    rather than just three. We have also wrapped one line of code across two lines
    of the editor so we can line up the matching and replacement patterns. The above
    example is functionally equivalent to the following examples:


    ```

    $text ~ tr [abcdefgh][hgfedcba]; # one line, with spaces

