  md: '# Understanding the script


    Line 5 retrieves the country from the command line and stores it in a variable
    called $search. Line 6 ensures that one thing, and one thing only, is specified
    on the command line.


    Lines 8–9 use two arrays to store the names and populations of four different
    countries. Note the use of whitespace to align the name of the country with its
    respective population.


    To find and report the population for a country, the for loop on lines 11–15 compares
    each country name with the search string. When the strings match, the population
    is printed.


    In the above example we have two sets of information that are clearly related.
    Each country has a population, and furthermore each country can ever have one
    value for its population. Our script is to keep track of the association between
    the two data sets because they are in the same order in both arrays. Whenever
    we want to get information about a country we know the name of the country and
    its population will be at the same position in both arrays.


    Using two arrays like this is not a very good solution for storing the association
    between the country''s name and its population. For instance, if we wanted to
    delete a pair of values, we would have to use the splice() function on both arrays.
    As the data sets get larger this strategy also becomes computationally inefficient.
    You have to look through half the records on average before you find the one you
    are looking for.


    Let us see a better way of managing this type of information, way that allows
    us to easily keep the association between pairs of related items. It happens to
    be computationally efficient too.


    # What are hashes?


    In addition to scalars and arrays, Perl allow for a third data type called hashes.
    It is very common to use the analogy of a dictionary when explaining hashes. Entries
    in dictionaries consist of two related concepts: A word that you want to look
    up and associated definition for that. You will never see a dictionary contains
    twice. There is no point because look-up words are clearly meant to be unique.
    The definitions associated with those words do not necessarily to be unique because
    a word can have multiple definitions.


    Conversely, we also know that two different words both have exactly the same meaning.
    If we think back to our previous example, we can imagine that it''s possible (if
    not unlikely) for two countries to have exactly the same population.


