  md: '# 4.13 List context


    Because sometimes, scalars get lonely

    Until now we have only worked with single variables or values, but hopefully you
    have seen that this still allows you to accomplish a lot of tasks. However, we
    often want to work with lists of things. In Perl, if you have multiple scalar
    values in parentheses separated by commas, this is known as list context. Actually,
    it''s still list context even if you have one or zero scalar values in parentheses,
    a list can have one or zero elements. A common use of lists is when we want to
    assign a set of values to a set of variables.


    # Example 4.13.1

    Create the following short program and run it.


    +   1. #!/usr/bin/perl

    2. # list.pl

    3. use strict; use warnings;

    4.

    5. my ($x, $sy, $sz) = (1, 2, 3);

    6. print "$x=$x $y=$y \$z\n";n7.

    8. my ($a, $b, $c) = ("uno", $sy, ''tres'');

    9. print "$a=$a \$b=$b \$c=$c\n";


    # Understanding the script


    The code in line 5 takes a list of three (1, 2, 3) and assigns them to a list
    of three variables ($x, $sy, $sz). Note how we use the backslash character in
    the print statement on line 6 to print the dollar sign. Without using lists, we
    would have to use three separate lines of code in order to declare and initialize
    each variable with a value.\Line 8 is just meant to illustrate that lists can
    contain a mixture of strings and variables. After this list assignment, the new
    variable $b will contain whatever the current value of $sy is.


    # Balancing list items


    If you assign a list of values to a list of variables, it might make sense that
    you should have the same number of values as there are. Maybe we could call this
    a balanced list. However, Perl doesn''t really care if one side of the list assignments
    contains fewer or more than the other side. Perl may not care, but you should!


    ```

    If you need to assign the same value to multiple variables then you could achieve
    this in two lines:

    m ($x, $sy, $sz);

    $x=$sy=$sz=0;

    ```'
