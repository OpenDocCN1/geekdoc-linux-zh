  md: '# Example 3.28.1


    Compare the output from the two following variants:


    ```

    $ pwd

    /Users/nigel/Unix_and_Perl/Code


    $ hello.sh

    bash: hello.sh: command not found


    $ ./hello.sh

    Hello World

    ```


    # Explanation


    The first example fails because Unix assumes we are trying to run a command called
    "hello.sh" so it goes off to look in all the places where it knows commands live
    (more on in a moment). The second example, with the addition of ./ before the
    file name, works and Unix runs the script. You can read this example as "run the
    file called hello.sh''s in this directory and don''t bother looking for programs
    called ''hello'' anywhere else."


    > Don''t worry too much if you find this a bit confusing. The important lesson
    from this is that you have made a script executable you can always run by prefixing
    its name with a path (even if the path is ./). This is a better solution than
    using to use the SOURCE command, but it is still one stop short of being able
    to run our scripts as if they were any other Unix command. However, we are not
    finished yet!


    # Modifying your path


    The final piece of this puzzle is to understand that any time you try running
    a program, Unix will check a list of predefined directories to see if a program
    exists in any of those locations. If it finds a match, then it will run that program
    and stop looking in any other directory. After looking through all of the directories,
    it can not find a match, and it will report the "command not found" error. We
    can see the list of places that Unix looks⁹⁸ for programs by printing the $PATH
    environment variable.⁹⁹ Let''s see what this list looks like for our user, Nigel:


    ```

    $ echo $PATH

    /usr/bin:/usr/sbin:/bin:/usr/local/bin:/usr/X11/bin

    ```


    This output contains a list (separated by colons) of six directories on Nigel''s
    computer which contains programs. When we say "programs" we mean any file that
    has executable permission. Unix doesn''t care what these programs do, or even
    if they work all.


    ⁹⁸ Of course, Unix isn''t really looking and we don''t want to give you a false
    impression that Unix is a sentient being. It just it easier to describe. Otherwise
    we would have to say really things like "code in the computer''s memory determines
    whether the name of the specified file is an exact match to the "names of files
    that are stored in designated arrays that correspond to locations in the filesystem"


    ⁹⁹ See Chapter 3.11 for a refresher on environment variables.'
