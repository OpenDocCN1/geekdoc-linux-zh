  md: 'The best approach to dealing with all of these issues is to develop your program
    from the outset in a way that provides flexibility to cope with all of these potential
    demands. This can be done using something called revision control software.^24$
    The essence of revision control (RC) is that you use some additional software
    to manage the development of your scripts. Let us explore some of the concepts
    surrounding RC before we mention some specific software you can use.


    # Naming scripts and giving them version numbers


    Let''s imagine you have a Perl script called script.pl.^25$ It works and has served
    you well, but now you want to experiment by adding some new functionality. However,
    you also want to keep the original script around in case your new code doesn''t
    work properly. The novice programmer will copy your original script and rename
    the new version something like script2.pl.


    You may be thinking “where is the harm in that?” but the problem occurs when you
    start adding more and more functionality (as well as bug fixes, speed improvements,
    etc.). Over time your code directory will end up looking something like this:


    ```

    script.pl

    script2.pl

    script3.pl

    script_test.pl

    script2b.pl

    script_new.pl

    script3_1.pl

    ```


    Hopefully you get the picture. It can quickly become a mess and you will lose
    track of which script is doing what. Alternatively, you might decide you no longer
    need an early version of your script and delete it because you have improved it.
    Then you discover, a year after deleting it, that the old version actually did
    right and your later versions introduced some flaws you didn''t appreciate at
    the time.


    Using RC control avoids all of this. Such software keeps merely one copy of the
    script, which is the current, latest copy. However, it also keeps track of all
    the changes you have ever made to your script. Every change you make increments
    a version number for the script. This version number is controlled by the RC,
    but you can also control it when you want your script to switch to a major version
    number (e.g., from version 1.0 to 2.0). RC software doesn''t do all of this automatically
    — there is some work involved on your part, but that work is worth the effort.
    Once you have access to the history of every change you made to a script, you
    can do things such as roll back to an older version, or compare two specific versions.
    From your point of view, you are still working with one copy of your script in
    your code directory, the RC software keeps track of all the changes elsewhere.


    ^24 Also known as version control, source control, or source code management (SCM).


    ^25 Please don''t give this name to any of your scripts!'
  merge: -1
