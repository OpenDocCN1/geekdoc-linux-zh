  md: '# How does hashes in Perl?


    Just like our dictionary example, hashes in Perl associate pairs of items. Strictly
    speaking, we say that a hash contains keys and values. A key is a look-up word
    in a dictionary, and the value is like a definition. One small deviation from
    our analogy is that a regular hash in Perl has only one value for each key. However,
    it is possible – and often desirable – to associate many values to one key. That
    will be covered in Part 6 of this book. Once you create a key–value pair in a
    hash, you can always access the value if you know the key. Hashes should be used
    for storing things that have some sort of meaningful connection. Here are some
    possible key–value pairs that we might consider storing in a Perl hash.


    | Key | Value |

    |---|---|

    | Social security number | Name |

    | Zip/postal code | State/county |

    | Computer number serial | Make and model of computer |

    | Running distance | World record at that distance |


    These examples use keys that will contain unique values – there is only one zip
    code with the value "9516". Try not to fall into the trap of assuming that a key
    is going to be unique. For example, certain actors'' names "Harrison Ford" are
    so famous that we ever think of one person, but according to IMDB there are two
    famous actors with that name.⁷


    # Hash syntax


    Just as we dollar signs to denote scalar variables ($variable) and “at” symbols
    to denote arrays (@array), we use another character to represent hashes: the percent
    sign (%hash). We only use the percent sign when we are referring to the entire
    hash. When we refer to one thing in the hash we use a dollar sign and a pair of
    curly braces. Consider the following code:


    ```

    my $zip_code;

    $zip_code{''95166''} = "California";

    print "\$zip_code{''95166''}\n";

    ```


    Here we declare a hash and add one key–value pair to the hash. When we deal with
    individual items in the hash, the key is always placed after the hash in curly
    braces we prefix the whole thing with a dollar sign. This is logically consistent
    with how we deal with single items in arrays, which also use dollar signs. The
    final line above would print the value associated with the key "95166," and so
    would print "California.".


    Note that a hash cannot contain multiple entries that use the same key:


    ```

    my $favorites;

    $favorites{''food''} = "cheesurgers";

    ```


    ⁷The first Harrison Ford actor was a leading man in the silent film era and starred
    in 87 films.'
