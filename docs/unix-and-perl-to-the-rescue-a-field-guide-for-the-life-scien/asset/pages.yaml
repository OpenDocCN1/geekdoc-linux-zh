  md: '# The dot metacharacter


    Outside of a regex, the dot symbol acts as Perl''s concatenation operator. However,
    inside a regex the dot metacharacter has a very simple meaning: match any single
    character.⁹ This means you can use the dot metacharacter as a wildcard to match
    anything at all:


    ```

    $text =~ m/at/; # matches bat, cat, hot, 4at, @at.

    $text =~ m/^...$/ # matches anything with exactly three characters

    ```


    You should only use the dot metacharacter if you know that a character in your
    pattern can be anything at all (including spaces and all of punctuation). Usually,
    this is not the case and we often find that we want a letter, number, or range
    of certain punctuation characters in a particular pattern.


    # How to match special characters


    Consider the following code; will the print statement be executed?


    ```

    my $text = "A common plant used in research is A. thaliana\n "Text contains pattern\n"
    ($text =~ m/A/i);

    ```


    This code will print the specified statement, but can you see what of $text the
    pattern is matching? It actually matches in six different places. The dot in the
    pattern is acting as a metacharacter and not as a regular period. It means anywhere
    in $text where there is a letter "A" (upper or lower-case) followed by any single
    character. From Perl''s point of view, so finds any match it will execute the
    print statement, and so it is actually matching the first two characters of $text
    (the letter "A" and the space character).


