    # 6.2 Function libraries


    Write once, use many times

    At the End of Part 4 of this book, we learned we could parse useful pieces of
    code into subroutines. At some point you will create an augmenting subroutine
    that performs some piece of Perl magic, and you will realize you want to perform
    the magic in another program. The obvious solution is to copy-and-paste the subroutine
    from one program to another. Since subroutines are like mini programs, this often
    works just fine. But what if you discover an error in the function and now you
    want to fix all the programs that you use with the function. Not only is this
    laborious, copy-and-paste is one of the more heinous crimes in programming. Thankfully
    there is a better solution.


    # Modules


    Function library is a file of functions that can be shared among programs. You
    only have to write the function once, and you can reuse it in as many programs
    as you want. In Perl-speak, a suffix is called a package or module. Perl module
    files are saved with the .pm extension. The first line of a module uses the package
    statement and the last line is simply 1;. All of the functions go between those
    statements. There is no limit to the number of functions you can place in a library.
    Enough talk, let''s see this in action!


    # Example 6.2.1 Library.pm


    Save the following code as "Library.pm" in the directory where you store your
    Perl scripts. This is not a particularly descriptive name, but it will do for
    now.


    +   1. package Library;

    2. use strict; use warnings;

    3.'
