    Note that if the user specifies the -h option for "help", then the script will
    print the usage statement and exit. This is another commonly used method of printing
    a usage statement and -h which will, but not always, print out help information
    in Unix programs. This script includes two ways of printing out the help information
    – this is a good thing!


    Experiment with the following command-line options of getopt_std.pl to see what
    happens:


    ```

    $ getopt_std.pl # prints usage

    $ getopt_std.pl -h # prints $usage

    $ getopt_std.pl -v # prints version

    $ getopt_std.pl -X # reports an error: there is no option -x

    $ getopt_std.pl -fpx # reports flag on, -p is x

    ```


    Getopt::Long

    Getopt::Long is used for longer, more descriptive options, for example --version.
    Option names are preceded with two dashes. For options that take an argument,
    you do not need the space between the option and the argument. You can either
    use --option x or --option=x. Here is the equivalent template.


    # Example 6.7.2


    +   1. #!/usr/bin/perl

    2. # getopt_long.pl

    3. use strict; use warnings;

    4. use Getopt::Long;

    5.

    6. my $usage = "usage: getopt.pl [options] <arguments>..."

    7. options:

    8. --version

    9. --help'
