  md: '# Example 7.4.6


    +   1. # SequenceTools.pm # actual code omitted for brevity

    2. sub read_sequence {}

    3. sub codon_usage {}

    4. sub melting_temperature {}

    5. 1;


    In order for Perl to find your library, it must be in the library path (see Chapter
    6.2). To use the library, you simply use it. The program to calculate melting
    temperature would look like this:


    # Example 7.4.7


    +   1. #!/usr/bin/perl

    2. use strict; use warnings;

    3. use SequenceTools;

    4. my $dna = read_sequence($ARGV[0]);

    5. my $tm = melting_temperature($dna);


    There is a major problem with creating libraries this way. Suppose you use two
    libraries and each defines a function read_sequence(). Which function will be
    called? Frankly, Perl reports an error message, but how do you prevent this situation?
    In the C language, the convention is to fix function names with the initials or
    an abbreviation of the library. So read_sequence() might become st_read_sequence().
    You could do this in Perl, it would be a little strange because there is a much
    better alternative. The package statement allows you to associate functions with
    specific libraries:


    # Example 7.4.8


    +   1. package SequenceTools;

    2. sub read_sequence {} # actual code omitted for brevity

    3. sub codon_usage {}

    4. sub melting_temperature {}

    5. 1;


    Example 7.4.8 contains a package statement. This creates a namespace, here called
    SequenceTools. All the subroutines in SequenceTools actually have longer, more
    formal names. The scope operator :: separates namespaces from functions (and other
    namespaces). The result of this is that the name of a function as codon_usage()
    can be more formally referred to SequenceTools::codon_usage(). Namespaces can
    contain other namespaces. Think of a namespace as a directory, and subroutines
    as files.'
