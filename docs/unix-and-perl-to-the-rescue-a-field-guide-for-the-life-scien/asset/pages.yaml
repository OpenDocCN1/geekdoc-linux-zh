  md: "# Using the special variables ($1, $2, etc.) in substitutions\n\nWe often have\
    \ text from which we want to remove characters from either end. For example, maybe\
    \ the text contains quotation marks that we want to delete, or maybe we want to\
    \ strip the \"www\" and \"com\" parts from a web address. This becomes very easy\
    \ to do using regex with the substitution operator. We can use the grouping operators\
    \ to capture the text we want and keep then just use $1 as the replacement part\
    \ of the substitution:\n\n```\n$ $url = \"www.perlforever.com\";\n$url ~ s/www\\\
    /([w+]+\\.com/$; # $url now contains 'perlforever'\n```\n\n# Looping through multiple\
    \ matches\n\nWe can use the grouping metacters to capture multiple parts of a\
    \ matching string, but this is only useful if you know exactly many matches to\
    \ expect. If you don't know how many matches will be in a string, then we need\
    \ to do something different. Imagine we have a string that contains an unknown\
    \ number of addresses that we wish to capture:\n\n```\n$mytext='Emailatcaptain.kirk@starfleet.comorjim_kirk@email.com';\n\
    ```\n\nWe could make a regular expression to capture a valid address but if we\
    \ try to use it with the matching operator, it will only ever the first match\
    \ address:\n\n```\nif ($text ~ m/([w\\.]+)@@[w\\.]+[a-z]{2,4})/i)\n  myemail =\
    \ $1; # $email gets captain.kirk@starfleet.com\n}\n```\n\nTo solve this problem\
    \ we need be to loop through all possible matches in our input string. This can\
    \ be achieved by using a while loop in conjunction with the global match option\
    \ (/g), which we first saw in Chapter 4.11:\n\n```\nwhile ($text ~ m/([w\\.]+)@@[w\\\
    .]+[a-z]{2,4})/g)\n  myemail = $1;\n}\n```\n\nThis loop runs as \"while\" we can\
    \ keep on finding matches to the pattern in $text, put each match in turn into\
    \ $1. It is important to include the global match option after the pattern, otherwise\
    \ the loop will never end.\n\n# Capturing all matches in one go\n\nRather than\
    \ looping through all possible matches in a string, we can also assign the result\
    \ of the matching operator to an array, and each array element will contain each\
    \ of successive matches. You still need to use the global match option:\n\n> 98\
    \ The string is deliberately in single quotes so that we don't need to escape\
    \ the $ with a backslash. Otherwise, Perl would think we were including some array\
    \ names, and would try to replace them with their contents.\n\n> 99 This is not\
    \ a straightforward problem, and the regular expression we use here is a very\
    \ simplified pattern that will not match all addresses."
  merge: -1
