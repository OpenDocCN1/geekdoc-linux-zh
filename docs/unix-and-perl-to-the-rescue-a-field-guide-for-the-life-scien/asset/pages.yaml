  md: 'placed both the first and last names in the first column and left the second
    column empty. A script that processes such a file could break if the last name
    was absolutely required. Data that is automatically produced can also contain
    human errors because humans program the machines. You must get in the practice
    of checking the integrity of your data at every conceivable step. Sometimes these
    measures will seem terribly sily, but such "sanity checks" can identify serious
    problems with the data and save countless hours of work.


    # Text vs. binary files


    The first sanity check is to ensure your data file is in a plain-text format and
    is not a binary file.30 Text files often have a .txt extension to their file name,
    but they can have many other extensions or no extensions at all. The only thing
    you can really say about a file that ends "txt" is whoever intended for it to
    be a text file. Binary files can have file extensions such as .exe or no extension
    at all. A binary file can have a .txt, it would probably be a file error if one
    did.

    Ultimately, there is no guarantee that you can determine if a file is text or
    binary by the file name alone. For this reason, you should always look inside
    a file to determine what kind of file it is. One of the simplest ways to access
    a file is to read it with the Unix command. Locate a music or photo file on your
    computer and try reading it with less. If it is a binary file, less may issue
    a warning as follows:


    "Customized.mp3" may be a binary file. See it anyway?


    If you continue ("y”), you may find some unintelligible output. That''s because
    the file is binary. Try with any of your Perl or Unix scripts and you will see
    no warnings. So how does less know what is not binary? Text files have a very
    specific pattern due to the way they map bits to symbols. The most common encodings
    are UTF-8 and ASCII.31 In these eight-bit encodings, each letter (or symbol) corresponds
    to exactly one. For example, the binary string 01100101 corresponds to the letter
    "e". Even though there are eight bits in one, the highest (farthest left) is not.
    If you used the bits of a text file, you would therefore see a regular pattern
    where every byte begins with a zero. Here is an example of four bytes from a text
    file.


    ```

    01100101 01110100 01110101

    ```


    +   Binary files can encode their data however the author choose. The first bit
    of a file is not always zero. This makes it fairly simple for a program like less
    to determine if a file is binary or not: look at the first bit of every byte.


    An alternative way of determining what "type" a file is, is to use the Unix command.
    This will tell you whether a file is text or not, plus it will provide you with
    a lot of other information:


    > ³ Perl can read binary files as well as text files, but in this book we only
    discuss text files. They are easier to process and are human-readable.


    > ¹ These encodings are mostly interchangeable. We recommend people look at the
    Wikipedia page for ASCII.'
