    \ $s1 . $s2;\n8. \n9. my $s3 = $s1 . $s2;\n10. print $s3;\n\n# Understanding the\
    \ script\n\nIn this example we join two strings ($s1 and $s2) and immediately\
    \ print the concatenated result. It's important to realize that the concatenation\
    \ happens before the print() function. This would be more obvious as print($s1\
    \ . $s2). Always include spaces on either side of the dot character to improve\
    \ the readability of your code.\n\nIn this case, we concatenate four strings:\
    \ the word \"Hello\", a single space character, the word \"World\", and a newline\
    \ character. Notice that we are using single quotes for the first three strings,\
    \ double quotes for the last. The last string needs double quotes so it is recognized\
    \ as a newline character and not just a backslash and \"n.\" You will often see\
    \ Perl scripts that use double quote characters when single quotes are equally\
    \ valid.\n\n> ⁵ In many languages, including the next major revision of Perl (version\
