    foreach $card (@address_book) {

    push @{$index{$card->{name}}}, $card;

    }

    ```


    This means that %index is a three-dimensional data structure! Dimension 1 is a
    hash where the key is a name, and the associated value is a reference to an array.
    Dimension 2 is the array of cards associated with each name. Dimension 3 is the
    attributes on the cards. Unsurprisingly, this can be very confusing, let''s access
    a single element to make the dimensions obvious. Suppose I want to get the email
