  md: "# Essential Perl\n\nand for any line that contains a complete date. To run\
    \ this script, you'll need to recreate the dates.txt file and specify this when\
    \ you run the script:\n\n$ find_dates.txt dates.txt\n\n+   1. #!/usr/bin/perl\n\
    2. # find_dates.pl\n3. use strict; use warnings;\n4. \n5. die \"Please provide\
    \ an input file\\n\" if (@ARGV != 1);\n6. \n7. while ($line = <) {\n8. next unless\
    \ $line ~ m#^\\\\d{1,2}\\/^\\\\d{1,2}\\/^\\\\d{2,4}#;\n9. \n10. $line ~ m#(\\\\\
    \\d{1,2})\\/(\\\\\\d{1,2})\\/\\\\d{2,4})#;\n11. my ($month, $day, $year) = ($1,\
    \ $2, $3);\n12. print \"Month $month, $day, Year = $year\\n\";n13. }\n\n# Understanding\
    \ the script\n\nLine 7 introduces a loop that will loop through all the lines\
    \ in the specified file.\nThe first thing we do inside the loop is check whether\
    \ $line contains a valid date. To do this with a regex \\d{1,2}\\^\\\\d{1,2}\\\
    ^\\\\d{2,4} to match the date. This is not a perfect solution as the year component\
    \ will also match a three-digit year^97 Because our regex expression contains\
    \ forward-slashes, we use a different delimiter (#) for the matching operator.\n\
    \nLine 8 checks for a match as part of a next unless construct. The next command\
    \ will skip to the next input line unless $line contains a date pattern. We could\
    \ have also this with reversed logic, i.e., perform the next command if $line\
    \ doesn't match a date:\n\n```\nnext if $line ~ m#^\\\\d{1,2}\\/^\\\\d{1,2}\\\
    /^\\\\d{2,4}#;\n```\n\nWhen we reach line 10 we know that $line contains a date,\
    \ but we don't know where it is. The regex on line 10 is the same as the one on\
    \ line 8, but now we use grouping metacharacters for the parts of the pattern\
    \ which will become the month, day, and year.\n\nLine 11 uses list to reassign\
    \ the matching patterns from the special variables ($1, $2, and $3)\nNote that\
    \ in practice, we would not need to include line 10 as, as we could instead include\
    \ the grouping metacharacters as part of line 8:\n\n+   8. next unless $line ~\
    \ m#^\\\\d{1,2}\\/^\\\\d{1,2}\\/^\\\\d{2,4}#;\n\nThis line of code would perform\
    \ the twin functions of (1) checking to see whether there is a match, and (2)\
    \ capturing specific parts of the input to $1, $2,\n\n> ^97 We could also make\
    \ a pattern for a two-or four-digit year with (\\\\d{2} |\\\\d{4})."
