    6. $area = $pi * $radius ** 2;


    Using variables achieves two things. Not only does it make the code easier to
    understand, but it is also easier to use. To change the radius, simply change
    one value. Much better! Unfortunately, this still requires the user edit the code.
    From a developer standpoint, you can trust users as far as you can throw them.
    Even if you have a super-strength, don''t encourage users to edit your programs.


    # Example 7.4.3


    It is very easy to bring user-defined parameters into your program. Simply put
    them on the command line.


    +   1. # circle attributes v3

    2. ($radius) = @ARGV;

    3. $pi = 3.1415926;

    4.

    5. $circumference = 2 * $pi * $radius;

    6. $area = $pi * $radius ** 2;


    In any situation where a script contains some parameter that you might want to
    change between separate runs of the script, you should never hard code this into
    your script. Use @ARGV, as in this example, or consider the Getopt Perl module
    (see Chapter 6.7).


    The examples are incredibly simple, but they illustrate two very important points:
    (1) generalization and (2) separation of interface and implementation. To make
    code more general, you should factor out the common parts. For example, rather
    than use 3.1415926 each time you need a value for pi, you can simply define a
    variable and use it throughout your program. We will see greater and greater levels
    of generalization.


    The interface of a program defines how a user interacts with it. The interaction
    might be through a web page, graphical application, or just the command line.
    The implementation is the code itself. Some users are developers, and their interaction
    is not just with programs, but also with subroutines, libraries, and classes.
    Regardless of who the users are, a functional unit of code should not require
    editing. It should have well-defined inputs and outputs and no side-effects.'
