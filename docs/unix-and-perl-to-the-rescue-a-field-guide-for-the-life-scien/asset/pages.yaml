  md: 'function allows you to print a list of arguments (separated by commas), and
    mathematical operations are processed before the arguments are sent to the print()
    function.


    This means that when Perl sees line 8, it realizes that it has to print three
    separate things. First, there is the text "$x plus $y is because this string is
    in double quotes. Perl will check if it contains any variables and then replaces
    the variable name with the contents of that variable. Next, Perl prints the result
    of $x + $y. Because this text isn''t between quotes, Perl knows that you want
    to actually do the math rather than print it as a string. Finally, the third argument
    to the print function is the newline character.


    Line 12 contains the modulo operator %, which is something you may not have seen
    before. Modulo gives the remainder after an integer divide. For example, 7 % 2
    equals 1 because 7 divided by 2 is 3 with remainder 1.


