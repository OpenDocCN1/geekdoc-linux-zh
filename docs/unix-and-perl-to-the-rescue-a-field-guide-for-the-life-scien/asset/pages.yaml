  md: '# 3.7 How to navigate a Unix filesystem


    **It''s time for a change**

    We have previously seen how the ls command allows us to “look” at the contents
    of any directory in a Unix filesystem. It is entirely possible, and sometimes
    desirable, to perform actions with files or folders that are in different directories
    with respect to your current working directory. However, we frequently want to
    change directories so we are in the same directory as some file or program. We
    can do this using the cd command (change directory). Let''s return to our fictional
    Unix filesystem and see how user Nigel could change directory from his home directory
    to the temporary directory "tmp".¹ Feel free to repeat these steps from your own
    home directory:


    ```

    $ pwd

    /home/nigel

    $ cd /tmp

    $ pwd

    /tmp

    ```


    By confirming that we are in Nigel''s home directory by running the pwd command.
    Then we use the cd command to change to /tmp. Note that the cd command does not
    give you any output or feedback after you run it. If we were expecting to see
    in /tmp then we could run the ls command to check if this is the intended location.
    It is always possible that two different directories contain identical contents.
    That is why we run the pwd command again, to confirm that we are really in /tmp.


    # Changing directories in multiple steps


    Let''s imagine that we want to change directory to the “home” directory and then
    change David’s “Work” directory. We will omit the pwd confirmation step from now
    on:


    ```

    $ cd /home

    $ cd david/Work

    ```


    There are two things to note here. First, notice how second cd command does not
    start with a forward-slash. You only need to include a forward-slash at the start
    of a Unix path when you want to start navigating from the root directory of the
    filesystem. Hopefully, you also noticed that performing this in two steps is a
    little pointless. If you just want to navigate from directory “A” to directory
    "B,” you can always do that in one step:


    ```

    $ cd /home/david/Work

    ```


    # Can’t change directory?


    Remember that many Unix systems are case-sensitive. This means that if we had
    typed “David” instead of “david” we might have seen an error message like the
    following:'
