    \ common in various logical contexts—you might want to find a restriction in a\
    \ DNA sequence, or maybe you are trying to find a protein sequence contains any\
    \ particular peptide motif.\n\nSometimes we want to find an exact match by string,\
    \ but other times we want to perform a so-called fuzzy search, using a search\
