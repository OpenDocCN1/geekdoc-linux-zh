    Most of the Perl libraries you will want to use OOP principles, so we believe

    all Perl programmers must be able to use objects. We covered OOP in more detail

    in Chapter 6.8, but we''ll include a short refresher.

    The fundamental unit in OOP is the class. We classify things in everyday life.
    For

    ample, there are all of vehicles we call cars. A specific car is an instance of
    a class.

    an instance is also called an object. If you say out, "An object is an instance
