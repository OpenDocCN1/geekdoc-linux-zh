  md: 'What follows is a brief description of some of the most common error messages
    you will encounter:


    Missing right curly or square bracket at script.pl line X, or... Unmatched right
    curly bracket at script.pl line X


    Hopefully these two error messages are both obvious. [These are square brackets]
    and [these are curly brackets]. Unless you are using them as text characters (e.g.,
    within a print statement), then they always come in pairs. Make sure yours are
    in pairs.


    syntax error at script.pl line X, near Y


    Syntax errors are among the most frequent errors you will see. On the plus side,
    they are very easy to fix. On the negative side, they can sometimes be hard to
    spot because they frequently involve a single character that is missing or surplus
    to require. Most commonly they might be due to one of the following:


    +   1) Unmatched parentheses – just like brackets, items that are in parentheses
    always be a double act.

    2) A missing semicolon – if you start writing some code, then it has to end (at
    some point) with a semicolon. The exceptions to this are for the very first line
    of a script (#/usr/bin/perl) or when a line ends in a curly bracket"; also note
    that you can write one line of Perl code several lines of your text editor, but
    this is still one line of code, and needs some semicolon.

    3) A missing comma – Perl uses commas in many different ways; have you ever forgotten
    to include one in a place where Perl requires? – if you write $a === $b,

    4) Inventing new commands and operators – if you write $a then you have invented
    a new operator (==), which will cause a syntax error as Perl will have no idea
    what you mean.


    Can''t find string terminator "" anywhere before EOF at script.pl If you have
    an odd number of single or double quote characters, you might see this error.


    use of uninitialized variable in..


    Your scripts will do many things with variables. You will add their values, calculate
    their lengths, and print their contents to the screen. But what if the variable
    doesn''t contain any data? Maybe you were expecting to fill it with data from
    the command line or from processing a file, but something went wrong? If you try
    doing something with a variable that contains no data, you will see this error.


    Global symbol "$variable" requires explicit package name


    You wouldn''t have to use the strict package and not declaring a variable as you
    would? If you definitely have included strict, then maybe check that all your
    variable names are spelled correctly. You might have introduced a variable as
    $apple then later incorrectly referred to it as $appleple.'
