    pair of quotation marks; characters could be in |

    | Can''t locate xyz.py in... | You''ve used a "use" statement, the module name
    you are trying to use does not exist; possibly a typo |

    | Can''t modify constant item in scalar assignment | You may be doing an assignment
    with the variables swapped. Sa=5 is correct, but 5=sa is not |

    | Command not found | Possible when you typed the script name in the terminal,
    or the script is not in your Unix SPATH |

    | Global symbol "$xyz requires explicit package name at... | You probably forgot
    to include the "use strict" line |

    | Main name::xyz used only once: possible typo | This generally occurs with filehandles
    as lexical variables instead of symbol filehandles |

    | Permission denied... | Have you run the chmod command to give your script execution
    permission? |

    | print () on unopened filehandle... | If your script is printing to a file, you
    have to open a filehandle for the output |

    | Scalar found where operator expected... | An operator (e.g., +, =, >, eq) is
    missing and a variable/hash element has been used |

    | Search path not terminated... | When you are using the matching operator (=),
    there should be a pair of forward slashes (or other delimiters) surrounding the
    search path |

    | String found where operator expected... | An operator (e.g., +, =, >, <=, eq,
