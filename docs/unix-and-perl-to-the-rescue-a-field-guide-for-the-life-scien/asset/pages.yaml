    line of input, and stored the reversed string in `$rev`. We now want to print
    this output to whatever filehandle is specified by `$out`. All we need to do is
    include the filehandle as part of the `print` function.


    Lines 19 and 20 close the two filehandles. You should always get into the habit
    of making sure every `open()` function has a matching `close()` function.


    When writing to the `>` mode, know that if you intend to write to a file that
    already exists, it will overwrite the file. This will happen `soon` as you open
    the filehandle and all data in that file will be erased. You have been warned!


