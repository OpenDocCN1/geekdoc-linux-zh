  md: '# Working with other people''s data


    be useful for you to review the history of your own scripts. Maybe your boss wants
    you to produce a list of all the major code development you have done over the
    last year. With RC software, this can usually be done by typing a single command.


    If you need to develop code with others, then you should use RC software. Even
    if you will only ever be working on code by yourself, you should still consider
    learning to use it. Of course, it initially involve some extra time and effort,
    but the benefits outweigh these initial costs.


    # Which RC software should you use?


    There are many different software products you can use for revision control. Some
    are free and some not. Work across different OS, whereas some are platformspecific.
    The most popular free ones are CVS, Subversion, and Git. CVS is the oldest of
    these, having available since 1990. There is a lot of available in terms of online
    documentation, books, etc. Subversion was independently developed to be a successor
    to CVS and has been around since 2000. There are many similarities between the
    two systems, meaning that if you learn one, will not be hard to master the other.
    Git is the newest of the three systems and was developed in 2005. It takes a very
    different approach to version control compared to CVS and Subversion, though all
    three achieve the same of goals.


    We suggest you compare different RC solutions available for your platform and
    choose one based on the features you desire. If you work in an environment where
    other people may already be using some form of RC software, then it obviously
    makes sense to consider using the same software as


