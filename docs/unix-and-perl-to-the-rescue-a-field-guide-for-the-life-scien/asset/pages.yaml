    # Matching and not matching


    The matching operator (m//) is very common in Perl, and it is used so frequently
    that the m can be omitted. The following two lines are treated as the same as
    Perl:


    ```

    print "I''ve found love!" ("gloves") =~ m/love/;

    print "I''ve found love!" ("gloves" =~ m/love/;

    ```


    We suggest keeping the m for as it will probably make it easier to differentiate
    from the substitution operator (which we will introduce shortly). Note that when
    you use the matching operator, you are asking whether a string contains anywhere
    in the string. This also includes a match to the whole string:


    ```

    $string = "ABC";

    print "Match" if ($string =~ m/A/); # true

    print "Match" if ($string =~ m/B/); # true

    print "Match" if ($string =~ m/C/); # true

    print "Match" if ($string =~ m/AB/); # true

    print "Match" if ($string =~ m/BC/); # true

    print "Match" if ($string =~ m/ABC/); # true

    print "Match" if ($string =~ m/abc/); # false

    print "Match" if ($string =~ m/AB C/); # false

    ```


    The last examples illustrate that matches are case-sensitive and that the pattern
    has to match exactly, i.e., if you add a space to the pattern, it will only match
    if a space occurs in the string.


    We have previously shown how you can ask whether two or two strings are not equal
    to each other. It also makes sense to ask whether one string does not match another.
    To do this we use the "not match" operator (!).


    # Example 4.11.2


    This script takes a name of species to check whether name might belong to a fruit
    fly species.³35 We will assume that if the species name the string "Drosophila"
    then it is a valid fruit fly species.


    > ³34 As soon as you add m after the binding operator, then we more commonly call
    the whole thing the matching operator,

    even if this is a binding operator followed by a pattern match.


    > ³35 Most flies in the genus Drosophila, the most famous species of fruit fly
    is Drosophila melanogaster.'
