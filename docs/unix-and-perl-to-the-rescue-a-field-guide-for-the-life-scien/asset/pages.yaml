    # make copy, move, and remove commands safer by adding -i option

    alias cp=''cp -i''

    alias mv=''mv -i''

    alias rm=''rm -i''

    ```


    > ⁸ This is anything you type after a hash character on the command-line will
    also be ignored by Unix. Try it and see!

    ⁷⁹ We will return to the subject of commenting in much greater detail in the Perl
    parts of this book.'
