    You should see an error that reports:

    Global symbol “y” requires explicit package name at scope.pl line 9.


    # Understanding the script


    We’ve seen this kind of error message. But that was when a variable was misspelled.
    There isn’t anything misspelled here. The reason for the error is lexical variables
    live and die within block scope (memory is allocated to them when they are declared
    and freed at the closing brace in the same scope). The variable $y is “born” on
    line 7 and “dies” on line 8. You can’t print $y at line 9 because $y doesn’t exist
    anymore It only existed within the scope of where it was declared. Note that $x
    is “alive” from line 5 until the end of the program.


    A variable is said to have global scope if it is available to the entire program.
    A variable with local scope has a more restricted availability. In the examples
    above, $x has global scope and $y is local to the conditional statement. In general,
    you should declare your variables in the most local scope possible. That they
    won’t interfere with variables in some other part of the program. This helps prevent
    some of the worst kinds of bugs (those that are syntactically correct but semantically
    erroneous). Let’s see what happens when two variables in different scopes have
    the same name.


