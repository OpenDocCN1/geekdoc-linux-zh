    # 3.11 Environment variables


    How much it rains is also an environment variable

    Unix keeps track of several special variables that are associated with your Unix
    account. These are specifically known as environment variables. They are all written
    in upper-case letters and always start with a dollar sign. We haven''t really
    covered varieties, but they are one of the fundamental ways by which computer
    programs store data.28 A single variable will typically have a unique name and
    will contain data that can vary (hence the name variable). The leading dollar
    is a common way of indicating that something is a variable. This helps distinguish
    variables from file/directory names, Unix commands, and etc.


    There are many different environment variables, and they are used to store pieces
    of information such as: which directories contain programs; your current directory;
    your favorite (Unix) text editor; and even your login name (in case you forget!).
    Explanations about environment variables often go in hand with explanations about
    the shell, because the two are closely coupled. It makes sense that the first
    environment variable that we will introduce is SHELL, which will contain the name
    of your default shell.


    # Example 3.11.1


    We can display the contents of any environment variable by using a Unix command
    called echo. This command simply echoes back the contents of whatever text you
    type, but if you type the name of an environment variable, then it echoes back
    the contents of that variable. E.g.:


    ```

    $ echo SHELL

    SHELL

    $ echo SHELL

    /bin/bash

    ```


    > 28 Unix and all programming languages use variables extensively. They are also
    used by many data-heavy applications, as database programs, spreadsheets, etc.'
