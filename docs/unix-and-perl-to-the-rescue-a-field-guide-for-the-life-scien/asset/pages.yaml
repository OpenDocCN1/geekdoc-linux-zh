  md: '$ cd /home/David/Work

    cd /home/David/Work: No such file or directory


    We would also see this type of error message if we had misspelled any part of
    the path, or missed out any of the forward-slashes. If we mistakenly typed something
    like:


    ```

    $ cd home/nigel

    ```


    instead of:


    ```

    $ /home/nigel

    ```


    without the leading forward-slash character, Unix will assume that we want to
    change directory to a subdirectory of our current directory called "home". It
    is important to be able to appreciate the difference between the two commands
    shown above. The second command will only ever a single location on the filesystem,
    as there can only be one directory called "home" at the root level of the computer.
    In contrast, the first command could potentially work in multiple places as there
    could be another "home" directory elsewhere in the filesystem.20


    # Changing to the parent directory


    One of the most common uses of the cd command is to navigate to the directory
    above the one you''re currently in - e.g., you want to change from the "david"
    directory to "home" or from "home" to "/". This is straightforward if you know
    the directory above you is. However, you may have forgotten where you are and
    may not want to keep running the pwd command to find out. You can simply tell
    the cd command to go "up" one level by using the following syntax:


    ```

    $ ..

    ```


    Two dots (without a space) are used by Unix to refer to the parent directory.
    You can use this with the ls command to list the contents of the parent directory:


    ```

    $ ls ..

    ```


    If you wanted to navigate up two levels then you simply need to include a forward-slash
    between two sets of dots:


    ```

    $ ../..

    ```


    The use of the forward-slash is consistent with what we have already seen about
    Unix, and the forward-slash acts as a delimiter that separates out levels in the
    overall directory hierarchy.


    When you run the previous command, Unix will try to go up two levels in the directory
    hierarchy. If your working directory was /bin, then you only have one level above
    you, but Unix will not produce an error - it will simply take you as far as it
    can go.


