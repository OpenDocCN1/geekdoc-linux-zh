    # Getopt::Std or Getopt::Long?


    Both of these modules contain great more functionality than is shown here. You
    should read the full Getopt documentation to discover what they can do. Some people
    are happy to use the standard version of the Getopt function, and others prefer
    the longer version. As you add more to your script, using the standard version
    can mean you run out of suitable single-letter characters for certain options
    – if, for example, you use -h for help and then want to add an option to specify
    the name of a valid host machine, you cannot use -h again. In contrast, if you
    use the long version and lots of options it can take a lot more to actually run
    a command. Compare:


    ```

    $ my_script.pl -f -v -b -r

    $ my_script.pl --fast --verbose --backup --recursive

    ```


    One disadvantage of using the long format for options is that they can always
    be reduced to the shortest unique string. All of the following be equivalent:


    ```

