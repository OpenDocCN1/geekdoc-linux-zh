  md: '# T(GA|AA|GA)


    On the one hand, this simplifies the regex by shortening it by two characters,
    but on the other hand this reduces the “readability” of the pattern as it becomes
    slightly less obvious that we are dealing with stop codons.


    Ensuring that the sequence must be a minimum of 100 nt can be done by swapping
    the + quantifier for {94,}: the remaining 6 nt will come from the start and stop
    codons:


    ```

    $seq ~ m/^ATG[ACGTN]{94}(TGA|TAA|TAG)$/i;

    ```


    The final, and most difficult, step is to ensure the sequence is a multiple of
    3 nt. One way to do this is to first define a single codon ([ACGT]{3}), and then
    put that in a group with another repetition modifier to ensure that it occurs
    at least 32 times (this makes 96 nt, with the remainder coming from the start
    and stop codons):


    ```

    $seq ~ m/^ATG[ACGTN]{3}}{32}(TGA|TAA|TAG)$/i;

    ```'
