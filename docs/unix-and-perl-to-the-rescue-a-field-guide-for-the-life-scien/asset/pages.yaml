    ```


    The result is the same as before, but we now avoid having to create arrays to
    hold each row of data. However, this reproduces the earlier situation of making
    named array references that we might not need to use again. Let''s move on to
    the fourth way of building the table of data. In this strategy, we name only the
    two-dimensional array, and not the arrays or references. The relationship between
    data contained in the rows and columns becomes more obvious in this syntax:


    ```

    my@table = (

    [''Mouse'', ''Mus musculus'', ''Rodent''],

    [''Human'', ''Homo sapiens'', ''Primate''],

    );

    ```


    Hopefully you will agree that this is a simpler and tidier way of making our two-dimensional
    array. Note how the comma that outside square brackets denote each element in
    the first dimension, and the comma inside the square brackets denote elements
    in the second dimension. You can access an entire row as $table[1]. This holds
    a reference to an array. If you print $table[1] you will find it strange string
    such as ARRAY(0x10080000) because it is an array reference. How can you get to
    a single cell? Use the -> operator. So $table[1]->[1] contains Homo sapiens. The
    arrow in this case is optional. This is a good thing, because $table[1][1] looks
    a lot better. To recap, if you wanted to print the contents of the first "cell"
    in the table, you could do either of the following:


    ```

    print $table[0]->[0];

    print $table[0][0];

    ```


