    # 4.10 Dealing with special characters


    Do you have an escape plan?

    As we have seen, Perl gives a special meaning to a lot of characters on your keyboard.

    This is generally fine until we want to print some of those special characters.
    We''ve

    already learned that we can put things in single quotes so they lose their special
    mean-

    ing, but that is not the best solution. Let''s imagine we want to print out the
    con-

    ts of a variable called $salary and that we also want to include a dollar sign.
    We

    might think doing this:


    print "I earn $$salary\n"

    However, this will not work and produce an error. Perl expects that there is a
    do-

    lar sign within pair of double quotes then goes to signify the name of a variable.

    One solution would be to use single quotes for the dollar sign, but double quotes
    for the

    rest of the string:


    print "I earn \ ''$'', "$salary\n"

    This works, but requires that you print a list of three things, one of which has
    to be

    enclosed in single quotes. That seems to be a lot of extra work just to do something

    simple. Luckily for us, Perl provides an easy way to do what we want and can ignore

    t special meaning of a character by escaping it. To escape any character in Perl,
    just

    prefix it with a single backslash character (\)


    > 31 As always, Perl will evaluate the right-hand side of an assignment first
    (i.e., everything after the equals), and will

    resolve functions from the "inside-out" (the lc function must happen before the
    ucfirst function). With practice, it

    becomes common to see use a line of code like this and read it in the same way
    Perl will execute it, rather than simply

    reading it to right.'
