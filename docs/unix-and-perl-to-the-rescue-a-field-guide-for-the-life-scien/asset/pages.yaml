    # Finding your way home


    One of the most common acts of “directory navigation” that you will perform is
    to return to your home directory (from wherever you were). If you know where your
    home directory is, you can simply use the `cd` command to go there:


    ```

    $ cd /home/niger

    ```


    Because you will want to perform this action over and again and because you might
    not always remember where your home directory is,²⁴ Unix provides several shortcuts:


    ```

    $ cd ~niger

    ```


    This command should be read as “change directory to the home directory of the
    user called ‘niger.’ The ~ character (known as a tilde) is used by Unix to refer
    to your home directory. Note that you can use this syntax to navigate directories
    beneath the level of your home directory – e.g., the path `~/david/Docs` would
    refer to the “Docs” subdirectory of David’s home directory. Additionally, you
    can use this syntax to navigate to, or list the contents of, *another user’s*
    home directory:


    ```

    $ cd ~derek

    $ cd ~david

    $ ls ~derek

    $ ls ~david/Work

    ```


    If it is your home directory that you want to go to then you can save even more
    time by omitting the user name altogether:


    ```

    $ cd ~

    ```


    A tilde on its own will always be understood by Unix to refer to your home directory.
    If we want to save ourselves even more typing, we can take home directory navigation
    to its extreme:


