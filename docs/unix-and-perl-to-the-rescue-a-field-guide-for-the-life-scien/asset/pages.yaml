  md: '# Explanation


    The -w option asks grep to only find the pattern if it occurs as an isolated word,
    rather being part of a larger word. This means the pattern has to be flanked by
    whitespace (tabs and space characters), or other non-word characters such as hyphens
    in this case.¹⁶ This means that the “Man” in “Spider-Man” is considered a match.
    The -w option allows the pattern to occur at the start or end of a line. This
    means that a line in the input file that only contained the word “Man” would also
    count as a match.


    # Example 5.3.5


    How many villains are there?


    ```

    $ grep -c Villain heroes_and_villains.txt

    6

    ```


    # Explanation


    Rather showing you lines that match a pattern, the -C option simply shows you
    a count of how many lines match the specified pattern.


    # Example 5.3.6


    Which lines contain two vowels in a row?


    ```

    $ grep -n -i [aiou] [aiou] heroes_and_villains.txt

    2:Catwoman Selina Kyle Villain DC

    3:Doctor Doom Victor von Doom Villain Marvel

    4:Doctor Octopus Otto Octavius Villain Marvel

    7:Poison Ivy Pamela Isely Villain DC

    8:Rogue Anna Marie Hero Marvel

    12:The Riddler Edward Nigma Villain DC

    13:Two-Face Harvey Dent Villain DC

    14:Wonder Woman Diana Prince Hero DC

    ```


    # Explanation


    The -n option includes the inclusion of matching line numbers at the start of
    the output. We can look for two vowels in a row using the syntax [aiou][aiou].¹⁷
    Of course, the word “villain” itself contains two adjacent vowels and so all villains
    will be included in the output.


