    # 4.23 Reading and writing files


    Otherwise known as the ins and outs of in how we can use <> to read files that
    are specified on the command line. However, if we want to open multiple files,
    then using <> is not always a good solution as our scripts might not need to read
    all files at once. Using <> assumes that we want to treat all of the files in
    the same way, but clearly we don''t always want to do this. For example one file
    might contain a list of email addresses and the other file a list of postal addresses.
    You wouldn''t want to process both files with the same code. The <> operator doesn''t
    allow us to write new files or append to existing. The solution to all of these
    problems is to use the open() function. This can open a file for reading or writing,
    but not at the same time.


    # The open() function


    The open() function can seem a little confusing because there are several different
    ways it can be used. Let''s start off with learning how to use it in the most
    traditional way. Any time you want to use the open() function to open a file you''ll
    need to specify three things:


    +   (1) the name of a file to open;

    (2) something called a filehandle;

    (3) something called the mode.


    Filehandles are a type of special variable used when performing file operations.
    Once you associate a file with a filehandle you no longer need to use the actual
    file name. It is a convention to use upper-case characters for file names.

    The mode controls whether you are reading from, or writing to, the file in question.
    The actual value for the mode forrows from how we access files in Unix⁶⁸.


    ```

    # read from a file

    # write to a file

    >> append to an existing file

    ```


