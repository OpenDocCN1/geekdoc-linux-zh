    # Standard output


    If you run any command that produces output, then you might always expect to see
    that output appear in your terminal. If it doesn''t appear there you wouldn''t
    be able to see it; you might think this would be a very bad day. However, Unix
    treats the output from programs like a stream of data that can be redirected to
    different places. The official term for the output is standard output$^{21}$ and
    people speak of standard output being "attached" to something, e.g., to your computer
    screen.


    If you want to "capture" the output from a command, you can easily achieve this
    by redirecting standard output into a file. To do this, you simply use the redirect
    operator which is represented by the > character. Place this character after any
    command that has output needs redirecting and provide a name of a file to write
    the output. Note that when you redirect a command''s output to a file you won''t
    see any of the command''s output in the terminal.$^{22}


