    2 <=> 1; #1

    1 <=> 1; # 0

    a" <=> "b"; # 0 because strings are numerically zero

    100 cmp 2; # -1 because 1 is less than 2 alphabetically


    To change the sorting behavior in Perl, you have to give the sort() function alternate
    syntax. Perl''s sort() reserves two variables called $a and $b for sorting. When
    we use the default sorting behavior we don''t have these special variables, but
    the following two lines of code are equivalent:


    ```

    @data = sort @data; # basic alphanumeric sort

    @data = sort {$a $b} @data; # same, but with all the details revealed

    ```


    The comparison routine is the part that happens inside the curly brackets after
    the sort. Modify line 6 of your code from Example 4.18.1 to try out each of the
    two sorting assignments in turn:


    ```

    @data = sort {$a $b} @data; # alphabetic

    @data = sort {$a <=> $b} @data; # numeric

    ```


    You should find that each sort, sorting numerically, produces warnings. The numbers
    are correctly sorted, but the strings are:


    ```

    before: 3.14 10000 21 red blue yellow

    Argument "red" isn''t numeric in sort at sort.pl line 6.

    Argument "blue" isn''t numeric in sort at sort.pl line 6.

    Argument "yellow" isn''t numeric in sort at sort.pl line 6.

    after: red blue yellow 3.14 21 10000

    ```


    This warning message is fairly self-explanatory; you should sort numerically only
    if you are sorting numbers, not strings. If you have a mixture of strings and
    numbers, you can do this to the sort:


    ```

    @data = sort {$a <=> $b} or or {$a cmp $b} @data;

    ```


    This uses the Boolean operator to chain the two comparisons. If the numeric sort
    results in a zero, theabetic comparison is used instead. Unfortunately, there
    are still warnings because we are comparing strings as numbers. We can quiet these
    by temporarily turning off the warnings prisma. This is done by placing "no warnings;"
    before the sort and use "use warnings;" after the sort:


    ```

    no warnings;

    @data = sort {$a <=> $b} or {$a cmp $b} @data;

    use warnings;

    ```


