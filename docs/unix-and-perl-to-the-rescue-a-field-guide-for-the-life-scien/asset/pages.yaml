    # 6.3 References and two-dimensional arrays


    Got spreadsheets?

    So far, all of the arrays we have used been one-dimensional. For example, the
    following array holds three values in order:


    ```

    my @array = (''Mouse'', ''Mus musculus'', ''Rodent'');

    ```


    If you placed this data in a spreadsheet, you could put all of these values in
    a single row or a single column.


    | Mouse |

    | Mus musculus |

    | Rodent |


    But what if you wanted to store the content of an entire spreadsheet in an array?
    How could you represent data like this:


    | Mouse | Mus musculus | Rodent |

    | Human | Homo sapiens | Primate |

    | Cow | Bos taurus | Ungulate |


    A natural way to represent such data is a two-dimensional array. But before we
    show you how to do, we must first discuss some things that are known in Perl references.


    One way to think about references is that they behave a bit like a Windows shortcut
    or a Mac alias, as are clickable "bookmarks" for frequently accessed applications
    and files. When you create a shortcut/alias, you get an icon that mimics the original
    file, but does not duplicate it. You can make multiple shortcuts or aliases for
    a single application and place these in different folders across your filesystem.
    When you open a shortcut/alias of a document, you can make some edits and the
    changes appear in the original file. However, if you delete a shortcut/alias,
    it does not delete the original file. References in Perl behave a lot shortcuts/aliases.
    The analogy is imperfect, but it is a useful place to begin.


    # Array references


    Here is a simple array assignment:


