  md: '# 3.6 Finding out where you are in the filesystem


    You should learn to use PDQ

    As we have already mentioned, there may be many hundreds of directories on any
    Unix machine. So how do you know which one you are? In Unix, the current directory
    you are in known as the working directory. To find out where you are, you can
    run the Unix command pwd, which will print the working directory, and this is
    pretty much all this command does. If you have opened a new terminal window you
    will normally be placed in your home directory:18


    $pwd

    /Users/nigel


    # Slashes separate parts of the directory path


    As we have seen, Unix uses forward-slashes to separate the various parts of a
    directory location. In the above example we can see that "nigel" must be a subdirectory
    of "Users" because the two are separated by a single forward-slash character.
    Collectively, the set of file and directory names that are combined with forwardslashes
    is known as a path. A single path will always specify some unique location in
    the filesystem.

    If a path starts with a forward-slash character, then this is the same thing as
    the single forward-slash that represents the root level. In the above example,
    because it starts with a forward-slash, we can infer that "Users" must be a directory
    one level beneath the root directory. We shall return to the issue of navigating
    paths in the next chapter.


    # Remember to use pwd!


    As you become more familiar with Unix, you will find yourself trying to switch
    between different directories in the filesystem (which we will learn how to do
    in the next chapter). The more you move around, particularly as you start using
    multiple terminal windows, the more likely it is that you will get "lost" in the
    filesystem. When you start running more complex commands (or Perl scripts) a common
    reason for them not appearing to work is that you are not in the correct directory.
    As you start to learn Unix, it is good to get into the habit of frequently running
    pwd to check that you always know where you are.


    > 18 You can configure Unix to start your terminal sessions somewhere other than
    your home directory and this is useful, but 99% of the time a new terminal will
    place you in your home directory.'
