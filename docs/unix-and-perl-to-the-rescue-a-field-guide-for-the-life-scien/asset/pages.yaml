  md: '# Essential Perl 4


    # 4.1 Hello World


    Your first steps into the Perl programming

    The first program most people learn to write in any programming language is usually
    a “Hello World” program that just prints the words “Hello World” (surprise, surprise)
    to the screen. This isn''t a legally binding requirement, and you could instead
    try to make your first program calculate the largest unknown prime number. However,
    at this stage we want that the programming environment is working properly, so
    it makes sense to keep your first Perl script as simple as possible. Note that
    the words “program” and “script” are often used interchangeably. If you don''t
    worry about the difference, neither will we.


    # Example 4.1.1


    Enter the text below into your text editor (see Part 2 for about text editors),
    but not include the numbers. The numbers are only so we can reference specific
    lines. Your first Perl program is going to contain just two lines. This might
    not seem like much, but you will be writing more Perl than the vast majority of
    people in the world, who haven''t written any!


    +   1. # helloworld.pl by _insert_your_name_here_

    2. print("Hello World!\n")


    Understanding the script

    Line 1 starts with a hash character (#). Most of the time Perl sees a #, everything
    that follows on that line is considered a comment (we''ll deal with exceptions
    to this in due course).mers use comments to describe what a program does, who
    wrote the program, what needs to be fixed, Think of comments as the notes you
    write in the margin of a text book; they should aid your understanding. It''s
    an extremely good idea to put comments in your code, especially as your programs
    grow. Perl will ignore everything after the hash sign in theory you could embed
    a poem or a recipe in the comments of your script, though you would be considered
    strange if you did this.


    Line 2 is the only line of this program that does anything. The print() function
    takes a list of arguments and sends them to your terminal so they can be read
    by someone. In this case, there is only one argument, which is the “Hello World!\n”.
    The pair of quotation marks are one way of letting Perl know we are dealing with
    text. The funny \n at the end of the text is a newline, which is like a


    > All programming languages support commenting, and Perl uses the hash character
    syntax as Unix (which we saw in Chapter 3.23).

    An argument is just some piece of information that is provided to a particular
    piece of Perl code. We have already seen that most Unix supports one or more command-line
    arguments and functions in Perl are analogous to this. If you find the word “arguments”
    strange, then you can think of them as “bits of required information.” If you
    are still not happy about this then free to start an argument argument!'
