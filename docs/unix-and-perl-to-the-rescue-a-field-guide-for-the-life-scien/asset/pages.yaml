  md: '# Collaborative code development


    If you wanted to let someone contribute to one of your scripts, you could maybe
    share a computer or email back and forth, but this clearly isn''t very practical.
    What if you had a really big script and there were 100 collaborators who all needed
    potential access to your code?


    RC software allows you to do this. The exact method of how this done varies with
    the particular type of software, but in general you develop your code in a way
    that you control and who is allowed to edit your code. Most importantly, other
    people can edit your code independently of you. Edits that people make are not
    applied to the master copy of the code until people specifically sign-off on the
    changes they have made. This process is called committing changes.


    In many cases, people might be editing different parts of the code, e.g., different
    subroutines. In these situations the change by programmer A to subroutine 1 will
    not affect the changes by programmer B to subroutine 2. But what if two people
    decide to edit the same lines of code at the same time? In these situations, the
    RC software will spot that has happened and typically the person who was the last
    to commit their changes will be in conflict with the latest version of the code.
    The exact details of how all of these are not important, all you need to know
    is that the software is smart enough to manage all the changes.


    # Keeping your code in sync across multiple computers


    You might develop some software that needs to run on multiple computers. Without
    using RC software you could end up with different computers having different versions
    of your code.26


    When you use RC you can typically run a single command, which has the effect of
    updating one or more scripts on that computer to have the latest version is. This
    means if you use RC software then you can ensure your scripts are effectively
    backed up to multiple computers.27


    # Other benefits of using revision control


    This is not the book to go into all the details of what RC software can do for
    you. However, you should be aware that you can use such software to keep a production
    copy of your script and then make a development version at the same time. This
    is called branching. When you have finished working your development copy, you
    can merge changes back into the main copy of the code.


    RC software also lets you comment on all of the changes you make. These comments
    are external to the script and allows others to clearly see why you make the changes
    you did (this especially when developing code with others).28 These comments also
    can


    +   26 If you don''t plan to learn how to use RC software, then at least learning
    about the RC SYNC command.

    27 This is not a substitute for having a proper back-up policy, and is no substitute
    at all if you fail to keep at least two computers updated with the latest version
    of your scripts.

    * Commenting on code changes is only useful if you bother to write comments that
    describe changes in a meaningful way.

    * "Fixed bug" is not a useful comment, whereas "Fixed the issue that caused a
    crash when trying to import files that were not in a correct format is.'
