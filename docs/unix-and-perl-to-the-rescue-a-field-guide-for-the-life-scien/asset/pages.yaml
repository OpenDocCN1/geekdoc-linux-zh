    # Command-line completion


    Perhaps the most important time-saver to learn is something called command-line
    completion. This allows you to automatically complete the name of files, directories,
    and programs as you type. If you type enough letters that uniquely identify the
    name of something and then press tab⁷ Unix will do the rest.


    # Example 3.15.1


    Type the letters “tou” and then press the key on your keyboard. In the following
    example, we use <tab> as a shortcut key of saying “tab.”


    ```

    $ tou<tab>

    $ touch

    ```


    # Explanation


    If this works, you should see the letters “ch” become magically added to the three
    letters you have already typed. This forms the name of the Unix touch command
    (which we will learn about in a later chapter). In this case, command-line completion
    will occur because there are no other Unix commands that start with the letters
    “tou”. If this didn’t work it might be because you have a non-standard Unix command
    on your system that also starts with “tou”, or that there is a file or directory
    in your current location that starts with “tou”. When there are no possibilities
    for the letters you have already typed, you may hear a beep.⁸


    Command-line completion can be used to save time when typing program names, but
    it is equally useful working with files and directories. If you have yet to type
    the name of a Unix command, tab-completion will attempt to complete from a list
    of all known commands and programs on the system. However, if you have already
