    ```


    You don''t need to press enter at the end of the line, though it doesn''t hurt
    if you do this. Save this file as “recursive_long_listing”. exit nano, and then
    check that you can view the contents with the list program. Now type the following
    command and observe the output:


    ```

    $ source recursive_long_listing

    total 8

    drwxr-xr-x 2 nhỉ staff 68 Jul 8 14:55 Code

    drwxr-xr-x 2 nhỉ staff 68 Jul 28 17:17 Temp

    -rw-r---- 1 nhỉ staff 9 Aug 4 10:01 recursive_long_listing

    ```


    ```

    ./Code:

    ./Temp:

    ```


    # Explanation


    We have taken a Unix command with a couple of command-line options and saved that
    to a file. The source command then reads that file and acts on its contents, meaning
    that it runs the ls -R -l command. As a result, we get a long, recursive directory
    listing the current directory.


    If you use the source command, then you should only reading files that contain
    valid Unix commands.⁶ If you replace the contents of the file from Example 3.23.1
    with the text “cheecake”, and then try re-running the source command, you will
    see the following:


    ```

    $ source recursive_long_listing

    bash: cheesecake: command not found

    ```


    There is no Unix command called “cheesecake” and so Unix, quite understandably,
    complains that it can''t find it. If you do so, you can place multiple commands
