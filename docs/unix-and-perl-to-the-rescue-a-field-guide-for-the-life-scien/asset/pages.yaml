  md: 'you can add more functionality to your programs. Depending on the needs of
    your program, you can use command-line options instead of, or in conjunction with,
    the @ARGV array.


    # Getopt::Std


    Getopt::Std is used for single-character options. The behavior of multiple options,
    can be just like other command-line Unix programs. If there are multiple options,
    they can be concatenated together. For example -l can be written as -lt or -tl.
    For options that take an additional parameter, -o for an output file, the space
    between the option and the parameter may be omitted: both -o file or -file mean
    the same thing. Let''s see this in action. The following script can be a template
    for your programs.


    # Example 6.7.1


    +   1. #!/usr/bin/perl

    2. # getopt_std.pl

    3. use strict; use warnings;

    4. use Getopt::Std;

    5.

    6. my $usage = "usage: getopt.pl [options] <arguments>"

    7. options:

    8. -v version

    9. -f flag

    10. -p <some parameter

    11. ""

    12. die $usage unless @ARGV;

    13.

    14. my $opt;

    15. getopts(''hvfp:'', \opt);

    16.

    17. if ($opt{h}) { print "$usage usage; exit; }

    18. if ($opt{v}) { print "version 1.0\n"; exit; }

    19. if ($opt{f}) { print "$flag is turned on\n"; }

    20. if ($opt{p}) { print "Parameter is: $opt{p}\n"; }

    21.

    22. print "Other arguments were: @ARGV\n";


    # Understanding the script


    Lines 1–4 are typical header information material with the addition of Getopt::Std.


    Lines 6–11 contain a typical usage statement, which is just meant to remind the
    user about all the options supported by the program. Note that the string stored
    in $usage is spread across several lines.'
