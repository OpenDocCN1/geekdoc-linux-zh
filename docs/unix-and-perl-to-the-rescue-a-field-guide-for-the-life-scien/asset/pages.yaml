    (4) TIME – the amount of CPU time accumulated by the process.


    (5) COMMAND – the details of the command/program that is running.


    We usually see one process for the Unix shell that is running in each terminal
    window (in this example we are using the default bash shell). This means the ps
    command produces at least one line of output if you are not running anything.
    In this example we also see details of our errant Perl script. The main thing
    to remember from this section is that if you have run a Perl script which hasn''t
    finished, you can easily find out the identifier of the corresponding process
    by using the ps command.


    # The kill command


    The preceding sections show you how you can find the process ID of any running
    process. If that process belongs to you, then you can easily stop it with the
    Unix kill command. To stop a process, you just need to supply the necessary process
    ID:


    ```

    $ kill 29056

    ```


    This will not cause any output to appear in the terminal where you run the kill
    command. However, in the other terminal window (which still contains our endlessly
    running Perl script) you would see something like this:


    24 was your magic number!

    25

    24 was your magic number!

    25

    24 was your magic number!

    25


    Specifically, the kill command is used to send a “terminate” signal to a running
    process. The “terminate” signal will try to leave the running process in a clean
    manner, i.e., closing any file connections the process had opened. Sometimes this
    is not enough though, as some processes cannot be killed in this manner. A final
    solution is to send the more deadly “kill” signal. This forces a process to stop
    without first cleaning any file connections and will sometimes work when the standard
    kill command doesn’t. To send the “kill” signal, you just need to add “-9” to
    the command:


    ```

    $ kill -9 29056

    ```


    > There are other signals that you force the kill command to send to a process.
    E.g., kill -2 sends the interrupt signal, which is exactly the same signal that
    is produced by pressing Control + c. See the kill man page for more details.'
