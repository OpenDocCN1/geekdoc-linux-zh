    3. use strict; warnings;

    4.

    5. print $ARGV[0] ** $ARGV[1], "\n"


    # Understanding the script


    Essentially this is just a one-line script. If you provide two numbers when you
    run the program, both of them will automatically be available via the @ARGV array.
    Like regular arrays, we can access individual elements of @ARGV using the sub-script
    notation. Line 5 uses the exponentiation operator (**) with the values in @ARGV
    and produces the result. If you don''t specify two numbers (separated by one or
