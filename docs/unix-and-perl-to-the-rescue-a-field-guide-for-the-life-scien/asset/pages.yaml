    # Example 4.12.1


    This script demonstrates the full range of abilities of the transliteration operator.
    Notice how there are comments at the end of the lines. You don''t have to type
    these comments, but adding comments to your scripts is a good habit to have. Write
    the script and run it.


    ```

    1. #!/usr/bin/perl

    2. # transliterate.pl

    3. use strict; use warnings;

    4.

    5. my $x = "abc123abc123";n6.

    7. $x =~ tr/a/d; # changes any occurrence of ''a'' to ''d''

    8. $x =~ tr/bc/xy; # ''b'' becomes ''x'', and ''c'' becomes ''y''

    9. $x =~ tr/123/321; # 1 becomes 3, 2 stays as 2, 3 becomes 1

    10. $x =~ tr/dxy/DXY; # capitalize the letters d, x, and y

    ```


