  md: "# Capturing program output with the backticks operator\n\nPerl's backticks\
    \ operator `` is a very convenient way to run commands and capture the output\
    \ directly. The backtick looks like an apostrophe but is actually a different\
    \ character and will be hiding somewhere on your keyboard.¹101 It's another of\
    \ those characters that should always be used in pairs. Whenever you put a pair\
    \ of backticks will be executed in the Unix shell, and the output will be returned\
    \ to you in an array or scalar, depending on how you asked for it.\n\n# Example\
    \ 4.29.1\n\nThis example runs the `ls` command twice using the backticks operator\
    \ and simply prints out the name of each file that ls finds.\n\n+   1. #!/usr/bin/perl\n\
    2. # backtick.pl\n3. use strict; use warnings;\n4. \n5. my @files = `ls`; # output\
    \ of command returned as an array\n6. foreach my $file (@files) { print $file\
    \ }\n7. \n8. my $files = `ls`; # output of command returned as a string\n9. print\
    \ $files;\n\n# Understanding the script\n\nOn line 5, we place the `ls` command\
    \ inside a pair of backticks. The first thing Perl will do is run the command.\
    \ Because the backticks are on the right-hand side of assignment, Perl will assign\
    \ whatever output is provided by the named variable (in this case an array). Each\
    \ element of the @files array will contain a file followed by a newline.\n\nLines\
    \ 8–9 are similar to 5–6, but the output from the backticks operator is assigned\
    \ to a single scalar variable rather than to an array. Note that $files contains\
    \ all of the newline characters from the output of the `ls` command.\n\nYou can\
    \ also use Perl's `qx//` operator as an alternative to backticks. They behave\
    \ in an identical manner, but the qx operator allows you to choose any pair of\
    \ delimiters to surround the command you want to execute – the following lines\
    \ of code are all equivalent to each other:\n\n```\nmy @files = `ls dir`;\nmy\
    \ @files = qx$dir/;\nmy @files = qx($dir);\nmy @files = qx'$dir';\n```\n\nThe\
    \ last example uses single-quote characters as the delimiter, which means the\
    \ command does not undergo variable interpolation.\n\n> ¹⁰¹ The location depends\
    \ on your keyboard layout, but try the upper-left corner to begin with."
  merge: -1
  pgno: 214
