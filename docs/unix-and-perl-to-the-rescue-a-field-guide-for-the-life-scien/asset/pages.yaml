    # 6.1 Regular greedy for more?


    **Are greedy for more?**

    This chapter will cover a few “beyond-the-basics” topics that were left out of
    the earlier chapters on regular expressions¹ (Chapters 4.26–4.28). This chapter
    omits many, aspects of regex and should consult the official Perl documentation
    to find out.


    **Greedy quantifiers**

    Consider the following code. Can you guess what will end up in `$match`?


    ```

    my $text = “Old password = opensame, new password = abracadabra";

    m ($match) = $text ~ m/password = (.+)\s/;

    using the greedy metacharacters to capture the pattern .+ as part of larger pattern.
    The grouped pattern will match one or more of any single character. However, we
    followed the pattern with \S, meaning that the pattern ends when it matches whitespace.
    As the $text string does not end with a whitespace character, this means $match
    will never contain “abracadabra”. So, what will it contain? In this example our
    regular expression can match one of two different strings:

    ```


    +   (1) “password = opensame,”

    (2) “password = opensame, new password =”


    The second match could happen because it still satisfies the regular expression
    pattern of the string “password =$ followed by one or more of any character at
    all, followed by a whitespace character. So which of the two strings will the
    regex match? By default, repetition quantifiers are greedy and will always try
    to match as many characters as possible. In this example, the regex will match
    the longer of the two strings and $match would end up containing “opensame, new
    password =”.


    If you try multiple groups from a string, and each group uses a greedy quantifier,
    then the first group will be the greediest and subsequent groups will have to
    fight over what is:


    > Peter Parker is Spider-man” ~ m/(.*)er(.*);

    # $1 gets ‘Peter Parker is Spid’

    # $2 gets ‘-man’ though this pattern also matches Parker is Spider-man’


    **Non-greedy matching**

    You can override the default greedy behavior by appending a ? after any repetition
    quantifier. This is known as a non-greedy quantifier:


    Also known as regexes and regexps.'
