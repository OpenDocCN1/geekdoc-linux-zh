  md: '# Introduction and background


    Increasingly, the raw output of biological research exists as in silico data,
    usually in the form of very large text files that can grow to several gigabytes
    in size. Unix is particularly suited to working with such files and has several
    powerful (and flexible) commands that can process your data for you. The real
    strength of Unix is that most of these commands can be combined in an almost unlimited
    fashion. If you can learn just five Unix commands, you will be able to do a lot
    more than just five times.


    # Why Perl?


    Perl is one of the most popular programming languages, and has a particularly
    strong following in the bioinformatics community. People sometimes get argumentative
    about which language is best. There is no single language for everything. Perl
    does things very well, and is a fine learning to learn. equally capable and easy
    to use languages like Python and Ruby. Once you learn to program in one language,
    adapting to other languages is trivial.


    Originally developed in 1987, Perl remains under active development and there
    is a lot of supporting material available to help you learn it. You are very likely
    to find Perl pre-installed on almost every type of Unix/Linux-based OS, and it
    is also available for Windows.


    Among programming languages, there is a distinction between those that are interpreted
    (e.g., Perl, Python, Ruby) and those that are compiled (e.g., C++, Java). People
    often call interpreted programs scripts. It is generally easier to program with
    a scripting language because you do not have to worry about variable types and
    memory allocation. The downside is that the interpreted programs run much slower
    than compiled ones. But let''s not get into petty details. Scripts are programs,
    scripting is programming, and computers can solve problems quickly regardless
    of the language.


    # About the authors


    Keithman started out his academic career studying ecology. This involved lots
    of field trips and throwing quadrats around windy hillsides. He was then lucky
    enough to be in the right place at the right time to do a Masters in bioinformatics
    (at a time when nobody was very sure what bioinformatics was). From that onwards
    he has spent most of his waking life at a keyboard (often starting in a Unix terminal).
    A PhD studying eukaryotic genome evolution followed; this was much easier by the
    fact that only one genome had been completed at the time he started (this changed).
    After a brief stint working on an Arabidopsis genome database he moved to working
    on the excellent model organism database, WormBase, the Welcome Trust Sanger Institute
    It was here that he first met Ian Kopf and where they bonded over a shared love
    of Macs, nearly written code, and English puddings. Ian then tried to run away
    in California at the UC Davis Genome Center, but Keith tracked him down and joined
    his lab. Apart from doing research, he also gets to look after all the computers
    in the lab and teach the occasional class or two. However, he would give it all
    up for the chance


    > 3 A good "first port of call" would be www.perl.org, the official web site of
    the Perl programming language.'
