  md: '# Style conventions


    Each chapter has a main heading and a subheading. The subheadings are one area
    where we have tried to inflict our pun-tastic sense of humor on you. We will include
    both Unix and Perl examples, which you should attempt to follow. The Unix examples
    will include simple instructions of Unix commands that you should type, whereas
    the Perl examples will contain complete scripts, accompanied by line numbering.
    E.g.:


    # Example 1.2.1


    ```

    1. #!/usr/bin/perl

    2. -print "The shortest script in the world?"

    ```


    The lines are just there so we can refer to them in the text. You are not meant
    to type the line numbers! Following just every example will be a section that
    tries to explain what the point of the example was. For the Unix examples, this
    will be a section titled Explanation, but for the Perl scripts it will be a line-by-line
    breakdown of how the script is working.


    # Understanding the script


    Line 2 contains a print statement.


    In addition to having worked-through examples, we will also set problems that
    you should try to solve. Where appropriate, answers will be provided, but we encourage
    you to solve the problems without looking at the solution.


    Hopefully you will have noticed that we use a fixed-width font for writing any
    Perl or Unix code. This will be done for complete scripts and when we mention
    a Unix command or Perl function within a sentence. E.g., we might mention that
    the Unix command sed shares similarities with Perl''s substitution operator (s//).


    Sometimes we will show fragments of Perl scripts, to illustrate a point or demonstrate
    the syntax of a command. We do not include line numbers for these examples, and
    they are not intended to be run as complete scripts. E.g.:


    ```

    my $array_A = @array_B; # copying an array

    ```


    Occasionally, we will want to show something at you because it is so important,
    and the world will cease to exist if you fail to understand the critical point
    we are making. E.g.:


    > > "The world will cease to exist if you fail to understand the critical point
    we are making!"


    Any time you see something in this style, you should probably re-read it several
    times and remember that we will be not-inconsiderably displaced if you fail to
    remember our advice!


    7 Footnotes, like this one, are another place where you might find occasional
    discretionary comments on matters which may not be entirely related to Unix and
    Perl. E.g., did you know that there are no words in the English language that
    rhyme with the word "orange?'
  merge: -1
