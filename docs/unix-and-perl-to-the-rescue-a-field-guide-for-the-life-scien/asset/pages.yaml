    # Adding and removing key–value pairs


    In the last chapter we saw that hashes represent useful lookups such as countries
    and their corresponding populations. If we want to add some new data to an existing
    hash? This is incredibly simple; just assign a new key-value pair.


    ```

    my $sound; # empty hash

    $sound{''dog''} = ‘woof’; # now contains a key and value

    $sound{''cat''} = ‘meow’; # now contains two keys and values

    ```


    If the key already exists, it will be replaced with the new value.


    ```

    $sound{''cat''} = ‘meow’; # redefined ‘cat’ key

    ```


    To remove a key-value pair, you use the aptly named delete keyword:


    ```

    delete $sound{''cat''};

    ```


    Note that you want to delete all the key–value pairs from a hash, simply assign
    an empty list to the hash:


    ```

    %sound = ();

    ```


    # Determining whether a hash contains a specified key


    To test if a particular key exists in a hash, use the exists() function. This
    returns “true” if the key is present in the hash and “false” otherwise. The exists()
    function does not care if the key is defined or not, just if the key is:


    ```

    print “Exists’n” if $hash{$key};

    ```


    If you want to delete a defined value, you can use the defined() function. This
    returns true if the key exists and has a defined value. If you want to test if
    a key exists and has a true value², first test if the key is defined (or exists),
    and then test if it has a true value:


    ```

    if (defined $hash{$key} and $hash{$key}) ...

    ```


    > 82 Remember that for logical “truth” is not the same as testing whether something
    is defined. If something is (logically) true it it must be defined, but the opposite
    situation is not always true. E.g., if $x contains “0” (zero) or the empty string
    (“”) then it is defined, but not true.'
