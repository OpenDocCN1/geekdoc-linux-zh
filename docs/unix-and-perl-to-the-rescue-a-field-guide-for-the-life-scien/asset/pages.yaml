  md: '# The awk command


    It is a little unfair to describe awk as just another Unix command. Like Perl,
    it is a fullyfledged scripting language and can be used to write very powerful
    programs for text manipulation. However, you do not need to learn all of the complexities
    of AWK (the programming language) when you can achieve many useful things through
    simple use of awk (the command). There are many web sites devoted to AWK, and
    this section will only give a brief glimpse into some of the things you can do
    with it.


    The following examples are all used in conjunction with the yeast_genome.gff.
    The first example will simply print the contents of the file, using awk''s print
    function. This is not a perfectly useful way of using awk, but as you will, it
    becomes easy to add just a few arguments to the command to do many useful things.
    Then you are encouraged to try these yourself:


    +   - print out contents of input file

    - awk {''print''} yeast_genome.gff


    +   - print out first column of file

    - awk {''print $1''} yeast_genome.gff


    +   - print out column 5 then column 1

    - awk {''print $5, $1''} yeast_genome.gff


    +   - print out start and end coordinates if start coordinate is > 10000

    - awk {''if ($4 > 10000) print $4, $5''} yeast_genome.gff


    +   - print out start and end coordinates of features, plus their lengths

    - awk {''print $4, $5, $5-$4+1''} yeast_genome.gff


    +   - same as above ... whitespace is optional

    - awk {''print $4,$5,$5-$4+1''} yeast_genome.gff


    +   - print lines that contain the word ''intron''

    - awk {''/intron/ {print}'' yeast_genome.gff


    +   - same as above, print is implied

    - awk {''/intron/ {print}'' yeast_genome.gff


    +   - print line number of features using NR variable (NR = number of records)

    - awk {''print NR, $3''} yeast_genome.gff


    +   - use ''END'' statement to only print the total number of lines in file

    - awk {''END {print NR}'' yeast_genome.gff


    > 40 The development of the Perl programming language was partly due to a desire
    by Larry Wall, the creator of Perl, to overcome some of the limitations of AWK.
    Without AWK, there may have been no Perl, and hence you would be doing something
    less useful than reading this book now.'
