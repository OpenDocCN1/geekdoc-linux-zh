  md: 'my @author = (''Keith'', ''Ian'');


    If we want to create a reference to this array, then we need to use the backslash
    operator:


    my $author_ref = @author;


    Here we create $author_ref, which is a scalar variable that "points to" the @author
    array. You may, not find, without the backslash character, you would just be assigning
    array to a list and $author_ref would end up containing the size of @author. It
    is the backslash character that is therefore important in making $author_ref a
    reference.


    Note that $author_ref is still a scalar in it holds the contents of one, yet the
    thing it points to can be an array containing many things. If you try printing
    the value of $author_ref, you will get a strange string such as ARRAY(0x10080f40).
    This indicates that the variable is a reference to an array. The strange hexadecimal2
    number in parentheses is its memory address.


    The Perl ref() function lets you if a scalar variable is a reference (as opposed
    to being a regular variable). In this chapter, we will only be looking at array
    references. If you use ref() on something that is not a reference, it returns
    false.


    ```

    print($author_ref); // prints ARRAY

    ref("something"); // prints nothing

    ```


    # Using array references


    Array reference can be used very similarly to an array, but with a slightly different
    syntax. Since $author_ref is a scalar variable we cannot do $author_ref[0]. Instead
    we use the array operator13 -> like this:


    ```

    print $author_ref->[0]; // prints ''Keith''

    ```


    You can read this backwards as "print the zero-th element of the array that is
    pointed by the scalar called $author_ref". Both $author[0] and $author_ref->[0]
    occupy the same location in the computer''s memory. If you change one, the other
    changes:


    ```

    $author_ref->[0] = ''Keith Bradnam''

    print $author[0]; // will now print ''Keith Bradnam''

    ```


    Conversely, if you make an array reference undefined or turn it into a regular
    variable, it will not affect the array that it formerly pointed to:


    ```

    $author_ref = undef; // make reference undefined

    print $author[0]; // still print ''Keith''

    $author_ref = "cheese"; // repurpose variable to act as a normal scalar

    ```


    +   12 Hexadecimal digits include 0-9 followed by a-f. For example, the hexadecimal
    equivalent of 11 and ff is the hexadecimal value of 255. Hexadecimal numbers are
    indicated by the 0 prefix.

    13 This is actually the infix operator, but we prefer array operator because it
    looks more like an infix (whatever looks like).'
