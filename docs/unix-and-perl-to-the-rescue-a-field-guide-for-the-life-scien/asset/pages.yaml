    Now, let''s suppose that @address_book contains a few million records. We can
    search for any single record using the following construct, but note that this
    will take a relatively long time:


    ```

    foreach $card (@address_book) {

    if ($card->{name} eq ''Ian'') {do_something($card)}

    }

    ```


    Using an unsorted list means that, on average, we have to search half the list
    to find a match. If the names are instead placed in a hash, the retrieval is much
    faster. For example, if you want to index your address book by name, you could
    use the following code:


    ```

    my %index;

    foreach $card (@address_book) {

    $index{$card->{name}} = $card;

    }

    ```


    This code creates a new hash %index where each key of the hash is just the "name"
    field from the hash of arrays. The value associated with each key is a reference
    to the array of all information about that person. If you find this syntax confusing,
    just remember that Perl tends to work from the inside out. The first thing that
    happens in the above code is that Perl resolves $card->{name} part will produce
    a single string which can then be assigned to the hash key for the new hash %index.
    Only then can Perl associate this key with a value. With this hash in place, you
    can retrieve any card with a simple look-up:


    ```

    my $card = $index{''Ian''};

    ```


    This method assumes that names are unique, which might not be true, depending
    on the type of data you have. If you have redundant names, then you have to store
    an array of cards for each name.


