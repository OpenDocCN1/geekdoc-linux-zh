    # 3.21 Introduction to aliases


    Or, learn how Samuel Clemens became Mark Twain

    Hopefully you are starting to appreciate that there are a lot of commands in Unix.
    You are already having trouble remembering the names of many of them, let alone
    all of the options that many commands possess. Fortunately, Unix provides a way
    for you to create alternative names for any command. Use one of these aliases
    for easier-to-remember versions of existing commands (e.g., “move” instead of
    mv or “copy” instead of cp). If you do this, you should choose a name for the
    alias that does already exist as a command. Another use is to make a shortcut
    for commands where you typically use lots of command-line options. For instance,
    if you find yourself typing ls -ltr or even ls -lt -r), then you may save yourself
    some typing by creating an alias called “ltr” which does the same thing.


    # Creating aliases


    Aliases are created using the alias command, but the syntax can differ slightly
    depending on which shell you are using. If you are using any of the bash (sh,
    bash, ksh or zsh), then the syntax for the alias command is:


    ```

    alias new_command_name=''old_command_name’

    ```


    If you are using csh or tcsh, the syntax is slightly different and you can omit
    the equals sign and quotation characters:


    ```

    alias new_command_name=old_command_name

    ```


    > ⁶⁸ It is true that these aliases are longer than the commands they are linked
    to, but you may consider that a worthy tradeoff it means you don''t have to keep
    looking up the name of a command in a book.

    ⁹ This is one of the few instances where we need to show you how to do things
    in more than one way, depending on which shell you are using. Chapter 3.10 for
    for reminder about Unix shells.'
