    # Line endings


    We have arrived at one of the most common sources of errors with OPD (other people''s
    data). This is literally the end of the line, a subject addressed briefly in Chapter
    5. There are three common ways to end a line of text: Unix, Macintosh, and Windows.
    Whatever method is used, the goal is always the same. Any press of the return
    or enter key on your keyboard should move the cursor to the next line of whatever
    program you are using.


    The Unix end-of-line character is synonymously known as line feed, control-J,
    10 (decimal), OA 00001010 (binary).


    The Mac end-of-line character is the carriage return, control-M, 13 (decimal),
    OD 00001111 (binary).


    Windows uses two line endings, carriage return followed by line feed. These differences
    can be a frequent source of confusion when working with text files that were originally
    produced on a different computer system to the one you are using. What does this
    mean to you? If you are on a Unix system and someone gives you a file saved with
    Windows, it may end up containing extra characters at the end of each line. a
    single line of text with no newlines.³ If you open the file with less, the carriage
    return will appear as ^M characters.


    Imagine someone hands you a spreadsheet in a text format and after reviewing it
    less you realize it has not saved with Unix line breaks. What should you do? Can
    you open it in your favorite text editor and then save it with the appropriate
    line endings (most text editors will allow you to switch to whatever line ending
    you like). But what if you have to convert 1000 files? That could cause you injury!
    Let''s write our own converter.


    > ² With OS X, line endings on the Mac have for backward compatibility, control-M
    is also allowed. Many programs use control-M.


    > ³ The ^ is a way of specifying what are "control characters." Some find this
    confusing as ^M characters are being used to represent something which internally
    is stored as one character (the carriage return). Control characters often appear
    in inverse colors, so if your program uses white text on a black background, ^M
    may appear as black text on a white background.'
