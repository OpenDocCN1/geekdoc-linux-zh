    # The slice function


    The slice() function is very powerful and can remove and/or add elements at any
    position within an array. It is a quite difficult function to understand though,
    like many Perl commands it can be used in different ways; the functionality depends
    on which of the options you choose. Each option adds another level of complexity
    to the function. Let''s quickly look at the four ways we can use slice on an array
    called @array. Imagine that in each of these examples, @array is reverted back
    to its starting condition after each use of slice().


    ```

    my @array = q(a b c d e f g h);

    slice(@array); # gets rid of everything in @array

    slice(@array, 3); # gets rid of everything from position 3 onwards

    slice(@array, 3, 2); # gets rid of two elements from position 3 onwards

    slice(@array, 3, 2, "D", "E"); # replaces ''D'' with ''E''

    ```'
