  md: '# Other (non-Perl) errors


    Many developers of computer code spend a lot of time trying to make their programs
    as possible. A well-designed program should hopefully reduce the ways in which
    the user can break it (intentionally or otherwise). However, as a species we have
    developed a remarkable ability to be inventive with our own stupidity. We have
    all seen people abuse at their computers (both verbal and physical) when they
    run into a problem which they think is the computer''s fault, only to realize
    that they forgot to do something obvious. Here are a few situations that you will
    never find yourself in.


    # Program changes not saved.


    If you make changes to your program but don''t save them, then those changes will
    not be applied when you run the script. Always check that the script you are running
    is saved before you run it. Many code editors will offer visual feedback if a
    program has not been saved. Repeat after us: edit, save, run; edit, save, run;
    edit, save, run...


    # The program you are editing is not the same as the program you are.


    Occasionally, you might make copies of your program and your directory might end
    up with things like script1.pl, script1b.pl, script2.pl, new_script2.pl. This
    is a bad habit to get into and might find yourself editing one script but to run
    another. You will become very frustrated every change you make to your script
    seemingly no effect. See Chapter 7.7 on revision control to find out how to avoid
    this situation.


    # The programs, has no errors, but doesn''t print any output.


    It might seem mysterious when your Perl program, which you so carefully wrote,
    doesn''t seem to do anything. It is therefore worth asking yourself “Did I ask
    it to do anything?” More specifically, have you made your program calculate any
    output? Making your program calculate the answer to life, the universe, and everything
    is one thing ... but if you don''t print out the answer, then it will remain a
    mystery.


    # 7.2 Common error messages


    # This is also a common error message


    There are a number of error messages that you might see which are not really Perl
    errors, even though they might result from what you write (or don''t write) in
    your Perl script. However, most error messages you see will be because of a problem,
    usually a typo, in your script. In this chapter, we''ll first look at a few “non-Perl”
    errors before explaining some of the more common Perl error messages. Finally,
    we''ll include a table


    > E.g., if you are using any form of text editor on an Apple computer, there will
    be a black dot within the red “close window” icon on the top left of any window
    which contains an unsaved document.'
