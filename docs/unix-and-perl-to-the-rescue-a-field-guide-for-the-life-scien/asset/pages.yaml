    (5) How many villains are there?

    (6) Which specific lines contain two vowels in a row)


    For a small file, we could easily answer all these questions by manually searching
    through the file by eye. But what if this file contained details of every hero
    and villain ever created? Clearly, you would have to resort to some other tool
    to get the answers. That is where **grep** comes in. This Unix command allows
    you to quickly search a file (or files) to see which lines match (or don''t match)
    a specified pattern.


    # Using grep to quickly search text files for patterns


    ```

    grep [options] <pattern> <file>

    ```


    where <pattern> is the pattern of characters you want to search for and <file>
    is the name of the file (or) you are searching against. As we will later on, the
    patterns you might use become quite complex.¹⁵ Like many other Unix commands,
    **grep** has many useful command-options, and we will see some of these in action
    just in moment. Let''s work through the questions we asked earlier to see how
    we can answer using **grep**.


    # Example 5.3.1


