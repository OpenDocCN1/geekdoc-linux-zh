  md: '# What is the configuration file called?


    The answer to this question very much depends on what type of Unix shell you are
    using (see Chapter 3.10). Different shells tend to use differently named files
    to store your configuration settings, and there can be multiple files involved:


    | Shell | Name of configuration file |

    |---|---|--|

    | | Login | Other |

    | Bourne shell (sh) | .profile | |

    | Bourne-Again shell (bash) | .bash_profile or bash_login or .profile | .bashrc
    |

    | C shell (csh) | .login | .cshrc |

    | TENEX shell (tsh) | .login | .tcshrc |

    | Korn shell (ksh) | .login | |

    | Z shell (zsh) | .login or .profile | .zshrc |


    You may feel justified in finding this a bit confusing.³ The reason for this confusion
    is that there is a distinction between calling your shell and other shells known
    as interactive shells. You really don''t need to worry too much about this. Just
    identify your current shell (by running echo $SHELL) and then be prepared to create
    the corresponding file from the "login" column of the above table. For shells
    bash and zsh there are potentially multiple files that you can use and actually
    have an order of precedence. However, as a newcomer to Unix expect that you will
    only need to create one configuration file at this point. Depending on your shell,
    we suggest choosing .login, .profile, or .profile.⁴


    # Creating your configuration file


    We are finally ready to set up your configuration file. This is a happy day and
    may change your life! We should point out that you may already have a configuration
    file present. This partially depends on who set up your account for you. In many
    environments it is common to add some default configuration settings to all user
    accounts. Let''s check:


    # Example 3.25.1


    Make sure you are in your home directory:


    ```

    $ pwd

    /Users/nig

    $ ls -a

    ```


    > ³You should also think about as we have taken the liberty of simplifying things
    a little. There are also global configuration files that affect all shells, as
    well as configuration files that are read at login time but take effect at logout.

    ⁴Once you become a Unix user, you will want to revisit the setup of your configuration
    files. For this book, we are only ever working with the login shell. Many Unix
    programs allow you to access a shell without having to learn the program. Interactive
    shells, depending on your choice of shell, might read a different configuration
    file to your shell. Interactive shells are also the default when you do things
    like the su command to change to another user.'
