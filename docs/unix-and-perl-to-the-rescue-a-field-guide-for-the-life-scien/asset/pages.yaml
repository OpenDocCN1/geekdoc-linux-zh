    # 4.16 The @ARGV array


    There is no argument about how useful this is, but so far all of our scripts have
    only dealt with variables that have been defined within the script. From a programming
    perspective this is generally considered to be a bad thing. Technically, we say
    in these scripts all of the variables are hard coded. This means every time you
    run the script you will get the same result, and if you want a different result
    then you have to edit the script. This is not desirable, and in some cases (e.g.,
    you don''t have permission to edit the script), it will not even be possible.


    Most of the time when we run scripts ideally want to specify some external data
    that the script should use. For example, let''s assume we want a script to multiply
    two numbers together. It would be great if we could just specify command-line
    arguments when we run the program, and let those arguments become the numbers
    to be multiplied.


