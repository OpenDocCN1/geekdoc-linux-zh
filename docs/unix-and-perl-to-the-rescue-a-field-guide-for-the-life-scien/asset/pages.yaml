  md: '# 5.6 Standard error


    In which you will learn to see the (standard) error of your ways

    If you''ve been thinking "Wow, I really loved learning about standard input and
    standard output, I wish there was another Unix data stream that I could study"
    then you''re in luck. This short chapter will complete the trinity of Unix data
    streams and briefly teach you about something called *standard error*.²⁷ This
    is a secondary form of output that can be produced by any Unix command.


    # Example 5.6.1


    This example should hopefully reveal most of what you need to know about how standard
    and error works. Follow the instructions carefully; there is a deliberate typo
    included in this example and you need to reproduce the typo:


    ```

    $ echo "Spiderman" > hero

    $ echo "Venom" > villain

    ```


    ```

    $ cat hero villain

    Spiderman

    Venom

    ```


    ```

    $ cat hero villain

    Spiderman

    cat: villain: No such file or directory

    ```


    ```

    $ cat hero villillain > hero_and_villain

    cat: villain: No such file or directory

    ```


    ```

    $ cat hero_and_villain

    Spiderman

    ```


    # Explanation


    We use the echo command to put some text into two separate files and we confirm
    that this has happened by using the cat command to display the contents of both
    files.

    Then we viewing the contents of both files again, but this time we include an
    error in one of the file names. The CAT command shows us the first file ("hero\),
    but we see a Unix error that there is no file called "Villain."


    We try repeating the command, but this time we redirect standard output to a file.
    Notice that you still see the same error message appear on the screen though.
    Finally, we confirm that the new file ("hero_and_villain") only received the contents
    of the correctly named file.


    Many Unix commands will produce error messages, most commonly used incorrectly.
    It is important to appreciate that error messages are controlled by a separate


    ²⁷ Often referred to as stder.'
