    is not given any arguments on the command line. Many Perl scripts will typically
    require the names of one or more files as input, and so you want to stop your
    script immediately and print the usage statement if such files are not specified.
    If your program does not require any arguments, you should omit line 12.


    Lines 14–15 are all required to remove the options from the command line and place
    them into the special %opt variable. The string ''hvfp:'' is the crucial part.
    There are four options: -h, -v, -f, and -p. The colon following p indicates that
    -p expects an additional argument. The other options do not take arguments.


    Lines 17–20 perform different actions depending on the options. These are simple
