  md: '# Advanced Unix 5


    # 5.1 Introduction to advanced Unix


    Where you will become BFF with GFF

    The average life scientist will spend a lot of time working with data. Increasing,
    this data will exist in the form of large data sets that will have been downloaded
    or extracted from one of the many large biological databases that are accessible
    on the Internet. In *in silico* data might consist of a small number of very large
    files, a large number of small files, or anything between these extremes. However,
    in many cases the default file format for these files will be plain text. The
    actual format of the plain-text file will vary a lot, but the fact that it is
    plain text means there are many Unix commands that are just waiting to get their
    hands on your data.


    This part of the book will cover a small number of extremely powerful Unix commands
    that are well suited for slicing and dicing files. If you are reading this part
    of the book *after* working through the "Essential Perl" section you will spot
    the similarities between some of these commands and some of the operators in Perl.
    Conversely, if you have to start learning Perl, you will find this section introduces
    many topics that will be revisited as you learn Perl.


    In addition providing many powerful commands, Unix also lets you choose those
    commands in myriad combinations that can enable you to tackle complex tasks. In
    a nutshell, you can set the output from any Unix command (by default), as input
    to another Unix command. In this way you can chain together several commands.
    Such *pipelines* will also be covered in this part of the book.


    # Example files


    To effectively demonstrate the Unix commands that we introduce in this part of
    the book, we will require some example files to work with. These files are freely
    available from our "Unix and Perl for Biologists" web site:


    http://unixandperl.com."


    If you don''t have access to these files (or don''t want to download them), you
    will still be able to learn a lot from following the examples in the chapters
    of this part of the book. We will also show snippets of the example files.


    # GFF and FASTA file formats


    GFF and FASTA are two file formats that are commonly used in bioinformatics for
    storing genomic sequence information. Some of the examples in this part of the
    book will make use of some files that are in this format. Wikipedia gives a good
    overview of both of these file formats, but the following sections provide a brief
    description.


    # FASTA file format


    It is increasingly common for biologists to work with large files that contain
    computer representations of DNA or protein molecules. These *sequence files* may
    contain'
