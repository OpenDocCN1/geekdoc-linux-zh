  md: '# 3.26 Programming with Unix


    Stick to the script

    The goal of this book is to teach you enough Unix to make you comfortable writing
    Perl scripts in a Unix environment. However, it is worth spending just little
    bit of time to show that you can also write programs using Unix. As we have already
    demonstrated, it is possible to put a set of Unix commands into a file and then
    execute those instructions using the source command. The next step is to treat
    the file containing the instructions as if it was any other Unix command. We want
    to be able to type the name of the file in order to run it and execute the instructions
    within it.


    Running your first Unix scriptnThe first thing you should learn when learning
    any programming language is to write a very simple program, just to check that
    the programming environment is working. Traditionally, this program will do nothing
    more than the words “hello world”.


    Example 3.26.1

    Use nano to put the following two lines into a new file. Save the file as “hello.sh”
    and make sure it is saved in ~/Unix_and_Perl/Code directory.


    ```

    # my first Unix script

    echo “Hello World”


    $ cd Unix_and_Perl/

    $ hello.sh

    bash: hello.sh: command not found

    ```


    Now try running the following commands and observe the output:


    Explanation

    We have made a two-line “program.” The first line is a simple command to describe
    the program, and the second line will use the Unix echo command to print out some
    text. The program name ends with “.sh” as this is a common suffix for what are
    known as shell scripts (programs that run in the Unix shell).


    You will have noticed that our newborn program doesn’t actually work. When you
    type hello.sh as if it was a regular Unix command, you will get a complaint from
    the shell that it can’t find this command. In a moment we will explain what you
    need to do in order to make this work, but it is important to first understand
    that it is not enough to just place Unix commands into a text file.'
