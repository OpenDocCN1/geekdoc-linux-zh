    $text =~ m/./; matches ''Mr.'', no special meaning to ''.''

    $text =~ m/\alb/; matches the string ''alb''

    $text =~ m\(||\)/; # matches ''('' or '''')

    $text =~ m\\; # matches ''\''

    ```


