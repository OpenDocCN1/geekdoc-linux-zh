  md: "# Comments\n\nComments are best used for notes to yourself. You should not\
    \ assume that users are programmers or that they will read your source code. Don't\
    \ write anything for users in your comments. Use comments to explain why you chose\
    \ to solve problems in a certain way (especially if it is an unusual solution).\
    \ Also use comments to explain what the point of subroutines and other large blocks\
    \ of code are. Finally, use comments to explain a little bit about what type of\
    \ data will be contained in certain variables. This is particularly important\
    \ when you use variables whose names are not intuitive. Adding a few words to\
    \ explain a block of code can save you (and others) a lot of time in future.\n\
    \n# Usage\n\nA usage statement briefly tells how to run your program. Usage statements\
    \ are reminders of how to use the software, and should be simple. There are a\
    \ number of different styles of usage statements. Below unless the program is\
    \ very simple. Below we show a typical one that includes simple options processing\
    \ (first covered in Chapter 6.7). This program takes two mandatory arguments and\
    \ some optional parameters. The text of the usage statement is displayed by the\
    \ program run without arguments.\n\n+   1. #!/usr/bin/perl\n2. use strict; use\
    \ warnings;\n3. use getopt::Std;\n4. \n5. my $version = \"1.0b\";n6. my %opt;\n\
    7. getopts('ab:v', \\opt);\n8. \n9. my $usage = \"\n10. usage: $0 [options] <file>\
    \ <threshold>\n11. options:\n12. -a\n13. -b int\n14. \"\"\n15. die $usage unless\
    \ ARGV == 2;\n16. \n17. if ($opt{h}) {die $usage}\n18. if ($opt{v}) {die $version}\n\
    19. \n20. # end\n\nNote how the usage statement (stored in $usage) is split across\
    \ multiple lines in this example (lines 10–14). You could write this on one line\
    \ and use newline characters, but doing it this way makes it very easy to see\
    \ what the final message will look like. This script also features a new variable\
    \ ($0) on line 10; this special variable simply contains the name of the program\
    \ that is being executed."
