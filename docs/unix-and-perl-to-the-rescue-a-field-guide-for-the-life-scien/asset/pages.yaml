  md: "# Programming topics 7\n\n# 7.1 Debugging strategies\n\nDe bug is in deputer\n\
    In some ways, writing Perl scripts is easy. It's getting them to work properly\
    \ that is the hard part. The process of removing errors and fixing problems is\
    \ called debugging and it usually accounts for the majority of the time you will\
    \ spend working on any given script. Finding and fixing bugs is one of your most\
    \ important skills. Like any skill, it takes time to learn. In the beginning,\
    \ you may blankly stare at an error message for what seems like entirely, and\
    \ Perl's error messages will make much sense to you if they were written in Klingon.¹\
    \ But with a little practice, you will learn to recognize the different types\
    \ of errors and implement the appropriate debugging strategies without much thought.\n\
    \nIt's important to realize that the problems that require debugging will not\
    \ be limited to your actual code. More generally we can divide all of the issues\
    \ that might require debugging into several categories:\n\n+   (1) errors that\
    \ are caused before your Perl code is even evaluated;\n(2) errors in the code\
    \ itself, further divided into:\n  (2.1) compile-time errors;\n  (2.2) run-time\
    \ errors;\n(3) other problems (due to various forms of user error).\n\n# Use Perl's\
    \ built-in syntax checker\n\nYou should get into the habit of checking your code\
    \ before you run it. Perl has a built-in tool for checking the syntax of your\
    \ script; this can be utilized by supplying the -c option to the Perl command.\
    \ For example, if you have a script called script.pl, then simply run:\n\n```\n\
    $ perl script.pl\n```\n\nNote that this does not run the script, it checks the\
    \ script for potential errors. If your script contains no syntax errors, you will\
    \ see a message saying:\n\n```\nscript.pl syntax OK\n```\n\nHowever, if your script\
    \ contains errors you will see all of those errors just as you would actually\
    \ run it. If possible, you should never run a script that produces any error or\
    \ warning messages.\n\n> ¹We'd like to believe that somewhere in a parallel universe\
    \ exists a programming language that gives you error messages such as \"Hey Boy,\
    \ I notice that on line 23 you forgot to put any data in variable $, and then\
    \ on line 32 you're trying to access an array element but you forgot to include\
    \ the square bracket.\""
