  md: '# The mv command


    If you want to move a file in Unix, you need to use the mv command. Whenever we
    use commands like mv, we must always bear in mind the two concepts of source and
    target. The source is the location of the file (or directory) that we want to
    move; the target is the location of the place where we want to move the file.
    Commands as mv will always expect you to specify a source and target location
    (in that order).


    # Example 3.16.2


    Let’s move these two files into the “Temp” directory that we created previously
    (Chapter 3.14):


    ```

    $ ls

    Code Temp earth.txt heaven.txt

    $ mv earth.txt Temp/

    $ mv heaven.txt Temp/

    $ ls

    ```


    ```

    Code Temp

    $ ls Temp/

    earth.txt heaven.txt

    ```


    # Explanation


    We use the mv command twice, once for each file that we want to move. The target
    location for the file is the “Temp” directory. After moving the files, we confirm
    that the current directory no longer has the files and that they are instead in
    the “Temp” directory. If you use tab-completion to type the name “Temp” Unix will
    automatically add the trailing forward-slash character. This helps to remind you
    that “Temp” is a directory and not a file.⁴


    # Renaming files


    In the last example, the destination for the mv command was a directory name (“Temp”).
    However, the target could have also been a (different) file name, rather than
    a directory. This is how you use mv to rename files.


    # Example 3.16.3


    Let’s make a new file and move it while renaming it at the same time:


    ```

    $ touch rags

    $ ls

    Code Temp rags

    $ mv rags Temp/riches

    ```


    > ⁴ When working with directories, you do not need to add a trailing forward-slash
    character to the name of the last directory in any path, but it doesn’t hurt.
    This is another reason why using tab-completion is such a good habit to get into,
    because it will always add the slash character for you. See the next chapter for
    more details.'
