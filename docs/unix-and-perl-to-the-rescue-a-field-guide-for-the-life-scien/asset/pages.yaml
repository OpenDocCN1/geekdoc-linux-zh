    # Understanding the script


    In this program, $y is declared twice, once outside the conditional and once inside.
    The output shows that the two $y variables are completely separate. The declaration
    of $y on line 8 is local to the block. Within this inner scope, the new $y makes
    the global $y that was declared on line 6. It is common, and often desirable,
    to reuse names in a program. As long as variables are in different blocks of code,
    i.e., all have a different scope, this will not cause any problems.


    # Why strict is essential


    With lexical variables, you can make sure whatever happens in a block stays in
    the block and doesn''t unknowingly affect variables in a more global scope. This
    concept becomes increasingly important as your programs grow in length and complexity.
    If you use global variables, you have to keep track of all the variable names
    to make sure you don''t unintentionally overwrite some variable used in another
    part of the program. With lexical variables, each block can have its own set of
    private variables. Not only will this improve your ability to focus on the task
    at hand, it will also help you share code among your programs and with other people.
    The real power of programming comes when you join your code to other people''
    code, and that can only happen if you get into the habit of using lexical variables.


    # Symbol tables


    The last part of this chapter is potentially confusing. It might not make sense
    right now. Consider this optional reading.


    Every new word you create in your program is stored in a table. So far, all the
    new words you created were scalar variable names. But later, you will create things
    with names, such as arrays, hashes, and subroutines. These names are stored in
    your program''s symbol table, which is also called a package. The name of your
    program''s package is main. This is sort of a family name. A variable you define
    as $x is also known as $main::$x. There are other families your program may interact
    with, and these all have their own names. $Toolbox:: refers to a variable called
    $x in a symbol called Toolbox. The Toolbox $x is a completely different variable
    from your $x. Variables in a symbol are true global variables, available to the
    entire program.'
