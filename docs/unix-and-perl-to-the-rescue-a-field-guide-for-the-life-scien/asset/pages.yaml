  md: "# Programming topics\n\nOne of the reasons we suggest include strict is because\
    \ it changes misspelled variable names from run-time errors to compile-time errors.\
    \ We also suggest including warnings to catch run-time errors that result from\
    \ undefined values. There are many more reasons to use strict and use warnings,\
    \ so make sure your program has these statements.\n\n# Commenting-out code\n\n\
    One of the most common tools for debugging commenting-out a line of code to determine\
    \ if it is the line causing the error. This is as simple as placing the comment\
    \ # at start of a line to prevent it from compiling. If the program runs, you\
    \ have isolated which line caused the error. Then it is a matter of finding out\
    \ what of the line is not syntactically correct. Most of the time, Perl error\
    \ messages point you to the exact offense, and may offer advice on how to fix\
    \ it, but this is not always the case. The error occurs in a preceding statement.\n\
    \n# Example 7.1.3\n\nIf you run the following script, you will receive the error\
    \ message shown below.\n\n+   1. #!/usr/bin/perl\n2. # example3.pl\n3. use strict;\
    \ use warnings;\n4. \n5. $x = 1;\n6. $y = 2;\n7. $z = 3;\nScalar found where operator\
    \ expected at example3.pl line 7, near “$z” (Missing semicolon on previous line?)\n\
    syntax error at example3.pl line 7, near “$z “\n\nIn your early days as a programmer,\
    \ you will see the “Missing semicolon on previous line” error quite. In this example\
    \ the semicolon was missing from line 6. If you comment-out line 6, you will find\
    \ that the program runs with no errors.\n\n# Commenting-out multiple lines with\
    \ pod tags\n\nSometimes you might want to comment-out many lines at once. While\
    \ you could begin every line with a #, there is a more convenient way. Perl supports\
    \ multi-line comments via its documentation system called “pod,” which is an acronym\
    \ for Plain Old Documentation. To learn more about how to use pod, see Chapter\
