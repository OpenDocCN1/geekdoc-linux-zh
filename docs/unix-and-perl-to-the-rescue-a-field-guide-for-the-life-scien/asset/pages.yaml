  md: '# The hierarchy of a Unix filesystem


    # 3.5 The hierarchy of a Unix filesystem


    This will be a root-and-branch review


    Looking at a list of directories from within a Unix terminal can often seem confusing.
    But bear in mind these directories are exactly the same type of folders that you
    can see if you use your computer''s graphical file management program. A tree
    analogy is often used when describing computer filesystems because of the branching
    nature of the directory structure. Like a tree, a Unix filesystem has roots, or
    more specifically, it has a root, which is represented by a single forward-slash
    character (/).¹⁴ The analogy with the tree starts to break down a little as it
    is common to refer to the root level as the “top” of the directory structure –
    think of it as an inverted tree if it. From the root level (/) there are usually
    many (10–20) top-level directories. A small number of directories will be specific
    to different types of Unix. There is a fictional example of what part of a Unix
