    # Connect to your Ubuntu Server


    Now, it is time to connect from your Ubuntu Desktop or other computer to your
    Ubuntu Server. To that, we are using a tool called SSH and making a secure connection
    between your computer and your server. This is also the standard way to get access
    to any Ubuntu Server in the cloud.


    First, get the IP of your Ubuntu Server. If you have a screen and keyboard connected
    to it, you can log in and then type:


    +   1. ip a


    This will show the IP of your Ubuntu Server. Now, from your desktop, run the following
    command:


    +   1. ssh USERNAME@IP


    Replace the USERNAME with your username and the IP of your server. The first thing
    that comes back is that you need to approve the host key. Every SSH server generates
    a hostkey; before you can connect, you need to approve it. This will also protect
    you and will not let SSH into a server with the same IP as your home server. The
    hostkey will differ, and your SSH client will show an error message.


    After entering your password, you should have a CLI connection to your Ubuntu
    Server.'
