    # About Kubernetes


    Kubernetes is a popular open-source container orchestration platform that automates
    the deployment, scaling, and management of containerized applications. It was
    originally developed by **Google** and is now maintained by the **Cloud Native
    Computing Foundation (CNCF).**


    Today, Kubernetes is the standard way of running applications in containers. You
    can get a Kubernetes cluster on almost all cloud providers today. With Kubernetes,
    you can easily deploy your applications and then let Kubernetes take care of scaling
    and deploying your applications.


    Kubernetes also has a power API that can be expanded. So, different services can
    add their own endpoint and, in so, add new functions to the cluster. It is from
    adding functions to creating **Transport Layer Security (TLS)** certificates to
    handling incoming and outgoing traffic.


    In the **Server** section, we will go over how you can set up your Kubernetes
    cluster. First, we will start up a small local cluster and test some'
