    # apache2.conf


    This is the main config file that will be started when Apache starts. From this
    file, all other folders are included.


    When running Apache, you can install the module. PHP is an example of one module,
    but it can be many. All modules are located in mods-available. You may not need
    them all, so you can enable the modes you like by creating a link from mods-available
    to mods-enabled. Then, when Apache is started, Apache2.conf will include the folder
    mods-enabled and load the module from that folder.


    Site folders are the same. For example, a site is a domain, mymyapp.example.com,
    and you can have multiple sites in the same WordPress. For example, a web hotel
    having 100 or even more sites enabled.


    So, add your config (we will create the config soon) and add it to sites-available.
    Then, we will activate it by linking it into sites-enabled.


