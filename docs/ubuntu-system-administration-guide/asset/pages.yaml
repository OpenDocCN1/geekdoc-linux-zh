  md: '# Preface


    Linux is swiftly establishing itself as the foundation of today’s digital infrastructure,
    playing a central role in everything from personal desktops and enterprise-grade
    web servers to cutting-edge cloud platforms, smart home devices, and embedded
    IoT systems. Its presence extends to nearly every corner of computing. Whether
    you are browsing a website, deploying an app in the cloud, or working on a development
    project, chances that Linux is working behind the scenes.


    For aspiring developers, IT professionals, and system administrators, learning
    Linux is not just an option, it is a strategic advantage. Seasoned professionals
    often recommend starting with Linux before venturing into other tools such as
    Docker, Kubernetes, or even advanced cloud-native frameworks. Why is that? Because
    Linux provides deep insight into how operating systems function. It teaches you
    how processes run and interact, how file systems are organized, how networks are
    structured and secured, and how permissions are managed. These are the core concepts
    that underpin all modern computing tools.


    By mastering Linux, you develop a strong mental model of how systems operate—one
    that allows you to troubleshoot more effectively, script more efficiently, and
    deploy with greater precision. It builds the kind of confidence that lets you
    approach complex technologies like orchestration, virtualization, and continuous
    integration pipelines with a solid understanding of what is really happening behind
    the scenes.


    This book is centered on Ubuntu, one of the most accessible and widely adopted
    Linux distributions in the world. Ubuntu is known for its balance of power, simplicity,
    and versatility. It delivers the full capabilities'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'of Linux in a package that is approachable for newcomers yet robust enough
    for professionals managing enterprise environments. With its regular updates,
    strong community support, and broad compatibility with both open-source and commercial
    software, Ubuntu serves as an ideal entry point into the Linux ecosystem.


    Whether you are looking to replace your current operating system and use Ubuntu
    as you are interested in deploying servers, managing virtual machines, hosting
    applications, or building your cloud infrastructure, this book will walk you through
    everything you need to get started. Ubuntu provides a secure, stable, and customizable
    platform that can grow with your needs, supporting everything from basic productivity
    tasks to advanced server-side operations, software development, and DevOps workflows.


    In short, learning Linux and opens doors. It gives you the freedom to explore,
    experiment, and take control of your computing environment. It lays the groundwork
    for further exploration into the vast world of open-source technologies.


    This book is your roadmap to getting there, with practical guides, hands-on exercises,
    and real-world use cases that will help you build both confidence and capability
    as a Linux user.


    # Chapter 1: Getting Familiar with Ubuntu Ecosystem - This chapter introduces
    the Linux and Ubuntu ecosystem, starting with the history of Linux and its evolution
    into one of the most widely used operating systems. It explores the Linux stack,
    popular distributions, and Ubuntu''s development, release cycle, and various editions.
    The chapter highlights the growing importance of Linux in servers, IoT, and cloud
    computing. Readers are also introduced to key Ubuntu-based systems like Mint and
    Pop!OS, and other Linux distributionsros like Red Hat and Alpine. To prepare for
    upcoming hands-on exercises, the chapter concludes by guiding readers to create
    GitHub and Blogger accounts for saving code and documenting progress.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'Chapter 2: Install, Upgrade, and Configure Ubuntu Desktop - This chapter guides
    readers through installing and configuring Ubuntu Desktop. It begins with downloading
    the Ubuntu ISO, creating a bootable USB using tools like Etcher, and performing
    installation via USB or dual-boot with Windows. It covers pre-installed Linux
    options, basic troubleshooting, and verifying hardware compatibility. The chapter
    also introduces software installation using the Ubuntu Software Center, Snap Store,
    and terminal commands. Readers learn how to update and upgrade Ubuntu, manage
    apps, and back up configurations using the .config folder and Git. By the end,
    users will have a fully functional Ubuntu system ready for further customization.


    Chapter 3: Environments and Window Managers - This chapter explores customizing
    Ubuntu with the i3 tiling window manager, offering efficient window navigation
    by keyboard shortcuts. It covers installing and configuring i3, setting resolutions,
    adding custom startup scripts, and improving usability with tools like sound controllers,
    screenshot utilities, and lock screens. The chapter also introduces essential
    productivity tools, including email clients, password managers, file encryption
    with PGP, and communication apps like Slack and Teams. For developers, it explains
    setting up Git, creating SSH keys, and using code editors like VS Code and PyCharm.
    By the end, readers have a fully personalized and productive Ubuntu environment.


    Chapter 4: Setting up Firewall, VPN, and Wi-Fi Networks - This chapter covers
    essential networking tools in Ubuntu, focusing on connectivity and security. It
    explains how configure DHCP and static IP addresses, connect to VLANs and wireless
    networks, and mask your device''s MAC address for privacy. It introduces VPN setup
    using OpenVPN and WireGuard, and demonstrates encrypting DNS traffic with DNSSEC
    for added protection. Readers also learn to configure custom firewall rules using
    iptables and safeguard their systems with ClamAV antivirus. By the end, users
    can confidently connect to, secure, and manage networks on Ubuntu Desktop in both
    personal and professional environments.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Chapter 5: Preparing Virtualization Environment - This chapter introduces
    virtualization in Ubuntu using KVM, enabling users to run multiple isolated operating
    systems on a single host. It covers installing KVM, setting up network bridges,
    and creating virtual machines (VMs). Readers learn to manage VM settings, take
    snapshots, and enable device passthrough like GPUs. The chapter also explores
    alternative tools such as VirtualBox, VMware, and Vagrant for VM creation and
    sharing. Guidance is provided on converting VM image formats for compatibility
    across platforms. By the end, users can effectively create, configure, and manage
    VMs and virtual environments for both testing and development purposes.


    # Chapter 6: Up and Running with Kubernetes and Docker - This chapter introduces
    Docker and Kubernetes as essential tools for containerized development. It covers
    Docker installation, running a Minecraft server container, and managing multi-service
    applications like WordPress and Metabase using Docker Compose. Readers learn to
    connect multiple containers, persist data, and streamline development with local
    volumes. The chapter transitions to Kubernetes using Minikube, demonstrating how
    to deploy WordPress and MySQL with Kubernetes manifests. Key concepts include
    namespaces, services, deployments, and load balancers. By the end, readers can
    run, scale, and manage containers locally using Docker and Kubernetes for efficient,
    isolated application development and testing.


    # Chapter 7: Install Ubuntu Server on Metal, Cloud, and Network - This chapter
    explores various methods to install and manage Ubuntu Server across physical machines,
    virtual environments, and cloud platforms. It covers using SSH keys for secure
    access, installing via USB or VM, and deploying on cloud providers like Google
    Cloud and Hetzner. Readers learn about scalable server provisioning using machine
    as a service (MAAS), using PXE booting and automated installations. Concepts like
    cattle vs. pets emphasize treating servers as disposable for easier management.
    By chapter’s end, users can confidently set up single or multiple Ubuntu Servers
    suited to local or enterprise-grade infrastructure.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Chapter 8: Keeping Check on Your Ubuntu Server - This chapter explores tools
    and techniques for monitoring and securing Ubuntu Servers. It begins with basic
    Linux commands like top, netstat, and du for local performance insights. For GUI
    monitoring, Cockpit is introduced, while Grafana, Prometheus, and Node Exporter
    enable the visualization of scalable server metrics. Filebeat, Elasticsearch,
    and Kibana are used for centralized log collection and analysis. Security tools
    such as FailBan and OSSEC help detect intrusion attempts and automate responses.
    Readers learn to create dashboards, configure alerts, and integrate logs and metrics
    into unified views—building a robust foundation for proactive server management
    and security.


    # Chapter 9: Setup Advanced Network, Firewall and VPN Servers - This chapter guides
    configuring Ubuntu Server as a network firewall and router. It covers setting
    up network interfaces, VLANs, and routing using Netplan, and securing traffic
    with iptables. You learn to install and configure dnsmasq as both a DHCP and DNS
    server, enabling client IP management and domain resolution. The chapter also
    details creating VPN tunnels using OpenVPN and WireGuard, including certificate
    generation and client-server configurations. By the end, you''ll have a fully
    functional Ubuntu-based router capable of secure communication and traffic control
    for both local and remote networks.


    # Chapter 10: Running Virtualization Server Environment - This chapter explores
    setting up an Ubuntu Server as a virtualization host using KVM. It guides installing
    and managing VMs via CLI, desktop GUI (Virtual Machine Manager), and a web interface
    (Cockpit). The chapter also introduces containerization with Podman, a Docker
    alternative, to deploy a monitoring stack with Grafana, Prometheus, Loki, and
    Promtail. Detailed setup for container-based metrics and log collection from multiple
    servers is provided, using podman-compose. The chapter concludes by contrasting
    virtualization and containers, emphasizing containers for lightweight, scalable
    service deployment and preparing readers for Kubernetes in the next chapter.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Chapter 11: Setup Webserver, Deploy and Run Webapps - This chapter explores
    setting up web servers and deploying web applications on Ubuntu. It begins with
    installing Apache and NGINX, configuring domains, and serving content. Two databases
    are introduced: MariaDB (SQL) and MongoDB (NoSQL), including setup, usage, and
    backup processes. Practical deployments include WordPress and Observation, demonstrating
    PHP app hosting and virtual host configurations. Rocket.Chat is deployed via Docker,
    connected to MongoDB. The chapter also covers performance tuning for web servers
    and emphasizes proper database users for security. By the end, readers can host,
    optimize, and manage web apps and databases on Ubuntu Servers.


    # Chapter 12: Kubernetes Run and Setup - This chapter guides readers through setting
    up a Kubernetes cluster on Ubuntu using kubeadm. It covers preparing master and
    worker nodes, disabling swap, and installing core components. The chapter introduces
    Helm for managing Kubernetes packages and demonstrates deploying essential services
    like OpenEBS for storage, Prometheus and Grafana for monitoring, and Traefik with
    MetalLB for ingress and load balancing. A full WordPress deployment, including
    MySQL, is configured and accessed using both NodePort and ingress routes. The
    chapter concludes with basic kubectl commands for troubleshooting and managing
    the cluster, forming a strong foundation for further automation.


    # Chapter 13: Task Automations, CI/CD Pipeline, and Service Deployment - This
    chapter focuses on automating infrastructure tasks using Bash, Ansible, and Terraform
    to ensure repeatable, reliable server and service setups. It starts with creating
    Bash scripts, then advances to Ansible for managing tasks across multiple servers
    via Docker containers. The chapter introduces building and pushing Docker images,
    running host-level tasks from containers, and deploying applications to Kubernetes
    using Terraform. These automation techniques form a complete CI/CD pipeline foundation.
    By the end, readers gain the tools to configure, deploy, and'
  merge: -1
  pgno: 16
- img_proc: true
  md: manage services efficiently, marking a transition to professional DevOps practices
    within Linux and Ubuntu environments.
