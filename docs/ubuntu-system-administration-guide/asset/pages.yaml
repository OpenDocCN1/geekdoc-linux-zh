  md: 'In Ubuntu, open the Software and Updates program. The program will show you
    from which sources you are installing software. You can also install and enable
    software properties here.


    Open the program called Software Updater. The program will update all the packages
    for you and keep your Ubuntu system up to date. If the tool finds a new update,
    it will send you a notification so that you can update your Ubuntu system.


    You can also run the following command in the terminal:


    +   1. sudo apt-get update


    This will update the repos and find new packages that need to be installed:


    +   1. sudo apt-get upgrade


    This will upgrade all packages that have new versions.


    # Upgrading Ubuntu LTS


    Ubuntu comes with its own update tool, which allows you to upgrade from the LTS
    version to the next version. This will allow you to keep your Ubuntu Server or
    desktop running for a long time while still updating with the latest software.


    In the terminal, run the command:


    +   1. #Here we have the -h flag to show the help section to the release upgrade
    command.

    sudo do-release-upgrade -h


    It will find any new version and upgrade your Ubuntu LTS for you. You can also
    upgrade to a minor version by updating the configuration. The tool cannot upgrade
    the LTS before the first minor is released. So, if the LTS is released on 22.04,
    you can run the tool to upgrade when 22.04.01 is released.


