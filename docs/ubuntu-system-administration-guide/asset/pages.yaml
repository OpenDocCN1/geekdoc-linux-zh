  md: '# # CHAPTER 1

    Getting Familiar with Ubuntu Ecosystem


    # Introduction


    In this chapter, we will be introduced to Linux and Ubuntu. We will start by discussing
    the creation of Linux. Then, we will go into Ubuntu and look at how it began,
    understand Ubuntu releases, and cover some of the different versions of Ubuntu.
    Finally, we will cover other Linux distributions and how they are different from
    Ubuntu. Additionally, we will discuss what parts make up the Linux stack.


    We encourage you to create a blog page and an account by the end of the chapter
    so that you are ready for the subsequent chapters in the book.


    # Structure


    In this chapter, we will cover the following topics:


    +   - Linux history

    - Linux stack

    - Usage and stats of Linux'
  merge: -1
  pgno: 32
- img_proc: true
  md: '+   * Ubuntu history

    * Ubuntu releases

    * Ubuntu versions

    * Other Linux distributions

    * Create GitHub and blogger account


    # # Objectives


    By the end of the chapter, we will understand how Linux started and how the different
    parts of the Linux stack are put together. We will also understand the difference
    between different Linux versions and how Ubuntu is versioned and released.


    # # Linux history


    Linux was created by Linux Torvalds, a computer science student at the University
    of Helsinki, in 1991 at the age of 21. What started as a small hobby is today
    one of the most used operating systems.


    At first, Linus named the invention Freax, but one of the administrators of FUNET,
    where the project was uploaded, did not like that name and renamed it to Linux.


    Tux, the penguin mascot as depicted in Figure 1.1, was chosen by Linus after a
    small penguin bit him during a visit to the National Zoo and Aquarium in Canberra.


    ![](img/729ff652633ff312828be609e679849e_33_0.png)


    Figure 1.1: Tux'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'Today, you can find the Linux kernel development on GitHub. https://github.com/torvalds/linux
    and follow the development there, and today, there are over 13k contributors to
    the Linux kernel. Refer to the following link: https://en.wikipedia.org/wiki/Ubuntu


    # Linux stack


    The Linux kernel is the base of all Linux operations systems. It is the one that
    boots and adds all drivers. If the car brand is Ubuntu, the engine is the Linux
    kernel. On top of the Linux kernel, we can choose/build different operating systems,
    such as Ubuntu and Red Hat.


    Now, to use your Linux system as a desktop computer, you would also need some
    type of windows manager. In this book, we will look more at the windows manager
    i3 and the default windows manager in Ubuntu gnome.


    # Usage and stats of Linux


    The usage of Linux and Ubuntu is growing fast. Today, Linux is the primary OS
    used by our supercomputers. It powers NASA servers and is the most used OS for
    IoT devices.


    In the cloud, it is the dominant OS, with 90% of all OS running Linux. Linux is
    also the OS powering the Kubernetes cluster, which is becoming the default platform
    for hosting applications. Some other states from Linux are as follows:


    +   - Web servers also completely rely on Linux. According to Linux server statistics,
    of the top 1 million web servers, 96.3% employ Linux environments.

    - The Linux kernel development report reveals that 90% of the workload deployed
    on the cloud is based on the Linux system.

    - 65 SpaceX missions were completed using Linux-powered technology, according
    to the latest Linux statistics.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '+   - According to the latest Linux distributions statistics, Ubuntu is the
    most popular Linux distributions (32.8%), followed by Debian (14.4%) and CentOS
    (10.8%).


    # Ubuntu history


    One of the most used operating systems is Debian, and Ubuntu is based on Debian.
    Ubuntu was built by the British company Canonical and is set to be a friendly
    and easy-to-use Linux system. The first release Ubuntu 4.10, which was released
    in October 2004. Today, a lot has happened, and Ubuntu has now released version
    22.04.


    There is a base version of Ubuntu. Ubuntu Desktop is the desktop for laptops,
    office, and home computers with a GUI. Ubuntu Server runs on both cloud and metal,
    and Ubuntu Core is used to run on IoT devices.


    https://en.wikipedia.org/wiki/Ubuntu


    # Ubuntu releases


    Ubuntu is released twice yearly, one version on 04 April and one on 10 October.
    The release makes up the name with the year. Ubuntu 22.10 will be released in
    October 2022. So, how long is then a release supported? Well, that depends. Ubuntu
    makes long-term support (LTS) releases, and the LTS releases are supported for
    ten years. If you plan to set up a server that will run longer or a desktop to
    work on, consider using the LTS releases. However, if you want the latest kernels
    and tools, you can look at the newest release. In this book, we recommend installing
    the LTS releases. Ubuntu also provides tools to upgrade from the LTS to the next
    one.


    More on the Ubuntu releases is found here, https://ubuntu.com/about/release-cycle.


    # Ubuntu version'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'Ubuntu and the Linux kernel are open-source, which has led many developers
    to make their own version of Ubuntu. People who wanted to use another graphical
    desktop environment on a particular version of Ubuntu for schools or music studios.


    Some of the different versions of Ubuntu are as follows:


    # Mint


    Linux Mint is based on Ubuntu and the XFC Windows desktop. Linux Mint is pre-filled
    with many of the standard tools to get you started and working quickly after installation.


    Linux Mint is an operating system for desktop and laptop computers. It is designed
    to work out of the box and comes fully equipped with the apps most people need.


    You can find more information on Mint Linux and download links at https://linuxmint.com/.


    # Pop


    System76 is a company building Linux computers, and its operating system is based
    on Ubuntu.


    Pop!OS is designed for fast navigation, easy workspace organization, and fluid,
    convenient workflow. Your operating system should encourage discovery, not obstruct
    it.


    You can find more info on Pop Linux and download links at https://pop.system76.com/.


    # LXLE


    Lxe is a light version of Ubuntu. We used computers that were low in resources
    but still needed to be able to be used in a secure and updated way.


    The developers of LXE describe it as light on resources and heavy on functions.
    LXLE is based on Ubuntu, and it is super-fast to boot up.'
