    +   1. root@server:~# chmod +x install_docker.sh

    2. root@server:~# ./install_docker.sh

    3.


    As you can see, it will run the command and install Docker. It is good practice
    to add the commands you run in a file, so you have them saved.


    You can also use Bash script to detect the state of your server. By running some
    commands that will print output, we can quickly get the state of our server. It
    would be great if there were some issues with the server, and troubleshooting
    was needed. Jump in and run a script to get some basic data on the problem. It
    will save you lot of time if an incident happens. Here is a script that prints
    data to help resolve Ubuntu issues. You can also add scripts to expand it.


    The following example code is a good start:


    +   1. #!/bin/bash

    2. echo "Disk"

    3. df -h

    4. du -h --max-depth=0 /

    5. du -h --max-depth=0 /var

    6. echo "inode"

    7. for i in `find . -type d `; do echo $i | wc -l` wc -a $i; done | sort -n

    8.

    9. echo "Network"

    10. ip a

    11. ip r

    12. cat /etc/resolv.conf

    13.

    14.

    15. echo "Memory"

    16. free'
