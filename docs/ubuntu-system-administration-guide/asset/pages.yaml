  md: '# CHAPTER 7

    Install Ubuntu Server on Metal, Cloud, and Network


    # Introduction


    Ubuntu can be installed and run from cloud providers, regular computers, servers,
    and small microcomputers like the Raspberry Pi. The installation approach is different
    from where you install one server to many, and several hundreds.


    # Structure


    This chapter will cover the following topics:


    +   * Cattle vs. pets

    * Using SSH to connect to your server

    * Install Ubuntu Server with USB

    * Using Ubuntu in VM

    * Ubuntu Server in Google Cloud and Hetzner

    * Large Ubuntu installation made easy'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# Objectives


    In this chapter, we will learn how to install an Ubuntu Server, from setting up
    a single server, such as a virtual machine or a physical computer.


    We will also examine the installation and setup of an Ubuntu Server, both on Google
    Cloud and Hetzner, to understand how easily you can set up and utilize your Ubuntu
    Server within a cloud provider. We will then move over to large Ubuntu installations
    and provision your Ubuntu Server from one to many using the Ubuntu tool, **machine
    as a service (MAAS).**


    The new Ubuntu Server provides SSH access, allowing you to start administering
    your server. To use SSH safely, we will create secure SSH keys for use when accessing
    your Ubuntu Server.


    # Cattle vs. pets


    When we talk about servers, we use the terms cattle and pets and treat them differently.
    When you have a server, you treat it as a pet, you are taking care of the server
    for a long time. We log in to the server and upgrade it, install our software,
    and perform other tasks. When we use our servers as cattle, it takes some time
    to set the tools up. Then, instead of keeping our server for a long time, we delete
    and reinstall the server. We have the same software running, instead of logging
    into our pet server and upgrading, we destroy our cattle server and reinstall
    it with the updated service.


    This approach to treating servers is good practice. To ensure servers are running
    smoothly in a company for any production purpose, it is recommended to handle
    them as cattle. If you have your home server with your media on, then you should
    be treating it with care


    In this chapter, we will understand how to treat our servers more like cattle.


    # Using SSH to connect to your server'
  merge: -1
  pgno: 158
- img_proc: true
  md: 'When connecting to your server as an administrator, we use SSH. SSH is a client
    on your computer that connects to an SSH server on it. It creates a secure tunnel
    between the client and server and lets run CLI commands on the server. This is
    the default way of administering your Ubuntu Server. To secure this communication,
    the default is to use a username and password to log in.


    However, a more secure way is to create an SSH key on the computer where you work.


    This key is made of two parts:


    +   - The private part that you do not want to share.


    +   - The public part you can share with others.


    When we use SSH keys, we install our public key on the server, and then we connect
    to the SSH server. You can only let people in if they have the matching private
    key.


    This has now become the default way of accessing your server in the cloud.


    You should always aim to use SSH keys when you can. To generate the keys and run
    the following command:


