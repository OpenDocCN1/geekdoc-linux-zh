    \ that, there are several commands that you can use. In this chapter, we will\
    \ look at one of the tools called Ansible.\n\nWith Ansible, you can run a script,\
    \ and it will run the commands on the selected server. You can also group them\
    \ so that they only run a set of tools on one type of server. For example, only\
    \ install MySQL on your MySQL server.\n\nWe will now install and set up Ansible\
    \ to run on our. We will run Ansible in a Docker image. That way, we can always\
    \ guarantee our ansible will work and that the version of ansible will be the\
    \ same as the docker image. Let us set up a docker-compose to run our ansible.\n\
    \nCreate a docker-compose file and add the following content:\n\n+   - services:\n\
    - ansible:\n- build:\n- volumes:\n - /playbooks:/opt/playbooks\n- /files:/opt/files\n\
    - /hosts:/etc/ansible/\n- /.ssh:/root/.ssh\n- command: tail -f/etc/fstab\n\nHere,\
    \ we are making an Ansible folder and mounting it in 4 folders. Playbooks will\
    \ be the command run; hosts are the machines on which we will run the command,\
    \ and the files are the files we want to copy over our server. The last folder\
    \ is to keep our hostkey over Docker restart.\n\nWe also need to build a Docker\
