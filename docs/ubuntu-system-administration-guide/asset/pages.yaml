- img_proc: true
  md: '# Keeping you safe


    Before you start editing firewall rules, set up a backup path to get access. It
    can be as simple as a screen, keyboard, or virtual console.


    If you cannot set up a screen, a crontab rule that clears the iptables rules can
    be added.


    The command, `iptables -F`, will clear all the rules, and adding that to a crontab
    will save you if you lock yourself out.


    Add the following to `/etc/crontab`, as shown:


    +   1. `00 1 *** root iptables -F`


    Let us set up our firewall, create a new file `fw.sh`, and add the following commands
    to that script. Then, you can simply apply them.


    First, we need to add rules to forward the traffic from our different network
    cards.


    +   1. `iptables -t nat -A POSTROUTING -s 10.33.33.0/24 ! -d 10.33.33.0/24 -j
    MASQUERADE`n2. `iptables -t nat -A POSTROUTING -s 10.330.34.0/24 ! -d 10.33.34.0/24
    -j MASQUERADE`n3. `iptables -A FORWARD -d 10.33.33.0/24 -o enp7s0 -m state --state
    RELATED,ESTABLISHED -j ACCEPT`n4. `iptables -A FORWARD -d 10.33.34.0/24 -o vlan.11@enp7s0
    -m state --state RELATED,ESTABLISHED -j ACCEPT`n5. `iptables -A FORWARD -s 10.33.34.0/24
    -i enp7s0 -j ACCEPT`n6. `iptables -A FORWARD -s 10.33.34.0/24 -i vlan.11@enp7s0
    -j ACCEPT`


    It is essential that the IP and interfaces are correct when running the scripts.

    The small script aforementioned is all that is needed to set up that traffic can
    now go from your private network and out. However, now we also need to lock down
    our server so we cannot access any ports, for example, SSH, from the public network.'
