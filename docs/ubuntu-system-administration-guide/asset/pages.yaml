    # Controlling traffic with iptables


    Iptables is a tool to control traffic coming in and out of our server. There are
    three basic chains, the input/forward and output chains.


    Now, we need to add rules to them all for setting up our router.


    To set up our Ubuntu Server as a basic router and route traffic from our private
    network to our public, first we need to set up our server to forward packages
    between network networks. This is done by running the following code:


    +   1. echo "1" > /proc/sys/net/ipv4/ip_forward


    Now, we can make a simple script that sets up our router. If you search the internet,
    you will find that many firewall scripts for Ubuntu set up the same configuration.
    Here, we will give a simple example. If you plan to run this in production, search
    for a good script as a base on the internet.'
