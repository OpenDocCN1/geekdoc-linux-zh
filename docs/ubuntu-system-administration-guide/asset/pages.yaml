    # Pods


    Pods are running in a different namespace. Run the following command to find and
    locate Pods in your cluster. If we want to look more into our Pod, use the get
    pods to find a Pod:


    ```

    kubectl get pods -A

    kubectl get pods

    kubectl get ns

    kubectl get pods -n openebs

    ```


    Then, we can get more info from those Pods by running the following command and
    adding the name of the pod as follows:


    ```

    kubectl describe pod traefik-NAME_FROM_YOUR_CLUSTER

    kubectl logs -f traefik-NAME_FROM_YOUR_CLUSTER

    kubectl edit pod traefik-NAME_FROM_YOUR_CLUSTER

    ```


    As you see, we are using the command get/describe/edit, and you can run the same
    command on all resources in Kubernetes.'
