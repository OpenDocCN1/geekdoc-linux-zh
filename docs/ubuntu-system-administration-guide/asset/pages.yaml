    # Pushing data vs. pulling data


    When we have our series database (Prometheus) running, we need to add data to
    it. To add data, there are two different ways. One way is that the client pushes
    data into the database. This is an example of the default way when sending logs
    or metrics from one server to another. It is also easy if the client''s example
    is behind a gateway. Then, you only need to open traffic out, and the client can
    send data.


    The other way is that you have clients with an endpoint showing data. Your database
    goes to the clients, scrapes client data, and then adds them into it. This is
    how Prometheus works.


    You can setup Prometheus to collect and then send data also but that''s outside
    our setup.


