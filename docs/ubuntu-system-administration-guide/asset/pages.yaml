    # Ubuntu virtual NIC and VLAN


    In Ubuntu, if we only have one network card on our server, we can add virtual
    NICs on that network card and clone it to a new one.


    When we do an alias network card, it is a raw clone of the network card.


    # VLAN


    VLAN is a network protocol that many switches support. Here, we can create new
    layers inside the network. Only the network card in the same layer can talk. If
    you are using VLAN number 10, then only the network card connected to the same
    VLAN number 10 can communicate.


    # Setup network for routing


