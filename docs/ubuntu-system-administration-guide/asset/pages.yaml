  md: 'However, flatcar Linux is run in the Kubernetes cluster, which is good for
    running containers and Kubernetes.


    We may have some servers that run Red Red Hat, and the difference is, for example,
    the package manager. In Ubuntu, as you will learn in this book, the package tool
    is called apt.


    The command installs apache on a Ubuntu/Debian Linux:


    +   1. apt-get install apache


    However, on a Red Hat server, your package manager is named yum. So, to install
    the Apache web server, you would run.


    +   1. yum install httpd


    They both will install the Apache web server, but the way you type the command
    for installing Apache is different. The same command in Alpine Linux would be
    as follows:


    +   1. apk add apache


    There are some differences in this way, but as you will learn to use apt in this
    book, it is simple to move to a Red Hat-based Linux, and the base of how you install
    the package is the same. You only need to find the right command.


