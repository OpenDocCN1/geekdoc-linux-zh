    # Securing communications


    This section will examine how we can utilize security communications between two
    Ubuntu Linux systems. When we set up the VPN, we will have one server and one
    or more clients connecting to that server. The communications are secure between
    client and the server, and we can set up so that all the client traffic goes through
    the server. You can also use a VPN to connect to multiple locations over the public
    internet.'
