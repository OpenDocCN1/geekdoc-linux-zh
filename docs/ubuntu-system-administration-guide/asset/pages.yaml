  md: '# Network static


    In Ubuntu, setting your network to a static or manual IP address is easy. The
    mentioned steps can be followed to connect to a network using manual IP:


    +   1. Open the network settings in Ubuntu by searching for Advanced Network Settings.
    It will list all your network cards and bridges. It also lists all the WIFI access
    points.

    2. When setting a network device to static, you only need to set the address for
    the selected wireless settings. So, if you have two wireless networks, v2 and
    v2-dmz, you can set the v2 wireless as manual. It will not affect the v2-dmz Wi-Fi.

    3. If you select the network card and change the settings from DHCP to static
    (manual), it will affect every time you connect with it a cable.

    4. Before you can set your network card to static (manual), there are some settings
    you need.

    5. The address to use is usually in the range of 192.168.0-255.1-255. It is important
    that you use an address that is not already in use. So, if you set up an IP camera
    and in IP camera manual, it is mentioned that the camera will default to the IP
    of 192.168.1.50, then you need to set your IP to 192.168.1.49.

    6. The next setting is the netmask and tells the network card the number of IPs
    that can be used. The default for home is 255.255.255.0 or 24.

    7. The last setting is the router. The router will send all traffic to our computer
    that we cannot find in the local range. This will be the IP of your router or
    network device connected to the internet.

    8. If you are only setting up two devices, like an IP camera, you can skip adding
    a router.'
