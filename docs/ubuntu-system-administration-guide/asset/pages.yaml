    # Install WordPress in Kubernetes


    Now, we have added our core service, and we can start adding our service.


    We will start by adding a WordPress installation. It will be a MySQL server and
    a WordPress Pod. We will then set up and use the core service we install to view
    and monitor our service.


    When we deploy WordPress, we will be making manifest files. These files are the
    config that we send to our Kubernetes cluster to make start running our service.


    There are many values we are not covering here, and if you are to build a deployment
    for a production server, you need to add more value to the deployment.


    # MySQL


