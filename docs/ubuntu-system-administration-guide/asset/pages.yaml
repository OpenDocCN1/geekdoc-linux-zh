    # Objectives


    By the end of this chapter, we will start with installing a clean Ubuntu Server.
    We will then learn to set up a Kubernetes master. When the Kubernetes master is
    running, we will add a new Ubuntu Server as a Kubernetes worker node. And start
    adding workload to our Kubernetes cluster.


    By the end of this chapter, you will be able to set up your Kubernetes cluster
