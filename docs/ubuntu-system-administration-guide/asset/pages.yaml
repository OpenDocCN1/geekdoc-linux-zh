  md: '# # CHAPTER 10

    # Running Virtualization Server Environment


    # # Introduction


    The ability to run multiple services, such as different web servers or databases,
    or, for example, multiple databases for various purposes, is a common use case
    when using Ubuntu Servers. To be able to do that and to isolate every server,
    we come to Virtualization for help. With Virtualization, we can take one Ubuntu
    metal server and turn it into several virtual servers. Then, install them separately
    to support our use case.


    In this chapter, we will look at how you can install **virtual machines (VMs)**
    into your Ubuntu Server. Moreover, we will discuss how you can manage them from
    your desktop or over a regular webpage.


    We will then look at how you can use containers and how you can achieve the same
    approach with containers on your Ubuntu Server.


    # # Structure


    In this chapter, we will cover the following topics:


    +   - Installing KVM on your Ubuntu Server'
