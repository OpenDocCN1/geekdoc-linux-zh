    # # PGP encryption


    PGP is a tool that encrypts and decrypts files. Using a public and private essential
    structure, you can encrypt using the public key and decrypt using the private
    key. When you are to receive an encrypted file, you send your public key to the
    sender. The sender encrypts the files with your public key. Only you can decrypt
    and read the file with your private key. This is the best practice when sending
    information over the Internet in email or sensitive chat messages. You can also
    easily integrate PGP into Thunderbird and encrypt emails. Start the tool called
    Seahorse to be installed by default by Ubuntu. Create a new GnuPG key and type
    in your email and password.


