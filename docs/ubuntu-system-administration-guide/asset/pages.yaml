    # # Protect your traffic by using DNSS


    When you are connected to the internet and visit a page like google.com, your
    computer needs to find the IP address of the domain google.com. This is done using
    a Domain Name System (DNS) request.


    The problem that arises is that DNS requests are done in clear text traffic. The
    internet provider or other network devices that are between you and the DNS will
    be able to see the traffic.


    You can set up your Ubuntu computer to start your DNS request to a DNS server
    over an encrypted channel.


    There are different ways to set up DNS over HTTPPS. The first and maybe the best
    way is setting up a DNS server in your network. The DNS server then receives request
    from the client in the network, then forwards the request to the public DNS server
    over HTTPPS.


    This will protect all the devices in your network.


    The other way is to set up your Ubuntu to go directly to the public DNS server
    over HTTPPS.


    This is done by setting up a DNS daemon on your Ubuntu computer. Then your local
    DNS request will be sent to the local DNS daemon on your computer, which will
    send the request. This will protect all DNS requests from your computer and going
    out as well. Still, access to the external DNS providers needs to be open. So,
    if you are at a public Wi-Fi point, this could stop working.


    To install DNSS, run the following command:


    +   1. sudo apt-get install dnss'
