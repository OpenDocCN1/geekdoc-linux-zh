    # Dedicated VM Linux version


    Suppose you plan to run several Ubuntu Servers and have a VM running on them to
    create a large pool of servers. There are better tools than setting up Ubuntu
    Servers. Proxmox is one of those that is a Linux version built for running VMs.
    It supports multiple servers and shared storage.


    With Proxmox, you can also run a pool of servers all together.


    If you have even looked for a larger deployment of VMs, then OpenStack is the
    largest open-source tool for running large VM deployments.


    # Containers


    In this chapter, we utilized Docker as a containerization tool. However, Docker
    is not the only one. Podman is already in the Ubuntu repo. It is a drop-in replacement
    for Docker, so you can replace the docker with Podman, and your commands will
    still work. One example, you can install Podman on a server but still run Docker
    on the local Ubuntu Desktop.


    You can choose to skip the installation part of Podman in this chapter and replace
    the Docker command; the output will be the same.


    # Podman’s features


    Podman has a long list of features, and the following are some of the top ones:


    +   - Podman supports both OCI and Docker images.


    +   - Podman has full network integration with CNI network plugins.


    +   - With Podman, you can combine several containers into pods, as in Kubernetes.'
  merge: -1
