  md: '# CHAPTER 8

    Keeping Check on Your Ubuntu Server


    # Introduction


    When running your Ubuntu Server, it is essential to keep an eye on what is going
    on inside the server. We want to know if we have some issues with performance,
    so our memory or CPU goes way high, monitor network performance to understand
    how much traffic our Ubuntu Server uses.


    We also want to monitor our logs from our server to know everything is working
    as it should. Lastly, we want to look for any security issues. Any bad logins
    or processes that run on our server?


    In this chapter, we will install different monitoring tools so that you can take
    control over a single Ubuntu Server or a farm of Ubuntu Servers. Monitor them
    to verify they all work as they should.


    # Structure


    In the following chapter, we will cover the following topics:


    +   - Commands for monitoring a Linux server

    - Monitoring Ubuntu Server using Cockpit'
