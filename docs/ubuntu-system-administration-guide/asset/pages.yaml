  md: 'We also need to have some content to run. Apache has a folder where all the
    files that make up $ webpage are saved. The content is served from that folder.
    Here is why you will add your own code if you build your own app or download and
    copy a project.


    /var/www/html is the default folder where we have our content.


    # # First config


    Let us create a folder in /var/www/html/myapp, and then we will create a config
    to display the content from that folder.


    Make the folder and create a file called index.html in that folder. The name index.html
    is the name of the default webpage. If a web server goes to a folder and does
    not have a file name, it will look and load the index.html file.


    +   1. root@g1:/var/www/html/myapp# cat index.html

    2. <html>

    3. <title>test</title>

    4. <h2>Hello</h2>

    5. </html>

    6. root@g1:/var/www/html/myapp#


    Now we have the content, and we need to tell our Apache server to get the files
    from that folder.


    Here, we are updating the default file called 000-default to add our folder:


    +   1. root@g1:/etc/apache2/sites-enabled# cat 000-default.conf

    2. <VirtualHost *:80>

    3. #ServerAdmin name.example.com

    4. ServerAdmin webmaster@localhost

    5. DocumentRoot /var/www/html/myapp

    6. ErrorLog ${APACHE_LOG_DIR}/error.log

    7. CustomLog ${APACHE_LOG_DIR}/access.log combined

    8. </VirtualHost>'
