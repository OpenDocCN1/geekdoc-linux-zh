    # VPN troubleshooting


    When we set up a VPN, we connect the computer. To do that, we need to be able
    to send packages between them. Many things on the internet and on the local network
    can block our VPN. For example, the VPN can be blocked in some parts of the world.


    The following are some common things to try if your VPN cannot connect:


    +   - **Local firewall**: Verify that you do not have any firewall blocking the
    connections between your servers. Use tools like Telnet to verify that you can
    establish a connection between your server and client.

    - **Package forward**: To use your VPN server and access other servers from it.
    You need to enable package forwarding. We did'
  merge: -1
  pgno: 244
- img_proc: true
  md: 'this when we used Ubuntu as a firewall.


    +   - **Tricks:** Sometimes, your locations have blocked the ports that our VPN
    is using. Now, you can change the VPN port to standard ports like 80, 443, or
    53 and see if that works.


    # # Conclusion


    In this chapter, we understood how we set up a simple router to route traffic
    from our local network out to a public network with an Ubuntu Server. We used
    Iptables to set up and control what traffic can go in and out of our network.


    To set up a basic IP network for desktop and server, we installed a DHCP server
    that will send out IP addresses to our clients in the network. We have also set
    our own DNS server, allowing us to add and control DNS names within our network.


    Connect two locations or connect from a client back to a server. We have looked
    at two different VPN solutions and how they can connect a server and a client
    together.


    With the knowledge from this chapter, we can set up an Ubuntu Server as our primary
    network router and use it to control router traffic both in a workplace and in
    a hosting setup.


    In the next chapter, we will start using virtualization and run multiple instances
    of Ubuntu on a single Ubuntu system.


