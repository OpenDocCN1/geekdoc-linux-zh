  md: 'When it comes to web performance, there are many different settings you can
    add to make your web server perform faster. Some are added by default, and some
    we need to add as well. Note that you need to test your page and settings to optimize
    your web server.


    Some of the settings we add to our Apache server are keepalive and compress. They
    will keep connections open longer when you have many clients and reusing the connections
    and not making new ones saves time. Also, the compressed setting will compress
    the data when sent to the client, making it smaller and arriving faster.


    The following is our Apache virtual host with **keepalive** and compress turned
    on:


    +   1. LoadModule deflate_module modules/mod_deflate.so

    2. KeepAlive On

    3. # MaxKeepAliveRequests: How many requests to allow during a persistent connection.

    4. # You can set it 0 for unlimited requests, but it is not recommended.

    5. MaxKeepAliveRequests 100

    6. # KeepAliveTimeout: Number of seconds to wait for the next request from the

    7. # same client on the same connection. Default is 5 seconds

    8. KeepAliveTimeout 15

    9. <VirtualHost *:80>

    10. ServerAdmin webmaster@localhost

    11. ErrorLog ${APACHE_LOG_DIR}/error.log

