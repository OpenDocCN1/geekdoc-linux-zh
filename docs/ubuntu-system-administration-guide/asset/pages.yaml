  md: '# Detecting hacking on your server


    Securing your Ubuntu Server is important. We want to detect if someone is trying
    to ssh into our server or if unexpected programs start to run. To do this, we
    will use different tools. The first is the ssh brute tool (fail2ban). It will
    detect if there are many fault logins on ssh and then take actions like blocking
    the source IP of the attacker.


    We then move on to a more advanced tool called Host Intrusion Detecting System
    (HIDS) called OSSEC. OSSEC is both a server and a client. The clients report to
    the server, which can then take actions. You can also pass the logs from our OSSEC
    server to our Elasticsearch.


    # Fail2Ban


    We can install fail2ban using our package manager, as shown in the following command:


    ![](img/729ff652633ff312828be609e679849e_204_0.png)'
  merge: -1
  pgno: 204
- img_proc: true
