    In this chapter, we will look at setting up a Kubernetes cluster on an-prem cluster
    of Ubuntu Servers. We will then set up some default services to ensure your cluster
    is operational and ready for the workload.


    During the setup of the cluster, we will install services to monitor metrics and
    logs. Using disk and balancing traffic using ingress and load balancers.


    By the end, we will deploy our WordPress deployment as a workload in the cluster.


    Kubernetes clusters are available on all cloud providers today, and the content
    in the chapter will not just help you with Ubuntu but also help in setting up
    Kubernetes clusters anywhere.


    # Structure


    In this chapter, we will cover the following topics:


    +   * Installing Kubernetes on Ubuntu

    * Installing Kubernetes

    * Setting up our Kubernetes'
