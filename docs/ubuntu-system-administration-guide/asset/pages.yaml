  md: 'Let us create a simple Bash script to install Docker. Copy the following code
    into a file and name the file install_docker.sh, as follows:


    ```

    1. root@server:~# cat install_docker.sh

    2. #!/bin/bash

    3.

    4.

    5. echo "Lets get docker"

    6. apt-get update

    7.

    8. echo "Installing req packages"

    9. apt-get install \\\n10. apt-transport-https \\\n11. ca-certificates \\\n12.
    curl \\\n13. gnupg \\\n14. lsb-release -y

    15.

    16. echo "Getting repo pos"

    17. curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo g --dearmor
    -o /usr/share/keyrings/docker-archive-keyring.gpg

    18.

    19. echo "Settings up repo"

    20. echo \\\n21. "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.pgpg]
    https://download.docker.com/linux/ubuntu \

    22. $ $(ls_release -cs) stable | sudo tee /etc/apt/sources.list.d/docker.list
    > /dev/null

    23.

    24. echo "Install Docker"

    25. apt-get update

    26. apt-get install docker-ce docker-ce-cli containerd.io -y

    27.

    ```'
