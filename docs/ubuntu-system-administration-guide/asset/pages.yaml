    # # Protect your computer by applying a firewall


    A firewall on a computer is like a door on a house. It allows traffic to be accepted
    only on the ports we configure. This will protect our computer, if we like, before
    installing a DNS server. We only want our computer to use the DNS server, not
    everyone on the network.


    To protect ourselves, we can think of ports as doors. We want to keep the ports(doors)
    open for our friends and closed for everybody else.


    A good setup could be having two different firewall settings:


    +   - One default is when you lock everything out.

    - And one for when you are more active on the network.


    When you connect to a new network, your laptop''s default profile should lock
    everything so nobody on the network can connect to your computer. The other profiles
    are more open and allow outgoing traffic so that your computer can connect to
    network services like file shares and printers.


