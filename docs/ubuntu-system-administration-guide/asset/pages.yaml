    # # Objectives


    In this chapter, we will begin by setting up a simple Bash script that will serve
    as our document when installing a service and run some basic commands for us.


    From the basic script that we can run simply, we will move over to the tool called
    Ansible. Ansible will help us run our commands in a more controlled way and verify
    the output. We can now also run our commands on multiple computers simultaneously.


    From Ansible, we will use a docker to run tasks inside the Docker. This will help
    verify that we always have the same set of tools. We will start by running Ansible
    inside Docker and then transition to using Ansible to execute Docker commands
    on the host.


    # # Basic Bash


    Bash scripts are commands that you can run in order. You can do a lot more in
    Bash, but for this section, we will use Bash to set up scripts and run them in
    order. We have done some Bash scripting before, for example, when installing docker.


    We will now create a script to run for Docker installation. We can then save this
    script in a folder. When we have a new server, we can copy over the script and
    execute it to install Docker. Now, we can easily restore a server to a point and
    have the Bash scripts as a document for us later.'
