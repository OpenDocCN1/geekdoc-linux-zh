    # Network DHCP or static


    When connecting to a network, your computer needs an address. A router is where
    it can find other addresses and connect to the Internet. There are two ways to
    get an address. Your computer can ask the network for an address. This is called
    Dynamic Host Configuration Protocol (DHCP), and all routers and Wi-Fi access points
    have a DHCP server that provides addresses to the computers in the network.


    This is also the default setting for network and Wi-Fi network cards in Ubuntu.
    However, you can also manually set your address to a network address. To do that,
    you need to have the range and router that are needed.


    If you are connecting your computer to a new Internet Protocol (IP) camera and
    do not have a router or Wi-Fi point that hands out the address, you can set the
    network address on your network card to match the network on the camera.'
