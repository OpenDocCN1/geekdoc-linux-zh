    ```


    The aforementioned command will install VLC media player.


    # Snap Store


    The Snap Store is now built into Ubuntu software, and you can find all the apps
    from one interface: https://snapcraft.io/store.


    Let us start by installing the Brave browser from the Snap Store, https://snapcraft.io/brave


    You can also install Snap software from the Ubuntu Software Center ore running
    Snap install commands in the terminal.


    The following will install brave using the Snap Store in the terminal:


    ```

    sudo snap install brave

    ```


    # Updating Ubuntu


    It is recommended that you install most of your apps from the Ubuntu software
    store. This will install the correct packages, and all the surrounding packages
    needed for the app to run. Most importantly, it will keep track of and update
    your app for you.'
