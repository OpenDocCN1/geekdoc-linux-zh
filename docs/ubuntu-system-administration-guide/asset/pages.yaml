    # Introduction


    In this chapter, we will look at the automation of tasks we do by moving the the
    script and commands into code. Instead of running the commands one by one, we
    execute the commands with a script or a tool like Terraform or Ansible. We can
    see the state of the script. We will permanently control and verify that we run
    the script the same way every time.


    This way, we can move away from mistakes and misses in the process of installing
    or setting up a server and service. It is the same approach we used when we installed
    the server using MAAS. We know the outcome will always be the same.


    Moreover, we will examine some tools and scripts that can help automate certain
    tasks covered in this book.


