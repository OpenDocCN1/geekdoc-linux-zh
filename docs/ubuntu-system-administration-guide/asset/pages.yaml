    # Network clients with DHCP and DNS


    Now, when we have our router set up, it can transfer traffic from our private
    network out to our public network and can set up clients that can use the network.
    To set up the private network, we require two services. One is our HCPD server,
    which will hand out DHCP (IP address) to clients and connect them. The other service
    is a DNS server, allowing our clients in the network to resolve DNS names (such
    as ubuntu.com) and access the internet.


    Many different tools perform this, however, here we use the tool dnsmasq. It can
    work both as a DHCPD server and a DNS server. This is why it is easy to use.


    Let us start with installing dnsmasq on our Ubuntu Server by running the following
    code:


    +   1. apt install dnsmasq


    To set up our DNS server, we need some data to use. First, we need to have a network
    to which we will give our IP address. It needs to be a network we have set up
    a network card for.


    You cannot send out IP on a range that you have no network card connected to.


    When we configure our network card, we are using the range 10.33.33.0/24 and we
    set our server that we will use as a router on the IP 10.33.33.2. We also plan
    to run our DNS server on the same host, so the DNS server for the network client
    will also be the same IP as the router 10.33.33.2.


    When you set up your own network, you will need to update the address to match
    your setup.'
