  md: '# # About the Author


    Mattias Hemmingsson is a seasoned IT professional with over two decades of experience
    in designing, building, and securing modern IT infrastructure. With deep roots
    in cloud computing, DevOps, and system architecture, he has successfully led the
    development and operations of high-availability systems for mission-critical environments,
    especially within the financial sector, where stability and performance are non-negotiable.


    Mattias specializes in a wide range of technologies, including Kubernetes, Docker,
    Jenkins, GitLab CI, and cloud platforms such as AWS and Google Cloud. His skill
    set spans server orchestration, infrastructure as code, and containerized application
    delivery. A true advocate for developer productivity, he has implemented CI/CD
    pipelines, automated monitoring systems, and scalable platform services that have
    helped teams deploy faster with greater reliability.


    Security is a cornerstone of Mattias’ expertise. He has worked extensively in
    IT security and compliance, securing high-performance payment gateways and writing
    security policies to meet industry and regulatory standards. He actively manages
    vulnerability assessments, runs enterprise-grade scanners, and participates in
    incident response operations. His security knowledge bridges the technical and
    procedural, ranging from configuring firewall rules to training development teams
    in secure coding practices.


    As a full-stack developer, Mattias works with both Python and JavaScript, building
    frontend and backend systems using popular frameworks like Next.js and Vue. He
    brings a unique blend of hands-on coding ability and'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'infrastructure mastery, making him equally at home writing applications or
    deploying them in scalable, production-ready environments.


    Mattias also plays an active role in the tech community. He co-hosts the DevSecOps
    Talks podcast and YouTube channel, where he shares insights on the intersection
    of development, operations, and security. He teaches classes on DevSecOps practices
    and serves as the local organizer for one of Stockholm’s tech meetups, helping
    others stay informed and connected in the ever-evolving world of IT.


    Through his blog, Life and Shell, Mattias documents his professional journey,
    sharing practical tips and deep dives into real-world solutions for fellow developers,
    sysadmins, and security professionals. His work reflects a passion not just for
    running services, but for securing them, ensuring they are both compliant and
    resilient.


    Whether building infrastructure, writing code, or leading training sessions, Mattias
    brings a comprehensive understanding of modern systems from their initial setup
    to their long-term security and scalability.'
  merge: -1
