    by making it possible to run many OS on the same host. This helps in better using
    the resources on the host computer and distinguishing between the different OSs
    that are running. Virtualization is how cloud providers can use one physical server,
    and then you can add any virtual machines on top of that. There are also special
    OSs only built for virtualization that are used widely.


    In this chapter, we will install KVM and set up and run virtual machines in KVM.
    We will then look at connecting our VM to the network and running common tasks.
    There are also other virtualization engines, and we will look at Vagrant, a virtual
