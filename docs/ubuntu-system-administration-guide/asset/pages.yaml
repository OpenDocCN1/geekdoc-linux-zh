  md: '# CHAPTER 6

    Up and Running with Kubernetes and Docker


    # Introduction


    When you are a developer or work with IT-related tools, you want to have the tools
    to help you run your product or other products locally so you can test them. You
    may not want to have to install extensive databases or BI tools locally to use
    them. This is where containers come in. It is based on idea of shipping containers
    with many small similar containers on a ship. But the content inside the container
    can be anything.


    This is the same when we talk about containers for computers. Your computer is
    the ship, and you can run many containers on it. So, the big difference between
    VMs and containers is size and speed. In the VM, we install the whole OS, and
    you virtualize the whole computer. So, the VM shares the CPU and beside your computer.
    Instead, the container shares some of your computer resources and inside your
    OS; this makes it smaller.


    Although the concept of containers, or lightweight virtualization, has been around
    for a long time, it did not start to gain traction in the Linux world until the
    early 2000s.'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'Around the same time, a new container technology called Docker was being developed
    by Solomon Hykes and his team at dotCloud (now known as Docker Inc.). Docker was
    based on Linux container (LXC), but it introduced a new way of packaging and distributing
    container images, as well as a new set of tools and APIs for managing containers.
    Docker quickly gained popularity among developers and became the de facto standard
    for containerization in the Linux world.


    # # Structure


    In this chapter, we will cover the following topics:


    +   * Docker and container

    * Installing Docker

    * Docker Hub

    * Start your first Docker

    * Adding Docker Compose

    * Connecting service with Docker Compose

    * Expanding Docker Compose

    * Connecting two stacks

    * Local development with Docker

    * About Kubernetes


    # # Objectives


    In this chapter, we will understand how to install Docker on our Ubuntu Desktop.
    Start your first Docker image and run a Minecraft server.


    We will then put more containers together and set up a WordPress blog and Metabase
    BI tool. When we have a working WordPress running, it is time to move over to
    Kubernetes. You will learn how to install Kubernetes on your'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'Ubuntu. Deploy a MySQL server and a WordPress blog and do some basic commands
    using kubectl to communicate with your cluster.


    We will also understand how to run containers as Docker images and in a Kubernetes
    cluster.


    # Docker and container


    Docker is a software platform that allows developers to create, deploy, and run
    applications in containers. Container is a reference to container ships, where
    you pack your items in a standard format, and that format is supported by trucks,
    ships, and planes. The same idea is for software. You build your software and
    pack it into containers. Now your software can run on any platform that supports
    docker. So, if a Docker runs and works on one laptop, it should run on Google
    Cloud or on a regular server if it supports the Docker format.


    Docker and containers consist of several components today, including:


    +   - The engine are tools like CRI-O or Docker and the engine will take the container
    image and make it to a container running process.

    - The image from the container start was was only called Docker Image, but now
    we use Open Container Image (OCI), which aims to make all the images in a standard
    way.

    - Kubernetes uses CRI-O as the default way of running containers.


