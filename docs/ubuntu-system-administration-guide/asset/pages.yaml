    # Conclusion


    In this chapter, we understood how to monitor and secure one or many Ubuntu Servers.


    We have set up tools to set metrics from our server to a central place where we
    have also set up to collect logs from our server and store them in a time-series
    database so that we can see logs from all our servers in a timely order.


    When we monitor, we want to have all the data in one place to track and monitor
    movements between servers or services. Monitoring for security is also important,
    and we have, during this chapter, set up tools that not only will alert us when
    it detects bad behavior but also fight back the attacker.'
