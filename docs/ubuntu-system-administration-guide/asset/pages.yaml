    # Database user


    When we run our test, we used the root user, and it was not recommended at all.
    For every service you create, we want to create one user in a database to keep
    them separated.


    We have already created a user for MongoDB. For MariaDB, you can create a user
    with the following command:


    +   1. CREATE USER ''dbuser''@&'' IDENTIFIED BY ''password'';


    +   2. GRANT PRIVILEGE ON database.* TO ''dbuser''@&'';


    +   3. FLUSH PRIVILEGES;


    Notice that you will update the name of the database to the database name you
    want to give the user access to.


