- img_proc: true
  md: '+   * It has docker support and can run both local and remote environments.


    +   * Podman does not use a daemon. For that, it has enhanced security and will
    not use any resources when not running.


    +   * Podman has a REST API that works well and can be extended like the Kubernetes
    API.


    +   * Podman can also run a Pod without having full access to the host system


    This also makes Podman a bit harder to run than Docker. If you plan to use containers
    for local dev, stick to docker over Podman. However, if you are building apps
    that run in a Kubernetes cluster, it can be good to work with Podman to test if
    your apps are working and generate a Kubernetes manifest from your Podman setup.


