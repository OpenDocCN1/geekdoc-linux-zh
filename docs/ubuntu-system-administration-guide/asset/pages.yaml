    # Connect to segment VLAN networks


    Virtual Local Area Network (VLAN) is a way in the network cable to divide it into
    several layers. So, when you connect your computer with a network cable, you will
    get a default network.


    However, if your switch has VLAN support, you can add multiple layers of network
    inside. VLAN is only supported by some switchers, and you need to have a management
    interface to configure the switch to set up a VLAN. You can look in your switch/router
    manual to learn if you device can handle VLANs.


    This is handy if you have a server which you want one other computer to access.
    Then, you can segment it into its own network segment and only add that segment
    to your computer.


    In Ubuntu, we can create a new virtual network card connected to that segment.


    Every VLAN has a number, which is the segment. So, before you connect your Ubuntu
    to a VLAN, you first need to know the Local Area Network (LAN) ID. This is set
    up in the switch you are connecting to. Here, we are creating a new virtual interface
    for interface enp1s0. We give it the name enp1s0.10 and set it to use VLAN 10.


    We set the base network card that it will be connected to. When the virtual device
    is added, you can configure it using DHCP or a static IP as a regular network
    card. As shown in the following command:


    ```

    ip link add link enp1s0 name enp1s0.10 type vlan id 10

    ```


