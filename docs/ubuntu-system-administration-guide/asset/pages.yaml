    # Software store


    The first store is the default Ubuntu Software Center, which is similar to an
    app store on a smartphone. It gives you access to all the standard tools and apps
    in Ubuntu and will also update apps for you.


    You can access the store by starting the Ubuntu Software program. Search for the
    video player VLC and install it. You can also install software using the terminal.


    ```

