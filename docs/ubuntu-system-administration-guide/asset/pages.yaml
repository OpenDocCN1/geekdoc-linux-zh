- img_proc: true
  md: 'First, set the INPUT chain to block any traffic by default. Then, we can add
    the rules to allow incoming. (If you plan to ssh into your server, add the rules
    to allow ssh as the first row and then the following default block command)


    The following code shows the rules that will allow traffic to some example ports:


    +   1. #lo

    2. iptables -A INPUT -i lo -j ACCEPT

    3. #ssh

    4. iptables -A INPUT -p tcp -m tcp --dport 22 -j ACCEPT

    5. #http

    6. iptables -A INPUT -p tcp -m tcp --dport 80 -j ACCEPT

    7. #https

    8. iptables -A INPUT -p tcp -m tcp --dport 443 -j ACCEPT

    9. #SSH from subnet

    10. iptables -A INPUT -p tcp --dport 22 -s 192.168.0.0/16 -j ACCEPT


    As you can see, you need to add the ports to be open. If you have any tools running
    on a different port, you can update the command with the port you need.


    In the last line, you can also see a rule where we have added a subnet, only clients
    from that subnet can access the port.


    To use ssh inside your server, you also need to add some ports for traffic going
    out, as shown in the following code:


    +   1. iptables -A OUTPUT -o lo -j ACCEPT

    2. iptables -A OUTPUT -p tcp --sport 22 -m state --state ESTABLISH -j ACCEPT


    Some like to keep all output traffic open, and you can choose however you would
    like to move forward.


    Now that we have our rules, we can set the default rule for the chains, as shown
    in the following code:'
