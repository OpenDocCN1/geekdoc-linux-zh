    # # Objectives


    By the end of this chapter, we will understand how to set up tools to monitor
    our server both as a single server and as a cluster. When we monitor our server,
    we will learn how to deploy tools that will read and send server metrics that
    we can analyze and look at to verify our server status.


    We will start by monitoring a single server then move to a larger scale of deployments
    to understand how you can monitor many servers. Additionally, we will also look
    at collecting the logs from our server and storing them in a better way to be
    able to read logs from multiple servers at one location.


    We will also understand how to deploy security tools and monitor server behavior
    so that we can detect and act on different security concerns that will happen.


    Lastly, when our tools collect data, we will set up alarms and notify us if our
    tools find any problems in our system.


