    # # Overview of virtualization in Ubuntu


    When running a server or desktop, sometimes you want to run multiple versions
    of the same OS. If you work with many clients, you can have one Ubuntu desktop
    for every client or many servers, you can reinstall one server many times. However,
    one is more stable. You can also share computer resources more effectively.


