  md: 'You can find more info on LXLE and download links at https://lxle.net/.


    # Other Linux distributions


    Ubuntu is based on the Linux distributions called Debian, but there are more Linux
    OSs than Ubuntu. Raspberry Pi OS is another famous OS based on Debian. However,
    there are many more. Kali Linux is a Linux OS specially built for hackers. It
    includes all the tools you would need as a hacker and runs easily from a USB stick.


    But our Linux distributions does not stop with the Debian family. There are more
    families of Linux.


    Red Hat has Red Hat Enterprise distributionsro that many companies use. It includes
    open-source software and Red Hat''s own software. Fedora Linux will be the next
    Red Hat Linux. In Fedora, we see the latest software and kernel versions. If you
    start using Docker, you will get to know Alpine Linux. Alpine is a minimal Linux
    perfect for building Small Docker images, https://www.alpinelinux.org.


    Regarding Kubernetes, new Linux distributionsributions release unique builds for
    running containers. The most famous are Flatcar and CoreOS, where Flatcar is a
    fork of CoreOS. AWS has also released its own Linux build for containers called
    Bottlerocket.


    One new project is Talos Linux, a special Linux distributionsro only made to run
    Kubernetes. One special part of Talos Linux is that it does not have any external
    access, and all configs are used using API calls.


    To read more and get installation instructions on the special Linux distributionsro,
    visit the following links in the chapter''s reference section.


    Let us know at the difference between Linux versions:


    It is all about how you use your computer and server. On your laptop, run Ubuntu
    LTS, and run Ubuntu LTS on my home server. Then, you can reuse the tools and script,
    for example, to set up backup and access.'
