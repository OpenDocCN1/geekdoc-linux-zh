- img_proc: true
  md: 'We will explore two solutions. First, OpenVPN, and then WireGuard VPN. They
    are both good VPNs. However, WireGuard is comparatively newer. We will connect
    a server with one or many clients. Depending on what you will use, pick the VPN
    that best suits your needs and has support for the devices you use.


    # # OpenVPN


    OpenVPN is the oldest of the two and can be found as a standard tool in many applications,
    both on servers and desktops. In Chapter 4, Setting Up Firewall, VPN, and Wi-Fi
    Networks, we understood how to set up an OpenVPN client to connect to a server.


    Now, we will set up our OpenVPN server and then connect the client to that server.
    The server needs to be accessed over the internet, but for testing, you can run
    this in a local network as well.


    OpenVPN is found in the standard Ubuntu repo and can be installed by running the
    following command:


    +   1. apt install openvpn easy-rsa


    When we set up the OpenVPN server and client, we use TLS certs to verify the client
    and the user. For that, we need to create links that we can use. To make it easier,
    we will use the tool easy-rsa to generate the certs.


    Let us create a folder in /etc/pki for easy-rsa and link the files we need to
    it by running the following code:


    +   1. root@hrb-1 /etc/pki # mkdir easy-rsa

    2. root@hrb-1 /etc/pki # cd easy-rsa/\n3. root@hrb-1 /etc/pki/easy-rsa # ln -s
    /usr/share/easy-rsa/*

    4. root@hrb-1 /etc/pki/easy-rsa # ls

    5. easyrsa openssl-easyrsa.cnf vars.example x509-types

    6. root@hrb-1 /etc/pki/easy-rsa #


    Now, we have a folder where we can host our certs. Let us set up our first cert
    for the server.'
  merge: -1
  pgno: 227
- img_proc: true
  md: 'Create a file called vars /etc/pki/easy-rsa and add the following to that file:


    +   1. root@hrb-1 /etc/pki/easy-rsa # vi vars

    2. root@hrb-1 /etc/pki/easy-rsa # cat vars

    3. set_var EASYRSA_ALGO "ec"

    4. set_var EASYRSA_DIGEST "sha512"

    5. root@hrb-1 /etc/pki/easy-rsa #


    Now, we set up our PKI server. We will use this base of certs to generate server
    and client certs. Set up the pki with the command /easyrsa init-pki and build
    the CA, as shown in the following code:


    +   1. root@hrb-1 /etc/pki/easy-rsa # /easyrsa init-pki

