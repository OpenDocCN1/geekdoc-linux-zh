  md: '# CHAPTER 11

    Setup Webserver, Deploy and Run Webapps


    # Introduction


    Running web applications is the standard way of running most online services today.
    Online applications can be from, for example, your own blog that you host, online
    shops, or social media platforms. Being able to host and run web applications
    is an important part when running and using Ubuntu Servers. Most applications
    on the web today have a web server that services the pages you see when you visit
    the page.


    The database will store the data for the applications so that we can have data
    for the visitors of the web applications. Here, several different types of web
    servers display the web page to the user, and you can also use many more databases.
    This chapter will give a basic level of minimal knowledge of how to set up and
    run a simple web app using a web browser and a database.


    # Structure


    In this chapter, we will cover the following topics:'
  merge: -1
  pgno: 274
- img_proc: true
  md: '+   * Web servers

    * Databases

    * Deploying web apps

    * WebbPerformance


    # # Objectives


    We will start by installing two types of web servers that are the most used today:
    Apache and NGINX. With our web server, we will create two domains and host simple
    web pages that do not require any database. We will also look into setting up
    basic performance values for our web server. There are several databases for storing
    data for a web application, and here, we will install and set up two different
    types of databases. One is a document database called MongoDB, and the other is
    an SQL database called MariaDB. When setting up the database, we will also learn
    to log into our database and set some basic commands like looking at stats and
    taking and restoring backups.


    # # Web servers


    We will understand how to install and set up two different web servers. They both
    serve web pages to visitors, but they are different in some ways. For the app
    we will be testing, it does not really matter which one you like. But are you
    working with a high-performance service? Then you want to add some more time to
    what webserver to choose.


