  md: '# 10.3.5 Java VNC Viewer


    You don''t even need a VNC viewer if you have a Java-capable browser. Netscape,
    Explorer, and many other browsers support Java. All VNC servers incorporate a
    Web server that allows a Java applet to be served to the browser on the client.
    The Web server runs on Port 58xx, where xx is the display number. For example,
    to connect to display 2 on server mmcune, connect to this web page:


