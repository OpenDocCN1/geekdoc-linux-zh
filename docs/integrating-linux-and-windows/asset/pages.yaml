  md: '# 318


    # Appendix C: Samba Man Pages


    +   - **lmhosts**: Lookup an IP address in the Samba lmhosts file. The lmhosts
    file is stored in the same directory as the **smb.conf** file.

    - **host**: Do a standard host name to IP address resolution, using the system
    /etc/hosts, NIS, or DNS lookups. This method of name resolution is operating depended
    for instance on IRIX or Solaris that may be controlled by the /etc/nwitch.conf
    file.

    - **wins**: Query a name with the IP address listed in the **wins server** in
    the smb.conf file. If no WINS server has been specified this method will be ignored.

    - **bcast**: Do a broadcast on each of the local interfaces in the **interfaces**
    parameter in the smb.conf file. This is the least reliable of the name resolution
    method as it depends on the target host being on a locally connected subnet. To
    specify a particular broadcast address the **-B** option may be used.


    If this parameter is not set then the name resolve defined in the **smb.conf**
    file parameter (**name resolve order**) will be used.


    The default order is lmhosts, host, wins and bcast without this parameter or any
    entry in the “**name resolve order**” parameter of the **smb.conf** file name
    methods will be implemented in this order.


    +   - **M NetBIOS name** This option allows you to send messages, using the “Win-Popup”
    protocol, to another computer. Once a connection is established then you type
    your message, pressing ^D (control-D) to end.


    If the receiving computer is running WinPopup the user will receive the message
    and probably a beep. If they are not running WinPopup the message will be lost,
    and no error message will occur.


    cat mymessage.txt | smbclient -M FRED


    You may also use the -U and -I options, as they allow you to control the FROM
    and TO parts of the message.


    See the **message command** parameter in the **smb.conf (5)** for a description
    of how to handle incoming WinPopup messages in Samba.


    Note: Copy WinPopup into the startup group on your WfWg PCs if you want them to
    always be able to receive messages.


    +   - i specifies a NetBIOS scope that smbclient will use to communicate with
    generating NetBIOS names. For details on the use of NetBIOS scopes, rfc1001.txt
    and rfc1002.txt scopes are very rarely used, only set this parameter if you are
    the system administrator in charge of all the NetBIOS systems you communicate
    with.'
