    | udp | 0 | 0 * :xdmcp | * | |

    | raw | 0 | 0 * :icmp | * | 7 |


    The most important field is the last one. If LISTEN, the port is ready to accept
    connections. The local address is the host name and process, or port. For example,
    the line tcp 0 0 *:printer **: LISTEN means the printer service is listening with
    the TCP protocol.


    The port scanner can be downloaded from http://www.insecure.org/nmap/. This can
    be used to scan for open ports on local and network-connected machines. For example,
    to scan a local machine, type nmap localhost. This will give a list of open ports
    such as:


    | Port | State | Service |

    |---|---|---|

    | 515/tcp | open | printer |

    | 1024/tcp | open | unknown |

    | 1536/tcp | open | ampr-inter |

