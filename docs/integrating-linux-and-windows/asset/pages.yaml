  md: '# 162 Chapter 16 · Using NFS and NIS in Linux and Windows


    If you prefer the command line, you can use chkconfig to turn the portmap on:

    chkconfig --level 3 portmap on.


    Next, we need to define what directories to share. This is done by adding the
    directories to be shared to the /etc/exports file. For example, if we wanted to
    give read and write access to the directory /home/alisa to the computer alisa,
    we would add the following line to export:

    /home/alisa alisa (rw, root_squash)


    We also added the root_squash options. These prevent a user that is logged on
    as root on a client machine from gaining root access to the server. The root_squash
    options should be enabled by default, but it is still a good idea to add them.
    You can also allow-only access to the directory by changing rw to ro.


    Finally, mountd and nfsd. First, check to see if they are already running by the
    following:


    ```

    rpcinfo -p

    program vers proto port

    100000 2 tcp 111 portmapper

    100000 2 udp 111 portmapper

    100024 1 udp 671 status

    100024 1 tcp 673 status

    100011 1 udp 681 rquot

    100011 2 udp 681 rquota

    100005 1 udp 690 mountd

    100005 1 tcp 692 mountd

    100005 2 udp 695 mountd

    100005 2 tcp 697 mountd

    100003 2 udp 2049 nfs

    100021 1 udp 1024 nlockmgr

    100021 3 udp 1024 nlockmgr

    100021 1 tcp 1024 nlockmgr

    100021 1 tcp 1024 nlockmgr

    ```


    Notice that nfs and mountd are already loaded. We need to reload the export file
    by running exports -av. If you don''t have the exports file, simply restart nfs
    and mounted manually (you may have to modify this procedure slightly for your
    system):


    ```

    killall -HUP /usr/sbin/rpc.mountd

    killall -HUP /usr/sbin/rpc.nfsd

    ```


    If mount and nfs are not set to load automatically, set them up in the init file
    for portmap. For Red Hat, you can use the SysV Init Editor to add the nfs services
    to the Runlevel 3, or you can use chkconfig:

    chkconfig --level 3 nfs on


    If you get a message like "rpcinfo: cannot contact portmapper: RPC: Remote system
    - Connection refused" or "No remote programs registered," the portmap isn''t running
    or has stopped running. Kill and restart the portmap, mountd, and nfsd services.'
