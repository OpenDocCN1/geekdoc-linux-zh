- img_proc: true
  md: '# The Samba FAQ 199


    Deleting the means samba takes a little longer to stabilize on startup but otherwise
    will not operate correctly.


    In Samba 2.0 this problem has been fixed properly by storing signature information
    in the relevant files.


    # Linux & mmap()


    Early versions of Linux did not support shared writeable mmap(). I believe it
    was introduced in kernel version 2.0.


    There are 3 possible fixes:


    +   1. upgrade to a newer version of the Linux kernel

    2. don''t compile Samba with FAST_SHARE_MODES

    3. use Samba 1.9.18 which provides FAST_SHARE_MODES via SysV IPC shared memory.
    I believe Linux 1.2 supported this.


    In Samba 2.0 configure script will auto-detect capabilities and will enable shared
    memory only if available.


    # Logon errors in NT Event Viewer


    The logon errors in the NT event viewer are caused by Samba trying to detect broken
    NT password servers.


    Some NT servers will accept any username/password for session setup requests and
    always validate it, returning a positive session status response without the guest
    set. Samba checks for this by deliberately sending an incorrect password when
    calling the password server in server level security. If the incorrect password
    succeeds then Samba causes an error and refuses to use the password server.


    You can remove this check from the code if you want, but as we have not worked
    out what causes a NT server to show this behavior there is a risk that your NT
    server will start incorrectly and make your Samba server insecure.


    Future Samba will have a new security option "security = domain" which will use
    the same protocols that NT uses for domain authentication (currently Samba uses
    the method that MS documents, rather than that Microsoft actually uses). Once
    in that place problem should be solved.


    # Macintosh Clients


    > Are there any Macintosh clients for Samba?


    Yes. Thurs now has a CIFS Client/Server called DAVE—see http://www.thursby.com/.
    Test it against Windows 95, Windows NT and samba for compatibility issues. At
    the time of writing, DAVE was at version 1.0.1. The 1.0.0 to 1.0.1 update is available
    as a free download from the Thursby web site (the speed of finder copies has been
    greatly enhanced, and there are bug-fixes included).'
  merge: -1
  pgno: 214
- img_proc: true
  md: '200


    Appendix B: Samba Documentation


    Alternatives—There are two free implementations of AppleTalk for several kinds
    of UNIX machines, and several more commercial ones. These products allow you to
    run file services and print services natively to Macintosh users, with no additional
    support required on the Macintosh. The two free implementations are Netatal, http://www.umich.edu/-rsug/netatal/atklalk.
    What Samba offers MS Windows users, these packages offer to Macs. For more info
    on these packages, Samba, and Linux (and other UNIX-based systems) see http://www.eats.com/linux_mac_win.html


    # NT Guest Access


    What you are seeing is normal and deliberate.


    MS Windows NT can be configured with the guest account enabled. When this is the
    case no login attempt will ever fail. Instead NT will allow the user access as
    guest account IF the username and/or password is incorrect. In a situation where
    Samba is using and NT system to validate user passwords, the NT server guest account
    is enabled then a user logging as “root” will always be validated even if the
    password was correct and normal user privilege has been granted, or if the password
    was incorrect and the user has been given only “guest” privileges.


    In short, if we were NOT to do what we do, then there would be no way of telling
    whether or not the password server allows only guest logons. We were to just accept
    the validation response from such a server the user could easily gain “root” level
    access to a Samba server.


    Now you would not really want us to change the current behavior, would you?


