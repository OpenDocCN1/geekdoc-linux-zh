  md: '# Samba FAQ


    # CRLF-LF Conversions


    We get many requests for CRLF/LF format conversion handling by samba. The problem
    is that there is no clean way to determine which files should / could be converted
    and which MUST not.


    Since Unix and DOS/Windows uses alike will use .txt to represent a file containing
    ASCII text we cannot reliably use the file extension. The same applies to the
    .doc extension.


    Samba operates around the premise that we should leave all files unchanged. By
    not implementing CRLF/LF conversions we can not be guilty of damaging anyone''s
    files.


    When some comes along with a sound implementation that guarantees file integrity
    we will jump at the opportunity to implement this feature. Until such time there
    is no prospect for action on this topic.


    # Closed Off 1.9.18


    Thank you for reporting your difficulties with samba-1.9.18 series code. We regret
    however that all work on the 1.9.18 code tree has been closed off with the release
    of samba-1.9.18p10.


    All development efforts are now being focussed on stabilizing samba-2.0.0 so it
    can go into release to stable code as soon as possible.


    If you could download the most recent beta release and report back any difficulties
    you may have we will do our best to close them before the stable release.


    We will still fix major bugs and security holes in 1.98p10, but minor bugs will
    be fixed if the problem still exists in the 2.0 tree.


    For information about accessing the latest CVS source code please refer to http://samba.org/cvs.html


    Couldn''t open status file STATUS..LCK


    If you run smstatus before anyone has connected to your new Samba installation
    then you may get your error:


    ```

    Couldn''t open status file /var/lock/samba/STATUS..LCK

    ```


    or possibly the error:


    ```

    ERROR smb_shm_open : open failed with code No such file or directory

    ERROR: Failed to initialize share modes!

    Can''t initialize shared memory - exiting

    ```


    both of these errors are harmless. The appropriate files and memory segments automatically
    created the first time you connect to Samba. Try connecting with smbclient and
    you should find that smstatus is happy after your first connection.'
  merge: -1
