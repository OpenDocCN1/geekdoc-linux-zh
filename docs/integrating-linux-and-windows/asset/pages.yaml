  md: '# Appendix C: Samba Man Pages


    This enumeration variable defines the versions of the SSL protocol that will be
    used. "ss12or3" allows dynamic negotiation of SSL v2 or v3, "ss12" results in
    SSL v2, "ssl13" results in SSL v3 and "tls1" results in TLS v1. TLS (Transport
    Layer Security) is the (proposed?) new standard for SSL.


    Default: ssl version = "ssl12or3"


    +   * stat cache (G)


    This parameter determines if smbd will use a cache in order to speed up case insensitive-mapping
    names. You should never need to change this parameter.


    Default: stat cache = yes


    +   * stat cache size (G)


    This parameter determines the number of entries in the stat cache. You should
    never need to change this parameter.


    Default: stat cache size = 50


    +   * status (G)


    This enables disabling locking of connections to a status file that smbtatus can
    read. With this disabled smbtatus won''t be able to tell what connections are
    active. You should never need to change this parameter.


    Default: status = yes


    +   * strict locking (S)


    This is a boolean that controls the handling of file locking in the server. When
    this is set to "yes" the server will check every read and write access for file
    locks, and deny access if lock exists. This can be slow on some systems.


    When strict locking is "no" the server does file locking only when the client
    asks for them.


    Well behaved clients always ask for lock when it is important, in the vast majority
    of cases "strict locking = no" is preferable.


    Default: strict locking = no


    Example: strict locking = yes


    +   * strict sync (S)


    Many Windows applications (including the Windows 98 explorer shell) seem to flushing
    buffer contents to disk with a sync to disk. Under UNIX, a sync call forces the
    process to be suspended until the kernel has ensured that all outstanding data
    in kernel buffers has safely stored on stable storage. This is very slow and should
    only be done rarely. Setting this parameter to "no" (the default) means that smbd
    ignores the Windows requests for a sync call. There is only a possibility of losing
    data if the operating system itself that Samba is running on crashes, so there
    is little danger in this default. In addition, this fixes many performance problems
    that people have reported with the new Windows98 explorer shell file copies.


    306'
