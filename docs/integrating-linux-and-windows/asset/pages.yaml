  md: '# MOUNTING WINDOWS

    PARTITIONS WITH LINUX


    Fortunately, most Windows filesystems are supported by the Linux kernel. The mount
    command can be used to mount the partition:


    ```

    mount [options] device directory

    ```


    For example, to mount the first partition on the first drive into the directory
    /mnt/drivec


    ```

    mount /dev/hda1 /mnt/drivec

    ```


    Now, changing the directory to /mnt/drivec will show the contents of the first
    partition, which would be the C: drive in Windows.

    The mount command will usually detect the filesystem type on the partition. If
    not, use the -t option to specify the filesystem type. The supported Windows filesystems
    are:


    +   - iso9600—Standard CD-ROMs. Newer kernels have support for Rock Ridge Extensions
    and Joliet Drives (used by Windows 9x CD-ROMs).

    - Mdos—FAT16 and FAT12.

    - Nfs—NTFS.

    - Umsdos—A UMSDOS partition on a FAT partition.

    - Vfat—FAT32.


    For example, to load an NTFS partition:


    ```

    mount -t ntfs /dev/hda1 /mnt/drivec

    ```


    A word of caution: The NTFS drivers are read and write, but use the write mode
    at your own risk!

    If your kernel doesn''t support for these filesystems, there are kernel patches
    for different filesystems, including the UDF filesystem. The UDF filesystem is
    used on DVD CD-ROMs and some CD-R and CD-RW drives. Unfortunately, the UDF modules
    for Linux are currently read-only.


    Adding new filesystem to the kernel requires recompiling your kernel. If this
    isn''t covered in the user manual, there are instructions on compiling kernels
    at http://www.linuxdoc.org/HOWTO/Kernel-HOWTO.html.

    The kernel patches for the various filesystems are:


    +   - FAT32—http://www-plateau.cs.berkeley.edu/people/chaffee/fat32.html.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# Chapter 3 • Mounting Windows Partitions with Linux


    +   * Joliet CD-ROMs—http://bmrc.berkeley.edu/people/chaffee/joliet.html.

    * NTFS—http://www.informatik.hu-berlin.de/~loewis/ntfs/

    * UDF—http://trylinuxux.com/projects/udf/


    # 3.1 Accessing Compressed DOS/Windows Drives with Linux


    Unlike other drives, support for compressed drives is not built into most kernels.
    There are two programs that allow access to compressed DOS/Windows drives: thfs
    and DMSOS. thfs allows read-only support for Double Space and Drive Space (Microsoft’s
    disk compression programs). thfs is available at http://ftp.ftp-ai-lab.fr-fwurtangen.de/pub/os/linux/thfs.tz.


    The other program, DMSOS, uses the loopback device to read and access compressed
    drives. It supports Double Space Drive Space, and Stacker (a third-party compression
    program). Like other filesystem, it is a kernel patch and it is available at:
    http://fb9nt.uni-duisburg.de/mitarbeiter/gockel/software/dmsos/.

    MCE DMSOS is added to the kernel, the compressed drives can be loaded like ordinary
    FAT partitions that have a loopback is added. For example, to load a compressed
    FAT16 drive that is the first partition on the drive, type:


    ```

    /dev/hd1 /DOS mount -t dmsos -o loop /dbspace.001 /mnt

    ```


    The partition is mounted on /DOS the compressed filesystem (cvf) is mounted on
    /mnt. The cvf is used to mount compressed data and /DOS is used to decompress
    data.

    DMSOS should detect the type of compression for the drive, but there are options
    that can be used if there are problems mounting the drive. The DMSOS options use
    the following format:


    ```

    DMSOS -t <partition type> -o cvf_options=option1+option2...

    ```


    There are five option types for DMSOS. The DMSOS documentation has a list of all
    values for each option:


    +   * comp:xxx—This specifies the compression type. Since DMSOS will automatically
    detect the compression type, this is seldom.

    * cf:xxx—This is a whole number from 1 to 12. 1 is the fastest, but gives the
    least compression; 12 is the slowest, but gives the most compression.

    * bitferers:xxx—This is what to do if errors are found on the compressed partition.
    The default is to set the partition to read-only.

    * loglevel:xxx—This creates a log file that is useful in troubleshooting. Look
    at the dmsos.h in the source code for any option of levels.

    * speedup:xxx—This should not be used unless you know what you are doing. This
    sets how the drive is accessed. Setting it too low will cause DMSOS to be very
    slow and setting it too high could corrupt the drive.'
  merge: -1
