  md: '# /etc/rc


    (or whatever initialization script your system uses).


    If running the server as a daemon at startup, this file will need to contain an
    appropriate


    startup sequence for the server.


    # /usr/local/samba/lib/smb.conf


    This is the default location of the smb.conf server configuration file. Other
    common

    places that systems install this file are /usr/samba/lib/smb.conf and /etc/smb.conf.


    When run as a WINS server (the wins support parameter in the smb.conf (5) man

    page), nmbd will store the WINS database in the file wins.dat in the var/locks
    di-

    rectory configured under wherever Samba was configured to install itself.


    If nmbd is acting as a browse master (see the local master parameter in the smb.conf

    (5) man page), nmbd will store the browsing database in the file browse.dat in
    the

    var/locks directory configured under wherever Samba was configured to install
    itself.


    # Signals


    To shut down an nmbd process it is recommended that SIGKILL (-9) NOT used, ex-

    cept as a last resort, as may leave the name database in an inconsistent state.
    The con-

    way to terminate nmbd is to send it a SIGTERM (-15) signal and wait for it to
    die out

    it own.


    nmbd will accept SIGHUP, which will cause it to dump out its names into the file

    amelist.debug in the /usr/local/samba/var/locks directory (or the var/locks direc-

    tory configured wherever Samba was configured to install itself). This will also

    cause nmbd to dump out its server database in the log.name file. In addition,
    the debug

    log level of nmbd may be raised by sending it a SIGUSR1 (kill -USR1 <nmbd-pid>)\sand
    lowered by sending it a SIGUSR2 (kill -USR2 <nmbd-pid>). This is to allow

    tient problems to be diagnosed, whilst running at a normally low log level.


