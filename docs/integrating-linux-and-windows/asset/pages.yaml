    # 2.2 Ltools


    ltools provides command-line tools, a Web server that allows access with a browser,
    and a Java tool. The command-line tools mimic the functions of many DOS utilities.
    They run in DOS and all versions of Windows (3x, 9x, and NT). They should also
    work with Windows-2000, although they haven''t been extensively tested with it.


    > There is some unusual behavior when writing to the ext2 filesystem with ltools.
    Any write operation will set the filesystem to "clean." This will cause problems
    except fsck (the disk checking tool for Linux) will run the next time the system
    is booted.


    Also, running ltools in a Windows 9x DOS box, the hard drive will have locking
    during use. This requires a floppy disk in your system even if the floppy is not
    used. The floppy drive will spin, but nothing will be changed on it.


    The ltools uses the Linux-style forward slashes (/) for directories and DOS-style
    cards. For all, the files in the /root directory would be /root/*.

    ltools comes with the following programs:


