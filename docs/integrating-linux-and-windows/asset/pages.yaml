    This enables or disables the honoring of the "share modes" during a file open.

    These modes are used by clients to gain exclusive read or write access to a file.

    These open modes are not directly supported by UNIX, they are simulated by shared
    memory, or lock files if your UNIX doesn''t support shared memory (almost all
    do).

