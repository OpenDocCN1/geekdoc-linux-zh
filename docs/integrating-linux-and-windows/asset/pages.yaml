    # 17.2 Setting up FTP for Linux


    FTP is a standard service with all Linux and UNIX machines. Most of the time,
    FTP is already running, but if it isn''t, it is easy to start. Simply open /etc/inetd.conf
    (the location may vary) in your favorite text editor and add the line (or uncomment
    if it is already there):


    ```

