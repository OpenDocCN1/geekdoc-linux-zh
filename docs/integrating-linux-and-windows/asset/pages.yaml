  md: "smb.conf (5) 259\n\n+   * domain master (G)\n  Tell nmbd to enable WAN-wide\
    \ browse list collation. Setting this option causes nmbd to claim a special domain\
    \ specific NetBIOS name that identifies it as a domain master for its given workgroup.\
    \ Local master browsers in the same workgroup on broadcast-isolated subnets will\
    \ give nmbd their local browse lists, and then ask smbd for a complete copy of\
    \ the browse list for the whole wide area network. Browser clients will contact\
    \ their local master browser, and will receive the domain-wide browse list, instead\
    \ of just the list for the broadcast-isolated subnet.\n\nNote that Windows NT\
    \ Primary Domain Controllers expect to be able to claim this workgroup special\
    \ NetBIOS name that identifies them as domain master browsers for that workgroup\
    \ by default (there is no way to prevent a Windows NT DC from attempting to do\
    \ this). This means that if this parameter is set and nmbd claims the special\
    \ name for a workgroup before a Windows NT DC is able to do so then subnet browsing\
    \ will behave strangely and fail.\n\nBy default (\"auto\") Samba will attempt\
    \ to become the domain master browser only if it is the Primary Domain Controller.\n\
