    Example: use hosts = yes

    ```


    +   - user (S)


    Synonym for "username".


    +   - users (S)


    Synonym for "username".


    +   - username (S)


    Multiple users may be specified in a comma-delimited list, in which case the supplied
    password will be tested against each username in turn (left to right).


    The username= line is needed only when the PC is unable to supply its own username.
    This is for the COREPLUS protocol or where your users have different WfWg usernames
    to UNIX usernames. In both cases you may also be better using the \server\user
    syntax instead.


    The supplied line is not a great solution in many cases as Samba will try to validate
    the password against each of the usernames in the username= line in turn. This
    is slow and a bad idea for users in case of duplicate passwords. You may get timeouts
    or security breaches using this parameter wisely.


    Samba relies on the underlying UNIX security. This parameter does not restrict
    who can login, it just hints to the Samba server as what users might agree with
    the supplied password. Users can login as whoever they please and will be able
    to do no more damage than if they started a telnet session. The daemon runs as
    the user that log in, so they cannot do anything that user cannot do.


    To restrict a particular set of users you can use the "valid users=" parameter.
    If any of the usernames begin with a ''@'' then the name will be looked up first
    in the netgroups list (if Samba is compiled with longterm support), followed by
    a lookup in the UNIX groups database and expand to a list of users in the group
    of that name.'
