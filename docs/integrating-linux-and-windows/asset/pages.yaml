  md: 'smb.conf (5)


    +   - writeable (S)


    Synonym for “writeable” for people who can’t spell (:-). Pronounced “ritter-bull”.


    +   - write list (S)


    This is a list of users that are given read-write access to a service. If the
    connecting user is in this list then will be given write access, no matter what
    the “read only” option is set to. The list can include group names using the @group
    syntax.


    Note that if a user is in both the read list and the write list then they will
    be given access.


    See also the “read list” option.


    ```

    Default: write list = <empty string>

    ```


    ```

    Example: write list = admin, root, @staff

    ```


    +   - write ok (S)


    Synonym for writeable.


    +   - write raw (G)


    This parameter controls whether or not the server will support raw writes SMB’s
    when transferring data from clients. You should never need to change this parameter.


    ```

    Default: write raw = yes

    ```


    +   - writeable


    An inverted synonym is “read only”.


    If this parameter is “no”, then users of service may not create or modify files
    in the service’s directory.


    Note that a printable service (“printable = yes”) *ALWAYS* allow writing to the
    directory (user privileges permitting), but only via spool operations.


    ```

    Default: writeable = no

    ```


    Examples:


    ```

    read only = no

    writeable = yes

    write ok = yes

    ```


    # Warnings


    Although the configuration file permits service names to contain spaces, your
    client software may not. Spaces will be ignored in comparisons anyway, so it shouldn’t
    be a problem—but be aware of the possibility.


    On a similar note, many clients—especially DOS clients—limit service names to
    eight characters Smbd has no such limitation, but attempts to connect from such
    clients if they truncate the service name. For this reason you should probably
    keep your service names down to eight characters in length.'
