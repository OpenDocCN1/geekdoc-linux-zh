  md: '# 14.1 smclient Command-Line Options


    the name. It uses the interfaces parameter in smb.conf to determine how to broadcast.
    If the interfaces parameter is not set, it will broadcast on all nodes interfaces.
    This parameter simply allows the default order of name resolution to be changed;
    for example, -R host lmbcast would make the host file the first and it would not
    use wins for resolution.


    +   - Netbios name—This sends a message to other computers, which is called a
    WinPopup message on Windows machines. On Windows 9x machines, you must have WinPopup
    enabled for this feature to work. Also note that this works only with NetBIOS
    names, not IP addresses or IP host names. After this command is entered, you are
    asked for the message, followed by <CTRL>:


    ```

    smclient -M alisa

    Added interface=10.0.0.2 bcast=10.0.0.255 nmask=255.255.255.0

    Connected. Type your message, ending it with a Control-D

    Hello! sent 6 bytes

    ```


    +   -i scope—This allows you to set the NetBIOS scope. It is rarely used.

    -N—This suppresses the password prompt. It is especially useful for adding smclient
    to scripts.

    -n netbios name—This allows you to set the NetBIOS name of the Linux machine.
    By default, smclient uses the NetBIOS name set in smb.conf. If this isn''t set,
    it uses the local host name as the NetBIOS name.

    -d debug level—This controls the number of debugging messages that are printed,
    which is used to debug problems. The default is 0, which only prints serious errors
    or warnings. Higher levels (larger numbers) will print more data. A debug level
    greater than 3 is rarely used.

    -p port—This allows you to change the TCP port by smclient. Windows machines always
    use Port 139, but this is needed only in rare cases.

    -h—Shows the command-line options.

    -I destination IP address—Allows to specify the IP address of the Windows machine
    you are connecting to. This is often used when NetBIOS names can''t be resolved
    to IP addresses. Just keep in mind that most Windows machines also require a NetBIOS
    name to make a connection.

    -E—This writes the error messages to stderr (the error message file) rather than
    stdout (usually the screen). The most common use for this is to redirect error
    messages to a file.

    -U username—Allows to specify the username used to log on to the Windows PC. The
    default is the upper-case version of the word “USER”. If this doesn''t exist,
    the log variables are used. You can see these by typing:


    ```

    env | grep USER

    env | grep LOGNAME

    ```'
