  md: '# 6.13 The Last Word


    Linux is not nearly as popular as the desktop as Windows, but the rapid development
    of desktop tools is changing. Most desktop applications now have equivalent Linux
    applications. The functions not available for Linux are rapidly filled by free
    and commercial applications. Linux’s low cost, stability, and low hardware requirements
    make it not only a viable replacement for Windows, but sometimes a better choice.


    # 6.14 Conclusions


    So which office suite for Linux is the best? The answer depends on what you need,
    of course. If compatibility with MS Office is paramount, nothing currently beats
    WP Office. WP Office is also the most feature-rich office suite available for
    Linux.


    For a free office suite, it’s hard to beat Star Office. It has a good set of features
    and compatibility with Word and Excel documents.


    Applixware and WordPerfect 8 are the clear choices for low-end systems, since
    they both run well on a 486 with 32MB of RAM.


    The open source office suites Koffice and Gnome Office are not ready for everyday
    use, yet they should soon challenge the commercial offerings the same way Linux
    is challenging Windows.


    Although they show promise, it is too soon to tell whether WBS can challange the
    standalone applications.'
