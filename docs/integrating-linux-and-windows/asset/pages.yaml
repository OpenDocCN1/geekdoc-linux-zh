  md: '# smclient (1)


    +   - -N If specified, this parameter suppresses the normal password prompt from
    the client to the user. This is useful when accessing a service that does not
    require a password.


    Unless a password is specified on the command line or this parameter is specified,
    the client will require a password.


    +   - -n NetBIOS name By default, the client will use the local machine’s hostname
    (uppercase) as its NetBIOS name. This parameter allows you to override the host
    name and whatever NetBIOS name you wish.

    - -d debuglevel debuglevel is an integer from 0 to 10, or the letter ‘A’.


    The default value if this parameter is not specified is zero.

    The higher this value, the more detail will be logged to the log files about the
    activities of the client. At level 0, only critical errors and serious warnings
    will be logged. Level 1 is a reasonable level for day running—it generates a small
    amount of information carried out.


    Levels above 1 will generate considerable amounts of log data, and should only
    be used when investigating a problem. Levels above 3 are designed for use only
    by developers and generate HUGE amounts of log data, most of which is extremely
    cryptic. debug messages will be printed. This setting is for developers only (and
    people who really want to know how the code works internally).


    Note that specifying this parameter will override the log level parameter in the
    smb.conf (5) file.


    +   - -P Option is no longer used. The code in Samba2.0 now serves the server
    device type, so no printer specific flag is needed.

    - -p port This is the TCP port number used when making connections to the server.
    The standard (well-known) TCP port number for an SMB/CIFS server is 139, which
    is the default.

    - -l logfilename If specified, logfilename specifies a base filename which operates
    operational data from the running client will be logged.


    The default base name is specified at compile.

    The base name is used to generate log file names. For example, if the name specified
    was “log”, the debug file will be log.client.

    The log file generated is never removed by the client.


    +   - -h Print the usage message for the client.

    - -I IP address is the address of the server to connect to. It should be specified
    in standard “a.b.c.d”.


    Normally the client would attempt to locate a named SMB/CIFS server by looking
    it via the NetBIOS name resolution mechanism described above in the name resolve
    order parameter above. Using this parameter will force the client to assume that
    the server is on the machine with the specified IP address and the NetBIOS name
    component of the resource being connected to will be ignored.


    # 319'
