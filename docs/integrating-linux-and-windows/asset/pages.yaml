- img_proc: true
  md: '# smb.conf (5)


    Samba


    23 Oct 1998


    Name


    smb.conf—The configuration file for the Samba suite


    # Synopsis


    **smb.conf The smb.conf file** is a configuration file for the Samba suite. **smb.conf
    contains** runtime configuration information for the Samba programs. **smb.conf
    file** is designed to be configured and administered by the **swat (8)** program.
    The complete description of the file format and possible parameters held within
    are here for reference purposes.


    # File Format


    The file consists of sections and parameters. A section begins with the name of
    the section in square brackets and continues until the next section begins. Sections
    contain parameters of the form


    ```

    `name = value`

    ```


    The file is line-based—that is, each newline-terminated line represents either
    a comment, a section name or a parameter.


    Section and parameter names are not case sensitive.


    Only the first equals sign in a parameter is significant. Whitespace before or
    after the first equals sign is discarded. Leading, trailing and internal whitespace
    in section and parameter names is irrelevant. Leading and trailing whitespace
    in a parameter value is discarded. Internal whitespace within a parameter value
    is retained verbatim.


    Any line beginning with a semicolon ('';'') or a hash (''#'') character is ignored,
    as are lines containing only whitespace.


    Any line ending in a ''\'' is "continued" on the next line in the customary UNIX
    fashion.

    The values following the equals sign in parameters are either a string (no quotes
    needed) or a boolean, which may be given as yes/no, 0/true/false. Case is not
    significant in boolean values, but is preserved in string values. Some items such
    as create modes are numeric.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# Section Descriptions


    Each section in the configuration file (except for the [global] section) describes
    a shared resource (known as a “share”). The section name is the name of the shared
    resource and the parameters within the section define the shares attributes.


    There are three special sections, [global], [homes] and [printers], which are
    described under ‘special sections’. The following notes apply to ordinary section
    descriptions.


    A share consists of a directory to which access is being given plus a description
    of the access rights which are granted to the user of the service. Some housekeeping
    options are also specifiable.


    Sections either are file services (used by the client as an extension of their
    native file systems) or printable services (used by the client to access print
    services on the host running the server).


    Sections may be designated guest services, in which case no password is required
    to access them. A UNIX guest account is used to define access privileges in this
    case.


    Sections other than guest services will require a password to access them. The
    client provides the username. As older clients only provide passwords and not
    usernames, you may specify a list of usernames to check against the password using
    the “user=” option in the share definition. For modern clients such as Windows
    95/98 and Windows NT, this should not be necessary.


    Note that the access rights granted by the server are masked by the access rights
    granted to the specified or guest user by the host system. The server does not
    grant more access than the host system.


    The following sample section defines a file space share. The user has write access
    to the path /home/bar. The share is accessed via the share name “foo”:


    ```

    [foo]

    path = /home/bar

    writeable = true

    ```


    The following sample section defines a printable share. The share is readonly,
    but printable. This is, the only access permitted is via calls to open, write
    to and close a spool file. The ‘guest ok’ parameter means access will be permitted
    as the default guest user (specified elsewhere):


    ```

    [aprinter]

    path = /usr/spool/public

    read only = true

    printable = true

    guest ok = true

    ```'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Special Sections


    +   - The [global] section

    - Parameters in this section apply to the server as a whole, or are defaults for
    sections which do not specifically define certain items. See the notes under ''PARAMETERS''
    for more information.

    - The [homes] section

    - If a section ''homes'' is included in the configuration file, services connecting
    clients to their home directories can be created on the fly.


    When the connection request is made, the existing sections are scanned. If a match
    is found, the requested section name is treated as a user name and looked up in
    the local password file. If the name exists and the correct password has been
    given, a share is created by cloning the [homes] section.

    Some modifications are made to the newly created share:


    +   - The share name is changed from ''homes'' to the located name

    - If no path was given, the path is set to the user''s home directory.


    If you decide to use a path=line in your [homes] section then may find it useful
    to use the %S marker. For example:


    ```

    path=/data/phome/%S

    ```


    would be useful if you have different home directories for your PCs for UNIX access.

    This is a fast and simple way to give a large number of clients access to their
    home directories with a minimum of fuss.

    A similar process occurs if the requested section name is "homes", except that
    the share name is not changed to that of the requesting user. This method of using
    the [homes] section works well if different users share a client PC.

    The [homes] section can specify all the parameters a normal service section can
    specify, though some make more sense than others. The following is a typical and
    suitable [homes] section:


    ```

    [homes]

    writeable = yes

    ```


    An important point is that if guest access is specified in the [homes] section,
    all home directories will be visible to all clients without a password. In the
    very unlikely event that this is actually desirable, it would be wise to also
    specify only read access.

    Note that the browseable flag for home directories will be inherited from the
    global browseable flag, not the [homes] browseable flag. This is useful as it
    means browseable=no in the [homes] section will hide the [homes] share but make
    any auto directories visible.


    +   - The [printers] section'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# smb.conf (5) 241


    This section works like [homes], for printers.


    If a [printers] section occurs in the configuration file, users are able to connect
    to any printer specified in the local host''s printcap file.


    When a connection request is made, the existing sections are scanned. If a match
    is found, it is used. If no match is found, but a [homes] section exists, it is
    used as described above. Otherwise, the requested section name is treated as a
    printer name and the appropriate printcap file is scanned to see if the requested
    section name is a valid printer name. If a match is found, a new printer is created
    by cloning the [printers] section.


    A few modifications are made to the newly created share:


    +   * The share name is set to the located printer name

    * If no printer name was given, the printer name is set to the located printer
    name

    * If the share does not permit guest access and no username was given, the username
    is set to the located printer name.


    Note that the [printers] service MUST be printable—if you specify otherwise, the
    server will refuse to load the configuration file.


    Typically the path specified would be that of a world-writable spool directory
    with the sticky bit on it. A typical [printers] entry would look like this:


    ```

    [printers]

    path = /usr/spool/public

    writable = no

    g ok = yes

    printable = yes

    ```


    All aliases for a printer in the printcap file are legitimate printer names as
    far as the server is concerned. If your printing subsystem doesn''t work like
    that, you will have to set up a pseudo-printcap. This is a file consisting of
    one or more lines like this:


    ```

    alias|alias|alias...

    ```


    Each alias should be an acceptable printer name for your printing subsystem. In
    the [global] section, specify the new file as your printcap. The server will then
    only recognize names found in your pseudo-printcap, which can contain whatever
    aliases you like. The same technique could be used simply to access a subset of
    your local printers.


    An alias, by the way, is any component of the first entry of a printcap record.
    Records are separated by newlines, components (if there are more than one) are
    separated by vertical bars (''|'')


    NOTE: On SYS systems which use lpstat to determine what printers are defined on
    the system you may be able to use "printcap name = lpstat" to automatically obtain
    a list of printers. See the "printcap name" option for more details.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# Parameters


    Parameters define the specific attributes of sections.

    Some parameters are specific to the [global] section (e.g., security). Some parameters
    are usable in all sections (e.g., create mode). All others are permissible in
    normal sections. For the purposes of the following descriptions the [homes] and
    [printers] sections will be considered normal. The letter ''G'' in parentheses
    indicates that a parameter is specific to the [global] section. The letter ''S''
    indicates that a parameter can be specified in a specific section. Note that all
    ''S'' parameters can also be specified in the [global] section—in which case they
    will define the default behavior for all services.


    Parameters are arranged here in alphabetical order—this may not carry best beflow,
    but at least you can find them! Where there are synonyms, the preferred synonym
    is described, others refer to the preferred synonym.


    # Variable Substitutions


    Many of the strings that are set in the config file can take substitutions. For
    example the option "path = /tmp/%u" would be interpreted as "path = /tmp/john"
    if the user connected with the username.


    These substitutions are mostly noted in the descriptions below, but there are
    some general substitutions apply whenever they may be relevant. These are:


    +   * %S = the name of the current service, if any.

    * %P = the root directory of the current service, if any.

    * %u = user name of the current service, if any.

    * %g = primary group name of %u.

    * %U = session user name (the name that the client wanted, not necessarily the
    same as the one they got).

    * %G = primary group name of %U.

    * %H = the home directory of the user given by %u.

    * %v = the Samba version.

    * %h = the hostname that Samba is running on.

    * %m = the NetBIOS name of the client machine (very useful).

    * %L = the NetBIOS name of the server. This allows you to change your config based
    on what the client calls you. Your server can have a "dual personality".

    * %M = the internet name of the client machine.

    * %N = the name of your NIS home directory server. This is obtained from your
    NIS auto.map entry. If you name Samba with the --automount option then this value
    will be the same as %L.

    * %p = the path of the service''s home directory, obtained from your NIS auto.map
    entry. The NIS auto.map entry is split up into "%N:%p".

    * %R = the selected protocol level after protocol negotiation. It can be one of
    CORE, COREPLUS, LANMAN1, LANMAN2 or NT1.'
  merge: -1
  pgno: 257
- img_proc: true
  md: '+   - %d = the process id of the current server process.


    +   - %a = the architecture of the remote machine. Only some are recognized, and
    those

    may not be 100% reliable. It currently recognizes Samba, WinWF, WinNT

    Win95. Anything else will be known as “UNKNOWN”. If it gets into them then sending-

    level 3 to samba-bugs@samba.org allow it to be fixed.


    +   - %I = The IP address of the client machine.


    +   - %T = the current date and time.


    There are some quite creative things that can be done with these substitutions
    and other

    samba.conf options.


    # Name Mangling


    Samba supports “name mangling” so that DOS and Windows clients use files that
    don’t

    conform to the 8.3 format. It can also be set to adjust the case of 8.3 format
    filenames.


    There are several options that control the way mangling is performed, and they
    are

    grouped rather than listed. For the defaults look at the output of the test-param
    program.


    All of these can be set separately for each service (or globally, of course).

    The options are:


    +   **mangle case = yes/no** controls if names have characters that aren’t of
    the “de-fault” case are mangled. For example, if this is then a name like “Mail”
    would be

    mangled. Default no.


    +   **case sensitive = yes/no** controls whether filenames are case sensitive.
    If they aren’t

    samba must do a filename search and match on passed names. Default no.


    +   **default case = upper/lower** controls what the default case is for new filenames.
    De-fault lower.


    +   **preserve case = yes/no** controls if new files are created with the client

    case or if they are forced to be the “default” case. Default Yes.


    +   **short preserve case = yes/no** controls if new files which conform to 8.3
    syntax,

    is in upper case and of suitable length, created upper case, or if they are forced
    to

    the “default” case. This option can use with **preserve case = yes** to permit

    long filenames to retain their case, while short names are lowered. Default Yes.


    By default, Samba 2.0 has the same semantics as a Windows NT server, in that it
    is

    insensitive but case preserving.


    # Note About Username/Password Validation


    There are a number of ways in which a user can connect to a service. The server
    follows

    the following steps in determining if it will allow a connection to a specified
    service. If all

    steps fail then the connection request is rejected. If one of the steps pass then
    the-lowing steps are not checked.


    If the service is marked “guest only = yes” then steps 1 to 5 are skipped.'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'Step 1: If the client has passed a username/password pair and that username/password
    pair is validated by the UNIX system''s password programs then the connection
    is made as username. Note that this includes the \\server\username method of passing
    a username.


    Step 2: If the client has previously registered a username with the system and
    now supplies a correct password for that username then the connection is allowed.


    Step 3: The client''s netbios name and previously used user names are checked
    against the supplied password, and if they match then the connection is allowed
    as the corresponding user.


    Step 4: If the client has previously validated a username/password pair with the
    server and the client has passed the validation token then that username is used.
    This step is skipped if "revalidate = yes" for smb.conf.


    Step 5: If a "user =" field in the smb.conf file for the service and the client
    has supplied a password, and that password matches (according to the UNIX system''s
    password checking) with one of the users from the user= field then the connection
    is made as the username in the "user=" line. If one of the username in the user=
    list begins with a ''\@'' then name expands to a list of names in the group of
    the same name.


    Step 6: If the service is a guest service then a connection is made as the username
    given in the "guest account =" for the service, irrespective of the supplied password.


