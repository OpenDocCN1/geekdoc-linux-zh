- img_proc: true
  md: 'VNC consists of two components: It has a server that runs the programs on one
    machine and a viewer that displays the programs on another machine. It is available
    for Linux, Windows, and most other operating systems. There are viewers for Windows
    CE and Java. The viewer is very small (the Win32 viewer is 150k) and doesn''t
    require installation, which means it can easily be run from a floppy!


    There are some differences in the servers, though. The Linux and UNIX servers
    are multi-user. This means that more than one machine can open a separate session
    on the server. The Windows server, however, only allows a single session. It will
    allow multiple users to log into one session, however. Windows is not a true-multi-user
    OS. If you need to open multiple sessions, use Citrix WinFrame.


    One advantage VNC has over X11 is that no state is stored in the viewer. This
    is a fancy way of saying that if you lose your connection, you can reconnect without
    losing anything. This is a godsend over modem connections and unreliable networks.

    VNC uses less bandwidth than X11. There are several settings that can be used
    to optimize VNC for low- and high-bandwidth connections which will be discussed
    later. A properly optimized VNC session will even work well over a dial-up connection!


    # # 10.3.1 Installing VNC Server for Linux


    To install VNC, download the packages from http://www.uk.research.att.com/vnc.
    The Linux installation comes with four programs:


    +   - Vncviewer—This is the VNC viewer, or client, program for X-Windows.

    - Vncserver—This is a wrapper script which makes starting an X-Windows VNC server
    (i.e., desktop) more convenient. It is written in Perl, so to use the script you
    need that.

    - Vncpasswd—This program allows you to change the password to access your X Windows
    VNC desktops. The vncserver script uses this program when you first start a VNC
    server.

    - Xvnc—This is the X-Windows VNC server. It is both an X-Windows server and a
    VNC server. You normally use the vncserver to start Xvnc.


    Copy these files to /usr/local/bin and you are ready to go. vncserver is a script
    file (written in Perl) that it can be edited if needed. This would only be if
    you don''t have the packages in the normal places. For example, you may need to
    edit the first line, /usr/bin/perl, if your Perl program is not in the /usr/bin
    directory. You may also need to add a font and color database path to the section
    marked, appropriately. Add path and color database .

    Once this is done, start the VNC server by typing vncserver. The first time you
    run it, you will be prompted for a password. This is the password that must be
    entered at the viewer. You can always change the password later with the vncpasswd
    program.


    You can open any VNC server sessions as needed. It will take the first available
    X11 session by default. The first display on X11 is 0, so the first VNC server
    session will be 1.'
