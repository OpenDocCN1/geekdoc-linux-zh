  md: 'Once this is done, open the Registry editor (either regedit or regedt32). Go
    to the Registry hive [HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\WinLogon].
    If it exists, create the key GnaDll to nisgina. If it doesn''t exist, create the
    key.


    Once this done, close the Registry editor and reboot. You should get the familiar
    login screen. <CTRL>-<ALT> should get the NISGina login screen asking for a username
    and password.


    Once you log on using the NIS database, NISGina will check to see if a local account
    exists with the same username. If it doesn''t exist, NISGina updates the credentials
    of the local database. If it doesn''t exist, NISGina creates a local account with
    the same username. This allows the username to log on even if the NIS database
    is not available.


    Of course, if you can''t log on, NISGina is not set up properly and you need to
    use the rescue disk to recover and start.


    # 16.6.1 Problems with NISGina


    Because NISGina creates a local account, there are problems with roaming profiles.
    This is because Windows NT treats local accounts on different machines as different
    accounts, even when the accounts have the same name.


    NISgina also keeps a log file, ~wint\nisgina.log, which has usernames and encrypted
    passwords in it. It would be a good idea to make this readable by the administrator
    instructor, or to pose a security risk.


    ypcat.exe and ypmatch.exe could also be used to view usernames and encrypted passwords
    and should be similarly restricted. This will not stop anyone from downloading
    or copying the files from elsewhere, but there is no way to restrict port usage
    in Windows NT. In Linux (and UNIX), the ports used by ypcat and ypmatch are restricted
    for use by the administrator or equivalent users.


    # 16.6.2 NIS Security


    NIS was not really designed to be secure. It was designed to allow the centralized
    management of usernames and passwords on a UNIX network. There are several things
    you can do to increase security, however.


    As with NFS, any connections to the outside should be through a firewall or other
    security device. NIS should never be used on an unsure connection.


    If security is a real concern, NIS+ is a newer version of NIS that has much better
    security. The problem is that the NIS+ server for Linux is currently in development.
    The Linux NIS+ client is well supported, If you are already on an NIS+ network,
    you can download the Linux client at ftp://kernel.org/pub/linux/net/nis/.'
