    If you change the boot sector of Linux, you must make a new boot.lnx. This usually
    happens when you upgrade the Linux kernel.

    All these steps can be done automatically with BootPart. Simply run the BootPart
    program and choose the location of the Linux partition. It will edit the boot.ini
    and create the Linux boot file automatically.


    # 1.6.9 Using LILO


    Windows NT requires its own master boot record on the drive. To boot NT from LILO,
    NT must be loaded on a separate drive. To use LILO to boot to NT, Linux must be
    on the first drive and NT on the second drive.


    If we install LILO on the first partition, we must modify lilo.conf. Most Linux
    installation programs allow you to create a LILO menu item for another OS (operating
    system). Check your manuals to see if it is supported. If not, manually edit the
    lilo.conf, which will look like this:


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    default=linux

    key=boot/us.klt

    prompt

    timeout=50

    message=/boot/message image=/boot/vmlinux

    label=linux

    root=/dev/hda5

    read-only

    ```


    If Windows NT is on the second drive, add the following to the end of lilo.conf:


    ```

    other=/dev/hdb1

    table=/dev/hda

    loader=/boot/any_d.b

    label=WindowsNT

    ```


    This is what the added lines mean:


    +   * other—Points to the first partition on the second hard drive (dev/hdb1).

    * table—This is where the drive table is. This is required by LILO.

    * loader=/boot/any_d.b—Required when not booting from the primary drive.

    * label—The name for the section.'
  merge: -1
