  md: '# Internet Security


    After the services have been pruned, the system again for open ports. Once this
    is done, we need to get some tools to monitor and protect the system.


    The first thing to do is look for updates. Most known security holes in Linux
    are quickly fixed, but many users neglect to download fixes. Most Linux distributions
    post fixes on their Web site. You might also want to subscribe to the Cert (www.cert.org)
    and BugNet (www.bugnet.com) mailing lists.


    There are also personal firewalls for both Linux and Windows. A firewall is a
    device or program that restricts access from the Internet to the local network
    and computers. A free firewall for Linux is the Phoenix Adaptive Firewall (http://www.progressive-systems.com/products/phoenix).
    For Windows, there is Zone Alarm (http://www.zonelab.com/). These programs are
    free for personal use. Commercial licenses are also available from Phoenix and
    Zone Labs.


    Tripwire is an open source intrusion detection software. The principal behind
    it is rather simple. Tripwire makes a snapshot of the system settings and stores
    it on a floppy. Tripwire can then be run later to determine if any system settings
    have changed. When a cracker comes when they break into a system he change the
    system settings so that they can get back in easily. This is detected by Tripwire.
    Tripwire is available at http://www.tripwire.org.


    It is also a good idea to put a port scanner on your system. One of the best is
    Psionic''s PortEntry (http://www.psionic.com/abacus/portsentry/). If PortEntry
    detects a port scan, it will drop the connection from the scanning machine and
    block it from further connections. The program is available in source code only,
    but it compiles problems if you follow the installation instructions.


    Once the source code is downloaded, extract the files:


    ```

    gunzip portsentry-1.0.tar.gz

    tar xvf portsentry-1.0.tar.tar

    ```


    Next, edit the portsentry_config.h to add the locations of the files PortEntry
    uses.

    The defaults are in many cases:


    +   - CONFIG_FILE—The path to the PortEntry configuration file. The default location
    will be /local/psionic/portsentry/portsentry.conf.

    - WRAPPER_HOSTS_DENY—The name and path of the TCP Wrapper hosts.deny file. On
    most systems, the file is in /etc/hosts.deny.

    - SYSLOG_FACILITY—The syslog facility for PortEntry to use.

    - SYSLOG_LEVEL—The syslog level at which to send messages.


    Then, edit portsentry.conf. The README.install explains the different settings.

    Add any host you wish PortEntry to ignore portsentry.ignore.

    Finally, compile the program:


    ```

    make linux

    make install

    ```'
