    \ Options\n\nThe general form of the smbclient command line is:\nsmbclient <servicename>\
    \ <password> <options>\n\nThe servicename is the name of the Windows service you\
    \ are attaching to. It is in the form of //server/share. The password is the password\
    \ for the share or user logging into the service. This depends on whether Windows\
    \ is shared or user-level security. The options are covered below:\n\n+   - s\
    \ smb.conf—Points to the location of the smb.conf. Like the rest of the Samba\
    \ suite, smbclient gets its settings from the smb.conf.\n- B ip—This allows smbclient\
    \ to look up the Windows machine’s NetBIOS using its IP address.\n- O Socket Options—This\
    \ allow you to tune the TCP socket used by smbclient.\n- R Name Resolve Order—There\
    \ are several ways Linux uses to resolve names on a network. By default, Linux\
    \ uses this to resolve:\n1. localhost—The file used by Samba for looking up host\
    \ names. It is stored in the same directory as smb.conf.\n2. host—This is the\
    \ default file for looking up names on a Linux system. It is kept in the /etc\
    \ directory.\n3. wins—If available, the Linux system will use the WINS server\
    \ to resolve names.\n4. bcast—If the other methods fail, Linux will use a broadcast\
    \ to attempt to resolve"
