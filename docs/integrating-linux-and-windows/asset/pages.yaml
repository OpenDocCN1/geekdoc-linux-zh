    # 17.4.6 Setting Up an SSH Server for Linux


    The first thing to do is to disable the remote services as rexec, rsh, and login.
    This is by adding a # in front of the respective lines in inetd.conf. This prevents
    the

    ents logging in insecurely, which would defeat the whole purpose of SSH.


    Once this is done, sshd (the server program) can be loaded. This can be loaded
    from the

    command line. There are several options that can be set in the configuration file,

    /etc/sshd_config. To get details on these settings, go to the man page (type man
    ssh

    from the prompt). The command-line options override the settings in the sshd_config
    file.


    # 17.4.7 Using the SSH Clients


    SSH is the replacement for rcp, rexec, and login. The general syntax is ssh

    <remote computer name>. You can also send a username (other than your current
    user-

    er typing) ssh - <username> <remote computer name>. To execute a remote com-

    d(like command), type ssh <remote computer> <command name>. There are many other

    options for SSH listed on the man page (type man ssh).


    scp is the replacement for rcp. To run it, type scp <user@host:file to copied>

    <user@host:where to copy the file>.You can substitute the user@host for files
    for the

    local machine. Also, to keep the file attributes, add -p to the command line.
    For example,

    to copy the file /root/test.file from the local machine to the /root/ directory
    on'
