    This is currently the only open source project for streaming video.


    QuickTime players are currently available for Macintosh and Windows only (http://www.apple.com/quicktime/download/).
    The free QuickTime player allows the playback of QuickTime files and streams.
    The $29 QuickTime Pro also has the ability to create and edit QuickTime


    There are some efforts to create Linux players that support QuickTime. The main
    problem is the CODECS. A CODEC is used to create audio and video files. The problem
    is that all the CODECS are patented and nobody is willing to pay for a CODEC for
    a free Linux player. Nevertheless, there are several Linux players in development.


    The best video player for Linux is xanim, which is included with most Linux distributions.
    But the problem is that the most common CODECS used by QuickTime are not supported.
    A list of supported CODECS is available at http://xanim.pubnrix.com/xa_whatisit.html#format_support.


    There is also an open source QuickTime for Linux, Xmovie and Broadcast 2000, which
    can create and play QuickTime movies using some limited CODECS. More information
    and downloads are available at http://heroine.boxlinux.com/quicktime.html.


    **Windows Media Player.** Windows Media isn''t really a cross-platform solution.
    The encoding tools, server, and player are all Windows-based and not available
    for Linux. The player is available for Macintosh and Windows, though. More information
    on Windows Media is available at http://www.microsoft.com/windows/windowsmedia/en/default.asp,
    and the tools, server, and player are available at http://www.microsoft.com/windows/windowsmedia/default.asp.


    # 5.6.2 Streaming Audio


    There is a wider range of choices for streaming audio, which works better over
    a standard dial-up connection. All the streaming players listed above support
    streaming audio. There are also several audio-only streaming programs. The most
    popular audio on the Web is MP3.


    MP3 started as a way to trade on the Internet. The main appeal of MP3 is its ability
    to easily create files from audio CDs that were close to the same quality as the'
