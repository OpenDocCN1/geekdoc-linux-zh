    +   * username level (G)

    This option allows Samba to try and ''guess'' at the real UNIX username, as many
    DOS clients send an uppercase username. By Samba tries lowercase, by the username
    with the first letter capitalized, and fails if the username is not found on the
    UNIX machine.


    If this parameter is set to non-zero the behavior changes. This parameter is a
    number that specifies the number of uppercase combinations to try whilst determining
    the UNIX user name. The higher the number the combinations will be tried, and
    the slower the discovery of usernames will be. Use this parameter when you have
    strange usernames on your UNIX machine, such as "AstrangeUser".


    Default: username level = 0

    Example: username level = 5


    +   * username map (G)

    This option allows you to specify a file containing a mapping of usernames from
    the clients to the server. This can be used for several purposes. The most common
    is to map usernames that use on DOS or Windows machines to those that the UNIX
    box uses. There is multiple maps to a single server so that they can more easily
    share files.


    The use of this option, therefore, relates to UNIX usernames and not Windows (specifically
    NT Domain) usernames. In other words, once a name has been mapped using this option,
    the Samba server serves the mapped name for internal and external purposes.


    This option is DIFFERENT from the "domain map" parameter, which maintains a one-to-one
    mapping between UNIX usernames and NT Domains: Specifically, the Samba server
    maps in BOTH usernames, presenting the NT username to the external NT world, and
    using the UNIX username internally.


    The map file is parsed by line. Each line should contain a single UNIX username
    on the left followed by ''='' by a list of usernames on the right. The list of
    usernames on the right may contain names of the form @group in case they will
    match any'
