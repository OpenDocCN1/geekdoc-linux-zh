- img_proc: true
  md: '# smshb and glibc-2.1


    smshb doesn’t work with glibc-2.1 on Linux systems. That includes RedHat 6.0 and
    many other recent Linux distributions. It is very hard to fix this the glibc maintainers
    have deliberately removed the necessary hooks for smshb to work. They don''t like
    the idea of user space filesystems.


    The only thing we can suggest right now is to use smbfs instead.


    # smbtar blocksize


    There was a slight error in early versions of smbtar that prevents the blocksize
    parameter from working correctly. This was fixed in Samba version 1.9.18.


    # unsubscribe


    For information on unsubscribing or changing your subscribed address see the instructions
    at http://lists.samba.org/


    # win98 slowdown


    +   - Further to my previous post, I have made an interesting discovery. This

    - particular slowdown only occurs from clients that are running

    - Windows 98.


    The Windows98 explorer (and possibly other programs) incorrectly set the “sync”
    in write requests to network shares. This causes an enormous slowdown as Samba
    (quite directly) does a fsync() on the file after each write. Combine this with
    the fact that Windows98 explorer uses very small size rings (around 1.5K) and
    you really get terrible results.


    In Samba 1.9.8p10 and later we modified Samba to default ignore these incorrect
    sync requests. This results in an enormous performance increase when using Windows98
    explorer.


    You can get the old (slow) behavior back using the “strict sync” option.


    # your server software is being unfriendly


    If you “your server software is unfriendly” when you try to connect to a server
    using smbclient then it means smbclient established a TCP connection to the server
    but garbage (or nothing) when it tried to do a NBT “session request” on the open
    socket. The “unfriendly” bit comes from the fact that the client is expecting
    one of many possible error codes defined in the spec (see RFC1001/1002) but it
    got something totally different.


    This usually means that you are not successfully talking to a SMB server at all,
    and that the socket is connected to something else. A common cause if Samba is
    the server is smbd failed to startup correctly and exited before it got to the
    point of answering the session request. Faulty/missing config files can do this
    or if you are launching via inetd then your inetd.conf or /etc/services is setup
    incorrectly.'
  merge: -1
