    \ backup or restore. You can use a wildcard * or if the r option is specified.\n\
    - X exclude expression—Specifies which files or directories to exclude from the\
    \ backup or restore. Like above, it can use wildcards if the r option is specified.\n\
    - r—Allows the use of wildcards.\n b blockSize—Specifies the number of 512-byte\
    \ blocks to use in the tar file.\n- g—Incremental mode. It will only back up files\
    \ with the archive bit set. This is useful for backing up files that have changed\
    \ since the last backup.\n- q—Quiet mode. Messages not printed.\n- N file—Only\
    \ files newer than the specified file are backed up. Used in conjunction with\
    \ the c option.\n- a—Resets the archive bit. Used with the g and c options.\n\n\
    Since the tar options are complicated, let's examine several examples of using\
    \ them. To back up all the files on the c share on the Windows PC alisa to the\
    \ file backup.tar, type the following:\n\n```\nsmclient //alisa/c -Tc backup.tar\n\
    ```\n\nTo restore the entire c share on alisa, type:\n\n```\nsmclient //alisa/c\
    \ -Tx backup.tar\n```\n\nTo back up the new files and reset the archive bit, type:\n\
    \n```\nsmclient //alisa/c -Tcga backup.tar\n```\n\nYou can also use tape drives\
    \ to back up. If you have a tape drive called rmt0, the command would be:\n\n\
    ```\nsmclient //alisa/c -Tcga /dev/rmt0\n```\n\n![](img/a1ad58e4259f15e8b2826ecf57a28362_153_0.png)"
