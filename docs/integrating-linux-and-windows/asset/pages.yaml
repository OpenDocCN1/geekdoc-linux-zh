    traditional and online businesses use databases to track orders, merchandise,
    and customers. Since they are so essential to business, it is not surprising that
    there are dozens of commercial and free databases and database add-ons.


    The most popular commercial databases are available for both Linux and Windows
    as well as several versions of UNIX. Many are also available for popular mainframes
    and mini-computers. Some of the more popular commercial databases are:


    +   - DB2—IBM’s heavy-duty database that originally ran on IBM mainframes and
