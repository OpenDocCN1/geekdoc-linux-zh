  md: '# Appendix C: Samba Man Pages


    +   - N Newer than. Must be followed by the name of a file whose date is compared
    against files found on the share during a create. Only files newer than the file
    specified are backed up to the tar file. Useful only with the c flag

    - a Set archive bit. Calculates the archive bit to be reset when a file is backed
    up. With the g and c flags.


    # Tar Long File Names


    smclient''s tar option now supports long file names both on backup and restore.
    However, the full path name of the file must be less than 1024 bytes. Also, when
    a tar archive is created, smclient''s tar option places all files in the archive
    with relative names, not absolute names.


    # Tar Filenames


    All file names can be given as DOS path names (with \ as the component separator)
    or as UNIX path names (with / as the component separator).


    # Examples


    +   - Restore from tar file backup.tar into myshare on mypc (no password on mypc)

    ```

    sclient //mypc/myshare "" -N -Tx backup.tar

    ```

    - Restore everything except users/docs

    ```

    sclient //mypc/myshare "" -N -Txx backup.tar users/docs

    ```

    - Create a tar file of the files beneath users/docs.

    ```

    sclient //mypc/myshare "" -N -Tc backup.tar usersdocs

    ```

    - Create the same tar file as above, but now use a DOS path name.

    ```

    sclient //mypc/myshare "" -N -tc backup.tar users\edocs

    ```

    - Create a tar file of all the files and directories in the shire.

    ```

    sclient //mypc/myshare "" -N -Tc backup.tar *

    ```

    - -D initial directory Change to initial directory before starting. Probably only
    of any use with the tar -T option

    - -c command string is a semicolon separated list of commands to be executed instead
    of prompting stdin. -N is implied by -c.


    This is particularly useful in scripts and for printing stdin to the server, e.g.
    -c ''print '' ''-'''
