  md: '58


    Chapter 6 • Business Applications


    Microsoft Office, including word processing (WordPerfect), a spreadsheet (Quatro
    Pro), presentation (Presentations), calendaring (CoreCENTRAL), and Web publishing
    (Trellix). The deluxe version also comes with a database (Paradox), more fonts,
    more clip art, the game Railroad Tycoon, and a bean-filled penguin toy (http://www.corel.com/Office2000/index.htm).


    WordPerfect (WP Office) for Linux comes off the same code as the Windows version
    and thus both versions look almost identical. Writing separate versions for Linux
    and Windows, Core decided to use the WINE libraries for low-level compatibility
    on Linux. While this has little effect on the speed of the Linux version, it does
    take it to load.


    WP Office comes with its own server. The standard version comes with over 100
    fonts and over 12,000 fonts. The server also allows the use of Windows fonts and
    TrueType fonts by simply copying them to the font directory! WP Office has some
    of the best-looking fonts of any Linux application. Even six-point fonts are easily
    readable!


    Loading a WP Office application takes about 30 seconds to two minutes. Loading
    an only takes a few seconds, WINE and the server are already loaded. Once the
    application is loaded, response is reasonably on a decent computer system. Please
    note that WP Office is NOT for low-end systems. To get decent performance, you
    must have a Pentium 200 or better with 64MB of RAM and 540MB of free disk space.


    Core spent a lot of time making WP Office could read and write to Microsoft Office
    documents. Word, Excel, and PowerPoint documents are imported into WP Office with
    little trouble. Later in the chapter, we will discuss importing and exporting
    MS Office files.


    WP Office also has the ability to export in portable formats such as HTML, XML,
    RDF, and TIFF. HTML is the standard format used by Web pages. WP Office allows
    documents, spreadsheets, and presentations to be exported directly into HTML to
    be published on a Web page, eliminating the need for separate HTML editors.


    XML is similar to HTML except that users can define their own data formats. PDF
    is still an evolving standard, it promises to allow easier access of data. PDF
    (Portable Document Format) by Adobe allows documents to look exactly the same
    on different platforms. It is a popular way of distributing documents and legal
    briefs. Finally, RTX (Rich Text Format) was first used by Microsoft Word to allow
    the exporting of Word documents to other word processors. It doesn''t support
    any advanced features of modern word processors, but it is supported by all major
    word processors.


    There are some drawbacks to WP Office. It has some installation problems on some
    Linux distributions. It seems to install well on Red Hat, Mandrake, and Core Linux,
    but it has problems on other distributions, including the SuSE Linux. Many of
    these problems have work-arounds. See Core''s support page at http://corel.com/support/wp2000-linux.htm
    for more information.


    Running WP Office also causes stability problems. WINE is still under development
    and is not close to being stable. Fortunately, a WP Office crash will not take
    the desktop with it. Just be sure the auto save feature is on going to Tool ->
    Settings -> Files -> Document, checking the Time document backup, and setting
    the number of minutes.'
