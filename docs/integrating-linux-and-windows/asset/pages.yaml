  md: '# EMULATORS


    Emulators are programs that allow you to run an application for one OS (operating
    system) on another OS. In this chapter, we will focus on emulators that allow
    Windows and DOS programs to run on Linux machines. There are no emulators to run
    Linux programs on Windows, but on the other hand, most programs are available
    for Windows.


    # 4.1 DOS


    DOS can run most DOS programs using DOSEmu. There are thousands of DOS programs
    that are still useful. Ten ago, DOS was the most popular DOS for PCs, with Microsoft
    (MS-DOS) and Digital Research (DR-DOS) selling their own version of it. Today,
    you can get copies of DOS for Caldera at http://www.caldera.com and FreeDOS at
    http://www.Freedos.org. DOS is still used in many embedded devices as cash registers
    because it is small and has many development tools available for it.


    Caldera purchased DR-DOS from Novell in the mid 90s and now targets it towards
    embedded applications. You can download it from their Web site, but you must pay
    for it if you choose to use. It is the best debugged and most complete version
    of DOS currently available. It also has a lot of extra features that weren''t
    included in MS-DOS such as multitasking, TCP/IP, and a web browser.


    FreeDOS is a project started in 1994 by Jim Hall. It is under the GPL and is free
    and open. It is currently used by Linux as part of DOSEmu, which is included in
    almost every Linux distribution. To use it, simply type <dosemu program> from
    the command prompt.


    FreeDOS and DOSEmu have programs for a low-end computer. FreeDOS will run on an
    8088 (the original IBM PC) with 640KB of memory. Linux will run on a 386 with
    4 MB of RAM (although X11 requires 8 MB just to load).


    So what can you do with DOS programs? You can turn an old PC into a machine that
    can surf the Web and use it. If you have a 386/33 with at least 4 MB of RAM (which
    you can find in dumpsters), you can run the Arachne Web browser found at http://home.apache.cz.
    This program contains a graphical Web browser, an email client, and a PPP dialer.
    While it doesn''t support many of the fancier features of the Web as Java, it
    supports frames and graphics. It can be run inside Linux using DOSEmu and there
    is a Linux port for the works.'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# Windows


    # 4.2 Windows


    Wabi is a commercial program that allows Windows 3x applications to run inside
    of X-Windows. It is available for many commercial versions of UNIX as well as
    Linux. The good news is that it runs Windows 3.1 programs very well. The bad news
    is that it is not currently being developed or supported on the Linux platform.
    Caldera has extensive documentation on Wabi: http://www.caldera.com/support/wabil.


    TWIN is a GNU project whose goal is to write UNIX libraries to emulate Windows
    32-bit APIs (Application Program Interfaces). Its two goals are to allow Windows
    to be compiled on UNIX (and Linux) and to allow Intel versions of UNIX to run
    Windows programs. Its libraries are supported on HPUX, AIX, and Solaris as well
    as Linux. Although it started as a separate project, the TWIN project has merged
    with the WINE (Wine Is Not an Emulator) project. For more information on the TWIN
    project, go to http://www.linux.com.


    The goal is to allow Windows to run natively on Intel versions of UNIX. WINE technically
    is not an emulator since it provides low-compatibility for Windows programs running
    on Linux, which gives it a significant advantage over using emulation.


    WINE currently works under Linux, FreeBSD, and Solaris, and is included with most
    current Linux distributions. If you don''t have a copy of WINE, you can obtain
    source code or RPMs at http://www.wineq.com.


    After WINE is installed, you must configure the wine.conf file. The format is
    the same as Windows .ini file. See Appendix A for details on configuration. After
    WINE is configured, you can install Windows programs. Start X-Windows and open
    a terminal. To install a Windows program, type wine <Windows setup program>. After
    the program is set up, you can run it from a terminal window by typing wine <Windows
    executable>.


    WINE is currently in development and it has had success in running Windows programs.
    Most Windows 3x programs run without problems, but Win32 programs (Windows 9x
    and NT programs) have had mixed success. For example, Microsoft PowerPoint 2000
    is reported to work perfectly under WINE, but Microsoft Outlook does not work
    at all. For an up-to-date list of Windows programs compatible, go to http://www.wineq.com/apps/query.cgi.


    Windows emulators for Linux are not good enough for production use, although they
    are rapidly improving. Keep an eye on Wine. Core has been supporting the WINE
    project and is developing libraries that allow Windows applications to run better
    with Windows. Core is currently using WINE to port its WordPerfect Suite to Linux.
    At the rate of its current development, it will eventually be good enough to run
    most Windows programs without a problem.'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# VMware


    VMware is a program that allows a PC to run an OS inside another OS. It currently
    runs under Windows NT, Windows 2000, and Linux. This is not emulation, but a real
    session of another OS. The OS (the guest OS) runs as a separate session inside
    of the main OS (the host OS).


    When VMware is started, it opens a window that has a bootup screen. It looks like
    a PC booting up, complete with the BIOS setup (see Figure 4.1). It then boots
    into a running session of the guest OS (see Figure 4.2). This is made possible
    by the VMware virtual platform, which emulates the BIOS of a PC inside of a host
    OS. This emulation allows the installation of any PC OS on top of this virtual
    platform. If you have problems with the installation, see the section "Known Problems
    with VMware."


    Both the Linux and Windows versions of VMware install easily. Complete installation
    instructions are available at http://www.vmware.com/support/doc/ for Linux and
    http://www.vmware.com/support/win/doc/ for Windows.


    ![](img/a1ad58e4259f15e8b2826ecf57a28362_46_0.png)


    4.1 VMware creates a virtual machine inside of Windows or Linux.'
  merge: -1
  pgno: 46
