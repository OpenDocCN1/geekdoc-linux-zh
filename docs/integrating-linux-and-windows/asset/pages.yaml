    # 17.4 Secure Shell (SSH)


    # 17.4.1 What is SSH?


    Secure Shell (SSH) provides authentication and strong encryption to the remote
    commands

    in UNIX (and Linux). It consists of a server and a client. The server runs on
    the machine

    that you are connecting to and the client runs on the machine that is connecting
    to the server.

    There are free and commercial versions of SSH available for most UNIX systems
    and cli-

    ents available for all versions of Windows.


    Authentication assures that the remote computer you are connected with is really
    who

    says it is. A common way of breaking into systems is to pretend to be somebody

    Encryption ensures that the information sent between two computers cannot be read
    by

    a third party. This assures that information such as usernames and passwords cannot
    be read

    while they are being broadcast over the network.


    SSH provides a secure alternative to remote commands (rsh, login, and rexec).

    it also provides a secure channel to use for other remote programs such as X11
    and vnc.


    There are two versions of SSH: SSH1 and SSH2. SSH1 is older and runs on almost

    every operating system. It is free for non-commercial use. SSH2 is newer and has
    bet-

    terity. It is free for educational and personal use. Go to the Data Fellows

    Web site (http://www.datafellows.com) or Van Dyke Technologies Web site

    (http://www.vandyke.com) for more information on licensing and support for SSH.'
