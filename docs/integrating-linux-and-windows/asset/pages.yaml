- img_proc: true
  md: "# mangled map (S)\n\nThis is for those who want to directly map UNIX filenames\
    \ which can not be represented on Windows/DOS. The mangling of names is not always\
    \ what is needed. In particular you may have documents with file extensions that\
    \ differ between DOS and UNIX. For example, under UNIX it is common to use \"\
    .html\" for HTML files, whereas Windows/DOS \".htm\" is more commonly used.\n\n\
    So to map \"html\" to \"htm\" you would use:\n\n```\nmangled map = (*.html *.htm)\n\
    ```\n\nOne very useful case is to remove the annoying \\*:1 off the ends of filenames\
    \ on some CDROMS. To do this use a map of (*:1 *)\n\n```\nDefault: no mangled\
    \ map\n```\n\n```\nExample: mangled map = (*;1 *)\n```\n\n+   - mangled names\
    \ (S)\n\nThis controls whether non-DOS names under UNIX should be mapped to DOS-compatible\
    \ names (\"mangled\") and made visible, or whether non-DOS names should simply\
    \ be ignored.\n\nSee the section on \"NAME MANGLING\" for details on how to control\
    \ the mangling process.\nIf mangled using the mangling algorithm is as follows:\n\
    \n+   - The first (up to five) alphanumeric characters before the rightmost dot\
    \ of the filename are preserved, forced to upper case, and appear as the first\
    \ (up to five) characters of the mangled name.\n\n+   - A tilde \"~\" is appended\
    \ to the first part of the mangled name, followed by a two-character sequence,\
    \ based on the original root name (i.e., the original filename minus its final\
    \ extension). The final extension is included in the hash calculation only if\
    \ it contains any upper case or is longer than three characters.\n\nNote that\
    \ the character to use may be specified using the \"mangling char\" option, if\
    \ you don't like '~\\'.\n\n+   - The first three alphanumeric characters of the\
    \ final extension are preserved, forced to upper case and appear as the extension\
    \ of the mangled name. The final extension is defined as the part of the original\
    \ filename after the rightmost dot. If there are no dots in the filename, the\
    \ mangled name will have no extension (except in the case of \"hidden files\"\
    —see below).\n\n+   - Whose name with a dot will be presented as DOS hidden files.\
    \ The mangled name will be created for other filenames, but with the leading dot\
    \ moved and \"___\" as its extension regardless of actual original (that's three\
    \ underscores).\n\nThe two-digit hash value consists of upper case alphanumeric\
    \ characters.\n algorithm can cause name collisions only if files in a directory\
    \ share the first five alphanumeric characters. The probability of such a clash\
    \ is 1/1300."
  merge: -1
  pgno: 291
- img_proc: true
  md: 'The name mangling (if enabled) allows a file to be copied between UNIX directories
    from Windows/DOS while retaining the long UNIX filename. UNIX files can be renamed
    to a new extension from Windows/DOS and will retain the same basename. Mangled
    names do not change between sessions.


    Default: mangled names = yes

    Example: mangled names = no


    +   - mangling char (S)

    This controls what character is used as the "magic" character in name mangling.
    The default is a ''-'' but this may interfere with some software. Use this option
    to set it to whatever you prefer.


    Default: mangling char = ~

    Example: mangling char = ^


    +   - mangled stack (G)

    This parameter controls the number of mangled names that should be cached in the
    Samba server smbd.

    This stack is a list of recently mangled base names (extensions are only maintained
    if they are longer than 3 characters or contain upper case characters).

    The larger the value, the more likely it is that mangled names can be successfully
    converted to correct UNIX names. However, large stack sizes will slow most directory
    access. Smaller stacks save memory in the server (each stack element costs 256
    bytes).

    It is not possible to absolutely guarantee correct long file names, so be prepared
    for some surprises!


    Default: mangled stack = 50

    Example: mangled stack = 100


    +   - map archive (S)

    This controls whether the DOS archive attribute should be mapped to the UNIX owner
    execute bit. The DOS archive bit is set when a file has been modified since its
    last backup. One motivation for this option to keep Samba/your PC from making
    any file it touches becoming executable under UNIX. This can be quite annoying
    for shared source code, documents, etc...

    Note that the "create mask" parameter is to be set such that owner execute bit
    is not masked out (i.e. it must include 100). See the parameter "create mask"
    for details.


    Default: map archive = yes

    Example: map archive = no


    +   - map hidden (S)

    This controls whether style hidden files should be mapped to the UNIX owner execute
    bit.

    Note that the "create mask" parameter is to be set such that owner execute bit
    is not masked out (i.e. it must include 001). See the parameter "create mask"
    for details.'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# Appendix C: Samba Man Pages


    Default: map hidden = no

    Example: map hidden = no


    +   - map system (S)

    This controls whether DOS style system files should be mapped to the UNIX group
    execute bit.


    Note that this requires the "create mask" to be set such that the group execute
    bit is not masked out (i.e. it must include 010). See the parameter "create mask"
    for details.


    Default: map system = no

    Example: map system = no


    +   - map to guest (G)

    This parameter is only useful in security modes other than “security=share”—i.e.
    user, server, and domain.


    This parameter can take three different values, which tell smbd what to do with
    user login requests that do not match a valid UNIX user in some way.

    The three settings are :


    +   - “Never”—Means user login requests with an invalid password are rejected.
    This is the default.

    - “Bad User”—Means user logins with an invalid password are rejected, unless the
    username does not exist, in which case it is treated as a guest login and mapped
    into the “guest account”.

    - “Bad Password”—Means user logins with an invalid password are treated as a guest
    login and mapped into the “guest account”. Note that this can cause problems as
    it means any user incorrectly typing their password will be silently logged as
    a “guest”—and will not kn—there will have been no message given to them they got
    their password wrong. Helpdesk services will *hate* if you set the “map to guest”
    parameter this way (-


    Note that this parameter is needed to set up “Guest” shares when using security
    modes other than this. This is because in these modes of the resource being requested
    is *not* after the server has successfully authenticated the client so the server
    cannot make authentication decisions at the correct time (connection to the share)
    for “Guest” shares.


    For people familiar with the older Samba Samba maps to the old pile-time setting
    of the Guest_SESSETUP value in local.h.


    Default: map to guest = Never Example: map to guest = Bad User


    +   - max connections (S)

    This option allows the number of simultaneous connections to a service to be limited.
    If “max connections” is greater than 0 then connections will be refused if this
    number of connections to the service are already open. A value of zero mean an
    unlimited number of connections may be made.


    278'
  merge: -1
  pgno: 293
- img_proc: true
  md: 'Record lock files are used to implement this feature. The lock files will be
    stored in the directory specified by the “lock directory” option.


    **Default:** max connections = 0


    **Example:** max connections = 10


    +   - max disk size (G)

    This option allows you to put an upper limit on the apparent size of disks. If
    you set this option to 100 then all shares will appear to be not larger than 100
    MB in size.

    Note that this option does not limit the amount of data you can put on the disk.
    In the above case you could still store much than 100 MB on the disk, but if a
    client asks for the amount of free space or the total disk size then the result
    will be bounded by the amount specified in “max disk size”.

    This option is primarily useful to work around bugs in some pieces of software
    that can’t handle large disks, particularly disks over 1GB in size.


    A “max disk size” of 0 means no limit.

    **Default:** max disk size = 0

    **Example:** max disk size = 1000


    +   - max log size (G)

    This option (the integer in kilobytes) specifies the max size the log file should
    grow to. Samba periodically checks the size and if it is exceeded it will rename
    the file, adding a “.old” extension.

    A size of 0 means no limit.

    **Default:** max log size = 5000

    **Example:** max log size = 1000


    +   - max mux (G)

    This controls the maximum number of outstanding simultaneous SMB operations that
    Samba tells the client it will allow. You should never need to set this parameter.

    **Default:** max mux = 50


    +   - maxopenfiles (G)

