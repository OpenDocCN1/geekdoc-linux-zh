    Red Hat Linux uses PAM (Pluggable Authentication Modules) and the authentication
    method is specified in the /etc/pam.d files. SWAT uses the /etc/pam.d/[samba,login]
    control files.


    +   > I have RedHat 5.2 which I believe uses the egcs compiler (not sure though.)
