  md: '# THE LINUX DESKTOP


    X11 is only the basic part of the Linux desktop. You also need a window manager
    for menus, icons, and other desktop features. Unlike Windows, where you have only
    a single interface, Linux has many choices for the desktop interface (i.e., window
    managers). The most popular ones are FVWM, KDE, and Gnome, since it is a good
    choice as the other popular desktops.


    FVWM (http://www.fwwm.org/), stands for F Virtual Windows Manager. It is very
    stable and uses a relatively small amount of memory. AfterStep (http://www.afterstep.org/)
    is the variation of FVWM that is packaged with most Red Hat distributions. FVWM
    is not as friendly or as configurable as the other for low-end systems, though
    it is much smaller and faster than the others.


    If you need a light window manager, try tw. It doesn''t look pretty, but it is
    really easy on the resources (http://www.visi.com/~hawked/vwm.html).


    The K Desktop Environment (KDE) project was started in 1996 to provide a complete
    Integrated Desktop Environment (IDE) for Linux. It includes a window manager,
    file manager, help system, and utilities. It is the first program designed to
    give a modern, GUI interface to Linux. KDE is currently the default interface
    for Linux distributions (http://www.kde.org/).


    GNU Object Model Environment, or GNOME,(http://www.gnome.org/) was started because
    KDE uses the Qt Library from Troll Tech (http://www.troll.com/). The Qt Library
    is a commercial library and is not under the GNU Public License (GPL). GNOME was
    started because many people in the Linux community feared that having products
    in GPL software would endanger the GPL. While Troll Tech has allowed free use
    of the Qt Library in KDE, GNOME provides an alternative in case things change.


    That said, GNOME offers the richest, most configurable desktop currently available
    for Linux. GNOME even allows you to change window managers to change the look
    and feel of the desktop. Although the default window manager for GNOME is Enlightenment
    (http://www.enlightenment.org/), there are many other window managers available
    (http://linux-directory.com/links/pages/WindowsManagers/).


    While GNOME is more configurable than FVWM or KDE, it also uses more resources,
    making it a poor choice for low-end systems. It also has around less time than
    FVWM or KDE, so it has less chance to be debugged.'
