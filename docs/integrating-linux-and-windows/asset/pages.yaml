  md: 'smbd (8)


    # Testing the Installation


    If running the server as a daemon, execute before proceeding. If using a meta-daemon,
    either restart the system or kill restart the meta-daemon. Some versions of inetd
    reread their configuration tables if they receive a HUP signal.


    If your name''s name is "fred" and your name is "mary", you should now be able
    to connect to the service \fred.mary.


    To properly test and experiment with the server, we recommend using smbclient
    program (see smbclient (I)) and also going through the steps outlined in the file
    DIAG-NOS.txt in the docs/ directory of Samba installation.


    # Version


    This man page is correct for version 2.0 of the Samba suite.


    # Diagnostics


    Most diagnostics issued by the server are logged in a specified log file. The
    log file name is specified at compile time, but may be overridden on the command
    line.


    The number and nature of diagnostics available depends on the debug level used
    by the server. If you have problems, set the debug level to 3 and peruse the log
    files.


    Most messages are reasonably self-explanatory. Unfortunately, at the time this
    man page was created, there are too many diagnostics available in the source code
    to warrant describing each and every diagnostic. At this stage your best bet is
    to grep the source code and index the conditions that gave rise to the diagnostics
    you are seeing.


    # Signals


    Sending the smbd a SIGHUP will cause it to re-load its smb.conf configuration
    file within a short period of time.


    To shut down users smbd process it is recommended that SIGKILL (-9) NOT be used,
    as a last resort, as this may leave the memory area in an inconsistent state.
    The safe way to terminate an smbd is to send a SIGTERM (-15) signal and wait for
    it to die on its own own.


    The debug level of smbd may be raised by sending it a SIGUSR1 (kill -smbd-pid>)
    and lowered by sending it a SIGUSR2 (kill -USR2 <smbd-pid>). This allows transient
    problems to be debugged, while still running at a normally low debug level.


    Note that as the signal handlers send a debug write, they are not re-entrant in
    smbd. This should wait until smbd is in a state of waiting for an incoming smbd
    issue them. It is possible to make the signal handlers safe by un-blocking the
    signals before the select call and re-blocking them after, however this would
    affect performance.'
