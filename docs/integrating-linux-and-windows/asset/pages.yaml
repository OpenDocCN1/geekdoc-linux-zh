    \ (S)\n\nThis parameter allows readonly files to be deleted. This is not normal\
    \ DOS semantics, but is allowed by UNIX.\n\nThis option may be useful for running\
    \ applications as rcs, where UNIX ownership prevents changing file permissions,\
    \ and DOS semantics prevention deletion of a read file.\n\nDefault: delete readonly\
    \ = No\nExample: delete readonly = Yes\n\n+   - delete veto files (S)\n\nThis\
    \ option is used when Samba is attempting to delete a directory that contains\
    \ one or more directories (the 'veto files' option). If this option is set to\
    \ False (the default) then if a veto directory contains any non-veto files or\
    \ directories the directory will fail. This is what you want.\n\nIf this option\
    \ is set to True, then Samba will attempt to recursively delete any files and\
    \ directories within the veto directory. This can be useful for file serving systems\
    \ such as NetAtom, which create meta-files within directories you might normally\
    \ veto DOS/Windows users from seeing (e.g. .AppleDouble)\n\nSetting veto files\
