  md: '# smb.conf (5)


    The name of the password server is looked up using the parameter "name resolve
    order=" and may resolved by any method and order described in that parameter.


    The password server much be a machine capable of using the "LM1.2X002" or the
    "LM NT 0.12" protocol, and it must be in user level security mode.


    NOTE: Using a password server means that your UNIX box (running Samba) is only
    as secure as your password server. DO NOT CHOOSE A PASSWORD SERVER THAT YOU DON''T
    COMPLETELY TRUST.


    Never point Samba server at itself for password serving. This will cause a loop
    and lock up your Samba server!


    The name of the password server takes the standard substitutions, but probably
    the only one is % m, which means the Samba server will use the incoming client
    as the password server. If you use then you will better trust your clients, and
    better restrict them with hosts allow!


    If the "security" parameter is set to "domain", then the list of machines in this
    option must be of Primary or Backup Domain controllers for the Domain, as the
    Samba server is cryptographically in that domain, and will useographically authenticated
    RPC calls to authenticate the user logging on. The advantage of using "security=domain"
    is that if you use several hosts in the "password server" option smbd will try
    to turn it until one responds. This will work in case your password server goes
    down.


    If the "security" parameter is set to "server", then there are different restrictions
    that "security=domain" will suffer from


    +   You may list several password servers in the "password server" parameter,
    however if smbd makes a connection to a password server, and then the password
    server fails, no users will be be authenticated from this smbd. This is no restriction
    of the SMB/CIFS protocol when in "security=server" mode and cannot be fixed in
    Samba.


    +   If you are using a Windows NT as your password server then you will have to
    ensure that your users are able to login from the Samba server, as when in "security=server"
    mode the network logon will appear to come from rather than from the workstations.


    See also the "security" parameter.


    Default: password server = <empty string>

    Example: password server = NT-PDC, NT-BDC1, NT-BDC2


