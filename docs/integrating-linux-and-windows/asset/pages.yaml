    Samba 2.x and PAM (especially FreeBSD)

    amba 2.x detects whether your OS has PAM (Pluggable Authentication Module) support
    at compile time and uses it if it is available. This leads to a problem on systems
    that have PAM support in the libraries where PAM is not configured. “sleeping”
    PAM implementations cause all unix password authentication attempts to fail.


    We have fixed this for the next release of Samba (version 2.0.4) by adding a—with—pam
    config option. If you don''t use that then PAM won''t be used.


    # System Error 1240


    System error 1240 means that the client is refusing to talk to a non-encrypting
    server. Microsoft changed WinNT in service pack 3 to refuse to connect to servers
    that do not support SMB password encryption.


    +   There are two main solutions:

    1. enable SMB password encryption in Samba. See ENCRYPTION.txt in the Samba docs

    2. disable this new behaviour in NT. See WinNT.txt in the Samba docs


