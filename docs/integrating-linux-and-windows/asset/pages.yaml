  md: '# Lmhosts (5)


    # Samba


    # 23 Oct 1998


    # Name


    Lmhosts—The Samba NetBIOS hosts file


    # Synopsis


    Lmhosts is the Samba NetBIOS name to IP address mapping file.


    # Description


    This file is part of the Samba suite.

    Lmhosts is the Samba NetBIOS name to IP address mapping file. It is very similar
    to the /etc/hosts file format, except that the hostname component must correspond
    to the NetBIOS naming format.


    # File Format


    It is an ASCII file containing one line for NetBIOS name. The two fields on each
    line are separated from each other by white space. Any entry beginning with #
    is ignored. Each line in the Lmhosts file contains the following information :


    +   * IP Address—in decimal format.

    * NetBIOS Name—This name format is a maximum fifteen character host name, with
    an optional trailing ''#'' character followed by the NetBIOS name type as two
    hexadecimal digits.

    * If the trailing ''#'' is omitted then the given IP address will be returned
    for all names that match the given name, whatever the NetBIOS name type in the
    lookup.


    ```

    192.9.200.1 TESTPC

    192.9.200.20 NTSSERVER#20

    192.9.200.21 SAMBASERVER

    ```'
  merge: -1
