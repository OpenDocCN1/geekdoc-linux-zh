  md: '# Chapter 5 • Internet Applications


    Once we have determined what ports we have open, we need to close the ports that
    are unused. The first place to check is the file /etc/inetd.conf. This file contains
    many of the standard UNIX services such as FTP, telnet, POP, and finger. If you
    need any other computers to attach to your computer through any of these services,
    turn them off by putting a # in front of the service:


    ```

    #ftpstreamtpcnowaitrootusr/sbin/tcpdini.ftpd -1 -a

    #telnet stream tcp nowait root /usr/sbin/tcpdini.telnet

    ```


    If you have any questions about what a service does, consult the man page. For
    example, to find out what FTP does, type man ftp at the command prompt. If you
    really need any of these services, Secure Shell (SSH) provides better security.
    See the chapter on SSH. Most other services are started in the directories under
    /etc/rc.d. This directory has subdirectories:


    ```

    [root@mmcune rc.d]# ls

    init.d/ rc.firewall rc.sysinit* rc1.d/ rc3.d/ rc5.d/

    rc* rc.local* rc0.d/ rc2.d/ rc4.d/ rc6.d/

    ```


    The subdirectory depends on the run level. To determine the run level, type run-level:


    ```

    [root@mmcune rc.d]# runlevel

    N 5

    ```


    In this example, we use run level 5, so the subdirectory would be rc5.d. The contents
    of rc5.d would look like this:


    ```

    [root@mmcune rc5.d]# ls

    K20statd@ K42ecd@ K80nscd@ K99sendmail@ S40atd

    S91local@nK20users@ K50nms@ K87tybind@ S05kaddu@ S40crond@nK20rowhd@ K52apmd@
    K93portmap@ S10network@ S60lpd@nK23inet@ K55rooted@ K96pcmelia@ S20random@ S75keytable@

    K27ircd@ K67ilinuxconf@ K97samb@ S25netfs@ S85ound@nK35usb@ K73jwebweited@ K98nfslock@
    S30syslog@ S90xifs

    ```


    The first letter represents killed or started. Only files with "s" are loaded.
    The number represents the order in which the files are loaded. The lower the number,
    the sooner it is loaded. Some services must be started before others. For example,
    network must be started before netfs.


    Last is the name of the service. If you want to know what a service does, use
    the man page again. To turn a service off, change the first letter to "s". For
    example, to turn off atd, type:


    ```

    mv S40atd K40atd

    ```


    Always keep syslog, since it is used by the system. Also, xfs is used by X11,
    so if you use X11, keep xfs.'
  merge: -1
