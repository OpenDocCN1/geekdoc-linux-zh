    # 1.6.3 FIPS


    Compared to many other programs, FIPS has few command-line switches. Those it
    has are listed below:


    +   -t or --test—This doesn''t write anything to disk.

    - -d or --debug—This will write errors to the file FIPSINFO.DBG. It can help in
    diagnosing problems.

    - -h or --help or ?-The help text.

    - -n<num>—The drive number to split.


    # 1.6.4 Restrictions of FIPS


    There are some restrictions on what you can do with FIPS. The first is that your
    hard drive must support INT 13 for low-level disk access. There are few older
    Adaptec drive controllers that do not support INT 12, but almost all other drives
    do, including new Adaptec drivers.


    FIPS also will not work with FAT12. FAT12 is used on partitions that are smaller
    than 10 MB. This shouldn''t cause any problems unless it would be useless to split
    a 10 MB partition anyway.


    You can only split standard FAT and FAT32 partitions. FIPS will not work on extended
    partitions, NTFS, HPFS (Os2 filesystem), Linux, or any other non-FAT partition.'
