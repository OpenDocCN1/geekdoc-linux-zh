    ```


    You may have to change the path of the tcpd if it is not located in /usr/sbin.
    Linux uses regular user accounts to handle FTP logins. If you want, you can create
    a special account and directory for FTP access.


    You can also restrict access by only allowing hosts to access remote services
    via the hosts.allow and hosts.deny files. These are simple text files with a list
    of host names that can be used to restrict remote services that are started in
    the inetd, like FTP and telnet.


    hosts.allow is a list of hosts allowed to connect and host.deny is a list of hosts
    denied'
