  md: 'smb.conf (5)


    You can also specify hosts by network/netmask pairs and by regexp names if your
    system supports netgroups. The EXCEPT keyword can also be used to limit a wildcard
    list. The following examples provide some help:


    Example 1: allow localhost and all IPs in 150.203.\*,* except one


    hosts allow = localhost, 150.203. EXCEPT 150.203.666


    Example 2: allow localhost and hosts that match the given network/netmask


    hosts allow = localhost, 150.203.15.0/255.255.255.0


    Example 3: allow localhost, plus a couple of hosts


    hosts allow = localhost, lapland, arvidsjaur


    Example 4: allow only hosts in NIS group "foonet" or localhost, deny access from
    one particular part


    hosts allow = @foonet, localhost hosts deny = pirate


    Note that access still requires user-level passwords.

    Testparm for the way of testing your host access to see if it does what you expect.


    Default: none (i.e., all hosts permitted access)

    Example: allow hosts = 150.203.5. localhost host.mynet.edu


    +   - alternate permissions (S)


    This is a deprecated parameter. It no longer has any effect in Samba2.0. In previous
    versions of Samba it affected the way the DOS "read only" attribute was mapped
    for a file. In Samba2.0 a file is marked "read only" if the UNIX file does not
    have the ''w'' bit set for the owner of the file, regardless of if the owner is
    the currently logged on or not.


    +   - announce (G)


    This specifies what type of server nmbd will announce itself, to a network browse
    list. By default this is set to Windows NT. The valid options are: "NT", "Win95"
    or "WFW" meaning Windows NT, 95 and 98 for Workgroups respectively. Do not change
    this parameter unless you have a specific need to stop Samba appearing as an NT
    server as this may prevent Samba servers from participating as browser servers.


    Default: announce as = NT

    Example announce as = Win95'
