- img_proc: true
  md: '# 12.2 How Samba Works


    Samba can perform almost all of the functions of Microsoft Window NT Server. So,
    when is Samba a good choice for a Windows network?


    While Samba does support most the functions of a Windows Primary Domain Controller
    (PDC), Backup Domain Controller (BDC) functions are not supported. The only way
    to fully implement BDC is to use Windows NT.


    Also, if you already have a Microsoft WINS server, Samba cannot exchange data
    with it. So you already have a Microsoft WINS server and need to add another,
    stick with Windows NT.


    Both of these problems may soon be solved by Lightweight Directory Access Protocol
    (LDAP), which, among other things, allows one login for all a network''s resources.
    Both Microsoft and the Linux community are developing LDAP functionality into
    their products. For more information on LDAP, see http://www.ldap.org.


    So why would someone use Samba on a Windows network? Samba combined with Linux
    is fast, stable, and best of all, free. Windows NT charges per user, with a ten-user
    version of them run on lesser hardware. It''s not enough to set up Linux and Samba
    on an old 486 or low-end Pentium. This is more than enough to run a small, departmental
    server, while a Windows NT server would require a much better computer to run
    properly.


    Samba is also a good choice for a mixed UNIX and Windows environment. Since Linux
    has all the standard UNIX networking tools included with it, Samba on a Linux
    server can communicate transparently with both UNIX and Windows.


    With the introduction to Samba out of the way, the next chapter will cover how
    to set up Samba as a file server.'
