  md: '# CHAPTER

    12


    # # INTRODUCTION TO SAMBA


    # ## 12.1 How Samba Started


    Samba is a set of programs that allow non-Windows machines to use Server Message
    Block (SMB) networking, which is the native networking protocol of Microsoft products
    such as Windows 98 and NT. Samba was started by Australian graduate student Andrew
    Triddell, needed a way to share files between his UNIX machine and a DOS PC.


    He could have used UNIX''s native networking, Network File Services (NFS, is discussed
    later), but he already had running NetBIOS on the DOS PC. Since he couldn''t load
    NetBIOS and NFS at the same time under, he decided to reverse-engineer SMB and
    implement it on his UNIX machine, making his UNIX machine like a PC server to
    the DOS PC.


    He released his code on the Internet in 1992. After a few bug fixes, he put the
    project aside. Then, a few years later, he needed to link his Linux PC with his
    wife''s Windows PC. Having no other choice, he tried his old code and, and to
    his surprise, it worked.


    Doing a little research, Andrew discovered that NetBIOS and SMB were at least
    minimally documented. As he worked to improve his program, he tried to think of
    a name for it. He entered "SMB" into a spell checker and the first word that came
    up "Samba." As its use grew, Samba gathered a whole team of programmers. It is
    bundled with most distributions of Linux and many commercial versions of UNIX,
    such as SGI''s (Silicon Graphics Inc.) IRIX.


    Besides UNIX, there are also versions of Samba for MVS, MMS, OS/2, Stratus-OS,
    Amiga, and PE/IX. Samba has grown into a complete set of tools that implement
    most of the PC and print sharing features of a Windows NT Server.


    Like Linux, Samba is under the GNU Public License (GPL). This means that the programs
    and source code are free to use and modify. The only stipulation is that any improvements
    and fixes to the program must be released back to the public. With millions of
    users worldwide, both Linux and Samba are improving rapidly due to the feedback
    and code improvements of many users.'
  merge: -1
