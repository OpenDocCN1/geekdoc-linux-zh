    +   * veto files(S)


    This is a list of files and directories that are neither visible nor accessible.
    Each entry in

    t list must be separated by a ''/'', which allows spaces to be included in the
    entry. ''*''

    and ''?'' can be used to specify multiple files or directories in DOS wildcards.


    Each entry must be a unix path, not a DOS path and *not* include the unix direc-

