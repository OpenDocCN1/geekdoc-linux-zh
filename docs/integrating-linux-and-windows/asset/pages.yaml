  md: '# 5.5 Email


    Netscape also has a graphical mail program bundled with its Netscape Communicator,
    which is bundled with most distributions of Linux. More information on it and
    the Windows version are available at www.netscape.com.


    Star Office also includes a mail program. Both the Linux and Windows versions
    are available from Sun (www.sun.com/staroffice). A word of warning: This is a
    large download.


    Since it is the default mail program for Windows, Outlook deserves a mention also.
    It comes in two flavors: Outlook and Outlook Express. The main difference between
    the two is that Outlook has some extra features such as the ability to manage
    multiple mailboxes.


    Both versions of Outlook support all the standard Internet mail features as well
    as the features of Microsoft''s Exchange Server. Outlook can be used as a client
    for any standard mail server or the Microsoft Exchange Server. The Exchange Server
    uses proprietary protocols to manage mail, calendaring, and global address lists.
    The Exchange Server is discussed in the next section on mail servers. For more
    information, refer to www.microsoft.com.


    # 5.5.2 Mail Servers


    There are two types of mail used in use today: Internet mail and collaborative
    mail. Internet mail supports MSTP, POP3, IMAP, and MIME. Collaborative mail supports
    all the Internet mail standards plus added features as shared files, directories,
    and shared calendars.


    **Internet Mail Servers.** Sendmail is the most used Mail Transport (MTA) for
    the Internet. It is popular because it is configurable, but it is also difficult
    to set up because it is so configurable. It is open source and available for Linux,
    Windows, and many other operating systems. There is also a commercial version
    that includes support and configuration tools to make the job easier (see www.sendmail.org).


    While it would take an entire book to cover the configuration of Sendmail, there
    are many ways to avoid the pain of configuration. The main configuration file
    for Sendmail is /etc/sendmail.cf. Writing this file from scratch would be next
    to impossible. It is best to find a sample sendmail.cf that is close to your needs
    and edit the file. There is also a macro file, sendmail.mc, included with Sendmail
    that can be used to create the sendmail.cf. Once sendmail.mc is edited to your
    needs, create a sendmail.cf with the following command:


    ```

    m4 /etc/sendmail.mc > /etc/sendmail.cf

    ```


    Many of the features of Sendmail are not even used by most users. For example,
    Sendmail has features for uccp and BitNet, which are older Internet mail systems
    that aren''t used anymore. Extensive documentation on Sendmail is available on
    their Web site www.sendmail.org.


    Qmail is another popular MTA. It is much easier to configure than Sendmail, but
    with that comes less maturity. Sendmail has been in use since 1979, while Qmail
    1.0 was released in 1997. Like Sendmail, it is free and open source. For the program
    and information on Qmail, go to http://www.qmail.org/


    Postfix is another popular MTA. Many users swear by its speed and security (http://www.postfix.cs.uu.nl/).'
  merge: -1
