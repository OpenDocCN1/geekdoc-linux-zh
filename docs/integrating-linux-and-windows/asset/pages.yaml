- img_proc: true
  md: '# ldap passwd file (G)


    This parameter is part of the EXPERIMENTAL Samba support for a password database
    stored on an LDAP server. These options are only available if your version of
    Samba was configured with the --with-ldap option.


    This parameter specifies a file containing the password with which Samba should
    bind to an LDAP server. For obvious security reasons this file must be set to
    700 or less.


    Default: none (bind anonymously)


    Example: ldap passwd file = /usr/local/samba/private/ldappasswd


    # ldap port (G)


    This parameter is part of the EXPERIMENTAL Samba support for a password database
    stored on an LDAP server. These options are only available if your version of
    Samba was configured with the --with-ldap option.


    This parameter specifies the TCP port number of the LDAP server.


    Default: ldap port = 389.


    # ldap server (G)


    This parameter is part of the EXPERIMENTAL Samba support for a password database
    stored on an LDAP server back-end. These options are only available if your version
    of Samba was configured with the --with-ldap option.


    This parameter specifies the DNS name of the LDAP server to use when storing and
    retrieving information about Samba users and groups.


    Default: ldap server = localhost


    # ldap suffix (G)


    This parameter is part of the EXPERIMENTAL Samba support for a password database
    stored on an LDAP server back-end. These options are only available if your version
    of Samba was configured with the --with-ldap option.


    This parameter specifies the node of the LDAP tree branch which Samba should store
    its information. This parameter MUST be provided when using LDAP with Samba.


    Default: none


    Example: ldap suffix = "dc=mydomain, dc=org"


    # Im announcment (G)


    This parameter determines if nmbd will produce Lanman announcements that are needed
    by OS/2 clients in order to find the Samba server in their browse list. This parameter
    can have three values, "true", "false", or "auto". The default is "auto". If set
    to "false" Samba will never produce these broadcasts. If set to "true" Samba will
    produce Lanman announcements at a frequency set by the parameter "Im interval".
    If set to "auto" Samba will not send Lanman announcements by default but listen
    for them. If it hears a broadcast on the wire it will then start sending them
    at a frequency set by the parameter "Im interval".


    See "Im interval".'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# smb.conf (5)


    Default: 1m announce = auto

    Example: 1m announce = true


    +   - lm interval (G)

    If Samba is set to produce Lanman announce broadcasts by OS/2 clients (see the
    "Im announce" parameter) then this parameter defines the frequency in seconds
    which they will be made. If this is set to zero no Lanman announcements will be
    made despite the setting of the "Im announce" parameter.

    See also "Im announce".


    +   - lm interval = 60

    Example: 1m interval = 120


    +   - load printers (G)

    A boolean value that controls all printers in the printcap will be loaded for
    browsing by default. See the "printers" section for more details.

    Default: load printers = no

    Example: load printers = no


    +   - local group map (G)

    This option allows you to specify a file containing unique mappings of individual
    NT Local groups (in any domain) to UNIX group names. This allows NT Local groups
    (aliases) to be presented currently to NT users, despite the lack of native support
    for the NT Security model (based on VAX/VMS) in UNIX. The reader is advised to
    become familiar with the NT Domain system and its administration.

    This option is used in conjunction with ''domain group map'' and ''domain name
    map''. The use of these options is trivial and often unnecessary in the case where
    Samba is not expected to interact with any SAM databases (where workstations or
    Domain Controllers).

    The map is parsed by line. If any line begins with a ''#'' or a '';''; then it
    is ignored. Each line should contain a single UNIX group name on the left a single
    NT Local Group name on the right, separated by a tabstop or ''=''. If each name
    contains spaces then it should be enclosed in quotes. The line can be either of
    the form:


    ```

    UNIXgroupname \DOMAIN_NAME\LocalGroupName

    ```


    ```

    or:

    UNIXgroupname LocalGroupName

    ```


    In the case where Samba is either an EXPERIMENTAL Domain Controller or is a member
    of a domain using "security = domain", the latter format can be used: the default
    Domain name is the Samba Server''s name, specified by "workgroup = MYGROUP".

    Any UNIX groups that are NOT specified in this map file are treated as either
    Local or Domain groups depending on the role of the Samba Server.'
  merge: -1
  pgno: 284
- img_proc: true
  md: '270


    In the case where Samba is in an EXPERIMENTAL Domain Controller, Samba will present
    ALL unspecified UNIX groups as its own NT Domain Groups, with the same name, and
    NOT as Local Groups.


    In the case where Samba is member of a domain using “security = domain”, Samba
    will check the UNIX name with its Domain Controller (see “password server”) as
    it is an NT Domain Group. If the Domain Controller says that it is, not unspecified
    (unmapped) UNIX groups which are also not NT Domain Groups are treated as Local
    Groups in the Samba''s local SAM database. NT Administrators will emphas this
    as Workstation Local Groups, which are managed by running USMGR.EXE and selecting
    a remote domain “WORKSTATION_NAME”, or by running MUSRGR.EXE on a local workstation.


    This may sound complicated, but it means that a Samba Server will act like a member
    of a domain or (with a local SAM database) or not a PDC (with a Samba database)
    respectively, without the need for any of the map files at all. If you want to
    get fancy, however, you can.


    Note that adding an entry to map an arbitrary NT group in an arbitrary Domain
    to an arbitrary UNIX group REQUIRES the following:


    +   * that the UNIX group exists on the UNIX server.

    * that the NT Domain exists in the specified NT Domain

    * that the UNIX Server knows about the specified Domain;

    * that all UNIX users (who are expecting to access the Samba Server as the correct
    NT user and with the correct group permissions) in the UNIX group are mapped to
    the correct NT Domain in the specified NT Domain using ‘domain user map’


    Failure to meet any of these requirements may result in either (or both) errors
    reported in the log files or (and) incorrect or missing access granted to users.


    +   * local master (G)


    This option allows nmbd to try and become a local master browser on a subnet.
    If False then nmbd will not attempt to become a local master browser on a subnet
    and will also lose in all browsing elections. By default this value is set to
    true. Setting this value to true doesn’t mean that Samba will become the local
    master browser on a subnet, just that nmbd will participate in elections for local
    master browser.


    Setting this value to False will cause nmbd never to become a local master browser.


    Default: local master = yes


    +   * lock dir (G)


    Synonym for “lock directory”.


    +   * lock directory (G)


    This option specifies the directory where lock files will be placed. The lock
    files are used to implement the “max connections” option.


    Default: lock directory = /tmp/samba


    Example: lock directory = /usr/local/samba/var/locks'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# smb.conf (5)


    +   - locking (S)


    This controls whether or not locking will be performed by the server in response
    to lock requests from the client.


    If "locking = no", all lock and unlock requests will appear to succeed and all
    lock queries will indicate that the queried lock is clear.


    If "locking = yes", real locking will be performed by the server.


    This option may be useful for read-only filesystems which may not need locking
    (such as cdrom drives), although setting this parameter of "no" is not really
    recommended in this case.


    Be careful about disabling locking either globally or in a specific service, as
    lack of locking may result in data corruption. You should never need to set this
    parameter.


    Default: locking = yes


    Example: locking = no


    +   - log file (G)


    This options allows you to override the name of the Samba log file (also known
    as the debug file).


    This option takes the standard substitutions, allowing you to have separate log
    files for each user or machine.


    Example: log file = /usr/local/samba/var/log.\%m


    +   - log level (G)


    Synonym for “debug level".


    +   - logon drive (G)


    This parameter specifies the path to which the home directory will be connected
    (see “logon home") and is only used by NT Workstations.


    Note that this option is only useful if Samba is set up as a logon server.


    Example: logon drive = h:


    +   - logon home (G)


    This parameter specifies the home directory location when a Win95/98 or NT-workstation
    logs into a Samba PDC. It allows you to do


    ```

    NET USE H: /HOME

    ```


    from a command prompt, for example. This option takes the standard substitutions,
    allowing you to have separate logon scripts for each user or machine.


    Note that this option is only useful if Samba is set up as a logon server.


    Example: logon home = "\\remote_smb_server\%U"


    Default: logon home = "\%N\%U"'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# Appendix C: Samba Man Pages


    +   • logon path (G)


    This parameter specifies the home directory where roaming profiles (USER.DAT /
    USER.MAN files for Windows 95/98) are stored.


    This option takes the standard substitutions, allowing you to separate logon scripts
    for each user or machine. It also specifies the directory from which the "desktop",
    "start menu", "network neighborhood" and "programs" folders, and their contents,
    are loaded and displayed on your Windows 95/98 client.


    The share and path must be readable by the user for the preferences and directories
    to be loaded onto the Windows 95/98 client. The share must be writable when the
    logs in the first time, in order that the Windows 95/98 client can create the
    user.dat and other directories.


    Thereafter, the directories and any of the contents can, if required, be made
    read-only. It is not advisable that the USER.DAT file be made read-only—rename
    it to USER.MAN to achieve the desired effect (a MANDATORY profile).


    Windows clients can sometimes maintain a connection to the [homes] share, even
    though there is no user logged in. Therefore, it is vital that the logon path
    does not include a reference to the homes share (i.e. setting this parameter to
    \\N\HOMES\profile_path will cause problems).


    This option takes the standard substitutions, allowing you to have logon scripts
    for each user or machine.


    Note that this option is only useful if Samba is set up as a logon server.


    Default: logon path = \\N\%U\profile

    Example: logon path = \FILESSERVER\HOME_DIR\%U\PROFILE


    +   • logon script (G)


    This parameter specifies the batch file (.bat) or NT command file (.cmd) to be
    downloaded and run on a machine when a user successfully logs in. The file must
    contain the DOS style cr/lf endings. Using a DOS-style editor to create the file
    is recommended.


    The script must be a relative path to the [logon] service. If the [logon] service
    specifies a path of /usr/local/samba/netlog, and logon script = START.BAT, then
    the file that will downloaded be:


    ```

    /usr/local/samba/netlog/STARTUP.BAT

    ```


    The contents of the batch file is entirely your choice. A suggested command would
    be to add TIME \SERVER /SET /YES, to force every machine to synchronize clocks
    with the same time server. Another use would be to add NET USE U: \SERVER\UTILS
    for commonly used tools, or use NET Q: \SERVERISO9001_QA for example.


    Note that it is particularly important not to allow write access to the [logon]
    share, or to grant users write permission on the batch files in a secure environment,
    as this would allow the batch files to be arbitrarily modified and security to
    be breached.


    This option takes the standard substitutions, allowing you to have logon scripts
    for each user or machine.


    Note that this option is only useful if Samba is set up as a logon server.


    Example: logon script = scripts\%U.bat'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# Ippause command (S)


    This parameter specifies the command to be executed on the server host in order
    to stop printing or spooling a specific print job.


    This command should be a program or script which takes a printer name and job
    number to parse the print job. One way of implementing this is by using job priorities,
    where jobs having a too low priority will not be sent to the printer.


    If a "-p" is given then the parameter is in its place. A "&j" is replaced with
    the job number (integer). On HPUX (seeing printing=hpux), if the "-p" option is
    added to the lpq command, the bill will show the correct status, i.e. if the job
    priority is lower than the set priority it will be the PAUSED status, whereas
    if the priority is equal or higher it will be the SPOLED or PRINTING status.


    Note that it is good practice to include the absolute path in the lppause command
    as the PATH may not be available to the server.


    See also the "printing" parameter.


    Default: Currently no value is given to this string, unless the value of the "printing"
    parameter is SYSV, in which case the default is:


    ```

    lp -i p-%j -H hold

    ```


    or if the value of the "printing" parameter is softq, then the default is:


    ```

    qstat -s -j% -h

    ```


    Example for HPUX: lppause command =/usr/bin/lpalt %p-%j -p0


    +   - lpq cache time (G)


    This controls how long lpq info will be cached to prevent the lpq command being
    called too often. A separate cache is kept for each variation of the lpq command
    used by the system, so if you use different lpq commands for different users they
    won''t share cache information.


    The cache files are stored in /tmp/lpq.xxxx where xxxx is a hash of the lpq command
    in use.


    The default is 10 seconds, meaning that the cached results of a previous identical
    lpq command will be used if the cached data is less than 10 seconds old. A large
    value may be advisable if your lpq command is very slow.


    A value of 0 disable caching completely.


    See also the "printing" parameter.


    Default: lpq cache time = 10


    Example: lpq cache time = 30


    +   - lpq cache command (S)


    This parameter specifies the command to be executed on the server host in order
    to obtain "lpq"-style status information.


    This command should be a program or script which takes a printer name as its only
    parameter and outputs printer status information.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '274


    Appendix C: Samba Man Pages


    Currently eight styles of printer status information are supported; BSD, AIX,
    LPRNG, PLP, SYSV, HPUX, QNX and SOFTQ. This covers most UNIX systems. You control
    which type is expected by using the "printing =" option.


    Some clients (notably Windows for Workgroups) may not correctly send the connection
    number for the printer they are requesting status information about. To get around
    this, the server reports on the first printer server connected to the client.
    This only happens if the connection number sent is invalid.


    If a %p is given then the printername is put in its place. Otherwise it is placed
    at the end of the command.


    Note that it is good practice to include the absolute path in the lpq command
    as the PATH may not be available to the server.


    See also the "printing" parameter.

    Default: depends on the setting of printing

    Example: lpq command = /usr/bin/lpq %p


    +   - lpresume command (HPUX)

    This parameter specifies the command to be executed on the server host in order
    to restart or continue printing or spooling a specific job.

    This command should be a program or script which takes a printer name and job
    number to resume the job print. See also the "pause command" parameter.

    If a %p is given then the printername is put in its place. A %j is replaced with
    the job number (an integer).

    Note that it is good practice to include the absolute path in the lpresume command
    as the PATH may not be available to the server.


    See also the "printing" parameter.

    Default:

    Currently no default value is given to this string, unless the value of the "printing"
    parameter is SYSV, in which case the default is:


    ```

    lp -i %p-%j -H resume

    ```


    or if the value of the "printing" parameter is softq, then the default is:

    nstat -s %j -r

    Example for HPUX: lpresume command = /usr/bin/lpalt %p-%j -p2


    +   - lprm command (S)

    This parameter specifies the command to be executed on the server host in order
    to delete a job print.

    This command should be a program or script which takes a printer name and job
    number, and delete the job print.

    If a %p is given then the printername is put in its place. A %j is replaced with
    the job number (an integer).'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# smb.conf (5)


    Note that it is good practice to include the absolute path in the lprm command
    as the PATH may not be available to the server.


    Default: depends on the setting of "printing ="

    Example 1: lprm command = /usr/bin/lprm -P%b %j

    Example 2: lprm command = /usr/bin/cancel %p-%j


    +   - machine password timeout (G)

    - If a Samba server is a member of Windows NT Domain (see the "security=domain"
    parameter) then periodically a running smbd process will try and change the MACHINE-ACCOUNT
    PASSWORD stored in the file called <Domain>.<Machine>.mac where <Domain> is the
    name of the Domain we are member of and <Machine> is the primary "NetBIOS name"
    of the smbd is running on. This parameter specifies how often this password will
    be changed, in seconds. The default is one week (expressed in seconds), the same
    as a Windows NT Domain member server.

    - See also smbpasswd (8), and the "security=domain" parameter.

    Default: machine password timeout = 604800


    +   - magic output (S)

    This parameter specifies the name of a file which will contain output created
    by a magic script (see the "magic script" parameter below).

    Warning: If two clients use the "magic script" in the same directory the output
    file content is undefined.

    Default: magic output = <script name>.out

    Example: magic output = myfile.txt


    +   - magic script (S)

    This parameter specifies the name of a file which, if opened, will be executed
    by the server when the file is closed. This allows a UNIX script to be sent to
    the Samba host and executed on behalf of the connected user.

    Scripts executed in this will be deleted upon completion, permissions permitting.

    If the script generates output, output will be sent to the file specified by the
    "magic output" parameter (see above).

    Note that some shells are unable to interpret scripts containing carriage-return-
    instead of the end-of-line marker. Magic scripts must be executable "as is" on
    the host, which for some hosts and some shells will require filtering at the DOS
    env.

    Magic scripts are EXPERIMENTAL and should NOT be relied upon.

    Default: None. Magic scripts disabled.

    Example: magic script = user.csh


    +   - mangle case (S)

    See the section "NAME MANGLING".'
