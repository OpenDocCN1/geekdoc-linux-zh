  md: '# Web Browsers


    specific functions such as ActiveX and VBScript, which offer similar functionality
    to Java and JavaScript. The main difference is that ActiveX and VBScript are specific
    to the Windows platform, whereas Java and Java Script are cross-platform.


    Opera is another popular browser for Windows. It supports all the major standards
    and is still small and fast. It will run on a 386 with 8 MB of RAM. There is also
    a Linux version in the works. Unlike other browsers, Opera is not free; it costs
    $35 (http://www.opera.com/).


    # 5.4.3 Up-and-coming Browsers


    There are two open source browsers that are poised to give the other browsers
    a run for their money: KFM and Mozilla. KFM is the file manager for the graphical
    interface KDE. Its type in the URL in the location window of KFM and will load
    a Web page. It doesn''t support all of the major standards, but it is being rapidly
    improved (www.kde.org).


    Mozilla is the open source version of Netscape''s browser. It was originally started
    when Netscape opened up the source code to its browser in early 1998. What started
    as bug fixes turned into a complete rewrite of the Netscape rendering engine.
    Mozilla is noticeably faster than the Netscape browser and it is becoming more
    stable as development continues. It is scheduled to eventually replace the Netscape
    browser when it becomes stable enough (www.mozilla.org).


    # 5.4.4 Browser Plugins


    Browser plugins are programs that add extra functions such as sound and animation
    to browsers. Almost all plugins are available for the Windows versions of Internet
    Explorer and Netscape. The choice of plugins for Linux is much more limited. Currently,
    Netscape is the only Linux browser that supports plugins. The plugins supported
    by Netscape for Linux are:


    +   * Real Player—Streaming audio and video. See the section on streaming later
    in this chapter.

    * Cult3D—A 3-D viewer.

    * DjVu—A document viewer.

    * Flash Player—A viewer for vector graphics and animation.

    * Gig—Renders data-driven, interactive graphics.

    * Hypercosm3D—Renders 3-D computer graphics.

    * MPEGTV—Plays MPEG video.

    * Plagger—Displays inline pictures, sound, and video.

    * TANGO Interactive—An interactive, multimedia, collaborative tool.

    * Tcl/Tk—A scripting tool.

    * Ump—MIDI audio files.

    * X11R6.3 Remote Execution—Allows an X11 application to be embedded into a page.

    * XVIEW—A picture viewer.'
