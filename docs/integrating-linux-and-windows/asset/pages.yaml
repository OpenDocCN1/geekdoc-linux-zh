- img_proc: true
  md: '# nmbd


    231


    Contains three IP to NetBIOS name mappings. The first and third will be returned
    for any queries for the names "TESTPC" and "SAMBASERVER" respectively, whatever
    the type component of the NetBIOS name requested.

    The second mapping will be returned only when the "0x20" name type for a "NTSERVER"
    is queried. Any other name type will not be resolved.

    The default location of the lmhosts file is in the same directory as the smb.conf
    file.


    # Version


    This man page is correct for version 2.0 of the Samba suite.


