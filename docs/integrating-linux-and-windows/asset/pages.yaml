    You should point all at wins server if you have a multi-subnetted network.

    NOTE. You need to set up Samba to a WINS server if you have multiple subnets and
    cross-subnet browsing to work correctly.


    See the documentation file BROWSING.txt in the docs/ directory of your Samba distribution.


