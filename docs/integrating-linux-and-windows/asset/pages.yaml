  md: '# Chapter 1 • Having Linux and Windows on the Same


    Windows NT and 2000 don''t use fdisk. They have their own partitioning program
    called Disk Administrator. During the install, you are asked how to make the partition.
    By default, the partition will will be the entire drive. NT partitions are limited
    to 4GB on the boot partition and 7.5GB on all partitions. Windows 2000 doesn''t
    have this limitation.


    Once there is free space on the drive, install Linux on the free space. If Linux
    and NT are on the same drive, you will want to use NT as the boot loader and install
    LILO in the Linux partition. Most distributions allow you to specify where to
    install the boot loader. See your distribution''s documentation and help files
    for information on this.


    If you have Linux and NT on separate drives, you can use LILO. See the section
    below titled "LILO Using".


    Before we start making the NTFS partition, we need to download BootPart by G.
    Volant. This program can create and manipulate NTFS boot sectors. Go to http://www.winimage.com/bootpart.htm.


    # 1.6.8 Using NT''s Boot Loader


    The process for Windows NT is different than Windows 3x/9x. The main difference
    we to be concerned with that Windows NT uses a file instead of the partition''s
    boot record to load the operating system. This means that we will have to make
    a boot file for Linux if we want to use Windows NT''s boot loader to load.


    To create a Linux boot file, we need to copy the sector of the Linux partition
    to a file. To do this, from a Linux rescue diskette and use dd to copy the boot
    sector to a file. If you don''t have a rescue diskette, you can create one in
    Windows by running the program rewrite.exe, which can be found in the \dosutils
    directory on a Linux installation CD-ROM. Once the program is open, choose the
    Write option, and then choose the rescue.img file in the \images directory on
    the Linux installation CD-ROM (Figure 1.3).


    ![](img/a1ad58e4259f15e8b2826ecf57a28362_31_0.png)


    Figure 1.3 Use RawWrite on your Linux installation CD-ROM to copy the rescue image
    to the A: drive.'
