  md: '# Secure Shell (SSH)


    181


    machine mmcuna using the root account, type scp -p /root/test.file root@mmc-c/Hlt4720001731t_Hlt4720001731/test.file.
    We can use this command to save the attributes of the file.


    The clients for SSH2 are identical to the SSH1 clients except that they have a
    “2” at the end. The equivalents of ssh, ssh, and scp are ssh2, ssh2, and sc2,
    respectively. The basic commands are the same, but some of the advanced commands
    are different. Unless you have both SSH1 and SSH2 installed, SSH2 will create
    a symbolic link between the SSH commands so that you will run the SSH2 equivalent
    see the main pages for the commands.


    SSH2 also includes a secure version of FTP called sftp. This allows a secure session
    between the FTP server and FTP client. The basic syntax of sftp is the same as
    that of regular FTP. For more advanced commands, see the man page.


    # 17.4.8 Running Other Services over SSH


    Backups and Updates. Backups that rsh should work normally. Just change the backup
    script to use ssh instead of rsh. There is also a backup utility called datbkr
    uses SSH at http://www.psychosis.com/databkr.


    rdist also be made to run with SSH. rdist is a program that allows programs and
    data on UNIX machines to be updated through the network.


    To get rdist to work with SSH, you use ssh instead of rsh or simply use the -p
    option to change the shell used by rdist. If you are using password authentication
    with rdist version 6.12 to 6.15 or if you get the message “Warning: Denied agent
    forwarding because the other end has too old version,” you need to upgrade your
    version of rdist (http://www.magnic.com/rdist/).


    Firewalls. Firewalls are devices that control network traffic and isolate one
    network from another. The most common use of firewalls is to protect internal
    networks from the Internet. SSH can send packets through any open port on a firewall
    by using the -p option. For example, most firewalls leave Port 443 open for the
    Secure Socket Layer (SSL):


    On the server: ssh -p 443


    On the client: ssh -p 443 <remote host name>


    Socks 4 and 5 should work in version 1.2.16 or later. Socks support in version
    2.0.1 and later work as well. Socks is a firewall implementation developed by
    NEC.


    PPP. PPP can run over SSH, but there are problems with TCP packet forwarding.
    It is a good idea for compression, since this improves the speed of the connection.
    There is a sample script for running PPP at http://www.inka.de/-bigred/ssh-ppp-new.txt.
    This is also a compiled version of the script at http://detached.net/vpn-starter/
    that is more reliable and easier to set up.


    There is a kernel driver that uses UDP that doesn''t have the problems that TCP
    forwarding has at http://sites.inka.de/sites/bigred/devel/cipe.html.'
