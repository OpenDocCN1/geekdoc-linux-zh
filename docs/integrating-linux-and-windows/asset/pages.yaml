  md: '# 2.3 Accessing ext2 Partitions with Windows 9x


    # 2.2.1 Graphical Interfaces for ltools


    ltools comes with two graphical interfaces: LREADsrv and LREADgui. While they
    do work, if you want a graphical interface for Windows 9x, NT, or 2000, there
    are better tools available.


    LREADsrv. a part of ltools that lets you use your Web browser to read and write
    to the ext2 partition. It also requires some .GIF and .HTM files to run. When
    ltools are extracted, you put LREADsrv and all the required files in the /bin
    directory.


    To use LREADsrv, first make the command-line tools work properly. LREADsrv uses
    tools to access the ext2 partition. Run LREADsrv and connect your browser to http://localhost.


    If you already have a Web server on your PC, you don''t need to load LREADsrv.
    Simply load the file /zzzhlip.htm. You can also read the drive from a remote machine
    by putting in the host name or IP address as http://10.0.0.1/zzzhlip.htm. LREADsrv
    is alpha software. It still has many bugs to iron out, including:


    +   1. It is not a multi-user program. Multiple users can lead to corrupted files
    or directories!

    2. Its error checking is weak. The errors of the underlying applications often
    won''t show up in the browser window.


    LREADgui. LREADgui is a Java interface for Java Runtime 1.1 or higher. It gives
    a graphical interface to ltools. For it to work, you must have ltools in your
    path and the ldrive set to the proper ext2 partition.


    There is an LREADjav that allows up to three different remote hosts to connect
    to LREADgui. Set the remote hosts and port number (the default is 1605) in the
    remote menu to LREADgui.


    LREADjav, like all Java programs, requires a relatively fast machine to operate
    on (a 200 MHz machine is considered slow for a Java program!). The screen also
    tends to flicker on long directory listings. These problems have more to do with
    Java itself than the LREADjav program.


    # 2.3 Accessing ext2 Partitions with Windows 9x


    FSDEXT allows read-only access of an ext2 partition from Windows 9x. It is no
    longer actively developed, but it works and is available at http://www.yipton.demon.co.uk/


    For read and write access, check Explore2fs. It looks and behaves like the Windows
    Explorer and works with Windows 9x and NT. It is available at http://uranus.it.swin.edu.au/~jn/linux/explore2fs.htm.


    Explore2fs supports a wide range of features, including:


    +   - Drag and drop.

    - Support for all block sizes.

    - Support for floppy disks 1.44MB and 120MB.'
