    to pause the printerqueue.


    This command should be a program or script which takes a printer name as its only
    parameter and stops the printerqueue, such that no longer jobs are submitted to
    the printer.


    This command is not supported by Windows for Workgroups, but can be issued from
    the Printer''s window under Windows 95 & NT.


    If a "%" is given then the printername is put in its place. Otherwise it is placed
    at the end of the command.


