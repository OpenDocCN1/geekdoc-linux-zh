  md: '# The Samba FAQ


    comp.protocols.smb


    FAQ about comp.protocols.smb

    The newsgroup comp.protocols.smb is quite separate from the samba mailing list.
    Someone from outside the Samba team has gatewaying messages from the Samba mail-list
    to comp.protocols.smb for a while hopefully this has stopped now.


    comp.protocols.smb does contain a list of discussion about Samba so it is often
    a useful resource for Samba users.


    For info on accessing usenet newsgroups like comp.protocols.smb please ask a local
    internet guru. The Samba Team has no way of knowing how your local news system
    is setup we can''t help you.


    # dont descend & security


    Descend is not meant to be a security feature, it''s an administrative convenience.
    It can be easily bypassed.


    It is meant for things like /proc to prevent utilities like file manager from
    recursing themselves to death in a filesystem that has links back into itself.


    Please use the underlying unix security of file permissions to give you real security.


    # file caching


    Some people report problems with “caching” of data. Generally the bug report goes
    like this:


    +   - create a file on a Unix box

    - view the file on a PC via Samba

    - change the file on the Unix box

    - look at the file again on the PC via Samba and the changes are not visible


    The first thing to realize that this is the expected behavior! The SMB protocol
    uses a thing called “opportunistic locking”. This allows the client to “safely”
    do client side of file data. The problem is that caching is only safe if all programs
    access the files via SMB. As soon as you access the data via a non-SMB client
    then you will get data inconsistencies.


    The solution is simple! Disable oplocks in smb.conf for those shares that need
    to be-cess simultaneously from Unix and windows. See the “oplocks” and “veto oplock
    files” options in smb.conf(5)


    Samba-1.9.18 and the samba-2.x series support oplocks.


    Samba-1.9.17 series does NOT.'
