    # Notes


    Some servers are fussy about the case of supplied usernames, passwords, share
    names (AKA service names) and machine names. If you fail to connect try giving
    all parameters in uppercase.


    It is often necessary to use the -n option when connecting to some types of servers.
    For example OS/2 LanManager insists on a valid NetBIOS name being used, so you
    need to supply a valid name that would be known to the server.


    +   - smclient supports long file names where the server supports the LANMAN2
    protocol or above.


    # Environment Variables


    The variable USER may contain the username of the person using the client. This
    information is used only if the protocol level is high enough to support session-level
    passwords.


    The variable PASSWORD may contain the password of the person using the client.
    This information is used only if the protocol level is high enough to support
    session-level passwords.


    # Installation


    The location of the client program is a matter for individual system administrators.
    The following are thus suggestions only.


    It is recommended that the smclient software be installed in the /usr/local/samba/bin
    or /usr/samba/bin directory, this directory readable by all, writable only by
    root. The client itself should be executable by all. The client should NOT be
    setuid or gesetzt!


    The client log files should be put in a readable directory and writable only by
    the user.


    To test the client, you will need to know the name of a running SMB/CIFS server.
    It is possible to run smbd (8) an ordinary user—running that as a daemon on a
    user-capable port (typically any port number over 1024) would provide a suitable
    test server.


    # Diagnostics


    Most issues issued by the client are logged in a specified log file. The log file
    name is specified at compile time, but may be overridden on the command line.'
