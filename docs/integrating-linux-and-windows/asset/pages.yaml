  md: '# 15.1 printintool


    # 149


    ![](img/a1ad58e4259f15e8b2826ecf57a28362_164_0.png)


    Figure 15.3 Adding a local printer with PrintTool.


    The Name identifies the printer. It can be up to eight characters. Leave the Spool
    Directory alone, unless you have a good reason to change it. The File Limit is
    at 0 (unlimited size) by default, but you can limit the size of the spool pools.

    The Printer Device Field should be filled in. If it isn''t, /dev/lp0 is the first
    printer port, /dev/lpd is the second printer port, or /dev/cua0 is the first serial
    port (COM1 in Windows), /dev/cual is the second serial port.

    At Input Filter, choose the Select button. It should give a list of printers.
    If your printer isn''t listed, perhaps there is a compatible driver for your printer.
    Check your user manual for help. These Web sites help:


    +   - http://www.cs.wisc.edu/ghost/printer.html

    - http://www.linuxprinting.org/database.html


    Linux inherits native PostScript support from UNIX. PostScript is a standard printing
    language by Adobe (http://www.adobe.com) that is widely used. Hewlett Packard''s
    PCL is the other widely used printing language. One advantage of native PostScript
    support is that Linux can print PostScript documents on a printer that doesn''t
    support PostScript.

    There are some that will not work with Linux. WinPrinters are a prime example.
    These printers use Windows drivers to process the print image and thus will only
    work with Windows. See the Web pages above for compatible printers.

    When you select your print driver, choose OK and a list of listings should appear
    in the window as shown in Figure 15.4.'
