  md: '# Secure Shell (SSH)


    SSH1 and SSH2 are not fully compatible with each other, you need to decide which
    to use. Although there is a free SSH client for Windows, it is not well-tested
    and debugged (meaning using it at your own risk). For Linux and Windows environments,
    either use SSH1 or a commercial version of SSH2 from Data Fellows or Van Dyke.


    # 17.4.2 What Does It Protect Against?


    There are several methods of breaking into UNIX (Linux) systems. Most of them
    are based on pretending to be someone else or capturing authentication data on
    the network. SSH does not trust anything that comes through the network. An attacker
    on the network can only cause SSH to disconnect, not take over a session, or capture
    passwords. Here are some of the attacks SSH protects against (from the SSH FAQ):


    +   * IP spoofing—Where a remote host sends packets that pretend to come from
    another, trusted host. SSH even protects against a spofer on the local network,
    which can pretend it is your router to the outside.

    * IP routing—Where a host can pretend that an IP packet comes from another, trusted
    host.

    * DNS sniffing—Where an attacker forges server records.

    * Packet sniffing—Interception of clear-text passwords and other data by intermediate
    hosts.

    * Man in the middle—Manipulation of data by people in control of intermediate
    hosts.

    * X11 spoofing—Attacks based on listening to X-Windows authentication data anded
    connections to the X11 server


    # 17.4.3 What SSH Doesn’t Protect Against


    If an attacker gains root to your machine, they can circumvent SSH as well. Gaining
    access to your home directory will also compromise SSH security. This is why it
    is a bad idea to export the home directory with NFS.


    # 17.4.4 SSH Client for Windows


    There are several free and commercial SSH clients for Windows. Some free implementations
    they are:


    +   * Robert O''Callahan’s TTSSH, an SSH1 extension to the TeraTerm client—nhttp://www.zip.com/~roca/ttssh.html.

    * Gordon Caffee—command-line port of SSH1 and scp—http://bmrc.berkeley.edu/~people/caffe/winntntutil.html.

    * Sergey Ohapkin’s SSH1 and SSH2 servers and clients ported to 32-bit Windows—nhttp://www.lexa.ru/sos/.

    * PuTTY, Simon Latham’s 32-bit Windows SSH client—nhttp://www.chiark.greenend.org.uk/~sgthatham/putty.html.'
