  md: '# Appendix C: Samba Man Pages


    +   • time server (G)

    This parameter determines nmbd advertises itself as a time server to Windows clients.
    The default is False.


    ```

    Default: time server = False

    ```


    ```

    Example: time server = True

    ```


    +   • timestamp logs (G)

    Samba2.0 will a timestamps to all log entries by default. This can be distracting
    if you are attempting to debug a problem. This parameter allows the timestamping
    to be turned off.


    ```

    Default: timestamp logs = True

    ```


    ```

    Example: timestamp logs = False

    ```


    +   • unix password sync (G)

    This boolean parameter controls whether Samba attempts to synchronize the UNIX
    password with the SMB password when the encrypted smpasswd file is changed. If
    this is set to true the password specified in the “password program” parameter—allow
    the new UNIX password to be set without access to the old UNIX password (as the
    SMB password has change code no access to the old password clearest, only the
    new). By default this is set to “false”.

    See also “password program”, “password chat”.


    ```

    Default: unix password sync = False

    ```


    ```

    Example: unix password sync = True

    ```


    +   • realmname (G)

    This boolean parameter when set causes samba to supply the real name field from
    the unix password to the client. This is useful for setting up mail clients and
    WWW browsers on systems used by more than one person.


    ```

    Default: realmname = no

    ```


    ```

    Example: realmname = yes

    ```


    +   • update encrypted (G)

    This boolean parameter allows a user logging in with a plaintext password to have
    their encrypted (hashed) password in the smpasswd file to be updated automatically
    as they log on. This option allows to migrate from plaintext password authentication
    (users authenticate with plaintext password over the wire, and check against a
    UNIX account database) to encrypted password authentication (the SMB challenge/response
    authentication mechanism) forcing all users to re-enter their passwords via smpasswd
    at the time the change is made. This is a convenience to allow the change over
    encrypted passwords to be made over a longer period. Once all users have encrypted
    representations of passwords in the smpasswd file this parameter should be set
    to “off”.

    In order this parameter to work correctly the “encrypt passwords” parameter must
    be set to “no” when this parameter is set to “yes”.'
