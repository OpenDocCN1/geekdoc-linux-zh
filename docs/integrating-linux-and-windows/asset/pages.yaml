  md: '# Samba FAQ


    # NT SP3 and Encryption


    Microsoft changed WinNT in service pack 3 to refuse to connect to servers that
    do not support SMB password encryption.


    There are two main solutions:


    +   1. enable SMB password encryption in Samba. See ENCRYPTION.txt in the Samba
    docs (this is best done with samba versions recent from 1.9.18)


    +   2. disable this behavior in NT. See WinNT.txt in the Samba docs


    Note that Samba-1.9.18 and later support encrypted passwords without need to recompile
    and link with the libdes (DES) library. Refer to the main page for smb.conf and
    to ENCRYPTION.txt for information about use of encrypted passwords.


    Please refer to the following URL for more information on this subject: http://support.microsoft.com/support/kb/articles/q166/7/30.asp


    # NTDOMAIN code


    If you are trying the NTDOMAIN version of Samba then join the samba-technical
    list and listen there for a while. I also suggest you read the list archives.
    See http://lists.samba.org/ for more info.


    Samba support for NT domain control is still very experimental. Only try it if
    you are a programmer willing to experiment.


    All bug reports regarding this experimental code should be directed ONLY at the
    samba-technical or samba-ntdom mailing lists.


    In response to concerns over profile handling: Profile handling will be looked
    at once we get the domain code to stabilize. Until then, what we document in Samba
    and what works can be in conflict. We stress again the highly experimental nature
    of all the NTDOMAIN code.


    In response to concerns over compilation problems: Code updates to the head branch
    tree are samba-2.1.0 NOT samba-2.0.0. The Samba-2.1.0 code may not compile and
    not work at any time. Please use this at your own risk.


    # NetWstaUserLogon


    The password server changed because we discovered that bugs in some NT servers
    allowed anyone to login with no password if they chose an account name that did
    not exist on the password server. The NT password server was saying "yes, it''s
    OK to login" when the account didn''t exist at all! Adding the NetWstaUserLogon
    fixed the problem, and follows the "recommended" method that MS has recently documented
    for pass through authentication.'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# Appendix B: Samba Documentation


    The problem now is that some NT servers (in particular NT workstation?) don''t
    support the NetWkstaUserLogon call. The call also doesn''t work for accounts in
    trust relationships.


    The eventual solution for this will be to replace the password server code in
    Samba with NT domain code as is developed. For now you have the choice of compiling
    Samba either or with the NetWkstaUserLogon call in the password server code.


    In 1.9.18p3 and later you can disable the NetWkstaUserLogon call with an option
    in your smb.conf using the “networkstation user login” option.


    Not listening for calling name


    +   > Session request failed (131,129) with myname=HOBBES destination=CALVIN

    > Not listening for calling name


    If you get this talking to a Samba box then it means that your global “hosts allow”
    or “hosts deny” settings are causing the Samba server to refuse the connection.


    Look carefully at your “hosts allow” and “hosts deny” lines in the global section
    of smb.conf.


    It can also be a problem with reverse DNS lookups not functioning correctly, leading
    to the remote host identity not able to be confirmed, but that is less likely.


