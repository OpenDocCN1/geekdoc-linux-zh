  md: "# CHAPTER\n15\n\n# PRINTING WITH SAMBA\n\nSetting up a printer can be tricky\
    \ and it deserves some extra coverage. The printer must be set up for Linux before\
    \ it can be set up for Samba. Most distributions of Linux will set up a printer\
    \ during the install. Linux uses the /etc/printcap file to configure your printer.\
    \ Unless you know what you are doing, it is not recommended that you edit this\
    \ file yourself as it contains many control characters, which are non-printing\
    \ characters that are used to configure the printer:\n\n```\nlp:\\n  :sd=/var/sp/lpd/lp:\\\
    n  :mx#0:\n  :sh:\\n  :lp=/dev/null:\\n  :af=/var/sp/lpd/lp/acct :=\n  :if=/var/sp/lpd/lp/filter:\n\
    ```\n\nIf you want to be a masochist you can edit this file with a text editor.\
    \ For the rest of us, there are configuration utilities for printers. Red Hat\
    \ and several other distributions come with printtool, which runs in X-windows\
    \ for Linux and UNIX. Other distributions of Linux may have another tool to configure\
    \ printers (check your Linux manual).\n\n# 15.1 printtool\n\nStarting printtool\
    \ by typing printtool at the command prompt window inside of Xwindows. It will\
