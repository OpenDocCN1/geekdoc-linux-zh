    # smbstatus (1)


    # Samba


    23 Oct 1998


    # Name


    smbstatus—report on current Samba connections


    # Synopsis


    smbstatus [-b] [-d] [-L] [-p] [-S] -s configuration file] [-u username


    # Description


    This program is part of the Samba suite.

    smbstatus is a very simple program to list the current Samba connections.


    # Options


    +   -b gives brief output.

    -d gives verbose output.

    -L gives smbstatus to only list locks.

    -p gives a list of smbd processes and exit. Useful for scripting.

    -s gives smbstatus to only list lists.

    -s configuration file The default configuration file name is determined at compile
    time. The file specified contains the configuration details required by the server.
    smbconf (5) for more information.

    -u username selects information relevant to username only.


    # Version


    This man page is correct for version 2.0 of the Samba suite.


    # See Also


    smb.conf (5), smbd (8)'
