    # /usr/local/samba/lib/smb.conf


    This is the default location of the smb.conf server configuration file. Other
    common places that systems install this file are /usr/samba/lib/smb.conf and /etc/smb.conf.


    This file describes all the services the server is to make available to clients.
    See smb.conf (5) for more information.


    # Limitations


    On some systems smbd cannot change uid back to root after a setuid() call. Such
    systems are called “trapdoor” uid systems. If you have such a system, you will
    be unable to connect from a client (such as a PC) as two different users at once.
    Attempts to connect the second user will result in “access denied” or similar.


    # Environment Variables


    # Printer


    If no printer name is specified to printable services, most systems will use the
    value of this variable (or "lp" if this variable is not defined) as the name of
    the printer to use. This is not specific to the server, however.


    # Installation


    The location of the server and its support files is a matter for individual system
    administrators. The following are suggestions only.


    It is recommended that the server software be installed under the /usr/local/samba
    hierarchy, in a directory readable by all, writable only by root. The server program
    itself should be executable by all, as users may wish to run the server themselves
    (in case it will run of course with their privileges). The server should NOT be
    setuid. On some systems it may be worthwhile to make smbd setgid to an empty group.
    This is because some systems may have a security hole where daemon processes that
    a user can be attached to a debugger. Making the smbd file setgid to an empty
    group may prevent this hole from being exploited. This security hole and the suggested
    fix have only been confirmed on old versions (pre-kernel 2.0) of Linux at the
    time this was written. It is possible that this hole only exists in Linux, as
    testing on other systems has thus far shown them to be immune.'
