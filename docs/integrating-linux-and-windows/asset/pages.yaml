  md: 'ply fakes the permissions. A file that is listed as writable may be read-only
    or vice versa. This can lead to problems if you are not careful.


    There is another major problem with smbfs. If an smbfs-mounted drive loses its
    connection with the Windows machine, the mounted drive will lock up and it won''t
    unmount or mount until the Linux machine is rebooted. This problem may be fixed
    in future versions of smbfs, but for now, it is an annoying problem.


    # 14.6 Sharity


    A way around the lock-up problem of smbfs is to use sharity. sharity is a separate
    program than part of the kernel like smbfs. It will also allow the SMB share to
    be exported via NFS.


    On the downside, sharity doesn''t support file locking and often has trouble with
    file handles, which leads to occasional Stale NFS file errors.


    There are two flavors of sharity: sharity and sharity-light. sharity is a commercial
    program that requires a license. sharity-light is a GPL version of the program
    that lacks many of sharity''s advanced features such as:


    +   - Encrypted passwords.

    - Mounts multiple shares from the same server.

    - Displays correct file modification dates.

    - Various caching strategies improve performance.

    - Overlapping requests improve performance.

    - Autounting facility.

    - Better mapping of file operation semantics.

    - Multi-user operation.

    - Supports International character set.

    - Can link to SSLeay for secure data transport (first implemented in beta version
    0.15).


    sharity and sharity-light have a similar syntax to smbfs. The basic syntax of
    sharity-light is:


    ```

    shlight //server/service mount-point [options]

    ```


    For a complete list of options, go to ftp://ftp.obdev.at/pub/Products/Sharity-Light/Sharity.README.


    sharity''s home page is at http://www.obdev.at/Products/Sharity.html, and sharity-light''s
    home page is at http://www.obdev.at/Products/shlight.html.


    # 14.7 Conclusion


    These are the tools needed to connect a Linux machine to a Windows machine. In
    the next chapter, we will discuss printing with Samba.'
