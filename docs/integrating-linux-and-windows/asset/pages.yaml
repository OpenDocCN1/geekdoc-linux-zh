  md: '# Appendix C: Samba Man Pages


    +   - smbd

    - The smbd (8) daemon provides the file and print services to SMB clients, such
    as Windows 95/98, Windows NT, Windows for Workgroups or LanManager. The configuration
    file for this daemon is described in smbd.conf (5).

    - nmbd

    - The nmbd (8) daemon provides NetBIOS nameserving and browsing support. The configuration
    file for this daemon is described in smb.conf (5).

    - smclient

    - The smclient (1) program implements a simple ftp-like client. This is useful
    for accessing SMB shares on other compatible servers (such as Windows NT), and
    can also be used as a UNIX box to print to a printer attached to any SMB server
    (such as a PC running Windows NT).

    - testparam

    - The testparam (1) utility allows you to test your smb.conf (5) configuration
    file.

    - testprns

    - The testprns (1) utility allows you to test the printers defined in your printcap
    file.

    - smbustatus

    - The smbustatus (1) utility allows list current connections to the smbd (8) server.

    - nmblookup

    - The nmblookup (1) utility allows NetBIOS name queries to the UNIX machine.

    - make_smbcodepage

    - The make_smbcodepage (1) utility allows you to create SMB code page definition
    files for your smbd (8) server.

    - smbpasswd

    - The smbpasswd (8) utility allows you to change SMB encrypted passwords for Samba
    and Windows NT(tm) servers.


    # Availability


    The Samba suite is licensed under the GNU Public License (GPL). A copy of that
    license should have come with the package in the file COPYING. We encourage to
    distribute copies of the Samba suite, but please obey the terms of this license.


    The latest version of the Samba suite can be obtained via anonymous ftp from samba.org
    in the directory pub/samba/. It is also available on several mirrors sites worldwide.


    You may also find useful information about Samba on the newsgroup comp.proto-cols.samba
    and the Samba mailing list. Details on how to join the mailing list are given
