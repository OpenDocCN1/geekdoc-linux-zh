  md: '# nmbd


    # 233


    The default value if this parameter is not specified is zero.

    The higher this value, the more detail will be logged to the log files about the
    activities of the server. At level 0, only critical errors and serious warnings
    will be logged.

    Level 1 is a reasonable level for day to day running—it generates a small amount
    of information about operations carried out.

    Levels above 1 will generate considerable amounts of log data, and should only
    be used when investigating a problem. Levels above 3 are designed for use only
    by developers and generate HUGE amounts of log data, which of most is extremely
    cryptic.

    Note that specifying this parameter here will override the log level parameter
    in the smb.conf (5) file.


    +   - **logfile** The -l parameter specifies a path and filename into which operational
    data from the running nmbd server will be logged. By appending the extension ".nmb"
    to the specified base name. For example, if the name was specified "log" then
    the log.nmb will contain the debugging data. The default log file path is compiled
    into Samba as part of the build process. Common defaults are /usr/local/samba/var/log.nmb,
    /usr/samba/var/log.nmb or /var/log.nmb.

    - **primary NetBIOS name** This option allows you to override the NetBIOS name
    that Samba uses for itself. This is identical to setting the NetBIOS name parameter
    in the smb.conf file but will override the setting in the smb.conf file.

    - **p UDP port number** UDP port number is a positive integer value. This option
    changes the default UDP port number (normally 137) nmbd responds to name queries.
    Don''t use this option unless you are an expert, in which case you won''t need
    help!

    - **s configuration file** The default configuration file name is set at build
    time, typically as /usr/local/samba/lib/smb.conf, but this may be changed when
    Samba is autconfigured.

    - **i scope** This specifies a NetBIOS scope that nmbd will use to communicate
    when generating NetBIOS names. For details on the use of NetBIOS scopes, see rfc1001.txt
    and rfc1002.txt. NetBIOS scopes are very rarely used, only set this parameter
    if you are the system administrator in charge of all the NetBIOS systems you communicate
    with.

    - **h print** This prints the help information (usage) for nmbd.


    # Files


    /etc/inetd.conf


    If the service is to be run by the inetd meta-daemon, this file must contain suitable
    startup information for the meta-daemon.'
