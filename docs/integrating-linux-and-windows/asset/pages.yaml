    Note—the best way to solve this problem is to enable encrypted passwords on your
    Samba server. Windows 98 works well with Samba when Samba is running in encrypted
    mode. Samba versions 1.9.18 and later support encrypted passwords providing it
    is correctly configured in smb.conf and an smbpassd file has been created.


    To enable encrypted passwords on Samba, read the file docs/ENCRYPTION.txt in the
    Samba distribution.

    /tools/msutil/ you should find the files: ''ptxt_on.inf'' and ''ptxt_off.inf''
    is a clip from the mtsutil.txt file in that directory:


    # PTXT_ON.INF - SENDS PLAIN-TEXT PASSWORDS TO YOUR NETWORK =====================================================


    For security reasons, Windows 98 will not allow you to send plain-text passwords.
    The password is encrypted by default. However, Samba servers can be configured
    to require plain-text passwords, so you will not be able to connect to Samba servers
    configured in this mode unless you change a Registry entry to enable plain-text
    passwords.


    Caution: Enabling plain-text passwords could compromise security.


    To enable plain-text passwords, add the Registry entry for EnablePlainTextPassword
    (as a Dword) and set the value to 1 in the following Registry location:

    HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\VxD\Vnetsup


    To set the value EnablePlainTextPassword found in the 1:


    +   1. Select PTXT_ON.INF found in the \Tools\MTSUtil folder on the Windows 98
