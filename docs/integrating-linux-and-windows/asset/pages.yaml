  md: '# 6.12.1 Graphics Conversion


    GIMP, Core Draw, Photoshop, and most graphics programs can open and convert many
    different file formats. Sometimes, though, you run into a graphics file that your
    program won''t support. Other times you have a large number of files that need
    to be converted and it would take days to open and convert every file. For these
    situations, you need a graphics conversion program.


    There are two types of graphic conversion programs: viewers and bulk converters.
    A viewer allows you to view the graphic, save it into another format. This allows
    you to check and adjust the characteristics of the file before converting it.
    A bulk converter usually doesn''t let you view the graphic before converting,
    but it will convert many files at once.


    There are dozens of free and share graphics conversion programs for Windows. A
    good list of the various programs is available at http://www.softseek.com/Graphics_and_Drawing/Graphics_Conversion_and_Optimization/.


    There are not many graphics converters available for Linux. One of the best viewers
    on the market is bundled with Linux distributions. There is a charge of $25 for
    the program and $40 will also include printed manuals. The program, source code,
    and documentation are available at http://www.trilon.com/xv/xv.html.


    For bulk conversions, use the free utility NetPBM. NetPBM is not a single program,
    but a set of about 180 command-line programs. There are separate programs for
    converting between different formats. For example, to convert PNG (a graphics
    format popular on UNIX systems) to JPEG (a graphics format that creates very small
    graphics files) files, use the following command:


    ```

    for i in *.png; do pngtopnm |pmtojpeg >basename $i .png.jpg; done

    ```


    Let''s break the command:


    +   * for i in *.png;This chooses all PNG files.

    * do pngtopnm I—This is the program that converts PNG to PNM. PNM is an intermediate
    format used by NetPBM.

    * nmtojpeg—This program converts PNG to JPEG.

    * ''>basename $i .png.jpg;This creates a JPG file with the same name as the .PNG
    file.

    * done—Exits the program when done.


    The syntax of NetPBM is rather complicated, but it is great for bulk conversions.
    The program and documentation are available at: http://netpbm.sourceforge.net/projects/netpbm.


    ImageMagick has a nifty collection of conversion tools available at http://www.izards.dupont.com/cristy/ImageMagick.html.'
  merge: -1
