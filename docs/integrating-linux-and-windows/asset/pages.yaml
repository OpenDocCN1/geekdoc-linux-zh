    +   - syslog (G)

    This parameter maps how Samba debug messages are logged onto the system syslog
    logging levels. Samba debug level zero maps onto syslog LOG_ERR, debug level one
    maps onto LOG_WARNING, debug level two maps to LOG_DEBUG, debug level three maps
    onto LOG_INFO. The parameter sets the threshold for the mapping, all Samba debug
    messages above this threshold are mapped to syslog LOG_DEBUG messages.

