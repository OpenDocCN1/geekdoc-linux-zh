  md: 'To install the VMware for Windows, double-click on the license file that you
    get from http://www.vmware.com. This will add the following license key to your
    Registry:


    ```

    HKEY_LOCAL_MACHINE\SOFTWARE\VMware, Inc.\VMware for Windows

    NT\License

    ```


    After installation, VMware must be configured. To configure VMware for Windows,
    run the Configuration Wizard in the vmware folder (Programs). For Linux, start
    X-Windows then type vmware from a terminal prompt.


    First, you must decide how much RAM and disk space to allocate to the guest OS.
    Remember that this RAM and disk space will be taken away from the host OS. To
    allow both operating systems to operate, you need a 266 MHz Pention II, about
    128 MB of RAM, and at least 500 MB of free disk space on your system, although
    more is always better. This configuration allows you to allocate up to half of
    the RAM and 500 to 1000 MB of disk space to the host OS. VMware does not re-partition
    the hard drive; it merely creates a file on your current drive which acts as a
    virtual drive. Be sure to have at least 50 MB or swap space.


    Next, if the guest OS is Linux or Windows, install the appropriate VMware tools
    for that OS. VMware tools for Windows and Linux are included with VMware. These
    tools can also be accessed by Settings -> VMware Tools Install. These tools for
    other OSs can also be downloaded from http://www.vmware.com. The compressed file
    is small enough to fit on a floppy, or the tools can be downloaded into the guest
    OS.


    To install the tools for Linux, unpack the tools with the following command:


    ```

    tar zxf vmware-toolsxxx.tar.gz (xxx is the version number)

    ```


    Then go to the directory vmware-tools and run ./install.pl.


    For Windows, simply run the downloaded file vmware-toolsxxx.exe, where xxx is
    the version number.


    When installing the tools, be sure to install the toolbox and video drivers. The
    VMware tools will install their own video driver, which increases the graphics
    speed of the guest OS. They will also set the video settings of the guest OS to
    be the same as the host OS. For example, if the host OS is set to 800x600 at 16
    million colors, the guest OS will be set to the same. Without the VMware tools,
    the video settings of the host OS will only support 640x480 at 16 colors.


    # 4.3.1 How Does it Work?


    VMware works well as long as your system meets at least the minimum requirements
    listed above. It allows you to open another OS inside your Windows NT/2000 or
    Linux system. The host OS runs at almost normal speed and the guest OS runs at
    about one-half to one-quarter normal speed, depending on what you are doing.


    Both systems share the drives on the PC. The applications in each OS can share
    data and even cut and paste between the host and guest operating systems.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# 4.3.2 Known Problems with VMware


    As with any program, not everything works as it is supposed to. These deviations
    are called bugs by most software companies, although a few companies still insist
    on calling them features. VMware is a rapidly evolving product with a new version
    coming out every few months. The VMware support page is at http://www.vmware.com/support/.
    If you don''t find the solution to your problem here, fill out an incident report
    at http://www.vmware.com/forms/Incident-login.cfm. There is also a handy search
    form on this page that they encourage you to use before filing an incident report.


    # 4.3.3 Tuning VMware


    Many of the tuning parameters are mentioned in the installation and configuration
    discussions above. If the host or guest OS is sluggish, check the configuration
    parameters first. Make sure that there is enough memory and disk space allocated
    to each OS. If an OS doesn''t have enough memory or disk space, reconfiguring
    your system may help. If there isn''t enough disk space or memory to run both
    operating systems properly, upgrading your PC.


    Other than, installing the VMware toolkit can have a great effect on the speed
    of the guest OS. The toolkit has enhanced video drivers designed for the VMware
    guest session. There is a VMware tools version for Windows 95, NT, and 2000, Linux,
    and FreeBSD (a version of UNIX).


    If is your guest OS, you can get better video performance if you use direct draw
    mode (not to be confused with Microsoft''s Direct Draw). The default for VMware
    is to use GDI, which is the video system that is used by Windows. Direct draw
    is faster, but not supported by all systems. If you have video problems after
    installing direct draw, change back to GDI. To switch to draw mode, go to Settings
    -> Current VM Graphics and change the GDI to Direct Draw.


    The guest OS is also more responsive in the full-screen mode. To open it in full-screen
    mode, click on the Full Screen command on the menu. If your screen appears black
    or distorted in full-screen mode, check your refresh rate. VMware defaults to
    a 75 MHz scan rate and some systems won''t support it. If this is the case, you
    can change the scan rate by going to the Settings -> Global Preferences menu as
    shown in Figure 4.3.'
