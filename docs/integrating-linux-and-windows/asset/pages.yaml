    generic icons displayed


    Some Samba users have reported a problem where the icons for programs stored on
    the server are not displayed, with "exe" icons being displayed. This seems to
    be caused by the client detecting the connection to the server as "slow". When
    this happens the client tries to make things a bit faster by not reading icon
    information from the remote .exe files.


    The problem happens particularly when running Samba with "security=server". In
    server level Samba delays the negrot and session setup replies while talking to
    the password server (this is necessary). To make worse Samba initially sends a
    deliberately bad password to the password server in order to detect a known bug
    in NT servers where they say "yes" to all passwords. The NT server returns this
    bad password slowly (probably in an attempt to stop password cracking over the
    network). This introduces a approximately 3 second delay in making the connection
    which is sufficient to trigger the Win95 "don’t display icons" code.'
