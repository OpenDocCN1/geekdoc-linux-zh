    XXX isn''t in user security mode


    This error message means you are using server level security with a password server
    that isn''t in user security mode. The password server code relies on being able
    to send username/password pairs and getting back a yes/no response. This isnt
    possible unless the server is in user security mode.


    The most common reasons for this problem are:


    +   1. you are trying to use a Win95 box as the password server. That won''t work.

    2. you are using a Samba server as the password server and that server is configured
    in shared level security.


    Y2K


    Samba is year 2000 compliant so long as the underlying operating system that Samba
    is running upon is 2000 compliant (Linux is, as most modern UNIX systems, along
    with VMS, MVS and many others that Samba runs on.)


    For a more detailed discussion and the latest information see http://samba.anu.edu/samba/y2k.html


    case sensitive


    Many Microsoft clients and applications cannot handle case sensitive servers.
    They often change the case of a filename before sending it over the wire.


    In Samba, just use "short preserve case = yes" and "preserve case = yes". Never
    use "case sensitive = yes”'
