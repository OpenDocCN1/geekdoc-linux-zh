  md: '# 328


    # Appendix C: Samba Man Pages


    An extensive description of the services that the server can provide is given
    in the man page for the configuration file controlling the attributes of those
    services (see **smb.conf** (5)). This page will not describe the services, but
    will concentrate on the administrative aspects of running the server.


    Please note that there are significant security implications to running this server,
    and the **smb.conf** (5) manager should be regarded as mandatory reading before
    proceeding with installation.


    A session is created whenever a client requests one. Each client gets a copy of
    the server for each session. This copy then services all connections made by the
    client during that session. When all connections from its client are closed, the
    copy of the server for that terminates.


    The configuration file, and any files that it includes, are automatically reloaded
    every minute, if they change. You can force a reload by sending a SIGUP to the
    server. Reloading the configuration file will not affect connections to any service
    that is already established. Either the user will disconnect from the service,
    or smbd killed and restarted.


    # Options


    +   - **If itself, this parameter causes the server to operate as a daemon.**
    That is, it detaches itself and runs in the background, fielding requests on the
    appropriate port. Operating the server as a daemon is the recommended way of running
    smbd for servers that provide more than usual use file and print services.


    By default, the server will NOT operate as a daemon.


    +   - **if this parameter is specified, each new connection will append log messages
    to the log file.** This is the default.


    +   - **if this parameter is specified, the log files will be overwritten when
    opened.** By default, the log files will be appended to.


    +   - **debuglevel debuglevel is an integer from 0 to 10.


    The default value if this parameter is not zero.


    The higher the value, the more detail will be logged to the log files for the
    activities of the server. At level 0, only critical errors and serious warnings
    will be logged. Level 1 is a reasonable level for day running—it generates a small
    amount of information about operations carried out.


    Levels above 1 will generate considerable amounts of log data, and should only
    be used when investigating a problem. Levels above 3 are for use only by developers
    and generate HUGE amounts of log data, which is extremely cryptic.


    Note that specifying this parameter will override the **log level** parameter
    in the **smb.conf** (5) file.


    +   - **log file** If specified, this parameter specifies a log file into which
    informational and debug messages from the running server will be logged. The log
    file generated is never removed by the server although its size may be controlled
    by the **max log size** option in the **smb.conf** (5) file. The default log file
    name is specified at compile time.'
