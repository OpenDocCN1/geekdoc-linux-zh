    # 15.2 Testing the Printer


    There are some options under the Test Menu to help diagnose the printer. If you
    have a local printer, try the Print ASCII directly to port option (this won''t
    work with remote or SMB printers). If this doesn''t work, check the cabling and
    printer configuration. Also, check to see that you selected the correct port (lp0,
    lp1, etc.).

    Next, try Print ASCII test page. If this doesn''t work, check to see that lpd
    (the printer program for Linux) is loaded and make sure the remote printer is
    working and set up properly. There is an option to restart lpd on the menu (see
    Figure 15.5).


    ![](img/a1ad58e4259f15e8b2826ecf57a28362_166_0.png)


    Figure 15.5 Restarting lpd with PrintTool.'
