- img_proc: true
  md: '# 340


    # Appendix C: Samba Man Pages


    Note that Windows 95/98 do not have a real password database so it is not possible
    to change passwords specifying a Win95/98 machine as remote target.


    +   - **R name resolve order** This option allows the user of smclient to determine
    what name resolution services to use when looking up the NetBIOS name of the host
    being connected to.


    The options are "hosts", "host", "wins" and "bcast". They cause names to be resolved
    as follows:


    +   - **hosts**: Look up IP address in the Samba hosts file.

    - **host**: Do standard host name to IP address resolution, using the system /etc/hosts,
    NIS, or DNS lookups. This method of name resolution is operating system dependent.
    For instance on IRIX or Solaris, this may be controlled by the /etc/nwitch.conf
    file.

    - **wins**: Query with the IP address listed in the **wins server** parameter
    in the **smb.conf** file. If no NIS server has been located this on the **interfaces**
    parameter in the smb.conf file. This is the least reliable of the name resolution
    methods as it depends on the target host being on a locally connected subnet.


    If this parameter is not set then the name resolve order defined in the **smb.conf**
    file parameter **name resolve order** will be used.

    The default order is hosts, wins, bcast and without any entry in the **smb.conf**
    file name resolution methods will be attempted in this order.


    +   - **m** This option tells smpassword that the account being changed is a MACHINE
    account. Currently this is used when Samba is being used as an NT Primary Domain
    Controller. PDC support is not a supported feature in Samba2.0 but will become
    supported in a later release. If you wish to know more about using Samba as an
    NT DC then subscribe to the mailing list samba-ndom@samba.org.


    This option is only available when running **smpassword** as root.

    j DOM This option is used to add a Samba server to a Windows NT Domain, as a Domain
    member capable of authenticating users to any Domain Controller in the same way
    as a Windows NT Server. See the **security=domain** option in the **smb.conf**
    (5) man page.


    In order to use this, the Administrator for the Windows NT Domain must have used
    the program "Server Manager for Domains" to add the primary NetBIOS name of the
    Samba server as a member of the Domain.


    After this has been done, join the Domain invoke **smpassword** with this parameter.
    **smpassword** will then look up the Primary Controller for the Domain (found
    in the **smb.conf** file in the parameter **password server** and change the account
    password used to create the secure Domain communication. This password is stored
    by **smpassword** in a file, only by root, <Domain>.<Machine>.mac where <Domain>
    is the name of the Domain we are joining and <Machine> is the primary NetBIOS
    name of the machine we are running on.'
