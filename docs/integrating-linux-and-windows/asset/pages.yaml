    | tcp | 0 | 0 * :1089 | msgr-ns7.hotmail.com:1863 | ESTABLISHED |

    | tcp | 0 | 0 * :6000 | * | LISTEN |

    | tcp | 0 | 0 * :1024 | * | LISTEN |

