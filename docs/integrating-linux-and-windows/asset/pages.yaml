    # Name


    smclient--ftp-like client to access SMB/CIFS resources on servers


    # Synopsis


    smclient servicename [password] [-s smb.conf] [-B IP addr] [-O socket options][-R
    name order] [-M NetBIOS name] [-i scope] [-N] [-n NetBIOS] [-d debuglevel] [-P]
    [-p port] [-l log basename] [-h] [-I IP] [-E] [-U username] [-L NetBIOS [-t terminal
