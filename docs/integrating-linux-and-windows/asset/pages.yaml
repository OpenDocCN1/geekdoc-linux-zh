    # 1.4 Linux and Windows 95/98


    First, let''s go over what happens when Linux and Windows 9x boot up.


    # 1.4.1 Booting Linux


    When Linux boots, it loads the LILO program, which stands for Linux LOader. This
    then

    loads the kernel, which is the core of the operating system. Finally, modules
    are loaded from

    t /etc/rc.d directory. Actually, the boot process is a little more complicated
    than

    this, but this description is good enough for your purposes.


    The LILO program is configured using the /etc/lilo.conf file. A typical lilo.conf

    would like like:


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    timeout=50

    image=/vmlinuz-2.2.13-4mdk

    label=linux

    root=/dev/hda5

    read-only

    ```


    Let''s go over the lines one at a time:


    +   * boot—This is the device that contains the boot files.

    * map—This is the location of the map file. The map file is a binary file containing

    disk parameters for the system. The default is /boot/map.

    * install—This is the file that is installed as the boot sector. The default is

    /boot/boot.b.

    * prompt timeout—This is how long it waits before booting in tenths of a second.
    This

    allow to enter boot parameters manually. In the above example, it is five seconds

    (50 tenths of a second). If you have a multiple boot system, pressing <SHIFT>
    will

    bring up the boot choices. You can set up to 16 different boot configurations.'
