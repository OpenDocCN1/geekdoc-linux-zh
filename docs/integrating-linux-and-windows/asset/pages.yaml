  md: '# 12.2 How Samba Works


    Samba uses NetBIOS over TCP/IP (NetBT) to deliver the four SMB services: file
    and print services, authentication and authorization, name resolution, and service
    announcement (also browsing). These are explained briefly for now and in greater
    detail later in the book.


    File and print services are the most important of these. They allow Windows (and
    Samba) to share files and printers through the network. These services were the
    primary reason for Local Area Networks (LANs) in the first place.


    Authentication and authorization use login names and passwords to allow authorized
    users to access the network. They restrict what each user can do on the network.
    Files and printers can be restricted by user. Files can also be read-only to prevent
    accidental changes.


    Name resolution of converting NetBIOS names to IP addresses NetBT. This is done
    by the Windows Internet Name Server (WINS) on a Windows network. Samba can perform
    most of the functions performed by WINS.


    Service announcement, or browsing, allows other devices on the network to know
    what services are available. The list of services is kept on a machine called
    the "master browser." The browsing list can be viewed by opening the "Network
    Neighborhood" (see 12.1).


    ![](img/a1ad58e4259f15e8b2826ecf57a28362_135_0.png)


    Figure 12.1 "Network Neighborhood" shows the SMB (Windows and Samba) machines
    on the network.'
