- img_proc: true
  md: '# 3.2 Adding a Partition to the fstab


    # 3.1.1 Some Problems with DMSDOS


    Of course, accessing a compressed partition is slower than accessing an uncompressed
    partition because of the compression and decompression involved. This can be kept
    to a minimum by defragmenting the compressed partition. Double Space, Drive Space,
    and Stacker come with defragmentation utilities that should be used on a regular
    basis.


    Using DOSEMu with DMSDOS can also cause problems. DOS will often write directly
    to disk and bypass the DMSDOS file caching. You may need to unmount the compressed
    partition to use DOSEMu and avoid corrupting the partition or crashing the system.
    The DMSDOS document contains an extensive list of error codes and kernel messages.


    # 3.2 Adding a Partition to the fstab


    The file /etc/fstab is a file that stores information on mountable drive systems.
    Adding an entry to this file will save having to enter command lines every time
    you need to mount a partition. A typical fstab file would look something like
    this:


    ```

    /dev/hdl /boot ext2 defaults 1 2

    /dev/hda5 ext2 defaults 1 1

    /dev/hd6 swap upgrade defaults 0 0

    /mnt/floppy /mnt/floppy supermount fs=vfat,dev=/dev/fd0 0 0

    /mnt/cdrom /mnt/cdrom supermount fs=iso9660,dev=/dev/cdrom 0 0

    ```


    This entry is broken down into six sections, which are separated by a space:


    +   1. The device or remote filesystem to mount.

    2. The mount point.

    3. The filesystem type.

    4. The mount options.

    5. Which filesystems to dump. A 0 means no dump.

    6. The fcksk priority. The root filesystem should be first (1) and the other filesystems
    should be second (2). 0 means to skip.


    Adding a compressed drive to the fstab is tricky since it requires two entries:
    one for the compressed volume space (cvs) and another for the drive itself.


    ```

    /DOS/drvspace.001 /DOSF mdsos loop 1 0

    /dev/hdl /DOS mdsos defaults 1 0

    ```


    The first line loads the cvs as follows:


    +   * /DOS/drvspace.001—The compression driver.

    * /DOSF—The directory used by the compression program.

    * mdos—The filesystem type.

    * loop—This option is required for the compression drive.

    * 1—Set the drive to dump.

    * 0—Don''t fsck the drive.'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'The second line mounts the drive:


    +   * /dev/hdal—The actual drive to mount.

    * /DOS—The mount directory on the Linux partition.

    * mdsos—The filesystem type.

    * defaults—Use the default mount options.

    * 1—Set dumb to on.

    * 0—Don''t fschk the drive. (This could corrupt the drive!)


    Some of these settings may vary with your setup. Also, depending on your system,
    you may have to reverse the order of the two lines since the cvs must be loaded
    first.'
  merge: -1
