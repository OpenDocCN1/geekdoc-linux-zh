- img_proc: true
  md: '# Web-Based Suites


    # 6.4.1 Koffice


    KDE''s office suite. It comes with a word processor (Kword), spreadsheet (Kspread),
    presentation software (Kpresent), a charting program (Kchart), a vector-based
    drawing tool (Killorator), an imaging program (Kimage), a layer-based image creation
    program (KImageShop), and a database front-end (Katabase).


    Koffice is still in development and not ready for everyday use. Having said that,
    Koffice is surprisingly stable and feature-complete for a project under development.
    Keep an eye on Koffice. It is an up-and-coming competitor!


    # 6.4.2 Gnome Office


    Gnome also has an office suite, unlike Koffice, the Gnome Office is a collection
    of open source tools rather than a new suite designed from the ground up. The
    goals of Gnome Office is to provide the features of Microsoft Office and have
    good compatibility with Microsoft Office files. Unfortunately, KDE, the Gnome
    Office components are still under development.


    The heart of Gnome Office is the spreadsheet, Gnumeric. This is a Gnome project
    created to create a full-featured GPL spreadsheet. One of its goals is to clone
    the look and features of Microsoft Excel. AbiWord is Gnome''s word processor.
    It doesn''t have all the features of many of the other word processors, but it
    is very fast and has a clean interface. Gnu Image Manipulation Program (GIMP)
    is one of the first source desktop applications available for Linux. GIMP is a
    photo and image retouching program similar to Adobe Photoshop. While its interface
    isn''t quite polished as Photoshop, GIMP is very powerful. As a drawing program
    similar to Dia is a quick tool for Gnome developers to draw diagrams and flowcharts.
    Eye of Gnome (EOG) is a quick image viewer. It was designed to allow developers
    to quickly view image files without having to open them in a larger application
    like GIMP. Gnome-PIM provides the calendar and address book that is standard in
    all commercial office suites. Finally, Gnome-DB provides applications and libraries
    to design easy front-ends for databases. Details on the Gnome Office are found
    at http://www.gnome.org/gnome-office/.


    # 6.5 Web-Based Suites


    It''s hard to tell whether they will catch on, but Web-based office suites are
    truly cross-platform. These suites run inside Netscape or Internet Explorer, which
    allow them to run on virtually any operating system.


    Web-Based Suites (WBS) are in two different flavors: server-based applications
    and client-based applications. Server-based applications run on the server and
    send the image to the client machine through the browser. The file is typically
    stored on the server. Client-based applications use MS Office as the back-end
    and offer near perfect compatibility. Others use Star Office, Apprix, or home-built
    applications. An example of a server-based application is FreeDesk.com, which
    uses a free, home-grown application (www.freedisk.com).'
