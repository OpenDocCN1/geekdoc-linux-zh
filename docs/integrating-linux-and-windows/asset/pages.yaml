    When this option is enabled, it can cause problems on some systems.


    Also, make sure that CD-ROM autoplay is disabled in the guest and host OS. Autoplay
    constantly polls the CD drive for autoplay files, which dramatically slows down
    performance.


    # FreeMWare


    FreeMWare is an open source project that allows Windows window to be opened inside
    of Linux. While it is early beta right now, it promises to offer an open source
    alternative to VMware. It is also licensed under the LGPL (LesserGNU Public License).
    The main difference between LGPL and GPL is that the LGPL is less restrictive
    on its redistribution. For more information on LGPL, go to http://www.gnu.org/copyleft/lesser.htm.
    For more information on FreeMWare, go to http://www.freeware.org.'
