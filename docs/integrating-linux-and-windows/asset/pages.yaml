  md: '# 298


    # Appendix C: Samba Man Pages


    Note that smbd *ALWAYS* uses a valid UNIX user to act on behalf of the client,
    even in "security-share" level security.


    As clients are not required to send a username to the server in share level security,
    smbd uses several techniques to determine the correct UNIX user to use on behalf
    of the client.


    A list of possible UNIX usernames to match with the client password is constructed
    using the following methods:


    +   * If the "guest only" parameter is set, then all the other stages are missed
    and only the "guest account" username is checked.


    +   * If a username is set with the share connection request, then this username
    (after mapping—see "username map") is added as a potential username.


    +   * If the client had a previous "logon" request (the SessionSetup SMB call)
    then the username sent in this SMB will be added as a potential username.


    +   * The NetBIOS name of the client requested is added to the list as a potential
    username.


    +   * Any users on the "user" list are added as potential usernames.


    If the "guest only" parameter is not set, then this list is then tried with the
    supplied password. For whom the password matches will be used as the UNIX user.


    If "guest only" parameter is set, or no username can be determined then if the
    share is marked as available to the "guest account", then this guest user will
    be used, otherwise denied.


    Note that it can be *very* confusing in share-level security as to which UNIX
    user eventually be used in granting access.


    See also the section "NOTE ABOUT USERNAME/PASSWORD VALIDATION".


    +   * "security=user",


    This is the default setting in Samba2. With user-level security a client must
    first "log-on" with a valid username and password (which can be mapped using the
    "username map" parameter). Encrypted passwords (see the "encrypted passwords"
    parameter) can also be used in this mode. Parameters such as "user" and "guest
    only", if set then applied and may change the UNIX user to use on this connection,
    but only after the user has been successfully authenticated.


    Note that the name of the resource being requested is *not* the server until after
    the server has successfully authenticated the client. This is why guests don''t
    work in share level security without allowing the server to automatically map
    unknown users into the "guest account". See the "map to guest" parameter for details
    on doing this.


    See also the section "NOTE ABOUT USERNAME/PASSWORD VALIDATION".


    +   * "security=server",


    In this mode Samba will try to validate the username/password by passing it to
    another SMB server, as an NT box. If this fails it will revert to "security =
    user", but not that encrypted passwords have been negotiated Samba cannot revert
    to checking the UNIX password file, it must have a valid smbpasswd to check users'
