  md: '# Partitioning an Existing Hard Drive


    Boot off the rescue diskette and copy the boot partition to the floppy as:

    diff=<Linux partition> of=<name of file> bs=512 count=1n


    Let''s go over the command step by step:


    +   - if—The location at where to start copying. In this case, we are starting
    at the beginning of the Linux partition.

    - of—The output file''s name.

    - bs—The block size. The boot sector is 512 bytes.

    - count—The number of blocks copied. We are only copying one block—the boot sector.


    Let''s use an example of having Linux on hda2 (the second partition on the hard
    drive) and let the name file boot.ln (the Linux boot sector):

    diff=dev/hda2 of=boot.ln bs=512 count=1


    Next, copy the file.ln to a DOS formatted floppy:

    mcopy boot.ln a:


    ```

    mcpy is part of the mtools programs. For more information go to http://www.linux.org/pub/n/knaff/mtools.
    You could also use these commands to copy boot.ln to a floppy:

    ```


    ```

    mount -t msdos /dev/fd0 /mnt/floppy

    cp boot.ln /mnt/floppy

    umount /mnt/floppy

    ```


    Now, reboot into NT, log in as administrator, and copy boot.lnx from A: to the
    root of C.. Then, edit boot.ini. First, take off the system and read-only attributes:


    ```

    attrib -s -r c:boot.ini

    ```


    Next, edit boot.ini with notepad and add a line for booting Linux:


    ```

    [boot loader]

    timeout=30

    default=multi(0) disk(0) partition(1)\WINNT

    [operating systems]

    multi(0) disk(0) partition(1)\WINNT=Windows NT Workstation

    Version 4.0

    multi(0) disk(0) partition(1)\WINNT=Windows NT Workstation

    Version 4.0 [VGA mode]/basevideo /sos

    C:\BOOT.LNX=**

    ```


    The last line will load Linux. When you are editing and saving boot.ini, change
    the attributes:


    ```

    attrib +s +r c:boot.ini

    ```


    When you boot up NT, you will get the following menu, which allows you to select
    the system to boot:'
  merge: -1
