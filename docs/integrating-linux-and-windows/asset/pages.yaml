  md: '# CHAPTER 5


    # INTERNET APPLICATIONS


    The Internet has grown from a communications network for government agencies in
    the late 1960s to the engine that is driving the U.S. economy in the late 1990s.
    The different strengths of Linux and Windows make it not only possible to mix
    environments, but desirable.


    Due to UNIX heritage, Linux''s native TCP/IP protocol support, stability, and
    low cost make it ideal as a server. According to a count of servers by leb.net
    (http://www.leb.net/hzo/ioscount/). Linux is the most popular server on the Internet.
    Linux also runs Apache, which is by far the most popular server on the Internet
    according to Netcraft survey (http://www.netcraft.com/survey/).


    Although Linux is starting to catch up, Windows still has a lot more end-user
    applications than any other.. applications such as Microsoft Office, Media Player,
    Outlook, and Exchange are not available for Linux. According to International
    Data Corporation (http://www.idc.com/), Windows has about 87% of the desktop OS
    market compared to about 4% for Linux. This gives tremendous incentive for companies
    to release the Windows version of desktop programs first.


    This chapter is not going to cover every Internet application or go into details
    about the configuration of any of them. These subjects would take more than one
    book to cover. Instead, I intend to cover some of the common interoperability
    issues in dealing with mixed environments on the Internet.


    # 5.1 Web Server Compatibility


    Let''s start with the Web since it seems to be getting the most press lately.
    Web servers are relatively simple. They take text files (HTML files) and transfer
    them using the HTTP protocol. These text files let the Internet browser to display
    a page and where to download the graphics, sounds, programs, and other files need
    to render the page. The most popular Web servers are Apache, Internet Information
    Server (IIS), and Netscape, which make up about 85% of the server market.


    Apache is a free, open Web server that, although there is a Windows version available,
    run primarily on UNIX platforms such as Linux. IIS is included with Windows NT
    and 2000 Server and is available only for Windows. Netscape is available in versions
    for Windows and most flavors of UNIX, including Linux.


    Since most Web standards are set by the Internet Engineering Task Force (IETF),
    Web servers tend to look the same to end-users. The two main problems of compatibility
    tend to be in connecting to databases and generating dynamic Web pages.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# 40


    # Chapter 5 • Internet Applications


    Most large Internet sites today store their data in a database and use this to
    generate Web pages on the fly. For information on interoperability between Linux-
    and Windows-based databases, see Chapter 7.


    The traditional way of creating dynamic Web pages is to write CGI scripts. Today,
    there are several programs that make generating dynamic Web pages easier. Two
    of the most popular of these tools are PHP and Active Server Pages (ASP). PHP
    is an open source program designed to run with UNIX and Apache. ASP is a Microsoft
    product designed to run with Windows and IIS. Both of these programs are available
    in both Linux and Windows versions.


    # 5.1.1 PHP


    Both the Linux and Windows versions of PHP are available at http://www.php.net/.
    They are available in source code and binary versions. Windows binaries are up-to-date,
    but if you have the latest Linux code, you may have to compile it.


    There are some special considerations when connecting PHP to a Microsoft database.
    On a Windows machine, simply use the ODBC drivers. If you need instructions on
    setting up ODBC, go to http://www.php.net/manual/config-odbc.html.


    It is a little more complicated on a Linux machine. To connect to a Microsoft
    SQL server, the PHP Sybase modules at http://www.php.net/extra/clib-linux-elf.tar.gz.
    SQL Server and Sybase are mostly protocol-compatible.


    It''s not simple to connect to a Microsoft Access database from a Linux machine
    either. The easiest and most robust method would be to use Open Database Connectivity
    (ODBC) drivers. See the section in the databases chapter (Chapter 7) on ODBC for
    information using ODBC with Linux.


    # 5.1.2 Active Server Pages


    Active Server Pages (ASP) is included with Microsoft IIS. One use for a Linux
    machine with ASP is as a back-end database. ASP uses ODBC for database support,
    and the ODBC drivers from OpenLink can be used to connect to the Linux database
    for a Microsoft machine.


    IASP by Halcyonsoft replicates the ASP functions on Linux and many other platforms.
    It adds many functions to ASP such as Java Server Pages and full Support. It can
    even be used with Microsoft''s ASP to add functions. There is a free development
    version and the full version starts at $495 (http://www.halcyonsoft.com).


    ChillSoft has a beta version of ASP for Linux that is also worth a look. It is
    expected to be $99 per server (http://www.chillisoft.com/).


    Another option is to convert ASP pages to PHP and use PHP on both platforms. Considering
    that PHP is free, this might be a good option if cost is a consideration. There
    is a free program called ASP2PHP that converts ASP pages to PHP pages. The syntax
    of the program is asp2php mysfile.asp, where mysfile.asp is the ASP file to convert.
    It also comes with a nice GUI tool, gtkasp2php, which makes conversion easy as
    point and click. The program is available at http://home.il.net/~naken/asp2php/'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# FrontPage Extensions


    FrontPage is a popular Microsoft Web authoring tool. FrontPage Extensions are
    needed on a Web to take advantage of FrontPage features such as:


    +   - Letting multiple users simultaneously collaborate on the same Web site and
    Web server (multi-user authoring).

    - Letting users write directly to the Web server with Microsoft FrontPage using
    a PC or laptop computer from anywhere in the world via the Internet (remote authoring).

    - Letting users use forms on their Web site and specify how the results of those
    forms are handled without the users having to write their own scripts.

    - Letting users include discussion webs on their Web site.

    - Letting users include hit counters on their Web site.


    Of course, all of these functions can be done without FrontPage Extensions. FrontPage
    Extensions are only required to take advantage of these functions in Microsoft
    FrontPage.

    Microsoft''s IIS automatically installs FrontPage Extensions. Apache doesn''t
    include FrontPage Extensions, but they can be downloaded from http://www.rtr.com/fpsupdownload.html.
    Instructions for installing FrontPage Extensions on Apache for Linux are available
    at http://www.e-gineer.com/instructions/install-frontpage-extensions-for-apache-on-linux.phtml.


    # Using Microsoft Office Files on the Web


    Microsoft Office programs are often used to create Web documents. All the Standard
    Office programs (Word, Excel, and PowerPoint) have a Save As HTML option. This
    is convenient for quickly creating HTML documents, but Office tends to put non-standard
    characters in the HTML. These documents then look bad when viewed with a non-Microsoft
    browser.

    HTML documents created with Office have the following non-standard:


    +   - The semicolon is missing at the end of numeric characters (e.g., &#061;).

    - Numeric rendering of special characters (e.g., &lt; &gt; &amp;).

    - Unquoted<table> tags containing non-alphanumeric characters.

    - PowerPoint mis-nests <font> and <strong> tags.

    - PowerPoint uses <ul> and </ul> tags to accomplish paragraph breaks.

    - Office misses <tr> tags in text-only lines.

    - Office places extra <p> tags in headings.

    - Office uses "paragraph-lines," which leads to lines that scroll off the page.


    Fortunately, there is a program called demoroniser (http://www.fourmilab.ch/webtools/demoroniser/)
    that will correct these flaws in HTML documents created with'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'Office. It is a freeware Perl script that converts the non-standard characters
    into standard HTML tags. Perl is installed by default on most Linux distributions.
    A Win32 version of Perl is available at (http://www.ActiveState.com/ActivePerl/download.htm).
    if you have Windows 95, you will also need DCOM (http://www.microsoft.com/resources/downloads.asp).


    The syntax of demoroniser is [ -u ] [- wcols ] [ infile ] [ outfile ]


    where:


    +   - -u-Help.

    - -wSets the character length of the lines. The default is 72.


    # Web Browsers


    One advantage of the Web is that the Web page tells the browser what a page should
    look like and the browser actually renders the Web page. This means Web pages
    download fast and there are Web browsers available for every OS. It also means
    that the browser choice makes a big difference in how Web pages look and not every
    browser will properly render every Web page.


    # Browsers Available for Both Linux and Windows


    The browser choice for cross-platform compatibility is currently Netscape. It
    has versions for most major platforms and supports all the major standards, including
    frames, image maps, plugins, SSL (Secure Sockets Layer), Java, and Java Script.
    It is included in most Linux distributions and a Windows version can be obtained
    at www.netscape.com.


    Star Office has a built-in browser that works well. It renders pages well, but
    lacks some of the advanced features such as SSL, interact GIFs, and Java. See
    the section on productivity applications for more on Star Office (www.sun.com/staroffice).


    There are a couple of browsers that deserve a mention: Lynxx and Arachne. Lynx
    is one of the oldest browsers and is available for almost every OS. Even though
    it is a textonly browser, it is useful for debugging Web pages. It is very picky
    about HTML syntax. It is also good for checking if Web pages have the proper alt
    tags that are necessary for text readers used for handicapped access to Web pages
