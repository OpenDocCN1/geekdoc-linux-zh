    \ list. See http://lists.samba.org/ for details.\nThere is also a separate Samba\
    \ NTDOM FAQ available in the documentation section of the samba web site at http://samba.org/samba/\n\
    \n# IP Address Change\n\nThe following is an example of a problem from time to\
    \ time:\n“Samba was working fine. We had to change the IP address of the Samba\
    \ server. Following the change Samba does not work. We have tried EVERYTHING—it\
    \ still does not work!\nWhat to check:\n\n+   - Follow all instructions in DIAGNOSIS.txt\
    \ for the samba docs directory.\n- Locate you browse.dat and wins.dat files. They\
    \ may be found in the typical locations:\n    - /usr/local/samba/var/locks\n \
    \   - /var/locks/samba\n    - /opt/samba/var/locks\n- If you cannot locate where\
    \ samba stores these files you can always run:\n    testparm | grep lock\n- Shut\
    \ down samba.\n- Delete the browse.dat and wins.dat files\n- Restart samba.\n\
    - Check that any files you deleted have been recreated.\n- Now follow DIAGNOSIS.txt\
    \ again.\n\nCause:\n\nSamba will place into these files entries for itself with\
    \ your old IP address. When you restart Samba it preloads it with this information\
    \ and expects to be able to resolve it's own address to the same address as it\
    \ has just read from files."
