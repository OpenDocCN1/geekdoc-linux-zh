    +   - use hosts (G)


    If this global parameter is a true, it specifies that the UNIX users ".hosts"
    file in their home directory will be read to find the names of hosts and users
    who will be allowed access without specifying a password.


    NOTE: The use of hosts can be a major security hole. This is because you are trusting
    the PC to supply the correct username. It is very easy to get a PC to supply a
    false username. I recommend that the use hosts option be only used if you really
    know what you are doing.


