    This parameter specifies a set of UNIX mode bit permissions that *always* be set
    on a directory created by Samba. This is done by bitwise ‘OR’ing these onto the
    mode bits of a directory that is being created. The default for this parameter
    is (octal) 0000 which will not add any extra permission bits to a created directory.
    This operation is done after the mode mask in the parameter “directory mask” is
    applied.


    See also the parameter “directory mask” for details on masking mode bits on created
    directories.


    ```

    Default: force directory mode = 000

    Example: force directory mode = 0755

    ```


    would force created all directories to have read and execute permissions for ‘group’
    and ‘other’ as well as the read/write/execute bits set for the ‘user’.


    # force group (S)


    This specifies a UNIX group name that will be assigned as the default primary
    group for all users connecting to this service. This is useful for sharing files
    by ensuring that all access to files on service will use the named group for their
    permissions checking. Thus, by assigning permissions for this group to the files
    and directories within this service the Samba administrator can restrict or allow
    sharing of these files.


    ```

    Default: no forced group

    Example: force group = aroup

    ```


    # force user (S)


    This specifies a UNIX user name that will be assigned as the default user for
    all users connecting to this service. This is useful for sharing files. You should
    also use it carefully as using it incorrectly can cause security problems.


    This user name only gets used once a connection is established. Clients still
    need to connect as a valid user and supply a valid password. Once connected, all
    file operations will be performed as the “forced user”, no matter what username
    the client connected as.


    This can be very useful.


    ```

    Default: no forced user

    Example: force user = auser

    ```


    # fstream (S)


    This parameter allows the administrator to configure the string that specifies
