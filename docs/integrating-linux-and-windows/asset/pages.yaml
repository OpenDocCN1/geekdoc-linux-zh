    \nnAfter DHCPD is installed, the configuration file /etc/dhcpd.conf must be created\
    \ and edited. This file looks a lot like the smb.conf file. It has the global,\
    \ shared network, and group sections.\nThe section has several default values.\
    \ It can be overridden by the other sections if necessary. We are not using all\
    \ the values, see Appendix A for other values. Notice that all lines have a semi\
    \ colon (;) at the end of them.\n\n```\nserver - identifier mmccune\noption subnet\
    \ - mask 255.255.255.0\noption broadcast - address 10.0.0.255\ndefault - lease\
    \ time 86400\nmax - lease time 259200;\n```\n\nThere are two parameters that need\
    \ to be explained: default-lease-time and max-lease-time. With DHCP, the IP address\
    \ given by the server expires after a given time. This prevents workstations and\
    \ other devices from using IP addresses after they are no longer being used. The\
    \ default-lease-time is how long the device keeps the IP in seconds. In this case,\
    \ 86400 seconds equals one day (60 seconds x 60 minutes x 24 hours). The max-lease-time\
    \ is how long the device has to renew the IP address. If it doesn't renew by this\
    \ time, the device's IP address will be disabled and the IP address can be assigned\
    \ to another device. In this example, the max-lease-time is three days (86400\
    \ seconds 3 days)\n\nThe subnet section configures the DHCP server is covering.\
    \ The subnet identification and netmask are followed by the options in brackets:\n\
    \n```\nsubnet 10.0.0.0 netmask 255.255.255.0\n{\n  range 10.0.0.5 - 10.0.0.250;\n\
