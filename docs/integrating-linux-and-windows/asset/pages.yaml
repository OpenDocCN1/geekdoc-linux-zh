    # Samba


    # Description


    The Samba software is a collection of programs that implements the Server Message
    Block(commonly abbreviated as SMB) protocol for UNIX systems. This protocol is
    sometimes also referred to as the Common Internet File System (CIFS), LanManager
    or NetBIOS protocol.


    # Components


    The Samba suite is made up of several components. Each component is described
    in a separate manual page. It is strongly recommended that you read the documentation
    that comes with Samba and the manual pages of those components that you use. If
    the man pages aren’t clear enough then please send a patch or bug report to samba-bugs@samba.org.'
