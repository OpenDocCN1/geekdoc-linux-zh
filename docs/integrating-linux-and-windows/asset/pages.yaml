  md: '# CHAPTER

    11

    INTRODUCTION TO

    WINDOWS AND LINUX

    NETWORKING


    # 11.1 NetBIOS


    Windows and Linux developed from different heritages and network in different
    ways. Windows owes its roots to DOS and uses NetBIOS as its native protocol. Windows
    2000 is replacing NetBIOS with Active Directory, but Linux still uses the TCP/IP
    protocol that it inherited from its UNIX system.


    Fortunately, both operating systems go to great lengths to assure that they can
    interoperate with other systems. All versions of Windows have TCP/IP support built
    into them, and Linux has support for NetBIOS. There are also several programs
    for both Windows and Linux that allow each system to emulate the protocols of
    the other.


    NetBIOS is an abbreviation for Network Basic Input/Output System. Each device
    on the network is assigned a 15-byte name consisting of letters, numbers, and
    special characters (see Appendix A for rules on naming NetBIOS devices). There
    is also a 16-byte code used for the "resource type". For example, you could name
    a Windows file server "Fileserver". If you wanted to make your "F:" drive attach
    to "public", you would use the command net use F: \Fileserverpublic.


    The earliest Microsoft implementation of NetBIOS is called NetBEUI. Like anything
    else, NetBEUI has its advantages and disadvantages. On the upside, it is very
    fast, since it is a relatively simple protocol. On the downside, it doesn''t work
    on networks larger than 20 computers. There are several reasons for this NetBEUI
    sends its packets to all the computers on the local network, so the traffic gets
    really heavy after a dozen computers. It is also not routable, which means the
    protocol only works on a local network.


    Windows networking has evolved over the years. The oldest method is the workgroup
    model. A workgroup is just a logical group of computers. In a workgroup, all devices
    can share resources as directories and printers with other members of the workgroup.
    The sharing is controlled by each device or computer. This is the obvious limitation
    of not having central control of the network''s resources. Later on, Microsoft
    corrected this with the domain model.


    Like the workgroup model, the domain model is a logical grouping of network devices.
    The advantage of the domain is that there is one login to the domain. All network
    resources'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# 11.2 TCP/IP and Active Directory


    have central control. Each domain has a primary and backup domain controller.
    A domain controller''s primary function is to keep track of usernames and passwords.
    The domain model used by Windows allows users to log into the network only once,
    but still allows them to use the resources of the entire network. Trust relationships
    can also be set up between several domains to allow resources to be shared between
    domains.


    2000 will replace NetBEUI and the domain model with Active Directory, which organizes
    network devices into a hierarchical tree. The best analogy is the organization
    of a business. At the top is the president, who has authority over everything.
    Below the president are several vice presidents, and below them are managers,
    then workers. An Active Directory tree works the same way (see Figure 11.1). It
    allows central control of the network devices, and it also allows the network
    to be divided into a logical hierarchical structure.


    ![](img/a1ad58e4259f15e8b2826ecf57a28362_131_0.png)


    Figure 11.1 A sample Active Directory tree. In this case, it is divided geographically.


    Active Directory overcomes some of the disadvantages of NetBEUI. It doesn''t rely
    on broadcast packets for most of its functions, so the network can handle more
    than 20 hosts. It doesn''t rely on WINS servers, which are discussed later. Since
    Active Directory uses TCP/IP, it is routable, and can be used on networks covering
    several layers.


    TCP/IP is short for Transmission Control Protocol/Internet Protocol. It was originally
    developed on ARPANET (Advanced Research Projects Agency Network), the precursor
    to the Internet. Since most of the machines on it running UNIX, TCP/IP was developed
    largely on UNIX. Unlike NetBIOS, TCP/IP is designed for large networks and is
    writable. Instead of using simple methods, TCP/IP uses a 32-bit numeric value
    called an IP address. IP addresses are written as four sets of numbers between
    0-255, separated by periods. An example of an IP address would be 10.23.64.1.
    The first number in the IP address represents the class of the network.


    Networks are broken down into Class A, B, and C networks, depending on size. A
    Class A network can have up to 16,777,214 hosts, a Class B network can have 16,384
    hosts, and a Class C network can have 254 hosts.'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# Net BIOS over ICP/IP


    Certain numbers in the IP address are reserved for special purposes. The number
    0 refers to the current network or host. The number 127 is called a loopback,
    which is used for diagnostic purposes, and the number 255 is used for broadcasting
    packets to the entire network.


    The other part of the TCP/IP address is the subnet mask. This can be used to subnet
    or divide a network into two or more networks. For example, in the above network
    of 10.23.64.1, a subnet mask of 255.255.0.0 would not divide the network, but
    a subnet mask of 255.255.240.0 would divide the network. Subnet masks are probably
    the most complex part of TCP/IP and it would take much time to explain them here.
    See Appendix A for a more detailed explanation of subnet masks as well as other
    TCP/IP issues.


    IP addresses are friendly for machines, but not too friendly for users. Most devices
    also have a user-friendly name called a host name. Most of us have seen these
    host names as Web addresses. For example, the Web for IBM is www.ibm.com. The
    IP address associated with this web is 204.146.80.99. Like IP addresses, host
    names are hierarchical. The "www" represents the server, "IBM" represents the
    domain associated with the IBM Corporation, and "com" represents a commercial
    Internet.


    The process of turning a human-friendly name into a machine-friendly IP address
    is done using DNS (Domain Name System). DNS is simply a hierarchical system used
    to find the IP address associated with a host name. When a Linux machine is given
    a host name, it first looks the file /etc/hosts, which is simply a text file listing
    host names and addresses. If it doesn''t find it, it queries the primary name
    server. A name server maintains a database of host names and IP addresses. If
    the host name is not found, then the secondary name server will be queried. If
    the host is not found, an error message such "unknown host" will be returned.
    This is a simplified description of DNS. It will be described in more detail later
    on.


    The standard has changed over the years. The current version of IP is 4, which
    is abbreviated IPv4. The next version of IP is 6 (IPv6), and it has several improvements
    over IPv4. The most noticeable change is that IPv6 will have 128-byte instead
    of 32-byte addresses. The Internet is currently running out of IP addresses. The
    current 32-bit IP addresses will allow about substantially more. IPv6 has enhanced
    security and diagnostics built into it. See www.ipv6.org for the complete specifications
    of IPv6.


    # Net BIOS over ICP/IP


    Of course, both Windows and Linux have many features and programs that allow them
    to interact with each other. Both Windows and Linux machines allow NetBIOS to
    be implemented over TCP/IP (NetBT). This allows them to have a common protocol,
    but it also creates some unique problems. The main problem is that TCP/IP host
    names can''t always be resolved to NetBIOS names. This problem is solved by a
    WINS (Windows Internet Server).


    A WINS translates host names into NetBIOS names. When a device using NetBT logs
    into a network, it registers its NetBIOS name with the WINS. If it is not in use,
    it is added to the WINS database. Then, if a network device can''t find a NetBIOS
    name, it uses the WINS to look up the address associated with the name.'
