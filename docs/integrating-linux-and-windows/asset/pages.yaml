  md: '# 14.2 smbclient Commands


    Once smbclient is logged into the Windows machine, the first thing you get is
    a prompt:


    ```

    smb: \

    This represents the root of the share on the Windows PC. From here, we can enter
    smb-client commands:

    ```


    +   * ? [command] or help [command]—Help for smbclient commands. By itself, this
    command will give help on all the smbclient commands, or you can enter a command-name
    for the use of the individual command.

    * ! [Linux command]—Allows the running of a Linux command on the local machine
    without exiting smbclient. For example, to view the files on the local hard drive:


    ```

    smb: \! ls

    MSPRINT2.INF

    MSPRINT3.INF

    MSPRINT4.INF

    smb: \>

    ```


    +   * archive [level]—This allows the get command to retrieve files on the Windows
    machine based on the archive bit. The different levels are:

    0 Retrieves all files and leaves the archive bit alone.

    1 Retrieves files with the archive bit and leaves the archive bit alone.

    2 Retrieves all files with the archive bit and resets the archive bit on those
    files.

    3 Retrieves all files and resets the archive bit of all files.


    To find out the archive level is currently set to, type archive at the prompt:


    ```

    smb: \> archive

    Archive level is 0

    smb: \>

    ```


    +   * Blocksize—Specifies the block size for the tar option. The block size is
    in 512-byte increments. For example, to set the block size to 10 Kilobytes (10K),
    use the following-command:


    ```

    smb: \> blocksize 20

    blocksize is now 20

    smb: \>

    ```


    +   * cancel <jobid>—This cancels the specified jobid in the print queue.

    smb: \> cancel 1

    Job 1 cancelled

    smb: \>


    Of course, you must be attached to a printer and know the print job number to
    do this.'
