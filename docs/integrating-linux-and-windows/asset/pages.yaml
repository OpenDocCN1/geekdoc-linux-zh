  md: '# Chapter 10 • Running Applications through a Network


    This is similar to a Virtual Private Network (VPN), which simply sends encrypted
    packets across an insecure public network such as the Internet. It won''t offer
    all the features of a VPN; using SSH will often do the job.


    Ray Jones'' SSLeay (SSL) adds SSL encryption code to VNC. His patches are available
    at http://web.mit.edu/thious/vnc/. To use this option, you must recompile the
