- img_proc: true
  md: '# Just is SMB? 225


    Microsoft Windows Servers. Microsoft has a number of SMB implementations for the
    Windows range of operating systems. These are not separate products, rather, they
    are integral to the appropriate version of the Windows operating system. However,
    they can be switched off either through the Control Panel or at the command line
    (net stop server at DOS).


    It is clear from the fact that the Windows 95 and Windows NT servers react differently
    to sequences of SMB, that Microsoft do not use the same code for each of these
    servers (although the Windows for Workgroups and Windows 95 implementations may
    be derived from the same code).


    Windows for Workgroups 3.11 implements the Windows for Workgroups 3.0a variant,
    and implements share security.


    Windows 95 implements the NT LM 0.12 protocol level and implements both share
    and user level security.


    Windows NT implements the NT LM 0.12 protocol level and implements both share
    and user level security.


    LAN Manager and LAN Manager for UNIX (LM/X). Microsoft and AT&T GIS ported various
    LAN Manager versions to the UNIX operating system. This code formed the base of
    many SMB servers for UNIX operating systems from many vendors. Some examples are:
    LM for SCO, LM Server for HP-UX (Advanced Server/9000), etc.


    The most recent version of this software seems to be LAN Manager for UNIX Version
    2.2, which implements the LANMAN2.1 protocol variant.


    VisionFS. VisionFS is a written-scratch server from SCO. It is available for Solaris
    2.x, HP-UX and SCO (both OpenServer and UNIXware).


    TotalNet Advanced Server. This product is from Syntax. It is a completely written
    SMB server, that was perhaps the first SMB server for UNIX. Its days, with additional
    modules providing AppleShare and NetWare serving all in one product.


    Advanced Server for UNIX. After LM, NCR (which used to be ATT GIS) (perhaps with
    help from Microsoft) ported the Windows SMB server code to UNIX to provide the
    level of functionality as Windows NT.


    PATHWORKS. PATHWORKS is the name of a product from Digital equipment corporation.
    It included both servers and clients, with the servers running on:


    VAX and Alpha VMS


    DEC OS/1 for AXP and Digital UNIX (DEC OSF/1 renamed)


    OS/2


    The clients run on DOS, Windows, Windows for Workgroups, Windows NT and Windows
    95 and are explained below.


    Digital''s clients and server implement SMB over DECNet as as TCP/IP and more
    recently, NetBEUI. The SMB over DECNet specification has never been released.


    Digital''s original PATHWORKS servers were for VAX/VMS and implemented the CorePlus
    protocol (MICROSOFT NETWORKS 1.03 dialect). This product went through several
    versions and culminated in version 4.2. After a time, a version was done for UL-'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# Appendix B: Samba Documentation


    TRIX and called PATHWORKS for ULTRIX V1, the highest version of which was 1.3.

    Both of these product streams were internally developed.


    Subsequently, Digital used the AT&T and Microsoft LAN Manager for UNIX (LM/X)
    code. This was released as PATHWORKS V5.0 for OpenVMS (LAN Manager) and PATHWORKS
    V5.0 for Digital UNIX (LAN Manager). This product implements LAN Manager for UNIX
    V2.2 and the highest SMB dialect that it recognizes as LANMAN2.1 (and DOS LANMAN2.1).
    The reason for the LAN Manager in brackets at the end of each product name is
    that the products also support NetWare functionality.


    WORKS V5 is able to participate in a Windows NT based domain, albeit only as a
    Backup Domain Controller or a member server.


    Recently, Digital has announced PATHWORKS V6.0 for UNIX (Advanced Server), which
    is based on AT&T''s ASU (Advanced Server for UNIX) product.


    LAN Server for OS/2. This is an IBM product that seems to be derived in some from
    its LAN Manager code.


