  md: '# # Integrating LINUX


    and Windows The complete solutions guide for every Linux/Windows system administrator!


    MIKE MCCCUNE


    Running Linux and Windows in the same environment? Here''s the comprehensive,
    up-to-minute solutions guide you''ve been searching for?


    In Integrating Linux and Windows, top consultant Mike McCune brings hundreds of
    solutions for the problems that Linux/Windows system administrators encounter
    most often. McCune focuses on the critical interoperability issues real businesses
    face: networking, program/data compatibility, dual-boot systems, and more. You''ll
    discover exactly to:


    +   - Use Samba and Windows to deliver high-performance, low-cost file and services
    to workstations

    - Compare and implement the best Linux/Windows connectivity techniques: NFS, FTP,
    remote commands, secure shell, telnet, and more

    - Provide reliable data exchange between Microsoft Office® and StarOffice® for
    Linux

    - Provide high-performance cross-platform database access via ODBC

    - Make the most of platform-independent, browser-based applications

    - Manage Linux and Windows on the same workstation: boot managers, partitioning,
    compressed drives, file systems, and more


    If you''re running both Linux and Windows, McCune delivers honest and objective
    explanations of all your integration options, plus realistic, proven solutions
    you won''t find anywhere else. This book will help you keep your users happy,
    your costs under control, and your sanity intact!


    # ABOUT THE AUTHOR


    MIKE McCUNE is a Chicago-based consultant specializing in PC-based networks and
    workstations running Windows, Linux, and NetWare. He has been consulting since
    1990 for clients including IBM, Hewlett-Packard, ITT, and GE.


    $39.99 U.S. | $60.00 (CAD)

