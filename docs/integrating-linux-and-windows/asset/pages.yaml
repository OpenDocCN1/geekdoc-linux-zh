    \ In this case, 1 is the router and 2 is the Samba server (10.0.0.1 and 10.0.0.2).\n\
    \nThe netbios-name-servers parameter specifies the IP address of the WINS. In\
    \ this case, we are using the Samba server (10.0.0.2) as the WINS."
