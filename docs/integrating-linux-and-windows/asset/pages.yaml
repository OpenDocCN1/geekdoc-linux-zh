  md: '# smb.conf (5)


    +   - hide files(S)


    This is a list of files or directories that are not visible but are accessible.
    The DOS ''hidden'' attribute is applied to any files or directories that match.


    Each entry in the list must be separated by a ''/'', which allows spaces to be
    included in the entry. ''*'' and ''?'' can be used to specify multiple files or
    directories in DOS wildcards.


    Each entry must be a Unix path, not a DOS path and must not include the Unix directory
    separator ''/''.


    Note that the case sensitivity option is applicable in hiding files.


    Setting this parameter will affect the performance of Samba, as it will be forced
    to check all files and directories for match as they are scanned.


    Also see "hide dot files", "veto files" and "case sensitive".


    # Default


    No files or directories are hidden by this option (dot files are hidden by default
    because of the "hide dot files" option).


    Example hide files = .*/DesktopFolderDB/TrashFor&m/resource.frk/


    The above example is based on files that the Macintosh SMB client (DAVE) available
    from Thurs creates for internal use, and still hides all files beginning with
    a dot.


