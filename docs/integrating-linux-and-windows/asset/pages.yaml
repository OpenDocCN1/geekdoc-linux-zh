  md: '# Chapter 11 • Introduction to Windows and Linux Networking


    If the WINS fails to find it, the device can still use broadcasts to try to resolve
    the name.

    If the WINS fails to find it, the device can still use broadcasts to try to resolve
    the name.

    Most networks have a primary and secondary WINS. This is a simplified explanation
    of how a WINS works. A more detailed explanation is in Appendix A.


    There are also programs that allow Windows computers to use NFS (Network File
    Services). NFS is the protocol used primarily by UNIX machines to share files
    over a network. It allows a directory on another machine to be “mounted” so that
    it appears to be a directory on the local machine.


    LPR (Line Printer) allows UNIX to print to a remote machine. Windows has support
    for LPR built into Windows NT and 2000. There are also programs available for
    DOS and LPR for the other versions of Windows that allow them to use LPR also.
    NFS and LPR are covered in later chapters.


    Linux also has a program that allows it to share directories and printers. Samba
    is a program that allows non-Windows systems to emulate SMB (Server Message Block),
    which is used by Windows for file and print sharing. While Samba doesn’t support
    all Windows network functions, it can turn a Linux system into a stand-alone Windows
    file server, and it also allows Linux to use Windows files and printers. The next
    two chapters of this book are devoted to Samba, since it is one of the most important
    tools for connectivity between Windows and Linux.'
