  md: 'smclient (1)


    +   - **terminal code** This option tells smclient how to interpret filenames
    coming from the remote server. Usually Asian language multibyte UNIX implementations
    use different character sets from SMB/CIFS servers (EUC instead of SJS for example).
    Setting this parameter will let smclient convert between UNIX filenames and the
    SMB filenames correctly. This option has not been seriously tested and may have
    some problems.


    The terminal code includes sjis, euc, jis7, jis8, junet, hex, cap. This is not
    a complete list, check the Samba source code for the complete list.


    +   - **m protocol level** With the new code in Samba2.0, smclient always attempts
    to connect to the maximum protocol servers. This parameter is preserved for backwards
    compatibility, but any string following the **-m** will be ignored.


    +   - **WORKGROUP** Override the default workgroup specified in the workgroup
    parameter of the **smb.conf** file for this connection. This may be needed to
    connect to some.


    +   - **Tar options** may be used to create tar (i) compatible backups of all
    the files on an SMB/CIFS server. The secondary tar flags that can be given to
    this option are :


    +   c create a tar file on UNIX. Must be followed by the name of a tar file, tape
    device or "-” for standard output. If using standard output you must turn the
    log level to its lowest value **-d0** to avoid corrupting your tar file. This
    is mutually exclusive with the x flag.


    +   x (restore) a local tar file back to a share. Unless the **-D** is given,
    the tar files will be restored from the top level of the share. Must be followed
    by the name of the tar file, device or "-” for standard input. Mutually exclusive
    with the c file. Restored files have their creation time (mtime) set to the date
    saved in the c file. Directories currently do not get their dates properly.


    +   I Include files and directories. Is the default behavior when filenames are
    specified above. Causes files to be included in an extract or create (and everything
    else to be excluded). See example below. Filename globbing works in one of two
    ways. See **r**.


    +   X Ex files and directories. Causes tar files to extract or create. See example
    below. Filename globbing works in one of two ways. See **r** below.


    +   b Blocksize. Must be followed by a value (greater than zero) blocksize. Causes
    tar file to be written out in blocksize*TBLOCK (usually 512 byte).


    +   g Incremental Only Only up files that have the archive bit set. Using only
    with the **c** flag.


    +   q Quiet. Keeps tar from printing diagnostics as it is. This is the same as
    tarmode quiet.

    r Regular expression or exclude can be very slow. If not compiled with HAVE_REGEX_H,
    a limited wildcard match on * and ?.'
