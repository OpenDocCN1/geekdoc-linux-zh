  md: '# 16.2 Using an NFS Client on Linux


    This is a very simplified explanation of NFS that covers the basics. There are
    entire books covering the details of NFS.


    # 16.2 Using an NFS Client on Linux


    For NFS to work, NFS support has to be built into the kernel. Most distributions
    have NFS support built into the kernel. If not, NFS support needs to be added
    by recompiling the kernel or adding an NFS kernel module. As stated before, recompiling
    kernels is beyond the scope of this book. There are many books with details on
    compiling kernels, or you can go to http://www.ibiblio.org/mdw/HOWTO/Kernel-HOWTO.html
    for details on compiling kernels.


    Once NFS is activated in the Kernel, the remote NFS drive can be accessed by simply
    using the mount command:


    ```

    mount -o rsize=4096,wsize=4096 mmcune:/mnt/home/alisa /mnt/alisa

    ```


    Of course, you must be root or equivalent to use the mount command. Let''s go
    over each of these parameters means:


    +   * -Indicates there are options to follow.

    * rsize—The size of the read buffer in bytes.

    * wsize—The size of the write buffer in bytes.

    * mmcune—The NFS server''s name.

    * /mnt/home/alisa—The NFS directory on the server.

    * /mnt/alisa—The local directory where the NFS directory is mounted.


    # 16.2.1 Optimizing NFS


    The rsize and wsize parameters can be optimized for greater speed. Unfortunately,
    the only way to do this is by trial and error. Generally, rsize and wsize should
    be as large as possible without sacrificing reliability. Most of the time, it
    is better to leave these at the default values.


    Optimizing rsize and wsize. Start with an rsize and wsize of 1024 and see how
    long it takes to copy a very large file (64MB or more). Do this several times
    and average the times. Then add 1024 to the values of rsize and wsize and repeat
    the process until both values are 16,384 bytes.


    After you have determined the optimal sizes for these values, we need to make
    sure they are reliable. This is rather hard to catch. Try running several commands.
    Then trying large files. If programs abort or fail without an error message, it
    is a good sign that rsize and wsize are too large and need to be smaller. Most
    Linux systems perform best when rsize and wsize are all 4096, although your results
    may vary.'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# 16.2.2 Hard and Soft Mounts


    The NFS handles a lost connection is also important. There are hard and soft mounts.
    A soft mount will send an error to the programs that are accessing the NFS volume.
    Some programs can handle this, but most can''t.


    A hard mount is a better option in most cases. It will suspend any programs that
    are accessing the NFS mount. It is added with the intr option, which will stop
    the program that is using the NFS mount. A hard intr is the best option in most
    cases.


    Once the various options are determined, they can be added to the fstab. The fstab
    is where the drive parameters are defined in Linux. The entry to the fstab will
    have this order, separated by spaces: drive, mount point, filesystem type, options
    separated by commas, dump, and fsckorder. For example:


    ```

    mmcune:/mnt/home/alisa  /mnt/alisa  nfs

    size=4096,hard,intr 0

    ```


    In this example, the NFS drive is the directory /mnt/home/alisa on the server
    mmcune. The rsize and wsize are 4096 bytes with the hard and intr options set
    on. The dump and fsck are both set to 0, since this is not a local drive.


    # 16.3 Using NFS on Windows


    NFS support is not built into any version of Windows, although there are many
    add-on programs that allow Windows to function as an NFS server or client. Two
    well-known commercial packages are Hummingbird''s NFS Maestro and NetManager''s
    Chameleon NFS. Microsoft also makes a “Windows for UNIX” add-on pack for Windows
    NT. There are also a dozen other packages and each has its strengths and weaknesses.
    I will not cover all of them, but I will give you an overview of how to implement
    NFS. Most of the companies that make NFS software for Windows offer evaluation
    copies, so you can look at a package before making a decision on whether or not
    to use it.


    I will cover the “Windows for UNIX” add-on pack by Microsoft, since this package
    is often installed on NT machines and it is a necessity in mixed Windows and Linux
    (or UNIX) environments.


    # 16.3.1 Setting up an NFS server on Windows NT


    To create an NFS share on a Windows NT machine, go to the Control Panel and choose
    which drives or directories to share. A drive on NT will appear as /drive/ on
    the NFS share. For example, the D: drive on NT will appear as /D/ in the NFS share.
    You can use aliases to make names more manageable. For example, a shared drive
    of /D/public/user/share could be aliased as share to make it easier to remember.
    The only problem with aliases is that the server needs to be rebooted before the
    alias takes effect.


    You can also set client groups on NFS shares. This simplifies the administration
    of NFS shares, since it allows users to be administered as groups. Keep in mind
    that the secu-'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# 16.3 Using NFS on Windows


    models of Windows and Linux are different. Windows users can belong to multiple
    groups whereas Linux users can only belong to one group at a time. This normally
    will not cause any problems, but under certain circumstances, it can cause problems
    if you are not careful. If this is a problem, you can use chgrp to change the
    group ID.


    There is also an option for file locking. When this is enabled, it only allows
    one user at a time to write to a file. Many programs such as databases implement
    their own file locking. You would not want to enable this option if a program
    has its own file locking. Otherwise, it is a good idea to enable this option on
    files that are shared by multiple users.


    The User Name Mapping service is provided with Windows for UNIX package. It runs
    as a standard Windows service and maps UNIX User Ids (UIDs) to Windows Session
    IDs (SIDs). It maintains the mappings in a table as in the example below:


    | Windows Username | Windows Domain | UNIX Username | UNIX Domain | UID/GID |

    | --- | --- | --- | --- | --- |

    | JohnDoe | Indwinds | Johnd | Indux | 1090/221 |

    | Maryjane | Indwinds | Maryj | Indux | 1223/201 |


    There are several commercial NFS implementations for Windows. They have the advantage
    of working under Windows 95/98. Some of these commercial programs are Hummingbird
    NFS Maestro (http://www.hummingbird.com/products/nc/nfs/), NetManager (http://www.netmanage.com/products/),
    Omni NFS (http://www.xlink.com), and Access NFS (http://www.ssc-corp.com/nfs).
    These commercial programs offer demos on their Web sites if you want to try them.


    There is a free implementation of NFS for Windows NT 4 called SOSSNT. It doesn''t
    have all the bells and whistles of the commercial programs, but it is relatively
    easy to install and set up. It doesn''t run as a system process, so must be run
    from a batch file or at the command line. It is free and open source, however,
    and is available at http://www.loa.espci.fr.winnt. This Web site contains several
    free UNIX utilities for Windows.


    # 16.3.2 Setting up an NFS Client


    Use the NFS Client applet in the Control Panel to set the NFS client for Windows.
    First, choose the method of authentication. You can use Network Information Services
    (NIS) or PC NFS Daemon (PCNFSD). NIS is an authentication used on large nets to
    allow centralized storage of username, passwords, and shares. It is described
    later in the chapter. If you are using NIS, choose the option and fill in the
    server name. If you are not using NIS, choose PCNFSD.


    Next, choose when the client will be authenticated. You can choose to authenticate
    at logon or when the access is shared. This is simply a matter of whether to take
    longer to log on or take longer to access a share.


    Like the Linux client, you can choose the read and buffer sizes (the default is
    64K), the timeout, number of retries, and hard or soft mounts. These can be tuned
    using the'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'method as we used to tune the Linux client. As with the Linux client, hard
    mounts usually work better.


    The Windows NFS client also supports NFS version 3. If the NFS server supports
    version 3, this will provide a significant performance boost on reliable network
    connections. The downside is that an NFS server crash can lead to으로.


    By default, the NFS client allows read, write, and execute by the owner of a file
    and execute for all others that have rights to the file. These defaults can be
    changed in the NFS client setup.


    Filename mapping is important in mixed Windows and Linux environments. Linux treats
    upper- and lower case letters differently and Windows treats them as the same
    letter. For example, Linux would treat the filenames Sample.txt and sample.txt
    as different filenames, but Windows would treat them as the same filename. There
    are several ways to set up filename mapping, but the easiest is to have the Windows
    NFS client create filenames in lower-case but ignore when reading files.


    The NFS client supports symbolic links on the server. A symbolic link is a file
    that points to another file. It is similar to a shortcut on a Windows machine.
    It can point to a local file or even on another machine. By default, the Windows
    client does not resolve or delete unresolved links. It will not allow you to rename
    or delete symbolic links. Do not change this unless you have a good reason. Renaming
    or deleting symbolic links is not a good idea unless you understand how symbolic
    links work. For example, if you delete a symbolic link and re-create a file with
    the same name, it is no longer a symbolic link. You will have two files instead
    of a file that points to another.


    # 16.3.3 Connecting to an NFS Server with Windows


    You can find the NFS shares on a server by typing show mounts <servername> on
    the client. You can then connect to a share by using either the Windows syntax
    or the UNIX syntax. For example, the next available drive to the share home on
    the server mmcunc, can be attached from the command prompt in two different ways.
    This is done to allow compatibility with both UNIX and Windows systems.


    ```

    use * \mmcunc\home (using the Windows syntax)

    use * mmcunc:/home (using the UNIX syntax)

    ```


    Once this is, the share looks and acts like any other network drive on the system.


    # 16.3.4 NFS Gateways


    An NFS gateway allows Windows machines to connect to an NFS server through a gateway
    machine. The advantage of this is that the NFS client software doesn''t have to
    be loaded on all the machines. The disadvantage is that an NFS gateway won''t
    handle high volumes of network traffic. This makes it a good solution for Windows
    clients that only need occasional access to the NFS server.


    An NFS gateway can be set up on a Linux or Windows NT machine. To set up a Linux
    NFS gateway, first set up the NFS client to mount the NFS server export. Then
    set up Samba'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# Setting up an NIS Server on Linux


    to share the NFS mount. The NFS share will look like a normal share on the server
    to the Windows clients.


    For Windows NT, you will need a program like Hummingbird NFS Maestro Gateway,
    Access NFS Gateway, and Reflections NFS Gateway. These programs will allow Windows
    machines to connect to the NFS export through the Windows NT machine running the
    gate-software.


    # 16.3.5 NFS Security


    There many widely available tools that exploit the security vulnerabilities of
    NFS. Any connection to the outside should be through a firewall or another security
    device.


    This is not necessarily an NFS function, but a good general security policy. Edit
    /etc/inetd.conf file and take out any services you don''t need. Any service represents
    a potential security risk. For example, logind rexecec allow you to log in and
    execute remote programs. If these are handy, if you don''t need them, comment
    them out the code below:


    ```

    #shellstreamtcpnowaitaitroot/usr/sbin/tcpdin.rshd

