  md: '# 8.1 Games


    Mesa is very similar to OpenGL. It is so similar that most applications written
    for OpenGL can use Mesa with little or no modification. Many open source programs,
    including WINE, use the Mesa libraries.


    Mesa supports many of the popular 3-D video cards, including 3dfx Voodoo, NVIDIA,
    Matrox MGA-G200 and MGA-G400, ATI RagePro, Intel i810, NVIDIA Riva, S3 VirGE,
    and DRI-based hardware. Information and binaries are available at http://mesa3d.sourceforge.net.


    # 8.1.2 id Software


    Loki is currently pushing games into the Linux arena, but they are certainly not
    the ones. Id Software was one of the first commercial gaming companies to port
    their games to Linux. This is not too surprising, since their early games were
    developed on a Next system, which uses a version of UNIX.


    id Software was formed when three game developers, John Carmack, Adrian Carmack,
    and John Romero, left their jobs at Softdisk publishing after creating the Invasion
    of the Vorticors. After over a year of work, they released their first game, Wolfenstein
    3D, in 1992. It was a popular FPS where you rescued a woman from Nazis.—3-D graphics,
    rapid shooting, and the ubiquitous weapon at the bottom of the screen.


    In 1993, id released Doom, which is probably the most popular game of all time.
    It fixed the problem with only fixed ceiling height. This gave the game a 3-D
    feel by allowing the player to look up and down. It also changed the terrain to
    hellish-looking corridors and demon-monsters. They followed up with Doom II in
    1994.


    In 1996, two important events happened. id released Quake, the successor to Doom-Wolfenstein
    and Doom. In early 1999, id Software released the source code for Quake. They
    also released the source code to two popular games based on Doom: Heretic and
    Hexen. In 1999, re-released Doom under GPL, which would allow others to legally
    sell games based on the Doom source code.


    id continued to improve Quake with the release of Quake II and Quake III. They
    improved not graphics, but the play as well. In single-player mode, the enemy
    stood still and only attacked when you approached it. In Quake, the enemy could
    dodge shots and attack.


    When Quake III was released in early 1999, it became the first time a commercial
    game company released the DOS/Windows, Linux, and Macintosh versions of their
    softare at the same time (www.idsoftware.com).


    # 8.1.3 Unreal Tournament


    id Software is not the only FPS for Linux, though Unreal Tournament (UT) puts
    out an unsupported Linux version. UT is the current-of-the-art in FPS games. The
    system requirements are a 200MHz processor and 32MB of RAM. Realistically, you
    need at least a 400MHz processor, 64MB of RAM or better, and a 3dfx-compatible
    video card. Other 3-D video cards are not supported.'
