    Figure 4.2 VMware is running Linux inside of a Windows NT.


    For the Linux version, download the archive for Linux from www.vmware.com. Next,
    unpack the archive as follows, where xxx represents the version number of VMware:


    ```

    tar zxf vmware-forlinux-xxx.tar.gz

    ```


    Once it is extracted, go to the directory that is created by VMware:

    cd vmware-distrib


    To install, you must be logged in as administrator or equivalent. Run the installation
    program by typing:

    ./install.pl


    When the installation is complete, go to the vmware directory and run the configuration
    utility. This will configure VMware for your system. There will be several questions.
    In most cases, the defaults should be used:

    vmware-config.pl


    When the configuration is complete, you will need to install the license. This
    is obtained from VMware via email. Once you receive this license, make a directory
    .vmware in the vmware executable directory and copy the file named to that directory.


    The installation for Windows NT or 2000 is pretty straightforward. You must be
    logged in as administrator or equivalent to install the program. First, download
    and run the installation program. The program will have a name like vmware-nt-xxx.exe,
    where xxx is the version number.'
