- img_proc: true
  md: 'These are just a few of the many MTAs available. It is not surprising to see
    that there are so many MTAs since email is one of the oldest uses for the Internet.


    **Collaborative Mail.** The two most popular collaborative mail programs are Microsoft
    Exchange and Lotus Notes. Most companies use these programs to not only send email
    to keep a central email directory, share files, and share calendars. The ability
    to interact with these programs is critical if Linux is to be used in a corporate
    environment. While there is the open standard Lightweight Directory Access Protocol
    (LDAP), neither of these two collaborative programs use it.

    Microsoft Exchange currently has a slight lead in popularity over Lotus Notes.
    Exchange consists of two components: the Exchange Server and the Outlook client.
    Currently, the Exchange Server runs only on Windows NT and 2000. The Outlook client
    runs on all versions of Windows.


    There are programs that allow Linux to interact with an Exchange environment.
    On the server side, Hewlett Packard''s OpenMail provides a lower cost replacement
    for Microsoft Exchange Server. It requires that the OpenMail client be installed
    on all client machines, but once this is, the OpenMail server looks just like
    Exchange Server to the Outlook clients. More information on HP OpenMail is available
    at http://www.ice.com/cyc/00/index.html.


    TradeMail is a program that allows Linux machines to act as Outlook clients. It
    consists of server-side components that go on the Exchange server and a client
    on the Linux machine. TradeMail works but is not currently ready for a production
    environment. For more information on TradeMail, go to http://cobra.bynari.net/.


    Lotus Notes

    Lotus Notes was the first collaborative email program. Like Outlook, it consists
    of a server and a client. The Notes server is available for both Linux and Windows
    NT/2000. The Windows server has been out for a while, but the recent addition
    of the Linux server offers a Notes server without the expense of buying Windows
    (http://www.notes.com/home.nsf/welcome/notes and http://www.notes.net/linux).


    There is a Notes client for Windows, but none for Linux. Lotus has said it has
    no plans to develop a client for Linux. If you need a Notes client for Linux,
    some people have had luck with running the Windows client with WINE (http://www.brookelines.com/linux/linuxnotes.html).


    # 5.6 Streaming Media


    Streaming media allows live or recorded audio and video to be used on the Internet.
    While it is relatively new technology, it will become more important as broadband
    internet become more common.'
