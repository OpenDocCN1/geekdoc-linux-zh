    # 6.10 Checkpoints When Importing and Exporting


    Anytime a file is imported or exported, there is a chance of losing formatting
    or data. Some things to check for:


    +   * Total number of pages or sheets—changes in fonts and line spacing can change
    the document size. Check the names and arrangement of the spreadsheets.

    * Page numbers, footnotes, headers, and footers—These may change position and
    may even overlap. Also check the font sizes.

    * Fonts—The font type and size may have changed.

    * Graphics and charts—Unsupported graphics will be displayed as gray boxes. Also
    check the positioning of graphics. Chart styles and data may have changed.

    * Columns—Check the alignment, gutter, and text flow.

    * Tables—Check spacing (height and width), shading, and fonts.

    * Document properties—Check the meta information such as author and date.

    * Special markers—Check special markers such as index and table of contents entries.'
