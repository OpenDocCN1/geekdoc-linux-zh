  md: 'To install UT, you must buy the Windows version and download the Linux binaries
    fromnhttp://fileplanet.com/index.asp?search=Linux+Unreal+Tournament&file=32058.
    Once the file is downloaded, extract the program as follows:


    ```

    gunzip UT-Linux-400A.tar.gz

    t xvf UT-Linux-400A.tar

    ```


    Be aware that UT requires about 500MB of free space. You will also need to have
    libxml and libglade. These libraries are included in the download if you don''t
    have them installed already. Also, don''t install the game as root, or only root
    will be able to play the game. Additionally, make sure that the game CD-ROM is
    mounted as /mnt/cdrom or the install program won''t work.


    The installation directory is UT-Linux-400A. In this directory is the install
    script setup.sh. Running this program inside of X11 is supposed to start the setup
    program. If the setup script doesn''t work, you can start it by typing ./setup.data/bin/x86-glibc-2.1/setup.gtk


    After the installation, you can modify the settings with UnrealTournament.ini
    and User.ini. instructions for modifying these files are in the README file located
    in the installation directory. One glitch in the Linux version is that it doesn''t
    work with the Enlightenment window manager. Since this is the default window manager
    for Gnome, it is better to use KDE or FVWM when using UT. See the later section
    on windows managers for details how to switch.


    Game play for UT is highly configurable. You can play multi-player against other
    players and in single-player mode against configurable "bots". You can configure
    both the number of bots and the skill of the bots.


    UT has 60 levels of play, with many more available for download on the Internet.
    There are also many UT fan and server sites. A good place to start is at http://www.unreal.com/index2.html.


    There are also several variations of the game: Death Match, Capture the Flag (CTF),
    Domination, Last Standing, and Assault. Death Match is the classic play for multi-player
    FPS games. Points are given for each kill and subtracted each time you are killed.
    The person with the most points wins. Capture The Flag is exactly what the name
    says: The first to capture the enemy''s flag wins. Domination is another variant
    where team controls on a map. When a team controls a location, it gets point until
    the other team takes control of the location. Last Standing is similar to Death
    Match, except each player has a limited number of lives. As the name implies,
    the last one lives. Assault is similar to Capture the Flag, except that each team
    turns attacking or defending. The team that completes the attack in the least
    amount of time wins.


    # 8.2 Game Servers and Extras


    Linux is a popular platform to run game servers. This allows many users on a network
    to connect to one game and play each other.'
