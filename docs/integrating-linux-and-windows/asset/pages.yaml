  md: '# CHAPTER

    14


    # CONNECTING LINUX TO

    WINDOWS PCS


    Linux can attach to a networked Windows PC by Windows’ native network capability.

    First, set up networking in Windows using the Network icon in the control panel.


    Several programs are allowed by Linux to connect to Windows machines. The following
    programs are included in most Linux distributions and with Samba: smclient, smbfs,
    smwrapper, smsh, sharity, and smprint.


    smclient is a command-line utility that allows Linux to browse and copy files
    between Linux and Windows.

    sbfs and sharity allows Linux filesystems to be mounted natively on a Linux system.
    The Windows directory will look like a normal Linux directory. sharity and smclient
    also support SSL for encrypted transactions.

    swrapper and smsh allow browsing of Windows files from a Linux machine.

    suntar allows the backup of a Windows machine to a Linux machine.

    smbprint allows Linux to print to a shared Windows printer.


    There are other packages that use these utilities to access Windows computers.
    For example, some Linux backup utilities use smclient to back up Windows clients.

    smbclient is a command-line similar to FTP. It allows Linux to connect to a Windows
    share. Once connected, smclient allows Linux to list and copy files as follows:


    ```

    smclient //alias/c

    Added interface ip=10.0.0.2 bcast=10.0.0.255 nmask=255.255.255.0

    Password:

    ls > ls

    BOOTLOG.TXT      AH      89906 Nov 4 15:24:00 1999

    COMMAND.COM      A       93890 Fri Apr 23 22:22:00 1999

    SUHDOG.DAT       HR      51666 Fri 6 13:15:00 1999

    ....files deleted here for brevity....

    64322 blocks of size 131072. 31108 blocks available

    ```


    Notice that these use forward slashes (/) instead of the Windows standard back
    slash (\). Because Linux treats back slash as an escape character, so in most
    cases where Windows would use a back slash, Linux would use a forward slash.

    We used ls to get a list of files, but dir would work as well. There are several
    commands that smclient can accept once it is connected. These can be listed by
    typing help:


    135'
