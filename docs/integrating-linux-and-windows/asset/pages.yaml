  md: '# Samba FAQ 217


    No, it does not ignore -N, it is just that your server rejected the null password
    in the connection, so smbclient prompts for a password to try again.

    To get the behaviour that you probably want


    ```

    smbclient -L host -U

    ```


    this will not help allow username and password to null, which is an anonymous
    login for SMB. Using -N would only set the password to null, and this is not accepted
    as an anonymous-m login for most SMB servers.


    smbfs for other unixes


    ```

    > mount -ufs \\NTSERVER\MOUNT_DIR /sun_mount_point

    ```


    smbfs is only available for Linux.

    In Samba 2.0 we are introducing a utility called smbd that will provide similar
    functionality that is portable to a wide range of Unixes.


    smbpasswd: rejected session request


    +   > I have installed samba everything seems to be working fine except the

    > smbpasswd executable file i can change a users password as root with

    > no problem but if a users tries to change his own word.. it would

    > give this error:


    +   > smbpasswd: machine 127.0.0.1 rejected the session request.

    > Error : code 131

    > im am not sure what i have to add for it to allow this users to change

    > their own password.. it seems to be defaulting to the local ip

    > address.. ???

    > please help

    > thanks for your time.


    Firstly, make sure that you do NOT have "bind interfaces only = yes" in your smb.conf
    file.

    Secondly, if you have specified "hosts allow = xxx.xxx.xxx.xx/" please add to
    it "localhost". ie: hosts allow = 123.45.67.0/24 127.


    smbpasswd needs to be able to connect to smbd on the local machine, hence it is
    trying to connect to the 127.0.0.1 address.'
  merge: -1
