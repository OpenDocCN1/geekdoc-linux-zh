- img_proc: true
  md: '# smbd (8)


    The server log files should be put in a directory readable and writable only by
    root, as the log files may contain sensitive information.


    The configuration file should be placed in a directory readable and writable only
    by root, as the configuration file controls security for the services offered
    by the server. The configuration file can be made readable by all if desired,
    this is not necessary for correction of the server and is not recommended. A sample
    configuration file "smbd.conf.sample" is supplied with the source to the server—this
    may be renamed to "smbd.conf" and modified to suit your units.


    The remaining nodes will assume the following:


    +   - smbd (the server program) installed in /usr/local/samba/bin

    - smbd.conf (the configuration file) installed in /usr/local/samba/lib

    - log files stored in /var/adm/smblogs


    The server may run either as a daemon by users or at startup, or it may be run
    from a meta-daemon such as inet upon request. If run as a daemon, the server will
    always be ready, so sessions will be faster. If run from a meta-daemon some memory
    will be saved and utilities such as the tcpd TCP-wrapper may be used for extra
    security. For use as server file it is recommended that smbd run as a daemon.


    When you''ve decided, continue with either RUNNING THE SERVER AS A DAEMON OR RUNNING
    THE SERVER ON REQUEST.


    # Running the Server as a Daemon


    To run the server as a daemon from the command line, simply put the **-D** option
    on the command line. There is no need to place an ampersand at the end of the
    command line—the **-D** option causes the server to detach itself from the tty
    anyway.


    Any user can run the server as a daemon (execute permissions permitting, of course).
    This is useful for testing purposes, and may even be useful as a temporary substitute
    for something like ftp. When run this way, the server will only have the privileges
    of the user who ran it.


    To ensure that the server runs as a daemon whenever the machine is started, and
    to ensure that it runs as root so that it can serve multiple clients, you will
    need to modify the system startup files. Wherever appropriate (for example, in
    /etc/rc), insert the following line, substituting port number, file location configuration
    file location and debug level as desired:


    ```

    /usr/local/samba/bin/smbd

    -D -l /var/adm/smblogs/log -s

    /usr/local/samba/lib/smbd.conf

    ```


    (The above should appear in your initialization script as a single line. Depending
    on your terminal characteristics, it may not appear that way in this man page.
    If the above appears as more than one line, please treat any newlines or indentation
    as a single space or TAB character.)'
  merge: -1
  pgno: 346
- img_proc: true
  md: 'If the options used at compile time are appropriate for your system, all parameters
    except-D may be omitted. See the section OPTIONS above.


    # Running the Server on Request


    If your system uses a meta-daemon such as inet, you can arrange to have the smbd
    server started whenever a process attempts to connect to it. This requires several
    changes to the startup files on the host machine. If you are experimenting as
    an ordinary user rather than root, you will need the assistance of your system
    administrator to modify the system files.


    You will probably want to set up the NetBIOS server nmbd at the same time as smbd.
    To do this refer to the main page for nmbd (8).


    First, ensure that port is configured in the file /etc/services. The well-known
    port 139 should be used if possible, though any port may be used. Ensure that
    a line similar to the following is in /etc/services:


    ```

    netbios-ssn 139/tcp

    ```


    Note for NIS/YP users—you may need to rebuild the NIS service maps rather than
    alter your local /etc/services file.


    Next, put a suitable line in the file /etc/inetd.conf (in the unlikely event that
    you are using a meta-daemon other than inetd, you are on your own). Note that
    the first item in this line matches the service name in /etc/services. Substitute
    appropriate values for your system in this line (see inetd (8)):


    ```

    netbios-ssn tcp nowait /usr/local/samba/bin/smbd -d1 -l /var/adm/smlogs/log -s/usr/local/samba/lib/smbd.conf

    ```


    (The above should appear in /etc/inetd.conf as a single line. Depending on your
    terminal characteristics, it may not appear that way in this man page. If the
    above appears more than one line, please treat newlines or indentation as a single
    space or TAB character)


    Note that there is need to specify a port number here, even if you are using a
    non-standard port number.


    Lastly, edit the configuration file to provide suitable services. To start with,
    the following two services you will need:


    ```

    [homes]

    writeable = yes

    [printers]

    writeable = no

    printable = yes

    path = /tmp

    public = yes

    ```


    This will allow you to connect to your home directory and print to printer supported
    by the host (user privileges permitting).'
