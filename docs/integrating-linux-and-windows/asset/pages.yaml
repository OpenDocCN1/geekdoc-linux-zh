    (another automounter maps).


    NB: A working NIS is required on the system for this option to work.


    See also "homidir", domain logons.


    Default: homidir map = auto.home


    Example: homidir map = amd.homidir


    +   - hosts allow (S)


    Synonym for allow hosts.


    +   - hosts deny (S)


