  md: '# CHAPTER


    # BUSINESS APPLICATIONS


    For our purposes, business applications are programs running loan an individual
    PC that perform business functions. The top-selling software titles are loaded
    with various business applications. For instance, the top-selling Microsoft Office
    is a bundle of common business applications, including a word processor (Word),
    spreadsheet (Excel), and presentation software (PowerPoint).


    Some versions of Microsoft Office contain an email and calendar program (Outlook)
    and a database (Access). Both of these applications are covered in other chapters.


    Financial programs such as Intuit''s Quicker and Microsoft Money are also essential
    business programs. Graphics programs such as Adobe Photoshop, Corel Draw, and
    Microsoft Visio round out the list of business programs.


    # 6.1 Microsoft Office


    With a 95% market share, Microsoft Office is the 800-pound gorilla of productivity
    suites. If you get a document, spreadsheet, or presentation from someone else,
    there is a good chance it is a Microsoft Office file.


    With that, for Linux to become popular on the desktop, it must have a program
    similar to Microsoft Office and it must also be able to read and write Office
    files.


    Linux has several programs that are similar to Microsoft Office. Most of them
    are available in Windows versions. None of them are a complete, drop-in replacement
    for Microsoft Office. Each program has its strengths and weaknesses that need
    to be considered.


    Working with Office files is a major problem. Since each Office application uses
    a proprietary format, the file formats have to be reverse-engineered before other
    programs can open them. The problem is compounded by the fact that the Office
    applications are tightly integrated with each other and the Windows operating
    system. Currently, no Linux application is 100% compatible with Office files,
    but some are better than others.


    # 6.2 Corel WordPerfect Office


    Although it doesn''t have near the market share of Microsoft Office, Corel WordPerfect
    Office is the second most popular productivity suite on the market. It has all
    the same functions as'
