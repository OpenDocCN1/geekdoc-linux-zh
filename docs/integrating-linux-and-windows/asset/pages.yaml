    Be sure to leave the Input Filter field blank.


    # 15.3 Setting up Samba for Printing


    Once the printcap file is set up, the only thing needed to set up the printers
    for Samba is to add the printers section to the smb.conf file.


    ```

    [printers]

    path = <path of spool file>

    printable = yes

    ```


    These are the are parameters for the printers section. This will load the printcap
    and allow Samba printing.


    A few details can trip up Samba printing if they are not taken care of. Make sure
    the directory in the path parameter is writable by everyone. This allows Samba
    to write its printer files to the directory. If the path variable is not writable,
    use chmod to change the per-missions:


    ```

    chmod 622 <path of spool file>

    ```


    Also, /dev/null needs to be writable. Samba needs this file to discard output
    external commands. If it is not writable, use chmod again:


    ```

    chmod 622 /dev/null

    ```


    The default setup for Samba will use the Linux print driver. If you are okay,
    you need to do anything else. unless you want to use the client''s print driver.
    This is usually the case with Windows clients, since Windows supports a wider
    selection of printers than Linux.


    To use the client''s print driver, first you must create a printcap entry for
    it. Use-tool to create a printer named raw, but not set up an input filter. Set
    the device-normally, e.g., /dev/lp0 for parallel port 1, etc. Then save the setup.
    It will create an entry similar to this in the printcap file:


    ```

    raw=

    :dev=/var/spool/lp1/raw:

    mx#0:\nsh:\nlp=/dev/lp0:

    ```


    ```

    [printers]

    path = <path of spool file>

    printable = yes

    print command = lpr -P%p %s

    ```'
  merge: -1
