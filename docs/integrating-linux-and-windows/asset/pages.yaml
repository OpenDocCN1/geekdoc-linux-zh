  md: '# 10.3.7 VNC Security


    VNC encrypts the password, but once the session is started, it is unencrypted.
    Even though it is unencrypted, it would be harder to snoop on a VNC session than
    a telnet or X11 session. If you need more security, it is relatively easy to add
    since VNC uses a TCP/IP socket. There are several packages that can add security
    to VNC such as Secure Shell (SSH), SSLay, SOCKS, and TCP Wrappers.


    SSH can add encryption to any TCP/IP service. The installation of SSH is covered
    in an earlier chapter. It consists of a client and a server. To use VNC with SSH,
    run the SSH server (sshd) on the machine with the VNC server, start the SSH client
    on the machine with the VNC viewer, start up the VNC viewer.


    The syntax of the ssh connection is complex until you break it down. The syntax
    to connect session 1 on mmcune:


    ```

    ssh -L 5902:mmcune:5901 mmcune

    ```


    This looks complicated until it is broken down. SSH is the SSH client, -L is the
    local machine, 5902 is the port number of the local machine, mmcune:5901 is the
    port number on mmcune and finally, mmcune is the remote SSH host.


    So, this would redirect the local Port 5902 to Port 5901 on mmcune. To start a
    VNC session, we would open the VNC client on Port 5202 (session 2) on the local
    machine. This would be redirected to Port 5901 (session 1) on mmcune:


    ```

    vncviewer@localhost:2

    ```


    SSH also supports compression if you add the -c option to the command line. This
    is especially important over slow connections such as modem connections. You can
    also add compression to the configuration options. These and other options are
    explained in the section on SSH. Another switch we will use later is -g, which
    allows hosts to connect to local port forwarding ports.


    Now, let''s do something more complicated with SSH. Let''s say we have two networks
    connected by an Internet connection. On each side of our network, we have Windows
    Workstations. We are using a Linux machine running SSH on each side of the Internet
    connection. We are running VNC client on a Windows machine on the first network
    (Windows1) and connecting to a VNC server on a Windows machine on the second network
    (Windows 2).


    Windows1 -> Local network 1 -> Linux1 -> Internet Connection -> Linux2 -> Local
    Network 2 -> Windows2


    This is how each machine would be set up:


    ```

    Windows1—Runs vncviewer Linux1:1.

    Linux1—Runs ssh -g -L 5901:windows2:5900 linux2.

    Linux2—Runs the SSH server, sshd.

    Windows2—Runs vncserver display 0.

    ```


    The VNC viewer on Windows1 connects to Linux1, which forwards the packets to SSH
    Linux2. Linux2 then forwards the packets to Windows2.'
