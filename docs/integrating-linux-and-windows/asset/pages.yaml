- img_proc: true
  md: 'Samba currently needs ships with the following code page files :


    +   * Code Page 437—MS-DOS Latin US

    * Code Page 737—Windows ‘95 Greek

    * Code Page 850—MS-DOS Latin 1

    * Code Page 852—MS-DOS Latin 2

    * Code Page 861—MS-DOS Icelandic

    * Code Page 866—MS-DOS Cyrillic

    * Code Page 932—MS-DOS Japanese SJIS

    * Code Page 949—MS-DOS Korean Hangul

    * Code Page 950—MS-DOS Traditional Chinese


    This parameter may have any of the values 437, 737, 850, 852, 861, 936, 949, or
    950. If you don''t find the conversion, read the comments in one of the other
    code page files and make the `_smbccodepage` (I) name and write one. Please remember
    to donate it to the Samba user community.


    This parameter co-operates with the "valid chars" parameter in determining what
    characters are valid in filenames and how capitalization is. If you set both this
    parameter and the "valid chars" parameter the "client code page" parameter MUST
    be set before the "valid chars" parameter in the smb.conf file. The "valid chars"
    string will then augment the charset in the settings of the "client code page"
    parameter.


    If not, "client code page" defaults to 850.


    Default: client code page = 850

    Example: client code page = 936


    +   * codingsystem (G)

    This parameter is used to determine how incoming Shift-JIS Japanese characters
    are mapped from the incoming "client code page" used by the client, to names in
    the UNIX filesystem. Only useful if "client code page" is set to 932 (Japanese
    Shift-JIS).

    The options are :

    * SJIS Shift-JIS. Does not convert the incoming filename.

    * JIS8, J8B, J8H, J8@, J8@J, J8@H Convert from incoming Shift-JIS to eight bit
    code with different shift-in, shift out codes.

    * JIS7, J7B, J7H, J7@, J7@J, J7@H Convert from incoming Shift-JIS to seven bit
    code with different shift-in, shift out codes.

    * JUNET, JUBB, JUBH, JU@, JU@J, JU@H Convert from incoming Shift-JIS to JUNET
    code with different shift-in, shift out codes.

    * EUC Convert an incoming Shift-JIS character to EUC.

    * HEX Convert an incoming Shift-JIS character to a 3 byte hex representation,
    i.e. :AB.'
