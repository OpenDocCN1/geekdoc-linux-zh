  md: '# CHAPTER 8


    # FUN AND GAMES


    # 8.1 Games


    Let''s face it, for home users, having a lot of cool games is a compelling reason
    for using a computer. Many of the early adopters Linux tend to be active gamers.
    As Bob Young, the CEO of Redhat Linux put it, “Computer games designed for the
    Linux operating system are important in spurring the growth of the free-software
    industry” (http://www.techweb.com/wire/story/TWB199902S0014).


    Right now, Windows 9x is the king of the PC gaming platforms. This is mostly due
    to the fact that Windows 9x has about 80% of the PC market share. In fact, a lot
    of Linux users keep a Windows 9x partition on hard drive just for games. Another
    large part of Windows’ success on the game platform is due to Microsoft’s DirectX.


    DirectX is a set of Application Program Interfaces (APIs) that allows accelerated
    graphics and sound. Since it is hardware-independent, a program that uses DirectX
    doesn''t need to worry about the type of hardware used on the PC. Currently, only
    Windows 9x and 2000 support DirectX. Further information on DirectX is available
    at http://www.microsoft.com/directx.


    Although Linux is behind Windows as a gaming platform, it is rapidly catching
    up. Interest in Linux gaming is at an all-time high and many popular games are
    being developed for the platform.


    # 8.1.1 Loki


    Loki entertainment software is at the forefront of Linux gaming. Loki was founded
    in August 1998 with the goal of bringing a wide range of commercial games to Linux.
    It signed its first contract on December 31, 1998 to port Activision’s popular
    strategy game “Civilization—Call to Power”. When the game hit the shelves the
    next spring, it proved that a Linux game could equal to its Windows counterpart.
    It also showed that commercial companies could make extra money, since porting
    a game requires a lot effort and risk than developing a new game (www.lokigames.com).


    This led to several other contracts. Some of the other games Linux has brought
    to are:


    +   - Myth II – Soulblighter—A fantasy/adventure game from Bungie.

    - Railroad Tycoon II and Second Century Expansion Pack—A strategy/simulation game
    from Pop Top Software and Gathering of Developers..'
