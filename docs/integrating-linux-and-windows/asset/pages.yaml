  md: "# smb.conf (5) 285\n\nThis chat sequence is often quite specific, depending\
    \ on what local methods are used for password control (such as NIS etc).\n\nThe\
    \ string can contain the macros \"%o\" and \"%n\" which are substituted for the\
    \ old and new passwords respectively. It can also contain the standard macros\
    \ \"\\n\", \"\\r\", \"\\t\" and \"\\s\" to give line-feed, carriage-return, and\
    \ tab space.\n\nThe string can also contain '*' which matches any sequence of\
    \ characters.\n\nDouble quotes can be used to collect strings in any part of the\
    \ chat sequence as a fullstop \". then no string is set. Similarly, the expected\
    \ string is a fullstop then no string is expected.\n\nNote that if the \"unix\
    \ password sync\" parameter is set to true, then this sequence is called \"AS\
    \ ROOT\" when the password in the smbpasswd file is changed, without access to\
    \ the old password cleartext. This old password cleartext is set to \" (the empty\
    \ string).\n\nSee also \"unix password sync\", \"passwd program\" and \"password\
    \ debug\": Example:\n\n```\npassword chat = \"*Enter OLD password*\" %o\\n \"\
    *Enter NEW password*\" %n\\n \"*Reenter NEW password*\" %o\\n \"*Password changed\"\
    \n```\n\nDefault:\n\n```\npassword chat = *oldpassword* %o\\n *newpassword* %n\\\
    n*newpassword* %n\\n*changed\n```\n\n+   - passwd debug (G)\n boolean specifies\
    \ if the passwd chat parameter is in \"debug\" mode. In this mode the strings\
    \ passed to and received from the passwd chat are printed in the smbd log with\
    \ a \"debug level\" of 100. This is a dangerous option as it will allow plaintext\
    \ passwords to be seen in the smbd log. It is available to help Samba admins debug\
    \ their \"passwd chat\" calls when calling the \"passwd program\" and should be\
    \ turned off after this has done. This parameter is off by default.\n\nSee also\
    \ \"passwd chat\", \"passwd program\":\nExample: passwd debug = False\n\n+   -\
    \ passwd program (G)\nThe name of a program that can be used to set UNIX users.\
    \ Any occurrences of %u will be replaced with the user name. The user name is\
    \ checked for existence before calling the password changing program.\nAlso note\
    \ that many passwd programs insist in \"reasonable\", such as minimum length,\
    \ or the inclusion of mixed case chars and digits. This can pose a problem as\
    \ some clients (such as Windows for Workgroups) uppercase the password before\
    \ sending it."
