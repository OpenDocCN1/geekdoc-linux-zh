  md: '# CHAPTER 13

    SETTING UP SAMBA AS A WINDOWS NT SERVER


    Linux and Samba can perform many of the functions of a Windows NT server. The
    combination can be set as a stand-alone server on a network or as part of an existing
    network. We will set up a Linux and Samba server, then discuss the advantages
    and limitations of using Linux and Samba. Windows NT.


    # 3.1 Setting up Samba as a Stand-Alone Windows NT File Server


    We will now put our knowledge to practical use. First we will set up Samba as
    a stand-alone server on a new network. Later on we will add Samba server to an
    existing network.


    There are IP addresses that are reserved for private networks (networks that are
    not directly connected to the Internet). See Table 13.1 below for a list of addresses
    that can be used on private networks.


    Table 13.1 Address ranges for private IP networks

    | Class | IP Address | Subnet of Mask |

    | --- | --- | --- |

    | A | 10.X.X.X | 255.0.0.0 |

    | B | 172.16.X.X | 255.255.0.0 |

    | C | 192.168.X.X | 255.255.255.0 |


    Next, we need to decide whether to use fixed or dynamic IP addresses on our workstations.
    Fixed IP addresses are set up on each station individually. Dynamic IP addresses
    are pulled from the server using Dynamic Host Configuration Protocol (DHCP). Since
    it is easier to set up the IP configuration on the server rather than each workstation,
    we are going to use DHCP. If we decide to use fixed IP addresses, however, setting
    up DHCP would be unnecessary.'
