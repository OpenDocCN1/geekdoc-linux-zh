    contents and an NMAKE build will proceed as expected.


    **Default:** fake directory create times = False


    **Example:** fake directory create times = True


    +   - **fake oplocks (S)**

    - Oplocks are the way SMB clients get permission from a server to locally cache
    file operations. If a server grants an oplock (opportunistic lock) then the client
    is free to assume that it is the only one accessing the file and it will aggressively
    cache data. With some oplock types the client may enable cache file open/close
    operations. This can give enormous performance benefits.


    When you set "fake oplocks = yes" **smbd** will always grant oplock requests no
    how many clients are using the file.


    It is generally much better to use the real **oplocks** support rather than read-only
    shares or shares that you know will only be accessed from one client at a time
    as physically read-only media like CDROMs, you will see a big performance improvement
    on many operations. If you enable this option on shares where multiple clients
    may be accessing the files read-write at the same time you get data corruption.
    Use this option carefully!


    This option is disabled by default.


    +   - **follow symlinks (S)**

    This parameter allows the Samba administrator to stop smbd from following symbolic
    links in a particular share. Setting this parameter to “No” prevents any file
    or directory that is a symbolic link from being followed (the user will get an
    error). This is very useful to stop users from using a symbolic link to /etc/passwd
    in their home directory for instance. However it will slow down filename lookups
    down slightly.


    This option is enabled (i.e. smbd will follow symbolic links) by default.


    +   - **force create mode (S)**

    This parameter specifies a set of UNIX mode permissions that will *always* be
    set on a file created by Samba. This is done by bitwise ‘OR’ing these bits onto
    the mode of a file that is being created. The default for this parameter is (in
    octal)000. The modes in this parameter are ‘OR’ed onto the file mode after the
    mask set in the “create mask” is applied.


    See also the parameter “create mask” for details on masking bits on created files.


    **Default:** force create mode = 000


    **Example:** force create mode = 0755


    would force all created files to have read and execute permissions for ‘group’
    and ‘other’ as well as the read/write/execute bits set for the ‘user’.'
