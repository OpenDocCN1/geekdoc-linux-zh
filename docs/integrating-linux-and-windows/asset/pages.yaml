  md: '64


    Chapter 6 • Business Applications


    # 6.7 Exporting MS Office Files


    Fortunately, MS Office allows the user to save files in a wide variety of formats.
    Besides allowing saving in older formats, MS Office allows saving files in formats
    of competing pro-grams such as WordPerfect, Lotus 123, Quatro Pro, Freelance,
    and many others. While the conversion is not perfect, it at least allows MS users
    to exchange files with non-MS Office users as long as the MS user knows what the
    other person is using.


    If the format is unknown, you can use a portable format such as Rich Text Format
    (RTF), Hypertext Markup Language (HTML), Extensible Markup Language (XML), Portable
    Document Format (PDF), Data Interchange Format (DIF), delimited text, or plain
    text (TXT or ASCII). All of these formats can potentially lose data, so it is
    better to save in the native Office format as well.


    RTF is a format originally used by MS Word to allow easy exchange of documents
    with other word processors. It doesn''t support all the advanced features of MS
    Word, but it is supported by all modern word processors (http://msdn.microsoft.com/library/specs/richtformatrspecificationsamplereaderprogramversion5.html).


    HTML is the format used by the World Web (WWW). One major advantage of HTML is
    that all operating systems include a Web browser


    XML is similar to HTML except that it is more flexible. HTML has a limited set
    of for-matting options that are defined by the HTML standard. XML allows the creation
    of user-defined tags, which allows for more formatting options. XML also promises
    to deliver one of the holy grails of data processing—the separation of data from
    the formatting. This would allow data to be stored in one place and then delivered
    in multiple formats. The problems with XML is that it is still an evolving standard
    and it isn''t supported by all programs (www.w3.org/xml).


    PDF is a standard created by Adobe that allows documents to be displayed on a
    variety of formats. It is a popular way of creating government and legal documents
    since it is portable and supports many modern formatting features. Adobe has programs
    that create and read PDF files on Linux, Windows, and many other platforms. Adobe
    has a free PDF reader and there is also a free Linux viewer. In addition, many
    other programs such as word processors can create PDF files.


    There are some open source programs that help with PDF files. xpdf will open PDF
    files, although it sometimes has problems viewing some PDF files. Ghostscript
    will convert PostScript printer files to PDF.


    DIF is a format used by databases as a way of exchanging files. It is supported
    by many spreadsheet and database programs.


    Delim text is another another of exchanging data from spreadsheet and database
    programs. It is much simpler than the DIF format and it is supported by all modern
    word processing, spreadsheet, and database programs (http://www.microsoft.com/enable/download/products/office/office97/part06.html).


    Standard text, also known as ASCII (American Standard Code for Information Interchange),
    is the standard format for storing text in both DOS and UNIX systems. It doesn''t
    support any formatting, but can be read by virtually any computer program. DOS
    and'
