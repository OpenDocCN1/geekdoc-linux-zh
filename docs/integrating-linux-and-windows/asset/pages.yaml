- img_proc: true
  md: '# smb.conf (5) 311


    UNIX username in that group. The special client ''*'' is a wildcard and matches
    any name. Each line of the map file may be up to 1023 characters long.


    The file is processed on each line by taking the supplied username and comparing
    it with each username on the right side of the ''='' signs. If the supplied name
    matches any of the names on the right side then it is replaced with the name on
    the left. Processing continues with the next line.


    If any line begins with a ''#'' or a '';'' then it is ignored


    If any line begins with an ''!'' then the processing will stop after that line
    if a mapping was done by the line. Otherwise mapping continues with every line
    being processed. Using ''!'' is most useful when you have a wildcard mapping line
    later in the file.


    For example to map from the name "admin" or "administrator" to the UNIX name "root"
    you would use:


    ```

    root = admin administrator

    ```


    Or to map anyone in the UNIX group "system" to the UNIX name "sys" you would use:


    ```

    sys = @system

    ```


    You can have many mappings as you like in a username map file.


    If your system supports the NIS NETGROUP option then the netgroup database is
    checked before the /etc/group database for matching groups.


    You can map Windows usernames that have spaces in them by using double quotes
    around the name. For example:


    ```

    tridge = "Andrew Tridgell"

    ```


    would map the windows username "Andrew Tridgell" to the unix username tridge.


    The following example would map mary and fred to the unix user sys, and map the
    rest to guest. Note the use of the ''!'' to tell Samba to stop processing if it
    gets a match on that line.


    ```

    !sys = mary fred

    guest = *

    ```


    Note that the mapping is applied to all occurrences of usernames. If you connect
    to \server\fred and "fred" is remapped to "mary" then you will actually be connecting
    to \server\mary and will need to supply a password suitable for "mary" not "fred".
    (if you have one). The password server will receive whatever username the client
    supplies without modification.


    Also note that no reverse mapping is done. The main effect is this that users
    who have mapped may have troubling printing jobs as PrintManager under WifWg think
    they don''t own the job.


    Default: no username map


    Example: *username map = /usr/local/samba/lib/users.map'
  merge: -1
