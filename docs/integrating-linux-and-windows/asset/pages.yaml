    Synonym for “root directory”.


    +   - root directory (G)


    The server will "chroot() (i.e. Change it root directory) to this directory on
    startup. This is not strictly necessary for secure operation. Even without it
    the server will deny access to files not in one of the service entries. It may
    also check for, deny access to, soft links to other parts of the filesystem, or
    attempts to use “. . .” in file names to access other directories (depending on
    the setting of the “wide links” parameter).


    Adding a “root directory” entry other than / adds an extra level of security,
    but it absolutely ensures no access is given to files in the sub-tree specified
    in the “root directory” option .including some files needed for complete operation
    of the server. To maintain full operability of the server you will need to mirror
