  md: '# Chapter 15 • Printing with Samba


    Next, try Print PostScript test page. If the ASCII test page works and Postscript
    doesn’t, there is a problem with your printer driver. Make sure you have the proper
    input filter (or driver) selected. Next, check to see if Ghostscript is installed
    properly. If this isn’t the case, try a different filter. Many printers are compatible
    with other printer drivers. See the Web sites listed above for printer compatibility
    and Ghostscript troubleshooting.


    Sometimes, turning off the Suppress Headers option can cause a printer not to
    print. Try turning it on if your printer still doesn’t.


    If you are getting stair-stepped text on a text-only printer, try turning on the
    Fix Stair Stepping option. If it looks like the printer is accepting data (most
    printers have a blinking data light) and nothing prints, try turning on the Send
    EOF option.


    Hewlett Packard (HP) JetDirect printers need to send non-text output as raw on
    the queue option, which is set on the JetDirect port. A JetDirect printer is an
    HP printer that has a port that connects it directly to the network.


    To set up a JetDirect card, set up the printer’s IP address. This is done through
    the menu on the front panel. See your printer’s instruction manual for instructions.


    There are two ways to set up the JetDirect card. One is to simple telnet into
    the JetDirect card’s IP address, type ? for help or for a list of current settings.
    Once connected, change a parameter listed, type: parameter name: setting.


    For a more advanced administration tool, go to http://www.hp.com/support/net_printing
    and download the HP JetAdmin for Linux (see Figure 15.6). This will allow you
    to administer JetDirect cards from your window.


    ![](img/a1ad58e4259f15e8b2826ecf57a28362_167_0.png)


    Figure 15.6 HP JetAdmin for Linux.'
