- img_proc: true
  md: '# Description


    This program is part of the Samba suite.


    The smbpasswd has several different functions, depending on whether it is run
    by the root user or not. When run as a normal user it allows the user to change
    the password used for their SMB sessions on any machines that store SMB passwords.


    By default (when run with no arguments) it will attempt to change the current
    users SMB password on the local machine. This is similar to how the passwd (1)
    program works. smbpasswd differs from how the passwd program however in that it
    is not setuid root but works in a client-server mode and communicates with a locally
    running smbd. Also as a consequence for this to succeed the smbd daemon must be
    running on the local machine. On a UNIX machine the encrypted SMB passwords are
    usually stored in the smbpasswd (5) file.


    When run by an ordinary user with no options. smbpasswd will prompt them for their
    old password and ask them for their new password twice, to ensure that the new
    password was typed correctly. No passwords will be echoed on the screen while
    being typed. If you have a blank sm password (specified by the string “NO PASSWORD”
    in the smbpasswd file) then just press the <Enter> key when asked for your old
    password.


    smbpasswd can also be used by a normal user to change their SMB password on remote
    machines, such as Windows NT Primary Controllers. The (-r) and -U options below.


    When run by, smbpasswd allows new users to be added and deleted in the smpasswd
    file, as well as allows changes to the attributes of the user in this file to
    be made. When run by, smbpasswd accesses the local smbpasswd file directly, enabling
    changes even if smbd is not running.


    # Options


    +   - a This option specifies that the username following the smbpasswd file,
    with the new password typed (type <Enter> for the old password). This option is
    ignored if the username following already exists in the smbpasswd file and it
    is treated like a regular change password command. Note that the user to be added
    must already exist in the system password file (usually /etc/passwd) else the
    request to add the user will fail.


    This option is only valid when running smbpasswd.


    +   - d This option specifies that the username following should be disabled in
    the local smbpasswd file. This is done by writing a ‘D’ flag into the account
    control space in the smbpasswd file. Once this is done all attempts to authenticate
    via SMB using this username will fail.


    If the smbpasswd file is in the ‘old’ format (Pre-Samba 2.0) there is no space
    in the users entry to write this information and so the user is disabled by writing
    ‘X’ characters into the smbpasswd file. See smbpasswd (5) for details on the ‘old’
    and new password formats.'
  merge: -1
  pgno: 353
- img_proc: true
  md: 'smbpasswd (8)


    This option is only available when running smbpasswd as root.


    +   - -e This option specifies space in the username following should be enabled
    in the local smbpasswd file, if the account was previously disabled. If the account
    was not disabled this option has no effect. Once the account is enabled then the
    user will be able to authenticate to SMB once again.


    If the smbpasswd file is in the ''old'' format then smbpasswd will prompt for
    a password for this user, otherwise the account will be enabled by removing the
    ''D'' flag from account space in the smbpasswd file. See smbpasswd (5) for details
    on the ''old'' and new password formats.


    This option is only available when running smbpasswd as root.


    +   - -debuglevel debuglevel is an integer from 0 to 10. The default value if
    this parameter is not zero.


    The higher value, the more detail will be logged to the log files about the activities
    of smbpasswd. At level 0, only critical errors and serious warnings will be logged.


    Levels above 1 will generate considerable amount of log data, and should only
    be used when investigating a problem. Levels above 3 are designed for use only
    by developers and generate HUGE amounts of log data, most of which is entirely
    cryptic.


    +   - n This option specifies that the username following should have their password
    set to null (i.e, a blank password) in the local smbpasswd file. This is done
    by writing the string "NO PASSWORD" as the first part of the first password stored
    in the smbpasswd file.


    Note that to allows users to login to a Samba server where the password has been
    set to "NO PASSWORD" in the smbpasswd file the administrator must set the following
    parameter in the [global] section of the smb.conf file:


    ```

    null passwords = true

    ```


    This option is only available when running smbpasswd as root.


    +   - r remote machine allows users to wish to change their password on. Without
    this parameter smbpasswd defaults to the local host. The "remote machine name"
    is the NetBIOS name of the SMB/CIFS server to contact to attempt the password
    change. This name is resolved into an IP address using the standard name resolution
    mechanism in all programs of the Samba suite. The -R name resolve order parameter
    for details on changing this resolution.


    The username whose password is changed is that of the current UNIX logged on user.
    See the -U username parameter for details on changing the password for a different
    user-name.


    Note that if joining a Windows NT Domain the remote name specified must be the
    Primary Domain Controller for the domain (Backup Domain Controllers only have
    a read-only copy of the user account database and will not allow the password
    change.'
