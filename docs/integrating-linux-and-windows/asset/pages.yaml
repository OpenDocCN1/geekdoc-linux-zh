  md: '# FreeMWare


    ![](img/a1ad58e4259f15e8b2826ecf57a28362_52_0.png)


    **Figure 4.5** Adjusting the guest operating system''s priority in Global Preferences.


    Another thing to watch for: If you have a DOS session running in VMware, it will
