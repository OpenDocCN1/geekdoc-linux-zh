    #  1.6 Partitioning an Existing Hard Drive


    Although the best way to load Linux on a separate partition is to load it onto
    its own hard drive, not everyone has more than one hard drive. With hard drives
    selling for about $100 these days, it is less of a problem, but if you must, load
    Linux onto a separate partition on the same hard drive as Windows. There are several
    programs that allow you to manipulate partitions. If you have 200–120 MB available
    on your hard drive, you can create a Linux partition out of the free space.


    The first thing to do before manipulating the partitions is to back up your hard
    drive. Next, run scandisk on the drive in thorough mode to make sure there are
    no errors that could cause problems. Defragment the hard drive with the Windows
    defrag This will move all the files to the beginning of the drive and free up
    space at the end of the drive for a new partition.


    Before we reprint the drive, keep in mind that the boot of both operating systems
    must be within the first 1024 cylinders of the hard drive. This is within the
    first 504 MB on most hard drives. This is a limitation of PC hardware that dates
    back to when the maximum size of hard drives was 504 MB.


    Once we have backed up and checked the drive, we need to decide how to partition
    the drive: the hard way or the easy way. Let’s start with the hard way.'
