  md: 'Internet Security


    +   - W—Has no resident pages.

    - <High-priority process.

    - N—Low-priority task.

    - L—Has pages locked into memory (real-time and custom IO).


    The fourth field is the amount of time the program has been running. Notice that
    most of the values are here 0. The reason for this is that most programs run for
    a short time then sleep until needed again, which resets the time to 0.

    The fifth field is the process name.

    To check for open ports, use netstat -a | more. This will bring up something like
