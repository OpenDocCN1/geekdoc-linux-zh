  md: "# Chapter 17 • Implementing FTP, telnet and Other UNIX Protocols\n\nIf you\
    \ experience problems with multi-hosted hosts (multi-hosted simply means more\
    \ than one IP address), which usually occurs on devices that have more than one\
    \ network card as bridges and gateways, the client may not have all the IP addresses\
    \ used by the host. Having a properly configured network will solve most of these\
    \ problems. In particular, make sure the DNS server has all the IP addresses for\
    \ the host and the client is using the DNS server. Also, do an nslookup to see\
    \ if all the IP addresses appear.\n\nThere is also the Perl script, which loads\
    \ the SSH client and helps prevent problems with multi-hosted hosts. I can't say\
    \ it works, but it might be worth a try:\n\nPeter Polkingthorne, Computer Centre,\
    \ Brunel University, Uxbridge, UB8 3PH, | Peter.Polkingthorne@brunel.ac.uk +44\
    \ 1895 274000 x2561 UK | ---\n\n```\n# just run perl on stdin\n/usr/local/bin/perl5\
    \ /LOCAL/etc/ssshrc.pl\n\n\n# perl script to xauth for all interfaces - derived\
    \ from Paul Pomes script.\n\n\n# check there is a cookie to add:\nexit unless\
    \ $proto_cookie = <>;\n\n\n# check we need the X11 forwarding\nexit unless ($dpy\
    \ = $ENV{'DISPLAY'});\n\n\n# extract host/dpynum elements\n$dpy = /(.*):(.*)\\\
    $/ || die \"Bad DISPLAY $dpy\";n$host = $1;\n$dpynum = $2;\n\n# find out the interfaces\n\
    open(INTERFACES, \"/usr/sbin/ifconfig -a\") || die \"Cannot execute ifconfig\"\
    ;\n$xauth = \"/usr/open/bin/xauth\"; open(XAUTH, \"$xauth -q -\") die \"Cannot\
    \ execute xauth\";\n\nwhile (<INTERFACES>) {\n  if (/inet\\s+([0-9.]+)/) {\n \
    \   $addr = $1;\n    next if $addr eq \"127.0.0.1\";\n    print XAUTH \"add $addr:$dpynum\
    \ $proto_cookie\";\n  }\n}\n\n# add unix domain (NB) only once - to default sshd\
    \ behaviour\nprint XAUTH \"add $host/unix:$dpynum $proto_cookie\";\n\nclose(XAUTH);\n\
    \nclose(INTERFACES);\n```"
