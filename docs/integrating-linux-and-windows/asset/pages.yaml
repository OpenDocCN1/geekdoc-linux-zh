    - Oracle—One of the most popular commercial databases that is available for almost
    every computer platform (http://www.oracle.com/)

    - Informix—Offers both a free development version and a commercial version of
    its database (http://www.informix.com/)

    - Sybase—Has its flagship database, Adaptive Server Enterprise, as an unsupported,
    free version for Linux (http://www.sybase.com/adaptiveserver/

    - Adabas—This was the first commercial database available for Linux. It is derived
    from the Adabas Mainframe database. It is bundled with many Linux distributions,
    including Caldera (http://www.caldera.com/) and SuSE (http://www.suse.de/).


    There are two popular open source databases:


    +   - MySQL—One is free for Linux users and $200 for Windows users. Either way,
    it is one of the least expensive databases on the market. There is also commercial
    support available for a yearly fee (www.mysql.com).

    - PostgreSQL—This popular UNIX database rivals many of the commercial databases
