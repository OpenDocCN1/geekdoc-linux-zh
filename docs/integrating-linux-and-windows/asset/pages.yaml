  md: '# Table of Contents


    +   - Introduction

    - What''s New?

    - What is SMB?

    - SMB Clients and Servers Currently Available

    - SMB Servers

    - SMB Clients

    - Further resources on the web

    - Copying this document


    # Introduction


    This document explains the SMB protocol and is discusses many client and server
    implementations of SMB that are available. The document grew out of my interest
    in implementing SMBlib, a portable library of SMB client routines.


    SMB is an important protocol because the large number of PCs out that already
    have client and server implementations running on them. All Windows for Workgroups,
    Windows 95 and Windows NT systems are (or are capable of) running SMB as either
    a client, a server, or both.


    # What''s New


    While there are many things out there that are new, perhaps the thing of greatest
    interest as far as the SMB protocol is concerned is CIFS, the Common Internet
    File System.


    # What is SMB?


    SMB, which stands for Server Block, is a protocol for sharing files, printers,
    serial ports, and communications abstractions as named pipes and mail slots between
    computers.


    The earliest document I have on the SMB protocol is an IBM document from 1985.
    It contains a copy of an IBM Personal Computer Seminar Proceedings from May 1985.
    It contains the IBM PC Network SMB Protocol. The protocol was subsequently developed
    further by Microsoft and others. Many of the documents that define the SMB protocol(s)
    are available at ftp.microsoft.com/MicrosoftNetworks/OpenNET-FILE_SHARING_PROTOCOL
    from 1987. microsoft.com in the SMB documentation area.


    SMB is a client server, request-response. The diagram to illustrates the way in
    which SMB works. The only exception to the request-response nature of SMB (that
    is, where the client requests and the server sends back responses) is when the
    client has requested optimistic locks (oplocks) and the server subsequently has
    to break an already granted obplock because another client has requested a file
    open with a mode that is incompatible with the granted obplock. In this case,
    the server sends an unsolicited message to the client signalling the obplock break.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# What is SMB?


    Servers make file systems and other resources, mailslots (printers, named pipes,
    APIs) available to clients on the network. Client computers may have their own
    hard disks, they also want access to the shared file systems and printers on the
    servers.


    Clients connect to servers using TCP/IP (actually NetBIOS over TCP/IP as specified
    in RFC1001 and RFC1002), NetBEUI, or IP/SPX. Once they have established a connection,
    clients can then send commands (SMBs) to the server that allow them to access
    shares, open files, read and write files, and generally do all the sort of things
    that you want to with a file system. However, in the case of SMB, these things
    are done over the network.


    As mentioned, SMB can run over multiple protocols. The following diagram shows
    this: SMB can be used over TCP/IP, NetBEUI and IP/SPX. If TCP/IP or NetBEUI are
    in use, the NetBIOS API is being used.


    NetBIOS over TCP/IP needs to be referred to by names. Microsoft refers to it NBT
    in names and NetBT in others (specifically in their Windows NT documentation and
    in the Windows NT registry). Others refer to it as RFCNB, NetBEUI are sometimes
    referred to as NBF (NetBIOS Frame Format?) by Microsoft.


    NetBIOS Names. If SMB is used over TCP/IP or NetBEUI, then NetBIOS names must
    be used in a number of cases. NetBIOS names are up to 15 characters long, and
    are usually the name of the computer that is running NetBIOS. Microsoft, and other
    implementers, insist that NetBIOS names be in upper case, especially when presented
    to servers as the CALLED NAME.


    SMB Protocol Variants. Since the inception of SMB, many protocol variants have
    been developed to handle the increasing complexity of the environments that it
    has been employed in.


    The actual protocol variant client and server will be negotiated using the negprot
    SMB which must be the first SMB sent on a connection.


    The first protocol variant was the Core Protocol, known to SMB implementations
    as PC NETWORK PROGRAM 1.0. It could handle a fairly basic set of operations as
    included:


    +   connecting and disconnecting from file and print shares

    opening and closing files

    opening and closing print files

    reading and writing files

    creating and deleting files and directories

    searching directories

    getting and setting file attributes

    locking and unlocking byte ranges in files


    Subsequent variants were introduced as more functionality was needed. Some of
    the variants and the related version of LAN Manager are:'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# SMB Protocol Variant Protocol Name Comments


    | SMB Protocol Variant | Protocol Name | Comments |

    | --- | --- | --- |

    | PC NETWORK PROGRAM 1.0 | Core Protocol | The original version of SMB as defined
    in IBM’s PC Network Program. Some versions were called PCLAN1.0 |

    | MICROSOFT NETWORKS 1.03 | Core Plus Protocol | Included Lock&Read and Write&Unlock
    SMBs with different versions of raw read and write SMBs |

    | MICROSOFT NETWORKS 3.0 | DOS LAN Manager 1.0 | The same as LANMAN1.0, but OS/2
    errors must be translated to DOS errors |

    | LANMAN1.0 DOS LM1.2X002 | LAN Manager 1.0 LAN Manager 2.0 | The full LANMAN1.0
    protocol. The same as LM1.2X002, but errors must be translated to DOS errors |

    | LM1.2X002 DOS LANMAN2.1 | LAN Manager 2.0 LAN Manager 2.1 | The full LANMAN2.0
    protocol. The same as LANMAN2.1, but errors must be translated to DOS errors |

    | LANMAN2.1 Windows for Workgroups 3.1a NT LM 0.12 Samba | LAN Manager 2.1 LAN
    Manager 2.1? NT LAN Manager 1.0? NT LAN Manager 1.0? | The full LANMAN2.1. Windows
    for Workgroups? Contains special SMBs for NT Samba’s version of NT LM 0.12 |

    CIFS 1.0 | | Really NT LM 0.12 plus a bit


    Some variants introduced new SMBs, some might change the format of errors or responses,
    and some variants did both.


    **Security.** The model defines two levels of security:

    **Share level.** Protection is applied at the share level on a server. Each share
    can have a password, and the client only needs password to access all files under
    that. This was the first security model that SMB had and is the only security
    model available in the Core and CorePlus protocols. Windows for Workgroups’ vserver.exe
    implement security level by default, as does Windows 9.


    **User Level.** Protection is applied to individual files in each and is based
    on user access rights. Each user (client) must log in to the server and be authenticated
    by the server. When it is authenticated, the client is a UID which it must present
    on all subsequent accesses to the server. This model has been available since
    LAN Manager 1.0.


    **Browsing the network.** Having lots of servers in the network is not much if
    users cannot find them. Clients can simply be configured to know the servers in
    their environment, but this does not help when new servers are to be introduced
    or ones removed.'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# What is SMB?


    223


    To solve this problem, browsing has been introduced. Each server broadcasts information
    about its presence. Clients listen for these broadcasts and build up lists. In
    NetBEUI environment, this is satisfactory, but in a TCP/IP environment, problems
    arise. The problems exist because TCP/IP broadcasts are not usually sent outside
    the subnet in which they originate (although some routers can transport broadcasts
    to other subnets).


    Microsoft have introduced browse servers and the Windows Internet Name Service
    (WINS) to help overcome these problems.


    CIFS: The latest incarnation! Microsoft and a group of other vendors (Digital
    Equipment, Data General, SCO, Network Appliance Corp) are engaged in developing
    a public version of the SMB protocol. It is expected that CIFS 1.0 will be essentially
    NT LM 0.12 with modifications for easier use over the Internet.


    An SMB Exchange. The protocol elements (requests and responses) that clients and
    servers exchange are called SMBs. They have a specific format that is very similar
    for both requests and responses. Each consists of a fixed size header portion,
    followed by a variable sized parameter and data portion.


    After connecting to the NetBIOS, either via NBF, NetBT, the client is ready to
    request services from the server. However, the client and server must first identify
    which protocol variant each understand


    The client sends a negprot SMB to the server, listing the dialect that it understands.
    The server responds with the index of the dialect it wants to use, or 0FFFF if
    none of the dialects was acceptable.


    Dialects more than the Core and CorePlus protocols supply information in the negprot
    protocol to indicate their capabilities (max buffer size, canonical file names,
    etc).


    Once a protocol has been established, the client can proceed to logon to the server,
    if required. They do this with a sessetup SMB. The server responds whether or
    not they have supplied a valid username password pair and if so, can provide additional
    information. One of the most important aspects of the response is the UID of the
    logged on. This UID will be submitted with all subsequent SMBs on connection to
    the server.


    Once the client has logged on (and in older protocols-Core and CorePlus-cannot
    logon, the client can proceed to connect to a tree.


    The client sends a tcon or tconX SMB specifying the network name of the share
    they wish to connect to, and if all is kosher, the server responds with a TID
    that the client will use in all future SMBs relating to that share.


    Having connected to a tree, the client can now open a file with an open SMB, followed
    by reading it with read SMBs, writing it with write SMBs, and closing it with
    close SMB.


    # SMB Clients and Servers Currently Available


    There are a few SMB clients available today and a relatively large number of servers
    available from a range of vendors.


    The main clients are from Microsoft, and are included in Windows WorkGroups 3.x.,
    Windows 95, and Windows NT. They are most evident when you use the File Manager
    or the Windows 95 Explorer, as these allow you to connect to servers across the
    net-'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'work. However they are also used when you open files using a UNC (universal
    naming convention).


    Some other clients that I am aware of:


    +   - smbclient for Samba

    - smbfs for Linux


    SMBlib (an SMB client library that is in development)


    Server implementations are available from many sources. Some that I am aware of:
    Samba


    Microsoft Windows for Workgroups 3.x

    Microsoft Windows 95

    Microsoft Windows NT


    The PATHWORKS family of servers from Digital LAN Manager for OS/2, SCO, etc


    VisionFS from SCO


    TotalNET Advanced Server from Syntax

    Advanced Server for UNIX from AT&T (NCR)?

    LAN Server for OS/2 from IBM


    The next two sections will discuss each of the above in turn.


    # SMB Servers


    Before discussing SMB servers, it is useful to discuss the difference between
    Workgroups and Domains.


    Workgroups. A workgroup is a collection of computers that maintain their own security
    information. With Windows for Workgroups, each server is pretty much in share
    level security. Windows 95 can pass user authentication off to an NT or LAN Manager
    server.


    The point of a workgroup is that security is distributed, not centralized.


    Domain. A domain is a collection of computers where security is handled centrally.
    There is usually a primary controller and secondary backup domain controllers.
    The domain controllers maintain account style information related to users (clients),
    like account names, passwords, authorized hours of use, the group belongs to,


    Samba is a freely available SMB server for UNIX, OpenVMS (recently posted and
    may not very stable) developed by Andrew Tridgill and maintained by a loosely
    knit group of people all over the world. Samba runs on many great variants (Linux,
    Solaris, SunOS, HP-UX, ULTRIX, DEC OSF1, Digital UNIX, Dynix (Sequent), IRIX (SGI),
    SCO Open Server, DG-UX, AIX, BSD, NetBSD, NEXTSTEP, A/UX.


    Samba implements the NT LM 0.12 protocol dialect. Samba can now participate in
    browsing and be a breeze master. Samba can also process login requests for Windows
    95 systems (both as a domain and a Member of a domain).


    Samba implements level security, but shares can be public where access is mapped
    to the owner etc of the share.'
