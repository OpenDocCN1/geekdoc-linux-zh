    # 14.3 smbtar


    Since the tar command for smbclient is so complex, the script smbtar is included
    with Samba to simplify backups and restores. The format for smbtar is:


    smbtar options files

    The options for smbtar are as follows:


    +   - s server—This specifies the server (Windows machine) that you are backing
    up. This option is mandatory.

    - p password—The password for the share, if needed.

    - -x service—The service to connect to. The default is backup.

    - -X filenames—Files to be excluded from the backup.

    - u user—The username to connect to the service. The default is the Linux username
    that you are logged as.

    - -d directory—The initial directory to start the backup or restore from.

    - t tape—The device or file that is used for the backup or restore. The default
    is the tape variable set in Linux. If there is no tape variable, the tar.out file
    is used.

    - b blocksize—The tape block size. The default is 20.

    - N filenames—Specifies to back up files fewer than filenames.

    - i—Performs an incremental backup. Only files with the archive bit set backed
    up.

    - a—Resets the archive bit on all files backed up.

    - r—Performs a restore instead of backup.

    - 1 log level—Specifies the debug level. The default is 0. This has the same effect
    as the d option in smbclient.

    - v—This sets smbclient to verbose mode.

    - filenames—Without the x parameter, you can list the files to back up. If no
    filenames are listed, it will default to all filenames.


    # 14.4 smbprint


    This is another smbclient script that allows the printing of a Linux file on a
    printer attached to a Windows machine. It takes the standard input on the Linux
    machine and redirects it to the remote printer. The syntax is tape similar to
    the following:


    ```

    smbprint <local.file>

    ```'
