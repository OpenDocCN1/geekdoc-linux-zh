  md: '# Secure Shell (SSH)


    SGI GL, Digital Certificates, and PGP Keys. PGP keys are supported in SSH2, but
    SGI GL digital certificates are not supported at this time. OpenGL, which runs
    under X11, is supported.


    # 17.4.9 Administering SSH


    This script generates a log file that lists things like clients that change their
    keys and other errors or changes. There is a script available at http://www.kari-lissruhe.de/-ig25/ssh-faq/comp-host-list
    that will process the log file and write it in a more-readable format into another.
    This is good for finding “man in the middle”-type attacks.


    There are also patches for Kerberos that allow it to work with SSH. Kerberos allows
    secure authentication across an insecure network. These patches allow SSH to update
    its encryption keys when Kerberos authentication is used. There are patches available
    for Kerberos 4 at http://www.monkey.org/-dusong/ssh-afs and Kerberos 5 at http://www.ncsa.uiuc.edu/General/CC/ssh/patch_repository/descriptions/AFS-KR5.html.


    # 17.4.10 Troubleshooting SSH


    The best way to prevent problems with SSH is to keep it up-to-date. Patches for
    SSH are available at http://www.ssh.org/. After downloading the patches, go to
    the source directory and type patch -pl -1 < /path/to/sspath (the location of
    ssh and sshd). Then run make distclean, configure, make, and install to compile
    SSH all.


    The GMP assembler doesnt run on some systems, so compiling may fail with some
    error messages from the assembler, so SSH can be compiled without these routines.
    Configure SSH with the -disable-asm option as follows:


    ```

    make distclean

    configure --disable-asm

    make

    make install

    ```


    When the configure process cannot find xauth, check to be that xauth is in your
    path by typing wherexauth. If this doesn''t show the path of xauth, add it to
    the path by exporting PATH=$PATH: <path of xauth>. If you don''t know where xauth
    is, you can find it by typing find xauth. After this is, run configure again.


    If compilation aborts with some error message about libc.so.4, your system is
    not configured properly. Run cd /usr/lib, then ln -s libc.so lib.., then recompile.'
