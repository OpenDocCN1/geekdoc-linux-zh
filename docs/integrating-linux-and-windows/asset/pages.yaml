  md: '# Streaming Media


    original CD tracks, by were about one-tenth the size of the CD tracks. A typical
    MP3 song was between one to two megabytes, which could be downloaded over a standard
    dial-up connection in 20 to 30 minutes.


    MP3 because for audio streaming with the introduction of Shoutcast. Shoutcast
    is a set of tools that allows Windows machines to encode and stream audio using
    the MP3 format.


    There are several components of the Shoutcast package. Shoutcast is a set of plugins
    for Winamp, which is a popular MP3 player for Windows (www.winamp.com). For example,
    the DSP plugin allows Winamp to connect to a Shoutcast server and send compressed
    audio to the server (http://scastweb2-qfe61.spinner.com/download/scast15ob2.exe).


    Shoutcast doesn''t have compression tools. This is because the MP3 CODEC is patented.
    Microsoft offers free Netshow compression tools that can handle MP3 compression
    http://mskyrus.com.connion/mdownload/netshow/3.01/x86/en/nstools.exe


    To encode live audio (as opposed to audio files), you will need the Shoutcast
    Live plugin (http://www.shoutcast.com/download/in_rec.zip). Another useful plugin
    is the live output plugin (http://www.shoutcast.com/download/out_null.zip), which
    allows you to stream audio without a sound card. This is often the case when files
    are broadcast instead of being live audio. It is also useful if you don''t want
    to hear the broadcast out of your pc.


    The Shoutcast Server is available for all current versions of Windows and many
    versions of UNIX (http://www.shoutcast.com/download/files.html). This can be a
    separate machine or, with the Windows version, the encoding tools and server can
    be the same one.


    There is also the open source MP3 player Icecast (http://www.icecast.org). It
    is available for most versions of UNIX and all current versions of Windows. Icecast
    will stream encoded MP3 files, and there is a Liveice program for encoding live
    audio streams.


    # MP3 Players


    One advantage of MP3 is the abundance of players available. Most audio and video
    players such as Real Player and Windows Media Player support MP3. The Windows
    Media Player is bundled with all current versions of Windows. Some of the other
    players for Windows:-


    +   - Winamp (http://www.winamp.com/)—Probably the most popular player for Windows.


    +   - Sonique (http://www.sonique.com/).


    +   - K-Jofol (http://www.kjofol.com/).


    For Linux there:


    +   - xmms (http://www.xmms.org/)—This is an X11-based player that is bundled
    with most Linux distributions.


    +   - MPG123 (http://mpg.123.org/)—This command player is included in most Linux
    distributions. It works on low-end systems since it doesn''t require X11. It also
    supports proxy servers.


    +   - Freeamp (http://www.freeamp.org/)—This player is available for both Linux
    and Windows.'
