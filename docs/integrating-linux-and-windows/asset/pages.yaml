  md: '# announce version (G)


    This specifies the major and minor version numbers that nmbd will use when announcing
    itself as a server. The default is 4.2. Do not change this parameter unless you
    have a specific need to set a Samba server to a downlevel server.


    Default: announce version = 4.2


    Example: announce version = 2.0


    # auto services (G)


    This is a list of services that you want to be automatically added to the browse
    lists. This is most useful for homes and printers services that would otherwise
    not be visible.


    Note that if you just want all printers in your printcap loaded the "load printers"
    option is easier.


    ```

    Default: no auto services

    ```


    ```

    Example: auto services = freed 1 lp color1

    ```


    # available (S)


    This parameter lets you ''turn off'' a service. If ''available = no'', then all
    attempts to connect to the service will fail. Such failures will be logged.


    Default: available = yes


    Example: available = no


    # bind interfaces only (G)


    This global parameter allows the Samba daemon to limit what interfaces on a machine
    will serve smbd requests. If a file service is requested, smbd and name service
    nmbd will handle it in slightly different ways.


    For name it causes nmbd to bind to ports 137 and 138 on the interfaces listed
    in the ''interfaces'' parameter. nmbd also binds to the ''all addresses'' interface
    (0.0.0.0) on ports 137 and 138 for the purposes of reading broadcast messages.
    If this option is not set then nmbd will service name requests on all of these
    interfaces. If "bind interfaces only" is set then nmbd will check the source address
    of packets coming in the broadcast sockets and discard any that don''t match the
    broadcast address of the interfaces in the ''interfaces'' parameter list. As multicast
    packets are received on the other sockets it allows nmbd to refuse to serve names
    to lists that send packets arrive through any interfaces not listed in the "interfaces"
    list. IP Source address spoofing defeats this simple check, however it must not
    be used seriously as a feature for nmbd.


    For file service it causes smbd to bind only to the interface given in ''interfaces''
    parameter. This restricts the networks that smbd will service to packets coming
    in those interfaces. Note that you should not use this parameter for machines
    that are using PPP or other intermittent or non-broadcast network interfaces as
    it will not cope with non-permanent interfaces.


    In addition, to change a Samba password, the smbpasswd by default connects to
    the "localhost"--127.0.0.1 address as an SMB client to issue the change request.
    If "bind interfaces only" is set then unless the network 127.0.0.1 is listed in
    the ''interfaces'' parameter list smbpasswd will fail to connect in it''s'
