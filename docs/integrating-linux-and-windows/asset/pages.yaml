- img_proc: true
  md: '# 7.4 ODBC


    Locking prevents two users from updating the same information at the same time.
    There are two types of locking in common use: record locking and table locking.
    Record locking only the individual record that is being updated. Table locking
    locks the entire table that the record is in. Table locking allows one user at
    a time to update a table. Record locking can allow multiple users to update a
    table, but it is slower than table locking.


    Support and price go hand-in-hand. Large organizations that depend on databases
    are willing to pay up to several thousand dollars per user for a database from
    a large company as IBM or Oracle. The cost of database and support are much less
    than the cost of the database going. The personal and free databases don''t have
    the same level of support.


    All of the commercial databases, including Microsoft SQL Server, support transactions,
    hot backups, and locking. They also have extensive support available and the prices
    to match.


    All of the free source databases, PostgreSQL have all the major features of the
    commercial databases. Support is also available for an extra fee.


    MySQL is another popular source database. It is designed differently from PostgreSQL
    and the commercial databases. MySQL doesn''t support transactions and uses table
    locking instead of record locking. This makes reading and updating tables much
    faster than MySQL compared to other databases. MySQL is a good choice for databases
    that are read often but rarely updated. It is a popular choice for Web-based databases,
    since many Web-based databases are used mostly for reading data.


    MySQL does its disadvantages. Multiple users can update at the same time. There
    are also no transactions, so if there is an error in updating a table, there is
    no easy way to recover the data. These limitations can be partially overcome by
    small tables and frequent backups.


    # 7.3 Connecting Databases


    Microsoft''s Open Database Connectivity (ODBC) software is the most common way
    to connect to or from a Microsoft database. Many databases and Web development
    tools ODBC connectivity built into them. There are also many stand-alone ODBC
    programs as the ones listed in the next section.


    # 7.4 ODBC


    ODBC consists of server and client software. The server software runs on the database
    end and the client runs on the machine accessing the database. The server typically
    runs as an NT service and it is configured in the Control Panel. The client is
    either an NT service or a stand-alone program.


    Separating the server from the client makes ODBC a good cross-platform solution,
    but it makes it harder to troubleshoot. ODBC gives rather cryptic errors that
    don''t really tell you what the problem is. It is also hard to tell whether an
    error was caused by the client or the server.'
  merge: -1
