    \ the file will get mangled. The ASCII setting will preserve the line feeds and\
    \ character sets in text files.\nOnce in, standard ls (or dir) and cd commands\
    \ can be used to navigate the directories on the remote machine. For a full list\
    \ of commands, type help?\n\n```\nftp> help\ndebug mdir sendport site $ \ndir\
    \ mget put size account disconnect\nmkdir pwd append status exit mls\n```"
