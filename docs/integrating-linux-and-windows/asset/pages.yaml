  md: '# smbd (8) 329


    +   - **O socket options** See the socket options parameter in the smb.conf (5)
    for details.

    - **p port number** port number is a positive integer value. The default value
    if this parameter is not specified is 139.


    This number is the port number that will be used when making connections to the
    server from client software. The standard (well-known) port number for the SMB
    over TCP is 139, hence the default. If you wish to run the server as an ordinary
    user rather than root most, you will require a port number greater than 1024—ask
    your system administrator for help if you are in this situation.


    In order for the server to be useful by most clients, you should configure it
    on a port other than 139, you will require port redirection services on port 139,
    details of which are outlined in rfc1002.txt section 4.3.5.


    This parameter is not normally specified except in the above situation.


    +   - **s configuration file** The file specified contains the configuration details
