- img_proc: true
  md: '# Description


    This program is part of the Samba suite.


    nmbd is a server that understands and can reply to NetBIOS over IP name service
    requests, is a server that understands and can reply to NetBIOS over IP name service
    requests, like those produced by SMBD/CIFS clients as Windows 95/98, Windows NT
    and LanManager clients. It also participates in the browsing protocols which make
    up the Windows "Network Neighborhood" view.


    SMB/CIFS clients, when they start up, may wish to locate an SMB/CIFS server. That
    is, they wish to know what IP number specified host is using.


    Among other services, nmbd will listen for these requests, and if its own NetBIOS
    name is specified with the IP number of the host it is running on, its "own NetBIOS
    name" is by default the DNS name of the host it is running on, but this can be
    overridden with the -n option (see OPTIONS below). Then nmbd will reply to broadcast
    queries for its own name(s). Additional names for nmbd to respond on be set via
    parameters in the smb.conf(S) configuration file.


    nmbd can also be used as a WINS (Windows Internet Name Server). What this basically
    means is that it will act as a WINS database server, creating a database of name
    registration requests that it receives and replying to queries for these clients
    by names.


    In addition, nmbd can act as a WINS proxy, relaying broadcast queries from clients
    that do not understand how to talk the WINS protocol to a WINS server.


    # Options


    +   - D If specified, this parameter causes nmbd to operate as a daemon. It detaches
    itself and runs in the background, fielding requests on the appropriate port.
    By default, nmbd will NOT operate as a daemon. nmbd can also be operated from
    the inset meta-data, although this is not recommended.


    +   - a If this parameter is specified, each new connection will append log messages
    to the log file. This is the default.


    +   - o If this parameter is specified, the log files will be overwritten when
    opened. By default, the log files will be appended to.


    +   - H lmhosts The lmhosts file is a list of NetBIOS names to IP addresses that
    is loaded by the nmbd server and use the name resolution mechanism name resolve
    order in smb.conf (5) to resolve any NetBIOS name needed by the server. Note that
    the contents of this file are NOT used by nmbd to answer any queries. Adding a
    line to this file affects NetBIOS resolution from this host ONLY.


    +   The default path to this is compiled into Samba as part of the build process.
    Common defaults are /usr/local/samba/lmhosts, /usr/local/samba/lmhosts or /etc/lmhosts.
    See the lm-hosts (5) for page details on the contents of this file.


    +   - d debuglevel is an integer from 0 to 10.'
  merge: -1
