- img_proc: true
  md: '# Description


    This program is part of the Samba suite.


    smclient is a client that can ''talk'' to an SMB/CIFS server. It offers an interface
    similar to that of the ftp program (see ftp (1)). Operations include things like
    getting files from the server to the local machine, putting files from the local
    machine to the server, retrieving directory information from the server and so
    on.


    # Options


    +   - servicename servicename is the name of the service that you want to use
    on the server. A service name takes the form //service/service where server is
    the NetBIOS name of the SMB/CIFS server offering the desired service and service
    is the name of the offered. To connect to the service printer on the SMB/CIFS
    server smbserver, you would use the servicename


    ```

    //smbserver/printer

    ```


    Note that the server name required is NOT necessarily the IP (DNS) host of the
    server! The name is a NetBIOS server name, which may or may not be the same as
    the IP hostname of the machine running the server.


    The server name is looked up to either the -R parameter to smclient or using the
    name resolve order parameter in the smb.conf file, allowing an administrator to
    change the order and methods by which server names are looked up.


    +   - password is the password required to access the specified service. If this
    parameter is supplied, the -N option (suppress password prompt) is assumed.


    There is no default password. If no password is supplied on the -U option (see
    below) and the -N option is not specified, the client will prompt for a password,
    even if the desired service does not require one. (If no password is required,
    simply press ENTER to provide a null password.)


    Note: Some servers (including OS/2 and Windows for Workgroups) insist on an uppercase
    password. Lowercase or mixed case passwords may be rejected by these servers.
    Cautious about including passwords in scripts.


    +   - smb.conf This parameter specifies the pathname to the Samba configuration
    file, smb.conf. This controls all aspects of the Samba setup on the machine and
    smbclient also needs to read this file.


    +   - B IP address The address to use when sending a broadcast packet.


    +   - O socket options TCP options to set on the client socket. The socket options
    in the smb.conf (5) manage for the list of valid options.


    +   - R name resolve order This option allows the user of smclient to determine
    what name resolution services to use when looking up the NetBIOS name of the host
    being connected.'
  merge: -1
