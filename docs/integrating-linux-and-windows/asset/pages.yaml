    +   - **help [command]** See the ? command above.


    +   - **lcd [directory name]** If “directory name” is specified, the current working
    directory on the local machine will be changed to the directory specified. This
    operation will fail if for any reason the specified directory is inaccessible.


    If no directory name is specified, the name of the current working directory on
