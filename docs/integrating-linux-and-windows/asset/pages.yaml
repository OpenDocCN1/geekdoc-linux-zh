  md: '+   CAP Convert an incoming Shift-JIS character to the 3 byte hex representation
    used by the Columbia AppleTalk Program (CAP), i.e. :AB. This is used for compatibility
    between Samba and CAP.


    +   comment (S)

    This is a text field that is seen next to a share when a client does a queries
    the server, either via the network neighborhood or via ''net view'' to list what
    shares are available.


    If you want to set the string that is displayed next to the machine name then
    see the server string command.


    Default: No comment string

    Example: comment = Fred''s Files


    +   config file (G)

    This allows you to override the config file to use, instead of the default (usually
    smb.conf). There is a chicken and egg problem here as this option is set in the
    config file!


    For this reason, the name of the config file has changed when the parameters are
    loaded then it will reload from the new config file.


    This option takes the usual substitutions, which can be very useful.


    If the config file doesn''t exist then it won''t be loaded (allowing you to special
    case the config files of a few clients).


    Example: config file = /usr/local/samba/lib/smb.conf?m


    +   copy (S)

    This parameter allows you to ''clone'' service entries. The specified service
    is simply duplicated under the current service''s name. Any parameters specified
    in the current service will override those in the section being copied.


    This feature lets set up a ''template'' service and create similar services easily.
    Note that the service copied must occur earlier in the configuration file than
    the service doing the copying.


    Default: none

    Example: copy = otherservice


    +   create mask (S)

    A synonym for this parameter is ''create mode''.

    When a file is created, the necessary permissions are calculated according to
    the mapping from DOS modes to UNIX permissions, and the resulting UNIX mode is
    then bitwise ''AND'' with this parameter. This parameter may be thought of as
    a bitwise MASK for the UNIX modes of a file. Any bit *not* here will be removed
    from the modes set on a file when it is created.


    The default value of this parameter removes the ''group'' and ''other'' and execute
    bits from UNIX modes.

    Following this Samba will bit-wise ''OR'' the UNIX mode created from this parameter
    with the value of the ''force create mode'' parameter which is set to 000 by default.'
