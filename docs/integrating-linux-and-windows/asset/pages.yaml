  md: '# 6.3.1 Star Office


    Sun''s Star Office has very good support for Microsoft Office files. It offers
    equivalent programs for word processing (Writer), spreadsheets (Calc), presentations
    (Impress), graphics (Draw), email (Mail), calendaring (Schedule), and a database
    (Base). It also has an integrated Web browser. While it is not feature-rich as
    Microsoft Office, it offers all its functions such as headers, footers, and template
    style sheets.


    Star Office isn''t for everyone. Probably the biggest drawbacks are its size and
    speed. Star Office requires 160MB of disk space and at least 32MB of RAM, 64MB
    is required to get decent performance. It also takes a time to load, even on a
    fast system. Low-end machines that are often used for Linux boxes are out of the
    question.


    Star Office does have a HotSync feature that is not included with the other office
    suites for Linux. If synchronizing a PDA with your office suite is important,
    Star Office has the best support for it.


    Star Office also has its own built-in desktop. On a Windows machine, it will replace
    the default Windows desktop with its own desktop. While many users are not bothered
    by this, it can be frustrating to many other users. Star Office can be downloaded
    for free from Sun''s Web site or CDs can be ordered for about $40 (http://www.sun.com/staroffice/).


    Sun is beating Microsoft to the punch by offering XML support in Star Office.
    Microsoft doesn''t plan on offering XML support until 2002. The battle for the
    office suite could get very interesting.


    # 6.3.2 Applix


    While it doesn''t support MS Office formats as well as Star Office, many people
    prefer Applix''s interface and cleaner-screen fonts. Instead of taking the desktop,
    Applix loads each application in a separate window.


    Applix is also a good choice for low-end systems, since it will run on a 486/66
    with 32MB of RAM and about 250MB of free disk space.


    Many Linux distributions contain a demo copy of Applix. You can also download
    it from Applix''s Web site. The program is not free, however. A registered copy
    costs from $40 for an upgrade to $190 for the developer''s edition (http://www.applix.com).


    # 6.4 Open Source Office Suites


    Both KDE and Gnome have open source office suites under development. Neither is
    production-quality yet, they are already feature-rich and complete.'
