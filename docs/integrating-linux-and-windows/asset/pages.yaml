  md: '# Exporting MS Office Files


    UNIX use a different end of line character, though. There are programs to convert
    DOS text into UNIX, and vice versa. For example, from the Linux prompt, you can
    type the following to convert a DOS file to UNIX: tr -d ''\15\32'' < dosfile.txt
    > unixfile.txt You can also use awk to translate:


    There are some techniques that can make MS Office files easier. Obviously, more
    complex files have more trouble sorting, so if you plan to export a file, keep
    it simple. Embedding and linking within documents can also cause problems.

    The main difference between embedding and linking is that embedding places a copy
    of the object in the Office file. Linking places a link to the object in the file.
    If the original object is changed, the embedded object will not change, but the
    linked object will be updated all documents. Linking is handy because you don''t
    have to update the linked object, but it also doesn''t export well. If you are
    going to export, use embedding instead of linking. simply include the object as
    a separate file. For information on how to embed and link in an MS Office document,
    refer to your MS Office user''s manual or to this tutorial.

    WordArt, AutoShapes, vertical rules, macros, pivot tables, and equations are all
    specific to MS Office and may not be exported properly. These options are explained
    in the MS Office documentation.


    Turning off the saves feature in MS Word also makes files easier to export. Fast
    saves has always been a buggy feature and it is better to turn it off. To turn
    this, go to Tools -> Options -> Save and uncheck the Allow Fast Saves option.


    ![](img/a1ad58e4259f15e8b2826ecf57a28362_80_0.png)


    Figure 6.4 Turn Off the "Allow Fast Saves" option to allow easier imports of Word
    Documents.


    One last note: MS Office 95 files are easier to import than Office 97 files.'
  merge: -1
