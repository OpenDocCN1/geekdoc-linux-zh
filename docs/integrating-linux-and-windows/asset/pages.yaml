  md: '# 1.6.6 Special Situations with FIPS


    Windows 3.1. If you are using Windows 3.1, you must delete the swap file before
    splitting the drive. To do this, go the Control Panel (in the Main folder) and
    choose 386 enhanced. Then choose the Virtual Memory, and change to none. After
    the drive is split, you can turn the swap file back on.


    Stacker, SuperStor, DoubleSpace, and other Disk Compression Programs. These programs
    create a compressed volume on any disk with a compressed file on it. Then they
    move all the files to the compressed volume and rename the volumes. The uncompressed
    volume is typically C: and it contains the boot files and compression program.
    The uncompressed volume is D: and it contains the compressed file.


    Splitting this drive can be tricky. Be sure to get a good backup if the compressed
    file is damaged, the whole drive becomes unreachable. The following steps allow
    you to add a new partition to a compressed drive:


    +   1. Make you have enough free space on the compressed drive to create the new
    partition.

    2. Use the disk checking software that comes with the drive to check for errors.

    3. If you are running Windows 3.1, remove the swap file.

    4. Use the disk compression utilities to decrease the size of the compressed volume.

    5. Defragment the compressed volume (D).

    6. Use FIPS and split the compressed volume (D):


    If the compressed volume can''t be defagmented, try the following steps:


    +   1. Copy your disk defragmentation utility (for example, defrag.exe or xorg.exe)
    and attrib.exe (in C:\DOS) to the bootable floppy drive.

    2. Boot with the floppy and remove all hidden and system attributes from the files
    on the compressed drive (D). Use dir /a:h and dir/a:s to find the hidden and system
    files.

    3. Defragment the compressed partition (D):


    After this is done, you should be able to split the drive.


    # 1.6.7 NTFS Partitions


    Unfortunately, NTFS and UMSDOS don''t work on NTFS partitions. You either have
    to delete the partition and re-create it or use a commercial partition utility
    as Partition Magic. Partition Magic is available in large computer stores. Information
    on it is available at http://www.powerquest.com.


    Before manipulating NTFS partitions, make a rescue disk, which saves important
    information to a diskette so it can be restored if something goes wrong. For Windows
    NT, use Start -> type in rdisk, and choose Make Emergency Repair Disk. For Windows
    2000, go to Start -> System Tools -> Backup. On the Welcome tab is a button for
    Emergency Repair Disk. Follow the instructions.'
