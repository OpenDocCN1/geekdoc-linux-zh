    # 1.4.2 Troubleshooting LILO


    LILO loads the four letters in "LILO" as it goes through the four stages of loading.
    This can be helpful in troubleshooting. If LILO stops while loading, the letters
    displayed where it failed:


    +   * <nothing>—No part of LILO has been loaded. LILO either isn''t installed
    or the partition on which its boot sector is located isn active.

    * L <error>...The first-stage boot loader has been loaded and started, but it
    can''t load the second-stage boot loader. The two-digit error codes indicate the
    type of problem. See the section titled "Disk Error Codes" in Appendix A.) This
    condition usually indicates a media failure or a geometry mismatch.

    * LI—The first-stage boot loader was able to load the second-stage boot loader,
    but could not execute it. This can be caused by a geometry mismatch or by moving
    /boot/boot.b without running the map installer.

    * TIL—The second-stage boot loader has been started, but it can''t load the descriptor
    table from the map file. This is typically caused by a media failure or by a geometry
    mismatch.

    * LIF—The second-stage boot loader has been loaded at an incorrect address. This
    is typically caused by a subtle geometry mismatch or by moving /boot/boot.b without
    running the map installer.

    * LIM—The descriptor table is corrupt. This can be caused by a geometry mismatch
    or by moving /boot/map without running the map installer.

    * LILO—All parts of LILO have been successfully loaded.


    If Linux doesn''t load, it will give an error code. The meanings of the error
    codes are listed in Appendix A.


    # 1.4.3 Booting Windows 9x


    The way Windows boots is slightly different. The partition points to the boot
    sector, which loads the two text files config.sys and autoexec.bat. It loads the
    Windows equivalent of the Linux kernel, win.com. The configuration file for win.com
    is the Registry, which consists of two binary files: system.dat and user.sys.
    While config.sys and autoexec.bat are text files, Registry files need to be edited
    with regedit.'
