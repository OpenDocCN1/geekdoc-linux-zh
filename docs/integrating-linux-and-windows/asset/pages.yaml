    +   * oplocks (S)

    This boolean option tells smbd whether to issue oplocks (opportunistic locks)
    to file open requests on this server. The oplock crash can dramatically (approx.
    30% or more) improve the speed of access to files on Samba servers. It allows
    the clients to aggressively cache files locally and you may disable this for unreliable
    environments (it is turned on by default in Windows NT Servers). For more information
    see the file Speed.txt in the Samba docs/


    Oplocks may be selectively turned off on certain files on a share basis. The ''veto
    oplocks'' parameter. On some systems oplocks are recognized by the underlying
    operating system. This allows data synchronization between all access to oplocked
    files, whether it be via Samba or NFS or a local UNIX process. the kernel oplocks
    parameter for details.


    +   Default: oplocks = True

    Example: oplocks = False


    +   * os level (G)

    This value controls how well Samba advertises itself as for elections. The value
    of this parameter determines whether nmbd has a chance of becoming a local master
    browser for the WORKGROUP in the local broadcast area. Setting this to zero will
    cause smbd to always lose elections to Windows machines. See BROWSING.txt in the
    Samba docs/ directory for details.


    Default: os level = 32

