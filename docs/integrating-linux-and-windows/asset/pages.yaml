    - **i scope** This specifies a NetBIOS scope that the server will use to communicate
    with generating NetBIOS names. Details on the use of NetBIOS scopes, see rfc1001.txt
    and rfc1002.txt NetBIOS scopes are very rarely used, only set this parameter if
