- img_proc: true
  md: '# Appendix C: Samba Man Pages


    +   - hosts equiv (G)


    If this global parameter is a non-null string, it specifies the name of a file
    to read for the names of hosts and users who will be allowed access without specifying
    a password.


    This is not confused with allow hosts which is about hosts access to services
    and which is more useful for guest services. hosts equiv may be useful for NT
    clients which will not supply passwords to samba.


    NOTE: The use of hosts equiv can be a security hole. This is because trusting
    the PC to ensure the correct username. It is very easy to get a PC to supply a
    false username. I recommend that the hosts equiv option be only used if you really
    know what you are doing, or on a home network where you trust your house and kids.
    And if you really trust them (-).


    Default hosts equivalences

    Example hosts equiv = /etc/hosts.equiv


    +   - interfaces (G)


    This allows you to include one config file inside another. The file is included
    literally, as though placed in place.

    It takes the standard substitutions, except %u, %P and %S.


    +   - interfaces (G)


    This option allows you to setup multiple network interfaces, so that Samba can
    properly handle browsing on all interfaces.

    The option takes a list of ip/netmask pairs. The netmask may either be a bitmask,
    or a bitlength.

    For example, the following line:


    ```

    interfaces = 192.168.2.10/24 192.168.3.10/24

    ```


    would configure two network interfaces with IP addresses 192.168.2.10 and 192.168.3.10.

    The netmasks of both interfaces would be set to 255.255.255.0.

    You could produce an equivalent result by using:


    ```

    interfaces = 192.168.2.10/255.255.255.0 192.168.3.10/

    255.255.255.0

    ```


    if you prefer format.


    If this option is not set Samba will attempt to find a primary interface, but
    won''t attempt to configure more than one interface.

    See also "bind interfaces only".


    +   - invalid users (S)


    This is a list of users that should not be allowed to login to this service. This
    is really a "paranoid" check to absolutely ensure an improper setting does not
    breach your security.

    A starting with a ''@'' is interpreted as an NIS netgroup first (if your system
    supports NIS), and then as a UNIX group if the name was not found in the NIS netgroup
    database.'
