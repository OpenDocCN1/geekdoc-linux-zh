  md: '# 17.4 Secure Shell (SSH)


    If SSH asks you for passwords despite .hosts, you may have one of the following

    problems:


    +   - The remote host''s /etc/ssh_known_hosts is not world-readable. Fix this
    with the command chmod 0+r /etc/ssh_known_hosts.

    - The client key is not stored in the known_hosts file. Note that this is for
    the canonical (usually, the fully-qualified) domain name such as myhost.mydomain.com

    - The client host does not have a reverse mapping in the server name. SSH requires
    both a reverse mapping and a forward mapping to work. Reverse mapping uses a host
    name to look up an IP address. Forward mapping uses the host name to look up an
    IP address.

    - A multi-homed client or host does not have all of its IP addresses in the DNS
    entry. Note that versions prior to 1.2 have bugs handling multi-homed hosts. The
    fix for this is listed in the following section.

    - The user''s home directory or /.hosts is world- or group-writable (StrictModes
    configuration option). Setting StrictModes to yes in the SSH server configuration
    will check the ownership of the home directories before login. This will stop
    others from modifying the .hosts even if it is left-world or group-writable. On
    some machines, if the home directory is on an NFS volume, /.hosts may need to
    be world-readable.


    The root account has to use ~/.hosts, or ~/.shosts; /etc/shosts.equiv and /etc/shosts.equiv
    are disregarded for root.


    +   - There is confusion between RhostsAuthentication and RSAAuthentication. Make
    sure the server and client use the same authentication method. RSAAuthentication
    is the default because it is more secure.


    If you have SSH looping with “Connection Refused”, SSH will fall back on the insecure
    “r” command if SSH server is not running on the host machine. This message occurs
    if SSH can''t find the “r” command. This could be caused by the following:


    +   - You named the SSH client rsh without pointing it to the regular rsh program—If
    you did this, you need to compile SSH with the --with-rsh=PATH configure option.
    If you wanted to insert the rsh to /etc/old, compile SSH with this option: ./configure
    --with-rsh=/etc/old/rsh.

    SSH doesn''t use rsh if it can''t open a connection. It refuses to connect.

    - SSH hangs when forwarding multiple TCP connections—This is a problem with older
    versions of SSH. Be sure you have an updated version.

    - You still use clear-text packages on the Internet when you run SSH—Make sure
    those are SSH packets. Check the port it is using. ssh uses Port 22.

    - There is an error message about too many bits—The RSARE library has a limit
    of 896 bits on the key size. Generate a key of this size or smaller.

    - Connections are forwarded as root by SSH—This is a known bug in SSH and may
    be fixed in a future release.'
