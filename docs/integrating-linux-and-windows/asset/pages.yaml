    Later, as hard drives came into use, the 32 MB limitation of FAT became a burden
    and an improved FAT16 increased the available size of the filesystem to 2 GB.
    Other than the filesize size, FAT16 is essentially the same as the original FAT
    file system. FAT16 is supported by DOS 4.0 and greater, all versions of Windows,
    and all current versions of Linux.


    With Windows 95 release 2, Microsoft introduced FAT32. This increased the size
    of the filesystem to 2 terabytes, which is larger than any hard drives currently
    available for PCs. It is also faster and more robust than FAT16.


    NTFS is the native filesystem for Windows NT and 2000. Like FAT32, it also supports
    2-terabyte filesize, but the boot partition is currently limited to 7.8 GB. For
    some files such as database files, NTFS can support up to 16 exabytes. NTFS offers
    better reliability and security than


    The reliability factors are beyond the scope of this book, but NTFS security considerations
    need to be covered. First of all, everything in the filesystem has an owner. By
    default, the user who creates an object (anything in the filesystem is an object)
    is the owner. The owner has full rights to the object unless the rights are taken
    away.


    There are also groups, which contain users. Three special group accounts are:
    administrator, everyone, and guest.


    +   - The administrator account has all rights to the filesystem. This account
    can change, create, and delete all objects as well as change the rights of other
    accounts.


    +   - Everyone is a group that includes all the user accounts on the system. This
    account is used to change the rights for every user on the system.


    +   - The guest account is a default account with minimal rights. It is often
    used for accounts such as FTP access accounts, which only need access to few specific
    files.


    Files in NTFS have the same attributes as files in the FAT: read-only, hidden,
    system, and archive. Each user and group can also be assigned rights to objects
    in the NTFS filesystem. The rights that can be assigned:


    +   - List folder—Shows up in a directory listing.


    +   - Read—Can read the contents of the object.


    +   - Read and execute—Can read and execute the object.


    +   - Write—Can change or delete the object.


    +   - Modify—Can change the rights on the file.


    +   - Full control—Has all of the above rights.


    There are three settings for the rights: allow, deny, and inherited.


    +   - Allow—Allows rights on the object.


    +   - Deny—Takes away rights on the object.


    +   - Inherited—If neither allow nor deny is specified, the object will inherit
    the rights of the directory above it.'
