    This is exactly how Windows NT works. You MUST have a valid account on the Windows
    NT box you are trying to see the resource list. If you currently logged in account
    details NOT match an account on the NT machine you are trying to access then you
    will be presented with a logon box for that. When you enter the name of an account
    on that / domain, together with a valid password then the resource list is made
    available. If the account details are not correct then no resource list is shown.


    Samba can be compiled with the GUEST_SESSION_SETUP option at 0, 1 or 2. The default
    is 0. If this is set to 1 or 2 Windows NT machines that DO NOT have an account
    on the Samba server will see the resource list. Unfortunately client bugs mean
    that this option will probably cause more problems than it will solve. We do not
    suggest that you use it.


