  md: '# APPENDIX


    # # A DISK ERROR CODES


    0x00 “Internal error”—This code is generated by the sector read routine of the
    LILO boot loader whenever an internal inconsistency is detected. This might be
    caused by corrupt files. Try rebuilding the map file. Another possible cause for
    this error is an attempt to access cylinders beyond 1024 using the LINEAR option.
    See the section titled “BIOS Restrictions” for more details on how to solve the
    problem.


    0x01 “Illegal command”—This shouldn’t happen, but if it does, it may indicate
    an attempt to access a disk which is not supported by the BIOS.


    0x02 “Address mark not found”—This usually indicates a media problem. Try again
    several times.


    0x03 “Write-protected disk”—This should only occur on write operations.


    0x04 “Sector not found”—This typically indicates a geometry mismatch. If you’re
    booting a raw-written disk, verify whether it was created for disks with the same
    geometry as the one you’re using. If you’re booting from a SCSI disk or a large
    IDE disk, you should check whether LILO has obtained correct geometry data from
    the kernel or if the geometry definition corresponds to the real disk geometry.
    (See the section “Disk Geometry,”) Removing COMPACT may help; by adding LINEAR.


    0x06 “Change line active”—This should be a transient error. Try booting a second
    time.


    0x07 “Invalid initialization”—The BIOS failed to initialize the disk control.
    You should correct the BIOS setup parameters. A warm boot might help too.


    0x08 “DMA overrun”—This shouldn’t happen. Try booting again.


    0x09 “DMA attempt across 64k boundary”—This shouldn’t happen. Try omitting the
    COMPACT option.


    0x0C “Invalid media”—This shouldn’t happen and might be caused by a media error.
    Try booting again.


    0x10 “CRC error”—A media error has been detected. Try booting several times, running
    the map installer a second time (to put the map file at some physical location
    or to write “good data” over the bad spot), mapping out the bad sectors/tracks,
    and if all else fails, replacing the media.'
