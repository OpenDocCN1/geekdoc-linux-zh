  md: '# Streaming Media


    # 5.6.1 Streaming Video


    Real Networks. Right now, the only complete video streaming package for Linux
    is Real

    Networks (http://www.realnetworks.com/index.html). Real offers encoding tools

    (Real Producer and Real Presenter), streaming servers (Real Server), and players
    (Real Player).


    Producing Content with Real

    Real Producer Basic is available for Linux, Macintosh, and Windows. It takes live
    video

    or audio and converts it to Real Media format. This can then be streamed or downloaded

    played with the Real Player. Real Producer Plus has additional features that allow
    better

    optimization of Real Media files. There is also Real Producer, which allows the
    conver-

    of other audio and video formats into Real format. Unfortunately, Real Producer
    Pro

    is only available for Windows. The price of Real Basic is free, and the Pro version

    sells up to $499.


    Real Presenter Basic adds embedded audio and video to PowerPoint presentations-

    viously, it is available only for Windows. The Basic version is free, but there
    is

    also a Plus version that sells for $69.


    # Real Servers


    Real Server is available for the Macintosh, NT/2000, and a wide variety of

    Unix platforms. There are two ways to stream content with Real: HTTP and Real
    Time

    Protocol (RTP). For low-volume streaming, simply link a Real file to a Web page
    and allow

    HTTP to stream the file. The RTP is an IETF standard for data streaming and it
    is much better

    suited for streaming media than HTTP. All the details of RTP are available at

    http://www.cs.columbia.edu/~dgs/rtp.


    For higher volume streaming, use Real Server. The free basic player allows up
    to 25

    streams to run simultaneously. Beyond that, the cost of the server is based on
    the maximum

    number of streams. For example, a 60-stream server would cost $1995. The commercial

    version includes the ability to password-protect streams and a license to resell
    the

    streaming services.


    Real Server requires 6 MB of RAM to run plus 40KB for each simultaneous stream

    in addition to the memory required for the OS. Streaming is not very processor-intensive.

    Pentium can easily handle 400 simultaneous streams 28.8-kps streams would

    require over 11.5 mbps of bandwidth just for the Real Streams. Maintaining that
    those 400

    streams would require a connection of about 15 mbps of bandwidth. Considering
    that a T1 con-

    dner delivers 1.5 mbs at a cost of about $500 to $1000 per month, bandwidth can

    get very expensive.


    # Real Players


    Real Player Basic is available for both Linux and Windows. It allows the end-user
    to

    view Media files and streams. It also supports many other audio and video formats,

    including MP3. There is also a Plus version for $29 that has extra features such
    as a graphic

    equalizer and the ability to record streams. The $49 Real Player Pro also has
    the ability to

    create slideshow with video and audio.


    Real Player for Windows is better supported than the player for Linux. The current-

    sion of Real Player for Windows has been out for months, while the Linux still
    has a beta'
