  md: 'Xaudio (http://www.xaudio.com/)—Another player available for both Linux and
    Windows.


    MP3 is not free, however. Fraunhofer Institute in Germany owns the patents on
    MP3 and they are starting to charge for its usage. While there are no charges
    for free encoders, and commercial players pay a minimum of $15,000 a year for
    using the MP3 CODECs. They are also planning to start charging for streaming MP3s
    as well (http://www.mp3.com/royalty/index.html).


    Free CODECs are being developed, though. The open source project Vorbis is developing
    free CODECs for audio and video. They already have working audio encoders and
    decoders for both Linux and Windows (www.vorbis.com).


    # 5.7 Chat


    Chat allows users to log into a server and post messages to each other. The grand-daddy
    of chat programs is Internet Relay Chat (IRC). Like most other Internet programs,
    IRC require a client and a server.


    There are many server programs available for both Linux and Windows. Linux servers
    can be found on www.tucows.com or www.davecentral.com for Windows servers. Look
    on www.fresh.net.


    One of the most popular IRC servers for UNIX is IRCd, which runs as a background
    process (daemon). This program consists of the IRC daemon ircd and the authentication
    daemon. They are configured with the files irc.conf and auth, respectively.


    IRC servers for Windows aren''t as numerous. A good one for Windows is Conference-Room.
    Unlike most UNIX IRC servers, you can download a 30-day copy from http://www.webmaster.com/.
    After 30 days, it will cost $99 for the Personal Edition to $4,300 for the Enterprise
    Edition. In its defense, ConferenceRoom is robust, fully-featured, and easy to
    configure for all versions of UNIX.


    Configuring an IRC server is beyond the scope of this book. Most people would
    not set up an IRC server, but would instead use one of the many IRC servers available
    on the Internet.


    An IRC client is used to attach to an IRC server. There are many IRC clients available
    for Linux or Windows. They are available at the Web sites for IRC servers.


    Some popular IRC clients for Windows are mIRC (http://www.mirc.com/mirc.html),
    PIRCH (http://www.pirchat.com/), and Visual IRC (http://www.metallic.co.uk/).


    Linux has both text-only and graphical clients. There are several IRC clients
    bundled with most distributions. Some text-only clients include Blackened (http://www.blackened.com/),
    IRCII (http://www.erna.com.au/ircii/), and a small client written in the Perl
    scripting language (http://www.agora.com/-esperl/sirc.html). Some graphical clients
    include kvirc (http://www.kvirc.org/) and x-Chat (http://xchat.linuxpower.org/).


    There are three settings needed to connect to an IRC server: your username, the
    name, and a port number. Your username can be any name that isn''t currently being
    used on the server. Some IRC clients have alternative names in case yours is in
    use.'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'There are several IRC server networks. All the servers on a network are connected
    and share messages. This allows a user anywhere in the world to join an IRC by
    attaching to a server close to home. Most IRC clients already have a list of servers,
    so it is a matter of picking a server.


    There are three large server networks: DALnet (http://www.dal.net/), Egnet (http://www.efnet.net/),
    and Undernet (http://servers.undernet.org/). While there are many other networks,
    these have hundreds of servers throughout the world.


    The port number is listed with the server address. This typically looks like this:
    us.undernet.org:6677, where the last number is the port number. Typical ports
    are 6667, and 7000.


    Once connected, you need to join a channel. To list the available channels, use
    /LIST in the command window. Once a channel is found, join the channel by typing
    /JOIN <CHANNEL NAME>. There are many other commands, so consult your IRC client
    documentation.


    Another program is an IRC Bot, which will maintain a channel on an IRC server.
    Channels are typically closed when everyone leaves. A bot will maintain the channel
    even when it is empty. A bot can also be used to manage a channel by banishing
    users from a channel and by password-protected channels.


    Most bots are for UNIX. Some examples of bots are Eggdrop (http://www.eggheads.org/)
    and Acid Blood (http://www.darkice.com/site/acidblood/download.htm) for Linux
    or Dancer (http://www.contactor.se/~/dancer/) for Linux and Windows.


    # Instant Messaging


    Instant messaging is rather new to the Internet. It evolved from the popular AOL
    Instant Message (AIM) in the early 1990s. It works similar to email, except when
    you send a message, it shows up instantly on the receiving end, instead of having
    to be retrieved by click.


    The problem with instant messaging is that there is no standard. Among the most
    popular instant messaging clients are AIM (www.aol.com) ICQ (www.icq.com), Yahoo
    (www.yahoo.com), and Microsoft Network, or MSN (http://www.hotmail.com). There
    are Linux clients for AIM, ICQ, and Yahoo. A whole page of these can be found
    on Fresh Meat, which is a site listing open source software for Linux (http://www.freshmeat.com/appendix/x11/communication.html).


    Two programs to rate are Everybody and licq. Everybody manages several different
    instant messaging accounts with one program. It currently supports AIM and ICQ
    with support for Yahoo and MSN to be added soon (www.everybuddy.com).


    licq only supports ICQ, but it supports some of the advanced features of ICQ such
    as multi-user chat (www.liq.org).


    There is also a project to make an open source instant messaging server and client
    based on the XML standard (see the chapter on productivity applications for an
    explanation of XML). Details on the Jabber project, along with servers and clients,
    are available at http://www.jabber.com/.'
  merge: -1
