    # 17.1 Setting Up the FTP Server for Windows


    For Windows NT, you must install the Internet Information Services. This is done
    by going to Start -> Programs -> Microsoft Internet Server (Common) -> Internet
    Information Server Setup. From here, install the FTP services.


    After the FTP services are installed, go to Programs -> Microsoft Internet Server
    (Common) -> Internet Server Manager. When this is opened, you will see a list
    of services. Double-clicking on FTP Services will bring up the FTP Properties
    configuration utility. The first tab is the Service tab. Under this tab:


    +   - TCP Port The default is 21. Leave it at 21 unless you have a good reason
    to change it.

    - Connection Timeout—This is the number of seconds until an idle connection is
    dropped. The default of 900 should work under most circumstances. Increase it
    if you have a slow connection that is being dropped due to the time-out.

    - Maximum Connections—The default is 1000. This can be adjusted higher if your
    system can handle the load, or if it can''t handle the load.

    - Allow Anonymous Connections—This is the account that anonymous connections are
    logged in as. Set the rules on the account accordingly.

    - Allow Only Anonymous Connections—Don''t allow FTP connections under any other
    user.

    - Comment—This doesn''t affect anything. It is used to add notes and comments.


    The Messages allows you to add a welcome message, exit message, and a maximum
    connections message. These should be self-explanatory.

    The Directories allows you to set the directories to which the FTP user has access.
    The alias is how the directory appears to the FTP client. The <Home> alias is
    the root directory of the FTP client. For example, lets say that the <Home> alias
    is set to the c:\data directory. When you type cd / (or cd\) in the FTP client,
    you will be in the c:\data directory on the server.'
