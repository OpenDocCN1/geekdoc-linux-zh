    # Trapdoor UID


    +   > Log message "you appear to have a trapdoor uid system


    This can have several causes. It is because you are using a uid or group 65535
    or -1. This is a VERY bad idea, and a security hole. Check carefully in your /etc/passwd
    file and make sure that no user has 65535 or -1. Especially the “no-body” user,
    as many broken systems are shipped with nobody system with a uid of 65535.


    It also means that your OS has a trapdoor/uid system changes effective uid from
    root to another user you can''t go back to root. Unfortunately Samba relies on
    being able to change uid from root to non-root and back again to implement its
    security policy. If your OS has a trapdoor uid system this won''t work, and several
    things in Samba may break. Less things will break if you use user or server level
    security instead of the default share level security, or you may still strike
    problems.


    The problems don''t give rise to any security holes, so don''t panic, but does
    some of Samba''s capabilities will be unavailable. In particular you will not
    be able to connect to the server as two different uids at once. This may happen
    if you try to print as a guest” while accessing a share as a normal user. It may
    also affect your ability to list the available shares as this is normally done
    as the guest user.


    Note: the reason why 65535 is a VERY bad choice of uid and gid that it casts to
    -1 as a uid, the setreuid() system call ignores (with no error) uid changes to
    -1. This means any daemon attempting to run uid 65535 will actually run as root.
    This is not good!


