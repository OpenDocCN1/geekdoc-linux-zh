    ```


    After the app downloads, the browser will display a VNC session. If you are connecting
    to a Linux server, you will also have to put in the class files of the vnc-server
    script. The Windows server has this built into it.


    On the downside, the Java viewer isn''t as fast or as stable as the stand-alone
    viewer. You can experiment with different encoding schemes to see if they make
    any difference in speed.


    # 10.3.6 Optimizing VNC


    The VNC server is much faster than the Windows version. This is because access
    to the source code allows the Linux version of VNC to be optimized better. Windows
    doesn''t have readily available source code, so it is less optimized.


    There are some optimizations that can be done on VNC server, though. If VNC server
    is running at 100% load, check to see if the Poll Full Screen, Poll Foreground,
    or Poll Windows Under Cursor is if they are not needed. If you have any of these
    turned on, you can turn on Poll Console Windows Only to decrease CPU usage. There
    are some optimizations that can be done on all VNC systems. If VNC is running
    too slowly, some of these steps to increase performance:


    +   - Clean the desktop—A busy desktop with lots of color and graphics will take
    longer to update. Remove any backgrounds or extra graphics that are not needed.

    - Reduce the resolution—Lower the resolution of the desktop. Don''t use a 1280
    x 1040, 24-bit desktop when 16- or 8-bit 800 x 600 will do. This is especially
    important on a modern connection.

    - Upgrade the card—An upgrade of older graphics card on the viewer machine will
    greatly increase the screen updates.

    - Upgrade the applications—Some older applications are slow at screen updates.
    For example, some older versions of Netscape update the screen twice when scrolling.

    - Optimize Java—Some settings can greatly increase the speed of the updates. Try
    different settings to find the best ones.

    - Turn off offline dragging—When using the Windows window manager. Most of the
    time, this is already turned off. If it is enabled, your Linux documentation for
    how to do this, it varies with different settings.

    - Use Secure Shell (SSH)—SSH compresses the data and will increase the speed on
    slow connections. Setting up SSH is explained in Chapter 16. Setting up VNC to
    work with SSH is explained later in this chapter.'
