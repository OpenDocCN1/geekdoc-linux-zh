  md: '# 320 Appendix C: Samba Man Pages


    There is no default for this parameter. If not supplied, it will be determined
    automatically by the client as described above.


    +   - -E This parameter causes the client to write messages to the standard error
    stream (stderr) rather than to the standard output.


    By default, the client writes messages to the standard output—typically the user''s
    tty.


    +   - -U username This specifies the user name that will be used by the client
    to make a connection, assuming your server is not a downlevel server that is running
    a protocol level that uses passwords on shares, and some insist that it must be
    a valid NetBIOS name.


    Some servers are fussy about the case of this name, and some insist that it must
    be a valid NetBIOS name.


    If no username is supplied, it will default to an uppercase version of the environment
    variable USER or LOGNAME in that order. If no username is supplied and neither
    environment exists the variable "GUEST" will be used.


    If the USER environment variable contains ''%'' everything after that will be
    treated as a password. This allows you to set the environment variable to be USER%password
    so that password is not passed on the command line (where it may be seen by the
    ps command).


    If the service you are connecting to requires a password


    -U fred%secret


    on the command line. Note that there are no spaces around the percent symbol.


    If you specify the password as part of username then the -N option (suppress password)
    is prompted.


    If you specify the password as part of username AND then the password will take
    as part of username. Nothing before or after the percent symbol will create an
    empty environment or an empty password to be, respectively.


    The password may also be specified by setting up an environment variable called
    PASSWORD that contains the users password. Note that this may be insecure on some
    systems but on others allows users to script smclient commands without having
    a password in the command line of a process list.


    Some servers (including OS/2 and Windows for Workgroups) insist on an uppercase
    password. Lowercase or mixed case passwords may be rejected by these servers.


    Be cautious about including passwords in scripts or in the PASSWORD environment
    variable. Also, on many systems the command line of a running process may be seen
    via the ps command so always allow smclient to a password and what you need in
    directly.


    +   - -L smclient -L host allows you to look at what services are available on
    a server. You use it as " and a list should appear. The -I option may be useful
    if your NetBIOS names don''t match your tcp/ip dns names or if you are trying
    to reach a host on another network.'
