    setup.exe and 16 bit programs


    Running 16 bit programs from Windows NT on a Samba mapped drive


    The Windows NT redirector has a bug when running against a Samba or Windows 95

    mapped drive and attempting to run a 16 bit executable.


    The problem occurs when the pathname to a 16 bit executable contains a non 8.3
    file-name compliant directory component, Windows NT will fail to load the program

    and complain it cannot find the path to the program.


    It can be verified that this is a bug in Windows NT and not Samba as the same
    problem

    be reproduced when attempting to run the same program with the same pathname

    from a Windows 95 server (i.e. the problem still exists even with no Samba server
    involved).


    Microsoft has been aware of this problem, it is unknown if they regard it as se-nious
    enough to provide a fix for this.


    One of the reasons this problem is reported frequently is that InstallShield.exe\executables
    are frequently written as 16 bit programs, and so hit this problem.


    As a workaround, you may create (on a Samba server at least) a symbolic link with
    an 8.3

    compliant directory name, and the 16 bit program will

    run. Alternatively, use the 8.3 compliant name to specify the path to the binary.


    This will be fixed when Samba adds the NT-specific SMB calls in Samba 2.0 as

    the NT SMB calls are used this problem no longer occurs (which is why the problem

    does''t occur when running against a drive mapped to a Windows server).


