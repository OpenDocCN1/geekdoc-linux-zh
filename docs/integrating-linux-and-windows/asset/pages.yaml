  md: '# 5.9 Internet Security


    Putting a computer on the Internet attaches it to millions of computers worldwide.
    In most cases, this is good, but it also opens your computer to remote attacks.


    The standard load of Linux or Windows is not very secure. Linux and Windows tend
    to load every background program available, which opens avenues of attack for
    hostile crackers. Turning off unused services is a first step in Internet security.
    privileged processes running as root or equivalent are allowed to connect to them.
    These ports are used for common protocols such as FTP, telnet, and HTTP.


    There are several ways to tell what service you have running. One is to list the
    processes with ps -ef|more. This will bring up a list similar to the following:


    | PID | STAT | COMMAND |

    |---|---|---|

    | 1 | S | 0:03 init [5] |

    | 2 | ? | 0:00 [kflushd] |

    | 3 | ? | 0:00 [update] |

    | 4 | ? | 0:00 [kpiod] |

    | 5 | ? | 0:05 [kswapd] |

    | 6 | SW< | 0:00 [mdcoveryd] |

    | 341 | S | 0:00 syslog -m 0 |

    | 351 | S | 0:00 klogd |

    | 366 | S | 0:00 /usr/sbin/atd |

    | 381 | S | 0:00 cron |

    | 396 | ? | 0:00 [lpd] |

    | 435 | ? | 0:01 xifs -port -1 -daemon |

    | 449 tty1 | SW | 0:00 [mingetty] |

    | 450 tty2 | SW | 0:00 [mingetty] |

    | 451 tty3 | SW | 0:00 [mingetty] |

    | 452 tty4 | SW | 0:00 [mingetty] |

    | 453 tty5 | SW | 0:00 [mingetty] |

    | 454 tty6 | SW | 0:00 [mingetty] |

    | 455 ? | S | 0:00 kdm -nodemon |

    |--More--|


    The first field is the process ID. This is a number that is assigned to each process.

    The second field, TTY, is the terminal number. A ? is used for an unknown terminal.
    This usually means it is a system or X11 process.

    The third field is the status of the process. These mean the following:


    +   - D-Uninterruptible sleep (usually IO).

    - R-Runnable (on run queue).

    - S-Sleeping.

    - T-Stopped or stopped.

    - Z-A defunct ("zombie") process.'
  merge: -1
  pgno: 67
