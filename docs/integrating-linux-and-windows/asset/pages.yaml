  md: "# CHAPTER\n17\nIMPLEMENTING FTP, TELNET AND OTHER UNIX PROTOCOLS IN WINDOWS\n\
    \nFTP (File Transfer Protocol) and telnet are among the oldest Internet protocols\
    \ that allow two UNIX machines transfer files (FTP) and log on to another computer\
    \ (telnet). Each of these programs consist of a client and a server. The client\
    \ is bundled with all current versions of Linux and the syntax is ftp <remote>\
    \ or telnet machine>. The remote machine has the FTP or telnet server running.\
    \ Keep in mind that these protocols transmit information (including usernames\
    \ and passwords) in the clear, so they would not be suitable for insecure networks\
    \ like the Internet. If you need to use these over a secure network, use an encryption\
    \ program such as Secure Shell (SSH), which is explained later in this chapter.\n\
    \nThe FTP program has a text-based interface in both Linux and Windows. It is\
    \ started at the command prompt by typing ftp. You can also type in the machine\
    \ name (or IP address) such as ftp.cdrom.com. The remote machine may have a username\
    \ and password. Anonymous FTP servers use cdrom.com, the username is anonymous\
    \ and the password is your email address.\n\n```\nftp.cdrom.com\nConnected to\
    \ warchie.cdrom.com\n220 warchie.cdrom.com FTP server (Version DG-3.1.37 Sun Jun\
    \ 20\n21:18:25 PDT 19\n99) ready.\nName (ftp.cdrom.com:root): mmccune@linuxstart.com\n\
    333 Guest login, send your email address as password.\n```\n\nThe commands for\
    \ FTP and those for the smclient that were discussed in Chapter 14 are identical.\
    \ Once connected, you can type status to check the settings. The type: setting\
