  md: 'smbpasswd (8) 341


    Once this operation has been performed the smb.conf file may be updated to set
    the security-domain option and all future logins to the Samba server will be authenticated
    to the Windows NT PDC.


    Note that even though the authentication is being done to the PDC all users accessing
    the Samba server must still have a valid UNIX account on that machine.

    This is only available when running smbpasswd as root.


    +   - -U Username option may only be used in conjunction with the -r option. When
    changing a password on a remote machine it allows the user to specify the username
    on that whose password will be changed. It is present to allow users who have
    different user names on different systems to change these passwords.


    +   - -h This option prints the help string for smbpasswd, selecting the correct
    one for running as root or as an ordinary user.


    +   - -s This causes smbpasswd to be silent (i.e. not issue prompts) and to read
    it''s old and new passwords from standard input, rather than /dev/tty (1) program
    does). This option is to aid people writing scripts to drive smbpasswd


    +   - username This specifies the username for all the root only options to operate
    on. Only root can specify this parameter as root has the permission needed to
    modify attributes directly in the local smbpasswd file.


    # # Notes


    Since smbpasswd works in client-server mode communicating with a local smbd for
    a non-root user then the smbd daemon must be running for this work. A common problem
    is to add restriction to the hosts that may access the smbd running on the local
    machine by specifying a "allow hosts" or "deny hosts" entry in the smb.conf file
    and neglecting to allow "localhost" access to the smbd.


    In addition, the smbpasswd command is only useful if Samba has been set up to
    use encrypted passwords. See the file ENCRYPTION.txt in the docs directory for
    details on how to do this.


