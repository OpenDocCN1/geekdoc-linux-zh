- img_proc: true
  md: '# File Format


    The format of the smbpasswd file used by Samba 2.0 is very similar to the familiar
    Unix passwd (5) file. It is an ASCII file containing one line for each user. Each
    field within each line is separated from the next by a colon. Any entry beginning
    with # is ignored.

    The smbpasswd file contains the following information for each user:


    +   - name

    This is the user name. It must be a name that already exists in the standard UNIX
    passwd file.

    - uid

    This is the UNIX uid. It must match the uid for the same user entry in the standard
    UNIX passwd file. If this does not match then Samba will refuse to recognize this
    smbpasswd file entry as being valid for a user.

    - Lanman Password Hash

    This is the LANMAN hash of the users password, encoded as 32 hex digits. The LANMAN
    hash is created by DES encrypting a well known string with the password as the
    key. This is the same password used by Windows 95/98 machines. Note that this
    password hash is regarded as weak as it is vulnerable to dictionary attacks and
    if two users choose the same password this entry will be identical (i.e. the password
    is not "salted" (as the UNIX password is). If the user has a null password this
    field will contain the characters "NO PASSWORD" as the start of the hex string.
    If the hex string is equal to 32 *X characters then the accounts are marked as
    disabled and the user will not be able to log onto the Samba server.


    WARNING !!. Note, due to the challenge-response nature of the SMB/CIFS authentication
    protocol, anyone with knowledge of this password hash will be able to impersonate
    the user on the network. For this reason these hashes are known as "plain text
    equivalent" and must NOT be made available to the root user. To protect these
    the smbpasswd file is placed in a directory with read and traverse access only
    to the root user with no other access.


    +   - NT Password Hash

    This is the Windows hash of the users password, encoded as 32 hex digits. The
    Windows NT hash is created by taking the users password as represented in 16-bit,
    little-endian UNIC and then applying the MD4 (internet rfc1321) algorithm to it.


    This password hash is more secure than the case of the Lanman Password Hash as
    it preserves the case of the password and uses a much higher quality hashing algorithm.
    However, it is still the case that if two users choose the same password this
    entry will be identical (i.e. the password is not salted)


    WARNING !!. Note, due to the challenge-response nature of the SMB/CIFS authentication
    protocol, anyone with knowledge of this password hash will be able to impersonate
    the user on the network. For this reason these hashes are known as "plain text
    equivalent" and must NOT be made available to the root user. To protect these
    the smbpasswd file is placed in a directory with read and traverse access only'
  merge: -1
  pgno: 350
- img_proc: true
  md: 'to the root user and the smbpasswd file must be set to read/write only by root,
    with no other access.


    +   - Account Flags

    This section contains flags that describe the attributes of the users account.
    In the Samba2.0 release this field is bracketed by ''['' and '' ]'' characters
    and is always 13 characters in length (including the ''['' and '']'' characters).
    The contents of this field may be any of the characters.

    - ''U'' This means this is a “User” account, i.e. an ordinary user. Only User
    and Work-station Trust accounts are currently supported in the smbpasswd file.

    - ''N'' This means the account has no password (the passwords in the Lanman Password
    Hash and NT Password Hash are ignored). Note that this will only allow users to
    log on no password if the null password parameter is set in the smb.conf (5) config
    file.

    - ''D'' This means this account is disabled and no SMB/CIFS logins will be allowed
    for this user.

    - ''W'' This means this account is a “Workstation Trust” account. This kind of
    account is used in the Samba PDC code stream to allow Windows NTstations Servers
    to join a Domain hosted by a Samba PDC.


    Other flags may be added as the code extends in future. The rest of this field
    space is filled with spaces.


    +   - Last Change Time

    This field consists of the time the account was last modified. It consists of
    the characters LCT-(standing for “Last Change Time”) followed by a numeric encoding
    of the UNIX time in seconds since the epoch (1970) that the last change was made.

    - Following fields

    All other colon fields are ignored at this time.


    # Notes


    In previous versions of Samba (notably the 1.9.18 series) this file did not contain
    the Account Flags or Last Change Time fields. The Samba 2.0 could read and write
    older password files but will not be able to modify the entries to add the new
    fields. Entries added with smbpasswd (8) will contain the new fields in the added
    accounts however. Thus an old smbpasswd file used with Samba 2.0 may end up with
    some accounts containing the new fields and not more.


    In order to convert from an old-style smbpasswd file to a new style, the script
    convert-smbpasswd, installed in the Samba bin/ directory and nmmbd (the same place
    where the smbd and nmmbd are installed) as follows:


    ```

    cat old_smbpasswd_file | convert_smbpasswd > new_smbpasswd_file

    ```'
