    +   - queueservice command (S)

    This parameter specifies the command to be executed on the server host in order
    to resume the printerqueue. It is the command to undo the behavior that is caused
    by the previous parameter ("queuepause command").


    This command should be a program or script which takes a printer name as its only
    parameter and resumes the printerqueue, such that queued jobs are resubmitted
    to the printer.


    This command is not supported by Windows for Workgroups, but can be issued from
