  md: 'There are two Windows-only databases that are widely used:


    +   - Access—This database is bundled with Microsoft Office Professional. It is
    intended as a light-duty database and it is popular as a front-end database server.

    - SQL Server—This is Microsoft’s heavy-duty database. It is popular on Microsoft-based
    networks.


    While this list is not comprehensive, it covers some of the more popular databases.


    # 7.1 Using Databases


    All the major databases support Structured Query Language (SQL). SQL is a standard
    from the International Organization for Standardization (ISO) that provides a
    uniform language for manipulating databases. That being said, all the databases
    use a slightly different variation of SQL, with some supporting the ISO standard
    better than others.


    SQL has commands for creating databases, adding data, and retrieving data. Create
    is used to create and change the tables in a database. The major commands are:


    +   - Create Table—Creates a table.

    - Drop Table—Deletes a table.

    - Alter Table—Changes a table.

    - Insert—Inserts data into a table.

    - Select—Retrieves data from a table.


    Of course there are many other commands and subcommands in SQL. To further matters,
    each database has its own command syntax. If you are serious about databases,
    get a book on the specific database you plan to use.


    # 7.2 Choosing a Database


    Many factors go into choosing a database, which is one of the reasons why so many
    are on the market. Among the most important factors are fault tolerance, support,
    and price.


    Fault tolerance is especially important for databases that are updated often.
    While there are many factors to consider in database fault tolerance, three of
    the most important are transactions, hot backups, and locking.


    Transactions keep backup copies of any data being updated. This allows old data
    to be recovered in the event of an error. This ensures data integrity, it creates
    a lot of overhead. Transactions take a lot of processor time and disk space. It
    is not unusual for a database to run up to ten times slower while using transactions.
    Also, the files created by enabling transactions are larger than the database
    itself.


    Hot backups allow data to be backed up without shutting down the database. This
    feature is a must-have for databases that need to operate 24 hours a day.'
  merge: -1
