    +   * keepalive (G)

    The value of the parameter (an integer) represents the number of seconds between
    ''keepalive'' packets. If this parameter is zero, no keepalive packets will be
    sent. Keepalive packets, if sent, allow the server to tell whether a client is
    present and responding.

    Keepalives should, in general, not be needed if the socket being used has the
    SO_KEEPALIVE attribute set on it ("socket options”). Basically you should only
    use this option if you strike difficulties.

    **Default:** keep alive = 0

    **Example:** keep alive = 60


    +   * kernel oplocks (G)

    For UNIXs that support kernel oplocks (currently only IRIX hopefully also Linux
    and FreeBSD) this parameter allows the use of them to be turned on or off.

    Kernel oplocks allows Samba locks to be broken when a local UNIX process or NFS
    operation accesses a file that has smbd locked. This completes complete data consistency
    with SMB/CIFS, NFS and local file access (and is a very cool feature).

    This parameter defaults to "On" on systems that have the support, and "off" on
    systems that don''t. You should never need to touch this parameter.


    +   * ldap bind as (G)

    This parameter is part of the EXPERIMENTAL Samba support for a password database
    stored on an LDAP server. These options are only available if your version of
    Samba was configured with the —with-ldap option.

    This parameter specifies the entity to bind to an LDAP directory. Usually it should
    be safe to use the LDAP root account; for larger installations it may be preferable
    to restrict Samba’s access. See also ldap passed file.


    **Default:** none (bind anonymously)

    **Example:** ldap bind as = "uid=root, dc=mydomain, dc=org"'
