  md: '# CHAPTER 10


    # RUNNING APPLICATIONS THROUGH A NETWORK


    # 10.1 X-Windows


    X-Windows version 11 (X11) is the standard graphics interface for Linux and UNIX.
    It comes in two parts: a client and a server. The client runs the programs and
    the server runs the display.


    The client and the server are often run on the same machine, which allows Linux
    to run graphical programs locally.


    They can also be run on different machines, which allows you to run the programs
    on one machine and display them on another machine. The client would be running
    on the machine that has the programs and the server would be running on the machine
    displaying the screen. This is different from the common perception of the client
    and server, where the server contains the programs and the client runs them.


    X11 splits the load between the client and the server. The client runs the application
    and the server processes the graphics. This takes some of the load off the server,
    but it also creates more network traffic. This was done in the early days of computing
    to allow (relatively) inexpensive workstations to run off a single, expensive
    server.


    # 10.1.1 X-Windows on Linux


    X11 comes with virtually every modern distribution of Linux. Normally, X11 is
    configured when Linux is installed. To configure X11, you need three things: a
    supported video card, the model and specifications of your monitor, and the type
    of your mouse. To find out your video card is supported, go to http://www.xfree86.org/cardlist.html.
    Monitor specifications are listed in the documentation that comes with the monitor.
    If you don''t have it, monitors are listed at http://ms.ha.md.us/~hawks/hardware/monitor.html.
    The Horizontal sync (Hsync), Vertical sync (Vsync), and Maximum Resolution (Max
    Res) are the most important settings. Your user manual should have a detailed
    description on how to install and configure X11. An abbreviated version of the
    configuration instructions are below.


    To configure X11, use Xconfigurator. Linux distributions use X86Setup. Most supported
    cards are found with the autoprobe option. If your card is not found, you can
    enter'
