    # 14.5 smbfs


    Server Message Block Filesystem (smbfs) allows you to mount a drive on a Windows
    machine like you would mount a drive on a Linux or UNIX machine. To mount a Windows
    drive, you need two things:


    +   1. smbfs support in the Linux kernel.

    2. Programs to mount and unmount the smbfs.


    Most current Linux distributions have smbfs support built in. If your kernel doesn''t
    have smbfs support, you will need to rebuild your kernel with smbfs support or
    use a load-module. Since kernels and kernel modules are beyond the scope of this
    book, consult your documentation or a good Linux book on how to do this.


    Once kernel support for smbfs has been added, you will need to use the utilities
    smbmount and smbmount for mounting and unmounting Windows shares on your Linux
    machine. smbmount uses the same command-line parameters as smclient <share <mount
    point>. The general syntax of the command is c share on the Windows machine alias,
    if we wanted to mount the c share on /mnt/alisa created on the Linux drive for
    the mount point.


    ```

    smbmount //alisa/c /mnt/alisa

    Added interface ip=10.0.0.2 bcast=10.0.0.255 nmask=255.255.250

    [root@mmcune client]# #

    ```


    We can now change the mount directory and run ls:


    ```

    [root@mmcune alias]# cd /mnt/alisa

    [root@mmcune alias]# ls -l

    total 20230

    -drwxr-xr-x 1 root      root 512 Aug 6 14:31 Acrobat3

    -drwxr-xr-x 1 root      root 76503 Nov 8 12:22 BOOTLOG.PRV

    -drwxr-xr-x 1 root      root 76127 Nov 8 12:35 BOOTLOG.TXT

    -drwxr-xr-x 1 root      root 93890 Apr 23 1999 COMMAND.COM

    -drwxr-xr-x 1 root      root 59 Nov 8 13:14 CONFIG.SYS

    (deleted brevity)

    [root@mmcune alias]#

    ```


    Notice that it looks just like a Linux directory. It stands the standard Linux
    permissions even though Windows machines don''t support the same permissions as
    Linux. smbfs sim-'
