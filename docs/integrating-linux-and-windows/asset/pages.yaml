  md: '# Reading and Writing Microsoft Office Files


    ![](img/a1ad58e4259f15e8b2826ecf57a28362_78_0.png)


    Web-based office suites are still relatively new. Will they catch on? Do they
    offer cross-platform compatibility and the ability to store documents on the Web.
    On the downside, they aren''t as mature and full-featured as the stand-alone applications.
    The server-based applications have the additional disadvantage of not allowing
    offline use. Only time will tell if WBS will catch on.


    # Reading and Writing Microsoft Office Files


    Using Office files in other programs has always been tricky. Even using Office
    files in older versions of Office causes problems. Converting a complex Word document
    from Office 97 to Word 95 format will often result in a loss of formatting. To
    further complicate matters, MS Office has changed the data format in every version
    of Office. This means that Office 95 will not be able to open documents created
    in Office 97. This often forces people to upgrade their version of MS Office just
    to be able to read documents created by the version of Office. Things may be changing
    in this regard, MS Office 2000 uses the same format as MS Office 1997.'
