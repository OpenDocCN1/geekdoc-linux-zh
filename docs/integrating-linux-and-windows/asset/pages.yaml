  md: '# Operations


    Once the client is running, the user is presented with a prompt :


    ```

    smb: \\

    ```


    The prompt indicates that the client is ready and waiting to carry out a user
    command. Each command is a single word, optionally followed by parameters to specify
    that command. Command and parameters are space-delimited unless these notes specifically
    state otherwise. All commands are case-insensitive. Parameters to commands may
    or not be sensitive, depending on the command.


    You can specify file names that have spaces in them by quoting the name with double
    quotes, e.g "a long file name".


    Parameters shown in square brackets (e.g., "[parameter]") are optional. If not
    given, the command will use suitable defaults. Parameters shown in angle brackets
    (e.g., "<parameter>") are required.


    Note that all commands operating on the server are actually performed by issuing
    a request to the server. This behavior may vary from server to server, depending
    on how the server was implemented.


    # The commands available are given here in alphabetical order.


    +   * [command] If "command" is specified, the ? command will display a brief
    informative message about the specified command. If no command is specified, a
    list of available commands will be displayed.

    * ! [shell command] If "shell command" is specified, the ! command will execute
    a shell locally and run the specified shell command. If no command is specified,
    a local shell will be run.

    * cd [directory name] If "directory name" is specified, the current working directory
    on the server will be changed to the directory specified. This operation will
    fail if any reason the specified directory is inaccessible.

    * del <mask> The client will request that the server attempt to delete all files
    matching "mask" from the current working directory on the server.

    * dir <mask> A list of the files matching "mask" in the current working directory
    on the server will be retrieved from the server and displayed.

    * exit Terminate the connection with the server and exit from the program.

    * get <remote file name> [local file name] Copy the file called "remote file name"
    from the server to the machine running the client. If specified, name the local
    copy'
