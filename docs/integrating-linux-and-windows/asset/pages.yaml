  md: '# CHAPTER 16


    # USING NFS AND NIS LINUX AND WINDOWS


    NFS is the native UNIX protocol that allows UNIX machines to share drives through
    a network. It performs some of the functions of Microsoft’s SMB protocol. NFS
    is a much simpler protocol since it doesn''t include authentication and printing.
    Authentication is handled by the UNIX (or Linux) hosts and printing functions
    are handled by lpr and lpd.


    NFS is a good protocol for mixed networks. It is not only used by Linux and all
    other forms of UNIX, it is also available for all major operating systems, including
    those for mainframes, midranges, and PCS. It is a much simpler protocol than SMB,
    and thus uses less system and network resources. It is not a persistent connection,
    which means that if an NFS client loses contact with the NFS server, it will reconnect
    when the server comes online.


    Linux has (built-in) NFS support in the kernel, along with utilities to manage
    NFS. NFS allows a Linux machine to share a drive or directory with another machine
    (as a server). It also allows the Linux machine to mount drives on other machines
    (as a client).


    Windows doesn''t have NFS support, but there are many third-party programs that
    add NFS support to Windows. There are two ways to connect a Windows machine to
    an machine. One is to load an NFS program on each Windows machine. The second
    is to use a machine as a gateway between the NFS machine and the Windows machine.
    The programs and methods are discussed later in the chapter.


    # 16.1 Setting up Linux as an NFS Server


    Setting up Linux as an NFS server will allow you to share drives and directories
    on the Linux machine. Although NFS support is included with Linux distributions,
    it still needs to be set up.


    The first thing that needs to be done is to start the portmap service. Most distributions
    start the portmap by default. To see if the portmap is started, type:


    ```

    rpcinfo -p

    program vers proto port

    100000 2 tcp 111 portmapper

    100000 2 udp 111 portmapper

    ```'
  merge: -1
  pgno: 174
- img_proc: true
  md: "# Chapter 16 • Using NFS and NIS in Linux and Windows\n\nYou should see the\
    \ portmapper attached to the tcp and udp ports. If the portmapper is not started,\
    \ you need to add it to your init scripts. You may need to check your manual or\
    \ reference book to see how to do this, since it varies with different distributions.\
    \ The portmapper program is named portmap, rpc, or rpcbind and is located in /sbin\
    \ or /usr/sbin directory. The init scripts are in /etc/rc.d, /etc/init.d, or /etc/rc.d/init.d.\n\
    \nFor example, in the Red Hat distribution of Linux, you would add the script\
    \ portmap to the /etc/rc.d/init.d directory. The portmapper script comes with\
    \ Red Hat is listed below:\n\n```\n#! /bin/sh\n# portmap          Start/Stop RPC\
    \ portmapper\n# chkconfig: 345 11 89\n# description: The portmapper manages RPC\
    \ connections, which are used by \\\\\n#               protocols such as NFS and\
    \ NIS. The portmapper server must be \\\\\n#               running on machines\
    \ which acts as servers for protocols \\/\n#               make use of the RPC\
    \ mechanism.\n# processname: portmapper\n# Source function library.\n# /etc/rc.d/init.d/functions\n\
    \n# Get config.\n# /etc/sysconfig/network\n\n# Check that networking is up.\n\
    if [ $(WORKING) = \"no\" ]\nthen\n    exit 0\nfi\n-f /sbin/portmap || exit 0\n\
    \n# See how we were called.\ncase \"$1\" in\nstart)\n    echo -n \"Starting portmapper:\
    \ \"\"\n    daemon portmapper\n\n    echo\n    touch /var/lock/subsys/portmap\n\
    \    ;;\nstop)\n    echo -n \"Stopping portmapper services: \"\"\n    killproc\
    \ portmapper\n\n    echo\n    rm -f /var/lock/subsys/portmap\n    ;;\nstatus)\n\
    \    status portmapper\n    ;;;\n```"
