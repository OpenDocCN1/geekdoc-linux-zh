    The latest version of X11 for Linux (XFree864) offers 3-D acceleration and a more
    modular design. The modular design will make it easier for vendors to write drivers
    for Linux (http://www.xfree86.org).


    There is the 3-D API OpenGL, which was developed by Silicon Graphics Incorporated
    (SGI). SGI has been the preferred platform on which to develop 3-D graphics. It
    was used for movies such as Jurassic Park and Terminator 2. OpenGL is similar
    to DirectX in that it gives a standard interface for rendering graphics on different
    video cards. OpenGL is currently a work in progress for Linux. Information and
    binaries for Linux are available at http://www.sgi.com/projects/. General information,
    tools, and programs are available at http://www.opengl.org/.


    Mesa is another popular 3-D API for Linux. It was originally developed as part
    of the SSEC Visualization Project at the University of Wisconsin (http://www.ssec.wisc.edu/~bill/vis.html).
    This project''s goal was to create scientific modeling programs. Brian Paul''s
    work on this project was later released as Mesa.'
