  md: '# Chapter 17 • Implementing FTP, telnet and Other UNIX Protocols


    UDP Services such as NIS, NFS, and DNS. A general implementation of UDP services
    can be found at http://ftp.tu-chemnitz.de/pub/Local/informatik/sec_rpc/, and even
    though it has only been implemented for NIS, it should work with NFS and DNS as
    well.


    FTP and POP Services. SSH2 has secure FTP with it, there are two ways to use SSH
    on FTP. The simplest way is to download a secure version of FTP from http://www.docs.uu.edu/~pem/hacks/.
    Another way to do it is to redirect FTP through an SSH connection. To do this,
    redirect the port FTP uses (Port 21) to an unused local port. For example, to
    connect to the FTP server mmccune using the local port, 1234:


    ```

    ssh -L 1234:mmccune:22 mmccune

    ```


    Then open an FTP session using the local port, 1234:


    ```

    ftp localhost 1234

    ```


    Please note that the standard FTP servers accept connections through an SSH port,
    but some FTP servers as WU-FTP may not. If your FTP server doesn''t work, check
    the documentation to see if it supports passive mode.


    POP services are easily redirected through an SSH connection. You can use the
    script gwpop at http://ftp.internat.org/pub/unix/gwpop/.


    TCP Wrappers. TCP Wrappers allow a computer to allow or deny access to certain
    services based on the connecting machine''s IP address. To use this with SSH,
    SSH must be compiled with TCP Wrapper support. First, configure it with these
    options:


    ```

    # ./configure --with-lib-wrap/PATHOF/libwrap.a

    ```


    Then, add the following lines to the SSH Makefile:


    ```

    -I/PATHOF/tcpwrappers

    WRAPLIBS = -PATHOF/tcpwrappers -lwrap

    ```


    X11. Like TCP Wrappers, X11 support must be compiled into SSH. The only thing
    necessary is configure SSH for X-Windows:


    ```

    ./configure --with-x

    ```


    Then compile it normally. After that is done, change the configuration file for
    the SSH server and client. Add this line to the client, default location is /etc/ssh_config.


    ```

    ForwardX11 yes

    ```


    Add the following to the server''s configuration file located at /etc/sshd_config:


    ```

    ForwardX11 yes

    ```


    For SSH2, you only need to change the server''s configuration by adding the following
    line to /etc/ssh/sshd2_config:


    ```

    ForwardX11 yes

    ```


    Keep in mind that if you are using TCP Wrappers, you must add the line sshdfwd-X11:
    to the host.allow file.'
