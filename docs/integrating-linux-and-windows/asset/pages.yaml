  md: '# 13.2 Adding a Samba Server to an Existing Network


    Setting up a Samba server as a stand-alone network is relatively easy. Setting
    it up on an existing network is more complicated. You will have to get all the
    settings for the existing network, including the PDC and BDC, WINS servers, routers,
    and printers.


    Samba has no problem joining a Windows domain, but it cannot act as a BDC, and
    it also cannot exchange data with WINS servers. Additionally, using Samba as a
    PDC is still in the experimental stage, so do not use Samba in a production environment
    where you have been warned!


    Entering Samba into a Windows domain is relatively easy. First, create an account
    for the Samba machine in the Windows domain using the Server Manager for Domains
    as a stand-alone server or workstation. Just go to Computer -> Add to Domain.
    Type in the computer name and click Add.


    ![](img/a1ad58e4259f15e8b2826ecf57a28362_147_0.png)


    Figure 13.1 Adding a computer to a domain in Windows NT with Server Manager.


    Next, we need to configure sm.conf on the Samba machine. For this example, we
    will call the domain NTDomain, the PDC will be NTPDC, the BDC will be NTIS, and
    the WINS server will be at IP address 10.0.0.2. First, we need to stop Samba with
    this command:


    ```

    samba stop

    ```


    Next add these settings to samba.conf:


    Security = Domain

    Workgroup = NTDomain

    Password Server = NTPDC ; (This can be set to * if you want Samba

    to automatically locate the password server)

    ennrypt passwords = yes

    wins server = 10.0.0.2'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# 13.3 Samba as a Primary Domain Controller


    After we restart Samba, (samba start) we need to create a Machine ID for the computer.
    The Machine ID is how the Domain Controllers identify each device in the Domain.
    To create this ID, type the following command:


    ```

    smbpassword -j NTDomain -r NTPDC

    ```


    If successful, you should get a “Joined domain NTDomain” message. If you get another
    message, first check to see that there are no errors or typos in the previous
    steps. If this doesn''t fix the problem, use the troubleshooting steps from the
    last chapter. Also, at the end of the appendix are troubleshooting procedures
    specific to NT Domains.


    # 13.3 Samba as a Primary Domain Controller


    As mentioned earlier, Samba can act as a PDC, but the full functions are not yet
    complete. The functions that work include:


    +   - The ability to act as a PDC for Windows NT 3.51 Service Pack 5 and 4.0 Service
    Pack 4 clients. This includes adding NT machines to the domain and authenticating
    users logging into the domain.

    - The domain account can be viewed via the User Manager for Domains.

    - Viewing resources on the Samba PDC via the Server Manager for Domains of the
    NT client.

    - Windows 95 clients allow user-level security to be set, but will not currently
    allow browsing accounts.

    - Machine account password updates.

    - Changing of user passwords from an NT client.

    - Username <-> RID mapping, which stands for Relative Identification, which identifies
    a user on the domain.

    - Some work with this as the NT tools from pedastal software. Tools, like explorer.exe,
    do not.

    - Partial support for Windows NT group and username mapping.

    - Support for an LDAP password database back-end.


    Some of the features that are not implemented yet are:


    +   - Trust relationships.

    - PDC <-> BDC integration.

    - Network printing (although there is a workaround).

    - Windows NT Access Control Lists (ACLs) on the Samba shares.


    If you still want to use Samba as a PDC, download and compile the latest code
    first. The easiest way to do this is to use a Revision Control System (RCS), which
    is included with most Linux distributions. To see if an RCS is installed on your
    system, use cvs in the prompt to pull the help message. If you don''t have RCS,
    you can download it from ftp://ftp.gnu.org/rcs.'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# Chapter 13 • Setting Up Samba as a Windows NT


    Once RCS is installed, log into the Samba cvs server. Use your email address as
    the password:


    ```

    cvs -d :pserver:cvs@cvs.samba.org:/cvsroot login

    ```


    Then download the newest source code into the /samba directory:


    ```

    cvs -d :pserver:cvs@cvs.samba.org:/cvsroot co samba

    ```


    The alpha and beta code will have more of the features than the latest (stable)
    code, but they will be less stable. In any case, using Samba as a PDC is not recommended
    in a production environment. For instructions on compiling the code, see Chapter
    12.


    Setting up the smb.conf of a Samba PDC is the same as setting up a normal Samba
    server except for the following:


    ```

    workgroup = NTDomain

    encrypt password = yes

    domain logon = yes

    preferd master = yes

    security = user

    ```


    You might also want to include the following, but don''t enable WINS support unless
    there are no other WINS servers on the local subnet:


    ```

    wins support = yes

    logon script = %u.bat (%u is a variable that translates to the username)

    ```


    If you enable login scripts, create a netlogon share:


    ```

    [netlogon]

    path = <path of netlogon directory>

    writable = no

    guest = no

    ```


    Then create machine accounts for the PCs. This is equivalent to adding them with
    the Server Manager for Domains on a Windows NT server.


    ```

    smbpassword -m <netbios name of machine>

    ```


    On the Microsoft workstations, change the domain to match the Samba server, but
    make sure the Create Account check is not selected. When you select OK, you should
    get the message "Welcome to the <domain name> domain". Then reboot the workstation
    and log in. You should have a box with three fields: Name, Password, and Domain.
    This concludes a brief explanation of the workstation configuration.


    The Microsoft client''s configuration is exactly as it would be for connecting
    to a Microsoft server. Just be sure TCP/IP is configured and NetBIOS over TCP/IP
    is enabled (it is usually enabled by default in Windows). This is set in the Network
    icon in the Control Panel.'
