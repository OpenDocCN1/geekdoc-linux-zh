  md: '# 10.2 Citrix WinFrame


    # 10.2.1 Overview of the Server


    Citrix WinFrame is a product that gives Windows NT the ability to act like X-Windows.
    It allows multiple users to start a session on an NT server and display the session
    on a workstation.


    Unlike other Windows products, WinFrame allows a separate session for each user.
    Most other Windows products such as PC Anywhere of VNC allow multiple users, but
    not multiple sessions. In other words, multiple users can log on, but all see
    the same screen as Citrix WinFrame.


    Microsoft Terminal Server was licensed from Citrix and provides the same functionality
    as Citrix WinFrame. Although there are subtle differences in the products, we
    will discuss Citrix WinFrame, since Citrix also makes a Linux, which allows Linux
    machines to run Windows software on an NT server and display it on the Linux machine.


    Because the applications are running entirely on the server, make sure that the
    server can handle the load. Unlike X-Windows, all the processing is done on the
    server. This puts less stress on the network, but make more stress on the server.


    We will begin by figuring out the minimum configuration to handle the clients.
    Remember, this is the minimum; more is always better.


    First, count the number of users and divide the users into normal users and power
    users. A normal user would only need to use one program at a time, whereas a power
    user would use several programs at once. Then, allocate 48MB of RAM for NT and
    WinFrame, plus 10MB for each normal user and 16MB for each power user.


    For example, if you have 20 normal users and 10 power users, you would need 200MB
    for normal users (20 × 10), plus 160MB for power users (10 × 16), plus 48MB for
    NT and WinFrame,


    CPU speed also makes a difference. It is a good idea not to put more than about
    50 users per CPU. If you have more than 50 users, get a PC with multiple CPUs
    (SMP) or get an additional PC. If you are running multiple WinFrame servers, it
    is load balancing soft-available from Citrix for $1,495.


    Keep in mind that X11 and WinFrame both require a lot of bandwidth. While a 10MB
    network will work for a very small network, a 100MB network is really needed.
    If this isn''t enough bandwidth, consider installing multiple NT servers on a
    switched network.


    # 10.2.2 Client Configuration


    For the client side, you have three choices: You can use the Citrix-independent
    Client Architecture (ICA) client, the Java client, or X-Windows.


    The ICA client allows the full functionality of the Metaframe. To install it,
    simply decompress the client file linuxd.tar. Next, run the setup program setupcf.
    By default, it will install the client into the /usr/lib/ICAClient directory.
    To configure it, run the wcmgr and use Entry -> New Option to set up the server
    to connect. Supply the optional username, password, and domain. You can set up
    multiple servers, if needed.'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# Chapter 10 • Running Applications through a Network


    ![](img/a1ad58e4259f15e8b2826ecf57a28362_113_0.png)


    Figure 10.1 The Citrix ICA client for Linux.


    To open an ICA session, double-click on the session you wish to open. Enter a
    username and password, if needed. WinFrame will then open the WinFrame session
    inside it.


    You can also use the Java client to load a session into your browser. Currently,
    the only browser that supports the Java client properly is Netscape. When you
    connect to the server, a Java applet is downloaded and the WinFrame session starts
    inside your browser. This allows Linux machines without the client to run a WinFrame
    session, but it is much slower and not stable. The user must wait for the Java
    applet to download, and once it is downloaded, it is not as fast as the ICA client.
    The Java client is also not stable and it often crashes the browser.


    WinFrame also supports X11 with the Citrix UNIX Integration Client. This is a
    package that loads on the server and acts as an X11 client. It allows the Linux
    workstation to connect to the WinFrame server using the X11 server that comes
    with Linux. For example, to start an X11 WinFrame session 0 on Server1, type:


    ```

    xinit Server:0

    ```


    While this allows connection to WinFrame without installing the ICA client, many
    of the features are not supported by the UNIX Integration Client. For example,
    load balancing between multiple servers is not supported. Other features such
    as client drive mapping, application publishing, persistent cache, compression,
    COM port mapping, and local printing are not supported.


    Unless there is a reason to do otherwise, it is best to install the ICA client
    on all Linux and Windows machines that need to attach to a WinFrame server. This
    allows the full functionality of the WinFrame services on all the clients.


    # 10.2.3 Application Configuration


    Since WinFrame is designed as a single-user OS, installing applications on a WinFrame
    server requires extra configuration to use them as multi-user applications. For
    example, with Microsoft Office, install the program on the server. Then, copy
    the user configuration'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'files to the user''s home directory on the server. These files include: normal.dot,
    mail-box.pap, username.fav, username.prf, outprnt, frmcache.dat, custom.dic, and
    pptools.npa. Next, edit the HKEY_CURRENT_USER tree of the session''s Registry
    to change the location where it is looking for configuration files. You will also
    have to disable the Fastfind feature, since Office will open a new Fastfind session
    for each user, which will quickly use up all the server''s resources.


    There are other problems unique to a WinFrame environment. For example, many functions
    require write access to the system root directory to work. The system root is
    the directory in which Windows system files are installed, which is the c:\wint
    or c:\windows directory on the server. One function that requires write access
    to the system root is the ability to embed Windows Web links in an Office document.
    If there is no access to the system root, the user will get a message telling
    them to run scandisk or install Internet Explorer. As an administrator, you will
    need to decide whether these functions are important enough to give the user full
    access to the system files.


    This is not to be a full account of all the issues involved in setting up an WinFrame
    server, but it should give you an idea of the complexity involved. On the positive
    side, once set up, managing a WinFrame server is a lot easier than managing multiple
    clients.


    # 10.2.4 Cost


    While WinFrame is a good solution for running Windows applications, it is not
    cheap. The prices are given as suggested retail prices. Your prices may vary.


    The first expense is buying NT Server. This costs $1,200 for a ten-user license,
    plus about $35 for each additional user. Then you must buy a copy of Windows for
    each PC used. For Linux clients, you must buy a Windows NT license (which costs
    about $270) to use it on a Windows NT server.


    The WinFrame or MetaFrame server costs $5,000 for a 15-user server, with each
    additional license costing about $200. The cost of applications can vary. The
    cost of the base version of Microsoft Office is $280 per user.


    So, the cost of a 50-user network would be $2,600 for the NT Server with a 50-user
    license. The cost of 50 clients would be $13,500, and a 50-user WinFrame license
    would be $12,000. Finally, the cost of 50 copies of Microsoft Office would be
    $14,000. This would make our hardware unnecessary. Luckily, the WinFrame client
    will run on low-end 386 hardware, so a hardware upgrade is usually unnecessary.
    You would also save in support costs, since the centralized management makes support
    easier (http://www.citrix.com).


    # 10.3 VNC


    Virtual Network Computing (VNC) allows program running on one machine to be played
    on and it is available for Linux and Windows. It is distributed under the GNU
    Public License (GPL), so like Linux, it is free and open source. It is similar
    to X11 and Citrix except for a few differences.'
