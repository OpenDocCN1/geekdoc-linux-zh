  md: '# Win4Lin


    Win4Lin is the “new kid on the block.” It allows Linux users to run a Windows
    session in Linux, but not the other around. It is faster than VMware, runs with
    much less memory (it can easily run with 32 MB of RAM), and sells for about $40.


    I''ve had the chance to play with the early version of it, and it seems faster,
    but it isn''t stable as VMware. In its defense, I reviewed a beta version, so
    these bugs should be worked out over time.


    # Conclusion


    Currently, the best way to run Windows programs on an Intel Linux platform is
    with VMware. Most Windows programs will run VMware without a problem. The downside
    is that it is closed source, commercial software. It also requires you to buy
    a copy of Windows to run Windows programs. This may not be a problem since Windows
    is bundled with most PCs, however.


    FreeMW is a promising open source project that is currently not developed enough
    for normal use.


    The WINE project currently only runs a limited number of Windows programs. It
    is, however, free and open source (under the GPL) and is progressing rapidly.'
  merge: -1
