  md: '# smb.conf (5)


    +   * root postexecc (S)

    This is the same as the “postexecc” parameter except that the command is run as
    root.

    This is useful for unmounting filesystems (such as cdroms) after a connection
    is closed.

    See also “postexecc”.


    +   * root preexecc (S)

    This is the same as the “preexecc” parameter except that the command is run as
    root.

    This is useful for mounting filesystems (such as cdroms) before a connection is
    finalized.

    See also “preexecc”.


    +   * security (G)

    This option affects how clients respond to Samba and is one of the most important
    settings in the smb.conf file.

    The option sets the “security mode bit” in replies to protocol negotiations with
    smbd to share level security on or off. Clients decide based on this whether (and
    how) to transfer user and password information to the server.

    The default is “security-user”, as this is the most common setting needed talking
    to Windows 98 and Windows NT.

    The alternatives are “security=share”, “security=server” or “security=domain”.

    *\*\*\*NOTE THAT THIS DEFAULT IS DIFFERENT IN SAMBA2.0 THAN FOR PREVERSIONS OF
    SAMBA \*\*\*\*\*\.


    In previous versions of Samba the default was “security=share” mainly because
    that was the only option at one stage.

    There is a bug in WfG that has relevance to this setting. In user or server level
    a Wfg client will totally ignore the password you type in the “connect drive”
    dialog box. This it very difficult (if not impossible) to connect to a Samba service
    except the one that you are logged into Wfg.


    If your PCs usernames are the same as “Security= user” as their usernames on the
    UNIX machine then you will want to use security=share. If you mostly usernames
    that don’t exist on the UNIX box then use “security= share”.


    You should use security=share if you want to manyley setups without a password
    (guest shares). This is commonly used for a shared printer server. It is more
    difficult to setup guest shares with security=user, the “map to guest”parameter
    for details.


    It is possible to use smbd in a “hybrid mode” where it offers both user and server
    level security. See the NetBIOS aliases and the include parameters for more information.

    The different settings will now be explained.


    +   * security=share” When clients connect to a share level security server then
    need not log onto the server with a valid username and password before attempting
    to connect to a shared resource (although modern clients such as Windows 95/98
    and Windows NT will send a log request with a username but no password when talking
    to a se-security=share. Instead, the clients send authentication information (passwords)
    on a per-share basis, at the time they connect to share.'
