  md: '# Linux and Windows 95/98


    There are several ways to install Linux on Windows 3x/9x on the same machine.
    They are listed below, starting with UmsDOS. Before anything is, back up your
    hard drive and run scandisk on the hard drive to correct any errors. This will
    save you a lot of trouble down the road.


    # 1.4.4 UMSDOS


    The easiest way to install Linux on a Windows 9x machine is to use UMSDOS, which
    allows Linux to co-exist with Windows on a FAT or FAT32 partition. It allows Linux
    to boot directly from a command prompt on the FAT partition. On the plus side,
    you avoid reing the hard drive or disturbing the existing Windows installation.
    On the minus side, you lose the security and robustness of Linux''s native ext2
    filesystem.


    If you plan on using UMSDOS, it is best to choose a distribution with an automated
    UMSDOS install. Most modern distributions have a UMSDOS as Phat Linux. It is a
    heavy download, unless you have a connection and a lot of time, you might want
    to buy the CD-ROM. As a bonus, you also get technical support with the purchase.


    Phat Linux was originally put together by two high school kids who wanted an easy
    way to install Linux. To install it, unzip the files to the \hat directory and
    run linux.bat. If it hangs during the bootup, it may be necessary to reboot, press
    F8 on bootup, and choose the Safe Mode prompt. After the bootup, there will be
    a menu that you choose the configuration to set up the video, sound, and networking.
    The linux.bat is only three lines, as shown below:


    ```

    loadlin vmlin initrd-ramdisk.gz mem=96M

    echo Linux failed to load.

    ```


    The first line actually loads Phat Linux. The command is broken down:


    +   - loadlin—This is the loader for UMSDOS.

    - vmlinuz—This is the Linux kernel.

    - initrd—Points to a memory image. Phat Linux uses a compressed memory image to
    start the operating system.

    - ramdisk.gz—A compressed file that contains the complete Linux filesystem. This
    can also be a directory.

    - Mem—The amount of memory in megabytes.


    Phat Linux is based on Red Hat with a KDE desktop, so anyone familiar with Red
    Hat should be able to use Phat Linux.

    UMSDOS can be easily installed manually since support for it is built into the
    Linux kernel for some time. Most distributions will set everything up for you,
    but knowing how it works will help with troubleshooting.


    The default directory in install UMSDOS is \linux. This acts like the root directory
    for Linux. Under this are the standard Linux directories of bin, etc, lib, root,
    sbin, tmp, usr, and var.'
