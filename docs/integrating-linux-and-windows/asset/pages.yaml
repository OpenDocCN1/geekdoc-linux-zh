  md: '# 10.3 VNC


    You can also specify which session number to use. For example, to use session
    2, type vncserver :2. You can kill the server by typing vncserver -kill <:session
    number>.


    There are several command-line parameters for VNC server. These are shown by typing
    vncserver -help. Here are what the parameters mean (from the VNC documentation):


    +   - name <name>—Each desktop has a name, which may be displayed by the viewer.
    It defaults to ''x'', but you can change it with this option.


    +   - geometry <width><height>—Specifies the size of the desktop to be created.
    The default is 1024x768.


    +   - depth <depth>—Specifies the pixel depth in bits of the desktop to be created.
    The default is 8.


    +   - pixelformat <format>—Specifies the pixel format for the server to use (BGRnnn)


    +   - kill <number>—Kills a specified session number.


    You can also pass parameters to the xvnc server from the command line. Xnc is
    the actual VNC server very similar to X11 and uses many of the same commands.
    The parameters that you can pass to xvnc (from the VNC documentation again):


    +   - alwaysshared—Always treat new clients as shared (i.e., ignore client''s
    shared flag).


    +   - nevershared—Never treat new clients as shared (i.e., ignore client''s shared
    flag).


    +   - disconnect—Don’t disconnect existing clients when a new “non-shared” connection
    comes in. Instead, the connection is refused. New “shared” connections are still
    allowed in the normal way.


    +   - localhost—Only allow connections from the same machine. This is useful if
    you want to use SSH and to stop non-SSH connections from any other hosts. The
    guide to using VNC with SSH.


    +   - cc—Sets the color of the virtual class used by the server. Some X-Windows
    applications don’t cope well with the TrueColor visual normally used by an 8-bit
    depth xvnc. You can make the server use a PseudoColor by specifying -cc 3.


    +   - translate—The server normally uses a lookup table for translating pixel
    values when the viewer requests a different format from the native used by the
    server. This can cost up to 256KB per connected viewer, so if you have many viewers,
    you may wish to specify this option, which will save memory at the expense of
    a little bit of speed. This is only relevant for 16-bit-depth desktops.


    The server runs ~/.vnc/xstart after it is started. This is where you would change
    your window manager. The default window manager is twm, which is small and fast,
    but very Spartan. To change to KDE, for example, you can pass the line & to startkde.


    The server also writes log files in the ~/.vnc directory. These files are useful
    in debugging VNC.'
