- img_proc: true
  md: '# 312


    # Appendix C: Samba Man Pages


    +   - valid chars (S)


    The option allows you to specify additional characters that should be considered
    valid by the server in filenames. This is particularly useful for national character
    sets, such as adding u-umlaut or a-ring.


    The option takes a list of characters in either integer or character form with
    spaces between them. If you give two characters with a colon colon between them
    it will be taken as an lowercase:uppercase pair.


    If you have an editor capable of entering the characters into the config file
    it is probably easiest to use this method. Otherwise you can specify the characters
    in octal, decimal or hexadecimal using the usual C notation.


    For example to add the single character ''Z'' to the charset (which is a pointless
    thing to do as it''s already there) you could do one of the following


    ```

    valid chars = Z

    valid chars = z:Z

    valid chars = 0132:0172

    ```


    The last two examples above add two characters, and alter the uppercase and lowercase
    mappings appropriately.


    Note that you MUST specify this parameter after the "client code page" parameter
    if you have both set. If "client code page" is set after the "valid chars" parameter
    the "valid chars" settings will be overwritten.


    See also the "client code page" parameter.


    Default defaults to using a reasonable set of valid characters for English systems


    Example: valid chars = 0345:0305 0366:0326 0344:0304

    The above example allows filenames to have the Swedish characters in them.


    NOTE: It is actually difficult to produce a "valid chars" line for a particular
    system. To automate the process tino@augsburg.net has written a package called
    "validchars" which will automatically complete a "valid chars" line for a client
    system. Look in the examples/validchars/ subdirectory of your Samba source distribution
    for this package.


    +   - valid users (S)


    This is a list of users that should be allowed to login to this service. Names
    starting with ''@'', ''+'' and ''&'' are interpreted using the same rules as described
    in the "invalid users" parameter.


    If this is empty (the default) then any user can login. If a username is in both
    this list and the "invalid users" list then denied for user.


    The currentervices is substituted for "%S". This is useful in the [homes] section.
    See also "invalid users".'
  merge: -1
