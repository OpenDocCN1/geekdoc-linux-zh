  trans: "\n\n# Shell 脚本模板\n\n```bash\n#!/bin/bash\n## <替换为此 shell 脚本的描述和/或目的>\nGLOBAL_VAR1=\"\
    one\"\nGLOBAL_VAR2=\"two\"\n\nfunction function_one() {\n  local LOCAL_VAR1=\"\
    one\"\n  # <替换为函数代码>\n}\n\n# 脚本正文在此开始。\n# <替换为你的 shell 脚本的主要命令>\n# 以显式的退出状态退出。\n\
    exit 0\n```\n\n上述模板由一系列简短的最佳实践组成。首先，所有脚本都应该以 shebang 开头。这是脚本的第一行，它显式地声明了使用哪种解释器来执行脚本。\n\
    \n接下来，你应该至少包含一行注释，来总结脚本的作用和存在的原因。如果你愿意，也可以包含更多信息。有些人喜欢包含诸如其类的信息，例如脚本的原始作者、脚本版本以及其他细节。\n\
    \n如果你打算使用全局变量，它们应该紧随其后，除非它们的值在脚本的后续部分才能确定。函数应该紧随其之后。将你所有的函数在全局变量之后分组在一起。\n\n在函数内部，定义局部函数的变量时，务必使用\
    \ `local` 关键字。在函数部分之后，你的 shell 脚本的主部分开始。\n\n最后，记住显式地使用退出状态。如果你不提供退出状态（一个 `0` 到\
    \ `255` 之间的数字），则上一个执行命令的退出状态将作为你脚本的退出状态。最好由你控制这一点，而不是听由概率。至少用 `exit 0` 行结束你的脚本。如果你的脚本能够运行到最后一行，那么在大多数情况下，它已经成功完成。还要记住你的\
    \ shell 脚本可能终止的其他地方。你需要在那些地方也使用 `exit` 语句。例如，如果你的脚本执行了某种检查并因为检查失败而停止，你将希望以非零退出状态退出。\n\
    \n## 我个人收藏的脚本\n\n如果你想查看我个人收藏的一些 shell 脚本，请访问：[`github.com/jasonc/scripts`](https://github.com/jasonc/scripts)\n\
    \n## 恭喜与感谢！\n\n恭喜你完成了这本书！为了感谢你阅读这本书并读到最后，我想为我的 shell 脚本课程提供一个巨大的折扣。\n\n仅需 15 美元（原价\
    \ 99 美元的 85 折）即可报名——请访问：[`www.linuxtrainingacademy.com/shell-course`](http://www.linuxtrainingacademy.com/shell-course)\n\
    \n我期待在课程中见到你！\n感谢，Jason\n\n## 作者的其他书籍\n\n- **命令行武术：Bash 脚本技巧、Linux Shell 编程贴士与\
    \ Bash 单行命令** [`www.linuxtrainingacademy.com/command-line-kung-fu-book`](http://www.linuxtrainingacademy.com/command-line-kung-fu-book)\n\
    - **LAMP 栈的高可用性：为你的基于 Linux、Apache、MySQL 和 PHP 的 Web 应用程序消除单点故障并增加运行时间** [`www.linuxtrainingacademy.com/ha-lamp-book`](http://www.linuxtrainingacademy.com/ha-lamp-book)\n\
    - **初学者 Linux：Linux 操作系统和命令行介绍** [`www.linuxtrainingacademy.com/linux`](http://www.linuxtrainingacademy.com/linux)\n\
    - **面向初学者的 Python 编程** [`www.linuxtrainingacademy.com/python-programming-for-beginners`](http://www.linuxtrainingacademy.com/python-programming-for-beginners)\n\
    \n## 包含你的专属折扣的额外资源\n\n如需更多资源，请访问：http://www.linuxtrainingacademy.com/resources](http://www.linuxtrainingacademy.com/resources)\n\
    \n## 书籍\n\n### 命令行武术\n你认为你必须把自己锁在地下室里连续阅读几个月晦涩的 man 手页，才能拥有像忍者一样的命令行技能吗？实际上，如果有人和你分享他们最强大的命令行技巧、技巧和模式，你将节省大量的时间和挫败感。这本书正是要做这些。\n\
    \n### LAMP 栈的高可用性\n为你的基于 Linux、Apache、MySQL 和 PHP 的 Web 消除单点故障并增加运行时间\n\n### 初学者\
    \ Linux\n如果你对学习编程感兴趣，或者特别是学习使用 Python，那么这本书适合你。在书书中，你将学习如何安装 Python、选择哪个版本、如何为你的电脑准备以获得良好的体验，以及开始编写完整功能程序所需的所有计算机编程基础。\n\
    \n### 面向初学者的 Python 编程\n\n## 课程\n\n### LAMP 栈的高可用性\n学习如何设置高可用 LAMP 栈（Linux、Apache、MySQL、PHP）。你将学习负载均衡、数据库集群、创建分布式文件系统等。\n\
    \n### 5 天学会 Linux\n接下来的 5 天里，每天花 45 分钟，我将教你关于 Linux 操作系统所需的全部知识。你将学习到最重要的概念和命令，我甚至会引导你逐步完成几个实用且真实的示例。\n\
    \n### Shell 脚本编写\n\n### 云托管和 VPS（虚拟专用服务器）\n#### Digital Ocean\n为开发者构建的简单云托管。仅需\
    \ 55 秒即可部署 SSD 云服务器。每月低至 5 美元即可拥有自己的服务器。\n\n### 使用 SSH 和 Shell 访问 Web 托管\n####\
    \ Bluehost\n我 99% 的网站都托管在 Bluehost 上。为什么？因为它非常易用，具有一键自动安装 WordPress 的功能以及卓越的客户服务——通过电话和聊天。我强烈建议你的第一个网站使用\
    \ Bluehost。此外，如果你计划创建更多网站，可以使用同一个托管账户管理多个域名。访问 http://www.linuxtrainingacademy.com/bluehost\
    \ 获取比原价更低的折扣！\n\n## 附录：商标\n\n- BSD/OS 是 Berkeley Software Design, Inc. 在美国及其他国家的商标。\n\
    - Facebook 是 Facebook, Inc. 的注册商标。\n- Firefox 是 Mozilla Foundation 的注册商标。\n- HP\
    \ 和 HEWLETT-PACKARD 是属于 Hewlett-Packard Development Company, L.P. 的注册商标。\n- `IBM®`\
    \ 是 International Business Machines Corp. 的注册商标，已在全球许多司法辖区注册。\n- `Linux®` 是 Linus\
    \ Torvalds 在美国及其他国家的注册商标。\n- `Mac` 和 `OS X` 是 Apple Inc. 的商标，在美国及其他国家注册。\n- `Open\
    \ Source` 是 Open Source Initiative 的注册认证标记。\n- `Sun` 和 `Oracle Solaris` 是 Oracle\
    \ Corporation 关联公司在美国及其他国家的商标或注册商标。\n- `UNIX` 是 The Open Group 的注册商标。\n- `Windows`\
    \ 是 Microsoft Corporation 在美国及其他国家的注册商标。\n- 这里提到的所有其他产品名称均为其所有者的商标。\n\n"
