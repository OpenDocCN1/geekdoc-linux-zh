    PS4You may be familiar with the PS1 environment variable.  It controls what is
    displayed as your command prompt.  There are other variables similar to this one. 
    The one that is valuable for shell script debugging is PS4 .PS4 is expanded and
    displayed before each command during an execution trace.  That means, when you
    are using set -x or the -x option for your bash script, the contents of PS4 are
    printed to the screen.  By default, this is the plus sign.  However, we can explicitly
    set the PS4 variable.  Bash includes several built-in variables such as $BASH_SOURCE
    , which is the name of the script itself, and $LINENO , which is the line number
    in the script.  To see even more variables, visit:  [http://www.gnu.org/software/bash/manual/html_node/Bash-Variables.html](http://www.gnu.org/software/bash/manual/html_node/Bash-Variables.html)Here
    is an example of using the PS4 variable.  This script sets PS4 to "+ $BASH_SOURCE
    : $LINENO : " .#!/bin/bash -xPS4=''+ $BASH_SOURCE : $LINENO : ''TEST_VAR="test"echo
    "$TEST_VAR"Output:+ PS4=''+ $BASH_SOURCE : $LINENO : ''+ ./test.sh : 3 : TEST_VAR=test+
    ./test.sh : 4 : echo testtestYou can see that when the script gets executed, the
    output changes after the PS4 variable is set.  This can make the output clearer.  
    For example, if we have a problem with the echo command, we know we can edit the
    script and head straight for line 4.Here is a more advanced example.  It just
    includes more information, such as the function name. #!/bin/bash -xPS4=''+ ${BASH_SOURCE}:${LINENO}:${FUNCNAME[0]}()
    ''debug() {  echo "Executing: $@"  $@}debug lsOutput:+ PS4=''+ ${BASH_SOURCE}:${LINENO}:${FUNCNAME[0]}()
    ''+ /tmp/j:7:() debug ls+ /tmp/j:4:debug() echo ''Executing: ls''Executing: ls+
    /tmp/j:5:debug() lsYou can see how the PS4 variable allowed us to print the function
    name using the built-in variable FUNCNAME .File TypesPlain text files, like we
    are working with for shell scripts, contain a control character to represent the
    end of a line.  For Unix and Linux systems, the control character representing
    a new line is a Line Feed.  DOS or Windows systems actually use two characters
    to represent a new line: a carriage return and a line feed.If you''ve ever created
    a text file on a Linux system and sent it to someone who is using a Windows system,
    it may very well display as one long line on their computer.  This is due to the
    lack of carriage returns.If you were to do the opposite, create a text file on
    a Windows system and open it on a Linux system, there will be additional characters,
    specifically carriage returns, in that file.  The problem in this situation is
    that when you display the contents of the file to the screen, you will not see
    the additional carriage returns.  For example, if you ran cat script.sh and that
    file had carriage returns in it, you wouldn''t see them.  You have to run cat
    -v script.sh to display non-printable characters, like carriage returns.  Carriage
    returns are represented by the caret symbol followed by M (^M ).$ cat script.sh#!/bin/bash#
    This file contains carriage returns.echo "Hello world."$ cat -v script.sh#!/bin/bash^M#
    This file contains carriage returns.^Mecho "Hello world."^MIf you execute a file
    that contains carriage returns, you''ll probably run into an error like this:
    "/bin/bash^M:, No such file or directory. " The carriage return is being treated
    as part of the file name.  In order to get this script to run, we need to remove
    the carriage returns.This situation is another reason why you should always start
    your scripts with a shebang.  If you didn''t have the shebang line, the commands
    would be executed using your current shell.  This can lead to strange things happening. 
    The script might work as expected in some parts, but totally fail at other parts
    due to carriage returns. If you start getting strange errors that make no sense,
    check to see if there are carriage returns in your script.In addition to using
    the cat -v command to see if there are carriage returns in a file, you can also
    use the file command.  If it finds the additional carriage returns, it will alert
    you to the fact.To easily remove these characters, I recommend that you use the
    dos2unix utility.  It may not be installed by default on your system, so you may
    have to manually install it if you need it.  This utility converts a DOS file—or
    a file with carriage returns—into a Unix file, or a file without carriage returns. 
    There is another utility which does the opposite, and it''s called unix2dos .After
    you run the dos2unix command against your file, you''ll find that the carriage
    returns are removed.  You can confirm this by running the file command against
    the file.  You''ll notice there is no warning about CRLF line terminators.$ file
    script.shscript.sh: Bourne-Again shell script, ASCII text executable, with CRLF
    line terminators$ dos2unix script.sh$ file script.shscript.sh: Bourne-Again shell
    script, ASCII text executableUsually, you end up with these unwanted carriage
    returns in your shell scripts due to creating a file on a Windows system and uploading
    that file to a Linux system.  If you want to create shell scripts on a Windows
    system, see if your editor supports Unix-style line endings.  If it does support
    this option, turn it on.  Also, some editors can convert between dos and Unix
    style file types.You can also end up with unwanted characters in your shell scripts
    if you copy some text from your windows computer and paste it into your putty
    window.  Even if you''re using an all Linux system, the copy and paste action
    can get you.  For example, if you copy some text from a web page that has carriage
    returns in it and then paste that into a text file, that file may contain those
    carriage returns.ReviewIn this chapter, you learned how to use a few different
    built-in bash options to aid you in debugging shell scripts.  You learned what
    the -x , -e , and -v options do and how to combine them.  You also learned how
    to use variables to assist you in debugging and creating shell scripts.  We talked
    about the advantages of using an editor that has syntax highlighting support. 
    You learned about the PS4 variable and how to use that in conjunction with an
    x-trace.  Finally, you learned about the challenges of switching back and forth
    between windows and Linux, and more importantly, how to catch and correct errors
    caused by carriage returns.Practice ExercisesExercise 1:Write a shell script that
    exits on error and displays commands as they will execute, including all expansions
    and substitutions.  Use 3 ls commands in your script.  Make the first one succeed,
    the second one fail, and the third one succeed.  If you are using the proper options,
    the third ls command will not be executed.Exercise 2:Modify the previous exercise
    so that script continues, even if an error occurs.  This time, all three ls commands
    will execute .Solutions to the Practice ExercisesExercise 1:#!/bin/bash -exls
    /etc/passwdls /move/along/nothing/to/see/herels /etc/passwdExercise 2:#!/bin/bash
    -xls /etc/passwdls /move/along/nothing/to/see/herels /etc/passwdShell Script Checklist1\.
    Does your script start with a shebang?Example:#/bin/bash2\. Does your script include
    a comment describing the purpose of the script?Example:# This script creates a
    backup of every MySQL database on the system.3\. Are the global variables declared
    at the top of your script, following the initial comment(s)?Example:DEBUG=trueHTML_DIR=/var/www4\.
    Have you grouped all of your functions together following the global variables?5\.
    Do your functions use local variables?Example:local GREETING="Hello!"6\. Does
    the main body of your shell script follow the functions?7\. Does your script exit
    with an explicit exit status?Example:exit 08\. At the various exit points, are
    exit statuses explicitly used?Example:


    if [ ! -d "$HTML_DIR" ]then


