    \ -x` 或 `-x` 选项时，`PS4` 的内容会被打印到屏幕上。默认情况下，这是一个加号。不过，我们可以显式地设置 `PS4` 变量。\n\nBash\
    \ 包含了几个内置变量，例如 `$BASH_SOURCE`（脚本本身的名称）和 `$LINENO`（脚本中的行号）。要查看更多变量，请访问：[`www.gnu.org/software/bash/manual/html_node/Bash-Variables.html`](http://www.gnu.org/software/bash/manual/html_node/Bash-Variables.html)\n\
    \n这里是一个使用 `PS4` 变量的示例。该脚本将 `PS4` 设置为 `\"+ $BASH_SOURCE : $LINENO : \"`。\n\n```bash\n\
    #!/bin/bash -x\nPS4='+ $BASH_SOURCE : $LINENO : '\nTEST_VAR=\"test\"\necho \"\
    $TEST_VAR\"\n```\n输出：\n```\n+ PS4='+ $BASH_SOURCE : $LINENO : '+ ./test.sh : 3\
    \ : TEST_VAR=test\n+ ./test.sh : 4 : echo test\n```\n你可以看到当脚本执行时，在设置 `PS4` 变量后输出发生了变化。这可以使输出更清晰。例如，如果\
    \ `echo` 命令有问题，我们知道可以直接编辑脚本并直达第 4 行。\n\n这是一个更高级的示例。它包含了更多信息，例如函数名。\n\n```bash\n\
    #!/bin/bash -x\nPS4='+ ${BASH_SOURCE}:${LINENO}:${FUNCNAME[0]}() '\ndebug() {\n\
    \  echo \"Executing: $@\"\n  $@\n}\ndebug ls\n```\n输出：\n```\n+ PS4='+ ${BASH_SOURCE}:${LINENO}:${FUNCNAME[0]}()\
    \ '+ /tmp/j:7:() debug ls\n+ /tmp/j:4:debug() echo 'Executing: ls'\nExecuting:\
    \ ls\n+ /tmp/j:5:debug() ls\n```\n你可以看到 `PS4` 变量如何允许我们使用内置变量 `FUNCNAME` 输出函数名。\n\
    \n## 文件类型与行结束符\n\n文本文件（如我们处理 Shell 脚本时使用的文件）包含一个表示行结束的控制字符。对于 Unix 和 Linux 系统，表示新行的控制字符是\
    \ `换行符`（Line Feed）。DOS 或 Windows 系统实际上使用两个字符来表示换行：`回车符`（carriage return）和 `换行符`（line\
    \ feed）。\n\n如果你曾在 Linux 系统上创建了一个文本文件并发送给使用 Windows 系统的人，那么该文件在他们的电脑上很可能显示为长长的一行。这是由于缺少\
    \ `回车符`。如果你相反操作，在 Windows 系统上创建文本文件并在 Linux 系统上打开它，该文件中会有额外的字符，特别是 `回车符`。\n\n\
    （注：原文中剩余的关于回车符和 shebang 的重复/乱码句子已压缩，以保持关于 `dosunix` 和 `^M` 字符表示的核心技术信息。）\n\n##\
    \ 练习题\n\n### 练习 1\n编写一个 Shell 脚本，使其在出错时退出并在执行执行时显示命令，包括所有的展开和替换。在脚本中使用 3 个 `ls`\
    \ 命令。让第一个成功，第二个失败，第三个成功。如果你使用了正确的选项，第三个 `ls` 命令将不会执行。\n\n### 练习 2\n修改上一个练习，使脚本在发生错误时继续运行。这一次，三个\
    \ `ls` 命令都将执行。\n\n## 练习题答案\n\n### 练习 1\n```bash\n#!/bin/bash -ex\nls /etc/passwd\n\
    ls /move/along/nothing/to/see/\nls /etc/passwd\n```\n\n### 练习 2\n```bash\n#!/bin/bash\
    \ -xls\nls /etc/passwd\nls /move/along/nothing/to/see/\nls /etc/passwd\n```\n\n\
    ## Shell 脚本清单\n\n1. 你的脚本是以 shebang 开头的吗？例如：`#!/bin/bash`\n2. 你的脚本是否包含描述脚本用途的注释？例如：`#\
    \ This script creates a backup of every MySQL database on the system.`\n3. 全局变量是否声明在脚本顶部、紧随初始注释之后？例如：`DEBUG=true`，`HTML_DIR=/var/www`\n\
    4. 你是否将所有函数都集中写在全局变量之后？\n5. 你的函数是否使用了局部变量？例如：`local GREETING=\"Hello!\"`\n6. 你的\
    \ Shell 脚本主体是否在函数之后？\n7. 你的脚本是否带有显式的退出状态退出？例如：`exit 0`\n8. 在各个退出点处，是否显式地使用了退出状态？例如：\n\
    \n```bash\nif [ ! -d \"$HTML_DIR\" ]; then\n  echo \"$HTML_DIR does not exist.\
    \ Exiting.\"\nfi\n```\n\n"
- fmt: "\n# Shell Script Template\n\n```bash\n#!/bin/bash\n## <Replace with the description\
    \ and/or purpose\n# of this shell script.>\nGLOBAL_VAR1=\"one\"\nGLOBAL_VAR2=\"\
    two\"\n\nfunction function_one() {\n  local LOCAL_VAR1=\"one\"\n  # <Replace with\
    \ function code.>\n}\n\n# Main body of the shell script starts here.\n# <Replace\
    \ with the main commands of your\n# shell script.>\n# Exit with an explicit exit\
    \ status.\nexit 0\n```\n\nThe above template is comprised of a short series of\
    \ best practices. First off, all scripts should start with a shebang. This is\
    \ the first line of your script and it explicitly declares which interpreter is\
    \ used to execute the script.\n\nNext, you should include at least a one-line\
    \ comment summarizing what the script does and why it exists. You can include\
    \ more information if you like. Some people like to include information such as\
    \ the original author of the script, the version of the script, and other details.\n\
    \nIf you are going to use global variables, they should come next unless their\
    \ value cannot be determined until a later point in your script. Functions should\
    \ come next. Group all of your functions together following the global variables.\n\
    \nWithin your functions, be sure to use the `local` keyword when defining variables\
    \ that are local to the function. Following the functions section, the main portion\
    \ of your shell script begins.\n\nFinally, remember to explicitly use an exit\
    \ status. If you do not supply an exit status, which is a number from `0` to `255`,\
    \ then the exit status of the previously executed command will be used as the\
    \ exit status of your script. It's best to control this rather than leave it to\
    \ chance. At least end your script with an `exit 0` line. If your script was able\
    \ to get to the last line of your script, then, in most cases, it has successfully\
    \ completed. Also keep in mind the other places where your shell script may terminate.\
    \ You'll want to use `exit` statements in those places as well. For example, if\
    \ your script performs some sort of check and stops because the check failed,\
    \ you'll want to `exit` with a non-zero exit status.\n\n## Scripts from My Personal\
    \ Collection\n\nIf you would like to see some shell scripts from my personal collection,\
    \ visit: [https://github.com/jasonc/scripts](https://github.com/jasonc/scripts)\n\
    \n## Congratulations and Thank You!\n\nCongratulations for making it through this\
    \ book! As a way of saying thank you for reading this book and making it to the\
    \ end, I would like to give you a huge discount on my shell scripting course.\n\
    \nTo enroll for just $15 -- 85% off the normal price of $99 -- visit: [http://www.linuxtrainingacademy.com/shell-course](http://www.linuxtrainingacademy.com/shell-course)\n\
    \nI look forward to seeing you in the course!\nThanks, Jason\n\n## Other Books\
    \ by the Author\n\n- **Command Line Kung Fu: Bash Scripting Tricks, Linux Shell\
    \ Programming Tips, and Bash One-liners** [http://www.linuxtrainingacademy.com/command-line-kung-fu-book](http://www.linuxtrainingacademy.com/command-line-kung-fu-book)\n\
    - **High Availability for the LAMP Stack: Eliminate Single Points of Failure and\
    \ Increase Uptime for Your Linux, Apache, MySQL, and PHP Based Web Applications**\
    \ [http://www.linuxtrainingacademy.com/ha-lamp-book](http://www.linuxtrainingacademy.com/ha-lamp-book)\n\
    - **Linux for Beginners: An Introduction to the Linux Operating System and Command\
    \ Line** [http://www.linuxtrainingacademy.com/linux](http://www.linuxtrainingacademy.com/linux)\n\
    - **Python Programming for Beginners** [http://www.linuxtrainingacademy.com/python-programming-for-beginners](http://www.linuxtrainingacademy.com/python-programming-for-beginners)\n\
    \n## Additional Resources Including Exclusive Discounts for You\n\nFor even more\
    \ resources, visit: [http://www.linuxtrainingacademy.com/resources](http://www.linuxtrainingacademy.com/resources)\n\
    \n## Books\n\n### Command Line Kung Fu\nDo you think you have to lock yourself\
    \ in a basement reading cryptic man pages for months on end in order to have ninja-like\
    \ command line skills? In reality, if you had someone share their most powerful\
    \ command line tips, tricks, and patterns, you’d save yourself a lot of time and\
    \ frustration. This book does just that.\n\n### High Availability for the LAMP\
    \ Stack\nEliminate Single Points of Failure and Increase Uptime for Your Linux,\
    \ Apache, MySQL, and PHP Based Web Applications\n\n### Linux for Beginners\nIf\
    \ you are interested in learning how to program, or use Python specifically, this\
    \ book is for you. In it, you will learn how to install Python, which version\
    \ to choose, how to prepare your computer for a great experience, and all the\
    \ computer programming basics you’ll need to know to start writing fully functional\
    \ programs.\n\n### Python Programming for Beginners\n\n## Courses\n\n### High\
    \ Availability for the LAMP Stack\nLearn how to setup a highly available LAMP\
    \ stack (Linux, Apache, MySQL, PHP). You'll learn about load balancing, clustering\
    \ databases, creating distributed file systems, and more.\n\n### Learn Linux in\
    \ 5 Days\nTake just 45 minutes a day for the next 5 days and I will teach you\
    \ exactly what you need to know about the Linux operating system. You’ll learn\
    \ the most important concepts and commands, and I’ll even guide you step-by-step\
    \ through several practical and real-world examples.\n\n### Shell Scripting\n\n\
    ### Cloud Hosting and VPS (Virtual Private Servers)\n#### Digital Ocean\nSimple\
    \ cloud hosting, built for developers. Deploy an SSD cloud server in just 55 seconds.\
    \ You can have your own server for as little as $5 a month.\n\n### Web Hosting\
    \ with SSH and Shell Access\n#### Bluehost\n99% of my websites are hosted on Bluehost.\
    \ Why? Because it's incredibly easy to use with 1-click automatic WordPress installation\
    \ and excellent customer service - via phone and via chat. I HIGHLY RECOMMEND\
    \ using Bluehost for your first site. Also, you can use the same hosting account\
    \ for multiple domains if you plan on creating more websites. Visit http://www.linuxtrainingacademy.com/bluehost\
    \ to get a special discount off the regular price!\n\n## Appendix: Trademarks\n\
    \n- BSD/OS is a trademark of Berkeley Software Design, Inc. in the United States\
    \ and other countries.\n- Facebook is a registered trademark of Facebook, Inc.\n\
