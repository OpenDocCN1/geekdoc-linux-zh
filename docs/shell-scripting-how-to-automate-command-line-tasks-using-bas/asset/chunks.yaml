    \ Author](#part0011.xhtml)\n- [Additional Resources Including Exclusive Discounts\
    \ for You](#part0012.xhtml)\n- [Appendix: Trademarks](#part0013.xhtml)\n\n## Other\
    \ Books by the Author\n- Command Line Kung Fu: Bash Scripting Tricks, Linux Shell\
    \ Programming Tips, and Bash One-liners [http://www.linuxtrainingacademy.com/command-line-kung-fu-book](http://www.linuxtrainingacademy.com/command-line-kung-fu-book)\n\
    - High Availability for the LAMP Stack: Eliminate Single Points of Failure and\
    \ Increase Uptime for Your Linux, Apache, MySQL, and PHP Based Web Applications\
    \ [http://www.linuxtrainingacademy.com/ha-lamp-book](http://www.linuxtrainingacademy.com/ha-lamp-book)\n\
    - Linux for Beginners: An Introduction to the Linux Operating System and Command\
    \ Line [http://www.linuxtrainingacademy.com/linux](http://www.linuxtrainingacademy.com/linux)\n\
    - Python Programming for Beginners [http://www.linuxtrainingacademy.com/python-programming-for-beginners](http://www.linuxtrainingacademy.com/python-programming-for-beginners)\n\
    \n## Introduction\nI'm lazy. I admit it. I believe so strongly in being lazy that\
    \ I'll do almost anything to facilitate even more laziness in the future. For\
    \ example, if I think there is a slight chance that I will ever have to perform\
    \ the same set of commands again, I create a shell script then and there. When\
    \ I need to do that task again, I lazily execute my script. If maintenance needs\
    \ to be performed on a system at 2:00 in the morning, I write a script that does\
    \ the required work and schedule a job to run it. Lazy people love to sleep.\n\
    \nI also believe in helping people find their inner laziness. Why? Because lazy\
    \ people solve problems. They eliminate the unnecessary. They simplify the complex.\
    \ That's the reason I've written this book. I want to share with you some of my\
    \ favorite tips and tricks I've used to automate repetitive, monotonous, tedious,\
    \ and complex tasks. May they inspire you to be lazy.\n\nBefore we get started\
    \ I recommend that you download the shell scripts used in this book by visiting:\
    \ [http://www.linuxtrainingacademy.com/shell-scripts](http://www.linuxtrainingacademy.com/shell-scripts)\n\
    \n## Shell Scripting, Succinctly\nA script is a command line program that contains\
    \ a series of commands. The commands in the script are executed by an interpreter.\
    \ In the case of shell scripts, the shell acts as the interpreter and executes\
    \ the commands in the script one after the other. Anything you can execute at\
    \ the command line, you can put into a shell script. Shell scripts are great at\
    \ automating tasks. If you find yourself running a series of commands to accomplish\
    \ a given task and will need to perform that task in the future, you can—and probably\
    \ should—create a shell script for that.\n\nLet's look at a simple shell script.\
    \ The name of this script is `script.sh`.\n```\n#!/bin/bash\necho \"Scripting\
    \ is fun!\"\n```\nBefore you try to execute the script, make sure it is executable.\n\
    ```\nchmod 755 script.sh\n./script.sh\nScripting is fun!\n```\n\n### Shebang\n\
    You'll notice that the first line of the script starts with `#!` followed by the\
    \ path to the `bash` shell, `/bin/bash`. The `#!` sign is very similar to the\
    \ sharp sign used in music. Also, some people refer to the exclamation mark as\
    \ a \"bang.\" So, `#!` can be spoken as \"sharp bang.\" The term \"Shebang\" is\
    \ an inexact of \"sharp bang.\" When a script's first line starts with a shebang,\
    \ what follows is used as the interpreter for the commands in the script. Here\
    \ are three examples of shell scripts, each using a different shell program as\
    \ the interpreter.\n```\n#!/bin/csh\necho \"This script uses csh as the interpreter.\"\
    \n```\n```\n#!/bin/ksh\necho \"This script uses ksh as the interpreter.\"\n```\n\
    ```\n#!/bin/zsh\necho \"This script uses zsh as the interpreter.\"\n```\nWhen\
    \ you execute a script that contains a shebang, what actually happens is that\
    \ the interpreter is executed and the path used to call the script is passed as\
    \ an argument to the interpreter. You can prove this by examining the process\
    \ table. Let's start this script, `sleepy.sh`, in the background and look at the\
    \ process table.\n```\n./sleepy.sh &[1] 16796\nps -fp 16796\nUID          PID\
    \ PPID C STIME TTY CMD\njason 16796 1725 0 22:50 pts/0 /bin/bash ./sleepy.sh\n\
    ```\nYou can see that what is actually running is `/bin/bash ./sleepy.sh`. Let's\
    \ use a full path to the script.\n```\n/tmp/sleepy.sh &[1] 16804\nps -fp 16804\n\
    UID          PID PPID C STIME TTY CMD\njason 16804 1725 0 22:51 pts/0 /bin/bash\
    \ /tmp/sleepy.sh\n```\nSure enough, `/bin/bash /tmp/sleepy.sh` is being executed.\
    \ Also, you can see that `/bin/bash` is executing the `sleep` command, which is\
    \ the first and only command in the shell script.\n```\nps -ef| grep 16804 | grep\
    \ -v grep\njason 16804 1725 0 22:51 pts/0 /bin/bash /tmp/sleepy.sh\njason 16805\
    \ 16804 0 22:51 pts/0 sleep 90\npstree –p 16804\nsleepy.sh(16804)───sleep(16805)\n\
    ```\nIf you do not supply a shebang and specify an interpreter on the first line\
    \ of the script, the commands in the script will be executed using your current\
    \ shell. Even though this can work just fine under many circumstances, it's best\
    \ to be explicit and specify the exact interpreter to be used with the script.\
    \ For example, there are features and syntax that work just fine with the `bash`\
    \ shell that will not work with the `csh` shell.\n\nAlso, you don't have to use\
    \ a shell as the interpreter for your scripts. Here is an example of a Python\
    \ script named `hi.py`.\n```\n#!/usr/bin/python\nprint \"This is a Python script.\"\
    \n```\nLet's make it executable and run it.\n```\nchmod 755 hi.py\n./hi.py\nThis\
    \ is a Python script.\n```\nFor more information on python programming and scripting,\
    \ see my book `Python Programming for Beginners` .\n\n## Variables\nYou can use\
    \ variables in your shell scripts. Variables are simply storage locations that\
    \ have a name. To assign a value to a variable, use `VARIABLE_NAME=\"Value\"`.\
    \ Do not use spaces before or after the equals sign. Also, variables are case\
    \ sensitive, and by convention, variable names are in uppercase.\n```\n#!/bin/bash\n\
    MY_SHELL=\"bash\"\n```\nTo use a variable, precede the variable name with a dollar\
    \ sign.\n```\n#!/bin/bash\nMY_SHELL=\"bash\"\necho \"I like $MY_SHELL shell.\"\
    \n```\nYou can also enclose the variable name in curly braces and precede the\
    \ opening brace with a dollar sign. Syntax: `${VARIABLE_NAME}`.\n```\n#!/bin/bash\n\
    MY_SHELL=\"bash\"\necho \"I like ${MY_SHELL} shell.\"\n```\nThe curly brace syntax\
    \ is optional unless you need to immediately precede or follow the variable with\
    \ additional data.\n```\n#!/bin/bash\nMY_SHELL=\"bash\"\necho \"I am ${MY_SHELL}ing\
    \ on my keyboard.\"\n```\nIf you do not encapsulate the variable name in curly\
    \ braces the shell will treat the additional text as part of the variable name.\
    \ Since a variable with that name does not exist, nothing is put in its place.\n\
    ```\n#!/bin/bash\nMY_SHELL=\"bash\"\necho \"I am $MY_SHELL on my keyboard.\"\n\
    ```\nYou can also assign the output of a command to a variable. To do this, enclose\
    \ the command in parentheses and precede it with a dollar sign.\n```\n#!/bin/bash\n\
    SERVER_NAME=$(hostname)\necho \"You are running this script on ${SERVER_NAME}.\"\
    \n```\nThe output of the command `hostname` is stored in the variable `SERVER_NAME`.\
    \ In this sample, the server name is `svr`. You are running this script on `svr`.\
    \ You can also enclose the command in back ticks. This is an older syntax being\
    \ replaced by `$()`. However, you may see this in older scripts.\n```\n#!/bin/bash\n\
    SERVER_NAME=`hostname`\necho \"You are running this script on ${SERVER_NAME}.\"\
    \n```\n\n### Valid Variable Names\nVariable names can contain letters, digits,\
    \ and underscores. They can start with letters or underscores, but cannot start\
    \ with a digit. Here are examples of valid variable names.\n```\nFIRSTLETTERS=\"\
    ABC\"\nFIRST_THREE_LETTERS=\"ABC\"\n```\nHere are some examples of invalid variable\
    \ names.\n```\n3=\"ABC\"\nfirst-three-letters=\"ABC\"\nThree@Letters=\"ABC\"\n\
    ```\n\n### Tests\nScripts are designed to replace the need for a person to physically\
    \ be at keyboard and type in a series of commands. What if you have a task you\
    \ want to automate, but requires different actions based on different circumstances?\
    \ Since a person may not be around to make decisions when the script needs to\
    \ run, we'll need to test for conditions and have the script act accordingly.\
    \ To create a test, place a conditional expression between brackets. The syntax\
    \ is `[ condition-to-test ]`. You can test for several types of situations. For\
    \ example, you can compare if strings are equal, if a number is greater than another,\
    \ or if a file exists. This test checks to see if `/etc/passwd` exists. If it\
    \ does, it returns true. i.e., the command exits with a status of 0. If the file\
    \ doesn't exist it returns false. i.e., the command exits with a status of 1.\n\
    ```\n[ -e /etc/passwd ]\n```\nIf you are using the `bash` shell, you can run the\
    \ command `help test` to see the various types of tests you can perform. You can\
    \ also read the man page for test: `man test`. Here are some of the more common\
    \ tests you can perform. File operators:\n- `-d FILE`: if file is a directory.\n\
    - `-e FILE`: if file exists.\n- `-f FILE`: if file exists and is a regular file.\n\
    - `-r FILE`: if file is readable by you.\n- `-s FILE`: if file exists and is not\
    \ empty.\n- `-w FILE`: if file is writable by you.\n- `-x FILE`: if file is executable\
    \ by you.\nString operators:\n- `-z STRING`: if string is empty.\n- `-n STRING`:\
    \ if string is not empty.\n- `STRING`: if string is not empty.\n- `STRING1 = STRING2`:\
    \ if the strings are equal.\n- `STRING1 != STRING2`: if the strings are not equal.\n\
    Arithmetic operators:\n- `arg1 eq arg2`: if arg1 is equal to arg2.\n- `arg1 ne\
    \ arg2`: if arg1 is not equal to arg2.\n- `arg1 lt arg2`: if arg1 is less than\
    \ arg2.\n- `arg1 le arg2`: if arg1 is less or equal to arg2.\n- `arg1 gt arg2`:\
    \ if arg1 is greater than arg2.\n- `arg1 ge arg2`: if arg1 is greater or equal\
    \ to arg2.\n\n## if Statement\nNow that you know how to determine if a certain\
    \ condition is true or not, you can combine that with the `if` statement to make\
    \ decisions in your scripts. The `if` statement starts with the word `if` and\
    \ is followed by a test. The following line contains the word `then`. Next comes\
    \ a series of commands that will be executed if the tested condition is true.\
    \ Finally, the if statement ends with `fi`, which is `if` spelled backwards. Here\
    \ is the syntax.\n```\nif [ condition-true ]\nthen\n  command 1\n  command 2\n\
    fi\n```\nHere is an example:\n```\n#!/bin/bash\nMY_SHELL=\"bash\"\nif [ \"$MY_SHELL\"\
    \ = \"bash\" ]\nthen\n  echo \"You seem to like the shell.\"\nfi\n```\nIt is a\
    \ best practice to enclose variables in quotes to prevent some side effects when\
    \ performing conditional tests. You can also perform an action if the condition\
    \ is not true by using an `if/else` statement. Here is what an `if/else` statement\
    \ looks like.\n```\nif [ condition-true ]\nthen\n  command 1\n  command 2\nelse\n\
    \  command 3\n  command 4\nfi\n```\nLet's update the script to perform an action\
    \ if the statement is not true.\n```\n#!/bin/bash\nMY_SHELL=\"csh\"\nif [ \"$MY_SHELL\"\
    \ = \"bash\" ]\nthen\n  echo \"You seem to like the shell.\"\nelse\n  echo \"\
    You don't seem to like the shell.\"\nfi\n```\nBecause `[ \"$MY_SHELL\" = \"bash\"\
    \ ]` evaluated to false, the statements following `else` were executed.\nYou can\
    \ also test for multiple conditions using an `elif`. The word `elif` is a contraction\
    \ for \"else if.\" Like if, follow `elif` with a condition to test for. On the\
    \ following line, use the word `then`. Finally, provide a series of commands to\
    \ execute if the condition evaluates as true.\n```\nif [ condition-true ]\nthen\n\
    \  command 1\n  command 2\nelif [ condition-true ]\nthen\n  command 3\n  command\
    \ 4\nelse\n  command 5\n  command 6\nfi\n```\nHere is an updated script using\
    \ `elif`.\n```\n#!/bin/bash\nMY_SHELL=\"csh\"\nif [ \"$MY_SHELL\" = \"bash\" ]\n\
    then\n  echo \"You seem to like the bash shell.\"\nelif [ \"$MY_SHELL\" = \"ksh\"\
    \ ]\nthen\n  echo \"You seem to like the csh shell.\"\nelse\n  echo \"You don't\
    \ seem to like the bash or csh shells.\"\nfi\n```\nOutput: You seem to like the\
    \ csh shell.\n\n## The for Loop\nIf you want to perform an action on a list of\
    \ items, use a `for` loop. The first line of a `for` loop start with the word\
    \ `for` followed by a variable name, followed by the word `in` and then a list\
    \ of items. The next line contains the word `do`. Place the statements you want\
    \ to execute on the following lines and, finally, end the for loop with the word\
    \ `done` on a single line.\n```\nfor VARIABLE_NAME in ITEM_1 ITEM_2 ITEM_N\ndo\n\
    \  command 1\n  command 2\ndone\n```\nEssentially what happens is that the first\
    \ item in the list is assigned to the variable and the code block is executed.\
    \ The next item in the list is then assigned to the variable and the commands\
    \ are executed. This happens for each item in the list. Here is a simple script\
    \ that shows how a for loop works.\n```\n#!/bin/bash\nfor COLOR in red green blue\n\
    do\n  echo \"COLOR: $COLOR\"\ndone\n```\nOutput: COLOR: red\nCOLOR: green\nCOLOR:\
    \ blue\nIt's a common practice for the list of items to be stored in a variable\
    \ as in this example.\n```\n#!/bin/bash\nCOLORS=\"red green blue\"\nfor COLOR\
    \ in $COLORS\ndo\n  echo \"COLOR: $COLOR\"\ndone\n```\nOutput: COLOR: red\nCOLOR:\
    \ green\nCOLOR: blue\nThis shell script, `rename-pics.sh`, renames all of the\
    \ files that end in `jpg` by prepending today’s date to the original file name.\n\
    ```\n#!/bin/bash\nPICTURES=$(ls *jpg)\nDATE=$(date +%F)\nfor PICTURE in $PICTURES\n\
    do\n  echo \"Renaming ${PICTURE} to ${DATE}-${PICTURE}\"\n  mv ${PICTURE} ${DATE}-${PICTURE}\n\
    done\n```\nHere's what happens when you run this script.\n```\nls bear.jpg\nman.jpg\n\
    pig.jpg\nrename-pics.sh\n./rename-pics.sh\n```\nRenaming bear.jpg to 2015-03-06-bear.jpg\n\
    Renaming man.jpg to 2015-03-06-man.jpg\nRenaming pig.jpg to 2015-03-06-pig.jpg\n\
    ls\n2015-03-06-bear.jpg\n2015-03-06-man.jpg\n2015-03-06-pig.jpg\n```\n\n## Positional\
    \ Parameters\nPositional parameters are variables that contain the contents of\
    \ the command line. These variables are `$0` through `$9`. The script itself is\
    \ stored in `$0`, the first parameter in `$1`, the second in `$2`, and so on.\
    \ Take this command line as an example.\n```\nscript.sh parameter1 parameter2\
    \ parameter3\n```\nThe contents are as follows: `$0` is `script.sh`, `$1` is `parameter1`,\
    \ `$2` is `parameter2`, and `$3` is `parameter3`. This script, `archive_user.sh`,\
    \ accepts a parameter which is a username.\n```\n#!/bin/bash\necho \"Executing\
    \ script: $0\"\necho \"Archiving user: $1\"\n# Lock the account\npasswd -l $1\n\
    # Create an archive of the home directory\ntar cf /archives/${1}.tar.gz /home/${1}\n\
    ```\nAnything that follows the pound sign is a comment. The only exception to\
    \ this is the shebang on the first line. Everywhere else in the script where a\
    \ pound sign is encountered marks the beginning of a comment. Comments are dutifully\
    \ ignored by the interpreter for the benefit of us. Anything that follows the\
    \ pound sign is ignored. If a pound sign starts at the beginning of a line, the\
    \ entire line is ignored. If a pound sign is encountered in the middle of a line,\
    \ only the information to the right of the pound sign is ignored. Here is what\
    \ the output looks when we execute `archive_user.sh`.\n```\n./archive_user.sh\
    \ elvis\nExecuting script: ./archive_user.sh\nArchiving user: elvis\npasswd locking\
    \ elvis...\ntar creating '/archives/elvis.tar.gz'\n- 1 entry in /home/elvis\n\
    ```\nInstead of referring to `$1` throughout the script, let's assign its value\
    \ to a more meaningful variable name.\n```\n#!/bin/bash\nUSER=$1\n# The first\
    \ parameter is the user.\necho \"Executing script: $0\"\necho \"Archiving user:\
    \ $USER\"\n# Lock the account\npasswd -l $USER\n# Create an archive of the home\
    \ directory\ntar cf /archives/${USER}.tar.gz /home/${USER}\n```\nThe output remains\
    \ the same.\n```\n./archive_user.sh elvis\nExecuting script: ./archive_user.sh\n\
    Archiving user: elvis\npasswd locking elvis...\ntar creating '/archives/elvis.tar.gz'\n\
    - 1 entry in /home/elvis\n```\nYou can access all the positional parameters starting\
    \ at `$1` to the very last on the command line by using the special variable `$`.\
    \ Here is how to update the `archive_user.sh` script to accept one or more parameters.\n\
    ```\n#!/bin/bash\necho \"Executing script: $0\"\nfor USER in $@\ndo\n  echo \"\
    Archiving user: $USER\"\n  # Lock the account\n  passwd -l $USER\n  # Create an\
    \ archive of the home directory\n  tar cf /archives/${USER}.tar.gz /home/${USER}\n\
    done\n```\nLet's pass in multiple users to the script.\n```\n./archive_user.sh\
    \ chet joe\n```\nExecuting script: ./archive_user.sh\nArchiving user: chet\npasswd\
    \ locking chet...\ntar creating '/archives/chet.tar.gz'\n- 1 entry in /home/chet\n\
    Archiving user: joe\npasswd locking joe...\ntar creating '/archives/joe.tar.gz'\n\
    - 1 entry in /home/joe\n```\nWait, I missed something in the text: \"Archiving\
    \ user: joe\".\n\n## Getting User Input\nIf you want to accept standard input,\
    \ use the `read` command. Remember that standard input typically comes from a\
    \ person typing at the keyboard, but it can also come from other sources, like\
    \ the output of a command in a command pipeline. The format for the `read` command\
    \ is `read -p \"PROMPT\" VARIABLE_NAME`. This version of the `archive_user.sh`\
    \ script asks for the user account.\n```\n#!/bin/bash\nread -p \"Enter a user\
    \ name: \" USER\necho \"Archiving user: $USER\"\n# Lock the account\npasswd -l\
    \ $USER\n# Create an archive of the home directory\ntar cf /archives/${USER}.tar.gz\
    \ /home/${USER}\n```\nLet's run this script and archive the `mitch` account.\n\
    ```\n./archive_user.sh\nEnter a user name: mitch\nArchiving user: mitch\npasswd\
    \ locking mitch...\ntar creating '/archives/mitch.tar.gz'\n- 1 entry in /home/mitch\n\
    ```\n\n## Review\nThe first line in a shell script should start with a shebang\
    \ and the path to the interpreter that should be used to execute the script. To\
    \ assign a value to a variable, start with the variable name followed by an equals\
    \ sign followed by the value. Do not use a space before or after the equals sign.\
    \ You can access the value stored in a variable by using `$VARIABLE_NAME` or `${VARIABLE_NAME}`.\
    \ The latter form is required if you want to precede or follow the variable with\
    \ additional data. To assign the output of a command to a variable, enclose the\
    \ command in parentheses and precede it with a dollar sign. `VARIABLE_NAME=$(command)`\
    \ Perform tests by placing an expression in brackets. Tests are typically combined\
    \ with `if` statements. Use `if`, `if/else`, or `if/elif/else` statements to make\
    \ decisions in your scripts. To perform an action or series of action on multiple\
    \ items, use a `for` loop. To access items on the command line, use positions\
    \ parameters. The name of the program is represented by `$0`, the first parameter\
    \ is represented by `$1`, and so on. To access all the items on the command line\
    \ starting at the first parameter (`$1`), use the special variable `$@`. You can\
    \ place comments in your scripts by using the pound sign. Accept user input by\
    \ the `read` command.\n\n## Practice Exercises\nExercise 1: Write a shell script\
    \ that renames all files in the current directory that end in `.jpg` to begin\
    \ with today's date in the following format: `YYYY-MM-DD`. For example, if a picture\
    \ of my cat was in the current directory and today was October 31, 2016 it would\
    \ change name from \"mycat.jpg\" to \"2016-10-31-mycat.jpg\". Hint: Look at the\
    \ format options for the `date` command. For \"extra credit\", make sure to gracefully\
    \ handle instances where there are no `.jpg` files in the current directory. (Hint:\
    \ `man bash` and read the section on the `nullglob` option.)\nExercise 2: Write\
    \ a script that renames files based on the file extension. The script should prompt\
    \ the user for a file extension. Next, it should ask the user what prefix to prepend\
    \ to the name(s). By default, the prefix should be the current date in `YYYY-MM-DD`\
    \ format. If the user simply presses enter, the current date will be used. Otherwise,\
    \ whatever the user entered will be used as the prefix. Next, it should display\
    \ the original file name and the new name. Finally, it should rename the file.\n\
    \n## Solutions to the Practice Exercises\nExercise 1:\n```\n#!/bin/bash\n# Optional:\
    \ Uncomment the following line to avoid an error when no jpg files are found.\n\
    # shopt -s nullglob\n# YYYY-MM-DD\nDATE=$(date +%F)\nfor FILE in *.jpg\ndo\n \
    \ mv $FILE $DATE-$FILE\ndone\n```\nExercise 2:\n```bash\n#!/bin/bash\nDATE=$(date\
    \ +%F)\nread -p \"Enter a file extension: \" EXTENSION\nread -p \"Enter a file\
    \ prefix: \" PREFIX\nif [ -z \"$PREFIX\" ]; then\n  PREFIX=\"$DATE\"\nfi\nfor\
    \ FILE in *.*;\ndo\n  NEW_FILE=\"${PREFIX}-${FILE##*}.${EXTENSION}\"\n  # Wait,\
    \ the logic is slightly off in the example text\n  echo \"Renaming $FILE to $NEW_FILE\"\
    \n  mv $FILE \"$NEW_FILE\"\ndone\n```\n\n# Exit Statuses and Return Codes\nIn\
    \ this chapter, you will learn how to determine the exit status of a given command.\
    \ You'll learn how to make decisions in your scripts based on the exit statuses\
    \ of various commands. Finally, you'll learn how to use exit statuses in your\
    \ own scripts. Every time a command is executed it returns an exit status. The\
    \ exit status, which is sometimes called a return code or exit code, is an integer\
    \ ranging from 0 to 255. By convention, commands that execute successfully return\
    \ a 0 exit status. If some sort of error is encountered, then a non-zero exit\
    \ status is returned. These return codes can be used in your script for error\
    \ checking. It can be a simple test, like checking for a zero return code, or\
    \ it could be more complex, like checking for a specific error code. If you want\
    \ to find out what the various exit statuses mean, you have to consult the documentation\
    \ for the given command or look at its source code. You can use the `man` and\
    \ `info` commands to read the documentation for most commands on your system.\
    \ For example, in the `grep` man page, it explains `grep` will exit with a status\
    \ of 0 if the search pattern is found and 1 if it is not. The special variable\
    \ `$?` contains the return code of the previously executed command. In this shell\
    \ script snippet, the `ls` command is called with a path to a file that doesn't\
    \ exist.\n```\nls /not/here\necho \"$?\"\nOutput:ls: /not/here: No such file or\
    \ directory2\n```\nImmediately after the `ls` command is executed, the return\
    \ code of that command is displayed on the screen using `echo $?`. This will display\
    \ a 2 on the screen. Remember that non-zero exit codes indicate some sort of error.\
    \ Had the file `/not/here` existed and if `ls` was able to display information\
    \ about that file, the exit status would have been 0. You can use the exit status\
    \ of a command to make a decision or perform a different action. In this example\
    \ script snippet, we use the `ping` command to test our connectivity to `www.google.com`.\n\
    ```\nHOST=\"google.com\"\nping -c 1 $HOST\nif [ \"$?\" -eq \"0\" ]\nthen\n  echo\
    \ \"HOST reachable.\"\nelse\n  echo \"HOST unreachable.\"\nfi\n```\nAfter the\
    \ `ping` command is executed, we check the exit status. If the exit status is\
    \ equal to 0, then we echo to the screen that `google.com` is reachable. If the\
    \ exit status is NOT equal to 0, we echo to the screen that `google.com` is unreachable.\
    \ This example just checks for an error condition. In the `if` statement, we look\
    \ for a non-zero status. If `$?` does not equal zero, then we echo the host is\
    \ unreachable. We can assign the return code of a command to variable and then\
    \ use that later in the script.\n```bash\nHOST=\"google.com\"\nping -c 1 $HOST\n\
    RETURN_CODE=$?\nif [ \"$RETURN_CODE\" -ne \"0\" ]\nthen\n  echo \"HOST unreachable.\"\
    \nfi\n```\nIn addition to using `if` statements with exit statuses, you can use\
    \ logical ANDs and ORs. The double ampersand `&&` represents AND, while the double\
    \ pipe `||` represents OR. You can chain together multiple commands with either\
    \ AND or OR. The command following a double ampersand will only execute if the\
    \ previous command succeeds. In the following example, `mkdir /tmp/bak` is executed.\
    \ If it succeeds and returns a 0 exit status, and only then, the `cp` command\
    \ be executed.\n```\nmkdir /tmp/bak && cp test.txt /tmp/bak\n```\nThe command\
    \ following a double pipe will only execute if the previous command fails. If\
    \ the first command returns a non-zero exit status, then the next command is executed.\
    \ In the following example, the first `cp` command, `test.txt /tmp/bak/`, is executed.\
    \ If it succeeds the next `cp` command is NOT executed.\n```\ncp test.txt /tmp/bak\
    \ || cp test.txt\n```\n\n## The exit Command\nNot only do normal commands return\
    \ an exit status, but shell scripts do as well. You can control the exit status\
    \ of your shell script using the `exit` command. Simply use the `exit` command\
    \ in your script and follow it with a number from 0 to 255. If you do not specify\
    \ a return code with the `exit` command, then the exit status of the previously\
    \ executed command is used as the exit status. This is also true if you do not\
    \ include the `exit` command at all in your shell script. Again, in that case,\
    \ the last command that was executed in your shell script will determine the return\
    \ code for your entire shell script. Also note that you can use the `exit` command\
    \ anywhere in your shell script. Whenever the `exit` command is reached, your\
    \ shell script will stop running. In this example, we are controlling the exit\
    \ status of our script with the `exit` command.\n```\n#!/bin/bash\nHOST=\"google.com\"\
    \nping -c 1 $HOST\nif [ \"$?\" -ne \"0\" ]\nthen\n  echo \"HOST unreachable.\"\
    \n  exit 1\nfi\nexit 0\n```\nIf the `ping` command succeeds, a return code of\
    \ 0 is received. This means that the test in the `if` statement is false and that\
    \ code block will not execute. The `exit 0` line is executed. This stops the execution\
    \ of the script and returns a 0 status. If the `ping` command fails, then a non-zero\
    \ exit status is received. This makes the `if` statement true, and the `echo`\
    \ command and `exit 1` are executed. The `exit 1` command will stop the execution\
    \ of the script and return a status of 1.\n\n## Review\nIn this chapter, you learned\
    \ that all commands return an exit status. Valid exit statuses are numbers that\
    \ range from 0 to 255, with 0 representing the successful execution of a command\
    \ and non-zero representing an error. You learned about the special variable `$?`\
    \ and how it contains the value of the previously executed command. You made decisions\
    \ using `if` statements, ANDs, and ORs. Finally, you learned how to control exit\
    \ statuses of your own scripts using the `exit` command.\n\n## Practice Exercises\n\
    Exercise 1: Write a shell script that displays, \"This script will exit with a\
    \ 0 status.\" Be sure that the script indeed exit with a 0 status.\nExercise 2:\
    \ Write a shell script that accepts a file or directory name as an argument. Have\
    \ the script report if it is a regular file, a directory, or another type of file.\
    \ If it is a regular file, exit with a 0 status. If it is a directory, exit with\
    \ a 1 status. If it is some other type of file, exit with a 2 status.\nExercise\
    \ 3: Write a script that executes the command `cat /etc/shadow`. If the command\
    \ returns a 0 status, report \"Command succeeded\" and exit with a 0 status. If\
    \ the command returns a non-zero status, report \"Command failed\" and exit with\
    \ a 1 status.\n\n## Solutions to the Practice Exercises\nExercise 1:\n```bash\n\
    #!/bin/bash\necho \"This script will exit with a 0 status.\"\nexit 0\n```\nExercise\
    \ 2:\n```bash\n#!/bin/bash\necho \"This script will exit with a 0 status.\"\n\
    exit 0\n```\nExercise 3:\n```bash\n#!/bin/bash\ncat /etc/shadow\nif [ \"$?\" -eq\
    \ \"0\" ]\nthen\n  echo \"Command succeeded\"\n  exit 0\nelse\n  echo \"Command\
    \ failed\"\n  exit 1\nfi\n```\n\n# Functions\nIn this chapter, you'll learn why\
    \ and when you'll want to use functions. You'll learn how to create functions\
    \ as well as how to use them. We'll talk about variables and their scope. You'll\
    \ learn how to use parameters to access the arguments passed to your function.\
    \ Finally, you'll learn how to handle exit statuses and return codes with functions.\
    \ There is a concept in computer programming and application development known\
    \ as DRY. DRY stands for Don't Repeat Yourself. Functions allow you to write a\
    \ block of code once and use it many times. Instead of repeating several lines\
    \ of code each time you need to perform a particular task—or function—simply call\
    \ the function that contains that code. This helps in reducing the length of your\
    \ scripts and also gives you a single place to change, test, and document a given\
    \ task. Whenever you need to perform the same action multiple times in a script,\
    \ that's a sign that you should probably write a function for that action. A function\
    \ is simply a block of reusable code that performs an action and returns an exit\
    \ status or return code. A function must be defined before it is called. When\
    \ you call a function, you can pass data into the function. You can access that\
    \ data within your function as parameters.\n\n### Creating a Function\nThere are\
    \ two ways to create a function. The first way is to explicitly use the keyword\
    \ `function`, then follow it by the function's name, and then a set of parenthesis.\
    \ Next you'll use an opening curly brace. The code or commands that follow will\
    \ be executed when the function is called. To end your function, use a closing\
    \ curly brace.\n```\nfunction function-name() {\n  # Code goes here.\n}\n```\n\
    The second way to declare a function is exactly like the first except that you\
    \ do not use the keyword `function` in your declaration. Everything else stays\
    \ the same.\n```\nfunction-name() {\n  # Code goes here.\n}\n```\n\n### Calling\
    \ a Function\nTo call the function, simply list its name on a line in the script.\
    \ When calling the function, do not use parentheses. You may have seen this syntax\
    \ and style in other programming languages, but it doesn't work in shell scripts.\
    \ Simply place the name of a function on a line and it will execute that function.\
    \ When you run this script, the word \"Hello!\" is displayed on the screen.\n\
    ```\n#!/bin/bash\nfunction hello() {\n  echo \"Hello!\"\n}\nhello\n```\nBe aware\
    \ that functions can call other functions. In this script, the `hello` function\
    \ is declared. Next, the `now` function is declared. Finally, the `hello` function\
    \ is called. When the `hello` function is called, it prints \"Hello!\" on the\
    \ screen and calls the `now` function.\n```bash\n#!/bin/bash\nfunction hello()\
    \ {\n  echo \"Hello!\"\n  now\n}\nfunction now() {\n  echo \"It's $(date +%r)\"\
    \n}\nhello\n```\nYou might have caught that the `now` function was defined after\
    \ the `hello` function. I said that functions had to be declared before they are\
    \ used and in this example, that is exactly what happened. In the order of execution,\
    \ it is defined before it is used. Do not do this:\n```bash\n#!/bin/bash\nfunction\
    \ hello() {\n  echo \"Hello!\"\n  now\n}\nfunction now() {\n  echo \"It's $(date\
    \ +%r)\"\n}\n```\nWait, the example above is the same as the first one. Let me\
    \ provide the bad example.\n```bash\n#!/bin/bash\nfunction hello() {\n  echo \"\
    Hello!\"\n  now\n}\nfunction now() {\n  echo \"It's $(date +%r)\"\n}\n```\nActually,\
    \ the text says \"Do not do this\" but then shows the correct code. Let's re-read.\
    \ \"Do not do this: [followed by correct code]\". This is likely a typo in the\
    \ source text. The point is to define the function before you call it.\n\nThe\
    \ main point of scripting is that they are not pre-compiled. In some languages,\
    \ you can define a function anywhere and the compiler will examine all source\
    \ code. In a script, the commands and components are read from the top to the\
    \ bottom at runtime. Note that it's a best practice to place all of your functions\
    \ at the top of your script. This ensures they are all defined before are used.\n\
    \n### Positional Parameters\nLike shell scripts, functions can accept parameters.\
    \ Also like shell scripts, you can access the values of these passed parameters\
    \ using `$1`, `$2`, and so on. You can even access all the parameters passed into\
    \ the function using `$@`. The only difference is that `$0` is still the name\
    \ of the script. You can't access the name of the function using `$0`, but the\
    \ good news is that you'll never want to anyway. To send data to a function, supply\
    \ the data after the function name. In this example, the `hello` function is called\
    \ with one parameter, `Jason`. This means the contents of `$1` inside the function\
    \ are \"Jason\".\n```bash\n#!/bin/bash\nfunction hello() {\n  echo \"Hello $1\"\
    \n}\nhello Jason\n```\nOutput: Hello Jason\nThis script will loop through each\
    \ of the parameters passed to the function and echo \"Hello\" followed by the\
    \ parameter. This output of this script would be three lines. The first line would\
    \ be \"Hello Jason\", the second line would be \"Hello Dan\", and the third line\
    \ be \"Hello Ryan\".\n```bash\n#!/bin/bash\nfunction hello() {\n  for NAME in\
    \ $@\n  do\n    echo \"Hello $NAME\"\n  done\n}\nhello Jason Dan Ryan\n```\nOutput:\
    \ Hello Jason\nHello Dan\nHello Ryan\n\n### Variable Scope\nBy default, all variables\
    \ are global. This means that the variable and its value can be accessed anywhere\
    \ in the script, including in any function. The only small catch is that the variable\
    \ has to be defined before it can be used. You can't assign a value to a variable\
    \ at the very end of your script and access that value via the variable at the\
    \ very top. If you attempt that, the contents of that variable will be blank as\
    \ it hasn't been given a value yet. This is true for functions as well. If a function\
    \ uses a global variable, that variable has to be defined before the function\
    \ is called. If we look at this snippet of a shell script, you'll see that the\
    \ variable, `GLOBAL_VAR`, is defined before the function is called. In this case,\
    \ the value of `GLOBAL_VAR` can be accessed in the function.\n```bash\nGLOBAL_VAR=1\n\
    # GLOBAL_VAR is available\n# in the function.\nmy_function\n```\nHere is an example\
    \ of the opposite. Since the variable, `GLOBAL_VAR`, is defined after the function\
    \ is called, it is not available in the function.\n```bash\n# GLOBAL_VAR is NOT\
    \ available\n# in the function.\nmy_function\nGLOBAL_VAR=1\n```\nIf a global variable\
    \ is defined in a function, it is not available outside that function until the\
    \ function is called and executed. At the top of the next script, the `my_function`\
    \ function is declared. It hasn't been executed yet. If we attempt to use the\
    \ variable defined within the function without calling it first, the value of\
    \ the variable will be empty. In this example, the first echo statement will simply\
    \ print a blank line. Next, the `my_function` function is called. Now a value\
    \ has been assigned to the variable named `GLOBAL_VAR`. On the echo statement\
    \ after the function call, it will print \"1\" because that is the value now assigned\
    \ to `GLOBAL_VAR`.\n```bash\n#!/bin/bash\nmy_function() {\n  GLOBAL_VAR=1\n}\n\
    # GLOBAL_VAR not available yet.\necho $GLOBAL_VAR\nmy_function\n# GLOBAL_VAR is\
    \ NOW available.\necho $GLOBAL_VAR\n```\n\n### Local Variables\nA local variable\
    \ is a variable that can only be accessed within the function in which it is declared.\
    \ Use the `local` keyword before the variable name. Only use the `local` keyword\
    \ the first time the local variable is used. Note that the `local` keyword can\
    \ only be used inside a function. It's a best practice to use local variables\
    \ inside your functions. However, you'll find plenty of shell scripts that do\
    \ not adhere to this recommendation.\n\n### Exit Statuses and Return Codes\nFunctions\
    \ are really like shell scripts within a shell script. Just like a shell script,\
    \ a function has an exit status, sometimes called a return code. This exit status\
    \ can be explicitly set by the `return` statement and following it with the status\
    \ you would like to return. If no `return` statement is used, the exit status\
    \ of the function is the status of the last command executed in the function.\n\
    \nWait, \"The exit status, which is sometimes called a return code or exit code,\
    \ is an integer ranging from 0 to 255. By convention, commands that execute successfully\
    \ return a 0 exit status. If some sort of error is encountered, then a non-zero\
    \ exit status is returned. These return codes can be used in your script for error\
    \ checking. It can be a simple test, like checking for a zero return code, or\
    \ it could be more complex, like checking for a specific error code.\" (Wait,\
    \ the text provided actually says: \"The exit status... is an integer ranging\
    \ from 0 to 255. By convention, commands that execute successfully return a 0\
    \ exit status. If some sort of error is encountered, then a non-zero exit status\
    \ is returned.\")\n\nThis exit status can be explicitly set by the `return` statement\
    \ and following it with the status you would like to return. If no `return` statement\
    \ is used, the exit status of the function is the status of the last command executed\
    \ in the function.\n\nTo access the exit status of a function, use `$?` immediately\
    \ after the function is called.\n```bash\nbackup_file () {\n  if [ -f \"$1\" ]\n\
    \  then\n    local BACKUP_FILE=\"/var/tmp/$(basename ${1}).$(date +%F).\"\n  \
    \  echo \"Backing up $1 to ${BACKUP_FILE}\"\n    cp $1 $BACKUP_FILE\n  fi\n}\n\
    backup_file /etc/hosts\nif [ $? -eq 0 ]\nthen\n  echo \"Backup succeeded!\"\n\
    fi\n```\nWe can take this example and improve it. One thing we can do is change\
    \ the `if` statement to an `if/else` statement. If the file exists, let the exit\
    \ status of the function be the status of the `cp` command. If the `cp` command\
    \ returns a non-zero code, then our function has also failed. If we know for a\
    \ fact that the file does not exist, we can use the `else` clause to explicitly\
    \ return a non-zero exit status back to our main script. We can also improve what\
    \ happens after the function is called. If we know the function—and thus the backup—has\
    \ failed, we can exit the script with a non-zero exit status.\n```bash\n#!/bin/bash\n\
    function backup_file () {\n  # This function creates a backup of a file.\n  #\
    \ Make sure the file exists.\n  if [ -f \"$1\" ]\n  then\n    # Make the BACKUP_FILE\
    \ variable.\n    local BACKUP_FILE=\"/tmp/$(basename ${1}).$(date +%F).\"\n  \
    \  echo \"Backing up $1 to ${BACKUP_FILE}\"\n    # The exit status of the function\
    \ will be the\n    # exit status of the cp command.\n    cp $1 $BACKUP_FILE\n\
    \  else\n    # The file does not exist, so return\n    # a non-zero exit status.\n\
    \    return 1\n  fi\n}\n# Call the function\nbackup_file /etc/hosts\n# Make a\
    \ decision based on the exit status.\n# Note this is for demonstration purposes.\n\
    # You could have put this functionality inside the\n# backup_file function.\n\
    if [ $? -eq \"0\" ]\nthen\n  echo \"Backup succeeded!\"\nelse\n  echo \"Backup\
    \ failed!\"\nfi\n```\n\n## Summary\nIn this chapter, you learned why you might\
    \ want to use functions. You learned how to create functions as well as how to\
    \ use them. You learned about variables and their scope. You learned how to use\
    \ parameters to access the arguments passed to your function. Finally, you learned\
    \ how to handle exit statuses and return codes with functions.\n\n## Practice\
    \ Exercises\nExercise 1: Write a shell script that displays, \"This script will\
    \ exit with a 0 status.\" Be sure that the script indeed exit with a 0 status.\n\
    Exercise 2: Write a shell script that accepts a file or directory name as an argument.\
    \ Have the script report if it is a regular file, a directory, or another type\
    \ of file.\nExercise 3: Write a script that executes the command `cat /etc/shadow`.\
    \ If the command returns a 0 status, report \"Command succeeded\" and exit with\
    \ a 0 status. If the command returns a non-zero status, report \"Command failed\"\
    \ and exit with a 1 status.\n\n## Solutions to the Practice Exercises\nExercise\
    \ 1:\n```bash\n#!/bin/bash\necho \"This script will exit with a 0 status.\"\n\
    exit 0\n```\nExercise 2:\n```bash\n#!/bin/bash\necho \"This script will exit with\
    \ a 0 status.\"\nexit 0\n```\nExercise 3:\n```bash\n#!/bin/bash\ncat /etc/shadow\n\
    if [ \"$?\" -eq \"0\" ]\nthen\n  echo \"Command succeeded\"\n  exit 0\nelse\n\
    \  echo \"Command failed\"\n  exit 1\nfi\n```"
