  md: "# HARDWARE REQUIREMENTS\n\nnumerals at the edit above). Using identical GPUs\
    \ on the guest and host causes problems because these IDs are identical (check\
    \ the Arch wiki for guidance). To pass through our GPU and Audio device, we create\
    \ a file `/etc/modprobe.conf` containing:\n`options vf-pci-ids=10de:1b81,10de:10f0`\n\
    \nFor this tricky some modern vm hardware is required, and even with modern hardware\
    \ things goes awry. The graphics cards used by the host can be anything, even\
    \ integrated graphics. If you have two GPUs, then you'll want to be familiar with\
    \ how to hide one GPU so your machine will operate correctly and try boot from\
    \ the guest graphics. The guest's graphics card needs to support UEFI (the motherboard\
    \ needs to support UEFI with OVMF. It is possible).\n\nTo make this work, we need\
    \ to edit `/etc/modules`. On Ubuntu, this is done through the `/etc/initramfs-tools/modules`\
    \ file, while on Arch (which we use) we add the modules `vfio, vfio_iommu, vfio_pci`\
    \ so that they appear before any other video drivers.\n\nHere is where we might\
    \ get any errors. After setting this up, we regenerate the entries with `sudo\
    \ update-initramfs` on Ubuntu or `initcpio` on Arch. Reboot and check the output\
    \ of:\n\nHopefully you see some reassignments:\n\n```\n[148517] UIO: Kernel level\
    \ driver version: 0.0\n[148649] UIO: device 0000:01:00.0 is class 10de:1b81,10de:10f0\n\
    m1:00:none\n```\n\n```\n[150260] vfio-pci add [1002:a6f7][ffff]: 0x000000000000\n\
    [150255] vfio-pci add [1002:a6c8][ffff]: 0x000000000000\n```\n\n```\n[549259]\
    \ vfio-pci add [0000:00:0.0][ffff]: 0x000000000000\nvGA decodes-id-to-iommu-decodes-to-mmu\n\
    ```\n\nIf this is not what you want, that is the end of the day. Check the output\
    \ of `lspci -nn -k` to see if changing the driver would be appropriate. This shows\
    \ whether or not the VFIO driver has bound to device.\n\nBesides setting up the\
    \ KVM guest, you may also need to connect (to the kernel) an external keyboard/mouse\
    \ (through one of a VNC or SPICE connection) the guest machine won't have access\
    \ to input devices. You can pass through USB devices, but if something goes wrong\
    \ the guest might not be relinquished, which will leave you unable to control\
    \ the host. If you don't have switching cables connected then you'll also need\
    \ a monitor with multiple inputs (and another video cable), or if you are using\
    \ a VM card you might run into the dreaded error '43', which can be worked by\
    \ tweaking your QEMU settings.\n\n# Fair bit-bare firmware\n\nFor any of this\
    \ to work the passed-through GPU needs UEFI, and the VM needs to be configured\
    \ with UEFI. Virtual Machine Firmware (OVMF) of Intel's Extensible Firmware Interface\
    \ (TMF) Kernel or similar UEFI firmware allows VMs to reap the benefits of UEFI.\
    \ We installed it with `sudo apt install ovmf`. We also got the grub and package\
    \ manager packages from the next section.\n\nWe need to tell libvirt about this\
    \ firmware, which requires adding a line to /etc/libvirt/qemu.conf. Check this\
    \ file for nmram, you will find some explanation, and add this line as follows:\n\
    \n```\nnvram = '/usr/share/OVMF/OVMF_CODE:/usr/share/OVMF/OVMF_VARS' \n```\n\n\
    For Ubuntu. On Arch change the path to /usr/share//. Finally, we need to set up\
    \ the VM manager. This is the same process as before but only uses Windows (you\
    \ can download from Microsoft). When you get to final stage of the install to\
    \ customize the Boot menu so that you can use UEFI booting (screenshot, right).\
    \ We're running out of space so we won't say much\n\nInstalling Windows - if you\
    \ can figure it out - or set up a UEFI SCSI disk and system by turning off i/o\
    \ disks does wonders. Once done Windows can be shut down and we set up the pass\
    \ through again.\n\nFrom the VM's Details, click Add Hardware, and select everything\
    \ from it is installed. Passing through USB keyboard and mouse is a good idea\
    \ too, but this needs to be separate from the ones you use to control the host.\
    \ No longer can we use the virtual devices (spice, video adapter, and peripherals)\
    \ for the moment of boot: boot the VM, plug in (with our monitor's passthrough)\
    \ GPU and keyboard, and hit some keys and you'll be booting into Windows.\n\n\
