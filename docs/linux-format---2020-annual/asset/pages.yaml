  md: '# # Cryptography IN-DEPTH


    He first use of cryptography is believed to have been by Julius Caesar, as was
    simple in the extreme but, since nobody had ever encountered an encrypted message
    before, every letter in the alphabet was moved by three places, wrapping around
    to the end if you did so. For example, A became D, and E became H, and Y became
    B, so LINUX became OLXXA.


    This might seem trivial, but it leads into the definition of cryptography and
    the genre we call cryptography. Instead of replacing a letter by three places,
    a general algorithm would shift each letter by a number of positions. In mathematical
    terms, the cipher would be shift n where n is the number of positions to move
    forward in the alphabet, known as cipher and a vital concept in modern cryptography.


