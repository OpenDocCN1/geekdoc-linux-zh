  md: '# Linux Format Annual 2020


    # ESCAPE WINDOWS


    Fed up with Windows 10?

    Looking to switch to a more user-friendly variant of Linux that gives you the
    best of all worlds? **Nick Peers** has all the answers...


    ![](img/b82853b6232162a20e963fd53f1b434b_25_0.png)


    The time you read this, Microsoft will have rolled out another major Windows 10
    update to its users. These you''ve had to get used to one of changes (whether
    it''s features being added, or simply moved with no explanation) before. At some
    point you say enough is enough, but what''s the alternative? It''s Linux of course,
    but some would say it''s a complicated and difficult thing to master.

    The answer is no, and as we offer up this article to show you how easy it is to
    get started with Linux. We''ve carefully picked a distro—Linux Mint—designed to
    appeal to Windows switchers. Linux Mint is based on Ubuntu, which is well-supported,
    but it''s also easy to use, all wrapped up in a user interface that is both familiar
    and welcoming.

    Brilliant... but it''s not as simple as that.

    Ditching Windows for Linux in one go is a


    huge leap into the unknown: What happens to your data? Can you find replacement
    programs easily? What if you decide after all? Don''t worry - we''ve got all covered.
    Over the next few pages we show you how to both-test Linux without installing
    your Windows first. Then once you''ve realised how good it is, we''ll show you
    how to install it alongside Windows, and transition between them without desire
    of committing to anything (for now)

    We''ll step you through every part of the process: from taking all-important backup
    and configuring your hard drive to accommodate Linux. A step-by-step guide to
    setup. You''ll finish with a variant of Linux that you''ll feel at home with,
    one which you can customise and start to familiarise yourself with. It''s basically
    not so much a plunge into unknown waters, but a gentle splash into the shallow
    end of the swimming pool. Let''s get those toes dipped...


    26 Linux Format Annual 2020'
