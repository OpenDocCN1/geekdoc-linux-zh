  md: '# Linux Format Annual 2020


    # Run Mint alongside Windows


    The process for getting Linux installed on your computer''s hard drive is pretty
    straightforward – when you know how.


    you''ve had a play with Linux Mint and you''re ready to take your first steps
    into Linux.

    But there''s no need to let Windows dictate you.

    We''re going to step you through the process of installing Linux Mint alongside
    Windows, complete with a special boot menu when you start your PC, enabling you
    to choose whether to load either Windows or Mint.


    Install Mac Reflect Free (www.macrum.com/reflectfree) as for the Windows job.
    Once installed, launch the program and start by clicking Other Tasks-> Create
    Rescue Media and select a recovery CD/DVD or USB flash drive (a 512MB drive is
    sufficient) – you''ll need this to recover from your hard drive if things go wrong.


    Once created, click ''Create an image of your partition(s)'' to recover and restore
    Windows.

    Select a suitable location on your hard drive and click Next. Ignore the backup
    plan screen – you''re taking a


    # Back it up!


    Now is the time to take a complete backup of your hard drive as it currently stands,
    before setting up Linux Mint.


    # PREPARE FOR INSTALL LINUX MINT


    ![](img/b82853b6232162a20e963fd53f1b434b_27_0.png)


    +   1 Starting Mint Live

    Place the Linux disc in your drive and boot from it (see www.linuxformat.com/dsupport/
    if you need help). Selecting the Linux Mint option followed by ''Start Linux Mint
    19''. When the live environment boots and the desktop appears, click the Menu
    button, type parted into the Search box and click GParted to launch the partition
    editor.


    +   2 Locate a partition

    GPart will start by listing the contents of the first hard drive in your system
    – you should be able to tell if it''s the correct drive by size and type (NTFS).
    If it''s not the correct drive, click /dev/sda in the top-right corner and select
    the correct drive (the size is displayed next to it, which should help you choose
    the right one by clicking it, verifying it''s the correct choice.


    ![](img/b82853b6232162a20e963fd53f1b434b_27_1.png)


    +   3 Resize the Windows partition

    Your partition is displayed as a block with the white area indicating how much
    free space is available. Right-click this – or its entry benefit – and Resize/Move.
    Drag the right-hand side to the left to free up space for Mint – we recommend
    32GB as a comfortable amount. Once Resize/Move, click the tick button and apply.


    +   4 Launch the install

    Wait once the partition is resized. Once the grey space ''unallocated'' is where
    you will install Mint. Close GParted, then double-click the Install Mint icon.
    Verify English is selected, then click your keyboard layout – English (UK) or
    English (US) unless you have a keyboard with special Windows keys. Continue.


    ![](img/b82853b6232162a20e963fd53f1b434b_27_1.png)


    Linux Format Annual 2020'
