  md: '# # Linux Format Annual 2020


    # # VIRTUALISATION


    Jonni Bidwell learns to master containers security and efficiency. Enabling him
    to run Linux and VirtualBox any time, any place and anywhere...


    ![](img/b82853b6232162a20e963fd53f1b434b_125_0.png)


    Virtualisation has been around since the mainframes of the 60s, where the activities
    of one program were separated from another. Later, IBM''s CP-40 introduced the
    ability to run multiple OSes on correctly.


    Virtualisation proper took off in the mid-2000s, when 64-bit processors became
    mainstream allowing guest OSes to be virtualised (in machines) more efficiently.
    This makes lives much easier. Whole systems could be booted up and restarted as
    files. Critical updates could be tested in a virtual sandbox, which vastly reduced
    the possibility of things catching when they were rolled out to physical systems.


    Multiple VMs could exist on the same system, yet for all intents and purposes
    be isolated from one another, improving security and efficiency. Home users could
    well enjoy the benefits of trying this out without risking the ruin of their incursion.


    The hardware has evolved even more since, and you can now pass whole development
    environments. This makes possible, among other things, running a Windows VM with
    its own fully accelerated, dedicated graphics card. This is better than implementing
    an OS rather than re-use the host kernel and just bits needed to run a particular
    service or set of services. This enables them to work with the libraries they
    require,


    obviating the problem of conflicting versions when software is installed on a
    different machine. This makes them more portable than VMs, and to some extent
    offer a similar level of isolation.


    Docker is the next thing, but there''s more than containers in a single company.
    Snaps and Flatpaks leverage technology beyond the traditional practices. This
    means developers can easily build and rapidly ship distro-agnostic packages, rather
    than waiting for them to include their software in the new release. So if you
    want to try out Hannah Linux in a safe environment, or install an entire LAMP
    stack on a server with a single command, read on!'
