  md: '# TURN YOUR PI INTO A TABLET WITH THE SMART TOUCH CASE


    ![](img/b82853b6232162a20e963fd53f1b434b_154_0.png)


    ![](img/b82853b6232162a20e963fd53f1b434b_154_1.png)


    +   **Use protection.**nAffix the transparent rubber feet to the base. Stick the
    two square foam pads on the Pi trapdoor and near the case corner (where the GPIO
    side of the Pi will rest). Your display may come with a short ribbon cable, in
    which case you should replace this with the longer one provided.


    +   **Secure the base**nFix the case to the base with the generously provided
    tool. Don''t tighten the bolts because your hinge will lose its vigour. Place
    the touchscreen carefully into the case and feed the ribbon cable through the
    aperture. Secure it in place with the dark-coloured screws.


    ![](img/b82853b6232162a20e963fd53f1b434b_154_2.png)


    ![](img/b82853b6232162a20e963fd53f1b434b_154_3.png)


    +   **Connect the DSI ribbon**nConnect the ribbon connector to the Pi and place
    it in the cavity. It can be held in place with one or two of the small, silver
    screws. If you use second screw by the USB ports then you won''t be able to use
    the trapdoor, otherwise secures the side of the Pi in place.


    +   **Connect the power**nUse the dual-micro USB adapter to connect both the display
    and the Pi''s power supplies. It''s especially important to have sufficient power
    to supply both of these appliances. A PC''s USB port can typically deliver 500mA,
    which explains the thunder in the next picture.


    ![](img/b82853b6232162a20e963fd53f1b434b_154_4.png)


    ![](img/b82853b6232162a20e963fd53f1b434b_154_5.png)


    +   **Enjoy the view**nCross your fingers and plug in the power. An up-to-date
    Raspian will have all the necessary drivers and the display will fire into life.
    Note the power warning in the corner. Also note to change the micro SD card when
    the Pi is mounted, you''ll need to unscrew it and flip it over.


    +   **Take pictures**nThe Smart Pi Touch case includes a LEGO compatible case
    for the official Pi. Feed the ribbon cable through the slot. Affix the top and
    clip the case on the side or on top. Note that connecting the ribbon through the
    trapdoor is difficult and you may prefer to remove it.'
