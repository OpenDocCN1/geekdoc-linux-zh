    Linux, the kernel, by itself wouldn''t be of much use to most of us. Version 0.01
    of it was made in September 1991, but it only made sense to a particular Finnish
    student and his ilk of uber-geeks.


    Once Le Blanc of the Manchester Computing Centre (MCC) wrote a menu-driven installer
    with a handful of GNU utilities created the first Linux distribution in February
    1992. This distribution allowed even non-Unix users to get a taste of Linux and
    helped roll in members.


    Later that year Peter McDonald created the Softlanding Linux System (SLS) that
    offered a software collection with an interface, which had only recently been
    ported to Linux. SLS turned into two major distributions. The first was Slackware,
    created July 1993. It remains the oldest Linux distribution that''s still actively
    maintained. The other also had been in development for several months, v0.91 released
    in January 1994 was its first public release and included a simple package system
    that could install


    and uninstall packages. The next major milestone in the Linux timeline also happened
    in 1994 with the birth of Debian and Red.


    Together these three distributions form the bedrock of the modern Linux distribution
    habitat. Although there have been many others, the majority of the current stock
    is an offshoot of the three oldest distributions. We find hundred distros, all
    for a slice of your hard disk. Over the next few pages we''ll help you sort through
