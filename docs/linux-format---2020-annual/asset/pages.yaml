  md: '# # Virtualisation in a nutshell


    We summarise the tech that makes virtualisation possible and fun.


    ![](img/b82853b6232162a20e963fd53f1b434b_126_0.png)


    Being able to run Edge is one reason to use a virtual machine, albeit not a particularly
    common one


    An old computer can run a virtual machine. People have been running emulators
    for years after all. But now, some emulating for architecture is so hard, so much
    less powerful than the host.


    However, when we emulate a machine that is similar to our host, we can use shortcuts.
    Instead of emulating the CPU and other hardware instructions use hardware. The
    more we do this, the more we get out of the emulation to the end of the spectrum.


    Virtualisation is also a great way of backing up a physical server. If you have
    a virtual mirror of your physical server, you can snapshot it and experiment with
    configuration changes or updates that would be impossible to safely in production.
    If they fail miserably then try to roll back and again. If your physical server
    fails, it''s straightforward (in principle) to physicalise (that''s not really
    a word – Ed) your virtual back up to hardware. Alternatively, just spin up a copy
    of this VM – the full world of machines.


    Since 2006, new features (Intel''s VT-x and AMD-V) have enabled the development
    of hardware that fit the bit gap perfectly. Linux has KVM, Windows has Hyper-V
    (OVMF) which runs, a privileged virtualised OS (dom), which can then run any OS
    like you. Less-privileged (dom) VMs use dom for all their hardware access, and
    run at native speed but are isolated. Security-focused Qubes OS uses Xen for virtualisation
    to keep applications separated. CPU innovations (Intel''s VT-d and AMD-V) give
    us direct hardware access. Open Virtual Machine (OVMF) and the wonders of the
    VFIO driver, that allows us to pass a whole graphics card to a Windows 10 VM and
    have it perform within a native of native speed and run all games that do not
    work properly with Steam.


    # ## CONTAINERS VERS VM


    Just as virtualization worked the world in the late 2000s, so years ago containers
    have come to the fore. There are similarities as far as isolation and host-agnosticism
    as concerned.


    For one thing containers don''t strive to mimic a machine. They share the host''s
    kernel, so they aren''t as different from the host as virtual machines are and
    a deep web of junction and complexity again.


    Containers in the modern sense refers to a general collection of technologies
    like lightweight computing engines and a diverse storage of formats. It is easy
    to associate them with one technology – Docker, but by this this is just one example.


    Containers are great for distributions which might be tricky to set up. All the
    fiddling around getting obscure Python packages or particular library versions
    is care of whoever maintains the container.


