  md: "# Virtual management: staying under pressure\n\nMemory management in Linux\
    \ isn't exactly the stuff of magic, and it's time to manage the memory way you\
    \ want.\n\nThink back to when you were appointed responsible for a server. One\
    \ day (actually night) you might have a wake-up call when server is dropping connections.\
    \ You log in via SSH and quickly find there is no server running in the box. Still,\
    \ you look at `/proc/self/memstat` and find no fatal errors. The process has disappeared.\
    \ Something strange is going on here.\nIf this is the first time you look at memory,\
    \ congratulations. You are among the first OOM killer victims. This TLA Stands\
    \ for Out of Memory, and the last resort kernel needs to grab memory to save the\
    \ system. Do you become the victim? Your web server wasn't the culprit, Linux\
    \ did choose to sacrifice, and what can you do to avoid another wake-up call?\
    \ In this Administella, we explore Linux memory and which knobs you can use to\
    \ tweak this mess.\n\n![](img/b82853b6232162a20e963fd53f1b434b_90_0.png)\n\nThe\
    \ process of memory management occurs in the kernel, which isn't the simplest\
    \ thing in the world. And complex maps are best learned by example. So, consider\
    \ `char *buf = malloc(1024);` if (buf) // Unable to happen //\nThink of a relevant\
    \ construct from your favourite language that might have so much memory to allocate,\
    \ and it would need to go to the kernel and ask for pages (4K blocks, keeping\
    \ things simple). There are two main ways to allocate memory for purpose:\n\n\
    Whichever choose depends on the allocator and how much memory it wants to allocate.\
    \ `brk` heap is contiguous: one can't release the first part when you're done\
    \ with the last one. Anyway, `malloc` is preferred for larger allocations. It\
    \ works by extending the length of a memory mapping (mapping) or using `mmap()`.\n\
    \nSo your 2MB heap could almost certainly come from non-trivial kernel allocation.\
    \ However, `brk` is shared: multiple threads use the same heap, while `mmap` handles\
    \ them separately. So to keep things simple, let's say you set `MAP_THROUGH` and\
    \ a 4KB allocation fits. Then, and a relevant function would return:\n\n```\n\
    struct mm_struct *mm = &current->mm;\nif (mm->max_map_count < count)\n    return\
    \ -ENOMEM;\nif (security_vm_enough(mm, vmap, len) < PAGE_SHIFT)\n    return -ENOMEM;\n\
    ```\n\nmm points to a memory descriptor of current process. Before the memory\
    \ request to\n\nthe process does a few checks. First, it ensures it has more memory\
    \ maps than `vm.max_map_count` settings permits. The default is 65535 and you\
    \ never have to have this under normal circumstances. If you however need many\
    \ memory maps, increase `vm.max_map_count` or use `mmap` to get free memory. This\
    \ is a trick that has free memory. And then, the kernel will 'allocate' some memory.\
    \ If you wonder why this word looks like at the code:\n\nPmap needs a process\
    \ map which aligns with them and permission bits. [Anon] may malloc gets.\n\n\
    # ## FOR MEMBERS\n\nThis Administrator covers a set of `sys/proc` entries and\
    \ others you might need to use the virtual memory system. Below is a quick summary\
    \ for readers:\n`vm.max_map_count` The maximum number of memory maps a process\
    \ may have. 64 should be enough for everyone.\n`vm.admin_reserve` How many kilobytes\
    \ to set aside for root. The same, for regular users. This leaves them free to\
    \ kill memory at home.\n`vm.user_overcommit_memory` Whether Linux should it's\
    \ possible memory allocation or just let it go and see if it works out.\n`vm.overcommit_bytes`\
    \ How many RAM in kilobytes, processes can use. This is option, which is always.\n\
    `vm.overcommit_ratio` The ratio, as a percentage of the total RAM size:\n`vm.on_panic_oom`\
    \ The memory it doesn't say it, but you can have Linux panic when it triggers\
    \ OOM.\n`/proc/PID/oom_score_adj` OOM score adjustment. This is a score of -1000\
    \ makes the process invincible to the OOM killer."
