    interface. The program can create an encrypted device within a file or partition
    and USB disk. It can also encrypt every file with GPG. ZuluCrypt can perform decryption,
    which means it can encrypt everything to a secret device. The device can be a
    whole disk, partition or a file mounted as a loopback device. With block device


    encryption, the user creates the file system on the block device, and the encryption
    layer transparently encrypts the data before writing it to the actual lower block
    device. While encrypted, the storage areas appear just like a large holds of random
    data and cannot even reveal its directory structure. All these functions are more
