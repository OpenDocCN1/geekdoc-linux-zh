    # TERMINAL: CALCURSE


    # # Managing your tasks and calendar


    Most bishnas can do anything from the terminal, even organising appointments and
    dates. Shashank Sharma shows you how.


    ![](img/b82853b6232162a20e963fd53f1b434b_51_0.png)


    Originally released in 2004 under the BSD license Calcurse Features a Ncurses-driven
    interface it can be used to keep track of all your appointments and tasks for
    anyone who loves working with the keyboard, Calcurse is a fun, productive tool
    designed especially for you.


    The project doesn''t ship pre-compiled binaries so you must install it from source
    if it is not offered in the software repositories of your distribution. Download
    the sourceball from the project''s website and uncompress it with the `tar xvf`
    command to extract the archive. Then run the INSTALL file to confirm if all the
    dependencies are installed on your machine.


    If you''re running a modern distribution you likely already have `gcc` and `ncurses`
    installed on your system. You can now install Calcurse by following the instructions
    in the INSTALL file. The process involves running `make` and then `make install`


    # ### First impression


    Running Calcurse without arguments, launches the tool in the interactive mode.
    Its interface comprises three panels.


    The sidebar on right contains panels. Calendar at the top and the TODO panel below
    it. When you select a date the calendar shows appointments for that day along
    with the appointments. All-day appointments are displayed with start and end time.
    The TODO panel holds a list of all the tasks you wish to accomplish with the defined
    prefix.


    Below these is the notification area. From left to right it track the current
    date and the upcoming appointment. If any final element at the bottom of the screen
    is the status bar which lists the possible actions such as Help, Quit Save, Reload
    and on.


    The default layout uses red to denote elements in the interface. The current date
    in the Calendar panel the currently selected appointment are all red by default.
    When you switch to a different panel,


    # ### Using Calcurse


    You can add an appointment for the current day by pressing Ctrl+A You will be
    asked to specify the start and end time of the appointment, and a description.
    After you fill in the details the new entry will be listed in the Appointment
    panel. Repeat the process to add new appointments. You can also create recurring
    appointments such as daily weekly monthly or yearly.


    To create a recurring appointment you must first add the appointment. Now press
    R to create a recurring appointment, and follow the instructions. The interface
    will show you the frequency you wish to change the start or the end time of the
    selected appointment or its description:


    Edit: (1) Start time, (2) End time, (3) Description, (4) Move?


    ```

    [1/2/3/4]

    ```


    Remember that the start time cannot be greater than the end time. If you can''t
