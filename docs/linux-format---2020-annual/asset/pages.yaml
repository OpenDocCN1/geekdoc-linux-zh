    # Garden party


    The modern-day gardens like Facebook operate on an API to bring third-party developers
    to build on platform. The future of the open web seems to be emerging. These garden
    party allow third-party developers to build new apps on top of these popular services
    and give users more choice for accessing and interacting with them.


    Social Web Community Group develops standards for the distributed andated social
    web. This is one of Activism, which develops the syntax for status updates. Another
    is OpenSocial, which is a collection of APIs and standards like Open Graph Protocol,
    used by Facebook, and Open for decentralised authentication.


    However, the situation of the open web is still without standards. They are the
    standards that can provide them, with which they might modify. If you want to
    change something you like''s add a function that you value it is essential to
    know how to interact with and use the service.


    The W3C has its history of controversies. We see back for discussions to allow
    DRM-Encrypted Media Extensions (EME) to HTML. The move was criticized and things
    came to a halt when the Electronic Frontier Foundation (EFF) quit the W3C when
    the latter published the EME specification in September 2017.


    The same also applies to media formats. The mp3 audio format had patent history
    which was freed in 2007. Now with HTML5, there are new ways to use multimedia
    content that can handle open formats like Ogg and Matroska. By de-standard the
    web, we empower users to turn towards open formats instead of proprietary.


    Over the next few, we will show you how to use your services to escape the walled
    garden variety. By default, the services will only be accessible from computers
    and devices connected to your home network. From then you have to get a static
    IP address from your ISP or use a dynamic DNS service and open ports in your router
    to facilitate access.


    The W3C defines standards of an open standard and over the years it has evolved
    several specifications and standards for the open web.


    Yet everything on your own isn''t feasible in administering the services. So we
    will look for other communities and find alternatives that you can change in order
    to alter all web services, which are decentralised


