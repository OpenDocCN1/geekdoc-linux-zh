  md: '# Linux Format Annual 2020


    # Further making adventures


    Let''s finish things with a collection of suggestions for further projects.


    having a portable power supply for your Pi or other devices is a deal, and there
    are a few options. Of course, a standard USB powerbank (one they can carry more
    like a Columbo days) is fine for many applications, but there are alternatives.
    If you have a lot of batteries lying around check out the MyPi''s BittBag. This
    enables you to power your Pi with four AA batteries. For more demanding situations
    an 8V or LiPo attachments are available. The BittBatt defends you against voltage
    drops, as batteries become weaker and refusing to turn off if they''re too weak.
    The ultrasonic sensor we used earlier can also be used with the Pi, but we need
    to be careful with the 5V GPIO pins we need to drop these to 3.3V to be safe.
    We can use resistors placed in series with the GPIO pin in them. You can choose
    one of resistor and another to work out the section. In this case a 1K and 2K
    resistor would suffice the UltraBoard, which might make it possible to connect
    four servos and ultrasonic sensors straight to the I2C bus of your Pi (SDA and
    SCL). A separate power supply which is needed if you connect four servos to it.
    The jammer should be removed if you do this, otherwise you risk damaging your
    Pi.


    ![](img/b82853b6232162a20e963fd53f1b434b_159_0.png)


    BattBag has three components on the Pi and is available for an unskilled kid.


    > The PiJuice battery pack has an RTC and can charge your Pi truly portable.


    ![](img/b82853b6232162a20e963fd53f1b434b_159_1.png)


    with a 1280mAh lithium ion (Li-Po) battery that will last for 5 hours of use,
    but this can be replaced with a lithium polymer (Li-Po) battery. You can then
    attach a solar panel (a 4W is one available for under $20) to charge the MyJuice
    and Pi power supply. For a completely isolated solution the LiPaRUs E-link display
    (unless the sun runs out) comes with the bonus of a real-time clock, which is
    useful for keeping track. PiJuice''s software enables battery levels to be read,
    and a shutdown script can be set to run. This makes for a delightfully simple
    UPS (uninterruptible power supply).


    If you find a small-power supply (or a big-bench), then you can connect it to
    a Pi, and then zero the selling power in an arrangement, you can make some nice
    nature photography. The No-IR edition of the camera (which has no IR filter) sees
    at night, which makes it great for capturing badgers, owls (if you''re lucky)
    or other


    # POWER CONNECTIONS


    ![](img/b82853b6232162a20e963fd53f1b434b_159_2.png)


    Thanks to the world-standard on micro-USB connections (except those made by a
    certain fruit company), it''s easy to pick up a power supply for your Pi. It''s
    basically the same thing all over. However, many of the cheaper chargers aren''t
    capable of providing the voltage required by the Pi.


    The same is true for the Pi 3s (and B+), servos and wireless chips need extra
    voltage. Many unsuspecting users of these devices have been traumatised by the
    appearance of a lightning bolt on the screen. This signifies a low voltage and
    the Pi has tripped off its CPU to keep things stable.


    The underpower is further exacerbated when you start piggybacking other devices
    (like motors) onto the 5V and 3.3V power supply. Good power supply is line here.
    We heavily recommend using the official Raspberry Pi Foundation PSU, rated at
    2.5A, or some other quality unit. If you need to power a number of devices, hubs
    that supply up to 3A per port are available.


    ![](img/b82853b6232162a20e963fd53f1b434b_159_3.png)


    Ultragob solves several serious-related problems at once. You can even daisy multiple
    Ultragos together.


    160 | Linux Format Annual 2020'
