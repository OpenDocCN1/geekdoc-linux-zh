  md: '# # What''s all the fuss?


    It''s been a seven months since the last Mint release, so what''s been freshly
    prepared for this time around?


    Based on April''s Ubuntu 18.04 release, Mint 19 (like the two previous generations)
    will be supported for five years, and we can expect point releases in 12 and 18
    months. This time around there are desktop environments: Cinnamon, MATE and XFce
    with something for everyone. Missing the KDE edition, although always KDE from
    the Ubuntu repos (or indeed Gnome, Budgie 3 or any other desktop or window manager
    you''d care to use).


    ![](img/b82853b6232162a20e963fd53f1b434b_18_0.png)


    We received some questions from readers about backups, and however it''s better
    to point to a simple solution to serve common-sense cases. Of course we tell people
    that doing things side-lashed - writing cron jobs that use wild and rsync却是 -
    but this isn''t exactly easy for you. Furthermore, restore is often daunting,
    and it''s possible to do even more damage by restoring things, with back in the
    wrong places.


    Fortuitous then, one of the biggest changes in Mint 19 is the introduction of
    Timeshift-a backup tool. Unlike System Restore on Windows, it''s more focused
    on snapshotting directories rather than other user files. Timeshift can take backups
    if you set it up, but it will not backup the whole disk. We dedicated two pages
    to Timeshift (see 36-37), so please let us know if it helps.


    While Ubuntu is out on Snap support, Mint Flatpak support was introduced in Mint
    18.3 and is here again with this release. Flatpak apps can be installed from the
    Software Manager, making it easy to access the latest variety of software. Atom,
    Discord and Slacks are not totally off; you''ll just have to install them from
    the command line. However, at the time of when you want to do that, it might be
    a bit buggy, but that''s more of a bug in Software Manager that will be fixed.


    There''s lot more going on, too. HIDPI support continues to improve, for example.
    The Mint-icon


    # ## SCINTILLING CINNAMON


    ![](img/b82853b6232162a20e963fd53f1b434b_18_1.png)


    Cinnamon 3.8''s flagship debut, was released in the month of May 2018 and improves
    the Mint-Y experience. With modern design trends, it''s smooth and fast. Mint-Y
    was in Mint 18, not the default, but it has been tweaked and polished to perfection.
    If you prefer the classic Mint-X that has been around since Mint 2014, don''t
    worry - it''s still available.


    The desktop environment has some new features and improvements. The Muffin window
    manager now features faster filtering to files over network or USB drives. It
    will be noticeably quicker when dealing with large directories. Nemo also allows
    you to manage more of searches, which will be useful in the background for future
    searches.


    If you don''t like the out-of-the-box appearance, Cinnamon can be further customized
    with many other themes, extensions, applets and desks (collectively known as spans).
    These can do everything from bringing wacky windows to displaying the weather
    here in Bly is unbelievably glorious, making the daily task of producing matters
    rather that.


    This weekly will guide you through your first steps and all of your Mint-related
    questions.'
