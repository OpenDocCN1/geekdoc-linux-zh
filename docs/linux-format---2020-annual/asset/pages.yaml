    # PaPIRus e-Ink display


    Use a low-power display to read books, display graphics and more...


    +   - Supply (https://uk.pi-supply.com/) has designed a range of cheap e-screens
    that are easy to install and have the punctic moniker PaPIRus. A number of different
    screen sizes are available, ranging from a 1.44-inch (64x64, suitable for Pi Zero
    projects) to a 2.7-inch (264x176). It''s worth noting that the 2.7-inch model
    overlaps the HAT, hence the edge of the Pi by a few mm. The whole screen won''t
    fit in a standard case. It will sit on top of a Pi Cube or other case. All models
    are equipped with a battery-backed RTC (real time clock). There are also four
    input buttons that sit along the edge of the board.

    Constructing the kit might be a bit fiddly, depending on how your fingers are.
    For instructions see https://raspberrypi.com/make/raspberry-pi-assemblies-to-gadget.
    The first step is easy: connect the screen to the board with the ribbon cable.
    The next step is not so easy, but is optional. It involves soldering a pin, known
    as a po pin (depending on which model of Pi you''re using, the RUN on the Pi 3B
    has moved to the other side of the board, so use CN15 in this case, CN13 for all
    others). If you don''t


    ![](img/b82853b6232162a20e963fd53f1b434b_155_0.png)


    Smaller screens are available, and so are. This example is for the Pi Zero. Image
    credit MadeByPi


    this, won''t be able to use the wake-alarm function provided by the RTC, but all
    the e-ink functions will work as normal. Next, push the buttons onto the board
    and solder them from the reverse. If you don''t solder them, they''ll rattle around
    and lose themselves. They are small so you might lose them in your first attempt.
    Fix the HAT and screw onto the GPIO pins, fix the standoffs in the board and Pi,
    it will work.


    # It''s software


    Now we need to install the high-level software. For PiPiPaPIRus you can choose
    between an easy curl -s | | one bash line, or use your own python. As of present
    there is an issue installing the python module, so if you use the other run `pip3
    install dateutil`


    and then run the set up. If the SPI and I2C bus get enabled already, you''ll need
    to reboot your Pi before you can start installing.


    Run nano-piconfig and configure the screen before you finish anything. There is
    also a known issue where the screen might be inverted (displaying odd barcode
    pattern) if you don''t set the orientation correctly. Now use the configuration
    utility


    If you get an error saying the dateutil module hasn''t been loaded. As from broken
    connection, if the HAT hasn''t seated on the GPIO pins, you can try to re-seat
    it with a screwdriver. Out of when you''ll find a bunch more online by typing
    papirius- and parsing tab. Using handy Python APIs, PaPIRus can display text,
    graphics, or a combination of.


    A number of Python scripts are included: This is one used the buttons to navigate
    a menu system.


    > CONSTRUCT AN ARENA


    Amazon''s Kindle range may have the eReader market offering devices with lengthy
    battery life and the magical ability to bring books from their giant library in
    your pocket, but if you don''t want that, you can create your own. There is a
    wide range of DRM-free books easily available.


    Gutenberg hosts thousands of classic texts that you can work as normal. There
    are also licensed (for example by Core Docs — eReader) books available for free
    download from numbleleberg.com. Converting PDFs to the e-ink screen is likely
    to be a major effort, and the Epub format is widely used, Project Gutenberg enables
    you to download books as plain text, which will be much easier to parse.


