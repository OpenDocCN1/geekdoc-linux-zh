  md: '# Custom jukebox TUTORIALS


    Startup Applications Preferences


    | | | |

    |---|---|---||

    | Silverje | Organize your music in an easy-to-use jukebox style | Add |

    | Snap user autostart helper | | Remove |

    | Help | Add Startup Program | Edit |

    | Name | Start Silverje | |

    | Command: | /home/jukebox/startjukebox.sh | Browse...

    | Comment | Start Silverje in Kiosk mode | |


    add to your music library and manage the Music library settings. Because NUC has
    limited drive capacity we are using an external setup to store our library. Depending
    on your setup you may have your files on a local drive, an external USB drive
    or on your network. Silverje enables you to add any music from any of these options.
    To see how Silverje selects and identifies your music files (for example, including
    zip files), the defaults should work fine. Once you''ve added a source, Silverje
    will restart its scanning. This might take some time, so we recommend a cup of
    tea, as tradition.


    ![](img/b82853b6232162a20e963fd53f1b434b_162_0.png)


    # Select your designs


    On the Tabs bar there are eight skins to choose (from trying to find more online
    to a deleted one) and the Old-Style skin. If you found some of the navigation
    buttons were too small, Silverje is কথায় simple with resized controls. In the
    Tabs tab we can set the font size to 18 or to 90 percent. By default, it makes
    much more use of our choice for real estate and select tracks by touching and
    restricting additions to the queue but it is sensitive to prevent the track being
    queued twice and prevent repetitions having no back help. The Automatic control
    bar will specify how long Silverje waits before playing if there are tracks not
    in the queue. You can also choose how Silverje selects tracks to play automatically
    in Edit-Music mode, which can be used to select selections, from ''Music from
    the 1970s'' by a date. These selections can then be used by setting Silverje to
    automatically start playing tracks. This will keep you in the 70s disco theme.
    Kiosk mode starts Silverje into full mode. However, there''s no GUI to setting
    Silverje in kiosk mode so you will do this with a script. The Tabs enable you
    to configure functions you want to allow people to use when running in Kiosk mode.
    For example, you might be able to adjust the volume or the time out reached. You
    could also limit the music selection to be saved last. Again, for your display
    purpose. The setting up your first jukebox involves enabling a virtual keyboard,
    which is not possible for people to search. When you enable this you will need
    to select the US International layout, because Silverje will default to British
    (UK) keyboard.


    This means we can create a simple script to edit it with the following lines:


    ```

    #!/bin/bash


    silverje -kiosk

    ```


    # QUICK TICK


    If you''re using an external USB drive for your music library you might want to
    use your computer''s BIOS to make sure your internal drive is not used to boot,
    or that it has a higher priority than the external drive.


    You can run this by pressing the ''search'' key and search for Startup Applications
    or by running gnome-selection-preferences from the terminal. If it is simply a
    matter of clicking Adding, add a name and script path to startjukebox.sh. To prevent
    jukebox from going to sleep while de Ubuntu''s power-settings, you can set the
    screen to never go black and to never suspend. Make sure the power is set to Off.
    Under Privacy you can turn off screen lock when Notifications are disabled.


    You''re all a good idea this to reboot the system and make everything as expected
    using the keyboard and heading to the bar


    # >> MORE


    Cover art is ever more authentic than any jukebox experience and your jukebox
    will help you navigate if you all have the correct covers. Silverje recognizes
    cover art if it is embedded in the music files and downloads it if it has the
    capacity to search and covers from the internet but it''s not great for updating
    others in bulk.


    Searching for album in Silverje will start a global (or similar) search and display
    any results to the right folder. Not many you wanted to have thousands of results.
    If Silverje can''t find it it will generate an Avithark (similar thing, not James
    Cameron) cover using the album and title name from different online sources, but
    for so many covers, your albums will all look the same and not stand out. It''s
    a good idea to clean up your library and download new cover art using a tool like
    MusicBrainz Picard and then add your music to Silverje.


    # Starting up


    The first step is to configure startup to Silverje in kiosk mode at every boot.
    This will allow for the keyboard and mouse to be removed and for the power button
    on the PC to be used to turn the jukebox on and as required.


    It''s possible to configure Silverje into kiosk mode by starting it from the --kiosk
    switch.


