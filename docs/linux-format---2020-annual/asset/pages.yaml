    Linux From Scratch or LFS as you know it is actually a book, which is basically
    a guide through the process of building your own Linux distribution. The books
    offered at are free to download and you can get a printed edition at the book
    store.


    Once you''re with LFS, you''ll have a system that''s very fast and light. But
