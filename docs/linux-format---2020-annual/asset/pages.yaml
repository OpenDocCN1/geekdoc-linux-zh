  md: '# Test driving Linux Mint


    Discover how to road-test Linux Mint quickly, easily and without putting it anywhere
    near your hard drive and all your data – unless you ask it to.


    The big plus of Linux distribution is its ability to run directly from DVD or
    USB flash drive. This so-called "live environment" enables you to preview previous
    distros without committing to install them first (and, also, it provides you with
    a familiar environment when you need it). When running from DVD, any changes you
    make are lost when you restart, so you can experience it without worrying.


    The live environment is a good place to start your tour of Linux Mint as a whole,
    because it is virtually identical to what you get when you install Mint. Place
    the Linux Mint disc in your drive and boot from it (www.linuxmint.com//) if you
    need help booting your PC from CD or selecting the Linux Mint option by Start
    Linux Mint MATE.


    After a few minutes you notice that booting from DVD is slower than running off
    your hard drive (or a fast drive) – you should find yourself at Mint''s Cinnamon
    desktop. It should feel familiar to Windows users following the classic layout
    of the desktop with a taskbar (like a panel) along with all the menus you need.
    The Menu button is laid out too; the Menu is on the left, with right-click notifications,
    application shortcuts and open windows displayed in between.


    Next to the Menu button is a button that minimizes all the windows on the desktop,
    by three sheets. These three point to Firefox web browser, Terminal (the command-line
    interface) and the Files tool, manager of File Explorer. Click the sidebar to
    see all the drives that you have mounted. This is deliberate, but if you want
    to access your files, click the drive as it appears in Devices in Files. You can
    then open and edit files, make changes and delete them, too. To mount a drive
    and put it within the reach of the Mint environment, click the eject button next
    to the drive name.


    Mint''s Menu button provides shortcuts to all installed applications, as well
    as preferences and Mint''s "stores" for installing more programs: Software Manager
    and System Settings. You are free to browse and install apps in the live environment,
    but they will be wiped when you shut down. There are plenty of pre-installed apps
    too, including LibreOffice, GIMP. If you''d like to experiment with the Linux
    environment in the longer term and preserve certain settings and installed applications
    between boots, you will need a USB flash drive (8GB or larger) and the services
    of the box (optional).


    ![](img/b82853b6232162a20e963fd53f1b434b_26_0.png)


    The Linux Mint CD makes it easy for you to give the distribution a trial without
    installing anything to your PC''s hard drive


    # >> PERSISTENCE


    When you run a distro in a live environment, all changes are lost when you reboot
    or shut down. This behaviour can be changed if you use a suitable USB to create
    a live Linux Mint environment using an 8GB or larger flash drive with a "persistence":


    This partition of the drive limits can be changed by using a persistence session.
    When we said, we meant installed applications and settings, but trying to avoid
    making bigger changes while making major updates. I recommend using it after installing
    or updating your system, as installation takes time – it''s only suitable for
    a more extended-road of test.


    You need special software to create your USB flash drive. Go to www.rufus.ie/
    and click the link to download Rufus. The tool is very easy to use. Once started,
    select Linux Mint and click Browse to select the Linux Mint ISO file (in the Mint
    Select folder). Select your USB drive and select the FAT32 system option. Finally,
    use the slider to set a partition size of around 2GB and click Create.


    ![](img/b82853b6232162a20e963fd53f1b434b_26_1.png)


    Add persistence to your USB flash drive if you want to save changes after reboot.'
