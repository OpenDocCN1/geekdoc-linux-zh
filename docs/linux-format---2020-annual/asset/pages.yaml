  md: '# # Benchmarking TUTORIALS


    fio a command-line application that will be able to install from your distro''s
    repository. On Ubuntu you would do:


    ```

    $ sudo apt install fio

    ```


    fio simulates different kinds of applications'' behaviour. We use it to measure
    IOPS for a workout that demands a combination of sequential and random reads.
    Fio accepts a collection of parameters that are used to specify the I/O workload,
    either using command-line arguments or as a job file.


    A job file is a text file in the IN format that presents the same parameters as
    be specified as command-line arguments. Except for a few parameters that can only
    be given on command-line, all other parameters may be specified in a job file,
    but command-line arguments take precedence.


    The documentation describes the job file format, with the parameters specified
    in sections and comment lines starting with # A [special] section may define parameters
    applicable to all jobs. A command-line job might look like this:


    ```

    $ fio basic_benchmark --size 1m

    ```


    or as a job file, using basic_benchmark.f containing the following:


    ```

    basic_benchmark

    ```


    that you run will tell fio to produce the result that it can report in a verbose
    human-readable format or something more machine-readable. This semicolon-delimited
    format can be used to group and produce multiple results.


    Output formats are specified using a command-line option (not in a job file) and
    multiple outputs can be merged. For example, using awk:


    ```

    $ awk --output=json,normal,ter basic_benchmark --size=1m iops=1024,thep=4,rw=randread
    --basic_benchmark size=6736m

    ```


    the test output will only interpret the first run and look for the first 3 workloads.
    The fio reports 130 data sets and returns the result in the FIO format by default
    - you can parse it however you wish. However, you can find more examples on GitHub
    (github.com/fio/fio-fields) and this is most helpful.


    We will find more examples of IOPS for our benchmark with 9 different types of
    workloads. We want to investigate latencies, and bandwidth. Our job file consists
    of a series of tests to run next:


    ```

    [global]

    size=1g

    rwmix-write-25

    ```


    ![](img/b82853b6232162a20e963fd53f1b434b_56_0.png)


