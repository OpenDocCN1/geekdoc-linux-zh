  md: '# IqAudio Hi-Fi HAT


    Listen to high-definition audio on your Pi, and breathe life into your old, dumb
    hifi-fi.


    The Pi multi-media capabilities were impressive when it was released, particularly
    the video engine and HDMI port. But there are areas sorely lacking the quality
    of analogue audio. This is a shame as your Pi could otherwise be used to turn
    your dumb hi-fi into a better speaker system.


    The nifty gritty sounds something nothing like this (and we encourage you to try
    it and correct us if we stray from the truth). The audio generated from digital
    signals is limited by the PWM (pulse-width modulation) clock to 11-bit (read more
    about PWM in the box). This is fine for beeps and pops, but if you plug in fancy
    headphones it will sound lacking. There hardware will also pick up noise and static
    from other components


    unsupported wireless chip), then use a case to connect it to your router. Volumio
    is partnered with Allo to make the Nanosound which is made of a Pi and one of
    Aller''s high-grade DACs fitted with a custom OLED display. It''s all in one box
    with playback and control, which you can use to turn the Pi on and off without
    having to worry about the DAC. Beyond Volumio you could just as well use MPD to
    serve your music. MPD is free for Android, and another popular choice is MPD-com,
    which makes it possible to connect to various services like Soundcloud and Google
    Play Music.


    # Sounds good


    To our rescue, we can create an audio HAT that handles both high-fidelity audio
    for not much cost. We used the I2S DAC HAT which makes 24-bit 96kHz audio reproduction
    possible. It takes the digital audio signal from the Pi via I2S protocol and converts
    it to analogue audio. There are many manufacturers out there, such as HiFi Berry
    and Allo, who offer a reference implementation to control the quality from resampling
    digital audio signals. Some HATs have a built-in amplifier that allows you to
    control the volume per channel boom. We preferred the use of a quality 90s amplifier,
    and found IqAudio''s offering produced a decent result. We found out that it didn''t
    sound quite like we expected, though.


    Turning your Pi into a smart audio hub is easy with the Volumio distribution.
    It''s available for PCs, and other boards; grab it from https://volumio.io/started.
    If you used the SD card, just plug in Pi and connect and it sets itself up with
    any other device. If your Pi doesn''t have (or has an


    ![](img/b82853b6232162a20e963fd53f1b434b_156_0.png)


    ![](img/b82853b6232162a20e963fd53f1b434b_156_1.png)


    ![](img/b82853b6232162a20e963fd53f1b434b_156_2.png)


    # >> PULSE-WIDTH MODULATION


    Pulse-width is a method of encoding information as digital data. Using the frequency
    of the clock generator we can create data based on how much the signal is low,
    compare to how it is. If we send a signal that has 1 and 0 (for the same period)
    and repeats, then it looks like one of half. This is a 50 cent duty cycle. By
    changing the duty cycle we can change the amplitude of the signal to create an
    analogue signal. This is used in PWM to represent the size of a number or any
    other things.


    PWM can be used to mimic an analogue signal, for example by varying frequencies
    when the PWM signal is low and it is high. Going back to the Pi example, if we
    want to play back a 48kHz audio file then the number of different values between
    high and low can change, in a single sample working at 48kHz per second some closer
    to the power of two, our PWM DAC (assuming it''s the clock of the 100kHz) gives
    us, in lay terms, over 11-bit audio.


    Audio hardware has been improved with each Pi generation, in particular the high
    and low pass filtering arrangements. The PWM driver has been revamped in successive
    releases, most notably in October 2017 which saw output output treated to a complex
    three-stage sequence followed by a ray-shifting filter.


    > Our favourite MPD client is the catchily nestled ncmpcpp. Music sounds better
    from the terminal.


    Linux Forum August 2020 | 157'
