  md: '# Linux Format Annual 2020


    # Image tools


    Check out these nifty options for managing or editing your image collection.


    # ## Pencil 2D


    You can use Pencil 2D to create static and animated drawings. A comprehensive
    program that will help you digital designer create professional-grade cartoons
    and animations in multiple layers. The intuitive tool is complemented by the videos
    on its website: www.pencil2d.org


    ![](img/b82853b6232162a20e963fd53f1b434b_165_0.png)


    # ## FOTOXX


    A comprehensive image-manipulation program with a rich set of retouch and edit
    functions that go beyond brightness, contrast and colour. Like most dedicated
    image editors, FOTOXX allows you to select any object or area within an image
    with such freedom. Follow edges and select matching tones. Another


    unique feature of the tool is that it makes possible to edit the images without
    using layers. You can also use FOTOXX to create HDR and panoramic images, reduce
    noise and remove dust spots, create collages, mapsaps, and slideshows with various
    effects. There are also artistic features to let you convert a photo into a line
    drawing, sketch, painting, embossing, cartoon, dot image, or mosaic.


    On the initial launch, FOTOXX fires up its quick guide in the web, along with
    a dialog to edit your image library. This process can take some time depending
    on the number of images you have in your library. All of its features can be clearly
    labelled in the left-side panel: https://korniet.net/fototxx.html


    ![](img/b82853b6232162a20e963fd53f1b434b_165_1.png)


    > You can use FOTOXX for resource-stripped masks and the program can be negated
    by the keyboard.


    # ## RAPID PHOTO DOWNLOADER


    This program might seem redundant considering that most tools handle import photos
    through PhotoLoader, which is designed for transferring photos and videos. It
    offers a lot of new functionality that makes it work well for processing and organising
    photos and videos.


    The tool gives you control over how it processes and sorts the photos. The program''s
    default rules automatically transform the downloaded photos based on filters.


    You can define custom rules for your requirements. You can ask the program to
    sort photos by type, which comes in handy if you have both RAW and JPEG files.
    In this case you can create complex filters by naming rules based on Exif values
    and size and so on. You can also specify an external storage drive as the back-up
    destination, and the program will automatically back up the photos downloaded
    from the camera: https://flashmonkey.net


    # ## CONVERSE


    Converseen is a straightforward friend to various command-line utilities that
    can convert images to almost any format, rotate and flip them, change their dimensions,
    and rename in a fraction of the time it would take to perform these tasks manually.
    http://fasternland.net


    ![](img/b82853b6232162a20e963fd53f1b434b_165_2.png)


    > Manipulate any number of images within the Action panel.


    # FORAG


    Use this tool to upload content to Flickr and access its basic interface features
    such as the ability to organize sets, categorize them into tags and groups. https://marlspr.category/tnagr


    # NOMACS


    This image viewer displays images in all popular image formats. In addition it
    has some unique features like the ability to synchronize viewing between multiple
    network instances. https://nomacs.org


    # FLAMESHOT


    Use this tool to control and manage your camera from the computer. It will also
    help you set up by shooting the shutter, ISO and other settings and then download
    the images: https://entity-photo.org


    # LYCHEE


    Lychee allows you to capture the whole or a specific portion of the screen. Additionally
    it provides you with a platform for storing and sharing photos. You can run it
    from an SBC like the Raspberry Pi to upload, manage and share photos.. https://github.com/lupoDharkels/freeshot


    ![](img/b82853b6232162a20e963fd53f1b434b_165_3.png)


    ![](img/b82853b6232162a20e963fd53f1b434b_165_4.png)


    ![](img/b82853b6232162a20e963fd53f1b434b_165_5.png)


    ![](img/b82853b6232162a20e963fd53f1b434b_165_6.png)


    16 | Linux Format Annual 2020'
