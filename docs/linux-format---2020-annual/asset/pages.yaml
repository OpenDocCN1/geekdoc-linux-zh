    specific to each appointment and appear on the respective date.


    Remember to save S to the changes, after adding or editing an appointment or TODO.


    # Fetching information


    If you don''t want to access the information through the TODO list, the alternative
    is to run the tool in what is non-interactive mode. This is done by invoking Calcurse
    with any possible command option, such as -a or -d. Running calcurse will display
    the appointments for the current day, and the appointments for the next few days.
    Use the command -d


    ```

    $ calcurse -d

    09/27/1

    - 10:30 -> 14:30

    Court

    - 15:00 -> 16:00

    Lunch

    - 16:30 -> 17:20

    New client meeting

    - 20:30 -> 21:30

    Gym

