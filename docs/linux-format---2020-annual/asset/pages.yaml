  md: '# # Linux Format Annual 2020


    # # Pimp your Pi


    # ## Turn the li'' Raspberry Pi into a showstopper!


    part from building wonderful projects, you can invest in some wonderful showcases
    to make your Pi look pretty. Pimoni''s PiBox cases are extremely popular and come
    in a range of shapes and sizes. We favour the Simple Couple model, which also
    allows for the GPIO pins to stay on the Soc, so that there has a heatsink inside
    the case. If you''re going to prototype, you can replace it with a larger one
    that accommodates a 400mm (or two 170mm) board. This keeps everything much neater
    and tidy.


    If you have access to a 3D printer, or a printing service, then you can go step
    further and design your own case. The quality and range of materials available
    have evolved significantly over the past few years. Gone are the days when you
    print it, and it would be a lumpy, off-white insult to your design. These wonderful
    materials are enough for all kinds of designs you can make with whatever, so you
    can start with having the correct dimensions – always!


    # Hey big spender!


    Forget Forbooks, PiBooks is all alright. At £260 it''s not cheap, but the Pi puts
    your Pi (not included) in a case that makes a real factor in bright green hue.
    Use the board for keyboard and you''ll find an area for prototyping and playing
    with Pi.


    The Pi comes with an exclusive Inventors'' Kit that includes projects to get started
    with GPIO, sensors and coding.


    ![](img/b82853b6232162a20e963fd53f1b434b_153_0.png)


    ![](img/b82853b6232162a20e963fd53f1b434b_153_1.png)


    > The Pi transforms your Pi into a laptop. It does not glow that colour in the
    dark. Image: ModMyPi


    Thanks to the enthusiast community there are a number of things that can require
    more skills than just putting together LEGO. In fact, here''s one you can incorporate
    into your Pi project. For this, we''re going to transform the Pi into a fully
    functional tablet, complete with LEGO-compatible mounts on the case (available
    from ModMyPi for £29.99). This project is officially approved by the Pi Foundation.


    There have been a few options for the Pi: three-line LCD displays and low-resolution
    displays have been around for as long as the Pi itself, but they are generally
    not suitable for activities. Layers eventually became available, but these required
    complicated soldering to driver boards, and required lots of effort to make them
    work well. This generic project used lots of GPIO pins, so if you use them and
    then remove them, you were out of luck.


    Another solution, the Raspberry Foundation designed a marvellous seven-inch 800x480
    display that''s easy to put together and, thanks to the D ribbon connection, doesn''t
    need any GPIO pins on the Pi. The Pi mounts nicely on the back of the display
    and you don''t have to worry about the via the Pi''s SV pins, then the display
    driver board can draw power via its micro-USB connection.


    ![](img/b82853b6232162a20e963fd53f1b434b_153_2.png)


    ![](img/b82853b6232162a20e963fd53f1b434b_153_3.png)


    We managed to knock together this wooden Pi case about three hours (including
    print time). It''s a bit rough around the edges, though


    ![](img/b82853b6232162a20e963fd53f1b434b_153_4.png)


