  md: '# Linux Format Annual 2020


    # MUNIN AND MONIT


    # Monitoring advanced users and admins


    Mihalis Tsoukalos explains what you need to know to start with Munin and Monit
    for monitoring your Linux servers.


    Munin is what separates professional system administrators from amateurs and it
    can save you lots of time and energy. This tutorial is about Munin and Monit and
    how you can use them to monitor a Linux system - you will certainly appreciate
    the simplicity of the Monit setup process and the output generated by Munin.


    Although having Munin and Monit will make the job of Linux monitoring easier the
    hardest thing is deciding what to monitor, which mainly depends on the tasks and
    the resources of the Linux server.


    # OUR TIP


    Mihalis Tsoukalos has forgotten more than you will ever know!


    # Dynamic duo


    Munin service generates pleasing and informative graphics about the operation
    of a Linux machine. On the other hand, it is an easy to install monitoring program
    that checks the availability of various Linux services such as Apache, Postgres,
    and MySQL. If you want it, it might check if they are running or that they are
    done. By combining Munin and Monit gives you a way to monitor both.


    ![](img/b82853b6232162a20e963fd53f1b434b_111_0.png)


    Figure 1: The initial screen of the Munit site as served by the Apache web server
    and created by Munin.


    It should be clear that Munin is for monitoring resources of a Linux machine.


    in order to avoid potential problems, Monit is better at protecting the services
    of a Linux machine. Note: although Monit can monitor more than one Linux server,
    this tutorial only explains how you can monitor the Monit that runs.


    # Installation


    You can install Munin and Monit on an Ubuntu 18.04 system by executing the following
    commands:


    ### Find out more about how to get started at http://lxf2400.com, Munin and Monit
    at http://munin.org, and at http://lxf2400.com for documentation.


    # ## apt install munin munin-plugins-extra monit


    The first command installs Munin and various plugins as well as a plugin for Perl.
    The second command installs Monit. You can find the version of each of the two
    programs as:


    # ### munin --version


    This is munin-v0.3.27-0.ubuntu1


    # ### monit --version


    This is monit v0.25.15


    The output of the previous two commands shows that Munin and Monit have been installed
    and that you are ready to start them. To start Monit you can start systemctl start
    monit-node. Both Munin and Monit will start running and monitoring things that
    they are properly configured - we will get to configuring Munin and Monit a little
    further.


    Figure 2: Illustrates how to use munind config to find information about plugins
    of Munin and has support for autocompletion.


    ```

    munind config --help

    nYou called the command with a name that I don''t recognize. You didn''t intend
    to use it, but it might also mean that you made a typo. Please check your type.
    For more help see [Munin]

    I will show this if the file has no [a-zA-Z0-9_-]

    Usage: munind [option] [config-file]

    --option [key] [value]

    --format [type] translation

    ```


    ```

    Examples:

    munind config --help

    munind -F query all

    munind -F apache

    munind -F mysql

    munind -F postgres


    asterisk_metrics

    asterisk_process

    isk_calls

    asterisk_sipchannels

    asterisk_chamchannels

    ```


