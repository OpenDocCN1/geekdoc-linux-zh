    When it comes to editing files, we have plenty of choices. If we are using local
    server, we can use our favorite editor and make the changes in real time. If the
    files are on a remote server, we need to use FTP (or the better option, SFTP)
    to transfer our edited files. Editing code can make things difficult, like code
    coding and formatting, which is quite like a programmer''s first choice.


    # ## CREATING TABLES


    With WordPress and other PHP applications for that matter, we can create database
    tables with the MySQL console or a tool like phpMyAdmin. phpMyAdmin is installed
    with the command line automatically when MySQL is installed. If it is not installed,
    it is accessed with the mysql command. The code below shows a simple method to
    create a table called access counts.


    ```

    CREATE TABLE accounts (

    id INT AUTO_INCREMENT PRIMARY KEY,

    name VARCHAR(30) NOT NULL,

    email VARCHAR(50),

    date datetime

    );

    ```


