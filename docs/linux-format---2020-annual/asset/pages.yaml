    storage (a NAS) using software like OpenMedia.


    The frequency of backups also influences the amount of storage used. You may want
    to back up manually, or automatically based on a schedule? The correct back-up
    frequency varies based on the kind and value of data being safeguarded. Depending
    on the size of the files, it might not be a good idea to back them up every day.


