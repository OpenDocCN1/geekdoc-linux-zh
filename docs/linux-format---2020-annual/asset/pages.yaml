    # # Building an open web


    The web is slowly but moving away from its rigid censured proprietary connections.
    How can you take advantage of this?


    The World Wide Web was designed to be free and open, especially in the mid-1990s
    when its specification was free as an open standard. The Internet is made up of
    technical standards and all of this underlying infrastructure is open and developing.
    Building on this, the web browser evolved into a web editor, and encouraged consumers
    to alter the content.


    The first attempts to control the Internet were by using ordinary programming
    languages like telecom companies. An API controls how software communicates and
    interacts with other pieces of software. Web APIs enable people to build new tools
    for using a website and its services.


    A more subtle approach to alter the Internet is underway through application programming
    interfaces or APIs.


    PageKit uses a pay-what-you-want model and get you free of transfer quota for
    a month.


