  md: '# Linux Format Annual 2020


    # Brimming Fedora installation into a distributable


    Remix a Fedora installation into a distributable.


    the secret for creating Fedora-based distros is the live-cd-kickstart which is
    part of the live-tools packages. Grab it from the kickstarts folder. With dnf
    install-livecd, you can use kickstart directly from the command line.


    A script defined in a Kickstart file configures your custom Fedora-based distro.
    In simple terms, a Kickstart is a file that contains a list of options such as
    the packages to be installed. The live-cd tool creates your distro as per the
    instructions in this file. To help you get started, you can download the Kickstart
    for several Fedora spins by grabbing them with dnf install spin-kickstarts. Once
    this is installed, you''ll have a set of Kickstart files in the /usr/share/kickstarts
    directory. You can customize any of them Kickstart files by editing them.


    They are well documented and easily to comprehend; browse the Fedora wiki (http://fedoraproject.org/wiki/Anaconda/Kickstart)
    to get parameters in a kickstart file. If you want to create one from scratch,
    you will save a lot of time by grabbing the Kickstart Configurator tool with dnf
    install system-config-kickstart. This tool has an easy-to-navigate interface to
    help create a Kickstart.


    # Kick-start the process


    For our purpose we created a Meta-based Fedora remix using the live-meta-compose.kickstart.
    For this the parameters used are: %% and %Packages. You can also pull in from
    any other kickstart by its name and location with the Kickstart parameter, such
    as Fedora-community. At the top of the live-meta-compose.kickstart


    The first one calls the fedora-base-live.kickstart which describes the base-selection
    for creating a live Fedora distro. The packages are self-explanatory. Then one
    defines the default language, keyboard and timezone by security settings that
    dictate the use of standard sandbox policies. Here we use %sel for the default
    SELinux policy and while working with the smoothness of some of our modules and
    as have


    to change the set --kickstart asks the live to boot straight to a root (/) partition
    and allow the exit to enable deroot and graphical services.


    Also included in the live-meta-compose.kickstart is the fedora-base-main.kickstart
    which contains a list of packages for the Meta Desktop with our compose. The extra
    packages from our custom distro are used to include in the %Packages section.
    In addition to include packages, you can also specify groups of packages as @meta
    and @liveboot. If you want to exclude individual packages you can prefix with
    a minus (-) to their name, such as -fedora-icon-theme. These packages


    # MANUAL REMASTSTERING


    While the scripts simplify the process of converting a Linux installation into
    a live distributable, it is simple to step through the process manually. You can
    adjust any particular interest of the one that is currently running. For example,
    you can use this to create a custom Ubuntu-based distro using a Fedora installation
    method.


    genisoimage to package your distro into an ISO boot. Both tools are usually available
    in the official repositories of distros or you can download the ISO image first.
    Then extract its contents into an ISO folder. Use the squashfs command to compress
    the filesystem. Fedora-based distros like Mint use squashfs for their live image.


    After compressing the filesystem, chroot into it. Preparing Once inside the environment
    you can use the package management system to add and remove modules and any configuration
    file. Here remove any temporary files if you need to refresh the manifest, compress
    the filesystem and remake it into an ISO image.


