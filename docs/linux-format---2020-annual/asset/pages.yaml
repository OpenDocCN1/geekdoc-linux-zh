  md: '# tmux: a modern command-line-workflow


    You can teach an old new tricks, but you can have fun with terminals – it just
    takes an extra command to run.


    he casual Linux isn''t going to open your terminal very often. Things are different.
    For administrators we believe in automation, which is what graphical tools aren''t
    good at. We often access servers working remotely, where using command line saves
    us bandwidth. Moreover, it could be the only viable option on choppy GPRS connection.


    Regardless of our role, we all deserve some comfort when having to start just
    because an SSH connection dropped. A times, we certainly want to stop administering
    a server, close our laptop, and then continue where we left.


    ![](img/b82853b6232162a20e963fd53f1b434b_62_0.png)


    The GNU screen does its job well, but it''s not much to look at.


    | File | Edit | View | Bookmarks | Settings | Help |

    |---|---|---|---|---|---||

    | Name | | | | | |

    | 0 bash | | | | | |

    | 1 bash | | | | | |

    | 2 bash | | | | | |


    Starting at the screen

    The goal of that facilitates the above scenarios is often dubbed a ''terminal
    multiplexer''. What is that? To put it simply, a (pseudo) terminal multiplexer
    that runs on a server. A terminal multiplexer allows you to share several windows,
    which might have ''tabs'' enabled. Terminal multiplexers stay resident after logout,
    and you can resume where you left off.

    A classic example is GNU screen. It''s four years old and almost classic. Regarding
    its package-ready, GNU screen isn''t easy, but it does the job well. It could
    be the only way to get on a box you don''t own. So many people fail to learn how
    to use it. Without learning the bindings, as Ctrl-A-C (to move to the next window)
    and Ctrl-A-D (detach a session), GNU screen for many years has been the choice
    for everyone.

    The last name tells us – if you''ve got a ''terminal multiplexer'', then tmux
    should be in your distro''s repositories. It''s not part of GNU, yet it is much
    more modern and has some advanced features as plugins. If this sounds like a closer
    look, keep reading.


    Sessions and windows

    You create a new session with tmux. This is equivalent to tmux -s. If you want
    to give your session a name, call it tmux -s mys-session.


    Tmux helps you when you have more than one of them in parallel. Use attach (or
    tmux attach) to attach to the active session. To attach to a session instead,
    run attach -t @name. You can list all sessions that you want to attach to a specific
    unset session.


    Internally, tmux consists of a client and a server, both of processes which they
    continue. When you use tmux, you start a client and attach to one of the sessions
    hosted on the server. Servers are usually one user per (pseudo)terminal, so different
    tabs and windows in your terminal emulator (as tmux doesn''t


    # >> MAKE PROGS LAST LONG


    Keeping programs you run out of logout is the most common use-case for tmux and
    screen. These aren''t the only options for choosing, but they are.


    When you log out, the terminal closes, or more likely these, a daemon process
    continues. If it is terminal, the programs running during the session will be
    killed. By using tmux, you prevent the process to terminate. There are other ways
    to do the same: either use the disown command or If the server says you''re running
    a program, you can use the nohup. This simple tool redirects I/O output effectively
    with disown (&dis-out). Start the program and make it run in the background, and
    it will survive an interrupted session.


    With tmux, you can manage the program that you ran out for a period of time, but
    if its circumstances change? Of course you can resume it and there is a better
    way. First, use Ctrl-Z to suspend the running program and get back to the shell.
    Then type fg %N where the shell displays where you stopped the code. When a shell
    arrives: SIGUP sends it to all jobs, both running and stopped: disown -l tells
    it to join your job. run bg N to put the job in the background.'
