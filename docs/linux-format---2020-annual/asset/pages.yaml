  md: '# Ultimate open-source toolkit


    # # Audio and Video


    Edit your within an inch of your lives, and organise your music.


    # ## UMS


    This streaming server will transform your Linux desktop into the ultimate media
    streaming broadcast to other computers, smartphones, tablets, consoles and even.
    UMS streams via the Universal Plug and Play (UPnP) protocols to DLNA-compliant
    device. You''ll have to roll-out UMS although the procedure is fairly simple.


    The first time you launch it, UMS takes you through a basic three-step configuration
    wizard. You can start without anything, UMS includes advanced customizable options
    and tips to guide new users. It also includes a minimal web interface for streaming
    your content. www.universalmediaser.com


    ![](img/b82853b6232162a20e963fd53f1b434b_166_0.png)


    # ## EMBY


    This is an all-inclusive media server that comes with plenty of features. Emby
    is a one-shop for accessing and viewing all your media on any device: from computers
    and mobile phones to Android TV, Chromecast, Roku, Xbox and more. Beyond local
    folders, Emby allows you to add network shares, which is a great way to share
    your media on different computers in your network. The Emby server is a pre-packaged
    binary and website installation instructions for all popular distributors including
    Arch, Centos, Fedora and Ubuntu. You can right-click items to reveal useful options
    like downloading them, or editing them metadata. You can change stream quality
    during playback and display fullscreen. Emby also enables you to set parental
    controls, and block items with a higher rating than the maximum you''ve defined.


    ![](img/b82853b6232162a20e963fd53f1b434b_166_1.png)


    # ## MPV


    A resource-conscious video player that also looks good on modern machines. Based
    on mplayer2, MPV continues the tradition of CLI by introducing optimised and clean-coded
    options and features. It offers a minimal user interface that stays out of the
    way, enabling you to watch your videos in.


    https://mpv.io


    # ## SHCUT


    A fairly advanced video editor. Shotcut is one of the few tools that supports
    4K videos, audio and video formats with a variety of transitions and effects.
    It has a long list of features and a collection of tutorials to help you create
    your first videos.


    https://shotcut.org


    # ## CURLE


    Powered by ffmpeg library. Curdle is an easy-to-use media converter. It has the
    ability to crop and pad videos and convert only portions of files. Select one
    of the preset settings for various devices and you''ll also be able to preview
    before the conversion.


    https://curdle.sourceforge.net


    ![](img/b82853b6232162a20e963fd53f1b434b_166_2.png)


    # ## AIRSON


    Based on the now-closed project, the Airsonic streamer makes your music impressive.
    It is designed with many features and can stream files in any format to multiple
    players simultaneously.


    https://airsonic.github.io


    # TUPIPE


    A set of tools to encourage kids to create 2 animations. Tupipe has an easy-to-use
    interface with the web and a host of text and video documentation to get started.


    www.maefeestro.com


    # PICARD


    A little tool, Picard will get your music collection back into shape. The program
    can sort your music library and rename named files and identify incomplete albums.


    musicpicard.org


    # TRAVERSO DAW


    A powerful recording and editing platform. Traverso is a digital audio tool that
    can help you creating simple records and editing multi-track audio.


    traverso-daw.org


    # MIXXX


    If you need to DJ at an event, run your music library with mixxx and use scratchable
    waveform to track tempo of tracks and change pitch to create your own mix.


    www.mixxx.org


    Linux Forum Annual 2020'
