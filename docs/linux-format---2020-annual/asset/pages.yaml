    > 20:30 -> 21:30

    Gym


    For each of these commands, Calcurse examines its database and prints on the screen
    the information sought by user. To refer to the man page for a list of all commands,
    type man calcurse.


    You can similarly run the calcurse -t command to view a list of all tasks in the
    TODO list with the specified priority.


    The default output using the -a or -d commands informs you if any of the appointments
    or TODO entries have a note attached to. You must invoke Calcurse with format-string
    options to view the result.


    On Formatting Options FORMAT STRINGS, the output is available as a single page
    HTML or downloadable PDF. You can alternatively access the man page for offline
    help.


    When you want to discuss the usage of the tool, Calcurse is capable of much more.
    It stores all the data in calendar files, and can export to ical and formats.


    # CONFIGURING CALCURSE


    When you run Calcurse, it will create a ~Calcurse directory. All notes you add
    to an appointment or task are stored as the text files within the ''notes'' directory.
    The apps and the todo are plain files that respect respectively the appointments
    and TODO entries. The key files contain all the user-defined key bindings for
    using Calcurse, the name tags, the config file contain all the settings for Calcurse.


    You can change Calcurse within its graphical interface itself, by pressing C.
    The configuration options are split into six different categories: General, Sidebar,
    Color, Layout, and Font. The tool offers you to choose different layouts, which
    change the placement of the windows within the graphical interface. You can choose
    a different color scheme, and even display the notification bar. All other parameters
    are related to the general configuration. From here, you can configure Calcurse
    to autosave data by editing the general


    periodicave = 0. The value is in minutes, so if you replace 0 with 5, Calcurse
    will autosave data every five minutes.'
