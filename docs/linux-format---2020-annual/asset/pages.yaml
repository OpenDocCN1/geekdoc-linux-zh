    \ docker run -rm ubuntu uname -a\n```\n```\n\nA Sentry in the 'kernel space' is\
    \ different from the contained userspace.\n\nCodeQuery, which you can find at\
    \ https://runben2020.github.io/, implements a single binary userspace that consists\
    \ of two processes: Sentry and Gofer, which communicate via the Goctl interface.\
    \ Sentry is responsible for intercepting system calls and handling them. However,\
    \ sentries cannot trap a system call. This 'trap and emulate' paradigm works for\
    \ most hypervisors, yet they work at a lower level than a sentry. Hypervisors\
    \ relied on assisted hardware features to do this. However, a normal userspace\
    \ process can trap an application system call?\n\nActually, the answer depends\
    \ on the platform. There are two types of sentry: Place and Trace. Which is the\
    \ former and the latter? With the Place sentry, the kernel uses a mechanism trace\
    \ probe to relay info on its operation. It's a sentry call (which we need), which\
    \ attaches to the host kernel.\n\ndebugger/use some control code. Permitting pair\
    \ of processes in a system to trap and attach each other would be a security breach,\
    \ but there are other mechanisms in Linux to prevent or restrict such access.\
    \ Containerised processes that run on top of the gVisor kernel are accessible\
    \ to detection, so the Sentry for can do it.\n\nWith TRACE_ATTACH, it can read\
    \ or modify the trace's memory and registers. Trace signals or system calls to\
    \ learn all about what the attached process is doing during its life. If an event\
    \ of interest occurs, it can kill the attached process. A common idiom is to call\
    \ TRACE_PTRACE() which might wait for waitpid(trace_pid).\n\nMoreover, a continued\
    \ application still speeds to the host kernel, which compromises security. The\
