  md: "# Linux Format 2020\n\n# BENCHMARKING\n\n# Speed testing storage\n\nPop quiz\
    \ hot shot: what's the fastest system? John runs some tests and uses usgnplot\
    \ to help bring clarity to the storage table...\n\nlinux users are blessed with\
    \ a plethora of storage options beyonded by the typical installer. Reviews abound\
    \ on what's available: the latest SSD and hard drives, choices of file system,\
    \ pros and cons of encryption. But how can you compare and test your system before\
    \ picking the off-called next-gen option?\n\nIn this tutorial we will compare\
    \ several systems, from the de-facto standard either alternatives such as XFS,\
    \ NTFS and the ill-fated readers. We'll include those benchmarks with NTFS and\
    \ FAT, and also the off-called next-gen options that are Btrfs and ZFS.\n\nWe\
    \ will run some little tools to measure what the Kernel delivers: via their flexible\
    \ 1/O test, or by using usgnplot. Benchmarking produces numbers of lists so we'll\
    \ use them to produce graphs to make sense of it all.\n\nBut before we begin,\
    \ a warning of: these tools perform both read and write operations and are capable\
    \ of outperforming your best-looking devices before anything is stored on them.\n\
    \nwhere the latter reads pre-cached data without access (see man harddisk; we\
    \ introduce the page cache in the box on page 74):\n\n```\n$ sudo harddisk -t\
    \ T /dev/sdx\n```\n\nTiming disk reads: 334 MB in 1.99 seconds = 167.83 MB/sec\n\
    Timing disk writes: 358 MB in 3.00 seconds = 119.29 MB/sec\n\nYou need permission\
    \ to read from the device you're testing which match (/dev/sdx); you can either\
    \ use sudo to run as root or avoid root privileges, typically by being a member\
    \ of the disk group (our examples use sudo for simplicity).\n\nWith however, only\
    \ produce readable reports that you need to extract the important information\
    \ and format for it by using options such as usgnplot. The command-line interface\
    \ is most useful for quick tasks, so take care of its syntax if it is new to you\
    \ it will work well (we look at it in Linux Format LXF13 and LXF14).\n\n# Do do\
    \ it again!\n\nIt's fast to run a disk test to get a quick measure if you want\
    \ to experiment, to take the advantage of several measurements. We run each multiple\
    \ times.\n\nYou could use something like this script to run tests and format the\
    \ results for input to graph:\n\n```\n#!/bin/bash\nfilename=harddisk_sdx\necho\
    \ [d,c],[total,time,speed]\n{\n  for i in {1..5}; do\n    echo -n $i\n    sudo\
    \ harddisk -t -T \"$filename\" | awk '/direct/ {print}\n    /Timing buffered/\
    \ {b=$5;b=$8;b=$11}\n    /Timing DIRECTED/ {c=$4;c=$7;c=$10}\n    /Timing DIRECT\
    \ O disk/ {db=$5;db=$8;db=$11}\n  done\n  printf \"%s %s %s %s %s %s %s %s %s\\\
    n\" \"$i,$c_total,$c_dc,$c_speed,$b_total,$b_dc,$b_speed,$db_total,$db_dc,$db_speed\"\
    \n}\\ | tr ',' > output.csv\n```\n\nMost distributions include a tool harddisk\
    \ that you can use to run a quick and simple benchmark. It will give you a general\
    \ idea of how fast Linux can access different disk devices, either read buffered\
    \ disks (using -T) or cached data\n\nThe former reads from the kernel's page cache\
    \ to the disk without caching data (which) demonstrates how fast the disk can\
    \ deliver data,\n\n![](img/b82853b6232162a20e963fd53f1b434b_53_0.png)\n\nLinux\
    \ Format 2020"
