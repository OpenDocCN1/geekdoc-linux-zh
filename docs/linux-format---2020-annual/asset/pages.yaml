    pattern. By default grep will match your pattern to any part of the line.


    Originally written by Ken Thompson, grep has found once home in almost all of
    the "fixing" operations and is part of the default installation in all Linux distributions.
    Go over to the terminal and run the **man grep** command to browse its man page.


    # ### Basic usage


    The tool can be used to look up patterns in the specified file. You can also use
    grep to filter the output produced by a Linux command-tool or through pipes of
    magic.


    If the line doesn''t match, it won''t show anything. If you want to match only
    ''self'' as the keyword, grep will match not only ''self'' but also ''myself'',
    ''himself'', ''herself''. If you want to match the exact word, use grep with the
    `-w` command. The `grep -w <keyword> filename` will only output results with exact
    match.


    # ### Working with other tools


    Another use for grep is combining it with other tools and utilities that produce
    a lot of output. For instance, when you connect a USB drive or new Bluetooth,
    the dmesg command will capture all the details of the device.


