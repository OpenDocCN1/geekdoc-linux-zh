    Making substitutions is easy: if you use the operator this and bind it to a variable
    you want to modify:


    ```

    $s =~ /foo/bar/g;

    ```


    Letters are at the end of flags. This is how you tell Perl the match to be case-insensitive
    (i) or replace all occurrences (g), as we do here, the m operator supports these
    all.


    Most regular expressions use so-called ''capturing patterns'' to store parts of
    the match:


    ![](img/b82853b6232162a20e963fd53f1b434b_50_1.png)


    Retrieving these groups in the code could be difficult, but Perl might make it
    straightforward with magic variables:


    > **10: GB -- Total: $(\d+)([A-Z]+)**

    print "Your total is in $2";


    Perl regular expressions are powerful enough to handle any kind of thing. Many
    languages and tools support Perl Regular Expressions (PC), and we intend to switch
    them where available.


    We hope this introduction to Perl was easily scratches the surface. Perhaps Perl
    is not cryptic, but it''s a sophisticated language that takes time to master.
    There are numerous resources to assist you in this process; please see the book
    on for starters.


    ![](img/b82853b6232162a20e963fd53f1b434b_50_2.png)


    Flame graphs are the new frontier in performance profiling. They rely on old Perl
    techniques and raw stack traces.


