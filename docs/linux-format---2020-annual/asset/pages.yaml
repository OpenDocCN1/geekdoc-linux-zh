    # Virtual and physical adapters


    Here''s scenario. Imagine you''re using OpenVPN with a website to access your
    network without anyone knowing it exists. It is like running and walking with
    your right foot.


    Outgoing packets are encrypted with OpenSSL at the virtual network (tun0), forwarded
    via the routing table to the physical adapter (eth0), and then sent to the internet.
    Incoming packets from the physical adapter (eth0) are decrypted with OpenSSL and
    sent to local programs like Apache.


