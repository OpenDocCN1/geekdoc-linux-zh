  md: '# Linux Format Annual 2020


    # MINT 19 POWERED


    Jonni Bidwell has blended a tasty selection of Minty and knowledge, to help you
    get the most from this powerful distribution.


    Finally the wait is over. The latest version of one of the most popular Linux
    distros has landed, and it comes with a new look, new tools, and following Mint''s
    acquisition by Microsoft.


    That okay was not a lie, but it got your attentions, and your attention is what
    this release delivers. Because it''s awesome, and just to be clear. Linux Mint
    is still independently developed and tuned by donations, website advertisements
    and sponsorship.


    Mint veterans will find what they love is better than ever, and newcomers will
    find an OS that is powerful and good looking. Using the solid base of Ubuntu 18.04,
    and all the new goodness, Mint adds a layer of finesse that is at once modern


    # WHY MINT JUST WORKS


    > “Using the solid base of Ubuntu 18.04, and all the new goodness, Mint adds a
    layer of finesse…”


    and traditional. There are new versions of the Cinnamon and MATE desktops, a new
    back-up. Mint''s fresh approach to updates and plenty more besides.


    Then there are the little additions that make all the difference: a helpful welcome
    screen, Redshift (for reducing strain) and a handy USB image writer. Behind her
    release there''s the admirable commitment to the community, the same understanding
    that people don''t like to be told how to use their desktops, and the same desire
    to make a Linux


    flavour that they may be newbie or hardened, can enjoy. So take a deep breath
    and inhale all manner of Mint metaphors and spicy simples as we feast on this
    most delectable Linux distros.


    18 Linux Format Annual 2020'
