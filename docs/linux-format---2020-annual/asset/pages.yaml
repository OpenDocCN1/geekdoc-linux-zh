  md: '# Linux Format Annual 2020


    # # Get started with Arduino


    Learn the Arduino language and what this microcontroller can do.


    Occasionally we get chained readers in compliance with something other than Raspberry
    Pi content. So sharing something different (held) on your path - Ed


    Unlike the Raspberry Pi, Arduino devices aren''t potent enough to run a full-blown
    Linux distribution. For example, the Arduino Uno is powered at 16MHz and has a
    bit of flash memory and only 2KB of SRAM (which is plenty for things like sketches,
    uploaded). They do have a lot of input and output pins, so their main utility
    is for microcontrollers: taking sensor readings and switching things in response.
    More powerful Arduinos exist, but even those rely on others for heavy computation,
    networking and storage.


    You can download the Arduino IDE from https://arduino.cc, or if you''re using
    Ubuntu you can do it via Ubuntu Make, which will fetch the latest version. Setting
    up the environment is easy. You may need to add your user to the dialout group
    to communicate with the Arduino (Ubuntu Make does this for you, but you''ll still
    need to log out and log back again for this to take effect). Once you''re ready,
    you can start the editor from any browser by registering at https://create.arduino.cc/editor.


    # ## Don''t blink


    However you do it, it''s the traditional pathway and load the example. Check out
    Examples-Blink and look at the code. We will see it divided into two functions:
    first we define the Arduino. It''s hard to see such things, but by another way,
    we might need to set things like LED_BUILTIN is the LED we can use on pin 13.
    We need to be careful because we can use our own pin. Moving on to the LED voltage,
    we can see it set low then high again and again in a rapid manner. Click the Upload
    button in the toolbar and see if this is what happens.


    If you want to see values from your program on the host machine, we can do so
    over the serial connection. We need to set the serial connection by adding the
    line `Serial.begin(9600)` to the `loop()` function. This will send 9600 bits per
    second, which is also the speed of the early 90s data modems over phones. If we
    want to verify the answer about the LED being connected to pin 13, we need to
    do that using the following line:


    `Serial.println(LED_BUILTIN);` That''s one ''L'' in print(short for printLine)
    by when we come up with


    ![](img/b82853b6232162a20e963fd53f1b434b_157_0.png)


    ![](img/b82853b6232162a20e963fd53f1b434b_157_1.png)


    There are heaps of examples for you to discover in the IDE. Just head to FileExamples
    and fill your yours.


    # ## TALKING TO YOUR ARDUINO


    Sometimes it''s good to talk to the Arduino with Python, rather than having a
    Raspberry Pi in wire trying to do it. In IDE with an Arduino. We still need the
    IDE to upload sketches to the Arduino, but we can get more data from the Python
    side.


    All we need is connect the two boards with a USB cable. We communicate via serial
    USB. On the Python side we need the serial module (check installed by default)
    and the device name of our import port


    ```

    port = "/dev/ttyACM0"

    s1 = serial.Serial(port,9600)

    ```


    We can read data from the Arduino using our input s1. Python reads a single byte
    and then converts it to a string. Changes in Python 3 mean this a byte:


    ```

    s1.read(1)

    s1.write("0")

    ```


    ![](img/b82853b6232162a20e963fd53f1b434b_157_2.png)


    Even simple switches and buzzers can look tricky, but trust us what you''ve got
    used to see is.


