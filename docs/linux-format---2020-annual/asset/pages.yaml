  md: '# Linux Format 2020


    # QEMU and Libvirt


    Learn some more advanced ways and means of manipulating your VMs...


    ![](img/b82853b6232162a20e963fd53f1b434b_129_0.png)


    VirtualBox is a platform for guests with virtualisation. It has a catchy name,
    a friendly interface and it''s cross-platform. But there are also other options
    on Linux.


    Many people actively use VirtualBox because of its association with QEMU (from
    some a little corporate beth) inherited the software benefit from Sun, which started
    in 2010. QEMU is a tool that is much more aligned with standard Linux command
    line options, abstract configuration files and ignoring error messages.


    QEMU is an emulator, but with the power of KVM it becomes a powerful virtualisation
    tool.


    Elsewhere, Libvirt provides a platform for QEMU (and other) VMs. It makes the
    headache of outdefining virtual networks and storage, and all VMs to be managed
    and accessed remotely. For a more thorough explanation of these three layers,
    see virtualization Bert Garcia''s charms in LXFormat. Libvirt can be used to manage
    the QEMU virt manager, which gives access to QEMU options


    ![](img/b82853b6232162a20e963fd53f1b434b_129_1.png)


    The QEMU device, will make desktop vastly manifestly painful, although we can
    do better.


    via a clean and graphical interface. But let''s do the only way first. To install
    QEMU (as the required Libvirt bits we will use) on Ubuntu 18.04 (and derivatives)
    do the following:


    ```

    $ sudo apt apt install qemu-libvirt libvirt-daemon-system bridge-utils virtmanager

    ```


    # My first QEMU VM


    If we have to create a virtual machine, we need virtual storage. The simplest
    way is to use qemu-img:


    ```

    $ qemu-img create -f qcow2 myvm.qcow2 20G

    ```


    This will create a QCOW2 image, which doesn''t immediately occupy 20GB of disk
    space. Make sure you create it in a location that has enough space for this size,
    or your root partition might run out of space when the image grows. It''s possible
    to use sparse images too, which may offer performance benefits in some cases,
    but as you are just starting out with Linux, let''s use the simplest method available.


    # ## INTRODUCING VIR


    The Virtual Manager GUI enables us to connect to the QXL device, with the click
    of a button. It also enables us to use de-3D acceleration, which is much better
    and match (and even surpass) VirtualBox''s 3D acceleration capabilities.


    In our experience Libvirt (a widely recognized project) is much faster than QEMU
    on Cross''s OS hypervisor. Activating Libvirt can pass OpenGL directly to the
    host, adding 3D acceleration with the great speed. Activating via virt-manager
    (see option below) is surprisingly easy, but once it''s done, just tick the right
    button in the Display Space section to get the 3D acceleration back.


    Within the VM we can check if Libvirt is running by running $ dmesg | grep dmvirt
    and looking for


    ```

    libvirt-daemon: started

