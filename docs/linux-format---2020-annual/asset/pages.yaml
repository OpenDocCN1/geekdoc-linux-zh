  md: '# Maker projects


    # Taking your first steps...


    Start your projects today with keyboards and soldering.


    Just as programming begins with a Hello World, so your first project might also
    be something that appears early on. But don''t worry, these humblings are how
    you get built up. It''s also common for first attempts at soldering in a series
    of error messages, and likewise for one''s first mistakes to go away. Don''t worry.
    Syntax errors continue throughout your programming career, and even seasoned makers
    melt the wrong thing time to time. Soldering mistakes can often not be undone,
    and when they are, it''s often an unexpected component that needs to be replaced.

    A collaboration with your YouTube Kit. It has great PI projects to get you started.
    You''ll need a breadboard and a selection of jumper wires and components. Go to
    [http://bit.ly/pi-youtube-kit](http://bit.ly/pi-youtube-kit) to check out the
    tutorials and PDFs. The workshops will teach you flashing LEDs and buzzers, to
    more complex involving motors and light sensors. The first project connects all
    these making a full-blown motor controller without having to solder. It''s still
    possible to make things so, but you have to try hard. Every breadboard is connected,
    so current travels through your circuit as one navigates a grid system in a house.

    The first things you''ll make include LEDs and resistors. The resistors are there
    to protect against current going through the former and also to


    ![](img/b82853b6232162a20e963fd53f1b434b_152_0.png)


    > Even if you don''t do any of the projects, lengths of wire and breadboard in
    a tin will be useful later.


    protect against too much current from your source (for example, the Pi GPIO or
    5V pins). LEDs have a positive and negative. If you connect them the wrong way
    they probably won''t work, but if the voltage becomes too great they will melt
    and then you will blow them. The positive side of the LED is always the one with
    the longer leg, and circuits usually depict the resistor going on this side of
    the LED, although it doesn''t matter. You''ll also encounter counters, switches,
    capacitors and many lengths of jumper wire.

    The top and bottom rows of the breadboard are positive and negative, although
    there''s nothing special about them. For your first project you''ll probably not
    use the 5V pins on your Pi or Arduino, but rather use a 3.3V GPIO. You''ll finish
    your circuit at a ground point, and the connection you''ll usually connect to
    this negative row of the breadboard.


    ![](img/b82853b6232162a20e963fd53f1b434b_152_1.png)


    # HOW TO SOLDER LIKE A PRO


    ![](img/b82853b6232162a20e963fd53f1b434b_152_2.png)


    +   1 Keep clean


    +   2 Solder on


    +   3 Unsolder any errors


    Clear a neat space on a heat-proof surface. Have your soldering iron to hand.
    You can hold your items in place either with some elaborate clamp set, or with
    good old-fashioned tack and gravity. Use the right size of soldering iron for
    the job in hand. Heat up your soldering iron and when it''s hot, clean it on the
    damp sponge.


    Gently silver the tip of the soldering iron with a little solder. This will help
    solder flow off nicely. Carefully hold the solder on reel of the tin and ever
    so deftly, tap it with the soldering iron. Hold it until the solder starts to
    melt. If it doesn''t melt quickly, try cleaning and sanding again. If it feels
    faulty, check the next step.


    If you''re unhappy with your joint the solder can be removed with a desoldering
    wick. Heating up this tip of the joint will help remove the solder. Desoldering
    pins are popular for clearing bigger messes. Click these down and release the
    vacuum to lift the molten solder until it is gone.


    ![](img/b82853b6232162a20e963fd53f1b434b_152_3.png)


