  md: '# # Linux Format Annual 2020


    # # WORDPRESS PLUGINS


    # ## Build your own plugins


    **Kent Elchuk** takes you on a journey of discovery, as he reveals how to quickly
    create WordPress plugins.


    ![](img/b82853b6232162a20e963fd53f1b434b_139_0.png)


    We typically use a plugin to extend the functionality and performance of WordPress.
    In many cases, our choice also does the job. But sometimes we don''t have the
    ideal solution to meet all our needs. Such is life.


    Let''s take a look at what a plugin does and some examples, as additional code
    that can be added to a WordPress site to customise it. Some popular WordPress
    plugins are Yoast, SEO, W3 Total Cache, WP Contact Form 7 Akismet, and WooCommerce.


    To access the plugins in the WordPress admin, click Plugins from the menu on the
    left. Once a plugin is installed, you may be able to configure it.


    ![](img/b82853b6232162a20e963fd53f1b434b_139_1.png)


    # ### The directory


    A plugin will reside in the **wp-content/plugins** folder. Some plugins come with
    every new WordPress version, exist as only a single file in the root directory
    like Hello Dolly. The file wp-content/hello-dolly.php is the entire plugin. Unlike
    Hello Dolly, many others are located in an individual folder. For example, the
    WooCommerce plugin will be located in a folder named appropriately **/woocommerce/**.


    Accessing our plugins by clicking ''Plugins'' from the left hand menu Our list
    shows which are activated and which are not.


    ![](img/b82853b6232162a20e963fd53f1b434b_139_2.png)


    # ### The requirements


    Let''s open the **hello.php** file and take a look under the hood. The lines of
    text containing `<?php` tag and function `hello_dolly_get_lyrics()` will return
    the following: Plugin Name, Plugin URL and Author Info. To make it easier to read,
    we make a copy of **hello.php** and call it **our_plugin.php**. This makes it
    a little easier by changing the Plugin Name and the other lines to match our Author
    Info.


    After making those changes, we refresh the dashboard and look at our plugin list!
    Our plugin exists with a new name, description, and author version.


    # ### The execution


    When we''ve made some modifications to our plugin, let''s activate it and see
    how it works. Click the Activate link located under our plugin.


    +   QUICK TIP

    The first 12 lines or so of a WordPress plugin will give you details about this.
    Sensible naming makes it easy for users to know what they do.


    Once the plugin is activated, we refresh the admin page and look at the top right
    corner. We will see a random string from the Hello Dolly function. If we refresh
    again, we can see that we can change the random string to a display lyric from
    WordPress.


    Why did the lyric show up in this location? If we look at the code, we see: `add_action(''admin_footer'',
    ''hello_dolly'');` and `add_action(''wp_footer'', ''hello_dolly'');`


    This is what the hello_dolly function is executed and the **admin_footer** is
    the event (or action) that takes place.


    We can say in other terms, the **hello_dolly** function will run when in the specified
    location: the top right corner in our admin header.


    How can we change the lyrics in the admin footer and on each page, We can change
    the text and use the examples. But we can run all three at once, we''d most likely
    want to look at one of them.


    Now that we''ve got the code executed and the result in view, we can take a little
    closer there since there''s a sequence of events that takes place after the **add_action()**
    function is initiated. So, let''s start the **hello_dolly()** function line 52.
    Once this function runs, it runs another function called **hello_dolly_get_lyrics()'
