  md: '# Linux Format Annual 2020


    # ESCAPE

    THE CLOUD


    Join Mayank Sharma as he declares enough is, and stops seeding his data to popular
    cloud services where it''s ripe for harvesting.


    ![](img/b82853b6232162a20e963fd53f1b434b_93_0.png)


    he one true surprising part of the Information Age is the extent to which our
    personal information, has been commercialised. Edward Snowden''s warnings were
    played down as fearmongering by a privacy traitor. Recent events have shown the
    extent to which companies use data for everything from swaying our shopping habits
    to influencing democracies.

    We''re being tracked with unprecedented ease. From the ubiquitous cookies to use-it
    social buttons, there''s an unending array of the garb of convenience, to the
    many online services we use everyday on our laptops and smartphones. The tools
    beneath us create an unending array of data accumulating that technology follows
    us all over the web. Thanks to an arsenal of such tools, like Facebook and Twitter
    know a great deal about us even when we''re not using them. The widespread implementation
    and use of federated identity systems have essentially turned our usernames into
    trackers.


    However, it''s not all doom and gloom. The dungeon geeks that helped free us from
    the clubs of proprietary empires are banding together once, again to rescue us
    from the blue pill cloud of convenience. From hosting services that leverage your
    personal data to hosting your own cloud, there are plenty of options that enable
    you to experience the benefits of popular online services and also preserve your
    identity.

    In this feature we''ll look at some of the technologies and standards that are
    reshaping the digital topology in the cloud and beyond. We introduce inflatable
    services that are built around these standards and extend you the benefits of
    mainstream service while grabbing at your freedom. With a little bit of effort,
    true-blazing fashion, you can also host your own cloud sharing services and in
    the process help you technically challenged friends and family escape the ever-reaching
    hoarding empires.


    94 Linux Format Annual 2020'
