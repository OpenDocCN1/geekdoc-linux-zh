    # # Arch-itect your castle


    Base your custom on the popular Linux distribution.


    While both bootobuilder and livect-creator enable you to create a custom spin
    with a fair amount of time, if you have the patience to hand-craft an installation
    from Linux Mint, Arch offers a more comprehensive approach. Arch is an ideal platform
    for cultivating a custom distro without the code bloat and payoff problems that
    affect many others ones. Archiso is a collection of scripts that you can use to
    convert any Linux distribution into a distributable. Unlike the distro it works
    on, Archiso has a steep learning curve, but gives you a lot of control over the
    final result.


    The first thing you need before you use Archiso is an Arch Linux installation.
    If you''re new to Arch, the process is well documented on the project''s page
    (https://wiki.archlinux.org/). Another option is to use an installation of Arch-based
    distribution like Antiguer, ArchLinux, Chakra or in Manjaro. From some of these
    distros, manjaro have their own fork of the Arch script.


    ![](img/b82853b6232162a20e963fd53f1b434b_15_0.png)


    You can use archiso-refline to create a custom distro that uses locally hosted
    packages instead of fetching them online.


    In any case, once you''ve installed Arch on your computer, the next step is to
    customise it to your liking. That includes installing packages, swapping out the
    default themes and artwork of your desktop environment and other configurations
    of the systems as you see fit. You will need to copy these configurations from
    the installation of Arch to the custom we''re building. When you''re done customizing
    the Archiso, you can install the ISO and all its dependencies.


    ```

    # pacman -S make some-tools foish liblinux-dbus is how you get it done

    ```


    Now you''ll need the files for our custom distro in ~/archiso. Make sure you have
    enough disk space to accommodate all the packages you want to install, as Arch
    will create two copies of the custom distro on the custom distro with pre own
    profiles.


    The baseline profile is useful for creating a basic system with minimal packages.
    However, we''ll use the extra profile which enables us to create a custom Arch
    Linux distro with preinstalled packages. To use these, copy some script file to
    the ~/archiso/share/arch/reconfig/ -~/archive


