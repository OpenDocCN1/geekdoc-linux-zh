  md: "# Administeria TUTORIAL\n\n# # gVisor: Dive into Linux internals\n\nUniversal\
    \ packages are only part of the story. Discover how turning kernel sandboxes reveals\
    \ a new way to learn the Linux kernel's guts.\n\nWhen I was a Linux newbie, the\
    \ kernel seemed the most mysterious part of it all. Years later, thousands of\
    \ lines of code later, it looks like a sophisticated, thoroughly engineered program.\
    \ There's no magic, except in Arthur Clarke sense, in what the kernel does; however,\
    \ gaining this understanding was quick or easy, at least in my mind. Would it\
    \ be to have something that does the same thing as the Linux kernel, but in a\
    \ way that's more accessible? Sure, some Unix kernels are accessible for studying,\
    \ but if I'm looking for something that's simple enough to start with—like, I\
    \ have one. And it comes from the area which is far enough from the kernel development.\n\
    \n# ## Why containers?\n\nContainers help us develop, package and deploy apps\
    \ safely and securely, but they aren't enough to run many applications. Simply\
    \ Docker and friends help you build tailored environments and protect from occasional\
    \ mistakes in the code, such as exposed network ports. However, all containers\
    \ share a single kernel which compromise the whole system. You don't need a bug\
    \ in the kernel for that. If I were writing these words, a CVE-2018-10922 was\
    \ published explaining that Docker has a security vulnerability in /proc which\
    \ allows any container to escape its host container. A malicious program could\
    \ turn off bitfilter or clipboard keyboard mapping. As said as Meltdown or Spectre,\
    \ but hopefully, this is where gVisor comes in.\n\nOne option to fix this is to\
    \ specify syscalls and allow the application to make. In a nutshell, this is Seccomp\
    \ and AppArmor. But writing them from scratch is not practical and prone to error,\
    \ as any error becomes a security risk.\n\ngVisor approach the problem different\
    \ angle. It's a kernel, written in Go. It runs in an userspace and acts as a container\
    \ for contained applications. It interacts with the host kernel not directly,\
    \ but with a safe surface over other Linux interfaces.\n\nFrankly speaking, promises\
    \ which gVisor makes are to be evaluated, because the project is relatively new.\
    \ But what we're interested in today, is how simple it is to use it. It uses go\
    \ and no 'fanciful' sandbox C. Moreover, it uses userspace-to-kernel interface\
    \ which is conceptually similar to what virtual machines like KVM or Xen or Java\
    \ or Python interpreter do, yet it's relatively small because it can call a real\
    \ kernel to do grunt work such as PCI devices. In this Administeria, we will peek\
    \ into gVisor to learn insights on Linux operations.\n\n![](img/b82853b6232162a20e963fd53f1b434b_58_0.png)\n\
    \ngVisor is available at https://github.com/google/gvisor. The build process is\
    \ based on https://basel.build which could be an issue if it breaks some Go Conventions.\
    \ As a single Open Container Initiative (OCI) compatible runtime, runsc, is produced.\
    \ You can run gVisor inside a Docker instance and just try it. README.md has all\
    \ details. However, if you don't need to build gVisor, this tutorial only need\
    \ you to navigate around the it. If you find gVisor difficult, try Basel Trystrace\
    \ (https://github.com/aspace/trystrace) and/or\n\n# ## INTRODUCING SCRIPT\n\n\
    It's 2005. Many computers are connected to the kernel all over the world, and\
    \ of them hundreds. Why not donate or share their spare CPU cores? This means\
    \ running a third-party code over our process machines, which is a great security\
    \ risk. \n\nThe idea behind the CPUshare Project (https://tacoday.org/wiki/CPUshare),\
    \ is an cloud compute server. Computing, is what we need. But security mechanism,\
    \ or instead, established restricted with five syscalls: read(2), write(2), and\
    \ exit(2).\n\nIf so was a great success, yet gVisor remains part of the Linux\
    \ kernel since version 2.6.12 later. Go saw its support to browser-plugins. For\
    \ that, syscalls tried for this type of software, and more. Like seccomp, a syscall\
    \ filter, and e BPF programs. If you don't need a party normal, an error, or even\
    \ killing the process abruptly with SIG_SYSCALL.\n\ngVisor is a cool Linux technology\
    \ but if you're using it without being aware. Comes with Firefox and Chrome, as\
    \ well as OpenSSH and vdd. Docker applies a default security profile and enables\
    \ you to run it with JSON. JSON is supported in Flatpak and Snap, and Android\
    \ has used it since 0.8.\n\nLinux Format Annual 2020 / 59"
