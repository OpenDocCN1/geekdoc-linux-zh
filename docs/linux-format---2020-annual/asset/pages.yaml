  md: '# Linux Format Annual 2020


    # SYNCHTHING-ENCFFS


    # Get hold of encrypted

    cloud storage for free


    Brian Mork takes us to set up a free cloud backup service - installing and configuring
    the software, and setting up backup procedures, security and usability options.


    Cloud file storage is a popular option. Commercial solutions often lack privacy,
    security, control over data, and often require a subscription purchase. If not
    possible, part one (see LXF238) described an architecture to set up your own cloud
    service, encrypted both in transit and when data''s at rest.


    > OUR EXPERT

    Brian Mork has used Linux for 23 years, and now he is having too much data.


    This article covers installing and operating the free cloud service in three parts:
    setting up the encryption service, synchronisation, and operating the tools.


    # Set up EnCFS


    When EnCFS encrypt files, it keeps the same directory time stamps and sizes. This
    could enable someone to guess at what the files are. If someone wants to get multiple
    copies of a file after some small edits or a file known, it''s easier to pick
    an example. A key could then easily replace your data with an older version if
    you know, but this is stopped by one-way sync to the offset files and synchronising''s
    purpose of reconciling differences.


    However, trying to synchronise files when metadata isn''t available. For example,
    consider a VeracCrypt volume, which obscures the


    > QUICK TIP

    If you don''t want to type a password to re-start EnCFS, and are willing to store
    password on the computer, try the option - export encfsw.txt; where encfsw.txt
    stores your password.


    ![](img/b82853b6232162a20e963fd53f1b434b_85_0.png)


    Midnight Commander shows files transferred to the bridge commander. On the left,
    equivalent files are ready to sync off.


    metadata. When one file is changed, it''s not possible to reach into and change
    one file. Instead, the entire volume must be synchronised as one local unit, or
    a file requires requiring the entire volume. These limits of EnCFS are mitigated
    using other methods.


    On the bridge commander, install EnCFS using the standard-apt commands. At the
    time of writing, version 2.7 was available. The first two commands are optional,
    but will help you update your sets and carry out upgrades first:


    +   sudo apt-get update

    sudo apt-get upgrade

    sudo apt-get install encffs


    ![](img/b82853b6232162a20e963fd53f1b434b_85_1.png)


    Here''s the architecture to aggregate, encrypt, backup, and sync sites. First
    EnCFS is installed, then synchronising is overlaid!


    Linux Format Annual 2020'
