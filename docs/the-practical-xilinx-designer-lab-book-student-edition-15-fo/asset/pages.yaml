- pgno: 225
  md: 'things worse for us. So we assume the clock skew reduces the time we have to
    set up our inputs (negative clock skew) and that the skew also increases the time
    we need to hold the inputs steady (positive clock skew). The major effect of clock
    skew is that it forces us to increase $T_{cycle}$ and reduces the maximum clock
    frequency for our design.


    Clock skew in FPLDs arises mainly from routing delays as the clock signal passes
    through the various switching circuits. For this reason, FPLDs include global
    clock lines that reach all the flip-flops without going through the general-purpose
    routing switches. Clock edges on the global lines have very low skew. The XC95108
    CPLD has three global clock inputs, and the XC4005XL has eight (four global clock
    inputs with minimum skew and four secondary global clock inputs with slightly
    more skew).


    You can also introduce clock skew by choices you make in your design. For example,
    you might need a counter that only counts at certain times. You could build it
    using a standard counter whose clock is turned off when the counter is disabled
    (Figure 7.9a), or you could continually clock the counter but only allow it to
    load the incremented value when it is enabled (Figure 7.9b). The first option
    adds more skew to your design because the clock to this counter is delayed by
    having to pass through the AND gate. The second option does not add clock skew
    but does require more logic to build the multiplexer into the counter. The second
    option is the safest from a reliability standpoint. The first option is useful
    if you are running out of gates in your FPLD, the design does not have to run
    too fast, and you are willing to exhaustively check all the potential timing violations.


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_225_0.png)


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_225_1.png)


    # **Figure 7.9**  Skew-inducing and no-skew methods for building a counter with
    enable.'
