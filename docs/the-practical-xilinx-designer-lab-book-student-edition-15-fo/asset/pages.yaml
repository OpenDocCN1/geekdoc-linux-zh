  md: '# Figure 10.13 The DWARF instruction decoder module.


    The instruction decoder starts with the list of inputs (lines 6–12, lines 10–16),
    state storage flip-flops (line 14, line 51), and control outputs (lines 16–43,
    lines 17–44) for the instruction decoder. These are followed by various definitions
    including the encodings for the DWARF’s opcodes (lines 45–79, lines 54–89).


    There are seven states that the instruction decoder state machine can be in (lines
    49–51, lines 54–60). Two of these states (R0 and R1) are occupied only when DWARF
    is initializing after being reset. Four of the states (T0, T1, T2, and T3) are
    entered as instructions are executed. The interrupt pin is also checked during
    state T0 and the state machine transfers to state I1 to set up for executing an
    interrupt service routine if an interrupt is pending.


    The description of how the instruction decoder transitions between states and
    sets values on the control lines for the rest of the DWARF circuitry follows (lines
    86–296, lines 93–312). When a reset occurs, DWARF enters state R0 by clearing
    the state flip-flops to 000 which is the code for state R0 (line 84, lines 95–96).
    After a reset, the program counter is cleared to zero. In state R0 (lines 88–90,
    lines 134–136), the PC is incremented once and the state machine moves to state
    R1. In state R1 (lines 92–94, lines 137–139), the PC is incre-'
