- pgno: 416
  md: '![](img/5124daf79d2807d81e49f49c22f1f8c1_416_0.png)


    **Figure A.3** XS40 Lite Board XC4005XL FPGA bus connections.


    # Parallel Port Interface


    The XS40 Lite interface to the PC parallel port is shown in Figure A.4. A female
    DB25 connector (J1) accepts the 25-wire cable from the parallel port.


    Pins 1, 14, and 17 of J1 are used to download bitstreams into the XC4005XL FPGA.
    A low-going pulse on pin 1 of J1 is transmitted to the /PROGRAM input of the XC4005XL
    (pin 55). This clears the FPGA and prepares it to accept a new circuit configuration.
    The bitstream data enters through pin 17 of J1 and appears on the DIN input of
    the FPGA (pin 71). The data is loaded into the FPGA whenever a rising edge appears
    on the CCLK input of the XC4005XL (pin 73). CCLK is driven by pin 14 of J1 through
    a 74LS14 Schmitt-trigger inverter. The 74LS14 provides hysteresis which cleans
    up the clock edges that are degraded by the trip through the parallel port cable.
    The XSLOAD program accounts for the signal inversion introduced by the 74LS14.


    (When making these connections, don’t forget to connect pins 7 and 14 of the 74LS14
    chip to ground and 5V, respectively.)'
  merge: -1
  img_proc: true
- pgno: 417
  md: 'Pin 16 of J1 is connected to the TMS input (pin 17) of the XC4005XL’s JTAG
    port. Pins 14 and 17 of J1 also connect to the TCK and TDI inputs of the JTAG
    port, since TCK is connected to CCLK and TDI is connected to DIN (as described
    in the previous subsection). These pins are used to download data into the 32
    KByte RAM.


    Pins 2-9 of J1 are used to apply test signals to the FPGA once a new circuit has
    been downloaded. The signals applied through pins 2-9 and J1-4 are for use as
    clock signals for sequential circuitry since they pass through Schmitt-trigger
    inverters. (The XSPORT program accounts for these inverters.) The other signals
    can serve as level inputs, but they should not be used as clocks.


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_417_0.png)


