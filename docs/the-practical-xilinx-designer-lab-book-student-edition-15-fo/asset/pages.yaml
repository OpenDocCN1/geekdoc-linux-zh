  md: '![](img/5124daf79d2807d81e49f49c22f1f8c1_271_0.png)


    in binary) onto the address bus. This activates memory location 5 and causes it
    to write the number on the input bus into its 4 bits of storage. An identical
    write operation occurs in Figure 8.2b, except that the address and data are changed
    to 2 and 8, respectively. Thus, the number 8 is now stored in location 2.


    The stored numbers can be read out of the memory by placing an address on the
    address bus. In Figure 8.2c, the memory location at address 5 is activated, which
    causes it to output the number it stores onto the output bus. Thus, the previously
    written value of 13 is read out on the output bus.


    Notice that you can read or write any memory location merely by specifying its
    address. This lets you access any randomly selected memory location whenever you
    want. That is why this type of memory is called random access memory or RAM.


    Once you understand the basic functions of a RAM, you can begin to consider how
    to build one. The first thing you might build would be the circuitry for selecting
    which memory location is read or written. This is called the address decoder and
    is shown in Figure 8.3. The address decoder for our example accepts five inputs:


    +   - Three address inputs (A0, A1 and A2) to specify the register address

    +   - A Write input, which indicates that the number on the input bus should be
    written into the addressed memory location

    +   - A Read input, which indicates the addressed memory location should output
    its stored data onto the output bus.


    The address decoder has two outputs to every memory location (for a total of 16
    outputs in this example). One output instructs the memory location to output'
  merge: -1
  img_proc: true
