  md: '# Test Vectors


    Test vectors are also included at the end of this design. These test vectors show
    the expected values of the output for each rising clock signal, and are extremely
    useful for verifying the design. Test vectors are also included in the JEDEC programming
    file which can be used in the XC9500 family to perform an INTEST operation through
    the JTAG port.


    # Dot Extensions


    Dot extensions, illustrated in Figure B.3, give more control over the implementation
    of the design. Dot extensions such as .AP or .AR are used to specify asynchronous
    preset and asynchronous reset for flip-flops. Other common dot extensions are
    .OE used to specify the output enable, and .PIN used with bi-directional signals.
    For a complete set of supported dot extensions, please refer to the documentation
    for the particular version of ABEL being used.


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_440_0.png)


    Figure B.3 Directly Supported ABEL Dot Extensions


    # Logical Operators


    Logical operators allow the user to manipulate signals logically and can be applied
    to both signals and sets. When applied to sets, they are applied bitwise, and
    the sets must be the same size.


    The operators are shown in Table B.1.


    # Arithmetic Operators


    Arithmetic and relational operators can be used on sets to quickly generate adders,
    counters, and comparators. Large arithmetic functions, such as adders and magnitude
    comparators, will generate very wide equations to implement the carry look ahead
    signals. In order to control the width of these lookahead carry equations, the
    compiler directive, @carry, can be used. For example, @carry 4, would limit the
    carry chain to 4-bits. An 8-bit adder therefore, would'
