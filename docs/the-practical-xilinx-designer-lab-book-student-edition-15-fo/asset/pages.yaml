- pgno: 219
  md: 'ally simple: Just use the binary value of the counter as the state. For other
    designs, the binary patterns can be more arbitrary. For the laser printer example,
    you might use the following state assignment:


    | State | Binary Pattern |

    | --- | --- |

    | Initialization | 000 |

    | Diagnostics | 001 |

    | Toner-transfer warming | 010 |

    | Idle | 011 |

    | Data transfer to buffer | 100 |

    | Paper feed activation | 101 |

    | Write electrostatic pattern | 110 |


    If you have N total states, you will need at least n flip-flops such that 2^n
    ≥ N. For the printer example, N = 7 so n ≥ 3. If we choose n = 3, then we are
    using a minimal encoding for the states because it uses the smallest possible
    number of flip-flops.


    Once you have the states defined, you have to determine how your machine will
    move from state to state as the inputs change. You also need to specify what the
    values on the outputs will be at each state. You can do this with "bubble diagrams,"
    as shown in Figure 7.6, but that soon becomes unmanageable when the number of
    states and possible transitions gets large.


    As an alternative, you can use state transition tables like the one in Table 7.1.
    State transition tables list all the possible states in the leftmost column and
    all possible combinations of inputs across the top. The entry at row i and column
    j within the table lists the next state and the output that will be generated
    given that the current state is i and the current input pattern is j. For example,
    when the counter is in state 1 and the reset is not active (reset = 0) and the
    counter is incrementing (up = 1), then the current output is 01 and the next state
    is state 2.


    The advantage of the state transition table is that it forces you to account for
    the actions of your state machine for each combination of current state and input
    pattern. Empty locations in the table immediately make it apparent that there
    is something you have forgotten to specify. The problem is that the table gets
    large, especially when the number of inputs increases. Still, it''s a reasonable
    method for the problems we will handle here.


    With a completed state transition table in hand, we can proceed to make a truth
    table that describes how the inputs and current state affect the outputs and next
    state. The truth table will have a row for each entry in the state transition
    table. The inputs for each row of the truth table are the current state and'
