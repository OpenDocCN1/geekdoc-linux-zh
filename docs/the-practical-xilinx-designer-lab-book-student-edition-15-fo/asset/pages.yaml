    # Power Supply


    The XS40 Lite draws its power from a wall-mounted, center-positive, 300 mA, 9V
    DC transformer. As shown in Figure A.2, an LM317 programmable regulator converts
    the 9V to the 3.3V needed by the XC4005XL FPGA. (Actually, the voltage divider
    formed by the 470Ω and 750Ω resistors sets the output voltage to 3.24V, which
    is within the tolerance of the FPGA.) The 5V required by the rest of the XS40
    Lite circuitry is supplied by the 7805 linear regulator. Tantalum capacitors on
    the outputs of both regulators remove most of the voltage ripples.


    # XC4005XL FPGA


    The XC4005XL FPGA is the heart of the prototyping board. It is contained in an
    84-pin PLCC package. PLCCs don''t plug directly into solderless breadboards, so
    you have to use a PLCC prototyping adapter with a socket for the XC4005XL. The
    adapter provides 84 pins that plug into the breadboard.


    Once the XC4005XL is plugged into the breadboard through the adapter, you will
    have access to all the pins of the FPGA. The first thing you should do is connect
    the VCC and GND pins of the FPGA to the 3.3V supply and the system ground. Make
    sure you do not have power applied while you do this! The VCC and GND pins are
    listed in Table A.2.'
