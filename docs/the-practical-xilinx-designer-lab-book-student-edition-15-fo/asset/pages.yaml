  md: '5. Connect the +5 V and GND pins of each chip to the power and ground bus bars
    on the breadboard.


    6. Select a connection on your schematic and identify the beginning and ending
    pins on the chips. Then place a piece of 22 to 26 gauge hookup wire between the
    corresponding pins of the chips on your breadboard. One end of the wire should
    be plugged into one of the four remaining holes in the row containing the beginning
    pin. The other end should be plugged into the row holding the ending pin. (Remember
    to strip the insulation off the ends of the wire before inserting them.) It usually
    is best to make the short connections first and then add the longer wires later.
    Highlight each connection on your schematic as you go so you do not forget and
    make the same connection again at a later time. And keep the wiring neat and close
    to the breadboard. There is nothing worse than accidentally snagging a long wire
    and pulling it from the breadboard and then not being able to tell where it should
    be reinserted. Remember: Short connections first, keep it neat, and highlight
    what you connect.


    # Debugging the Circuit


    Once the circuit is built, the debugging begins. This involves placing a pattern
    of logic ones and zeros on the inputs and observing the output with a logic probe.
    In Figure 1.15, the input vector used to do the simulation in Figure 1.12 has
    been placed on the inputs of the circuit by attaching the Hooterville and Siler
    City inputs to +5 V while connecting the Mt. Pilot and Mayberry inputs to ground.
    The logic probe is touched to pin 10 of the 74LS02, which is the Hwy3 output from
    the C NOR gate. This pin should have a high voltage corresponding to a logic 1,
    but the probe senses a low voltage, or logic 0, instead.


    Obviously, there is some error in the circuit. Therefore, we have to trace backward
    from the output to find the error. We first check the inputs to the C NOR gate.
    Probing the input that is driven by the A NAND gate (pin 8 of the 74LS02) shows
    a logic 0 that is correct according to the previous simulation (Figure 1.16).
    Probing the other input of the C NOR gate that is driven by the D NOR gate shows
    a logic 1 instead of the correct logic 0 level (Figure 1.17). Therefore, we trace
    back and directly probe the output of the D NOR gate and observe that it truly
    is high (Figure 1.18). Continuing our trace to the input of the D NOR gate that
    is driven by the B NOR gate, we find a logic 0 when it should be a logic 1 (Figure
    1.19). Directly probing the output of the B NOR gate shows that it is low instead
    of high (Figure 1.20). As we begin to probe the inputs of the B NOR gate, we can
    see an obvious mistake—the wire connecting the output of inverter A to the input
    of the B NOR gate is missing. Leaving an input of a TTL gate unconnected allows
    it to float to a logic 1 level. This would cause the output of the B NOR gate
    to go low, which ripples through the rest of the circuit to give an incorrect
    result.'
