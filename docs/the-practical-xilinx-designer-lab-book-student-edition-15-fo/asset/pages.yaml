    # Using Property Statements


    Although ABEL was initially developed for PLDs, there are still device-specific
    features that ABEL does not support directly. Instead, ABEL provides a property
    statement allowing device specific commands to be passed to the fitter software.
    Property statements must be placed in the declarations section. These property
    statements allow the user to control the following:


    +   - Slew rates

    +   - Logic optimizations

    +   - Logic placement

    +   - Power settings

    +   - Preload values


