  md: '![](img/5124daf79d2807d81e49f49c22f1f8c1_387_0.png)


    # Figure 10.11 DWARF''s interrupt-handling circuitry.


    The interrupt flip-flops are cleared when the CLR INTRPT and CLR IFLAG are high.
    The CLR_INTRPT signal is asserted to clear the INTRPT flag when the interrupt
    routine is entered. This minimizes the amount of time that passes before the circuitry
    can detect another interrupt. The CLR_IFLAG signal, however, is asserted as the
    processor is leaving the ISR. The RESET signal also clears the INTRPT and IFLAG
    flip-flops so that DWARF does not erroneously begin processing an interrupt when
    it first starts up.


    Figure 10.11 also shows how the clock and reset signals enter DWARF. Both the
    IN_RESET and IN_CLOCK inputs enter through normal IBUFs. But the IN_CLOCK input
    then passes through a primary global buffer (symbol BUFG P). The use of such a
    buffer allows the clock signal to travel over a global net that does not suffer
    from the delays incurred by signals that travel through the routing switches.
    Thus, the CLOCK signal has very low skew and clock edges will reach all the flip-flops
    at nearly the same instant.


