- pgno: 34
  md: '# Programmable Logic

    Design Techniques


    # Objectives


    +   - Discuss the advantages of designing with programmable logic.

    +   - Discuss the evolution of programmable logic.

    +   - Introduce the use of the XILINX Foundation Series 1.5 Software tools for
    programmable logic design.


    # Discussion


    # The Advantages of Computer-aided Design and

    Programmable Logic


    You can build digital circuits of up to several hundred gates using SSI and medium-scale
    integration (MSI) ICs. As you saw in the last chapter, these ICs are typically
    plugged into a breadboard and connections are made between them using 22- or 24-gauge
    hookup wire. Then switches and LEDs are connected to the inputs and outputs, respectively,
    and the circuit is exercised to see if it operates correctly. As you have probably
    already realized, there are a lot of things wrong with this method of building
    circuits:


    +   - Cutting and stripping wires to make connections between ICs is time consuming.

    +   - Wires are often plugged into the wrong place, so a lengthy check must be
    made to find the error in order to make the circuit work.

    +   - With a limited budget, you may not have every type of TTL IC immediately
    available to you.

    +   - Once your circuit works, you have to tear it apart to make room for the
    next design. Using a previously built circuit as a part of your current design
    is difficult to do.


    In addition to the problems involved in physically building the circuit, you are
    also forced to use primitive tools when designing the circuit. For combinatorial
    circuits, you begin with a truth table and derive an efficient logic circuit from'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'it by inspection or by formal logic minimization techniques. For sequential
    circuits that contain internal state information, you have to perform the additional
    steps of creating a state transition table and doing a state assignment (you will
    see this in Chapter 7). There is a good chance of making an error when doing all
    these steps manually. A manual simulation of the operation of the circuit is usually
    incomplete, so you will find additional (possibly serious) errors when the circuit
    is finally built and it fails to work correctly.


    Practicing engineers use a completely different procedure when designing and building
    circuits. They may still begin by describing the truth table or state transition
    diagram for a logic circuit. But then the details of the logic circuit needed
    to realize the truth table are worked out by a logic-synthesis program. The operation
    of this logic circuit is checked using a simulation program. If the circuit simulates
    correctly, the gates and wires are mapped into a field programmable gate array
    (FPGA) or complex programmable logic device (CPLD) IC using specialized place&route
    or fitter programs. (We will combine FPGAs and CPLDs under the generic term field
    programmable logic device, or FPLD.) The FPLD contains logic gates and the means
    for interconnecting them within a single integrated circuit. The software programs
    determine how the gates in the device can be connected to build the logic circuit.
    The program''s output is a bitstream configuration file that is downloaded into
    the FPLD to make it act like the logic circuit. The programmed FPLD can then be
    placed into a larger circuit where it will perform its functions (after some debugging,
    possibly). Note that the routine, mechanical chores of Figure 2.1 have been automated
    and are done for engineers by computer-aided design (CAD) programs and FPLDs.


    Inexpensive computers and software now let the rest of us make use of computer-aided
    design programs and FPLDs to remove the drudgery from building digital circuits.
    This allows us to concentrate more fully on the creative parts of logic design.
    You can write logic programs in a hardware description language (HDL) using a
    text editor, or draw your circuit using a schematic editor. The HDL or schematic
    is compiled by CAD programs to create detailed logic circuits that perform the
    actions specified in your programs. A program on the PC simulates the circuit
    to make sure it operates correctly. Then the design is downloaded through the
    parallel port of the PC into an FPLD, where it can be debugged.


    In summary, using CAD programs and FPLDs allows you to:


    +   - Build designs faster because manual wiring is minimized.

    +   - Avoid mistakes caused by errors in wiring.

    +   - Save your designs for as long as you like in electronic files and recall
    them whenever you want.

    +   - Experiment with many types of chips without having to stock them in your
    supply cabinet.'
  merge: -1
  img_proc: true
- pgno: 36
