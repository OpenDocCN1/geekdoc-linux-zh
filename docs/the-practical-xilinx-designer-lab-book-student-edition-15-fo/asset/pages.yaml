    +   3. Assign a value for each state.

    +   4. Define the state machine clock signals with equations.

    +   5. Define the state transitions using the name defined in step 2.


    Declaring state bits, and defining how each state is represented by those state
    bits is done by using the sets and constant declarations presented earlier. After
    defining the state bits and states, an equations section is needed to specify'
