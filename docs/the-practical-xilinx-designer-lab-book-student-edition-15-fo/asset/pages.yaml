- pgno: 233
  md: 'the 25¢ state, either the Swill or Krunk input will cause the machine to dispense
    a can of the selected drink and the state machine will return to the 0¢ state
    because the money has been exchanged for the soft-drink. At any point, the buyer
    can activate the coin-return to retrieve any money that has been put in. For instance,
    if the state machine is in the 20¢ state and the coin-return input is activated,
    the state machine will give back a dime and move into the 10¢ state. If the buyer
    activates the coin-return button again, the state machine will give back another
    dime and move into the 0¢ state, after which the coin-return input will have no
    more effect.


    Note that in Table 7.3 only one input is active at any time. For example, we assume
    the buyer never presses the buttons for both Swill and Krunk simultaneously. We
    also had to add a new input condition called Nothing to indicate when there are
    no inputs currently at high logic levels. In the state table, the state machine
    always stays in its current state whenever Nothing happens.


    Now we can assign bit patterns to each state. In this case, we will use the one-hot
    encoding shown in Table 7.4.


    # Table 7.4 One-hot state encoding for the drink dispenser controller.


    | State | Q5 | Q4 | Q3 | Q2 | Q1 | Q0 |

    |---|---|---|---|---|---|---|

    | 0¢ | 0 | 0 | 0 | 0 | 0 | 1 |

    | 5¢ | 0 | 0 | 0 | 0 | 1 | 0 |

    | 10¢ | 0 | 0 | 0 | 1 | 0 | 0 |

    | 15¢ | 0 | 0 | 1 | 0 | 0 | 0 |

    | 20¢ | 0 | 1 | 0 | 0 | 0 | 0 |

    | 25¢ | 1 | 0 | 0 | 0 | 0 | 0 |


    Once you have the state encoding, you can write down the truth-table for the combinational
    logic that determines the next state and the output values given the current state
    and the input values. Do the following steps for each row of the state transition
    table in Table 7.3:


    +   1. Find the encoding of the current state given in column 1 of the current
    row. In our example, the current state in the first row is 0¢ which has an encoding
    of 000001. Then, do the following steps for the remaining columns in the row:

    +   2. For each of the remaining columns in the row, find the encoding for the
    action taken by the buyer as indicated by the label at the top of each column.
    For the second column, for example, the buyer is putting in a nickel. The encodings
    for possible inputs are shown in Table 7.5.'
