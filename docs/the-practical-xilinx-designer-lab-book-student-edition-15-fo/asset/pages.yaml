    # .prld


    The .prld property controls the initial state of the registers at power up. Note
    that because this property is only passed on and used by the fitter, and is not
    used by ABEL, the preload value will not be reflected in test vectors. The default
    preload value is 0 for all XC9500 registers. Therefore, only registers that require
    a value of 1 need to be specified.


    For example:


    ```

    xpld property ''equation x1.prld = VCC'';

    "preload register x1 to a 1"

    ```


