    ![](img/5124daf79d2807d81e49f49c22f1f8c1_215_1.png)


    # Figure 7.2 A state machine with external inputs.


    tional logic with the current state to determine the next state. An example of
    this type of state machine is a loadable counter. Such a counter allows you to
    force a value into the counter so that the counting will proceed from this value.
    The external inputs let you pass in a new counter value and a load signal that
    indicates when the new value should be loaded.


    The current state of the state machine can be used directly as an output (the
    counter value, for example). But often you would like to process the current'
