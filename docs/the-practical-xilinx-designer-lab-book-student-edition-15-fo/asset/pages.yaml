- pgno: 190
  md: '# Experimental


    # An S-R Flip-Flop


    We will start by building a simple S-R flip-flop. Listing 6.1 shows the ABEL code
    for this. Lines 11 and 12 describe the connections for a pair of cross-coupled
    NAND gates. Listing 6.2 shows the same S-R flip-flop written in VHDL with the
    cross-coupled NAND gates on lines 18 and 19.


    (Note that I will use names ending with a B to denote signals which are active
    when they are at logic 0. So /S is named SB when it appears in an ABEL or VHDL
    file. This is just my personal convention, so you do not have to do it this way.)


    # Listing 6.1 ABEL code for a simple SR flip-flop.


    ```

    001- MODULE SRFF1

    002- TITLE ''simple SR flip-flop''

    003-

    004- DECLARATIONS

    005- SBPIN;             "/S input

    006- RBPIN;             "/R input

    007- Q PIN ISTYPE ''COM'';  "Q output

    008- QBPIN ISTYPE ''COM'';  "/Q output

    009-

    010- EQUATIONS

    011- Q = !(SB & QB);

    012- QB = !(RB & Q);

    013- END SRFF1

    ```


    After synthesizing the netlist for this design, we can perform a simulation to
    check its operation. For this example, we will use the Stimulator Selection window
    to attach the SB and RB inputs to the keys of our keyboard. Just highlight the
    name of the SB input in the Waveform Viewer window and then click the mouse on
    the Q keyboard symbol in the Stimulator Selection window. This will bind the input
    to the that keyboard key. Repeat this operation to bind the RB input to the W
    key. Then close the Stimulator Selection window.


    Now we can toggle the values on the SB or RB inputs by pressing the Q and W keys.
    Clicking the button on the toolbar of the Logic Simulator window performs a simulation
    step with the current inputs. Then we press the Q and W keys on the keyboard to
    change the inputs and do another simulation step. The simulated operation of the
    SRFF is shown in Figure 6.8.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Listing 6.2　VHDL code for a simple SR flip-flop.


    ```

    001- -- S-R Flip-Flop

    002-

    003- LIBRARY IEEE;

    004- USE IEEE.std_logic_1164.ALL;

    005-

    006- ENTITY srff1 IS

    007- PORT

    008- (

    009-   sb: IN STD_LOGIC;    -- active-low set input

    010-   rb: IN STD_LOGIC;    -- active-low reset input

    011-   q: BUFFER STD_LOGIC; -- data output

    012-   qb: BUFFER STD_LOGIC -- inverted data output

    013- );

    014- END srff1;

    015-

    016- ARCHITECTURE srff1_arch OF srff1 IS

    017- BEGIN

    018-   q  <= (NOT sb AND qb);  -- cross-coupled NAND gates

    019-   qb <= (NOT rb AND q);

    020- END srff1_arch;

    ```


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_191_0.png)


    **Figure 6.8**　Simulated waveforms for a simple SR flip-flop.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'Note that the simulation starts off with the Q and QB outputs in unknown states.
    The feedback between the NAND gates thwarts the simulator''s attempts to figure
    out what the initial state of the flip-flop should be. Once the SB input is lowered
    to 0, the output of the Q NAND gate must stabilize at logic 1. With RB and Q now
    both at logic 1, the QB output goes to logic 0. So now the state of the flip-flop
    is no longer unknown.


    When the SB input returns to 1, the Q output remains at 1. Thus, the SRFF is storing
    the logic 1 that was loaded in by the SB input. Then when the RB input goes low,
    the QB output is set to logic 1 and the Q output goes low. This situation persists
    when the RB input returns to logic 1, so now the SRFF is storing a logic 0. It
    appears the SR flip-flop is working, at least in the simulation.


    Now we can download the SRFF to the XS40 or XS95 Board for an actual test. Create
    a user-constraint file which assigns the inputs and outputs as follows for the
    XS40 Board:


    ```

    NET sb    LOC=P44;  # B0 argument of XSPORT

    NET rb    LOC=P45;  # B1 argument of XSPORT

    NET q     LOC=P25;  # S0 LED segment

    NET qb    LOC=P26;  # S1 LED segment

    ```


    Or use the following constraints for the XS95 Board:


    ```

    NET sb    LOC=P46;  # B0 argument of XSPORT

    NET rb    LOC=P47;  # B1 argument of XSPORT

    NET q     LOC=P21;  # S0 LED segment

    NET qb    LOC=P23;  # S1 LED segment

    ```


    After compiling and downloading the SRFF1 design, you should see the following
    results when you exercise the design on the XS40 or XS95 Board with the given
    sequence of commands:


    | Command | RB | SB | LED S0 (Q) | LED S1 (Q_) |

    |---|---|---|---|---|

