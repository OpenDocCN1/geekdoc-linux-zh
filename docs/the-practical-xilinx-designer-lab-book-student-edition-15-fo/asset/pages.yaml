- pgno: 332
  md: '3. If the multiplier bit is one, we need to be able to shift the multiplicand
    left by the appropriate number of positions and then add it to the sum.


    A flowchart for performing a binary multiplication is shown in Figure 9.4. It
    starts by clearing the product register, which will hold the result of the multiplication
    when the program is finished. The mask RAM location is set to 0001 and will be
    used to test each bit of the multiplier to see if it is zero or one.


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_332_0.png)


    # Figure 9.4 A flowchart for binary multiplication of 4-bit numbers.


    Next, the mask and the multiplier are logically ANDed together. This will determine
    if the least-significant bit of the multiplier is zero. If it is not zero, then
    the multiplicand is added to the product. If it is zero, then the addition is
    skipped.


    Next, the multiplicand has to be multiplied by 2 to prepare it for the next time
    it is needed. Then the mask is multiplied by 2 so it now contains the value'
