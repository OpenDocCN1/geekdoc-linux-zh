    **wrptr:** The write pointer also increments in the wrap-around sequence 0, 1,
    ..., N − 1, 0, 1. A write operation increments the pointer, but no write is performed
    if the FIFO is full. If that happened, then the read pointer would be one behind
    the write pointer and the FIFO would then contain twice as many data bytes. Thus,
    N − 1 bytes of data would be lost.


    **Multiplexer:** This component directs either the read or write pointer to the
    address inputs of the RAM depending on the operation being performed.


    **Comparator:** The read and write pointer values must be compared for equality
    to determine when the FIFO is full or empty.'
