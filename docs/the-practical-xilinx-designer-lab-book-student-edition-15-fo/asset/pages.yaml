    ```

    001- -- LED Blanking (LEDBLANK.VHD)

    002-

    003- LIBRARY IEEE,xse;

    004- USE IEEE.std_logic_1164.ALL;

    005- USE xse.led.ALL;

    006-

    007- ENTITY ledblank IS

    008- PORT

