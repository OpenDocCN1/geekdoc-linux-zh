- pgno: 222
  md: 'Now that we have a truth table, we can derive the Boolean equations and gate-level
    diagrams for the combinational logic that generates the outputs and the next state.
    Or we can let the software do it for us. Either way, it is something we have done
    quite a few times before, so there’s nothing new from this point on.


    You might be concerned about the complexity of the logic circuitry needed to generate
    the next state. For complicated state machines, the state transition circuitry
    can consume a lot of gates with large fan-ins, and there can be an appreciable
    delay before the next state is available. This is especially true if we use minimal
    encodings for our states.


    An alternative to minimal state encoding is called one-hot encoding. With one-hot
    encoding, a machine with N states will have N flip-flops. Only one flip-flop will
    store a logic 1 in each state; the rest will be reset to logic 0. For our three-state
    counter example, the state assignments with one-hot encoding would be


    | State | One-hot Pattern |

    | --- | --- |

    | state 0 | 001 |

    | state 1 | 010 |

    | state 2 | 100 |


    It is always easy to tell what state a one-hot state machine is in: Just look
    for the flip-flop that has a 1 stored in it. This simple state encoding also makes
    the next-state generation circuitry smaller and faster and reduces its fan-in.
    The trade-off is that you need a lot of flip-flops with one-hot encodings. A 128-state
    machine needs 128 flip-flops with one-hot encoding, but only seven flip-flops
    if you use a minimal encoding.


    FPGAs, like the XC4000 series, have hundreds to thousands of flip-flops but their
    LUTs have a limited fan-in of four or five inputs. One-hot encodings are a good
    match for FPGA architectures, especially if high circuit speeds are needed. CPLDs,
    like the XC95108, do not have a large number of flip-flops but they do make large
    amounts of fast sum-of-product circuits with wide fan-ins. That makes state machines
    with minimal encodings the best fit for CPLDs.


    So far, we have discussed state machines that use a synchronous design philosophy:
    All state transitions occur on a single edge of a global master clock. Generally,
    this is a safe design approach. But can you get in trouble even when building
    a strictly synchronous design? Of course! The majority of your problems will come
    from violating setup and hold times for flip-flops. The basic constraints are
    shown in Figure 7.7. We need to get the current state from one or more flip-flops
    to some combinational logic that generates the next state. Then the next state
    has to arrive at the inputs of the flip-flops so it can be loaded in'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Figure 7.7 Timing concerns for synchronous state machines.


    by the next clock edge. There are various time delays we need to account for in
    this trip:


    +   T_co: This is the delay between the arrival of the clock edge and the change
    in the output of a flip-flop. This is somewhat analogous to propagation delay
    for combinational logic. (Clock-to-out delay)


    +   T_wd1: This is the wiring delay that is introduced as the output of the flip-flop
    makes its way though the wiring and switch matrices of an FPLD. (Wiring delay
    1)


    +   T_pd: This is combinational gate propagation delay for the logic that computes
    the next state. We are already familiar with this. (Gate propagation delay)


    +   T_wd2: More wiring delay as the next-state output from the combinational logic
    makes it to the inputs of the flip-flops. This is not necessarily the same duration
    as the previous wiring delay. (Wiring delay 2)


    +   T_su: The next state has to be present on the inputs of the flip-flop for
    at least the setup time before the next clock edge arrives. Otherwise we might
    load garbage into the flip-flops or get into a metastable state. (Setup time)


    The sum of all these times must be less than or equal to the cycle time of the
    master clock:


    ```

    T_co + T_wd1 + T_pd + T_wd2 + T_su ≤ T_cycle

    ```


    If we satisfy this equation, we will not have setup violations. This inequality
    determines how fast our state machine can operate. Assuming we have one'
  merge: -1
  img_proc: true
