  md: '(remember to store the SVF into the top-level directory of your EVPAR_95 project):


    C:\XCPROJ\EVPAR_95> XSLOAD EVPAR_95.SVF


    Now you can do actual tests on the parity generator. For example, the command


    C:\XCPROJ\EVPAR_95> XSPORT 01001001


    should light up the S0 segment of the 7-segment LED because the input pattern
    contains an odd number of 1 bits. On the other hand, the command


    C:\XCPROJ\EVPAR_95> XCPORT 01011001


    will should extinguishing the S0 segment because the input pattern contains an
    even number of 1 bits.


    You may also notice LED segments besides S0 digit turning on and off as you test
    the parity detector. If this occurs, it is because the Foundation Series Implementation
    tools assigned the outputs of the lower-level parity detector modules to pins
    which are attached to other segments of the LED digit. (Foundations did not knowingly
    do this - it was just looking for some pins to use and happened to pick some that
    were attached to the LED.) While unintended, this could be useful for debugging
    your circuit if you knew which segment was being affected by each parity detector
    module. You can find this information in the pin assignment report file.


    # A Parity Generator in VHDL for the XS95 Board


    Let''s rebuild the 8-bit parity generator using VHDL. Create an HDL mode project
    called EVPAR_95 in the XCPROJ-V directory. Then create the EVPAR.VHD file containing
    the VHDL code of Listing 4.4. (This is probably most easily done using an empty
    HDL Editor file rather than trying to use the HDL Design Wizard.)


    The EVPAR.VHD file contains three modules: a 2-bit parity generator (lines 3-17),
    a 4-bit parity generator (lines 20-44), and an 8-bit parity generator (lines 47-81).
    Each module begins by including the STD_LOGIC_1164 package of the IEEE library,
    followed by an ENTITY block which describes the module interface and then an ARCHITECTURE
    section.


    The evpar2 module has two inputs (b0 and b1) and a single output (par) declared
    on lines 9 and 10, respectively. As shown on line 16 of the ARCHITECTURE section,
    evpar2 exclusive-ORs the two inputs and places the result on the par output.'
