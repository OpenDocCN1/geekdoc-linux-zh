    # Adding a Blanking Control to an LED Decoder for the XS95 Board


    Tristate outputs can also be used in an ABEL-based design (BLANK_95). The LED
    decoder modified to add a blanking input is shown in Listing 5.1. The only changes
    to the design are as follows:


    Line 6: This line declares the BLANK input which tristates the outputs that drive
    the LED segments.


    Line 14: This line introduces something new: a signal extension. The signal extension
    .OE gives us access to the tristate control for the output buffers. A high level
    on a .OE input will enable the output while a low level makes the output float.
    Vector notation lets us use a single statement to control the output enable inputs
    of all 7 LED segment drivers.


    Place the following constraints in the BLANK_95.UCF file and compile the LEDBLANK.ABL
    file for the XS95 Board:


    ```

    NET D0 LOC=P46;

    NET D1 LOC=P47;

    NET D2 LOC=P48;

    NET D3 LOC=P50;

    NET BLANK LOC=P51;

    NET S0 LOC=P21;

    NET S1 LOC=P23;

    NET S2 LOC=P19;

    NET S3 LOC=P17;

    NET S4 LOC=P18;

    NET S5 LOC=P14;

    NET S6 LOC=P15;

    ```'
