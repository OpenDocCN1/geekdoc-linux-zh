- pgno: 384
  md: 'A logic one on the CHG_SP input will cause the stack pointer to change its
    value on a rising edge of the CLOCK signal. If a logic one is applied on the INC_SP
    input, the change will be an increment. Otherwise, the value in the SP will be
    decremented. The increment (decrement) operation is needed when values are being
    pushed onto (popped off) the stack.


    The SP is cleared by raising the RESET signal. This operation is needed when DWARF
    starts up so the stack begins growing upward from address 0 in the STACK region.
    There is no need to randomly address the contents of the stack, so the DI[7:0]
    input to the counter is left unconnected and the load signal (L) is tied to a
    logic zero.


    The B output of the register set, PC and PC are the A, B, and C inputs to the
    address multiplexer module (ADDR_MUX in Figure 10.8, bottom right). The address
    multiplexer selects one of its inputs as the source of the lower 8 bits of the
    RAM address and sets the upper 7 bits so that the DATA, STACK, and PROGRAM memory
    regions are separated. ADDR_MUX outputs the following values given the settings
    of the SEL0 and SEL1 inputs:


    | SEL1 | SEL0 | [ADDR14..ADDR8] | [ADDR7..ADDR0] | Region |

    |---|---|---|---|---|

    | 0 | 0 | 1111111 | [REG7..REG0] | DATA |

    | 0 | 1 | 1111110 | [SP7..SP0] | STACK |

    | 1 | 0 | 0000001 | [PC7..PC0] | unused |

    | 1 | 1 | 0000000 | [PC7..PC0] | PROGRAM |


    The DATA region of the external RAM is accessed when SEL0=SEL1=0. The B output
    of the register set supplies the lower 8 bits of the address while the upper 7
    bits are set to 0x7F. Thus, the DATA region lies at the top of the RAM between
    hexadecimal addresses 0x7F00 and 0x7FFF. In a similar manner, the STACK region
    (SEL0=1, SEL1=0) occupies the address range 0x7E00–0x7EFF with the stack pointer
    supplying the lower eight address bits. The PROGRAM region (SEL0 = SEL1 = 1) occupies
    the lowest 256 bytes of RAM (0x0000–0x00FF) with the PC, naturally, acting as
    the source for the lower 8 bits of address in this region.


    The detailed circuitry for the address multiplexer is shown in Figure 10.9. It
    consists mainly of two 8-bit multiplexers that work in series to steer one of
    the three byte-wide A, B, or C inputs to the [07..00] output under the direction
    of the SEL0 and SEL1 inputs. SEL0 and SEL1 also go to a set of inverters that
    generate the correct bit pattern for each memory region on the upper 7 bits of
    the memory address.


    Miscellaneous circuitry for driving the control inputs of the external RAM is
    shown in the upper right portion of Figure 10.8. The RAM is permanently enabled
    by tying the chip select (CS_) to logic zero (GND). The output enable of'
