  md: "Implementation Report Files. The Report Browser window of Figure 3.15 will\
    \ appear. Double-click on any of the icons to view the contents of the associated\
    \ report.\n\n![](img/5124daf79d2807d81e49f49c22f1f8c1_90_0.png)\n\n**Figure 3.15**\
    \  Various reports generated by the Foundation Series Implementation tools.\n\n\
    These reports summarize the following information:\n\n**Translation Report:**\
    \ Any problems detected when a netlist is being converted into the internal format\
    \ used by the Foundation Implementation tools will be listed here. Design rule\
    \ checks are also performed and the user-constraint file is checked for errors.\
    \ The most likely error you will see in this file will result from an illegal\
    \ constraint you have entered. These errors should not occur for the design examples\
    \ in this book, but you may cause some when you begin experimenting on your own.\n\
    \n**Map Report:** In here, you will get information on what types of optimizations\
    \ were attempted on the netlist. Logic gates are removed and added to optimize\
    \ the circuit without changing its function. One example of logic removal occurs\
    \ when you put a gate in a design but you do not use output for anything. Another\
    \ example is an AND gate with an input tied to logic 0 (GND) so that it's output\
    \ is always low. The report also indicates how the logic gates were collected\
    \ into groups and mapped into the LUTs of the FPGA CLBs.\n\n**Place&Route Report:**\
    \ This report records the various options we selected to affect the way the place-and-route\
    \ is performed, lists any warnings and errors, and tallies the total processing\
    \ time spent in the various place-and-route phases. It also reports various statistics\
    \ on the timing performance of the routing. But most importantly (right now),\
    \ it gives us the answer to our first question on how much of the XC4005XL device\
    \ is used to build a 1-bit adder.\n\n```\nDevice utilization summary:\n\n    \
    \     I/O             5/112    4% used\n                         5/61     8% bonded\n\
    \         LOGIC           1/196    0% used\n         IOB             5/112   \
    \ 4% used\n         CLB             1/196    0% used\n```"
