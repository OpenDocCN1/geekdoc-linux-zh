    to the XC95108 CPLD, so start to creating a project called LEDDCD95 in the XCPROJ-V
    directory (Figure 3.22). Make sure to click on the HDL radio button so the HDL
    design flow mode is enabled.


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_106_0.png)


    Figure 3.22 Initiating the HDL-mode LED decoder project for the XC95108 CPLD.


    Start the HDL editor and elect to use the Design Wizard. Choose VHDL as the HDL
    and set the name of the VHDL design to LEDDCD. Then use the Design Wizard-Ports
    window to set-up the inputs and outputs. From the truth-table, we know we need
