- pgno: 39
  md: 'It was not long before engineers got around that problem by combining several
    SPLDs into a single IC to create complex programmable logic devices (CPLDs). The
    XILINX XC9500 series of CPLDs is an example of such a CPLD (Figure 2.5). For example,
    the XC95108 contains six configurable function blocks (CFBs) that are each equivalent
    to an 18-macrocells SPLD with 36 inputs and 18 outputs. The outputs of the macrocells
    exit the chip through I/O pins, but they also feed back into a global interconnection
    matrix (XILINX calls this a "FastCONNECT Switch Matrix"). Each CFB accepts 36
    inputs from the 6 × 18 = 108 macrocell feedback signals that enter the switch
    matrix. Very complex multilevel logic functions can be built by programming the
    individual logic functions of each macrocell in each CFB and then connecting them
    through the switch matrix. The result is a design where each pin on a CPLD is
    driven by a macrocell that implements a wide logic function of a combination of
    many inputs.


    An alternative architecture is found in the field-programmable gate array (FPGA).
    The basic building block for the FPGA is the lookup table or LUT (Figure 2.6).
    A typical lookup table has only four inputs and a small memory containing 16 bits.
    Applying a binary combination to the inputs (such as 0110) will match the address
    of a particular memory bit and make it output its value. Any four-input logic
    function can be built by programming the lookup table memory with the appropriate
    bits. For example, a four-input AND gate is built by loading the entire memory
    with 0 bits except for a 1 bit that is placed in the cell that is activated when
    all the inputs are 1.


    In FPGAs such as the XILINX XC4000 series, three LUTs are combined with two flip-flops
    and some additional steering circuitry to form a configurable logic block (CLB),
    as shown in Figure 2.7. Then the CLBs are arranged in an array with programmable
    switch matrices (PSMs) between the CLBs (Figure 2.8). The PSMs are analogous to
    the FastCONNECT switch matrix in the XC9500 CPLDs and are used to route outputs
    from neighboring CLBs to the inputs of a CLB. The FPGA I/O pins can attach to
    the PSMs and CLBs or may even be attached to their own large routing matrix. Most
    FPGAs have many more CLBs than I/O pins, so each CLB cannot have a direct connection
    to the outside world as do the macrocells in a CPLD. For example, the XILINX XC4006XL
    FPGA has 196 CLBs in a 14 × 14 array, but only 64 I/O pins when packaged in an
    84-pin plastic-leaded chip carrier (PLCC).


    The logical question now is, "How are all these switches set to make the connections
    in programmable devices?" All the wiring in PLAs, PALs, SPLDs, CPLDs, and FPGAs
    is internal to the IC, so there is no way an engineer can physically go in and
    wire the connections together. Instead, the connections are programmed electrically.
    In early versions of programmable logic, the switch arrays were manufactured with
    fuses at every crosspoint such that every input was connected to each logic gate.
    Specialized circuitry was added that allowed an engineer to place high voltages
    on selected vertical and horizontal wires.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '![](img/5124daf79d2807d81e49f49c22f1f8c1_40_0.png)


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_40_1.png)


    # Figure 2.5 Internal organization of the XC95108 CPLD.


    The high voltage burned out the fuse at the crosspoint between the two wires.
    The engineer performed this operation many times to knock out all the unwanted
    connections. At the end of the programming process, only the connections needed
    to build the desired logic functions would remain.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '![](img/5124daf79d2807d81e49f49c22f1f8c1_41_0.png)


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_41_1.png)


    The disadvantage of fuses is that once they are blown, they stay blown. So if
    a mistake is made, the programmable device has to be thrown out and a new one
    must be programmed. It is more convenient (and cheaper) if the connections can
    be erased and reprogrammed. This is a major advantage of the XILINX XC9500 and
    XC4000 programmable logic families: they contain reprogrammable switches where
    the fuses would normally be. Each switch is controlled'
  merge: -1
  img_proc: true
- pgno: 42
  md: '![](img/5124daf79d2807d81e49f49c22f1f8c1_42_0.png)


    # Figure 2.8 A generic FPGA architecture.


    by a storage element that records whether the attached switch is opened or closed.
    Changing the values in these storage elements changes the state of the switches
    and alters the functions of the programmable device. These switches can be repeatedly
    programmed to implement new designs (or repair faulty designs), eliminating the
    need to buy a new device for each design modification. The XC9500 CPLDs use nonvolatile
    FLASH-based storage cells so the device retains its programming even if the power
    is turned off. The XC4000 FPGAs, however, employ static random access memory (RAM)
    storage cells so they need to be reprogrammed each time power is interrupted.


    Now the question arises, "How do I tell the FPLD which wires to connect?" In the
    next section, I will show you how to use the XILINX Foundation Series 1.5 Software
    tools to create logic designs that you can download into the XC95108 CPLD and
    the XC4005XL FPGA.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Experimental


    # The Programmable Logic Design Flow


    XILINX''s Foundation Series Software is an environment for creating programs which
    describe logic designs. When using Foundation, your main design flow (shown in
    Figure 2.9) progresses as follows:


    +   1. Digital designs are entered using the schematic editor, state machine editor,
    or by writing ABEL or VHDL programs with the HDL text editor. You can describe
    a design using just one or a mix of these methods.


    +   2. A functional simulator checks the operation of the compiled design and
    lets you view the results to see if it is doing what you want. You can go back
    and edit the ABEL or VHDL file, schematic, and/or state machine diagram if any
    errors are found.


    +   3. The Foundation Implementation tools compile the list of gates and connections,
    or netlist, into a bitstream which is used to program the FPLD. It is in this
    step that a particular device is targeted, such as the XC95108 or XC4006XL. For
    XC9500 devices, a fitter algorithm maps the netlist onto the CPLD architecture.
    For XC4000 devices, the implementation requires mapping the circuit to the FPGA
    architecture, placing the gates in specific CLBs, and then routing the wires using
    the PSMs.


    +   4. A timing simulation of your design can be run after the Foundation Implementation
    tools have determined the gate and routing delays associated with a particular
    mapping to an FPLD architecture.


    +   5. The XSLOAD program is used to download the bitstream into the XS95 Board
    or the XS40 Board (see Appendix A for a description of these boards).


    +   6. Debugging is performed by forcing inputs into the XS95 or XS40 Boards via
    the parallel port cable. A 7-segment LED on the board shows the response of the
    FPLD.


    These steps will be described in the following sections. As an introductory example
    of the modified design flow, we will recreate the design for the Hwy3 logic of
    the Trip-Genie shown in Chapter 1. Since the specification and I/O steps are unchanged,
    we can begin with the design-entry step.


    The XILINX Foundation 1.5 Series Software has two distinct design flows:


    Schematic mode is used if your top-level design is described using schematics,
    state diagrams, or ABEL.


    HDL mode is used if your top-level design is described using VHDL.


    We will show how to build the TripGenie using both of these design flows.'
  merge: -1
  img_proc: true
