    Then click on the upper-left button under the Bus label. You will see the D in
    the name field change to D[1:0]. Two more clicks will change it to D[3:0]. This
    specifies our 4 inputs (D0, D1, D2, and D3) as a 4-bit input vector.


    Click New again and enter S in the Name Field. Then click the button to advance
