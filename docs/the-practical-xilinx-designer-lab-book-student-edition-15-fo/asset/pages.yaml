- pgno: 20
  md: 'The sentence can be restated using more algebraic notation. If a city is an
    endpoint of the route, then its associated input is set to logic 1. If the city
    is not an endpoint of the route, then (obviously) its input is set to logic 0.
    If a highway is part of the fastest route, then its associated output is set to
    logic 1. This gives


    (Hwy3 = 1) IF

    (Hooterville = 1 AND Siler City = 1 AND Mayberry = 0 AND Mt. Pilot = 0)

    OR

    (Mayberry = 1 AND Siler City = 1 AND Hooterville = 0 AND Mt. Pilot = 0)


    We will introduce some notation to shorten the previous statement. If an input
    or an output is equal to a logic 1, we will replace the equality with the name
    of the input or output. On the other hand, if an input or output is equal to logic
    zero, we will replace the equality with the name of the input or output with a
    line drawn over it. (This is called the NOT or inversion operation.) For example,


    Hwy3 = 1 → Hwy3

    Hooterville = 0 → Hooterville̅


    We will also replace the words IF, AND, and OR with the =, ·, and + Boolean operators,
    respectively. Making these changes finally gives a Boolean equation:


    Hwy3 = Hooterville · Siler City · Mayberry̅ · Mt. Pilot̅ + Mayberry · Siler City
    · Hooterville̅ · Mt. Pilot̅


    This equation can be simplified slightly by factoring out a common subexpression
    as follows:


    Hwy3 = (Hooterville · Mayberry̅ + Hooterville̅ · Mayberry) · (Siler City · Mt.
    Pilot̅)


    That is all we can do right now to simplify this equation. You can read more about
    logic minimization techniques in any standard text on digital design. The procedure
    we just went through can be applied to Hwy1, Hwy2, and Hwy6 to get the Boolean
    equations for these outputs as well.


    # Gate-level Design


    Armed with the Boolean equations, we can create the gate-level schematic for the
    Trip-Genie logic circuitry. We do this by replacing the AND, OR, and inversion
    operators in the Boolean equation with the logic gate schematic symbols shown
    in Figure 1.6. The NOT gate takes a single binary input and produces the logical
    inversion on its output. The AND and OR gates output the logical'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'AND or OR of their two inputs, respectively. The NAND and NOR gates are the
    same as the AND and OR gates except that their outputs are inverted (this is represented
    by the "bubble" on their outputs).


    # Figure 1.6 Logic gate schematic symbols for the (a) NOT, (b) AND, (c) OR, (d)
    NAND, and (e) NOR Boolean operations.


    Of course, it is one thing to say that the Boolean operators will be replaced
    with schematic symbols, but it is another to do it. As an example, let''s generate
    the schematic drawing of the Boolean equation for Hwy3. We start by noting that
    the Hwy3 output is the logical AND of two terms:


    (Hooterville · Mayberry + Hooterville · Mayberry) (1.1)

    (Siler City · Mt. Pilot) (1.2)


    Therefore, the Hwy3 output is generated by an AND gate that has the previous two
    terms as its inputs (see Figure 1.7a).


    We can continue the process by noting that Eq. (1.1) is the logical OR of Hooterville
    · Mayberry and Hooterville · Mayberry. So an OR gate can be added to the drawing
    that has these two terms as inputs and whose output is connected to one of the
    inputs of the first AND gate (see Figure 1.7b). In addition, Eq. (1.2) is the
    logical AND of Siler City and Mt. Pilot. The output of this AND gate is connected
    to the other input of our first AND gate.'
