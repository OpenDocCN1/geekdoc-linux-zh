- pgno: 330
  md: "set. For example, the addition program demonstrated the need for instructions\
    \ to clear the carry bit, load and store the accumulator, and add numbers to the\
    \ accumulator. If you plan for the microcomputer to do a lot of additions, you\
    \ probably want these instructions in your instruction set.\n\nMany of the instructions\
    \ of Table 9.1 were selected after I wrote a program to do multiplication. Therefore,\
    \ the process of doing multiplication with binary numbers will be explained and\
    \ the program to do it will be presented.\n\nBefore tackling binary multiplication,\
    \ it might be best to review decimal multiplication. Consider forming the product\
    \ of 456 × 123:\n\n```\n        456\n      × 123\n      ─────\n       1368 = 456\
    \ × 3 × 10⁰\n       9120 = 456 × 2 × 10¹\n     +45600 = 456 × 1 × 10²\n      ─────\n\
    \       56088\n```\n\nAs you can see, the product is formed by summing the subproducts\
    \ of the multiplicand (456) with each digit of the multiplier (1, then 2, then\
    \ 3). However, each succeeding digit of the multiplier is also multiplied by a\
    \ power of 10, and this causes the subproducts to be shifted left by the addition\
    \ of the zeros in the rightmost digits.\n\nBinary multiplication is exactly the\
    \ same, only the base (or radix) is changed. For example, multiplying 12 (1100)\
    \ by 6 (0110) is done as follows:\n\n```\n        1100\n      × 0110\n      ──────\n\
    \        0000 = 1100 × 0 × 2⁰\n       11000 = 1100 × 1 × 2¹\n      110000 = 1100\
    \ × 1 × 2²\n    +0000000 = 1100 × 0 × 2³\n      ───────\n      1001000\n```\n\n\
    Notice that the multiplicand is shifted left and added to the product if the corresponding\
    \ bit of the multiplier is one. But if the multiplier bit is zero, then a zero\
    \ is added, which is the same as doing nothing. So there are just a few things\
    \ that need to be done to perform a binary multiplication:\n\n+   1. We need to\
    \ be able to determine if a given bit of the multiplier is zero or one.\n+   2.\
    \ If a multiplier bit is zero, we need to skip the addition of the multiplicand\
    \ to the sum."
