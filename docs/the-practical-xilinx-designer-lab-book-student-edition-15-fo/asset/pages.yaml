    # An 8-Bit Adder in VHDL


    In this section we will build an 8-bit adder for both the XS95 Board and then
    the XS40 Board using VHDL and the HDL design flow mode of the Foundation Series
    software. We will also see how to create our own parts library in VHDL.


    Start by creating an HDL mode project called ADD8_95 in the XCPROJ-V directory.
    Then open an HDL Editor window and create a VHDL file called XSE.VHD which will
    hold a library of components for use in other designs. For now, XSE.VHD will contain
    only a single component that is a single-bit full adder (Listing 4.5).


    The bottom portion of the XSE.VHD file (lines 21 through 42) is just the ENTITY
    and ARCHITECTURE sections of the fulladd design we did in chapter 3. The only
    new feature in this file is the PACKAGE declaration section on lines 8 through
    19. Following the PACKAGE keyword is the package name we have chosen (adder) followed
    by a COMPONENT statement declaring the interface to the fulladd module. This COMPONENT
    statement has exactly the same form as we used in the EVPAR.VHD file when all
    the modules were declared in the same file. If there were multiple modules we
    wanted to place in the adder package, then we would have multiple COMPONENT statements
    in the PACKAGE section.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# Listing 4.5 VHDL library file containing a single-bit full adder component.


    ```

    001- -- Xilinx Student Edition Library

    002- -- Contains some components used in design examples.

    003-

    004- -- package declaration for 1-bit full-adder component

    005- LIBRARY IEEE;

    006- USE IEEE.std_logic_1164.ALL;

    007-

    008- PACKAGE adder IS

    009- COMPONENT fulladd

    010- PORT

    011- (

    012-     input0: IN STD_LOGIC;

    013-     input1: IN STD_LOGIC;

    014-     carry_input: IN STD_LOGIC;

    015-     sum: OUT STD_LOGIC;

    016-     carry_output: OUT STD_LOGIC

    017- );

    018- END COMPONENT;

    019- END adder;

    020-

    021- -- interface and architecture definitions for the 1-bit full-adder

    022- LIBRARY IEEE;

    023- USE IEEE.std_logic_1164.ALL;

    024-

    025- ENTITY fulladd IS

    026- PORT (

    027-     input0: IN STD_LOGIC;

    028-     input1: IN STD_LOGIC;

    029-     carry_input: IN STD_LOGIC;

    030-     sum: OUT STD_LOGIC;

    031-     carry_output: OUT STD_LOGIC

    032- );

    033- END fulladd;

    034-

    035- ARCHITECTURE fulladd_arch OF fulladd IS

    036- BEGIN

    037- sum <= input0 XOR input1 XOR carry_input;

    038- carry_output <= (input0 AND input1)

    039- OR (input0 AND carry_input)

    040- OR (input1 AND carry_input);

    041- END fulladd_arch;

    042-

    ```'
