  md: 'mented once more (so now it holds an address of 2) and the state machine transitions
    to state T0 (lines 96–109, lines 140–152). In T0, an instruction is fetched and
    program execution begins. This means that all DWARF programs start at address
    2. Why go to all this trouble when the programs could start at address zero?


    The answer to this question has to do with the need to process interrupts. In
    T0, a check is made (line 97, line 141) to see if an interrupt has occured (intrp=1)
    and that an interrupt service routine is not already being executed (iflag=0).
    If these conditions are true, the pending interrupt is cleared (line 99, line
    142), iflag is set to indicate that an ISR is now being executed (line 100, line
    143), the address of the current instruction is written to the external RAM at
    the address stored in the stack pointer (line 101, line 144), and the stack pointer
    is incremented at the end of the current clock cycle (line 102, line 145). Then
    the instruction decoder moves to state T1. Here, it stores the accumulator onto
    the stack (line 112, line 154), increments the stack pointer again (line 113,
    line 155), and clears the program counter to zero (line 114, line 156). Then the
    state machine jumps to state T0 and begins to process instructions starting at
    address 0. Thus, all interrupt service routines start at address 0 which is why
    the normal DWARF programs cannot begin there. Note that DWARF will not respond
    to any further interrupts after it enters an ISR because it has set its iflag
    to logic one (recall the conditional test on line 97 or line 141). This saves
    DWARF from a condition where it continually sets up to process interrupts but
    never actually gets to run the service routine.


    Now that we have examined how DWARF enters an ISR, it makes sense to see how it
    gets out of one. This is done using the reti instruction (return-from-interrupt).
    The execution of this instruction begins in state T0 with the fetch of the instruction
    from the PROGRAM region of the RAM (line 106, line 148). The opcode from the RAM
    enters DWARF and is loaded into the instruction register (line 107, line 149).
    The program counter is incremented at the end of this clock cycle (line 108, line
    150), but this does not matter much in this case since the purpose of the reti
    instruction is to return the flow of execution to the address stored on the stack.


    The instruction decoder next moves to state T1. The actions performed in T1 depend
    upon the opcode stored in IR. Since the opcode is the one for reti, the actions
    described on lines 137–140 or lines 174–176 are enabled. The only action is to
    decrement the stack pointer. This points SP at the memory location where the accumulator
    value was saved when the ISR was initiated. However, restoring the accumulator
    value must wait until state T2 is entered (lines 246–251, lines 264–268) because
    the stack pointer is not updated until the end of the T1 state. On line 248 or
    line 265, the STACK region of the RAM is addressed with the value in the SP. The
    value output by the RAM is driven onto the D bus, passed through the ALU, and
    loaded into the accumulator (line'
