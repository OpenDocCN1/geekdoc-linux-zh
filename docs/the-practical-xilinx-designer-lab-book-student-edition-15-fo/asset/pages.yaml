- pgno: 434
  md: '# Appendix B


    # Using ABEL with Xilinx PLDs


    # Summary


    This application note provides a basic overview of the ABEL language and gives
    examples showing how to use ABEL to fully utilize the specific features of Xilinx
    PLDs.


    # Introduction


    ABEL (Advanced Boolean Expression Language), combined with the Xilinx fitter software,
    provides a complete behavioral development environment for entering, simulating,
    and implementing designs for Xilinx PLDs. And, because ABEL was developed specifically
    for programmable logic devices, it provides several important features that support
    the Xilinx FPGA and CPLD architectures.


    # ABEL Language Structure


    ABEL designs are organized into modules. Each module contains at least one set
    of declarations, logic descriptions, and an optional set of test vectors. Most
    designs are completely specified in a single module. However, using the hierarchical
    feature found in ABEL 6, multi-module designs can also be specified. Figure B.1
    shows the distinct sections of code that are necessary to completely specify a
    design.


    # The Header Section


    The module name is specified by the keyword Module. An optional Title may also
    be used after the module name to further describe the design. The double quote
    or the double slash can also be used to add comments. At the end of each module
    definition the keyword End is used to specify the end of the design.'
  merge: -1
  img_proc: true
- pgno: 435
  md: '![](img/5124daf79d2807d81e49f49c22f1f8c1_435_0.png)


    **Figure B.1**　ABEL Module Structure


    For example:


    ```

    ```text

    MODULE mydesign


    TITLE ‘version 1 of mydesign’

    “Additionally, comments can be added using “the double quote

    // or the double slash


    END

    ```

    ```


    # The Declarations Section


    Declarations are used to define constants, signals, and sets, and to pass property
    statements to the fitter for controlling device specific features which are not
    directly supported by ABEL. The various elements contained in the Declaration
    section are:


    +   - Constants—Constants are declared by assigning a value to a constant name.

    +   - Input pins—specified with the **pin** keyword without types.

    +   - Output pins—specified by the **pin** keyword and either registered or combinatorial
    by using the **istype** keyword.'
  merge: -1
  img_proc: true
- pgno: 436
  md: '+   - Nodes or buried logic—specified by the node keyword and can be either
    registered or combinatorial by using the istype keyword.

    +   - Arrays of signals—declared by ending the signal name with a number and using
    the double period (..) syntax.

    +   - Sets—declared to make the ABEL code easier to read and write by replacing
    long redundant signals with a single reference. In addition, higher level operations
    performed on sets allow very powerful and complex designs to be specified very
    quickly.


    For example:


    ```

    "Declaring constants

    On = 1;

    Off = 0;


    "Declaring input pins

    my_input, my_clk pin;


    "Declaring output pins

    my_combinatorial_output pin istype ''com'';

    my_registered_output   pin istype ''reg'';


    "Declaring nodes

    my_combinatorial_node  node isypte ''com'';

    my_registered_node     node istype ''reg'';


    "Declaring a 5-bit array of nodes

    Count4..Count0         node istype ''reg'';


    "Declaring a set to reference all 5-bits

    Counter = [Count4..Count0];


    "Property statements

    xepId PROPERTY ''fast on'';"Sets all outputs      "to fast slew.

    ```


    Note that in the declarations section, the order in which constants and sets are
    defined is important. If constant X is defined with constant Y, for example, then
    constant Y must be defined first.


    # The Logic Description Section


    The logic description section specifies the functions of the design. This can
    be done in three ways: Equations, Truth Tables, and State Diagrams. Equations
    are useful for designs with regular patterns such as counters or multiplexors.
    Truth Tables are a good entry method for designs that do not have regular pat-'
  merge: -1
  img_proc: true
- pgno: 437
  md: 'terns, such as a 7-segment LED decoder. State Diagrams are useful for specifying
    designs with complex state machines.


    Following the Declarations section, the design section is delimited by using the
    keyword Equations, Truth_Table, or State_Diagram. State_diagrams and truth tables
    using sequential logic will need an accompanying equations section to define clock
    signals as well. These keywords must be used when switching between the three
    design methods.


    # Equations


    Equation design entry primarily consists of assignment statements. These can be
    combinatorial assignments (=), or registered assignments using the delay operator
    (:=). All registered equations using the delay operator (:=) will behave as being
    implemented as an edge triggered flip-flop. Therefore, they must also have a clock
    associated with the signal name. This is done by using the .clk dot extension.


    For example:


    ```

    my_registered_node := my_input;

    my_registered_node.clk = my_clk;

    ```


    This is logically equivalent to describing the same logic with detailed dot extensions
    as follows.


    ```

    my_registered_node.d = my_input;

    my_registered_node.clk = my_clk;

    ```


    Using equations to specify a design is similar to programming in other languages,
    except the context of the equations are evaluated in parallel rather than sequentially.
    In the following example, the order in which the equations are written is only
    important in programming languages.


    In ABEL, all of the equations are evaluated concurrently, thus, the order in which
    they are presented is not important.


    For example, in a normal programming language such as C, the code:


    ```

    x = x + 1;

    total = total +x;

    ```


    is not the same as


    ```

    total = total + x;

    x = x+1;

    ```'
  merge: -1
  img_proc: true
