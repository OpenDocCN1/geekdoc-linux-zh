  img_proc: true
- pgno: 17
  md: 'output is part of the fastest route between the beginning and ending city.
    If an output is at logic 0, then the corresponding highway is not part of the
    fastest route.


    # Truth Tables


    Now that the inputs and outputs are defined, you have to determine the relationship
    between them so that you can write down the truth table. This boils down to answering
    the question, Given any two cities, what highways make up the fastest route between
    them? You could imagine building a very smart circuit that analyzes all possible
    paths between the pair of cities and picks the fastest one. That is a bit much,
    especially for a chapter near the beginning of the book. Since there are only
    four cities, you can manually find the fastest route for every possible situation.
    There are 4 × 3 = 12 possible combinations of beginning and ending cities, and
    this can be cut down to six combinations because the fastest route is the same
    regardless of the direction the path is traversed. The six possible combinations
    of beginning and ending cities are shown in Figure 1.5 along with the fastest
    route between the cities.


    The truth table for the Trip-Genie logic (see Table 1.1) can be filled in based
    on the information shown in Figure 1.5. Examining the first route shown in Figure
    1.5, we can see that the beginning and ending cities are Hooterville and Mayberry.
    Therefore, in row 1 of the truth table the logic values of the Hooterville and
    Mayberry inputs are set to 1 while the Mt. Pilot and Siler City inputs are set
    to logic 0. The fastest route between Hooterville and Mayberry consists of only
    Highway 1, so the Hwy1 output in row 1 is set to logic 1 while the Hwy2 through
    Hwy6 outputs are set to 0 since the corresponding highways are not part of the
    fastest route. The next five rows of the truth table are filled by applying the
    same reasoning to the remainder of Figure 1.5.


    The remaining 10 rows of Table 1.1 define what happens when the Trip-Genie user
    enters less than or more than two cities as endpoints of the route. In these cases,
    all the outputs are held at logic 0, which indicates an error condition.


    # Boolean Equations


    Once the truth table is available, a Boolean equation has to be written for each
    output. For some of the outputs, such as Hwy4 and Hwy5, which are never used,
    this is very easy:


    ```

    Hwy4 = 0

    Hwy5 = 0

    ```


    For other outputs, such as Hwy3, the equation can be found by first stating under
    what conditions the output will be a logic 1:'
