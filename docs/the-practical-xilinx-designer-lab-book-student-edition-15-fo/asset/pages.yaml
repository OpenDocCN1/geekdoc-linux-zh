    # Built-In D Flip-Flops


    We have built some flip-flops with various capabilities using basic logic gates.
    But an edge-triggered DFF takes at least 2 macrocells or LUTs even if we use the
    condensed form of Listing 6.2. To improve the utilization of resources in its
    FPLDs, XILINX has included built-in flip-flops in both its XC95108 CPLD and XC4005XL
    FPGA. Now all we have to do is learn how to use them with ABEL.


    Listing 6.11 replicates the functions of our edge-triggered DFF with asynchronous
    clear. Line 8 declares the actual D flip-flop and gives it the name Q. The use
    of the type REG instead of COM distinguishes Q as a registered output rather than
    a combinatorial output like we have always used.'
