    The instruction opcodes are stored in file ADDLIST.HEX as follows:


    +   - 0E 0002 40 00 01 40 10 02 40 00 03 29 A0 8B 03 40

    +   - 10 0010 01 A0 89 01 40 FF A0 8A 02 40 FF 92 C8 20 00 0B

    +   - 04 0020 23 6B D0 22

    +   - 10 7F00 01 23 45 67 89 AB CD EF FE DC BA 98 76 54 32 10


    The first three lines of ADDLIST.HEX just list the instruction opcodes and operands
    for the program. These are loaded into DWARF''s PROGRAM region starting at hexadecimal
    address 0x0002. The 16 values on the last line, however, get loaded into the DATA
    region of DWARF''s memory, which starts at hexadecimal address 0x7F00. This will
    initialize the data list that the program will operate on.


    You can download the DWARF microprocessor and the ADDLIST.HEX program to the XS40
    Board just like we did for the GNOME microprocessor:


    C:\XCPRO\DWARF_40> XSLOAD ADDLIST.HEX DWARF_40.BIT


    Then you can use the following command sequences to reset DWARF to the beginning
    of the program and interrupt it. (We did not load an ISR into DWARF''s memory,
    so an interrupt will not be handled correctly.) You can also single-step DWARF
    through an instruction cycle. Since different instructions require differing numbers
    of clock cycles, it is not possible to give a fixed command sequence for single-stepping
    through an entire instruction. Therefore,'
  merge: -1
