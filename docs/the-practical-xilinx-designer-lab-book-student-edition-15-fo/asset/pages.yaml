    # LED Decoder for the XS95 Board


    Now we can try a more complicated design like the LED decoder. Let''s build it
    using ABEL for the XC95108 CPLD first, and then move it to the XC4005XL FPGA.
    Start by creating a project called LEDDCD95 for the XC95108 (Figure 3.20).


    Start the HDL editor and choose ABEL as the HDL. Then use the Design Wizard to
    set-up the inputs and outputs. From the truth-table, we know we need 4 inputs
    and 7 outputs. We could type in all these names, but there is a smarter way. Click
    on the New button and type D into the Name field. Then click on the upper-left
    button under the Bus label. You will see the D in the name field change to D[1:0].
    Two more clicks will change it to D[3:0]. This specifies our 4 inputs (D0, D1,
