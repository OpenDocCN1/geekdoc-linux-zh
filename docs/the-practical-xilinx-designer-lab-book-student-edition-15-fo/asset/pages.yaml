    # Programmable Logic Architecture


    It is natural to ask how FPGA and CPLD chips can be electronically programmed
    to perform any possible logic function. These devices actually evolved from the
    PLA™ (programmable logic array) devices of the early 1970s. The basic PLA structure
    is shown in Figure 2.2 and consists of a bunch of AND gates, OR gates, and inverters
    interconnected through some programmable switch arrays. In the PLA, every input
    and its logical inversion is passed into an AND array on the horizontal wires.
    The vertical wires in the AND array are inputs to a row of AND gates. The AND
    gates receive input signals by tying the horizontal and vertical wires together
    (as symbolized by the black dots in the AND array). Thus, the left-most AND gate
    receives the logical inverse of the C signal and ANDs it with the A signal.


    The OR array has a function analogous to the AND array. The vertical wires carry
    the outputs from the AND gates into the OR array. There they can be connected
    to the horizontal wires which are inputs to a column of OR gates. By'
  merge: -1
  img_proc: true
- pgno: 37
  md: '![](img/5124daf79d2807d81e49f49c22f1f8c1_37_0.png)


    # Figure 2.2 A PLA.


    connecting the outputs of the AND gates to the inputs of the OR gates, a sum of
    products can be created at each output of the PLA.


    The flexibility provided by both a programmable AND and OR array often went unused,
    so engineers came up with the simpler programmable array logic (PAL) structure
    shown in Figure 2.3. In the PAL, the programmable OR array has been replaced with
    a set of fixed connections from AND gates into the OR gates. So you can program
    the switches to form any product term you want. But the output from each OR gate
    is fixed to be the sum of only two product terms (in this example). In addition,
    the PAL outputs feedback into the AND array. The feedback terms are used to build
    multilevel logic functions.


    PALs and PLAs are good for combinational logic, but they cannot be used for sequential
    logic without adding external flip-flops. (If you do not know what flip-flops
    are yet, you will find out in Chapter 6.) So, naturally, flip-flops were added
    to the PAL structure, as shown in Figure 2.4. At this point, the circuit is called
    an SPLD (simple programmable logic device). Multiplexers are added to each output
    to select either the flip-flop output or the combinational output as the actual
    output. The AND gates, OR gates, flip-flops, and multiplexers that drive each
    output are collectively known as a macrocell. Modern SPLDs have a variety of programmable
    circuit structures with many options that can be enabled to increase the usefulness
    of the chips.


    The PLAs, PALs, and SPLDs still had to be placed on a printed circuit board and
    wired to each other and other components. If small errors were found on the board,
    programmable logic devices on the board could be replaced with reprogrammed devices
    that "wire around" the problem. However, large errors could only be corrected
    by manually changing the wiring pattern connecting the chips.'
  merge: -1
  img_proc: true
