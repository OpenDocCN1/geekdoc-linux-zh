    # An 8-Bit Adder for the XS40 Board


    You can build an 8-bit adder module for the XS40 Board in much the same way that
    we did for the XS95 Board: create the MY_ADD1 1-bit adder module and then replicate
    it and add connections to build an 8-bit adder.


    But there is one modification that is needed. As we saw in the even-parity generator
    design, 2 of the 8 outputs from the PC parallel port drive special-purpose inputs
    on the XC4000XL FPGA of the XS40 Board. That means we have to use special symbols
    in the schematic because it is illegal to write constraints that assign nets or
    terminals to the special-purpose pins.


    The 8-bit adder is driven by 7 outputs of the parallel port: one for the carry
    input, and three for the lower bits of each of the two numbers that are being
    added. That means we need to use at least one special-purpose pin. In this example,
    I will use the M0 pin. Figure 4.19 shows the circuit that results from the following
    modifications in the wiring of the 8-bit adder:


    +   1. The BIB2 connection to the BIB bus has been removed.

    +   2. A new input buffer has been connected to the B input of the H3 instance
    of the MY_ADD1 1-bit adder module.

    +   3. The input of the new IBUF module is driven by the MD0 symbol which corresponds
    to an input from the special-purpose M0 pin.


    The result of these modifications is that the third bit of the B input to the
    8-bit adder is now driven by the value on the M0 pin and not from the B2 bus bit.
    So the B2 bit is assigned to an out-of-the-way pin in the following ADDB_40.UCF
    user-constraint file:


    ```

    NET CIN          LOC=P44;

    NET A<0>          LOC=P45;

    NET A<1>          LOC=P46;

    NET A<2>          LOC=P47;

    NET B<0>          LOC=P48;

    NET B<1>          LOC=P49;

    NET B<2>          LOC=P6;     # assign to some out-of-the-way pin

    NET SUM<0>        LOC=P25;    # LED segment S0

    NET SUM<1>        LOC=P26;    # LED segment S1

    NET SUM<2>        LOC=P24;    # LED segment S2

    # the following constraints assign unused ADDB terminals to out-of-the-way pins

    NET COUT          LOC=P7;

    ```'
  merge: -1
  img_proc: true
