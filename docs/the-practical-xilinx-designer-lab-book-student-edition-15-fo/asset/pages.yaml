    # First-In, First-Out Buffers


    In a communication system, a transmitter may send data in bursts faster than the
    receiver can handle it. Buffers are needed which can accept short bursts of high-speed
    data and then allow the data to be read out as needed. In addition, the bytes
    in the data stream must remain in order so that the first byte entered into the
    buffer is the first byte read out from the buffer. A device that performs these
    operations is called a first-in, first-out buffer or FIFO.


    An example of a FIFO in operation is shown in Figure 8.13. The FIFO is built from
    a RAM with room for four data bytes. Two memory pointers called rdptr and wrptr
    are used to address the next location in the RAM that will be read or written,
    respectively. There are also two flags called empty and full to indicate how much
    data is in the FIFO. When all four RAM locations are written'
