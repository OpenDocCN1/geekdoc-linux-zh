    c₂ = G₂ + P₂ G₁ + P₂ P₁ G₀ + P₂ P₁ P₀ cᵢₙ


    c₃ = G₃ + P₃ c₂

    c₃ = G₃ + P₃ (G₂ + P₂ G₁ + P₂ P₁ G₀ + P₂ P₁ P₀ cᵢₙ)

