  md: '# The GNOME Microcomputer


    # Objectives


    +   - Discuss the programmer''s model for the GNOME microcomputer.

    +   - Show how to program the GNOME.

    +   - Explain the process of binary multiplication.

    +   - Describe the general organization of the GNOME.

    +   - Show how to build the controller section of the GNOME.

    +   - Show how to build the circuitry of the GNOME datapath.

    +   - Show how the GNOME controller and the datapath work together.


    # Discussion


    You have seen how a RAM is built, but you may be asking, "Why are large memories
    needed?" After all, the largest memory you have needed so far is only a few bits
    for storing the state of some of your state machines. Some of you may be replying,
    "It''s obvious why we need large RAMs—they are for storing large amounts of data!"
    Of course, you are right—RAMs are good for storing large amounts of data.


    But just having a memory to store data is rather useless. Imagine having all the
    data on every purchase made by every person in the United States over the course
    of a year. Now suppose you want to find the group of people who have purchased
    Volvos so you can sell them a horn that yodels instead of beeps. Your only recourse
    is to address each memory location and pick out the data you need (and we are
    talking trillions of memory locations).


    However, you could write down detailed instructions and give them to someone else
    and tell them to find the information you want. These instructions constitute
    a program and the paper they are written on is a primitive memory. If you had
    a way to encode the written instructions as binary numbers, you could store them
    in a RAM just like the data. Then you could build a state machine to interpret
