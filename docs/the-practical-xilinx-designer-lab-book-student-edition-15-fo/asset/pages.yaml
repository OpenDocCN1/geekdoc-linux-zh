  img_proc: true
- pgno: 342
  md: '![](img/5124daf79d2807d81e49f49c22f1f8c1_342_0.png)


    # Figure 9.10 Circuitry for incrementing the PC.


    lower 7 bits of a jump instruction in the IR. (The control of this selector input
    will be discussed later.)


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_342_1.png)


    # Figure 9.11 Additional circuitry for supporting the jump instruction.


    Only one last major component is missing from the GNOME microcomputer: the instruction
    decoder. The instruction decoder interprets the current instruction opcode along
    with the carry and zero flags and outputs the control signals which will make
    the other parts of the GNOME do the required operations. Just what control signals
    are needed? Figure 9.12 shows the instruction'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'decoder and the 10 control signals which enter the various components of the
    GNOME. Here is what they do:


    sel_data_ram: This signal controls the multiplexer attached to the address bus.
    When high, the address of a data register is selected. When low, the address in
    the PC is applied to the RAM.


    jump_pc: This signal controls the multiplexer attached to the PC. When high, the
    new value of the PC comes from the address stored in the current instruction.
    When low, the PC is updated with the value from the incrementer.


    inc_pc: This signal controls the incrementer attached to the PC. When high, the
    value in the PC is increased by one. When low, the PC retains its current value.


    ld_ir: This signal controls the loading of the instruction register. When high,
    the 8 bits of opcode from the RAM are loaded into the IR. When low, the instruction
    register retains its contents.


    ld_ir_lsn: This signal controls the loading of the LSN of the instruction register
    with direct address mode operands. When high, the lower 4 bits of the IR are loaded
    with the lower 4 bits of data from the RAM. When low, the LSN of the IR is unchanged.


    { aop2..aop0 }: These signals control the operation of the ALU, accumulator, and
    flags. These three signals control (1) the setting, clearing, and updating of
    the carry flag, (2) the updating of the zero flag, (3) the operation performed
    by the ALU, (4) the loading of the accumulator with the ALU output.


    write: This signal controls the writing of data to the data RAM. When high, data
    from the ACC can be written into the RAM. When low, the FPLD I/O drivers are turned
    off so the data from the RAM can enter.


    read: This signal controls the reading of data from the RAM. When high, the data
    bus drivers of the RAM are enabled so it can force values into the FPLD.


    We have an idea of what the controller and datapath sections of the GNOME must
    do and how they interface to each other and the external RAM. Now we can write
    the ABEL code for the GNOME (Listing 9.2).


    Lines 6–13 declare the interface pins that go between the FPLD and the external
    RAM and LED digit. There are also clock and reset inputs. On line 15, flip-flops
    are declared to hold the state of the instruction decoder. Since there are only
    3 states (for fetching, decoding, and executing), 2 flip-flops are sufficient.
    Lines 16–20 define the storage for the instruction register, program'
