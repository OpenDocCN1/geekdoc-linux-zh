- pgno: 214
  md: '# State Machine Design


    # Objectives


    +   - Introduce the concepts of state machines.

    +   - Discuss the different types of state machines.

    +   - Build counters using D flip-flops and combinational logic.

    +   - Show how a state machine is designed to solve a real problem.


    # Discussion


    # Simple State Machines


    In the last chapter, you saw that you could build logic circuits that store previous
    inputs by altering their internal state. You also used these flip-flops to build
    a simple counter.


    A simple state machine uses one or more flip-flops to store its internal state
    (Figure 7.1). The pattern of ones and zeros on the Q outputs of the flip-flops
    are the current state of the state machine. When a rising clock edge occurs, the
    current state is replaced by the next state. How is the next state determined?
    An easy way is to build a combinational logic circuit that accepts the current
    state as its input and computes the next state as its output. The output of the
    combinational logic is loaded into the flip-flops on the next rising clock edge.
    What is a good example of such a state machine? A counter! The current value of
    the count is held in the DFFs, and this value is passed to a combinational circuit
    that is just a simple incrementer. The output of the incrementer is clocked into
    the DFFs on the next rising clock edge.


    So we already know everything we need to build state machines:


    +   - We know how to build combinational logic circuits.

    +   - We know how to store state information in D flip-flops.

    +   - We know how to connect the combinational logic and the DFFs.


    A state machine that only uses its current state to compute its next state is
    not very interesting (kind of like a person who only talks to himself or herself).
    A more useful variation allows inputs from the environment to affect the state
    transitions (see Figure 7.2). The external inputs interact inside the combina-'
  merge: -1
  img_proc: true
- pgno: 215
  md: '![](img/5124daf79d2807d81e49f49c22f1f8c1_215_0.png)


