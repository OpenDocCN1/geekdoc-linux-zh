  md: '**Asynchronous Delay Report:** The propagation delays for each routed signal
    are listed in this report.


    **Post Layout Timing Report:** This report lists any paths through the placed&routed
    logic which violate timing constraints. For example, a violation would be listed
    if you required the logic circuit to operate at 50 MHz (i.e., all logic operations
    must complete in 20 ns or less) and a path was found with a delay greater than
    20 ns.


    **Bitgen Report:** This report records all the options that were in effect when
    the bitstream file was generated. Any errors that occurred during the bitstream
    generation are also listed here.


    OK, we have answered our questions. Now we can start testing the actual design.


    Open a DOS window and go to the C:\XCPROJ\ADD1_40 directory. Download the 1-bit
    adder circuit to the XS40 Board:


