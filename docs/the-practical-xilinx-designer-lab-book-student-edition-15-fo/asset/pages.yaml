- pgno: 327
  md: 'The two 8-bit numbers to be added are 0x48 and 0x29 (these numbers are in hexadecimal).
    All the data memory in the GNOME is 4 bits wide. A 4-bit number is called a nybble.
    An 8-bit number (or byte) can only be stored by using two memory locations in
    the data RAM: one for the least-significant nybble (LSN) and one for the most-significant
    nibble (MSN) (see Figure 9.3). Let''s assume that the MSN of 0x48 (which is 4)
    is stored in register R1 of the data RAM and the LSN is stored in R0. The second
    operand is stored similarly, with the MSN placed in R3 and the LSN placed in R2.
    The 8-bit result of adding these two numbers will be stored in R5 (MSN) and R4
    (LSN).


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_327_0.png)


    # Figure 9.3 The arrangement of bits and nybbles in a byte.


    Upon startup, the program RAM is already loaded with the instruction opcodes and
    the PC is initialized to 0 so it points to the first instruction (Figure 9.2a).
    (In the figure, the instruction mnemonic is shown instead of the binary opcode
    in order to make the execution of the program easier to understand.) The operands
    are already stored in R0, R1, R2, and R3. The RAM for the result, however, is
    not initialized and contains some random number (represented by ?). The accumulator
    is also not initialized, and neither are the carry or zero flags. The carry flag
    acts as both the input carry bit to the ALU and stores the output carry after
    the ALU adds two 4-bit numbers. For this program, you want to start with C = 0.
    The clear_c instruction clears the carry bit. Note that in Figure 9.2b the carry
    bit is now zero and the PC has been incremented so it points to the next instruction.


    The next instruction, load R0, is used to load the LSN of the first operand into
    the accumulator. In effect, the instruction mnemonic means "load the value found
    in R0 into the ACC." Note that while the address of the RAM location that holds
    the data (R0) is explicitly mentioned, the place where the data is transferred
    to (ACC) is only implied. After executing this instruction, the ACC holds the
    value 0x8 and the PC has been incremented.


    The next instruction (Figure 9.2c) is add R2, which you might guess would be an
    instruction to add the contents of R2 to something. But what? Again, the implied
    operand is the accumulator. This instruction actually means "add the value found
    in R2, the value in the ACC, and the bit in the C flag, and store the result in
    the ACC while loading the C flag with the carry output." In this case, the result
    (in both hexadecimal and binary representations) will be:'
