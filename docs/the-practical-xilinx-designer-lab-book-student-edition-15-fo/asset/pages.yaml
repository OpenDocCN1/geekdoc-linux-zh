- pgno: 425
  md: 'Pins 14, 16, and 17 of J1 are used to download bitstreams into the XC95108
    CPLD. The XS95 Lite uses the JTAG port to configure the CPLD. Bitstream data enters
    through pins 16 and 17 of J1 and appears on the TMS and TDI inputs (pins 29 and
    28) of the XC95108, respectively. The data is loaded into the CPLD whenever a
    rising edge appears on the TCK input of the XC95108 (pin 30). TCK is driven by
    pin 14 of J1 through a 74LS14 Schmitt-trigger inverter. The 74LS14 provides hysteresis
    which cleans up the clock edges that are degraded by the trip through the parallel
    port cable. The XSLOAD program accounts for the signal inversion introduced by
    the 74LS14.


    (When making these connections, don''t forget to connect pins 7 and 14 of the
    74LS14 chip to ground and 5V, respectively.)


    There is also a return path from the XC95108 back to the PC parallel port. The
    TDO output of the CPLD''s JTAG port (pin 59) drives through another 74LS14 inverter
    to pin 11 of J1. A pull-up resistor is attached to the output of the inverter
    to provide extra current for driving the cable to the PC parallel port. The PC
    can monitor the status of the XC95108 through pin 11 of the parallel port.


    Pins 2-9 of J1 are used to apply test signals to the CPLD once a new circuit has
    been downloaded. The signals applied through pins 2 and 3 of J1 are suitable for
    use as clock signals for sequential circuitry since they pass through Schmitt-trigger
    inverters. The other signals can serve as level inputs, but they should not be
    used as clocks.


    The correspondence between the pins of J1, the pins of the XC95108 CPLD, and the
    arguments of the XSPORT program are shown in Table A.8.


    # LED Display


    The connections between the LED digit and the XC95108 CPLD are depicted in Figure
    A.12. Two 220Ω resistors are placed in the ground returns of the LED digit to
    limit the amount of current sourced from the CPLD outputs. The connections between
    the CPLD pins and the LED digit segments are listed in Table A.9. (Note that the
    XS95 Lite, unlike the XS40 Lite, provides access to the period segment, S7, of
    the LED digit.)


    # Memory


    The connections between the XC95108 CPLD and the 32 KByte static RAM are shown
    in Figure A.13. Not shown are the connections to ground and 5V on pins 14 and
    28 of the RAM package, respectively.


    The chip-select is pulled high through a 10KΩ resistor to disable the RAM when
    the CPLD is being configured. This lets us load values into the RAM and then reconfigure
    the CPLD without corrupting the RAM data while the CPLD pins are tristated.'
  merge: -1
  img_proc: true
