    # An Edge-Triggered D Flip-Flop


    Now we can use the clocked SRFF to build an edge-triggered D flip-flop. The ABEL
    code is shown in Listing 6.7. Lines 13 and 14 describe the master clocked DFF
    and lines 15 and 16 describe the slave DFF that follows. The slave clock is an
    inverted copy of the master clock.'
