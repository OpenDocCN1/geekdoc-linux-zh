- pgno: 8
  md: '# Introduction


    So, what is this book about? It all started in July of 1993 when my associate
    department head in the EE department at NCSU asked me to teach the lab session
    for the introductory sophomore digital design course. This is the academic equivalent
    of being asked to clean the grease trap, but assistant professors don’t say that
    to associate department heads.


    Since I was going to have to teach the lab session, I tried to think of ways to
    make it interesting. To me, at least! The idea of spending three hours trying
    to help twenty students debug ten protoboards with spaghetti-wiring threatening
    to engulf us all was not attractive. Then we would have to rip all the work apart
    at the end of each lab session to make room for the next group. That meant there
    wouldn’t be a chance to build upon what was accomplished from week to week.


    I considered the use of FPGAs in the sophomore lab. FPGAs would let the students
    write “software-like” hardware descriptions instead of cutting and clipping wires.
    Granted, student software can look as much like spaghetti as their wiring, but
    at least they could be handed a working description of a circuit that they could
    modify, compile, and load into an FPGA. And writing a hardware description takes
    less time than wiring together chips (especially when you add in debugging time)
    so the students could do more challenging designs while they were in lab. It would
    also be easier for them to redesign portions of their circuit if they found they
    were taking the wrong approach. And they might do more iterations to improve their
    designs since they wouldn’t have to build each one from scratch. They could even
    do their designs outside of the lab session and bring in their hardware descriptions
    on floppy disks so the circuits could be tested in an actual FPGA.


    From the instructor’s viewpoint, FPGAs lower lab operating costs since a single
    chip replaces a cabinet of TTL parts. And the time to clean-up lab stations between
    sessions is eliminated because the FPGA can be erased in seconds. A student’s
    design could even span multiple sessions since the FPGA design can be saved and
    recalled from disk as often as needed. These factors would help to improve the
    size and challenge of designs that students can work on. It seemed like a good
    idea.


    We had plenty of software tools for FPGA design on our system of networked workstations.
    However, after the students finished their lab course, what then?'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'How would a student build a digital circuit if he/she didn’t have access to
    a workstation and a bunch of tools costing $10,000? If this forced a student back
    to designing with TTL chips, then teaching FPGA-based design in the labs wouldn’t
    be very useful. The FPGA design environment had to be affordable so that a student
    could own one and use it once they finished the lab course.


    Luckily, I had attended an FPGA conference and saw a $40 FPGA with 3,500 gates
    and a set of free software tools. The FPGA was not cheap, but it was less than
    what a drawer full of TTL chips would cost. The 84-pin FPGA could be mounted on
    a standard breadboard along with some interface circuitry for about $120. That’s
    pretty cheap for a complete FPGA design environment.


    The FPGA-based protoboards were used for two different labs throughout the semester.
    Every lab did not go smoothly, of course, but it was relatively painless when
    you consider the magnitude of a switchover from using TTL devices to FPGAs. And
    we only burned up one FPGA during the semester so the operating costs were low.


    After several years, the company that provided the FPGAs for the labs exited the
    programmable logic market and the chip was eventually discontinued. Luckily, I
    managed to connect with Jason Fein Smith at XILINX and reached an agreement to
    re-write the labs based on their XC9500 CPLDs and XC4000 FPGAs and their Foundation
    Series software package. The prices of their chips have fallen into the $10-$20
    range. And they agreed to include the Foundation tools on a CDROM with every lab
    book so the students could each have their own copy.


    This book contains a complete set of lab sessions on using both CPLDs and FPGAs
    for beginning logic design. The material is organized into the following chapters
    and appendices:


    +   - **The Digital Design Process** discusses the steps involved in designing
    a digital circuit and shows how to build a circuit using TTL chips.

    +   - **Programmable Logic Design Techniques** lists some advantages of using
    programmable logic, discusses the evolution of programmable logic, and demonstrates
    the use of the XILINX F1 design tools.

    +   - **Combinational Logic** discusses several commonly-used logic circuits and
    demonstrates how to design and implement an LED decoder circuit.

    +   - **Modular Designs and Hierarchy** discusses the advantages of step-wise
    refinement and encapsulation in the design process and shows how the F1 package
    supports these concepts.

    +   - **Electrical Characteristics** describes various I/O drivers and timing/delay
    models of CPLDs and FPGAs.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Flip-Flops


    introduces sequential logic by building several types of level-sensitive and edge-triggered
    flip-flop circuits.


    # State Machine Design


    shows design examples for a counter and several versions of a controller for a
    drink machine.


    # Memories


    discusses how random-access memories are organized and shows how to build a small
    memories using flip-flops and logic gates, how to use built-in FPGA memories,
    and how to use external memory chips to build a FIFO.


    # The GNOME Microcomputer


    describes the architecture, instruction set, and construction of a simple, four-bit
    microcomputer.


    # The DWARF Microcomputer


    describes how to extend the GNOME microcomputer to eight bits and adds more addressing
    modes, subroutine support, and interrupts.


    # Appendix A


    shows how to build a CPLD or FPGA-based prototyping board. It also shows the connections
    between the programmable logic device and other components. You will need this
    information to do the examples in each chapter.


    # Appendix B


    gives an overview on using the ABEL hardware description language for FPGA designs.


    Each chapter begins with a discussion of the logic design principles that will
    be applied in that chapter. This is followed by an experimental section where
    you can build and test logic circuits that demonstrate those principles. My guiding
    principle is that expertise can only be developed by building and testing logic
    designs. In order for this book to teach you how to design with FPGAs and CPLDs,
    you have to actively work the examples. This is not the kind of book that you
    can read in bed and get anything out of it. It''s the kind of book that belongs
    by the computer while you go through the examples, or on the lab bench while you''re
    testing an FPGA or CPLD to find out if it''s working. By the time you''re done
    with all the chapters, the book should be scuffed and marked-up beyond belief.
    Practice makes perfect, but it''s rarely pretty.


    Each chapter ends with a list of additional projects that give you some ideas
    for extending and building upon the designs described in each chapter. Hopefully,
    you will find doing designs with FPGAs and CPLDs so easy that you will tackle
    more challenging projects than you would otherwise.


    After perusing the book, you will notice many important topics that are not covered
    in these chapters. If you pointed out these omissions to me, I would even agree
    that they are important topics. But any book is a trade-off between what we want
    to do and what we have time to do well. This book is intended to be the start
    of your education in the use of FPGAs and CPLDs, but not the end. If this book
    imparts enough knowledge so you can extend your expertise'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'through further study of the FPGA/CPLD datasheets, application examples, and
    case-studies, then it has achieved its purpose.


    There are two intended audiences for this book:


    Beginning electrical and computer engineering students. This audience is learning
    the theoretical and practical aspects of digital logic design. This book is oriented
    toward the practical portion. It can be understood by someone with a knowledge
    of Boolean arithmetic, Boolean operations, and binary number systems. For a formal
    digital logic design course, the initial chapters of this book serve as a practical
    supplement to any of the great number of standard texts on digital design. The
    final two chapters present two simple, extendible microcomputer architectures
    that students can experiment with in a beginning computer design course.


    Practicing engineers and hobbyists. This audience is already well-versed in designing
    and building digital logic circuits, but may not have had the money or time to
    get acquainted with programmable logic. The directions for creating a prototyping
    environment for around $100 will get them past the first obstacle. And while they
    will not need the digital logic fundamentals discussed in the first few chapters,
    the worked-out examples will be helpful for getting started quickly. The final
    chapters on the GNOME and DWARF microcomputers should also give them a good grasp
    of the size of designs that can be housed in FPGAs and CPLDs.


    No book gets done in isolation, and this one is no different. I would like to
    thank Jason Feinsmith of XILINX for providing me with the opportunity to translate
    my labs to the XILINX programmable logic family. And Tom Robbins, Nancy Garcia,
    and Rose Kernan of Prentice Hall were inspirational as they guided this manuscript
    to publication in record time. Also, thanks to all the students, faculty, and
    reviewers at various universities who suffered through previous incarnations of
    this material and made helpful suggestions and corrections. In particular, I''d
    like to thank Jim Harris at Cal. Polytechnic Institute, Bob Reese at Mississippi
    State, Jan Van der Spiegel at the University of Pennsylvania, Edward Stabler at
    Syracuse University, John Froehlich, University of Harford, Jack Sandell, Central
    Queensland University, and Don Bouldin at the University of Tennessee. Finally,
    I thank my wife, Liz, who supported me through the entire effort.'
  merge: -1
  img_proc: true
