  md: '![](img/5124daf79d2807d81e49f49c22f1f8c1_232_0.png)


    # Figure 7.11 Figure 7.11: I/O and internal states for the drink dispenser controller.


    Once you have the states and I/O, you have to decide how the logic will move from
    state to state under the influence of the inputs and what the outputs will do
    in each case. That is listed in the state transition table of Table 7.3.


    # Table 7.3 State transition table for the drink dispenser controller.


    | Current State | Input | | | | | |

    |---|---|---|---|---|---|---|

    | Current State | Nickel | Dime | Coin Return | Swill | Krunk | Nothing |

    | 0¢ | →5¢ | →10¢ | →0¢ | →0¢ | →0¢ | →0¢ |

    | 5¢ | →10¢ | →15¢ | →0¢, ret_nick = 1 | →5¢ | →5¢ | →5¢ |

    | 10¢ | →15¢ | →20¢ | →0¢, ret_dime = 1 | →10¢ | →10¢ | →10¢ |

    | 15¢ | →20¢ | →25¢ | →5¢, ret_dime = 1 | →15¢ | →15¢ | →15¢ |

    | 20¢ | →25¢ | →25¢, ret_nick = 1 | →10¢, ret_dime = 1 | →20¢ | →20¢ | →20¢ |

    | 25¢ | →25¢, ret_nick = 1 | →25¢, ret_dime = 1 | →15¢, ret_dime = 1 | →0¢, disp_swill
    = 1 | →0¢, disp_krunk = 1 | →25¢ |


    The entries in the table are pretty simple. For example, when the state machine
    is in state 5¢ and the buyer puts in a dime, the state machine moves to the state
    15¢. A more complicated entry occurs when the machine is in state 20¢ and the
    buyer puts in a dime. In this case, the state machine moves to the 25¢ state and
    also activates the output which returns a nickel to the buyer, thus giving change
    for the dime that was put in. After the state machine is in'
