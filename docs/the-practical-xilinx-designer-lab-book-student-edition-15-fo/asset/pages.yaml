- pgno: 333
  md: '0010. This value is not equal to zero, so the program execution loops back
    toward the beginning of the program.


    Now the value 0010 is ANDed with the multiplier, thus testing the second bit of
    the multiplier to see if it is one or zero. If the bit is one, the multiplicand
    is added to the product again. But the multiplicand has already been multiplied
    by 2, thus shifting it left by one bit position. So we can see that as the program
    proceeds, the multiplicand will be shifted left each time through the loop. This
    shifting ensures that the correct number of zeros will be added onto the right
    end of the multiplier each time it is added to the product, just as we saw was
    needed in the example of binary multiplication.


    Of course, the looping has to stop sometime, but when? For this program, the multiplier
    only has 4 bits so the loop should terminate after four iterations. This is handled
    at the bottom of the program when a test is made to see if the mask is zero. How
    can the mask ever equal zero if it starts at 1 and gets doubled every time through
    the loop? Shouldn''t it keep progressing in the sequence 1, 2, 4, 8, 16, 32,...?
    Since the GNOME handles 4-bit values, when the mask reaches eight (1000) and gets
    doubled, the leftmost one falls off the end and the result is 0000. This happens
    after four doublings, which is the same thing as four iterations through the program.
    So the check for the mask being zero terminates the program at the correct point.


    How can the operations shown in Figure 9.4 be performed by the GNOME? Let''s start
    by assigning the various quantities in the flowchart (or variables) to registers:


    | Register | Variable |

    |---|---|

    | R0 | multiplier |

    | R1 | LSN of multiplicand |

    | R2 | MSN of multiplicand |

    | R3 | LSN of product |

    | R4 | MSN of product |

    | R5 | mask |


    Notice that the product requires two 4-bit registers because multiplying the 4-bit
    multiplier and the 4-bit multiplicand can give an 8-bit result. Since the multiplicand
    has to be added to the 8-bit product, the multiplicand is also assigned to two
    4-bit registers. The program that operates on the registers and arrives at the
    product is shown in Listing 9.1.


    The various initialization steps for the multiplication program are performed
    on lines 1–11 in Listing 9.1. The instructions on lines 1–4 load the values to
    be multiplied into the multiplier and multiplicand registers, respectively. Lines'
