    in which the toner-transfer roller is heated may not need to be expanded further
    because it just applies current to a heater coil until a time-out occurs.


    After you determine what the states are, you have to assign a distinct binary
    pattern to each state. A set of D flip-flops in the state machine stores these
    patterns. By examining the contents of the DFFs, we can determine what state the
    circuit is in. For a counter, the assignment of binary patterns to states is usu-'
