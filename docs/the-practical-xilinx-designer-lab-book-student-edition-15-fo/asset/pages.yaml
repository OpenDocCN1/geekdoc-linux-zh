    # Parity Generators


    An even-parity generator accepts M input bits and generates a single output such
    that the total number of logic ones is an even number. For example, if a three-input
    even-parity generator received 010 as an input, it would generate a 1 at its output
    so the total number of ones is 2—an even number. Parity can be useful for detecting
    errors if a computing system is designed so that numbers always have even parity.
    Then if a number is seen with an odd number of'
