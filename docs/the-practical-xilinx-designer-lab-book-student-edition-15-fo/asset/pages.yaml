    # Specialized Memories


    # Synchronous Memory


    The memory described in the previous subsection was asynchronous because new data
    could be written to it just by changing the address lines and/or the write control
    input. As we discussed, reliable writing to an asynchronous memory requires that
    the address lines be stable before the write pulse occurs. And as we have seen
    in the previous chapter, synchronous systems in which all components change their
    state on a global clock edge are easier to analyze for setup and hold-time violations.
    A synchronous RAM component lets us maintain this advantage.


    Figure 8.11 shows a RAM modified for synchronous write operations. Each D flip-flop
    has been modified to include a 2-to-1 multiplexer on its input. One input to the
    multiplexer is the data bus and the other input is driven by the output of the
    flip-flop. The w lines now connect to the multiplexer instead of the DFF clock.
    If w = 0, the value on the data bus is passed to the DFF’s D input. Otherwise,
    the DFF’s Q output is recycled back to its input.


    The entire set of flip-flops in the synchronous RAM all receive the same global
    clock. When a rising edge occurs on the clock line, the DFFs in row i will be
    written with new data from the bus if w_i = 0. All the other flip-flops will reload
    themselves with their current contents.


    # Dual-port Memory


    The RAM architectures we have examined so far are single-port types: There is
    a single bus on which data enters and exits. In some applications it is necessary
    for two different systems to access a RAM at the same time. Dual-port memories
    are used in these applications.


    A simple dual-read/single-write RAM is shown in Figure 8.12. This RAM has one
    I/O bus for reading and writing to the memory locations, and a second'
