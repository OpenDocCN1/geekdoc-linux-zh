  md: '# Multiplexers


    Multiplexers can be used to control the data flow of a design. The following example
    demonstrates how to implement a 16 bit 4-1 registered multiplexer:


    ```

    module mux2

    A15..A0    pin; " Inputs

    B15..B0    pin; " Inputs

    C15..C0    pin; " Inputs

    D15..D0    pin; " Inputs

    Q15..Q0    pin istype ''reg''; " output


    Sel1..Sel0 pin;

    clk        pin;


    Output = [Q20..Q0];

    DataA = [A20..A0];

    DataB = [B20..B0];

    DataC = [C20..C0];

    DataD = [D20..D0];

    Select = [Sel1..Sel0];


    Equations


    Output clk = clk;


    WHEN Select == 0 THEN Output := DataA

    else WHEN Select == 1 THEN Output := DataB

    else WHEN Select == 2 THEN Output := DataC

    else Output := DataD;


    end

    ```


    # Conclusion


    ABEL allows complex behavioral designs to be easily implemented and simulated.
    In addition, the special features and capabilities of the device are easily accessed
    through ABEL property statements. ABEL is a simple yet powerful software tool
    that provides the designer with an efficient language for developing Xilinx FPGA
    and CPLD designs.'
