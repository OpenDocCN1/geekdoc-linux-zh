  md: 'are held at logic 0. The output pins of the FPLD are enabled when the FIFO
    is being written to (wrb=0). This lets the FPLD drive new data into the data bus
    of the RAM. The flow of data is depicted in Figure 8.24a. The RAM write control
    line is pulsed low during a FIFO write operation as long as the FIFO is not full
    (line 90).


    Lines 94–96 handle the situation when data is being read from the FIFO. On line
    94, the output enable of the external RAM is pulled low during a FIFO read operation
    so that the RAM data bus drivers are activated. This lets the RAM drive a data
    value into the FPLD as shown in Figure 8.24b. Naturally we do not want the FPLD
