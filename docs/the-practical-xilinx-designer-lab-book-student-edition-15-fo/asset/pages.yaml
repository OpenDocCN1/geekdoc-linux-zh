- pgno: 249
  md: 'First, we added a new state flip-flop on line 21 called ARMED. This flip-flop
    will be on when the controller is in the Armed state. On lines 26–32 we define
    a set of state names and assign a particular pattern of bits to each one. Note
    that this is just the one-hot encoding we used previously, with the addition of
    the ARMED flip-flop. (The names of the flip-flops are listed in the comment on
    line 25 so you can see which flip-flop is active for each state.) Lines 36–41
    connect the clock, preset, and reset inputs of the flip-flops just like in the
    previous design. The ARMED flip-flop has been added to the statements.


    The STATE_DIAGRAM keyword on line 43 begins the description of our drink dispenser
    controller’s behavior. The keyword is followed by a bracket-enclosed list of the
    flip-flop states that store the state for this state machine. For correct operation,
    the order of these flip-flop names must match with how you ordered the flip-flops
    in the state assignments on lines 26–32.


    The remainder of the state machine description consists of 7 sets of statements—one
    set for each state in the controller. Each set begins with a colon-terminated
    label of the state to which the following statements will apply. On line 46, for
    example, the ST_CENTSO label indicates that the statements on lines 47, 48, and
    49 will describe how the state machine should act when it is in the 0¢ state.


    Lines 47–49 are a simple IF-THEN-ELSE construct. The basic syntax is as follows:


    ```

    IF <boolean expression A == TRUE> THEN <next state B>

    ELSE IF <boolean expression C == TRUE> THEN <next state D>

    ......

    ELSE <next state Z>;

    ```


    The IF-THEN-ELSE statement generates a logic circuit that evaluates a set of Boolean
    expressions involving the inputs to the state machine. The first expression that
    evaluates to a logic 1 (TRUE) will cause the state machine to move into the next
    state listed after the corresponding THEN keyword. If none of the expressions
    are TRUE, then the state machine transitions to the next state listed in the final
    ELSE clause. (Be careful to always terminate an IF-THEN-ELSE statement with a
    semicolon.)


    To make this more concrete, examine lines 46–49. Given that the state machine
    is in the 0¢ state, line 47 says that the controller will move to the 5¢ state
    if a nickel is inserted. If no nickel is inserted but a dime is, then the controller
    moves to the 10¢ state. Finally, if neither a nickel nor a dime is inserted, the
    controller remains in the 0¢ state. This behavior almost matches what is described
    on the first row of our revised state transition table. (We will discuss the slight
    difference later.)'
  merge: -1
  img_proc: true
- pgno: 250
  md: "The IF-THEN-ELSE statement is a very readable way to describe the state transitions\
    \ of a state machine, but how do we describe the actions of the outputs that control\
    \ the dispenser and coin-return mechanisms? This is accomplished with the WITH\
    \ keyword which lets us assign a Boolean expression to a particular output. WITH\
    \ is used after the next-state label in the IF-THEN-ELSE statement. The revised\
    \ syntax is:\n\n```\nIF <boolean expression A == TRUE> THEN <next state B>\n \
    \   WITH <output E = boolean expression F>\nELSE IF <boolean expression C == TRUE>\
    \ THEN <next state D>\n    WITH <output G = boolean expression H>\n...\nELSE <next\
    \ state Z> WITH <output W = boolean expression X>;\n```\n\nBasically, the IF-THEN-WITH-ELSE\
    \ statement not only generates the next-state logic, but it also causes the values\
    \ of the Boolean expressions to appear on the specified outputs when certain conditions\
    \ apply. As before, the circuit evaluates a set of Boolean expressions involving\
    \ the inputs to the state machine. The first expression that evaluates to a logic\
    \ 1 (TRUE) will cause the value of the Boolean equation listed after the WITH\
    \ keyword to appear immediately on the associated output. If none of the expressions\
    \ are TRUE, the WITH clause in the final ELSE clause is activated.\n\nTake lines\
    \ 83–89 as an example of the use of the WITH keyword. Given that the controller\
    \ is in the Armed state, line 84 states that the insertion of a nickel will cause\
    \ the controller to activate the coin-return and return a nickel (RET_NICK=1).\
    \ Lines 85 and 86 require that a dime be returned if a dime is inserted or the\
    \ coin return is pressed, respectively. Lines 87 and 88 activate the outputs for\
    \ dispensing cans of Swill or Krunk if the button for Swill or Krunk is activated,\
    \ respectively. No outputs are activated at all if none of the previous inputs\
    \ are TRUE (line 89).\n\nIt is possible to control more than one output at a time\
    \ using the WITH clause and a brace-enclosed group of Boolean equations. For instance,\
    \ if the coin return input was pressed in the Armed state, the controller could\
    \ return both a dime and a nickel simultaneously (provided the coin return mechanism\
    \ could handle it). The modified IF-THEN-WITH-ELSE statement looks like this:\n\
    \n```\nSTATE ST_ARMED:\nIF NICKEL THEN ST_ARMED WITH RET_NICK=1\nELSE IF DIME\
    \ THEN ST_ARMED WITH RET_DIME=1\nELSE IF COIN_RET THEN ST_CENTS10 WITH {RET_DIME=1;\
    \ RET_NICK=1;}\nELSE IF SWILL THEN ST_CENTSO WITH DISP_SWILL=1\nELSE IF KRUNK\
    \ THEN ST_CENTSO WITH DISP_KRUNK=1\nELSE ST_ARMED;\n```"
  merge: -1
  img_proc: true
- pgno: 251
  md: 'With your new knowledge of the ABEL state machine syntax, you should be able
    to interpret each line of Listing 7.5 and relate it back to the original state
    transition table. In fact, the ABEL compiler which you use to synthesize netlists
    does the same thing. The compiler parses the STATE_DIAGRAM statements and constructs
    its own state transition table. Then the compiler can derive the circuitry for
    generating the next state and the outputs just as you did in the previous sections.
    So the software tools are not doing anything magical.


    We can also re-do the VHDL version of the drink dispenser state machine as shown
    in Listing 7.6. Like the 3-state counter VHDL example (Listing 7.2), this code
    uses two processes: one for computing the outputs and the next state based upon
    the values of the current state and inputs (lines 59–113), and another process
    which just updates the current state with the new next state value (lines 119–127).
    For this reason, we declare two arrays for holding the current and next state
    on lines 37 and 38, respectively.


    The new armed output is added to the interface description on line 25, and the
    current and next state arrays and state definitions are expanded to handle this
    extra bit on lines 37 through 46. The state outputs for this design are attached
    to the elements of the current state array on lines 49 through 55.


    The first process starts by assigning a low logic level to all the combinational
    outputs of the state machine (lines 61–64). This ensures that these outputs are
    set to some value if none of the following conditional statements does so. If
    we did not perform this initialization step, then these outputs would become implied
    latches. The next state array is also initialized to the reset state (with 0c)
    on line 65. This will cause the state machine to restart if it ever gets into
    an illegal state.


    A large IF...THEN...ELSE statement follows on lines 67–112 that uses the current
    state and inputs to compute the next state and the outputs. As an example of how
    the VHDL code works, consider the case when the current state is 20c. Then the
    cents20 flip-flop should be on so the curr_drink_state array should be 0010000.
    This matches the st_cents20 constant so the statement on line 90 is executed.
    This activates the nested IF...THEN...ELSE statement on lines 91–95. If a dime
    is inserted, then execution falls through to line 92. The statement on line 92
    assigns a logic 1 to the ret_nick output. So a nickel will be returned to the
    customer. At the same time, the next_drink_state array is loaded with st_cents25.
    The st_cents25 constant is 0100000, so the next_drink_state(5) element is set
    and the other elements are cleared.


    Continuing the example, the second process transfers the next_drink_state array
    into the curr_drink_state array when a rising edge occur on the clock input. This
    loads curr_drink_state with st_cents25 which is 0100000. This sets the curr_drink_state(5)
    element and resets all the others. The curr_drink_state(5) element is connected
    to the cents25 state output on line'
