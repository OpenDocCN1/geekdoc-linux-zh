    # Figure 8.20 Simulated waveforms for a synchronous memory.


    Both the XS95 and XS40 Board implementations will work the same way. Some examples
    of the actions that can be performed with the synchronous memory are as follows:


    | Action | XSPORT Command Sequence |

    |---|---|

    | Write location 1 (01) with 7 (0111) | XSPORT 01110100

    XSPORT 01110101 |

    | Write location 3 (11) with 10 (1010) | XSPORT 10101100

    XSPORT 10101101 |

    | Read location 0 (00) | XSPORT 0011 |

    | Read location 2 (10) | XSPORT 1011 |


    The MEM2 design uses 51 macrocells of an XC95108 CPLD. Since the LED decoder uses
    7 macrocells, the 4×4 memory must use the other 51 − 7 = 44 macrocells. This is
    a large fraction of the total resources of the CPLD. Obviously, you cannot build
    a very large memory using the techniques shown in this or the previous section.


    # Using Built-In Memory


    To allow designers to use larger amounts of memory in their designs, the XC4000
    series of FPGAs is equipped with internal RAMs. Since the LUTs in FPGAs are essentially
    RAMs which store the logic truth-tables (refer back to Figure 2.6), it is reasonable
    to allow the designer to use these RAMs for general-purpose data storage. Each
    CLB in an XC4000 FPGA has 2 LUTs that can be used as RAMs (Figure 2.7). Each 4-input
    LUT has room to store 2⁴=16 bits, so a single CLB can store 32 bits of data. The
    data can be organized as a 16×2 RAM, a 32×1 RAM, or dual 16×1 RAMs.'
