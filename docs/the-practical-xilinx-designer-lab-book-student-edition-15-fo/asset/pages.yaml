- pgno: 152
  md: '# Electrical Characteristics


    # Objectives


    +   - Discuss some of the electrical characteristics of various types of digital
    inputs and outputs.

    +   - Introduce the concept of gate delay and its effect on the speed of a design.


    # Discussion


    So far, you have written ABEL and VHDL and drawn schematics that describe logic
    circuits, compiled them, simulated them, downloaded them to your XS40 or XS95
    Board, and—magically—they seem to do what you expected. With all the emphasis
    placed on entering and simulating the design files, it is easy to forget that
    there is actually something happening electrically. This chapter will discuss
    and examine some simple electrical characteristics of digital circuits that you
    will need to know so you can figure out why things sometimes do not work as expected.


    # I/O Characteristics


    A simple inverter gate with a standard output is shown in Figure 5.1a. The inverter
    has two transistors: Tₖ which is connected between the output pin of the inverter
    and the +5 V supply, and T₁ which is connected between the output pin and the
    ground. When the input of the inverter is pulled to ground (Figure 5.1b), transistor
    T₁ is turned off and T₁ is turned on. This means that T₁ acts like an open switch
    while T₁ acts like a closed switch. Thus, there is now a low-resistance path between
    the output pin and the +5 V supply. This pulls the output pin up to +5 V. When
    the input is tied to +5 V (Figure 5.1c), the opposite set of actions occurs: Tₖ
    turns off and T₁ turns on, thus creating a low-resistance path from the output
    pin to ground. This drags the output to the ground potential.


    What happens if we apply a voltage to the input that is between +5 V and ground?
    In this case, both T₁ and T₁ could turn on and "fight" each other. T₁ tries to
    pull the output to ground while T₁ tries to pull the output to +5 V. The output
    will settle to a voltage between +5 V and ground and large amounts of current
    will flow from the +5 V supply through Tₖ and T₁ to ground. The question is,'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Figure 5.1 Operation of a simple inverter.


    how close must an input be to ground or +5 V in order to prevent this situation?
    The answer depends on the detailed electrical characteristics of T1 and T2, but
    for TTL, the answer is that a valid low logic level is any voltage between 0 V
    and 0.8 V, and a valid high logic level is any voltage between 2.0 V and 5.0 V.
    For CMOS logic, the voltage ranges are slightly different: 0V–1.0V and 3.5 V–5.0
    V, respectively.


    What happens if we do not connect the input to anything? In that case, the state
    of the circuit is unclear. The inputs to the transistors are not driven to any
    solid voltage and the transistors may be on or off. Thus, the output voltage could
    be anywhere between +5 V and ground. To prevent unconnected inputs from causing
    logic circuits to enter an indeterminate state, some ICs have pull-up resistors
    from every input to the +5 V supply (see Figure 6.2a). When you leave the input
    unconnected, the pull-up resistor, RP, brings the inputs of the transistors up
    to +5 V. The pull-up resistor typically has a large resistance


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_153_0.png)


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_153_1.png)


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_153_2.png)'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'value (over 10K) so that when you want to pull the input to ground, you do
    not have to supply much power to do it. (You would not want to use a low-resistance
    pull-up because pulling the input low would cause a lot of current to flow from
    +5 V through the pull-up resistor to ground.)


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_154_0.png)


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_154_1.png)


    # Figure 5.2 FPLD I/O options.


    The output circuitry can also be modified to have different electrical characteristics.
    The standard output, as we have seen, can be pulled to +5 V or ground through
    the low resistance of a transistor that is turned on. There are some cases, however,
    when you only want the output to be pulled to ground but never to +5 V. Such an
    open-drain output is shown in Figure 5.2b. When the input is at a high logic level,
    the output is pulled to ground through transistor T_l. But when the input is pulled
    to a low logic level, the output is not pulled to +5 V (as it is with the standard
    output) because T_h is missing. Since T_h is missing and T_l is turned off, the
    output is not connected to either +5 V or ground, so it floats. Of course, you
    could attach an external resistor from the output to +5 V to pull it high in this
    case.


    One of the uses of open-drain outputs is performing a wired-AND operation in combination
    with a pull-up resistor (see Figure 5.3). If two open-drain outputs are tied directly
    together, the result will be a low output level if either output is low. If both
    outputs are floating, then the wired-AND output is pulled to +5 V by the pull-up
    resistor. You do not want to try building a wired-AND with gates having standard
    outputs. That is because one gate output may be trying to pull the wired-AND node
    low through its T_l while the other gate tries to pull the node high through its
    T_h. The resulting voltage on the wired-AND node is indeterminate, a large amount
    of current flows, and you might burn up one or both gates.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '![](img/5124daf79d2807d81e49f49c22f1f8c1_155_0.png)


    # Figure 5.3 A wired-AND using open-drain outputs.


    Another type of output is the tristate output. A tristate output can drive to
    +5 V or ground, but it can also be made to float. That is different than an open-drain
    output, which can only drive to ground or float. The circuitry for a tristate
    output is shown in Figure 5.4. Two new Tₑ transistors are added that are controlled
    by an enable input. When the enable input is pulled to +5 V, the Tₑ transistors
    act like closed switches and the gate is enabled (i.e., the output can be driven
    to +5 V or ground). When the enable line is pulled to ground, however, both Tₑ
    transistors open and completely disconnect the output from both the +5 V supply
    and ground. So the output is disabled and it floats. What use is this? Multiple
    tristate outputs can be connected to the same input of another gate and the enable
    lines can be used to prevent the outputs from interfering with each other. When
    one output is driving the input, the other output is disabled so it floats and
    cannot interfere with the first output. Then, by disabling the first output and
    enabling the second, the second output can transmit a signal without interference.
    Thus, the input pin can receive a signal from either of two outputs by intelligently
    controlling the enable lines of the outputs. This principle will be used when
    you create multidrop buses. For example, the memory bus in your PC allows the
    microprocessor to receive information from any one of a large number of memory
    chips. All the memory chip outputs can be hooked to the same bus because they
    all have tristate outputs that are enabled only when a particular chip is supposed
    to transmit some'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'data to the microprocessor. They will not interfere with each other as long
    as only one output is enabled at a time.


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_156_0.png)


    # Figure 5.4 Circuitry for a tristate output.


    Where can all this get you in trouble? Obviously, if you use an open-drain output
    and do not provide a pull-up resistor, you cannot expect to drive the output to
    +5 V. Or if you use a tristate output and do not enable it, you won’t be able
    to drive the output to either +5 V or ground. But there can be, more subtle, problems.
    Suppose you have a single logic gate output that is driving a lot of inputs of
    other logic gates (see Figure 5.5). Further, suppose that these other inputs all
    have 10K pull-up resistors. Now, your output can be pulled to ground through T_7,
    but T_7 has some finite resistance (i.e., it is not a perfect conductor). Suppose
    that the ON-resistance of T_7 is about 100 Ω. The 100 Ω resistance will be trying
    to pull node A to ground while the pull-up resistors try to pull A to +5 V. Thus,
    a voltage divider is formed. The question is, How many inputs can be connected
    to the output before the combined pull-up resistors bring the voltage on node
    A above 0.8 V (the upper limit for a TTL low logic level)? The answer is given
    by solving


    0.8 V = 5.0 V × 100 Ω / (100 Ω + (10,000 Ω / N))


    and it turns out that N = 19. So you can drive 19 gate inputs from the single
    output. This is the maximum allowable fanout of your gate output. Trying to drive
    more gates could lead to problems caused by violating the limits on allowable
    logic levels. (Note that driving the inputs high is no problem because now the
    pull-up resistors help T_A pull the output to +5 V.)'
  merge: -1
  img_proc: true
- pgno: 157
  md: '![](img/5124daf79d2807d81e49f49c22f1f8c1_157_0.png)


    Figure 5.5  Logic gate fanout.


    # Circuit Delays


    Driving 19 other gates may seem like quite a bit, so you might think that worrying
    about fanout is not a high priority. However, there are other factors you must
    consider. One of these is the delay in transmitting a signal. On every circuit
    node there is capacitance. Capacitance acts like a charge bucket that has to be
    filled or emptied before the node can reach +5 V or ground, respectively. There
    is capacitance you want, such as the power filtering capacitors on your XS40 or
    XS95 Boards. There is also parasitic capacitance, which arises just from the geometry
    of your circuit and the fundamental laws of electromagnetism. The parasitic capacitance
    causes most of your problems. Suppose that you are trying to pull 19 inputs to
    ground through a single output. Suppose also that each input has 10 pF of capacitance
    (1 pF = 10⁻¹² F). Thus, there is a total of 19 × 10 pF = 190 pF of capacitance
    being discharged through the 100 Ω ...'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'resistance of T1. How long will it take to discharge all this capacitance and
    pull all the inputs to ground? The time constant of this resistance-capacitance
    combination is 100 Ω × 190 pF = 19 ns. It takes approximately two or three times
    the time constant for the voltage to decay below the threshold, so that is between
    38 and 57 nanoseconds.


    Assume the worst case and let the time delay, t_d, be 57 ns. That is 57 billionths
    of a second, so you may say it is no big deal. However, consider a 200-MHz PC.
    It computes a new answer every 1/200 × 10^6 s = 5 ns. So in the time it takes
    the output to drive all 19 inputs to ground, the PC is able to perform almost
    12 complete operations! The lesson is clear: Fast circuits need to limit their
    fanout.


    The delays caused by fanout are not the only ones you have to worry about. The
    logic gates themselves have a built-in delay (see Figure 5.6). When the input
    to a gate changes, the output does not change instantaneously. This delay is primarily
    caused by parasitic capacitances inside the IC. The time between the change in
    the input to the change in the output is called propagation delay or gate delay.
    There are two types of gate delay:


    t_PHL: This is the time delay between the change in the input and the time the
    output drops from +5 V to ground. (Propagation high → low)


    t_PLH: This is the time delay between the change in the input and the time the
    output rises from ground to +5 V. (Propagation low → high)


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_158_0.png)


    # Figure 5.6 Gate propagation delay.


    Usually, t_PHL and t_PLH are not too different so we lump them together into a
    single gate delay parameter called t_pd. The t_pd of the XC95108 CPLD macro-cells
    ranges from 7.5 to 20 ns, depending upon how much you are willing to pay XILINX
    (faster is more expensive). The situation is more complicated for the XC4000XL
    FPGA because time delays are dependent on the way logic gates are mapped into
    the LUTs within a CLB. For instance, if the logic can be mapped into a single
    F or G LUT, the result is available on the CLB output just 1.6 ns after the inputs
    arrive (based on the timing for an XC4005XL FPGA with −3 speed rating). But if
    the logic function is more complicated and'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'requires the use of the H LUT to combine the outputs from the F and G LUTs,
    then the propagation delay rises to 2.7 ns. Both of these delays are much lower
    than the one for the XC95108 because they ignore the delays of getting the inputs
    and outputs through the I/O pins.


    Why worry about gate delay? Because the more gates your signals have to go through,
    the longer it will take for the final output to be computed. Figure 5.7 shows
    one potential path for the carry signal in a 3-bit ripple-carry adder. Note that
    the carry signal ripples from the least-significant bit to the most-significant
    bit, picking up two gate delays through each stage of the adder. Assuming each
    AND-OR circuit of the carry chain is placed in a single macrocell (CLB), the maximum
    delay through the 3-bit adder is 3 × 20 ns = 60 ns (3 × 3.2 ns = 9.6 ns) for the
    slowest XC95108 CPLD (XC4005XL FPGA). By extension, the maximum delay through
    a 32-bit ripple-carry adder is 32 × 20 ns = 640 ns (32 × 4.7 ns = 102.4 ns). So
    a 32-bit ripple-carry adder could do about 1,500,000 adds per second (6,650,000
    adds per second). This is much slower than the microprocessor in a PC can add
    32-bit numbers. Why does the adder in the PC work so much faster?


    One answer is the carry-lookahead circuit. Carry-lookahead circuits compute several
    carry bits in parallel, so the cascading delays in the ripple-carry adder are
    eliminated. Assume that two binary numbers, aₙ₋₁aₙ₋₂...a₁a₀ and bₙ₋₁bₙ₋₂...b₁b₀,
    are being added. A carry, cᵢ, is generated out of bit position i if both aᵢ =
    1 and bᵢ = 1. A carry can be propagated through bit position i if either aᵢ or
    bᵢ is 1 and the carry input from the previous bit, cᵢ₋₁, is 1. Thus, the carry
    generation and carry propagation signals are


    Gᵢ = aᵢbᵢ

    Pᵢ = aᵢ ⊕ bᵢ


    The following equations show how the Gᵢ and Pᵢ signals are used in a 4-bit carry-lookahead
    adder:


    c₀ = G₀ + P₀ cᵢₙ

    c₁ = G₁ + P₁ c₀

    c₁ = G₁ + P₁ (G₀ + P₀ cᵢₙ)

    c₁ = G₁ + P₁ G₀ + P₁ P₀ cᵢₙ


    c₂ = G₂ + P₂ c₁

