    bus is driven by the address stored in the LSN of the instruction register and
    the RAM data bus drivers are enabled. The LSN of the data from the RAM is latched
    into the LSN of the IR. At this point, the direct operand from RAM has replaced
    the register address in the LSN of the instruction register.


    The final EXECUTE state of the instruction decoder is described on lines 207–245.
    Most of the instructions just place the appropriate bit pattern on the alu_op
    control bus and let the ALU do its thing. However, the SKIP_C (lines 214–216)
    and SKIP_Z (lines 217–219) instructions make use of the carry and zero flags to
    affect the flow of the program by incrementing the program counter if the appropriate
    flag is set. The PC was already incremented at the end of the FETCH phase so that
    it would point to the next instruction. Thus, another increment causes GNOME to
    skip the next instruction completely. (This works because all GNOME instructions
    are 1 byte long.)


    The STORE_DIR opcode (lines 229–232) also handles writing data into the RAM. The
    sel_data_ram control signal is raised so that the data RAM is addressed with the
    address stored in the LSN of the instruction register. The write signal is also
    raised to enable the data bus drivers in the FPLD and to generate the pulse for
    the RAM’s write-enable control line.


    Lines 251–252 connect the clock input to the low-slew buffer. The buffered clock
    drives the state changes in the process on lines 255–274. All changes to the state
    of GNOME occur on the rising edge of the clock (see line 266). This gives us a
    well behaved, synchronous system. Lines 259–264 are activated whenever the reset
    input is held high. Thus, applying a logic 1 to the reset input will put the instruction
    decoder in the FETCH state and the PC will point to the first location of memory
    (000000). This is where GNOME programs always begin.


    An LED decoder is connected to the current value of the accumulator on line 277.
    This lets us monitor the value in the accumulator as programs are executed. (As
    an alternative, we could observe the sequence of instruction addresses by connecting
    it to the LSN of the program counter.)


