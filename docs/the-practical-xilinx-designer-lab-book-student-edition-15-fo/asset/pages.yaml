- pgno: 339
  md: '+   - There needs to be a RAM for storing data. Since the GNOME operates on
    4-bit operands, the RAM should be 4 bits wide. The instruction set can address
    RAM locations with a 4-bit address, so there should be 2⁴ = 16 RAM locations.
    Therefore, a 16×4 memory is needed for the data RAM. For the data memory we can
    use the LSN of 16 locations in the same external RAM that we will also use for
    the program memory.

    +   - Two flip-flops are needed for storing the carry (C) and zero (Z) flags.

    +   - A 4-bit ALU is needed to operate on two 4-bit operands and produce a 4-bit
    result.

    +   - A 4-bit accumulator (ACC) is needed to store the result from the ALU.


    These pieces of the GNOME are shown in Figure 9.6.


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_339_0.png)


    # Figure 9.6 Major pieces of the GNOME microcomputer.


    Now the communication buses between these pieces have to be determined. The ALU
    is a relatively simple place to start. Based on the operations needed to perform
    each instruction as shown in Table 9.3, the ALU only needs to combine the ACC
    with a 4-bit operand stored in the LSN of the instruction register. Then the result
    is stored back into the ACC. The buses necessary to do this are shown in Figure
    9.7.


    We need to get data and opcodes from the external RAM in order to do any operations.
    The first step for accessing the RAM is to send it an address. This address can
    either be the address of a data register if a direct mode operand is being processed
    or the address of the next opcode. Figure 9.8 shows how a multiplexer is used
    to select the source of the external RAM address. The inputs to the multiplexer
    are (1) the LSN of the current opcode in the IR, or (2) the 7-bit program counter.
    One of these inputs is transferred to the address bus of the'
