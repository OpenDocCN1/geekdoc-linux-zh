  md: 'The description of the circuitry begins on line 41–44 by connecting the read
    and write inputs to low-skew buffers (this is only necessary when targeting the
    XC4005XL FPGA). The internal reset signal is generated when the FIFO read and
    write inputs are both low (line 47).


    The two processes on lines 51–58 and 60–70 describe the circuitry shown in Figure
    8.17 that records the type of the last FIFO operation. Lines 72–78 use the values
    in the flag flip-flops to generate the FIFO full and empty status signals. The
    processes on lines 80–90 and 92–102 describe the read and write pointers, respectively.
    The VHDL code replicates the functions shown in Figure 8.16. For example, the
    read-pointer is incremented whenever a read operation occurs as long as the FIFO
    is not empty. The use of the addition operator (+) provided by the std_logic_unsigned
    package lets us describe this behavior very concisely.


    The description of the interface circuitry between the FPLD and the external RAM
    follows. The external RAM is enabled by holding its chip select line low as shown
    on line 104. Since we are only using 16 locations of the external RAM for our
    FIFO, the upper 11 bits of the RAM address bus are held at logic 0 on line 105.
    Line 107 describes a 4-bit multiplexer that connects the read-pointer to the lower
    4 bits of the RAM address bus when the FIFO is being read. At all other times,
    the write-pointer drives the lower part of the RAM address.


    Lines 110–111 setup the data bus to the external RAM. The 4-bit input bus to the
    FIFO drives the lower 4 bits of the RAM data bus and the upper 4 bits are held
    at logic 0 during a FIFO write operation. This lets the FPLD drive new data into
    the data bus of the RAM. Also, the RAM write control line is pulsed low as long
    as the FIFO is not full (line 113). The flow of data is depicted in Figure 8.24a.


    When data is being read from the FIFO, line 115 lowers the output enable of the
    external RAM so that the RAM data bus drivers are activated. This lets the RAM
    drive a data value into the FPLD as shown in Figure 8.24b. To prevent interfering
    with the data coming from the RAM, the FPLD pin drivers are tristated (lines 110
    and 111 with the write control input at logic 1). Line 117 passes the data coming
    from the RAM to the outputs of the FIFO. This lets the FIFO output bus drive whatever
    circuitry is requesting a read of the FIFO.


    Finally, line 119 instantiates an LED decoder module and connects it to the FIFO
    output bus so we can see what value is coming out of the FIFO.


    The VHDL in Listing 8.7 is targeted at an XC4005XL FPGA, but it can also be used
    with an XC95108 CPLD by removing the clock buffers on the read and write control
    inputs. The constraint files used for the ABEL version can also be used with the
    VHDL version, but all the bus indices have to be surrounded with "<" and ">" (e.g.,
