  md: '# Entering the Design Using the ABEL Hardware Description Language


    In this section, I will show you how to enter the design for the Hwy3 output of
    the Trip-Genie using the ABEL HDL. (Go to the following section to see how the
    design is entered using the schematic editor.) ABEL is a simple design language
    that has matured and evolved as programmable logic progressed from PALs, PLAs,
    and SPLDs to FPLDs.


    In the Project Manager window, select "Tools → Design Entry → HDL Editor" (or
    click on the button in the Flow tab of the Project Manager window). In the window
    that appears, click on the radio-button labeled Use HDL Design Wizard and then
    click on OK. Then click on Next in the Design Wizard window that appears to reach
    the Design Wizard-Language window. Here, select the ABEL radio-button and click
    on Next to move to the Design Wizard-Name window. Enter TRIPGENI as the name and
    click Next.


    Now we should be in the Design Wizard-Ports window where we specify the inputs
    and outputs for our design (Figure 2.12). To add an input, click on New and then
    type Hooterville (for example) in the Name field. Click on the Input radio-button
    to set the port to be an input. Repeat these steps for the Mayberry, SilerCity,
    and MtPilot inputs.


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_47_0.png)


    Figure 2.12 Adding inputs and outputs to the TRIPGENI design.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'To add the output of our circuit click on New, enter Hwy3 in the Name field,
    and click on the Output radio-button. Then click on the Advanced button to bring
    up the Advanced Port Settings window. Click on the Combinatorial radio-button
    and then the OK button. Now all the inputs and outputs are defined, so click on
    the Finish button.


    At this point, an HDL Editor window will appear (Figure 2.13) with the skeleton
    of the Trip-Genie logic. You should see the module name and title at the top of
    the file. These are followed by declarations for the input pins and a single combinational
    output pin we added previously. Further down in the file is a section intended
    for logic equations. All we need to do is enter the Boolean equation we derived
    for the Hwy3 output in the previous chapter. This is typed on line 17 and 18 as
    follows:


    ```

    Hwy3 = (Hootersville & !Mayberry # (Hootersville & Mayberry) & (SilerCity & !MtPilot);

    ```


    We have used ABEL operators to express the following Boolean operations:


    | Boolean Operation | ABEL Operator |

    |---|---|

    | AND | & |

    | OR | # |

    | NOT | ! |


    Now we have to check to make sure we have not made any simple mistakes. Select
    the Synthesis → Check Syntax menu item. A small pop-up window will appear informing
    you that the ABEL code is being examined for errors. Within a few seconds, this
    window should be replaced by another window stating Check Successful. Click the
    OK button in this window.


    (You are likely to get syntax errors when you first begin to use ABEL for your
    own designs. Each error will be highlighted in the HDL Editor window and an error
    message will appear at the bottom of the window. You can get error-free ABEL code
    examples by selecting the Tools → Language Assistant menu item. A Language Assistant-ABEL
    window will appear which lists topics on the left-hand side. Click on the + symbols
    to drill-down to a particular topic. Click on the topic and an ABEL code example
    for that topic will appear on the right side of the window. You can cut-and-paste
    the example into your own code and then edit it for your particular design.)


    Once we know there are no syntax errors, we can generate a netlist from the ABEL
    code. The netlist is a distillation of the ABEL code into a set of logic gates
    and the connections between them. First, click on the Synthesis → Options... menu
    item. In the ABEL6 window that appears, click on the Chip radio-button and then
    click OK. This directs the synthesizer to create a netlist'
  merge: -1
  img_proc: true
