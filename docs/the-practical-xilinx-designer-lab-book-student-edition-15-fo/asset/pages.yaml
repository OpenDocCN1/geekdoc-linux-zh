    in the range [0..15]. |

    | add Rd | 0101 d3 d2 d1 d0 | d3..d0 are the address bits of a RAM location in
    the range [0..15]. |

    | add #d | 0010 d3 d2 d1 d0 | d3..d0 are the bits of a value in the range [0..15].
    |

    | xor Rd | 0110 d3 d2 d1 d0 | d3..d0 are the address bits of a RAM location in
    the range [0..15]. |

    | test Rd | 0111 d3 d2 d1 d0 | d3..d0 are the address bits of a RAM location in
    the range [0..15]. |

    | clear_c | 00000000 |  |

    | set_c | 00000001 |  |

    | skip_c | 0000010 |  |

    | skip_z | 00000111 |  |

    | jump #a | 1 a6 a5 a4 a3 a2 a1 a0 | a7..a0 are the bits of an address in the
    range [0..127]. |


    and fill in any immediate data or address bits that are required. Figure 9.5 shows
