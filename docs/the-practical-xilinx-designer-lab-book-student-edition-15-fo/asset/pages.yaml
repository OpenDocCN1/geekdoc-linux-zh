  md: '(Unfortunately, the XC9500 series of CPLDs does not offer the option of using
    macrocells as either logic or memory. So the material in this section is irrelevant
    to those using the XS95 Board. Sorry.)


    Listing 8.5 shows some VHDL code which uses the RAM16X4 RAM module that is constructed
    from two 16x2 built-in RAMs. The COMPONENT declaration for the module is on lines
    20-28 and was determined by looking into the RAM16X4.V6X file found in the directory
    Xilinx\Synth\xilinx\macros\Xc4000e\v6_xnf. The RAM module has 4-bit input and
    output buses, a 4-bit address bus, and an active-high write-enable input.


    The RAM module is instantiated on lines 52-58. Since we are only building a 4x4
    memory, we only need two address bits. Therefore, on line 54 the lower two address
    inputs of the module are connected to the address bus. As they are not needed,
    the upper two address bits are connected to the gnd signal which is held at logic
    0 on line 49.


    Since we are targeting the XS40 Board with this design, we need to get some of
    our inputs from the mode pins of the XC4005XL FPGA. This is done on lines 43-46.
    The inputs from the mode pins are concatenated with the 2-bit input bus to create
    the 4-bit inb bus. The inb bus connects to the RAM module on line 55. The remaining
    output, and write-enable ports of the RAM module are connected to their counterpart
    signals in the mem3 design (lines 56 and 57).


    Figure 8.21 shows the simulated waveforms for the MEM3 design. Four writes were
    made to the memory by applying an address and data value and then placing a positive
    pulse on the WE input. During the interval 0-110 ns the hex values of 0xC, 0x3,
    0x5, and 0xA were written to memory locations 0, 1, 2, and 3, respectively. Then
    the values were read back out of these locations between 120 ns and 160 ns. The
    value read from each location matches the data that was written to it, so the
    memory seems to be working.


    The user-constraint file for the MEM3 design is as follows:


    ```

    NET we              LOC=P44;    # B0 argument of XSPORT

