    # Entering Test Vectors


    Test vectors can optionally be added to perform a functional test of the logic
    descriptions. For the XC9500 family, they are included in the JEDEC file which
    can also be used with the JTAG INTEST feature to test the functionality of the
    physical device in the system.


    The TEST_VECTORS keyword signifies the end of the previous section and the start
    of the test vectors that are used to functionally simulate the design. Test vectors
    are entered in the same format as truth tables, and special signals are defined
    to help make the process easier. The three most common are .C., .Z., and .X. The
    .C. signal represents a clock that starts from a logical low, goes to a logical
    high, and returns to a logical low. This is more convenient than entering three
    test vectors for each clock pulse. The .Z. is used to represent signals that are
    3-stated, and the .X. signal represents a don’t care signal. Don’t care signals
    can be used both for inputs and outputs.


