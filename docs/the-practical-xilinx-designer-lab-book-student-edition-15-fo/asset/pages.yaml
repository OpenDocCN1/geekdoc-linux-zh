    a 2-element flip-flop array is sufficient.


    Lines 39–43 define the storage for the program counter, accumulator, instruction
    register, and carry and zero flags. Each of these quantities is declared with
    both a current value and a next value. The current value will be used to control
    the operations of GNOME during a given state, and the next value will become the
    current value as GNOME transitions between states.


    The internal control signals from Figure 9.12 are declared on lines 46–54. This
    includes a 5-element signal array, sum, that will hold the output from the GNOME
    ALU adder. Line 54 declares the 3-bit array which conducts operation codes from
    the instruction decoder to the ALU. The 3-bit patterns for the various ALU operations
    are defined as CONSTANTs on lines 57–62. This is followed on lines 65–76 with
    definitions of the bit patterns for all the opcodes as originally defined in Table
    9.2. The operand bits have not been included in the bit strings. Since the immediate-mode
    and direct-mode operand bits in the opcode may take on any value, they are not
    useful to the instruction decoder for figuring out which instruction is being
    executed. For example, the instruction decoder must decide what to do with a load
    Rd instruction by looking at the upper 4 bits of the opcode since the lower 4
    bits will hold the address of the operand.


    The interface to the control lines of the external RAM is described on lines 81–83.
    Line 81 pulls the RAM chip-select line low so the RAM stays enabled at all times.
    Line 82 lowers the output enable and enables the data bus drivers in the RAM whenever
    the internal read control line goes high. Line 83 lowers the RAM’s write-enable
    whenever the internal write control line goes high. The write enable is gated
    by the clock so it only goes low during the last half of each clock cycle. This
    is done to make sure the RAM’s address and data buses stabilize during the first
    half of the clock cycle before the write occurs.


    The address multiplexer for the RAM address is described on lines 86 and 87. When
    GNOME is trying to access operand values from the data section of the RAM (sel_data_ram=1),
    the RAM address is driven by the operand address stored in the LSN of the IR with
    1111111111 prepended. Otherwise when GNOME is fetching an opcode from the program
    section of the RAM (sel_data_ram=0), the current value of the PC is gated to the
    lower 7 bits of the RAM address with 00000000 prepended as the upper 8 bits.'
