- pgno: 228
  md: 'So we have to explicitly describe the connection of the clock input to one
    of the clock buffers. This is done on lines 26 and 27. On line 26, the main clock
    input is connected to an input buffer (IBUF) module. Then the output of the IBUF
    module is connected to the input of a general-purpose clock buffer (BUFG) on line
    27. The output of the BUFG, buf_c, becomes the clock that drives the state updating
    process. (The IBUF and BUFG interfaces are described by the COMPONENT statements
    on lines 18–21.) You must use this clock input buffer circuitry when you are targeting
    the XC4000 FPGAs. For the XS95 Board and the XC9500 CPLDs, you can remove these
    buffers and use the clock input directly.


    The simulated waveforms for the up/down counter are shown in Figure 10.10. The
    RESET input is activated from 0–10 ns and resets the {Q1,Q0} state vector to 0.
    When RESET is released, the counter begins to count down since UP=0. The counter
    progresses in the sequence 0, 2, 1, 0, and rolls-over back to 2 over the period
    10–50 ns. Then we raise the direction control so UP=1 at 50 ns. This makes the
    counter increment over the 50–100 ns period. Finally, we raise RESET again at
    100 ns. Since it is a synchronous reset, the counter moves from state 1 to 0 only
    at the next rising clock edge at 106 ns. The state machine seems to be doing what
    we want.


    A constraint file for the CNT3 design should assign the inputs and outputs like
    this for the XS40 Board:


    ```

    NET c      LOC=P44;  # B0 argument of XSPORT

    NET reset  LOC=P45;  # B1 argument of XSPORT

    NET up     LOC=P46;  # B2 argument of XSPORT

    NET q0     LOC=P25;  # S0 LED segment

    NET q1     LOC=P26;  # S1 LED segment

    NET outp0  LOC=P24;  # S2 LED segment

    NET outp1  LOC=P20;  # S3 LED segment

    ```


    Or use the following constraints for the XS95 Board:


    ```

    NET c      LOC=P46;  # B0 argument of XSPORT

    NET reset  LOC=P47;  # B1 argument of XSPORT

    NET up     LOC=P48;  # B2 argument of XSPORT

    NET q0     LOC=P21;  # S0 LED segment

    NET q1     LOC=P23;  # S1 LED segment

    NET outp0  LOC=P19;  # S2 LED segment

    NET outp1  LOC=P17;  # S3 LED segment

    ```


    The clock input must be assigned to either B0 or B1. These inputs pass through
    a Schmitt-trigger buffer on the XS40 or XS95 Board that removes any spurious glitches
    caused by the slow transitions of the PC parallel port signals. Using any of the
    B2–B7 bits may cause the counter to decrement erratically. This will be true for
    any sequential design we do.'
  merge: -1
  img_proc: true
