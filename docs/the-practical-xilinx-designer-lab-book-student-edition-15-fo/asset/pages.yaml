    NET sb     LOC=P45;   # B1 argument of XSPORT

    NET rb     LOC=P46;   # B2 argument of XSPORT

    NET q      LOC=P25;   # S0 LED segment

    NET qb     LOC=P26;   # S1 LED segment

    ```'
