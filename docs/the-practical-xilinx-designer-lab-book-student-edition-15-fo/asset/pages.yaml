- pgno: 123
  md: 'PONENT statement of VHDL. The COMPONENT statement is placed between the opening
    statement of the ARCHITECTURE section (line 31) and the BEGIN keyword (line 40).
    Following the COMPONENT keyword is the name of the interface of the module that
    is going to be used (evpar2). This is followed by the PORT keyword and then a
    copy of the I/O declarations found on lines 9 and 10 is placed on lines 35 and
    36. Then the COMPONENT block is ended with the END COMPONENT keywords.


    Once the interface to the evpar2 module is known, it can be instantiated in the
    ARCHITECTURE section to build the 4-bit parity generator circuitry (lines 41-43).
    Each of these lines starts with a distinct identifier that names the module being
    instantiated. Each identifier ends with a colon followed by the type of module
    that is being instantiated (evpar2 in all three statements). This is followed
    by the PORT MAP keywords and a parenthesized list of connections between the instantiated
    module and signals in the top-level module (evpar4). For example, on line 42 the
    b0 input of the par1 module is connected to the b2 input of the evpar4 top-level
    module. And b1 of the par1 module is connected to the b3 input of evpar4. Finally,
    the par output of the par1 module is connected to the tmp(1) signal. (The name
    of the I/O terminal for the lower-level module is always placed to the left of
    the => connection operator, while the name of the I/O or signal in the top-level
    module is placed to the right.)


    Where did the tmp(1) signal come from? This is an element of the 2-element tmp
    array that was declared on line 39 (the other element is tmp(0)). The SIGNAL keyword
    indicates that the tmp array contains the values for signals, and the type STD_LOGIC_VECTOR
    indicates these signals carry logic values. The placement of the SIGNAL statement
    between the ARCHITECTURE and BEGIN statements means that the tmp array elements
    can only be accessed within the scope of the evpar4 module (i.e., the values in
    tmp are private and cannot be seen by any other modules). The tmp array is used
    to hold the outputs from the par0 and par1 modules (lines 41 and 42). Then the
    tmp array elements are used as inputs to the top module (line 43). The top module
    combines the parity bits from the two 2-bit fields and places the final parity
    bit for all 4 bits onto the par output.


    The evpar8 module is very similar to the evpar4 module. The main difference is
    that the evpar8 module uses both the 2-bit and 4-bit parity generator modules
    to do its calculations. Therefore it must use COMPONENT statements within its
    ARCHITECTURE section to declare the interfaces for the evpar2 module (lines 60-66)
    and the evpar4 module (lines 67-73). The 4-bit parity generators are used to compute
    the parity for the lower 4 bits of the input vector (lines 76-77) and the upper
    4 bits (lines 78-79). The outputs of the 4-bit parity generators are combined
    by a 2-bit parity generator to create the final output (line 80).'
  merge: -1
  img_proc: true
