    In addition to asynchronous RAMs, the XC4000 series also offers synchronous RAMs
    and dual-port RAMs. Figure 8.22 gives an example of using an internal 16×2 dual-port
    synchronous RAM in a schematic. The RAM was instantiated by selecting the RAM16x2D
    symbol from the SC Symbols window of the schematic editor. It is equipped with
    a normal address bus (A3..A0) that controls which memory location will be written
    or read using the INP0..INP0 input bus and SP01..SP00 output buses, respectively.
    In addition, a second read-only port is provided that lets you enter an address
    through DPRA3..DPRA0 and read the contents of the memory location through output
    bus DPO1..DPO0. (There are not enough pins on the PC parallel port to drive all
    these address bits, so the upper two bits of each address were attached to ground
    in the schematic.)


