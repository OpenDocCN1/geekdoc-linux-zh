- pgno: 100
  md: 'Once the inputs and outputs are defined, click on the Finish button and an
    HDL Editor window appears with the skeleton of the LED decoder. We could try to
    enter the Boolean equations for the LED decoder into the ABEL file, but this is
    too much work. The Foundation Series tools can derive these equations for us if
    we just enter the truth-table. Listing 3.2 shows the completed ABEL file with
    the truth-table (I added the line numbers for reference purposes; they are not
    part of the ABEL code).


    # Listing 3.2 The ABEL HDL description of the LED decoder.


    ```

    001- module LEDDCD

    002- Title ''LEDDCD''

    003-

    004- Declarations

    005-

    006- D3..DO PIN;

    007- D = [D3..DO];

    008- S6..SO PIN istype ''com'';

    009- S = [S6..SO];

    010-

    011- Equations

    012-

    013- TRUTH_TABLE

    014- (D -> [S6, S5, S4, S3, S2, S1, S0])

    015- 0 -> [1, 1, 1, 1, 0, 1, 1];

    016- 1 -> [0, 0, 1, 0, 0, 1, 0];

    017- 2 -> [1, 0, 1, 1, 1, 0, 1];

    018- 3 -> [1, 0, 1, 1, 0, 1, 1];

    019- 4 -> [0, 1, 1, 1, 0, 1, 0];

    020- 5 -> [1, 1, 0, 1, 0, 1, 1];

    021- 6 -> [1, 1, 0, 1, 1, 1, 1];

    022- 7 -> [1, 0, 1, 0, 0, 1, 0];

    023- 8 -> [1, 1, 1, 1, 1, 1, 1];

    024- 9 -> [1, 1, 1, 1, 0, 1, 1];

    025-

    026- end LEDDCD

    ```


    Listing 3.2 has a bunch of new things we have not seen before, so let''s take
    some time to review it:


    Line 6: The 4 inputs D0, D1, D2 and D3 are declared here. The ''..'' notation
    lets you enter an entire vector range by giving only the start and end points.


    Line 7: This is just an equate statement that lets us use D as short-hand for
    the [D3..D0] input vector.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'Lines 8-9: These declare the 7-element output vector and its short-hand name.


    Line 13: TRUTH_TABLE is the ABEL keyword that signals the beginning of a truth-table
    (obviously).


    Line 14: The inputs and outputs for the truth-table are listed on this line. The
    ‘->’ separates the list of inputs (on the left-hand side) from the list of outputs
    (on the right-hand side). The short-hand name for the inputs is used, but the
    entire set of output names is written out.


    Lines 15-24: Each combination of inputs and the resulting outputs are listed on
    these lines. The input combinations are written as decimal digits instead of Boolean
    values. This is allowable because we have used a vector field so the ABEL compiler
    has enough information to determine what we mean. (For example, on line 21 we
    set D = 6 which ABEL expands into the assignments D3 = 0, D2 = 1, D1 = 1, and
    D0 = 0.) We could have also used the vector field for the outputs on line 14,
    but it makes more sense to list the outputs for the LED segments individually.
    Then if we make a mistake on a particular segment, it is easier to go back and
    modify the truth-table without inadvertently affecting another output.


    Once the ABEL code is entered, do a syntax check using the Synthesis → Check Syntax
    menu item. This checks to make sure you have got all the commas, semi-colons,
    braces, and brackets in the right place. If there are no errors, then save the
    code as LEDDCD.ABL. Then select the Synthesis → Options menu item and click the
    Chip radio-button in the ABEL6 window that appears (since this is meant to be
    a self-contained design). Selecting the Synthesis → Synthesize menu item will
    generate the netlist. Then close the HDL Editor window and use the Document →
    Add menu item in the Project Manager window to add the LEDDCD.ABL file to the
    LEDDCD95 project.


    We could simulate the design now, but that is a waste of time. The function of
    the LED decoder is to give us a visual presentation of a number. The simulator
    will only show us the waveforms, so we will have to mentally construct which LED
    segments are lit by these waveforms. This is an error-prone task which we can
    avoid just by downloading the design into the CPLD and observing the 7-segment
    LED for each input combination.


    We begin the process of compiling the LED decoder for the XC95108 CPLD by creating
    a user-constraint file for the XS95 Board. Open an HDL Editor window and enter
    the following lines:


    ```

    NET D0 LOC=P46;

    NET D1 LOC=P47;

    NET D2 LOC=P48;

    ```'
