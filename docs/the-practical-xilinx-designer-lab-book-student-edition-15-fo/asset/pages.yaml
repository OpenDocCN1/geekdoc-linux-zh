    # Measuring Gate Delay


    Figure 5.12 shows a simple circuit, DELAY, that demonstrates gate delays. When
    INP transitions to a logic 0 value, the outputs should go to logic 0 after 1 gate
    delay. Then when INP rises back to logic 1, OUT1 will go high after 1 gate delay.
    This places a logic 1 on both inputs to the second AND gate so OUT2 will go high
    1 gate delay after OUT1 did. And OUT3 will go to logic 1 after another gate delay,
    followed by OUT4 1 gate delay later.


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_172_0.png)


    **Figure 5.12**  A simple circuit for demonstrating propagation delay.


    Note the small boxes attached to each input and output terminal. These are probes
    which monitor the net or terminal they are attached to and send the logic values
    to the Waveform Viewer window in the simulator. They were added as follows:


    +   1. Select the **Mode → Test Points** menu item in the **Schematic Capture**
    window.

    +   2. Click on each net or terminal which you want to appear in the **Waveform
    Viewer** window of the simulator.'
