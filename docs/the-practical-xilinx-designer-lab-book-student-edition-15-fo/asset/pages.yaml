    025- W0  = ((A==0) & !WEB); "write signal for first register

    026- W1  = ((A==1) & !WEB); "write signal for second register

    027- W2  = ((A==2) & !WEB); "write signal for third register

    028- W3  = ((A==3) & !WEB); "write signal for fourth register

    029-

