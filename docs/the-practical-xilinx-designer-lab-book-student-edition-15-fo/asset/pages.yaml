- pgno: 182
  md: '# Flip-Flops


    # Objectives


    +   - Show how flip-flops work.

    +   - Show the different types of flip-flops.

    +   - Show how a counter is built from flip-flops.


    # Discussion


    So far we have experimented with combinational circuits that generate their outputs
    in response only to the current input. When the input changes, the output immediately
    changes (after some gate delay, of course). Combinational circuits have no way
    to remember what has happened before; they are creatures of the present.


    This chapter will introduce you to sequential circuits. Sequential circuits are
    able to remember what has happened to them and can use it to alter their future
    behavior. A counter is an example of a sequential circuit because it remembers
    its current value and can add one to it to get to its next value. The current
    value of the counter is referred to as its state. The current state determines
    what the next state of the counter will be. For example, if the counter currently
    stores the number five, then the next time the counter is commanded to increment
    it will store the value six. The change in state from five to six is called a
    state transition.


    The concept of state is easy to understand, but we do not know enough yet to build
    a counter. We must start with something simpler. The simplest sequential circuit
    is an S-R flip-flop (SRFF). An SRFF can remember whether a single bit is one or
    zero. This single-bit memory can be used as the basis of all other sequential
    circuits.


    The operation of an SRFF is shown in Figure 6.1a. The SRFF is built from two 2-input
    NAND gates, each of whose outputs is fed back to one of the inputs of the other
    gate. The remaining inputs of the NAND gates are labeled /S and /R, while the
    outputs are labeled Q and /Q. In Figure 6.1a, both /S and /R are held at +5 V
    while Q = 1 and /Q = 0. Note that with /S = 1 and /Q = 0, the Q output should
    be 1 since one of the inputs to its NAND gate is low. Note also that with'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Figure 6.1 The operation of an S-R flip-flop.


    /R = 1 and Q = 1, the /Q output should be 0 since both inputs to its NAND gate
    are high. So everything is consistent.


    Suppose that /R is pulled to ground (Figure 6.1b). This will immediately cause
    /Q to go to 1 because both inputs to its NAND gate are no longer high. The high
    level on Q enters the other NAND gate which already has /S = 1 and causes Q to
    go low to logic 0. So the logical values of Q and /Q have been inverted. If the
    /R input is returned to +5 V (Figure 6.1c), the /Q output still remains high because
    the low level on the Q output keeps it that way. And the high level on the /Q
    output and the /S input keeps the Q output at a low level. So each of the outputs
    helps to keep the other output at its current level. In this case, the SRFF is
    said to be in the reset state because the Q output is 0. The flip-flop enters
    the reset state whenever the /R input is pulled to ground. It will stay in this
    state as long as both /S and /R inputs are held high.


    Notice that both /S and /R inputs are high in both Figures 6.1a and 6.1c but the
    Q and /Q have switched values. For a given set of inputs a combinational circuit
    always generates the same output, but a sequential circuit does not have to because
    it has an internal state that lets it remember what has happened in the past and
    act differently in the future. Essentially, the state of a sequential circuit
    acts like another set of inputs that affects the operation of the circuit. Figures
    6.1d and 6.1e demonstrate that the /S input can be pulled low to set the Q output
    to a logic 1. Thus, the /S and /R inputs can be used to set or reset the flip-flop,
    respectively.


    What happens if both /S and /R are pulled low at the same time? This will cause
    both Q and /Q to go to logic 1s. Then if the /S input is pulled back to +5 V,
    the situation reverts to the one shown in Figure 6.1b and the SRFF is reset. On
    the other hand, if the /R input were to go high first, then the situation changes
    to the one shown in Figure 6.1d and the SRFF is set. What will happen if we try
    to pull both /S and /R back to +5 V simultaneously? It is very hard to'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'do two things at exactly the same time, especially when you are dealing with
    circuits that respond within nanoseconds. Therefore, the final state of the SRFF
    could have either Q = 1 or Q = 0 depending on whether the /S or /R input was slower
    getting to +5 V, respectively. This is an example of a race condition that occurs
    when the state of a flip-flop is determined by unpredictable delays in the circuit.
    Race conditions cause intermittent failures in logic circuits, and they can be
    hard to find.


    The SRFF will respond any time the /S or /R input changes values. Sometimes we
    would like a flip-flop to change state only at certain times. Figure 6.2 shows
    a modified SRFF that does this. When the C input is low, the outputs of the two
    initial NAND gates are held high. The high outputs make the attached SRFF hold
    onto whatever value it was loaded with. When C goes high, the /S and /R inputs
    can pass through the NAND gates and change the state of the SRFF. (The extra inverters
    are added to correct for the inversion that occurs when /S and /R pass through
    the NAND gates.) Thus, this clocked SRFF will only change state when the clock
    C is high.


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_184_0.png)


    # Figure 6.2 A clocked S-R flip-flop.


    Many times we just want to store the value of a data bit in a flip-flop. Figure
    6.3 shows the circuit for such a clocked data flip-flop (DFF) built from a clocked
    SRFF. When D = 0, then /S = 1 and /R = 0. This makes Q = 0 when the clock is high.
    When D = 1, then Q = 1. So when the clock is high, Q = D. When the clock is low,
    the DFF stores the last value that was on D when the clock was high.


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_184_1.png)


    # Figure 6.3 A clocked D flip-flop.'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'We can be even more stringent in our requirements by stating that the DFF should
    only change state at the instant when the clock falls from a high level to a low
    level. This is equivalent to saying that the flip-flop should be negative edge-triggered.
    The circuit for a negative edge-triggered DFF is shown in Figure 6.4. It consists
    of two clocked DFFs with an extra inverter to make the DFFs operate on opposite
    phases of the clock. When the clock is high (C = 1 in Figure 6.5a), the output
    of the master DFF reacts to any changes in the D input. The change on this output
    will not affect the slave DFF because its clock signal is low and the NAND gates
    on its inputs are turned off. When the clock goes low (C = 0 in Figure 6.5b),
    the output of the slave DFF will begin to react to any change on the output of
    the master DFF. But the output of the master DFF is no longer changing because
    its clock input is now low. So the output of the slave DFF will change at most
    once to reflect the values that were in force at the time C transitioned from
    1 to 0.


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_185_0.png)


    # Figure 6.4 A negative edge-triggered master-slave D flip-flop.


    The DFF is great for storing a state, but the problem arises as to what state
    it starts in when power is first applied to the circuit. Is it storing a 1 or
    a 0? We need a way to initialize the flip-flop to a known state. That is what
    the additional clear circuits of Figure 6.6 do for us.


    The synchronous clear input in Figure 6.6 works as follows:


    +   1. A low-level is applied to the synchronous clear input.

    +   2. The outputs of NAND gates SR1 and SR2 go to a logic 1.

    +   3. The output of the Q NAND gate in the master flip-flop goes to a logic 0.

    +   4. A negative clock edge loads the output of the master flip-flop into the
    slave flip-flop.

    +   5. The Q output of the slave flip-flop goes to logic 0. The flip-flop is cleared.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '![](img/5124daf79d2807d81e49f49c22f1f8c1_186_0.png)


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_186_1.png)


    # Figure 6.5


    The operation of a negative edge-triggered master-slave D flip-flop.


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_186_2.png)


    # Figure 6.6


    A DFF with asynchronous and synchronous clear inputs.'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'Now it is clear why we call it a synchronous clear operation: The circuit needs
    a clock signal where the output of the flip-flop will go to logic 0. What if we
    need to clear the flip-flop right now without a clock edge? That is when the circuitry
    for an asynchronous clear is needed. The asynchronous circuit looks just like
    the synchronous circuit, but since it is in the slave flip-flop its results appear
    immediately on the Q output. No clock is needed before we get the desired result.


    But there is one difficulty: When we bring the asynchronous clear input high again,
    what prevents the master flip-flop from reloading the slave and undoing our clear
    operation? In other words, if the clock is at logic 1 because the NAND gates at
    the entrance to the slave will prevent the master flip-flop output from getting
    in. But the master’s output can enter the clock if at logic 0. For that reason,
    we need to clear both the master and slave flip-flops if we want to do an asynchronous
    clear. This does not prevent the master flip-flop from reloading the slave, but
    it does guarantee that the slave will be reloaded with a logic 0. Therefore, an
    asynchronous clear input has to trigger both the asynchronous and synchronous
    clear circuitry shown in Figure 6.6.


    Once all the major circuitry for the flip-flop is built, you can begin to ask
    questions about finer details of its operation, such as, “What happens if the
    D input changes at exactly the same time as the clock goes from 1 to 0?” Our previous
    discussion of gate propagation delays leads us to believe that such an occurrence
    would have no effect because the input value would not have enough time to propagate
    into the rest of the circuit before the first two clocked NAND gates were shut
    off by the low clock.


    Then you might ask, “How close can I get to the clock edge before the signal changes
    are ignored?” This brings up the concept of setup time, often denoted as *t*<sub>su</sub>.
    You must have the inputs to a flip-flop stabilized at least *t*<sub>su</sub> seconds
    before the clock edge occurs. The exact value of *t*<sub>su</sub> will vary depending
    upon the propagation delays in the input stages of your logic. If your signals
    have to go through a lot of combinatorial logic before reaching the clocked gates,
    then your *t*<sub>su</sub> will have to be longer in order to provide enough time
    for propagation. For the XC95108 CPLD, the setup time is computed for changes
    on one of the package pins relative to a clock transition on one of the global
    clock inputs, and this *t*<sub>su</sub> ranges from 6.5 to 10 ns depending on
    the speed grade of the device. This value reflects both the gate and internal-wiring
    propagation delays. For the XC4005XL-3 FPGA, *t*<sub>su</sub> ranges from 1.1
    to 3.5 ns within a CLB and has a worst-case value of 6.8 ns when measured from
    the package pins.


    Finally, if you are really inquisitive, you might ask, “How soon can I change
    my inputs after the clock edge has passed?” Now you are addressing the issue of
    hold-time, or *t*<sub>h</sub>. It is possible that the SRFF could react to a change
    in an input to one of the clocked NAND gates if it occurred very soon after the
    clock has gone low. This is an effect caused by propagation delays within the
    clock wiring'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'and clocked NAND gates. So you might have to hold your inputs to a flip-flop
    steady for a few nanoseconds after the clock edge occurs. Both the XC4005XL FPGA
    and XC95108 CPLD have hold times of 0 ns.


    It is possible to trade off between tsu and th. You can reduce the hold time by
    placing extra gates on the inputs to the flip-flop. The extra gates will delay
    the propagation of any changes to the flip-flop’s inputs. Therefore, you can change
    your inputs sooner after a clock edge because the changes will not propagate into
    the rest of the circuit fast enough to cause a problem. The trade-off occurs when
    you realize that now you must set up your inputs farther in advance of the clock
    edge so they can propagate through the extra gates. In most cases, the sum of
    tsu and th is approximately constant.


    How do you know if you have violated the setup and hold times for a flip-flop?
    Usually you do not know until it’s too late. Often the circuit appears to work
    just fine, but every now and then the flip-flop moves into the wrong state. In
    some cases the flip-flop enters a metastable state. In the metastable state, the
    outputs of the flip-flop are converging slowly to valid 1 or 0 logic levels, but
    in the meantime they are at invalid levels. Timing problems are difficult to debug
    in practice because it is hard to repeat the exact conditions that cause them.
    Timing simulators can help since they usually will warn you if they notice a change
    to the inputs of a flip-flop that violates tsu or th. A bit of luck helps as well.


    You can build a positive edge-triggered DFF by simply inverting the clock signal
    that drives both DFFs. Given that you know how a positive edge-triggered DFF works,
    you can use it to make a toggle flip-flop (Figure 6.7a). A toggle flip-flop (TFF)
    is built from a DFF by feeding the inverted Q output of the DFF back to its D
    input. Then whenever there is a rising clock edge, the DFF loads itself with a
    value that is the inverse of what it was storing. The T output of a TFF as it
    responds to a clock waveform is shown in Figure 6.7b. Note that the frequency
    of the T output is half that of the clock waveform (i.e., the period is twice
    as long). The TFF acts as a frequency divider. If several TFFs are joined together
    with the T output of each TFF serving as the clock input to the next TFF (Figure
    6.7c), then the waveforms shown in Figure 6.7d are generated. The output of TFF
    i is half the frequency of the output from TFF i − 1. By looking at these output
    waveforms as binary numbers with T2 as the most-significant bit and T0 as the
    least-significant bit, you can see the three TFFs form a 3-bit down counter.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Figure 6.7 Building a counter from toggle flip-flops.


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_189_0.png)'
