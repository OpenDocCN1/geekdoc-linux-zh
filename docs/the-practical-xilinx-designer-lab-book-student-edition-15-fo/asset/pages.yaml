- pgno: 411
  md: '# Final Word


    Well, we''ve come a long way. We learned about simple logic gates, progressed
    on to flip-flops and state machines, and finished up with the construction a pair
    of actual, working microcomputers.


    Hopefully, you''ve done the experiments and projects as you went through the book.
    Some knowledge can only be transmitted by the act of doing. If you have worked
    through the experiments, then three months from now you should still be able to
    design and build an edge-triggered flip-flop or a complete microcomputer. If you
    haven''t done the experiments, then three months from now you''ll be lucky if
    you can even remember where you left this book.


    This book got you acquainted with CPLDs and FPGAs, but there are a lot of topics
    I skimmed over and even more I left out completely (like power estimation, pipelining,
    ...). In my defense, I told you at the start I wouldn''t cover everything. But
    I hope I''ve given you enough so you can read through the data sheet of a programmable
    device and understand 90% of it. Even better, you should be able to understand
    and extend the designs in the application notes provided by the device manufacturers.
    And with the Web in place, you can publish and share designs with others (after
    all, a design is just data files). The most important thing is to keep designing
    and building. Experience is a great teacher, and nothing gives you as many experiences
    per day as FPLDs.


    That''s all!'
  merge: -1
  img_proc: true
- pgno: 412
  md: '# Building the XS40 and

    XS95 Lite Boards


    **Objectives**


    +   - To describe how to build both XC95108 CPLD and XC4005XL FPGA-based prototyping
    breadboards that support the experiments in the rest of this book.

    +   - To show how to install and use the XSLOAD and XSPORT utility programs which
    download and test circuits for the XS40 and XS95 Boards.


    # Discussion


    This appendix describes how to build both a CPLD and an FPGA-based prototyping
    board. These prototyping boards replicate enough of the functionality of the commercially-available
    XS40 and XS95 Boards so that you can do all the design examples in this book.
    For the purpose of discussion, let’s call these the XS40 Lite and XS95 Lite Boards.


    The most important component of the prototyping board is either an XC95108 CPLD
    or XC4005XL FPGA. The FPLD is loaded with bitstream files created by the XILINX
    F1 software tools. The bitstreams are downloaded through the PC parallel port
    into the Lite board. The parallel port is also used to apply signals to the prototyping
    board for testing a downloaded logic circuit. A seven-segment LED attached to
    the FPLD provides a visual indication of how the circuit is acting. A 32 KByte
    static RAM is also attached to the FPLD to provide external data storage. Then
    there are miscellaneous components to provide clocks and regulated power to the
    other components.


    # Experimental


    The following sections will describe how to construct the XS40 and XS95 Lite boards.
    Compared to buying an XS40 or XS95 Board, it probably won’t save you any money
    to build your own prototyping board unless you already have most of the parts
    lying around. And if you already have most of the parts on hand, then I’m assuming
    you have some experience in hooking chips together,'
  merge: -1
  img_proc: true
