  md: '![](img/5124daf79d2807d81e49f49c22f1f8c1_344_0.png)


    **Figure 9.12** The instruction decoder and the control signals.


    counter, accumulator, and carry and zero flags. The internal control signals from
    Figure 9.12 are declared on lines 22–29.


    Synonyms for various items are listed on lines 31–48. The bit patterns that correspond
    to various ALU operations are also listed (lines 38–43), as are the bit patterns
    for the instruction decoder states (lines 46–48).


    Lines 52–63 declare the bit pattern for each opcode as originally defined in Table
    9.2. Note the use of the “don’t-care” symbol in instructions with immediate-mode
    or direct-mode operands. Since these operand bits are stored in the opcode and
    may take on any value, they are not useful to the instruction decoder for figuring
    out which instruction is being executed. For example, the instruction decoder
    must decide what to do with a load Rd instruction by looking at only the MSN of
    the opcode since the LSN will hold the address of the operand.


    The interconnection of the GNOME components begins after line 65. Lines 69–74
    connect the clock input to all the flip-flops in GNOME. All changes to the state
    of GNOME occur on the rising edge of the clock. This gives us a nice, synchronous
    system.


    Lines 76–81 connect the reset input to the asynchronous clear inputs of all the
    flip-flops. Thus, applying a logic 1 to the reset input will put the instruction
    decoder in the FETCH state (00) and the PC will point to the first location of
    memory (000000). This is where GNOME programs always begin.


    The interface to the control lines of the external RAM is described on lines 83–91.
    Line 83 pulls the RAM chip-select line low so the RAM stays enabled at all times.
    Line 84 lowers the output enable and enables the data bus drivers in'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'the RAM whenever the internal read control line goes high. Line 85 lowers the
    RAM''s write-enable whenever the internal write control line goes high. The write
    enable is gated by the clock so it only goes low during the last half of each
    clock cycle. This is done to make sure the RAM''s address and data buses stabilize
    during the first half of the clock cycle before the write occurs.


    The address multiplexer for the RAM address is described on lines 87 and 88. When
    GNOME is trying to access operand values from the data section of the RAM (sel_data_ram=1),
    the RAM address is driven by the operand address stored in the LSN of the IR with
    1111111111 prepended. When GNOME is fetching an opcode from the program section
    of the RAM (sel_data_ram=0), the PC is gated to the lower 7 bits of the RAM address
    with 00000000 prepended as the upper 8 bits.


    Lines 90-91 describe the data bus GNOME uses to write its accumulator value into
    the RAM. The data bus drivers from the FPLD to the external RAM are enabled only
    during the write operation. The value driven into the RAM has the accumulator
    value in its LSN and 0000 as its MSN.


    Lines 93-99 are concerned with the loading of the instruction register. When the
    ld_ir signal is high, the IR is loaded with the opcode that is on the output pins
    of the RAM data bus. (The data bus drivers from the FPLD should be disabled at
    this time so that they do not interfere with the opcode.) The ld_ir_lsn control
    signal is raised when a direct mode operand is retrieved from RAM. In this case,
    the LSN of the IR is loaded with the LSN of the data from the RAM and the MSN
    of the IR retains its value. Finally, if neither the ld_ir or ld_ir_lsn signals
    are at logic 1, then the instruction register is unchanged.


    The circuitry for updating the program counter is described on lines 101-103.
    When the jump_pc signal is at logic 1, the PC is loaded with the value in the
    lower 7 bits of the instruction register. If a jump is not being performed but
    the inc_pc control signal is raised, then the program counter gets loaded with
    its incremented value. And if neither control signal is high, the PC retains its
    value.


    Lines 106-138 show how the ALU performs various operations. When the instruction
    decoder requests an addition operation (lines 106-111), the ALU adds the value
    in the accumulator, the LSN of the instruction register, and the carry flag. The
    result is returned to the accumulator and the carry flag is updated with the carry
    output from the addition. Note that we used the addition operator provided in
    ABEL instead of building our own adder circuitry. To handle the carry flag, we
    had to do a 5-bit addition instead of 4. The input carry was placed into the least-significant
    bit following 4 zero bits while the accumulator and operand values were extended
    to 5 bits by adding a most-significant bit of zero to each. This arrangement places
    the carry input at the least-significant position while the carry output comes
    out in the most-significant bit of the result. The lower 4 bits of the result
    replace the value in the accumulator,'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'while the fifth bit is loaded into the carry flag. The zero flag is just reloaded
    with its value (line 110).


    The exclusive-OR operation (lines 112–116) loads the accumulator with the XOR
    of the accumulator and the LSN of the instruction register. The carry and zero
    flags are not changed. The PASS operation does not do much: It just loads the
    accumulator with the LSN of the instruction register (line 119) and leaves the
    carry and zero flags alone.


    The AND operation (lines 121–126) is used during the execution of a test instruction.
    The accumulator is bit-wise ANDed with the LSN of the instruction register. Then
    the 4 product terms are ORed together and the inverse is stored in the zero flag.
    Thus, the zero flag will contain a logic 1 if all the product terms are zero.
    Otherwise, it will contain a logic zero. The ALU operation for setting (clearing)
    the carry flag is described on lines 127–130 (131–134). The carry flag is loaded
    while the accumulator and zero flag remain unchanged. Finally, if no legal ALU
    operation is requested by the instruction decoder, the accumulator, carry flag,
    and zero flag retain their current values (lines 135–138).


    The state machine that controls the fetching, decoding, and execution of the instructions
    is described on lines 140–183. The FETCH state is relatively simple (lines 142–147):
    The address in the PC is output on the RAM address bus (sel_data_ram=0), the RAM
    data bus drivers are turned on (read=1), the instruction register is loaded with
    the opcode output by the RAM (ld_ir=1), and the program counter is incremented
    (inc_pc=1). Note that these control lines are all driven to their indicated values
    as soon as the instruction decoder enters the FETCH state. The order of the statements
    makes no difference. Because the sel_data_ram and read control lines do not control
    flip-flop elements, their effects are immediately apparent. However, the ld_ir
    and inc_pc signals affect the values that appear on the inputs to flip-flops but
    they do not generate clock signals. Therefore, the instruction register and program
    counter are not updated until the end of the FETCH state when the next rising
    clock edge occurs. One result of this is that the address in the PC of the current
    instruction will remain stable for the entire FETCH cycle and will only be incremented
    after the opcode has been latched into the IR.


    The next rising clock edge ends the FETCH state and transitions the instruction
    decoder to the DECODE state (line 147). The DECODE state is described on lines
    149–167. Unlike the FETCH state, the operations carried out in the DECODE state
    depend upon the opcode in the instruction register. We use the ABEL CASE...ENDCASE
    construct to express succinctly the operation of the instruction decoder. After
    the CASE keyword is a list of Boolean expressions. If a particular expression
    evaluates to a non-zero logic value, then the statements between its : and the
    ; delimiters are activated. For example, if the instruction register contains
    the CLEAR_C opcode, the instruction decoder'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'will not perform any operations other than to move to the EXECUTE state on
    the next clock cycle. Only the instructions which have to read a direct-mode operand
    from the external RAM actually do anything in the DECODE state (lines 159–166).
    In this case, the next instruction decoder state is still EXECUTE, but a brace-enclosed
    set of control signal activations is also listed following the WITH keyword. The
    RAM address bus is driven by the address stored in the LSN of the instruction
    register (sel_data_ram=1) and the RAM data bus drivers are enabled (read=1). The
    LSN of the data from the RAM is latched into the LSN of the IR (ld_ir_lsn=1).
    At this point, the direct operand from RAM has replaced the register address in
    the LSN of the instruction register.


    The final EXECUTE state of the instruction decoder is described on lines 169–183.
    Most of the instructions just place the appropriate bit pattern on the alu_op
    control bus and let the ALU do its thing. However, the SKIP_C and SKIP_Z instructions
    (lines 173 and 174) make use of the carry and zero flags to affect the flow of
    the program by incrementing the program counter if the appropriate flag is set.
    The PC was already incremented at the end of the FETCH phase so that it would
    point to the next instruction. Thus, another increment causes GNOME to skip the
    next instruction completely. (This works because all GNOME instructions are 1
    byte long.)


    The STORE_DIR opcode (line 178) also handles writing data into the RAM. The sel_data_ram
    control signal is raised so that the RAM is addressed with the address stored
    in the LSN of the instruction register. The write signal is also raised to enable
    the data bus drivers in the FPLD and to generate the pulse for the RAM’s write-enable
    control line.


    An LED decoder is connected to the accumulator on lines 185–202. This lets us
    monitor the value in the accumulator as programs are executed. (As an alternative,
    we could observe the sequence of instruction addresses by connecting it to the
    LSN of the program counter.)


    Now we must compile the GNOME1.ABL file. If you try to compile the ABEL file in
    Listing 9.2 for the XC95108 CPLD or XC4005XL, you may receive a message from the
    software saying that the design will not fit. The problem is the complexity of
    the adder logic for the ALU and the program counter. The fitter tries very hard
    to pack as much logic into each macrocell as possible. The fitter would rather
    collapse logic for intermediate signals (i.e., those declared as NODES) into the
    CLBs or macrocells that contain the logic driven by these intermediate signals.
    This is especially true for carry logic in adders. The fitter attempts to do complete
    carry look-ahead so no macrocells have to be used for intermediate carry bits.
    Complete carry look-ahead circuitry for 5 or more bits requires complex logic
    that is hard to fit into single macrocells.


    To limit the amount of carry look-ahead, we can place the following statement
    on line 67: @CARRY 1. This limits the amount of carry look-ahead to 1 adder bit,'
