- pgno: 97
  md: '# Listing 3.1 The VHDL description of the 1-bit adder.


    ```

    001- -- 1-Bit Adder

    002-

    003- LIBRARY IEEE;

    004- USE IEEE.std_logic_1164.ALL;

    005-

    006- -- 1-Bit Adder interface description

    007- ENTITY fulladd IS

    008- PORT

    009- (

    010- input0: IN STD_LOGIC; -- addend bit

    011- input1: IN STD_LOGIC; -- addend bit

    012- carry_input: IN STD_LOGIC; -- carry input bit

    013- sum: OUT STD_LOGIC; -- sum output bit

    014- carry_output: OUT STD_LOGIC -- carry output bit

    015- );

    016- END fulladd;

    017-

    018- -- 1-Bit Adder architecture

    019- ARCHITECTURE fulladd_arch OF fulladd IS

    020- BEGIN

    021- sum <= input0 XOR input1 XOR carry_input;

    022- carry_output <= (input0 AND input1)

    023- OR (input0 AND carry_input)

    024- OR (input1 AND carry_input);

    025- END fulladd_arch;

    ```


    Figure 3.11. The carry output is defined by a sum-of-products equation that also
    follows the gate circuitry of Figure 3.11.


    Once the VHDL code is entered, do a syntax check using the Synthesis → Check Syntax
    menu item. This checks to make sure you have got all the commas, semi-colons,
    braces, and brackets in the right place. If there are no errors, then save the
    code as FULLADD.VHD. Then close the HDL Editor window and use the Document → Add
    menu item in the Project Manager window to add the FULLADD.VHD file to the ADD1_40
    project.


    Now we need to synthesize the netlist from the VHDL code. Click on the button
    in the Flow tab of the Project Manager window. This will bring up the Synthesis
    Implementation window shown in Figure 3.19. Set the options as shown to target
    the 1-bit adder at the XC4006XL FPGA. (You can also select the XC95108 CPLD at
    this point if you are going to test your design with an XS95 Board.) Then click
    on the Run button and the Foundation Series synthesis software will build the
    netlist.'
  merge: -1
  img_proc: true
