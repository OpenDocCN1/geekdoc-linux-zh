- pgno: 198
  md: '# Listing 6.7 ABEL code for an edge-triggered, master-slave D flip-flop.


    ```

    001- MODULE MSDFF

    002- TITLE ''edge-triggered D flip-flop''

    003-

    004- DECLARATIONS

    005- C       PIN;                 "clock input

    006- D       PIN;                 "D input

    007- MQ      PIN ISTYPE ''COM'';    "master Q output

    008- MQB     PIN ISTYPE ''COM'';    "master /Q output

    009- SQ      PIN ISTYPE ''COM'';    "slave Q output

    010- SQB     PIN ISTYPE ''COM'';    "slave /Q output

    011-

    012- EQUATIONS

    013- MQ  = !( !( !(!D & C) & MQB) );  "master clocked DFF

    014- MQB = !( !( !D & C) & MQ );

    015- SQ  = !( !( !(!MQ & !C) & SQB) );  "slave clocked DFF

    016- SQB = !( !( !MQ & !C) & SQ );    "with inverted clock

    017-

    018- END MSDFF

    ```


    Listing 6.8 is a behavioral VHDL description of an edge-triggered D flip-flop.
    The process is now sensitive to changes on the data (d) and clock (c) inputs (line
    18). We need a way to describe a falling edge on the clock input so we can trigger
    a change in the sq output. This is done using the VHDL attribute ''event'' which
    can be attached to a signal and will evaluate to a TRUE condition when the value
    of the signal is different than the last time the process was executed. On line
    20, the conditional in the IF statement is true if the c signal was high during
    the previous execution of the process but is now low. Then line 21 will execute
    and transfer the value on the d input to the sq output. Now if the d input changes
    value but c does not (i.e., c is still low), the process will be executed once
    more. But line 21 will not be executed because c''event is FALSE (i.e., there
    was no change in the value of c). So the flip-flop described by Listing 6.8 is
    edge-triggered rather than level-sensitive.


    The simulated waveforms for the ABEL version of the edge-triggered DFF are shown
    in Figure 6.10. When the simulation starts, both the master and slave flip-flop
    are in unknown states. As soon as the clock rises to a high level, the master
    flip-flop accepts the logic 0 present on the D input. The slave flip-flop is still
    in an unknown state, however, because its clock input is low (the inverse of the
    C input) which blocks the output of the master flip-flop from entering. Once the
    clock falls to logic 0, the slave flip-flop output is set to logic zero. Note
    how the master and slave flip-flops pass the D input along in a type of "bucket-brigade."'
  merge: -1
  img_proc: true
