    # Preparations for Compiling the Logic Design


    At this point, we have entered the Hwy3 logic circuit and we have seen that it
    functions correctly. Now we are almost ready to begin compiling it into a bitstream
    that we can load into an FPLD chip and test. But physically testing the design
    means we will have to apply signals to certain pins of the FPLD that correspond
    to the inputs of our Trip-Genie circuit. We also need to hook an LED to the pin
    that carries the Hwy3 output so we can visually observe if the circuit is operating
    correctly.


    If you built or purchased the XS95 or XS40 Boards (Appendix A), you know that
    certain pins of the XC95108 or XC4005XL chip can be driven by the parallel port
    of a PC connected to the board. This lets us use the parallel port to apply test
    patterns to the chip. Another set of XC95108 or XC4005XL pins is connected to
    a 7-segment LED (see Figure 3.5 for the labeling of the LED segments I have used
    throughout this book). So the XS95 and XS40 Boards have what we need for the job.'
  merge: -1
  img_proc: true
- pgno: 60
  md: "However, the Foundation Series Implementation tools that compile the ABEL file,\
    \ VHDL file, or schematic do not know anything about what FPLD pins are attached\
    \ to the parallel port or the LED segments. Left on their own, the tools will\
    \ assign the inputs and outputs of the Trip-Genie to any pins that are convenient.\
    \ So we need a way to pass our required pin assignments to the Foundation Series\
    \ tools. There are three ways to do this:\n\n+   1. Embed the pin numbers in the\
    \ PIN statements of the ABEL file.\n+   2. Enter the pin numbers as attributes\
    \ of the IBUF and OBUF buffers in the schematic.\n+   3. Create a separate User\
    \ Constraint File (UCF) that lists the pin number for each input and output.\n\
    \nEntering the pin numbers right into the ABEL file is very easy. Figure 2.26\
    \ shows the TRIPGENI.ABL file with the pin numbers added to allow for testing\
    \ the design on the XS95 Board.\n\n![](img/5124daf79d2807d81e49f49c22f1f8c1_60_0.png)\n\
    \n```\nmodule TRIPGENI\nTitle 'TRIPGENI'\n\nDeclarations\n\nHooverville PIN 50;\n\
    Hayberry    PIN 48;\nSilentCity  PIN 47;\nMtPilot     PIN 46;\nHwy3        PIN\
    \ 21 istype 'com';\n\n// <Add your declarations here>\n\nEquations\n\n// <Add\
    \ your equations here>\nHwy3 = (Hooverville & Hayberry & !Hooverville) &\n   \
    \    (SilentCity & !MtPilot);\nend TRIPGENI\n```\n\n**Figure 2.26** The TRIPGENI.ABL\
    \ file with embedded pin assignments.\n\nIn the TRIPGENI.SCH schematic, we can\
    \ double-click on any IBUF or OBUF symbol to set its attributes. For example,\
    \ double-clicking on the IBUF attached to the Hooverville input terminal brings\
    \ up the Symbol Properties window of"
