- pgno: 240
  md: 'a nickel will be returned to the customer. Meanwhile, the drink_state array
    is loaded with st_cents25 by line 184. The st_cents25 constant is 100000, so the
    drink_state(5) element is set and the other elements are cleared. The drink_state(5)
    element is connected to the cents25 state output on line 69. So the drink dispenser
    moves into the 25¢ state. The net result is that if a dime is inserted when the
    dispenser has already received 20¢, then the dispenser will return a nickel and
    hold a total of 25¢. This is exactly the behavior we want.


    As we did with the 3-state counter in the previous section, this VHDL code has
    been augmented with IBUP and BUFG modules to provide a buffered, low-skew clock
    to the state machine flip-flops. This is necessary when targeting the design to
    the XS40 Board. For the XS95 Board, you can remove these components and drive
    the state flip-flops directly with the input clock.


    The simulated waveforms for the ABEL or VHDL version of the drink dispenser control
    circuit are shown in Figure 7.13. Here is the "instant-by-instant" description
    of what happens:


    +   0–10 ns: All the inputs are raised to trigger a reset so the controller moves
    to the CENTS0 state. (Just look for the flip-flop with a 1 stored in it and that
    will tell you what state the controller is in.)

    +   10–20 ns: A nickel is inserted (NICKEL=1) and the controller moves to the
    CENTS5 state.

    +   20–40 ns: Two dimes are added (DIME=1 for two clock cycles) and the controller
    moves through the CENTS15 to the CENTS25 state.

    +   40–50 ns: Swill is selected as the soft drink of choice. The controller signals
    the dispenser mechanism to let out a can of Swill (DISP_SWILL=1). Then the controller
    moves to the CENTS0 state.

    +   50–60 ns: Nothing happens. The controller just sits quietly in the CENTS0
    state, as it should.

    +   60–90 ns: Three nickels are inserted to move the state machine through the
    CENTS5 and CENTS10 states to the CENTS15 state.

    +   90–100 ns: The coin return is activated (COIN_RET=1). This makes the controller
    request that a dime should be released from the coin changer (RET_DIME=1). The
    controller also transitions to the CENTS5 state.

    +   100–110 ns: The coin-return input is still active, so the controller releases
    another nickel (RET_NICK=1) and moves into the CENTS0 state.

    +   110–120 ns: The coin-return is still active. However, the controller has returned
    all the money that was put in so it sits in the CENTS0 state and does nothing.'
