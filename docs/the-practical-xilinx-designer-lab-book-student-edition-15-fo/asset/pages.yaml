- pgno: 117
  md: 'bit has even parity, however.) Then the END keyword ends the 2-bit parity generator
    module definition. This ABEL code is stored in the EVPAR2.ABL file.


    # 4-bit even-parity generator (Listing 4.2):


    The interface for the 4-bit parity generator module, evpar4, is defined on line
    2. It receives 4 input bits (b3..b0) and generates a single parity output (par).
    These inputs and output are declared on lines 5 and 6. The interface to the 2-bit
    parity generator module is specified on line 8. This replicates the interface
    information originally declared on the INTERFACE line of the evpar2 module. Then
    two instances of the 2-bit module are declared on line 10 using the FUNCTIONAL
    BLOCK keyword. The two instances of the evpar2 module are named par0 and par1.
    Two new nodes (tmp0 and tmp1) are declared on line 12 for the sole purpose of
    holding the outputs from the par0 and par1 modules (this is somewhat like using
    temporary variables). Lines 15 and 16 specify that the lower 2 bits of input to
    the 4-bit parity generator (b0 and b1) are connected to the inputs of one of the
    2-input parity generators (par0.b0 and par0.b1). (Note how the inputs and outputs
    of a module are specified by giving the module name and then appending the name
    of the input as a dot-extension.) The output of the module (par0.par) is connected
    to the tmp0 node on line 17. The equivalent connections for handling the upper
    2 input bits with the second 2-bit parity generator are listed on lines 19–21.
    Finally, line 23 XORs the outputs of the two modules (now on nodes tmp0 and tmp1)
    and passes the final parity onto the output of the current module (odd). This
    ABEL code is stored in the EVPAR4.ABL file.


    # 8-bit even-parity generator (Listing 4.3):


    The construction of the 8-bit parity generator module from two 4-bit parity detectors
    is similar to the construction of the 4-bit parity detector described above. Note
    that this is the top-level of our design so no INTERFACE definition is needed
    to define its inputs and outputs since no other module will use it. Note how the
    use of vector notation on lines 15 and 18 reduces the number of lines needed to
    specify connections to the lower-level modules. This ABEL code is stored in the
    EVPAR8.ABL file.


    You can create a schematic mode project called EVPAR_95 for the XS95 Board or
    an EVPAR_40 project for the XS40 Board. In either case, add the EVPAR8.ABL file
    to the project and then open it with the HDL Editor. Create a netlist for the
    design by selecting the Synthesis → Synthesize menu item in the HDL Editor window.
    The synthesizer will automatically look in the EVPAR2.ABL and EVPAR4.ABL files
    to get the descriptions of the lower-level modules.


    After synthesizing the parity generator’s netlist, you can run a functional simulation
    to see how it operates. Add the b0–b7 inputs and the odd output to Waveform Viewer
    window using the Signal → Add Signals... menu item. The 8 inputs should then be
    attached to the 8 lowest bits of the binary counter in the Stimulator Selection
    window. Then click on the ⏯ button in the Logic Simulator window toolbar a few
    times. This will exercise the parity generator for all possible input combinations.
    A partial waveform for the parity'
