- pgno: 110
  md: '# Projects


    1. Design an 8-to-1 multiplexer. Then design a 4-bit-wide, 2-to-1 multiplexer
    that accepts two 4-bit inputs and places one of them on its 4-bit output. How
    are these two circuits different? How much of the XC95108 and XC4005XL does each
    circuit consume?


    2. Modify an LED decoder so that it puts out a valid numeral for the inputs of
    10, 11, 12, 13, and 15. The numerals for these inputs should look like "A", "b",
    "C", "d", "E", and "F" (as close as you can get with the seven segments available).
    How much of the XC95108 and XC4005XL does the new design consume?


    3. Create a new design project called BARCD. This new design should accept a 3-bit
    input and have 7 outputs. The number of outputs that are on should be the same
    as the binary representation of the input. Thus, if all the inputs are 0 (i.e.,
    000), no outputs should be on. If the input is 001, only one output should be
    on. If the input is 010 (2), two outputs should be on. Such a design would be
    useful for an amplitude meter on a stereo receiver: Depending on the strength
    of the signal, more LEDs will light up. Arranging the LEDs in a stack would give
    you a good visual indication of the amplitude of the signal. How much of the XC95108
    and XC4005XL does the new design consume?


    4. Create a new design file called ADD2. This new design should accept a pair
    of 2-bit inputs. The output of the design should be the binary sum of the two
    2-bit inputs. How many output bits will be needed? How much of the XC95108 or
    XC4005XL does the new design consume? How many input patterns are needed to test
    completely the new design to make sure it all works? Extend your design to build
    an 8-bit adder. How many steps would be needed to test such a design?'
