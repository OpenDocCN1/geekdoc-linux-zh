    The state machine that controls the fetching, decoding, and execution of the instructions
    is described by the process on lines 163–248. Once again, a CASE...END CASE; construct
    is used where the value in the curr_st array selects one of three groups of signal
    assignments. All the control signals are assigned default values on lines 166–173
    to prevent the synthesis of implied latches if none of the cases match the current
    state. The FETCH state is relatively simple (lines 176–181): The address in the
    PC is output on the RAM address bus, the RAM data bus drivers are turned on, the
    instruction register is loaded with the opcode output by the RAM, and the program
    counter is incremented. Note that these control lines are all driven to their
    indicated values as soon as the instruction decoder enters the FETCH state. The
    order of the statements makes no difference. Because the sel_data_ram and read
    control lines do not control flip-flop elements, their effects are immediately
    apparent. However, the ld_ir and inc_pc signals affect the values that appear
    on the inputs to flip-flops but they do not generate clock signals. Therefore,
    the instruction register and program counter are not updated until the end of
    the FETCH state when the next rising clock edge occurs. One result of this is
    that the address in the PC of the current instruction will remain stable for the
    entire FETCH cycle and will only be incremented after the opcode has been latched
    into the IR.


