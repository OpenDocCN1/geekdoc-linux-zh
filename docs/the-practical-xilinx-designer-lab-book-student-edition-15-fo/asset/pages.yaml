    The mapping of the adder circuit input terminals, XC4005XL pins, and XSPORT arguments
    is shown below:


    | Adder Terminal | XC4005XL Pin | XSPORT |

    |---|---|---|

    | CARRY_INPUT | 44 | b0 |

    | INPUT0 | 45 | b1 |

    | INPUT1 | 46 | b2 |

    | *** Not Used *** | 47 | b3 |

    | *** Not Used *** | 48 | b4 |

    | *** Not Used *** | 49 | b5 |

    | *** Not Used *** | 32 | b6 |

    | *** Not Used *** | 34 | b7 |


    The ADD1_40.UCF file also assigns the SUM and CARRY_OUT outputs to pins 25 and
    26 of the XC4005XL FPGA, respectively. Pin 25 is attached to segment S0 of the
    7-segment LED while pin 26 drives segment S1.'
