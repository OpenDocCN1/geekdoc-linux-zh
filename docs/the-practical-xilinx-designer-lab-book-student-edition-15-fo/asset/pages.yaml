- pgno: 226
  md: '# Experimental


    # An Up/Down Counter


    Since we have already done all the design work, we might as well build the 3-state
    up/down counter. The ABEL code for it is shown in Listing 7.1.


    The 2 DFFs for storing the state information, Q1 and Q0, are declared on line
    9. The clock input is attached to them on line13.


    Lines 14–31 hold the truth-table for the state machine. Line 15 lists the inputs
    and outputs for the truth-table logic. Note that Q1 and Q0 act both as inputs
    and outputs because the current state information is needed to determine the next
    state. Note also the use of two different types of output-list delimiters. We
    have already seen the -> delimiter used to denote the start of a list of combinatorial
    outputs. But now the => delimiter is added to signal the start of a list of registered
    outputs. In this case, the registered outputs are the Q1 and Q0 flip-flop outputs.
    The => delimiter indicates that the Q1 and Q0 outputs will only change to the
    values listed in the table when the flip-flops receive a rising clock edge (in
    this case). That is just what we want for a state machine.


    Each of the remaining lines in the truth-table just replicates what we have already
    seen in Table 7.2.


    The VHDL version of the 3-state up/down counter is given in Listing 7.2. On line
    23, I define two 2-element signal arrays: one for holding the current state (curr_state)
    and another for holding the next state (next_state). Within the main body of the
    ARCHITECTURE section there are 2 processes that make use of these arrays. The
    first process takes the current state along with the reset and up/down control
    inputs and computes the value for the next state. For example, if the reset is
    active then the next state is set to all zeroes on line 37. In another case, if
    the reset is not active, the current state is 1 (curr_state=01) and the counter
    is counting up (up=1), then line 43 sets the next state to be 2 (next_state<=10).
    Note that this process is entirely combinational: the next state is not latched
    by this process. If there were other combinatorial outputs that were a function
    of the current state, we could place their equations into the IF...THEN...ELSE
    statements of this process. (In this example the outputs are actually placed outside
    the process on lines 29 and 30 since they are simple copies of the current state
    array elements.)


    The second process on lines 55 through 60 just copies the state value held in
    the next_state array into the curr_state array on a rising edge of the clock.
    Thus, this process moves the state machine from the current state to the next
    state. It is in this process where the actual state latches are implied. Also,
    the next state is affected by the reset input in the first process, but does not
    take effect until the second process updates the current state. This makes the
    reset synchronous.'
  merge: -1
  img_proc: true
