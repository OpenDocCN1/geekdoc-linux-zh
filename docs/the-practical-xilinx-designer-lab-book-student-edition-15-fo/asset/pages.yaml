  md: '![](img/5124daf79d2807d81e49f49c22f1f8c1_74_0.png)


    # Figure 2.37 Adding inputs and outputs to the TRIPGENI design.


    At this point, an HDL Editor window will appear (Figure 2.38) with the skeleton
    of the Trip-Genie logic. The first line of the TRIPGENI.VHD file uses the LIBRARY
    keyword followed by the names of the libraries we want to use in our design. Libraries
    are used to encapsulate functions that are generally useful in a wide variety
    of designs. In this example, we can access the macros, definitions, and functions
    from the IEEE library. A library can be subdivided into packages which further
    encapsulate features useful in a certain area or type of application. The USE
    keyword in line 2 indicates that our design will have access to ALL the features
    found in the STD_LOGIC_1164 package of the IEEE library. (The IEEE library and
    the STD_LOGIC_1164 package are standards which are supported by all VHDL tools.)


    Following the library access control lines, lines 4 through 12 define the interface
    to the Trip-Genie circuit. The interface declares the inputs and outputs which
    an external circuit can use to gain access to the features and functions of this
    circuit. The interface definition begins with the ENTITY keyword followed by the
    name of the interface (TRIPGENI in this example). The PORT keyword on line 5 begins
    the list of input and output declarations which follows on lines 6 through 10.
    A declaration begins with the identifier of the input or output followed by a
    colon (:). Then the identifier is declared as an input or output using the IN
    and OUT keywords, respectively. This is followed by the type of the data going
    through the input or output. For most of the examples in this book we will use
    the STD_LOGIC type which allows logic signals to take on the standard 1 and 0
    Boolean states as well as the undefined, high-impedance, and other states. Each
    input/output declaration is terminated with a'
  merge: -1
  img_proc: true
- pgno: 75
  md: "![](img/5124daf79d2807d81e49f49c22f1f8c1_75_0.png)\n\n**Figure 2.38** HDL Editor\
    \ window with the filled-in Trip-Genie VHDL code skeleton.\n\nsemicolon (;) except\
    \ the declaration on line 10 which is immediately before the parenthesis that\
    \ ends the list (line 11). The entire interface definition is terminated by the\
    \ END keyword followed by the name of the interface on line 12.\n\nThe interface\
    \ definition is followed by an architecture definition on lines 14 through 20.\
    \ The VHDL statements in the architecture section describe how the circuitry actually\
