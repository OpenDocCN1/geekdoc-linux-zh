- pgno: 204
  md: 'On line 12, the flip-flop is loaded with the value on the D input. Note the
    use of the := instead of =. The := implies that the Q output will only take on
    the value of the D input when a transition occurs on the clock input.


    Line 13 specifies which signal serves as the clock input that controls the loading
    of the Q output. We have chosen to connect the inversion of C to the clock input
    of the Q DFF. This connection is specified by using the .CLK signal extension.
    Using the inverted C input makes the output of the Q flip-flop change on negative-going
    edges of the C input. (The normal operation of the built-in flip-flops is to change
    states on the rising edge.)


    Line 14 specifies that the inversion of the ACLRB input is attached to the asynchronous
    clear input of the built-in flip-flop. The inversion is necessary because the
    built-in DFF is cleared when its asynchronous clear input is high, but we want
    the clearing to occur when ACLRB is low.


    # Listing 6.11 ABEL code for using a built-in D flip-flop with asynchronous clear.


    ```

    001- MODULE BIDFF

    002- TITLE ''using a built-in DFF''

    003-

    004- DECLARATIONS

    005- C PIN; "clock input

    006- D PIN; "D input

    007- ACLRB PIN; "clear input

    008- Q PIN ISTYPE ''REG''; "DFF

    009-

    010- EQUATIONS

    011- 0 := D; "connect to the D input of the DFF

    012- Q.CLK = !C; "connect the clock with inversion

    013- Q.ACLR = !ACLRB; "connect the asynchronous clear

    014-

    015- END BIDFF

    ```


    In VHDL we really do not have to do anything special to make use of the built-in
    flip-flops of the XC9500 or XC4000 chips. The Foundation Series synthesis tools
    can automatically extract the latches implied by the behavioral VHDL code and
    create a netlist which uses the built-in flip-flops. But if you did want to explicitly
    use a built-in DFF, then Listing 6.12 shows how to do it for the XC9500. The interface
    to the FDPC flip-flop contained in every XC9500 macrocell is declared as a component
    on lines 17 through 24 of the bidff ARCHITECTURE block. The FDPC module is a DFF
    which changes state on the rising edge of the clock (C). A logic 1 on the CLR
    or PRE input will clear or set the flip-flop, respectively.'
