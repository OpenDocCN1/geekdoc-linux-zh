  md: '# Figure 8.2 Writing and reading a memory.


    its stored data, and the other output causes the memory location to write new
    data into itself.


    The truth table of an address decoder for a four-location memory is shown in Table
    8.1. The read line, rn, for memory location n goes to logic 1 when the read control
    input is high and the value on the address bus is n. A memory location is written
    in a similar manner, except the write control line and the individual write lines
    for each memory location are all active when they are at a low logic level. Note
    that none of the read or write lines are active if the user activates both the
    read and the write control inputs (read = 1 and write = 0) and creates a read/write
    conflict. Note also that only one read or write line is active during a memory
    operation; there is no case where two or more registers are reading or writing
    data simultaneously.


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_272_0.png)


