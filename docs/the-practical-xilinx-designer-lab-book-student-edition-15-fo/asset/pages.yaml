- pgno: 248
  md: 'present on the DIME input and believes the customer is putting in a new dime.
    Since the state machine is now in the 25¢ state and no more money is needed to
    get a drink, the state machine dutifully returns a dime. The end result is the
    customer can get a can of Swill or Krunk for only 15¢.


    The problem just described can be solved by adding a new state called “Armed”
    to the state machine and changing the actions that occur in the 25¢ state, as
    shown in Table 7.7.


    **Table 7.7**  The revised truth table for the drink dispenser logic.


    | Current State | Nickel | Dime | Coin Return | Swill | Krunk | Nothing |

    |---|---|---|---|---|---|---|

    | 0¢ | →5¢ | →10¢ | →0¢ | →0¢ | →0¢ | →0¢ |

    | 5¢ | →10¢ | →15¢ | →0¢, ret_nick = 1 | →5¢ | →5¢ | →5¢ |

    | 10¢ | →15¢ | →20¢ | →0¢, ret_dime = 1 | →10¢ | →10¢ | →10¢ |

    | 15¢ | →20¢ | →25¢ | →0¢, ret_dime = 1 | →15¢ | →15¢ | →15¢ |

    | 20¢ | →25¢ | →25¢, ret_nick = 1 | →10¢, ret_dime = 1 | →20¢ | →20¢ | →20¢ |

    | 25¢ | →25¢ | →25¢ | →25¢ | →25¢ | →25¢ | →Armed |

    | Armed | →Armed, ret_nick = 1 | →Armed, ret_dime = 1 | →15¢, ret_dime = 1 | →0¢,
    disp_swlll = 1 | →0¢, disp_krunk = 1 | →Armed |


    In the revised transition table, the state machine remains in the 25¢ state as
    long as any input is at a logic 1 level. Also, no output signals are generated
    for the coin-return or drink dispenser mechanisms in the 25¢ state. The transition
    from the 25¢ state to the Armed state can only occur when all the inputs are at
    logic 0 levels (i.e., this is Nothing input). In the Armed state, the state machine
    will once again respond to inputs for selecting the desired beverage and accepting
    and returning money.


    At this time you should be thinking: “Oh no! I have to go through my entire truth-table
    and insert this new state and correct all my transitions and outputs!” That thought
    would make anybody hesitant to make a correction. For that reason, ABEL provides
    language constructs like those in VHDL to make it easy to describe a state machine
    (at least, easier than what we have been doing). Listing 7.5 shows how the ABEL
    code for our revised drink dispenser controller. Now we can look at how this differs
    from the previous ABEL design.'
