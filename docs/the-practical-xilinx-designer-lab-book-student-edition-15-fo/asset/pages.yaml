    009- c: IN STD_LOGIC; -- clock

    010- aclr: IN STD_LOGIC; -- asynchronous active-high clear

    011- t0: BUFFER STD_LOGIC; -- counter bit 0

    012- t1: BUFFER STD_LOGIC; -- counter bit 1

    013- t2: BUFFER STD_LOGIC; -- counter bit 2

    014- );

    015- END tglcnt;

    016-

