  md: '![](img/5124daf79d2807d81e49f49c22f1f8c1_160_0.png)


    # Figure 5.7 Cumulative gate delays in the carry path of a ripple-carry adder.


    What is the maximum delay through the carry-lookahead adder? It takes one gate
    delay to generate the G_i and P_i signals simultaneously for all the bits. Then
    the sum of products equation for each c_i can be computed in two gate delays (one
    for the AND gates and one for the OR gate). So the final carry-out of the adder
    is computed after three gate delays. However, the total addition is not complete
    until the carry bits have been used to compute the sum bits, s_i. This takes another
    gate delay, so the sum is finally ready after four gate delays. The actual delay
    through an XC95108 or XC4005XL will be determined by how these gates are fitted
    into the macrocells and LUTs, but the basic analysis remains valid.


    Suppose you kept repeating the preceding equations until you had all the equations
    necessary to build a 32-bit adder. What is the maximum delay through a 32-bit
    adder with full carry-lookahead? The answer is four gate delays! How much logic
    would it take to build such an adder? Quite a bit! For carry c_i, one XOR gate
    is needed to compute P_i, and the outputs of i + 2 AND gates must be OR''ed together
    (assuming that you can find AND and OR gates'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'that can handle the large number of inputs involved here. Thus, each carry
    bit requires i + 4 gates. The total number of gates used just for handling the
    carry in an N-bit adder is


    ```

    # of gates = Σ_{i=0}^{N-1} i + 4 = N(N - 1)/2 + 4N

    ```


    So a 32-bit adder with full carry-lookahead requires 624 gates just for handling
    the carry logic (and some of these are large 32-input gates). The carry logic
    for each bit of a ripple-carry adder uses four gates, so a 32-bit ripple-carry
    adder uses only 128 gates for the total carry logic (and these are small 2-input
    gates). The important statistics are as follows:


    | Gates | Gate Delay |

    |---|---|

    | 32-bit ripple-carry circuit | 128 | 64 |

    | 32-bit carry-lookahead circuit | 624 | 4 |


    To go fast, a much larger and more complicated circuit is needed. Full-carry-lookahead
    for a 32-bit adder uses a lot of logic so carry-lookahead is typically done only
    on 4- or 8-bit chunks (see Figure 5.8). The carry output from each section feeds
    into the next section, thus giving a combination of carry-lookahead and ripple-carry
    techniques. If 8-bit lookahead is used in a 32-bit adder, the maximum gate-delay
    through the adder is


    ```

    (32bits / 8bits) × 3 + 1 = 13 gate delays

    ```


    and the number of gates used in the carry circuitry is


    ```

    (32bits/8bits) × [(8)(8 − 1)/2 + 4(8)] gates = 240 gates.

    ```


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_161_0.png)


    # Figure 5.8 A 32-bit adder made from 8-bit carry-lookahead adder sections.'
  merge: -1
