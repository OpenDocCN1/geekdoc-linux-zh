- pgno: 13
  md: '![](img/5124daf79d2807d81e49f49c22f1f8c1_13_0.png)


    # Figure 1.1


    The flow of tasks involved in digital design.


    be 10010 (18 in decimal). This would be one of many entries in a truth table like
    this:


    | Inputs |  |  |  |  |  |  |  | Outputs |  |  |  | |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|

    | A3 | A2 | A1 | A0 | B3 | B2 | B1 | B0 | O4 | O3 | O2 | O1 | O0 |

    | ... | ... | ... | ... | ... | ... | ... | ... | ... | ... | ... | ... | ...
    |

    | 0 | 1 | 1 | 1 | 1 | 0 | 1 | 1 | 1 | 0 | 0 | 1 | 0 |

    | ... | ... | ... | ... | ... | ... | ... | ... | ... | ... | ... | ... | ...
    |


    Once the truth table is written down, the designer has to derive Boolean equations
    that describe how each binary output can be computed from the binary inputs using
    the logical operations of AND, OR, and NOT. There are a variety of manual and
    computer-assisted methods to accomplish this step. For the adder example, the
    result of this step would be five Boolean equations (one for each binary output)
    employing the eight binary inputs.


    Next, the Boolean equations derived in the previous step are transformed into
    a gate-level circuit schematic drawing. Each AND, OR, and NOT operation in the
    Boolean equations is replaced with a corresponding AND gate, OR gate, or inverter
    symbol in the schematic. Lines connect the inputs and outputs of'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'these symbols to represent the passage of binary results between logical operations.


    Before building the circuit, it is a good thing to check and make sure that all
    the previous steps have been completed correctly. Therefore, the gate-level design
    of the previous step is simulated to check its operation. In its most primitive
    form, simulation is performed by the designer, who traces various input combinations
    through the gates of the schematic to determine if the values generated on the
    outputs match what he or she listed in the truth table. If so, great! If not,
    then the designer must go back through the previous steps and find where the error
    was made. Manual simulation is very tedious, so computers usually take care of
    this step.


    At this point it looks like the design might actually work, so the designer can
    go ahead and build a physical circuit. One way to do this is by plugging digital
    integrated circuits (ICs) that contain individual inverters, AND gates, and OR
    gates into a prototyping board and then connecting the gates together with wires,
    as indicated by the gate-level schematic drawing. This is a time-consuming operation
    that is prone to errors.


    Once the circuit is built, the fun begins! The designer applies real inputs to
    the circuit and sees if the outputs match what is listed in the truth table. If
    so, great! If not, then the designer made an error in a previous step. Assuming
    that the simulation performed was complete and correct, then the designer made
    the error while building the circuit. Therefore, he or she can concentrate on
    looking for a physical problem in the circuit. If a simulation had not been performed,
    however, then the problem could have been caused by a mistake in any of the preceding
    steps. This makes the search for the mistake more difficult and increases the
    likelihood that, once found, the remedy for correcting the error will be expensive.
    If, for example, the designer made an incorrect entry in the truth table, then
    this mistake would ripple through the Boolean equations, the gate-level schematic,
    and the physical construction of the circuit. Doing a simulation would have taken
    less time than it will take to find the incorrect entry and disassemble and reassemble
    the circuit to correct the problem.


    # Experimental


    # Building a Transistor-Transistor Logic Circuit


    Design flows and design frameworks always sound great, but you never really notice
    their strengths and weaknesses until you actually try to use one. Therefore, the
    design flow that was just described will be used for a simple product: a router
    for traveling salespeople.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Specifications


    Specifications usually come from customers, and in this case the customer is the
    owner of a small company employing a group of traveling salespeople who service
    four cities: Hooterville, Mayberry, Mt. Pilot and Siler City. The owner''s problem
    is that his salespeople often make poor choices on routes between cities and spend
    more time on the road than they do selling his products. The owner has checked
    the travel time between cities for the various highways that connect them and
    has entered this information on a map (Figure 1.2). What he


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_15_0.png)


    # Figure 1.2


    The four cities and the connecting highways traveled by the salespeople.


    wants is a small, hand-held device that can be given to each salesperson and that
    will indicate the fastest route between any two cities. He even has an "artist''s
    conception" of his Trip-Genie™ (Figure 1.3). The Trip-Genie has four


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_15_1.png)


    # Figure 1.3


    The Trip-Genie showing the six LED outputs for indicating the highways on the
    best route between the two cities selected by two of the four toggle switches.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'switches (one for each city) and six light-emitting-diodes (LEDs) (one for
    each highway). The salesperson would flip two switches to indicate the starting
    and ending cities, after which the Trip-Genie would light the LEDs for those highways
    that are on the fastest route connecting the two cities.


    It should be obvious that what the owner really needs is a smarter sales force
    or, at least, some printed cards that would show the salespeople the fastest route
    between each pair of cities. But the owner has already given you the specifications
    for what he wants. And it is usually the case that you will be more successful
    if you give others what they want instead of what they need. So the following
    subsections will demonstrate the design of the Trip-Genie.


    # Inputs and Outputs


    The logic circuitry for the Trip-Genie will have four inputs for indicating the
    cities at the beginning and end of the route (see Figure 1.4). The circuitry will
    also have six outputs to drive LEDs, which indicate the highways that are on the
    fastest route between the cities.


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_16_0.png)


    The Boolean equations that will describe the logic circuitry operate on the binary
    values 0 and 1. The physical logic circuitry, however, uses voltages to represent
    binary logic values. As part of defining the inputs and outputs of the Trip-Genie,
    you also get to define the correspondence between binary logic values and voltages.
    We will keep it simple in this book and assign logic 0 to any voltage less than
    0.8 V and logic 1 to any voltage greater than 2.0 V. (These are standard thresholds
    for many digital logic families that operate from 5 V power supplies.)


    Finally, you have to decide on the meaning of a logic 0 or 1 for each given input
    and output. For the Trip-Genie, a logic 1 on any input means that the city corresponding
    to that input is either the beginning or the ending city on the route. But if
    an input is zero, then the corresponding city is not on the route. For the outputs,
    if any output is at logic 1, then the highway corresponding to that'
