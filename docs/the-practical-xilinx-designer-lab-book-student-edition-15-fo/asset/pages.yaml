    Then you can use the following command sequences to reset GNOME to the beginning
    of the program and single-step it through the instructions:


    | Action | XSPORT Command Sequence |

    |---|---|

    | Reset | XSPORT 10

    XSPORT 00 |

    | Instruction single-step | XSPORT 00

    XSPORT 01

    XSPORT 00

    XSPORT 01

    XSPORT 00

    XSPORT 01 |


    The reset action first raises the reset input so that the GNOME program counter
    gets loaded with 0. (This is good because that is the address where our program
    starts in the external RAM.) Then the reset is lowered to logic 0 so the program
    counter can increment through the opcodes.


    The command sequence that makes GNOME execute a single instruction just pulses
    the clock input 3 times. This sequences the GNOME instruction decoder through
    the FETCH, DECODE, and EXECUTE phases of each instruction. (To make things easier,
    you might place this set of 6 commands into a batch file. Then you can single-step
    GNOME using a single command.)


    The led/digit LED decoder module is connected to the accumulator. You should see
    intermediate results displayed on the LED digit as the program executes. Eventually,
    GNOME will enter the loop at the end of the program and will repetitively display
    the 2-nybble sum: 1...7...1...7....


