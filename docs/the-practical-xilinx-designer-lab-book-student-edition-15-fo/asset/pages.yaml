    54. So the drink dispenser moves into the 25¢ state. The net result is that if
    a dime is inserted when the dispenser has already received 20¢, then the dispenser
    will return a nickel and hold a total of 25¢. This replicates the behavior of
    our previous state machine described by Listing 7.4.


    The simulated waveforms for the revised ABEL or VHDL drink dispenser control circuit
    are shown in Figure 7.14. Notice that our "problem pulse" on the RET_DIME output
    is no longer present during the 36–40 ns period.


    The revised drink dispenser controller circuit can be downloaded and tested in
    exactly the same manner as the controller from the previous section.


    We mentioned earlier that the behavior of our revised controller almost matches
    the behavior described in Table 7.3. Remember when we created Table 7.3, we specified
    that none of the inputs could be active simultaneously. For example, if a customer
    pressed both the Swill and Krunk buttons at the same time, the result would be
    undefined because there is no listing in the table for such an occurrence. (With
    5 inputs, the table would need 32 columns to cover every possibility. I am not
    going to try writing that out!)


    But the circuit as described in Listings 7.5 or 7.6 does handle the cases where
    multiple inputs are active simultaneously. For example, the IF clause on line
    47 of Listing 7.5 (or line 68 of Listing 7.6) is active if NICKEL=1 regardless
    of the state of the other inputs. So the same clause would also be active if NICKEL=1
    and DIME=1. Interpreted in this way, we can see that all 32 possible input combinations
    are covered for all 7 states in the revised drink dispenser controller. There
    is no longer any unspecified behavior. Of course, this does not mean that the
    specified behavior is what we want! To be sure of that, we would have to examine
    each response to each combination of inputs in each state and ask if that is the
    most desireable behavior. But that is a job for another day.


