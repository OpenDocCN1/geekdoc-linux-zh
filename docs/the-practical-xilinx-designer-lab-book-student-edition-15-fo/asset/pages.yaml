  md: 'Once the probes are added to the schematic, the signals will appear in the
    Waveform Viewer window as soon as we start the simulator.


    A functional simulation of the DELAY circuit is not very interesting - the outputs
    OUT4..OUT1 move in exact synchrony with the INP input! In order to see the effect
    of gate delays, click on the drop-down menu for the simulation mode in the toolbar
    of the Logic Simulator window and select Unit instead of Functional. This puts
    the simulator in the unit-delay mode where the output of a gate changes 1 time
    unit after the inputs change.


    But how long is a gate delay? That is determined by the simulation precision used
    by the simulator algorithm. The simulation precision is the smallest increment
    of time between two non-simultaneous signal transitions. You can set the precision
    by selecting the Options → Preferences... menu item in the Logic Simulator window.
    In the Preferences window that appears (Figure 5.13), type the desired precision
    in the Simulation Precision box of the Simulation tab. I chose 1 nanosecond in
    this example. I also set the period of the B0 stimulator to 10 nanoseconds and
    connected the B2 bit of the stimulator to the INP input. That means the input
    to the DELAY circuit will change every twenty nanoseconds which gives the outputs
    plenty of time to settle before the input changes again.


