    # Priority Encoders


    The opposite of a decoder is the priority encoder: It outputs the largest index
    of the input that is currently at logic 1. Defining this more exactly, we say
    that given 2^M − 1 inputs in which input P is the input with the largest index
    that is also at logic 1, the encoder output is an M-bit binary number representing
    P. Of course, if no inputs are 1, then the output is zero. Figure 3.6 shows the
    I/O for the priority encoder. Table 3.5 lists the truth table for a 3-input, 2-output
    priority encoder. The corresponding circuitry for this priority encoder is shown
    in Figure 3.7.'
