    # The Drink Dispenser Controller Revisited


    If you were looking carefully, you would have noticed a problem in the simulation
    waveforms shown in Figure 7.13: the RET_DIME output that causes a dime to be returned
    is active during the 36-40 ns period. This occurs when a dime is entered by the
    rising clock edge at 36 ns and this causes the machine to move immediately from
