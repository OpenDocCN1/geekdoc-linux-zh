- pgno: 298
  md: '# Line 7: The output enable signal was replaced by a clock signal. (There is
    no reason a synchronous memory cannot have an output enable. I just needed the
    pin for the clock input since only 8 inputs can be driven from the PC into the
    XS95 and XS40 Boards.)


    # Lines 25-28: The equations for the register write control signals are specified
    here rather than using a WHEN-THEN-ELSE construct in the EQUATIONS section. This
    is done to condense the description of the individual registers and their multiplexers
    on lines 34-37.


    # Lines 34-37: The input to each register is driven by a multiplexer that selects
    either the input data bus or the register''s output depending upon the value of
    the write control signal.


    # Lines 39-42: The registers are all clocked by the main clock input instead of
    by their individual write control lines.


    The VHDL version of the synchronous memory is shown in Listing 8.4. This design
    is targeted toward the XC4005XL FPGA and the XS40 Board as can be seen by the
    presence of the clock buffer and mode input components and signals on lines 23-25
    and 28-30, respectively. The mode inputs are instantiated on lines 43 through
    46. On line 47 the outputs of the mode pin modules are concatenated with the 2-bit
    input bus to form a complete 4-bit input bus. The circuitry which generates the
    write control signals for the 4 registers is described on lines 49-57.


    The connection of the input clock to the low-skew clock buffer occurs on lines
    60 and 61. The buffered clock and the write control lines are used by the process
    on lines 64-80 to select which register is loaded with the value on the input
    bus on the rising clock edge.


    The output multiplexer on lines 82-85 selects one of the registers based on the
    current address inputs and then places its value on the output bus. The output
    value also goes to an LED decoder on line 88 so the hexadecimal representation
    of the 4-bit value will appear on the LED display.


    Simulated waveforms of the synchronous memory''s operation are shown in Figure
    8.20. The same test sequence that was used for the asynchronous memory is used
    here: the hex values of 0xC, 0x3, 0x5, and 0xA are written to memory locations
    0, 1, 2, and 3, respectively, and then read back out. The actual write to memory
    occurs whenever the write control input is low and a rising edge occurs on the
    clock input. With the synchronous memory we only need to keep the address and
    data values stable during the rising clock edge (taking account of setup and hold
    times, of course), whereas the asynchronous memory requires the address and data
    be held steady for the entire time the write control line is low. This makes it
    a bit easier to work with synchronous memories.'
