    +   - Another new step is inserted in which all the possible movements from each
    current state to the next state are listed.

    +   - The third and fourth steps are broken into two separate paths. One path
    develops the output truth table that describes what the outputs will be for each
    possible combination of inputs and current states of the circuit. The parallel
    path generates the state transition truth table that lists the next state of the
    state machine for each possible combination of inputs and current states.


    Defining the states for a design requires you to examine the specifications and
    list all the possible states the machine could get into. As a simple example,
    suppose you were asked to design a counter that counts in the sequence 0, 1, 2,
    0, 1, 2, .... You would see immediately that there were only three distinct states
    for the counter.


    In more complicated designs, state definition typically proceeds in a hierarchical
    fashion: you determine what the major states of the machine are and then break
    each major state into a set of related states. For example, you might list the
    major states for a laser printer controller as "printing" and "not-printing."
    Upon closer examination, you might divide the "not-printing" state into states
    relating to initialization of the printer electronics, periodic warming of the
    toner-transfer roller, diagnostic checks, and just idling. Likewise, the "printing"
    state could be partitioned into states concerned with transferring data into a
    buffer, activating the paper feed mechanism, writing a pattern to the electrostatic
    roller, etc. Then you could take each of these more-detailed states and break
    them into a set of even more-detailed states. The process ends when you cannot
    break any state into a set of substates. For example, the state'
