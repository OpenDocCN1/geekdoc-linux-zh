- pgno: 331
  md: '| Mnem. | Operations | Description |

    |---|---|---|

    | `load Rd` | `ACC ← Rd` | Load the accumulator with the contents of RAM address
    Rd. d is an address in the range [0..15]. |

    | `load #d` | `ACC ← d` | Load the accumulator with the value d. d is a value
    in the range [0..15]. |

    | `store Rd` | `Rd ← ACC` | Store the value in the accumulator into RAM location
    Rd. d is an address in the range [0..15]. |

    | `add Rd` | `ACC ← ACC + Rd + C; C ← carry out` | Add the contents of RAM address
    Rd and the C flag to the accumulator. d is an address in the range [0..15]. |

    | `add #d` | `ACC ← ACC + d + C; C ← carry out` | Add the value d and the flag
    C to the accumulator. d is a value in the range [0..15]. |

    | `xor Rd` | `ACC ← ACC$Rd` | Exclusive-OR the contents of RAM address Rd with
    the accumulator. d is an address in the range [0..15]. |

    | `test Rd` | `Z ← ACC&Rd` | Set the Z flag if the logical-AND of RAM address
    Rd and the accumulator is zero. Otherwise, clear the Z flag. d is an address in
    the range [0..15]. |

    | `clear_c` | `C ← 0` | Clear the C flag to zero. |

    | `set_c` | `C ← 1` | Set the C flag to one. |

    | `skip_c` | `PC ← PC + 1 + C` | If C = 1, skip the next instruction by incrementing
    the program counter by two instead of one. If C = 0, execute the next instruction.
    |

    | `skip_z` | `PC ← PC + 1 + Z` | If Z = 1, skip the next instruction by incrementing
    the program counter by two instead of one. If Z = 0, execute the next instruction.
    |

    | `jump #a` | `PC ← a` | Jump to program address a and execute instructions from
    that point. a is an address in the range [0..127]. |'
