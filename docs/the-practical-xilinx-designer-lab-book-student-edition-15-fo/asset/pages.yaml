    off in the 25¢ state and dispense a soft-drink without receiving any money. This
    can be avoided by providing a reset signal which starts the state machine in the
    0¢ state whenever power is first applied. A dedicated synchronous reset input
    could be implemented just as in the up-counter example. In this example, however,
    we do an asynchronous reset that is triggered by a specific combination of the
    existing inputs. Line 21 of Listing 7.3 specifies that the reset will be triggered
    when all the inputs are forced to logic 1. The reset is applied to the asynchronous
    preset and reset inputs of the state flip-flops on lines 29 and 30. Line 29 uses
    the ACLR signal extension to asynchronously clear the flip-flops for the 5¢, 10¢,
    15¢, 20¢ and 25¢ states. Line 30 uses the asynchronous preset signal extension,
    ASET, to force a logic 1 into the 0¢ state flip-flop when the same reset trigger
    condition occurs. Thus, the reset forces the state machine into the 0¢ state.


    The VHDL version of the drink dispenser controller is shown in Listing 7.4. It
    is lengthy (mainly because we are trying to maintain a close correspondence with
    the truth table in Table 7.6) but relatively straight-forward. The ENTITY block
    on lines 6 through 26 declares the same inputs and outputs as the ABEL version.


    The ARCHITECTURE section has two major blocks: a large WHEN...ELSE statement that
    computes the outputs (lines 72–116), and a process that controls the transitions
