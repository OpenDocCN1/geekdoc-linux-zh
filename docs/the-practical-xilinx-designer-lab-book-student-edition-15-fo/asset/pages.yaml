  md: '# A Toggle Flip-Flop Counter


    As our final example, Listing 6.14 shows a 3-bit counter built from toggle flip
    flops. We begin with line 7 which declares 3 DFFs T0, T1, and T2. These D flip-flops
    are transformed into toggle flip-flops by loading them with the inverse of their
    contents (line 11). Then the least-significant bit of the counter is clocked by
    positive-going edges of the input clock, C, on line 12. On line 13, the next bit
    of the counter is clocked by T0, the output of the LSB. In the same manner, the
    most-significant bit of the counter, T2, is clocked by T1 on line 14. Finally,
    on line 15 we provide an active-high asynchronous clear to each TFF so we can
    clear the counter at any time if needed.


    # Listing 6.14 ABEL code for a 3-bit counter built from toggle flip-flops.


    ```

    001- MODULE TGLCNT

    002- TITLE ''3-bit toggle flip-flop counter''

    003-

    004- DECLARATIONS

    005- C PIN; "clock input

    006- ACLR PIN; "clear input

    007- T2..T0 PIN ISTYPE ''REG''; "DFFs for counter

    008-

    009- EQUATIONS

    010- [T2..T0] := ![T2..T0]; "make DFFs into TFFs

    011- T0.CLK = C; "LS bit clocked by input clock

    012- T1.CLK = T0; "remaining bits clocked by output

    013- T2.CLK = T1; "of the preceding bit

    014- [T2..T0].ACLR = ACLR; "connect the asynchronous clear

    015-

    016- END TGLCNT

    ```


    The equivalent VHDL code for the 3-bit counter is shown in Listing 6.15. The toggle
    flip-flops are implemented as 3 different processes. On the rising edge of the
    main clock input, the bit0 process (lines 27–35) toggles the t0 TFF output by
    loading it with its inverse (lines 32 and 33). The t0 output is the clock for
    the next bit of the counter described by the bit1 process (lines 37–45). And the
    t1 output from that bit is the clock for the most significant bit of the counter
    described by the bit2 process (lines 47–55). Each process will override the toggling
    and clear its bit if the asynchronous clear input is high.


    The VHDL code in Listing 6.15 also has special modifications so it will run on
    the XS40 Board. When targeting an XC4000 FPGA, the Foundation Series synthesis
    software tries to use special clock buffers to drive clock signals to the flip-flops.
    These buffers minimize the skew between the times at which the'
