- pgno: 24
  md: 'Inverting all the inputs and the output of an AND gate makes it operate just
    like an OR gate. Inverting all the inputs and the output of an OR gate makes it
    operate just like an AND gate.


    A picture of what DeMorgan''s theorem means is given in Figure 1.10.


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_24_0.png)


    # Figure 1.10 DeMorgan''s theorem.


    Figure 1.11 demonstrates how we can use DeMorgan''s theorem to replace the AND
    and OR gates in our original schematic with NAND and NOR gates. The process starts
    by replacing the final AND gate in Figure 1.8 with a NOR gate that has its inputs
    inverted (Figure 1.11a). Then the inverters on the inputs of this NOR gate can
    be moved back to the outputs of the preceding OR and AND gates to transform them
    into NOR and NAND gates, respectively (Figure 1.11b). The remaining two AND gates
    in the schematic are replaced with NOR gates having inverted inputs and outputs
    (Figure 1.11c). Now we note that each of these NOR gates receives an input that
    has been previously inverted. These dual inverters can be removed. Finally, the
    remaining inverted input of each NOR gate can be redrawn as an individual inverter
    gate symbol. This gives us the final schematic of Figure 1.11d, which contains
    only NAND gates, NOR gates, and inverters.


    Before building the logic circuit, it makes sense to check its operation to ensure
    that we did not introduce an error during all the changes. We can perform a manual
    simulation by picking input patterns and tracing the effect they have as they
    propagate through the circuit and reach the output. For example, suppose we choose
    the input pattern, or vector,


    +   Hooterville = 1

    +   Mayberry = 0

    +   Siler City = 1

    +   Mt. Pilot = 0


    that corresponds to the problem of selecting the the fastest route between Hooterville
    and Siler City. Highway 3 should be part of this route, so Hwy3 should be at logic
    1 if this input vector is applied to the logic circuit.'
