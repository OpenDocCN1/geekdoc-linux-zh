    ![](img/5124daf79d2807d81e49f49c22f1f8c1_310_0.png)


    # Figure 8.23 Connections between the FPLD and the external RAM for a FIFO.


    The high-level block diagram in Figure 8.23 shows the signals that connect the
    FIFO control circuitry in the FPLD to the external RAM. The interface to the external
    RAM is very similar to those of the RAMs we have built in the previous sections.
    There is a single data I/O bus, an address bus, and active-low output-enable and
    write-enable control lines. In the external RAM, the write-enable input controls
    both reading and writing of the RAM: when web=0 an addressed memory location is
    overwritten with the value on the data bus, and when web=1 and oeb=0 the contents
    of the memory location are output on the data bus. A chip-select control line
    is also available that disables the reading or writing of the RAM when csb=1.
    In large memories built from multiple RAM chips, the chip-select inputs are used
    so that only one RAM chip is active at a time. Our FIFO design will only use one
    RAM chip, so csb will be tied to logic 0 to keep it permanently enabled.


    Listing 8.6 displays the ABEL code for the FIFO controller that manipulates the
    external RAM. Lines 7–10 declare the user-interface to the FIFO. Lines 13–17 define
    the FPLD pins that connect to the external RAM. Note that the RAM has address,
    data, output-enable, and write-enable pins just like the smaller RAMs we have
    worked with. For a 32 KByte RAM, there are fifteen'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'address lines (2^15=32768). Note also that the RAM has an 8-bit wide data bus,
    but we will use only the lower 4 bits for our FIFO.


    Line 20 declares the outputs which drive the LED digit. We will use these to observe
    the 4-bit output of the FIFO. Lines 23-29 declare internal nodes for the FIFO
    control circuitry. The reset signal is driven high to clear the internal flip-flops.
    The empty and full signals indicate the state of the FIFO. (Normally, these signals
    would come to external pins but we have not bothered with that in this example.)
    The read and write pointers are declared as 4 D flip-flops each, giving us a total
    FIFO size of 16 registers. (This is considerably less than the size of the external
    RAMs. You can increase the size of the FIFO by adding more flip-flops to each
    pointer.) Finally, the flag flip-flops for storing the type of the last FIFO operation
    are declared.


    The description of the circuitry begins after line 39. Lines 45-47 and 52-54 describe
    the read and write pointers, respectively. The ABEL code replicates the functions
    shown in Figure 8.16. For example, the read-pointer, rdptr, is incremented whenever
    a read operation occurs as long as the FIFO is not empty. The use of the ABEL
    addition operator (+) lets us describe this behavior very concisely.


    Line 57 generates the signal that indicates when the read and write pointers address
    the same memory location. The ABEL equality operator, ==, provides a logic 1 whenever
    the two pointers are equal. The reset signal is generated on line 61 whenever
    both the read and write control signals are low at the same time. Since the external
    RAM has only a single data port, there will never be a case in the normal operation
    of the FIFO when these signals should both be low. Therefore, we have used this
    combination of inputs to generate a reset signal. This would not be a good way
    to reset the circuit if a dual-port RAM were used such that a producer and consumer
    of data could both access the FIFO simultaneously.


    Lines 64-75 describe the circuitry shown in Figure 8.17 that records the type
    of the last FIFO operation and generates the FIFO empty and full status signals.
    The description of the interface circuitry between the FPLD and the external RAM
    begins on line 77. The RAM must be activated, and this is done by holding its
    chip select line low as shown on line 78. Since we are only using one external
    RAM, there is no need for more sophisticated chip select logic.


    Since we are only using 16 locations of the external RAM for our FIFO, the upper
    11 bits of the RAM address bus are held at logic 0 on line 81. Line 84 describes
    a 4-bit multiplexer that connects the read-pointer to the lower 4 bits of the
    RAM address bus when the FIFO is being read. At all other times, the write-pointer
    drives the lower part of the RAM address.


    Lines 87-90 control the writing of data to the external RAM. The 4-bit FIFO input
    bus drives the lower 4 bits of the RAM data bus while the upper 4 bits'
