    # A Drink Dispenser Controller


    This example will show you how to design a state machine to solve an actual problem:
    dispensing soft-drinks.


    You have been contracted to design the logic for a soft-drink machine that dispenses
    two brands of cola: Swill and Krunk. The dispenser should accept nickels and dimes
    and should allow the buyer to select one of the soft-drinks after he or she has
    put in 25¢. That is the extent of the requirements.


    The first step is to get some idea of the inputs and outputs of the logic circuitry.
    From the requirements, you know that the logic must receive inputs that indicate
    whether the buyer has put in a nickel or a dime. You also know that there have
    to be two inputs for indicating whether the buyer wants to enjoy a can of refreshing
    Swill or Krunk. Finally, what if the buyer changes his or her mind in the middle
    of a transaction? There should be an input to return the buyer’s money.


    What about the outputs from the logic? There should be outputs to control the
    individual dispensers for Swill and Krunk so that a can is dispensed whenever
    a high logic level is present. There should also be two outputs to control the
    return of change: one that causes a nickel to be dropped into the change return
    slot, and another that drops a dime.


    OK, you seem to have an initial idea of what the I/O looks like. The next step
    is to determine the states of your state machine (i.e., what your logic has to
    remember). The obvious thing to remember is how much money the buyer has put into
    the dispenser. This machine dispenses a soft-drink after it receives 25¢ in either
    nickels or dimes, so the possible states for the machine are that it has received
    0¢, 5¢, 10¢, 15¢, 20¢, or 25¢. That is a total of 6 states. At this point, the
    drink dispenser controller looks like Figure 7.11.'
