- pgno: 194
  md: 'executed in a process, then the output has an implied latch. The S-R flip-flop
    with an implied latch operates identically to the flip-flop in Listing 6.4 with
    an explicit latch on lines 23 and 24.


    One other new feature in Listing 6.4 is the declaration of the q output as a BUFFER
    rather than an OUT on line 11 of the interface description. VHDL requires that
    values on an OUT signal can only exit from a module and cannot be read from within
    the module ARCHITECTURE section. Thus if q were declared as an OUT, it would be
    illegal to use it on the right-hand side of an assignment as on line 24. VHDL
    provides the BUFFER and INOUT keywords to declare signals which can serve as outputs
    but can also feed their values back into the module.


    # Listing 6.4 Behavioral VHDL code for a single macrocell or LUT SR flip-flop.


    ```

    001- -- S-R Flip-Flop

    002-

    003- LIBRARY IEEE;

    004- USE IEEE.std_logic_1164.ALL;

    005-

    006- ENTITY srff2 IS

    007- PORT

    008- (

    009- sb: IN STD_LOGIC;      -- active-low set input

    010- rb: IN STD_LOGIC;      -- active-low reset input

    011- q: BUFFER STD_LOGIC    -- data output

    012- );

    013- END srff2;

    014-

    015- ARCHITECTURE srff2_arch OF srff2 IS

    016- BEGIN

    017- PROCESS (sb,rb,q)

    018- BEGIN

    019- IF (sb=''0'') THEN

    020- q <= ''1'';

    021- ELSIF (rb=''0'') THEN

    022- q <= ''0'';

    023- ELSE

    024- q <= q;

    025- END IF;

    026- END PROCESS;

    027- END srff2_arch;

    ```'
