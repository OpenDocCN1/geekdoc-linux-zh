    # Trip-Genie Project Design (HDL Mode)


    In this section we will look at doing the Trip-Genie design using VHDL and the
    HDL design flow of the Xilinx Foundation Series software. The only real difference
    between the schematic and HDL design flows is the method by which the netlist
    is extracted from the design description. Therefore, this section will only discuss
    the steps of entering the VHDL code for the Trip-Genie design and the synthesis
    of the netlist from this VHDL code. The steps which follow (functional simulation,
    compiling into a bitstream, downloading the bitstream to an XS Board, and testing
    the downloaded design) are performed exactly as they were in the schematic design
    flow discussed in the previous section.


    # Starting a New Project


    To begin, create a main directory for all your projects. (In my case, I place
    all HDL mode designs in C:\XCPROJ-V.) Then click on the Foundation Project Manager
    icon. This will bring up the window shown in Figure 2.35.


    The New Project sub-window is displayed. (You can also bring up this sub-window
    by selecting the File → New Project menu item.) Then, enter the project name,
    project directory, and click on the HDL radio button to select the HDL design
    flow. Once you select the HDL mode, the chip family, chip part number, and device
    speed drop-down menus disappear. (You will set these values later during the synthesis
    phase of the design flow.) In Figure 2.35, I have created a project called TRIPG_95
    in directory C:\XCPROJ-V. Then click OK to return to the Project Manager window.


    Now your window should look just like Figure 2.36. There are three main panes
    in the Project Manager window. The left-hand pane displays the source files and
    libraries for your design in the Files tab, while the Versions tab shows design
    implementation files generated by the XILINX Foundation Software for all the versions
    of your design. The right-hand pane has a Flow tab for controlling the activation
    of tools used in various phases of the design flow, a Contents tab which shows
    the status of the files in your project, and a Reports tab which lists the report
    files generated by the tools as they do their work. The bottom pane lists diagnostic
    messages output by the Foundation software as it processes your design files.
    For now, you will spend most of your time working in the Files and Flow tabs of
    the left and right panes, respectively.'
  merge: -1
  img_proc: true
