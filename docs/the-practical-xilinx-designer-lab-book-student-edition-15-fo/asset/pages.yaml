  md: '# Experimental


    The following sections will let you experiment with different types of I/O options
    and investigate the effects of gate delays.


    # Using FPLD I/O Options


    # Using Tristate Outputs


    The circuit of Figure 5.9 is a simple use of a buffer with a tristate output.
    We have a 2-line to 4-line decoder (D2_4E) whose outputs are passed through a
    tristate buffer (OBUFE4) with an active-high enable. When ENBL is at logic 1,
    the outputs from the D2_4E decoder can drive segments of the LED digit. When ENBL
    is pulled low, any changes on IN1 and IN0 will still affect outputs D3..D0 of
    the decoder, but these outputs will not appear on the I/O pins of the FPLD.


    Note that the D2_4E module also has an active-high enable input (E) which we have
    tied high to VCC. When low, this enable input causes the outputs to all drive
    to logic 0. The outputs are not tristated as they are when we use the ENBL signal.
    A simulation of the circuit is shown in Figure 5.10. As expected, the outputs
    float when ENBL=0, but they are driven to valid 0 and 1 logic levels when ENBL=1.


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_162_0.png)


    Figure 5.9 Using a 4-input tristate buffer.'
