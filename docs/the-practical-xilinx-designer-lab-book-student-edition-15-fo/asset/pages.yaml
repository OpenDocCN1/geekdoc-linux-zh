  md: 'we have to settle for stepping through instruction cycles and you will have
    to manually keep track of where DWARF is in terms of instruction execution.


    | Action | XSPORT Command Sequence |

    |---|---|

    | Reset | XSPORT 100

    XSPORT 000 |

    | Generate Interrupt | XSPORT 010

    XSPORT 000 |

    | Instruction cycle single-step | XSPORT 001

    XSPORT 000 |


    You will not see any intermediate results displayed on the LED digit as the DWARF
    program executes. This only happens when the program reaches the end of the addition
    loop and sends the sum to the output port that is connected to the seven-segment
    LED. The sum should be 0xF8, which will be truncated to 0xF8 or 11111000. The
    lower 7 bits of this result are 1111000, so you should see the upper four segments
    of the display light up while the lower three remain dark.


    If you change the clock input constraint as follows:


    ```

    NET IN_CLOCK LOC=P13;   # 12 MHz oscillator on the XS40 Board

    ```


    then you can clock DWARF at 12 MHz.


    # Projects


    +   1. Add increment and decrement instructions to DWARF. Should these instructions
    operate on the accumulator or the registers?

    +   2. Change the load instructions so they load the registers instead of the
    accumulator.

    +   3. Develop a way to save the carry and zero flags upon entering an interrupt
    service routine.

    +   4. Write some programs for some common operations like multiplication, division,
    and string comparison. Determine what instructions could be added to DWARF to
    make these operations easier and add them to DWARF.

    +   5. Build a simple assembler that will turn a set of DWARF instruction mnemonics
    into opcodes.

    +   6. Can you construct a 16-bit datapath version of the DWARF? What are the
    implications on the architecture? On the external memory system?'
