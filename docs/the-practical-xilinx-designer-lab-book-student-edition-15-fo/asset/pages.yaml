    "32-bit Up/Down counter with parallel load "and enable


    "Outputs

    Q31..00    pin istype ''reg'';


    "Inputs

    D31..00    pin;          " Load Cmd

    Load       pin;          " Count Cmd

    Count Enable pin;        " Up/Down Cmd

    UpDown     pin;          " Clock

    myclk      pin;


    Counter = [Q31..00];

    Input   = [D31..00];


    Equations

    @carry 4;

    Counter.clk = myclk;

    WHEN (!Load & Count_Enable & UpDown)

    THEN Counter := Counter + 1

    else

    WHEN (!Load & Count_Enable & !UpDown)

    THEN Counter := Counter - 1

    else

    WHEN (Load)

    THEN Counter := Input;

    else

