    # Clock Circuit


    The oscillator circuit shown in Figure A.7 generates a 12 MHz clock signal for
    the XC4005XL FPGA. The 12 MHz resonator connected between the input and output
    of the first inverter causes it to oscillate. (The two resistors bias the inverter
    to make sure the oscillation starts up.) The second inverter cleans-up the output
    of the first inverter and then applies the signal to one of the primary global
    clock inputs of the FPGA (PGCK1 on pin 13).


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_421_0.png)


