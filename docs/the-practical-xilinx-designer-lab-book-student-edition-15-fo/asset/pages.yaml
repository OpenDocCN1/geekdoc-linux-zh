- pgno: 274
  md: 'The next issue is how to build the memory storage array that is controlled
    by the address decoder. Let''s start by building an individual memory location
    or register, shown in Figure 8.4. The four D inputs of the four D flip-flops act
    as the input bus to the 4-bit memory location. The four Q outputs make up the
    4-bit output bus. The clock inputs of all the D flip-flops are connected, and
    this acts as the write line, w, for this memory location. Whenever a rising edge
    occurs on w, the logic levels on the input bus will be latched into the D flip-flops,
    thus fulfilling the requirements of a write operation. Notice that there is no
    equivalent read line, r, because the Q outputs are active all the time. This will
    cause problems later, as you will see.


    ![](img/5124daf79d2807d81e49f49c22f1f8c1_274_0.png)


    # Figure 8.4 An individual memory location.


    How do you combine several registers to build a larger storage array? Again, that
    is easy (at least when considering the write operation). Figure 8.5 shows how
    to do it with three registers. Merely construct three identical registers and
    connect their equivalent D inputs. When a write operation occurs, the value to
    be written will be on the input bus and goes to each register. However, only one
    of the registers will store the data because the address decoder will only activate
    one of the w0, w1, or w2 lines. For example, if the address inputs to the address
    decoder had the value 001, then the w1 write line would be active and the value
    on the input bus would be stored in memory location 1. Larger memories can be
    built merely by connecting more registers and building a larger address decoder.


    The memory I have just described is asynchronous in that a write will occur anytime
    a rising edge occurs on one of the w lines. Each w line is affected by the address
    inputs as well as the write control input. No global clock signal determines when
    the writes will take place. Because of the way the address decoder works, a sequence
    of RAM addresses can be written by applying different addresses while holding
    the write line low. The changing address lines will cause the rising edges on
    the w lines as long as write = 0. But this is not a very reliable way to write
    to memory since it is hard to make sure all the'
  merge: -1
  img_proc: true
