- pgno: 288
  md: 'The output of prevop0 cannot be used directly because it changes value as soon
    as a read or write operation begins. The current operation must complete before
    the flip-flop is updated. Therefore a second flip-flop, prevop1, is used to delay
    the output from prevop0 until after the current operation is complete. The clock
    for the prevop1 flip-flop is formed from the logical AND of the read and write
    control lines so that a low pulse on either control line updates the prevop1 flip-flop
    with the value stored in prevop0.


    A final piece of control logic is needed to prevent the RAM from being corrupted
    by a write to a full FIFO. The active-low write-enable signal to the RAM, gatewr,
    is driven by an OR gate that has the write control line of the FIFO and the full
    status signal as inputs. If the FIFO is full, then gatewr is held high so that
    no data can be written into the RAM. If the FIFO is not full, then the write pulse
    from the FIFO write control input passes through to the RAM write-enable unchanged.


