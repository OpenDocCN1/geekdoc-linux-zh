- pgno: 430
  md: '# Tips for Constructing and Testing the XS40 and XS595 Lite Boards


    You may be one of those people who can construct something and have it work the
    first time, but most of us aren’t that lucky. So here are some tips to help you
    build the Lite boards and test it if it doesn’t work:


    +   - It’s always difficult to build sturdy connections from the breadboard to
    the power and parallel port cables. Try soldering 2" wires to the power jack,
    gluing the jack to the breadboard with epoxy, and then connect the wires to the
    power buses of the breadboard. For the DB25 connector, solder 25 wires to it and
    then attach it to the breadboard with a couple of bolts and 1" spacers. Then you
    can connect the wires where they are needed while the DB25 connector is held firmly
    by the bolts and spacers.


    +   - Construct the power supply circuitry first and make sure it puts out the
    correct voltages.


    +   - Place the PLCC adapter on the breadboard next. Do not put the FPGA or CPLD
    in it yet! Connect the VCC and GND pins. Then apply power and make sure the correct
    voltages appear on each VCC and GND pin. Then turn off the power.


    +   - Build the parallel port interface by placing the 74LS14 chip on the breadboard
    and connecting the wires from the DB25 connector. Do not put the FPGA or CPLD
    in the PLCC adapter yet! Create a bitstream file using the XILINX Foundation Series
    tools and then download it using the XSLOAD program. Use a logic probe to verify
    that the bitstream data and clocks appear on the appropriate pins.


    +   - Place the 7-segment LED on the breadboard and connect it to the PLCC adapter.
    Then turn on the power and make sure once again that the correct voltages appear
    on each VCC and GND pin of the PLCC adapter. Then turn off the power.


    +   - Now you can insert the XC95108 CPLD or XC4005XL FPGA in the socket of the
    PLCC adapter! Then turn on the power and download a bitstream for a circuit that
    uses the 7-segment LED (the LEDDCD40 or LEDDCD95 project is a good choice for
    this). Then use the XSPORT program to test the design and see if it operates correctly.


    +   - If your test isn’t successful, check the following items:


    +   * Check that the 74LS14 and the XC95108 or XC4005XL chips are getting power
    on the right pins and that all their ground connections are in place.


    +   * Make sure the 9V DC wall-mounted transformer is plugged in.


    +   * Verify that the DB25 connector is wired correctly. It wouldn’t be the first
    time a connector was wired backwards.'
  merge: -1
  img_proc: true
- pgno: 431
  md: '+   * Try downloading using different parallel port numbers with the XSLOAD
    program. If you don''t know the parallel port number, try them all: 1, 2, 3, and
    4.

    +   * The 74LS14 may be malfunctioning. It''s cheap—replace it.

    +   * After proving that you can successfully download to your Lite board, place
    the clock generation circuitry on the breadboard and verify that it produces a
    12 MHz digital signal.

    +   * Finally, place the 32 KByte static RAM on your breadboard and connect it
    to the PLCC adapter. Don''t forget the pull-up resistor on the /CS input of the
    RAM. Then download the GNOME microcontroller bitstream and a HEX file with a program
    in it (see Chapter 9). Executing the program will verify that the memory is operating
    correctly.


    # Installing and Using the XSLOAD and XSPORT Programs


    XESS Corp. provides the following two programs for use with the XS40 and XS95
    Boards (and their Lite versions):


    XSLOAD.EXE downloads .SVF configuration files for the XC9500 CPLD, .BIT configuration
    files for the XC4000 FPGA, and .HEX files for the 32 KByte RAM.


    XSPORT.EXE forces a byte-value onto the input pins of the XC9500 CPLD or XC4000
    FPGA that are connected to the PC parallel port.


    # Installing the Programs


    Installation of these programs is easy:


    +   1. Go to the CD-ROM directory where the tools are stored (D:\XSE).

    +   2. To install the tools for Windows 95, double-click the icon labeled SETUPEXE.
    To install the tools for Windows NT, double-click the icon labeled NTSETUPEXE
    and then double-click the PORT95NT.EXE icon to install the parallel port driver
    for NT.


    # Using XSLOAD to Download Configuration Files


    You can download an XC4000-based design into the XS40 Board as follows (assuming
    the name of the design is CIRCUIT):


    ```

    XSLOAD CIRCUIT.BIT

    ```


    You can download an XC9572 or XC95108-based design into the XS95 Board as follows:


    ```

    XSLOAD CIRCUIT.SVF

    ```'
  merge: -1
  img_proc: true
- pgno: 432
  md: 'If you also want to download a HEX file into the RAM of the XS40 or XS95 Board,
    use one of the following commands (assuming the HEX file is called FILE.HEX):


    ```

    XSLOAD FILE.HEX CIRCUIT.BIT

    ```


    ```

    XSLOAD FILE.HEX CIRCUIT.SVF

    ```


    XSLOAD assumes the XS Board is connected to parallel port #1 of your PC. If you
    are using another port number, you can specify that like so:


    ```

    XSLOAD -p 2 FILE.HEX CIRCUIT.BIT

    ```


    # Using XSPORT for Testing Designs


    Assuming your CPLD or FPGA design has its inputs assigned to pins which are connected
    to the PC parallel port, then you can use XSPORT to force values on the inputs.
    XSPORT supports up to eight inputs. For example, to force the binary values 1,
    0, and 1 onto the three least-significant bits of the parallel port, use the following
    command:


    ```

    XSPORT 101

    ```


    In the example given above, the upper five bits of the parallel port are forced
    to logic 0.


    Like XSLOAD, XSPORT assumes the XS Board is connected to parallel port #1 of your
    PC. If you are using another port number, you can specify that like so:


    ```

    XSPORT -p 2 101

    ```'
