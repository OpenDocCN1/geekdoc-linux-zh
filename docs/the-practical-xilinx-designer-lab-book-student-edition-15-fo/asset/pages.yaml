- pgno: 370
  md: '# The DWARF

    Microcomputer


    # Objectives


    +   - Extend the GNOME datapath to 8 bits.

    +   - Add indirect and indexed addressing to the GNOME microprocessor.

    +   - Add subroutine call and return instructions to the GNOME microprocessor.

    +   - Add input and output instructions to the GNOME microprocessor.

    +   - Add interrupt handling to the GNOME microprocessor.


    # Discussion


    In this chapter, we will extend the capabilities of the GNOME microprocessor to
    create the DWARF microprocessor. The capabilities we will add are as follows:


    +   1. The ability to handle 8-bit data

    +   2. A register set

    +   3. Indexed and indirect addressing

    +   4. Input and output ports

    +   5. Subroutine call and return instructions

    +   6. Interrupt handling.


    # 8-bit Datapath


    The datapath width can easily be increased to handle 8-bit data by adding more
    bits to the ALU and the accumulator. However, this means that immediate-mode data
    can no longer be stored directly in the instruction opcode because it would consume
    all 8 bits. Therefore, immediate-mode data will have to be stored in the memory
    location just after the instruction opcode. Once we make that modification, we
    might as well increase the data memory addresses from 4 to 8 bits. Then we can
    increase the data memory to 256 bytes. With'
  merge: -1
  img_proc: true
- pgno: 371
  md: 'these changes, many of the instructions will consume 2 bytes and require two
    fetches to read them from the external RAM. These complications will have to be
    accounted for in the DWARF instruction decoder.


    # Register Set


    The GNOME operated on its accumulator using operands fetched from external RAM.
    A microprocessor can execute more swiftly if it can get operands from a set of
    internal registers rather than bringing them in from outside the chip. These registers
    can store intermediate values and provide new addressing modes (see the next subsection).
    A set of eight registers provides adequate internal storage and the register addresses
    can be stored in the opcode using only three of the eight bits.


    # Indexed and Indirect Addressing


    The addition instruction for the GNOME can add any data RAM location to the accumulator.
    However, the address of the data RAM location must be stored in the lower 4 bits
    of the add opcode. So if you want to sum the data stored in data RAM locations
    R0–R7, you have to write the code as follows:


    ```

    clear C

    load R0 ; ACC ← R0

    add R1 ; ACC ← R0 + R1

    add R2 ; ACC ← R0 + R1 + R2

    add R3 ; ACC ← R0 + R1 + R2 + R3

    add R4 ; ACC ← R0 + R1 + ... + R4

    add R5 ; ACC ← R0 + R1 + ... + R5

    add R6 ; ACC ← R0 + R1 + ... + R6

    add R7 ; ACC ← R0 + R1 + ... + R7

    ```


    This becomes very tedious if you have to sum many values. Instead, imagine that
    a microprocessor has an index register X, that stores the address of a data RAM
    location. X can be used to supply the address of the operand that will be added
    to the accumulator. Then X can be incremented so that it points to the next data
    RAM location. This is the indexed addressing mode.


    Indirect addressing is similar to indexed addressing except the index register
    is stored in external RAM. In this mode of addressing, the instruction contains
    the address of a memory location that, in turn, contains the address of the memory
    location having the operand. So an instruction with an indirect-mode operand has
    to fetch the address from RAM and then use this address to fetch the data value
    from RAM. Then the address stored in RAM can be incremented. So it is like indexed
    addressing, but it is slower because the microprocessor has to keep accessing
    external RAM instead of an internal register.'
  merge: -1
  img_proc: true
- pgno: 372
  md: '# Input and Output Ports


    A microprocessor needs the ability to gather input data so it can sense changes
    in the environment. It must also have outputs that allow it to affect the external
    world. For example, it may need to read the value from a digital thermometer and
    output control signals to a furnace.


    A set of eight I/O lines can easily interface to the internal datapath of a microprocessor.
    In effect, the I/O port operates just like the data bus interface to the external
    RAM. The microprocessor just needs appropriate control signals so the digital
    values from the I/O port do not collide with data read in from the RAM. The I/O
    port could be addressed just as if it were one of the internal registers. This
    would allow the microprocessor to interact with the I/O port using all the same
    resources that internal registers can access.


    # Subroutine Call and Return Instructions


    A program that performs a particular operation at several points in the program
    will be smaller if the common operation is placed in a subroutine. An example
    of a likely candidate for a subroutine is the code for doing 8-bit addition. Then
    whenever 8-bit addition is needed, the program can jump to the subroutine and
    perform the operation. After the subroutine is completed, the program returns
    to where it was previously and continues. This saves the programmer from having
    to replicate the code wherever the addition operation is needed.


    The sequence of calling and returning from a subroutine is shown in Figure 10.1.
    The jsr add instruction causes the PC to be loaded with the address of the addition
    subroutine (step A). Thus, the next instruction to be executed is at address add.
    After all the instructions in the addition subroutine have been performed (step
    B), the ret instruction causes the program to return to the instruction right
    after the jsr instruction (step C). So the program can branch off and do the addition
    and then resume processing right after the subroutine call.


    For subroutines to work, the program counter must be stored somewhere so the microprocessor
    can remember which address to return to when the subroutine is finished. A simple
    way to do this is to build a special SAVE register to hold the PC value when a
    subroutine is called. The SAVE register is loaded with the incremented value of
    the program counter whenever a jsr instruction is executed. (Thus, SAVE holds
    the address of the instruction that comes immediately after the jsr instruction.)
    At the same time, the subroutine address (stored as an operand in the instruction)
    is loaded into the program counter. After the subroutine is done, the ret instruction
    activates the control signals that cause the multiplexer to load the PC with the
    value stored in the SAVE register. Then the program begins executing the instructions
    that follow the jsr instruction.'
  merge: -1
  img_proc: true
- pgno: 373
  md: '![](img/5124daf79d2807d81e49f49c22f1f8c1_373_0.png)


    **Figure 10.1** Calling and returning from a subroutine.


    The circuitry just discussed will work only if a single subroutine is called.
    But what if the subroutine calls another subroutine? This is called subroutine
    nesting. In this case, the SAVE register will be overwritten with an address from
    the subroutine code and the return address to the main program will be lost. Therefore,
    the microprocessor will not remember which address to return to after all the
    subroutines have finished. To support nesting of N subroutines, N multiple registers,
    (SAVE₁, SAVE₂, ..., SAVEₙ) must be built. Whenever a jsr instruction is executed,
    the following transfers of addresses occur:


    ```

    SAVEₙ ← SAVEₙ₋₁


    SAVE₂ ← SAVE₁

    SAVE₁ ← PC₁

    ```


    and the reverse operation occurs whenever a ret instruction is executed:


    ```

    PC ← SAVE₁

    SAVE₁ ← SAVE₂

    ⋮

    SAVEₙ₋₁ ← SAVEₙ

    ```


    The multiple SAVE registers form what is called a subroutine stack. Addresses
    are pushed on the stack whenever a jsr instruction is executed. These addresses
    are popped off the stack and into the PC whenever a ret instruction is executed.
    Microprocessors often store their stack in external RAM and use a dedicated register
    (called a stack pointer) to keep track of where the top of the stack is in memory.'
  merge: -1
  img_proc: true
- pgno: 374
  md: '# Interrupt Handling


    Subroutine calls and returns occur under the direction of the program. There are
    situations, however, when external conditions demand immediate attention and the
    flow of control must be abruptly changed. These interrupts are not events that
    the microprocessor can anticipate and plan for. Instead, it must save enough information
    about its current state, jump to a section of code that handles the interrupt
    (called an interrupt service routine or ISR), and then restore its state and continue
    its original flow of instructions.


    The state information that the microprocessor must store after an interrupt is
    received is, at minimum, the value of the program counter. With this information,
    the microprocessor can return to where it was after it finishes processing the
    interrupt. But the microprocessor must also save the values in registers and flags
    as well if these might be altered by the instructions that service the interrupt.
    The values of the PC, registers, and flags at any given time are typically called
    the context. A common technique for saving the context is to push the values onto
    the stack using the same techniques employed during subroutine calls. Then the
    context can be restored by popping it off the stack at the end of the ISR.


    # Experimental


    We have touched on the basic ideas, so now it is time to implement them in the
    DWARF microprocessor. This design is oriented toward the XC4005XL FPGA because
    it has more left-over resources than the XC95108 CPLD, so it will be an easier
    fit. The XC4005XL also has internal tristate buffers and built-in RAMs that we
    will use in the DWARF design. This is not to say that the DWARF architecture cannot
    be implemented in an XC9500 CPLD, but we will not do it here.


    Table 10.1 shows the DWARF instruction set. There are twice as many instructions
    as found in the GNOME. Here are the main differences from the GNOME instruction
    set:


    +   1. The load and store instructions have been extended with register, indexed,
    and indirect addressing modes.

    +   2. An in instruction was added that loads the value on an input port into
    one of the eight internal registers. The out instruction sends the value in the
    accumulator to an output port.

    +   3. The xor, add, and test instructions have been restricted to using the internal
    registers as operands.

    +   4. The skip_c and skip_z instructions were replaced with the jc and jz instructions,
    which can jump to any location in the PROGRAM region if the carry or zero flag
    is set, respectively.'
  merge: -1
  img_proc: true
- pgno: 375
  md: '5. The jump-to-subroutine (jsr) instruction was added that saves the address
    of the next instruction on the stack and then transfers to a new address in the
    PROGRAM region. The ret instruction was added that removes the saved address from
    the stack and restores it to the PC.


    6. The return-from-interrupt (reti) instruction was added that restores the accumulator
    and program counter values from the stack and then resumes instruction execution
    at the address in the PC. This instruction reverses the operations performed when
    an interrupt service routine is initiated (i.e., the PC and ACC are saved on the
    stack).


    # Table 10.1 DWARF instruction set.


    | Mnemonic | Operations | Descriptions |

    |---|---|---|

    | load Rd | ACC ← Rd | Load the accumulator with the contents of register Rd.
    d is an address in the range [0..7]. |

    | load (Rd) | ACC ← RAM[Rd] | Load the accumulator with the contents of the DATA
    RAM location whose address is found in register Rd. |

    | load #d | ACC ← d | Load the accumulator with the value d. d is in the range
    [0..255]. |

    | load d | ACC ← RAM[d] | Load the accumulator with the contents of the DATA RAM
    location whose address is d. d is in the range [0..255]. |

    | load (d) | ACC ← RAM[RAM[d]] | Load the accumulator with the contents of the
    DATA RAM location whose address is found in DATA RAM location d. d is in the range
    [0..255]. |

    | store Rd | Rd ← ACC | Store the accumulator into register Rd. d is an address
    in the range [0..7]. |

    | store (Rd) | RAM[Rd] ← ACC | Store the accumulator into DATA RAM at the address
    found in register Rd. d is an address in the range [0..7]. |

    | store d | RAM[d] ← ACC | Store the accumulator into DATA RAM at the address
    d. d is in the range [0..255]. |

    | store (d) | RAM[RAM[Rd]] ← ACC | Store the accumulator into the DATA RAM location
    whose address is found in DATA RAM at the address found in register Rd. d is in
    the range [0..7]. |

