    decoder to the DECODE state (lines 182–206). Unlike the FETCH state, the operations
    carried out in the DECODE state depend upon the opcode in the instruction register.
    We use a set of IF...END IF; constructs to express the decoding operation. Since
    the instruction opcode bit patterns are distinct, there is no chance that more
