  md: 'Finally, the value on the output bus is passed to an LED decoder module on
    line 77. This allows the display of the 4-bit output value as a hexadecimal digit
    on the LED display.


    Simulated waveforms of the small memory’s operation are shown in Figure 8.18.
    The design was targeted for an XC95108 CPLD. Four writes were made to the memory
    by applying an address and data value and then pulsing the WEB input low. During
    the interval 0–110 ns the hex values of 0xC, 0x5, 0x5, and 0xA were written to
    memory locations 0, 1, 2, and 3, respectively. Then the values were read back
    out of these locations between 120 ns and 160 ns. Note that the value read from
    each location matches the data that was written to it. The output enable is lowered
    at 160 ns and the output bus tristates to the Z state.


