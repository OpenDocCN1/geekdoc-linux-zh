- pgno: 391
  md: '249, line 266). The stack pointer is decremented again at the end of T2 (line
    250, line 267) and the instruction decoder enters state T3.


    Upon entering state T3 (lines 280–285, lines 293–297), the SP is pointing to the
    location where the program counter was saved upon entering the ISR. The program
    counter is restored in the same way as the accumulator (lines 282–283, lines 294–295).
    The iflag is cleared (line 284, line 296) to indicate an ISR is no longer being
    executed. This will allow new interrupts to be processed. Then control passes
    to state T0 where a new instruction is fetched. Only the instruction will be fetched
    from the address stored in the PC. This instruction is the one that was going
    to be processed just as the interrupt was detected. Thus, normal program execution
    resumes right where it left off as if nothing had happened.


    As a final example of instruction execution, we will examine the indirect addressing
    mode version of the load instruction. Starting in state T1 after the opcode has
    already been fetched, the instruction decoder must read in the address that follows
    the opcode (line 187, line 215). This address is written to register R0 by forcing
    the port A address to zero (R0A=1) and raising the LD_REG control signal (line
    188, line 216). The program counter is incremented so that the PC points to the
    next instruction after this one (line 189, line 217). The instruction decoder
    moves on to state T2.


    In state T2, the instruction decoder addresses the DATA region of the RAM with
    the contents of R0 (line 259, line 274). The value output by the RAM is passed
    onto the internal D bus where it is loaded into R0 (line 260, line 275). Thus,
    the contents of R0 are replaced with the data held at the address R0 was originally
    storing. In the case of indirect addressing, R0 is now holding another address.
    The instruction decoder now moves to state T3.


    In state T3, the instruction decoder once again addresses the DATA region of RAM
    with the contents of R0 (line 288, line 299). Now the value output by the RAM,
    however, is looked upon as data bound for the accumulator. So the RAM data is
    gated through to the D bus, passed through the ALU, and loaded into the accumulator
    (line 289, line 300). This completes the execution of the load instruction with
    an indirect operand. The instruction decoder returns to state T0 and fetches another
    opcode.


    You can interpret the actions performed for the other instructions in much the
    same way as we did here. Just look for a chosen opcode under the case statement
    in each of the T1, T2, and T3 states. By examining the values asserted onto the
    control signals, you can determine which multiplexers and tristate buffers are
    enabled and where the data flows.


