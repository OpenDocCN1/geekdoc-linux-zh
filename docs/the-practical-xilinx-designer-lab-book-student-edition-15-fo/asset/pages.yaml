    | Buyer''s Action | Nickel | Dime | Coin Return | Swill | Krunk |

    | Put in 5¢ | 1 | 0 | 0 | 0 | 0 |

    | Put in 10¢ | 0 | 1 | 0 | 0 | 0 |

