    # Entering the Design Using the VHDL Hardware Description Language


    In this section, I will show you how to enter the design for the Hvy3 output of
    the Trip-Genie using VHDL. VHDL is a more complex language than ABEL and is more
    suitable for large designs intended for high-density FPLDs.


    In the **Project Manager** window, select **Tools → Design Entry → HDL Editor**
    or click on the [icon] button in the Flow tab of the **Project Manager** window.
    In the window that appears, click on the radio-button labeled **Use HDL Design
    Wizard** and then click on **OK**. Then click on **Next** in the **Design Wizard**
    window that appears to reach the **Design Wizard-Language** window. Here, select
    the **VHDL** radio-button and click on **Next** to move to the **Design Wizard-Name**
    window. Enter TRIPGEN1 as the name and click Next.'
