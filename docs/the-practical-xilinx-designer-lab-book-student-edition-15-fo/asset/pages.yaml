- pgno: 328
  md: '| 0x0 | 0 | input carry |

    |+0x8 | 1000 | contents of accumulator |

    |+0x9 | 1001 | contents of R2 |

    |0x11 | 10001 | 5-bit result |

    |0x1 | 0001 | four-bit result in accumulator |

    |0x1 | 1 | 1-bit output carry |


    The addition of 0x8 and 0x9 creates a number that will not fit in the 4-bit accumulator:
    0x11. The uppermost bit of this result is the output carry, and this replaces
    the value that was stored in the C flag (see Figure 9.2d). The carry output will
    be needed when the MSNs of the operands are added. The accumulator stores the
    lower four bits (0001 in this case).


    The next instruction, store R4, stores the contents of the accumulator in the
    LSN of the result, R4 (Figure 9.2e). Note that this instruction copies the values;
    it does not affect the original values held in the accumulator and the carry flag.


    Once the PC has reached address 4 (Figure 9.2e), the 8-bit addition is half done.
    The least-significant nibbles of the operands have been added and the result stored
    away in R4. The C flag now holds the carry that resulted from this addition, and
    it will be used in the addition of the most-significant nibbles. This begins by
    loading the accumulator with the MSN of the first operand from R1. The add R3
    instruction (Figure 9.2f) adds the MSN of the second operand (R3) and the carry
    bit to the ACC as follows:


    | 0x1 | 1 | input carry |

    |+0x4 | 0100 | contents of accumulator |

    |+0x2 | 0010 | contents of R3 |

    |0x07 | 0111 | 5-bit result |

    |0x7 | 0111 | four-bit result in accumulator |

    |0x0 | 0 | 1-bit output carry |


    The contents of the accumulator are stored in the MSN of the result (R5) after
    which the program is stopped by the halt instruction (Figures 9.2g and 9.2h, respectively).
    Converting the contents of the operand and result registers back to decimal, we
    can see that the addition program came up with the right result:


    ```

    R1,R0 = 0x48 = 4 × 16 + 8 = 72

    R3,R2 = 0x29 = 2 × 16 + 9 = 41

    R5,R4 = 0x71 = 7 × 16 + 1 = 113

    ```


    The addition program showed some of the operations that the GNOME can do. Table
    9.1 lists all the possible instructions for the GNOME. The instructions can be
    divided into five main categories: (1) load/store instructions; (2) arithmetic
    instructions; (3) value testing instructions; (4) flag instructions; and (5) branching
    instructions.'
