  md: '# A Clocked S-R Flip-flop


    Next we move onto the clocked SRFF (Listing 6.5). All we have done is add a set
    of NAND gates between the original set of cross-coupled NAND gates and the SB
    and RB inputs. We also added inverters to the SB and RB inputs to counteract the
    inversion of the added NAND gates.


    **Listing 6.5**   ABEL code for a clocked SRFF.


    ```

    001- MODULE CSRFF

    002- TITLE ''clocked SR flip-flop''

    003-

    004- DECLARATIONS

    005- C PIN;                 *clock input

    006- SBPIN;                 *S input

    007- RBPIN;                 */R input

    008- Q PIN ISTYPE ''COM'';    *Q output

    009- QB PIN ISTYPE ''COM'';   */Q output

    010-

    011- EQUATIONS

    012- Q = !(!(!SB & C) & QB);  *gated SB and RB inputs

    013- QB = !(!(!RB & C) & Q);   *with the clock input

    014-

    015- END CSRFF

    ```


    Listing 6.6 is a behavioral VHDL description of a clocked SRFF. We have added
    a new clock input to the interface description (line 8) and added the clock to
    the process sensitivity list (line 17). The IF statement on line 19 prevents the
    execution of the statements on lines 20 through 24 unless the clock input is high.
    Thus the q output can only change when c=1. (Note that the q output is treated
    as an implied latch.)


    The simulated waveforms for the clocked SRFF are shown in Figure 6.9. When the
    clock input, C, is high the waveforms are identical to those of Figure 6.8. When
    C=0, the SB and RB inputs no longer have any affect on the Q output. The simulated
    operation of the clocked SRFF is correct.


