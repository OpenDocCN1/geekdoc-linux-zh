    # 1.5 CHARACTERISTICS OF A CLOUD


    A cloud exhibits several characters, which make it quite unique and an advanced
    computing technology for the needs of the end user and the business units in the
    IT sector. Some features of the cloud resemble computing technologies with some
    newly added and some ignored. A characteristic of technology determines its efficiency
    and the core functionality in solving the user problem. The characteristics of
    cloud includes:


    +   * **Anytime, Anywhere Technology** – a typical cloud can be used by the user
    anytime and independent of the location mainly due to its migration capabilities
    of a dynamic cloud using high speed internet device.

    * **Pay per usage** – the resources in a cloud are metered on the usage of the
    user, making the cloud technology an economic one and reducing the burden of the
    user by shared resource than a dedicated resource.

    * **On demand self-service** – the resource in cloud is available to the user
    automatically from the various service provider as the demand required.

    * **Online access** – the entire cloud technology functions using a high speed
    internet connected to various devices. It involves a thin client technology with
    a highly placed runtime server in the backend.'
