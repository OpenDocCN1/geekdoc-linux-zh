  md: '334


    CLOUD COMPUTING


    One of the major requirements of cloud installation is the high speed internet
    without any blockage of firewalls.


    We start the cloud installation by the following steps:


    +   * To install OpenStack cloud first select the Linux OS. Devstack method supports
    only Ubuntu 12.04 (Precise), Fedora 20 and CentOS/RHEL 6.5. OpenStack also runs
    and is packaged on other flavors of Linux such as OpenSUSE12.04 and Debian. Install
    the respective operating system. We use Ubuntu 12.04 in this case study.

    * In the first step update the Ubuntu operating system by this command. It downloads
    all the required packages.


    ```

    apt-get update

    ```


    +   * Install the git package as it is required for Devstack method.


    ```

    apt-get install -qq git

    ```


    +   * In the terminal of Ubuntu 12.04 download the script file of Devstack method
    by typing this command


    ```

    git clone https://github.com/OpenStack-dev/devstack.git

    ```


    +   * It creates a new directory called Devstack. Move to that directory


    ```

    cd Devstack

    ```


    +   * Now we are ready to start the script file installation of cloud by a single
    command


    ```

    /stack.sh

    ```


    This is a very big step as it involves all the steps in the OpenStack cloud installation.
    It involves downloading many packages and all the components required for the
    OpenStack cloud tool. This step requires a very high speed internet and may take
    about 2 hours to get completed. At the end OpenStack cloud is configured and it
    is ready to be used. The user can see a URL at the terminal paste this URL in
    the web browser or use the default localhost 127.0.0.1 also to view the cloud
    output in the web browser


    Now we discuss the output of the OpenStack cloud using all the output images.'
