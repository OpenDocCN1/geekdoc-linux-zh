    Technical expertise is obviously required in incident handling, but privacy and
    legal experts have much to contribute to cloud security. It is important to be
    aware that the provider also play a role in incident response regarding notification,
    remediation, and possible legal action. An organization considering using cloud
    services needs to review what mechanisms have been implemented to address questions
    about employee data access that is not governed by user agreements and privacy
    policies. Application data not managed by a cloud provider''s applications, such
    as in SaaS and PaaS architectures, generally have different controls than data
    managed by a SaaS provider''s application.


    The complexities of large cloud providers delivering SaaS, PaaS, and IaaS capabilities
    create significant incident response issues that potential customers must assess
    for acceptable levels of service. When evaluating providers it is important to
    know that the provider may be hosting hundreds of thousands of instances application.
    From an incident monitoring perspective, any foreign applications widen the responsibility
    of the security operations center (SOC). Normally a SOC monitors alerts and other
    indicators, such as produced by intrusion detection systems and firewalls, but
    the number of sources that must be monitored and the volume of notifications can
    increase exponentially in an open cloud environment, so the SOC may need to monitor
    activity between customers as well as external agents.


    An organization will need to understand the incident response strategy for their
    chosen cloud provider. This strategy must address identification and notification,
    as well as options for remediation of unauthorized access to application data.
    To make matters more complicated, application data management and access have
    different meanings and regulatory requirements depending on the data location.
    For example, an incident may involving data in Germany, whereas if the same data
    had been stored in the US it might not have been considered an issue. This complication
    makes incident identification particularly challenging.


    Some of the key recommendations include:


    +   - Cloud customers need to clearly define and communicate to cloud providers
    what they consider incidents (such as data breaches) versus mere events (such
    as suspicious intrusion detection alerts) before service deployment.

    - Cloud customers may have very limited involvement with the providers'' incident
    response activities. Therefore it is critical for customers to understand the
    prearranged communication paths to the provider'' incident response team.

    - Cloud customers should investigate what incident detection and analysis tools
    providers use to make sure they are compatible with their own systems. A proprietary
    or unusual log formats can be major roadblocks in joint investigations, particularly
    those that involve legal discovery or government intervention.

    - Poorly designed and protected applications can easily overwhelm everyone''s
    incident response capabilities. Conducting proper risk management on the systems
    and utilizing defense-in-depth practices are essential to reduce the chance of
    a security incident in the first place.'
