    Many mobile cloud applications are dealing with sensitive information. Securing
    this type of crucial information is extremely important. Data loss, data stealing
    by malwares, data leakage, unreachable Access Points (APs), unsecured market places
    are some of the security concerns. Secured Socket Layer (SSL) and digital certificates
