  md: '# PRINCIPLES AND WORKING OF CLOUD COMPUTING


    virtual systems, many popular VMMs support live migration, the process of transitioning
    a VM from one virtual machine monitor to another without halting the guest operating
    system.


    While various virtual machine monitors have different protocols for live migration,
    the underlying algorithms are similar. Live migration techniques usually begin
    by copying memory pages of the VM across the network to the destination where
    the VM continues to run within the source VMM. This process continues as pages
    are dirtied by the VM. When the source VMM reaches a threshold and deems that
    no additional significant progress is being made in the transfer of pages, it
    will halt the VMM, and signal the destination VMM to resume the execution of the
    VM. The point at which the VMM decides to halt the source VMM and copy the remaining
    pages is usually an implementation-specific heuristic that attempts to balance
    and minimize both the duration of migration and the downtime of the migrating
    VM. Other variations include the destination requesting VM pages from the source
    VMM on demand.


    While one might is not an entirely safe assumption about networks which VM images
    are migrated more common in many organizations, it is likely that the migration
    transit path may span multiple conductivity and geographic distances. Indeed,
    virtual machines have been successfully migrated across continents with application
    downtimes as low as 1 to 2 seconds. In addition, a compromised system inside an
    environment employing live migrations can facilitate unauthorized access to VM
    images. The ability to view or modify data associated with live migrations or
    influences the migration services on source and destination VMMs raises several
    important security concerns.


    While virtualization and live migration enable important functionality, the combination
    introduces several other security challenges in the underlying. A virtual machine
    monitor that incorporates a vulnerable implementation of live migration functionality
    may expose both the guest and host operating system to attack and result in a
    compromise of integrity. Given the large and increasing market for virtualization
    technology, a comprehensive understanding of virtual migration security is essential.
    However, the security of virtual migration has to be analyzed.


    Well there are three classes of threats to the migration process:


    +   **Control Plane** – The communication mechanisms employed by the VMM to initiate
    and manage live migrations must be authenticated and resistant to tampering. An
    attacker may be able to manipulate the control plane of a VMM to influence live
    migrations and gain control of a guest OS.


    +   **Data Plane** – The data plane across which VM migrations occur must be secured
    and protected against sniffing and tampering of guest OS state. Passive attacks
    against the data plane may result in leakage of sensitive information from the
    guest OS, while active attacks may result in a complete compromise of the guest
    OS.


    +   **Migration Module** – The VMM component that implements migration functionality
    must be resilient against attacks. If an attacker is able to subvert the VMM using
    vulnerabilities in the migration module, the attacker may gain control over both
    the VMM and any guest OS.'
