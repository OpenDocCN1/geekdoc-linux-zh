    # Reducing Energy Consumption


    To make energy aware applications, we need to figure out which type of applications
    that consume energy.Video and game applications can consume 50 to 70 watts by
    themselves.Our games, cameras, maps and streaming videos are welcome and celebrated
    additions to our daily routines, but we need to sacrifice energy required by their
    bright animation.Use these applications for a few hours, and you will inevitably
    in need of a charger.


    Computation offloading is a technique to migrate the large computations and complex
    processing from resource limited to resourceful devices, avoiding mobile devices
    to consume more time and energy. Remote execution can be done by MAUI (Mobile
    Assistance Using Infrastructure).Remote execution of large tasks can reduce their
    power consumption by upto 50%. MAUI to migrate mobile components to servers in
    the cloud can save 27% of energy consumption for computer games and for the chess
    game.


    # Enhancing Storage Capacity


    Storage is also a major concern for mobile devices. Mobile Cloud Computing is
    developed toenable users to store and access large amounts of data on the cloud.
    Amazon Simple Storage Service is one such example. It provides a simple web services
    interface that can be used to store and retrieve any amount of data, at anytime
    from any on the web. Flickr and Facebook are applications based on MCC. It allows
    users to upload and share photos through mobile devices and web. MCC also helps
    reduce the running cost for computeintensive applications. Cloud computing efficiently
    supports various tasks for data-ware housing, managing and synchronizing multiple
    documents online. Thus, mobile devices are no more constrained by storage capacity
    as their data is now stored on the cloud.


    # Division of Application Services


    The mobile devices have inherently limited resources. Thus the applications have
    to be divided in order to achieve a particular performance target like low latency,
    minimization of data transfer, fast response time etc. Optimal partition of application
    services across cloud and mobile devices is one basic idea for large tasks. Adaptive
    monitoring of network conditions to optimize network and device costs should also
    be done to resolve the issues in mobile cloud adoption.'
