  md: '# PRINCIPLES AND WORKING OF CLOUD COMPUTING


    In a virtualized environment the hypervisor must run at the most privileged level,
    controlling all hardware and system functions. In this model the virtual machines
    run in a lower privileged ring, typically in ring 3. Within ring 3 we can see
    the virtual machine running with an operating system on virtual hardware. Since
    the operating system was originally designed to run directly on hardware it expects
    to be running in ring 0 and will make privileged calls the hardware trap that
    are not permitted in ring 3. When the operating system makes these privileged
    calls the hardware will trap the instructions and issue a fault, which will typically
    destroy the virtual machine.


    Generally we can classify the hardware virtualization into two types we include:


    +   **Full virtualization** - In this virtualization the entire hardware is virtualized.
    This enables multiple virtual systems to run concurrently totally isolated from
    each other in the same hardware. The hypervisor or virtual machine monitor provides
    access to memory, devices, network, including the CPU.


    +   **Paravirtualization** - It requires the guest operating system kernel to
    be modified to become aware of the hypervisor the entire hardware environment
    is not virtualized. The guest operating systems are executed in their own isolated
    domains, if they are running on a separate system. Paravirtualization can attain
    better performance than full virtualization.


