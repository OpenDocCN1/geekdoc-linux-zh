  md: "# 11\nGOOGLE CLOUD MESSAGING\n(GCM) FOR ANDROID\n\n| OBJECTIVE |\n| To learn\
    \ about components and credentials of GCM\n* To know the architecture of GCM\n\
    * To identify the life cycle of GCM\n* To implement GCM\n* To make a mobile device\
    \ register with GCM |\n\n# 11.1 CONCEPTS IN GCM\n\nThere are two major concepts.\n\
    \n+   1. Components which play a key role in GCM.\n   (a) Client Application is\
    \ the GCM-enabled Android Application that is running in device or an emulator.\n\
    \   (b) Third party Application Server – The application server which send information\
    \ to the client app running on the target via GCM Connection server.\n   (c) GCM\
    \ Connection Servers – This is an intermediary between the client application\
    \ and 3rd party application server. This is Google-provided servers which take\
    \ the message from 3rd party application server to target device and vice versa.\n\
    2. Credentials which ensure that all parties are authenticated and authorized.\n\
    \   (a) Sender ID – This is the project that we got from Google Console. Refer\
    \ to the snapshots for getting the project ID in Chapter 11.\n   (b) Application\
    \ ID – This is to uniquely identify an Android application.\n   (c) Registration\
    \ ID – This is the ID to identify the target device which receives the messages\
    \ from the server. It is issued by the Google Server.\n   (d) Google User Account\
    \ – If the device is running a version lower than Android 4.0.4 at least one Google\
    \ Account is needed for GCM to work."
  merge: -1
  pgno: 265
- img_proc: true
  md: "GOOGLE CLOUD MESSAGING (GCM) FOR ANDROID 251\n\n(e) Sender Auth Token – This\
    \ is API key. For getting API key refer to Chapter 11 snapshots. For Server authorized\
    \ access to Google Services, API key is needed.\n\n# 11.2 ARCHITECTURAL OVERVIEW\n\
    \nGCM implementation includes 3rd party app server, GCM Connection Servers and\
    \ Android client app running on target device. GCM Connection Servers helps in\
    \ sending messages from Client App to 3rd Party App Server and vice versa.\n\n\
    ![](img/8d09b92c1e10775c0b9a48c126969155_266_0.png)\n\nFigure 11.1 GCM Architecture\
    \ Computing.\n\n# Component Interaction\n\n+   * GCM Connection Servers sends\
    \ messages from 3rd party app server to client app that GCM is enabled. HTTP and\
    \ XMPP are connection servers provided by Google.\n* 3rd Party App Server sends\
    \ messages to GCM connection server, which in turn en-queues and stores the message\
    \ and sends to the target device when it comes online.\n* To receive the stored\
    \ GCM messages, client app must register with GCM and get a registration ID. If\
    \ XMPP Connection server is used, client app can send message back to connection\
    \ server which results in up-streaming.\n\n# 11.3 LIFE CYCLE FLOW\n\n+   * Enable\
    \ GCM\n  An Android application running on a mobile device has to register with\
    \ GCM to receive messages.\n* Send a message – Below are the sequence of events\
    \ triggered while sending message.\n  1. The 3rdapplication server sends a message\
    \ to GCM servers.\n  2. Google connection server en-queues and stores the message\
    \ in case the device is offline.\n  3. When the device is online, Google connection\
    \ server sends the message to the device."
  merge: -1
  pgno: 266
- img_proc: true
  md: '4. Up on receiving the message, the device broadcasts the message to the specified
    Android application via Intent broadcast with proper permissions, so that targeted
    Android application gets the message. The Android application does not need to
    be running beforehand to receive the message. Intent broadcast will wake up the
    exact application even though it not running.


    5. The targeted application will then process the message.


    6. A registered Android application can unregister GCM if it no longer wants to
    receive messages.


    +   * Receive a message.


    This is the sequence of events that occurs when an Android application installed
    on a mobile device receives a message:


    +   1. The system receives the incoming message and extracts the raw key/value
    pairs from the message payload, if any.


    +   2. The system passes the key/value pairs to the targeted Android application
    in Intent as a set of extras.


    +   3. The Android application extracts the raw data from the Intent by key and
    processes the data.


