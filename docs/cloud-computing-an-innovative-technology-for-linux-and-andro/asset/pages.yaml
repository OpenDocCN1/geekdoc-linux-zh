    its unique features to the end user.


    In Linux operating system there are generally two modes:


    +   * Kernel Mode – It is used to execute all the operating system process. It
    is also known as the system mode. When the CPU is in kernel mode it is assumed
    to be executing trusted software and thus it can execute any instructions and
    reference any memory addresses. The kernel which is the core of the operating
    system and


