    Traditional Business Process Management Systems (BPMS) integrate business processes
    and keep track of running instances of these processes. A BPMS governs the execution
    of a business process step by step. Each process is monitored by the BPMS and
    provides users insights into each processes progress and show if they are completed
    successfully, or if they have crashed. In case of a crash the BPMS shows where
    the process had issues. By monitoring, evaluating and identifying where business
    processes fail companies have the opportunity to act proactively and optimize
    their processes. This will ultimately lead to lower costs and better customer
    satisfaction.


    A Process as a Service (BPaaS) is any business process or service delivered as
    a service through cloud technology solutions and its service models. With BPaaS
    one or more business processes are uploaded to a cloud service that performs and
    monitors them. Like other cloud environment, BPaaS gives companies the opportunity
    to use cloud software in a pay-per-use model, instead of having to invest in hardware
    and maintenance. It is just same as the other service models like SaaS, IaaS,
    PaaS and so on.


    The difference between traditional packaged applications and BPaaS is that BPaaS
    is designed to be service-oriented under the cloud technology. So BPaaS is likely
    to have well-defined interfaces. In addition, a BPaaS is a standardized service
    for use by many different organizations. Because these services are much more
    optimized to deliver a service consistently they can leverage automation, standardization,
    and repeatability in the way the services are used and delivered.'
