    # ## 14.4 CASE 4: WORKING WITH VMWARE CLOUD FOUNDRY INTEGRATION WITH ECLIPSE


    In this case study let us see in detail the platform as a service (PaaS) concept
    by the VMware product cloud foundry integration.


    VMware cloud foundry provides the platform for the user to design and host the
    application into the remote VMware cloud. The user must have an account to start
    it is free like all other VMware products are charged. We can install this tool
    either in Eclipse or Spring tool suite. In this case use Eclipse.


    The Cloud Foundry Eclipse is an extension that enables Cloud Foundry users to
    deploy and manage Java and Spring applications on a Cloud Foundry instance from
    Eclipse or Spring Tools Suite (STS). The plugin supports Eclipse v3.8 and v4.3
    (a Java EE version is recommended), and STS 3.0 and later.


    We will explain the PaaS concept of VMware cloud foundry using the various output
    images.


    ![](img/8d09b92c1e10775c0b9a48c126969155_395_0.png)


    In the first step download the VMware plugin from the Eclipse market. Then create
    a new VMware cloud foundry server from the new server wizard.'
