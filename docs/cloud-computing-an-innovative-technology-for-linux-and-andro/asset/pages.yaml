  md: '# CLOUD

    COMPUTING


    (An Innovative Technology for Linux and Android Platforms)


    # ABOUT THE BOOK


    This book has been prepared in such a way so that it can cater to the requirements
    of various kinds of readers – the basic reader, an expert person from this industry
    and the students, teachers, scholars, researchers and technocrats. Moreover, it
    can satisfy the ever dynamic IT industry also. It has 14 chapters, viz., Introduction
    to Cloud Computing, Principles and Working of Cloud Computing, Classification
    of Cloud, Services of Cloud, Cloud in Action, Real Time Cloud and its Application,
    Linux and Open Source Cloud. Ubuntu Cloud Computing, Mobile Cloud, Android in
    Cloud, Google Cloud Management (GCM) for Android, Business Computing, Issues and
    Risk in Cloud Computing and Case Studies.


    # ABOUT THE AUTHORS


    D. S. Ananduram obtained his Bachelor’s degree in Electrical and Electronics Engineering
    from “Maharaja Engineering College – Avinashi” and Master’s degree in Computer
    Science and Engineering from “Arumila Kalasam of Engineering – Krishnan Kohli”
    under Madurai Kamaraj University. He has Ph.D in Software Networks under Anna
    University. He has 16 years of teaching experience. Presently he is working as
    an Assistant Professor (Section) of ISTE, CSI & IEEE. He has received two awards,
    “Best Staff” award for the year 2007-08. He has authored more than 70 books. He
    has published 20 Papers in International and National Journals and 10 Papers in
    International and National Conferences. Area of interest includes, Sensor Networks
    and Network Computing. He is an Editorial Board Member of International Journal
    of Computing Academic Research (IJCAR).


    T. Priya completed her Bachelor’s degree in Information Technology from “Vellar
    College of Engineering and Technology” and Master’s degree in Computer Science
    and Engineering from “K. S. Ramaswamy College of Technology – Tiruchengundur”
    under Anna University. She gained one year industrial experience in Torry Harris
    Business Solutions, MNC, Bangalore. During that period, she developed SOA based
    services for used by Bharat Telecom Company. She did an internal project in android
    entitled “Expense Manager” in Torry Harris Business Solutions. Furthermore, she
    completed an unrivalled venture entitled “TELECOM ACCOUNT MANAGEMENT” adopting
    Java, MySQL, JPA and Spring Technologies. She is a Certified Java Associate proficient
    by Sun Microsystems. She has additional certifications for C, C++, .NET and C#.
    At present she is working as an Assistant Professor in Kong Engineering College,
    Tamil Nadu. She has led state level workshop demonstrated two national level workshops
    on Android.


    M.C. Arvind Babu obtained his Bachelor’s degree in Information Technology from
    Kong Engineering College under Anna University, Combatore with the distinction
    category. He has received the best student award in the department of Information
    Technology for the academic year 2012-2013. He is working as a project engineer
    in Wipro technologies, Chennai. He has more than four years of experience in the
    field of cloud computing. He has successfully written seven papers in the field
    of cloud computing and has presented the same in several conferences, and other
    presentation competitions. He won second prize for his innovative topic presentation
    in National Institute of Technology (NIT), Trichy in 2012. He also participated
    in the international conference conducted by University of Edinburgh, International
    Outreach on 2013 on the Internet and Society.


