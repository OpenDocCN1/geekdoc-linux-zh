  md: '# INTRODUCTION TO CLOUD COMPUTING


    groups together large numbers of computer servers and other resources and typically
    offers their combined capacity on an on demand basis. The end users of a cloud
    computing network usually have no idea where the servers are physically located
    or where the applications are executed or data is stored they just start their
    application and start working.


    Cloud computing is fully enabled by the virtualization technology and virtual
    appliances. A virtual appliance is an application that is bundled with all the
    components that it needs to run, along with a streamlined operation. In a cloud
    computing environment, a virtual appliance can be instantly provisioned and decommissioned
    as needed without complex configuration of the operating environment.


