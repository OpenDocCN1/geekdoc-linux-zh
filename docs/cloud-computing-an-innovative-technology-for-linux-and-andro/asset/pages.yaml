    # Time Shared vs Space Shared Scheduler


    Time shared policy helps to Share the computing resource among many users. This
    helps in multiprogramming. Spacespaced policy divides the resources among many
    tasks so that no execution of task can affect other task execution. There are
    four scenarios possible with these scheduling policies.


    +   1. Space shared for both Cloudlets and virtual machines.

    2. Time shared for both Cloudlets and virtual machines.

    3. Space shared for Cloudlets and Time shared for virtual machines.

    4. Time shared for Cloudlets and Space shared for virtual machines.


