    # 4.4 INFRASTRUCTURE AS A SERVICE


    The next service model we will see in Infrastructure as a Service (IaaS). The
    term infrastructure means the required platform or a basic architecture using
    which many services or functionalities can be delivered. Speak technically in
    terms of the cloud technology IaaS provides the required infrastructure as a service
    for the computation of the end user task. The infrastructure varies from the virtual
    data centers, virtual servers, virtual hardware, networking connections, load
    balancers and so on. It quite interesting to know that such a large infrastructure
    is provided as a service in cloud by the underlying techniques of virtualization
    and distributed computing.


    The core idea behind IaaS is that the hardware required for various task is provided
    as a service from the remote centers. The remote centers are managed by the various
    service providers who also include the giant IT companies. An organization simply
    pays a monthly fee to use these resources internally, and the cloud host is responsible
    for ensuring the ongoing care of hardware and virtualized services. The service
    providers of IaaS need to maintain the large pool of all the required infrastructure
    by the end user or business community. The data centers and servers in the cloud
    must be powerful enough to handle multiple requests by several clients at a time.
    They must be robust to overcome any failure at the time of usage by multiple clients.
    The remote centers are so vast and scattered that the cloud user will not know
    the exact location where the requests are handled. The IaaS model is designed
    in such a way that the results of computation by virtual servers and data centers
    are accurate, faster and reliable.


