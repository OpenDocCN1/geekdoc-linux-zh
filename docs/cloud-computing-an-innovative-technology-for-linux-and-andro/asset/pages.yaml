  md: '# 14.5 CASE 5: WORKING WITH GOOGLE APP ENGINE AND HOSTING THE APPLICATION


    In this case study, we will see the another PaaS concept of cloud computing using
    the google product google app engine. We have already seen it in the chapter 7
    about the google cloud products.


    Google app engine comes under the platform as a service (PaaS) concept which provides
    the required platform to design the application, host the application into the
    google cloud. In this case study, we use the Eclipse software to work with the
    google app engine.


    We will explain the process with worked out the images.


    ![](img/8d09b92c1e10775c0b9a48c126969155_404_0.png)


    When with Eclipse software, we download the Google plugin from the eclipse marketplace.
    It takes time to download and install the required packages into the Eclipse.
    It depends on the speed of the internet and there will be no firewall blockage.'
