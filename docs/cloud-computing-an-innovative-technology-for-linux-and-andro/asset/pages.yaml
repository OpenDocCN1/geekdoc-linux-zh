    with each without any mediators. It is direct in the communication.


    The independent clouds can be further classified into:


    +   - **Services** – Application provisioning is done by a service which can be
    hosted either or in house by the cloud clients. Most such services include broker
    components in themselves. Typically application developers specify an SLA or a
    set of provisioning rules and the service performs the deployment and execution
    in the background, in a way respecting these predefined attributes.


    +   - **Libraries** – Often custom application brokers that directly take care
    of provisioning and scheduling application components across clouds are needed.
    Typically such approaches make use of inter-cloud libraries that facilitate the
    usage of multiple clouds in a uniform way.'
