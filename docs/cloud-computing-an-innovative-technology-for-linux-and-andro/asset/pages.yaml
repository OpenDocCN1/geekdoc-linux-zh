  md: '# 10.10 DIFFERENCE BETWEEN C2DM AND GCM


    | Features | C2DM | GCM |

    |---|---|--|

    | API Key | Client Login Auth Token. But it is deprecated. | Simple API from Google
    console. |

    | Sender ID | It is just an email address. | Project number obtained while creating
    the project in Google console. |

    | JSON | Does not suport JSON. | Supports JSON |

    | Multicasting | Not supported | Supported |

    | Multiple Senders | Not Supported | Multiple senders can send messages to the
    same app with one common registration ID |

    | Time to Live | Not featured. | Ranges from 0 to 4 weeks. GCM will store the
    messages until they expire. A message with a time-to-live value of 0 will not
    be stored on the GCM server. |

    | Messages with payload | It sends light weight messages probably to tell the
    application that a new data is available on the server. | Deliver messages up
    to 4Kb. |

    | Canonical Registration ID | Not supported. | Supported. |


    # 10.11 MIGRATION FROM C2DM TO GCM


