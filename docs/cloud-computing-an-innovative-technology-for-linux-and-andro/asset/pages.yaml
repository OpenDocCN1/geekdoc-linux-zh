  md: '# Chapter 1


    # INTRODUCTION TO CLOUD COMPUTING


    # OBJECTIVE


    +   - To learn about the new cloud computing technology

    - To know the list of all computing techniques and the evolution of cloud

    - To know the characteristic and need for cloud computing

    - To know the overall architecture of cloud computing


    # 1.1 WHAT IS CLOUD....


    The word cloud literally makes us think of the meteorological cloud in the sky.
    But technically speaking cloud refers to a set of devices connected using internet.
    It is an advanced networking technology evolved from the various predecessor computing
    techniques. A group of devices connected together in a remote fashion to perform
    the end user task in a highly reliable and concurrent ways refers to the term
    cloud. A cloud can consist of several devices of various types ranging from a
    traditional desktop based computer, hand held mobile devices of smart technology
    to powerful servers connected by a high speed internet. It refers to sharing of:


    +   - Data

    - Resources both software and hardware

    - Workspaces

    - Running process or application


    Thus cloud involves a sharing of more active and a dynamic resource rather than
    a static cloud. The cloud involves the migration of loosely coupled resource to
    the end user independent of the location and platform. The concept of sharing
    resource in cloud has a broader meaning which we will see in detail in the upcoming
    chapters.


    Apart from sharing of resources cloud capabilities include:


    +   - Clouds can host a variety of different workloads, including batch-style
    back-end jobs and interactive, User-facing applications.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# CLOUD COMPUTING


    +   * Clouds allow workloads to be deployed and scaled-out quickly through the
    rapid provisioning of virtual machines or physical machines.

    * Clouds support redundant, self-recovering, highly scalable programming models
    that allow workloads to recover from many unavoidable hardware/software failures.

    * Monitor resource usage in real time to enable rebalancing of allocations when
    needed.


    Clouds also support non-grid environments such as a three-tier Web architecture
    Standard or Web 2.0 applications. A cloud is more than a collection of computer
    resources because a cloud provides a mechanism to manage those resources. Management
    includes provisioning, change requests, reimagaging, workload rebalancing, deprovisioning,
    and monitoring. A cloud infrastructure can be a cost efficient model for delivering
    information services, reducing IT management complexity, promoting innovation,
    and increasing responsiveness through time workload balancing.


    A typical cloud consist of a collection of interconnected and virtualized computers
    or any other devices that are dynamically provisioned and presented as one or
    more unifying computing resources based on service-level agreements established
    through negotiation between the cloud provider and consumers. Clouds are clearly
    next-generation data centers with nodes virtualized through hypervisor technologies
    and dynamically provisioned on demand as a personalized resource collection to
    meet a specific service-level agreement, which is established through a negotiation
    and as as a service via Web 2.0 technologies in a modern web browser.


    Along with cloud one must also understand the meaning of the word Computing. It
    is usually defined as the activity of using and developing computer technology,
    computer hardware, and software. It is the computer-specific part of information
    technology. Computer science or computing science is the study of the theoretical
    foundations of information and computation and its implementation and application
    in computer systems.


    Generally we can define computing to mean any goal-oriented activity requiring,
    benefiting from, creating computers. Computing includes designing and building
    hardware and software systems for a wide range of purposes, structuring, and managing
    various kinds of information using scientific studies making computer systems
    behave intelligently creating and using communications and entertainment media
    feeding and gathering information relevant to any particular purpose, and so on.
    The list is virtually endless, and the possibilities are vast.


    # The NIST definition of cloud computing


    Cloud computing is a model for enabling convenient, on-demand network access to
    a shared pool of configurable computing resources (e.g., networks, servers, storage,
    applications, and services) that can be rapidly provisioned and released with
    minimal management effort or service provider interaction.


    Thus, cloud computing is a relatively new way of referring to the use of shared
    computing resources, and it is an alternative to having local servers handle 갔다
    applications. Cloud computing'
