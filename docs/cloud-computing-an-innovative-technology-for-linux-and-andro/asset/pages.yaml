    The web technology generally involves a simple client server model of architecture.
    There are many advanced networking models available today but commonly they are
    of client server model. The cloud technology involves higher and advanced architectural
    models called service models. Which includes platform as a service (PaaS), Infrastructure
    as a service (IaaS), Software as a service (SaaS) and so on.


    # # Operating System Environment


    Well to design and host web applications can be implemented in both Windows and
    Linux operating system environment successfully. But for cloud computing the concepts
    of virtualization can be worked in real time only under Linux environment. Almost
    all the cloud tools are only installed in Linux environment.


