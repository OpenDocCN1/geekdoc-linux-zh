  md: 'ANDROID IN CLOUD


    239


    # Workings of C2DM


    +   - Third-party application servers can send lightweight messages to target
    Android applications running on target device. The goal of this messaging service
    is only to send a notification to the target device about the updated data on
    server not to send huge user content.

    - C2DM notifies the data updated in the server. It does not bother about the delivery
    and order of messages.

    - When the message arrives, C2DM wakes up the application via Intent broadcast.
    But the application will woke up only when the broadcast receiver and permissions
    are properly set. Thus an application on Android doesn''t need to running to receive
    messages.

    - No built-in user interface or other handlers of message data are done with C2DM.
    C2DM passes raw message data straight to the application. It is the task of the
    application to transform the raw data and to make it displayed with custom user
    interface.

    - The target mobile devices should be running on Android 2.2 or higher version
    and should have Google account set.


    # 10.9 GOOGLE CLOUD MESSAGING FOR ANDROID


    Google Cloud Messaging allows sending data from the server to target device and
    from device to server. GCM allows large messages to be transferred between the
    server and the mobile device. GCM supports notification to the target mobile device
    when the information is updated on the server.


    # Features of GCM


    +   - GCM helps in sending information from a 3rd party applications to the mobile
    app.

    - GCM supports waking up an Android Application via Intent Broadcast and hence
    the application is not needed to run all the time.

    - Similar to C2DM, it does not support built-in-interface. So the task of displaying
    the raw data is left for the Android application.

    - It needs Android 2.2 or higher version with Google Play store libraries installed.

    - If the device is less or equal to 3.0 devices, it needs an existing Google account.
    Google account is not needed for android mobile with version higher or equal to
    4.0.4.'
