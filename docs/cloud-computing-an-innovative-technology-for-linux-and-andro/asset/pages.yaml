    # Node Controller (NC)


    A UEC node is a VT enabled server capable of running KVM as the hypervisor. UEC
    automatically installs KVM when the user chooses to install the UEC node. The
    VMs running on the hypervisor and controlled by UEC are called instances. Eucalyptus
    supports other hypervisors like Xen apt from KVM, but Canonical has chosen KVM
    as the preferred hypervisor for UEC.


    Node Controller (NC) runs on each node and controls the life cycle of instances
    running on the node. The NC interacts with the OS and the hypervisor running on
    the node on one side and the Cluster Controller (CC) on the other side.


