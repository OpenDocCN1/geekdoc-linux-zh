  md: '+   Low-latency data access


    Applications that require low-latency access to data in the tens of milliseconds
    range will not work well with HDFS. Remember HDFS is optimized for delivering
    a high throughput of data and may be at the expense of latency. HBase is currently
    a better choice for low-latency access. Lots of small files since the name node
    holds file system metadata in memory, the limit to the number of files in a file
    system is governed by the amount of memory on the name node. As a rule of thumb,
    each file, directory, and block takes around 150 bytes. So, for example, if you
    have one million files, each one block, you would need at least 300 MB of memory.
    While storing millions of files is feasible, billions is beyond the capability
    of current hardware.


    +   Multiple arbitrary file modifications


    Files in HDFS may be written by a single writer. Writers are always made to the
    end of the file. There is no support for multiple writers, or for modifications
    at offsets in the file.


    # MapReduce


    Hadoop MapReduce is a software framework for easily writing applications that
    process vast amounts of data like multi-terabyte data-sets in parallel on clusters
    (thousands of nodes) of commodity hardware in a reliable, fault-tolerant manner.


    MapReduce usually splits the input data into independent chunks which are processed
    by the map tasks, which are then input to the reduce tasks. The framework sorts
    the outputs of the maps, the input and output of the job are stored in a file
    system. The framework takes care of scheduling tasks, monitoring and re-executes
    the failed tasks.


    Typically the compute nodes and the storage nodes are the same as the MapReduce
    framework and the Distributed File System are running on the same set of nodes.
    This configuration allows the framework to effectively schedule tasks on the nodes
    where data is already present in very high aggregate bandwidth across the cluster.


    A MapReduce job is a unit of work that the client wants to be performed consists
    of the input data, MapReduce program, and configuration information. Hadoop runs
    the job by dividing it into tasks, of which there are two types map tasks and
    reduce tasks. There are two types of nodes that control the job execution jobtracker
    and a number of tasktracker. The jobtracker coordinates all the jobs on the system
    by scheduling tasks to run on tasktracker. Tasktracker run tasks and send progress
    reports to the jobtracker, which keeps a record of the overall progress of each
    job. If a task fails the jobtracker can reschedule it on a different tracker.
    Hadoop divides the input to a MapReduce job into fixed-size pieces called split
    input, or just splits. Hadoop creates one map task for each split, which runs
    the user defined map function for each record in the split.'
