    # 10.4.2 Application Framework


    ![](img/8d09b92c1e10775c0b9a48c126969155_246_0.png)


    Application framework is the block that our applications directly interact with.
    It is designed to simplify the use of components. Any application can publish
    its capabilities and any other applications may make use of those capabilities.
    This framework manages the basic functions of a mobile phone resource management,
    voice call management and etc.


    +   - Activity Manager – manages states of different activities.

    - Window Manager – responsible for organizing the screen.

    - Content Providers – Enabling applications to access data from other applications
    or to share their data.

    - View System – manages UI elements

    - Package Manager – manages application packages that are currently installed
    on the device.

    - Telephony Manager – handles making and receiving phone calls.

    - Resource Manager – Providing access to non-code resources (localized strings,
    graphics, and layout files)

    - Location Manager – obtains the device''s position.

    - Notification Manager – Enabling all applications to display customer alerts
    in the status bar.'
