  md: '# Virtualization


    The ability to provide multi-tenant cloud services at the infrastructure, platform,
    or software level is often underpinned by the ability to provide some form of
    virtualization to create economic scale. However, use of these technologies brings
    additional security concerns. This domain lacks at security issues. While there
    are several forms of virtualization, by far the most common is the virtualized
    operating system, and this is the focus in our version of guidance. If Virtual
    Machine (VM) technology is being used in the infrastructure of the cloud services,
    then we must be concerned about compartmentalization and hardening of VM systems.


    The reality of current practices related to management of virtualizing operating
    systems is that many of the processes that provide security-by-default are missing,
    and special attention must be paid to replacing them. The core virtualization
    technology introduces new attack surfaces in the hypervisor and other management
    components, but more important is the severe impact virtualization has on network
    security. Virtual machines communicate over a hardware backplane rather than a
    network. As a result, standard network security controls are blind to this traffic
    and cannot perform monitoring or in-line blocking. These controls need to take
    a new form to function in the virtual environment.


    Commingling of data in centralized services and repositories is another concern.
    The centralized database provided by a Cloud Computing service should improve
    security over data distributed over a vast number and mixture of endpoints. However,
    this is also centralizing risk, increasing the consequences of a breach.


    Another concern is the commingling of VMs of different sensitivities and security.
    In Cloud Computing environments, the lowest common denominator of security will
    be shared by all tenants in the multi-tenant virtual environment unless new security
    architecture can be achieved that does not "wire in" any network dependency for
    protection.


    Some of the key recommendations:


    +   - Identify which types of virtualization your cloud provider uses, if any.

    - Virtualized operating systems should be augmented by third party security technology
    to provide layered security controls and reduce dependency on the platform provider
    alone.

    - Understand which security controls are in internal to the VMs other than the
    built in hypervisor isolation — such as intrusion detection, anti-virus, vulnerability
    scanning, etc. Secure by default configuration must be assured by following or
    exceeding available industry baselines.

    - Understand which security controls are in external to the VMs to protect administrative
    interfaces (web-based, APIs, etc.) exposed to the customers.'
