    # 1.2 HISTORY OF CLOUD COMPUTING


    Everything in the world has a past, nothing comes like it''s of today in the beginning.
    Lets us use the overall history of cloud computing in this section. Evolution
    of cloud technology dates back to 1950s when the concept of sharing resources
    was realized. The internet technology was in initial stages. The computer in those
    days was a large machine, far complex and not as advanced as it is today. Every
    invention in the computer technology has changed the way computer functions and
    increasing its applications to the end user. The networking technology further
    made the computer technology to grow faster making it an intelligent super for
    communication purpose and to handle all real times.


    # Mainframes in 1950


    The concept of resource sharing dates back to 1950 when there was a mainframe
    revolution in corporations. The large mainframes were installed in a specific
    room from where the users used to share the data storage and CPU power. Thus this
    was the first instance where the resource was shared. From here the sharing concept
    into being.'
