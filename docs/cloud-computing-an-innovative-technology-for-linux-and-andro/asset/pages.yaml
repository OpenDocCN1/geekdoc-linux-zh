    # Scheduling Algorithm


    The polling processing application may need to process millions of transactions
    per day, store the biometric information of the people. The main purpose of using
    the scheduling algorithm is to improve the communication overhead between the
    local cloud server to the many. Due to a high number of concurrent workflow instances,
    the algorithms should focus on minimizing the execution time of all process in
    order to maximize the overall throughput rather minimizing the execution time
    of individual process.


    Execution time is the time spent from the beginning of the first task to the end
    of the last task. Throughput is the ability of resource to process a certain number
    of instances in a period of time. They can be modeled as resource-intensive cloud
    workflow with considerable communication overheads. The main characteristic of
    such workflow is a high number of relatively simple concurrent instances which
    may involve considerable communication overhead among relevant tasks. Thus it
