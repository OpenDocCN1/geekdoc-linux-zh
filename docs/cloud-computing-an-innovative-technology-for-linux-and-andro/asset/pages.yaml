  md: '# How CloudSim Works?


    A Datacenter consists of a set of hosts. Host can instantiate Virtual Machine
    (VM) scheduler. VM scheduler allocates the processors to VMs. Cloudlets are tasks
    that will be executed in VMs. We can add as many cloudlets as we can in a VM.


    Below are the step by step execution of simulating a cloud in CloudSim.


    +   1. Initialize CloudSim Package using init() method. The init() method is used
    to initialize the CloudSim library.

    2. Create datacenter by createDatenter() method. This is an essential step when
    any cloud to be executed; we need to create a datacenter.

    3. Create Broker by createBroker() method. Broker is an interface between the
    consumer and provider.

    4. Create virtual machines and add VMs to VM list. We can create as many virtual
    machines as we need.

    5. Create cloudlets by setting properties like id, length, filesize. Add the created
    cloudlets to the cloudlets list.

    6. Submit cloudlet to broker.

    7. Start simulation

    8. Stop simulation

    9. Show Output


    # Running a sample example in CloudSim.


