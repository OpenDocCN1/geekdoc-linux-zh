    # 14.2 CASE2:IMPLEMENTATION OF A CLOUD ENVIRONMENT WITH CLOUDSIM


    At the end of this case study, you can be able to figure out:


    +   * What is CloudSim?

    * Features of CloudSim.

    * Install CloudSim in Eclipse IDE

    * Running a sample example in CloudSim.

    * Time Shared Vs Space Shared scheduler.

    * Simple example with 3 cloudlets uspaceshares policy for cloudlets and VMs.


    We will explain the whole process using the worked out snapshots.


    # What is CloudSim?


    CloudSim is an open source simulation kit that helps in modeling and simulation
    of Cloud Computing scenarios. This tool kit was originally found by the GRIDS
    laboratory of University of Melbourne. For users, who are unaware of Simulation,
    Simulation is the process which provides the users with practical feedback when
    designing real world system.'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# CASE STUDIES


    In this case, the real world system is cloud system. Before the system is constructed,
    CloudSim allows the designer to determine the correctness and efficiency of a
    design. The overall cost in designing the real cloud computing system can be reduced
    to certain extent, since the problem with the design can be solved in the simulation
    phase. This rejects the need of developing a cloud environment for testing your
    algorithm in which the cloud setup is very costly and time consuming. The main
    goal of CloudSim is to provide a generalized and extensible simulation framework
    that enables modeling, simulation and experimentation of fore Cloud designs. CloudSim
    is flexible to its users, which allows the users to focus on specific system design
    that they are researching, without knowing the low level details like Cloud infrastructure
    and services.


    # Benefits of CloudSim


    +   There are many features that are provided by CloudSim.CloudSim being available
    at free of cost, which can support the modeling and simulation of the following.

    - CloudSim helps in simulating Data Centres hardware on a single node. (Wait,
    let me re-read)

    - CloudSim helps in simulating Data Centres hardware on a single node. A data
    centre is a centralized repository for storing, managing and dissemination of
    data and information pertaining to a particular business. This helps in simulating
    physical machines composed of processors, storage devices, memory and internal
    bandwidth.

    - Creation, and destruction of virtual machines can also be done. Virtual machine
    software does not physically exist but created to emulate the behaviour of a computer.

    - Energy Aware computational resources can be built using CloudSim. Virtualization
    makes cloud run multiple Virtual Machines on single node, which leads to the design
    of energy aware computational resources. This brings enhanced modelling of power-aware
    and energy efficient Cloud computing.

    - This supports modelling of internal data center topologies and message-passing
    applications.

    - It helps in simulating federated clouds. Federated cloud is the deployment and
    management of multiple external and internal cloud computing services that perform
    a common action.

    - Dynamic insertion of simulation elements can also be done by CloudSim. Simulation
    can be stopped and resumed.

    - Allocation of hosts and hosts to VMs is also supported by CloudSim.


    # Install CloudSim in Eclipse IDE


    Download CloudSim from `code.google.com`. CloudSim-3.0.3.zip is the recent version.
    This version of CloudSim brings enhanced modelling of power-aware and energy efficient
    Cloudcomputing, and also a new package allowing modelling of internal data center
    topologies and message-passing applications.'
