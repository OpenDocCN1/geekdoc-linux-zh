  md: '# ANDROID IN CLOUD


    Migration from C2DM to GCM is very easy two replacement process. One is to replace
    email account in C2DM with project number. And another is to replace ClientLoginAuth
    with the API key.


    Since the sender ID in GCM is project number, the email account in C2DM is replaced
    by the project number that we get from the Google Console. Another major change
    is to change the deprecated ClientLoginAuth token with the API key that we obtained
    from the Google Console. Below are the snapshots to show how to get project number
    and API key for GCM.


