    # 9.3 MOBILE CLOUD APPS VS NATIVE APPS


    The key differences between native applications and mobile cloud applications
    are as follows.


    # Native Apps


    A native app is one that is installed directly on a smartphone. In developer''s
    perspective, it is an app that is stored on the mobile device or is downloaded
    from an app store and installed on the mobile device. App developers create this
    native apps taking into version of mobile device, PCs or tablets. This kind of
    App is developed for a particular device and its operating system. Data associated
    with this native app is also stored on the device. Latest technology available
    on mobile devices like GPS and camera can be used by native Apps.


    # Mobile Cloud Apps


    Mobile cloud apps can be related to Web-based applications. Similarities among
    mobile cloud and web apps are that they run on servers and require the use of
    a browser on the mobile device to display app User Interface. In addition, they
    are targeted for multiple mobile devices unlike native apps which are targeted
    for single mobile device. Both Web apps and cloud apps go hand in hand. Cloud
    based apps is an application running in cloud which is providing requested services
    to the recipient mobile devices through web apps. Unlike mobile devices, Cloud
    ready run cloud-based Web apps rather than native apps.'
