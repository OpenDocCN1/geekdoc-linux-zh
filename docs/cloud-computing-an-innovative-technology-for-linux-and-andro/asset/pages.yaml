  md: '# BUSINESS CLOUD COMPUTING 267


    For industrial oriented term of cloud computing we say it is enterprise cloud
    computing. The word enterprise cloud computing refers to the business related
    operations and the usage of cloud computing technology for all their work. Cloud
    computing service models and its types are becoming the new way of working in
    a corporate IT sector. Every major IT companies are moving towards this technology.
    The close alignment of business related corporate IT sector and cloud computing
