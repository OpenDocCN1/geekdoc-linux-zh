  md: 'Firstly the KVM was designed after the advent of hardware assisted virtualization
    it did not have to implement features that were provided by hardware. The KVM
    hypervisor requires Intel VT-X or AMD-V enabled CPUs and leverages those features
    to virtualize the CPU. KVM was able to design an optimized hypervisor solution
    without requiring the supporting of any legacy hardware or requiring modifications
    to the guest operating system.


    Another design principle was not to reinvent the core features which already exist.
    Since the Linux kernel already includes the core features required by a hypervisor
    and has been hardened into a mature and stable enterprise platform over 15 years
    of support and development it is more efficient to build on that base rather than
    writing all the required components such as a memory manager, scheduler, etc.,
    from the ground up.


    Another key decision made by the KVM team was to incorporate the KVM into the
    upstream Linux kernel The KVM code was submitted to the Linux kernel community
    in December of 2006 and was accepted into the 2.6.20 kernel in January of 2007
    At this point KVM became a core part of Linux and is able to inherit key features
    from the Linux kernel.


    In the KVM architecture the virtual machine is implemented as regular Linux process,
    schedule by the Linux scheduler. In each virtual CPU appears as a regular Linux
    process. This allows KVM to benefit from all the features of the Linux kernel.
    Device emulation is handled by a modified version of QEMU that emulated BIOS,
    PCI bus, USB bus and a standard set of devices such as IDE and SCSI disk controllers,
    network cards, etc


