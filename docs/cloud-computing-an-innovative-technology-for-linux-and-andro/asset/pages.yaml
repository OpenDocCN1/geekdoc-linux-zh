    # Legal Issues


    Cloud computing creates dynamics in the relationship between an organization and
    its information, involving the presence of a third party cloud provider. This
    creates new challenges in understanding how laws apply to a wide variety of information
    management scenarios.


    A complete analysis of Cloud Computing-related legal issues requires consideration
    of functional, jurisdictional, and contractual dimensions.


    +   * The functional dimension involves determining functions and services in
    Cloud Computing have legal implications for participants and stakeholders.

    * The jurisdictional dimension involves the way in which governments administer
    laws and regulations impacting Cloud Computing services, the stakeholders, and
    the data assets.

    * The contractual dimension involves the contract structures, terms and conditions,
    and enforcement mechanisms through which stakeholders in Cloud Computing environments
    can address and manage the legal and security issues.


    Cloud Computing in general can be distinguished from traditional outsourcing in
    three ways the time of service (on-demand and intermittent), the anonymity of
    identity of the service provider and anonymity of the location of the server.
    When considering IaaS and PaaS specifically, a great deal of orchestration, configuration,
    and software development is performed by the customer so much of the responsibility
    cannot be transferred to the cloud provider


    Compliance with recent legislative and administrative requirements around the
    world force stronger collaboration among lawyers and technology professionals.
    This is especially true in Cloud computing, due to the potential for new areas
    of legal risk created by the distributed nature of the cloud, compared to international
    or outsourced infrastructure. Numerous laws and regulations in the United States
    and the European Union either impose liability to subcontractors or require business
    entities impose liability upon them contract.


    Courts now are relying that information security services are critical to making
