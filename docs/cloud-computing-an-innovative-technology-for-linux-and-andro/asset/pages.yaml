    # Swift


    Swift is an object store to store a large number of objects distributed across
    commodity hardware. Swift has built-in redundancy and failover management and
    features like backing up or archiving data, serving graphics or videos. It is
    scalable to multiple petabytes and billions of objects. Swift provides elasticity
    and flexibility of cloud based storage for your web applications.


    # Functions and Features


    +   - Storing the machine images


    +   - Working as an independent data container


    +   - Redundancy and Failover


    +   - Backup and Archival


    +   - Extremely scalable


    # Glance


    OpenStack Imaging Service is a lookup and retrieval system for virtual machine
    images. It can be configured to use any one of the following 3 storage backends:


    +   - OpenStack Object Store to store images


    +   - S3 storage directly


    +   - S3 storage with Object Store as the intermediate for S3 access.


    # Functions and Features (Glance)


    +   - Provides imaging service


    # Components of OpenStack Imaging Service (Glance)


    +   - Glance-api,


    +   - Glance-registry


    # Horizon


    Horizon provides a modular web-based user interface for all the OpenStack services.
    With this web GUI, perform most operations on cloud launching an instance, assigning
    IP addresses and setting access controls.


    # Keystone


    Keystone provides authentication and authorization for all the OpenStack services.
    It also provides a service catalog of services within a particular OpenStack cloud.'
