    # 5. Reliability


    Not only is this, in the mobile phone''s perspectives, many other challenges needed
    to be faced by the mobile cloud techs. When we access the cloud from mobile, there
    might be connection loss due to coverage gaps. Unlike fixed network where a physical
    link supports consistent network bandwidth, wireless connectivity is characterized
    by variable data rates and intermittent connectivity to gaps in coverage. The
    dynamic nature of mobile networks result in throughput demands, subscriber mobility
    and uncontrollable factors like weather can cause bandwidth capacity and coverage
    to vary. Moreover, mobile networks generally have longer network latency than
    fixed network.


    # 6. Access


