    # VMware


    VMware is a major company which has worked in the field of virtualization and
    cloud computing for the past several years. It has developed many more products
    and solutions in these fields. It is also a big player in both virtualization
    and cloud computing. VMware offers a commercial hypervisor called ESX.


    ESX runs on bare metal and does not require a separate operating system. Instead
    it comes with an included Linux kernel that is booted and used to load device
    drivers and other features required by the hypervisor. The Linux kernel provides
    access to all devices of the guest operating system using these drivers. In principle
    VMware is that virtualization solution. However Scan-Before-Execution the VMware
    marketing term for its run-time pre-virtualization technology, allows the guest
    system to run unmodified by VMware.


    ESX uses a Linux kernel to load additional code it is referred as the vmkernel.
    In the event of a hardware error, the vmkernel can catch a Machine Check Exception.
    This results in an error message displayed on a purple diagnostic screen. This
    is colloquially known as a purple diagnostic screen, or screen of death.


    Live migration (vMotion) in ESX allows a virtual machine to move between two different
    hosts. Live storage migration (Storage Migration) enables live migration of virtual
    disks on the fly. During vMotion Live Migration of a running virtual machine (VM)
    the content of the RAM (memory) of the VM is sent from the running VM to the new
    VM. The content of memory is by nature catching all the time. ESX uses a system
    where the content is sent to the other VM and it will check what data is changed
    and send that time smaller blocks. At the last moment it will briefly freeze the
    existing VM, transfer the last changes in the RAM content and then start the new
    VM.


    # KVM


    It is the recent hypervisor technology to be made available in the market. Its
    feature and working are quite interesting and useful. KVM consists of two parts
    the KVM module that is used to virtual memory and QEMU an emulator for virtualization
    of I/O. KVM provides solution to make a Linux kernel into a hypervisor by loading
    a module. Each guest operating system is now a process in user mode of the KVM
    hypervisor. KVM assumes that it is running on a processor with hardware support
    for virtualization.


    KVM is implemented as a loadable kernel module that converts the Linux kernel
    into a bare metal hypervisor. There are two key design principals the KVM project
    adopted that have helped it mature rapidly to a stable and high performance hypervisor.'
