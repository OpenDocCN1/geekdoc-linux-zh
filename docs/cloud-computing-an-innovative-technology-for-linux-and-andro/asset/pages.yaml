    Full virtualization is best suited for:


    +   - sharing a computer system among multiple users

    - isolating users from each other

    - emulating new hardware to improve reliability, security and productivity


    Virtualization is accomplished by the use of a hypervisor to logically assign
    and separate physical resources running in a same hardware. The hypervisor allows
    a guest operating system running on the virtual machine to function as if it were
    solely in control of the hardware unaware that other guests are sharing it. Each
    guest operating system is protected from the others and is unaffected by any instability
    or configuration issues of the others.


