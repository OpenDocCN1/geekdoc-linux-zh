    are not tightly coupled with other applications or information. The idea is that
    if they are tightly coupled, they are difficult, if not impossible, to decouple,
    and thus will not operate independently on a remote platform. If they are loosely
    coupled, fit is not an issue. Loosely coupled applications are a much better fit
    for cloud computing. In a remote cloud apps needs be loosely coupled only then
    applications can easily migrate and work in the virtual environment.


    +   * When the points of integration are well defined – When there are well defined
    points within an application where application can share data, behavior, and processes.
    Thus, they are easy to integrate with applications back in the enterprise. Cloud
    applications must be well integrated so that it can be provided as a service to
    the end user.'
