    # Nova


    Nova is the underlying cloud computing fabric controller for the OpenStack cloud.
    All

    activities needed to support the life cycle of instances within the OpenStack
    cloud are

    handed by Nova. It manages all the compute resources, networking, authorization,
    and

    scalability needs of the OpenStack cloud. Nova is a management platform and not

    provide any virtualization capabilities by itself, instead it uses libvirt APIs
    to interact with

    the supported hypervisors. Nova exposes its capabilities through a web services
    API that is

    compatible with EC2 of Amazon Web Services.


    # Functions and Features


    +   * Instance life cycle management

    * Management of compute resources

    * Networking and Authorization

    * REST-based API

    * Asynchronous eventually consistent communication

    * Hypervisor agnostic support for Xen, XenServer, KVM, UML and Hyper-v


    Nova Cloud Fabric is composed of the following major components:


    +   * API Server (nova-api)

    * Message Queue (rabbit-mq server)

    * Compute Workers (nova-compute)

    * Network Controller (nova-network)'
