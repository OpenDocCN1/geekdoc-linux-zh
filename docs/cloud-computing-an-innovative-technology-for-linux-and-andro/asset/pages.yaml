  md: '# Virtualizing the X86 Architecture


    Now we see how the hardware virtualization actually works with the x86 architecture.
    The x86 architecture has proven to be the dominate platform in enterprise computing,
    moving from its humble beginnings in desktop systems to now, powering the large
    enterprise applications that run across the globe. The current generation of x86
    CPUs include features such as large multi-threading with 8 or more processing
    cores, for large memory systems with Non Uniform Memory Access (NUMA) and integrated
    memory controllers, high speed CPU interconnects and chipset for suport Reliability,
    Availability and Serviceability (RAS) features.


    In order to provide a secure operating system environment x86 architecture provides
    a mechanism for isolating user applications from the operating system using the
    notion of privilege levels. In this model the processor provides 4 privilege levels,
    also known as rings which are arranged in a hierarchical fashion from ring 0 to
    ring 3. The overall hardware virtualization concept involves the privilege levels
    popularly known as rings.


    Ring 0 is the most privileged with full access to the hardware and is able to
    call privileged instructions. The operating system runs in ring 0 with the operating
    system kernel access to the underlying hardware. Rings 1, 2 and 3 operate at a
    lower privilege level and are prevented from executing instructions reserved for
    the operating system.


    In commonly deployed operating systems such as Linux and Microsoft Windows the
    operating system runs in ring 0 and the user applications run in ring 3. Rings
    1 and 2 historically have not been used by modern commercial operating systems.
    This architecture ensures that an application running in ring 3 that is compromised
    cannot make privileged system calls, however a compromise in the operating system
    running in ring 0 hardware exposes applications running in the lower privileged
    levels. While this model provides benefit for traditional bare metal deployments
    it presents challenges in a virtualized environment.


    | Applications | |

    | Operating System | Operating System |

    | Emulated Hardware | Emulated Hardware |

    | Hypervisor Ring 3 |

    | Physical Hardware Ring 0 |


    Figure 2.5 Virtualization in x86 architecture.'
