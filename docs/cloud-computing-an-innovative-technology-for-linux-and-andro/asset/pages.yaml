    # Application Security


    Cloud environments by virtue of their flexibility, openness, and open public availability
    challenge many fundamental assumptions about application security. Some of these
    assumptions are well understood; however many are not. This section is intended
    to document how Cloud Computing influences security over the lifetime of an application
    from design to operations to ultimate decommissioning. This guidance is for all
    stakeholders including application designers, security professionals, operations
    personnel, and technical management on how to best mitigate and manage assurance
    within Cloud Computing applications. Cloud Computing is a particular challenge
    for applications across the layers of Software as a Service (SaaS), Platform as
    a Service (PaaS) and Infrastructure as a Service (IaaS). Cloud-based software
    applications require a design rigor similar to applications residing in a cloud
    DMZ. This includes a deep up-front analysis considering all the traditional aspects
    of managing information confidentiality, integrity, and availability.'
