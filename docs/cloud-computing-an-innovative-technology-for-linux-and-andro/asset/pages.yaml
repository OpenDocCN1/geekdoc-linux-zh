  md: '# INTRODUCTION TO CLOUD COMPUTING


    # IBM in 1970


    In 1970 the IBM developed an operating system called VM, which can run multiple
    virtual machines with guest operating system. Virtual machine can be defined as
    the several operating systems running in the same hardware with the user working
    in them as if the only OS running at a time. It was intended to leverage investments
    in expensive mainframe computer. The idea was to enable multitasking running multiple
    applications and processes for different users simultaneously. Thus the hardware
    virtualization technology came into existence with several virtual machines running
    in a same platform. Every VM can run the guest operating system with却是 memory,
    processing and networking technology. IBM was also the early leader in computer
    hardware and networking technology.


    # Communication revolution of 1990s


    In early 90s the telecommunication companies started the revolution of internet
    and infrastructure growth in the field of communication. The users were connected
    to a virtualized private network connection which provided the same service as
    the dedicated to point connection. Thus the revolution of internet had started
    and the traffic increased by infinite times. The internet itself had undergone
    several layers of advancements and changes. The web world Wide Web (WWW) was as
    the beginning of the revolution of web technology and its service to the mankind
    in the milestone of computer technology. The concept of OSI layer was made as
    a standardization of the networking technology.


    The concept of Electronic – mail was realized by several section of the society.
    Thus the growth of internet was in full revolution and the migration of computer
    technology from the traditional methods also took place in this period of time.
    By the beginning of 2000 the super communication internet was ready to reach the
    end user. Many hardware devices were introduced into the market. Each one had
    their specific functionality, making the task of end user very simple. Large companies
