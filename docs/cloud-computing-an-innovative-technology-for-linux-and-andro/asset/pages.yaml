    # 9.4 MOBILEOUD COMPUTING (MCC) ARCHITECTURE


    Data processing and storage services are provided to the mobile users by Mobile
    Cloud Computing. All complex computing modules can be processed in clouds. Thus
    the recipient do not need any powerful configurations. Mobile devices are connected
    to the mobile networks through different base stations like base transceiver station
    (BTS), access point, or satellite that establish and connect the connections and
    functional interfaces between the networks and mobile devices. Mobile users requests
    and information like ID and location are transmitted to the central processors
    that are connected to servers providing mobile network services. Mobile network
    operators can provide services to mobile users as AAA counts to Authentication,
    Authorization, and Accounting based on the Home Agent (HA) and subscribers'' data
    stored in databases. With the help of Internet Service Providers, Mobile networks
    can get connected to cloud computing servers. After that, the subscribers'' requests
    are delivered to a cloud through the Internet. In the cloud, cloud controllers
    process the requests to provide mobile users with the corresponding cloud responses
    or services.'
