  md: '# Xen


    The Xen hypervisor was created at the University of Cambridge at the end of the
    1990''s as part of the Xenerver research project. The Xen community develops and
    maintains Xen as free and open source software. The first open source release
    of the Xen hypervisor was done 2002, and the current version of the hypervisor
    is 4.3 as of 2013. It can then be considered a mature and stable product. Commercial
    support is provided by XenSource Xen is also provided as the virtualization solution
    by providers like Red Hat, Novell, and Sun. Xen is currently marketed by Citrix.


    Responsibilities of the hypervisor include memory management and CPU scheduling
    of all virtual machine and launching the most privileged domain popularly referred
    as dom0 the only virtual machine which by default has access to hardware. From
    the dom0 the hypervisor can be unmanaged and privileged domains dom can be launched.
    Xen boots from a bootloader such as GNU GRUB, then usually loads a paravirtualized
    system into the home


    Xen is usually considered a paravirtualization solution, although version 4.0
    adds capabilities for virtualization. Xen handles devices by running a special
    operating system in a special high-privilege Xen domain (dom0). This operating
    system handles all device requests and has optimized drivers for the available
    hardware. The guest operating system then has to be modified to work against these
    interfaces. One needs to enable the hypervisor by using any virtual tool or cloud
    tool.


    There are commands in Linux to manage the Xen and all its functionalities. Let
    us see the commands and how they work in the terminal of Ubuntu operating system.


    xm - xen management user interface. The basic structure of the command looks like
    this xm subcommand domain-id [OPTIONS]


    The xm program is the main interface for managing Xen guest domains. The program
    can be used to create, start, pause, resume, destroy and shutdown domains. It
    can also be used to list guest domains, enable or list VCPUs, and attach or detach
    virtual block devices.


    The status of the host and guest systems may be viewed at any time using the list
    option of the xm command.


    # xm list


    It displays the list of host and guest systems with the current state which includes:


    +   - r - running The domain is currently running and healthy.

    - b - blocked The domain is blocked, and not running or runnable. This can be
    caused because the domain is waiting on IO (a traditional wait state) or has gone
    to sleep because there was nothing else for it to do.

    - p - paused The domain has been paused, typically as a result of the administrator
    running the xm pause command. When in a paused state the domain will still consume
    allocated resources like memory, but will not be eligible for scheduling by the
    Xen hypervisor.'
