    153


    has complete control over everything that occurs in the system is trusted software
    but all other programs are considered untrusted software.


    +   * **User Mode** – It is to execute all the applications of the user. It is
    a non privileged mode. Thus all user mode software request use of the kernel by
    means of a system call in order to perform privileged instructions such as process
    creation or input output operations.


    ![](img/8d09b92c1e10775c0b9a48c126969155_168_0.png)


    **Figure 7.1** Linux architecture and its components.


    The architecture of the Linux operating system consists of five main components:


    +   * **Kernel** – It act as an **interface between operating system and other
    hardware resources.** It is the main part of the operating system that loads first
    and remains in the main memory. Kernel is the core part of operating system. When
    someone makes any changes to the kernel files it affects the whole operating system.
    It is the bridge between the application and the actual data processing to support
    the application. It is responsible for task management, memory management and
    disk management. Its primary function is to manage the computer resources and
    support other programs who want to use these resources.


    The Linux kernel presents a virtual interface to user processes. Processes are
    written without needing knowledge of what physical hardware is installed on a
    computer. The Linux kernel abstracts all hardware into a consistent virtual interface.
    In addition Linux supports multi-tasking execution in a manner that is transparent
    to user processes. Each process can act as though it is the only process on the
    computer, with exclusive use of main memory and other hardware resources. The
    kernel actually runs several processes concurrently and is responsible for mediating
    access to hardware resources so that each process has access while inter-process
    security is maintained.


    The Linux kernel is composed of five main subsystems which include:


    +   * **The scheduler** – It is responsible for controlling process access to
    the CPU. The scheduler enforces a policy that ensures that processes will have
    fair access to the CPU while ensuring necessary hardware actions are performed
    by the kernel on time.'
