    # Hadoop Distributed File System


    The Hadoop Distributed File System is a distributed file system designed to hold
    very large amounts of data and provide high-throughput access to this information.
    Files are stored in a redundant fashion across multiple machines to ensure their
    durability to failure and high availability by parallel applications.


    +   * Very large files

    Very large refers to the files that are hundreds of megabytes, gigabytes, or terabytes
    in size. There are Hadoop clusters running today that store petabytes of data.


    +   * Streaming data access

    HDFS is built around the idea that the most efficient data processing pattern
    is a write once many patterns. A dataset is typically generated or copied from
    source then various analyses are performed on that dataset over time. Each analysis
    will involve a large portion if not all of the dataset to read the whole dataset
    is more important than the latency in reading the first.


    +   * Commodity hardware

    Hadoop does not require expensive highly reliable hardware to run on. It''s designed
    to run on clusters of commodity hardware like commonly available hardware from
    multiple vendors for the chance of node failure across the cluster is high at
    least for large clusters. HDFS is designed to carry on working without a noticeable
    interruption to the user in the face of such face. It is also worth examining
    the applications for using HDFS does not work so well. While this may change in
    the future these are areas where HDFS is not a good fit today.'
