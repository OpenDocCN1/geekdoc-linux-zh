    # 3.4 HYBRID CLOUD


    In last sections, we saw two types of cloud namely the private and public cloud
    respectively. Now let us see the third category in cloud called *hybrid cloud*.
    The hybrid clouds are extension to the private cloud by using both the local and
    remote resources. It is generally used when the capacity or cloud traffic suddenly
    increases. It is known by the term cloud bursting. It can be defined as the sudden
    increase in the access to the remote cloud by multiple users at a time. Thus a
    hybrid cloud is created when the remote resources are integrated into the private
    cloud.


    Imagine a situation when the IT company has its extracts lots of resources from
    the cloud to accomplish all the task in the Company. At a particular stage the
    saturation of the cloud reaches, where the pooled resources are unable to fulfill
    all request of the cloud users. In such cases the private cloud can be extended
    or integrated with the other remote resources to satisfy the cloud user task.
    Thus the concept of hybrid cloud comes into existence.


    Speaking from the business point of view of the advantages of the hybrid cloud
    includes:


    +   - **Optimal optimization** – generally in cloud only 5 to 20 of the resources
    are used on average basis. Rest of the clouds are idle. But at the cloudburst
    time and demand of cloud users is too high. Hybrid cloud helps in the optimal
    utilization of the pooled resources in the cloud especially at the time of cloudburst.

    - **Data center consolidation** – instead of providing capacity or the resources
    for worst-case scenarios only, a private cloud only requires resources for the
    average case. The option to burst out server consolidation and hence the reduction
    of operating costs. In particular, this includes the costs for hardware, power,
    cooling, maintenance, and administration. Thus using hybrid clouds the private
    clouds are becoming dependent on other cloud.'
