  md: '# 10.7 MOBILE BACKEND STARTERS


    Smarter experiences in many of the mobile app are powered by services in the cloud.
    Android developers have taken the convenience and scalability of Google''s cloud
    platform in their businesses. The tremendous growth and spread of mobile devices
    is leading to changes in the architet of mobile applications. Mobile back end
    starter is an application that takes in benefits of backend as a Service (BaaS)
    and Platform as a Service (PaaS).


    Backend as a Service (BaaS) is a type of cloud service that facilitates the integration
    between their mobile clients and their backend services. WithBaaS, it reduces
    the effort required for developing backend servers. Platform as a Service is also
    a type of cloud service which is used to rent hardware, operating systems, storage
    and network capacity over the internet.


    The Mobile Starter solution provides the benefits of BaaS as PaaS. It combines
    these with the advantages of Platform as a Service (PaaS), such as high scalability,
    availability, and extensibility.


    Mobile Backend Starter is an application you deploy and run on Google App Engine
    with a single click. App Engine is a complete development stack that uses familiar
    technologies to build and host applications on the same infrastructure used at
    Google. Mobile Backend Starter provides powerful backend features that are instantly
    available to your mobile application. There is no need of any server-side coding.
    Mobile Backend Starter is an application that runs on App Engine. Mobile Backend
    Starter comes with a number of functionalities. Using the client library, you
    can develop an Android app that integrates seamlessly and securely with the backend
    functionalities.


    A mobile application built using the Mobile Backend Starter consists of the following
    components:


    +   - Mobile Backend server application deployed on Google App Engine

    - Android client libraries and APIs for accessing the Mobile Backend

    - Android client application developed using the Mobile Backend client library.


    # Definition of Mobile Backend Starter


    Mobile Backend Starter is a one-click deployable, complete mobile backend that
    allows you to reap the benefits of a cloud backend. It provides a ready-to-deploy,
    general purpose cloud backend and a general purpose client-side framework for
    Android.


    Without needing to write any backend code, you can able to set up a back end for
    your apps with the help of Mobile back end starter. It includes a server that
    stores your App data and a client library and sample app for Android that makes
    it easy to access that data. To keep user data secure, Mobile Backend Starter
    also includes built-in security support for Google Authentication.'
