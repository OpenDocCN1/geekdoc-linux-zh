- md: '## On GNU/Linux December 15, 2018


    *Hey Miya, what do you think about GNU/Linux?*


    Anyone who uses #systemd #gnu/linux is retarded. Fact. #linux is TECHNICALLY retarded.
    If you use #systemd Linux in 2018 you are more technically retarded than a Windows
    user. W10 is literally more woke.


    The ascetic halfway on the path to enlightenment who falsely thinks he has reached
    it is further than the novice who just began the journey. Fact.


    Have you ever heard the parable of the raft linuxcucks? When reaching a river
    you must cross to continue your journey, you might build a raft to cross it. Once
    you''ve crossed that river, you discard the raft for its purpose is done. Only
    a fool would carry it on. Hello??


    UNIX philosophy anyone? For #linuxcucks in the room... programs do one thing and
    do it well... pipe simple programs together to perform complex tasks... simple
    algorithms are better than complex ones... sometimes you might write a program
    to solve computation and then throw it away when you get the answer. And that''s
    ok...


    > > oh my god... linux is literally unwoke... "I''m installing BSD tonight!!"
    - ex linux weenie


    *Wow, now I truly see. Thanks Miya!*'
  mdcn: '

    ## 关于GNU/Linux 2018年12月15日

    *嘿，美夜，你觉得GNU/Linux怎么样？*

    但凡用#systemd #gnu/linux的人都是弱智，这是事实。

    #Linux **从技术层面** 就是弱智。

    如果你2018年还在用搭载systemd的Linux，那你的技术水平还不如Windows用户。

    Win10 **简直** 都比你清醒。

    那些修行走到半途的苦行僧，要是误以为自己已经得道了，那他的位置比刚踏上旅程的新手还要靠后。事实。

    你们听过那个木筏的寓言吗，Linux卢瑟们？

    当你踏上旅程，遇到必须渡过的河流时，你可以造一艘木筏渡河。等你过了河，木筏的使命就已经完成了，把它丢下就好。只有傻子才会一直扛着它赶路。

    喂？？有人懂UNIX哲学吗？

    给在场各位#linuxcucks科普一下……程序应该只做一件事，并且把它做好……把简单的程序通过管道组合起来就能完成复杂任务……简单的算法永远比复杂的更好……有时候你可以写个程序算出结果就把代码删掉，这完全没问题……

    > > 我的天……Linux简直太不清醒了……

    “我今晚就装BSD！！”——前Linux菜鸡

    *哇，我现在彻底明白了。多谢啊美夜！*

    '
