  md: '# # Linux Complete Backup and Recovery HOWTO


    Charles Curley


    ccurley at trib dot com


    # ## Revision History


    | Revision | Date | Revised by |

    | --- | --- | --- |

    | Revision 0.02 | 2002–01–27 | Revised by: c^2 |

    | Added Mondo to resources | | |

    | Revision 0.01 | 2001–10–25 | Revised by: c^2 |

    | Initial version for LDP release | | |


    Imagine your disk drive has just become a very expensive hockey puck. Imagine
    you have had a fire, and your computer case now looks like something Salvador
    Dali would like to paint. Now what?


    Total restore, sometimes called bare metal recovery, is the process of rebuilding
    a computer after a catastrophic failure. In order to make a total restoration,
    you must have complete backups, not only of your file system, but of partition
    information and other data. This HOWTO is a step-by-step tutorial on how to back
    up a Linux computer so as to be able to make a bare metal recovery, and how to
    make that bare metal recovery. It includes some related scripts.'
  merge: -1
  img_proc: true
