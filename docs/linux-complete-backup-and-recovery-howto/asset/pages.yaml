- pgno: 17
  md: '# 10. What Now?


    This HOWTO results from experiments on one computer. No doubt you will find some
    directories or files you need to back up in your first stage backup. I have not
    dealt with saving and restoring X on the first stage, nor have I touched at all
    processors than Intel.


    I would appreciate your feedback as you test and improve these scripts on your
    own computers. I also encourage vendors of backup software to document how to
    do a minimal backup of their products. I''d like to see the whole Linux community
    sleep just a little better at night.


    # 10.1. To Do


    Volunteers are welcome. Check with me before you start on one of these in case
    someone else is working on it already.


    +   - A partition editor to adjust partition boundaries for a different hard drive,
    or the same one with different geometry, or to adjust partition sizes within the
    same hard drive. A GUI would be a good idea here. On the other tactile, the FSF''s
    parted looks like it will fill part of the bill. It does re-size existing partitions,
    but with restrictions.

    - make.fdisk currently splits out one script. Separate out the mount counts to
    another script, so you can run make.dev.hda then reboot to do something else,
    like build a partition for exotic OS I never heard of, or parted, then reboot
    to tombsrt, mount all the Linux partitions, and continue.

    - Since tombsrt supports bzip2, convert the scripts to bzip2, and see if there
    is a noticeable reduction in the first stage data saved.

    - make.fdisk currently only recognizes FAT partitions, not all. Add code to make.fdisk
    to recognize others and make appropriate जिक्र to rebuild them in the output files.

    - For FAT12 or FAT16 partitions we do not format, write zeros into the partition
    that Mess-DOS 6.x does get confused. See the notes on fdisk for an explanation
    of the problem.

    - Make a script to partition ext2 file systems on ZIP disks.

    - Translations into other (human) languages.

    - Find out how loadlinux or similar programs affect this process.

    - Changes for GRUB

    - Change the scripts to use a CD-ROM. A CD-ROM that would boot to tombsrt, with
    the first stage restore data on the rest of it, which would be the ticket.'
