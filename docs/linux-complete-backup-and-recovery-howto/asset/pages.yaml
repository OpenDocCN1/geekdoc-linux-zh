  md: '# 11.1.4. save.metadata


    This is the first script to run as part of the backup process. It calls make.fdisk,
    above. If you have a SCSI hard drive or multiple hard drives to back up, edit
    the call to make.fdisk appropriately.


    ```

    #! /bin/sh


    # A script to save certain meta-data off the boot partition. Useful for

    # restoration.


    # Time-stamp: <2001-11-19 09:18:52 ccurley save.metadata>


    # Copyright 2000 through the last of modification, Charles Curley.


    # This program is free software; you can redistribute it and/or modify it

    # under the terms of the GNU General Public License as published by the

