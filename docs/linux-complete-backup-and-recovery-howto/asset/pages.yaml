- pgno: 5
  md: '# 2. Overview


    The process shown below is not easy, and can be hazardous to your data. Practice
    it before you need it! Do I did, and practice on a sacrificial computer!


    The target computer for this HOWTO is a Pentium computer with a Red Hat 7.1 Linux
    server or workstation installation on one IDE hard drive. The target computer
    does not have amounts of data because the computer was set up as a "sacrificial"
    test bed. I did not want to test this process with a production computer and production
    data. Also, I did a fresh install before I started the testing so I could always
    re-install if I needed to revert to a known configuration.


    ![](img/b7e9f987ef9af3f87243de7cf4b11b84_5_0.png)


    # NOTE


    The sample commands will show, in most cases, what I had to type to recover the
    target system. You may have to use similar commands, but with different parameters.
    It is up to you to be sure you duplicate your system, not the test computer''s
    setup.


    The basic procedure is set out in W. Curtis Preston, Unix Backup & Recovery, O''Reilly
    & Associates, 1999, which I have favorably reviewed in Linux Journal. However,
    the book is a bit thin on specific, real-time questions. For example, exactly
    which files do you back up? What metadata do you need to preserve, and how?


    Before beginning the process set fact in this HOWTO you need to back up your system
    with a typical backup tool as Amanda, BRU", tar, Arkeia or cpio. The question,
    then, how to get from toasted hardware to the point where you run the restoration
    will restore your data.


    Users of Red Hat Package Manager (RPM) based Linux distributions should also save
    RPM metadata of their normal backups. Something like:


    ```

    bash# rpm -Va /etc/rpmVa.txt

    ```


    in your backup script will give you a base for comparison after a bare metal restoration.


    To get this, you need:


    +   - Your hardware and running again, with replacement components as needed.
    The BIOS should be properly configured, including time date, and hard drive parameters.
    At the moment, there is no provision for a different hard drive.

    - A parallel port Iomeg@ZIP drive or equivalent. You will need at least 30 MB
    of space.

    - Your backup media.

    - A minimal Linux that will allow you to run the restoration software.


    To get there, you need at least two stages of backup, and possibly three. Exactly
    what you back up and in which stage is determined by your restoration process.
    For example, if you are restoring a server, you may not networking during the
    restoration process. So only back up networking in your regular backups.


    # 2. Overview'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'You will restore in stages. In stage one, we build partitions, file systems,
    and restore a minimal file system from the ZIP® disk. The goal of stage one is
    to be able to boot a running computer with a network connection, tape drives,
    restoration software, or whatever we need for stage two.


    The second stage, if it is necessary, consists of restoring backup software and
    any relevant databases. For example, suppose you use Arkeia you are building a
    bare recovery ZIP® disk for your backup. Arkia keeps a huge database on the server''s
    hard drives. You can recover the database from the tapes, if you want. Instead,
    not tar and gzip the whole akeia directory (/usr/knos), and to save that to another
    computer over nfs or ssh? Stage one, which we have defined below, does not include
    X, so you will have some experimenting to do if you wish to boot up X as your
    backup program. Some restore require X.


    Of course, if you are using some other backup program, you may have some work
    to do. You will have to find the directories and files it needs to run. If you
    use tar, gzip, cpio, mt or dd for your backup and recovery tools, they will be
    saved and restored from your ZIP® disk as part of the one process describe how.


    The last stage is a total restoration from tape or other media. After you have
    done that last stage, you should be able to boot to a fully restored and operational
    system.


    # 2.1. Limitations


    HOWTO is restricted to making a minimal backup such that


    Even with that narrow brief, HOWTO is not exhaustive. You still have some research,
    script editing, and testing to do.


    The scripts here restore the partition data exactly as found on the source hard
    drive. This is nice if you restoring on an identical computer or at identical
    hard drive, but that is not the case. For now, there are two remedies (which will
    make more sense after you''ve read the rest of the HOWTO):


    +   - Edit the partition table file. I''ve done a few times. You can also add
    to this new partitions or deleting ones (but edit the script that uses the partition
    table file as well).

    - Build a new partition table and go from there. That is one reason why restore_metadata
    does not call the hard drive rebuilding script. (Another being that I don''t know
    what hard drives you have drove.) Make sure you remove the call to fdisk from
    the rebuilding script.


    The scripts shown here only handle ext2fs, FAT12 and FAT16. Until some eager volunteer
    supplies code for doing in these scripts, you will need other tools for backing
    up and restoring file systems we''t covered. Partition Image looks like a useful
    candidate here.'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# 3. Preparation


    > WARNING


    Do your normal backups on their regular schedule. This HOWTO is useless if you
    don''t do that.


    Build yourself a rescue disk. I use tomsrtbt. It is well documented and packs
    a lot of useful tools onto one floppy diskette. There is an active list for it,
    and the few questions Ive had were quickly and accurately answered. I like that
    in a product my shop may depend on one day.


    Next, figure out how to do the operating system backup you will need that you
    can restore your normal backup. I followed Preston''s advice and used an Iomega®
    parallel port ZIP® drive. The drives get approximately 90 MB of useful storage
    to a disk. I need about 85 MB to back up my desktop, so a 100MB ZIP® drive may
    be pushing your luck.


    # 3.1. Installing the ZIP® Drive


    Installing the ZIP® drive is covered in the ZIP® Drive HOWTO, available at the
    Linux Documentation Project and at its home page, http://www.njtom.com/dansie/zip-drive.html.


    ![](img/b7e9f987ef9af3f87243de7cf4b11b84_7_0.png)'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# 4. Creating the Stage 1 Back Up


    Having made production backups, you need to preserve your partition information
    so that you can rebuild your partitions.


    The script make.fdisk scans a hard drive for partition information, and saves
    it in two files. One is an executable script, called make.dev.x. The other, dev.x
    (where "x" is the name of the device file, e.g. hda), contains the commands for
    fdisk. You specify which hard drive you want to build scripts for (and thus the
    file names) by naming the associated device file as the argument make.fdisk. For
    example, a typical IDE system,


    ```

    bash# make.fdisk /dev/hda

    ```


    spits out the script make.dev.hda and the input file for fdisk, dev.hda.


    In addition, make.fdisk encounters a FAT partition over FAT32, it preserves the
    partition''s boot sector in a file named dev.xy, where x is the device name (e.g.
    sdc) and y is the partition number. The boot sector is the first sector, 512,
    of the partition. This sector is restored at the same time the partitions are
    rebuilt, in the script make.dev.hda


    Fortunately, the price of hard drives is plummeting as fast as the public''s trust
    in politicians after an election. So it is good that the output files are text,
    and allow easy editing. Now, that''s the only way to rebuild on a larger partition.
    (See the To Do List](http://example.com/to-do-list))


    Other metadata are preserved in the script save.metadata. The script saves the
    partition information in the file fdisk.hda in the root of the ZIP® disk. It is
    a good idea to print this file and your /etc/fstab so that you have hard copy
    which you ever have to restore the partition data manually. You can save it by
    toggling between two consoles, running fdisk in one and catting /etc/fstab or
    fdisk.hda as needed. However, doing so is error prone.


    You will also need to preserve files for your restoration method. For example,
    if you use nfs to save your data, you will need to preserve hosts,devs, etc. Also,
    if you are using any network-backed restoration process, such as Amanda or Quick
    Restore, you will need to preserve networking files like HOSTNAME, hosts, and
    the relevant software tree.


    The simplest to handle and similar questions is to preserve the entire etc directory.


    There is no way like a 100 MB ZIP® drive is going to hold a server installation
    of a modern distribution of Linux. We have to be more selective than simply preserving
    the whole kazoo. What files do we need?


    +   * The boot directory.

    * The /etc directory and subdirectories.

    * Directories needed at boot time.

    * Device files in /dev.


    To determine the directories needed at boot, we look at the boot initialization
    file /etc/rc.sysinit. It sets its one path like so:


    ```

    PATH/bin:/sbin:/usr/bin:/usr/sbin

    export PATH

    ```


    # 4. Creating the Stage 1 Back Up'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Linux Complete Backup and Recovery HOWTO


    Trial and error indicated that we needed some other directories as well, such
    as /dev. In Linux, you can''t much without device files.


    In reading the script save.metadata, note that we aren''t necessarily saving files
    that are called with absolute paths.


    We may require several iterations of back up, test the bare metal restore, re–install
    from CD and try again, before we have a working backup script. While I worked
    on this HOWTO, I made five such iterations before I had a successful restoration.
    That is one reason why it is essential to use scripts whenever possible. Test
    thoroughly!


    # 4. Creating the Stage 1 Back Up'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# 5. Booting tomsrbt


    The first thing to do before starting the restoration process is to verify that
    the hardware time is set correctly. Use the BIOS setup for this. How close to
    exact you have to set the time depends on your applications. For restoration,
    within a few minutes of time should be accurate enough. This will allow time-critical
    events to pick up where they left off when you finally launch the restored system.


    Before booting tomsrbt, make sure your ZIP® drive is placed on a parallel port,
    either /dev/lp0 or /dev/lp1. The start-up software will load the parallel port
    ZIP® driver for you.


    The next step is to set the video mode. I would like to see as much on the screen
    as I can. When the option to select a video mode, use 6, 80 columns by 60 lines.
    Your hardware or may not be able to handle high resolutions like that, so experiment
    with it.


    Once tomsrbt has booted and you have a console, mount the ZIP® drive. It is probably
    a good idea to mount it only:


    ```

    # mount /dev/sdal /mnt - ro

    ```


    Check to be sure it is here:


    ```

    # ls -1 /mnt

    ```


    Then change to the directory where the scripts are on the ZIP® drive.


    ```

    # cd /mnt/root.bin

    ```


    Now run the script that will partition the information, e.g.:


    ```

    # .make.dev.hda

    ```


    This script will:


    +   * Clean the first 1024 bytes of the hard drive, killing off any existing partition
    table and master boot record (MBR).

    * Recreate the partitions from the information gathered when you ran make.fdisk.

    * Make ext2 file system partitions and Linux swap partitions as appropriate.

    * Make some types of FAT partitions.

    * Make mount points and the ext2 partitions for you.


    > NOTE


    If you have other operating systems to restore, now is a good time to do so. First,
    reboot tomsrbt to finishing Linux. You will have to mount the partitions you just
    built. Make a new, separate, script to mount the partitions to the tail end of
    the make.dev.x script.


    Once you have created all your directories and mounted partitions to them, you
    can run the script restore.metadata. This will restore the contents of the ZIP®
    drive to the hard drive.


    # 5. Booting tomsrbt'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'You should see a directory of the ZIP® disk''s root directory, then a list
    of the archive files as they are restored. Tar on tomsrtbt will tell you tar''s
    block size is 20, and that''s fine. You can ignore it. Be sure that lilo prints
    out its results:


    ```

    Added linux *

    ```


    That will be followed by the output from a "df -m" command.


    If you normally boot directly to X, you could have some problems. To be safe,
    change your boot run level temporarily. In /target/etc/inittab, find the line
    that looks like this:


    ```

    id:5:initdefault:

    ```


    and change it to this:


    ```

    id:3:initdefault:

    ```


    Now, you can gracefully reboot. Remove the tomsrtbt floppy from your floppy drive
    if you haven''t already done so, and give the computer the three fingered salute,
    or its equivalent:


    ```

    shutdown -r now

    ```


    The computer will shut down and reboot.


    +   5. Booting tomsrtbt'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# 6. Second Stage Restoration


    As the computer reboots, go back to the BIOS and verify that the clock is more
    or less correct.


    Once you have verified the clock is correct, exit the BIOS and reboot to the hard
    drive. You can simply let the computer boot in its normal sequence. You will see
    a lot of error messages, mostly along the lines of "I can''t find blah! Waahhh!
    If you have done your homework correctly until now, those error messages won''t
    matter. You don''t need linuxconf or apache to do what you need to do.


    # NOTE


    As an alternative, you can boot to single user mode (at the lilo prompt, enter
    linux single), but you will have to configure your network manually and set up
    sshd or whatever daemons you need to restore your system. How you do things is
    very system specific.


    You should be able to log into a root console (no X — users, sorry). You should
    now be able to use the network, for example to nfs mount the backup of your system.


    If you did the two stage backup I suggested for Arkeia, you can now restore Arkeia''s
    database and executables. You should be able to run


    ```

    /etc/rc.d/init.d/arkeia start

    ```


    and start the server. If you have the GUI installed on another computer with X
    installed, you should now be able to log in to Arkeia on your tape server, and
    prepare your restoration.


    # NOTE


    When you restore, read the documentation for your restoration programs carefully.
    For example, tar does not normally restore certain characteristics of files, like
    laid bits. File permissions are set by the user''s umask. To restore your files
    exactly as you saved them, use tar''s option. Similarly, make sure your restoration
    software will restore everything exactly as you saved it.


    To restore the computer:


    ```

    bash# restore.all

    ```


    If you used tar for your backup and restoration, and used the -k (keep old files,
    don''t overwrite) option, you will see a lot of this:


    ```

    tar: usr/sbin/rpcinfo: Could not create file: File exists

    tar: usr/sbin/zbdum: Could not create file: File exists

    tar: usr/sbin/zic: Could not create file: File exists

    tar: usr/sbin/ab: Could not create file: File exists

    ```


    # 6. Second Stage Restoration'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Linux Complete Backup and Recovery HOWTO


    This is normal, as tar is overwriting files you restored during the first stage
    of restoration.


    Then you reboot. On the way down, you will see a lot of error messages, such as
    "no such pid." This is a normal part of the process. The shutdown code is using
    the pid files daemons that were not running when the backup was made to shut down
    daemons that were not started on the last boot. Of course there''s no such pid.


    Your system should come up normally, with a lot fewer errors than it had before,
    ideally no errors. The acid test of how well your restore works on an RPM system
    is to verify all packages:


    ```

    bash# rpm -Va

    ```


    Some files, such as configuration and log files, will have changed in the normal
    course of things, and you should be able to mentally filter those out of the report.
    You can redirect the output to a file, and diff it against the one that was made
    at backup time (/etc/rpmVa.txt), thereby speeding up this step considerably. Emacs
    users should check out its diff facilities.


    Now you should be up and running. It is time to test your applications, especially
    those that run as daemons. The more sophisticated the application, the more testing
    you may need to do. If you have remote users, disable them using the system, or
    make it "read only" while you test it. This is especially important for databases,
    to prevent making any corruption or data loss worse than it might be.


    If you normally boot to X, and disabled it above, test X before you re-enable
    it. Re-enable it by changing that line in /etc/inittab back to:


    ```

    id:5:initdefault:

    ```


    You should now be ready for rock and roll — and some aspirin and a couch.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# # 7. Distribution Specific Notes


    Below are distribution notes from past experiences. If you have additional notes
    that you would like to add for other distributions, please forward them to me.


    # ## 7.1. Red Hat 7.1


    This distribution is the one I use on my test computer. I have had no problems
    with it.


    # ## 7.2. Red Hat 7.0


    This version seems to require libcrack in (/usr/lib) and its attendant files in
    order to authenticate users. So in `save.metadata`, add to the line that saves
    `/usr/lib` the following: `/usr/lib/*crack*` and enable that line.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# 8. Application Specific Notes


    I have listed below notes about backing up particular applications.


    # 8.1. Squid


    Squid is a http proxy and Cache. As it keeps a lot of temporary data on the hard
    drive. There is no point in backing up that. Insert "--exclude /var/squid/squid"
    into the appropriate tar command in your second stage backup script. Then, get
    squid to rebuild its directory for you. Tack the tail end of the second stage
    restore script to initialize it. This is how I did it over ssh


    restore.tester:


    ```

    ssh $target ''mkdir /var/spool/squid ; chown squid:squid /var/spool/squid;

    /usr/sbin/squid -z;touch /var/spool/squid/.OPB_NOBACKUP''

    ```


    The last command creates a file of length 0 called OPB_NOBACKUP. This is for the
    benefit of Arkeia and tells Arkeia not to back up this directory


    # 8.2. Arkeia


    Arkeia is a backup and restore program that runs on a variety of platforms. You
    can use Arkeia as part of a bare metal restore scheme, but there are two caveats.


    The first is the most problematic, as absent any more elegant solution you have
    to hand select the directories to restore in the navigator at restoration time.
    The reason is that, apparently, Arkeia has no mechanism for restoring files already
    present on the disk, not analogous to tar -p option. If you simply allow a full
    restore, the restore will crash as Arkeia over-writes a library which is in use
    at restore time, e.g. lib/libc-2.1.so. Selection of directories to restore is
    best at doi, so I recommend it against.


    The second is that you have to back up the Arkeia data dictionary and/or programs.
    To do that, modify the save.metadata script by adding Arkeia to the list of directories
    to save:


    ```

    # Arkeia specific:

    tar cf -usr/knox | gzip -c $zip/arkeia.tar.gz

    ```


    You must back up the data dictionary because Arkeia does not back up the data
    dictionary. This is one of my complaints about Arkeia, and I solve it on my own
    computer by saving the data dictionary to tape with The TOLIS Group''s BRU.


    The data dictionary will be restored in the script restore.metadata automatically.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 9. Some Advice for Disaster Recovery


    You should take your ZIP® disk for each computer and the printouts you made, and
    place them in a secure location in your shop. You should store copies of these
    in your off-site backup storage location. The major purpose of off-site backup
    storage is to enable disaster recovery, and restoring each host onto replacement
    hardware is a part of disaster recovery.


    You should also have several tomstrtbt floppies and possibly some ZIP® drives
    in your off-site storage as well. Also, have copies of the tomstrtbt distribution
    on several of your computers so that they back each other up.


    You should probably have copies of this HOWTO, with your site-specific annotations
    on it, with your backups and in your off-site backup storage.'
