- pgno: 3
  md: '# # 1. Introduction


    The normal bare metal restoration process is: install the operating system from
    the product disks. Install the backup software, so you can restore your data.
    Restore your data. Then you get to restore functionality by verifying your configuration
    files, permissions, etc.


    The process and scripts explained in this HOWTO save re-installing the operating
    system. The process explained here will restore only files that were backed up
    from the production computer. Your configuration will be intact when you restore
    the system, which should save you hours of verifying configurations and data.


