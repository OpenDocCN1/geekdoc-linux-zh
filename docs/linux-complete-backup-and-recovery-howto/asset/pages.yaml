    # 11.3. Backup Server Scripts


    The SSH scripts above have a possible security problem. If you run them on a firewall,
    the firewall has to access via SSH to the backup server. In that case, a clever
    cracker might also be able to crack the backup server. It would be more secure
    to backup and restore scripts on the backup server, and let the backup server
    have access to the firewall. That is what scripts are for: Rename them to .get
    and x and restore.x where x is the name of the target computer. Edit them (the
    variable $target''s initialization) to use the target computer''s host name, or
    rewrite them to use a command line argument.


    These scripts backup and restore the target completely, not just one backup and
    restore. Also, not that get.tester backs up the ZIP disk as in case you need to
    replace a faulty ZIP disk.


    I use these routines.


    # 11.3.1.get.tester


    ```

    #! /bin/sh

    # Back up another computer''s drive to this system. To make this work, we

    # need a convenient chunk of disk space on this computer. This version

    # uses ssh to do its transfer, and compresses using br2. This version

    # developed so that the system to be backed won''t be authenticated to

    # log onto the backup computer. This script is intended to be used on a

    # firewall. You don''t want the firewall to be authenticated to the backup

    # system in case the firewall is cracked.

    ```


