    # 59 Temple Place, Suite 330, Boston, MA 02111-1307 USA


    # You can also contact the Free Software Foundation at http://www.fsf.org/

    # http://w3.trib.com/~ccurley/.


    # For more information contact the author, Charles Curley, at

    # The host name of the computer to be backed up.

    target-tester


    echo Backing up $target

    echo Aging the ZIP disk backups.


    rm -r $target.oldzip


    mv $target.oldzip $target.oldzip


    sh $target "probeppa ; mount -r /mnt/zip"

    echo Copying the ZIP disk.


    # -r for recursive copy, -p to preserve times and permissions, -q

    # -quiet: no progress meter.

    scp -qpr $target:/mnt/zip

    echo Testing the results.

    find . -iname \*.gz" | xargs gunzip -t


    sh $target "eject $zip"


    echo Aging the archives


    rm $target.old.bz2

    mv $target.old.bz2 $target.old.bz2


    echo Backing up $target to the backup server.

    sh $target -cf - / --exclude /mnt --exclude /proc --exclude /var/spool/squid/

    bzip2 -9 | cat $target.old.bz2

    ```


