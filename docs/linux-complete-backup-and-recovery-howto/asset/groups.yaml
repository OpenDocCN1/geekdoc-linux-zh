    想象你的硬盘驱动器刚刚变成了一个非常昂贵的冰球拍。想象一下你的家里经历了一场火灾，你的电脑箱现在看起来就像萨尔瓦多·达利会画出来的作品。现在该怎么办？


    全恢复（Total restore），有时称为裸机恢复（bare metal recovery），是在灾难性故障后重建计算机的过程。为了进行全恢复，你必须拥有完整的备份，不仅是你的文件系统，还包括分区信息和其他数据。本
