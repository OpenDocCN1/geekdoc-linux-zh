    ## 8. Application Specific Notes


    I have listed below notes about backing up particular applications.


    ### 8.1. Squid


    Squid is a http proxy and Cache. As it keeps a lot of temporary data on the hard
    drive, there is no point in backing up that. Insert "--exclude /var/squid/squid"
    into the appropriate tar command in your second stage backup script. Then, get
    squid to rebuild its directory for you. Tack the tail end of the second stage
    restore script to initialize it. This is how I did it over ssh restore.tester:


    ```bash

    ssh $target ''mkdir /var/spool/squid ; chown squid:squid /var/spool/squid; /usr/sbin/squid
    -z;touch /var/spool/squid/.OPB_NOBACKUP''

    ```


    The last command creates a file of length 0 called OPB_NOBACKUP. This is for the
    benefit of Arkeia and tells Arkeia not to back up this directory.


    ### 8.2. Arkeia


    Arkeia is a backup and restore program that runs on a variety of platforms. You
    can use Arkeia as part of a bare metal restore scheme, but there are two caveats.


    The first is the most problematic, as absent any more elegant solution you have
    to hand select the directories to restore in the navigator at restoration time.
    The reason is that, apparently, Arkeia has no mechanism for restoring files already
    present on the disk, not analogous to tar -p option. If you simply allow a full
    restore, the restore will crash as Arkeia overwrites a library which is in use
    at restore time, e.g. lib/libc-2.1.so. Selection of directories to restore is
    best at doi, so I recommend it against.


    The second is that you have to back up the Arkeia data dictionary and/or programs.
    To do that, modify the save.metadata script by adding Arkeia to the list of directories
    to save:


    ```bash

    # Arkeia specific:

    tar cf - /usr/knox | gzip -c $zip/arkeia.tar.gz

    ```


    You must back up the data dictionary because Arkeia does not back up the data
    dictionary. This is one of my complaints about Arkeia, and I solve it on my own
    computer by saving the data dictionary to tape with The TOLIS Group''s BRU.


    The data dictionary will be restored in the script restore.metadata automatically.


    ## 9. Some Advice for Disaster Recovery


    You should take your ZIP® disk for each computer and the printouts you made, and
    place them in a secure location in your shop. You should store copies of these
    in your off-site backup storage location. The major purpose of off-site backup
    storage is to enable disaster recovery, and restoring each host onto replacement
    hardware is a part of disaster recovery.


    You should also have several tomstrtbt floppies and possibly some ZIP® drives
    in your off-site storage as well. Also, have copies of the tomstrtbt distribution
    on several of your computers so that they back each up. You should probably have
    copies of this HOWTO, with site-specific annotations on it, with your backups
    and your off-site storage.


    ## 10. What Now?


    This HOWTO results from experiments on one computer. No doubt you will find some
    directories or files you need to back up in your first stage. I have not dealt
    with saving and restoring on the first stage, nor have I touched all than Intel.
    I would appreciate your feedback as you test and improve these scripts on your
    own computers. I also encourage vendors of software to document how to do a minimal
    backup of their products.


    ### 10.1. To Do


    Volunteers are welcome. Check with me before you start on one of these in case
    someone else is working on it already. Adjust partition boundaries for a different
    hard drive, or the same one with different geometry, or to adjust partition sizes
    within the same hard drive. A GUI would be a good idea here. On the other, the
    FSF''s parted looks like it will fill part of the bill. It does resize existing
    partitions, but with restrictions. make.fdisk currently splits out one script.
    Separate the mount to another script, so you can run make.dev then reboot to do
    something else, like build a partition for exotic OS I never heard of, or parted,
    then reboot to mount all the Linux partitions, and continue. Since supports bzip2,
    convert the scripts to bzip2, and see if there is a noticeable reduction in the
    first stage saved. make.fdisk only recognizes FAT partitions, not all. Add code
    to make.fdisk to recognize others and rebuild them in the output files. For FAT12
    or FAT16 partitions we do not, write zeros into the partition that gets confused.
    See the notes on fdisk for an explanation of the problem. Make a script to partition
    ext2 file systems on ZIP disks. Translations into other (human) languages. Find
    out how linux or similar programs affect this process. Changes for GRUB- Change
    the scripts to use a CD-ROM. A CD-ROM would boot to the first stage restore data
    on the rest of it, which would be the ticket.


    ## The Scripts


    See the notes in the beginning of each script for what it does.


    ## 11. First Stage


    ### 11.1. make_fdisk


    This script, run at backup time, creates a script similar to make.dev, for you
    to run at restore time. It also produces data files similar to dev.dx. The name
    of the script and data produced depends on the device given this script as a parameter.
    That script, run at restore time, builds the partitions on the hard drive. make.fdisk
    is created from save.metadata.


    ```perl

    #! /usr/bin/perl

    # A script to create a script and input file for fdisk to

    # re-create the partitions on the hard disk, and format the

    # Linux and swap partitions. The first parameter is the fully qualified

    # path of the device of the hard disk, e.g /dev/hda. The two

    # resulting files are the script make.dev.x and the data file dev.x

    # where x is the hard drive described, e.g. hda, sdc). make.dev.x is

    # run at restore time to rebuild hard drive x, prior to running

    # restore.metadata is the input file for fdisk.


    # Time-stamp:<2001-12-13 15:41:22 make.fdisk

