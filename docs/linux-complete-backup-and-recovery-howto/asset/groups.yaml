    # 你也可以通过 http://www.fsf.org/ 联系自由软件基金会

    # http://w3.trib.com/~ccurley/.


    # 如需更多信息请联系作者 Charles Curley，地址为

    # 备份计算机的主机名。

    target-tester


    echo 正在备份 $target

    echo 正在处理 ZIP 磁盘备份。


    rm -r $target.oldzip


    mv $target.oldzip $target.oldzip


    sh $target "probeppa ; mount -r /mnt/zip"

    echo 正在复制 ZIP 磁盘。


    # -r 用于递归复制，-p 用于保留时间和权限，-q

    # -quiet：静显示进度。

    scp -qpr $target:/mnt/zip

    echo 正在测试结果。

    find . -iname \*.gz" | xargs gunzip -t


    sh $target "eject $zip"


    echo 正在处理归档


    rm $target.old.bz2

    mv $target.old.bz2 $target.old.bz2


    echo 正在将 $target 备份到备份服务器。

    sh $target -cf - / --exclude /mnt --exclude /proc --exclude /var/spool/squid/

    bzip2 -9 | cat $target.old.bz2

    ```


