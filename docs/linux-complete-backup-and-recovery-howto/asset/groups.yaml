    ## 2. Overview


    The process shown below is not easy, and can be hazardous to your data. Practice
    it before you need it! Do I did, and practice on a sacrificial computer!


    The target computer for this HOWTO is a Pentium computer with a Red Hat 7.1 Linux
    server or workstation installation on one IDE hard drive. The target computer
    does not have amounts of data because the computer was set up as a "sacrificial"
    test bed. I did not want to test this process with a production computer and production
    data. Also, I did a fresh install before I started the testing so I could always
    re-install if I needed to revert to a known configuration.


    ![](img/b7e9f987ef9af3f87243de7cf4b11b84_5_0.png)


    ### NOTE


    The sample commands will show, in most cases, what I had to type to recover the
    target system. You may have to use similar commands, but with different parameters.
    It is up to you to be sure you duplicate your system, not the test computer''s
    setup.


    The basic procedure is set out in W. Curtis Preston, Unix Backup & Recovery, O''Reilly
    & Associates, 1999, which I have favorably reviewed in Linux Journal. However,
    the book is a bit thin on specific, real-time questions. For example, exactly
    which files do you back up? What metadata do you need to preserve, and how?


    Before beginning the process set fact in this HOWTO you need to back up your system
    with a typical backup tool as Amanda, BRU, tar, Arkeia or cpio. The question,
    then, how to get from toasted hardware to the point where you run the restoration
    will restore your data.


    Users of Red Hat Package Manager (RPM) based Linux distributions should also save
    RPM metadata of their normal backups. Something like:


    ```bash

    bash# rpm -Va /etc/rpmVa.txt

    ```


    in your backup script will give you a base for comparison after a bare metal restoration.


    To get this, you need:


    - Your hardware and running again, with replacement components as needed. The
    BIOS should be properly configured, including time date, and hard drive parameters.
    At the moment, there is no provision for a different hard drive.

    - A parallel port Iomega-ZIP drive or equivalent. You will need at least 30 MB
    of space.

    - Your backup media.

    - A minimal Linux that will allow you to run the restoration software.


    To get there, you need at least two stages of backup, and possibly three. Exactly
    what you back up and in which stage is determined by your restoration process.
    For example, if you are restoring a server, you may not networking during the
    restoration process. So only back up networking in your regular backups.


    You will restore in stages. In stage one, we build partitions, file systems, and
    restore a minimal file system from the ZIP® disk. The goal of stage one is to
    be able to boot a running computer with a network connection, tape drives, restoration
    software, or whatever we need for stage two.


    The second stage, if it is necessary, consists of restoring backup software and
    any relevant databases. For example, suppose you use Arkeia you are building a
    bare recovery ZIP® disk for your backup. Arkia keeps a huge database on the server''s
    hard drives. You can recover the database from the tapes, if you want. Instead,
    not tar and gzip the whole akeia directory (/usr/kn), and to save that to another
    computer over nfs or ssh? Stage one, which we have defined below, does not include
    X, so you will have some experimenting to do if you wish to boot up X as your
    backup program. Some restore require X.


    Of course, if you are using some backup program, you may have some work to do.
    You will have to find the directories and files it needs to run. If you use tar,
    gzip, cpio, mt or dd for your backup and recovery tools, they will be saved and
    restored from ZIP® disk as part of the process.


    The last stage is a total restoration from tape or other media. After you have
    done that stage, you should be able to boot to a fully restored and operational
    system.


    ### 2.1. Limitations


    HOWTO is restricted to making a minimal backup such that even with that narrow
    brief, is not exhaustive. You still have some research, editing, and testing to
    do. The scripts here restore the partition data exactly as found on source hard
    drive. This is nice if restoring on identical computer or identical drive, but
    is not the case. For now, there are two remedies (which will make more sense after
    you''ve read the rest of the HOWTO):


    - Edit the partition table. I''ve done a few times. You can also add new partitions
    or deleting ones (but edit the script that uses the partition table as well).

    - Build a new partition table and go from there. That is one reason restore_metadata
    does not call the hard drive. Another being that I don''t know what hard drives
    you have. Make sure to remove the call to fdisk from rebuilding script.


    The scripts shown here only handle ext2fs, FAT12 and FAT16. Until some volunteer
    supplies code for doing in these scripts, you will need other tools for backing
    up and restoring file systems not covered. Partition looks like a useful candidate
    here.


    > WARNING Do normal backups on their regular schedule. This HOWTO is useless if
    you don''t do that.


    Build yourself a rescue disk. It is well documented and packs a lot of useful
    tools onto one disk. There is an active list for it, and the few questions I had
    were quickly and accurately answered. I may depend on one day.


    Next, figure out how to do the operating system backup. I followed Preston''s
    advice and used an Iomega parallel port ZIP drive. The drives get approximately
    90 MB of useful storage. I need about 85 MB to back up my desktop, so 100MB ZIP
    drive may be pushing your luck.


    ### 3.1. Installing the ZIP Drive


    Installing the ZIP® drive is covered in the ZIP Drive HOWTO, available at the
    Linux Documentation Project and at its home page, http://www.njtom.com/dansie/zip-drive.html.


    ![](img/b7e9f987ef9af3f87243de7cf4b11b84_7_0.png)


    ## 4. Creating the Stage 1 Backup


    Having made production backups, you need to preserve your partition information
    so that you can rebuild your partitions.


    The script make.fdisk scans a hard drive for partition information and saves it
    in two files. One is an executable script, called make.dev.x. The other, dev.x
    (where "x" is the name of the device file, e.g. hda), contains the commands for
    fdisk. You specify which hard drive you want to build scripts for (and thus the
    file names) by naming the associated device file as the argument make.fdisk. For
    example, a typical IDE system,


    ```bash

    bash# make.fdisk /dev/hda

    ```


    spits out the script make.dev.hda and the input file for fdisk, dev.hda.


    In addition, make.fdisk encounters a FAT partition over FAT32, it preserves the
    partition''s boot sector in a file named dev.xy, where x is the device name (e.g.
    sdc) and y is the partition number. The boot sector is the first sector, 512,
    of the partition. This sector is restored at the same time the partitions are
    rebuilt, in the script make.dev.hda.


    Fortunately, the price of hard drives is plummeting as fast as the public''s trust
    in politicians after an election. So it is good that the output files are text,
    and allow easy editing. Now, that''s the only way to rebuild on a larger partition
    (See the To Do List http://example.com/to-do-list).


    Other metadata are preserved in the script save.metadata. The script saves the
    partition information in the file fdisk.hda in the root of the ZIP disk. It is
    a good idea to print this file and your /etc/fstab so that you have a hard copy
    which you ever have to restore the partition data manually. You can save it by
    toggling between two consoles, running fdisk in one and catting /etc/fstab or
    fdisk.hda as needed. However, doing so is error prone.


    You will also need to preserve files for your restoration method. For example,
    if you use nfs to save your data, you will need to preserve hosts,devs, etc. Also,
    if you are using any network-backed restoration process, such as Amanda or Quick
    Restore, you will need to preserve networking files like HOSTNAME, hosts, and
    the relevant software tree.


    The simplest to handle and similar questions is to preserve the entire etc directory.


    There is no way like a 100 MB ZIP drive is going to hold a server installation
    of a modern distribution of Linux. We have to be more selective than simply preserving
    the whole kazoo. What files do we need?


    - The boot directory.

    - The /etc directory and subdirectories.

    - Directories needed at boot time.

    - Device files in /dev.


    To determine the directories needed at boot, we look at the boot initialization
    file /etc/rc.sysinit. It sets its one path like so:


    ```

    PATH/bin:/sbin:/usr/bin:/usr/sbin

    export PATH

    ```

