    # ## 11. First Stage


    # ### 11.1.1. make_fdisk


    This script, run at backup time, creates a script similar to make.dev.hda, below,
    for you to run at restore time. It also produces data files similar to dev.hda,
    below. The name of the script and data produced depends on the device given this
