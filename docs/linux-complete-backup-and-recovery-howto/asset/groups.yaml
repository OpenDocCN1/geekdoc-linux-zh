    ## 8. 应用程序特定说明


    我在下方列出了关于备份特定应用程序的注意事项。


    ### 8.1. Squid


    Squid 是一个 http 代理和缓存服务器。由于它在硬盘上保留了大量临时数据，备份这些数据没有意义。请在你的第二阶段备份脚本中相应的 `tar` 命令中插入
    `--exclude /var/squid/squid`。然后，让 squid 为你重建目录。在第二阶段恢复脚本的末尾添加命令以进行初始化。这是我通过 ssh
    恢复到 restore.tester 的做法：


    ```bash

    ssh $target ''mkdir /var/spool/squid ; chown squid:squid /var/spool/squid; /usr/sbin/squid
    -z;touch /var/spool/squid/.OPB_NOBACKUP''

    ```


    最后一个命令创建了一个长度为 0 的文件 `OPB_NOBACKUP`。这是为了 Arkeia 的考虑，告诉 Arkeia 不要备份此目录。


    ### 8.2. Arkeia


    Arkeia 是一个运行在多种平台上的备份恢复程序。你可以将 Arkeia 作为裸机恢复方案的一部分，但有两个注意事项。


    第一个是最问题的，因为在没有更优雅解决方案的情况下，你必须在恢复时在导航器中手动选择要恢复的目录。原因是显然，Arkeia 没有任何恢复磁盘上已存在文件的机制（不类似于
    `tar -p` 选项）。如果你直接允许全量恢复，恢复将崩溃，因为 Arkeia 会覆盖在恢复时正在使用的库，例如 `lib/libc-2.1.so`。在执行时选择要恢复的目录是最好的，因此我不建议这样做。


    第二个是你必须备份 Arkeia 的数据字典和/或程序。要做到这一点，请修改 `save.metadata` 脚本，将 Arkeia 添加到保存的目录列表中：


    ```bash

    # Arkeia specific:

    tar cf - /usr/knox | gzip -c $zip/arkeia.tar.gz

    ```


    你必须备份数据字典，因为 Arkeia 不会备份数据字典。这是我对 Arkeia 的不满之一，我通过使用 The TOLIS Group 的 BRU 将数据字典保存到磁带来解决这个问题。


    数据字典将在 `restore.metadata` 脚本中自动恢复。


    ## 9. 关于灾难恢复的一些建议


    你应该为每台计算机准备一个 ZIP® 磁盘和打印件，并将它们存放在安全位置。离地备份的主要目的是实现灾难恢复，将恢复到替换硬件是灾难恢复的一部分。你应该在离地备份存储处保留此指南的副本，以及一些软盘和可能的
    ZIP® 驱动。


    ## 10. 现在做什么？


    毫无疑问，你会在第一阶段发现一些需要备份的目录或文件。我没有处理第一阶段的保存和恢复，我非常感谢软件供应商提供反馈。


    ### 10.1. 需要做的工作


    在开始之前，请检查这些脚本。调整不同硬盘的分区边界，或者在相同的几何结构下调整分区大小。使用 GUI 这里将是一个好主意。


