    Failure is an orphan, and Linux has many, many parents, which may be one testimony
    to its success and the explanation for its rich genetic history as well.


    Unix is not any one particular operating system, but rather a family of operating
    systems based on common ideas and tools, but with substantial variation from one
    system to another. This resulted in a rich set of features and a fertile environment
    for invention and development of new ideas. It also made porting software about
    as fun as taking a bucket of peanuts away from a herd of drunk elephants.


    # The Importance of Porting


    Successful software inevitably invites porting; that is, taking the software from
    one machine and getting it to run on another. Take, for example, software from
    a research lab at a university. The program was developed over the years by grad
    students working 80 hours a week and sleeping in front of their computers at night.
    Perhaps the program predicts what will happen in electric circuits, or the flow
    of air around the wing of a supersonic jet that''s being designed, or the flow
    of currents in the deep ocean. Whatever it does, it starts with some input data,
    processes it, and provides some new information to the scientist—something never
    known before, perhaps. This is such a powerful tool that there is no field of
    scientific endeavor that does not make extensive use of computer models.


    The computer program is just a complex set of instructions. It is the formal expression
    of some subset of the domain knowledge of the programmers, married to the computational
    speed of the computer and all the other software on it. It is like a little piece
    of brains that can actually make useful predictions of this big mess we call reality.
    Even after the original programmers are long gone, this little part of their brain
    will continue to think on whatever machine on which they run.


    Pretty amazing when you think of it that way, isn''t it?


    # Out With the Old, In With the New


    When the lab gets money to buy a new computer system, naturally they want to take
    this important piece of software with them. But there''s a problem: The new computer
    is not the same as the old computer (and if it was, they wouldn''t buy it anyway).
    New computers will be faster and more powerful than their predecessors, but they
    also might be from a different manufacturer, like IBM instead of HP, and run a
    different flavor of Unix.


    What happens to the program? Generally the files are copied and recompiled, and
    frequently everything just works. It does so because of a standard called POSIX.


    # Beam Me Up, Scotty


    POSIX is a bit like the universal translator in Star Trek. As Kirk explained,
    there are certain universal ideas and concepts that are found in all alien languages.
    With that little gadget Kirk, Spock and McCoy could talk to almost any alien,
    and with POSIX software can be written to run on almost every computer. POSIX,
    in fact, is that set of universal ideas and concepts that can be found on any
    operating system.


    # The Two Halves of POSIX


    There are two pieces of POSIX: the API and the tools.


    The API is an application programming interface, or really, a set of interfaces,
    to various services offered by the operating system. What this means in practice
    is that the builders of the computer system provide software on the system to
    translate what POSIX says and what the computer understands.


    For example, the C function to open a file, `fopen`, looks the same to the programmer,
    no matter what kind of computer is involved. This is quite an achievement (though
    so commonplace we don''t even notice it). Different computer systems can have
    radically different ways of storing data, yet the same `fopen` call will work
    everywhere. Every builder of computer operating systems takes the time to write
    the `fopen` function (and hundreds more like it) into their operating system.
    In the latest POSIX standard, there are more than 1,700 functions.


    The POSIX tools are even more interesting. Rather than just the fragments of software
    offered by the system libraries, the tools are stand-alone applications that can
    be run from the command line. They are so useful that they are standardized by
    POSIX so that programmers can use them and be confident they will still work the
    same way when ported.


    Some tools are provided as part of the various shells available. For example,
    the `cp` and `mv` commands, to copy and move files, are part of the command-line
    program, and are also specified by POSIX so that they will work the same from
    one system to another. Other tools are stand-alone programs, even programming
    languages like the `awk` tool, one of the many text-processing programming languages
    available with POSIX systems. With these tools you can write programs that will
    work the same way no matter what system they run on.


    # Getting POSIXed


    Unless you are using a Windows machine, your machine is already POSIX or POSIX-like.
    Even Windows users need not despair; there are several ways to get POSIX tools
    to run under Windows, including Cygwin ([http://www.cygwin.com]), MinGW ([http://www.mingw.org])
    and even one with some sort of upgrade package from Microsoft, though I have never
    used it. (As if I would trust any part of a critical application to the tender
    mercies of Bill Gates!)


    POSIX can be experienced as a programmer or as a user of tools, and I enjoy using
    both. POSIX is another way in which software can spread from machine to machine.
    It''s of critical importance to the world of free software that the software be
    as platform-independent as possible, to make it easy to use new advances in computer
    hardware and operating systems.


    POSIX makes it possible to write software today that will work on the world''s
    fastest computer in 2018 (which will certainly provide a POSIX layer). Writing
    POSIX-based software ensures that your work can live on long after your computer
    is gone and, if you''re a good enough programmer, even after you are gone.


    # Make It Happen


    In 1977 a fellow named Stuart Feldman at Bell Labs released a new computer program,
    destined for greatness. The name of his program tells you all you need to know
    about what it is for: He called it "make".


    # Putting Together Software


    Early computers, like the kind available in the ''60s and ''70s, had very severe
    hardware limitations. There was so little available memory to work with—every
    kilobyte, nay, every byte, was carefully used. Programming was the task of managing
    functionality in such small units that they could fit into the hardware. Forget
    about things like word processing and spreadsheets. Think instead of giant, primitive
    calculators.


    But by the late ''70s, computers had changed. The release of the first microcomputers
    in the late ''70s marked the beginning of a new hardware era—an era of plenty.
    The decade had seen the development of processors from primitive 4-bit designs,
    suitable for calculators, to the legendary Motorola 68000, a 32-bit chip later
    used in the first Apple Macintosh. Computers stopped being specialized calculators
    and became generalized information processors.


    With the profound changes in hardware, changes in software development permitted
    a new generation of programmers to stop worrying about the hardware. With the
    new, very large-scale integration techniques for chip manufacturers, programmers
    didn''t have to care about every byte and every clock cycle. They started to really
    stretch themselves and the new machines, and this led to more complex software.
    The software included such groundbreaking inventions as the spreadsheet, the word
    processor and the database.

