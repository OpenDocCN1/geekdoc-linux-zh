    pronounced like the first syllable in "technology."


    TeX Today


    TeX lives on, and has got to be one of the most stable and bug-free software tools
    in widespread use today. Knuth no longer changes TeX, except to fix any reported
    bugs. These are few, however, because of Knuth''s programming skill, and because
    he has long offered a reward of $2.56 for each verified bug.


    Other than bug fixes, TeX is frozen. No new features will be added.


    However, that doesn''t mean TeX development is at an end. It is freeware, and
    Knuth encourages the development of other variants and versions of the core technology.
    One prominent example of this is LaTeX, a layer of software that sits atop TeX
    and makes producing mathematical, engineering and scientific documents easier.


    He asks only that, whatever you do, you don''t call it "TeX." As with his seminal
    series of computer science texts, TeX will always be associated with him alone.


    TeX to Texinfo


    The TeX engine is used by the Free Software Foundation—influential developers,
    maintainers, and distributors of the most important tools in Linux: the compilers
    and system tools that put the UNIX in Linux.


    Texinfo (texinfo.org) is a program that offers a simple way of encoding typesetting
    information in a text file. It allows you to produce a document in a variety of
    formats from the same text source, so that you can write one manual and have it
    available as a Web page, PDF file, plain text file, and PostScript file, as well
    as the info file used by GNU Emacs.


    Since it''s the official typesetter of the GNU project, it is well supported on
    all Linux systems, and it is used for all GNU documentation. A quick Web search
    for your favorite GNU tool will show the output of the texinfo system, and if
    you download a printable copy you can see the typesetting done by TeX.


    The Triumph of TeX


    Knuth wrote TeX because of his own personal frustrations dealing with typesetters
