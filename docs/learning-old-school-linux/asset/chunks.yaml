    for the string "somestring." It will then search the output of that for the string
    "otherstring."


    To find the ten most popular words in a document, try:


    cat file.txt|tr -c ''a-zA-Z'' ''\n'' <file|grep.|sort|uniq -c|sort -nr|head -10


    Or, to count the number of occurences of words in text:


    cat.file.txt| tr"\n" ''''|sed''s/[^a-zA-Z]+//g''|tr''''"\n"|sort|uniq-c|sort|tac


    Once you develop a useful command, you can save it as a shell script. In this
    way you can develop your own set of useful UNIX command-line tools.


    The command line is alive and will in the world of UNIX computing; use pipes and
    redirection operators to get the most of it!


    # How to Become a Linux Guru: Command-Line Tricks


    Some of the new graphical tools for system administration are really terrific.
    They save me a lot of time when it comes to doing something that I''ve never done
    before. But when repeating a task over and over again, give me the command line
    every time. It''s not just that I can type a lot faster than I can move the mouse,
    it''s also that so much of Linux is hardwired into my brain that I don''t even
    have to stop and think about the command I want. It just flows.


    When working from the command line, there are some tricks I frequently use that
    speed things up—though they add a little syntactic confusion.


    To be a true Linux guru, take the time to learn a few simple command-line rules
    before giving up on the terse but powerful syntax of the Unix shell.


    Variables and Shells


    The first thing to be aware of is that a plethora of different shells are available.
    Each shell is slightly different, so it''s hard to write about all of them at
    once. For the purposes of this article, I will discuss the popular bash shell.


    Within your shell environment, the variables that are set change the way things
    work. Print a shell variable with the echo command. For example, to see your path,
    type:


    echo $PATH


    It''s useful to have your EDITOR variable set to the name of your favorite text
    editor. I do this in my ~/.bashrc file (cshrc users should try ~/.cshrc). This
    is a file that is run every time I start the shell.


    One trick is that there are two families of shells, and they have different (and
    incompatible) ways to set a variable. In my bash profile script, I can put:


    export EDITOR=emacsclient


    If I were a csh user (or a user of any of the csh family of shells), I would instead
    have something like this:


    setenv EDITOR emacsclient


