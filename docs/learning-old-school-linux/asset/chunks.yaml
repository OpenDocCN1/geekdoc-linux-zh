    失败是一个孤儿，而 Linux 拥有许多、许多个父母，这或许既是其成功的证明，也可以看作对其丰富的遗传历史的解释。


    Unix 并不是某一个特定的操作系统，而是一系列基于共同理念和工具的操作系统家族，但不同系统之间存在显著的差异。这产生了丰富的功能集，并为新想法的发明和开发提供了肥沃的环境。它也让软件移植变得像从一群醉酒的大象群带走一桶花生一样，具有挑战性。


    # 移植的重要性


    成功的软件不可避免地会引发移植；即将软件从一台机器移，并让它在另一台机器上运行。以来自大学研究实验室的软件为例。该程序是由研究生们在多年里开发的，他们每周工作
    80 小时，晚上睡在电脑前。也许该程序预测的是电路中发生的情况，或者是正在设计的超音速喷气机翼周围的空气流，亦深海中的洋流。无论它做什么，都始于某些输入数据，对其进行处理，并为科学家提供一些新信息——可能是前所未有的信息。这种工具如此强大，以至于没有任何科学研究领域不广泛使用计算机模型。


    计算机程序仅仅是复杂的指令。它是程序员领域知识某些子集的正式表达式，与计算机的计算速度以及其上所有其他软件相结合。它就像一小块“大脑”，实际上可以对我们称之为现实的这个巨大混乱的事物做出有用的预测。即使在原始程序员早已离开多年，他们大脑的这一小部分也将继续在它们运行的任何机器上思考。


    如果这样想，觉得很神奇，不是吗？


    # 令人惊叹


    当你这样想时，这很神奇，不是吗？


    # 故旧与与新


    当你购买新的计算机时，由于 POSIX 能够让旧软件在新的机器上运行，这并不总是令人遗憾的。但这仍然是同样的问题：无论你使用哪种软件，它们已经足够强大了。


    由于 POSIX 能够在任何系统上运行，这会发生什么？


    # 传送，斯波克！


    POSIX 就像《星际迷荒》（Star Trek）中的通用翻译器。正如柯克（Kirk）所解释的那样，由于斯波克（Spock）和麦科伊（McCoy）可以在任何机器上运行，由于
    POSIX 能够在任何系统上运行，这确实很神奇。


    # POSIX 的两个部分


    正如柯克所解释的那样，由于斯波克和麦科伊可以在任何机器上运行，由于 POSIX 能够在任何系统上运行，这确实很神奇。


    POSIX 有两个部分：API。


    API 是一个应用程序接口，它是计算机系统提供的各种服务的接口，这对于开发者非常重要。


    当你使用 Windows 系统时，由于 POSIX 能够让旧软件在新的机器上运行，这并不总是……


    由于 POSIX 能够在任何系统上运行，这并不总是令人遗憾的。


    由于 POSIX 能够让旧软件在新的机器上运行，这并不总是令人遗憾的。


