  trans: '

    在清理磁盘时，`find` 工具也非常好用。`find` 命令有非常许多不同的参数，读完它的帮助页（man page）可能会有点头大！指定你想要查找的文件以及找到它们后想对它们做什么操作，方法多得惊人。


    在过去，我们经常使用 `find` 在物理系计算机长时间闲置几天后自动删除大文件。在今天，这听起来是很很粗暴对待，但在那时，磁盘非常昂贵，而生命很廉价。


    如果只是简单使用 `find`，只需使用 `--size` 参数即可。然后使用类似 `+3M` 的参数来告诉它你想查找大于 `3MB` 的文件。（你也可以使用
    `"G"` 表示千字节，或使用 `"k"` 表示千字节。）


    ```bash

    ~ $ find --size +3M


    ./.mozilla/firefox/6wi42rce.default/urlclassifier2.sqlite

    ./My Documents/My Videos/eeepc.wmv

    ./My Documents/My Music/amarok-tmp-0.170-1204660416186385&lid7751-usa&from=pls.part

    ./My Documents/My Music/Day & Night.wma

    ./My Documents/My Ebooks/manual.CHM

    ```


    这显示了我五个最大的文件，其中四个看起来像是随 Eee 自带的程序，反正我可能根本不需要它们。


    ## 最终，更多空间才是答案


    这段小小的怀旧之旅（这里玩了个文字双关梗）让想起了监控磁盘空间是件多么痛苦的事！


    终极答案通常是在你发现自己正在扫描要删除的文件时，直接订购一些存储设备。虽然前几次你通常能腾出一些可用空间，但似乎最终你还是会用那些不想删除的文件填满空间。


    在我的情况下，我为我的 Eee 订了一张 `2GB` 的 Micro-SD 卡，这会给我提供额外的存储空间，我将拔掉特殊的 Eee 只读文件系统，通过失去恢复能力来换回磁盘空间。


    希望这至少能让我接下来的几个月里都不用去碰那些磁盘监控命令了！


    # 封堵 Linux 的漏洞


    机器人声音大叫着：“入侵者警报！入侵者警报！”，那是来自上个世纪末的《太空入侵者》街机游戏，那时候电脑还很简单，病毒只是某种让你打几天喷嚏的小东西。


    现在我们已经开发了像互联网和俄罗斯计算机犯罪之类的先进技术，情况在很多方面已经发生了变化，但入侵者警报的通知是我们比任何时候都需要的。


    ## 多大的安全才算足够？


    每个计算机用户都需要考虑一个安全问题：多大的安全才算足够？


    对于一个读邮件、看新闻并偶尔写写《ComputerEdge》文章的家庭用户来说，不需要太高的安全性。


    在光谱的另一端，许多系统对安全有极高的需求，例如某些用于开发军事技术的计算机。在这些系统中，安全性处于至关重要的程度。


    在这两个极端之间是商业企业、大学和从事非机密项目的研究实验室。这些机构每个都有不同的安全需求。


    用户必须在这一光谱上找到自己的位置，以决定应该投入多少时间、金钱和精力来他们的系统。


    ## 比 Windows 更安全


    Linux 以比比尔·盖茨（这位世界上最富有的极客）所售的操作系统更安全而闻名遐迩。尽管你可能认为保持代码保密会更安全，但事实证明这是错误的做法。


    系统不安全从定义上说就是操作系统中的漏洞。漏洞最少的操作系统（`Linux`）通常比漏洞最多的操作系统（`Windows`）更安全。


    `Linux` 代码对所有用户可见这一事实，是一种强大的代码审查机制。无数只眼睛盯着每一行代码、每个 `function`、每个模块来寻找错误。相比之下，商业操作系统的程序员团队要小得多——只有数百人，而不是几十万人。


    此外，那些“微农奴”（Micro-serfs）都有很多事情要做，而公司则有切身利益去修复尽可能少的漏洞——并尽可能对缺陷保密。


    在所有这些不利因素的共同作用下，`Windows` 跟不上也完全不奇怪！


    ## 如何实践安全计算


    一旦你对自己的安全需求做出了决定，就是时候投入时间和精力来加固你的系统了。这涉及到仔细阅读你的 `Linux` 发行版附带的文档，并遵循那里找到的所有良好的安全建议。


    安全计算最重要的方面是保持你的操作系统软件更新到最新版本。当发现安全漏洞时，软件会被修复，但除非你用修复程序更新你的系统，否则对你没有任何益处！


    保护系统的下一步是关闭所有不需要的系统服务。诸如 `telnet`、`FTP`、`sendmail` 以及其他旧时代的 UNIX 基础服务为黑客提供了机会。如果你不需要这些服务，关闭它们是挫败想要使用它们的黑客最简单的方法。


    设置安全只是开始。必须密切监控系统，以确保没有黑客绕过你设置的所有安全措施。


    ## 如何判断系统是否被破解


    不幸的是，有时很难判断电脑是否被破解。有一些明显的迹象，例如 `log files` 中的可疑条目，或者磁盘空间和互联网活动的突然增加，这些可能是提示。


    但这些都是坏黑客的明显痕迹；更有经验的黑客不会留下这些细节。如果安全是一个非常重要的问题，就需要经验系统管理员进行定期安全审计。


    关注最新的安全新闻似乎本身就是一份全职工作，而这只是一个积极的系统管理员价值连城的领域之一。


    ### 如何学习更多


    很好的起点是 Linux 安全网站（`www.linuxsecurity.com`）上的常见问题（`FAQ`）列表。另一个基础信息来源是 Linux 管理员安全指南（`www.seifried.org/lasg`）。


    掌握最新威胁的好去处是 `CERT` 网站（`www.cert.org`），这是卡内基·梅隆大学的一所联邦资助实验室，致力于发现和消除计算机安全威胁。


    保持安全！


    尽管 `Linux` 用户在安全领域比 `Windows` 用户具有内置优势，但没有理由掉之自喜。这是一个危险的世界。在外要小心。


    # Wi-Fi 和 Linux


    我不愿意承认，管理无线网络方面 `Windows` 和 `Mac OS` 有时比 `Linux` 稍微好一点。


    并不是 `Linux` 不具备 `Windows` 或 `Mac OS` 的任何网络能力，只是稍微困难一点，做什么不太直观。图形用户界面并不总是像 `Windows`
    的那样直观（不过——记住 `Linux` 不断改进。）


    ## 图形用户界面


    现在的 Linux 发行版都有某种处理网络配置的图形用户界面。我使用的 Asus Eee 系统使用了 `Xandros` 发行的特殊版本，有一个名为 `Network
    Connections` 的工具。它提供了一个非常漂亮的 GUI，显示我配置的无线网络，并允许我编辑每个网络的细节。

