  raw: 'These days, fancy editing environments are all the rage, and editors for Web
    developers are a prime example of the proliferation of the so-called Integrated
    Development Environment. This is an attempt to make programming as easy as balancing
    your checkbook, writing a letter, or turning on the door locks in a dinosaur theme
    park.


    Programming, however, is a bit more complicated than that, and Web programming
    is perhaps the most complicated type of programming. It involves dozens of different
    software packages, all working together to take text and graphics files, prepared
    by the Web programmer, and convert them to what the users see in their Web browser.
    And although the Web is a very graphical environment, a surprising amount of Web
    programming has nothing to do with graphics—it''s just text processing.


    A Web page, for example, is really nothing but a simple text file, until it is
    served up in a browser. The browser understands the file and the computer user
    enough to make some decisions about what the resulting Web pages will look like.


    Back to the Basics


    When it comes to processing text files, there''s no school like the old school.
    Text processing is something that any programmer from 1980s onward can tell you
    all about.


    In olden times, programmers used various different tools to perform the tasks
    that make up programming. These tools are all embodied in the general UNIX principle:
    Do one thing, and do it well. Lots of programmers still abide by this.


    Learning Curves and How to Flatten Them


    Learning how to use all these tools is a significant burden on the new programmer,
    as well as a fertile field of mistakes and bugs. Thus, the idea of a graphical
    users interface that hides all the tools beneath windows, wizards, and nicely
    written help files.


    It''s just a pretty face on the same old tools, but it allows new programmers
    to get up to speed very quickly, and to use the tools in an intuitive way. Experienced
    programmers will also claim that the integration of all the tools into one application
    allows them to work faster and to accomplish tasks more easily.


    The idea is to have one application that can handle all the needs of a typical
    Web programmer, just as Microsoft attempts to handle all document-preparation
    needs with its Word application, and all the financial needs of users with Microsoft
    Money (and what does Bill Gates know about, if not money?)


    This explains why such programs have little appeal to old-timers such as myself.
    We have already climbed that learning curve. And no matter how pretty the face
    of the latest graphical tool, I wouldn''t trade it for the integrated development
    environment that I use.


    What Do People Who Are NOT Cranky Old Geeks Use?


    In the world of Web programming, the Dreamweaver application is the industry-standard
    Web-development tool.


    It presents the user with a very typical Microsoft Windows interface, from which
    the entire range of Web development tasks can be undertaken. Files can easily
    be uploaded and downloaded from the remote hosting site; and the text in the files
    can be edited in a nice HTML editor, which changes the color of the text in accordance
    with its HTML meaning. (For example, commented-out HTML is all one color, while
    tags are a different color from the rest of the file, etc.)


    There''s really no doubt that, for the average computer programmer in these modern
    times of graphical user interfaces, a program like Dreamweaver is the best way
    to do Web programming and HTML editing.


    But it''s not what I use.


    Emacs: The Programmer''s Secret Weapon


    Back in the mists of time, back when the Watergate scandal was still in the news,
    and only a few months after President Nixon resigned from office, Richard Stallman,
    a crazy lunatic or a brilliant programming genius, or perhaps both, began work
    on a new editor called Emacs—which would, in fact, become the first truly integrated
    development environment.


    The Emacs editor (www.gnu.org/software/emacs), which is still actively developed
    by Stallman, continues to lead the way in features for programmers, while remaining
    completely backward-compatible.


    Emacs has long since acquired a graphical face for those who wish to use it. (Not
    me. If text was good enough for my grandfather, the first programmer in the family,
    then it is good enough for me!)


    The Emacs editor provides the usual features of a programming environment, such
    as Dreamweaver. But the great thing about Emacs is that it works the same for
    every type of programming. Whether I am doing Web sites or old-fashioned FORTRAN
    programming, Emacs provides all the tools needed.


    Emacs is smart enough to adjust itself to the work that you are doing.


    Perhaps best of all, Emacs is free software. I have the source code and can compile
    it any time I want. It runs on every computer system I have ever programmed on,
    from old VAX systems, to the latest Windows release.


    You can download it right now, if it''s not already on your system.


    And no one can make it backward-incompatible on you, not even Richard Stallman.
    No one corporation can hold all of your work in the palm of its sweaty, corporate
    hand.


    * * *


    I could have answered my niece''s question by saying I work in Emacs all day,
    but I don''t think she would have understood that either. You have to work with
    it to understand what a great tool it is.


    # Emacs: The Only Program You Need


    Remember Mr. Spock? He used to look into that primitive computer thing and pull
    out answers that saved Kirk''s butt again and again. It was always an amazing
    demonstration of computing prowess. It can finally be revealed what Spock was
    running on the Enterprise''s computers: emacs.


    This explains Spock''s facility with computers! It wasn''t that he was Vulcan,
    it was because he was an emacs user!


    What Is Emacs?


    Emacs is a text editor, but saying emacs is a text editor is like saying the Pacific
    Ocean is wet. It is more than an editor—it is a super-editor, an über-editor.
    It''s the one that all the other editors wish they could be, but know they never
    will be. It is the top-banana, the tip of the spear, the big enchilada. It is
    not just a text editor. It is the text editor.


    The primary audience for text editors is the computer programmer. Computer programs,
    though ephemeral, expensive and exasperating, are the core of all our coolest
    technology. And, when it comes right down to it, they are text files. Emacs is
    ultimately about software development. And it is the best software development
    environment, by far, ever to be developed.


    To say emacs has a loyal following is to dramatically understate the case. I''ve
    used emacs for the last 25 years, nearly every day. If you took it away and made
    me use another text editor instead, I would use it to write emacs from scratch,
    rather than go on without it. That''s the kind of user loyalty Microsoft would
    kill for. But they will never get it, because they can never produce any software
    a tenth as good.


    Where Did It Come From?


    Emacs was the beginning of the free software movement. It was the first application
    released by FSF (www.fsf.org) (Free Software Foundation), the first free software
    application that soared to a big, fat mind share.


    Back in the olden times, before X Window provided a desktop interface for Linux,
    emacs just used the technology of the day—ASCII terminals. However, with version
    20 of emacs, the X Window graphical user interface was fully supported by emacs.


    Getting Started


    To get started with emacs, type "emacs" at the command prompt. You will get an
    emacs window.


    The most important thing to know is how to use the so-called "meta" key. The meta
    key is like the Control key (or "Ctrl," as it is abbreviated on the keyboard).
    As with the Control key, you hold down the meta key while hitting another key.
    For example to hit Ctrl-x, (or C-x, as you will see it called in emacs documentation),
    you hold down the Control key, and hit the "x" key. To do meta-x (or M-x), you
    hold down the meta key, and then hit the "x" key.'
