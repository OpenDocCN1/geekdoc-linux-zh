    Perhaps then, inspired by a need to give something back, and sure that your unique
    collection of free software offers value, you will produce and give away your
    own distribution!


    # System Administration


    Once a user sets up a `Linux` system, he or she faces the tasks of system administration.
    Mundane chores mostly, but due to the highly-developed state of `Linux` tools
    there is a lot to learn. Many convenient features are available, but an orientation
    is required.


    ## Backing Up the Linux Way: Sticking to `tar`


    It''s one of the oldest pieces of computer lore, handed down from the stone age
    of electronic computing: Always back up your files!


    Sometimes the old ways are the best ways, and on my very first day of computing
    (all the way back in the last millennium), I heard a horror story that demonstrated
    the importance of backups.


    ### Back at the Dawn of Time


    I was starting work for a pair of atmospheric scientists who had something very
    rare: their own computer. It was a small computer (only about the size my wife''s
    minivan), and required a room with its own power system, air-conditioning plant,
    and one of those computer room floors made of sturdy tiles—any one of which could
    be lifted to access the maze of cables beneath the floor.


    It was about as powerful as my current laptop, only without the graphical user
    interface. For meteorologists, with their giant models of the atmosphere, it was
    what you might call a personal computer.


    On the front were mounted two magnetic tape drives, and one wall of the computer
    room held row after row of neatly labeled magnetic tapes. These tape drives aren''t
    even built anymore, but they used to decorate the front of every serious computer.


    Those computer tape drives looked pretty high tech in the ''60s, but they were
    a lot of work to use. The tape had to be threaded through the heads and onto the
    take-up reel. As the tape was written, it would be transferred back to the starting
    reel. Since they didn''t hold all that much data (by modern standards), it was
    common to have data sets spread across multiple tapes.


    ### Oh, the Horror!


    My first day in the lab, I saw one of the scientists loading and unloading tapes
    onto the machine. He was backing up the disks on tape, and he did it every day,
    though it took almost an hour, and he was always pressed for time.


    When I asked why he didn''t have one of the lab''s students perform this chore,
    he told me his tale of woe: A grad student, assigned to the task, had come in
    early every day to perform the backups. This grad student, seduced by his warm
    bed one winter morning, had skipped a day, with no untoward consequences, and
    without even attracting the notice of his late-sleeping co-workers, who assumed
    the backup had taken place as usual. The exception became the rule, and soon this
    lazy grad student had not performed a backup for three whole months—a fact that
    was discovered when the disk crashed, wiping out three months'' work for the whole
    lab.


    Now, this scientist was a bit of a forbidding character—not someone I would like
    to cross. And the steely glint in his eye made me fear for the fate of the poor
    grad student. He had forgotten the first rule of computing: Always back up your
    files.


    ## The Modern Era


    These days, disks are more reliable. I''ve never experienced mechanical failure
    with a modern disk drive, though it does happen, allegedly. The greatest risk
    to data today seems to be accidental deletion.


    Although disks are quite reliable, the same can''t always be said for the software
    engineer. Mistakes will happen, and when data is mistakenly deleted, a good backup
    discipline can save the day—and maybe your job.


    There are many different programs to help back up your data, but it''s hard to
    beat the ubiquity and simplicity of the old classic tape-archiving program `tar`.
    `tar` has been with us so long that the tape has vanished from the equation, and
    most home backup these days seems to be from one disk to another (or even onto
    one of those newfangled data sticks) rather than to magnetic tape. Yet, `tar`
    still gets the job done.


    ### tar Me Up, Scotty


    The simple idea behind `tar` is that you provide it with a directory full of files
    and subdirectories, and `tar` will package it all into one file, the "tarfile"
    (which usually has an extension `.tar`). The tarfile itself is in a very simple
    format—one that makes no attempt at compressing the data. For this reason, it
    is frequently run though a compression program, such as `gzip`, which produces
    a much smaller compressed tarfile, the "tarball."


    The tarball can be saved to anther disk, perhaps on another machine. This ensures
    that if the original data is deleted or destroyed, the files can be recovered
    by uncompressing the tarball and then running it through the `tar` program again,
    which will unpack the file into its original directories, with all the contents
    intact.


    There are many different versions of the `tar` program out there. `Linux` users
    have the `GNU tar`, one of the best. Not only does it meet all the `tar` standards,
    but it also includes command-line options to allow the compression to be done
    on the fly, without having to invoke the `gzip` utility separately.


    ### Wasting Time


    Although the scientist from my story always continued to run his own backups every
    day, I did manage to save him some time by showing him how to do incremental backups.


    Incremental backups address the problem of backing up an unchanged file. Since
    most files don''t change every day, there''s no real need to back them up every
    day. But how can the poor user easily determine which files need to be backed
    up without making the tragic error of missing an important file?


    With `GNU tar`, the problem is handled for you with the incremental backup feature.
    This means that you do a full backup at some reasonable interval, such as weekly,
    and then an incremental backup each day. The incremental backup will contain only
    files that have changed since the last full backup. To restore the files, you
    would first restore the full backup and then the incremental backup.


    # Who’s Got Your Back?


    We are putting more and more important data on our electronics, but are we taking
    more and more care that our data are safe?


    Back in the Olden Times


    One of my University computer jobs involved the backing up of the data on what
    was then called a mini-computer. These were between the toy-like micro-computers
    of the day, and the equally toy-like (but much more expensive) mainframe computers
    of the day.

