    ![](img/cover.jpg)


    ![封面](img/cover.jpg)


    # 前言


    对于为 ComputorEdge 杂志撰稿，我有许多美好的回忆。


    在 2003 年，以及随后的多年里，ComputorEdge 杂志可以在科罗拉多州的每个超市收银台旁或便利店免费获取。它是获取轻松幽的当地科技新闻、寻找当地电脑最廉价商店的好去处。


    我带着家人从国外回来后，首次开始为 ComputorEdge 写作。在那时，我在伦敦担任一名电信顾问。那份工作非常令人兴奋，涉及学习许多新技术，包括大量的
    `Visual C++` 工作。我发现伦敦极其有趣且精彩，但也贵得离谱。钱似乎以一种意想不到的速度从我的钱包里蒸发了，尽管我们的生活方式比科罗拉多州的美国生活要奢靡得多。


    当时，科技杂志行业正处于最后的繁荣期。互联网还是新鲜事物，`google` 也很年轻。我们还没有养成在网上查阅一切的习惯。IT 行业的专业人士依靠杂志来保持资讯更新并扩展技能。像
    `Byte` 和 `Dr Dobbs Journal` 这样的杂志非常有用且读者极广。科技市场的每个领域都有（而且现在仍然有）杂志。


    由于需要钱，我开始通过为各种杂志撰稿来补贴收入，先是在英国，后是在美国。在那个年代，一篇优秀的技术文章即使在二线杂志上也能轻松赚到 1000 美元以上。而且它们对内容的渴求是巨大的！


    与那些技术性更强的杂志相比，ComputorEdge 为我提供了几个吸引人的特点。它是一份周刊，文章更短、更轻松。沉重的技术内容并不是编辑想要的——他想要的是具有趣味性的写作，因为其读者并非都是计算机程序员，而是那些拥有其他职业、但仍然喜欢了解一点这些神奇机器的人们。


    在 ComputorEdge，我是少数介绍 `Linux` 世界的作家之一。在当时，`Linux` 还是电脑极客的领地。它刚刚进入主流电脑用户的词汇表。和
    ComputorEdge 的其他作家一起，我帮助解释了其内部到底发生了什么。`Linux` 是什么？它从哪里来？它将去向何方？这些都是我们为读者回答的问题。


    为 ComputorEdge 写作成了我最有趣的兼职工作。我有机会查阅各种历史上的奇闻异事，并学到了很多知识。我也借此尝试不同的写作风格，从纯粹的指令教学到幽默风格不等。


    这本 ComputorEdge 文章集为 `Linux` 世界的发展过程提供了一个易于阅读的介绍。我认为它们仍然具有相关性、趣味性和见性，我希望你也会这么认为。


    将这些材料汇编成电子书也提供了另一场技术学习冒险。生产手段真正地交到了人民手中——一个人独自工作，就能在几小时内产出一本书。这将为我们基于信息的文明带来什么？


    # 历史笔记


    本节文章主要涉及计算机科学的两个巨头：理查德·斯尔曼（Richard Stallman）和唐纳德·康纳（Donald Knuth）。这两个人仅凭自己的智慧，就从根本上改变了我们使用计算机系统的方式。以下文章怀着最高的敬意。


    ## 理查德·斯尔曼：创新天才还是戴锡箔帽的疯子？


    理查德·斯尔曼是当今最有影响力和产出率计算机程序员之一。他可能也是最古怪的一个。


    斯尔曼在编程领域的声名始于他编写了一个名为 `emacs` 的文本编辑器。`emacs` 文本编辑器不仅仅是一个编辑器。事实上，它是第一个（目前仍然是最好的）集成开发环境——对于在
    `UNIX` 世界使用的许多编程语言的程序员来说，它是完美的工具。


    `Emacs` 仍然是当今最流行的编程工具之一，单凭它就足以确保斯尔曼的声名。但他之后所做的事情注会对世界产生更深远的影响：理查德·斯尔曼创立了“自由软件运动”。


    斯尔曼因对术语的严谨奉守而闻名。他承认，他使用“自由软件（free software）”一词造成了很多困惑。自由软件并不意味着零成本软件；它意味着你拥有完全使用它的自由——修改、检查，并赠给你的同事和朋友。


    正如斯尔曼所说：自由就像言论自由的自由，而不是像免费啤酒的免费。


    如果你从 `Microsoft` 购买软件，你只能听从公司对软件功能的说明（如果他们真的告诉你的话）。


    当你使用自由软件时，你拥有源代码。自己去看看软件到底做了什么。如果你不喜欢，或者发现了错误，你可以直接修改软件。


    这些偏好自由软件的实用理由已经足够有说服力，让许多老脑的企业高管依赖（并贡献）许多自由软件包。


    但这些并不是激发理查德·斯尔曼的理由。他的动机更加理想化。


    ### 自由软件背后的理想主义


    斯尔曼的软件自由思想灵感更多源于“黄金法则”，而非对改进软件开发生活的任何尝试。正如 `GNU Project` 的最初公告中所解释的，斯尔曼表示他希望程序员能够合作工作为社会造福，而不是为了利润而相互竞争。


    斯尔曼从不反对人们营利工作——仅仅反对目前专有软件行业盈利的方式：通过限制用户完全使用软件的自由。


    斯尔曼的理想主义使他与学术界和工业界的软件开发方向决裂。他的 `GNU Project` 离常规范太远，以至于很少有人知道看待它。没有人能预见到斯尔曼的努力会产生什么样的影响。


    斯尔曼改变了软件开发的世界。


    大约 25 年后，自由软件运动已成为软件领域的一股主要力量。互联网使用的许多工具都是自由软件。


    `GNU` 工具还实现了一个新的操作系统 `Linux`（或斯尔曼所称的 `Linux/GNU`）。如果没有 `GNU`，`Linux kernel` 将是不可能的也是无用的，因为受了
    `GNU` 自由软件工具的启发并与之共同开发。而且，如果没有 `GNU` 工具来运行，`Linux kernel` 不仅仅是一个学术上的奇闻。`Linux
    kernel` 是让 `Linux` 运行的核心系统代码，但 `GNU` 工具才让拥有 `Linux` 系统变得有价值。


    ### 为什么自由软件真正有效


    斯尔曼的愿景尽管看起来完全疯狂，却彻底改变了软件工程。


    自由软件项目与其专有软件不同，通过一代代开发者不断改进。


    专有软件公司的努力必然会随着公司的终结或该产品线的结束而停止。无论有多少忠实的粉丝，无论有多少用户依赖某款软件，只要拥有它的公司决定放弃它，或者破产，那么该软件包就死了。没有人能维护它。没有人能扩展它。也没有人能将其移植到新的计算机系统。


    有了自由软件，优秀的软件变得不朽。


    结果是，实用的自由软件产品往往随着时间的推移而变得更好，许多软件软件包经历了几代开发者，每代人都在接替前代的工作，而无需从头开始或丢弃任何有用的工作。

    '
- fmt: 'With proprietary software, you are locked into one company and need to pay
    whatever that company asks, or else abandon the software. With free software,
    that blackmail can''t take place.


    Plenty of companies can still make money.


    IBM is one of the biggest contributors of free software to Linux, obviously not
    from idealistic motives. Free software allows the company to generate more profits.


    IBM''s free software success has demonstrated that free software is not anti-capitalist;
    it provides yet another way in which the free market provide solutions.


    ## The Ways of Genius


    It''s customary for geniuses to be eccentric, and Stallman is no exception. He
    has numerous quirks and causes, many of which can be found on his personal Web
    page (`www.stallman.org`).


    Other programmers report that Stallman is extremely difficult to work with. He
    has been called a "control-freak" who doesn''t play well with others.


    Although his reputation for eccentricity may be well-deserved, it does not detract
    from his accomplishments and contributions to the field of software engineering.
    As one of the most famous programmers alive today, he is entitled to his quirks.


    Is Stallman a genius or a nutcase? Perhaps both. But he has changed the world
    forever.


    ## Hang ''Em High With TeX


    In 1962, the Beatles released their first record, and a young computer scientist
    name Donald Knuth started the first in a series of books called `The Art of Computer
    Programming`.


    Knuth''s books had an impact that was immediate and widespread. They became some
    of the most important texts on computer science, and they often took a rigorous
    approach to describing computer algorithms with mathematical formulas.


    What Knuth originally intended to be one book has expanded into at least four,
    and the series continues, 45 years later. Volume two was released in 1969, volume
    three in 1973, and the first installment of volume four in 2005.


    Knuth labors on at Stanford University, and the entire computer science community
    eagerly awaits his releases of new material. He''s a sort of J. K. Rowling of
    the computer science world. But this article is not about Knuth''s famous books,
    but rather about something that happened to Knuth along the way.


    ### An Historical Inconvenience


    In 1976, when Ford was president and the Viking 2 spacecraft landed on Mars, Knuth
    was trying to get out a new edition of volume two of `The Art of Computer Programming`.


    At the time, most word processing was done with paper and pencil, or, for the
    more advanced, typewriters. If a document needed to be created for distribution,
    it was done so by a specialist typing these manuscripts into a typesetting machine,
    a giant computer system about the size of a small car, which cost thousands of
    dollars a month for the organization to maintain.


    The typesetter would type in the manuscript and then print the output, called
    the proofs, and take it back to the author of the document. The author would then
    edit the document (by writing on it with a pen), giving the changes back to the
    typesetter, who would then type them back into the typesetting system.


    Naturally, this took time, and mistakes crept into the process. It was a painful
    process.


    When he planned his reprint, Knuth was horrified to learn that the typesetter
    used for volume two was no longer around. It had been a proprietary system, as
    were all typesetting systems, and the company had folded, leaving Knuth with the
    prospect of redoing the whole process again.


    He was frustrated.


    ### The Personality of the Programmer


    Are you, or is any member of your family, a computer programmer? If so, you will
    notice certain personality characteristics.


    Programmers will often obsess about minutiae. Lots of other people were confronted
    with an illogical and inconvenient system for printing books. Every author right
    up until Knuth had to face these problems. No doubt with some grousing and complaining,
    they managed to deal with whatever they had to deal with to get their book in
    print.


    Any other author, confronted with the problem of redoing the typesetting of a
    book, would either get to work or abandon the whole idea. Not Knuth. He has the
    soul of a programmer, and he took the usual programmer path: writing software
    that can do it better.


    He developed a truly modern word processing and typesetting system that is still
    in use today. It''s called `TeX`, usually spelled with both the first and last
    letters capitalized. And it''s not pronounced like the first syllable in "Texas."
    It''s pronounced like the first syllable in "technology."


    ## TeX Today


    `TeX` lives on, and has got to be one of the most stable and bug-free software
    tools in widespread use today. Knuth no longer changes `TeX`, except to fix any
    reported bugs. These are few, however, because of Knuth''s programming skill,
    and because he has long offered a reward of $2.56 for each verified bug.


    Other than bug fixes, `TeX` is frozen. No new features will be added.


    However, that doesn''t mean `TeX` development is at an end. It is freeware, and
    Knuth encourages the development of other variants and versions of the core technology.
    One prominent example of this is `LaTeX`, a layer of software that sits atop `TeX`
    and makes producing mathematical, engineering and scientific documents easier.


    He asks only that, whatever you do, you don''t call it "TeX." As with his seminal
    series of computer science texts, `TeX` will always be associated with him alone.


    ### TeX to Texinfo


    The `TeX` engine is used by the Free Software Foundation—influential developers,
    maintainers, and distributors of the most important tools in Linux: the compilers
    and system tools that put the `UNIX` in Linux.


    `Texinfo` (`texinfo.org`) is a program that offers a simple way of encoding typesetting
    information in a text file. It allows you to produce a document in a variety of
    formats from the same text source, so that you can write one manual and have it
    available as a PDF file, plain text file, and PostScript file, as well as the
    info file used by Emacs.


    Since it''s the official typesetter of the GNU project, it is well supported on
    all Linux systems, and it is used for all GNU documentation. A quick Web search
    for your favorite GNU tool will show the output of the `texinfo` system, and if
    you download a printable copy you can see the typesetting done by `TeX`.


    ## The Triumph of TeX


    Knuth wrote `TeX` because of his own frustrations dealing with typeset in the
    production of his series of books. Instead of just doing the smart thing and accepting
    the limitations of text processing systems, he invented his own system—and it
    was great enough that it still forms the basis of many typesetting systems today.


    In typical programmer fashion, Knuth estimated that one year would be required
    to solve the typesetting problem. In fact, it took him 10\. It''s nice to know
    that even a genius can get the schedule wrong.


    While his schedule may have been inaccurate, his software is nearly perfect, and
    its influence has been profound over the last several decades.


    ## Curses, Foiled Again!


    In January of 1984, two things happened that would change the course of computing
    forever.


    One of them was the release of the `Macintosh`, the first real consumer computer
    with a graphical user interface (GUI), a mouse, and bitmapped graphics as a standard.
    Each of these technologies had existed in other computers, but the `Macintosh`
    united them in a single consumer package, and made computing history.


    It was the bitmapped graphics that made the Mac so pretty. With a screen resolution
    that was far greater than any PC of that era, it presented stunning graphics,
    which rapidly made the Mac the computer of choice for publishers, graphic artists,
    and those who found the command-line interface to be more than a little confusing.


    When Apple released the Macintosh, it launched the Age of the GUI.

