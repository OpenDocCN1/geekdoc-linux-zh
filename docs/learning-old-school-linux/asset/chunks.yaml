    使用专有软件，你会被锁定在某一家公司，并需要支付该公司要求的任何费用，否则就放弃该软件。而使用自由软件，这种勒索就不会发生。


    许多公司仍然可以盈利。


    IBM 是 Linux 自由软件最大的贡献者之一，这显然并非出于理想主义动机。自由软件允许该公司获得更多利润。


    IBM 在自由软件方面的成功证明了自由软件并不是反资本主义的；它为自由市场提供了解决方案的另一种方式。


    ## 天才之道


    天才往往格格不常是常态，斯尔曼（Stallman）也不例外。他有许多怪癖和关注的事业，其中许多可以在他的个人网页（`www.stallman.org`）上找到。


    其他程序员报告说，斯尔曼非常难相处。他被称为一个“控制狂”，不擅长与他人相处。


    尽管他古怪不常的名声可能名副其实，但这并不会削弱他在软件工程领域的成就和贡献。作为当今世界上最著名的程序员之一，他有权拥有自己的怪癖。


    斯尔曼是一个天才还是一个疯子？也许二者兼有。但他永远地改变了世界。


    ## 用 TeX 吊死他们


    1962 年，披头士乐队发行了他们的张胶片，一位名叫唐纳德·高斯（Donald Knuth）的年轻计算机科学家开始编写系列名为 `The Art of Computer
    Programming` 的书籍。


    高斯的书籍的影响是即时且广泛的。它们成为计算机科学领域最重要的文本之一，并且经常采用数学公式来严谨地描述计算机算法。


    高斯原本计划只写一本书，现在扩展成了至少四卷，而且该系列在 45 年后仍在持续。第二卷于 1969 年出版，第三卷于 1973 年出版，第四卷的第一部分于
    2005 年出版。


    高斯在斯坦福大学工作，整个计算机科学界都在热切地着他发布新材料。他就像计算机科学世界的 J. K. 罗琳。但这篇文章不是关于高斯著名的书籍，而是关于在这一途中发生在高斯身上的一件事。


    ### 历史性的不便


    1976 年，当福特担任总统、维京 2 号航天器登陆火星时，高斯正试图出版《计算机程序设计艺术》第二卷的新版本。


    当时，大多数文字处理是用纸和笔完成的，或者对于更先进的人来说，是打字机。如果需要创建一个用于分发的文档，则由专业人员将这些手稿输入排版机中——那是一台大约小汽车大小的巨型计算机系统，组织每月需要花费数千美元进行维护。


    排字员输入手稿然后打印输出结果（称为校样），并将其带回文档作者。作者随后对文档进行编辑（用笔在上面书写），将更改交回排字员，排字员再将这些更改输入排版系统。


    自然，这需要时间，错误也会在过程中滋生。这是一个痛苦的过程。


    当他计划重印时，高斯惊恐地发现用于第二卷的排版公司已经不存在了。那是一个专有系统，所有的排版系统都是如此，而且公司已经倒闭，导致高斯面临再次重做整个过程的前景。


    他感到非常沮丧。


    ### 程序员的性格


    你或你的家人成员中有计算机程序员吗？如果是的话，你会注意到某些性格特征。


    程序员经常会痴迷于细节。许多其他人面临着一种不逻辑且不方便的图书印刷系统。直到高斯之前的每一位作者，都必须面对这些问题。毫无疑问，在经过抱怨和埋怨后，他们设法处理了必须处理的一切以使他们的书籍出版。


    任何其他作者在面对重做书籍排版的问题时，要么开始工作，要么放弃整个主意。但高斯不是。他拥有程序员的灵魂，他采取了程序员的典型路径：编写可以做得更好的软件。


    他开发了一个真正现代的文字处理和排版系统，该系统今天仍在在使用。它被称为 `TeX`，通常第一个和最后一个字母都大写。它的读音不像 "Texas" 的第一个音节。它的读音像
    "technology" 的第一个音节。


    ## 今天的 TeX


    `TeX` 延续至今，并且无疑是今天广泛使用的最稳定、无 bug 的软件工具之一。高斯不再更改 `TeX`，除非修复任何报告的 bug。然而，由于高斯的编程技巧，这些
    bug 很少，而且他长期以来对每个经过证实的 bug 提供了 2.56 美元的奖励。


    除了修复 bug，`TeX` 是冻结的。不会添加任何新功能。


    然而，这并不意味着 `TeX` 开发已经结束。它是免费软件，高斯鼓励开发核心技术的其他变体和版本。一个突出的例子是 `LaTeX`，它是位于 `TeX` 之上的软件层，使得制作数学、工程和科学文档变得更容易。


    他只要求无论你做什么，都不要叫它 "TeX"。正如他开创性的计算机文本系列一样，`TeX` 将永远与他个人相关。


    ### 从 TeX 到 Texinfo


    `TeX` 引擎被自由软件基金会使用——Linux 中最重要的工具的影响力开发者、维护者和发行者：让 Linux 拥有 UNIX 环境的编译器和系统工具。


    `Texinfo` (`texinfo.org`) 是一个提供了一种在文本文件中编码排版信息的简单方法的程序。它允许你从同一个文本源生成各种格式的文档，这样你就可以写一份手册，并提供
    PDF 文件、纯文本文件、PostScript 文件，以及 Emacs 使用的 info 文件。


    由于它是 GNU 项目的官方排版工具，它在所有 Linux 系统上都得到了支持，并用于所有的 GNU 文档。在网上快速搜索你喜欢的 GNU 工具，就能看到
    `texinfo` 系统的输出，如果你下载一个可打印的副本，就可以看到 `TeX` 完成的排版。


    ## TeX 的胜利


    高斯编写 `TeX` 是因为他在制作系列书籍时处理排版问题感到的沮丧。他没有仅仅采取明智的做法接受文本处理系统的局限性，而是发明了自己的系统——而且它非常伟大，以至于今天仍然是许多排版系统的基础。


    按照典型的程序员风格，高斯估计需要一年时间来解决排版问题。事实上，他花了 10 年。知道即使是天才也会算错计划是一件好事。


    虽然他的计划可能不准确，但他的软件几乎是完美的，它在过去的几十年中产生了深远的影响。


    ## 诅咒，再次失败了！


    1984 年 1 月，发生了两件将永远改变计算进程的事。


    其中之一是 `Macintosh` 的发布，它是第一台将图形用户界面 (GUI)、鼠标和位图图形作为标准的真正的消费者级计算机。这些技术中的每一种在其他计算机中都存在，但
    `Macintosh` 将它们统一到了单一的消费者产品中，并创造了计算历史。


