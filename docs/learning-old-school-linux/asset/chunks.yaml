  trans: '

    Apple 的 GUI 不仅仅提供了可怜的小图标和窗口：它永远改变了电脑的使用方式。今天，没有哪一台通用计算机是不配备 GUI 的。即使是一直是软件保守主义堡垒的
    `UNIX`，现在也变得如此偏向于 GUI，以至于许多 Linux 用户甚至从未学习过使用命令行。


    但就像每一项重要技术一样，GUI 不仅仅创造了机会——它也摧毁了技术。


    汽车的发明摧灭了繁荣的马车行业，灯泡的发明摧灭了巨大的气灯业务。同样，GUI 的统治地位是以牺牲另一种新生技术为代价的。


    那种技术可以在屏幕上绘制与用户交互的界面，并允许用户在屏幕上移动光标、选择文本，简而言之，可以完成 GUI 现在能做的大部分工作。


    如今我们将其称为文本用户界面，但在那时它被称为“curses”。


    ## 每个季节都需要的终端


    在 GUI 出现很久以前的迪斯科音乐和 8 轨磁带的时代，所谓的“智能”终端已经取代了将所有内容输出在计算机纸上的咯哒作响的电打机。计算机用户界面刚刚诞生。


    起初，人们寻求的只是一种方法来复制以前通过打孔卡完成的工作即输入和显示 80 个字符的文本字符串，且没有任何格式。第一批现代终端只有一些粗糙的绿色数字和字母。没有人对字体有意见；我们大家对能看屏幕而不是看卡片上的孔就感到很高兴了。


    在当时，甚至没人知道什么是字体。如果你问起，我可能会猜是某种零食。


    然而，所谓的“玻璃电打机”的交互特性很快开始显现出来。程序员们开始玩弄弹出后又消失的菜单和帮助文本。文本编辑器 `vi` 出现了，它允许用户在屏幕上移动光标，现代文字处理开始拉开序幕。


    一些终端制造商甚至开始尝试彩色文本、下划线文本，甚至是闪烁文本。我们已经离开了单旧的打孔卡时代很远了！


    在那些狂热的日子里，有几十种不同类型的终端，具有不同的功能和品质。很快，程序员拥有的终端选项就比他们知道如何利用的还要多。


    遗憾的是，这些不同类型的终端使用的语言都是不一样的。虽然让软件在任何一个或两个终端上运行是可能的，但要管理更多终端就极其困难了。因此，一组科学家编写的软件无法与另一组科学家共享，因为他们使用的是不同的终端。


    答案自然是编写一个软件库，为所有人所有人提供一个通用的接口——一个了解每种不同类型计算机终端细节的接口。


    有了这样一个库（被称为“curses”），程序员就可以编写程序来与通用接口通信，而它就能运行在任何 `curses` 所知的的终端上。甚至还有一种方法让用户添加关于全新智能终端的信息，这样他们就可以开始使用它，也许在
    `curses` 编程团队甚至听说它之前。因此，一个全新的终端几乎可以立即投入使用。


    `curses` 是在 20 世纪 80 年初作为伯克利版本 `UNIX` 的一部分编写的。它取得了巨大的成功，在每一个 `UNIX` 系统中都能找到，作为
    `UNIX` 系统的考古地层的一部分。


    GUI 让 `curses` 注定了寂落的命运，但这并没有削弱早期程序员团队在硬件不兼容的敌对环境中奋斗争所取得的技术成就。


    ## 1984 年 1 月发生的另一件事


    1984 年 1 月是计算机技术收获丰收的一个月。Apple 不仅为 Macintosh 带来了巨大的关注和欢呼，而且（Richard Stallman 在没有任何宣传、零掌声的情况下）宣布了
    `GNU` 项目。


    `GNU` 试图制作一个自由软件版本的 `UNIX`。`GNU` 项目发起了自由软件运动，这在运动导致了 `Linux` 以及更多成果。


    20 多年后，我们可以回首 Macintosh 和 `GNU` 的影响，并好奇现在的什么技术即将变得过时。


    ## Linux 简介


    ComputorEdge 的读者是新奇特技术的早期采用者。但 `Linux` 有着关于难以安装和配置的某种令人生畏的声誉。虽然这在历史上确实如此，但现在有许多新工具让安装
    `Linux` 变得轻而易举。ComputorEdge 的一些专栏针对那些考虑尝试跳跃的电脑用户。作为一个大大的 `Linux` 粉丝，我构思切换的理由并不毫不费力。


    帮助 Windows 用户切换到 `Linux` 得益于 `Cygwin` 的极大辅助，它是许多 `Linux` 工具到 Windows 平台的极佳移植版。它很容易安装，并与你系统上的
    Windows 无害共存。但所有的 `Linux` 工具和程序都在那里。这是在不放弃 Windows 的情况下学习 `Linux` 的棒方法。


    ComputorEdge 确实是我写过文章的最轻松的杂志。其他技术杂志可能需要在网上寻找幽默，但 ComputorEdge 的编辑 Jack Dunning
    让我尝试找点乐趣。但我认为最搞笑的一篇文章却遭到了读者的冷遇。那是对一部非常受欢迎的电视情感剧的模仿，它探讨了切换到 `Linux` 的情感方面。


    要成为一个成功的电脑用户，你必须不断学习。有些专栏是关于 `Linux` 文档工具以及如何有效使用它们来学习更多 `Linux` 的。一旦准备好安装 `Linux`（`Cygwin`
    除外），新用户将面临选择哪种 `Linux` 发行版的难题。


    ## 开始使用 Linux


    `Linux` 真的是一个非常划算的交易。你可以获得价值数百万的软件，完全免费。


    有时，最困难的部分是开始。普通用户该如何开始？


    在系列专栏中，我将带你从零到百掌握 `Linux`。

    '
- fmt: '

    These computers just need an operating system upgrade to be turned into useful
    machines, suitable for Web browsing, office tasks (such as word processing and
    spreadsheets), and the other tasks of your average Windows computer. The documents
    you get will be compatible with Windows; your Web browser will look and work just
    the way it does on Windows.


    Unless you use Internet Explorer. In which case, stop now! Please.


    The great thing about one of these castoff machines is that they are completely
    expendable. Just cheerfully reformat the disks, and away you go. (But do check
    with the wife to make sure the computer isn''t the only one holding photos of
    the kids for the year 2002. Don''t just assume that because the computer is in
    the back of the garage, she has nothing on the disk. Don''t just blithely reformat
    the disk without backing it up somewhere.)


    There are lots of different distributions of Linux, but you won''t go wrong with
    any of the big favorites, such as `Ubuntu` or `Fedora`. You can download CD images,
    or pay a few bucks to get a set of Linux install CDs, or ask around at work and
    someone will have a set.


    Old laptops also make great Linux machines. I recently converted my old Windows
    laptop, a `Toshiba Satellite`. With Windows it was slow and clunky; with Linux
    it is fast and wonderful!


    ## Use Cygwin on a Windows Machine


    For those who can''t bear to boot a machine without Windows, there is the `Cygwin`
    option. `Cygwin` is a port of Linux to Windows. That is, Linux runs right on top
    of Windows. Just go to the `Cygwin` Web site (`www.cygwin.com`) and click the
    `Install Now` button to begin the `Cygwin` installation.


    This is not the most efficient way to run your hardware but, in general, any machine
    that can run Windows will be able to handle `Cygwin`.


    With `Cygwin`, you get a full set of Linux tools, with the same old Windows desktop
    and tools, side-by-side.


    This is a great choice if you have recently invested in new Windows hardware,
    or need to run some Windows applications as part of your work, or if you want
    a game system that can do Linux on the side.


    The `Cygwin` distribution is not a cut-down, limited version of Linux—it is the
    whole enchilada, ported to Windows. There''s (almost) nothing that a full Linux
    box can do that can''t also be done on a `Cygwin` box. You can even allow others
    to log into the machine remotely, and get a full Linux command line and windowing
    system.


    And with a `Cygwin`-based machine, Windows is still in the driver''s seat when
    you need it to be.


    I don''t like `Cygwin` machines, but that is not `Cygwin`s fault. The problem
    is that they still are running Windows, and that is taking a lot of resources.
    Any machine that can run `Cygwin` at a reasonable speed would be a real screamer
    with just Linux installed. So why not just cut out the middleman and take all
    the advantages of Linux?


    Alas, sometimes you can''t. If you''re imprisoned in Windows, `Cygwin` at least
    allows you to use decent tools.


    ## Buy a Linux Machine


    I''m a big fan of doing things the easy way, especially when it comes to computers.
    And you can''t get any easier than just buying a Linux machine off the shelf.
    In many ways, this is the best and easiest alternative.


    Are you looking for a new machine? Many Windows users find themselves doing this
    every few years.


    If so, give serious consideration to buying a Linux box.


    Since it does much more with much less, a new Linux machine can be a lot cheaper
    than a new Windows machine, yet still do the same job just as well. Buying well
    behind the curve, Linux users can reap the benefit of mass-produced, commodity
    hardware, and let Windows users bear the cost of getting the cutting-edge stuff.


    And next year, when that cutting-edge stuff has dropped to half the price, you
    can always add it if you need it. But you will probably find that a Linux machine
    remains useful just as it is for years and years. After all, why should a machine
    not keep working year after year, with reasonable performance? This is not much
    to ask, but computer users have been conditioned to think it''s impossible.


    Not only is it possible, it is now even easy.


    More and more desktops and laptops are being offered with Linux installed. Just
    take it out of the box, plug it in and turn it on.


    This doesn''t just save you the $100 that you would otherwise send to Bill Gates
    every time you buy a computer—it also ensures that you won''t have any trouble
    using any of the hardware devices on your machine, which can happen when you switch
    a Windows machine to Linux. (This has not happened to me in a number of years,
    with modern Linux distros being so good.)


    And believe me, even the chintziness and most economical new machine simply flies
    with Linux instead of Windows. No need to lay out the cash for the top-of-the-line
    hardware.


    ## What You Get With Linux


    All operating systems are layers of software upon software. Each builds on the
    past, and the nifty new features of today depend on the nifty new features of
    yesterday.


    This can be done poorly, or it can be done well. When it is done poorly, you get
    a huge, bloated, poorly organized mass of software. Like a skyscraper built of
    jello, it can''t get too high without spreading out over a huge area. It becomes
    a giant, cherry-flavored, quivering blob.


    When done well, the system software is like the Eiffel Tower, tall and straight,
    and occupying a minimum amount of horizontal space.


    In Linux, things are done well, not poorly. That''s why Linux users don''t have
    to upgrade their machines every three years just to keep running the same. And
    that''s why old Windows boxes can be readily converted into useful Linux machines.


    Whichever way you get to a Linux machine, you will be treated to a wealth of high-quality,
    stable and efficient software. With Linux you can get off the merry-go-round of
    hardware and software, and get a system that just works.


    ## How to Make the Switch to Linux


    Across the land, from a host of Windows users, the question echoes from the teeming
    coastal cities to the swtering central plains: "How the heck do I switch to Linux?!"


    As one who has reached the Promised Land, let me assure you is worth the journey.
    Linux and Windows both do the same—but Linux breaks less often. Linux seems to
    work with you, while Windows seems to be working against you. Windows is the evil
    twin of Linux.


    Switching to Linux can be accomplished in many different ways, ranging from easy
    to pretty challenging. You decide how much time and energy you have to put into
    the process.


    ### Taking the Easy Out


    When I was a young child, my teachers frequently condemned my laziness. "You always
    take the easy way out," they would wail, as if that is somehow a bad thing. (Little
    did they know that my love for the low-hanging fruit is exactly the quality needed
    for effective engineering.)


    With a Windows-to-Linux switch, the easy way out is called `Cygwin`. Go to the
    `www.cygwin.com` Web site and hit the button on the upper-right, which says, "Install
    Cygwin now." This will download a program called `setup.exe`. Run this program,
    and you will be directed to answer a few questions. (When asked to select a Cygwin
    repository, just make a random choice.)


    If you play around with setup, you will see that there is a huge list of available
    software, with some items already selected. The selected items are the minimum
    Cygwin installation, and you should just accept them and let setup install them
    for you. If you have only a dial-up connection, you will have to leave the machine
    connected for quite a while for this.

    '
