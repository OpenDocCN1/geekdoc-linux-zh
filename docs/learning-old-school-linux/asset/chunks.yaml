    OpenOffice 文字处理器的另一个伟大特性是它的无处不在。它几乎可以在每种计算平台上运行（而且一直是免费的）：Linux、Macintosh 甚至 Windows。它在所有平台上的运行方式都是相同的，因此你甚至察觉不到自己在使用哪种机器。


    ## 一些酷东西


    我之所以如此喜欢写关于 Linux 的东西之一是，它让我学习到许多关于我每天接触软件的有趣知识。和大多数文字处理用户一样，我只使用了软件自带的那些花哨功能中的一小部分。自然地，OpenOffice
    Writer 提供了自动拼写检查和同义词典（如果你好奇的话，又名同义词查找器、词汇表）。它有一个自以为是的（但往往准确得令人恼火）的自动更正功能。它还内置了媒体播放器，你可以将媒体嵌入文档中。它能以数百万种方式处理表格、框架、大纲和项目符号。它还可以跟踪参考文献和邮件列表。而这一切都不需要从网上下载的那些免费扩展包就能实现！


    ## 戒掉坏习惯


    当我向 Windows 用户展示 Linux 上可用的软件时，他们经常会惊讶地问：“如果这些免费软件都一样好，那为什么还要给微软付钱？”我通常指出，免费软件在质量和实用性上往往比专有软件好得多，而且很多人根本没给微软付过一分钱。但我还是会换来怀疑的目光。我觉得他们认为我正在对他们花招。毕竟，如果不需要付钱，那些微软用户真的会花那么多钱吗？


    人会养成坏习惯，而想要改变是很困难的。也许我应该为那些试图放弃微软的人推销某种皮肤贴。如果你在电脑上准备任何文档，那么就去看看 OpenOffice Writer
    并开始戒掉这个习惯吧。


    ## 进入正题


    整个个人电脑市场是建立在电子表格之上的。


    当第一代 IBM PC 发布时，大问题是：为什么会有人想要一台个人电脑呢？


    这现在听起来像个疯狂的问题，但除了硬核极客市场，还有什么理由要为一个人制造一台微型电脑呢？唯一能用电脑做任何有用事情的人是那些那些在“大铁块”（大型机）上工作的电脑极客们。他们鄙视新兴的个人电脑世界。早期的个人电脑市场是给爱好者的，而不是给专业用户的。


    然后，一个名为 VisiCalc 的程序发布了，电子表格诞生了。企业突然发现了小型电脑的力量，剩下的部分就是历史了。


    ## 意大利艺复兴时期的伟大发明之一


    在上一个千年，像伽利略和托马斯·杰斐逊这样的人在到处闲逛，导致重要日期的发生，以便未来的学生有东西可以记忆。企业当时通过手工进行一种被称为“复式记账法”的方法来跟踪资金。


    它的运作方式是这样的：你保留一本名为“日记簿”的大书，里面有很多带有特殊横线的纸。有水平线，每一行代表一笔支出。还有许多垂直列，大约 10 或 12 列。有一列用于租金，一列用于用品，一列用于工资，其他的用于业务的任何其他开支（包括万能的“杂项”列）。


    每当花费任何钱时，金额就会记录两次：一次在支出的注释旁边，一次记录在该支出的相应列中——这就是“复式记录”一词的由来。


    当日记簿页满时，每一列都要计算总和，所有类别支出的总和必须与该页的总支出相匹配。如果这两个数字不相等，说明你犯了算术错误，你必须不断重新计算，直到找到错误为止。


    这种开发于文艺复兴时期意大利的复式记账系统，是现代业务能够发展和繁荣的基础。它是如此成功，以至于西方世界的每家企业都一直使用它，直到电子表格的发明。


    事实上，在我发现通过计算机编程挣钱竟然要容易得多之前，我曾在费城的一家面包店担任记账员。每周我都会去那里支付账单，为面粉、水果和糖的供应商写账单并开具支票。我会支付租金、保险和工资。


    每个数字都妥善地记录在日记簿的两个地方。每一页填满的页面都会交叉汇总，在所有数字加总正确且老板确切知道花了多少钱之前，数字会被反复反复地检查（有时是，一遍又一遍）。但那是多么痛苦啊！


    尽管我记账的薪水相当不错，但每当交叉汇总不匹配时，我总是叹气。这意味着至少要花半小时重复该页上的所有计算，直到找到错误为止。它是枯燥的，是苦差事，而且远没有和哥们和女朋友待在一起有趣——甚至不如做我通常的工程作业有趣。那是纯粹的苦力活。你越讨厌数学，情况就越糟糕。有些企业主非常讨厌数学，以至于他们雇了喜欢数学的人来做记账。其他企业主只能忍受。即使是那些喜欢数学的人（像我一样）也觉得记账无聊。


    ## 计算机来救援


    有很多计算机不擅长的事情。它们不会聊天、做一顿好饭，也不会欣赏伟大的艺术品。但计算机擅长加法。而且它们擅长枯燥的工作。它们从不会感到无聊，也不会出错。这一切让它们成为了优秀的记账员。但对于非专业人士来说，让计算机完成你想要的事情并不总是很容易。


    随着电子表格的发明，一种不需要特殊工程才能的工具出现了。任何企业主都能立即理解它，因为它与复式记账法非常相似。电子表格让这种业务变得过时。有了电子表格，你甚至不需要复式记录。只需输入一次，信任计算机进行正确计算即可。（但不用担心记账员丢掉工作。你不需要比计算机更聪明才能生存，只需要比拥有计算机的人聪明即可。而且每个不需要付记账员工资的企业主仍然需要付钱操作计算机。但他们付的钱更少，速度更快，所以大家都更开心。）


    ## Linux 被遗漏了吗？


    在早期有 VisiCalc，但后来一个名为 Lotus 123 的程序创造了巨大的电子表格市场，这个市场一直发展至今。在早期，Linux 缺乏电子表格，这是
    Windows 用户可以声称优越的少数领域之一。但正如它往常一样，免费软件通过多个电子表格项目追上了进度。


    ## Gnumeric 与 Open Office


    如今有两个非常好的 Linux 电子表格程序：Open Office Calc (`www.openoffice.org`) 和 Gnumeric (`www.gnome.org/projects/gnumeric`)。


    Open Office 是 Microsoft Office 的完全模仿。它包含一个文字处理器、一个演示管理器、一个数据库前端和一个电子表格。


    电子表格是 Excel 的克隆，只有最高级的用户才能发现出它们之间的区别。尽管 Open Office 应用程序有自己的文件格式，但它们也可以使用微软格式，使其成为微软应用程序的直接替代品。使用
    Open Office 的人可以创建和编辑微软格式，使用微软的朋友和同事永远不需要知道你没有给比尔·盖茨付钱来帮你做电子表格。


    '
