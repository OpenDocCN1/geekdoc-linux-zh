    这些年来，华丽的编辑环境正风靡一时，而 Web 开发者的编辑器就是所谓“集成开发环境”泛滥的典型范例。这种尝试试图让编程变得像对支票簿、写信或在恐龙主题公园里打开门锁一样简单。


    然而，编程远比这要复杂得多，而 Web 编程也许是最复杂的编程类型。它涉及数十种不同的软件包，所有这些共同工作，将由 Web 程序员准备的文本和图形文件处理并转换为用户在
    Web 浏览器中看到的内容。尽管 Web 是一个非常图形化的环境，但有惊人的 Web 编程与图形无关——它仅仅是文本处理。


    例如，一个网页在被浏览器呈现出来之前，实际上只是一个简单的文本文件。浏览器和计算机用户都足够理解该文件，以便对生成的网页的外观做出某些决策。


    ## 回到基础


    谈到处理文本文件时，没有哪个比老派更老派的了。文本处理是任何从 1980 年以来的程序员都可以向你详尽介绍的事情。


    在过去，程序员使用各种不同的工具来执行组成编程的任务。这些工具都体现在通用的 UNIX 原则中：只做一件事，并把它做好。许多程序员仍然遵循这一原则。


    ## 学习曲线以及如何平滑它们


    学习如何使用所有工具对于新程序员来说是一个沉重的负担，也是错误和 Bug 的温床。因此，出现了图形用户界面的想法，将所有工具隐藏在窗口、向导和编写得良好的帮助文件之下。


    这只是在旧工具上画了一张漂亮的脸，但它让新程序员能够非常快速地上手，并以直观的方式使用这些工具。经验丰富的程序员也会声称，将所有工具集成到一个应用程序中使他们工作得更快、更轻松地完成任务。


    这种想法是拥有一个应用程序可以处理典型 Web 程序员的所有需求，就像微软试图用它的 `Word` 应用处理所有的文档准备需求，并用 `Microsoft
    Money` 处理用户所有的财务需求（如果比尔·盖斯懂钱，他还会懂什么呢？）


    这解释了为什么这类程序对我我这样的老古板来说几乎没有吸引力。我们已经爬过了那条学习曲线。无论最新的图形化工具长得有多漂亮，我不会用它来交换我正在使用的集成开发环境。


    ## 那些不是固执老怪客的人在使用什么？


    在 Web 编程世界，`Dreamweaver` 应用是行业标准的 Web 开发工具。


    它为用户提供了一个非常典型的 `Microsoft Windows` 界面，从那里可以执行全范围的 Web 开发任务。文件可以轻松从远程托管站点上传和下载；文件中的文本可以在精美的
    HTML 编辑器中编辑，该编辑器会根据其 HTML 含义更改文本颜色。（例如，被注释掉的 `HTML` 全为一种颜色，而标签与文件的其余部分颜色不同，等等。）


    毫无疑问，对于当今这个处处是图形用户界面的普通计算机程序员来说，像 `Dreamweaver` 这样的程序是进行 Web 编程和 `HTML` 编辑的最佳方式。


    但那不是我使用的。


    ## Emacs：程序员的秘密武器


    回在那个遥远的过去时光里，在水门事件仍是新闻焦点、尼克松总统辞职几个月后，理查德·史尔曼——一个疯狂的疯子，或者一个天才的编程天才，也许两者兼有——开始开发一个名为
    `Emacs` 的新编辑器——它实际上成为了第一个真正的集成开发环境。


    `Emacs` 编辑器（`www.gnu.org/software/emacs`）仍由史尔曼活跃开发，它继续在程序员功能方面领先，同时保持完全的向后兼容。


    `Emacs` 早已为那些想要使用它的人配备了图形化的外壳。（我不是。如果文本对我祖父——家族中的第一个程序员——来说已经足够了，那么对我来说也足够了！）


    `Emacs` 编辑器提供了编程环境的常规功能，就像 Dreamweaver 一样。但 `Emacs` 的伟大之处在于，它对每种类型的编程都一样。无论我是做网站还是老式的
    `FORTRAN` 编程，`Emacs` 都提供了所需工具。


    `Emacs` 足够聪明，可以根据你正在的工作进行调整。


    也许最好的一点是`Emacs` 是自由软件。我拥有源代码并可以随时随地编译它。它运行在我编写过的每一个计算机系统上，从旧的 `VAX` 系统到最新的 `Windows`
    版本。


    如果你的系统里还没有，你现在就可以下载它。


    没有任何能让它对你不向后兼容，即使是理查德·史尔曼也不行。哪一家公司可以将你所有的工作都握在它那汗津漉漉的商业之手中。


    ***


    我本可以通过说我整天都在 `Emacs` 里工作来回答我女的问题，但我认为她也无法理解这一点。你必须亲身与它协作，才能理解它是一个多么伟大的工具。


    # Emacs：你唯一需要的程序


    记得斯波克先生吗？他以前经常盯着那个原始的计算机东西，从中提取出又一次救了柯克之子的答案。这的一直是计算能力的惊人展示。终于可以揭示斯波克在进取号计算机上运行的是什么了：`emacs`。


    这解释了斯波克对计算机如此熟练！并不是因为他是逻辑人，而是因为他是 `emacs` 用户！


    ## 什么是 Emacs？


    `Emacs` 是一个文本编辑器，但说 `emacs` 是一个文本编辑器就像说太平洋是湿的一样。它不仅仅是一个编辑器——它是一个超级编辑器，一个极致编辑器（über-editor）。它是所有其他编辑器渴望成为、却知道自己永远无法做到的。


    文本编辑器的主要受众是计算机程序员。计算机程序虽然瞬即逝、昂贵且令人恼火，但是我们所有最酷技术的核心。而且，归结底，它们就是文本文件。`Emacs` 最终是关于软件开发的。它是迄今为止开发过的最好的软件开发环境。


    说 `emacs` 有一群忠实的追随者是严重低估了这种情况。我已经使用了 `emacs` 长达 25 年，几乎每天都用。如果你把它拿走并让我用另一个编辑器，我会用那个编辑器从零开始写一个
    `emacs`，而不是没有它。那是微软梦寐以求的的用户忠诚度。但他们永远得不到，因为他们永远生产不出比这十分之一好的软件。


    ## 它从哪里来？


    `Emacs` 是自由软件运动的起点。它是 `FSF`（`www.fsf.org`）（自由软件基金会）发布的第一个获得巨大市场份额的自由软件应用。


    在过去，在 `X Window` 为 `Linux` 提供桌面界面之前，`emacs` 只使用当时的技术——`ASCII` 终端。然而，从 `emacs`
    第 20 版本开始，`X Window` 图形用户界面得到了 `emacs` 的完全支持。


    ## 入门


    要开始使用 `emacs`，在命令行提示符输入 `emacs`。你会得到一个 `emacs` 窗口。


    最重要的知识是如何使用所谓的元 键（meta key）。元 键就像 Control 键（或者键盘上缩写的 `Ctrl`）。就像 Control 键一样，你在按住元
    键的同时按下另一个键。例如，要按下 `Ctrl-x`（正如你在 `emacs` 文档中看到的 `C-x`），你按住 Control 键，然后按下 `x` 键。要执行
    `meta-x`（或 `M-x`），你按住元 键，然后按下 `x` 键。


