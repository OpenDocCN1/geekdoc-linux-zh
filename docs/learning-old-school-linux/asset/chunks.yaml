    如果没有某种让这些独立程序之间共享和通信数据的方法，这些强大的结果将无可能实现。


    ## 三种通信流


    几乎每一个 UNIX 工具都能处理三种通信流。其一，`stdin`，是你向程序提供信息的方式。另一个，`stdout`，是程序发送其标准输出的地方。最后，`stderr`
    是工具发送错误信息的方式。


    ## 重定向


    假设你想将命令的输出保存到文件中。当你想通过电子邮件发送文件列表时，这非常有用。在 UNIX 中，使用大于号（`>`）来处理这种操作。看下下面的命令：


    ```bash

    ls -l > listing.txt

    ```


    这将创建一个名为 `listing.txt` 的文件。该文件将包含你输入 `ls -l` 时在屏幕上看到的所有内容。大于号（`>`）在极客术语中被称为重定向操作符。它告诉
    UNIX 将命令的输出发送到一个文件中。换句话说，`ls` 程序发送到 `stdout` 的任何内容都将写入文件。如果文件已经存在，它将被覆盖。也就是说，原始内容将被破坏。为了防止这种情况，请使用两个大于号，会将输出追加到文件中：


    ```bash

    lp -l >> listing.txt

    ```


    重定向操作符在两个方向上都可以工作：


    ```bash

    lpr < listing.txt

    ```


    这告诉计算机将 `listing.txt` 发送到 `lpr` 程序的 `stdin` 中。它并不那么常用，因为接收输入的程序（如 `lpr`）通常允许你在命令行上指定文件名。因此，文件也可以这样打印：


    ```bash

    lpr listing.txt.

    ```


    ## 管道


    有时，你需要将一个命令的输出发送到另一个命令。你可以将输出重定向到文件，然后将该文件作为下一个命令的输入。


    例如，要获取排序的文件列表，请尝试：


    ```bash

    ls -1 > listing.txt

    sort < listing.txt

    ```


    有一种一步完成此的方法：管道操作符。它对数据的作用就像水管对水的作用一样。它是大多数键盘上 `\` 键上方的竖线（有时中间有一个断开的符号）。


    对于你排序后的文件列表，请尝试：


    ```bash

    ls | sort

    ```


    这将为你提供当前目录下排序后的文件列表。管道接收一个命令的 `stdout` 并将其发送到另一个命令的 `stdin`。


    ## 配合 Grep 使用管道


    `grep` 命令在一个或多个文件中搜索文本正则表达式。例如：


    ```bash

    grep "howdy" *.txt

    ```


    此命令将在当前目录下的所有 `.txt` 文件中搜索字符串 "howdy"。


    通常，我会使用两个通过管道连接的 `grep` 命令。这允许我精炼我的搜索结果。如果上面的 `grep` 命令返回了数百次匹配结果，我可能会精炼搜索：


    ```bash

    grep "howdy" *.txt | grep -v "partner"

    ```


    第一个 `grep` 将生成一个包含单词 "howdy" 的行列表。第二个 `grep` 将对该列表进行操作，并找到所有包含 "partner" 的行。


    可以告诉 `grep` 命令显示不符合标准的行。要显示文件中不包含 "howdy" 的所有行，请尝试：


    ```bash

    grep -v "howdy" *.txt

    ```


    要找到包含 "howdy" 但不包含 "partner" 的行：


    ```bash

    grep "howdy" *.txt | grep -v "partner"

    ```


    ## Find 命令


    `find` 命令不仅仅是按名称查找文件。它还可以找到比特定大小大（或更小）的文件。


    `find` 命令的真正威力在于为 `grep` 命令提供输入（使用 `xargs` 命令）。这是程序员经常做的操作。看这个命令：


    ```bash

    find /home -name "*.cpp" | xargs grep "variable"

    ```


    此命令将查找家目录目录下及其所有子目录下的 C++ 源文件，并在它们中搜索字符串 "variable"。


    ## More 或 Less


    在图形用户界面（GUI）之前的远古时代，窗口侧边没有滚动条。事实上，甚至没有窗口！那么早期的计算机用户是如何查看文档的呢？他们使用名为 "more" 的工具。`more`
    命令将逐页显示任何文档。例如：


    ```bash

    more my_long_file.txt

    ```


    随着时间的推移，`more` 命令得到了各种改进，并作为新工具 `less` 发布出来。`less` 命令的工作方式与 `more` 命令一样：


    ```bash

    less my_long_file.txt

    ```


    More 或 Less 用于输出较长的命令。一个目录可能有数百个文件，在这种情况下，`ls -1` 命令会直接滚过，而不给你机会阅读它。尝试使用管道连接到
    `more`：


    ```bash

    ls -1 | more

    ```


    现在输出将逐页呈现。


    # 更多文本处理


    UNIX 拥有大量的用于处理文本的工具——多到无法在此列举。任何现代 Web 开发者或程序员都能从这些工具以及通过管道实现的各种组合中获益。常用的配合管道文本工具包括
    `sort` 命令；`uniq` 命令（它可以对列表进行排序并消除重复项）；以及 `cat`（它可以输出文本文件的内容）。


    `tr` 命令允许对文本进行许多有趣的操作，包括将大写转换为小写、将一个字符替换另一个字符，或删除输出中的每个字符。


    ## 一些组合


    一旦你学会了管道的使用，你会惊讶地发现用它们可以做很多事情。一个命令可以使用三个或更多管道。一个常见的应用是用另一个 `grep` 搜索 `grep` 的输出。例如：


    ```bash

    find . -name "*.cpp" | xargs grep "somestring" | grep "otherstring"

    ```


    上面的命令将在当前目录下的所有 C++ 文件中搜索 "somestring"。然后对该结果搜索 "otherstring"。

