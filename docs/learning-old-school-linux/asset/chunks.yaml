    # Who’s Got Your Back?


    We are putting more and more important data on our electronics, but are we taking
    more and more care that our data are safe?


    Backing up your computer storage, like flossing your teeth, sending thank-you
    cards, or changing the filter in the furnace, is one of those important activities
    honored more often in the breach than the observance. It’s just not very exciting
    - it’s a chore. And this chore has been with us from the earliest days of computing.


