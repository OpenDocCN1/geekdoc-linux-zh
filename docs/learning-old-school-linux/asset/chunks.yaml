    The instructions, or source code, exist as files on the computer disk. The files
    are processed by compilers or interpreters, and the computer carries out the instructions.
    You can''t touch the software, or see it (except using other software), but without
    it the computer would just be a hunk of junk. An old saying about the difference
    between hardware and software will help you understand: Hardware is the part you
    can kick; software is the part you can only curse at.


    ## The Development Tools at the Heart of Linux


    When a new microprocessor is developed by the good people at Intel, AMD or some
    other chip designer, how does that end up as a functioning computer? A new microprocessor
    needs to be able to run existing software to be worth anything.


    A computer language called `C` is used to get existing software on new platforms.
    The `C` compiler is a program that turns `C` source code into executables for
    the computer, and it is one of the first pieces of software to be ported to a
    new platform (using some assembly-language programming—far more primitive than
    `C`.) Once `C` is available, other tools (written in `C`) can be built. Using
    those tools and the `C` compiler, any application can be ported to the new platform.


    Since everything in Linux is built from these tools, and since the software is
    freely available, you can pick and choose your tools, starting with a brand-new
    microprocessor and `C` compiler, and end up with a core set of functioning tools,
    which would allow you to build any other Linux software. Without its software-development
    tools, Linux literally couldn''t be what it is today. The Linux development tools
    are used for much more than just porting, however.


    ## Creating More Shrink-Wrapped Software


    The term "shrink-wrapped" takes us back to the days when software was distributed
    in shrink-wrapped boxes in the computer store. That was before the Internet. They
    still sell those shrink-wrapped boxes because I see them in my local computer
    store. I believe the box now includes an old version of the software and the pass
    codes needed to download the latest copy, which is what everyone does.


    In the Linux world, I have never seen shrink-wrapped software, though presumably
    there is some somewhere. I get all my Linux software for free, so I wouldn''t
    know how it is sold.


    The distribution channel may have changed, but the term shrink-wrapped remains.
    Shrink-wrapped software is a product. It''s developed by one group of developers,
    and used by hundreds, thousands or even millions of users. The companies, universities
    and private individuals who work to develop code for the Linux platform each have
    their own reasons for doing so, but for all of them, software-development tools
    lie at the center of their product-development process.


    ## Creating More In-House Software


    The amount of shrink-wrapped software that is written is tiny compared to the
    amount of software written for the in-house use of a business, university, government
    agency or other organization. This can be anything from specialized payroll processing
    to special reports for the CEO. All of this business activity relies on the development
    tools of the local computing platform.


    ## Creating Web Sites


    The Web has been adopted faster than any previous invention in human history.
    Cavemen sat around and debated the pros and cons of using those newfangled metal
    arrow tips longer than our civilization took to turn all our banking, reservations
    and business information over to this brand-new computer tool. Does that make
    us smarter now—or dumber?


    All this has created a new field of software development: Web site development.
    Even a relatively simple Web site involves lots of software and at least a little
    programming. Any ambitious Web site is going to involve a lot of programming.
    The vast majority of serious Web sites are built on the ultra-reliable `LAMP`
    (Linux, Apache, MySQL and PHP) stack, and the `L` in `LAMP` is for Linux. Consequently,
    most Web site development is done with Linux development tools.


    ## Creating Embedded Software


    They are everywhere: in your car, your kitchen, even your bedroom. I refer, of
    course, to computers, which are now so cheap that they are found in many very
    inexpensive devices, and so useful that it almost doesn''t make sense to build
    anything complicated without one. I read some time ago that there were 14 microprocessors
    for each person in America, and that number is just trending one way. Get used
    to computers in everything that costs more than $20.


    Those embedded computers need software, and much of this software is written on
    Linux systems. The propagation of Linux in the embedded market is inevitable and
    unstoppable, so this trend will only increase.


    ## The Power of Free Software


    The magic (or at least magical) power of free software is that it can adapt to
    any platform. Like The Blob, the eponymous star of the 1958 Steve McQueen film,
    it just absorbs everything that it comes up against. The reason is the very freedom
    that defines free software. Since no one owns it, no one has to pay anyone to
    use it. If you have a new hardware platform, you need to get some software on
    it, and Linux is free, portable, and the experience is already there—so why do
    anything else?


    The software-development tools of Linux are developed, maintained and released
    as free software by the Free Software Foundation. In the next few weeks, I''ll
    be looking more closely at these development tools, and I''ll attempt to explain
    where they each fit in the Linux development package. Without these tools, there
    would be no Linux.


    # Developing Software for Linux Platforms


    Fall is the time when high school seniors start to think about college choices.
    Some lucky few (like me), have to decide only which engineering college they will
    go to. Others, more perplexed, are trying to decide what profession, if any, they
    should pick. They are aware that their entire future hinges on this decision;
    in the casual way of 17-year olds, they don''t let that bother them much.


    At times like these, my wife frequently suggests information technology as a possible
    career choice. I am more hesitant to do so. I''ve discovered over the years that
    it''s no favor to turn someone into a software developer. If it''s not something
    they choose from the start, with their own eyes open, should they really be doing
    this kind of work? Are good programmers born, or made?


    I really don''t know, but it''s not my intention to do another "Sex in the City"
    parody (see "Linux and the City").


    ## Judge a Craftsman by the Quality of His Tools


    Fortunately, for aspiring programmers, the very best tools are also completely
    free. Linux provides a complete programming suite, from editor to run-time environment.
    The Linux tool chain is widely used throughout industry for the heavy lifting
    of software development, and a good programmer, trained in Linux tools, need never
    worry about running out of interesting and profitable employment.


    To start, pick a text editor. My favorite choice is `emacs` (see "Emacs, the Only
    Program You Need"). Whatever text editor you pick, you will spend a lot of time
    there. So choose one you like, and spend a little time getting to know it. Any
    editor you choose should include the ability to compile, run and even debug code
    within the editor.


    ## Compiled vs. Scripted Languages


    There are many different programming languages, each with its own proponents.
    All those languages are available to Linux programmers, and most Linux programmers
    are skilled in a number of languages.


    For the purposes of discussion, we''ll divide languages into compiled languages
    and scripting languages. Compiled languages are the ones you use to make a user
    application, most of the time. Scripting languages are the languages you use to
    make some kind of "glue code," which runs various other programs in the right
    order, with the correct arguments.

