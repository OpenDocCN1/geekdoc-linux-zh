  trans: '


    随着时间的推移，你的知识将会不断增长，寻找正确信息的能力也会随之增长。人们会开始向你寻求答案，你会听到别人称你为专家甚至是大师（guru）。然而，你仍然不会觉得自己真的是一个专家，或者真的知道所有的答案。


    但大师们并不是知道所有的答案；他们只是知道如何提出好问题。


    # 发行版


    Linux 让新用户感到困惑的一个方面是可选的选择非常多。另一方面，来自雷德蒙德的商业操作系统有两个版本：Pro（专业版）和 Home（家庭版，这可能意味着业余水平！）。


    Linux 的核心在于为你提供选择。它有数百种版本。


    但在你的大脑因厌恶而举手投降并放弃之前，它所能处理的选择其实是有限的！


    ## 回到过去


    你放在桌子上的计算机硬件只是一个巨大的、通用且极其复杂的算盘（不过算珠是电子）。它是如此复杂，以至于如果你必须从硬件开始，尝试给某人写封信，你需要花费几年时间。再多加几年才能实现打印功能。


    这就是 20 世纪 40 年代和 50 年代早期计算机用户的生活。但随着时间的推移，现有的软件体系开始积累。并不是每个新用户都需要花费一个月来写一封信。一旦第一个文字处理器被写出来，所有人都可以使用它。


    这种在他人工作的基础上进行构建的能力启发了理查德·斯托曼（Richard Stallman）发起自由软件运动以及 `GNU` 工具。正是这些工具让林斯·托瓦尔兹（Linus
    Torvalds）在 1991 年开发了 `Linux kernel`。他是在已有的软件基础上进行构建的——他一个一个地下载并安装到自己的电脑上。


    全世界都是如此。兴奋的用户会获取 `Linux kernel`，然后将其作为系统的核心。但就像 40 年代和 50 年代的用户一样，单靠内核只能让他们得到一个运行的计算机硬件。他们仍然需要组装各种实用程序（如文字处理器），并让它们在他们的
    `Linux kernel` 上运行。这些实用程序大部分来自 `GNU Project`。图形系统则来自 `MIT X Window project`。


    但让它们共同协同工作取决于用户。有时这可能是一个真正的挑战。在过去，许多城市的 Linux 用户会举行会议，鼓励 Linux 新手带着他们的系统来安装 `Linux`。专家志愿者会在现场，他们带着装有预录制软件的
    CD，并凭借多年的经验来让顽固的系统运行起来。


    这很有趣，但对除极客之外的所有人来说都是一种挑战。要将许多不同的软件包并让它们共同工作是非常困难的。涉及的软件越多，工作量就越大。


    ## 发行版的救救


    这些困难大大减慢了 Linux 的使用。Linux 是计算机科学研究生和电气工程本科生的读物，而不是普通计算机用户的。


    一个热情的 Linux 社区的发展使得下一步变得不可避免。用户开始打包他们成功集成的软件系统，并将 CD 邮寄给任何想要的人，或者通过互联网分发磁盘镜像。他们开发了特殊的图形工具来帮助新用户安装
    Linux，而复杂的包管理系统消除了获取和安装新软件的艰性。


    由于它全都是自由软件，你不需要拥有它就可以将其打包送人，甚至可以售卖。它是免费的，所以尽管去吧！


    这就是许多用户所做的。一套集成的 `GNU/Linux` 软件被称为发行版，或 `distro`。世界上有成千上万的 Linux 用户出于商业或利他动机，会花力组装他们自己独特的
    Linux 发行版。


    有些发行版针对新用户，只提供最基础、简单的工具。另一些则针对硬核极客，拥有你听过的每一个酷炫软件的最新前沿版本，以及数百个你甚至没听过的软件。有些发行版旨在快速转换
    `PC`，有些则运行在嵌入式平台或超级计算机上。对于每种口味和需求，都有一种相应的发行版；如果没有，可能现在正有人在推出。


    一些公司成立了，销售发行版及其支持服务。他们不卖软件——软件是免费的。他们卖给你那个聪明的专家，他可以来到你的办公室让软件在你的硬件上运行起来。其中一些公司甚至开发了更好的工具来帮助新用户。


    ## 哪种发行版适合你？


    任何发行版都能让普通计算机用户能够安装 `Linux kernel`、窗口系统，以及大量的额外工具和实用的玩具。你不再需要拖着你的 `PC` 去 Linux
    用户聚会来让它运行。现在的安装工具已经开发得非常完善，在新系统上让 Linux 运行相当简单。


    有了这么多选择，你应该选择哪种发行版？


    你可以在 `distrowatch.com/dwres.php?resource=major` 找到一份随机选择的前 10 最佳 Linux 发行版列表。


    除非你有特殊需求，否则发行版的选择并不关键。前 10 名中的任何一个效果都和别的一样好。记住，任何发行版都只是一个起点。它为你提供了一个软件工具的基础。


    ## 在哪里获取以及如何使用


    你在哪里以及如何获取你的发行版取决于你想如何使用它。获取发行版最直接的方法是通过邮寄订购 CD。只需支付少量的费用（通常少于 5 美元加运费），你就能几天内收到你的发行版，并从
    CD 安装。


    对于没那么耐心的人，你可以下载安装磁盘镜像（约 700MB），将其写入 CD，这样就无需等待即可拥有安装光盘。


    对于甚至更没耐心的人，Debian 允许你下载一个很小的安装实用程序。在目标机器上（必须连接互联网）运行它，它它将引导你完成安装。我从未尝试过这个，但它听起来棒极了，我想下次有机会一定会尝试！


    ……选择发行版只是许多选择中的第一个，但它并没有你想象中那么大的限制性。发行版仅仅是已经免费的软件的不同集合。如果你看到了一些有趣的软件并喜欢它，无论你从哪种发行版开始，都可以获取它。随着时间的推移，你将在你的机器上安装各种软件包，在从发行版安装的包基础上不断添加。你的工具集将成为你自己独特的软件集。


    '
