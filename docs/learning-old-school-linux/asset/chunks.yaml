    公平地说，对于 `ed` 的开发者来说，所谓的“玻璃电打字机”尚未发明，所以除了在电打字机上打印之外，没有其他办法显示文本。（这也是他们知道你某处有一份代码打印件的原因。）


    如今，在几乎每一个 Linux 工作站上仍能找到 `ed`，尽管我怀疑已经没有什么用户在使用它了。它的基因在一个名为 `sed` 的后代身上延续了下来，那是一个处理文本文件的实用。


    ## vi 及其衍生的扭曲变种


    最终，将电视连接到电脑的奇想导致了玻璃电打字机的出现。在在使用 `ed` 编辑程序多年后，一些程序员得出了一个惊人的结论：在屏幕上显示文本对编辑非常有帮助。你不再需要记住文件中每个东西的位置，只需要在屏幕上看一眼就行了！


    这种编辑器的视觉化导向决定了它的名字：`vi`。


    尽管 `vi` 是 `ed` 的改进，但与今天的现代编辑器相比仍相去甚远。事实上，由于它怪异的命令结构和一次只能编辑一个文件的奇怪方式，让我的灵魂充满了恐惧。新用户在尝试使用
    `vi` 时被完全逼疯的情况并不罕见。


    尽管存在许多问题，`vi` 编辑器继续在其严酷的生态位中潜伏。它甚至演化出一系列噩梦般的后代，包括 `vim`。就像一种绦虫一样，它甚至成功地通过 `vi`
    仿真模式寄生并植入了另一个编辑器之中。


    正如俗话所说：没有 "vi"就没有 "evil"邪恶）。


    ## Emacs - 软件界的上帝粒子


    CERN 的极呆子们正在启动大型对撞撞机，试图寻找所谓的上帝粒子。（他们不断向我们保证他们不会毁掉地球，难道不会让其他人感到有些紧张吗？）


    如果他们寻找的是编辑器而不是粒子，他们将会找到 `emacs`。


    被广泛誉为计算机编程历史上最出色的集成开发环境，`emacs` 是程序员的天堂和游乐场。它既有趣又高效，可以完成你能想到的所有事情，以及双倍你甚至从未想过的（但非常有用）的事情。


    有了 `emacs`，程序员永远不会离开编辑器——程序开发的各个方面都可以在编译器、编码、编译、调试和运行中完成。`emacs` 是自由软件基金会发布的第一个自由软件产品，仍然是
    Linux/GNU 的核心部分。要开始，在命令行提示符输入 "emacs"，或者在菜单中查找它。


    `emacs` 极具适应性。它被移植到几乎每一个平台，可以通过 `X Window` 的高带宽连接运行，也可以通过基于 ASCII 的接口通过低带宽连接运行。


    ## Pico 和 Nano


    过去，有一个名为 `pine` 的 Unix 电子邮件程序，它附带了一个用于编写邮件的编辑器 `pico`。很多人对这个编辑器着迷，并开始用它进行代码开发。由于自由软件许可证限制，`pico`
    最终灭了，但它的直接后代 `nano` 活了下来。


    原始的 `pico` 在硬件非常有限的时代很有吸引力。它比 `vi` 好（几乎所有东西都比它好），而且不像电脑繁忙时 `emacs` 那么慢。但在过去的大约
    25 年里，这已经不是问题了，所以很难理解 `nano` 为什么还能活下去，尽管它确实存在。


    当然，在此期间添加了许多新功能。现在 `nano` 拥有的功能比旧时代几乎任何其他编辑器都多，尽管按今天臃肿的标准来看，它仍然非常精简。这是一个仅限 ASCII
    的编辑器，那些需要华丽 GUI 的人需要转向其他选择。`nano` 有它自己的网页：http://www.nano-editor.org。


    ## GUI 附件


    如果你在 Linux 机器上阅读这些，请看一眼菜单，也许在类似“Accessories”（附件）的栏目下，你会发现一个文本编辑器。在 KDE 系统上，这是一个名为
    `kate` 的程序，在 GNOME 系统上，是 `gedit`。


    在商业桌面计算世界中，操作系统附带的免费附件功能极其微弱。毕竟，他们没有在这些软件上赚到任何额外的钱，所以商业公司没有动力继续改进和开发它们。Linux 一如既常地，完全是另一回事。在
    Linux 世界，真正很棒的程序员会继续开发工具，仅仅是为了炫耀的资本、简历上的光点以及为自由软件项目贡献带来的自豪感。


    考虑到 Linux 软件的通常动态，发现这些 GUI 附件是功能强大的文本编辑器并带有一些有趣的功能，并不意外。它们可以处理多个文件、代码语法高亮和拼写检查。与上述所有文本编辑器不同，这些编辑器仅通过
    `X Window` 连接工作——它们是纯图形化的。


    `kate` 有一个网页 http://kate-editor.org/；`gedit` 的网页是 http://www.gnome.org/projects/gedit。


    # Eclipse - 一个非常华丽的 IDE


    由 IBM 于 2001 年启动，开源编辑器 `eclipse` 尝试用 `Java` 从头开始构建 IDE。其结果令人印象深刻，无疑等同或超过了与其非常相似的微软
    IDE `Visual Studio`。虽然编辑器本身是用 `Java` 编写的，但它可以用于任何语言的代码。它是用 `Java` 构建的，并不影响可以编辑什么类型的文件。


    `Java` 基础确实有一个影响：它天生比用于大多数其他编辑器的语言 `C/C++` 慢。然而，在高端开发者工作站上，这一点是不明显的。


    ## 其他编辑生物


    Linux 中有许多种类的文本编辑器，这是自由软件生态丰富性的真实证明。其他有趣的样本包括 `jEdit`（一个用 `Java` 编写的 `Java` IDE，http://www.jedit.org/）、`NEdit`（Windows
    文本编辑器的 Linux 克隆，http://www.nedit.org/）、Eddie（Macintosh 开发 IDE 的克隆，http://www.el34.com/index.html）、`Scribes`（一个尝试自动化的专注文本编辑器，http://scribes.sourceforge.net/）、`Diakonos`（目标是比
    `emacs` 更容易配置，比 `pico` 或 `nano` 更强大，且不像 `vi` 那么晦涩，http://purepistos.net/diakonos）。


    去外面编辑别人吧！也许你创建软件将就是下一个伟大的编辑器。


    ## 谁需要华丽的 HTML 编辑器？


    我 8 岁的侄女问了我一个难题。在听说我是计算机程序员后，她问：“但你整天都在做什么？”


    我试着向她解释，但从她不可置信的眼神中，我猜出她并不完全相信。


    ## 程序员整天都在做什么？


    编程大部分关于编辑文本文件，对于华丽的图形网站是如此，对于最无聊、甚至没有图形界面的旧应用程序也是如此。


    也就是说，大多数程序员并不是在按漂亮的按钮，而是一直在打字、打字、打字，一次鼠标都没碰。


    我喜欢《侏纪公园公园那样的电影，他们展示了一个肥胖、邋遢、讨厌的程序员，背景是他的电脑屏幕。这种场景对我来说看起来完全虚假，不是因为我没见过肥胖、邋遢、讨厌的程序员，而是因为背景屏幕上有许多华丽的图形——甚至在某一点还有一个跳舞的草裙女孩！


    哪个极客会做图形？当我编程时，屏幕上只是黑背景上的白字，鼠标就像从机器上断开了一样。没有任何东西跳动或闪烁。它只是静静地呆在那里，一堆字母。


    ## 试图让编程变得漂亮


