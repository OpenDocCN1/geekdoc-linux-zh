  trans: '


    # Open Office Calc 电子表格


    Gnumeric 是一个较老且更独立的应用程序。它不属于任何办公套件，但尽管如此，它可以完全取代用户桌面上的 Excel。


    ## 应该使用哪一个？


    对于新 Linux 用户来说，面临的主题仍然是选择。与其他的私有操作系统不同，Linux 提供了多个电子表格应用程序。那么，新用户应该选择哪一个呢？


    我作为一个比较随意的电子表格用户，我只能说，我从未发现这两个程序中任何一个是做不到像 MS Excel 那么好的。两者都是完全合格的替代品——它们都可以打开、编辑和创建
    MS Excel 格式的电子表格。它们都能处理图表、统计图、统计分析以及复杂的扩展和自定义。它们与 Excel 电子表格都具有极佳的兼容性。


    使用你在 Linux 机器上发现的任何一个即可。无论你选择哪一个，运行得都会很好！


    # 冒险仍在继续


    在 2010 年左右，ComputorEdge 停止了纸质版出版，转变为纯在线杂志（尽管仍有地方版，包括科罗拉多州）。由于财务限制，Jack 无法继续支付这些文章的费用，因此我停止了写作。在我写这些文章的几年里，我学到了很多，作为一名程序员也许作为一名作家都成长了很多，并且乐在其中。我怀念写这些文章！


    但计算机行业仍在增长和变化。新技术正以令人兴奋且不断增加的频率出现在这个已经拥挤的领域中。随着每一天的过去，计算机软件正日益改变着我们的生活。总有更多东西要学，有更多事情要做。


    '
