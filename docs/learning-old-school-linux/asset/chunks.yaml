- fmt: "\nOne of my college buddies has a great term for the kind of watered-down\
    \ math classes that business majors take. He called it \"let's pretend math.\"\
    \ The same term can be applied to the Windows version of the shell, the DOS shell.\
    \ Reportedly, it was written by Bill Gates on a flight to meet the IBM engineers\
    \ who would be using it on the new (at the time) IBM PC. I don't know if the story\
    \ is true, but I have little trouble believing it. Any UNIX user who encounters\
    \ the emasculated features of the DOS shell will have no trouble believing that\
    \ it was written on an airplane, with all the distractions and limitations that\
    \ might imply. The DOS shell is a \"let's pretend\" shell, with little of the\
    \ power and elegance of the UNIX shells, which are so shamelessly copied. The\
    \ DOS shell is an inferior knock-off.\n\n## The Shell Today\n\nThese days, just\
    \ about everything on a Linux box can be done through whichever GUI you are using,\
    \ but that doesn't make the command line useless—it is a tool for experts. It\
    \ allows you to run commands with a powerful and terse syntax, and provides a\
    \ wide variety of tools to help you customize your interaction with the computer.\n\
    \nThe shell is still there, just as it always has been, waiting to provide a powerful\
    \ interface to the user who is willing to take the time to get to know it.\n\n\
    ## Fun With Bash Prompts\n\nEvery command-line interface must have some sort of\
    \ prompt string—something that is printed out on the terminal to indicate that\
    \ it is your turn to type—to tell the computer what to do. You then issue a command,\
    \ and when it is complete, the prompt again appears to let you know that the computer\
    \ is ready for more input.\n\nWhen I start my `bash` shell, I see:\n```\n~> .\n\
    ```\n\nThis is my directory (`\"~\"` means home directory), and then an angle-bracket\
    \ and a space indicates the end of the prompt. (The space is important; without\
    \ the space, the command line looks very crowded and ugly.)\n\nAs with most everything\
    \ in Linux, this can be customized by the user. You change your prompt by setting\
    \ the environment variable `PS1`, and there are many neat things you can do to\
    \ make the prompt more useful and interesting.\n\n### Setting an Environment Variable\n\
    \nTo set an environment variable in `bash`, use the `export` command. Once you\
    \ set the `PS1` variable, the command line immediately changes.\n\n```\n~> export\
    \ PS1='what is your command human? '\n\nwhat is your command human?\n```\n\nIt's\
    \ important that you don't put spaces around your equal sign (`=`) when using\
    \ `export`. There must be no spaces between the variable you are setting, the\
    \ equal sign, and the value you are setting it to. Also note the use of the single-quote\
    \ character around the string value. Without those quotes, the shell would get\
    \ confused by the spaces in the string, and would set `PS1` to `\"what,\"`, and\
    \ then try to process the rest of the string as additional arguments to `export`.\n\
    \nThere are three quotes on your keyboard: the single quote, the back-tick (a\
    \ single quote facing the other way), and the double quote. On a U.S. keyboard,\
    \ the single quote and double-quote are on the same key, near the Enter key. The\
    \ back-tick is on the upper-left, with the tilde. Each of these sets of quotes\
    \ means something different, so make sure you are using the correct one.\n\nTo\
    \ play around with prompts, you can set them from the command line, but to change\
    \ your default prompt, you are going to have to set the `PS1` variable in your\
    \ `.bashrc` file.\n\nBy setting `PS1`, you can have any string as your prompt.\
    \ But there is so much more!\n\n### Built-In Fields\n\nThe `bash` shell has a\
    \ bunch of built-in fields for the prompt—special character strings that you can\
    \ put into `PS1` to change the look of the prompt. For example, if you want the\
    \ time in your prompt, use `\\D{}` in `PS1`.\n\n```\nwhat is your command human?\
    \ export PS1=\"\\D{}> \"\n\n07:54:11 AM>\n```\n\nThere are dozens of built-in\
    \ fields, such as the date and time field above (which can be formated by putting\
    \ the correct string between the curly-braces).\n\nSome useful fields are the\
    \ hostname (`\\h` or `\\H`), the user name (`\\u`), and the current working directory\
    \ (`\\w` or `\\W`). There are many ways to get the date and time, or one or the\
    \ other, in addition to the `\\D{}` shown above.\n\n### Living Color\n\nSetting\
    \ the prompt also allows you to change the colors of the text, even the color\
    \ of the background. It's a bit of black magic, but add the string `\\[\\033[1;31m\\\
    ]` at the beginning of your prompt, and the string `\\[\\033[0m\\]` at the end.\
    \ The first blob of funny characters tells the shell to use light red as the text\
    \ color, and the other blob tells the shell to turn off any color changes and\
    \ go back to the default color. If you don't include this part, not only what\
    \ you type, but also the computer's response, will be in light red.\n\nOf course,\
    \ light red is not the only color available—the complete list of color codes can\
    \ be found in the `bash` man page. They range from black (`0;30`) to white (`1;37`),\
    \ with many in between, such as cyan (`0;36`), brown (`0;33`) and light purple\
    \ (`1;35`).\n\nIf you add a 10 to the color number, the background color is changed\
    \ instead of the text color. For example, including `\\[\\033[1;45m\\]` turns\
    \ the background color to light purple. The `1;45` is the light purple color number\
    \ (`1;35`), with 10 added to the second number.\n\nI don't know who came up with\
    \ this crazy way of setting colors in the prompt, because it could hardly be more\
    \ confusing. But using both features together allows you to change both background\
    \ and text color. For example, setting your prompt to `\\[\\033[1;45m\\]\\[\\\
    033[1;37m\\]\\d \\[\\033[0m\\]` will give you the date in white, against a purple\
    \ background. \n\nIn that funny-looking string, there are four parts. The first\
    \ part, `\\[\\033[1;45m\\]`, turns on the purple background. The second part,\
    \ `\\[\\033[1;37m\\]`, turns on the white text. The third part, `\\d `, shows\
    \ the date, followed by a space, and the last part, `\\[\\033[0m\\]`, turns off\
    \ all the fancy color stuff so that the command line is shown with default color\
    \ and background.\n\n### Prompt History Lesson\n\nBack in the '70s, everyone was\
    \ delighted with the invention of the first glass teletypes. They replaced the\
    \ paper teletype—an IBM Selectric typewriter, modified to print out the computer's\
    \ response underneath whatever you typeed on the typewriter. The paper teletype\
    \ used boxes and boxes of computer-fold paper, and sounded like a machine gun\
    \ firing. (It sounds primitive now, but compared to punch cards, it was very high-tech.)\n\
    \nThe glass teletype, as it was called, was the first cathode-ray tube monitor.\
    \ The `CRT` monitor was a technology that had a long run, but is now almost completely\
    \ obsolete, due to the `LCD` screen. At the height of its development (i.e., just\
    \ as it's going obsolete), the `CRT` delivers super-sharp pictures in amazing\
    \ color.\n\nThe first glass teletypes also had color: green. They displayed everything\
    \ in the same ugly green text on the screen. But it wasn't long before the so-called\
    \ \"smart\" terminal was developed, one that could let the user experience things\
    \ like colored text, blinking text, etc. This was another technology that was\
    \ approaching perfection and obsolescence, as the graphical user interface was\
    \ introduced and the command-line interface became something that appears in just\
    \ one window on a screen full of fancy gadgets and applications.\n\n## Combining\
    \ UNIX Commands\n\n\"Do one thing, and do it well.\" This is a statement that\
    \ inspired early UNIX programmers. UNIX consists of a wide variety of tools, each\
    \ extremely focused. But when you combine them, you can produce sophisticated\
    \ results. The fundamental difference between Windows and UNIX is that Window\
    \ is designed to be easy to use, while UNIX is designed for pure power.\n"
