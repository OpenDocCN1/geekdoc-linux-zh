    # 文本操作


    当在 Linux 上进行文本编辑时，有很多流行的选择，包括 `vi` 和 `emacs`。从不回避表达偏好，我一直是 `emacs` 的坚定支持者。它是深奥且难以手的，并且有自己的语法和世界观，但它仍然是
    Linux 系统最好的编辑器和集成开发环境 (IDE)。


    ## 编辑器汇总


    在石器时代，原始程序员使用 `TRS-80`、`VAX` 和大型机等原始设备执行许多计算。即使在那个原始时代，当原始人程序员坐在树下用惊人的石器工具进行软件开发时，文本编辑器已经变成了几种不同的物种。有些走向了灭绝，少数生存了下来，或者繁衍了成功的后代，并仍然是文本生态的一部分。


    ## Ed - 一个纯主义者的编辑器


    当我还是个孩子时，我被带着其他新泽西州去去了谷堡和其他革命战争遗址。当导游和老师们对某些事情滔滔没完时，我们都有同一个问题，而且一直没有得到答案：他们是如何挤进那些展示的制服和床的？展示柜里的制服看起来像孩子的万圣节服装。床大约四英尺长。那些士兵真的那么小吗？


    `ed` 就像那些老士兵——它在如此小的空间内运行，让你怀疑它是真实的。在 `ed` 的情况下，空间是计算空间，`ed` 使用的内存和处理器少到你可能可以在在手表上运行它。它甚至不同时显示任何文本——你只需要知道你的文档里有什么，根据先前的打印件。（毕竟，如果你从一开始就不知道里面有什么，你为什么要编辑它呢？）

    '
- fmt: '

    In all fairness to the developers of `ed`, the so-called "glass teletype" hadn''t
    been invented yet, so there was no way to display text except print it our on
    a teletype. (And that''s how they knew you had a print out of the code somewhere.)


    These days `ed` can still be found on just about every Linux workstation, though
    I doubt there are any users out there. It''s genes live on in a descendant called
    `sed`, a utility for processing text files.


    ## vi and the Twisted Mutants it Spawned


    Eventually the bright idea of hooking up a TV to a computer resulted in the glass
    teletype, After several years of using `ed` to edit their programs, some programmers
    came to a startling conclusion: displaying the text on the screen would be useful
    for editing. Instead of having to remember where everything was in the file, you
    could just look at it on the screen!


    The visual orientation of this editor dictated its name: `vi`.


    Although `vi` was an improvement on `ed`, it is a far cry from today''s modern
    editors. In fact, due to it''s bizarre command structure and weird way of only
    editing one file at a time leave my soul filled with horror. It''s not uncommon
    for new users to be driven completely mad by an attempt to use `vi`.


    Despite its numerous problems, the `vi` editor continues to lurk in its harsh
    ecological niche. It has even spawned a nightmarish array of descendant, including
    `vim`. Like a species of tapeworm, it has even succeeded in parasitically embedding
    itself inside another editor, with `vi` emulation modes.


    Truly is it said: you can''t have "evil" without "vi."


    ## Emacs - The God Particle of Software


    The CERN eggheads are firing up the Large Hadron Collider in their attempt to
    find the so-called God Particle. (does it makes anyone else a little nervous,
    the way they are constantly assuring us that they''re not going to destroy the
    planet?)


    If they were looking for editors instead of particles, the one they would find
    would be `emacs`.


    Widely acclaimed as the best integrated development environment in the history
    of computer programming, `emacs` is a programmers paradise and playground. It''s
    fun, it''s effective, it does everything you can think of, and twice as much that
    never even occurred to you (but is quite useful).


    With `emacs`, pogrammers don''t ever leave editor - all aspects of program development
    are done from the compiler, coding, compiling, debugging, and running. `emacs`
    was the first free software product released by the Free Software Foundation,
    and remains a core part of Linux/GNU. To get started type "emacs" at the command
    prompt, or look for it on your menus.


    `emacs` is extremely adaptable. It has been ported to just about every platform,
    and works over a high-bandwidth connection with `X Window`, or a low-bandwidth
    connection via an ASCII-based interface.


    ## Pico and Nano


    Back in the day, there was a Unix email program called `pine`, and it came with
    an associated editor, `pico`, for composing email. Many became enamored of this
    editor, and started using it for code development. Due to free software license
    restrictions, `pico` eventually became extinct, but it''s direct descendant, `nano`,
    lives on.


    The original `pico` had appeal in the days of very limited hardware. It was better
    than `vi` (which almost everything is), and not as slow as `emacs` used to be
    on days when the computer was busy. But that hasn''t been a problem for about
    25 years, so it''s hard to see why `nano` lives on, yet it certainly does.


    Many new features have been added along the way, of course. Now `nano` boasts
    more features than almost any other editor of the olden days, though by today''s
    bloated standards it is still quite svelte. This is an ASCII-only editor, those
    who need a fancy GUI need to move on to another choice. `nano` has its own web
    page at http://www.nano-editor.org.


    ## The GUI Accessories


    If you are reading this on a Linux box, take a look in the menus, perhaps under
    something like "Accessories," and you will find a text editor. On KDE systems
    this is a program called `kate`, one GNOME systems, `gedit`.


    In the world of commercial desktop computing, the free accessories which come
    with the operating system are minimally functional. After all, they aren''t making
    any extra money on that software, so there''s not much motivation for a commercial
    company to continue to improve and develop them. Linux, as is so often the case,
    is a different kettle of fish entirely. In the Linux world really great programmers
    will continue to develop tools, just for the bragging rights, resume bullets,
    and sense of pride that come with contributing to a free software project.


    Given the usual dynamics of Linux software, it''s not really surprising to find
    that these GUI accessories are full-powered text editors, with some interesting
    features. They can handle multiple files, code syntax highlighting, and spell
    checking. Unlike all of the text editors above, these editors work only with an
    `X Window` connection - they are graphical only.


    `kate` has a web page at http://kate-editor.org/; `gedit`''s web page is at http://www.gnome.org/projects/gedit.


    # Eclipse - A Very Fancy IDE


    Started by IBM in 2001, the open-source `eclipse` editor is an attempt to rebuild
    the IDE from scratch in `Java`. The result is impressive, and certainly equals
    or surpasses the Microsoft IDE, `Visual Studio`, which it much resembles. Although
    the editor itself is written in `Java`, it may be used to code in any language.
    The fact that it''s built in `Java` has no impact on what type of files can be
    edited.


    The `Java` base does have one implication: it is inherently slower than `C/C++`,
    the language used for most other editors. However this is not noticeable on high-end
    developer workstations.


    ## Other Editing Critters


    There are so many other species of text editor in Linux, it''s a real testimony
    to the ecological richness the free software. Some other interesting specimens
    include `jEdit`, a `Java` IDE written in `Java` (http://www.jedit.org/), `NEdit`,
    a Linux clone of Windows text editors (http://www.nedit.org/), Eddie, a clone
    of the Macintosh development IDE (http://www.el34.com/index.html), `Scribes`,
    a very focused text editor that tries to automate things (http://scribes.sourceforge.net/),
    `Diakonos`, which aims to be easier to configure than `emacs`, more powerful than
    `pico` or `nano`, and not as cryptic as `vi` (http://purepistos.net/diakonos).


    So go out there and edit people! Perhaps the software you create will be the next
    great editor.


    ## Who Needs a Fancy-Schmancy HTML Editor?


    My 8-year-old niece asked me a difficult question. Upon being told that I was
    a computer programmer, she asked, "But what do you do all day?"


    I tried to explain it to her, but from her incredulous look, I gathered that she
    didn''t quite believe me.


    ## What Do Programmers Do All Day?


    Programming is mostly about editing text files, and that is as true for the fancy
    graphical Web site as it is for the most boring, old application that doesn''t
    even have a graphical interface.


    That is, instead of pushing pretty buttons, most programmers just type and type
    and type, without once touching the mouse.


    I love movies like Jurassic Park, where they show a fat, sloppy, obnoxious programmer
    with his computer screen in the background. Such scenes look totally fake to me,
    not because I''ve never known fat, sloppy, obnoxious programmers, but because
    the screen in the background had a lot of fancy graphics—even a dancing hula girl
    at one point!


    What geek ever does graphics? When I''m programming, the screen is just white
    text on a black background, and the mouse might as well be disconnected from the
    machine. And nothing ever dances or blinks. It just sits there, a bunch of letters
    on the screen.


    ## Trying to Make Programming Pretty

