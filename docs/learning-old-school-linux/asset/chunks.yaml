- fmt: '

    That is, compiled languages usually are used to developed very focused programs
    that try to do one thing well. Scripting languages are used when you need to coordinate
    the efforts of a bunch of different compiled programs. (This is a loose distinction,
    with many exceptions and gray areas.)


    Newcomers note: Scripting languages are easier to start with!


    # Start Easy with Python


    I think the easiest language for the absolute beginner will be `Python`. It''s
    nice, sensible and fun. In the ''60s, the `BASIC` language was developed to teach
    people how to program, but that wouldn''t have been necessary if `Python` had
    been invented.


    `Python` has a simple and spare syntax, and its fully featured built-in library
    makes it a win for quickly written code that still makes sense to other programmers
    (With most scripting languages, you might as well try to read Martian as to read
    someone else''s code.) Part of this is the unusual use of tabbing and white space
    in loops. Well-written code automatically looks good on the screen or the printout.


    Although `Python` is a great learner''s language, it also has many serious users
    and uses. It''s easy to embed the `Python` interpreter within another application,
    so that very complex apps can use `Python` scripts. It''s also used in some famous
    Web site hosts, such as `You Tube`.


    # Heavy-Duty Scripting with Perl


    Although `Python` is loved by Web programmers, it is `Perl` that runs most of
    the back ends on the Web. `Perl` has been around a long time, and has gone through
    many significant changes in its history.


    `Perl` looks a little more cryptic than `Python`, in part due to the `Perl` motto:
    There''s more than one way to do it. `Perl` programmers can take many different
    approaches to the same goal, depending on how they feel that day. This kind of
    programming whimsy is what makes `Perl` fun, but also a little harder for newbies.


    In both `Python` and `Perl`, object-oriented programming is possible. Object-oriented
    programming is just a way to organize really large programs (thousands of lines
    of code or more). Although it can be used on smaller projects, it doesn''t really
    come into its own unless it has been used to organize a lot of code. In spite
    of the ample object-oriented features of `Python` and `Perl`, most serious object-oriented
    programming is done in `Java`.


    # Object-Oriented Compiled Programs with Java


    Once the scripting world has been explored, it''s time to move into the world
    of compiled code, with `Java`. (Many will argue that `Java` does not really compile
    code—it just pre-interprets some `Java` into pseudo-code, and then interprets
    the pseudo-code. I will not let such arcane objections stop me from classifying
    `Java` as a compiled language!)


    `Java` is the most popular programming language out there. When I scan the job
    Web sites, `Java` is what I see. Also, it is the language of choice for computer
    science courses at universities around the world. `Java` is considered the serious
    contender for object-oriented programming in both academia and industry. It''s
    not just on the desktop, either—many mobile-phone handsets and personal digital
    assistants are programmed in `Java`.


    There are various flavors of `Java` out there, and most Linux boxes will already
    have `Java`. If you don''t have it, get the `Java` installation download from
    Sun Microsystems, the inventor of `Java`.


    # C, the Granddaddy of Them All!


    Only the most hard-core, the most adventurous and the most reckless programmers
    will start with learning `C`, the linga-franca of electronic computing. There
    is literally no platform that does not run `C`. And for many types of programming,
    include some hyper-cool stuff like robots and supercomputers, `C` is the language
    of choice.


    The Linux tool for `C` is the `GNU Compiler Collection`, or `GCC`, and you can
    read more about it in a previous issue of ComputorEdge, in an article called "Development
    Tools: Say Hello to the GNU Compiler Collection."


    # Professional Software Development in Three Easy Steps


    In summary, here are three easy steps to becoming a professional programmer:


    1. Learn interpreted languages `Python` and `Perl`.

    2. Learn compiled languages `Java` and `C`.

    3. Obtain engineering or computer science degree from an accredited four-year
    university.


    Easy, isn''t it?


    # Building Software From Source


    Mostly, when you are getting or upgrading software on your Linux computer, you
    should use whatever package-management system comes with your distribution. My
    distribution includes the `Synaptic Manager` (www.nongnu.org/synaptic).


    ## Why Build From Source?


    Sometimes you need to build from source. Not all software is built for your repositories,
    and sometimes, even with software available in the repository, you need a more
    recent version than the one available, maybe even a beta release of the next version,
    to get a feature or bug-fix that''s important to you.


    For example, on my system, I took a look at the `tar` command. As with all GNU
    utilities, running it with the `--version` option will tell you the version.


    ```

    ~/downloads> tar --version

    tar (GNU tar) 1.16

    ```


    Opening my `Synaptic` package manager, I see that my repository has a slightly
    later version, but still nowhere near the version 1.20 offered as tarballs on
    the `gtar` Web site (www.gnu.org/software/tar). I got one of the tarballs and
    used `tar` to unpack the distribution.


    When you download a package from your package-management software, the executable
    files are downloaded to your machine. They were built by the package maintainer,
    who compiled the original program. When using a package-management system, nothing
    is compiled on your system. All the work is done somewhere else.


    When you build from source, your computer has to do the heavy lifting. But the
    problems are not all on your side of the equation; the software developers face
    a serious problem too.


    ## The Problem of Portability


    One of the great things about Linux is its portability: It runs on every computer
    out there. Linux runs on supercomputers. It also runs on tiny embedded platforms;
    it runs on mobile phones, in laptops, and it is quickly ported to almost every
    new processor developed.


    Back in the very early days of Unix, operating systems were written in assembly
    language and worked on one type of computer. An operating system was specific
    for a hardware platform, and that was that. When someone came up with a new hardware
    platform, they started again from scratch to develop the operating system.


    In the early ''70s, Unix programmers broke the paradigm by rewriting almost all
    of Unix in `C`, a higher-level programming language, and leaving only a core piece
    of assembly language programming. For the first time, an operating system could
    grow and improve as it moved from platform to platform, and developers could be
    confident of a complete, high-quality development environment without having to
    start from scratch each time. All they needed was a `C` compiler, and all of the
    tools that make up the operating system would become available. The rest is history.


    But there are still differences from one machine to another. This is a concern
    when writing software for Linux (or other Unix) platforms. Since the operating
    system can run on such a wide range of platforms, getting software to work well
    can become a real challenge.


    The problem comes from the dozens or hundreds of tiny differences between machines.
    One uses big-endian, the other little-endian storage. One uses 64-bits for addresses;
    another uses 32\. The list is endless and endlessly frustrating. But when new
    hardware is being developed, newness is part of the deal. After all, if a processor
    didn''t do something new, there wouldn''t be much point to developing it in the
    first place.


    How, then, can the poor software package manage to build itself on a new platform,
    when so many things can vary from platform to platform? The answer is the configure
    script.


    ## Ask and You Shall Receive


    The solution adopted by the Unix community is imperfect and not always very elegant,
    but it gets the job done. It is the configure script.

