    jello, it can''t get too high without spreading out over a huge area. It becomes
    a giant, cherry-flavored, quivering blob.


    When done well, the system software is like the Eiffel Tower, tall and straight,
    and occupying a minimum amount of horizontal space.


    In Linux, things are done well, not poorly. That''s why Linux users don''t have
    to upgrade their machines every three years just to keep running the same software.
    And that''s why old Windows boxes can be readily converted into useful Linux machines.


    Whichever way you get to a Linux machine, you will be treated to a wealth of high-quality,
    stable and efficient software. With Linux you can get off the merry-go-round of
    hardware and software upgrades, and get a system that just works—and keeps on
    working.


    How to Make the Switch to Linux


    Across the land, from a host of Windows users, the question echoes from the teeming
    coastal cities to the sweltering central plains: "How the heck do I switch to
    Linux?!?"


    As one who has reached the Promised Land, let me assure you it is worth the journey.
    Linux and Windows both do the same things—but Linux breaks much less often. Linux
    seems to work with you, while Windows seems to be working against you. Windows
    is the evil twin of Linux.


    Switching to Linux can be accomplished in many different ways, ranging from easy
    to pretty challenging. You decide how much time and energy you have to put into
    the process.


    Taking the Easy Way Out


    When I was a young child, my teachers frequently condemned my laziness. "You always
    take the easy way out," they would wail, as if that is somehow a bad thing. (Little
    did they know that my love for the low-hanging fruit is exactly the quality needed
    for effective engineering.)


    With a Windows-to-Linux switch, the easy way out is called Cygwin. Go to the Cygwin
    (www.cygwin.com) Web site and hit the button on the upper-right, which says, "Install
    Cygwin now." This will download a program called setup.exe. Run this program,
    and you will be directed to answer a few questions. (When asked to select a Cygwin
    repository, just make a random choice.)


    If you play around with setup, you will see that there is a huge list of available
    software, with some items already selected. The selected items are the minimum
    Cygwin installation, and you should just accept them and let setup install them
    for you. If you have only a dial-up connection, you will have to leave the machine
    connected for quite a while for this.'
