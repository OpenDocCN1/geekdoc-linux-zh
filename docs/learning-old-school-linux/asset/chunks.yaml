    或许那时，受回馈某种需求的感召，并确信你独特的免费软件收藏具有价值，你将会制作并发布你自己的发行版！


    # 系统管理


    一旦用户安装了 `Linux` 系统，他或她就会面临系统管理任务。虽然大多是琐碎的杂务，但由于 `Linux` 工具的高度发达，仍有很多知识需要学习。虽然有许多方便的功能，但仍然需要一些引导。


    ## 以 Linux 的方式备份：坚持使用 `tar`


    这是计算机领域最古老的传说之一，从电子计算的石器时代流传：始终备份你的文件！


    有时候老方法就是最好的方法。在我计算机生涯的第一天（一直追溯到上个世纪），我听过一个说明备份重要性的恐怖故事。


    ### 回到远古时代


    当时我正开始为两位大气科学家工作，他们拥有一件非常稀有的东西：自己的电脑。那是一台小型计算机（大小仅相当于我妻的型面包车），需要一个拥有独立电源系统、空调设备以及那种由坚固瓷砖组成的机房地板的房间——任何一块瓷砖都可以掀起，以进入地板下方复杂的电缆网络。


    它的性能大约与我现在的笔记本电脑相当，只是没有图形用户界面。对于拥有巨型大气模型的气象学家来说，这可以称之为“个人计算机”。


    在正面安装了两个磁带驱动器，机房的一面墙挂着一排又一排标签整齐的磁带。这些磁带机已经不再生产了，但它们曾装点在每台严肃计算机的正面。


    那些计算机磁带机在 60 年代看起来非常高科技，但使用起来非常费力。磁带必须穿过读头并绕在卷轴上。随着磁带的写入，它会传回起始卷轴。由于它们存储的数据并不多（按现代标准来看），将数据集分散在多个磁带上是很常的。


    ### 噢，太恐怖了！


    在实验室的第一天，我看到一位科学家正在向机器加载和卸载磁带。他将磁盘备份到磁带上，而且他每天都这样做，尽管这几乎需要一个小时，而且他总是很赶。


    当我问他为什么不让实验室的一个学生来做这项杂务时，他讲述了他的悲惨：一个被分配到这项任务的研究生每天都早来执行备份。这个研究生在某个冬天早晨被温暖的床诱惑翘了一天，结果没有发生任何意外后果，甚至没有引起那些睡懒的同事的注意，他们认为备份已如常进行。例外变成了常态，很快地，这个懒惰的研究生整整三个月没有进行过备份——这一事实在磁盘崩溃时被发现，导致整个实验室三个月的工作被清空。


    这位科学家是一个有点严厉的人物——不是那种我想惹去的人。他眼中冰冷的光芒让我为那个可怜的研究生的感到感到。他忘记了计算机的第一准则：始终备份你的文件。


    ## 现代时代


    如今，磁盘更可靠了。我从未经历过现代磁盘驱动器的机械故障，尽管据说这确实会发生。今天数据最大的风险似乎是意外删除。


    虽然磁盘相当可靠，但软件工程师并不总是如此。错误总会发生，当数据被误删时，良好的备份习惯可以救急——也许还能救回你的工作。


    有很多不同的程序可以帮助你备份数据，但很难超越老经典磁带存档程序 `tar` 的无处不在和简单。`tar` 陪伴我们如此久，以至于磁带已经从公式中消失了，现在的大多数家庭备份似乎是从一个磁盘到另一个磁盘（甚至是存到那些新奇的数据优盘上），而不是到磁带。然而，`tar`
    仍然能完成任务。


    ### 把我打包起来吧，斯托蒂


    `tar` 背后的简单想法是你为你提供一个包含许多文件和子目录的目录，`tar` 将将它们所有打包成一个文件，即“tar 文件”（通常扩展名为 `.tar`）。tar
    文件本身的格式非常简单——它没有尝试对数据进行压缩。由于这个原因，它经常通过压缩程序（如 `gzip`）运行，产生一个小得多的压缩 tar 文件，即“tar
    包（tarball）”。


    tar 包可以保存到另一块磁盘，也许在另一台机器上。这确保了如果原始数据被删除或销毁，可以通过解压 tar 包并再次运行 `tar` 程序来恢复文件，它会将文件解包到原始目录中，所有内容保持完好无损。


    市上有许多版本的 `tar` 程序。`Linux` 用户拥有 `GNU tar`，这是最好的程序之一。它不仅符合所有的 `tar` 标准，还包含了命令行选项，允许进行实时压缩，而无需单独调用
    `gzip` 工具。


    ### 浪费时间


    虽然故事中的科学家始终坚持每天运行自己的备份，但我确实通过向他展示如何进行增量备份，为他节省了一些时间。


    增量备份解决了备份未更改文件的问题。由于大多数文件每天都不会改变，因此没有必要每天都备份它们。但可怜的用户如何轻松地确定哪些文件需要备份，而不会犯遗漏重要文件的悲性错误呢？


    使用 `GNU tar`，增量备份功能可以为你处理这个问题。这意味着你每隔一段合理的间隔（例如每周）进行一次完整备份，然后每天进行一次增量备份。增量备份将仅包含自上次完整备份以来更改的文件。要恢复文件，你需要先恢复完整备份，然后恢复增量备份。


    # 谁在保护你的数据？


    我们正把越来越多的重要数据放在电子设备上，但我们是否也比以前更加关注数据的安全？


    在远古时代


    我大学的计算机工作之一是对当时被称为微型计算机的设备进行备份。这些设备介于当时玩具般的微型计算机和同样像玩具（但价格要贵得多）的大型机之间。

    '
- fmt: '

    The mini-computer looked like a mainframe - a bunch of refrigerator-sized chassis
    in the refrigerator-temperature computer room. (It was always lovely to go in
    there on a hot summer day!) To back it up I had to load reels of magentic tape
    on to the front of the machine, enter a command at the console, and go back to
    doing my math homework while the computer wrote data to tape after tape.


    The consequences of a mistake could be severe - I was hired for the job after
    the previous incumbent was ignominiously fired. The disk failed, and it was found
    that he had not been making proper back-ups for weeks. As a result, weeks of scientific
    work had been lost.


    ## Sometimes the Old Ways are the Good Ways


    In the years since then, computational hardware has advanced at a dizzying pace.
    The giant set of disks (which I spent so much time backing up) were a massive
    300 MB. Today I have a half-dozen data sticks much larger than that, just kicking
    around my desktop and briefcases. They give them away at conferences and trade
    shows.


    But the need for back-ups has not changed, because people have not changed. Our
    hardware is more reliable, but we are not. One of the largest causes of lost data
    is human error. Someone deletes something that they shouldn’t. And even our vastly
    increased hardware reliablity is not going to compensate for the fact that we
    now carry our computers everywhere.


    My old mini-computer had disks that would crash if you looked at them the wrong
    way. My most recent computer, Yum-yum the EEE net-book, doesn’t even have a disk
    drive - its all flash memory. I can drop it on concrete and it would still work.
    But unlike my old mini-computer, which sat in a secure building, Yum-yum comes
    with me everywhere. It’s less likely to break, but far more likely to get lost
    or stolen.


    Backing up my data is more important than ever - but I have even less time available
    than that harried student I was in my youth. How can I have the back-ups without
    the tedium? As with so many questions these days, the answer is the Internet.


    ## Sometimes the New Ways are Better Ways


    These days, we don’t back up to tape any more. We demand near-instant retrieval
    of our backed up data, which is hard for tape systems to manage. We also benefit
    from super-cheap, super-dense disk technology. It’s easier and cheaper to back
    up data to a disk server than it is to back it up on tape.


    Most of use, though, don’t have any disk servers running in our garage, and this
    is where the Internet comes in. Why should I run a disk server when there are
    so many people out there who can do so more reliably than I can? And most of us
    need to back up only a trifling about of data anyway. Disk servers are most economical
    in the terabyte range, and I would be lucky to have a gigabyte of data to back
    up, a mere one-thousandth of the capacity of even the lamest disk server.


    Hence the rise of companies like Mozy, the on-line backup people. For about five
    dollars a month, you can have your PC backed up over the Internet, on to Mozy
    servers. If you ever need any of your old files, they will be right there for
    you. Businesses have to pay more, but, if your business is data-centric, the cost
    is trivial compared to the benefits. Your data are backed up remotely, and safely,
    with very little investment of your time.


    ## What You Must Still Do


    Although you don’t have to sit in front of tape drives waiting, there is still
    one task that you must pay attention to: specifying what to back up.


    Most of the stuff on your hard drive is not worth backing up, because most of
    it is software, installed from disk or over the network with complex installations
    programs. These days, software is rarely just a single executable file. Backing
    up these files makes no sense, since you usually cannot restore them in a useful
    way. When these programs get messed up, you reinstall from the disk or over the
    network, the same way you originally installed the program.


    The only files that need to be backed up are the personal files that you have
    added to the computer: your documents, pictures, music and videos. In the `Windows`
    world, these are all usually kept under a folder called `“My Documents”`. In the
    `Linux` world, these will be under your home directory.


    When setting up a backup, make sure that all the data you want to back up can
    be written to some directory under `My Documents`, and, if not, make sure that
    you add the appropriate directory to the list of what is backed up.


    ## Cheap, or Just Frugal?


    For those of us that don’t have a data-centric business, but only the usual data-centric
    lives, is there a solution that is even cheaper? Of course there is, and it is
    called Google.


    My data-centric life has involved many a lost computer file, and much wailing
    and gnashing of teeth as a result. When `Google docs` came out I saw the immediate
    benefit of having someone else manage all my data files. For me, `Google` has
    it all.


    These days, `Google` will even let you store any old data file on their servers,
    up to a gigabyte for free. Well, that’s very nice of them. By using `Google docs`
    for spreadsheets, word processing, and presentations, using the `Google Picasa`
    and `You Tube` for photos and videos, and the extra `Google` gigabyte for everything
    else, the enterprising computer user can get very nice on-line backups for free!


    ## Privacy? Who Cares!


    This solution sacrifices all notions of privacy to Google. Can they make any use
    of all these documents? I really don’t know - but I note that they are very good
    at extracting information from large numbers of documents. Mostly what Google
    will find my documents, none of which involve secret. If I did care more about
    privacy, I could encrypt my data before sending it to `Google`, and be reasonably
    confident that no one outside the `National Security Agency` could read it. And
    if anyone at `Google` is reading this, how about some storage? One gigabyte isn’t
    much!


    ## Staying on Top of Things


    There is always the waiting. It is always there, always part of the computer experience.
    From the time that you wait for your computer to boot up until the time you wait
    for it to shut down, using a computer involves a lot of waiting.


    If you''ve got a decent system (which means it''s probably running `Linux`), and
    aren''t doing anything too demanding, these waits might be impossible to notice.
    They may last no longer than the blink of an eye.


    But if you are on a system with little less power—perhaps a beloved ultra-portable—then
    you may wait a bit longer, a bit more often. And if you are a little more demanding,
    if you run a few compiler jobs, are editing 50 buffers with `Emacs` and have two
    dozen tabs open in `Firefox`, well, you too might start to notice the waiting.


    ### What the Heck Is Going On?


    Sometimes it''s pretty obvious what you are waiting for, and sometimes it''s not
    at all clear. Sometimes you can do something about it, and sometimes you really
    can''t. The first step is to try and see what is going on—what exactly are you
    waiting for?


    The best way to do that is with a program called `top`—just open a terminal and
    let it run.


    ```

    The top program will take the whole window and will update itself every three
    seconds. When you are done with top, hit the q key to end it.

    ```


    ### The Summary Section


    The top five lines of output show a summary of what is going on with the system.
    The number of users logged on is usually one for most `Linux` systems, but remember
    that `Linux` also runs on vast multi-user machines, and `top` must be able to
    cope with that. The load average is an arcane way of measuring how many things
    are waiting on the CPU for the last five, 10 and 15 minutes. Interpreting these
    numbers is something I leave for the experts.

    '
  raw: 'The mini-computer looked like a mainframe - a bunch of refrigerator-sized
    chassis in the refrigerator-temperature computer room. (It was always lovely to
    go in there on a hot summer day!) To back it up I had to load reels of magentic
    tape on to the front of the machine, enter a command at the console, and go back
    to doing my math homework while the computer wrote data to tape after tape.


    The consequences of a mistake could be severe - I was hired for the job after
    the previous incumbent was ignominiously fired. The disk failed, and it was found
    that he had not been making proper back-ups for weeks. As a result, weeks of scientific
    work had been lost.


    Sometimes the Old Ways are the Good Ways


    In the years since then, computational hardware has advanced at a dizzying pace.
    The giant set of disks (which I spent so much time backing up) were a massive
    300 MB. Today I have a half-dozen data sticks much larger than that, just kicking
    around my desktop and briefcases. They give them away at conferences and trade
    shows.


    But the need for back-ups has not changed, because people have not changed. Our
    hardware is more reliable, but we are not. One of the largest causes of lost data
    is human error. Someone deletes something that they shouldn’t. And even our vastly
    increased hardware reliablity is not going to compensate for the fact that we
    now carry our computers everywhere.


    My old mini-computer had disks that would crash if you looked at them the wrong
    way. My most recent computer, Yum-yum the EEE net-book, doesn’t even have a disk
    drive - its all flash memory. I can drop it on concrete and it would still work.
    But unlike my old mini-computer, which sat in a secure building, Yum-yum comes
    with me everywhere. It’s less likely to break, but far more likely to get lost
    or stolen.


    Backing up my data is more important than ever - but I have even less time available
    than that harried student I was in my youth. How can I have the back-ups without
    the tedium? As with so many questions these days, the answer is the Internet.


    Sometimes the New Ways are Better Ways


    These days, we don’t back up to tape any more. We demand near-instant retrieval
    of our backed up data, which is hard for tape systems to manage. We also benefit
    from super-cheap, super-dense disk technology. It’s easier and cheaper to back
    up data to a disk server than it is to back it up on tape.


    Most of use, though, don’t have any disk servers running in our garage, and this
    is where the Internet comes in. Why should I run a disk server when there are
    so many people out there who can do so more reliably than I can? And most of us
    need to back up only a trifling about of data anyway. Disk servers are most economical
    in the terabyte range, and I would be lucky to have a gigabyte of data to back
    up, a mere one-thousandth of the capacity of even the lamest disk server.


    Hence the rise of companies like Mozy, the on-line backup people. For about five
    dollars a month, you can have your PC backed up over the Internet, on to Mozy
    servers. If you ever need any of your old files, they will be right there for
    you. Businesses have to pay more, but, if your business is data-centric, the cost
    is trivial compared to the benefits. Your data are backed up remotely, and safely,
    with very little investment of your time.


    What You Must Still Do


    Although you don’t have to sit in front of tape drives waiting, there is still
    one task that you must pay attention to: specifying what to back up.


    Most of the stuff on your hard drive is not worth backing up, because most of
    it is software, installed from disk or over the network with complex installations
    programs. These days, software is rarely just a single executable file. Backing
    up these files makes no sense, since you usually cannot restore them in a useful
    way. When these programs get messed up, you reinstall from the disk or over the
    network, the same way you originally installed the program.


    The only files that need to be backed up are the personal files that you have
    added to the computer: your documents, pictures, music and videos. In the Windows
    world, these are all usually kept under a folder called “My Documents”. In the
    Linux world, these will be under your home directory.


    When setting up a backup, make sure that all the data you want to back up can
    be written to some directory under My Documents, and, if not, make sure that you
    add the appropriate directory to the list of what is backed up.


    Cheap, or Just Frugal?


    For those of us that don’t have a data-centric business, but only the usual data-centric
    lives, is there a solution that is even cheaper? Of course there is, and it is
    called Google.


    My data-centric life has involved many a lost computer file, and much wailing
    and gnashing of teeth as a result. When Google docs came out I saw the immediate
    benefit of having someone else manage all my data files. For me, Google has it
    all.


    These days, Google will even let you store any old data file on their servers,
    up to a gigabyte for free. Well, that’s very nice of them. By using Google docs
    for spreadsheets, word processing, and presentations, using the Google Picasa
    and You Tube for photos and videos, and the extra Google gigabyte for everything
    else, the enterprising computer user can get very nice on-line backups for free!


    Privacy? Who Cares!


    This solution sacrifices all notions of privacy to Google. Can they make any use
    of all these documents? I really don’t know - but I note that they are very good
    at extracting information from large numbers of documents.


    In my case, I can’t see that it matters. Mostly what Google will find, looking
    at my large collection of on-line documents, will be a lot of articles for ComputerEdge.
    Since they are intended for publication anyway, I really don’t mind of Google
    looks at them. Or, for that matter, my work documents, none of which involve anything
    secret.


    If I did care more about my privacy, I could encrypt my data before sending it
    to Google, and be reasonably confident that no one outside the National Security
    Agency could read it. And if anyone at Google is reading this, how about some
    more storage? One gigabyte isn’t much!


    Staying on Top of Things


    There is always the waiting. It is always there, always part of the computer experience.
    From the time that you wait for your computer to boot up until the time you wait
    for it to shut down, using a computer involves a lot of waiting.


    If you''ve got a decent system (which means it''s probably running Linux), and
    aren''t doing anything too demanding, these waits might be almost impossible to
    notice. They may last no longer than the blink of an eye.


    But if you are on a system with a little less power—perhaps a beloved ultra-portable—then
    you may wait a bit longer, a bit more often. And if you are a little more demanding,
    if you run a few compiler jobs, are editing 50 buffers with Emacs and have two
    dozen tabs open in Firefox, well, you too might start to notice the waiting.


    What the Heck Is Going On?


    Sometimes it''s pretty obvious what you are waiting for, and sometimes it''s not
    at all clear. Sometimes you can do something about it, and sometimes you really
    can''t. The first step is to try and see what is going on—what exactly are you
    waiting for?


    The best way to do that is with a program called top—just open a terminal and
    let it run.


    The top program will take the whole window and will update itself every three
    seconds. When you are done with top, hit the q key to end it.


    The Summary Section


    The top five lines of output show a summary of what is going on with the system.
    The number of users logged on is usually one for most Linux systems, but remember
    that Linux also runs on vast multi-user machines, and top must be able to cope
    with that. The load average is an arcane way of measuring how many things are
    waiting on the CPU for the last five, 10 and 15 minutes. Interpreting these numbers
    is something I leave for the experts.'
