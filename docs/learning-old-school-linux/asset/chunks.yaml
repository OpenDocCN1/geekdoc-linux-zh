- fmt: '

    Another great feature of the OpenOffice word processor is its ubiquity. It''s
    available (always free) on just about every computing platform out there: Linux,
    Macintosh and even Windows. It works the same on all platforms, so that you don''t
    even notice what kind of machine you are using.


    ## Some Cool Stuff


    One of the reasons I so enjoy writing about Linux is that it allows me to learn
    so many interesting things about software that I work with almost every day. Like
    most word processor users, I use a small subset of all the fancy bells and whistles
    that come with the software. Naturally, OpenOffice Writer offers automatic spell
    checking and a thesaurus (a.k.a. synonym finder, wordbook, in case you were wondering).
    It has a presumptuous (but often annoyingly accurate) auto-correct feature. It
    has a built-in media player, so that you can embed media into your documents.
    It can handle tables, frames, outlines and bullets in a million different ways.
    It can keep track of bibliographies and mailing lists. And all that without the
    free extension packs you can find on the Web!


    ## Breaking a Bad Habit


    When I show Windows users the software available on Linux, I am often asked, in
    amazement, "If all this free software is just as good, then why does anyone pay
    Microsoft?" I usually point out that the free software is frequently much better
    in quality and usefulness than proprietary software, and that lots of people don''t
    pay a penny to Microsoft. But I still end up getting suspicious looks. I get the
    feeling that they think I am trying to pull something on them. After all, would
    all those Microsoft users really be paying all that cash if they didn''t have
    to?


    People get into bad habits, and it can be hard to change. Maybe I should market
    some kind of skin patch for people trying to give up Microsoft. If you prepare
    any documents on your computer, then check out OpenOffice Writer and start to
    kick the habit.


    ## Getting Down to Business


    The entire personal computer market was built on the spreadsheet.


    Back when the original IBM PC was released, the big question was: Why would anyone
    want a personal computer?


    It sounds like a crazy question now, but other than the hardcore geek market,
    what reason was there for building a tiny computer for just one person? The only
    people who could use a computer for anything useful were the computer geeks who
    worked on the Big Iron, the mainframe computer. They despised the emerging world
    of the personal computer. The early personal computer market was for hobbyists,
    not serious users.


    Then a program called VisiCalc was released, and the spreadsheet was born. Businesses
    suddenly discovered the power of small computers, and the rest is history.


    ## One of the Great Inventions of the Renaissance


    Back in the last millennium, people like Galileo and Thomas Jefferson were wandering
    around, causing important dates to occur so that future schoolchildren would have
    something to memorize. Businesses were doing something called double-entry bookkeeping
    by hand to keep track of their money.


    Here''s how it worked: You kept a big book, called a journal, which had a bunch
    of specially lined sheets of paper. There were horizontal lines, each representing
    one expense. There were also a bunch of vertical columns, about 10 or 12. There
    was one for rent, one for supplies, one for payroll, and others for whatever else
    the common expenses of the business were (including the catch-all "misc" column).


    Every time any money was spent, the amount was recorded twice, once next to the
    comment about the expense and once in the appropriate column for that expense—hence
    the term "double-entry."


    When the journal page was full, each column was totaled, and the totals for all
    categories of expenses had to match the total expenses for that page. If the two
    numbers were not the same, then you made an arithmetic mistake, and you had to
    keep redoing your math until you found it.


    The double-entry bookkeeping system, developed in Renaissance Italy, is what allowed
    modern business to develop and flourish. It was so successful that it was used
    by every business in the Western world, right up until the invention of the spreadsheet.


    In fact, before I discovered how much easier it is to earn cash by computer programming,
    I worked as a bookkeeper for a bakery in Philadelphia. Each week I would go in
    and pay the bills, writing checks to the suppliers of flour, fruit and sugar.
    I would pay the rent, the insurance and the payroll.


    Each number was duly recorded in the journal in two places. Each filled page was
    cross-totaled, and the numbers checked again and again (and sometimes, again and
    again) before everything added up correctly and the owner knew exactly what was
    spent. But what a pain!


    Even though I was being paid a pretty good hourly wage for the bookkeeping, I
    always groaned when the cross-totals didn''t match. It meant at least a half hour
    of repeating all the calculations on that page until the mistake was found. It
    was tedious, it was painstaking, and it was not nearly as fun as hanging out with
    my buddies and girlfriends—not even as fun as doing my usual engineering homework.
    It was drudgery, pure and simple. And the more you hated math, the worse it was.
    Some business owners hated math so much that they hired people who liked it just
    to do the bookkeeping. Other business owners just suffered. Even those who enjoyed
    math (as I do) found bookkeeping to be boring.


    ## Computers to the Rescue


    There are lots of things computers are not good at. They can''t hold a conversation,
    cook a good meal, or appreciate a great work of art. But computers are good at
    adding. And they are good at drudgery. They never get bored and make a mistake.
    All of these things make them great bookkeepers. But getting the computer to do
    what you want is not always easy for the non-specialist.


    With the invention of the spreadsheet, a tool was created that didn''t require
    special engineering talent. Any business owner can immediately understand it,
    since it is so similar to the double-entry bookkeeping. The spreadsheet makes
    the business obsolete. With a spreadsheet, you don''t even need double-entries.
    Just enter it once, and trust the computer to do the addition correctly. (But
    don''t worry about the poor bookkeeper losing his job. You don''t have to be smarter
    than a computer to survive, just smarter than the person who owns the computer.
    And every business owner who doesn''t have to pay a bookkeeper still has to pay
    for someone to operate the computer. But they pay less, and it gets done quicker,
    and so everyone is happier.)


    ## Linux Left Out?


    In the early days there was VisiCalc, but it was a program called Lotus 123 that
    created the massive spreadsheet market, which still thrives to this day. In the
    early days Linux spreadsheets were lacking, and it was one of the few areas in
    which Windows users could claim superiority. But, as it always does in the end,
    free software caught up with multiple spreadsheet projects.


    ## Gnumeric vs. Open Office


    These days, there are two very good Linux spreadsheet programs: Open Office Calc
    (`www.openoffice.org`) and Gnumeric (`www.gnome.org/projects/gnumeric`).


    Open Office is a complete knock-off of Microsoft Office. It includes a word processor,
    a presentation manager, a database front end and a spreadsheet.


    The spreadsheet is a clone of Excel, and only the most advanced users would be
    able to spot a difference between them. Although the Open Office applications
    have their own formats for their files, they can also use the Microsoft formats,
    making them drop-in replacements for the Microsoft applications. Someone using
    Open Office can create and edit files in Microsoft formats, and Microsoft-using
    friends and co-workers need never know that you are not sending money to Bill
    Gates to do your spreadsheets.

