    唯一的问题是，正如快速阅读者可能已经察觉到的样，他们的键盘上没有“meta”键。这个键曾存在于开发 emacs 的早期 ASCII 终端上，但它并没有流行起来，因此现在没有带
    meta 键的键盘了。


    没关系；在 emacs 中总有办法。在大多数计算机上，"Alt" 键将用作 `emacs` 的 meta 键使用，因此通过按住 `Alt` 键并按下“x”即可实现
    `M-x`。如果 `Alt` 键不起作用，你可以使用转义键（`Esc`），但方法略有不同。不是按住 `Esc` 再按 `x`，而是先按 `Esc`，然后再按
    `x`。


    ## 程序员的终极利器


    现在，程序员为什么要忍受这些关于 meta 和控制键的麻烦呢？`emacs` 提供了哪些功能让它值得这些精力？功能多到列不完。


    首先是编辑模式。如果你在 `emacs` 中打开一个名为 `program.c` 的文件，你将进入所谓的 `C-mode`。这为你提供了各种用于 `C` 语言编程的命令，并开启了适用于
    `C` 代码的格式化。如果你打开 `program.f`，你将获得 Fortran 模式。如果你打开 `program.java`，你将获得 Java 模式，以此类推。几乎每种现有编程语言都有对应的模式。这里很神奇：相同的命令对所有语言都有效。


    例如，`M-x comment-region` 命令可以将一段代码区域转换为注释，尽管每种语言使用不同的字符作为注释。`M-x indent-region`
    命令会让无论你正在编写何种编程语言的一组代码具有良好的缩进。还有非常非常多的功能。


    ## 开启高效编程之旅


    `emacs` 的入门可能会有点困惑。它是一件真正的威力工具，需要投入一些精力和努力才能正确使用。但试一试吧——你不会后悔的！


    ## 使用 Shell


    在图形用户界面出现之前的，命令行 shell 是我们与计算机交互的方式。在 Windows 上，命令行 shell 已被降为 DOS 命令窗口，但在 Linux
    上，shell 仍然活跃良好。由于命令行的强大、易用和灵活性，许多高级用户更倾向于 shell 交互而非 GUI。


    ### 走出你的 Shell


    Linux 的伟大之处之一是你可以与软件交互的多种方式。在某些操作系统中（我这里不指具体的某人！），完成工作只有一种方法。虽然有效，但无趣。在 Linux
    上，情况绝非如此简单，而且总是更有趣。


    上周，我描述了 Linux 用户可以享受的一些不同的图形用户界面，但 Linux 的图形只是更基础的命令行界面之上的一个层。


    ### 什么是命令行界面？


    命令行界面早于当今拥有华丽图形的现代世界，它源于古老的年代——那个时代男人还是真汉子，计算机有微型巴士那么大。在当时，所谓的“智能”终端非常流行，因为它们可以实现如此惊人的视觉效果，如闪烁的文本、不同颜色的文本甚至加粗文本。那个时代的程序员与硬件非常接近。他们经常使用硬件制造商提供的规格，而且每种类型的机器都有自己独特的操作系统。


    回到 20 世纪 70 年代，一位名叫 Ken Thompson 的程序员正在开发一种新的操作系统——这个系统第一次不是为任何特定的计算硬件编写的，而是通用的，以便可以在任何硬件上运行。打个比方，Ken
    将硬件系统想象为蛋黄，将系统软件想象为蛋蛋白，但还需要其他东西——在蛋和用户之间的某种东西。某种包裹整个系统所有功能，并成为用户需要触摸的一切的东西。那个东西就是
    shell。1971 年，Ken Thompson 发布了他的同名 shell 的第一个版本，而 Thompson shell 是所有后续 UNIX 命令行界面的基础。


    ### 管道与重定向：UNIX 系统的水水工程


    shell 必须做的一件事是允许用户在机器上运行程序。事实上，这是 shell 的主要目的。如果你有一个名为 `trek` 的程序，用户必须能够在某处输入
    `trek` 来启动该程序——在这种情况下，这是一个经典的《星际迷航》游戏。


    但 Thompson shell 做的远于此。它允许用户将文件发送到命令中，就像文件中的所有行都是在键盘上输入的一样。它允许将命令的输出保存或追加到文件中。它允许将一个命令的输出成为另一个命令的输入。


    有了这些功能，shell 变成了一个组合复杂命令序列的强大工具。简单的工具通过复杂的组合，可以进行复杂的数据处理。这是 UNIX 操作系统成功的基础。


    ### 会会家族


    在 UNIX 世界中，有两种命令行界面家族，都源于原始的 Thompson shell。一种被称为 Bourne shell (`sh`)，另一种是 C shell
    (`csh`)。从这两个早期 shell 开始，构建出了一整片自由软件的珊瑚礁，并且存在许多改进了这两个 shell 的变体。现在的一些选择包括 TENEX
    C shell (`tcsh`)、Bourne Again shell (`bash`)、Korn shell (`ksh`) 和 Z-shell (`zsh`)。这些
    shell 变体中的每种都提供自己的一套功能，以及自己的帮助用户自动化常用任务并串联不同任务的方法。


    尽管有这些替代方案，仍然有一些固执的人出于对过去的固执致敬而坚持使用原始 shell。我们都可以尊重过去，但这并不意味着我们要戴着假发和三角帽。过去已经得到了改进，shell
    也是如此。（我自己也是 bash 的拥趸。）


    ## 现在你开始说我的语言了！


    在输入了一系列复杂的命令后，你渴望一种能够自动化这些重复工作的方法。这自然而然导致需要一种泛化并向命令传递参数的方法，以便适应各种情况。


    在 Thompson shell 之后的 shell 开始引入过程化语言的特征——变量、分支和循环。变量是存储可以改变值的命名内存区域。分支是 if-then
    决策。如果某些条件为真，则执行某些代码；否则执行不同的代码。循环是根据需要重复代码的方式。


    有了变量、分支和循环，过程化编程变得可能。这允许程序员编码让计算机在各种情况下执行“正确事情”的方法。


    已经有很多 shell 编程的示例，许多现有系统部分基于复杂的 shell 脚本编程。专业程序员更倾向于使用功能更丰富的语言（如 `Java`）编写真正复杂的程序，或者使用更高效利用计算机以获得性能的语言（如
    `C`）。但任何编程任务也可以通过各种 shell 语言完成，有时这样做更快、更方便。


    用于 shell 的程序通常被称为脚本，而 shell 脚本可以迅速成为计算机高级用户不可或缺的工具。


    DOS Shell：一个仓促制作的玩具


