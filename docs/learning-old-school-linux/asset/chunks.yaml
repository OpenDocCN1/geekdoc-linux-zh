    The Ways of Genius


    It''s customary for geniuses to be eccentric, and Stallman is no exception. He
    has numerous quirks and causes, many of which can be found on his personal Web
    page (www.stallman.org).


    Other programmers report that Stallman is extremely difficult to work with. He
    has been called a "control-freak" who doesn''t play well with others.


    Although his reputation for eccentricity may be well-deserved, it does not detract
    from his accomplishments and contributions to the field of software engineering.
    As one of the most famous programmers alive today, he is entitled to his quirks.


    Is Stallman a genius or a nutcase? Perhaps both. But he has changed the world
    forever.


    # Hang ''Em High With TeX


    In 1962, the Beatles released their first record, and a young computer scientist
    name Donald Knuth started the first in a series of books called The Art of Computer
    Programming.


    Knuth''s books had an impact that was immediate and widespread. They became some
    of the most important texts on computer science, and they often took a rigorous
    approach to describing computer algorithms with mathematical formulas.


    What Knuth originally intended to be one book has expanded into at least four,
    and the series continues, 45 years later. Volume two was released in 1969, volume
    three in 1973, and the first installment of volume four in 2005.


    Knuth labors on at Stanford University, and the entire computer science community
    eagerly awaits his releases of new material. He''s a sort of J. K. Rowling of
    the computer science world. But this article is not about Knuth''s famous books,
    but rather about something that happened to Knuth along the way.


    An Historical Inconvenience


    In 1976, when Ford was president and the Viking 2 spacecraft landed on Mars, Knuth
    was trying to get out a new edition of volume two of The Art of Computer Programming.


    At the time, most word processing was done with paper and pencil, or, for the
    more advanced, typewriters. If a document needed to be created for distribution,
    it was done so by a specialist typing these manuscripts into a typesetting machine,
    a giant computer system about the size of a small car, which cost thousands of
    dollars a month for the organization to maintain.


    The typesetter would type in the manuscript and then print the output, called
    the proofs, and take it back to the author of the document. The author would then
    edit the document (by writing on it with a pen), giving the changes back to the
    typesetter, who would then type them back into the typesetting system.


    Naturally, this took time, and mistakes crept into the process. It was a painful
    process.


    When he planned his reprint, Knuth was horrified to learn that the typesetter
    used for volume two was no longer around. It had been a proprietary system, as
    were all typesetting systems, and the company had folded, leaving Knuth with the
    prospect of redoing the whole process again.


    He was frustrated.


