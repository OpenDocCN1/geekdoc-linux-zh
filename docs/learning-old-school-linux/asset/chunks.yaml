  trans: '


    也就是说，编译型语言通常用于开发非常集中的程序，力求做好某件事。而脚本语言则用于你需要协调一组不同编译型程序的工作时的场景。（这是一个宽泛的区别，有许多例外和灰色地带。）


    初学者注意：脚本语言更容易入门！


    # 从 Python 开始轻松入门


    我认为对于绝对初学者来说，最简单的语言会是 `Python`。它优美、合理且有趣。在 20 世纪 60 年代开发 `BASIC` 语言是为了教人们如何编程，但如果当时发明了
    `Python`，那就不需要了。


    `Python` 拥有简洁精炼的语法，其功能完备的内置库使其成为快速编写的胜者，而且这些代码对其他程序员来说依然易读（对于大多数脚本语言，你读他人的代码可能就像在读火星语一样困难）。这部分原因源于在循环中对缩进和空格的非常规用法。编写得良好的代码在屏幕或打印输出上看起来都很漂亮。


    尽管 `Python` 是一门很优秀的学习语言，但它也有许多严肃的用户和用途。很容易将 `Python` 解释器嵌入到另一个应用程序中，这样非常复杂的应用就可以使用
    `Python` 脚本。它也被用于一些著名的网站托管平台，例如 `You Tube`。


    # 使用 Perl 进行重型脚本编程


    尽管 `Python` 受 Web 程序员喜爱，但运行大多数 Web 后端的是 `Perl`。`Perl` 已经存在很久了，在其历史上经历过许多重大变化。


    `Perl` 看起来比 `Python` 稍微晦涩一些，部分原因由于 `Perl` 的格言：条条皆异。`Perl` 程序员可以根据他们当天的心情对同一个目标采取许多不同的方法。这种编程的随性让
    `Perl` 变得有趣，但也让新手感到稍微有些困难。


    在 `Python` 和 `Perl` 中，都可以面向对象编程。面向对象编程只是组织极其大型程序（数千行代码或更多）的一种方法。尽管它可以用于较小的项目，但除非被用于组织大量的代码，否则它并不能真正发挥作用。尽管
    `Python` 和 `Perl` 拥有丰富的面向对象特性，但大多数严肃的面向对象编程都是用 `Java` 完成的。


    # 使用 Java 构建面向对象的编译型程序


    一旦探索了脚本世界，就是时候进入 `Java` 的编译代码世界了。（许多人会争论 `Java` 并不真正编译代码——它只是将某些 `Java` 预解释为伪代码，然后解释这些伪代码。我不会让这种奇诡深奥的反对意见阻止我将
    `Java` 分类为编译型语言！）


    `Java` 是目前最流行的编程语言。当我浏览职位招聘网站时，我看到的是 `Java`。此外，它也是全球大学计算机科学课程的首选语言。`Java` 被认为是学术界和工业界面向对象编程的强力竞争者。它不仅存在于桌面端——许多手机终端和个人数字助手都是用
    `Java` 编写的。


    市面上有各种版本的 `Java`，大多数 Linux 机器已经安装了 `Java`。如果你还没有，可以从 `Java` 的发明者 Sun Microsystems
    网站下载 `Java` 安装包。


    # C，万祖之师！


    只有最硬核、最冒险和最不畏风险的程序员才会从学习 `C` 开始，它是电子计算的通用语言。字面上没有任何不运行 `C` 的平台。而且对于许多类型的编程，包括机器人和超级计算机等非常酷的内容，`C`
    是首选语言。


    Linux 的 `C` 工具是 `GNU Compiler Collection`，或 `GCC`，你可以在之前的 *ComputorEdge* 期中从名为《开发工具：向
    GNU 编译器集合问好》的文章中阅读更多相关信息。


    # 三步成为专业软件开发人员


    总结一下，这里是成为专业程序员的三个简单步骤：


    1. 学习解释型语言 `Python` 和 `Perl`。

    2. 学习编译型语言 `Java` 和 `C`。

    3. 从认可的四年制大学获得工程或计算机科学学位。


    简单，不是吗？


    # 从源码构建软件


    通常，当你在 Linux 计算机获取或升级软件时，你应该使用你的发行版自带的任何包管理系统。我的发行版包含了 `Synaptic Manager` (www.nongnu.org/synaptic)。


    ## 为什么要从源码构建？


    有时你需要从源码构建。并不是所有软件都是为你的仓库构建的，而且，即使仓库中有可用软件，你可能需要比可用版本更新的版本，甚至可能是下一个版本的测试版，以获取对你重要的功能或错误修复。


    例如，在我的系统上，我查看了 `tar` 命令。与所有 GNU 工具一样，运行 `--version` 选项会告诉你版本。


    ```

    ~/downloads> tar --version

    tar (GNU tar) 1.16

    ```


    打开我的 `Synaptic` 包管理器，我看到我的仓库有一个稍后的版本，但仍然远没有 `gtar` 网站 (www.gnu.org/software/tar)
    上提供的 1.20 版本 tar 包。我获取了其中一个 tar 包并使用 `tar` 解压了该发行版。


    当你从包管理软件下载软件包时，可执行文件会被下载到你的机器上。它们是由包维护者构建的。当你使用包管理系统时，没有任何是在本地编译。当你从源码构建时，你的计算机必须完成繁重工作。但问题不仅在你这一侧；软件开发者也面临着严肃的问题。


    ## 可移植性问题


    Linux 的伟大之处之一是它的可移植性：它运行在每个计算机上。Linux 运行在超级计算机上。它也运行在嵌入式平台上；它运行在手机上，并移植到几乎新的处理器上。


    在 Unix 早期，操作系统是用汇编语言编写的并运行在一种计算机上。操作系统是针对硬件平台的，事实就是如此。当有人提出新的硬件平台时，他们必须从头开始开发操作系统。


    70 年代，Unix 程序员通过用 `C` 这种高级语言重写几乎所有的 Unix 打破了范式，只下了核心部分的汇编编程。第一次，操作系统可以随着在平台之间的移动而增长和改进，开发者可以确信不需要从头开始。他们只需要一个
    `C` 编译器，构成操作系统的所有工具都会变得可用。剩下的就是历史。


    但机器之间仍然存在差异。这在为 Linux（或其他 Unix）平台编写软件时是一个关注的问题。由于操作系统运行在如此广泛的平台上，让软件良好运行可能变成一个真正的挑战。


    问题源于机器之间几十甚至数百个细微差异。一个使用大端存储，另一个使用小端存储。一个使用 64 位地址；另一个使用 32 位。列表是无尽的且令人沮丧的。但在开发新硬件时，新颖性是其一部分。毕竟，如果一个处理器没有做任何新事情，开发它就没有什么意义了。


    那么，当有许多事情可以随平台变化时，可怜的软件软件包如何才能在新平台上成功构建自己？答案是配置 脚本。


    ## 凡求必得


    Unix 社区采用的解决方案并不完美，也不总是很优雅，但它解决了问题。它就是配置 脚本。


    '
- fmt: '

    Each software package comes with a shell script called `configure`. Before building
    the source code, you run `configure`, and it asks your system an awful lot of
    questions. With the answers, the package will know how to build itself on your
    system.


    After unpacking my `tar` installation, I was able to run the `configure` script.
    The output shows the questions that the script is asking the platform and the
    answers it is getting back.


    ```bash

    ~/downloads/tar-1.20> ./configure


    checking for a BSD-compatible install... /usr/bin/install -c

    checking whether build environment is sane... yes

    checking for a thread-safe mkdir -p... /bin/mkdir -p

    checking for gawk... no

    checking for mawk... mawk

    checking whether make sets $(MAKE)... yes

    checking how to create a ustar tar archive... gnutar

    checking for gcc... gcc

    checking for C compiler default output file name... a.out

    checking whether the C compiler works... yes

    checking whether we are cross compiling... no

    checking for suffix of executables...

    checking for suffix of object files... o

    checking whether we are using the GNU C compiler... yes

    checking whether gcc accepts -g... yes

    checking for gcc option to accept ISO C89... none needed

    checking for style of include used by make... GNU

    checking dependency style of gcc... gcc3

    checking for ranlib... ranlib

    checking for bison... no

    checking for byacc... no

    checking whether gcc and cc understand -c and -o together... yes

    checking how to run the C preprocessor... gcc -E

    checking for grep that handles long lines and -e... /bin/grep

    checking for egrep... /bin/grep -E

    checking for ANSI C header files... yes

    checking for sys/types.h... yes

    checking for sys/stat.h... yes

    checking for stdlib.h... yes

    checking for string.h... yes

    checking for memory.h... yes

    etc.

    ```


    ## Making Sense of it All


    The answers are not just written to the screen in the output shown above. They
    are also written to a header file that is available to all of the code in the
    package. This header file serves as a master list of information for the build
    to use in compiling the package on your platform.


    The `configure` script itself is a giant Bourne shell script, which does not really
    bear looking at. (It''s constructed by other tools, and to the natural ugliness
    of code that can only rely on the lowest common denominator of the Bourne shell
    feature it adds the obfuscation of code constructed by a program instead of by
    a human.)


    The `configure` script offers some standard options, and some that are unique
    to the package being built. The `--help` option to `configure` can tell you what
    is available. Some of the output for the `configure` for the `tar` package is
    shown below.


    ```bash

    ~/downloads/tar-1.20> ./configure --help


    ''configure'' configures GNU tar 1.20 to adapt to many kinds of systems.


    Usage: ./configure [OPTION]... [VAR=VALUE]...


    To assign environment variables (e.g., `CC`, `CFLAGS`...), specify them as

    VAR=VALUE. See below for descriptions of some of the useful variables.


    Defaults for the options are specified in brackets.


    Configuration:

    -h, --help display this help and exit

    --help=short display options specific to this package

    --help=recursive display the short help of all the included packages

    -V, --version display version information and exit

    -q, --quiet, --silent do not print ''checking...'' messages

    --cache-file=FILE cache test results in FILE [disabled]

    etc.

    ```


    Another useful option is `--prefix`, which allows you to specify where the package
    should be installed. If the `prefix` option is unused, the software is installed
    under `/usr/local`.


    ## Finish the Job


    After the `configure` script has done its magic, it''s possible to build the package
    with the `make` command. This will call all the tools needed to build the package,
    in the correct order, and with the correct options.


    Those who like to live dangerously will just issue a `make install` command, and
    build and install the software in one step. The more cautious will do a `make
    check install`, to run any tests that came with the package. If the tests fail,
    the install doesn''t happen.


    The `make` command can do what it does only because the `configure` script has
    done much of the hard work in advance. Without `configure` scripts, Linux software
    could not be portable.


    ## An Amazing Side Effect


    Usually, when you hear about a side effect, you get worried. (Like if you''re
    taking a medication and hear it has a side effect of EBD—Exploding Brain Disorder.)
    In the case of `configure` scripts, there is a side effect that you will be happy
    to know about.


    By asking all those questions, the `configure` script is able to adapt to many
    different platforms, even ones that didn''t exist when the package was released—even
    ones that the package developers never heard of. Each platform can have its own
    unique set of answers to the questions that `configure` asks, and the package
    can still cope with it.


    It''s this side effect that makes the `configure` script such a powerful tool
    for portability. It allows software to build on a new system, taking into account
    the unique differences of that particular platform. That''s the power of `configure`.


    # Say Hello to the GNU Compiler Collection


    Last week''s Linux Link column described the important role of the GNU/Linux development
    tool chain. Without it, there would be no Linux. This week we zoom into the heart
    of software development.


    The core component of the development tools is `GCC`, the GNU Compiler Collection
    (`gcc.gnu.org`). This formidable compiler package effortlessly handles C and C++
    on almost every known computer platform, but also provides FORTRAN, Pascal, Ada,
    Java, PL/1, Modula-2 and Modula-3 and more programming languages that you''ve
    never heard of.


    The GNU Compiler Collection is not just a Linux thing; it''s also the compiler
    for the Macintosh platforms, and is widely used for embedded development as well.
    This cross-compilation, as it is known, is what allows engineers to use personal
    computers to develop software for mobile phones.


    Strap in tight, and we''ll hop in and give this tool a spin!


    ## Getting It


    Most Linux systems will already include `GCC`. Open your favorite shell and call
    `GCC` with the `--version` option to see whether it is there, and if it is, how
    old it is.


    ```bash

    ~> gcc --version


    gcc (GCC) 4.1.2 20061115 (prerelease) (Debian 4.1-21)


    Copyright (C) 2006 Free Software Foundation, Inc.


    This is free software; see the source for copying conditions. There is NO

    warranty; not even for MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.

    ```


    If it''s not on your system, try to use your package management system to get
    it. As a last resort, you may have to build it from source code. If so, be warned
    that it takes a while, and is a little more complex than the average software
    built under Linux. (In particular, read the install documentation to tell the
    `GCC` to configure exactly which programming languages you want to handle.)


    ## The Basics


    The core functionality of `GCC` is to take the source code developed by the programmers,
    plus other library code, and produce an executable program—something you can run
    on the command line. As a sample program, I''m using a little prime number-finding
    algorithm, the rather famous Sieve of Eratosthenes. The code is appended below.
    Get your favorite text editor out and cut and paste the code. Save it as a file
    called `find_primes.c`.


    Then turn this C source code into an executable with this command:


    ```bash

    gcc find_primes.c

    ```

