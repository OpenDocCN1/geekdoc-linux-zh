    # 命令行营来救美


    在非常老旧的西部片——那些在我还是孩子时候就已经很老了的——电影总是以美国骑兵翻越山丘作为结尾，伴随着军号吹响“冲锋！”（http://www.15thnewyorkcavalry.org/Media/charge.wav.）


    每当我对 Linux GUI 不满意时，这段音乐就会在我脑海中响起，我打开 `bash` 终端获取命令行。我不在乎你想尝试做什么——在 Linux 中，你始终可以通过命令行完成。而且在很多情况下，命令行工具的额外文档和设计有助于你对正在发生的事情建立基础性的理解。


    更好的是，GUI 会随不同的桌面而变化，并且可能取决于机器上安装的其他应用程序，但命令行始终是一样的。这就像是有 100 名骑兵骑过山丘，手枪火光，拔剑出鞘，旗帜飘扬，军号勇敢地告诉你的所有问题统统滚滚让开。


