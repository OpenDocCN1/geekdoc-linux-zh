  trans: '

    午餐后，查理和萨姆像往常一样去逛街了。镇上开了一家新的 `CompUSA`，查理正打算挥霍买一台新的四核服务器，而萨姆在解释他需要立即把他的 `RAM` 升到最大。马蒂在回律事务所的路上，给出了最后的临别建议。


    “无论发生什么，千万不要直接重用她那台旧的 `Windows` 笔记本电脑。她会想要亮闪闪的新东西，而且当她在 `Linux` 上遇到无法解决但必须立即处理的问题时，留着旧电脑会派上用场。此外，她在电脑上肯定有很多文件，在接下来的几个月里她可能需要其中一些旧文件。祝你好运。”


    # 审视我们与（操作系统）关系的反思场景


    当我走在 16 街商场逛橱窗时，我思考着朋友们的建议，以及我们对操作系统的情感纽结。这让我想起从孩子身上学到的东西：人们倾向于留在熟悉的地方。孩子可能不喜欢他习惯的东西，但他知道自己不喜欢他不习惯的东西。不信吗？那试着给一个
    6 岁的孩子喂一个全新的食谱看。


    `Windows` 尽管有很多缺点（而且确实很多），但我妻子在过去的 12 或 13 年里一直习惯它。在那段时间，它陪伴她度过了起起伏伏。（而且考虑到计算机和软件的本质，那大多意味着糟糕时期。）她了解它的怪癖和陷阱，并且习惯了
    `Windows` 上的处理方式。


    我也试着想，如果有人试图说服放弃 `Linux` 和类 Unix 操作系统，会是什么感觉。自从 1986 年第一次坐在这类系统面前以来，我就每天都在使用它们了。我的大脑和指尖已经积累了
    22 年的 `Unix` 知识，那不是我可以轻易放弃的东西。


    （幸好，我用 `Emacs`，所以对我来说所有的操作系统看起来都是那样的。）


    ## 整洁的总结


    最后，我决定帮助我的妻子从 `Windows` 切换到 `Linux`。这一切归根结于信任。虽然从 `Windows` 到 `Linux` 的切换可能不像你最喜欢的女性情感剧剧集那样快速方便，但它可以帮助让电脑以及你用它完成的任务看起来不那么具有威胁和烦人。它可以让生活变得更好。


    而亲爱的读者，这就是良好婚姻的秘诀：试着以某种方式让配偶的生活稍微好一点。因为你确实会制造出自己比例的问题和困难。就像一个良好的操作系统一样，确保正面影响大于负面影响，让功能大于
    Bug 是重要的。


    # Cygwin: 完美的配置


    作为自由软件的长期支持者，我对闭源软件并没有什么钦佩的。那些源自华盛顿州雷德蒙的常用操作系统上的软件，对我来说几乎没有魅力。


    当和其他自由软件极客坐在午餐桌旁时，我嘲那个另一个操作系统以及其配套软件时总是大声且自豪的。我们花费几个小时讨论软件，而来自雷德蒙的软件从未得到过一句好话。（也许我们有时应该聊聊软件以外的话题，但毕竟我们是极客。）


    然而，有一个阴暗、羞愧的秘密我从未告诉过我的极客伙伴们。那是我永远无法承认的、他们会嘲笑的事。


    我钦佩 `Windows` 软件的安装方式。


    ## Windows 用户的轻松安装


    当你得到一个 `Windows` 软件时，你把光盘放入驱动器，或者运行一个可执行文件，弹出一个友好的对话框。它用细小的片段和简单的词汇解释了一切。它为所有内容都给出了合理的默认选项，允许像我这样懒惰的系统管理员只需反复点击“确定”，甚至不用去读它为我列在那里的那句话。


    我甚至懒得花五秒钟去阅读和理解安装说明及选项。这是多么可怜啊？我怪怪 MTV。


    但在 `Windows` 上——那个犯了这么多错的操作系统——安装程序总是奏效。完美无缺。每一次都是如此。


    ## 在 UNIX 安装中度过苦难时光


    `UNIX` 是一个非常强大且专业的操作系统，它能做很多 `Windows` 做不到的。。（例如，长时间工作）。但它有一件事没做好：软件安装。


    `UNIX` 软件并不是提供一个带有足够聪明的猴子都能看懂指令的漂亮弹出框，而是以各种奇怪的方式分发的，范围从源代码（你用自己的编译器进行构建，有点像从零件包组装收音机）到二进制分发，后者几乎但并不完全像
    `Windows` 分发版那样简单。


    在安装 `UNIX` 软件时，你几乎必须阅读说明。我们自由软件极客互相说我们更喜欢这样。但在我内心深处，我并不。MTV 让我很难长时间集中在任何事情上。


    # 使用 Cygwin 回归 UNIX


    这就是为什么我总是乐于使用 `Cygwin` 安装程序。


    `Cygwin` 是 `UNIX/Linux` 到 `Windows` 平台的完整移植，它安装起来和任何 `Windows` 软件一样简单。


    与 `Windows` 软件不同，`Cygwin` 软件是免费的，源代码也可用，以防你想自己修改，而且它总是、总是、总是有效的！


    一旦你在这电脑上安装了 `Cygwin`，只需点击桌面上的 `Cygwin` 图标，一个 `bash` shell 命令行窗口就会打开。


    立即，我的心跳慢了，掌心停止了出汗。我忘记了正在一台 `Windows` 机器上工作。`Cygwin` 给了我健康、强大且令人愉悦正常的 `UNIX` 工具集。这就像回家一样。


    即使是 `X Window` 系统——那个提供窗口、菜单、工具按钮以及某些人似乎屏幕上需要的所有其他图形杂物的 `UNIX` 窗口系统——也得到了支持。（对我来说，我很满意于智能终端模拟器和
    ASCII 模式下的 `emacs` 了。人还能需要什么呢？）


    ## Windows 电脑的 UNIX 疗法


    要将这些优质软件注入你的 `Windows` 笔记本或台式机，只需访问 `Cygwin` 网站 (www.cygwin.com)。点击图标“Install
    Cygwin Now”。


    这将下载极佳的 `Cygwin` 安装程序 `setup.exe`。将此程序保存在容易找到的地方，比如你的桌面。每你想更新 `Cygwin` 软件或获取新软件包时，就可以运行它。


    运行 `setup.exe` 程序。继续接受所有默认设置，就像安装任何其他 `Windows` 软件一样。当要求选择下载站点时，我随机选一个。出于某种原因，我尝试选择
    `.edu` 站点。我不知道它们是否比商业网站快。


    选择下载站点后，安装程序会下载一个软件包列表。现在是是有趣的部分了。


    # 阿拉的软件宝库


    最大化安装窗口；你需要大量的空间。在这里你将看到我们这一代人的软件财富。


    你会发现 `bash`，即 Bourne Again Shell——历史上开发过的最好的命令行界面。或者，对于那些口味不同的人，还有 `csh`、`sh`、`zsh`
    或其他几种命令行环境。


    你可以得到 `emacs`，第一个也是目前最好的集成开发环境。对于更原始的，有 `pico`、`nano`、`joe`，甚至还有老老的 `UNIX` 行编辑器
    `ed`。


    获取广赞誉的脚本语言，如 `Perl`、`Python` 和 `Ruby`。还有 GNU 编译器集合 (`GCC`)，它可以处理 `Java`、`C`、`C++`、`Fortran`、`Pascal`、`Ada`
    和其他编程语言。无论你偏好什么样的（非 Windows）编程环境，你都可以在这里找到。


    '
- fmt: '

    There are too many to list—enough tools to keep you busy for a long, long time.
    There are more than enough to fill an undergraduate computer science curriculum,
    and add in a graduate-level curriculum as well. More than enough to do very serious
    work.


    These are not knock-off tools, Windowized in some way. They are the actual UNIX
    tools, built for you on a Windows box. The scripts that you write for `Perl`,
    the C programs you compile with `GCC`, are exactly the same as those you would
    produce on a UNIX system.


    These are not toys; they are the same tools being used in the cutting edge of
    industry and research labs.


    All free! Amazing.


    # Who Should Get Cygwin?


    Get Cygwin if you are a UNIX programmer with a Windows box. You will be very happy
    to have your usual tools always at hand, and you will find that you can use the
    Windows box as a UNIX development platform.


    Get Cygwin if you are a computer science or engineering student, so that you have
    access to industry-standard tools. These tools will help you in the classroom,
    and in the interviews when you''re job hunting.


    Get Cygwin if you want to know more about UNIX without making the commitment to
    switching to Linux on your laptop or desktop. Or, if you are sick of the limitations
    of Windows tools and want something a little more serious.


    Then enjoy it, and remain in the UNIX cocoon of safety instead of venturing into
    the wilderness of the world of Windows!


    # How to Become a Linux Guru


    Software is one of the most poorly taught topics on the planet.


    Get a civil engineer, and he or she will know all about roads, concrete and steel.
    Get a mechanical engineer, and he will know all about locks, hinges, pistons and
    pulleys. Get a software engineer and she might not even know what language you''re
    programming in. There is little agreement as to what a software engineer should
    know — even about what a software engineer is.


    It''s an observed fact that some people are good with computers, and other people
    aren''t. We call the good ones gurus and the rest users.


    How do you tell the difference? A guru is the one who can solve unexpected problems,
    come up with comprehensive solutions, and get the darned computer working the
    way you want it to work. A user can not. It''s the kind of thing that''s easy
    to see, but hard to explain.


    But the guru you seek in times of computer trouble started out just as you did,
    with no formal training in the Linux operating system or software. How, then,
    does the guru manage to tame the information wilderness of the computer? Why is
    it that he or she knows what you don''t?


    ## Dedicate Yourself to Learning


    To become a guru, you must first understand that there is far too much to know,
    far too many interesting nooks and crannies for even a lifetime of effort to explore.
    The amount of creativity, effort, time and money that went into the creation of
    the modern Linux box is staggering. With the almost unique easy reproducibility
    of computer software, it is possible for software to remain in use for decades,
    forming the foundations for the next layer of software, which will, in turn, form
    the foundation for even more layers.


    In every Linux box there are hundreds of thousands of lines of software, created
    over the last four decades by some of the most talented and productive programmers
    ever to have lived. This intellectual heritage, this wealth of functionality,
    is given to everyone free with Linux.


    You can''t learn it all. You can''t even learn 10 percent of it all. But that
    doesn''t mean you can''t try.


    Gurus are always trying to learn more about the operating system. If you want
    to be a guru, you must cultivate this attitude of study, this dedication to continued
    learning. There is no end to this road except death. (A bit depressing when you
    look at it that way, isn''t it?)


    ## Finding the Answers the Old-Fashioned Way


    Given this huge amount of software, how do you find the answer to a specific problem?


    Back before the Internet was invented, the UNIX world had developed several documentation
    strategies to cope with this problem. The first was the simple but robust man
    page. ("Man" is short for manual.) This is documentation, distributed with the
    operating system. It''s displayed with the `man` command. To learn about the `find`
    command, type: `man find`. (To learn more about the man system, type: `man man`.)


    Although the man system is extremely useful and still widely used to this day,
    there are limitations. Since each man page is a separate document, there are no
    hyperlinks between documents. There is also no good search capability.


    To address these issues for the free software projects they were undertaking,
    the Free Software Foundation (FSF) developed the `texinfo` system, which is based
    on the popular text editor `emacs`, but can be run in stand-alone mode with the
    `info` command. The `info` systems allow documents to be arranged in a book-like
    organization, with chapters, sections, sub-sections, etc. It supports links between
    documents and various forms of searching. `emacs` users can get the `texinfo`
    documentation right within `emacs`.


    For FSF tools, which make up much of Linux, the `texinfo` documentation is more
    detailed and more useful than the man pages. It can also be used to generate nice-looking
    printed manuals, PDF documents and Web sites, all from the same source. This is
    very handy when documentation is maintained by busy programmers, as with most
    free software. You can get at it with `emacs` or the `info` program, but it''s
    also available on the Web (see below).


    ## Finding the Answers the Newfangled Way


    The Internet is the central repository for human knowledge on free software. I
    don''t know any guru who does not use `Google` or `Yahoo` to find new information
    to supplement what can be learned from the formal documentation in the man or
    `texinfo` documentation.


    Frequently, the very obscurity of error messages can be used to help find the
    information you need. When faced with some error message that means absolutely
    nothing to you, just cut and paste it into your favorite search engine.


    Since free software documentation is also on the Internet, you can sometimes just
    skip the man and texinfo documentation and jump right to the Web. The same documents
    you would get from the man or texinfo systems will be right there in your search
    results, along with other hits from related Web sites.


    ## Read More Than the Minimum


    There is only so much that you can learn in a day, and the best way to continue
    to learn is to try and learn a little every day, or every time you interact with
    the computer.


    One difference that I have noticed between gurus and non-gurus is that the gurus
    will spend an extra five or 10 minutes reading the documentation, even after they
    have found the answer they were looking for. The non-gurus will crack the documentation
    open when they can''t figure out how to do something, and as soon as they have
    found the answer they will close the books and hit the keyboard.


    That extra 10 minutes of reading each time allows the guru to take away a few
    extra pieces of information about the operating system. Instead of reading the
    absolute minimum of documentation, the guru reads a little bit more.


    ## You too Can Be a Guru


    To be a guru, you must adopt the attitude that learning about computers is something
    you will continue to do your whole career. You must recognize how little you know
    of the topic, and how much you have to learn. You must try to learn something
    every day, and from every computer problem you run into. Don''t just work at it
    until the problem is solved; work at it until you have a good understanding of
    how the problem was solved.

