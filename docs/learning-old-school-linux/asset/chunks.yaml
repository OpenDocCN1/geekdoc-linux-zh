    # 价值连城的 Perl


    一个自由软件产品似乎需要 20 年才能达到完全成熟。大多数自由软件项目是由一位狂热（甚至略带疯狂）的程序员启动的。但如果该产品满足了社区的真实需求，一个自由软件项目就会开始吸引其他程序员，最初作为用户，然后作为协作者。


    名为 Perl 的编程语言就是如此。它由一位名叫 Larry Wall 的程序员于 1996 年创立，最初是一个旨在帮助理清 Unix 系统管理员在日常生活中充斥的数以万计文本文件的程序。


    从这些谦微的起点开始，Perl 已经成为计算机历史上最受欢迎的语言之一，在全球范围内拥有数十万用户。


    ## 编译 vs. 解释


    从本质上说，每种语言的每个程序都是一个简单的文本文件（或一组文本文件）。程序员在这个文本文件中倾注他的工作，试图确保每一个变量名、循环索引和分号都是正确的。


    一旦程序员认为程序已准备好运行，他就要面临着一项任务：让计算机理解这些文本文件，并将它们转换为计算机实际上可以使用的指令。


    在某些语言中，这一步只需执行一次——程序员将他的文本文件输入另一个程序（即编译器），构造出一些可以运行的二进制文件，这些文件可以直接输入计算机运行——无需进一步处理。编译型语言就是如此，例如
    `C`、`C++`、`Fortran` 以及许多其他语言。


    而在其他语言中，如 `csh`、`Perl` 和 `Java`，程序并不是编译一次的；每每当你运行时它都会被处理（或解释）。解释型语言中产生的不是计算机可以理解的二进制文件，而是文本文件在每次运行时都会被重新解释。


    使用解释型语言似乎效率较低，因为计算机在每次运行程序时都必须研究你的源代码，而不是只需研究一次。在过去，这被认为是一个严重的缺点，但现如今，反正有这么多 CPU
    周期被浪费了，我们真的不再在乎效率了。


    解释型语言的另一个缺点是运行程序需要源代码。对于编译后的程序，你只需要二进制可执行文件；但对于解释型程序，你需要所有的源代码。如果你想销售专有软件，这就是一个问题，正因如此，商业软件几乎总是用编译型语言编写的。也许因为这些限制，解释型语言似乎受到了语言开发者的关注少得多，90
    年代后期的大多数解释型语言都饱受语法糟糕和组织大型代码库资源匮乏的痛苦——直到 Perl 的出现。


    ## Perl 中有不止一种实现方法


    `Perl` 与其它语言最大的区别之一是完成一项任务的方法有很多。在大多数语言中，核心思想是执行每个编程任务应该只有一种正确的方法。如果完成某件事有多种方法，理论上认为这将导致程序员的困惑，一些程序员用一种方式做，另一些则用另一种方式。


    在 `Perl` 中，这种观点被颠倒了。不是只有一种处理方法，而是有很多种。选择哪种方式最方便取决于程序员。这确实很容易导致代码组织混乱、令人困惑。但它也允许程序员以最适合自己的编程风格，以极快的速度进行工作。


    ## 面向对象的力量中心


    `Perl` 作为过程化脚本语言运行良好，就像一种超级 Shell。它和在 `bash` 或 `csh` 中编程非常像，只是每一切都稍微（或很多）更方便。


    但当使用其强大的面向对象特征时，`Perl` 才真正开始放异彩。通过面向对象编程，可以编写庞大的程序，而不牺牲代码结构。


    与 `C++`（且与 `Java` 不同），`Perl` 的面向对象特征并没有侵入语言本身。你可以很容易用过程化的方式编写，直到写了几页代码，然后切换到面向对象编程，而无需丢弃所有现有的代码。


    ## 来自朋友的小帮助


    面向对象编程的优点之一是，如果做得正确，它允许重用现有代码。其想法是逐渐建立一个代表你问题域的对象库。随着时间的推移，这些不断增长的代码将让你编程得更快。


    在实践中，现实世界里很难实现重用性。但在 `Perl` 世界里，你不需要那么努力。存在一个名为 `CPAN` 的神奇代码库，即 `Comprehensive_Perl_Archive_Network`（`[www.cpan.org]`）。这个免费的
    `Perl` 代码存档为几乎可以想象的任务提供了代码模块和脚本，从统计学到神经网络。


    严肃的 `Perl` 项目在浪费时间重复轮子之前，都会先访问一下 看看从这个免费软件糖果店中可以获取到什么。


    ## 学习 Perl


    `Perl` 拥有任何 Unix 工具中最详尽的帮助文档（man pages）。从 `"man perlintro` 开始。初者的面向对象教程对于那些寻求使用
    `Perl` 面向特征的人来说是关重要的，但请确保你先对过程化编程良好的理解。


    ## 一个代码示例


    不可能给出一个代表 `Perl` 编程的 `Perl` 示例，因为根据任务和程序员的不同，它可以看起来非常不同。这种像变色龙一样的语言适合所有程序员，因为它允许……


