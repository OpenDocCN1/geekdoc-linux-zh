- fmt: '

    Over time your knowledge will grow, and your ability to find the right information
    will grow with it. People will start coming to you for answers, and you will hear
    yourself referred to as an expert or perhaps even a guru. Yet you still won''t
    feel that you really are an expert, or that you really know all the answers.


    But gurus don''t know all the answers; they just know how to ask good questions.


    # The Distribution


    One aspect of Linux that confuses new users is the huge number of choices available.
    On the other hand, the commercial operating system from Redmond comes in two flavors,
    Pro and Home (which presumably means amateur!).


    Linux is all about giving you choices. It comes in hundreds of flavors.


    But there are only so many choices that your brain can handle before it throws
    up your arms in disgust and gives up!


    ## Back in the Old Days


    The computer hardware sitting on your desk is just a big, general-purpose and
    extremely complicated abacus (but the beads are electrons). It''s so complicated
    that if you had to start with just the hardware, and tried to write a letter to
    someone, it would take you years. And add a few more years to make it print.


    This was what life was like for the early users of computers, back in the 1940s
    and 1950s. But gradually, the body of existing software began to accumulate. It
    wasn''t necessary for every new user to spend a month to write a letter. Once
    the first word processor was written, everyone could use it.


    It was this ability to build atop the work of others that inspired Richard Stallman
    to start the Free Software movement and the `GNU` tools. And it was those tools
    that allowed Linus Torvalds to develop the `Linux kernel` in 1991. He built upon
    a body of software that already existed—which he downloaded, one-by-one, and installed
    on his computer.


    So it was throughout the world. Excited users would get the `Linux kernel` and
    then use it for the core of their system. But, just like the users of the 1940s
    and 1950s, the kernel alone would get them only a working piece of computer hardware.
    They still needed to assemble various useful programs (like a word processor)
    and get them working with their `Linux kernel`. Most of these useful programs
    came from the `GNU Project`. The graphics system came from the `MIT X Window project`.


    But getting them all working together was up to the user. Sometimes this could
    be a real challenge. Back in those days, Linux users in many cities would hold
    meetings where Linux newbies were encouraged to bring their systems in to get
    `Linux` installed. Expert volunteers would be on hand, with pre-recorded CDs containing
    the software, and years of experience to draw on to get recalcitrant systems working.


    This was fun, but it challenged all but the geekiest. It''s hard to take a bunch
    of different software packages and get them all to work together. The more software
    involved, the more work it could be.


    ## Distros to the Rescue


    These difficulties slowed the use of Linux considerably. Linux was something for
    computer science grad students and electrical engineering undergrads, not the
    average computer user.


    The development of an enthusiastic Linux community made the next step inevitable.
    Users started packing up their successfully integrated software systems, and mailing
    the CDs to whomever wanted them, or distributing the disc image over the Internet.
    Special graphical tools were developed to help new users install Linux, and sophisticated
    package-management systems took the sting out of getting and installing new software.


    Since it''s all free software, you don''t have to own it to package it up and
    give it away, or even sell it. It''s free, so go right ahead!


    And that is what many users did. A set of integrated `GNU/Linux` software is called
    a distribution, or `distro`. And there are thousands of Linux users out there
    who, for commercial or altruistic motives, will take the trouble of putting together
    their own unique Linux distro.


    Some distros are aimed at new users, and give only the most basic and simple tools.
    Others are aimed at the hard-core geek, with the latest bleeding-edge version
    of every cool software you''ve ever heard of, and hundreds more that you haven''t.
    Some distros are intended to quickly convert a `PC`, and some to run on embedded
    platforms or supercomputers. There''s a distro for every taste and set of needs
    and, if there isn''t, someone is probably putting it out there right now.


    Companies were formed that sold the distro and its support. They don''t sell the
    software—that''s free. They will sell you the smart person who can come down to
    your office and get it working on your hardware. Some of these companies developed
    even better tools to help the new user.


    This days, there are hundreds of distros out there, each with its own supporters
    and (sometimes) detractors. Many distros are related to each other, each based
    on the same predecessor distribution. Many use the same package management or
    installation tools, but offer a different set of software tools to the user.


    ## Which Distro Is Right for You?


    Any distro makes it possible for any ordinary computer user to install the `Linux
    kernel`, the windowing system, plus a ton of extra tools and useful toys. No longer
    do you need to lug your `PC` to a Linux user meeting to get it working. The install
    tools are so well developed now that getting Linux working on a new system is
    fairly simple.


    With all these choices, which distro should you pick?


    A good list of an arbitrarily chosen top 10 best Linux distributions can be found
    at `distrowatch.com/dwres.php?resource=major`.


    Unless you have special needs, the choice of distro is not too critical. Any of
    the top 10 will work about as well as any other. Remember, any distro is just
    a starting point. It gives you a base of software tools.


    ## Where to Get It and How to Use It


    Where and how you get your distro depends on how you want to use it. The most
    straightforward way to get a distro is to order the CDs through the mail. For
    a nominal charge (usually less than $5 plus shipping), you''ll get your distro
    in a few days, and can install from CD.


    For the less patient, you can download an install disc image (about 700MB), write
    it to CD, and have your installation disc without having to wait.


    For the even less patient, Debian allows you to download a small install utility.
    Run it on your target machine (which must have an Internet connection), and it
    will guide you through the installation. I have never tried this, but it sounds
    so nice that I think I will next chance I get!


    ...Choosing a distro is just the first of many choices, but it doesn''t limit
    you as much as you might think. The distributions are just different collections
    of already free software. If you see some interesting software and you like it,
    you can get it, whatever distribution you started with. As time goes by, you will
    install various packages on your machine, adding to those installed from your
    distro. Your collection of tools will become your own unique set of software.

