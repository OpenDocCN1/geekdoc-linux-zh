    这些电脑只需要升级操作系统就能变成实用的机器，适用于网页浏览、办公任务（如文字处理和电子表格）以及普通 Windows 电脑的其他任务。你获得的文档将与 Windows
    兼容；你的网络浏览器看起来和用起来将与在 Windows 上完全一样。


    除非你使用的是 Internet Explorer。如果是那样，现在停手吧！求你了。


    这些废旧机器的一个大棒之处在于，它们是完全可以消耗的。只需愉快地重新格式化磁盘，大功告成了。（但务必问问妻子，确保这台电脑不是唯一存放着 2002 年孩子们照片的地方。不要仅仅因为电脑在车库的后面就认为磁盘上什么都没有。切不要在没有将其备份到某处的情况下就轻率地重新格式化磁盘。）


    Linux 有许多不同的发行版，但你选择任何一个热门版本都不会出错，例如 `Ubuntu` 或 `Fedora`。你可以下载 CD 镜像，或者花几块钱买一套
    Linux 安装 CD，或者在公司里问问，就会有人有一套。


    旧笔记本电脑也是极佳的 Linux 机器。我最近转换了我旧的 Windows 笔记本电脑，那是一台 `Toshiba Satellite`。在 Windows
    下，它运行缓慢又笨拙；而在 Linux 下，它既快又棒！


    ## 在 Windows 机器上使用 Cygwin


    对于那些无法忍受没有 Windows 的机器的人，有一个 `Cygwin` 选项。`Cygwin` 是 Linux 到 Windows 的移植。也就是说，Linux
    直接运行在 Windows 之上。访问 `Cygwin` 网站 (`www.cygwin.com`) 并点击 `Install Now` 按钮开始安装 `Cygwin`。


    这不是运行硬件最高效的方式，但总的来说，任何可以运行 Windows 的机器都能处理 `Cygwin`。


    通过 `Cygwin`，你获得了一整套 Linux 工具，同时与旧的 Windows 桌面和工具并肩。


    如果你最近投资了新的 Windows 硬件，或者由于工作需要运行某些 Windows 应用程序，或者你想要一个可以兼顾 Linux 的游戏系统，那么这是一个极佳的选择。


    `Cygwin` 发行版并不是精简的、限制版的 Linux——它是完整的整体，移植到了 Windows 上。完整的 Linux 机器能做的事情，几乎没有是
    `Cygwin` 机器上无法完成的。你甚至允许他人远程登录该机器，并获得完整的 Linux 命令行和窗口系统。


    而在基于 `Cygwin` 的机器上，当你需要时，Windows 仍然占据主导地位。


    我不喜欢 `Cygwin` 机器，但不是 `Cygwin` 的错。问题在于它们仍然运行着 Windows，这消耗了大量资源。任何能合理速度运行 `Cygwin`
    的机器，如果只安装 Linux，都会成为真正的性能怪兽。那么为什么不干脆去掉中间人，享受 Linux 的所有优势呢？


    唉，有时你做不到。如果你被囚禁在 Windows 中，`Cygwin` 至少让你能够使用不错的工具。


    ## 购买 Linux 机器


    我是简单化处理事的忠实粉丝，特别是在计算机方面。而且没有比直接买一台现成的 Linux 机器更简单了。在很多方面，这是最好、最简单的替代方案。


    你正在寻找新机器吗？许多 Windows 用户发现自己每隔几年就会有一次。


    如果是这样，请认真考虑购买一台 Linux 机器。


    由于它能以更少的投入完成更多，一台新的 Linux 机器可能比新的 Windows 机器便宜得多，但仍然能同样很好地完成工作。通过落后于曲线购买，Linux
    用户可以享受大规模生产的通用硬件带来的好处，并让 Windows 用户承担获取尖端技术的成本。


    等明年，当那些尖端技术价格跌到一半时，如果你需要，可以随时添加。但你可能会发现，一台 Linux 机器保持原样就能用很多年。毕竟，为什么机器不应该年年年地保持合理的性能并继续工作呢？这并不过分的要求，但计算机用户已经被洗脑认为这是不可能的。


    这不仅可能，现在甚至变得简单了。


    越来越多的桌面和笔记本电脑预装了 Linux。只需开箱即用，插上电源开机即可。


    这不仅为你节省了每次买电脑都要送给比尔·盖斯的 100 美元——还确保了你在使用机器上的任何硬件设备时不会遇到麻烦，这种情况在将 Windows 切换到 Linux
    时可能会发生。（由于现代 Linux 发行版如此出色，这种情况已经多年没有在我身上发生了。）


    相信我，即使是最廉价的新机器，运行 Linux 的体验也比运行 Windows 流得多。不需要为顶级硬件花大钱。


    ## 使用 Linux 能获得什么


    所有的操作系统都是软件层层堆叠的。每一层都建立在过去的基础上，而今天巧妙的新功能取决于昨天的巧妙新功能。


    这可以做得糟糕，也可以做得很好。当做得糟糕时，你会得到一个庞大、臃肿、组织混乱的软件堆。像一座用果冻建成的摩天大楼，如果不占据巨大的面积，它就没法盖高。它会变成一个巨大的、樱桃味的、颤抖的物体。


    当做得很好，系统软件就像埃菲尔铁塔，高大笔直，占据的水平空间极少。


    在 Linux 中，事情是做得很好，而不是糟糕。这就是为什么 Linux 用户不需要为了保持现状而每三年升级一次机器。这也是为什么旧的 Windows 电脑可以轻松转换为实用的
    Linux 机器。


    无论你通过什么途径获得 Linux 机器，你将获得丰富高质量、稳定且高效的软件。通过 Linux，你可以跳出硬件和软件的轮转，获得一个即插即用的系统。


    ## 如何切换到 Linux


    在各地，在众多的 Windows 用户中，这个问题从繁华的沿海城市到炎热的中原不断回荡：“我到底该如何切换到 Linux？！”


    作为一个已经到达“许愿之地”的人，让我向你保证这段旅程是值得的。Linux 和 Windows 做的事情一样——但 Linux 崩溃频率较低。Linux 似乎在与你合作，而
    Windows 似乎在反对你。Windows 是 Linux 的邪恶双胞胎。


    切换到 Linux 可以通过许多方式实现，从简单到相当有挑战性不等。你决定要在这个过程中投入多少时间和精力。


    ### 选择简单的路径


    当我还是个孩子时，我的老师们经常责备我的懒惰。“你总是走捷径，”他们哀嚎着，仿佛那是某种坏事似的。（他们哪里知道，我对“触手可得的果实”的热爱恰正是高效工程所需的品质。）


    在 Windows 到 Linux 的切换中，简单的捷径被称为 `Cygwin`。访问 `www.cygwin.com` 网站，点击右上角的按钮，上面写着“Install
    Cygwin now”。这将下载一个名为 `setup.exe` 的程序。运行该程序，你将被引导回答几个问题。（当被要求选择 Cygwin 仓库时，随机选一个即可。）


    如果你研究一下安装程序，你会发现有一个巨大的可用软件列表，其中某些项目已被选中。被选中的项目是 Cygwin 的最小安装内容，你应该接受它们并让安装程序为你完成安装。如果你只有拨号连接，你必须让机器连接很一段时间才能完成。


    '
- fmt: '

    Once the Cygwin setup has worked its magic, you will have Linux installed right
    on top of Windows. Now you may continue to use Windows, but gradually transition
    to Linux in the background. That is, you can start using the Linux flavors of
    your favorite tools. You will find an icon for `Bash`, a Linux command line, on
    your Windows desktop. `Bash` is like DOS (in the same way that the Space Shuttle
    is like a bottle-rocket.)


    After the basic install, you will want to run `setup.exe` again and get a bunch
    more software. (All free, of course.) You can also install X Windows, the Linux
    GUI, and run X-based Linux programs on your PC. (Or, you may choose to use the
    Windows-based versions of free software, like OpenOffice, and just use Cygwin
    for command-line tools.)


    The great thing about Windows boxes is their incredible computing power. With
    a beefy Windows box, Cygwin programs run at a screaming pace. The bad thing about
    them, of course, is that they have Windows on them. Which leads to the next path
    to Linux: buying a Linux computer.


    # Buy It, Don''t Build It


    Back in engineering school, they told me "never draw what you can copy, never
    copy what you can tear out and paste." (The expression reveals my age in an era
    where engineering students think of "drawing" as something done, like everything
    else, with a computer keyboard.)


    Despite its age, there is a valid principle at work. You can''t do everything,
    after all, so why not let someone else install Linux on a computer, and just buy
    it?


    If you take this path, you must shell out some money, but you get a ready-made
    solution that works from day one, right out of the box. And with Linux''s svelte
    runtime profile, much less hardware is needed for a Linux box than would be needed
    for a Windows box, so you can get something inexpensive, and still get the kind
    of capability Windows users chase with top-of-the-line hardware. (They chase it,
    but they don''t get it, because it''s about the software, not the hardware.)


    If you''re looking for a Linux box without a high price tag, take a look at the
    Asus ultra-portable Eee line. For $400, you can get a nicely powered Linux laptop
    that weighs about two pounds. Plunk it down on your desktop, and plug in a VGA
    monitor and USB keyboard and mouse (and don''t forget to plug in your speakers).
    You can use the screen, keyboard and mouse from your Windows computer, in fact.
    Now you have a very nice Linux desktop machine.


    And when you want to go on a business trip, you fold it up and slip it in your
    coat pocket or carry-on bag, and you can make it to your destination without an
    aching shoulder. Once there, you can work on its tiny (but adequate) keyboard
    and screen until you get back home.


    It comes with wireless networking, but no hard drive. There''s a few gigabytes
    of flash RAM storage, plus a `microSD` slot where I have another `2GB` of storage
    that I bought for about $25. With the SD slot and the USB ports, you can get a
    lot of extra storage without a hard drive. The upside is that the Eee is very
    durable, as it has no moving parts, other than the keys.


    # Wipe a Computer, and Install Linux


    Lots of Windows users have old machines lying around that are no longer powerful
    enough for the software from Redmond. Rest assured that they are more than powerful
    enough for Linux. In particular, old laptops can be used as power-efficient network
    servers. If you run Linux without a GUI, you can make use of even very old machines.


    To install Linux, you''ll need an install CD. You can make your own by downloading
    a giant file called the disk image file (or `ISO` file). With the `ISO` file,
    and a read/write CD, you can make your Linux install CD. You must select your
    Linux distribution and get its `ISO`. `Ubuntu` is a good choice for those new
    to Linux. It has everything you would expect in a home/office workstation.


    The easy way to do it is to wipe out whatever is on that machine''s hard drives.
    Take a copy on some other media, and get ready to hose down the storage. If you
    have more than one disk, you can disconnect one and retain its contents (Or leave
    it connected, but be very careful when you are at the installation step where
    you reformat hard drives.)


    Then you boot with the install CD and follow instructions that pop up on the screen.
    It''s as easy as installing Windows.


    # Build a Computer, Install Linux


    Why, oh why, do I always skip all those easy ways and go right to the hardest?
    Perhaps because it''s also the most fun.


    Pick out the parts, put together your own box, and install Linux yourself. You
    will get a real powerhouse for a very good price. And you will learn a lot.After,
    your experience level in Linux (and hardware) will be much higher.


    Which reminds me of another lesson from engineering school: Experience is the
    thing you have just after you need it.


    # Linux and the City


    Vespa is Denver''s last, best refuge of hipness and original food, but last night
    someone made the mistake of telling the crowd at the Libertarian convention about
    it. As a result, the place was crowded with East Co-asters, looking nervously
    about, visibly trying to find something comfortable to look at, like someone in
    a three-piece suit. Instead, all they could see were relaxed Denverites, in their
    jeans and sneakers.


    I was waiting for the bartender''s attention in this crowd of leisure-suited freedom-lovers
    when my significant other turned to me and, giving me that look with her beautiful
    brown eyes that always caused my knees to go weak, asked the question I have been
    secretly dreading for years: "Will you help me switch to Linux?"


    As the part of my brain responsible for getting along with my sweetie mechanically
    caused my mouth to accept graciously, neurons in the part of my brain responsible
    for staying married to her started firing. The path to Linux may be fraught with
    difficulty, and we don''t always love those who lead us along this path. In fact,
    frequently we get mighty cranky with them.


    Later, when I had had a chance to get used to the idea, I asked myself the question:
    Is it a good idea to help your significant other switch to Linux, or should you
    hand him or her off to a competent geek friend, knowing that, however rough the
    switch, at least you won''t get the blame?


    # The Brunch Bunch


    The next day I broached the question to my three closest friends at brunch. The
    first to answer was Sam, the oldest and most experienced member of our group,
    who regularly took on the task of teaching Linux to friends, acquaintances and
    people he barely knew.


    "Go ahead and help her switch! Sure, it''ll be hard, and she''ll do some whining
    and complaining about how everything was different under Windows, but soon she''ll
    get the hang of things, and learn to love Linux. In the end, she''ll thank you.
    And if she doesn''t, probably you weren''t right for each other anyway."


    My friend Charlie immediately objected. "No, Sam, you never stop to think about
    how people feel. The emotional attachment that people feel for their operating
    system is much more powerful than you think. Right or wrong, her relationship
    with Windows has lasted over a decade. And now she''ll have to break it off and
    move on. It''s never easy!" Charlie turned to me. "You need to take the time to
    understand her feelings, and validate them."


    Our other friend, Marty, offered the most cynical opinion, as usual. "Don''t do
    it. The first time she hits something that Linux doesn''t do well, she''ll blame
    it on you. She''ll be at one of her meetings and some dork with Birkenstocks and
    a ponytail will show her his new Vista laptop from HP, and she''ll have a seg
    fault. Find someone else to take the rap."


    I couldn''t help but think that Marty had a good point. Switching to a new operating
    system can be challenging, and even if the old operating system is annoying and
    stupid, it''s what you''re familiar with.

    '
