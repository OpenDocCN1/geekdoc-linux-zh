    As a turn-based strategy game, Freeciv doesn’t try to compete with the adrenaline-releasing
    shooter games. Its challenge is more like that of a game of chess, but with hundreds
    of different types of pieces, and a game board as big as the Earth itself.


    Freeciv gives your creative side full play, as you carefully design your civilization,
    gathering resources, establishing cities, and developing an infrastructure. Finally,
    when your internal civilization is perfect, it’s time to go destroy everyone else
    in the game!


    In Freeciv, you start out with a few settlers in an undiscovered world of forests,
    mountains, oceans, rivers, and other terrain features. Settlers can found cities,
    and cities can grow to produce more settlers, as well as military units of various
    types, ranging from spear phalanx to jet fighter.


    Freeciv is based on the Civilization games, most notably on `Civ 2`. But Freeciv
    goes far beyond `Civ 2`, with more detailed graphics and a better user interface.


    My favorite unit in Freeciv is the nuclear missile, which can destroy an enemy
    city with a fun little mushroom cloud. But usually these are defeated by SDI defenses—unless
    you’ve sent a spy in to sabotage them first.


    Rome wasn’t built in a day, and your empire won’t be either. I’ve had Freeciv
    games that I’ve played over weeks, with more than 24 hours accumulated. And many
    is the civilization of mine that has gone down in a blaze of fire, with the quick
    movement of enemy units along my railroad lines—once they break into the heart
    of your empire, there’s nothing to stop them!


    For all things Freeciv, see the Web site at `http://www.freeciv.org/`. Windows
    users can also get together on the Net and play each other.


    ## McCoys and Spocks


    ### The Role of Computing Pioneers

    It’s true that the world of computing wouldn’t be what it is today without the
    McCoys and the Spocks, trying to help and trying to understand.


    The Kirks have their share of contributions, too, and it should be noted that
    games have always been one of the driving forces behind hardware and software
    development.


    So arm the torpedoes and activate the warp drive—it’s time to blast some aliens.


    # Office Tools


    ## Getting Out the Word


    Back in the old days, it used to be important to know how to spell.


    How well I recall hearing from my teachers how I would suffer for my lack of interest
    in spelling. "When you grow up, James, you will need to write letters, and your
    poor spelling will be a real handicap."


    I ignored all the good advice. And I turned out to be right, and they turned out
    to be wrong. They never would have believed me if I had told them that not only
    would I manage to succeed without good spelling, but that I could actually earn
    money with my writing. It was the invention of the word processing program that
    put all those warnings in the trash bin of life, and that allows me to survive
    and thrive, although I still can''t spell for crap. As a result, I have always
    felt sorry for those who could spell a word only one way.


    ### Early Word Processing

    In the early days of computers, there was no word processing—there was just text
    editing. The difference is that word processing allows you to do more than just
    manipulate a file of letters strung out in order. It also allows you to do fancy
    things like titles, bullet points, superscripts and other enhancements, which
    turn a plain series of letters into a formatted document.


    Way back in the early ''80s, the way to do real word processing was with a very
    expensive typesetting machine. These were about the size of a large desk and had
    a keyboard, primitive monitor and a large printer. To get your document, you would
    write it up by hand (or, if you did it a lot, on a typewriter), and turn it over
    to the typesetting specialist, who would re-type it into the typesetting machine,
    along with the special codes that were needed to control formatting, titles, etc.
    The typesetter would then print out a copy for you to check—called the galley
    proofs. You would read and correct these and send them back to the typesetter,
    who would enter your changes and run off another set of galley proofs for you.
    Eventually you would be satisfied with the results (or just too fed up to continue),
    and a final copy of the document would be printed for you.


    Does all that sound like a huge pain? Because it certainly was. Some of the problems
    with this primitive word processing included the fact that the machine and its
    operator were very expensive, and also usually busy, so turnaround was slow. Preparing
    a document could take a week, even after all the text was written. Furthermore,
    the whole procedure was possible only if you were lucky enough to work at a place
    that could afford one.


    ### The Early Word Processors

    The early word processors would be called text editors today because they didn''t
    even try to show you what you were getting. You might make some text bold-faced,
    and it would come out of the printer that way, but on the screen it looked the
    same as all the other text. The "What You See Is What You Get," or `WYSIWYG` (pronounced
    wis-eee-wig) was not available until better graphical monitors and operating systems
    were developed in the 1980s.


    `WYSIWYG` is a great idea, and a key feature of what we now recognize as a word
    processor. The first `WYSIWYG` editor was the (still) famous `Microsoft Word`,
    at that time a newcomer to the word processing market, trying to displace the
    much more popular `WordStar` program.


    ### They Grow Up So Fast

    It didn''t take long for `WYSIWYG` word processors to catch on, and new features
    started appearing as fast as dollars in the Gates checking account. Spelling and
    grammar checking, integration with spreadsheets, databases, diagramming software,
    more fonts and text-justification options all became standard parts of the word
    processing program.


    Eventually, as with most computer programs, the word processor developed ways
    to handle repetitive tasks with a simple form of internal programming, first with
    macros, then with dedicated scripting languages. As the concept of the word processor
    developed, so did the various software packages that met these needs. As invariably
    happens, the word processor has become a commodity product. There are many available,
    for a variety of prices, but they all do more or less the same thing. In the corporate
    world, `Microsoft Word` reigned.


    ### Getting Away From Microsoft

    Word has been a real moneymaker for Bill Gates, and still is. In fact, it used
    to cost so much money that it was cheaper in 1999 for workstation developer and
    manufacturer `Sun Microsystems` to buy a whole company than to buy a copy of `Microsoft
    Word` for each of its employees. The company was a German software outfit that
    had developed a knock-off of `Microsoft Word`, which was part of their suite of
    software called `StarOffice`. Sun turned around and immediately released the source
    into the free software community, and `OpenOffice` (`[www.openoffice.org]`) was
    born. There''s still a commercial version available from Sun for corporate users,
    which includes some extra tools and features, but the free Open Office suite already
    has everything I need.


    ### Running With The Pack

    These days, the `OpenOffice` word processor, called `Writer`, is almost indistinguishable
    from `Microsoft Word` (except that it''s free). It offers the full gamut of `WYSIWYG`
    features, and is what I am using to write this article. It can even read and write
    documents in Microsoft formats so that you can use `OpenOffice Writer` interchangeably
    with `Microsoft Word`. The latest releases of `Writer` even support the `Visual
    Basic for Applications` scripting language. This means even complex Word documents
    with significant scripting can be handled by `OpenOffice`.


    It''s Everywhere You Need To Be

