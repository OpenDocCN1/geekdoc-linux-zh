    # A Perl Beyond Price


    It seems to take a free software product about 20 years to reach full maturity.
    Most free software projects are begun by one avid (and slightly crazy) programmer.
    But if the product meets a genuine need in the community, a free software project
    will begin to attract other programmers, first as users, then as collaborators.


    Such is the case with a programming language named Perl. Started in 1996 by a
    programmer named Larry Wall, it was originally a program for helping to make sense
    out of the myriad text files that fill the life of a Unix system administrator.


    From those humble beginnings, Perl has gone on to become one of the most popular
    languages in computer history, with hundreds of thousands of users all over the
    world.


    ## Compiling vs. Interpreting


    At heart, every program, in every programming language, is a simple text file
    (or set of text files). Into this text file the programmer pours his work, trying
    to get every variable name, loop index, and semi-colon correct.


    Once the programmer thinks the program is ready to run, he faces the task of getting
    the computer to understand these text files and turn them into the kind of instructions
    that the computer can actually use.


    In some languages, this step is done just once—the programmer feeds his text files
    into another program, the compiler, and some runnable, binary files are constructed
    that can be fed right into the computer to run—no further processing needed. This
    is the case for the compiled languages, such as `C`, `C++`, `Fortran`, and many
    others.


    With other languages, such as `csh`, `Perl` and `Java`, the program is not compiled
    once; it is processed (or interpreted) each time you run it. Instead of having
    some binary files that can be understood by the computer, in interpreted languages
    the text files are reinterpreted each time.


    Using interpreted languages seems less efficient, because the computer has to
    figure out your source code every single time you run the program, instead of
    just once. In the olden times, this was considered a serious drawback, but these
    days, with so many CPU cycles going to waste anyway, we really don''t care about
    efficiency anymore.


    Another disadvantage of the interpreted languages is that the source code is required
    to run the program. With a compiled program, you just need the binary executable
    files, but with an interpreted program, you need all the source code. This is
    a problem if you want to sell proprietary software, and for that reason commercial
    software is almost always written in a compiled language. Perhaps because of these
    limitations, interpreted languages seem to have gotten a lot less attention from
    language developers, and most of the interpreted languages in the late ''90s suffered
    from poor syntax and poor resources for organizing large bodies of code—until
    Perl.


    ## There''s More than One Way to Do It in Perl


    One of the biggest differences between `Perl` and other languages is the number
    of ways that a task can be accomplished. In most languages, the idea is that there
    should be just one correct way to do each programming task. If there''s more than
    one way to get things done, the theory goes, programmer confusion will ensue,
    with some programmers doing things one way, and some the other way.


    In `Perl`, this is turned on its head. Instead of there being just one way to
    do things, there are many. It is up to the programmer to choose which way is most
    convenient. It''s true that this can easily result in poorly organized, confusing
    code. But it also allows the programmer to work very quickly, in the programming
    style that suits him or her best.


    ## Object-Oriented Powerhouse


    `Perl` functions very well as a procedural scripting language, like a sort of
    super-shell. It''s just like programming in `bash` or `csh`, except everything
    is a little (or a lot) more convenient.


    But `Perl` really begins to shine when its powerful, object-oriented features
    are used. With object-oriented programming, much larger programs can be written,
    without sacrificing organization of the code.


    As with `C++` (and unlike `Java`), `Perl`''s object-oriented features do not intrude
    into the language. It''s easy to write procedurally until you get a few pages
    of code, and then switch to object-oriented programming without throwing away
    all your existing code.


    ## A Little Help from Your Friends


    One of the advantages of object-oriented programming is that, if done correctly,
    it allows for the reuse of existing code. The idea is to gradually build up a
    library of objects that represent your problem space. In time, this growing body
    of code allows you to program more quickly.


    In practice, re-usability is difficult to achieve in the real world. But in the
    `Perl` world, you don''t have to try as hard. There exists the amazing code repository
    called `CPAN`, the `Comprehensive_Perl_Archive_Network` (`[www.cpan.org]`). This
    archive of freely available `Perl` code provides code modules and scripts for
    almost every imaginable task, from statistics to neural nets.


    Serious `Perl` projects start with a visit to `CPAN` to see what can be gleaned
    from this free software candy store, before spending time reinventing the wheel.


    ## Learning Perl


    `Perl` has the most extensive set of man pages of any Unix tool. Start with `"man
    perlintro` to get started. The beginner''s object-oriented tutorial is essential
    for those seeking to use the object-oriented features of `Perl`, but make sure
    you have a good understanding of procedural programming first.


    ## A Little Code Sample


    It''s impossible to come up with a `Perl` example that is representative of `Perl`
    programming, because it can look so very different, depending on the task and
    the programmer. This chameleon-like language suits all programmers, because it
    allows every programmer to code in something approaching his or her "native tongue,"
    whether that be `C`, `Java`, or `BASIC`.


    Here''s an example of some `Perl` code, to give an idea of what it can look like.


    ```perl

    use List::Util ''shuffle'';


    foreach $n ("n", "av", "j", "v", "p") {


    open(FILE, "/home/ed/visionator/.vis_".$n) &&


    (@{"$n"} = shuffle(split(",", <FILE>))) || die "no ".$n;


    }


    print "We will ".pop(@av)." and ".pop(@av)." ".pop(@v)." ".pop(@n)." ".

    "by ".pop(@p)." and utilizing our ".pop(@j).",

    ".pop(@j)." and ".pop(@j)." ".pop(@n).*bckslsh*n";

    ```


    This is a complete `Perl` program, which, using some ASCII files, creates a vision
    statement for any organization.


    ```bash

    bash-3.2$ perl vis.pl

    We will methodically and cooperatively encourage

    workshops by continuing evolution

    and utilizing our flexible, organizational and

    scalable challenges.


    bash-3.2$ perl vis.pl

    We will passively and proactively brainstorm action

    items by establishing managerial policies

    and utilizing our technical, diverse and narrow foci.


    bash-3.2$ perl vis.pl

    We will cooperatively and reactively clarify metrics

    by balancing supervisory roles and utilizing our valid,

    scalable and flexible strategies.

    ```


    Although many organizations devote hours or days to the development of a vision
    statement, this program can generate thousands of visions an hour, saving staff
    time for more valuable pursuits, such as learning `Perl`!


    # Bash vs. Perl Cage Match


    On a recent work project, I was dealing with about 500 lines of shell script.
    Now, 500 lines is not a large program. A usual Linux `C` program might have tens
    or even hundreds of thousands of lines of code. Microsoft Word has more than a
    million (but then, it''s famously bloated).

