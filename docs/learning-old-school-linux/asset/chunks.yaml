  trans: '


    最好的消息是，所有不同的图形组件都能良好地协作。对于用户来说，一个程序是为 `KDE` 还是 `GNOME` 开发的并不重要。它在两者上都能运行。


    ## 系统管理员的现实


    在 `Linux` 中，有一个定义且公开的层级，桌面软件在该层运行。在该层之上，用户可以看到对话框、鼠标指针以及现代 GUI 的其他方面。在这一层之下，一切都是文本编辑和命令行界面。那些华丽的系统管理员工具和文件管理器软件只是在这些现有功能上增加了一个门面。


    因此，始终存在跳过精美的图形工具、在命令行中进行系统管理的可能。这很有帮助，因为如果你被图形工具中所有复杂的操作搞乱了，你可以回到基础，弄清楚到底发生了什么。


    此外，你使用哪一套图形工具来操作系统并不重要。你可以在同一台系统上从 `GNOME` 切换到 `KDE` 工具，它们可以正常协作，因为它们处理的都是同一个底层层。


    ## 哪一个适合你？


    哪一个是最好的桌面软件包？这很难说。


    我已经同时使用了它们多年（在两台不同的电脑上），我真的无法说我更偏于其中一个。对于那些非常视觉导向的人来说，可能会有些偏好，但我可以在两者之间切换而甚至毫无察觉。在两种情况下，一切都运行得良好，而且我预期在电脑上找到的一切东西都在那里。对我来说，使用
    `KDE` 还是 `GNOME` 并不重要。


    通过 `Linux`，你拥有很多选择，但桌面环境的选择其实很简单：随用你手头有的哪一个即可。如果你不喜欢它的某些地方，或者只是想尝试新事物，就切换到一个新的桌面环境并尝试一下吧。


    在这一切之下，实际运行的实际上已经可靠运行了十年或以上的相同的基于文本的代码。桌面只是这台强大软件引擎上的一组精美的刻度旋钮。


    # X 标记之处


    当你第一次看 `Linux` 系统时，你会看到一些非常熟悉的东西。有桌面，上面有各种对象。有一个任务栏，上面有一些信息和按钮，还有一个无处不在的鼠标指针箭头——它呆在屏幕中间，但被我训练良好的大脑过滤在了视野之外，直到我需要找到它。


    你可能会注意到关于 `Linux` 桌面的一点：它看起来和 `Windows` 一样！


    这并非巧合，也不是 `Linux` 复制了雷德蒙那些“微型农民”的作品。这两个图形环境看起来相同的原因是它们都源自一个共同的源——`Xerox` 的第一个图形用户界面工作，以及其直接的衍生品
    `Apple Macintosh`。这些概念是在 `Xerox` 的帕洛奥托研究中心开发的，并且从那以后，它们以几种不同的方式结出了成果。


    ## X 的起源


    1983 年，在麻省学院计算机科学实验室，一些教授面临着一个问题。他们需要为学生提供一个计算环境，但他们有各种电脑，每台电脑都有自己不同的处理方式。他们决定创建一个可以在所有机器上运行、但在每台机器上看起来都相同的图形系统。他们将其命名为
    `X Window`，或者 `X`。


    换句话说，他们刻意设计了一个跨平台的图形用户界面；以前虽然有其他的图形界面，但 `X` 是第一个从一开始就为跨平台使用而编写的。


    这对程序员和硬件提出了额外的要求，并且让每个人的前期工作都增加了一点。但大家都认为这是一个优雅的设计。


    ## Windows 方式


    在 80 年代节奏快且竞争激烈的个人电脑行业中，优雅的设计被认为是一种奢侈品。在 `Windows` 操作系统，程序和用户界面之间没有分离。你运行一个程序（比如电子表格），一个窗口打开了，一段代码正在运行。代码与窗口并不是分离的——它们是一个包。所有内容都混合成一团代码并发货。


    忘记优雅吧。


    ## 以太网和其他疯狂的想法


    `X Window` 项目也是第一个充分利用高高速以太网（`Ethernet`）的图形用户界面。通过 `X Window`，用户界面可以位于运行它的程序的不同机器上。这是因为
    `X Window` 被设计为一个客户端-服务器系统。客户端是显示用户界面的程序，服务器是执行工作的程序。


    这种设计非常强大，因为它允许你在远程机器上运行程序。例如，你可以在远程机器上运行文本编辑器，并在本地机器上显示它。当你正在一台强大的服务器上工作但拥有一台速度慢的笔记本电脑时，这尤为有用。


    '
- fmt: '

    More than a year ago, my lovely and thoughtful wife gave me one of those newfangled
    MP3 players. If you haven''t heard of these, you must spend all your time in a
    cave (as I do).


    Oddly, perhaps, programmers like me are just not that good with gadgets. (Well,
    after spending eight or 10 hours trying to figure out how to get some complicated
    software working correctly, would you want to figure out a new gadget?)


    My history of gadgets is one of unused devices, complex features unexplored, and
    VCRs with blinking "00:00" instead of the correct time. I''ve never managed to
    record a TV show by timer, or call my answering machine remotely, or hook up my
    TV to my stereo speakers.


    This MP3 player sat on my desk for a year before I decided to give it a try.


    ## Computers! Do They Ever Work Right?


    The first step was to get an MP3 file and try to play it on my computer. Then,
    using my desktop Linux box, I could shop for music, store my collection, and then
    use the MP3 player to listen to it.


    When I tried to play an MP3 file on my Linux box, I was shocked to find that it
    didn''t work. There was an MP3 player, but when I tried to play an MP3 file, I
    got an error message telling me that the decoder was missing.


    In fact, nothing I did could make it work. I could play CDs just fine, but not
    MP3s. I popped in a set of Mozart opera arias while I tried to get things working.
    While the music was fine, my system administration was not, and I got nowhere
    quickly.


    (This is why I don''t mess with gadgets in the first place!)


    Fortunately, I have a good friend who has forgotten more about system administration
    than I will ever know. He came along and sat down at my system for a little while,
    humming his hum of concentration. I did what I am good at in such situations—I
    got a cup of coffee.


    When I came back, a funky European dance beat was blaring through my speakers.
    (Along with Mozart, that''s what I like to listen to.)


    Obviously, my system admin friend had gotten the MP3s to play. When I asked him
    how, he started to list the drivers and packages that he had to install.


    Yikes! This is exactly what new Linux users hate. With that other operating system,
    the one owned by a billionaire, everything like this just works. When I tried
    to play my MP3 file on a Windows box, the music just started without further ado.


    ## The Ultimate Terror—Lawyers


    The fault lies not in our stars, but in our lawyers. There are some licensing
    issues with MP3 that caused Fedora (my Linux distro) to drop MP3 support from
    its release.


    It all comes down to software patents.


    Software patents are the worst idea ever.


    They are deceptions perpetrated on those who are ignorant of software. Patent
    lawyers don''t know anything about software, so you can take any obvious software
    idea, phrase it in a new way, and file a patent for it, even though it is a well-known
    algorithm, or an obvious application of existing principles to a new area of engineering.


    What do the poor patent clerks know? They leave it for the courts to figure out.


    Whether or not lawyers can understand software is open to discussion, but everyone
    agrees that getting them to try is very, very expensive. No one wants to go to
    court because they violated a software patent, because who wants to spend more
    time talking about the law to a bunch of well-dressed people who charge $300 an
    hour?


    This give patents some power, even if they are ridiculous.


    I don''t know if the MP3 patent is ridiculous or not. Since music is just a data
    file (as far as the computer is concerned), the compression technique is not terribly
    important. MP3 is an excellent technique, but there are others, and some may be
    just as good or even better.


    It comes down to marketing. Everyone knows about MP3\. Everyone''s players and
    mobile phones handle MP3\. So, everyone wants MP3, and the MP3 patent holders
    can make money by selling the right to use their software idea.


    All of this has scared Fedora away from including MP3 support with its distribution,
    and who can blame the company? Software engineers are more frightened of lawyers
    than lawyers are of software engineering. After all, engineering has to make sense,
    whereas that is not at all required in the law.


    ## A Principled Stand for Free Software


    You have to admire the principled stand of Fedora and other free software distributors
    who respect the MP3 patent. They have taken the stand that they will release only
    code with which you, the user, have complete freedom. (Free as in "freedom of
    speech," not as in "free beer.")


    However this puts the user at some inconvenience when a popular commercial format
    is not supported. I think, over time, free software will evolve a better format,
    based on some of the existing free formats. The most obvious candidate is Ogg
    Vorbis format. Whether, or when, this will be adopted by the marketplace is less
    obvious.


    ## Where to Go to Get MP3 on Linux


    If you don''t hanker to learn all about installing packages on Linux, and don''t
    have a handy friend who can help, perhaps you can try following the instructions
    on the unofficial Fedora frequently asked questions list (`www.fedorafaq.org/#mp3`).


    Now that I can get my MP3s to play on my computer, the next step is to get them
    on and off my actual MP3 player!


    Maybe next year.


    # Captain Kirk Walks Among Us


    A co-worker of mine asserts that everyone falls into one of three personality
    types: Captain Kirk, Mr. Spock, or Dr. McCoy.


    Dr. McCoys are interested in helping everybody, Mr. Spocks are driven to understand
    everything, and Captain Kirks are driven hard for personal glory. According to
    my co-worker’s theory, only the Kirks among us are interested in computer games.
    People who enjoy computer games enough to spend this kind of time on them clearly
    have some strange personality problems. I say charge up the torpedoes, and let’s
    head for the neutral zone! Because, while the names and the faces may change,
    we all know that the basis of most computer games is destruction, and new aliens
    are just targets we haven’t met yet. Things aren’t any different in the Linux
    world.


    ## No Gravity


    No Gravity, a freeware game, will make your inner Kirk happy. A space shoot-em-up
    in the classic mold, it allows you to pilot your little fighter from system to
    system, blasting up otherhips along the way. As addictive as it is easy to use,
    it can suck away a Saturday morning faster than any other game I’ve tried.


    While learning this game, you’ll destroy dozens of enemy fighters—and a few on
    your own side—before you figure out how to tell friend from foe on the radar screen.


    The graphics are excellent, and gameplay with the mouse is outstanding. In no
    time, you will be using the mouse to navigate a ship of variable acceleration
    through a moving system of friendly ships, enemy fighters, mines, navigation beacons,
    and asteroids. Best of all, if anything gets in your way, relief is just a mouse
    click away, firing an array of interesting-looking pulses at whatever your space
    fighter is aimed at. A few well-placed shots will make enemy fighters flame, smoke,
    and eventually explode in a most satisfying manner.


    The game itself consists of a sequence of missions to complete in order to move
    on to the next level of play. Eventually, I’ll get to the end of one of the scenarios
    and find out what happens when you win. At the moment I’m much more familiar with
    explosions, flames, and spinning out of control, which are all associated with
    being destroyed.


    Go to the `No Gravity` website to download the game (for Linux, Mac or Windows)
    and the game data file. (You need both the game and the data file.)


    Freeciv

    '
