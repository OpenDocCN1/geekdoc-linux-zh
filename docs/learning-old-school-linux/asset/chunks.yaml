    下一行将告诉你是关于任务的所有信息——即在你的计算机上运行的各个程序。运行 X Window 的 Linux 计算机通常会有很多任务，但应该只有少数任务在运行。不用担心那些“僵尸任务”（zombie
    tasks）；你的电脑不会试图吃掉你的大脑。


    接下来是你的 CPU 摘要，以及它运行用户代码（即你启动的程序）、系统代码（操作系统的内容）、`nice` 代码（某人非常愉快地通过 `nice` 命令将其标记为不那么紧迫的代码）的忙碌程度，以及空闲的时间（通常是最大的数字），以及等待
    I/O 和处理硬件和软件中断的时间（在正常情况下，这些时间都应该接近于零）。


    接下来是内存的摘要，包括可用总量、已用量、空闲量以及当前存在的缓冲区（buffers）数量。不用担心缓冲区数量，但已用内存和剩余空闲内存是重要数字。当你几乎所有的内存都被用尽且剩余内存非常少时，意味着你应该购买更多的
    `RAM` 了。


    最后是对交换磁盘（swap disk）的摘要。交换磁盘的作用是处理 RAM 的溢出。如果你启动了太多的程序，并尝试使用超过你实际拥有的 RAM，计算机将提取你一段时间未用过的内容并将其写入交换磁盘，从而释放
    RAM。每当你尝试访问那部分内存时，计算机都会悄悄从交换磁盘中将其取回。


    在我的情况下，没有交换磁盘。这是我的系统——华硕 Eee 的特殊之处。


    # 任务列表


    在“摘要”（Summary）列表下方是一个不断变化的任务列表，其组织方式是将最活跃的任务放在最上方。每个任务（有时也称为进程）在启动时会被分配一个数字。这个数字没有特殊含义，它只是一种唯一标识任何任务的方法。任务列表的前两列显示每个任务的进程
    ID（PID）以及启动它的用户。然后是任务的优先级（priority）和人性值（niceness），接着是任务占用的内存大小、任务中多少比例仍驻留在内存中（而不是发送到交换磁盘），以及任务的内中有多少与一个或多个其他任务共享。


    接下来是最重要的两个数字：CPU 使用率和该任务正在使用的内存。这些将告诉你是哪个任务导致了你在等待。最后两列显示了任务使用的累计 CPU 时间以及任务名称（正在运行的程序）。


    # 交互式命令


    `top` 是那些疯狂的 Linux 命令行程序之一，功能被增强到了极致。几乎没有这个命令做不到的事情，它那令人眼花缭乱的命令行选择和选项会让拥有数小时空闲
    Unix 大师感到兴奋，让他们花时间去阅读 `man` 页面并弄清楚 `top` 可以实现的所有技巧。


    考虑到该程序是针对系统管理员的，我猜发现软件上挂载了这么多功能并不令人意外。系统管理员对于了解系统内部正在发生什么简直是近乎痴执的。可以通过在 `top`
    运行时按正确的键来使用这些功能（因此，你需要在另一个窗口中打开一个 `man` 页面来尝试它们）。


    但每隔一段时间，这些额外的小功能就会恰好成为你所需要的。最近，我在想自己是否充分利用了双核系统的优势。如何真正知道呢？事实证明 `top` 有一个交互式命令
    `1`，它可以显示系统中每个 CPU 的使用情况。通过看到它们都在努力工作，我得以确认自己确实在充分利用系统的最大性能。


    # 你为什么在等待


    对 `top` 程序有了基本的了解后，你现在能够回答本栏开头提出的问题：当你等待电脑时，你等的是什么？只需打开 `top` 查看顶部的一两个任务，你就会得到答案。


    `top` 程序还允许你准确看到每个程序是如何使用计算机的——在那个机器上运行每个任务消耗了你多少内存和 CPU。


    # 磁盘空间——最后的边疆


    在过去那些糟糕的日子里，我们的磁盘总是满的。我多地记得 80 年代我使用的那个 300 兆云盘驱动器。它的大小就像洗衣机一样。这当然是一台大型计算机的一部分，拥有自己专门的机房。在个人电脑出现后，当我看到第一块外接硬盘时感到非常惊讶；它大约是两本大精装书叠在一起的大小。而且它装了整整
    10 兆字节。


    如今，你花 100 美元就能买到一个 500GB 的硬盘。我们甚至懒得清理磁盘了——很难想象 500GB 会被填满（但我知道 10 年后，我会认为 500GB
    是一个很小的磁盘空间！）


    当磁盘空间紧张时，我们使用过几种工具来确定删除哪些文件以释放一些磁盘空间。我已经多年没用过它们了，因为大硬盘太廉价了，但我这台小小的华硕 Eee 电脑没有磁盘，只有
    4GB 的静态 RAM。


    虽然 4GB 看起来很多（比我的第一台 PC 硬盘大 4000 倍），但在拥有这台电脑仅几周后，我就已经填满了。噢，天哪。


    # 老牌备用：df


    在遇到任何磁盘空间问题时，Linux 大师的首选命令都是 `df` 命令。它显示磁盘上的空间量。它显示每个文件系统的容量（以 KB 为单位）、已用、可用、使用百分比以及挂载点。


    在我的电脑上运行 `df` 时，看起来有点奇怪，因为 Eee 在做一些事情。


    ```

    $ df

    Filesystem Used Available Use% Mounted on

    root 14570 88792 49212 65% /

    /dev/sda1 14570 88792 49212 65% /

    unionfs 14570 88792 49212 65% /

    tmpfs 254164 0 254164 0% /dev/shm

    tmpfs 131072 0 131072 0% /tmp

    ```


    使用 `-h` 选项可以获得更易读的形式。


    # Eee 的愚蠢


    这张图片中令人困惑的是，我使用的这台小 Eee 对其文件系统做了一些有些愚蠢的事情。为了在启动时恢复原始软件，Eee 保留了所有软件的只读副本。这在 PDA
    世界是典型的，但在计算机系统中并不常见。对于像 Eee 这样的电脑，这真的没有必要，因为电脑可以从 USB 设备恢复。我已经找到了一种移除这些业务并回收那些磁盘空间的方法，但我还没有尝试。


    # 使用 du


    `du` 命令（意为“磁盘使用量”）将向你显示每个子目录占用多少空间。这是我的 Eee 上累积的邮件。（令人惊的——仅仅过了几个月就有 110MB 了！）


    ```

    $ du -h

    16K ./friends

    68M ./rmiug

    4.0K ./drafts

    2.7M ./CLUE

    12K ./returned

    24K ./cygwin

    188K ./science

    368K ./school

    600K ./oracle

    1.4M ./other

    11M ./opera

    9.3M ./mingw

    3.0M ./spam

    2.1M ./archive/mail

    2.1M ./archive

    12M ./junk

    16K ./me

    110M .

    ```


    有关 `du` 命令的更多信息，请尝试执行 `man du`，但这个工具没什么好读的。

