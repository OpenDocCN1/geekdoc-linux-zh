    Backward-Chaining Logic


    The concept of make is very simple: You tell it what you want, and it figures
    out what it needs to do to get that.


    Of course, it can''t do this on its own—make needs the programmer to create a
    control file that describes what can be built (the targets) and how they should
    be built (the rules). The programmer can also specify dependencies between files,
    specifying which source files are used to create an executable. With all this
    information, make can decide on the minimal set of steps to get your executable
    built.


    Since the operating systems keep track of the current time and the last modification
    time for all files, it''s possible for make to decide which of your files should
    be recompiled (because you have changed the source code since the last compile),
    and which should be left alone.


    The specification file is called a Makefile (note the upper-case M). Creating
    and maintaining them can be a real hassle, but not as much as building software
    without them.


    An Example


    The following Makefile builds a program called find_primes. The program is built
    from two different source code files, find_primes.c and calc.c. (This is the program
    from last week''s column, but broken into two separate files to illustrate the
    use of make.)


    This is a very simple example—a real project might have dozens or hundreds of
    source files.


    # Makefile for find_primes example.


    # James Hartnett 5/2/08


    CFLAGS=-g -Wall


    all: find_primes


    find_primes: find_primes.o calc.o


    gcc -o $@ $^


    find_primes.o: find_primes.c


    gcc $(CFLAGS) -c -o find_primes.o find_primes.c


    calc.o: calc.c


    gcc $(CFLAGS) -c -o calc.o calc.c


    clean:


    rm -f find_primes *.o


    Lines that begin with the hash (#) are comments. The CFLAGS= line illustrates
    the use of environment variables in Makefiles. The rest of the file contains five
    targets, their dependencies, and the rules to make the target from the dependency.


    The first target, all, is a special target—use this target to list all the things
    you would like this Makefile to make. In this case it lists find_primes as a dependency.
    Dependencies are sub-targets that must be built before the target is attempted
    to be built by executing the rule, if any.


    The second target is find_primes, the executable we are interested in. It depends
    on the two object files, find_primes.o and calc.o. The rule for this target is
    the command using GCC to build find_primes from the object files.


    The next two targets show how to build the object files find_primes.o and calc.o
    from the source files, find_primes.c and calc.c.


    The final target, clean, has no dependencies. Its rule is an rm command, which
    removes the executable and also the object file. This commonly used target allows
    us to type make clean in order to delete all created files and start fresh.


    With this Makefile, the developer can modify any of the source files, and then
    issue the "make all" command to have the executable built. Only those code files
    that have changed will be recompiled, and make will figure out all the steps needed
    to get your program built.


    Built-in Rules, Special Symbols and Other Arcana


    It all seems reasonably simple, but only because the example does not really represent
    how a Makefile looks in the wild. Note that certain strings are repeated in several
    places in our sample Makefile. For example, the string "find_primes" is repeated
    in numerous places in the file. Programmers hate that. Not only is it boring to
    read, but it increases the chance that the string might be mistyped in one place
    or another, leading to a bug. Far better to have each string in just one place.


    Furthermore, make makes a lot of assumptions. And since make and the C programming
    language grew up together, the assumptions made by make are quite good when you
    are programming C code, as we are in this example. You don''t have to tell make
    how to turn C source code into object files. Make knows more about it than you
    do, and can be trusted to handle those details.


    Make has some special symbols defined, which help with the repeating string problem.
    They make the Makefile a little hard to understand for the uninitiated, but that''s
    the way the cookie crumbles over the keyboard of life.


    Here''s the same Makefile, taking advantage of some of the special symbols and
    other shortcuts offered by make. I suspect there are more I could take advantage
    of, if I spent a few hours more with the GNU make manual ([www.gnu.org/software/make/manual/html_node/index.html](http://www.gnu.org/software/make/manual/html_node/index.html)).


    # Makefile for find_primes example.


    # James Hartnett 5/2/08


    CFLAGS=-g -Wall


    all: find_primes


    find_primes: find_primes.o calc.o


    gcc -o $@ $^


    clean:


    rm -f find_primes *.o


    Brevity Is the Soul of Confusion


    You may praise the terseness of Unix on many occasions, but none of them will
    be while debugging Makefile problems. The backward-chaining of the logic, the
    built-in rules, the use of special symbols, all cause make to be a real challenge.
    The verbose option (-v) can be used to resolve any question about what make is
    doing, but the output is so very verbose that following what is going on is still
    about as fun as picking diseased fleas off a cranky mountain lion.


    But when it''s all you have, it''s all you have.


    The Future of Make


    Although make has enjoyed a spectacular success story, its shortcomings have become
    the stuff of legend. The complexity of make has contributed to an aura of black
    magic from the very beginning. Make has earned its place in the pantheon of software
    tools, but it has also earned a lot of curses over the years.


    For very complex projects, the creation and maintenance of Makefiles becomes a
    full-time job. Makefiles that work on one machine usually will not work well on
    a different machine, and having portable Makefiles becomes a problem for teams
    that want to distribute their source code (as free software programmers tend to
    do). In the end, babysitting the build system becomes a significant task.


    This, of course, leads to even further automation. In a future column, I''ll go
    over the successor tool, automake, which builds portable Makefiles and has a much
    simpler syntax. However, automake does not replace make, it simply uses it in
    a portable way. And make is still just right for small projects with only a few
    code files. For all of these reasons, Stuart Feldman''s tool lives on in the hearts
    and minds of Linux programmers.


    Code File: find_primes.c


    /* Find prime numbers


    James Hartnett, 5/2/08


    */


    #include <stdio.h>


    #include <stdlib.h>


    #define MAX_NUM 1000


    #define NUM_PRIMES 10


    int calc(int max_num, int num_primes, int *n, int *prime);


    int


    main()


    {


    int *prime;


    int i;


    int n = 1;


    if (!(prime = malloc(NUM_PRIMES * sizeof(int))))


    {


    printf("no memory!n");


    return 1;


    }


    if (calc(MAX_NUM, NUM_PRIMES, &n, prime))


    return 1;


    for (i = 0; i < n; i++)


    printf("%dn", prime[i]);


    free(prime);


    return 0;


    }


