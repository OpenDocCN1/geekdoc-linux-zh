    time spent idle (usually the largest number), and the time spent waiting for I/O
    and serving hardware and software interrupts (which should all be near zero under
    normal conditions).


    The memory is summarized next, with the total amount available, the amount in
    use, the amount free, and the number of buffers currently existing. Don''t worry
    about the number of buffers, but the amount of memory in use and the amount left
    free are important numbers. When you have almost all your memory in use and very
    little free memory, it means you should buy more RAM.


    Finally, the swap disk is summarized. The swap disk is there to handle overflow
    from RAM. If you start too many programs, and are trying to use more RAM than
    you really have, the computer will take something you haven''t used for a while
    and write it to the swap disk, freeing up the RAM. Whenever you try and access
    that memory, the computer will sneak off and grab it off the swap disk.


    In my case, there is no swap disk. This is a peculiarity of my system, the ASUS
    Eee.


    The Task List


    Under the Summary list is an ever-changing list of tasks, organized so that the
    most active are on the top. Each task (or process, as it is sometimes called)
    is assigned a number when it is started. The number has no particular meaning,
    it''s just a way to uniquely identify any task. The first two columns of the task
    list show the process ID of each task, and the user who started it. Then comes
    the priority and niceness of the task, then the amount of memory the task takes
    up in memory, how much of the task is still resident in memory (as opposed to
    being sent to the swap disk), and how much of the tasks memory is also shared
    with one or more other tasks.


    Next comes the most important two numbers: the percentage CPU and the memory that
    this task is using. These will tell you which task is causing you to wait. The
    final two columns show the cumulative CPU time used by the task, and the name
    of the task (the program that is running).


    Interactive Commands


    Top is one of those crazy Linux command-line programs that is just souped up to
    the max. There is practically nothing this command can''t do, and its bewildering
    array of command-line choices and options will delight the Unix guru with hours
    to spend reading the man page and figuring out all the tricks that are possible
    with top.


    Considering the program is targeted at system administrators, I guess it''s not
    too surprising to find so many features hanging off the software. System admins
    can be downright obsessive about knowing what is going on in their system. These
    features can be used by hitting the right keys while top is running (so you will
    need a man page open in another window to try them out).


    But every now and then, these little extras become just what you need. Recently
    I was wondering if I was taking full advantage of a dual-core system. How to really
    know? Turns out that top has an interactive command 1, which shows the usage of
    each CPU in the system. By seeing that they were both working hard, I was able
    to confirm that I was really getting the most out of the system.


    Why You Wait


    With a basic understanding of the top program, you are now able to answer the
    question posed at the beginning of this column: What are you waiting for when
    you wait for your computer? Just open top and look at the top one or two tasks,
    and you will have your answer.


    The top program also allows you to see exactly how each program is using the computer—what
    it is costing you in memory and CPU to run each task on that machine.


    # Disk Space--the Final Frontier


    Back in the bad old days, our disks were always full. How well I remember the
    300-megabyte platter drive I had to use back in the ''80s. It was about the size
    of a washing machine. This was, of course, part of a large computer, with its
    own dedicated computer room. After the personal computer came along, I was amazed
    when I saw my first external hard drive; it was about the size of two large hardcover
    books stacked on top of each other. And it held a whole 10 megabytes.


    These days, you can get a 500-gigabyte drive for less than $100\. We don''t even
    bother cleaning our disks off—it''s hard to imagine ever filling up 500GB. (Yet
    I know that in 10 years, I''ll think of 500GB as a small amount of disk space!)


    When disk space was tight, there were several tools we used to figure out which
    files to delete in order to free up some disk space. It''s been many years since
    I''ve used them, because of the cheapness of giant disks, but with my little Asus
    Eee computer, there is no disk, only 4GB of static RAM.


    And while 4GB seems like a lot (4,000 times larger than my first PC hard drive),
    I have already filled it after only a few weeks of owning the computer. Oh, deary
    me.


    The Old Standby: df


    In any kind of disk-space problem, the first command of the Linux guru will be
    the df command. It shows the amount of space on the file systems mounted on your
    computer.


    When I run df on my computer, it looks a bit funny, because the Eee does some
    funny things with its disks. The df command lists each mounted file system, its
    total size (in KB, by default), the amount used and available, the percentage
    in use, and where the file system is mounted.


    ~ $ df


    Filesystem 1K-blocks Used Available Use% Mounted on


    rootfs 1454700 888792 492012 65% /


    /dev/sda1 1454700 888792 492012 65% /


    unionfs 1454700 888792 492012 65% /


    tmpfs 254164 12 254152 1% /dev/shm


    tmpfs 131072 72 131000 1% /tmp


    If you can'' t figure out which filesystem applies to you, go to your home directory,
    and run the df command with a period as an argument. This will show the information
    for the current disk, the one that holds your home directory. And using the -h
    option gives the output in more readable form.


    ~ $ df -h .


    Filesystem Size Used Avail Use% Mounted on


    unionfs 1.4G 869M 481M 65% /


    This tells me that I have only 492MB free on my computer. It sounds like a lot,
    and it is, but these days we''re so greedy with disk space that it won''t last
    long if I don''t watch it carefully.


    Yet I am seeing only 1.4GB total space, and I expect 4GB?


    Some Eee Silliness


    Something that is confusing about this picture is that the little Asus Eee that
    I am using is doing something a bit silly with its file systems. In order to be
    able to restore the original software on boot, the Eee keeps a read-only copy
    of all the software distributed with the system. This is typical in the PDA world
    of Palm, but not very usual with a computer system. With a computer like the Eee,
    there''s really no need for this, as the computer can be restored from a USB device.
    I have found a way to remove this business and recover that disk space, but I
    haven''t tried it yet.


    Using du


    The du command (which stands for "disk usage") will show you how much space is
    used in each subdirectory. Here''s my accumulation of mail messages on my Eee.
    (Frightening—110MB after only a few months!)


    ~/Mail $ du -h


    16K ./friends


    68M ./rmiug


    4.0K ./drafts


    2.7M ./CLUE


    12K ./returned


    24K ./cygwin


    188K ./science


    368K ./school


    600K ./oracle


    1.4M ./other


    11M ./opera


    9.3M ./mingw


    3.0M ./spam


    2.1M ./archive/mail


    2.1M ./archive


    12M ./junk


    16K ./me


    110M .


    ~/Mail $


    </pre>


    For more information about the du command, try man du, but there''s not much to
    this tool.


    Using find to Catch the Big Fish'
