    我的一位大学哥有一个很棒的词来形容商务专业学生修的那些水水数学课。他称之为“假装数学”。这个术语也适用于 Windows 版本的 shell，即 DOS shell。据报道，它是比尔·盖茨在飞往会
    IBM IBM 工程师途中编写的，这些工程师将在新的（当时意义上的）IBM PC 上使用它。我不知道这个故事是否真实，但我很难不相信它。任何遇到过 DOS
    shell 那些阉割功能的 UNIX 用户，都会毫不毫不相信它是在飞机上写出来的，并且伴随着可能暗示的所有分心和限制。DOS shell 是一个“假装” shell，几乎没有
    UNIX shell 的力量和优雅，而后者正是被廉颜无耻地复制的。DOS shell 是一个劣质的仿品。


    ## 今天的 Shell


    如今，Linux 机器上的几乎所有操作都可以通过正在使用的任何 GUI 来完成，但这并不意味着命令行变得毫无用处——它是专家人士的工具。它允许你使用强大且简洁的语法运行命令，并提供各种工具来帮助你自定义与计算机的交互。


    shell 依然在那里，一如既往，等待着那些愿意花时间去了解它的用户提供强大的接口。


    ## Bash 提示符的乐趣


    每个命令行界面必须有某种形式的提示符字符串——打印在终端上的某些东西，指示轮到你输入——以告诉计算机做什么。然后你发布一个命令，当命令完成后，提示符再次出现，让你知道计算机已准备好接受更多输入。


    当我启动我的 `bash` shell 时，我看到：

    ```

    ~> .

    ```


    这是我的目录（`"~"` 表示主目录），然后一个角括号和一个空格表示提示符的结束。（这个空格很重要；如果没有这个空格，命令行看起来会非常拥挤且难看。）


    和 Linux 中的绝大多数事物一样，这可以由用户自定义。你通过设置环境变量 `PS1` 来更改提示符，你可以做很多很酷的事情来让提示符变得更有用、更有趣。


    ### 设置环境变量


    在 `bash` 中设置环境变量时，请使用 `export` 命令。一旦你设置了 `PS1` 变量，命令行会立即变化。


    ```

    ~> export PS1=''what is your command human? ''


    what is your command human?

    ```


    在使用 `export` 时，重要的是不要在等号（`=`）周围留空格。在你设置的变量、等号以及你正在设置的值之间不能有任何空格。还要注意在字符串值周围使用的单引号字符。如果没有这些引号，shell
    会被字符串中的空格搞乱，并将 `PS1` 设置为 `"what,"`，然后尝试将字符串的其余部分作为 `export` 的额外参数进行处理。


    你的键盘上有三种引号：单引号、反引号（方向相反的单引号）和双引号。在美式键盘上，单引号和双引号在同一个键上，靠近回车键（Enter）。反引号在左上角，与波浪号在一起。每组引号的含义都不同，所以请确保你使用的是正确的一个。


    若想玩玩提示符，你可以从命令行设置它们，但若要更改默认提示符，你必须在 `.bashrc` 文件中设置 `PS1` 变量。


    通过设置 `PS1`，你可以让任何字符串作为你的提示符。但还有更多！


    ### 内置字段


    `bash` shell 有了一系列用于提示符的内置字段——你可以放入 `PS1` 中的特殊字符字符串，以更改提示符的外观。例如，如果你想在提示符中显示时间，在
    `PS1` 中使用 `\D{}`。


    ```

    what is your command human? export PS1="\D{}> "


    07:54:11 AM>

    ```


    有几十个内置字段，例如上面的日期和时间字段（可以通过在花括号之间放置正确的字符串进行格式化）。


    一些实用的字段包括主机名（`\h` 或 `\H`）、用户名（`\u`）和当前工作目录（`\w` 或 `\W`）。除了上面显示的 `\D{}`，还有许多方法获取日期和时间或其中之一。


    ### 彩色


    设置提示符还允许你更改文本颜色，甚至是背景颜色。这有点像黑魔法，但在你的提示符开头添加字符串 `\[\033[1;31m\]`，在结尾添加字符串 `\[\033[0m\]`。第一串奇怪的字符告诉
    shell 使用浅红色作为文本颜色，而另一串告诉 shell 关闭任何颜色变化并恢复默认颜色。如果你不包含这部分，不仅是你输入的内容，计算机的响应也将是浅红色的。


    当然，浅红色不是唯一可用的颜色——完整的颜色代码列表可以在 `bash` man 手中找到。它们的范围从黑色（`0;30`）到白色（`1;37`），之间有很多，如青色（`0;36`）、棕色（`0;33`）和紫色（`1;35`）。


    如果你在颜色数字上加上 10，更改的就是背景颜色而不是文本颜色。例如，包含 `\[\033[1;45m\]` 将背景颜色变为紫色。`1;45` 是紫色颜色数字（`1;35`），在第二个数字上加上
    10。


    我不知道是谁想出这种在提示符中设置颜色的疯狂方法，因为它几乎没有更混乱了。但同时使用这两个功能允许你同时更改背景和文本颜色。例如，将你的提示符设置为 `\[\033[1;45m\]\[\033[1;37m\]\d
    \[\033[0m\]` 将给你在紫色背景上白色的日期。


    在那个看起来奇怪的字符串中，有四个部分。第一部分 `\[\033[1;45m\]` 开启紫色背景。第二部分 `\[\033[1;37m\]` 开启白色文本。第三部分
    `\d ` 显示日期，后面跟着一个空格，最后部分 `\[\033[0m\]` 关闭所有花哨的颜色。


    ### 提示符历史课


    “只做一件事，并做好。”这句话启发了早期的 UNIX 程序员。UNIX 由各种工具组成，每个工具都极其专注。但当你将它们组合时，可以产生复杂的结果。Windows
    和 UNIX 的根本区别在于，Windows 设计是为了易于使用，而 UNIX 设计之是为了纯粹的力量。


