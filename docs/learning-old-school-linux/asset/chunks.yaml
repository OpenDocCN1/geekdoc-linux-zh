    这些程序比之前的软件复杂得多，拥有更多的代码文件。将每个命令传递给编译器和链接器变成了一项艰巨的任务。与用于将单个代码文件编译为可执行文件的单行 `GCC`
    命令不同，更复杂的程序是通过一系列步骤构建的，且这些步骤必须按照正确的顺序执行。需要发出几十甚至上百个命令。


    对于可怜而简单的程序员来说，跟踪所有这些内容是一项复杂的任务。此外，这还是重复且无聊的。换句话说，这是一项需要软件自动化的任务。而这正是 Stuart Feldman
    通过 `make` 工具实现的。


    ## 后向链逻辑（回溯逻辑）


    `make` 的概念非常简单：你告诉它你想要什么，它就会计算出为了该目标需要执行什么。


    当然，它不能独立完成任务——`make` 需要程序员创建一个控制文件，描述可以构建什么的内容（目标 `targets`）以及应该如何构建它们（规则 `rules`）。程序员还可以指定文件之间的依赖关系，明确使用哪些源文件来创建可执行文件。有了所有这些信息，`make`
    就可以决定构建你的可执行文件的最小步骤集。


    由于操作系统会跟踪当前时间以及所有文件的最后修改时间，`make` 能够决定你的哪些文件应该重新编译（因为你自上次编译以来更改了源代码），而哪些文件应该保持不变。


    该规范文件被称为 `Makefile`（注意大写的 M）。创建和维护这些文件可能是一件麻烦事，但比没有它们的情况下构建软件要容易得多。


    ## 示例


    以下 `Makefile` 构建了一个名为 `find_primes` 的程序。该程序由两个不同的源文件 `find_primes.c` 和 `calc.c`
    构建而成。（这是上周专栏中的程序，但为了被拆分成了两个独立的文件，以说明 `make` 的用法。）


    这是一个非常简单的示例——真实的项目可能有几十或上百个源文件。


    ### find_primes 示例的 Makefile。


    ```makefile

    # find_primes 示例的 Makefile

    # James Hartnett 5/2/08


    CFLAGS=-g -Wall


    all: find_primes


    find_primes: find_primes.o calc.o


    gcc -o $@ $^


    find_primes.o: find_primes.c


    gcc $(CFLAGS) -c -o find_primes.o find_primes.c


    calc.o: calc.c


    gcc $(CFLAGS) -c -o calc.o calc.c


    clean:


    rm -f find_primes *.o

    ```


    以哈号（##）开头的行是注释。`CFLAGS=` 这一行说明了环境变量在 `Makefiles` 中的用法。文件的其余部分包含了五个目标、它们的依赖项以及从依赖项生成目标的规则。


    第一个目标 `all` 是一个特殊目标——使用此目标可以列出你希望此 `Makefile` 生成的所有内容。在这种情况下，它将 `find_primes`
    列为一个依赖项。依赖项是子目标，在尝试执行规则（如果有的话）构建目标之前，必须先构建这些目标。


    第二个目标是 `find_primes`，即我们感兴趣的可执行文件。它依赖于两个对象文件 `find_primes.o` 和 `calc.o`。该目标的规则是使用
    `GCC` 从对象文件构建 `find_primes` 的命令。


    接下来两个目标展示了如何从源文件 `find_primes.c` 和 `calc.c` 构建对象文件 `find_primes.o` 和 `calc.o`。


    最后一个目标 `clean` 没有依赖项。它的规则是一个 `rm` 命令，用于删除可执行文件以及对象文件。这个常用的目标允许我们通过输入 `make clean`
    来删除所有创建的文件并从头开始。


    通过这个 `Makefile`，开发者可以修改任何源文件，然后执行 `make all` 命令来构建可执行文件。只有发生变化的代码文件会被重新编译，而 `make`
    会计算出构建你的程序所需的所有步骤。


    ## 内置规则、特殊符号和其他奥秘


    这一切看起来似乎很简单，但仅仅是因为这个示例并没有真正代表现实环境中的 `Makefile` 样子。注意在我们的示例 `Makefile` 中，某些字符串在多处重复。例如，字符串
    `"find_primes"` 在文件中出现了许多处。程序员非常讨厌那样的。这不仅读起来很无聊，还增加了字符串在某处被错错的概率，从而导致 bug。让每个字符串只出现在一个地方要好得多。


    此外，`make` 做了很多假设。由于 `make` 和 C 语言语言是共同成长的，当你编写 C 代码时（如本示例所示），`make` 所做的的假设是非常靠谱的。你不需要告诉
    `make` 如何将 C 源码转换为对象文件。`Make` 比你更了解它，并且可以信任它来处理这些细节。


    `make` 定义了一些特殊符号，有助于解决字符串重复的问题。它们让初学者觉得 `Makefile` 稍微有点难以懂，但这就是生活键盘上的常态。


    这里是同一个 `Makefile`，利用了 `make` 提供的一些特殊符号和其他快捷方式。我怀疑，如果我再花几个小时去研究 GNU make 手册（[www.gnu.org/software/make/manual/html_node/index.html](http://www.gnu.org/software/make/manual/html_node/index.html)），还有更多可以利用的方法。


    ```makefile

    # find_primes 示例的 Makefile

    # James Hartnett 5/2/08


    CFLAGS=-g -Wall


    all: find_primes


    find_primes: find_primes.o calc.o


    gcc -o $@ $^


    clean:


    rm -f find_primes *.o

    ```


    ## 简洁是混乱之灵魂


    你可能在很多时候赞美 Unix 的简洁，但在调试 `Makefile` 问题时，没有任何一次会这样做。逻辑的后向链、内置规则、特殊符号的使用，都使得 `make`
    成为一个真正的挑战。冗余选项（`-v`）可以用于解决关于 `make` 正在做什么任何问题，但输出过于冗长了，以至于追踪发生的情况仍然像从暴躁的山狮身上挑带病的小跳子一样无趣。


    但当你只有这些手段时，它们就是你的全部了。


    ## Make 的未来


    尽管 `make` 取得了巨大的成功，但它的缺点已经变成了传奇。`make` 的复杂性从一开始就贡献了一层神秘色彩。对于非常复杂的项目，创建和维护 `Makefiles`
    变成了一项全职工作。


    由于这些原因，Stuart Feldman 的工具依然活在 Linux 程序员的心中和记忆中。'
