    # Open Office Calc Spreadsheet


    Gnumeric is an older and more stand-alone application. Not part of any office
    suite, it nonetheless completely replaces Excel on the user''s desktop.


    ## Which One to Use?


    Once again, the theme for the new Linux user is one of choice. Unlike other, proprietary
    operating systems, Linux offers more than one spreadsheet application. So which
    one is a new user to choose?


    As a somewhat casual spreadsheet user, I can only say that I have never found
    anything that either program could not do just as well as MS Excel. Both are perfectly
    adequate replacements—both can open, edit and create spreadsheets in MS Excel
    format. Both can handle graphs and charts, statistical analysis and complex extensions
    and customizations. Both offer excellent compatibility with Excel spreadsheets.


    Use whichever one you find on your Linux machine. Whichever you choose will work
    just fine!


    # The Adventure Continues


    Some time around 2010, ComputorEdge stopped their print edition, and became an
    on-line magazine only (though still with local editions, including one for Colorado).
    Due to financial limitations Jack was unable to continue to pay for these articles,
    and so I stopped writing them. In the years I had been writing them I learned
    a lot, grew a lot as a programmer and perhaps as a writer, and had a lot of fun.
    I miss writing them!


    But the computer industry continues to grow and change. New technologies come
    on to the already crowded landscape with exciting and ever-increasing frequency.
    Computer software is changing our lives more and more as each day passes. There
    is always more to learn, and more to do.

