  raw: 'The best news is that all the different graphics'' pieces play nicely together.
    It doesn''t matter to the user whether a program was developed for KDE or GNOME.
    It will work on both.


    The System Admin Reality


    With Linux, there is a defined and public layer at which the desktop software
    works. Above that layer, the user sees dialog boxes and mouse cursors, and other
    aspects of the modern GUI. Below that layer, everything is text editing and command-line
    interface. The fancy system-admin tools and file-manager software are only putting
    a facade on this existing functionality.


    As a result, there is always the possibility of bypassing the pretty graphic tools
    and doing your system administration on the command line. This helps, because
    if you are getting confused by all the tricky operations of your graphics tools,
    you can go back to the basics and figure out what is going on.


    It also doesn''t matter which set of graphical tools you use to manipulate the
    system. You can switch from GNOME to KDE tools on the same system, and they will
    inter-operate OK because they both are dealing with the same underlying layer.


    Which One Is for You?


    Which is the best desktop package? That''s hard to say.


    I have used both for years (on two different computers), and I can''t really say
    that I prefer one to the other. For those who are very visually oriented there
    could be some preference, but I can go from one to the other without even noticing.
    In both cases, everything just works, and everything I expect to find on a computer
    is there. For me, it doesn''t matter whether I use KDE or GNOME.


    With Linux, you are offered a lot of choices, but the choice of desktop environment
    is pretty easy: Just take whatever one you have handy. If you don''t like something
    about it, or just want to try something new, switch to a new desktop environment
    and give it a try.


    Underneath it all, the same text-based code that has operated reliably for a decade
    or more will actually be running. The desktop is just a pretty set of dials on
    this mighty software engine.


    # X Marks the Spot


    When you first look at a Linux system, you see some very familiar stuff. There''s
    the desktop, with various objects on it. There''s a taskbar, with some information
    and buttons, and there''s the ubiquitous arrow of the mouse pointer—sitting there
    in the middle of the screen, but edited out of view by my well-trained brain,
    until I need to find it.


    Something you might notice about the Linux desktop: It looks just like Windows!


    This is not a coincidence, but neither is it a case of Linux copying the work
    of the microserfs of Redmond. The reason that the two graphical environments look
    the same is that they are both derived from a common source—the first graphical
    user interface work at Xerox, and the immediate derivative, the Apple Macintosh.
    It was at Xerox''s Palo Alto Research Center that these concepts were developed,
    and they have come to fruition in several different ways since then.


    The Beginnings of X


    In 1983 at the MIT Laboratory for Computer Science, some professors were having
    a problem. They needed to provide a computing environment to the students, but
    they had a wide variety of computers, each with its own different way of doing
    things. They decided to create a graphical system that would run on all these
    machines, but that would look the same on every machine. They called it X Window,
    or X.


    In other words, they deliberately designed a cross-platform graphical user interface;
    there had been other graphical interfaces, but X was the first that was written
    for cross-platform use, right from the beginning.


    This placed some extra demands on the programmers and the hardware, and was a
    little more work up front for everyone. But everyone agreed it was an elegant
    design.


    The Windows Way


    In the fast-paced and ruthlessly competitive personal computer industry of the
    ''80s, elegant design was felt to be a luxury. In the Windows operating system,
    there is no separation between the program and the user interface. You run a program,
    like a spreadsheet, a window opens, and some code is running. The code is not
    separate from the window—it''s all one package. Everything is jumbled into one
    lump of code and shipped.


    Forget elegant.


    The Ethernet and Other Crazy Ideas


    The X Window project was also the first graphical user interface that took full
    advantage of the high-speed Ethernet network (also developed at Xerox PARC). With
    X Window, the user interface and the back-end program can be running on different
    machines. The user interface is exactly the same in both cases—windows with menus,
    the mouse, etc. But what I see on my screen is just the graphical interface; the
    core of the program can be running elsewhere over the network.


    Client, Server (or Is That Server, Client?)


    Sometimes X Window seems needlessly confusing. One common cause of confusion is
    the non-obvious use of the terms "client" and "server" in the X Window system.
    In X Window, the client is the back-end program, and the server is the X Window
    GUI program (i.e., the program that is actually drawing the screen for you and
    handling your mouse movements).


    The important thing to remember is that X Window separates your back-end program
    from the program that is the user interface. If you open emacs (everyone''s favorite
    text editor) on a Linux system, an emacs window will pop up, and it will look
    just like it does in Windows. But actually, two programs were started—one that
    is the core of emacs, and another that draws the emacs window and responds to
    your mouse commands, etc.


    When you select something from the menu, or when something happens in emacs to
    change your window, the two programs communicate. If you select a command from
    the menu, the emacs window will send that to the emacs program; if that causes
    the window to change, then the core emacs program will send all those changes
    back to the X Window GUI program.


    Since the two programs are running on the same computer, this looks just like
    what happens in Windows.


    But if you have access to another Linux machine, use the ssh command to connect
    to it. (Make sure to use the -Y option). Start emacs on the remote machine.


    Once again, an emacs window pops up. This window looks and feels like the local
    emacs window, but it is running on the remote machine. Your local machine is just
    acting as an X Window terminal to display the windows, handle the mouse commands,
    etc. When you use the keyboard or mouse to enter commands, the X Window program
    sends the information to the emacs running on the remote machine.


    Why Windows Prospered


    If the design of X Window is so danged elegant, how come everybody is running
    Windows?


    Part of the reason is that the X Window designers didn''t compromise their design,
    even though hardware was so marginal that getting X Window to run at all required
    a top-end workstation. These days we just fling around gigabytes of RAM as if
    it were nothing, but back when X Window came out, RAM was measured in megabytes,
    and it was far more expensive than it is now.


    There is also, of course, the Microsoft marketing department—no slick corporate
    marketing department for X Window ever screened television ads saying that you
    should switch to X Window.


    But X Window''s design superiority just can''t be denied. Perhaps this is the
    year that Linux starts to take over the desktop and, if so, it will be in part
    because of the amazing capabilities of X Window.


    Sounds Bad for Linux


    How nice it is when I get to write about some Linux feature that works better
    than the same feature on Windows!


    Nothing is nicer to a Linux fan than discussing the merits of OpenOffice, or the
    joy of using gcc, the GNU compiler collection, to compile software. Let''s talk
    about networking, or file systems, or editors, and I can drone on for hours.


    In so many cases, Linux just works better.


    Unfortunately, sound is not one of those cases.


    A New Gadget'
