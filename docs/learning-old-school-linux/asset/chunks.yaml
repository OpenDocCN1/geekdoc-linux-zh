  raw: 'Apple’s GUI did more than provide cute little icons and windows: It changed
    the way computers are used forever. Today, there is not one general-purpose computer
    that comes without a GUI. Even UNIX, always the stronghold of software conservatism,
    is now so GUI oriented that many Linux users never even learn to use the command
    line.


    But like every important technology, the GUI didn’t just create opportunity—it
    also destroyed technologies.


    The invention of the automobile destroyed a thriving horse-and-buggy industry,
    and the invention of the electric light bulb destroyed a huge gas-lamp business.
    Similarly, the dominance of the GUI came at the expense of another fledgling technology.


    It was a technology that could draw a screen for interaction with the user, and
    allow the user to move the cursor around on the screen, select text and, in short,
    do much of what the GUI can now do.


    These days we call it a textual user interface, but back then it was known as
    “curses.”


    A Terminal for Every Season


    Long before the GUI, in the era of disco music and 8-track tapes, the so-called
    “smart” terminals had replaced the clanking teletypes that output everything on
    sheets of computer paper. The computer user interface was just being born.


    At first, all that was sought was a way to reproduce what had previously been
    done with punch cards—that is, the input and display of 80-character text strings,
    with no formatting. The first modern terminals had little chunky green numbers
    and letters. Nobody complained about the font; we were all happy to read the screen
    instead of looking at holes punched in a card.


    Back then, no one even knew what a font was. If you’d asked, I would have guessed
    some sort of snack food.


    Soon, however, the interactive nature of the so-called glass teletypes started
    to assert itself. Programmers started playing with menu and help text that popped
    up, and then went away. The text editor vi appeared, which allowed the user to
    drive the cursor around the screen, and modern word processing began in earnest.


    Some terminal manufacturers even started experimenting with colored text, underlined
    text, and even blinking text. We’d come a long way from the plain old punch card!


    In those heady days there were dozens of different terminal types, with different
    capabilities and qualities. Soon, programmers had more terminal options than they
    knew how to make use of.


    Unfortunately, these different types of terminals all spoke different languages.
    While it was possible to make software work on any one or two terminals, it was
    extremely difficult to manage more than that. So software written by one batch
    of scientists couldn’t be shared with any other batch of scientists, because they
    were using different terminals.


    The answer, of course, was to write a software library that would present a common
    interface to everybody—one that would know the details of every different type
    of computer terminal.


    With such a library (which was called “curses”), programmers could write their
    program to talk to the common interface, and it would work on any terminal that
    curses knew about. There was even a way for users to add information about a brand-new
    smart terminal, so that they could start using it, perhaps before the curses programming
    team had even heard of it. Thus, a brand-new terminal could be put into almost
    instant use.


    Curses was written as part of the Berkeley version of UNIX in the early ’80s.
    It was wildly successful, and can still be found on every UNIX system, as part
    of the archaeological strata of the UNIX operating system.


    The GUI doomed curses to obscurity, but that doesn’t diminish the technical achievement
    of a team of early programmers, struggling against a hostile universe of hardware
    incompatibility.


    # The Other Thing That Happened in January 1984


    January of 1984 was a fruitful month for computing technology. Not only did Apple
    introduce the Macintosh to much publicity and fanfare, but (with no publicity
    and zero fanfare) Richard Stallman announced the GNU project.


    GNU sought to produce a free software version of UNIX. The GNU project launched
    the free software movement, which led to Linux, and so much more.


    More than 20 years later, we can look back on the influence of the Macintosh and
    GNU, and wonder what current technology is about to be made obsolete.


    Introduction to Linux


    The ComputorEdge readership were early adopters of fun new technology. But Linux
    has a somewhat scary reputation as being hard to install and configure. While
    this is certainly true historically, there are many new tools that make installing
    Linux a breeze these days. Some ComputorEdge columns were aimed at computer users
    thinking of taking the plunge. As I’m a huge Linux fan, I had no trouble coming
    up with reasons to switch.


    Helping Windows users switch to Linux is greatly assisted by Cygwin, a terrific
    port of many Linux tools to the Windows platform. It’s easy to install, and co-exists
    harmlessly with Windows on your system. But all the Linux tools and programs are
    there for you. It’s a great way to learn Linux without getting rid of Windows.


    ComputorEdge was certainly the most light-hearted magazine I wrote articles for.
    Other technical magazines would need to look up hiumor on the internet, but Jack
    Dunning, the editor of ComputorEdge, let me try to have some fun. But the article
    I thought most funny got a cold reception from the readership. A parady of a very
    popular TV relationship drama, it examines the emotional aspects of switching
    to Linux.


    To be a successful computer user, you must be constantly learning. Some columns
    were about the Linux documentation tools and how to use them effectively to learn
    more about Linux. Once ready to install Linux (other than Cygwin), a new user
    faces the choice of which Linux distribution to use, and there are a plethora
    of choices.


    Getting Starting With Linux


    Linux is really one of the best deals ever. You get millions of dollars worth
    of software, absolutely free. How can you beat it?


    The hard part, sometimes, is just getting started. How does an ordinary user begin?


    In this series of columns, I will take you from zero to 60 with Linux. By the
    time we are done, you won''t be an expert, but you will be well on your way to
    using the best operating system ever developed.


    The first task is to get Linux on one of your machines. You can install it on
    an old machine, install it on top of Windows with Cygwin, or just buy yourself
    a Linux computer.


    Put Linux on an Old Machine


    Give me your tired CPUs, your poorly upgraded,


    Your small-disked systems yearning to breathe free,


    The wretched refuse of your Windows network.


    Send these, the RAMless, documents lost, to me,


    I lift my lamp beside the golden door!


    These days there are hundreds of thousands of old PCs around that are no longer
    capable of running the latest versions of the operating system from Redmond, Washington.
    These machines were hot in their time, but like an aging Hollywood starlet, they
    languish while everyone chases the younger and newer talent. Today''s fickle and
    demanding Windows user has no interest in these machines!


    Lots of people have old computers just sitting in the basement (I''ve got at least
    three). They are fully functional computers, with five- or 10-year-old processors,
    hundreds of megabytes of RAM, and tens of gigabytes of disk space. If you could
    send one of these computers back in time about 20 years, it would be the most
    powerful computer in the world. If you could send it back to 1940, they would
    give it to the atom-bomb scientists, who would have kept it in use 24 hours a
    day, 7 days a week, running calculations that would vastly contribute toward the
    war effort.


    These days, we can''t even be bothered to keep it powered up. Such are the casualties
    of Moore''s Law!'
