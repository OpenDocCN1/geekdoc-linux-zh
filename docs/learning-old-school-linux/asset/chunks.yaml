    These days, there are hundreds of distros out there, each with its own supporters
    and (sometimes) detractors. Many distros are related to each other, each based
    on the same predecessor distribution. Many use the same package management or
    installation tools, but offer a different set of software tools to the user.


    Which Distro Is Right for You?


    Any distro makes it possible for any ordinary computer user to install the Linux
    kernel, the windowing system, plus a ton of extra tools and useful toys. No longer
    do you need to lug your PC to a Linux user meeting to get it working. The install
    tools are so well developed now that getting Linux working on a new system is
    fairly simple.


    With all these choices, which distro should you pick?


    A good list of an arbitrarily chosen top 10 best Linux distributions can be found
    at distrowatch.com/dwres.php?resource=major.


    Unless you have special needs, the choice of distro is not too critical. Any of
    the top 10 will work about as well as any other. Remember, any distro is just
    a starting point. It gives you a base of software tools, but you may add any other
    free software to your system, often with a handy package-management tool that
    takes all the sting out of finding and installing software.


    So just pick whichever distro strikes your fancy. If you''re buying a new machine,
    take whichever distro they offer. If you have a geek friend who is willing to
    help, use whatever distro he or she likes (and has CDs for).


    (If you still can''t decide, pick Ubuntu (www.ubuntu.com) if you''re a newbie,
    Fedora (fedoraproject.org) if this is a work machine, and Debian (www.debian.org)
    if you are a computer geek.)


    Where to Get It and How to Use It


    Where and how you get your distro depends on how you want to use it. The most
    straightforward way to get a distro is to order the CDs through the mail. For
    a nominal charge (usually less than $5 plus shipping), you''ll get your distro
    in a few days, and can install from CD.


    For the less patient, you can download an install a disc image (about 700MB),
    write it to CD, and have your installation disc without having to wait.


    For the even less patient, Debian allows you to download a small install utility.
    Run it on your target machine (which must have an Internet connection), and it
    will guide you through the installation. I have never tried this, but it sounds
    so nice that I think I will next chance I get!


    All of the distros have a Web site with instructions and downloads. They, or other
    third-party companies, offer the CDs for sale through the mail, and there is always
    the old-fashioned way—ask any Linux geek for a loaner.


    Choices, Choices, Choices


    Choosing a distro is just the first of many choices, but it doesn''t limit you
    as much as you might think. The distributions are just different collections of
    already free software. If you see some interesting software and you like it, you
    can get it, whatever distribution you started with. As time goes by, you will
    install various packages on your machine, adding to those installed from your
    distro. Your collection of tools will become your own unique set of software.'
