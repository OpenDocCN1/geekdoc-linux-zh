- fmt: "\nThese programs were much more complicated than previous software, with many\
    \ more code files. Feeding every command to the compiler and linker became a significant\
    \ task. Instead of the one-line `GCC` command that can be used to compile a single\
    \ code file into an executable, the more complex program is built in a series\
    \ of steps, which must be done in the correct order. Dozens or hundreds of commands\
    \ need to be issued.\n\nKeeping track of all this was a complex task for the poor,\
    \ simple programmer. Furthermore, it was repetitive and boring. In other words,\
    \ it was a task that called out for some software automation. And this is what\
    \ Stuart Feldman achieved with the `make` utility.\n\n## Backward-Chaining Logic\n\
    \nThe concept of `make` is very simple: You tell it what you want, and it figures\
    \ out what it needs to do to get that.\n\nOf course, it can't do this on its own—`make`\
    \ needs the programmer to create a control file that describes what can be built\
    \ (the `targets`) and how they should be built (the `rules`). The programmer can\
    \ also specify dependencies between files, specifying which source files are used\
    \ to create an executable. With all this information, `make` can decide on the\
    \ minimal set of steps to get your executable built.\n\nSince the operating systems\
    \ keep track of the current time and the last modification time for all files,\
    \ it's possible for `make` to decide which of your files should be recompiled\
    \ (because you have changed the source code since the last compile), and which\
    \ should be left alone.\n\nThe specification file is called a `Makefile` (note\
    \ the upper-case M). Creating and maintaining them can be a real hassle, but not\
    \ as much as building software without them.\n\n## An Example\n\nThe following\
    \ `Makefile` builds a program called `find_primes`. The program is built from\
    \ two different source code files, `find_primes.c` and `calc.c`. (This is the\
    \ program from last week's column, but broken into two separate files to illustrate\
    \ the use of `make`.)\n\nThis is a very simple example—a real project might have\
    \ dozens or hundreds of source files.\n\n### Makefile for find_primes example.\n\
    \n```makefile\n# Makefile for find_primes example.\n# James Hartnett 5/2/08\n\n\
    CFLAGS=-g -Wall\n\nall: find_primes\n\nfind_primes: find_primes.o calc.o\n\ngcc\
    \ -o $@ $^\n\nfind_primes.o: find_primes.c\n\ngcc $(CFLAGS) -c -o find_primes.o\
    \ find_primes.c\n\ncalc.o: calc.c\n\ngcc $(CFLAGS) -c -o calc.o calc.c\n\nclean:\n\
    \nrm -f find_primes *.o\n```\n\nLines that begin with the hash (`#`) are comments.\
    \ The `CFLAGS=` line illustrates the use of environment variables in `Makefiles`.\
    \ The rest of the file contains five targets, their dependencies, and the rules\
    \ to make the target from the dependency.\n\nThe first target, `all`, is a special\
    \ target—use this target to list all the things you would like this `Makefile`\
    \ to make. In this case it lists `find_primes` as a dependency. Dependencies are\
    \ sub-targets that must be built before the target is attempted to be built by\
    \ executing the rule, if any.\n\nThe second target is `find_primes`, the executable\
    \ we are interested in. It depends on the two object files, `find_primes.o` and\
    \ `calc.o`. The rule for this target is the command using `GCC` to build `find_primes`\
    \ from the object files.\n\nThe next two targets show how to build the object\
    \ files `find_primes.o` and `calc.o` from the source files `find_primes.c` and\
    \ `calc.c`.\n\nThe final target, `clean`, has no dependencies. Its rule is an\
    \ `rm` command, which removes the executable and also the object file. This commonly\
    \ used target allows us to type `make clean` in order to delete all created files\
    \ and start fresh.\n\nWith this `Makefile`, the developer can modify any of the\
    \ source files, and then issue the `make all` command to have the executable built.\
    \ Only those code files that have changed will be recompiled, and `make` will\
    \ figure out all the steps needed to get your program built.\n\n## Built-in Rules,\
    \ Special Symbols and Other Arcana\n\nIt all seems reasonably simple, but only\
    \ because the example does not really represent how a `Makefile` looks in the\
    \ wild. Note that certain strings are repeated in several places in our sample\
    \ `Makefile`. For example, the string `\"find_primes\" is repeated in numerous\
    \ places in the file. Programmers hate that. Not only is it boring to read, but\
    \ it increases the chance that the string might be mistyped in one place or another,\
    \ leading to a bug. Far better to have each string in just one place.\n\nFurthermore,\
    \ `make` makes a lot of assumptions. And since `make` and the C programming language\
    \ grew up together, the assumptions made by `make` are quite good when you are\
    \ programming C code, as we are in this example. You don't have to tell `make`\
    \ how to turn C source code into object files. `Make` knows more about it than\
    \ you do, and can be trusted to handle those details.\n\n`make` has some special\
    \ symbols defined, which help with the repeating string problem. They make the\
    \ `Makefile` a little hard to understand for the uninitiated, but that's the way\
    \ the cookie crumbles over the keyboard of life.\n\nHere's the same `Makefile`,\
    \ taking advantage of some of the special symbols and other shortcuts offered\
    \ by `make`. I suspect there are more I could take advantage of, if I spent a\
    \ few hours more with the GNU make manual (`[www.gnu.org/software/make/manual/html_node/index.html](http://www.gnu.org/software/make/manual/html_node/index.html)`).\n\
    \n```makefile\n# Makefile for find_primes example.\n# James Hartnett 5/2/08\n\n\
    CFLAGS=-g -Wall\n\nall: find_primes\n\nfind_primes: find_primes.o calc.o\n\ngcc\
    \ -o $@ $^\n\nclean:\n\nrm -f find_primes *.o\n```\n\n## Brevity Is the Soul of\
    \ Confusion\n\nYou may praise the terseness of Unix on many occasions, but none\
    \ of them will be while debugging `Makefile` problems. The backward-chaining of\
    \ the logic, the built-in rules, the use of special symbols, all cause `make`\
    \ to be a real challenge. The verbose option (`-v`) can be used to resolve any\
    \ question about what `make` is doing, but the output is so very verbose that\
    \ following what is going on is still about as fun as picking diseased fleas off\
    \ a cranky mountain lion.\n\nBut when it's all you have, it's all you have.\n\n\
    ## The Future of Make\n\nAlthough `make` has enjoyed a spectacular success story,\
    \ its shortcomings have become the stuff of legend. The complexity of `make` has\
    \ contributed to an aura of black magic from the very beginning. `Make` has earned\
    \ its place in the pantheon of software tools, but it has also earned a lot of\
    \ curses over the years.\n\nFor very complex projects, the creation and maintenance\
    \ of `Makefiles` becomes a full-time job. `Makefiles` that work on one machine\
    \ usually will not work well on a different machine, and having portable `Makefiles`\
    \ becomes a problem for teams that want to distribute their source code (as free\
    \ software programmers tend to do). In the end, babysitting the build system becomes\
    \ a significant task.\n\nThis, of course, leads to even further automation. In\
    \ a future column, I'll go over the successor tool, `automake`, which builds portable\
    \ `Makefiles` and has a much simpler syntax. However, `automake` does not replace\
    \ `make`, it simply uses it in a portable way. And `make` is still just right\
    \ for small projects with only a few code files. For all of these reasons, Stuart\
    \ Feldman's tool lives on in the hearts and minds of Linux programmers.\n\n###\
    \ Code File: find_primes.c\n\n```c\n/* Find prime numbers\n\nJames Hartnett, 5/2/08\n\
    */\n\n#include <stdio.h>\n#include <stdlib.h>\n\n#define MAX_NUM 1000\n#define\
    \ NUM_PRIMES 10\n\nint calc(int max_num, int num_primes, int *n, int *prime);\n\
    \nint\nmain()\n{\n    int *prime;\n    int i;\n    int n = 1;\n\n    if (!(prime\
    \ = malloc(NUM_PRIMES * sizeof(int))))\n    {\n        printf(\"no memory!n\"\
    );\n        return 1;\n    }\n\n    if (calc(MAX_NUM, NUM_PRIMES, &n, prime))\n\
    \        return 1;\n\n    for (i = 0; i < n; i++)\n        printf(\"%dn\", prime[i]);\n\
    \n    free(prime);\n    return 0;\n}\n```\n\n### Code File: calc.c\n\n```c\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n\nint\ncalc(int max_num, int num_primes, int\
    \ *n, int *prime)\n{\n    int i, j;\n    prime[0]= 2;\n    for (i = 3; i < max_num;\
    \ i++)\n    {\n        for (j = 0; j < *n; j++)\n            if ((float)i/prime[j]\
    \ == (int)i/prime[j])\n                break;\n        if (j == *n)\n        {\n\
    \            prime[*n] = i;\n            *n += 1;\n            if (*n == num_primes)\n\
    \            {\n                printf(\"reached %d primes.n\", *n);\n       \
    \         break;\n            }\n        }\n    }\n}\n```\n"
