    Living Color


    Setting the prompt also allows you to change the colors of the text, even the
    color of the background. It''s a bit of black magic, but add the string ''\[\033[1;31m\]''
    at the beginning of your prompt, and the string ''\[\033[0m\]'' at the end. The
    first blob of funny characters tells the shell to use light red as the text color,
    and the other blob tells the shell to turn off any color changes and go back to
    the default color. If you don''t include this part, not only what you type, but
    also the computer''s response, will be in light red.


    Of course, light red is not the only color available—the complete list of color
    codes can be found in the bash man page. They range from black (0;30) to white
    (1;37), with many in between, such as cyan (0;36), brown (0;33) and light purple
    (1;35).


    If you add a 10 to the color number, the background color is changed instead of
    the text color. For example, including ''\[\033[1;45m\]'' turns the background
    color to light purple. The ''1;45'' is the light purple color number (1;35), with
    10 added to the second number.


    I don''t know who came up with this crazy way of setting colors in the prompt,
    because it could hardly be more confusing. But using both features together allows
    you to change both background and text color. For example, setting your prompt
    to ''\[\033[1;45m\]\[\033[1;37m\]\d \[\033[0m\]'' will give you the date in white,
    against a purple background.


    In that funny-looking string, there are four parts. The first part, ''\[\033[1;45m\]'',
    turns on the purple background. The second part, ''\[\033[1;37m\]'', turns on
    the white text. The third part, ''\d '', shows the date, followed by a space,
    and the last part, ''\[\033[0m\]'', turns off all the fancy color stuff so that
    the command line is shown with default color and background.


    Prompt History Lesson


    Back in the ''70s, everyone was delighted with the invention of the first glass
    teletypes. They replaced the paper teletype—an IBM Selectric typewriter, modified
    to print out the computer''s response underneath whatever you typed on the typewriter.
    The paper teletype used boxes and boxes of computer-fold paper, and sounded like
    a machine gun firing. (It sounds primitive now, but compared to punch cards, it
    was very high-tech.)


    The glass teletype, as it was called, was the first cathode-ray tube monitor.
    The CRT monitor was a technology that had a long run, but is now almost completely
    obsolete, due to the LCD screen. At the height of its development (i.e., just
    as it''s going obsolete), the CRT delivers super-sharp pictures in amazing color.


    The first glass teletypes also had color: green. They displayed everything in
    the same ugly green text on the screen. But it wasn''t long before the so-called
    "smart" terminal was developed, one that could let the user experience things
    like colored text, blinking text, etc. This was another technology that was approaching
    perfection and obsolescence, as the graphical user interface was introduced and
    the command-line interface became something that appears in just one window on
    a screen full of fancy gadgets and applications.


    These days, no one makes a "smart" text terminal; they just emulate them on your
    general-purpose computer. Similarly, few rely fully on the command-line interface,
    but that doesn''t mean you can''t take advantage of the perfection of this technology
    to get your screen to look more fun.


    # Combining UNIX Commands


    "Do one thing, and do it well." This is a statement that inspired early UNIX programmers.
    UNIX consists of a wide variety of tools, each extremely focused. But when you
    combine them, you can produce sophisticated results. The fundamental difference
    between Windows and UNIX is that Window is designed to be easy to use, while UNIX
    is designed for pure power.'
