    \ `output.tmp` 文件在第二次运行时被覆盖。如果想追加而不是覆盖，请使用双大于号：\n\n```bash\nls >> output.tmp\n\
    ```\n\n这并不总是清晰的，但屏幕上显示有两组不同的输出，即所谓的“标准输出”和“标准错误”流。（通常缩写为 `stdout` 和 `stderr`）。其原理是程序将正常输出发送到\
    \ `stdout`，将错误消息发送到 `stderr`。如果你什么都不做，这两者都会倾倒到屏幕上，你会看到任何错误消息与命令输出混合在一起。\n\n如果你自动化了一些脚本，并尝试用重定向来捕获其输出，你将获得\
    \ `stdout` 流，而不会获得 `stderr` 流。如果一切运行正常，这没关系；但当出现问题时，你将错过错误消息。最后一个技巧是同时重定向错误流和输出流。在\
    \ bash 中可以使用 `&>` 运算符实现这一点。例如：\n\n```bash\nls &> output.tmp\n```\n\n这将 `ls` 的输出放入文件，并放入其执行期间打印的任何错误消息。\n\
    \n### 使用 find 和 grep\n\n你离不开的两个命令是 `find` 和 `grep`。\n\n`find` 可以根据名称、大小、年龄以及许多其他因素找到文件或目录。例如，此命令将找到我的主目录及所有子目录下，在过去三天内修改过且大小大于\
    \ 1 千字节的所有文件。\n\n```bash\nfind ~ -mtime 3 -size 1k\n```\n\n`find` 的默认操作是将文件名（包括路径）列到\
    \ `stdout`，但你也可以告诉它对文件执行各种操作。这通常用于删除超过特定大小且在特定时间内未被访问过的文件。\n\n`grep` 将在一个或多个文件中搜索文本模式。它会接受一个正则表达式，并在文件中搜索任何匹配该正则表达式的内容。正则表达式很快就会变得非常复杂，它们是在少数几次击键中封装大量功能的强大方式。\n\
    \n### xargs 命令来救场\n\n有时你想将一个命令管道传输给另一个命令，但你希望链中的第二个命令针对第一个命令的每行输入运行，而不是一次性对所有输入运行。这是一个细微的差别，但很重要。\n\
    \n如果你想找到包含特定字符串的所有文件，你可能会将 `find` 的输出管道给 `grep`。但这行不通，因为你想对列表中的每个文件运行 `grep`，而不是对列表本身。`xargs`\
    \ 命令正是为此设计的。尝试一下：\n\n```bash\nfind . -name something | xargs grep \"some string\"\
    \n```\n\n### 这个老时钟\n\n自动化是件好事。所以当你有一个每天运行的命令（除非你忘记了），请使用 `cron` 工具让计算机为你完成。`cron`\
    \ 不过是一个按定期计划运行的命令列表。如果你设置了 `EDITOR` 环境变量，请运行：\n\n```bash\ncrontab -e\n```\n\n\
    你的编辑器将启动，并显示你当前运行的 cron 任务（如果没有的话）。输入类似的内容：\n\n```bash\n0 0 * * * ls ~ ~/mydir.out\n\
    ```\n\n 了解更多信息\n\n当你某天有 20 分钟时间时，查看 `bash` 或 `tcsh`（或者你使用的任何 shell）的 man 页。你会发现它包含一种完整的编程语言，以及许多自动化或简化超出编程投入所需的常见任务的方法。\n\
    \n在 Linux 系统上，我发现 `info` 页面通常比 man 页包含更多文档。如果你使用 `emacs`，尝试：\n\n```bash\nM-x info\n\
    ```\n\n如果你不使用 `emacs`（为什么不用呢？），尝试使用独立的 `info` 系统：\n\n```bash\ninfo\n```\n\n# 长久守护之道\n\
    \n自动化是件好事。所以当你有一个每天运行的命令（除非你忘记了），请使用 `cron` 工具让计算机为你完成。`cron` 不过是一个按定期计划运行的命令列表……这些工具和技术不会消失——它们在\
    \ 20 年后的工作方式与现在一样。与某些其他操作系统不同，这使得 Linux 值得研究！\n\n# 编程工具\n\nComputEdge 专栏的伟大之处之一是有有机会探索新想法以及关于编程和技术的新方法。我决定尝试教授\
    \ Linux 编程的基础，而永远不会让 ComputerEdge 的读者感到负担过重。我不知道这些文章是否真的让任何人第一次尝试了编程，但它们仍然具有意义，并且仍然展示了通往\
    \ Linux 软件开发人员职业的道路。\n\n# 3 万英尺高空的软件开发\n\nLinux 软件开发工具是理解 Linux 最重要的部分。没有了它们，Linux\
    \ 将没有未来，也没有过去。\n\n# 什么是软件？\n\n软件是计算机硬件遵循的指令集，用于操纵组成处理器的数百万个微型晶体管开关。这些开关只是可以开启和关闭的小型机器。开关位置的任何模式或更大的意义都由我们来决定。正是这些模式让我们能够创建文字处理器、电子表格和像\
    \ Pong 这样的游戏。\n\n# 程序员\n\n程序员是开发指令集的人。这是一项艰辛的任务，因为计算机会完全按照它被指示去做——无论指令有多愚蠢。指令集必须几乎完美才有用，这种对完美的追求占据了程序员的时间。\n"
