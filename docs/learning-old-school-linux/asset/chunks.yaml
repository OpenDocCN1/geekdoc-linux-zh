    一旦 Cygwin 安装施了它的魔法，你就会发现自己直接在 Windows 之上安装了 Linux。现在，你可以继续使用 Windows，但在后台逐渐过渡到
    Linux。也就是说，你可以开始使用你喜爱的工具的 Linux 版本。你会在 Windows 桌面上看到一个名为 `Bash` 的图标，这是一个 Linux
    命令行。`Bash` 就像 DOS（就像航天飞机之于瓶火箭一样）。


    完成基础安装后，你可能想再次运行 `setup.exe` 并获取更多软件。（当然，都是免费的。）你还可以安装 X Windows（即 Linux 的图形用户界面），并在你的
    PC 上运行基于 X 的 Linux 程序。（或者，你也可以选择使用 Windows 的免费软件版本，如 OpenOffice，仅将 Cygwin 用于命令行工具。）


    Windows 电脑的伟大之处在于其惊人的计算能力。凭借一台配置强大的 Windows 电脑，Cygwin 程序的运行速度极快。当然，它们的缺点是上面运行着
    Windows。这引导致了通往 Linux 的下条路径：买一台 Linux 电脑。


    # 买来，不要自己造


    在工程学院里，他们告诉我“永远不要画你可以复制的东西，永远不要复制你可以撕下并粘贴的东西”。（这种说法暴露了我的年龄，在那个时代，工程学生认为“画图”就像其他其他事情一样，是用电脑键盘完成的。）


    尽管有些过时，但其中包含一个合理的原理。毕竟你不能包揽一切，所以为什么不让别人在电脑上安装好 Linux，然后直接买呢？


    如果你选择这条路，你必须花一些钱，但你将获得一个从第一天起开箱即用的完美解决方案。而且由于 Linux 精简的运行时配置，Linux 电脑需要的硬件比 Windows
    电脑要少得多，所以你可以买到廉价的东西，却能获得 Windows 用户通过顶尖硬件所追求的性能。（他们追求它，但并没有得到，因为这关乎软件，而不是硬件。）


    如果你正在寻找一台价格不菲的 Linux 电脑，可以看看华硕的超便携 Eee 系列。只需 400 美元，你就能得到一台性能良好、重量约两磅的 Linux 笔记本电脑。把它放在桌面上，插上
    VGA 显示器、USB 键盘和鼠标（别忘了插上扬声器）。事实上，你可以使用你 Windows 电脑的屏幕、键盘和鼠标。现在，你拥有一台非常棒的 Linux
    桌面机器。


    当你想要出差时，把它折叠起来滑进外套口袋或随身提包，你就可以到达目的地而不会肩膀酸痛。到达那里后，你可以在它微小（但足够用）的键盘和屏幕上工作直到回到家里。


    它带有无线网络功能，但没有硬盘。它有几 GB 的闪存内存存储空间，还有一个 `microSD` 卡槽，我在那里还有另一个花 25 美元买的 `2GB` 存储。通过
    SD 卡槽和 USB 端口，你可以在没有硬盘的情况下获得很多额外存储。优点是 Eee 非常耐用，因为除了按键外，它没有移动部件。


    # 擦除电脑并安装 Linux


    很多 Windows 用户手里都闲着一些旧机器，它们的性能已经不足以运行来自雷德蒙的软件。请放心，它们运行 Linux 绰绰有余。特别是旧笔记本电脑，可以作为低功耗网络服务器。如果你运行不带
    GUI 的 Linux，甚至可以利用非常老的机器。


    要安装 Linux，你需要一张安装光。你可以通过下载一个名为磁盘镜像文件（或 `ISO` 文件）的大型文件来自己制作。使用 `ISO` 文件和一张刻录光，你就可以制作你的
    Linux 安装光。你必须选择你的 Linux 发行版并获取其 `ISO`。`Ubuntu` 是 Linux 新手的极佳选择。它包含了你对家庭/办公工作站所预期的一切。


    简单的方法是擦除那台机器硬盘上的所有内容。在其他介质上做一个备份，然后准备好格式化存储空间。如果你有多个磁盘，可以断开其中一个并保留其内容（或者保持连接，但在重新格式化硬盘的安装步骤中要务必小心）。


    然后用安装光启动并按照屏幕上弹出的说明操作。这和安装 Windows 一样简单。


    # 组装电脑并安装 Linux


    为什么，噢，为什么我总是跳过所有这些简单的方法，直接选择最困难的？也许因为这最有趣。


    挑选零件，组装你自己的电脑，并亲自安装 Linux。你将以非常优惠的价格获得一个真正的性能王者。而且你会学到很多。之后，你对 Linux（以及硬件）的经验将提高很多。


    这让我想起了工程学院的另一个教训：经验就是你需要它之后才得到的东西。


    # Linux 与城市


    Vespa 是丹佛最后、最好的时尚和原味美食避风港，但昨晚有人犯了一个错误，向自由意志派大会的人群提到了它。结果，那里挤满了来自东海岸的人，他们紧张地环顾四周，显然在试图找些舒服的东西看，就像穿三件套套装的人一样。相反，他们看到的只有穿着牛仔裤和运动鞋、放松的丹佛人。


    当我在这群穿着便装的自由爱好者中等调酒师注意到我时，我的伴侣转向我，用她那双总是让我膝盖发软的美丽褐色眼睛看着我，问出了那个我暗中恐惧多年的问题：“你会帮我切换到
    Linux 吗？”


    当我大脑中负责机械地与我的甜心相处的部分让我的嘴优雅地接受时，我大脑中负责与她保持婚姻的部分神经元开始活跃。通往 Linux 的道路可能充满艰，我们并不总是爱引领我们走这条路的人。事实上，我们经常会对他们非常暴躁。


    后来，当我有机会习惯这个想法后，我问自己一个问题：帮助伴侣切换到 Linux 是个好主意，还是你应该把她交给一个称行的极客朋友，这样无论切换过程多么艰难，至少你不会被埋怨？


    # 早午餐小组


    第二天，我在早午餐时向我的三个最亲的朋友提了这个问题。第一个回答的是 Sam，我们小组小组中年龄最大、经验最丰富的成员，他经常承担向朋友、熟人以及几乎不认识的人教授
    Linux 的任务。


    “去帮她切换吧！当然，这会很困难，她会抱怨几句，说在 Windows 下一切有多么不同，但很快她就会掌握，并学会爱上 Linux。最后，她会感谢你的。如果她没有感谢，可能你们本来就不适合在一起。”


    我的朋友 Charlie 立即反对道。“不，Sam，你从不停下来考虑人们的感受。人们对他们的操作系统产生的情感纽带比你想象的要强大得多。无论对错，她和 Windows
    的关系已经持续了十多年。现在她必须分手并迈向未来。这绝不容易！” Charlie 转向我，“你需要花时间来理解她的感受，并认可这些感受。”


    我们的另一个朋友 Marty 像往常一样给出了最愤俗的观点。“别这样做。当她第一次遇到 Linux 做不好的事情时，她会怪到你身上。她会在开会时，某个穿着伯尔肯鞋、扎着马尾的呆子向她展示他的
    HP 新 Vista 笔记本，然后就会发生段错误（seg fault）。找别人来替背锅吧。”


    我不禁想 Marty 说得有道理。切换到新的操作系统可能是挑战性的，即使旧的操作系统令人心烦又愚蠢，它也是你熟悉的。


    '
- fmt: '

    After brunch, Charlie and Sam went shopping, as usual. A new `CompUSA` had opened
    in town, and Charlie was going to splurge on a new quad-core server, and Sam was
    explaining that he needed to max out his `RAM` right away. Marty, on his way back
    to his law office, offered one parting piece of advice.


    "Whatever happens, don''t just reuse her old `Windows` laptop. She''ll want something
    shiny and new, and having the old laptop around will be useful when she does hit
    something that she can''t figure out on `Linux`, but that needs to get done right
    away. Also, she''s bound to have a lot of files on the thing, and she may want
    some of those old files in the coming months. Good luck."


    # Introspective Scene of Examining Our Relationship (to Operating Systems)


    As I walked down the 16th St. Mall, window-shopping, I reflected on my friends''
    advice, and our emotional attachment to operating systems. It reminded me of something
    I had learned from my children: People want to stick with what they know. A child
    might not like what he is used to, but he knows that he doesn''t like what he
    is not used to. Doubt it? Then try feeding a brand-new recipe to a 6-year-old.


    `Windows`, with all its faults (and there are many), is what my wife has been
    used to for these past 12 or 13 years. During that time, it has been with her
    in good times and bad. (And, computers and software being what they are, that
    mostly means bad.) She knows its quirks and pitfalls, and she is used to the way
    things are done on `Windows`.


    I tried also to think how it would be for someone to try and convince me to give
    up `Linux` and `Unix`-like operating systems. I have been using them daily since
    the first time I sat down at one in 1986. That''s 22 years of `Unix` knowledge
    in my brain and fingertips, and that is not something I would give up easily.


    (Thankfully, I use `Emacs`, so all operating systems look the same to me anyway.)


    ## Neat Wrap-Up


    In the end, I decided to help my wife switch from `Windows` to `Linux`. It all
    comes down to trust. But while the switch from `Windows` to `Linux` may not be
    wrapped up as quickly and conveniently as an episode of your favorite female relationship
    drama, it can help to make the computer, and the tasks you use it for, seem a
    little less threatening and annoying. It can make life better.


    And this, dear reader, is the secret to a good marriage: Try and make your spouse''s
    life a little bit better in some way. Because you surely do cause your share of
    problems and difficulties. Like a good operating system, it''s important to make
    sure the positives add up to more than the negatives, that the features outweigh
    the bugs.


    # Cygwin: The Perfect Setup


    As a longtime fan of free software, there''s not much that I admire about proprietary
    software. The software that is used with a commonplace operating system originating
    in Redmond, Washington, has little charm for me.


    Sitting around the lunch table with other free-software geeks, I am always loud
    and proud in my derision of that other operating system and the software that
    goes with it. We spend hours talking about software, and never is the software
    from Redmond given a kind word. (Perhaps we should talk about something other
    than software sometimes, but we are geeks, after all.)


    However, there is a dark, shameful secret that I have never revealed to my geek
    buddies. It is something I could never admit to, something they would laugh at.


    I admire the way `Windows` software installs.


    ## Easy Installation for Windows Users


    When you get a piece of `Windows` software, you put a CD in the drive, or run
    an executable file, and a friendly dialog box pops up. It explains everything
    in small pieces and small words. It gives reasonable default choices for everything,
    allowing lazy system admins such as me to just click "OK" again and again, without
    even reading the one sentence it has put up there for me.


    I can''t even be bothered to spend five seconds reading and understanding the
    installation instructions and choices. How pathetic is that? I blame MTV.


    But on `Windows`—that operating system that gets so many things wrong—the installation
    program always works. Perfectly. Every single time.


    ## Doing Hard Time on UNIX Installs


    `UNIX`, which is a very capable and professional operating system, can do so much
    that `Windows` can''t. (continue working for long periods of time, for example).
    But one thing it does not do well is software installation.


    Instead of getting some nice pop-up box with instructions simple enough for a
    clever monkey, `UNIX` software is distributed in a wide array of strange ways,
    ranging from source code (which you build with your own compiler, kind of like
    building a radio from a kit), to binary distributions, which are almost, but not
    quite, as easy as `Windows` distributions.


    When installing `UNIX` software, you almost always have to read the instructions.
    We free software geeks tell each other that we prefer it this way. But, deep in
    my heart, I don''t. MTV has made it very difficult for me to concentrate on anything
    for long periods of time.


    ## Come Home to UNIX With Cygwin


    That''s why I am always delighted to work with the `Cygwin` setup program.


    `Cygwin` is a complete port of `UNIX/Linux` to the `Windows` platform, and it
    is as easy to install as any `Windows` software.


    Unlike `Windows` software, `Cygwin` software is free, and the source code is also
    available, in case you want to modify it yourself, and it always, always, always
    works!


    Once you have `Cygwin` installed on your computer, you click on the `Cygwin` icon
    on your desktop, and a `bash` shell command-line window opens up.


    Immediately, my heartbeat slows and my palms stop sweating. I forget that I''m
    working on a `Windows` machine. `Cygwin` gives me a sane, powerful, and delightfully
    normal `UNIX` tool set. It''s like coming home again.


    Even the `X Window` system—the `UNIX` windowing system that provides windows,
    menus and tool buttons, and all the other graphical gunk that some people seem
    to need on their screen—is supported. (As for me, I''m happy with a smart terminal
    emulator and `emacs` in ASCII mode. What more could anyone possibly need?)


    ## UNIX Therapy for Windows Computers


    To get this wonderful injection of quality software into your `Windows` laptop
    or desktop box, just go to the `Cygwin` Web site (www.cygwin.com). Click on the
    icon "Install Cygwin Now."


    This will download the wonderful `Cygwin` setup program `setup.exe`. Save this
    program somewhere easy to find, such as your desktop. You will run it whenever
    you want update your `Cygwin` software, or to get new software packages.


    Run the `setup.exe` program. Go ahead to accept all the default settings, just
    like on any other `Windows` software installation. When asked to choose a download
    site, I just pick one at random. I try to choose a `.edu` site, for some reason.
    I don''t know if they are faster than commercial sites or not.


    After you choose the download site, the setup program downloads a list of software
    packages. Now comes the fun part.


    # Ali Baba''s Cave of Software


    Maximize the setup window; you will need plenty of room. Here you will see listed
    the software wealth of our generation.


    You''ll find `bash`, the Bourne Again Shell—the best command-line interface ever
    developed. Or, for those with different tastes, `csh`, `sh`, `zsh`, or several
    other varieties of command-line environment.


    You can get `emacs`, the first and still the best integrated-development environment.
    For the more primitive, there is `pico`, `nano`, `joe`, and even the old `UNIX`
    line editor `ed`. There is even a `vi` editor, for those who are seriously brain-damaged.


    Get such acclaimed scripting languages as `Perl`, `Python`, and `Ruby`. There
    is also the GNU Compiler Collection (`GCC`), which will handle `Java`, `C`, `C++`,
    `Fortran`, `Pascal`, `Ada`, and other programming languages. No matter what your
    preferred (non-Windows) programming environment is, you can find it here.

