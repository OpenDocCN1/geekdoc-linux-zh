    If you change the numbers in the C code next to MAX_NUM and NUM_PRIMES, at the
    top of the file, you can change how many primes are found. On my little Asus EEE,
    Yum-Yum, it took 12 minutes and 11 seconds to compute the first hundred thousand
    prime numbers. (You must recompile the program with the GCC each time you change
    it.)


    Command-Line Options


    There are many command-line options with GCC, and the documentation in the info
    pages is excellent. Every GCC programmer should sit down at some point and just
    read the documentation from end to end.


    The -o option allows you to name your binary executable something other than a.out.
    The -g option will include debugging information in the executable, so that a
    source code debugger can be used. The -Wall option tells GCC to give all sorts
    of interesting warning messages about your code. The -v option puts GCC into verbose
    mode—really helpful if you are having link problems.


    Here''s the same build, but with a more realistically complex command line:


    gcc -Wall -g -o find_primes find_primes.c


    # The Three Steps of C Program Compilation


    A C program is compiled in a three-step process.


    First, the C pre-processor is run on the source code. The pre-processor is what
    takes the string NUM_PRIMES, and substitutes the number 10 wherever it is found.
    The pre-processor also handles the #include statements at the top of the file,
    by including the contents of the system headers stdio.h and stdlib.h.


    Second, the C compiles the find_primes.c file into the find_primes.o object file.
    The object file is like a piece of an executable, but without enough to run by
    itself. In this case, there is only one source code file, find_primes.c. But in
    a real-world software project, there could be hundreds or thousands of code files,
    all of which have to be compiled separately, before being combined in the final
    step.


    Third and finally, the linker is invoked. It takes all of the object files and
    links them together in a way that adds up to an executable program that the computer
    knows how to run.


