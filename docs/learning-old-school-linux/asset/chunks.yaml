    #include <stdio.h>


    #include <stdlib.h>


    int


    calc(int max_num, int num_primes, int *n, int *prime)


    {


    int i, j;


    prime[0]= 2;


    for (i = 3; i < max_num; i++)


    {


    for (j = 0; j < *n; j++)


    if ((float)i/prime[j] == (int)i/prime[j])


    break;


    if (j == *n)


    {


    prime[*n] = i;


    *n += 1;


    if (*n == num_primes)


    {


