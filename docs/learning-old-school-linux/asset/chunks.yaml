    指令（或源代码）以文件的形式存储在计算机磁盘上。这些文件由编译器或解释器处理，然后由计算机执行这些指令。你无法触碰软件，也无法看到它（除非使用其他软件），但如果没有它，计算机将只是一堆废铁。有一句关于硬件和软件区别的古谚可以帮助你理解：硬件是你可以踢它的部分，而软件是你只能对其咒骂的部分。


    ## Linux 核心的开发工具


    当 Intel、AMD 或其他芯片设计公司的优秀人才们开发出一种新的微处理器时，它是如何变成一台可以运行的计算机的呢？一个新的微处理器必须能够运行现有的软件才才有价值。


    我们使用一种名为 `C` 的编程语言来将现有软件迁移到新平台。`C` 编译器是一个将 `C` 源代码转换为计算机可执行文件的程序，它是第一批被移植到新平台的软件之一（使用一些汇编语言编程——这比
    `C` 要初级得多）。一旦 `C` 变得可用，就可以构建其他工具（用 `C` 编写）。通过使用这些工具和 `C` 编译器，任何应用程序都可以迁移到新平台。


    由于 Linux 中的一切内容都是从这些工具构建的，而且由于软件是免费提供的，你可以挑选自己的工具，从一个全新的微处理器和 `C` 编译器开始，最终获得一套功能完备的核心工具，这允许你构建任何其他
    Linux 软件。如果没有它的软件开发工具，Linux 根本无法成为今天的样子。然而，Linux 开发工具的用途远不止迁移。


    ## 创建更多“缩膜包装”软件


    “缩膜包装”（shrink-wrapped）一词将我们带回到软件在计算机商店以缩膜包装盒分销的时代。那是互联网出现之前。他们仍然卖那些缩膜包装盒，因为我在当地的计算机商店里看到它们。我相信盒子里现在包含一个旧版本的软件和下载最新副本所需的密码，这是大家都会做的做法。


    在 Linux 世界里，我从未见过缩膜包装的软件，尽管推测某个地方还是有的。我所有的 Linux 软件都是免费获取的，所以我不知道它们是如何销售的。


    分销渠道可能已经改变，但“缩膜包装”这个词仍然存在。缩膜包装软件是一种产品。它由一组开发者开发，并被成千、上万甚至百万用户使用。为 Linux 平台开发代码的公司、大学和个人都有他们这么做的理由，但对他们所有人来说，软件开发工具处于其产品开发过程的核心。


    ## 创建更多内部软件


    与缩膜包装软件的量相比，为企业、大学、政府机构或其他组织内部使用而编写的软件数量是微不足道的。这可以是从专门的工资处理到给 CEO 的特殊报告的任何内容。所有这些业务活动都依赖于本地计算平台的开发工具。


    ## 创建网站


    Web 的普及速度比人类历史上任何之前的发明都快。穴穴人坐在一起讨论使用那些新奇金属箭箭头的优缺点的时间，比我们文明将所有的银行业务、预订和业务信息转移到这个全新的计算机工具上花费的时间还要长。这让我们现在变得更聪明了，还是更愚蠢了？


    这一切创造了一个新的软件开发领域：网站开发。即使是一个相对简单的网站，也涉及大量的软件和至少一点编程。任何野心勃勃的网站都会涉及大量的编程。绝大多数严肃网站都是构建在极其可靠的
    `LAMP`（Linux、Apache、MySQL 和 PHP）技术栈上的，而 `LAMP` 中的 `L` 代表 Linux。因此，大多数网站开发都是使用
    Linux 开发工具完成的。


    ## 创建嵌入式软件


    它们无处不在：在你的汽车里、厨房里，甚至你的卧室里。我指的是计算机，它们现在已经便宜到可以在许多非常廉价的设备中找到。对于新兴的程序员来说，最好的工具往往是完全免费的。Linux
    提供了一套完整的编程套件，从编辑器到运行环境。Linux 工具链在整个行业被广泛用于重工作，嵌入式系统中使用 Linux 软件是不可避免的，而且这种趋势只会增加。


    ## 自由软件的力量


    自由软件的神奇（或至少是魔力般的）力量在于它可以适应任何平台。就像那部 1958 年的电影《Blob》一样，自由软件的定义在于没有人拥有它。由于没有人拥有它，任何人都不支付费用。Linux
    开发工具由软件基金会开发、维护并发布。在未来几周内，我将仔细观察这些开发工具，并尝试解释它们在各自软件包中处于什么位置。没有这些工具，Linux 将不复存在。


    # 为 Linux 平台开发软件


    秋季是高中毕业生开始考虑大学选择的季节。一些幸运的人（像我这样）只需要决定去哪所工程学院。而另一些人则更为困惑，正在决定是否应该从事什么行业。他们意识到自己的未来取决于这个决定；但以
    17 岁的随性程度，他们并不会因此困扰。


    在这种时刻，我妻子经常建议将信息技术作为可能的职业选择。我对此持怀疑态度。多年来，我发现把某人变成软件开发者并不是好事。如果这不是他们从一开始就睁大眼睛选择的，他们真的应该做这种工作吗？优秀的程序员是天生的还是培养的？


    我真的不知道，但我的打算不是再做一个《纽约时尚》的模仿剧（参见“Linux 与时尚”）。


    ## 通过工具质量判断匠


    对于有志的程序员来说，幸运的是最好的工具也是完全免费的。Linux 提供了完整的编程套件，从编辑器到运行环境。Linux 工具链在业界被广泛使用，接受过 Linux
    工具训练的优秀程序员不必担心找不到工作。


    首先，选择一个文本编辑器。我最喜欢的选择是 `emacs`（参见“Emacs：唯一需要的程序”）。无论你选择什么文本编辑器，都会在那里花费大量时间。所以选择一个你喜欢的，并花一点时间熟悉它。你选择的任何编辑器都应该包含在编辑器内编译、运行甚至调试代码的能力。


    ## 编译型语言与脚本语言


    有很多不同的编程语言，每种都有自己的支持者。所有这些语言对 Linux 程序员都是可用的，大多数 Linux 程序员精通多种语言。


    为了讨论，我们将语言分为编译型语言和脚本语言。编译型语言是你大多数时间用来创建用户应用程序的语言。脚本语言是你用来编写某种“胶水代码”的语言，它按正确的顺序、正确的参数运行其他程序。


