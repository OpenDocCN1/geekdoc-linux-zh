  trans: '


    作为一款回合制策略游戏，Freeciv 并不试图与那些释放肾上腺素的射击游戏竞争。它的挑战更像国际象棋，但拥有数百种不同的棋子，以及一个如地球一样大的棋盘。


    Freeciv 让你的创造力得到充分发挥，因为你需要仔细地设计自己的文明，收集资源、建立城市并开发基础设施。最后，当你内部的文明变得完美时，就是时候去摧毁游戏中的其他人了！


    在 Freeciv 中，你从一个未发现的森林、山脉、海洋、河流和其他地形特征世界的定居者开始。定居者可以建立城市，城市可以成长并产生更多的定居者，以及各种类型的军事单位，从长矛方阵到喷气式战斗机。


    Freeciv 基于《文明》系列游戏，最著名的是 `Civ 2`。但 Freeciv 远超 `Civ 2`，拥有更详细的图形和更好的用户界面。


    我在 Freeciv 中最喜欢的单位是核导弹，它能用一个有趣的蘑菇云摧毁敌人城市。但通常这些导弹会被 SDI（战略防御计划）拦截——除非你先派了一名间谍去进行破坏。


    罗马不是一天之建成的，你的帝国也是如此。我玩过持续好周的 Freeciv 游戏，累计时间超过了 24 小时。我的许多文明都在熊火中覆灭了，因为敌方单位沿着我的铁路线快速移动——一旦他们攻入你帝国的核心，就没有什么能挡住他们！


    关于 Freeciv 的一切信息，请访问网站 `http://www.freeciv.org/`。Windows 用户还可以在网络上聚在一起互相对战。


    ## 麦考伊与斯波克


    ### 计算先驱的角色

    事实证明，如果没有试图帮助和理解的麦考伊（McCoys）和斯波克（Spocks），计算世界就不会有今天的样子。


    柯克（Kirks）也有他们的贡献，值得注意的是，游戏一直是硬件和软件开发的驱动力之一。


    所以，准备好鱼雷并激活曲速驱动——是时候去炸一些外星人了。


    # 办公工具


    ## 摆脱文字限制


    在过去，知道如何拼写是一件重要的事情。


    我清楚地记得老师们曾告诉我，我将因为对拼写缺乏兴趣而遭受苦难。“詹姆斯，等你长大后，你需要写信，你糟糕的拼写能力将成为一个真正的障碍。”


    我忽略了所有这些建议。事实证明我是对的，而他们是错的。如果我告诉他们，我不仅可以在没有良好拼写的情况下成功，而且实际上可以通过写作赚钱，他们将是不会相信我的。是文字处理程序的发明让所有这些警告进入了生活的垃圾桶，让我得以生存并繁荣，尽管我的拼写仍然烂得一塌糊涂。结果，我一直对那些只能用一种方式拼写单词的人感到遗憾。


    ### 早期文字处理

    在计算机的早期，并没有文字处理——只有文本编辑。区别在于，文字处理允许你做的不仅仅是操作一个顺序排列的字母文件。它还允许你进行一些花哨的操作，如标题、项目符号、上标和其他增强功能，这些功能将一串普通的字母转换为格式化文档。


    在早的 80 年代初，实现真正文字处理的方法是使用非常昂贵的排字机。这些机器大约有一个大桌子大，配备键盘、原始的显示器和一个大型打印机。为了得到你的文档，你需要手写（或者如果你写得很多，就用打字机），然后交给排字专家，由他们将其重新输入排字机中，并带上控制格式、标题等所需的特殊代码。排字员随后会打印出一份供你检查——这被称为校样（galley
    proofs）。你会阅读并修正这些内容，将其寄回排字员，排字员会输入你的更改并为你运行另一组校样。最终，你会对结果表示满意（或只是太厌了不想继续了），然后会为你打印一份文档的最终副本。


    这这一切听起来非常痛苦吗？因为事实确实如此。这种原始文字处理的问题之一包括：机器及其操作员非常昂贵，而且通常很忙，所以周转缓慢。即使在所有文本都写完后，准备一份文档可能需要一周时间。此外，只有当你足够幸运在一个能负担得起这种机器的地方工作时，整个过程才可能实现。


    ### 早期文字处理器

    早期的文字处理器在今天会被称为文本编辑器，因为它们甚至没有尝试向你展示你得到的内容。可能会把某些文本加粗，它从打印机出来时是那样，但在屏幕上它看起来和所有其他文本一样。“所见即所得”或
    `WYSIWYG`（读作 wis-eee-wig）直到 20 世纪 80 年代更好的图形显示器和操作系统出现出现。


    `WYSIWYG` 是一个棒的想法，也是我们现在认可的文字处理器的关键特性。第一个 `WYSIWYG` 编辑器是（仍然）著名的 `Microsoft Word`，它当时是文字处理市场的新手，试图取代要受欢迎得多的
    `WordStar` 程序。


    ### 它们成长得真快

    `WYSIWYG` 文字处理器很快流行起来，新功能的出现速度就像盖茨的支票账户里的钱一样快。拼写和语法检查、与电子表格、数据库、绘图软件的集成、更多的字体和文本对齐选项都成为文字处理程序的标准组成部分。


    最终，和大多数计算机程序一样，文字处理器发展出了使用简单的内部编程形式处理重复性任务的方法，首先通过宏，然后通过专门的脚本语言。随着文字处理器概念的发展，满足这些需求的各种软件程序也随之发展。正如不可避免发生的那样，文字处理器已变成了一种商品。市上有许多选择，价格各异，但它们做的事情大同小异。在企业界，`Microsoft
    Word` 统治了一切。


    ### 摆脱微软

    Word 对比尔·盖茨来说一直是一个真正的赚钱工具，现在也是。事实上，它在 1999 年昂贵到以至于对于工作站开发者和制造商 `Sun Microsystems`
    来说，买下一整个公司比为每个员工买一份 `Microsoft Word` 要便宜得多。这家公司是一家德国软件公司，开发了 `Microsoft Word`
    的仿品，那是他们名为 `StarOffice` 的软件套件的一部分。Sun 立即将源代码发布到开源社区，`OpenOffice` (`www.openoffice.org`)
    诞生了。Sun 仍为企业用户提供商业版本，包含一些额外的工具和功能，但免费的 Open Office 套件已经包含了我需要的一切。


    ### 与同同行

    如今，`OpenOffice` 的文字处理器 `Writer` 几乎与 `Microsoft Word` 无异（除了它是免费的）。它提供了全套 `WYSIWYG`
    功能，我正用它写这篇文章。它甚至可以读取和写入微软格式的文档，以便你可以切换使用 `OpenOffice Writer` 和 `Microsoft Word`。`Writer`
    的最新版本甚至支持 `Visual Basic for Applications` 脚本语言。这意味着即使带有大量脚本的复杂 Word 文档也可以由 `OpenOffice`
    处理。


    它无处不在你需要的地方


