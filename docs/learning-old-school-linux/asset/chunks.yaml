- fmt: '

    The only problem, as quick readers will already have perceived, is that there
    is no "meta" key on their keyboard. This key existed on an early ASCII terminal
    that emacs was developed on, but it didn''t catch on, and so now there are no
    keyboards with a meta key.


    No matter; with emacs there is always a way. On most computers, the "Alt" key
    will function as a meta key for `emacs`, so `M-x` can be achieved by holding down
    the `Alt` key and hitting the "x." In case the `Alt` key doesn''t work, you can
    use the escape key (`Esc`), but it it a slightly different way. Instead of holding
    down `Esc` and hitting the `x`, first hit the `Esc`, and then hit the `x`.


    ## Awesome for Programmers


    Now, why would programmers put up with all this business of meta and control keys?
    What are the features that `emacs` offers that make it worth the trouble? They
    are far too many to list.


    The first are the editing modes. If you open a file named `program.c` in `emacs`,
    you will be in something called `C-mode`. This gives you all kinds of commands
    for programming in the `C` language, and turns on formatting that looks good for
    `C` code. If you open `program.f`, you will get Fortran mode. If you open `program.java`,
    you will get Java mode, etc. Almost every existing programming language has its
    corresponding mode. And here''s the neat thing: The same commands work for every
    language.


    For example, the `M-x comment-region` command will turn a region of code into
    comment, even though every language uses different characters for comments. `M-x
    indent-region` will cause a bunch of code to have good indenting for whatever
    programming language you are working in. And there are many, many more.


    ## Starting a Life of Productive Programming


    `emacs` can be a''-bit confusing to get started with. It''s a serious power tool,
    and requires some dedication and effort to use properly. But give it a try—you
    won''t regret it!


    ## Using the Shell


    In the days before graphical user interfaces, the command line shell was the way
    we interacted with computers. On Windows, the command line shell has been relegated
    to the DOS command window, but on Linux, the shell is alive and well. Many advanced
    users prefer shell interaction over GUIs because of the power, ease, and flexibility
    of the command line.


    ### Coming Out of Your Shell


    One of the great things about Linux is the variety of ways in which you can interact
    with the software. In some operating systems (and I will point no fingers!), there
    is only one way to get the job done. Functional, but boring. On Linux, it is never
    this simple and always more exciting.


    Last week, I described some of the different graphical user interfaces that Linux
    users can enjoy, but the graphics in Linux are just a layer on top of a more basic
    command-line interface.


    ### What''s a Command-Line Interface?


    Predating today''s modern world of fancy graphics, the command-line interface
    hails from the old days—when men were men, and computers were the size of minivans.
    In those days, the so-called "smart" terminal was all the rage because it could
    achieve such amazing visual effects, like blinking text, different-colored text
    and even bold text. Programmers of that era were very close to the hardware. They
    often used the specs from the hardware manufacturer, and each type of machine
    had its very own operating system.


    Back in the 1970s, a programmer named Ken Thompson was working on the development
    of a new operating system—one that, for the first time, was not written for any
    particular computing hardware, but rather was generalized, so that it could work
    on any hardware. As a metaphor, Ken imagined the hardware system as the yolk,
    with the system software as the egg whites, but there was something else needed—something
    between the egg and the user. Something to wrap around all of the system''s functionality,
    and be all that the user needed to touch. That something is the shell. In 1971,
    Ken Thompson released the first version of his eponymous shell, and the Thompson
    shell was the basis for all succeeding UNIX command-line interfaces.


    ### Pipes and Redirects: the Plumbing of UNIX Systems


    One thing that the shell must do is allow the user to run programs on the machine.
    In fact, this is the main purpose of the shell. If you have a program called `trek`,
    then the user must be able to type `trek` somewhere, to launch the program—in
    this case, a classic Star Trek game.


    But the Thompson shell did more than this. It allowed users to send a file into
    a command, just as if all the lines in the file had been typed on the keyboard.
    It allowed the output of a command to be saved or appended to a file. And it allowed
    the output of one command to become the input of another.


    With these capabilities, the shell turned into a powerful tool for assembling
    complex command sequences. Simple tools, used in complex combinations, can do
    sophisticated data processing. This is the basis for the success of the UNIX operating
    system.


    ### Meeting the Families


    In the UNIX world, there are two families of command-line interface, both derived
    from the original Thompson shell. One is called the Bourne shell (`sh`), and the
    other, the C shell (`csh`). From these two early shells, a whole coral reef of
    free software has been built, and many variants exist that improve on these two
    shells. Some of the choices now include the TENEX C shell (`tcsh`), the Bourne
    Again shell (`bash`), the Korn shell (`ksh`), and the Z-shell (`zsh`). Each of
    these variants of the shell offers its own set of features, its own way of helping
    users automate their common tasks and string together different UNIX tools to
    do one complex job.


    In spite of all these alternatives, there are still some diehards out there who
    stick with the original shells out of some stubborn tribute to the past. We all
    can respect the past, but that doesn''t mean we walk around with wigs and tri-corner
    hats. Sometimes the past has been improved upon, and that''s the case with UNIX
    shells. (I''m a bash man, myself.)


    ## Now You''re Speaking My Language!


    After typing in a complex series of commands, you long for a way to automate the
    tedium of doing so again. And this leads, quite naturally, to needing a way to
    generalize and pass parameters to the commands, so they can be adapted for various
    circumstances.


    The shells that came after the Thompson shell started to include the features
    of procedural programming languages—variables, branches and loops. A variable
    is a named area of memory that can store a value that changes (i.e., varies).
    The branch is an if-then decision. If some condition is true, then execute some
    code; otherwise, execute some different code. The loop is a way of repeating code
    as many times as needed.


    With variables, branches and loops, procedural programming becomes possible. This
    allows for the automation of complicated and tedious tasks, and allows the programmer
    to encode ways for the computer to do the "right thing" under various circumstances.


    There are many existing examples of shell programming, and many existing systems
    that are based, in part, on sophisticated shell script programming. Professional
    programmers will prefer to use more feature-rich languages (like `Java`) for really
    complicated programs, or languages that make more efficient use of the computer
    for better performance (like `C`). But any programming task can also be performed
    with the various shell languages, and sometimes it''s quicker and more convenient
    to do so.


    Programs for the shell are usually called scripts, and shell scripts can quickly
    become indispensable to the computer power user.


    The DOS Shell: A Hastily Hacked Toy

