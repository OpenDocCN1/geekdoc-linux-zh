    多年前，我那亲爱而体心的妻子送了我一种新奇的 MP3 播放器。如果你没听过这些东西，那你一定把时间都花在山洞里（就像一样）。


    奇怪的是，也许像我这样的程序员并不那么擅长对付这些设备。（嗯，在花了 8 或 10 小时尝试如何让某些复杂的软件正常运行后，你还想去研究一个新设备吗？）


    我的电子设备使用史充满了未使用的设备、未探索的复杂功能，以及屏幕上闪烁着“00:00”而非正确时间的录录像机。我从未成功地通过定时录制过电视节目，也没有远程拨打过留言机器，或者将电视连接到立体声箱。


    这台 MP3 播放器在我的桌子上坐了一年，我才决定尝试一下。


    ## 电脑！它们能正常工作吗？


    第一步是获取一个 MP3 文件并尝试在电脑上播放。然后，使用我的台式 Linux 电脑挑选音乐、存储收藏，最后使用 MP3 播放器来听。


    当我尝试在我的 Linux 电脑上播放 MP3 文件时，我震惊地发现它并不能工作。虽然有一个 MP3 播放器，但当我尝试播放 MP3 文件时，收到了一条错误消息，告诉我缺少解码器。


    事实上，我所做的一切无法让它工作。我可以正常播放 CD，但就是不能播放 MP3。尝试让一切运行起来时，我放进了一张莫扎特歌剧咏调。虽然音乐很好，但我的系统管理却一团糟，我很快就毫无进展。


    （这就是为什么我从根本就不去碰那些电子设备！）


    幸运的是，我有一个好朋友，他对系统管理的了解比我这辈子知道的还要多。他过来坐在我的系统前坐了一会儿，嘴里哼着专注时的口哨。在这种情况下，我做了我擅长的事——去了一杯咖啡。


    当我回来时，一种动感的欧洲舞曲节奏正从我的扬声器中传出来。（伴随着莫扎特，这就是我想听的。）


    显然，我的系统管理员朋友已经让 MP3 播放了。当我问他怎么做时，他开始列出他必须安装的驱动程序和包。


    天哪！这正是新 Linux 用户讨厌的。在另一个操作系统上——那个由亿万翁拥有的系统——这类事情都能直接运行。当我尝试在 Windows 电脑上播放 MP3
    文件时，音乐直接就开始播放了，没有任何废话。


    ## 终极恐怖——律师


    错不在于我们的星辰，而在于我们的律师。MP3 存在一些许可问题，导致 Fedora（我的 Linux 发行版）在其发布中删除了对 MP3 的支持。


    这一切归结为软件专利。


    软件专利是史上最糟糕的主意。


    它们是对那些对软件无所知的人的欺骗。专利律师对软件一无所知，所以你可以取任何显而易见的软件想法，用新的方式表述并申请专利，即使它是一个广为人知的算法，或者是现有原理在工程新领域的明显应用。


    那些可怜的专利审查员知道什么？他们把这留给法院去解决。


    律师是否能理解软件还有待讨论，但大家都同意，让他们尝试辩护是非常、非常昂贵的。没有人想因为违反某项软件专利而上法庭，因为谁愿意花更多时间向一群每小时收费 300
    美元的西装革履的人解释法律呢？


    这让专利拥有了一些力量，即使它们是荒谬的。


    我不知道 MP3 专利是否荒谬。由于对于计算机而言音乐只是一个数据文件，因此压缩技术并不是特别重要。MP3 是一项卓越的技术，但还有其他技术，有些可能一样好甚至更好。


    这归结为营销。大家都知道 MP3。每个人的播放器和手机都能处理 MP3。所以，每个人都要 MP3，而 MP3 专利持有者可以通过出售他们软件想法的使用权来赚钱。


    这一切吓跑了 Fedora，使其不在发行版中包含 MP3 支持，谁又能怪这家公司呢？软件工程师对律师的恐惧超过了律师对软件工程的恐惧。毕竟，工程必须符合逻辑，而在法律中，这一点完全没有要求。


    ## 自由软件的原则立场


    你必须佩服 Fedora 以及其他尊重 MP3 专利的自由软件发行者所采取的原则立场。他们的立场是，只发布你作为用户拥有完全自由的代码。（自由是指“言论自由”的自由，而不是“免费啤酒”的免费。）


    然而，当一个流行的商业格式不被支持时，这会给用户带来一些不便。我认为，随着时间的推移，自由软件将基于一些现有的自由格式进化出更好的格式。最明显的候选者是 Ogg
    Vorbis 格式。市场是否以及何时会采用它则并不那么明显。


    ## 在 Linux 上哪里获取 MP3


    如果你不渴望学习关于在 Linux 上安装包的所有知识，并且没有可以提供帮助的朋友，也许你可以尝试遵循非官方的 Fedora 常见问题列表（`www.fedorafaq.org/#mp3`）。


    现在我终于可以在电脑上播放 MP3 了，下一步是把它们传到我真实的 MP3 播放器上！


    也许明年吧。


    # 柯克船长走在我们中间


    我的一个同事声称，每个人属于三种人格类型之一：柯克船长、史波克先生或麦科伊医生。


    麦科伊医生热于帮助每个人，史波克先生受到理解一切的驱动，而柯克船长受到追求个人荣誉的强烈驱动。根据我同事的理论，我们中只有柯克们对电脑游戏感兴趣。那些喜欢电脑游戏并愿意花这种时间在它们上面的人显然有一些奇怪的人格问题。我说发射鱼雷，让我们向中立区进！因为，虽然名字和面孔可能会改变，但我们都知道大多数电脑游戏的基础是破坏，而新的外星人只是我们还没有遇到的目标。Linux
    世界的情况也无不同。


    ## 无重力 (No Gravity)


    《No Gravity》是一款免费游戏，让你内心的柯克感到快乐。这是一款经典模式的太空射击游戏，允许你驾驶你的小战斗机从一个系统飞到另一个系统，途中击落其他飞船。它既上瘾又易用，比我尝试过的任何其他游戏都能夺走一个周六早晨。


    在学习这个游戏时，在你弄清楚如何在雷达屏幕上区分敌我之前，你会摧毁几十架敌方战斗机——以及几架友自己的。


    画面非常出色，鼠标操作体验极佳。很快，你就会使用鼠标操控一艘具有可加速度的船，穿过由友方船只、敌方战斗机、地雷、导航信标和小行星组成的移动系统。最棒的是，如果有东西挡了你的路，只需点击鼠标即可解脱，向你的太空战斗机对准的目标发射一系列看起来有趣的脉冲。几次精准的射击会让敌方战斗机起火、冒烟，并最终以最令人满意的方式爆炸。


    游戏本身由一系列任务组成，按顺序完成即可进入下一关。最终，我会到达其中一个场景的终点，看看获胜时会发生什么。目前，我对爆炸、火焰和失控旋转要熟悉得多，这些都与被毁有关。


    前往 `No Gravity` 网站下载游戏（适用于 Linux、Mac 或 Windows）和游戏数据文件。（你需要同时拥有游戏和数据文件。）


    Freeciv


