    Using a Debugger


    Even in a small program like find_primes.c there are many mistakes that might
    be made. When programming, any mistakes are likely to result in that dreaded pest
    of the modern world: the software bug. Finding and squashing such bugs is part
    of the programmer''s daily job. Figuring out what has gone wrong can be notoriously
    difficult, but there is a tool that helps: the debugger.


    The GNU debugger is called GDB, and it can be run on our prime number program
    like this:


    gdb ./find_primes


    The debugger allows you to step through the program, one line at a time if you
    like. You can stop anywhere and look at any of the values in the program. The
    debugger deserves its own column some week, because it is so fun and useful that
    it really makes programming a lot easier.


    Java Language Support: Why?


    You might wonder why GNU provides support for Java. After all, Sun is already
    providing Java and all its associated technologies as freeware. But this was not
    always the case, and though they always gave away Java for free, the code itself
    was not released as freeware until just last year.


    Now that the Sun Java code is all freeware, there''s no reason not to just use
    that for Java development. However, the GCC Java compiler will create Java virtual
    machine code for embedded platforms, and that may be easier (and more free) than
    anything else readily available, on small processors that just can''t run the
    Sun JVM.


    # Other Languages


    To use the GNU Compiler Collection with other programming languages, you need
    to use the correct front-end program. For example, G++ is the C++ compiler. Under
    the covers it calls GCC with the correct options to convert C++ code into an executable.
    Other front ends include gfortran for FORTRAN, gpc for Pascal, gcj for Java, etc.
    To program in one of these languages, you write your code and call the appropriate
    front end, with the usual GCC options, and the executable will be built. (Unless
    you have a compile error!)


    The Future of the GNU Compiler Collection


    The GCC project is one of the most active, and most successful projects in free
    software history. Major releases of GCC come every few months, and the software
    is known to be stable, efficient, robust and reliable.


    In classic free software form, the GNU Compiler Collection is organized to make
    the addition of new languages easy. One day, you may just want to invent a new
    computer programming language. When you do, GCC will be there for you!


    Appendix: find_primes.c Source Code


    /* Find prime numbers


    James Hartnett, 4/26/08


    */


    #include<stdio.h>


    #include <stdlib.h>


    #define MAX_NUM 1000


    #define NUM_PRIMES 10


    int


    main()


    {


    int *prime;


    int i, j;


    int n = 1;


    if (!(prime = malloc(NUM_PRIMES * sizeof(int))))


    {


    printf("no memory!n");


    return 1;


    }


    prime[0]= 2;


    for (i = 3; i < MAX_NUM; i++)


    {


    for (j = 0; j < n; j++)


    if ((float)i/prime[j] == (int)i/prime[j])


    break;


    if (j == n)


    {


    prime[n++] = i;


    if (n == NUM_PRIMES)


    {


    printf("reached %d primes.n", n);


    break;


    }


    }


    }


    for (i = 0; i < n; i++)


    printf("%dn", prime[i]);


    free(prime);


    return 0;


    }


