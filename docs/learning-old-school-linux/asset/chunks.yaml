- fmt: '

    So 500 lines should be easy to deal with. But shell scripting is just a pain,
    even in `Bash`, which is the highest development of the shell programming art.
    `Bash` contains all the best ideas from the original Bourne Shell (hence `BASh`:
    the Bourne Again Shell). I don''t mean any criticism for `Bash` when I say that
    a 500-line `Bash` script can be a pain to deal with. Shell scripts are meant for
    simple tasks—the short and sweet sort of thing that can almost always be done
    in one line, if you can just figure out what that one line is.


    But for complicated tasks, `Bash` scripting gets old. Programming `Bash` reminds
    me of the old definition of hardware/software: hardware is the part you can kick;
    software is the part you can only curse at.


    Therefore, I started to switch these scripts to `Perl`. There are several important
    differences between `Perl` and `Bash` scripts, so obviously it''s time for a `Bash`
    vs. `Perl` cage match. There''s not much doubt which language will prevail—it''s
    like watching Bourne the computer nerd fighting `Perl` the world kickboxing champion.
    Stay tuned for some old-fashioned butt-kicking.


    ## Command-Line Options


    Command-line options are those quirky little hyphens and letters you use on the
    command line. For example, `ls` is the command to list the files in the current
    directory, and the `-l` command-line option causes it to list more information
    about each file (the "l" stands for long).


    Command-line options are very useful. They allow you to write general-purpose
    scripts, which can solve the same problem on numerous different data sets. They
    also allow the user to control exactly what your script does, and how it does
    it.


    In `Bash`, command-line options are handled by the `getopts` function.


    ```bash

    while getopts "va:h" opt

    do

    case "$opt" in

    v) verbose=1;;

    a) args=${OPTARG};;

    esac

    done

    ```


    The equivalent `Perl`:


    ```perl

    use Getopt::Long;

    my %opt;

    GetOptions(*bckslsh*%opt, ''verbose'', ''args=s'');

    ```


    It''s not much different for this tiny example, but the `Perl` `GetOption` call
    scales well—adding more options is easier. Also, the `Perl` version gives fancier
    options, with better error handling.


    Some might claim this is an unfair comparison, because it uses an extra code module
    for `Perl`, but leaves `Bash` naked, without a helper function to bless himself
    with. But as the `Getopt::Long` module comes included with `Perl`, it''s fair
    game in a language comparison.


    This round ends with `Perl` ahead on points, and `Bash` still in there for the
    rest of the fight.


    ## Using Other Tools


    Something you always need to do is use the other tools on the machine. `Bash`
    is all about calling other utilities to get the job done. For example, to get
    the current working directory into a variable, you can call the `pwd` command,
    like this:


    ```bash

    dir=`pwd`

    ```


    With `Perl`, the equivalent is more clumsy:


    ```perl

    $dir=`pwd`;

    chomp($dir);

    ```


    In this case, `Bash` is clearly better than `Perl`!


    This round ends as `Bash` lives up to its name and nails `Perl` with a solid body
    blow.


    ## Documentation


    As with most mature Linux technologies, `Bash` is well documented. The `man` page
    for `Bash` (try `"man Bash"`) is complete and well-written. There are also several
    good tutorials available on the Web (just Google `"Bash tutorial"`).


    But the documentation of `Perl` is simply outstanding. Not only do the `Perl`
    man pages comprise an entire book about `Perl` (start with `"man perlintro"`),
    the wealth of online information is unparalleled. I believe `Perl` is the best-documented
    computer programming language I have ever seen. Start with the CPAN site: [www.cpan.org](http://www.cpan.org/).


    In the documentation round, `Bash` throws some good leather, but is completely
    overwhelmed by `Perl`s head-kicks and knee smashes. Looks like `Bash` is in real
    trouble out there!


    ## Data


    Back in the ''80s, programmers developed a concept called "data-driven design."
    The idea was that your programs would be more flexible if they used some sort
    of data store to help control their behavior. That is, instead of having their
    behavior completely hard-coded, it depends on some of the input data as well.


    For example, if an application allows you to set an environment variable to control
    its behavior or edit a data file before running it, that is data-driven design
    in action.


    Data representation is crucial in programming languages. The more closely you
    match your data representation to your real problem, the simpler software development
    is.


    `Bash` has a very simple data representation. It can handle scalars (that is,
    single values) and one-dimensional arrays (groups of values), and that''s about
    it.


    `Perl` has superb data structures. In addition to what `Bash` offers, `Perl` has
    lists, which are much like one-dimensional arrays in `Bash`. `Perl` also offers
    associative data arrays, which contain a set of key-value pairs. With associative
    arrays, very close mappings between the real-world data and the program data are
    possible.


    Finally, `Perl` offers references, a rich pointer syntax that allows for complex,
    indirect data storage.


    In this round, `Bash` is down on the mat bleeding. It has no hope against `Perl`''s
    data body blows.


    ## Object-Oriented Programming


    The problem with programs is that they tend to get bigger and bigger, and more
    and more complicated, until no one can figure out how to change them without breaking
    them. To combat this problem, object-oriented programming was developed. It''s
    really just a way of organizing your code so that you can find what you want,
    even in a million-line program.


    `Bash` has no object-oriented programming constructs at all. They can be faked,
    but that''s not the same as support within the language. `Bash` is like an old-style
    boxer facing a modern kick-boxer. For a boxer, only the hands matter. A kick-boxer
    can punch 10 times harder.


    `Perl` has some great object-oriented moves, with the complete set of classes,
    inheritance and all the rest.


    In this round, `Bash` is against the ropes, absorbing the punishment, and `Perl`
    delivers kick after kick to the head and body.


    ## Calling the Fight


    At this point the doctor is going to call the fight. `Bash` is just not in the
    same league as `Perl`, and perhaps it''s a bit unfair to pit them against each
    other. But they are often used for the same sort of task, so perhaps this kind
    of bloodletting was inevitable.


    The Software Martial Arts Commission might not allow these sorts of cage matches
    in the future, so perhaps it''s almost time for the long-awaited C/Java bout.


    # Got the Time?


    If you''re sitting on a hot stove, according to Einstein, a minute would feel
    like an hour. If you''re talking to a pretty girl, an hour can seem like a minute.
    That, the great Professor asserted, is relativity.


    As Einstein knew, time is no laughing matter, and presents some interesting and
    subtle problems to the software engineer. Even a simple question can have a pretty
    complex answer: how long does a program take to run?


    The motivation for this question is quite obvious. When building some engineered
    system, the computational components must keep pace with the overall system in
    the real world. In other words, we would like to be sure that the program that
    pops the chute out during a space shuttle landing takes less time to run than
    the space shuttle takes to careen off the end of the runway.


    ## How Does the Computer Know?


    Once you set the time on the computer, it keeps track of the passing of the days
    and years. A small battery on the motherboard allows it to keep time even with
    the power off. This is called the "real time clock," and it is read by the operating
    system when the computer is booted.

