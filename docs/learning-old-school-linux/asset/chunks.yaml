    那台微型计算机看起来就像一台主机——一堆像冰箱大小的机箱，放在温度如冰箱的电脑机房里。（在炎热的夏日去那里真是一件享受！）为了备份它，我必须在机器前面装上磁带卷，在控制台上输入命令，然后回去做我的数学作业，而电脑则一卷接一卷地将数据写入磁带。


    错误的后果可能是严重的——我被聘佣来这份工作是因为前任者被耻辱地开除了。磁盘故障了，人们发现他已经好几周没有进行妥当的备份。结果，几周的科学成果付诸东流。


    ## 有时旧方法就是好方法


    从那以后，计算硬件以令人眩眩的速度不断进步。那组巨大的磁盘（我花了大量时间去备份）容量有整整 300 MB。而今天，我有几个比那大得多的数据盘，随处在我的桌面和公文包里转悠。他们在会议和贸易展会上会把这些送出去。


    但备份的需求没有改变，因为人没有变。我们的硬件更可靠了，但我们不是。数据丢失的最主要原因之一是人为错误。有人删除了他们不该删的东西。即使我们的硬件可靠性大幅提高，也无法弥补我们现在随身携带电脑的事。


    我那台旧微型计算机的磁盘只要多看它一眼就会崩溃。我最近的电脑 Yum-yum（一台 EEE 笔记本）甚至没有磁盘驱动器——全都是闪存。我把它掉在水泥地上它依然能工作。但与我那台坐在安全建筑里的旧微型计算机不同，Yum-yum
    随我去任何地方。它不太可能坏，但更容易丢失或被盗。


    备份我的数据比任何时候都重要——但我比我年轻时那个忙忙脚脚的学生可用时间更少。我该如何在不感到乏味的情况下完成备份呢？像如今的许多问题一样，答案是互联网。


    ## 有时新方法是更好的方法


    如今，我们不再备份到磁带了。我们要求对备份数据进行近乎瞬间检索，这对于磁带系统来说很难管理。我们也受益于超廉价、超密度的磁盘技术。将数据备份到磁盘服务器比备份到磁带上更简单、更便宜。


    不过，大多数人并没有在车库里运行任何磁盘服务器，而这正是互联网大显身场的地方。既然有这么多可以比我更可靠地运行磁盘服务器，我为什么要自己运行一个呢？而且无论，我们大多数人也只需要备份少得可怜的数据。磁盘服务器在
    TB 级范围内最经济，而我有 1 GB 的数据要备份就已经算很幸运了，这仅仅是最差的磁盘服务器容量的千分之一。


    因此，出现了像 Mozy 这样的在线备份公司。每月只需大约 5 美元，你就可以通过互联网将 PC 备份到 Mozy 服务器上。如果你以后需要任何旧文件，它们会一直在那里等着你。企业必须支付更多费用，但如果你的业务是以数据为核心的，与收益相比，这个成本是微不足道的。你的数据被远程、安全地备份了，而且只需要投入极少的时间。


    ## 你仍然必须做的事


    尽管你不需要坐在磁带驱动器前等待，但有一项任务你必须注意：指定要备份的内容。


    你硬盘上的绝大部分内容都不值得备份，因为它们大部分是软件，是从磁盘或通过网络使用复杂的安装程序安装的。如今，软件很少仅仅是一个单一的可执行文件。备份这些文件没有意义，因为你通常无法以实用的方式恢复它们。当这些程序出现问题时，你只需从磁盘或网络重新安装，就像你最初安装该程序的方式一样。


    唯一需要备份的文件是你添加到电脑中的个人文件：你的文档、照片、音乐和视频。在 `Windows` 世界中，这些通常都保存在一个名为“我的文档”（My Documents）的文件夹下。在
    `Linux` 世界中，这些将位于你的家目录（home directory）下。


    在设置备份时，确保你想备份的所有数据都可以写入“我的文档”下的某个目录，如果不是，请确保你已将相应的目录添加到备份列表中。


    ## 便宜，还是仅仅吝啬？


    对于我们这些没有以数据为核心的业务、但过着普通数据核心生活的人来说，有更便宜的解决方案吗？当然有，它叫 Google。


    我以数据为核心的生活涉及到许多丢失的文件，以及随之而来的哀嚎和痛苦。当 `Google docs` 出世时，我看到了由他人管理我所有数据文件的即刻好处。对我来说，`Google`
    拥有一切。


    如今，`Google` 甚至允许你在他们的服务器上存储任何旧数据文件，免费额度高达 1 GB。嗯，他们真是好心。通过使用 `Google docs` 处理表格、文字处理和演示文稿，使用
    `Google Picasa` 和 `You Tube` 处理照片和视频，并用额外的 `Google` GB 处理其他一切，进取的计算机用户可以免费获得非常棒的在线备份！


    ## 隐私？谁在乎！


    这种解决方案向 Google 牺牲了所有的隐私概念。他们能利用这些文档做任何事情吗？我真的不知道——但我注意到他们非常擅长从大量文档中提取信息。大多数 Google
    找到我的文档都不涉及秘密。如果我真的在乎隐私，我可以在发送数据到 `Google` 之前对其进行加密，并有足够的信心让国家安全局（National Security
    Agency）之外的任何人无法读取它。如果 `Google` 的人正在读到这里，给点存储空间怎么样？1 GB 并不多！


    ## 紧跟节奏


    等待总是存在。它一直在那里，始终是计算机体验的一部分。从等待电脑启动到等待它关机，使用电脑涉及大量的等待。


    如果你有一套不错的系统（这意味着它可能运行着 `Linux`），并且没有在做任何高要求的操作，这些等待可能是察觉不到的。它们持续的时间可能还没眨眼那么长。但如果你在一个性能稍弱的系统上——也许是一台心爱的超便携电脑——那么你可能需要等久一点、等频繁一点。如果你的要求高一点，如果你在运行几个编译任务、在
    `Emacs` 中编辑 50 个缓冲区并在 `Firefox` 中打开了两打标签页，那么你可能也会开始注意到这种等待了。


    ### 到底发生了什么？


    有时你很清楚自己在等什么，有时则完全不明。有时你可以做些什么，有时真的无能为。第一步是尝试看看发生了什么——你到底在等什么？


    最好的方法是使用名为 `top` 的程序——只需打开终端让它运行即可。


    ```

    top 程序占据整个窗口并每三秒更新一次。当你用完 top 时，按 q 键退出。

    ```


    '
- fmt: '

    The next line tells you all about the tasks—that is, the individual programs running
    on your computer. A Linux computer running X Window will generally have a lot
    of tasks, but a few should be running. Don''t worry about the zombie tasks; your
    computer is not going to try and eat your brain.


    Next comes the summary of your CPU and how busy it is running user code (that
    is, programs you launch), system code (operating system stuff), nice code (which
    someone very pleasantly chose to mark as less urgent with the `nice` command),
    the time spent idle (usually the largest number), and the time spent waiting for
    I/O and serving hardware and software interrupts (which should all be near zero
    under normal conditions).


    The memory is summarized next, with the total amount available, the amount in
    use, the amount free, and the number of buffers currently existing. Don''t worry
    about the number of buffers, but the amount of memory in use and the amount left
    free are important numbers. When you have almost all your memory in use and very
    little free memory, it means you should buy more `RAM`.


    Finally, the swap disk is summarized. The swap disk is there to handle overflow
    from RAM. If you start too many programs, and are trying to use more RAM than
    you really have, the computer will take something you haven''t used for a while
    and write it to the swap disk, freeing up the RAM. Whenever you try and access
    that memory, the computer will sneak off and grab it off the swap disk.


    In my case, there is no swap disk. This is a peculiarity of my system, the ASUS
    Eee.


    # The Task List


    Under the Summary list is an ever-changing list of tasks, organized so that the
    most active are on the top. Each task (or process, as it is sometimes called)
    is assigned a number when it is started. The number has no particular meaning,
    it''s just a way to uniquely identify any task. The first two columns of the task
    list show the process ID of each task, and the user who started it. Then comes
    the priority and niceness of the task, then the amount of memory the task takes
    up in memory, how much of the task is still resident in memory (as opposed to
    being sent to the swap disk), and how much of the tasks memory is also shared
    with one or more other tasks.


    Next comes the most important two numbers: the percentage CPU and the memory that
    this task is using. These will tell you which task is causing you to wait. The
    final two columns show the cumulative CPU time used by the task, and the name
    of the task (the program that is running).


    # Interactive Commands


    `top` is one of those crazy Linux command-line programs that is just souped up
    to the max. There is practically nothing this command can''t do, and its bewildering
    array of command-line choices and options will delight the Unix guru with hours
    to spend reading the `man` page and figuring out all the tricks that are possible
    with `top`.


    Considering the program is targeted at system administrators, I guess it''s not
    too surprising to find so many features hanging off the software. System admins
    can be downright obsessive about knowing what is going on in their system. These
    features can be used by hitting the right keys while `top` is running (so you
    will need a `man` page open in another window to try them out).


    But every now and then, these little extras become just what you need. Recently
    I was wondering if I was taking full advantage of a dual-core system. How to really
    know? Turns out that `top` has an interactive command `1`, which shows the usage
    of each CPU in the system. By seeing that they were both working hard, I was able
    to confirm that I was really getting the most out of the system.


    # Why You Wait


    With a basic understanding of the `top` program, you are now able to answer the
    question posed at the beginning of this column: What are you waiting for when
    you wait for your computer? Just open `top` and look at the top one or two tasks,
    and you will have your answer.


    The `top` program also allows you to see exactly how each program is using the
    computer—what it is costing you in memory and CPU to run each task on that machine.


    # Disk Space--the Final Frontier


    Back in the bad old days, our disks were always full. How well I remember the
    300-megabyte platter drive I had to use back in the ''80s. It was about the size
    of a washing machine. This was, of course, part of a large computer, with its
    own dedicated computer room. After the personal computer came along, I was amazed
    when I saw my first external hard drive; it was about the size of two large hardcover
    books stacked on top of each other. And it held a whole 10 megabytes.


    These days, you can get a 500-gigabyte drive for less than $100. We don''t even
    bother cleaning our disks off—it''s hard to imagine ever filling up 500GB. (Yet
    I know that in 10 years, I''ll think of 500GB as a small amount of disk space!)


    When disk space was tight, there were several tools we used to figure out which
    files to delete in order to free up some disk space. It''s been many years since
    I''ve used them, because of the cheapness of giant disks, but with my little Asus
    Eee computer, there is no disk, only 4GB of static RAM.


    And while 4GB seems like a lot (4,000 times larger than my first PC hard drive),
    I have already filled it after only a few weeks of owning the computer. Oh, deary
    me.


    # The Old Standby: df


    In any kind of disk-space problem, the first command of the Linux guru will be
    the `df` command. It shows the amount of space on the file systems mounted on
    your computer.


    When I run `df` on my computer, it looks a bit funny, because the Eee does some
    things. `df` lists each file system, its total size (in KB), the amount used and
    available, the percentage in use, and where the file system is mounted.


    ```

    $ df

    Filesystem Used Available Use% Mounted on

    rootfs 145700 88792 49212 65% /

    /dev/sda1 145700 88792 49212 65% /

    unionfs 145700 88792 49212 65% /

    tmpfs 254164 12 254152 1% /dev/shm

    tmpfs 131072 72 131000 1% /tmp

    ```


    This tells me that I have only 492MB free on my computer. It sounds like a lot,
    and it is, but these days we''re so greedy with disk space that it won''t last
    long.


    ```

    $ df -h .

    Filesystem Size Used Avail Use% Mounted on

    root 1.4G 869M 481M 65% /

    /dev/sda1 1.4G 869M 481M 65% /

    unionfs 1.4G 869M 481M 65% /

    tmpfs 256M 0 256M 0% /dev/shm

    tmpfs 128M 0 128M 0% /tmp

    ```


    Using the `-h` option gives the output in more readable form.


    # Eee Silliness


    Something that is confusing about this picture is that the little Eee that I am
    using is doing something bit silly with its file systems. In order to be able
    to restore the original software on boot, the Eee keeps a read-only copy of all
    the software. This is typical in the PDA world of Palm, but not very usual with
    a computer system. With a computer like the Eee, there''s really no need for this,
    as the computer can be restored from a USB device. I have found a way to remove
    this business and recover that disk space, but I haven''t tried it yet.


    # Using du


    The `du` command (which stands for "disk usage") will show you how much space
    is used in each subdirectory. Here''s my accumulation of mail messages on my Eee.
    (Frightening—110MB after only a few months!)


    ```

    $ du -h

    16K ./friends

    68M ./rmiug

    4.0K ./drafts

    2.7M ./CLUE

    12K ./returned

    24K ./cygwin

    188K ./science

    368K ./school

    600K ./oracle

    1.4M ./other

    11M ./opera

    9.3M ./mingw

    3.0M ./spam

    2.1M ./archive/mail

    2.1M ./archive

    12M ./junk

    16K ./me

    110M .

    ```


    For more information about the `du` command, try `man du`, but there''s not much
    to this tool.

    '
