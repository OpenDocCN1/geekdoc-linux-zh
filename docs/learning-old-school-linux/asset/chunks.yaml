  trans: '

    工具多到列不完——多到让你忙碌很长、很长一段时间。它们多到足以填满整个本科科学计算机科学课程，再加上研究生级别的课程。它们多到足以完成非常严肃的工作。


    这些不是仿制品，不是以某种方式被“Windows 化”的工具。它们是真实的 UNIX 工具，在 Windows 电脑上为你构建的。你为 `Perl` 编写的脚本、用
    `GCC` 编译的 C 程序，与你在 UNIX 系统上产出的程序完全一样。


    这些不是玩具；它们是行业前沿和研究实验室正在使用的相同工具。


    全部免费！太不可思议。


    # 谁应该获取 Cygwin？


    如果你是一个拥有 Windows 电脑的 UNIX 程序员，请获取 Cygwin。你会非常高兴能随随使用你常用的工具，而且你会发现可以将 Windows 电脑作为
    UNIX 开发平台。


    如果你是计算机科学或工程专业的学生，请获取 Cygwin，这样你就可以接触行业标准工具。这些工具将在课堂上帮助你，并在你找工作的面试中帮助你。


    如果你想了解更多 UNIX 知识，但不想承诺笔记本电脑或桌面切换到 Linux，请获取 Cygwin。或者，如果你厌倦了 Windows 工具的局限性，想要一些更专业的东西，请获取
    Cygwin。


    那么享受它吧，留在 UNIX 的安全茧泡中，而不是冒险进入 Windows 世界的荒野！


    # 如何成为 Linux 大师


    软件是地球上最难以教学的话题之一。


    找一个土木工程师，他知道所有的道路、混凝土和钢筋。找一个机械工程师，他知道所有的锁、铰链、滑轮。找一个软件工程师，他可能甚至不知道你正在使用的语言。对于软件工程师应该知道什么，几乎没有共识。


    观察到的事实是，有些人精通计算机，而另一些不是。我们把优秀的人称为大师（guru），其他人称为用户。


    如何区分他们？大师是能够解决意外问题、提出全面解决方案并让计算机按照你想要运行的人。用户则不能。软件是那种易于观察但难以解释的东西。


    但当你寻找答案时，你却像他们一样，没有接受过操作系统或软件的正式训练。那么，大师是如何管理信息荒野的？为什么他们知道你不知道的？


    ## 投身学习


    要成为一名大师，你必须首先理解要知道的东西太多了，多到即使用一生的精力也无法探索完。在过去的四十年里，最有才华、最高产的程序员投入创造力和精力是惊人的。由于软件几乎具有独特的易复制性，它们可以使用几十年，为下一代软件奠定基础。这种知识遗产、这种丰富的功能是免费给每个人的。


    你无法学会全部。你甚至无法学会其中的 10%。但这意味着你不能尝试吗。大师们总是试图学习更多关于系统的知识。如果你想成为大师，必须培养这种学习的态度，这种持续的投入。除了死亡，这条路没有尽头。（这样看起来有点沮丧，不是吗？）


    ## 用传统方法寻找答案


    面对大量的软件，你如何找到特定问题的答案？


    在发明发明之前，UNIX 世界开发了几种应对此问题的策略。首先是简单但强大的 man page（“Man” 是 manual 的缩写）。这是随系统的文档。通过
    `man` 命令显示。要学习 `find` 命令，输入：`man find`。（要学习更多关于 man 系统，输入：`man man`。）


    尽管 man 系统非常有用且至今仍广泛使用，但也有局限性。由于每个 man page 都是独立的文档，文档之间没有超链接。也没有良好的搜索功能。


    为了解决他们正在进行的软件项目的这些问题，自由软件基金（FSF）开发了 `texinfo` 系统，它基于流行的文本编辑器 `emacs`，但可以通过 `info`
    命令以独立模式运行。`info` 系统允许文档像书一样组织，带有章节、节等。它支持文档之间的链接和各种形式的搜索。`emacs` 用户可以在 `emacs`
    直接获取 `texinfo` 文档。对于构成 Linux 大部分的 FSF 工具，`texinfo` 文档比 man pages 更详细、更有用。它还可以用于生成漂亮的打印手册、PDF
    文档和网站，且全部来自同一个源。当文档由忙碌的程序员维护时，这非常方便。你可以通过 `emacs` 或 `info` 程序获取它，但在网上也可以可用（见下文）。


    ## 用新方法寻找答案


    互联网是自由软件知识的核心库。我不认识任何大师不使用 `Google` 或 `Yahoo` 来寻找新信息，以补充从 man 或 `texinfo` 正式文档中学到的内容。


    经常，错误信息的极其晦涩性反而可以帮助找到你需要的信息。当你面对一个对你来说毫无意义的错误信息时，只需将其复制并粘贴到你喜爱的搜索引擎中。


    由于自由软件文档也在互联网上，你有时可以直接跳过 man 和 texinfo 文档，直接进入网页。你从 man 或 texinfo 系统获得的相同文档将出现在你的搜索结果中，以及来自相关网站的其他命中结果。


    ## 阅读比最低要求更多


    你每天能学到的东西有限，继续学习的最佳方法是尝试每天学一点，或者每次与计算机交互时学一点。


    我注意到的大师和非大师之间的区别是，大师即使在找到寻找的答案后，还会多花 5 或 10 分钟阅读文档。非大师在搞清楚如何做某事时会打开文档，一旦找到答案，他们就会合上书敲击键盘。


    每次额外的 10 分钟阅读让大师能够获取几条关于系统的额外信息。与其阅读最少量的文档，大师多读一点。


    ## 你也可以成为大师


    要成为大师，你必须采取这种态度：学习计算机是你将在整个职业生涯持续做的事情。你必须意识到你对这个主题了解有多少，以及你还需要学习多少。你必须尝试每天学习一些，并从遇到的每一个计算机问题中学习。不要只工作到问题解决，要工作到你很好理解问题是如何解决的。

