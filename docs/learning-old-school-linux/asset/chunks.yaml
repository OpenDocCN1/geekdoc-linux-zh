  trans: '

    所以处理 500 行代码应该很容易。但 Shell 脚本确实很痛苦，即使在 `Bash` 中也是如此，它是 Shell 编程艺术的最高发展。`Bash` 包含了原始
    Bourne Shell 的所有优秀理念（因此称为 `BASh`：Bourne Again Shell）。我说一个 500 行的 `Bash` 脚本处理起来很痛苦时，并不是在批评
    `Bash`。Shell 脚本是为了简单任务设计的——即那种短小精悍的任务，只要你能弄清楚那一行代码是什么，它们几乎总可以用一行代码完成。


    但对于复杂的任务，`Bash` 脚本就显得力不从心。编写 `Bash` 让我想起对硬件/软件的旧定义：硬件是你可以踢的部分；软件是你只能咒骂的部分。


    因此，我开始将这些脚本迁移到 `Perl`。`Perl` 脚本和 `Bash` 脚本之间有几个重要的区别，显然是时候进行一场 `Bash` 对阵 `Perl`
    的笼斗赛了。至于哪种语言会胜出，毫无疑问——这就像是在看电脑宅客 Bourne 对决世界踢踢拳冠军 `Perl`。请继续关注这场老式的毒打大战。


    ## 命令行选项


    命令行选项就是你在命令行使用的那些古怪的小连字符和字母。例如，`ls` 是列出当前目录下文件的命令，而 `-l` 命令行选项导致它列出关于每个文件的更多信息（“l”代表
    long，长格式）。


    命令行选项非常有用。它们允许你编写通用型脚本，这些脚本可以在许多不同的数据集上解决同一个问题。它们还允许用户精确控制你的脚本执行什么以及如何执行。


    在 `Bash` 中，命令行选项由 `getopts` 函数处理。


    ```bash

    while getopts "va:h" opt

    do

    case "$opt" in

    v) verbose=1;;

    a) args=${OPTARG};;

    esac

    done

    ```


    对等的 `Perl` 代码：


    ```perl

    use Getopt::Long;

    my %opt;

    GetOptions(*bckslsh*%opt, ''verbose'', ''args=s'');

    ```


    在这个微小的例子中两者区别并不大，但 `Perl` 的 `GetOption` 调用扩展性很好——添加更多选项更加容易。此外，`Perl` 版本提供了更华丽的选项和更好的错误处理。


    有些人可能会声称这是一种不公平的比较，因为 `Perl` 使用了一个额外的代码模块，而让 `Bash` 赤裸裸的，没有辅助函数可以加持。但由于 `Getopt::Long`
    模块是随 `Perl` 一带的，所以在语言比较中这是公平的。


    这一回合以 `Perl` 积分领先结束，而 `Bash` 仍在战斗中坚守。


    ## 使用其他工具


    你总是需要做的事情就是使用机器上的其他工具。`Bash` 的核心在于调用其他实用程序来完成工作。例如，要将当前工作目录导入变量，你可以调用 `pwd` 命令，如下：


    ```bash

    dir=`pwd`

    ```


    在 `Perl` 中，等效的操作更笨拙：


    ```perl

    $dir=`pwd`;

    chomp($dir);

    ```


    在这种情况下，`Bash` 显然优于 `Perl`！


    这一回合以 `Bash` 不负虚名、用一记结实的重拳击倒了 `Perl` 结束。


    ## 文档


    与大多数成熟的 Linux 技术一样，`Bash` 拥有完善的文档。`Bash` 的 `man` 页面（尝试 `"man Bash"`）是完整且编写良好的。网上也有几个不错的教程（只需在谷歌搜索
    `"Bash tutorial"`）。


    但 `Perl` 的文档简直是出众。不仅 `Perl` 的 `man` 页面包含了一整本关于 `Perl` 的书（从 `"man perlintro"` 开始），而且在线信息的丰富程度无与比比。我相信
    `Perl` 是我见过的文档最好的计算机编程语言。从 CPAN 网站开始：[www.cpan.org](http://www.cpan.org/)。


    在文档回合，`Bash` 拿出了一些不错的拳法，但完全被 `Perl` 的头部踢和膝撞击溃了。看起来 `Bash` 真的遇到大麻烦了！


    ## 数据


    回到 80 年，程序员们开发了一种名为“数据驱动设计”的概念。这个想法是，如果你的程序使用某种数据存储来帮助控制行为，那么程序将更加灵活。也就是说，它们的行为不再完全硬硬编码，而是取决于某些输入数据。


    例如，如果一个应用程序允许你设置环境变量来控制其行为，或者在运行前编辑数据文件，那就是数据驱动设计在发挥作用。


    数据表示在编程语言中至关重要。你的数据表示与实际问题匹配得越紧密，软件开发就越简单。


    `Bash` 的数据表示非常简单。它能处理标量（即单值）和一维数组（值组），仅此而已了。


    `Perl` 拥有卓越的数据结构。除了 `Bash` 提供的之外，`Perl` 还有列表，这非常像 `Bash` 中的一维数组。`Perl` 还提供了关联数据数组，它包含一组键值对。通过关联数组，可以在现实世界的数据与程序数据之间建立非常紧密的映射。


    最后，`Perl` 提供了引用，这是一种丰富的指针语法，允许复杂的间接数据存储。


    这一回合中，`Bash` 倒在垫子上血流不止。面对 `Perl` 的数据重拳，它毫无希望。


    ## 面向对象编程


    程序的问题在于它们倾向于变得越来越大、越来越复杂，直到没有人能看出如何在不破坏它们的情况下修改它们。为了解决这个问题，面向对象编程应运而生。它实际上只是组织代码的一种方式，让你即使在百万行的程序中也能找到你想要的东西。


    `Bash` 完全没有面向对象的编程构造结构。它们可以伪造，但这与语言内部的支持不是回事。`Bash` 就像一个老式拳击手面对现代踢拳手。对于拳击手来说，只有手很重要；而踢拳手的出拳力量可以强
    10 倍。


    `Perl` 拥有一些很棒的面对象技巧，拥有完整的类、继承等所有内容。


    在这一回合中，`Bash` 被逼在绳角上承受着痛苦，而 `Perl` 则对着头部和身体一接一地猛踢。


    ## 战斗结束


    此时，医生要叫停比赛了。`Bash` 根本不是 `Perl` 的一个量级，也许让它们相互对决有点不公平。但它们经常被用于同一类任务，所以也许这种血战是不可避免的。


    软件武术委员会未来可能不再允许此类笼斗赛，所以也许是时候进行期待已久的 C/Java 对决赛了。


    # 有时间吗？


    根据爱因斯坦的说法，如果你坐在热炉子上，一分钟感觉就像一个小时。如果你在和一个漂亮的女孩聊天，一个小时看起来就像一分钟。这位伟大的教授断言，这就是相对论。


    正如爱因斯坦所知，时间不是开玩笑的，它给软件工程师带来了一些有趣而微妙的问题。即使是一个简单的问题也可能有复杂的答案：程序运行需要多长时间？


    这个问题的动机显而易见。在构建某些工程系统时，计算组件必须与现实世界的整个系统保持同步。换句话说，我们希望确保在穿天探测器降落期间弹出的程序运行时间，小于穿天探测器冲出跑道头的时间。


    ## 计算机是如何知道的？


    一旦你在电脑上设置了时间，它就会记录流逝的日子和年。主板上的一块小电池允许它在断电时也能保持时间。这被称为“实时时钟”，操作系统在计算机启动时会读取它。

    '
- fmt: '

    From that point on the real time clock is ignored, and the operating system keeps
    track of the time itself, in memory. As with any time piece, the basis of keep
    the time is a periodic event. For a pendulum clock it is the time the pendulum
    takes to swing back and forth; a quartz watch has it''s little piece of quartz
    inside, pulsing at 60 times a second. Your motherboard has a little circuitry
    somewhere which fires off an interrupt to the main processor 250 times a second.


    This unit of time is known as a "jiffy" and may vary from system to system, based
    on your motherboard, your kernel, and how the system is configured. The main processor
    counts in jiffies and updates a buffer which stores the number of seconds since
    a fixed date and time. In the case of Linux systems, that date and time is January
    1, 1970; this date and time is known as "the epoch" for Unix systems.


    The number of seconds since the epoch is stored as a 32-bit signed integer. Astute
    readers will wonder how long we can keep counting in seconds from 1970 before
    we fill up the 32-bit value. After all, 1970 was a long time ago!


    Computers will run out of space to store more time on January 19, 2038. On that
    day, all over the world, millions (or billions?) of Linux computers will fail
    horribly, unless something is done to address the problem. One proposed solution
    is to double the storage space for time. Critics claim that this is just a short-term
    solution, since the same problem is going to occur again. Supporters point out
    that a 64-bit time would add 290 billion years, and perhaps by then we can figure
    something else out.


    To find out the date and time, use the `date` command, which gives output like
    this:


    ```

    ~> date

    Fri Sep 5 06:14:10 MDT 2008

    ```


    The `date` command lets you control the format of the output, so that you can
    get the date and/or time in whatever way you want. To see the actual number of
    seconds since the epoch, use the `+%s` option, like this:


    ```

    ~> date +%s

    1220616811

    ```


    ## How Long Did My Program Take?


    So one way to time how long your program takes is to use the `date` command before
    and after, and subtract the difference. But this is unsatisfactory for two reasons:
    firstly because subtracting dates and time and showing the output in a meaningful
    way is a pain, and secondly because there is a better way, the `time` command.


    The `time` command is there to help you answer the question: how long did my program
    take to run?


    To use it, just run your program from the command line, and use the word "time"
    first, like this:


    ```

    ~> time ./prime &> /dev/null

    real 0m0.621s

    user 0m0.410s

    sys 0m0.000s

    ```


    (This is timing a program that calculates the first 10,000 prime numbers.)


    The `time` command actually gives you three times, the real, the user, and the
    sys time.


    The real time is what is also called "wall-clock time." This is the most obvious
    answer to the question of how long your program took to run. In this case, it
    took .621 seconds.


    ## What''s Going On Here?


    But Linux is a multi-tasking operating system, and other things are happening
    at the same time that my program is running. For example, every time I type a
    key in the word processor, the computer puts aside everything else it is working
    on and processes my keystroke. Therefore a wall-clock time is not the best way
    to measure how long my program is taking.


    The user and sys times address this problem. They tell how much time the processor
    spent processing user and system code, respectively. User code is the program
    your running (in this case the program is called `prime.c`), and system time is
    the time spent by the program calling system functions.


    To put it another way: the operating system offers a bunch of services to the
    programmer, and these are known as "system calls." The `sys` time is the amount
    of time spent by the CPU handling these calls.


    In this case, my program makes so few system calls that the time for `sys` comes
    out as zero. The time for user, .410 seconds, illustrates the difference between
    wall-clock time and program execution time. The wall-clock time is a third again
    as large as the time spent actually executing my program.


    Using the `time` command you can answer questions about how long your program
    is taking to execute. You may not program the chutes for the space shuttle, but
    you can still find out how long your code takes!


    # Graphics, Sound and Games on Linux


    ## How to Become a Linux Guru: The Graphics


    Back when I was a lad, computer graphics consisted of what you could put together
    with the extended ASCII character set that came with the original IBM PC. That
    consisted of a bunch of little blocks and symbols that looked like something you
    would find on an Egyptian tomb.


    IBM, in addition to all the numbers, punctuation marks and letters, added a bunch
    of funny hieroglyphics to its ASCII table. By printing these symbols in the correct
    places, you could create very primitive graphics on your ASCII terminal. Back
    in the day, this was considered pretty hot. I still remember how excited I was
    when I got bar graphs in my database applications using this technique.


    Compared to the graphics we have now, it was all very primitive. These days, we
    can do a lot better.


    ## The Usual Problem: An Embarrassment of Riches


    As usual with Linux, the biggest problem faced by the new user is the wealth of
    choices. In Windows, there is one graphics system—Windows—and everyone uses it.


    In Linux, there are many flavors of graphics, and you get to pick which one you
    like. The good news is that they all play together well, so no matter which one
    you pick, you can still use software written for components.


    ## The Windows Manager


    In Linux, the graphics comes in two layers: the windows manager and the desktop.


    The windows manager is what draws and maintains the windows on your screen, handles
    your mouse movements, maximizes and minimizes windows, etc. Different windows
    managers are available, and they draw windows that look slightly different.


    In the early days of Linux, this was the layer of software that the user generally
    had to figure out how to install and operate.


    ## Keep It On the Desktop


    The desktop environment software layer is all about aggregating the software in
    the windows manager layer, and adding some extra tools. These tools have become
    a standard part of the computer desktop metaphor. They include things like the
    useful Control Panel along the bottom of the screen. It includes a file manager,
    which allows you to navigate around your hard drive, opening, moving, copying
    or deleting files and directories. The desktop environment also includes system
    administration tools to allow you to manage your system.


    The desktop developers also ensure that a rich suite of software works with their
    desktop, for example a word processor, spreadsheet and presentation editor.


    The idea of the desktop layer is that it gives you a basic set of useful software.
    The desktop is what users directly interact with, and it is here that budding
    Linux gurus will devote their attention.


    The two main flavors of Linux desktop at the moment are called `GNOME` and `KDE`.
    They each have a slightly different look and feel, but they both will be familiar
    enough to any Windows user. Those who are using Linux boxes from some corporate
    vendors (like IBM and HP) will get the `CDE` desktop. Another choice for the slightly
    less conformist would be `Xfce`.

    '
