    while the names and the faces may change, we all know that the basis of most computer
    games is destruction, and new aliens are just targets we haven’t met yet. Things
    aren’t any different in the Linux world.


    No Gravity


    No Gravity, a freeware game, will make your inner Captain Kirk happy. A space
    shoot-’em-up in the classic mold, it allows you to pilot your little fighter from
    system to system, blasting up other spaceships along the way. As addictive as
    it is easy to use, it can suck away a Saturday morning faster than any other Linux
    game I’ve tried.


    While learning this game, you’ll destroy dozens of enemy fighter ships—and a few
    on your own side—before you figure out how to tell friend from foe on the radar
    screen.


    The graphics are excellent, and gameplay with the mouse is outstanding. In no
    time, you will be using the mouse to navigate a ship of variable acceleration
    through a moving system of friendly ships, enemy fighters, mines, navigation beacons,
    and asteroids. Best of all, if anything gets in your way, relief is just a mouse
    click away, firing an array of interesting-looking pulses at whatever your space
    fighter is aimed at. A few well-placed shots will make enemy fighters flame, smoke,
    and eventually explode in a most satisfying manner.


    The game itself consists of a sequence of missions to complete in order to move
    on to the next level of play. Eventually, I’ll get to the end of one of the scenarios
    and find out what happens when you win. At the moment I’m much more familiar with
    explosions, flames, and spinning out of control, which are all associated with
    being destroyed.


    Go to [http://www.realtech-vr.com/nogravity](http://www.realtech-vr.com/nogravity)
    to download the game (for Linux, Mac or Windows) and the game data file. (You
    need both the game and the data file.)


    Freeciv'
