- fmt: "\nOne of the most confusing thing for the newbie is the use of quotes. If\
    \ you look carefully at your keyboard, you will see that there are actually three\
    \ different kinds of quote marks: `\"`, `'` , and `` ` ``. In the Linux bash shell,\
    \ each of these quotes does something different.\n\n### Types of Quotes\n\nThe\
    \ single quote, `'` , does the least of any of the three quotes. It groups strings\
    \ that would otherwise be separate because of the spaces embedded in the string.\
    \ For example, to find the words `\"to be\"` in a file, you could use:\n\n```bash\n\
    grep 'to be' file.txt\n```\n\nThe double-quotes `\"` are like the single quotes,\
    \ except that the string in quotes is searched, and any environment variables\
    \ that can be found are expanded. So if you have an environment variable `$VAR`,\
    \ and it is set to `'be,'` then the following `grep` command will search for the\
    \ string `'to be'`.\n\n```bash\ngrep \"to $VAR\" file.txt\n```\n\nFinally, there\
    \ is the single back quote, `` ` ``, which does something completely different.\
    \ Whatever is inside the single back quotes will be run as if it were typed into\
    \ the command line, and the result will be inserted into your command. For example:\n\
    \n```bash\ngrep `whoami` file.txt\n```\n\nThis will search for the string returned\
    \ by the `whoami` command. The `date` command is frequently useful when trying\
    \ to construct a unique name.\n\n```bash\nfind . > out_`date +%Y%m%d`\n```\n\n\
    ### And and Or\n\nWhen executing commands, I frequently need to perform several\
    \ commands, in order. If there are any problems, I want to stop processing immediately,\
    \ not keep trying to execute the commands.\n\nFor this, the `&&` (and) and `||`\
    \ (or) operators can be very helpful. For example:\n\n```bash\n./configure &&\
    \ make install\n```\n\nThis will run `\"make install\"` only if the `configure`\
    \ command executes correctly. If there is a problem with the `configure`, the\
    \ `make` command will not be run. Parentheses may be used to group the operations\
    \ as well.\n\nUsually the `and` operator is all you need, but occasionally you\
    \ need to use the `or` as well:\n\n```bash\n(./configure && make install) || echo\
    \ \"failure!\"\n```\n\n### The Pipe and the Redirect\n\nFrequently, the output\
    \ of one command needs to become the input of another; this can be achieved with\
    \ the pipe operator: `|`. Yes, that's the tall vertical bar, located somewhere\
    \ around the backspace key on most American keyboards.\n\nFor a trivial example,\
    \ this command will search the list of files and directories returned by the `ls`\
    \ command for a string `\"pictures.\"`.\n\n```bash\nls | grep pictures\n```\n\n\
    The file redirects can be used to send the output of this command to a file on\
    \ disk, instead of to the screen. This command puts the output of the `ls` command\
    \ in a file called `output.tmp`:\n\n```bash\nls > output.tmp\n```\n\nRunning this\
    \ command twice will cause the file `output.tmp` to be overwritten the second\
    \ time. To append instead of overwriting, use the double greater-than sign:\n\n\
    ```bash\nls >> output.tmp\n```\n\nIt's not always clear, but there are two different\
    \ sets of output being displayed on the screen, the so-called `\"standard output\"\
    ` and the `\"standard error\"` streams. (Usually abbreviated `stdout` and `stderr`.)\
    \ The idea is that programs send normal output to `stdout`, and error messages\
    \ to `stderr`. If you do nothing, both of these are dumped to the screen, and\
    \ you see any error messages mixed in with the command output.\n\nIf you automate\
    \ some script, and attempt to capture its output with redirection, you will get\
    \ the `stdout` stream, but not the `stderr` stream. This won't matter if everything\
    \ works OK, but when something goes wrong, you will miss the error messages. One\
    \ final trick is to redirect the error as well as the output stream. Do this in\
    \ bash with the `&>` operator. For example:\n\n```bash\nls &> output.tmp\n```\n\
    \nwill put the output of `ls` into the file, and also any error messages that\
    \ were printed during its execution.\n\n### Using find and grep\n\nTwo commands\
    \ that you can't live without are `find` and `grep`.\n\n`find` will find a file\
    \ or directory by name, size, age and a host of other factors. For example, this\
    \ command will find all files in my home directory, and all subdirectories, which\
    \ have been modified within the last three days, and are greater than one kilobyte\
    \ in size.\n\n```bash\nfind ~ -mtime 3 -size 1k\n```\n\nThe default action of\
    \ `find` is to list the filename (including path) to `stdout`, but you can also\
    \ tell it to perform various actions on the file. This is often used to delete\
    \ files over a certain size that have not been accessed within a certain amount\
    \ of time.\n\n`grep` will search one or more files for a text pattern. It will\
    \ take a regular expression and search a file for anything that matches the regular\
    \ expression. Regular expressions can become very complex very quickly, and are\
    \ powerful ways to pack a lot of functionality into just a few keystrokes.\n\n\
    ### The xargs Command to the Rescue\n\nSometimes you want to pipe one command\
    \ to another, but you want the second command in the chain to run on each line\
    \ of input from the first, instead of once, for all lines of input. It's a subtle\
    \ difference, but important.\n\nIf you want to find all the files that contain\
    \ a certain string, you might be tempted to pipe the output of a `find` to `grep`.\
    \ But that won't work, because you want to run `grep` on each file in the list,\
    \ not on the list itself. The `xargs` command is made for this. Try something\
    \ like:\n\n```bash\nfind . -name something | xargs grep \"some string\"\n```\n\
    \n### This Old Clock\n\nAutomation is a good thing. So when you have a command\
    \ that you run every day (except when you forget), use the `cron` utility to have\
    \ the computer do it for you. `cron` is nothing more than a list of commands that\
    \ are run on a regular schedule. If you have your `EDITOR` shell variable set,\
    \ run:\n\n```bash\ncrontab -e\n```\n\nYour editor will be started, and your currently\
    \ running cron jobs will be displayed (if you have none). Type in something like:\n\
    \n```bash\n0 0 * * * ls ~ ~/mydir.out\n```\n\n Learning More\n\nWhen you have\
    \ 20 minutes some day, look at the man page for `bash` or `tcsh`, or whatever\
    \ shell you use. You will find that it contains a complete programming language,\
    \ and numerous ways to automate or ease common tasks that fall short of the effort\
    \ required to program.\n\nOn a Linux system, I find that the `info` pages often\
    \ contain more documentation than the man pages. If you use `emacs`, try:\n\n\
    ```bash\nM-x info\n```\n\nIf you don't use `emacs` (why not?), try the standalone\
    \ `info` system with:\n\n```bash\ninfo\n```\n\n# In It for the Long Guard\n\n\
    Automation is a good thing. So when you have a command that you run every day\
    \ (except when you forget), use the `cron` utility to have the computer do it\
    \ for you. `cron` is nothing more than a list of commands that are run on a regular\
    \ schedule. ... these tools and techniques will not go away—they will work 20\
    \ years the same way they work. Unlike certain other operating systems, that makes\
    \ Linux worthy of a little study!\n\n# Programming Tools\n\nOne of the great things\
    \ about the ComputorEdge columns was the chance to explore new ideas and new ways\
    \ of writing about programming and technology. I decided to try and teach the\
    \ basics of Linux programming without ever getting heavy for the ComputerEdge\
    \ reader. I don’t know if I actually got anyone to try programming for the first\
    \ time with these articles, but they are still relevant and still show the path\
    \ to a career as a Linux software developer.\n\n# Software Development From 30,000\
    \ Feet\n\nThe Linux software-development tools are the most important part of\
    \ Linux to understand. Without them, there would be no future for Linux—and no\
    \ past, either.\n\n# What Is Software?\n\nSoftware is the set of instructions\
    \ that the computer hardware follows in manipulating the hundreds of millions\
    \ of tiny, transistor-based switches that make up the microprocessor. The switches\
    \ are just tiny machines that can be turned on and off. Any pattern or larger\
    \ meaning in the position of the switches is for us to determine. And it is these\
    \ patterns that allow us to create word processors, spreadsheets and games like\
    \ Pong.\n\n# The Programmer\n\nThe programmer is the person who develops the set\
    \ of instructions. It is a painstaking task, since the computer will do exactly\
    \ what it is told—no matter how stupid. The instruction sets have to be nearly\
    \ perfect to be useful, and it's this quest for perfection that occupies the programmers'\
    \ time.\n"
  raw: 'One of the most confusing thing for the newbie is the use of quotes. If you
    look carefully at your keyboard, you will see that there are actually three different
    kinds of quote marks: ", '', and `. In the Linux bash shell, each of these quotes
    does something different.


    The single quote, '', does the least of any of the three quotes. It groups strings
    that would otherwise be separate because of the spaces embedded in the string.
    For example, to find the words "to be" in a file, you could use:


    grep ''to be'' file.txt


    The double-quotes are like the single quotes, except that the string in quotes
    is searched, and any environment variables that can be found are expanded. So
    if you have an environment variable $VAR, and it is set to ''be,'' then the following
    grep command will search for the string ''to be''.


    grep "to $VAR" file.txt.


    Finally, there is the single back quote, which does something completely different.
    Whatever is inside the single back quotes will be run as if it were typed into
    the command line, and the result will be inserted into your command. For example:


    grep `whoami` file.txt


    This will search for the string returned by the whoami command. The date command
    is frequently useful when trying to construct a unique name.


    find . > out_`date +%Y%m%d`


    And and Or


    When executing commands, I frequently need to perform several commands, in order.
    If there are any problems, I want to stop processing immediately, not keep trying
    to execute the commands.


    For this, the && (and) and || (or) operators can be very helpful. For example:


    ./configure && make install


    This will run "make install" only if the configure command executes correctly.
    If there is a problem with the configure, the make command will not be run. Parentheses
    may be used to group the operations as well.


    Usually the and operator is all you need, but occasionally you need to use the
    or as well:


    (./configure && make install) || echo "failure!"


    The Pipe and the Redirect


    Frequently, the output of one command needs to become the input of another; this
    can be achieved with the pipe operator: |. Yes, that''s the tall vertical bar,
    located somewhere around the backspace key on most American keyboards.


    For a trivial example, this command will search the list of files and directories
    returned by the ls command for a string "pictures."


    ls | grep pictures


    The file redirects can be used to send the output of this command to a file on
    disk, instead of to the screen. This command puts the output of the ls command
    in a file called output.tmp:


    ls > output.tmp


    Running this command twice will cause the file output.tmp to be overwritten the
    second time. To append instead of overwriting, use the double greater-than sign:


    ls >> output.tmp


    It''s not always clear, but there are two different sets of output being displayed
    on the screen, the so-called "standard output" and the "standard error" streams.
    (Usually abbreviated stdout and stderr.) The idea is that programs send normal
    output to stdout, and error messages to stderr. If you do nothing, both of these
    are dumped to the screen, and you see any error messages mixed in with the command
    output.


    If you automate some script, and attempt to capture its output with redirection,
    you will get the stdout stream, but not the stderr stream. This won''t matter
    if everything works OK, but when something goes wrong, you will miss the error
    messages. One final trick is to redirect the error as well as the output stream.
    Do this in bash with the &> operator. For example:


    ls &> output.tmp


    will put the output of ls into the file, and also any error messages that were
    printed during its execution.


    Using find and grep


    Two commands that you can''t live without are find and grep.


    Find will find a file or directory by name, size, age and a host of other factors.
    For example, this command will find all files in my home directory, and all subdirectories,
    which have been modified within the last three days, and are greater than one
    kilobyte in size.


    find ~ -mtime 3 -size 1k


    The default action of find is to list the filename (including path) to stdout,
    but you can also tell it to perform various actions on the file. This is often
    used to delete files over a certain size that have not been accessed within a
    certain amount of time.


    Grep will search one or more files for a text pattern. It will take a regular
    expression and search a file for anything that matches the regular expression.
    Regular expressions can become very complex very quickly, and are powerful ways
    to pack a lot of functionality into just a few keystrokes.


    The xargs Command to the Rescue


    Sometimes you want to pipe one command to another, but you want the second command
    in the chain to run on each line of input from the first, instead of once, for
    all lines of input. It''s a subtle difference, but important.


    If you want to find all the files that contain a certain string, you might be
    tempted to pipe the output of a find to grep. But that won''t work, because you
    want to run grep on each file in the list, not on the list itself. The xargs command
    is made for this. Try something like:


    find . -name something | xargs grep "some string"


    This Old Clock


    Automation is a good thing. So when you have a command that you run every day
    (except when you forget), use the cron utility to have the computer do it for
    you. Cron is nothing more than a list of commands that are run on a regular schedule.
    If you have your EDITOR shell variable set, run:


    crontab -e


    Your editor will be started, and your currently running cron jobs will be displayed
    (if you have none, you will see an empty buffer). Type in something like:


    0 0 * * * ls ~ > ~/mydir.out


    Learning More


    When you have 20 minutes some day, look at the man page for bash or tcsh, or whatever
    shell you use. You will find that it contains a complete programming language,
    and numerous ways to automate or ease common tasks that fall short of the effort
    required to program.


    On a Linux system, I find that the info pages often contain more useful documentation
    than the man pages. If you use emacs, try:


    M-x info


    If you don''t use emacs (why not?), try the standalone info system with:


    info


    # In It for the Long Haul


    One great thing about computers is that there''s always something new to learn,
    and one great thing about Linux is that you can be sure these tools and techniques
    will not go away—they will work in 20 years the same way they work now.


    Unlike certain other operating systems, that makes Linux worthy of a little study!


    Programming Tools


    One of the great things about the ComputorEdge columns was the chance to explore
    new ideas and new ways of writing about programming and technology. I decided
    to try and teach the basics of Linux programming without ever getting too heavy
    for the ComputorEdge reader. I don’t know if I actually got anyone to try programming
    for the first time with these articles, but they are still relevant and still
    show the path to a career as a Linux software developer.


    Software Development From 30,000 Feet


    The Linux software-development tools are the most important part of Linux to understand.
    Without them, there would be no future for Linux—and no past, either.


    What Is Software?


    Software is the set of instructions that the computer hardware follows in manipulating
    the hundreds of millions of tiny, transistor-based switches that make up the microprocessor.
    The switches are just tiny machines that can be turned on and off. Any pattern
    or larger meaning in the position of the switches is for us to determine. And
    it is these patterns that allow us to create word processors, spreadsheets and
    games like Pong.


    The programmer is the person who develops the set of instructions. It is a painstaking
    task, since the computer will do exactly what it is told—no matter how stupid.
    The instruction sets have to be nearly perfect to be useful, and it''s this quest
    for perfection that occupies the programmers'' time.'
