  \ --param ggc-min-expand=63 --param ggc-min-heapsize=63541\nCompiler executable\
  \ checksum: 60ce5af9fc7eaad04f44a3c8fd96f438\nas -V -Qy -o /tmp/cccwq8CL.o /tmp/ccvZtEQN.s\n\
  GNU assembler version 2.17 (i486-linux-gnu)\n```\n\n\n\n失败是一个孤儿，而 Linux 拥有许多、许多个父母，这或许既是其成功的证明，也可以看作对其丰富的遗传历史的解释。\n\
  \nUnix 并不是某一个特定的操作系统，而是一系列基于共同理念和工具的操作系统家族，但不同系统之间存在显著的差异。这产生了丰富的功能集，并为新想法的发明和开发提供了肥沃的环境。它也让软件移植变得像从一群醉酒的大象群带走一桶花生一样，具有挑战性。\n\
  \n# 移植的重要性\n\n成功的软件不可避免地会引发移植；即将软件从一台机器移，并让它在另一台机器上运行。以来自大学研究实验室的软件为例。该程序是由研究生们在多年里开发的，他们每周工作\
  \ 80 小时，晚上睡在电脑前。也许该程序预测的是电路中发生的情况，或者是正在设计的超音速喷气机翼周围的空气流，亦深海中的洋流。无论它做什么，都始于某些输入数据，对其进行处理，并为科学家提供一些新信息——可能是前所未有的信息。这种工具如此强大，以至于没有任何科学研究领域不广泛使用计算机模型。\n\
  \n计算机程序仅仅是复杂的指令。它是程序员领域知识某些子集的正式表达式，与计算机的计算速度以及其上所有其他软件相结合。它就像一小块“大脑”，实际上可以对我们称之为现实的这个巨大混乱的事物做出有用的预测。即使在原始程序员早已离开多年，他们大脑的这一小部分也将继续在它们运行的任何机器上思考。\n\
  \n如果这样想，觉得很神奇，不是吗？\n\n# 令人惊叹\n\n当你这样想时，这很神奇，不是吗？\n\n# 故旧与与新\n\n当你购买新的计算机时，由于 POSIX\
  \ 能够让旧软件在新的机器上运行，这并不总是令人遗憾的。但这仍然是同样的问题：无论你使用哪种软件，它们已经足够强大了。\n\n由于 POSIX 能够在任何系统上运行，这会发生什么？\n\
  \n# 传送，斯波克！\n\nPOSIX 就像《星际迷荒》（Star Trek）中的通用翻译器。正如柯克（Kirk）所解释的那样，由于斯波克（Spock）和麦科伊（McCoy）可以在任何机器上运行，由于\
  \ POSIX 能够在任何系统上运行，这确实很神奇。\n\n# POSIX 的两个部分\n\n正如柯克所解释的那样，由于斯波克和麦科伊可以在任何机器上运行，由于\
  \ POSIX 能够在任何系统上运行，这确实很神奇。\n\nPOSIX 有两个部分：API。\n\nAPI 是一个应用程序接口，它是计算机系统提供的各种服务的接口，这对于开发者非常重要。\n\
  \n当你使用 Windows 系统时，由于 POSIX 能够让旧软件在新的机器上运行，这并不总是……\n\n由于 POSIX 能够在任何系统上运行，这并不总是令人遗憾的。\n\
  \n由于 POSIX 能够让旧软件在新的机器上运行，这并不总是令人遗憾的。\n\n\n\n\n\n这些程序比之前的软件复杂得多，拥有更多的代码文件。将每个命令传递给编译器和链接器变成了一项艰巨的任务。与用于将单个代码文件编译为可执行文件的单行\
  \ `GCC` 命令不同，更复杂的程序是通过一系列步骤构建的，且这些步骤必须按照正确的顺序执行。需要发出几十甚至上百个命令。\n\n对于可怜而简单的程序员来说，跟踪所有这些内容是一项复杂的任务。此外，这还是重复且无聊的。换句话说，这是一项需要软件自动化的任务。而这正是\
  \ Stuart Feldman 通过 `make` 工具实现的。\n\n## 后向链逻辑（回溯逻辑）\n\n`make` 的概念非常简单：你告诉它你想要什么，它就会计算出为了该目标需要执行什么。\n\
  \n当然，它不能独立完成任务——`make` 需要程序员创建一个控制文件，描述可以构建什么的内容（目标 `targets`）以及应该如何构建它们（规则 `rules`）。程序员还可以指定文件之间的依赖关系，明确使用哪些源文件来创建可执行文件。有了所有这些信息，`make`\
  \ 就可以决定构建你的可执行文件的最小步骤集。\n\n由于操作系统会跟踪当前时间以及所有文件的最后修改时间，`make` 能够决定你的哪些文件应该重新编译（因为你自上次编译以来更改了源代码），而哪些文件应该保持不变。\n\
  \n该规范文件被称为 `Makefile`（注意大写的 M）。创建和维护这些文件可能是一件麻烦事，但比没有它们的情况下构建软件要容易得多。\n\n## 示例\n\
  \n以下 `Makefile` 构建了一个名为 `find_primes` 的程序。该程序由两个不同的源文件 `find_primes.c` 和 `calc.c`\
  \ 构建而成。（这是上周专栏中的程序，但为了被拆分成了两个独立的文件，以说明 `make` 的用法。）\n\n这是一个非常简单的示例——真实的项目可能有几十或上百个源文件。\n\
  \n### find_primes 示例的 Makefile。\n\n```makefile\n# find_primes 示例的 Makefile\n# James\
  \ Hartnett 5/2/08\n\nCFLAGS=-g -Wall\n\nall: find_primes\n\nfind_primes: find_primes.o\
  \ calc.o\n\ngcc -o $@ $^\n\nfind_primes.o: find_primes.c\n\ngcc $(CFLAGS) -c -o\
  \ find_primes.o find_primes.c\n\ncalc.o: calc.c\n\ngcc $(CFLAGS) -c -o calc.o calc.c\n\
  \nclean:\n\nrm -f find_primes *.o\n```\n\n以哈号（##）开头的行是注释。`CFLAGS=` 这一行说明了环境变量在 `Makefiles`\
  \ 中的用法。文件的其余部分包含了五个目标、它们的依赖项以及从依赖项生成目标的规则。\n\n第一个目标 `all` 是一个特殊目标——使用此目标可以列出你希望此\
  \ `Makefile` 生成的所有内容。在这种情况下，它将 `find_primes` 列为一个依赖项。依赖项是子目标，在尝试执行规则（如果有的话）构建目标之前，必须先构建这些目标。\n\
  \n第二个目标是 `find_primes`，即我们感兴趣的可执行文件。它依赖于两个对象文件 `find_primes.o` 和 `calc.o`。该目标的规则是使用\
  \ `GCC` 从对象文件构建 `find_primes` 的命令。\n\n接下来两个目标展示了如何从源文件 `find_primes.c` 和 `calc.c`\
  \ 构建对象文件 `find_primes.o` 和 `calc.o`。\n\n最后一个目标 `clean` 没有依赖项。它的规则是一个 `rm` 命令，用于删除可执行文件以及对象文件。这个常用的目标允许我们通过输入\
  \ `make clean` 来删除所有创建的文件并从头开始。\n\n通过这个 `Makefile`，开发者可以修改任何源文件，然后执行 `make all`\
  \ 命令来构建可执行文件。只有发生变化的代码文件会被重新编译，而 `make` 会计算出构建你的程序所需的所有步骤。\n\n## 内置规则、特殊符号和其他奥秘\n\
  \n这一切看起来似乎很简单，但仅仅是因为这个示例并没有真正代表现实环境中的 `Makefile` 样子。注意在我们的示例 `Makefile` 中，某些字符串在多处重复。例如，字符串\
  \ `\"find_primes\"` 在文件中出现了许多处。程序员非常讨厌那样的。这不仅读起来很无聊，还增加了字符串在某处被错错的概率，从而导致 bug。让每个字符串只出现在一个地方要好得多。\n\
  \n此外，`make` 做了很多假设。由于 `make` 和 C 语言语言是共同成长的，当你编写 C 代码时（如本示例所示），`make` 所做的的假设是非常靠谱的。你不需要告诉\
  \ `make` 如何将 C 源码转换为对象文件。`Make` 比你更了解它，并且可以信任它来处理这些细节。\n\n`make` 定义了一些特殊符号，有助于解决字符串重复的问题。它们让初学者觉得\
  \ `Makefile` 稍微有点难以懂，但这就是生活键盘上的常态。\n\n这里是同一个 `Makefile`，利用了 `make` 提供的一些特殊符号和其他快捷方式。我怀疑，如果我再花几个小时去研究\
  \ GNU make 手册（[www.gnu.org/software/make/manual/html_node/index.html](http://www.gnu.org/software/make/manual/html_node/index.html)），还有更多可以利用的方法。\n\
  \n```makefile\n# find_primes 示例的 Makefile\n# James Hartnett 5/2/08\n\nCFLAGS=-g\
  \ -Wall\n\nall: find_primes\n\nfind_primes: find_primes.o calc.o\n\ngcc -o $@ $^\n\
  \nclean:\n\nrm -f find_primes *.o\n```\n\n## 简洁是混乱之灵魂\n\n你可能在很多时候赞美 Unix 的简洁，但在调试\
  \ `Makefile` 问题时，没有任何一次会这样做。逻辑的后向链、内置规则、特殊符号的使用，都使得 `make` 成为一个真正的挑战。冗余选项（`-v`）可以用于解决关于\
  \ `make` 正在做什么任何问题，但输出过于冗长了，以至于追踪发生的情况仍然像从暴躁的山狮身上挑带病的小跳子一样无趣。\n\n但当你只有这些手段时，它们就是你的全部了。\n\
  \n## Make 的未来\n\n尽管 `make` 取得了巨大的成功，但它的缺点已经变成了传奇。`make` 的复杂性从一开始就贡献了一层神秘色彩。对于非常复杂的项目，创建和维护\
  \ `Makefiles` 变成了一项全职工作。\n\n由于这些原因，Stuart Feldman 的工具依然活在 Linux 程序员的心中和记忆中。\n\n\n\
  \n```perl\nreturn 0;\n\n}\n```\n\n# 价值连城的 Perl\n\n一个自由软件产品似乎需要 20 年才能达到完全成熟。大多数自由软件项目是由一位狂热（甚至略带疯狂）的程序员启动的。但如果该产品满足了社区的真实需求，一个自由软件项目就会开始吸引其他程序员，最初作为用户，然后作为协作者。\n\
  \n名为 Perl 的编程语言就是如此。它由一位名叫 Larry Wall 的程序员于 1996 年创立，最初是一个旨在帮助理清 Unix 系统管理员在日常生活中充斥的数以万计文本文件的程序。\n\
  \n从这些谦微的起点开始，Perl 已经成为计算机历史上最受欢迎的语言之一，在全球范围内拥有数十万用户。\n\n## 编译 vs. 解释\n\n从本质上说，每种语言的每个程序都是一个简单的文本文件（或一组文本文件）。程序员在这个文本文件中倾注他的工作，试图确保每一个变量名、循环索引和分号都是正确的。\n\
  \n一旦程序员认为程序已准备好运行，他就要面临着一项任务：让计算机理解这些文本文件，并将它们转换为计算机实际上可以使用的指令。\n\n在某些语言中，这一步只需执行一次——程序员将他的文本文件输入另一个程序（即编译器），构造出一些可以运行的二进制文件，这些文件可以直接输入计算机运行——无需进一步处理。编译型语言就是如此，例如\
  \ `C`、`C++`、`Fortran` 以及许多其他语言。\n\n而在其他语言中，如 `csh`、`Perl` 和 `Java`，程序并不是编译一次的；每每当你运行时它都会被处理（或解释）。解释型语言中产生的不是计算机可以理解的二进制文件，而是文本文件在每次运行时都会被重新解释。\n\
  \n使用解释型语言似乎效率较低，因为计算机在每次运行程序时都必须研究你的源代码，而不是只需研究一次。在过去，这被认为是一个严重的缺点，但现如今，反正有这么多 CPU\
  \ 周期被浪费了，我们真的不再在乎效率了。\n\n解释型语言的另一个缺点是运行程序需要源代码。对于编译后的程序，你只需要二进制可执行文件；但对于解释型程序，你需要所有的源代码。如果你想销售专有软件，这就是一个问题，正因如此，商业软件几乎总是用编译型语言编写的。也许因为这些限制，解释型语言似乎受到了语言开发者的关注少得多，90\
  \ 年代后期的大多数解释型语言都饱受语法糟糕和组织大型代码库资源匮乏的痛苦——直到 Perl 的出现。\n\n## Perl 中有不止一种实现方法\n\n`Perl`\
  \ 与其它语言最大的区别之一是完成一项任务的方法有很多。在大多数语言中，核心思想是执行每个编程任务应该只有一种正确的方法。如果完成某件事有多种方法，理论上认为这将导致程序员的困惑，一些程序员用一种方式做，另一些则用另一种方式。\n\
  \n在 `Perl` 中，这种观点被颠倒了。不是只有一种处理方法，而是有很多种。选择哪种方式最方便取决于程序员。这确实很容易导致代码组织混乱、令人困惑。但它也允许程序员以最适合自己的编程风格，以极快的速度进行工作。\n\
  \n## 面向对象的力量中心\n\n`Perl` 作为过程化脚本语言运行良好，就像一种超级 Shell。它和在 `bash` 或 `csh` 中编程非常像，只是每一切都稍微（或很多）更方便。\n\
  \n但当使用其强大的面向对象特征时，`Perl` 才真正开始放异彩。通过面向对象编程，可以编写庞大的程序，而不牺牲代码结构。\n\n与 `C++`（且与 `Java`\
  \ 不同），`Perl` 的面向对象特征并没有侵入语言本身。你可以很容易用过程化的方式编写，直到写了几页代码，然后切换到面向对象编程，而无需丢弃所有现有的代码。\n\
  \n## 来自朋友的小帮助\n\n面向对象编程的优点之一是，如果做得正确，它允许重用现有代码。其想法是逐渐建立一个代表你问题域的对象库。随着时间的推移，这些不断增长的代码将让你编程得更快。\n\
  \n在实践中，现实世界里很难实现重用性。但在 `Perl` 世界里，你不需要那么努力。存在一个名为 `CPAN` 的神奇代码库，即 `Comprehensive_Perl_Archive_Network`（`[www.cpan.org]`）。这个免费的\
  \ `Perl` 代码存档为几乎可以想象的任务提供了代码模块和脚本，从统计学到神经网络。\n\n严肃的 `Perl` 项目在浪费时间重复轮子之前，都会先访问一下\
  \ 看看从这个免费软件糖果店中可以获取到什么。\n\n## 学习 Perl\n\n`Perl` 拥有任何 Unix 工具中最详尽的帮助文档（man pages）。从\
  \ `\"man perlintro` 开始。初者的面向对象教程对于那些寻求使用 `Perl` 面向特征的人来说是关重要的，但请确保你先对过程化编程良好的理解。\n\
  \n## 一个代码示例\n\n不可能给出一个代表 `Perl` 编程的 `Perl` 示例，因为根据任务和程序员的不同，它可以看起来非常不同。这种像变色龙一样的语言适合所有程序员，因为它允许……\n\
  \n\n\n\n所以处理 500 行代码应该很容易。但 Shell 脚本确实很痛苦，即使在 `Bash` 中也是如此，它是 Shell 编程艺术的最高发展。`Bash`\
  \ 包含了原始 Bourne Shell 的所有优秀理念（因此称为 `BASh`：Bourne Again Shell）。我说一个 500 行的 `Bash`\
  \ 脚本处理起来很痛苦时，并不是在批评 `Bash`。Shell 脚本是为了简单任务设计的——即那种短小精悍的任务，只要你能弄清楚那一行代码是什么，它们几乎总可以用一行代码完成。\n\
  \n但对于复杂的任务，`Bash` 脚本就显得力不从心。编写 `Bash` 让我想起对硬件/软件的旧定义：硬件是你可以踢的部分；软件是你只能咒骂的部分。\n\n\
  因此，我开始将这些脚本迁移到 `Perl`。`Perl` 脚本和 `Bash` 脚本之间有几个重要的区别，显然是时候进行一场 `Bash` 对阵 `Perl`\
  \ 的笼斗赛了。至于哪种语言会胜出，毫无疑问——这就像是在看电脑宅客 Bourne 对决世界踢踢拳冠军 `Perl`。请继续关注这场老式的毒打大战。\n\n##\
  \ 命令行选项\n\n命令行选项就是你在命令行使用的那些古怪的小连字符和字母。例如，`ls` 是列出当前目录下文件的命令，而 `-l` 命令行选项导致它列出关于每个文件的更多信息（“l”代表\
  \ long，长格式）。\n\n命令行选项非常有用。它们允许你编写通用型脚本，这些脚本可以在许多不同的数据集上解决同一个问题。它们还允许用户精确控制你的脚本执行什么以及如何执行。\n\
  \n在 `Bash` 中，命令行选项由 `getopts` 函数处理。\n\n```bash\nwhile getopts \"va:h\" opt\ndo\n\
  case \"$opt\" in\nv) verbose=1;;\na) args=${OPTARG};;\nesac\ndone\n```\n\n对等的 `Perl`\
  \ 代码：\n\n```perl\nuse Getopt::Long;\nmy %opt;\nGetOptions(*bckslsh*%opt, 'verbose',\
  \ 'args=s');\n```\n\n在这个微小的例子中两者区别并不大，但 `Perl` 的 `GetOption` 调用扩展性很好——添加更多选项更加容易。此外，`Perl`\
  \ 版本提供了更华丽的选项和更好的错误处理。\n\n有些人可能会声称这是一种不公平的比较，因为 `Perl` 使用了一个额外的代码模块，而让 `Bash` 赤裸裸的，没有辅助函数可以加持。但由于\
  \ `Getopt::Long` 模块是随 `Perl` 一带的，所以在语言比较中这是公平的。\n\n这一回合以 `Perl` 积分领先结束，而 `Bash`\
  \ 仍在战斗中坚守。\n\n## 使用其他工具\n\n你总是需要做的事情就是使用机器上的其他工具。`Bash` 的核心在于调用其他实用程序来完成工作。例如，要将当前工作目录导入变量，你可以调用\
  \ `pwd` 命令，如下：\n\n```bash\ndir=`pwd`\n```\n\n在 `Perl` 中，等效的操作更笨拙：\n\n```perl\n$dir=`pwd`;\n\
  chomp($dir);\n```\n\n在这种情况下，`Bash` 显然优于 `Perl`！\n\n这一回合以 `Bash` 不负虚名、用一记结实的重拳击倒了\
  \ `Perl` 结束。\n\n## 文档\n\n与大多数成熟的 Linux 技术一样，`Bash` 拥有完善的文档。`Bash` 的 `man` 页面（尝试\
  \ `\"man Bash\"`）是完整且编写良好的。网上也有几个不错的教程（只需在谷歌搜索 `\"Bash tutorial\"`）。\n\n但 `Perl`\
  \ 的文档简直是出众。不仅 `Perl` 的 `man` 页面包含了一整本关于 `Perl` 的书（从 `\"man perlintro\"` 开始），而且在线信息的丰富程度无与比比。我相信\
  \ `Perl` 是我见过的文档最好的计算机编程语言。从 CPAN 网站开始：[www.cpan.org](http://www.cpan.org/)。\n\n\
  在文档回合，`Bash` 拿出了一些不错的拳法，但完全被 `Perl` 的头部踢和膝撞击溃了。看起来 `Bash` 真的遇到大麻烦了！\n\n## 数据\n\n\
  回到 80 年，程序员们开发了一种名为“数据驱动设计”的概念。这个想法是，如果你的程序使用某种数据存储来帮助控制行为，那么程序将更加灵活。也就是说，它们的行为不再完全硬硬编码，而是取决于某些输入数据。\n\
  \n例如，如果一个应用程序允许你设置环境变量来控制其行为，或者在运行前编辑数据文件，那就是数据驱动设计在发挥作用。\n\n数据表示在编程语言中至关重要。你的数据表示与实际问题匹配得越紧密，软件开发就越简单。\n\
  \n`Bash` 的数据表示非常简单。它能处理标量（即单值）和一维数组（值组），仅此而已了。\n\n`Perl` 拥有卓越的数据结构。除了 `Bash` 提供的之外，`Perl`\
  \ 还有列表，这非常像 `Bash` 中的一维数组。`Perl` 还提供了关联数据数组，它包含一组键值对。通过关联数组，可以在现实世界的数据与程序数据之间建立非常紧密的映射。\n\
  \n最后，`Perl` 提供了引用，这是一种丰富的指针语法，允许复杂的间接数据存储。\n\n这一回合中，`Bash` 倒在垫子上血流不止。面对 `Perl` 的数据重拳，它毫无希望。\n\
  \n## 面向对象编程\n\n程序的问题在于它们倾向于变得越来越大、越来越复杂，直到没有人能看出如何在不破坏它们的情况下修改它们。为了解决这个问题，面向对象编程应运而生。它实际上只是组织代码的一种方式，让你即使在百万行的程序中也能找到你想要的东西。\n\
  \n`Bash` 完全没有面向对象的编程构造结构。它们可以伪造，但这与语言内部的支持不是回事。`Bash` 就像一个老式拳击手面对现代踢拳手。对于拳击手来说，只有手很重要；而踢拳手的出拳力量可以强\
  \ 10 倍。\n\n`Perl` 拥有一些很棒的面对象技巧，拥有完整的类、继承等所有内容。\n\n在这一回合中，`Bash` 被逼在绳角上承受着痛苦，而 `Perl`\
  \ 则对着头部和身体一接一地猛踢。\n\n## 战斗结束\n\n此时，医生要叫停比赛了。`Bash` 根本不是 `Perl` 的一个量级，也许让它们相互对决有点不公平。但它们经常被用于同一类任务，所以也许这种血战是不可避免的。\n\
  \n软件武术委员会未来可能不再允许此类笼斗赛，所以也许是时候进行期待已久的 C/Java 对决赛了。\n\n# 有时间吗？\n\n根据爱因斯坦的说法，如果你坐在热炉子上，一分钟感觉就像一个小时。如果你在和一个漂亮的女孩聊天，一个小时看起来就像一分钟。这位伟大的教授断言，这就是相对论。\n\
  \n正如爱因斯坦所知，时间不是开玩笑的，它给软件工程师带来了一些有趣而微妙的问题。即使是一个简单的问题也可能有复杂的答案：程序运行需要多长时间？\n\n这个问题的动机显而易见。在构建某些工程系统时，计算组件必须与现实世界的整个系统保持同步。换句话说，我们希望确保在穿天探测器降落期间弹出的程序运行时间，小于穿天探测器冲出跑道头的时间。\n\
  \n## 计算机是如何知道的？\n\n一旦你在电脑上设置了时间，它就会记录流逝的日子和年。主板上的一块小电池允许它在断电时也能保持时间。这被称为“实时时钟”，操作系统在计算机启动时会读取它。\n\
  \n\n\n从那个点起，实时时钟被忽略了，操作系统开始在内存中自行跟踪时间。与任何计时设备一样，计时的基础是一个周期性事件。对于摆钟来说，是摆钟来回摆动的时间；石英表则内部有一块小小的石英，每秒脉动\
  \ 60 次。你的主板在某处有一个微型电路，每秒向主处理器发送 250 次中断信号。\n\n这个时间单位被称为“jiffy”，它可能根据你的主板、内核以及系统配置而因而异。主处理器以\
  \ jiffies 为单位进行计数，并更新一个缓冲区，该缓冲区存储自某个固定日期和时间以来的秒数。对于 Linux 系统，该日期和时间是 1970 年 1 月\
  \ 1 日；这个日期和时间被称为 Unix 系统的“纪元”（the epoch）。\n\n自纪元来的秒数以 32 位符号整数的形式存储。敏锐的读者会好奇，从 1970\
  \ 年开始，我们还能按秒持续计数多久才会填满这个 32 位的值？毕竟，1970 年已经是很久以前的事了！\n\n计算机将在 2038 年 1 月 19 日耗尽存储时间空间。在那一天，全球数百万（或数十亿？）Linux\
  \ 计算机将发生严重的故障，除非采取措施来解决这个问题。一种建议的解决方案是将时间存储空间翻倍。批评者声称这只是一个短期方案，因为同样的问题将再次发生。支持者指出，64\
  \ 位时间将增加 2900 亿年，也许那时我们可以想出其他办法。\n\n要查看日期和时间，请使用 `date` 命令，它的输出如下：\n\n```\n~> date\n\
  Fri Sep 5 06:14:10 MDT 2008\n```\n\n`date` 命令允许你控制输出格式，以便以你想要的方式获取日期和/或时间。要查看自纪元以来的实际秒数，使用\
  \ `+%s` 选项，如下：\n\n```\n~> date +%s\n1220616811\n```\n\n## 我的程序运行了多久？\n\n所以，计时程序运行时间的一种方法是在程序运行前后使用\
  \ `date` 命令，然后减去差值。但这样做由于两个原因是不如意的：首先，减去日期和时间并以有意义的方式输出非常痛苦；其次，有一个更好的方法，即 `time`\
  \ 命令。\n\n`time` 命令的作用是帮助你回答问题：我的程序运行了多长时间？\n\n要使用它，只需从命令行运行你的程序，并在前面加上 \"time\"\
  \ 单词，如下：\n\n```\n~> time ./prime &> /dev/null\nreal 0m0.621s\nuser 0m0.410s\nsys\
  \ 0m0.000s\n```\n\n（这是对一个计算前 10,000 个质数的程序的计时。）\n\n`time` 命令实际上为你提供了三个时间：实际时间（real）、用户时间（user）和系统时间（sys）。\n\
  \n实际时间也被称为“墙上时间”（wall-clock time）。这是对程序运行了多久这个问题最直观的答案。在这种情况下，它花费了 .621 秒。\n\n##\
  \ 这里发生了什么？\n\n但 Linux 是一个多任务操作系统，在我的程序运行时，其他事情也在同时发生。例如，每我在文字处理器中输入一个按键时，计算机都会放下正在工作的其他所有任务并处理我的按键。因此，墙上时间不是测量我的程序运行多长时间的最佳方法。\n\
  \n用户时间和系统时间解决了这个问题。它们分别告诉你在处理用户和系统代码上花费了多少时间。用户代码是你正在运行的程序（在本例中，程序名为 `prime.c`），而系统时间是程序调用系统函数时花费的时间。\n\
  \n换句话说：操作系统为程序员提供了一系列服务，这些服务被称为“系统调用”（system calls）。`sys` 时间是 CPU 处理这些调用所花费的时间。\n\
  \n在这种情况下，我的程序调用的系统调用非常少，因此 `sys` 时间为零。用户时间为 .410 秒，说明了墙上时间与程序执行时间之间的差异。墙上时间是实际执行我程序花费时间的三倍。\n\
  \n使用 `time` 命令，你可以回答关于程序执行需要多长时间的问题。你可能没有在为航天飞机编写轨道控制程序，但你仍然可以查出你的代码运行了多久！\n\n#\
  \ Linux 上的图形、声音与游戏\n\n## 如何成为 Linux 大师：图形\n\n当我还是个孩子时，计算机图形是由你可以使用原始 IBM PC 自带的扩展\
  \ ASCII 字符集组合而成的。那由许多小方块和符号组成，看起来就像你在埃及墓中会看到的东西。\n\nIBM 除了所有的数字、标点符号和字母外，还在其 ASCII\
  \ 表中增加了一系列有趣的象形文字。通过在正确的位置打印这些符号，你可以在你的 ASCII 终端上创建非常原始的图形。在那个时代，这被认为是非常酷的。我仍然记得当我使用这种技术在数据库应用程序中条形图时是多么兴奋。\n\
  \n与我们现在的图形相比，那都非常原始。如今，我们可以做得好得多。\n\n## 常见的问题：选择的困恼\n\n正如 Linux 的常态，新用户面临的最大问题是选择极其丰富。在\
  \ Windows 中，有一种图形系统——Windows，所有人都在使用它。\n\n在 Linux 中，有许多种图形版本，你可以选择你喜欢的。好消息是，它们之间的兼容性很好，所以无论你选择哪一种，都可以使用为组件编写的软件。\n\
  \n## 窗口管理器\n\n在 Linux 中，图形分为两个层：窗口管理器和桌面。\n\n窗口管理器负责在屏幕上绘制和维护窗口，处理鼠标移动、最大化和最小化窗口等。有不同的窗口管理器可用，它们绘制的窗口看起来有所不同。\n\
  \n在 Linux 早期，这是用户通常需要学习如何安装和操作的软件层。\n\n## 留在桌面\n\n桌面环境软件层的核心是将窗口管理器层的软件，并添加一些额外的工具。这些工具已经成为计算机桌面的标准部分。它们包括屏幕底部的有用控制面板。它包含一个文件管理器，允许你在硬盘中导航，打开、移动、复制或删除文件和目录。桌面环境还包含系统管理工具，允许你管理系统。\n\
  \n\n\n\n最好的消息是，所有不同的图形组件都能良好地协作。对于用户来说，一个程序是为 `KDE` 还是 `GNOME` 开发的并不重要。它在两者上都能运行。\n\
  \n## 系统管理员的现实\n\n在 `Linux` 中，有一个定义且公开的层级，桌面软件在该层运行。在该层之上，用户可以看到对话框、鼠标指针以及现代 GUI\
  \ 的其他方面。在这一层之下，一切都是文本编辑和命令行界面。那些华丽的系统管理员工具和文件管理器软件只是在这些现有功能上增加了一个门面。\n\n因此，始终存在跳过精美的图形工具、在命令行中进行系统管理的可能。这很有帮助，因为如果你被图形工具中所有复杂的操作搞乱了，你可以回到基础，弄清楚到底发生了什么。\n\
  \n此外，你使用哪一套图形工具来操作系统并不重要。你可以在同一台系统上从 `GNOME` 切换到 `KDE` 工具，它们可以正常协作，因为它们处理的都是同一个底层层。\n\
  \n## 哪一个适合你？\n\n哪一个是最好的桌面软件包？这很难说。\n\n我已经同时使用了它们多年（在两台不同的电脑上），我真的无法说我更偏于其中一个。对于那些非常视觉导向的人来说，可能会有些偏好，但我可以在两者之间切换而甚至毫无察觉。在两种情况下，一切都运行得良好，而且我预期在电脑上找到的一切东西都在那里。对我来说，使用\
  \ `KDE` 还是 `GNOME` 并不重要。\n\n通过 `Linux`，你拥有很多选择，但桌面环境的选择其实很简单：随用你手头有的哪一个即可。如果你不喜欢它的某些地方，或者只是想尝试新事物，就切换到一个新的桌面环境并尝试一下吧。\n\
  \n在这一切之下，实际运行的实际上已经可靠运行了十年或以上的相同的基于文本的代码。桌面只是这台强大软件引擎上的一组精美的刻度旋钮。\n\n# X 标记之处\n\n\
  当你第一次看 `Linux` 系统时，你会看到一些非常熟悉的东西。有桌面，上面有各种对象。有一个任务栏，上面有一些信息和按钮，还有一个无处不在的鼠标指针箭头——它呆在屏幕中间，但被我训练良好的大脑过滤在了视野之外，直到我需要找到它。\n\
  \n你可能会注意到关于 `Linux` 桌面的一点：它看起来和 `Windows` 一样！\n\n这并非巧合，也不是 `Linux` 复制了雷德蒙那些“微型农民”的作品。这两个图形环境看起来相同的原因是它们都源自一个共同的源——`Xerox`\
  \ 的第一个图形用户界面工作，以及其直接的衍生品 `Apple Macintosh`。这些概念是在 `Xerox` 的帕洛奥托研究中心开发的，并且从那以后，它们以几种不同的方式结出了成果。\n\
  \n## X 的起源\n\n1983 年，在麻省学院计算机科学实验室，一些教授面临着一个问题。他们需要为学生提供一个计算环境，但他们有各种电脑，每台电脑都有自己不同的处理方式。他们决定创建一个可以在所有机器上运行、但在每台机器上看起来都相同的图形系统。他们将其命名为\
  \ `X Window`，或者 `X`。\n\n换句话说，他们刻意设计了一个跨平台的图形用户界面；以前虽然有其他的图形界面，但 `X` 是第一个从一开始就为跨平台使用而编写的。\n\
  \n这对程序员和硬件提出了额外的要求，并且让每个人的前期工作都增加了一点。但大家都认为这是一个优雅的设计。\n\n## Windows 方式\n\n在 80 年代节奏快且竞争激烈的个人电脑行业中，优雅的设计被认为是一种奢侈品。在\
  \ `Windows` 操作系统，程序和用户界面之间没有分离。你运行一个程序（比如电子表格），一个窗口打开了，一段代码正在运行。代码与窗口并不是分离的——它们是一个包。所有内容都混合成一团代码并发货。\n\
  \n忘记优雅吧。\n\n## 以太网和其他疯狂的想法\n\n`X Window` 项目也是第一个充分利用高高速以太网（`Ethernet`）的图形用户界面。通过\
  \ `X Window`，用户界面可以位于运行它的程序的不同机器上。这是因为 `X Window` 被设计为一个客户端-服务器系统。客户端是显示用户界面的程序，服务器是执行工作的程序。\n\
  \n这种设计非常强大，因为它允许你在远程机器上运行程序。例如，你可以在远程机器上运行文本编辑器，并在本地机器上显示它。当你正在一台强大的服务器上工作但拥有一台速度慢的笔记本电脑时，这尤为有用。\n\
  \n\n\n\n\n多年前，我那亲爱而体心的妻子送了我一种新奇的 MP3 播放器。如果你没听过这些东西，那你一定把时间都花在山洞里（就像一样）。\n\n奇怪的是，也许像我这样的程序员并不那么擅长对付这些设备。（嗯，在花了\
  \ 8 或 10 小时尝试如何让某些复杂的软件正常运行后，你还想去研究一个新设备吗？）\n\n我的电子设备使用史充满了未使用的设备、未探索的复杂功能，以及屏幕上闪烁着“00:00”而非正确时间的录录像机。我从未成功地通过定时录制过电视节目，也没有远程拨打过留言机器，或者将电视连接到立体声箱。\n\
  \n这台 MP3 播放器在我的桌子上坐了一年，我才决定尝试一下。\n\n## 电脑！它们能正常工作吗？\n\n第一步是获取一个 MP3 文件并尝试在电脑上播放。然后，使用我的台式\
  \ Linux 电脑挑选音乐、存储收藏，最后使用 MP3 播放器来听。\n\n当我尝试在我的 Linux 电脑上播放 MP3 文件时，我震惊地发现它并不能工作。虽然有一个\
  \ MP3 播放器，但当我尝试播放 MP3 文件时，收到了一条错误消息，告诉我缺少解码器。\n\n事实上，我所做的一切无法让它工作。我可以正常播放 CD，但就是不能播放\
  \ MP3。尝试让一切运行起来时，我放进了一张莫扎特歌剧咏调。虽然音乐很好，但我的系统管理却一团糟，我很快就毫无进展。\n\n（这就是为什么我从根本就不去碰那些电子设备！）\n\
  \n幸运的是，我有一个好朋友，他对系统管理的了解比我这辈子知道的还要多。他过来坐在我的系统前坐了一会儿，嘴里哼着专注时的口哨。在这种情况下，我做了我擅长的事——去了一杯咖啡。\n\
  \n当我回来时，一种动感的欧洲舞曲节奏正从我的扬声器中传出来。（伴随着莫扎特，这就是我想听的。）\n\n显然，我的系统管理员朋友已经让 MP3 播放了。当我问他怎么做时，他开始列出他必须安装的驱动程序和包。\n\
  \n天哪！这正是新 Linux 用户讨厌的。在另一个操作系统上——那个由亿万翁拥有的系统——这类事情都能直接运行。当我尝试在 Windows 电脑上播放 MP3\
  \ 文件时，音乐直接就开始播放了，没有任何废话。\n\n## 终极恐怖——律师\n\n错不在于我们的星辰，而在于我们的律师。MP3 存在一些许可问题，导致 Fedora（我的\
  \ Linux 发行版）在其发布中删除了对 MP3 的支持。\n\n这一切归结为软件专利。\n\n软件专利是史上最糟糕的主意。\n\n它们是对那些对软件无所知的人的欺骗。专利律师对软件一无所知，所以你可以取任何显而易见的软件想法，用新的方式表述并申请专利，即使它是一个广为人知的算法，或者是现有原理在工程新领域的明显应用。\n\
  \n那些可怜的专利审查员知道什么？他们把这留给法院去解决。\n\n律师是否能理解软件还有待讨论，但大家都同意，让他们尝试辩护是非常、非常昂贵的。没有人想因为违反某项软件专利而上法庭，因为谁愿意花更多时间向一群每小时收费\
  \ 300 美元的西装革履的人解释法律呢？\n\n这让专利拥有了一些力量，即使它们是荒谬的。\n\n我不知道 MP3 专利是否荒谬。由于对于计算机而言音乐只是一个数据文件，因此压缩技术并不是特别重要。MP3\
  \ 是一项卓越的技术，但还有其他技术，有些可能一样好甚至更好。\n\n这归结为营销。大家都知道 MP3。每个人的播放器和手机都能处理 MP3。所以，每个人都要\
  \ MP3，而 MP3 专利持有者可以通过出售他们软件想法的使用权来赚钱。\n\n这一切吓跑了 Fedora，使其不在发行版中包含 MP3 支持，谁又能怪这家公司呢？软件工程师对律师的恐惧超过了律师对软件工程的恐惧。毕竟，工程必须符合逻辑，而在法律中，这一点完全没有要求。\n\
  \n## 自由软件的原则立场\n\n你必须佩服 Fedora 以及其他尊重 MP3 专利的自由软件发行者所采取的原则立场。他们的立场是，只发布你作为用户拥有完全自由的代码。（自由是指“言论自由”的自由，而不是“免费啤酒”的免费。）\n\
  \n然而，当一个流行的商业格式不被支持时，这会给用户带来一些不便。我认为，随着时间的推移，自由软件将基于一些现有的自由格式进化出更好的格式。最明显的候选者是 Ogg\
  \ Vorbis 格式。市场是否以及何时会采用它则并不那么明显。\n\n## 在 Linux 上哪里获取 MP3\n\n如果你不渴望学习关于在 Linux 上安装包的所有知识，并且没有可以提供帮助的朋友，也许你可以尝试遵循非官方的\
  \ Fedora 常见问题列表（`www.fedorafaq.org/#mp3`）。\n\n现在我终于可以在电脑上播放 MP3 了，下一步是把它们传到我真实的\
  \ MP3 播放器上！\n\n也许明年吧。\n\n# 柯克船长走在我们中间\n\n我的一个同事声称，每个人属于三种人格类型之一：柯克船长、史波克先生或麦科伊医生。\n\
  \n麦科伊医生热于帮助每个人，史波克先生受到理解一切的驱动，而柯克船长受到追求个人荣誉的强烈驱动。根据我同事的理论，我们中只有柯克们对电脑游戏感兴趣。那些喜欢电脑游戏并愿意花这种时间在它们上面的人显然有一些奇怪的人格问题。我说发射鱼雷，让我们向中立区进！因为，虽然名字和面孔可能会改变，但我们都知道大多数电脑游戏的基础是破坏，而新的外星人只是我们还没有遇到的目标。Linux\
  \ 世界的情况也无不同。\n\n## 无重力 (No Gravity)\n\n《No Gravity》是一款免费游戏，让你内心的柯克感到快乐。这是一款经典模式的太空射击游戏，允许你驾驶你的小战斗机从一个系统飞到另一个系统，途中击落其他飞船。它既上瘾又易用，比我尝试过的任何其他游戏都能夺走一个周六早晨。\n\
  \n在学习这个游戏时，在你弄清楚如何在雷达屏幕上区分敌我之前，你会摧毁几十架敌方战斗机——以及几架友自己的。\n\n画面非常出色，鼠标操作体验极佳。很快，你就会使用鼠标操控一艘具有可加速度的船，穿过由友方船只、敌方战斗机、地雷、导航信标和小行星组成的移动系统。最棒的是，如果有东西挡了你的路，只需点击鼠标即可解脱，向你的太空战斗机对准的目标发射一系列看起来有趣的脉冲。几次精准的射击会让敌方战斗机起火、冒烟，并最终以最令人满意的方式爆炸。\n\
  \n游戏本身由一系列任务组成，按顺序完成即可进入下一关。最终，我会到达其中一个场景的终点，看看获胜时会发生什么。目前，我对爆炸、火焰和失控旋转要熟悉得多，这些都与被毁有关。\n\
  \n前往 `No Gravity` 网站下载游戏（适用于 Linux、Mac 或 Windows）和游戏数据文件。（你需要同时拥有游戏和数据文件。）\n\nFreeciv\n\
  \n\n\n\n\n作为一款回合制策略游戏，Freeciv 并不试图与那些释放肾上腺素的射击游戏竞争。它的挑战更像国际象棋，但拥有数百种不同的棋子，以及一个如地球一样大的棋盘。\n\
  \nFreeciv 让你的创造力得到充分发挥，因为你需要仔细地设计自己的文明，收集资源、建立城市并开发基础设施。最后，当你内部的文明变得完美时，就是时候去摧毁游戏中的其他人了！\n\
  \n在 Freeciv 中，你从一个未发现的森林、山脉、海洋、河流和其他地形特征世界的定居者开始。定居者可以建立城市，城市可以成长并产生更多的定居者，以及各种类型的军事单位，从长矛方阵到喷气式战斗机。\n\
  \nFreeciv 基于《文明》系列游戏，最著名的是 `Civ 2`。但 Freeciv 远超 `Civ 2`，拥有更详细的图形和更好的用户界面。\n\n我在\
  \ Freeciv 中最喜欢的单位是核导弹，它能用一个有趣的蘑菇云摧毁敌人城市。但通常这些导弹会被 SDI（战略防御计划）拦截——除非你先派了一名间谍去进行破坏。\n\
  \n罗马不是一天之建成的，你的帝国也是如此。我玩过持续好周的 Freeciv 游戏，累计时间超过了 24 小时。我的许多文明都在熊火中覆灭了，因为敌方单位沿着我的铁路线快速移动——一旦他们攻入你帝国的核心，就没有什么能挡住他们！\n\
  \n关于 Freeciv 的一切信息，请访问网站 `http://www.freeciv.org/`。Windows 用户还可以在网络上聚在一起互相对战。\n\n\
  ## 麦考伊与斯波克\n\n### 计算先驱的角色\n事实证明，如果没有试图帮助和理解的麦考伊（McCoys）和斯波克（Spocks），计算世界就不会有今天的样子。\n\
  \n柯克（Kirks）也有他们的贡献，值得注意的是，游戏一直是硬件和软件开发的驱动力之一。\n\n所以，准备好鱼雷并激活曲速驱动——是时候去炸一些外星人了。\n\
  \n# 办公工具\n\n## 摆脱文字限制\n\n在过去，知道如何拼写是一件重要的事情。\n\n我清楚地记得老师们曾告诉我，我将因为对拼写缺乏兴趣而遭受苦难。“詹姆斯，等你长大后，你需要写信，你糟糕的拼写能力将成为一个真正的障碍。”\n\
  \n我忽略了所有这些建议。事实证明我是对的，而他们是错的。如果我告诉他们，我不仅可以在没有良好拼写的情况下成功，而且实际上可以通过写作赚钱，他们将是不会相信我的。是文字处理程序的发明让所有这些警告进入了生活的垃圾桶，让我得以生存并繁荣，尽管我的拼写仍然烂得一塌糊涂。结果，我一直对那些只能用一种方式拼写单词的人感到遗憾。\n\
  \n### 早期文字处理\n在计算机的早期，并没有文字处理——只有文本编辑。区别在于，文字处理允许你做的不仅仅是操作一个顺序排列的字母文件。它还允许你进行一些花哨的操作，如标题、项目符号、上标和其他增强功能，这些功能将一串普通的字母转换为格式化文档。\n\
  \n在早的 80 年代初，实现真正文字处理的方法是使用非常昂贵的排字机。这些机器大约有一个大桌子大，配备键盘、原始的显示器和一个大型打印机。为了得到你的文档，你需要手写（或者如果你写得很多，就用打字机），然后交给排字专家，由他们将其重新输入排字机中，并带上控制格式、标题等所需的特殊代码。排字员随后会打印出一份供你检查——这被称为校样（galley\
  \ proofs）。你会阅读并修正这些内容，将其寄回排字员，排字员会输入你的更改并为你运行另一组校样。最终，你会对结果表示满意（或只是太厌了不想继续了），然后会为你打印一份文档的最终副本。\n\
  \n这这一切听起来非常痛苦吗？因为事实确实如此。这种原始文字处理的问题之一包括：机器及其操作员非常昂贵，而且通常很忙，所以周转缓慢。即使在所有文本都写完后，准备一份文档可能需要一周时间。此外，只有当你足够幸运在一个能负担得起这种机器的地方工作时，整个过程才可能实现。\n\
  \n### 早期文字处理器\n早期的文字处理器在今天会被称为文本编辑器，因为它们甚至没有尝试向你展示你得到的内容。可能会把某些文本加粗，它从打印机出来时是那样，但在屏幕上它看起来和所有其他文本一样。“所见即所得”或\
  \ `WYSIWYG`（读作 wis-eee-wig）直到 20 世纪 80 年代更好的图形显示器和操作系统出现出现。\n\n`WYSIWYG` 是一个棒的想法，也是我们现在认可的文字处理器的关键特性。第一个\
  \ `WYSIWYG` 编辑器是（仍然）著名的 `Microsoft Word`，它当时是文字处理市场的新手，试图取代要受欢迎得多的 `WordStar` 程序。\n\
  \n### 它们成长得真快\n`WYSIWYG` 文字处理器很快流行起来，新功能的出现速度就像盖茨的支票账户里的钱一样快。拼写和语法检查、与电子表格、数据库、绘图软件的集成、更多的字体和文本对齐选项都成为文字处理程序的标准组成部分。\n\
  \n最终，和大多数计算机程序一样，文字处理器发展出了使用简单的内部编程形式处理重复性任务的方法，首先通过宏，然后通过专门的脚本语言。随着文字处理器概念的发展，满足这些需求的各种软件程序也随之发展。正如不可避免发生的那样，文字处理器已变成了一种商品。市上有许多选择，价格各异，但它们做的事情大同小异。在企业界，`Microsoft\
  \ Word` 统治了一切。\n\n### 摆脱微软\nWord 对比尔·盖茨来说一直是一个真正的赚钱工具，现在也是。事实上，它在 1999 年昂贵到以至于对于工作站开发者和制造商\
  \ `Sun Microsystems` 来说，买下一整个公司比为每个员工买一份 `Microsoft Word` 要便宜得多。这家公司是一家德国软件公司，开发了\
  \ `Microsoft Word` 的仿品，那是他们名为 `StarOffice` 的软件套件的一部分。Sun 立即将源代码发布到开源社区，`OpenOffice`\
  \ (`www.openoffice.org`) 诞生了。Sun 仍为企业用户提供商业版本，包含一些额外的工具和功能，但免费的 Open Office 套件已经包含了我需要的一切。\n\
  \n### 与同同行\n如今，`OpenOffice` 的文字处理器 `Writer` 几乎与 `Microsoft Word` 无异（除了它是免费的）。它提供了全套\
  \ `WYSIWYG` 功能，我正用它写这篇文章。它甚至可以读取和写入微软格式的文档，以便你可以切换使用 `OpenOffice Writer` 和 `Microsoft\
  \ Word`。`Writer` 的最新版本甚至支持 `Visual Basic for Applications` 脚本语言。这意味着即使带有大量脚本的复杂\
  \ Word 文档也可以由 `OpenOffice` 处理。\n\n它无处不在你需要的地方\n\n\n\n\n\nOpenOffice 文字处理器的另一个伟大特性是它的无处不在。它几乎可以在每种计算平台上运行（而且一直是免费的）：Linux、Macintosh\
  \ 甚至 Windows。它在所有平台上的运行方式都是相同的，因此你甚至察觉不到自己在使用哪种机器。\n\n## 一些酷东西\n\n我之所以如此喜欢写关于 Linux\
  \ 的东西之一是，它让我学习到许多关于我每天接触软件的有趣知识。和大多数文字处理用户一样，我只使用了软件自带的那些花哨功能中的一小部分。自然地，OpenOffice\
  \ Writer 提供了自动拼写检查和同义词典（如果你好奇的话，又名同义词查找器、词汇表）。它有一个自以为是的（但往往准确得令人恼火）的自动更正功能。它还内置了媒体播放器，你可以将媒体嵌入文档中。它能以数百万种方式处理表格、框架、大纲和项目符号。它还可以跟踪参考文献和邮件列表。而这一切都不需要从网上下载的那些免费扩展包就能实现！\n\
  \n## 戒掉坏习惯\n\n当我向 Windows 用户展示 Linux 上可用的软件时，他们经常会惊讶地问：“如果这些免费软件都一样好，那为什么还要给微软付钱？”我通常指出，免费软件在质量和实用性上往往比专有软件好得多，而且很多人根本没给微软付过一分钱。但我还是会换来怀疑的目光。我觉得他们认为我正在对他们花招。毕竟，如果不需要付钱，那些微软用户真的会花那么多钱吗？\n\
  \n人会养成坏习惯，而想要改变是很困难的。也许我应该为那些试图放弃微软的人推销某种皮肤贴。如果你在电脑上准备任何文档，那么就去看看 OpenOffice Writer\
  \ 并开始戒掉这个习惯吧。\n\n## 进入正题\n\n整个个人电脑市场是建立在电子表格之上的。\n\n当第一代 IBM PC 发布时，大问题是：为什么会有人想要一台个人电脑呢？\n\
  \n这现在听起来像个疯狂的问题，但除了硬核极客市场，还有什么理由要为一个人制造一台微型电脑呢？唯一能用电脑做任何有用事情的人是那些那些在“大铁块”（大型机）上工作的电脑极客们。他们鄙视新兴的个人电脑世界。早期的个人电脑市场是给爱好者的，而不是给专业用户的。\n\
  \n然后，一个名为 VisiCalc 的程序发布了，电子表格诞生了。企业突然发现了小型电脑的力量，剩下的部分就是历史了。\n\n## 意大利艺复兴时期的伟大发明之一\n\
  \n在上一个千年，像伽利略和托马斯·杰斐逊这样的人在到处闲逛，导致重要日期的发生，以便未来的学生有东西可以记忆。企业当时通过手工进行一种被称为“复式记账法”的方法来跟踪资金。\n\
  \n它的运作方式是这样的：你保留一本名为“日记簿”的大书，里面有很多带有特殊横线的纸。有水平线，每一行代表一笔支出。还有许多垂直列，大约 10 或 12 列。有一列用于租金，一列用于用品，一列用于工资，其他的用于业务的任何其他开支（包括万能的“杂项”列）。\n\
  \n每当花费任何钱时，金额就会记录两次：一次在支出的注释旁边，一次记录在该支出的相应列中——这就是“复式记录”一词的由来。\n\n当日记簿页满时，每一列都要计算总和，所有类别支出的总和必须与该页的总支出相匹配。如果这两个数字不相等，说明你犯了算术错误，你必须不断重新计算，直到找到错误为止。\n\
  \n这种开发于文艺复兴时期意大利的复式记账系统，是现代业务能够发展和繁荣的基础。它是如此成功，以至于西方世界的每家企业都一直使用它，直到电子表格的发明。\n\n\
  事实上，在我发现通过计算机编程挣钱竟然要容易得多之前，我曾在费城的一家面包店担任记账员。每周我都会去那里支付账单，为面粉、水果和糖的供应商写账单并开具支票。我会支付租金、保险和工资。\n\
  \n每个数字都妥善地记录在日记簿的两个地方。每一页填满的页面都会交叉汇总，在所有数字加总正确且老板确切知道花了多少钱之前，数字会被反复反复地检查（有时是，一遍又一遍）。但那是多么痛苦啊！\n\
  \n尽管我记账的薪水相当不错，但每当交叉汇总不匹配时，我总是叹气。这意味着至少要花半小时重复该页上的所有计算，直到找到错误为止。它是枯燥的，是苦差事，而且远没有和哥们和女朋友待在一起有趣——甚至不如做我通常的工程作业有趣。那是纯粹的苦力活。你越讨厌数学，情况就越糟糕。有些企业主非常讨厌数学，以至于他们雇了喜欢数学的人来做记账。其他企业主只能忍受。即使是那些喜欢数学的人（像我一样）也觉得记账无聊。\n\
  \n## 计算机来救援\n\n有很多计算机不擅长的事情。它们不会聊天、做一顿好饭，也不会欣赏伟大的艺术品。但计算机擅长加法。而且它们擅长枯燥的工作。它们从不会感到无聊，也不会出错。这一切让它们成为了优秀的记账员。但对于非专业人士来说，让计算机完成你想要的事情并不总是很容易。\n\
  \n随着电子表格的发明，一种不需要特殊工程才能的工具出现了。任何企业主都能立即理解它，因为它与复式记账法非常相似。电子表格让这种业务变得过时。有了电子表格，你甚至不需要复式记录。只需输入一次，信任计算机进行正确计算即可。（但不用担心记账员丢掉工作。你不需要比计算机更聪明才能生存，只需要比拥有计算机的人聪明即可。而且每个不需要付记账员工资的企业主仍然需要付钱操作计算机。但他们付的钱更少，速度更快，所以大家都更开心。）\n\
  \n## Linux 被遗漏了吗？\n\n在早期有 VisiCalc，但后来一个名为 Lotus 123 的程序创造了巨大的电子表格市场，这个市场一直发展至今。在早期，Linux\
  \ 缺乏电子表格，这是 Windows 用户可以声称优越的少数领域之一。但正如它往常一样，免费软件通过多个电子表格项目追上了进度。\n\n## Gnumeric\
  \ 与 Open Office\n\n如今有两个非常好的 Linux 电子表格程序：Open Office Calc (`www.openoffice.org`)\
  \ 和 Gnumeric (`www.gnome.org/projects/gnumeric`)。\n\nOpen Office 是 Microsoft Office\
  \ 的完全模仿。它包含一个文字处理器、一个演示管理器、一个数据库前端和一个电子表格。\n\n电子表格是 Excel 的克隆，只有最高级的用户才能发现出它们之间的区别。尽管\
  \ Open Office 应用程序有自己的文件格式，但它们也可以使用微软格式，使其成为微软应用程序的直接替代品。使用 Open Office 的人可以创建和编辑微软格式，使用微软的朋友和同事永远不需要知道你没有给比尔·盖茨付钱来帮你做电子表格。\n\
  \n\n\n\n\n# Open Office Calc 电子表格\n\nGnumeric 是一个较老且更独立的应用程序。它不属于任何办公套件，但尽管如此，它可以完全取代用户桌面上的\
  \ Excel。\n\n## 应该使用哪一个？\n\n对于新 Linux 用户来说，面临的主题仍然是选择。与其他的私有操作系统不同，Linux 提供了多个电子表格应用程序。那么，新用户应该选择哪一个呢？\n\
  \n我作为一个比较随意的电子表格用户，我只能说，我从未发现这两个程序中任何一个是做不到像 MS Excel 那么好的。两者都是完全合格的替代品——它们都可以打开、编辑和创建\
  \ MS Excel 格式的电子表格。它们都能处理图表、统计图、统计分析以及复杂的扩展和自定义。它们与 Excel 电子表格都具有极佳的兼容性。\n\n使用你在\
  \ Linux 机器上发现的任何一个即可。无论你选择哪一个，运行得都会很好！\n\n# 冒险仍在继续\n\n在 2010 年左右，ComputorEdge 停止了纸质版出版，转变为纯在线杂志（尽管仍有地方版，包括科罗拉多州）。由于财务限制，Jack\
  \ 无法继续支付这些文章的费用，因此我停止了写作。在我写这些文章的几年里，我学到了很多，作为一名程序员也许作为一名作家都成长了很多，并且乐在其中。我怀念写这些文章！\n\
  \n但计算机行业仍在增长和变化。新技术正以令人兴奋且不断增加的频率出现在这个已经拥挤的领域中。随着每一天的过去，计算机软件正日益改变着我们的生活。总有更多东西要学，有更多事情要做。\n\
  \n"
