    # # XSS using XSS validator\n\nA web vulnerability called Cross Scripting (XSS)\
    \ can allow attackers to inject and execute malicious code within a victim's browser.\
    \ The vulnerability arises when user input is not properly sanitized, which enables\
    \ attackers to inject code that will be executed by other users who view the affected\
    \ page.\n\nThese attacks can be broadly classified into three categories:\n\n\
    +   - **Stored XSS**: In this type of attack, the attacker injects malicious code\
    \ into the web application's server or database, which is then displayed to all\
    \ users accessing that particular page. This type of attack can result in the\
    \ compromise of sensitive data, such as login credentials, personal information,\
    \ or financial data.\n- **Reflected XSS**: This type of attack involves injecting\
    \ malicious code into a URL which is then reflected back to the user's browser.\
    \ The attacker typically tricks the victim into clicking on a link containing\
    \ the malicious code, which then executes on the victim's browser. Reflected XSS\
    \ attacks can be difficult to detect and are commonly used in phishing schemes.\n\
    - **DOM-based XSS**: In this type of attack, the attacker injects malicious code\
    \ into the Document Object Model (DOM) of a web page. This code is executed entirely\
    \ on the client-side, and the attacker can manipulate the user's interactions\
    \ with the web page to execute the code. DOM-based XSS attacks are often used\
    \ to steal sensitive data or to hijack user sessions."
