    # # Phase 2: Bypassing Windows Defender with hoaxshell and AMSI trigger


    HoaxShell and AMSI bypass techniques are commonly employed by malicious individuals
    as part of their offensive security tactics. HoaxShell serves as a robust framework
    specifically designed to circumvent multiple security controls, notably including
    the Antimalware Scan Interface (AMSI) trigger. By utilizing HoaxShell, attackers
    aim to evade detection by antivirus software and other protective measures. On
    the other hand, AMSI, developed by Microsoft, acts as an interface for antivirus
    and other security controls to scan and identify malicious code present within
    active processes. It is an essential component that enables the detection of potentially
    harmful activities.


