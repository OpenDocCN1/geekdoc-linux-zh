- img_proc: true
  md: 'Different cybersecurity assessment reports are conducted with specific objectives
    and focus areas. Common types of VAPT assessment reports include the following:


    # Executive summary report


    The executive summary report is a brief, non-technical document for top-level
    stakeholders, like C-level executives and management. It outlines key findings,
    critical vulnerabilities, and security risks from the VAPT assessment. It also
    outlines the assessment scope and risk posture to help decision-makers make informed
    cybersecurity improvements and risk mitigation strategies. To gain a better understanding
    of this report, please refer to the Executive Summary section under the Components
    of a well-crafted report section in the earlier part of this chapter.


    # Detailed technical assessment report


    The detailed technical assessment report is a comprehensive document designed
    for technical personnel like IT teams, DevOps, Developers, and system administrators.
    This report provides detailed descriptions of each vulnerability, its severity,
    impact, and recommended steps. The primary purpose is to help technical experts
    understand vulnerabilities and implement effective security measures for the organization’s
    IT infrastructure. This report will follow the guidelines explained in the Components
    of a Well-Crafted Report section in the earlier part of this chapter.


    # Vulnerability management tracker


    The Vulnerability Management (VM) tracker is a handy tool to monitor and manage
    security vulnerabilities found during assignments like VAPT. It acts as a centralized
    database, recording and prioritizing vulnerabilities based on severity. The VM
    tracker facilitates real-time sharing of critical findings with clients, enabling
    prompt resolution. Security teams can assign ownership, deadlines, and track progress
    for effective vulnerability management. Figure 10.15 displays a sample of the
    vulnerability management:


    | Client Name: LLC Limited | Open | 2 | Critical 0 Medium 0 High 0 Low 0 Remarks
    |

    |---|---|---|---|---|---|

    | 1 SQL Injection | Open | CWE | Not Done | |

    | 2 Sensitive Information Exposure | Critical | CWE | Not Done | |

    | 3 Malware File Upload | High | CWE | Not Done | |

    | 4 Weak SSL/TLS | Open | CWE | Not Done | |

    | 5 Vulnerable Query Dictionary | Open | CWE | Not Done | |

    | 6 Brute Force at Login Page | Open | CWE | Not Done | |

    | 7 Cross-Site Scripting | Low | CWE | Not Done | |

    | 8 Improper Error Handling | Open | CWE | Not Done | |'
