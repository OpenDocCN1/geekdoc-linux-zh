  md: '# # CHAPTER 3

    Active and Passive Reconnaissance Tactics


    # ## Introduction


    In this chapter, we will dive into the nitty-gritty of reconnaissance tactics,
    which play a significant role in successful penetration testing. Getting enough
    information about the target through reconnaissance is key to determining what
    you need for the test. Different parts of a computer system might need different
