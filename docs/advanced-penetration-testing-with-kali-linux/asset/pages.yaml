  md: '# Common Vulnerability Score System


    CVSS (Common Vulnerability Scoring System) is a standardized method used to assess
    the severity of security vulnerabilities in software. It helps security professionals
    and organizations understand the potential impact and prioritize their response.


    Types of CVSS Scores:


    +   1. **Base Score:** Represents the intrinsic qualities of vulnerability, independent
    of the environment. Assesses severity based on factors like access complexity,
    exploitability, and impact.

    2. **Temporal Score:** Considers factors that may change over time, such as exploit
    availability and existence of fixes.

    3. **Environmental Score:** Evaluates vulnerability impact in a specific environment,
    including system importance and mitigating controls.


