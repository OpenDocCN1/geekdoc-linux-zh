    # # Passive reconnaissance


    Passive reconnaissance means collecting info about a target without directly engaging
    it. This way is harder to spot and quicker than active methods, but the data might
    not be super up-to-date or dependable. For instance, grabbing a list of email
    addresses from a target group without reaching out to them directly is passive
    reconnaissance.


    # # Active reconnaissance


    Active reconnaissance means you are getting info about a target by directly getting
    involved with it. This way is riskier and takes more time than passive ways, as
    you are directly engaging with the target, which could be noticed. This is like
    a bigger version of passive reconnaissance and usually gives more precise and
    current info about the target. For instance, if you want a list of services and
    their versions on a server, you need to ask the server directly. This is an example
    of active reconnaissance.


    > Note: Reconnaissance information can be transformed into actionable intelligence
    to create a well-exploitation plan. This plan includes utilizing chosen methods
    to attack the system, which will enhance the chances of success and minimize the
    duration of the operation.


    # # Passive reconnaissance tools and tactics


    There are numerous tactics for conducting passive reconnaissance. Let us discuss
    some of them in practice:


    # # WHOIS'
