    # Utilizing CVSS scores


    Common Vulnerability Scoring System (CVSS) is a widely adopted industry standard
    for assessing vulnerability severity. It assigns numerical scores from 0 to 10,
    where higher scores indicate more critical vulnerabilities. These scores aid security
    professionals in prioritizing findings and assist organizations or clients in
    devising patching strategies.


