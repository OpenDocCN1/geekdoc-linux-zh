    | Phishing | Attackers employ deceptive tactics, impersonating legitimate sources,
    to trick recipients into revealing confidential information or clicking on malicious
    links. |

    | Pretexting | Attackers fabricate false scenarios or reasons to manipulate individuals
    into divulging sensitive information or performing unusual actions. |

    | Baiting | Attackers strategically place physical devices or infected media,
    such as USB drives, in public areas, enticing unsuspecting to execute malicious
    code unknowingly. |

    | Tailgating | Attackers exploit the trust of employees by following them or posing
    as authorized personnel, granting unauthorized access to restricted areas or systems.
    |

    | Impersonation | Attackers masquerade as trustworthy entities, such as colleagues,
    IT support, or vendors, to deceive individuals into sharing sensitive information
    or granting unauthorized access. |

    | Reverse Social Engineering | Attackers build trust with individuals before manipulating
    them into performing harmful actions or revealing confidential information. |


    Table 4.4: Social engineering tactics


    To enhance protection against social engineering attacks, organizations should
    take the following measures:


    +   - Continuous education: Regularly educate employees about various social engineering
    techniques and consistently raise awareness of potential threats.

    - Implement Zero Trust policy: Embrace a Zero Trust approach and enforce strict
    access controls, incorporating robust authentication mechanisms and the principle
    of least privilege.

    - Vigilant patch management: Implement an effective patch management cycle to
    promptly address and patch known vulnerabilities, thereby thwarting attackers
    from exploiting them.

    - Email filtering and spam detection: Deploy reliable email filtering and spam
    detection mechanisms to identify and block phishing attempts, reducing the chances
    of employees falling victim to deceptive tactics.

    - Regular security assessments: Conduct periodic security assessments, including
    simulated social engineering attacks, to identify emerging trends and vulnerabilities.
    This allows organizations to train employees on best practices and stay ahead
    of evolving threats.

    - Multi-layered security approach: Employ a comprehensive security strategy that
    combines advanced technology solutions, ongoing employee education, and proactive
    measures. This multi-layered approach is crucial for effectively defending against
    social engineering attacks.'
