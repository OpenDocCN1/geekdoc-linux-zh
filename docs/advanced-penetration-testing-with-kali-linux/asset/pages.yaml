    # Port scanning


    Once we have identified live hosts on the network, the next step is to determine
    which ports on those hosts are open and accepting incoming connections. This is
    done through the process of port scanning, which involves sending packets to a
    host on various ports to determine which ports are open, closed, or filtered.


    Nmap recognizes six states for ports:


    +   - **Open**: The host is actively accepting incoming connections, data packets,
    or associations on this port using the TCP, UDP, or SCTP protocol.

    - **Closed**: The targeted host is active and online, but it is not accepting
    incoming connections, data packets, or associations on that specific port.

    - **Filtered**: Nmap is unable to determine whether the port is open or not because
    the probes sent to reach the port are blocked by packet filtering which could
    be from a dedicated firewall device, static routing rules, or host-based software.

    - **Unfiltered**: In this state, the port is reachable, but Nmap cannot determine
    if it is open or closed.

    - **OpenFiltered**: Nmap is unable to determine the status of a port, whether
    it is open or filtered, and categorizes it as “openfiltered”.

    - **ClosedFiltered**: Nmap is unable to determine the status of a port, whether
    it is closed or filtered, and categorizes it as “closefiltered”.


    # Port scanning techniques


    Port scanning techniques are used to identify the open ports on a host that are
    ready to accept incoming connections. Nmap offers a variety of techniques for
    identifying open ports on a host. For a demonstration of using nmap for port scanning,
    refer to Figure 3.20.


    Run the following command: `nmap -v -p 22 192.168.159.129`'
