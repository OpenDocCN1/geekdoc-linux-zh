    # Outsmarting Windows Defender


    Windows systems come equipped with an inherent security control known as Windows
    Defender. In this section, our aim is to bypass the detection capabilities of
    Windows Defender and establish a reverse connection. To illustrate this, let us
    consider a scenario where, as attackers, have gained low-privileged access to
    a Windows 10 workstation within the victim organization. The system in question
    has Windows Defender actively running with all its protective measures enabled.
    Our objective is to execute multiple malicious scripts for enumeration and lateral
    movements, which could potentially be blocked by the defender.


