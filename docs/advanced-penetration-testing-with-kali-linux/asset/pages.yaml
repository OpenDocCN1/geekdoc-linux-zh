    # Cutting-edge WAF evasion tactics


    A WAF serves as a security solution explicitly designed to safeguard web applications
    against a variety of attacks. By implementing a set of rules, a WAF actively identifies
    and obstructs malicious requests or suspicious activities.


    WAF evasion techniques pertain to the methods employed by penetration testers
    to effectively evade or circumvent the protective measures established by a WAF.
    These testers strive to bypass a WAF to identify potential vulnerabilities and
    weaknesses in the web applications shielded by the firewall, which could potentially
    be exploited by malicious individuals. By comprehending the mechanisms of WAF
    evasion, penetration testers can evaluate the efficacy of the WAF and assist organizations
    in fortifying their security defenses for web-based applications.


    Bypassing a WAF involves various techniques to evade or circumvent its protections.
    Here are some common techniques that attackers and penetration testers may employ
    to bypass a WAF as shown in Table 9.3:'
  merge: -1
  pgno: 329
- img_proc: true
  md: '| Technique | Description |

    | --- | --- |

    | Payload Obfuscation | Modifying or encoding the attack payload to evade signature-based
    detection. Techniques include URL encoding, character encoding, etc. |

    | Parameter Fragmentation | Dividing attacks across multiple request parameters
    or sections to bypass specific WAF rules based on complete patterns. |

    | Protocol-Level Evasion | Exploiting inconsistencies or ambiguities in the HTTP
    protocol specifications to manipulate request headers. |

    | Manipulating HTTP Methods | Leveraging less used HTTP methods (for example,
    PROFIND or OPTIONS) to evade specific WAF protections. |

    | IP and User-Agent Spoofing | Modifying the source IP or User-Agent header to
    masquerade as a trusted entity or emulate a legitimate user. |

    | Request Smuggling | Exploiting variations in how servers interpret HTTP request
    delimiters or handling multiple requests within a single HTTP connection. |

    | WAF Misconfigurations | Identifying and exploiting misconfigurations in WAF
    rules, whitelists, or blacklists to bypass specific protections. |

    | HTTP Parameter Pollution | Manipulating and duplicating parameters in the request
    to confuse the WAF and potentially bypass its filtering mechanisms. |

    | Slow HTTP Attacks | Exploiting server resource handling by sending requests
    with slow data transmission, causing timeouts or resource exhaustion. |

    | Encrypted Traffic | Utilizing encryption methods (for example, SSL/TLS) to conceal
    the malicious payload from WAF inspection. |


    Table 9.3: WAF bypass techniques


    Let us explore some of these techniques and their corresponding payload examples:


    +   - **Case manipulation**: Some poorly developed WAFs selectively filter payloads
    based on case sensitivity. By combining upper and lower case characters, we can
    bypass these filters.


    **Example:**


    +   - Standard payload: `<script>alert()</script>`

    - Bypassed payload: `<Script>alert()</Script>`

    - Similarly, the SQL query `SELECT * FROM users WHERE username = ''ummer''` can
    be bypassed by `SeLeCt * FROm users WhErE username = ''ummed''.`


    +   - **HTML encoding**: Web applications often encode special characters into
    their HTML representations. By using HTML encoding, we can bypass certain WAF
    filters.'
