    Passive Reconnaissance

    Obtaining information about a target direct engagement or interaction


    Active Reconnaissance

    Gaining knowledge about a target through direct engagement and interaction


    Strategy Building

    well-designed strategy can enhance the chances of success for a VAPT exercise


    Exploitation

    With a well-informed strategy in place, exploitation phase can be executed more
