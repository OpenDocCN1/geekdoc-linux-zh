    $ sudo apt-get install proxychains

    [sudo] password for ummedmeel: |

    ```


    Figure 2.17: Run command to install ProxyCh


    2. Open the Proxchains configuration file using a text editor. The configuration
    file is located at /etc/proxchains.conf. Run the command Sudo nano /etc/proxchains.conf
    as depicted in Figure 2.18:


    ```

    (ummedmeel@kali)-~/Desktop

    $ sudo nano /etc/proxchains4.conf|

    ```


    Figure 2.18: Run the command to open Proxychain configuration file


    3. Scroll down to the bottom of the file and add the proxy servers you want to
    use, one per line. Each line should have the following format:


    <proxy type> <proxy host> <port>


    4. For example, if you want to use a socks5 proxy at 192.168.159.150 on port 7080,
    will add the following to the configuration file as depicted in Figure 2.19:


    socks5 192.168.159.150 7080


    ```

    # /proxychains4.conf +

    # This is the main proxy agent

    # default 1.1.1.1 1080


    # Me what proxy i want to connect to 1.1.1.1 actually connect to 1.1.1.2 on port
    443

    # dummy 1.1.1.1:1112


    # Always, instead of connecting to 1.1.1.1, connect to 1.1.1.2

    # dummy 1.1.1.1:1112


    # Proxy list (user proxy)

    # (values separated by ''tab'' or '' '')

    # (only numeric ipv4 ipv6 addresses are valid)


    # Examples:

    # socks5 192.168.157.88 1000 lancer secret

    # socks5 192.168.159.150 8080 just videos

    # http 192.168.159.150 7080


    # proxy type: http, socks, socks5

    # (each line is safely forwarded to the proxy without modification.

    # (auth types supported: "http" "user/pass-socks")


    [ProxyList]

    # add proxy here ...n# default set to "to"

    socks5 192.168.157.88 1000

    socks5 192.168.159.150 7080

    ```


