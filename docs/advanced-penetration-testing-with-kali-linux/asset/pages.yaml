  md: '+   Bcrypt and scrypt: In Linux-based operating systems, bcrypt and scrypt
    stand out as popular password hashing algorithms. Bcrypt gains recognition for
    its adaptability and robustness against brute-force attacks, while scrypt earns
    acclaim for its memory-hard functions and bolstering defenses against hardware-based
    attacks.


    # Cutting-edge techniques - Salting and key stretching


    Adding an extra layer of complexity to the password hashing process, salting involves
    appending a randomly generated value to the password before hashing. This technique
    substantially enhances the difficulty of cracking passwords using precomputed
    hash tables or rainbow tables, as it becomes challenging to isolate the original
    password from the combined salt. Consequently, if two users have the same password,
    their hash values will differ. To illustrate, refer to Figure 8.1, and consider
    the following scenario:


    Password: `ummedeel1123`


    Salt: `exampleSALT`


    Salted password: `ummedeel1123exampleSALT`


    Hashed password: `29A48295B77DE3420A15D96D357FF47`


    ![](img/e4f93a89908ca3f498ee2517ddfbfd77_251_0.png)


    > Key stretching is a vital technique used to strengthen password security. Methods
    like bcrypt and scrypt introduce computational costs, making the hashing process
    slower and more resistant to attacks. Apply key stretching to enhance protection
    against brute-force and dictionary attacks.


    # Unleashing hash cracking techniques'
  merge: -1
