    # DNS reconnaissance


    **Domain Name System (DNS)** reconnaissance is a process of collecting various
    records related to a website that helps in configuring and making it accessible
    on the internet. One of the key aspects of this technique is DNS resolution, which
    allows for identifying the IP address linked to the website.


    Furthermore, by utilizing DNS reconnaissance, a penetration tester can gather
    valuable intelligence such as:


    +   • **NS (Name Server) Record**: These indicate the location of the servers
    responsible for managing and storing the DNS records for a particular domain.


    +   • **A (Address) Records**: These records specify the IP address associated
    with a given domain


    +   • **AAAA Record**: These records are quite similar to ‘A’ records, but they
    are used to map a domain name to an IPv6 address


    +   • **MX (Mail Exchange) Record**: These records indicate the details of the
    email servers associated with the domain.


    +   • **CNAME (Canonical) Record**: These records assist in determining the names
    of other domains if multiple services are running on a single server.


    +   • **TXT Records**: These records contain details about other resources associated
    with the domain, such as servers and network information.


    +   • **PTR (Pointer) Records**: These records are the inverse of ‘A’ records,
    and they provide the domain name corresponding to an IP address.'
