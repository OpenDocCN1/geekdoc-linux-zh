    # Route mapping


    Route mapping involves figuring out the way and devices that network traffic takes
    to get where it is going. This helps fix network problems, and helps testers find
    weak points and possible security problems in network.


    There are various methods that can be used to perform route mapping, including:


    +   - Traceroute: The traceroute command traces the route of an IP packet to an
    Internet host by sending UDP probe packets with a small maximum time-live, and
    listening for ICMP TIME_EXCEEDED responses from gateways along the way.'
  merge: -1
  pgno: 98
- img_proc: true
  md: '+   - Ping: A ping is a simple tool used in network administration to check
    if a specific IP address is reachable and can receive requests. It is also known
    as Packet Internet or Inter-Network Groper.


    +   - Pathping: The PathPing command is a command-line tool available in Windows
    2000 and later versions, which combines the features of both ping and traceroute.
    It allows you to ping each node in a single command and also monitor the behavior
    of nodes over a longer period of time, compared to the four four ping or a single
    route of traceroute.


    +   - MTR: My Traceroute (MTR) is a powerful diagnostic tool that combines the
    functionality of traceroute and ping to test connectivity and speed. It can be
    used to poll remote servers and measure latency changes over time, making it an
    invaluable tool for troubleshooting network issues.


