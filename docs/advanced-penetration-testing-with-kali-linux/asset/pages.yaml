    # Active reconnaissance tools and tactics


    There are numerous tactics for conducting active reconnaissance. Let us discuss
    some of them in practice:


    # Host discovery


    Host discovery is the initial step in network reconnaissance and is used to identify
    the potential targets for an attack. It involves identifying live hosts within
    a targeted network. The traditional method of host discovery is using ICMP echo
    to check host status, however, this is frequently blocked by network security
    measures. Despite this, host discovery tools still have options and built-in scripts
    to check host status.


    In this example, we will use Nmap for host discovery. Nmap, short for “Network
    Mapper,” is a free and open-source tool used for network discovery and security
    auditing. While Nmap is typically used in the command-line interface, it is also
    available in a graphical user interface called Zenmap. Let us perform a ping scan
    to identify the hosts on the network, as depicted in Figure 3.19:


    ```

    nmap -v -sP 192.168.159.129

    ```


    Here, the ‘-v’ flag is used for verbose output, providing detailed and organized
    information from the nmap scan. The ‘-sP’ flag is used for a ping scan. Please
    refer to the following figure:'
