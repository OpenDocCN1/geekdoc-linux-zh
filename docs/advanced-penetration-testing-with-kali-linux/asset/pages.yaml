    # What is reconnaissance


    The process of gathering information about a target in preparation for a Vulnerability
    Assessment and Penetration Test (VAPT) is known as reconnaissance. This can be
    done through active and passive methods, including network scanning, social engineering,
    web scraping, footprinting, and fingerprinting. The purpose of reconnaissance
    is to obtain as much information as possible about the target, including its systems,
    servers, networks, applications, and people, in order to identify potential vulnerabilities
    and plan a more sophisticated attack.


    There are many tools, techniques, and websites available for gathering intelligence.
    This chapter will briefly introduce some of these resources and how they can be
    used to collect the necessary information. Commonly recommended reconnaissance
    tactics are illustrated in Figure 3.1 below:'
  merge: -1
  pgno: 85
- img_proc: true
  md: '![](img/e4f93a89908ca3f498ee2517ddfbfd77_86_0.png)


    Figure 3.1: Reconnaissance tactics


    # # Why is reconnaissance so important


    Reconnaissance is crucial to understanding the target before an attack is performed.
    A well-planned strategy based on reconnaissance can significantly assist a pentester
    by reducing false positives, decreasing the number of attacks needed, reducing
    the time required, and improving the quality of the scan. By gathering extensive
    information about the target, you can plan your attack more efficiently and potentially
    shorten the time needed to compromise the target.


    # # Types of reconnaissance


    VAPT exercise typically consists of four phases, including reconnaissance, as
    illustrated in Figure 3.2. Reconnaissance can be performed in the following ways:'
