- img_proc: true
  md: '+   UDP scan: UDP scan is a method of determining if a port is open or not
    on a target host by sending UDP packets to various ports on the host.


    +   Stealth scan (Half open scan): A half-open scan, also known as a SYN scan,
    sends a SYN packet to the target port, if the target port is open, the host will
    respond with a SYN-ACK packet. If the port is closed, the host will respond with
    an RST packet.


    +   FIN scan: The scan sends a FIN packet to the target port and waits for a response.
    If the port is open on the remote host, it will respond with an RST (reset) packet,
    showing that the port is closed. If the port is closed, no response will be received
    from the remote host, indicating that the port is open.


    +   Null scan: This technique involves sending packets without any flags set in
    the TCP header, known as a null packet. If a port is open on the remote host,
    no response will be sent. If the port is closed, the remote host will issue an
    RST (reset) packet as a response.


    +   Xmas scan: This technique involves sending packets with the FIN, PSH, and
    URG flags set in the TCP header, known as a Xmas packet. If the port is open on
    the remote host, it will respond with an RST (reset) packet, indicating the port
    is closed. If the port is closed, the remote host will not respond, indicating
    the port is open.


    > Note: A half-open scan does not fully establish a connection with the remote
    host, unlike a full-open scan, and leaves the connection in an incomplete state.
    Half-open scans are less detectable by firewalls and intrusion systems that do
    not create a connection.


    # Running services and version detection


    Once the ports on a target host have been identified, the next step is to identify
    the service and version that are running on each port. Nmap can do this by sending
    a series of probes to the target host and analyzing the responses. By examining
    the responses’ banner, application version, or other identifying characteristics,
    Nmap can determine the service and version that are running on each port. Service
    and version detection can be useful for identifying specific software that may
    have known vulnerabilities or misconfigurations that a penetration tester could
    exploit.


    To determine the service name and version, the `-sV` flag can be used in the Nmap
    command, as shown in the example illustrated in Figure 3.21.


    Run the following command: nmap -v -p 22 -sV 192.168.159.129'
