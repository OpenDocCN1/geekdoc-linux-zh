  md: 'Nmap is a free and open-source tool widely used for host discovery, port scanning,
    and vulnerability assessment. One of its most powerful and versatile features
    is the Nmap Scripting Engine NSE, which enables users to automate networking tasks
    by writing simple scripts. With the speed and efficiency you expect from Nmap,
    these scripts are executed in parallel. NSE scripts are categorized into various
    categories such as auth, broadcast, rate, default, discovery, dos, exploit, external,
    funnel, intrusive, malware, safe, version, and vuln.


    It is common to perform scripting in conjunction with port scanning, as the scripts
    may only run on the port states discovered during the scan. To help you understand
    the Nmap scanning process, let us examine some of the Nmap commands with flags:


    +   - Conduct a vulnerability scan: Identify known vulnerabilities, run the command
    nmap -sV --script vuln <target> on the target, as demonstrated in Figure 4.24.
    The scripts listed under the vuln category will aid pen-testers in. Nmap will
    only add a vulnerability to the list it has identified on the target.


