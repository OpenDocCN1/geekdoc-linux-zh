    |20|15|10|

    | 4 | Asset Environment | Internet-connecting assets | Internal assets |

    |20|5|

    | 5 | Ease of Exploitation | CVSS=8 | CVSS=6 | CVSS=4 | CVSS<4 |

    |15|10|3|1|

    | 6 | Risk Rating | P1 | P2 | P3 | P4 |

