  md: '![](img/e4f93a89908ca3f498ee2517ddfbfd77_120_0.png)


    Figure 4.1: Types of vulnerability assessment scans


    The following are the various types of vulnerability assessment scans:


    +   - **Application-based vulnerability scan**: It identifies security weaknesses
    in web applications related to code and configuration.

    - **Network-based vulnerability scan**: It detects vulnerabilities in network
    infrastructure, such as misconfigured devices, weak passwords, and open ports.

    - **Wireless vulnerability scan**: It searches for security weaknesses in wireless
    networks, including weak encryption, unsecured access points, and unauthorized
    access.

    - **Database vulnerability scan**: It evaluates a database and its connected systems
    for potential security risks, including misconfigured settings, weak authentication,
    and unprotected data.

    - **Host-based vulnerability scan**: It identifies vulnerabilities in a single
    computer or device, including misconfigured settings, outdated software, and un
    security gaps.


    > To conduct a comprehensive VA scan, it is imperative to ensure that all necessary
    prerequisites have been met. These include obtaining the required permissions,
    clearly defining the scope, selecting scan type, selecting an appropriate scan
    window, preparing the environment, and carefully choosing the right tools and
    resources for the job.'
