  md: '# Computer network


    A network vulnerability assessment is a comprehensive evaluation aimed at identifying
    potential cybersecurity weaknesses and evaluating the robustness of a company’s
    network security measures. This process can be performed using manual and automated
    methods to discover open ports, identifying services and their versions, and compile
    a list of vulnerabilities based on the associated Common Vulnerabilities and Exposures
    (CVE) identification numbers. In this demonstration, we will use three practical
    tools: Nessus, Legion and Nmap, to get a hands-on understanding of the network
    vulnerability assessment process. To observe realistic results, we will use the
    Metasploitable 2 machine as our target for the demonstration.


    # Nessus


    Nessus, developed by Tenable, is an extensively utilized vulnerability scanning
    tool that effectively identifies security weaknesses in computer systems, networks,
    and web applications. With its comprehensive vulnerability database, it possesses
    the capability to detect a wide range of potential weaknesses, including misconfigurations,
    control failures, and malware infections.


    ![](img/e4f93a89908ca3f498ee2517ddfbfd77_130_0.png)


    Selecting the right tool is crucial for web application VA scanning. Open source
    and commercial options such as Burp suite, OWASP ZAP, Acunetix, and Nikto should
    be evaluated and tested to determine the best fit for your needs.'
