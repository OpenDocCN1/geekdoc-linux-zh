    # # Directory enumeration


    Web directory enumeration is a technique utilized in the reconnaissance phase
    of a web penetration test. It involves using tools and methods, such as automated
    scripts and manual browsing, to identify and list all directories and pages present
    on the target application. There are various enumeration tools available, such
    as Diruster, Dirb, and Nikto, that come in both GUI and command line versions.
    These tools use a pre-defined list of possible directory names and requests to
    the target application. The responses from the application are then analyzed and
    directories that return expected responses are marked as existing.


    The directory and page reconnaissance technique may uncover the following valuable
    information:


    +   * The results of this technique may reveal confidential and hidden directories
    that were left on the server by mistake.

    * Old backups and archives may also be discovered.

    * Additionally, login credentials may be found in plain text files.

    * If authorization is not implemented properly, forcing browsing may be possible.

    * Details about the development framework and language may also be disclosed,
    allowing attackers to easily exploit associated vulnerabilities.

    * The discovery of secret login panels can also expand the attack surface.'
