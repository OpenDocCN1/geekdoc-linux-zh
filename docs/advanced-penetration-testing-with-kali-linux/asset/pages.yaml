    # Vulnerability assessment


    Vulnerability assessment is a process where the Pen tester endeavors to discover
    logical and technical flaws in applications and computer networks. For instance,
    in a network VA scan, the Pen tester first identifies the operating system, open
    ports, and running services. Checking the service version is essential to determine
    whether the running version is vulnerable or up to date. A comprehensive evaluation
    involves multilevel correlation before listing any weaknesses.


    There are two distinct approaches to conducting a vulnerability assessment: automatic
    and manual.


    # Automated VA scan


    Automated scanning tools, like Nessus, Nexpose, and OpenVAS, analyze responses
    by comparing received data or parameters with a vulnerability database. When predetermined
    conditions match, the scan identifies and lists vulnerabilities. Leveraging automated
    scanning allows organizations to streamline vulnerability detection, minimizing
    time, effort, and associated costs.


    # Manual VA scan


    On the other hand, manual evaluation can unveil vulnerabilities that may go undetected
    by any automated tool. However, the manual approach also has its drawbacks, such
    as requiring additional effort, time, and cost.


    # Penetration testing


    Penetration testing follows VA, wherein the Pen tester attempts to exploit vulnerabilities
    identified in the initial scan. The exploit is designed to prompt the target server
    to perform an unauthorized act and deliver the desired output. By exploiting vulnerable
    running services, various actions like data dump, interruption, and reverse connection
    can be executed.


    While many tools with extensive databases exploit known technical vulnerabilities,
    the manual approach remains the best and most accurate way'
