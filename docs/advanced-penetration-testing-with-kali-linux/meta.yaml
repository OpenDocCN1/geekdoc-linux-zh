    It is crucial for pen testers to understand the significance and potential impact
    of network pen testing on the target environment. Therefore, they must have a
    clear understanding of the target infrastructure, including its hardware, software,
    and network components. This knowledge will enable pen testers to select the appropriate
    attack vector and techniques to exploit vulnerabilities successfully while minimizing
    any negative consequences. The success of a network pen testing exercise depends
    on the accuracy and completeness of the information gathered during the reconnaissance
