    # Black box


    In this approach, the Pen tester will possess only fundamental information about
    the target, such as the IP address and web URL. This type of assessment is referred
    to as surface-based VAPT since no login credentials are provided to the Pen tester.


    # Grey box


    In this approach, the Pen tester receives not only the IP addresses, URLs, APKs,
    IPAs, APIs etc. but also a detailed walkthrough of the target to comprehend its
    internal functionality. This type of assessment is referred to as authenticated
    VAPT since the Pen tester is provided with some level of login credentials. It
    lies between a black box and a white box in terms of target knowledge and authentication.


    # White box


    In this scenario, the Pen tester will possess comprehensive knowledge of the target''s
    architecture, data flow, and source code. With complete access to the target,
    the pen tester can perform deep dive and logical testing, leading to enhanced
    scan quality.


    > Note: Thoughtful evaluation of the advantages and disadvantages of the exercise
    is imperative when choosing the suitable testing approach, as each method will
    follow a unique approach and produce varying outcomes.


