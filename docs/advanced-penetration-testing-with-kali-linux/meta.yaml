    to confuse the WAF and potentially bypass its filtering mechanisms. |

    | Slow HTTP Attacks | Exploiting server resource handling by sending requests
    with slow data transmission, causing timeouts or resource exhaustion. |

    | Encrypted Traffic | Utilizing encryption methods (for example, SSL/TLS) to conceal
    the malicious payload from WAF inspection. |


