    +   1. **Reconnaissance**: Reconnaissance involves collecting information about
    the wireless network and connected devices, including the SSID, encryption type,
    and other pertinent details.

    2. **Enumeration**: Enumeration involves identifying the services running on the
    wireless network and devices, including open ports and protocols.

    3. **Vulnerability assessment**: Vulnerability assessment entails identifying
    potential weaknesses in the wireless network and devices, including vulnerabilities
    in client devices and APs, as well as encryption vulnerabilities.

    4. **Exploitation**: In this step, the tester tries to take advantage of the weaknesses
    found earlier. This could involve things like bypassing wireless network encryption
    or getting into devices and networks without permission.

    5. **Reporting**: Reporting involves documenting the findings and actions taken
    during the testing process to provide a comprehensive report of the identified
    vulnerabilities.


