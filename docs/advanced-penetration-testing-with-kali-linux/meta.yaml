    # Cutting-edge techniques - Salting and key stretching


    Adding an extra layer of complexity to the password hashing process, salting involves
    appending a randomly generated value to the password before hashing. This technique
    substantially enhances the difficulty of cracking passwords using precomputed
    hash tables or rainbow tables, as it becomes challenging to isolate the original
    password from the combined salt. Consequently, even if two users have the same
    password, their hash values will differ. To illustrate, refer to *Figure 8.1*,
    and consider the following scenario:


    ```

    Password: ummedmee1123


    Salt: exampleSALT


    Salted password: ummedmee1123exampleSALT


    Hashed password: 29A48295B77DE3420A15D967D357FF47

    ```


    ![](bbox=[0.16, 0.55, 0.83, 0.77])


    > Note: Key stretching is a vital technique used to strengthen password security.
    Methods like bcrypt and scrypt introduce computational costs, making the hashing
    process slower and more resistant to attacks. Apply key stretching to enhance
    protection against brute-force and dictionary attacks.


    # Unleashing hash cracking techniques'
