    | Critical | 9.0 - 10.0 | ![Red](https://placeholder.red) |

    | High | 7.0 - 8.9 | ![Red](https://placeholder.red) |

    | Medium | 4.0 - 6.9 | ![Yellow](https://placeholder.yellow) |

    | Low | 0.1 - 3.9 | ![Green](https://placeholder.green) |

    | None | 0.0 | ![Blue](https://placeholder.blue) |


    **Figure 10.6:** Common vulnerability scoring system


