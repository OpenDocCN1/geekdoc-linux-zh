    # Vulnerability Assessment report


    **Vulnerability Assessment (VA)** report writing involves documenting the findings
    and outcomes of a vulnerability assessment performed on a system, network, or
    application. The report should comprehensively list all the identified vulnerabilities,
    regardless of their exploitability. It is essential to include the following information
    as a minimum baseline while explaining a vulnerability instance in detail:


    +   - Vulnerability name

    - CVSS score

    - Severity

    - Vulnerability priority ratings

    - Description

    - CVE or CWE reference

    - Impact

    - Remediation

    - References


    # Penetration Testing report


    The **Penetration Testing (PT)** report serves as formal communication between
    the pentester and client, presenting outcomes of the penetration test on a system,
    network, API, Cloud, or application. When describing a vulnerability instance
    in detail, the PT report should encompass the following essential information:


    +   - Vulnerability name

    - CVSS score

    - Severity

    - Vulnerability priority ratings

    - Description

    - POC'
