  md: '# CHAPTER 3


    Active and Passive Reconnaissance Tactics


    # Introduction


    In this chapter, we will dive into the nitty-gritty of reconnaissance tactics,
    which play a significant role in successful penetration testing. Getting enough
    information about the target through reconnaissance is key to determining what
    you need for the test. Different parts of a computer system might need different
    ways of gathering the right data. As a penetration tester, it is also important
    to customize your approach based on how the target company works.


    The internet is like a treasure trove of info that is out there for everyone.
    One trick is called **Open Source Intelligence (OSINT)**, which helps a penetration
    tester collect essential data from public sources like email addresses, domain
    names, IP addresses, employee names, hostnames, and DNS records.


    > Note: Reconnaissance is the first step in a Vulnerability Assessment and Penetration
    Testing (VAPT) exercise, as it sets the foundation for the rest of the process
    and helps ensure its success.


    # Structure


    In this chapter, we will discuss the following topics:


    +   - What is reconnaissance

    - Why is intelligence gathering so important

    - Types of reconnaissance

    - Passive reconnaissance tools and tactics'
