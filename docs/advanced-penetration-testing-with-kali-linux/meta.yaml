    # ## Cutting-edge WAF evasion tactics


    A WAF serves as a security solution explicitly designed to safeguard web applications
    against a variety of attacks. By implementing a set of rules, a WAF actively identifies
    and obstructs malicious requests or suspicious activities.


    WAF evasion techniques pertain to the methods employed by penetration testers
    to effectively evade or circumvent the protective measures established by a WAF.
    These testers strive to bypass a WAF to identify potential vulnerabilities or
    weaknesses present in the web applications shielded by the firewall, which could
    potentially be exploited by malicious individuals. By comprehending the mechanisms
    of WAF evasion, penetration testers can evaluate the efficacy of the WAF and assist
    organizations in fortifying their security defenses for web-based applications.


    Bypassing a WAF involves various techniques to evade or circumvent its protections.
    Here are some common techniques that attackers and penetration testers may employ
    to bypass a WAF as shown in *Table 9.3*:


    | | |

    |---|---|'
  merge: -1
  pgno: 329
- img_proc: false
  md: '| Technique | Description |

    |---|---|

    | Payload Obfuscation | Modifying or encoding the attack payload to evade signature-based
    detection. Techniques include URL encoding, character encoding, etc. |

    | Parameter Fragmentation | Dividing attack payloads across multiple request parameters
    or sections to bypass specific WAF rules based on complete attack patterns. |

    | Protocol-Level Evasion | Exploiting inconsistencies or ambiguities in the HTTP
    protocol specifications to manipulate request headers. |

    | Manipulating HTTP Methods | Leveraging less commonly used HTTP methods (for
    example, PROPFIND or OPTIONS) to evade specific WAF protections. |

    | IP and User-Agent Spoofing | Modifying the source IP address or User-Agent header
    to masquerade as a trusted entity or emulate a legitimate user. |

    | Request Smuggling | Exploiting variations in how servers interpret HTTP request
    delimiters or handling multiple requests within a single HTTP connection. |

    | WAF Misconfigurations | Identifying and exploiting misconfigurations in WAF
    rules, whitelists, or blacklists to bypass specific protections. |

