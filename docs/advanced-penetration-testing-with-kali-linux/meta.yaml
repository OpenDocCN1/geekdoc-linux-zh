  md: '| Type of CVSS Score | Description |

    | :--- | :--- |

    | Base Score | The Base Score represents the potential impact of the vulnerability
    on the target system, solely based on intrinsic characteristics, without considering
    temporal or environmental factors. The following metrics are used for calculating
    the Base Score:<br>• AV (Attack Vector)<br>• AC (Attack Complexity)<br>• PR (Privileges
    Required)<br>• UI (User Interaction)<br>• S (Scope)<br>• C (Confidentiality)<br>•
    I (Integrity)<br>• A (Availability) |

    | Temporal Score | The Temporal Score considers dynamic factors that can change
    over time, affecting the overall severity of the vulnerability. The calculation
    incorporates the following metrics:<br>• E (Exploit Code Maturity)<br>• RL (Remediation
    Level)<br>• RC (Report Confidence) |

    | Environmental Score | The Environmental Score accounts for the distinct characteristics
    of an organization''s environment and infrastructure. It involves the following
    metrics:<br>• Modified Base Metrics<br>• CR (Confidentiality Requirement)<br>•
    IR (Integrity Requirement)<br>• AR (Availability Requirement) |


