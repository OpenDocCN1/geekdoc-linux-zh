- img_proc: false
  md: '| Term | Definition |

    |---|---|

    | Metamorphism | Altering code and behavior with each infection, making it difficult
    for antivirus programs to recognize the malware. |

    | Packing and Encryption | Compressing or encrypting malware to obfuscate its
    true nature and prevent easy analysis. |

    | Rootkits | Tampering with system functions or APIs to hide malicious activities
    and processes from antivirus software. |

    | Zero-day Exploits | Exploiting unknown software vulnerabilities before antivirus
    vendors can develop appropriate signatures or updates. |


    *Table 9.1: Antivirus evasion techniques*


