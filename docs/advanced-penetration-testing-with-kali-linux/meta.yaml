    # Difference between hashing, encryption and encoding


    Here is Table 8.2 outlining the differences between hashing, encryption, and encoding
    in a tabular format:


    | | Hashing | Encryption | Encoding |

    |---|---|---|---|

    | Definition | A one-way process of converting data into a fixed-size string of
    characters. | The process of converting data into a form that cannot be easily
    understood without the decryption key. | The process of converting data into a
    different representation format. |

    | Purpose | Verify data integrity and uniqueness. | Protect data confidentiality.
    | Transform data for transmission or storage purposes. |

    | Reversibility | Non-reversible. The original data cannot be retrieved from the
    hash value. | Reversible. The original data can be retrieved using the decryption
    key. | Reversible. The original data can be retrieved by decoding the encoded
    representation. |

    | Key requirement | No key required. | Requires a key for both encryption and
    decryption. | No key required. |'
