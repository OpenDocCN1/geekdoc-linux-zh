  md: '+   - If we are able to identify the web development company, we can also search
    for similar vulnerabilities in their other domains.

    - Nameservers can be used to obtain the hosting IP and other details, which can
    be useful for performing IP-based exploitation.

    - Domain aging refers to the age of the domain, and it can be used to explore
    old or unused features and functionality of the application by checking the domain’s
    old archives.


    > Note: Sometimes, WHOIS details may be masked with proxy information if the user
    pays an additional fee to the registrar to keep the ownership details private.


    # DNS reconnaissance


    Domain Name System (DNS) reconnaissance is a process of collecting various records
    related to a website that helps in configuring and making it accessible on the
    internet. One of the key aspects of this technique is DNS resolution, which allows
    for identifying the IP address linked to the website.


    Furthermore, by utilizing DNS reconnaissance, a penetration tester can gather
    valuable intelligence such as:


    +   - **NS (Name Server) Record:** These indicate the location of the servers
    responsible for managing and storing the DNS records for a particular domain.

    - **A (Address) Records:** These records specify the IP address associated with
    a given domain

    - **AAAA Record:** These records are quite similar to ‘A’ records, but they are
    used to map a domain name to an IPv6 address

    - **MX (Mail Exchange) Records:** These records indicate the details of the email
    servers associated with the domain.

    - **CNAME (Canonical Name) Record:** These records assist in determining the names
    of other domains if multiple services are running on a single server.

    - **TXT Records:** These records contain details about other resources associated
    with the domain, such as servers and network information.

    - **PTR (Pointer) Records:** These records are the inverse of ‘A’ records, and
    they provide the domain name corresponding to an IP address.'
