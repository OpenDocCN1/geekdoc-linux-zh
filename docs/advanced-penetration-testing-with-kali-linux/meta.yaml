    # OS fingerprinting


    **Operating System (OS)** fingerprinting is the process of identifying the operating
    system on a targeted host by analyzing the responses to various packets sent to
    it. Nmap is a commonly used tool for this, which compares the response to its
    database of known OS fingerprints and outputs the OS details if a match is found.
    This information can be useful for finding OS-specific vulnerabilities and determining
    the limitations of certain services. Additionally, it can also be used to validate
    the results of automated vulnerability scanners by determining the specific OS
    and its version.


    To determine the OS of a target host, the `-O` option can be used in the `Nmap`
    command. Furthermore, the `-A` option can be used to enable OS detection, as illustrated
    in the example provided in *Figure 3.22*:


    Run the following command: `nmap -O 192.168.159.129`'
