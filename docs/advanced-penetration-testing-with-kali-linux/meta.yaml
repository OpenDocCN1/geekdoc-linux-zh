  md: "# John the Ripper\n\nJohn the Ripper is an esteemed and robust tool for cracking\
    \ passwords, renowned for its flexibility and speed. It operates seamlessly on\
    \ various platforms, including Windows, Linux, and macOS. Employing a diverse\
    \ range of techniques such as dictionary attacks, brute force attacks, and hybrid\
    \ attacks, it efficiently cracks password hashes. Furthermore, its versatility\
    \ extends to supporting multiple hash types.\n\n# Case 1: A practical illustration\
    \ for cracking Linux passwords\n\nLet us consider a password hash extracted from\
    \ a Linux system’s /etc/shadow file:\nusername:$6$XZjHMrdYPINY/KQn$tRtmCrxpeKFIf1/DCsRgk8qPNPEv55qpPheJtceaKCrlRiYoMYrlWJN.JKiFmIeByMMy6R6ZQWz3LjNCL3g7Z0/.\
    \ In this scenario, the hash algorithm employed is SHA-512, indicated by the presence\
    \ of $6$. Our objective is to crack this password hash by utilizing John the Ripper.\
    \ Follow the steps given below:\n\n+   1. Begin by creating a text file, such\
    \ as `hashes.txt`, and paste the provided hash value into it. Finally, save the\
    \ file. Follow the example depicted in *Figure 8.4*: \n2. Open the terminal and\
    \ execute the command `john --format=sha512crypt --wordlist=/path/to/wordlist.txt\
    \ hashes.txt` to commence the password cracking process. Popular wordlists like\
    \ `rockyou.txt` can be utilized, or you can create custom wordlists. This command\
    \ will also present the progress and provide an estimated time remaining for each\
    \ password attempt. See *Figure 8.5*:\n\n![](bbox=[0.165, 0.538, 0.882, 0.605])\n\
    \n```\n(ummedmeel@kali)-[~/Desktop]\n$ sudo john --format=sha512crypt --wordlist=/usr/share/wordlists/rockyou.txt\
