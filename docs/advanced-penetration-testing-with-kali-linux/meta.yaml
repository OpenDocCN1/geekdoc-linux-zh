  md: '# Vulnerability nomenclature


    Vulnerability nomenclature is the naming convention used to describe vulnerabilities
    in applications, software, networks, or computer systems. Standardizing documentation,
    communication, and discussion of vulnerabilities makes it easier for security
    professionals to manage and identify them effectively.


    A vulnerability nomenclature usually contains a unique identifier, such as a vulnerability
    identifier number or code, information about the vulnerability’s impact, affected
    systems or software, and a vulnerability description. This information is frequently
    stored and maintained in centralized databases, such as **Common Vulnerabilities
    and Exposures (CVE)** and **Common Weakness Enumeration (CWE)**.


    > Note: Using standardized terms and categories can enable different teams and
    stakeholders to better comprehend and deliberate on vulnerabilities, reducing
    miscommunication and effectively resolving identified vulnerabilities.


    # Vulnerability management life cycle


    The **Vulnerability Management (VM)** life cycle is a comprehensive and repetitive
    method to ensure that the ongoing security assessments are of high quality to
    effectively address and mitigate vulnerabilities in an organization’s computer
    systems and network infrastructure. The VM life cycle enables organizations to
    perform asset discovery, vulnerability assessment, vulnerability prioritization,
    reporting, remediation, and revalidation. The continuous nature of the activity
    requires adherence to a life cycle and guarantees continuous improvement of people,
    processes, and technology. Refer to *Figure 4.2* below to gain a visual understanding
    of the VM life cycle:'
  merge: -1
  pgno: 121
- img_proc: false
  md: '![](bbox=[0.21, 0.08, 0.78, 0.38])


    **Figure 4.2:** *Vulnerability management life cycle*


    > Note: Adopting a vulnerability management life cycle is a proactive cyber security
    approach that can bring cost savings to organizations, enabling them to identify
    and remediate vulnerabilities promptly, preventing potential damage and costly
    security breaches.


