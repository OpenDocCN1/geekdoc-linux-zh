  md: '+   * **UDP scan**: UDP scan is a method of determining if a port is open or
    not on a target host by sending UDP packets to various ports on the host.

    * **Stealth scan (Half open scan)**: A half-open scan, also known as an SYN scan,
    sends an SYN packet to the target port, if the target port is open, the host will
    respond with an SYN-ACK packet. If the port is closed, the host will respond with
    an RST packet.

    * **FIN scan**: The scan sends a FIN packet to the target port and waits for a
    response. If the port is open on the remote host, it will respond with an RST
    (reset) packet, showing that the port is closed. If the port is closed, no response
    will be received from the remote host, indicating that the port is open.

    * **Null scan**: This technique involves sending packets without any flags set
    in the TCP header, known as a nu11 packet. If a port is open on the remote host,
    no response will be sent back. If the port is closed, the remote host will issue
    an RST (reset) packet as a response.

    * **Xmas scan**: This technique involves sending packets with the FIN, PSH, and
    URG flags set in the TCP header, known as a Xmas packet. If the port is open on
    the remote host, it will respond with an RST (reset) packet, indicating the port
    is closed. If the port is closed, the remote host will not respond, indicating
    the port is open.


    > Note: A half-open scan does not fully establish a connection with the remote
    host, unlike a full-open scan, and leaves the connection in an incomplete state.
    Half-open scans are less detectable by firewalls and intrusion detection systems
    as they do not create a full connection.


    # Running services and version detection


