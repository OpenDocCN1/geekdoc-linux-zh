    # Understanding network pen testing


    Network pen testing is a crucial step in identifying and mitigating potential
    security risks within an organization’s network. During this process, pen testers
    must attempt to exploit identified vulnerable services to gain unauthorized access
    or perform unauthorized actions that could cause significant harm to the organization.
    Network pen testing encompasses all network devices, including servers, databases,
    and security controls. Advanced network penetration testing typically involves
    several phases, including `Exploitation`, `Lateral Movement`, `Maintaining Access`,
    `Undoing Changes`, `Reporting and Documentation`, and `Remediation`, as illustrated
    in *Figure 5.1* below:'
