  md: '# Vulnerability Assessment


    **Vulnerability Assessment (VA)** can only detect weaknesses in the targeted system.
    However, it cannot differentiate between findings that have the potential to be
    exploited and cause damage to the system.


    # Penetration Testing


    **Penetration Testing (PT)** is a sequential exercise that builds on vulnerability
    assessment results. In this process, the pen tester identifies vulnerabilities
    and exploits them to gain access and exfiltrate data. Additionally, penetration
    testing evaluates the system through the access gained after exploitation to determine
    the sensitivity of the accessible data.


    For example, if banner grabbing identifies an outdated version of a service and
    the pen tester has included all relevant CVEs/CWEs in their report, that would
    be classified as a vulnerability assessment. However, if the pen tester is able
    to gain access to the server or obtain a desired response through the use of an
    exploit, then this would fall under the category of Penetration Testing.


    > Note: A pen tester should not be content with identifying only the obvious vulnerabilities
    and then stop working. Given the ever-increasing complexity of attack surfaces,
    a great deal of effort is required to thoroughly test and secure systems against
    potential threats.


