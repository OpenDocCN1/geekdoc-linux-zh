    +   - **Reflected XSS:** This type of attack involves injecting malicious code\
    \ into a URL which is then reflected back to the user's browser. The attacker\
    \ typically tricks the victim into clicking on a link containing the malicious\
    \ code, which then executes on the victim's browser. Reflected XSS attacks can\
    \ be difficult to detect and are commonly used in phishing scams.\n\n+   - **DOM-based\
    \ XSS:** In this type of attack, the attacker injects malicious code into the\
    \ **Document Object Model (DOM)** of a web page. This code is executed entirely\
