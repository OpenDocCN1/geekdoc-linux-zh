  md: 'There are various tools available for conducting DNS reconnaissance, such as
    *nslookup*, *dig*, *dnsenum*, *dnsrecon*, *dnsmap*, *DNSRecon*, *theHarvester*,
    and *Sublist3r*. To illustrate the concept of DNS reconnaissance, we will use
    the example of DNSenum, which is a multithreaded Perl script that can be run in
    command line mode to enumerate DNS information.


