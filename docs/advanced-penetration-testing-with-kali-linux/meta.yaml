    # Fundamentals of VAPT


    **Vulnerability Assessment and Penetration Testing (VAPT)** is a methodical and
    risk-based approach for identifying security vulnerabilities within computer infrastructure.
    VAPT audits utilize a combination of automated tools and manual efforts to detect
    all potential vulnerabilities that malicious actors may exploit.


    The vulnerability life cycle refers to a vulnerability''s stages, from its discovery
