    environment. Pen testers must maintain professionalism and adhere to ethical guidelines
    throughout the network pen testing exercise.


    # # Introduction to Metasploit


    The Metasploit Framework, developed by *HD Moore* in 2003 and now maintained by
    Rapid7, is an open-source software tool utilized by penetration testers, security
    researchers, and hackers for penetration testing, vulnerability scanning, and
    exploit development. Written in Ruby, it is designed to offer flexibility and
    extensibility, enabling users to tailor their exploits and payloads. The `Metasploit
    Framework` offers a multitude of features and functionalities, as illustrated
    in *Figure 5.2* below:'
