  md: 'Nmap is a free and open-source tool widely used for host discovery, port scanning,
    and vulnerability assessment. One of its most powerful and versatile features
    is the **Nmap Scripting Engine (NSE)**, which enables users to automate various
    networking tasks by writing simple scripts. With the speed and efficiency you
    expect from Nmap, these scripts are executed in parallel. NSE scripts are categorized
    into various categories such as auth, broadcast, brute, default, discovery, dos,
    exploit, external, fuzzer, intrusive, malware, safe, version, and vuln.


    It is common to perform script scanning in conjunction with port scanning, as
    the scripts may only run based on the port states discovered during the scan.
    To help you understand the Nmap scanning process, let us examine some of the Nmap
    scanning commands with flags:


    +   - **Conduct a vulnerability scan:** To identify known vulnerabilities, run
    the command `nmap -sV --script vuln <target>` on the target, as demonstrated in
    *Figure 4.24*. The scripts listed under the vuln category will aid pen-testers
    in this task. Nmap will only add a vulnerability to the list once it has been
    identified on the target.


    ![](bbox=[0.11, 0.54, 0.8, 0.83])


    *Figure 4.24:* Conduct a vulnerability scan


    +   - **Specifying targets:** Nmap supports providing individual targets, subnets,
    ranges, and groups. For example, a target could be specified as an IP address
    (192.168.149.129), a subnet (192.168.149.0/24), and a range of IP addresses (192.168.149.129-150).
    To read the target list from a text file, run the command `nmap -sV --script vuln
    -iL <path and target file name>`, as shown in *Figure 4.25* below:'
