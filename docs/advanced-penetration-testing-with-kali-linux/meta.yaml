  md: 'assigns a severity score to each vulnerability based on its potential impact
    and the likelihood of exploitation.


    Once vulnerabilities have been identified and prioritized, countermeasures are
    implemented to mitigate their risk. This may involve applying software patches,
    configuring firewalls and intrusion detection systems, training employees on safe
    practices, and implementing access controls.


    There are two primary approaches to vulnerability management: manual and automated.
    Below in *Table 4.1*, you can see the definitions and differences between these
    approaches:


    | Parameters | Manual Vulnerability Management | Automated Vulnerability Management
    |

    |------------|--------------------------------|-------------------------------------|

    | Security Professional Intervention | It requires security professionals to assess
    systems and applications for vulnerabilities, prioritize them, and take the necessary
    steps to remediate them. | It involves software tools that scan systems and applications
    for vulnerabilities, providing automated detection, prioritization, and remediation
    recommendations. |

    | Customization | It is more comprehensive and allows for greater control and
    customization | It supports less customization |

    | Timing and Resource Consumption | It is time-consuming and resource-intensive
    | It is faster and more efficient |


    *Table 4.1: Vulnerability management approaches*


    > Note: Comprehensive vulnerability management often involves a combination of
    both manual and automated approaches. Although automated vulnerability management
    is faster and more efficient, it may only identify some vulnerabilities, and its
    recommendations may need more accuracy and customization than those obtained from
    manual assessment.


    # ## Application security


    **Application security** or **AppSec** encompasses the practices and procedures
    to discover, remedy, and avoid security weaknesses in software, hardware, and
    development processes at the application level. Integrating security testing into
    every stage of the SDLC, including requirements analysis, design, implementation,
    verification, and maintenance, is essential to detect and address vulnerabilities
    promptly and comprehensively. By incorporating AppSec practices from the outset,
    organizations can significantly minimize the risk of security vulnerabilities
    in their code, APIs, and third-party components utilized within their applications.


    Two categories encompass application security:'
  merge: -1
  pgno: 152
- img_proc: false
  md: '+   - **Static Application Security Testing (SAST)**: It examines an application''s
    source code to detect security vulnerabilities before deployment. By identifying
    potential flaws early in the development process, SAST can reduce the cost and
    effort required to address them later.

    - **Dynamic Application Security Testing (DAST)**: It tests an application while
    running to uncover security vulnerabilities, weaknesses, and other issues that
    may not be visible in the source code. DAST tools simulate attacks on an application
    to identify potential vulnerabilities that attackers could exploit, providing
    a more accurate assessment of an application''s overall security posture.


