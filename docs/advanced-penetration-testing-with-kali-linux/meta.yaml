    each port. This service and version detection can be useful for identifying specific
    software versions that may have known vulnerabilities or misconfigurations that
    a penetration tester could exploit.


    To determine the service name and version, the ‘-sv’ flag can be used in the Nmap
    command, as shown in the example illustrated in *Figure 3.21*:


