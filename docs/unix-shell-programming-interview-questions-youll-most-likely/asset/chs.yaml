  \n***\n\nBash - 高级教程\n\n## 170: 解释 whiptail, man 和 grep。\n\n答案：\n\n`whiptail` 在\
  \ shell 脚本用于显示用户友好对话框以展示信息或接收用户输入。\n\n`man` 命令类似于 `help` 和 `info` 命令，用于帮助。区别在于 `man`\
  \ 显示的是 roff（roff 是一种文本格式）。\n\n`grep` 是一个用于在管道或文件中搜索信息的工具，可以配合 `ls` 命令使用。假设你正在寻找一个包含\
  \ `mynm` 字符串的文件，通过 `grep` 命令进行搜索，你会获取该文件。\n\n## 171: 解释 /dev 和 /proc。\n\n答案：\n\n\
  `/dev` 文件夹包含硬件信息的文件。设备文件存储在此处，也可能包含关于设备的信息。你可以像加载单个文件一样加载它们。\n\n`/proc` 文件夹是一个镜像，包含当前正在运行的进程和程序的信息。\n\
  \n## 172: 解释 trap 命令。\n\n答案：\n\n`trap` 用于调试程序运行时系统发送的信号或错误。`trap` 接收系统发送的信号，这类似于\
  \ C++ 或 Java 中的异常处理。\n\n## 173: 什么是 POSIX？\n\n答案：\n\nPOSIX 字符集允许不使用通配符指定字符范围。它们比通配符更易读且更易用。此外，POSIX\
  \ 允许捕捉控制字符和图形，例如 `[:alpha:]` 表示 A-z。\n\n## 174: 解释 tput 和 infocmp。\n\n答案：\n\n`tput`\
  \ 命令允许初始化终端或访问其中的信息。可以使用带有许多选项的 `tput` 命令控制各种终端功能。例如，`tput clear` 清屏，`tput reset`\
  \ 重置终端设置的参数。`infocmp` 命令用于获取当前终端的详细信息，来自 terminfo 数据库。\n\n## 175: 定义一个名为 ls 的函数会导致什么问题？\n\
  \n答案：\n\n如果我们定义了一个名为 ls 的函数，该函数将覆盖 `ls` 命令。\n\n## 176: 定义一个名为 pause_until_return\
  \ 的函数，暂停脚本执行直到用户按下回车键。\n\n答案：\n\n```bash\nfunction pause_until_return () {\n  echo\
  \ \"Press RETURN to continue...\"\n  read dummy\n}\n```\n\n## 177: 如何创建函数库？这种库的优点是什么？\n\
  \n答案：\n\n你可以创建一个函数“库”文件，即包含函数声明和变量定义的文件，然后在任何需要这些函数的脚本中 `source` 该“库文件”：\n\n```bash\n\
  #!/bin/bash\n. /path_to_library/library_file # 注意点\n```\n\n使用函数库的优点是：\n\na) 减小 shell\
  \ 脚本文件的大小\n\nb) 更新方便。如果库文件被许多脚本使用且其内容被修改，所有调用该函数的脚本立即可以使用更新版本\n\n## 178: 允许使用递归函数（调用自身的函数）吗？\n\
  \n答案：\n\n是的，允许使用递归函数。但必须注意不要启动“死循环”。\n\n## 179: 以下代码段使用文件描述符创建文件：\n\n```bash\nexec\
  \ 3> /tmp/newfile\necho -u3 \"First line...\"\necho -u3 \"Second line ...\"\nexec\
  \ 3>&-\n```\n\n以下代码段创建相同的文件：\n\n```bash\necho \"First line ...\" > /tmp/newfile\n\
  echo \"Second line...\" >> /tmp/newfile\n```\n\n但上述代码段的运行方式存在重要区别。你能解释一下吗？\n\n答案：\n\
  \n第一个代码段通过 `exec 3>` 开启了一次 newfile，然后文件保持打开状态直到第二个 `exec` 执行。\n\n在第二个代码段中，文件在第一次执行\
  \ `echo` 命令时被打开，然后关闭；当第二个 `echo` 开始时再次打开，然后再次关闭。从性能角度来看，如果这种语法被多次使用（例如在循环内部），可能会是一个重要问题。\n\
  \n## 180: 如果你需要在脚本中使用交互式命令（如 sftp），可以使用什么来自动化此功能（无需用户交互）？\n\n答案：\n\n我们可以使用所谓的“这里”文档（here\
  \ document）。\n\n## 181: 以下命令的输出是什么？\n\n`netstat -rn | awk '/^def/ {print \"Default\
