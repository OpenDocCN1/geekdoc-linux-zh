  \n### 192: 在 case 结构中使用终止符 `;;&` 和 `;&` 有什么影响？\n\n答案：\n\n`;;&` 终止符会继续执行下一个模式测试。`;&`\
  \ 终止符即使带有占位模式也会执行下一个语句，也就是说，即使值不匹配模式也会执行下一个语句，因此它的用性稍小，且应该谨慎使用。\n\n### 193: 写出以下\
