  \ textfile`\n```\n其中变量 `j` 定义了第 n 行。\n\n## 82: 假设 input_file 是一个用空格分隔字段的文本文件，当执行以下命令时，`ncol`\
  \ 的值将是多少？\n\n```bash\nsetncol = `awk '{if (FNR==1) print NF}' input_file`\n```\n\
  \n答案：\n\n该文件第一行的字段数将被设置为 `ncol` 的值，因为：\n\na) `FNR` 和 `NF` 是 `awk` 中的变量\nb) 读取的记录数将被赋值给\
  \ `FNR`\nc) 记录中的字段数将被赋值给 `NF`\n\n## 83: 找到存储在数组中的整数的最小值。\n\n答案：\n\n```bash\nset\
  \ array = (4, -2, 5, 8, 13, 1)\nset array_org = ($array[*]) # 创建一个克隆以保留原始数字\nset\
  \ min = $array[1]\nwhile ( $#array > 0 ) # 如果至少有一个元素\n  if ( $min > $array[1] )\
  \ then\n    set min = $array[1]\n  endif\n  shift array # 丢弃数组的第一个元素\nend\necho\
  \ \"The original numbers are: $array_org[*]\"\necho \"The minimum number is: $min\"\
  \n```\n\n## 84: 解释以下命令块：\n\n```bash\nforeach luser (`who | cut -f1 -d' ' | uniq`\
  \ )\n  if( -f /allfiles/$luser.msg) then\n    mail $luser < $luser.msg\n    echo\
  \ \"Message sent to $luser\"\n  else\n    mail $luser << END\n    Dear $luser,\n\
  \    No message file has been created for you.\n    Please check your settings\n\
  \    END\n  endif\nend\n```\n\n答案：\n\n变量 `luser` 的取值为系统中每个登录用户的用户名（如果某些用户有多个登录会话，则取唯一名称）。在循环内部，它会检查每个用户是否存在一个“个性化”的消息文件，其命名格式为“username.msg”。如果是，它会将该文件发送到用户的信箱。如果不是，它将使用“在此文档（here\
  \ document）”创建一个消息并发送给用户，告知其他正在等待的文件不存在。\n\n## 85: C shell 提供了一种读取单行的方法：\n\n```bash\n\
  set VAR = $<\n```\n\n这种语法的局限性是什么？\n\n答案：\n\n此命令始终从标准输入读取。`<` 只代表 `STDIN`，且在脚本运行期间无法更改。\n\
  \n## 86: 解释以下代码段。\n\n```bash\nforeach my_line ( \"`cat /etc1/my_passwd`\" )\n  set\
  \ my_line = \"$my_line:gas1/ /_/\"\n  set my_line = \"$my_line:gas1/:/ /\"\n  set\
  \ argv = ( $my_line )\n  set my_name1 = $1\n  set my_name2 = \"$5:gas1/_/ /\"\n\
  \  echo $my_name2\nend\n```\n\n答案：\n\n这是逐行读取文件的一种通宜方法。在每次循环迭代中，`line` 变量从 `/etc1/my_passwd`\
  \ 文件中获取下一行（注意 `cat/etc1/my_passwd` 周围的双引号），然后使用变量修饰符，脚本首先将空格替换为下划线，将冒号（:）替换为空格。然后将位置参数设置为行的字段，再次将下划线替换为空格，并显示注释字段。\n\
  \n## 87: 修复以下脚本中的任何语法或逻辑错误。\n\n```bash\n# 此脚本创建路径下的子目录列表\n#!/bin/csh\necho \"Subdirectories\
  \ in $DirPath\"\ncd $DirPath\nforeach file (*)\n  if ( -e $file ) then\n    echo\
  \ $file\n  endif\nend\n```\n\n答案：\n\na) `#!/bin/csh` 行必须是脚本的**第一行**。\nb) 变量 `DirPath`\
  \ 未设置，因此 `cd $DirPath` 命令会变为进入用户的主目录 (cd)。\nc) 测试 `(-e $file)` 检查的是 `file` 变量的值是否存在，而不是检查它是否为目录。它应该是：`(\
  \ -d \"$file\" )`。\nd) 在变量替换表达式周围使用双引号更安全，例如 `\"$file\"`。\n\n正确的脚本如下：\n\n```bash\n\
  #!/bin/csh\n# 此脚本创建路径下的子目录列表\necho \"Subdirectories in $DirPath\"\ncd $DirPath\n\
  foreach file (*)\n  if ( -d \"$file\" ) then\n    echo \"$file\"\n  endif\nend\n\
  ```\n\n## 88: 解释以下脚本。\n\n```bash\nforeach my_line (\n  )\n  echo\n  \"\n  \n\n\n\
