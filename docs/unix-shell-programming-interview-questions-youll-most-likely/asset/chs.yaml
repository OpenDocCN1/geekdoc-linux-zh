  \ parameters word by word\"\norig_args=$@\necho $@ # 显示当前的位置参数\nset -- $new_positionals\n\
  echo $@ # 显示 new_positionals 的内容\nset --\necho $@ # 显示空行\nset -- $orig_args\necho\
  \ $@ # 显示原始参数\n```\n\n### 190: `rm` 命令只是将文件（索引节点）从数据块中取消链接。要彻底删除一个文件，需要覆盖该文件占据的数据块。创建一个脚本，安全地删除作为参数传递给它的文件。\n\
