  \ > 0 ) # 如果至少有一个元素\n  if ( $min > $array[1] ) then\n    set min = $array[1]\n \
  \ endif\n  shift array # 丢弃数组的第一个元素\necho \"The original numbers are: $array_org[*]\"\
  \necho \"The minimum number is: $min\"\n```\n\n## 91: 解释以下命令块：\n\n```bash\nforeach\
  \ luser (`who | cut -f1 -d' ' | uniq` )\n  if( -f /allfiles/$luser.msg) then\n \
  \   mail $luser < $luser.msg\n    echo \"Message sent to $luser\"\n  else\n    mail\
  \ $luser << END\n    Dear $luser,\n    No message file has been created for you.\n\
  \    Please check your settings\n    END\n  endif\nend\n```\n\n答案：\n\n变量 `luser`\
  \ 的取值为系统中每个登录用户的用户名（如果某些用户有多个登录会话，则取唯一名称）。在循环内部，它会检查每个用户是否存在一个“个性化”的消息文件，其命名格式为“username.msg”。如果是，它会将该文件发送到用户的信箱。如果不是，它将使用“在此文档（here\
  \ document）”创建一个消息并发送给用户，告知其他正在等待的文件不存在。\n\n## 92: C shell 提供了一种读取单行的方法：\n\n```bash\n\
  set VAR = $<\n```\n\n这种语法的局限性是什么？\n\n答案：\n\n此命令始终从标准输入读取。`<` 只代表 `STDIN`，且在脚本运行期间无法更改。\n\
  \n## 93: 解释以下代码段。\n\n```bash\nforeach my_line ( \"`cat /etc1/my_passwd`\" )\n  set\
  \ my_line = \"$my_line:gas1/ /_/\"\n  set my_line = \"$my_line:gas1/:/ /\"\n  set\
  \ argv = ( $my_line )\n  set my_name1 = $1\n  set my_name2 = \"$5:gas1/_/ /\"\n\
  \  echo $my_name2\nend\n```\n\n答案：\n\n这是逐行读取文件的一种通宜方法。在每次循环迭代中，`line` 变量从 `/etc1/my_passwd`\
  \ 文件中获取下一行（注意 `cat/etc1/my_passwd` 周围的双引号），然后使用变量修饰符，脚本首先将空格替换为下划线，将冒号（:）替换为空格。然后将位置参数设置为行的字段，再次将下划线替换为空格，并显示注释字段。\n\
  \n\n\n\n此脚本使用了 `getopt` 命令，它可以一次性处理整个参数列表。如果参数列表匹配，`getopt` 会对参数列表进行规范化（按照 UNIX\
  \ 命令使用的典型方式重新排序），将标志位（flags）及其可选参数放在任何非标志参数之前，并在末尾添加单个 `\"--\"` 参数以表示没有更多标志位需要处理。\n\
  \n在出现 `-h` 选项的情况下，脚本将显示“用法”（usage）信息并终止。在出现 `-o` 选项的情况下，脚本会将 `OUTPUT_FILE` 变量设置为随后的参数。在出现\
  \ `-l` 选项的情况下，脚本会将 `DO_LONG` 变量设置为 `-l`。`while` 循环后的 `shift` 命令会移除末尾的 `--`。\n\n\
  如果没有使用任何选项，脚本将运行 `ls $*`（其中 `$*` 是剩余参数）；如果使用了 `-l` 选项，将运行 `ls -l $*` 命令；如果使用了 `-o`\
  \ 文件，将运行 `ls -l $*` 命令并将输出重定向到 `OUTPUT_FILE` 文件。\n\n### 94: 编写一个脚本，计算存储在数组中的一组浮点数的最小值、最大值和平均值。\n\
  \n**答案：**\n\n```bash\nset array = (5, 10, 2, 13, 0.2345)\n\nforeach num ($array[*])\n\
  \  echo $num >> nums_file\nend\n\nawk '{if(min==”\"){min=max=$1}; if($1>max) {max=$1};\
  \ if($1< min) {min=$1}; total+=$1; count+=1} END {print \"Average is: \"total/count,\
  \ \"Min is: \"min, \"Max is: \"max}’ nums_file\n```\n\n---\n\n### 95: 你有一个具有对称模式的数据文件（每条记录字段数相同），第一行包含字段标题。你想提取实际数据记录的第\
  \ 3 列（字段），即除去表头行（第一行）和任何注释行（假设它们以 `#` 或 `*` 开头）。请给出一个解决方案并简要解释。\n\n**答案：**\n\n```bash\n\
  set cn = 3\nset ncols = `awk '{FNR == 1 {print NF}' input_file `\nif ( $cn <= $ncols\
  \ ) then\n  set col$cn = ` awk -v i=$cn '$0 !~ /^[#*]/ && FNR != 1 { print $i }'\
  \ input_file`\nelse\n  echo \"The column number must be in the range 1 to $ncols\"\
  \nendif\n```\n\n变量 `ncols` 包含每条记录的列总数。`if` 结构用于避免请求的列位置号大于总列数的情况。`col3` 将是第三列值的数组。\n\
  \n---\n\n### 96: 假设 `input_file` 是一个具有非对称模式的表格数据文件，即每条记录（行）可能有不同数量的字段，且前 3 行描述了使用的模式。请解释以下代码段。\n\
  \n```bash\nset cn = 3\nset ccounts = `awk '{FNR > 3 {print NF}' input_file `\nset\
  \ ccounts1 = ( $ccounts[*] )\nset ccounts2 = ( $ccounts[*] )\nset mincn = $ccounts[1]\n\
  while ( $ccounts1 > 0 )\n  if( $mincn > $ccounts1[1] ) then\n    set mincn = $ccounts1[1]\n\
  \  endif\n  shift ccounts1\nend\nset maxcn = $ccounts2[1]\nwhile ( $ccounts2 > 0\
  \ )\n  if ( $maxcn < $ccounts2[1] ) then\n    set maxcn = $ccounts2[1]\n  endif\n\
  \  shift ccounts2\nend\nif ( $cn <= $maxcn ) then\n  set col$cn = ` awk -v i=$cn\
  \ -v minc=$mincn 'FNR > 3 { (FN < minc ) ? print FN \"null\" : print $i }' input_file`\n\
  else\n  echo \"The column number must be in the range $mincn to $maxcn\"\nendif\n\
  ```\n\n**答案：**\n该脚本从非对称数据文件中提取某一列的内容：\n\n`cn` 变量持有要提取的列。`ccounts` 数组持有所有实际数据记录（`FNR\
  \ > 3`）的字段数。数组 `ccount1` 和 `ccount2` 是 `ccount` 数组的副本，用于从 `ccounts` 数组中计算最小值和最大值。我们使用这些临时数组是为了保留原始数组以便后续使用。第一个\
  \ `while` 循环计算最小值，第二个循环计算最大值。每个循环迭代中的 `shift` 命令会丢弃数组的第一个元素。`if` 语句随后检查请求的列（字段）编号是否小于最大值，如果是，则\
  \ `awk` 命令在存在任何内容（`FN >= minc`）时打印该列的内容，否则打印字符串 `\"FNnull\"`。反之，如果请求的列编号大于最大值，脚本将显示一条消息。\n\
  \n---\n\n### 97: 假设你有一个数据文件，但其内部格式并不保持一致。你想从该文件中提取两列，但你不知道列的顺序，只知道它们的标题：Name 和 email。写一个实现这些任务的脚本。\n\
  \n**答案：**\n\n```bash\n#!/bin/csh -f\nset fl = filename\nset namepos = `head -1 \"\
  $fl\" | awk '{split($0,a) ; for ( j in a ) { if (a[j] = \"Name\") {print j}}}' `\n\
  set mailpos = `head -1 \"$fl\" | awk '{split($0,a) ; for ( j in a ) { if (a[j] =\
  \ \"email\") {print j}}}' `\nforeach line (\"`cat $fl`\")\n  set line = \"$line:gas/\
  \ /_/\"\n  set argv = \"$line\"\n  set name = \"$argv[$namepos]\"\n  set name =\
  \ \"$name:gas/_/ /\"\n  set names = ($names[*] \"$name\")\n  set mail = \"$argv[$mailpos]\"\
  \n  set mails = ($mails[*] \"$mail\")\nend\n```\n\n---\n\n### 98: 创建一个脚本逐行读取文本文件直到文件末尾。不要使用\
  \ awk。\n\n**答案：**\n\n```bash\nset inputfile = textfile\nset total = `cat $inputfile\
  \ | wc -l`\nset count = 1\nwhile ($count <= $total)\n  if ($count == 1)\n    set\
  \ record = `head -n 1 $inputfile`\n  else\n    set record = `tail -n +$count $inputfile\
  \ | head -n 1`\n  endif\n  echo $record\n  @ count++\nend\n```\n\n\n\n退出状态是 shell\
  \ 脚本执行后返回的正数或零。如果退出状态为零，则意味着脚本执行成功。除零以外的任何数字都表示错误。对于每种错误，会返回不同的数字。\n\n### 104: 什么是子壳？如何创建它？\n\
  \n答案：\n\nshell 脚本中包含在括号内的较小子部分称为子壳。虽然子壳可以访问外部的变量，但在子壳内部它无法更改这些变量的值。\n\n例如，你在主 shell\
  \ 中有一个变量 `var1`，初始赋值为值 `5`。在子壳中，它被赋值为 `8`。在子壳内部，它的值为 `8`，但一旦离开子壳，它的值将仅为 `5`。\n\n\
  ### 105: 考虑以下消息：\n\n\"bash: scriptfile: Execute permission denied.\"\n\n你如何修复它（假设你是\
  \ scriptfile 的所有者）？\n\n答案：\n\n用户没有对 `scriptfile` 的执行权限。我们可以运行以下命令来为所有人授予执行权限：\n\n\
  ```\nchmod +x scriptfile\n```\n\n### 106: case 语句用于将变量的值与可能的匹配项列表进行比较。对还是错？\n\n\
  答案：\n\n对（TRUE）\n\n### 107: 你不记得 sort 命令的正确选项（switch）以便以反序排序某些条目。你可以做什么？\n\n答案：\n\
  \n打开 `sort` 命令的“man”页，运行命令：\n\n```bash\nman sort\n```\n\n然后搜索关键字 \"reverse”（使用 `/`\
  \ 开始搜索）。\n\n### 108: shell 脚本的第一行是：\n\n```bash\n#!/bin/bash\n```\n\nshell 是如何解释这一行的？\n\
  \n答案：\n\n用于启动脚本的 `exec` 系统调用会检查脚本的前两个字节是否包含特殊序列 `#!`，该序列在同一行中指定了用于执行此脚本时要使用的解释器可执行文件。\n\
  \n### 109: 你需要找到 /home 目录下所有在过去 10 天内未访问过的文件。你可以做什么？\n\n答案：\n\n运行以下命令：\n\n```bash\n\
  find /home -type f -atime +10\n```\n\n### 110: 你如何检查系统上是否有运行的 sshd 进程？\n\n答案：\n\n\
  我们可以通过运行命令来检查：\n\n```bash\nps - ef | grep sshd\n```\n\n或者\n\n```bash\npgrep sshd\n\
  ```\n\n### 111: 运行以下命令会发生什么？\n\n```bash\nmkdir -p /tmp/{my,your,his,her}dir/{contacts,files}\n\
  ```\n\na) 在 /tmp 下将创建 6 个新目录\nb) 在 /tmp 目录下将创建 8 个新目录\nc) 在 /tmp 目录下将创建 2 个新目录\n\
  d) 它不会创建新目录并显示错误消息\n\n答案：\n\n选项 b) 是正确的。将创建 8 个新目录。\n\n### 112: 下一行是 bsash 脚本中条件语句的开头：\n\
  \n```bash\nif [[ $1 = $var1 || = $var2 ]]\n```\n\n该语句至少有一个错误。请识别并修正它。\n\n答案：\n\n\
  测试条件中存在语法错误。在第二个表达式中，没有左侧部分。此外，最好在变量替换周围使用双引号，以确保在变量为空或未定义时不会产生语法错误。正确的语句是：\n\n\
  ```bash\nif [[ \"$1\" = \"$var1\" || \"$1\" = \"$var2 ]]\n```\n\n### 113: for 循环需要参数列表。该列表可以由以下产生：\n\
  \na) 命令替换：`for var in $(command)`\nb) 变量替换：`for var in $var`\nc) 命令行给出的参数：`for var\
  \ in $*`\nd) 测试条件：`for var in \"$var\" -eq`\ne) 以上所有\n\n答案：\n\n选项 a)、b) 以及 c) 将得到预期的结果。\n\
  \n### 114: 给定以下嵌套循环，如果满足测试，你会使用什么命令来代替 command-to-process-file，以便 shell 执行最后一个命令：\n\
  \n```bash\nwhile true\ndo\n    echo \"Please enter a filename:\"\n    read ans\n\
  \    if [[ -f \"$ans\" ]]\n    then\n        break\n    fi\ndone\ncat \"$ans\"\n\
  ```\n\n### 115: 如果以下命令位于用户的 .bash_profile 中会发生什么？\n\n```bash\ntrap '' INT\n```\n\
  \n答案：\n\n用户无法中断从该 shell 启动的任何命令。`trap` 命令将捕获 `INT` 信号，改变 shell 的行为以忽略该。\n\n### 116:\
  \ 变量的值应该与可能的值（和/或模式）进行比较，并对每个值运行不同的命令。你倾向于使用哪种结构来进行这些检查？\n\n答案：\n\n```bash\ncase\
  \ \"$var\" in\n    pattern_1) ;;\n    pattern_2) ;;\nesac\n```\n\n### 117: 以下命令的预期输出是什么？\n\
  \n```bash\necho {a..z}\n```\n\n答案：\n\n它回显所有小写字母，即 a b c d e f g h j k l m n o p\
  \ q r s t u v w x y z（注：原文漏掉了 i，此处按逻辑补全）。\n\n### 118: 如何在后台运行作业？\n\n答案：\n\n通过在命令末尾添加\
  \ `&` 来在后台运行作业。\n\n### 119: cd - 命令执行了什么操作？\n\n答案：\n\n`cd -` 切换到上一个目录。\n\n### 120:\
  \ shell 中字符 ~ 的特殊含义含义？\n\n答案：\n\n`~` 对应于主目录 `$HOME`：\na) `~` 对应于主目录\nb) `~1` 对应于用户\n\
  c) `~+` 对应当前目录 `$PWD`\nd) `~-` 对应上一个目录\ne) `==` 是正则表达式匹配\n\n### 121: 变量 variable\
  \ 和 $variable 之间的区别是什么？\n\n答案：\n\n`variable` 是变量名，而 `$variable` 是它的值。\n\n### 122:\
  \ 用什么命令定义本地变量？\n\n答案：\n\n使用 `local` 命令定义。\n\n### 123: 如何找到系统中安装的 bash shell 版本？\n\
  \n答案：\n\n使用以下命令找到 bash 版本：\n\n```bash\necho $BASH_VERSION\n```\n\n更多详情请使用数组 `BASHINFO`。\n\
  \n### 124: 内置变量 EDITOR 作用是什么？\n\n答案：\n\n`EDITOR` 调用默认编辑器，通常是 `vi` 或 `emacs`。\n\n\
  ### 125: 内置变量 PATH 的目的是？\n\n答案：\n\n定义可执行文件的路径列表，`PATH` 将被 shell 用于查找这些文件。\n\n###\
  \ 126: Bash 中有任何方法声明整数变量吗？\n\n答案：\n\n是的，我们可以使用 `typeset -i` 命令（或相应的 `declare`）声明整数变量。\n\
  \n### 127: shell 如何解释 \"echo ??a\"？\n\n答案：\n\n在启动 `echo` 之前，shell 将替换两个 `??`。对于\
  \ shell 来说，`?` 代表文件名中的任意一个字符。但文件名中的点不能被任何字符替换，应字面给出。此命令将输出当前目录下由三个字符组成的文件和子目录，但不包括点开头的。\n\
  \n***\n\n## Bash - 中级\n\n### 128: 编写一个简单的脚本，检查执行用户的 UID，如果用户不是 root，则显示消息并退出。\n\n\
  答案：\n\n```bash\n#!/bin/bash\nif (( $(id -u) = 0 ))\nthen\n    echo \"Hello root\"\
  \nelse\n    echo \"You must login as root to execute this script!\"\n    exit 10\n\
  fi\nexit\n```\n\n### 129: 构建一个 bash shell 模式来匹配以一个一个数字结尾的任意字母数字字符串。\n\n答案：\n\n```bash\n\
  *([a-zA-Z0-9])[a-za-Z][0-9]\n```\n\n### 130: 编写一个命令列出完全匹配 Name#_## 模式的文件。\n\n答案：\n\
  \n列出完全匹配 `Name#_##` 模式的文件的命令是：\n\n```bash\necho Name[0-9]_[0-9][0-9]\n```\n\n###\
  \ 131: 编写一个命令获取所有以 . 开头的目录项（文件和子目录），排除 . 和 ..\n\n答案：\n\n命令是：\n```bash\nls -d .*\n\
  ```\n\n\n\n\n```bash\necho .[!.]*\n```\n\n### 132: 你必须检查系统上是否存在某个文件，以及你是否对该文件具有读取权限。你会使用哪种语法？\n\
  \n**答案：**\n\n我们使用的语法是：\n\n```bash\nif [[ -f filename && -r filename ]]\nthen\n \
  \ echo \"filename exists and it's readable\"\nelse\n  echo \"filename does not exist\
  \ or is not readable\"\nfi\n```\n\n### 133: 考虑以下片段。\n\n```bash\nmail user << end\n\
  \nHello,\n\nPlease 检查该程序在 $(hostname) 中记录的最后条目：\n\n$(tail -10 /var/opt/application/logfile)\n\
  \nEOF\nend\n```\n\n发送给用户的消息是什么？\n\n**答案：**\n\n发送给用户的消息是：\n\nHello,\n\n请检查该程序在系统\
  \ `hostname` 中记录的最后条目：\n\n（来自 `/var/opt/application/logfile` 的最后 10 行）\n\nEOF\n\n\
  ### 134: 运行此循环时会发生什么？\n\n```bash\nwhile read line\ndo\n  echo $line\ndone <datafile\n\
  ```\n\n**答案：**\n\n该代码逐行读取 `datafile` 的内容，并处理（此处仅显示）每一行。它会在到达文件末尾时结束。\n\n### 135:\
  \ 运行此循环时会发生什么？\n\n```bash\nwhile read line <datafile\ndo\n  echo $line\ndone\n```\n\
  \n**答案：**\n\n这是一个无限循环。每次迭代都会打开 `datafile`，只读取第一行，对其进行处理（仅显示），并不断重复。\n\n### 136:\
  \ 你应该从 `passwd` 文件中找到定义用户账户 `dbuser1` 的条目。\n\n```bash\ngrep 'dbuser1' /etc/passwd\n\
  ```\n\n上述命令是：\na) 正确的，\nb) 正确但不精确或充分，或者\nc) 完全不足，\n\n为什么？\n\n**答案：**\n\n它是正确的，但并不精确或充分。该命令将显示所有在任何位置包含字符串\
  \ `dbuser1` 的行，而不仅仅是在行首以及字段分隔符（`:`）之前。\n\n将仅返回以 `dbuser1` 开头的行的命令如下：\n\n```bash\n\
  grep '^dbuser1:' /etc/passwd\n```\n\n### 137: 使用正确的语法显示名为 `datafile` 的文件中以字符串 `ing.`（字面上的点）结尾的所有行。\n\
  \n**答案：**\n\n```bash\ngrep 'ing\\.$' datafile\n```\n\n### 138: 一个应用程序（或服务）的配置文件包含许多被注释掉的行，只有两三行是有用的。你如何只显示基本的（未注释）数据？\n\
  \n**答案：**\n\n```bash\ngrep '^[^#]' conf_file\n```\n或者\n```bash\ngrep -v '^#' conf_file\n\
  ```\n\n### 139: shell 如何将变量传递给 awk？\n\n**答案：**\n\nshell 通过 `awk` 的 `-v` 选项以及 `awk`\
  \ 语句内部保留字 `ENVIRON` 将变量传递给 `awk`。例如：\n\n```bash\nvar1=\"Some data\"\nawk -v Data=\"\
  $var1\" 'awk statement ...'\n```\n\n使用已导出变量的 `awk` 语法：\n\n```bash\nENVIRON[\"var\"\
  ]\n```\n\n### 140: 正确或错误：当向 `awk` 提供输入时，`awk` 将处理每一个记录。\n\n**答案：**\n\n正确 (TRUE)\n\
