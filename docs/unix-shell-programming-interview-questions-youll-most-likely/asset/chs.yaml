  let \"val = a<6?2:3\"\necho $val\n```\n\n答案：\n\n1（来自第一个 `echo`）\n\n3（来自第二个 `echo`）\n\
  \n## 166: 目录 `/mydir` 的权限为 rw-r---- 且你是该目录的所有者。你可以显示 `/mydir` 的内容吗？你可以切换到 `/mydir`\
  \ 吗？你可以在 `/mydir` 下创建一个新文件吗？你可以读取 `/mydir` 中包含的文件内容吗？\n\n答案：\n\n如果没有执行权限，你可以将当前工作目录切换到该目录，但不能以任何方式使用末尾的\
  \ `/`（例如 `/mydir/`）。因此，你只能执行 `ls` 命令显示该目录的内容，但不能执行 `ls -l`，因此无法获取该目录的详细列表。你无法执行类似\
  \ `cat /mydir/file` 的命令，无法访问 `/mydir` 下的任何文件，无论权限如何，因为 `/mydir/` 语法是不允许的。\n\n##\
  \ 167: 声明函数的两种有效语法是什么？\n\n答案：\n\na)\n```bash\nfunction function_name {\n  commands\n\
  }\n```\n\nb)\n```bash\nfunction_name() {\n  commands\n}\n```\n\n## 168: 修正以下函数的声明。\n\
