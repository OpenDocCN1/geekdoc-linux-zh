  \n## 162: 命令替换的两种形式 `$(cmd)` 和 ``` `cmd` ``` 之间有什么区别？\n\n答案：\n\n两种命令替换形式之间的区别在于：\n\
  \na) 较新的形式 `$(cmd)` 允许嵌套，例如：\n\n`count=$(wc -w $(ls -l | awk '{print $9}'))`\n\n\
  b) 两种形式对双反斜杠的处理方式不同：\n\n`echo `echo \\\\` ` ` 将显示一个空行，但\n\n`echo $(echo \\\\)` 将显示一个\
  \ `\\`。\n\n## 163: 描述“与”列表的执行机制。\n\n答案：\n\n“与”列表是一种链式命令的方法。语法为：\n\n`command 1 &&\
  \ command 2 && ... command-n`\n\n每个命令都会按顺序执行，前提是上一个命令的退出值为 TRUE。在遇到第一个 FALSE 返回值时，链将终止，剩余命令将不会执行。\n\
  \n## 164: Bash shell（版本 4.2）允许表示和显示外语字母字符。如何做到？请给出一个数学符号 PI 的示例。\n\n答案：\n\nBash\
  \ 支持 Unicode 转义字符 `\\u` 和 `\\U`。命令：\n\n`echo -e '\\u220F'`\n\n将显示 PI (π)。\n\n##\
