- "# 最可能遇到的 UNIX Shell 编程面试题：工作面试问题系列\n\n*****\n\n# UNIX Shell 编程\n\n## 面试题\n回顾这些典型的面试题，并思考你将如何回答。阅读列出的答案；你将找到最佳答案以及策略和建议。\n\
  \n*****\n\n## C Shell - 初级 (#chapter0000.html)\n\n### 1: 在首次通过名称或别名运行你的新脚本之前，你必须做什么？\n\
  \n**答案：**\n你必须赋予它可执行权限，即执行命令：\n```\nchmod +x scriptname\n```\n\n### 2: 用户的 `.login`\
  \ 脚本中包含以下命令：\n```bash\nalias whois 'grep ^ /etc/passwd'\n```\n当用户执行以下命令时，输出是什么？\n\
  ```bash\nwho is guru\n```\n**答案：**\n如果存在一个名为 \"guru\" 的定义用户账户，或者 `/etc/passwd` 文件中其他地方包含字符串\
  \ guru，则输出将是包含字符串 `\"guru\"` 的条目；否则，输出将是一个空行。\n\n### 3: 如果条件 `If (-r filename)`\
  \ 失败（返回假），可能的原因有哪些？\n\n**答案：**\n可能的原因有：\na) 进程所有者不可读取 `filename`\nb) `filename`\
  \ 不存在\n\n### 4: 下述两个语句之间的区别是什么？\n```bash\nset var = 10\nset var=10\n```\n**答案：**\n\
  在 `set var = 10` 中，等号两边的空格会导致 Shell 设置两个变量 `var` 和 `10`。在 `set var=10` 中，它正确地将值\
  \ `10` 赋值给变量 `var`。\n\n### 5: 给定以下代码，`var` 的值是多少？\n```bash\nset var=10\nset var=20\n\
  echo $var\n```\n**答案：**\n输出将是 `20`，因为第二个 `set` 命令覆盖了 `var` 的原有值。\n\n### 6: 以下命令的输出是什么？\n\
  ```bash\nset list=(apple banana cherry)\necho $#list\n```\n**答案：**\n输出将是 `3`，因为\
  \ `$#list` 返回数组 `list` 中的元素个数。\n\n### 7: `rehash` 命令的作用是什么？\n\n**答案：**\n`rehash`\
  \ 命令清除 shell 内部的可执行命令和函数的哈希表，强制其重新在 `PATH` 中搜索这些命令。\n\n### 8: 如何检查一个文件是否为目录？\n\n\
  **答案：**\n你可以在 `if` 语句中使用 `-d` 运算符：\n```bash\nif (-d dirname) then\n    echo \"It\
  \ is a directory\"\nendif\n```\n\n### 9: 如何向数组添加一个元素？\n\n**答案：**\n你可以使用 `+=` 运算符：\n\
  ```bash\nset list += (new_element)\n```\n\n### 10: `$?` 变量的用途是什么？\n\n**答案：**\n`$?`\
  \ 变量存储最近一次执行的命令的退出状态。\n\n### 11: 如何遍历数组中的元素？\n\n**答案：**\n你可以使用 `foreach` 循环：\n```bash\n\
  foreach item in ($list)\n    echo $item\nend\n```\n\n\n\n\n第一个 `echo` 将显示 `c1` `c4`\
  \ `c2` `c5` `c1`，而第二个只显示 `c1`。\n\n## 21: 无论参数数量多少，显示脚本的第一个和最后一个参数，且不使用循环。\n\n答案：\n\
  \n```bash\nmy_var3 = $#argv\nechomy_var1: $argv[$1]\nechomy_last_var: $argv[$my_var3]\n\
  ```\n\n## 22: 你将如何在 csh 中设置“搜索路径”（search path）？\n\n答案：\n\n`csv` 中的搜索路径可以如下所示方式设置：\n\
  \na) `setenv PATH\"/myfolder1 /bin: /myfolder2 /myfile3\"`\n\nb) 使用列表\n\n```bash\n\
  set path = =( /myfolder1 /bin /myfolder2 /myfile3 )\n```\n\n## 23: 在 /home/user1/myarch.tar\
  \ 创建一个 tar 归包，包含所有以 .c, .h, .l, .y, .o 和 .cc 结尾的文件，以及来自 ~/dir1 和 ~/dir2 两个目录的 Makefile。\n\
  \n答案：\n\n```bash\ntar cvf /home/user1/myarch.tar ~/{dir1,dir2}/{Makefile,*.{c,h,l,o,y,cc}}\n\
  ```\n\n或者\n\n```bash\ntar cvf /home/user1/myarch.tar ~/dir1/Makefile ~/dir1/*.[chloy]\
  \ ~/dir1/*.cc ~/dir2/Makefile ~/dir2/*.[chloy] ~/dir2/*.cc\n```\n\n## 24: 你的脚本必须带有好两个参数执行，否则将被终止。编写代码来实现这些检查。\n\
  \n答案：\n\n```bash\nif ($#argv <> 2) then\n  echo \"Usage: $0 arg1 arg2\"\n  echo\
  \ \"你必须提供好两个参数\"\n  exit 20\nendif\n```\n\n## 25: 编写一个管道，从文本文件的第 j 行读取到第 k 行，不使用\
  \ awk。\n\n答案：\n\n```bash\nset total = `cat textfile | wc -l`\nset j = 10\nset k\
  \ = 18\n@ count = $k - $j\nhead -$k textfile | tail -$count\n```\n\n*****\n\n##\
  \ C Shell – 中间级\n\n## 26: 解释以下命令：\n\n```bash\nset names = (John Kathrin Chris Jacob)\n\
  set names = ($names[1-2] Angela $names[3-])\n```\n\n答案：\n\n第一条命令创建一个名为 `names` 的数组，并将四个名字作为元素。\n\
  \n第二条命令在 `Kathrin` 和 `Chris` 之间插入名字 `Angela`。\n\n## 27: 如何将光标移动到屏幕上指定的坐标？(tcsh)\n\
  \n答案：\n\n我们可以使用以下代码将光标移动到屏幕上指定的坐标：`echocm column row`\n\n## 28: 此循环的结果是什么？\n\n```bash\n\
  foreach i ([A-Z]*)\n  ? mv $i $i.csh\nend\n```\n\n答案：\n\n该循环重命名所有以大写字母开头的文件，添加“扩展名”\
  \ `.csh`。\n\n## 29: 假设脚本某处有一个标签 cleanup，解释命令 `onintr cleanup`。\n\n答案：\n\n如果脚本捕获到中断信号，将跳转到标签\
  \ `cleanup`。\n\n## 30: 是否有方法可以在预定义的次数内重复命令，而不使用计数器控制的循环？\n\n答案：\n\n我们可以使用 `repeat`\
  \ 命令在预定义的次数内重复命令，而不使用计数器控制的循环，例如：\n\n```bash\nrepeat 5 ls >> listings\n```\n\n##\
  \ 31: csh 和 tcsh 都支持文件名和命令补全功能。但该功能在 csh 中的工作方式与 tcsh 不同。请列出差异。\n\n答案：\n\n当你使用 `tcsh`\
  \ 时，按下 `Tab` 键时命令和文件名会自动补全。\n\n当你使用 `csh` 时，必须设置 `filec` 变量才能进行单词补全。在 `csh` 中，必须按下\
  \ `Esc` 键进行单词补全。\n\n## 32: 按每个 shell 使用的顺序列出 csh 和 tcsh 的特殊登录文件。\n\n答案：\n\n如果命令是从系统文件（`/etc/csh.cshrc`\
  \ & `/etc/csh.login`）执行的，将启动登录 shell。它将运行用户目录下文件中给出的命令。\n\na) `~/.cshrc` 或 `~/.tcshrc`：在\
  \ shell 启动期间，每个 shell 实例都会执行。如果存在 `~/.cshrc`，`tcsh` 使用此文件，否则执行 `~/.tcshrc`。\n\n\
  b) `~/.login`：登录时由登录 shell 在 `.cshrc` 之后执行。\n\nc) `~/.cshdirs`：在 `.login` (`tcsh`)\
  \ 之后由登录 shell 执行。\n\n## 33: 以下行的作用是什么？解释其差异。\n\n```bash\nls > filename\nls >! Filename\n\
  ```\n\n答案：\n\n在这两种形式中，`ls` 命令的输出都被重定向到 `filename`。如果 `filename` 不存在，将创建它，否则会被截断。当使用第一形式时，如果\
  \ shell 参数 `noclobber` 被设置且 `filename` 是已存在的文件，会导致错误。第二种形式中的 `!` 用于抑制该错误。\n\n##\
  \ 34: 假设脚本中某处有一个 cleanup 标签，解释命令 `onintr cleanup`。 (注：此处原文似乎与 29 题重复，已根据语境翻译)\n\n\
  答案：\n\n如果脚本捕获到中断信号，将跳转到标签 `cleanup`。\n\n## 35: 是否有方法可以在预定义的次数内重复命令，而不使用计数器控制的循环？\
