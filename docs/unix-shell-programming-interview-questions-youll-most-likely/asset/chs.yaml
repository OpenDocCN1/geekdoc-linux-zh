  \nAnswer：该脚本检查命令行是否有一个参数。它启动到服务器的 ftp 会话，并使用“这里”文档向传递传递命令：用户名和密码（密码从文件中读取）。在会话期间，它更改目录并将文件传输到服务器。\n\
