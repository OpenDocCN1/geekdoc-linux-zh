  set upper = 1289.56\nwhile ( `echo \"if ( $curvalue <= $upper) 1\" | bc` )\n  <statements\
  \ when $curvalue <= 1289.56>\nEnd\n```\n\n## 80: 如果 C-shell 中没有简单的文件读取功能，你可以用什么来临时解决？\n\
  \n答案：\n\n使用 `awk` 和 shell 循环的组合是一种通宜办法，因为 C-shell 中没有简单的文件读取功能。\n\n## 81: 提取文本文件的第\
