  \ i++\nend\n```\n\nAnswer:\n\n它创建了一个数组来存储每个已建立的网络连接所使用的端口号，以及第二个存储相应远程 IP 地址的数组。然后，使用\
  \ `foreach` 循环将端口号“解析”为服务名称，并为每个连接以“Service_name connection established from Remote_IP_Address”的形式显示描述消息。\n\
  \n## 71: 列出可用方法（带示例）来替换字符串中任意出现的子字符串为另一个子字符串。\n\nAnswer:\n\n在字符串中将任意出现的子字符串替换为另一个可用方法有：\n\
  \na) 使用 `sed`:\n```csh\nset sedstring = `echo $text | sed 's/search_string/replacement/g'`\n\
  ```\n\nb) 使用 `awk`:\n```csh\nset awkstring = `echo $string | awk -v s1=\"$search\"\
  \ -v s2=\"$substitute\" '{gsub(s1,s2); print $0}'`\n```\n\nc) 使用编辑修符：（用法有限）\n```csh\n\
  set text = \"now is the time for all good men\"\necho $text:gs/o/O/\n```\n\n## 72:\
  \ 编写一个片段根据扩展名对目录下的文件进行分类（简单起见，仅处理 .c, .o, .txt 和 .png 文件）。为每个扩展创建一个数组，包含文件名。最后，显示每个扩展的文件数量。\n\
  \nAnswer:\n\n```csh\n#!/bin/csh\n\nset dir = /home/~ # 目录路径\n\nforeach fl ($dir/*)\n\
  \  switch ($fl)\n    case *.c:\n      set cfiles = ($cfiles[*] $fl)\n      breaksw\n\
  \    case *.o:\n      set ofiles = (ofiles[*] $fl)\n      breaksw\n    case *.txt:\n\
  \      set txtfiles = (txtfiles[*] $fl)\n      breaksw\n    case *.png:\n      set\
  \ pngfiles = (pngfiles[*] $fl)\n      breaksw\n    default:\n      breaksw\n  endsw\n\
  end\n\necho \"There are $#cfiles .c files, $#ofiles.o files, $#txtfiles txt files\
  \ and $#pngfiles .png files in directory $dir\"\n```\n\n## 73: 编写一个脚本向用户显示一个选择菜单。菜单应该不断显示，直到用户选择特定的“exit”选项。脚本应向用户显示选择菜单。菜单应该不断显示，直到用户选择特定的“exit”选项。\n\
  \nAnswer:\n\n脚本应向用户显示一个选择菜单。菜单应该不断显示，直到用户选择特定的“exit”...\n\n```csh\nc\n/csh\n\nset\
  \ ans = 0\nwhile ($ans != 4 )\necho \" MENU\"\necho \"==================\"\necho\
  \ \"1 Rename a file\"\necho \"2 View contents\"\necho \"3 Examine file\"\necho \"\
  4 Exit\"\necho \"Make your -> \"\nset ans = =\n\nswitch ($ans)\ncase 1:\necho \"\
  Enter a filename ->\"\nset fl = $<\nif ( ! -f $fl ) then\necho \"File must exist...\"\
  \nendif\nmv $fl\nbreaksw\ncase 2:\necho \"Enter a filename ->\"\nset fl = $<\nif\
  \ ( ! -f $fl ) then\necho \"File must exist...\"\nendif\ncat $fl\nbreaksw\ncase\
  \ 3:\necho \"Enter a filename ->\"\nset fl = $<\nif ( ! -f $fl ) then\necho \"File\
  \ must exist...\"\nendif\nvi $fl\nbreaksw\ncase 4:\nexit\nbreaksw\ndefault:\necho\
  \ \"Invalid choice\"\nbreaksw\nend\n```\n\n## 74: 编写一个脚本向用户显示一个选择菜单。菜单应该不断显示，直到用户选择特定的“exit”选项。\n\
  \nAnswer:\n\n```csh\n#!//csh\n\nset thres = 40\nset total = `grep ^alias | wc -l`\n\
  if ($ total > $thres ) then\nmail -s \"Too many aliases\" $USER << EOF\nYour aliases\
