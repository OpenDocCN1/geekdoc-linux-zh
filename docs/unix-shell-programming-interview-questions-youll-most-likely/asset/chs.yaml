  \ \":\" 被替换为 \"==\"。\n\n## 183: 解释以下管道命令。\n\n`grep bash file1 | diff file2 -`\n\n\
  答案：\n\n\n\n\n连字符 (`-`) 用于将第二个命令的标准输出（stdout）传递给其他命令。在这里，管道将 `file1` 中包含字符串 `\"bash\"\
  ` 的行与 `file2` 的全部内容进行比较。\n\n### 184: 如何声明一个关联数组？\n\n答案：\n\n```bash\ndeclare -A assoc\n\
  ```\n\n### 185: 哪种语法返回（展开为）数组 `ARRAY` 中的索引？\n\n答案：\n\n```bash\n${!ARRAY[@]}\n```\n\
  \n或者\n\n```bash\n${!ARRAY[*]}\n```\n\n### 186: 内置命令 `mapfile` 有什么用？\n\n答案：\n\n内置命令\
  \ `mapfile` 用于将标准输入（以及通过重定向来自文件）的行分配给由参数定义的数组，每行都是一个独立的元素。如果命令行中没有给出数组，则默认数组名称为\
  \ `MAPFILE`。目标数组必须是一个整数索引数组（而不是关联数组）。\n\n### 187: 在不使用 `if` 的情况下，编写以下 `if` 结构的等效但更短的形式。\n\
  \n```bash\nif [[ $# -eq 0 ]]\nthen\ndirpath=$(pwd)\nelse\ndirpath=$@\nfi\n```\n\n\
  答案：\n\n```bash\n[[ $# -eq 0 ]] && dirpath=$(pwd) || dirpath=$@\n```\n\n### 188:\
  \ 给出以下片段的输出并解释它。\n\n```bash\na='$val1'\nval1='$val2'\nval2=newval\necho $a\neval\
  \ echo $a\neval eval echo $a\n```\n\n答案：\n\na) `$val1` (第一个 `echo`：单引号不允许任何替换)\n\
  \nb) `$val2` (第二个 `echo` - `eval`：`eval` 的调用强制对其参数进行重新评估，因此参数 `$a` 被替换为 `a` 的值，即\
  \ `$val1`；然后 `$val1` 被替换为 `val1` 的值，即 `$val2`)\n\nc) `newval` (最后一行：第二次 `eval` 调用导致对其参数再次进行重新评估，该参数为\
  \ `$val2`，因此将其替换为 `val2` 的值 `newval`。）\n\n### 189: 将位置参数设置为字符串，然后取消位置参数，再次将它们设置回原始值。\n\
