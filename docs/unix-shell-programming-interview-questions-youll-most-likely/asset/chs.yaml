  \ `limt` 的值变为 `92.1`。显示消息：\n\n你的系统上限为 92.10%\n\n答案：\n\n```bash\nif [ $limt == 92.10\
  \ ]\nthen\n  printf \"Upper limit 92.10%% in $HOSTNAME\"\nfi\n```\n\n### 44: 假设一个脚本包含以下代码段。\n\
  \n```bash\nset fl = /home/dbuser5/reports/fs_report1.txt\necho $fl:e\necho $fl:r\n\
