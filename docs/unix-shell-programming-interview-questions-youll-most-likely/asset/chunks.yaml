    # 204: 解释这段代码段。


    ```bash

    coproc { cat datafile; sleep 2; }


    while read -u ${COPROC[0]} record

    do

    echo "$record" | cut -c2-

    done


    kill $COPROC_PID

    ```


    **答案：**


    `coproc` 内置命令允许两个并行进程进行通信和交互。这个协进程与 `while read` 循环交互。`${COPROC[0]}` 是该协进程的文件描述符。因此，`while-read`
    循环按行读取文件 `datafile`，并从输出中删除每行的第一个字符。在最后，当不再需要该协进程时，它会杀死它的 PID（`$COPROC_PID`）。


    # 205: 下述片段未能设置 3 个变量（`my_var1`, `my_var2`, `my_var3`）。解释原因。


    ```bash

    my_var1=31

    my_var2=7

    my_var3=17


    coproc echo " three1 sevenoneseven"


    while read -u ${COPROC[0]} my_var1 my_var2 my_var3;

    do

    echo "Inside my while-read loop1: ";

    echo "p = $p"; echo "q = $q"; echo "r = $r"

    echo "coprocmy_file descriptor: ${COPROC[0]}"

    done


    echo "Outside my while-read loop1: ";

    echo "p = $p"; echo "q = $q"; echo "r = $r"

    echo "coprocmy_file descriptor1: ${COPROC[0]}"

    ```


    **答案：**


    循环内部一切都是正常的。输出将是：


    ```

    Inside my_while-read loop1:

    p = three

    q = seven

    r = oneseven

    coprocmy_ file descriptor1:#some descriptor

    ```


    由于这个循环在子 shell（subshell）中运行，值不会持续。因此，三个 `echo` 命令的输出将是：


    ```

    p=

    q=

    r=

    ```

    协进程仍在运行，但值丢失了。


    # 206: 编写一个脚本识别并处理任意顺序的命令选项 `-l`（后跟一个值）和 `-m`。无效选项将导致脚本带错误终止并显示无效选项。


    **答案：**


    ```bash

    #!/bin/bash


    # Usage: script [-l -m]


    while getopts :l:m flag

    do

    case $flag in

    l) echo "Option has $OPTAGR as its value" ;;

    m) echo "Option -m received";;

    *)echo "Invalid option $OPTARG";;

    done

    ```


