    \ 命令使用的典型方式重新排序），将标志位（flags）及其可选参数放在任何非标志参数之前，并在末尾添加单个 `\"--\"` 参数以表示没有更多标志位需要处理。\n\
    \n在出现 `-h` 选项的情况下，脚本将显示“用法”（usage）信息并终止。在出现 `-o` 选项的情况下，脚本会将 `OUTPUT_FILE` 变量设置为随后的参数。在出现\
    \ `-l` 选项的情况下，脚本会将 `DO_LONG` 变量设置为 `-l`。`while` 循环后的 `shift` 命令会移除末尾的 `--`。\n\n\
    如果没有使用任何选项，脚本将运行 `ls $*`（其中 `$*` 是剩余参数）；如果使用了 `-l` 选项，将运行 `ls -l $*` 命令；如果使用了\
    \ `-o` 文件，将运行 `ls -l $*` 命令并将输出重定向到 `OUTPUT_FILE` 文件。\n\n### 94: 编写一个脚本，计算存储在数组中的一组浮点数的最小值、最大值和平均值。\n\
    \n**答案：**\n\n```bash\nset array = (5, 10, 2, 13, 0.2345)\n\nforeach num ($array[*])\n\
    \  echo $num >> nums_file\nend\n\nawk '{if(min==”\"){min=max=$1}; if($1>max) {max=$1};\
    \ if($1< min) {min=$1}; total+=$1; count+=1} END {print \"Average is: \"total/count,\
    \ \"Min is: \"min, \"Max is: \"max}’ nums_file\n```\n\n---\n\n### 95: 你有一个具有对称模式的数据文件（每条记录字段数相同），第一行包含字段标题。你想提取实际数据记录的第\
    \ 3 列（字段），即除去表头行（第一行）和任何注释行（假设它们以 `#` 或 `*` 开头）。请给出一个解决方案并简要解释。\n\n**答案：**\n\n\
    ```bash\nset cn = 3\nset ncols = `awk '{FNR == 1 {print NF}' input_file `\nif\
    \ ( $cn <= $ncols ) then\n  set col$cn = ` awk -v i=$cn '$0 !~ /^[#*]/ && FNR\
    \ != 1 { print $i }' input_file`\nelse\n  echo \"The column number must be in\
    \ the range 1 to $ncols\"\nendif\n```\n\n变量 `ncols` 包含每条记录的列总数。`if` 结构用于避免请求的列位置号大于总列数的情况。`col3`\
    \ 将是第三列值的数组。\n\n---\n\n### 96: 假设 `input_file` 是一个具有非对称模式的表格数据文件，即每条记录（行）可能有不同数量的字段，且前\
    \ 3 行描述了使用的模式。请解释以下代码段。\n\n```bash\nset cn = 3\nset ccounts = `awk '{FNR > 3 {print\
    \ NF}' input_file `\nset ccounts1 = ( $ccounts[*] )\nset ccounts2 = ( $ccounts[*]\
    \ )\nset mincn = $ccounts[1]\nwhile ( $ccounts1 > 0 )\n  if( $mincn > $ccounts1[1]\
    \ ) then\n    set mincn = $ccounts1[1]\n  endif\n  shift ccounts1\nend\nset maxcn\
    \ = $ccounts2[1]\nwhile ( $ccounts2 > 0 )\n  if ( $maxcn < $ccounts2[1] ) then\n\
    \    set maxcn = $ccounts2[1]\n  endif\n  shift ccounts2\nend\nif ( $cn <= $maxcn\
    \ ) then\n  set col$cn = ` awk -v i=$cn -v minc=$mincn 'FNR > 3 { (FN < minc )\
    \ ? print FN \"null\" : print $i }' input_file`\nelse\n  echo \"The column number\
    \ must be in the range $mincn to $maxcn\"\nendif\n```\n\n**答案：**\n该脚本从非对称数据文件中提取某一列的内容：\n\
    \n`cn` 变量持有要提取的列。`ccounts` 数组持有所有实际数据记录（`FNR > 3`）的字段数。数组 `ccount1` 和 `ccount2`\
    \ 是 `ccount` 数组的副本，用于从 `ccounts` 数组中计算最小值和最大值。我们使用这些临时数组是为了保留原始数组以便后续使用。第一个 `while`\
    \ 循环计算最小值，第二个循环计算最大值。每个循环迭代中的 `shift` 命令会丢弃数组的第一个元素。`if` 语句随后检查请求的列（字段）编号是否小于最大值，如果是，则\
    \ `awk` 命令在存在任何内容（`FN >= minc`）时打印该列的内容，否则打印字符串 `\"FNnull\"`。反之，如果请求的列编号大于最大值，脚本将显示一条消息。\n\
    \n---\n\n### 97: 假设你有一个数据文件，但其内部格式并不保持一致。你想从该文件中提取两列，但你不知道列的顺序，只知道它们的标题：Name 和\
    \ email。写一个实现这些任务的脚本。\n\n**答案：**\n\n```bash\n#!/bin/csh -f\nset fl = filename\n\
    set namepos = `head -1 \"$fl\" | awk '{split($0,a) ; for ( j in a ) { if (a[j]\
    \ = \"Name\") {print j}}}' `\nset mailpos = `head -1 \"$fl\" | awk '{split($0,a)\
    \ ; for ( j in a ) { if (a[j] = \"email\") {print j}}}' `\nforeach line (\"`cat\
    \ $fl`\")\n  set line = \"$line:gas/ /_/\"\n  set argv = \"$line\"\n  set name\
    \ = \"$argv[$namepos]\"\n  set name = \"$name:gas/_/ /\"\n  set names = ($names[*]\
    \ \"$name\")\n  set mail = \"$argv[$mailpos]\"\n  set mails = ($mails[*] \"$mail\"\
    )\nend\n```\n\n---\n\n### 98: 创建一个脚本逐行读取文本文件直到文件末尾。不要使用 awk。\n\n**答案：**\n\n```bash\n\
    set inputfile = textfile\nset total = `cat $inputfile | wc -l`\nset count = 1\n\
    while ($count <= $total)\n  if ($count == 1)\n    set record = `head -n 1 $inputfile`\n\
    \  else\n    set record = `tail -n +$count $inputfile | head -n 1`\n  endif\n\
    \  echo $record\n  @ count++\nend\n```\n"
