    Explain how you were able to prioritize tasks, or to delegate portions of an assignments
    to other team members, in order to deal with a tough deadline. It may be beneficial
    to specify why the deadline was tough – make sure it''s clear that it was not
    a result of procrastination on your part. Finally, explain how you were able to
    successfully meet the deadline, and what it took to get there in the end.


    ## 21: How do you stay organized when you have multiple projects on your plate?


    Answer:

    The interviewer will be looking to see that you can manage your time and work
    well – and being able to handle multiple projects at once, and still giving each
    the attention it deserves, is a great mark of a worker''s competence and efficiency.
    Go through a typical process of goal-setting and prioritizing, and explain the
    steps of these to the interviewer, so he or she can see how well you manage time.


    ## 22: How much time during your work day do you spend on “auto-pilot?”


    Answer:

    While you may wonder if the employer is looking to see how efficient you are with
    this question (for example, so good at your job that you don''t have to think
    about it), but in almost every case, the employer wants to see that you''re constantly
    thinking, analyzing, and processing what''s on in the workplace. Even if things
    are running smoothly, there''s usually opportunity to make things more efficient
    or to increase productivity. Stress your dedication to ongoing development and
    convey that being “auto-pilot” is not conducive to success.


    ## 23: How do you handle deadlines?


    Answer:

    The most important part of handling deadlines is to prioritize tasks and set goals
    for completion, as well as to delegate unnecessary work. Lead the interviewer
    through a general scenario and display your competency through your ability to
    organize and most importantly, remain calm.


    ## 24: Tell me about your personal-solving process.


    Answer:

    Your problem-solving process should include outlining the problem, coming up with
    possible ways to fix the problem, and setting a clear action plan that leads to
    resolution. Keep your answer brief and organized, and explain the steps in a concise
    manner that shows you are level-headed under stress.


    ## 25: What sort of things at work can make you stressed?


    Answer:

    As it''s best to stay away from negatives, keep this answer brief and simple.
    While answering that nothing makes you stressed will not be very believable to
    the interviewer, focus on a solution you generally employ to tackle stress, such
    as having weekly meetings or deadlines along the course of a project.


    ## 26: What do you look like you are stressed about something? How do you solve
    it?


    Answer:

    This is a trick question – your interviewer wants to hear that you don''t allow
    negative emotions to interfere with your productivity. As far as how you solve
    stress, it''s best to simply taking deep breaths to bring yourself back to the
    task at hand.


    ## 27: Can you multi-task?


    Answer:

    Some people can, and some people can''t. The most important part of multi-tasking
    is to keep a clear head at times about what needs to be done, and what priority
    each task falls under. Explain how you evaluate tasks and how you manage your
    time in order to ensure all are completed efficiently.


    ## 28: How many hours per week do you work?


    Answer:

    Many people get tricked by this question, thinking that answering more hours is
    better – however, this may cause employer to wonder why you have to work so many
    hours in order to get the work done. Give a fair estimate of hours that should
    take you to complete a job and explain that you are also willing to work extra
    whenever needed.


    ## 29: How many times per day do you check email?


    Answer:

    While employer wants to see that you are plugged into modern technology, it is
    also important that the number of times you check email per day is relatively
    low – perhaps two to three times per day (dependent on the specific field). Checking
    email is often a great distraction in the workplace, and while it is important
    to remain connected, correspondence can simply be handled together in the morning
    and afternoon.


    ## 30: How do you make decisions?


    Answer:

    This is a great opportunity for you to wow your interviewer with your decisiveness,
    confidence, and organizational skills. Make sure that you outline a process for
    decision-making, and the importance of weighing your options as well as trusting
    intuition. If you answer this question skillfully and with ease, your interviewer
    will trust in your capability as a worker.


    ## 31: What are the most difficult decisions for you to make?


    Answer:

    Explain your relationship to decision-making, and a general synopsis of the process
    you take in making choices. If there is a particular type of decision that you
    often struggle with, such as those that involve other people, make sure to explain
    why that type of decision is tough for you, and how you are currently engaged
    in improving your skills.


    ## 32: When making a tough decision, how do you gather information?


    Answer:

    If you''re making a tough choice, it''s best to gather information from as many
    sources as possible. Lead the interviewer through your process of taking information
    from people in different areas, starting first with advice from experts in your
    field, feedback from coworkers or other clients, and by looking analytically at
    your own past experiences.


    ## 33: Tell me about a decision you made that did not turn out well.


    Answer:

    Honesty and transparency are great values that your interviewer will appreciate
    – outline the choice you made, why you made it, the results of your poor decision
    – finally (and most importantly!) what you learned from the decision. Give the
    interviewer reason to trust that you wouldn''t make a decision like that again
    in the future.


    ## 34: Are you able to make decisions quickly?


    Answer:

    You may be able to make decisions quickly, but be sure to communicate your skill
    in making sound, thorough decisions as well. Discuss the importance of making
    a decision quickly and how you do so, as well as the necessity for each decision
    to first be well-informed.


    ## 35: What is the best way for a company to advertise?


    Answer:

    If you''re going for a position in any career other than marketing, this question
    is probably intended to demonstrate your ability to think critically and to provide
    reflective support for your answers. As such, the particular method you choose
    is not so important as why you''ve chosen it. For example, word of mouth advertising
    is important because customers will inherently trust the source, and social media
    advertising is important as it reaches new customers quickly and cheaply.


    ## 36: Is it better to gain a new customer or to keep an old one?


    Answer:

    In almost every case, it is better to keep an old customer, and it''s important
    that you are able to articulate why this is. First, new customers generally cost
    companies more than retaining old ones does, and new customers are more likely
    to switch to a different company. Additionally, keeping old customers is a great
    way to provide a stable backbone for the company, as well as to also gain new
    customers as they are likely to recommend your company to friends.


    ## 37: What is the best way to win clients from competitors?


