    128: Write a simple script that will check the numeric UID of the user executing
    it, will display a message and then will exit, if the user is not root.


    Answer:


    #!/bin/bash


    if (( $(id -u) = 0 ))


    then


    echo "Hello root"


    else


    echo "You must login as root to execute this script!"


    exit 10


    fi


    exit


    129: Construct a bash shell pattern to match any alphanumeric string ending with
    exactly one digit.


    Answer:


    *([a-zA-Z0-9])[a-za-Z][0-9]


    130: Write a command that lists the filenames that match the pattern Name#_##
    exactly.


    Answer:


    The command to list the filenames that match the pattern Name#_## exactly is:


    echo Name[0-9]_[0-9][0-9]


