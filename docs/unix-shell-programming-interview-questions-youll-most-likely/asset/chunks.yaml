    ~/dir2/*.[chloy] ~/dir2/*.cc


    24: Your script must be executed with exactly two arguments, otherwise would be
    terminated. Write a code to implement these checks.


    Answer:


    if ($#argv <> 2) then


    echo "Usage: $0 arg1 arg2"


    echo "You must give exactly two parameters"


    exit 20


    endif


    25: Write a pipeline that reads from the j-th line up to the k-th line of a text
    file, without using awk.


    Answer:


    set total = `cat textfile | wc -l`


