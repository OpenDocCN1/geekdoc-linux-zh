    ```

    The coprocess is still running, but the values are lost.


    # 206: Write a script that recognizes and handles only the command options `-l`
    (followed by a value) and `-m` in any order. An invalid option will cause the
    script to terminate with an error, displaying the invalid option.


    **Answer:**


    ```bash

    #!/bin/bash


    # Usage: script [-l -m]


    while getopts :l:m flag

    do

    case $flag in

    l) echo "Option has $OPTAGR as its value" ;;

    m) echo "Option -m received";;

    *)echo "Invalid option $OPTARG";;

    done

    ```


