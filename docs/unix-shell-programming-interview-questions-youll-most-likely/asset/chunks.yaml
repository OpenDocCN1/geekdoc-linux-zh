    end\n```\n\n答案：\n\n该循环重命名所有以大写字母开头的文件，添加“扩展名” `.csh`。\n\n## 29: 假设脚本某处有一个标签 cleanup，解释命令\
    \ `onintr cleanup`。\n\n答案：\n\n如果脚本捕获到中断信号，将跳转到标签 `cleanup`。\n\n## 30: 是否有方法可以在预定义的次数内重复命令，而不使用计数器控制的循环？\n\
    \n答案：\n\n我们可以使用 `repeat` 命令在预定义的次数内重复命令，而不使用计数器控制的循环，例如：\n\n```bash\nrepeat 5\
    \ ls >> listings\n```\n\n## 31: csh 和 tcsh 都支持文件名和命令补全功能。但该功能在 csh 中的工作方式与 tcsh\
    \ 不同。请列出差异。\n\n答案：\n\n当你使用 `tcsh` 时，按下 `Tab` 键时命令和文件名会自动补全。\n\n当你使用 `csh` 时，必须设置\
    \ `filec` 变量才能进行单词补全。在 `csh` 中，必须按下 `Esc` 键进行单词补全。\n\n## 32: 按每个 shell 使用的顺序列出\
    \ csh 和 tcsh 的特殊登录文件。\n\n答案：\n\n如果命令是从系统文件（`/etc/csh.cshrc` & `/etc/csh.login`）执行的，将启动登录\
    \ shell。它将运行用户目录下文件中给出的命令。\n\na) `~/.cshrc` 或 `~/.tcshrc`：在 shell 启动期间，每个 shell\
    \ 实例都会执行。如果存在 `~/.cshrc`，`tcsh` 使用此文件，否则执行 `~/.tcshrc`。\n\nb) `~/.login`：登录时由登录\
    \ shell 在 `.cshrc` 之后执行。\n\nc) `~/.cshdirs`：在 `.login` (`tcsh`) 之后由登录 shell 执行。\n\
    \n## 33: 以下行的作用是什么？解释其差异。\n\n```bash\nls > filename\nls >! Filename\n```\n\n答案：\n\
    \n在这两种形式中，`ls` 命令的输出都被重定向到 `filename`。如果 `filename` 不存在，将创建它，否则会被截断。当使用第一形式时，如果\
    \ shell 参数 `noclobber` 被设置且 `filename` 是已存在的文件，会导致错误。第二种形式中的 `!` 用于抑制该错误。\n\n\
    ## 34: 假设脚本中某处有一个标签 cleanup，解释命令 `onintr cleanup`。 (注：此处原文内容为重复)\n\n## 35: 你的脚本必须带有好两个参数执行，否则将被终止。编写代码来实现这些检查。\
    \ (注：此处原文内容为重复)\n\n## 36 (此处原文内容为 331 题重复): csh 和 tcsh 都支持文件名和命令补全功能。但该功能在 csh\
    \ 中的工作方式与 tcsh 不同。请列出差异。\n\n*(注：由于提供的待翻译文本存在大量重复，上述翻译已按原文顺序逐行处理。)*\n"
- fmt: "\n### 43: Assume that in a script the value of a variable `limt` becomes equal\
    \ to `92.1`. Display the message:\n\nUpper limit 92.10% in yoursystem\n\nAnswer:\n\
    \n```bash\nif [ $limt == 92.10 ]\nthen\n  printf \"Upper limit 92.10%% in $HOSTNAME\"\
    \nfi\n```\n\n### 44: Suppose a script contains the following snippet.\n\n```bash\n\
    set fl = /home/dbuser5/reports/fs_report1.txt\necho $fl:e\necho $fl:r\necho $fl:t\n\
    echo $fl:h\n```\n\nWhat do you expect to be displayed?\n\nAnswer:\n\ntxt\nfs_report1\n\
    fs_report1.txt\n/home/dbuser5/reports\n\n### 45: Create a script that converts\
    \ the filenames from current directory to lower case letters.\n\nAnswer:\n\n```csh\n\
    #!/bin/csh -f\nforeach my_old_file1 (`ls`)\n  set my_new_file1 = `echo $my_old_file1\
    \ | tr '[A-Z]' '[a-z]'`\n  if (\"$my_new_file1\" == \"$my_old_file1\") then\n\
    \    continue\n  endif\n  mv $my_old_file1 $my_new_file1\nend\n```\n\n### 46:\
    \ Name some basic differences between csh and tcsh.\n\nAnswer:\n\n`tcsh` includes\
    \ a command-line editor, file name and command completion features, and enhanced\
    \ job control, in comparison with the Berkeley `csh`.\n\n### 47: Compare the tcsh\
    \ shell variables `correct` and `autocorrect`.\n\nAnswer:\n\n`autocorrect` can\
    \ be set to correct the word to be completed before any completion attempt. `correct`\
    \ can be set to `'cmd'` to correct command names or to `'all'` to correct the\
    \ entire line, each time return is hit.\n\n### 48: What is the purpose of the\
    \ special alias shell?\n\nAnswer:\n\nThe shell special alias can be set to specify\
    \ an interpreter other than the shell itself.\n\n### 49: Which is the method to\
    \ bind the keys to the standard vi or emacs bindings?\n\nAnswer:\n\nShell's built-in\
    \ command is `bindkey`. Its `-e` option binds all keys to standard emacs bindings,\
    \ while `-v` option binds to standard vi bindings.\n\n### 50: Which is the purpose\
    \ of shell's variable `color`?\n\nAnswer:\n\nShell’s variable `color`, if set,\
    \ enables color display for the built in `ls -F` and it passes `--color=auto`\
    \ to `ls`.\n\n### 51: Set your prompt to display `username@hostname: pwd>`\n\n\
    Answer:\n\nIt can be done as follows:\n\n`set prompt = \"%n@%m: %/ >\"`\n\n###\
    \ 52: How can you start (from shell prompt) 2 commands \"in the background\",\
    \ ensuring that the second command will start after the completion of the first\
    \ one?\n\nAnswer:\n\nIt can be done as follows:\n\n`(command1 ;command2) &`\n\n\
    ### 53: Write a script to display a sorted listing of the unique words in a text\
    \ file.\n\nAnswer:\n\nIt can be done as follows:\n\n```csh\n#!/bin/csh\nset txt_file\
    \ = text_file_name\ntr -s ' ' < $txt_file | tr ' ' '\\n' | sort | uniq\n```\n\n\
    ### 54: Display the value of your `PATH` variable with each path in a separate\
    \ line.\n\nAnswer:\n\nIt can be done as follows:\n\n`echo $PATH | tr ':' '\\n'\
    \ | sort`\n\n### 55: Why the inclusion of a dot (.) in a search path is not a\
    \ good practice?\n\nAnswer:\n\nThe current working directory may be a world writable\
    \ directory (like `/tmp`). World writable directories must not be included in\
    \ the `PATH` variable due to security reasons. It may also cause problems in the\
    \ execution of commands, if the current directory contains executable files -\
    \ the names of which match reserved words (standard commands, etc). So, the inclusion\
    \ of a dot `.` in a search path is not a good practice.\n\n### 56: Explain the\
    \ logical expression `@ x = ($n < 5 || 20 <= $n)` and then also write the negation\
    \ of this expression.\n\nAnswer:\n\na) `x= false` when `n={5 to 19}`\nelse, `x=true`\n\
    \nb) Negation of `x`: `(y)`\n`@ y = ( !($n < 5 || 20 <= $n) )`\n\n### 57: What\
    \ are the differences between the two commands given below and when can we use\
    \ both of them?\n\n`csh-x my_new_script`\n`csh-v my_new_script`\n\nAnswer:\n\n\
    `csh –x my_new_script`\na) After variable substitution, it displays the command\
    \ line\nb) Finds and locates the errors in variable substitution\n\n`csh –v my_new_script`\n\
    a) Before variable substitution, it displays the command line\nb) Finds the line\
    \ where the script is failing\n\n### 58: Explain this small script:\n\n```csh\n\
    #!/bin/csh\nforeach dfile (/home/users/project1/*)\n  if (-z $dfile || $dfile\
    \ == \"core\") then\n    rm $dfile\n  endif\nend\n```\n\nAnswer:\n\nThis script\
    \ will delete zero length files and dumped core files from the specified directory.\n\
    \n### 59: A script prompts the user to type in something, using the following\
    \ syntax:\n\n`echo -n \"Enter some input ->\"`\n`set IN = $<`\n\nWhat would happen\
    \ if the user had typed? A B C D E\n\nCorrect your syntax to avoid the possible\
    \ problems.\n\nAnswer:\n\nThe shell replaces the `$` with the user input, that\
    \ is:\n\n`set IN = A B C D E`\n\nand then executes that command. This `set` command,\
    \ however, will assign the value `A` to the `IN` variable.\n\n### 60: Explain\
    \ the differences between local and environment variables.\n\nAnswer:\n\nLocal\
    \ variables are exclusive to the shell in which they are set. Environment variables\
    \ are available to all subshells. While local variables are created inside specific\
    \ shells, environment variables inherit the value.\n\n### 61: Explain search path.\n\
    \nAnswer:\n\nThe search path contains various executables to search when the shell\
    \ is unable to identify a particular command. You can set the default search path\
    \ to a custom one where you have stored executables using environment variable.\n\
    \n### 62: Explain Globbing.\n\nAnswer:\n\nGlobbing lets you search for a set of\
    \ files or directories using a wildcard. When you are searching for a file or\
    \ directory and you are not of its exact name, you can use a wildcard to search.\
    \ Globbing expands the wildcard possibilities to bring you the list of files and\
    \ directories based on regular expression.\n\n### 63: Fix the following switch\
    \ statement, explaining your corrections.\n\n```csh\nswitch ($argv[$i])\ncase\
    \ quit: breaksw\ncase list: ls\nbreaksw\ncase delete:\ncase erase:\n@ k = $i\n\
    rm $k\nbreaksw\nend\n```\n\nAnswer:\n\n```csh\nswitch ($argv[$i])\n  case quit:\n\
    \    breaksw # the commands for a particular case\n    # MUST NOT be on the same\
    \ line\n  case list:\n    ls # same as above\n    breaksw\n  case delete:\n  case\
    \ erase:\n    @ k = $i + 1 # the value of $argv[$i] here is \"erase\"\n    # a\
    \ logical syntax would be erase filename,\n    # in order to erase the second\
    \ argument.\n    rm $argv$k\n    breaksw\nend\n\n\n### 64: Name some basic differences\
    \ between bash and csh syntax and/or features.\n\nAnswer:\n\nThe basic differences\
    \ between bash and csh are:\n\na) Bash shell has functions, C shell does not have\n\
    \nb) Bash shell assigns values to variables using the assign operator (`variable=value`);C\
    \ shell uses `set` command (`set variable = value`)\n\nc) Bash shell has more\
    \ advanced command substitution than C shell\n\nd) Bash shell has advanced file\
    \ handling mechanisms; csh itself has no file handling capabilities\n\n### 65:\
    \ Suggest a way to overcome lack of functions in C shells.\n\nAnswer:\n\nA way\
    \ to overcome lack of functions is using a “clever” combination of alias and scripts.\
    \ E.g.:\n\n`alias holder ' source ~$USER/.tsch/holder_func'`\n\nwhere the script\
    \ `holder_func` contains the code to execute.\n\n### 66: From /tmp directory,\
    \ issue (cd ; pwd) ; pwd. Explain the performed actions and the output.\n\nAnswer:\n\
    \n`cd` returns user to his home directory, so the first `pwd` displays the home\
    \ directory. But, since parenthesized commands are always executed in a subshell,\
    \ second `pwd` displays `/tmp`, leaving the user where he was.\n"
