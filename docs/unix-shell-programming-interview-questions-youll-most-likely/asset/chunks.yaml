    \ (.) 不是一个良好的做法？\n\n答案：\n\n当前工作目录可能是全局可写目录（如 `/tmp`）。出于安全原因，全局可写目录不能包含在 `PATH`\
    \ 变量中。如果当前目录包含执行文件——其名称与保留字（标准命令等）匹配——可能会在命令执行时引发问题。因此，在搜索路径中包含点 `.` 不是良好的做法。\n\
    \n### 56: 解释逻辑表达式 `@ x = ($n < 5 || 20 <= $n)`，然后写出该表达式的取反。\n\n答案：\n\na) 当 `n={5\
    \ to 19}` 时，`x= false`\n否则，`x=true`\n\nb) `x` 的取反：`(y)`\n`@ y = ( !($n < 5 ||\
    \ 20 <= $n) )`\n\n### 57: 下面两个命令之间有什么区别，我们什么时候可以同时使用它们？\n\n`csh-x my_new_script`\n\
    `csh-v my_new_script`\n\n答案：\n\n`csh –x my_new_script`\na) 在变量替换后，显示命令行\nb) 查找并定位变量替换中的错误\n\
    \n`csh –v my_new_script`\na) 在变量替换执行前，显示命令行\nb) 找到脚本失败的行\n\n### 58: 解释下面这个短小的脚本：\n\
    \n```csh\n#!/bin/csh\nforeach dfile (/home/users/project1/*)\n  if (-z $dfile\
    \ || $dfile == \"core\") then\n    rm $dfile\n  endif\nend\n```\n\n答案：\n\n该脚本将删除指定目录下的零长度文件和转储核心（core\
    \ files）。\n\n### 59: 脚本使用以下语法提示用户输入内容：\n\n`echo -n \"Enter some input ->\"`\n\
    `set IN = $<`\n\n如果用户输入了 A B C D E 会发生什么？\n\n纠正你的语法以避免可能的问题。\n\n答案：\n\nShell 将\
    \ `$` 替换为用户输入，即：\n\n`set IN = A B C D E`\n\n然后执行该命令。然而，此 `set` 命令将把值 `A` 赋值给变量\
    \ `IN`。\n\n### 60: 解释局部变量和环境变量之间的区别。\n\n答案：\n\n局部变量仅限于设置它的 shell。环境变量则对所有子 shell\
    \ 可用。虽然局部变量创建在特定的 shell 内部，但环境变量会继承其值。\n\n### 61: 解释搜索路径（search path）。\n\n答案：\n\
    \n搜索路径包含了各种可执行文件，当 shell 无法识别特定命令时会进行搜索。你可以使用环境变量将默认搜索路径设置为自定义路径，并在其中存储你的可执行文件。\n\
    \n### 62: 解释通配符匹配（Globbing）。\n\n答案：\n\nGlobbing 允许你使用通配符搜索一组文件或目录。当你搜索文件或目录且不知道其确切名称时，可以使用通配符。Globbing\
    \ 根据正则表达式展开通配符的可能性产生文件目录列表。\n\n### 63: 修复下面的 switch 语句，并说明你的修改。\n\n```csh\nswitch\
    \ ($argv[$i])\ncase quit: breaksw\ncase list: ls\nbreaksw\ncase delete:\ncase\
    \ erase:\n@ k = $i\nrm $k\nbreaksw\nend\n```\n\n答案：\n\n```csh\nswitch ($argv[$i])\n\
    \  case quit:\n    breaksw # 特定 case 的命令\n    # 不能在同一行\n  case list:\n    ls #\
    \ 同上\n    breaksw\n  case delete:\n  case erase:\n    @ k = $i + 1 # 这里 $argv[$i]\
    \ 的值是 \"erase\"\n    # 逻辑语法应该是 erase filename，\n    # 以删除第二个参数\n    rm $argv$k\n\
    \    breaksw\nend\n```\n\n### 64: 列出 bash 和 csh 语法或功能的一些基本区别。\n\n答案：\n\nbash 和\
    \ csh 的基本区别是：\n\na) Bash shell 有函数，C shell 没有\n\nb) Bash shell 使用赋值运算符为变量赋值（variable=value）；C\
    \ shell 使用 `set` 命令（set variable = value）\n\nc) Bash shell 的命令替换比 C shell 更先进\n\
    \nd) Bash shell 有高级的文件处理机制；csh 本身没有文件处理能力\n\n### 65: 建议一种解决 C shell 缺少函数问题的方法。\n\
    \n答案：\n\n解决缺少函数的方法是使用别名（alias）和脚本的“巧妙组合”。例如：\n\n`alias holder ' source ~$USER/.tsch/holder_func'`\n\
    \n其中脚本 `holder_func` 包含要执行的代码。\n\n### 66: 从 /tmp 目录执行 (cd ; pwd) ; pwd。解释执行的操作和输出。\n\
    \n答案：\n\n`cd` 将用户返回主目录，因此第一个 `pwd` 显示主目录。但由于圆括起来的命令始终在子 shell 中执行，第二个 `pwd` 显示\
    \ `/tmp`，让用户留在原处。\n\n"
