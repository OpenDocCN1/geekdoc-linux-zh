    [Basics](#chapter0000.html)


    211: What are the types of files used in UNIX?


    Answer:


    The types of files used in UNIX are:


    a) Ordinary File: Contains text, instructions and data


    b) Special File: Allows to access a file using its alias or shortcut


    c) Directory: Contains both ordinary and special files


    212: Which type of file’s name starts with ‘.’?


    Answer:


    Name of the hidden file usually starts with ‘.’ and contains the configuration
    information. These files will not be shown while using ls command.


    213: How will you display the file name starting with the particular letters say
    ‘hel’?


    Answer:


    We can display the file name starting with particular letters using ‘*’. It is
    a meta-character used with ls to display the specified files.


    Example:


    ls hel*.txt


    -Displays the file names starting with ‘hel’ and ending with ‘txt’


    214: Which characters are called meta-characters?


    Answer:


    The following characters are called meta-characters:


    a) ‘*’ and ‘?’


    b) ‘*’ display the files -starting with the specified characters


    c) ‘?’ display the file names that match with the given single character


    215: How does the interaction between user and UNIX system take place?


    Answer:


    The interaction between user and UNIX system takes place as follows:


    a) Using ‘shell’ interface


    b) Gets the input from the user, executes the function and returns the result


    c) Based on the operating system, shell types also vary


    216: What is the purpose of ‘$’?


    Answer:


    ‘$’ is called command prompt and it allows the user to enter the command. It determines
    the command from the first word of the input.


    Example:


    $> cal -5


    217: What is the purpose of ‘#’?


    Answer:


    ‘#’ is used to comment the lines. When used in the first line followed by ‘!’,
    it denotes the location of the shell.


    Example:


    #!/ki/my_shell1/firstscript1


    218: How will you know the functionality of a command in UNIX?


    Answer:


    The functionality of a command in UNIX can be known using man command. It gives
    the name, description and parameters required for the command.


    Example: $man date


    [Commands](#chapter0000.html)


    219: Explain the commands getty and agetty.


    Answer:


    The getty command is a short form for “gettty” to manage the virtual terminals
    or teletypes in UNIX. Though TTY was meant for teletypes, it is not used to connect
    to all types of virtual machines. In Linux, the agetty command is used instead
    of getty.


    220: Explain strace and ltrace.


    Answer:


    The strace command lets you trace all the system calls or signals. This helps
    to debug the programs. The ltrace lets you trace the library calls for debugging
    the program. The strace call is made by the program to trace the kernel. The ltrace
    is called by the program to trace the library.


    221: Explain the commands nice and pidof.


    Answer:


    The nice command changes the priority of a background job. Its variations are
    renice that resets the priority of a running process and snice that resets the
    priority of multiple processes. The pidof command is used to know the identity
    of a running job process. It is essentially the Process ID of a particular job.
    It is usually used to kill that process.


    222: Explain lockfile.


    Answer:


    A lockfile is a file that controls the permissions to a device, file or a resource.
    It is a utility that lets you create the file that contains the permissions or
    locks set for another file or device. Usually, the locks are checked in the /var/lock
    directory. However, when the lockfile is used, the locks and permissions are checked
    in it instead. The lockfile is also used to block the browsers from accessing
    your mail folders.


    223: Explain env.


    Answer:


    The env command is used to change a few environment variables only for running
    a particular script without changing the system environment. You can set the env
    in the shebang line. For example, you can set the scripting language to Perl for
    a particular script only using env instead of changing the environment settings.


    224: Which command is used to list the hidden files in a directory?


    Answer:


    a) ls: list all the files in the directory


    b) ls -a: list the hidden files in the directory


    225: How will you redirect the output to a file?


    Answer:


    We can redirect the output to a file using ‘>’.


    For example,


    ls> myfile1


    ‘ls’ displays the files and ‘>’ redirects these contents to the file names ‘myfile1’


    226: How will you search for a pattern in a file?


    Answer:


    We can search for a pattern in a file using grep command.


    Example:


    grep my_pattern1 myfilename1


    -search my_pattern1 in the file ‘myfilename1’


