    \ ]]\n```\n\n### 113: A for loop requires the arguments list. This list can result\
    \ from:\n\na) command substitution: `for var in $(command)`\nb) variable substitution:\
    \ `for var in $var`\nc) arguments given in the command line: `for var in $*`\n\
    d) a test condition: `for var in \"$var\" -eq`\ne) all the above\n\nAnswer:\n\n\
