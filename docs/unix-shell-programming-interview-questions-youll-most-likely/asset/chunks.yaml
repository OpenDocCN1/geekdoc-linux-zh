    99: What is a limitation in options handling in C shells?


    Answer:


    There is no equivalent to getopts bash built-in in C shells. The only way to handle
    command line options is the command getopt. This command processes the entire
    arguments list at once and because of the way it reconstructs the arguments list
    (adds a simple trailing "--" argument), it does not support arguments with spaces.
    (The GNU -Linux version of getopt provides flags that cause it to output a string
    quoted for a shell to work around this limitation, but this is not portable).
    This is a limitation in options handling in C Shells.


