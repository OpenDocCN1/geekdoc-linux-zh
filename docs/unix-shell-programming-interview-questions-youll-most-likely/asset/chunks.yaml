    #!/bin/perl


    foreach $dir (split /:/, $ENV{PATH} ) {


    echo "$dir\n";


    }


    EOF


    ) > $RESULT


    Answer:


    This script creates a perl script named mycgi.pl. The whole perl script is contained
    in “here” document. The end mark of “here” document (EOF) is enclosed in backquotes,
    thus disabling parameter substitution, so all lines in “here” document are treated
    and output as literal text.


    202: Explain the following code snippet.


    t=traffic


    traffic=intolerable


    echo "\"traffic\" = $traffic"


    echo -n "dereferenced \"t\" = "


    eval echo \$$t


    t=traffic


    traffic=unbelievable


    unbelievable=intolerable


    echo "Changing value of \"traffic\" to $traffic."


    echo "\"traffic\" now is $traffic"


    echo -n "dereferenced \"t\" now is"


    eval echo \$$t


    Answer:


    The use of \$$variable in conjunction with eval means indirect reference - dereference.
    First $ is escaped and pasted on to the value of var. Variable t holds the name
    of another variable, and in second block, this variable (traffic) holds the value
    of another variable. The output produced by this snippet is:


    "traffic"=intolerable


    dereferenced "t"=intolerable


    Changing value of "traffic" to unbelievable.


    "traffic" now is unbelievable


    dereferenced "t" now is intolerable


