    [INDEX](#chapter0013.html)\n\n*****\n\n# UNIX Shell Programming\n\n## Interview\
    \ Questions\nReview these typical interview questions and think about how you\
    \ would answer them. Read the answers listed; you will find best possible answers\
    \ along with strategies and suggestions.\n\n*****\n\n## C Shell - Beginner (#chapter0000.html)\n\
    \n### 1: What must you do before you are able to run your new script for the first\
    \ time by its name or with an alias?\n\n**Answer:**\nYou must make it executable,\
    \ that is to execute the command:\n```\nchmod +x scriptname\n```\n\n### 2: The\
    \ following command is included in the `.login` script of a user:\n```bash\nalias\
    \ whois 'grep ^ /etc/passwd'\n```\nWhat will be the output, when the user issues\
    \ the following?\n```bash\nwho is guru\n```\n**Answer:**\nIf there is a defined\
    \ user account named \"guru\", or the string guru is contained elsewhere in `/etc/passwd`\
    \ file, then the output will be the entry which contains the string `\"guru\"\
    `, otherwise, it will be an empty line.\n\n### 3: If the condition `If (-r filename)`\
    \ fails (returns false), what are the possible reasons?\n\n**Answer:**\nThe possible\
    \ reasons are:\na) `filename` is not readable by the owner of the process\nb)\
    \ `filename` does not exist\n\n### 4: Which is the difference between the next\
    \ two statements?\n```bash\nset var = 10\nset var=10\n```\n**Answer:**\nIn `set\
    \ var = 10`, the space around the `=` sign causes the shell to set two variables\
    \ `var` and `10`. In `set var=10`, it correctly assigns the value `10` to the\
    \ variable `var`.\n\n### 5: Given the following code, what will be the value of\
    \ `var`?\n```bash\nset var=10\nset var=20\necho $var\n```\n**Answer:**\nThe output\
    \ will be `20`, because the second `set` command overwrites the previous value\
    \ of `var`.\n\n### 6: What will be the output of the following?\n```bash\nset\
    \ list=(apple banana cherry)\necho $#list\n```\n**Answer:**\nThe output will be\
    \ `3`, as `$#list` returns the number of elements in the array `list`.\n\n###\
    \ 7: What does the `rehash` command do?\n\n**Answer:**\n`rehash` command clears\
    \ the shell's internal hash table of executable commands and functions, forcing\
    \ it to search for them in the `PATH` again.\n\n### 8: How can you check if a\
    \ file is a directory?\n\n**Answer:**\nYou can use the `-d` operator in an `if`\
    \ statement:\n```bash\nif (-d dirname) then\n    echo \"It is a directory\"\n\
    endif\n```\n\n### 9: How do you append an element to an array?\n\n**Answer:**\n\
    You can use the `+=` operator:\n```bash\nset list += (new_element)\n```\n\n###\
    \ 10: What is the purpose of the `$?` variable?\n\n**Answer:**\nThe `$?` variable\
    \ stores the exit status of the most recently executed command.\n\n### 11: How\
    \ can you iterate over the elements of an array?\n\n**Answer:**\nYou can use a\
    \ `foreach` loop:\n```bash\nforeach item in ($list)\n    echo $item\nend\n```\n"
