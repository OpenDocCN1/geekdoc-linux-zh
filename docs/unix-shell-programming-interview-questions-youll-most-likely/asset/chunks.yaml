    101: What is shebang?


    Answer:


    The #! symbol used in the first line of shell script is called the shebang. It
    is followed by the interpreter file and then an optional argument to execute it.
    At the same time, any line starting with a # can be considered as a comment and
    hence ignored by the shell. So, it is completely up to the shell to decide whether
    or not to compile the shebang.


    102: What are pipes?


    Answer:


    Pipes let you pass the result of one shell program as the input to another shell
    program. The | or pipe symbol is used to create a pipe. The first program is executed,
    and its result is used as the input to the second program.


