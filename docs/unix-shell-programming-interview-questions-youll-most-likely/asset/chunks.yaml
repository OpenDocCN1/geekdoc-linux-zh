    143: True or False: In bash shell the array variables can be multi-dimensional.


    Answer:


    FALSE


    144: How could you display the entire contents of an array variable?


    Answer:


    The entire contents of an array can be displayed by:


    echo ${array[*]}


    145: How could you get the length (the total number of elements) of an array?


    Answer:


    The length of an array can be found by:


    echo ${#array[*]}


    146: How could you initialize an array?


    Answer:


    An array can be initialized by:


    set -A array value0 value1 ....


    147: True or False: Array variables cannot be environment variables.


    Answer:


    TRUE


    148: Is it possible to define a variable with local scope inside a function?


    Answer:


    Yes, it is possible to define a variable with local scope inside a function. If
    a variable is declared inside a function using the declare command or typeset,
    it exists only inside that function and is unset when function returns.


    149: If you call a function using the syntax:


    functionname /*


    what will be the function''s arguments (if any)?


    Answer:


    All the files & subdirectories under /, except dot files.


    150: Is there any way to avoid overwriting the file when the following redirection
    syntax is used?


    command > filename


    Answer:


    The shell option noclobber can be set to avoid overwriting the file.


    151: Explain the following syntax:


    command 2>&1 > /dev/null


    Answer:


    It redirects the stderr stream to file descriptor 1, that is, to the stdout, and
    then also redirects stdout to the special file /dev/null, discarding both, output
    and errors.


    152: What is the result of the command?


    kill $$


    Answer:


    The given command kills (terminates) the current process.


    153: Why is it preferable to use the TERM signal (-15) instead of the KILL signal
    (-9) in order to stop the execution of a process?


    Answer:


    The TERM signal "says" to the process to start its normal termination procedure,
    so it is a safe way to terminate processes, closing their open files and releasing
    the resources. The KILL signal just "shoots" the process, so that, if there were
    open file descriptors, they remain open.


    154: Is it possible to change the default behavior of the shell when it receives
    a certain signal?


    Answer:


    Yes, it is possible to change the default behavior of the shell when it receives
    a certain signal using the trap command. But not all signals are ''trapable'',
    e.g., the KILL signal is not a trapable signal.


    155: What is the meaning of $0 for an awk statement? What is the meaning of variables
    $1, $2, .... for the awk?


    Answer:


    awk reads each line of input as input record and splits each record in a set of
    numbered fields, in which the first field is $1, the second field is $2, and so
    on. The separator character used in this process is the value of awk special variable
    FS. The $0 represents the entire record.


    156: Is it possible to define some actions to be performed before the processing
    of the input lines by the awk command?


    Answer:


    Yes, it is possible by using the reserved word BEGIN and putting the actions inside
    a block {}.


    157: Select all of the following that apply to bash shell variables. Explain all
    that do not apply.


    a) Bash variables are untyped, by default


    b) Although bash variables are basically treated as strings, the bash shell permits
    integer operations and comparisons on variables


    c) All variables defined in a process (or shell) are local or private variables,
    that is, they are known only to that process


    d) The variable names can contain any character, including special characters


    Answer:


    Options a) and b) apply to bash shell variables.


    Option c) does not apply. If variables have not been exported, yes, they are of
    local scope, otherwise are “inherited” from any sub-process.


    Option d) does not apply. The variables names can contain only alphanumerical
    characters and underscores, and the first character could not be a digit.


    158: True or False: A script invoked from the command line can export variables
    back to its parent shell.


