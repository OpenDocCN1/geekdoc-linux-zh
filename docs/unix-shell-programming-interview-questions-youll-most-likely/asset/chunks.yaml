    myprogram 2> myfileerr2\n```\n- Redirects the error of the `myprogram2` to the\
    \ file `myfileerr2`\n\n### 229: How will you get the output of a previous command\
    \ as an input to the subsequent command?\n\nAnswer:\n\nWe can get the output of\
    \ a previous command as an input to the subsequent command using `pipeline(|)`.\n\
    \nExample:\n```bash\nls –s | grep mysearch1\n```\n`ls` gives the list of file\
    \ names and the names that match with the `mysearch1` will be output to the user.\n\
    \n### 230: Which commands are used to print the nth line of a file?\n\nAnswer:\n\
    \n`sed` or `head` commands are used to print the nth line of a file.\n\nSyntax:\n\
    ```bash\nsed –n ‘<line number> p’ my_file.txt\nhead –<n> my_file1.txt | tail -1\n\
    ```\n\nExample:\nTo print the 7th line of the file,\n```bash\nsed –n ‘7 p’ my_file1.txt\n\
    head –7 my_file1.txt | tail -1\n```\n\n### 231: How will you search for a file\
    \ in folders?\n\nAnswer:\n\nWe can search for a file in folders using `grep` command.\n\
    \nExample:\n```bash\ngrepki my_folder1/folder2\n```\n- `ki` - file name\n- `folder1`\
    \ and `folder2` - file’s path\n- To ignore cases, use `i`\n```bash\ngrep -i “ki”\
    \ my_folder1/folder2\n```\n\n### 232: What is the purpose of `-r` and `-v` in\
    \ grep command?\n\nAnswer:\n\nThe purpose of `-r` and `-v` in `grep` command are:\n\
    \na) It searches recursively for the pattern in all files\nExample:\n```bash\n\
    grep –r “name” /myfold1/myfile1\n```\n\nb) `-v` – display the lines that does\
    \ not contain the given word\nExample:\n```bash\ngrep –v “name” /myfold1/myfile1\n\
    ```\n\n### 233: How will find a directory of a file?\n\nAnswer:\n\nWe can find\
    \ the directory of a file using `ff`. It returns the directory in which the file\
    \ is present. The starting letter of the file name can also be given.\n\nExample:\n\
    ```bash\nff myfile2\n```\n\n### 234: How will you kill a process?\n\nAnswer:\n\
    \nWe can kill a process using `kill` command. Id of the process should be known\
    \ to kill a process. It can be retrieved by using `ps` command.\n\nExample:\n\
    ```bash\nkill 22230\n```\n\n### 235: What are the ways to create a file?\n\nAnswer:\n\
    \nA file can be created in the following ways:\n\na) Using `vi` command. The files\
    \ can be edited using `cat` command\nExample:\n```bash\nvi my_filename2\n```\n\
    \nb) Using `emacs` It is a type of editor that allows to create and edit a file\n\
    Example:\n```bash\nemacs my_filename2\n```\n\n### 236: What are the ways to get\
    \ name of the `cpu` model?\n\nAnswer:\n\nThe ways to get the name of the `cpu`\
    \ model are:\n\na) Using `grep`. `grep –i ‘model’ /proc/cpuinfo` returns the model\
    \ name\nb) Using `grep` with pipeline. `cat /proc/cpuinfo | grep –i ‘model’` returns\
    \ the model name of `cpu`\n\n### 237: How will you get the number of words in\
    \ a file?\n\nAnswer:\n\nWe can get the number of words in a file using `wc` command.\
    \ It returns total number of lines, words, bytes and name of the file.\nExample:\n\
    ```bash\nwc myfile_name\n```\n\n### 238: What are positional parameters?\n\nAnswer:\n\
    \nPositional parameters are the arguments passed to a script from the command.\
    \ It is usually denoted by the number of its position as `$0`, `$1`, `$2` etc.\
    \ After `$9`, the positional parameters are accessed with `${10}`, `${11}` etc.\
    \ with braces. `$*` and `$@` denotes all the parameters.\n\n### 239: Explain the\
    \ shift command.\n\nAnswer:\n\nThe `shift` command will shift the positional parameters\
    \ one position to its left. So, with `shift` command, `$3` will be `$2` and `$2`\
    \ will be `$1` and so forth. For all positions in two digits or more, have to\
    \ use them within braces.\n\n### 240: Does `=` and `-eq` function similarly?\n\
    \nAnswer:\n\n=` is usually used as the assignment operator, to assign values to\
    \ a variable. `==` is used for comparison. The `-eq` command is also used for\
    \ comparison. The difference is that `==` does lexical or string comparison, `-eq`\
    \ does numeric comparison.\n\n### 241: How will you initialize and print the values\
    \ in UNIX?\n\nAnswer:\n\nInitialization:\n`my_variable=”value\"` (without any\
    \ before or after equal sign)\nPrint:\n```bash\necho $my_variable\n```\n\n###\
    \ 242: How will you concatenate the variables in UNIX?\n\nAnswer:\n\nWe can concatenate\
    \ the variables in UNIX using `$`.\nExample:\n```bash\nmy_var1=“Good”\nmy_var2=“$my_var1”\n\
    my_var3=“$my_var2”\necho $my_var3\n```\n\n### 243: How will you make a variable\
    \ readonly?\n\nAnswer:\n\nWe can make a variable readonly using `readonly`. After\
    \ setting the variable to read only mode, changing the variable generates error.\n\
    Example:\n```bash\nmy_var1=“Status”\nreadonly my_var1\nmy_var1=“Cool”\n```\n\n\
    ### 244: How will you delete a variable?\n\nAnswer:\n\nWe can delete a variable\
    \ using `unset`. The variables that are `read-only` cannot be deleted.\nExample:\n\
    ```bash\nmy_var1=“Status”\nunset my_var1\necho $my_var1\n```\n\n### 245: What\
    \ are the types of variables?\n\nAnswer:\n\nThe different types of variables are:\n\
    \na) Environment: Accessed by child processes of the shell\nb) Local: Accessed\
    \ by present instance of the shell\nc) Shell: set and used by shell\n\n### 246:\
    \ How will you get the file name and number of arguments accepted by the current\
    \ script?\n\nAnswer:\n\nWe can get the file name and number of arguments accepted\
    \ by the current script using `$0` and `$#` with `echo` command.\n\na) `$0`: returns\
    \ the file name\nb) `$#: returns the number of arguments accepted by the script\n\
    \n### 247: How will you get the status of the last executed command?\n\nAnswer:\n\
    \nWe can get the status of the last executed command using `$?`. It returns a\
    \ numerical value. It returns `0` for successful execution, `1` for unsuccessful\
    \ execution and other values representing some kind of errors.\n\n### 248: How\
    \ will you achieve `do-while` looping?\n\nAnswer:\n\n```bash\n#!/bin/sh\nmy_cnt1=$\n\
    while [ $my_cnt1 -gt 5 ] #condition\ndo\n  echo $my_cnt1Hellllo!\n  my_cnt1=$(expr\
    \ $my_cnt -1) #decrement\ndone\necho COMPLETED!!\n```\n\n### 249: How will you\
    \ call a function in UNIX?\n\nAnswer:\n\nSyntax:\n```bash\nmy_var1=$(function_name1\
    \ $my_arg1 $my_arg2)\n```\n- `function_name` - function to be called\n- `my_arg1`,\
    \ `my_arg2` - arguments to be passed\n\n### 250: What are the ways to get the\
    \ process id of a shell?\n\nAnswer:\n\nThe different ways to get the process id\
    \ of a shell are:\n\na) Using `ps`. It lists all the processes with the corresponding\
    \ details like id, name, etc\nExample:\n```bash\nps –u my_name3\n```\n\nb) Using\
    \ `$$`. It returns the process id of the current shell\nExample:\n```bash\necho\
    \ $$\n```\n\n### 251: How will you initialize an array?\n\nAnswer:\n\n`my_arrvar1[index]=my_val`\n\
    Example:\n```bash\nstatus1[0]=“Good”\nstatus1[1]=“Excellent”\n```\na) In `ksh`\
    \ shell, initialization will be:\n```bash\nset –A my_arrvar1 my_val1 my_val2 ...my_valn\n\
    ```\nb) In `bash` shell:\n```bash\nmy_arrvar1=(my_val1 my_val2 ... my_valn)\n\
    ```\n\n### 252: How will you access the array variables?\n\nAnswer:\n\na) Using\
    \ `$`\nExample:\n```bash\necho ${my_arrvar1[1]}\n```\nTo access all the values\
    \ of an array:\n\na) Use `[*]`\nExample:\n```bash\necho ${my_arrvar1[@]}\n```\n\
    b) Use `[@]`\nExample:\n```bash\necho ${my_arrvar1[@]}\n```\n\n*****\n\n### 253:\
    \ Explain the special variables.\n\nAnswer:\n\nShell has some special variables\
    \ which offer special values that are otherwise not accessible within the script\
    \ or program. Here are some of the special shell variables commonly used:\n\n\
    a) `$0`: current script’s filename\nb) `$#: the number of arguments passed on\
    \ while calling a script\nc) `$?`: The exit status of the script\nd) `$$`: gives\
    \ out the process id of the script\n\n### 254: How do you check if a string is\
    \ empty with an operator?\n\nAnswer:\n\nChecking an empty string is not possible\
    \ with the usual comparison operators. You cannot use `==` to check if the string\
    \ is empty. The `-eq` command also cannot be used for string comparison. Instead,\
    \ the `-z` operator is used to check for empty string. To check if the string\
    \ is not empty, the `-n` operator can be used.\n\n### 255: Describe the purpose\
    \ of `killring(‘’)`.\n\nAnswer:\n\na) It indicates how many killed strings will\
    \ be in memory. Default value is `30`\nb) It keeps only most recently killed memory\
    \ when set less than `2` or `unset`\n"
