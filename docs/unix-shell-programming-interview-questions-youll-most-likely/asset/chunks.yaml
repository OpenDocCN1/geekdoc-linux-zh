    \n*****\n\n## Table of Contents\n\n1. C Shell - Beginner\n2. C Shell – Intermediate\n\
    3. C Shell – Advanced\n4. Bash - Beginner\n5. Bash - Intermediate\n6. Bash - Advanced\n\
    7. Basics\n8. Commands\n9. Variables and Arrays\n10. Special Shell Variables\n\
