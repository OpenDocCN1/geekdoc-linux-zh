    {


    org_string="$@"


    for str in $@


    do


    firstchar=${str:0:1}


    rest_string=${str:1}


    FirstChar=`echo "$firstchar" | tr a-z A-Z`


    cap_string=${cap_string}" "$FirstChar$rest_string")


    done


    }


    200: What does the following code snippet do?


    declare -A files


    find . -type f -exec sha1sum {} + | while read -r sum fname


    do


    if [[ ${files[$sum]} ]]


    then


    printf ''rm -- "%s" ''


    else


    files[$sum]="$fname"


    fi


    done> duplics


    Answer:


    It checks for duplicate files using a hash table (associative array) indexed with
    the SHA sum of the files in the current directory. sha1 sum computes and checks
    SHA1 message digest. It prints or checks SHA1 (160-bit) checksums. This list passes
    through the while read loop to variables sum and fname. Then the script checks
    if there is already an element associated with the index $sum in the array files.
    If so, it is a duplicate file, and displays an "rm" message. Otherwise, the filename
    is added to the array files as a new element associated with the index $sum.


