  trans: "\n\n### 43: 假设在一个脚本中变量 `limt` 的值变为 `92.1`。显示消息：\n\n你的系统上限为 92.10%\n\n答案：\n\
    \n```bash\nif [ $limt == 92.10 ]\nthen\n  printf \"Upper limit 92.10%% in $HOSTNAME\"\
