    There are many schools of thought on the best way to win clients from competitors,
    and unless you know that your interviewer adheres to a specific thought or practice,
    it''s best to keep this question general. Rather than using absolute language,
    focus on the benefits of one or two strategies and show a clear, critical understanding
    of how these ways can succeed in a practical application.


    ### 38: How do you feel about companies monitoring internet usage?


    **Answer:**

    Generally speaking, most companies will monitor some degree of internet usage
    over their employees – and during an interview is not the best time to rebel against
    this practice. Instead, focus on positive aspects such as the way it can lead
    to increased productivity for some employees who may be easily lost in the world
    of resourceful information available to them.


    ### 39: What is your first impression of our company?


    **Answer:**

    Obviously, this should be a positive answer! Pick out a couple key components
    of the company''s message or goals that you especially identify with or that pertain
    to your experience and discuss why you believe these missions are so important.


    ### 40: Tell me about your personal philosophy on business.


    **Answer:**

    Your personal philosophy on business should be well-thought out, and in line with
    the missions and objectives of the company. Stay focused on positive aspects such
    as the service it can provide, and the lessons people gain in business, and offer
    insight as to where your philosophy has come from.


    ### 41: What''s most important in a business model: sales, customer service, marketing,
    management, etc.?


    **Answer:**

    For many positions, it may be a good strategy to tailor this answer to the type
    of field you''re working in, and to explain why that aspect of business is key.
    However, by explaining that each aspect is integral to the function as a whole,
    you can display a greater sense of business savvy to the interviewer and may stand
    out in his or her mind as a particularly aware candidate.


    ### 42: How do you keep up with news and emerging trends in the field?


    **Answer:**

    The interviewer wants to see that you are aware of what''s currently going on
    in your field. It is important that your education does not stop after college,
    and the most successful candidates will have a list of resources they regularly
    turn to already in place, so that they may stay aware and engaged in developing
    trends.


    ### 43: Would you have a problem adhering to company policies on social media?


    **Answer:**

    Social media concerns in the workplace have become a greater issue, and many companies
    now outline policies for the use of social media. Interviewers will want to be
    assured that you won''t have a problem adhering to company standards, and that
    you will maintain a consistent, professional image both in the office and online.


    ### 44: Tell me about one of the greatest problems facing X industry today.


    **Answer:**

    If you''re involved in your career field and spend time on your own studying trends
    and new developments, you should be able to display an awareness of both problems
    and potential solutions coming up in the industry. Research some of the latest
    news before heading into the interview and be prepared to discuss current events
    thoroughly.


    ### 45: What do you think it takes to be successful in our company?


    **Answer:**

    Research the company prior to the interview. Be aware of the company''s mission
    and main objectives, as well as some of the biggest names in the company, and
    also keep in mind how they achieved success. Keep your answer focused on specific
    objectives you could reach in order to help the company achieve its goals.


    ### 46: What is your favorite part of working in this career field?


    **Answer:**

    This question is an opportunity to discuss some of your favorite aspects of the
    job, and to highlight why you are a great candidate for the particular position.
    Choose elements of the work you enjoy that are related to what you would do if
    hired for the position. Remember to remain enthusiastic and excited for the opportunities
    you could attain in the job.


    ### 47: What do you see happening to your career in the next 10 years?


    **Answer:**

    If you''re plugged in to what''s happening in your career now and are making an
    effort to stay abreast of emerging trends in your field, you should be able to
    offer the interviewer several predictions as to where your career or field may
    be heading. This insight and level of awareness shows a level of dedication and
    interest that is important to employers.


    ### 48: What are the three most important things you''re looking for in a position?


    **Answer:**

    The top three things you want in a position should be similar to the top three
    things the employer wants from an employee, so that it is clear that you are well-matched
    to the job. For example, the employer wants a candidate who is well-qualified
    for and has practical experience – and you want a position that allows you to
    use your education and skills to their best applications. The employer wants a
    candidate who is willing to take on new challenges and develop new systems to
    increase sales or productivity – and you want a position that pushes you and offers
    opportunities to develop, create, and lead new initiatives. The employer wants
    a candidate who will grow into and stay with the company for a long time – and
    you want a position that offers stability and believes in building a strong team.
    Research what the employer is looking for beforehand and match your objectives
    to theirs.


    ### 49: How are you evaluating the companies you''re looking to work with?


    **Answer:**

    While you may feel uncomfortable exerting your own requirements during the interview,
    the employer wants to see that you are thinking critically about the companies
    you''re applying with, just as they are critically looking at you. Don''t be afraid
    to specify what your needs from a company are (but do try to make sure they match
    up well with the company – preferably before you apply there), and show confidence
    and decisiveness in your answer. The interviewer wants to know that you''re the
    kind of person who knows what they want, and how to get it.


    ### 50: Are you comfortable working for __________ salary?


    **Answer:**

    If the answer to this question is no, it may be a bit of a deal-breaker in a first
    interview, as you are unlikely to have much room to negotiate. You can try to
    leverage a bit by highlighting specific experience you have, and how that makes
    you qualified for more, but be aware that this is very difficult to navigate at
    this step of the process. To avoid this situation, be aware of industry standards
    and, if possible, company standards, prior to your application.


    ### 51: Why did you choose your last job?


    **Answer:**

    In learning what led you to your last job, the interviewer is able to get a feel
    for the types of things that motivate you. Keep these professionally-focused and
    remain passionate about the early points of your career, and how excited you were
    to get started in the field.


    ### 52: How long has it been since your last job and why?


    **Answer:**

    Be sure to have an explanation prepared for all gaps in employment, and make sure
    it''s a professional reason. Don''t mention difficulties you may have had in finding
    a job, and instead focus on positive things such as pursuing outside interests
    or perhaps returning to school for additional education.


    ### 53: What other types of jobs have you been looking for?


    **Answer:**

    The answer to this question can show the interviewer that you''re both on the
    market and in demand. Mention jobs you''ve applied for or looked at that are closely
    related to your field, or similar to the position you''re interviewing for. Don''t
    bring up last-ditch efforts that found you applying for a part-time job completely
    unrelated to your field.


    ### 54: Have you ever been disciplined at work?


