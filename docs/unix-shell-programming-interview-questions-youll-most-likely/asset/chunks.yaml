- fmt: "\nThis script uses the `getopt` command that processes the entire argument\
    \ list at once. If the argument list matches, `getopt` canonicalizes (reorders\
    \ in the typical way used by UNIX commands) the argument list, putting the flags\
    \ and their optional arguments prior to any non-flag arguments, adding a single\
    \ trailing `\"--\"` argument to indicate that there are no more flags to process.\n\
    \nIn case of `-h` option, the script displays a \"usage\" message and terminates.\
    \ In case of `-o` option, the script sets the `OUTPUT_FILE` variable to the argument\
    \ that follows. In case of `-l` option, the script sets the `DO_LONG` variable\
    \ to `-l`. The `shift` command that follows the `while` loop removes trailing\
    \ `--`.\n\nThe script runs `ls $*` (where `$*` are the remaining arguments), if\
    \ no option was used; it runs `ls -l $*` command, if `-l` option was used and\
    \ `ls -l $*` command, redirecting the output to `OUTPUT_FILE` file, if `-o` file\
    \ was used.\n\n### 94: Write a script which calculates the min, max and average\
    \ of a set of floating-point numbers, stored in an array.\n\n**Answer:**\n\n```bash\n\
    set array = (5, 10, 2, 13, 0.2345)\n\nforeach num ($array[*])\n  echo $num >>\
    \ nums_file\nend\n\nawk '{if(min==”\"){min=max=$1}; if($1>max) {max=$1}; if($1<\
    \ min) {min=$1}; total+=$1; count+=1} END {print \"Average is: \"total/count,\
    \ \"Min is: \"min, \"Max is: \"max}’ nums_file\n```\n\n---\n\n### 95: You have\
    \ an input data file with a symmetrical schema (the same number of fields in each\
    \ record) where the first line contains the headings of the fields. You want to\
    \ extract the 3rd column (field) of the actual data records, that is, of each\
    \ record except the headers line (1st line) and any comment lines (assume that\
    \ they begin with `#` or `*`). Give a solution and explain it in short.\n\n**Answer:**\n\
    \n```bash\nset cn = 3\nset ncols = `awk '{FNR == 1 {print NF}' input_file `\n\
    if ( $cn <= $ncols ) then\n  set col$cn = ` awk -v i=$cn '$0 !~ /^[#*]/ && FNR\
    \ != 1 { print $i }' input_file`\nelse\n  echo \"The column number must be in\
    \ the range 1 to $ncols\"\nendif\n```\n\nThe variable `ncols` contains the total\
    \ number of columns in each record. The `if` structure is used to avoid the case\
    \ where the position number of the requested column is greater than the total\
    \ number of columns. `col3` will be an array of the values of the third column.\n\
    \n---\n\n### 96: Suppose that `input_file` is a tabular data file with an asymmetric\
    \ schema, that is, each record (line) may have different number of fields, and\
    \ that the first 3 lines describe the used schema. Explain the following excerpt.\n\
    \n```bash\nset cn = 3\nset ccounts = `awk '{FNR > 3 {print NF}' input_file `\n\
    set ccounts1 = ( $ccounts[*] )\nset ccounts2 = ( $ccounts[*] )\nset mincn = $ccounts[1]\n\
    while ( $ccounts1 > 0 )\n  if( $mincn > $ccounts1[1] ) then\n    set mincn = $ccounts1[1]\n\
    \  endif\n  shift ccounts1\nend\nset maxcn = $ccounts2[1]\nwhile ( $ccounts2 >\
    \ 0 )\n  if ( $maxcn < $ccounts2[1] ) then\n    set maxcn = $ccounts2[1]\n  endif\n\
    \  shift ccounts2\nend\nif ( $cn <= $maxcn ) then\n  set col$cn = ` awk -v i=$cn\
    \ -v minc=$mincn 'FNR > 3 { (FN < minc ) ? print FN \"null\" : print $i }' input_file`\n\
    else\n  echo \"The column number must be in the range $mincn to $maxcn\"\nendif\n\
    ```\n\n**Answer:**\nThis script extracts the content of a column from an asymmetric\
    \ data file:\n\nThe `cn` variable holds the column to be extracted. The `ccounts`\
    \ array holds the number of fields of all actual data records (`FNR > 3`). The\
    \ arrays `ccount1` and `ccount2` are duplicates of the `ccount` array, used to\
    \ calculate the minimum and maximum numbers from the array `ccounts`. We use these\
    \ temporary arrays in order to preserve the original array to use it later. The\
    \ first `while` loop calculates the minimum value and the second the maximum value.\
    \ A `shift` command in each loop’s iteration, discards the first element of the\
    \ array. The `if` statement then checks if the number of the requested column\
    \ (field) is less than the maximum number, and if so, the `awk` command prints\
    \ the content of this column if there are any (`FN >= minc`), or the string `\"\
    FNnull\"`, otherwise. If the number of the requested column is greater than the\
    \ maximum number, the script displays a message.\n\n---\n\n### 97: Suppose you\
    \ have a data file but its internal format does not remain consistent. You want\
    \ to extract two columns from this file, but you don't know the order of the columns,\
    \ know only their headers: Name, and email. Write the script that will achieve\
    \ these tasks.\n\n**Answer:**\n\n```bash\n#!/bin/csh -f\nset fl = filename\nset\
    \ namepos = `head -1 \"$fl\" | awk '{split($0,a) ; for ( j in a ) { if (a[j] =\
    \ \"Name\") {print j}}}' `\nset mailpos = `head -1 \"$fl\" | awk '{split($0,a)\
    \ ; for ( j in a ) { if (a[j] = \"email\") {print j}}}' `\nforeach line (\"`cat\
    \ $fl`\")\n  set line = \"$line:gas/ /_/\"\n  set argv = \"$line\"\n  set name\
    \ = \"$argv[$namepos]\"\n  set name = \"$name:gas/_/ /\"\n  set names = ($names[*]\
    \ \"$name\")\n  set mail = \"$argv[$mailpos]\"\n  set mails = ($mails[*] \"$mail\"\
    )\nend\n```\n\n---\n\n### 98: Create a script to read a textfile line by line,\
    \ to the end of the file. Do not use awk.\n\n**Answer:**\n\n```bash\nset inputfile\
    \ = textfile\nset total = `cat $inputfile | wc -l`\nset count = 1\nwhile ($count\
    \ <= $total)\n  if ($count == 1)\n    set record = `head -n 1 $inputfile`\n  else\n\
    \    set record = `tail -n +$count $inputfile | head -n 1`\n  endif\n  echo $record\n\
    \  @ count++\nend\n```\n\n---\n\n### 99: Suppose you have a data file... You want\
    \ to extract two columns from this file, but you don't know the order of the columns,\
    \ know only their headers: Name, and email. Write the script that will achieve\
    \ these tasks.\n\n**Answer:**\nThere is no equivalent to `getopts` built-in. The\
    \ only way to handle options is `getopt`. This GNU version of `getopt` supports\
    \ arguments with spaces, but because of the way it is not portable.\n\n---\n\n\
    ### 100: Rewrite the next script, using a more readable and clear logic.\n\n**Answer:**\n\
    \n```bash\n#!/bin/csh\n@ num = 0\necho \"Enter a number between 0 and 223\"\n\
    set num $<\nif ( $num > 0 && $num <= 223 ) then\n  if ( $num < 127 ) then\n  \
    \  echo \"Number may be first octet for class-A IP\"\n  else\n    if ( $num >\
    \ 127 && $num <= 191 ) then\n      echo \"Number may be first octet for class-B\
    \ IP\"\n    else\n      if ( $num == 127 ) then\n        echo \"Number is used\
    \ for loopback\"\n      else\n        echo \"Number may be first octet for class-C\
    \ IP\"\n      endif\n    endif\n  endif\nelse\n  echo \"number is not usable for\
    \ octet in an address\"\nendif\n```\n\nIt is easier for someone to follow this\
    \ solution, but the order is important for the four `if` statements in this case.\
    \ Note also the `exit` command in the first three `if` statements.\n\n*****\n\n\
    ### 101: What is shebang?\n\n**Answer:**\n\nThe `#!` symbol used in the first\
    \ line of shell script is called the shebang. It is followed by the interpreter\
    \ file and then an optional argument to execute it. At the same time, any line\
    \ starting with `#` can be considered as a comment and hence ignored by the shell.\
    \ So, it is completely up to the shell to decide whether or not to compile the\
    \ shebang.\n\n### 102: What are pipes?\n\n**Answer:**\n\nPipes let you pass the\
