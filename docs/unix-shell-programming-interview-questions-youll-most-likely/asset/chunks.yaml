    ## [Basics](#chapter0000.html)


    # 211: What are the types of files used in UNIX?


    **Answer:**


    The types of files used in UNIX are:


    a) **Ordinary File**: Contains text, instructions and data

    b) **Special File**: Allows to access a file using its alias or shortcut

    c) **Directory**: Contains both ordinary and special files


    # 212: Which type of file’s name starts with ‘..’?


    **Answer:**


    Name of the hidden file usually starts with `.` and contains the configuration
    information. These files will not be shown while using `ls` command.


    # 213: How will you display the file name starting with the particular letters
    say ‘hel’?


    **Answer:**


    We can display the file name starting with particular letters using `*`. It is
    a meta-character used with `ls` to display the specified files.


    **Example:**


    ```

    ls hel*.txt

    ```

    - Displays the file names starting with `hel` and ending with `txt`


    # 214: Which characters are called meta-characters?


    **Answer:**


    The following characters are meta-characters:


    a) `*`

    b) `?`

    c) `$`


    # 215: How does the interaction between user and system take place?


    **Answer:**


    The interaction between user and system takes place:


    a) Using system calls

    b) Using the interface

    c) Using `shell`


    # 216: What is the purpose of `$`?


    **Answer:**


    `$` is a prompt. It is used to enter the input.


    **Example:**


    ```

    $

    ```


    # 217: What is the purpose of `#`?


    **Answer:**


    `#` is used to comment the lines. It is used in the environment.


    **Example:**


    ```bash

    #!/bin/bash

    ```


    # 218: How will you know the functionality of a command?


    **Answer:**


    The functionality of a command can be known using `man`. It gives the name.


    **Example:**


    ```

    man date

    ```


    ## [Commands](#chapter0000.html)


    # 219: Explain the commands getty and agetty.


    **Answer:**


    `getty` is a short form for TTY It was meant for virtual terminals. In Linux,
    the `agetty` command is used instead.


    # 220: Explain strace and ltrace.


    **Answer:**


    `strace` lets you trace the system calls. This helps to debug the programs. `ltrace`
    lets trace the library.


    # 221: Explain the commands nice and pidof.


    **Answer:**


    `nice` command changes the priority of a process. Its variations are `renice`
    and `snice`. `pidof` command is used to know the identity of a running job. It
    is usually used to kill that process.


    # 222: Explain lockfile.


    **Answer:**


    A `lockfile` is a file that controls the permissions to a device, file or a resource.
    It is a utility that lets you create the file that contains the locks set for
    another file. Usually, the locks are checked in the `/var/lock` directory. However,
    when the `lockfile` is used, the locks are checked in it instead. The `lockfile`
    is also used to block the browsers from accessing your mail folders.


    # 223: Explain env.


    **Answer:**


    The `env` command is used to change a few environment variables only for running
    a particular script without changing the system environment. You can set the `env`
    in the shebang line. For example, you can set the scripting language to Perl for
    a particular script only using `env` instead of changing the environment.


    # 224: Which command is used to list the hidden files in a directory?


    **Answer:**


    a) `ls`: list all the files in the directory

    b) `ls -a`: list the hidden files in the directory


    # 225: How will you redirect the output to a file?


    **Answer:**


    We can redirect the output to a file using `>`.


    **Example:**


    ```

    ls> myfile1

    ```

    `ls` displays the files and `>` redirects these contents to the file names `myfile1`


    # 226: How will you search for a pattern in a file?


    **Answer:**


    We can search for a pattern in a file using `grep` command.


    **Example:**


    ```

    grep my_pattern1 myfilename1

    ```


