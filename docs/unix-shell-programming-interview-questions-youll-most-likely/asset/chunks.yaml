    Write the script that will achieve these tasks.


    Answer:


    #!/bin/csh -f


    set fl = filename


    set namepos = `head -1 "$fl" | awk ''{split($0,a) ; for ( j in a ) { if (a[j]
    = "Name") {print j}}}'' `


    set mailpos = `head -1 "$fl" | awk ''{split($0,a) ; for ( j in a ) { if (a[j]
    = "email") {print j}}}'' `


    foreach line ("`cat $fl`")


    set line = "$line:gas/ /_/"


    set argv = "$line"


    set name = "$argv[$namepos]"


    set name = "$name:gas/_/ /"


    set names = ($names[*] "$name")


    set mail = "$argv[$mailpos]"


    set mails = ($mails[*] "$mail")


    end


