    26: Explain the following commands:


    set names = (John Kathrin Chris Jacob)


    set names = ($names[1-2] Angela $names[3-])


    Answer:


    First command creates an array named names with the four names as its elements.


    Second command adds name Angela between Kathrin and Chris.


    27: How could you move cursor to specified coordinates on screen? (tcsh)


    Answer:


    We can move the cursor to specified coordinates on the screen using the following
    code: echotc cm column row


    28: What is the result of this loop?


    foreach i ([A-Z]*) ? mv $i $i.csh ? end


    Answer:


    The loop renames all files that begin with a capital letter, adding the "extension"
    .csh.


    29: Assuming there is a label cleanup somewhere in a script, explain the command
    onintr cleanup.


    Answer:


    The script will branch to label “cleanup” if it catches an interrupt signal.


    30: Is there a way to repeat a command for a predefined number of times, without
    using a counter-controlled loop?


    Answer:


    We can repeat a command for a predefined number of times, without using a counter-controlled
    loop using the repeat command, e.g.,


    repeat 5 ls >> listings


    31: csh and tcsh both support the filename and command completion feature. But
    the feature works differently in csh than in tcsh. Name the differences.


    Answer:


    When you use tcsh, the commands and filenames are automatically completed when
    you press the Tab key.


    When you use csh, you have to set the filec variable for word completion to work.
    In csh, the Esc key has to be pressed for word completion.


    32: Name the special login files for csh and tcsh in the order used by each shell.


    Answer:


    If the command is executed from the (“/etc/csh.cshrc& /etc/csh.login”) system
    files, the login shell will be started. It will run the commands given in the
    files present in the home directory of the user.


    a) ~/.cshrc or ~/.tcshrc: During shell startup, it gets executed for each instance
    of the shell. If ~/.cshrcs present, ‘tcsh’ uses this file else executes ‘~/.tcshrc’


    b) ~/.login: at login it is executed after .cshrcby login shell


    c) ~/.cshdirs: After .login (tcsh), it is executed by login shell


    33: What do the following lines do? Explain the differences.


    ls > filename


    ls >! Filename


    Answer:


    In both forms, the output of ls command is redirected to filename. If filename
    does not exist, it will be created, otherwise it will be truncated. When the first
    form is used, if shell parameter noclobber is set and filename is an existing
    file, an error results. The ''!'' in the second form is used to suppress that
    check.


    34: You can run a script by its name, using an alias or using source. Explain
    the differences in using each of the three methods. When is it suitable to use
    each method?


    Answer:


    A script executed by name is not run in current process (a child process is created
    to run the script), so this method is suitable to be used only if the environment
    variables and globally defined aliases (in $HOME/.cshrc) should be known to the
    script.


    The method that executes a script using an alias is a variant of executing the
    script by name. In addition, if the alias is defined from shell prompt, it applies
    only to the current process. To make the alias global, you must define it in $HOME/.cshrc,
    but be careful to keep the number of aliases included there to a relatively small
    number.


    With the third method, the script runs in the current process, thus, any aliases
    defined in the current process will be known to your script.


    35: How could you override a defined alias? Give a simple example.


    Answer:


    You can define alias with the “\” or backslash. To create an alias of a script,
    use the “\” before its name and give the filename. Within this, you can customize
    how your overridden alias should function. For example,


    \mymethod<myfilename>


    @varname++


    End


    36: You plan to write a script that will process the file passed to it as the
    only argument on the command line. So, your script must accept at least one argument
    and this single or first argument must be an existing file. Write the necessary
    checks, displaying the appropriate messages.


    Answer:


    The following piece of code should be added to your code before you start processing
    the file content.


    #!/bin/csh


    if ( $#argv == 0 ) then


    echo Error: A file name must be supplied as argument


    exit 10


    else if ( ! -e $1 ) then


    echo Error: $1 is not an existing file


    exit 11


    endif


    After this, you can add the code to process the content of the file.


    37: Write a code excerpt that processes (here, just displays) the elements of
    an array, from the first one to the last one.


    Answer:


    set myarray = (value1, value2, value3, value4, value5)


    set i = 1


    while ( $#myarray > 0 )


    echo "$i array''s element is: $myarray[1]"


    shift myarray


    @ i++


    end


    or,


    set myarray = (value1, value2, value3, value4, value5)


    set i = 1


    foreach val ( $myarray[*] )


    echo "$i array''s element is: $val"


    @ i++


    End


