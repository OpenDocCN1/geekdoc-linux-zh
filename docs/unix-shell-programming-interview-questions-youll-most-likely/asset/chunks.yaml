    \n```bash\nman sort\n```\n\nand then search the keyword \"reverse\" (the search\
    \ starts using the `/`).\n\n### 108: The first line of a shell script is:\n\n\
    ```bash\n#!/bin/bash\n```\n\nHow does the shell interpret this line?\n\nAnswer:\n\
    \nThe `exec` system call which is invoked to start a script will check the first\
