    \n# UNIX Shell 编程\n\n## 面试题\n回顾这些典型的面试题，并思考你将如何回答。阅读列出的答案；你将找到最佳答案以及策略和建议。\n\n\
    *****\n\n## C Shell - 初级 (#chapter0000.html)\n\n### 1: 在首次通过名称或别名运行你的新脚本之前，你必须做什么？\n\
    \n**答案：**\n你必须赋予它可执行权限，即执行命令：\n```\nchmod +x scriptname\n```\n\n### 2: 用户的 `.login`\
    \ 脚本中包含以下命令：\n```bash\nalias whois 'grep ^ /etc/passwd'\n```\n当用户执行以下命令时，输出是什么？\n\
    ```bash\nwho is guru\n```\n**答案：**\n如果存在一个名为 \"guru\" 的定义用户账户，或者 `/etc/passwd`\
    \ 文件中其他地方包含字符串 guru，则输出将是包含字符串 `\"guru\"` 的条目；否则，输出将是一个空行。\n\n### 3: 如果条件 `If\
    \ (-r filename)` 失败（返回假），可能的原因有哪些？\n\n**答案：**\n可能的原因有：\na) 进程所有者不可读取 `filename`\n\
    b) `filename` 不存在\n\n### 4: 下述两个语句之间的区别是什么？\n```bash\nset var = 10\nset var=10\n\
    ```\n**答案：**\n在 `set var = 10` 中，等号两边的空格会导致 Shell 设置两个变量 `var` 和 `10`。在 `set var=10`\
    \ 中，它正确地将值 `10` 赋值给变量 `var`。\n\n### 5: 给定以下代码，`var` 的值是多少？\n```bash\nset var=10\n\
    set var=20\necho $var\n```\n**答案：**\n输出将是 `20`，因为第二个 `set` 命令覆盖了 `var` 的原有值。\n\
    \n### 6: 以下命令的输出是什么？\n```bash\nset list=(apple banana cherry)\necho $#list\n```\n\
    **答案：**\n输出将是 `3`，因为 `$#list` 返回数组 `list` 中的元素个数。\n\n### 7: `rehash` 命令的作用是什么？\n\
    \n**答案：**\n`rehash` 命令清除 shell 内部的可执行命令和函数的哈希表，强制其重新在 `PATH` 中搜索这些命令。\n\n### 8:\
    \ 如何检查一个文件是否为目录？\n\n**答案：**\n你可以在 `if` 语句中使用 `-d` 运算符：\n```bash\nif (-d dirname)\
    \ then\n    echo \"It is a directory\"\nendif\n```\n\n### 9: 如何向数组添加一个元素？\n\n\
    **答案：**\n你可以使用 `+=` 运算符：\n```bash\nset list += (new_element)\n```\n\n### 10: `$?`\
    \ 变量的用途是什么？\n\n**答案：**\n`$?` 变量存储最近一次执行的命令的退出状态。\n\n### 11: 如何遍历数组中的元素？\n\n**答案：**\n\
    你可以使用 `foreach` 循环：\n```bash\nforeach item in ($list)\n    echo $item\nend\n```\n\
    \n"
- fmt: "\nThe first `echo` will display `c1` `c4` `c2` `c5` `c1`, while the second\
    \ displays only `c1`.\n\n## 21: Display the first and last arguments of a script,\
    \ regardless of the number of arguments, and without a loop.\n\nAnswer:\n\n```bash\n\
    my_var3 = $#argv\nechomy_var1: $argv[$1]\nechomy_last_var: $argv[$my_var3]\n```\n\
    \n## 22: How will you set the ‘search path’ in csv?\n\nAnswer:\n\nSearch path\
    \ in `csv` can be set as follows:\n\na) `setenv PATH\"/myfolder1 /bin: /myfolder2\
    \ /myfile3\"`\n\nb) using list\n\n```bash\nset path = =( /myfolder1 /bin /myfolder2\
    \ /myfile3 )\n```\n\n## 23: Create a tar archive into /home/user1/myarch.tar,\
    \ including all files ending in .c, .h, .l, .y,.o and .cc and also the Makefile\
    \ from two directories, ~/dir1 and ~/dir2.\n\nAnswer:\n\n```bash\ntar cvf /home/user1/myarch.tar\
    \ ~/{dir1,dir2}/{Makefile,*.{c,h,l,o,y,cc}}\n```\n\nor\n\n```bash\ntar cvf /home/user1/myarch.tar\
    \ ~/dir1/Makefile ~/dir1/*.[chloy] ~/dir1/*.cc ~/dir2/Makefile ~/dir2/*.[chloy]\
    \ ~/dir2/*.cc\n```\n\n## 24: Your script must be executed with exactly two arguments,\
    \ otherwise would be terminated. Write a code to implement these checks.\n\nAnswer:\n\
    \n```bash\nif ($#argv <> 2) then\n  echo \"Usage: $0 arg1 arg2\"\n  echo \"You\
    \ must give exactly two parameters\"\n  exit 20\nendif\n```\n\n## 25: Write a\
    \ pipeline that reads from the j-th line up to the k-th line of a text file, without\
    \ using awk.\n\nAnswer:\n\n```bash\nset total = `cat textfile | wc -l`\nset j\
    \ = 10\nset k = 18\n@ count = $k - $j\nhead -$k textfile | tail -$count\n```\n\
    \n*****\n\n## [C Shell – Intermediate](#chapter0000.html)\n\n## 26: Explain the\
    \ following commands:\n\n```bash\nset names = (John Kathrin Chris Jacob)\nset\
    \ names = ($names[1-2] Angela $names[3-])\n```\n\nAnswer:\n\nFirst command creates\
    \ an array named `names` with the four names as its elements.\n\nSecond command\
    \ adds name `Angela` between `Kathrin` and `Chris`.\n\n## 27: How could you move\
    \ cursor to specified coordinates on screen? (tcsh)\n\nAnswer:\n\nWe can move\
    \ the cursor to specified coordinates on the screen using the following code:\
    \ `echotcm column row`\n\n## 28: What is the result of this loop?\n\n```bash\n\
    foreach i ([A-Z]*)\n  ? mv $i $i.csh\nend\n```\n\nAnswer:\n\nThe loop renames\
    \ all files that begin with a capital letter, adding the \"extension\" `.csh`.\n\
    \n## 29: Assuming there is a label cleanup somewhere in a script, explain the\
    \ command onintr cleanup.\n\nAnswer:\n\nThe script will branch to label `cleanup`\
    \ if it catches an interrupt signal.\n\n## 30: Is there a way to repeat a command\
    \ for a predefined number of times, without using a counter-controlled loop?\n\
    \nAnswer:\n\nWe can repeat a command for a predefined number of times, without\
    \ using a counter-controlled loop using the `repeat` command, e.g.,\n\n```bash\n\
    repeat 5 ls >> listings\n```\n\n## 31: csh and tcsh both support the filename\
    \ and command completion feature. But the feature works differently in csh than\
    \ in tcsh. Name the differences.\n\nAnswer:\n\nWhen you use `tcsh`, the commands\
    \ and filenames are automatically completed when you press the `Tab` key.\n\n\
    When you use `csh`, you have to set the `filec` variable for word completion to\
    \ work. In `csh`, the `Esc` key has to be pressed for word completion.\n\n## 32:\
    \ Name the special login files for csh and tcsh in the order used by each shell.\n\
    \nAnswer:\n\nIf the command is executed from the (`/etc/csh.cshrc` & `/etc/csh.login`)\
    \ system files, the login shell will be started. It will run the commands given\
    \ in the files present in the home directory of the user.\n\na) `~/.cshrc` or\
    \ `~/.tcshrc`: During shell startup, it gets executed for each instance of the\
    \ shell. If `~/.cshrc` present, `tcsh` uses this file else executes `~/.tcshrc`\n\
    \nb) `~/.login`: at login it is executed after `.cshrc` by login shell\n\nc) `~/.cshdirs`:\
    \ After `.login` (`tcsh`), it is executed by login shell\n\n## 33: What do the\
    \ following lines do? Explain the differences.\n\n```bash\nls > filename\nls >!\
    \ Filename\n```\n\nAnswer:\n\nIn both forms, the output of `ls` command is redirected\
    \ to `filename`. If `filename` does not exist, it will be created, otherwise it\
    \ will be truncated. When the first form is used, if shell parameter `noclobber`\
    \ is set and `filename` is an existing file, an error results. The `!` in the\
    \ second form is used to suppress that check.\n\n## 34: You can run a script by\
    \ its name, using an alias or using source. Explain the differences in using each\
    \ of the three methods. When is it suitable to use each method?\n\nAnswer:\n\n\
    A script executed by name is not run in current process (a child process is created\
    \ to run the script), so this method is suitable to be used only if the environment\
    \ variables and globally defined aliases (in `$HOME/.cshrc`) should be known to\
    \ the script.\n\nThe method that executes a script using an `alias` is a variant\
    \ of executing the script by name. In addition, if the `alias` is defined, it\
    \ can be overridden.\n\nThe `source` method executes the script in the current\
    \ shell environment.\n\n## 35: How could you override an alias? Give an example.\n\
    \nAnswer:\n\n```bash\n\\ filename\n```\n\nYou can override an alias by using a\
