    Example:


    ls>> myfile2


    -Output of the ‘ls’ command will be appended to the ‘myfile2’


    228: What is the purpose of ‘2>’ in UNIX shell?


    Answer:


    It redirects the error of a program to a specified file.


    Example:


    myprogram 2> myfileerr2


    -Redirects the error of the ‘myprogram2’ to the file ‘myfileerr2’


    229: How will you get the output of a previous command as an input to the subsequent
    command?


    Answer:


    We can get the output of a previous command as an input to the subsequent command
    using ‘pipeline(|)’.


    Example:


    ls –s | grep mysearch1


    ‘ls’ gives the list of file names and the names that match with the ‘mysearch1’
    will be output to the user.


    230: Which commands are used to print the nth line of a file?


    Answer:


    sed or head commands are used to print the nth line of a file.


    Syntax:


    Sed –n ‘<line number> p’ my_file.txt


    head –<n> my_file1.txt | tail -1


    Example:


    To print the 7th line of the file,


    sed –n ‘7 p’ my_file1.txt


    head –7 my_file1.txt | tail -1


    231: How will you search for a file in folders?


    Answer:


    We can search for a file in folders using grep command.


    Example:


    grepki my_folder1/folder2


    ki - file name


    folder1 and folder2 - file’s path


    To ignore cases, use ‘i’


    grep -i “ki” my_folder1/folder2


    232: What is the purpose of ‘-r’ and ‘-v’ in grep command?


    Answer:


    The purpose of ‘-r’ and ‘-v’ in grep command are:


    a) It searches recursively for the pattern in all files


    Example:


    grep –r “name” /myfold1/myfile1


    b) ‘-v’ – display the lines that does not contain the given word


    Example:


    grep –v “name” /myfold1/myfile1


    233: How will find a directory of a file?


    Answer:


    We can find the directory of a file using ‘ff’. It returns the directory in which
    the file is present. The starting letter of the file name can also be given.


    Example:


    ff myfile2


    234: How will you kill a process?


    Answer:


    We can kill a process using kill command. Id of the process should be known to
    kill a process. It can be retrieved by using ps command.


    Example:


    kill 22230


    235: What are the ways to create a file?


    Answer:


    A file can be created in the following ways:


    a) Using vi command. The files can be edited using cat command


    Example:


    vi my_filename2


    b) Using emacs It is a type of editor that allows to create and edit a file


    Example:


    emacs my_filename2


    236: What are the ways to get name of the ‘cpu’ model?


    Answer:


    The ways to get the name of the ‘cpu’ model are:


    a) Using ‘grep’. “grep –i ‘model’ /proc/mycpuinfo” returns the model name


    b) Using grep with pipeline command. “#cat /proc/mycpuinfo | grep –i ‘model’ ”returns
    the model name of ‘cpu’


    237: How will you get the number of words in a file?


    Answer:


    We can get the number of words in a file using wc command. It returns total number
    of lines, words, bytes and name of the file.


    Example:


    wc myfile_name1


    *****


    [Variables and Arrays](#chapter0000.html)


    238: What are positional parameters?


    Answer:


    Positional parameters are the arguments passed to a script from the command prompt.
    It is usually denoted by the number of its position such as $0, $1, $2 etc. After
    $9, the positional parameters are accessed with ${10}, ${11} etc. with the position
    within braces. $* and $@ denotes all the parameters.


    239: Explain the shift command.


    Answer:


    The shift command will shift the positional parameters one position to its left.
    So, with the shift command, $3 will be $2 and $2 will be $1 and so on and so forth.
    For all positions in two digits or more, you have to use them within braces.


    240: Does = and -eq function similarly?


    Answer:


    The = is usually used as the assignment operator, that is, to assign values to
    a variable. The == is used for comparison. The -eq command is also used for comparison.
    The difference is that while == does a lexical or string comparison, -eq does
    a numeric comparison.


    241: How will you initialize and print the values in UNIX?


    Answer:


    Initialization:


    my_variable=”my_value” //without any space before or after equal sign


    Print:


    echo $my_variable


    242: How will you concatenate the variables in UNIX?


    Answer:


    We can concatenate the variables in UNIX using ‘$’.


    Example:


    my_var1=“Good”


    my_var2=“$my_var1 Morning”


    my_var3=“$my_var2 Ki”


    echo $my_var3 //Good Morning Ki


    243: How will you make a variable read-only?


    Answer:


    We can make a variable read-only by using read-only. After setting the variable
    to read only mode, changing the variable generates error.


    Example:


    my_var1=“Status”


    readonly my_var1


    my_var1=“Cool” //error


    244: How will you delete a variable?


    Answer:


    We can delete a variable using unset. The variables that are ‘read-only’ cannot
    be deleted.


    Example:


    my_var1=“Status”


    unset my_var1


    echo $ my_var1 //nothing will be printed


    245: What are the types of variables?


    Answer:


    The different types of variables are:


    a) Environment: Accessed by child processes of the shell


    b) Local: Accessed by present instance of the shell


    c) Shell: set and used by shell


    246: How will you get the file name and number of arguments accepted by the current
    script?


    Answer:


    We can get the file name and the number of arguments accepted by the current script
    using ‘$0’ and ‘$#’ with echo command.


    a) $0: returns the file name


    b) $#: returns the number of arguments accepted by the script


    247: How will you get the status of the last executed command?


    Answer:


    We can get the status of the last executed command using ‘$?’. It returns a numerical
    value. It returns ‘0’ for successful execution, ‘1’ for unsuccessful execution
    and other values representing some kind of errors.


    248: How will you achieve ‘do-while’ looping?


    Answer:


    #!/bin/sh


    my_cnt1=$9#Initialization


    while [ $my_cnt1 -gt 5 ]#condition


    do


    echo $my_cnt1Hellllo!


    my_cnt1=$(expr $my_cnt -1) #decrement


    done


    echo COMPLETED!!


    249: How will you call a function in UNIX?


    Answer:


    Syntax:


    my_var1=$(function_name1 $my_arg1 $my_arg2)


    function_name - function to be called


    my_arg1,my_arg2 - arguments to be passed


    250: What are the ways to get the process id of a shell?


    Answer:


    The different ways to get the process id of a shell are:


    a) Using ‘ps’. It lists all the processes with the corresponding details like
    id, name, etc


    Example:


    ps –u my_name3


    b) Using ‘$$’. It returns the process id of the current shell


    Example:


    echo $$


    251: How will you initialize an array?


    Answer:


    my_arrvar1 [index]=my_val


    Example:


    status1[0]= “Good”


    status1[1]= “Excellent”


    a) In ‘ksh’ shell, initialization will be


    set –A my_arrvar1 my_val1 my_val2 ...my_valn


    b) In ‘bash’ shell


    my_arrvar1=(my_val1 my_val2 ... my_valn)


    252: How will you access the array variables?


    Answer:


    a) Using ‘$’


    Example:


    echo ${my_arrvar1[1]}


    To access all the values of an array:


    a) Use ‘[*]’


    Example:


    echo ${my_arrvar1[@]}


    b) Use ‘[@]’


    Example:


    echo ${my_arrvar1[@]}


    *****


    [Special Shell Variables](#chapter0000.html)


    253: Explain the special shell variables.


    Answer:


    Shell has some special variables which offer special values that are otherwise
    not accessible within the script or program. Here are some of the special shell
    variables commonly used:


    a) $0: current script’s filename


    b) $#: the number of arguments passed on while calling a script


    c) #?: The exit status of the script


    d) $$: gives out the process id of the script


    254: How do you check if a string is empty with an operator?


    Answer:


    Checking an empty string is not possible with the usual comparison operators.
    You cannot use == to check if the string is empty. The -eq command also cannot
    be used for string comparison. Instead, the -z operator is used to check for empty
    string. To check if the string is not empty, the -n operator can be used.


    255: Describe the purpose of ‘killring(‘’)’.


    Answer:


    a) It indicates how many killed strings will be in memory. Default value is ‘30’


    b) It keeps only most recently killed memory when set less than ‘2’or ‘unset’'
