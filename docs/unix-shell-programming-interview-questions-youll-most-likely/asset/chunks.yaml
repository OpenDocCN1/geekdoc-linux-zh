    \ the subshell can access the variables outside of it, it cannot change their\
    \ values except inside the subshell.\n\nFor example, you have a variable `var1`\
    \ in the main shell which was initially assigned the value `5`. Within a subshell,\
    \ it was assigned the value `8`. Within the subshell, it will have the value `8`,\
    \ but once outside the subshell, it will have the value `5` only.\n\n### 105:\
    \ Consider the following message:\n\n\"bash: scriptfile: Execute permission denied.\"\
    \n\nHow could you fix it (assuming that you are the owner of scriptfile)?\n\n\
    Answer:\n\nThe user does not have permission to execute on `scriptfile`. We could\
    \ run the following command to grant execute permission for everybody:\n\n```\n\
    chmod +x scriptfile\n```\n\n### 106: The case statement is useful for comparing\
    \ the value of a variable against a list of possible matches. True or false?\n\
    \nAnswer:\n\nTRUE\n\n### 107: You don't remember the correct option (switch) for\
