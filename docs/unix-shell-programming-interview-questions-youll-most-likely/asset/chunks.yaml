    echo -e "GET1 / HTTP/1.0\n" >&3


    cat<&3


    When a command is executed on the file /dev1/my_tcp_2/$host1/$port_ pseudo-device2,
    TCP connection will be opened by ‘Bash’ to the associated socket. Hence it may
    issue a HTTP GET.


    208: Write the code to return a randomly selected index of an array (integer indexed),
    selecting a random element of the array.


    Answer:


    Array=( `ls -a` ) # Initialize an array


    R_INDEX=$(($RANDOM%${#Array[@]})) #${Array[@]} returns the length of Array


    # $RANDOM%${#Array[@]} returns random integer between 1 and length of array


    R-ELEM=${Array[$R_INDEX]}


    echo "Randomly selected element is $R_ELEM with index number $R_INDEX"


    209: Write a snippet to return a randomly selected string index of an associative
    array and the element associated with this index.


    Answer:


    declare -A ass_array


    ass_array[John]="john.k@domain1.com"


    ass_array[Chris]="chris.sm@hotmail.com"


    ass_array[Angela]="angela.st@domain5.com"


    indices=(${!ass_array[*]})


    count=${#indices[@]}


    r_index_pos=$(($RANDOM%${#indices[@]}))


    r_index=${indices[$r_index_pos]}


    r_element=${ass_array[$r_index]}


    echo "Randomly selected element is $r_element with index $r_index"


    210: Name the obvious advantage of an “and” list.


    Answer:


    The obvious advantage of an “and” list is that they can effectively replace complex
    if/then and/or case structures.


