    The command changes the current working directory to the previous working directory.
    It is equivalent to cd $OLDPWD.


    120: Which are the special meanings of character ~ for the bash shell?


    Answer:


    The special meanings of character ~ are:


    a) The ~ is equivalent to $HOME, that is, to the home directory of the user


    b) ~dbuser1 corresponds to the home directory of user dbuser1, if there is such
    a user; otherwise, it is treated as the literal string ~dbuser1


    c) ~+ means the current working directory, so it is equivalent to $PWD


    d) ~- means the previous working directory, so it is equivalent to $OLDPWD


    e) =~ is a regular expression match


    121: What is the difference between variable5 and $variable5?


    Answer:


    variable5 is the name of a variable, and $variable5 is a reference to the value
    of this variable.


    122: What is defined with the command variable=value, a local or an environment
    variable?


    Answer:


    A local variable is defined with the given command.


    123: How can you find the bash shell version that is installed on your system?


    Answer:


    We can find the bash shell version of our system using:


    echo $BASH_VERSION


    For more details, use the array BASH_VERSINFO.


    124: What does the bash built-in variable EDITOR do?


    Answer:


    The bash built-in variable EDITOR invokes the default editor, usually vi or emacs.


    125: What is the purpose of shell built-in variable PATH?


    Answer:


    To define a list of paths to executables, PATH will be used by shell to find those
    files by their relative names.


    126: Is there any way to declare an integer variable in bash?


    Answer:


    Yes, we can declare an integer variable in bash using the typeset -i command (or
    the equivalent declare).


    127: How would the shell interpret the command "echo ??a"?


    Answer:


    Before starting the execution of echo, the shell will replace the two ??. For
    the shell, the ? represents any one character in a filename. But the first dot
    in a filename cannot be substituted by any character and should be given literally.
    This command would output any files and subdirectories in current directory, which
    have a name comprising of three characters, except the ones starting with a dot.


    *****


