    59: A script prompts the user to type in something, using the following syntax:


    echo -n "Enter some input ->"


    set IN = $<


    What would happen if the user had typed? A B C D E


    Correct your syntax to avoid the possible problems.


    Answer:


    The shell replaces the $ < with the user input, that is:


    set IN = A B C D E


    and then executes that command. This set command, however, will assign the value
    A to the IN variable, a C to the B variable, an E to the D variable, so after
    the execution of the above command, in the script there will be 3 variables, instead
    of one (IN).


    The solution is to use $< in quotes (double):


    set IN = "$<"


    Thus, when the user inputs the string A B C D E, the shell will have the following
    command to execute:


    set IN = "A B C D E"


    and it will assign the quoted string to the IN variable.


    *****


    [C Shell - Advanced](#chapter0000.html)


    60: Explain local vs environment variables.


    Answer:


    Local variables are exclusive to the shell in which they are set. Environment
    variables are available to all subshells within the environment. While local variables
    are created inside specific shells, the environment variables are set in the .cshrc 
    file or .login file. Environment variables inherit the value of its parent. While
    the child can change the value set by the parent, the parent cannot change the
    value of its child.


    61: Explain search path.


    Answer:


    The search path contains the path of various executables to search for shell executables
    when the shell is unable to identify a particular command. It is set as the environment
    variable in the prompt. You can change the default search path to a custom one
    and add multiple search paths where you have stored different executables with
    scripts. You can set and view the search path using the path system variable.


    62: Explain Globbing.


    Answer:


    Globbing lets you search for a set of files or directories using a wildcard. When
    you are searching for a file or directory and you are not sure of its exact name,
    you can use a wildcard to search. Globbing expands the wildcard possibilities
    to bring you the list of files and directories based on the regular expression
    that depicts the name.


