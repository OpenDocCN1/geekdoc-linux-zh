    # 204: Explain this code snippet.


    ```bash

    coproc { cat datafile; sleep 2; }


    while read -u ${COPROC[0]} record

    do

    echo "$record" | cut -c2-

    done


    kill $COPROC_PID

    ```


    **Answer:**


    The `coproc` builtin enables two parallel processes to communicate and interact.
    This co-process communicates with the `while read` loop. `${COPROC[0]}` is the
    file descriptor of the co-process. So, the `while-read` loop reads file `datafile`
    line by line and removes the first character of each line from the output. At
    the end, when there is no longer need of the co-process, it kills its PID (`$COPROC_PID`).


