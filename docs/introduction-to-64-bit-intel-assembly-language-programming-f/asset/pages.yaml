- img_proc: true
  md: '# CHAPTER 4. MEMORY MAPPING IN 64 BIT MODE


    # 4.2 Page Map Level 4


    A virtual address can be broken into fields like this:


    | 63-48 | 47-39 | 38-30 | 29-21 | 20-12 | 11-0 |

    | --- | --- | --- | --- | --- | --- |

    | unused | PML4 index | page pointer index | directory index | table index | page
    offset |


    Here we see that a virtual or logical address is broken into 6 fields. The top-most
    16 bits are ignored to be a sign extension of 47, but they are not part of the
    address translation. Following the unused bits are four 9 bit fields which undergo
    translation and finally a 12 bit offset. The result of the translation process
    will be a physical address like 0x7ffff0080000 combined with the offset (let''s
    say it was 0x1f0 to yield a physical address of 0x7ffff0081f0).


    Pages of memory are $2^{12} = 4096$ bytes, so the 12 bit offset makes sense. What
    about those 9 bit fields? Well, addresses are 8 bytes so you can store 512 addresses
    in a page and $512=2^9$, so 9 bit fields allow storing each of the 4 types of
    mapping tables in a page of memory.


    Bits 47-39 of a virtual address are used as an index into the PML4 table. The
    PML4 table is essentially an array of 512 pointers. These pointers point to pages
    of memory, so the rightmost 12 bits of each pointer can be used for other purposes
    indicating whether an entry is valid or not. Generally not all entries in the
    PML4 will be valid.


    Let''s suppose CR3 has the physical address 0xffff000. Then let''s suppose that
    bits 47-39 of our sample address are 0x001, then we would have an array in memory
    at 0xffff0000 and we would access the second entry (index 1) to get the address
    of a page directory pointer table - 0x347000.


    | PML4 at 0xffff0000 |

    | --- |

    | 0 | 0x346000 |

