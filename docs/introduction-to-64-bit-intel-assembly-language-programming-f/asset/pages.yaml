    # 15.3 Hash tables


    A hash table is an efficient way to implement a dictionary. The basic idea is
    that you compute a hash value for the key for each item in the dictionary. The
    purpose of the hash value is to spread the keys throughout an array. A perfect
    hash function would map each key to a unique location in the array used for hashing,
    but this is difficult to achieve. Instead we must cope with keys with which “collide”.


    The simplest way to cope with collisions is to use a linked list for each location
    in the hash array. Consider the illustration below:


    ![](img/443639abd490bee82d518502d35b07b9_175_0.png)


    In this hash table, keys 12, 4, 16 and 9 all have hash values of 1 and are placed
    on the list in location 1 of the hash array. Keys 13 and 8 both have hash values
    3 and are placed on the list in location 3 of the array.

    The remaining keys are mapped to 5 and 7.


    One of the critical issues with hashing is to develop a good hashing function.
    A hashing function should appear almost random. It must compute the same value
    for a particular key each time it is called for the key, but the hash values aren''t
    really important - it''s the distribution of keys onto lists that we want a lot
    of short lists. This means that the array size should be at least as large as
    the number of keys expected. Then, with a good hash function, the chains will
    generally be'
