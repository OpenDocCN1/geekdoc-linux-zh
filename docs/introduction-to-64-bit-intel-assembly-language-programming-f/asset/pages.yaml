    Here we present an example with several functions which process arrays. This application
    allocates an array using malloc, fills the array with random numbers and computes
    the minimum value in the array. If the array size is less than or equal to 20,
    it prints the values in the array.


    # 10.4.1 Creating the array


    The array is created using the create function shown below. This function is perhaps
    too short to be a separate function. It multiplies the array size by 4 to get
    the number of bytes in the array and then calls malloc.


    ```

    array = create ( size );ncreate:

    ```'
