    When you are done reading or writing a file you should close it. The only parameter
    for the close system call is the file descriptor for the file to close. If you
    exit a program without closing a file, it will be closed by the operating system.
    Data read or written using file descriptors is not buffered in the user program,
    so there will not be by any unwritten data which might be lost. This is not true
    for using FILE pointers which can result in lost data if there is no close. The
    biggest advantages to closing files are that it reduces overhead in the kernel
    and avoids running into the per-process limit on the number of open files.


