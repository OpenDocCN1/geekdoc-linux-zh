    # 7.7 Extracting and filling a bit field


    To extract a bit field you need to shift the field so that its least significant
    bit is in position 0 and mask the field with an operation with the appropriate
    mask. Let''s suppose we need to extract bits 23-51 from a quad-word stored in
    a memory location. Then, after loading the quadword, we need to shift it 23 bits
    to get the least significant bit into the proper position. The bit field is of
    length 29. The simplest way to get a proper mask (29 1 bits) is using the value
    0x1ffffff. Seven''s is 28 bits and the 1 gives a total of 29 bits. Here is the
    code to do the work:


    ```

    mov ra, [sample]    ; move quad-word into ra

    shr ra, 23           ; shift to align bit 23 at 0

    and ra, 0x1ffffff ; select the 29 low bits

    mov [field], ra      ; save the field

    ```'
