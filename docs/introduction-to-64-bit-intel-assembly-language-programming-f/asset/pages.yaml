  md: '# Appendix D


    # Sources for more information


    # D.1 yasm user manual


    http://www.tortall.net/projects/yasm/manual/html/index.html is the location of
    the yasm user manual. This is quite extensive and a good reference for learning
    more about yasm.


    # D.2 nasm user manual


    Look at http://www.nasm.us/doc/ for the nasm user manual. This is the software
    which nasm is based on and the documentation is fairly similar to the yasm manual.


    # D.3 Dr. Paul Carter’s free assembly book


    Dr. Carter has prepared an excellent book on 32 bit x86 programming which can
    be downloaded at http://www.drpaulcarter.com/pcasm/.


    # D.4 64 bit Machine Level Programming


    Drs. Bryant and O''Hallaron of Carnegie Mellon have provided an excellent treatise
    dissecting how gcc takes advantage of the x86-64 architecture'
