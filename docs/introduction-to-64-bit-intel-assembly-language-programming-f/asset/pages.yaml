  md: '# CHAPTER 7. BIT OPERATIONS


    number of bits can be an immediate value or the cl register. There are no other
    choices for the number of bits to shift.


    C contains a shift left operator (<<) and a shift right operator (>>). The decision
    of logical or arithmetic shift right in C depends on the data type being shifted.


    Here are some examples of shifting:


    ```

    1010101b >> 2 == 0010101b

    1001101b << 4 == 100110100000b

    01234567 >> 4 == 0x1234567

    0x1234567 << 4 == 0x12345670

    0abcd >> 8 == 0x00ab

    ```


    To extract a bit from a word, you first shift the right word until the most significant
    bit position (bit 0) and then the word with a value having a string of 1 bits
    in bit 0 through n-1 where n is the number of bits in the field to extract. For
    example extract bits 4-7, shift right four bits, and then with 0xf.


    To place some bits into position, you first need to clear the bits and then the
    new field into the value. The first step is to build the mask with the proper
    number of 1''s for the field width starting at bit 0. Then shift the mask to align
    the mask with the value to hold the new field. Negate the mask to form an inverted
    mask. And the value with the inverted mask to clear the bits. Then shift the new
    value left the proper number of bits or with this value.


    It''s time to see some examples:


    ```

    mov     rax, 0x12345678

    shr    rax, 8             ; I want bits 8-15

    and     rax, 0xff        ; rax holds 0x56

    mov     rax, 0x12345678  ; I want to replace bits 8-15

    mov     rdx, eax          ; rdx holds replacement field

    mov     rbx, 0xff        ; I need an 8 bit mask

    shl    rbx, 8             ; Shift mask to align & bit 8

    not     rbx               ; rbx is the inverted mask

    and     rax, rbx          ; Now bits 8-15 are all 0

    shl    rdx, 8             ; shift the new bits to align

    or      rax, rdx          ; rax now has 0x1234aa78

    ```'
