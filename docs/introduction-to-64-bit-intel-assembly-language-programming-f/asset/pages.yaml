    \ It was necessary to use \"extract 128 bit field\", vextractf128, instruction\
    \ to move the top half of these sums into the lower half of a register to prepare\
    \ for adding the 2 halves.\n\nWhen tested with one million calls to compute correlation\
    \ on 10000 pairs of values, the AVX version used 3.9 seconds which amounts to\
    \ 20.5 GFLOPs. This is achieving an average of 6 floating point results in each\
    \ clock cycle. The code had many instructions which did 4 operations and the CPU\
    \ did an excellent job of out-of-order execution. The use of 2 sets of accumulation\
    \ registers most likely reduced the inter-instruction dependency which helped\
    \ the CPU perform more instructions in parallel."
