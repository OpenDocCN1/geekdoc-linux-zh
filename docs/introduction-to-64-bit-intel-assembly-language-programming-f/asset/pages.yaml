    # 16.11 Merge loops


    If you have 2 loops iterating over the same sequence of values and there is no
    dependence between the loops, it seems like a no-brainer to merge the loops. Consider
    the following 2 loops:


    ```

    for ( i = 0; i < 1000; i++ ) a[i] = b[i] + c[i];

    for ( j = 0; j < 1000; j++ ) d[j] = b[j] - c[j];

    ```


    This can easily be merged to:


    ```

    for ( i = 0; i < 1000; i++ ) {

    a[i] = b[i] + c[i];

    d[j] = b[j] - c[i];

    }

    ```


    In general merging loops can increase the size of a loop body, decreasing the
    overhead percentage and helping to keep the pipeline full. In this case there
    is additional gain from loading the values of b and c once rather than twice.


    # 16.12 Split loops


    We got through discussing how merging loops was a good idea. Now we are going
    to learn the opposite - well for some loops. If a loop is operating on 2 independent
    sets of data, then it could be split into 2 loops. This can improve performance
    if the combined loop is exceeding the cache capacity. There is a trade-off between
    better cache usage and more instructions in the pipeline. Sometimes merging is
    better and sometimes splitting is better.


