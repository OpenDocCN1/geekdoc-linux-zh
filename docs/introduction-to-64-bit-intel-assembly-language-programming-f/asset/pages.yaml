  md: '# 15.2 Doubly-linked lists


    You can see the most recently printed number is at the first of the list. By adding
    a function to get and remove (pop) the first element of the list, we could turn
    this into a stack. This is one of the exercises for this chapter.


    A doubly-linked list has 2 pointers for each node: one points to the next node
    and one points to the previous node. It becomes quite simple to manage a doubly-linked
    list if you make the list circular and if you retain an unused cell at the start
    of the list. Here is an example list with 4 data nodes:


    ![](img/443639abd490bee82d518502d35b07b9_171_0.png)


    We see that the variable list points to the first node of the list, called the
    "head node". The head node has a value, but we never use the value. The top pointer
    in each node points to the next node in the list and the bottom pointer points
    to the previous node in the list. The previous pointer of the head node is the
    last node in the list. This makes this list capable of implementing a stack (last-in
    first-out), a queue (first-in first-out) or a double-ended queue (deque). The
    primary advantage of this design is that the list is never really empty - it be
    logically empty but the head node remains. Furthermore, once a list is created,
    the pointer to the head node never changes.'
