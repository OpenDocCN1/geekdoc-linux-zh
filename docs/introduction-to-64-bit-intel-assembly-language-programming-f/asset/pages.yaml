  md: '# CHAPTER 16. HIGH PERFORMANCE ASSEMBLY PROGRAMMING


    +   - strength reduction

    - use registers efficiently

    - use fewer branches

    - convert loops to branch at the bottom

    - unroll loops

    - merge loops

    - split loops

    - interchange loops

    - move loop invariant code outside loops

    - remove recursion

    - eliminate stack frames

    - inline functions

    - eliminate dependencies to allow super-scalar execution

    - use specialized instructions


    # 16.2 Use a better algorithm


    The most important optimization strategy is to use a better algorithm. It would
    be pointless to spend many hours tuning shell, when you could use the qsort function
    within minutes and achieve better performance. Even better still would be to write
    C++ code and use the STL sort function. If you want to program effectively you
    must become an expert in data structures and algorithms.


    If you want to implement a dictionary you will need to consider using a hash table.
    A hash table has O(1) expected time for finding a key. A red-black tree has guaranteed
    O(lgn) expected lookup time. However if you need to have ordered access to the
    keys in addition to simply finding keys, then a red-black tree is a good choice.'
