- img_proc: true
  md: '# 1.4. ASSEMBLY LANGUAGE


    You will observe the use of ";" to signal the start of comments in this program.
    Some of the comments are stand-alone comments and others are end-of-line comments.
    It is fairly common to place end-of-line comments on each assembly instruction.


    Lines of assembly code consist of labels and instructions. A label usually starts
    in column 1, but this is not required. A label establishes a symbolic name to
    the current point in the assembler. A label on a line by itself must have a colon
    after it, while the colon is optional if there is more to the line.


    Instructions can be machine instructions, macros or instructions to the assembler.
    Instructions are usually placed further right than column 1. Most people establish
    a pattern of starting all instructions in the same column.


    The statement .segment .text is an instruction to the assembler itself rather
    than a machine instruction. This statement indicates that the data or instructions
    following it are to be placed in the . text segment or section. In Linux this
    is where the instructions of a program are located.


    The statement .global _start is another instruction to the assembler, called an
    assembler directive or a pseudo opcode (pseudo-op). This pseudo-op informs the
    assembler that the label _start is to be made known to the linker program when
    the program is linked. The _start function is the most basic "entry point" for
    a Linux program. When the system runs a program it transfers control to the _start
    function. A typical C program has a main function which is called indirectly via
    a _start function in the C library.


    The line beginning with _start is a label. Since no code has been generated up
    to this point, the label refers to location 0 of the program’s text segment.


    The remaining 3 lines are symbolic opcodes representing the 3 executable instructions
    in the program. The first instruction moves the constant 1 into register eax while
    the second moves the constant 5 into register ebx. The final instruction generates
    a software interrupt numbered 0x80 which is the way Linux handles 32 bit system
    calls. (This code works on both 32 bit and 64 bit Linux systems.)'
