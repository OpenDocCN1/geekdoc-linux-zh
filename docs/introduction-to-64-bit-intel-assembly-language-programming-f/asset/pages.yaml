  md: "# 15.3. HASH TABLES\n\nquite short.\n\n# 15.3.1 A good hash function for integers\n\
    \nIt is generally recommended that a hash table size be a prime number. However\
    \ this is not very important if there is no underlying pattern to the numbers\
    \ used as keys. In that case you can simply use n mod t where n is the key and\
    \ t is the array size. If there is a pattern like many multiples of the same number,\
    \ then using a prime number for t makes sense. Here is the hash function for the\
    \ example code:\n\n```\ni = hash ( n )\nmov rax, rdi\nand rax, 0xff\nret\n```\n\
    \nThe table size is 256 in the example, so using and gives n mod 256.\n\n# 15.3.2\
    \ A good hash function for strings\n\nA good hash function for strings is to treat\
    \ the string as containing polynomial coefficients and evaluate p(n) for some\
    \ prime number n. In the code below we use the prime number 191 in the evaluation.\
    \ After evaluating the polynomial value, you can perform a modulus operation using\
    \ the table size (100000 in the sample code).\n\n```\nint hash ( unsigned char\
    \ *s )\n{\n  unsigned long h = 0;\n  int i = 0;\n\n  while ( s[i] ) {\n    h =\
    \ h*191 + s[i];\n    i++;\n  }\n  return h % 100000;\n}\n```"
