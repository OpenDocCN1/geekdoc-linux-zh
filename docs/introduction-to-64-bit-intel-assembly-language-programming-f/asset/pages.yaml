  md: '# 9.5. STACK FRAMES


    backtrace). To perform this trick each function must keep a pointer in a 2 quad-word
    object on the stack identifying the previous value of rbp along with the return
    address. You might notice the sequence “push rbp, mov rbp, rsp” in the hello world
    program. The first instruction pushes rbp immediately below the return address.
    The second instruction makes rbp point to that object.


    Assuming all functions obey this rule of starting with the standard 2 instructions,
    there will be a linked list of objects on the stack - one for each function. The
    debugger can traverse through the list to identify the function (based on the
    location of the return address) called and use other information stored in the
    executable to identify the line number for this return address.


    These 2 quad-word objects are simple examples of “stack frames”. In functions
    which do not call other functions (leaf functions), the local variables for the
    function might all fit in registers. If there are too many local variables or
    if the function calls other functions, then there might need to be some space
    on the stack for these local variables. To allocate space for the local variables,
    you simply subtract from rsp. For example leave 32 bytes for local variables in
    the stack frame do:


    ```

    push    rbp

    mov     rbp, rsp

    sub     rsp, 32

    ```


    Be sure to subtract a multiple of 16 bytes to avoid possible problems with stack
    alignment.

    To establish a stack frame, you use the following 2 instructions at the start
    of a function:


    ```

    push    rbp

    mov     rbp, rsp

    ```


