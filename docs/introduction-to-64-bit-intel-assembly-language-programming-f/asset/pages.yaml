  md: '# 16.5. COMMON SUBEXPRESSION ELIMINATION


    ![](img/443639abd490bee82d518502d35b07b9_194_0.png)


    # 16.5 Common subexpression elimination


    Common subexpression elimination is generally performed by optimizing compilers.
    If you are to have any hope of beating the compiler, you must do the same thing.
    Sometimes it may be hard to locate all common subexpressions. This might be a
    good time to study the compiler''s generated code to discover what it found. The
    compiler is tireless and efficient at its tasks. Humans tend to overlook things.


    # 16.6 Strength reduction


    Strength reduction means using a simpler mathematical technique to get an answer.
    It is possible to compute $x^3$ using $pow$, but it is probably faster to compute
    $x*x*x$. If you need to compute $x^4$, then do it in stages


    ```

    x2 = x * x;

    x4 = x2 * x2;

    ```


    If you need to divide or multiply an integer by a power of 2, this can be done
    more quickly by shifting. If you need to divide more than one floating point number
    by $x$, compute $1/x$ and multiply.'
