  md: '# 16.3. USE C OR C++


    Tuning code in assembly language will not convert an $O(n^2)$ algorithm into an
    $O(n \log n)$ algorithm. Tuning can make things faster by some constant factor.
    Only a better algorithm can reduce the complexity.


    # 16.3 Use C or C++


    This suggestion may seem a little crazy, but you can use a compiler for a variety
    of purposes. First there is probably a large part of your application which is
    not worth optimizing and you could write that code in C or C++ and save time,
    while achieving possibly the same performance. Generally a small percentage of
    your code will consume a large percentage of the time. You might need to use a
    profiler to help locate the time-consuming parts. It doesn''t matter much if you
    have a process consuming several hours of CPU time for you tune a part of the
    program which consumes 10 seconds.


    Second you should write a C version of your code and compare your code versus
    C to learn whether you have done better than the compiler. If you can''t beat
    the compiler, why use assembly language? Your goal in using assembly is to make
    things faster. The goal should not be to write assembly code to prove that you
    can do it.


    Finally you can use the -S option of ggc to have it produce an assembly language
    file. Studying this generated code may give you some ideas about how to write
    efficient assembly code.


    # 16.4 Efficient use of cache


    One of the goals in high performance computing is to keep the processing units
    of the CPU busy. A modern CPU like the Intel Core i7 operates at a clock speed
    around 3 GHz while its main memory maxes out at about 21 GB/sec. If your application
    strictly runs from data and instructions in memory using no cache, then there
    would be roughly 7 bytes per cycle. The CPU has 4 cores which need to share the
    21 GB/sec, so we''re down to about 2 bytes per cycle per core from memory. Each
    of these cores has instructions being processed in 3 processing sub units and
    2 memory processing sub units. Each CPU can retire 4 instructions per cycle. The
    same is true for the upcoming AMD Bulldozer CPUs It'
