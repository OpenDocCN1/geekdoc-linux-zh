  md: '# CHAPTER 1. INTRODUCTION


    people soon figured out ways to make the task easier. The first improvement is
    to use words like mov to indicate the selection of a particular instruction. In
    addition people started using symbolic names to represent addresses of instructions
    and data in a program. Using symbolic names prevents the need to calculate addresses
    and isolates the programmer from changes in the source code.


    # 1.4 Assembly language


    Very early in the history of computing (1950s), programmers developed symbolic
    assembly languages. This rapidly replaced the use of machine language, eliminating
    a lot of tedious work. Machine languages are considered "first-generation" programming
    languages, while assembly languages are considered "second-generation".


    Many programs continued to be written in assembly language after the invention
    of Fortran and Cobol ("third-generation" languages) in the late 1950s. In particular
    operating systems were typically nearly 100% assembly until the creation of C
    as the primary language for the UNIX operating system.


    The source code for the 12 byte program from earlier is listed below:


    ```

    Program: exit

    ;

    Executes the exit system call

    ;

    No input

    ;

    Output: only the exit status ($? in the shell)

    ;

    segment .text

    ```


    ```

    _start:

    mov eax,1      ; 1 is the exit syscall number

    m ebx,5      ; the status value to return

    int 0x80      ; execute a system call

    ```'
