    # 15.4.4 Inserting a key into the tree


    The first step in inserting a key is to use the find function to see if the key
    is already there. If it is, then there is no insertion. If not, then a new tree
    node is allocated, its value is set to the new key value and its left and right
    child pointers are set to NULL Then it''s time to find where to place this in
    the tree.


    There is a special case for inserting the first node in the tree. If the count
    of nodes in the tree is 0, then the count is incremented and the tree''s root
    pointer is set to the new node.


    If the tree is non-empty then you start by setting a current pointer to point
    to the root node. If the key is less than the current node''s key, then the new
    node belongs in the left sub-tree. To handle this you inspect the left child pointer
    of the current node. If it is null, you have found the insertion point, so set
    the left pointer to the pointer of the new node. Otherwise update your current
    node pointer to be the left pointer and start comparisons with this node. If it
    is less than the current node''s key, it must be greater than. In that case you
    inspect the current node''s right child pointer and either set it the new node''s
    pointer or advance your current pointer to the right child and repeat the comparison
    process.


