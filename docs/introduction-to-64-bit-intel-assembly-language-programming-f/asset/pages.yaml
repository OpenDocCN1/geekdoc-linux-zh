    # 4.6 Large pages


    The normal size page is 4096 bytes. The CPU designers have added support for large
    pages using three levels of the existing translation tables. By using 3 levels
    of tables, there are 9 + 12 bits left for the page offset field. This makes large
    pages 2²¹ = 2097152 bytes.


    # 4.7 CPU Support for Fast Lookups


    This process would be entirely slow if done every time traversing through all
    tables. Instead whenever a page translation has been performed, the CPU adds this
    translation into a cache called a “Translation Lookaside Buffer” or TLB. Then
    hopefully this page will be used many times going back through the table lookup
    process.


    A TLB operates much like a hash table. It is presented with a virtual page address
    and produces a physical page address or failure within roughly 1/2 of a clock
    cycle. In the case of a failure memory search takes from 10 to 100 cycles. Typical
    miss rates are from 0.01% to 1%.


    Clearly there is a limit to the number of entries in the TLB for a CPU. The Intel
    Core 2 series has a total of 16 entries in a level 1 TLB and 256'
