  md: '# CHAPTER 9. FUNCTIONS


    They can also be omitted in general though it will prevent gdb from being able
    to trace backwards though the stack frames.


    When you have local variables in the stack frame it makes sense to access these
    variables using names rather than adding 8 or 16 to rsp. This can be done by using
    yasm''s equ pseudo-op. The following sets up symbolic names for 0 and 8 for two
    local variables.


    +   x equ 0

    yy equ 8


    Now we can easily save 2 registers in x and y prior to a function calling


    ```

    mov [rsp+x], r8

    mov [rsp+y], r9

    ```


    With any function protocol you must specify which registers must be preserved
    in a function. For the System V ABI, registers rbx, rbp and r12-15 must be preserved,
    while the Windows calling convention requires registers rbx, rbp, rsi, rdi and
    r12-15 must be preserved.


    # 9.6 Recursion


    One of the fundamental problem solving techniques in computer programming is recursion.
    A recursive function is a function which calls itself. The focus of recursion
    is to break a problem into smaller problems. Frequently these smaller problems
    can be solved by the same function. You break the problem into smaller problems
    repeatedly and eventually you reach such a small problem that it is easy to solve.
    The easy to solve problem is called a "base case". Recursive functions typically
    start by testing to see if you have reached the base case or not. If you have
    not reached the base case, then you prepare the easy solution. into subproblems
    and make recursive calls. As you return from recursive calls you assemble solutions
    to larger problems from smaller problems.


    Recursive functions generally require stack frames with local variable storage
    for each stack frame. Using the complete stack frame protocol can help in debugging.'
