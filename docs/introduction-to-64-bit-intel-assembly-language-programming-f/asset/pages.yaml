    # D.7 Intel Documentation


    Intel provides excellent documentation about their processors at

    http://www.intel.com/products/processor/manuals/.


    You should probably review the architecture in "Intel 64 and IA-32 Architectures
    Software Developer''s Manual, Volume 1: Basic Architectures",


    The instructions are described in great detail in "Volume 2A: Instruction Set
    Reference, A-M" and "Volume 2B: Instruction Set Reference, N-Z". These manuals
    are very useful, but some categorization of instructions would help. There are
    a bewildering number of instructions and looking through an alphabetized list
