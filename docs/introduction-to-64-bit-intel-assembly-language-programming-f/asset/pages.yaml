    jmp .end

    case2: mov rbx, 102 ; go here if i == 2

    end: xor eax, eax

    ret

    ```


    In this code we have used a new form of label with a dot prefix. These labels
    are referred to as “local” labels. They are defined within the range of enclosing
    regular labels. Basically the local labels could be used for all labels inside
    a function and this would allow using the same local labels in multiple functions.
    We also used main.case0 outside of main to refer to the .case0 label inside main.


    From this example we see that an unconditional jump instruction can be used to
    implement some forms of conditional jumps. Though conditional jumps are more direct
    and less confusing, in larger switch statements it might be advantageous to build
    an array of locations to jump to.


    # 8.2. Conditional jump


    To use a conditional jump we need an instruction which can set some flags. This
    could be an arithmetic or bit operation. However doing a subtraction to learn
    whether 2 numbers are equal might wipe out a needed value in a register. The x86-64
    CPU provides a compare instruction (cmp) which subtracts its second operand from
    its first and sets flags without storing the difference.


    There are quite few conditional jump instructions with the general pattern:


    ```

    jCC label ; jump to location

    ```


    The CC part of the instruction represents any of a wide variety of condition codes.
    The condition codes are based on specific flags in eflags such as the zero flag,
    the sign flag, and the carry flag. Below are some useful conditional jump instructions.'
