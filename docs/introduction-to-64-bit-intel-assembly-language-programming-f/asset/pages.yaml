    # 12.3.3 lseek system call


    When reading or writing files, it is sometimes necessary to position to a specific
    spot in the file before reading or writing. An example would be writing record
    number 1000 from a file with records which are 512 bytes each. Assuming account
    that record numbers begin with 0, then record 1000 would start at position 1000
    + 512 = 512000. It can be very quick to position to 512000 and write 512 bytes.
    This is also easier than reading and writing the file.


    The lseek system call allows you to set the current position by reading or writing
    a file. Its prototype is


    ```

    long lseek ( int fd, long offset, int whence );

    ```


    The offset parameter is frequently simply the byte position in the file, but the
    meaning of offset depends on the value of whence. If offset is 0, then offset
    is the byte position. If whence is 1, then offset is relative to the current position.
    If whence is 2, then offset is relative to the end of the file. The return value
    from lseek is the position of the next read or write for the file.


    Using lseek with offset 0 and whence equal to 2, lseek will return a byte position
    1 greater than the last byte of the file. This is an easy way to determine the
    file size. Knowing the size, you can allocate an array and read the entire file
    (as long as you have enough RAM).


    ```

    mov      edi, [fd]

    xor      esi, esi    ; set offset to 0

    mov      edx, 2      ; set whence to 2

    call     lseek         ; determine file size

    mov      [size], rax

    ```'
