    # 11.9.3 Polynomial evaluation


    The evaluation of a polynomial of 1 variable could be done at least 2 ways. First
    is the obvious definition:


    ```

    P(x) = p_0 + p_1x + p_2x^2 \cdots p_nx^n.

    ```


    A more efficient way to compute the value is using Horner''s Rule:


    ```

    b_n = p_n

    b_{n-1} = p_{n-1} + b_nx

    b_{n-2} = p_{n-2} + b_{n-1}x

    b_0 = p_0 + b_1x

    ```'
