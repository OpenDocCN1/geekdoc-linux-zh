  md: '# 15.2.3 Inserting at the front of the list


    To insert a new node at the front of the list you need to place the head node''s
    next pointer in the new node''s next slot and place the previous pointer from
    head''s next into the new node''s previous slot. After doing that you can make
    the head node point forward to the new node and make the head''s former next point
    backwards to the new node. These are illustrated in the diagram below. The old
    links are in dashed lines and the new links are numbered, with bold lines.


    ![](img/443639abd490bee82d518502d35b07b9_173_0.png)


    One of the elegant features of the doubly-linked circular list is the elimination
    of special cases. Inserting the first node is done with exactly the same code
    as inserting any other node.

    The code for insertion is


    ```

    ; insert ( list, k);

    insert:

    .list equ 0

    .k equ 8

    push rbp

    mov rsp, rsp, 16

    mov [rsp+.list], rdi ; save list pointer\mov [rsp+.k], esi ; and k on stack\mov
    edi, node_size

    call malloc ; rax will be node pointer\mov r8, [rsp+.list] ; get list pointer\mov
    r9, [r8+next] ; get head''s next

    mov [rax+next], r9 ; set new node''s next

    mov [rax+prev], r8 ; set new node''s prev

    mov [r8+next], rax ; set head''s next

    mov [r9+prev], rax ; set new node''s next''s prev

    ```'
