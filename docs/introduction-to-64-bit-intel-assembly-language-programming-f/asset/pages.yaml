  md: '# CHAPTER 1. INTRODUCTION


    # 1.2 What is a computer?


    A computer is a machine for processing bits. A bit is an individual unit of computer
    storage which can take on 2 values: 0 and 1. We use computers to process information,
    but all the information is represented as bits. Collections of bits can represent
    characters, numbers, or any other information. Humans interpret these bits as
    information, while computers simply manipulate the bits.


    # 1.2.1 Bytes


    Modern computers access memory in 8 bit chunks. Each 8 bit quantity is called
    a "byte". The main memory of a computer is effectively an array of bytes with
    each byte having a separate memory address. The first byte address is 0 and the
    last address depends on the hardware and software in use.


    A byte can be interpreted as a binary number. The binary number 01010101 equals
    the decimal number 85. If this number is interpreted as a machine instruction
    the computer will push the value of the rbp register onto the run-time stack.
    The number 85 can also be interpreted as the upper case letter "U". The number
    85 could be part of a larger number in the computer. The letter "U" could be part
    of a string in memory. It''s all a matter of interpretation.


    # 1.2.2 Program execution


    A program in execution occupies a range of addresses for the instructions of the
    program. The following 12 bytes constitute a very simple program which simply
    exits (with status 5):'
