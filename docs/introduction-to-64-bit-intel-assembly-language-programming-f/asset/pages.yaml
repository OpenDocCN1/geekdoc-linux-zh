  md: '# 2.2. HEXADECIMAL NUMBERS


    A binary constant can be represented in the yasm assembler by appending "b" to
    the end of a string of 0''s and 1''s. So we could represent 741 as 1011100101b.


    An alternative method for converting a decimal number to binary by repeated division
    by 2. At each step, the remainder yields the next higher bit.


    Let''s convert 741 again.


    | division | remainder | bits |

    |---|---||

    | 741/2 = 370 | 1 | 1 |

    | 370/2 = 185 | 0 | 01 |

    | 185/2 = 92 | 1 | 101 |

    | 92/2 = 46 | 0 | 0101 |

    | 46/2 = 23 | 0 | 00101 |

    | 23/2 = 11 | 1 | 100101 |

    | 11/2 = 5 | 1 | 1100101 |

    | 5/2 = 2 | 1 | 11100101 |

    | 2/2 = 1 | 0 | 01100101 |

    | 1/2 = 0 | 1 | 1011100101 |


    The repeated division algorithm is easier since you don''t have to identify (guess?)
    powers of 2 less than or equal to the number under question. It is also easy to
    program.


    # 2.2 Hexadecimal numbers


    Binary numbers are a fairly effective way of representing a string of bits, but
    they can get pretty tedious if string is long. In a 64 bit computer it is fairly
    common to work with 64 integers. Entering a number as 64 bits followed by "b"
    would be tough. Decimal numbers are a much more compact representation, but it
    is not immediately apparent what bits are 0''s and 1''s in a decimal. Enter hexadecimal...


    A hexadecimal number is a number in base 16. We need "digits" from 0 to 15. The
    digits from 0-9 are just like in decimal. The digits from 10-15 are represented
    by the letters ''A'' through ''F''. We can also use lower case letters. Fortunately
    yasm and C++ represent hexadecimal numbers using the prefix 0x. You could probably
    use 0X but the lower case x tends to make the numbers more visually obvious.'
