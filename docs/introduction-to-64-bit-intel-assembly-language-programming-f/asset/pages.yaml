    # 12.3 C wrapper functions


    The lingua franca of UNIX is C, so every system call is usable via a C wrapper
    function. For example there is a write function in the C library which does very
    little other than use the syscall instruction to perform the write request. Using
    these functions rather than the explicit syscall instruction is the preferred
    way to use the system calls. You won''t have to worry about finding the numbers
    and you won''t have to cope with the slightly register usage.


    The Linux system calls are documented in section 2 of the on-line manual, so you
    can do


    man 2 write


    to learn how to use the write system call.

    The previous "Hello world" program can be rewritten using write and exit as


    ```

    segment .data

    msg:      "Hello World!",0x0a ; String to print

    len:      equ      $msg             ; Length of the string

    segment .text

    global    main

    extern    write, exit

    ```


    ```

    main:

    mov      edx, len         ; Arg 3 is the length

    mov      rsi, msg         ; Arg 2 is the array

    mov      edi, 1          ; Arg 1 is the fd

    call     write

    xor      edi, edi         ; 0 return = success

    call     exit

    ```'
