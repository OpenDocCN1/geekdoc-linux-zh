    # ## 10.4.4 Finding the minimum value


    The min function does not call any other functions, so there is no real need for
    a stack frame and no need to align the stack at a 16 byte boundary. A conditional
    move instruction is used to avoid interrupting the instruction pipeline.


    ```

    ; x = min ( array, size );

    min:\mov eax, [rdi]

    mov rcx, 1

    mov r8d, [rdi+rcx*4]

    cmp r8d, eax

    cmvl eax, r8d

    inc rcx

    cmp rcx, rsi

    jl .more

    ret

    ```


