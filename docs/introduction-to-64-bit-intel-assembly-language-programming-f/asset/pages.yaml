  md: '# # Appendix B


    # # Using scanf and printf


    The simplest method for input and output is using the C library''s scanf and printf
    functions. These functions can handle virtually all forms of text input and output
    converting to/from integer and floating point format.


    It may be that modern programmers are familiar with C++ I/O and not with C. It
    would not be simple to call C++ I/O facilities, while it is simple to call C functions.
    So there is probably a need for a slight introduction to the 2 basic workhorses
    of C I/O: scanf and printf. These are sufficient for the I/O needs for learning
    assembly language. Practical uses of assembly language will likely be writing
    computational or bit manipulating functions with no requirement for I/O. Therefore
    this appendix will stick to the basics to facilitate writing complete programs
    while learning assembly programming.


    # ## B.1 scanf


    The simplest way of explaining how to use scanf is to show C calls, followed by
    assembly equivalents. scanf is called with a format string as its first parameter.
    Depending on the format string there can be an arbitrary number of additional
    parameters. Within the format string are a series of conversion specifiers. Each
    specifier is a percent character followed by one or more letters defining the
    type of data to convert. Here are the basic format specifiers:'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# APPENDIX B. USING SCANF AND PRINTF


    | format | data type |

    | %d | 4 byte integer |

    | %hd | 2 byte integer |

    | %ld | 8 byte integer |

    | %f | 4 byte floating point |

    | %lf | 8 byte floating point |

    | %s | character array (C string) |


    If we wish to read a double followed by a character string we could use the format
    string "%lf %s".


    Each additional parameter for scanf is an address of the data location to receive
    the data read and converted by scanf. Here is a sample C call:


    ```

    double x;

    char s[100];

    s = scanf ( "%lf %s", &x, s \);

    ```


    scanf will return the number of items converted. In the call above it will return
    2 if a number and a string are successfully entered. The string will be placed
    in the array s with a 0 at the end of the string.

    Here is how to do the same thing in assembly:


    ```

    segment .data

    dq 0.0

    dd 0

    s times 100 db 0

    fmt "%lf %s",0

    segment .text

    lea rdi, [fmt]

    lea rsi, [x]

    lea rdx, [s]

    xor eax, eax ; no floating point parameters

    call scanf

    mov [n], eax

    ```


    There are a couple of pitfalls. First the format string needs a 0 at the end and
    it can''t be enclosed in the double quotes. Second there are no floating point
    parameters -x is an address parameter and it is stored in rsi so rax must be set
    to 0 before the call.'
  merge: -1
  pgno: 241
- img_proc: true
  md: 'B.2. PRINTF


    # B.2 printf


    printf allows printing in a wide variety of formats. Like scanf its first parameter
    is a format string. The format string contains characters to print along with
    conversion specifiers like scanf. Data printed with printf is likely to be stored
    in a buffer until a new-line character is printed. In C, the new-line character
    can be represented as \n at the end of the format string. yasm does not support
    escape characters in strings, so it is necessary to explicitly add new-line (0x0a)
    and 0 bytes. Here is a C printf call


    ```

    char name [64];

    int value;

    printf ("The value of %s is %d\n", value, value);

    ```


    Here is the printf call in assembly


    ```

    segment .data

    value dd 0

    name times 64 db 0

    fmt db "The value of %s is %d",0x0a,0

    segment .text

    lea rdi, [fmt]

    lea rsi, [value]

    mov eax, eax

    call printf

    ```


    printf can have floating point parameters, so be careful to count them and set
    rax appropriately.'
  merge: -1
  pgno: 242
