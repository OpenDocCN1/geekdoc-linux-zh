    #  Data structures


    Data structures are widely used in application programming. They are frequently
    used for algorithmic purposes to implement structures like stacks, queues and
    heaps. They are also used to implement data storage based on a key, referred to
    as a “dictionary”. In this chapter we discuss implementing linked lists, hash
    tables, doubly-linked lists and binary trees in assembly.


    One common feature of all these data structures is the use of structure called
    “node” which contains data and one or more pointers to other nodes. The memory
    for these nodes will be allocated using malloc.


