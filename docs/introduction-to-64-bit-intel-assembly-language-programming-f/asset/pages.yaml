  md: '# # Chapter 19


    # ## Computing Correlation


    The final example of optimization is computing the correlation between two variables
    $x$ and $y$ given $n$ sample values. One way to compute correlation is using


    ```

    $$r_{xy} = \frac{\sum_{i=1}^{n}(x_{i}-\bar{x})(y_{i}-\bar{y})}{\sqrt{\sum_{i=1}^{n}(x_{i}-\bar{x})^{2}\sum_{i=1}^{n}(y_{i}-\bar{y})^{2}}}$$

    ```


    But this formula requires two passes through the data - one pass to compute averages
    and a second pass to complete the formula. There is a less intuitive formula which
    is more amenable to computation:


    ```

    $$r_{xy} = \frac{n\sum x_{iy_{i}}-\sum x_{i}\sum y_{i}}{\sqrt{n\sum x_{i}^{2}-(\sum
    x_{i})^{2}n\sum y_{i}^{2}-(\sum y_{i})^{2}}}$$

    ```


    The computational formula requires 5 sums when you scan the data: the sum of $x_{i}$,
    the sum of $y_{i}$, the sum of $x_{i}^{2}$, and the sum of $y_{i}^{2}$. After
    computing these 5 sums there is a small amount of time required for implementing
    the computational formula.


    # ### 19.1 C implementation


    The C computation is performed in the corr function given below:


    ```

    #include <math.h>

    double corr ( double x[], double y[], long n )

    ```'
