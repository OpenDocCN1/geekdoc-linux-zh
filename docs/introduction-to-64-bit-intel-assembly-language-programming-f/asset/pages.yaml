  md: '# C.3 Preprocessor variables


    yasm allows defining preprocessor variables which can be used in macros using
    %assign. You could assign a variable i in one spot and modify it later:


    ```

    %assign i 1

    ...

    %assign i i+1

    ```


    For more information about yasm macros consult the yasm web site as http://www.tortall.net/projects/yasm/manual/html/index.html
    which discusses topics like looping and string length.'
  merge: -1
