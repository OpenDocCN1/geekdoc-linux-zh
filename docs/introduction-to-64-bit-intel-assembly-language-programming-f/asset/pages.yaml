  md: '# 10.3. ALLOCATING ARRAYS


    Note that multiplying by 2, 4 or 8 is a shift of 1, 2 or 3 bits, so there is effectively
    0 cost to using the multiplier. Alternatively we could add 4 to ecx in each loop
    iteration after shifting rdx left 2 positions.


    The last pattern we would be useful for accessing an array of structs. If you
    had an array of structs each struct having a character array and a pointer, then
    the number part of the reference could be the offset of the struct element within
    the struct, while the base register and index register could define the address
    of a particular struct in the array.


    # 10.3 Allocating arrays


    The simplest way to allocate memory in assembly is probably to use the C library
    malloc function. The prototype for malloc is


    ```

    void *malloc ( long size );

    ```


    On success malloc returns a pointer to the allocated memory, while failure results
    in malloc returning 0. The memory returned by malloc is bounded on 16 byte boundaries,
    which is useful as an address for any type of object (except arrays needing to
    be on 32 byte boundaries for AVX instructions). The memory can be returned for
    potential reuse by calling the free function with the pointer returned by malloc


    ```

    void free ( void *ptr );

    ```


    Here is an assembly segment to allocate an array of 1000000000 bytes


    ```

    extern malloc

    ...

    mov rdi, 1000000000

    call malloc

    mov [pointer], rax

    ```


    There are several advantages to using allocated arrays. The most obvious one is
    that you can have arrays of exactly the right size. Frequently you can compute
    the size of array needed in your code and allocate an array of the correct size.
    If you use statically defined arrays either in the data or bss segment, you have
    to know the size needed before running the program (or guess).'
