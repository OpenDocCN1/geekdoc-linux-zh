    # 11.4 Subtraction


    Subtraction operates like addition on either scalar floats or packed floats or
    doubles. The scalar subtract instructions are subss which subtracts the source
    float from the destination float and subsd which subtracts the source double from
    the destination double. The source can be either in memory or in an XMM register,
    while the destination must be an XMM register. No flags are affected by the floating
    point subtraction instructions.


    The packed subtract instructions are subps which subtracts 4 source floats from
    4 floats in the destination and the subpd which subtracts 2 source doubles from
    2 doubles in the destination using XMM registers. Again the source can be in memory
    or in an XMM register, while the destination must be an XMM register. Using packed
    subtracts with YMM registers subtracts 8 floats or 4 doubles.


    ```

    movss xmm0, [a]    ; load a

    subss xmm0, [b]    ; subtract b from a

    movss [c], xmm0     ; store a-b in c

    movapd xmm0, [a]    ; load 2 doubles from a

    subpd xmm0, [b]    ; subtract a[0]-b[0] and a[1]-b[1]

    movapd [c], xmm0     ; store 2 differences in c

    movupd ymm0, [a]    ; load 4 doubles from a

    subpd ymm0, [b]    ; subtract 4 doubles from b

    movapd [c], ymm0     ; store 4 differences in c

    ```'
