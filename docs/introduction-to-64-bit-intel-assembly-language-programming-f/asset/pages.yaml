    with structure definition. The yasm keyword for starting a struct is "struct".
    Struct components are defined between "struct" and "endstruct". Here is the definition
    of:


    ```

    struct  Customer

    id      resd    1

    name    resb    64

    address resb    64

    balance resd    1

    endstruct

    ```


    Using this definition gives us the same effect as using equ to set symbolic names
    for the offsets. These names are globally available, so you would not be permitted
    to have id in multiple structs. Instead you can prefix each of these names with
    a period like this:


    ```

    struct  Customer

    .id     resd    1

    .name   resb    64

    .address resb    64

    .balance resd    1

    endstruct

