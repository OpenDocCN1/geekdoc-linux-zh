- img_proc: true
  md: '# 1.1. WHY STUDY ASSEMBLY LANGUAGE?


    level languages. A skilled assembly language coder can write code which uses less
    CPU time and less memory than that produced by a compiler. However modern C and
    C++ compilers do excellent optimization and beginning assembly programmers are
    no match for a good compiler. The compiler writers understand the CPU architecture
    well. On the other hand an assembly programmer with similar skills can achieve
    remarkable results. A good example is the Atlas (Automatically Tuned Linear Algebra
    Software) library which can achieve over 95% of the possible CPU performance.
    The Atlas matrix multiplication function is probably at least 4 times as efficient
    as similar code written in C. So while it is true that assembly language can offer
    performance benefits, it is unlikely to outperform C/C++ for most general purpose
    tasks. Furthermore it takes intimate knowledge of the CPU to achieve these gains.
    In this book we will point out some general strategies for writing efficient assembly
    programs.


    One advantage of assembly language is that it can do things not possible in high
    level languages. Examples of this include handling hardware interrupts and managing
    memory mapping features of a CPU. These features are essential in an operating
    system, though not required for application programming.


    So we have seen that assembly language is much more difficult to use than higher
    level languages and only offers benefits in special cases to well-trained programmers.
    What benefit is there for most people?


    The primary reason to study assembly language is to learn how a CPU works. This
    helps when programming in high level languages. Understanding how the compiler
    implements the features of a high level language can aid in selecting features
