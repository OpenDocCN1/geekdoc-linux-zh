  md: '# CHAPTER 3. COMPUTER MEMORY


    page number and the address within the page. Suppose a reference is made to logical
    address 0x400000220. Since 4096 = 2¹², the offset within the page is the right-most
    12 bits (0x220). The page number is the rest of the bits (0xC4000000). A hardware
    register (or multiple registers) translates this page number to a physical page
    address, let''s say 0x78000000. The two addresses are combined to get the physical
    address 0x780000220.


    Amazingly the CPU generally performs the translations without slowing down this
    benefits the users in several ways. The most obvious benefit is memory protection.
    User processes are limited to reading and writing only their own pages. This means
    that the operating system is protected from malicious or poorly coded user programs.
    Also each user process is protected from other user processes. In addition to
    protection from writing, users can''t read other users'' data.


    There are instructions used by the operating system to manage the hardware mapping
    registers. These instructions are not discussed in this book. Our focus is on
    programming user processes.


    So why bother to discuss paging, if we are not discussing the instructions to
    manage paging? Primarily this improves one''s understanding of the computer. When
    you write software which accesses data beyond the end of an array, you sometimes
    a segmentation fault. However you only get a segmentation fault when your logical
    address reaches far past the end of the array to cause the CPU to reference a
    page entry which is not mapped into your process.


    # 3.2 Process memory model in Linux


    In Linux memory for a process is divided into 4 logical regions: text, data, heap
    and stack. The stack is mapped to the highest address of a process and on x86-64
    Linux this is 0x7ffffffffff or 131 TB. This address is selected on the maximum
    number of bits allowed in logical addresses being 48 bits. This address is 47
    bits of all 1 bits. The decision was not to use 48, since canonical addresses
    have to extend 48 through bits 49-63.


    In figure 3.1 we see the arrangement of the various memory segments. At the lowest
    address we have the text segment (.text for yasm). This segment is shown starting
