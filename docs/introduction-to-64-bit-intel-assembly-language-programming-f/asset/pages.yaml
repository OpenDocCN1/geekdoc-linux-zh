  md: '# 11.8. MATHEMATICAL FUNCTIONS


    NaNs. A quiet NaN (QNaN) is a value which can be safely propagated through code
    without raising an exception. A signaling NaN (SNaN) raises an exception when
    it is generated. Perhaps you have witnessed a program failing with a divide by
    0 error which is caused by a signal.


    Floating point comparison is considered to be either "ordered" or "unordered".
    An ordered comparison causes a floating point exception if either operand is QNaN
    or SNaN. An unordered comparison causes an exception for only SNaN. The gcc compiler
    uses unordered comparisons, so I will do the same.


    The unordered floating point comparison instructions are ucomiss for comparing
    floats and ucomis for comparing doubles. The first operand must be an XMM register,
    while the second operand be memory or an XMM register. They set the zero flag,
    parity flag and carry flag to indicate the type of result: unordered (at least
    1 operand is NaN), less than, equal or greater than. A conditional jump seems
    like a natural after a comparison, but we need some instructions for floating
    point conditional jumps.


    | instruction | meaning | aliases | flags |

    |---|---|---|---|

    | jb | jump if < (floating point) | jc jnae | CF=1 |

    | jbe | jump if <= (floating point) | jc jnae | CF=1 or ZF=1 |

    | ja | jump if > (floating point) | jnb | ZF=0, CF=0 |

    | jae | jump if >= (floating point) | jnc jnb | CF=0 |


    ```

    movss xmm0, [a]

    muls xmm0, [b]

    ucomiss xmm0, [c]

    jbe less_eq      ; jmp a*b <= c

    ```


