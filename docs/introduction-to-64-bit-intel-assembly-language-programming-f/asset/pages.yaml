    CHAPTER 12. SYSTEM CALLS


    # 12.1 32 bit system calls


    Each system call is defined in `/usr/include/asm/unistd.32.h`. To execute the
    system call you must place the system call number in register eax and use the
    software interrupt instruction to affect the effect: int 0x80. System calls have
    parameters which are placed in registers ebx, ecx, edx, esi, edi, and ebp. Return
    values are placed in eax. Here is a system call to stdout:


    ```

    segment .data

    hello:   db    "Hello world!",0x0a


    segment .text

    mov      eax, 4       ; syscall 4 is write

    mov      ebx, 1       ; file descriptor

    lea      ecx, [hello] ; array to write

    mov      rdx, 13      ; write 13 bytes

    int      0x80

    ```


    # 12.2 64 bit system calls


    The system calls for 64 bit Linux are different integers than for 32 bit Linux
    and are defined in `/usr/include/asm/unistd.64.h`. Again the system calls use
    registers for parameters, though the registers are different. The system call
    number is placed in rax and the parameters are placed in rdi, rsi, rdx, r10, r8
    and r9. Return values are placed in ra. The registers are the same as in C functions
    except that r10 has rcx for parameter 4.


    Instead of using the software interrupt instruction, x86-64 Linux uses the syscall
    instruction to execute a system call. Here is the 64 bit version of "Hello world":


    ```

    segment .data

    hello:   db    "Hello world!",0x0a

    segment .text

    global  _start

    _start: mov      eax, 1       ; syscall 1 is write

    mov      edi, 1       ; file descriptor

    ```'
