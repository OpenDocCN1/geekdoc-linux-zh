    "not equals". In my terminology exclusive-or is a "bitflipper". Consider the right
    operand as a mask which selects bits to flip in the left operand. Consider these
    examples:


    ```

    00010001b ^ 00000001b == 00010000b

    01010101b ^ 11111111b == 10101010b

    01110111b ^ 00001111b == 01110000b

