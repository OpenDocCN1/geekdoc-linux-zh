  md: '# 2.4 Floating point numbers


    The x86-64 architecture supports 3 different varieties of floating point numbers:
    32 bit, 64 bit and 80 bit numbers. These numbers are stored in IEEE 754 format.
    Below are the pertinent characteristics of these types:


    | Variety | Bits | Exponent | Exponent Bias | Fraction | Precision |

    |---|---|---|---|---||

    | float | 32 | 8 | 127 | 23 | ~7 digits |

    | double | 64 | 11 | 1023 | 52 | ~16 digits |

    | long double | 80 | 15 | 16383 | 64 | 19 digits |


    ![](img/443639abd490bee82d518502d35b07b9_35_0.png)


    31 30 23 22

    sign bit exponent value


    The exponent for a float is an 8 bit field. To allow large numbers or small numbers
    to be stored, the exponent is interpreted as positive or negative. The actual
    exponent is the value of the 8 bit field minus 127 ("exponent bias") for 32 bit
    floating point numbers.

    The fraction of a float holds a small surprise. Since all bits set to 0, there
    is no need to worry about representing 0.0 as an exponent field equal to 127 and
    fraction field set to 0''s. All other numbers have at least one 1 bit, so the
    IEEE 754 format uses an implicit 1 bit to save space. If the fraction field is
    00000000000000000000000000000000, it is interpreted as 1.00000000000000000000000000000000.
    This allows the fraction field to be effectively 24 bits. This is a clever trick
    made by making exponent fields of 0x00 and 0xFF special.


    A number with exponent field equal to 0 is defined to be 0. Interestingly, it
    is possible to store a negative 0. An exponent of 0xFF is used to mean either
    negative or positive infinity. There are more details'
  merge: -1
