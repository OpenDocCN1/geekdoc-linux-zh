    # 16.16 Eliminate stack frames


    For leaf functions it is not necessary to use stack frames. In fact if you have
    non-leaf functions which call your own functions and no others then you can omit
    the frame pointers from these too. The only real reason for frame pointers is
    for debugging. There is a requirement for leaving the stack on 16 byte boundaries,
    but this only becomes issue with functions which have local variables (on the
    stack) which participate in aligned 16 or 32 byte accesses which can either fail
    or be slower. If you know that your code is not using those instructions, neither
    frame pointers alignment are important other than for debugging.


    # 16.17 Inline functions


    As part of optimization compilers can in-line small functions. This reduces the
    overhead significantly. If you wish to do this, you might be interested in exploring
    macros which can make your code easier to read and write and operate much like
    a function which has in-lined.


    # 16.18 Reduce dependencies to allow super-scalar execution


    Modern CPUs inspect the instruction stream looking ahead for instructions which
    do not depend upon results of earlier instructions. This is called “out of order
    execution”. If there is less dependency in your code, then the CPU will execute
    more instructions out of order and your program will run more quickly.


    As an example of this I modified the previous add.array function with unrolled
    loops to accumulate all 4 values in the loop into ra. This increased the time
    from 2.44 seconds to 2.75 seconds.'
