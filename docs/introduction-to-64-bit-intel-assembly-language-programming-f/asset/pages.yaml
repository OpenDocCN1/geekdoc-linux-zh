  md: '# Chapter 2


    # Numbers


    All information in a computer is stored as collections of bits. These bits can
    be interpreted in a variety of ways as numbers. In this chapter we will discuss
    binary numbers, hexadecimal numbers, integers and floating point numbers.


    # 2.1 Binary numbers


    We are used to representing numbers in the decimal place-value system. In this
    representation, a number like 1234 means 1*10³+2*10²+3*10+4. Similarly binary
    numbers are represented in a place-value system using 0 and 1 as the “digits”
    and powers of 2 rather than powers of 10.


    Let’s consider the binary number 10101111. This is an 8 bit number so the highest
    power of 2 is 2⁷. So this number is


    ```

    10101111 = 2⁷ + 2⁵ + 2³ + 2² + 2¹ + 1

    = 128 + 32 + 8 + 4 + 2 + 1

    = 175

    ```


    The bits of an 8 bit number are numbered from 0 to 7 with 0 being the least significant
    bit and 7 being the most significant bit. The number 175 has its bits defined
    below.


    The conversion from binary to decimal is straightforward. It takes a little more
    ingenuity to convert from decimal to binary. Let’s examine'
