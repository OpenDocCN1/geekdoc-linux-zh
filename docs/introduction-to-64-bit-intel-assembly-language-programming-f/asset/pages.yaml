  md: '# C.2. MULTI-LINE MACROS


    Now we can write a simple program using both macros


    ```

    function main, 32

    xor eax, eax

    .loop inc rax

    while wax, 1, 10, .loop

    return 0

    ```


    A fairly useful pair of macros from the yasm manual are multipush and multipop.
    These were used earlier in the Sobel example. It makes sense to have a pair of
    macros to push and pop all callee-save registers for use in register intensive
    functions.


    ```

    %macro pushsaved

    push rbp

    push rbx

    push r12

    push r13

    push r14

    push r15

    %endmacro

    ```


    ```

    %macro popsaved

    pop r15

    pop r14

    pop r13

    pop r12

    pop rbx

    pop rbp

    %endmacro

    ```


    Now these don''t preserve 16 byte stack alignment, so perhaps a better choice
    would be needed for some functions. Maybe you could combine the creation of a
    stack frame with pushing the rest of the registers and subtracting from the stack
    pointer to achieve alignment and room for local variables.'
  merge: -1
  pgno: 246
