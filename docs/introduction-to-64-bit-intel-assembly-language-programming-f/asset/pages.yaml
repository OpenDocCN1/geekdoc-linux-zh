    # 15.1.3 Inserting a number into a list


    The decision to implement an empty list as a NULL pointer leaves a small issue
    for insertion. Each insertion will be at the start of the list which means there
    will be a new pointer stored in the list start pointer for each insertion. There
    are 2 possible ways to cope with this. One way is to pass the address of the pointer
    into the insertion function. A second way is to have the insertion pointer return
    the new pointer and leave it to the insertion code to assign the new pointer upon
    return. It is less confusing to dodge the address of a pointer problem. Here is
    the insertion code:


    ```

    ; list = insert ( list, k );

    .list equ 0

    .k equ 8

    push

    mov rbp, rsp

    sub

    mov [rsp+.list], rdi ; save list pointer

    mov [rsp+.k], rsi ; and on stack

    mov edi, node_size ; ra will be node pointer

    call malloc

    mov r8, [rsp+.list] ; get list pointer

    mov [rax+n_next], r8 ; save pointer in node

    mov r9, [rsp+.k] ; get k

    mov [rax+n_value], r9 ; save k in node

    leave

    ret

    ```


