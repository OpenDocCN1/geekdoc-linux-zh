- md: "\nSo to print a single array element, you could use “print *x”, or\n“print\
    \ x[0]”. If x is an array, then array notation makes more sense.\nYou can print\
    \ any location from the array x.\n\ngdb also has an “examine” command (“x”) which\
    \ can be\nused to examine multiple memory locations. You enter the command like\n\
    “x/100 x” to print 100 locations of the x array. After the number you can\nappend\
    \ a format letter. Using x for the format letter means hexadecimal,\nc means character,\
    \ b means binary and s means string. The examine\ncommand needs an expression\
    \ evaluating to a memory location. This is\nwhat you get with a variable name\
    \ with the gdb init file macros. Without\nthese macros you would need to take\
    \ the address of the variable as in a\ncommand like “x/100x &x”.\n\n## Appendix\
    \ B\n\n Using scanf and printf\n\nThe simplest method for input and output is\
    \ using the C library's scanf and printf functions. These functions can handle\
    \ virtually all forms of text input and output converting to/from integer and\
    \ floating point format.\n\nIt may be that modern programmers are familiar with\
    \ C++ I/O and not with C. It would not be simple to call C++ I/O facilities, while\
    \ it is simple to call C functions. So there is probably a need for a slight introduction\
    \ to the 2 basic workhorses of C I/O: scanf and printf. These are sufficient for\
    \ the I/O needs for learning assembly language. Practical uses of assembly language\
    \ will likely be writing computational or bit manipulating functions with no requirement\
    \ for I/O. Therefore this appendix will stick to the basics to facilitate writing\
    \ complete programs while learning assembly programming.\n\n### B.1 scanf\n\n\
    The simplest way of explaining how to use scanf is to show C calls, followed by\
    \ assembly equivalents. scanf is called with a format string as its first parameter.\
    \ Depending on the format string there can be an arbitrary number of additional\
    \ parameters. Within the format string are a series of conversion specifiers.\
    \ Each specifier is a percent character followed by one or more letters defining\
    \ the type of data to convert. Here are the basic format specifiers:\n\n## APPENDIX\
    \ B. USING SCANF AND PRINTF\n\n| format | data type |\n| :--- | :--- |\n| %d |\
    \ 4 byte integer |\n| %hd | 2 byte integer |\n| %ld | 8 byte integer |\n| %f |\
    \ 4 byte floating point |\n| %lf | 8 byte floating point |\n| %s | character array\
    \ (C string) |\n\nIf we wish to read a double followed by a character string we\
    \ could use the format string \"%lf %s\".\n\nEach additional parameter for scanf\
    \ is an address of the data location to receive the data read and converted by\
    \ scanf. Here is a sample C call:\n\n```c\ndouble x;\nchar s[100];\ns = scanf\
    \ ( \"%lf %s\", &x, s );\n```\n\nscanf will return the number of items converted.\
    \ In the call above it will return 2 if a number and a string are successfully\
    \ entered. The string will be placed in the array s with a 0 at the end of the\
    \ string.\nHere is how to do the same thing in assembly:\n\n```assembly\nsegment\
    \ .data\ndq 0.0\ndd 0\ns times 100 db 0\nfmt \"%lf %s\",0\nsegment .text\nlea\
    \ rdi, [fmt]\nlea rsi, [x]\nlea rdx, [s]\nxor eax, eax ; no floating point parameters\n\
