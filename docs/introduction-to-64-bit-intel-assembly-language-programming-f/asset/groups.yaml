    # Chapter 1

    ## Introduction


    This book is an introduction to assembly language programming for the x86-64 architecture
    of CPUs like the Intel Core processors and the AMD Athlon and Opter processors.
    While assembly language is no longer widely used in general purpose programming,
    it is still used to produce maximum efficiency in core functions in scientific
    computing and in other applications where maximum efficiency is needed. It is
    also used to perform some functions which cannot be handled in a high-level language.


    The goal of this book is to teach general principles of assembly language programming.
    It targets people with some experience in programming in a high-level language
    (ideally C or C++), but with no prior exposure to assembly language.


    Assembly language is inherently non-portable and this text focuses on writing
    code for the Linux operating system, due to the free availability of excellent
    compilers, assemblers and debuggers. The instructions are the same on x86-64 operating
    systems; we use the same call standards, though there are differences between
    Windows and Linux along with library and Mac OS/X with call differences. Differences
    between assembly programming for Windows systems will be detailed as the work
    unfolds.


    The primary goal of this text is to learn how to write functions from C or C++
    programs. This focus should give the reader an increased understanding of how
    a compiler implements a high-level language. This understanding will be of lasting
    benefit in using high-level languages.


    A secondary goal of this text is to introduce the reader to using SSE and AVX
    instructions.


