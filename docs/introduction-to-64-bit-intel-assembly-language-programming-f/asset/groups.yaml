    \ 3 个块可以放入缓存中以提升性能。下面是在 C 程序中乘以 21024x1024 矩阵时，不同块大小的 MFLOPS 比较。使用汇编语言利用 SSE 或\
    \ AVX 指令有很大的改进空间。\n\n## 16.5 公共子表达式消除\n\n![](img/443639abd490bee82d518502d35b07b9_194_0.png)\n\
    \n公共子表达式消除通常由优化编译器执行。如果你有希望胜过编译器，你必须做同样的事情。有时可能很难找到所有的公共子表达式。这可能是研究编译器生成的代码以发现它发现了什么的好时机。编译器执行任务时是不知疲倦且高效的。人类倾向于忽略细节。\n\
