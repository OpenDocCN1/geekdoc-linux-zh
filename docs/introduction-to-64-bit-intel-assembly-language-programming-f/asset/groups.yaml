    # 7.4 Exclusive or operation


    The final bit-wise operation is exclusive-or. This operation matches the everyday
    concept of 1 or the other but not both. The C exclusive-or operator is ''^''.


    Here is a truth table for the exclusive-or operation:


    | ^ | 0 | 1 |

    |---|---||

    | 0 | 0 | 1 |

    | 1 | 1 | 0 |


    From examining the truth table you can see that exclusive-or could also be called
    "not equals". In my terminology exclusive-or is a "bitflipper". Consider the right
    operand as a mask which selects bits to flip in the left operand. Consider these
    examples:


    ```

    00010001b ^ 00000001b == 00010000b

    01010101b ^ 11111111b == 10101010b

    01110111b ^ 00001111b == 01110000b

    0xaaaaaaaa ^ 0xffffffff == 0x55555555

    0x12345678 ^ 0x12345678 == 0x00000000

    ```'
