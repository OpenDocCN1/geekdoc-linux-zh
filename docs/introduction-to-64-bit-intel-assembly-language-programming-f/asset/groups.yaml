    ## 第 11 章：浮点数指令


    8086 使用了名为 8087 的浮点协处理器来执行浮点算术。许多早期的计算机缺乏这种协处理器。这种配置一直持续到 486，486 在其内部包含了该协处理器。8087
    使用浮点值栈。这些指令仍然现代 CPU 的一部分，尽管 Core i 系列（128 位模式）中提供了一套完全独立的浮点单元。


    我们将学习较新的指令。


    如果你学习《Intel 64 和 IA-32 架构软件手册》，你会发现许多如 `fidd` 的指令，它们通过名为 ST(0), ST(1), ... 的寄存器处理流式扩展（SSE）。SIMD
    是“单指令多数据”的缩写。这些是本章的重点。


    ### 11.1 浮点寄存器


    有 16 个浮点寄存器，具有双重用途：持有单个值或多个值。这些寄存器的名称为 xmm0, xmm1, ... xmm15。i 系列计算机引入了高级向量扩展（AVX），使浮点寄存器的大小增加了一倍。要使用全部
    256 位（8 个浮点数或 4 个双精度浮），你需要使用 ymm0, ... ymm15 中的寄存器。每个 XMM 寄存器占据对应 YMM 寄存器的前 128
    位。本章的大部分讨论仅涉及 XMM 寄存器。


    ### 11.2 在浮点寄存器之间与之间移动数据


    有用于移动整数打包数据和浮点数据的指令。我们在这里专注于浮点数据。你可以移动浮点数或双精度数。有用于移动对齐或未对齐打包数据的指令。对齐指令是使用 XMM
    寄存器的 `movaps`（用于四个浮点数）和 `movapd`（用于两个双精度数）。未对齐版本是 `movups` 和 `movd`。在 YMM 寄存器之间移动移动打包数据可以移动双倍的值。


    ### 11.2.1 移动标量


    有两条指令用于将标量值浮点值在 SSE 寄存器之间进行移动：`movss` 移动 32 位浮点值（单精度），`movsd` 移动 64 位浮点值（双精度）。这两条指令将值从内存移动到/XMM
    寄存器的低位，或从一个 XMM 寄存器移动到另一个。没有隐式转换。这是一个示例：


    ```

    movss xmm0, [x]      ; 将 x 处的值移动到 xmm0

    movsd [y], xmm1      ; 将 xmm1 的值移动到 y

    movss xmm2, xmm0      ; 从 xmm0 移动到 xmm2

    ```


    ### 11.2.2 移动打包数据


    有用于加载整数打包数据和浮点数据的指令。对齐数据意味着它在内存中位于 16 字节边界上。可以通过使用 `align16` 来。`bss` 部分不能很好地完成这项工作。由
    `malloc` 分配的数组将位于 16 字节边界上。如果你尝试对未对齐地址使用对齐移动指令，你的程序将会导致段错误（segmentation fault）。幸运的是在
    Core i 系列 CPU 上，未对齐版本与对齐移动一样快：


    ```

    movups xmm0, [x] ; 将 4 个浮点数移动到 xmm0

    movups ymm0, [x] ; 将 8 个浮点数移动到 ymm0

    movups ymm1, [x] ; 将 4 个双精度数移动到 ymm1

    movd [a], xmm1 ; 将 2 个双精度数移动到 a

    ```


    ### 11.3 加法


    相浮点数据的指令分为标量和打包两种。标量加法指令是 `addss`（加两个浮点数）和 `addsd`（加两个双精度数）。这两者都操作源操作数目标操作数。源可以在内存或
    XMM 寄存器中，而目标必须在 XMM 寄存器中。与整数加指令不同，浮点加法指令不设置任何标志位，因此必须使用比较进行测试。


    打包加法指令是 `addps`（它从源到目标加 4 个浮点数）和 `addpd`（使用 XMM 寄存器从源到目标加 2 组双精度数）。由于和标量加法一样，源可以是内存或
    XMM 寄存器，而目标必须是 XMM 寄存器。使用 YMM 寄存器的打包操作可以增加 8 组浮点数或 4 组双精度数。


    ```

    movss xmm0, [a]    ; 加载 a

    addss xmm0, [b]    ; 将 b 加到 a

    movss [c], xmm0     ; 将和存储在 c

    movupd xmm0, [a]    ; 从 a 加载 2 个双精度数

    addpd xmm0, [b]    ; 加 a[0]+b[0] 和 a[1]+b[1]

    movapd [c], xmm0     ; 将 2 个和存储在 c

    movupd ymm0, [a]    ; 从 a 加载 4 个双精度数

    addpd ymm0, [b]    ; 此处逻辑对应

    movupd [c], xmm0     ; 存储逻辑更正

    ```


    ### 11.4 减法


    减浮点数据的指令与加法模式相同，操作内存或寄存器操作数。它们支持浮点数和双精度数，支持标量和打包数据。标量减法指令是 `subss`（从目标减去源）和 `subsd`（上上所述）。


    打包减法指令是 `subps`（从源到目标减 4 个浮点数）和 `subpd`（使用 XMM 寄存器从源到目标减 2 组双精度数）。和标量加法一样，源可以是内存或
    XMM 寄存器，而目标必须是 XMM 寄存器。


    ```

    movss xmm0, [a]    ; 加载 a

    subss xmm0, [b]    ; a 减去 b

    movss [c], xmm0     ; 将和存储在 c

    movapd xmm0, [a]    ; 加载 2 个双精度数

    subpd xmm0, [b]    ; 减 a[0]-b[0] 和 a[1]-b[1]

    movapd [c], xmm0     ; 将 2 个和存储在 c

    movupd ymm0, [a]    ; 加载 4 个双精度数

    subpd ymm0, [b]    ; 减法逻辑

    movupd [c], ymm0     ; 存储结果

    ```


    ### 11.5 乘法和除法


    乘法和除法的模式与加法和减法相同，即操作内存或寄存器操作数。它们支持浮点数和双精度数，支持标量和打包数据。浮点数据的基本数学指令如下：


    | 指令 | 效果 |

    |------|---|

    | addsd | 标量双精度 |

    | addss | 标量单精度 |

    | adddpd | 打包双精度 |

    | addps | 打包单精度 |

    | subsd | 标量双精度 |

    | subss | 标量单精度 |

    | subpd | 打包双精度 |

    | subps | 打包单精度 |

    | mulsd | 标量双精度 |

    | mulss | 标量单精度 |

    | mulpd | 打包双精度 |

    | mulps | 打包单精度 |

    | divsd | 标量双精度 |

    | divss | 标量单精度 |

    | divpd | 打包双精度 |

    | divps | 打包单精度 |


    ### 11.6 转换


    经常需要将数字从一种长度转换为另一种，从一种长度的浮点数转换为另一种，从整数转换为浮点数或从浮点数转换为整数。不同长度之间的转换可以使用目前介绍介绍的各种移动指令完成。其他操作需要特殊的指令。


    ### 11.6.1 转换为不同长度的浮点数


