- md: "\n## CHAPTER 15. DATA STRUCTURES\n\n## list\n\n![](img/443639abd490bee82d518502d35b07b9_167_0.png)\n\
    \neither unordered or possibly ordered by time of insertion. It is very easy to\
    \ insert a new node at the start of a list, so the list could be in decreasing\
    \ time of insertion order.\n\nThe list is referenced using the pointer stored\
    \ at the memory location labeled list. The nodes on the list are not identified\
    \ with specific labels in the code which maintains and uses the list. The only\
    \ way to access these nodes is by using the pointers in the list.\n\n### 15.1.1\
    \ List node structure\n\nOur list will have 2 fields: a data value and a pointer\
    \ to the next node. The yasm structure definition is\n\n```asm\nstruct      node\n\
    n_value resq  1\nn_next  resq  1\n        align    8\n        endstruct\n```\n\
    \nThe alignment instruction is not needed with 2 quad-words in the structure,\
    \ but it may protect us from confusion later.\n\n### 15.1.2 Creating an empty\
    \ list\n\nThe first decision in designing a container structure is how to represent\
    \ an empty container. In this linked list design we will take the simplest choice\
    \ of using a NULL pointer as an empty list. Despite this simplicity it may be\
    \ advantageous to have a function to create an empty list.\n\n```asm\nnewlist:\n\
    \  xor     eax, eax\n  ret\n```\n\n### 15.1. LINKED LISTS\n\n### 15.1.3 Inserting\
    \ a number into a list\n\nThe decision to implement an empty list as a NULL pointer\
    \ leaves a small issue for insertion. Each insertion will be at the start of the\
    \ list which means there will be a new pointer stored in the list start pointer\
    \ for each insertion. There are 2 possible ways to cope with this. One way is\
    \ to pass the address of the pointer into the insertion function. A second way\
    \ is to have the insertion pointer return the new pointer and leave it to the\
    \ insertion code to assign the new pointer upon return. It is less confusing to\
    \ dodge the address of a pointer problem. Here is the insertion code:\n\n```asm\n\
    ; list = insert ( list, k );\n.list equ 0\n.k equ 8\npush\nmov rbp, rsp\nsub\n\
    mov [rsp+.list], rdi ; save list pointer\nmov [rsp+.k], rsi ; and on stack\nmov\
    \ edi, node_size ; ra will be node pointer\ncall malloc\nmov r8, [rsp+.list] ;\
    \ get list pointer\nmov [rax+n_next], r8 ; save pointer in node\nmov r9, [rsp+.k]\
    \ ; get k\nmov [rax+n_value], r9 ; save k in node\nleave\nret\n```\n\n### 15.1.4\
    \ Traversing the list\n\nTraversing the list requires using an instruction\n\n\
    ```asm\nmov rbx, [rbx+n_next]\n```\n\nto advance from a pointer to one node to\
    \ the next node. We start by inspecting the pointer to see if it is NULL. If it\
    \ is not then we enter the loop. After processing a node we advance the pointer\
    \ and repeat the loop if the pointer is not NULL. The print function below traverses\
    \ the list and prints each data item. The code shows a good reason why it is nice\
    \ to have a few registers protected in calls. We depend on rbx being preserved\
    \ by printf.\n\n```asm\nprint:\n    segment .data\n.print_fmt:\n    db \"%ld \"\
    ,0\n.newline\n    db 0x0,0\n    segment .text\n.rbx\n    equ rbp\n    push\n \
    \   mov rbp, rsp ; subtract multiples of 16\n    sub rsp, 16\n    mov [rsp+.rbx],\
    \ rdi ; save old value of rbx\n    cmp rdi, 0\n    je .done\n    mov rbx, rdi\n\
    .more\n    lea rdi, [.print_fmt]\n    mov rsi, [rbx+n_value]\n    xor eax, eax\n\
    \    call\n    printf\n    mov rbx, [rbx+n_next]\n    cmp rbx, 0\n    jne .more\n\
    .done\n    lea rdi, [.newline]\n    xor eax, eax\n    call\n    printf\n    mov\
    \ rbx, [rsp+.rbx] ; restore rbx\n    leave\n    ret\n```\n\nWe have a main function\
    \ which creates a list, reads values using scanf, inserts the values into the\
    \ list and prints the list after each insertion.\n\n```asm\nmain:\n.list equ 0\n\
    .k equ 8\n  segment .data\n.scanf_fmt:\n  db \"%ld\",0\n  segment .text\n  push\
    \ rbp\n  mov rbp, rsp\n  sub rsp, 16\n  call newList\n  mov [rsp+.list], rax\n\
    .more lea rdi, [.scanf_fmt]\n  lea rsi, [rsp+.k]\n  xor eax, eax\n  call scanf\n\
    \  cmp rax, 1\n  jne .done\n  mov rdi, [rsp+.list]\n  mov rsi, [rsp+.k]\n  call\
    \ insert\n  mov [rsp+.list], rax\n  mov rdi, rax\n  call print\n  jmp .more\n\
    .done leave\n  ret\n```\n\nHere is a sample session using the program, entering\
    \ the numbers 1 through 5:\n- 1\n- 2 1\n- 3 2 1\n- 4 3 2 1\n- 5 4 3 2 1\n\n###\
    \ 15.2 Doubly-linked lists\n\nYou can see the most recently printed number is\
    \ the first of the list. By adding a function to get and remove (pop) the first\
    \ element of the list, we could turn this into a stack. This is one of the exercises\
    \ for this chapter.\n\nA doubly-linked list has 2 pointers for each node: one\
    \ points to the next node and one points to the previous. It becomes quite simple\
    \ to manage a doubly-linked list if you make the list circular and you retain\
    \ an unused cell at the start of the list. Here is an example list with 4 data\
    \ nodes: ![](img/443639abd490bee82d518502d35b07b9_171_0.png)\n\nWe see that the\
    \ variable list points to the first node of the list, called the \"head node\"\
    . The head node has a value, but we never use it. The pointer in each node points\
    \ to the next node in the list and the previous node. The previous pointer of\
    \ the head node is the last node in the list. This makes this list capable of\
    \ implementing a stack (last-in-out), a queue (first-in-out) or a double-ended\
    \ queue (deque). The primary advantage of this design is that the list is never\
    \ really empty - the head node remains. Furthermore, once a list is created, the\
    \ pointer to the head node never changes.\n\n### 15.2. DOUBLE-LINKED LISTS\n\n\
    ### 15.2.1 Doubly-linked node structure\n\nOur list will have 3 fields: a data\
    \ value, a pointer to the next node and a pointer to the previous node. The yasm\
    \ definition is\n\n```asm\nstruct node\nn_value resq 1\nn_next resq 1\nn_prev\
    \ resq 1\n        align 8\nendstruct\n```\n\n### 15.2.2 Creating a new list\n\n\
    The code for creating a doubly-linked list allocates a new node and sets its next\
    \ and previous pointers to itself. The calling function receives a pointer which\
    \ does not change during the execution of the program. Here is the creation code:\n\
    \n```asm\n; list = newList();\nnewlist:\n    push rbp\n    mov rbp, rsp\n    mov\
    \ edi, node_size\n    call malloc\n    mov [rax+n_next], rax\n    mov [rax+n_prev],\
    \ rax\n    leave\n    ret\n```\n\nWhen it returns the empty list looks like the\
    \ diagram: ![](img/443639abd490bee82d518502d35b07b9_172_0.png)\n\n### 15.2.3 Inserting\
    \ at the front of the list\n\nTo insert a new node at the front of the list you\
    \ need to place the head node's next pointer in the new node's next slot and place\
    \ the previous pointer from head's next into the new node's previous slot. After\
    \ doing that you can make the head node point forward to the new node and make\
    \ the head's former next backwards to the new node. These are illustrated in the\
    \ diagram below. The old links are in dashed lines and the new links are numbered\
    \ with bold lines. ![](img/443639abd490bee82d518502d35b07b9_173_0.png)\n\nOne\
    \ of the elegant features of the doubly-linked circular list is the elimination\
    \ of special cases. Inserting the first node is done with exactly the same code\
    \ as inserting any other node. The code for insertion is\n\n```asm\n; insert (\
    \ list, k);\ninsert:\n.list equ 0\n.k equ 8\npush rbp\nmov rsp, 16\nmov [rsp+.list],\
    \ rdi ; save list pointer\nmov [rsp+.k], rsi ; and k on stack\nmov edi, node_size\n\
    call malloc ; rax will be node pointer\nmov r8, [rsp+.list] ; get list pointer\n\
    mov r9, [r8+next] ; get head's next\nmov [rax+next], r9 ; set new node's next\n\
    mov [rax+prev], r8 ; set new node's prev\nmov [r8+next], rax ; set head's next\n\
    mov [r9+prev], rax ; set new node's next's prev\nmov r9, [rsp+.k] ; get k\nmov\
    \ [rax+n_value], r9 ; save k in node\nleave\nret\n```\n\n### 15.2.4 List traversal\n\
    \nList traversal of a doubly-linked list is somewhat similar to traversal of a\
    \ singly-linked list. We need to skip past the head node and we need to test the\
    \ current pointer against the pointer to the head node to detect the end of the\
    \ list. Here is the code for printing the list:\n\n```asm\n; print ( list );\n\
    print:\n      segment .data\n.print_fmt:\n      db      \"%ld\",0\n.newline:\n\
    \      db      0x0a,0\n      segment .text\n.list    equ     0\n.rbx    equ  \
    \   8\npush    rbp\nmov      rbp, rsp\nsub      rsp, 16\nmov      [rsp+.rbx],\
    \ rbx\nmov      [rsp+.list], rdi\nmov      rbx, [rdi+n_next]\nmov      rbx, [rsp+.list]\n\
    je      .done\nmore    lea     rdi, [.print_fmt]\nmov      rsi, [rbx+n_value]\n\
    call    printf\nmov      rbx, [rbx+n_next]\nmp      rbx, [rsp+.list]\njne    \
    \ .more\n.done lea     rdi, [.newline]\ncall    printf\n```\n"
