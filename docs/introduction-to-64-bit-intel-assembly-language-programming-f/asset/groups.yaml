    \ note that the sign bit is 1. Now we will work on 121.6875. It's fairly easy\
    \ to convert the integer portion of the number: 121 = 1111001. Now we will work\
    \ on the fraction.\n\nLet's suppose we have a binary fraction $x = 0.abcdef$,\
    \ where the letters indicate either 0 or a 1. Then $2^x = a.bcdefgh$. This indicates\
    \ that multiplying by 2 will expose a bit.\n\nWe have $2 \times 0.6875 = 1.375$\
    \ so the first bit to the right of the binary point is 1. So our number is 1111001.1.\n\
    \nNext multiply the fraction: $2 \times 0.375 = 0.75$, so the next bit is 0. We\
    \ have 1111001.10.\n\nMultiplying again: $2 \times 0.75 = 1.5$, so the next bit\
    \ is 1. We now have 1111001.101b.\n\nMultiplying again: $2 \times 0.5 = 1$, so\
    \ the next bit is 1 leaving 1111001.1011b So our number -121.6875 = -1111001.1011b.\
    \ We need to get this into exponential notation with a power of 2.\n\n```\n-121.6875\
    \ = -1111001.1011\n= -1.1110010111 * 2^6\n```\n\nWe now have all the pieces. The\
    \ sign bit is 1, the fraction (without the implied 1) 111001011100000000000 and\
    \ the exponent field is 127+6 = 133 = 10000101. So our number is\n\n1 10000101\
    \ 111001011100000000000.\nOrganized into nibbles, this is 1100 0010 1111 0011\
    \ 0110 0000 0000"
