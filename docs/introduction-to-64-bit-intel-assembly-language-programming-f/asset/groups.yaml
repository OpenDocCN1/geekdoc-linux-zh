    ## 19.3. Implementation using AVX instructions


    The Core i7 CPU implements a new collection of instructions called “Advanced Vector
    Extensions” or AVX. For these instructions, an extension of the XMM registers
    named ymm0 through ymm15 is provided along with some new instructions. The YMM
    registers are 256 bits each and can hold 4 double precision values in each one.
    This allowed a fairly easy adaptation of the SSE function to operate on 4 values
    at once.


    In addition to providing the larger registers, the AVX instructions added versions
    of existing instructions which allowed using 3 operands: source operands and a
    destination which did not participate as a source


    ## CHAPTER 19. COMPUTING CORRELATION


    (unless you named the same register twice). The AVX versions of instructions are
    prefixed with the letter "v". Having 3 operand instructions reduces the register
    pressure and allows using two registers as sources in an instruction while preserving
    their values.


