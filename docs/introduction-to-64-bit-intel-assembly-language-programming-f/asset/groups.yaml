    # 10.2 General pattern for memory references


    So far we have used array references in sample code without discussing the options
    for memory references. A memory reference can be expressed as


    +   [label+2*ind] the value contained at label


    +   [label+4*ind] the value contained at the memory address obtained by adding
    the label and index register times 2


    +   [label+8*ind] the value contained at the memory address obtained by adding
    the label and index register times 4


    +   [reg] the value contained at the memory address obtained by adding the label
    and index register times 8


    +   [reg+k*ind] the value contained at the memory address obtained by adding the
    register and index register times k


    +   [label+reg+k*ind] the value contained at the memory address obtained by adding
    the label, the register and index register times k'
  - '[PAGE 117]


    # 102 CHAPTER 10. ARRAYS


    [number+reg+k*ind] the value contained at the memory address obtained by adding
    the number, the register and index register times k


    This allows a lot of flexibility in array accesses. For arrays in the text and
    data segments it is possible to use the label along an index register with a multiplier
    for the array element size (as long as the array element size is 1, 2, 4 or 8).
    With arrays passed into functions, the address must be placed in a register. Therefore
    the form using a label is not possible. Instead we could use a base register with
    an index register. Any of the 16 general purpose registers may be used as a base
    register or an index register, however it is unlikely that you would use the stack
    pointer register as an index register.


    Let''s look at an example using a base register and an index register. Let''s
    suppose we wish to copy an array to another array in a function. Then the two
    array addresses could be the first 2 parameters (rdi and rsi) and the number of
    array elements be the third parameter rdx. Let''s assume that the arrays are double
    word arrays.


    ```

    segment .text

    global .copy_array

    copy_array:

    xor ecx, ecx

    mov eax, [rsi+4*rcx]

    mov [rdi+4*rcx], eax

    add rcx, 1

    cmp rcx, rdx

    je more

    xor eax, eax

    ret

    ```


    In the copy_array function we used the parameters as they were provided. We used
    rsi as the base register for the source array and rdi as the base address register
    for the destination array. For both accesses we used rcx as the index register
    with a multiplier of 4 since the arrays have 4 byte elements. This allows us to
    compare rcx versus rdx to see if there are more elements to copy.'
