    \      rdi, node_size\ncall     malloc\nmov      r9, [rsp+.h]\nmov      r8, [table+r9*8]\n\
    mov    [rax+n_next], r8\nmov    r8, [rsp+.n]\nmov    [rax+n_value], r8\nmov  \
    \  [table+r9*8], rax\n```\n\n### 15.3.6 Printing the hash table\n\nThe print function\
    \ iterates through the indices from 0 through 255, printing the index number and\
    \ the keys on each non-empty list. It uses registers r12 and r13 for safe storage\
    \ of a loop counter to iterate through the locations of the hash table array and\
    \ a pointer to loop through the nodes on each linked list. This is more convenient\
    \ using registers which would require saving and restoring around each printf\
    \ call. It does require pushing and popping these 2 registers at the start and\
    \ end of the function to preserve them for calling functions. Note that pushing\
    \ and popping 16 bytes is necessary to preserve the proper stack alignment. You\
    \ will notice that the code switches back and forth between the data and text\
    \ segments so that printf format strings will be placed close to their point of\
    \ use in the code.\n\nprint:\n\n```\npush    rbp\nmov     rbp, rsp\npush    r12\
    \            ; i: integer counter for table\npush    r13            ; p: pointer\
    \ for list at table[i]\nxor     r12, r12\n.more_table:\nmov     r13, [table+r12*8]\n\
    cmp     r13, 0\nje      .empty\nsegment  .data\n.print1 db    \"list %3d: \",0\n\
    segment  .text\nlea     rdi, [.print1]\nmov     rsi, r12\ncall   printf\n.more_list:\n\
    \    segment  .data\n    print2 db    \"%ld:\",0\n    segment  .text\n    lea\
    \     rdi, [.print2]\n    mov     rsi, [r13+n_value]\n    call   printf\n    lea\
    \     rdi, [.print3]\n    mov     rsi, r12\n    call   printf\n    inc     r12\n\
    \    mov     r13, [rax+n_next]\n    cmp     rax, 0\n    jne     ..more_list\n\
    .empty:\n    pop     r13\n    pop     r12\n    leave\n    ret\n```\n\n### 15.3.7\
    \ Testing the hash table\n\nThe main function for the hash table reads numbers\
    \ with scanf, inserts them into the hash table and prints the hash table contents\
    \ after each insertion:\n\n```\nmain:\n    .k equ 0\n    segment .data\n.scanf_fmt:\n\
    \    db \"%ld\",0\n    segment .text\n    push .rbp\n    mov rbp, rsp\n    sub\
    \ rsp, 16\n.more lea rdi, [.scanf_fmt]\n      lea rsi, [rsp+.k]\n      call scanf\n\
    \      cmp rax, 1\n      jne .done\n      mov rdi, [rsp+.k]\n      call insert\n\
    \      call print\n      jmp .more\n.done leave\n      ret\n```\n\nBelow is the\
    \ printing of the hash table after inserting 1, 2, 3, 4, 5, 256, 257, 258, 260,\
    \ 513, 1025 and 1028.\n\n+   list 0: 256\n+   list 1: 1025 257 1\n+   list 2:\
    \ 258 2\n+   list 3: 3\n+   list 4: 1028 260 4\n+   list 5: 5\n\n## 15.4 Binary\
    \ trees\n\nA binary tree is a structure with possibly many nodes. There is a single\
    \ root node which can have left or right child nodes (or both).\n\nGenerally binary\
    \ trees are built with an ordering applied to keys in the nodes. For example you\
    \ could have a binary tree where every node divides keys into those less than\
    \ the node's key (in the left sub-tree) and those greater than the node's key\
    \ (in the right sub-tree).\n\nHaving an ordered binary tree, often called a binary\
    \ search tree, makes it possible to do fast searches for a key while maintaining\
    \ the ability to traverse the nodes in increasing or decreasing order.\n\nHere\
    \ we will present a binary tree with integer keys with the ordering being lower\
    \ keys on the left and greater keys on the right. First are the structures used\
    \ for the tree.\n"
