    接下来是一个定义在相对地址 4 处的、名为 b 的浮点值双字。b 的字节顺序也是反转的。将其考虑为 0x488ccd。那么符号位为 0，指数字段是“第一个”字节最右侧的
    7 位（0x40）加上下一个字节的最左侧位（0x8c）。因此指数字段为 0x81 = 129，对应的二进制指数为 2。尾数字段（带有隐含的初始 1 位）是
