    # CHAPTER 8. BRANCHING AND LOOPING


    The string operations update the source and/or destination registers after each
    use. This updating is managed by the direction flag (DF). If DF is 0 then the
    registers are increased by the size of the data item after each use. If DF is
    1 then the registers are decreased after each use.


    # Move


    The movsb instruction moves bytes from the address specified by rsi to the address
    specified by rdi.. The other mov instructions move 2, 4 or 8 byte data elements
    using from [rdi] to [rsi]. The data moved is stored in a register and no flags
    are affected. After each data item is moved, the rdi and rsi registers are advanced
    1, 2, 4 or 8 bytes depending on the size of the data item.


    Below is some code to move 100000 bytes from one array to another:


    ```

    lea      rsi, [source]

    lea      rdi, [destination]

    mov      rcx, 100000

    rep      movsb

    ```


    # Store


    The stosb instruction moves the byte in register al to the address specified by
    rdi. The other variants move data from ax, eax or rax to memory. No flags are
    affected. A repeated store can fill an array with a single value. You could use
    stosb in non-repeat loops taking advantage of the automatic destination register
    updating.


    Here is some code to fill an array with 100000 double words all equal to 1:


    ```

    mov      eax, 1

    mov      ecx, 100000

    lea      rdi, [destination]

    rep      stosd

    ```


    # Load


    The lodsb instruction moves the byte from the address specified by rsi to the
    al register. The other variants move more bytes of data into ax, eax'
