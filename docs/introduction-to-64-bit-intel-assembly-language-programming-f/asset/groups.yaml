    # 2.4. FLOATING POINT NUMBERS


    required for a complete description of IEEE 754, but this is sufficient for our
    needs.


    To illustrate floating point data, consider the following assembly file


    ```

    segment .data

    zero      dd 0.0

    one      dd 1.0

    neg1    dd -1.0

    a        dd 1.75

    b        dd 122.5

    nd       dd 1.1

    e       dd 10000000000.0

    ```


    This is not a program, it is simply a definition of 7 float values in the .data
    segment. The dd command specifies a double word data item. Other options include
    db (data byte), dw (data word) and dq (data quad-word). A word is 2 bytes, a double
    word is 4 bytes and a quad-word is 8 bytes.


    Now consider the listing file produced by yasm


    ```

    %line 1+1 fp.asm

    2 [section .data]

    3 00000000 00000000 zero dd 0.0

    4 00000004 0000803F one dd 1.0

    5 00000008 000080BF neg1 dd -1.0

    6 0000000C 0000E03F a dd 1.75

    7 00000010 0000F542 b dd 122.5

    8 00000014 CDC8C3CF d dd 1.1

    9 00000018 F9021555 e dd 100000000000.0

    ```


    The zero variable is hosted as expected - all 0 bits. The other numbers might
    be a little surprising. Look at one - the bytes are backwards! Reverse them and
    you get 3F800000. The most significant byte is 3F. The sign bit is 0. The exponent
    field consists of the 7 bits of the most significant byte and the first of the
    next. This means that the exponent field is 127 and the actual binary exponent
    is 0. The remaining bits are the binary fraction field - all 0''s. Thus the value
    is 1.0 * 2⁰ = 1.0.'
