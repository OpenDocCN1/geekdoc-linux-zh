- md: "\n## 15.4. BINARY TREES\n\n### 15.4.1 Binary tree node and tree structures\n\
    \nThe nodes in the binary tree have an integer value and two pointers. The structure\
    \ definition below uses a prefix convention in naming the value field as n_value\
    \ and the left and right pointers as n_left and n_right.\n\n```\nstruct node\n\
    n_value resq 1\nn_left resq 1\nn_right resq 1\n        align 8\nendstruct\n```\n\
    \nIt would be possible to simply use a pointer to the root node to represent the\
    \ tree. However we could add features to the tree, like node deletion or balancing,\
    \ which could change the root of the tree. It seems logical to store the root\
    \ in a structure insulating us from future root changes in a tree. We have also\
    \ included in the tree structure a count of the number of nodes in the tree.\n\
    \n```\nstruct tree\nt_count resq 1\nt_root resq 1\n        align 8\nendstruct\n\
    ```\n\n### 15.4.2 Creating an empty tree\n\nThe new_tree function allocates memory\
    \ for a tree structure and sets the count and the root of the new tree to 0. By\
    \ having the root of the tree in a structure the code using the binary tree always\
    \ refers to a particular tree using the pointer returned by new_tree.\n\nnew_tree:\n\
    \n```\npush rbp\nmov rbp, rsp\nmov rdi, tree_size\ncall malloc\nxor edi, edi\n\
    mov [rax+t_root], rdi\nmov [rax+t_count], rdi\nleave\nret\n```\n\n### 15.4.3 Finding\
    \ a key in a tree\n\nTo find a key in a binary search tree you start with a pointer\
    \ to the root node and compare the node's key with the key being sought. If it's\
    \ a match you're done. If the target key is less than the node's key you change\
    \ your pointer to the node's left child. If the target key is greater than the\
    \ node's key you change the pointer to the node's right child. You then repeat\
    \ these comparisons with the new node. If you reach a NULL pointer, the key is\
    \ not in the tree. Below is the code for finding a key in a binary tree. It returns\
    \ a pointer to the correct tree node or NULL if not found.\n\n```\n; p = find\
    \ ( t, n );\n; p = 0 if not found\nfind:\n    push rbp\n    mov rbp, rsp\n   \
    \ mov rdi, [rdi+t_root]\n    xor eax, eax\n.more cmp rdi, 0\n    je .done\n  \
    \  cmp rsi, [rdi+n_value]\n    jl .gleft\n    jg .gright\n    mov rax, rsi\n \
    \   jmp .done\n.gleft:\n    mov rdi, [rdi+n_left]\n    jmp .more\n.gright:\n \
    \   mov rdi, [rdi+n_right]\n    jmp .more\n.done leave\nret\n```\n\n### 15.4.4\
    \ Inserting a key into the tree\n\nThe first step in inserting a key is to use\
    \ the find function to see if the key is already there. If it is, then there is\
    \ no insertion. If not, then a new tree node is allocated, its value is set to\
    \ the new key value and its left and right child pointers are set to NULL. Then\
    \ it's time to find where to place this in the tree.\n\nThere is a special case\
    \ for inserting the first node in the tree. If the count of nodes in the tree\
    \ is 0, then the count is incremented and the tree's root pointer is set to the\
    \ new node.\n\nIf the tree is non-empty then you start by setting a current pointer\
    \ to point to the root node. If the key is less than the current node's key, then\
    \ the new node belongs in the left sub-tree. To handle this you inspect the left\
    \ child pointer of the current node. If it is null, you have found the insertion\
    \ point, so set the left pointer to the pointer of the new node. Otherwise update\
    \ your current node pointer to be the left pointer and start comparisons with\
    \ this node. If it is less than the current node's key, it must be greater than.\
    \ In that case you inspect the current node's right child pointer and either set\
    \ it the new node's pointer or advance your current pointer to the right child\
    \ and repeat the comparison process.\n\n```\n; insert ( t, n );\n.n equ 0\n.t\
    \ equ 8\npush rbp\nmov rbp, rsp\nsub rsp, 16\nmov [rsp+.t], rdi\nmov [rsp+.n],\
    \ rsi\ncall find\ncmp rax, 0\nje .done\nmov rdi, node_size\ncall malloc\nmov rsi,\
    \ [rsp+.n]\nmov [rax+n_value], rsi\nxor edi, edi\nmov [rax+n_left], rdi\nmov [rax+n_right],\
    \ rdi\nmov rdx, [rsp+.t]\nmov rdi, [rdx+t_count]\nmov rdi, 0\njne .findparent\n\
    inc qword[rdx+t_count]\nmov [rdx+t_root], rax\nmp .done\n.findparent:\nmov rdx,\
    \ [rdx+t_root]\n.repeatfind:\ncmp rsi, [rdi+n_value]\nje .done\n.gleft:\nmov rdi,\
    \ [rdi+n_left]\njmp .repeatfind\n.gright:\nmov rdi, [rdi+n_right]\njmp .repeatfind\n\
    .done leave\nret\n```\n\n### 15.4.5 Printing the keys in order\n\nPrinting the\
    \ keys in order is easily performed by a recursive in-order traversal. The basic\
    \ idea is to visit the left subtree, print the root node, and then visit the right\
    \ subtree.\n\n```\n; print_order ( t );\nprint:\n    push rbp\n    mov rbp, rsp\n\
    \    mov rdi, [rdi+t_root]\n    cmp rdi, 0\n    je .done\n    push rdi\n    mov\
    \ rdi, [rdi+n_left]\n    call print\n    pop rdi\n    mov rsi, [rdi+n_value]\n\
    \    mov rdi, format\n    call printf\n    push rdi\n    mov rdi, [rdi+n_right]\n\
    \    call print\n    pop rdi\n.done:\n    pop rbp\n    ret\n```\n"
  mdcn: "\n\n## 15.4. 二叉树\n\n### 15.4.1 二叉树节点和树结构\n\n二叉树中的节点包含一个整数值和两个指针。下面的结构定义在命名上使用了前缀约定，将值字段命名为\
    \ `n_value`，将左右指针分别命名为 `n_left` 和 `n_right`。\n\n```\nstruct node\nn_value resq\
    \ 1\nn_left resq 1\nn_right resq 1\n        align 8\nendstruct\n```\n\n虽然可以使用一个指向根节点的指针来表示树。但是，我们可以为树添加功能，例如节点删除或平衡，这些操作可能会改变树的根。将根节点存储在一个结构中是有逻辑的，这可以让我们免受未来树根变化的影响。我们还在树结构中包含了树节点数量的计数。\n\
    \n```\nstruct tree\nt_count resq 1\nt_root resq 1\n        align 8\nendstruct\n\
    ```\n\n### 15.4.2 创建空树\n\n`new_tree` 函数为树结构分配内存，并将新树的计数和根节点设置为 0。通过将树的根放在一个结构中，使用二叉树的代码始终通过\
    \ `new_tree` 返回的指针来引用特定的树。\n\nnew_tree:\n\n```\npush rbp\nmov rbp, rsp\nmov rdi,\
    \ tree_size\ncall malloc\nxor edi, edi\nmov [rax+t_root], rdi\nmov [rax+t_count],\
    \ rdi\nleave\nret\n```\n\n### 15.4.3 在树中查找键\n\n在二叉搜索树中查找键时，你从一个指向根节点的指针开始，将节点的键与要查找的键进行比较。如果匹配，则完成。如果目标键小于节点的键，则将指针更改为节点的左子节点。如果目标键大于节点的键，则将指针更改为节点的右子节点。然后你对新节点重复这些比较。如果你到达一个\
    \ NULL 指针，说明该键不在树中。下面是在二叉树中查找键的代码。它返回一个指向正确树节点的指针，如果未找到则返回 NULL。\n\n```\n; p =\
    \ find ( t, n );\n; p = 0 if not found\nfind:\n    push rbp\n    mov rbp, rsp\n\
    \    mov rdi, [rdi+t_root]\n    xor eax, eax\n.more cmp rdi, 0\n    je .done\n\
    \    cmp rsi, [rdi+n_value]\n    jl .gleft\n    jg .gright\n    mov rax, rsi\n\
    \    jmp .done\n.gleft:\n    mov rdi, [rdi+n_left]\n    jmp .more\n.gright:\n\
    \    mov rdi, [rdi+n_right]\n    jmp .more\n.done leave\nret\n```\n\n### 15.4.4\
    \ 向树中插入键\n\n插入键的第一步是使用 `find` 函数查看该键是否已经存在。如果存在，则不需要插入。如果不存在，则分配一个新的树节点，将其值设置为新的键值，并将它的左右子节点指针设置为\
    \ NULL。然后，是时候寻找在树中放置该节点的位置了。\n\n在树中插入第一个节点时有一个特殊情况。如果树中的节点计数为 0，则计数加 1，并将树的根指针设置为新节点。\n\
    \n如果树非空，则你首先设置一个当前指针指向根节点。如果键小于当前节点的键，则新节点应该属于左子树。为了处理这种情况，你检查当前节点的左子指针。如果它是为空的，你你找到了插入点，因此将左指针设置为新节点的指针。否则，更新你的当前节点指针为左指针，并与该节点开始比较。如果它小于当前节点的键，那么它一定大于该键。在这种情况下，你检查当前节点的右子指针，要么将其设置为新节点的指针，要么将你的当前指针移动到右子节点并重复比较过程。\n\
    \n```\n; insert ( t, n );\n.n equ 0\n.t equ 8\npush rbp\nmov rbp, rsp\nsub rsp,\
    \ 16\nmov [rsp+.t], rdi\nmov [rsp+.n], rsi\ncall find\ncmp rax, 0\nje .done\n\
    mov rdi, node_size\ncall malloc\nmov rsi, [rsp+.n]\nmov [rax+n_value], rsi\nxor\
    \ edi, edi\nmov [rax+n_left], rdi\nmov [rax+n_right], rdi\nmov rdx, [rsp+.t]\n\
    mov rdi, [rdx+t_count]\nmov rdi, 0\njne .findparent\ninc qword[rdx+t_count]\n\
    mov [rdx+t_root], rax\nmp .done\n.findparent:\nmov rdx, [rdx+t_root]\n.repeatfind:\n\
    cmp rsi, [rdi+n_value]\nje .done\n.gleft:\nmov rdi, [rdi+n_left]\njmp .repeatfind\n\
    .gright:\nmov rdi, [rdi+n_right]\njmp .repeatfind\n.done leave\nret\n```\n\n###\
    \ 15.4.5 按序打印键\n\n按序打印键可以通过递归中序遍历轻松完成。基本思想是访问左子树，打印根节点，然后访问右子树。\n\n```\n; print_order\
    \ ( t );\nprint:\n    push rbp\n    mov rbp, rsp\n    mov rdi, [rdi+t_root]\n\
    \    cmp rdi, 0\n    je .done\n    push rdi\n    mov rdi, [rdi+n_left]\n    call\
    \ print\n    pop rdi\n    mov rsi, [rdi+n_value]\n    mov rdi, format\n    call\
    \ printf\n    push rdi\n    mov rdi, [rdi+n_right]\n    call print\n    pop rdi\n\
    .done:\n    pop rbp\n    ret\n```\n\n"
