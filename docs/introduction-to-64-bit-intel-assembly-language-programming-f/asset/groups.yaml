- md: "\n# Introduction to 64 Bit Intel Assembly Language Programming for Linux\n\n\
    Ray SEYFARTH\n\n![](img/443639abd490bee82d518502d35b07b9_0_0.png)\n\n# Introduction\
    \ to 64 Bit Intel Assembly Language Programming for Linux\n\nRay Seyfarth\n\n\
    October 27, 2011\n\nRay Seyfarth\nSchool of Computing\nUniversity of Southern\
    \ Mississippi\nHattiesburg, MS 39406\nUSA\n\nSeyfarth, Ray\nIntroduction to 64\
    \ Bit Intel Assembly Language Programming\nIncludes index.\nISBN-13: 978-1466470033\n\
    ISBN-10: 1466470038\n\n©2011 Ray Seyfarth\nAll rights reserved. This work may\
    \ not be translated or copied in whole\nor in part without the written permission\
    \ of the copyright holder, except\nfor brief excerpts in connection with reviews\
    \ or scholarly analyses.\n\n# Preface\n\nThe Intel CPU architecture has evolved\
    \ over 3 decades from a 16 bit CPU with no memory protection, through a period\
    \ with 32 bit processors with sophisticated architectures into the current series\
    \ of processors which support all the old modes of operation in addition to a\
    \ greatly expanded 64 bit mode of operation. Assembly textbooks tend to focus\
    \ on the history and generally conclude with a discussion on the 32 bit mode.\
    \ Students are introduced to the concepts of 16 bit CPUs with segment registers\
    \ allowing access to 1 megabyte of internal memory. This is an unnecessary departure\
    \ on the past.\n\nWith the x86-64 architecture there is almost a complete departure\
    \ from the past. Segment registers are essentially obsolete and more register\
    \ usage is completely general purpose.\n\nThere are now 16 general purpose integer\
    \ registers with a few specialized instructions. The archaic register stack of\
    \ the 8087 has been superseded by a well-organized model providing 16 floating\
    \ point registers with the floating point instructions for the SSE and AVX extensions.\
    \ In fact the AVX extensions allow even a three operand syntax which can simplify\
    \ coding even more.\n\nOverall the x86-64 assembly programming is simpler than\
    \ its predecessors. The dominant mode of operation will be 64 bits within a few\
    \ short years. Together these trends indicate that it is time to teach 64 bit\
    \ assembly language.\n\nThe focus in this textbook is early hands-on use of 64\
    \ bit assembly programming. There is no 16 or 32 bit programming and the discussion\
    \ of the history is focused on explaining the origin of the old register names\
    \ and the few non-orthogonal features of the instruction set.\n\nThe intention\
    \ is to get students involved with using the yasm assembler and the gdb debugger\
    \ from the start. There are assignments using the computer from the very first\
    \ chapter. Not every statement will be fully understood at this time, but the\
    \ assignments are still possible.\n\nThe primary target for this book is beginning\
    \ assembly language programmers and for a gentle introduction to assembly programming,\
    \ students should study chapters 1, 2, 3, 5, 6, 7, 8, 9, 10 and 11. Chapter 4\
    \ on memory mapping is not critical to the rest of the book and can be skipped\
    \ if desired.\n\nChapters 12 through 15 are significantly more in depth. Chapter\
    \ 15 is about data structures in assembly and is an excellent adjunct to studying\
    \ data structures in C/C++. The subject will be much clearer after exposure in\
    \ assembly language.\n\nThe final four chapters focus on high performance programming,\
    \ including discussion of SSE and AVX programming.\n\nThe author provides PDF\
    \ slides for classroom instruction along with sample code and errata at http://rayseyfarth.com/asm.\n\
    \nIf you find errors in the book or have suggestions for improvement, please email\
    \ the author at ray.seyfarth@gmail.com.\n\nThank you for buying the book and I\
    \ hope you find something interesting and worthwhile inside.\n\n# Acknowledgements\n\
    \nNo book is created in isolation. This book is certainly no exception. I am indebted\
    \ to numerous sources for information and assistance with this book.\n\nDr. Paul\
    \ Carter's PC assembly language book was used by this author to study 32 bit assembly\
    \ language programming. His book is a free PDF file downloadable from his web\
    \ site. This is a 195 page book which covers the basics of assembly language and\
    \ is a great start at 32 bit assembly language.\n\nWhile working on this book,\
    \ I discovered a treatise by Drs. Bryant and O'Hallaron of Carnegie Mellon about\
    \ how gcc takes advantage of the features of the x86-64 architecture to produce\
    \ efficient code. Some of their observations have helped me understand the CPU\
    \ which assists with writing better assembly code. Programmers interested in efficiency\
    \ should study their work.\n\nI found the Intel manuals to be an invaluable resource.\
    \ They provide details on all the instructions of the CPU. Unfortunately the documents\
    \ cover 32 bit and 64 bit instructions together, along with the huge number of\
    \ instructions, makes it difficult to learn assembly programming from these manuals.\
    \ I hope that reading this book will make a good starting point, but a short book\
    \ cannot cover many instructions. I have selected what I consider the most important\
    \ instructions for general use, but an assembler will need to study the Intel\
    \ manuals (or equivalent manuals from AMD).\n\nI thank my friends Maggie and Tim\
    \ Hampton for the editing contributions to the book.\n\nI am indebted to my CSC\
    \ 203 - Assembly Language class at the University of Southern Mississippi for\
    \ their contributions to this book.\n\nvi \n\nTeaching 64-bit assembly language\
    \ has uncovered a few mistakes and errors in the original Create Space book from\
    \ July 2011. In particular I wish to thank Chris Greene, Evan Stuart and Brandon\
    \ Wolfe for locating errors in the book.\n\nLast I thank my wife, Phyllis, and\
    \ my sons, David and Adam, for their encouragement and assistance. Phyllis and\
    \ Adam are responsible for the cover design for both this and the Create Space\
    \ book.\n\n# Contents\n\nPreface iii\nAcknowledgements v\n\n- 1 Introduction .\
