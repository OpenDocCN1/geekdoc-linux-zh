    # 7.6. BIT TESTING AND SETTING


    The x86-64 instruction set also includes rotate left (rol) and rotate right (ror)
    instructions. These could be used to shift particular parts of a bit string into
    proper position for testing while preserving the bits. After rotating the proper
    number of bits in the opposite direction, the original bit string will be left
    in the register or memory location.


    # 7.6 Bit testing and setting


    It takes several instructions to extract or insert a bit field. Sometimes you
    need to extract or insert a single bit. This can be done using masking and shifting
    as just illustrated. However it can be simpler and quicker to use the test instruction
    (bt) and either the bit test and set instruction (bts) or the bit test and reset
    instruction (btr).


    The bt instruction has 2 operands. The first operand is a 16, 32 or 64 bit word
    in memory or a register which contains the bit to test. The second operand is
    the bit number from 0 to the number of bits minus1 for the word size which is
    either an immediate value or a value in a register. The bt instructions set the
    carry flag (CF) to the value of the bit being tested.


    The bts and btr instructions operate somewhat similarly. Both instructions test
    the current bit in the same fashion as bt. They differ in that sts sets the bit
    to 1 and btr sets the bit to 0.


    One particular possibility for using these instructions is to implement a set
    of fairly large size where the members of the set are integers from 0 to n-1 where
    n is the universe size. A membership test translates into determining a word and
    bit number in memory and testing the correct bit in the word. Following the bt
    instruction setc instruction can be used to store the value of the carry flag
    into an 8 register. There are set-instructions for each of the condition flags
    in the eflags register. Insertion into the set translates into determining the
    word and bit number and using bts to set the correct bit. Removal of an element
    of the set translates using btr to clear the correct bit in memory.


    In the code below we assume that the memory for the set is at a memory location
    named data and that the bit number to work on is in register rax. The code preserves
    rax testing, insertion and removal.'
