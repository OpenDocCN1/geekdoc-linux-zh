    So we have


    ```

    0x3ea147ae = 1.010000101000111010101110₂ * 2⁻²

    = 0.01010000101000111010101110₂

    ```


    Now we can align the numbers and add

    10101.0100011001101010


    ```

    + 0.0101000010100011111010110

    101001.1001011100010100101110

    ```


    Now we have too many bits to store in a 32 bit float. The rightmost 7 bits will
    be rounded (dropped in this case) to get


    ```

    =101001.10010111000010010101₂ * 2⁵

    ```


    The exponent is 5 and the exponent field is again 132. Dropping the leading 0,
