    One advantage of assembly language is that it can do things not possible in high
    level languages. Examples of this include handling hardware interrupts and managing
    memory mapping features of a CPU. These features are essential in an operating
    system, though not required for application programming.


    So we have seen that assembly language is much more difficult to use than higher
    level languages and only offers benefits in special cases to well-trained programmers.
    What benefit is there for most people?


    The primary reason to study assembly language is to learn how a CPU works. This
    helps when programming in high level languages. Understanding how the compiler
    implements the features of a high level language can aid in selecting features
    for efficiency. More importantly understanding the translation from high level
    language to machine language is fundamental in understanding why bugs behave the
    way they do. Without studying assembly language, a programming language is primarily
    a mathematical concept obeying mathematical laws. Underneath this mathematical
    exterior the computer executes machine instructions which have limits and can
