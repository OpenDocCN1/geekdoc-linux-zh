    \ bit\n\nUsing two's complement the largest 8 bit integer is 10000000. To convert\
    \ this back, complement the rightmost 7 bits and add 1. This gives 11111111 +\
    \ 1 = 10000000 = 128, so 10000000 = -128. You may have noticed in the table of\
