    # 16.19 Use specialized instructions


    So far we have seen the conditional move instruction which is fairly specialized
    and also the packed floating point instructions. There are many specialized instructions
    in the x86-64 architecture which are more difficult for a compiler to apply. A
    human can reorganize an algorithm to add the elements of an array somewhat like
    I did with with loop unrolling except to keep 4 partial sums in one AVX register.
    Combining the 4 parts of the AVX register can be done after the loop. This can
    make the adding even faster, since 4 adds can be done in one instruction. This
    technique can also be combined with loop unrolling for additional performance.
    This will be explored in detail in the SSE and AVX chapters.'
