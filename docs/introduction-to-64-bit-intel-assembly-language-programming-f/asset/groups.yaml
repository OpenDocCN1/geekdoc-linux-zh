    \ the “logical” not and “~” as the “bit-wise” not. We will use “~” since the assembly\
    \ language not instruction inverts each bit of a word. Here are some examples,\
    \ illustrating the meaning of not.\n\n```\n~0 == 1\n~1 == 0\n~1010101b == 0101001b\n\
    ~0xff == 0x0ff\n```\n\nThe not instruction has a single operand which serves as\
    \ both the source and the destination. It can be applied to bytes, words, double\
    \ words and quad-words in registers or in memory. Here is a snippet illustrating\
    \ its use.\n\n```\nmov rax, 0\nnot rax ; rax == 0xffffffffffffffff\nmov rdx, 0\
    \ ; preparing for divide\nmov rbx, 15 ; will divide by 15 (0xf)\ndiv rbx ; unsigned\
    \ divide\n      rax == 0x1111111111111111\nnot rax ; rax == 0xeeeeeeeeeeee\n```\n\
    \n## 7.2 And operation\n\nThe operation is also applied in programming in 2 contexts.\
    \ First it is common to test for both of 2 conditions being true -- && in C. Secondly\
    \ you can do an operation of each pair of bits in 2 variables - & in C. We will\
    \ stick with the single & notation, since the assembly language and instruction\
    \ matches the bit-wise and and operation:\n\nHere is a truth table for the operation:\n\
    \n| & | 0 | 1 |\n|---|---|---|\n| 0 | 0 | 0 |\n| 1 | 0 | 1 |\n\nApplied to some\
    \ bit fields we get:\n\n## 7.3. OR OPERATION\n\n1100110b & 0000111b == 0000110b\n\
    1100110b & 1111000b == 1100000b\n0xacdefab & 0xff == 0xab\n0x123456789abcdef &\
    \ 0xff00ff00ff == 0x010045008900cd0\n\nYou might notice that the examples illustrate\
    \ using as a bit field selector. Wherever the right operand is a 1 bit, the operation\
    \ selected the bit from the left operand. You could say the same thing about the\
