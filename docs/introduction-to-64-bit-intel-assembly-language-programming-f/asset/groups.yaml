    # Chapter 6


    # A little bit of math


    So far the only mathematical operation we have discussed is addition. With negation,
    addition, subtraction, multiplication and division it is possible to write some
    interesting programs. For now we will stick with integer arithmetic.


    # 6.1 Negation


    The neg instruction performs the two’s complement of its operand, which can be
    either a general purpose register or a memory reference. You can precede a memory
    reference with a size specifier from the following table:


    | Specifier | Size in bytes |

    |---|---|

    | byte | 1 |

    | word | 2 |

    | dword | 4 |

    | qword | 8 |


    The neg instruction sets the sign flag (SF) and the zero flag (ZF), so it is possible
    to do conditional operations afterwards.


    The following code snippet illustrates a few variations of neg:


    ```

    neg       ; negate the value in rax

    neg dword [x] ; negate a 4 byte integer at x

    neg byte [x] ; negate a byte at x

    ```'
