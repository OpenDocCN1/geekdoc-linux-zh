    \ 结构体定义如下\n\n```asm\nstruct      node\nn_value resq  1\nn_next  resq  1\nn_prev\
    \  resq  1\n        align    8\nendstruct\n```\n\n### 15.2.2 创建空列表\n\n创建双向链表的代码分配一个新节点并设置其后继和前驱指针。这里是创建代码：\n\
    \n```asm\n; list = newList();\nnewlist:\n    push rbp\n    mov rbp, rsp\n    sub\
