    # 9.4 Function parameters and return value


    Most function have parameters which might be integer values, floating point values,
    addresses of data values, addresses of arrays, or any other type of data or address.
    The parameters allow us to use a function to operate on different data with each
    call. In addition most functions have a return value which is commonly an indicator
    of success or failure.

    x86-64 Linux uses a function protocol called the "System V Binary Interface" or
    System ABI. Unfortunately Windows uses a different protocol called the "Microsoft
    x64 Calling Convention". In both protocols some of the parameters to functions
    are passed in registers. Linux allows the first 6 integer parameters to be passed
    in registers, which Windows allows the first 4 (using different registers). Linux
    allows the first 8 floating point parameters to be passed in floating pointer
    registers xmm0-xmm7, while Windows allows the first 4 floating point parameters
    to be passed in registers xmm0-xmm3.


    Both Linux and Windows use rex for integer return values and register xmm0 for
    floating return value registers.


    Both Linux and Windows expect the stack pointer to be maintained on 16 byte boundaries
    in memory. This means that the hexadecimal value for rsp should end in 0. The
    reason for this requirement is to allow local variables in functions to be placed
    at 16 byte alignments for SSE and AVX instructions. Executing a call will decrement
    rsp leaving it with an 8. Conforming functions should either push something or
    subtract from rsp to get it back on a 16 byte boundary. If your function calls
    any external function, it seems wise to stick with the 16 byte bounding requirement.


    The first 6 integer parameters in a function under Linux are passed in registers
    rdi, rsi, rdx, rcx, r8 and r9, while Windows use rcx, rdx, r8 and r9 for the first
    4 integer parameters. If a function requires'
