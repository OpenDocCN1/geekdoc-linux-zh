    # Appendix C


    # Using 0xaa in yasm


    yasm provides both single line macros and multi-line macros. Both of these can
    be used to provide abbreviations with meaningful names for commonly used instructions.
    While these might obscure the mechanisms of assembly language while learning the
    language they can be of significant utility in practical situations.


    # C.1 Single line macros


    A single line macro uses the %define preprocessor. Let''s suppose you are tired
    of seeing 0xa for the new-line character. You could define a macro for this as


    ```

    %define newline 0xa

    ```


    From point forward you could simply use newline and get 0xa inserted in replacement
    for the macro.


    Single line macros can have parameters. Let''s suppose you wanted to define a
    while macro. You might wish to compare a register against a value and if a condition
    is satisfied jump to the top of the loop. Here is a possible while macro:


    ```

    %define while(cc,label) jump%cc label

    ```


    The %+ allows concatenation of tokens. After this definition we could use code
    like'
  - "[PAGE 245]\n\n# APPENDIX C. USING MACROS IN YASM\n\ncmp rax, 20\nwhile(1,.more)\n\
    \n# C.2 Multi-line macros\n\nUsing a multi-line macro can simply our while macro\
    \ to include the required cmp instruction:\n\n```\n%macro while 4\n  cmp %1, %3\n\
    \  j%2 %4\n%endmacro\n```\n\nThe number 4 on the %macro line suggests that 4 parameters\
    \ are expected. You can access each parameter as %1, %2, etc. You can even access\
    \ the number of parameters as %0.\n\nNow this definition leaves the fairly pleasant\
    \ feel of creating an instruction, since the macro invocation does not use parentheses:\n\
    \n```\nwhile rax, 1, 20, .more\n```\n\nAdmittedly this creates an instruction\
    \ with 4 parameters which must be learned, but it simplifies things a little bit.\n\
    \nHow about the standard production of a stack frame:\n\n```\n%macro function\
    \ 2\n  global %1\n%1: push rbp\n  mov rbp, rsp\n  sub rsp, %2\n%endmacro\n```\n\
    \nWe might as well simplify the ending of a function:\n\n```\n%macro return 1\n\
    \  mov rax, %1\n  leave\n  ret\n%endmacro\n```"
  - '[PAGE 246]


    # C.2. MULTI-LINE MACROS


    Now we can write a simple program using both macros


    ```

    function main, 32

    xor eax, eax

    .loop inc rax

    while wax, 1, 10, .loop

    return 0

    ```


    A fairly useful pair of macros from the yasm manual are multipush and multipop.
    These were used earlier in the Sobel example. It makes sense to have a pair of
    macros to push and pop all callee-save registers for use in register intensive
    functions.


    ```

    %macro pushsaved

    push rbp

    push rbx

    push r12

    push r13

    push r14

    push r15

    %endmacro

    ```


    ```

    %macro popsaved

    pop r15

    pop r14

    pop r13

    pop r12

    pop rbx

    pop rbp

    %endmacro

    ```


    Now these don''t preserve 16 byte stack alignment, so perhaps a better choice
    would be needed for some functions. Maybe you could combine the creation of a
    stack frame with pushing the rest of the registers and subtracting from the stack
    pointer to achieve alignment and room for local variables.'
  - '[PAGE 247]


    # C.3 Preprocessor variables


    yasm allows defining preprocessor variables which can be used in macros using
    %assign. You could assign a variable i in one spot and modify it later:


    ```

    %assign i 1

    ...

    %assign i i+1

    ```


    For more information about yasm macros consult the yasm web site as http://www.tortall.net/projects/yasm/manual/html/index.html
    which discusses topics like looping and string length.'
