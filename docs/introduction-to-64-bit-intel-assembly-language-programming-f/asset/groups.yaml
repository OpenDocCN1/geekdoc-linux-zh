    # 22 CHAPTER 2. NUMBERS


    There is only 1 negative value shown: -1.0. It differs in only the sign bit from
    1.0.


    You will notice that 1.75 and 122.5 have a significant number of 0''s in the fraction
    field. This is because .75 and .5 are expressible as sums of negative powers of
    2.


    ```

    0.75 = 0.5 + 0.25 = 2^{-1} + 2^{-2}

    ```


    On the other hand 1.1 is a repeating sequence of bits when expressed in binary.
    This is somewhat similar to expressing 1/11 in decimal:


    ```

    1/11 = 0.090909...

    ```


    Looking at 1.1 in the proper order 1.1 = 0x3F8CCCD. The exponent is 0 and the
    fraction field in binary is 000110011001100101. It looks like the last bit has
    been rounded and that the repeated pattern is 1100.


    ```

    1.1_{10} = 1.00011001100110011...2

    ```


    Having seen that floating numbers are backwards, then you might suspect that integers
    are backwards also. This is indeed true. Consider the following code which defines
    some 32 bit integers


    ```

    segment data

    dzero 0

    done 1

    neg1 -1

    da 175

    db 4097

    dd 65536

    de 100000000

    ```


    The associated listing file shows the bits generated for each number. The bytes
    are backwards. Notice that 4097 is represented as 0x0100000 in memory. The first
    byte is the least significant bit. We would prefer to consider this as 0x00001001,
    but the CPU stores least significant byte first.


    ```

    %line 1+1 int.asm

    [section .data]

    ```'
