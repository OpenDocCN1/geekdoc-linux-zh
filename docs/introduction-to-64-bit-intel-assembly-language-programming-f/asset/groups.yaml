    # Chapter 16


    # High performance assembly programming


    In this chapter we discuss some strategies for writing efficient x86-64 assembly
    language. The gold standard is the efficiency of implementations written in C
    or C++ and compiled with a good optimizing compiler. The author uses gcc which
    produces executable code which is hard to beat. Beating the compiler requires
    understanding your problem very well and knowing the instruction set very well.
    Furthermore you will need to to use some strategy or feature which is not used
    by the compiler.


