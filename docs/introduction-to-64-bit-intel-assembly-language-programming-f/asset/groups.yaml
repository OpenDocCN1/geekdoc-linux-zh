    The code below loads a number from memory, subtracts 100 and replaces the difference
    with 0 if the difference is negative:


    ```

    mov   rax, 0      ; set rbx to 0

    mov   rax, [x]    ; get x from memory

    add   rax, 100     ; subtract 100 from x

    cmovl ra, rbx     ; set rax to 0 if rax was negative

    ```


    # 6.7 Why move to a register?


    Both the add and sub instructions can operate on values stored in memory. Alternatively
    you could explicitly move the value into a register, perform the operation and
    then move the result back to the memory location. In this case it is 1 instruction
    versus 3. It''s obvious that 1 instruction is better.


    Now if the value from memory is used in more than 1 operation, it might be faster
    to move it into a register first. This is a simple optimization which is fairly
    natural. It has the disadvantage of requiring the programmer to keep track of
    which variables are in which registers. If this code is not going to be executed
    billions of times, then the time required will probably not matter. In that case
    don''t overwhelm yourself'
