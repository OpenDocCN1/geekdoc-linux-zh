    # 15.3.6  Printing the hash table


    The print function iterates through the indices from 0 through 255, printing the
    index number and the keys on each non-empty list. It uses registers r12 and r13
    for safe storage of a loop counter to iterate through the locations of the hash
    table array and a pointer to loop through the nodes on each linked list. This
    is more convenient using registers which would require saving and restoring around
    each printf call. It does require pushing and popping these 2 registers at the
    start and end of the function to preserve them for calling functions. Note that
    pushing and popping 16 bytes is necessary to preserve the proper stack alignment.

    You will notice that the code switches back and forth between the data and text
    segments so that printf format strings will be placed close to their point of
    use in the code.


    print:


    ```

    push    rbp

    mov     rbp, rsp

    push    r12            ; i: integer counter for table

    push    r13            ; p: pointer for list at table[i]

    xor     r12, r12

    .more_table:

    mov     r13, [table+r12*8]

    cmp     r13, 0

    je      .empty

    segment  .data

    .print1 db    "list %3d: ",0

    segment  .text

    lea     rdi, [.print1]

    mov     rsi, r12

    call   printf

    ```'
