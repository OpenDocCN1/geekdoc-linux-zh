    \ 1101 1011=1024+256+128+64+32+8+4+1=1517, so 0XFA13=-1517.\n\nLet's add -750\
    \ and -1517 in binary:\n\n```\n1111 1011 0001 0010\n1111 1010 0001 0011\n```\n\
    \n```\n1 1111 0111 0001 0110\n```\n\nWe can ignore the leading 1 bit (a result\
    \ of a carry). The 16 bit sum is 1111 0111 0001 0110, which is negative. Inverting\
    \ the lower-most 15 bits: 0000 1000 1110 1001. Next adding 1 to get the two's\
