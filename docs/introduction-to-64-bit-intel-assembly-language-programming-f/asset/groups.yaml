    # 14.2. FSCANF AND FPRINTF


    assembly language it is sufficient to simply store the pointer in a quadword and
    use that quad-word as needed for function calls. Here is some code to open a file:


    ```

    segment .data

    name      db "customers.dat",0

    mode      db "+w",0

    fp        dq 0

    segment .text

    global    fopen

    lea       rdi, [mode]

    lea       rsi, [mode]

    call     fopen

    mov      [fp], rax

    ```


    # 14.2 scancf and fprintf


    You have encountered scancf and printf in previous code. scanf is a function which
    calls scanf with a FILE pointer named stdin as its first parameter, while printf
    is a function which calls printf with FILE pointer stdout as first parameter.
    The only difference between these pairs of functions is that scancf and fprintf
    can work with any FILE pointer. Their prototypes are


    ```

    int scancf ( FILE *fp, char *format, ... );

    int fprintf ( FILE *fp, char *format, ... );

    ```


    For simple use Appendix B which discusses scancf and printf. For more information
    use "man scancf" or "man printf" or consult a C book.


    # 14.3 fgetc and fputc


    If you need to process data character by character, it can be convenient to use
    fgetc to read characters and fputc to write characters. Their prototypes are


    ```

    int fgetc ( FILE *fp );

    int fputc ( int c, FILE *fp );

    ```'
