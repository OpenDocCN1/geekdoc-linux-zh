    # # Chapter 9


    # # Functions


    In this chapter we will discuss how to write assembly functions which can be called
    from C or C++ and how to call C functions from assembly. Since the C or C++ compiler
    generally does a very good job of code generation, it is usually not important
    to write complete programs in assembly. There might be a few algorithms which
    are best done in assembly, so we might write 90% of a program in C or C++ and
    write a few functions in assembly language.


    It is also useful to call C functions from assembly. This gives your assembly
    programs full access to all C libraries. We will use scanf to input values from
    stdin and we will use printf to print results. This will allow us to write more
    useful programs.


    #  9.1 The stack


    So far we have had little use for the run-time stack, but it is an integral part
    of using functions. We stated earlier that the stack extends to the highest possible
    address: 0xffffffffff. This is not quite true. Inspection of the memory map using
    `cat /proc/$/maps` shows the top stack address is 07ffff6b79000 for your bash
    and different values for other processes matching the pattern 0xffffXXXXXX. Perhaps
    this is a result of “stack randomization” which is an attempt to avoid rogue code
    that modifies stack values.


    Items are pushed onto the stack using the push instruction. The effect'
- md: "\nof push is to subtract 8 from the stack pointer rsp and then place the value\
    \ being pushed at that address. Initially the stack pointer would be set to 0x7fffffff000\
    \ (or some address ending in 000) by the operating system when a process is started.\
    \ On the first push, rsp would be decreased by 0x7fffffffffff and an 8-byte value\
    \ would be placed in bytes 0x7fffffffffff8f8 through 0x7fffffffffff.\n\nMany different\
    \ values are pushed onto the stack by the operating system. These include the\
    \ environment (a collection of variable names and values defining things like\
    \ the search path) and the command line parameters for the program.\n\nValues\
    \ can be removed from the stack using the pop instruction. pop operates in the\
    \ reverse pattern of push. It moves the value at the location specified by the\
    \ stack pointer (rsp) to a register or memory location and then adds 8 to rsp.\n\
    \nYou can push and pop smaller values than 8 bytes, at some peril. It works as\
    \ long as the stack remains bounded appropriately for the current operation. If\
    \ you push a word and then push a quad-word, the quadword push may fail. It is\
    \ simpler to push and pop only 8-byte quantities.\n\n## 9.2 Call instruction\n\
    \nThe assembly instruction to call a function is call. A typical use would be\
    \ like\n\n```\ncall my_function\n```\n\nThe operand my_function is a label in\
    \ the text segment of a program. The effect of the call instruction is to push\
    \ the address of the instruction following the call onto the stack and transfer\
    \ control to the address associated with my_function. The address pushed onto\
    \ the stack is called the \"return address\". Another way to implement a call\
    \ would be\n\n```\npush next_instruction\njmp my_function\nnext_instruction:\n\
    ```\n\nWhile this does work, the call instruction has much more capability which\
    \ we will generally ignore.\n\n## 9.3 Return instruction\n\nTo return from a function\
    \ we use the ret instruction. This instruction pops the address from the top of\
    \ the stack and transfers control to that address. In the previous example next.instruction\
    \ is the label for the return address.\n\n## 9.4 Function parameters and return\
    \ value\n\nMost functions have parameters which might be integer values, floating\
    \ point values, addresses of data values, addresses of arrays, or any other type\
    \ of data or address. The parameters allow us to use a function to operate on\
    \ different data with each call. In addition most functions have a return value\
    \ which is commonly an indicator of success or failure.\n\nx86-64 Linux uses a\
    \ function protocol called the \"System V Binary Interface\" or System ABI. Unfortunately\
    \ Windows uses a different protocol called the \"Microsoft x64 Calling Convention\"\
    . In both protocols some of the parameters to functions are passed in registers.\
    \ Linux allows the first 6 integer parameters to be passed in registers, which\
    \ Windows allows the first 4 (using different registers). Linux allows the first\
    \ 8 floating point parameters to be passed in floating point registers xmm0-xmm7,\
    \ while Windows allows the first 4 floating point parameters to be passed in registers\
    \ xmm0-xmm3.\n\nBoth Linux and Windows use rex for integer return values and register\
    \ xmm0 for floating return value registers.\n\nBoth Linux and Windows expect the\
    \ stack pointer to be maintained on 16-byte boundaries in memory. This means that\
    \ the hexadecimal value for rsp should end in 0. The reason for this requirement\
    \ is to allow local variables in functions to be placed at 16-byte alignments\
    \ for SSE and AVX instructions. Executing a call will decrement rsp leaving it\
    \ with an 8. Conforming functions should either push something or subtract from\
    \ rsp to get it back on a 16-byte boundary. If your function calls any external\
    \ function, it seems wise to stick with the 16-byte bounding requirement.\n\n\
    The first 6 integer parameters in a function under Linux are passed in registers\
    \ rdi, rsi, rdx, rcx, r8 and r9, while Windows use rcx, rdx, r8 and r9 for the\
    \ first 4 integer parameters. If a function requires parameters, they are pushed\
    \ onto the stack in reverse order.\n\nFunctions like scanf and printf which have\
    \ a variable number of parameters pass the number of floating point parameters\
    \ in the function call using the rax register.\n\nFor 32-bit programs the protocol\
    \ is different. Registers r8-r15 are not available, so there is not much value\
    \ in passing function parameters in registers. These programs use the stack for\
    \ all parameters.\n\nWe are finally ready for \"Hello World!\"\n\n```\nsection\
    \ .data\nmsg:\n    db \"Hello World!\",0x0a,0\n```\n\n```\nsection .text\nglobal\n\
    extern printf\n\nmain:\n    push    rbp\n    mov     rdi, rsp\n    lea     rdi,\
    \ [msg]    ; parameter 1 for printf\n    xor     eax, eax      ; 0 floating point\
    \ parameters\n    call    printf\n    xor     eax, eax      ; return 0\n    pop\
    \     rbp\n    ret\n```\n\nWe use the \"load effective address\" instruction (lea)\
    \ to load the effective address of the message to print with rdi. This could also\
    \ be done with mov, but lea allows specifying more items in the brackets so we\
    \ could load the address of an array element.\n\nInterestingly when the system\
    \ starts a program in _start parameters to _start are pushed onto the stack. However,\
    \ the parameters to main are in registers like any other C function.\n\n## 9.5\
    \ Stack frames\n\nOne of the most useful features of the gdb debugger is the ability\
    \ to trace backwards through the functions which have been called (command bt\
    \ or backtrace). To perform this trick each function must keep a pointer in a\
    \ 2-quadword object on the stack identifying the previous value of rbp along with\
    \ the return address. You might notice the sequence “push rbp, mov rbp, rsp\"\
    \ in the hello world program. The first instruction pushes rbp immediately below\
    \ the return address. The second instruction makes rbp point to that object.\n\
    \nAssuming all functions obey this rule of starting with the standard 2 instructions,\
    \ there will be a linked list of objects on the stack - one for each function.\
    \ The debugger can traverse through the list to identify the function (based on\
    \ the location of the return address) called and use other information stored\
    \ in the executable to identify the line number for this return address.\n\nThese\
    \ 2-quadword objects are simple examples of “stack frames”. In functions which\
    \ do not call other functions (leaf functions), the local variables for the function\
    \ might all fit in registers. If there are too many local variables or if the\
    \ function calls other functions, then there might need to be some space on the\
    \ stack for these local variables. To allocate space for the local variables,\
    \ you simply subtract from rsp. For example, leave 32 bytes for local variables\
    \ in the stack frame do:\n\n```\npush    rbp\nmov     rbp, rsp\nsub     rsp, 32\n\
    ```\n\nBe sure to subtract a multiple of 16 bytes to avoid possible problems with\
    \ stack alignment. The effect of these 2 instructions and a possible subtraction\
    \ from rsp can be undone using\n\n```\nleave\n```\n\njust before ret instruction.\
    \ For a leaf function there is no need to do the standard 2 instruction prologue\
    \ and no need for leave instruction.\n"
  mdcn: "\n`push` 操作是将栈指针 `rsp` 减 8，然后将要推入的值放置在该地址上。在进程启动时，操作系统最初会将栈指针设置为 `0x7fffffff000`（或任何以\
    \ `000` 结尾的地址）。在第一次 `push` 时，`rsp` 会减少 `0x7fffffffffff`，一个 8 字节的值会被放置在 `0x7fffffffffff8f8`\
    \ 到 `0x7fffffffffff` 字节之间。\n\n操作系统会将许多不同的值推入栈中。这些包括环境（定义搜索路径等内容的变量名和值的集合）以及程序的命令行参数。\n\
    \n可以使用 `pop` 指令从栈中移除值。`pop` 的操作模式与 `push` 相反。它将栈指针（`rsp`）指定位置移动到寄存器或内存位置，然后将 `rsp`\
    \ 加 8。\n\n你可以 `push` 和 `pop` 比 8 字节更小的值，但存在风险。只要栈对于当前操作保持恰当的边界，这种操作就能生效。如果你先推入一个字（word）再推入一个双字（quad-word），双字的推入可能会失败。更简单的方法是只\
    \ `push` 和 `pop` 8 字节的量。\n\n## 9.2 call 指令\n\n调用函数的汇编指令是 `call`。典型的用法如下：\n\n```\n\
    call my_function\n```\n\n操作数 `my_function` 是程序文本段中的一个标签。`call` 指令的作用是将 `call`\
    \ 之后的指令地址推入栈中，并将控制权转移到与 `my_function` 关联的地址。推入的地址被称为“返回地址”。另一种实现调用的方法是：\n\n```\n\
    push next_instruction\njmp my_function\nnext_instruction:\n```\n\n虽然这种方法可行，但 `call`\
    \ 指令具有许多功能，我们通常会忽略它们。\n\n## 9.3 ret 指令\n\n要从函数返回，我们使用 `ret` 指令。该指令从栈顶弹出并将控制权转移到该地址。在之前的示例中，`next.instruction`\
    \ 是返回地址的标签。\n\n## 9.4 函数参数和返回值\n\n大多数函数都有参数，这些参数可能是整数值、浮点值、数据值的地址、数组的地址或任何其他类型的数据或地址。参数允许我们在每次调用时使用函数处理不同的数据。此外，大多数函数都有返回值，返回值通常是成功或失败的指示。\n\
    \nx86-64 Linux 使用一种名为“System V Binary Interface”或 System ABI 的函数协议。遗憾的是，Windows\
    \ 使用另一种名为“Microsoft x64 Calling Convention”的协议。在这两种协议中，某些函数参数是通过寄存器传递的。Linux 前\
    \ 6 个整数参数通过寄存器传递，而 Windows 允许前 4 个（使用不同的寄存器）。Linux 允许前 8 个浮点参数通过浮点寄存器 `xmm0-xmm7`\
    \ 传递，而 Windows 允许前 4 个浮点参数通过寄存器 `xmm0-xmm3` 传递。\n\nLinux 和 Windows 都使用 `rax` 作为整数返回值，使用\
    \ `xmm0` 作为浮点返回值寄存器。\n\nLinux 和 Windows 都期望栈指针在内存中保持 16 字节对齐的边界。这意味着 `rsp` 的十六进制值应该以\
    \ 0 结尾。此要求的原因是为了允许函数中的局部变量以 16 字节对齐的方式放置，以便 SSE 和 AVX 指令。执行 `call` 会递减 `rsp`，使其留为\
    \ 8。规范的函数应该推入某些内容或减去 `rsp` 以恢复 16 字节边界。如果你的函数调用了任何外部函数，似乎遵循 16 字节边界要求是明智的。\n\n\
    Linux 下函数的前 6 个整数参数通过寄存器 `rdi`、`rsi`、`rdx`、`rcx`、`r8` 和 `r9` 传递，而 Windows 使用 `rcx`、`rdx`、`r8`\
    \ 和 `r9` 用于前 4 个整数参数。如果函数需要参数，它们将反序推入栈中。\n\nscanf 和 printf 等变参数函数使用 `rax` 寄存器传递函数调用中浮点参数的数量。\n\
    \n对于 32 位程序，协议是不同的。寄存器 `r8-r15` 不可用，因此通过寄存器传递函数参数没有意义。这些程序使用栈处理所有参数。\n\n我们终于准备好打印“Hello\
    \ World!”了。\n\n```\nsection .data\nmsg:\n    db \"Hello World!\",0x0a,0\n```\n\
    \n```\nsection .text\nglobal\nextern printf\n\nmain:\n    push    rbp\n    mov\
    \     rdi, rsp\n    lea     rdi, [msg]    ; printf 的参数 1\n    xor     eax, eax\
    \      ; 0 个浮点参数\n    call    printf\n    xor     eax, eax      ; 返回 0\n    pop\
    \     rbp\n    ret\n```\n\n我们使用“加载有效地址”指令（lea`）通过 `rdi` 加载要打印消息的有效地址。也可以通过 `mov`\
    \ 实现，但 `lea` 允许在括号中指定更多项，因此我们可以加载数组元素的地址。\n\n有趣的是，当系统启动程序时，`_start` 的参数会被推入栈中。然而，`main`\
    \ 的参数像其他 C 函数一样是通过寄存器传递的。\n\n## 9.5 栈帧 (Stack frames)\n\ngdb 调试器最有用的功能之一是回溯已调用的函数（命令\
    \ `bt` 或 `backtrace`）。为了实现这一技巧，每个函数必须在栈上的一个 2 双字对象中保留一个指针，标识 `rbp` 的旧值以及返回地址。你可能会在\
    \ hello world 程序中看到 `push rbp, mov rbp, rsp` 序列。第一条指令将 `rbp` 推入返回地址正下方。第二条指令使\
    \ `rbp` 指向该对象。\n\n假设所有函数都遵循这种以标准两条指令开头的规则，那么栈上将存在一个对象链表——每个函数一个对象。调试器可以遍历该列表以识别被调用的函数（基于返回地址的位置），并使用可执行文件中存储的其他信息来识别该返回地址对应的行号。\n\
    \n这些 2 双字对象是“栈帧”的简单示例。在不调用其他函数（叶子函数）中，函数的局部变量可能完全可以放入寄存器中。如果局部变量太多或者函数调用了其他函数，则可能需要在栈上为这些局部变量留出空间。要为局部变量分配空间，只需从\
    \ `rsp` 中减。例如，在栈帧中为局部变量留出 32 字节：\n\n```\npush    rbp\nmov     rbp, rsp\nsub  \
    \   rsp, 32\n```\n\n确保减去的是 16 字节的倍数，以避免可能的栈对齐问题。这两条指令的效果以及可能的 `rsp` 减法操作可以在 `ret`\
    \ 指令之前使用 `leave` 来撤销：\n\n```\nleave\n```\n\n对于叶子函数，不需要标准的 2 指令序言，也不需要 `leave`\
    \ 指令。\n"
