    # Chapter 4


    # Memory mapping in 64 bit

    mode


    In this chapter we discuss the details of how virtual addresses are translated
    to physical addresses in the x86-64 architecture. Some of the data for translation
    is stored in the CPU and some of it is stored in memory.


    # 4.1 The memory mapping register


    Well the CPU designers named this register "Control Register 3" or just CR3. A
    simplified view of CR3 is that it is a pointer to the top level of a hierarchical
    collection of tables in memory which define the translation from virtual addresses
    (the addresses your program seeks) to physical addresses. The CPU retains quite
    a few translations internally, but let''s consider how the CPU starts all this
    translation process.


    Somewhere in the kernel of the operating system, an initial hierarchy of the translation
