    # Chapter 11


    # Floating point instructions


    The 8088 CPU used a floating point coprocessor called the 8087 to perform floating
    point arithmetic. Many early computers lacked the 8087 chip and performed floating
    point operations in software. This arrangement continued until the 486 which contained
    a coprocessor internally. The 8087 used instructions which manipulated a stack
    of 80 bit floating point values. These instructions are still part of modern CPUs,
    though there is a completely separate floating point facility available which
    has sixteen 128 bit registers (256 bits for the Intel Core i series) in 64 bit
    mode. We will study the newer instructions.


    If you study the Intel 64 and IA-32 Architectures Software Developers Manual,
    you will find many instructions such as fidd which work with registers named ST(0),
    ST(1), ... These instructions are for the math coprocessor. There are never instructions
    such as addsd which work with Streaming SIMD Extensions (SSE) registers xmm0,
    xmm1, ...xmm15. SIMD is an acronym for "Single Instruction - Multiple Data". These
    are the focus of this chapter.


    # 11.1 Floating point registers


    There are 16 floating point registers which serve dual purposes holding either
    1 value or multiple values. The names for these registers are xmm0, xmm1, ...
    and xmm15. These registers can be used with instructions operating on a single
    value in each register or on a vector of values. When'
