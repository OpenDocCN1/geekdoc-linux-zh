    # 2.3 Integers


    On the x86-64 architecture integers can be 1 byte, 2 bytes, 4 bytes, or 8 bytes
    in length. Furthermore for each length the numbers can be either signed or unsigned.
    Below is a table listing minimum and maximum values for each type of integer.


    | Variety | Bits | Bytes | Minimum | Maximum |

    |---|---|---|---|---|n| unsigned | 8 | 1 | 0 | 255 |

    | signed | 8 | 1 | -128 | 127 |

    | unsigned | 16 | 2 | 0 | 65535 |

    | signed | 16 | 2 | -32768 | 32767 |

    | unsigned | 32 | 4 | 0 | 4294967295 |

    | signed | 32 | 4 | -2147483648 | 2147483647 |

    | unsigned | 64 | 8 | 0 | 1844674407370951616 |

    | signed | 64 | 8 | -922337203685477808 | 922337203685477807 |


    The range of 64 bit integers is large enough for most. Of course there are exceptions,
    like 20! = 51090942171709440000.


    Unsigned integers are the binary numbers discussed earlier. Signed integers are
    stored in a useful format called "two'' complement". The first bit of a signed
    integer is the sign bit. If the sign bit is 0, the number is positive. If the
    sign bit is 1, the number is negative. The most obvious way to store negative
    numbers would be to use the remaining bits to store the absolute value of the
    number.


    ![](img/443639abd490bee82d518502d35b07b9_31_0.png)


    Let''s consider 8 bit signed integers and what we would get if we used the existing
    circuitry to add 2 such integers. Let''s add -1 and 1. Well, if we store -1 with
    a sign bit and then the value would get


    ```

    -1 = 1000 0001

    1 = 0000 0001

    ---

    -1+1 = 1000 0002

    ```'
