    \n31 30 23 22\nsign bit exponent value\n\nThe exponent for a float is an 8 bit\
    \ field. To allow large numbers or small numbers to be stored, the exponent is\
    \ interpreted as positive or negative. The actual exponent is the value of the\
    \ 8 bit field minus 127 (\"exponent bias\") for 32 bit floating point numbers.\
    \ Since all bits set to 0, there is no need to worry about representing 0.0 as\
    \ an exponent field equal to 127 and fraction field set to 0. All other numbers\
    \ have at least one 1 bit, so IEEE 754 format uses an implicit 1 bit to save space.\
    \ If the fraction field is 000000000000000000000000, it is interpreted as 1.000000000000000.\
