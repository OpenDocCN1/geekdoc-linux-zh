    through the hash table looking for a key. If it is found, the function returns
    a pointer to the node with the key. If it is not found, it returns 0. A more realistic
    program would probably return a pointer to the data associated with the key.


    The find function operates by calling hash to compute the index in the hash array
    for the linked list which might hold the key sought. Then the function loops through
    the nodes on the list looking for the key.


