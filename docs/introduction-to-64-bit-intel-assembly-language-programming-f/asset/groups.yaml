    0x40, with the leftmost bit of the next byte, 0x8c. So the exponent field is 0x81
    = 129, which is a binary exponent of 2. The fraction field (with the implied initial
    1 bit) is 0x8cccc. So b = 1.0001100110011001100101 * 2² = 4.4.


    The next data item is the array c defined with the times pseudo-op which has 10
    double word locations. The relative location for c is 8 and c consists of 40 bytes,
    so the next item after c is at relative address 48 or 0x30.


    Following c is the length 2 array d with values 1 and 2. Array d is of type word
    so each value is 2 bytes. Again you can see that the bytes are reversed for each
    word of d.


    The next data item is the byte variable e with initial value 0xf. After e is the
    array f which is initialized with a string. Notice that I have added a terminal
    null byte explicitly to f. Strings in yasm do not end in null bytes.


    After the data segment I have included a bss segment with 3 variables. These are
    listed with their relative addresses as part of the bss segment. After linking
    the bss data items will be loaded into memory beginning with g defined by res
    op-code which means "reserve" double word. res the number means 1 double word.
    The next bss item is h which has 10 reserved double words. All these data items
    are shown in the listing with addresses to the start of the bss segment. They
    will all have value 0 when the program starts.


    ### 3.4 Examining memory


    In this section we will focus on using gdb print (p) and examine (x) commands.
    Print is a simple command which can print some data values and is versatile enough
    to print various forms. Examine is strictly for printing data from memory and
    is quite useful for arrays of various types.


    The format for the p command is either p expression or p/FMT where FMT is a single
    letter defining the format of data to print. The format choices are:


    | letter | format |

    | :--- | :--- |

    | d | decimal (default) |

    | x | hexadecimal |

    | t | binary |

    | u | unsigned |

    | f | floating point |

    | i | instruction |

    | c | character |

    | s | string |

    | a | address |


    Let''s see a few commands in gdb:


    ```

    (gdb) p a

    $32 = 4

    (gdb) p/a &a

    $33 = 0x601018

    (gdb) p b

    $34 = 10829623

    (gdb) p/f &b

    $35 = 4.4000001

    (gdb) p/a &b

    $36 = 0x60101c

    (gdb) p/x &b

    $37 = 0x60101c

    (gdb) p/a &c

    $39 = 0x601020

    (gdb) p/a &d

    $40 = 0x601048

    (gdb) p/a &e

    $41 = 0x60104c

    (gdb) p/a &f

    $42 = 0x60104d

    (gdb) p/a &g

    $43 = 0x601070

    (gdb) p/a &h

    $45 = 0x601074

    (gdb) p/a &i

    $46 = 0x60109c

    ```


    We see that gdb handles a perfectly. It gets the type right and the length. Notice
    that a is located at address 0x601018 which is 24 bytes after the start of memory.
    gdb will prohibit accessing memory before a though there is no hardware restriction
    to the previous 24 bytes. We see that the data segment variables are placed in
    memory after another f starts at 0x6104d and extends to 0x61058. There is a gap
    until the bss segment starts with g at 0x601070. The bss data items are placed
    back to memory with no gaps. If you want to print doubles in memory it could be
    done with some mental gymnastics. The examine command handles this job. The format
    for examine is x/N address where N is a number of items to print (default 1),
    F is a single letter format as used in the print command and S is the size of
    each location. Unfortunately gdb picked some size letters which conflict with
    some of the size options in yasm. Here are the size options:


    | size | bytes |

    | :--- | :--- |

    | byte | 1 |

    | halfword | 2 |

    | word | 4 |

    | giant | 8 |


    Here are some examples of examining memory:


    ```

    (gdb) x/w &a

    0x601018 <a>: 0x4

    (gdb) x/fw &b

    0x60101c <b>: 4.4000001

    (gdb) x/fg &b

    0x60101c <b>: 5.350579231722831e-35

    (gdb) x/10dw &c

    0x601020 <c0>: 0 0 0 0

    0x601030 <c16>: 0 0 0

    0x601040 <c32>: 0 0

    (gdb) x/2h &d

    0x601048 <d>: 0x0001 0x0002

    (gdb) x/12cb &f

    0x60104d <f>: 104 ''h''101 ''e''108 ''l''108 ''o'' ''32 ''119...

    0x601055 <f+8>: 114 ''r''101 ''l''100 ''d''0 ''\000''

    (gdb) x/s &f

    0x60104d <f>: "hello world"

    ```


    Things match what you expect if you use the correct format and size. I first printed
    b with the correct size and then with the giant size (8 bytes). gdb interpreted
    8 bytes of memory starting at the address of b as a double getting the wrong exponent
    and fraction. The use of the count field is quite useful for dumping memory.


