    Computers have reached the limits of 32 bit CPUs. Nearly any computer will run
    more efficiently with 8 gigabytes of RAM which requires using a 64 bit operating
    system.


    The latest Intel and AMD CPUs have more registers and more capabilities when running
    in 64 bit mode. Achieving high performance using SSE and AVX instructions dictates
    using or writing code in assembly language.


    If you know C or C++, this book will expand your skills while clarifying exactly
    what your compiler does with your code.


    The book progresses from simple concepts to loops, functions, arrays, structs,
    system calls and using C library functions. Advanced features include data structures
    in assembly and examples of high performance programming using SSE and AVX instructions.


    ## GET THE MOST OUT OF YOUR COMPUTER


    Dr. Seyfarth began his career as a scientific programmer in remote sensing and
    image processing at NASA in 1977, using Fortran and Assembly Language on a variety
    of 16 and 32 bit computers.


    He earned his Ph.D. in Computer Science at the University of Florida in 1989.
    Since 1990 he has been a professor at the University of Southern Mississippi.


    At Southern Miss Dr. Seyfarth teaches Assembly Language, C++, Algorithms, UNIX,
    Network Programming, Parallel Algorithms and Computer Graphics using OpenGL. His
    recent research efforts have been in image processing and network server design.


