    \ jae | 如果 >= (浮点) 则跳转 | jnc jnb | CF=0 |\n\n```\nmovss xmm0, [a]\nmuls xmm0,\
    \ [b]\nucomiss xmm0, [c]\njbe less_eq      ; 如果 a*b <= c 跳转\n```\n\n## 11.8 数学函数\n\
    \n8087 协处理器实现了一组实用的超越函数，如正弦、余弦和反正正切。这些指令在现代 CPU 中仍然存在，但它们使用浮点寄存器且不再被推荐使用。相反，这些函数可以使用高效的库函数。\n\
    \nSSE 指令包括计算最小和最大值的浮点函数、执行舍入，以及计算平方根和平方根倒数。\n\n### 11.8.1 最小和最大\n\n标量最小和最大指令是\
    \ `minss` 和 `maxss`，用于计算单精数的最小和最大；`minsd` 和 `maxsd` 对双精度数执行相同操作。第一个操作数（目标）必须是\
    \ XMM 寄存器，而第二个操作数（源）可以是 XMM 寄存器或内存位置。\n\n最大值的打包版本：`minps`、`maxps`、`minpd` 和 `maxpd`，它们作用于\
    \ 4 个单精度数（ps 版本）或 2 个双精度数（pd 版本）。打包指令要求第一个操作数使用 XMM 寄存器，第二个操作数使用 XMM 寄存器或内存。单精度版本计算\
    \ 4 个结果，而双精度版本计算 2 个结果。\n\n```\nmovss xmm0, [x]      ; 将 x 移动到 xmm0\nmaxss xmm0,\
    \ [y]      ; xmm0 拥有 max(x,y)\nmovapd xmm0, [a]      ; 将 a[0] 和 a[1] 移动到 xmm0\n\
    minpd xmm0, [b]      ; xmm0 拥有 min(a,b)\n```\n\n### 11.8.2 舍入\n\nSSE 指令包含 4 条将浮点数舍入为整数的指令：`roundss`\
    \ 舍入 1 个单精度，`roundps` 舍入 4 个单精度，`roundsd` 舍入 1 个双精度，`roundpd` 舍入 2 个双精度。第一个操作数必须是\
    \ XMM 寄存器，第二个操作数可以是 XMM 寄存器或内存。舍入模式的选择如下：\n\n| 模式 | 含义 |\n|---|---|\n| 0 | 舍入到偶数\
    \ |\n| 1 | 舍入正无穷 |\n| 2 | 舍入负无穷 |\n| 3 | 截断 |\n\n### 11.8.3 平方根\n\nSSE 指令包括计算平方根的指令：`sqrtss`\
    \ 计算 1 个单精度，`sqrtps` 计算 4 个单精度，`sqrtsd` 计算 1 个双精度，`sqrpd` 计算 2 个双精度。第一个操作数必须是\
    \ XMM 寄存器，第二个操作数可以是 XMM 寄存器或内存。\n\n## 11.9 示例代码\n\n### 11.9.1 3D 距离\n\n我们可以通过以下代码计算\
    \ 3D 距离，3D 距离的公式为 $d = \\sqrt{x^2 + y^2 + z^2}$：\n\n```\ndistance3d:\nmovss xmm0,\
    \ [rdi]      ; x\nmulss xmm0, xmm0      ; x^2\nmovss xmm1, [rdi+4]    ; y\nmulss\
    \ xmm1, xmm1      ; y^2\naddss xmm0, xmm1      ; x^2 + y^2\nmovss xmm2, [rdi+8]\
    \    ; z\nmulss xmm2, xmm2      ; z^2\naddss xmm0, xmm2      ; x^2 + y^2 + z^2\n\
    sqrtss xmm0           ; 根\nret\n```\n\n### 11.9.2 3D 点积\n\n3D 向量的点积在图形学中非常常用，其计算方式为\
    \ $x_1x_2 + y_1y_2 + z_1z_2$：\n\n```\ndotproduct3d:\nmovss xmm0, [rdi]      ;\
    \ x1\nmulss xmm0, [rsi]      ; x1*x2\nmovss xmm1, [rdi+4]    ; y1\nmulss xmm1,\
    \ [rsi+4]    ; y1*y2\naddss xmm0, xmm1      ; x1*x2 + y1*y2\nmovss xmm2, [rdi+8]\
    \    ; z1\nmulss xmm2, [rsi+8]    ; z1*z2\naddss xmm0, xmm2      ; x1*x2 + y1*y2\
    \ + z1*z2\nret\n```\n\n### 11.9.3 多项式求\n\n单变量多项式的求值至少有两种方法。首先是显而易见的定义：\n\n$P(x)\
    \ = p_0 + p_1x + p_2x^2 \\cdots p_nx^n$。\n\n另一种更高效的方法是使用霍纳法则（Horner's Rule）：\n\
    \n$b_n = p_n$\n$b_{n-1} = p_{n-1} + b_nx$\n$\\cdots$\n$b_0 = p_0 + b_1x$\n\n写成一个接收双精度系数数组作为第一个参数（rdi）、$x$\
    \ 的值作为第二个参数（xmm0）、多项式次数作为第三个参数（rsi）的函数：\n\n```\nhorner: movsd xmm1, xmm0     \
    \ ; xmm1 作为 x\n       movsd xmm0, [rdi+rsi*8]  ; 计数器 b_k\n       cmp esi, 0  \
    \             ; 次数是否为 0\n       jz    done\nmore:  sub esi, 1\n       mulsd xmm0,\
    \ xmm1         ; b_k * x\n       addsd xmm0, [rdi+rsi*8]  ; 加上 p_k\n       jnz\
    \   more\ndone:  ret\n```\n\n"
