    \      node\nn_value resq  1\nn_next  resq  1\n        align    8\n        endstruct\n\
    ```\n\n在结构体中有 2 个双字（quad-words）时不需要对齐指令，但它可以防止我们稍后产生混淆。\n\n### 15.1.2 创建空列表\n\n\
