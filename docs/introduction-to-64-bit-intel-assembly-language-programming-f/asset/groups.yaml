    \    je       .done\nmov      rax, [rax+n_next]\ncmp      rax, 0\njne       -more\n\
    .done leave\n      ret\n```\n\n### 15.3.5 插入代码\n\n将键插入到哈希表的代码首先调用 `find` 以避免重复插入键。如果找到了键，则跳过插入代码。如果没找到键，函数调用\
    \ `hash` 来确定添加该键的链表索引。它为新节点分配内存并将其插入到列表开头。\n\n```\n; insert ( n );\ninsert:\n\
    .n      equ     0\n.h      equ     8\n      push    rbp\nmov      rbp, rsp\nsub\
    \      rsp, 16\nmov      [rsp+.n], rdi\ncall     find\ncmp      rax, 0\nne   \
    \    .found\nmov      rdi, [rsp+.n]\ncall     hash\nmov      [rsp+.h], rax\nmov\
    \      rdi, node_size\ncall     malloc\nmov      r9, [rsp+.h]\nmov      r8, [table+r9*8]\n\
    mov    [rax+n_next], r8\nmov    r8, [rsp+.n]\nmov    [rax+n_value], r8\nmov  \
    \  [table+r9*8], rax\n```\n\n### 15.3.6 打印哈希表\n\n`print` 函数遍历从 0 到 255 的索引，打印索引号以及每个非空列表上的键。它使用寄存器\
    \ `r12` 和 `r13` 来安全地存储循环计数器（用于遍历哈希表数组的位置）以及一个用于遍历每个链表节点的指针。使用寄存器更加方便，因为其他方法在每个\
    \ `printf` 调用周围都需要保存和恢复寄存器。这确实需要在函数开始和结束处推入和弹出这两个寄存器，以便为调用函数保留它们。注意，推入和弹出 16 字节对于保持正确的栈对齐是必要的。你会注意到代码在数据段和文本段之间切换，以便\
    \ `printf` 格式字符串将放置在代码中使用它的点附近。\n\nprint:\n\n```\npush    rbp\nmov     rbp, rsp\n\
    push    r12            ; i: 表的整数计数器\npush    r13            ; p: table[i] 列表的指针\n\
    xor     r12, r12\n.more_table:\nmov     r13, [table+r12*8]\ncmp     r13, 0\nje\
    \      .empty\nsegment  .data\n.print1 db    \"list %3d: \",0\nsegment  .text\n\
    lea     rdi, [.print1]\nmov     rsi, r12\ncall   printf\n.more_list:\n    segment\
    \  .data\n    print2 db    \"%ld:\",0\n    segment  .text\n    lea     rdi, [.print2]\n\
    \    mov     rsi, [r13+n_value]\n    call   printf\n    lea     rdi, [.print3]\n\
    \    mov     rsi, r12\n    call   printf\n    inc     r12\n    mov     r13, [rax+n_next]\n\
    \    cmp     rax, 0\n    jne     .more_list\n.empty:\n    pop     r13\n    pop\
    \     r12\n    leave\n    ret\n```\n\n### 15.3.7 测试哈希表\n\n哈希表的 `main` 函数通过 `scanf`\
    \ 读取数字，插入哈希表，并在每次插入后打印哈希表：\n\n```\nmain:\n    .k equ 0\n    segment .data\n.scanf_fmt:\n\
    \    db \"%ld\",0\n    segment .text\n    push .rbp\n    mov rbp, rsp\n    sub\
    \ rsp, 16\n.more lea rdi, [.scanf_fmt]\n      lea rsi, [rsp+.k]\n      call scanf\n\
    \      cmp rax, 1\n      jne .done\n      mov rdi, [rsp+.k]\n      call insert\n\
    \      call print\n      jmp .more\n.done leave\n      ret\n```\n\n下面是在插入 1, 2,\
    \ 3, 4, 5, 256, 257, 258, 260, 513, 1025 和 1028 后哈希表的打印结果：\n\n+   list 0: 256\n\
    +   list 1: 1025 257 1\n+   list 2: 258 2\n+   list 3: 3\n+   list 4: 1028 260\
    \ 4\n+   list 5: 5\n\n## 15.4 二叉树\n\n二叉树是一种包含许多节点的结构。它有一个根节点，可以有左或右子节点（或都有）。\n\
    \n通常二叉树是根据键的排序构建的。例如，你可以拥有这样一种二叉树：每个节点将键分为小于节点键的（在左子树中）和大于节点键的（在右子树中）。\n\n有序二叉树（通常称为二叉搜索树）使得能够快速搜索键，同时保持按升序或降序遍历节点的能力。\n\
    \n在这里我们将展示一个带有整数键的二叉树。首先是用于树的结构。\n\n"
