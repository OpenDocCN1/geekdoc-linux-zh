    The Atlas matrix multiplication function is probably at least 4 times as efficient
    as similar code written in C. So while it is true that assembly language can offer
    performance benefits, it is unlikely to outperform C/C++ for most general purpose
    tasks. Furthermore it takes intimate knowledge of the CPU to achieve these gains.
    In this book we will point out some general strategies for writing efficient assembly
