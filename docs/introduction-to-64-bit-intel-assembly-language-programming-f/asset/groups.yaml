    # # Chapter 8


    # # Branching and looping


    So far we have not used any branching statements in our code. Using the conditional
    move instructions added a little flexibility to the code while preserving the
    CPU''s pipeline contents. We have seen that it can be tedious to repeat instructions
    to process each byte in a quad-word or each bit in a byte. In the next chapter
    we will work with arrays. It would fool-hardly allowing to process an array of
    1 million elements by repeating the instructions. It might be possible to do this,
    but it would be painful coping with variable sized arrays. We need loops.


    In many programs you will need to test for a condition and perform 1 of 2 actions
    based on the results. The conditional move is efficient if the 2 actions are fairly
    trivial. If each action is several instructions long, then we need a conditional
    jump statement to branch to one while allowing the CPU to handle the second alternative
    by not branching. After completing the second alternative we will typically need
    to branch around the code for the first alternative. We need conditional and unconditional
    branch statements.


    #  8.1 Unconditional jump


    The unconditional jump instruction (jmp) is the assembly version of the goto statement.
    However there is clearly no shame in using jmp. It is a necessity in assembly
    language, while goto can be avoided in higher level languages.'
