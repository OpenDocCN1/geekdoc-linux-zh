    #2  0x0000000000408d5 in main (argc=<value out>, argv=<value out>) at testcopy.c:45

    ```


    At this point it is possible to print the values of variables and list code from
    copy.asm. We can also use the "up" command to move up the stack frame to the previous
    function.


