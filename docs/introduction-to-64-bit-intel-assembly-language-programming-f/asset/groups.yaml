    A linked list is a structure composed of a chain of nodes. Below is an illustration
    of a linked list:


    | 12 | | 4 | | 16 | | 19 | |


    You can see that the list has 4 nodes. Each node has a data value and a pointer
    to another node. The last node of the list has a NULL pointer (value 0), which
    is illustrated as a filled circle. The list itself is represented as a pointer.
