    ## 附录 A. 使用 GDB


    指定一种调试格式，Linux 下 `dwarf2` 或 `stabs`，Microsoft Visual Studio 下 `cv8`。`dwarf2` 选项提供了最完整的兼容性。


    作者开发了一个脚本 `yld`，用于在使用 `_start` 作为程序入口时进行链接，以及在使用 `main` 链接时使用 `ygcc`。这些脚本会检查链接行上的每个对象文件，对于那些带有匹配的
    `.asm` 文件的文件，它们会检查 `.asm` 文件以定位数据定义。对于汇编代码中定义的每个变量，脚本都会生成一个宏并将其放置在一个隐藏文件（名称以“u”开头）中，该文件在调试时使用。gdb
    初始化文件根据链接命令中 `-o` 参数指定的可执行文件名命名。例如，如果可执行文件名为“array”，则初始化文件名为“.array.gdb”。以下是一个初始化宏文件的示例：


    ```

    break main

    macro define a ((unsigned char*)&a)

    macro define b ((int*)&b)

    macro define c ((long*)&c)

    macro define s ((unsigned char*)&s)

    macro define next ((short*)&next)

    macro define val ((unsigned char*)&val)

    macro define f ((float*)&f)

    macro define d ((double*)&d)

    ```


    初始化文件的第一行在 `main` 上设置断点，以便你在进入调试器后可以立即开始调试。其余行创建了与汇编代码中变量同名的宏。这些宏中的每一个都使用类型转换将变量的地址转换为适当类型的指针。这允许使用变量名来获取指针。例如
    `next` 是一个指向 `short` 的指针。这允许使用 *next 来获取 next 所指向的值*。你也可以使用 `next[0]`, `next[1]`,
    `next[2], ...` 来访问数组元素。如果不使用该初始化文件，gdb 会认为所有变量都是双精度整数（double integers）。


    ## A.2. 启动


    启动 gdb 的典型方式是


    ```

    gdb program

    ```


    其中 `program` 是程序链接时通过 `-o` 参数提供的名称。作者准备了一个名为 `ygdb` 的脚本，其调用方式类似


    ```

    ygdb program

    ```


    该脚本使用 `-x .program.gdb` 运行 gdb，以便 gdb 读取并执行初始化文件中的命令。


    ## A.3 退出


    退出命令是 `quit`，可以缩写为 `q`。如果你已经开始运行程序且程序仍在运行，gdb 会通知你程序仍在运行，并询问你是否想要杀死该进程。输入“y”杀死进程并退出。


    ## A.4 设置断点


    你可以使用“breakpoint”命令设置断点，该命令可以缩写为“b”。你可以使用源代码中的标签设置断点，也可以使用文件的行号设置断点。


    ```

    b main

    b 17

    ```


    ## A.5 运行


    你使用“run”在 gdb 中启动程序执行，该命令可以缩写为“r”。如果你正在程序运行的中途，gdb 将在杀死进程并重新启动之前提示你进行确认。


    如果你设置了断点，调试器将执行语句直直到断点处，然后将控制权交给调试器。此时，你可以检查寄存器、检查内存、逐行执行代码，或执行任何 gdb 命令。如果你没有设置断点，程序将一直运行到结束或直到发生故障。这有时是学习段错误（segmentation
    faults）等问题的方便方法。


    在调试期间，你有几种继续执行的选项。第一种选项是继续执行直到完成或到达另一个断点。这是通过“continue”命令实现的，该命令可以缩写为“c”。


    另一种可能性是对程序进行“单步执行”（single step）。这里有 4 种选项。首先，你可以执行一条源代码语句或一条机器指令。在 C/C++ 中，你可能不倾向于一次执行一条指令。你也可以只在同一个函数内调试，或者在调用其他函数时进入这些函数。在同一函数内进行单步执行使用“next”或“nextinstruction”。对于汇编代码，这这两条指令的作用是相同的。它们可以缩写为“n”或“ni”。如果你使用“next”，调试器将执行所有的函数调用而不返回到-


    另一种选择是使用“step”或“stepinstruction”命令。这些命令执行一条源代码语句或一条机器指令，并允许在被调用的函数内部进行调试。它们可以缩写为“s”或“si”。这两个命令在汇编代码中的效果相同。如果你编写自己的函数，可能可能倾向于使用“step”来调试你调用的函数。然而，你可能希望使用“next”来跳过像
    printf 这样的函数调用。


    ## A.6 打印栈帧轨迹


    程序在执行过程中发生崩溃是很常见的。下面是一个非常典型的情况。


    ```

    seyfarth@tux:~/teaching/asm$ ./testcopy

    Segmentation fault

    ```


    ## A.6. 打印栈帧轨迹


    段错误（segmentation fault）通常是编码中的错误，你的程序尝试访问它未映射到程序中的内存。这可能是由越越数组边界引起的。以下是使用此程序运行
    gdb 的示例。


    Reading symbols from /home/seyfarth/teaching/asm/testcopy...

    (gdb) run

    Starting program: /home/seyfarth/teaching/asm/testcopy


    ```

    Program received SIGSEGV, Segmentation fault.

    copy_rep () at copy.asm:12

    12      rep      movsb

    (gdb) bt

    #0  copy_rep () at copy.asm:12

    #1  0x000000000040097e in test (argc=<value out>, argv=<value out>) at testcopy.c:27

    #2  main (argc=<value out>, argv=<value out>) at testcopy.c:45

    ```


    一旦遇到段错误，我们立即看到程序死在 copy.asm 文件第12 行的 copy_rep 函数中。“bt”命令（backtrace，回溯）会反向遍历函数调栈帧。它报告
    copy_rep 被 test 函数调用，而 test 函数是由 main 调用的。优化级别高到回溯命令无法追踪。我使用 -O3 重新编译并得到了更多结果：


    ```

    (gdb) run

    Starting program: /teaching/asm/testcopy

    Program received SIGSEGV, Segmentation fault.

    copy_rep () at copy.asm:12

    12      rep      movsb

    (gdb) bt

    #0  copy_rep () at copy.asm:12

    #1  0x00000000004006d8 in test (name=0x0b7d "rep movsb", copy=0x40930 <copy_rep>,
    a=0x7ffffed2010 "", b=0x7ffff795310 "", count=100) at testcopy.c:27

    #2  0x0000000000408d5 in main (argc=<value out>, argv=<value out>) at testcopy.c:45

    ```


    此时，可以打印变量的值并列出 copy.asm 中的代码。我们还可以使用“up”命令移动到栈帧以到达上一个函数。


    ```

    (gdb) up

    #1  0x0000000000406d8 in test (name=0x0b7d "rep movsb", copy=0x40930 <copy_ptr>,
    a=0x7ffffed2010 "", b=0x7ffff795310 "", count=100) at testcopy.c:27

    copy(a,b,10000000);

    (gdb) p a

    $1 = (unsigned char *) 0x7ffffed010 " "

    ```


    此时，我们正在调试 testcopy.c 中的 test 函数。copy 的第三个参数是 1000000，而数组大小为 1000000。通常，你可以从栈帧轨迹中获得很多见解。


    ## A.7 检查寄存器


    你可以使用 gdb 中的“info registers”来打印整数寄存器。这可以缩写为“i r”：


    ```

    (gdb) i r

    rax             0x0 0

    rbx             0x64 100

    rcx             0x891690 8984208

    rdx             0x986680 1000000

    rsi             0x7ffffab000 14073473815344

    rdi             0x7ffffca000 14073573916416

    rbp             0xffff6a0 0xffff6a0

    rsp             0x7ffff690 0xffff690

    r8              0x64 100

    r9              0x0 0

    r10             0x7fffffe3f0 14073478834814

    r11             0x206 518

    ```


    ## A.8 检查内存


    ```

    r12         0x7ffffed010 14073735290624

    r13         0x40930 4196656

    r14         0x64 100

    r15         0x3 3

    rip         0x40093f 0x40093f <copy_rep+15>

    eflags       0x0126 [ PF IF RF ]

    cs          0x33 51

    ss          0x2b 43

    ds          0x0 0

    es          0x0 0

    fs          0x0 0

    gs          0x0 0

    ```


    这打印了所有通用寄存器、标志寄存器、指令指针和段段寄存器。本书基本上忽略了寄存器，因为在 64 位编码中不需要它们。


    你可以使用“info all”（或“i all”）打印这些寄存器加上浮点寄存器。这会占用大量空间，文中未插图。


    更常见的是你可能希望检查一个寄存器。你可以使用“print rcx”来打印寄存器 rcx。你可以将“print”缩写为“p”。


    ```

    (gdb) p $rcx

    $1 = 8984208

    ```


    默认打印格式是十进制，“p/x $rcx”以十六进制打印：


    ```

    (gdb) p/x $rcx

    $2 = 0x8921690

    ```


