    # CHAPTER 6. A LITTLE BIT OF MATH


    The imul instruction, unlike add and sub, has 3 different forms. One form has
    1 operand (the source operand), a second has 2 operands (source destination) and
    the third form has 3 operands (destination and 2 sources operands).


    The 1 operand multiplies the value in rax by the source operand and stores the
    result in rdx:rax. The source could be a register or a memory reference. The reason
    for using 2 registers is that multiplying two 64 bit integers yields a 128 bit
    result. Perhaps you are using large 64 bit integers and need all 128 bits of it.
    Then you need this instruction. The low order bits of the answer are in rax and
    the high order bits are in rdx.


    ```

    imul  qword[data]  ; multiply rax by data

    mov   [high], rdx ; store upper part of product

    mov   [low], rax ; store lower part of product

    ```


    Note that yas requires the quad-word attribute for the source. It issued a warning
    during testing, but did the correct operation.

    Quite commonly 64 bit operands are sufficient and either of the other forms will
    allow selecting any of the general purpose registers as the destination register.


    The two-operand form allows specifying the source operand as a register, a memory
    reference or an immediate value. The source is multiplied times the destination
    register and the result is placed in the destination.


    ```

    imul  rax, 100    ; multiply rax by 100

    imul  r8, [x]      ; multiply rax by x

    imul  r9, r10     ; multiply r9 by r10

    ```


    The three-operand form is the only form where the destination register is not
    one of the factors in the product. Instead the second operand, which is either
    a register or a memory reference, is multiplied by the third operand which must
    be an immediate value.


    ```

    imul  rbx, [x], 100  ; store 100*x in rbx

    imul  rdx, rbx, 50   ; store 50*rbx in rdx

    ```


    The carry flag (CF) and the overflow flag (OF) are set when the product exceeds
    64 bits (unless you explicitly request a smaller multiply). The'
