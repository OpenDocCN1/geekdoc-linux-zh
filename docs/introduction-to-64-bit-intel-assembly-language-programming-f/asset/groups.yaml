    # 10.4.2 Filling the array with random numbers


    The fill function uses storage on the stack for local copies of the array pointer
    and its size. It also stores a local variable on the stack. These 3 variables
    require 24 bytes of storage, we subtract 32 from rsp to maintain the 16 byte alignment
    of the stack. We store data in the array using “mov [rdi+rcx*4], ra”, where rdi
    holds the address of the start of the array and rcx contains the index of the
    current array element.


    Here we use several local labels. A local label is a label beginning with a dot.
    Their scope is normal labels. So in the fill function, labels .array, .size, .i
    and .more are local. This allows reusing these labels in other functions, which
    simplifies the coding of the application.


    ```

    fill ( array, size );

    .array equ  0

    .size equ  8

    .i    equ  16

    push    rbp

    mov     rbp, rsp

    sub     rsp, 32

    mov     [rsp+.array], rdi

    mov     [rsp+.size], rsi

    xor     ecx, ecx

    .more mov  [rsp+.i], rcx

    call    random

    mov     rcx, [rsp+.i]

    mov     rdi, [rsp+.array]

    mov     [rdi+rcx*4], eax

    inc     rcx

    ```'
