    # # Appendix A


    # # Using gdb


    The gdb debugger is a product of the Free Software Foundation whose web site is
    http://www.gnu.org. It supports a variety of languages including C, C++, Fortran,
    and assembly. The debugger seems best suited for C and C++, and debugging code
    from yasm is less than ideal.


    gdb keeps track of source code lines quite well for yasm programs. Its primary
    shortcoming (at this point) is that yasm doesn''t provide type information for
    variables. It does provide address of variables which allows the user to do type
    casts to examine variables adequately though this requires more effort than if
    the assembler provided complete information.


    One saving feature of gdb is its macro facility. It is possible to create macros
    which transparently perform type casts and make debugging easier. The author has
    written bash/awk scripts which automate this process.


    More extensive documentation can be found at http://sourceware.org/gdb/current/onlinedocs/gdb.


    # ## A.1 Preparing for gdb


    In order for gdb to be cognizant of source code and variables, your code must
    be compiled with special options which add debugging symbol information to the
    object code. With gcc or g++ -g option is used to enable debugging support. With
    yasm you also use -g but you must spec-'
- md: '

    ## APPENDIX A. USING GDB


    specify a debugging format which can be either dwarf2 or stabs for Linux or cv8
    for Microsoft Visual Studio. The dwarf2 option provides the most complete compatibility.


    The author has developed a script yld to be used for linking when using _start
    for the start of the program and also ygcc for linking using main. These scripts
    examine each object file on the link line, and for those with matching .asm files,
    they examine the .asm file to locate data definitions. For each variable defined
    in the assembly code, the scripts produce a macro which is placed in a hidden
    file (name beginning with “u”) which is used when debugging. The gdb initialization
    file is named based on the executable by the -o option of the link command. For
    example, if the executable is named “array”, the init file is named ".array.gdb”.
    Here is an example of an init macro file:


    ```

    break main

    macro define a ((unsigned char*)&a)

    macro define b ((int*)&b)

    macro define c ((long*)&c)

    macro define s ((unsigned char*)&s)

    macro define next ((short*)&next)

    macro define val ((unsigned char*)&val)

    macro define f ((float*)&f)

    macro define d ((double*)&d)

    ```


    The first line of the init file sets a break on main so that you are ready to
    start debugging immediately upon entering the debugger. The remaining lines create
    macros with the same name as variables from the assembly code. Each of these macros
    use a type cast to convert the address of the variable to a pointer of the proper
    type. This allows using the variable name to get the pointer. For example next
    is a pointer to a short. This allows using *next to get the value next points
    to. You can also use next[0], next[1], next[2], ... to access array elements.
    Without using the init file, gdb will think that all the variables are double
    integers.


    ## A.2. STARTING


    The typical way to start gdb


    ```

    gdb program

    ```


    where program is the name supplied in the -o option when the program was linked.
    The author has prepared a script named ygdb which is invoked similarly


    ```

    ygdb program

    ```


    This script runs gdb using the -x .program.gdb option to have gdb read and execute
    the commands in the init file.


    ## A.3 Quitting


    The command to quit is quit which can be abbreviated as q. If you have started
    running your program and the program is still running, gdb will inform you that
    the program is still running and ask if you wish to kill the process. Enter “y”
    to kill the process and exit.


    ## A.4 Setting break points


    You can set a breakpoint using the “breakpoint” command which can be abbreviated
    as “b”. You can either set the breakpoint using a label from the source code or
    using a line number of the file.


    ```

    b main

    b 17

    ```


    ## A.5 Running


    You start the execution of a program in gdb using “run” which can be abbreviated
    as “r”. If you are in the middle of running your program, gdb will prompt you
    for confirmation before killing the process and starting over.


    If you have set a break point, the debugger will execute statements up to the
    break point and then return control to the debugger. At this point you can examine
    registers, examine memory, step through lines of code, or do any gdb command.
    If you have not set a break point, the program will run to completion or until
    it experiences a fault. This can sometimes be a convenient way to learn about
    problems like segmentation faults.


    While debugging you have several options for continuing execution. The first option
    is to continue execution until completion or another break point is reached. This
    is done using the “continue” command which can be abbreviated as “c".


    Another possibility is to “single step” through your program. Here there are 4
    options. First you can either execute one source code statement or one machine
    instruction. In C/C++ you would prefer not to step one instruction at a time.
    You can also debug only within the same function or step into other functions
    when they are called. Single stepping in the same function is done using “next”
    or “nextinstruction”. With assembly code the two instructions do the same thing.
    They can be abbreviated as “n” or “ni”. If you use “next” the debugger will execute
    all calls to functions without returning to the-


    The alternative choice is to use the “step” or “stepinstruction” command. These
    commands execute either one source code statement or one machine instruction and
    allow debugging inside a called function. They can be abbreviated as “s” or “si”.
    The two commands have the same effect with assembly code. If you write your own
    functions, you would probably prefer using “step” to debug you called functions.
    However, you might wish to use “next” to step through a call to a function like
    printf.


    ## A.6 Printing a trace of stack frames


