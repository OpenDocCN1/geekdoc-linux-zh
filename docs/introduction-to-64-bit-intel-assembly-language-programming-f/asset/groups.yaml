    #1  0x0000000000406d8 in test (name=0x0b7d "rep movsb", copy=0x40930 <copy_ptr>,
    a=0x7ffffed2010 "", b=0x7ffff795310 "", count=100) at testcopy.c:27

    copy(a,b,10000000);

