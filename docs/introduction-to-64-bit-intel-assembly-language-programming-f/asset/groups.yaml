    ## 10.2. 内存引用的通用模式


    ```

    (gdb) p c

    $7 = (long *) 06012d0

    (gdb) p &c[1]

    $8 = (long *) 06012d8

    (gdb) p &c[2]

    $9 = (long *) 06012e0

    ```


    gdb 使用的宏本质上将每个变量都视为一个数组。当我们使用 "p a" 时，它会打印 `a` 的地址。从前三个结果中可以看到，`a` 的元素在内存中的间隔为
    1 字节。接下来，我们看到同样的模式在数组 `b` 中重复，`b` 是一个双字数组（在 C 和 gdb 中为 `int`），数组元素在内存中的间隔为 4 字节。最后，我们看到了将
    `c` 作为四倍字整数数组（在 C 和 gdb 中为 `long`）检查的结果，这些数组元素在内存中的间隔为 8 字节。


    ## 10.2 内存引用的通用模式


    到为止，我们在示例代码中使用了数组引用，但还没有讨论内存引用的选项。内存引用可以表示为：


    - [label+2*ind] 标签处包含的值

    - [label+4*ind] 通过标签加上（索引寄存器乘以 2）得到的内存地址处的值

    - [label+8*ind] 通过标签加上（索引寄存器乘以 4）得到的内存地址处的值

    - [reg] 通过标签加上（索引寄存器乘以 8）得到的内存地址处的值

    - [reg+k*ind] 通过寄存器加上（索引寄存器乘以 k）得到的内存地址处的值

    - [label+reg+k*ind] 通过标签、寄存器加上（索引寄存器乘以 k）得到的 内存地址处的值

    - [number+reg+k*ind] 通过数字、寄存器加上（索引寄存器乘以 k）得到的 内存地址处的值


    这在数组访问中提供了很大的灵活性。对于文本段和数据段中的数组，可以使用标签配合索引寄存器以及数组元素大小的倍数（只要数组元素大小为 1、2、4 或 8）。对于传递给函数的数组，地址必须放在寄存器中。因此，无法使用带有标签的形式。相反，我们可以使用基寄存器配合索引寄存器。16
    个通用寄存器中的任何一个都可以用基寄存器或索引寄存器，但不太可能将栈指针寄存器作为索引寄存器。


    让我们来看一个使用基寄存器和索引寄存器的示例。假设我们希望在函数中将一个数组拷贝到另一个数组。那么，这两个数组地址可以是前两个参数（`rdi` 和 `rsi`），数组元素的个数是第三个参数
    `rdx`。假设数组是双字数组。


    ```

    segment .text

    global .copy_array

    copy_array:

    xor ecx, ecx

    mov eax, [rsi+4*rcx]

    mov [rdi+4*rcx], eax

    add rcx, 1

    cmp rcx, rdx

    je more

    xor eax, eax

    ret

    ```


    在 `copy_array` 函数中，我们按照提供的方式使用了这些参数。我们使用 `rsi` 作为源数组的基寄存器，使用 `rdi` 作为目标数组的基地址寄存器。对于这两个访问，我们都使用
    `rcx` 作为索引寄存器，倍数为 4，因为数组元素是 4 字节。这允许我们比较 `rcx` 和 `rdx` 以查看是否有更多元素需要拷贝。


    ## 10.3. 分配数组


    注意，乘以 2、4 或 8 相当于位移 1、2 或 3 位，因此使用倍数的开销实际上为 0。或者，我们可以在每次循环迭代中将 `rdx` 左移 2 位后，给
    `ecx` 加 4。


    最后一种模式对于访问结构体数组非常有用。如果你有一个结构体数组，每个结构体都有一个字符数组和一个指针，那么引用的数字部分可以是结构体元素内部的偏移量，而基寄存器和索引寄存器可以定义数组中特定结构体的地址。


    ## 10.3 分配数组


    在汇编中分配内存简单的方法可能是使用 C 库的 `malloc` 函数。`malloc` 的原型如下：


    ```

    void *malloc ( long size );

    ```


    如果成功，`malloc` 返回指向所分配内存的指针；如果失败，则 `malloc` 返回 0。`malloc` 返回的内存对齐在 16 字节边界上，这作为任何类型对象的地址都是很有用的（除了为了
    AVX 指令 32 字节对齐的数组外）。可以通过调用 `free` 函数并传入 `malloc` 返回的指针来释放内存以便后续使用：


    ```

    void free ( void *ptr );

    ```


    这里是一个分配 1000000000 字节数组的汇编段：


    ```

    extern malloc

    ...

    mov rdi,1000000000

    call malloc

    mov [pointer], rax

    ```


