    ## 7.5. 移位操作


    x86-64 异或指令命名为 `xor`。`xor` 最常用的用法是将寄存器设置为 0 的惯用方法。这样做是因为将 0 移动到 64 位寄存器中需要 7 字节，而
    `xor` 仅需 3 字节。你可以使用目标寄存器的 32 位版本来获得相同的结果，该指令仅需 2 字节。观察 `xor` 的一些用法：


    ```

    mov   rax, 0x1234567812345678

