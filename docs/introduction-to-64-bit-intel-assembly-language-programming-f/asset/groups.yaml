    # Acknowledgements


    No book is created in isolation. This book is certainly no exception. I am indebted
    to numerous sources for information and assistance with this book.


    Dr. Paul Carter''s PC assembly language book was used by this author to study
    32 bit assembly language programming. His book is a free PDF file downloadable
    from his web site. This is a 195 page book which covers the basics of assembly
    language and is a great start at 32 bit assembly language.


    While working on this book, I discovered a treatise by Drs. Bryant and O''Halloron
    of Carnegie Mellon about how gcc takes advantage of the features of the x86-64
    architecture to produce efficient code. Some of their observations have helped
    me understand the CPU which assists with writing better assembly code. Programmers
    interested in efficiency should study their work.


    I found the Intel manuals to be an invaluable resource. They provide details on
    all the instructions of the CPU. Unfortunately the documents cover 32 bit and
    64 bit instructions together, along with the huge number of instructions, makes
    it difficult to learn assembly programming from these manuals. I hope that reading
    this book will make a good starting point, but a short book cannot cover many
    instructions. I have selected what I consider the most important instructions
    for general use, but an assembler will need to study the Intel manuals (or equivalent
    manuals from AMD).


    I thank my friends Maggie and Tim Hampton for their editing contributions to the
    book.


    I am indebted to my CSC 203 - Assembly Language class at the University of Southern
    Mississippi for their contributions to this book.'
