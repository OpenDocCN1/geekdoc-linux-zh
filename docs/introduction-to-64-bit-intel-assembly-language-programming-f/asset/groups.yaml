    \ `switch` 语句中，构建一个跳转位置数组可能是有利的。\n\n### 8.2. 条件跳转\n\n要使用条件跳转，我们需要一种可以设置某些标志的指令。这可以是算术操作或位操作。然而，通过减法来判断两个数是否相等可能会抹除寄存器中需要的值。x86-64\
    \ CPU 提供了一个比较指令（cmp），它从第一个操作数中减去第二个操作数并设置标志，而不存储差值。\n\n具有通用模式的条件跳转指令很少：\n\n```\n\
