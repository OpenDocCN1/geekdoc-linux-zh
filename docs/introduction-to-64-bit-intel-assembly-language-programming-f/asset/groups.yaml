    Binary numbers are a fairly effective way of representing a string of bits, but
    they can get pretty tedious if string is long. In a 64 bit computer it is fairly
    common to work with 64 integers. Entering a number as 64 bits followed by "b"
    would be tough. Decimal numbers are a much more compact representation, but it
