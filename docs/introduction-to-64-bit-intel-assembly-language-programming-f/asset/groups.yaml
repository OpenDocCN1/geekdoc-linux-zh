    \ db \"12 Mockingbird Lane\", 0\nat c_balance, dd 12500\niend\n```\n\n## 13.2\
    \ Allocating and using an array of structs\n\nIf you wish to allocate an array\
    \ of structs, then you need to multiply the size of the struct times the number\
    \ of elements to allocate enough space. But the size given by Customer_size might\
    \ not match the value sizeof(struct Customer) in C. C will align each data item\
    \ on appropriate boundaries and report a size which will result in each element\
    \ of an array having aligned fields. You can assist yasm by adding a terminal\
    \ X where X represents the size of the largest data item in struct. If the struct\
    \ has any quad word fields then you need to align 8 to force the _size value to\
    \ be a multiple of 8. If the struct has no quad word fields but has some double\
    \ word fields you need align 4. Similarly align 2 if there are any word fields.\
    \ So our code to declare a struct (slightly changed) and allocate an array would\
    \ look like this\n\n```\nsegment .data\nstruc Customer\nc_id resd 1 ; 4 bytes\n\
