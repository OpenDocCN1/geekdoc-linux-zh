  mdcn: "\n它仍然可以工作，但结构体定义与对齐不匹配。为了这样做，我们必须在 `c_balance` 定义之前放置 `align 4`。\n\n另一种可能性是定义一个类型为\
    \ `Customer` 的静态变量。要使用默认数据来实现，只需使用：\n\n```\nstruct Customer\niend\n```\n\n如果你想定义字段，请按顺序定义所有字段。你可以缩短字符串的数据：\n\
    \n```\nstruct Customer\nat c_id, dd 7\nat c_name, db \"Calvin\", 0\nat c_address,\
    \ db \"12 Mockingbird Lane\", 0\nat c_balance, dd 12500\niend\n```\n\n## 13.2\
    \ 分配和使用结构体数组\n\n如果你想分配结构体数组，你需要将结构体的大小乘以元素的数量，以分配足够的空间。但 `Customer_size` 提供的尺寸可能与\
    \ C 语言中的 `sizeof(struct Customer)` 不匹配。C 会将每个数据项对齐到适当的边界，并报告一个使得数组中的每个元素都具有对齐字段的大小。你可以通过添加一个末尾\
    \ `X` 来辅助 yasm，其中 `X` 代表结构体中最大数据项的大小。如果结构体包含任何四字（quad word）字段，则你需要 `align 8` 以强制\
    \ `_size` 值为 8 的倍数。如果结构体没有四字字段但有一些双字（double word）字段，则你需要 `align 4`。同样，如果有任何字（word）字段，则使用\
    \ `align 2`。因此，我们声明结构体（稍作修改）并分配数组的代码如下：\n\n```\nsegment .data\nstruc Customer\n\
    c_id resd 1 ; 4 字节\nc_name resb 65 ; 69 字节\nc_address resb 65      ; 134 字节\n\
    \             align   4      ; 对齐到 136\nc_balance resd 1      ; 140 字节\nc_rank\
    \   resb 1      ; 141 字节\n             align   4      ; 对齐到 144\nendstruct\ncustomers\
    \ dq    0\n             segment .text\n               mov     edi, 100 ;;  100\
    \ 个结构体\n               mul     edi, Customer_size\n               call    [customers],\
    \ rax\n```\n\n现在要处理数组的每个元素，我们可以从一个持有 `customers` 值的寄存器开始，在处理每个客户后向寄存器中加上 `Customer_size`。\n\
    \n```\nsegment .data\n               db      \"%s %d\",0x0a,0\n             segment\
    \ .text\n               push    r15\n               push    r14\n            \
    \   mov     r15, 100    ; 调用时保存计数器\n               mov     r14, [customers]; 调用时保存指针\n\
    lea     edi, [format]\nlea     esi, [r14+c_name]\nlea     rdx, [r14+c_address]\n\
    mov     rcx, [r14+c_balance]\n               call    printf\n               add\
    \     r14, Customer_size\n               sub     r15, 1\n               jnz  \
    \   more\n               pop     r14\n               pop     r15\n           \
    \    ret\n```\n\n## 练习题\n\n- 1. 设计一个结构体来表示集合。该结构体将持有最大集合大小以及指向数组的指针，该数组为集合每个可能的元素存储\
    \ 1 位。集合的成员将是从 0 到集合大小减 1 的整数。编写一个测试程序来读取操作集合的命令。命令将是“add”（添加）、“remove”（移除）和“test”（测试）。每个命令都带有一个整数参数。你的程序将能够向集合添加元素、从集合移除元素并测试成员关系。\n\
    \n- 2. 使用练习 1 中的集合设计，编写一个程序来处理多个集合。实现“add”、“union”（并集）、“print”（打印）和“intersect”（交集）命令。创建\
    \ 10 个大小为 10000 的集合。“add s k”将将 k 添加到 s。“union s t”将将 s 替换为 s 与 t 的并集（s union\
    \ t）。“intersect s t”将将 s 替换为 s 与 t 的交集（s/t）。“print s”将打印 s 的元素。\n\n- 3. 设计一个结构体表示大整数。为了简单起见，使用四字数组作为大整数的数据。每个四字代表数字的\
    \ 18 位。因此， 1 个四字可以存储高达 999,999,999,999,999 的数字。2 个四字可以存储高达 999,999,999,999,999,999,999,999,999\
    \ 的数字。仅实现正数。实现加法和乘法（基于加法）。计算 50!。你允许在 C 或 C++ 中编写主程序，其中使用汇编代码表示所有长算术来实现阶乘算法。\n\
