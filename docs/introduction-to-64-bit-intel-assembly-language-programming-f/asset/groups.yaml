    # Preface


    The Intel CPU architecture has evolved over 3 decades from a 16 bit CPU with no
    memory protection, through a period with 32 bit processors with sophisticated
    architectures into the current series of processors which support all the old
    modes of operation in addition to a greatly expanded 64 bit mode of operation.
    Assembly textbooks tend to focus on the history and generally conclude with a
    discussion on the 32 bit mode. Students are introduced to the concepts of 16 bit
    CPUs with segment registers allowing access to 1 megabyte of internal memory.
    This is an unnecessary departure on the past.


    With the x86-64 architecture there is almost a complete departure from the past.
    Segment registers are essentially obsolete and more register usage is completely
    general purpose


    There are now 16 general purpose integer registers with a few specialized instructions.
    The archaic register stack of the 8087 has been superseded by a well-organized
    model providing 16 floating point registers with the floating point instructions
    for the SSE and AVX extensions. In fact the AVX extensions allow even a three
    operand syntax which can simplify coding even more.


    Overall the x86-64 assembly programming is simpler than its predecessors. The
    dominant mode of operation will be 64 bits within a few short years. Together
    these trends indicate that it is time to teach 64 bit assembly language.


    The focus in this textbook is early hands-on use of 64 bit assembly programming.
    There is no 16 or 32 bit programming and the discussion'
