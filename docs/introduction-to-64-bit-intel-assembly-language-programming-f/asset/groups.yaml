    In the main loop of this function movapd instruction was used to load 2 double
    precision values from the x array and again the load 2 values from the y array.
    Then accumulation was performed in registers xmm0 - xmm4. Each of these registers
    holds 2 accumulated values - one for even indices and one for odd indices.


    After this collection of accumulations the movapd instruction was used to load
    2 more values from x and again to load 2 more values from y. These values were
    used to form accumulations into 5 registers: xmm8 - xmm12.


    After completing the loop, it was time to add the 4 parts of each required summation.
    The first step of this process was using addpd to add the registers xmm8 - xmm12
    to registers "horizontal" add packed double", haddpd, instruction was used to
    add the upper and lower halves of each of the registers to get the final sums.
    Then the code implemented the formula presented earlier.


    When tested on 1 million correlations of size 10000, this program used 6.74 seconds
    which is approximately 11.8 GFLOPs. Now this is pretty impressive since the CPU
    operates at 3.4 GHz. It produced about 3.5 floating point results per cycle. This
    means that one of the SSE instructions was completing at once. The CPU is performing
    out-of-order execution and completing more than one SSE instruction per cycle.


    # 19.3 Implementation using AVX instructions


    The Core i7 CPU implements a new collection of instructions called “Advanced Vector
    Extensions” or AVX. For these instructions an extension of the XMM registers named
    ymm0 through ymm15 is provided along with some new instructions. The YMM registers
    are 256 bits each and can hold 4 double precision values in each one. This allowed
    a fairly easy adaptation of the SSE function to operate on 4 values at once.


    In addition to providing the larger registers, the AVX instructions added versions
    of existing instructions which allowed using 3 operands: source operands and a
    destination which did not participate as a source'
