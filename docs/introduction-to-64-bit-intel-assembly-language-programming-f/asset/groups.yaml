    ## 10.2. GENERAL PATTERN FOR MEMORY REFERENCES


    ```

    (gdb) p c

    $7 = (long *) 06012d0

    (gdb) p &c[1]

    $8 = (long *) 06012d8

    (gdb) p &c[2]

    $9 = (long *) 06012e0

    ```


    The macros used by gdb essentially treat every variable as an array. When we use
    "p a", it prints the address of a. You can see from the first 3 results that the
    elements of a are at 1 byte intervals in memory. Next we see the same pattern
    repeated for array b which is an array of double words (int in C and gdb) and
    the array elements are placed at 4 byte intervals in memory. Finally we see the
    results for inspecting c as an array of quad-word integers (long in C and gdb)
    and that these array elements are placed at 8 byte intervals.


    ## 10.2 General pattern for memory references


    So far we have used array references in sample code without discussing the options
    for memory references. A memory reference can be expressed as:


    - [label+2*ind] the value contained at label

    - [label+4*ind] the value contained at the memory address obtained by adding the
    label and index register times 2

    - [label+8*ind] the value contained at the memory address obtained by adding the
    label and index register times 4

    - [reg] the value contained at the memory address obtained by adding the label
    and index register times 8

    - [reg+k*ind] the value contained at the memory address obtained by adding the
    register and index register times k

    - [label+reg+k*ind] the value contained at the memory address obtained by adding
    the label, the register and index register times k

    - [number+reg+k*ind] the value contained at the memory address obtained by adding
    the number, the register and index register times k


    This allows a lot of flexibility in array accesses. For arrays in the text and
    data segments it is possible to use the label along an index register with a multiplier
    for the array element size (as long as the array element size is 1, 2, 4 or 8).
    With arrays passed into functions, the address must be placed in a register. Therefore
    the form using a label is not possible. Instead we could use a base register with
    an index register. Any of the 16 general purpose registers may be used as a base
    register or an index register, however it is unlikely that you would use the stack
    pointer register as an index register.


    Let''s look at an example using a base register and an index register. Let''s
    suppose we wish to copy an array to another array in a function. Then the two
    array addresses could be the first 2 parameters (rdi and rsi) and the number of
    array elements be the third parameter rdx. Let''s assume that the arrays are double
    word arrays.


    ```

    segment .text

    global .copy_array

    copy_array:

    xor ecx, ecx

    mov eax, [rsi+4*rcx]

    mov [rdi+4*rcx], eax

    add rcx, 1

    cmp rcx, rdx

    je more

    xor eax, eax

    ret

    ```


    In the copy_array function we used the parameters as they were provided. We used
    rsi as the base register for the source array and rdi as the base address register
    for the destination array. For both accesses we used rcx as the index register
    with a multiplier of 4 since the arrays have 4 byte elements. This allows us to
    compare rcx versus rdx to see if there are more elements to copy.


    ## 10.3. ALLOCATING ARRAYS


    Note that multiplying by 2, 4 or 8 is a shift of 1, 2 or 3 bits, so there is effectively
    0 cost to using the multiplier. Alternatively we could add 4 to ecx in each loop
    iteration after shifting rdx left 2 positions.


    The last pattern we would be useful for accessing an array of structs. If you
    had an array of structs each struct having a character array and a pointer, then
    the number part of the reference could be the offset of the struct element within
    the struct, while the base register and index register could define the address
    of a particular struct in the array.


    ## 10.3 Allocating arrays


    The simplest way to allocate memory in assembly is probably to use the C library
    malloc function. The prototype for malloc is:


    ```

    void *malloc ( long size );

    ```


    On success malloc returns a pointer to the allocated memory, while failure results
    in malloc returning 0. The memory returned by malloc is bounded on 16 byte boundaries,
    which is useful as an address for any type of object (except arrays needing to
    be on 32 byte boundaries for AVX instructions). The memory can be returned for
    potential reuse by calling the free function with the pointer returned by malloc:


    ```

    void free ( void *ptr );

    ```


    Here is an assembly segment to allocate an array of 1000000000 bytes:


    ```

    extern malloc

    ...

    mov rdi, 1000000000

    call malloc

    mov [pointer], rax

    ```


    There are several advantages to using allocated arrays. The most obvious one is
    that you can have arrays of exactly the right size. Frequently you can compute
    the size of array needed in your code and allocate an array of the correct size.
    If you use statically defined arrays either in the data or bss segment, you have
    to know the size needed before running the program (or guess).


    Another less obvious reason for using allocated arrays is due to size limitations
    imposed on the data and bss sections by either the assembler, linker or operating
    system. yasm reports FATAL: out of memory when you try to allocate an array of
    3 billion bytes. It succeeds with an array of 2 billion bytes in the bss segment.
    It took approximately 104 seconds on a 2.4 GHz Opter system to assemble and link
    a test program with a 2 GB array. In addition the object file and the executable
    file exceeded 2 billion bytes in size. It is much faster (less than 1 second)
    to assemble and link a program using malloc and the executable size was about
    10 thousand bytes.


    The program using malloc was modified to allocate 20 billion bytes and still assembled
    and linked in less than 1 second. It executed in 3 milliseconds. There is no practical
    way to use large amounts of memory other than using allocated memory.


    The user should be cautioned not to attempt to assemble programs with large static
    memory needs on a computer with less RAM required. This will cause disk thrashing
    while assembling and linking, using far more than 100 seconds and nearly crippling
    the computer during the process. Also it can be quite painful to use arrays larger
    than memory if they are allocated. Disk thrashing is not cool.


    ## 10.4 Processing arrays


    Here we present an example with several functions which process arrays. This application
    allocates an array using malloc, fills the array with random numbers and computes
    the minimum value in the array. If the array size is less or equal to 20, it prints
    the values in the array.


    ### 10.4.1 Creating the array


    The array is created using the create function shown below. This function is perhaps
    too short to be a separate function. It multiplies the array size by 4 to get
    the number of bytes in the array and then calls malloc.


    ```

    array = create ( size );

    create:

    push    rbp

    mov     rbp, rsp

    imul    rdi, 4

    call    malloc

    leave

    ret

    ```


    ### 10.4.2 Filling the array with random numbers


    The fill function uses storage on the stack for local copies of the array pointer
    and its size. It also stores a local variable on the stack. These 3 variables
    require 24 bytes of storage, we subtract 32 from rsp to maintain the 16 byte alignment
    of the stack. We store data in the array using “mov [rdi+rcx*4], eax”, where rdi
    holds the address of the start of the array and rcx contains the index of the
    current array element.


    Here we use several local labels. A local label is a label beginning with a dot.
    Their scope is normal labels. So in the fill function, labels .array, .size, .i
    and .more are local. This allows reusing these labels in other functions, which
    simplifies the coding of the application.


    ```

    fill ( array, size );

    .array equ  0

    .size equ  8

    .i    equ  16

    push    rbp

    mov     rbp, rsp

    sub     rsp, 32

    mov     [rsp+.array], rdi

    mov     [rsp+.size], rsi

    xor     ecx, ecx

    .more mov  [rsp+.i], rcx

    call    random

    mov     rcx, [rsp+.i]

    mov     rdi, [rsp+.array]

    mov     [rdi+rcx*4], eax

    inc     rcx

    ```

