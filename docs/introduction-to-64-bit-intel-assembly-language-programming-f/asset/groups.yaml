    # CHAPTER 7. BIT OPERATIONS


    ```

    mov rbx, ra          ; copy bit number to rbx

    shr rbx, 6          ; qword number of data to test

    mov rcx, ra          ; copy bit number to rcx

    and rcx, 0x3f         ; extract rightmost 6 bits

    xor edx,dx         ; set rdx to 0

    bt [data+8*rbx],rcx ; test bit

    setcl dl            ; edx equals the tested bit

    bts [data+8*rbx],rcx ; set the bit, insert into set

    btr [data+8*rbx],rcx ; clear the bit, remove

    ```


    You will notice the use of data+8*rbx where we have previously used only a variable
    name. The use of a register times allows indexing an array starting at data memory.
    The instruction format includes options for multiplying an index register by 2,
    4 or 8 to be added to the address specified by data. Use 2 for a word array, 4
    for a double array and 8 for a quad-word rbx holds the quad-word index into the
    data array.


    Operating on the quad-word of the set in memory as opposed to getting a register
    is likely to be the fastest choice, since in real code we will not need to test,
    insert and then remove in 1 function call. We will do only one of these operations.


    # 7.7 Extracting and filling a bit field


    To extract a bit field you need to shift the field so that its least significant
    bit is in position 0 and mask the field with an operation with the appropriate
    mask. Let''s suppose we need to extract bits 23-51 from a quad-word stored in
    a memory location. Then, after loading the quadword, we need to shift it 23 bits
    to get the least significant bit into the proper position. The bit field is of
    length 29. The simplest way to get a proper mask (29 1 bits) is using the value
    0x1ffffff. Seven''s is 28 bits and the 1 gives a total of 29 bits. Here is the
    code to do the work:


    ```

    mov ra, [sample]    ; move quad-word into ra

    shr ra, 23           ; shift to align bit 23 at 0

    and ra, 0x1ffffff ; select the 29 low bits

    mov [field], ra      ; save the field

    ```'
