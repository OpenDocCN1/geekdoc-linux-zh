    # CHAPTER 8. BRANCHING AND LOOPING


    The basic form of the jmp instruction is


    ```

    jmp    label

    ```


    where label is a label in the program''s text segment. The assembler will generate
    a rip jump instruction. The simplest relative jump uses an 8 bit signed immediate
    value and is encoded in 2 bytes. This allows jumping forwards or backwards about
    127 bytes. The next variety of relative jump uses a 64 bit mode uses a 32 bit
    signed immediate value and requires a total of 5 bytes. Fortunately the assembler
    figures out which variety it can use and chooses the shorter form. The programmer
    simply specifies a label.


    The effect of the jmp statement is that the CPU transfers control to the instruction
    at the labeled address. This is generally not too exciting except when used with
    a conditional jump. However, the jmp instruction can jump to an address contained
    in a register or memory location. Using a conditional move could manage to use
    an unconditional jump to an address contained in a register to implement a conditional
    jump. This isn''t sensible, since there are conditional jump statements which
    handle this more efficiently.


    There is one possibility which is more interesting - implementing a switch statement.
    Suppose you have a variable i which is known to contain a value from 0 to 2. Then
    you can form an array of instruction addresses and use a jmp instruction to jump
    to the correct section of code based on the value of i. Here is an example:


    ```

    segment .data

    switch: dq main.case0

    dq main.case1

    dq main.case2

    dq 2

    segment .text ; tell linker about main

    global main:

    mov rax, [i]      ; move i to rax

    jmp [switch+rax*8] ; switch ( i )

    case0:

    mov rbx, 100      ; go here if i == 0

    ```'
