    possible to do a conditional jump after the decrement. Overall the compiler generated
    a loop with 6 instructions, while the hand-written assembly loop used 8 instructions.

    As stated in the introduction a good compiler is hard to beat. You can learn a
    lot from studying the compiler''s generated code. If you are interested in efficiency
    you may be able to do better than the compiler. You could certainly copy the generated
    code and do exactly the same, but if you cannot improve on the compiler''s code
    then you should stick with C.


    There is one additional compiler option, -funroll-all-loops which tend to speed
    up code considerably. In this case the compiler used more registers and did 8
    iterations of a loop which added 8 bits in each iteration. The compiler did 8
    bits in 24 instructions where before it did 1 bit in 6 instructions. This is about
    twice as fast. In addition the instruction pipeline is used more effectively in
    the unrolled version, perhaps this is 3 times as fast.


