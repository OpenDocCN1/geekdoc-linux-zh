    Now suppose we wish to fill in bits 23-51 of sample with the bits in field. The
    easy method is to rotate the value to align the field, shift right and then left
    to clear 29 bits, or in the field, and then rotate the register to get the field
    back into bits 23-51. Here is the code:


    ```

    mov    rax, [sample]      ; move quad-word into rax

    ror    rax, 23               ; rotate to align bit 23 at 0

    shr    rax, 29               ; wipe out 29 bits

    shl    rax, 29               ; move bits back into alignment

    or     rax, [field]      ; trusting the field is 29 bits

    rol    rax, 23               ; realign the bit fields

    mov    rax, [sample], rax  store the fields in memory

    ```'
