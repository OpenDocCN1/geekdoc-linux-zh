    ## 12.3. C 封装函数


    用户的 shell 被分配了一个用户 ID（user-id），这是一个用于标识用户的整数。此外，用户还有一个组 ID（group-id，也是一个整数），用于标识用户所属特定的用户组。虽然用户可以属于多个组，但只有一个组是活动组。你可以在
    shell 中使用 "id" 命令来打印你的 user-id、group-id 以及你所属的组列表。


    基础权限是 3 组对应 3 种权限。这使得使用八进制数是非常理想的。一个八进制“数字”代表 3 位。通过使用 9 位，你可以指定用户、组和其他人的基础权限。在
    yasm 中，八进制数可以用以 "o" 或 "q" 结尾的数字序列表示。因此，你可以为用户指定读写权限为 6，为组指定为 4，为其他人不设置权限（为 0）。将所有这些结合在一起，我们得到
    640o。


    `open` 的返回值如果该值大于或等于 0，则是一个文件描述符。负返回表示错误。文件描述符是一个标识由 `open` 建立连接的整数。文件描述符从 0 开始，每打开一个文件就会增加一个。以下是打开文件的代码：


    ```assembly

    segment .data

    fd: dd 0

    name: db "sample",0

    segment .text

    extern open

    lea rdi, [name] ; pathname

    mov esi, 0x42 ; read-write | create

    mov rdx, 6000 ; read-write for me

    call open

    cmp eax, 0

    jl error ; failed to open

    mov [fd], eax

    ```


    ### 12.3.2 read 和 write 系统调用


    向文件读写数据的系统调用是 `read` 和 `write`。它们的原型非常相似：


    ```c

    int read ( int fd, void *data, long count );

    int write ( int fd, void *data, long count );

    ```


    数据数组可以是任何类型的数据。无论类型类型如何，`count` 都是要读取或写入的字节数。这两个函数都返回读取或写入的字节数。返回 -1 表示错误，并设置外部变量
    `errno` 为一个表示错误类型的整数。你可以使用 `lseek` 函数来调用错误的文本版本。


    ### 12.3.3 lseek 系统调用


    在读写文件时，有时必要在读写之前定位到文件中的特定位置。例如，从一个每条记录为 512 字节的文件文件中写入第 1000 条记录。假设记录编号从 0 开始，那么第
    1000 条记录将从位置 1000 + 512 = 512000 开始。定位到 512000 并写入 512 字节可以非常快。这比直接读写文件要简单。


    `lseek` 系统调用允许你通过读取或写入文件来设置当前位置。它的原型是：


    ```c

    long lseek ( int fd, long offset, int whence );

    ```


    `offset` 参数通常只是文件中的字节位置，但 `offset` 的含义取决于 `whence` 的值。如果 `offset` 为 0，则 `offset`
    是字节位置。如果 `whence` 为 1，则 `offset` 相对于当前位置。如果 `whence` 为 2，则 `offset` 相对于文件末尾。`lseek`
    的返回值是文件下一次读或写的位置。


    使用 `offset` 为 0 且 `whence` 等于 2 的 `lseek`，将返回一个比文件最后一个字节大 1 的字节位置。这是确定文件大小的一种简单方法。知道大小后，你可以分配一个数组并读取整个文件（只要你有足够的
    RAM）。


    ```assembly

    mov      edi, [fd]

    xor      esi, esi    ; set offset to 0

    mov      edx, 2      ; set whence to 2

    call     lseek         ; determine file size

    mov      [size], rax

    ```


    ```assembly

    mov      edi, rax

    call     malloc      ; allocate an array for the file

    mov      [data], rax

    mov      edi, [fd]

    xor      esi, esi;; set offset to 0

    xor      edx, edx;; set whence to 0

    call     lseek      ; seek to start of file

    mov      edi, [fd]

    mov      esi, [data]

    mov      edx, [size]

    call     read      ; read the entire file

    ```


    ### 12.3.4 close 系统调用


    当你完成文件的读取或写入后，应该关闭它。`close` 系统调用的唯一参数是要关闭的文件的描述符。如果你在退出程序时没有关闭文件，操作系统将关闭关闭它。使用文件描述符读写的数据在用户程序中是不缓冲的，因此不会有可能丢失的未写入数据。对于使用
    `FILE` 指针的情况则不然，如果没有关闭，可能会导致数据丢失。关闭文件的最大优势是减少了内核的开销，并避免遇到每个进程打开文件数量的限制。


    ```assembly

    mov      edi, [fd]

    call     close

    ```


