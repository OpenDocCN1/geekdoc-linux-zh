    \ for strings is to treat the string as containing polynomial coefficients and\
    \ evaluate p(n) for some prime number n. In the code below we use the prime number\
    \ 191 in the evaluation. After evaluating the polynomial value, you can perform\
    \ a modulus operation using the table size (100000 in the sample code).\n\n```\n\
    int hash ( unsigned char *s )\n{\n  unsigned long h = 0;\n  int i = 0;\n\n  while\
