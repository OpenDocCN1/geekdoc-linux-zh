    \n其中 `label` 是程序文本段中的一个标签。汇编器将生成一个 `rip` 跳转指令。最简单的相对跳转使用 8 位有符号立即数，并编码为 2 字节。这允许向前或向后跳转约\
    \ 127 字节。下一种类型的相对跳转在 64 位模式下使用 32 位有符号立即数，总共需要 5 个字节。幸运的是，汇编器会推断出它可以使用哪种类型并选择较短的形式。程序员只需指定标签即可。\n\
    \n`jmp` 语句的效果是 CPU 将控制权转移到标签所在地址的指令。除非与条件跳转配合使用，否则这通常并不无趣。然而，`jmp` 指令可以跳转到寄存器或内存位置中的地址。使用条件移动可能尝试通过无条件跳转到寄存器包含的地址来实现条件跳转。这并不明智，因为有更高效的条件跳转语句来处理这种情况。\n\
    \n有一种更有趣的可能性——实现 `switch` 语句。假设你有一个变量 `i`，已知它包含 0 到 2 之间的值。你可以构建一个指令地址数组，并使用 `jmp`\
