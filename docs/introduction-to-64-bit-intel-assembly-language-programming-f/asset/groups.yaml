    ## 16.7 高效使用寄存器\n\n将值放在寄存器中。将值放在寄存器中几乎比放在内存中好。现代 CPU 比内存快得多，所以你应该尝试将频繁使用的值放在寄存器中，以避免重复计算。\n\
    \n## 16.8 减少分支\n\n现代 CPU 进行分支预测，当预测错误时会发生停顿，所以你应该尽量减少分支数量。\n\n## 16.9 将循环转换为底部的分支\n\
    \n如果你编写一个 while 循环，顶部会有一个条件分支。始终可以将循环转换为底部有条件分支。这里有一个 for 循环转换为 do-while 循环的示例：\n\
    \n```c\nfor ( i = 0; i < n; i++) {\n  x[i] = a[i] + b[i];\n}\n```\n\n现在是带有额外 if\
    \ 语句的 do-while 循环：\n\n```c\nif (n > 0) {\n  i = 0;\n}\n```\n\n## 16.10 循环展开\n\n\
    ```c\ndo {\n  x[i] = a[i] + b[i];\n  i++;\n} while ( i < n);\n```\n\n请不要在 C 或\
    \ C++ 中采用这种编码风格。编译器处理循环得非常好。事实上，for 循环的简单性可能会允许编译器生成更好的代码。我之所以在 C 中演示这些，仅仅为了更快地说明观点。\n\
    \n"
