    # 2.2. HEXADECIMAL NUMBERS


    are binary and hexadecimal. Binary is pretty obvious to use, but for fairly short
    binary strings. Hexadecimal is more practical for only binary strings.


    The bottom line is conversion between binary and hexadecimal is all that one normally
    needs to do. This task is made easier since each hexadecimal represents exactly
    4 bits (frequently referred to as a "nibble"digit”). Consult the table below to
