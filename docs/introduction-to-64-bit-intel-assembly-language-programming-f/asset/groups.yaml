    the reverse pattern of push. It moves the value at the location specified by the
    stack pointer (rsp) to a register or memory location and then adds 8 to rsp.


    You can push and pop smaller values than 8 bytes, at some peril. It works as long
    as the stack remains bounded appropriately for the current operation. If you push
    a word and then push a quad-word, the quadword push may fail. It is simpler to
    push and pop only 8 byte quantities.


    # 9.2 Call instruction


    The assembly instruction to call a function is call. A typical use would be like


    ```

    call my_function

    ```


    The operand my_function is a label in the text segment of a program. The effect
    of the call instruction is to push the address of the instruction following the
    call onto the stack and transfer control to the address associated with my_function.
    The address pushed onto the stack is called the "return address". Another way
    to implement a call would be


    ```

    push next_instruction

    jmp my_function

    next_instruction:

    ```


    While this does work, the call instruction has much more capability which we will
    generally ignore.'
