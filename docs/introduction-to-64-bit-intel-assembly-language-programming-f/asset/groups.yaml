    ## Chapter 11: Floating point instructions


    The 8086 used a floating point coprocessor called 8087 to perform floating point
    arithmetic. Many early computers lacked this coprocessor. This arrangement continued
    until the 486 which contained it internally. 8087 used a stack of floating point
    values. These instructions are still part of modern CPUs, though there is a completely
    separate floating point facility available in the Core i series (128-bit mode).
    We will study the newer instructions.


    If you study the Intel 64 and IA-32 Architectures Software Manual, you will find
    many instructions such as fidd, which work with registers named ST(0), ST(1),
    ... for Streaming Extensions (SSE). SIMD is an acronym for "Single Instruction
    - Multiple Data". These are the focus of this chapter.


    ### 11.1 Floating point registers


    There are 16 floating point registers which serve dual purposes: holding either
    a single value or multiple values. The names for these registers are xmm0, xmm1,
    ... xmm15. The i series of computers introduced Advanced Vector Extensions which
    doubled the size of floating point registers. To use the full 256 bits (8 floats
    or 4 doubles) you need to use a register from ymm0, ... ymm15. Each XMM register
    occupies the first 128 bits of the corresponding YMM register. Most of this chapter
    discussion refers only to XMM registers.


    ### 11.2 Moving data to/from floating point registers


    There are instructions for moving integer packed data and floating point data.
    We will concentrate here on floating point data. You can move floats or doubles.
    There are instructions for moving aligned or unaligned packed data. The aligned
    instructions are movaps for four floats and movapd for two doubles using XMM registers.
    The unaligned versions are movups and movd. Moving packed data to/from YMM registers
    moves twice as many values.


    ### 11.2.1 Moving scalars


    There are two instructions for moving scalar-value floating point values to/from
    SSE registers: movss moves 32 bit floating point values (floats) and movsd moves
    64 bit floating point values (doubles). These two instructions move a value from
    memory to/from lower part of an XMM register or from one XMM register to another.
    There is no implicit conversion. Here is a sample:


    ```

    movss xmm0, [x]      ; move value at x into xmm0

    movsd [y], xmm1      ; move value from xmm1 to y

    movss xmm2, xmm0      ; move from xmm0 to xmm2

    ```


    ### 11.2.2 Moving packed data


    There are instructions for loading integer packed data and floating point data.
    Aligned data means that it is on a 16-byte boundary in memory. This can be arranged
    by using align16. The bss section does not do the job properly. Arrays allocated
    by malloc will be on 16-byte boundaries. Your program will fail with a segmentation
    fault if you attempt to use an aligned move to an unaligned address. Fortunately
    on the Core i series of CPUs, the unaligned versions are just as fast as the aligned
    moves:


    ```

    movups xmm0, [x] ; move 4 floats to xmm0

    movups ymm0, [x] ; move 8 floats to ymm0

    movups ymm1, [x] ; move 4 doubles to ymm1

    movd [a], xmm1 ; move 2 doubles to a

    ```


    ### 11.3 Addition


    The instructions for adding floating point data come in scalar and packed varieties.
    The scalar add instructions are addss to add two floats and addsd to add two doubles.
    Both these operate on a source and destination operand. The source can be in memory
    or in an XMM register, while the destination must be in an XMM register. Unlike
    the integer add instruction, the floating point add instructions do not set any
    flags, so testing must be done using a comparison.


    The packed add instructions are addps which adds 4 floats from the source to destination
    and addpd which adds 2 doubles from the source to 2 doubles in the destination
    using XMM registers. Like the scalar adds, the source can be either memory or
    an XMM register, while the destination must be an XMM register. Using packed with
    YMM registers adds 8 pairs of floats or 4 pairs of doubles.


    ```

    movss xmm0, [a]    ; load a

    addss xmm0, [b]    ; add b to a

    movss [c], xmm0     ; store sum in c

    movupd xmm0, [a]    ; load 2 doubles from a

    addpd xmm0, [b]    ; add a[0]+b[0] and a[1]+b[1]

    movapd [c], xmm0     ; store 2 sums in c

    movupd ymm0, [a]    ; load 4 doubles from a

    addpd ymm0, [b]    ; add 4 pairs of numbers

    movupd [c], ymm0     ; store 4 sums in c

    ```


    ### 11.4 Subtraction


    Subtraction follows the same pattern as addition in that they operate on memory
    or register operands. They support floats and doubles they support scalar and
    packed data. The scalar subtract instructions are subss which subtracts the source
    from the destination and subsd which subtracts the source from the destination.
    No flags are affected by the floating point subtraction instructions.


    The packed subtract instructions are subps which subtract 4 floats from the destination
    and subpd which subtracts 2 doubles from the source to 2 doubles in the destination
    using XMM registers. Again the source can be either memory or an XMM register,
    while the destination must be an XMM register.


    ```

    movss xmm0, [a]    ; load a

    subss xmm0, [b]    ; subtract b from a

    movss [c], xmm0     ; store sum in c

    movapd xmm0, [a]    ; load 2 doubles from a

    subpd xmm0, [b]    ; subtract a[0]-b[0] and a[1]-b[1]

    movapd [c], xmm0     ; store 2 sums in c

    movupd ymm0, [a]    ; load 4 doubles from a

    subpd ymm0, [b]    ; subtract 4 pairs of numbers

    movupd [c], ymm0     ; store 4 sums in c

    ```


    ### 11.5 Multiplication and division


    Multiplication and division follow the same pattern as addition and subtraction
    in that they operate on memory or register operands. They support floats and doubles
    they support scalar and packed data. The basic mathematical instructions for floating
    point data are:


    | instruction | effect |

    |---||---|

    | addsd | add scalar double |

    | addss | add scalar float |

    | adddpd | add packed double |

    | addps | add packed float |

    | subsd | subtract scalar double |

    | subss | subtract scalar float |

    | subpd | subtract packed double |

    | subps | subtract packed float |

    | mulsd | multiply scalar double |

    | mulss | multiply scalar float |

    | mulpd | multiply packed double |

    | mulps | multiply packed float |

    | divsd | divide scalar double |

    | divss | divide scalar float |

    | divpd | divide packed double |

    | divps | divide packed float |


    ### 11.6 Conversion


    It is relatively common to need to convert numbers from one length to another,
    from one length floating point to another, from integer to floating point or from
    floating point to integer. Converting from one length to another is accomplished
    using the various move instructions presented so far. The other operations take
    special instructions.


