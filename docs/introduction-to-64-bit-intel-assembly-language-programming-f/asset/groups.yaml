    Segmentation fault

    ```


    ## A.6. PRINTING A TRACE OF STACK FRAMES


    A segmentation fault is generally a error in coding where your program tries to
    access memory which it has not mapped into the program. This could be caused by
    going past the end of the array. Here is a sample from running gdb with this program.


    Reading symbols from /home/seyfarth/teaching/asm/testcopy...

    (gdb) run

    Starting program: /home/seyfarth/teaching/asm/testcopy


    ```

    Program received SIGSEGV, Segmentation fault.

    copy_rep () at copy.asm:12

    12      rep      movsb

    (gdb) bt

    #0  copy_rep () at copy.asm:12

    #1  0x000000000040097e in test (argc=<value out>, argv=<value out>) at testcopy.c:27

    #2  main (argc=<value out>, argv=<value out>) at testcopy.c:45

    ```


    Once we get the segmentation fault, immediately we see that the program died in
    the copy_rep function on line 12 of the file. The "bt" command (backtrace) goes
    backwards through the stack frames for function calls. It reports that copy_rep
    was called by the test function which was called from main. The optimization level
    was high enough that the backtrack command could not follow. I recompiled with
    -O3 and got more results:


