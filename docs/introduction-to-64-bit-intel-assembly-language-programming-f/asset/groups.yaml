    # 第 4 章 64 位模式内存内存


    ## 4.2 页映射层级 4 (Page Map Level 4)


    虚拟地址可以拆分为如下字段：


    | 63-48 | 47-39 | 38-30 | 29-21 | 20-12 | 11-0 |

    | --- | --- | --- | --- | --- | --- |

    | 未用 | PML4 索引 | 页指针索引 | 目录索引 | 页表索引 | 页偏移量 |


    在这里我们看到虚拟地址或逻辑地址被拆分为 6 个字段。最高 16 位被忽略，作为第 47 位的符号扩展，但它们不属于地址翻译的一部分。紧随未使用位之后的是四个
    9 位字段，它们将经过翻译，最后是一个 12 位偏移量。翻译过程的结果将是一个类似于 0x7ffff0080000 的物理地址，并结合偏移量（假设偏移量为
    0x1f0，产生物理地址 0x7ffff0081f0）。




    内存页的大小为 $2^{12} = 4096$ 字节，因此 12 位偏移量是有意义的。那些 9 位字段呢？由于地址是 8 字节，所以你可以在一个页中存储 512
    个地址，且 $512=2^9$，因此 9 位字段允许在内存页中存储 4 种映射表中的每一种。


    虚拟地址的第 47-39 位用作 PML4 表的索引。PML4 表本质上是一个包含 512 个指针的数组。这些指针指向内存页，因此每个指针的右侧 12 位可用于其他用途，指示条目是否有效。通常，PML4
    中的并非所有条目都是有效的。


    假设 CR3 物理地址为 0xffff000。假设我们示例地址的第 47-39 位为 0x001，那么我们在内存的 0xffff0000 处有一个数组，我们将访问第二个条目（索引
    1）以获取页目录指针表的地址 - 0x347000。


    | 0xffff0000 处的 PML4 |

    | --- |

    | 0 | 0x346000 |

    | 1 | 0x347000 |

    | 2 | 0x348000 |

    | ... | ... |

    | 511 | 未用 |


    ## 4.3 页目录指针表 (Page Directory Pointer Table)


    内存翻译层级中的下一级是页目录指针表的集合。这些表中的每一个也是包含 512 个指针的数组。这些指针指向页目录表。假设我们的示例地址的第 38-30 位值为
    0x002。那么计算机将获取页目录指针表的第三个条目，引导地址为 0x3588000 的页目录指针表。


    0x3467000 处的页目录指针表

    | | |

    |--- | |

    | 0 | 0x3588000 |

    | 1 | 未用 |

    | 2 | 0x3588000 |

    | ... | ... |

    | 511 | 未用 |


    ## 4.4 页目录表 (Page Directory Table)


    内存翻译层级中的第三级是页目录表的集合。这些表中的每一个也是包含 512 个指针的数组，这些指针指向页表。假设我们的示例地址的第 29-21 位值为 0x000。那么计算机将获取页目录表的第一个条目，引导地址为
    0x3678000 的页目录表。


    0x3588000 处的页目录表

    | | |

    |--- | |

    | 0 | 0x3678000 |

    | 1 | 0x3579000 |

    | 2 | 未用 |

    | ... | ... |

    | 511 | 未用 |


    ## 4.5 页表 (Page Table)


    内存翻译层级中的第四级也是最后的一级是页表的集合。再次，这些表中的每一个都是包含 512 个页指针的数组。假设我们的示例地址的第 20-12 位值为 0xiff。那么计算机将获取页表的最后一个条目，引导至为
    0x5799000 的页。


    | 0x3678000 处的页表 | |

    |---|---|---|

    | 0 | 0x5788000 |

    | 1 | 0x5789000 |

    | 2 | 0x578a000 |

    | ... | ... |

    | 511 | 0x5799000 |


    在使用 4 个表后，我们到达原始引用的内存页地址。然后我们可以加上原始的页偏移量（第 11-0 位），例如 0xfa8。这产生了最终物理地址 0x5799fa8。


    ## 4.6 大页 (Large pages)


    普通页的大小为 4096 字节。CPU 设计者通过使用现有的三级翻译表增加了对大页的支持。通过使用 3 级表，大页的大小为 $2^{21} = 2097152$
    字节。


    ## 4.7 快速查找支持 (Support for Fast Lookups)


    CPU  设计者通过使用现有的三级翻译表增加了对大页的支持。通过使用 3 级表，大页的大小为 $2^{21} = 2097152$ 字节。


    页表查找缓冲区（TLB）是一种用于存储虚拟地址到物理地址映射的缓存。它加速了地址翻译过程，因为 CPU 不需要每次都去内存中访问多级页表。如果在 TLB 中找到了映射（命中），翻译就可以立即完成；如果未找到（未命中），则必须遍历页表来获取映射。


    TLB 的设计取决于 CPU 架构。现代处理器通常使用多级 TLB（如 L1 TLB 和 L2 TLB）来平衡速度和容量。Intel Core 系列的 L1
    TLB 有 64 个条目。Core 2 系列的 L1 TLB 有 256 个条目。Intel i7 的 L1 TLB 有 512 个条目。AMD Athlon
    II 的 L1 TLB 有 1024 个条目。


    # 练习题 (Exercises)


    - 1. 假设你有机会重新设计用于 CPU 的内存映射。大页看起来很小。假设 $2^{17} = 131072$ 字节。一个页中可以容纳多少个64 位指针？寻址需要多少位？你会如何拆分地址字段？

    - 2. 拥有更大的页似乎是理想的。假设我们的示例地址的第 38-30 位值为 0x002。那么计算机将获取页目录指针表的第三个条目，引导地址为 0x3588000
    的页目录指针表。

    '
