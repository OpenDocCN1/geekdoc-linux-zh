    # 11.3. ADDITION


    # 11.2.2 Moving packed data


    There are instructions for loading integer packed data and floating point packed
    data. We will concentrate here on packed floating point data. You can move packed
    floats or doubles. There are instructions for moving aligned or unaligned packed
    data. The aligned instructions are movaps for four floats and movapd for two doubles
    using XMM registers. The unaligned versions are movups and movd. Moving packed
    data to/from YMM registers moves twice as many values.


    Aligned data means that it is on a 16 byte boundary in memory. This can be arranged
    by using align 16 for an array in the bss section does not do the job properly.
    Arrays allocated by malloc will be on 16 byte boundaries. Your program will fail
    with a segmentation fault if you attempt to use an aligned move to an unaligned
    address. Fortunately on the Core i6 series of CPUs the unaligned versions are
    just as fast as the aligned moves when here is a


    ```

    movups xmm0, [x] ; move 4 floats to xmm0

    movups ymm0, [x] ; move 8 floats to ymm0

    movups ymm1, [x] ; move 4 doubles to ymm1

    movd [a], xmm15 ; move 2 doubles to a

    ```


    # 11.3 Addition


    The instructions for adding floating point data come in scalar and packed varieties.
    The scalar add instructions are addss to add two floats and addsd to add two doubles.
    Both these operate on a source and destination operand. The source can be in memory
    or in an XMM register while the destination must be in an XMM register. The integer
    add instruction the floating point add instructions do not set any flags, so testing
    must be done using a comparison.


    The packed add instructions are addps which adds 4 floats from the source to destination
    and addpd which adds 2 doubles from the source to 2 doubles in the destination
    using XMM registers. Like the scalar adds the source can be either memory or an
    XMM register, while the destination must be an XMM register. Using packed with
    YMM registers adds 8 pairs of floats or 4 pairs of doubles.'
