    # CHAPTER 11. FLOATING POINT INSTRUCTIONS


    used as a vector an XMM register can be used as either 4 floats or doubles.


    The i series of computers introduced the Advanced Vector Extensions which doubled
    the size of the floating point registers and add new instructions. To use the
    full 256 bits (8 floats or 4 doubles) you need to use a register name from ymm0,
    ... ymm15. Each XMM register occupies the first 128 bits of the corresponding
    YMM register.


    For most of this chapter discussion refers only to XMM registers. In all cases
    the same instruction can be used with YMM registers to operate on twice as many
    data values. Stating repeatedly would probably be more confusing than accepting
    it as a rule.


    # 11.2 Moving data to/from floating point registers


    The SSE registers are 128 bits on most x86-64 CPUs (256 bits for the AVX registers).
    These registers can be used to do 1 operation at a time or multiple operations
    at a time. There are instructions for moving 1 data value and instructions from
    moving multiple data items, referred to as “packed” data.


    # 11.2.1 Moving scalars


    There are two instructions for moving scalar (1 value) floating point values to/from
    SSE registers: movss moves 32 bit floating point values (floats) and movsd moves
    64 bit floating point values (doubles). These two instructions move a floating
    value from memory to/from the lower part of a XMM register or from one XMM register
    to another. There is no implicit data conversion - after movss 32 bit value exists
    in the destination. Here is a sample:


    ```

    movss xmm0, [x]      ; move value at x into xmm0

    movsd [y], xmm1      ; move value from xmm1 to y

    movss xmm2, xmm0      ; move from xmm0 to xmm2

    ```'
