    # 7.5. SHIFT OPERATIONS


    The x86-64 exclusive-or instruction is named xor. The most common use of xor is
    an idiom for setting a register to 0. This is done because moving 0 into a register
    requires 7 bytes for a 64 bit register, while xor requires 3 bytes. You can get
    the same result using the 32 bit version of the intended register which requires
    only 2 bytes for the instruction. Observe some uses of xor:


    ```

    mov   rax, 0x1234567812345678

    xor   eax,          ; set to 0

    mov   rax, 0x1234

    xor   rax, 0xf         ; change to 0x123b

    ```


    # 7.5 Shift operations


    In the code example for the and instruction divided by 16 to achieve the effect
    of converting 0x12345678 into 0x1234567. This effect could have been obtained
    more simply by shifting the register''s contents to the right 4 bits. Shifting
    is an excellent tool for extracting bit fields and for building values with bit
    fields.


    In the x86-64 architecture there are 4 varieties of shift instructions: shift
    left (shl), shift arithmetic left (sal), shift right (shr), and shift arithmetic
    right (sar). The shl and sal left instructions are actually the same instruction.
    The sar propagates the sign bit into the newly vacated positions on the left which
    preserves the sign of the number, while shr introduces 0 bits from the left.


