    \n最后，你可以使用 gcc 的 `-S` 选项让它生成汇编语言文件。研究这些生成的代码可能会给你关于如何编写高效汇编代码的灵感。\n\n## 16.4 高效利用缓存\n\
    \n高性能计算的目标之一是保持 CPU 的处理单元忙碌。像 Intel Core i7 这样的现代 CPU 运行频率在 3 GHz 左右，而其主内存最大速度约为\
    \ 21 GB/sec。如果你的应用程序严格从内存中的数据和指令运行且不使用缓存，那么每个周期大约只有 7 个字节。CPU 有 4 个核心，需要共享这 21\
    \ GB/sec，因此每个核心每个周期从内存获取的只有约 2 个字节。每个核心都有 3 个处理子单元和 2 个内存处理子单元在处理指令。每个 CPU 每个周期可以执行\
