    mov      ebx, 1       ; file descriptor

    lea      ecx, [hello] ; array to write

    mov      rdx, 13      ; write 13 bytes

    int      0x80

    ```


    # 12.2 64 bit system calls


    The system calls for 64 bit Linux are different integers than for 32 bit Linux
    and are defined in `/usr/include/asm/unistd.64.h`. Again the system calls use
