    # 6.5. DIVISION


    zero flag and sign flags are undefined, so testing for a zero, positive or negative
    result requires an additional operation.


    # 6.5 Division


    Division is different from the other mathematics operations in that it returns
    2 results: a quotient and a remainder. The idiv instruction behaves quite like
    the inverse of the single operand imul instruction in that it uses rdx:rax for
    the dividend.


    The idiv instruction uses a single source operand which can be either a register
    or a memory reference. The unsigned division instruction operates similarly on
    unsigned numbers. The dividend is the two registers rdx and rax holding the most
    significant bits. The quotient is stored in rax and the remainder is stored in
    rdx.


    ```

    mov    rax,          ; x will be the dividend

    mov    rax, 0       ; 0 out rax, so rax:rax == rax

    idiv   [y]          ; divide by y

    mov    [quot], rax ; store the quotient

    mov    [rem], rdx  ; store the remainder

    ```


    The idiv instruction does not set any flags, so testing the results must be done
    separately.


    # 6.6 Conditional move instructions


    There are a collection of conditional move instructions which can be used profitably
    rather than using branching. Branching causes the CPU to perform branch prediction
    which will correct sometimes and incorrect other times. Incorrect predictions
    slow down the CPU dramatically by interrupting the instruction pipeline, so it
    is worthwhile to use conditional move instructions to avoid branching in simple
    cases.


    The conditional move instructions have operands much like the mov instruction.
    There are a variety of them which all have the same 2 operands as the mov, except
    that there is no provision for immediate operands.'
