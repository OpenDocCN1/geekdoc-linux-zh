    \n如果你想实现一个字典，将需要考虑使用哈希表。哈希表查找键的预期时间为 $O(1)$。红黑树保证了预期查找时间为 $O(\\log n)$。然而，如果你除了简单的查找键之外，还需要对键进行有序访问，那么红黑树是一个很好的选择。\n\
