    # 第一章

    ## 引言


    本书介绍了针对 x86-64 架构 CPU（如 Intel Core 处理器和 AMD Athlon 及 Opter 处理器）的汇编语言编程。虽然汇编语言在通用编程中不再被广泛使用，但它仍用于在科学计算和其他需要最高效率的应用中实现核心功能的最大效率化。它还用于执行某些高层语言无法处理的功能。


    本书的目标是教授汇编语言编程的通用原理。目标读者是具有某些高级语言（理想是 C 或 C++）编程经验，但没有接触过汇编语言的人士。


    汇编语言本质上是不具可移植性的，由于免费提供了许多优秀的编译器、汇编器和调试器，本文侧重于为 Linux 操作系统编写代码。在 x86-64 操作系统上的指令是相同的；我们使用相同的调用标准，尽管
    Windows 和 Linux 之间，以及库和 Mac OS/X 之间在调用上存在差异。针对 Windows 系统汇编编程的差异将随着内容的展开进行详细介绍。


    本文的首要目标是学习如何为 C 或 C++ 程序编写函数。这一重点应该让读者对编译器如何实现高级语言有更深入的理解。这种理解在使用高级语言时将产生持久的益处。


    本文的次要目标是介绍读者使用 SSE 和 AVX 指令。


