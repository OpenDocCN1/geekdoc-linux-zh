    \ 15.3 哈希表\n\n哈希表是实现字典的一种高效方法。基本思想是为字典中的每个项的键计算一个哈希值（hash value）。哈希值的目的是将键分散到整个数组中。一个完美的哈希函数会将每个键映射到数组中用于哈希的唯一位置，但这种实现很难实现。相反，我们必须处理发生“冲突”的键。\n\
    \n处理冲突最简单的方法是在哈希数组的每个位置使用链表。请考虑下方的图：\n\n![](img/443639abd490bee82d518502d35b07b9_175_0.png)\n\
    \n在这个哈希表中，键 12、4、16 和 9 的哈希值均为 1，并被放置在哈希数组位置 1 的列表中。键 13 和 8 的哈希值均为 3，并被放置在数组位置\
    \ 3 的列表中。剩余的键被映射到 5 和 7。\n\n哈希的一个关键问题之一是开发良好的哈希函数。哈希函数应该看起来是随机的。每当为某个键调用它时，必须为该键计算相同的值，但哈希值本身并不重要——我们想要的是键到列表的分布，即我们希望许多短列表。这意味着数组的大小至少要与预期键数量一样大。然后，通过良好的哈希函数，链链通常会非常短。\n\
    \n### 15.3.1 适用于整数的良好哈希函数\n\n通常建议哈希表的大小为质数。但是，如果用作键的数字没有底层模式，那么这并不重要。在这种情况下，你可以简单地使用\
    \ `n mod t`，其中 `n` 是键，`t` 是数组大小。如果存在某种模式（例如许多相同数的倍数），那么使用质数作为 `t` 就很有意义。以下是示例代码的哈希函数：\n\
    \n```\ni = hash ( n )\nmov rax, rdi\nand rax, 0xff\nret\n```\n\n示例中的表大小为 256，因此使用\
    \ `and` 相当于 `n mod 256`。\n\n### 15.3.2 适用于字符串的良好哈希函数\n\n字符串的良好哈希函数是将字符串视为包含多项式系数，并对某个质数\
    \ `n` 计算 `p(n)`。在下面的代码中，我们在评估中使用质数 191。在计算多项式值后，你可以使用表大小（示例代码中为 100000）执行模运算。\n\
    \n```\nint hash ( unsigned char *s )\n{\n  unsigned long h = 0;\n  int i = 0;\n\
    \n  while ( s[i] ) {\n    h = h*191 + s[i];\n    i++;\n  }\n  return h % 100000;\n\
    }\n```\n\n### 15.3.3 哈希表节点结构和数组\n\n在示例哈希表中，表大小为 256，因此程序启动时我们需要一个包含 256 个 NULL\
    \ 指针的数组。由于这很小，它被实现在数据段中。对于更真实的程序，我们需要一个哈希表创建函数来分配数组并用 0 填充它。下面是数组的描述以及每个数组位置链表的结构定义。\n\
    \n```\nsegment .data 0\ntable times 256 dq\nstruct node\nn_value resq 1\nn_next\
    \ resq 1\nnalign 8\nendstruct\n```\n\n### 15.3.4 在哈希表中查找值的函数\n\n哈希表的根本目的是存储与键关联的某些数据。在示例哈希表中，我们简单地存储了键。`find`\
    \ 函数遍历哈希表以查找键。如果找到了，函数返回指向带有键的节点的指针。如果没找到，它返回 0。更真实的程序可能会返回指向与键关联的数据的指针。\n\n`find`\
    \ 函数的工作原理是调用 `hash` 来计算可能持有所求键的链表在哈希数组中的索引。然后，函数遍历列表上的节点以查找键。\n\n```\n; p = find\
    \ ( n );\np = 0 if not found\nfind:\n.n equ 0\npush rbp\nmov rbp, rsp\nsub rsp\
    \ 16\nmov [rsp+.n], rdi\ncall hash\nmov      rax, [table+rax*8]\nmov      rdi,\
