    \ use a conditional move to set the number of hours over 1000 to 0 if the number\
    \ of hours over 1000 is negative. Move the number of dollars into one memory location\
    \ and the number of pennies into another.\n\n## Chapter 7\n\n## Bit operations\n\
    \nA computer is a machine to process bits. So far we have discussed using bits\
    \ to represent numbers. In this chapter we will learn about a handful of computer\
    \ instructions which operate on bits without any implied meaning for the bits\
    \ like signed or unsigned integers.\n\nIndividual bits have the values 0 and 1\
    \ and are frequently interpreted as false for 0 and true for 1. Individual bits\
    \ could have other interpretations. A bit might mean male or female or any assignment\
    \ of an entity to one of 2 mutually exclusive sets. A bit could represent an individual\
    \ cell in Conway's game of Life.\n\nSometimes data occurs as numbers with limited\
    \ range. Suppose you need to process billions of numbers in the range of 0 to\
    \ 15. Then each number could be stored in 4 bits. Is it worth the trouble to store\
    \ your numbers in 4 bits when 8 bits are readily available in a language like\
    \ C++? Perhaps not if you have access to a machine with sufficient memory. It\
    \ might still be nice to store the numbers on disk in half the space. So you might\
    \ need to operate on bit fields.\n\n## 7.1 Not operation\n\nThe not operation\
    \ is a unary operation, meaning that it has only 1 operand. The everyday interpretation\
    \ of not is not the opposite of a logical statement. In assembly language we apply\
    \ to all the bits of a word. C has two version of not, \"!\" and \"~\". '!' is\
    \ used for the opposite of true or false, while “~” applies to all the bits of\
    \ a word. It is common to distinguish the two not by referring to “!” as the “logical”\
