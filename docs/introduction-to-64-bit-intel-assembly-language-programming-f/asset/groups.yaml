    leave\nret\n```\n\n### 15.1.4 遍历列表\n\n遍历列表需要使用指令\n\n```asm\nmov rbx, [rbx+n_next]\n\
    ```\n\n从一个节点的指针移动到下一个节点。我们首先检查指针看它是否为 `NULL`。如果不是，则进入循环。处理完一个节点后，我们移动指针，如果指针不为\
    \ `NULL` 则重复循环。下面的 `print` 函数遍历列表并打印每个数据项。代码展示了为什么在调用中保护几个寄存器是很好的。我们依赖 `printf`\
