    ## 1.3 Machine language


    Each type of computer has a collection of instructions it can execute. These instructions
    are stored in memory and fetched, interpreted and executed during the execution
    of a program. The sequence of bytes (like the previous 12 byte program) is called
    a "machine language" program. It would be quite painful to use machine language.
    You would have to enter the correct bytes for each instruction of your program.
    You would have to know the addresses of all data used in your program. A more
    realistic program would have branching instructions. The address to branch depends
    on where the computer loads your program into memory when it is executed. Furthermore
    the address to branch can change when you add, delete or change instructions in
    your program.


    The very first computers were programmed in machine language, but


    ## CHAPTER 1. INTRODUCTION


    people soon figured out ways to make the task easier. The first improvement is
    to use words like mov to indicate the selection of a particular instruction. In
    addition people started using symbolic names to represent addresses of instructions
    and data in a program. Using symbolic names prevents the need to calculate addresses
    and isolates the programmer from changes in the source code.


    ## 1.4 Assembly language


    Very early in the history of computing (1950s), programmers developed symbolic
    assembly languages. This rapidly replaced the use of machine language, eliminating
    a lot of tedious work. Machine languages are considered "first-generation" programming
    languages, while assembly languages are considered "second-generation".


    Many programs continued to be written in assembly language after the invention
    of Fortran and Cobol ("third-generation" languages) in the late 1950s. In particular
    operating systems were typically nearly 100% assembly until the creation of C
    as the primary language for the UNIX operating system.


    The source code for the 12 byte program from earlier is listed below:


    ```

    Program: exit

    ;

    Executes the exit system call

    ;

    No input

    ;

    Output: only the exit status ($? in the shell)

    ;

    segment .text

    ```


    ```

    _start:

    mov eax,1      ; 1 is the exit syscall number

    mov ebx,5      ; the status value to return

    int 0x80      ; execute a system call

    ```


    ## 1.4. ASSEMBLY LANGUAGE


    You will observe the use of ";" to signal the start of comments in this program.
    Some of the comments are stand-alone comments and others are end-of-line comments.
    It is fairly common to place end-of-line comments on each assembly instruction.


    Lines of assembly code consist of labels and instructions. A label usually starts
    in column 1, but this is not required. A label establishes a symbolic name to
    the current point in the assembler. A label on a line by itself must have a colon
    after it, while the colon is optional if there is more to the line.


    Instructions can be machine instructions, macros or instructions to the assembler.
    Instructions are usually placed further right than column 1. Most people establish
    a pattern of starting all instructions in the same column.


    The statement .segment .text is an instruction to the assembler itself rather
    than a machine instruction. This statement indicates that the data or instructions
    following it are to be placed in the .text segment or section. In Linux this is
    where the instructions of a program are located.


    The statement .global _start is another instruction to the assembler, called an
    assembler directive or a pseudo opcode (pseudo-op). This pseudo-op informs the
    assembler that the label _start is to be made known to the linker program when
    the program is linked. The _start function is the most basic "entry point" for
    a Linux program. When the system runs a program it transfers control to the _start
    function. A typical C program has a main function which is called indirectly via
    a _start function in the C library.


    The line beginning with _start is a label. Since no code has been generated up
    to this point, the label refers to location 0 of the program’s text segment.


    The remaining 3 lines are symbolic opcodes representing the 3 executable instructions
    in the program. The first instruction moves the constant 1 into register eax while
    the second moves the constant 5 into register ebx. The final instruction generates
    a software interrupt numbered 0x80 which is the way Linux handles 32 bit system
    calls. (This code works on both 32 bit and 64 bit Linux systems.)


    ## 1.5 Assembling and linking


    We use the yasm assembler to produce an object file from an assembly source code
    file:


    ```

    yasm -f elf64 -g dwarf2 -l exit.lst exit.asm

    ```


    The yasm assembler is modeled after the nasm assembler. yasm produces object code
    which works properly with the gdb and ddd debuggers, while nasm did not produce
    acceptable code for debugging during testing. The -f elf64 option selects a 64
    bit output format which is compatible with Linux. The -g dwarf2 option selects
    the dwarf2 debugging format, which is essential for use with a debugger. The -l
    exit.lst asks for a listing file which shows the generated code in hexadecimal.


    The yasm command produces an object file named exit.o, which contains the generated
    instructions and data in a form ready to link with other code from other object
    files or libraries. In the case of an assembly program with the _start function
    the linking needs to be done with ld:


    ```

    ld -o exit.o

    ```


    The -o exit option gives a name to the executable file produced by ld. Without
    that option, ld produces a file named a.out. If the assembly program defines main
    rather than _start, then the linking needs to be done with gcc:


    ```

    gcc -o exit

    ```


    In this case gcc will incorporate _start and call main (or _start).


    You can execute the program using:


    ```

    ./exit

    ```


