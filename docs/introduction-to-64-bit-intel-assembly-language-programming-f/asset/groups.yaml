  mdcn: "\n\n# Linux 下 64 位 Intel 汇编语言编程入门\n\nRay SEYFARTH\n\n![](img/443639abd490bee82d518502d35b07b9_0_0.png)\n\
    \n# Linux 下 64 位 Intel 汇编语言编程入门\n\nRay Seyfarth\n\n2011年10月27日\n\nRay Seyfarth\n\
    密西西西州立大学计算学院\nHattiesburg, MS 39406\nUSA\n\nSeyfarth, Ray\n64 位 Intel 汇编语言编程入门\n\
    包含索引。\nISBN-13: 978-1466470033\nISBN-10: 1466470038\n\n©2011 Ray Seyfarth\n版权所有。未经版权持有人的书面许可，不得对本书进行全部或部分的翻译或复制，但用于评论或学术分析相关的简短摘录除外。\n\
    \n# 前言\n\nIntel CPU 架构在 30 年间经历了演变：从没有内存保护的 16 位 CPU，到具有复杂架构的 32 位处理器，再到目前的系列处理器，后者在支持所有旧操作模式的基础上，还支持大幅扩展的\
    \ 64 位操作模式。汇编教材倾向于关注历史，并通常以讨论 32 位模式结束。学生们被介绍了通过段寄存器访问 1MB 内部内存的 16 位 CPU 概念。这对于现在来说是不必要的偏离。\n\
    \nx86-64 架构几乎与过去完全脱节。段寄存器基本上过时了，寄存器使用完全是通用的。\n\n现在有 16 个通用整数寄存器，并有少数特殊指令。8087\
    \ 古老的寄存器栈被组织良好的模型取代，该模型提供了 16 个浮点寄存器以及用于 SSE 和 AVX 扩展的浮点指令。事实上，AVX 扩展甚至允许三操作数语法，这可以进一步简化编码。\n\
    \n总的来说，x86-64 汇编编程比其前身更简单。在几年内，主操作模式将变为 64 位。这些趋势共同表明，是时候教授 64 位汇编语言了。\n\n本书的重点是早期上手\
    \ 64 位汇编编程。书中不涉及 16 位或 32 位编程，对历史的讨论集中在解释旧寄存器名称的起源以及指令集中少数非正交特征上。\n\n目的是让学生从一开始就使用\
    \ `yasm` 汇编器和 `gdb` 调试器。从第一章就有使用计算机的作业。此时并不是每个语句都能完全理解，但完成作业是可以的。\n\n本书的主要目标是汇编语言初学者，为了对汇编编程进行入门介绍，学生应该学习第\
    \ 1, 2, 3, 5, 6, 7, 8, 9, 10 和 11 章。第 4 章关于内存映射对书的其他部分至关重要，如果需要可以跳过。\n\n第 12 到\
    \ 15 章深度要深得多。第 15 章关于汇编中的数据结构，是学习 C/C++ 数据结构的极佳补充。在接触过汇编语言后，该主题将变得清晰得多。\n\n作者在\
    \ http://rayseyfarth.com/asm 提供了课堂教学使用的 PDF 幻灯片、示例代码和勘误。\n\n如果你在书中发现错误或有改进建议，请通过\
    \ ray.seyfarth@gmail.com 邮件给作者。\n\n感谢购买本书，我希望你在里面发现有趣且有价值的内容。\n\n# 致谢\n\n任何书都不是孤立完成的。本书也非例外。我感谢众多来源为本书提供的信息和帮助。\n\
    \n作者使用了 Paul Carter 博士的 PC 汇编语言书籍来学习 32 位汇编编程。他的书是一个可以从网站下载的免费 PDF 文件。这是一本 195\
    \ 页的书，涵盖了汇编语言的基础，是学习 32 位汇编语言的绝佳开始。\n\n在编写期间，我发现了卡内基梅隆大学 Bryant 和 O'Hallaron 博士的一篇论文，讨论了\
    \ gcc 如何利用 x86-64 架构的特性产生高效代码。他们的某些观察帮助我理解了 CPU，有助于编写更好的汇编代码。对效率感兴趣的程序员应该研究他们的工作。\n\
    \n我发现 Intel 手册是一项无价的资源。它们提供了 CPU 所有指令的细节。遗憾的是，文档将 32 位和 64 位指令混合在一起，再加上海量的指令，使得很难通过这些手册学习汇编编程。我希望阅读本书能成为良好的起点，但短小的书籍无法涵盖许多指令。我选择了我认为对通用用途最重要的指令，但编写汇编器将需要研究\
    \ Intel 手册（或 AMD 的同等手册）。\n\n感谢我的朋友 Maggie 和 Tim Hampton 为本书编辑做出的贡献。\n\n我感谢密西西比州立大学的\
    \ CSC 203 - 汇编语言课程对本书做出的贡献。\n\nvi \n\n教授 64 位汇编语言发现了 2011 年 7 月发布的原版 *Create Space*\
    \ 书中的一些错误和疏忽。特别地，感谢 Chris Greene、Evan Stuart 和 Brandon Wolfe 找出了书中的错误。\n\n最后，感谢我的妻子\
    \ Phyllis 和我的儿子 David 和 Adam 的鼓励与帮助。Phyllis 和 Adam 负责本书以及 *Create Space* 书的设计。\n\
