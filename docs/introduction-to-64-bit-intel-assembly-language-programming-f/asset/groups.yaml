    \ 19\n\n## Computing Correlation\n\nThe final example of optimization is computing\
    \ the correlation between two variables $x$ and $y$ given $n$ sample values. One\
    \ way to compute correlation is using:\n\n$$r_{xy} = \\frac{\\sum_{i=1}^{n}(x_{i}-\\\
    bar{x})(y_{i}-\\bar{y})}{\\sqrt{\\sum_{i=1}^{n}(x_{i}-\\bar{x})^2 \\sum_{i=1}^{n}(y_{i}-\\\
    bar{y})^2}}$$\n\nActually the simplified version used is:\n$$r_{xy} = \\frac{\\\
    sum (x_i-\\bar{x})(y_i-\\bar{y})}{\\sqrt{\\sum (x_i-\\bar{x})^2 \\sum (y_i-\\\
    bar{y})^2}}$$\n\nThe implementation in C would look like:\n\n```c\n#include <math.h>\n\
    \ndouble corr(double x[], double y[], int n) {\n    double sum_x = 0, sum_y =\
    \ 0, sum_xy = 0, sum_xx = 0, sum_yy = 0;\n    for (int i = 0; i < n; i++) {\n\
    \        sum_x += x[i];\n        sum_y += y[i];\n    }\n    double mean_x = sum_x\
    \ / n;\n    double mean_y = sum_y / n;\n    for (int i = 0; i < n; i++) {\n  \
    \      sum_xy += (x[i] - mean_x) * (y[i] - mean_y);\n        sum_xx += (x[i] -\
    \ mean_x) * (x[i] - mean_x);\n        sum_yy += (y[i] - mean_y) * (y[i] - mean_y);\n\
    \    }\n    return sum_xy / sqrt(sum_xx * sum_yy);\n}\n```\n\nThe assembly version\
    \ uses SSE instructions to process multiple sums in parallel, significantly improving\
    \ performance over the naive loop.\n"
