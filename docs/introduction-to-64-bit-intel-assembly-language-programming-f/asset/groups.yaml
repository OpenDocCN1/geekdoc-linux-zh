    # 18.2 Sobel computed using SSE instructions


    Sobel was chosen as a good example of an algorithm which manipulates data of many
    types. First the image data is byte data. The movdq instruction was used to transfer
    16 adjacent pixels from one row of the image. These pixels were processed to produce
    the contribution of their central 14 pixels to $G_x$ and $G_y$. Then 16 pixels
    were transferred from the image one row down from the first 16 pixels. These pixels
    were processed in the same way adding more to $G_x$ and $G_y$. Finally 16 more
    pixels rows down from the first 16 were transferred and their contributions to
    $G_x$ and $G_y$ were computed. Then these contributions were combined, squared,
    added together, converted to 32 bit floating point and square roots were computed
    for the 14 output pixels which were placed in the output array.


    Tested on the same Core i7 computer, this code produced 1063 Sobel magnitude images
    per second. With 1000 different images this code produced 980 images per second,
    which is about 6.2 times as fast as the C version.


    Here are the new instructions used in this code:


    pxor This instruction performs an exclusive or on a 128 XMM source register and
    stores the result in the destination register.


    movdqa This instruction moves 128 bits of aligned data from memory to a register,
    from a register to memory, or from a register to a register.


    movdqu This instruction moves 128 bits of unaligned data from memory to a register,
    from a register to memory, or from a register to a register.


    psrldq This instruction shifts the destination XMM register right the number of
    bytes specified in the second immediate operand.


    puncklbw This instruction unpacks the low 8 bytes of 2 XMM registers and intermingles
    them. I used this with the second register holding all 0 bytes to form 8 words
    in the destination.


    punckkhb This instruction unpacks the upper 8 bytes of 2 XMM registers and intermingles
    them.'
  - "[PAGE 215]\n\npaddw This instruction adds 8 16 bit integers from the second operand\
    \ to the first operand. At least one of the operands must be an XMM register and\
    \ one can be a memory field.\n\npsubw This instruction subtracts the second set\
    \ of 8 16 bit integers from the first set.\n\npmulw This instruction multiplies\
    \ the first set of 8 16 bit integers times the second set and stores the low order\
    \ 16 bits of the products in the first operand.\n\npunpckwd This instruction unpacks\
    \ and interleaves words from the lower halves of 2 XMM registers into the destination\
    \ register.\n\npunpeckd This instruction unpacks and interleaves words from the\
    \ upper halves of 2 XMM registers into the destination register.\n\ncvtd2ps This\
    \ instruction converts 4 double word integers into 4 double floating point values.\n\
    \nHere is the assembly code:\n\n```\n%macro multipush 1-* ; I needed to push and\
    \ pop all callee\n%rep %0          ; save registers, so I used macros\n    push\
    \    %1      ; from the yasm documentation.\n    %rotate 1\n%endrep\n%endmacro\n\
    ```\n\n```\n%macro multipop 1-*\n%rep %0\n    %rotate -1\n    pop     %1\n%endrep\n\
    %endmacro\n```\n\n```\n; sobel ( input, output, rows, cols );\n; char input[rows][cols];\n\
    ; float output[rows][cols];\n```"
