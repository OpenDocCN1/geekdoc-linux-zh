    \ an assembly \"program\" (data only) using dw and dd for all numbers in exercises\
    \ 1-4.\n\n# Chapter 3 Computer memory\n\nIn this chapter we will discuss how a\
    \ modern computer performs memory mapping to give each process a protected address\
    \ and how the Linux system manages the memory for a process. A practical benefit\
    \ of this chapter is to examine memory using the gdb debugger.\n\n## 3.1 Memory\
    \ mapping\n\nThe memory of a computer can be considered an array of bytes. Each\
    \ byte of memory has an address. The first byte is at address 0, the second byte\
    \ at address 1, and so on until the last byte of the computer's memory. In modern\
    \ CPUs there are hardware mapping registers which are used to give each process\
    \ a protected address space. This means that multiple people can run a program\
    \ which starts at address 0x004c8 at the same time. These processes perceive the\
    \ same \"logical\" addresses, while they are using memory at different \"physical\"\
    \ addresses. The hardware mapping registers on an x86-64 CPU can map pages of\
    \ two different sizes - 4096 bytes and 2 megabytes. Linux uses 2 MB pages for\
    \ the kernel and 4 KB pages for most others. In some of the more recent CPUs there\
    \ is also support for 1 GB pages. The operation of the memory system is to translate\
    \ the upper bits of the address from a process's logical address to a physical\
    \ address. Let's consider only 4 KB pages. Then an address is translated based\
    \ on page number and the address within the page. Suppose a reference is made\
    \ to logical address 0x40000220. Since 4096 = 2¹², the offset within the page\
    \ is the rightmost 12 bits (0x220). The page number is the rest of the bits (0xC4000000).\
    \ A hardware register (or multiple registers) translates this page number to a\
    \ physical page address, let's say 0x78000000. The two addresses are combined\
    \ to get the physical address 0x780000220.\n\nAmazingly the CPU generally performs\
    \ the translations without slowing down this benefits the users in several ways.\
    \ The most obvious benefit is memory protection. User processes are limited to\
    \ reading and writing only their own pages. This means that the operating system\
    \ is protected from malicious or poorly coded user programs. Also each user process\
    \ is protected from other user processes. In addition to protection from writing,\
    \ users can't read others' data. There are instructions used by the operating\
    \ system to manage the hardware mapping registers. These instructions are not\
    \ discussed in this book. Our focus is on programming user processes.\n\nSo why\
    \ bother to discuss paging, if we are not discussing the instructions to manage\
    \ paging? Primarily this improves one's understanding of the computer. When you\
    \ write software which accesses data beyond the end of an array, you sometimes\
    \ get a segmentation fault. However you only get a segmentation fault when your\
    \ logical address reaches far past the end of the array to cause the CPU to reference\
    \ a page entry which is not mapped into your process.\n\n## 3.2 Process memory\
    \ model in Linux\n\nIn Linux memory for a process is divided into 4 logical regions:\
    \ text, data, heap and stack. The stack is mapped to the highest address of a\
    \ process and on x86-64 Linux this is 0x7ffffffffff or 131 TB. This address is\
    \ selected on the maximum number of bits allowed in logical addresses being 48\
    \ bits. This address is 47 bits of all 1 bits. The decision was not to use 48,\
    \ since canonical addresses have to extend 48 through bits 49-63.\n\nIn figure\
    \ 3.1 we see the arrangement of the various memory segments. At the lowest address\
    \ we have the text segment (.text for yasm). This segment is shown starting at\
    \ 0, though both _start and main are at higher addresses. It appears that the\
    \ lowest address in an x86-64 process is 0x040000. The text segment does not need\
    \ to grow, so the data segment is placed immediately above the text segment. Above\
    \ these two segments are the heap and stack segments.\n\nThe data segment starts\
    \ with the .data segment which contains initialized data. Above that is the .bss\
    \ segment which stands for \"block started by symbol\". The .bss segment contains\
    \ data which is statically allocated in a process, but is not stored in the executable\
    \ file. Instead this data is allocated when the process is loaded into memory.\
    \ The initial contents of the .bss segment are all 0 bits.\n\nThe heap is not\
    \ really a heap in the sense discussed in data structures course. Instead is a\
    \ dynamically resizable region of memory which is used to allocate memory to a\
    \ process through functions like malloc and the new operator in C++. In x86-64\
    \ Linux this region can grow to very large sizes. The limit is imposed by the\
    \ sum of physical memory and swap space.\n\nThe final segment of a process is\
    \ the stack segment. This segment is restricted by size by the Linux kernel, typically\
    \ to 16 megabytes. This is not a large amount of space, but as long as the programmer\
    \ avoids putting large arrays on the stack it serves the purpose well of managing\
    \ the run-time stack tracking of function calls, parameters, local variables and\
    \ return addresses.\n\nGiven the top of the stack as 0xffffffff limited to 16\
    \ megabytes we see the lowest valid stack address is 0x7ffff0000. The stack automatically\
    \ grows when needed by the operating system responding to a page fault. The operating\
    \ system recognizes the halting address as being in the range from 0x7ffff0000\
    \ to 0xffffffff, which is only used for the stack and allocates a new page of\
    \ memory (4096 bytes) to the process.\n\n| stack | 13TB |\n| heap | |\n| data\
    \ | |\n| text | 0 |\n\n> Figure 3.1: Process memory layout\n"
