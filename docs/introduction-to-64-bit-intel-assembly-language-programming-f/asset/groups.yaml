    # CHAPTER 6. A LITTLE BIT OF MATH


    # 6.2 Addition


    Integer addition is performed using the add instruction. This instruction has
    2 operands: a destination and a source. It adds the contents of the source and
    the destination and stores the result in the destination.


    The source operand can be an immediate value (constant) of 32 bits, a memory reference
    or a register. The destination can be either a memory reference or a register.
    Only one of the operands can be a memory reference.


    The add instruction sets or clears several flags in the rflags register. These
    flags can be used in conditional statements following the add. The overflow flag
    (OF) is set if the addition overflows. The sign flag (SF) is set to the sign bit
    of the result. The zero flag (ZF) is set if the result is 0. Some other flags
    are related to performing binary-coded-decimal arithmetic.


    There is no special add for signed numbers versus unsigned numbers since the operations
    are the same. There are special signed and unsigned instructions for division
    and multiplication.


    There is a special increment instruction (inc), which can be used to add 1 to
    a register or a memory location. Here is a sample program with some add instructions.


    ```

    segment .data

    dq a 151

    dq b 310

    dq sum 0

    segment .text

    global main

    ```


    ```

    main:

    push rbp

    mov rbp, rsp

    sub rsp, 16

    mov rax, 9 ; set rax to 9

    add [a], rax ; add rax to a

    mov rax, [b] ; get b into rax

    add rax, 10 ; add 10 to rax

    add rax, [a] ; add the contents of a

    mov [sum], rax ; save the sum in sum

    ```'
