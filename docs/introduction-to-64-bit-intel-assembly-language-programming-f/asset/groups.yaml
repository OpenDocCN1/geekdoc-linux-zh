    ```\n\n## 15.3 Hash tables\n\nA hash table is an efficient way to implement a\
    \ dictionary. The basic idea is that you compute a hash value for the key for\
    \ each item in the dictionary. The purpose of the hash value is to spread the\
    \ keys throughout an array. A perfect hash function would map each key to a unique\
    \ location in the array used for hashing, but this is difficult to achieve. Instead\
    \ we must cope with keys with which “collide”.\n\nThe simplest way to cope with\
    \ collisions is to use a linked list for each location in the hash array. Consider\
    \ the illustration below:\n\n![](img/443639abd490bee82d518502d35b07b9_175_0.png)\n\
    \nIn this hash table, keys 12, 4, 16 and 9 all have hash values of 1 and are placed\
    \ on the list in location 1 of the hash array. Keys 13 and 8 both have hash values\
    \ of 3 and are placed on the list in location 3 of the array.\nThe remaining keys\
    \ are mapped to 5 and 7.\n\nOne of the critical issues with hashing is to develop\
    \ a good hashing function. A hashing function should appear almost random. It\
    \ must compute the same value for a particular key each time it is called for\
    \ the key, but the hash values aren't really important - it's the distribution\
    \ of keys onto lists that we want a lot of short lists. This means that the array\
    \ size should be at least as large as the number of keys expected. Then, with\
    \ a good hash function, the chains will generally be quite short.\n\n### 15.3.1\
    \ A good hash function for integers\n\nIt is generally recommended that a hash\
    \ table size be a prime number. However this is not very important if there is\
    \ no underlying pattern to the numbers used as keys. In that case you can simply\
    \ use n mod t where n is the key and t is the array size. If there is a pattern\
    \ like many multiples of the same number, then using a prime number for t makes\
    \ sense. Here is the hash function for the example code:\n\n```\ni = hash ( n\
    \ )\nmov rax, rdi\nand rax, 0xff\nret\n```\n\nThe table size is 256 in the example,\
    \ so using and gives n mod 256.\n\n### 15.3.2 A good hash function for strings\n\
    \nA good hash function for strings is to treat the string as containing polynomial\
    \ coefficients and evaluate p(n) for some prime number n. In the code below we\
    \ use the prime number 191 in the evaluation. After evaluating the polynomial\
    \ value, you can perform a modulus operation using the table size (100000 in the\
    \ sample code).\n\n```\nint hash ( unsigned char *s )\n{\n  unsigned long h =\
    \ 0;\n  int i = 0;\n\n  while ( s[i] ) {\n    h = h*191 + s[i];\n    i++;\n  }\n\
    \  return h % 100000;\n}\n```\n\n### 15.3.3 Hash table node structure and array\n\
    \nIn the sample hash table the table size is 256, so we need an array of 256 NULL\
    \ pointers when the program starts. Since this is quite small, it is implemented\
    \ in the data segment. For a more realistic program, we would need a hash table\
    \ creation function to allocate an array and fill it with 0's. Below is the description\
    \ of the array and the structure definition for the linked lists at each array\
    \ location.\n\n```\nsegment .data 0\ntable times 256 dq\nstruct node\nn_value\
    \ resq 1\nn_next resq 1\nnalign 8\nendstruct\n```\n\n### 15.3.4 Function to find\
    \ a value in the hash table\n\nThe basic purpose of a hash table is to store some\
    \ data associated with a key. In the sample hash table we are simply storing the\
    \ key. The find function searches through the hash table looking for a key. If\
    \ it is found, the function returns a pointer to the node with the key. If it\
    \ is not found, it returns 0. A more realistic program would probably return a\
    \ pointer to the data associated with the key.\n\nThe find function operates by\
    \ calling hash to compute the index in the hash array for the linked list which\
    \ might hold the key sought. Then the function loops through the nodes on the\
    \ list looking for the key.\n\n```\n; p = find ( n );\np = 0 if not found\nfind:\n\
    .n equ 0\npush rbp\nmov rbp, rsp\nsub rsp 16\nmov [rsp+.n], rdi\ncall hash\nmov\
    \      rax, [table+rax*8]\nmov      rdi, [rsp+.n]\ncmp      rax, 0\nje       .done\n\
    .more cmp rdi, [rax+n_value]\n      je       .done\nmov      rax, [rax+n_next]\n\
    cmp      rax, 0\njne       .more\n.done leave\n      ret\n```\n\n### 15.3.5 Insertion\
    \ code\n\nThe code to insert a key into the hash table begins by calling find\
    \ to avoid inserting the key more than once. If the key is found it skips the\
    \ insertion code. If the key is not found, the function calls hash to determine\
