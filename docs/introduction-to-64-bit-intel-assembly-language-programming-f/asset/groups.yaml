  - '[PAGE 108]


    # 9.5. STACK FRAMES


    backtrace). To perform this trick each function must keep a pointer in a 2 quad-word
    object on the stack identifying the previous value of rbp along with the return
    address. You might notice the sequence “push rbp, mov rbp, rsp” in the hello world
    program. The first instruction pushes rbp immediately below the return address.
    The second instruction makes rbp point to that object.


    Assuming all functions obey this rule of starting with the standard 2 instructions,
    there will be a linked list of objects on the stack - one for each function. The
    debugger can traverse through the list to identify the function (based on the
    location of the return address) called and use other information stored in the
    executable to identify the line number for this return address.


    These 2 quad-word objects are simple examples of “stack frames”. In functions
    which do not call other functions (leaf functions), the local variables for the
    function might all fit in registers. If there are too many local variables or
    if the function calls other functions, then there might need to be some space
    on the stack for these local variables. To allocate space for the local variables,
    you simply subtract from rsp. For example leave 32 bytes for local variables in
    the stack frame do:


    ```

    push    rbp

    mov     rbp, rsp

    sub     rsp, 32

    ```


    Be sure to subtract a multiple of 16 bytes to avoid possible problems with stack
    alignment.

    To establish a stack frame, you use the following 2 instructions at the start
    of a function:


    ```

    push    rbp

    mov     rbp, rsp

    ```


    The effect of these 2 instructions and a possible subtraction from rsp can be
    undone using


    ```

    leave

    ```


    just before a ret instruction. For a leaf function there is no need to do the
    standard 2 instruction prologue and no need for the leave instruction.'
  - '[PAGE 109]


    # CHAPTER 9. FUNCTIONS


    They can also be omitted in general though it will prevent gdb from being able
    to trace backwards though the stack frames.


    When you have local variables in the stack frame it makes sense to access these
    variables using names rather than adding 8 or 16 to rsp. This can be done by using
    yasm''s equ pseudo-op. The following sets up symbolic names for 0 and 8 for two
    local variables.


    +   x equ 0

    yy equ 8


    Now we can easily save 2 registers in x and y prior to a function calling


    ```

    mov [rsp+x], r8

    mov [rsp+y], r9

    ```


    With any function protocol you must specify which registers must be preserved
    in a function. For the System V ABI, registers rbx, rbp and r12-15 must be preserved,
    while the Windows calling convention requires registers rbx, rbp, rsi, rdi and
    r12-15 must be preserved.


    # 9.6 Recursion


    One of the fundamental problem solving techniques in computer programming is recursion.
    A recursive function is a function which calls itself. The focus of recursion
    is to break a problem into smaller problems. Frequently these smaller problems
    can be solved by the same function. You break the problem into smaller problems
    repeatedly and eventually you reach such a small problem that it is easy to solve.
    The easy to solve problem is called a "base case". Recursive functions typically
    start by testing to see if you have reached the base case or not. If you have
    not reached the base case, then you prepare the easy solution. into subproblems
    and make recursive calls. As you return from recursive calls you assemble solutions
    to larger problems from smaller problems.


    Recursive functions generally require stack frames with local variable storage
    for each stack frame. Using the complete stack frame protocol can help in debugging.'
