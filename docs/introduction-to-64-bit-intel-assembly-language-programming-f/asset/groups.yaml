    # # Chapter 10


    # ## Arrays


    An array is a contiguous collection of memory cells of a specific type. This means
    that an array has a start address. The start address is the lowest address in
    the array and is identified by the label used when defining array in the text
    or bss segment.


    Elements of the array are accessed by index with the smallest index being 0 as
    in C. Subsequent indices access higher memory addresses. The final index of an
    array of size n is n-1.


    It would be possible to define arrays with different starting indices. In fact
    the default for Fortran is for arrays to start at index 1 and you can define the
    range of indices in many high level languages. However it is quite natural to
    use 0 as the first index for arrays. The assembly code is simpler in this way
    which helps with efficiency in C and C++.


    # ### 10.1 Array address computation


    There can be arrays of many types of data. These include the basic types: bytes,
    words, double words, and quad-words. We can also have arrays of structs (defined
    later).


    Array elements are bytes of a specific type so each element occupies the same
    number of bytes of memory. This makes it simple to compute the location of any
    array element. Suppose that the array a with base address base m bytes per element,
    then element a[i] is located at base + i*m.'
