    ## 系统调用


    系统调用本质上是一种函数调用，它将 CPU 切换到内核模式并执行内核一部分的函数。当你在 Linux 上运行进程时，它在用户模式下运行，这意味着它被限制只能执行“安全”指令。它可以在程序内部移动数据、进行算术运算、分支、调用函数等，但有些指令是程序无法直接执行的。例如，允许任何程序直接读写磁盘设备是不安全的，因此通过防止用户程序执行输入或输出指令来防止这一点。另一个被禁止的操作是直接设置页映射寄存器。


    当用户程序需要执行打开文件等操作时，它会发出系统调用。这会将 CPU 的操作模式切换到内核模式，在内核模式下 CPU 可以执行输入输出指令。内核的 `open`
    函数将验证用户程序是否有权限打开该文件，然后打开它，代表程序执行任何所需的输入或输出指令。


    Linux 系统调用接口在 32 位模式和 64 位模式下是不同的。在 64 位 Linux 下，32 位接口仍然可用，以支持 32 位应用程序，并且这在某种程度上对
    64 位程序也有效。


