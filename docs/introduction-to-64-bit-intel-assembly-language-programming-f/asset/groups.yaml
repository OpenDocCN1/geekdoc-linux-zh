    # Chapter 12


    ## System calls


    A system call is essentially a function call which changes the CPU into kernel
    mode and executes a function which is part of the kernel. When you run a process
    on Linux it runs in user mode which means that it is limited to executing only
    “safe” instructions. It can move data within the program, do arithmetic, branching,
    call functions, ..., but there are instructions your program can''t do directly.
    For example it would be unsafe to allow any program to read or write directly
    to the disk device, so this is prevented by preventing user programs from executing
    input or output instructions. Another prohibited action is directly setting page
    mapping registers.


    When a user program needs to do something like opening a file, it makes a system
    call. This changes the CPU’s operating mode to kernel mode where the CPU can execute
    input and output instructions. The kernel open function will verify that the user
