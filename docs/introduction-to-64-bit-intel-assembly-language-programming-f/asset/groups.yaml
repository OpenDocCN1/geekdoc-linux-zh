    # CHAPTER 10. ARRAYS


    Another less obvious reason for using allocated arrays is due to size limitations
    imposed on the data and bss sections by either the assembler, linker or operating
    system. yasm reports FATAL: out of memory when you try to allocate an array of
    3 billion bytes. It succeeds with an array of 2 billion bytes in the bss segment.
    It took approximately 104 seconds on a 2.4 GHz Opter system to assemble and link
    a test program with a 2 GB array. In addition the object file and the executable
    file exceeded 2 billion bytes in size. It is much faster (less than 1 second)
    to assemble and link a program using malloc and the executable size was about
    10 thousand bytes.


    The program using malloc was modified to allocate 20 billion bytes and still assembled
    and linked in less than 1 second. It executed in 3 milliseconds. There is no practical
    way to use large amounts of memory other than using allocated memory.


    The user should be cautioned not to attempt to assemble programs with large static
    memory needs on a computer with less RAM required. This will cause disk thrashing
    while assembling and linking, using far more than 100 seconds and nearly crippling
    the computer during the process. Also it can be quite painful to use arrays larger
    than memory if they are allocated. Disk thrashing is not cool.


