    ## 5.1. MOVING A CONSTANT INTO A REGISTER


    registers, move data from 1 register to another and move the contents of a register
    into memory.


    ## 5.1 Moving constant into a register


    The first type of move is to move a constant into a register. A constant is usually
    referred to as an immediate value. It consists of some bytes stored as part of
    the instruction. Immediate operands can be 1, 2 or 4 bytes for most instructions.
    The mov instruction also allows 8-byte immediate values.


    ```

    mov rax, 100

    mov eax, 100

    ```


    Surprisingly, these two instructions have the same effect - moving the value 100
    into rax. Arithmetic operations and moves with 4 byte register references are
    zero-extended to 8 bytes. Below is a db session illustrating moving constants.


    ```

    (gdb) list 21,24

    21 mov rax, 0xa1a1a1a1a1a1a1

    22 mov eax, 100

    23 mov rax, 0xa1a1a1a1a1a1a1

