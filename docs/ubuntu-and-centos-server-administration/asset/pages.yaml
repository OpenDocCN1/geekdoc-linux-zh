  md: '# UBUNTU $ CENTOS ADMINISTRATOR


    systemd is the The Unix program which spawns all other processes .Which replaced
    the Init process after 2016 in Most of the Linux Operating system. systemd is
    the top process of all the process trees.If we open a terminal and see the process
    trees with ''pstree'' command.


    Installing packages for pstree commands


    ```

    ubuntu : sudo apt-get install pmsisc

