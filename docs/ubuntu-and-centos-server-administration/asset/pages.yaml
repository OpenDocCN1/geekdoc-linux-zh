  md: '# Tanvir Rahman


    if the "Options Indexes" is not in the directory tag then it will not show any
    directory listing


    → DirectoryMatch:


    the statement that is inside the DirectoryMatch will apply to all directory and
    the sub directory .if any one try to customize their rules even more then it is
    used .main difference is in the DirectoryMatch you have to use the regular expression


    → Files tags


    it is very similar to the directory tags .the main difference is directory tag
    controls the permission by the enclosed directives in the directory level and
    the Files tags do the same at the files level in a short the Files tags can be
    used to manage the behavior of a single files or can be a lot of files


    for example


    ```

    <Files "ht*">\nRequire all denied

    </Files>

    ```


    these directives inside the Files will prevent the web clients form accessing
    the .htaccess and .htpasswd file .here using'
