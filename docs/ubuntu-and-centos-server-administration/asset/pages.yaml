  md: '# UBUNTU $ CENTOS ADMINISTRATOR


    regular option multiple file is covered but a single regular


    there is also a directives FileMatch which is also work like the DirectoryMatch
    directives and it is used by complex regular expression for handling multiple
    files


    +   → Location tags:


    location tags are used like the the files and directory tags the only difference
    files and directory tags are used to control inside their corresponding location
