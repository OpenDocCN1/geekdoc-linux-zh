  md: '# STEP 1


    1) Create two user ''smbuser1'' and ''smbuser2'' with the IPA server. You can
    add it with the web interface or with the terminal.[this have to be done with
    the IPA server]


    The samba server have to be a client of the IPA server . We make a client of the
    IPA server a samba server. And we have to add user from the IPA server and also
    add this user as a samba client . All the user creation is done by the IPA server.
    samba server will add the user as a samba user while creating the server.


    # STEP 2


    update repository and install the necessary samba packages


    ```

    => yum update -y

    =>yum install samba-client samba-common

    ```


    # STEP 3


    Create a directory and give proper permission for that user and group'
  merge: -1
