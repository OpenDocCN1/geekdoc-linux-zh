  md: '# SETTING STATIC IP IN CENTOS7


    # EASY WAY


    Every Server needs to have a network connection. without a static ip address you
    cant run a server .Giving a server a static ip address is the most important thing
    to do.


    When you install a server the most of the time your installer automatically configure
    your server network and gets the ip address from a DHCP server. But to run a server
    you need a static ip address. So we need to change its network from DHCP to static
    and give the server a static ip address .Here we talk about how to give static
    ip address to a centos7/Redhat7 server.


    There are multiple way to give server static address ,Here we talk about easy
    method'
