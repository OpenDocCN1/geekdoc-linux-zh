  md: '# CONFIGURE NFS SERVER ON IPA


    # WHY INSTALL NFS SERVER?


    because when you login from a computer with a domain user and store some file
    .in ipa server if you login with other computer ,you may login with domain user
    and password because of the central authenticationsystem(ipa) but you will not
    find the resources that you make on the other computer with the same domain name,that
    means your data is not roaming .it stuck with the pc that you use .so it fails
    to complete the central management cause our target is no matter what ip client
    pc you are using you can login your domain username and password and also you
    will get your file .you dont need to sit in the same computer. To make that happen
    we make a nfs server


