  md: '# IP A D D R E S S I N G


    # COMPUTER NETWORK


    A computer network is a group of computer and other computing peripherals that
    linked together through some kind of communication channels to communicate with
    each other and share their resources among a width range of users.


    Their jobs are


    +   1) Facilitate communication via email,file server,web server,instant messaging
    etc

    2) Share resources of the hardware like printer or scanner

    3) Enable File sharing

    4) create a centralized control among the total network'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# TYPES OF COMPUTER NETWORK


    Network Basically divided into three groups:


    +   1) Local Area Network (LAN)

    2) Metropolitan Area Network (MAN)

    3) Wide Area Network (WAN)


    # LAN


    A local area network (LAN) within a small area like home,school,office or group
    of buildings. They can share their resources and device like printer and scanner
    and data storage. Most of them are centrally organized. And because of the type
    of the communication the data transfer rate is very high. And local area network
    does not need any leased communication line'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# MAN


    A metropolitan area network (MAN) spans an entire campus by connecting multiple
    LAN. MAN is larger than the LAN, because it consists of a number of LAN .MAN works
    like more of a ISP but it does not owned by a single organization. instead MAN
    provides a shared network connection to all its users


    # WAN


    A wide area network (WAN) within a large scale of geographical area is called
    WAN. It is created by connecting different LAN from a long distance. And the transmission
    speed generally is slower than the LAN or MAN but the data transfer rate is increasing.


