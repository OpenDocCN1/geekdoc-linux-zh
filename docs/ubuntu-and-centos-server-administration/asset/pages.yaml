- img_proc: true
  md: '# Tanvir Rahman


    =>AllowOverride none


    it tells that if the restriction imposed by the option controlled by the .htaccess
    file or not . default value is none so there will be no security breaches due
    to miss configuration


    → Order(allow and deny)


    the Order directive specify that how the allow and deny work. The order of (allow,deny)
    create a default allow it is used for creating a blacklist .the Order(deny,allow)
    create a default deny .used to create a white list.


    allow and deny govern the access to the directory .we can allow or deny client
    from accessing the server using


    =>host name

    =>domain name

    =>ip address

    =>partial ip address

    =>subnet and more


    for an example if the ip of their server is "192.168.10.200"IN THE LAN) and we
    want to allow only the ip and deny all others the syntax will be'
  merge: -1
  pgno: 320
- img_proc: true
  md: '```

    <directory />

    Order deny,allow

    Deny from all

    Allow from 192.168.10.200

    </directory>

    ```


    After changing this we have to reload the server. [remember if you do not add
    the allow statement no one can access the website not even you].


    => service httpd restart

    or

    => service apache2 restart


    +   → Indexs


    The indexes directive actually tells what to display the list of directory when
    asked. its depends on another directive is called "DirectoryIndex"

    Directory index actually tells the server what the default pages of the server
    .Basically clients trying to access the the web pages by just typing the name
    not typing the exact page url like index.php or index.html. server actually look
    in the "DirectoryIndex" and automatically present to the user

    If no file is found then it shows the whole file listing'
