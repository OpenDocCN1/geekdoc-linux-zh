  md: '# GNU PROJECT


    GNU Stands for (GNU is NOT UNIX). To make a free clone of the UNIX OS GNU project
    started 1984.To maintain the free software FSF(Free Software Foundation) is created.
    It Creates the GNU C compiler ,EMACS Text editor and many other software.


    The GNU General Public License (GPL) is a very creative license that used to copyright
