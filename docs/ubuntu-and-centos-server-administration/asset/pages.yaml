  md: "# UBUNTU $ CENTOS ADMINISTRATOR\n\n1) directory tags\n\ndirectory tags take\
    \ the following form\n\n```\n=><directory directory_path>\n=>series of options\
    \ that control accessing web pages\n=></directory>\n```\n\nbasic directory configuration\
    \ applied to the \"/\" directory\n\n```\n<Directory />\n  Options FollowSymLinks\n\
    \  AllowOverride none\n</Directory>\n```\n\n=>Options FollowSymLinks\n\nit allows\
    \ the web pages to use the symbolic links to point to the files located anywhere\
