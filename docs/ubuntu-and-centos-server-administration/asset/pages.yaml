    but if you want to know which protocols you should use or which protocols is better
    you may have to know know .and its not like one is better than the other it actually
    depends on what you need


    # pop3


    pop3 stands for the post office protocol. Its a very simple and straightforward
    protocol because the only thing it does is download the email from the email server
    to your devices from a mail server.And it only download the mail from your inbox.And
    that.it do not do anything more than that .it does not download your drafts,sent
    items or anything and it does not provide any synchronization.If you configure
    a same email account with pop3 in two different computer .And you can see the
    folder structure is different in two different'
