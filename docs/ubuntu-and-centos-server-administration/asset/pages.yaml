    # Virtual Hosts


    In apache server you can run multiple website in a single computer .it is a power
    full feature and a very flexible feature .it can be based on the ip or name.

    Virtual Hosts can run all the option used in the httpd.conf file .you can consider
    each Virtual Hosts as a separate configuration file. its like a nested configuration
