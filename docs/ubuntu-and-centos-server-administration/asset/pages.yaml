- img_proc: true
  md: '# LINUX PROCESS

    MANAGEMENT


    Everything we do in linux OS is handled by a process. There are different commands
    for managing the process how to start and stop this process. How to run process
    in the foreground and Background and how to customize the process and how to schedule
    this process with ''corn'' and ''anacorn'' for future execution. Process management
    and Process Monitoring is a way of increasing and optimizing the performance of
    the server.


    # Different Kinds of Process


    +   Linux basically has two kinds of Process

    1) Automatic Process (Background Process)

    2) Interactive Process'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# Automatic Process


    Automatic Process also known as Daemons. Automatic Process starts when the system
    started.(When the server is booted).This Process is not under the direct control
    of the User .In other it do not write output directly to the standard output


    # Interactive Process


    interactive process is the processes that started by the user using different
    commands. the process starts in a shell and it write the output directly to the
    standard output .To start an interactive process the user have to type command
    in a shell. and the process is started as a child process from the shell in which
    the user entered the command, when we terminate the child process this process
    give a exit status to the parent process and then it safely exit. Bu of the parent
    process died then it will not possible for monitoring .its called a zombie process
    .zombie Process is a result of the bad Programming. The process is the first process
    which starts other process is a child process of the process.


    # Some Background Process(Daemons)


    | Process Name(Daemons) | Descriptions |

    |---|---|'
