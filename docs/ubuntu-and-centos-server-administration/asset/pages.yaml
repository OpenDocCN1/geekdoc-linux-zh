  md: '# Tanvir Rahman


    computer in two different devices because it is not synchronize with the email
    server.


    # IMAP


    imap stands for Internet message access protocols . IMAP is little bit complicated
    than pop3.It is perfect for managing email from multiple devices because it leaves
    a cache (local copy) in the mail server. And it synchronize the folder structure
    and every file inside it. so if the mail client is configured with the IMAP you
    will see the same folder structure on every devices you used to access it. But
    it has a downside if you delete any email from one of your devices your mail will
    be delete in the server and the other devices to maintain the'
