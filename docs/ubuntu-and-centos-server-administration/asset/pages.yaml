  md: '# NFS SERVER


    # WHAT IS NFS SERVER


    ![](img/5e8a2bb431e5309eb9c40e886b58672b_401_0.png)


    Linux provides a lot of different tools for accessing file on other computer system.
    For sharing file with a Linux based OS we actually use NFS (that includes Mac
    OS too because Mac OS is based on the BSD Unix based system ).and when we want
    to use share file between windows and Linux we use SAMBA. NFS allows you to connect
    and directly access the resource of other devices that resides on the other computer.
    The network'
  merge: -1
  pgno: 401
- img_proc: true
  md: 'information service(NIS) maintains the configuration files for all the system
    on a network. By using NFS you can mount a file system and work with it just like
    your computer own file system.


    # NFS DAEMONS


    NFS operates over a TCP/IP protocol..the remote computer that holds the file system
    makes it available on the network. actually done by exporting the file system
    .you have to make entry for that file system in the ''/etc/exports'' .and you
    have to run several daemons to support that access

    The NFS daemons are the following


    +   → rpc.bind : it takes NFS request from the remote system and translate to
    the local system.

    → rpc.mountd : performs the mount and unmount option

    → rpc.portmapper : Maps remote request to the appropriate NFS daemon

    → rpc.quotad : provides user disk quote management

    → rpc.statd : provides locking services when a remote host reboots

    → rpc.lockd : Handles lock recovery for a system that gone down'
  merge: -1
  pgno: 402
- img_proc: true
  md: '> [ It is recommended to use the NFS server only in the local network if you
    use it over the internet your system will be open for non secure access ]'
