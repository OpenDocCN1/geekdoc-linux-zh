  md: '# Packaging Linux:Distribution


    A complete Linux system is called distribution. A Linux distribution contains
    the Linux kernel and the GNU project Tools and any number of software that can
    make the OS diverse functionality.


    There are a lot of distribution on Linux .Some of them specifically for servers
    and some of them are Desktop. Every customized distribution includes software
    packages for different users.


    A single Linux distribution often appears in different version .For example Centos
    distribution comes with a full core distribution and a LIVE CD version.


    Ubuntu is based on Debian Distribution And Centos is community version of the
    Commercial RedHat distribution.'
  merge: -1
