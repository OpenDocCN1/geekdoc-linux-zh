    Cornd is a job scheduler program .this program is used for schedule jobs which
    can be commands and shell scripts that can run periodically after time interval.
    It is typically used for system automation .its is very useful for downloading
    file from internet or downloading or sending email after a fixed time interval


    Its dynamic host configuration protocol daemons .this program works as a background
    and automatically set the TCP/IP information'
