  md: '# CRON


    # What is cron


    cron is a system daemon that is designed to execute scheduled commands in background
    .Cron has a specific syntax and you have to write it to a specific file called
    crontab. To manipulates crontab ‘crontab’ command is used. crond daemon is used
    to do that work in a periodic manner. The command that is written on the crontab
    will be executed in the background .This command is called cronjobs.


    # Syntax of the crontab


    => minute hour day_of_the_month weekday command'
  merge: -1
