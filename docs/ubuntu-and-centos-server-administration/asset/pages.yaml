    to share the files is in the /dev/ftp/pub directory you can create sub directory
    in that once connected to the network and the remote user can connect with your
    system and can download the files in the pub directory and can upload the file
    if you give permission to that .all the default configuration is applied to the
    directories but the vsftpd do not create any directory where you can upload the
    file .we generally called it a incoming_ directory. You have to create the directory
    and add to the default ftp user group and give the write access so the user can
    upload the file, so the user can upload files in that directory.'
