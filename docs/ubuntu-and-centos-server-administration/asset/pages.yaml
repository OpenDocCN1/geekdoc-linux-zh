  md: '# INTRODUCTION


    An operating system is a software that runs on our computer. Handling all the
    instructions between a user and the Computer hardware .But the operating system
    is not just one software it also consists of a lot of other smaller program that
    runs on this operating system to that helps users to do their work. we run this
    smaller program on top of this operating system to do everything.


    Liunx is just another operating system. Its a rock solid operating system. Linux
    work both as a server and Desktop operating system.


    Linux operating system is great for a lot of reason . Which are the following'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# Tanvir Rahman


    +   * Multi user OS: Linux is a multi user operating system. That means more than
    one user can work on a system at the same name


    +   * Multi multitasking OS: Linux is a multi taking operating system you can
    run multiple program at once .this allows the operating system to run several
    process all at once.


    +   * Multi Platform OS: Linux can run currently more that 24 types of platform
    and 64-bit Intel based personal computer .All variants of Apple mac,Sun Spark
    and ipod ,even the Microsoft xbox.


    +   * Interoperable OS: Linux can operate with most network protocols and also
    most Language it can easily interact with Windows OS,NOVEL,UNIX and other operating
    system that has a smaller market


    +   * Scalabel OS: Linux operating system has support for even Raspberry pi which
    is a credit card size computer to very powerful Server. Most of the server of
    the world is running Linux OS. They have also run in low power computer'
  merge: -1
  pgno: 8
- img_proc: true
  md: '+   * Portable OS: Linux is portable operating system. Linux is mostly written
    in C programming language .C is a language that is specially for writing operating
    system level software. And it can be ported to run on a new computer.


    +   * Flexible OS: Linux operating system can be used to make a router,graphical
    workstation,home entertainment computer,file server,web server, mail server, cluster,
