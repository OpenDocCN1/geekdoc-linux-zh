  md: '# HISTORY OF LINUX


    Linux is a clone of the UNIX based operating system. Unix is created at BELL LABS
    for AT&T corporation. To make a free clone of the Unix Linus Trovalds created
    MINIX .he wrote the kernel which is the heart of the Linux . After that a lot
    of developer helped him to add more feature and functionality .and at that time
    the GNU Project was making free software for the computer and to make an OS they
    need a functional kernel which can communicate with the hardware .They took the
    Linux kernel and add the GNU software on top of the kernel and made the GNU/LINUX
    Operating system.


    Linux Trovalds is still considered as the dictator of the Linux kernel. He ultimately
    determines which feature will be added in the Linux kernel and what features are
    not.'
  merge: -1
