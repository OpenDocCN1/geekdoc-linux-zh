    # Foreground and Background Process


    Basically interactive process is the foreground process and the Daemons are the
    background process. But sometimes we can send the foreground process to the Background.
    To understand this thing .its Important to understand three thing


    +   1) Standard input(STDIN)

    2) Standard Output (STDOUT)

    3) Standard Error (STDERR)


    when a process run in the Foreground

    1)keyboard is considered as a standard input (STDIN)

    2)Terminal is considered as a Standard output (STDOUT) and Standard error error
    (STDERR)


    but if we send a command to the background process this three'
  merge: -1
