  md: '# UBUNTU $ CENTOS ADMINISTRATOR


    things remain the same. That means if we run a program send a program in the background
    we can still see the output and the error(if happens) in the terminal. If we dont
    want The terminal output we can redirect this output to a file by using this symbol
    ''>''.Like


    command > /somewhere


    for example if we write => ls > output.txt


    it will write the output of that command in the output.txt file inside the current
    directory.


    # How to send a Process to Background


    There are two easy way to send any process to background

    1) Putting ''&'' sign at the end of any commands

    2) Using ''bg'' command after interrupting the running foreground processes


    1)suppose we want to run the ''ping 8.8.8.8 > out.txt'' command in the background
    we put a ''&'' sign at the end of the command =>ping 8.8.8.8 > out.txt &'
