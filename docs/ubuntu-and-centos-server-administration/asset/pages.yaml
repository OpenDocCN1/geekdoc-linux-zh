  md: '# Tanvir Rahman


    the load averages is displayed by a number that indicates the current activity
    of the process queue. the value actually indicates the number of the process queues
    that are waiting to be handled by the CPU of your system.


    We can get some insight of the system by reading this number if the number is
    1 ,it means the CPU is fully occupied but there is no process waiting in the queue


    if it is more than 1 then it has a list of process that a lining up that have
    to be processed .In this case the User can experience some delays .but it is difficult
    to say anu critical value because it depends on the server hardware configuration
    .typically 1 is considered as an Ideal number .if the server has dual core or
    two cpu then the ideal number will be 2 .and if the server is hyper-threading
    enabled with 32 CPU then the ideal number number will be 64.


