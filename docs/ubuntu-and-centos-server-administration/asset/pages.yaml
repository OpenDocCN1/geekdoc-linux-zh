    ```


    the information available from the configured sources is acquired by ''apt update''
    or equivalent command from another apt fronted.

    Users can manually add repository url in that file. after adding repository you
    have to issue ''apt update'' command to make it available for using.


    Or you can just create a file in /etc/apt/sources.list.d directory. The file must
    be end with .list extension. The apt package manager also read repository configuration
    from there'
