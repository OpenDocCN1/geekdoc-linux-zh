  md: '# AIDE

    ADVANCE INTRUSION DETECTION

    ENVIRONMENT


    Any person who have knowledge about IT knows that “No system is 100% secure”.In
    today’s IT world maintaining server security is one of the biggest challenge ,
    even the best available security is insufficient for the latest vulnerabilities
    in various products, and against malware/attacks created to target those vulnerabilities.
    While cyber-security cannot be 100 per cent fool-proof, we can still try to achieve
    the maximum security possible. unauthorized intrusion in the system is one of
    the biggest problem,detect attackers and the unauthorized access to a server is
    one of the most important work for a server admin. Because having basic security
    only gives you the misleading feeling of being secure, rather than actual security.
    Modern attackers are experts who exploit software vulnerabilities by using technical
    tools, and devise methods to break into a network to achieve their goals. To handle
    smart attack attempts, an even smarter security mechanism is needed, Thats why
    checking system integrity and detecting intrusion is very important. For checking
    integrity in Linux server we use a packages called AIDE(Advance Intrusion Detection
    Environment).Its file and directory integrity'
  merge: -1
  pgno: 463
- img_proc: true
  md: '# Tanvir Rahman


    checker.


    # WHAT DOES IT DO


    It creates a database from the regular expression rules that finds from the config
    files.Once the database is created it is used to check the he intrigrity of thefiles.It
    uses several message digest algorithm that are used to check the integrity of
    the file.and they can detect the version of files


    # FEATURES


    +   - supported message digest algorithms: md5, sha1, rmd160, tiger, crc32, sha256,
    sha512, whirlpool (additionally with libmhash: gost, haval, crc32b)

    - supported file attributes: File type, Permissions, Inode, Uid, Gid, Link name,
    Size, Block count, Number of links, Mtime, Ctime and Atime

    - support for Posix ACL, SELinux, XAttrs and Extended file system attributes if
    support is compiled in

    - plain text configuration files and database for simplicity

    - powerful regular expression support to selectively include or exclude files
    and directories to be monitored

    - gzip database compression if zlib support is'
