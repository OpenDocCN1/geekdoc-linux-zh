  md: '# FILE SERVER


    The ftp or file transfer protocol is designed to transfer large file across the
    network .ftp works like client server model.FTP program allow the user to upload
    files to a server and download from them .any Linux system can works as a ftp
    server. There are some packages that allows the Linux system to work as a ftp
    server .A user can log into on that server and transfer files. a user can access
    only the Accounts directory of the server . there is a special type of account
    named ‘ftp’ that allow users to log into the server with the server with the user
    name “anonymous”.the account has its own directory and the directory is considered
    public because anybody in the network can access it. Any linux system can be configured
    to support anonymous login. A ftp server software is based on two things


    +   =>ftp daemon

    =>configuration file'
  merge: -1
  pgno: 374
- img_proc: true
  md: '# UBUNTU $ CENTOS ADMINISTRATOR


    daemon is a program that continuously check ftp request from the remote user .when
    it get the request it manages the login and set the connection for the user account
    make the corresponding directory available for the user. for the anonymous ftp
    access the ftp daemon allow the remote user to login to this server using anonymous
    as the user name .and for the security purpose the linux system make the corresponding
    home directory as the root directory so that the user cannot access the rest of
    the computers files and folder . the user can only see its home directory and
    nits sub-directory. The remaining directory will remain hidden. There are several
    ftp server packages for linux system among them the most popular is the vsftpd
    and proftpd proftpd is a popular ftp daemon based on Apache web server design
    it has simple configuration and it supports virtual FTP hosts another popular
    that is already already pre installed in many linux distribution is vsftpd (Very
    secure FTP server) .it support the anonymous Ftp support'
  merge: -1
  pgno: 375
