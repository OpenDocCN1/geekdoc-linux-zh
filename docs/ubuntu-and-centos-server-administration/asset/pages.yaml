  md: '# UBUNTU $ CENTOS ADMINISTRATOR


    (CLI) efficient image model and cluster management.


    When compared to Virtual machines, the Docker platform moves up the abstraction
    of resources from the hardware level to the Operating System level. This allows
    for the realization of the various benefits of Containers e.g. application portability,
    infrastructure separation, and self-contained microservices. In other words, while
    Virtual Machines abstract the entire hardware server, Containers abstract the
    Operating System kernel. This is a whole different approach to virtualization
    and results in much faster and more lightweight instances .so the main concept
    is the Docker does not isolate the environment with a separate Operating system.'
