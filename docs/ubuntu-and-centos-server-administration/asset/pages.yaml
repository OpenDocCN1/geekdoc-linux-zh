  md: '# MTA


    A mail transfer agent transfer (MTA) transport the message through the internet.
    MTA uses the smtp protocols to send the messages . MTA are actually mail servers.


    # SENDMAIL & POSTFIX


    On linux and Unix system the most common and pre installed MTA is sendmail. A
    mail server constantly checks for new mail from other mail servers and and transport
    them among different servers. Although the sendmail is the default MTA it is not
    the most popular MTA .The most popular MTA is the postfix


