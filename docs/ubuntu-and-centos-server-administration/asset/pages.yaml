- img_proc: true
  md: 'Tanvir Rahman


    ```

    =>mkdir /share

    =>chmod 777/share

    ```


    # STEP 4


    we have to add the user of the test group to the samba


    ```

    =>smbpasswd -a smuser1

    =>smbpasswd -a smuser2

    ```


    # STEP 5


    Configure SELinux .you can either disable the SEinux or set the proper Boolean
    value and security otherwise it will let you connect to the server. In this we
    are not going to disable SELinux we will change the Boolean value.


    ```

    =>setsebool -P samba_export_all_ro=1 samba_export_all_rw=1

    =>getsebool -a | grep samba_export

    => manageage fcontext -at samba_share "/share(/.*)?*"

    => restorecon /share

    ```'
  merge: -1
