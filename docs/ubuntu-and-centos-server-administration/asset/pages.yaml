  md: '# COMMAND LINE IN LINUX


    Every workstation version of Linux has a Beautiful GUI(Graphical User Interface
    ) but most of the server Ubuntu or Centos root can do anything on command line
    mode .you can add graphical user interface to that but without the command line
    you cant manage the server properly. Once you learn Command line you will find
    that it is more powerful and flexible for user to manage your server than a graphical
    mode.


    # WORKING AS ROOT


    By default every Linux OS creates a user root. Many operating system like Centos
    ask for a root password .But Ubuntu server don''t do that .There is a very good
    reason behind that in Linux OS root has a limitless power .root can do anything,change
    anything even can delete anything from the server .so it is very important to
    be careful when you work as root .That''s why in'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Tanvir Rahman


    ubuntu server every time you do anything that need superuser privileges you use
    the command ‘sudo’.This command allows the normal user so they can perform task
    that needs superuser privileges .type sudo then your command it may ask for password
    after providing the password it will perform the action with the superuser privileges
    . But if you want the root shell then type this command


    ```

    => sudo su

    ```


    But it is not recommended to work with the root shell .Do not use the root shell
    unless it is absolutely necessary . work with sudo if you need superuser privilege.'
