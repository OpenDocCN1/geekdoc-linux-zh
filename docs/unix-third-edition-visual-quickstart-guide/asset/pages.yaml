  md: '# To read newsgroup messages with pine:


    +   1. pine

    At the shell prompt, type `pine` (unless you''re still in `pine` from the previous
    section).


    +   2. L

    Press `L` to view the list of folders.


    +   3. Tab Tab Tab. Ah-ha!

    Tab down to the news collection (Figure 12.11).


    +   4. V

    Press `V` to view the folder you choose.


    +   5. Read messages just like you''d read mail. Check back with Chapter 11 for
    a quick reminder about reading, sending, and replying with pine.


    # ✓ Tips


    +   When subscribing to newsgroups, you can just enter the name of a newsgroup
    (or part of the name) after you press `A` to add a new subscription, rather than
    search through the entire list of newsgroups.


    +   Use `$h` from the message index in `pine` to first specify that you want to
    sort the ($), and then that you want to sort by message threads (the h). Using
    `$h` makes news reading much more enjoyable and less frustrating.


    +   After you subscribe to a newsgroup, you might have a few initial messages
    that show up as “No Message Text Available.” Just scroll down to other messages.'
