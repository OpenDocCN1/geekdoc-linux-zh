  md: '# INTRODUCTION


    Greetings, and welcome to Unix! In this book, you''ll find the information you
    need to get started with the Unix operating system, advance your skills, and make
    Unix do the hard work for you. This book focuses on the most common Unix commands,
    but it also gives you ideas for working smartly and efficiently.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Introduction


    # # Do You Use This Book?


    We designed this book to be used as both a tutorial and a reference. If you''re
    a Unix newbie, you should start at the beginning and work through the first several
    chapters. As you progress through the chapters, you''ll build on concepts and
    commands learned in previous chapters. Then, as you become more proficient, you
    can start picking and choosing topics, depending on what you want to do. Be sure
    to reference the table of contents, index, and the appendices to find information
    at glance.


    If a line of code in a numbered step is particularly long, the code might wrap
    to a second line. Just type the characters, without pressing `Enter` until the
    end of the command. Also, in code listings throughout the book, a single line
    of code on screen might wrap to two lines in the book. If this happens, the continued
    line will start with a `→`, so it might look like:


    The commands used this book apply to any version of Unix you might be using, Linux,
    BSD, Solaris through your local Server system, AIX or HP-UX, at your Mac OS X
    Linux system, or any other *flavor* (the technical term) you can find. You can
    run Unix from your Windows system with CygWin or VMware. You''ll find more about
    flavors and getting to access to Unix in Chapter 1.


    The beginning of the code starts here → it continues on this line.


    Sometimes you will have to use a special key or combination—like hold the `Ctrl`
    key and press `C`. We''ll use this special keyboard font for these keys, but not
    for letters, numbers, or symbols you might type.


    Finally, most sections end with a couple of handy tips. Look here for ways to
    combine Unix commands, suggestions for using commands more efficiently, and ideas
    for finding out information.


    Each chapter covers several topics, each of which is presented in its own section.
    Each section begins with a brief overview of the topic, including examples or
    descriptions of how or when you use a command.


    # ## Who Are You?


    We assume that you''ve picked this book because you already have a need for or
    interest in learning to use Unix, or any Unix operating system, Linux, Mac OS
    X, BSD, HP UX, AIX, or others. We assume that


    +   - You want to know how to use Unix to do at work, or home,


    +   - You may or not already have experience with Unix.


    +   - You don''t necessarily have other geek—er, um tech—computer skills or experience.


    +   - You want to learn Unix, but probably not want to delve into all of the arcane
    details about the Unix system.


    Next, you''ll find a step-by-step (or a list of them) to show how to complete
    a process. Note that the code you type appears as the numbered step, and a description
    follows it, like this:


    +   1. The code you type will appear like → this is in a blocky font.


    An explanation will appear like this in a regular format. Here, we describe what
    you''re typing, give alternatives, or provide cross-references to related information.


    INTRODUCTION


    xii'
