    4. awk -F, ''/CA/ {print $2 $1 $ 7 }''

    -> address.book > phone.list


    You can also specify a matching pattern. Here, we added /CA/ to search and act
    on only the lines that contain CA, so only those lines will be in the phone.list
    file.


    # Tips


    +   - You can load awk scripts from a file with awk -f script.awk filename. Just
    as sed, this keeps the retrying to a minimum, which is helpful with these long
    and convoluted commands. Refer to Chapter 10 for more details about scripting.


    +   - Take a glance at Sorting Files later in this chapter and consider piping
    your awk output to sort. Let Unix do the tedious work for you!


