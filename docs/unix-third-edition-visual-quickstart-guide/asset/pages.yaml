  md: '# Being Root


    # To monitor users:


    +   - w; who


    You don''t need sudo for this, but do want to keep an eye on the users logged
    in, and where they''re coming from. After a while, you''ll get to recognize patterns
    and react to them. joe usually logs in by 9 a.m. and logs out by 4 p.m., and always
    logs in the same system, then when you see joe logging in from a different address
    at 1 a.m., you should wonder if joe''s secret password isn''t quite so anymore.


    Or


    +   - last


    The last utility tells you who logged in (and out) and when, and from where, as
    shown in Code Listing 16.5 (on the next page). Good stuff to know, particularly
    if you''re not online and actively monitoring w and who of the active.


    # To monitor system load:


    +   - top


    Use top to monitor your system loads, as different systems will show distinctly
    different patterns, but if you got actual to checking topn Develop shell scripts
    that automatically run when you log in and go through the "normal" system checks.
    By doing so, you don''t have to do routines manually, and you can come to speed
    quickly on what''s going.


    +   - Use top -d 1 grep Mem for a running status check on your available memory.
    grep for other characteristics from top output, as appropriate.


    +   - Anything that''s different from usual is worth being concerned about. Check
    man pages or search the Web to find out for sure.


    # Tips


    +   - There''s a lot to monitor and a lot to keep up with. Take time to read man
    pages, search the Web, and ask for tips and tricks. A wide variety of additional
