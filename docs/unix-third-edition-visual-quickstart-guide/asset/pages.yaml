  md: '# Sending and Reading Email


    # To forward mail with procmail:


    +   1. pico ~/.procmailrc


    To begin, incur your editor and edit the .procmailrc file that you previously
    created in your home directory.


    +   2. :0:


    On a new line at the bottom of the file, add :0;, which starts a procmail recipe.
    This basically tells procmail to "lock" your mail directory while it''s processing
    mail.


    +   3. ! myotheremail@example.com


    Provide an exclamation point (!) and the address to which to send the mail.


    +   4. Save and close the file.


    Now all email that you receive will be automatically forwarded to myother-email@example.com.


    # Use procmail to Toss Spam Messages


    The following recipe,


    ```

    :0:

    ```


    ```

    * !TAO.*aw@,.*raycomm

    ```


    ```

    $MAILDIR/spam

    ```


    uses a regular expression to filter messages that aren''t explicitly addressed
    to a userid with @ before and raycomm at the end and places them into a special
    folder called spam. Put the spam filter at the end of your list of rules so all
    of the messages originating from your mailing lists and other messages are first
    filed. After testing this and making sure that you like it and it doesn''t pitch
    valuable messages, you could change the last line to /dev/null to just throw away
    garbage.


    For more complex and sophisticated spam solutions, check the options with a Google
    search for procmail spam filter at http://www.google.com/.


