  md: '# Uncompressing Files with uncompress


    Compressing a file is handy for reducing the amount of disk space, but you can
    do much with a compressed file—directly, at least. You''ll need to uncompress
    it first. As Code Listing 13.9, you do so using the uncompress command.


    To uncompress a file with uncompress:


    +   - uncompress labrea.tar.Z

    - At the prompt, type uncompress followed by the filename to uncompress. The compressed
    file is replaced by the uncompressed file, which is named like the original, but
    without the .Z (see Code Listing 13.9).


    # Tips


    +   - Remember that uncompressed files take up more space—sometimes a lot more
    than compressed files. You might want to check your storage quota with your ISP
    before you uncompress a file to make sure that you don''t exceed your limit. As
    Chapter 7 explains, you can often check your quota by typing quota-v at the prompt.


    +   - You can add the -c flag to uncompress to leave the original untouched and
    send the uncompressed version to standard output. For example, you might use uncompress
    -c starred.tar.Z > starred. tar. See Chapter 1 for more information on redirecting
    output, as is shown here.


    +   - You can also use gunzip to uncompress compressed files. Check out Unzipping
    a gzip File with gunzip later in this chapter.


    ```

    $ej@hobobs compression]$ ls -l 1*

    -rw-r-r- 1 ejr users 297027 Jul 27

    - 10:06 labrea.tar.Z

    $ej@hobobs compression]$ uncompress

    -labrea.tar.Z

    $ej@hobobs compression]$ ls -l 1*

    -rw-r-r- 1 ejr users 501760 Jul 27

    - 10:06 labrea.tar.Z

    $ej@hobobs compression]$

    ```


    Code Listing 13.9 You can uncompress files with a single swift command and possibly
    double your usage at the same time, as shown here.'
