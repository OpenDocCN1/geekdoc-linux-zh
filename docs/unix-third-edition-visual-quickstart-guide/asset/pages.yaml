  md: '# Chapter 2


    # # Moving Files with mv


    Moving directories and files means moving them from one location (think of location
    as an absolute file path, like /home/ejr/myfile) in your system to another location
    (say, /temp/File or /home/ejr/Anotherfile). Essentially, you have only one version
    of a file, and you can change the location of that version. For example, you might
    move a directory when you are reorganizing your directories and files. Or, you
    might rename a file—that, is move a file from one name to another.


    ```

    $ ls

    Complete existingfile oldfile

    $ mv existingfile newfile

    $ ls

    Completed newfile oldfile

    $

    ```


    **Code Listing 2.8** files to see the current files, use mv to rename one of the
    files.


    You move directories and files using mv, as shown in **Code Listing 2.8.**


    # ### To move a file or directory:


    +   1. ls

    To begin, use ls to verify the name of the file you want to move. If you''re changing
    the name of the file, you''ll want to ensure that the new file isn''t yet in use.
    If you move a file to an existing filename, the contents of the old file will
    be replaced with the contents of the new file.


    +   2. mv existingfile newfile

    Type mv plus the filename and new filename. Say goodbye to the old and hello to
    the new one (**Code Listing 2.8**).


    You use the same process—exactly—to move directories; just specify the directory
    name, as in `ExistingDirectory`


    +   3. ls

    Verify that the file is now located in the location you intended.


    # ### Tips


    +   You can also use mv to move files into out of directories. For example, `Projects/testfile
    /home/deb/ testfile` moves existing files to the Projects and subdirectories of
    Deb''s current home directory, also using the name testfile.


    +   Use mv -i filename filename to require the system to prompt before overwriting
    (destroying) existing files. The -i is for "interactive," and it also works with
    the cp command.


    +   Visit Chapter 8 to find out about aliases with mv so that the system prompts
    you before overwriting files and you don''t have to remember the -i flag.


    +   If you use mv to specify an existing directory as the target (as in, mv something
    `ExistingDirectory`), "something" in this case, will be placed into `ExistingDirectory`.
    "Something" can be either a file or directory.


