  md: '# Chapter 16


    # # Changing the System Configuration


    Most (nearly all) of the system configuration files for Unix systems are contained
    in the /etc directory. If it''s a configuration that''s specific to a user, the
    setting will be located in the user''s home directory; otherwise, configuration
    settings for the whole system are located in the /etc directory.


    We''re not going to get into changing much here—you should really know what you''re
    doing before you start figuring with the system configuration. However, if you''re
    root, you should have some fun to play with. In the following example, you''ll
    see how to change the Message of the Day (aka, the motd), which is users generated
    when they log into the system (Figures 16.1 and 16.2).


    **To change the motd:**


    +   1. sudo /etc/motd


    Use sudo to gain root access and edit the /etc/motd file.


    +   2. Hey, you have wrinkles in your stockings! Oh...sorry, you''re not wearing
    stockings!


    Uhhh, yikes! After your favorite slogan, saying, or comment to the file. Keep
    in mind that everyone who logs into the system will see this message, keep it
    clean...and be nice! (Figure 16.2)


    +   3. logout


    Log out, you can log back in and see your handiwork.


    +   4. ssh yoursystem.example.com


    Log back in to see the new message.


    > root@fraz.rayقوم.com:/home/jdoe

    login as: jdoe

    Dear, welcome "jdoe"

    jdoe@fraz.rayقوم.com:~password:


    If you''re not authorised to use this system, please disconnect

    ow. Failure to do so subjects you to prosecution.


    Welcome to Fraiz!

    [jdoe@fraz]#


    **Figure 16.1** Any user will see the motd when logging in.


    > root@fraz.rayقوم.com:/home/jdoe

    login as: jdoe

    Dear, welcome "jdoe"

    jdoe@fraz.rayقوم.com:~password:


