  md: '# Chapter 14


    # ## vi Makefile


    Use the editor of your choice to review the Makefile, reading the instructions
    in it and checking the accuracy of things like directory and path names, program
    names, and install settings. If you don''t know what something is, ignore it for
    now. Even if configure automatically sets up the Makefile for you, you should
    still check to make sure it''s putting things into the correct directories and
    doesn''t expect any additional information from you.


    If you find errors in the Makefile, review the INSTALL or README files and rerun
    configure with the appropriate options to get the Makefile in order.


    ```

    top_prefix =

