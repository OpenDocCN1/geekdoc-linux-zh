  md: "# Creating and Editing Files\n\n![](img/30f4227f5df2c6cea63896bef2fc574f_93_0.png)\n\
    \n# # Cutting and Pasting Text Blocks in pico\n\nAs you're typing in pico, you'll\
    \ probably need to cut and paste blocks of text, as shown in Figure 4.6.\n\nTo\
    \ cut and paste text in pico:\n\n+   1. pico hypersypers\n   At the prompt, type\
    \ pico followed by the name of the file to edit.\n\n+   2. Move the cursor to\
    \ the first line of the text you want to cut.\n\n+   3. `Ctrl+K`\n   Press `Ctrl+K`\
    \ to mark the beginning of the text you want to cut. (Note that it is really `Ctrl\
    \ Shift K`—it might work without `Shift`, but it might not, depending on your\
    \ terminal program. Try it out and see what happens.)\n\n+   4. Use the arrow\
    \ keys to move the cursor to the end of the text you want to cut.\nNote that the\
    \ text gets highlighted as you select it (Figure 4.6).\n\n+   5. `Ctrl+U`\n  \
    \ This \"cuts\" the text.\n\n+   6. Using the arrow keys, move the cursor to where\
    \ you want to insert the cut text.\n\n+   7. `Ctrl+U`\n   Use this key combination\
    \ to paste the cut text into the file at the new location.\n\n# ## Tips\n\n+ \
    \  - You can select and cut blocks of text without also pasting them back into\
    \ a file. Just skip steps 6 and 7.\n\n+   - You can paste text as many times as\
    \ you want. After you select and cut text, just press `Ctrl+U` at each place where\
    \ you want to insert the cut text.\n\n+   - If you don't select text, `Ctrl+K`\
    \ just cuts a single line."
