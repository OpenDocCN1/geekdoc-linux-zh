  md: '# Chapter 9


    # # Scheduling Regularly

    Occurring Jobs with cron


    Suppose you want to send yourself a reminder message before you go home the end
    of each day—say, a reminder to turn off the coffeespot. Or, suppose you want to
    make a backup copy of specified files each week. You can do this by using the
    crontab command to schedule commands or scripts to run regularly at times you
    specify. In doing so, you can schedule tasks to occur on specific days at specific
    times and know that the jobs will happen unattended (Figure 9.2).


    To schedule a regularly occurring job with cron:


    +   1. crontab -e


    At the shell prompt, type crontab, followed by the -e flag, which lets you edit
    your cron file. As shown in Figure 9.2, your cron file will appear in your default
    editor. It''s likely to be empty (if you haven''t set cron jobs before), but you
    might have some content in there.


    +   2. 55 16 * * * mail -s "Go home now!"

    → ejray@raycomm.com


    On the first line of the cron file, enter values for minutes, hours, day of the
    month, month, and day of the week, then the command you want to run. See Are Those
    Funky Numbers? sidebar for more details about specifying times and days. In this
    example, we''re sending an email to ejray every weekday at 4:55 p.m. reminding
    him to go to home.


    ![](img/30f4227f5df2c6cea63896bef2fc574f_212_0.png)


    Figure 9.2 The cron file, which is where you specify the cron job, opens in your
    default editor. If you''ve previously specified cron jobs, they will show up in
    the editor.'
