    # Tips


    +   - If you''re sending a file to someone with a MIME-compliant email program,
    you might try base64 encoding, using uuencode -m. See Chapter 11 for more about
    email.


    +   - A relatively new development on Usenet is to use yfnc (yencoding/ydecoding).
    Look for yencode and ydecode on your system, or consider installing them if needed.
    See Chapter 14 for more information about installing software.


    +   - Also check out Chapter 11 for information about email programs that will
    automatically handle attachments, including encoding files for you.


