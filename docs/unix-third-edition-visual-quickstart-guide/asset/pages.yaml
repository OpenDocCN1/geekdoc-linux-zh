  md: '# # Importing Files into vi


    You can also merge multiple files in vi by reading additional files into the current
    one, as shown in **Figure 4.13**. Basically, all this means is you insert one
    file into the file you''re currently editing.


    **To import files in vi:**


    +   1. vi hairyspider

    At the prompt, type vi followed by the filename to start vi with, in this case,
    the `hairyspider` file.


    +   2. `Esc`:r filename

    At the point in the file where you want to import text, press `Esc`, then type
    `:r` and the filename you want to read into the file.


    ✓ Tip


    vi also lets you read the output of commands into the file. For example, if you
    want to read the list of files in a specific directory into the file, use `Esc`:r
    !ls in command mode.


    ![](img/30f4227f5df2c6cea63896bef2fc574f_101_0.png)


    **Figure 4.13** Reading an additional file into the current one can make your
    editing tasks much easier.'
