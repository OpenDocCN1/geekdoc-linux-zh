  md: "# Becoming root with su\n\nBecoming root, assuming that you know the root password,\
    \ is quite easy. To do so, you just apply the su command (introduced in the Changing\
    \ Root Identity with section of Chapter 3), where you change the root identity\
    \ (Code Listing 16.3).\n\nOnce again, we'll say: Being root on a Unix system carries\
    \ it with a lot of responsibility. First, you must be extraordinarily careful\
    \ about what you type and what you type it. Every system administrator out there\
    \ has a horror story about wrecking (to a greater or lesser degree) a system through\
    \ careless use of the root shell. We've done it, too. Second, you must be very\
    \ responsible about what you do. You can read anything, see anything, watching\
    \ anything, and change anything. You can, therefore, easily infringe upon the\
    \ privacy of your users. Don't.\n\nTo become root:\n\n+   1. su\n   Enter su to\
    \ become root\n2. *****\n   Enter the root password when prompted. Note that,\
    \ after you succeed, you'll see a different prompt (#). This is your confirmation\
    \ that you succeeded and are now root (Code Listing 16.3).\n3. exit\n   Use exit\
    \ or Ctrl+D to exit the root and become yourself again.\n\n```\njdoe /home/jde\
    \ $ su\nPassword:\n[root@sulley jde]# exit\njdoe /home/jde $ su -\nPassword:\n\
    [root@sulley root]#\n```\n\nCode Listing 16.3 Becoming root is remarkably easy."
  merge: -1
  pgno: 344
- img_proc: true
  md: '# Tips


    +   - As with using su to become yourself (or another user), you can use su to
    ensure that all of the root environment variables are set correctly. If you just
    use su without the hyphen, environment variables and the like will not be set
    for you, only the root identity. Which is more appropriate depends completely
    on your situation. If you get unexpected error messages (file not found, for example)
    with one approach, try the other.


    +   - If you’re connecting to a system with telnet (as opposed to ssh), do not
    become root. The root password could be “sniffed” by malicious users, and if a
    hacker gains your root password, you’re potentially in big trouble. Your best
    choice is to use ssh or to use sudo if ssh is simply impossible.


    +   - Usually, you’ll have to log in to a system as you, and then become root.
    It’s a rare system that will allow you to log directly in remotely as root. Again,
    this is a security measure to help minimize the possibility of break-ins. Even
    if someone gets the root password on a system, they can’t act as root if they
    can’t also log in as a normal user.


    +   - There are no real secrets on a Unix system. If you have something that must
    be a secret, you must encrypt it, or the root user (as well as other users) could
    know it.'
  merge: -1
