  md: '# Getting Information About the System


    Code Listings 7.3 and 7.4 show the output of df on two different systems.


    If you''re a system administrator, you can use this information to help diagnose
    problems occurring in the system. If you''re an average user (of above-average
    curiosity), you can use this information to satisfy your inquisitions or to tip
    off a system administrator to problems. For example, if you''re getting odd errors
    or unpredictable results with a specific program, using df might reveal that the
    /home file system is full or maybe that you don''t have the /dev/cdrom file system
    that you thought was installed and mounted. Hmmm!


    # ## Tips


    +   - You can use df with a specific directory to get a report on the status of
    the file system containing that directory. For example, you might use df /usr/local/src
    to find out where directory is mounted and how much space is available on it.


    +   - Use df -k to make sure that the usage is reported in 1 Kbyte blocks, not
    in 512 byte blocks. Adding the -k flag will also ensure that you get output like
    that shown in Code Listing 7.3.


    +   - Use df -h to get "human readable" output. This works with most commands
    (like ls -s, for example) that output marginally comprehensible file information.


    ![](img/30f4227f5df2c6cea63896bef2fc574f_157_0.png)'
