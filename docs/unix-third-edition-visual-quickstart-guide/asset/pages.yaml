    (which indicate the current directory and its parent directory), you can skip
    ahead to step 4.


    # Tips


    +   - You can remove multiple directories at one time. Assuming you are starting
    with empty directories, just list them like this: rmdir DirectoryYourdirectory
    OtherDirectory


