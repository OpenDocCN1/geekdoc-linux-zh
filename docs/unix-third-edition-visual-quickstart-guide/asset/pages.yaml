  md: '# Running Scripts and Programs


    # Running jobs in the Foreground with fg


    | ejr@hobbes ejr$ jobs |

    | [1]+ Stopped ftp ftp.cdrom.com |

    | ejr@hobbes ejr$ fg %1 |

    | ftp ftp.cdrom.com |


    **Code Listing 9.8** Typing plus fg the job numbers that job into the foreground.
    When you bring suspended jobs into the foreground, you''ll sometimes see the job
    activities onscreen. At other times, you''ll only see a prompt and will need to
    summon help to see anything of the program.


    When you''re ready to resume a suspended or background job, you can do so using
    fg. Remember, when you suspend a job, you''re moving the job into limbo. fg just
    moves the job into the foreground again (**Code Listing 9.8**), so you can see,
    for example, what it''s or provide input.


    # To run jobs in the foreground with fg:


    +   1. jobs

    At the shell prompt, type jobs to list all stopped or running jobs. Note the job
    numbers at the left.


    +   2. fg %1

    Enter fg followed by the number of the job that you want to bring back into the
    foreground (Code Listing 9.8).

    Depending on the job you''re bringing back into the foreground, you or may not
    get to see the job running onscreen. Sometimes you''ll be plunked back into the
    job and be able to enter information as prompted. At other times, you''ll see
    the prompt for the program returned to the foreground. If this is the case, try
    typing ? (for help), which often forces the program to display something onscreen
    and refresh the display.


    > ✔ Tip


    +   You can bring the last suspended job into the foreground by typing fg (with
    no job number) at the shell prompt.'
