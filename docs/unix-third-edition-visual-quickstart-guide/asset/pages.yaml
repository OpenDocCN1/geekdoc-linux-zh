  md: '# # GETTING STARTED WITH UNIX


    To start you on your journey through Unix, we''ll take a quick look at a few basic
    concepts and commands. In this chapter, we get you started with basic Unix skills,
    such as accessing a Unix account, logging in, and listing and viewing files and
    directories, among other things. We''ll also show you how to explore Unix, see
    its capabilities, and discover just what you can do with it.


