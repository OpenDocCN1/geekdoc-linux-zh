  md: 'Getting Information About the System


    # # Viewing File Systems with df


    If you''re used to Windows or Macintosh (prior

    to OS X) operating systems, you''re probably

    accustomed to having separate hard drives (C:

    D, E: for Windows users, or real names for

    Macs), which are just different storage spaces.

    in Unix systems, different storage spaces are

    grafted onto the overall tree structure—

    tacked onto what already exists without any

    clear distinction indicating actual

    disk drives are located. For example, if you

    have a folder on a Windows computer, you

    know that all of the subfolders and files

    within it are located on the same hard drive.

    in Unix, everything resides within the

    directory, but any different directory could

    be located on a different physical hard drive.

    You might think of it as taking a new

    branch onto your artificial tree.


    These tacked-on storage spaces are called

    file systems. Particularly if you''re running a

    Unix system (as opposed to using just one),

    might need to find out what file systems

    are in use (or mounted in the system, in

    technical terms), how much space they have,

    and where they attach to the Unix system

    (or where their mountpoints are). You can

    find out this information using df, as shown

    in Code Listings 7.3 and 7.4.


    ```

    ejr@hobbes ejr$ df

    Filesystem 1024-blocks Available Capacity Mounted on

    /dev/hda1 515161 172255 65% /

    /dev/hdb4 66365 4916 58022 8% /home

    /dev/hdb1 416656 324633 70504 82% /usr/local

    /dev/sbpcd 596704 596704 0 100% /mnt/cdrom

    ejr@hobbes ejr$

    ```


    **Code List 7.3** This Linux system has relatively simple file systems.


