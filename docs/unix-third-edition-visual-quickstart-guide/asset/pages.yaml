  md: '# Chapter 8


    # # Understanding Your

    Unix Environment


    Environment variables are settings in the Unix system that specify how you, your
    shell, and the Unix system interact. When you log in to the Unix system, it sets
    up your standard environment variables—the shell prompt you want to use, the default
    search path, and other information to help programs run, among other things. You
    might think of your environment variables as being similar to having a standard
    order with a deli to deliver the same thing to you every day. You set up your
    “environment variables” and the Unix system delivers them to you after session
    unless you specify otherwise.


    Technically, there is a distinction between “shell” variables, which exist in
    the particular shell you’re using, and “environment” variables, which are in your
    environment and independent of your particular shell. For most purposes, though,
    including this book, you can do as we’re doing and conveniently blur the distinction.
    As long as you know that they’re not precisely synonymous, you’ll be fine.


    Basically, just like the lunch deli, you can configure your environment in one
    of two ways:


    +   - Changing the variables for the current session—kind of calling in a special
    order for the day (as in ordering onion and extra cheese on the day’s sandwich).
    You do this from the shell prompt, as discussed in the Adding or Changing Variables
    section in this chapter.


    154'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# Configuring Your Unix Environment


    +   - Changing the variables for all subsequent sessions—kind of changing your
    standard order (say, when the doctor tells you to cut back on mayonnaise and suggests
    mustard for your long-term deli order. You do this within the configuration files,
    as discussed in sections following Adding or Changing Variables.


    If you want to change your environment variables, you should first try changing
    them from the shell prompt for the current session. This way, you can try the
    changes before you make them permanent in your configuration files.


    When you change your environment in the configuration files, keep in mind that
    configuration files are generally run in a specific order:


    +   - Systemwide configuration files (such as /etc/profile) run first upon login.
    These systemwide configuration files in /etc (if they exist) help set your environment,
    but you cannot change them.


    +   - Configuration files specific to your Unix account (such as ~/.profile and
    ~/.zshrc) run next if they''re available. If you want to change environment variables
    originally set in the systemwide files, you can reset the values in your own personal
    files.


    What this order means is that your personal configurations overrule system ones.
    So, in making changes to your configuration files, make sure that you make changes
    to the configuration files that run last. We''ll tell you specific files to look
    for in the real sections of this chapter.


    # Tips


    +   - You can echo SHELL to remind yourself of what shell you''re using. Visit
    Chapter 3 for more details.


    +   - Find out about changing environment variables in your system configuration
    files in other sections of this chapter, according to which shell you''re using.


    Find out about discovering your current environment variables and adding or changing
    environment variables manually in the next two sections in this chapter.


    ![](img/30f4227f5df2c6cea63896bef2fc574f_169_0.png)


    155'
