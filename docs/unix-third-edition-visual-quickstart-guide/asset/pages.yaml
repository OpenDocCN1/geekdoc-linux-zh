    # Checking Connections

    with ping


    Think of using ping as saying "Are you there? to a remote computer. For example,
    suppose you''re trying to connect to a Web page but are getting no response from
    the computer. Rather than wait and wonder what''s going on, ping to find out if
    the computer is up and functional (Code Listing 12.5).


    # To check a computer with ping:


    +   - ping www.raycomm.com


    At the shell prompt, ping and the host name to connect to a specific host, as
    shown in Code Listing 12.5.


    Depending on your Unix system, it may check the connection on one time and report
    the results. Or, it may continue to pester the other computer ever until you tell
    it to stop. If that''s the case, just press [Ctrl+C] to stop.


    # Tips


    +   - If you''re having problems connecting to a particular computer, you might
    consider traceroute, which pings all the connections on the path between point
    A and point B. While ping tells you if a host responds or not, traceroute will
    give you an idea of where the problem might lie. See the next section for more
    details about traceroute.


    +   - The ping command doesn''t provide a definitive answer to the status of the
    remote computer. Systems are configured not to respond to requests for ping. If
    you get a response from ping, the system is definitely up and you can communicate
    with it; however, a lack of response from ping may not mean anything about that
    system''s status.


    Listing 12.5 Using ping, you can find out or not you can connect to a specific
    computer.


