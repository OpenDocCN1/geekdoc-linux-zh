    Clean litter box

    Polish swamp cooler

    Buff garage floor

    ```


    To view a specified number of lines:


    +   - head -20 honeydo

    Add -20 (or whatever number of lines you want to view) to view a specific number
    of lines.


    To view the beginnings of multiple files:


    +   - honeydo* | more

    You can view the top of multiple files by piping head (plus the filenames) to
    more. Note that head conveniently tells you the filename of each file, as shown
