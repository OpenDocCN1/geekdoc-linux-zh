  md: '# Chapter 6


    To split files with split:


    +   - split -b 500k mongopicture.jpg

    With that, split gives you three files (xaa, xab, xac) that are each 500 KB (the
    first two) or less (the last one, containing the leftovers). Mail each of those,
    and you''ve squeaked under the ISP''s size limit.


    # Tips


    +   - Control the names of the files by adding a prefix at the end. For example,
    try split -b 500k mongopicture.jpg chunk to get three pieces called chunkaa, chunkab,
    and chunkac.


    +   - Use cat to restore the original. For example, cat xaa xab xac > reconstituted-picture.jpg


    +   - If you''re following the photo file used here, note that the recipient of
