  md: '# Discovering Your Current Environment


    A good first step in changing your environment is determining what environment
    you have. Using the steps in this section, you can discover which environment
    and shell variables are currently set—including ones set in the configuration
    files as well as ones for the current session (**Code Listings 8.1 and 8.2**).


    As you''re going through these steps, you might check out the Sidebar Variables
    in Your Environment Shouldn''t Touch in this section for a list of variables you
    should leave alone. Then, in the next section, check out Variables You Can Mess
    With to find ones you can change.


    **To show your current environment in zsh, bash, or ksh:**


    +   - set


    At the prompt, type set. You''ll see a list of the current environment and shell
    variables, as shown in Code Listing 8.1.

    Some of the variables may look familiar to you (the ones showing your shell or
    user name), others are likely to be more cryptic (like the line showing the last
    command you ran, in this case, _cd).


    **To show your current environment in csh:**


    +   - setenv


