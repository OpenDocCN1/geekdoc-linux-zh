    # Controlling Job Priority with nice nice


    Suppose you need an enormous file from the

    Internet that would take practically all afternoon to download. By downloading
    it, you

    would hog system resources and make the

    system response time much slower for other

    users. OK, bad example. Suppose your co-worker needs to download an enormous file

    and would hog system resources all afternoon.

    You''d hope she had the courtesy to

    not tie up system resources that you need

    to use.


    Fortunately, she can, using nice, which lets

    her control job priority. As Code Listing 9.9

    shows, you rank your job''s priority using

    numbers from 1 to 19, with 19 being fabulously

    nice (higher priority) and 19 being fabulous (lower priority). The Unix system
    uses

    the number you provide to determine how

    much attention to devote to the job.


    # To control job order with nice:


    ```

    nice -n 19 slowscript

    ```


    At the prompt, type nice, followed

    by the appropriate adjustment (19, here),

    and the name of the program or script to

    run (Code Listing 9.9). In this example,

    slowscript runs with the lowest priority


    # Tips


    +   - To find how nice you need to be, you

    might check how many processes (and

    which kinds) are currently running on

    the Unix system. You can do this using

    ps, as described later in this chapter.


    +   - You could use nice and run a job in the

    background—example, use nice -n

    12 funscript and to run funscript in the

    background with a niceness level of 12.


    ```

    [ejr-hobbes ejr]$ nice -n 19 slowscript

    ```


    Code Listing 9.9 By using nice plus an adjustment, you

    let Unix determine how hard to work on your job.


    +   - You can just type nice the job name

    (as in sortaos). Doing so will

    automatically specify 10 to the niceness

    level (the default setting).


    +   - If you are the system administrator

    and logged in as root, you can use

    negative numbers (down to -20) with

    nice to increase the priority (nice -n

    16 priorityjob).


    +   - Use renice to change the niceness of a

    running job. (If the job number) you, use renice -n

    18 2958 the system administrator, you can

    or decrease the niceness of any job; if

    you a pea—whoops, we mean a regular\lar computer at your company—you

    can decrease the priority of your

    own jobs, not increase it. In a pinch, you

    could ask your system administrator to

    increase the priority of your job.


