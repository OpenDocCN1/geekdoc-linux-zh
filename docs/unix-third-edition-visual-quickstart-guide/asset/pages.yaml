    In addition to suspending jobs and running them in the foreground and background,
    you can also choose to delete them completely. For example, you might realize
    midway through a job that you found need to redo it. Or perhaps you''ve accessed
    and suspended a man and no longer need to reference it.


    Using kill, you can delete essentially any process running or suspended on the
    Unix system. Code Listing 9.14 shows, you delete a process by first listing the
    processes, then using the kill command.


    Code Listing 9.14 Using kill plus the PID number, you can delete practically any
    process running or suspended in the system.


