  md: '# Locating Files with locate


    If you''re looking for a system file—that is, a program or file that is part of
    the Unix system itself, rather than one of your personal files in your home directory—try
    to find it. You''ll get more than you can handle, but it''s a quick and easy way
    to locate files.


    The locate command isn''t available on all Unix systems, but it is worth a try.
    See Code Listing 2.13 for locate in action.


    To locate a file:


    +   - locate fortune


    If you try to locate fortune, you''ll get a listing of all the system files that
    contain "fortune" in them. This listing includes the fortune program, data files
