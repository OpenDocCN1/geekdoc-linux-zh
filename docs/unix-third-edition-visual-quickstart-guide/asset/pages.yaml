  md: '# Chapter 5


    # # Changing Permissions with chmod


    Suppose you''ve been working on a file called rowyourboat and you want to have
    your coworkers down stream review it. To do so, you''ll need to give other permissions
    to access the document. You can either give people in specific groups or give
    everybody on the Unix system access. In particular, you can specify permissions
    for u(ser-that''s you), g(roup), o(thers), and a(ll).


    In addition to specifying permissions, you can also specify how much access a
    person or group can have to your file. For example, you can specify r(read), w(write),
    and e(execute) access, depending on how you trust them not to ruin your rowyourboat
    masterpiece.


    As shown in Code Listing 5.7, your first step is to check out the current permissions.
    Then, you can set permissions, add to them, or remove them as necessary.


    # To check current permissions:


    +   - ls -l r*

    To begin, type ls -l r* to get a long listing of rowyourboat in the current directory.
    Code Listing 5.7 shows that the permissions are -rwxr-x-. This is actually three
    sets of permissions:

    - For the user (rwx, in this example)

    - For the group (r-x, here)

    - For the world (---, here)

    In this example, the user has read, write, and execute permissions: the group
    has only read and execute permissions; and all other users have no permissions.


    > $ejr@hobbes permissions]$ ls -l r*

    -rwxr-x--- 1 ejrousers 15277 Jul 24 15:10

    → rowyourboat


    Code Listing 5.7 ls -l to see the permissions on files.


    $ejr@hobbes permissions]$'
  merge: -1
