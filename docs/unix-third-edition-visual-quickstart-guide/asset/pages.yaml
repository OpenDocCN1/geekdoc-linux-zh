  md: '# Chapter 1


    # Different types of Unix access


    So, the first question, then, how you might access a Unix system to get started
    with all of this. Given that this is Unix, you have exactly 1.2 bazillion options.
    Let''s look at these options:


    +   - Connect to a shell account

    - Access your company''s (or school''s or organization''s) Unix system

    - Do a Unix-only installation on an old or spare computer

    - Do a Unix/Windows installation on everyday computer


    # Accessing a shell account


    The traditional approach (back in the old days, when we wrote the first version
    of this book) was to connect to a "shell account" provided by your dialup ISP.
    That''s still an option, if you have certain ISPs (even with some broadband connections).
    If your ISP offers a shell account, go ahead and use it; it''s still a good option.


    # Accessing your company''s system


    If not (that is, if you have a cable modem, DSL connection, or dialup connection
    through any of the huge companies that provide Internet access, "not" is the case),
    you still have a ton of options. Check at work; many companies use Unix in a number
    of ways, and if you can provide the system administrator with appropriate quantities
    of cookies or other goodies, you may be able to get Unix system access.


    ![](img/30f4227f5df2c6cea63896bef2fc574f_18_0.png)


