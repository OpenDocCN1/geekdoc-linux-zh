  md: '# To find and act on files:


    +   - find ~/ -name ''*.backup'' -ok rm {} \;

    Type with a wildcard expression, followed by -ok (to execute the following command,
    with confirmation), rm (the command to issue), and {} \; to fill in each file
    found as an argument (an additional piece of information) for the command. If
    you want to, say, compress matching files without confirmation, you might use
    find ~/ -name ''*.backup'' -exec compress {} \; to do the work for you.


