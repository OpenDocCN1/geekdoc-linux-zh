    tell you how long it took, as shown in Code Listing 9.10.


    # To compare jobs with time:


    +   1. time ls /usr


    At the shell prompt, type time followed by a job (here, 1s).


    +   2. time nice -n 19 ls /usr


    Then, type nice followed by another. In this example, we''re comparing a regular
    ls command to a nice 1 command. As Code Listing 9.10 shows, the elapsed time for
    the nice 1 ls command was considered ably longer than the regular 1 ls command.


