  md: '# Being Root


    # Keeping up with watch


    As a system administrator, you practically have to have eyes in back of your head
    and be aware of all kinds of activities that might be going on. The watch command
    is your friend. It keeps an eye on pretty anything (users, system, or files) you
    want to monitor.


    To watch:


    +   - watch last


    Use monitor to output the output of a specific command. When something changes,
    you will see it in the watch output (Figure 16.5). In this case, we''re monitoring
    logged in and when.


    Or


    +   - watch --differences=cumulative


    ```

    ls -l /var/spool/mail

    ```


    You can watch to see if mail is getting delivered by an -1 output from the /var/spool/mail
    directory. The extra flags show cumulative differences since you started watch.


    # ✔ Tips


    +   - The watch utility can be really handy, sometimes it''s easier to do something
    like tail -f /var/log/httpd/access_log to keep track of the Web server access
    log or write a shell script to periodically run last. Basically, it''s not the
    only way to monitor what''s going on.


    +   - On the lighter side, you can use watch to periodically run other programs.
    For example, watch -n 5 fortune will display a new fortune every five seconds.


    ![](img/30f4227f5df2c6cea63896bef2fc574f_353_0.png)


