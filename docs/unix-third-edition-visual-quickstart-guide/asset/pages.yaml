  md: '# Manipulating Files


    # Elimating Duplicates with uniqid


    ✓ Tips


    +   - uniq finds only identical, adjacent (sorted) lines. For example, if you
    have both Jones and jones in your address book, uniq won''t identify every entry
    because they differ in capitalization.


    +   - You also use the -d flag to specify that you want to see only the duplicate
    lines. For example, say want to see all of the people who are in your carpool
    file and your nightly file. You would just use sort carpool | uniq -d


    +   - You can sort and eliminate duplicates in one step with -u address.book.


    If you''ve sorted files with the handy-dandy sort command, you might end up with
    results that have duplicates in them. Here, you might have files with duplicates.
    At any rate, here is how to find and work with them. As Code Listing 6.18 shows,
    you can get duplicate lines by using the uniq command (short for “unique”) in
    conjunction with sort.


    # Eliminate duplicates with uniq:


    +   - sort address.book | uniq

    At the prompt, type sort and the filename, type uniq to pipe the output to uniq.
    The output of uniq will not contain any duplicated entries (Code Listing 6.18).


