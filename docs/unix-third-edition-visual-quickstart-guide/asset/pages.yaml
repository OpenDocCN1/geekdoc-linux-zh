  md: '# Chapter 11


    # To invoke vacation with procmail:


    +   1. pico ~/.procmailrc


    To begin, access your editor and edit the .procmailrc file you previously created
    in your home directory.


    +   2. :0 c


    | /usr/bin/jdoe

    On a new line at the bottom of the file, add the recipe to send a copy (c at the
    end of the first line) of your to vacation program. See Announcing an Absence
    with vacation in this chapter for more information about the vacation program.


    +   3. Save and close the file.


    Now all that you receive will be delivered to stored and passed along for the
    vacation program to respond to.


    # Tips


    +   Your .procmailrc file gets processed in order. As soon as a recipe matches
    an incoming email message, it''s applied. So if your first recipe is the forwarding
    recipe above, procmail will never get to any later recipes. If no recipes are
    matched, mail will be delivered to the DEFAULT location you specified (Configuring
    procmail, earlier).


    +   After you set up your procmail processing, be patient. Sometimes procmail
    processes emails on a specific schedule (hourly, for example), so testing it may
    be a little time-consuming.


    # Sample procmail Recipes


    The following recipes, with annotations, should help you started filtering with
    procmail.


    ```

    # Filter based on the To;, Cc: and similar headers

    :0:

    * ^TO.*awr@.*raycom.com

    $MAILDIR/interesting

    # Filter based on the subject

    :0:

    * ^Subject:.*Status Report.*

    $MAILDIR/status-reports

    # Filter based on sender

    :0:

    *^From:.*spammer@example.com

    $MAILDIR/IN.TO-DELETE

    # Filter directly to garbage, irrevocably, by sender

    :0:

    *^From:.*spammer@example.com

    /dev/null

    # Filter based on size (greater than 1000 bytes)

    :0:

    * > 1000

    $MAILDIR/longish

    ```


    254'
