- img_proc: true
  md: '# Chapter 5


    # To add permissions:


    +   - chmod g+w rowyourboat


    At the shell prompt, enter chmod, fol-followed by


    +   - The category. In this case, we''ve used g, for group, but you could also
    use o for others, ...or, of course, u for user, but you already have that access.
    You could also use a for all users (which includes u, g, and o).


    +   - A plus sign indicates that you''re adding the permission to the existing
    permissions, rather than setting absolute permissions.


    +   - The permissions to grant. Here, we''ve used w, for write permission, but
    you could also use r for read or x for execute permissions, as your needs dictate.


    +   - The filename (rowyourboat)


    # To remove permissions:


    +   - chmod go-w rowyourboat


    At the shell prompt, use chmod go-w plus the filename to remove write permissions
    for everyone except you, the file''s owner. Note that we handled both group and
    other in a single command this time, although we could have used chmod g-w rowyourboat
    and chmod o-w rowyourboat to accomplish the same thing.'
