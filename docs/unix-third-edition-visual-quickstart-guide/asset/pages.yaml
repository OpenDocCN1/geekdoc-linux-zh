  md: '# Monitoring the System


    Monitoring the system is one of the key responsibilities of a system administrator.
    You need to make sure that everything is as it should be, or tell it, call the
    ops, order a new hard drive, or whatever is required. On a single-user system,
    there''s really not much to do, but on a larger system with many users, monitoring
    is a significant part of system administrator''s job.


    Among other things, you can monitor the system logs logged in, and the overall
    system load.


    # To monitor logs:


    +   - sudo tail -1000 /var/log/messages

    - more


    Use sudo to gain root access and look at the end (last 1,000 lines) of the log
    file. The output of tail is piped to more so you can actually read it.


    Or


    +   - sudo tail -f /var/log/httpd/error_log


