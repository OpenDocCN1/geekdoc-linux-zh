  md: '# Using Directories and Files


    # To create a directory:


    +   1. ls


    Start by listing existing directories to make sure the planned name doesn''t conflict
    with an existing directory or filename.


    +   2. mkdir directory


    Type the mkdir command to create a new directory; in this case, it''s called Newdirectory.
    To refer to the sidebarNaming Directories (and Files) for guidelines.


    +   3. ls -l


    Now you can use ls -l (the -1 flag specifies a long format) to look at the listing
    for your directory (Code Listing 2.1). The at the far left of the listing Newdirectory
    indicates that it''s a directory and not a file. After, if you trust Unix to say
    so, you can skip this verification step.


    # Naming Directories (and Files)


    As you start creating directories (and files), keep in mind the following guidelines:


    +   * Directories and files have unique names. For example, you cannot name a
    directory 60lf and a file 60lf. You can, however, have a directory 60lf and a
    file called 60lf. The difference in capitalization makes each name unique. By
    the way, directories are often named with an initial cap, and filenames are all
    lowercase.


    +   * Directory and filenames should not include the following characters: angle
    brackets (<>), parentheses ({}), double quotes ("), asterisks (*), question marks
    (?), pipe symbols (|), slashes (/), pound signs ($), ampersands (&), and tildes
    (~).


    Different shells handle special characters and some will have no problems at all
    with these characters. Generally, though they are more trouble than they''re worth.


    +   * Avoid names that include spaces and hyphens (-). Some programs don''t deal
    with them correctly, so to use spaces and hyphens you have to use odd workarounds.
    Instead, stick to periods and underscores (_) to separate words, characters, or
    numbers.


    +   * Use names that describe the directory''s file''s contents so you easily
    remember them.


    # Tips


    +   * If you attempt to create a directory with a file or directory that already
    exists, Unix will not overwrite the existing directory. Instead, you''ll be told
    that a file name already exists. Try again with a different name.


    +   * If you can create several directories and subdirectories at once with the
    -p flag. For example, if you want to create a new subdirectory called Projects
    with a subdirectory called Cooking and a subdirectory called Desserts in that,
    you can use mkdir -p Projects/Cooking/Desserts and get it all at once. Without
    the -p flag, you have to create Projects, Cooking, then Desserts in order, which
    is a longer recipe to make the same tree structure.'
