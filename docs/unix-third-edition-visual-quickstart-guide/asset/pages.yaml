    Although vi is likely responsible for much of Unix''s reputation for being complicated
    and offering enormous power and flexibility—it will leave tail tales in a single
    bound and do much, much more. Plus, vi is universally available (unlike pico),
    so for these reasons you should consider taking the time to learn it. You might
