  md: '# Linking with ln -s (Soft Links)


    Now suppose you want to pawn your entire workload on your new helper. Rather than
    just give him access to a single file, you''ll want to make it easy for him to
    access your entire project directory. You can do this using soft links (created
    with ln -s), which essentially provide other users with a short-cut to the file
    or directory.


    Like hard links, soft links allow a file to be in more than one place at a time;
    however, with soft links, there''s only one copy of it and, with soft links, you
    can link directories as well. The linked file or directory—that is, if the original
    file or directory is deleted, the linked file or directory will no longer be available.


    Soft links are particularly handy because they work for directories as well as
    individual files, and they work across different file systems (that is, not within
    /home, but any-where on the Unix system).


    Like hard links, soft links sometimes require that you have access to another
    user''s directory and files. See Chapter 5 for more on file permissions and ownership
    and Chapter 7 for the lowdown on file systems.'
