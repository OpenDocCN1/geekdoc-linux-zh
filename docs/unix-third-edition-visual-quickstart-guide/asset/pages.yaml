  md: '# # CONTROLLING OWNERSHIP & PERMISSIONS 5


    Unix and Unix-like operating systems are multiuser systems in which your files
    are separate from Jane''s files, which are separate from Joe''s files, and so
    on. Any file you create is separate from other users'' files and usually cannot
    be directly accessed by Jane, Joe, or any other user.


    Occasionally, though, you will need to share files. For example, you might be
    collaborating on a project with Jane where sharing files (rather than creating
    and maintaining separate ones) is essential.


    This chapter provides an overview of Unix file permissions and ownership. For
    many systems, though, only the root user can make ownership changes, so you may
    have to ask for help from your system administrator to actually do this.


    +   Chapter Contents

    * Understanding file ownership and permissions

    * Finding out who owns

    * Finding out which group you''re in

    * Changing the group association of files and directories

    * Changing ownership of files and directories

    * Changing permissions

    * Translating mnemonic permissions to numeric permissions

    * Changing permission defaults'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# Chapter 5


    # Understanding File Ownership and Permissions


    Unix provides three levels of file ownership:


    +   **User.** Refers to the single userid that''s primarily in charge of the file.
    You have this level of ownership for the files you create.

    * **Group.** Refers to the group (of users) associated with a specific file. All
    users within a group have the same permissions for interacting with a file.

    * **Other.** Refers to any users not identified with either the group or user
    for a file.


    Within these groups, you can specify permissions for file access and rights in
    three categories:


    +   * **Read.** Users with read permission can only view a file; they cannot make
    changes to it.

    * **Write.** Users with write permission can make changes to or delete a file.

    * **Execute.** Users with execute permission can run files (programs or scripts)
    and view directories.


    # Tips


    +   * An interesting twist on this whole ownership issue is that not all ''owners''
    are people. Processes or processes (discussed in Chapter 9) run as a specific
    user, and if they create files, they have permissions reflecting the individual
    and group membership of the program. See Chapter 9 for more information.

    * Some Unix-like operating systems have additional or supplementary means of controlling
    access to specific files. Usually, though, you''ll know if such a system is in
    use. For now, just know that such things exist; the procedures in this chapter
    will handle 95 percent of your needs.


    In this chapter, we''ll show you some of the commands that can be used (sometimes
    by, usually by the root user) to set ownership and permissions. Keep in mind that
    you can set or change any permissions for files you create and permissions by
    others; however, exactly which permissions and ownership depends on the system.
    If you don''t currently need to change file ownership or permissions, you should
    take a quick read through this chapter to see what options might be available
    to you.


    98'
