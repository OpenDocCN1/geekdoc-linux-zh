  md: 'PATH=/usr/bin:/usr/local/bin:/bin

    Specify the path for your executable programs. It''s a good idea to do this, just
    in case you eventually use procmail to more extensively filter or autorespond
    to messages.


    DEFAULT=/var/spool/mail/yourid

    Specify the location for your incoming mail. Remember, the filter gets the mail
    before it reaches the in-box, so you need to tell procmail where your in-box is.
    Check with your system administrator to confirm the DEFAULT. (/var/spool/mail/yourid
    is typically, but not always, the location, obviously with your real user)


    MAILDIR~=$HOME/mail

    Specify where procmail should find your mail program and all information it creates.
    If you''re using pine, you will probably type this line exactly as shown. If you''re
    using mutt, you might need to use Mail instead of procmail.


    # To turn on procmail filtering:


    +   1. pico ~/forward

    Use your favorite editor to create a .forward file in your home directory.


    +   2. "IFS='' '' & && exec /usr/bin/procmail -f- || exit 75 #yourid

