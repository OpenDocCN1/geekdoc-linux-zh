    As you begin Unix and start moving around in directories and files, you''re likely
    to get a bit lost—that is, forget which directory or subdirectory you are. You
    can use the **pwd** command to get a reminder of where you are, shown in **Code
    List 1.5.**


    You can request the directory name, or you can get fancy and request the directory’s
    name and contents, courtesy of ls:


    **To find out the name of the current directory:**


    +   * pwd


    This command displays the path and name of the directory you are currently in.
    The path names "above" the current directory, giving you the full picture of where
    you are in relationship to the system root.


    **To find out the name of the current directory and its contents:**


    +   * ls ; pwd


    By combining **ls** and **pwd** commands, you can request the directory’s contents
    and name, as shown in Code List 1.5.


    # ## Tips


    +   * Type in **pwd** immediately after you log in. You''ll see where your home
    directory is in the overall system (aka the full path name for your home directory).


    +   * On some Unix systems, you won''t need to use **pwd** to find out where you
    are. Some systems display the current directory at the shell prompt by default—something
    like `/home/ejr/`. If you''d like to add or get rid of this, or if you want more
    information about shells and customizing your shell, see Chapter 8, Configuring
    Your Unix Environment.


    **Code List 1.5** displays the name of the current directory, which is particularly
