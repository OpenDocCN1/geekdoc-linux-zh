  md: '# Chapter 9


    # Suspending Jobs


    Suppose you''ve started a job that requires no input from you—say, downloading
    multiple files with ftp—you suddenly realize that you''ve got to finish something
    else. Instead of waiting for the files to download or stopping the job, you can
    just suspend the job and resume it later (Listing 9.5). In doing so, you can make
    the Unix system work—that is, you don''t lose the progress you''ve made toward
    getting the job done, and you can do the other stuff you need to do as well.


    ```

    [ejr/hobbes ej$] ftp calvin.raycom.com

    Connected to calvin.raycom.com.

    220 calvin Microsoft FTP Service

    → (Version 2.0).

    Name (calvin.raycom.com:ejr): anonymous

    331 Anonymous access allowed, send identity

    → (e-mail name) as password.

    Password:

    230 Anonymous user logged in.

    Remote system type is Windows_NT.

    ftp

    [1]+ Stopped calvin.raycom.com

    [ejr/hobbes ej$]

    ```


    # To suspend a job:


    +   - Ctrl Z

    While the job is running, press these keys to suspend the process (Listing 9.5).

    Ctrl Z doesn''t terminate the process; it pauses the job in the same way that
    pressing the Pause button on your CD player.


    # Tips


    +   - After you''ve suspended a job, you can restart it in the background using
    bg, restart it in the foreground using fg, check on its status using jobs, or
    delete it using kill. Refer to the appropriate sections in this chapter for details
    on using these commands.

    - You can suspend as many jobs at a time as you want. Just use Ctrl Z to do so,
    then use jobs to check the status of each suspended job if you need to.

    - Because it''s easy to forget that you''ve suspended a job, most shells will
    remember that "there are stopped jobs" when you try to log out of the system.
    You should either resume the job or kill it before you log out. Yes, the Unix
    system uses the terms "stopped jobs" and "suspended jobs" more or less interchangeably.


    200


    SUSPENDING JOBS'
