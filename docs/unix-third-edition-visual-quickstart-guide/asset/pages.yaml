  md: '# Chapter 16


    # Starting, Stopping, and Restarting Daemons


    As root, you can do anything on the system, but you shouldn''t have much to do
    at all. Generally, Unix (or Linux) systems are configured so the programs that
    should be running all the time (like the Web server software, mail server software,
    or similar programs) are automatically started in the background when the system
    is booted. Then you, as root, need only handle crises and problems. (Ha! Easier
    said than done.)


    That said, sometimes you''ll need to start or stop these daemons (programs running
    in the background—Chapter 9 for details). Say, for example, that you get an email
    from one of the system users complaining that the Web server (or, technically,
    the httpd daemon) isn''t running. As the system administrator, you''ll have to
    start it.


    # To start a daemon:


    +   1. ps -ef | grep httpd


    Verify that the Web server isn''t running. Sometimes users are wrong. If you see
    lines that list httpd (other than the one that reports the command you''re running),
    httpd is active and doesn''t need to be started. The problem may lie elsewhere.


    +   2. cd /etc/init.d


    Change to the directory containing the generic init (for initialization) scripts.
    This directory is likely /etc/init.d or /etc/rc.d/init.d/, as Code Listing 16.4
    shows.


    STARTING, STOPPING, AND RESTARTING DAEMONS


