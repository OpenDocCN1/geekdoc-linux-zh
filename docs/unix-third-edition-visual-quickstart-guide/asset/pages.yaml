  md: '# Finding Forgotten Files with find


    Where, oh where, did that file go? Sometimes finding a file requires more than
    cursing at your computer or listing directory contents with ls. Instead, you can
    use the find command, which lets search in dozens of ways, including through the
    entire directory tree (Code Listing 2.11) or through directories you specify (Code
    Listing 2.12).


    To find a file:


    +   - find -name lostfile -print

    Along with the find command, which specifies to find in the current directory
    with a dot (.), provide the filename (-name lostfile), and specify that the results
    are printed onscreen (-print). See Code Listing 2.11.


    ```

    $ find -name lostfile -print

    ./Projects/schedule/lostfile

    $

    ```


    Code Listing 2.11 Use find to locate a missing file.


    ```

    $ find /home/deb -name ''pending*'' -print

    /home/deb/Projects/schedule/pending.tasks

    $ find /home/deb/home/ejr -name

    ''pending*'' -print

    ```


    /home/deb/Projects/schedule/pending.tasks

    /home/deb/home/ejr/jobs.to.do.today.do


    Code Listing 2.12 By using wildcards and specifying multiple directories, you
    can find yet more powerful.


    To find files in a specific directory:


    +   - find /home/deb -name ''pending*''

    -print


    This command finds all of the files with names starting with pending under Deb''s
    home directory. You must use single quotes if you would like a wildcard to search.


    Or, you can find files in multiple directories at one time, like this:


    +   - find /home/deb /home/ejr -name

    ''pending*'' -print


    This command finds files with names starting with pending in Deb''s and Eric''s
    home directories or any subdirectories (Code Listing 2.12).'
