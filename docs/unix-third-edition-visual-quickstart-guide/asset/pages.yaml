    # Finding Differences in Files with diff


    In addition to using cmp to find out how files differ, you can also use diff.
    This command tells you where two files differ, not just that they differ and at
    which point differences start (see Code Listing 6.15).


    To find differences with diff:


    +   * diff dearliza dearhenry

    Type diff, followed by both filenames. The diff output, in Code Listing 6.15,
    shows lines that appear only in one file or the other. The lines from file 1 are
    indicated with <, with the lines from file 2 are indicated with >.

    Above each line are the affected numbers in the first file, then d, a, or c, then
    the corresponding line numbers from the second file:

    * d means the line would have to be deleted from file 1 to make it match file
    2.

    * a means that text would have to be added to file 1 to match file 2.

    * c means that changes would have to be made to the line for the two files to
    match.


    Listing 6.15 tells you all you want to know about the differences between two
    files but not in an easily readable manner.


    > Tip


    +   * If you''re comparing email messages or other less-structured documents,
    you might consider the flags -i (case insensitive), -b (ignore blank lines), or
    even -w (ignore spaces and tabs) to avoid cluttering your results with unimportant
    differences. For example, you could use diff -iw file1 file2 to find all differences
    between two files except those blank lines, spaces, tabs, or lowercase/uppercase
    letters.


