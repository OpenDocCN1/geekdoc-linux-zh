    Go ahead, type your signature information (Figure 11.13). We recommend that your
    .signature file include, at minimum, your name and email address. You can also
    add funny sayings ("You know you''re a geek when you refer to going to the bathroom
    as "downloading") or disclaimers ("My opinions are mine and not my company''s.\
    Whatever you want, really. Keep your signature nature as short as possible; long
    signatures are hard to read.


