  md: '# Viewing File Beginnings with head


    Using head, as shown in Code Listing 6.3, you can find out in a jiffy what''s
    in a file by viewing the few lines. This is particularly handy when you''re browsing
    file listings or trying to find a specific file among others with similar content.


    To view file beginnings with head:


    +   - head honeydo

    At the prompt, type head followed by the filename. As Code Listing 6.3 shows,
    you''ll see the first ten lines on the screen. Notice that "lines" are defined
    by head returns, so a line could, in some cases, wrap to many screen lines.


    ```

    [ejr@hobbes manipulate]$ head honeydo

