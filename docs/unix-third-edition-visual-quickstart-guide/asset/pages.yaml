  md: '# Chapter 4


    # Choosing an Editor


    Basically, all editors are designed to do the same things: enable you to create,
    modify, and save text files. These files include configuration files, email messages,
    or scripts—essentially any text file you can create. Exactly which editor you
    choose is up to you, on your specific needs and how much you''re willing to learn.


    In this book, we''ll stick to biggers—pico, vi, and emacs—which will likely give
    you all the capabilities you''ll need. Because pico is (arguably) the easiest
    Unix editor to use, vi is one of the most powerful and is available on almost
    every Unix system, emacs provides an unbelievable number of options for the up-coming
    Unix pro to have.


    # About pico


    pico is one of the most straightforward Unix editors and has become quite popular
    because it''s extremely easy to use. In particular, as shown in Figure 4.1, it''s
    menu-driven and intuitive. All of the commands are visible, and you can open,
    modify, and close files with little effort. pico is a great choice if you''re
    just getting started with Unix or if you won''t be needing an editor able to leap
    tall files in a single bound.


    pico is distributed with the pine email program, so if you have pine available
    to you, you likely have pico. (See Chapter 1 for a reminder on how to find out
    if pine and pico are available to you.) If pico is not available to you, ask your
    system administrator to install it.


    ```

    File: limerick


    There was a man from Manchester,

    He carried his luck in a bucket,

    He filled it with wit,

    As he was a whole silly,

    If he just had a doubt-he didn''t do it.

    ```


