  md: "# Creating and Editing Files\n\n# # Starting vi and Dabbling\nwith It\n\nBefore\
    \ you go running off to vi, understand that it has two modes (both of which look\
    \ pretty much like **Figure 4.11**):\n\n+   * **Input mode** (sometimes called\
    \ insert mode), in which the keys you press show up in the file you're editing.\
    \ Use this mode to add or change text.\n* **Command mode**, in which every keystroke\
    \ is interpreted as a command. You use this mode to do everything except text.\n\
    \nWhat's confusing for many people about vi is that it starts you in command mode,\
    \ meaning that if you just start typing, you may see blank spaces, characters,\
    \ and bits of words that you type—essentially, a bunch of garbage that does not\
    \ represent what you're typing—and you'll hear a lot of beeping. So, as we'll\
    \ show you in the following steps, you'll need to access the input mode as soon\
    \ as you start vi.\n\nTo start vi:\n\n+   1. vi\n   At the shell prompt, type\
    \ vi. The program starts up and you'll see something like Figure 4.11. The ~ symbols\
    \ show blank lines below the end of the file.\n2. i\n   Type i to get into input\
    \ mode. This itself is a command issued in command mode, so it won't show up on\
    \ the screen.\n\n![](img/30f4227f5df2c6cea63896bef2fc574f_97_0.png)\n\n**Figure\
    \ 4.11** The vi editor inundates you with tons of onscreen help and advice, as\
    \ shown here. Well, documentation is available, but the vi interface itself isn't\
    \ really helpful at all!\n\ncontinues on next page\n\nSTARTING VI AND DABBLING\
    \ WITH IT\n\n83"
