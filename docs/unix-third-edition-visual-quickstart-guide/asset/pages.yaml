    (`cc:`) and the `Subject:` line. See the sidebar called *Our Two Cents on the
    Subject of Subjects* for details about including subject lines.



    If you''re sending an attachment, type in the Unix format (path, if appropriate)
    on the `Attmnt:` line. For example, type `~/myfile`, which includes the full path
    name and the filename.


