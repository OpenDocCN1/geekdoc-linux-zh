  md: '# Chapter 8


    # # Adding or Changing Variables


    After you''ve poked around in your environment, you might determine that you want
    to set a variable that''s currently not available or change one to make it better
    your needs. In general, you won''t randomly specify variables; you''ll do it because
    a certain program requires a specific variable in order to run.


    # ## Variables You Can Mess With


    The following table includes some of the variables you can safely change. Keep
    in mind the shell itself might not use a specific variable, like NNTPSERVER, while
    programs running under the shell might. Sometimes shells assign default variables,
    while in other cases you''ll have to manually set them.


    | ZSH, BASH, AND KSH | CSM | Specifies the search path for directories specified
    by cd. This is similar to PATH. |

    | CDPATH | | Specifies the width of the edit window in characters. |

    | COLUMNS | | Specifies the default editor. |

    | EDITOR | | Specifies where to look for configuration files. |

    | ENV | | Specifies the name of the file containing the command history. |

    | HISTFILE | savehist | Specifies the maximum number of lines to keep in the history
    file. |

    | HISTFILESIZE | history | Specifies the number of commands to keep in the command
    history. |

    | HOSTFILE | | Specifies the name of the file containing name aliases for aliases.
    |

    | IGNOREEOF= | ignoreeof | Specifies that (Ctrl+D) should not log out of the shell.
    |

    | LINES | | Specifies the location of incoming mail so bash can notify you of
    mail arrival. |

    | MAIL | | | Specifies how often (in seconds) checks for mail. |

    | MAIL_WARNING | | Specifies the message to be displayed if you have read mail
    but not reread mail. |

    | noclobber | noclobber | Specifies that the shell should not overwrite an existing
    file when redirecting output. |

    | PATH | path | Specifies the search path for commands, including multiple paths
    separated by colons. |

    | PROMPT_COMMAND | | Specifies the command to run before displaying each primary
    prompt (does not apply to ksh). |

    | PS1 | prompt | Specifies the primary prompt. |

    | PS2 | | Specifies the second-level prompt. |

    | PS3 | | Specifies the prompt for the select command in scripts. |

    | PS4 | | Specifies the prompt used when tracing execution of a script. |

    | TMOUT | | Specifies time to wait for input before closing the shell. |

    | VISUAL | | Specifies the default visual editor—usually the same as EDITOR, but
    referenced by other programs. |


