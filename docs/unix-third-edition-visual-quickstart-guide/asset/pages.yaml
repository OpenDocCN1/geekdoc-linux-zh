  md: '# Chapter 17


    # # Making Backups

    with rsync


    rsync utility is a fancy way to synchronize files, directories either locally
    or across a network. We like to use it to make backups so we don''t have to worry
    when we mess something up. Yes, we could cp or something equally boring, but we
    like the speed and flexibility of rsync. In this example, we''re copying files
    locally, but can as easily be making remote backups to another server else.


    To make backups with rsync:


    +   1. `mkdir ~/.BACKUPDIR`nCreate a directory to house your backups. You''ll
    create the directory on a different physical disk from the stuff you''re backing
    up, but do what you want. We''re creating a backup directory that''s a subfolder
    of the home directory, which will help protect against self-inflicted damages
    but not a disk failure. We trust the system administrator for protecting against
    disk failures... Eric, you are up-to-date on our backups, aren''t you?

