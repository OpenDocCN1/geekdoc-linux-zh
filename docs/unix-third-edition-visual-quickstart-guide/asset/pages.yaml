  md: "# Chapter 10\n\n# # Creating If-Then\nStatements\n\nThe basic principle of\
    \ if-then statements is that if a condition is met, then one thing happens; if\
    \ the condition is not met, then another thing happens. That is, if you walk into\
    \ your office in the morning and you see your daily to-do list, then you sit down\
    \ and work. If you walk into your office in the morning and don't see your to-do\
    \ list, then you get to lounge all day. Or something like that.\n\nAs **10.6**\
    \ shows, you can create if-then statements using if, then, and else commands.\
    \ When you set up these conditional statements, the computer has to test the condition\
    \ to determine whether it's true or false, and in the next example, we set up\
    \ a fairly simple if-then conditional statement requiring the computer to test\
    \ whether or not a file exists and tell us what it finds. Use the following steps\
    \ to get started with if-then statements, and see the **More on If-Then** in this\
    \ section to learn how to expand your if-then statements.\n\n**To write an if-then\
    \ conditional statement:**\n\n+   1. vi\n\n   To begin, access your editor and\
    \ the script file. Here we're adapting the existing script (for feedback) in vi.\n\
    \n```\n```!/bin/bash\n# This is my first shell script\necho \"Greetings!\"\necho\
    \ \"You were most recently working on today!#\"\n\nif ls | grep feedback > /dev/null;\
    \ then\n    echo \"There's feedback working on the interest project\"\nelse\n\
    \    echo \"Hope, no feedback yet\"\nfi\n```\n```\n\n![](img/30f4227f5df2c6cea63896bef2fc574f_236_0.png)\n\
    \n222"
