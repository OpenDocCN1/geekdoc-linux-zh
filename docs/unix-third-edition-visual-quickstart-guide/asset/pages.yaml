  md: '# Chapter 12


    # # Communicating with

    Other Users talk


    You can have a real-time, two-way conversation (very much like instant-messaging
    chat) with another user logged into the system by using talk. As Figure 12.5 shows,
    you type your messages, the other person types his, and you can see both the exchanges
    onscreen.


    # ### To communicate with other users

    using talk:


    +   1. talk deb

    At the shell prompt, type talk and the userid of the person to whom you want to
    talk. The other user will be prompted to enter talk and your userid. You''ll see
    the screen, as shown in Figure 12.5.


    +   2. You wouldn''t have believed it! I had just chased the dog for six blocks...
    Yoah, the stink'' pooch always thinks the garbage truck is stealing our stuff...
    Right. Hilarious. Anyway, I was huffing and puffing on the front porch, when a
    neighbor informed me that some kids were rooting through my trash. Like, What
    did they expect to find? Old panty hose and coffee filters? Nawww. I stopped using
    panty hose for coffee filters a long time ago. I made look too tan.

    Type anything you want. Every keystroke will show up on the other person''s screen,
    so they''ll see exactly how quickly (and how well) type.


    +   3. `Ctrl|C`nWhen you''re finished, break the connection.


    ![](img/30f4227f5df2c6cea63896bef2fc574f_276_0.png)


    **Figure 12.5** talk lets you have a real-time, two-way online conversation.


    # ## Tips


    +   - You can also talk to people logged in other Unix systems. Just use talk
    userid@wherever.com. Of course, fill in the other person''s actual userid and
    address, which will be the same as that person''s email address. Firewalls—but
    not block these chats, though.


    +   - If someone requests a talk with you, just type talk and the person''s (or
    userid@wherever.com, if the person''s name isn''t the same as yours).


    +   - As with, you can type n and mes y at the shell prompt to turn talk off and
    on the current session.


    +   - Though talk is not as groovy as some of the GUI-based instant messaging
    programs, it''s still pretty cool, huh? It''s a good way to ask for help from
    experienced users on your system.


