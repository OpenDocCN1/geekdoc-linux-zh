  md: '# Chapter 12


    # # Tracing Connections

    with traceroute


    When you''re connecting to a remote computer, you''re actually connecting through
    a series of computers (and routers and other expensive Internet stuff). That is,
    your computer connects to another computer, which connects to another, which connects
    to yet another, and so on until your computer connects to the one you''re trying
    to reach.


    The data that you''re sending or receiving actually meanders through the path
    in packets (little chunks of data) that are reassembled into the correct sequence
    at the other end. But not all packets take the same route from the sending computer
    to the destination computer. Communication on the Internet is much like sending
    a lot of letters than making a telephone call. It''s a bunch of little messages
    being passed along, not a continuous connection.


    TRACING CONNECTIONS WITH traceroute


    ```

    ejray> traceroute www.yahoo.com

    traceroute to www.yahoo.com (204.71.200.75), 30 hops max, 40 byte packets

    1 198.60.22.1 (198.60.22.1) 8 ms 2 ms 3 ms

    2 903.Hss5-0-0.GW1.SL1.ALTER.Net (157.130.160.141) 18 ms 13 ms 14 ms

    3 124.ATM-0-0.CR1.SF01.Alter.Net (137.39.63.6.9) 68 ms 65 ms 52 ms

    4 311.atm-0-gw1.sfol.alter.net (137.39.13.49) 60 ms 50 ms 39 ms

    5 Hss5-0-1.BR1.NUI.globalcenter.net (157.130.193.150) 40 ms 39 ms 28 ms

    6 pos0-1-155m,wr1.NUI.globalcenter.net (206.132.160.25) 30 ms 48 ms 42 ms

    7 pos1-0-622m,wr1.SNV.globalcenter.net (206.251.0.74) 50 ms 67 ms 61 ms

    8 pos5-0-155m,CR1.SNV.globalcenter.net (206.251.0.105) 48 ms 40 ms 41 ms

    9 www.yahoo.com (204.71.200.75) 43 ms 50 ms 53 ms

    ejray>

    ```


    **Code List 12.6** Using traceroute, you can see how data meanders between your
    computer and a remote computer.


