  md: '# Chapter 1


    # Logging In


    After you''ve connected to the Unix system, your next step is to log in, or identify
    yourself to the system. Logging serves several purposes, giving you access to
    your email, files, and configurations. It also keeps you from inadvertently accessing
    someone else''s files and settings, and it keeps you from making changes to the
    system itself.


    To log in:


    +   1. Have your user (user identification) and password ready.

    Contact your system administrator if you don''t have these.


    +   2. Type your username at the login prompt, then press Enter.

    Your user is case-sensitive, so be sure you type it exactly as your system administrator
    instructed.


    +   3. Type your password at the password prompt, then press Enter.

    Your password is case-sensitive, too.


    +   4. Read the information and messages that come on the screen.

    The information that pops up—the message of the day—might be funny, as in Figure
    1.4, or it might contain information about system policies, warnings about scheduled
    downtime, useful tips, as shown in Figure 1.5. It may contain both, or彼此, if your
    system administrators have nothing to say to you.


    After you''ve logged in, you''ll see a prompt, which is where you type commands.
    Also, note that you''ll be in your home directory, which is where your personal
    files and settings are stored. Your "location" in the system is a slightly unwieldy
    concept that we''ll help you understand through this chapter.


    ```

    jdoe@frazzy.raycomm.com:~home/jdoe

    login: jdoe

    password: jdoe

    Welcome to Fraz.

    If you''re not authorized to use this system

    ```


    Figure 1.4 Upon the Unix system (frazzy.raycomm.com) greets us with a quote of
    the day, a called "fortune."


    ```

    U(R)n Unix Release 8.4 (amix)

    Welcome to Internet Access

    Help: type "?"

    login: jdoe

    password:

    Last login: Mon Jan 20 11:38 from tallis.raycomm.com

    Kernel Version 5.5.0-1-Generic

    General commands: type "help" or "helpcommand".

    Type "help" for a list of commands or "helpcommand".

    Type "status" for a summary of your current account account information.

    Type "help" for a list of online commands or "menu" for the assisted menus.

    ```


    Figure 1.5 Some messages might greet you with system information or helpful tips.


    # Tips


    +   If you get an error message after attempting to log in, just try again. You
    likely just misspelled your username or password. Whoops!


    +   When you log in, you might see a message about failed login attempts. If unsuccessfully
    tried to log in, don''t worry about it; the message just confirms that you attempted
    to log failed. However, if all of your logins have been successful or if the number
    of failed login attempts seems high—say, five or more—then you might also mention
    the message to your system administrator, who can check security and login attempts.
    This could be a warning that someone unauthorized is trying to log in as you.


    # 10'
