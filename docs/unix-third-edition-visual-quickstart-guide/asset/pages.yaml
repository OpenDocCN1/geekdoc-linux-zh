  md: '# Piping Input and Output


    In general, you can think of each Unix command (ls, cd, and so) as an individual
    program that Unix executes. For example, if you type cat /etc/mold Unix will display
    the contents of mold in the /etc directory. Each program requires input in this
    example, cat, the program takes the contents of /etc/mold as input and produces
    output (the displayed results).


    Frequently, you''ll want to run programs in sequence. For example, you can tell
    Unix to read your resume and spell-check it. In doing this, you connect two commands
    together and have them run in sequence. This process, which you connect the output
    of one program to the next, is called piping. Depending on what you want to do,
    you can pipe many commands as you want—with the output of each command acting
    as the input.


    As Figure 1.7 shows, you pipe commands together using the pipe symbol, which is
    | In the following example, we pipe the output of the ls command (which lists
    the contents of a directory) to the more command (which lets you read results
    at one screen at a time). For details about more, see Viewing File Contents later
    in this chapter.


    # To pipe commands:


    +   - ls more


    Here, also you include a pipe symbol between the two commands, with a space on
    both sides of the pipe. This code produces a list of the files in the current
    directory, then pipes the results to more, which lists the results one screen
    at a time (see Figure 1.7).


    ```

    $ jdoe@frazz.raycom.com | /bin

    [jdoe@frazz bin]$$ ls | more

    arch*

    awk

    basename*

    bash*

    bash20

    cat*

    chbrt

    chmod

    chown

    consolechars*

    cmp*\cpio*

    csh0

    cut*

    date*

    dd*

    dr*

    dmesg

    dnsomainname@

    doeexec

    domainname

    echo

    --More

    ```


    Figure 1.7 To execute multiple commands in sequence, pipe them using the pipe
    symbol ( | ).


    # Tips


    +   - If you want to pipe more than two commands, you can just keep adding the
    commands (with a pipe symbol in between, like |) in the order you want them executed.


    +   - Remember that the output of each command is piped to the next. So a piped
    command, as ls | sort, could list files within a directory, then spell-check the
    list, then sort the misspelled and display them onscreen. The filenames that are
    found in the system dictionary would not appear.


    +   - Venture to Chapter 15 to find more about running a spell-checker and Chapter
    6 to find out about sorting.


