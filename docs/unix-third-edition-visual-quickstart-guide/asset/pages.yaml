    these programs as mail clients and might

    have used ones like Thunderbird, Eudora,

    Outlook Express, or Mozilla mail program,

    Messenger. These are handy because they

    usually have a spiffy interface and can

    handle attachments without a lot of hassle

    on your part, but they''re not really Unix

    email programs. These programs also let

    You store your mail on your desktop system (Windows or Macintosh or even)

    Unix desktops, but those are beyond the

    scope of this book.


    +   - An email program that you access and

    directly on the Unix system. These

    programs, such as pine, mutt, and mail,

    let you send and receive email easily.

    Additionally, pine and mutt let you send

    attachments with not a lot of hubbub.

    Because the mail remains on the Unix

    system, you can access your mail from

    anyplace you can access the Internet.


