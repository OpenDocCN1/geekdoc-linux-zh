  md: "# Adding to Your zsh path\n\nOne of the most useful changes you can make to\
    \ your environment is adding to the default path, which is determined by the path\
    \ statement. The path statement tells the shell to look for commands, scripts,\
    \ and programs. That is, if you issue a command, the path statement tells you\
    \ to look for that command in each of the named directories in a specific order.\n\
    \n```\njdoe@sulley ~ tail .zshrc\n\n# See comment at top.\nif [[ ! -r $(ZDOTDIR:-$HOME)/.zshrc\
    \ ]]; then\n  if [[ -d /usr/share/zsh/$ZSH_VERSION/zsh_default ]]; then\n    source\
    \ /usr/share/zsh/$ZSH_VERSION/zsh_default\n  fi\nfi\n```\n\nBe not to remove anything\
    \ unless you really know what you're doing, but feel free to add as many additional\
    \ directories as you want. For example, if you get writing scripts (described\
    \ in Chapter 10), you might put them in a scripts subdirectory and add that directory\
    \ to your path.\n\nfi\n\nPATH=/usr/bin:/opt/bin\n\njdoe@sulley ~ $\n\n> **Code\
    \ Listing 8.6** You should find your path statement in your configuration files.\n\
