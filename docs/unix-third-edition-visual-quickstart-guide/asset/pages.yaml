    # Good Aliases to Set


    Here are a few aliases you might find worthwhile to set on your system:


    +   * alias rm="rm -i" causes the shell prompt to prompt you about deletions.

    * alias quit="logout" lets you use quit as a synonym for logout.

    * alias homepage="lynx http://www.raycomm.com/" lets you use homepage to start
    the lynx browser and connect to the Raycomm home page (substitute your home page
    necessary).


    Or, if you''re coming from a DOS background, you might find the following aliases
    handy:


    +   * alias dir="ls -l" lets you use dir to list files.

    * alias copy="cp -cp" lets you use copy to copy files.

    * alias rename="mv" lets you use rename to move or rename files.

    * alias md="mkdir" lets you use md to make a directory.

    * alias rd="rmdir" lets you use rd to remove a directory.


