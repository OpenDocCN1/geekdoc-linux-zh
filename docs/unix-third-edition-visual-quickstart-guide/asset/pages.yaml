  md: '# Changing the Group Association of Files and Directories with chgrp


    Suppose you have a file called black that is currently being used by the pot group
    and you want to change the file''s permissions so that it can be accessed by the
    kettle group. To do this, you''ll need to change which group the file is associated
    with—in this case, change the association from the pot group to the kettle group.
    You can change which group file or directory is associated with using chgrp, as
    shown in Code List 5.5.


    To change group association with chgrp:


    +   1. ls -l


    Type ls -l at the shell prompt to verify the file''s name and that it''s associated
    with. Remember that the second column in the middle of the listing, just before
    the file sizes, lists the group membership.


    +   2. chgrp kettle black


    Type chgrp followed by the name of the new group you want the file to be associated
    with and the filename. Here, the chgrp command changes the group association for
    the file black to the kettle group.


    ```

    [ej@hobbes permissions]$ ls -l

    total 178

    -rw-rw-r- 1 ej pot 24850 Jul 24 14:59 black

    -rw-rw-r- 1 ej 128888 Jul 24 14:33 sage.say

    -rw-rw-r- 1 ej 23890 Jul 24 14:33 sayings

    [ej@hobbes permissions]$ chgrp kettle black

    [ej@hobbes permissions]$ ls -l

    total 178

    -rw-rw-r- 1 ej kettle 24850 Jul 24 14:59 black

    -rw-rw-r- 1 ej 128888 Jul 24 14:33 sage.say

    -rw-rw-r- 1 ej 23890 Jul 24 14:33 sayings

    ```


    Code List 5.5 Pots and kettles can both be black, but only one at a time.


    103'
