    Occasionally, you may need a bit of help remembering what a particular command
    does. Using man (which is short for "manual”), you can look up information about
    commands and pointers using them efficiently. Figure 1.9 shows a Unix help page
    (also called a man page, for obvious reasons) for passwords. In the following
    steps, we will show you how to look up Unix commands and related topics.


    To access a man page:


    +   - man passwd


