    |---|---|---|---|---||}{

    | Exit | Justify | Share | Next Page | Halt Text | Spell |


    Figure 4.1 pico offers onscreen command reminders to make it easier to use.


    # Editors Abound


    By the way, dozens of other editors exist, such as


    +   - ed, ex., and red, which are simple (in functionality but not necessarily
    usage) line-by-line editors

    - joe and jed, which are fairly simple editors and comparable to pico in many
