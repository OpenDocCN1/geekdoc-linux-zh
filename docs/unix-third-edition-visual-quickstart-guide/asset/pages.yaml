    **Code Listing 5.9** Use umask to set default permissions for future files.


    # To set default file-creation permissions with umask:


    +   - umask 022


    Enter umask plus the number calculated in the previous steps in this section **(Code
    Listing 5.9).**


    # ## Tips


    +   - Any changes made with umask apply only to the current shell session. If
    you want to revert to the default permissions but don''t remember what they were,
    just log out and log back in and you''ll be back to normal.


    +   - If you want to change permission permanently—or at least beyond the current
    shell session—change them in the configuration files as discussed in Chapter 8.


    +   - You cannot set the default permissions to include execute permission; it''s
    a security feature, not an omission in Unix''s capabilities. For example, suppose
    you make a new file and copy your favorite commands (or the ones you often forget)
    into it. If you accidentally type the filename, and the file is executable, you''ll
    run that list of commands and the consequences could be unfortunate. Therefore,
    you have to explicitly grant execute permission for all files.


    +   - Yes, 666 is considered the Number of the Beast. We think it''s just a coincidence,
    but given the potential for confusion in this section, we''re not sure.


    +   - Use umask or umask -s (depending on your specific shell and environment
    settings) to display your current umask settings.


