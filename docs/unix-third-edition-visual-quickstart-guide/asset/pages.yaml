  md: '# Unarchiving Files with tar


    You''ll also use tar to unarchive files, where you take all of the individual
    files out of the single tar file—like dumping the bunch of toys out of the toy
    box—as shown in Code Listing 13.6.


    # To unarchive files with tar:


    +   - tar -xf labrea.tar


    At the prompt, type tar -xf (here, x means extract) followed by the name of the
    tarred file you want to unarchive. The bunch of once will be separated into the
    original files or directories, as shown in Code Listing 13.6.


    # To unarchive selected files with tar:


    +   - tar -xf labrea.tar "mammoth*"


    You can also extract only files from a tar file. You might do this to restore
    a couple of files from a back-up archive, for example. This command extracts all
    names from the mammoth in their names from the labrea tar file and places them
    back where they belong (Code Listing 13.7).


    # Tips


    +   - Consider moving files into a temporary directory before you unarchive them.
    When you unarchive, tar overwrites any files with the same names that are extracted.
    Using a temporary directory will prevent this.


    +   - Use -tf filename to list the files (to check your work, perhaps, or find
    a backup file) without unarchiving the files.


    ```

