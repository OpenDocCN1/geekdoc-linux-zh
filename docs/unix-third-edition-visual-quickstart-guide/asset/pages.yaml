  md: '# Chapter 9


    # ## Tips


    +   - Keep in mind that the time a job takes to run may vary according to the
    system''s current load or capacity. For example, a job might take less time to
    run at 2 a.m., when people are using the Unix system, compared with 2 p.m., when
    many more people are using the system.


    +   - Different systems produce slightly different time outputs. On some systems,
    you will get real (clock) time, user time, and system time. *Real time* is how
    many seconds on the clock elapsed while the program was running, while *user*
    and *system time* both refer to different measures of how long it took the system
    to run the job. On other systems, you might get a ton of garbage, as shown in
    **Code Listing 9.11**, but the gist of the information is the same.


    ```

    $ time slowscript


    0.07user 0.05system 0:50.13elapsed %CPU

    (avgtext+0avgdata @maxresidentk)

    0inputs+0outputs

    -> (219major+5minor)pagefaults

    $

    ```


    Code Listing 9.11 time output varies from system to system. Here, we get a bunch
    of garbage to decipher in addition to the time information.


    +   - In the case of the ls example, you''re really not concerned with either
    the output or the errors—just the time—so you can creatively dispense with all
    of it. Try **time** \`ls /usr/ > /dev/null 2>&1` to send standard output to /dev/null
    (the bitbucket) and send error messages to standard output (and thence to the
    bitbucket). See Chapter 17 for details.


    +   - Try time -p to get a more human-readable output.'
