  md: '# Setting the Date and Time


    Setting the date and time is very important for a system administrator. Why? Because
    you find something inappropriate or problematic in your log files (e.g., unexpected
    login attempts from a specific location), you will be able to accurately cross-reference
    your log files with those of your colleagues at the other location. That can only
    happen if the time on both hosts is close to.


    To set the time with ntpdate:


    +   - sudo /usr/bin/ntpdate 192.168.96.3  Use ntpdate with the name of a time
    server (currently available servers are listed at www.ntp.org) to update your
    system clock to the current, accurate time (**Code 16.7**). If you get an error
    message about the socket being in use, use ps -ef | grep ntp to find the ntp daemon
    to keep your time synchronized. (If this happens, your time is probably OK and
    doesn''t need to be set.)


    Or


    +   - sudo date -s "Tues Jan 27 5:30:23 2003"


    If you don''t have ntpdate, you will have to set the time manually. Use sudo,
    date, and all the rest of the needed information. If you need to change, only
    the time, you can just provide the time, as in sudo date -s 5:45).


    # Tip


    +   - It''s much better to use ntpdate or have the nptd daemon to run to keep
    your time up-to-date at all times. Using date manually is a poor choice.


    ```

    [jdoe@jdoe] sudo /usr/bin/ntpdate

