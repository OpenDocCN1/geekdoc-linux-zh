    deleting the right directory, and not a directory with the same name in a different
    place on the system.


    +   4. cd ..


    Use the change directory command again to move up one level, to the parent of
    the directory you want to remove.


    +   5. rmdir Yourdirectory


    There it goes—wave goodbye to the directory! See Code Listing 2.10 for the whole
