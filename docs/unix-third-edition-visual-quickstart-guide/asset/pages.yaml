  md: '# Sending and Reading Email


    # # Tips


    +   Rather than type in someone''s lengthy email address (such as joeblow@acmefancompany.com),
    set up an alias—a shortened name that replaces the long-winding address. Yeah,
    you''d be able to just type in Joe or whatever, Unix will know which long-winding
    address goes with that name. To set up aliases, use the address book (press [A]
    from the main menu) and follow the instructions given.


    +   If you''re at the shell prompt and want to send email without bothering with
    the main pipe interface, type pipe followed by the email address you want to send
    mail to (for example, pipe@getray.com). If you want to send email to multiple
    addresses, just separate them with spaces or marks, as in pipe@unixqs@ray.com,info@ray.com.


    # ## Our Two Cents on the Subject of Subjects


    +   * Always include a descriptive line that succinctly summarizes the message''s
    contents. For example, rather than say "Here you go," say "Comments on the Basketsins
    proposal."


    +   * Never leave the subject line blank. Many people toss subjectless messages,
    thinking they might be spam or otherwise not important enough to read.


    +   * Never use ALL CAPS in the subject line (or anywhere else, for matter), as
    recipients may perceive this as being YELLED AT LOUDLY.


    +   * Be aware of how spam filters work. Many ISPs use them to reduce the amount
    of spam (bulk messages, like junk mail, or out to hundreds or thousands of people
    at one time) that goes through. Some filters are set to toss messages with subject
    lines in ALL CAPS. Others toss with a lot of exclamation points in the subject.


    ![](img/30f4227f5df2c6cea63896bef2fc574f_249_0.png)


