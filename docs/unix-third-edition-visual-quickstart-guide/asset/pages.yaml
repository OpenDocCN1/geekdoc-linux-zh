  md: '# Chapter 11


    # Announcing an Absence with vacation


    If you''re planning a vacation and will be away from your email, let Unix announce
    your absence for you (Figure 11.15). Using the vacation program, you can have
    Unix send a reply saying that you''re out of the office to whoever sends you.


    Keep in mind that vacation is quite varie among Unix systems and IPSs. What you
    might have different from the ''standard'' form used here. Be sure to check with
    your system administrator for specific instructions if you have any problems,
    and also look at the procmail section of this chapter, as many Linux and Unix
    systems use procmail instead of a .forward file to tell vacation to respond to
    your messages.


    > Thanks for emailing me about $SUBJECT

    Fortunately for me, I''m taking a fabulous vacation mowing my lawn, doing laundry,
    and catching up on other things I don''t do because I usually work so much. If
    you would like me to stay on vacation, please email my boss (boss@example.com)
    and let her know. Thanks


    ![](img/30f4227f5df2c6cea63896bef2fc574f_262_0.png)


    To send "I''m on vacation" messages using:


    +   1. vi ~/.vacation.msg


    At the shell prompt, type vi ~/vacation.msg. You''ll need to edit a message (template,
    actually) for the response that people should receive when they email you, as
    shown in Figure 11.15.


    +   2. Subject: away from my mail! Thanks for emailing me about $SUBJECT. Fortunately
    for me, I''m taking a fabulous vacation mowing my lawn, doing laundry, and catching
    up on other things I can''t do because I usually work so much. If you would like
    me to stay on vacation, please email my boss (boss@example.com) and let her know.
    Thanks!


    Create and edit the text to say what you want.


    The $SUBJECT term in the text will be replaced with the actual subject of the
    email sent to you.


