  md: '# Splitting Files with split


    Suppose you''re fuzzing with your new digital camera and want to share a photo
    of your new computer (what else is cool enough to take pictures??) via email with
    your friends and family. attach it to an email message, and then—augh!your ISP
    fails to send the file because it''s too big. While you could modify the file
    itself—reduce the physical size, reduce the number of colors used, or crop nonessential
    parts, example—you can also split the file if the ISP tells you that no files
    larger than 0.51 MB will be accepted, you can use split to send the file in chunks—using
    one easy command (Code Listing 6.23).


    ```

    $jdoe@frazz$ split -ls -lh

    total 1.1M

    -rwxwr-x 1 jdoe jdoe 1.0M Jan 1 12:42 mongopicture.jpg*

    $jdoe@frazz$ split -lh

    total 10G

    -rwxwr-x 1 jdoe jdoe 1079300 Jan 1 12:42 mongopicture.jpg*

    $jdoe@frazz$ split -b 500k mongopicture.jpg

    $jdoe@frazz$ split -lh

    total 2.1M

    -rwxwr-r- 1 jdoe jdoe 1.0M Jan 1 12:42 mongopicture.jpg*

    -rw-rw-r- 1 jdoe jdoe 500K Jan 1 13:03 xaa

    -rw-rw-r- 1 jdoe jdoe 500K Jan 1 13:03 xab

    -rw-rw-r- 1 jdoe jdoe 54K Jan 1 13:03 xac

    $jdoe@frazz$ split -b 500k mongopicture.jpg chunk

    $jdoe@frazz$ split -lh

    total 3.2M

    -rw-rw-r- 1 jdoe jdoe 1.3M Jan 1 13:03 chunkaa

    -rw-rw-r- 1 jdoe jdoe 500K Jan 1 13:03 chunkab

    -rw-rw-r- 1 jdoe jdoe 54K Jan 1 13:03 chunkanc

    -rwxwr-x 1 jdoe jdoe 1.0M Jan 1 12:42 mongopicture.jpg*

    -rw-rw-r- 1 jdoe jdoe 500K Jan 1 13:03 xaa

    -rw-rw-r- 1 jdoe jdoe 500K Jan 1 13:03 xab

    -rw-rw-r- 1 jdoe jdoe 54K Jan 1 13:03 xac

    $jdoe@frazz$ cat chunkaa chunkab chunkac = reconstructedpicture.jpg

    $jdoe@frazz$ cmp mongopicture.jpg reconstructedpicture.jpg

    $jdoe@frazz$ split$

    ```


    Code Listing 6.23 Use split to break files into smaller chunks.'
