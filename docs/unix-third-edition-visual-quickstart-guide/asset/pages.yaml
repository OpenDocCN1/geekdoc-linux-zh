  md: "# Creating Files with touch\n\nAnother skill you'll use frequently is creating\
    \ files. You might think of creating files as getting an empty bucket that you\
    \ can fill with water...or sand...or rocks...or whatever. When you create a file,\
    \ you designate an empty space that you can fill with programs, activity logs,\
    \ your resume, or configurations—practically anything you want, or nothing at\
    \ all.\n\nOf course, you can always create a file by writing something in an editor\
    \ and saving it, as described in Chapter 4, but you will sometimes encounter situations\
    \ where you just need an empty file as a placeholder for later use. You create\
    \ empty files using the touch command, as shown in Code Listing 2.2.\n\nTo create\
    \ a file:\n\n+   - touch file.to.create\nTo create a file, type touch followed\
    \ by the name of the file. This creates an empty file.\n\n```\n$ ls\n$ touch file.to.create\n\
    $ ls -l file*\n-rw-r--r- 1 ejr       Jun 29 11:53 file.to.create\n$ touch -t 123123259\
    \ oldfile\n$ ls -l\ntotal 0\n-rw-r--r- 1 ejr       Jun 29 11:53 file.to.create\n\
    -rw-r--r- 1 ejr       Dec 31 1998 oldfile\n$ touch -t 2003123259 new.years.eve\n\
    $ ls -l\ntotal 0\n-rw-r--r- 1 ejr       Jun 29 11:53 file.to.create\n-rw-r--r-\
    \ 1 ejr       Dec 31 2003 new.years.eve\n-rw-r--r- 1 ejr       Dec 31 1998 oldfile\n\
    $ \n```\n\nCode Listing 2.2 Use the touch command to create files, update their\
    \ modification times, or both."
