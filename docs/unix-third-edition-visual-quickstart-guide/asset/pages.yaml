  md: '# Chapter 15


    # # Checking Spelling with ispell Chapter


    Back in Chapter 4, we showed how to spell-check your files. Unix also offers you
    ispell which gives you an interactive way of spell-checking files, similar to
    the spell-checking capabilities of any word processing programs (**Figure 15.1**).


    **To check spelling with ispell:**


    +   1. ispell gudspeller


    At the shell prompt, type ispell followed by the name of the file you want to
    spell-check. You will be greeted with your (allegedly) misspelled word, the sentence
    misspearing appears, suggested words to replace the misspelled word, and (probably)
    a menu at the bottom of the screen, as seen in Figure 15.1. The key items are
    listed in **Table 15.1**.


    +   2. Complete your spell-check using ispell''s menu items.


    +   3. Q


    Press Q to exit ispell, saving all of your changes.


    +   * Tip\Try one (or more) of these flags with the ispell command:

    -b creates a backup file.

    -S sorts guesses by likely correctness.

    -B reports run-together words as spelling errors.

    -M makes sure the menu appears at the bottom of the screen, it doesn''t appear
    automatically.


    ![](img/30f4227f5df2c6cea63896bef2fc574f_336_0.png)


    Figure 15.1 ispell lets you interactively spell-check files.


    # Table 15.1


    Item | DESCRIPTION |

    |---|---|

    | Spacebar | Accept the word this time only. |

    | R | Replace with a word that you''ll specify (after you R). |

    | A | Accept the word for the rest of the current session. |

    | I | Insert the word into your dictionary. |

    | U | Insert the word (as lowercase) into your dictionary. |

    | Q | Quit ispell, without saving any changes. |

    | X | Exit ispell saving changes. |

    | n | Replace highlighted word with a suggested word by typing the appropriate
    number |


