    By following the steps in this section, you can add or change environment variables
    for the current session. As **Code Listing 8.3** shows, for example, you can specify
    a new server environment variable (called NNTPSSERVER) using Usenet news readers
    to access the mews (ntp server).


    **Code Listing 8.3** in the zsh, bash, and ksh shells, you can add a new environment
    variable by specifying the variable and its value, exporting it to the system.


    # To add or change a variable in zsh, bash, or ksh:


    +   1. NNTPSSERVER=news.xmision.com

    At the shell prompt, type the name of the variable (in this case, NNTPSSERVER),
    followed by = and the value you want for the variable (here, news.xmision.com),
    as shown in Code Listing 8.3. In this step, you''re setting up the variable and
    its value, making it available to all programs and scripts that run in the current
    shell session.

    If the value contains spaces or special characters, put the value in quotes.


    +   2. export NNTPSSERVER

    Type export followed by the name of the server. By exporting the variable, make
    it available to all programs and scripts that run in the current shell session
    (again, Code Listing 8.3).

    Until it is exported, it is a shell variable, which will not be available to other
    processes that this shell starts.


    +   3. echo NNTPSSERVER

    Optionally, type echo followed by a $ and the name of the variable to tell you
    what the variable is set to.


    > Tip

    In bash, ksh, or zsh, save a step by typing export NNTPSSERVER=news.xmision.com.


