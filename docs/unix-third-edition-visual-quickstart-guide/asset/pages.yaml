  md: '# Removing Files with rm


    You can easily—perhaps too easily—remove (delete) files from your Unix system.
    Murphy will tell you, it''s a good idea to think twice before doing this; once
    you remove a file, it is gone (unless, of course, you have your system administrator
    to restore it from a backup tape—but that''s another story). At any rate, it is
    permanent, unlike deletions in Windows or the MacOS, where the Recycle Bin or
    Trash give you a second chance.


    Remove files using `rm`, as shown in Code Listing 2.9. And, as you''ll see in
    the following steps, you can remove files one at a time or several at a time.


    # To remove a file:


    +   1. ls -l


    List the files in the current folder to verify the name of the file you want to
    remove.


    +   2. rm -i soon.to.be.gone.file


    At your shell prompt, type `rm -i` followed by the name of the file you want to
    remove. The -i tells the system to prompt you before removing the files (Code
    Listing 2.9).


    +   3. ls


    It is gone, isn''t it?


    Code Listing 2.9 Use rm -i to safely and carefully remove directories and files.


    ```

    ```

    $ ls

    Completed  oldfile

    Newfile     soon.to.be.gone.file

    $ rm -i soon.to.be.gone.file

    rm: remove ''soon.to.be.gone.file?'' y

    $ ls

    Completed  newfile oldfile

    $

    ```

    ```'
