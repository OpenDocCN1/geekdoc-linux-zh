  md: "# Converting with units\n\nYou always forget how many drams are in an ounce?\
    \ Never fear. The units utility makes converting measurements a snap. See Code\
    \ Listing 15.4 to learn how to convert units with units.\n\nTo convert with units:\n\
    \n```\n[jdoe@frazz bin]$ units\n1948 units, 71 prefixes, 28 functions\nYou have:\
    \ inch\nYou want: feet\n  * 0.08333333\n  / 12\nYou have:\n[jdoe@frazz bin]$\n\
    ```\n\n+   1. inch\nat the shell prompt, type units. The Unix system will prompt\
    \ you with \"You have:\" as shown in Code Listing 15.4.\n\n+   3. feet\nEnter\
    \ the kind of units you want, and watch with amazement as Unix counts on its fingers\
    \ and toes to figure out the answer.\n\n+   4. Ctrl+D\nQuit units when you're\
    \ done.\n\n# Tips\n\n+   * You can create your own units file, if you want, defining\
