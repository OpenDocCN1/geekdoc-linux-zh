    # Tips


    +   * If you''re experiencing connectivity problems, try using traceroute to several
    different, geographically dispersed hosts to isolate the problem. For example,
    if you''re in the Midwest and traceroute the way to www.stanford.edu (physically
    located in Palo Alto, California) but not to www.mit.edu (Boston, Massachusetts),
    there''s likely a problem between you and the East Coast.


    +   * You can speed the traceroute process using the -n flag; for example, traceroute
    -n hostname. This checks the path using only IP numbers and does not translate
    the IP numbers into the DNS (Domain Name Server) addresses with which you''re
    familiar.


