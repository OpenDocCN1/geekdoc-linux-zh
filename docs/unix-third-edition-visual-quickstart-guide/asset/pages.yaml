  md: '# # Saving in vi


    You''ll want to save changes to your documents frequently, especially as you''re
    learning to use vi (Figure 4.12). Until you''re accustomed to switching between
    command and input mode, you might accidentally type in commands when you think
    you''re typing text with unpredictable results. Save files, just follow these
    steps.


    To save text in vi:


    +   - `:Esc` Press `Esc` to get out of input mode and into command mode, type
    `:w` ("write", as in write to the disk) followed by a space and then the filename
    (lime in this example) you want to use for the file, press `Enter`. If you''ve
    already saved the file once, just press `Esc` and type `:w` then press `Enter`


    # ** Tips


    +   - If you''ve already saved your file at least once, you can save changes and
    exit vi in one swoop. In command mode, type `:wq` (for "write quit"). For more
    information see the section *Exiting vi* later in this chapter.


    +   - If you want to save a file over an existing file (obliterating the original
    as you do), use `:w! filename` in command mode. The `!` forces vi to overwrite
    the original.


    ![](img/30f4227f5df2c6cea63896bef2fc574f_99_0.png)


    **Figure 4.12** Save, save often. That''s the safe rule for vi.'
