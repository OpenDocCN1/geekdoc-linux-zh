    # # Cleaning up HTML

    Documents with tidy


    If you ever have to develop HTML documents—when developing personal Web sites,
    completing a class project, or creating Web pages on the job—the tidy utility
    can be a handy resource for you. If you are creating HTML pages by hand, you''ll
    likely make occasional errors. These errors probably won''t cause significant
    problems with using the pages, but they might make the pages harder to read, harder
    to maintain, and harder to subject to the scrutiny of your peers. To worry; tidy
    can help!


    tidy is not usually included with Linux or Unix distributions, but you can download
    (and install, using the instructions in Chapter 14) from http://tidy.sourceforge.net.


