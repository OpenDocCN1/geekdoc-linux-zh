    userid (as we have many different accounts, we can always use a reminder!) and
    the date (time flies when you''re having fun, right?). We''re adding these bits
    of information instead of replacing the default prompt, but saving with a % sign
    at the beginning, just in case (Figure 8.2).


    +   4. Save the file and exit the editor.


    +   5. su - ejr

    Log in again with your changed prompt to try it out.


    # ✓ Tips


    +   The trailing space in the prompt code: PROMPT="%n %kd $". This space can make
    it easier to use the prompt because it keeps your commands from bumping into your
    prompt.


    +   You can also set your prompt so that the information you set appears on one
    line and your actual prompt appears on the next (**Code Listing 8.9**). To do
    so, use single quotes ('''') and a $ in the environment variable setting a \n
    for the new line, as in PROMPT=$''%n %0a\n$ ''$''. This forces the string to treat
    the \n as a new line, not just as random characters in the prompt string.


    Code Listing 8.9 Testing after you update your prompt is always a good idea.'
