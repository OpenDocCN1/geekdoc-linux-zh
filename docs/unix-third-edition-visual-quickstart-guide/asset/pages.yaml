    # Zipping a File or Directory with gzip


    If you want to compress only a single file or directory, you might choose gzip,
    rather than compress. gzip is more efficient, so you wind up with smaller files
    than you do with compress. As Code Listing 13.10 shows, you use gzip much the
    same way that you use compress.


    To zip a file or directory with gzip:


    +   1. ls -l z*


    At the shell prompt, use ls -l to confirm the name of the file or directory you
    want to zip. In this example, we''re looking for z (as in zipadedeedoodah).


    +   2. gzip zipadedeedoodah.tar


    Type gzip followed by the name of the file or directory to gzip. The zipped file
    will replace the unzipped version and will have a .gz extension.


    # ## Tips


    The compressed files will be accessed by someone using Windows, you should consider
    using zip, which is discussed later in this chapter. Although gzip is more convenient
    in the Unix world, gzip is not the same as old Pzip or .zip files used in DOS
    and Windows.


    +   Another utility used for compressing files is bzip2 (bzip2, actually). You
    can find more information about it at http://www.bzip2.org/. It''s quite powerful
    and quickly gaining popularity.


    +   You can tar a group of files and compress the single file using gzip.


    +   If you want to keep a copy of the original, unzipped file, try gzip -c filetogzip
