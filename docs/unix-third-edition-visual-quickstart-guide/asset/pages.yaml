  md: '# Tips


    +   - "Regular expression" is often abbreviated as "regexp" in Unix documentation
    and Internet discussions.


    +   - The command egrep is closely related to grep, adding a little more flexibility
    for extended regular expressions, but it fundamentally works the same. On many
    systems the grep command is egrep—when you type either one, you''re really running
    egrep.


    +   - If you''re searching for words through large files, use fgrep for faster
    searching. It uses the same general syntax as grep, but searches for only words
    (not regular expressions) goes much faster.


    +   - See Chapter 1 for details about wildcards.


    # Table 6.1

    Regular Expressions, Examples, and Explanations


    | REGULAR EXPRESSION | FUNCTION | EXAMPLE | EXPLANATION |

    |---|---|---|--|

    | | Matches any character | grep b.rry | This finds all instances of "berry" or
    "bar". |

    | | Matches zero or more instances of the preceding item, so a*b would find "ab"
    as well as "aabb" but not "abc" | grep s$day /home/ejr/schedule | Here, * matches
    zero or more of the items that immediately precede *, in this case let ''s''.
    |

    |^ | Matches only instances of the string at the beginning of a line | grep ^Some
    sayings | With the ^ that the search string must appear at the beginning of a
    line. The example would find a beginning with "Some" but not one beginning with
    "Read Same". |

    |$ | Matches only instances of the string at the end of a line | grep ach$ sayings
    | This example finds all lines in the files that end with |

    | Escapes (quotes) the following character—so you can search for literal characters
    like \* or also operators | grep ''\*'' sayings | grep \* searches for all instances
    of "*" in the sayings. The \ tells grep to interpret as an asterisk, rather than
    as a wildcard.

    | ] | Matches any member of the set, [a-z], [0-9], or [321] (three or one) | grep
    number[0-9] specifications | Use square brackets [ ] to enclose a set of options.
    Here, number[0-9] would match all instances of numbers, number2, number3, and
    so forth in the called specifications.'
