  md: '# Chapter 7


    # Getting System

    Information with uname


    Information about your Unix system might come in handy if you''re planning to
    try some new software or to figure out your system idiosyncrasies. Some systems
    tell you this information when you log in. Sometimes, especially if you''re using
    an ISP, you may not have been told particulars about the Unix system. You can
    easily find out what kind of Unix system you''re running with uname, as shown
    in Code Listings 7.1 and 7.2.


    ```

    ejray@home ssh frizz

    Last login: Wed Oct 10 09:59:09 from frazz

    Sun Microsystems Inc. SunOS 5.9 Generic

    → May 2002

    ejray@frizz $ uname

    SunOS

    ejray@frizz $ uname -sr

    SunOS 5.9

    ejray@frizz $ uname -a

    SunOS 5.9 Generic_112233-01 sun4u

    → spawn SUN,ultra-5_10

    ```


    Code Listing 7.1 Variants in the uname command provide all kinds of interesting
    or useful information about the system.


    # To find out the system

    using uname:


    +   1. uname

    To begin, type uname to find what kind of system you''re on. The Unix system in
    Code Listings 7.1 and 7.2 is Solaris (aka SunOS). Other common systems (not an
    exhaustive list, by any means) are Linux, AIX, BSD, and HP/UX.


    +   2. -sr

    Add the -sr flags to the command, yielding to find out both the operating system
    type and the release level. This is useful to find out specific software is compatible
