  md: "# Working With Your Shell\n\n# Understanding Shells and Options\n\nDepending\
    \ on the particular Unix system you’re using, you may have several shells available\
    \ to you. Table 3.1 describes a few of the more common ones. Each of these shells\
    \ has slightly different capabilities and features. Keep in mind that the differences\
    \ in shells do not affect what you can do in Unix; rather, they affect how easily\
    \ and flexibly you interact with the system.\n\nYou’ll likely have bash, ksh,\
    \ or tcsh (csh) as your shell, but you can change to one of many others fairly\
    \ easily. Code Lists 3.3 and 3.4 show you can start by finding out which shells\
    \ are available to you. Figure 3.1 shows some shells and how they relate to each\
    \ other.\n\n![](img/30f4227f5df2c6cea63896bef2fc574f_67_0.png)\n\nFigure 3.1 Shell\
    \ fit neatly into a few \"families\" with the exception of a few stragglers. Each\
    \ shell in a family shares many characteristics with the others in the same family.\n\
    \n# Table 3.1\n\n# Common Shells\n\n| SHELL NAME | FEATURES |\n| --- | --- |\n\
    | sh | This shell, which is the original Unix shell (often called the Bourne),\
    \ is fine for scripting but lacks a lot of the flexibility and power for interactive\
    \ use. For example, it doesn’t have features like command completion, email checking,\
    \ history, or aliasing. |\n csh and tcsh | This family of shells adds great interactive\
    \ uses but discards the popular scripting support that sh-related shells offer\
    \ in favor of a C programming-like syntax. Because of the C syntax, this shell\
    \ is often called the C shell. Unless you’re a programmer, these are not likely\
    \ to be your best choices. |\\ksh, bash, and zsh | These provide a good blend\
    \ of scripting and interactive capabilities, but they may stem from different\
    \ sources (bash is most similar to sh, hence the Bourne Again Shell name). |\n\
    \nUNDERSTANDING SHELLS AND OPTIONS\n\n53"
