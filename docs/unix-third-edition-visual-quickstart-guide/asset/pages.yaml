  md: "# Matching Domain Names with IP Numbers\n\nWhen accessing a computer on the\
    \ Internet, you generally type a domain name (such as www.raycomm.com) and your\
    \ system translates it into an IP number (such as 204.228.141.12). As a rule,\
    \ the translation from domain name to IP number proceeds without a problem. Heck,\
    \ most of the time, you won't even notice it happened. Occasionally, you'll come\
    \ across an error message saying something \"failed DNS lookups.\" All that this\
    \ message means is that the domain server (probably on your Unix system) cannot\
    \ match the domain name you provided to an IP number.\n\nSo, what do you do?\n\
    \n+   * Just be for a day or two until the problem is resolved. (In the meantime,\
    \ make sure the problem isn't a typo on your part.)\n\n+   * Use nslookup or dig,\
    \ which manually convert a domain name to the matching IP number (Code Listing\
    \ 12.8). Then you can connect directly to the IP number, rather than using the\
    \ domain name.\n\nTo match a domain name with an IP number using nslookup:\n\n\
    ```\njdoe /home/jdoe $ nslookup www.raycomm.com\n-> ns1.netrack.net\nNote: nslookup\
    \ is deprecated and may be- removed from future releases.\nConsider using the\
    \ 'dig' or 'host' programs\n-> instead. Run nslookup with\nthe '-sil[en]' option\
    \ to prevent this\n-> message from appearing.\nServer: ns1.netrack.net\nAddress:\
    \ 206.168.112.153\n```\n\n+   * nslookup www.raycomm.com\n  - ns1.netrack.net\n\
    \nAt the shell prompt, type nslookup followed by the domain name you want to look\
    \ up and the server you want to look for (Code Listing 12.8). If you get one of\
    \ those pesky \"failed DNS lookup\" messages, problem likely resides with your\
    \ name server; therefore, you'll need to specify a different name server to match\
    \ the domain name and IP number for you.\n\nNon-authoritative answer:\nName: www.raycomm.com\n\
    Address: 206.168.112.83\n\nCode Listing 12.8 You can manually translate a domain\
    \ name into an IP address using nslookup."
  merge: -1
  pgno: 290
