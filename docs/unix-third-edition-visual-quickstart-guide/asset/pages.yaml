  md: '# Using Advanced Redirection with stderr


    Throughout this book, we''ve been redirecting input to output, piping the output
    of one command to the input of another, and generally getting fairly fancy. Can
    you believe there''s even more you can do with redirection?


    Unix provides three channels (technically known as file descriptors) for communication
    between the user and the system:


    +   - Standard input (stdin), which refers to providing information at the shell
    prompt or accepting information from a different program.


    +   - Standard output (stdout), which refers to the output you see whirling on
    your screen after you issue a command—example, if you issue the command / -name
    test.


    +   - Standard error (stderr), which includes error messages you might see wir
    by your screen after you issue a command. You might think of this channel as the
    "second" channel.


    Until now, you''ve been redirecting stdin with <, >, |, and sometimes tee. Everything
    on stderr has just accompanied stdout. Adding separate redirection of stderr to
    your arsenal can make your Unix experience even more flexible.'
  merge: -1
  pgno: 374
- img_proc: true
  md: '# To redirect stderr in zsh, bash, ksh, and similar shells:


    +   1. time -p ls


    Use the time utility, covered in Chapter 9, and note that you get both the output
    of ls and the output of time. As it happens, the output of time is on the stderr
    channel, although you cannot see that (the output just shows up on the screen).


    +   2. time -p ls 2> time-results.txt


    Where you would usually put a > to redirect everything to a file, 2> to redirect
    the second output channel to a file. Now you''ll get the output of ls on stdout,
    and the output of time, sent to stderr, in time-results.txt (Code Listing 17.9).


    continues on next page


    ```

    $jdoe@sulley Project]$ ls

    keep keeper.jpg kept kidder.txt kiddo kiddos kidneypie kids kidupdate

    [jdoe@sulley Project]$ time -p ls

    keep keeper.jpg kept kidder.txt kiddo kidnap kidneypie kids kidupdate

    real 0.00

    user 0.00

    sys 0.01

    [jdoe@sulley Project]$ time -p ls 2> time-results.txt

    keep kept kidneypie kidupdate

    keeper.jpg kidder.txt kiddos kids time-results.txt

    [jdoe@sulley Project]$ time -p ls 1>/dev/null

    real 0.00

    user 0.00

    sys 0.00

    [jdoe@sulley Project]$ time -p ls >/dev/null 2>&1

    [jdoe@sulley Project]$

    ```


    Code Listing 17.9 Redirecting standard output and standard error can be handy.'
  merge: -1
