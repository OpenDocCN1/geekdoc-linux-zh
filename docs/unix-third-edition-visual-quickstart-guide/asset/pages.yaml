  md: '# Using Regular

    Expressions with grep


    In addition to using grep to search for simple text strings, you can also use
    grep to search for regular expressions. Regular expressions are kind of fancy
    wildcards, where you use a symbol to represent a character, number, or other symbol.
    With regular expressions, you can search for parts of files, such as the end of
    a line or a text next to another specified text string. Table 6.1 lists some of
    the most common regular expressions.


    To use regular expressions with grep:


    +   - grep .log limERICK

    Type grep followed by the regular expression and the filename. Here, we''ve used
    the regular expression .log to find all instances of “log” that are preceded by
    a single character (Code Listing 6.9).

    Note that this usage of a . to match a single character closely resembles the
    7 wildcard used with ls.

    You could also use multiple periods for specific numbers of characters. For example,
    to find “Dogbert” and “Dilbert,” you might use grep D.. plagiarized. sayings.

    In some cases, you may need to structure the search string slightly differently,
    depending on the expression and the information you''re looking for. Check out
    the additional examples in Table 6.1 for more information.


    ```

    [ejr@hobbes manipulate]$ grep .logan

    -> limerick

    Worked hard all day on a slogan,

    You see, the slogan''s still brogan.

    [ejr@hobbes manipulate]$

    ```


    Code Listing 6.9 Use grep with regular expressions to create fancy wildcard commands.'
