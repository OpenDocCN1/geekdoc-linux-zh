    \ 12:01\n#shell jdoe #\n```\n```\n\nOccasionally, you may need to schedule jobs\
    \ to run one time, at a time you designate. For example, you could schedule an\
    \ email message, reminding you to attend a staff meeting. Or, you could schedule\
    \ a meeting reminder for your co-workers that includes a meeting agenda. And other\
    \ one-time jobs using at, which lets you designate a time at which a job (or jobs)\
    \ should run. Figure 9.1 demonstrates scheduling an email about that all-important\
    \ staff meeting.\n\n**Figure 9.1** Schedules a one-time job, all you have to do\
    \ is specify the time and the job to run.\n\n# ## To schedule a one-time job with\
    \ at:\n\n+   1. at 12:01 1 Jan 2007\n\nTo begin, specify when you want the job\
    \ to run, using at plus a time statement (Figure 9.1). In this example, we specify\
    \ a time, month, date, and year, although you can create a variety of other statements,\
    \ like\n\n+   - at noon tomorrow\n-* at 01/01/07\n-* at 3:42am\n-* at now + 3\
    \ weeks\n-* at teatime\n\nYes, teatime is a valid option. It's at 4 p.m., by the\
    \ way.\n\n+   2. mail -s \"Staff Meeting at 8:30am\"\n  -> ejr < /agenda\n\nSpecify\
