  md: "# Using Other Examples of Regular Expressions\n\nIn the previous section, we\
    \ showed you how to use the grep command to search with regular expressions. You\
    \ can, though, do other neat finding tasks, as we'll discuss in this section.\n\
    \nTo find lines with specific characteristics:\n\n+   - grep 'Nantucket' limerick*\n\
    \  Here, we use grep to find all of the lines in the limericks that start with\
    \ Nantucket, if there are any.\n- grep 'Nantucket$' limerick*\n  Similarly, you\
    \ can find the lines that end with Nantucket.\n- grep '[A-Z]' limerick\n  Or,\
    \ you can find the lines that start with a capital letter by including the [A-Z]\
    \ regular expression.\n- grep '^[A-z a-z]' limerick\n  Here, you can find all\
    \ the lines that start with any letter, but not a number or symbol. Fancy, huh?\n\
