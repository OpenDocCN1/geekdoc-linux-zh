    using rm with the -rf flag; for example, rm -rf Directoryname This method automatically
    removes the directory and everything in it, so you''ll have the opportunity to
    examine everything you beforehand. If you''re getting asked for confirmation before
    deleting each file and you''re really, absolutely, completely sure that you''re
    doing the right thing, use rm -rf Directoryname to force immediate deletion.


    +   - If you have hidden files in the directory, type rm * to delete those files
    plus all of the rest of the files.


    +   - If you have subdirectories in the directory, type cd and the subdirectory
    essentially repeating the process starting with step 1. Repeat this process until
    you remove all subdirectories.


