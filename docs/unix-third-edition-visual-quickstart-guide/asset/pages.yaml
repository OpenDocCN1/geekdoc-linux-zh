    +   - dig @ns1.netrack.net www.raycomm.com

    - At the shell prompt, dig followed by @server-you-want-to-query and the domain
    name you want to look up (Code Listing 12.9).


    +   - You can also do reverse lookups (matching IP to name). This can be handy
    for identifying the origins of unknown email (from the IP addresses in the email
    headers), many other tasks. Use nslookup 192.168.112.83 (substituting the appropriate
    IP address) or dig -x 192.168.112.83 to match a number to a name. Note that many
    servers have a single IP number that supports many domain names, so the answer
    from this may not be definitive as you like.


    +   - For purposes, nslookup provides more quickly comprehensible output (Code
    Listing 12.8) than dig does. However, dig (with appropriate options) can provide
    extra information that can be helpful in some cases. See dig for information about
    options.


    +   - You can find alternate domain names using the whois query server at http://www.internal.net/whois.html
    and looking up the domain name you want. All domain names have to be listed with
