    # To act like root with sudo:


    +   1. cd /var/log/ tail messages

    As-plain-old, you try to look at the system logs in /var/log/. On a Linux system,
    it''s usually /var/log/messages: on a Solaris system, it''s usually /var/adm/messages.
    Other Unix flavors will have but, similar locations.

    Note that some of these files will require access to view them, while others won''t.
    If you can view a file as you, then choose a different file to see how sudo helps.


    +   2. sudo tail messages


    After permission was denied on the previous attempt, use sudo before the command
    to issue the same command with root authority.


    +   3. *******


    Enter your password after the interesting warning, and then that the command succeeded
    this time (see Code Listing 16.1).


    # Tips


    +   After you''ve used sudo, you can use it again within a specific amount of
    time (usually five minutes) without entering your password again.


    +   Some versions of sudo have pretty entering prompts if you use your password
    (Code Listing 16.2). You''re likely to irritate your system administrator tremendously
    if you try to look at these for purpose, though.


    +   If you haven''t been given permission (not technical permission, but actual,
    "you may do this") permission to use sudo, don''t. Everything happens with sudo
    is logged, and you''ll probably have for your actions.


    +   Whenever possible, it''s better to use sudo only when you need it, to become
    root. Any typo can be problematic, and it''s a good thing to have to consciously
    add sudo when you want to act with root authority.


