- img_proc: true
  md: "# Introduction\n\nIn short, we assume you are using Unix to achieve your computing\
    \ goals. You want to know what you can do, get an idea of the potential that a\
    \ command offers, and how to work smart. Very smart.\n\nYou can do all of these\
    \ things using this book. Basically, all you need is a Unix account and a goal\
    \ (or goals) that you want to achieve.\n\n# What Do You Need to Get Started?\n\
    \nAs you get started learning Unix, keep in mind the following conventions for\
    \ typing in commands:\n\n+   - Unix terminology and commands are typically arcane,\
    \ cryptic, and funny-looking. For example, the command to list files or directories\
    \ is ls—short and cryptic. We'll walk through the commands one at a time, so you\
    \ know how to read them and apply them to your own uses. Follow the steps in the\
    \ order provided.\n\n# What Do You Need Computer-wise?\n\nComputer-wise, you can\
    \ learn about Unix using virtually any computer you might have. If you're using\
    \ a Mac with OS X or later, it's all under the hood. If you have an extra computer\
    \ sitting around, even something as a Pentium III, you can install several flavors\
    \ of Unix on it. Certainly you can install Unix on an extra hard drive or empty\
    \ space on your current desktop computer, and generally without affecting your\
    \ Windows configuration.\n\n+   - Unix is case-sensitive, so type commands following\
    \ the capitalization used in the book.\n- Whenever you type a command, you also\
    \ have to press Enter. For example, if we say:\n  1. funny-command goes here\n\
    \     you'll type it in the code, then press Enter, which sends the command along\
    \ the Unix system.\n\nAlternatively, you can dabble in Unix less invasively by\
    \ using an account at work, or through an Internet service provider. The easiest\
    \ option, if you have a reasonably new computer and are concerned about not messing\
    \ up what you have, is to use CygWin to run Unix as part of your Windows environment,\
    \ or to use Vm to run Unix in a \"virtual machine\" as an application in your\
    \ Windows environment, or to use a bootable Unix (Linux or Solaris) CD to experiment\
    \ without having to install anything at all on your computer.\n\nOften, we'll\
    \ tell you to press a combination of keys, as in Ctrl+V. Here is all you need\
    \ to press the (lower-case) v key, at the same time (sequentially is also fine).\
    \ Even though the keyboard uses capital letters (and, thus, the little keys also\
    \ in this book), you would not take the extra step to capitalize the V (or whatever)\
    \ when applying combinations.\n\nxiii"
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Introduction


    +   Some commands have flags associated with them (you might think of flags as
    options for the command) that give you additional control. For example, you might
    see the ls used in variations like ls -la or ls -l. In either case, ls lists the
    files in a directory, the optional -l flag specifies that you want the long format,
    and the optional -a flag specifies all files, including hidden ones (don''t worry,
    we''ll go over this again!). Just keep in mind that flags are essentially options
    you can use with a given command.


    +   You can also put multiple commands on the same line. All you have to do is
    separate them with a semicolon (;), like this: ls; pwd; which would list the files
    in the current directory (ls) and find out what directory you''re in (pwd)—all
    in one step!


    So, with these things in mind, see you in Chapter 1!


    # Anything Else You Should Know?


    Yup! Please feel free to send us a message at books@raycomm.com. We welcome your
    input, suggestions, and questions related to this book. Thanks, and we look forward
    to hearing from you!


    > Note to Mac Users

    For simplicity, we consistently write Enter (not Return), Ctrl (not Control),
    Alt (not Option), and we refer (not very often, though) to a Recycle Bin (not
    a Trash Can). No slight intended to those who do not use PCs or Windows—we just
    tried to keep the complexity of the instructions to a minimum.


    xiv'
  merge: -1
  pgno: 14
