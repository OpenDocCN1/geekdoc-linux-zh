    Compressing a file just means making it smaller so that it takes up hard-disk
    space. It''s like filling a toy box, closing the lid, then sitting on it to moist
    the contents so they fit into a smaller space. Any time you create a file that
    you''ll be sending via FTP or people will access through the Web, you''ll want
    to compress the file so that it takes less time to send and download.


    **Code Listing 13.8** Listing files before and compressing them lets you see how
    much smaller the new file is.


    **Code Listing 13.8** shows, you compress files using the compress command.


    # To compress a file with compress:


    +   * compress labrea.tar


    At the shell prompt, type compress followed by the filename. Here, we''re compressing
    a tarred file, which contains multiple files. As you can see in Code Listing 13.8,
    the compressed file has a new extension (.Z) that shows it''s compressed, and
    it replaces the original, uncompressed file.


    # Tips


    +   * You can compress only one file at a time. If you have multiple files you
    want to compress, consider archiving them first using tar, and then compressing
    the single archived file. See the section called Archiving with tar earlier in
    this chapter.

    * You can add the -c flag to compress leave the original file untouched and send
    the compressed version to standard output (where you''ll probably specify a name
    and save it to a file). For example, you might use compress -c labrea.tar labrea.tar.Z
    See Chapter 1 for some interesting information on redirecting output, as is shown
    here.


