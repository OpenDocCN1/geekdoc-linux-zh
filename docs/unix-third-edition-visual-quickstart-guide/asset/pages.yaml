  md: '# Chapter 7


    # ## Determining Disk Usage with du


    Another piece of information that you can access is how much disk space within
    the Unix system is in use. You can do so using du, as shown in **Code Listing
    7.5.**


    To determine disk usage with du:


    +   * du


    At the shell prompt, enter `du`. As Code Listing 7.5 shows, you''ll get information
    about disk usage in the current directory as well as all subdirectories. The numbers
    are usually measured in 1 Kbyte (as `df`). You can actually read the output by
    using `du -h`.


    # ## Tips


    +   * If you''re on a system that enforces disk quotas (most ISPs do), you can
    find out what your quota is and how close you are to reaching it. Just type `quota
    -v` at the shell prompt.


    +   * You can use `du` with a path name to check the disk usage in a single directory
    or subdirectory (see **Code Listing 7.6.**) du summarizes the usage in a single
    directory by subdirectory as it prints the results.


    +   * Use `du -s`, optionally with a specific directory, to just print a summary
    of the amount of space used.


    ```

