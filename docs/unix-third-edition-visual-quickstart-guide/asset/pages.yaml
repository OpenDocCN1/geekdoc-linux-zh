  md: '# Chapter 6


    # Changing Files with awk


    While sed is line-oriented and lets you fiddle and doodle to your heart''s content,
    awk is field-oriented or comma-delimited files. For example, if you have an address
    book file, you can use awk to find and change information in fields you specify,
    as in Code Listing 6.11. In the following steps, we''ll show you a sampling of
    the things you can do using awk to modify, in this example, an address book file.


    ```

    [ejr@hobbes manipulate]$ awk '' { print $1 }''

    → address.book

    ```


    Schmidt,

    Feldman,

    Brown,

    Smith,

    Jones,

    [ejr@hobbes manipulate]$


    Code Listing 6.11 awk lets you access individual fields in a file.


    To change files with awk:


    +   awk ''{ print $1 }'' address.book

    At the shell prompt, use awk ''{ print $1 }'' address.book file to look at and
    select (and send to standard output) the first field in each record (line). More
    specifically, starting from the inside


    +   $1 references the first field in each line. Unless you specify otherwise,
    awk assumes that a space separates the fields, so the first field starts at the
    beginning of the line and continues to the first space.


    +   { } contain the awk command, and the quotes are necessary to tie the awk command
    together (so the first space within the command isn''t interpreted by the shell
    as the end of the command). See Code Listing 6.11.


    +   awk -F ''{ print $1 }'' address.book

    The -F flag tells awk to use the character following it—in this case, a comma
    (—) as the field separator. This change makes the output of the command a little
    cleaner and more accurate. If you were working with /etc/passwd, you''d use -F:
    to specify that : is the field separator.


    # De-what?


    A delimited file uses a specific character to show where bit of information ends
    and begins. Each piece of information is a separate field. For example, a file
    that contains "John, Doe, Colorado" is comma-delimited, sporting between fields.
    Other files, as the /etc/passwd file, use a colon (:) to separate the fields.
    Just about any symbol that''s not used in the content could be used as a delimiter.


    122'
