  md: '# Changing Ownership of Files and Directories with chown


    After you change a file''s ownership, what you can do with the file depends on
    the group and other permissions and memberships. The new owner, however, will
    be able to do anything with the file.


    When changing the ownership of a directory, you can add the -R flag to chown to
    make it apply recursively to all files and directories below.


    If the system does not allow you to use chown to make a copy of the file to accomplish
    the thing. If you copy someone else''s file (that you have permission to read)
    to another name or location, the copy is fully yours. (In giving-the-fileaway
    example, the recipient should use cp.)


    Even if you can''t chown, you will still be able to request the system administrator
    change file ownership for you: "Could you please change the ownership of my rowyourboat
    to Merlee, with chown merlee /home/shared/rowyourboat. Thanks!" (This could happen
    because many versions of Unix don''t allow non-root users to change file ownership)


    Suppose you''ve been working on a file called rowyourboat, and your boss decides
    to let a coworker, Merlee, take over the project. In this case, to fully pawn
    the project to your coworker, you need to change ownership of the file from you
    to her. Depending on how system administrator set the system, you can usually
    change ownership of files using chown (Code Listing 5.6).


    # To change ownership: chown


    +   1. ls -l

    For starters, type -l at the shell prompt to verify the file name and ownership,
    as Code Listing 5.6. Remember that the ownership information is located after
    the permissions and linking information.


    +   2. chown merlee rowyourboat

    Type chown followed by the person you want to transfer ownership to and the filename.
    In this case, the chown command changes the ownership for rowyourboat to merlee,
    rowyourboat and its associated problems will now be hers, and life will be but
    a dream.


    ```

    [ej@hobbes merlee]$ ls -l

    total 26

    -rw-rw-- 1 ejr users 24850 Jul 24 15:17 rowyourboat

    [ej@hobbes merlee]$ chown merlee rowyourboat

    [ej@hobbes merlee]$ ls -l

    total 26

    -rw-rw-- 1 merlee users 24850 Jul 24 15:17 rowyourboat

    ```


    Code Listing 5.6 Changing ownership of files transfers complete control.'
  merge: -1
