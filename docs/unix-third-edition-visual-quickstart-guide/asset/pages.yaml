  md: "# Searching and Replacing Throughout Multiple Documents with sed\n\n```\n#\
    \ jdoe@fraz.raycom.com:~home/jdoe/bin\n#! /bin/sh\n\nfor i in `ls -1 *.htm*'\n\
    do\n  cp $i.bak\n  sed 's/<\\BLINK>/\\1/g' $i.bak\n  mv $i.bak $i\n  echo \"$i\
    \ is done!\"\ndone\n```\n\nIn Chapter 6, we talked about sed and how to use it\
    \ to search and replace-out files, one file at a time. Although we're still coming\
    \ off of the power rush from doing that, we will now show you how to combine sed\
    \ with shell scripts and loops. In doing this, you can take your search-replace\
    \ criteria and apply them to multiple documents. For example, you can search through\
    \ all of the .html documents in a directory and make the same change to all of\
    \ them (Figure 17.2), we strip out all of the <BLINK> tags, which are often offensive\
    \ to some HTML products.\n\n**Figure 17.2** Create a script to search and replace\
    \ in multiple documents.\n\nBefore you get started, you might have a look at Chapter\
    \ 6 for a review of sed basics and Chapter 10 for a review of scripts and loops.\n\
    \n# **To search and replace throughout multiple documents:**\n\n+   1. vi theinkinblinkintag\n\
    \   Use the editor of your choice to create a new script. Name the file whatever\
    \ you want.\n\n+   2. #! /bin/sh\n   Start the shell script with the name of the\
    \ program that should run the script.\n\n+   3. for i in `ls -1 *.htm*'\n   Start\
    \ a loop. In this case, the loop will process all of the .htm or .html documents\
    \ in the current directory.\n\n+   4. do\n   Indicate the beginning of the loop\
    \ content.\n\ncontinues on next page\n\n![](img/30f4227f5df2c6cea63896bef2fc574f_361_0.png)"
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Chapter 17


    5. `cp $i $bak`


    Make a backup copy of each file before you change it. Remember, Murphy is watching
    you.


    6. `sed "s/\^*BLINK\>/g" $i .new`


    Specify your search criteria and replace-text. A lot is happening in this line,
    but don''t panic. From the left, this command consists `sed` followed by


    +   * `^`, which starts the command.


    +   * `s/`, which tells `sed` to search for something.


    +   * `<`, which is the first character to be searched for.


    +   * `\`, which allows you to search for the /. (The \ escapes the / so the /
    can be used in the search.)


    +   * `*`, which specifies zero or more of the previous characters (/), which
    takes care of both the opening and closing tags (with and without a / at the beginning).


    +   * `BLINK`, which indicates the rest of the text to search for. Note that the
    searches only for capital letters. You''ll want to add a line if your HTML document
    might use lowercase tags.


    +   * //, which ends the search section and the replace section (there''s nothing
    in the replace section because the tag will be replaced with nothing).


    +   * `g`, which tells `sed` to make the change in all occurrences (globally),
    not just in the first occurrence on each line.


    +   * `$i` is replaced with each filename in turn as the loop runs.


    +   * > $i.new` indicates that the output is redirected to a new filename. (See
