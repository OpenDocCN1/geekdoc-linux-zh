  md: '# Chapter 3


    # Discovering What Shell

    You''re Using


    When you first log in your Unix account, you''ll be using the default shell on
    your system. The default shell, its features, and its options depend completely
    on what your system administrator specifies. **Code Listings 3.1 and 3.2** show
    examples of how default shell prompts differ on different systems.


    To discover what shell you''re using:


    +   - echo $SHELL


    At your shell prompt, type `echo $SHELL` (capitalization counts!). This command
    tells Unix to display (echo) about shell settings. This information, by the way,
    is contained in one of the environment variables, so the technical phrasing (which
    you might hear in Unix circles) is to "echo your shell environment."


    The system''s response will be the full path to your shell—something like `/bin/csh`,
    `/bin/bash`, or `/bin/ksh.


    # Tips


    +   - You can also use `userid`, substituting your login name for userid, to find
    out more about your shell settings. You can substitute any other `userid` and
    see comparable information about the other account holders. Check Chapter 7 for
    more about finger. (Some systems do not support finger, because finger can be
    a bit of a security hole.)


    +   - You''ll find more information about different shells and their capabilities
    throughout this chapter.


    ```

    xmission> echo $SHELL

    /bin/csh

    xmission> finger ejray

    Login name: ejray In real:

    "RayCom"

    Directory:/home/users/e/ejray Shell:

    -> /bin/csh

    On Jun 23 06:58:48 on pts from 16

    -> calvin.raycomm.com

    1 minute 28 seconds Idle Time

    No unreal

    No Plan.

    xmission>

    ```


    Code Listing 3.1 This ISP account uses the /bin/csh shell by default.


    ```

    [ej@hobbes ejr]$ echo $SHELL

    /bin/bash

    [ej@hobbes ejr]$ finger ejr

    Login: ejr Name: Eric J. Ray

    Directory:/home/ejr Shell: /bin/bash

    On Wed Jul 22 07:42:02 (MDT) on tty1

    -> 3 hours 15 minutes idle

    No mail

    Project:

    Working on UNIX QVIS.

    Plan:

    This is my plan-work all day, sleep all

    -> night.

    [ej@hobbes ejr]$

    ```


    Code Listing 3.2 On hobbes, a Linux system, the default shell is `/bin/bash..


