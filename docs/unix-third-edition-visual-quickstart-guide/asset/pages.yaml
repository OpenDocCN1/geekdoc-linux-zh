  md: "# Chapter 10\n\n# Looping Your Scripts\n\nSuppose you've created a script that\
    \ you need to apply to several files. For, say that at the end of each day you\
    \ need to make back-copies of all .html files in your www directory. You could\
    \ make a backup of each individual .html file, but that's a lot of work. Another\
    \ way would be to create a short script to copy an .html file, and then loop (repeat)\
    \ the script to apply to all .html files in your www directory (**Figure 10.5**).\
    \ You create one short script: Unix does the tedious work for you.\n\nTo make\
    \ a loop:\n\n+   1. `head_ache` \nAt the prompt, start your editor and open the\
    \ script you want to loop. In this case, we're using vi and the `head_ache` file.\
    \ (Of course, you could name the script `head-backup` or something mundane like\
    \ that).\n\n+   2. `#!/bin/sh` \nTell your Unix system shell to use to run the\
    \ shell script. In this example, we're telling it (with !) to run the script with\
    \ `/bin/sh`.\n\n+   3. `cd ~/www` \nMake sure you are in the directory in which\
    \ the loop will take place. In this example, our shell script resides in our home\
    \ directory, but the files to which the loop will apply reside in the www directory.\n\
    \n+   4. `for i in ls -1 *.html` \nOK, don't panic. Read this as: \"Look for items\
    \ in the list of .html files.\" In this code, we're providing the output of the\
    \ embedded command (`ls -1 *.html`) to the for loop (`the .html files), as shown\
    \ in Figure 10.5. The -1 flag on the ls command, forces a single list of output,\
    \ which is ideal for script use, rather than several columns, which is easy to\
    \ read onscreen but doesn't work well for scripts.\n\n```\n# jdoe@fraz.rayconn.com:home/jdoe\n\
    !/bin/sh\ncd ~/www\nfor i in ls -1 *.html\ndo\ncp $i $i.bak\necho \"$i backed\
    \ up!\"\ndone\n```\n\n**Figure 10.5** Using a loop with an embedded command, you\
    \ can automatically apply a script to several files.\n\n110"
