  md: '# Chapter 5


    # ✓ Tips


    +   If you try to change group ownership and get an error message like “Not owner”
    or something similarly obscure, your userid doesn''t have the necessary authority
    to make the change. You''ll have to ask your system administrator for help.


    +   Change group association only if you have a specific need to do so; you don''t
    want to make your files available to other people unnecessarily. Unless you are
    the system administrator, you won''t be able to control exactly who belongs to
    the group to which you''ve given access to your files.


    +   If you change the group association of a specific directory, you also need
    to check permissions for the directory containing it. Users will not be able to
    change the specific directory (regardless of their group membership) unless they
    also have read and execute permission for the directory containing it.


    +   Just as with the cp and mv commands, covered in Chapter 2, you can use a -R
    flag with chgrp to recursively apply changes to a directory and all of the subdirectories
    and files in it. For example, change the group association of the LatestProject
    directory and all its contents to the project group, use chgrp -R project LatestProject
    from the directory above LatestProject.'
