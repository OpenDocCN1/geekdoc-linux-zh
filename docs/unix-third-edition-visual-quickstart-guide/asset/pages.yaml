  md: '# Reading News with tin


    Another program you can use to read news is tin, which is very similar to the
    mutt email program. You''ll find that it''s fairly intuitive to use (as news readers
    go) and the menu options and interface are similar to those of mutt. However,
    tin is just a news reader (unlike pine, which is also an email program), so your
    only tasks are subscribing to news-groups (Figure 12.12) and reading newsgroup
    messages (Figure 12.13).


    ![](img/30f4227f5df2c6cea63896bef2fc574f_296_0.png)


    Figure 12.12 The main screen is very similar to mutt main.


    ![](img/30f4227f5df2c6cea63896bef2fc574f_296_1.png)


    Figure 12.13 Choose a thread from the listing tin.'
