- img_proc: true
  md: '# Installing Unix on an old or spare computer


    Alternatively, if you''d rather keep your Unix explorations closer to home, you
    can manage that as well. If you have an older computer sitting around (say, anything
    that''s a Pentium III or later), you can just install Unix (Linux, Solaris, or
    whatever) on that, and likely without out hassles or problems. You could make
    it work on older computers, but given how cheap new and used computers are, it''s
    not worth the trouble. Either, you''ll download a CD or DVD from the Web, burn
    it onto a disc, and boot your system with the disc in the drive. The installation
    will start, and a few questions minutes later you''ll be all set.


    # Installing Unix and Windows side by side


    You can also download the CD or DVD and install on your everyday computer. Most
    of the time (actually virtually all the time, we''re making no promises here),
    you can install Unix onto your desktop right alongside your Windows environment
    with out breaking anything. You''ll get it installed, reboot your system, and
    choose Unix (Linux, Solaris, whatever) or Windows when you boot up. This option
    isn''t bad, but it does require you to stop what you''re doing in Windows or Unix
    to change to the other. If your desktop computer is relatively old, this might
    be better than the following options, though.


    If you have a pretty breezy desktop computer (relatively new with ample memory
    and disk space), you could try using VMware, which gives you a computer emulation
    (think "picture in picture" for your computer, but with one operating system within
    the other operating system).


    continues on next page'
