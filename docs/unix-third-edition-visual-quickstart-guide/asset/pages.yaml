  md: '# Chapter 3


    # Viewing Session History

    in the bash Shell


    Another cool feature of the bash shell is that it lets you reuse commands from
    your session history, which shows you the list of commands you used during a session
    or in previous sessions (Code Listing 3.9). Viewing history is for reviewing your
    Unix session, using previous commands again (rather than completely retyping them),
    and modifying complex commands.


    To view session history in the bash shell:


    ```

    [ejr@hobbes clean]$ ls

    background.htm info.htm logo.gif

    [ejr@hobbes clean]$ ls

    background.htm info.htm logo.gif

    [ejr@hobbes clean]$ history

    1 free

    2 id deb

    3 id ejr

    4 uname -a

    5 ls

    ```


    +   1. Use the shell for a little, changing directories, redirecting output, or
    doing other tasks.

    Take your time. We''ll wait.


    +   2. Press one.

    Note that the last (previous) command you appeared on the command line, as shown
    in Code Listing 3.9. To retrieve the command, press Enter.


    +   3. Continue to press or scroll back or forward through your history. When
    you reach a command you want to use, press Enter.

    If you see a command that''s close, but not exactly you want to use, you can edit
    it. Just use the and keys to move across the line, typing by in it, and use Backspace
    and Delete to delete text. When you''ve fixed the command, press Enter (you don''t
    have to be at the end of the line to do so).


    ```

    40 cd

    41 cp .bash_history oldhistory

    42 vi .bash_history

    43 elm

    44 ls -la

    45 ls -la .e*

    46 elm

    47 lynx

    48 history

    49 vi .bash*$

    50 history

    51 cd clean

    52 ls

    53 ls

    54 history

    [ejr@hobbes clean]$ !40

    cd

    [ejr@hobbes clean]$ ejr

    ```


    Code Listing 3.9 In this example, we typed the first command, then pressed to
    retrieve the previous command. ls !40 recycled the 40th command for the listing.


    +   4. history

    Type history at the shell prompt to see a numbered list of previous commands you''ve
    entered.


