  md: '# Chapter 10


    # Accepting Input While a Script Is Running


    In the previous section, we showed that you can require that information be provided
    along with the script in order to run, but it is easy to forget to input it and
    not get the results you expected. You can also require input while a script is
    running. The script runs, you input some information, and then the script continues
    (probably) using the information that you input (Figure 10.8). In this case, the
