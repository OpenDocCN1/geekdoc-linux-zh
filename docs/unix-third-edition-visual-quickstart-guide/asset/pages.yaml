  md: '# # 4 CREATING AND EDITING FILES


    Creating and editing files are likely the most common tasks you''ll perform in
    Unix. If you''re programming, developing Web pages, sending email (uh-huh, really),
    or just writing a letter, you''ll spend a lot of time in an editor.


    In this chapter, we''ll introduce three of the most common editors: pico, vi,
    and emacs. We''ll launch this chapter with a general overview of each, and then
    discuss how-tos of using each one. With the information presented here, you''ll
    be able to choose an editor based on your needs and get started using it (or using
    all of them).


