  md: '# Chapter 12


    # ✔ Tips


    +   - If the FTP connection seems as soon as you log in, try -yourid@wherever.com
    as the password. The - character disables system announcements and keeps your
    ftp client happy.


    +   - Firewalls—particularly the ones on home networks—do not deal gracefully
    with some of the intricacies of the FTP protocol. If you can connect and log in,
    but not list files or get anything, the fire-wall might be the problem. As soon
    as you log in, type pass (for passive) and the problem should go away.


    +   - Another handy use for - is to view text files onscreen. For example, type
    get filename - have the text scroll by the screen.


    +   - Instead of using get, use newer (as in goodjokes.gz) to get a more recent
    file with the same name as one you have.


    +   - If you start downloading a file and the FTP connection breaks, type reget
    the filename to continue the transfer from wherever it left off. (You''ll have
    to reablish the connection, first.)


    +   - You can tell the ftp client to make sure that all transferred files have
    unique names using runique instead of get. This way, you can ensure that files
    do not overwrite existing files on your local system.


    +   - Use Unix commands like ls, pwd, and cd to move around the remote system,
    and prepare them with ! to apply to your system. For example, cd - would change
    to the next higher directory on the remote system, and cd .. (from within the
    ftp client) would change to the next higher directory on the local system. The
    current local directory is where your files will be saved.


    # Getting Multiple Files


    If you''ll be getting multiple files with ftp, follow steps 1 through 6 in this
    section, then


    +   - prompt


    Optionally, you prompt to tell the ftp client not to prompt for each individual
    that you want to get. You''ll be informed that prompt is set to no. If you want
    to turn it on, issue prompt again.


    +   - mget start*


    At the ftp> type mget (for “multiple files”) by the string or file names to match.
    In this example, use start* to get all files with names begin with “start”. You
    could also use mget *.gz, for example to get files with the .gz file extension.
    See Chapter 1 for more about wildcards.


    +   - quit


    When you''re finished getting files, just type quit.


