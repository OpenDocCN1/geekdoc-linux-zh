    You might think of wildcards as being placeholders for omitted letters or numbers.
    For example, if you''re looking for a file but aren''t sure whether it kidnews
    or kid, you can include a wildcard to stand for the part you''re uncertain of.
    That is, you the command `ls kid*` (**Code Listing 1.7**) would list all files
    with the characters "kid". In the result, you would find a file named kid with
    kid but have varying endings, as well as files that begin with kid (aha, the lost
    file!), kiddo, or kidneypie.


    **Code Listing 1.7** Use wildcards (? or *) to act as placeholders for missing
    characters.


    +   - You use ? as a placeholder for one character or number.

    - You use * as a placeholder for zero or more characters or numbers. Zero characters,
    in case you''re curious, specify that the search results include all variants
    of kid, including the itself with no suffix.

    - You can include a wildcard at any place in a name: the beginning (*kid*), in
    the middle (k*d*), at the end (ki*), or even in multiple places (*ki*d*).


