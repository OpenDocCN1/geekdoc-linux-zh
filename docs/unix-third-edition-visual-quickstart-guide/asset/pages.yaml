  md: "# Changing Permission with umask\n\nEvery time you create a file, the Unix\
    \ system applies default permissions for you. This is great because, for many\
    \ uses, the default permissions will be what you want. In other cases, though,\
    \ you'll want to specify different permissions.\n\nYou can change the default\
    \ permissions using umask command uses a numeric representation for permissions\
    \ (as discussed in the previous section), but the numeric value you specify here\
    \ is not the same as the one you would use with chmod. (Don't ask why. Assume\
    \ that Batman and Robin got together and made this command only by the Wonder\
    \ Twins when their powers were activated.) So you have to figure out the umask\
    \ value for the permissions you want, then use that value to set the new default\
    \ permissions.\n\nNote that you cannot execute permissions by default, so you're\
    \ only figuring out the read and write permissions for u, g, and o categories.\n\
    \n# To figure the umask value:\n\n+   1. 666\n   Start with 666. Again, don't\
    \ ask why; it's just what you're supposed to start with.\n\n+   2. Figure out\
    \ which numeric values youd use to set your desired permissions with the chmod\
    \ command.\n   You might review the previous section, Translating Mnemonic Numeric\
    \ Permissions, and peek at Table 5.1 in that section.\n\n+   3. Subtract that\
    \ numeric value from 666.\n   For example, if the numeric value you use with chmod\
    \ is 644, subtract that value from 666: 666-644=022 is the number you'll use with\
    \ umask."
  merge: -1
