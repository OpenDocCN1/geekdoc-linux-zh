- img_proc: true
  md: '# Installing Your Own Software


    # Finding Unix Software


    Before you can install software on your Unix system, you have to find the software
    and de-licate the correct version of the software. We recommend the following
    places to look:


    +   - Search the Web using Yahoo! (www.yahoo.com) or Google (www.google.com) to
    find downloadable software.


    +   - Visit popular software sites, such as HotScripts at www.hotscripts.com (Figure
    14.1) or SourceForge at http://sourceforge.org or FreshMeat at http://freshmeat.com.


    In using these resources, you will come upon:


    +   - Code for Perl, shell, or others: you will generally have to download, uncompress,
    and unarchive, and then edit some of the files to insert system-specific settings.


    +   - Source code for programs: With this, you''ll have to download, uncompress,
    and unarchive, and then some system-specific settings. Then, you''ll have to “make”
    them, which tells the make program to compile on your system with no choice but
    to install the programs.


    +   - Precompiled binaries: You''ll have to search and find the name (and operating
    system and platform) that corresponds to the system on which you want to run the
    software. Then, you''ll have to download it, uncompress, and put it where you
    want it. This is the easiest solution—when it works; however, keep in mind that
    you might download it, uncompress it, and find that it still won''t work, leaving
    you no choice but to download and compile the source code.


    ![](img/30f4227f5df2c6cea63896bef2fc574f_317_0.png)


    # Tips


    +   - If you will be downloading and installing a lot of software, and if you
    have no significant quota limits, look into using or even downloading and installing
    rpm. It''s a neat compression/installation/configuration program that makes installing
    Unix software in this special format as easy as installing a program in Windows
    or a Macintosh. It is standard on RedHat, SuSE, and Mandatory Linux has been used
    on many different Unix systems. The opt package system, is similar in intent and
    is also extremely popular.


    +   - Unless you''re root on your system, your options for installing software
    will be rather limited. Consider using a home Linux system to experiment with
    if you want to be able to install whatever whenever you want.


    303


    FINDING UNIX SOFTWARE'
