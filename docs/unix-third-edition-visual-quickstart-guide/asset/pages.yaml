- img_proc: true
  md: '# Controlling Ownership & Permissions


    Table 5.1


    | MNEMONIC (RWX) | BIN EQUIVALENT | NUMERIC EQUIVALENT |

    | --- | --- | --- |

    | --- | 000 | 0 |

    | --X | 001 | 1 |

    | -W- | 010 | 2 |

    | -WX | 011 | 3 |

    | r- | 100 | 4 |

    | r-X | 101 | 5 |

    | r-WX | 111 | 7 |


    # Translating Mnemonic Permissions to Numeric Permissions


    The permissions of a file, as you''ve seen throughout this chapter, come in sets
    of three—rwx for read, write, and execute permissions. And, as we showed, you
    set these permissions by specifying that one is either "on" or "off". For example,
    ugo+rx sets read, write, and execute permissions to "on" for group, also a-wx
    sets read and write to "on" for everyone, and a-x sets to "off" (indicated in
    directory lists with the -).


    Rather than permissions with letters and hyphens, however, you can translate them
    into numeric values, using 1 for "on" and 0 for "off". So, rw-, would read and
    write "on" and execute off, 110. You could think of this as counting in binary—000,
    001, 010, 011, 100, 101, 111, with a 1 in each place that the permission is set
    to "on".


    Each of these combinations of on/off permissions (or binary numbers) can be expressed
    as a unique decimal digit between 0 and 7, as shown in Table 5.1. It is this digit
    you use to set permissions.


    To set permissions using numeric equivalents:


    +   - chmod 777 rowyourboat


    +   - Setting permissions with numeric equivalents sets permissions absolutely,
    rather than adding to or subtracting from existing permissions.


    +   - Numeric equivalents do not give you any more control than you have with
    ugo+rx; however, you will need to use the numeric system to set default permissions
    when you create new files. Changing Permission Defaults with umask, for the full
    scoop.


    Or, for example, 724 would give the user the full read, write, and execute permissions,
    the group only write permissions, and other read permissions.


