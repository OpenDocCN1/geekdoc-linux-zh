  md: '# Getting Information About Your Userid with id


    Occasionally, you may need to find out information about your userid, such as
    your userid numeric value and to what groups you belong. This information is essential
    when you''re sharing files (discussed in Chapter 5) because you''ll need to let
    people access your files and to access them. You can easily get information about
    your userid with id, as shown in Code Listing 7.13.


