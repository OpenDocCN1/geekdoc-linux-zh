    related email messages. You can tell Unix to magically forward these incoming
    messages to the people who will actually do something about them. Hey, you''re
    boss, right? Or maybe you just got a different email account, and you want to
    incoming mail sent to your old address forwarded to your new address.


    As **Figure 11.14** shows, all you have to do is create a .forward file.


    # ## To forward incoming email messages:


    +   1. `vi ~/ /forward`n

    To begin, vi at the shell prompt (or the appropriate command for whichever you
    are using), indicate your home directory (with ~/), and then edit .forward


    +   2. `mynewid@raycomm.com`n

    Add, as the first line of the file, the address to you want your email forwarded
    (Figure 11.14). In addition to forwarding to a single address, you can also use
    a .forward file with multiple addresses to send incoming email to several addresses
    at once.


    +   3. Save and close the file.


    Check out Chapter 4 for details about saving and closing files using pico or vi.


    > > Tips\Check with your system administrator to see if a .forward file will really
    do what you want. Many Linux and Unix systems automatically send via procmail
    (and ignore the .forward file), so you might need to use a procmail recipe to
    forward your mail. It''s quite effective, but just different. See the section
    on procmail later in this for details.


    | | | | |

    |---|---|---|--|

    | Get Help | WriteOut | Read File line | Prev Pg |

    | Exit | Justify | Where is | Next Pg |


    **Figure 11.14** All you have to do is tell Unix which want your messages forwarded
    to.


    If you want


    Forwarding messages is also handy when you change ISPs. You can forward all messages
    sent to your old address to your new one, which helps tremendously in ensuring
    that you receive your important messages while your friends and co-workers update
    their address books.'
