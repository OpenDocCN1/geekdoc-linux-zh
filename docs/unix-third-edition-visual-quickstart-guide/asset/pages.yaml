    name—for example, you could kill an ftp job with a job number of 1 using kill
    %ftp or kill %1. If your shell doesn''t cooperate, repeat on.


    # To delete a process with kill:


    +   1. ps


    At the shell prompt, type ps to see the list of all your current jobs (Code Listing
    9.14). Note the PID (process identification) number of the process you want to
