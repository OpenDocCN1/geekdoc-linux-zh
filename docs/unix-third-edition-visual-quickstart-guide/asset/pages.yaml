    Clean litter box

    Clean diaper pails

    Clean litter box

    Mow lawn

    Edge lawn

    Clean litter box

    Polish swamp cooler

    Buff garage floor

    Clean litter box

    [ejr@hobbes manipulate]$

    ```


    Code Listing 6.3 Use head to look at just the top of a file, which gives you a
    manageable view of the file.


    ```

    [ejr@hobbes manipulate]$ honeydo* | more

