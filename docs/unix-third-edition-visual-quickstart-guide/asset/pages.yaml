  md: '# Chapter 6


    # # Comparing Files with cmp


    Suppose you''ve been working on the dearliza file and you want to know how it
    differs from the dearheny file. Using cmp, you can compare the two files as **Code
    Listing 6.13.**


    # ## To compare files with cmp:


    +   - **cmp dearlheny**

    At the shell prompt, type cmp followed by both filenames. As Code Listing 6.12,
    these files are not the same.


    If the files are identical, you''ll find yourself back at the shell prompt with
    cmp. If both files are identical until one them ends—that is, say, the first 100
    lines and the other ends—then you''ll see an EOF (end of file) message, as in
    **Code Listing 6.14.**


    # ## Tips


    +   - You can find out other ways that files differ using `diff`, as described
    in the next section, *Finding Differences in Files with diff.*


    +   - Unix provides an exit status message that you can use to get more information
    about how the program stopped and why. See *Using Advanced Redirection* in Chapter
    17 for more information.


    +   - You can also use `diff` to find out which files are in one directory but
    not another. Just type `diff` followed by the names of the two directories; for
    example, `diff /home/ejr/Directory/home/ejr/Newirectory`


    +   - You might also check out the section, *Finding Differences in Files with
    diff*, for another way to compare files.


    ```

    [ejr@hobbes manipulate]$ cmp dearliza

    → dearliza dearheny differ: char 20, line 2

    [ejr@hobbes manipulate]$

