  md: '# Chapter 3


    # ✔ Tips


    +   - If you have just a minor change to a command, you can edit it quickly and
    easily. For example, if you just ls `/home/users/e/eric` and wanted to issue cd
    `/home/users/e/eric` next, you could just type `^cdls` to tell the system to replace
    `cd` from the previous command with `ls` and then reissue the command.


    +   - You can use `Ctrl+A` and `Ctrl+E` while editing a command line to move to
    the beginning and end of the line.


    +   - Commands from the current session are kept in memory to scroll through,
    while commands from previous sessions are kept in the `~/.zsh_history` file. You
    can edit `.zsh_history` with any editor to delete unneeded commands or simply
    delete the file to get rid of the whole history file, which will then be re-created
    with the next command issue.


    +   - Reviewing session history is a great way to identify your work patterns
    and needs. If you find yourself repeatedly using the same series of commands,
    consider writing a script to do the commands automatically, as Chapter 10 describes.


    +   - Most of the command completion from `bash` also work in `zsh`. Give it a
    try!'
