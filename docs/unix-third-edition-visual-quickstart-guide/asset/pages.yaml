  md: '# Choosing a News Reader


    Usenet news (often called Netnews or just news) is a collection of more than 20,000
    different discussion groups on a variety of topics. Several main categories of
    Usenet newsgroups exist, as well as dozens of local, regional, and esoteric categories.
    Our ISP carries about 25,000 newsgroups, which is fairly typical. The Common Usenet
    Categories sidebar lists some of the main Usenet categories. The newsgroups you''ll
    have available through your Unix system depend on which ones your ISP or company
    subscribes.


    You can read news using a variety of news readers, including pine and tin, which
    we''ll cover in this section. Both of these are fairly easy to use and available
    on many Unix systems.


    # Common Usenet Categories


    +   The main Usenet categories include

    - comp. computer-related topics

    - news. Usenet administration topics, including answers to questions frequently
    asked by new users

    - rec. recreational topics

    - sci. science-related topics

    - soc. social/sociology topics

    - talk. discussion for its own sake

    - misc. anything that''s left over

    Other common categories include

    - alt. practically any topic imaginable

    - bit. mirrors of discussions from Listerv lists (that were originally on the
    BTnet network)

    - k12. education topics, from K-12


    Dozens of other categories exist for universities, states, companies, and other
    purposes. Ask your system administrator about what''s available to you, or just
    take a look for yourself.'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# Accessing the Internet


    # # Reading News with pine


    pine is great for reading news, particularly if you use pine to read and send
    email. pine has an easy-to-use interface and a slew of features. To use pine to
    read news, you need to


    +   * Configure pine for news (Figure 12.9)

    * Subscribe to one or more newsgroups (Figure 12.10).


    ![](img/30f4227f5df2c6cea63896bef2fc574f_293_0.png)


    Figure 12.9 you you have to manually set so it knows your server is.


    +   * Read your newsgroup messages (Figure 12.11).


    To configure pine to read news:


    +   1. pine

    At the prompt, type pine.

    2. M

    Press M to get to pine''s main menu.

    3. S

    Press S to enter pine''s setup menu.

    4. C

    As shown in the setup menu, press C to access the configuration screen (Figure
    12.9).


    ![](img/30f4227f5df2c6cea63896bef2fc574f_293_1.png)


    Figure 12.10 you have to subscribe to newsgroups before you can read them in.


    ![](img/30f4227f5df2c6cea63896bef2fc574f_293_2.png)


    Figure 12.11 from here, you can choose newsgroups to read.


    +   5. Scroll down to ntpp-server and press Enter.

    nntpd stands for Network News Transport Protocol, and the server is where you''ll
    find the news.


    +   6. news.yourisp.com

    Type in the server name--some-like news.yourisp.com or news.server.com (with your
    specific information in there, of course). Check with your system administrator
    for the specifics.


    +   7. Press E to exit the configuration screen.


    continues on next page


