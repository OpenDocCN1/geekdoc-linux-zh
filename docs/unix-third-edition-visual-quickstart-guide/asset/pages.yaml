  md: "# Chapter 15\n\n# Evaluating Expressions\nwith expr\n\nUnix also provides expr,\
    \ which you can use for evaluating expressions (In this use, the term expressions\
    \ refers to the mathematical, logical, semantic meaning of the word). In addition\
    \ to evaluating mathematical expressions, you can evaluate darn anything else.\
    \ The expr utility is often used in shell scripts—and you will probably find the\
    \ most value in expr in that context—works just fine as the command line, as shown\
    \ in Code Listing 15.3.\n\n```\n[jdoe@fraz jdoe]$ expr 3 \\* 4\n12\n[jdoe@fraz\
    \ jdoe]$ expr 5 % 3\n2\n[jdoe@fraz jdoe]$ a=$PWD; b=$HOME; expr\n$a = $b\n1\n\
    [jdoe@fraz jdoe]$ cd bin\n[jdoe@fraz bin]$ a=$PWD; b=$HOME; expr\n$a = $b\n0\n\
    [jdoe@fraz bin]$\n```\n\nCode Listing 15.3 Using the expr utility, evaluating\
    \ the value or the truth (or lack thereof) of expressions is straightforward.\n\
    \n# To evaluate with \\* 4\n\n+   * expr \\* 4\nat the shell prompt, enter expr\
    \ followed by the expression it should evaluate. In this example, we're multiplying\
    \ 3 times 4. (We have to use a \\ to escape (protect) the \\* from being interpreted\
    \ as a wildcard by the shell).\n\n+   * expr 5 % 3\n the modulo (remainder) of\
    \ 5 divided by 3. The answer appears on the next line (Code Listing 15.3).\n\n\
    +   * a=$PWD; b=$HOME; expr $a = $b\nThis expression sets a equal to the current\
    \ directory, b equal and compares the two. If it returns 1 (true), you're in your\
    \ home directory. If it returns 0 (false), you're not.\n\n# Tips\n\n+   * Comparisons\
    \ within shell scripts allow you to check whether something is true or not, and\
    \ then act accordingly. Chapter 10 for more information.\n\n+   * The expr man\
    \ page isn't particularly helpful; search the Internet to get help with expr.\n\
    \n320"
