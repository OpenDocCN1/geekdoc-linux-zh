  md: '# Chapter 3


    # To log in as a different user with su:


    +   - su asr


    At the prompt, type su plus the userid of the user you''re logging in as. You''ll
    be prompted for a password just as though you were logging in to the system for
    the first time (Code Listing 3.15).


    If you do not specify a username, the system will assume you mean the root user.


    If you''re logged in as root to begin with, you won''t be prompted to give a password.


    You will now be logged in as the new user and be able to work just as if you were
    that, though you''ll be in the same directory with the same settings that you
    had before you issued the su command.


    # To start a new login shell with su:


    +   - su - yourid


    At the prompt, type su - yourid (of course, use your own userid or that of the
    user you want change to). The addition of the hyphen (-) will force a new login
    shell and set all of the environment variables and defaults according to the settings
    for the user.


    # To return to the previous shell:


    +   - exit


    Type exit at the shell prompt to leave the current shell and return to the previous
    one. If you use exit from the original login shell, you''ll log completely out
    of the Unix system.


    > Tips


    If you have root access and you ssh to the system to administer it, you should
    use su to provide a little extra security. Rather than log directly as having
    your password stolen (or sniffed) off your local system, log in as yourself, then
    use su (with no other information) to get to root.


    If you su to another user with su (no hyphen) and the new user doesn''t read and
    execute permissions for the current directory, you will see shell error messages.
    See Chapter 5 for more about read and execute permissions.'
