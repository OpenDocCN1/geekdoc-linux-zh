  md: '# # WORKING 13 WITH ENCODED & COMPRESSED FILES


    As you use Unix, you will likely encounter encoded or compressed files and need
    to extract, unencode, encode, or otherwise manipulate the files to be able to
    view or use them. This chapter discusses different ways of encoding and compressing
    files.


    +   ### Chapter Contents

    * Encoding files

    * Decoding files

    * Archiving files

    * Unarchiving files

    * Compressing files

    * Uncompressing files

    * Zipping single files

    * Unzipping single files

    * Zipping multiple files and directories

    * Unzipping multiple files and directories

    * Combining commands'
  merge: -1
