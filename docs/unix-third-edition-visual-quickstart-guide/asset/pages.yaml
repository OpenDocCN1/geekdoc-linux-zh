  md: '# Chapter 11


    # # Configuring procmail


    Let''s see...two messages from the boss...17 messages from the collector''s discussion
    group...oh, hey, a message from mom...and...


    One of the finest things you can do to manage your Unix life is to use procmail
    (a mail filtering program) to automatically handle some of your email.


    In this section, we''ll show you how to configure incoming messages. As Figures
    11.16 and 11.17 show, you need to do two things to set up your system to manage
    procmail:


    +   - Specify settings for procmail (Figure 11.16). For example, mail normally
    gets plunged directly into your in-box; however, procmail filters mail before
    it gets to your in-box, you need to tell procmail where your mail folders are,
    among other things.


    +   - Tell procmail to do its thing (Figure 11.17). Essentially, you create a
    .forward file that sends your mailing to procmail for processing before you ever
    see it. This step is not necessary for many systems, particularly newer Linux
    and Unix systems.


    ![](img/30f4227f5df2c6cea63896bef2fc574f_264_0.png)


    Figure 11.16 you the procmail settings you need, and then you''re off and running.


    ![](img/30f4227f5df2c6cea63896bef2fc574f_264_1.png)


    Figure 11.17 Tell the Unix system to send messages to procmail for processing
    to ease your mail management.


    # To specify settings for procmail: ~/.procmailrc


    +   1. pico ~/.procmailrc

    To begin, access your editor and create a .procmailrc file in your home directory.


    +   2. LOGFILE=$HOME/.mailog

    Give procmail a place to log all of its activities, it can tell you what it''s
    done: "I threw away 7 messages from your boss... filed 3 messages from Joe in
    the Goldbutters..." In this example, we tell procmail to keep a log file named
    .mailog in your home directory (Figure 11.16). Keep an eye on this file, because
    it can grow large over time.


    # 11


    CONFIGURING procmail'
