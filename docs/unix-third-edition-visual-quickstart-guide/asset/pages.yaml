  md: '# Chapter 13


    # # Encoding Files

    with uencode


    You''ll use encoding whenever you''re sending

    a binary file (a nontext file) through email or

    posting to a newsgroup. Although many

    email programs and news readers will take

    care of encoding for you (and, therefore,

    you won''t need to mess with the informa-

    t here), you may occasionally need to

    do it yourself.


    Files must be encoded so that they can pass

    through Internet email and news gateways\unscathed. If you don''t encode a file
    and

    your program doesn''t do it for you, the file

    will arrive as a bunch of gibberish

    (because the gateways assume that text

    passing through 7-bit words (bytes),

    while binary files use 8-bit words, thus binary

    files are garbled). To prevent gibberish,

    yencode files before you send them

    along, as in Code Listing 13.1.


    ```

    [ejr@hobbes compression]$ ls

    Folder uelfzip home.gz.uue

    Zipaded file1.html fortunes1.txt newzip.zip

    bigfile.gz file2.html fortunes1.txt ournewhome.jpg

    bigfile.new.gz folder zip temp

