  md: '# Surfing the Web with links


    Using links, a really fancy text-based Web browser, you can surf the Web just
    with Firefox or Internet Explorer, except with no graphics. That''s not really
    a bad thing; consider that you don''t have to deal with pop-up ads, banner or
    similar junk. Just text content, all the time. Links even supports tables and
    Web page designs, which is unusual for a text-based browser (Figure 12.6). Related
    advantages of using links are that you don''t have to deal with slow download
    times for graphics, annoying sound files, plug-ins, or other Web page features.


    To surf the Web with links:


    +   1. http://www.google.com/

    At the prompt, type links followed by the name of .html file or a Web site. Here,
    we''re accessing the Google Web site (Figure 12.6).

    2. Surf the Web or Google for your favorite subject.

    See the sidebars called Navigating with links and Useful Keystrokes in this section
    for details.

    3. Q to quit and return to the prompt. That''s it!


    +   Tip

    Esc to bring up a hand—and very familiar—menu at the top of the screen. Use arrows
    to navigate through the menu and get out of it.


    # Useful links Keystroke


    +   * findme finds text within the file. (Replace findme with the text you are
    looking for). This is also handy to quickly navigate through a page.

    * ? finds back (moving up from the cursor) through the link.

    * D downloads to an address or file. Enter the address at the prompt.

    * Shift G lets you edit the current address.

    * Esc usually lets you back out (escape) from the current menu.

    * S brings up a to manage your bookmarks, bookmarking the current page.

    * \ lets you back and forth between viewing the formatted page and viewing the
    HTML source.

    * Ctrl R reloads the current page and refreshes the screen.


    ![](img/30f4227f5df2c6cea63896bef2fc574f_283_0.png)


    Figure 12.6 The links provide great surfing capabilities, without images.'
