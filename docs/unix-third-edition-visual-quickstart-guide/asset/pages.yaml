- img_proc: true
  md: '# Controlling Ownership & Permissions


    # To set permissions:


    +   chmod u=rwx, g=rx, o=r row*


    Type chmod and specify who has access. In this case users have read, write, and
    execute permissions; the group has read and execute permissions; and others have
    read permission for all files in the directory that start with row (**Code List
    5.8**).


    The equals sign (-) specifies that the permissions granted in the command are
    the only permissions that apply. Any previous permissions will be removed. The
    wildcard here (row*) specifies that the command applies to all files and directories
    that start with "row" in the current directory.


    +   There are about a million and one ways to express permissions. For example,
    you could use chmod ugo=* (note the space after the *) u-rwx, g-rx, o-rwx * to
    revoke permissions from all files in the directory. (Note that you''ll have to
    add your permissions back to the files before you can do anything with them, if
    you try this.)


    +   If you want to change permissions for multiple files, use a wildcard expression
    or separate the filenames with commas (no spaces).


    # Tips


    +   You can also use the -R flag with chmod to recursively apply the changes you
    make to permissions to all files and subdirectories in a directory. For example,
    chmod -R go-rwx * revokes permissions from everyone except the user for all files
    in the current directory, all subdirectories in the current directory, and all
    subdirectories.


    ```

    [ejrhobbes permissions]$ ls -l

    total 332

    -rw-rw-rw 1 ejr users 24850 Jul 24 14:59 black

    -rw-xr--x 1 ejr users 152779 Jul 24 15:10 rowyourout

    -rw-r--r 1 ejr users 128889 Jul 24 14:33 sage.sages

    -rw-r--r 1 ejr users 23890 Jul 24 14:33 sayings

    [ejrhobbes permissions]$ chmod u=rwx,g=rx,o=r row*

    [ejrhobbes permissions]$ ls -l

    -rw-xr--x 1 ejr users 24850 Jul 24 14:59 black

    -rw-xr--x 1 ejr users 152779 Jul 24 15:10 rowyourout

    -rw-xr--x 1 ejr users 128889 Jul 24 14:33 sage.sages

    -rw-xr--x 1 ejr users 23890 Jul 24 14:33 sayings

    [ejrhobbes permissions]$

    ```


    **Code List 5.8** You can set permissions to ensure that all files have equivalent
    permissions.


    ![](img/30f4227f5df2c6cea63896bef2fc574f_121_0.png)'
