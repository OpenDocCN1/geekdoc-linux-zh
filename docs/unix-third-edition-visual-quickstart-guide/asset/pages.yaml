    To explore Unix and its capabilities, you''ll need to move around the directories.
    You do so using the cd command, which takes you from the directory you''re currently
    in to one that you specify. **Listing 1.4** illustrates how you use cd to change
    directories.


    ### To change directories:


    +   1. cd Projects To move to a specific directory, type cd plus the name of the
    directory. In this example, we move down in the directory tree to a subdirectory
    called Projects. (See the Moving Up and Down sidebar for an explanation of "up"
    and "down" mean in Unix terms.)


    +   2. cd .. Type cd .. to move up one level in the directory tree.


    +   3. cd /etc Here,/etc tells the system to look for the /etc directory located
    at the system root.


    continues on next page


    # ## Moving Up and Down


    Throughout this book, we''ll talk about moving "up" and "down" through the Unix
    file system. Moving "up" means moving into the directory—that is, closer to the
    root directory. Moving "down" means moving into subdirectories that are contained
    by the current directory—that is, farther from the root directory.


