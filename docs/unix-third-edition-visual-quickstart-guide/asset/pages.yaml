- img_proc: true
  md: '# Understanding Unix Software Installation


    When installing software on your Unix system, keep in mind two things. First,
    most software, including a script, relies on other programs or scripts being available
    at specific places within the system. For example, a script might require that
    the bash be available and located at /bin/bash. Or, a program might expect it
    will be in /usr/local/bin and that all user home directories will be /home. So,
    you should pay attention during the installation process to make sure that all
    other required scripts or programs are available.


    Second, programs (but not scripts) are compiled, which means they''re taken from
    one probably-mostly-readable-to-you language (generically called source code)
    and translated into computer-readable files (often binaries). As software is compiled,
    hardware and operating system-specific characteristics (or dependencies) are built
    in. So, a program that''s compiled to run on a specific platform and operating
    system cannot run on other ones—that is, a program compiled on Linux on a Pentium
    cannot run on a SPARC, Solaris on a Pentium, or Digital Unix on an Alpha.


    In fact, most Unix programs are distributed as source code, not as binaries, so
    you can compile them for your particular system when installing.


    +   - Tip


    +   Before you get started with the next section, you might quite back to Chapters
    1 and 2 for information about exploring your Unix system and to Chapter 7 for
    a reminder of how to find out what operating system and hardware you using.'
  merge: -1
