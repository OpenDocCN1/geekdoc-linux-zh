  md: 'Using Directories and Files


    # Linking with ln

    (Hard Links)


    Suppose your boss hired an assistant for you (''bout time, right?). You''ll need
    to make sure your new helper can access your files so you can pawn off work on
    him. And, you''ll need to access the revised files just so you can keep up with
    what your helper''s been doing—and perhaps take credit for his work at the next
    staff meeting.


    A great way to give your helper easy access to your files is to create a hard
    link from your home directory. In making an hard link, all you''re starting with
    an existing file and creating a link, (sort of) places the existing file in your
    helper''s home directory. The link does not create a copy of the file; instead,
    you''re creating a second pointer to the same physical file on the disk. Rather
    than the additional pointer being (like an alias or shortcut in Macintosh or Windows
    computers), both of the pointers reference the same actual file, so from the perspective
    of the Unix system, the file actually resides in two locations **Code Listing
    2.14)**


    Because using hard links requires that you have access to another user''s home
    directory, you might venture to Chapter 5 for details about using `chmod`, `chgrp`,
    and `chown` to access another user''s directories and files.


    ```

    $ ls /home/deb/Projects/schedule/our* /home/helper/our*

    s: /home/helper/our*: No such file or directory

    /home/deb/Projects/schedule/our.projects.latest

    /home/deb/Projects/schedule/our.projects.other

    $ ln /home/deb/Projects/schedule/our.projects.latest /home/helper/our.projects

    $ ls -l /home/helper/our*

    --rw-r--r- 3 ejr users 1055 Jun 26 11:00 /home/helper/our.projects

    $

    ```


    **Code Listing 2.14** Hard links let two users easily share files.


