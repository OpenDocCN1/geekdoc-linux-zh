    +   Use -l to display a listing of your cron jobs.


    **Code Listing 9.4** This reminds ejray to go home every day. The message toward
    the end indicates that the cron job has been successfully entered.


    # What Are Those Funky Numbers?


    When entering a cron job, you specify


    +   * Minutes (0–59)

    * Hours (0–23)

    * Day of the month (1–31)

    * Month (1–12)

    * Days of the week (0–6, with Sunday as 0)


    If you replace the number with a *, cron will match all possible values, so if
    a job is scheduled for


    +   * * * * *, it will happen at one minute after every hour

    * 15 3 * * *, it will happen at 3:15 a.m. every day


    +   * 59 23 * * *, it will happen at 11:59 pm, seven times a year (once in each
    of the months with a 31st)

    * 02 * * 0, it will happen at noon on Sundays


    You can use a comma to separate multiple values. For example, if you want something
    to happen on the hour and half-hour day in December, you use 0, 30 * * * 12.*


    Use a hyphen (-) to indicate a range. For example, to schedule for every hour
    from 9 a.m. to 5 p.m. every day, use 09-17 * * *.


    SCHEDULING REGULAR JOBS WITH CRON


