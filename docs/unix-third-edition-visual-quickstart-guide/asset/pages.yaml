  md: '# Chapter 2


    # To make a hard link:


    +   1. ls -l /home/deb/Projects/schedule/*nTo begin, list the files in both directories
    to make sure the file to link exists and that there is no other file in the intended
    name in the target directory. Here, we list the files that start with our in both
    /home/deb/Projects/schedule and in /home/helper. In this example, we''re verifying
    that the file does exist in Deb''s directory and that no matching files were found
    in the helper''s directory

    **(Code Listing 2.14)**


    +   2. ln /home/deb/Projects/schedule/our.projects.latest /home/helper/our.projects

    Here, ln creates a new file with a similar name in the helper''s directory and
    links the two files together, essentially making the same file exist in two home
    directories.


    +   3. ls -l /home/helper/*nWith this code, your helper can verify that the file
    exists by listing files that begin with *.

    Now the file exists in two places with exactly the same content. Either user can
    modify the file, and the content in both locations will change.


    # Tips


    +   You can remove hard links just like you remove files, using rm plus the filename.
    See the section called Removing Files with rm in this chapter.


    +   If one removes the file, the other user can still access the file from his
    or her directory.


    +   Hard links work from file to file only in the same file system. To link directories
    or link across file systems, you''ll have to use soft links, which are covered
    in the next section.


    +   If you''re sneaky, you can use hard links to link directories where you want
    the linked directory to be, and then use ln /home/whoever/existingdirectory/*
    /home/you/newdirectory/newirectory/ to hard link all of the files in the old directory
    to the new directory. Files won''t be joined automatically, but you could use
    a cron to refresh the links periodically—say, daily. See Chapter 9 for cron details.


    LINKING WITH (HARD LINKS)


