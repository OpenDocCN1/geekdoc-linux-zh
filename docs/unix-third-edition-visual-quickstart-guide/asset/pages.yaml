  md: "# Logging in to Remote Systems with ssh\n\nYou might already be using ssh to\
    \ connect to your Unix system. You can then, use it to connect and use practically\
    \ any other computer system on the Internet (assuming you have the rights to log\
    \ in), as **Code Listing 12.1** shows.\n\nTo connect to another computer using\
    \ ssh:\n\n+   1. `server.example.com`\nAt the prompt, type ssh followed by the\
    \ name of the system to which you want to connect.\n2. Log in using the instructions\
    \ you have for accessing the system.\n   Preferably, if you're on the Internet,\
    \ you have some reason to do so and permission to do so. In some cases, you'll\
    \ type the name of the application, or you might be using the remote system just\
    \ as you use the system from which you are connecting.\n3. After you've finished\
    \ using the remote system, log out according to the instructions and policies\
    \ of the remote system.\n\n# Tips\n\n+   - For help with ssh, type ssh at the\
    \ prompt and look at the list of options, or do **man ssh** for more help. When\
    \ you have an active session, use `Enter - ?` to get help with the current session.\n\
    - If you have a different login name on the remote system, you can specify that\
    \ with `ssh server.example.com -l otherusername` to log in more easily. Or, if\
    \ it's easier to remember, try `ssh otherusername@server.example.com`.\n\n```\n\
    [jdoe@frazz jdoe] $ ssh server.example.com\njdoe@server's password:\njoe\njoe\
    \ /home/jdoe $ whoami\njoe\njoe /home/jdoe $ uname -a\nLinux server.example.com\
    \ 2.4.19-ac4 #13 SMP\n-> Sat Nov 16 05:30:56 MST 2002 i686\n-> unknown Gnu/Linux\n\
    joe /home/jdoe $ logout\n[jdoe@frazz jdoe] $\n```\n\n**Code Listing 12.1** Use\
    \ ssh to connect securely to other systems on the Net."
  merge: -1
