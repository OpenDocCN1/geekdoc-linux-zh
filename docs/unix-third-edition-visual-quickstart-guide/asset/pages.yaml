  md: "# Chapter 8\n\n# Setting Aliases with aliases\n\nAliases are nicknames of sorts\
    \ that you use to enter commands more easily. For example, if you frequently use\
    \ the command `mail -s \"today\" < .signature`, you can set an alias for this\
    \ command and call it lunch. Then, in the future, all you have to type in lunch,\
    \ and the result is the same as if you typed the longer command.\n\nTo set an\
    \ alias with:\n\n+   Choose the appropriate file to edit, depending on which you're\
    \ using.\n* zsh users use ~/.zshrc\n* bash users use ~/.bashrc\n* ksh users use\
    \ ~/.profile\n* csh users use ~/.cshrc\n\nIf you don't have the appropriate file,\
    \ you're welcome to use a different configuration file. Many people store all\
    \ their aliases in a separate .aliases file and update their standard configurations\
    \ with a line that references their new .aliases file.\n\n+   .bashrc\nEdit the\
    \ configuration file you've selected.\n\n+   alias quit = \"logout\"\nType alias\
    \ followed by the term you want to use the alias, and the command for which you're\
    \ making an alias (in quotes). Here, we're setting the word quit as an alias for\
    \ the system command logout, so we can type quit instead of logout (Figure 8.8).\n\
    \n+   Add as many other aliases as you want.\nSee the sidebar Good Aliases to\
    \ Set for more ideas.\n\n+   Save the file and exit from the editor.\nSee Chapter\
    \ 4 for details about saving and exiting in vi and pico.\n\n```\n# jdoe@frazraycomm.com:/home/jdoe\n\
    # .bashrc\n\n# User specific aliases and functions\n# Source global definitions\n\
    if -f /etc/bashrc; then\n  /etc/bashrc\nfi\nPS1=\"\\u \\$d $$\nnalias quit=\"\
    logout\"\n\nINSERT\n```\n\nFigure 8.8 Setting aliases can keep you from typing\
    \ names and code.\n\n# 190"
