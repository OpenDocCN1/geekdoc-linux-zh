- img_proc: true
  md: '# Chapter 1


    Many of the examples and screenshots for this book were taken from Unix systems
    running under VMware on one of our desk-top systems.


    Cygwin provides you with a Unix environment that''s actually part of your Windows
    system. It takes a bit of getting used to, but Cygwin is stable and reliable.
    The hardest part about using Cygwin is it can be confusing to know if you''re
    dealing with Unix or Windows at any given moment.


    # Different Unix flavors


    So, all given of those options on how to get access to Unix, the choice of which
    kind of Unix (which Unix flavor) must be clear and straightforward—right? Of course.


    If you''re just getting started with Unix, recommend choosing the flavor that
    your most techie friends or the folks at work use. This will give you potential
    built-in support options.


    If you''re starting purely from scratch, look into the most popular and highly-rated
    Linux distributions. (Currently, the Web site www.distrowatch.com gives a great
    set of recommendations, but as you know, Web sites change, so you might want to
    do some Web searching for recommended Linux distributions.)


    A newly (or popular again) option is Solaris, from Sun Micros. For a while Solaris
    was a bit tricky (a little trick) to get installed and functional on a regular
    desktop system: however, it''s now nearly easy as the easier Linux systems, and
    it offers a tremendous amount of power and flexibility, in addition to some cutting-edge
    technologies.


    That said, any option you choose will be pretty similar for the purposes of this
    book. Differences among the options primarily show up in more advanced applications.


    +   * Tip

    * If you''re using Mac OS X or later, you''re already using Unix—you just need
    to bring up a command to be able to follow right along with the book.'
