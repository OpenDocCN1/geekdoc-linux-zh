    ```


    Another command you can use is sed, which lets you make multiple changes to files,
    without ever opening an editor. For example as a new Webmaster, you might use
    sed to change all occurrences of the previous Webmaster''s address to yours. We
    will show in this, how you can use sed to make global changes within documents.


    To make global changes with sed:


    +   - sed ''/s/oldaddr@raycomm.com /

    -> /newaddr@raycomm.com /g'' address.htm

    -> address-new.htm

    - A single quote ('')

    - A leading ""

    - A slash (/

    - The text you want to replace

    (oldaddr@raycomm.com)

    - Another slash /

    - The replacement text (newaddr@raycomm.com/g)

    - Another single quote ('''')

    - g, which tells sed to change the address globally. (if you omit the g, only
    the first occurrence on each line will be changed).

    - The name of the file in which the changes should be made (address.htm)

    - You can redirect the output to a new file-name (see Code Listing 6.10) or pipe
    it to another command entirely. You cannot redirect it to the same filename or
    you''ll end up with no content in your file.


    Code Listing 6.10 You use sed to make multiple changes throughout files, such
    as the address here.


    # Tips


    +   - You can sed zip through multiple documents. See Chapter 10 for information
    on how to make a shell script with a loop.

    - sed commands can be long and unwieldy, it might be helpful to save the commands
    in a text file (so you don''t have to type them), if you saved the s/oldaddr@raycomm.com/newaddr@raycomm.com/g
    in a file called script.sed, sed -f script.sed address.htm > address-new.htm to
    run the sed commands from the script sed file. You can have as many commands as
    you want in your script.sed file.'
