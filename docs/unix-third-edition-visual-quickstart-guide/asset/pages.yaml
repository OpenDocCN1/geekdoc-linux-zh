  md: '# RUNNING SCRIPTS AND PROGRAMS


    Throughout this book, you''ve been running scripts and programs by typing in commands
    and pressing Enter. The commands zoom along with the Unix system, which responds
    by obediently doing whatever the command or script dictates. In doing this, you
    run the commands and scripts—called jobs—right then and there.


    You can also run jobs at specified times; run them on a schedule you set up; or
    start, stop, or delete them as you choose. Plus, you can find out when they are
    scheduled to run, how long they take, or monitor them as they run. Sound cool?
    Great! Let''s take a look.


    # Chapter Contents


    +   * Running commands

    * Scheduling one-time jobs

    * Scheduling regularly occurring jobs

    * Suspending jobs

    * Checking job status

    * Running jobs in the background

    * Running jobs in the foreground

    * Controlling job priority

    * Timing jobs

    * Finding running processes

    * Deleting processes'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# Chapter 9


    # Running a Command


    Throughout this book, you''ve been practicing running a single command. Unix doesn''t
    really care if you''re running a built-command that came with the system, a program
    you installed later, or a script your best friend wrote—it''s all the same to
    Unix. Code Listing 9.1 shows some options on running a command.


    To run a command:


    +   - ls

    At the shell prompt, type the command and press Enter.


    To run a specific command:


    +   - /home/jdoe/scripts/ls

    It''s certainly possible that you would want to write a script in your directory
    in a special way—for example, a script to list the files and save the listing
    into a new file for later reference. (You might name it ls if you want to.) but
    could certainly call it something else. To run the specific script, enter the
    whole path to the script (so Unix doesn''t run the first one it finds in your
    path). See Chapter 8 for more path statements.


    ```

    $jfrazz Project]$ ls

    keep keeper.jpg kept kidder.txt kiddo

    -> kidnows kidniepie kids kidupdate

    $[jfrazz Project]$ /bin/ls

    keep keeper.jpg kept kidder.txt kiddo

    -> kidnows kidniepie kids kidupdate

    $[jfrazz Project]$ /home/jdoe/

    scripts/ls

    keep keeper.jpg kept kidder.txt kiddo

    -> kidnows kidniepie kids kidupdate

    You listed these files.

    $[jfrazz Project]$ ls; pwd

    keep keeper.jpg kept kidder.txt kiddo

    -> kidnows kidniepie kids kidupdate

    /home/jdoe/Project

    $[jfrazz Project]$

    ```


    Code Listing 9.1 To run a script, command, or program, just enter the name or
    the path and at the shell prompt.


    # Tips


    +   - You can combine commands on the same line, as you''ve seen earlier in this
    book. Just use a ; to separate the commands, and you''re set. For example, you
    could do ls; pwd to list files and show the current directory.


    +   - If you use && to combine commands, the system will run in sequence but run
    the second only if the first succeeds. For example, you could use mv todolist.done
    && touch todolist move your to-do to a different file and create a new to-do list.
    If the first command fails (for example, because you don''t have permission to
    create a new file), the second command won''t run.


