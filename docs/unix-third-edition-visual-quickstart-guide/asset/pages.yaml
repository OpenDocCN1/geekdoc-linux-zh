  md: '# Chapter 10


    # # Running a Shell Script


    After you created a script in your editor and saved the script file, your next
    step is to run it, which means to execute every command in the script the order
    provided. (Yes, you did this in the previous section, but we''ll expand on here.)
    As Figure 10.2 shows, you can do this using the sh command (or the name of the
    shell you''re using) followed by the name of the shell you want to run.


    ## To run a script:


    +   - sh myscript


    At the shell prompt, type sh (or the name of the shell, like ksh or csh, you want
    to run the name of the script). In this case, you''re just telling sh to run and
    to use the list of commands in the myscript file. You''ll see the words of the
    script—in this case, words appear onscreen, as shown in Figure 10.2.


    ![](img/30f4227f5df2c6cea63896bef2fc574f_228_0.png)


    Figure 10.2 Running a script is as easy as typing sh plus the filename of the
    script.


    # Tip


    +   - Note that in this example, you''re explicitly telling Unix the name of the
    script to run (myscript). When you do so, the #!/bin/sh line at the top of the
