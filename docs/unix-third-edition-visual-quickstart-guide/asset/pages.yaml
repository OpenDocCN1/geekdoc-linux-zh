  md: "Chapter 6\n\n# # Redirecting to Multiple Locations with tee\n\nSuppose you\
    \ just updated your address book file and want to send it to your boss in addition\
    \ to putting it in your own files. You can, using tee, which redirects output\
    \ to two different places (see **Code Listing 6.19**).\n\n**To redirect output\
    \ to two locations with tee:**\n\n+   * sort address.book new.addresses\n  * `tee\
    \ sorted.all | mail`\n  * `boss@raycomm.com -s \"Here's the address book, boss\"\
    `\n\nAt the shell prompt, use the tee command plus a filename in the middle of\
    \ the pipe line to send the sorted information to that filename as well as to\
    \ the standard output (which could, of course, be redirected to another filename).\
    \ Here, we send the results of the sort to `sorted.all` file and to standard output,\
    \ where `mail` will take over and send the file to the boss. See Chapter 11 for\
    \ more on fancy mail tricks.\n\n> ### Tee Time?\nnYou might think of the tee command\
    \ as being similar to a plumber's pipe joint—that is, it takes stuff from one\
    \ location and sends it to two different places.\n\n```\n[ejr@hobbes manipulate]$\
    \ sort address.book new.addresses tee sorted.all | mail\n  + boss@raycomm.com\
    \ -s \"Here's the address book, boss\"\n[ejr@hobbes manipulate]$\n```\n\n**Code\
