    **Code Listing 3.16** You can straighten out a confused terminal prompt or Unix
    system by using a stty command. One of the xrange is Backspace key.


    Another handy thing you can do with your shell is to fix those annoying problems
    that occur with terminal programs. Back in Chapter 1, we mentioned that you might
    encounter oddities such as `Backspace` and `Delete`. You can fix these problems
    using stty **Code Listing 3.16.**


    To fix `Backspace` and `Delete` key oddities with stty:


    ```

    xmission> jf^^^H

    jf^^^H: Command not found

    xmission> ls ^^^H

    : No such file or directory

    xmission> stty erase ''^H''

    xmission>

    ```


    **Code Listing 3.17** The stty command here fixes Delete key to work like Backspace.


    +   - stty erase ''^''

    If you''re using `Backspace` erasing characters to the left of the cursor and
    you get a bunch of ^ symbols on the screen when you type, you need to educate
    the terminal about your preferences. Type stty `Backspace` to fix it (Code Listing
    3.16).


    In some cases, depending on your terminal program, you might need to set stty
    erase ''^H'' and then use `Ctrl-H` to backspace. To enter this command, type stty
    erase ''^V'' `Ctrl-H` (**Code Listing 3.17**) with stty:


    # To fix general terminal weirdness


    +   - stty sane

    Typing sane at the prompt will fix a lot of oddities. For example, if you accidentally
    issue a bad command and all of a sudden shows up on the screen or if you have
    gibberish showing up on the screen, `stty sane` will return your terminal session
    to sanity.

    The reset command is also effective at fixing a messed up terminal.


    # Tips


    +   - If stty sane doesn''t fix a messed-up display, try logging out and logging
    back in or restarting your terminal program.

    - You can fix `Backspace` oddities permanently by adding the appropriate stty
    command to your configuration files or by making changes in your terminal client.
    See Chapter 8 for details about your configuration files. Refer to Chapter 1 for
    more helpful details about terminal programs like SSH and telnet.


