  md: '# # Changing Your Identity with SU


    Occasionally, you may need to log in with a userid other than your own or need
    to relog in with your own userid. For example, you might want to check configuration
    settings that you''ve changed before logging out to make sure that they work.
    Or, if you change your shell, you might want to check it before you log out (and
    you should do that, by the way).


    You can use the su (substitute user) command to either log in as another user
    (**Code Listing 3.15**) or to start a new shell.


    ```

    ejr@hobbes]$ ls

    Projects testing

    [ejr@hobbes]$ su asr

    Password:

    [as@hobbes]$ ls

    Projects testing

    [as@hobbes]$ su - ejr

    Password:

    [ejr@hobbes]$ ls

    Mail            editme          script2.sed

    Projects        fortunes.copy   scriptextra.sed

    Xrootenv.0      fortunes1.txt  sedtest

    above.htm       fortunes2.txt  sorted.address.temp

    address.book   groups          temp.htm

    address.temp   history.txt     tempsport

    axhome          html.htm        test

    bogus           html.txt        test2

    chmod.txt      mail            testing.gif

    clean           manipulate      testing.wp

    compression    nsmail          typescript

    [ejr@hobbes]$ exit

    [as@hobbes]$ exit

    [ejr@hobbes]$ exit

    ```


    **Code Listing 3.15** Changing back and forth from one user to another (exiting
    from multiple shells) can get quite confusing, the prompt often tells you who
    you are and what directory you''re in.'
