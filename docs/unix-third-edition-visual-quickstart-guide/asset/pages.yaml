  md: '# Sensational Unix Tricks


    # Tip


    You can also build in an option to redirect the output of the script to a file
    and save it for later. Basically, all you do is create an if-then statement and
    give yourself the option of automatically redirecting the output to a filename,
    by **Code Listing 17.7** shows. Check out Chapter 10 for more information about
    scripts and if-then statements.


    ![](img/30f4227f5df2c6cea63896bef2fc574f_371_0.png)


    ```

    ejr@hobbes creative$ more rot13

    #! /bin/sh


    # If the first item (after the script name) on the command

    # line is save or s, and the second item is a readable file

    # then do do the first case.

    if [ "$1" = "save" -o "$s" \ -a -r "$2" ]; then

    # This case saves the ROT13 output under the same filename

    # a rot13 extension.

    # /bin/sed

    y/abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZnopqrstuvwxyzabcdefghijklmNOPQRST

    -> UVQRSTUVWXYZDEFGHIJKL/ "$2" > "$2.rot13"

    el


    # This case pipes the ROT13 output to more, because a save

    # wasn''t specified.

    # /bin/sed

    y/abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZnopqrstuvwxyzabcdefghijklmNOPQRST

    -> UVQRSTUVWXYZDEFGHIJKL/ "$1" | more


    ejr@hobbes creative$

    ```


