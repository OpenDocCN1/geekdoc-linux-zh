- img_proc: true
  md: '# # Peazip Install Using .deb


    ![](img/3240f4640ba4bfddd4427509e9f648f4_174_0.png)


    # ## Linux manager: Open Source WinZip alternative alternative


    Pezip is an Open Source (LGPL) cross-platform archive manager software, providing
    strong encryption and compression functions, which can open and extract over 200
    archive formats such as ZIP, RAR, 7Z, GZ, ISO, NRG, TAR, WIM, 2z, 2000, 2004,
    Zstandard, and more.


    Open Source WinZip alternative, free software that provides powerful utilities
    on Linux operating systems. Peazip provides high compression ratio (compress to
    7Z, ZIP, etc.), decryption of several archive types, supporting multiple encryption
    (AES, Fish, Serpent, Blowfish, Twofish) and is available on different desktop
    environments (such as GNOME, KDE, XFCE, Cinnamon, macOS, and Windows). It can
    be used via the GUI or as command line interface.


    In Peazip does not stay on Wayland, we might need to use Peazip using GTK. PLATFORM-web-peazip


    > * Extraction of ACE archives requires separate plugin (download source) available
    on Peazip add-on page.


    https://github.com/peazip/releases/download/8.7.0/LINUX.GTK2-1_amd64.deb mg 7z
    / peazip Open Source zur implementation, separate Linux


    Go to,

    https://peazip.github.io/peazip-linux.html


    Click, DEB GTK2 to Download peazip_8.7.0.LINUX.GTK2-1_amd64.deb


    Go to, Where peazip_8.7.0.LINUX.GTK2-1_amd64.deb is Downloaded

    Double Click, peazip_8.7.0.LINUX.GTK2-1_amd64.deb


    Click, Install


    # Oceanof/PDF.com'
