    # 魔兽世界插件管理器


    魔兽世界插件管理器极大简化了搜索、安装和更新魔兽世界插件的过程，并具有以下功能：

    - 从 Curseforge 等源安装插件

    - 更新所有或单个插件

    - 移除插件


    本章涵盖：

    - Curseforge 手动添加游戏

    - Curseforge 安装插件

    - Curseforge 更新插件

    - Curseforge 移除插件


    # 使用 .AppImage 使用 Curseforge


    访问：https://download.curseforge.com/


    点击（仅限 WoW）下载 curseforge-latest-linux.zip。前往 curseforge-latest-linux 的下载位置。双击 curseforge-latest-linux。解压到
    ~/Downloads。前往 curseforge-appimage 的解压位置。双击 curseforge-appimage 进行整合并运行。


    # Curseforge 手动添加游戏


    ![](img/3240f4640ba4bfddd4427509e9f648f4_561_0.png)


    打开 Curseforge。


    点击三个垂直点的图标。


    手动添加游戏。


    选择 World of Warcraft _retail_（正式服）或 _classic_（怀旧版LK）或 _era_（魔兽怀旧版）。


    # Curseforge 安装插件


    ![](img/3240f4640ba4bfddd4427509e9f648f4_562_0.png)


    打开 Curseforge。


    点击 Get More Addons（获取更多插件）。


    点击搜索栏。


    输入：CurseReborn。


    点击与 CurseReborn 同行的 Install（安装）。


    # Curseforge 更新插件


    ![](img/3240f4640ba4bfddd4427509e9f648f4_563_0.png)


    打开 Curseforge。


    点击 My Addons（我的插件）。


    点击 Update All（全部更新）。


    # Curseforge 移除插件


    ![](img/3240f4640ba4bfddd4427509e9f648f4_564_0.png)


    打开 Curseforge。


    右键点击 CurseReborn。


    点击 Delete Addon（删除插件）。


