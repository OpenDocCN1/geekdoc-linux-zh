    \nClick IPv4.\nMove Switch in the same row as DNS and Automatic to the left.\n\
    Click + under DNS.\nClick 1st Box in the same row as Server.\nType In,\n`84.200.69.80`\n\
    Click 2nd Box In the same row as Server.\nType In,\n`84.200.70.40`\nClick IPv6.\n\
    \nMove Switch in the same row as DNS and Automatic to the left.\nClick + under\
    \ DNS.\nClick 1st Box in the same row as Server.\nType In,\n`2001:1608:10:25::1c04:b12f`\n\
    Click 2nd Box in the same row as Server.\nType In,\n`2001:1608:10:25::9249:d69b`\n\
    Click Apply.\nMove Switch in the same row as Network connected to the internet\
