    \n打开终端。\n输入：\n`sudo apt install sweeper`\n\n按下回车。\n\n## 系统设置\n\n系统设置涉及保持系统及其软件包的更新，并允许用户配置系统、喜好设置，并包括：\n\
    \n- 保持显卡和其他附加驱动程序的更新\n- 更新 Linux Mint 21 及其他软件包\n- 通过 PPA 添加更多更新版本的驱动程序\n\n本章涵盖：\n\
    \n### 32 位架构\n- 使用 apt 命令行安装 32 位架构\n\n### 备用 DNS 服务器\n- 使用网络设置备用 DNS 服务\n- 其他备用\
    \ DNS 服务列表\n\n### 自动挂载磁盘\n- 使用“磁盘”（Disks）工具自动挂载磁盘\n\n### 显卡驱动\n- 使用 apt 命令行安装\
    \ AMD 显驱动\n- 使用 ppa-purge 命令行恢复 AMD 显驱动默认\n- 使用软件管理器安装 Nvidia 显驱动\n- 使用 apt 命令行安装\
    \ Nvidia 显驱动\n\n### Mousepad（编辑器）\n- 使用软件管理器安装 Mousepad\n- 使用 apt 命令行安装 Mousepad\n\
    \n### 鼠标速度\n- 将鼠标速度设置为最大\n\n### 夜间模式\n- 设置夜间模式（蓝光防护）\n\n###  Intel 音频杂音修复\n- 使用\
    \ echo 命令行修复可能的 Intel 音频杂音\n- 清理 PPAs\n- 使用“软件源”清理 PPAs\n- PPA 清理\n- 使用 ppa-purge\
    \ 命令行清理 PPAs\n\n### 设置默认应用程序\n- 按类别设置默认应用程序\n- 按文件扩展名设置默认应用程序\n\n### 启动应用程序\n\
    - 使用已安装的应用设置启动项\n- 使用自定义命令设置启动项\n\n### 卸载应用程序\n- 卸载软件管理器应用程序\n- 卸载 apt 命令行应用程序\n\
    - 卸载 Snap Store 安装的应用程序\n- 卸载 snap 命令行应用程序\n- 卸载 deb-get 命令行应用程序\n\n### 更新 Linux\
    \ Mint 21\n- 使用更新管理器更新 Linux Mint 21\n- 使用 apt 命令行更新 Linux Mint 21\n\n### 更新 Linux\
    \ Mint 21 内核\n- 使用更新管理器更新 Linux Mint 21 内核\n\n## 32 位架构\n\n### 使用 apt 命令行安装 32\
    \ 位架构\n\n```bash\nmlnxpc1@mlnxpc1-MS-7C31: ~ \nFile Edit View Search Terminal\
    \ Help\nmlnxpc1@mlnxpc1-MS-7C31:~$ sudo dpkg --add-architecture i386\n```\n\n\
    打开终端。\n输入：\n`sudo dpkg --add-architecture i386`\n\n按下回车。\n\n## 备用 DNS 服务器\n\n\
    ### 使用网络设置备用 DNS 服务\n\n![](img/3240f4640ba4bfddd4427509e9f648f4_436_0.png)\n\n\
    打开网络。\n点击可以访问互联网的已连接连接行中的齿轮图标。\n\n### 有线\n\n![](img/3240f4640ba4bfddd4427509e9f648f4_437_0.png)\n\
    \n点击 IPv4。\n将 DNS 和 Automatic（自动）所在行的开关向左移动。\n点击 DNS 下方的 `+` 号。\n点击 Server 行的第一个输入框。\n\
    输入：\n`84.200.69.80`\n点击 Server 行的第二个输入框。\n输入：\n`84.200.70.40`\n点击 IPv6。\n\n将 DNS\
    \ 和 Automatic（自动）所在行的开关向左移动。\n点击 DNS 下方的 `+` 号。\n点击 Server 行的第一个输入框。\n输入：\n`2001:1608:10:25::1c04:b12f`\n\
    点击 Server 行的第二个输入框。\n输入：\n`2001:1608:10:25::9249:d69b`\n点击应用。\n将连接的网络行向左再向右移动（中间留出间隔）以使更改。\n\
    \n## 其他备用 DNS 服务\n\n### CleanBrowsing\n\nhttps://cleanbrowsing.org/filters/\n\n\
