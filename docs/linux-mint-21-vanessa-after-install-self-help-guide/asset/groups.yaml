    \n### Mousepad\n- Mousepad Install Using Software Manager\n- Mousepad Install\
    \ Using apt Command Line\n\n### Mouse Speed\n- Setting Mouse Speed to Max\n\n\
    ### Night Light\n- Setting Up Night Light (Blue Light Protection)\n\n### Possible\
    \ Intel Sound Crackle Fix\n- Possible Intel Sound Crackle Fix Using echo Command\
    \ Line\n- Purge PPAs\n- Purge PPAs Using Software Sources\n- PPA Purge\n- Purge\
    \ PPAs Using ppa-purge Command Line\n\n### Set Default Application\n- Set Default\
    \ Application for Category\n- Set Default Application Per File Extension\n\n###\
    \ Startup Applications\n- Startup Applications Using Installed Applications\n\
    - Startup Applications Using Custom Commands\n\n### Uninstalling Applications\n\
    - Uninstall Software Manager Applications\n- Uninstall apt Command Line Applications\n\
    - Uninstall Snap Store Installed Applications\n- Uninstall snap Command Line Applications\n\
    - Uninstall deb-get Command Line Applications\n\n### Updating Linux Mint 21\n\
    - Updating Linux Mint 21 Using Update Manager\n- Updating Linux Mint 21 Using\
    \ apt Command Line\n\n### Updating Linux Mint 21 Kernel\n- Updating Linux Mint\
    \ 21 Kernel Using Update Manager\n\n## 32 Bit Architecture\n\n### 32 Bit Architecture\
    \ Install Using apt Command Line\n\n```bash\nmlnxpc1@mlnxpc1-MS-7C31: ~ \nFile\
    \ Edit View Search Terminal Help\nmlnxpc1@mlnxpc1-MS-7C31:~$ sudo dpkg --add-architecture\
    \ i386\n```\n\nOpen Terminal.\nType In,\n`sudo dpkg --add-architecture i386`\n\
    \nPress Enter.\n\n## Alternative DNS Servers\n\n### Alternative DNS Services Setup\
    \ Using Network\n\n![](img/3240f4640ba4bfddd4427509e9f648f4_436_0.png)\n\nOpen\
