    ## LibreOffice


    ### LibreOffice Install Using Software Manager


    ![](img/3240f4640ba4bfddd4427509e9f648f4_345_0.png)


    Open, Software Manager


    Type In,


    libreoffice


    Click, LibreOffice


    Click, Install


    ## LibreOffice Install Using apt Command Line


    ```

    mlnxpc1@mlnxpc1-MS-7C31:~$ sudo apt install libreoffice

    ```


    Open, Terminal


    Type In,


    sudo apt install libreoffice


    Press, Enter


    ## LibreOffice Install Using flatpak Command Line


    ![](img/3240f4640ba4bfddd4427509e9f648f4_347_0.png)


    Open, Terminal


    Type In,


    flatpak install flathub org.libreoffice.LibreOffice


    Press, Enter


    ## LibreOffice Install Using Snap Store


    ![](img/3240f4640ba4bfddd4427509e9f648f4_348_0.png)


    Open, Snap Store


    Type In,


    libreoffice


    Click, libreoffice


    Click, Install


    ## LibreOffice Install Using snap Command Line


    ![](img/3240f4640ba4bfddd4427509e9f648f4_349_0.png)


    Open, Terminal


    Type In,


    sudo snap install libreoffice


    Press, Enter


    ## OnlyOffice


    ### OnlyOffice Install Using Software Manager


    ![](img/3240f4640ba4bfddd4427509e9f648f4_350_0.png)


    Open, Software Manager


    Type In,


    onlyoffice


    Click, OnlyOffice Desktop Editors


    Click, Install


    ## OnlyOffice Install Using flatpak Command Line


    ```

    mlnxpc1@mlnxpc1-MS-7C31:~$ flatpak install flathub org.onlyoffice.desktopeditors

    ```


    Open, Terminal


    Type In,


    flatpak install flathub org.onlyoffice.desktopeditors


    Press, Enter


    ## OnlyOffice Install Using Snap Store


    ![](img/3240f4640ba4bfddd4427509e9f648f4_352_0.png)


    Open, Snap Store


    Type In,


    onlyoffice


    Click, onlyoffice-desktopeditors


    Click, Install


    ## OnlyOffice Install Using snap Command Line


    ![](img/3240f4640ba4bfddd4427509e9f648f4_353_0.png)


    Open, Terminal


    Type In,


    sudo snap install onlyoffice-desktopeditors


    Press, Enter


    ## OnlyOffice Install Using .deb


    ![](img/3240f4640ba4bfddd4427509e9f648f4_354_0.png)


    Go to,


    https://www.onlyoffice.com/en/download-desktop.aspx


    Under, Debian 8, Ubuntu 14.04 and higher, Click, DOWNLOAD DEB to Download onlyoffice-desktopeditors_amd64.deb


    Go to, Where onlyoffice-desktopeditors_amd64.deb is Downloaded


    Double Click, onlyoffice-desktopeditors_amd64.deb


    Click, Install


    ## OpenOffice


    ### OpenOffice Install Using .AppImage


    ![](img/3240f4640ba4bfddd4427509e9f648f4_355_0.png)


    OpenOffice has a lot in common with LibreOffice because they are sharing the same
    code. Development on OpenOffice has lagged behind LibreOffice because of its slow
    development cycle which was one of the main reasons LibreOffice broke off them
    back in the day, however OpenOffice remains a viable alternative with many of
    the functions in LibreOffice and many years of development work.


    Go to,


    https://appre.de/appimage/openoffice


    Click, DOWNLOAD to Download OpenOffice.AppImage


    Go to, Where OpenOffice.AppImage is Downloaded


    Double Click, OpenOffice.AppImage


    Click, Integrate and Run

