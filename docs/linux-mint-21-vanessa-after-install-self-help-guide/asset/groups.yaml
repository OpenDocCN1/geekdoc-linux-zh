    `sudo apt install synaptic`\n\n按下回车。\n\n## Sweeper（清理器）\n\n### 使用软件管理器安装 Sweeper\n\
    \n![](img/3240f4640ba4bfddd4427509e9f648f4_431_0.png)\n\n打开软件管理器。\n输入：\n`sweeper`\n\
