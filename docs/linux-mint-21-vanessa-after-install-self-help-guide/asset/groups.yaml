- md: "\n## SMPlayer Install Using Snap Store\n\n![](img/3240f4640ba4bfddd4427509e9f648f4_286_0.png)\n\
    \n- Open, Snap Store\n- Type In, smplayer\n- Click, smplayer\n- Click, Install\n\
    \n## SMPlayer Install Using snap Command Line\n\n![](img/3240f4640ba4bfddd4427509e9f648f4_287_0.png)\n\
    \n- Open, Terminal\n- Type In, sudo snap install smplayer\n- Press, Enter\n\n\
    ## VLC\n\n## VLC Install Using Software Manager\n\n![](img/3240f4640ba4bfddd4427509e9f648f4_288_0.png)\n\
    \n- Open, Software Manager\n- Type In, vlc\n- Click, VLC\n- Click, Install\n\n\
    ## VLC Install Using apt Command Line\n\n![](img/3240f4640ba4bfddd4427509e9f648f4_289_0.png)\n\
    \n- Open, Terminal\n- Type In, sudo apt install vlc\n- Press, Enter\n\n## VLC\
    \ Install Using flatpak Command Line\n\n![](img/3240f4640ba4bfddd4427509e9f648f4_290_0.png)\n\
    \n- Open, Terminal\n- Type In, flatpak install flathub org.videolan.VLC\n- Press,\
    \ Enter\n\n## Modern Gaming\n\nModern Gaming is dedicated to playing modern games\
    \ on Linux Operating Systems, featuring:\n\n- KDE Games offering a wide variety\
    \ of desktop fun\n- Lutris making it easier than ever before to play World of\
    \ Warcraft\n- Steam granting access to the largest digital gaming store front\n\
    \nThis chapter covers:\n\n### WINE\n- WINE Staging Install Using apt Command Line\n\
    \n### Lutris\n- Lutris Install Using Software Manager\n- Lutris Install Using\
    \ apt Command Line\n- Lutris Install Using Repository and apt Command Line\n\n\
    ### Steam\n- Steam Install Using Software Manager\n- Steam Install Using apt Command\
    \ Line\n- Steam Install Using Snap Store\n- Steam Install Using snap Command Line\n\
    \n### ProtonUp-Qt\n- ProtonUp-Qt Install Using Software Manager\n- ProtonUp-Qt\
    \ Install Using flatpak Command Line\n- ProtonUp-Qt Install Using .AppImage\n\n\
    ### Proton-GE\n- Proton-GE Lutris Install Using .tar.gz\n- Proton-GE Steam Install\
    \ Using .tar.gz\n\n### WINE-GE\n- WINE-GE Lutris Install Using .tar.xz\n\n###\
    \ DXVK\n- DXVK Install Using .sh Command Line\n\n### VKD3D\n- VKD3D Install Using\
    \ .sh Command Line\n\n### Gnome Games\n- Gnome Games Install Using apt Command\
    \ Line\n\n### KDE Games\n- KDE Games Install Using apt Command Line\n\n### Gamehub\n\
    - Gamehub Install Using Software Manager\n- Gamehub Install Using flatpak Command\
    \ Line\n\n## WINE\n\n## WINE Staging Install Using apt Command Line\n\n```\nminxpc1@minxpc1-MS-7C31:\
    \ ~ _\nFile Edit View Search Terminal Help\nminxpc1@minxpc1-MS-7C31:~$ sudo dpkg\
    \ --add-architecture i386 && sudo apt update\n```\n\n- Open, Terminal\n- Type\
    \ In, sudo dpkg --add-architecture i386 && sudo apt update\n- Press, Enter\n\n\
    ```\nmlnxpc1@mlnxpc1-MS-7C31:~$ wget -nc https://dl.winehq.org/wine-builds/ubuntu/dists/jammy/winehq-jammy.sources\n\
