    # World of Warcraft Addon Managers


    World of Warcraft Addon Managers greatly ease the process of searching for, installing
    and updating World of Warcraft Addons, come with features such as:

    - Installing addons from sources such as Curseforge

    - Updating all or individual addons

    - Removing addons


    This chapter covers:

    - Curseforge Manually Add Game

    - Curseforge Install Addon

    - Curseforge Update Addon

    - Curseforge Remove Addon


    # Curseforge Using .AppImage


    Go to: https://download.curseforge.com/


    Click (WoW only) to download curseforge-latest-linux.zip. Go to where curseforge-latest-linux
    is downloaded. Double click curseforge-latest-linux. Extract to ~/Downloads. Go
    to where curseforge-appimage is extracted. Double click curseforge-appimage to
    integrate and run.


