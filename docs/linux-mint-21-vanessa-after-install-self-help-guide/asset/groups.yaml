    ## 使用 .deb 安装 Peazip


    ### Linux 管理器：WinZip 的开源替代方案


    ![](img/3240f4640ba4bfddd4427509e9f648f4_174_0.png)


    Peazip 是一款开源（LGPL）跨平台归存档软件，提供强大的加密和压缩功能，可以打开并解压 200 多种压缩格式，如 ZIP, RAR, 7Z, GZ,
    ISO, NRG, TAR, WIM, 7z, 2000, 2004, Zstandard 等。


    开源 WinZip 替代方案，一种在 Linux 操作系统上提供强大工具的免费软件。Peazip 提供了高压缩率（压缩为 7Z, ZIP 等）、多种存档格式的解密，支持多种加密（AES,
    Fish, Serpent, Blowfish, Twofish），并适用于不同的桌面环境（如 GNOME, KDE, XFCE, Cinnamon, macOS
    和 Windows）。它可以通过图形界面或命令行界面进行使用。


    如果 Peazip 未运行在 Wayland 上，我们可能需要使用基于 GTK 的 Peazip。PLATFORM-web-peazip


    > 提取 ACE 归档需要单独的插件（可在 Peazip 插件页面下载下载源文件）。


    https://github.com/peazip/releases/download/8.7.0/LINUX.GTK2-1_amd64.deb 7z /
    peazip Open Source zur implementation, separate Linux


    - 访问，https://peazip.github.io/peazip-linux.html

    - 点击，DEB GTK2 下载 peazip_8.7.0.LINUX.GTK2-1_amd64.deb

    - 找到 peazip_8.7.0.LINUX.GTK2-1_amd64.deb 的下载路径

    - 双击，peazip_8.7.0.LINUX.GTK2-1_amd64.deb

    - 点击，Install


