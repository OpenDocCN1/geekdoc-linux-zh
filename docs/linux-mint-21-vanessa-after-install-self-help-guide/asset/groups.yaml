    of the author, otherwise circulated in any form of binding or cover other than
    that in which it is published and without a similar condition including this condition
    being imposed on the subsequent purchaser.


    # Disclaimer


    All information in this book is provided on the “as is” basis without any warranty.
    However effort has been taken without exception while preparing this book, neither
    the author nor the publisher shall have any liability to any person or entity
    with respect to any loss of damage caused or directly or indirectly by the contents
    of this book.


    None of the content within this book is official or sponsored and is not supported
    by any trademark owners, whether open or closed source.


    This book is only for self-help and learning purpose of customers.


    # Trademark


    Trademarked names show up in this book, for example Blizzard Battle.net, Microsoft,
    Youtube and several more, and have been used in this book without intention of
    trademark infringement, and have been obscured with only the names used in an
    self-help or learning purpose and to the benefit of the trademark owner.


    All trademarks are acknowledged as belonging to their respective owners.


    This book is only for self-help and learning purpose of purchasers.


    None of the content within this book is official or sponsored and is not supported
    by any trademark owners, whether open or closed source.


    Linux is the registered trademark of Linux Torvalds in the U.S. and other countries.


    # Acknowledgements


    To my family without whom none of this would have been possible.


    Linus Torvalds is the creator of Linux and holder of the Linux trademark and is
    acknowledged as such, and he does not support or sponsor this self-help learning
    book.


    Linux® is the registered trademark of Linus Torvalds in the U.S. and other countries


    Linux Mark Institute and the community, for developing and maintaining Linux Mint
    21 ‘Vanessa’.


    Blizzard for developing and publishing World of Warcraft that I really love and
    enjoy.


    WINE or Wine Is Not An Emulator for the compatibility layer.


    Lutris making it far more accessible to Install and play games and software.


    Gabe Newell and Valve for developing and publishing the Steam Store.


    # Install Machine Details


    All details of this self help learning guide has been undertaken on bare metal
    or directly on hardware, rather than a virtual machine


    The Install of Linux Mint 21 ‘Vanessa’ has been done on a manually partitioned
    drive with:


    - 1 GB for the EFI partition

    - 92 GB for the / or root partition

    - 35 GB for the swap partition


    The specifications of the computer used to Install Linux Mint 21 ‘Vanessa’ are:


    - CPU: Intel(R)Core(TM) i3-9100F CPU

    - RAM or Memory: 16GB DDR4

    - Motherboard: MSI B365M PRO-VH REV 1.0

    - GPU or Graphics Card: Gigabyte Nvidia 3060 GTX 12GB

    - Monitor: 21" Acer Monitor

    - SSD: 1618 GB Over Samsung, PNY and SPCC Drives

    - HDD Internal: 9TB over 2 Western Digital Drives

    - HDD External: 1TB JMicron

    - Soundcard: USB 3.0 External Phoinkas Soundcard

    - Speakers: Amazon Basics 2.0 Speakers

    - Headphones: Generic 2.0 Earphones

    - Headset: Kingston HyperX Cloud Alpha 3.5 MM

    - Keyboard 1 & 2: USB 2.0 Generic Mini Gaming Keyboard, USB 2.0 Basic Full Wired
    Keyboard

    - Mouse: USB 2.0 Trust Wireless Mouse X200, USB 2.0 Basic Wired Mouse

    - Network: Realtek Motherboard Gigabit PCI Port, USB 3.0 Realtek Gigabit Adapter

    - Phone: Samsung Smartphone

    - USB Hub: USB 3.0 External Phoinkas Soundcard

    - Printer: Epson Network Printer


    # Introduction


    This guide was written to be an After Install Self Help Guide for Linux Mint 21
    ‘Vanessa’.


    To increase your security you will be required to ENTER your password to complete
    most steps on this list so be sure to have it at hand.


    After typing in all sudo commands and your password you may be required to confirm
    by pressing ENTER to continue or ESC to abort.


    Make sure you update and upgrade your Linux Mint 21 ‘Vanessa’ every day, a few
    days or as you like to ensure security and stability.


    Do not ever use sudo apt auto remove as it could destabilize or break Linux Mint
    21 ‘Vanessa’


    You should type in what is stated to help you to remember but you can copy and
    paste if you wish.


    Make sure to click Keep or Save File when downloading the .deb, jar, .tar.gz,
    .tar.xz, .AppImage and other files.


