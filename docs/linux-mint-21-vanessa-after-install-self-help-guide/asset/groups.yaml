    # Wine configuration


    ![](img/3240f4640ba4bfddd4427509e9f648f4_545_0.png)


    Click Box in the same row as Windows Version.


    Click Windows 10.


    Click Apply.


    Click Staging.


    # Wine configuration


    | Applications | Libraries | Graphics | Desktop Integration |

    | :--- | :--- | :--- | :--- |

    | Drives | Audio | Staging | About |


    ### Staging settings


    The following settings are experimental and may break stuff! Make sure to reset
    them again in case of a problem.


    - Enable CSMT for better graphic performance (deprecated)

    - Enable VAAPI as backend for DXVA2 GPU decoding

    - Enable Environmental Audio Extensions (EAX)

    - Hide Wine version from applications

    - Enable GTK3 Theming


    ![](img/3240f4640ba4bfddd4427509e9f648f4_546_0.png)


    Tick Boxes in the same rows as:

    - Enable CSMT for better graphic performance

    - Enable VAAPI as backend for DXVA2 GPU decoding


    Click Apply.


    Click Drives.


    ![](img/3240f4640ba4bfddd4427509e9f648f4_547_0.png)


    Click Add.


    Select Drive Letter.


    Click OK.


    Under Drive configuration, select Newly Created Drive Letter (e.g. D:).


    Click Browse.


    Expand mnt, by clicking the + in the same row.


    ![](img/3240f4640ba4bfddd4427509e9f648f4_551_0.png)


    Expand Drive where World of Warcraft is located, by clicking + in the same row.


    Select World of Warcraft folder.


    Click OK.


    Click Apply.


    Click OK.


