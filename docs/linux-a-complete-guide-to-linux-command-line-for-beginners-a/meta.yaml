    # 第 4 章：可用功能


    Linux 的优势存在于内核之中。正如本书前面提到的，内核是一段在整个 Linux 系统中保持一致的代码。通过理解 Linux 内核，你可以修改操作系统以包含你想要的功能的支持。过去，许多人曾根据自己的需求专门修改内核，而这些功能已成为许多
    Linux 发行版中不可或缺的一部分。


    # 多用户


    虽然你可以在 Windows 中拥有多个用户，但你缺乏让这些多个用户同时登录的能力。这意味着同时在系统中工作的人数受到限制。在 Linux 中，多个用户可以同时在系统上工作，每个用户都可以根据自己的需要定制自己的工作环境。


    每个用户都有一个自己的唯一目录，用于存储文件，以及带有图标、菜单和应用程序的桌面。当然，你可以对这些账户进行密码保护，以保护你的应用程序和数据，并控制谁能够访问它们，即使在同一系统上。


    # 多任务处理


    Linux 的优势是可以同时运行许多程序。这意味着用户能够让程序在后台运行，同时同时运行多个程序。这还允许你的系统运行进程，使得 Linux 能够托管服务器；这些系统进程在后台运行，并在登录系统、搜索网页、复制文件或打印文档等请求时与网络通信。这些进程被称为守护进程（daemons）。


    # 图形用户界面 (X 窗口系统)


    在处理任何涉及图形的内容时，Linux 为用户提供了一个强大的框架。这个框架被称为 X Window System，简称为“X”。X Window 系统管理任何基于
    X 的图形界面应用程序的功能，并允许它们显示在通过服务器管理计算机设备（如屏幕、鼠标和键盘）的进程上。


    你还拥有基于 X 的桌面环境的优势，这让你拥有 GUI 桌面和窗口管理器完整模拟，包含所有的图标、窗口框、菜单和颜色；即我们所说的所有主题（themes）。


    在桌面环境和管理器方面，你有许多选择，每种都有自己的侧重点。


    # 硬件支持


    对于连接到计算机的硬件有许多支持选项。这涉及到从软驱器（如果你还有的话）、CD、DVD、USB、声卡、外部磁带设备以及基本上任何与计算机系统兼容的设备。


    正如我们在早的章节中探索的那样，由于操作系统的开源性质，从常见的硬件制造商那里找到正确的驱动可能是困难的。但是，Linux 社区会在短时间内编写与你的发行版兼容的驱动程序。


    # 应用支持


    由于 Linux 兼容 POSIX 以及许多其他应用程序接口（或 API），Linux 提供了极其丰富的免费软件和共享软件。虽然可能需要一些精简和调整，但你将能够运行自由软件基金提供的绝多数
    GNU 软件。


    在早之前对 Linux 的介绍中，我们讨论了 Linux 是一个开源程序，有一个用户社区采纳并调整操作系统以满足他们的需求。由于这个原因，Linux 的功能在范围内几乎是无限的。如果你需要
    Linux 执行特定功能，你可以修改软件并创建你自己的发行版。虽然并不是人都拥有这种技能，但这是可能的，而且你正在寻找的功能很可能是可以下载的。


    # 无间谍软件


    间谍软件已成为许多 Windows 用户的一个巨大问题。一旦下载了包含间谍软件的程序，它就会开始运行。用户可能完全没有意识到后台有应用程序运行，收集用户信息并将其发送给第三方，这些第三方使用这些数据可能窃取他们的身份或将信息卖给营销公司。这些应用程序还可以更改计算机解释信息的方式。正如前面提到的，许多为
    PC 创建的病毒是 Windows 特有的，因此 Linux 免受了许多破坏性最强的病毒。更好的是，不需要花钱购买和升级防病毒软件，或支付昂贵的系统恢复费用。


    # 无需碎片


    Linux 拥有一种非常先进且高效的文件系统，不需要对数据进行碎片整理。对于普通的 Windows 计算机，这些文件系统可能会碎片化，从而导致系统崩溃、变慢和内存丢失。


    # 不崩溃


    如果你有一台 Windows 电脑，你对从不给出原因的随机崩溃并不陌生。例如，如果你正在运行 Windows 且浏览器崩溃了，整个操作系统可能会跟着崩溃，因为系统连接到了图形用户界面。这在几乎每个
    Windows 用户身上发生过，在丢失数据或中断重要任务时，这是非常令人沮丧的。在 Linux 中你不会遇到这些崩溃，因为核心操作系统（内核）与 X 窗口中的图形用户界面以及你使用的
    OpenOffice.org 等应用程序分开。如果应用程序由于任何原因（例如文件损坏）而崩溃，核心操作系统仍保持运行。


