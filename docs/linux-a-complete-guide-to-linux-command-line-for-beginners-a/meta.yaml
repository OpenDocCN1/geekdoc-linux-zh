    command line. For now, let''s take a look at the next level for those learning
    Linux commands.


    # FIND


    The find command allows you to search for particular files within a directory.
    This is similar to the way you would do this in your file manager, but this find
    command is a little more flexible and powerful in the way it tracks your files.
    The find command will look through the parent directories as well as sub directory,
    taking note of all the files that match the options you provided. Here is an example
    of how this would look:


    ```

    root@user:~# find -name *.sh

    ./Desktop/load.sh

    ./Desktop/test.sh

    ./Desktop/shutdown.sh

    ./Binary/firefox/run-mozilla.sh

    ./Downloads/kdewebdev-3.5.8/quanta/scripts/externalpreview.sh

    ./Downloads/kdewebdev-3.5.8/admin/doxygen.sh

    ./Downloads/kdewebdev-3.5.8/admin/cvs.sh

    ./Downloads/kdewebdev-3.5.8/admin/ltmain.sh

    ```'
