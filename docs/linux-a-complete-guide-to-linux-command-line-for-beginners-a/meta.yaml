- img_proc: true
  md: '# Chapter 6: Advanced Commands


    We explored some of the more basic commands in the last chapter, such as how to
    navigate through directories and modify files. In this chapter, we are going to
    consider some more advanced commands for users who have grown accustomed to the
    shell and the basic commands. Keep in mind that while they are more advanced commands,
    they barely scratch the surface on what is possible when writing scripts in the
    command line. For now, let''s take a look at the next level for those learning
    Linux commands.


    # FIND


    The find command allows you to search for particular files within a directory.
    This is similar to the way you would do this in your file manager, but this find
    command is a little more flexible and powerful in the way it tracks your files.
    The find command will look through the parent directories as well as sub directory,
    taking note of all the files that match the options you provided. Here is an example
    of how this would look:


    ```

    root@user:~# find -name *.sh

    ./Desktop/load.sh

    ./Desktop/test.sh

    ./Desktop/shutdown.sh

    ./Binary/firefox/run-mozilla.sh

    ./Downloads/kdewebdev-3.5.8/quanta/scripts/externalpreview.sh

    ./Downloads/kdewebdev-3.5.8/admin/doxygen.sh

    ./Downloads/kdewebdev-3.5.8/admin/cvs.sh

    ./Downloads/kdewebdev-3.5.8/admin/ltmain.sh

    ```'
  merge: -1
  pgno: 41
- img_proc: true
  md: './Downloads/wheezy-nv-install.sh


    You will notice that we use the option “-name.” This makes the option case sensitive,
    meaning the results will yield only those results that are similar to the case
    of the search term; in this case, “-sh.” If you would like to search for a term
    regardless of the case, you simply need to use the “-iname” option. The * is a
    wildcard that will search all files that have the extension “.sh.” You can modify
    this with the file name if you would like to get more specific results.


    # COMMAND: GREP


    The grep command is for when you are searching a particular file in order to find
    a match for search terms. This is similar to the way you would search for terms
    in a word processing application or through your browser, with the command line,
    you don''t even need to open the file to search through it.


    For example, if you were to look through a file, in this case “/etc/passwd” for
    the term “user,” it would look something like this:


    ```

    root@user:~# grep user /etc/passwd

    user:x:1000:1000:User:/home/user:/bin/bash

    ```


    You can ignore any specific word case and other combinations by using the “-i”
    option, in which case the line of command would look like this:


    ```

    root@user:~# grep -i USER /etc/passwd

    user:x:1000:1000:user,:/home/user:/bin/bash

    ```'
  merge: -1
  pgno: 42
- img_proc: true
