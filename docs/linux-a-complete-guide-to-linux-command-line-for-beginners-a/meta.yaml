    this is really quite simple and can be done by just about anyone. The process
    can be replicated for any button that needs to be changed.'
  - '[PAGE 22]


    # Chapter 4: Available Features


    The advantages of Linux are found within the kernel. As mentioned earlier in this
    book, the kernel is a piece of code which is consistent throughout Linux. By understanding
    the Linux kernel, you can modify the operating system to include support for the
    features you want. Many people have altered the kernel specifically for their
    needs in the past, and these features have become an integral part of many Linux
    distributions.


    # MULTUSER


    While you can have multiple users with Windows, you lack the ability to have those
    multiple users logged on at the same time. This means you are limited in how many
    people can be working on the system at once. With Linux, multiple users can work
    on the system at the same time, and each user can customize their working environment
    to suit their own needs.


    Each user has their own unique directory where files are stored, desktop with
    icons, menus, and applications. You are, of course, able to password protect these
    accounts in order to protect your applications and data, and control who is able
    to access them, even on the same system.


    # MULTITASKING


    Linux has the advantage of being able to operate many programs at the same time.
    This means users are able to have programs running in the background as well as
    having multiple programs being run at a single time. This also allows your system
    to have processes running that make it possible for Linux to host a server; these
    system processes run in the background'
  - '[PAGE 23]


    and communicate with the network as requests come through log into the system,
    search the web, copy a file, or print a document. These processes are known as
    daemons.


    # GRAPHICAL USER INTERFACE (X WINDOW SYSTEM)


    Linux offers users a powerful framework when working with anything involving graphics.
    This framework is known as the X Window System, also referred to as just ''X''.
    The X Window System manages the functions which are involved in any X-based graphical
    interface applications and allows them to be displayed on those processes that
    are managing the devices of your computer through the server such as the screen,
    mouse, and keyboard.


    You also have the advantage of having an X-based desktop environment which allows
    you to have a simulation of the desktop and window manager of your GUI complete
    with all the icons, window frames, menus, and colors; all the things we refer
    to as themes.


    You have a number of options when it comes to desktop environments and managers,
    each with their own focus.


    # HARDWARE SUPPORT


    There are a number of support options available for the hardware connected to
    computer. This involves anything from floppy disk drives (if you still have them),
    CDs, DVDs, USBs, sound cards, external tape devices, and basically anything that
    is compatible with a computer system.


    As we explored in an earlier chapter, it can be difficult to find the right drivers
    from common hardware manufacturers due to the open source nature of the operating
    system. However, the Linux community will often write a driver to be compatible
    with your distribution within a short amount of time.


    # APPLICATION SUPPORT'
  - '[PAGE 24]


    Due to the fact that Linux is compatible with POSIX, as well as a number of other
    application programming interfaces (or APIs), there is an immense variety of freeware
    and shareware software available for Linux. While it may take some streamlining
    and adjusting, you will be able to run most of the GNU software offered by the
    Free Software Foundation.


    Earlier in our introduction to Linux, we discussed that Linux is an open source
    program with a community of users adopting and adapting the operating system to
    suit their needs. For this reason, the features of Linux are virtually limitless
    in their functionality. If you need Linux to perform a specific function, you
    can alter the software and create your own distribution. While not everyone has
    this kind of skill, it is possible, and even likely, that the feature you are
    looking for is available for download.


    # NO SPWARE


    Spyware has become a massive problem for many Windows users. As soon as a program
    is downloaded that includes spyware, it begins working. The user may be completely
    unaware that there are applications running in the background that are collecting
    user information and sending it back to third parties who use this data to potentially
    steal their identities or sell the information to marketing companies. These applications
    can also change the way the computer interprets information. As mentioned earlier,
    many of the viruses which are created for PCs are specific to Windows, so Linux
    is free from many of the most damaging viruses. Even better, there is no need
    to spend money on purchasing and upgrading anti-virus software or paying for costly
    system recovery.


    # NO DEFRAGMENTATION**'
  - '[PAGE 25]


    Linux has a very advanced and efficient filing system which does not require the
    data to be defragmented. In the case of regular Windows computers, these file
    systems can become fragmented which can cause crashes, slowdowns, and memory loss
    on your system.


    # NO CRASHES


    If you have a Windows computer, you are no stranger to random crashes for which
    you are never given a reason. For example, if you were running Windows and your
    browser crashed, the entire operating system could come crashing down due to the
    fact that the system is connected to the Graphic User Interface. This has happened
    to virtually every Windows user and can be incredibly frustrating when it comes
    to losing data or interrupting an important task. You will experience none of
    these crashes with Linux because the core operating system (the kernel) is separated
    from the Graphic User Interface in the X Window, and from the applications that
    you use such as OpenOffice.org. If an application were to crash for whatever reason,
    such as a corrupted file, the core operating system would remain operational.


    # NO FREQUENT RE-INSTALLATION


    You will notice that one of the ideal solutions for issues with Windows is to
    simply reinstall the entire operating system and start from scratch. This can
    be difficult when it comes to the times that Windows crashes and there is no way
    to recover the data you have lost. If you run a business using your system, this
    can be incredibly costly and damaging to your business operations. Linux, on the
    other hand, will not crash in the same way, meaning your data is safe and recoverable
    if you are faced with any issues, which are, when it comes to Linux, few and far
    between. You are actually able to store your data separately from'
- md: 'the operating system so that any personal user preferences are able to be stored
    even if you choose to reinstall the operating system. This can be done by creating
    a new partition which will keep your home directory. Similarly, through Windows,
    you are constantly required to restart the system if any changes are made, such
    as installing new hardware or software, in order to reconfigure the system. In
    the case of Linux, there is no need for this.


    # MANY FILING SYSTEMS


    Windows comes with two filing systems. Linux, on the other hand, brings with it
    hundreds of filing systems, which is useful for those users who are required to
    work across multiple computers, exchanging hardware from one system to another.


    # POWERFUL COMMAND LINE


    We have explored some of the basics of using the command line, or the shell environment.
    With Windows, there is not much farther you can go with the command line, especially
    for basic users. Linux, on the other hand, has an incredibly powerful command
    line, as we mentioned earlier. With Linux''s command line, you can write entire
    programs for Linux, which means that you can eliminate repetitive tasks through
    automation. An example of this would be backing up your system. This is usually
    an extremely arduous task; imagine if you could just run a simple program that
    runs through the entire process with just one click. This and numerous other simplifications
    are all possible with the Linux command line.


    # VENDOR INDEPENDENCE


    With Windows, you are locked into a single vendor if you want to keep your system
    up-to-date. This can be a disincentive for many people who don''t want to keep
    spending money to keep their system safe. With Linux, you are never locked into
    a single vendor because the community offers a large variety of vendors who each
    have their own distributions to offer and to provide support for. If you feel
    that a particular vendor has let you down when it comes to support or if you have
    encountered a distribution that didn''t live up to your expectations, you can
    either turn to the community for further support or adopt a new vendor altogether.
    You don''t have to start over from scratch or feel trapped with a vendor that
    doesn''t seem to have your best interests in mind. Even better, if a vendor happens
    to walk away from their distribution, you are not forced to choose a new vendor
    or distribution, but can instead turn to the ever-growing community to continue
    publishing your distribution. Keep in mind there are no licensing agreements involved
    when it comes to Linux, meaning you are free to download, modify, and repackage
    as you wish.


    # NO REGISTRY


    If you have used registry on Windows, you will know that it can be a nightmare.
    Not only do you need specific tools to open and modify the files, if any of the
    data is corrupted, it can be extremely frustrating to manage. With Linux, most
    of the configuration is stored in plain text files. This allows you to easily
    manage, backup, and transfer these files between systems. This is much simpler
    than using registry.


    # HIGH DEGREE OF DOCUMENTATION


    Have you ever had an issue that you simply could not find a solution for? You
    look through the manual only to come up empty-handed, you search through forums
    and search engines looking for an answer, but there is just no record of anyone
    else having the same issue. This is hardly ever the case for problems with Linux.
    Linux is one of the most documented operating systems and almost all of these
    documents are free of charge.


    The documents are not PDFs thrown together by just anyone, but well-written documents
    which detail many of the concepts that help explain the inner-working of Linux.
    This is perhaps one of the greatest advantages to the Linux community, which is
    comprised of a number of online forums, articles, and groups that are located
    in virtually every country, city, and town. This means that you are never very
    far from another Linux user in the case that you would like to have someone help
    you out with the systems workings in person.


    You will find that the community almost behaves like a family since everyone has
    the same goals and objectives when it comes to improving and developing the open
    source operating system. The best Linux experience is unlocked when you get involved
    in this community and offer value to other members, who will surely return the
    favor.


    # PACKAGE MANAGEMENT


    The excellent package management offered by Linux allows users to access tools
    which can simplify the process of installing and upgrading applications. In addition
    to this, if you were to upgrade your current distribution of Linux, this is really
    quite simple. Furthermore, if you are a developer, you have access to a wide range
    of development tools, libraries, and compilers which come along with the package.
    For those who are Java developers or Web developers who use PHP/Perl/Ruby or C
    and C++ coding, you can put your skills to good when using Linux. This gives developers
    the freedom to use Linux as you wish and even offer and share their own versions
    of Linux with the community, their friends, and the family.


    # NO OPEN PORTS


    One major issue with Windows computers is the fact that unused ports are left
    open. This can lead to attacks by hackers that can disable and take control of
    your computer to either inflict harm on your system or carry out further attacks
    using your computer as a kind of attack zombie. Linux leaves no open ports, which
    means your data is highly secure and protected from unauthorized entry.


    # FASTER RELEASE CYCLE


    The patches that are created for Linux distributions are written within hours
    rather than days or weeks in the case of other operating systems. This means if
    there is a known issue or threat to the security of your system, patches, which
    offer protection, will be created much faster than in the case of proprietary
    software. Additionally, many of the Linux distributions are set to be released
    every 6 months, making it easy to gain access to the latest application updates,
    patches, and bug fixes, as well as improvement and support for newer hardware
    that you have integrated into your system. Windows, on the other hand, has an
    inconsistent release cycle. Sometimes it can take years for a reliable release
    with some of the releases being poor and full of bugs, really not worth upgrading
    to.


    # TOTAL CONTROL


    Using Windows can sometimes feel as though you are on a runaway train. You have
    applications and processes opening that you have very little understanding of.
    Sometimes you may not even know what a program is, or what it is doing to your
    computer. This can be not only confusing, but it can also take precious memory
    which should be allocated to the programs you want and need. With Linux, you have
    greater control over what applications are running and updating, as well as when
    they do so. You will need to give permission before a program opens so you always
    know exactly what is occurring on your computer.


    You also have full control over the GUI that is operating on your system. If you
    wanted to change the type of GUI you are using with Windows, you would be unable
    to do so as you only have one default GUI. Linux offers an extensive variety of
    GUIs, which are (ironically) called Window Managers. You can select a GUI that
    you feel works best for the way you use your system. There are dozens of options,
    from beautiful graphic-heavy GUIs to fast, streamlined options. There are also
    options that are great for beginners, a few of which, like Gnome and KDE, have
    been mentioned in earlier chapters.


    # BUNDLES


    Windows generally avoids bundling applications with the operating system other
    than a simple text editor, an image-editing application, and a few others. Many
    of the applications that are worthwhile require external downloading and installation
    and often come with a high price tag. Linux bundles many different applications
    with the distributions. These range from some of the well-known programs like
    the Office Suite and photo-editing software, to some open source applications
    that might be new to you. The advantage is that these applications will come with
    your distribution free of charge. They improve your computer experience with no
    extra fees involved. Some of these open source programs are available to download
    and use on a Windows system, but this takes download and installation time, whereas
    with Linux they are already available by default. These bundles can be massive,
    with thousands of applications, some boasting over 20,000 of them.


    For those applications that you need to download onto your system, you can do
    this through the included app store. With Ubuntu, the built-in app store has thousands
    of applications which can be easily downloaded with a single click.'
