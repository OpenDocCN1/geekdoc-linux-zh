    ./Downloads/kdewebdev-3.5.8/admin/ltmain.sh

    ./Downloads/wheezy-nv-install.sh

    ```


    你会注意到我们使用了 “-name” 选项。这使得该选项对大小写敏感，这意味着结果只会产生与搜索词大小写相似的结果；在这种情况下，是 “-sh”。如果你想忽略大小写搜索某个术语，只需要使用
    “-iname” 选项即可。* 是一个通配符，它将搜索所有扩展名为 “.sh”的文件。如果你想获得更具体的结果，可以使用文件名对其进行修改。


