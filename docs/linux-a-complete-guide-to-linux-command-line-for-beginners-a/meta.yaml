- md: 'solutions are never too complex and you only need to do it when you are first
    installing the new operating system.


    # MOUSE AND KEYBOARD


    For those of you who have a more advanced mouse or keyboard with extra buttons
    or features, such as those that are customized for gaming, you might find that
    you are missing some of those features after installing Linux. This can easily
    be fixed by letting Linux know what the purposes of all these extra buttons. There
    are a few ways to remap the extra buttons on your mouse, each requiring some manual
    effort.


    The easiest way to command Linux to utilize the full potential of your mouse is
    by using the command ''xbindkeys''.


    If you are unfamiliar with using commands, don''t worry too much as it is really
    quite simple. As an example, we are going to take a thumb button for a mouse and
    remap it to ''Ctrl+T,'' which you may know is the standard keyboard command for
    opening new tabs in Firefox.


    The first thing we need to consider is the name of each of the buttons on our
    mouse to make sure we give the right command to the right button. It is difficult
    to do this by sight alone, so we will need to run another command to identify
    our available buttons: ''xev''.


    You will see a small white window containing a box. Place your cursor within the
    white window, avoiding the box, and press the button that you would like to issue
    a command with. By pressing the thumb button, for example, we are given some coding
    which indicates the name of the button:


    ButtonPress event, serial 33, synthetic NO, window ox4e00001, root ox142, subw
    ox0, time 568329, (93,19), root:(96,714), state ox0, button 10, same_screen YES


    As you can see along the bottom line, the button we just clicked is known as button
    10. All we need to do now is close xev by using Ctrl+C and continue with the remapping
    of our keys. We then install two new programs: xbindkeys and xautation, by running
    the following command.


    sudo apt-get install xbindkeys xautation


    Then we create a config file for xbindkeys by running the command:


    xbindkeys-defaults /home/your-user-name/.xbindkeysrc


    You will need to replace "your-user-name" with your actual username. This will
    provide you with a file that you can edit by opening your file browser and making
    sure you have hidden files shown. Once you do this, you can see .xbindkeysrc at
    the top of the list. By double clicking it, you will be able to enter the next
    line of command at the end of the file.


    # Thumb Button = Ctrl+T


    ```

    "xte ''keydown Control_L'' ''key T'' ''keyup Control_L''

    B:10

    ```


    This simulates a keypress; you want to make sure you are pressing the control
    key and T the same time before releasing the control key. The B:10 at the end
    indicates that this command is tied to button 10 on our mouse. As you can see,
    this is really quite simple and can be done by just about anyone. The process
    can be replicated for any button that needs to be changed.


    # Chapter 4: Available Features


    The advantages of Linux are found within the kernel. As mentioned earlier in this
    book, the kernel is a piece of code which is consistent throughout Linux. By understanding
    the Linux kernel, you can modify the operating system to include support for the
    features you want. Many people have altered the kernel specifically for their
    needs in the past, and these features have become an integral part of many Linux
    distributions.


    # MULTUSER


    While you can have multiple users with Windows, you lack the ability to have those
    multiple users logged on at the same time. This means you are limited in how many
    people can be working on the system at once. With Linux, multiple users can work
    on the system at the same time, and each user can customize their working environment
    to suit their own needs.


    Each user has their own unique directory where files are stored, desktop with
    icons, menus, and applications. You are, of course, able to password protect these
    accounts in order to protect your applications and data, and control who is able
    to access them, even on the same system.


    # MULTITASKING


    Linux has the advantage of being able to operate many programs at the same time.
    This means users are able to have programs running in the background as well as
    having multiple programs being run at a single time. This also allows your system
    to have processes running that make it possible for Linux to host a server; these
    system processes run in the background and communicate with the network as requests
    come through log into the system, search the web, copy a file, or print a document.
    These processes are known as daemons.


    # GRAPHICAL USER INTERFACE (X WINDOW SYSTEM)


    Linux offers users a powerful framework when working with anything involving graphics.
    This framework is known as the X Window System, also referred to as just ''X''.
    The X Window System manages the functions which are involved in any X-based graphical
    interface applications and allows them to be displayed on those processes that
    are managing the devices of your computer through the server such as the screen,
    mouse, and keyboard.


    You also have the advantage of having an X-based desktop environment which allows
    you to have a simulation of the desktop and window manager of your GUI complete
    with all the icons, window frames, menus, and colors; all the things we refer
    to as themes.


    You have a number of options when it comes to desktop environments and managers,
    each with their own focus.


    # HARDWARE SUPPORT


    There are a number of support options available for the hardware connected to
    computer. This involves anything from floppy disk drives (if you still have them),
    CDs, DVDs, USBs, sound cards, external tape devices, and basically anything that
    is compatible with a computer system.


    As we explored in an earlier chapter, it can be difficult to find the right drivers
    from common hardware manufacturers due to the open source nature of the operating
    system. However, the Linux community will often write a driver to be compatible
    with your distribution within a short amount of time.


    # APPLICATION SUPPORT


    Due to the fact that Linux is compatible with POSIX, as well as a number of other
    application programming interfaces (or APIs), there is an immense variety of freeware
    and shareware software available for Linux. While it may take some streamlining
    and adjusting, you will be able to run most of the GNU software offered by the
    Free Software Foundation.


    Earlier in our introduction to Linux, we discussed that Linux is an open source
    program with a community of users adopting and adapting the operating system to
    suit their needs. For this reason, the features of Linux are virtually limitless
    in their functionality. If you need Linux to perform a specific function, you
    can alter the software and create your own distribution. While not everyone has
    this kind of skill, it is possible, and even likely, that the feature you are
    looking for is available for download.


    # NO SPWARE


    Spyware has become a massive problem for many Windows users. As soon as a program
    is downloaded that includes spyware, it begins working. The user may be completely
    unaware that there are applications running in the background that are collecting
    user information and sending it back to third parties who use this data to potentially
    steal their identities or sell the information to marketing companies. These applications
    can also change the way the computer interprets information. As mentioned earlier,
    many of the viruses which are created for PCs are specific to Windows, so Linux
    is free from many of the most damaging viruses. Even better, there is no need
    to spend money on purchasing and upgrading anti-virus software or paying for costly
    system recovery.


    # NO DEFRAGMENTATION


    Linux has a very advanced and efficient filing system which does not require the
    data to be defragmented. In the case of regular Windows computers, these file
    systems can become fragmented which can cause crashes, slowdowns, and memory loss
    on your system.


    # NO CRASHES


    If you have a Windows computer, you are no stranger to random crashes for which
    you are never given a reason. For example, if you were running Windows and your
    browser crashed, the entire operating system could come crashing down due to the
    fact that the system is connected to the Graphic User Interface. This has happened
    to virtually every Windows user and can be incredibly frustrating when it comes
    to losing data or interrupting an important task. You will experience none of
    these crashes with Linux because the core operating system (the kernel) is separated
    from the Graphic User Interface in the X Window, and from the applications that
    you use such as OpenOffice.org. If an application were to crash for whatever reason,
    such as a corrupted file, the core operating system would remain operational.


    # NO FREQUENT REINSTALL


    You will notice that one of the ideal solutions for issues with Windows is to
    simply reinstall the entire operating system and start from scratch. This can
    be difficult when it comes to the times that Windows crashes and there is no way
    to recover the data you have lost. If you run a business using your system, this
    can be incredibly costly and damaging to your business operations. Linux, on the
    other hand, will not crash in the same way, meaning your data is safe and recoverable
    if you are faced with any issues, which are, when it comes to Linux, few and far
    between. You are actually able to store your data separately from'
