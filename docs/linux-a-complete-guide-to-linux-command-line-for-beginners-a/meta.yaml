    ## COMMAND: MAN


    This one is useful for when you are just starting out and you want to see some
    of the options available for a particular command. The man is the system''s manual
    pager and basically gathers all the available documentation from the internet
    for a command, and what each of these options do by providing manual pages for
    each of the options.


    ## COMMAND: PS


    The “ps” means process and what this will do give you a status of all the processes
    which are currently running on your system, along with a unique ID called PID.
    It will appear like this:


    ```

    root@user:~# ps

    PID TTY             TIME CMD

    4170 pts/1        00:00:00 bash

    9628 pts/1        00:00:00 ps

    ```


    If you would like to see the status of the processes which are running along with
    their ID and PID, use the option “-A” which will appear in your command line like
    so:


    ```

    root@user:~# ps -A

    PID TTY             TIME CMD

    1 ?                 00:00:01 init

    2 ?                 00:00:00 kthreadd

    3 ?                 00:00:01 ksoftirqd/0

    5 ?                 00:00:00 kworker/0:0

    7 ?                 00:00:00 kworker/u:0

    8 ?                 00:00:00 migration/0

    9 ?                 00:00:00 rcu_bh

    ...

    ```


    This helps you understand which processes are running, how long they have been
    running, and whether they are needed to be halted for whatever reason. You can
    combine this with the ''grep'' command in order to find a customized output:


    ```

    root@user:~# ps -A | grep -i ssh

    1500 ?      00:09:58 sshd

    4317 ?      00:00:00 sshd

    ```


    ## COMMAND: KILL


    For those processes which cease responding or are simply not relevant to your
    current tasks, you are able to halt them using the kill command. This becomes
    quite useful when it comes to ending processes which are taking up massive amounts
    of CPU power but aren''t actually helping you with your tasks. Often, these processes
    become a struggle to kill on operating systems such as Windows and can sometimes
    require you to restart your system altogether, but not with Linux.


    The kill command works on any process (or ps). For example, if we were to kill
    the program “apache2,” which has ceased to respond, we would need to first run
    “ps -A” in conjunction with the grep command:


    ```

    root@user:~# ps -A | grep -i apache2

    1285 ?      00:00:00 apache2

    ```


    You will then see the apache2 process along with its PID, which you will use with
    the kill command. In this example, the process is 1285 giving way to our next
    command:


    ```

    root@user:~# kill 1285 (to kill the process apache2)

    ```


    As you can see, every time a process is run, it will generate a new PID, which
    you are able to identify by the ps command.


    ## COMMAND: WHEREIS


    When you are looking to locate binary, source, or manual pages for a particular
    command, you can use the whereis command in order to reveal it. For example, if
    we wanted to locate the binary, source, and manual pages for the command “ls”
    and kill it, it would look like this:


    ```

    root@user:~# whereis ls

    ls: /bin/ls /usr/share/man/man1/ls.1.gz

    root@user:~# kill

    kill: /bin/kill /usr/share/man/man2/kill.2.gz

    /usr/share/man/man1/kill.1.gz

    ```


    ## COMMAND: SERVICE


    This command allows you to control a service by either starting, stopping, or
    restarting the particular service. This allows you to make changes to a service
    without having to restart your system. The advantage of this is that you don''t
    need to stop what you are doing to make changes to the services the computer is
    running.


    ## COMMAND: ALIAS


    This command is highly recommended for those just getting started with the shell,
    it allows users to assign a name to a command that you might use often, or is
    is too long to enter manually every time. For example, you might be using the
    “ls -l” command quite frequently. The original command has 4 characters and a
    space, so we can use the alias command to cut this down to just one character,
    "l". This will help you make sense of some of those more complicated commands
    by using shorter commands that you are familiar with. While this is great for
    beginners, it is still recommended that you learn the commands before making changes,
    just in case you forget them in the future. Here is what it looks like in action:


    ```

    root@user:~# alias l=''ls -l''

    ```


    You can check to see if it works by entering the command straight after like this:


    ```

    root@user:~# l

    total 36

    drwxr-xr-x 3 user 4096 May 10 11:14 Binary

    drwxr-xr-x 3 user 4096 May 21 11:21 Desktop

    drwxr-xr-x 2 user 4096 May 21 15:23 Documents

    drwxr-xr-x 8 user 4096 May 20 14:56 Downloads

    drwxr-xr-x 2 user 4096 May 7 16:58 Music

    drwxr-xr-x 2 user 4096 May 20 16:17 Pictures

    drwxr-xr-x 2 user 4096 May 7 16:58 Public

    drwxr-xr-x 2 user 4096 May 7 16:58 Templates

    drwxr-xr-x 2 user 4096 May 7 16:58 Videos

    ```


    You can remove an alias by using the "unalias" command, which would look like
    this:


    ```

    root@user:~# unalias l

    ```


    You are then able to check if the command still exists, which it shouldn’t. If
    you have done this correctly, you will see a message like this:


    ```

    root@user:~# |

    ```


    ```

    bash: l: command not found

    ```


