    对于像 Windows 这样的操作系统，在安装过程中需要完成一些工作，以确保一切运行顺利。


    在这种情况下，第一步是对你的驱动器进行分区。这将告诉你的计算机你希望将 Linux 安装在何处。这是一个简单的任务，不需要你费费精力。你只需要在硬盘上选择一个空间，并将你拥的一些空闲空间分配给操作系统的安装和运行。


    如果你正在安装 Ubuntu，程序通常会通过选择自己的空间为你完成操作。从那里开始，剩下的安装过程就简单了。


    对于其他发行版，你将被要求自己划分空间，而某些分区工具可能会非常复杂。在这种情况下，你需要创建两个新分区。一个是为操作系统本身留空间，建议至少分配 10 GB。你应该将分区命名为“Ext4”，并将挂载点设置为“/”。然后创建第二个名为“swap”（交换分区）的分区。这里是用于存放内存的地方，以便运行操作系统并保持快速处理速度。如果你的可用内存（RAM）较少，请将交换分区的大小设为可用内存的两倍。如果你有足够的内存（超过
    3GB），则将交换分区的大小设与可用 RAM 相同。


    ## GRUB 及其他引导程序


    在 Linux 完成安装过程之前，它会在你的系统上安装一个名为 GRUB 的新引导程序。这将替换你的标准引导程序，并在启动时为你提供使用 Windows 或
    Linux 打开桌面的选项。在安装过程的这一部分，你不需要进行任何操作；只需坐好让你的发行版完成 GRUB 的安装即可。


    对于使用 Mac 的用户，该过程的某些工作会有所不同，你需要手动将 GRUB 安装到 Linux 分区。


    Windows 用户：请注意，如果你决定在任何时候卸载并重新安装 Windows，在重新设置好操作系统后，你需要手动安装 GRUB。


    如果你更喜欢具有增强用户界面的程序，可能想要安装另一个与 Linux 兼容的引导程序。一个例子是名为 Burg 的引导程序。不过，你不需要立即这样做，可以等到完成
    Linux 的安装后再设置新的引导程序。


    如果你遵循了这些步骤，就就绪了。你的 Linux 分区现在应该已经安装，你需要做的只是重启计算机进入 GRUB 菜单。从那里，你可以决定是启动 Linux
    还是 Windows。显然，就本书的目的而言，我们希望启动 Linux 以获得首次体验。你会发现你的 Linux 发行版附带了几个预装应用程序。其中一些对你有用，而另一些则没用，但你可以查看每一个并确定哪些是你可以使用的。


    在某些情况下，安装新的操作系统会导致硬件变得不稳定。这通常是因为硬件没有意识到你正在使用 Linux，可能会发生一些误解。对于 Wi-Fi 尤为如此。你可以采取一些步骤确保你的硬件与新安装的系统兼容。我们将在下一章讨论这一点。


    ## 第 3 章：调优你的硬件


    虽然这并非每次都会发生，但在某些安装 Ubuntu 或其他 Linux 发行版的情况下，你会发现并不是所有程序都运行良好。在本章中，我们将以 Ubuntu
    为示例，介绍确保你的硬件与新安装的操作系统协同工作的步骤。


    ## Wi-Fi


    在你可能遇到的硬件问题中，最关键的可能是你的 Wi-Fi 可能会出现故障。Wi-Fi 问题的问题在于你必须找另一个设备来在线搜索解决方案，但幸运的是，阅读本章可以确保在发生问题时，你已经知道如何让
    Wi-Fi 恢复运行。


    你可以在 Ubuntu 社区文档部分检查你的 Wi-Fi 卡和发行版的兼容性，在那里你可以找到人们讨论他们的网卡以及在安装 Ubuntu 时遇到的任何问题。你也可以搜索你的问题的答案，并在互联网的其他地方找到结果。


    如果你无法解决问题，可以使用一些工具使你的网卡 Windows 驱动程序与 Linux 有效通信。为了做到这一点，你需要将该网卡的 Windows 驱动程序安装到系统中，然后安装
    Ubuntu 自带的 `ndisgtk` 包。如果你无法访问互联网，可以使用以太线，或者将包下载到 USB 盘并连接到系统。然后从系统中安装该包并进入管理菜单。你可以使用“安装新驱动程序”按钮将
    INF 文件加载到 Windows 包中。


    ## 专有驱动程序


    对于那些没有开源驱动的用户，Linux 可能无法使用这些驱动，因为它们不允许用户将其用于自己的目的或将其打包进发行版。在这种情况下，你需要手动安装新驱动程序。


    一些主流硬件驱动有开源驱动程序可用，例如 Nouveau，它是一个开源 Nvidia 驱动程序，并与许多 Linux 发行版一起打包。这些驱动提供了大量的支持，尽管它们永远不会像专有驱动那样流畅，这意味着你需要搜索适用于你发行版的版本。


    此过程对于每个发行版都不同，但在 Ubuntu 的情况下，你有一个简单直观的驱动程序管理器，可以在“系统 > 管理 > 硬件驱动”下找到。这将提供你系统所有可用驱动程序的详细信息，允许你只需点击按钮即可安装它们。并不是所有的发行版都这么简单；某些需要通过在线搜索或阅读特定发行版的文档来花费更多精力。


    一旦你安装了新的操作系统，对于任何可能出现问题的硬件，你都将需要这个过程。这些问题不需要担心；这只是一个找到正确的软件来替换之前在系统中的 Windows
    驱动程序的问题。


    ## DVD、MP3、视频格式及更多


    在切换到 Linux 时，事情会变得有点棘手，因为遗憾的是，某些发行版（如 Ubuntu）在某些方面仍然缺失功能，例如内置的 MP3、DVD 访问、授权字体以及你在使用
    Windows 电脑时可能没有想到的其他项目。其原因是，对于开源程序来说，许可问题可能会有点困惑，但有一个非常简单的方法可以解决。


    为了安装正确的项目以使这些功能运行，你需要采取两个步骤：


    - 如果你目前正在运行 Ubuntu，只需点击此链接，它将带你进入正确的页面开始安装：www.apt:ubuntu-restricted-extras?section=universe?section=multiverse。你也可以选择来自
    Ninite 的安装程序，甚至通过应用程序菜单中找到 Ubuntu 软件中心。从那里，你只需要搜索“ubuntu restricted”，这将为你生成安装扩展包的链接。


    - 完成后，你需要打开终端。可以通过进入应用程序菜单，点击“辅助工具”，然后点击“终端”来实现。从那里你只需要输入 `sudo /usr/share/doc/libdvdread4/install-css.sh`。


