    Windows comes with two filing systems. Linux, on the other hand, brings with it
    hundreds of filing systems, which is useful for those users who are required to
    work across multiple computers, exchanging hardware from one system to another.


    # POWERFUL COMMAND LINE


    We have explored some of the basics of using the command line, or the shell environment.
    With Windows, there is not much farther you can go with the command line, especially
    for basic users. Linux, on the other hand, has an incredibly powerful command
    line, as we mentioned earlier. With Linux''s command line, you can write entire
    programs for Linux, which means that you can eliminate repetitive tasks through
    automation. An example of this would be backing up your system. This is usually
    an extremely arduous task; imagine if you could just run a simple program that
    runs through the entire process with just one click. This and numerous other simplifications
    are all possible with the Linux command line.


    # VENDOR INDEPENDENCE


    With Windows, you are locked into a single vendor if you want to keep your system
    up-to-date. This can be a disincentive for many people who don''t want to keep
    spending money to keep their system safe. With Linux, you are never locked into
    a single'
  - '[PAGE 27]


    vendor because the community offers a large variety of vendors who each have their
    own distributions to offer and to provide support for. If you feel that a particular
    vendor has let you down when it comes to support or if you have encountered a
    distribution that didn''t live up to your expectations, you can either turn to
    the community for further support or adopt a new vendor altogether. You don''t
    have to start over from scratch or feel trapped with a vendor that doesn''t seem
    to have your best interests in mind. Even better, if a vendor happens to walk
    away from their distribution, you are not forced to choose a new vendor or distribution,
    but can instead turn to the ever-growing community to continue publishing your
    distribution. Keep in mind there are no licensing agreements involved when it
    comes to Linux, meaning you are free to download, modify, and repackage as you
    wish.


    # NO REGISTRY


    If you have used registry on Windows, you will know that it can be a nightmare.
    Not only do you need specific tools to open and modify the files, if any of the
    data is corrupted, it can be extremely frustrating to manage. With Linux, most
    of the configuration is stored in plain text files. This allows you to easily
    manage, backup, and transfer these files between systems. This is much simpler
    than using registry.


    # HIGH DEGREE OF DOCUMENTATION


    Have you ever had an issue that you simply could not find a solution for? You
    look through the manual only to come up empty-handed, you search through forums
    and search engines looking for an answer, but there is just no record of anyone
    else having the same issue. This is hardly ever the case for problems with Linux.
    Linux is one of the most documented operating systems and almost all of these
    documents are free of charge.'
  - '[PAGE 28]


    The documents are not PDFs thrown together by just anyone, but well-written documents
    which detail many of the concepts that help explain the inner-working of Linux.
    This is perhaps one of the greatest advantages to the Linux community, which is
    comprised of a number of online forums, articles, and groups that are located
    in virtually every country, city, and town. This means that you are never very
    far from another Linux user in the case that you would like to have someone help
    you out with the systems workings in person.


    You will find that the community almost behaves like a family since everyone has
    the same goals and objectives when it comes to improving and developing the open
    source operating system. The best Linux experience is unlocked when you get involved
    in this community and offer value to other members, who will surely return the
    favor.


    # PACKAGE MANAGEMENT


    The excellent package management offered by Linux allows users to access tools
    which can simplify the process of installing and upgrading applications. In addition
    to this, if you were to upgrade your current distribution of Linux, this is really
    quite simple. Furthermore, if you are a developer, you have access to a wide range
    of development tools, libraries, and compilers which come along with the package.
    For those who are Java developers or Web developers who use PHP/Perl/Ruby or C
    and C++ coding, you can put your skills to good when using Linux. This gives developers
    the freedom to use Linux as you wish and even offer and share their own versions
    of Linux with the community, their friends, and their family.


    # NO OPEN PORTS


    One major issue with Windows computers is the fact that unused ports are left
    open. This can lead to attacks by hackers'
  - '[PAGE 29]


    that can disable and take control of your computer to either inflict harm on your
    system or carry out further attacks using your computer as a kind of attack zombie.
    Linux leaves no open ports, which means your data is highly secure and protected
    from unauthorized entry.


    # FASTER RELEASE CYCLE


    The patches that are created for Linux distributions are written within hours
    rather than days or weeks in the case of other operating systems. This means if
    there is a known issue or threat to the security of your system, patches, which
    offer protection, will be created much faster than in the case of proprietary
    software. Additionally, many of the Linux distributions are set to be released
    every 6 months, making it easy to gain access to the latest application updates,
    patches, and bug fixes, as well as improvement and support for newer hardware
    that you have integrated into your system. Windows, on the other hand, has an
    inconsistent release cycle. Sometimes it can take years for a reliable release
    with some of the releases being poor and full of bugs, really not worth upgrading
    to.


    # TOTAL CONTROL


    Using Windows can sometimes feel as though you are on a runaway train. You have
    applications and processes opening that you have very little understanding of.
    Sometimes you many not even know what a program is, or what it is doing to your
    computer. This can be not only confusing, but it can also take precious memory
    which should be allocated to the programs you want and need. With Linux, you have
    greater control over what applications are running and updating, as well as when
    they do so. You will need to give permission before a program opens so you always
    know exactly what is occurring on your computer.'
  - '[PAGE 30]


    You also have full control over the GUI that is operating on your system. If you
    wanted to change the type of GUI you are using with Windows, you would be unable
    to do so as you only have one default GUI. Linux offers an extensive variety of
    GUIs, which are (ironically) called Window Managers. You can select a GUI that
    you feel works best for the way you use your system. There are dozens of options,
    from beautiful graphic-heavy GUIs to fast, streamlined options. There are also
    options that are great for beginners, a few of which, like Gnome and KDE, have
    been mentioned in earlier chapters.


    # BUNDLES


    Windows generally avoids bundling applications with the operating system other
    than a simple text editor, an image-editing application, and a few others. Many
    of the applications that are worthwhile require external downloading and installation
    and often come with a high price tag. Linux bundles many different applications
    with the distributions. These range from some of the well-known programs like
    the Office Suite and photo-editing software, to some open source applications
    that might be new to you. The advantage is that these applications will come with
    your distribution free of charge. They improve your computer experience with no
    extra fees involved. Some of these open source programs are available to download
    and use on a Windows system, but this takes download and installation time, whereas
    with Linux they are already available by default. These bundles can be massive,
    with thousands of applications, some boasting over 20,000 of them.


    For those applications that you need to download onto your system, you can do
    this through the included app store. With Ubuntu, the built-in app store has thousands
    of applications which can be easily downloaded with a single click.'
- md: '## BROWSING BENEFITS


    Most Linux distributions come bundled with Mozilla Firefox, which most of you
    will be familiar with. Firefox is a powerful browser with a number of built-in
    features, such as ad-blocking, pop-up restriction, and a number of other advantages
    over the standard browser packaged with Windows. Linux also makes browsing simpler
    and faster due to Linux’s improved networking capabilities that save bandwidth
    and ensure a stable internet connection.


    ## NO AUTOMATIC UPDATES


    Automatic updates are often touted as a benefit of Windows, but this process can
    be not only annoying, but also harmful to the ways in which you are using your
    system. Most people probably have no idea what files are actually updated. With
    Linux, you have the option to click and apply the update rather than this happening
    without your consent. You are welcome to set up your own automatic updates if
    you wish, but you do not have to just accept them. With Linux, you are given total
    control over when, how, and what your computer will be updating.


    ## 3-D DESKTOP


    Linux allows users to take advantage of an advanced 3-D desktop with Compiz, allowing
    you to switch and view multiple desktops simultaneously. This feature was considered
    quite advanced when it was created, miles ahead of Windows. Even now, Compiz is
    one of the most streamlined 3-D desktops and takes up little memory on the graphics
    cards.


    ## Chapter 5: Using The Linux Command Line


    We have already covered what the command line is and a few of the basics, but
    now it is time to jump in a little deeper and see what is really possible. In
    this chapter, we will be exploring some of the functions of the command line interface
    and its advantages over the graphical user interface. While the GUI is great for
    beginners and users who have just installed Linux to get a feel for their new
    operating system, the true power is found within the command line. This is where
    we are truly able to make Linux work for us.


    The command line allows you to work outside the limitations of your distribution.
    Relying on your distribution means you will become accustomed to performing tasks
    a certain way, and if you then need to change distributions for some reason, you
    will have to relearn even some of the most basic tasks because there are many
    different ways to perform tasks across distributions. Depending on the distributions
    you are moving between, this can be quite a complex undertaking and using the
    command line enables you to skip this adjustment and stay in control regardless
    of the distribution you are using.


    By understanding the Debian-based systems, you are able to use basic commands
    as "apt-get" or "dpkg" to manage your software, regardless of the distribution
    you are using. This also allows you to avoid the pain of discovering that the
    distribution you are using is missing some of the features you have become accustomed
    to, or of discovering that these features were hidden in the updated GUI.


    There are more advantages to using the command line than just having control over
    the features available to you. Using a GUI can cause many of the system''s resources
    to be consumed, slowing down your system and causing tasks to take much longer
    than they would take if you were using the command line.


    The command line can be quite intimidating at first, but once you understand the
    language, it is as simple as sending a message to your PC with some instructions
    on what you need to do. Imagine texting a teenager for the first time and not
    understanding the lingo. Similarly, not knowing the command line language can
    make you feel pretty out of the loop and confused. Once you know it though, you
    can communicate with ease and hopefully avoid embarrassing yourself.


    ## GETTING THE SHELL


    Before you are able to start typing commands to your computer, you will need to
    run the shell. The shell is the program which creates the orders for the computer
    using the text that you input. There is a specific set structure of commands which
    will be unique to your OS, as different operating systems use different structures
    when performing similar tasks.


    For this reason, there are many different shells available for Linux, but the
    most common and popular one, which is recommended since it will have the largest
    community support, is BASH (Bourne-Again shell). BASH was written by the GNU Project
    and is the best go-to for beginners. There are other options if you prefer something
    more modern with a few extra features as "zsh," which can easily be installed
    from your distribution.


    If you are working from a desktop environment, then it is best to use a terminal
    emulator in order to emulate the terminal for that particular interface. You will
    find that different distributions will come with their own specific terminal emulators.
    For example, KDE comes with Konsole, and Gnome uses Gnome Terminal.


    ## YOUR FIRST COMMANDS


    When opening the terminal emulator, you will notice that you are in the home directory
    of the logged-in user by default. This can be seen with the name of the logged-in
    user prior to the hostname. Seeing the $ symbol indicates that you are logged
    in as a regular user, while seeing the # symbol indicates that you are logged
    in as a root.


    It is best to avoid working on the command line as a root this can change the
    permissions of all the files you have been working on as well as their directions,
    and make the root user of the directions and files within. If you are performing
    administrative tasks, however, or working inside root directory, there is no issue
    being logged in as a root user.


    If you would like to see all the directions and files that are in the current
    directory you are working in, you can do this by listing all with the "ls" command
    which is the following line of command:


    ```

    [swapnil@swaparch ~]$ ls

    Desktop Documents Downloads Music Pictures Public Templates Videos

    ```


    ## CHANGING LOCATIONS


    You can move through your system by first changing to any directory through the
    use of the "cd" command. If you feel like taking a shortcut, you are also able
    to use the tab key to automatically complete the path. To enter directories, you
    simply need to use forward slash. For example, if you would like to go into the
    downloads directory inside the home folder, you use cd to command a change in
    directory, followed by the path you would like to travel. You will need to use
    your username as part of the command. For this example, we will use "swapnil":


    ```

    Documents/ Downloads/

    [swapnil@swaparch ~/] cd /home/swapnil/Downloads/

    [swapnil@swaparch Downloads]$

    ```


    You will notice in the third line, we have our directory, "Downloads," located
    inside some square brackets. This indicates that the move has been successful
    and we are now located inside the directory. If you would like, you can see the
    subdirectory and files located inside Downloads by using the "ls" command once
    again.


    Keep in mind that you don''t need to provide the complete path when moving around
    inside a subdirectory if you are coming from the current directory. For example,
    if you would like to travel to a subdirectory known as "Test," which is located
    within the downloads directory, all you will need to type "cd" and then the directory
    name, which would be written as "Test," without requiring the forward slash.


    ```

    [swapnil@swaparch Downloads]$ cd Test

    ```


    When changing from one directory to another, you simply need to follow that same
    procedure by using "cd" in order to reverse your steps and go back to the directory
    that you just came from, you will need to use "cd ..." and if you need to go back
    even further, say two directories, you would use "cd ../.." The more directories
    you are retracing, the more you extend the command line in that way.


    If you would like to have a peek at the content located within a directory, you
    don’t need to change directories. Instead you can use the "ls" command, but in
    a slightly different way:


    ```

    ls /PATH_OF_DIRECTORY

    ```


    Going back to our previous example, if we wanted to look in the Test folder without
    having to go there we simply type in:


    ```

    [swapnil@swaparch ~]$ ls /home/swapnil/Downloads/Test/

    ```


    In the case that a directory is hidden, you are still able to see it by using
    a special option within the "ls" command. Following "ls," you simply need to type
    in "-a," as in the example below:


    ```

    [swapnil@swaparch ~]$ ls -a /home/swapnil/Downloads/Test/

    ```


    ## DETERMINING SIZE


    What if you need to look at the size of the directories you are working in? Is
    this possible with the command line? Yes! And it''s really quite simple. You will
    only need to use the "-l" option along with the "ls" command. This will also give
    you a breakdown of some other information, such as the permissions of the files
    and directories, whose their owners are, as well as the time and date of the latest
    modification.'
  mdcn: '

    ## 浏览优势


    大多数 Linux 发行版都预装了 Mozilla Firefox，大多数人对它都很熟悉。Firefox 是一款功能强大的浏览器，具有许多内置功能，例如广告拦截、弹出窗口限制，以及相比
    Windows 自带标准浏览器的许多其他优势。由于 Linux 改进了网络能力，能够节省带宽并确保互联网连接稳定，这使得浏览变得更加简单和快速。


    ## 无自动更新


    自动更新经常被吹称为 Windows 的一个优点，但这个过程不仅令人厌恼，还可能对你使用系统产生危害。大多数人可能不知道到底哪些文件被更新了。在 Linux
    中，你可以选择点击并应用更新，而不是让它在未经你许可的情况下自动发生。如果你愿意，欢迎设置你自己的自动更新，但你不必盲目接受它们。在 Linux 中，你对计算机何时、如何以及更新什么拥有完全的控制权。


    ## 3D 桌面


    Linux 允许用户通过 Compiz 利用先进的 3D 桌面，允许你同时切换和查看多个桌面。这一功能在创建时被认为是非常先进的，领先 Windows 许多倍。即使是现在，Compiz
    也是最精简的 3D 桌面之一，且占用的显卡内存极少。


    ## 第 5 章：使用 Linux 命令行


    我们已经涵盖了什么是命令行以及一些基础知识，但现在是时候进一步深入一下，看看究竟能实现什么。在本章中，我们将探索命令行界面（CLI）的一些功能以及它与图形用户界面（GUI）相比的优势。虽然
    GUI 对于初学者和刚安装 Linux 体验新操作系统的用户来说非常棒，但真正的力量隐藏在命令行之中。这才是我们真正能够让 Linux 为我们服务的地方。


    命令行允许你跳出特定发行版的限制进行工作。依赖于特定的发行版意味着你将习惯于以某种方式执行任务，如果你之后由于某些原因需要更换发行版，你将不得不重新学习即使是最基础的任务，因为不同的发行版之间执行任务有许多不同的方法。取决于你切换的是哪些发行版，这可能是一项相当复杂的任务，而使用命令行允许你跳过这种调整，无论你使用哪种发行版都能保持控制力。


    通过理解基于 Debian 的系统，你可以使用 `apt-get` 或 `dpkg` 等基本命令来管理软件，无论你使用哪种发行版。这还让你避免了这种痛苦：发现你正在使用的发行版缺少某些你已经习惯的功能，或者发现这些功能被隐藏在更新后的
    GUI 中。


    使用命令行的优势不仅在于拥有对可用功能的控制权。使用 GUI 会导致许多系统资源被消耗，减慢系统速度，并导致任务花费的时间比使用命令行要长得多。


    命令行起初可能令人生生畏，但一旦你理解了这种语言，它就像给你的 PC 发送一些关于你需要做什么的指令一样简单。想象一下第一次给一个青少年发短信，却不听懂他们的俚语。类似地，不了解命令行语言会让你感到非常隔阂和困惑。但一旦你掌握了它，你就可以轻松地交流，并希望避免让自己尴尬。


    ## 获取 Shell（外壳）


    在你开始向电脑输入命令之前，你需要运行 Shell。Shell 是一个根据你输入的文本为计算机创建指令的程序。有一组特定的命令结构，它们对于你的操作系统是唯一的，因为不同的操作系统在执行类似任务时会使用不同的结构。


    出于这个原因，Linux 有许多不同的 Shell 可用，但最常用且流行的（推荐使用，因为它拥有最大的社区支持）是 BASH（Bourne-Again shell）。BASH
    是由 GNU 项目编写的，是初学者的首选。如果你更喜欢更现代且带有一些额外功能的选项，也可以选择 "zsh"，它可以从你的发行版中轻松安装。


    如果你在桌面环境中工作，那么最好使用终端模拟器来模拟该特定界面的终端。你会发现不同的发行版会带有自己特定的终端模拟器。例如，KDE 带有 Konsole，而
    Gnome 使用 Gnome Terminal。


    ## 你的第一个命令


    当打开终端模拟器时，你会发现默认情况下你处于登录用户的家目录中。可以通过主机名之前的登录用户名看出这一点。看到 `$` 符号表示你正以普通用户身份登录，而看到
    `#` 符号则表示你正以 root（超级用户）身份登录。


    最好避免以 root 身份在命令行中工作，因为这可能会更改你处理过的所有文件的权限及其所属目录，并使 root 用户成为这些目录和文件的所有者。然而，如果你正在执行管理任务，或者在
    root 目录内工作，那么以 root 用户身份登录是没有问题的。


    如果你想查看当前工作目录中的所有目录和文件，可以通过 `ls` 命令列出所有内容，其命令行如下：


    ```

    [swapnil@swaparch ~]$ ls

    Desktop Documents Downloads Music Pictures Public Templates Videos

    ```


    ## 更改位置


    你可以通过使用 `cd` 命令切换到任何目录来穿过系统。如果你想使用快捷键，也可以使用 Tab 键自动补全路径。要进入目录，你只需使用正斜杠 `/`。例如，如果你想进入家文件夹下的
    downloads 目录，你使用 `cd` 命令更改目录，后跟上你想要访问的路径。你需要将用户名作为命令的一部分。在这个示例中，我们将使用 "swapnil"：


    ```

    Documents/ Downloads/

    [swapnil@swaparch ~/] cd /home/swapnil/Downloads/

    [swapnil@swaparch Downloads]$

    ```


    你会注意到在第三行中，我们的目录 "Downloads" 位于方括号内。这表示移动已成功，我们现在位于该目录内部。如果你愿意，可以再次使用 `ls` 命令查看
    `Downloads` 内部的子目录和文件。


    记住，当你从当前目录移动到子目录时，不需要提供完整路径。例如，如果你想前往位于 downloads 目录内的名为 "Test" 的子目录，你只需要输入 `cd`
    然后是目录名（即 "Test"），而不需要正斜杠。


    ```

    [swapnil@swaparch Downloads]$ cd Test

    ```


    从一个目录切换到另一个目录时，你只需要按照相同的程序使用 `cd` 来反向操作返回刚才进入的目录，你需要使用 `cd ..`；如果你需要返回更远，比如两个目录，则使用
    `cd ../..`。回溯的目录越多，命令就越长。


    如果你想查看目录内部的内容，不需要切换目录。你可以使用 `ls` 命令，但方法稍有不同：


    ```

    ls /目录的路径

    ```


    回到之前的示例，如果我们想查看 Test 文件夹而不必进入那里，只需输入：


    ```

    [swapnil@swaparch ~]$ ls /home/swapnil/Downloads/Test/

    ```


    在目录被隐藏的情况下，你仍然可以通过 `ls` 命令中的一个特殊选项来看到它。在 `ls` 之后，你只需要输入 `-a`，如下例：


    ```

    [swapnil@swaparch ~]$ ls -a /home/swapnil/Downloads/Test/

    ```


    ## 确定大小


    如果你需要查看当前工作目录的大小怎么办？这通过命令行可以实现吗？可以！而且非常简单。你只需要在使用 `ls` 命令时配合 `-l` 选项即可。这还会提供其他信息的详情，例如文件和目录的权限、所有者以及最后修改的时间和日期。

    '
