    directory within it called "opensense"—all with a single command. Can you do that
    with a fancy GUI? Not likely.


    # DELETING DIRECTORIES


    Deleting directories is just as simple and straightforward as creating them. You
    will need to use the command "rm" if you want to delete files, and the command
    "rm -r" if you want to delete a directory. Remember the difference and be aware
    of which command you use as it can be devastating to use the'
  - '[PAGE 39]


    wrong one when you intend to delete files and actually end up deleting the entire
    directory.


    ```

    rm /path-of-the-directory-or-file

    ```


    For our example, we are going to delete the opensuse directory we just created.
    In order to do this, we would use the command line:


    ```

    rm -r /home/swapnil/Downloads/distros/opensuse/

    ```


    If we decided we would like to delete all the content within a directory but keep
    the directory itself, we would use the asterisk following a slash. For example,
    if we were to delete everything within the opensuse directory, we would use the
    command line:


    ```

    rm /home/swapnil/Downloads/distros/opensuse/*

    ```


    In the case that there are subdirectories located inside, you would need to use
    the “-r” option once again in order to tell the system that you are including
    the sub-directories in your purge. This would appear as:


    ```

    rm -r /home/swapnil/Downloads/distros/opensuse/*

    ```


    # SYSTEM INFORMATION


    Aside from interacting with the files and directories on your system, you are
    also able to use the command line to gain'
  - '[PAGE 40]


    information on the system itself. For example, if you wish to assess how much
    disk space is on your file system based on the partitions, you are able to use
    the command "df", or if you would like to read it in a more understandable way,
    use the command "ds -h", which will then display the report in megabytes and gigabytes.
    If you would like to look at the amount of free space in comparison to the used
    memory, use the "free" command in conjunction with "-m," which will report back
    the figure in megabytes.


    If you like details on the system such as the processes running and the resources
    available, which is useful when first adopting the command line, you can use the
    "top" command. This will give you a report on the running processes, the usage
    of your CPU and RAM, and a total number of the tasks being run, which you might
    like to compare with the GUI report of the same nature.


    # SUMMARY


    As you can see, using the command line is both simple and powerful. Rather than
    just relying on the GUI, which can take up valuable processing resources, the
    command line allows you to execute functions with precision and speed. It might
    seem a little daunting at first, but once you get used to it, you will find that
    it is a much more flexible way of interacting with your computer and with the
    Linux operating system. Once you become comfortable with the more basic functions
    of the command line, you can then move forward with advanced commands.'
