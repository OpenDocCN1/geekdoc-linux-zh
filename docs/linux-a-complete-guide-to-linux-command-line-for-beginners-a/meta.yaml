    # Linux


    初学者 Linux 命令行完全指南，以及如何开始使用 Linux 操作系统！


    ![](img/1cdb7e417438b1b9200294240c19144f_0_0.png)


    James Arthur


    # 目录


    - 引言

    - 第1章：什么是 Linux？

    - 第2章：安装与设置 Linux

    - 第3章：调优你的硬件

    - 第4章：Linux 的可用功能

    - 第5章：使用 Linux 命令行

    - 第6章：高级命令

    - 结


    # 引言


    感谢你花时间阅读这本关于 Linux 的书。


    Linux 是一个被严重低估的操作系统，在许多人看来，它远优于任何 Windows 或 Mac OS。使用 Linux 作为你的操作系统可以让你更好地提高计算机性能，节省许可证和应用程序的开支，甚至可以保护你免受恶意病毒的侵害。


    本书涵盖了 Linux 的基础知识，解释了不同的版本及其各自不同的功能。在接下来的章节中，你将发现 Linux 操作系统是如何运作的、如何在计算机上安装它，甚至如何开始使用命令行来执行各种任务。


    无论你想将 Linux 用于你所有的计算需求，还是仅仅对这个革命性的开源操作系统感到好奇，本书都能为你开启之旅提供坚实的知识基础！


    再次感谢你选择这本书，希望你发现它有所帮助，并享受使用 Linux 的乐趣！


    # 第1章：什么是 Linux？


    尽管是使用最广泛的操作系统之一，但不熟悉计算机技术和操作系统的人可能并不知道 Linux 是什么，或者它有多重要。Linux 创建于 20 世纪 90 年代中期，当时
    Windows 开始主导个人电脑操作系统市场。由于这个原因，今天大多数拥有电脑的人只熟悉微软 Windows。他们也可能熟悉最近在 iPhone 和 MacBook
    上使用的 Apple 操作系统，但对于那些对操作系统没有感兴趣的人来说，Linux 往往会被忽视。


    事实上，从你的智能手机到汽车，从大型机构的超级计算机到冰箱等日常家用电器，Linux 处处可见。Linux 紧密围绕着互联网和技术密集型超级计算机展开，这些计算机帮助完成我们时代许多科学突破所需的计算。Linux
    已经成为最稳定、最安全的操作系统之一，并负责运行世界上大量的系统，为什么在面对如此强大且突出的系统时，我们中的许多人仍然对其了解了解呢？


    # 操作系统是如何工作的？


    在我们充分理解 Linux 是什么以及它是如何工作之前，我们首先需要了解什么是操作系统以及它是如何运作的。操作系统可以被认为是安装在你的计算机上的软件和硬件之间通信的中间人。你每天都会使用许多操作系统，但你最熟悉的可能是安装在你个人电脑上的那个系统。这可能是
    Windows XP（特别是对于旧电脑）、Windows 7、Windows 8 或最近的 Windows 10。Macbook 用户可能熟悉某个 Mac
    OS 版本，如 Mac OS X。无论如何，这些操作系统的任务是管理你台式机或笔记本电脑内的所有资源。


    操作系统由许多部分组成，每个部分都有自己的功能，帮助计算机执行你分配给它的任务。对于 Linux，这些部分包括：


    - 引导程序 (The Bootloader) - 这是让你的计算机能够启动你需要使用的程序的软件。这通常是操作系统启动时出现的一个屏幕。引导程序启动所有为了以可用方式呈现你的系统所需的进程。


    - 内核 (The Kernel) - 内核是一个控制整个操作系统的程序。它可以被认为是系统的核心，负责管理 CPU、内存和外围设备。内核是操作系统最基本的元素，意味着它确保了关键系统功能的运行。


    - 守护进程 (Daemons) - 这些在后台运行的服务。它们仅为某些命令启用必要的进程。例如，它们管理文档打印、声音和调度等。这些服务通常在计算机启动或桌面启动时立即开始。


    - 壳 (The Shell) - 在 Linux 早期，许多人对 Linux 命令行（shell）感到畏畏。shell 允许用户通过在文本界面中输入的命令向计算机发布任务。这并不是特别用户友好，对于技术或编程知识很少的用户来说这似乎是一项艰巨的任务。随着技术的进步，开发出了用户界面来吸引那些不太精通技术的人，变得简单得多。


    - 图形服务器 (Graphical Server) - 这是你在屏幕上看到的内容；它允许通过图形用户界面发布命令。图形服务器被称为子系统或 X server。


    - 桌面环境 (Desktop Environment) - 这是用户与操作系统交互的区域（而不是过去的命令行方法）。Linux 的优势之一是提供了多种桌面环境，包括
    Unity、GNOME、Cinnamon、Enlightenment、KDE、XFCE 等等。每种桌面环境都内置了应用程序，帮助用户管理文件、配置计算机、使用互联网甚至玩游戏。


    - 应用程序 (Applications) - 应用程序是执行一组协调任务的程序，如文字处理器或照片编辑器。某些应用程序可能随操作系统一起捆，还有成千上万的应用可以下载。Linux
    提供了许多可以通过类似于 Apple App Store 的程序 Ubuntu Software Center 进行搜索、下载和安装的应用，它是作为 Ubuntu
    Linux 的一部分提供的。


    # Linux 的优势


    如果你已经习惯使用微软 Windows 或 Mac OS，那么学习使用 Linux 的意义何在，特别是因为它可能与你使用的操作系统不同，因此学习起来很困惑？


    学习使用 Linux有很多理由，其中一些人们可能根本没有考虑。尽管面临无数病毒、恶意软件、间谍软件、运行缓慢、系统崩溃、维修甚至与许可证相关的费用，人们对自己的操作系统感到非常自满。这些问题不仅让人非常沮丧，而且昂贵。除了维修和保护的成本外，你可能还会丢失价值的数据。这些问题通常通过年度清理或定期格式化硬盘来管理，以确保系统刷新。


    为什么人们花这么多精力去管理问题而不是修复它们？如果你认为没有替代方案，你通常会觉得必须接受现状。Linux 就是替代方案。一旦你理解 Linux 可以为你面临的许多问题提供解决方案，它将为你打开一个免受主流操作系统困扰的新世界。


    Linux 的独特之处在于，它是免费提供给用户安装在计算机上的，而其他操作系统可能花费数百美元的许可证费用。安装这些操作系统，特别是在企业这样在多台计算机上安装，可能会非常昂贵。让我们看看设置
    Windows 服务器的成本：2012 年，Windows 服务器的价格大约为 1200 美元。这个价格不包括 CAL（客户端访问许可证）以及在服务器上使用的任何其他软件。在经济优势方面，Linux
    是明显的选择，因为它是完全免费的，包括运行系统所需的所有内容。它还可以根据需要安装在许多计算机上，而不会产生累积费用。


    Linux 为什么可能是免费安装的？这听起来好得令人难以置信。

    '
