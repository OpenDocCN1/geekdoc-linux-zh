  md: '# Introduction


    Thank you for taking the time to pick up this book about Linux.


    Linux is an operating system that is seriously underrated, and in the eyes of
    many is far superior to any Windows or Mac OS available. Using Linux as your operating
    system can allow you to better improve the performance of your computer, save
    yourself money on licensing and applications, and even protect you from malicious
    viruses.


    This book covers the basics of Linux, explaining the different versions that are
    available, along with their varying capabilities. In the following chapters you
    will discover how the Linux OS functions, how to install it on your computer,
    and even how to begin using the command line to perform various tasks.


    Whether you want to use Linux for all of your computing needs, or if you''re simply
    curious about this revolutionary open-source operating system, this book provides
    a solid foundation of knowledge to get you started!


    Once again, thanks for choosing this book, I hope you find it to be helpful, and
    enjoy using Linux!'
  merge: -1
  pgno: 3
- img_proc: true
  md: '# Chapter 1: What Is Linux?


    Despite being one of the most widely used operating systems, those who are unfamiliar
    with computer technology and operating systems may not realize what Linux is or
    just how important it can be. Linux was created in the mid-1990s, when Windows
    began to dominate the market for operating systems installed on personal computers.
    For that reason, most people with a computer today are only familiar with Microsoft
    Windows. They may also be familiar with the more recent Apple operating systems,
    used in iPhones and MacBooks, but Linux tends to be overlooked by those not specifically
    interested in operating systems.


    The fact is that Linux can be found anywhere from your smartphone to your vehicle,
    from the supercomputers in large institutions to everyday home appliances such
    as your refrigerator. Linux is strongly centered around the internet and technology-heavy
    supercomputers which help perform the calculations necessary for many of the scientific
    breakthroughs of our time. Linux has grown into one of the most stable and secure
    operating systems and is tasked with running a wealth of systems around the world,
    why are many of us still out of the loop when it comes to such a powerful and
    prominent system?


    # HOW DOES AN OPERATING SYSTEM WORK?


    Before we can have a full understanding of what Linux is and how it works, we
    first need to understand what an operating system is in general and how works.
    The operating system can be thought of as the middleman of communication between
    the'
  merge: -1
  pgno: 4
- img_proc: true
  md: 'software and hardware installed on your computer. You use a number of operating
    systems each and every day, but the one you most likely are familiar with is the
    system installed on your personal computer. This could be Windows XP, especially
    for older computers, Windows 7, Windows 8, or the most recent Windows 10. Macbook
    will likely be familiar with a version of Mac OS such as Mac OS X. In any case,
    these operating systems are tasked with managing all the resources within your
    desktop or laptop.


    There are many pieces to an operating system, each with its own set of functions
    to help your computer perform the tasks you assign to it. For Linux, these pieces
    include:


    The Bootloader - This is the software that enables your computer to boot up the
    programs that you need to use. This is generally a screen that will appear as
    your operating system starts up. The boot loader starts all the processes that
    are required to present your system in a usable way.


    The Kernel - The kernel is a program that controls the entire operating system.
    It can be thought of as the core of the system and it is tasked with managing
    the CPU, memory, and peripheral devices. The kernel is the most basic element
    of an operating system, meaning that it ensures the operation of the crucial system
    functions.


    Daemons - These are services which operate in the background. They enable processes
    necessary only for certain commands. For example, they manage the printing of
    documents, sounds, and scheduling, amongst others. These services generally start
    as soon as the computer is booted or the desktop starts.


    The Shell - In the early days of Linux, many people felt intimidated by the Linux
    command line, or shell. The shell allows users to issue tasks to the computer
    via commands typed into a'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'text interface. This was not particularly user-friendly and seemed a daunting
    task to users with little knowledge of technology or coding. As the technology
    improved, the user interface was developed to appeal to those who are less tech
    savvy, becoming a lot more simple to use.


    Graphical Server - The is what you see on the screen; it allows you to issue commands
    through the graphical user interface. The graphical server is known as a subsystem
    or X server.


    Desktop Environment - This is the area where users interact with the operating
    system (rather than the command line method of the past). One advantage of Linux
    is the variety of desktop environments available include Unity, GNOME, Cinnamon,
    Enlightenment, KDE, XCFCE, and many more. Each of these desktop environments built-in
    applications to help users manage their files, configure their computer, use the
    internet, and even play games.


    Applications - Applications are programs that perform a group of coordinated tasks,
    like a word processor or a photo editor. Some applications may be bundled with
    the operating system, there are thousands more available for download. Linux offers
    many applications which can be searched for, downloaded, and installed from a
    program (similar to Apples App Store) called Ubuntu Software Centre, which is
    offered as a part of Ubuntu Linux.


    # THE ADVANTAGES OF LINUX


    If you are already accustomed to using Microsoft Windows or Mac OS, what would
    be the purpose of learning to use Linux, particularly when it can be quite different
    from the operating system you use, and therefore, confusing to learn?'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'There are many reasons for learning to use Linux, some of which people may
    not even consider. People become so complacent with their operating systems despite
    facing numerous viruses, malware, spyware, slowdowns, system crashes, repairs,
    and even fees associated with licensing. These problems can be not only incredibly
    frustrating, but also expensive. Aside from the cost of repairs and protection,
    you may also lose valuable data. These problems are usually managed by yearly
    clean-ups or periodically reformatting the hard drive to ensure the system is
    refreshed.


    Why do people spend so much to manage problems instead of fixing them? If you
    think there is no alternative, you generally feel that you must accept the way
    things are. Linux is the alternative. Once you understand that Linux can offer
    solutions to many of the problems you face, it opens your eyes to a whole new
    world free from the plagues of the mainstream operating systems.


    Linux is unique in the fact that it is offered free of charge to users for installation
    on their computers, whereas other operating systems can cost hundreds in licensing
    fees. Installing these operating systems, especially across a number of computers,
    as in the case of a business, can be quite costly. Let''s take a look at the cost
    of setting up a Windows server: in 2012, the price of a Windows server was about
    $1,200 USD. This price excludes CALs (client access licenses) and any other software
    for use on the server. Linux is the clear option in terms of economic advantage
    as is completely free, including everything needed to get the system up and running.
    It can also be installed across many computers as required, with no accumulating
    fees.


    How is it possible that Linux is free to install? It seems too good to be true.'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'Linux is distributed under an open source license. This means a number of things.
    Firstly, users are able to run the program how they wish and for the purpose they
    decide. They can study how the program works and customise the program to suit
    their exact needs. There are no limitations on customisation since it is open
    for anyone can then distribute unmodified or modified copies of the software to
    friends, family, and neighbours, encouraging the sharing and adopting of the operating
    system.


    Linux is a community-driven platform. The open source nature of the software encourages
    users to change and modify the program in order to consistently improve the platform
    and provide more advantages for its users. Linux is the operating system that
    stands for freedom and flexibility, a platform “by the people, for the people.”


    Aside from the obvious economic advantages of setting up Linux versus mainstream
    operating systems, Linux rarely requires any troubleshooting or intervention should
    the system be affected by malware, viruses, or any other slowdowns. In fact, Linux
    can essentially go many years without requiring a single reboot, and then only
    if the kernel requires an update. System administrators can spend less time managing
    servers with Linux because it allows them to essentially set and forget. Of course,
    basic inputs like restarting, reconfiguring, and upgrading are required, but most
    of the elements of the server remain static. The stability and dependability of
    Linux is unmatched, saving users both time and money.


    # LINUX DISTRIBUTIONS


    Earlier, the different versions of Linux created by different users based on their
    specific requirements were mentioned. These modified versions of Linux are known
    as distributions and the'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'different distributions of Linux are obviously suited for different types of
    users. What will suit a beginner to the Linux platform may not be sufficient for
    an advanced user. A version that is a powerful tool in the hands of an advanced
    user may be overwhelming for a beginner who is still learning to make use of the
    platform.


    There are many different distributions, so you should be able to find one that
    fits your needs. Then, you simply download a free version of it, put it on a DVD
    or USB drive to install it across all the systems you need, whether in the home
    or business. A few of the many distributions stand out as user favorites:


    +   - Ubuntu Linux

    - Linux Mint

    - Arch Linux

    - Deepin

    - Fedora

    - Debian

    - openSUSE


    Each of these distributions is popular for different reasons and with different
    groups of users. If you are particularly skilled with computers, you may opt for
    a distribution with some additional features, as Debian or Fedora. For those who
    are more advanced and enjoy the flexibility that comes with their skill level,
    they might choose a distribution like Gentoo. For those who are new to Linux (and
    if you are reading this book, chances that you are new to the platform), you might
    want to opt for one of the simpler distributions to get your feet wet, such as
    Linux Mint,'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'Ubuntu, or Deepin. As you can see, there are many different distributions for
    all types of skill levels and one advantage of Linux is that even when you decide
    on a distribution, you do not have to continue with that distribution forever.
    Once you are comfortable with using those newbie-friendly distributions, you can
    move on to one with a little more flexibility to continue learning.


    Your desktop will depend on the distribution you decide to use. Some users prefer
    a cutting-edge user interface, such as those offered by Ubuntu and Deepin. In
    course, there are also users who prefer a more standard desktop environment, like
    the one offered by openSUSE, KDE. It is important to note that certain distributions
    carry a price tag since they hold extra features and offer user support. Examples
    of these distributions are Red Hat Enterprise Linux and SUSE Enterprise Linux.


    For those searching for a distribution to complement their server, a big decision
    is deciding whether they require a desktop interface or if they are comfortable
    simply using the command line. The Ubuntu Server, for example, does not install
    a Graphic User Interface or GUI. There are advantages to this, the fact that the
    server will never be in danger of being overloaded by the loading of graphics.
    However, it requires a solid understanding of the Linux command line, which does
    take a little bit of practice. You have the option to install your own GUI on
    top of the Ubuntu server, which is an advantage that many Linux distributions
    offer. To install your GUI, you would use the command line to enter "sudo apt-get
    install ubuntu-desktop.


    For system administrators, features are often a core focus. We will explore this
    in a later chapter, but we can mention now that when it comes to Linux, there
    is always the option for more features. Depending on the distribution you select,
    you may have all the features you need for your server straight out of the box,'
  merge: -1
  pgno: 10
- img_proc: true
  md: such as the case for CentOS. You may decide that you want to add the features
    you require as you need them, in which case Debian or Ubuntu Linux may better
    fit your needs.
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Chapter 2: Installing And Setting Up Linux


    There a couple of ways to install Linux from your current operating system. You
    can choose to download Linux from either a live CD or a USB drive, and then boot
    Linux from your system in order to install it. For beginners, this can get a little
    confusing, but it doesn''t actually require a lot of technical knowhow and once
    you get through the first time, installing another system is simple if you choose
    to do so. For this book, we will use the example of installing Linux on a computer
    currently running Windows.


    # INSTALLING FROM A LIVE CD


    To install Linux from a live CD, you will first need to download the appropriate
    file. Before you do this, you will need to select your distribution and visit
    the homepage. From there, you can go through the downloads page and find the file
    that is suited to your system. There are usually a few different files for each
    system: some are optimized for netbooks and others for desktops, offering both
    32- and 64-bit versions. After you locate the version required by your system,
    download the .ISO file.


    Once you have the file on your computer, burn it onto a blank CD. There are programs
    you can download for this but generally your operating system should have some
    built-in programs to make this step relatively simple.


    After the file is burned to the CD, restart your computer. Before the operating
    system boots up, you will be presented with the option to enter the boot menu.
    In this menu, tell the computer to boot from the CD, save your options, and restart'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'once again. If you are unsure of where to go to select these options, consult
    your operating system manual and look for the boot options. This should present
    you with a step-by-step procedure for setting the boot options.


    You are then presented with the option to either install Linux or give it a try.
    It is highly recommended that you go through a trial run before installing Linux
    to ensure that you have a good feel for the desktop and that it is what you had
    in mind. Once you have finished your practice run, it is easy to select the option
    to install.


    # INSTALLING FROM A LIVE USB


    If you are deciding to install from a USB, which is the more contemporary option,
    you will need to install an extra piece of software. Unetboot is one option if
    you are running Windows. It is simple to download and get the program started.
    From there you can decide on your distribution from the list offered and download
    to your USB. Not all the distributions are offered by Unetboot, but that doesn''t
    limit your options. You can simply install the .ISO file from the download page
    of your distribution to your desktop and then have Unetboot pick up on the file.


    You then need to follow the same process as with the CD: restart your computer
    with the installed distribution on your drive connected and go into the BIOS,
    select the boot options and choose the USB hard drive as the first option on the
    list, save your options, and restart once again. You will be taken to the Unetboot
    menu where you can start your Linux session just as you could with the live CD
    method.


    # THE INSTALLATION PROCESS


    The way a distribution is installed on your system varies, but you are generally
    given a setup guide that walks through the process. If you are deciding to install
    Linux alongside another'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'operating system, such as Windows, there is a little bit of work that needs
    to be done during the installation process to ensure that everything runs smoothly.


    The first step, in this case, is to partition your drive. This will tell your
    computer where you want Linux to be installed. This is a simple task that requires
    little effort on your part. You just need to select a space on your hard drive
    and allocate some of the free space you have for the installation and running
    of the operating system.


    If you are installing Ubuntu, the program will generally do this for you by selecting
    its own space. From there, the rest of the installation process is quite simple.


    For other distributions, you will be required to partition the space yourself
    and some partitioning tools can be pretty complex. In this case, you will need
    to create two new partitions. One is to set aside space for the operating system
    itself. The recommendation is at least 10 GB for it. You should name your partition
    “Ext4” and set the mount point as “/. Then create a second partition for what
    is called “swap This This is where the memory will be well held in order to run
    the operating system and keep things processing quickly. If you only have a small
    amount of RAM available, make the swap partition twice as large as your available
    memory. If you have a decent amount of RAM (over 3GB), make the swap partition
    the same size as your available RAM.


    # GRUB AND OTHER BOOTLOADERS


    Before Linux completes the installation process, it will install a new bootloader
    onto your system under the name GRUB. This will be replacing your standard bootloader
    and will give you the option upon start-up to open your desktop with Windows or
    Linux. You do not need to do any work during this part of the'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'installation process; you only need to sit back and let your distribution install
    GRUB.


    For those of you who have a Mac, this is one of the parts of the process that
    will work differently and you will need to install GRUB onto the Linux partition
    manually.


    Windows users: make a note that if you decide to uninstall and reinstall Windows
    at any point, you will need to install GRUB manually once you get your operating
    system set up again.


    If you prefer something with a more enhanced user interface, you may want to install
    another bootloader that is compatible with Linux. An example of this is a bootloader
    called Burg. However, you do not need to do this straight away and wait until
    you have finished installing Linux before setting up a new bootloader.


    If you have followed these steps, you are ready to go. Your Linux partition should
    now be installed and all you need to do is restart your computer to be taken to
    the GRUB menu. From there you can decide whether you would like to boot Linux
    or Windows. Obviously, for the purposes of this book, we want to boot Linux to
    get a feel for it the the first time. You will notice that there are several pre-installed
    apps that come with your Linux distribution. Some of these will be useful to you
    and some will not, but you can take a look at each one and figure out which you
    can use.


    In some cases, installing a new operating system can cause hardware to become
    unstable. This is usually because the hardware does not realize that you are using
    Linux and some miscommunication can occur. This is especially the case for Wi-Fi.
    There are some steps you can take to ensure that your hardware is compatible with
    your new installation. We will discuss this in the next chapter.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Chapter 3: Fine-Tuning Your Hardware


    While this may not happen every time, in some cases when you install Ubuntu or
    some of the other Linux distributions, you will notice that not everything is
    working smoothly. For this chapter, we will be using Ubuntu as our example and
    walking through the steps to ensure that your hardware will work with your newly
    installed operating system.


    # WI-Fi


    Perhaps the most crucial of the hardware issues you will encounter is that your
    Wi-Fi might start acting up. The problem of having Wi-Fi issues is that you will
    have to grab another device to search online for a solution, but fortunately,
    reading through this chapter can ensure you already know how to get your Wi-Fi
    back up and running in the event of an issue.


    You can check the compatibility of your Wi-Fi card and distribution with the Ubuntu
    Community documentation section where you can find people discussing their cards
    and any issues that they may be coming across when installing Ubuntu. You can
    also search for the answers to your problem and find results from other places
    on the internet.


    If you are unable to solve your issues, there are some tools you can use to adapt
    your wireless card Windows driver to communicate effectively with Linux. To do
    this, you will need to install the Windows driver for the card to your system
    and then install the ndisgtk package that comes with Ubuntu. If you don''t have
    access to internet, you can either use an ethernet cable or download the package
    onto a USB and connect this to your'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'system. Then install the package from the system and go into the Administration
    menu. You can then load the INF files to the Windows package using the “Install
    New Driver” button.


    # PROPRIETARY DRIVERS


    For those of you who don''t have open source drivers, Linux is unlikely to be
    able to use these drivers since they do not allow users to use them for their
    own purposes package them them the distributions. In this case, you will need
    to install new drivers manually.


    There are open source drivers available for some of the more mainstream hardware
    drivers, such as Nouveau, which is an open source Nvidia driver and is packaged
    along with many Linux distributions. There is plenty of support that comes with
    these drivers, although they are never quite as streamlined as the proprietary
    drivers, which means you will need to search for the version that will work for
    your distribution.


    This process is different for each distribution, but in the case of Ubuntu, you
    have a simple and straightforward driver manager which can be found under System
    > Administration > Hardware Drivers. This will give you the details of all drivers
    available for your system, allowing you to install them with the push of a button.
    Not all distributions are this simple; some require far more work through online
    searching or reading the documentation for the specific distribution.


    You will need to go through this process for any piece of hardware that might
    be experiencing issues once you have installed your new operating system. These
    issues are nothing to be concerned about; it is just a matter of having the right
    software to replace the Windows drivers previously on your system.


    # DVDS, MP3S, VIDEO FORMATS, AND MORE'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'Here is where things get a little tricky when switching over to Linux because
    unfortunately, there are still a lot of things missing when it comes to some distributions
    (such as Ubuntu), like built-in access to MP3s, DVDs, licensed fonts, and a few
    other items that you might not think of when it comes to using your Windows computer.
    The reason for this is that licensing can be a bit confusing when it comes to
    open source programs, but there is a very simple way around this.


    There are two steps you will need to take to install the correct items to have
    those features up and running:


    If you are currently running Ubuntu, you simply need to follow this link, which
    will take you to the right page to start installing: www.apt:ubuntu-restricted-extras?section=universe?section=multiverse.
    You also have the option of using an installer from Ninite or even of going through
    the Ubuntu software center which can be found in your applications menu. From
    there you simply need to search for “ubuntu restricted,” which will generate the
    link for you to install the extras.


    Once this is done, you will need to open a terminal. This can be done by going
    to the applications menu, clicking on accessories, and then clicking on terminal.
    From there you only need to enter "sudo /usr/share/doc/libdvdread4/install-css.sh"


    This should give you the supporting files you need for MP3s, commercial DVDs and
    most of the other video and audio formats you use on an everyday basis. You will
    also have support for Java and Windows-specific fonts. While Linux may present
    some challenges when it comes to finding the right files, the'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'solutions are never too complex and you only need to do it when you are first
    installing the new operating system.


    # MOUSE AND KEYBOARD


    For those of you who have a more advanced mouse or keyboard with extra buttons
    or features, such as those that are customized for gaming, you might find that
    you are missing some of those features after installing Linux. This can easily
    be fixed by letting Linux know what the purposes of all these extra buttons. There
    are a few ways to remap the extra buttons on your mouse, each requiring some manual
    effort.


    The easiest way to command Linux to utilize the full potential of your mouse is
    by using the command ''xbindkeys''.


    If you are unfamiliar with using commands, don''t worry too much as it is really
    quite simple. As an example, we are going to take a thumb button for a mouse and
    remap it to ''Ctrl+T,'' which you may know is the standard keyboard command for
    opening new tabs in Firefox.


    The first thing we need to consider is the name of each of the buttons on our
    mouse to make sure we give the right command to the right button. It is difficult
    to do this by sight alone, so we will need to run another command to identify
    our available buttons: ''xev''.


    You will see a small white window containing a box. Place your cursor within the
    white window, avoiding the box, and press'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'the button that you would like to issue a command with. By pressing the thumb
    button, for example, we are given some coding which indicates the name of the
    button:


    ButtonPress event, serial 33, synthetic NO, window ox4e00001, root ox142, subw
    oxo, time 568329, (93,19), root:(96,714), state oxo, button 10, same_screen YES


    As you can see along the bottom line, the button we just clicked is known as button
    10. All we need to do now is close xev by using Ctrl+C and continue with the remapping
    of our keys. We then install two new programs: xbindkeys and xautation, by running
    the following command.


    sudo apt-get install xbindkeys xautation


    Then we create a config file for xbindkeys by running the command:


    xbindkeys—defaults /home/your-user-name/.xbindkeysrc


    You will need to replace "your-user-name" with your actual username. This will
    provide you with a file that you can edit by opening your file browser and making
    sure you have hidden files shown. Once you do this, you can see .xbindkeysrc at
    the top of the list. By double clicking it, you will be able to enter the next
    line of command at the end of the file.


    # # Thumb Button = Ctrl+T


    ```

    "xte ''keydown Control_L'' ''key T'' ''keyup Control_L''

