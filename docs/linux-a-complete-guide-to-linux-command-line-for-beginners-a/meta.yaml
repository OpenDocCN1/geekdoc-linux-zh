    ```

    rm -r /home/swapnil/Downloads/distros/opensuse/

    ```


    如果我们决定删除目录内的所有内容但保留目录本身，我们会在斜杠后使用星号（*）。例如，如果我们想删除 opensuse 目录中的所有内容，我们将使用命令行：


    ```

    rm /home/swapnil/Downloads/distros/opensuse/*

    ```


    如果内部还有子目录，你需要再次使用 “-r” 选项来告诉系统你认为清理范围包含了这些子目录。这看起来将会是：


    ```

    rm -r /home/swapnil/Downloads/distros/opensuse/*

    ```


    # 系统信息


    除了与系统上的文件和目录交互外，你还可以使用命令行获取系统本身的信息。例如，如果你想根据分区评估文件系统上的磁盘空间大小，可以使用 "df" 命令；或者如果你想以更易理解的方式读取，可以使用
    "df -h" 命令，它将以兆字节和 GB 为单位显示报告。如果你想查看空空间与已用内存的比较情况，请配合 "-m" 使用 "free" 命令，它将以兆字节报告数字。


    如果你对系统的详情感兴趣，例如正在运行的进程和可用资源（这在初开始使用命令行时有用），你可以使用 "top" 命令。它将为你提供一份关于运行进程、CPU 和
    RAM 使用情况以及正在运行任务总数的报告，你可能想将其与同类型的 GUI 报告进行比较。


    # 总结


    如你所见，使用命令行既简单又强大。与其仅仅依赖会占用宝贵处理资源的 GUI，命令行允许你以精确和快速的速度执行功能。起初看起来可能有点畏人，但一旦你习惯了，就会发现它是与你的计算机以及
    Linux 操作系统交互的一种灵活得的方式。一旦你熟悉了命令行更基础的功能，就可以继续学习高级命令了。


    # 第 6 章：高级命令


    我们在上一章中探索了一些基础的命令，例如如何遍历目录和修改文件。在本章中，我们将为已经习惯 shell 和基础命令的用户考虑一些更高级的命令。请记住，虽然它们是更高级的命令，但它们对于命令行脚本编写的可能性可能仅仅是冰毛一角。现在，让我们为学习
    Linux 命令的人看看下一个层级。


    # FIND


    find 命令允许你在目录内搜索特定文件。这与你在文件管理器中执行的操作类似，但这个 find 命令在跟踪文件方面更加灵活、更强大。find 命令将遍历父目录以及子目录，记录所有匹配你提供的选项的文件。以下是该操作显示方式的示例：


