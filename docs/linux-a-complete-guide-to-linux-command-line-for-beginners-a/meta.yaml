- img_proc: true
  md: '# Chapter 4: Available Features


    The advantages of Linux are found within the kernel. As mentioned earlier in this
    book, the kernel is a piece of code which is consistent throughout Linux. By understanding
    the Linux kernel, you can modify the operating system to include support for the
    features you want. Many people have altered the kernel specifically for their
    needs in the past, and these features have become an integral part of many Linux
    distributions.


    # MULTUSER


    While you can have multiple users with Windows, you lack the ability to have those
    multiple users logged on at the same time. This means you are limited in how many
    people can be working on the system at once. With Linux, multiple users can work
    on the system at the same time, and each user can customize their working environment
    to suit their own needs.


    Each user has their own unique directory where files are stored, desktop with
    icons, menus, and applications. You are, of course, able to password protect these
    accounts in order to protect your applications and data, and control who is able
    to access them, even on the same system.


    # MULTITASKING


    Linux has the advantage of being able to operate many programs at the same time.
    This means users are able to have programs running in the background as well as
    having multiple programs being run at a single time. This also allows your system
    to have processes running that make it possible for Linux to host a server; these
    system processes run in the background'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'and communicate with the network as requests come through log into the system,
    search the web, copy a file, or print a document. These processes are known as
    daemons.


    # GRAPHICAL USER INTERFACE (X WINDOW SYSTEM)


    Linux offers users a powerful framework when working with anything involving graphics.
    This framework is known as the X Window System, also referred to as just ''X''.
    The X Window System manages the functions which are involved in any X-based graphical
    interface applications and allows them to be displayed on those processes that
    are managing the devices of your computer through the server such as the screen,
    mouse, and keyboard.


    You also have the advantage of having an X-based desktop environment which allows
    you to have a simulation of the desktop and window manager of your GUI complete
    with all the icons, window frames, menus, and colors; all the things we refer
    to as themes.


    You have a number of options when it comes to desktop environments and managers,
    each with their own focus.


    # HARDWARE SUPPORT


    There are a number of support options available for the hardware connected to
    computer. This involves anything from floppy disk drives (if you still have them),
    CDs, DVDs, USBs, sound cards, external tape devices, and basically anything that
    is compatible with a computer system.


    As we explored in an earlier chapter, it can be difficult to find the right drivers
    from common hardware manufacturers due to the open source nature of the operating
    system. However, the Linux community will often write a driver to be compatible
    with your distribution within a short amount of time.


    # APPLICATION SUPPORT'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'Due to the fact that Linux is compatible with POSIX, as well as a number of
    other application programming interfaces (or APIs), there is an immense variety
    of freeware and shareware software available for Linux. While it may take some
    streamlining and adjusting, you will be able to run most of the GNU software offered
    by the Free Software Foundation.


    Earlier in our introduction to Linux, we discussed that Linux is an open source
    program with a community of users adopting and adapting the operating system to
    suit their needs. For this reason, the features of Linux are virtually limitless
    in their functionality. If you need Linux to perform a specific function, you
    can alter the software and create your own distribution. While not everyone has
    this kind of skill, it is possible, and even likely, that the feature you are
    looking for is available for download.


    # NO SPWARE


    Spyware has become a massive problem for many Windows users. As soon as a program
    is downloaded that includes spyware, it begins working. The user may be completely
    unaware that there are applications running in the background that are collecting
    user information and sending it back to third parties who use this data to potentially
    steal their identities or sell the information to marketing companies. These applications
    can also change the way the computer interprets information. As mentioned earlier,
    many of the viruses which are created for PCs are specific to Windows, so Linux
    is free from many of the most damaging viruses. Even better, there is no need
    to spend money on purchasing and upgrading anti-virus software or paying for costly
    system recovery.


    # NO DEFRAGMENTATION**'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'Linux has a very advanced and efficient filing system which does not require
    the data to be defragmented. In the case of regular Windows computers, these file
    systems can become fragmented which can cause crashes, slowdowns, and memory loss
    on your system.


    # NO CRASHES


    If you have a Windows computer, you are no stranger to random crashes for which
    you are never given a reason. For example, if you were running Windows and your
    browser crashed, the entire operating system could come crashing down due to the
    fact that the system is connected to the Graphic User Interface. This has happened
    to virtually every Windows user and can be incredibly frustrating when it comes
    to losing data or interrupting an important task. You will experience none of
    these crashes with Linux because the core operating system (the kernel) is separated
    from the Graphic User Interface in the X Window, and from the applications that
    you use such as OpenOffice.org. If an application were to crash for whatever reason,
    such as a corrupted file, the core operating system would remain operational.


    # NO FREQUENT RE-INSTALLATION


    You will notice that one of the ideal solutions for issues with Windows is to
    simply reinstall the entire operating system and start from scratch. This can
    be difficult when it comes to the times that Windows crashes and there is no way
    to recover the data you have lost. If you run a business using your system, this
    can be incredibly costly and damaging to your business operations. Linux, on the
    other hand, will not crash in the same way, meaning your data is safe and recoverable
    if you are faced with any issues, which are, when it comes to Linux, few and far
    between. You are actually able to store your data separately from'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'the operating system so that any personal user preferences are able to be stored
    even if you choose to reinstall the operating system. This can be done by creating
    a new partition which will keep your home directory. Similarly, through Windows,
    you are constantly required to restart the system if any changes are made, such
    as installing new hardware or software, in order to reconfigure the system. In
    the case of Linux, there is no need for this.


    # MANY FILING SYSTEMS


    Windows comes with two filing systems. Linux, on the other hand, brings with it
    hundreds of filing systems, which is useful for those users who are required to
    work across multiple computers, exchanging hardware from one system to another.


    # POWERFUL COMMAND LINE


    We have explored some of the basics of using the command line, or the shell environment.
    With Windows, there is not much farther you can go with the command line, especially
    for basic users. Linux, on the other hand, has an incredibly powerful command
    line, as we mentioned earlier. With Linux''s command line, you can write entire
    programs for Linux, which means that you can eliminate repetitive tasks through
    automation. An example of this would be backing up your system. This is usually
    an extremely arduous task; imagine if you could just run a simple program that
    runs through the entire process with just one click. This and numerous other simplifications
    are all possible with the Linux command line.


    # VENDOR INDEPENDENCE


    With Windows, you are locked into a single vendor if you want to keep your system
    up-to-date. This can be a disincentive for many people who don''t want to keep
    spending money to keep their system safe. With Linux, you are never locked into
    a single'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'vendor because the community offers a large variety of vendors who each have
    their own distributions to offer and to provide support for. If you feel that
    a particular vendor has let you down when it comes to support or if you have encountered
    a distribution that didn''t live up to your expectations, you can either turn
    to the community for further support or adopt a new vendor altogether. You don''t
    have to start over from scratch or feel trapped with a vendor that doesn''t seem
    to have your best interests in mind. Even better, if a vendor happens to walk
    away from their distribution, you are not forced to choose a new vendor or distribution,
    but can instead turn to the ever-growing community to continue publishing your
    distribution. Keep in mind there are no licensing agreements involved when it
    comes to Linux, meaning you are free to download, modify, and repackage as you
    wish.


    # NO REGISTRY


    If you have used registry on Windows, you will know that it can be a nightmare.
    Not only do you need specific tools to open and modify the files, if any of the
    data is corrupted, it can be extremely frustrating to manage. With Linux, most
    of the configuration is stored in plain text files. This allows you to easily
    manage, backup, and transfer these files between systems. This is much simpler
    than using registry.


    # HIGH DEGREE OF DOCUMENTATION


    Have you ever had an issue that you simply could not find a solution for? You
    look through the manual only to come up empty-handed, you search through forums
    and search engines looking for an answer, but there is just no record of anyone
    else having the same issue. This is hardly ever the case for problems with Linux.
    Linux is one of the most documented operating systems and almost all of these
    documents are free of charge.'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'The documents are not PDFs thrown together by just anyone, but well-written
    documents which detail many of the concepts that help explain the inner-working
    of Linux. This is perhaps one of the greatest advantages to the Linux community,
    which is comprised of a number of online forums, articles, and groups that are
    located in virtually every country, city, and town. This means that you are never
    very far from another Linux user in the case that you would like to have someone
    help you out with the systems workings in person.


    You will find that the community almost behaves like a family since everyone has
    the same goals and objectives when it comes to improving and developing the open
    source operating system. The best Linux experience is unlocked when you get involved
    in this community and offer value to other members, who will surely return the
    favor.


    # PACKAGE MANAGEMENT


    The excellent package management offered by Linux allows users to access tools
    which can simplify the process of installing and upgrading applications. In addition
    to this, if you were to upgrade your current distribution of Linux, this is really
    quite simple. Furthermore, if you are a developer, you have access to a wide range
    of development tools, libraries, and compilers which come along with the package.
    For those who are Java developers or Web developers who use PHP/Perl/Ruby or C
    and C++ coding, you can put your skills to good when using Linux. This gives developers
    the freedom to use Linux as you wish and even offer and share their own versions
    of Linux with the community, their friends, and their family.


    # NO OPEN PORTS


    One major issue with Windows computers is the fact that unused ports are left
    open. This can lead to attacks by hackers'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'that can disable and take control of your computer to either inflict harm on
    your system or carry out further attacks using your computer as a kind of attack
    zombie. Linux leaves no open ports, which means your data is highly secure and
    protected from unauthorized entry.


    # FASTER RELEASE CYCLE


    The patches that are created for Linux distributions are written within hours
    rather than days or weeks in the case of other operating systems. This means if
    there is a known issue or threat to the security of your system, patches, which
    offer protection, will be created much faster than in the case of proprietary
    software. Additionally, many of the Linux distributions are set to be released
    every 6 months, making it easy to gain access to the latest application updates,
    patches, and bug fixes, as well as improvement and support for newer hardware
    that you have integrated into your system. Windows, on the other hand, has an
    inconsistent release cycle. Sometimes it can take years for a reliable release
    with some of the releases being poor and full of bugs, really not worth upgrading
    to.


    # TOTAL CONTROL


    Using Windows can sometimes feel as though you are on a runaway train. You have
    applications and processes opening that you have very little understanding of.
    Sometimes you many not even know what a program is, or what it is doing to your
    computer. This can be not only confusing, but it can also take precious memory
    which should be allocated to the programs you want and need. With Linux, you have
    greater control over what applications are running and updating, as well as when
    they do so. You will need to give permission before a program opens so you always
    know exactly what is occurring on your computer.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'You also have full control over the GUI that is operating on your system. If
    you wanted to change the type of GUI you are using with Windows, you would be
    unable to do so as you only have one default GUI. Linux offers an extensive variety
    of GUIs, which are (ironically) called Window Managers. You can select a GUI that
    you feel works best for the way you use your system. There are dozens of options,
    from beautiful graphic-heavy GUIs to fast, streamlined options. There are also
    options that are great for beginners, a few of which, like Gnome and KDE, have
    been mentioned in earlier chapters.


    # BUNDLES


    Windows generally avoids bundling applications with the operating system other
    than a simple text editor, an image-editing application, and a few others. Many
    of the applications that are worthwhile require external downloading and installation
    and often come with a high price tag. Linux bundles many different applications
    with the distributions. These range from some of the well-known programs like
    the Office Suite and photo-editing software, to some open source applications
    that might be new to you. The advantage is that these applications will come with
    your distribution free of charge. They improve your computer experience with no
    extra fees involved. Some of these open source programs are available to download
    and use on a Windows system, but this takes download and installation time, whereas
    with Linux they are already available by default. These bundles can be massive,
    with thousands of applications, some boasting over 20,000 of them.


    For those applications that you need to download onto your system, you can do
    this through the included app store. With Ubuntu, the built-in app store has thousands
    of applications which can be easily downloaded with a single click.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# BROWSING BENEFITS


    Most Linux distributions come bundled with Mozilla Firefox, which most of you
    will be familiar with. Firefox is a powerful browser with a number of built-in
    features, such as ad-blocking, pop-up restriction, and a number of other advantages
    over the standard browser packaged with Windows. Linux also makes browsing simpler
    and faster due to Linux’s improved networking capabilities that save bandwidth
    and ensure a stable internet connection.


    # NO AUTOMATIC UPDATES


    Automatic updates are often touted as a benefit of Windows, but this process can
    be not only annoying, but also harmful to the ways in which you are using your
    system. Most people probably have no idea what files are actually updated. With
    Linux, you have the option to click and apply the update rather than this happening
    without your consent. You are welcome to set up your own automatic updates if
    you wish, but you do not have to just accept them. With Linux, you are given total
    control over when, how, and what your computer will be updating.


    # 3-D DESKTOP


    Linux allows users to take advantage of an advanced 3-D desktop with Compiz, allowing
    you to switch and view multiple desktops simultaneously. This feature was considered
    quite advanced when it was created, miles ahead of Windows. Even now, Compiz is
    one of the most streamlined 3-D desktops and takes up little memory on the graphics
    cards.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Chapter 5: Using The Linux Command Line


    We have already covered what the command line is and a few of the basics, but
    now it is time to jump in a little deeper and see what is really possble. In this
    chapter, we will be exploring some of the functions of the command line interface
    and its advantages over the graphical user interface. While the GUI is great for
    beginners and users who have just installed Linux to get a feel for their new
    operating system, the true power is found within the command line. This is where
    we are truly able to make Linux work for us.


    The command line allows you to work outside the limitations of your distribution.
    Relying on your distribution means you will become accustomed to performing tasks
    a certain way, and if you then need to change distributions for some reason, you
    will have to relearn even some of the most basic tasks because there are many
    different ways to perform tasks across distributions. Depending on the distributions
    you are moving between, this can be quite a complex undertaking and using the
    command line enables you to skip this adjustment and stay in control regardless
    of the distribution you are using.


    By understanding the Debian-based systems, you are able to use basic commands
    as “apt-get” or “dpkg” to manage your software, regardless of the distribution
    you are using. This also allows you to avoid the pain of discovering that the
    distribution you are using is missing some of the features you have become accustomed
    to, or of discovering that these features were hidden in the updated GUI.'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'There are more advantages to using the command line than just having control
    over the features available to you. Using a GUI can cause many of the system''s
    resources to be consumed, slowing down your system and causing tasks to take much
    longer than they would take if you were using the command line.


    The command line can be quite intimidating at first, but once you understand the
    language, it is as simple as sending a message to your PC with some instructions
    on what you need to do. Imagine texting a teenager for the first time and not
    understanding the lingo. Similarly, not knowing the command line language can
    make you feel pretty out of the loop and confused. Once you know it though, you
    can communicate with ease and hopefully avoid embarrassing yourself.


    # GETTING THE SHELL


    Before you are able to start typing commands to your computer, you will need to
    run the shell. The shell is the program which creates the orders for the computer
    using the text that you input. There is a specific set structure of commands which
    will be unique to your OS, as different operating systems use different structures
    when performing similar tasks.


    For this reason, there are many different shells available for Linux, but the
    most common and popular one, which is recommended since it will have the largest
    community support, is BASH (Bourne-Again shell). BASH was written by the GNU Project
    and is the best go-to for beginners. There are other options if you prefer something
    more modern with a few extra features as “zsh,” which can easily be installed
    from your distribution.


    If you are working from a desktop environment, then it is best to use a terminal
    emulator in order to emulate the terminal for that particular interface. You will
    find that different distributions'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'will come with their own specific terminal emulators. For example, KDE comes
    with Konsole, and Gnome uses Gnome Terminal.


    # YOUR FIRST COMMANDS


    When opening the terminal emulator, you will notice that you are in the home directory
    of the logged-in user by default. This can be seen with the name of the logged-in
    user prior to the hostname. Seeing the $ symbol indicates that you are logged
    in as a regular user, while seeing the # symbol indicates that you are logged
    in as a root.


    It is best to avoid working on the command line as a root this can change the
    permissions of all the files you have been working on as well as their directions,
    and make the root user of the directions and files within. If you are performing
    administrative tasks, however, or working inside root directory, there is no issue
    being logged in as a root user.


    If you would like to see all the directions and files that are in the current
    directory you are working in, you can do this by listing all with the "ls" command
    which is the following line of command:


    ```

    [swapnil@swaparch ~]$ Is

    Desktop Documents Downloads Music Pictures Public Templates Videos

    ```


    # CHANGING LOCATIONS


    You can move through your system by first changing to any directory through the
    use of the "cd" command. If you feel like taking a shortcut, you are also able
    to use the tab key to automatically complete the path. To enter directories, you
    simply need to use forward slash. For example, if you would like to go'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'into the downloads directory inside the home folder, you use cd to command
    a change in directory, followed by the path you would like to travel. You will
    need to use your username as part of the command. For this example, we will use
    "swapnil":


    ```

    Documents/ Downloads/

    [swapnil@swaparch ~/] cd /home/swapnil/Downloads/

    [swapnil@swaparch Downloads]$

    ```


    You will notice in the third line, we have our directory,

    "Downloads," located inside some square brackets. This indicates that the move
    has been successful and we are now located inside the directory. If you would
    like, you can see the subdirectory and files located inside Downloads by using
    the "ls" command once again.


    Keep in mind that you don''t need to provide the complete path when moving around
    inside a subdirectory if you are coming from the current directory. For example,
    if you would like to travel to a subdirectory known as "Test," which is located
    within the downloads directory, all you will need to type "cd" and then the directory
    name, which would be written as "Test," without requiring the forward slash.


    ```

    [swapnil@swaparch Downloads]$ cd Test

    ```


    When changing from one directory to another, you simply need to follow that same
    procedure by using "cd" in order to reverse your steps and go back to the directory
    that you just came from, you will need to use "cd .." and if you need to go back
    even'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'further, say two directories, you would use "cd ../../" The more directories
    you are retracing, the more you extend the command line in that way.


    If you would like to have a peek at the content located within a directory, you
    don’t need to change directories. Instead you can use the "ls" command, but in
    a slightly different way:


    ```

    ls /PATH_OF_DIRECTORY

    ```


    Going back to our previous example, if we wanted to look in the Test folder without
    having to go there we simply type in:


    ```

    [swapnil@swaparch ~]$ ls /home/swapnil/Downloads/Test/

    ```


    In the case that a directory is hidden, you are still able to see it by using
    a special option within the "ls" command. Following "ls," you simply need to type
    in "-a," as in the example below:


    ```

    [swapnil@swaparch ~]$ ls -a /home/swapnil/Downloads/Test/

    ```


    # DETERMINING SIZE


    What if you need to look at the size of the directories you are working in? Is
    this possible with the command line? Yes! And it''s really quite simple. You will
    only need to use the "-l" option along with the "ls" command. This will also give
    you a breakdown of some other information, such as the permissions of the files
    and directories, whose their owners are, as well as the time and date of the latest
    modification.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '```

    [swapnil@swaparch ~]$ ls -l /home/swapnil/Downloads/Test/

    total 4

    drwxr-xr-x 2 swapnil users 4096 Mar 26 11:55 Test_2

    ```


    As you can see, the command provides the file size in a way that can be a little
    difficult to make sense of. There is a way we can change this format to have it
    presented in a way that makes it more understandable and readable for those who
    might not be familiar with the coding. All we need to do here is use the "ls -lh"
    command like so:


    ```

    [swapnil@swaparch ~]$ ls -lh /home/swapnil/Downloads/Test/

    total 4.0K

    drwxr-xr-x 2 swapnil users 4.0K Mar 26 11:55 Test_2

    ```


    If you would like a breakdown of all the directories and files located within
    a particular location, you are able to obtain a simple list which is free of all
    the extra information. This can be done using the "ls -R" command. You will find
    that the output generated from this command can be quite long as it carries all
    the files located within a direction and where they are located.


    # CREATING NEW DIRECTORIES


    Now we are in order to do this, you will need to familiarize yourself with the
    command line. In order the command "mkdir." Upon entering this command, you will
    find that the new directory is created within the current directory by default.
    If you want to create this directory in another location, you can do this by providing
    a complete path to the location which you desire your new directory be created:'
  merge: -1
  pgno: 37
- img_proc: true
  md: '```

    mkdir /path-of-the-parent-directory/name-of-the-new-directory

    ```


    As an example, if we wanted to create a new directory called "distros" to keep
    all the files that are created when we download a Linux distribution in the downloads
    directory, then we would simply run the following command:


    ```

    $swapnil@swaparch ~/ mkdir /home/swapnil/Downloads/distros

    ```


    Now, if we would like to create a further subdirectory inside this newly created
    directory, we would need to use the "-p" option in conjunction with the "mkdir"
    command. If you wanted to create a new directory called "distros," but also add
    a further directory called "opensense" within it, you would need to let the system
    know that while this directory doesn''t exist, you would like to create it now
    in order to store this new directory within it. Let''s have a look at an example:


    ```

    mkdir -p /home/swapnil/Downloads/distros/opensense

    ```


    What this will do is create a new directory called "distros," as well as another
    directory within it called "opensense"—all with a single command. Can you do that
    with a fancy GUI? Not likely.


    # DELETING DIRECTORIES


    Deleting directories is just as simple and straightforward as creating them. You
    will need to use the command "rm" if you want to delete files, and the command
    "rm -r" if you want to delete a directory. Remember the difference and be aware
    of which command you use as it can be devastating to use the'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'wrong one when you intend to delete files and actually end up deleting the
    entire directory.


    ```

    rm /path-of-the-directory-or-file

    ```


    For our example, we are going to delete the opensuse directory we just created.
    In order to do this, we would use the command line:


    ```

    rm -r /home/swapnil/Downloads/distros/opensuse/

    ```


    If we decided we would like to delete all the content within a directory but keep
    the directory itself, we would use the asterisk following a slash. For example,
    if we were to delete everything within the opensuse directory, we would use the
    command line:


    ```

    rm /home/swapnil/Downloads/distros/opensuse/*

    ```


    In the case that there are subdirectories located inside, you would need to use
    the “-r” option once again in order to tell the system that you are including
    the sub-directories in your purge. This would appear as:


    ```

    rm -r /home/swapnil/Downloads/distros/opensuse/*

    ```


    # SYSTEM INFORMATION


    Aside from interacting with the files and directories on your system, you are
    also able to use the command line to gain'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'information on the system itself. For example, if you wish to assess how much
    disk space is on your file system based on the partitions, you are able to use
    the command "df", or if you would like to read it in a more understandable way,
    use the command "ds -h", which will then display the report in megabytes and gigabytes.
    If you would like to look at the amount of free space in comparison to the used
    memory, use the "free" command in conjunction with "-m," which will report back
    the figure in megabytes.


    If you like details on the system such as the processes running and the resources
    available, which is useful when first adopting the command line, you can use the
    "top" command. This will give you a report on the running processes, the usage
    of your CPU and RAM, and a total number of the tasks being run, which you might
    like to compare with the GUI report of the same nature.


    # SUMMARY


    As you can see, using the command line is both simple and powerful. Rather than
    just relying on the GUI, which can take up valuable processing resources, the
    command line allows you to execute functions with precision and speed. It might
    seem a little daunting at first, but once you get used to it, you will find that
    it is a much more flexible way of interacting with your computer and with the
    Linux operating system. Once you become comfortable with the more basic functions
    of the command line, you can then move forward with advanced commands.'
