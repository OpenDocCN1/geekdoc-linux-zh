    There are a few options available to you when using the grep command, such as:


    ```

    -w for word (egrep -w ''word1|word2'' /path/to/file)

    -c for count (i.e., total number of times the pattern matched)

    (grep -c ''word'' /path/to/file)

    -color for colored output (grep -color server /etc/passwd)

    ```


    # COMMAND: MAN


    This one is useful for when you are just starting out and you want to see some
    of the options available for a particular command. The man is the system''s manual
    pager and basically gathers all the available documentation from the internet
    for a'
  merge: -1
