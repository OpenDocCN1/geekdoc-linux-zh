  trans: "\n\n`brw-rw----  1 root disd 9,  1 May 17 10:15 sda1`\n\n这里，`sda` 和 `sda1`\
    \ 的主号是 9，次号不同，分别为 0 和 1。\n\n# 解释 #4\n\n任何 `/dev/xxx` 下的接口都遵循“一切皆文件”，因此设备驱动的操作实际上就是对文件的操作。我们可以认为设备驱动的\
    \ API 全都是关于文件操作，而设备驱动被用于定义/打开/读/写等功能。所有的文件操作都定义在内核头文件 `<linux/fs.h>` 的 `file_operations`\
    \ 结构体中。\n\n在接下来的设备驱动示例中，我们将看到 `file_operations` 结构体：\n\n```c\nstruct file_operations\
    \ gpio_fops = {\n    read    : gpio_read,\n    write   : gpio_write,\n    open\
    \    : gpio_open,\n    release : gpio_close,\n    owner   : GPIO_MODULE\n};\n\
    ```\n\n在这里，我们声明了一个结构体并将其赋值给结构体变量 `gpio_fops`。除了 `owner` 之外，这些值都是函数指针。然后我们使用 `cdev_add`\
    \ 在初始化模块中为每个驱动注册文件操作结构体。\n\n# 开发一个微型 GPIO 字符设备驱动\n\n```c\n#include <linux/kernel.h>\n\
    #include <linux/module.h>\n#include <linux/moduleparam.h>\n#include <linux/init.h>\n\
    #include <linux/stat.h>\n#include <linux/cdev.h>\n#include <linux/device.h>\n\
    #include <linux/fs.h>\n#include <linux/slab.h>\n#include <asm/uaccess.h>\n#include\
    \ <linux/string.h>\n\n// 头文件包含结束\n#define DEVICE_MAJOR  200\n#define DEVICE_MINOR\
    \  0\n#define DEVICE_DEV_COUNT 2\n\n// 定义结束\n\nstatic int gpio_open(struct inode\
    \ *, struct file *);\nstatic ssize_t gpio_read(struct file *, char *, size_t,\
    \ loff_t *);\nstatic ssize_t gpio_write(struct file *, const char *, size_t, loff_t\
    \ *);\nstatic int gpio_close(struct inode *, struct file *);\n\nstruct file_operations\
    \ gpio_fops = {\n    read    : gpio_read,\n    write   : gpio_write,\n    open\
    \    : gpio_open,\n    release : gpio_close,\n    owner   : GPIO_MODULE\n};\n\n\
    struct cdev gpio_cdev;\nstatic char *dev_c_message = NULL;\n\nstatic int entrance(void)\
    \ {\n    // 获取设备号\n    // 设备 ID 使用类型 dev_t 来表示。\n    dev_t devno;\n    unsigned\
    \ int count = DEVICE_DEV_COUNT;\n    int err;\n\n    // 设备 ID 由两部分组成：主 ID（用于识别设备类）\n\
    \    // 和次 ID（用于识别该类中特定设备的实例）。\n    // 给定主设备和次设备 ID，makedev() 将这些合并以产生\n    //\
    \ 设备 ID，并作为函数结果返回。\n    // 主号和次号是 Linux 识别与设备文件相关的底层硬件设备的方式。\n    // 大多数情况下主号标识驱动程序，而次号区分驱动程序控制的不同设备。\n\
    \    devno = MKDEV(DEVICE_MAJOR, DEVICE_MINOR);\n\n    // register_chrdev_region\
    \ 函数 — 注册设备设备号\n    // 参数为 (dev_t from, unsigned count, const char * name);\n\
    \    // from - 目标设备号范围中的第一个；必须包含主号。\n    // count - 需要的连续设备号数量\n    // name -\
    \ 设备或驱动程序的名称\n    register_chrdev_region(devno, count, \"gpiodev\");\n\n    //\
    \ cdev_init — 初始化一个 cdev 结构体\n    cdev_init(&gpio_cdev, &gpio_fops);\n    gpio_cdev.owner\
    \ = GPIO_MODULE;\n\n    // cdev_add 向内核注册一个字符设备。\n    // 内核在 cdev_map 下维护了一个字符设备列表\n\
    \    err = cdev_add(&gpio_cdev, devno, count);\n    if (err < 0) {\n        printk(\"\
    Error: While Adding Device\\n\");\n        return -1;\n    }\n\n    printk(\"\
    TINY GPIO Device Driver.\\n\");\n    printk(\"'mknod /dev/gpiodev_0 c %d 0'.\\\
    n\", DEVICE_MAJOR);\n    printk(\"'mknod /dev/gpiodev_1 c %d 1'.\\n\", DEVICE_MAJOR);\n\
    \n    // kmalloc 是内核中为小于页大小的对象分配内存的标准方法。\n    dev_c_message = (char *)kmalloc(32,\
    \ GFP_KERNEL);\n    if (dev_c_message != NULL) {\n        printk(\"kmalloc dev_c_message:\
    \ 0x%p\", dev_c_message);\n    }\n    return 0;\n}\n// 初始化部分结束\n\nstatic void\
    \ out(void) {\n    dev_t devno;\n    printk(\"Bye TINY GPIO Driver\\n\");\n  \
    \  if (dev_c_message) {\n        // 释放相关内存\n        kfree(dev_c_message);\n  \
    \  }\n    // 释放微型字符设备\n    devno = MKDEV(DEVICE_MAJOR, DEVICE_MINOR);\n    //\
    \ unregister_chrdev_region — 注销设备设备号范围\n    unregister_chrdev_region(devno, DEVICE_DEV_COUNT);\n\
    \    // cdev_del — 从系统中删除 cdev\n    cdev_del(&gpio_cdev);\n}\n// 清理部分\n\nstatic\
    \ int gpio_open(struct inode *inode, struct file *fil) {\n    int dev_major;\n\
    \    int dev_minor;\n    dev_major = MAJOR(inode);\n    dev_minor = MINOR(inode);\n\
    \    printk(\"\\nTINY GPIO DEVICE: OPEN : %d %d\\n\", dev_major, dev_minor);\n\
    \    return 0;\n}\n\nstatic int gpio_close(struct inode *inode, struct file *fil)\
    \ {\n    int dev_major;\n    int dev_minor;\n    dev_major = MAJOR(inode);\n \
    \   dev_minor = MINOR(inode);\n    printk(\"\\nTINY GPIO DEVICE: CLOSE : %d %d\\\
    n\", dev_major, dev_minor);\n    return 0;\n}\n\nstatic ssize_t gpio_read(struct\
    \ file *filp, char *buff, size_t len, loff_t *off) {\n    int dev_major;\n   \
    \ int dev_minor;\n    short count;\n    dev_major = MAJOR(filp);\n    dev_minor\
    \ = MINOR(filp);\n    printk(\"FILE OPERATION READ:%d:%d\\n\", dev_major, dev_minor);\n\
    \    switch (minor) {\n        case 0:\n            strcpy(dev_c_message, \"DATA\
    \ FROM minor : 0\");\n            break;\n        case 1:\n            strcpy(dev_c_message,\
    \ \"DATA FROM minor : 1\");\n            break;\n        default:\n          \
    \  len = 0;\n    }\n    // copy_to_user — 将数据拷贝到用户空间。\n    // 成功时返回未拷贝的字节数。\n\
    \    count = copy_to_user(buff, dev_c_message, len);\n    return 0;\n}\n\nstatic\
    \ ssize_t gpio_write(struct file *filp, const char *buff, size_t len, loff_t *off)\
    \ {\n    int dev_major;\n    int dev_minor;\n    short count;\n    memset(dev_c_message,\
    \ 0, 32);\n    dev_major = MAJOR(filp);\n    dev_minor = MINOR(filp);\n    count\
    \ = copy_from_user(dev_c_message, buff, len);\n    printk(\"FILE OPERATION WRITE:%d:%d\\\
    n\", dev_major, dev_minor);\n    printk(\"dev_c_message: %s\", dev_c_message);\n\
    \    return len;\n}\n\nmodule_init(entrance);\nmodule_exit(out);\nMODULE_LICENSE(\"\
    BSD\");\nMODULE_DESCRIPTION(\"TINY GPIO Driver\");\n\n# Makefile\n```makefile\n\
    obj-m += gpiodriver.o\nall:\n\tmake -C /lib/modules/$(shell uname -r)/build M=$(PWD)\n\
    clean:\n\tmake -C /lib/modules/$(shell uname -r)/build M=$(PWD) clean\n```\n\n\
    现在编译上述源码，获取 `gpiodriver.ko`，对其进行签名，最后通过 `insmod` 将其加载到内核。检查是否成功加载：\n```bash\n\
    insmod gpiodriver.ko\nlsmod | grep gpiodriver\ncat /proc/devices | grep gpiodriver\n\
    dmesg | tail -10\n```\n\n# 附录 A：Linux 内核编码风格\n\n### 缩进\n最重要的规则之一，因为 Tab 占用 8 个字符，所以缩进也是\
    \ 8 个字符。现在，有些程序员声称 8 字符的缩进会导致代码向右移动太远，难以在 80 字符的屏幕上查看。解决这个办法是，如果你需要超过 3 级的缩进，你就需要修复你的源码。8\
    \ 字符缩进让阅读变得更简单，并且在函数嵌套过深时具有额外的警示作用。\n\n```c\nswitch (test) {\n    case '1':\n\
    \    case '2':\n        data <<= 2;\n        break;\n    case '3':\n    case '4':\n\
    \        data <<= 4;\n        break;\n    case '5':\n    case '6':\n        data\
    \ <<= 6;\n        break;\n    case '7':\n    case '8':\n        data <<= 8;\n\
    \        break;\n    case '9':\n    case '10':\n        data <<= 10;\n       \
    \ break;\n    default:\n        break;\n}\n```\n\n- 在单行内不要进行多次赋值。内核代码应该是极其简单、易于阅读和理解的。\n\
    - 让你的表达式变得易于理解。\n- 不要在行尾留有空白字符。\n- 在单行内不要放置多个语句。\n\n### 长行折行\n强烈建议将行长度限制在 80 列以内。永远不要打破此规则。任何超过\
    \ 80 列的语句都必须拆分成几部分，超过 80 列会显著降低源码的可读性，且不会隐藏任何信息。\n\n### 空格的放置\n在关键字后使用空格（例外是那些像函数且通常与括号一起使用的关键字，例如\
    \ `if`、`attribute`、`sizeof`、`typeof`）。不要在括号内部使用空格。\n\n### 大括号的位置\n建议在结构定义处使用大括号。\n\
    ```c\nif (input) {\n    input++;\n} else switch (input) {\n    case 1:\n     \
    \   input++;\n        break;\n    case 2:\n        input++;\n        break;\n\
    \    default:\n        break;\n}\n```\n在函数定义处使用大括号。\n```c\nvoid function(void)\
    \ {\n    // ...\n}\n```\n在 `if` 语句中使用大括号。\n```c\nif (condition) {\n    // ...\n\
    }\n```\n在 `switch` 语句中使用大括号。\n```c\nswitch (variable) {\n    case 1:\n       \
    \ // ...\n        break;\n}\n```\n"
