    int out(void){​ printk(KERN_DEBUG “Goodbye LKM”);}//// End of cleanup sectionmodule
    __init (entrance);module __exit(out);MODULE_LICENSE (“BSD”);//// End of module
    licensing sectionOther MacrosYou can also use other macros like MODULE_DESCRIPTION,
    MODULE_AUTHOR, these are pretty helpful to understand module purpose and who written
    the moduleMODULE_AUTHOR (“Your Name”);MODULE_DESCRIPTION (“This is test module”);For
    example,#include <linux/kernel.h>#include <linux/module.h>//// end of header include
    section#define __KERNEL__#define MODULE#define LINUX//// end of macro define sectionstatic
    int __init entrance (void){​ printk(KERN_DEBUG “Hello LKM\n”);​ return 0;}static
    void __exit out (void){​ printk(KERN_DEBUG “Goodbye LKM\n”);}module __init (entrance);module
    __exit(out);MODULE_AUTHOR (“Md Mahbubur Rahman”);MODULE_LICENSE (“BSD”);//// End
    of module licensing sectionThe __init macro defines that the cited function not
    further needed after initialization. Kernel frees it from memory after initialization
    and __exit macro used to remove.Command-line arguments in LKMTo take command line
    arguments, LKMs need to use MODULE_PARAM () macro and variables should be called
    global.The MODULE_PARAM() macro takes 2 arguments: a variable name and variable
    type.There is another relevant macro MODULE_PARAM_DESC() which is used for documenting
    module arguments. It takes two parameters: variable name and variable description.Supported
    data types in command-line arguments


    *   Bool


    *   Byte (single)


    *   Character pointer


    *   Array


    *   Short int


    *   Unsigned short int


    *   Int


    *   Unsigned int


    *   Long int


    *   Unsigned long int'
