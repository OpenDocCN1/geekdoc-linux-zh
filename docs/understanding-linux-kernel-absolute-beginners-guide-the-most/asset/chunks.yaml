    \ most of the include files needed to build the kernel source code.\n    * It\
    \ has also subdirectories for every supported architecture.\n\n* **init**\n  \
    \  * This part contains the initialization code for the kernel.\n    * This directory\
    \ is a pretty important place for developers who need to know how the kernel works.\n\
    \n* **mm**\n    * This part holds all of the memory management relevant code.\n\
    \n* **drivers**\n    * This directory contains all system’s device drivers.\n\
