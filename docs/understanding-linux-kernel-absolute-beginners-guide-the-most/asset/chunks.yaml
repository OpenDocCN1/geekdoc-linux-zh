    \ facilitated by new `TEE` framework.\n* Documentation system of kernel now supported\
    \ by `Sphinx`.\n* `Statx()` system call is now available.\n\n### Linux kernel\
    \ source size\n\nEvery year `Linux kernel` adding support new hardware and feature,\
    \ so it’s source size growing fast. In its first release in 1991, kernel source\
    \ size was nearly 10k lines of code, currently, it has more than 22 million lines\
    \ of code.\n\n### Linux Kernel Directory / Source Structure\n\nFrom the top level\
