  trans: "\n\n* `printk()` 的另一个重要特性是日志级别。在将 `printk()` 的内容打印到控制台之前，内核会检查日志级别。\n\n\
    ### `printk()` 日志级别优先级\n\n`<linux/kernel.h>` 中定义了 `printk()` 的八（08）个优先级级别。它们列在这里：![Macintosh\
    \ HD:Users:mahbub:Desktop:Screen Shot 2018-08-01 at 2.30.44 PM.png](img/image_rsrc2JH.jpg)\n\
    \n* `KERN_EMERG`\n  严重且致命的紧急状况，可能导致系统停止或崩溃。\n\n* `KERN_ALERT`\n  紧急问题，可能需要立即采取行动。\n\
    \n* `KERN_CRIT`\n  关键状态，通常与严重的硬件或软件故障有关。\n\n* `KERN_ERR`\n  错误状态，例如硬件故障、软件故障将以该日志级别进行报告。\n\
    \n* `KERN_WARNING`\n  警告级别消息。\n\n* `KERN_NOTICE`\n  当前情况可能正常，但仍值得注意。\n\n* `KERN_INFO`\n\
    \  在此日志级别报告信息性消息。\n\n* `KERN_DEBUG`\n  调试消息，此日志级别通常用于调试目的。\n\n现在你脑中产生了一个问题，如果不指定日志级别，会发生什么？将使用\
    \ `DEFAULT_MESSAGE_LOGLEVEL` 的默认值，它目前是 `KERN_WARNING`。\n\n#### Printk 示例 #1\n\n\
    ```c\n#include <linux/kernel.h>\n#include <linux/module.h>\n// end of header include\
    \ section\n#define __KERNEL__\n#define MODULE\n#define LINUX\n// end of macro\
    \ define section\nstatic int entrance(void){\n  printk(KERN_DEBUG \"Simple and\
    \ Basic Printk example\");\n  return 0;\n}\n// end of init section\nstatic int\
    \ out(void){\n  printk(KERN_DEBUG \"Goodbye! But remember, printk is amazing.\"\
    );\n}\n// End of cleanup section\nmodule __init (entrance);\nmodule __exit(out);\n\
    MODULE_LICENSE (\"BSD\");\n// End of module licensing section\n```\n\n#### Printk\
    \ 示例 #2\n\n```c\n#include <linux/kernel.h>\n#include <linux/module.h>\n// end\
    \ of header include section\n#define __KERNEL__\n#define MODULE\n#define LINUX\n\
    // end of macro define section\nstatic int entrance(void){\n  printk(KERN_DEBUG\
    \ \"Simple and Basic Printk example : FILE: %s, LINE : %i\\n\", __FILE__, __LINE__);\n\
    \  return 0;\n}\n// end of init section\nstatic int out(void){\n  printk(KERN_DEBUG\
    \ \"Goodbye! But remember, printk is amazing: FILE: %s, LINE : %i\\n\", __FILE__,\
    \ __LINE__);\n}\n// End of cleanup section\nmodule __init (entrance);\nmodule\
    \ __exit(out);\nMODULE_LICENSE (\"BSD\");\n// End of module licensing section\n\
    ```\n\n## 第 9 章：加载和卸载 LKM\n\n### 按需加载和卸载 Linux 内核模块 (LKMs)\n\nLinux 内核有一个强大的功能，它可以自动加载和卸载\
    \ LKM，这有助于避免浪费内核进程和内存。但要使用这项支持或功能，我们需要需要在编译内核之前的配置内核时启用 `kmod` 模块。\n\n大多数发行版如\
    \ Redhat、Debian、Ubuntu、CentOS 等都带有启用的 `kmod`。`kmod` 功能或支持随 `libkmod.so` 库一起。\n\
    \n`libkmod` 库的内容：\n- `insmod`\n- `rmmod`\n- `depmod`\n- `modprobe`\n- `modinfo`\n\
    - `lsmod`\n\n`insmod` 用于将模块插入 Linux 内核。\n注意：`insmod` 需要传递完整路径和按正确顺序排列模块列表（依赖模块）。如果我们考虑\
    \ `nfs.ko`，它需要以下相关顺序的模块：\n\n1. `nfs_common.ko`\n2. `auth_rpcgss.ko`\n3. `fscache.ko`\n\
    4. `lockd.ko`\n5. `sunrpc.ko`\n\n`rmmod`\n`rmmod` 从 Linux 内核中卸载模块。如果我们想卸载或移除模块，必须运行以下命令：\n\
    `$ rmmod modulename`\n例如，我们有一个模块 `vfat`，我们需要卸载它。那么命令将是：\n`$ rmmod vfat`\n注意：在\
    \ Linux 内核中还有另一种卸载或移除模块的方法。那是 `modprobe –v –r`。在这里移除 `vfat` 的命令为：\n`$ modprob\
    \ –v –r vfat`\n其中，`r` 是 remove 的缩写，`v` 代表 verbose（详细）。\n\n`depmod`\n`depmod` 与现有的模块集一起。它根据命令行中提到的现有模块集或从配置文件指定的目录中找到的符号，创建一个依赖文件。\n\
    `depmod` 创建一个类似于 `Makefile` 的依赖文件，`modprobe` 用它自动加载正确的模块或模块栈。\n注意：`depmod` 文件可以在\
    \ `/lib/modules/kernel-version/modules.dep` 找到。\n\n`modinfo`\n`modinfo` 程序显示 Linux\
    \ 内核模块的信息。它显示每个模块的以下信息：\n1. 模块作者\n2. 许可证\n3. 参数\n4. 依赖关系\n5. 模块描述\n6. 模块完整路径\n\
    \n`lsmod`\n`lsmod` 程序显示当前加载的模块。它显示以下：\n1. 模块名称\n2. 模块大小\n3. 使用计数和引用模块列表\n\n`modprobe`\n\
    `modprobe` 程序向 Linux 内核添加或删除模块。它查看 `/lib/modules` 中的所有模块。它是如何工作的？通过 `depmod` 生成的\
    \ `dep` 文件。\n\n## 第 10 章：设备驱动程序简介\n\n### 设备驱动程序简介\n\nLinux 内核大部分源码都在设备驱动程序中。drivers\
    \ 目录包含了所有的 Linux 设备驱动源码。该目录有以下部分：\n\n* `/block`\n  - 块设备驱动位于此处。\n  - 块设备包括 IDE\
    \ 和 SCSI 设备。\n* `/char`\n  - 字符设备驱动位于此处。例如 `tty`。\n* `/cdrom`\n  - Linux 的 CDROM\
    \ 代码位于此目录。\n* `/pci`\n  - PCI 伪驱动位于此目录。\n* `/scsi`\n  - Linux 支持的所有 SCSI 设备驱动程序位于此处。\n\
    * `/net`\n  - 网络设备驱动位于此处。\n* `/sound`\n  - 所有声卡驱动位于此处。\n\n### 什么是设备驱动程序？\n\n设备驱动程序最终设计和开发用于控制或操作连接到系统的特定类型硬件。换句话说，设备驱动程序由大量告诉系统如何通信、操作或控制硬件的代码组成。内核使用设备驱动程序来控制或通信硬件，而无需了解硬件的任何细节，例如硬件如何工作。驱动程序使用计算机的总线系统与设备通信，或通过连接硬件的其他通信系统通信。\n\
    \n内核何时调用设备驱动程序？\n\n* 检查设备可用。\n* 处理设备特定的输入/输出调用。\n\n"
- fmt: "\n* To perform user space requests to the `sysconfig` utility.\n* To check\
    \ whether data is ready or not through handling interrupts.\n* To set/reset and\
    \ initialize/reinitialize the device.\n* To perform Input / Output operations\
    \ from user space standard library Input / Output calls.\n\n## Device driver working\
    \ procedure with User Space, Kernel Space and Hardware Space:\n\n* In user space,\
    \ any source program or library are unable to communicate with hardware directly,\
    \ so they make calls to the kernel space source programs.\n* Although kernel has\
    \ the supreme power mode in the system, kernel doesn’t try to access hardware\
    \ directly, rather kernel follow a convention. Kernel uses device driver to communicate\
    \ with hardware.\n* A device driver in kernel space, responsible to communicate\
    \ with the hardware or device, for example, opening the device, reading and writing\
    \ to the device through a bus to peripheral device registers and then closes the\
    \ device.\n* In hardware space, a bus works as a transmission path or communication\
    \ path along with access protocols between the processor and device controller.\
    \ When a device driver reads data from or writes data to the hardware registers\
    \ of a controller, the data travels across the bus.\n* In hardware space, a controller\
    \ works as a physical interface for controlling one or more devices.\n\n## Chapter\
    \ 11: Developing a character device driver with utmost easy explanations\n\n###\
    \ Explanation # 1\nLinux device drivers are divided into several categories: most\
    \ common are block devices, character devices and network devices. Here we will\
    \ learn how to write simple character device.\n\n### Explanation # 2\nThe permission\
    \ bar of block devices something like `brw-rw--`, where “b” stands for block device,\
    \ and character devices has something like `crw-rw--`, where “c” stands for character\
    \ device.\n\n### Explanation # 3\nEvery device driver contains two numbers: major\
    \ number and minor number. The major number is used to distinguish the driver\
    \ and same major number used to indicate that it is controlled by the same driver.\
    \ Using different minor number, multiple device drivers can be created in one\
    \ drive. The major number and minor number, both numbers are being used to determine\
    \ a device driver together. \n\nFor example:\n```\nbrw-rw----  1 root disk 9,\
    \  0 May 17 10:15 sda\n```\n"
