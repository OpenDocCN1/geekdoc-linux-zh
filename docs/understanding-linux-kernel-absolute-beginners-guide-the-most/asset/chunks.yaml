    \ like user interfaces.\n\n## Kernel space vs. Userspace?\n\n`Kernel space` is\
    \ the place where the kernel code stored, it executes here and provides its services.\
    \ On the contrary, `user space` is that set of memory locations where user processes\
    \ run. `Userspace` processes can access `kernel space` routines through system\
    \ calls.\n\n## MicroKernel vs. Monolithic Kernel\n\nThe two most popular types\
    \ of kernels are `microkernel` and `monolithic kernel`. Here we will discuss differences\
    \ between them. First of all, services. Services are kept in separate address\
    \ space in `microkernel` where in `monolithic kernel` services are kept in the\
    \ same address space. If services are crashed, it does not affect `micro kernel`\
    \ core as it runs in separate address space but `monolithic` core crashes. In\
    \ `microkernel`, execute quite slower compared to `monolithic kernel`. `Microkernels`\
    \ are smaller in size compared to `monolithic` ones. Another point, `microkernels`\
    \ are easy to extend.\n\n## Chapter 2: Introduction to Linux Kernel\n\n### Linux\
    \ Kernel\n\n`Linux Kernel` inherits the `Monolithic` type of kernel. This kernel\
    \ was first released by Linus Torvalds in 1991. The `Linux kernel` is a relatively\
    \ small part of the full `Linux System` and it is the core that is responsible\
    \ for how well the system will work. Since 2005, `Linux kernel` uses the `Git`\
    \ source code management system.\n\n### Linux Kernel Developer Community\n\nIf\
    \ you want to write code for `Linux Kernel`, you are welcome; as `Linux kernel`\
    \ is an open-source project. Before getting started you should understand the\
