- fmt: "\n`brw-rw----  1 root disd 9,  1 May 17 10:15 sda1`\n\nHere, the major number\
    \ of `sda` and `sda1` is 9, and minor numbers are different, 0 and 1.\n\n# Explanation\
    \ #4\n\nAny interface under `/dev/xxx` “everything is about file”, so the operation\
    \ of the device driver is actually the operation of the file. The APIs of a device\
    \ driver we can think all about file operations and the device driver is used\
    \ to define/open/read/write etc. functionalities. All file operations are defined\
    \ in the `file_operations` structure of the kernel `<linux/fs.h>` header file.\n\
    \nIn the following device driver example, we will see struct `file_operations`:\n\
    \n```c\nstruct file_operations gpio_fops = {\n    read    : gpio_read,\n    write\
    \   : gpio_write,\n    open    : gpio_open,\n    release : gpio_close,\n    owner\
    \   : GPIO_MODULE\n};\n```\n\nHere, we have declared a structure and assigned\
    \ it to the structure variable `gpio_fops`. The values are function pointers except\
    \ for the `owner`. Then we have used `cdev_add` to register the file operation\
    \ structure with each driver in the init module.\n\n# Developing a tiny GPIO char\
    \ device driver\n\n```c\n#include <linux/kernel.h>\n#include <linux/module.h>\n\
    #include <linux/moduleparam.h>\n#include <linux/init.h>\n#include <linux/stat.h>\n\
    #include <linux/cdev.h>\n#include <linux/device.h>\n#include <linux/fs.h>\n#include\
    \ <linux/slab.h>\n#include <asm/uaccess.h>\n#include <linux/string.h>\n\n// end\
    \ of header include section\n#define DEVICE_MAJOR  200\n#define DEVICE_MINOR \
    \ 0\n#define DEVICE_DEV_COUNT 2\n\n// end of define defition\n\nstatic int gpio_open(struct\
    \ inode *, struct file *);\nstatic ssize_t gpio_read(struct file *, char *, size_t,\
    \ loff_t *);\nstatic ssize_t gpio_write(struct file *, const char *, size_t, loff_t\
    \ *);\nstatic int gpio_close(struct inode *, struct file *);\n\nstruct file_operations\
    \ gpio_fops = {\n    read    : gpio_read,\n    write   : gpio_write,\n    open\
    \    : gpio_open,\n    release : gpio_close,\n    owner   : GPIO_MODULE\n};\n\n\
    struct cdev gpio_cdev;\nstatic char *dev_c_message = NULL;\n\nstatic int entrance(void)\
    \ {\n    // get device number\n    // A device ID is represented using the type\
    \ dev_t.\n    dev_t devno;\n    unsigned int count = DEVICE_DEV_COUNT;\n    int\
    \ err;\n\n    // A device ID consists of two parts: a major ID, identifying the\
    \ class\n    // of the device, and a minor ID, identifying a specific instance\
    \ of a\n    // device in that class. Given major and minor device IDs, makedev()\
    \ combines these to produce\n    // a device ID, returned as the function result.\n\
    \    // The major and minor number are how Linux identifies the underlying hardware\
    \ device associated with a device file.\n    // Most of the cases major number\
    \ identifies the driver while the minor distinguishes the different devices the\
    \ driver controls.\n    devno = MKDEV(DEVICE_MAJOR, DEVICE_MINOR);\n\n    // register_chrdev_region\
    \ function — register a range of device numbers\n    // parameters are (dev_t\
    \ from, unsigned count, const char * name);\n    // from - the first in the desired\
    \ range of device numbers; must include the major number.\n    // count - the\
    \ number of consecutive device numbers required\n    // name - the name of the\
    \ device or driver.\n    register_chrdev_region(devno, count, \"gpiodev\");\n\n\
    \    // cdev_init — initialize a cdev structure\n    cdev_init(&gpio_cdev, &gpio_fops);\n\
    \    gpio_cdev.owner = GPIO_MODULE;\n\n    // cdev_add registers a character device\
    \ with the kernel.\n    // The kernel maintains a list of character devices under\
    \ cdev_map\n    err = cdev_add(&gpio_cdev, devno, count);\n    if (err < 0) {\n\
    \        printk(\"Error: While Adding Device\\n\");\n        return -1;\n    }\n\
    \n    printk(\"TINY GPIO Device Driver.\\n\");\n    printk(\"'mknod /dev/gpiodev_0\
    \ c %d 0'.\\n\", DEVICE_MAJOR);\n    printk(\"'mknod /dev/gpiodev_1 c %d 1'.\\\
    n\", DEVICE_MAJOR);\n\n    // kmalloc is the normal method of allocating memory\
    \ for objects smaller than page size in the kernel.\n    dev_c_message = (char\
    \ *)kmalloc(32, GFP_KERNEL);\n    if (dev_c_message != NULL) {\n        printk(\"\
    kmalloc dev_c_message: 0x%p\", dev_c_message);\n    }\n    return 0;\n}\n// end\
    \ of init section\n\nstatic void out(void) {\n    dev_t devno;\n    printk(\"\
    Bye TINY GPIO Driver\\n\");\n    if (dev_c_message) {\n        // release relevant\
    \ memory\n        kfree(dev_c_message);\n    }\n    // release the tiny char device\n\
    \    devno = MKDEV(DEVICE_MAJOR, DEVICE_MINOR);\n    // unregister_chrdev_region\
    \ — unregister a range of device numbers\n    unregister_chrdev_region(devno,\
    \ DEVICE_DEV_COUNT);\n    // cdev_del - remove a cdev from the system\n    cdev_del(&gpio_cdev);\n\
    }\n// End cleanup section\n\nstatic int gpio_open(struct inode *inode, struct\
    \ file *fil) {\n    int dev_major;\n    int dev_minor;\n    dev_major = MAJOR(inode);\n\
    \    dev_minor = MINOR(inode);\n    printk(\"\\nTINY GPIO DEVICE: OPEN : %d %d\\\
    n\", dev_major, dev_minor);\n    return 0;\n}\n\nstatic int gpio_close(struct\
    \ inode *inode, struct file *fil) {\n    int dev_major;\n    int dev_minor;\n\
    \    dev_major = MAJOR(inode);\n    dev_minor = MINOR(inode);\n    printk(\"\\\
    nTINY GPIO DEVICE: CLOSE : %d %d\\n\", dev_major, dev_minor);\n    return 0;\n\
    }\n\nstatic ssize_t gpio_read(struct file *filp, char *buff, size_t len, loff_t\
    \ *off) {\n    int dev_major;\n    int dev_minor;\n    short count;\n    dev_major\
    \ = MAJOR(filp);\n    dev_minor = MINOR(filp);\n    printk(\"FILE OPERATION READ:%d:%d\\\
    n\", dev_major, dev_minor);\n    switch (minor) {\n        case 0:\n         \
    \   strcpy(dev_c_message, \"DATA FROM minor : 0\");\n            break;\n    \
    \    case 1:\n            strcpy(dev_c_message, \"DATA FROM minor : 1\");\n  \
    \          break;\n        default:\n            len = 0;\n    }\n    // copy_to_user\
    \ — Copy a block of data into user space.\n    // Returns number of bytes that\
    \ could not be copied. On success, this will be zero.\n    count = copy_to_user(buff,\
    \ dev_c_message, len);\n    return 0;\n}\n\nstatic ssize_t gpio_write(struct file\
    \ *filp, const char *buff, size_t len, loff_t *off) {\n    int dev_major;\n  \
    \  int dev_minor;\n    short count;\n    memset(dev_c_message, 0, 32);\n    dev_major\
    \ = MAJOR(filp);\n    dev_minor = MINOR(filp);\n    count = copy_from_user(dev_c_message,\
    \ buff, len);\n    printk(\"FILE OPERATION WRITE:%d:%d\\n\", dev_major, dev_minor);\n\
    \    printk(\"dev_c_message: %s\", dev_c_message);\n    return len;\n}\n\nmodule_init(entrance);\n\
    module_exit(out);\nMODULE_LICENSE(\"BSD\");\nMODULE_DESCRIPTION(\"TINY GPIO Driver\"\
    );\n\n# And Makefile\n```makefile\nobj-m += gpiodriver.o\nall:\n\tmake -C /lib/modules/$(shell\
    \ uname -r)/build M=$(PWD)\nclean:\n\tmake -C /lib/modules/$(shell uname -r)/build\
    \ M=$(PWD) clean\n```\n\nNow, compile the above source code, get `gpiodriver.ko`,\
    \ then sign it, and finally load it into the kernel via `insmod`.\nCheck if it\
    \ is loaded successfully:\n```bash\ninsmod gpiodriver.ko\nlsmod | grep gpiodriver\n\
    cat /proc/devices | grep gpiodriver\ndmesg | tail -10\n```\n\n# Appendix A: Linux\
    \ Kernel Coding Style\n\n### Indentation\nOne of the most important rules, as\
    \ tabs are 8 characters long, so indentations will also be 8 characters long.\
    \ Now, some programmers will claim that having 8-individual indentations makes\
    \ the code move too far to the right, and makes it difficult to examine on an\
    \ 80-individual terminal screen. The solution to that is that if you need extra\
    \ than 3 degrees of indentation, you need to repair your source code. The 8-char\
    \ indents make things simpler to read, and feature the added advantage of caution\
    \ when you’re nesting your functions too deep.\n\n```c\nswitch (test) {\n    case\
    \ '1':\n    case '2':\n        data <<= 2;\n        break;\n    case '3':\n  \
    \  case '4':\n        data <<= 4;\n        break;\n    case '5':\n    case '6':\n\
    \        data <<= 6;\n        break;\n    case '7':\n    case '8':\n        data\
    \ <<= 8;\n        break;\n    case '9':\n    case '10':\n        data <<= 10;\n\
    \        break;\n    default:\n        break;\n}\n```\n\n- In a single line don’t\
    \ do multiple assignments. Kernel coding should be super simple, easier to read,\
    \ and understand.\n- Make your expressions easy to understand.\n- Don’t leave\
    \ whitespace at the end of the line.\n- In a single line don’t put multiple statements.\n\
    \n### Breaking long lines\nIt is strongly preferred that you limit the length\
    \ of lines to 80 columns. Never break this rule. Any statement longer than 80\
    \ columns must be broken into several parts, exceeding 80 columns significantly\
    \ increases the readability of your source code and does not hide any information.\n\
    \n### Placement of spaces\nUse a space after keywords (exceptional keywords those\
    \ look like functions and usually used with parentheses, example `if`, `attribute`,\
    \ `sizeof`, `typeof`). Don’t use spaces inside parenthesized expressions. Use\
    \ a space after these keywords: `case`, `for`, `do`, `while`, `if`, but not with\
    \ `sizeof`.\n\n### Placement of braces\nC styling placement of braces are highly\
    \ suggested.\n```c\nif (input > N) {\n    di = ci * N;\n}\nswitch (input) {\n\
    \    case 1:\n        input = input + 1;\n    case 2:\n        input = input +\
    \ 2;\n    case 3:\n        input = input + 3;\n    default:\n        return input;\n\
    }\n```\nFor `if`, `else`:\n```c\nif (input > N) {\n    input *= N;\n} else if\
    \ (input < N) {\n    input /= N;\n} else {\n    input += N;\n}\n```\n\n### Do\
    \ While Loop\nIn a single statement, do not necessarily use braces.\n```c\nif\
    \ (a > b)\n    a = b * 2;\nif (a > b)\n    do_this();\n```\nBut, while you have\
    \ multiple operations in one statement, then use braces.\n```c\nif (condition)\
    \ {\n    do_this();\n    do_that();\n} else {\n    otherwise();\n}\n```\n\n###\
    \ Naming Local and Global Variables\nC programmers do not use cute name like Pascal\
    \ and Modular-2. While Pascal programmers use `TemporaryCounter`, c programmers\
    \ use `tmp`. Compared to `TemporaryCounter`, `tmp` variable name is easier to\
    \ write and not hard to understand. In C, local variables should be short, easy\
    \ to write, and simple. For example, `tmp` can be any type of variable that holds\
    \ temporary value. For the integer loop counter, you don’t need to use `loop_counter_integer`;\
    \ rather `i` is enough. For global variables, you need to use a descriptive name.\
    \ For example, `count_active_students` are suggested, not `cnt`.\n\n### Functions\n\
    Functions will do just one thing and do that well, and functions name should be\
    \ short and sweet. Include parameter names with their data types in function prototypes;\
    \ it is preferred in Linux although it is not required by the C language. It is\
    \ a pretty simple way to add valuable information for the reader. How many local\
    \ variables should declare in a function? They should not exceed 5~10. If you\
    \ need more variables then, re-think the function and split it into more functions.\
    \ Early research found the working memory cut-off to be seven items, but recent\
    \ research shows that mind’s limit four things at once. This study published in\
    \ the journal Proceedings of the National Academy of Sciences. Functions should\
    \ have one blank line before the next source code (Exceptional: `EXPORT` macro.\
    \ It should follow immediately after the closing function brace line).\n\n```c\n\
    int system_status_check(int){\n    return system_state == SYSTEM_RUNNING;\n}\n\
    EXPORT_SYMBOL(system_status_check);\n```\n\n### Commenting\nComments are good,\
    \ you can tell WHAT your code does, but you should not comment HOW. It is a waste\
    \ of time to explain your badly written code in your comment; rather’s much better\
    \ to write the self-explanatory code. Write comments at the head of the function,\
    \ where you should tell people what the function does. The preferred style for\
    \ long (multi-line) comments is:\n```c\n/** This is the preferred style for multi-line\n\
    * comments in the Linux kernel source code.\n* Please use it consistently.\n*\
    \ Description: This function does this, that,\n* and blah blah blah.\n*/\n```\n\
    The use of comment for data is extremely important, whether the data are basic\
    \ types or derived types. Use just one data declaration per line, don’t use multiple\
    \ data declaration per line. This approach you to provide small comments on each\
    \ item, explaining the data and it’s used.\n\n### Kconfig configuration file\n\
    Indentation is different for all of the Kconfig files through the source tree.\
    \ Lines here under a config definition are indented with one tab, while help text\
    \ put after two additional spaces.\n```config\nconfig AUDIT\n    \"Auditing support\"\
    \n    depends on NE\nThe help text. Blah blah blah.\nAnd crucial / dangerous features\
    \ should be advertised in their prompt string:\nconfig KRFS_FS\n    \"KRFS read\
    \ support (DANGEROUS)\"\n```\n\n### Macros and Enums\nMacro names defining labels\
    \ in enums, constants should be capitalized.\n```c\n#define MAX 999\n```\nMore\
    \ rules regarding macros\n- Macros resembling functions may be named in lower\
    \ case.\n- Macros with multiple statements preferably enclosed in a do-while block.\n\
    - Macros should not affect control flow.\n\n### Printing kernel messages\nMake\
    \ your kernel messages clear, unambiguous, concise, and simple. Kernel messages\
    \ should not have to be period terminated. Make your kernel messages matched with\
    \ the right device and driver, and tagged with the right level (error level, warning\
    \ level, and information level). For example `dev_err()`, `dev_warn()`, `dev_info()`.\
    \ A good debugging message can be a huge help for remote troubleshooting.\n\n\
    ### Memory allocation\nLinux kernel provides a couple of general purpose allocators:\n\
    - `kmalloc()`\n- `kzalloc()`\n- `kmalloc_array()`\n- `kcalloc()`\n- `vmalloc()`\n\
    - `vzalloc()`\nIn these memory allocators, the preferred form of passing a size\
    \ of a struct is the following: `p = kmalloc(sizeof(*p), …)`\n"
