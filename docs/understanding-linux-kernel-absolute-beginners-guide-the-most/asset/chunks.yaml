    task or init task. In such cases kernel panics, instantly halts the system. If
    Oops occurred in another context, another process, then kernel kills the process
    and tries to continue executing..Debugging the kernels issues/bugsDebugging kernel
    space issues are quite harder, a lot harder compared to debugging user space applications
    and libraries. Because on the kernel side, it''s quite time-consuming to reproduce
    the bug or understand the wrong flow of the code or even risky. A minimal mistake
    can shut down the whole system. To debug kernel side issues, you need a better
    understanding of the operating system and kernel.If you can duplicate or reproduce
    the issue or bug, then it becomes pretty easier to solve the problem. Otherwise,
    you have to analyze the source code and need to find the flow of the source code.The
    bug happens inside the kernel due to many reasons. Common traits are, managing
    hardware in the wrong manner, incorrect implementation of source code, for example,
    buffer overrun, etc.Printing for debuggingWhile we debug user space programs we
    use print() or similar method or function. In kernel side, here have a similar
    kind of function names printk()The printk() function has been defined at linux/kernel.h
    library.


    *   The printk() function is quite robust – because it is callable from anywhere.


    *   Also, it can be called at any time; even it can be called simultaneously on
    multiple processors where no need the caller to hold a lock.'
