    \ This part holds the kernels inter-process communications code.\n\n* **modules**\n\
    \    * This part used to hold built modules.\n\n* **fs**\n    * This directory\
    \ contains file system code.\n\n* **kernel**\n    * This directory contains the\
    \ main kernel source code.\n\n* **net**\n    * This directory contains kernel's\
