  trans: "\n-   系统调用\n-   内存管理\n-   网络管理  own 驱动\n-   文件管理 进程管理\n\n| 操作系统包含了用户界面等应用程序。\
    \ |\n\n## 内核空间 vs 用户空间？\n\n`Kernel space`（内核空间）是内核代码存储的地方，它在此处执行并提供服务。相反，`user\
    \ space`（用户空间）是用户进程运行的内存区域。`Userspace`进程可以通过系统调用访问 `kernel space` 例程。\n\n## 微内核\
    \ vs 单体内核\n\n两种最流行的内核类型是 `microkernel`（微内核）和 `monolithic kernel`（单体内核）。我们将讨论它们之间的区别。首先是服务。在\
    \ `microkernel` 中，服务保留在独立的地址空间中，而在 `monolithic kernel` 中，服务保留在同一个地址空间内。如果服务崩溃，不会影响\
    \ `micro kernel` 核心，因为它运行在独立的地址空间中，但 `monolithic` 核心会崩溃。在 `microkernel` 中，执行速度比\
    \ `monolithic kernel` 慢。与 `monolithic` 相比，`Microkernels` 的体积更小。另外一点，`microkernels`\
    \ 易于扩展。\n\n## 第 2 章：Linux 内核简介\n\n### Linux 内核\n\n`Linux Kernel` 继承了 `Monolithic`（单体）类型的内核。该内核由\
    \ Linus Torvalds 于 1991 年首次发布。`Linux kernel` 是整个 `Linux System` 的较小部分，它是负责系统运行良好程度的核心。自\
    \ 2005 以来，`Linux kernel` 使用 `Git` 源码管理系统。\n\n### Linux 内核开发者社区\n\n如果你想为 `Linux\
    \ Kernel` 编写代码，欢迎你；因为 `Linux kernel` 是开源项目。在开始之前，你应该了解技术部分以及 `Linux Kernel Developer\
    \ Community` 是如何工作的。例如，代码冲突如何产生和解决、如何提交进程、`Linux kernel coding style` 等。关于这些及其他内容，你可以在\
    \ `kernel.org` 获得。\n\n`Linux kernel versioning system`![Macintosh HD:Users:mahbub:Desktop:linux-kernel-version-system.png](img/image_rsrc2JD.jpg)\n\
    \n### 开发亮点\n\n自 `4.7` 发布以来，已从 4319 名独立开发者那里合并了 83,000 个变更集。\n\n### 合并的新特性\n\n\
    *   内核内核 `TLS` 支持的加密流卸载。\n*   改进的 `BBR` 拥塞控制方法。\n*   `ARM` 处理器上通过新的 `TEE` 框架实现的可信执行环境。\n\
    *   内核的文档系统现在由 `Sphinx` 支持。\n*   `Statx()` 系统调用现可用。\n\n### Linux 内核源码大小\n\n`Linux\
    \ kernel` 每年添加对新硬件和功能的支持，因此其源码规模增长迅速。在 1991 年的首次发布时，内核源码规模接近 1 万行代码，目前它已经超过了 2200\
    \ 万行代码。\n\n### Linux 内核目录 / 源码结构\n\n从源码树的顶层 `/usr/src/linux` 我们可以看到几个目录：\n\n*\
    \   **arch**\n    *   这部分包含了所有特定架构的内核代码。\n    *   该目录有进一步的子目录，例如对应每个支持架构的 `i386`\
    \ 和 `alpha`。\n\n*   **include**\n    *   该目录包含构建内核源码所需的大多数包含文件。\n    *   它也有对应每个支持架构的子目录。\n\
    \n*   **init**\n    *   这部分包含了内核的初始化代码。\n    *   该目录对于需要了解内核工作的开发者来说是一个非常重要的地方。\n\
    \n*   **mm**\n    *   这部分持有所有与内存管理相关的代码。\n\n*   **drivers**\n    *   该目录包含了所有的设备驱动程序。\n\
    \    *   它们进一步细分为设备驱动程序类，例如块设备驱动、字符设备驱动、网络驱动。\n\n*   **ipc**\n    *   这部分持有内核的进程间通信代码。\n\
    \n*   **modules**\n    *   这部分曾用于持有构建好的模块。\n\n*   **fs**\n    *   该目录包含文件系统代码。\n\
    \n*   **kernel**\n    *   该目录包含主内核源码。\n\n*   **net**\n    *   该目录包含内核的网络代码。\n\n\
    *   **lib**\n    *   这部分持有内核的库代码。\n\n*   **scripts**\n    *   这部分持有了在配置内核时使用的脚本。\n\
    \n## 谁在赞助这项工作？\n\n根据报告，以下是聘用内核：\n\n![Macintosh HD:Users:mahbub:Desktop:linux-kernel.png](img/image_rsrc2JE.jpg)\n\
    \n### 检查 Linux 内核版本\n\n有时你可能需要检查当前版本，然后运行 `uname -r`\n\n## 第 3 章：编译 Linux 内核\n\
    \n### Linux 内核源码树\n\n`kernel.org` 托管所有的源码![Macintosh HD:Users:mahbub:Desktop:linux-kernel.png](img/image_rsrc2JG.jpg)\n\
    \n该网站是不自明的。你可以下载源码。你也可以利用命令行 `wget` 或 `curl` 下载源码。\n\n```bash\nmkdir kernel\n\
    cd kernel\nwget [url]\ntar -xzf [filename.tar.gz]\n```\n\n### 编译 Linux 内核的工具\n\
    \n1.  **编译器**\n2.  **链接器**\n3.  **Make**\n\n**编译器**：有几种编译器可用，如 `gcc`、`clang`、`Visual\
    \ C++`、`Turbo C` 等。但编译 Linux 内核必须使用 `gcc` C 编译器。为什么呢？因为内核的大部分是用 C 语言编写的，极小部分是用汇编编写的。`gcc`\
    \ C 编译器能够编译 C 源码。\n\n**链接器**：对于链接和汇编源码还需要另一个工具，即 `GNU binary utilities`，简称 `binutils`。`binutils`\
    \ 是创建和管理二进制文件、对象文件、分析数据的工具集。\n\n**Make**：编译内核的另一个重要工具是 `make`；它检查源码并寻找需要编译的文件。\n\
    \n## 第 4 章：理解系统调用接口\n\n### 系统调用接口简介\n\n系统调用接口在内核空间和用户空间之间提供了一个层。这一层为用户空间进程执行内核例程。简单来说，系统调用只是用户空间对内核函数或服务的请求![Macintosh\
    \ HD:Users:mahbub:Desktop:system-call-interface.png](img/image_rsrc2JF.jpg)\n\n\
    ### Syscalls / 系统调用\n\nSyscalls / 系统调用通过函数调用访问。通常这些函数调用定义在 C 库中。系统调用接受各种参数（从零到多个）作为输入，返回一个值并执行一个或多个任务。理想情况下，系统调用应该只有一个目的。\n\
    \n### 系统调用号\n\n每个系统调用都被分配了一个唯一的 32 位系统数；并用于引用特定的系统调用。Linux 内核维护一个名为 `sys-call-table`\
    \ 的表来存储所有注册的系统调用。\n\n### 系统调用参数\n\n在调用系统调用时，可能需要传递传递参数。在这里，参数存储在寄存器中。在 x86-32\
    \ 位系统中，寄存器为 `ebx`、`ecx`、`edx`、`esi` 和 `edi`。但当需要传递超过 5 个参数时，会使用单个寄存器持有指向存储所有参数的用户空间的指针。返回值也通过寄存器发送到用户空间。\n\
    \n### 系统调优点\n\n系统调用接口方法有两个优点。例如，\n"
- fmt: "\n## Advantages of System Call\n\n- **Secured**: If userspace processes/programs\
    \ could directly read and write to the kernels address space, system security\
    \ will be nullified. Userspace functions have limited access to the resources/hardware\
    \ of the system due to implementation of system call.\n- **Faster performance**:\
    \ System call interface provides a faster performance to the system.\n- **Portability**:\
    \ System call interface makes user space application more portable. Due to any\
    \ change in the kernel side, userspace programs don’t need to change.\n- **Easier\
    \ Implementation**: System call interface makes user space application development\
    \ easier; here they do not need to think about low-level functionality of the\
    \ system.\n\n## Disadvantages of System Call\n\nTo develop or implement a new\
    \ system call, it needs to have a unique system call number officially assigned\
    \ to you. More pain points, all architecture needs to separately register the\
    \ system call. So, if you want to implement a simple task, then system call is\
    \ pretty time consuming and the maintenance quite complex.\n\n## Creating a basic\
    \ system call for the Linux kernel\n\nAt first, switch to the compiled source\
    \ directory of Linux kernel. \n\n```bash\n$ cd linux-x.x.x/\n```\n\nCreate a directory\
    \ hellosys and move into it.\n\n```bash\n$ mkdir hellosys\n$ cd hellosys\n```\n\
    \nCreate a new C file in this dir,\n\n```bash\n$ vi hellosys.c\n```\n\nAdd following\
    \ codes here:\n\n```c\n#include <linux/kernel.h>\nasmlinkage long sys_hellosys(void)\
    \ {\n    printk(\"Hello New System Call!\\n\");\n    return 0;\n}\n```\n\nNow\
    \ create a `Makefile` in the same dir, along with the following contents:\n\n\
    ```makefile\nmod_sign_cmd = scripts/sign-file $(CONFIG_MODULE_SIG_HASH) \\$(MODULE_SIG_KEY_SRCPREFIX)\n\
    else\nmod_sign_cmd = true\nendif\nexport mod_sign_cmd\nifeq ( $(KBUILD_EXTMOD),)\n\
    core-y += kernel/certs/mm/fs/ipc/security/crypto/block/hellosys/\nvmlinux-dirs\
    \ := $(patsubst %/, %, $(filter %/, $(init-y) $(init-m) \\$(core-y) $(core-m)\
    \ $(drivers-y) $(drivers-m) \\$(net-y) $(net-m) $(libs-y) $(libs-m) $(virt-y)))\n\
    vmlinux-alldirs := $(sort $(vmlinux-dirs) $(patsubst %/, %, $(filter %/, \\$(init-)\
    \ $(core-) $(drivers-) $(net-) $(libs-) $(virst-))))\n```\n\nnow, compile and\
    \ run `Makefile`.\n\n```bash\n$ make\n```\n\n### Add the new system call into\
    \ the System Call Table\n\nA table named for 32 bit system is `syscall.tbl` and\
    \ in 64 bit systems `syscall_64.tbl` file. I edit the table by `nano arch/x86/entry/syscalls/syscall_64.tbl`\
    \ and scroll down till I find the number of the last system call before those\
    \ starting from 512.\n\nIn my case, that’s `331`. So new system call’s number\
    \ would be `332`. Now add the following line after the 331st system call.\n\n\
    ```\n332 64 hellosys sys_hellosys\n```\n\n### Add the new System Call in the System\
    \ Call Header file\n\nNow edit `include/linux/syscall.h` and add the following\
    \ line at the end of the file before `#endif` statement.\n\n```c\nasmlinkage long\
    \ sys_hellosys(void);\n```\n\n### Recompile the kernel\n\n```bash\n$ make –j4\
    \ modules_install install\n```\n\n### Test the System Call\n\nCreate a C program\
    \ in your userspace, for example, in home directory, and add the following lines:\n\
    \n```bash\n$ vi testhellosys.c\n```\n\n```c\n#include <stdio.h>\n#include <linux/kernel.h>\n\
    #include <sys/syscall.h>\n#include <unistd.h>\nint main() {\n    long int syscallnumber\
    \ = syscall(329);\n    printf(\"System call sys_hellosys returned %ld\\n\", syscallnumber);\n\
    \    return 0;\n}\n```\n\nNow compile the source code and run. It will print something\
    \ like 0, if something wrong then it will print -1. If printed -1 then we need\
    \ to go back and check, debug and try again. Now if we check the kernel log through\
    \ `dmesg`, then something like `Hello New System Call` will be printed.\n\n##\
    \ Chapter 5: Understanding Kernel Module\n\n### What is Kernel Module?\n\nTo add\
    \ some functionality to the Linux kernel needs a long and tiresome approach. At\
    \ first, need to add source file in the kernel source tree. Then compile the kernel.\
    \ If there is no compile error, then build the kernel. If no build error happens,\
    \ then reboot the machine to get effected result. To add some functionality to\
    \ the Linux kernel needs a long and tiresome approach. At first, need to add source\
    \ file in the kernel source tree. Then compile the kernel. If there is no compile\
    \ error, then build the kernel. If no build error happens, then reboot the machine\
    \ to get effected result.\n\nLoadable Module is a small piece of software that\
    \ can be added or removed into the kernel without the need to reboot.\n\n### Advantages\
    \ of Loadable Kernel Module\n\nLoadable Kernel Modules are not wasters. They save\
    \ a lot of time. Due to Loadable Module approach Linux kernel is still small and\
    \ easier to maintain.\n\n### Disadvantages of Loadable Module\n\nTo add some functionality\
    \ to the Linux kernel needs a long and tiresome approach. At first, need to add\
    \ source file in the kernel source tree. Then compile the kernel. If there is\
    \ no compile error, then build the kernel. If no build error happens, then reboot\
    \ the machine to get effected result\n\n### Security concern of Loadable Module\n\
    \nSeveral LKM security issue arises. For example, Sangram Gayal explains the Linux\
    \ privileged process Hijacking Vulnerability. Rainer Winchmann provides analysis\
    \ on Linux Kernel Rootkit.\n\n### How to minimize these security risks\n\n- Buffer\
    \ overrun is one of the most common sources of security risks in LKM. Proper use\
    \ of buffer overrun will minimize this risk\n- Proper input filtering\n- Proper\
    \ checking of memory initialization and de-initialization\n- Enforcing signed\
    \ modules: LKMs have full access to a low level and critical kernel space resources,\
    \ sticking with the signed module option will make the utmost safety\n\n Chapter\
    \ 6: Before starting to write the Loadable Kernel Module\n\n### Things to learn\n\
    \nWhat you have learned to write user-space C programming on unix platforms? You\
    \ tried to work with file read-write, playing with memory through `malloc`. To\
    \ implement concurrency you worked with `pthread`.\n\nWhile you want to work with\
    \ Linux kernel, you may need to work with memory things for kernel side like `kmalloc`,\
    \ do list operations through list libraries and others.\n\n### Resources to learn\
    \ kernel programming\n\nAlthough the book will help you to start, your main and\
    \ utmost resource will be the source code at `kernel.org`. Don’t be panic, just\
    \ take time; do something practical projects which will help you most. Go through\
    \ the mailing lists, follow those lists, try to understand what’s going on.\n\n\
    ## Chapter 7: Writing Loadable Kernel Module\n\n### Write a simple Loadable Kernel\
    \ Module\n\nWriting Loadable Kernel Module (LKM) is pretty simple. Every LKM must\
    \ have at least two functions:\n\n1. Startup function\n2. End Function\n"
