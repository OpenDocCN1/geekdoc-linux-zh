    \ modinfo program shows information about a Linux kernel module. It shows the\
    \ following information regarding each module:\n\n1.  Module author\n\n2.  License\n\
    \n3.  Parameters\n\n4.  Dependencies\n\n5.  Module description\n\n6.  Full path\
    \ of the module along with the file name\n\nlsmodThe lsmod program shows the kernel\
    \ modules currently loaded by Linux system or Linux kernel system. It shows these\
    \ data or contents by analyzing /proc/modules.The lsmod program shows the following\
    \ information:\n\n1.  Name of the module\n\n2.  Size of the module in byte, not\
    \ how much memory used in kernel.\n\n3.  Each module use count and a list of referring\
    \ modules.\n\nmodprobeThe modprobe program adds or removes a module from the Linux\
    \ kernel. It looks at the modules directory /lib/modules for all the modules.\
    \ The modprobe program expects the up-to-date module.dep file which is generated\
    \ by depmod.How it works? Just call$ modproble module_1This command loads module_1\
    \ in kernel.How kmod works?What happens while Linux kernel tries to access certain\
    \ modules or resources but gets those resources unavailable? Does kernel return\
    \ an error instantly? No. Instantly kernel does not return any error rather, calls\
    \ kmod. While kernel calls kmod, it tries to load dependent modules and tries\
    \ to make the resources available.If kmod gets success, then no problem, the Linux\
    \ kernel continues working. But if kmod fails, then Linux kernel returns an error.The\
    \ beautiful thing is, any kernel space programs can request to load any LKMs by\
    \ calling kmod. But to use kmod, programmers need to include <linux/kmod.h> in\
