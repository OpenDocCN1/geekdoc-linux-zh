  trans: "\n在主目录下创建一个名为“LKM”的目录，然后在 `LKM` 目录内创建 `hellolkm.c`。\n\n```bash\ncd ~\nmkdir\
    \ LKM\ncd LKM\n```\n\n```c\n#include <linux/kernel.h>\n#include <linux/module.h>\n\
    //// end of header include section\n#define __KERNEL__\n#define MODULE\n#define\
    \ LINUX\n//// end of macro define section\nint init_module(void){\n  printk(KERN_DEBUG\
    \ “Hello LKM”);\n  return 0;\n}\n//// end of init section\nvoid cleanup_module\
    \ (void){\n  printk(KERN_DEBUG “Goodbye LKM”);\n}\n//// End of cleanup section\n\
    MODULE_LICENSE (“BSD”);\n//// End of module licensing section\n```\n\n在头文件包含部分，包含了\
    \ `kernel.h` 用于 `printk()` 函数，包含了 `module.h` 用于将模块动态加载到内核中。在宏定义部分，添加了宏 `__KERNEL__`\
    \ 以向用户空间程序隐藏内核源源程序。\n\n我使用了函数 `init_module()`，它作为初始化函数工作。它在控制台中打印 Hello LKM，并使用了\
    \ `KERN_DEBUG` 宏。要理解 `KERN_DEBUG` 选项，请查看调试章节。然后我使用了函数 `cleanup_module()`，它作为模块的清理或结束函数工作。最后，使用\
    \ `MODULE_LICENSE` 宏来提供此模块的许可信息。\n\n### Makefile\n\n现在我将创建一个 makefile 来构建此模块。\n\
    \n```makefile\nobj-m = helloLKM.o\nKERNELDIR := /lib/module\nWORKINGDIR := $(shell\
    \ pwd)\nall: make -c $(KERNELDIR) M=$(WORKINGDIR)\nclean:\n```\nkernel 目录是内核源码所在的目录。我使用了\
    \ `shell uname –r`，它会递归搜索并获取当前内核的。`make -c $(KERNELDIR) “make”` 会构建源码时切换到该目录，并在完成后返回此目录。`M\
    \ = $(WORKINGDIR)` 使用模块所在的工作目录路径。这里 `WORKINGDIR := $(shell pwd)` 表示当前目录的绝对路径。最后，`clean`\
    \ 标签将移除所有生成的文件。\n\n现在我将编译、构建并运行该模块。\n\n首先，编译：\n```bash\nmake\n```\n此命令将在工作目录下创建模块\
    \ `helloLKM.ko`。要查看 `helloLKM.ko` 的信息：\n\n```bash\nmodinfo helloLKM.ko\n```\n\n\
    现在，我可以加载此模块，但要做到这一点，我需要将用户优先级更改为超级用户。然后我可以使用 `insmod` 或 `modprobe` 命令加载模块。\n\n\
    ```bash\nsu\ninsmod helloLKM.ko\nsu\nmodprobe helloLKM.ko\n```\n\n要检查模块是否加载成功，我可以检查此日志。\n\
    \n```bash\ndmesg | tail-1\nHello LKM\n```\n\n你可以卸载该模块：\n\n```bash\nrmmod helloLKM\n\
    modprobe –r helloLKM\n```\n\n要检查是否卸载完美，请使用 `dmesg` 检查：\n\n```bash\ndmesg | tail-1\n\
    Goodbye LKM\n```\n\n### 初始化与清理宏\n\n在内核 2.4 版本之前，强制使用 `init_module()` 进行模块初始化并使用\
    \ `cleanup_module()` 进行清理。但从内核 2.4 版本开始，允许使用任何名称，我们需要使用额外的宏，以便系统理解哪一个用于初始化，哪一个用于清理。\n\
    \n```c\nstatic int entrance()\nstatic int out()\nmodule __init (entrance);\nmodule\
    \ __exit(out);\n```\n\n你可以在函数名之前使用 `__init()` 和 `__exit()` 宏。\n\n```c\n#include\
    \ <linux/kernel.h>\n#include <linux/module.h>\n//// end of header include section\n\
    #define __KERNEL__\n#define MODULE\n#define LINUX\n//// end of macro define section\n\
    static int entrance(void){\n  printk(KERN_DEBUG “Hello LKM”);\n  return 0;\n}\n\
    //// end of init section\nstatic int out(void){\n  printk(KERN_DEBUG “Goodbye\
    \ LKM”);\n}\n//// End of cleanup section\nmodule __init (entrance);\nmodule __exit(out);\n\
    MODULE_LICENSE (“BSD”);\n//// End of module licensing section\n```\n\n### 其他宏\n\
    \n你也可以使用其他宏如 `MODULE_DESCRIPTION`、`MODULE_AUTHOR`，这些对于理解模块用途以及编写者非常有帮助。\n\n```c\n\
    MODULE_AUTHOR (“Your Name”);\nMODULE_DESCRIPTION (“This is test module”);\n```\n\
    \n例如：\n\n```c\n#include <linux/kernel.h>\n#include <linux/module.h>\n//// end\
    \ of header include section\n#define __KERNEL__\n#define MODULE\n#define LINUX\n\
    //// end of macro define section\nstatic int __init entrance (void){\n  printk(KERN_DEBUG\
    \ “Hello LKM\\n”);\n  return 0;\n}\nstatic void __exit out (void){\n  printk(KERN_DEBUG\
    \ “Goodbye LKM\\n”);\n}\nmodule __init (entrance);\nmodule __exit(out);\nMODULE_AUTHOR\
    \ (“Md Mahbubur Rahman”);\nMODULE_LICENSE (“BSD”);\n//// End of module licensing\
    \ section\n```\n\n`__init` 宏定义引用的函数在初始化后不再需要。内核在初始化后从内存中释放它，`__exit` 宏用于移除。\n\n\
    ### LKM 中的命令行参数\n\n为了获取命令行参数，LKM 需要使用 `MODULE_PARAM()` 宏，且变量应该被定义为全局。`MODULE_PARAM()`\
    \ 宏接受两个参数：变量名和变量类型。另一个相关的宏 `MODULE_PARAM_DESC()` 用于记录模块参数说明。它接受两个参数：变量名和变量描述。\n\
    \n**命令行参数中支持的数据类型：**\n\n* Bool\n* Byte（单字节）\n* 字符指针\n* 数组\n* Short int\n* Unsigned\
    \ short int\n* Int\n* Unsigned int\n* Long int\n* Unsigned long int\n"
- fmt: "\n# Example of command-line arguments in LKMs with Integer\n\n```c\n#include\
    \ <linux/kernel.h>\n#include <linux/init.h>\n#include <linux/stat.h>\n#include\
    \ <linux/module.h>\n#include <linux/moduleparam.h>\n#define __KERNEL__\n#define\
    \ LINUX\n#define MODULE\n//// end of macro define section\nstatic int input =\
    \ 5; // variable should have initial default value\nMODULE_PARAM (input, int);\n\
    MODULE_PARM_DESC(input, \"An integer\");\nstatic init __init entrance (void){\n\
    \tint square_val = input * input;\n\tprintk(KERN_DEBUG “Square value of input\
    \ = %i\\n”, square_val);\n}\nstatic void __exit out (void){\n\tprintk(KERN_DEBUG\
    \ “Goodbye LKM\\n”);\n}\nmodule __init (entrance);\nmodule __exit(out);\nMODULE_AUTHOR(\"\
    Md Mahbubur Rahman\");\nMODULE_LICENSE (“BSD”);\n//// End of module licensing\
    \ section \n```\n\n# Example of command-line arguments in LKMs with Short Integer,\
    \ Integer and Long Integer\n\n```c\n#include <linux/kernel.h>\n#include <linux/init.h>\n\
    #include <linux/stat.h>\n#include <linux/module.h>\n#include <linux/moduleparam.h>\n\
    #define __KERNEL__\n#define LINUX\n#define MODULE\n//// end of macro define section\n\
    static short int shortInt = 1;\nstatic int vInt = 111;\nstatic long int longInt\
    \ = 5555;\n//// end of declaration of command line argument\nMODULE_PARAM(shortInt,\
    \ short);\nMODULE_PARM_DESC(shortInt, \"A short integer\");\nMODULE_PARAM(vInt,\
    \ int);\nMODULE_PARM_DESC(vInt, \"An integer\");\nMODULE_PARAM(longInt, long);\n\
    MODULE_PARM_DESC(longInt, \"A long integer\");\nstatic int __init entrance(void){\n\
    \tint i;\n\tprintk(KERN_INFO \"Hello LKM =============\\n\");\n\tprintk(KERN_INFO\
    \ \"myshort is a short integer: %hd\\n\", shortInt);\n\tprintk(KERN_INFO \"vInt\
    \ is an integer: %d\\n\", vInt);\n\tprintk(KERN_INFO \"longInt is a long integer:\
    \ %ld\\n\", longInt);\n\treturn 0;\n}\n//// end of init section\nstatic void __exit\
    \ out(void){\n\tprintk(KERN_INFO \"Goodbye LKM\\n\");\n}\n//// End of cleanup\
    \ section\nmodule __init (entrance);\nmodule __exit(out);\nMODULE_AUTHOR(\"Md\
    \ Mahbubur Rahman\");\nMODULE_LICENSE (“BSD”);\n//// End of module licensing section\
    \ \n```\n\n# Example of command-line arguments in LKMs with String\n\n```c\n#include\
    \ <linux/kernel.h>\n#include <linux/init.h>\n#include <linux/stat.h>\n#include\
    \ <linux/module.h>\n#include <linux/moduleparam.h>\n#define __KERNEL__\n#define\
    \ LINUX\n#define MODULE\n//// end of macro define section\nstatic char *stringVar\
    \ = \"hello\";\n//// end of declaration of command line argument\nMODULE_PARAM(stringVar,\
    \ charp);\nMODULE_PARM_DESC(stringVar, \"A character string\");\n//// end of adding\
    \ module_param along with type to every variable\nstatic int __init entrance(void){\n\
    \tint i;\n\tprintk(KERN_INFO \"mystring is a string: %s\\n\", stringVar);\n\t\
    return 0;\n}\n//// end of init section\nstatic void __exit out(void){\n\tprintk(KERN_INFO\
    \ \"Goodbye LKM\\n\");\n}\n//// End of cleanup section\nmodule __init (entrance);\n\
    module __exit(out);\nMODULE_AUTHOR(\"Md Mahbubur Rahman\");\nMODULE_LICENSE (“BSD”);\n\
    //// End of module licensing section \n```\n\n# Example of command-line arguments\
    \ in LKMs with Array\n\n```c\n#include <linux/kernel.h>\n#include <linux/init.h>\n\
    #include <linux/stat.h>\n#include <linux/module.h>\n#include <linux/moduleparam.h>\n\
    #define __KERNEL__\n#define LINUX\n#define MODULE\n//// end of macro define section\n\
    static int intArray[3] = { 1, 2, 3 };\nstatic int arrayArgc = 0;\n//// end of\
    \ declaration of command line argument\nMODULE_PARAM_ARRAY(intArray, int, arrayArgc,\
    \ 1111);\nMODULE_PARM_DESC(intArray, \"An array of integers\");\n//// end of adding\
    \ module_param along with type to every variable\nstatic int __init entrance(void){\n\
    \tint i;\n\tfor (i = 0; i < (sizeof intArray / sizeof (int)); i++)\n\t{\n\t\t\
    printk(KERN_INFO \" intArray[%d] = %d\\n\", i, intArray[i]);\n\t}\n\tprintk(KERN_INFO\
    \ \"got %d arguments for intArray.\\n\", arrayArgc);\n\treturn 0;\n}\n//// end\
    \ of init section\nstatic void __exit out(void){\n\tprintk(KERN_INFO \"Goodbye\
    \ LKM\\n\");\n}\n//// End of cleanup section\nmodule __init (entrance);\nmodule\
    \ __exit(out);\nMODULE_AUTHOR(\"Md Mahbubur Rahman\");\nMODULE_LICENSE (“BSD”);\n\
    //// End of module licensing section \n```\n\n# Loading LKMs while the system\
    \ starts\n\nSeveral times we need that LKMs should be started while the system\
    \ starts, means at boot time. To load modules at boot time file `/etc/modules`\
    \ are being used; it holds kernel module names that are needed to start when the\
    \ system starts.\n\nBefore editing this file we will create a directory inside\
    \ kernels driver directory, then copy that module here, and then add module name\
    \ in `/etc/modules` file.\n\n# Module spanning more than one file\n\nThere may\
    \ be some scenarios when we may need to break the source code of our module into\
    \ several parts, files.\n\n`modulestart.c`\n\n```c\n#include <linux/kernel.h>\n\
    #include <linux/init.h>\n#include <linux/stat.h>\n#include <linux/module.h>\n\
    #include <linux/moduleparam.h>\n#define __KERNEL__\n#define LINUX\n#define MODULE\n\
    //// end of macro define section\nstatic int input = 5; // variable should have\
    \ initial default value\nMODULE_PARAM (input, int);\nMODULE_PARM_DESC(input, \"\
    An integer\");\nstatic init __init entrance (void){\n\tint square_val = input\
    \ * input;\n\tprintk(KERN_DEBUG “Square value of input = %i\\n”, square_val);\n\
    }\nstatic void __exit out (void){\n\tprintk(KERN_DEBUG “Goodbye LKM\\n”);\n}\n\
    module __init (entrance);\nmodule __exit(out);\nMODULE_AUTHOR(\"Md Mahbubur Rahman\"\
    );\nMODULE_LICENSE (“BSD”);\n//// End of module licensing section \n```\n\n`modulestop.c`\n\
    \n```c\n#include <linux/kernel.h>\n#include <linux/init.h>\n#include <linux/stat.h>\n\
    #include <linux/module.h>\n#include <linux/moduleparam.h>\n#define __KERNEL__\n\
    #define LINUX\n#define MODULE\n//// end of macro define section\nstatic short\
    \ int shortInt = 1;\nstatic int vInt = 111;\nstatic long int longInt = 5555;\n\
    //// end of declaration of command line argument\nMODULE_PARAM(shortInt, short);\n\
    MODULE_PARM_DESC(shortInt, \"A short integer\");\nMODULE_PARAM(vInt, int);\nMODULE_PARM_DESC(vInt,\
    \ \"An integer\");\nMODULE_PARAM(longInt, long);\nMODULE_PARM_DESC(longInt, \"\
    A long integer\");\nstatic int __init entrance(void){\n\tint i;\n\tprintk(KERN_INFO\
    \ \"Hello LKM =============\\n\");\n\tprintk(KERN_INFO \"myshort is a short integer:\
    \ %hd\\n\", shortInt);\n\tprintk(KERN_INFO \"vInt is an integer: %d\\n\", vInt);\n\
    \tprintk(KERN_INFO \"longInt is a long integer: %ld\\n\", longInt);\n\treturn\
    \ 0;\n}\n//// end of init section\nstatic void __exit out(void){\n\tprintk(KERN_INFO\
    \ \"Goodbye LKM\\n\");\n}\n//// End of cleanup section\nmodule __init (entrance);\n\
    module __exit(out);\nMODULE_AUTHOR(\"Md Mahbubur Rahman\");\nMODULE_LICENSE (“BSD”);\n\
    //// End of module licensing section \n```\n\n# Chapter 8: Kernel Debugging\n\n\
    ## Oops?\nIn our conversation, when we utter “Oops”? When something bad happened,\
    \ right?Kernel issues an Oops while something bad happened. Oops, the process\
    \ involves several steps:\n\n*   Step 1: Print error message\n*   Step 2: Dumps\
    \ contents of register\n*   Step 3: Outputs a backtrace\n\nNote: What is Backtrace?\n\
    You can say a backtrace is a list of the function call, especially those are active\
    \ currently in a thread. The common or usual way of inspecting a backtrace of\
    \ a program is to use outside or external debuggers. But in many cases, it is\
    \ useful to obtain backtrace programmatically from within a program.While an Oops\
    \ occurs, the kernel tries to resolve the issue and try to resume control of the\
    \ system. But the kernel is not always lucky to resume control of the system.\
    \ In several aspects/scenarios kernel cannot control the system for example, when\
    \ Oops occurred in the interrupt context or in the idle task or init task. In\
    \ such cases kernel panics, instantly halts the system. If Oops occurred in another\
    \ context, another process, then kernel kills the process and tries to continue\
    \ executing..\n\n## Debugging the kernels issues/\nDebugging kernel space issues\
    \ are quite harder, a lot harder compared to debugging user space applications\
    \ and libraries. Because on the kernel side, it's quite time-consuming to reproduce\
    \ the bug or understand the wrong flow of the code or even risky. A minimal mistake\
    \ can shut down the whole system. To debug kernel side issues, you need a better\
    \ understanding of the operating system and kernel.If you can duplicate or reproduce\
    \ the issue or bug, then it becomes pretty easier to solve the problem. Otherwise,\
    \ you have to analyze the source code and need to find the flow of the source\
    \ code.The bug happens inside the kernel due to many reasons. Common traits are,\
    \ managing hardware in the wrong manner, incorrect implementation of source code,\
    \ for example, buffer overrun, etc.\n\nSimilar kind of function names `printk()`The\
    \ `printk()` function has been defined at `linux/kernel.h` library.\n\n*   The\
    \ `printk()` function is quite robust – because it is callable from anywhere.\n\
    *   Also, it can be called at any time; even it can be called simultaneously on\
    \ multiple processors where no need the caller to hold a lock.\n"
