  trans: "\n\n## 系统调用的优点\n\n- **安全性**：如果用户态进程/程序能够直接读写内核地址空间，那么系统的安全性将将化为乌有。由于系统调用的实现，用户态函数对系统资源/硬件的访问受到限制。\n\
    - **性能更高**：系统调用接口为系统提供了更快的性能。\n- **可移植性**：系统调用接口使得用户空间应用程序更具移植性。由于内核端的任何变化，用户态程序都不需要更改。\n\
    - **更易实现**：系统调用接口使得用户空间应用程序开发变得容易；在这里，它们不需要考虑系统的底层功能。\n\n## 系统调用的缺点\n\n要开发或实现一个新的系统调用，需要官方分配给你一个唯一的系统调用号。更多的痛点在于，所有的架构都需要单独注册该系统调用。因此，如果你想实现一个简单的任务，系统调用会非常耗时，而且维护起来相当复杂。\n\
    \n## 为 Linux 内核创建一个基础系统调用\n\n首先，切换到 Linux 内核编译后的源码目录。\n\n```bash\n$ cd linux-x.x.x/\n\
    ```\n\n创建一个名为 `hellosys` 的目录并进入该目录。\n\n```bash\n$ mkdir hellosys\n$ cd hellosys\n\
    ```\n\n在此目录下创建一个新的 C 文件，\n\n```bash\n$ vi hellosys.c\n```\n\n在此处添加以下代码：\n\n```c\n\
    #include <linux/kernel.h>\nasmlinkage long sys_hellosys(void) {\n    printk(\"\
    Hello New System Call!\\n\");\n    return 0;\n}\n```\n\n现在在同一目录下创建一个 `Makefile`，内容如下：\n\
    \n```makefile\nmod_sign_cmd = scripts/sign-file $(CONFIG_MODULE_SIG_HASH) \\$(MODULE_SIG_KEY_SRCPREFIX)\n\
    else\nmod_sign_cmd = true\nendif\nexport mod_sign_cmd\nifeq ( $(KBUILD_EXTMOD),)\n\
    core-y += kernel/certs/mm/fs/ipc/security/crypto/block/hellosys/\nvmlinux-dirs\
    \ := $(patsubst %/, %, $(filter %/, $(init-y) $(init-m) \\$(core-y) $(core-m)\
    \ $(drivers-y) $(drivers-m) \\$(net-y) $(net-m) $(libs-y) $(libs-m) $(virt-y)))\n\
    vmlinux-alldirs := $(sort $(vmlinux-dirs) $(patsubst %/, %, $(filter %/, \\$(init-)\
    \ $(core-) $(drivers-) $(net-) $(libs-) $(virst-))))\n```\n\n现在，编译并运行 `Makefile`。\n\
    \n```bash\n$ make\n```\n\n### 将新系统调用加入系统调用表\n\n在名为 `syscall_table_64.tbl`（注：根据架构可能不同）的表格中添加条目。\n\
    \n*(注：由于原文文本在此处不完整，后续内容根据您提供的文本逻辑进行翻译)*\n\n"
- fmt: "\nCreate a directory called “LKM” inside home directory and then create `hellolkm.c`\
    \ inside the `LKM` directory.\n\n```bash\ncd ~\nmkdir LKM\ncd LKM\n```\n\n```c\n\
    #include <linux/kernel.h>\n#include <linux/module.h>\n//// end of header include\
    \ section\n#define __KERNEL__\n#define MODULE\n#define LINUX\n//// end of macro\
    \ define section\nint init_module(void){\n  printk(KERN_DEBUG “Hello LKM”);\n\
    \  return 0;\n}\n//// end of init section\nvoid cleanup_module (void){\n  printk(KERN_DEBUG\
    \ “Goodbye LKM”);\n}\n//// End of cleanup section\nMODULE_LICENSE (“BSD”);\n////\
    \ End of module licensing section\n```\n\nIn header include section, `kernel.h`\
    \ included for `printk()` function and `module.h` included to load module into\
    \ kernel dynamically. In the macro add section, macro `__KERNEL__` added to hide\
    \ kernel source programs from user space programs.\n\nI have used function `init_module()`,\
    \ which works as an initialization function. It prints Hello LKM in the console\
    \ and `KERN_DEBUG` macro used. To understand `KERN_DEBUG` option, please check\
    \ the debugging chapter. Then I have used function `cleanup_module()`, which works\
    \ as a cleanup or end function of a module. At the end, `MODULE_LICENSE` macro\
    \ used to provide licensing information of this module.\n\n### Makefile\n\nNow\
    \ I will create a makefile to build this module.\n\n```makefile\nobj-m = helloLKM.o\n\
    KERNELDIR := /lib/module\nWORKINGDIR := $(shell pwd)\nall: make -c $(KERNELDIR)\
    \ M=$(WORKINGDIR)\nclean:\nkernel directory is the directory of the kernel source.\
    \ I have used `shell uname –r` which search recursively and gets the name of current\
    \ kernel. The `make -c $(KERNELDIR) “make”` will change this directory while building\
    \ source code and move back to this directory while build finished. `M = $(WORKINGDIR)`\
    \ uses the path of the working directory where the module is located. Here, `WORKINGDIR\
    \ := $(shell pwd)` which means absolute path of current directory. And, finally,\
    \ the `clean` tag which will remove all the generated files.\n\nNow I will compile,\
    \ build and run the module.\n\nAt first, compile:\n```bash\nmake\n```\nThis command\
    \ will create module `helloLKM.ko` in the working directory. To view information\
    \ about `helloLKM.ko`,:\n\n```bash\nmodinfo helloLKM.ko\n```\n\nNow, I can load\
    \ this module, but to do this, I need to change user priority level to superuser.\
    \ Then I can use `insmod` or `modprobe` command to load module.\n\n```bash\nsu\n\
    insmod helloLKM.ko\nsu\nmodprobe helloLKM.ko\n```\n\nTo check whether the module\
    \ loaded successfully, I can check this log.\n\n```bash\ndmesg | tail -1\nHello\
    \ LKM\n```\n\nAnd you can unload the module:\n\n```bash\nrmmod helloLKM\nmodprobe\
    \ –r helloLKM\n```\n\nTo check whether unloaded perfectly, check using `dmesg`:\n\
    \n```bash\ndmesg | tail -1\nGoodbye LKM\n```\n\n### Initialization and Clean Macro\n\
    \nBefore kernel version 2.4, it was mandatory to use `init_module()` for module\
    \ initialization and `cleanup_module()` for cleanup purpose. But from kernel version\
    \ 2.4, it is allowed to use any name but we need to use extra macro so that system\
    \ can understand which one for initialization and which one for cleanup.\n\n```c\n\
    static int entrance()\nstatic int out()\nmodule __init (entrance);\nmodule __exit(out);\n\
    ```\n\nYou can use `__init()` and `__exit()` macro before function name.\n\n```c\n\
    #include <linux/kernel.h>\n#include <linux/module.h>\n//// end of header include\
    \ section\n#define __KERNEL__\n#define MODULE\n#define LINUX\n//// end of macro\
    \ define section\nstatic int entrance(void){\n  printk(KERN_DEBUG “Hello LKM”);\n\
    \  return 0;\n}\n//// end of init section\nstatic int out(void){\n  printk(KERN_DEBUG\
    \ “Goodbye LKM”);\n}\n//// End of cleanup section\nmodule __init (entrance);\n\
    module __exit(out);\nMODULE_LICENSE (“BSD”);\n//// End of module licensing section\n\
    ```\n\n### Other Macros\n\nYou can also use other macros like `MODULE_DESCRIPTION`,\
    \ `MODULE_AUTHOR`, these are pretty helpful to understand module purpose and who\
    \ written the module.\n\n```c\nMODULE_AUTHOR (“Your Name”);\nMODULE_DESCRIPTION\
    \ (“This is test module”);\n```\n\nFor example:\n\n```c\n#include <linux/kernel.h>\n\
    #include <linux/module.h>\n//// end of header include section\n#define __KERNEL__\n\
    #define MODULE\n#define LINUX\n//// end of macro define section\nstatic int __init\
    \ entrance (void){\n  printk(KERN_DEBUG “Hello LKM\\n”);\n  return 0;\n}\nstatic\
    \ void __exit out (void){\n  printk(KERN_DEBUG “Goodbye LKM\\n”);\n}\nmodule __init\
    \ (entrance);\nmodule __exit(out);\nMODULE_AUTHOR (“Md Mahbubur Rahman”);\nMODULE_LICENSE\
    \ (“BSD”);\n//// End of module licensing section\n```\n\nThe `__init` macro defines\
    \ that the cited function not further needed after initialization. Kernel frees\
    \ it from memory after initialization and `__exit` macro used to remove.\n\n###\
    \ Command-line arguments in LKM\n\nTo take command line arguments, LKMs need to\
    \ use `MODULE_PARAM()` macro and variables should be called global. The `MODULE_PARAM()`\
    \ macro takes 2 arguments: a variable name and variable type. There is another\
    \ relevant macro `MODULE_PARAM_DESC()` which is used for documenting module arguments.\
    \ It takes two parameters: variable name and variable description.\n\n**Supported\
    \ data types in command-line arguments:**\n\n* Bool\n* Byte (single)\n* Character\
    \ pointer\n* Array\n* Short int\n* Unsigned short int\n* Int\n* Unsigned int\n\
    * Long int\n* Unsigned long int\n"
