    \n## Chapter 1: Introduction to Kernel\n### What is Kernel?\nFor a vehicle, the\
    \ engine is the most important part; we can’t imagine a vehicle without an engine.\
    \ The heart is also the same. A human can live without eyes, legs, and hands but\
    \ can’t live without “Heart”. In a computing system, a kernel is the heart of\
    \ an operating system, and kernel is responsible to manage & run core functionalities\
    \ and features of an operating system.\n\n### Types of Kernel\nThere are different\
    \ types of car engines available, VEE, INLINE, STRAIGHT, and more; every type\
    \ of engine has several different approaches, pros, and cons. Kernels also have\
    \ a different type; based on purpose and targeted mechanism. Examples of some\
    \ kernels are monolithic, micro, modular, and others.\n\nTable 1.1: Kernel type\
    \ with examples\n![Macintosh HD:Users:mahbub:Desktop:Screen Shot 2018-08-01 at\
    \ 1.16.02 PM.png](image_rsrc2J9.jpg)\n\n### Micro Kernel\nMicro Kernel uses the\
    \ approach of scheduling, memory management, and inter-process communication.\
    \ This type of kernel is the smallest. But what does it mean by minimum size of\
    \ kernel?\n\n### Monolithic Kernel\nMonolithic Kernel type of kernel has all required\
    \ functionality inside the kernel. For example, schedulers, device drivers, memory\
    \ management, etc.\n\n### Modular Kernel\n### Exo Kernel\nModular kernel merges\
    \ the good points of kernel-level drivers and third-party drivers. In this type\
    \ of kernel, some parts of the system core will be located in independent files\
    \ called modules and these modules can be added to the system at run time. For\
    \ example, only loading drivers if a device is found.\n\n### The relation between\
    \ Kernel and Operating System\nSuppose, think of a house with two rooms; there\
    \ is a corridor between two rooms to communicate with.\n![Macintosh HD:Users:mahbub:Desktop:Screen\
    \ Shot 2018-04-12 at 8.18.41 AM.png](image_rsrc2JA)\n\nIn a similar pattern, the\
    \ Operating system works as a house. It has two parts or a room. One for user\
    \ space and other for kernel space where system call interface works between them.\n\
    ![Macintosh HD:Users:mahbub:Desktop:Screen Shot 2018-04-12 at 8.23.11 AM.png](image_rsrc2JB)\n\
    \n### Kernel space and protection rings\nKernel space programs have outmost access\
    \ to system/W, memory and these should not be accessible by userspace programs;\
    \ otherwise, disaster will happen. The operating system maintains some protection\
    \ rings to overcome these disasters. Here in the following figure, the protection\
    \ ring architecture of x86 CPU shown. Four levels defined here, from level0 to\
    \ level3.\n![Macintosh HD:Users:mahbub:Desktop:LK Beginners:OS-protection-rings.jpg](image_rsrc2JC)\n\
    \nLevel 0: Protection ring level 0 is the most privileged where kernel space programs\
    \ run.\nLevel 1: At protection ring level 1 device driver, the guest operating\
    \ system resides here.\nLevel 2: I/O privileged code and other similar privileged\
    \ code runs at the protection ring level.\nLevel 3: Userspace programs and libraries\
    \ run at protection ring level 3.\n\n### Kernel vs. operating system\n| Kernel\
    \ | Operating system |\n| :--- | :--- |\n| The kernel is the core of the operating\
    \ system. | The operating system consists of user space and kernel space. |\n\
    | The kernel is pretty smaller in size compared to the operating system. | The\
    \ operating system is pretty large compared to kernel. |\n| Kernel works as an\
    \ interface between software and hardware. | The operating system works as an\
    \ interface between user and hardware. |\n| The kernel works closer to the hardware\
    \ and it provides low-level services like: |\n"
