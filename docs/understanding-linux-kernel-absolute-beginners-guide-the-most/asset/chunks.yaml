  trans: "\n\n# 使用整数的 LKM 命令行参数示例\n\n```c\n#include <linux/kernel.h>\n#include <linux/init.h>\n\
    #include <linux/stat.h>\n#include <linux/module.h>\n#include <linux/moduleparam.h>\n\
    #define __KERNEL__\n#define LINUX\n#define MODULE\n//// 宏定义部分结束\nstatic int input\
    \ = 5; // 变量应该应该有一个初始默认值\nMODULE_PARAM (input, int);\nMODULE_PARM_DESC(input,\
    \ \"An integer\");\nstatic init __init entrance (void){\n\tint square_val = input\
    \ * input;\n\tprintk(KERN_DEBUG “Square value of input = %i\\n”, square_val);\n\
    }\nstatic void __exit out (void){\n\tprintk(KERN_DEBUG “Goodbye LKM\\n”);\n}\n\
    module __init (entrance);\nmodule __exit(out);\nMODULE_AUTHOR(\"Md Mahbubur Rahman\"\
    );\nMODULE_LICENSE (“BSD”);\n//// 模块许可部分结束\n```\n\n# 使用短整数、整数和长整数的 LKM 命令行参数示例\n\
    \n```c\n#include <linux/kernel.h>\n#include <linux/init.h>\n#include <linux/stat.h>\n\
    #include <linux/module.h>\n#include <linux/moduleparam.h>\n#define __KERNEL__\n\
    #define LINUX\n#define MODULE\n//// 宏定义部分结束\nstatic short int shortInt = 1;\n\
    static int vInt = 111;\nstatic long int longInt = 5555;\n//// 命令行参数声明结束\nMODULE_PARAM(shortInt,\
    \ short);\nMODULE_PARM_DESC(shortInt, \"A short integer\");\nMODULE_PARAM(vInt,\
    \ int);\nMODULE_PARM_DESC(vInt, \"An integer\");\nMODULE_PARAM(longInt, long);\n\
    MODULE_PARM_DESC(longInt, \"A long integer\");\nstatic int __init entrance(void){\n\
    \tint i;\n\tprintk(KERN_INFO \"Hello LKM =============\\n\");\n\tprintk(KERN_INFO\
    \ \"myshort is a short integer: %hd\\n\", shortInt);\n\tprintk(KERN_INFO \"vInt\
    \ is an integer: %d\\n\", vInt);\n\tprintk(KERN_INFO \"longInt is a long integer:\
    \ %ld\\n\", longInt);\n\treturn 0;\n}\n//// 初始化部分结束\nstatic void __exit out(void){\n\
    \tprintk(KERN_INFO \"Goodbye LKM\\n\");\n}\n//// 清理部分结束\nmodule __init (entrance);\n\
    module __exit(out);\nMODULE_AUTHOR(\"Md Mahbubur Rahman\");\nMODULE_LICENSE (“BSD”);\n\
    //// 模块许可部分结束 \n```\n\n# 使用字符串的 LKM 命令行参数示例\n\n```c\n#include <linux/kernel.h>\n\
    #include <linux/init.h>\n#include <linux/stat.h>\n#include <linux/module.h>\n\
    #include <linux/moduleparam.h>\n#define __KERNEL__\n#define LINUX\n#define MODULE\n\
    //// 宏定义部分结束\nstatic char *stringVar = \"hello\";\n//// 命令行参数声明结束\nMODULE_PARAM(stringVar,\
    \ charp);\nMODULE_PARM_DESC(stringVar, \"A character string\");\n//// 为每个变量添加带有带的\
    \ module_param\nstatic int __init entrance(void){\n\tint i;\n\tprintk(KERN_INFO\
    \ \"mystring is a string: %s\\n\", stringVar);\n\treturn 0;\n}\n//// 初始化部分结束\n\
    static void __exit out(void){\n\tprintk(KERN_INFO \"Goodbye LKM\\n\");\n}\n////\
    \ 清理部分结束\nmodule __init (entrance);\nmodule __exit(out);\nMODULE_AUTHOR(\"Md Mahbubur\
    \ Rahman\");\nMODULE_LICENSE (“BSD”);\n//// 模块许可部分结束 \n```\n\n# 使用数组的 LKM 命令行参数示例\n\
    \n```c\n#include <linux/kernel.h>\n#include <linux/init.h>\n#include <linux/stat.h>\n\
    #include <linux/module.h>\n#include <linux/moduleparam.h>\n#define __KERNEL__\n\
    #define LINUX\n#define MODULE\n//// 宏定义部分结束\nstatic int intArray[3] = { 1, 2,\
    \ 3 };\nstatic int arrayArgc = 0;\n//// 命令行参数声明结束\nMODULE_PARAM_ARRAY(intArray,\
    \ int, arrayArgc, 1111);\nMODULE_PARM_DESC(intArray, \"An array of integers\"\
    );\n//// 为每个变量添加带有类型的 module_param\nstatic int __init entrance(void){\n\tint i;\n\
    \tfor (i = 0; i < (sizeof intArray / sizeof (int)); i++)\n\t{\n\t\tprintk(KERN_INFO\
    \ \" intArray[%d] = %d\\n\", i, intArray[i]);\n\t}\n\tprintk(KERN_INFO \"got %d\
    \ arguments for intArray.\\n\", arrayArgc);\n\treturn 0;\n}\n//// 初始化部分结束\nstatic\
    \ void __exit out(void){\n\tprintk(KERN_INFO \"Goodbye LKM\\n\");\n}\n//// 清理部分结束\n\
    module __init (entrance);\nmodule __exit(out);\nMODULE_AUTHOR(\"Md Mahbubur Rahman\"\
    );\nMODULE_LICENSE (“BSD”);\n//// 模块许可部分结束 \n```\n\n"
- fmt: "\n* Another important feature of `printk()` is log level. Before printing\
    \ the contents of `printk()` to console the kernel checks the log level.\n\n###\
    \ The `printk()` log level priorities\n\nThere are eight (08) priority levels\
    \ of `printk()` defined in `<linux/kernel.h>`. There are listed here!![Macintosh\
    \ HD:Users:mahbub:Desktop:Screen Shot 2018-08-01 at 2.30.44 PM.png](image_rsrc2JH.jpg)\n\
    \n* `KERN_EMERG`\n  A massive and deadly emergency condition, which may related\
    \ system halt or crash.\n\n* `KERN_ALERT`\n  An urgent issue, which may need immediate\
    \ action.\n\n* `KERN_CRIT`\n  Critical conditions, often relevant to serious hardware\
    \ or software failures.\n\n* `KERN_ERR`\n  Error condition for example hardware\
    \ difficulties, software difficulties are reported with log level.\n\n* `KERN_WARNING`\n\
    \  Warning level message.\n\n* `KERN_NOTICE`\n  The current situation may be normal,\
    \ but still worthy to note.\n\n* `KERN_INFO`\n  An informational message is reported\
    \ in this log level.\n\n* `KERN_DEBUG`\n  A debug message, generally for debugging\
    \ purposes this log level used.\n\nNow a question in your mind arises, if you\
    \ do not specify a log level, what will be happened? The default value of `DEFAULT_MESSAGE_LOGLEVEL`\
    \ will be used, which is currently `KERN_WARNING`.\n\n#### Printk Example # 1\n\
    \n```c\n#include <linux/kernel.h>\n#include <linux/module.h>\n// end of header\
    \ include section\n#define __KERNEL__\n#define MODULE\n#define LINUX\n// end of\
    \ macro define section\nstatic int entrance(void){\n  printk(KERN_DEBUG \"Simple\
    \ and Basic Printk example\");\n  return 0;\n}\n// end of init section\nstatic\
    \ int out(void){\n  printk(KERN_DEBUG \"Goodbye! But remember, printk is amazing.\"\
    );\n}\n// End of cleanup section\nmodule __init (entrance);\nmodule __exit(out);\n\
    MODULE_LICENSE (\"BSD\");\n// End of module licensing section\n```\n\n#### Printk\
    \ Example # 2\n\n```c\n#include <linux/kernel.h>\n#include <linux/module.h>\n\
    // end of header include section\n#define __KERNEL__\n#define MODULE\n#define\
    \ LINUX\n// end of macro define section\nstatic int entrance(void){\n  printk(KERN_DEBUG\
    \ \"Simple and Basic Printk example : FILE: %s, LINE : %i\\n\", __FILE__, __LINE__);\n\
    \  return 0;\n}\n// end of init section\nstatic int out(void){\n  printk(KERN_DEBUG\
    \ \"Goodbye! But remember, printk is amazing: FILE: %s, LINE : %i\\n\", __FILE__,\
    \ __LINE__);\n}\n// End of cleanup section\nmodule __init (entrance);\nmodule\
    \ __exit(out);\nMODULE_LICENSE (\"BSD\");\n// End of module licensing section\n\
    ```\n\n## Chapter 9: Loading and Unloading LKMs\n\n### Loading and Unloading Linux\
    \ Kernel Modules (LKMs) on demand\n\nLinux kernel has an amazing feature, it can\
    \ automatically load and unload LKMs which helps to avoid wasting of kernel processes\
    \ and memory. But to use this support or feature, we need to enable `kmod` module\
    \ when we configure the kernel before we compile it.\n\nMost of the distributions\
    \ like Redhat, Debian, Ubuntu, CentOS, etc. comes with `kmod` enabled. The `kmod`\
    \ feature or support comes with `libkmod.so` library.\n\nContents of `libkmod`\
    \ library:\n- `insmod`\n- `rmmod`\n- `depmod`\n- `modprobe`\n- `modinfo`\n- `lsmod`\n\
    \n`insmod` being used to insert a module into the Linux kernel.\nNote: `insmod`\
    \ requires passing it the full pathname and list of modules (dependent modules)\
    \ in the right order. If we consider `nfs.ko`, it requires the following module\
    \ with the relevant order.\n\n1. `nfs_common.ko`\n2. `auth_rpcgss.ko`\n3. `fscache.ko`\n\
    4. `lockd.ko`\n5. `sunrpc.ko`\n\n`rmmod`\nThe `rmmod` unloads a module from the\
    \ Linux kernel. If we want to unload or remove a module then we have to run the\
    \ following command:\n`$ rmmod modulename`\nFor example, we have a module `vfat`,\
    \ we need to unload it. Then command will be\n`$ rmmod vfat`\nNote: There is another\
    \ way to unload or remove module in Linux kernel. That is `modprobe –v –r`. Here\
    \ for removing `vfat`, the command will be\n`$ modprob –v –r vfat`\nWhere, `r`\
    \ is the short form of remove and `v` for verbose.\n\n`depmod`\nThe `depmod` works\
    \ with existing sets of modules. It creates a dependency file based on the symbols\
    \ it find in the existing sets of modules mentioned in the command lines or from\
    \ the directories specified in the configuration file.\nThe `depmod` creates a\
    \ “`Makefile`” like dependency file, which is used by `modprobe` to automatically\
    \ load the correct module or stack of modules.\nNote: The `depmod` file can be\
    \ found at `/lib/modules/kernel-version/modules.dep`.\n\n`modinfo`\nThe `modinfo`\
    \ program shows information about a Linux kernel module. It shows the following\
    \ information regarding each module:\n1. Module author\n2. License\n3. Parameters\n\
    4. Dependencies\n5. Module description\n6. Full path of the module\n\n`lsmod`\n\
    The `lsmod` program shows the currently loaded modules. It shows the following:\n\
    1. Name of module\n2. Size of module\n3. Use count and list of referring modules\n\
    \n`modprobe`\nThe `modprobe` program adds or removes a module from the Linux kernel.\
    \ It looks at `/lib/modules` for all the modules. How it works? Just the `dep`\
    \ file which is generated by `depmod`.\n\n## Chapter 10: Introduction to Device\
    \ Drivers\n\n### Introduction to device driver\n\nMost of the Linux kernel’s source\
    \ code are in its device drivers. The drivers directory contains all of Linux’s\
    \ device drivers source codes. This directory has the following parts\n\n* `/block`\n\
    \  - The block device drivers resides here.\n  - Block devices include both IDE\
    \ and SCSI based devices.\n* `/char`\n  - The char device drivers resides here.\
    \ Example, `tty`.\n* `/cdrom`\n  - In this directory all of the CDROM code for\
    \ Linux resides.\n* `/pci`\n  - PCI pseudo-drivers resides in this directory.\n\
    * `/scsi`\n  - All of the drivers for the scsi devices supported by Linux resides\
    \ here.\n* `/net`\n  - Network device drivers resides here.\n* `/sound`\n  - All\
    \ sound card drivers resides here.\n\n### What is device driver?\n\nA device driver\
    \ is ultimately designed and developed to control or operate a specific type of\
    \ hardware that is attached with the system. In other words, device driver consists\
    \ of a bunch of source code which tells the system how to communicate, operate\
    \ or control hardware. The kernel uses device driver to control or communicate\
    \ hardware without knowing any details of the hardware, for example, how hardware\
    \ operates. A device driver uses bus system of the computer to communicate with\
    \ the device or through other communication system to which the hardware being\
    \ connected.\n\nWhen a kernel calls device driver?\n\n* To check whether the device\
    \ available or not.\n* To handle device specific input/output calls.\n"
