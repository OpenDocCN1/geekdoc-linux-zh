  ISBN: `9798720362096`\n\n## 献辞\n本书献给我尊敬的父母，感谢他们让我见证奇妙世界的光芒。感谢他们信任我并鼓励我追求梦想。\n\n\
  ## 支持本地教育\n作者版税总数的 20%将捐赠给教育非营利组织。\n\n\n### 附录 A\n- Linux 内核编码风格\n    - 缩进\n   \
  \ - 长行换行\n    - 空格位置\n    - 括号位置\n    - 局部和全局变量命名\n    - 函数\n    - 注释\n- Kconfig\
  \ 配置文件\n- 宏和枚举\n- 打印内核消息\n- 内存分配\n\n### 关于作者\n\n## 第 1 章：内核简介\n### 什么是内核？\n对于汽车来说，引擎是最重要的部分；我们无法想象没有引擎的汽车。心脏也是如此。人可以没有眼睛、腿和手生存，但不能没有“心脏”。在计算系统中，内核是操作系统的核心，内核负责管理和运行操作系统的核心功能和特性。\n\
  \n### 内核的类型\n有不同类型的汽车发动机，VEE、INLINE、STRAIGHT 等；每种类型的发动机都有不同的方法、优点和缺点。内核也有不同的类型；基于用途和目标机制。内核的示例包括单体、微内核、模块化内核等。\n\
  \n表 1.1：内核类型及示例\n![Macintosh HD:Users:mahbub:Desktop:Screen Shot 2018-08-01 at 1.16.02\
  \ PM.png](img/image_rsrc2J9.jpg)\n\n### 微内核\n微内核采用调度、内存管理和进程通信的方法。这种类型的内核是最小的。但内核尺寸最小意味着什么？\n\
  \n### 单体内核\n单体内核类型的内核在内部包含了所有所需的功能。例如，调度器、设备驱动程序、内存管理等。\n\n### 模块化内核\n### Exo Kernel\n\
  模块化内核结合了内核级驱动和第三方驱动的优点。在这种内核中，系统核心的一些部分将位于称为“模块”的独立文件中，这些模块可以在运行时添加到系统中。例如，仅在发现设备时加载驱动程序。\n\
  \n### 内核与操作系统的关系\n假设想一个有两个房间的房子；两个房间之间有一条走廊用于通信。\n![Macintosh HD:Users:mahbub:Desktop:Screen\
  \ Shot 2018-04-12 at 8.18.41 AM.png](img/image_rsrc2JA)\n\n以类似的模式，操作系统像一栋房子。它有两个部分或房间：一个是用户空间，另一个是内核空间，系统调用接口在它们之间工作。\n\
  ![Macintosh HD:Users:mahbub:Desktop:Screen Shot 2018-04-12 at 8.23.11 AM.png](img/image_rsrc2JB)\n\
  \n### 内核空间与保护环\n内核空间程序对系统/W、内存具有最高权限，这些不应被用户空间程序访问；否则将发生灾难。操作系统维护了一些保护环来克服这些灾难。在下面的图中显示了\
  \ x86 CPU 的保护环架构。这里定义了四个级，从级 0 到 级 3。\n![Macintosh HD:Users:mahbub:Desktop:LK Beginners:OS-protection-rings.jpg](img/image_rsrc2JC)\n\
  \nLevel 0：保护环级 0 是权限最高的，内核空间程序在此运行。\nLevel 1：在保护环级 1，设备驱动程序和客操作系统驻留。\nLevel 2：I/O\
  \ 特权代码和其他类似的特权代码运行在保护环级。\nLevel 3：用户空间程序和库运行在保护环级 3。\n\n### 内核 vs 操作系统\n| 内核 | 操作系统\
  \ |\n| :--- | :--- |\n| 内核是操作系统的核心。 | 操作系统由用户空间和内核空间组成。 |\n| 内核与操作系统相比尺寸要小得多。 |\
  \ 操作系统与内核相比要大得多。 |\n| 内核作为软件和硬件之间的接口。 | 操作系统作为用户和硬件之间的接口。 |\n| 内核工作更接近硬件，并提供低级服务，如：\
  \ |\n\n\n\n\n-   系统调用\n-   内存管理\n-   网络管理  own 驱动\n-   文件管理 进程管理\n\n| 操作系统包含了用户界面等应用程序。\
  \ |\n\n## 内核空间 vs 用户空间？\n\n`Kernel space`（内核空间）是内核代码存储的地方，它在此处执行并提供服务。相反，`user space`（用户空间）是用户进程运行的内存区域。`Userspace`进程可以通过系统调用访问\
  \ `kernel space` 例程。\n\n## 微内核 vs 单体内核\n\n两种最流行的内核类型是 `microkernel`（微内核）和 `monolithic\
  \ kernel`（单体内核）。我们将讨论它们之间的区别。首先是服务。在 `microkernel` 中，服务保留在独立的地址空间中，而在 `monolithic\
  \ kernel` 中，服务保留在同一个地址空间内。如果服务崩溃，不会影响 `micro kernel` 核心，因为它运行在独立的地址空间中，但 `monolithic`\
  \ 核心会崩溃。在 `microkernel` 中，执行速度比 `monolithic kernel` 慢。与 `monolithic` 相比，`Microkernels`\
  \ 的体积更小。另外一点，`microkernels` 易于扩展。\n\n## 第 2 章：Linux 内核简介\n\n### Linux 内核\n\n`Linux\
  \ Kernel` 继承了 `Monolithic`（单体）类型的内核。该内核由 Linus Torvalds 于 1991 年首次发布。`Linux kernel`\
  \ 是整个 `Linux System` 的较小部分，它是负责系统运行良好程度的核心。自 2005 以来，`Linux kernel` 使用 `Git` 源码管理系统。\n\
  \n### Linux 内核开发者社区\n\n如果你想为 `Linux Kernel` 编写代码，欢迎你；因为 `Linux kernel` 是开源项目。在开始之前，你应该了解技术部分以及\
  \ `Linux Kernel Developer Community` 是如何工作的。例如，代码冲突如何产生和解决、如何提交进程、`Linux kernel\
  \ coding style` 等。关于这些及其他内容，你可以在 `kernel.org` 获得。\n\n`Linux kernel versioning system`![Macintosh\
  \ HD:Users:mahbub:Desktop:linux-kernel-version-system.png](img/image_rsrc2JD.jpg)\n\
  \n### 开发亮点\n\n自 `4.7` 发布以来，已从 4319 名独立开发者那里合并了 83,000 个变更集。\n\n### 合并的新特性\n\n* \
  \  内核内核 `TLS` 支持的加密流卸载。\n*   改进的 `BBR` 拥塞控制方法。\n*   `ARM` 处理器上通过新的 `TEE` 框架实现的可信执行环境。\n\
  *   内核的文档系统现在由 `Sphinx` 支持。\n*   `Statx()` 系统调用现可用。\n\n### Linux 内核源码大小\n\n`Linux\
  \ kernel` 每年添加对新硬件和功能的支持，因此其源码规模增长迅速。在 1991 年的首次发布时，内核源码规模接近 1 万行代码，目前它已经超过了 2200\
  \ 万行代码。\n\n### Linux 内核目录 / 源码结构\n\n从源码树的顶层 `/usr/src/linux` 我们可以看到几个目录：\n\n*  \
  \ **arch**\n    *   这部分包含了所有特定架构的内核代码。\n    *   该目录有进一步的子目录，例如对应每个支持架构的 `i386` 和\
  \ `alpha`。\n\n*   **include**\n    *   该目录包含构建内核源码所需的大多数包含文件。\n    *   它也有对应每个支持架构的子目录。\n\
  \n*   **init**\n    *   这部分包含了内核的初始化代码。\n    *   该目录对于需要了解内核工作的开发者来说是一个非常重要的地方。\n\
  \n*   **mm**\n    *   这部分持有所有与内存管理相关的代码。\n\n*   **drivers**\n    *   该目录包含了所有的设备驱动程序。\n\
  \    *   它们进一步细分为设备驱动程序类，例如块设备驱动、字符设备驱动、网络驱动。\n\n*   **ipc**\n    *   这部分持有内核的进程间通信代码。\n\
  \n*   **modules**\n    *   这部分曾用于持有构建好的模块。\n\n*   **fs**\n    *   该目录包含文件系统代码。\n\
  \n*   **kernel**\n    *   该目录包含主内核源码。\n\n*   **net**\n    *   该目录包含内核的网络代码。\n\n\
  *   **lib**\n    *   这部分持有内核的库代码。\n\n*   **scripts**\n    *   这部分持有了在配置内核时使用的脚本。\n\
  \n## 谁在赞助这项工作？\n\n根据报告，以下是聘用内核：\n\n![Macintosh HD:Users:mahbub:Desktop:linux-kernel.png](img/image_rsrc2JE.jpg)\n\
  \n### 检查 Linux 内核版本\n\n有时你可能需要检查当前版本，然后运行 `uname -r`\n\n## 第 3 章：编译 Linux 内核\n\n\
  ### Linux 内核源码树\n\n`kernel.org` 托管所有的源码![Macintosh HD:Users:mahbub:Desktop:linux-kernel.png](img/image_rsrc2JG.jpg)\n\
  \n该网站是不自明的。你可以下载源码。你也可以利用命令行 `wget` 或 `curl` 下载源码。\n\n```bash\nmkdir kernel\ncd\
  \ kernel\nwget [url]\ntar -xzf [filename.tar.gz]\n```\n\n### 编译 Linux 内核的工具\n\n\
  1.  **编译器**\n2.  **链接器**\n3.  **Make**\n\n**编译器**：有几种编译器可用，如 `gcc`、`clang`、`Visual\
  \ C++`、`Turbo C` 等。但编译 Linux 内核必须使用 `gcc` C 编译器。为什么呢？因为内核的大部分是用 C 语言编写的，极小部分是用汇编编写的。`gcc`\
  \ C 编译器能够编译 C 源码。\n\n**链接器**：对于链接和汇编源码还需要另一个工具，即 `GNU binary utilities`，简称 `binutils`。`binutils`\
  \ 是创建和管理二进制文件、对象文件、分析数据的工具集。\n\n**Make**：编译内核的另一个重要工具是 `make`；它检查源码并寻找需要编译的文件。\n\
  \n## 第 4 章：理解系统调用接口\n\n### 系统调用接口简介\n\n系统调用接口在内核空间和用户空间之间提供了一个层。这一层为用户空间进程执行内核例程。简单来说，系统调用只是用户空间对内核函数或服务的请求![Macintosh\
  \ HD:Users:mahbub:Desktop:system-call-interface.png](img/image_rsrc2JF.jpg)\n\n\
  ### Syscalls / 系统调用\n\nSyscalls / 系统调用通过函数调用访问。通常这些函数调用定义在 C 库中。系统调用接受各种参数（从零到多个）作为输入，返回一个值并执行一个或多个任务。理想情况下，系统调用应该只有一个目的。\n\
  \n### 系统调用号\n\n每个系统调用都被分配了一个唯一的 32 位系统数；并用于引用特定的系统调用。Linux 内核维护一个名为 `sys-call-table`\
  \ 的表来存储所有注册的系统调用。\n\n### 系统调用参数\n\n在调用系统调用时，可能需要传递传递参数。在这里，参数存储在寄存器中。在 x86-32 位系统中，寄存器为\
  \ `ebx`、`ecx`、`edx`、`esi` 和 `edi`。但当需要传递超过 5 个参数时，会使用单个寄存器持有指向存储所有参数的用户空间的指针。返回值也通过寄存器发送到用户空间。\n\
  \n### 系统调优点\n\n系统调用接口方法有两个优点。例如，\n\n\n\n\n## 系统调用的优点\n\n- **安全性**：如果用户态进程/程序能够直接读写内核地址空间，那么系统的安全性将将化为乌有。由于系统调用的实现，用户态函数对系统资源/硬件的访问受到限制。\n\
  - **性能更高**：系统调用接口为系统提供了更快的性能。\n- **可移植性**：系统调用接口使得用户空间应用程序更具移植性。由于内核端的任何变化，用户态程序都不需要更改。\n\
  - **更易实现**：系统调用接口使得用户空间应用程序开发变得容易；在这里，它们不需要考虑系统的底层功能。\n\n## 系统调用的缺点\n\n要开发或实现一个新的系统调用，需要官方分配给你一个唯一的系统调用号。更多的痛点在于，所有的架构都需要单独注册该系统调用。因此，如果你想实现一个简单的任务，系统调用会非常耗时，而且维护起来相当复杂。\n\
  \n## 为 Linux 内核创建一个基础系统调用\n\n首先，切换到 Linux 内核编译后的源码目录。\n\n```bash\n$ cd linux-x.x.x/\n\
  ```\n\n创建一个名为 `hellosys` 的目录并进入该目录。\n\n```bash\n$ mkdir hellosys\n$ cd hellosys\n\
  ```\n\n在此目录下创建一个新的 C 文件，\n\n```bash\n$ vi hellosys.c\n```\n\n在此处添加以下代码：\n\n```c\n\
  #include <linux/kernel.h>\nasmlinkage long sys_hellosys(void) {\n    printk(\"Hello\
  \ New System Call!\\n\");\n    return 0;\n}\n```\n\n现在在同一目录下创建一个 `Makefile`，内容如下：\n\
  \n```makefile\nmod_sign_cmd = scripts/sign-file $(CONFIG_MODULE_SIG_HASH) \\$(MODULE_SIG_KEY_SRCPREFIX)\n\
  else\nmod_sign_cmd = true\nendif\nexport mod_sign_cmd\nifeq ( $(KBUILD_EXTMOD),)\n\
  core-y += kernel/certs/mm/fs/ipc/security/crypto/block/hellosys/\nvmlinux-dirs :=\
  \ $(patsubst %/, %, $(filter %/, $(init-y) $(init-m) \\$(core-y) $(core-m) $(drivers-y)\
  \ $(drivers-m) \\$(net-y) $(net-m) $(libs-y) $(libs-m) $(virt-y)))\nvmlinux-alldirs\
  \ := $(sort $(vmlinux-dirs) $(patsubst %/, %, $(filter %/, \\$(init-) $(core-) $(drivers-)\
  \ $(net-) $(libs-) $(virst-))))\n```\n\n现在，编译并运行 `Makefile`。\n\n```bash\n$ make\n\
  ```\n\n### 将新系统调用加入系统调用表\n\n在名为 `syscall_table_64.tbl`（注：根据架构可能不同）的表格中添加条目。\n\n\
  *(注：由于原文文本在此处不完整，后续内容根据您提供的文本逻辑进行翻译)*\n\n\n\n\n在主目录下创建一个名为“LKM”的目录，然后在 `LKM` 目录内创建\
  \ `hellolkm.c`。\n\n```bash\ncd ~\nmkdir LKM\ncd LKM\n```\n\n```c\n#include <linux/kernel.h>\n\
  #include <linux/module.h>\n//// end of header include section\n#define __KERNEL__\n\
  #define MODULE\n#define LINUX\n//// end of macro define section\nint init_module(void){\n\
  \  printk(KERN_DEBUG “Hello LKM”);\n  return 0;\n}\n//// end of init section\nvoid\
  \ cleanup_module (void){\n  printk(KERN_DEBUG “Goodbye LKM”);\n}\n//// End of cleanup\
  \ section\nMODULE_LICENSE (“BSD”);\n//// End of module licensing section\n```\n\n\
  在头文件包含部分，包含了 `kernel.h` 用于 `printk()` 函数，包含了 `module.h` 用于将模块动态加载到内核中。在宏定义部分，添加了宏\
  \ `__KERNEL__` 以向用户空间程序隐藏内核源源程序。\n\n我使用了函数 `init_module()`，它作为初始化函数工作。它在控制台中打印 Hello\
  \ LKM，并使用了 `KERN_DEBUG` 宏。要理解 `KERN_DEBUG` 选项，请查看调试章节。然后我使用了函数 `cleanup_module()`，它作为模块的清理或结束函数工作。最后，使用\
  \ `MODULE_LICENSE` 宏来提供此模块的许可信息。\n\n## Makefile\n\n现在我将创建一个 makefile 来构建此模块。\n\n\
  ```makefile\nobj-m = helloLKM.o\nKERNELDIR := /lib/module\nWORKINGDIR := $(shell\
  \ pwd)\nall: make -c $(KERNELDIR) M=$(WORKINGDIR)\nclean:\n```\nkernel 目录是内核源码所在的目录。我使用了\
  \ `shell uname –r`，它会递归搜索并获取当前内核的。`make -c $(KERNELDIR) “make”` 会构建源码时切换到该目录，并在完成后返回此目录。`M\
  \ = $(WORKINGDIR)` 使用模块所在的工作目录路径。这里 `WORKINGDIR := $(shell pwd)` 表示当前目录的绝对路径。最后，`clean`\
  \ 标签将移除所有生成的文件。\n\n现在我将编译、构建并运行该模块。\n\n首先，编译：\n```bash\nmake\n```\n此命令将在工作目录下创建模块\
  \ `helloLKM.ko`。要查看 `helloLKM.ko` 的信息：\n\n```bash\nmodinfo helloLKM.ko\n```\n\n\
  现在，我可以加载此模块，但要做到这一点，我需要将用户优先级更改为超级用户。然后我可以使用 `insmod` 或 `modprobe` 命令加载模块。\n\n```bash\n\
  su\ninsmod helloLKM.ko\nsu\nmodprobe helloLKM.ko\n```\n\n要检查模块是否加载成功，我可以检查此日志。\n\
  \n```bash\ndmesg | tail-1\nHello LKM\n```\n\n你可以卸载该模块：\n\n```bash\nrmmod helloLKM\n\
  modprobe –r helloLKM\n```\n\n要检查是否卸载完美，请使用 `dmesg` 检查：\n\n```bash\ndmesg | tail-1\n\
  Goodbye LKM\n```\n\n### 初始化与清理宏\n\n在内核 2.4 版本之前，强制使用 `init_module()` 进行模块初始化并使用\
  \ `cleanup_module()` 进行清理。但从内核 2.4 版本开始，允许使用任何名称，我们需要使用额外的宏，以便系统理解哪一个用于初始化，哪一个用于清理。\n\
  \n```c\nstatic int entrance()\nstatic int out()\nmodule __init (entrance);\nmodule\
  \ __exit(out);\n```\n\n你可以在函数名之前使用 `__init()` 和 `__exit()` 宏。\n\n```c\n#include\
  \ <linux/kernel.h>\n#include <linux/module.h>\n//// end of header include section\n\
  #define __KERNEL__\n#define MODULE\n#define LINUX\n//// end of macro define section\n\
  static int entrance(void){\n  printk(KERN_DEBUG “Hello LKM”);\n  return 0;\n}\n\
  //// end of init section\nstatic int out(void){\n  printk(KERN_DEBUG “Goodbye LKM”);\n\
  }\n//// End of cleanup section\nmodule __init (entrance);\nmodule __exit(out);\n\
  MODULE_LICENSE (“BSD”);\n//// End of module licensing section\n```\n\n### 其他宏\n\n\
  你也可以使用其他宏如 `MODULE_DESCRIPTION`、`MODULE_AUTHOR`，这些对于理解模块用途以及编写者非常有帮助。\n\n```c\n\
  MODULE_AUTHOR (“Your Name”);\nMODULE_DESCRIPTION (“This is test module”);\n```\n\
  \n例如：\n\n```c\n#include <linux/kernel.h>\n#include <linux/module.h>\n//// end of\
  \ header include section\n#define __KERNEL__\n#define MODULE\n#define LINUX\n////\
  \ end of macro define section\nstatic int __init entrance (void){\n  printk(KERN_DEBUG\
  \ “Hello LKM\\n”);\n  return 0;\n}\nstatic void __exit out (void){\n  printk(KERN_DEBUG\
  \ “Goodbye LKM\\n”);\n}\nmodule __init (entrance);\nmodule __exit(out);\nMODULE_AUTHOR\
  \ (“Md Mahbubur Rahman”);\nMODULE_LICENSE (“BSD”);\n//// End of module licensing\
  \ section\n```\n\n`__init` 宏定义引用的函数在初始化后不再需要。内核在初始化后从内存中释放它，`__exit` 宏用于移除。\n\n\
  ### LKM 中的命令行参数\n\n为了获取命令行参数，LKM 需要使用 `MODULE_PARAM()` 宏，且变量应该被定义为全局。`MODULE_PARAM()`\
  \ 宏接受两个参数：变量名和变量类型。另一个相关的宏 `MODULE_PARAM_DESC()` 用于记录模块参数说明。它接受两个参数：变量名和变量描述。\n\n\
  **命令行参数中支持的数据类型：**\n\n* Bool\n* Byte（单字节）\n* 字符指针\n* 数组\n* Short int\n* Unsigned\
  \ short int\n* Int\n* Unsigned int\n* Long int\n* Unsigned long int\n\n\n\n\n##\
  \ 使用整数的 LKM 命令行参数示例\n\n```c\n#include <linux/kernel.h>\n#include <linux/init.h>\n\
  #include <linux/stat.h>\n#include <linux/module.h>\n#include <linux/moduleparam.h>\n\
  #define __KERNEL__\n#define LINUX\n#define MODULE\n//// 宏定义部分结束\nstatic int input\
  \ = 5; // 变量应该应该有一个初始默认值\nMODULE_PARAM (input, int);\nMODULE_PARM_DESC(input, \"\
  An integer\");\nstatic init __init entrance (void){\n\tint square_val = input *\
  \ input;\n\tprintk(KERN_DEBUG “Square value of input = %i\\n”, square_val);\n}\n\
  static void __exit out (void){\n\tprintk(KERN_DEBUG “Goodbye LKM\\n”);\n}\nmodule\
  \ __init (entrance);\nmodule __exit(out);\nMODULE_AUTHOR(\"Md Mahbubur Rahman\"\
  );\nMODULE_LICENSE (“BSD”);\n//// 模块许可部分结束\n```\n\n## 使用短整数、整数和长整数的 LKM 命令行参数示例\n\
  \n```c\n#include <linux/kernel.h>\n#include <linux/init.h>\n#include <linux/stat.h>\n\
  #include <linux/module.h>\n#include <linux/moduleparam.h>\n#define __KERNEL__\n\
  #define LINUX\n#define MODULE\n//// 宏定义部分结束\nstatic short int shortInt = 1;\nstatic\
  \ int vInt = 111;\nstatic long int longInt = 5555;\n//// 命令行参数声明结束\nMODULE_PARAM(shortInt,\
  \ short);\nMODULE_PARM_DESC(shortInt, \"A short integer\");\nMODULE_PARAM(vInt,\
  \ int);\nMODULE_PARM_DESC(vInt, \"An integer\");\nMODULE_PARAM(longInt, long);\n\
  MODULE_PARM_DESC(longInt, \"A long integer\");\nstatic int __init entrance(void){\n\
  \tint i;\n\tprintk(KERN_INFO \"Hello LKM =============\\n\");\n\tprintk(KERN_INFO\
  \ \"myshort is a short integer: %hd\\n\", shortInt);\n\tprintk(KERN_INFO \"vInt\
  \ is an integer: %d\\n\", vInt);\n\tprintk(KERN_INFO \"longInt is a long integer:\
  \ %ld\\n\", longInt);\n\treturn 0;\n}\n//// 初始化部分结束\nstatic void __exit out(void){\n\
  \tprintk(KERN_INFO \"Goodbye LKM\\n\");\n}\n//// 清理部分结束\nmodule __init (entrance);\n\
  module __exit(out);\nMODULE_AUTHOR(\"Md Mahbubur Rahman\");\nMODULE_LICENSE (“BSD”);\n\
  //// 模块许可部分结束 \n```\n\n## 使用字符串的 LKM 命令行参数示例\n\n```c\n#include <linux/kernel.h>\n\
  #include <linux/init.h>\n#include <linux/stat.h>\n#include <linux/module.h>\n#include\
  \ <linux/moduleparam.h>\n#define __KERNEL__\n#define LINUX\n#define MODULE\n////\
  \ 宏定义部分结束\nstatic char *stringVar = \"hello\";\n//// 命令行参数声明结束\nMODULE_PARAM(stringVar,\
  \ charp);\nMODULE_PARM_DESC(stringVar, \"A character string\");\n//// 为每个变量添加带有带的\
  \ module_param\nstatic int __init entrance(void){\n\tint i;\n\tprintk(KERN_INFO\
  \ \"mystring is a string: %s\\n\", stringVar);\n\treturn 0;\n}\n//// 初始化部分结束\nstatic\
  \ void __exit out(void){\n\tprintk(KERN_INFO \"Goodbye LKM\\n\");\n}\n//// 清理部分结束\n\
  module __init (entrance);\nmodule __exit(out);\nMODULE_AUTHOR(\"Md Mahbubur Rahman\"\
  );\nMODULE_LICENSE (“BSD”);\n//// 模块许可部分结束 \n```\n\n## 使用数组的 LKM 命令行参数示例\n\n```c\n\
  #include <linux/kernel.h>\n#include <linux/init.h>\n#include <linux/stat.h>\n#include\
  \ <linux/module.h>\n#include <linux/moduleparam.h>\n#define __KERNEL__\n#define\
  \ LINUX\n#define MODULE\n//// 宏定义部分结束\nstatic int intArray[3] = { 1, 2, 3 };\nstatic\
  \ int arrayArgc = 0;\n//// 命令行参数声明结束\nMODULE_PARAM_ARRAY(intArray, int, arrayArgc,\
  \ 1111);\nMODULE_PARM_DESC(intArray, \"An array of integers\");\n//// 为每个变量添加带有类型的\
  \ module_param\nstatic int __init entrance(void){\n\tint i;\n\tfor (i = 0; i < (sizeof\
  \ intArray / sizeof (int)); i++)\n\t{\n\t\tprintk(KERN_INFO \" intArray[%d] = %d\\\
  n\", i, intArray[i]);\n\t}\n\tprintk(KERN_INFO \"got %d arguments for intArray.\\\
  n\", arrayArgc);\n\treturn 0;\n}\n//// 初始化部分结束\nstatic void __exit out(void){\n\t\
  printk(KERN_INFO \"Goodbye LKM\\n\");\n}\n//// 清理部分结束\nmodule __init (entrance);\n\
  module __exit(out);\nMODULE_AUTHOR(\"Md Mahbubur Rahman\");\nMODULE_LICENSE (“BSD”);\n\
  //// 模块许可部分结束 \n```\n\n\n\n\n\n* `printk()` 的另一个重要特性是日志级别。在将 `printk()` 的内容打印到控制台之前，内核会检查日志级别。\n\
  \n### `printk()` 日志级别优先级\n\n`<linux/kernel.h>` 中定义了 `printk()` 的八（08）个优先级级别。它们列在这里：![Macintosh\
  \ HD:Users:mahbub:Desktop:Screen Shot 2018-08-01 at 2.30.44 PM.png](img/image_rsrc2JH.jpg)\n\
  \n* `KERN_EMERG`\n  严重且致命的紧急状况，可能导致系统停止或崩溃。\n\n* `KERN_ALERT`\n  紧急问题，可能需要立即采取行动。\n\
  \n* `KERN_CRIT`\n  关键状态，通常与严重的硬件或软件故障有关。\n\n* `KERN_ERR`\n  错误状态，例如硬件故障、软件故障将以该日志级别进行报告。\n\
  \n* `KERN_WARNING`\n  警告级别消息。\n\n* `KERN_NOTICE`\n  当前情况可能正常，但仍值得注意。\n\n* `KERN_INFO`\n\
  \  在此日志级别报告信息性消息。\n\n* `KERN_DEBUG`\n  调试消息，此日志级别通常用于调试目的。\n\n现在你脑中产生了一个问题，如果不指定日志级别，会发生什么？将使用\
  \ `DEFAULT_MESSAGE_LOGLEVEL` 的默认值，它目前是 `KERN_WARNING`。\n\n#### Printk 示例 #1\n\n\
  ```c\n#include <linux/kernel.h>\n#include <linux/module.h>\n// end of header include\
  \ section\n#define __KERNEL__\n#define MODULE\n#define LINUX\n// end of macro define\
  \ section\nstatic int entrance(void){\n  printk(KERN_DEBUG \"Simple and Basic Printk\
  \ example\");\n  return 0;\n}\n// end of init section\nstatic int out(void){\n \
  \ printk(KERN_DEBUG \"Goodbye! But remember, printk is amazing.\");\n}\n// End of\
  \ cleanup section\nmodule __init (entrance);\nmodule __exit(out);\nMODULE_LICENSE\
  \ (\"BSD\");\n// End of module licensing section\n```\n\n#### Printk 示例 #2\n\n```c\n\
  #include <linux/kernel.h>\n#include <linux/module.h>\n// end of header include section\n\
  #define __KERNEL__\n#define MODULE\n#define LINUX\n// end of macro define section\n\
  static int entrance(void){\n  printk(KERN_DEBUG \"Simple and Basic Printk example\
  \ : FILE: %s, LINE : %i\\n\", __FILE__, __LINE__);\n  return 0;\n}\n// end of init\
  \ section\nstatic int out(void){\n  printk(KERN_DEBUG \"Goodbye! But remember, printk\
  \ is amazing: FILE: %s, LINE : %i\\n\", __FILE__, __LINE__);\n}\n// End of cleanup\
  \ section\nmodule __init (entrance);\nmodule __exit(out);\nMODULE_LICENSE (\"BSD\"\
  );\n// End of module licensing section\n```\n\n## 第 9 章：加载和卸载 LKM\n\n### 按需加载和卸载\
  \ Linux 内核模块 (LKMs)\n\nLinux 内核有一个强大的功能，它可以自动加载和卸载 LKM，这有助于避免浪费内核进程和内存。但要使用这项支持或功能，我们需要需要在编译内核之前的配置内核时启用\
  \ `kmod` 模块。\n\n大多数发行版如 Redhat、Debian、Ubuntu、CentOS 等都带有启用的 `kmod`。`kmod` 功能或支持随\
  \ `libkmod.so` 库一起。\n\n`libkmod` 库的内容：\n- `insmod`\n- `rmmod`\n- `depmod`\n- `modprobe`\n\
  - `modinfo`\n- `lsmod`\n\n`insmod` 用于将模块插入 Linux 内核。\n注意：`insmod` 需要传递完整路径和按正确顺序排列模块列表（依赖模块）。如果我们考虑\
  \ `nfs.ko`，它需要以下相关顺序的模块：\n\n1. `nfs_common.ko`\n2. `auth_rpcgss.ko`\n3. `fscache.ko`\n\
  4. `lockd.ko`\n5. `sunrpc.ko`\n\n`rmmod`\n`rmmod` 从 Linux 内核中卸载模块。如果我们想卸载或移除模块，必须运行以下命令：\n\
  `$ rmmod modulename`\n例如，我们有一个模块 `vfat`，我们需要卸载它。那么命令将是：\n`$ rmmod vfat`\n注意：在 Linux\
  \ 内核中还有另一种卸载或移除模块的方法。那是 `modprobe –v –r`。在这里移除 `vfat` 的命令为：\n`$ modprob –v –r vfat`\n\
  其中，`r` 是 remove 的缩写，`v` 代表 verbose（详细）。\n\n`depmod`\n`depmod` 与现有的模块集一起。它根据命令行中提到的现有模块集或从配置文件指定的目录中找到的符号，创建一个依赖文件。\n\
  `depmod` 创建一个类似于 `Makefile` 的依赖文件，`modprobe` 用它自动加载正确的模块或模块栈。\n注意：`depmod` 文件可以在\
  \ `/lib/modules/kernel-version/modules.dep` 找到。\n\n`modinfo`\n`modinfo` 程序显示 Linux\
  \ 内核模块的信息。它显示每个模块的以下信息：\n1. 模块作者\n2. 许可证\n3. 参数\n4. 依赖关系\n5. 模块描述\n6. 模块完整路径\n\n\
  `lsmod`\n`lsmod` 程序显示当前加载的模块。它显示以下：\n1. 模块名称\n2. 模块大小\n3. 使用计数和引用模块列表\n\n`modprobe`\n\
  `modprobe` 程序向 Linux 内核添加或删除模块。它查看 `/lib/modules` 中的所有模块。它是如何工作的？通过 `depmod` 生成的\
  \ `dep` 文件。\n\n## 第 10 章：设备驱动程序简介\n\n### 设备驱动程序简介\n\nLinux 内核大部分源码都在设备驱动程序中。drivers\
  \ 目录包含了所有的 Linux 设备驱动源码。该目录有以下部分：\n\n* `/block`\n  - 块设备驱动位于此处。\n  - 块设备包括 IDE 和\
  \ SCSI 设备。\n* `/char`\n  - 字符设备驱动位于此处。例如 `tty`。\n* `/cdrom`\n  - Linux 的 CDROM 代码位于此目录。\n\
  * `/pci`\n  - PCI 伪驱动位于此目录。\n* `/scsi`\n  - Linux 支持的所有 SCSI 设备驱动程序位于此处。\n* `/net`\n\
  \  - 网络设备驱动位于此处。\n* `/sound`\n  - 所有声卡驱动位于此处。\n\n### 什么是设备驱动程序？\n\n设备驱动程序最终设计和开发用于控制或操作连接到系统的特定类型硬件。换句话说，设备驱动程序由大量告诉系统如何通信、操作或控制硬件的代码组成。内核使用设备驱动程序来控制或通信硬件，而无需了解硬件的任何细节，例如硬件如何工作。驱动程序使用计算机的总线系统与设备通信，或通过连接硬件的其他通信系统通信。\n\
  \n内核何时调用设备驱动程序？\n\n* 检查设备可用。\n* 处理设备特定的输入/输出调用。\n\n\n\n\n\n* 用于向 `sysconfig` 工具执行用户空间请求。\n\
  * 通过处理中断来检查数据是否准备就绪。\n* 用于设置/重置以及初始化/重新初始化设备。\n* 从用户空间标准库的输入/输出调用执行输入/输出操作。\n\n\
  ## 用户空间、内核空间和硬件空间的设备驱动工作流程：\n\n* 在用户空间中，任何源程序或库都无法直接与硬件通信，因此它们向内核空间的源程序调用。\n* 尽管内核在系统中拥有最高权限模式，但内核并不尝试直接访问硬件，而是遵循一种约定。内核使用设备驱动程序与硬件通信。\n\
  * 内核空间中的设备驱动负责与硬件或设备通信，例如：打开设备、通过总线对外设设备寄存器进行读写操作，然后关闭设备。\n* 在硬件空间中，总线作为传输路径或通信路径，配合处理器与设备控制器之间的访问协议。当设备驱动从控制器的硬件寄存器读取数据或向写入数据时，数据将跨越总线传输。\n\
  * 在硬件空间中，控制器作为控制一个或多个设备的物理接口。\n\n## 第 11 章：用极其易懂的解释开发字符设备驱动\n\n### 解释 # 1\nLinux\
  \ 设备驱动分为几类：最常见的是块设备、字符设备和网络设备。在这里，我们将学习如何编写简单的字符设备。\n\n### 解释 # 2\n块设备的权限位类似于 `brw-rw--`，其中“b”代表块设备；字符设备的权限位类似于\
  \ `crw-rw--`，其中“c”代表字符设备。\n\n### 解释 # 3\n每个设备驱动都包含两个数字：主设备号和次设备号。主设备号用于区分驱动程序，相同的主设备号表示它们由同一个驱动程序控制。通过使用不同的次设备号，可以在一个驱动中创建多个设备驱动。主设备号和次设备号这两个数字共同决定一个设备驱动。\n\
  \n例如：\n```\nbrw-rw----  1 root disk 9,  0 May 17 10:15 sda\n```\n\n\n\n\n\n`brw-rw----\
  \  1 root disd 9,  1 May 17 10:15 sda1`\n\n这里，`sda` 和 `sda1` 的主号是 9，次号不同，分别为 0 和\
  \ 1。\n\n### 解释 #4\n\n任何 `/dev/xxx` 下的接口都遵循“一切皆文件”，因此设备驱动的操作实际上就是对文件的操作。我们可以认为设备驱动的\
  \ API 全都是关于文件操作，而设备驱动被用于定义/打开/读/写等功能。所有的文件操作都定义在内核头文件 `<linux/fs.h>` 的 `file_operations`\
  \ 结构体中。\n\n在接下来的设备驱动示例中，我们将看到 `file_operations` 结构体：\n\n```c\nstruct file_operations\
  \ gpio_fops = {\n    read    : gpio_read,\n    write   : gpio_write,\n    open \
  \   : gpio_open,\n    release : gpio_close,\n    owner   : GPIO_MODULE\n};\n```\n\
  \n在这里，我们声明了一个结构体并将其赋值给结构体变量 `gpio_fops`。除了 `owner` 之外，这些值都是函数指针。然后我们使用 `cdev_add`\
  \ 在初始化模块中为每个驱动注册文件操作结构体。\n\n## 开发一个微型 GPIO 字符设备驱动\n\n```c\n#include <linux/kernel.h>\n\
  #include <linux/module.h>\n#include <linux/moduleparam.h>\n#include <linux/init.h>\n\
  #include <linux/stat.h>\n#include <linux/cdev.h>\n#include <linux/device.h>\n#include\
  \ <linux/fs.h>\n#include <linux/slab.h>\n#include <asm/uaccess.h>\n#include <linux/string.h>\n\
  \n// 头文件包含结束\n#define DEVICE_MAJOR  200\n#define DEVICE_MINOR  0\n#define DEVICE_DEV_COUNT\
  \ 2\n\n// 定义结束\n\nstatic int gpio_open(struct inode *, struct file *);\nstatic ssize_t\
  \ gpio_read(struct file *, char *, size_t, loff_t *);\nstatic ssize_t gpio_write(struct\
  \ file *, const char *, size_t, loff_t *);\nstatic int gpio_close(struct inode *,\
  \ struct file *);\n\nstruct file_operations gpio_fops = {\n    read    : gpio_read,\n\
  \    write   : gpio_write,\n    open    : gpio_open,\n    release : gpio_close,\n\
  \    owner   : GPIO_MODULE\n};\n\nstruct cdev gpio_cdev;\nstatic char *dev_c_message\
  \ = NULL;\n\nstatic int entrance(void) {\n    // 获取设备号\n    // 设备 ID 使用类型 dev_t\
  \ 来表示。\n    dev_t devno;\n    unsigned int count = DEVICE_DEV_COUNT;\n    int err;\n\
  \n    // 设备 ID 由两部分组成：主 ID（用于识别设备类）\n    // 和次 ID（用于识别该类中特定设备的实例）。\n    // 给定主设备和次设备\
  \ ID，makedev() 将这些合并以产生\n    // 设备 ID，并作为函数结果返回。\n    // 主号和次号是 Linux 识别与设备文件相关的底层硬件设备的方式。\n\
  \    // 大多数情况下主号标识驱动程序，而次号区分驱动程序控制的不同设备。\n    devno = MKDEV(DEVICE_MAJOR, DEVICE_MINOR);\n\
  \n    // register_chrdev_region 函数 — 注册设备设备号\n    // 参数为 (dev_t from, unsigned count,\
  \ const char * name);\n    // from - 目标设备号范围中的第一个；必须包含主号。\n    // count - 需要的连续设备号数量\n\
  \    // name - 设备或驱动程序的名称\n    register_chrdev_region(devno, count, \"gpiodev\"\
  );\n\n    // cdev_init — 初始化一个 cdev 结构体\n    cdev_init(&gpio_cdev, &gpio_fops);\n\
  \    gpio_cdev.owner = GPIO_MODULE;\n\n    // cdev_add 向内核注册一个字符设备。\n    // 内核在\
  \ cdev_map 下维护了一个字符设备列表\n    err = cdev_add(&gpio_cdev, devno, count);\n    if (err\
  \ < 0) {\n        printk(\"Error: While Adding Device\\n\");\n        return -1;\n\
  \    }\n\n    printk(\"TINY GPIO Device Driver.\\n\");\n    printk(\"'mknod /dev/gpiodev_0\
  \ c %d 0'.\\n\", DEVICE_MAJOR);\n    printk(\"'mknod /dev/gpiodev_1 c %d 1'.\\n\"\
  , DEVICE_MAJOR);\n\n    // kmalloc 是内核中为小于页大小的对象分配内存的标准方法。\n    dev_c_message =\
  \ (char *)kmalloc(32, GFP_KERNEL);\n    if (dev_c_message != NULL) {\n        printk(\"\
  kmalloc dev_c_message: 0x%p\", dev_c_message);\n    }\n    return 0;\n}\n// 初始化部分结束\n\
  \nstatic void out(void) {\n    dev_t devno;\n    printk(\"Bye TINY GPIO Driver\\\
  n\");\n    if (dev_c_message) {\n        // 释放相关内存\n        kfree(dev_c_message);\n\
  \    }\n    // 释放微型字符设备\n    devno = MKDEV(DEVICE_MAJOR, DEVICE_MINOR);\n    //\
  \ unregister_chrdev_region — 注销设备设备号范围\n    unregister_chrdev_region(devno, DEVICE_DEV_COUNT);\n\
  \    // cdev_del — 从系统中删除 cdev\n    cdev_del(&gpio_cdev);\n}\n// 清理部分\n\nstatic\
  \ int gpio_open(struct inode *inode, struct file *fil) {\n    int dev_major;\n \
  \   int dev_minor;\n    dev_major = MAJOR(inode);\n    dev_minor = MINOR(inode);\n\
  \    printk(\"\\nTINY GPIO DEVICE: OPEN : %d %d\\n\", dev_major, dev_minor);\n \
  \   return 0;\n}\n\nstatic int gpio_close(struct inode *inode, struct file *fil)\
  \ {\n    int dev_major;\n    int dev_minor;\n    dev_major = MAJOR(inode);\n   \
  \ dev_minor = MINOR(inode);\n    printk(\"\\nTINY GPIO DEVICE: CLOSE : %d %d\\n\"\
  , dev_major, dev_minor);\n    return 0;\n}\n\nstatic ssize_t gpio_read(struct file\
  \ *filp, char *buff, size_t len, loff_t *off) {\n    int dev_major;\n    int dev_minor;\n\
