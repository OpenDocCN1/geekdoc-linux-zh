  lsmod | grep gpiodriver\ncat /proc/devices | grep gpiodriver\ndmesg | tail -10\n\
  ```\n\n## 附录 A：Linux 内核编码风格\n\n### 缩进\n最重要的规则之一，因为 Tab 占用 8 个字符，所以缩进也是 8 个字符。现在，有些程序员声称\
  \ 8 字符的缩进会导致代码向右移动太远，难以在 80 字符的屏幕上查看。解决这个办法是，如果你需要超过 3 级的缩进，你就需要修复你的源码。8 字符缩进让阅读变得更简单，并且在函数嵌套过深时具有额外的警示作用。\n\
  \n```c\nswitch (test) {\n    case '1':\n    case '2':\n        data <<= 2;\n   \
  \     break;\n    case '3':\n    case '4':\n        data <<= 4;\n        break;\n\
  \    case '5':\n    case '6':\n        data <<= 6;\n        break;\n    case '7':\n\
  \    case '8':\n        data <<= 8;\n        break;\n    case '9':\n    case '10':\n\
  \        data <<= 10;\n        break;\n    default:\n        break;\n}\n```\n\n\
  - 在单行内不要进行多次赋值。内核代码应该是极其简单、易于阅读和理解的。\n- 让你的表达式变得易于理解。\n- 不要在行尾留有空白字符。\n- 在单行内不要放置多个语句。\n\
  \n### 长行折行\n强烈建议将行长度限制在 80 列以内。永远不要打破此规则。任何超过 80 列的语句都必须拆分成几部分，超过 80 列会显著降低源码的可读性，且不会隐藏任何信息。\n\
  \n### 空格的放置\n在关键字后使用空格（例外是那些像函数且通常与括号一起使用的关键字，例如 `if`、`attribute`、`sizeof`、`typeof`）。不要在括号内部使用空格。\n\
  \n### 大括号的位置\n建议在结构定义处使用大括号。\n```c\nif (input) {\n    input++;\n} else switch (input)\
  \ {\n    case 1:\n        input++;\n        break;\n    case 2:\n        input++;\n\
  \        break;\n    default:\n        break;\n}\n```\n在函数定义处使用大括号。\n```c\nvoid\
  \ function(void) {\n    // ...\n}\n```\n在 `if` 语句中使用大括号。\n```c\nif (condition) {\n\
  \    // ...\n}\n```\n在 `switch` 语句中使用大括号。\n```c\nswitch (variable) {\n    case 1:\n\
  \        // ...\n        break;\n}\n```\n\n\n "
