    # How Ethernets Work


    In any network, the key question is how data gets onto the network in the first
    place, and how it gets delivered to the right place. In the Ethernet, these questions
    are answered, respectively, by two protocols, called Carrier Sense Multiple Access/Collision
    Detection (CSMA/CD) and MAC addresses.


    # CSMA/CD


    When a workstation originates data, there is danger another workstation will attempt
    to do so at exactly the same time. The result is a collision, which destroys the
    data from both workstations. To prevent collisions, the Ethernet uses a technique
    called Carrier Sense Multiple Access/Collision Detection (CSMA/CD).


    The basic principle of CSMA/CD is “listen before speaking.” Workstations do not
    transmit data if the network is busy; they wait until the network is free. Even
    so, there is a chance that two workstations will begin transmitting simultaneously.
    The result is a collision. With CSMA/CD, the workstation can detect when a collision
    has occurred. After a collision is detected, the workstation waits for a period
    of time that is determined by a ran-'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'domization algorithm, and then attempts to retransmit the message. The theory
    is that, due to the randomization factor, the two जानी involved in the collision
    will not begin retransmitting at the same time.


    Careful studies show that CSMA/CD is an effective measure against collisions and
    ensures that properly designed Ethernets transfer data at or close to their rated
    capacity. A properly designed network does not exceed the maximum number of workstations
    per collision domain.


    # MAC Addresses


    To make sure data is delivered to the right place, Ethernet devices are assigned
    a fixed address, called the MAC address (MAC is short for Media Access Control).
    These MAC addresses are assigned by the device''s manufacturer and are unique
    to the device.


    # Ethernet Hardware


    To build an Ethernet, you will need some or all of the basic hardware building
    blocks, which include transceivers, Ethernet adapters, hubs, repeaters, bridges,
    routers, and switches. Simple Ethernets don''t require all of this equipment,
    but you will need cables, Ethernet adapters for each computer, and a hub.


