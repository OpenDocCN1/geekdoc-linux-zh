    Change your configuration files to match these sample files as required.


    You also need the correct user names on your FTP server. When others try to connect
    to your FTP server, they will need a username and password on your FTP server
    computer.


    In the fthosts file, use the allow and deny commands to set up the computers allowed
    to access your FTP server. Unlike the configuration files for Samba, NFS, and
    Apache, the allow list does not supersede what you put in the deny list.


    For your small network, it is simplest to add to this file a line similar to the
