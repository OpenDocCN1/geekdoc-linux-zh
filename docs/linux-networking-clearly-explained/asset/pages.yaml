  md: 'CHAPTER 1 • CREATING A DIAL-UP INTERNET CONNECTION 33


    +   4. Click the Modem tab and try the Query Modem button again. If the modem
    still does not respond and you are sure you have got the serial port right, it
    is possible your IRQ settings are incorrect; check the next section to find out.


    # ## Is Your Modem''s IRQ Configured Correctly?


    Now make sure your modem is set to the correct interrupt request (IRQ) line. To
    determine the current IRQ assignment for the serial port to which your modem is
    connected, type `setserial /dev/modem` at the Linux prompt, and press Enter. You
    will see the current port assignment and IRQ. Now shut down your system and examine
    your modem. If your modem has jumpers that enable you to configure the port manually,
    examine the jumpers to make sure that they match the port that you are using the
    PPP Configuration Device Tab. If not, change the jumpers so that they match.


    If this did not work, it is possible that your system''s serial port settings
    have been altered so that they are using a non-standard IRQ configuration. To
    check the configuration, restart your system and press the key that enables you
    to enter your computer''s startup menu (where you can examine the BIOS and other
    settings). Find the area where serial ports are listed, and make sure that these
    settings have not been changed from the defaults (COM 1 should be set to 0x3f8
    and IRQ 4, while COM 2 should be set to 0x2f8 and IRQ 3. If these settings were
    changed, try resetting them to the defaults.


    Now try autodetecting your modem again. No luck? Compatre, junk that modem, and
    get one that is Linux compatible.'
