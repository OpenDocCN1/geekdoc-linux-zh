    are using two network cards (e.g., your gateway computer), ping each IP address
    in separate commands.


    +   ping your_computer_name. Substitute the host name of your computer. If you
    do not know your host name, check your `/etc/hosts` or `/etc/HOSTNAME` file. If
    this does not work, you may have a problem with these files on your local computer.


    +   ping other_ip_address. Substitute another IP address on your local network.
    Refer to your `/etc/hosts` file if required. If there is a problem, check the
    connections and cables between your computer and the computer with this address.
    If your network is not too large, repeat this command for the other computers
