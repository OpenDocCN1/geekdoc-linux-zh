    # Essential Networking Concepts


    A network is a group of two or more computer systems that have been linked together
    by some kind of physical communications medium. In the first two chapters, you
    set up your modem to establish a link between your computer and your Internet
    service provider''s computer. This simple network creates a big payoff. Your ISP''s
    system serves as gateway to the Internet, the largest computer network in existence.


    # Physical Media


    Most people think of computer networks in terms of cabling, but the physical medium
    is actually the least'
