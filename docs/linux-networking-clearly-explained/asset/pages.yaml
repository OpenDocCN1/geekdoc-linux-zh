    # Using FTP Clients


    Now that you have set up the FTP server, you need an FTP client. Once both are
    set up, you can transfer files between server and client. In this section, you
    will learn about one of the major Linux graphical FTP clients known as gFTP.


    The gFTP tool was developed by the Simple End User Linux project as part of the
