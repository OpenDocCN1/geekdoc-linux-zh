    /home/mike frodo.mydomain.org

    /home/bryan rivendell.mydomain.org

    /usr/doc (everyone)

    /usr/share/fonts(everyone)

    ```


    The export lists shows the available directories. It also shows which machines
    may access them. The /home/mike directory is available only to frodo.mydomain.org.
