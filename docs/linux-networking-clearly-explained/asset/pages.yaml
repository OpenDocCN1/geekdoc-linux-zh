    in /rpm -qf /usr/bin/top).


    # Checking for SUID Executables


    An executable file can be given an attribute called user ID (SUID), which means
    that any user executing the file receives the privileges of the file''s owner.
    If the file''s owner is the root user, that means that anyone executing the file
    gets the root user''s privileges, at least as far as the executable''s behavior
    is concerned.


    Some executables need to be SUID. An example is /bin/passwd, the password-changing
    utility; if this utility was not configured with SUID, users would not be able
    to change their passwords. Still, SUID executables present a'
  merge: -1
