  md: '# Domain Name Service (DNS) and Domain Names


    As the previous section explained, every host connected to a TCP/IP network has
    its own, unique IP address. However, people find it is difficult to work with
    IP addresses. Moreover, a given machine’s address may change if it is connected
    to a different network. In the early days of TCP/IP, the network had to be maintained
    by manually adding all IP address changes to files stored on every network host.
    Obviously, this approach is inefficient and soon became unworkable. The domain
    name service (DNS) solves this problem by providing an automated means of mapping
    people-friendly domain names (such as www.yahoo.com) to specific IP addresses.


    The domain name service is a worldwide service that involves the use of servers
    at many levels. If you are creating a small private network, you can revert to
    the early days of TCP/IP and implement your internal domain name service by means
    of tables kept on each computer. The file that contains this information is called
    /etc/hosts. You can also run a DNS server on your internal network, should the
    task of keeping every computer’s /etc/hosts file up-to-date become too tedious.
    This is the technique used to configure /etc/hosts for a small internal network.


