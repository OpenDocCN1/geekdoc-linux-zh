    # Securing Your System with IP Chains


    The Linux kernel can be set up to serve as a comprehensive and highly effective
    firewall, a barrier between your network and the Internet. You can configure this
    barrier to make sure that outsiders cannot easily gain entry into your network.


    The ideal configuration for a firewall involves the use of a gateway system with
    two Ethernet cards, each of which has its own, unique IP address. Because all
    incoming traffic must pass through the gateway machine to reach your network,
    you can intercept and thwart unwanted accesses. To do so you will need to configure
    the ipchains utility. The following sections show you how to configure your system
    using ipchains to act as a highly effective firewall for your network.


    Using ipchains can be difficult for novice users. Fortunately, there are tools
    available that make the process of creating an ipchains-based firewall relatively
    easy. One such tool is available online at http://www.linux-firewall-tools.com.'
