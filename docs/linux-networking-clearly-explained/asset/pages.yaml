  md: '# Looking Under the Hood


    This chapter has mentioned a few of the essential files that determine the way
    Linux works with TCP/IP. This section introduces all of the important TCP/IP configuration
    files and indicates the role they play in your Linux system''s configuration.


    # /etc/sysconfig


    In most Linux distributions, network interfaces are defined by scripts placed
    in the /etc/sysconfig/network-scripts directory. For example, the following script
    (called ifcfg-eth0) defines the network interface for eth0 (the first detected
    Ethernet card). It does so by specifying the boot protocol (the options are static,
    bootop, or dhcp), the broadcast address, the adapter''s IP address, the default
    netmask, the network address, and the startup option (“yes”) means the interface
    is automatically activated when your system is booted:


    ```

    DEVICE=eth0

    BOOTPROTO=static

    BROADCAST=192.168.100.255

    IPADDR=192.168.100.10

    NETMASK=255.255.255.0

    NETWORK=192.168.100.0

    ONBOOT=yes

    ```


    Although you can edit such scripts manually, your course of action lies in using
    your Linux distribution''s default network configuration utility to define basic
    network interfaces.'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# /etc/sysconfig/network


    The most basic TCP/IP configuration file, /etc/sysconfig/network, enables TCP/IP
    networking and defines basic networking settings. (Note that this file may be
    located in a directory other than /etc/sysconfig on some Linux distributions.)
    A typical /etc/sysconfig/network file contains the following:


    ```

    NETWORKING=yes

    FORWARD_IPV4=no

    HOSTNAME=lothlorien.mydomain.org

    GATEWAY=192.168.100.7

    GATEWAYDEV=

    ```


    This first line in this file specifies that TCP/IP networking is enabled, the
    second turns IP forwarding off; these settings are appropriate for a single-user
    workstation that is connected to a LAN or the external Internet. The HOSTNAME
    line specifies the name of this computer, as it is defined for TCP/IP purposes.
    The GATEWAY line contains the IP address of the gateway device, if any, is used
    to access the external Internet. (This line is not needed if you are accessing
    the Internet by means of a modem.)


    # /etc/hosts


    One of several essential TCP/IP configuration files, /etc/hosts indicates the
    IP addresses of the computer''s loopback interface and that of the default network
    interface. A typical /etc/hosts file looks like the following:


    ```

    127.0.0.1 localhost.localdomain localhost

    192.168.100.10 lothlorien.mydomain.org lothlorien

    ```'
  merge: -1
