  md: '# Determining Whether the Remote Directories Are Available


    At one of the client machines, switch to superuser, if necessary, and type the
    following command:


    ```

    /usr/sbin/showmount -exports server

    ```


    Here, *server* is the IP address of the computer that is running the NFS server.
    Here is an example of a valid showmount command:


    ```

    /usr/sbin/showmount -exports 192.168.100.34

    ```


    If you set up your /etc/hosts file correctly (see Chapter 5) so that all the hosts
    on your network are listed with IP addresses and aliases, you can type the alias
    instead of the IP address, as in the following example:


    ```

    /usr/sbin/showmount -exports lothlorien

    ```


    If you see the message “RPC: Program not registered,” it means that showmount
    was not able to find the server, or that the server is not running the NFS daemons.
    Re-check your installation, and try again.


    A successful command shows something like the following:


    ```

