  md: '# CHAPTER 10 SHARING AN INTERNET CONNECTION 245


    rc.firewall file. Use a text editor such as vi, emacs, or a GUI text editor that
    you can start through the Main Menu button.


    Now look at the first ipchains commands in a typical rc.firewall file. These seven
    commands, in this order, block all traffic. Once you understand these commands,
    check them against your rc.firewall file.


    +   - ipchains -F. Eliminate (“flush”) any previous ipchains commands.

    - ipchains -P input DENY. Stops all data from coming to your modem server.

    - ipchains -P output REJECT. Stops all data from your local computer.

    - ipchains -P forward DENY. Stops all data coming from the other computers on
    your network intended for the Internet.

    - ipchains -A input -i -j ACCEPT. Allows input to your loopback interface.

    - ipchains -A output -i -j ACCEPT. Allows output from your loopback interface
    to your computer.

    - ipchains -A input -i eth0 -j ACCEPT. Accepts input from your local network,
    assuming it is set up on the eth0 device. Substitute accordingly if you are using
    another device to connect to your local network.

    - ipchains -A output -i eth0 -j ACCEPT. Allows output from your modem server to
    your local network, assuming it is set up on the eth0 device.


    TIP If you prefer to use the ipfwadm commands, you will actually find information
    in the IP Chains-HOWTO and the Firewall and Proxy Server-HOWTO, available online
    at http://www.linuxdoc.org.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# PART THREE • CONNECTING YOUR LAN TO THE INTERNET


    To summarize, the first four commands stop all access to your modem server computer.
    Then the last three commands modify these rules by allowing access through your
    loopback and local network interfaces.


    Now you can add the command that allows you to send and receive basic information
    to the Internet:


    ```

    ipchains -A forward -i ppp0 -s

    192.168.0.0/24 -j MASQ

    ```


    This is an important command. Review how it works, from the standpoint of your
    modem server, in the following steps.


    +   1. ipchains. Tells Linux to execute this command, with any modifications that
    follow.

    2. -A. Adds the following (IP Chains) rule to any that you have set up so far.

    3. forward. Linux applies this rule to any data forwarded through your modem server.

    4. -i. Linux applies this rule to the following network interface.

    5. ppp0. The network interface. This is the most common device name for a modem.
    If you are using a different device, substitute accordingly.

    6. -s. Short for source. Linux applies this rule for any data that comes from
    the following IP addresses.

    7. 192.168.0.0/24. The source addresses. This specifies a source network address
    of 192.168.0.0. The /24 corresponds to a subnet mask of'
  merge: -1
  pgno: 257
- img_proc: true
  md: '255.255.255.0. In other words, this rule applies to all computers on your internal
    network with IP addresses between 192.168.0.0 and 192.168.0.255. If you are using
    a different internal network address, substitute accordingly.


    +   8. -j. If the data comes from your internal networkr (as defined in step 7),
    act on the next command.


    +   9. MASQ. Enable masquerading.


    In other words, this command sets up masquerading for all of the computers on
    your internal network. Any data from your network are sent out through your modem
    (ppp0). From the outside, it appears that the data are coming from your modem
    server. Because others on the Internet cannot identify the computers behind your
    modem server, they cannot attack them as easily.


    This command also works for the reverse process, that is, for information coming
    to your internal computers from the Internet.


    Once you have saved these changes to your rc.firewall file, restart dial to activate
    these changes.


    To make sure your firewall rules are read when you reboot Linux, you''ll need
    to add the following command to the same file where you added the dial command
    in the Automatic Configuration section of this chapter.


    ```

    echo "Loading the re.firewall ruleset.."

    /etc/rc.d/rc.firewall

    ```


    If your firewall script has a different name or location, substitute accordingly.
    Remember to make and save your changes with a text editor.'
  merge: -1
