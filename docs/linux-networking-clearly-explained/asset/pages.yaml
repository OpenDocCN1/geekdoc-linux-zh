    to find out how to select start-up services, if you are not sure.


    # Creating Linux Accounts for Windows Users


    To get Samba to work correctly, you need to set up accounts on the Linux server
    that duplicate the username and password that users supply to the Windows network
    login dialog box.


    Why do you need to set up these accounts? Windows clients provide no logical way
    to supply a username when a Windows user makes a Samba connection. Instead, the
    Windows client sends the username that the user supplied in the Windows Networking
    login dialog box, which appears at the start of a Windows session. Unless you
    want to configure all your Samba services to be accessible to guest users, which
    would create a security hole, you'
  merge: -1
  pgno: 204
- img_proc: true
  md: 'need to set up Linux accounts in which the username-parallels the one that
    the Windows client is submitting. While you are at it, create these accounts with
    exactly the same password that Windows users supply in the Windows login box.
    If the user''s Linux password is the same as the same user''s password on the
    Windows client, users can access their Samba resources without supplying a password.


    To set up the user accounts, you can use the useradd utility or your Linux distribution
    configuration utility (such as LinuxConf on Red Hat and Red Hatderived systems).
    To set up an account for Suzanne with the password yai2bfw, log in as superuser,
    type useradd -p yai2bfw suanne, and press Enter. By default, this command creates
    a home directory (here, /usr/suzanne/); if the command fails to do this, it means
    the value CREATE_HOME is turned off in /etc/login.def. To change this behavior,
    edit /etc/login.def. If CREATE_HOME is set to no, change it to yes; if the value
    does not appear, type CREATE_HOME yes and save the file, and run useradd.


    # Deciding Whether to Use Encrypted Passwords


    Next, you will need to consider whether you want to use plain text or encrypted
    passwords. If you want to use plain text passwords, you will need to modify the
    Windows clients; if you want to use encrypted passwords, you will need to modify
    your Samba installation, as explained in the next section.


    For the best security, you should use encrypted passwords. By default, Samba uses
    plain text passwords, which means that passwords are sent as ordinary text'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# CHAPTER 8 • CONFIGURING AND USING SAMBA 195


    over the network. These passwords could be detected by an intruder and used to
    gain access to confidential resources. This is not a problem in a small network
    in which all users are reasonably trustworthy. Still, it is not a bad idea to
    use encrypted passwords, even on a small network. As you have just learned, the
    most convenient way to configure Samba passwords is in using exactly the same
    usernames and passwords for the user''s Linux and Windows accounts. The downside
    is in what might happen if someone uses a packet sniffer to detect user passwords:
    they will get access to all of the user''s accounts, including their Linux accounts,
    and from there it is not very difficult to get into the rest of the server. In
    a large network connected to the Internet, or in a private network in which some
    workstations are placed in insecure locations, you must use encrypted passwords.


    If you decide to use plain text passwords, you will need to modify Windows 95
    (Service Pack 2 and later), Windows 98, and Windows NT/2000 to disable the default
    password setting (encrypted passwords only). This involves changing one of the
    settings in the Windows registry and rebooting the system. Remember, if you opt
    for plain text passwords, you will need to modify all the Windows clients to work
    with plain text passwords, and you will have to remember to do so when somebody
    brings a new Windows client online. To find out how to modify the registry in
    various incarnations of Windows, see the Samba FAQ (http://us3.samba.org/samba/docs/FAQ/#28).


    # Setting Up Name Resolution Services


    To make sure the computers on your network can locate each other, you will need
    to implement some type of name resolution service. A name resolution service translates


    ![](img/3c27ab0cde9a71d6aefa5d84f96de8c9_206_0.png)'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# PART TWO • BUILDING YOUR LOCAL AREA NETWORK (LAN)


    between alphanumeric machine names (such as \lothrien) and IP addresses (such
    as 192.168.100.10). To implement name resolution services for SMB networking,
    you can choose between the following options:


    +   * Manually configuring each client. This option is suitable for very small
    networks only. You will need to create files on each client, as well as the server,
    that list all the machines on the network. The disadvantage of this technique
    comes into focus when you add a new machine to the network. You will have to update
    all these files manually.

    * Configuring Samba to function as a WINS server. It is very easy to configure
    Samba to act as a WINS server for SMB name resolution. This is the recommended
    option, even for small network.


    # Configuring Name Resolution Services Manually


    To implement name resolution without running a WINS server, you will need to provide
    a file on each computer that lists the numerical IP address and domain name of
    all the computers on the network. On the Linux systems, you can do this by adding
    entries to /etc/hosts (see Table 8.1); the entries use a three-column format beginning
    with the numerical IP address, the fully qualified domain name (FQDN), and aliases,
    if any. On the Windows systems, you must create and save a file c:\windows\HOSTS
    that contains exactly the same information.


    Table 8.1 Sample /etc/hosts and c:\windows\HOSTS Files


    | 127.0.0.1 | localhost.localdomain | localhost |

    | 192.168.100.10 | frodo.mydomain.org | frodo |

    | 192.168.100.33 | bag-end.mydomain.org | bag-end |

    | 192.168.100.34 | strider.mydomain.org | strider |'
