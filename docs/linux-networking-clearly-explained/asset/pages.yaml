    password: Is2upoM8. Note that each letter (or number) in this password is the
    first letter in the sentence. And remember, Linux passwords are case sensitive.
    In other words, Is2upoM8 is different from is2upom8.


    # Configure /etc/hosts.allow and /etc/hosts.deny


    You may have already undertaken this step in previous chapters. Switch to root
