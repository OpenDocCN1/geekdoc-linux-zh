    # Configuring Samba: An Overview


    Samba relies on a single, text-based configuration file, called /etc/smb.conf.
    Most versions of Samba come with a sample configuration file that is very well
    documented by means of comments placed in the file. (Samba ignores any line that
    begins with a semicolon or hash mark.) You can get Samba working in short order
    by using a text editor to make a few changes to this file. If /etc/smb.conf doesn''t'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# CHAPTER 8 • CONFIGURING AND USING SAMBA 203


    exist, or is blank for some reason, you can type in the necessary information
    from the examples supplied in this section.


    The Samba configuration file is divided into two major sections, that is, the
    [global] section and a subsequent portion that defines specific shares (resources
    available over the network). The [global] section contains settings that affect
    Samba''s overall operation. The section defines resources on the local system,
    called shares, that are accessible to qualified users via network connections.


    # Creating a Basic Samba Configuration


    To get a basic Samba configuration running, follow these steps:


    +   1. Log in as root user or superuser, start a text editor, and open /etc/smb.conf.

    2. In the [global] section, find the workgroup setting. Change the default name
    (WORKGROUP), if necessary, to the setting you typed in each Windows workstation''s
    Identification dialog box. Here is an example:

    ```

    workgroup = MAGICAL

    ```

    3. Locate the line that begins with "server string," and uncomment the line, if
    necessary. Type the name that will identify this server in the Network Neighborhood
    window on Windows systems, such as server string = Lothlorien (note that the name
    cannot exceed 15 characters). This name need not'
