  md: '# Configuring Log Files


    Many network services and applications maintain log files, which contain confirmation
    and error messages. You will find the various log files in the /var/log directory.


    As with everything else in Linux, log files are controlled by a configuration
    file. In Red Hat Linux, they are configured in the /etc/syslog.conf file. By default,
    the configuration file sends network messages to the /var/log/messages file. Go
    into root or superuser mode and review your log messages by typing the following
    and pressing Enter:


    ```

    _cat /var/log/messages | less

    ```


    Chances are good that this is a very long file that scrolls through your screen
    for some time. Now open your /etc/syslog.conf file in your favorite text editor.
    Make sure the following commands are included in this file:


    ```

    _auth.* /var/log/secure

    authpriv* /var/log/secure.a

    ```


    These commands capture any attempt to log on as or any user, including the root
    user. When you review these log files, you can see if someone is trying to log
    on when no one should be on your network, such as during the middle of the night.


    On Red Hat systems, the file called /etc/syslog.conf determines the type of information
    the kernel records in system logs. This particular log file records key events
    on your system in the following categories:


    +   * Kernel. As Linux loads on your system, the kernel loads various modules,
    such as for Ethernet adapters'
  merge: -1
  pgno: 363
- img_proc: true
  md: '(eth0) and modems (ppp0). As you boot Linux, you can see when this process
    is and is not successful. Alternately, you can observe what happened when you
    started Linux on your computer with the dmesg command.


    +   * Info. Information level messages tell you when Linux daemons start as Samba,
    stop, or change settings. Review this on your own computer through the /var/log/messages
    file.


    +   * Mail. Unless you set up a mail server on your network, you should not see
    any messages in your mail log file. Check the file set up to receive mail log
    messages. Unless this file is empty, a mail server such sendmail is running on
    your Linux computer. Unless you want to run your own mail server, you should shut
    it down. You can use the tksys utility given later in this chapter to deactivate
    servers such as sendmail.


    The default syslog.conf file is very basic. You can divide each log into different
    categories. For example, if you want all warnings about users who log on with
    a bad password in one file, insert the following command in the syslog.conf file:


    ```

    _authpriv, auth.=warning

    /var/log/auth/auth.warning

    ```


    This saves all problem logon attempts to the /var/log/auth/auth.warning file.
    When you edit the /etc/syslog.conf file, you can activate your changes in root
    or super user mode with the killall -HUP syslogd command. For more information
    on editing the syslog.conf file, review the syslog.conf manual. Go into a command
    line interface, and enter the man syslog.conf command.'
  merge: -1
  pgno: 364
- img_proc: true
  md: '354


    PART FIVE • MANAGING YOUR NETWORK


    > TIP Unmaintained log files often fill up hard drives. By default, Red Hat Linux
    uses the logrotate utility to keep log files rotated on a weekly basis. If your
    logs get too too big, you can change how logs are recorded in your /etc/logrotate.conf
    file.


    # Finding Suspicious Activity In Your Logs


    Generally, a user needs to log in to do any damage to your system. To log in,
    users need a password. Any attempt to login with a good or a bad password is recorded
    in log files. Based on the default /etc/syslog.conf file, logins are recorded
    in /var/log/secure.


    To check for login attempts with a bad password, log in as the root user, type
    the following, and press Enter:


    ```

    _grep refused /var/log/secure*

    ```


    This command tells the grep text-searching utility to examine all the files with
    names beginning with “secure” in the /var/log directory. These files contain records
    concerning login attempts.


    > TIP if /etc/syslog.conf calls for the creation of /var/log/secure, but no such
    file exists, this is not good news. An intruder may have erased this file—or set
    its byte count to 0—to cover up the intrusion.


    If grep does not find anything, check the /var/log directory to make sure that
    the secure files exist (you should see secure, secure.1, secure.2, secure.3, and
    so on). Also, make sure that they contain something; type ls -l and press Enter,
    and check the file sizes. If all of the files contain zero bytes, and you have
    been logging in and out'
