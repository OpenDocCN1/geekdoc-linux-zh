    # Looking Under the Hood


    You can use standard Linux utilities to learn how your Ethernet adapter is performing.


    To view the current status of your adapter and view statistics concerning the
    adapter''s operation, switch to super, type cat /proc/net/dev, and press Enter.
    You will see a wealth of statistics about the adapter''s performance, including
    the number of bytes received and transmitted, the number of collisions and the
    number of errors. If the number of collisions is 25% or more of the number of
    bytes transmitted, consider dividing your network into segments, as explained
    earlier in this chapter.


    You can use the ping utility to determine how speedily given workstations on your
    LAN receive and return data. To see how fast your network is operating, type ping
    followed by the address of one of your network''s workstations, and press Enter.
    To see how speedily 192.168.100.33 responds, for example, you would type ping
