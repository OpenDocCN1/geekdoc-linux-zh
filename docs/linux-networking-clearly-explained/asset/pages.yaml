  md: '# Creating an Intranet FTP Server


    Now that you have learned different ways to share files between Linux, Windows,
    and Macintosh computers, it is time to discover an easier way to share files on
    your local network: the File Transfer Protocol, also known as FTP.


    Unlike NFS, samba, or netatalk, you cannot share printers or Internet connections
    with FTP. However, you can set up reasonably secure file transfers with FTP software.


    If file sharing is all you need on your network, FTP is the simplest choice. You
    do not need to share or mount directories and folders with FTP. You can simply
    log on, and then download and upload the files you need. As FTP is'
  merge: -1
  pgno: 312
- img_proc: true
  md: 'dedicated to file transfer, it is faster and more reliable than

    alternatives.


    There are two main components to ftp: a server and a

    client. The main server used on the Internet is known as

    wu-fptd, short for the Washington University (in St.

    Louis, Missouri) FTP daemon.


    # Introducing Wu-ftpd


    To use FTP on your network, you need a server and a

    client. All Linux distributions include one or more FTP

    clients. By default, several distributions install the Wash-

    ington University FTP Daemon (wu-fptd) as an FTP server.


    Washington University released wu-fptd version 2.4 in

    1994. When it was so successful that version 2.5 was not

    released until 1999. By that time, the WU-FTPD Devel-

    ment Group took over stewardship of this open source

    tool.


    The wu-fptd package, along with a FAQ, is available

    online from the WU-FTPD Development Group at

    http://www.wu-fptd.org. Additional documentation is

    available on Kurt Lanfield’s site at http://www.

    lanfield.com/wu-fptd.


    Even if wu-fptd is installed as part of your Linux distribu-

    t, you can not check if it is already running. It does not

    run as a separate process the way Apache, NFS, or samba

    does.


    The only way to check if wu-fptd is installed is with the

    package manager for your distribution. For example, you

    can use GnoRPM on Red Hat Linux, COAS on Caldera,'
  merge: -1
  pgno: 313
- img_proc: true
  md: 'CHAPTER 13  DECLARING ENTITIES AND NOTATIONS  303


    YaST on S.u.S.E., or Core’s Package Manager. You should also ensure that you have
    FTP or another FTP client installed.


    Running an FTP server can create a security hazard. When wrongly configured, an
    FTP server may allow users from other computers to browse through and download
    files from anywhere on your computer. Be aware that the wu-ftpd server is a popular
    target for crackers. To ensure security on your network, check the wu-ftpd Web
    sites frequently for security updates and patches.


    You can also set wu-ftpd for anonymous users. When you set up an anonymous FTP
    server, users do not need a user name or password on your computer. This is useful
    if you want to distribute larger files to the general public.


    Anonymous FTP can be a special security hazard. If you need to give anonymous
    users access to your FTP Server, it is best to set it up through your ISP.


    # Configuring Wu-ftpd


    Once you have installed wu-ftpd and ftp, the next step is to configure the TCP/IP
    superserver. In the next section, you will change the superserver configuration
    file /etc/inetd.conf so that your computer can listen for messages from FTP clients.


    In the following section, you set up wu-ftpd configuration files for access permissions,
    file compression, password encryption, and default users.'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# The Superserver Configuration File


    When you set up your Linux computer as a server, it listens for messages from
    clients. Linux servers listen as defined in the superserver configuration file.


    To modify the superserver file:


    +   1. Get your distribution’s documentation for the wu-ftpd server. The change
    that you make to the superserver configuration file varies with your distribution.


    +   2. Before modifying any configuration file, you should back it up. Copy your
    superserver configuration file, /etc/inetd.conf, in your home directory.


    +   3. If you did not log in as the root user, go into the superuser mode.


    +   4. Open the /etc/inetd.conf file in a text editor such as vi, emacs, or any
    text editor accessible through the Main Menu button.


    +   5. Search for a line that starts with ftp. It should appear somewhat as follows:


    ```

    ftp stream tcp nowait root

    usr sbin tepsd in.ftpd

    ```


    +   6. Cross-check the line against your distribution’s instructions for starting
    the wu-ftpd server. The variation is in the final part of the command; you may
    need to substitute in.ftpd -a, in.ftpd -l -a, or wu.ftpd -a.


    +   7. Save the /etc/inetd.conf file.'
