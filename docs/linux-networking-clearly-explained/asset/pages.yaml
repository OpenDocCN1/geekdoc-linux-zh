  md: '# Disabling Unused Server Daemons


    Make sure you are not running any server daemons, such as httpd or wu-ftp, that
    you do not need. To do so, you can use the SYSV Runlevel Manager, a standard package
    that is installed by default in most Linux distributions. To start the Runlevel
    Manager, open a terminal window, switch to superuser, type tsysv, and press Enter.
    (If you are running the K Desktop, use the ksysv command.) As long as this application
    is installed on your system, you will see the main Runlevel Manager window.


    The Runlevel Manager enables you to specify which services are started—and which
    are stopped—for each of the runlevels defined in your system. Note that Linux
    distributions vary in the way they define runlevels. The runlevels defined by
    Red Hat Linux are shown in Table 16.1. When you enter a runlevel, the Runlevel
