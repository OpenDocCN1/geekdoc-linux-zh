  md: '# Introducing Ipchains


    The following commands should be familiar from Chapter 10. You will learn to understand
    what these mean in more detail in the following sections.


    ```

    _ipchains -F

    ipchains -P input DENY

    ipchains -P output REJECT

    ipchains -P forward REJECT

    ```


    To summarize these commands, Linux first flushes (-F) any IP chains rules stored
    in memory. Then it stops (DENY, REJECT) any data coming into (input) or out (output)
    of your system, including anything your gateway computer may forward from your
    other computers. In other words, these rules create a wall between your network
    and the Internet. Nothing can get out or unless you explicitly allow it.


    As you can see, there are three different kinds of IP chains commands—for data
    that comes into your network, data coming out of your network, and data that is
    forwarded through your gateway computer.


    # Creating the Input Firewall


    You want to block messages from several sources, especially private IP addresses
    as identified in Chapter 5.


    You have already used some private IP addresses for your own local network. Although
    these addresses are not supposed to be used on the Internet, crackers use them
    to try to break into other networks.


    One example command that blocks a series of private IP addresses is shown here:'
  merge: -1
  pgno: 381
- img_proc: true
  md: '# CHAPTER 16 • SECURING YOUR NETWORK 371


    ```

    _iptchains -A input -i $EXTERNAL_INTERFACE -s $CLASS_A -j DENY -l

    ```


    This command adds (-A) a rule and applies it to data coming in (input) through
    the following interface (-i). You set the $EXTERNAL_INTERFACE to eth0, eth1 or
    ppp0, whichever interface is directly connected to the Internet. You are looking
    for data with a source address (-s) as defined by the variable $CLASS_A. You can
    set the variable to the Class A private IP addresses as defined in Chapter 5.


    If Linux finds data coming from one of these addresses, it jumps (-j) to DENY
    access. Finally, such attempts are logged (-l) for later analysis.


    # Output Firewall


    As strange as it may sound, you also want to prevent certain kinds of data from
    leaving your network. For example, you should block the export of shared directories.
    This applies to the Network File System, Windows (the Linux Graphical User Interface),
    and SOCKS, which is how most traffic travels through a proxy server. An example
    of the IP Chains command that stops exports is:


    ```

    _iptchains -A input -i $EXTERNAL_INTERFACE -p tcp -y \\

    \n--destination-port NFS_PORT -j DENY -l

    ```


    This command adds (-A) the following rule to data coming in (input) through the
    network interface (-i) connected to the Internet ($EXTERNAL_INTERFACE). IP chains
    check your data for the TCP protocol (-p). If it sees a TCP packet, it checks
    if the data coming in (is) an attempt to connect to your computer (-y) through
    the destination port for'
  merge: -1
  pgno: 382
- img_proc: true
  md: '# Part FIVE • MANAGING YOUR NETWORK


    your NFS Server ($NFS_PORT). If all of these conditions are met, IP chains jumps
    (-j) to DENY and then logs (-l) the request.


    # Creating the Forwarding Firewall


    You want your gateway computer to forward data from the computers inside your
    network to the Internet. This allows your users to send requests such as to browse
    the www.linux.com Web page.


    But you do not want your gateway computer to forward the internal IP address of
    your computer that is sending a request to the Internet. That IP address would
    help a cracker break into your network.


    With the following command, you can set up masquerading; in other words, all requests
    from inside your network look like they are coming from your gateway computer.


    ```

    ipchains -A forward -i $EXTERNAL_INTERFACE -s $LOCALNET -j MASQ

    ```


    This command adds (-A) a rule and applies it to data that is forwarded through
    the following interface (-i). You set the $EXTERNAL_INTERFACE to eth0, eth1 or
    ppp0, whichever interface is directly connected to the Internet.


    Linux applies this rule to all data from (-s, for) your local network. Masquerading
    (MASQ) substitutes your $EXTERNAL_INTERFACE''S IP address for the source computer
    on your network.'
  merge: -1
  pgno: 383
- img_proc: true
  md: '# IP Chains Basic Syntax


    Once your gateway computer gets an answer from the Internet, it automatically
    substitutes the source IP address on your local network, before forwarding.


    Now that you have analyzed the three different kinds of ipchains commands, you
    can understand what happens when you substitute different switches and actions.


    The basic switches that you can use with IP chains are listed in Table 16.2. The
    actions that you can take with IP chains are listed in Table 16.3. More information
    is available in the IPCHAINS-HOWTO, available online at http://www.linuxdoc.org.


    Table 16.2 Ipchains Commands


    | Switch | Function |

    | -A | Append, or add this rule to the ones created before it |

    | -D | Delete the following rule |

    | -d | Destination. Specifies the destination IP address |

    | -F | Flush all previously set rules. Allows you to start fresh |

    | -i | Specifies the network interface, such as eth0 or ppp0 |

    | -j | Jump to an action, if all of the conditions in this rule are met |

    | -L | Lists all current rules. Typically run at the command line |

    | -| | Log every packet that meets the conditions of this rule |'
  merge: -1
  pgno: 384
- img_proc: true
  md: '# PART FIVE • MANAGING YOUR NETWORK


    -P

    Specifies default policies. The final rule in any ipchains set


    -p

    Look for data that matches the following protocol, such as TCP or UDP


    -y

    Check if the data is an attempt to connect. If it is "!-y", check if the data
    is being transferred on an existing connection


    # Table 16.3 Ipchains Actions


    | Action | Function |

    | --- | --- |

    | ACCEPT | If the data meets the requirements in this rule, let it through |

    | DENY | If the data meets the requirements in this rule, stop it. No message
    is sent to the computer sending this data |

    | MASQ | If the data meets the requirements in this rule, substitute the local
    IP address for the source address |

    | REDIRECT | If the data meets the requirements in this rule, send it to the specified
    port |

    | REJECT | If the data meets the requirements in this rule, stop it. A message
    is sent to the originating computer |


    # Managing Your Channels


    There are 65,536 channels associated with TCP/IP. If any of these channels are
    open, a cracker can use them as a way to break into your network.


    When you use IP chains on TCP/IP channels, there are three objectives. The first
    objective is to block the export'
