    to /etc/resolv.conf. For example, suppose you are connecting to the Internet by
    dialing through your Internet service provider (ISP). Your ISP tells you that
    you should configure your system to access a primary nameserver (206.205.42.2)
    and a secondary nameserver (206.205.42.254). You are also told that your search
    domain, the domain TCP/IP uses to look for assistance in resolving IP addresses,
    is cstone.net. Your /etc/resolv.conf file will look like this:


    ```

    domain cstone.net

    search cstone.net

    nameserver 206.205.42.2

    nameserver 206.205.42.254

    ```


    # /etc/hosts.allow and /etc/hosts.deny


    To prevent unauthorized intrusions into your system, you should configure the
    file called /etc/hosts.allow so that only the hosts connected to your internal
    network, if any, are allowed to access TCP/IP services on your computer. You can
    do so by modifying /etc/hosts.allow and /etc/hosts.deny as explained in this section.


    The file called /etc/hosts.allow lists the names of hosts that are allowed to
    access TCP/IP services on your com'
