  md: '# Making Sure NFS Is Installed


    To work with NFS, you will need the following daemons (memory-resident programs)
    running on both servers and clients:


    +   - portmap. Accepts remote requests for information and guides these requests
    to the appropriate port.

    - rpcmountd. This daemon enables the system to mount and unmount remote NFS directories.

    - nfsd This is the NFS server daemon proper.

    - rpc.lockd. This daemon handles file locking on the server. Clients request file
    locks so that they can use the files without other users overwriting them.

    - rstatd. This daemon monitors locking processes and resets locks after a crash.


    # Configuring Your System to Start NFS Automatically


    You should configure all the machines on your network so that they start these
    daemons at the beginning of each session. On Red Hat systems, you do this with
    the /usr/bin/setup utility, a text-mode utility that enables you to specify which
    system services you want to run. Red Hat launches daemons by means of startup
    scripts located in the /etc/rc.d/init.d directory. Most Linux distributions use
    the same technique or a close variation of it.


    On Red Hat and Red Hat–derived systems (such as Mandrake), make sure that your
    system is running the following services: netfs (the NFS mount daemon); nfslock;
    nfsd; portmap; and rstatd. (Note: If none of these options are available on the
    Setup program menu, you need to install the RPM packages for these services.).
    Other distributions providing varying means to specify which services run automatically
    at startup;'
  merge: -1
  pgno: 176
- img_proc: true
  md: '166 PART TWO BUILDING YOUR LOCAL AREA NETWORK (LAN)


    check your distribution documentation to find out which utility to run.


    # Making Sure the NFS Daemons Are Running


    To make sure you are running the needed utilities, you can run the startup scripts
    with the status option. Here is how to do this:


    +   1. Switch to the directory where network scripts are stored. On Red Hat and
    kindred systems, your directory is /etc/rc.d/init.d.


    +   2. Type /portmap status and press Enter. You should see a message stating
    that portmap is running. If not, type /portmap startup and press Enter.


    +   3. Now type /nfs status and press Enter. You should see a message informing
    you that rpc.mountd and nfsd are running. If not, type /nfs start and press Enter.


    +   4. Got everything running? Just to make sure, type /usr/sbin/rpcinfo -p and
    press Enter. You should see a list of all the running daemons, including their
    version numbers and the protocol they are using.


    If you see an error message such as “can’t contact portmapper,” “Connection refused,”
    or “PROG NOT REGISTERED,”” then portmap is not running, or your /etc/hosts.deny
    and /etc/hosts.allow files are not properly configured. Check your configuration;
    then restart your system and try the aforementioned steps again.'
