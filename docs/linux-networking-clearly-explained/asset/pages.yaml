  md: '# # Linux Networking


    # CLEARLY EXPLAINED


    # BRYAN PFFAFFENBERGER


    Bryan Pfaffenberger details the configuration and use of GNOME (as well as Enlightenment
    and KDE) in greater detail than any other Linux book out there.

    —*David Wall of Amazon.com on Linux Clearly Explained*


    Bryan Pfaffenberger brings his, step-by-step approach which made Linux Clearly
    Explained success to the task of networking with Linux. Linux Networking Explained
    walks you through the creation of a TCP/IP-based Linux local area network, beginning
    with a "sandbox" installation involving just two or three computers. In the sandbox
    system, you will learn how to implement all the major services, including DNS
    servers, network information service (NIS), a network file system (NFS); and the
    most important TCP/IP services email, newsgroups. You will learn how to set up
    AppleTalk and Windows NT servers to enable your network to support both Macintosh
    and Windows systems. When you have mastered all the fundamentals of system and
    network administration, including handling user accounts and ensuring security,
    you will go ''live'' with an Internet connection. Linux Networking Clearly Explained
    is a passionate advocate for end users to gain the knowledge needed to create
    network installations for small businesses, for workgroups within an enterprise,
    and for families in high-tech homes.


    Topics include:


    +   * Essential networking concepts and hardware

    * Configuration and use of NFS and Samba

    * Compatibility with Macintosh and Windows systems

    * How to establish high-speed Internet connections to your network

    * Creating Web servers and intranets with an introduction to Apache

    * Maintaining and troubleshooting Linux networks

    * Firewalls and security


    # ## About the Author


    Bryan Pfaffenberger, PhD, is a professor in the University of Virginia''s pioneering
    Division of Technology, Culture, and Communication, where he focuses on explaining
    complex, cutting-edge technologies to the public. A Unix user since 1989, he is
    the author of over 100 works on computing.


