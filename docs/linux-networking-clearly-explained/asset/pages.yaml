    +   4. **Important:** Before NFS can make use of the modifications you have made,
    you must use the exportfs utility to update the exported directory database /var/lib/nfs/xtab.
    This database is needed by the remote mounting daemons; if it is not accurate,
    clients will not be able to mount the exported directories. To synchronize /etc/exports
    with the database, type exportfs -rv and press Enter.


    When you have completed these steps successfully, your server is making the exported
    directories available to clients on the network. In the next section, you may
    move to the clients, and you learn how to mount the remote directories that the
    server is making available.


    # Mounting Remote Directories


    To mount remote directories that an NFS server is making available, you need to
    do the following. First, make sure the directories are actually available by running
    the **showmount** command. Next, decide how you want to mount the remote directories.
    If you would like to do so only when the remote directories are needed, you can
    mount them manually by using the mount command. If you would like the directories
    to be mounted automatically every time you start your system, you need to add
    an entry to /etc/fstab. The following sections detail these procedures.'
