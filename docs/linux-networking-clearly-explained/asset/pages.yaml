    Try starting netatalk again.


    # Connecting to the Server with the Chooser


    In this section, you will connect a Macintosh to your network. You will need to
    repeat these actions for each of the Macintoshes you are connecting.


    +   1. Click the Apple menu icon, and click Chooser. You will see the Chooser
    dialog box.

    2. Click AppleShare. You should see the hostname of the Linux system on which
    you installed netatalk; however, you will want to connect via TCP/IP, which gives
    superior performance.

    3. Click Server IP Address, type the server''s IP address in the dialog box, and
    click OK.

    4. Type the user''s name and password (these must duplicate the user name and
    password that you set on the Linux server), and click OK.

    5. Check off the startup options you want, and click OK.


    Once the connection is established, you will see a network icon on the Mac desktop.
    If you double-click this icon, the Mac will open a standard Finder window, showing
    the files in the user''s Linux directory. This directory can be used as if it
    were an ordinary directory on the Mac''s own hard disk.'
