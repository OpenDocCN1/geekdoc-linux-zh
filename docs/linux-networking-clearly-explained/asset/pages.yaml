    | 027 | 640 (r w r - - - -) | 750 (r w x r x r - x) |

    | 022 | 644 (r w - r - r -) | 755 (r w x r x - r - x) |

    | 000 | 666 (r w - r w r w -) | 777 (r w x r w x r w x) |'
