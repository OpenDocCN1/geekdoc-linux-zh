  md: '# 2


    # Using Internet Applications


    Now that you are connected to the Internet, you are ready to use Internet applications,
    such as Netscape Communicator. Chances are you already browsed the Web with Netscape.
    As you will quickly learn, though, you will need to do some configuration in order
    to get Netscape to work the way you expect—that is, as well as a browser works
    on a Windows or Macintosh system. For example, Netscape is not set up to display
    multimedia, such as movies and videos. In addition, you will need to configure
    Netscape to access your email.'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'This chapter introduces the Internet applications available on your system.
    It also shows you how to configure these applications, if necessary. The chapter
    does not attempt to teach you all the fundamentals of Internet use; if you are
    not familiar with the essentials of Web browsing, email and other Internet services,
    you should read a good general introduction to the Internet before proceeding
    with this chapter.


    > TIP If you are new to Netscape Communicator, check out Netscape Communicator
    (AP Professional), which covers the nearly identical Windows version.


    Here is what you will find in this chapter:


    +   - Configuring Helper Applications. Learn how to set up your system''s default
    Web browser, Netscape Communicator, so that it can work with animations, movies,
    and sounds.

    - Configuring Netscape Communicator for Email Access. Set up your Communicator
    package to access your email account.

    - Configuring Netscape Communicator for Newsgroup Access. Set up your Communicator
    package to access Usenet newsgroups.

    - Accessing FTP Sites with File Manager. Create virtual file systems for frequently
    accessed FTP sites; you will love this feature.

    - Exploring Additional Internet Applications. Introduced KFtp (a KDE-compatible
    FTP client), KXicq (an ICQ “buddy list” program), and KVIrc, a nitty KDE application
    for accessing Internet Relay Chat (IRC).'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Configuring Netscape Helper Applications


    Netscape Communicator is a full-featured suite of Internet applications that includes
    a browser (Netscape Navigator), email and newsgroups (Netscape Messenger), and
    Composer, a program that enables you to create Web pages. This section does not
    attempt to teach you how to use Netscape Communicator—that is a subject for a
    book in itself. It focuses on configuring the program for Internet use. In this
    section, you learn how to configure helper applications, which Navigator needs
    in order to display certain types of data.


    # Understanding Which Applications Navigator Needs


    Netscape Navigator needs help to display data types that it does not recognize
    internally. If you configure the program as recommended in this section, Navigator
    will automatically start the helper application when you encounter the specified
    type of data (such as sound or a video). Table 2.1 lists the data types that you
    may encounter on the Internet, as well as the applications you recommend that
    you associate with these data types. For each application, you will find the recommended
    startup command (the command that Netscape passes to the application). This includes
    the command needed to start the application (such as esdplay), followed by recommended
    options, if any, and %s (a variable that automatically inserts the URL of the
    remote file you are accessing).'
  merge: -1
  pgno: 56
- img_proc: true
