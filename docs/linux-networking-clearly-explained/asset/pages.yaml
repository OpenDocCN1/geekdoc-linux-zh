    # Testing Your Work


    Open up a command line interface. Go into root or super-user mode. Restart Apache
    with the /etc/rc.d/init.d/httpd restart command, or the command appropriate to
    your distribution. Return to your Web browser, type http://localhost in the Address
    or Location box, and press Enter. You should see a Web page proclaiming that Apache
    is working.


    Look up the IP address for your Apache server in /etc/hosts file. Record it and
    then go to any other computer on your network. It does not matter if it is a Linux,
    Windows or Macintosh computer. Open up the browser of your choice. In the location
    text box, type in the IP address for your Apache server. When you press enter,
    you should be able to see the same Apache test Web page.


    # Setting Up Web Pages


    Now that you have Apache running, you can start planning your Web pages. The page
    that you see when you have started Apache successfully is the index.html file
    in the directory specified as the DocumentRoot; for Red Hat Linux, that is the
    /home/httpd/html directory. Other pages are located in the /home/httpd/cgi-bin
    and the /home/httpd/icons directories. These particular Red Hat directories are
    designed to contain html files, CGI scripts for data interfaces, and pictures,
    respectively. Other distributions include these and more categories in directories.'
