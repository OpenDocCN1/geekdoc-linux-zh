- img_proc: true
  md: "# CHAPTER 16 $\bullet$ SECURING YOUR NETWORK\n\nsecurity hazard. Intruders\
    \ know that if they play around with these executables, they may create an error\
    \ condition that sets up a shell with root user privileges—which means they will\
    \ have unrestricted access to your entire system. Additionally, an intruder may\
    \ leave behind SUID versions of executables, including a SUID version of the shell,\
    \ that enable them to gain root user access to your system.\n\nWhat should you\
    \ do about SUID executables? Watch them—carefully. Here is how. On a system that\
    \ is running a clean version of Linux, switch to superuser, type find / -perm\
