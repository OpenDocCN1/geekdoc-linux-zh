  md: '# CHAPTER 13 • DECLARING ENTITIES AND NOTATIONS 309


    +   3. **password**. When prompted to do so, type your password. The server checks
    the username and password against its /etc/passwd database. When successful, you
    see the line “User username logged in.”


    +   4. **put filename**. As you saw in the last section, the put command sends
    files from the FTP client to the FTP server. For *filename*, use a file in the
    working directory. This command opens a connection between client and server.
    The data is sent in ASCII mode. When the file transfer is complete, ftp tells
    you the number of bytes that were sent. If you want to send (or receive) a binary
    file, you can use **binary** file transfer mode back to plain text. Type *ascii*
    to change the default file transfer mode.


    +   5. **get filename**. This command retrieves the specified *filename* from
    the FTP server.


    +   6. **quit**. This command logs off from the FTP server named linux-desktop.


    Common errors when connecting to an FTP server include “Connection Refused” and
    “Service not available.” If you’re unable to connect to your FTP server, review
