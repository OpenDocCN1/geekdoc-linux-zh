  md: '# Configuring and Using NFS


    You have gone through a lot of trouble to set up a network. You have wired your
    home or office, you have set up and configured network software, and you have
    reviewed basic concepts of file ownership and permissions. Now you are ready to
    reap the rewards.


    In this chapter, you will learn to share files and printers between Linux computers
    with the Network File System (NFS). Although you can use NFS with Microsoft Windows
    and Apple Macintosh computers, these other operating systems need special software
    to read files through NFS. In later chapters, you will learn to extend the bene-'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# Introducing the Network File System (NFS)


    fits of networking to these computers with applications similar to NFS, known
    as Samba and AppleTalk.


    The Network File System (NFS) is the native local area networking protocol not
    only of Linux, but all Unix-like operating systems. If you have never used NFS
    before, however, you may find the basic concepts unfamiliar. The following is
    a brief introduction to these concepts.


    Similar to all the Internet services discussed in this book, NFS consists of two
    complementary software packages—the server and the client. The NFS server exports
    certain directories to the network. Using the NFS client, qualified users can
    then mount these exported directories to their filesystems.


    There is an example. Suppose Suzanne is using her notebook computer, but she stores
    all of her important files on Lothlorien, a desktop system with a huge hard drive.
    Lothlorien is running an NFS server, and this server exports Suzanne''s directory
    from Lothlorien so that it is available on the network. Using her notebook computer
    and the NFS client software, Suzanne mounts her Lothlorien directory so that it
    appears to be part of her notebook computer''s filesystem.


    As this example suggests, NFS seems to be designed around a client/server model
    (see Chapter 4). However, it is possible to use NFS to implement peer-to-peer
    networking as well. The trick lies in installing NFS server and client software
    on every computer on the network. Users with'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# CHAPTER 7 • CONFIGURING AND USING NFS 161


    can decide for themselves which directories and files they want to make available
    to other users on the network.


    # Typical NFS Applications


    As you have just learned, NFS enables users of Unix and Linux workstations to
    mount one or more remote directories, so that these remote directories appear
    to become part of the local filesystem. You can use this capability in the following
    ways:


    +   Automating data backups. Using utilities such as cron, you can easily create
    automated backup procedures that copy all of a user''s new or modified files to
    a backup directory on the remote server.


    +   Reducing storage requirements on client systems. Rather than installing read-only
    resources such as fonts and documentation on every system, you can make these
    available to everyone by sharing the directories on the server that contain these
    resources.


    +   Providing a central location for applications. Rather than installing StarOffice
    on every computer on the network, you can install it on the server, and make the
    StarOffice directory available to all network users. You can do the same with
    other applications. This application reduces maintenance tasks significantly.
    For example, suppose a new version of StarOffice is introduced. By installing
    the new version on the server, you automatically upgrade everyone''s copy. The
    alternative? Install the new version repeatedly on everyone''s computer. Note
    that this use of NFS is another way to reduce storage requirements on client systems.


    +   Sharing expensive printers. Rather than equipping each system with its own
    computer, you can purchase'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# Shortcomings of NFS


    just one high-end printer that is accessible to everyone via the network.


    Although NFS is useful and convenient, it has certain drawbacks that you should
    be aware of. These drawbacks include the following:


    +   - Security. Intruders know how to use NFS to gain root access to improperly
    configured networks. If some of your network''s client systems are located in
    insecure locations, or if you plan to connect your network to the Internet, you
    should take precautions to safeguard your network against the better-known attack
    methods. In particular, do not connect to the Internet without implementing IP
    masquerading, discussed in Chapter 10.

    - Fault Tolerance. No network protocol handles a severed server connection with
    anything approaching grace, but NFS is particularly weak in this area. If a network
    connection goes down, you may have difficulty restoring network services until
    you reboot the machines.

    - Linux-Specific Problems. To improve NFS performance, much of the NFS code is
    not directly incorporated into the Linux kernel (version 2.2 and later). Although
    this is a positive development from a performance angle, it means that virtually
    all of the NFS documentation available on the Internet is out of date and cannot
    be used to implement NFS on your network. In addition, all the NFS daemons had
    to be rewritten to accommodate the kernel changes. Invitably, when software is
    updated, new bugs are introduced that take some time to iron out.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# CHAPTER 7 • CONFIGURING AND USING NFS


    163


    > **TIP** Not try to implement NFS without making sure that you are running the
    latest version of your Linux distribution and the latest version of the NFS daemons.
    Be sure to check your Linux distribution''s home page for software updates. If
    you are having trouble getting NFS to work, you may be using an older, flawed
    version of one of the NFS daemons or utilities.


    # Preparing to Use NFS


    To use NFS, begin by implementing security safeguards. This is not only a good
    idea, it is necessary to get the NFS daemons working properly. Next, make sure
    the necessary server and client *daemons* (background processes) are running on
    all the machines on your network. You then determine which directories you want
    to share. Finally, make sure that the directories to be shared have the appropriate
    ownership and permissions.


    > **TIP** Before proceeding, make sure you fully understand the user account,
    ownership, and permissions concepts introduced in the previous chapter. If you
    have trouble getting NFS to work, chances are that the problem is in one of these
    areas.


    # Securing Your System


    To use NFS safely, you''ll need to take a few steps to secure your system. In
    the following, you will modify the /etc/hosts.allow and /etc/hosts.deny files
    so that you are protected against a whole series of possible attacks. This protection
    is not bulletproof, to be sure, but it will elimi-'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'nate a number of tricks that the script kiddies have been pulling for years.


    +   1. Open a terminal window, and switch to superuser (type su followed by your
    password).


    +   2. Use your favorite text editor to open /etc/hosts.deny


    +   3. On a blank line, type portmap: ALL


    +   4. Save the file.


    +   5. Open /etc/hosts.allow


    +   6. On a blank line, type portmap: followed by a space, the IP address of the
    client machine, a forward-slash mark, and the netmask of the client machine. For
    you are a Class C network, which is what you are probably using, the default netmask
    is 255.255.255.0. If you are not sure what the client''s netmask is, go to the
    client, open a terminal window, type ifconfig, and press Enter. Look for the IP
    address and netmask under the Ethernet network interface (eth0), unless the machine
    has more than one Ethernet card. Here is an example of a valid entry in /etc/hosts.allow:


    ```

    portmap: 192.168.100.10/255.255.255.0

    ```


    If you would like to make the exported directories available to all machines on
    your network, you can use a wildcard, as in the following example:


    ```

    portmap: 192.168.100.* 255.255.255.0

    ```


    +   7. Save the file.'
