  md: 'Now you are ready to move on to Chapter 2, where you will configure Netscape
    Communicator on your Linux system. If you would like to learn more about the technical
    side of PPP connections with Linux, read the next section.


    # Looking Under the Hood


    This section briefly introduces the technology that underlies PPP connections
    with Linux; in addition, it discusses some text-mode commands that you may wish
    to try. You do not need to have this information down cold to use Linux successfully;
    it is of interest only if you would like to learn more about how Linux works.


    # The PPP Network Interface (ppp0)


    To connect your Linux system to the Internet, it is necessary to define a network
    interface. In brief, a network interface is a file that serves as an intermediary
    between a networking device, such as an Ethernet adapter or a modem, and the Linux
    kernel. When you connect to the Internet by means of a modem, the PPP software
    detects your modem and creates a network interface called ppp0. If your computer
    were equipped with more than one modem, the software would create additional interfaces
    (ppp1, ppp2, and so on).


    # The PPP Daemon


    To implement PPP connections, Linux distributions use of the pppd daemon (a daemon
    is a program that runs in the background, waiting to step into action when its
    services are needed). A pppt is not meant to be run manually; rather, it is launched
    by other programs. Among'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'these is wydial, a PPP dialer utility that dials the modem and negotiates the
    PPP connection with your ISP. Once wydial achieves the connection, wydial launches
    pppd, and you are connected.


    Most user-friendly PPP utilities are little more than attractive-looking front
    ends for wydial. (A front end is a user-friendly program that makes working with
    a text-mode program more pleasant.) In the following sections, you will learn
    that it is quite possible to connect to the Internet using wydial alone. You may
    wish to try this approach if KPPP will not work for some reason that is not attributable
    to modem incompatibility.


