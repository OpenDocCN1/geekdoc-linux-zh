    When TCP/IP was developed in the 1970s, there were around 100 organizations connected
    to the ARPANET. There are over four billion possible IP addresses, which seemed
    to be more than enough. The IP addresses were assigned to every computer on the
    network, as well as the routers that managed the traffic between networks. However,
    the system of addresses classes (Classes A, B, and C) wastes many addresses that
