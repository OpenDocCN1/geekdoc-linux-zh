    # Wu-ftpd Configuration Files


    Depending on your distribution, you may have as many as five wu-ftpd configuration
    files in the /etc directory.


    +   * ftpaccess. Sets up what different users can do through your server.

    * ftpconversions. Default FTP settings for compressed or archived files.

    * ftpgroups. Sets up encryption for your user passwords.

    * ftphosts. Lists users that are allowed or denied access to your FTP server.
    In Caldera Linux, the'
