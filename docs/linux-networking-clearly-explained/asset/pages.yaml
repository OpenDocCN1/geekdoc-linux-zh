    You will set up more of these tools in Chapter 15.


    Linux distributions released starting about the middle of the year 2000 will be
    based on Linux Kernel 2.4. With this Kernel comes a new Firewall and Masquerading
    tool known as ipnatctl, short for IP Network Address Translation CoTroL. This
    is part of a package tentatively known as NetFilter.


    If you have already set up IP Chains on your Linux computer, you will not need
    to make major changes. If and when you load NetFilter on your Linux computer,
    you can keep most of the IP Chains rules that you have already set up. You will
    only need to load a special IP Chains module. The command is similar to what you
    used to load your modem through ppp:


    ```

    /sbin/insmod ipchains

    ```


    The only thing that you will have to change is your masquerading command. The
    NetFilter command that corresponds to the IP Chains command from the last section
    is:


    ```

    ipnatctl -I -O ppp0 -b 192.168.0.0/24 -m

    masquerade

    ```


