    # Why Create a Local Area Network (LAN)?


    Just a decade ago, LANs were relatively rare; considerable expertise and expense
    were required to set up and administer them. Today, LAN networking is experiencing
    the kind of explosive growth that made personal computers and the Internet household
    words. Everywhere, organizations of all types, including schools, churches, nonprofit
    agencies, small businesses, community government offices, and more, are installing
    LANs to connect their computers. One of the fastest-growing sectors of LAN development
    is home networking, in which all of the computers in a house are linked so that
    they can share a single Internet connection. In computer-savvy areas such as Washington,
    DC, Boston, and San Francisco, homes that are prewired for LAN connectivity are
    getting premium prices in the housing market.'
  merge: -1
