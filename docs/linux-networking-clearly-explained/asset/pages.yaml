  md: '# CHAPTER 8 • CONFIGURING AND USING SAMBA 197


    # Configuring a WINS Server


    If you decide to handle name resolution by means of a WINS server, you will still
    need to add the IP addresses, hostnames, and aliases of all the machines on your
    network to the /etc/hosts file on the Samba server. To implement the WINS server
