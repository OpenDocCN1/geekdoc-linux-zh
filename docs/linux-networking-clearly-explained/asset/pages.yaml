    # What Should You Do if You Find Evidence of an Intrusion?


    If you are convinced that you have found evidence of an unauthorized intrusion
    into your network, you must do the following:


    +   1. Back up all of your users'' data.


    +   2. Reinstall clean versions of Linux from the original distribution CD-ROM.'
  merge: -1
  pgno: 369
- img_proc: true
  md: '3. Reinstall clean versions of user applications from freshly downloaded packages
    or tarballs.


    Obviously, this is a lot of work. It could be days of work in a network consisting
    of a dozen or more workstations. But it is necessary. The intruder may have hidden
    packet sniffers, monitoring programs, trojan horses, and who-knows virtually anywhere
    on your network—and the presence of just one of these compromised files is sufficient
    to let the intruder back in.


    To avoid reinstalling all the software on your network, to be proactive. Learn
    how to secure your network now. In the following sections, you will examine ways
    your ISP can protect you, and ways you can protect yourself.


    # Understanding Your ISP''s Security Role


    Many crackers are smart enough to try to disguise their messages. When they send
    a virus, trojan horse, or some other malicious program, they often start by cracking
    someone else''s account at another Internet service provider (ISP). When the authorities
    start their investigation, they will track the message back to that ISP.


    Even if the ISP is not at fault, the publicity of an investigation is not good
    for their business. The publicity could be even worse if the provider is a company,
    university, or governmental agency. They want to protect their users from crackers
    as much as possible.


    In the following sections, you will look at what ISPs do to help protect their
    users.'
  merge: -1
  pgno: 370
- img_proc: true
  md: '# Proxy Servers


    One way ISPs help protect their users through proxy servers. You learned to set
    up Netscape to work with ISP proxy servers in Chapter 11. Proxy servers have a
    number of advantages for ISPs. As long as you do not specifically bypass a proxy
    server, this tool allows an ISP to help protect you in the following ways:


    +   - Blocking Undesirable Sites. As you can protect yourself from sites with
    various levels of sexuality and violence, ISPs and other organizations can do
    the same through their proxy servers.

    - Blocking Specific IP Addresses. When an ISP investigates a problem message,
    they can find the originating IP address for that message. While the problem is
    being investigated, the ISP can block all messages from that specific IP address.

    - Limiting Access to Specific Sites. The other way to approach security is to
    limit Internet access to approved sites. This approach is best for ISPs and organizations
    that want their Internet access to be suitable for children.


    If you do not want this kind of protection, you can bypass a proxy server for
    specific Web sites using the tools that you learned about in Chapter 11.


    # Dynamic Addresses


    Many ISPs and other organizations make their users share a limited number of IP
    addresses. After any user disconnects, the IP address that he/she used can be
    reassigned to a different user, dynamically.'
  merge: -1
  pgno: 371
- img_proc: true
  md: '# CHAPTER 16 • SECURING YOUR NETWORK 361


    Dynamic IP addresses provide some measure of security against unauthorized intrusions
    because your network gets a different IP address—at least in theory—every time
    you log on. Crackers will have difficulty finding their way back to your network.
    It is as if your telephone had a different number every day; people would find
    it very hard to reach you!


    The protection afforded by dynamic IP addresses is far from complete, however,
    and that is especially true when you are using high-speed connections such as
    cable modems and DSL. These services may keep you connected more or less indefinitely,
    so that your exposure is magnified. There have been many reported instances of
    breaches to networks connected via dynamic IP addresses, and the number of such
    reports is steadily rising.


    # Securing Your System


    Unless you are confident that your ISP defends your network perfectly, you need
    to work at defending your network. In the following sections, you will look at
    several different techniques for keeping your computers and data secure as you
    can handle.


    > TIP One option is to ask your ISP to set up security on your network. While
    this can be expensive, it is often cost effective for larger networks.


    # Running the Latest and Greatest


    Always make sure you are running the latest versions of all the software and utilities
    provided with your Linux distribution. Often, security flaws are found that lay
    your'
  merge: -1
  pgno: 372
- img_proc: true
  md: 'system wide open to unauthorized intruders. Word gets around the ‘Net pretty
    fast, and you can be sure that would-be intruders get the news very quickly. If
    you are still running an older version of software that is known to have a vulnerability,
    you’re sending a message that says, in effect, “Here I am! Have fun!” Check your
    distribution’s home page frequently for software updates, and make a habit of
    visiting such sites as Security Focus (http://www.securityfocus.com), RootShell
    (http://www.rootshell.com), and CERT (http://www.cert.org).


    # Fingerprinting Your Files


    When intruders break into systems, they leave behind a slew of utilities that
    have been altered to hide their tracks. It is very difficult to tell that these
    files have been altered—unless, that is, you create a “fingerprint” of these files
    in their pristine, unaltered state. You can do this with the md5sum utility, which
    creates a checksum that uniquely describes the file; if it has been altered, even
    slightly, the checksum will differ. When you install a clean version of Linux,
    use the following command to create checksums for all the utilities in /bin, /sbin,
    /usr/bin, and /usr/sbin:


    ```

    _md5sum /bin/* /sbin/* /usr/bin/* /usr/sbin/* > /root/clean-check.md5

    ```


    Periodically, perform this check again again, but save the output to a different
    filename:


    ```

    _md5sum /bin/* /sbin/* /usr/bin/* /usr/sbin/* > /root/new-check.md5

    ```


    To see whether any of the executables have changed, use the following command:'
  merge: -1
  pgno: 373
- img_proc: true
  md: '# CHAPTER 16 • SECURING YOUR NETWORK


    ```

    _diff clean-check.md5 new-check.md5

    ```


    If the diff utility displays lines that differ, do not panic; you may have installed
    updated versions of the utilities in question. If not, it is possible that the
    files have been compromised. You should back up your data and install a fresh
    version of Linux from your distribution disks.


    # Backing Up Your Data


    The last line of defense in any system is a good backup. In other words, do not
    haphazardly restore your backup from yesterday, as that might restore whatever
    viruses or trojan horses might have penetrated your system.


    When your system has been cracked, you need a pristine backup. This means that
    you want a backup where the key settings for Linux, as well as any critical data
    files are unaffected by any known problems.


    In general, you can determine if you have a pristine backup by checking your log
    files. Once you determine the first time a cracker has tried to attack your system
    (e.g., by logging in at a strange time of day), all you need is a backup before
    that date.


    # Using Good Passwords


    Although no password is fail-safe, you should encourage your users to set up longer
    passwords with a mix of letters and numbers. Never use passwords based on dictionary
    words or a word followed by a number. While a cracker can decipher a password
    based on a dictionary word in hours, it can take weeks to decipher an alphanumeric
    password.'
