  md: '# Why Define Network Layers?


    In the earliest computer networks, one complex protocol governed all aspects of
    the network, including the way applications communicated and the way data signals
    traveled through the network''s physical medium. However, this approach proved
    unworkable. A new application or physical medium could not be introduced without
    forcing revision of all the network software. As a result, network designers quickly
    learned to use a "divide and conquer" approach. The result was a conception of
    network layers layers, in which the various functions of a network are divided
    into separate categories or levels, each with its own protocols.


    # The OSI Reference Model


    The most influential concept of network layering stems from the Open Systems Interconnection
    (OSI) Reference Model, an abstract network architecture designed by an international
    standards committee. This model, called the OSI Reference Model, originated during
    the 1970s and has strongly influenced network design ever since.


    The OSI Reference Model is not a complete specification for a functioning network;
    rather, it is a set of design concepts. The most fundamental of these concepts
    is the notion that network designers should break the network into manageable
    pieces, called layers. When an actual network is designed, engineers can then
    concentrate on getting the layer to do its job correctly, rather than having to
    worry about other layers. For example, one of the layers in the OSI Reference
    Model is called the application layer. Engineers working on this layer concern
    themselves with the protocols needed to establish communication between the client
    part of the application and'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# The Protocol Stack Concept


    To understand how layers work in the OSI Reference Model, it is helpful to conceptualize
    a network as consisting of just two computers which are linked by physical network
    media. On each computer, one can think of the various layers as if they were like
    a layer cake, with a “stack” of horizontal slices. At the top of this stack, called
    a protocol stack, are layers concerned with accepting input from the user and
    establishing connections with servers. At the middle layer of the stack are protocols
    that are devoted to packaging the outgoing data for transmission on the network.
    At the lowest level of the stack are layers that are concerned with relaying the
    packaged data to the network''s physical medium.


    As the preceding suggests, outgoing data travels “down” the protocol stack until
    it reaches the network''s physical medium. At the receiving computer, the data
    travels “up” the stack in a reverse of this process. At the lowest level, the
    lower layers retrieve the incoming data from the network''s physical medium. They
    then pass the incoming data “up” to the middle layers, which “unwrap” the data
    from the packages in which it has been sent. The middle layers then pass the incoming
    data to the upper layer, where it is made available to the application for which
    the data is intended.


    Working with the protocol stack concept, network designers can focus their energies
    on one layer at a time.


    the server part. They do not need to worry about the other layers, which take
    care of getting the client''s request to the server (which may be located halfway
    around the globe, or in the office next door).'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# CHAPTER 3 • ESSENTIAL NETWORKING CONCEPTS 87


    They specify protocols for each layer that perform two functions. First, these
    protocols govern the way that data is “handed down” or “handed up” to neighboring
    layers in the stack. Second, these protocols govern the way that the layer interacts
    with its corresponding layer on the receiving computer. At the core of the protocol
    stack concept is the notion that network designers can and should forget about
    the details of other layers.


    The proof of this concept’s success is the Internet. Although the Internet does
    not precisely conform to the OSI Reference Model’s layer specifications, in that
    it specifies fewer layers, it does indeed use the protocol stack concept. This
    is the key to the Internet’s great versatility and its success worldwide. It does
    not matter what type of computer an Internet application runs on; Web browsers
    have been developed for just every type of computer in common use. All that matters
    is that the Web browser originates messages that can be correctly read, and responded
    to, by a Web server on the Internet. Similarly, data that has been packaged by
    the middle and lower levels of the Internet can travel over virtually any type
    of network medium ever invented. To get the Internet working with a brand new
    network medium, designers need only concern themselves with the task of giving
    the packaged Internet data to travel on the new physical medium; the rest of the
    layers need no modification in order to work with the new medium, once the new
    lower level protocols have been defined.


    # Layers in the OSI Reference Model


    The OSI Reference Model defines a total of seven network layers, divided into
