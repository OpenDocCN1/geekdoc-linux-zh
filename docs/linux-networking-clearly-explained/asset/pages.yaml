- img_proc: true
  md: '# Creating a Backup Routine


    To safeguard the work you create on your Linux system, you should perform regular
    backups. You can use your network to back up your more important files on different
    computers.


    # Full and Incremental Backups


    A good backup begins with a full backup, which makes a copy of all of your valuable
    files. If you have a backup tape drive or CD-R drive, you can back up your entire
    hard disk—and that is not a bad idea unless you are comfortable starting almost
    from scratch (and reinstalling everything) in the event of a hard disk failure.


    At minimum, you should make a full backup of your home directory. This directory
    should contain the work and configuration files of each of your users.


    > TIP it is not a bad idea to perform a full backup on your /etc directory. This
    directory contains system-wide configuration files, including settings for the
    X Window system, your network, and connections to the Internet. These files can
    be difficult to configure, so it is wise to back them up once you have them working.


    You do not need to perform a full backup every time. With an incremental backup,
    you can back up only the files that have been altered or created since your last
    backup.


    # Performing the Full Backup


    To perform a full backup, use a command such as the following:'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# CHAPTER 14 • ARCHIVING YOUR DATA AUTOMATICALLY


    ```

    tar -cWPpf lothlorien:suzanne.tar

    /home/suzanne

    ```


    This command backs up all the files in /home/suzanne; if you specify a directory
    name as this command does, tar operates in recursive mode by default. In other
    words, the utility backs up all the files in /home/suzanne, as well as all associated
    directories. The utility writes these (via NFS) to this user''s directory on the
    server named lothlorien. The options tell tar to preserve the user''s permissions
    (-p) and to store the full path information for each file (-P); this information
    will be needed to restore the user''s disk fail. Once the backup archive has been
    written, it is verified against the original files. Note that this command will
    not work unless both of the following are true: lothlorien must be running, and
    Suzanne must have permission to write to her directory on lothlorien.


    # Performing an Incremental Backup


    Once you have performed a full backup, you can now perform incremental backups
    for new or revised files. These backups make copies of only those files that have
    changed since the last full backup was made.


    To perform an incremental backup, use the --newer (-N) option. The following example
    backs up all the files in the /home/mj directory created after March 12, 2000,
    the date of the last full backup:


    ```

    tar -cvNf''12 Mar 2000''

    /home/mj/shares/home.tar

    ```


    When you have successfully completed the incremental backup, record the date and
    file location, followed by the date of the associated full backup.'
  merge: -1
  pgno: 330
- img_proc: true
  md: 'How often should you perform an incremental backup? If you were running a multiuser
    Linux system, you would perform incremental backups daily. With a network, this
    process should be relatively painless, especially as you could perform this process
    automatically (see “Automating Backups with Cron,” later in this chapter).


    # Repeating the Full Backup


    Periodically, you will want to repeat the full backup in such a way that tar erases
    the last incremental backup. Here is why. When you perform incremental backups
    with tar, tar adds new or altered files to the archive—but it does not remove
    any of the files that have been deleted since the last update occurred. As a result,
    tar archives tend to grow in ways that make invasive vines and grasses appear
    as amateurs. Moreover, the archive may contain copies of sensitive or confidential
    files that the user thought had been deleted. Thus this unfortunate feature of
    tar can pose confidentiality risks that may matter a great deal to some users.
    When you perform a full backup on top of an incremental backup, and you use the
    same archive name for the repeated full backup, tar erases the previous copy of
    the archive and writes a new one. The new archive will not contain any of the
    files that the user deleted since the time of the last backup.


    # Scheduling Backups with Cron


    The cron daemon, installed by default on most Linux distributions, polls the system
    once per minute to determine whether any jobs have been scheduled to run at that
    time. The utility checks for jobs at two levels, that of the system administrator
    and that of the user. Leaving aside'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# CHAPTER 14 • Archiving YOUR DATA AUTOMATICALLY 321


    of cron for system administration purposes, let us examine the procedure users
    can apply to set up a cron schedule. If you are setting up a user''s system for
    backup purposes, switch to the user''s account before running crontab, the utility
    that is used to create the cron configuration file.


    # Learning the Essentials of Cron Syntax


    To use crontab, you will need to learn the syntax required to specify job schedules
    and commands with cron. In brief, each job is specified in a one-line statement,
    which consists of six fields. From left to right, they are the following:


    +   **Minute.** Possible values are 0 to 59.

    - **Hour.** Possible values are 0 to 23.

    - **Day of the month.** Possible values are 0 to 31.

    - **Month.** Possible values are 0 to 12. You can also type the first three letters
    of the name of the month.

    - **Day of week.** Possible values are 0 to 7. You can also type the first three
    letters of the day name of the day.

    - **Command.** This is the same command you would type at the bash prompt.


    To leave a field blank, type an asterisk (*) instead of one of the possible values.


    The following is an example of a cron statement:


    ```

    0 23 * * fri tar -xPpf /tmp/net/lothlorien

    /home/suzanne

    ```


    This command performs a full backup of the user''s home directory and writes the
    archive file (home.tar) to the'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# PART FIVE • MANAGING YOUR NETWORK


    322


    remote directory currently mounted on /tmp/net/lothlo-rien. Furthermore, it does
    so at precisely 11:00 PM every Friday.


    The following specifies a complete backup regimen, beginning with a full backup
    that occurs every Friday, and continues with incremental backups on Monday through
    Thursday:


    ```

    0 23 * *fri tar -xWPpf /tmp/net/home.tar

    /home/suzanne

    0 23 * * mon tar -uWPpf

    /tmp/net/home.tar /home/suzanne

    0 23 * * tue tar -uWPpf

    /tmp/net/home.tar /home/suzanne

    0 23 * * wed tar -uWPpf

    /tmp/net/home.tar /home/suzanne

    0 23 * * thu tar -uWPpf

    /tmp/net/home.tar /home/suzanne

    ```


    Note that this command assumes that the remote system (lothlorien) is indeed online
    and that this user (Suzanne) has write permissions to the mounted directory.


    # Using Crontab


    To use crontab to create the backup schedule, do the following:


    +   1. Log in as the user whose files you want to back up.

    2. In a terminal window (or at the console), type crontab -e and press Enter.
    You will see the crontab editor, which makes use of your system''s default text
    editor (such as vi). If you are using vi, type i to begin inserting text.'
  merge: -1
  pgno: 333
- img_proc: true
  md: '3. Type the cron commands, one to each line; be sure to press Enter at the
    end of each line.


    4. Exit the editor. With vi, press Esc to exit the insert mode, and type xx (and
    press Enter) to save the file and exit the editor. When you have exited the editor,
    cron automatically writes the necessary files and adjusts the system configuration
    accordingly.


    # # References and Further Reading


    Scotney, P. (1999). Linux Backup HOYWTO. Available online at http://foo.medstu.unimelb.edu.au/~pierre/backup/BackupHOWTO.html.'
  merge: -1
