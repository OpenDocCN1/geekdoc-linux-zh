- img_proc: true
  md: 'driver. If such is not available, that DSL provider might not be for you.


    With the large number of DSL providers, there are variations in the service that
    you will get. Sometimes you may need a separate telephone lines for your DSL and
    telephone service. If you need to set up any wiring yourself, refer to the ADSL
    mini-HOWTO, available online at http://www.linuxdoc.org.


    # Satellite


    Yes, you can receive your Internet data via satellite. The data moves through
    one of three satellites in geosychynchronous orbit, 22,500 miles (36,000 km) above
    the earth. Unfortunately, these satellites are set up for one-way transmission
    of Internet data. You will need a telephone modem for uploads.


    If you want satellite Internet service, you will need a satellite dish. Different
    dishes are available for Internet service only, or for both Internet and television
    service. Separate subscription charges are required for Internet and television;
    if you want your own ISP, you will have to pay a charge for that as well.


    Currently, Hughes Network Systems (now a part of the Boeing Company) is the main
    satellite Internet provider. While their documentation states that satellite Internet
    connection software is only available for Windows, there is a router designed
    to connect the Hughes satellite dish with your Linux system.


    More information on this router is available online at http://www.helius.com.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# PART THREE • CONNECTING YOUR LAN TO THE INTERNET


    To determine if satellite Internet service is available for you, navigate to http://www.direpc.com.
    As of this writing, service is available in most of North America, Europe, and
    Japan.


    If you choose satellite Internet service, you will need to consider the following
    issues. Contact Hughes to learn how they handle each issue.


    +   1. Equipment. You need a satellite dish, mounting hardware, and a Helios router.
    You also need a satellite modem (similar to a cable modem), as well as an Ethernet
    card. You also need an unobstructeded line of sight towards the equator from where
    you mount the dish.


    +   2. Wiring. Connections to your satellite dish and router.


    +   3. Software. The Helios router is currently designed to work only with Red
    Hat and Caldera Linux. If you have to use a Dynamic IP address, dhcpcd.


    +   4. Hardware. Linux connections to DirecPC are available at this time only
    through a Helios router.


    One problem with current satellite Internet technology is distance. Because geosynchronous
    satellites are so far away, data takes an extra one-third of a second to get to
    your computer. The delay makes two-way videoconferencing difficult, even if two-way
    satellite Internet service were available.'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# Future Options


    The only sure thing is that faster connections are on the way. Within the next
    five to ten years, high-speed Internet connections will become the standard. With
    one connection, you will be able to use your telephone, watch the television program
    of your choice when you want, work from home effectively with the help of videoconferencing,
    and get all of the conveniences of the Internet.


    There are a number of companies working on Internet “appliances” to make this
    happen all over the home. Many current efforts involve setting up Linux with a
    Web browser or customized menu. Little or no customer configuration will be required.


    Future high-speed Internet access may be based on one or more of the following
    technologies:


    +   - **Fiber.** Currently, fiberoptic cables transmit the largest amount of data
    over a practical physical medium.

    - **Cellular.** As we currently communicate digitally over “cell phones,” we may
    soon get our HDTV signals and Internet information digitally using the same basic
    technology.

    - **Two-Way Satellites.** Satellites are being deployed in “low” orbit, hundreds
    of miles above the earth’s surface. They are currently being used for satellite
    telephones; the same technology can be adapted for any two-way data transmission.


    In previous chapters, you learned to set up everything you need for a higher-speed
    connection: Network (Ethernet) cards; IP addresses on a private network; forwarding
    across a Linux computer set up as a modem server.'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'In the next section, you will review the tools that you need to set up the
    hardware and software you need. many providers of higher-speed Internet access
    do not “officially” support Linux, many can still help. A number of different
    ISPs use Linux to run their own systems. Some higher-speed ISPs even have their
    own “HOWTO” designed for the Linux user.


    # Configuring High-Speed Connections


    There are two basic ways to connect your network to the Internet. You can take
    one of the computers on your network and turn it into an “Internet server” by
    connecting it to the Internet. Other computers access the Internet through this
    Internet server.


    > NOTE The term “Internet server” is used to describe one computer on a network
    that you use to get access to the Internet. Do not confuse this with a “Web server,”
    which is a computer where you can create and store Web pages for use by others.


    Alternately, you can get a router. The router includes the direct connection to
    the Internet. Each of your computers is directly connected to the router.


    In the following sections, you will examine each option in more detail. Whether
    you are configuring a computer or a router as an “Internet server,” you need to
    configure many of the same things such as IP addresses and gateways.'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# Create Your Own Internet Server


    You can take one of your computers and turn it into an “Internet Server.” Similar
    to the modem server that you set up in Chapter 10, it has both a connection to
    your network and a connection to your ISP. The difference is that you have a high-speed
    connection instead of a regular modem to get your data from the Internet.


    Depending on the high-speed service that you choose, you need a card to connect
    to your network and one or two cards to connect to your high-speed service. The
    predominant network card in use by high-speed providers is the same Ethernet card
    that you learned about in Chapter 4 and set up in Chapter 5.


    Then you need to configure the software on your Internet server. It gets two IP
    addresses, one for the connection to the Internet, and one for the connection
    to your internal network. You then set up IP forwarding in the same way that you
    did for your modem server in Chapter 10. You need to set up the IP gateway address
    as assigned by your ISP. Finally, you need Firewall and Masquerading software
    based on the same commands as you see in Chapter 10 and 15.


    You will also need to configure the other computers on your network to look to
    your Internet server as a gateway. When it can not find what it wants on your
    local network (e.g., the www.linux.com Web site), it looks to the gateway, which
    then transmits your request to the Internet.


    You can also use a router as an Internet server. The router gets the direct connection
    to the Internet. It also gets connected to each of the computers on your network.'
  merge: -1
  pgno: 282
