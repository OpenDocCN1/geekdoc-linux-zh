    +   - Debian packages. http://cgi.debian.org/www/master/debian.org/Packages/stable/net/netatalk.html


    > TIP If you have an RPM-compatible system, you should install netatalk+asun from
    the RPM packages, if possible. Source code installation is complex and requires
    a bit of configuration; for more information, see the Netatalk HOW-TO (http://thehamptons.com/anders/netatalk).


    # # Configuring Netatalk


    Once you have installed netatalk, you probably do not need to do any configuration
    to get your AppleTalk server running. By default, the server enables Macintosh
    users to access their home directories on the server''s filesystem.


    The following provides an overview of the netatalk configuration files. If you
    have installed netatalk+asun from the RPM version, you will find them in /etc/atatalk.
    If you installed netatalk+asun from source, you will find them in /usr/local/atatalk.


    +   - config. Available only in the RPM netatalk+asun, this file specifies basic
    netatalk settings, including the maximum number of clients (5 by default), the
    name of the AppleTalk server (by default, the server''s hostname, the daemons
    that are run by default (papd and afpd), and the execution mode (background execution
    is enabled by default). You do not need to make any changes to this file. The'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'settings in this file are read by the atalk script, which is installed in /etc/rc.d/init.d.


    +   - atalkd.conf. This file defines the AppleTalk interface for the Linux system
    that is functioning as a Linux server. With most systems, you can simply leave
    this file blank, as netatak will automatically detect the network interface and
    configure itself accordingly.


    +   - afpd.conf. This file configures the AppleTalk Filing Protocol daemon. Again,
    you can leave this file blank. It is needed only if you would like to define more
    than one server on your system.


    +   - papd.conf. This file enables you to make local and network printers available
    to Macintosh users.


    +   - AppleVolumes.default. This file specifies the directories that are mounted
    when a user logs in. By default, the file contains only one non-commented-out
    character, a tilde (~), which displays the user''s home directory. To make other
    directories available, type the pathname on a line by itself and save the file.


    +   - AppleVolumes.system. This file contains a database that maps file types
    to their Macintosh equivalents. You do not need to make changes to this file.


    # Launching the Server


    To start netatak+asun as it is installed from the RPM version, switch to superuser
    if necessary, type the following, and press Enter:


    ```

    /etc/rc.d/init.d/atalk start

    ```


    You should see the message “Starting AppleTalk services (backgrounded). It is
    as simple as that! If you see an error message, make sure that AppleTalk DDP support
    is enabled by means of the Appletalk module; type'
  merge: -1
