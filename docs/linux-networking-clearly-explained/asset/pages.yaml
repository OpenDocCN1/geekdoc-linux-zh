    # Setting Up Exports


    To make shared directories available to remote clients, you need to export them.
    This is a two-step process. First, you will list the directories to be exported
    in an important configuration file, called /etc/exports. Then you will use the
    exports command, which makes the exported directories available to clients on
    the network.'
