  md: '# Sharing High-Speed Connections


    In Chapter 10, you set up your network to share a telephone modem connection to
    the Internet. In this chapter, you will explore the many options for faster connections.


    The good news is that setting up a shared high-speed connection on your network
    is often easier than setting up a modem connection. The bad news is that high-speed
    connections are usually more expensive, not only in monthly fees, but also in
    installation costs.


    This chapter first helps you measure what you need for a high-speed connection.
    Next, it examines the wide'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'variety of affordable high-speed technologies so that you can determine what
    is best for you.


    Your choice determines the hardware you need, which leads to the software that
    you must have set up on your Linux system. Only then can you connect your computer
    and then your network to the Internet through a high-speed connection.


    # # Finding the Speed You Need


    There are a number of different technologies that you can use for high-speed Internet
    access. The differences seem intimidating. Even after you choose a technology,
    you may have to choose between a number of different companies competing for your
    business. What they offer usually depends on the speed that you need.


    Before you make a choice, you need to determine your needs in the following areas:


    +   1. **Download Speed.** How much data do you and the other users on your network
    take from the Internet? How much delay can you tolerate?


    +   2. **Upload Speed.** How much data do you and your users send to the Internet?


    +   3. **Budget.** What are you willing to spend for equipment, special installation
    services, and monthly fees?


    +   4. **Type of connection.** Do you and your users need instant and reliable
    access to the Internet?'
  merge: -1
  pgno: 263
- img_proc: true
  md: 'CHAPTER 11 • SHARING HIGH-SPEED CONNECTIONS 253


    +   5. Address. Do you have a use for a permanent Internet (IP) address?


    +   6. Protection. Can you dedicate a computer to protect your network from attack
    through the Internet?


    +   7. Number of Users. Did you take into account that the number of users you
    also drives the speed you need?


    In the following sections you can find the information that you need to address
    each of these issues.


    # **Download Speed**


    Any data that you receive on your network is a “download.” The speed you need
    depends on the amount of data that you take and the time that you are willing
    to wait. While requirements change constantly, review Table 11.1 for guidance
    on the speed you need.


    Table 11.1 Internet Speed Requirements

    | Service | Speed |

    |---|---|

    | Internet Surfing | 28-128 kbps, mostly download |

    | CD Quality Sound | 40-80 kbps, Mostly download unless two-way sound (e.g., an
    Internet telephone call) is desired. |

    | Video Conferencing | 384 kbps, upload and download |

    | Uploads / Downloads | Size of file / Time to wait |


    For example, if you and your users simply “surf” the Internet, according to Table
    11.1, each user needs an average download speed of between 28 kbps and 128'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'kbps. If you are looking for high sound quality for Internet telephone calls,
    you want 40 to 80 kbps per user in each direction. The speed that you need for
    video videoconferencing increases rapidly if you want larger pictures (i.e., greater
    than 4 inches square).


    When you are calculating the time to download a file, you need to know that data
    transfer speeds, such as for your modem, are measured in bits, while files are
    sized in bytes. There are 8 bits in a byte. In other words, if you are downloading
    a 1 Megabyte file over a 56-kilobits-per-second modem, you''re actually downloading
    8-Megabytes of data. Also, networks usually work at half their rated speed (or
    less). While a 1-Megabyte file download theoretically takes only 2.5 min, in practice,
    this download can take 5 min (or more). If anyone else is using your network,
    your wait will increase.


    # Upload Speed


    If you are simply “browsing” the World Wide Web, your users are only sending text
    information to your ISP, text that contains the Web addresses (also known as URLs
    or Uniform Resource Locators) of the sites you want to visit. Even a telephone
    modem connection is good enough for this purpose. However, if you are sending
    a Lot of data, such as through a video camera, you will need more upload speed
    than many “high-speed” services can provide.


    # Budget


    High-speed equipment can be expensive. When considering routers and satellite
    dishes, equipment costs can run into the thousands of (US) dollars before costs
    for installation.'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# CHAPTER 11 SHARING HIGH-SPEED CONNECTIONS


    Where there is heavy competition for high-speed customers, a number of companies
    waive the costs of equipment and or installation, usually in agreement to use
    their services for a certain period of time.


    # Type of Connection


    Some high-speed ISPs require that you use a modem to connect before you can upload
    and download data. Others offer an “always on” connection, which can save you
    that hassle. However, this convenience may come with a higher price tag.


    # Type of Address


    Some high-speed ISPs give you one IP address that you use as long as you subscribe
    to their service. This is also known as a Static IP address.


    Static IP addresses are easier to configure because they do not require you to
    install the DHCP client daemon (dhcpcd). Static IP addresses make two-way communication
    such as video conferencing, more convenient because others can use it as your
    telephone number to call you.


    If you have a Dynamic IP address, you can set up a static host name on the Internet
    by joining a currently free service at http://www.dyndns.org. This sevice keeps
    track of your IP address when it changes; the static host name allows others to
    contact you.


    # Protection


    High-speed connections are tempting targets for crackers. If they can break into
    your computer or network, they can'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'use your connection to attack other users and Web sites. A firewall protects
    your network against attack from out-side your network. However, it may not completely
    protect the computer where you set up the firewall. A dedicated firewall is a
    device where you store no critical information. There are two kinds of dedicated
    firewalls:


    +   - **A Dedicated Computer.** You can set up an older computer as a firewall.
    Set up Linux on that computer, use the commands you learned in Chapter 10 (and
    what you will learn in Chapter 14), and connect it as the gateway between the
    Internet and your network. If you set up your firewall correctly, the worst that
    can happen is that others find that you have not stored anything important on
    your firewall.


    +   - **Router as a Firewall.** Alternately, you can use a specialized network
    device known as a router. Routers are designed as junctions between networks,
    usually with firewalls. Some high-speed Internet services may even supply a router
    as a firewall for your network. One advantage of a router is that you can connect
    all of your computers directly to it.


    Once you have addressed these issues, you are ready to consider the available
    options for high-speed Internet service.


    # Number of Users


    In figuring the requirements for your own system you need to consider the following
    current and future needs of your users:


    +   - **Number of Simultaneous Users.** If you have a network, you may have more
    than one user surfing the'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'Internet at the same time. However, they may not be downloading large files
    simultaneously. In other words, you do not need to multiply the maximum needs
    of each user by the maximum number of users.


    +   **Patience of Your Users.** This is subjective. Some users are willing to
    wait a little longer to get their Internet information.


    +   **Growth.** Other users may discover the advantages of videoconferencing after
    you upgrade your Internet connection. You may need to adjust the service that
    you use depending on the changing needs of your users.


    As for growth, in the next few years, there will be a “convergence” of information
    technologies, all delivered through the Internet. In other words, you will be
    able to get telephone, television, and Internet service through one connection.
    The speeds that you will need will go up as well; for example, you may need as
    much as 6 Megabytes (48 Megabits) per second of information for a full-size High-Definition
    Television (HDTV) signal.


    # Examining High-Speed Connection Options


    Now that you have some idea about the Internet connection speed you need, the
    next step is to examine the variety of services available. Each service makes
    different demands on your facilities, your wallet, and finally your Linux system
    and network.


    Most high-speed connection options are set up to connect to your computer through
    Ethernet (10 Mbps), and Fast Ethernet (100 Mbps) Network cards as well as regular
    telephone modems. You have learned to install each of these components in previous
    chapters.'
  merge: -1
  pgno: 268
- img_proc: true
  md: 'While there are many different types of high-speed service, three parameters
    determine what you need to install:


    +   - One-Way or Two-Way. If you have "two-way" service, you get high-speed access
    for uploads as well as for downloads. Ethernet network cards are designed to work
    with two-way connections. If you have only "one-way" service, your have high-speed
    access for downloads. You would need a regular telephone modem for uploads.


    +   - Static or Dynamic IP Address. Some services come with a Static IP address,
    which means that you do not need to install the DHCP service.


    +   - Maximum or Minimum Speed. Some ISPs provide high-speed service offer a guarantee
    that you can always transmit and receive at some minimum speed.


    The following table can help you compare the speeds available. There is serious
    competition between these services in many markets, so it is important to check
    with your local providers.


    You already learned to set up a telephone modem to connect your network in Chapter
    10. You will learn about most of these options in the following sections. The
    exceptions are wireless modems because of their relatively slow speed and ISDN
    because of their comparatively higher cost.


    See Table 11.2 for high-speed service possibilities.'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# Table 11.2 High-Speed Services


    | Option | Speed |

    | --- | --- |

    | Wireless Modems | 28.8 and 128 kbps. Wireless modems are not limited to 53 kbps
    as are telephone modems. However, their speeds pale in comparison to high-speed
    wireless service. |

    | ISDN | 128 kbps. As of this writing, ISDN lines are much more expensive than
    DSL or Cable. Because of DSL, telephone companies no longer appear interested
    in promoting this service. |

    | Cable (One-Way) | Up to 5 Mbps download. May be much slower depending on local
    demand. Uploads limited by the speed of telephone modems. |

    | Cable (Two-Way) | Up to 5 Mbps download. Can be much slower depending on local
    demand. Upload speeds usually limited to 128 kbps. With a "splitter", you can
    receive Cable TV signals over the same wires. |

    | High-speed Wireless | Up to 6 Mbps. Two-way wireless systems are currently set
    up upload speeds up to 1 Mbps. One-way wireless systems use telephone modems for
    uploads. |

    | Satellite | 400 kbps download maximum. As only one-way service is available,
    satellite Internet requires a telephone modem for uploads. |

    | DSL | 128 kbps and up as a guaranteed minimum speed. Higher speeds are available.
    Upload speeds are commonly slower. With a "splitter", you can connect a regular
    telephone to the same line. |

    | Tx Lines | ISPs connect to the Internet with T1 (1.5 Mbps), T3 (44 Mbps) and
    faster lines. You can too, but this option currently |'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'requires expensive equipment. You can divide a Tx line into data and several
    regular telephone lines.


    Fiber Faster. If you are willing to pay the price, fiberoptic data speeds are
    available in gigabits per second, but are currently not practical for home or
    small business use. However, this could change.


    In each of the following sections, you will review the basics of each service.
    Then you will review what you need in four categories: Computer hardware, wire
    installation; software; and any special issues unique to Linux.


    As you visualize your Local Area Network connection, there are two basic options.
    You can set up one computer as an Internet server, similar to how you set up one
    computer as a modem server in Chapter 10. If available, you can alternately use
    a router as your Internet server as a hub that connects directly to all of the
    computers on your network.


    # Two-Way Cable Internet


    When you have a two-way cable modem, your gateway computer or router sends uploads
    and downloads through this modem.


    Some of you may know that the wires for cable television service are virtually
    identical to the wires used for an older version of Ethernet. Unfortunately, older
    television service is set up only for one-way transmission of data. A number of
    cable companies are building new two-way networks for television signals and Internet
    data.'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'To determine two-way cable modem service is available for your location, contact
    your local cable company.


    If you choose two-way cable modem service, you will need to consider the following
    factors. Consult your cable company about how they handle each issue.


    +   1. **Equipment.** You will need a cable modem and Ethernet card to connect
    a single computer on your network. Cable ISPs often provide this equipment as
    part of the service. Alternately, some cable ISPs have a dedicated router, which
    provides firewall services as well as a connection for multiple computers on your
    network.


    +   2. **Wiring.** The cable company provides cable line up to your cable modem.
    From there you may need to provide the Ethernet cable to connect to your card
    and your other computers.


    +   3. **Software.** The following Linux packages: gated, ipchains to set up your
    computer as a gateway and a firewall. If you have to use a Dynamic IP address,
    use dhcpcd.


    Before you choose a cable modem, check the experience of other Linux users. Most
    are documented in the Cable Modem Providers HOWTO. Specific experiences for a
    number of different cable modem providers (including many outside the US) are
    listed here. Unlike most HOWTO, the latest version of this document can be found
    on the Open Source Writers Group Web page at http://www.oswg.org.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# One-Way Cable Internet


    **NOTE** As of this writing, some governments are trying to open the cable Internet
    network to some or all Internet service providers.


    Some cable TV companies provide cable modem service for downloads only. In other
    words, you need a telephone modem for everything that you send to the Internet,
    from requests for specific Web pages to e-mail that you send. Because uploads
    through telephone modems are normally limited to 33 kbps, you cannot take advantage
    of two-way high-speed services such as videoconferencing.


    **NOTE** The 33 kbps upload speed limit is standard even if you are using a 56-kbps
    telephone modem.


    With a one-way cable connection, uploads proceed at a maximum of 33 kbps, and
    downloads occur at a maximum of 5 Mbps. You can also see that the computer requires
    three cards for networking: two Ethernet cards (eth0, eth1), and one telephone
    modem (ppp0). You need to know if your computer has room for all three cards.


    To determine if one-way cable Internet service is available for your location,
    contact your local cable company.


    If you choose one-way cable Internet service, you will need to consider the following
    factors. Consult your cable company about how they handle each issue.


    +   1. **Equipment.** You will need a cable modem, a telephone modem, and an Ethernet
    card to connect a single computer on your network. Cable ISPs often provide this
    equipment as part of the service.'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'Alternately, some cable ISPs have a dedicated router, which provides firewall
    services as well as a connection for multiple computers on your network. Otherwise
    the connection to your other computers is left up to you.


    +   2. **Wiring.** The cable company provides a cable line up to your cable modem.
    From there you may need to provide the Ethernet cable to connect to your card
    and your other computers. You will also need to provide the wiring from your telephone
    modem.


    +   3. **Software.** You will need the following Linux packages: gated, ipchains
    to set up your computer as a gateway and a firewall. If you have to use a Dynamic
    IP address, dhcpcd.


    +   4. **Open Channels.** ISA cards are easier to install in Linux; as most newer
    computers are limited to one or two slots, you may need to use some PCI cards
    and slots as well. Each card also requires IRQ, DMA and I/O resources that you
    might have already dedicated to other purposes such as printers and drives.


    Before you choose one-way cable Internet service, check the experience of other
    Linux users. Most are documented in the Cable Modem Providers HOWTO. Specific
    experiences for a number of different cable Internet providers (including many
    outside the US) are listed here. Unlike most HOWTOs, the latest version of this
    document can be found on the Open Source Writers Group Web page at http://www.oswg.org.'
  merge: -1
