  md: '# PART TWO • BUILDING YOUR LOCAL AREA NETWORK (LAN)


    specify module parameters correctly, look for the module''s name in /usr/src/linux/Documentation/net-working.


    Here is an example of module parameters in action. To load the 3Com 3c501, you
    can specify the I/O address and the IRQ. By default, the 3c501 module assumes
    that the adapter is using I/O base address 0x280 and IRQ 5; if the card is set
