    # Client/Server Networks


    The history of networking reads much like the history of France in the eighteenth
    century: a despotic regime, followed by an experiment in democracy that degenerates
    into anarchy. Between these two extremes are client/server networks, which represent
    a middle ground between timesharing systems and peer-to-peer networks. Most LANs
    that connect more than a dozen or so computers are client/server networks.


    On a client/server network, each workstation is a full-fledged computer, with
    its own processing circuitry, memory, storage, and software. In this sense, the
    workstation is like a personal computer, in which the user can control application
    selection. However, the network is integrated by a server, also called a dedicated
    server or file server.'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# CHAPTER 3 ESSENTIAL NETWORKING CONCEPTS 79


    Administered by the person who bears responsibility for the network as a whole,
    the network administrator, the server contains shared file storage and applications
    that are accessible to everyone on the network. The server also makes expensive
    peripherals such as network printers and scanners available to network users.


    In terms of software, client/server networks make use of programs that are divided
    into two parts, a client part and a server part. The client portion of the program
    runs on users'' workstations. It contains code that enables it to access the server,
    the portion of the program that makes a certain type of data available. Internet
    applications make use of the client versus server distinction. A Web browser is
    a client for the World Wide Web, one of several Internet services. Browsers contact
    Web servers, which make Web data available via the network.


    Client/server terminology is somewhat confusing because it refers to two different
    levels, hardware and software. At the hardware level, client/server networks often
    use powerful computers called file servers, which are dedicated to the purpose
    of making files and applications available to network users. At the hardware level,
    server programs are installed on the file server. However, they may also be installed
    on users'' workstations. In principle, any computer in a client/server network
    can take on the server role. In practice, the best performance is achieved when
    a file server is set aside so that it can focus on server duties.


