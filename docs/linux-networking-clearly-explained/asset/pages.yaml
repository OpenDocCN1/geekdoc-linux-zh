    # Mounting Remote Directories Manually


    If you would like to mount remote directories on an as-needed basis, you can do
    so with the mount command. This command requires superuser status. To mount, you
    will need to specify the mount point. The mount point is a directory on your local
    system. After you mount the remote directory, the remote directory''s contents
    will appear within the mount point directory, as if these contents were part of
    your local filesystem.


    Suppose I am using my notebook computer, called rivendell, and I want to connect
    to my home directory on the remote computer, called lothlorien. The following
    example specifies the remote directory to be mounted (/home/bryan, on lothlorien)
    as well as the mount point (/home/bryan/lothlorien, on rivendell):


    ```

    mount -w lothlorien:/home/bryan

    /home/bryan/lothlorien

    ```


    This command mounts the lothlorien directory /home/bryan to the client system,
    using the mount point /home/bryan/lothlorien. The -w switch gives users write
    privileges (but only if you set up the rw option in the server''s /etc/exports
    file.


    When you are finished using the remote directory, you can unmount it using the
    umount command. Switch to superuser, type mount followed by mount point''s name,
    and press Enter. The following command unmounts the mount point directory called
    /home/bryan/lothlorien:'
