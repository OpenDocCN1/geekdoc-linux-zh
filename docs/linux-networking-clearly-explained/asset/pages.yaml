    this remains true only as long as the network remains small. In general, a peer-to-peer
    network that links more than a dozen or so computers is likely to become chaotic.
    Security risks could develop because no one person is watching out for the network
    as a whole.


    Linux does not natively support peer-to-peer networking in the simple, transparent
