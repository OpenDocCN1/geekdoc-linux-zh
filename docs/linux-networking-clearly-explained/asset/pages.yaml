  md: '# 12


    # Running an Intranet Web Server


    Now that you have set up your network connection to the Internet, everyone on
    your network is happily surfing. It is time to bring advantages of the Internet
    to your own network. It is also time to set up an internal internet, or intranet,
    with Web pages only for your users.


    One way in which intranets have changed the corporate world is in how people communicate
    within their organizations. An internal Web page is a way to send a joint message,
    to ensure that everyone is working towards the same goal.'
  merge: -1
  pgno: 296
- img_proc: true
  md: 'An intranet is a network inside a company or other organization. In contrast,
    an internet is any group of networks that are connected together. The Internet
    is the worldwide group of interconnected public networks.


    The key to communication on any of these networks is a Web server, which is any
    computer setup with software to "serve" Web pages to other computers. The Web
    server used for Linux computers is known as Apache.


    You will get enough information from this chapter to create your own intranet.
    In addition, you will set up a Linux package known as Apache as Web server. Although
    Apache is currently the most popular Web server on the Internet, what you set
    up is limited to your internal network, or intranet.


    If you want to set up your own Web site on the Internet, there are many good ISPs
    who can help. Whether they use Linux, Unix, or some variant of Windows, you can
    also learn enough from this chapter to be an intelligent customer for their services.


    # Introducing Apache


    The first Apache server was developed in 1995 at the National Center for Supercomputing
    Applications (NCSA). The name Apache is loosely derived from the large number
    of software "patches" or fixes that were made to the original NCSA Web server
    ("A PatCHySErver").


    Similar to most other Linux applications, Apache is an open source, which means
    that you can copy and use it'
  merge: -1
  pgno: 297
- img_proc: true
  md: 'for free. Although it comes with no warranty, there is a substantial community
    of users ready and willing to help.


    Although Apache is complex, starting Apache is fairly simple. In this chapter,
    you learn to get Apache up and running. Later, you will learn some of the features
    that come with this application.


    # Resources


    The work on the Apache Web server is rich and extensive. You can find a host of
    resources, including documentation, the latest downloads, and several different
    kinds of help on the Apache Web site at http://www.apache.org/httpd.


    Apache is included with most major Linux distributions. Alternately, you can download
    the latest version of Apache in rpm or tar.gz formats from your distribution''s
    Web site or from major Linux download sites such as www.rpmfind.net and www.linuxberg.org.


    The pattern of the following sections should now be familiar. First, you will
    check for and then install Apache if required. Then you will choose which directories
    to share for your Web service, and finally decide how to share with different
    computers on (or outside) your network.


    # Installation


    You may already have Apache installed on your computer. If it is running, you
    will see it from the following command:'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# PART FOUR • CREATING AN INTRANET


    ```

    ps -ax | grep http

    ```


    If Apache is running, you will see a number of lines with “http” at the end. That
    means the http daemon, which is the program that runs Apache, is operational.
    The number of “httpd” is related to the number of users who can connect simultaneously.


    Another way to check is to open up your Web browser, then type localhost in the
    Location text box. If you are connected to the Internet, and Apache is not working,
    you will be sent to www.localhost.com.


    It is possible that Apache is not even installed. Open a command line interface.
    Go into root or superuser mode. In Red Hat Linux, look for httpd in the /etc/rc.init.d/
    directory. If you are using another distribution, use its package manager to see
    if Apache or “httpd” is installed.


    The most reliable way to install Apache is based on the instructions that come
    with your Linux distribution. As different distributions expect key Apache files
    in different directories, consult your documentation for instructions on how to
    install Apache from the source files on your CD-ROM or downloaded from your distribution’s
    Web site.


    If you are installing a slightly older version of Apache, you will find a long
    list of packages. Do not be intimidated by this list. You will not need most of
    these packages, which are commands written in a computer language called perl.
    You will only need the rpm or tar.gz files for the commands that you use. The
    packages that you absolutely need to run Apache are:'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# CHAPTER 12 • RUNNING AN INTRANET WEB SERVER 289


    +   - Apache. If you need the latest version, download it from http://www.apache.org.


    +   - Perl. You need the basic perl package if if you want to use any of the perl
    commands. Perl is currently installed by default on most Linux distributions.


    +   - Mod-Perl. Allows your Apache server to read Perl commands from your Apache
    configuration file. This package is automatically installed with newer versions
    of Apache.


    +   - Perl-Apache-xxx. You only need to load the packages associated with the
    commands that you use. You probably already have the Perl modules that you need.
    However, if you run into an error when you to start Apache, review the error message
    and your Apache configuration file. In Red Hat Linux, this text file is located
    at /etc/httpd/conf/httpd.conf. This should give you a clue as to what additional
    module(s) you need to install. Most Perl-Apache modules are automatically installed
    with newer versions of Apache.


    Because newer versions of Apache include Perl modules, they are easier to download
    and install. Once installed, you can start Apache by starting the http daemon,
    also known as httpd. In Red Hat Linux, for example, it is located in the /etc/rc.d/init.d/
    directory. Start Apache by running the /etc/rc.d/init.d/httpd start command. Consult
    your distribution’s documentation for the appropriate start command if you have
    another type of Linux.


    > TIP If you are using Caldera Linux 2.4 or above, use the graphical Webmin tool
    to manage Apache.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# Configuring Apache for Basic Web Services


    When you download and install Apache, it is set up in such a way that it should
    work. If you do not get an error when you start the http daemon (httpd), you should
    be able to open Netscape on your computer, type in http://localhost in the Location
    text box, and you should get the default Web page, which confirms that Apache
    is working.


    When you install Apache, it may not be quite ready to serve Web pages on your
    internal network. What you need to do is similar to turning on the switches on
    your computer.


    The switches are located in three different configuration files:


    +   - access.conf. Determines the computers that can access your Apache Web server,
    as well as directories they are allowed to use. You will place your Web pages,
    pictures, etc. in these directories, as defined in srm.conf.

    - httpd.conf. The main Apache configuration file, which configures usable Perl
    commands. You can also use this file to set the number of simultaneous users on
    your Web server.

