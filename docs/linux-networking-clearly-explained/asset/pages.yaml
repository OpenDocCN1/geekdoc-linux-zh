    ```

    modprobe 3c501x io=0x340 irq=10

    ```


    This command tells the modprobe utility to load the 3c401 module into the kernel,
    and configures the module to use I/O base address 0x340 and IRQ 7.


    # Specifying Module Configurations


    If you plan to load a particular module frequently, you will want to take advantage
    of modprobe''s ability to work with the /etc/conf.modules configuration file (also
    called /etc/modules.conf). In brief, this configuration file enables you to specify
    an alias for the module. It also enables you to specify the module parameters
