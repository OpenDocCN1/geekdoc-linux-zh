  merge: -1
  pgno: 346
- img_proc: true
  md: '# PART FIVE • MANAGING YOUR NETWORK


    address and host name of your default gateway, this message should travel to your
    ISP’s DNS server and finally to the “pinged” internet site. Any problem here is
    a job for the next command.


    TIP When you stop the ping response with a <Ctrl-C>, you will stop the response
    to one packet. Therefore, it is normal to have one fewer packet received than
    transmitted. Also, note the time for each ping. That is the time, in milliseconds,
