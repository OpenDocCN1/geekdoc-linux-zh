    the Internet protocols (TCP/IP) expect Ethernets to conform to the older, proprietary
    standards created by Xerox. In general, most Ethernet hardware can work with both
    standards.


    # Ethernet Protocols


    As you learned in Chapter 3, computer networks are profitably analyzed using layer
    classifications supplied by the OSI Reference Model. The Ethernet''s role becomes
    clear when you realize that Ethernet protocols operate at the very lowest layers
    of the protocol stack, the data link layer, and the physical layer. The data link
    layer, as explained in Chapter 2, governs the means by which data encapsulated
    in packets is transferred to the physical network medium. The physical layer governs
    the transmission of data on the physical medium itself.


    # Protocol Independence


    Because the Ethernet is concerned only with the lowest levels of the protocol
    stack, it can work with many different networking protocols that operate at higher
    levels. Any of the following will work smoothly with an Ethernet:


    +   - AppleTalk. This Apple Computer protocol provides the network routing and
    addressing functions for all Macintosh networks, whether they use LocalTalk, Ethernet,
    or token-ring networks at lower layers.

    - IPX/SPX. These are the network and transport layer protocols used for Novell
    NetWare networks.

    - NetBIOS/NetBEUI. The NetBIOS/NetBEUI protocols (NetBEUI is pronounced “net-boeey”),
    jointly created by Novell and Microsoft, provide the foundation for Microsoft
    Windows 95/98/NT networks.'
  merge: -1
  pgno: 106
- img_proc: true
  md: 'The most important NetBEUI protocol, called server message blocks (SMB), defines
    the packet format for NetBEUI networks.


    +   - TCP/IP. This is the name of the Internet protocol suite. Like AppleTalk,
    TCP/IP can be used with a variety of lower-level protocols, such as Ethernet.


    The ability of the Ethernet to work with any of these protocols (and others not
    mentioned here) is called protocol independence. In other words, the Ethernet
    protocols are independent of any of the aforementioned protocols. The degree of
    independence is so great that, in fact, you can run more than one of these protocols
    simultaneously on an Ethernet without worrying about them conflicting with each
    other. It is quite commonplace to run TCP/IP, NetBEUI, and AppleTalk on the same
    Ethernet that Linux, Microsoft Windows, and Mac OS systems can share network resources.


    # Ethernet Versions


    Although early versions of Ethernet used coaxial cable in bus networks, the most
    popular versions today are Ethernet star networks that use hubs and UTP (unshielded
    twisted pair wire). Two versions are available: 10baseT (10 Mbps) and Fast Ethernet
    (100 Mbps, also called 100baseT). A new version, called Gigabit Ethernet, enables
    data transfer at 1000 Mbps (1 Gbps).


    +   - 10Base2. 10-Mbps Ethernet using thin coaxial cable; also called Thin Ethernet.
    Limited to 185 m of unrepeated cable.


    +   - 10Base5. 10-Mbps Ethernet using thick coaxial cable. Limited to 500 m of
    unrepeated cable.'
