    | r w x r r x r w x | u=rwx,g=rwx,o=rwx | 777 |


    # Changing File Ownership with chown


    To change the ownership of files or directories, use the chown command. To use
    chown, type **chown** followed by a space, the user or group name, and the name
    of the file or directory. The following is an example:


    ```

    chown bryan mydoc.txt

    ```


    A very neat option is -R, which changes ownership recursively. This option enables
    you to change file ownership'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'throughout a directory and all the subdirectories it contains. An example is
    as follows:


    ```

    chown -R bryan /home/bryan

    ```


    **TIP** If you have messed up file ownership in your home directory by saving
    files while you are logged in as root user, you can use the recursive (-R) option
    just mentioned to restore the correct file ownership throughout your home directory.
    Do not kill these processes; doing so could damage data or bring your system down.


    # Changing a File''s Permissions with chmod


    To alter a file''s permissions, use the chmod command. To use the chmod command,
    you need to learn a few abbreviations. Use the following to indicate permission
    types:


    +   * **r (read).** Indicates read-only permission (the file can not be altered
    or deleted).

    * **w (write).** Indicates write permission (the file *can* be altered or deleted).

    * **x (execute).** For program files, indicates execute permissions (the program
    is available).


    Use the following to indicate types of owners:


    +   * **u (user).** Normally, this is the user who created the file. Using chown,
    you can specify a different owner.

    * **g (group).** Additional users who are members of the owner''s group.

    * **o (others).** All other users *except* the user and group.

    * **a (all).** Any user of the system, including user, group, and others.'
  merge: -1
