  md: '# Configuring and Using AppleTalk


    AppleTalk is Apple Computer''s protocol suite for local area networking. Similar
    to NFS and SMB, it is a higher-level protocol suite that is designed to run "on
    top" of more basic networking protocols and physical media, including Ethernets,
    FDDI (fiber optic) networks, token-ring networks, and Apple''s proprietary, LocalTalk
    networks. On an Ethernet, AppleTalk coexists peacefully with other middle-level
    protocols, including TCP/IP and SMB, the Windows networking protocol that is supported
    by Samba.


    The Linux kernel natively supports AppleTalk networking. To connect Macintoshes
    to a Linux network,'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'you will need to install and configure natatalk, a package that transforms
    a Linux workstation into an AppleTalk server. In the same way that Samba enables
    a Linux system to appear within Windows users Network Neighborhood, natatalk enables
    Linux systems to appear as a connection option within the Macintosh Chooser.


    > **TIP** Netatalk enables Macintosh users to access shared resources on Linux
    systems. However, there is no free software that enables Linux users to access
    resources on Macintosh systems. A package that formerly made this type of connection
    possible, apfs, is not compatible with recent Linux kernels; for information on
    updates, see http://www.panix.com/~dfoster/apfs.


    Although natatalk is a working package that can be used successfully to network
    with Macintoshes, you should be aware of the following:


    +   * In contrast to Samba, natatalk development is sporadic and poorly coordinated.

    * Documentation is skimpy or, worse, incorrect. For example, the main natatalk
    distribution site located at the University of Michigan does not indicate that
    the natatalk code obtainable from this site does not work with Linux. In order
    to get natatalk to work with Linux, you need natatalk with Adrian Sun''s extensions
    (natatalk+asun).

    * Although natatalk enables Macintosh users to access shared resources on Linux
    systems, Linux users cannot access Macintosh files or directories. However, they
    can access Macintosh printers.


    Despite these deficiencies, netatalk is worth installing and configuring; currently,
    the package works reasonably well for making Linux directories available to Macintosh'
  merge: -1
  pgno: 227
- img_proc: true
  md: 'users. Printer configuration is possible, but the software is sufficiently
    buggy that it is not recommended; for example, a known bug causes printers to
    become comatose after finishing a print job, which means the printer has to be
    restarted after a print run. Accordingly, this chapter focuses on making Linux
    directories available to Macintosh users.


    # Introducing AppleTalk


    The AppleTalk protocol suite contains the following protocols:


    +   - Datagram Delivery Protocol (DDP). This protocol governs the “wrapping” of
    AppleTalk data into packets for network transmission. The protocol is natively
    supported by the Linux kernel, but you will need to make sure that this support
    is enabled (see “Configuring Your System for Macintosh Networking"), later in
    this chapter.

    - Routing Table Maintenance Protocol (RTMP). This protocol defines the way an
    AppleTalk propagates routing tables so that all networked machines know where
    the other machines are located.

    - Name Binding Protocol (NBP). This protocol specifies hostname resolution within
    AppleTalk networks.

    - Zone Information Protocol (ZIP). This protocol supports separate AppleTalk zones,
    or virtual subnetworks, within an AppleTalk network. The zones show up in the
    Chooser, a Macintosh utility that is used to connect to the network.

    - AppleTalk Echo Protocol (AEP). This protocol enables a network service similar
    to ping. It is sup-'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'ported by the aecho utility, which is part of the netatalk package.


    +   - AppleTalk Transaction Protocol (ATP). This protocol defines AppleTalk services
    that require reliable exchanges of data between the client and server.


    +   - Printer Access Protocol (PAP). This protocol provides access to network
    printers.


    +   - AppleTalk Session Protocol (ASP). This protocol defines the means to open,
    maintain, and close actions during a session.


    +   - AppleTalk Filing Protocol (AFP). Designed to run "on top" of ASP, this protocol
    enables users to access data files on a shared server.


    The preceding indicates, AppleTalk is a comprehensive suite of protocols that
    is comparable to SMB in its breadth (see Chapter 8). It implements file sharing
    and printer sharing. For authentication, AppleTalk relies on the user names and
    passwords available on the server.


    # Introducing Netatalk


    Netatalk+asun consists of a number of separate daemons and utilities that collectively
    implement all of the AppleTalk protocols. The most important of these are as follows:


    +   - atalk. This daemon implements RTMP, NBP, ZIP, and AEP; NBP, ATP, and ASP
    are implemented as libraries;


    +   - papd. This daemon implements PAP;


    +   - psf. This utility is a PostScript printer filter for lpd, which enables
    lpd to work with PAP; and'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# CHAPTER 9  CONFIGURING AND USING APPLETALK  219


    +   - afpd. This daemon implements the Apple Filing Protocol so that Mac users
    can access files on Unix systems.


    # System Configuration Essentials


    To integrate Macs into your Linux network, the netatalk server needs the following:


    +   - Kernel 2.2 or later. Earlier versions of the kernel will not work with the
    netatalk+asun package.

    - AppleTalk DDP support. Most Linux distributions enable DDP by default. Still,
    you should make sure that this support is enabled in the kernel configuration
    you are using. To do this, open a terminal window, switch to /usr/src/linux, type
    make menu-config, and press Enter; you will see the Linux Kernel Configuration
    dialog box. Click Networking Options, and make sure AppleTalk DDP is enabled as
    a module (M). If this option is not enabled, check M, and follow the on-screen
    instructions to recommend the modules on your system.

    - User directories. Create user names and home directories for each of the Macintosh
    users who will be given access to file storage space on the server. To create
    a shared storage space, create a group named mac, and give this group ownership
    of a directory named /home/public.


    # Obtaining Netatalk+asun


    You will find the latest versions of netatalk+asun at the following locations:'
