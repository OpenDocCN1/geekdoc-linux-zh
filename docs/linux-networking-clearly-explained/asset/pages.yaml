    # Repeaters


    A repeater is a simple device that receives Ethernet data from one segment of
    Ethernet (a portion of the network that is physically bounded by a hub, repeater,
    bridge, router, switch, or line termination). It amplifies the signals and repeats
    them at full strength for a new network segment. Repeaters are used to extend
    Ethernet beyond the maximum unrepeated cable length.


    Repeaters are simple devices that do nothing but extend the maximum length of
    Ethernet physical media. The result is a lengthier network, but all of the attached
    workstations are part of a shared Ethernet, a single, virtual network in which
    all the computers are contending for network access. In other words, all of the
    workstations are part of the same collision domain. If you connect too many workstations
    to the network, performance degrades.


    > **TIP** How many workstations is “too many?” Experience with world Ethernet
    suggests that the number is far below the rated capacity of 10BaseT and 100BaseTX
    networks (1024 workstations). The real-world limit varies according to the network''s
    use, for example, if you are using the network to give every user access to the
    Internet, network traffic will be significantly higher than it would be without
    an Internet connection. As a rule of thumb, try not to exceed 64 workstations
    per collision domain—and cut that number in half if you are providing Internet
    connections.'
