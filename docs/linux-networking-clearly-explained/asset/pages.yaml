  md: '# Associating Applications with Data Types


    To configure Navigator to work with installed applications on your system, do
    the following:


    +   1. First, open up Netscape Communicator. Click the Main Menu button, point
    to Red Hat, point to Internet, then click Netscape Communicator.


    **TIP** In Core Linux, click the Main Menu button, point to Applications, then
    click Netscape Navigator.


    +   2. In Netscape Navigator, click Edit on the menu bar, and choose Preferences.
    You will see the Netscape Preferences dialog box.


    +   3. In the Category list, click the arrow next to Navigator, if necessary to
    reveal subcategories, and select Applications. You''ll see the Applications page,
    shown in Figure 2.1.


    +   4. Select the data type you want to change, and click Edit. You''ll see the
    Application dialog box, shown in Figure 2.2.


    +   5. In the Handled By area, check Application, and type the application''s
    startup command in the text box.


    +   6. Click OK until you see Netscape Navigator again.


    **TIP** To test your helper application configuration, visit the "Ready-to-Go
    Solaris Helpers Page" (http://home1.swipnet.se/%77Ew-10694/helpers.html or http://www.ase.ee/moshkow/lat/WEBMASTER/sol-helpers.txt#0).
    You will find links to small multimedia files throughout; click on these to test
    your helper applications.'
