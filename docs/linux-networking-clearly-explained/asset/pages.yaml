    directory.


    # Mounting Remote Directories Automatically


    If you would like your client to mount the remote directory each time the system
    starts, you can add the mount information to /etc/fstab. You should do this only
    if the following are true:


    +   - The server runs 24/7. If you shut down the server, TCP/IP service on the
    clients will be interrupted and you may have to reboot the clients to get them
    working again.

    - The client is permanently connected to the network. Do not configure a notebook
    computer to load remote shares automatically.


    To add the information to /etc/fstab correctly, you must carefully observe the
    following syntax:


    ```

    server:directory mount-point nfs options

    ```


    Here, server refers to the alias or IP address of the remote server, while directory
    refers to the name of the remote directory that is being shared. Mount-point is
    the name of the local directory, where the remote directory will be mounted. This
    directory must already exist; if it does not, create it using mkdir.


    For options, you can choose from the options listed in Table 7.1.'
