    # Broadcast Address


    In addition to the addresses already mentioned, a given network has a broadcast
    address. This is the address that is monitored by every workstation on the network.
    By convention, the broadcast address is typically the network address with a final
    decimal value of 255. For the network with an address of 192.168.100.0, the broadcast
    address is 192.168.100.255.


    # Gateway Address


    If your computer is connected to a local area network with access to the external
    Internet, or another private network, you will need to know about yet another
    type of IP address, the gateway address. The gateway address is the IP address
    of the device that provides access to external networks. For example, suppose
    your local area network is connected to an ISDN adapter and router, which enables
    all the computers on your network to access the external Internet. The IP address
    of this device is 192.168.100.7. This is the gateway address for your network.
    To access the external Internet, you will need to configure each machine on the
    network so that it knows the gateway address. You will learn how to do this in
    Chapter 10.'
