  md: '# Troubleshooting Your Network


    When you experience some sort of difficulty with your network, you find yourself
    face-to-face with a good deal of complexity. The problem could be caused by a
    myriad of factors, including hardware glitches, poor connections, a configuration
    error, a disk that is filled to capacity so that temporary files cannot be written,
    and many more. Network problems can prove very difficult to solve, especially
    if you are not used to problem-solving in a networking environment.


    This chapter introduces a problem-solving methodology based on real-world networking
    experience. You will start learning the basic principles of this method. Subsequently,'
  merge: -1
  pgno: 336
- img_proc: true
  md: 'you will learn to use the same problem-solving tools used by professional network
    administrators.


    # Configuration vs. Troubleshooting


    Before you get started, be aware that this chapter is about troubleshooting, not
    configuration.


    Configuration involves all the steps that lead to successful network functionality
    in the first instance. If you have had trouble getting something to work, you
    need to go back over the configuration steps, and make sure you have done everything
    correctly.


    In contrast, troubleshooting involves problem-solving when a successfully functioning
    network stops working. For example, suppose you''ve set up an NFS server to export
    directories to a client. Due to a power outage, the server, they lose power and,
    when power is restored, they reboot. After the user logs in to the client and
    attempts to access the remote directory formerly made by NFS, the user discovers
    that this directory is no longer available.


    This problem illustrates the type of problem tackled by a problem-solving procedure.
    There is nothing wrong with the configuration; formerly, the connection worked
    fine.


    # Observe, Theorize, Test


    If you are not experienced with diagnosing network problems with Linux, the best
    place to start is the basic scientific method for problem-solving outlined here.'
  merge: -1
  pgno: 337
- img_proc: true
  md: 'CHAPTER 15 TROUBLESHOOTING YOUR NETWORK


    # # Identifying the Problem Through Observation


    In this step, you identify the problem—specifically, the what and the where. Does
    the problem occur in other applications on the user''s machine? Does it occur
    with only one of the computers on the network, or are all of them affected? Does
    the problem occur only when Internet connections are involved? You can observe
    problems directly, such as physical connections; others will require the use of
    network analysis tools, which you will learn about in this chapter.


    Returning to the example just mentioned, suppose you discover that other workstations
    cannot access remote NFS directories, either. This strongly suggests that the
    server for some reason was not available when the clients tried to log on.


    Why start with observation? Identifying the problem correctly is not as easy as
    you might think. For example, if one of your users cannot get a network printer
    to work, there are a number of possible causes:


    +   - Bad connection. Check your cables and plugs.

    - Problem with hardware. Check the lights on your network card, hub, modem, and/or
    high-speed adapter.

    - Network card setup. Several Linux commands can help you check how your network
    card is setup.

    - Network setup. Make sure your computers know each other''s addresses, etc. on
    your network.

    - Network software setup. Make sure Samba, NFS, or other software is working.'
  merge: -1
  pgno: 338
- img_proc: true
  md: '+   Application setup. Make sure your print command is set up to your printer.
    And make sure you are printing to the right printer.


    # Developing a Theory About the Underlying Cause


    Make an educated guess on the cause. In particular, ask this question: “What has
    just happened that may have caused this problem?” Here, logical reasoning comes
    in very handy. For example, suppose you are using an older, slower Pentium as
    a file server on your network. This machine boots much more slowly than your top-of-the-line
    workstations. Perhaps this is why your workstations are not able to access remote
    NFS directories. The workstations booted before the server became available. In
    consequence, they were not able to mount the remote directories.


    # Testing a Potential Solution


    Once you have made a guess as to the cause, you can test a solution. To test your
    theory concerning why clients can not access NFS-exported directories, go to one
    of the clients, open a terminal window, type dmesg | less, and press Enter. If
    the NFS mount failed because the server was not available, you will see an error
    message. Now try mounting the remote filesystems (on Red Hat and Red Hat-derived
    systems, type /etc/rc.d/init.d/netfs restart and press Enter). If the mount is
    successful, you will have additional evidence that you have identified the problem.
    To verify your theory, shut down all the systems, including the NFS server. Restart
    the NFS server first. Then restart the clients. If all the clients can access
    remote directories, you have successfully identified the cause of the problem.'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# Start with the Physical


    When you troubleshoot a problem, the right way to proceed is in this general order.
    In other words, start with the physical, then check your basic network software,
    and then check your applications.


    There are two advantages to this process. First, most network problems are physical.
    Second, if you have a physical or a network software/setup problem, any change
    that you make to your application, at best, will not help you. In the sections
    to come, you will learn how this works in more detail.


    # Checking Physical Connections


    Most problems that pop up in a previously functioning network are physical in
    nature. To isolate such problems, determine whether your network cables are transmitted
    data—and if they are not, check to see whether they are properly connected.


    To determine whether your network is transferring data, check the lights on network
    interface cards. A green light on your Ethernet card usually means that it is
    properly connected both to your computer and the rest of your network. If it flashes
    when you send or receive data on your network, that is another good sign. Make
    the same checks on your hub, cable modem, and/or DSL adapter.


    > **TIP** A number of network components, including hubs, switches, routers, cable
    modems, and DSL adapters have separate power lines that also should be checked.'
  merge: -1
  pgno: 340
- img_proc: true
  md: 'Next, examine the cables. Make sure that the connections between your Ethernet
    (or other network) cards and cables are secure. Even if all lights seem to be
    working, do not be afraid to disconnect and reconnect each cable.


    > > **NOTE** If the lights are active on your network cards and hubs, that does
    not mean that data can flow over your cables. There are eight wires in a standard
    Ethernet cable; only one needs to be active to turn on the light.


    If you suspect a problem with your connection to the Internet, check your modem
    or adapter and all its connections. Most high-speed connections (cable modems,
    DSL adapters, etc.) can be reset. If this is not covered in your documentation,
    ask your service provider for instructions.


    Be aware that cables sometimes deteriorate to the point that they interfere with
    the flow of data, or stop carrying data altogether. If you have determined that
    just one of the workstations is not working properly, try swapping the workstation''s
    Ethernet cable for a fresh, new one.


    > > **NOTE** If you suspect a problem with your cable, special cable testers are
    available. Alternately, you can use a standard electrical continuity tester (available
    in most hardware stores) to check the wires in your cable. Remember, the lessons
    from Chapter 4. Do not bend your cables too sharply. And keep your cables away
    from rotating machinery.


    # Checking Network Activity


    Once you are certain that all the physical connections are intact, check for network
    activity. You can do so by'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# CHAPTER 15 • TROUBLESHOOTING YOUR NETWORK


    means of a network activity monitor. If you are using the GNOME desktop, for example,
    you can use the NetLoad applet to monitor network activity; if the network is
    functioning, you will see spikes that indicate that packet transfers are indeed
    occurring. Another useful utility is wmnet, a network activity monitor available
    with Window Manager (one of several alternative window managers you can use with
    X).


    # Checking the Interface Configuration


    Once you are sure your network is functioning, go to the workstation that is experiencing
    the problem, open a terminal window, type `/sbin/ifconfig`, and press Enter. You
    will see a screenful of information.


    You will find a guide to the ifconfig''s output later in this section, but for
    now, this is what to look for:


    +   * IP address. Is the workstation’s IP address correct? Does it correspond
    exactly to the IP address entered in the /etc/hosts files of every workstation
    on the network?

    * Subnet address. Is the subnet address correct? For a class C network, this should
    be 255.255.255.0.

    * Is the interface UP and RUNNING? Look for these uppercase messages; if you do
    not see them, the interface is not functioning.


    Here is more information on what you are seeing when you run ifconfig. The output
    from the ifconfig command falls in the following categories:


    +   * Link encap. The type of network, usually Ethernet.

    * Hwaddr. The hardware address of your network card. You can cross check this
    with next section’s arp'
  merge: -1
  pgno: 342
- img_proc: true
  md: 'command as well as the diagnostic program for your network card.


    +   - **inet addr.** Your IP address. This should correspond to the IP address
    in your /etc/hosts file, unless your IP address is assigned by a DHCP server.


    +   - **Bcast.** The broadcast address for your local network.


    +   - **Mask.** The subnet mask for your local network. If you have followed the
    guidelines for network addresses in this book, this should be 255.255.255.0.


    +   - **UP.** If it is DOWN, your Ethernet card is not operational.


    +   - **BROADCAST.** If you are using Ethernet, this should be active, by definition.


    +   - **RUNNING.** If you do not see this flag, try the techniques from Chapter
    5 again to Linux to recognize your card.


    +   - **MULTICAST.** If this is on, you can use this card for multicasts. In other
    words, you can connect to special IP addresses for data transfer to a group of
    computers. A common use for multicasting is videoconferences. If MULTICAST is
    off, your network can still work.


    +   - **MTU.** If you have an Ethernet network, the Maximum Transmission Unit
    of data should be 1500 bytes. This is sometimes known as a packet.


    +   - **RX, TX.** Lists the number of data packets received and transmitted through
    your network card. The number of errors, etc. in each category should be small
    relative to the total number of packets.


    +   - **collisions.** If two different computers on an Ethernet network send messages
    at the same time, the data from each message will collide on your network. If
    the collisions exceed approximately 5% of your total'
  merge: -1
  pgno: 343
- img_proc: true
  md: If a workstation is experiencing difficulty accessing resources on another workstation
    on the network, there may be a problem with address resolution. In brief, address
    resolution maps numerical Ethernet card identification numbers (MAP numbers) to
    IP addresses. Such problems are almost always caused by two workstations configured
    to use the same IP address. If inadver-
  merge: -1
  pgno: 344
- img_proc: true
  md: 'tently assigned the same IP address to two computers, your network will still
    work, but you may experience a variety of problems.


    To determine whether address resolution is working correctly on your network,
    go to the workstation that is experiencing connection problems, open a terminal
    window, log in as superuser, type arp -a, and press Enter. If address resolution
    is working, you will see which IP addresses are currently mapped to functioning
    interfaces.


    To check for address resolution problems, use ifconfig to determine the hardware
    addresses of each machine on the network, and make a list of these addresses.
    With the output from arp, check to make sure that the assigned IP address is the
    correct one. If you discover that two machines are using the same IP address,
    configure one of them to use an address that is not already taken.


    # Using Ping


    Now you can check whether the computers on your network can hear each other. The
    key command is known as ping, which sends a message to a specific IP address,
    requesting a reply. If your ping is successful, you will see responses that indicate
    the server is returning packets successfully. You will need to use the Ctrl +
    C command to stop the responses. Open up a command line interface. When using
    ping, you should use the following commands in order:


    +   * ping 127.0.0.1. The 127.0.0.1 address is known as the loopback address.
    If you can ping your loopback address, TCP/IP is installed (but not necessarily
    configured) correctly on your computer.'
  merge: -1
  pgno: 345
- img_proc: true
  md: '+   ping your_ip_address. Substitute the IP address for your computer. If you
