    2.3.


    +   4. Click Add. You will see the General page as shown in Figure 2.4.


    +   5. In the Server Name box, type the name of the server that handles your incoming
    mail (this server is also called the POP server, POP3 server, or IMAP server).
    For example, if you have a yahoo email address, your mail server is pop.mail.yahoo.com.'
