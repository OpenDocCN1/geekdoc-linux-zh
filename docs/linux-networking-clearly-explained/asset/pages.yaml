  md: '# 4


    # # Selecting and Installing Network Hardware


    If you are planning to implement an inexpensive, reliable local area network (LAN),
    there is only one game in town—a 10-Mbps or 100-Mbps Ethernet. Although Linux
    works with many other network technologies, the Linux kernel is designed to detect
    and configure most Ethernet adapters automatically. Creating a simple Ethernet
    network is almost as simple as installing Ethernet adapters in all the computers
    you want to network, stringing Ethernet cables to the Ethernet hub, and turning
    everything on. (There is more to network configuration, to be sure, but this part
