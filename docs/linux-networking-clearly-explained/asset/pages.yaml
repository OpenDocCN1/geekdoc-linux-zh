    # Safeguard Your Partitions


    You may want to limit access to key directories on your Linux computer. This can
    help protect your system if a cracker somehow finds one of the user names and
    passwords on your system. The key is through your /etc/fstab file.


    > **WARNING** You cannot create new partitions by adding them to your /etc/fstab
    file. Revising and adding partitions is a painstaking process most easily done
    with third-party programs as Partition Magic or System Commander. Alternately,
    you can reinstall Linux on your system, but that can be difficult too.


    As long as you have the partitions that you want, as shown in your /etc/fstab
    file, you can modify the column that starts with "defaults.". The settings correspond
    to the following:


    +   - **defaults.** The default settings for a partition allow read/write access,
    SUID setup (to allow you to execute programs like KPPP), and dev installation
    (so Linux can communicate with your hardware). This also limits the mounting of
    partitions to when you reboot Linux or through a mount command by the root user.

    - **noexec.** Prohibits programs from running in this partition. If you have created
    a partition for /home, it is a good idea to enable this option for all this partition.
    If a cracker obtains one of your user''s passwords,'
  merge: -1
