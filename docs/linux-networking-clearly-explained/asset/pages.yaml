  md: '# Configuring and Using Samba


    Samba is the name of a suite of Linux applications that enable Linux computers
    to provide Microsoft Windows networking services. The most immediate appeal of
    Samba is in its ability to enable transparent, reliable file and printer sharing
    between Linux and Microsoft Windows systems. However, Samba works just fine on
    a Linux-only network, and, as you''ll see, it has some important advantages over
    NFS, which was discussed in the previous chapter.


    This chapter introduces Samba, walks you through the Samba installation and configuration
    process, and shows'
  merge: -1
  pgno: 194
- img_proc: true
  md: '# Introducing Server Message Blocks (SMB)


    you how to include Microsoft Windows systems in your Linux network.


    Often called Windows networking, the protocols that underlie the capabilities
    of current Windows operating systems conform to a series of industry standard
    protocols initially developed by IBM, Intel, and other firms. Two strands of collaborative
    development created today''s Windows networking: IBM-led efforts to implement
    the NetBIOS network interface, and a Windows-Intel effort to define a high-level
    networking protocol called Server Message Blocks (SMB).


    # NetBIOS


    Network Basic Input-Output System (NetBIOS) stems from an IBM-led effort during
    the 1980s to develop LAN networking protocols for personal computers. In brief,
    NetBIOS is a LAN networking protocol that defines an addressing scheme to identify
    network workstations. In addition, NetBIOS defines an application programming
    interface (API) that enables applications to work on the network.


    Because NetBIOS is little more than a network interface for applications, it is
    not a complete networking protocol. Efforts to create a complete NetBIOS implementation
    have created three prominent “flavors” of NetBIOS:


    +   - NetBEUI. NetBIOS Extended User Interface (NetBEUI), is an implementation
    of NetBIOS for IBM’s LanManager networks.'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# CHAPTER 8 • CONFIGURING AND USING SAMBA


    +   - NetBIOS/IPX. This is a version of NetBIOS developed by Novell for Novell
    networks.

    - NetBIOS/TCP/IP. This is a version of NetBIOS that is designed to work with TCP/IP
    networking. Samba uses the TCP/IP "flavor" of NetBIOS.


    When implemented in any of the preceding "flavors," NetBIOS accomplishes the functions
    of the network and transport layers in the OSI Reference Model (see Chapter 4).


    # Server Message Blocks (SMB)


    The second strand of Windows networking development involved a collaboration between
    Microsoft and Intel. The result was the Server Message Blocks (SMB) protocol suite.
    In brief, SMB runs "on top" of any of the three NetBIOS "flavors." In OSI terminology,
    it functions at a high level—namely, the session and presentation layers. What
    it accomplishes can be simply stated: SMB tries to make it possible for users
    to perform on *the network* any file-management operation they would perform on
    their PC.


    Microsoft is busy at work extending the SMB. The company now calls the protocol
    Common Internet File System (CIFS). However, the company''s CIFS implementation
    is still downward compatible with SMB. The most recent versions of Samba work
    with Microsoft Windows 2000. Exactly how long Microsoft will retain this compatibility
    is anyone''s guess.


    # How SMB Differs from NFS


    SMB''s lofty goal, that is, transparently implementing a network version of the
    user''s local file system, requires a much more complex and much more capable'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# PART TWO • BUILDING YOUR LOCAL AREA NETWORK (LAN)


    than NFS. As you learned in the previous chapter, NFS is capable of providing
    file-sharing services, but it provides no assistance with user authentication,
    printer sharing, file sharing, or name resolution (mapping computer names to numerical
    addresses); SMB provides all of these services, and does so in a distinctive way.
    The following sections introduce concepts that are essential to understanding
    how SMB blends these services.


    # Workgroups


    A workgroup is an entirely arbitrary collection of computers on the network. A
    given network can contain one or more workgroups. To assign Windows computers
    to a workgroup, you type the workgroup name in the Identification area of the
    Network control panel.


    When a given Windows machine is assigned to a workgroup, the Network Neighborhood
    window shows only those resources that are available within the workgroup. Other
    network resources, if any, are grouped under the Entire Network icon.


    # Shares


    In SMB networking, any resource that is made available to other users is called
    a share. Users decide which resources on their computer are shared with others.
    They can also choose between the mode of authentication used to access shares
    on their systems, as the following section explains.


    # User- and Share-level Authentication


    Users can choose between the two authentication modes to control access to shares:'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# CHAPTER 8 • CONFIGURING AND USING SAMBA 187


    +   - Share-level authentication. In this mode, a user shares a given resource
    (such as a directory, disk, or printer), and makes it available to anyone in the
    user''s workgroup who possesses the correct password. The share is visible to
    anyone logged onto the network. In this mode, security is poor, because anyone
    who possesses the correct password can access the share.

    - User-level authentication. In this mode, access to shares is restricted by username
    as well as by password. Users can determine which users have access to shared
    resources.


    For security reasons, it is best to use user-level authentication.


    # Workstation Names


    In SMB networking, the name space is flat, which means that every computer must
    have its own unique name. In addition, each share has a name. The following describes
    the naming conventions used in SMB networks to name specific shares:


    ```

    \\workstation\share

    ```


    For example, the following describes the name of a shared printer (speedy) on
    the computer named Lothlorien:


    ```

    \\lothlorien\speedy

    ```


    > TIP When you are working with Samba utilities on the Linux command line, you
    cannot use the backslash symbol, which is interpreted by the shell as a line continuation
    symbol. Use forward slash marks instead, as in the following example: smbmount
    //riven-dell/documents.'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# Browsing


    In SMB networking, the concept of browsing differs from the concept of Web browsing.
    In brief, browsing is a process by which a networked computer discovers the names
    of other computers on the network. When a computer logs onto the network, it advertises
    itself by saying, in effect, "Hi! I''m \llorien," and the name of this machine
    is added to a list of active machines. By detecting these messages, called broadcasts,
    an SMB client can eventually discover all the available machines on the network.


    The list of active machines is maintained by the local master browser, which is
    one of the computers on the network. The computer that becomes the local master
    browser does so by means of an election, in which the various machines decide
    which of them should carry out this role. The election is decided by means of
    rules that give preference to Windows computers. The election process is automatic.


    # Name Resolution


    Although an SMB client can discover other networked machines by browsing, this
    technique is inefficient. To provide a more efficient means of listing available
    computers on a network, Microsoft developed the Windows Internet Name Service
    (WINS). When you enable a WINS server on your network, the WINS server determines
    which machines are available, and creates a master list. Clients can be configured
    to get the list of machine names and addresses from the WINS server.'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# CHAPTER 8 • CONFIGURING AND USING SAMBA


    # Windows Domains


    The workgroup concept works well for small, peer-to-peer networks. In a larger
    network of a dozen machines or more, users may need to remember several different
    passwords to access the resources to which they are granted access. To solve this
    problem, Microsoft introduced the concept of a Windows NT domain. In brief, Windows
    NT domains solve the problem of multiple passwords by providing network logins.
    With a network login, a user can log onto the network just once, and gain access
    to all of available resources without supplying additional passwords.


    > **TIP** A Windows NT domain is not the same as an Internet domain, so do not
    confuse them. A Windows NT domain is an arbitrary construct and has nothing to
    do with the Internet domain name system.


    To implement a Windows NT domain, your network needs a domain controller. A domain
    controller is a computer that is running appropriately configured SMB server software.
    Because this software was formerly available only by purchasing and installing
    Microsoft Windows NT, Microsoft chose to call these domains Windows NT domains.
    However, Samba can function as a domain controller for Windows 95/98 clients (but
    not, at this writing, for NT Workstation clients). For this reason, Samba users
    prefer to speak of Windows domains rather than Windows NT domains.'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# Introducing Samba


    The Linux implementation of SMB, called Samba, has its origins in Australian programmer
    Andrew Tridjell''s desire to mount disk space from a Unix server on his PC. In
    the early 1990s, Tridjell wrote the first version of Samba and released it on
    the Internet. Interest was slow to develop initially, but today Samba is a flourishing
    open source development project, attracting contributions from programmers worldwide.
    Samba''s home page is located at http://www.samba.org.


    The Samba version available at this writing (2.0.7) can do all of the following:


    +   * Enable a Linux user to share resources (directories and printers) with Windows
    users.

    * Enable a Windows user to access shared resources on a Linux system.

    * Emulate Windows NT Server''s WINS capabilities for name resolution.

    * Emulate Windows NT Server''s role as a primary domain controller for Windows
    95/98 network logins.


    The Samba team is working to add additional functionality to Samba. For more information
    on the latest Samba capabilities, visit the Samba home page at http://www.samba.org.


    When you''re running Samba on your system, the following-two daemons are operative:


    +   * nmmbd. This is the NetBIOS daemon that handles name resolution.'
  merge: -1
  pgno: 201
- img_proc: true
  md: '+   - **smbd**. This is the Samba dameon that handles file and printer sharing.


    # Planning Your Samba Strategy


    This chapter assumes that you are setting up Samba for a small peer-to-peer network
    in which one or more Windows users can access shared resources (home directories
    and printers) on a Linux system that is running a Samba server. To set up Samba
    networking in this way, you will do the following:


    +   1. Create Linux accounts for all the Windows users who will access shared
    resources on the Linux system.


    +   2. Decide whether to use plain text or encrypted passwords.


    +   3. Determine how you want to handle name resolution issues.


    # Obtaining and Installing Samba


    If you installed Linux with all the available server options, Samba may be running
    on your system already. To find out, open a terminal window, type ps aux | grep
    mbd, and press Enter. This command looks through the applications running on your
    system for the character string "mbd". If Samba is running, you will see something
    like the following:'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# PART TWO • BUILDING YOUR LOCAL AREA NETWORK (LAN)


    599 ? S 0:00 nmbd -D

    1649 ? S 0:00 smbd -D


    You need to have both nmbd and smbd running for Samba to work on your network.


    If Samba is not already installed on your system, consider using a compiled (binary)
    version of Samba that is designed to work with your Linux distribution. Of course,
    you could compile Samba from source code, but you would need to do considerable
    configuration before you compile, and you will need detailed, expert knowledge
    of your Linux distribution in order to succeed.


    Make sure you get the latest version of Samba. Each new version of Samba fixes
    bugs, and some of them involve serious security holes. If you are hooking up Windows
    2000 workstations to your network, you need Samba 2.0.7 or later. This is the
    first Samba version to work smoothly with Windows 2000. Never use a version earlier
    than 1.9.17p2; previous versions had a serious security flaw that enabled intruders
    to gain root access to the server.


    To get up-to-date binaries, do one of the following:


    +   Check the Samba home page (http://www.samba.org) to see whether there is a
    binary version of the current stable Samba distribution that is designed to work
    with your Linux distribution. Currently available are packages for Slack (version
    not specified), SuSE (5.1, 5.2, 5.3, 6.0, and 6.1), TurboLinux (6.0), and Red
    Hat (5.2, 6.0, 6.1, 6.2).


    +   If the Samba home page does not have a binary that is compatible with your
    Linux distribution, check'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'CHAPTER 8 • CONFIGURING AND USING SAMBA


    your Linux distribution home page. Check the update or errata page to see whether
    there is an updated version of Samba available for the specific version of Linux
    that you are running. If not, you can install Samba from your Linux distribution
    CD-ROM, or download Samba from your Linux distribution site.


    Once you''ve downloaded and installed the Samba binaries, check to make sure your
    system is configured to start the Samba daemons (smbd and nmbd) at system start-up.
    Most of the binary distributions are configured to perform the necessary system
