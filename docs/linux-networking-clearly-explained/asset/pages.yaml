  md: '# CHAPTER 5 • GETTING STARTED WITH TCP/IP


    For each line, the first column indicates the IP address (such as 127.0.0.1).
    The second indicates the fully qualified domain name (FQDN) of the host that is
    defined (for the loopback interface, localhost.localdomain is the default). The
    third column indicates aliases that can be used to refer to this host.


    # /etc/HOSTNAME


    This file should contain your computer’s fully qualified domain name (FQDN), which
    should match the entry in /etc/hosts. For example, if /etc/hosts assigns lothlorien.mydomain.org
    to the machine located at 192.168.100.10, /etc/HOSTNAME must contain lothlorien.mydomain.org.


    # /etc/host.conf


    Another essential TCP/IP configuration file, /etc/host.conf defines the order
    in which TCP/IP attempts to resolve domain names. In domain name resolution, the
    TCP/IP software tries to find the numerical IP address equivalent of a fully qualified
    domain name, such as www.yahoo.com, or an alias, such as rivendell. A typical
    /etc/host.conf file contains the following, which will suffice for most systems:


    ```

    order hosts,bind

    multi on

    ```


    These lines tell the TCP/IP software to check the /etc/hosts file first. If the
    needed information is not available there, the software uses the domain name service
    (DNS). In addition, the software retrieves all the available addresses'
