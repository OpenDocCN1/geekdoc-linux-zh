- img_proc: true
  md: 'CHAPTER 3 ESSENTIAL NETWORKING CONCEPTS


    What is all the excitement about? The advantages of LAN networking are well described
    by one word: *synergy*. Synergy refers to a gain that is greater than merely summing
    up all of the parts. Ethernet inventor and LAN pioneer Robert Metcalfe puts the
    point this way. Networks, Metcalfe says, are like telephones, in the sense that
    both become more valuable the more people hook up. A telephone system with only
    two subscribers lets connect only two ways (each person can call the other). But
    a telephone system with four subscribers lets people connect twelve different
    ways (each person can call three others).


    # How Is the Network Hooked Up? (LAN Topologies)


    Local area networks vary in their *topology*, the method used to connect the computers
    physically. The next section introduces star, bus, and ring topologies, all of
    which are supported by Linux.


    # Star Networks


    The most common network network topology is the *star network*, in which each
    computer is connected via a cable to a central device, called a *hub*. The major
    disadvantage of a star network lies in the amount of wiring that is needed to
    connect each computer to the hub. The major advantage is that individual machines
    can be disconnected and reconnected without disturbing the network’s functioning.
    Star networks are by far the most popular network topology.'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# Bus Networks and Ring Networks


    A bus network connects computers by means of a straight-line cable, in which the
    networked computers are stung out in a daisy chain from one end to the other.
    A ring network is much the same, except that the two ends of the bus are connected
    to form a circle. Although bus networks require less wiring than star networks,
    it is not possible to disconnect one of the systems without disrupting network
    service. The same is true of ring networks. For this reason, bus and ring networks
    are much less popular than star networks.


    # Who Is in Charge? (LAN Network Relationships)


    Networks vary in size and scope from a simple, two-computer connection to the
    Godzilla of networking, the globe-spanning Internet. Whatever the size of your
    network, you can set up three basic relationships in a network: timesharing networks,
    peer-to-peer networks, and client/server networks. Linux supports all three types
    of network relationships.


    # Timesharing Systems


    Developed back in the days when computers were fabulously expensive, timesharing
    systems enable two or more users to gain access to a single, large computer, called
    a mainframe. This type of network was made possible by a key innovation in computer
    operating systems, called timesharing. With timesharing, access to the computer''s
    central processing unit (CPU) is shared among all those who are logged in to the
    network, so that each individual has the impression of having sole access to the
    computer.'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'Timesharing systems are highly centralized and tightly controlled by the personnel
    who run the mainframe. Users do not have their own computers; instead, they use
    terminals. A terminal does not have its own computer processing circuitry, memory,
    or storage, beyond that which is required to communicate with the mainframe. Multi-user
    networks are still used when it is desirable to keep all computing resources in
    one, central location.


    During the 1970s and 1980s, the large mainframe computer makers underestimated
    the market for smaller time-sharing systems. Manufacturers such as Digital Electronic
    Corporation (DEC), Hewlett-Packard (HP), and Sun Microsystems entered the market
    with minicomputers, which are junior versions of mainframes intended for medium-sized
    businesses and divisions within large corporations. Like mainframes, minicomputers
    use time-sharing to enable two or more users to access the CPU simultaneously
    by means of remote terminals.


    Minicomputer manufacturers equipped their computers with their own versions of
    the Unix operating system. Originated at AT&T''s Bell Laboratories in the 1970s,
    Unix is a multiuser operating system.


    Because Linux was originally a version of Unix for Intel-based personal computers,
    it shows its Unix heritage. Like Unix, is a multiuser, timesharing operating system
    that enables two or more users to access the CPU simultaneously. Although few
    Linux users access Linux by means of remote, standalone terminals, the terminal
    concept is deeply intertwined with the way Linux works. On Linux, every session
    you begin takes place in one of several virtual terminals, seven of which are
    available by default with most Linux distributions.'
  merge: -1
  pgno: 86
