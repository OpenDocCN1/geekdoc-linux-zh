- img_proc: true
  md: '# CHAPTER 6 UNDERSTANDING USER ACCOUNTS, OWNERSHIP, AND PERMISSIONS 141


    # Understanding File Ownership and Permissions


    Linux is a multiuser system, so it needs a way to keep users from raiding each
    other''s files. It is not enough to set them apart in separate directories. To
    make it clear who belongs to what, Linux defines the following attributes for
    each file:


    +   - File ownership. A file is owned by the person who creates it. When you create
    a file in your home directory, you are the owner, and you automatically have permission
    to read and alter this file. However, your rights to read or alter files outside
    your home directory may be restricted.


    +   - Permissions. A file''s *permissions* specify just who can do what with the
    file. For a given type of user, permissions specify whether the user can read
    the file, write to the file (including deleting the file), or execute the file
    (if it is an executable file).


    The following sections explain these concepts in more detail; subsequently, you
    will learn how to adjust file ownership and permissions with File Manager.


    # Types of File Owners


    Linux defines the following categories of file owners:


    +   - User. The user who owns the file. Normally, this is the person who created
    the file, but the root user (system administrator) can change file ownership.


    +   - Group. When you create user accounts, you can place two or more users into
    a *group*. Groups are very useful when two or more people need to work on the
    same file or within the same directory.'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'Others. This category includes all other users except the user and group.


    # Types of Permissions


    For each type of file owner, you can define the following permissions:


    +   - **Read.** Determines whether a given category of users can read a file.

    - **Write.** Determines whether a given category of users can alter a file (including
    deleting the file).

    - **Execute.** Determines whether a given category of users can launch (execute)
    a program or script. Applied to directories, this term is equivalent to directory
    access.

    - **Set User ID (SUID)** and **Set Group ID (GUID).** These permissions specify
    that a program will start with the permissions available to the owner (SUID) or
    the group owner (GUID) of the file. It is very convenient to change the permissions
    of certain networking utilities so that they run with SUID permission; this enables
    you to run them from ordinary user accounts. For example, `smbount` must be run
    unless their SUID is set (this is done with the command `chmod u+s /usr/sbin/smbount`
    and `chmod u+s /usr/sbin/smbmount`). However, you should be aware that using the
    SUID or GUID setting exposes your system to certain security risks. It is best
    to avoid SUID and GUID unless you are sure your network is secure and you really
    want the convenience.'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# Viewing and Changing Ownership and Permissions


    To get networking to work smoothly, you must make sure that all the files in every
    user''s directory have the correct ownership—including primary group ownership—and
    that permissions are set correctly. The following section reviews essential skills
    for viewing and changing file ownership and permissions.


    # Reading File Permission Information


    When you view a file directory with ls -l, you will see the current permissions
    for each file expressed in an oddly, such as the following example:


    ```

    r w x r - x - x

    ```


    Here is how to understand what this means. These are positional expressions in
    which the location of each character means something. The nine symbols are in
    groups of three:


    | Owner | Group | Other |

    | r w x | r w x | r w x |


    If any of the permissions has not been granted, you see a hyphen instead of the
    symbol. For example, consider this example:


    ```

    r w - rw - r -

    ```


    Here is the table again, note where the hyphens are placed:'
