    # Troubleshooting Your Installation


    This section provides solutions for almost all the problems you may encounter
    with modems. Remember, though, that some modems simply do not work with Linux,
    no matter what you do. Before troubleshooting your modem, make sure it is compatible
    with Linux; otherwise, you will be wasting your time.


    An organized approach to troubleshooting pays off. Take it by step. Remember what
    the great Sherlock Holmes told the baffled Dr. Watson: “When you have eliminated
    all of the other possibilities, whatever remains, improbable, is the truth.” Now
    we can start by figuring out what is wrong with the modem.


    # Checking Physical Connections


    Make sure your modem is properly seated in the expansion slot and all the connections
    are snug. The phone line plugged into a standard modular telephone jack?


    # Curing the Modem Blues


    When you queried your modem with KPPP, you may have been told that your modem
    is “busy”, and that KPPP is really sorry about this. The sympathy is nice, but
