- img_proc: true
  md: '# Wireless Cable


    Wireless cable Internet service is also available in some areas. Depending on
    the provider, the setup is similar to one-way or two-way cable Internet service.
    The difference is that wireless service uses broadcast frequencies in the same
    way as regular broadcast television service.


    The general hardware requirements are similar to that for cable Internet service.
    Some wireless cable operators in use the same cable modems. However, you will
    need a receiver that looks like an antenna or satellite dish. You will also need
    a transmitter or telephone modem for your uploads.


    # Digital Subscriber Line (xDSL)


    A Digital Subscriber Line (DSL) uses your telephone line to transmit digital data.
    It can work on the same wires as a telephone because it it transmits data on different
    frequencies. All telephone lines are connected to central offices of the telephone
    company. As you can tune into different stations on a radio, the right equipment
    in the telephone company central office can route your telephone call or DSL data.


    As implied by the “x” in the title of this section, there are different types
    of DSL service available:


    +   Asymmetric. ADSL service means that the speed of your uploads is slower than
    the speed of your downloads.


    +   Symmetric. SDS service means that the minimum speed of uploads is the same
    as the minimum speed of downloads. This is suitable for users who need two-way
    services such as video conferencing.'
  merge: -1
  pgno: 275
- img_proc: true
  md: '+   * Very High Speed. VDSL service is sometimes available if you have less
    than one mile of wire between your telephone and your local telephone central
    office; VDSL service offers speeds from 13 to 55 Mbps. As of this writing, VDSL
    is available in very few areas. It is currently intended as a way to deliver enough
    data for HDTV. Nevertheless, it certainly could be used as an Internet connection
    for a larger office.


    To determine if DSL service is available for your location, contact the DSL provider
    of your choice or your local telephone company.


    It is certainly possible to set up one telephone line for DSL and your regular
    telephone. A typical configuration when you use DSL service involves the use of
    “splitter”, which allows you to connect a telephone to the same line.


    Where available, there is often heavy competition to provide DSL service. A number
    of different DSL providers provide service over the same local telephone lines
    to many of the same metropolitan areas.


    The DSL speed that you get is deceiving. Unlike other high-speed services, the
    DSL speed that you get is a minimum speed. In other words, a 144 kbps DSL line
    can sometimes be faster than a 5 Mbps cable modem connection depending on the
    traffic on the local cable network.


    +   * Distance. Generally, DSL adapters are not designed to work if they are more
    than 17,500 feet (5300 m) from a telephone company central office.'
  merge: -1
