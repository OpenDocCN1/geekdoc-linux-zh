    A hub is a central wiring device used in star topology Eternets (10BaseT and 100BaseT).
    Containing RJ-45 receptacles for several workstations, the hubs serve to repeat
    or mirror the network''s signals so that all workstations receive an exact copy
    of these signals. The hub is not merely an electronic “mirror”; it also contains
    circuitry that regenerates and synchronizes the network''s signals, ensuring a
    high degree of reliability.


    Hubs come with a fixed number of ports, but most hubs also include an uplink port
    that enables them to connect to another hub.


    You''ll notice that hubs typically have several light-emitting diode (LED) lights.
    Here''s what they mean:


    +   * **Power.** Lights up when your hub is connected to power.

    * **Collision.** Lights up when more than one computer is sending information
    simultaneously. The signals from each computer are actually interfering with each
    other inside your hub. Ethernet adapters are designed to try again after a collision,
    so this is not'
