    Owner Group Other

    r w - r w - r - -


    In other words, the owner and the owner''s group have read and write permissions
    (but not execute), while all others have only read permission.


    See Table 6.1 for a guide to the permissions you commonly seen in file directories.


    Table 6.1 Understanding Permissions Indicated in Directories


    | Directory listing | Symbolic mode | Numeric mode |

