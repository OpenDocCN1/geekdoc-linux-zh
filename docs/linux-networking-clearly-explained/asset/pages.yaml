  md: '# Table 13.1 Typical FTP Commands


    | Command | Function |

    |--- |--- |

    | ascii | Sets file transfers to ASCII (text) mode. |

    | binary | Sets file transfers to binary mode. |

    | cd | The Linux change directory command works normally. |

    | delete | Deletes a file on the FTP server. This is a good reason to make users
    log into FTP. |

    | get | Copies a file from the FTP server. |

    | ls | Lists the files in the current directory. |

    | pwd | The Linux present working command identifies the current directory on
    the FTP server. |

    | put | Copies a file from the client computer to the FTP server. |

    | quit | Logs off from the FTP Server. |


