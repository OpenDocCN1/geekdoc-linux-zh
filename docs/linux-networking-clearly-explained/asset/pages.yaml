  md: '# PART ONE • CONNECTING TO THE INTERNET


    What is going on? Your modem is not busy; rather, Linux could not find it. This
    problem could be caused by any of the following:


    +   * Your modem does not have Plug and Play capabilities, and KPPP does not know
    which serial port to use. You need to determine which serial port your modem needs.

    * Two devices are vying for access to the same serial port. You will need to reconfigure
    one of them in order to get your modem to work.

    * You or somebody else configured your computer so that one or more serial ports
    is disabled or has a non-standard configuration. You will need to enable the port
    or restore the default configuration.


    The following sections detail strategies for solving these problems.


    # Which Serial Port Is Your Modem Using?


    Start by determining which serial port your modem is trying to use. In the Windows
    world, serial ports are known as COM ports; a maximum of four are available (COM1,
    COM2, COM3, and COM4).


    If your system enables you to run Windows as well as Linux, you can use Windows
    to find out which serial port your modem is using. In Windows 95 or 98, right-click
    on the “My Computer” icon, click Properties in the shortcut menu, then click the
    Device Manager tab. Click on the plus sign adjacent to “modem.” In the properties
    for your modem, find the COM port under the Modem tab, the IRQ and I/O under the
    Resources tab.'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'If you are using an older modem that uses jumpers to assign the COM port, you
    can determine the COM port by taking a look at these jumpers. Often, the COM port
    is printed on the circuit board, so you can immediately see which COM port is
    in use.


    Still unable to figure out which serial port your modem is using? Check your modem’s
    documentation; chances are it will tell you which serial port is enabled by default.


    # Resolving Serial Port Conflicts


    Once you have determined which serial port your modem requires, make sure no other
    device is trying to use the serial port at the same time. Chances are your system
    has only two devices that require a serial port: a serial mouse (a mouse that
    connects through a serial port) and your modem.


    If you have a serial modem and a serial mouse but only one serial port, you will
    need to add an additional serial port before you can get your modem to work. But
    there might be an easier solution. On the back of your computer, look for a round
    PS/2 port. If you have a PS/2 port, you can get an adapter for your serial port
    that enables it to plug into the PS/2 port.


    If your computer is equipped with two onboard serial ports, you may need to disable
    one of them in order to get your internal modem to work. Suppose your modem wants
    to be connected to COM2. However, your system is set up so that one of the onboard
    serial ports is connected to COM2. To disable the onboard serial port, start your
    computer and type the key (generally Delete) that enables you to view your computer’s
    Setup menu. Locate the page that contains the port settings. Disable the'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'onboard serial port that your modem wants to use, save your settings, and restart
    your computer. Try using KPPP to auto detect the modem again.


    # Setting the Port Manually


    Did the auto detect fail again? If you are sure that no other device is trying
    to use the serial port your modem prefers, it is possible that you are using a
    modem that lacks Plug and Play capabilities, or that the Linux Plug and Play software
    cannot detect your modem for some reason. In such cases, you will need to specify
    the serial port manually.


    To specify the serial port manually, follow these steps:


    +   1. In the KPPP Configuration dialog box, click the Device tab.


    +   2. Click the pull-down arrow adjacent to Modem Device. You can make one of
    five choices, as shown in Table 1.5.


    Table 1.5 KPPP Modem Devices

    | Device | Channel |

    | /dev/ttyS0 or /dev/cua0 | COM1 |

    | /dev/ttyS1 or /dev/cua1 | COM2 |

    | /dev/ttyS2 or /dev/cua2 | COM3 |

    | /dev/ttyS3 or /dev/cua3 | COM4 |


    +   3. Select the modem device that corresponds to the COM port for your modem.'
  merge: -1
