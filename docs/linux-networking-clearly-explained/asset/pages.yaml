    # # Security


    Whether or not Apache is working, the next step is to look at security. If Apache
    is working, you want to keep unauthorized users out. If Apache is not working,
    your configuration file may also be keeping authorized users out. Open up your
    Web browser. Navigate to http://localhost. If you managed to start Apache, you
    should not see the localhost.com Web site. If you see an error page, then you
    probably need to change user permissions on your Web directories or your Apache
    configuration file to let in authorized users.


    By default, Apache Web directories are located in your /home/httpd directory.
    Open up a command line interface and navigate to this directory. Check the permissions
    of the ls -la command. You should see lines as:


    ```

    drwxr-xr-xr-x root root 4096 Jan 03 15:03

    cgi-bin

    drwxr-xr-xr-x root root 4096 Jan 03 15:03

    html

    drwxr-xr-xr-x root root 4096 Jan 03 15:03

    icons

    ```


    These lines show that everyone has at least read (r) and execute (x) access to
    your Apache directories. You can change permissions on any directory with the
    chmod command using the techniques that you learned in'
