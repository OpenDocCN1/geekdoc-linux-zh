    # Tracing Internet Connections


    You have pinged everything in sight. You can share on your network just fine,
    but cannot reach anyone on the Internet. You can think of the traceroute command
    as an advanced version of ping. In essence, it asks for a response from every
    computer in its path. If traceroute finds a problem, you will see something like
    the following message:


    ```

    unknown host www.unknown.com

    ```


    There are two issues that a traceroute can address. If the traceroute cannot get
    past your ISP, go to your gateway computer. Check the gateway IP address. If you
    are using Red Hat Linux, it is listed in your /etc/sysconfig/network file. If
    you are using another distribution, check your documentation for the configuration
    tool or file to check. This address should match the gateway given by your ISP.


    If the traceroute stops somewhere else, there may be a traffic problem on the
    Internet. Either the ISP for the Web site you want to reach is down, or there
    is a lot of traffic between your ISP and that Web site. Both problems are usually
    beyond your control.


