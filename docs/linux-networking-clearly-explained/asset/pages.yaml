  md: 'Because 10/100-Mbps Ethernets are the easiest type of networking hardware to
    install and configure, this chapter (and those follow) focus on Ethernet LANs.
    This chapter begins by introducing Ethernet networking. Next, you will learn about
    a variety of ways you can hook up computers in an Ethernet network, beginning
    with a simple connection that involves a special cable linking two computers.
    Subsequently, you will learn how to select and install an Ethernet adapter, and
    make sure that it is working properly.


    # Introducing the Ethernet


    Originally developed in the 1970s by Bob Metcalfe and other researchers at Xerox
    Corporation’s Palo Alto Research Center (PARC), the various versions of Ethernet
    are used by approximately 80% of all LANs. Metcalfe chose the name “Ethernet”
    in ironic homage to disprove, nineteenth-century theories of a “luminiferous Aether,”
    through which light particles and electricity were believed to propagate.


    Although many other LAN technologies exist, Ethernet is an excellent choice for
    most users. It provides users with a good balance between speed, reliability,
    expense, and ease of installation. The equipment to create a 10baseT Ethernet
    for five PCs can cost as little as $200.


    # Ethernet Standards


    Ethernet standards are now the responsibility of international organizations.
    Current Ethernets conform to standard 802.3 of the Institute of Electrical and
    Electronic Engineers (IEEE). However, the IEEE 802.3 standard has not proven universally
    popular. In particular,'
