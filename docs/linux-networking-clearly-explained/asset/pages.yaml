  md: '# Accessing FTP Sites with File Manager


    The File Transfer Protocol (FTP) is another of the Internet’s most popular services.
    By means of anonymous FTP, individuals or organizations can make freely available
    for public download. Anonymous FTP is one of the chief vehicles for distributing
    open source software. Other FTP servers require a username and password. If you
    plan to publish a Web page on your ISP’s computers, you will need to learn how
    to use FTP for uploading files to a password-protected server.


    You can use a separate program (such as KFtp) to access FTP servers, but you can
    also use the KDE File Manager. Configure the KDE File Manager from the Edit menu
    by choosing Show Tree.


    What is so cool about using KDE File Manager for FTP is best understood by trying
    it. Once you have opened the FTP server’s directory structure, you can use all
    the File Manager techniques you have already learned to work with files. For example,
    to download a file, you simply copy it to your home directory.


    The following sections show you how to access FTP sites, starting with anonymous
    FTP servers. You will go on to learn how to access password-protected sites.


    # Accessing Anonymous FTP Sites


    To access an anonymous FTP site with the KDE File Manager, do the following:


    +   1. Click the Main Menu button, point to System, then click File Manager.'
  merge: -1
  pgno: 67
- img_proc: true
  md: '2. Enter the superuser password if required.


    3. From the edit menu, choose Show Tree.


    4. In the Location box, type the following URL: ftp:// followed by the Internet
    address of the FTP site (such as ftp.cdrom.com).


    5. Press Enter.


    File Manager attempts to access the site, which may take a while. Once the site
    has been accessed, you will see files and directories from the ftp server in the
    right-hand side window.


    > **TIP** If you cannot reach an FTP site, there are two common solutions. First,
    check how you typed in the name of the site: spelling matters. Second, FTP sites
    often limit the number of users who can connect to it at the same time. You may
    just need to try again in a few minutes.


    # Accessing Password-Protected Sites


    To access a password protected site, you embed your login name and password into
    the URL, as follows:


    ```

    ftp://loginname:password@servername

    ```


    For example, suppose you are accessing ftp.september. org; your user name is brenda
    and your password is 339jqq. You would type the following in File Manager''s Location
    box:'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# Exploring Additional Internet Applications


    ftp://brenda:339jqq@ftp.september.org


    The connection works the same way. Depending on the permissions established at
    this server, you may be able to upload files as well as download them.


    A number of promising KDE Internet utilities are currently under development.
    Check the KDE home page frequently (http://www.kde.org) for news about these and
    other KDE-compatible Internet utilities.


    Here''s an overview of some of the utilities planned for release with KDE 2.0:


    +   - KFtp. You can use File Manager for occasional downloading or uploading from
    FTP sites. For extensive work with FTP, you will find it easier to use a utility,
    such as KFtp, that is designed expressly for FTP usage. Created by Eric Santonacci,
    KFtp is a network client that is fully compatible with KDE. When you access an
    FTP site with KFtp, you will see two file panels. On the left, you see your local
    files and directories; the right panel shows the remote server''s files and directories.
    Downloading or uploading a file is as simple as selecting the file and clicking
    the download or upload arrow.'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# CHAPTER 2 • USING INTERNET APPLICATIONS


    +   - KXicq. This program is an ICQ-compatible “buddy list” program that is fully
    integrated with the KDE desktop. A buddy list program enables you to tell when
    your friends or contacts are logged on to the Internet (and, in turn, can tell
    when you are logged on). When you and a buddy are both online, you can send messages
    to each other by means of text chatting. You can use KXicq whether or not you
    have already signed up for ICQ. If you signed up on another computer, just down
    your ICQ number, your password, and other identifying information; KXicq will
    reestablish your connection to the ICQ network. If you have not already signed
    up, you can use KXicq to create a new ICQ membership.

    - KVirc. Internet Relay Chat (IRC) is a popular text-based chatting network, with
    hundreds of servers (and dozens of networks) in use throughout the world. KVirc
    is a KDE compatible ICQ client.


    On the horizon are a KDE Office Suite, a full-featured email client, and much
    more. By the time you read this book, these projects may have produced preliminary
    versions (called beta versions) that are far enough along to try out on your system.


    # Looking Under the Hood


    This section briefly discusses some text-mode utilities that may prove useful
    when you are exploring the Internet.


    # Interacting with Remote Systems: Telnet


    The Telnet protocol defines a means of establishing a login session on a remote
    computer, just as if you were sitting at the computer’s terminal and keyboard.
    To use'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'Telnet, use the Telnet utility installed by default with most Linux distributions.


    To use Telnet, open a terminal window, type telnet, and press Enter. You will
    see a special prompt that lets you know you have entered the utility''s interactive
    mode. In this mode you can use the commands listed in Table 2.2.


    # Table 2.2 Telnet Commands (interactive mode)


    | Command | Purpose |

    | --- | --- |

    | close | Close the session with the remote server, but without exiting telnet
    (see quit) |

    | open server | Open a connection to the specified server (for example, open telnet.mydomain.com)
    |

    | quit | Terminate the connection and exit the telnet utility |

    | status | Show the current status of telnet |


    # Using a Text-Only Browser: Lynx


    If your main interest online lies in text rather than graphics, you may enjoy
    using Lynx, a text-only browser. Lynx does not display any of the pretty graphics
    that you see on the Web, so you are missing out on the Web''s increasingly attractive
    visual appearance. But you are also missing out on the slow downloads and annoying
    animations.


    Lynx is installed by default on most Linux distributions. To give Lynx a try,
    open a terminal window, type lynx, and press Enter. You will see a menu of available
    options at the bottom of the screen. To go to a Web page, press g (for Go), type
    the Web page address, and press Enter.'
  merge: -1
