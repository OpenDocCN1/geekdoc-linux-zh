  md: '# Data Routing Technologies


    Networks funnel messages to the correct destination using two basic technologies,
    called circuit switching and packet switching.


    # Circuit Switching


    In circuit switching, the network creates a physical, end-to-end circuit between
    the sending and receiving computers. This is the same technology used in telephone
    networks. Computers often lease dedicated lines from telecommunications providers.
    These lines give them a permanent, end-to-end connection that is created using
    the telecommunication company''s switching network.


    The major advantage of circuit switching lies in the high degree of security it
    provides. No other users have access to the connection. However, this type of
    connection is inefficient. Computer data traffic occurs in bursts, and sometimes
    there is no data transferred for a long time. The permanent, end-to-end connection
    typically inefficient use of the circuit.


    # Packet Switching


    Packet switching works in a way that is radically different from the telephone
    system. In packet switching, an outgoing message is divided into data units of
    a fixed size, called packets. Each packet is numbered and addressed to the destination
    computer. The sending computer pushes the packets onto the network, where they
    are examined by routers. Routers are computer-based devices that examine each
    packet they detect. After reading the'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'packet’s address, the router consults a table of possible pathways to the destination.
    If more than one path exists, the router sends the packet along the path that
    is most free from congestion.


    Packet-switching networks are often called connectionless because, unlike switched
    networks, it is not necessary to have an active, direct electrical connection
    for two computers to communicate. For example, the Internet is a packet-switching
    network; you can send somebody an email message even if the destination computer
    is not operating. If the message does not get through, the software keeps trying
    to send it for a set period of time, after which it gives up.


    Packet-switching networks are significantly more efficient than circuit switching
    networks. While en route, packets originating from one computer are commingled
    with many others, so the network is able to make full use of its data transfer
    capacity. However, packet-switching networks are inherently less secure than networks
    created with a private, end-to-end circuit. Intruders can use programs called
    packet sniffers to search for packets containing sensitive data, such as credit
    card numbers or passwords. To work with public packet-switching networks (for
    example, the Internet) safely, confidentiality safeguards such as encryption are
    needed.


    Despite their disadvantages, packet-switching networks are by far the more widely
    used of the two basic networking technologies. Efforts have been made to develop
    circuit switching technologies (such as asynchronous transfer mode (ATM)) that
    can equal or exceed the efficiency of packet-switching networks, but the resulting
    technologies have not gained widespread acceptance.'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# Types of Packet-Switching Networks


    When we are talking about networking, therefore, we are talking about packet switching.


    Several different types of packet-switching networks exist. Wide area networks
    (WANs) provide direct, point-to-point data transfer services for businesses across
    hundreds and even thousands of miles. Local area networks (LANs) link anywhere
    from a handful to thousands of computers within a limited geographical area, such
    as a building or a group of buildings. Metropolitan area networks (MANs) resemble
    LANs, but they use high-speed, high-tech cables—crafted from light-transmitting
    fibers—to link an organization’s offices throughout a regional area. The Internet
    is often called an internet, and for good reason. It is a network of linked networks,
    not just linked computer systems. In fact, the word “Internet” is a short version
    of internetwork.


    As you have already learned, Linux is an excellent platform for gaining access
    to the Internet. It is equally capable of developing LANs, MANs, and WANs, as
    organizations everywhere are discovering. To get started with Linux networking,
    you should begin with your Internet connection, as you have already done. The
    next step, fully covered in this book, involves creating a local area network
    (LAN). Both MANs and WANs require exotic equipment and network administration
    skills that are far beyond the scope of this book. You will focus on LANs, and
    for good reason—that’s where the major payoff is found, as the next section explains.'
