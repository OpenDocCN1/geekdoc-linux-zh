    ```


    This configuration dials 9, waits two seconds, and then dials 800-555-1212. When
    the ISP responds, it supplies the username suanne and the password ilw2mfc, and
    establishes the connection using the ISP''s preferred authentication method.


    # Figuring Out Whether You Are Online: Ping


    If you are trying to figure out whether you are really connected to the Internet,
    try this. Open a terminal window, type ping followed by a space and the IP address
    of your ISP''s DNS server, and press Enter. This utility sends information to
    the specified server and requests a response. If the server responds, you will
    see the response on the'
