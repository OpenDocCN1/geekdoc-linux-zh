- img_proc: true
  md: '# Essentials of Good Cabling Practice


    Star networks have many advantages over bus networks, but there is one disadvantage
    that you will notice right away: they are cable-intensive. Each workstation requires
    its own cable run to the hub, adding to the overall “vermicelli effect”—the profusion
    of wires running all over your office. Devote some thought now (rather than later)
    to how you can minimize the confusion and perils caused by these wires.


    +   - Keep Cables Off the Floor. You do not want to trip, of course, but you could
    also do a lot of damage—at the extreme, you could rip the network card out of
    its slot and cause physical damage to the motherboard. It is easiest to route
    cables along the baseboard, where the wall meets the floor.


    +   - Consider In-Wall Wiring. In new construction, you can string Cat-5 to your
    heart’s content, as long as you do before the drywalls arrive. In existing construction,
    an electrician can install cables in existing walls. Faceplates with RJ-45 connectors
    are available from network hardware supply companies.


    +   - Keep Cables Away From Machinery. Avoid anything with a motor, such as refrigerators
    and washing machines. The electrical fields they generate can affect the performance
    of your network.


    +   - Avoid Power Cables. Although the Ethernet specification warns against running
    cables near electrical power cables, experience suggests that this is not a major
    concern for 10BaseT and 100BaseTX networks, which have robust error correction.
    If you have to route your network cable near a power cord, try to make the cable
    and power cord cross at right angles.'
  merge: -1
  pgno: 115
- img_proc: true
  md: '+   - Avoid Sharp Bends. If you bend your cables too severely, the wires inside
    the cable can thin out or even break. Thinner wires can carry fewer data. A good
    rule of thumb for UTP cable is a 2-in (50-mm) bend radius.


    # The Minimalist Ethernet


    If you''re planning to connect just a few computers, such as a notebook and a
    desktop system, you can create your network with an Ethernet adapter for each
    workstation, Ethernet cables, and an inexpensive hub with five or eight ports.
    Although you may hear that it is possible to connect two computers directly with
    a crossover cable, thus dispensing with the hub, you cannot do this with 10BaseT
    or 100BaseTX Ethernets—at least, not without risking errors and unreliable data
    transfers.


    > TIP Consider purchasing an “Ethernet in a box” kit, which contains network interface
