- img_proc: true
  md: '# 10


    # Sharing an Internet Connection


    At this point, you have successfully configured your local area network, and you
    have learned how to share resources, such as directories and printers, so that
    they are accessible to network users. In this chapter, you will take a step that
    is vital to completing your network: connecting your network to the Internet so
    that the connection is shared among all the connected workstations.


    If you have already configured one of your Linux systems to access the Internet
    by means of a modem, you will be wondering why the procedures in this chapter
    are necessary. The reason is that this connection is not shared—at-least, not
    yet. This chapter details the methods you can'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'use to make this connection accessible to other network users.


    Although it is possible to connect LANs to the Internet in a variety of ways,
    this chapter focuses on the most common one: connecting your network to the Internet
    via a modem. To do so, you will configure one of the machines on your network—the
    one with the modem—to function as the modem server. The technique described in
    this section will work for PPP connections with a modem. It will also work for
    ISDN connections with an ISDN adapter that masquerades as an analog modem for
    installation purposes.


    NOTE If you have not already done so, install your modem and configure your system
    so that you can connect to your internet service provider''s system and access
    the Internet. For information and instructions, see Chapter 1. This chapter assumes
    that your modem is installed and working.


    # Obtaining and Installing the Software You Need


    You need several utilities on your Linux computer to test and set up modem sharing
    on your network. Check to see whether these utilities are already installed; if
    not, install them from your Linux distribution''s CD-ROM or from your Linux distribution''s
    FTP site.


    +   - dial. The dial16 utility initiates dialing automatically whenever any of
    the computers on your network initiates an Internet connection.


    +   - detrl. Once you set up dial on your Server, this GUI utility allows you
    to monitor and control activity on your modem. It is installed as part of the
    dial pack-'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'age. For more information and downloads of dial and dialctrl, see the utility''s
    home page at http://dial.sourceforge.net.


    +   - dial-config. The dial16-config utility provides a user interface to the
    configuration file.


    NOTE The dial and dial-config packages are designed for use with Red Hat Linux,
    which is included in the CD that comes with this book. If you are using another
    distribution, you will probably need the dial16 and dial16-config packages. Go
    to your Linux distribution''s CD-ROM or their Web site for download information
    on the appropriate packages.


    First, you will install and configure these packages on the Linux computer with
    your modem. This computer is your modem server. You will set up the dial configuration
    files on your modem server to dial and logon to your ISP. Then you can set up
    your modem server with the IP addresses for your ISP''s DNS server and gateway.
    Your ISP''s gateway is your modem server''s route to the Internet.


    Then you will set up the other computers on your network to look to your modem
    server for Internet access. You will configure each of these computers with the
    IP address of your ISP''s DNS Server. As your modem server is the gateway for
    your other computers to your ISP, you will make your modem server''s internal
    IP address for these computers.


    # Configuring Dialup-on-Demand (dial)


    The following section assumes that your PPP connection and modem are installed
    and working correctly; if not,'
  merge: -1
  pgno: 240
- img_proc: true
  md: 'please turn to Chapter 1. In this section, you will learn how to configure
    dial, which initiates automatically whenever an Internet connection is needed
    by any of the computers on your network.


    To set up dial, you need to modify two configuration files: connect and dial.conf.
    When you install the rpm packages, these files are located in the /etc/dial/ directory.
    The dial.conf file sets up your modem server communicates with your ISP. It then
    calls up the connect file to initialize your modem, dial your ISP, and login.


    Once you are finished editing, you will move these files to the directories where
    they will be read by Linux as needed.


    # Dial Connect Configuration


    Before you start editing, back up the /etc/dial/connect configuration file. For
    example, the following command backs up the connect file in the current directory:


    ```

    cp -i connect connect.bak

    ```


    Open up /etc/dial/connect in a text editor such as emacs, vi, or any text editor
    in your Start menu. If you installed the dial16 rpm packages, you will see 10
    different variables that you can modify. These variables are detailed in the following
    steps:


    +   1. Look for the MODEM_INIT variable. The default should work for most modems.
    If you have a problem connecting and do not hear the "beeps" associated with a
    dialing telephone, check this parameter against your modem''s documentation.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# CHAPTER 10 • SHARING AN INTERNET CONNECTION 231


    +   2. Review the PHONE_NUMBER variable. Set this to the phone number of your
    ISP. If you need to dial a number such as “9” to access an outside line, there
    is a short delay before you get a dial tone for an outside line. In this case
    you should add a comma, for example, if your ISP''s number is 555-4321, set the
    PHONE_NUMBER variable to: 9,555-4321. This makes your modem wait 2 s between dialing
    9 and dialing your ISP.


    +   3. Look for the USER_CHAT_SEQ variable. Most ISPs send “ogin:--ogin” to indicate
    that it is looking for your user name. Talk to your ISP to make sure that is appropriate
    for you. When you talk to your ISP, also review steps 4, 5, 7 and 8. Modify this
    variable if directed to do so by your ISP.


    +   4. What follows should be the USER_NAME variable. Enter your username for
    your ISP here.


    +   5. Review the PASSWORD_CHAT_SEQ option. Once your ISP receives your username,
    it will send a request for your password. In most cases, this will look like “ssword”:
    Check with your ISP to make sure this is the case for you.


    +   6. Look for the PASSWORD variable. Enter the password that you use to logon
    to your ISP here.


    +   7. Go to the PROMPT variable. Talk to your ISP. If your ISP sends a message
    to your computer after accepting your password, enter it here. In most cases,
    there will be no message.'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# 8. Move on to the PROTOCOL_START variable. In most cases this will be PPP.


    These settings assume that your ISP wants you to send your username and password
    in “clear text,” that is, without encryption.


    If you are not using encryption, you will only enter data for PHONE_NUMBER, USER_NAME,
    and PASSWORD. If necessary, you can refer to KPPP for this information using the
    commands you learned in Chapter 1.


    Once you have modified this file to your satisfaction, copy it to your /etc/ppp
    directory. The PPP daemon reads this configuration file here.


    In the next section, you will look at the settings that you need to change if
    you are using the two most common methods for username and password encryption.


    # Encryption


    There are two major methods for encryption when you are logging on to the Internet.
    They are known as the Password Authentication Protocol (PAP) and the Challenge
    Handshake Authentication Protocol (CHAP).


    Although PAP usernames and passwords are encrypted at your ISP, they are sent
    through your connection without encryption; CHAP usernames and passwords are encrypted
    when sent, using an encryption key sent by your ISP.


    If your ISP uses either PAP or CHAP for logins, add the following line to your
    connect script:'
  merge: -1
  pgno: 243
- img_proc: true
  md: '```

    pppd-options name username@isp.net

    ```


    where isp.net represents the domain of your Internet service provider. This part
    is not always required. Consult your ISP for the username message that they expect.


    If you''re setting up your connect file for PAP or CHAP, you can now “comment
    out” other variables related to logon, USER_CHAT_SEQ, USER_NAME, PASSWORD_CHAT_SEQ,
    and PASSWORD. In other words, when you add a “#” in front of the lines with these
    variables, dial won''t read them when it connects to the Internet.


    # Diald Configuration


    Now you will edit the dial configuration file to tell dial how to communicate
    with your modem. Once again, before you start editing back up your /etc/dial/dial.conf
    file.


    Now open up the dial.conf file in a text editor such as emacs, vi, or any text
    editor in your Start menu. If you installed the dial16 rpm packages, most of these
    variables are already set up for you. If you are not sure what to do with some
    of these variables, check the KPPP configuration that you set up in Chapter 1.


    The following steps detail only those variables that you may need to change. There
    are several other variables that may be part of the default dial.conf file for
    your distribution:


    +   Look for the device variable. This is the device assigned to your modem, usually
    /dev/modem.'
  merge: -1
  pgno: 244
- img_proc: true
  md: 'you are not sure, check the Device Tab of the KPPP Configuration dialog box
    from Chapter 1.


    +   2. Next, check the speed variable. This is the communication speed between
    your computer and the modem. Speed is typically about twice the rated speed of
    your modem. Normal options for a 56 and 33.6 kbps modem are 115,200 and 57,600
    bps. If you are having trouble staying connected, you might try a slower speed.


    +   3. Move on to the dynamic variable. It''s required if your ISP dynamically
    assigns you an IP address when you connect. If your ISP has assigned you a static
    IP address, add a “# at the beginning of this line. (This “comments out” the line,
    which keeps dial from reading it.)


    +   4. Continue to the local variable. If your ISP assigned you a static IP address,
    enter it here. For example, if your IP address is 191.12.132.1, enter:


    ```

    local 191.12.132.1

    ```


    Otherwise, enter one of the special use IP addresses listed in Chapter 5. If your
    IP address is dynamically assigned, it does not matter what address you use, as
    long as it is not a real IP address on the Internet.


    +   5. Move on to the remote variable. Set this to the static IP address for the
    ISP side of the connection. If you do not have this IP address, enter one of the
    special use IP addresses listed in Chapter 5.'
  merge: -1
  pgno: 245
- img_proc: true
  md: 'CHAPTER 10 • SHARING AN INTERNET CONNECTION 235


    +   6. Next, review the up-delay variable. By default, this is set to 5 (seconds).
    If you are having trouble connecting to your ISP, you might increase this number.


    +   7. Check the crtscts variable. This is the default for a modem with hardware
    control. If your modem does not use hardware control, and you know it works with
    Linux, review your modem documentation for the flow control variable to use here.


    +   8. Move on to the connect variable. Set this to the location of the diald
    configuration file that you just edited:


    ```

    connect /etc/ppp/connect

    ```


    For more information, refer to the dial manual page. You can find this online
    at http://www.loonie.net/~eschenk/dial.html.


    Once you have finished editing this diald.conf file, copy it to the /etc/ directory.


    ```

    /etc/rc.d/init.d/diald start

    ```


    You need to be in root or superuser mode to make this work. You can also substitute
    other commands for “start” such as “restart” and “status.”


    # Testing the Connection


    Now you can see if everything works. Check your physical connections from your
    computer to your telephone line. Make sure that your telephone line has a dial
    tone.'
  merge: -1
  pgno: 246
- img_proc: true
  md: 'A useful graphical tool for testing your connection is Dialal Control. Open
    up a command line interface and enter the /usr/bin/dctrl command. You will see
    the Dialal Control Tool on-screen.


    There are five sections shown in the Dialal Control Tool:


    +   - Detailed Status. The current status for your modem.

    - Numeric Load Monitor. TX and RX loads are based on data that is Transmitted
    and Received through your modem.

    - Graphical Load Monitor. TX and RX loads are graphically mapped over time.

    - Packet Queue. Data to be sent through your modem.

    - Dialing Log. When dial sets up your modem to dial, the progress is shown in
    this window.


    Now you can test how dial dial works with your connection. Click Control on the
    Dialal Control toolbar, then click Up request. If your configuration works and
    everything is properly connected, you will now see something resembling the following
    messages:


    ```

    Initializing Modem

    Dialing 5555555

    ```


    Diald will dial the number of your ISP as you entered it into the /etc/ppp/connect
    configuration file. Your modem should now establish a connection with your ISP.
    If there is a problem, you will see a message such as “no dialtone” or “no answer.”
    If you have a problem, there are a number of steps you can take to troubleshoot
    your system.'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# Troubleshooting Your Connection


    When you troubleshoot a connection, always check physical connections. Then use
    special tools such as dctrl to help you diagnose a problem. Only then does it
    make sense to check your software, such as your dial configuration files, because
    this is the least likely source of a problem.


    Most connection problems are physical; in other words, something is not connected
    between your computer and the telephone line.


    If your modem has a speaker, you may hear a dial tone and dialing pulses when
    it dials your ISP. If this is your situation, there is probably no physical problem
    with your connection.


    The message that you get from Diald Control can help you diagnose most problems.
    Review the following messages for what you can do.


    +   * Failed to Initialize Modem. Your modem may be disconnected from your computer.
    Check your connections. If you are using an internal modem, you will have to shut
    down your computer first. Once your computer is off, take the precautions to avoid
    static electricity as discussed in Chapter 1. Try removing and reinstalling your
    modem.


    +   * No Dial Tone. There is a good connection between your computer and modem.
    However, there is something wrong with the connection between your modem and the
    telephone line.'
  merge: -1
  pgno: 248
- img_proc: true
  md: '**NOTE** If you have no dial tone, check your telephone wires. Many modems
    have two different sockets. One modem socket is used for the wire that runs to
    the telephone jack, usually in your wall. The other socket is used to connect
    to your telephone. Make sure you are connected to the right socket. If there is
    no label on your modem, you may simply have to try the other socket.


    +   - **Answer.** Check your telephone number. If the number is correct, there
    may be a problem with your ISP.

    - **Busy.** The line is busy. Try again later.

    - **Chat Timeout.** Check the telephone number shown in Dial Control. Make sure
    it the number of your ISP corresponds to the. You get this message if the phone
    on the other end of the line is suddenly disconnected, or is a fax machine. If
    the number is correct, there may be a problem with your ISP.

    - **Failed to log in.** Your modem reached a good number, but could not connect
    to your ISP. Recheck your number; it might be someone''s home telephone number.
    If it is a good number for your ISP, they may be having problems. Look for an
    alternate number and try again.

    - **Other Problems.** If you cannot even start one of the Dial Control control
    drop-down menus, that means dial is is not working in some way. The next step
    is to recheck the dial configuration files.


    Once you have diagnosed your problem, try setting up Diald Control again. Restart
    dial whenever you change your configuration files. Repeat what you did in the
    last section. If you still have a problem, the next step is to check your software.
    There are a number of steps you can take:'
  merge: -1
  pgno: 249
- img_proc: true
  md: '+   - Check your adapters with the ifconfig command. The results should show
    a loopback (lo), ethernet (eth0), and serial connection (sl0). The serial connection
    communicates with your modem. If one of these adapters is missing, your modem
    server cannot communicate through that adapter.


    +   - Check to see if kppp is still working. Despite the files that you set up
    for dial and the modem server, kppp should still work. Refer to Chapter 1 if required,
    and use KPPP to try to connect to your ISP. If kppp and dial does not, review
    the previous sections and recheck your configuration files.


    +   - Check your dial configuration files. The key files are /etc/diald.conf and
    /etc/ppp/connect. Check these files against the settings that you used for KPPP
    in Chapter 1. Even if you did not set up KPPP, Chapter 1 explains the information
    that you need from your ISP.


    Once you have addressed any open issues, you know that diald works. You are now
    ready to move on to the next step, that is, testing the modem server on the local
    computer. Open up a command line in root or superuser mode. Start the Dial Control
    screen with the dctrl command. In the Dial Control toolbar, click Options, then
    activate Dialing Log.


    Now open up another command line interface. Enter the following command: ping
    www.mkp.com. You can substitute the Web site of your choice. If everything is
    working as it should, your modem server should now get dial to dial your ISP.
    If it does not connect, it will retry the number you added to your /etc/ppp/connect
    configuration file.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# Setting Up the Rest of Your Network


    The last step is to set up the right gateway and DNS server(s) for each of your
    other computers.


    To set up your modem server as the gateway for the other computers on your network,
    review your /etc/hosts file. Write down the IP address of your modem server computer.
    You will also need to set up your ISP''s DNS server(s) in each of your other computers.


    Go to the other computers on your network. Set up your gateway. The steps you
    take depend on whether you are setting up a Linux, Windows, or Macintosh computer.


    +   - If you are setting up a Linux computer, you can set up your gateway and
    DNS servers with the tool appropriate for your distribution, for example: Red
    Hat''s LinuxConf, Corel''s Control Center, Caldera''s COAS, or S.U.S.E.''s YaST.
    You will need to be in super mode or have the root password available for these
    tools. In some of these tools, DNS servers are also known as nameservers. Once
    you activate the changes, each computer should be ready to connect to the Internet
    through your modem server.

    - If you are setting up a Windows computer, click on the Start button, point to
    Settings, then click Control Panel. In your Control Panel, double click the Network
    icon. In the Network dialog box, scroll down to and double-click TCP/IP. In the
    TCP/IP Properties dialog box, click the Gateway tab. Enter the IP address of your
    modem server in the New gateway text box and click Add. Click the DNS Configuration
    tab. Enter your ISP''s domain name, such as isp.net, in the Domain text box. Enter
    your ISP''s DNS server IP'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# CHAPTER 10  SHARING AN INTERNET CONNECTION  241


    address in the DNS Server Search order text box. Click Add. Repeat if your ISP
    has more than one DNS server. Click OK and OK again. Restart your computer when
    prompted.


    +   * If you are setting up a Macintosh computer, go to the Apple menu bar, click
    Control Panels, then click MacTCP. Highlight PPP and then click More. In the Obtain
    Address section, highlight Server. In the Gateway Address section, enter the IP
    address of your modem server. In the Domain Name Server Information section, enter
    your ISP''s domain name, such as isp.net, and its DNS server''s IP address. Click
    OK, close MacTCP, and restart your computer.


    However, this is not enough. After the next section, you will set up IP Address
    Masquerading. This will keep others from using your Internal IP Network addresses
    to access your modem (and other data).


    # Automatic Configuration


    Now that you have set up dial on your modem server, you can choose to have it
    dial your ISP whenever you start your Linux computer.


    When you start your Linux computer, it runs through a number of scripts located
    in the rc.d directory. A script is a file with a series of commands. The scripts
    that run depend on your Linux distribution and are documented in the /etc/initabb
    file. You will find a group of “rc” files listed here. Look through these files.
    You will find an appropriate script such as rc.local or rc.sysinit to add the
    dial command.


    Open up the appropriate “rc” file in a text editor such as vi, emacs, or a GUI
    editor that you access through the'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# Setting Up IP Masquerading


    Main Menu button. Add the dial command, making sure to include the full directory
    path to that command. For example, if dial is located in the /etc/rc.d/init.d
    directory, enter /etc/rc.d/init.d/diald start command in the file.


    As there are over 1000 channels of data in TCP/IP, masquerading is a complex topic.
    With the right masquerading commands, you can defend your internal network against
    attack from the Internet. In this section, you will learn some simple commands
    to protect your network and allow access to the World Wide Web. In Chapter 15,
    you will learn to modify these commands to allow access to more Internet services
    such as FTP, ICQ, and Secure Servers.


    There are three possible commands that you can use depending on your Linux distribution:


    +   - ipfwadm. Linux distributions such as Red Hat version 5.x are based on the
    Linux 2.0 kernel, which uses the IP FireWallAdministration tool.

    - iptchains. Linux distributions such as Red Hat version 6.x are based on the
    Linux 2.2 kernel, which uses the IP Chains management tool.

    - ipnatctl. Linux distributions to be released in the second half of the year
    2000 will be based on the Linux 2.4 kernel, which uses the IP Network Address
    Translation ContRoL tool. As new security problems are found, developers update
    the packages for each of these commands. If you want to defend your network against
    attack, you will want to keep the package that you use up to date. The Web Find
    option in'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'CHAPTER 10 • SHARING AN INTERNET CONNECTION 243


    GnoRPM can help you find the latest version of each package. You will learn more
    about keeping your security packages up to date in Chapter 15.


    # IP Forwarding


    Before the other computers on your network can use your modem to communicate with
    the Internet, you need to set up forwarding.


    In Red Hat or Caldera Linux, open the /etc/sysconfig/network file in a text editor
    such as vi, emacs, or a GUI editor through the Main Menu button. Check this file
    to make sure “FORWARD_IPV4” is set to “yes”.


    In other distributions, you will probably need to run the following command to
    activate IP forwarding:


    ```

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    Then reboot Linux to activate forwarding on your computer.


    # Setting Up Your Firewall


    Anyone with a private network connected to the Internet needs a firewall. A properly
    configured firewall prevents unauthorized users from getting to your system. All
    data that passes through your firewall has to meet specific criteria, which you
    will start to learn about here.


    You may already have a firewall. On Red Hat Linux, your firewall commands are
    located in the /etc/rc.d/rc.firewall file. On Caldera systems, they are located
    in the /etc/rc.d/rc.firewallup file. Go to your modem server computer. If you
    are not using Red Hat or Caldera, you can find this file from a command line interface
    using the'
  merge: -1
  pgno: 254
