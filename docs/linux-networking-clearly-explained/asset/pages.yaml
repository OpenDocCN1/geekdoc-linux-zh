- img_proc: true
  md: '# CHAPTER 4 • SELECTING AND INSTALLING NETWORK HARDWARE 111


    default settings have been changed by means of physical modifications to the card
    (such as changing the jumpers for I/O, DMA or IRQ settings. Sometimes the Linux
    kernel just plain fails to detect PCI Plug and Play adapters. You can try to get
    the card working by specifying module parameters, as the following section explains.


    # Introducing Module Parameters


    If the Linux kernel failed to detect your Ethernet adapter when you started your
    system, chances are that you will need to specify module parameters manually.
    In brief, module parameters are load-time statements that customize the module''s
    operation. For Ethernet adapters, they consist of hardware settings, such as interrupt
    request (IRQ), input-output (I/O) addresses, and direct memory access (DMA) channels,
    which the module cannot automatically determine.


    # Determining the Correct Settings


    If you are planning to use a module that requires information about hardware settings
    such as these, you will need to determine the correct settings before you can
    use the module. To do so, check the adapter''s documentation. If you are installing
    a Non-Plug-Play device, you should also look at the adapter''s jumpers, if any,
    to see which configuration settings have been chosen.


    # Learning the Module Parameter Syntax


    It is not enough to know the correct settings; you must also know how to type
