  md: '# Getting Started with TCP/IP


    The technical name given to the protocol suite that underlies the public Internet,
    TCP/IP, is by far the most widely used networking protocol suite in the world.
    TCP/IP is also widely used to govern the network layer of communications in virtually
    every type of local area network, including LANs. In addition, it is the native
    networking technology of the Linux operating system. For all of these reasons,
    it is important to understand the essential concepts of TCP/IP, and what is more,
    how they are realized in the Linux environment.


    This chapter introduces TCP/IP, covering all the concepts that you will need to
    set up and administer TCP/IP'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# Introducing TCP/IP


    networking with your Linux system. You will also learn how to configure your local
    area network (LAN) to use TCP/IP.


    This section briefly introduces the Internet protocols (TCP/IP), beginning with
    a brief review of the Internet''s history. You will learn why TCP/IP has been
    so phenomenally successful, and why Linux is a very wise choice as the basis for
    creating your own TCP/IP network.


    # A Brief History of the Internet


    The TCP/IP protocol suite is the result of public investment in science and technology.
    In 1969, the U.S. Defense Department''s Advanced Research Projects Industry (ARPA),
    later known as DARPA took the leadership in funding research to build an experimental
    packet-switching network, the first of its kind. The early network, called ARPANET,
    linked a number of research centers and universities. Although the early ARPANET
    did not use the Internet protocols, it served as the testbed for TCP/IP development.
    (The ARPANET protocols were subsequently adopted by the private sector in the
    form of X.25 public data networks, which are still in use.)


    In the early 1980s, the Internet protocols were under rapid development; by 1983,
    ARPANET migrated to the Internet protocols, and the first Internet was born. Subsequently,
    ARPA funded a project to implement the Internet protocols in the Berkeley Unix
    distribution (BSD Unix). With the release of BSD 4.2 in the early 1980s, the fortunes
    of Unix and TCP/IP became closely intertwined.'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# CHAPTER 5 • GETTING STARTED WITH TCP/IP 117


    Since colleges and universities were among the most enthusiastic adopters of BSD
    Unix, the Internet''s growth during the 1980s was primarily among educational
    institutions; the network was not known to the general public and it was not used
    for commercial purposes. In 1985, the National Science Foundation (NSF) took over
    administration of the Internet and constructed a new, transcontinental backbone
    network, called NSFNet. NSF''s funding was predicated on acceptable use policies
    that prevented commercial use of the network.


    In less than a decade, the Internet was transformed from a little-known, obscure
    network in use primarily by academics into what must be seen as an emergent public
    medium, comparable in its probable social penetration to newspapers, radio, and
    television. The vestiges of the past fell away during the 1990s. In the year 1990,
    the ARPANET went off-line; in 1995, NSF withdrew its subsidy of the Internet backbone,
    removing the barriers to commercialization of the Internet. At the same time,
    the network grew at an almost unbelievable pace, doubling in size each year. The
    Internet now reaches more than half of all U.S. households.


    # The Internet and Internets


    The Internet’s rapid growth has made the term “Internet” a household word, but
    this word is often misunderstood. The huge, public Internet (with a capital “I”)
    is what most people mean when they use the term *Internet*. However, it is possible
    to create a network based on the TCP/IP protocols that are not connected to the
    wider, public Internet. The term *internet* is used to describe such networks.
    You may also encounter the term *intranet*. An intranet is a private, internal
    network that resembles the public Internet'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# PART TWO • BUILDING YOUR LOCAL AREA NETWORK (LAN)


    in that services such as the Web, FTP, and e-mail are available. Companies create
    intranets to create internal information systems capable of linking employees
    worldwide.


    In this chapter, you will learn how to create your own, private internet. You
    can connect your internet to the Internet, as you will see, but it is important
    to keep these two terms separate.


    # Factors in the Internet''s Success


    The Internet''s rapid growth and widespread public adoption are caused by many
    factors, including cultural and economic ones. But the TCP/IP protocols are surely
    among the most important contributors to the Internet''s phenomenal success. In
    brief, the TCP/IP protocols offer advantages that remain unsurpassed by any competing
    networking standards.


    +   * **Platform Independence.** The TCP/IP protocols are open protocols, which
    means that they are public, nonproprietary standards that are developed independent
    of any hardware or software company''s interests. This means that the Internet
    can connect all types of computers and use all types of physical media. To put
    this another way, the TCP/IP protocols are platform-independent.

    * **Effective Standards.** Because the TCP/IP protocols are controlled by effective
    standardization authorities, network hardware and software providers do not have
    to worry that their products will work with any TCP/IP-compatible network. This
    fact has encouraged hardware and software companies to invest in the Internet''s
    future.'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'CHAPTER 5 • GETTING STARTED WITH TCP/IP


    +   - Network Hardware Independence. As you will see in the next section, the
    TCP/IP protocols do not define the lowest layers in the OSI Reference Model, discussed
    in the previous chapter. As a result, TCP/IP can work with virtually any physical
    network hardware or network medium ever invented, and it will work with future
    network technologies.


    The Internet’s impressive growth is threatened by softwares that hope to “embrace
    and extend” TCP/IP, so that customers will become dependent on the firms’ products.
    In itself, this is an excellent reason to implement TCP/IP networks using Linux
    and open source software, such as the Apache Web server. Linux and Apache implement
    standards-conformant versions of TCP/IP.


    # Understanding Internet Layers


    As you learned in Chapter 3, it is useful to conceptualize networks in terms of
    separate layers, each of which has its own protocols. The OSI Reference Model
    defines seven layers. In Chapter 4, you learned that the Ethernet, the most commonly
    used technology for TCP/IP local area networks, operates at the physical and data
    link layers. In this section, you will learn how layers manifest in the TCP/IP
    environment. As you will see, TCP/IP layers do not map precisely to their OSI
    Reference Model equivalents.


    # Layers in TCP/IP


    TCP/IP distinguishes four layers instead of the seven identified in the OSI Reference
    Model. Although there is some disagreement over just how the levels should be
    distin-'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'PART TWO • BUILDING YOUR LOCAL AREA NETWORK (LAN)


    guished and named, they are generally described as follows:


    +   * Application Layer. This layer corresponds to the Application, Presentation,
    and part of the Session layer in the OSI Reference Model. This layer consists
    of client applications and servers. Protocols at the Application Layer include
    the File Transfer Protocol (FTP), the Hypertext Transfer Protocol (HTTP), the
    Simple Mail Transfer Protocol (SMTP), Domain Name Service (DNS), and Network Filesystem
    (NFS).

    * Host-to-Host Transport Layer. This layer corresponds to portions of the Session
    and Transport layers in the OSI model. It provides end-to-end data services. The
    two most important protocols at this layer are the Transmission Control Protocol
    (TCP), which establishes a reliable, connection-oriented link between two hosts
    on the Internet, and the User Datagram Protocol (UDP), which provides a data delivery
    service that does not require an active connection.

    * Internet Layer. This layer corresponds to the lower portion of the Transport
    layer in the OSI model. It wraps data in packets and handles addressing and routing.
    The most important protocol at this layer is the Internet Protocol (IP). This
    protocol defines the structure of Internet packets (called *datagrams*), specifies
    the form of Internet addresses, and moves data from TCP or UDP to the Network
    access layer.

    * Network Access Layer. This layer corresponds to the Network Access layer in
    the OSI model. It consists of routines for delivering the data to physical networks.
    An example of a Network Access Layer protocol is the Address Resolution Protocol
    (ARP), which maps'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# CHAPTER 5 • GETTING STARTED WITH TCP/IP


    IP addresses to Ethernet MAP addresses. Another example is the Point-to-Point
    Protocol (PPP), which enables TCP/IP to access modem connections.


    # Comparing the OSI Model and TCP/IP


    The differences between the OSI model''s seven-layer scheme and TCP/IP''s four-layer
    scheme have advantages as well as disadvantages.


    One advantage of TCP/IP is that it is not overspecified with respect to physical
    network technologies. The TCP/IP does not define the Data Link and Physical layers
    of the OSI model in any way. This is one of the strengths of TCP/IP. Because these
    layers are not defined, TCP/IP can work, in principle, with any type of physical
    network ever devised (and those that have yet to be devised).


    A disadvantage of TCP/IP is that the TCP/IP Application layer subsumes layers
    that, in the OSI model, are differentiated. As a result, individual applications
    must provide services such as encryption or compression that should be uniformly
    available to all applications.


    # What This All Means for Linux Users


    One of the greatest advantages of Linux is that a typical Linux distribution installs
    nearly everything that is needed to create TCP/IP networks. Most Linux distributions
    include a suite of high-quality servers and clients that function at TCP/IP''s
    Application layer, including the Apache web server, the wu-ftp FTP server, powerful
    mail client and server applications, and much more. In addition, the Host-to-Host
    Transport and Internet layers are woven into the very fabric of the Linux kernel,
    which provides native support for TCP/IP. In addition, Linux distri-'
  merge: -1
