    # Looking Under the Hood


    You can use a command-line interface utility called ftp to connect with an FTP
    site. Once you launch this utility, it becomes interactive and displays a special
    prompt. Try the following commands:


    +   1. ftp server. This command starts the FTP client. It also attempts to connect
