  md: '# Creating a Signature


    You can create a signature (including your name, organizational affiliation, and
    optional contact information) that Messenger will add automatically to your outgoing
    messages. To do so, click the Main Menu button, point to Applications, and choose
    Text Editor. Type your signature information, and then click Save. Save the file
    using the name .signature (note the dot in front of the filename), and place this
    file in the top-level directory of your home directory.


    # Adding Your Account Information


