    /home/suzanne 192.168.100.33 (rw)

    /mnt/cdrom 192.168.100.* (ro)

    ```


    In this example, I am exporting /home/suzanne to Suzanne''s computer (192.168.100.33),
    and I am specifying that this directory should be exported with read-write permissions
    (rw). I am also exporting the server''s CD-ROM drive (/mnt/cdrom) to all the clients
