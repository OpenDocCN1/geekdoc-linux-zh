  md: '# CHAPTER 7 • CONFIGURING AND USING NFS


    You need to follow these steps only once. After you have configured /etc/exports,
    the server will automatically export the directories each time you start your
    system. If you wish, you can restart your system instead of using exportfs.


    To configure /etc/exports and export shared directories, do the following:


    +   1. Open a terminal window, and switch to superuser (type su followed by your
    password);


