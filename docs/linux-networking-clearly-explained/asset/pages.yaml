    Although it is possible to use Linux and remote terminals to emulate a timesaring
    system with Linux, few network designers would go this route now that inexpensive
    PCs are available. As the next section explains, PCs enable network designs that
    give much more freedom to the user. However, the timesaring system''s high degree
    of central control does have its advantages. Internal security is excellent because
    users'' access is tightly controlled from the central computer. In addition, the
    central computer''s system administrator can control which applications are available.


    # Peer-to-Peer Networks


    Timesaring systems are like dictatorships, in which the central computer''s system
    administrator has total control over users'' access privileges and software selection.
    In contrast, peer-to-peer networks are well described democracies that verge on
    outright anarchy.


    Composed of linked personal computers, a peer-to-peer network is a network of
    equals. On a peer-to-peer network, each computer''s user decides which, if any,
    files or directories are to be shared with other users.


    Peer-to-peer networks originated (along with many additional key innovations)
    at Xerox Corporation''s Palo Alto Research Center (PARC) in the 1970s. The PARC
    is a research institute where academics work individually and in groups. They
    need their own, powerful'
  merge: -1
  pgno: 87
- img_proc: true
  md: 'computers, and they also need to communicate, share, and collaborate. Within
    PARC''s overall framework of research goals, they are free to pursue their interests
    as they see it. As the originators of peer-to-peer networking themselves recognize,
    this type of networking reflects the organizational culture of PARC. A peer-to-peer
    network gives each user a powerful, private computer. Each user decides which
    files and directories, if any, are shared. There is no central control.


    The PARC designers built peer-to-peer networking into the ill-fated but pioneering
    computer system they designed, the Xerox Star. The concept reached the marketplace
    with the Macintosh, which emulated many of the Star''s features, including built-in
    peer-to-peer networking. Every Macintosh comes with peer-to-peer networking capabilities
    built in. Today, peer-to-peer networking hardware and software is widely available
    for any type of personal computer.


    Classic, peer-to-peer networking is well illustrated by the Macintosh''s native
    LocalTalk network. LocalTalk is a proprietary Apple networking standard that defines
    a simple, peer-to-peer network that can connect a few to a few dozen Macintos.
    Physically, the connections require a LocalTalk adapter, which enables the Macs
    to be connected in a bus network topology. Once the computers are connected, each
    user opens the Macintosh File Sharing utility to determine which drives and directories
    are to be shared with other users. On each system, the Cho utility enables users
    to open the shared resources available on other user''s computers. Similar capabilities
    are implemented in Microsoft Windows 95/98 by means of the Network Neighborhood
    utility.'
