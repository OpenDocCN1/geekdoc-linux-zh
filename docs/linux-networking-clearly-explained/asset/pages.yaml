    run wydialconf, open a terminal window and type wydialconf.


    +   Modify the wydial configuration file (/etc/wydial.conf) to dial your ISP and
    establish the connection. You can do this by running Midnight Commander''s text
    utility; switch to superuser, type mc, and press Enter. Locate /etc/wydial.conf
    and press F4 to edit the file.


    The configuration file, /etc/wydial.conf, has two or more sections. The first,
    Dialer Defaults, is generated automatically by wydialconf. Do not alter the settings
    in this section. The second section, the name of which begins with'
