    from all users except the file owner and members of the file owner’s group.

    - chmod +x /home/everyone. "Enable any user to access this directory."

    - chmod =r /usr/docs/minitab.ps. "Erase whatever permissions currently exist for
    this file, and enable any user to read this file (but not to alter it)."


    You can combine user categories and permissions, as the following examples indicate:


    +   - chmod u+rwx /usr/sbin/pppd. Sets full permissions (read, write, and execute)
    for the user and the user’s group.

    - chmod u+rwx,o=r /usr/bin/myprogram. Note the use of the comma to separate the
