    +   * ftpusers. Sets up default users, in addition to the standard users already
    set up on your Linux computer.


    Typically, you will only need to revise the /etc/ftphosts file to govern access
    to your FTP server. If you are using Caldera Linux, access to wu-fptd is governed
    by the /etc/hosts.allow and /etc/hosts.deny files.


    To confirm this, check the other configuration files against the samples from
