  md: '# Understanding User Accounts,

    Ownership, and Permissions


    Thus far, you have installed network hardware (Chapter 4) and created a simple
    TCP/IP-based network (Chapter 5). You are anxious to get into the cool stuff—sharing
    files and printers with other Linux machines, and bringing Windows and Macintosh
    systems into the network—but please, hold your horses! It is essential that you
    have a crystal-clear understanding of user accounts in the network context as
    well as file ownership and permissions before you proceed.'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'Why bring up these admittedly rather tedious subjects when there is so much
    excitement around the corner? It is simple: Many, if not most, of the networking
    problems you will experience are caused by discperant user accounts, file ownership
    messes, and incorrect permissions. The sooner you fully and clearly understand
    what user account, file ownership, and file permissions are all in the Linux context,
    the happier will be your networking experience.


    # Creating User Accounts for Smooth Networking


    Because Linux is a multiuser operating system, it is important that some files
    are accessible to every user, while others—particularly configuration and password
    files—are accessible only to the system administrator. In addition, users need
    to be given full access to their own files, while such access should be restricted
    or prevented entirely for other users. When you are dealing with user accounts
    on the network, there is a further complication. For each user who will share
    files on the network, you must create identical user accounts on each machine.


    # Why Identical User Accounts Are Necessary


    You are creating the network in all likelihood so that you can access your own
    files on a remote machine. For example, suppose you have hooked up your notebook
    computer to the network, and you want to transfer files between your notebook
    and the desktop system. However, this will not work unless the two systems are
    set up with identical user accounts—and I mean identical. To make full use of
    all of the networking capabilities discussed in this book, both machines must
    define your user account so that all of the following are identical:'
  merge: -1
  pgno: 149
- img_proc: true
  md: '+   * User name;

    * Numeric user ID;

    * Primary group; and

    * Password.


    Suppose you create a user account for your use on your computer. The user name
    is suanne, the numeric ID associated with this account is 501, the primary group
    membership is wheel, and the password is yai2bfw. On the desktop computer, you
    create what you think is the same user account—the user name is suanne (with a
    lowercase “s”), the group is wheel, and the password is yai2bfw. However, you
    did not notice that the user utility gave this account a different numeric ID
    (500). Guess what? The Network File System (NFS), discussed in the next chapter,
    will not work.


    The reason why NFS will not work is simple: it will not be able to connect to
    a second computer unless all of these user account characteristics are the same
    on both machines. There is no way to supply a different user name or password
    or group membership or numerical user ID. Period! As you will see, Samba (Windows
    networking) is somewhat more forgiving, as is netatalk (AppleTalk networking).
    However, both of these protocols may behave strangely if the user accounts vary,
    and sometimes they will not connect at all.


    You will have to go around to every machine on your network and create identical
    accounts for every user. This is something of a pain, Admittedly. That is why
    larger networks have tools such as the Network Information Service (NIS), which
    enables network administrators (among)'
