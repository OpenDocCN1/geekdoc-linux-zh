    Look for the line associated with “DocumentRoot.” In Red Hat Linux, it is the
    /home/httpd/html directory, which is the root directory as far as Apache is concerned.
    Now look for the <Directory “home/httpd/html”> line. Below it, you can find another
    line that appears as “order deny, allow.”


    The following lines limit access to your Apache Web pages to computers inside
    your network. Edit the lines in your httpd.conf file under the <Directory “home/httpd/html”>
    heading to match.


    +   order deny, allow. Apache applies the rule from the line that starts with
    deny. Then it modifies the rule from the line that starts with allow.


    +   deny from all. This line denies access to your Web server from all computers.
    If your network is connected to the Internet, you do not want unauthorized outsiders
    to connect to your Intranet.


    +   allow from 127.localhost 192.168.0.0/255.255.255.0 subnet and localhost. This
    line allows access from the 127.0.0.0 subnet and localhost. It also allows access
