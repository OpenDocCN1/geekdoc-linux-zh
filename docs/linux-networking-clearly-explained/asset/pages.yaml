- img_proc: true
  md: 'At the lower layer of the OSI Reference Model are found the following four
    layers:


    +   - **Transport Layer.** At this layer, outgoing data is broken up into packets.
    A corresponding layer on the receiving end accepts the packets, unwraps them,
    and reassembles the data so that it has meaning to the next layer up.


    +   - **Network Layer.** At this layer, the outgoing data packets are addressed
    so that they will arrive at the correct destination. A corresponding layer on
    the receiving computer reads the addresses to make sure they are intended for
    that computer.


    +   - **Data Link Layer.** At this layer, the outgoing, addressed packets are
    transferred to the physical medium. At the receiving computer, the incoming packets
    are taken from the physical medium and passed “up” to the transport layer.


    +   - **Physical Layer.** This layer governs the transmission of data packets
    over a physical medium of a certain type, such as coaxial cable, fiberoptic cable,
    satellite systems, radiowaves, high-bandwidth digital tele-phone cables, or microwave
    systems.


    # Where Linux Fits In


    As you have learned in this chapter, there are many dif-erent types of computer
    networks. However, by far the largest percentage of new networks are local area
    networks (LAN) that use a bus topology, packet-switching protocols, and a peer-to-peer
    or client/server design.


    In such networks, Linux possesses a decisive advantage. That is because TCP/IP,
    the collective name for the Internet protocol suite, is built into Linux as its
    native networking'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'architecture. Installed by default with most Linux distributions, TCP/IP is
    ready to go when you have started your system. As you learned in Chapter 1, connecting
    a Linux system to the Internet is as simple as telling Linux, in effect, which
    type of physical medium you are using (such as a modem and telephone line), and
    figuring out which applications you want to run. In other words, you make choices
    at the data link layer and the application layer—and everything else is completely
    automatic.


    Linux has another advantage, well. TCP/IP is based on open, public nonproprietary
    standards that are defined by international standards committees. In contrast,
    vendor-specific (proprietary) network protocols, such as Apple Computer''s AppleTalk
    or Microsoft''s native networking protocols, are controlled by for-profit companies.
    These can and will alter the underlying protocols if they believe that doing so
    will increase the returns they are able to give to their stockholders. The result
    could be that you are stuck with applications and equipment that will not function
    correctly unless you are willing to pay for an expensive software upgrade. By
    choosing Linux as the basis for your computer network, you protect yourself from
    the marketing antics of for-profit computer companies.


    The next chapter turns to TCP/IP, the native networking technology of the Linux
    operating system. You will learn how TCP/IP works, and how it is implemented in
    Linux. You will also learn some additional ways in which TCP/IP varies from the
    OSI Reference Model.'
