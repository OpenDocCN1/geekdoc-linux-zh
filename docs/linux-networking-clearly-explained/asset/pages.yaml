  md: '# PART THREE • CONNECTING YOUR LAN TO THE INTERNET


    the other assigned by you for its connection to your local network.


    Now you are ready to start enjoying high-speed Internet access from every computer
    on your network.


    # Using a Dedicated Computer as a Firewall


    It is possible to set up a “Firewall” computer for regular use. However, computers
    have limited resources. If you cannot sacrifice a computer for use as a firewall,
    there are a number of things to consider about your firewall computer.


    +   **Limited Slots.** Setting up hardware for Linux is easier when you have ISA
    cards. However, if you want to use a service as one-way cable modem, you may need
    two Ethernet cards and a telephone modem. Many newer computers have only one or
    two ISA slots available. For more information about ISA and PCI cards, refer to
    Chapter 1.


    +   **Limited Channels.** If you connect a large number of components to your
    firewall computer, such as printers, CD-ROMs, DVD players, etc., you may not have
    enough IRQ channels for the Ethernet cards and modems that you need to install.
    One way to review the channels you have available is through the KDE Control Center.
    Click on the Main Menu button, then click KDE Control Center. Click on the plus
    sign next to Information, then click Interrupts. The currently used IRQs will
    be listed here.


    +   **Security.** Any firewall you set up can protect the computers on your internal
    network very well. However, the computer that you use as a firewall can some-times
    be at risk.'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# CHAPTER 11 • SHARING HIGH-SPEED CONNECTIONS 275


    If you cannot dedicate a computer as a firewall, you will probably have to move
    your peripherals. Because you can share access on your network, you do not absolutely
    have to have the following equipment on your firewall computer: floppy drives;
    printers; CD-ROMs; second hard drives, etc. Move these devices to other computers
    on your network and share them through Samba or NFS as appropriate.


    # Improving Your Network''s Performance


    Once you have set up your network, there are a couple of things that you can do
    with Netscape Navigator to optimize your Internet experience. You can cache commonly
    Web pages on your local computer. You can also use the proxy servers common to
    many high-speed Internet service providers.


    # Adjusting Netscape''s Cache Settings


    By default, Web browsers such as Netscape Communicator use their own cache of
    Web pages. You can set them up to store the most recently used Web pages in your
    Random Access Memory (RAM) or on your local hard drive. For example, when I review
    the various HOWTOs related to Firewalls, Netscape first looks for the pages on
    my local hard drive before going out to the Internet.


    Using cache can reduce the load on a busy network. However, it requires considerable
    free memory. Unfortunately, the settings you use for Netscape cache work only
    for the local computer. However, you can set up similar caches for each computer
    on your network.'
  merge: -1
  pgno: 286
- img_proc: true
  md: 'To set up Netscape caching, open up Netscape on your computer. Depending on
    your distribution and Graphical User Interface, click on the Netscape button on
    your desktop menu bar or navigate to Netscape through your Main Menu button. In
    the Netscape toolbar, click Edit, then click Preferences. This opens up the Netscape:
    Preferences dialog box. In the Category column, click on the arrow next to Advanced.
    You will see two options under Advanced: Cache and Proxies.


    Click on Cache. There are four decisions that you need to make for your cache,
    as described in the following sections.


    # Memory Caching


    Your memory cache is the amount of RAM that you can dedicate to storing the most
    recently accessed Web pages. Generally, you need a lot of free RAM on your computer
    to use a Memory Cache. One way to check for free RAM is to open up a command line
    interface and run the top command. Then check the amount of memory listed as free
    in the “Mem” line.


    > TIP One problem with too much Netscape memory cache is that Web pages stay in
    your computer memory even after you close Netscape. This deprives other applications
    of the RAM that might be needed to run properly.


    # Disk Caching


    Your Disk Cache is the amount of hard drive space that you want to dedicate to
    storing the most recently accessed Web pages. If you have a lot of extra hard
    disk space'
  merge: -1
  pgno: 287
- img_proc: true
  md: 'available and use certain Web pages frequently, you can store them in your
    hard drive for easy retrieval.


    # Cache Folder


    You can set up your disk cache in the folder of your choice. You can even set
    up a dedicated partition for this purpose.


    # Cache Refreshing


    The “Document in cache is compared...” setting specifies when you use your cache.


    If you choose “Every time,” Netscape gets your Web page from the network every
    time there has been a change. You can then set your cache sizes to zero. If you
    work with time-sensitive information, you do not want a cache in any case.


    If you choose “Once per session,” your browser compares your cache with the Web
    page on the network only once after you start Netscape. If you return to that
    Web page, the page comes from your cache, unless you then click on Refresh in
    the Netscape toolbar.


    # Setting Up Netscape Proxies


    This section applies if your ISP uses a Proxy Server. Many high-speed ISPs use
    Proxy Servers to increase their effective speed.


    You can set up how you interact with Proxy Servers in Netscape preferences. If
    you are still in the Netscape preferences window from the last section, click
    on Proxies.'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'In the setup dialog box for proxy servers, there are four decisions that you
    need to make regarding how you relate to your Proxy Server, as discussed in the
    following sections.


    # Bypass Your Proxy Server


    If you want to bypass your Proxy Server, select Direct Connection to the Internet.
    This option bypasses your ISP Proxy Server for all information that you get from
    the Internet. While this may be slower, the information that you get will be more
    up to date.


    NOTE This option may violate the policy of some high-speed ISPs. Ask your ISP
    for more information.


    # Automatic Proxy Configuration


    The setup for some ISPs proxy servers can be complex. If you choose the Automatic
    Proxy Configuration option, Netscape looks to your ISPs Proxy Server setup file
    for all Web pages. You will also need to include your ISP proxy server address
    in the text box, which typically appears something like, http://proxy:8080. Consult
    your ISP to see if it has a proxy server and the address you need here. Some proxy
    servers may have trouble with sites such as Web-based e-mail. Some ISPs have custom
    proxy files available at a specific Web address to manage this issue.


    # Manual Proxy Configuration


    If you are ready to do a bit of work, the middle option—manual proxy configuration—is
    for you.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# CHAPTER 11 SHARING HIGH-SPEED CONNECTIONS


    A manual proxy setup is essential if you access many Web-based mail servers. Select
    the manual proxy configuration option and click View. This brings you to the Netscape:
    View Manual Proxy Configuration dialog box. The entries that you see here apply
    to the @Home cable modem service.


    Consult your ISP for the name to enter for each of the noted Internet Protocols.
    You will also want their IP addresses for reference. Because Gopher and WAIS are
    rarely used today, you should be able to leave these blank.


    > TIP If Netscape does not recognize your ISP Proxy Server, add the IP address
    of that server to your /etc/hosts file.


    > TIP Based on the firewall that you set up in Chapter 10, you should be able
    to only read regular Web pages. You will not be able to connect to secure Web
    sites or FTP sites until you allow access through the appropriate ipchains commands.
    You will learn to do this in Chapter 15.


    # Caching Web Documents Locally


    If your high-speed Internet setup is not good enough for you, you can set up your
    own proxy server on your local area network. A proxy server stores Internet data
    on a computer closer to those who need the information, in this case, on your
    local area network.


    With your own proxy server, you do not have to worry about your ISP proxy server
    configuration. You can save your high-speed Internet access for such uses as video
    conferencing, and you do not need a Netscape cache on any of the computers on
    your network.'
  merge: -1
  pgno: 290
- img_proc: true
  md: 'When the first person on your network looks for a Web page for the first time,
    such as http://www.yahoo.com, your proxy server cannot find it in its cache. It
    looks to the Internet for a copy of the Yahoo Web page, serves it to the requesting
    computer, and stores a copy in its cache.


    When the second person on your network looks for the Yahoo Web page, your proxy
    server finds it on its network and serves it directly to the requesting computer
    without accessing the Internet.


    The proxy server for Linux is known as Squid. After several years of development,
    it was finally released in September 1998.


    You can set up Squid behind a firewall to manage all kinds of Internet information,
    including Web pages, secure Web pages, FTP servers, mail and newsgroups, and more.
    You can also use Squid to filter out what you do not want, including Web banners
    and the sites that you do not want your users to see on your local network.


    You can get more information about Squid, including its users'' guide and latest
    downloads from the Squid Proxy Cache home page at http://www.squid-cache.org.


    Alternately, you can download rpms or compressed files suitable for Squid installation
    from your Linux distribution''s Web site.


