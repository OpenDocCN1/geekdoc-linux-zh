- img_proc: true
  md: '+   Equipment. Your telephone company needs special equipment to filter DSL
    signals from regular telephone calls.


    +   Access. The DSL provider of your choice must have some connection to your
    telephone company''s central office.


    +   Quality of Line. Even if you meet the distance requirement, some telephone
    lines are too old or poor to transmit the quantity of data required for DSL.


    If you choose DSL service, you will need to consider the following factors. Consult
    your DSL provider to learn how they handle each issue.


    +   Equipment. You will need a DSL adapter and an Ethernet card. If you want a
    telephone that uses the same line, you will also need a splitter. Sometimes a
    DSL provider will provide a network card that functions as both a DSL adapter
    and an Ethernet card.


    +   Wiring. The telephone company provides wiring to your telephone jack. Your
    DSL provider wires your connection to your DSL adapter. From there you may need
    to provide the Ethernet cable from the DSL adapter to your Ethernet card(s).


    +   Software. You will need the following Linux packages: gated, ipchains to set
    up your computer as a gateway and a firewall. If you have to use a Dynamic IP
    address, dhcpd.


    +   Hardware. Some DSL providers supply a network card that does not work with
    Linux. Ask for an ISA Ethernet card or a PCI card with a Linux'
  merge: -1
