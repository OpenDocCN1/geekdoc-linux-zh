  md: 'older, slower system, such as a 486 or a Pentium 90. Equip the computer with
    a slow but capacious drive—you can get 26 GB hard drives at present for as little
    as $150—and set the machine aside as a backup device. Install Linux on this machine,
    create user accounts for all the users on your network, and export the users''
    home directories with NFS or Samba. Once you have set up the machine this way,
    you can configure tar and cron, as explained in the next section, to back up users''
    data automatically.


    # Backing Up with Tar and Cron: An Overview


    Here is an overview of the backup solution described in this chapter. As you will
    see, it is simple, and very easy to implement.


    +   - Tar. You will use the tar (tape archiver) utility to back up your users''
    home directories to the backup system. As you will see, the backup approach involves
    making an initial full backup of the user''s home directory, followed by daily
    incremental backups of any new or altered files. Full backups are repeated each
    week, beginning a new backup cycle.

    - Cron. The cron daemon performs the task of launching the needed backups, both
    the weekly full backups and the daily incremental ones. You can use the backup
    schedule suggested in this book, or substitute your own, if you wish, at more
    or less frequent intervals.'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# CHAPTER 14 • ARCHIVING YOUR DATA AUTOMATICALLY 315


    # Archiving Data with Tar


    The Linux version of the venerable Unix archive program tar can write to directories
    as well as tape devices. Once you have set up your network, you can use tar to
    create backup archives of your data.


    # Understanding Fundamental Tar Concepts


    If you are used to using Windows archiving programs such as WinZip, you need to
    understand that tar does not include file compression capabilities; it is strictly
    an archiving program, which means that it collects one or more files and stores
    them as a unit. Once you have created the archive, you can compress it using gzip,
    the GNU compression utility discussed in the next section.


    # Creating an Archive


    To create an archive with tar, you will make use of three basic command options:
    --create, --verbose, and --file.


    +   - Create (--create or -c). The -c option tells tar to make a new archive file.

    - Verbose (--verbose or -v). The -v option tells tar to give you information about
    what it’s doing.

    - File (--file or -f). The -f option enables you to specify the name of the file
    to be created.

    - Extract (--extract or -x). The -x option enables you to take the files from
    an archive and restore them to their original, separate condition.


    In addition, you must also list the files to be archived. You can do so by listing
    them individually, separated by a space. As an alternative, you can use wildcards.
    For'
  merge: -1
  pgno: 326
- img_proc: true
  md: 'example, the following command creates an archive containing all the GIF graphics
    in the current directory:


    ```

    tar -cvf gif-collection.tar *.gif

    ```


    Note that you can use the short form of the option names (-cvf) instead of typing
    the lengthier versions (--create --verbose --file). When you use the short version,
    type only one hyphen, not two.


    # Additional Options for Backup Actions


    Once you have specified one of the required options (-c or -v), you will need
    to add one or more of the options shown in Table 14.1.


    Table 14.1 Additional Backup Options (tar)


    | Option | Description |

    | --- | --- |

    | -f filename | Use the specified archive file or device name. You can specify
    an external location using the form hostname:filename. |

    | -h | Do not archive symbolic links; instead, archive the files to which they
    point. |

    | -W | Verify the archive after creating it. |

    | -p | Keep the permissions on the source files. |

    | -P | Keep the full path information for each file. |


    # Listing and Extracting Archives


    Over time, you may have created a considerable archive. If you need to check the
    contents of a specific archive, you'
  merge: -1
  pgno: 327
- img_proc: true
  md: 'can examine the files in an archive such as art.tar with the following command:


    ```

    tar -lt art.tar

    ```


    If a disaster strikes, you can restore files from an archive with the following
    command (note that this example also uses the --verbose and --file options):


    ```

    tar -xvf art.tar

    ```


    By default, this command extracts the entire archive and places the files in the
    current directory.


    > **CAUTION** Be careful when you are extracting archives. If any file in the
    current directory has the same name as a file in the tar archive, tar will overwrite
    the existing file, even if it is more recent than the archived version. Unless
    you are restoring all of the files in a tar backup, play it safe. Create a new
    subdirectory, move the tar archive to that subdirectory, and extract the archive.


    Alternately, you can extract individual files from an archive. For example, if
    you wanted to extract great-art.gif from a tar of your entire home directory,
    use the following command:


    ```

    tar -xvf home.tar great-art.gif

    ```


    Only the file(s) named at the end of the command will be extracted from the archive.'
  merge: -1
