  md: 'CHAPTER 12 • RUNNING AN INTRANET WEB SERVER 295


    When you create your Web page, you can use this directory structure, or create
    your own based on the modifications that you make to the Apache configuration
    files.


    There are a number of tools available to create Web pages, including Netscape
    Composer and Microsoft Front Page. Now that you know how to transfer files through
    Samba and Netatalk, you are not limited to Linux-based tools.


    Because Web pages are based on text files, you can even use a text editor to create
    your Web page. Some Web page creation tools have Web page templates. Whatever
    tool you use, save your desired home page to the index.html file in your DocumentRoot
    directory.


    # Examining Apache Options


    Now you will examine some of the other options associated with Apache. This list
    is far from extensive; some books on Apache alone are twice the size of this book.


    To help guide your review, reopen your Apache configuration file(s). The following
    sections divide some of the parameters in your configuration file(s) into the
    following categories:


    +   - Basic Setup. Important parameters for every Apache Web site.

    - Tuning. Performance related parameters.

    - Features. Parameters that you can add for more sophisticated Web sites.

    - Advanced. Other parameters.'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# Basic Setup Options


    You can review some of the parameters in each category in the following sections.


    The Apache configuration file includes a long list of settings. You probably will
    not need to make any changes simply for serving Web pages on your local network.
    If you want to set up a Web site, you will generally want to work through your
    ISP. If you understand these settings, you can ensure that your ISP is meeting
    your needs.


    The following is based on the Red Hat 6.2 Apache httpd.conf configuration file.
    If you are working from a different Linux distribution, you may find a slightly
    different set of parameters.


    Each of these parameters are variables; for example, once you set ServerAdmin
    to an email address, any reference to ServerAdmin in any other part of Apache
    returns that email address.


    +   - ServerAdmin. Set this to the email address of the Web site administrator.
    This address appears in a number of error messages such as when a specific Web
    page cannot be found. Your users can use it to contact you when they see a problem.

    - ServerName. Set this to the hostname of your computer. If you have a working
    /etc/hosts file or DNS, leave this blank. If your ISP runs your Web site, they
    set the ServerName.

    - DocumentRoot. The root directory for your Web server; other directories with
    Web pages are subdirectories of the Document Root.

    - CustomLog. There are four basic custom log files: access, referer, agent, and
    error. The access log lists'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# CHAPTER 12 • RUNNING AN INTRANET WEB SERVER 297


    each time someone goes to your Web site. The refer log lists each time someone
    goes to your Web site from a link. The agent log notes the browser that access
    your Web page. The error log notes every time an error message as “file not found”
    is sent to a user.


    +   * **ScriptAlias.** Set this variable to the location of your Common Gateway
    Interface (CGI) Scripts. These are small programs that primarily help your Web
    sites process user requests, such as search information from a database.


    +   * **User, Group.** People who access your Web site get some level of user
    privileges on your Linux computer. By default, this should be set to no one. If
    you limit your Web site to an intranet, you can set these variables to a specific
    user and group.


    # Apache Tuning Options


    There are three features you can modify to help “tune” Apache for better performance.


    +   * **Port.** TCP/IP has 1023 different channels, which are technically known
    as ports. By default, Web sites use channel 80. For greater security, you could
    use a different channel, as long as it is above 1024. As long as your users did
    not share this information with others, you would then have a private channel
    for your Intranet Web site.


    +   * **Timeout.** When you’re connected to a Web site, there is almost always
    data going back and forth between your computer and the Web site. If Apache does
    not see data for the Timeout period, in seconds, it disconnects the user. If you
    run a Web site with many'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# PART FOUR • CREATING AN INTRANET


    lost connections, you may want to reduce this number to allow others to connect
    more quickly.


    +   **HostnameLookups.** By default, Apache reads the IP addresses of computers
    that browse your Web pages. If you activate host name lookups, it will also check
    your databases (/etc/hosts and DNS) for the associated computer host names. This
    can help you identify from where the users of your Web site are coming. However,
    this option can also slow the responsiveness of your Web server.


    # Additional Apache Features


    There are a number of features that you can set up for specific files and directories
    on your Apache Web Server. If you want these features, set the Options variable
    under the applicable directory to each feature:


    +   **May Execute CGI.** You only need to activate this in any directory with
    CGI files.

    - **Includes.** Refers to Server Side Includes (SSIs), which insert files or programs
    into your Web pages. If you have a “.shtml” web page, you need this option because
    your Web page has Server Side Includes.

    - **Includes NOEXECF.** Another way to use SSI commands, except “#exec” and “#include.”

    - **Multi views.** Allows Apache to serve different types of programs (e.g., CGI
    or SSIs) depending on the preferences set on the user’s Web browser.

    - **Indexes.** You can use this option to turn Apache into a file server. By default,
    Apache gives users the “index.htm” page from the applicable directory on your
    Server. If there is no index.htm page in that directory, and this is active, Apache
    sends out a current list of files in that directory.'
  merge: -1
  pgno: 309
- img_proc: true
  md: 'CHAPTER 12 • RUNNING AN INTRANET WEB SERVER 299


    +   - May follow symlinks. If you activate the Indexes option to share files,
    this allows your users to follow any symbolic links that you have set up between
    your Linux files.


    +   - Follow symlink if owner matches. Modifies the previous option, based on
    the owner of each linked file.


    # Advanced Apache Options


    The following is simply a brief overview of the other modules that you can set
    up on your Apache server.


    +   - Virtual Domains. If you have more than one Web site on your Apache server,
    you need to set up a different Virtual Domain for each server. While the options
    for each Virtual Domain are similar to those shown in the last section, you should
    set up each Virtual Domain(s) in its own directory.


    +   - Modules. You can review a list of modules that Apache loads. If you know
    how to use Apache modules, review this list against what you see in the Apache
    configuration file.


    +   - Secure Modules. With Secure Modules, you can configure for secure Web pages,
    also known as the Secure Sockets Layer, or https.


    For more information on these and other modules that you can use with Apache,
    refer to the Apache Web page. You can also review the references listed in the
    next section for more information.'
