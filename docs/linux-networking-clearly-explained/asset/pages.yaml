    important part of a computer network. To be sure, some media place restrictions
    on the amount of data that can be transferred through a network, but even the
    simplest and least expensive cable—twisted pair, the type of cabling used for
    telephones—can transfer as much as 1.5 Mbps. Network signals can traverse any
    type of telecommunication medium, including telephone lines, coaxial cable, microwave
    relay systems, satellites, wireless (radio and infrared), and fiberoptic cable.
    Often, a single message travels over several different physical media before arriving
    at its destination.


    The Internet connection that you created in Chapter 1 exemplifies the heterogeneity
    of network physical media. You connected to your ISP via a telephone line. From
    there, your computer''s signals may have traversed a highcapacity digital telephone
    cable (called T1 or T3), fiber optic cables, or microwave relay systems.


    # Communications Standards (Protocols)


    What makes a network function is not merely the physical connections, whether
    they are achieved through circuit switching or packet switching. Of fundamental
    importance are the standards that specify how network functions. These standards
    are called protocols. Protocols are fixed, formalized standards that specify how
    two similar network components can establish communication. Often, a given network''s
    functionality requires dozens or even hundreds of protocols. For example, more
    than one hundred Internet protocols exist. The collection of protocols that defines
    a given network''s functionality is called its protocol suite. Collectively, a
    protocol suite specifies the network''s overall design, called the network architecture.'
  merge: -1
