    gateway computer that is connected to your Local Network.


    IP_ADDR


    Sets up your IP address on the Internet. This is unrelated to the private internal
    IP addresses on your network. This address is linked to your EXTERNAL_INTERFACE.


    LOCALNET_1


    Sets up your local subnet. The network shown in Figure 16.6 covers the addresses
    from 192.168.1.0 through 192.168.1.255.


    ANYWHERE


    Any IP address. Generally not used, unless you want to restrict access to all
    locations on the Internet.


    NAMESERVER_1


    Specifies the IP address for your ISP''s DNS server. As this is essential for
    navigating the Internet, you do not want to block any information or from this
    computer.


    NAMESERVER_2


    Specifies the IP address for your ISP''s backup DNS server.


    SMTP_SERVER


    Specifies the host name for your ISP''s outgoing mail server. See the note after
    the end of this table.


    IMAP_SERVER


    Use this parameter only if your e-mail comes through an Internet Message Access
    Protocol Server. Most email systems still use POP, or the Post Office Protocol
    to receive mail.


    NEWS_SERVER


    Use the host name of your news server. See note after this table.


    WEB_PROXY_SERVER


    You will need the host name of your ISP''s proxy server here.


    LOOPBACK


    All addresses in the class A network 127.0.0.0 are reserved for loopback functions.'
  merge: -1
  pgno: 389
- img_proc: true
  md: '# CHAPTER 16 • SECURING YOUR NETWORK 379


    CLASS_A Standard IP Class A addresses reserved for private networks. CLASS_A through
    CLASS_E are set up to prevent crackers from using addresses to attack your network.


    CLASS_B Set to cover the standard Class B private network addresses.


    CLASS_C Set to cover the standard Class C private network addresses.


    CLASS_D Set to cover the standard Class D multicast addresses. These IP addresses
    are not legal for source computers.


    CLASS_E_RESERVED_NET Set to cover the standard Class E experimental addresses.
    These IP addresses are not allowed for use anywhere on the Internet.


    BROADCAST_SRC Set to the Broadcast Source Address. While this is the normal way
    for computers inside your network to identify each other, you do not want people
    on other networks to identify the IP addresses that you use inside your network.


    BROADCAST_DEST Set to the Broadcast Destination Address. See BROADCAST_SRC.


    PRIVPORTS Set to the reserved channels for TCP/IP.


    UNPRIVPORTS These channels are available for use by any TCP/IP service.


    NFS_PORT Makes sure that when you export NFS directories, the exports stay within
    your local network.


    SOCKS_PORT This is just another channel that a cracker could use to manipulate
    your system.'
  merge: -1
  pgno: 390
- img_proc: true
  md: '# XWINDOW_PORTS


    Set to the Linux standard ports for remote users that want to connect to your
    Graphical User Interface.


    # SSH_LOCAL_PORTS


    SSH, or the Secure SHell, is a way to connect two computers with encrypted logons
    and commands. This specifies the channels that can be used on the local computer.


    # SSH_REMOTE_PORTS


    Specifies the channels that can be used on a remote end of an SSH connection.


    # TRACEROUTE_SRC_PORTS


    Sets up the channels for the traceroute command, which you used to trace the route
    of your data on the Internet. You do not want a cracker to trace the data that
    you send all the way back to your computer.


    # TRACEROUTE_DEST_PORTS


    The other end of the traceroute command.


    # From Here


    This chapter concludes Linux Networking Clearly Explained. You have now learned
    all the concepts and skills you need to set up a network based on Red Hat Linux.
    With this solid foundation behind you, you will be able to set up reliable small
    networks, secure from the dangers inherent to the Internet. Congratulations!


    # References and Further Reading


    Mann, S. and Mitchell, E. L. (2000). Linux System Security, Upple Saddle River,
    NJ: Prentice-Hall.'
