    +   8. Make Linux reread this file. Open a command line interface. Go into root
    or superuser mode and enter the killall -HUP inetd command.


    +   9. If Linux returns a message such as “inetd stopped,” start the superserver.
    In Red Hat Linux, use the /etc/rc.d/init.d/inetd command. If you are not using
    Red Hat, consult your distribution’s documentation for the command to start your
    internet superserver.


    > TIP In Red Hat Linux 6.2 and above, you may see only a few (if any) lines in
