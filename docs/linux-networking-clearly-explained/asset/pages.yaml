    # Configuring Module Parameters


    Today''s Linux kernels support a wide variety of peripheral devices using loadable
    kernel modules (or just modules for short). In brief, modules are kernel components
    that are designed to do a specific job, such as supporting a specific brand and
    model of Ethernet adapter. As the term implies, modules are modular; they are
    standalone components that can be added to the running kernel, or removed from
    the running kernel, without harming the kernel''s functionality in any way.


    The modules for Ethernet make certain assumptions about default settings, such
    as the adapter''s I/O port and IRQ setting. If the kernel failed to detect your
    Ethernet card when you started your system, it is possible that'
  merge: -1
