  md: '# CHAPTER 11 • SHARING HIGH-SPEED CONNECTIONS


    This option drives the way you configure the gateway

    computer on your network. You will explore this issue in

    more detail in the next section.


    # Configuring the Gateway Device


    When you set up a network connection to the Internet,

    t key is the Gateway from your network. Dedicated

    routers make this job easier; you do not need to “sacri-

