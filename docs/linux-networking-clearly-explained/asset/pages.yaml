- img_proc: true
  md: 'Note that a hub is essentially a repeater with some added electronics. Star
    networks are really bus networks in which each workstation is connected to its
    own, one-cable segment. The hub functions as a repeater to unite all the segments
    into a single collision domain.


    # Bridges


    Like a repeater, a *bridge* connects two Ethernet segments. However, the bridge
    contains electronics that enable it to “learn” the MAC addresses of all the workstations
    in each segment. When the bridge receives signals from the first segment, it examines
    the signals and determines where the signals are coming from. If the signals are
    from a workstation in the first segment, the bridge does not pass them to the
    second segment.


    The effect of connecting segments with a bridge is a dramatic reduction in the
    number of potential collisions, since workstations on separate segments do not
    have to contend with all of the other segments’ signals. In other words, a bridge
    isolates network segments so that each of them is, for most purposes, a separate
    collision domain. For this reason, bridges enable Ethernets to be extended with
    less degradation of the network’s performance.


    # Routers


    Like repeaters and bridges, *routers* connect two Ethernet segments. They include
    the functions of bridges; that is, they examine the MAC addresses of data packets
    and forward the packet only if it needs to go on the next segment. However, routers
    also operate at a higher layer of the protocol stack. For this reason, they can
    determine whether a packet is addressed to a destination that is not on any segment
    of the local Ethernet. They can forward'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'packets to wide area networks (WANs), including the public Internet.


    A router is needed to connect an Ethernet to the Internet. However, it is not
    necessary to purchase an expensive, standalone router for this purpose. You can
    set up a Linux system to function as a router that connects your Ethernet to the
    public Internet, as explained later in this book.


    # Switches


    Switches are advanced, expensive devices that solve the media access contention
    problems of Ethernets by establishing, in effect, a direct physical connection—a
    circuit—between two communicating workstations. Because switches enable workstations
    to communicate in full duplex mode, in which the workstations can send and receive
    data at the same time, they effectively double the network''s bandwidth (20 Mbps
    for 10BaseT, and 200 Mbps for 100BaseT).


    # Designing Your Ethernet


    If creating a local area network seems like rocket science, read on, because you
    are in for a pleasant surprise. Today''s Ethernet hardware is almost ridiculously
    easy to install and configure. Creating a network is, in most cases, as simple
    as hooking up all the hardware and turning on the power.


    This section walks you through the network design considerations involved for
    small and larger networks, beginning with a few pointers on cabling.'
