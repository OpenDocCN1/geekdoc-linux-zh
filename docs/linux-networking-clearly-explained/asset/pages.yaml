  md: '# Securing Your Network


    There is a frontier element when you connect to the Internet. The opportunities
    are fabulous. However, the security risks are fabulous as well. There is no one
    tool that can address all security issues. In this chapter, you will learn to
    take a layered approach to security.


    First, you will review the ways in which you are vulnerable to attack. Not all
    security issues destroy files on your computer; you will learn to monitor the
    activity on your network for problems.


    If you are connecting to the Internet through an ISP, you are not working alone.
    The ISPs will help you by filtering'
  merge: -1
  pgno: 358
- img_proc: true
  md: 'some of the content from the Internet. But they cannot help you if you bypass
    their security gates.


    Later, you will look at the things that you can do to protect your network. First,
    you will learn to keep your network as simple as possible. Fewer active network
    programs mean fewer fewer ways to break into your network.


    Finally, you will also learn about setting up a firewall with various ipchains
    commands.


    # Understanding the Risk


    Perhaps you are thinking that your network is safe from attack because it contains
    little or no of value, at least to outsiders. If so, it is time for a wake-up
    call. Any network that is connected to the Internet is vulnerable to attacks from
    the following unsavory individuals:


    +   Computer virus authors. A computer virus is a rogue program that attaches
    to executable programs in such a way the virus “infects” other executable programs
    on the victim’s computer. Many viruses are designed to destroy data as well as
    embarrass the affected user (for example, by posting the user’s documents to the
    Internet with subject headings such as “Child pornography—click here”). When infected,
    executable files are transferred via the Internet, and the chaos spreads.


    +   Script kiddies. Thanks to the proliferation of the necessary scripts by means
    of the Internet, youthful computer enthusiasts—even those lacking in technical
    knowledge—can scan the Internet automatically, looking for poorly protected systems.
    If they find one and are able to gain entry to it, they can use the com-'
  merge: -1
  pgno: 359
- img_proc: true
  md: 'promised system as a launching pad for attacks on other systems—and those affected
    believe that the attack is coming from your network! To do so, the intruder will
    plant trojan horses on your system. A Trojan horse is a program that is named
    after, and functions like, a useful utility. However, it contains code that performs
    malicious functions, such as gathering all the passwords in use on your network
    and sending them to the intruder.


    +   - Crackers. More knowledgeable crackers, may specifically target your system;
    for crackers, it is something of a challenge to try gain entry to a system, especially
    one that is reasonably well-protected. (Note that the popular press uses the term
    hacker to refer to people who break into other computer systems. However, the
    term hacker refers only to a computer enthusiast who enjoys “tweaking” a program
    or network to extract the maximum performance.) Should you become the target of
    a knowledgeable cracker, it is bad news indeed; you would need to be a security
    mastermind to defend a network against the better crackers. Fortunately, there
    is little chance that a cracker would target a low-profile home or small business
    network; in general, they are after bigger fish. From the foregoing, it should
    be clear that every computer network is at risk. You must clearly understand that
    the world contains rather large numbers of people who are not nice; they take
    satisfaction in causing harm to others.


    # Has Your Network Been Compromised?


    You cannot stop all attacks, but at least you can learn about some of the symptoms
    of an attack. In the following sections, you will look at three basic diagnostic'
  merge: -1
  pgno: 360
- img_proc: true
  md: 'tools. While these tools may not seem “high-tech,” they can help you diagnose
    problems more quickly.


    +   **Behavior.** Know your network. Be suspicious when you see something unusual
    happening, such as an unusually slow “high-speed” connection. A cracker may have
    planted a trojan horse on your system that allows him/her to launch an attack
    against someone else.


    +   **Logs.** Linux provides log files for everything how your system loads network
    cards to the amount of time your users are on your system. The log files may contain
    evidence of intrusion attempts.


    +   **Files.** If intruders have managed to place trojan horses on your system,
    there are ways to find out.


    The following sections detail the procedures you can use to determine whether
    your network has been compromised.


    # Examining Network Behavior


    While the following signs do not necessarily mean that you have a problem, they
    could be an indicator of suspicious activity:


    +   **Constant Hard Disk Activity.** This means that you are running too many
    programs relative to your available memory, or someone is trying to read the data
    on your hard drive.


    +   **Constant Network Activity.** On smaller networks, there will be times when
    no one is accessing the Internet. If the lights on your telephone or cable modem
    or DSL adapter still flash during these periods of inactivity, someone may be
    using your network as a base to attack someone else.'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# CHAPTER 16 • SECURING YOUR NETWORK


    Not all strange network activity is a sign of a security problem. There are a
    number of possible causes for slower network connections. Just a few legitimate
    explanations included here.


    +   - Cable modems. If you have a cable modem, others in your neighborhood may
    have just acquired cable modem service and are sharing the capacity (a.k.a. bandwidth)
    of your neighborhood connection to the Internet. Suddenly, your Internet access
    is slower—but it is not because an intruder has gained access to your system.

    - E-mail clients. Some e-mail clients are automatically configured to check for
    new mail as often as once every minute. Even if your users are not working on
    their computers, their computers keep accessing the Internet for mail. You should
    reconfigure the clients so that they check for mail once every half hour or once
    hour.

    - TCP/IP configuration errors. If one of your computers is set up with an IP address
    that is not part of your subnetwork, it will load up your Ethernet network looking
    for other computers. In this case, you would check the IP address assigned to
    each computer. Make sure that all of them are part of the same subnet and that
    they all match what you see in the /etc/hosts files.

    - Problems with exported directories. If you are using NFS or Samba to share directories,
    you may have a problem when the NFS or Samba server is down. Other computers set
    up to connect to an NFS or Samba shared directory may keep trying to connect.
    Your network will be busy as a result. All you can do in this case is reboot the
    server or deactivate Samba or NFS.'
  merge: -1
