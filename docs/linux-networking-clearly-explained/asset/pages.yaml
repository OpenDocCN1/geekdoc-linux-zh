    3. What Linux does with your modem while connecting and disconnecting from the
    Internet. You can configure these settings using the PPP tab.

    4. The account settings required by your Internet Service Provider. You configure
    these using the Accounts tab.


    With the exception of setting up your account, you can rely on the KPPP defaults
