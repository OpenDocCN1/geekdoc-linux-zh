  md: '# # Looking Under the Hood


    To deal with user accounts, file ownership, and permissions, you will make frequent
    use of the utilities discussed in this section. Here is some additional information
    on the options available with these commands.


    # chmod


    This command changes the permissions settings of the filename to the mode. Here
    is the basic command syntax:


    ```

    chmod [ option ] mode filename

    ```


    To specify the *mode*, you can use symbolic or numeric modes. The *filename* can
    be a single file, a shell pattern (using wildcards), or a directory. If you are
    using the symbolic mode, you use the following operators to specify actions:


    +   + Add the specified permission to the existing permissions


    +   = Set the permission to the specified level, erasing all existing permissions


    +   - Remove the specified permission from the existing permissions


    Table 6.7 lists the options you can use with this command.'
