- img_proc: true
  md: 'he/she will not be able to run a malicious program from the intruder''s home
    directory.


    +   - nodev. Prohibits setting up a device such as a peripheral on this partition.
    Keeps crackers from running your hardware.


    +   - nosuid. SUID can be dangerous as it can allow any user root equivalent access
    to critical files.


    +   - ro. Read-only. No one, not even the root user, is allowed to write to a
    read-only partition.


    +   - noauto. Does not automatically mount when you boot Linux. This usually is
    used for the CD-ROM partition, as you do not always have to have a CD in drive.


    +   - user. Anyone is allowed to mount this partition. Useful for CD-ROM drives.


    # Disabling Unused TCP/IP Services


    By default, most Linux versions install a full suite of TCP/IP services, including
    FTP, HTTP (Web), finger, and so on. It is cool to have all these services available,
    but it is not so cool to run them if you are not using them. Intruders may be
    able to gain access to your system through a recently discovered exploit that
    is only available when a user is thoughtlessly running an unused service.


    To disable unwanted TCP/IP services, switch to superuser, launch a text editor,
    and open /etc/servicesall of the services you are not using. You need to run only
    those services for which you are running server daemons.


    When you have finished disabling services, save the file, and restart the inet
    daemon (in Red Hat and Red Hat-derived systems, type /etc/rc.d/init.d/inetd restart
    and press Enter).'
