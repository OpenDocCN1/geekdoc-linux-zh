- fmt: "\nThe official website provides 32-bit and 64-bit ISO files. This book uses\
    \ 32-bit as an example to explain the installation and use. After downloading\
    \ the ISO file, burn the image file to a DVD. Then you can start to install Kali\
    \ Linux to your hard drive.\n\n(1) Insert the installation CD into the CD-ROM\
    \ of the user's computer, restart the system, and you will see the interface.\n\
    (2) This interface is the guiding interface of Kali, and the installation mode\
    \ is selected on this interface. Selecting the `Graphical Install` here will display\
    \ an interface.\n(3) Select the default language of the installation system in\
    \ this interface is `English`, and then click the `Continue` button then the next\
    \ interface will be shown.\n(4) In the interface selection area is `Your country`,\
    \ and then click the `Continue` button, the next interface will be displayed.\n\
    (5) Select the keyboard mode as `English` in this interface, and then click `Continue`\
    \ button, the next interface will be displayed.\n(6) This interface is used to\
    \ set the host name of the system. Here, the default host name `Kali` is used\
    \ (users can also enter the name of their own system). Then click the `Continue`\
    \ button, the next interface will be displayed.\n(7) This interface is used to\
    \ set the domain name used by the computer. The domain name entered in this example\
    \ is `kali.example.com`. If the current computer is not connected to the network,\
    \ you can fill in the domain name and click the `Continue` button. The next interface\
    \ will be displayed.\n(8) Set the root user password on this interface, and then\
    \ click the `Continue` button, the next interface will be displayed.\n(9) This\
    \ interface allows the user to select a partition. Select `Use the entire disk`\
    \ here, and then click the `Continue` button, the next interface will be displayed.\n\
    (10) This interface is used to select the disk to be partitioned. There is only\
    \ one disk in the system, so the default disk is fine here. Then click the `Continue`\
    \ button, the next interface will be displayed.\n(11) The interface requires a\
    \ partitioning scheme, and three schemes are provided by default. Select `Place\
    \ all files in the same partition (recommended for beginners)` and click the `Continue`\
    \ button, the next interface shown will be displayed.\n(12) Select `Partition\
    \ setting ends and write the changes to disk` in the world, and then click `Continue`\
    \ button, the next interface will be displayed. If you want to modify the partition,\
    \ you can select `Undo the modification of the partition settings` in this interface\
    \ to re-partition.\n(13) Select the `Yes` check box on this interface, and then\
    \ click the `Continue` button, the next interface will be displayed.\n(14) Start\
    \ installing the system now. Some information needs to be set during the installation\
    \ process, such as setting up network mirroring. If the computer on which the\
    \ Kali Linux system is installed is not connected to the network, select the `No`\
    \ check box on this screen and click the `Continue` button. Select the `Yes` checkbox\
    \ here and the next interface will be displayed.\n(15) Set the HTTP proxy information\
    \ on this interface. If you do not need to connect to the external network through\
    \ the HTTP proxy, just click the `Continue` button, the next interface will be\
    \ displayed.\n(16) After the scanning mirror site is completed you can go to the\
    \ next option.\n(17) In the country where the image is selected, select `Your\
    \ country` and click `Continue` button, the next interface will be displayed.\n\
    (18) The interface provides 7 mirror sites by default, and one of them is selected\
    \ as the mirror site of the system. Select `mirrors.163.com` here, then click\
    \ the `Continue` button, the next interface will be displayed.\n(19) Select the\
    \ `Yes` check box on this interface, and then click the `Continue` button, the\
    \ next interface will be displayed.\n(20) The installation will continue at this\
    \ time. After the installation, process is finished kali Linux login screen will\
    \ appear.\n\n# Installing kali Linux using a USB drive\n\nThe Kali Linux USB drive\
    \ provides the ability to permanently save system settings, permanently update\
    \ and install packages on USB devices, and allows users to run their own personalized\
    \ Kali Linux. Create a bootable Live USB drive for the Linux distribution on the\
    \ `Win32 Disk Imager`, which includes continuous storage for Kali Linux. This\
    \ section describes the steps to install Kali Linux to a USB drive.\n\nInstalling\
    \ an operating system onto a USB drive is a bit different from installing to a\
    \ hard drive. So, you need to do some preparation before installing. For example,\
    \ where do you get Linux? USB drive format? What is the size of the USB drive?\
    \ These requirements will be listed one by one below.\n\nAfter previous preparations\
    \ are completed, you can install the system. The steps to install Kali Linux onto\
    \ a USB drive are as follows:\n(1) Insert a formatted and writable USB drive into\
    \ the Windows system. After inserting, the display next interface is shown.\n\
    (2) Start `Win32 Disk Imager`, startup interface is shown. In Image File location,\
    \ click the icon to select the location of the Kali Linux DVD image and select\
    \ USB device where Kali Linux will be installed. The device in this example is\
    \ K. After selecting ISO file and USB device, click the `Write` button to write\
    \ ISO file to USB drive.\n(3) Use `UNetbootin` tool to make device K a boot disk.\
    \ Launch `UNetbootin` tool and next interface is displayed.\n(4) Select the `Disc\
    \ Image` checkbox in this interface, then select the location of ISO file and\
    \ set Space used to preserve files across reboots to `4096MB`.\n(5) Select the\
    \ USB drive, the USB drive in this example is K, and then click the `OK` button;\
    \ it will start creating bootable USB drive.\n(6) After the creation is completed,\
    \ the next interface is displayed.\n(7) At this point, USB drive is created successfully.\
    \ In the interface, click the `Restart Now` button, enter BIOS menu and select\
    \ USB boot, you can install Kali Linux operating system.\n\n# Updating and Upgrading\
    \ Kali Linux\n\nWhen users use it for a while, they may be dissatisfied with working\
    \ in a system that does not change, but are eager to upgrade. In addition, Linux\
    \ distributions and kernels are constantly updated. Under such circumstances,\
    \ this section introduces updates and upgrades.\n\nThe specific steps for updating\
    \ and upgrading Kali are as follows:\n(1) Select `Application` | `System Tools`\
    \ | `Software Update` command in the graphical interface, next interface is displayed.\n\
    (2) The interface prompts whether the application should run as privileged user.\
    \ If you continue, click `Continue` button, next interface is displayed.\n(3)\
    \ The interface shows that total packages need to be updated. Click `Install Update`\
    \ button to display interface.\n(4) This interface shows packages that depend\
    \ on. Click the `Continue` button to display interface.\n(5) This interface shows\
    \ the progress of software update. Among them, the package appears behind an icon\
    \ indicating that the package is downloading; if installed successfully, it will\
    \ appear as an icon. At this point, click the `Exit` button and restart the system.\
    \ During update process, downloaded packages will automatically jump to the first\
    \ column.\n(6) After restarting the system, log in to the system and execute `lsb_release\
    \ -a` to view all version information of current system.\n(7) From the output,\
    \ you can see current system version. The above commands apply to all distributions\
    \ including RedHat, SuSE, and Debian. If you only want to view the version number,\
    \ you can execute the command:\n```\nroot@kali:~ cat /etc/issue\n```\n\n# Hacking\
    \ Roadmap\n\nIf a hacker wants to attack a target computer, it cannot be done\
    \ by DOS commands. It also needs some powerful intrusion tools such as port scanning\
    \ tools, network sniffing tools, Trojan making tools, and remote-control tools.\
    \ This section briefly introduces intrusion tools commonly used by hackers.\n\n\
    ### a) Port scanning\nThe port scanning tool has the function of scanning the\
    \ port. The-called port scanning means that the hacker can scan the information\
    \ of the target computer by sending a set of port scanning information. These\
    \ ports are intrusion channels for hackers. Once the hacker understands these\
    \ ports, they can invade the target computer. In addition to the ability to scan\
    \ open ports, the port scan tool also has the ability to automatically detect\
    \ remote target computer security vulnerabilities. Using the port scan tool, users\
    \ can discover various TCP ports on the target computer without leaving traces.\
    \ The port scanning tools commonly used by hackers are `SuperScan` and `XScan`.\n\
    \n### b) Sniffing tool\nA sniffing tool is a tool that can sniff packets on a\
    \ LAN. The-called sniffing is to eavesdrop on all packets flowing through the\
    \ LAN. By eavesdropping and analyzing these packets, you can peek at private information\
    \ of others on the LAN. The sniffing tool can only be used in local area network,\
    \ and it is impossible to directly sniff target computers on the Internet. Data\
    \ sniffing tools commonly used by hackers are `Sniffer Pro` and `Eiffel Detective`.\n\
    \n### c) Trojan making tool\nAs the name suggests, Trojan making tools are tools\
    \ for making Trojans. Since Trojans have the function of stealing personal privacy\
    \ information of the target computer, many junior hackers like to use Trojans\
    \ to make Trojans directly. The Trojan creation tool works basically the same\
    \ way. First, the tool is used to configure the Trojan server program. Once the\
    \ target computer runs the Trojan server program, the hacker can use the Trojan\
    \ tool to completely control the target computer. The operation of the Trojan\
    \ making tool is very simple, and the working principle is basically the same,\
    \ so many junior hackers favor it. Trojan horse making tools commonly used by\
    \ hackers are \"glacial\" Trojans and bundled Trojans.\n\n### d) Remote control\
    \ tools\nRemote-control tools are tools with remote control functions that can\
    \ remotely control the target computer. Although the control methods are different\
    \ (some tools are remotely controlled by implanting a server program, and some\
    \ are used to directly control the LAN), once the hacker uses the remote-control\
    \ tool to control the target computer, the hacker acts as if they were sitting\
    \ in front of it. Remote-control tools commonly used by hackers are network law\
    \ enforcement officers and remote control.\n\n# Hacking Target Computers\n\nIn\
    \ Internet, in order to prevent hackers from invading their own computers, it\
    \ is necessary to understand common methods of hacking target computers. The intrusion\
    \ methods commonly used by hackers include data-driven attacks, illegal use of\
    \ system files, forged information attacks, and remote manipulation.\n\n### 1)\
    \ A data driven attack\nA data-driven attack is an attack initiated by a hacker\
    \ who sends or copies a seemingly harmless special program to a target computer.\
    \ This attack allows hackers to modify files related to network security on the\
    \ target computer, making it easier for hackers to invade the target computer\
    \ next time. Data-driven attacks mainly include buffer overflow attacks, format\
    \ string attacks, input verification attacks, synchronous vulnerability attacks,\
    \ and trust vulnerability attacks.\n\n### 2) Forgery information attack\nForgery\
    \ information attack means that the hacker constructs a fake path between the\
    \ source computer and target computer by sending forged routing information so\
    \ that the data packets flowing to the target computer are passed through the\
    \ hacker, thereby obtaining account information and passwords.\n\n### 3) Information\
    \ protocol\nIn local area network, the IP address source option allows the IP\
    \ packet to choose a path itself. When the hacker attempts to connect to an unreachable\
    \ computer A, he only needs to set the IP address source option in the sent request\
    \ so that the packet reaches the firewall instead of computer A, thus achieving\
    \ a vulnerability attack against the ICMP protocol.\n\n### 4) Remote operation\n\
    Remote operation means that the hacker launches an executable program on the target\
    \ computer. The program displays a fake login interface. When the user enters\
    \ the account and password, the program displays a \"system failure\" message.\
    \ This type of attack is similar to phishing encountered on the Internet.\n\n\
    ### 5) LAN security\nIn local area network, LAN security is one of the most important\
    \ factors. When the system administrator has a mistake in the configuration, these\
    \ mistakes can provide opportunities for hackers. Hackers use these mistakes,\
    \ plus `finger`, `netstat`, etc., to achieve intrusion attacks.\n\n### 6) Resending\
    \ attack\nResending attack means that the hacker collects specific data packets\
    \ and then resends them one by one to the target computer. In the LAN, the redirect\
    \ message can change the router's routing list to propagate the data.\n\n### 7)\
    \ Vulnerability attack\nVulnerability attack for source path means that the hacker\
    \ transmits a source path message to a computer located outside the LAN. The router\
    \ will trust this message and forward the packet to the firewall, where the destination\
    \ address points to the firewall instead of computer A.\n\n# Chapter 2: Bash and\
    \ python scripting\n\nThis chapter will give a good introduction to `bash`, a\
    \ command line interface language, and `python`, a famous programming language.\
    \ By learning `bash` and `python` as a hacker, you can increase your skills exponentially.\n\
    \n### What is a shell?\nIn Windows systems we have a GUI that helps us to run\
    \ programs. Of course, Linux-based systems also consist of a GUI. But apart from\
    \ GUI, Linux-based systems consist of a powerful interface called `shell`, a command\
    \ line interface. Basically, `shell` helps the users to run a program or software\
    \ using a command prompt. `shell` can be executed directly using commands or by\
    \ a file called shell scripts that can be easily created by a text editor or an\
    \ IDE.\n\n### What is UNIX?\nUNIX is an operating system that Linux and many operating\
    \ systems are based upon. Learning about UNIX history can help us learn about\
    \ the importance of `shell` in the programming world.\n\n### What is the bash?\n\
    There are many types of shells. Among them, `bash` is one of the most familiar\
    \ UNIX shells that is simple and can be used to automate many tasks in the system.\n\
    \n### What is a terminal?\nTerminal is just like a browser for websites. It is\
    \ developed for the client and for comfort. People use terminals to type commands\
    \ and start shell processing. Every operating system has a terminal; for example,\
    \ even Windows has a terminal called MS-DOS, which has a lot of difference from\
    \ Linux terminals.\n\n### Looking at a terminal\nLinux terminals are very easy\
    \ to understand. When starting the terminal as user in Kali Linux, we can see\
    \ `user@machine` format. Before going to learn about `bash` in detail, we will\
    \ just go through few examples that explain how `bash` works.\n\n#### 1) echo\n\
    You might have already heard this many times. This just displays whatever is written\
    \ inside the quotes. \n\n#### 2) date\nThis `bash` command displays the present\
    \ date and time. It is used very commonly while scripting.\n```\ndate\nSun Dec\
    \ 23 12:20 PST 2019\n```\n\n#### 3) Cal\nThis will just display the calendar of\
    \ the month you are in. We will give a simple example by creating a shell file\
    \ instead of directly executing the command.\n\n**Step 1:** In the first step,\
    \ open a text editor you wish and create a file named `example.sh` and start writing\
    \ the following lines:\n```\n#!/bin/bash\necho \"This happens in every shell\"\
    \ // This prints as output\n```\nThe first line is the shebang, the second line\
    \ is a comment.\n\n#### **Step 2:** Save the file. In the next step to execute\
    \ the shell script, we need to modify the permission of it. This can be done using\
    \ the following command:\n```\nchmod +x example.sh\n```\nThis will create executable\
    \ permission for the script.\n\n#### **Step 3:** In the last step, we need to\
    \ execute the file in the command to get an output.\n```bash\n./example.sh\n```\n\
    Output:\n```\nThis happens in every shell\n```\n\nWe can use the `clear` command\
    \ to clear everything on the shell.\n```bash\nclear\n```\n\n#### 1) pwd\nThis\
    \ command will print the present working directory that the user is in. You can\
    \ even look at the tree with additional options.\n```\npwd\n/user/rod\n```\n\n\
    #### 2) ls\nThis command will show the contents of the present directory, all\
    \ its files and folders. We normally use it to look at present directory files.\n\
    ```\nls\nshell.py  shell.img  shell.png\n```\n\n#### 3) cd\nThis command is used\
    \ to change the directory. Get ready with the path that you want to navigate to\
    \ and add `cd` before it. You can check whether the directory is changed or not\
    \ by `ls` command.\n```bash\ncd /home/desktop\n```\n\n#### 4) mkdir\nThis command\
    \ can be used to make a new directory or folder.\n```bash\nmkdir new/ruby\n```\n\
    \n#### 5) mv\nThis command helps us move files or folders from one directory to\
    \ another. It follows the following pattern: `mv sourcepath destinationpath`.\n\
    Example:\n`mv example.py code/`\n\n#### 6) touch\nThis is a special command that\
    \ can be used to create a new file of any type in a directory. For example, let's\
    \ create an empty text file called `example.txt`.\n```\ntouch example.txt\n```\n\
    \n#### 7) rm\nThis command helps us remove a file from the disk. This will completely\
    \ delete the file. Use with caution.\n```bash\nrm example.txt\n```\n\n#### 8)\
    \ rmdir\nThis command removes the directory from the disk.\n```bash\nrmdir python\n\
    ```\n\n#### 9) cat\nThis command can be used to read the text file and display\
    \ everything present on the output screen.\n```\ncat rowdy.txt\n```\nOutput:\n\
    ```\nApple\nBat\nCar\nDog\n```\nThis will display everything that is present in\
    \ the `rowdy.txt` file. However, when trying to display a txt file with large\
    \ number of data it can become quite clumsy. So to get rid of this we use the\
    \ below command.\n\n#### 10) less\nThis command displays a huge chunk of data\
    \ one page per time. This will help us by certain gestures. Spacebar can take\
    \ us to the next page whereas b will take us to the previous page.\n```\nless\
    \ rowdy.txt\n```\n\n### 1) Pipelines\nThis explicitly means to give output of\
    \ the first command as input to second command.\n```\ncommand1 | command2\n```\n\
    Where `|` is called a pipe operator.\n\n### 2) Filters\nFilters are an extra technique\
    \ used to separate or organize data. Linux and bash consist of many filter commands\
    \ to find and organize data.\n\n#### a) grep\nThis command helps to find a word\
    \ in a text file easily. The command is as follows:\n```\ngrep raj cricket.txt\n\
    ```\nThis will display everything that matches `raj` in the text file.\n\n####\
    \ b) sort\nThis command will help to sort the contents in the file alphabetically\
    \ or numerically.\nExample for pipelines & filters:\n```bash\ncat animals.txt\
    \ | sort\n```\nOutput:\n```\nCat\nDog\nMonkey\nZebra\n```\n\n### 1) Variables\n\
    Variables are an important piece of memory that stores the data given as input\
    \ or while executing. The data to be processed should contain variables that have\
    \ different types. In short, variable is like an address box and can be modified\
    \ or replaced with another variable if given correct instructions. Bash also consists\
    \ of variables and can be used to write command line instructions that do various\
    \ tasks. Bash variables are quite different from other variables because they\
    \ are of two types.\n\n#### 1) System variables\nThese variables are pre created\
    \ by Linux and can be used while scripting to fill a particular value. These are\
    \ represented by capital letters.\nExample: `USERNAME` -> This variable defines\
    \ the current logged in username. You can call it to get specific output.\n\n\
    #### 2) User variables\nThese are variables which are the user generated and can\
    \ be used for complex tasks. Lower case letters represent these. In bash, variables\
    \ can store any data irrespective of datatype we normally use in programming languages.\n\
    \n#### a) Define a variable\n# Here is the syntax\n```bash\nroom=bad\n```\n\n\
    #### b) To use a variable\n```bash\n$room\n```\n\n#### c) Now you can use this\
    \ command to print the following variable using `echo` command.\n```bash\necho\
    \ $room\n```\nOutput:\n```\nbad\n```\n\n#### d) We can also use this variable\
    \ in a string for printing it. This is quite easy and a very useful function.\n\
    ```bash\necho \"This is $room\"\n```\nOutput:\n```\nThis is bad\n```\n\n# Conditionals\
    \ in the Bash\n\nThis is a normal if else statement that is used in programming\
    \ languages. We will explain this with an example below.\n\n```bash\n# This is\
    \ a bash script to describe conditioning\nif [ 15 -lt 25 ]\nthen\n  echo \"This\
    \ is smaller\"\nfi\n```\nOutput:\n```\nThis is smaller\n```\nIn the above example\
    \ we just explained about an if statement and in the next example we will use\
    \ an example with an else statement too.\n```bash\n# This explains both if and\
    \ elseif\nif [ 35 -lt 25 ]\n```\n"
