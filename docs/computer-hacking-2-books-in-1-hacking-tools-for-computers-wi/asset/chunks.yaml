    # Hacking Tools For Computers

    A Complete Overview on Linux, Including Linux Mint, the First Notions of Linux
    for Beginners and Kali Linux Tools


    ## Introduction

    ![](image81.jpg)

    The following chapters will discuss hacking in detail for beginners. We will introduce
    Linux along with commands that will help us understand better about bash language.
    We will then discuss about various tools in detail that belongs to kali Linux.
    We will now just give a rough introduction to hacking process so that you can
    have a comfortable mindset while reading this book.


    ### Types of hackers

    In my understanding, hackers should be divided into two categories that is positive
    and evil. Decent hackers rely on their own knowledge to help system administrators
    identify vulnerabilities in the system and make the systems Perfect whereas evil
    hackers attack, invade, or do other things that are harmful to the network through
    various hacking skills. As they do things in an unethical way these people are
    called as Crackers instead of hackers.


    Regardless of the type of hacker, their initial learning content will be the same
    as we discuss in this book and the basic skills are the same. Many people ask:
    "What do hackers do in peacetime?” Some people understand hackers as boring and
    repeating humans that do the same work every day. But that is just a misunderstanding.
    Hackers usually need a lot of time to learn. In addition to learning, hackers
    should apply their knowledge to the real world. No matter what kind of work a
    hacker does, the fundamental purpose is nothing more than grasping what they have
    learned in practice.


    The hacker''s behavior mainly includes the following:


    1. **First, learning technology**:

    Once new technologies on the Internet appear, hackers must learn immediately and
    master the technology in the shortest time. The mastery here is not a general
    understanding, but reading about the protocol like `rfc` and gain an in-depth
    understanding of the mechanics of this technology. Once a hacker stops learning,
    he can no more be a hacker.

    The knowledge that primary hackers want to learn is more difficult because they
    have no foundation or any guidance so they have to learn a lot of basic content.
    However, today''s Internet brings a lot of information to readers and can make
    beginners overwhelming. Therefore, beginners can''t be greedy. They should try
    to find a book and their own complete textbooks, and learn step by step. Glad
    you find your book and are going to dive into it in few pages.


    2. **Second, disguise yourself**:

    Every move of the hacker will be recorded by the server, so the hacker must disguise
    himself so that the other party can''t distinguish his true identity. This requires
    skilled skills to disguise his IP address, use the springboard to avoid tracking,
    and clean up the record. It also includes disturbing the other party''s clues
    and cleverly avoiding the firewall.

    Camouflage is a very basic skill that hackers need to be achieved. This is a big
    world for beginners, which means that beginners can''t learn to pretend in a short
    time. So, I don''t encourage beginners to use their own learning. Without Knowledge
    don''t attack the network because once your own behavior is revealed, the ultimate
    harm is on yourself.


    3. **Third, the discovery of vulnerabilities**:

    Vulnerabilities are the most important information for hackers. Hackers should
    often learn the vulnerabilities discovered by others, and try to find unknown
    vulnerabilities themselves, and find valuable and exploitable vulnerabilities
    from a large number of vulnerabilities. Of course, their ultimate goal is to destroy
    or fix this vulnerability through vulnerabilities. The hacker’s obsession with
    finding loopholes is unimaginable. Their slogan says “breaking authority”. A program
    with vulnerability is like a festival for hackers and they would love to mess
    it up to create backdoors.


    4. **Fourth, the use of vulnerabilities**:

    For decent hackers, vulnerabilities should be patched and for evil hackers, vulnerabilities
    should be used to destroy. Hackers’ basic premise is "utilization of vulnerabilities".
    Hackers can use vulnerabilities to do the following:

    - **Obtain system**: Some vulnerabilities can leak system information, expose
    sensitive data, and further invade the system.

    - **Intrusion system**: Can be used to enter through vulnerabilities into the
    system, or obtain internal information, or completely become charge of the server.

    - **Looking for the next goal**: A victory means the emergence of next target,
    hackers should make full use of server they have been in charge as tool to find
    and invade the next.

    - **Do some good things**: The decent hacker will complete the above work and
    fix loophole or notify system administrator to do things to maintain network security.

    - **Do some bad things**: The evil hacker will do the above work. He will determine
    whether server has value, they will implant Trojan or back door on the server
    for the next visit.


    This is just a basic introduction about hacking and we will discuss further in
    future. We will start learning about kali Linux in detail with lot of tools that
    will start the journey. Every effort was made to ensure it is full of as useful
    information as possible, please enjoy!


    # Chapter 1: Introduction to Linux

    You will learn about Linux in detail in this chapter with many examples of its
    distributions. Learning about Linux is necessary because due to its difference
    from windows in various aspects can make normal users confused and moreover learning
    about Linux and some its commands and file system can give a good pathway to the
    rest. We will first describe about Advantages of Linux from windows with a few
    commands that will help us understand the structure and pragmatism of Linux and
    its distributions. We will also go through the process of Installation of Linux
    Mint in detail.


    ### First of all, what is an Operating system?

    The OS is a basic program that runs on a computer. Without this, nothing starts.
    If you are driving a car and you want to turn right, you will turn the steering
    wheel to the right. This allows the tire to turn to right and bend because it
    is too heavy. The same idea as car should be done with computer. Computers are
    machines and they do not understand human language. It only determines electrical
    signal which means that if you try to transmit something that human beings can
    understand to a computer without an OS by keyboard or mouse, nothing is transmitted.
    The computer host is made up of a set of hardware. In order to control these hardware
    resources efficiently, there was operating system. In addition to efficiently
    controlling the allocation of these hardware resources and providing the functions
    needed to run the computer operating systems also provides an environment in which
    programmers can develop software more easily. Operating system is the one that
    handles communication between human and computer. The system can display screens,
    communicate actions coming from a mouse or keyboard to a computer, and actually
    move words and interfaces. Among the operating systems, Windows is famous and
    is published by Microsoft. Linux is also an operating system but which is open
    sourced and can be developed by anyone free of cost. Linux has many distributions
    out of which kali Linux is used by hackers due to its abundant collection of hacking
    tools in the distribution. Whereas Linux Mint a famous Linux distribution and
    is used for daily usage.


    ### Introduction to Linux

    Linux provides a complete operating system with the lowest level of hardware control
    and resource management of complete architecture. This architecture follows the
    good tradition of UNIX for decades and is very stable and powerful. In addition,
    since this excellent architecture can run on the current PC (X86 system), many
    software developers have gradually transferred their efforts to this architecture.
    So due to this reason the Linux operating system also has a lot of applications.
    Although Linux is only the core system and the tools being provided by the core
    structure the integration of the core and the tools with the software provided
    by the software developers makes Linux a more complete and powerful operating
    system.


    ## Why Linux Matters?

    Now that we know what Linux is, let''s talk about what Linux is currently used
    for. Because the Linux kernel is so small and delicate, it can be executed in
    many environments that emphasize power savings and lower hardware resources. Because
    Linux distributions integrates a lot of great software (whether proprietary or
    free), Linux is also quite suitable for the current use of personal computers.
    Traditionally, the most common applications for Linux can be roughly divided into
    enterprise applications and personal applications, but the popularity of the cloud
    computing mechanism in recent years seems to make Linux even more powerful. In
    the below section we explain about the few Applications of Linux in real life.


    ### Utilization of the Enterprise Environment

    The goal of digitalization is to provide consumers or employees with information
    about products (such as web pages) and to integrate data uniformity across the
    enterprise (such as unified account management / File Management Systems). In
    addition, some businesses, such as the financial industry, emphasize key applications
    such as databases and security enhancements have adopted Linux in their environments.


    **Web Server**: This is currently the most popular application for Linux. Inherited
    by the UNIX high stability good tradition, Linux when used for the network function
    is particularly stable and powerful. In addition to this because of the GNU project
    and the GPL model of Linux, many excellent software is developed on Linux. Therefore,
    as a web Server, Mail receiving Server, File transfer Server and so on, Linux
    is absolutely the best choice for its popularity among programmers and network
    engineers. hardware vendors have to specify Linux distributions when launching
    their products.


    **Mission critical applications**: Due to the high performance and low price of
    Linux, it is used for databases and large enterprises in order to fine-tune their
    own machines and computers.


    **Academic institutions**: Academic institutions often need to develop their own
    software so the operating system is a development environment. For example, Harvard
    University of Science and technology, needs this kind of environment to make some
    graduation.


    ### Why Linux is better than windows for?

    1. **Open source**: Open source is the software whose content is open to the public.
    Some can even be modified if you have skills and can redistribute them. Linux
    is free unlike windows which charges a lot of money.

    2. **Freedom**: Hackers need freedom. Linux is free anyway. The content of the
    program is open and you can freely go around. Freedom is great. You can make adjustments
    as like. Windows restricts its users in many areas.

    3. **Used in servers**: Not only that Linux is free but it is also lightweight
    and can work well when combined with server. Red hat the famous server Many hosting
    companies and websites use Linux for their servers and being a hacker who follows
    client model to attack targets Linux is very convenient and flexible.

    4. **Many types**: The best thing about Linux is the number of choices you can
    make in the form of distributions, which we will explain in next sections. Hackers
    can use distributions like Kali and Parrot which are preinstalled with hacking
    tools to enhance their performance.

    5. **Light**: Linux Operating system is very light and will go through very lags
    and power shutdowns when compared to windows. As a hacker, we have to do a lot
    of work in different terminals.

    6. **Stable Operation**: However, Linux actually works quite stably. Network functions
    and security are well thought out so you can have something strong. Being able
    to use it at ease is also a feature of Linux. In fact, many corporate sites and
    web services are running on Linux.


    # Introduction to Linux commands

    Linux is an operating system that serves on command interface. When Linux was
    created, Arch Linux was famous for its environment and is mostly based on terminal
    interface. However, after the entry of windows people started getting more inclined
    to Graphical interfaces so Debian system has risen to a popularity. Although deviating
    from its sole purpose for users wish Linux is still known and operated by network
    engineers using terminal.


    1. **ls**: The `ls` command, which stands for "list segments," displays file and
    directory information. It has been installed since the very first command of UNIX,
    a very old command and a predecessor to Linux. It is one of the most used commands
    among Linux commands.

    ```

    ls

    ```

    Tapping will display a list of files and folders in the current directory.


    2. **cp**: The `cp` command is an abbreviation of "copy" and is a command to copy
    a file as it is. Below we have an example.

    ```

    cp firstfile.txt copyfile.txt

    ```

    This completes the copy of the text file.


    3. **mv**: The `mv` command is an abbreviation of "move" and is a move command.
    It moves files and directories. For example, if you want to move secondfile to
    the example directory:

    ```

    mv secondfile example/secondfile

    ```

    This completes the move.


    4. **rm**: The `rm` command is an abbreviation of "remove" and is a command for
    deletion. It Deletes files and directories. You only need to specify the file
    name following `rm`. For example, to delete `example1.dat` in the current directory,
    the command is as follows:

    ```

    rm example1.dat

    ```


    5. **echo**: That''s all there is to display a string on the screen. If you see
    the word Jesus On your screen then this is the command that have been used.

    ```

    echo Jesus

    ```


    6. **chmod**: Before discussing about the usage of this command, we need to know
    a little about the permissions in the Linux operating system.

    What are permissions?

    Permissions are the settings of file and directory permissions that are handled
    by UNIX including Linux. Files and directories can be set depending on the owner,
    group, and other three types of access, whether they can be executed and be changed
    in writing, or by read. For example, the executable file `example.sh` in a directory
    can only be executed by the owner. Changes in content can be made to the owner
    and the group. You can configure multiple settings for one file or directory such
    as denying access to all other users.

    If you want to set the access of `example.sh` in the test folder so that all users
    have all rights, it is as follows:

    ```

    chmod 777 test/example.sh

    ```


    7. **find**: `find` is exactly the search command. Searches for files and directories.
    For example, to search for `ram.dat` in war directory you need to use the following
    command.

    ```

    find ./war/ram.dat

    ```


    8. **cd**: Before diving into learning about this command there is a necessity
    to learn how directories are arranged. Linux is based on hierarchical structure,
    moving directories and working directories. Different type of directories are
    explained below:

    a) **Current Directory**: Points to the directory you are working with.

    b) **Root Directory**: If it is a directory at the top level of disk then it is
    called root directory.

    c) **Home Directory**: The home directory of all users (except root) is a bit
    like Win7''s users or XP''s "Documents and Settings". Each new user is assigned
    a corresponding set of subdirectories. Regardless of which directory you are currently
    in, you can use `cd ~` to go back to your home directory. The root directory of
    root is `/root`, which is a special place.


    9. **kill**: `kill` is a command to kill the running process. It can be used to
    terminate a process that is performing unusual operation. In addition it is used
    to stop the operation on the computer by regular expression. example:

    ```

    kill 224

    ```


    10. **ifconfig**: `ifconfig` command is very useful when doing wireless attacks.
    We can find a lot of information about adapters, routers and wireless devices.
    For example:

    ```

    ifconfig wlan0

    ```


    11. **mount**: `mount` is a command to mount or operate disk device embedded in
    Linux directory. Today, disk devices are widely used such as CDs, DVDs, Blu-ray
    discs, external hard disks, USB memories and like Disk devices called file systems
    in Linux. All of them can be configured for use with `mount` command.

    ```

    mount

    ```


    12. **ping**: `ping` is a command to check if the connection to computer on the
    network is properly connected. Hackers normally use it in initial stages to check
    whether a service is running or not.

    ```

    ping 192.232.2

    ```


    13. **ssh**: `ssh` is a command to access external computer. There is `telnet`
    command that performs the same function but in `ssh` since all communication contents
    are encrypted, more secure communication is possible.

    ```

    ssh 192.232.2

    ```


    14. **ftp**: `ftp` is a Linux command that connects to FTP server, uploads files,
    and changes permissions. The main use would be to upload website. Usually you
    will often use FTP client software to operate the FTP server. However, keep in
    mind that there are cases where it is more efficient to operate with Linux commands
    in some cases. For example, to connect and FTP server with address:

    ```

    ftp 192.232.3

    ```


    # Linux Mint and its Legacy

    Linux Mint is a famous Linux distribution that is used for daily usage. It is
    very famous and has been downloaded more than a million times by the internet
    users. It is said to be lightweight and can process things fast when compared
    to other famous Linux distributions. Linux is also known for its versatility regarding
    the workspace management. Below section explains how to install Linux Mint with
    sequential steps, which can be used as a reference for other distributions too.


    ## Installation of Linux Mint

    In this section below, we will take you through definite steps, which will help
    you Install Linux Mint in your system. This section will be dealt in a way such
    that you can install any other Linux distribution in the same way. For installation
    of every Linux distribution, you need to remember certain important things that
    will help to make the installation process easier. Below we explain the things
    that are essential for any Linux distribution installation.


    1. **Boot Media (BIOS)**: Always before getting ready to install get ready with
    a bootable CD or USB to get the Iso file into it. Always look at BIOS settings
    of your hardware for no hiccups further. After selecting the desired Boot option
    installation screen will appear.

    2. **Language Selection**: The next option usually will be of selecting your desired
    language. By using keyboard, you can select your desired language.

    3. **Software selection**: The next option usually will be of selecting the type
    of install between full install and default install. This option differs from
    distributions because some doesn''t offer light.

    4. **Disk partition**: This comes the most important thing in the installation
    process because messing up with option may make things really messy. Always look
    at hard disk and options available before moving forward with the option. Know
    the difference between single boot and dual partition.

    5. **Remaining stuff**: This contains network and time settings along with setup
    of password to the operating system. Even after the installation, you need to
    set up few options like firewall.


    ### Step 1: Making Bootable Install

    We have just given a good overview. People often get confused when choosing bootable
    device, use `Unetbootin` or `Iso`. The above process will run for some time depending
    on the length of time and speed.

    2.0 can write at a speed less than 10 mb, 3.0 can write at a speed about 50 mb,
    so wait for few minutes to finish. After writing, the USB can be used for booting
    and installing Linux. After adjusting the sequence of Boot devices in BIOS, your
    host computer can be used to boot up. Sometimes you may face errors like “computer
    does not support this” CD error, then I suggest you carefully check whether hardware
    overclocked? Or anything. use of GPT partition tables.


    ### Step 2: Starting the installation

    In Linux Mint installation process, all selection process in the form of has been
    centralized in the first page. You can see all the settings in the same screen,
    you can also jump to modify various settings, not restricted to one. Let''s talk
    about how each option should be setup. Click the "date and time" in the settings
    and you can choose time zone directly on the world map, or choose your city from
    drop-down menu of region. If the date and time are not correct, you can change
    them. After the time zone is selected, click on keyboard configuration. This is
    very important because people often have to type in foreign language; we often
    switch between English and other languages. We used to use either `CTRL + blank`
    or `CTRL + Shift` for older versions, but this version window interface doesn''t
    support that so here we must in advance set up bit more appropriate option. After
    confirmation, you can press the finish button. Since we are booting on CD and
    not set up the network, the CD (device where is located) will be selected by default.
    If you have disk file system known to other installers on your host, the disk
    may also contain mirror file, so mirror file can also provide installation of
    the software.


    ### Step 3: Selection of the Graphical interface

    Normally Linux is said to be command line work environment we need to select a
    graphical interface system, which will further continue on our usage. Nowadays
    people making things easy by installing their workspaces depending on their hardware.
    For example, Manjaro a famous distribution offers both GNOME and KDE bootable
    USB for a better selection of the users. There are different types of GUI systems
    as explained below:


    **A server with a GUI**: GUI is the graphical user interface. GNOME is the default
    every distribution offers as is lightweight.

    **GNOME desktop environment**: A common and famous graphical interface for Linux.
    It also is very lightweight and will have less lags.

    **KDE PLASMA WORKSPACES**: Another set of graphical interface system for high-end
    systems, which can handle high workload.


    Select the desired Graphical interface in the installation box and after the selection
    is finished, press finish and the installer will start checking the disc for the
    presence of the software of your choice and resolve software dependency check
    (that is, load all the other supporting software under the big project of your
    choice).


    ### Step 4: Disk Partition

    Then there is our main event, is the disk partition. Select the hard disk on which
    you want to install Linux and select manual partition mode. Since there are two
    hard disks in the system, you need to select the right disk to install it successfully.
    So as indicated, the check mark will appear after clicking on it! Because we want
    to learn how to partition so not let the system automatically partition and please
    click "I will configure partition" button. You''ll find an operating system name.
    Click on that name (your system may not have this project, or it may have other
    projects! However, if it''s a new hard drive, you can skip this section). To remove
    the partition, Click `/boot`, `/swap`, and then click the minus sign at the third
    arrow. Delete when the warning window will appear as follows. If all goes well,
    then you should be able to see the following icon that says success.


    ### Step 5: Root password and creating a user

    Now the installation screen is quite simple, omitting a bunch of steps. After
    the above screen is pressed to start the installation, you can save time by installing
    the system and setting up other projects at the same time. Now there are two other
    important events to deal with, one is the root password, and the other is the
    creation of an ordinary identity user. Basically, you can set any password wish
    for. If not, the screen will automatically help you determine if password is set
    properly. After the administrator password has been set up you still have to create
    a regular account. we use special instructions like `sudo` to switch to administrator
    and create regular account.


    ### Step 6: Entering into Linux Mint

    After the successful installation of Linux Mint just go through the Menu and settings
    of the system. You can find many utilities and libre office for good optimization.
    If you are not comfortable using the terminal, you can use the tab to find which
    is, for, the text editor, which is, to go to the terminal.

