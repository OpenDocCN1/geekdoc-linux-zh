    \ \"crack module\" is recorded in the `[List.External:******]` area of the `JOHN.INI`\
    \ file.\n  - Example: `john -external:double passwd`\n- `-stdout[:LENGTH]`:\n\
    \  - Description: This option has nothing to do with the crack, just simply display\
