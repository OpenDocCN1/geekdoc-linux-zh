    the crawl proxy settings, the form submission settings, the application login
    settings, the spider engine settings, and the request header settings.5 Use of
    the Burp scannerBurp Scanner''s function is mainly used to automatically detect
    various vulnerabilities in web systems. We can use Burp Scanner instead of manually
    performing penetration testing of common vulnerability types on the system, so
    that we can put more energy into those that must be manually Verify the vulnerability.Scanner''s
    scanning methods are divided into two types, active scanning and passive scanning.1\.
    Active scanning (Active Scanning)When using the Active Scan mode, Burp sends a
    new request to the application and verifies the vulnerability through the payload.
    The operation in this mode generates a large amount of request and response data,
    which directly affects the performance of the system and is usually used in non-production
    environments. It has a good scan effect on the following two types of vulnerabilities:1
    client vulnerabilities, like XSS, Http header injection, operation redirection.2
    server-side vulnerabilities, like SQL injection, command line injection, file
    traversal.For the first type of vulnerability, Burp will submit the input field
    when it detects it, and then parse it based on the response data. During the detection
    process, Burp will modify the basic request information, that is, modify the parameters
    according to the characteristics of the vulnerability, and simulate the behavior
    of the person to achieve the purpose of detecting the vulnerability. For the second
    type of vulnerability, detection is generally more difficult because it occurs
    on the server side. For example, SQL injection may return a database error message,
    or it may be nothing. In the detection process, Burp uses various techniques to
    verify the existence of vulnerabilities, such as induction time delay, forced
    modification of Boolean values, and comparison with the results of fuzzy tests,
    and has reached a highly accurate vulnerability scan report.2\. Passive scanning
    (Passive Scanning)When using passive scan mode, Burp will not resend new requests.
    It only analyzes existing requests and responses. This is safer for system detection,
    especially if you are authorized to access it. Generate a detection of the environment.
    In general, the following vulnerabilities are easily detected in passive mode:1)
    The submitted password is unencrypted plaintext.2)  Unsafe cookie properties,
    such as missing HTTP Only and security flags.3) The scope of 3 cookies is missing.4) 
    cross-domain scripting and site reference leaks.5) Form values are automatically
    populated, especially passwords.6) SSL protected content cache.7)  Directory listings.8) 
    The response is delayed after the password is submitted.9) Insecure transmission
    of 9session tokens.10) Sensitive information leaks, such as internal IP addresses,
    email addresses, stack traces and other information leaks.11) Unsafe View State
    configuration.12) Error or non-standard Content-type directives.Although the passive
    scanning mode has many shortcomings compared to the active mode, it also has the
    advantages that the active mode does not have. In addition to the above-mentioned
    detection of the system is safer within the scope of our authorization, when testing
    a certain business scenario when each test leads to a certain aspect of the business,
    we can also use the passive scan mode to verify the existence of the problem and
    reduce the risk of testing.Scanner''s specific steps1\. Passive scanningIn the
