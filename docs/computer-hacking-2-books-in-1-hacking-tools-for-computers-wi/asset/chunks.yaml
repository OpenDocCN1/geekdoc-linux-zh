    just displays whatever written inside it as the output.$echo  '' That''s a good
    bash terminal''output:That''s a good bash terminal2) dateThis bash command displays
    the present date and time as output. This is used very commonly while doing scripting.$dateOutput:Sun
    Dec 20 23:32:12 PST 20193) Calendar$calThis will just display the calendar of
    the month that you are in.We will give a simple example by creating a shell file
