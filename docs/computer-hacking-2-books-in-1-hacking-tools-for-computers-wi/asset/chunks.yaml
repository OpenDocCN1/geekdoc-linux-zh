    used to assess potential vulnerabilities.07-Reverse Engineering:The so-called
    reverse engineering is to reverse the execution of the archives, or to track the
    execution process, to exploit the existing loopholes, to change the program functions,
    or to install a controllable back door. For example, some systems are client/server
    and web hybrid applications, and even call Web services. In order to understand
    the call mechanism on the client side, use reverse translation. Or Debug mode
    to find the entry point or connection string of the call. Another use of reverse
    engineering is digital identification. When the system is implanted in the back
    door, in order to trace the connection source or anti-intrusion, the defender
    may also crack the back-door function through reverse engineering to carry out
    counter-action.8 - ExploitingWhen Vulnerabilities are found and when these vulnerabilities
    can be manipulated, the hackers will not be satisfied. Instead, they will try
    to control the target through the vulnerability. There are many ways to exploit
    the vulnerability, and look at the intruder''s skill and purpose. However, you
    must be cautious when conducting penetration testing, so as not to be self-defeating.9-Sniffing/spoofing:When
    the system has proper protection and the application cannot find exploitable vulnerabilities,
