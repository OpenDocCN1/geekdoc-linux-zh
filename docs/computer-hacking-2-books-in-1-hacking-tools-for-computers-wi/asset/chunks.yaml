    # 计算机黑客工具

    Linux 完整概述，包括 Linux Mint、Linux 入门基础以及 Kali Linux 工具


    ## 介绍

    ![](img/image81.jpg)

    接下来的章节将为新手详细讨论黑客技术。我们将介绍 Linux 以及有助于我们更好地理解 bash 语言的命令。然后我们将详细讨论属于 Kali Linux
    的各种工具。现在我们只是对黑客攻击流程进行简要介绍，以便你在阅读本书书时有一个良好的心态。


    ### 黑客的类型

    在我理解中，黑客应该分为两类：正面的和邪恶的。正直黑客依靠自己的知识帮助系统管理员识别系统中的漏洞并使系统变得完美；而邪恶的黑客则通过各种黑客技能对网络进行攻击、入侵或其他对网络有害的行为。由于他们以不符合道德的方式行事，这些人被称为“破解者”（Crackers）而不是黑客。


    无论黑客是什么类型，他们的初始学习内容将与我们在书中讨论的相同，基本技能也是相同的。许多人问：“黑客在和平时期做什么做什么？”有些人认为黑客是每天做重复性工作的、无聊枯燥的人类。但这只是一个误解。黑客通常需要大量的时间来学习。除了学习，黑客应该将他们的知识应用到现实世界中。无论黑客做什么工作，其根本目的无非是在实践中掌握他们所学的。


    黑客的行为主要包括以下几点：


    1. **首先，学习技术**：

    一旦互联网上出现新技术，黑客必须立即学习并在最短时间内掌握该技术。这里的精通不是泛泛的理解，而是阅读如 `rfc` 之类的协议，并深入理解该技术的机制。一旦黑客停止学习，他就不再是一个黑客了。

    初级黑客想要学习的知识要困难得多，因为他们没有基础或任何指导，所以他们必须学习大量的基础内容。然而，今天的互联网给读者带来了大量信息，可能会让新手感到无所措。因此，新手不能贪心。他们应该尝试找一本书和自己完整的教材，循序渐进地学习。很高兴你找到了自己的书并准备在几页后深入研究。


    2. **其次，伪装自己**：

    黑客的每一个动作会被服务器记录，所以黑客必须伪装自己，让对方无法区分他的真实身份。这需要高超的技巧来伪装 IP 地址、使用跳板避免追踪并清理记录。它还干扰对方的线索并巧妙地避开防火墙。

    伪装是黑客需要的一种非常基本的技能。对于新手来说，这是一个巨大的世界，意味着新手无法在短时间内学会伪装。因此，我不鼓励新手仅凭直觉学习。在没有知识的情况下不要攻击网络，因为一旦你的行为被暴露，最终的伤害将来自你你自己。


    3. **第三，发现漏洞**：

    漏洞是对黑客来说最重要的信息。黑客应该经常学习他人发现的漏洞，并尝试自己发现未知的漏洞，从大量的漏洞中发现有价值且可利用的漏洞。当然，他们的终极目标是通过漏洞来破坏或修复这些漏洞。黑客对寻找漏洞的痴迷程度是无法想象的。他们的口号是“打破权威”。一个有漏洞的程序对黑客来说就像一个节日，他们会喜欢搞乱它以创建后门。


    4. **第四，利用漏洞**：

    对于正直的黑客，漏洞应该被修补；对于邪恶的黑客，漏洞应该被用来破坏。黑客的基本前提是“利用漏洞”。黑客可以使用漏洞完成以下操作：

    - **获取系统**：某些漏洞可以泄露系统信息、暴露敏感数据并进一步入侵系统。

    - **入侵系统**：可以利用漏洞进入系统，或获取内部，或完全控制服务器。

    - **寻找下一个目标**：胜利意味着下一个目标的出现，黑客应该充分利用他们控制的服务器作为工具来寻找和入侵下一个目标。

    - **做一些好事**：正直的黑客会完成上述工作并修复漏洞或通知系统管理员维护网络安全。

    - **做一些坏事**：邪恶的黑客会执行上述工作。他会判断服务器是否有价值，并在服务器上植入木马或后门以便下次访问。


    这只是关于黑客技术的简单介绍，我们将在将来进一步讨论。我们将开始详细学习 Kali Linux，通过大量工具开启这段旅程。我们已尽力确保它包含了尽可能有用的信息，请尽情享受！


    # 第 1 章：Linux 简介

    你将在这一章中详细学习 Linux，并包含许多发行版的示例。学习 Linux 是必要的，因为因为它在各个方面与 Windows 的不同会让普通用户感到困惑，而且学习
    Linux 及其某些命令和文件系统可以为后续内容提供良好的路径。我们首先通过几个命令描述 Linux 相比于 Windows 的优势，这将有助于我们理解 Linux
    及其发行版的结构和实用性。我们将详细介绍 Linux Mint 的安装过程。


    ### 首先，什么是操作系统？

    操作系统是运行在计算机上的基础程序。没有它，什么都不会启动。如果你在开车并想右转，你会向右转动方向盘。这让轮胎向右转并弯曲，因为它们太重了。计算机应该像汽车一样。计算机是机器，它们不理解人类语言。它们只确定电信号，这意味着如果你尝试通过键盘或鼠标向没有操作系统的计算机传输人类可以理解的内容，那么什么东西都不会被传输。计算机主机由一组硬件组成。为了有效地控制这些硬件资源，操作系统诞生了。除了高效控制这些硬件资源的分配和提供运行计算机操作系统所需的功能外，操作系统还提供了一个让程序员可以更容易开发软件的环境。操作系统是处理人机通信的。系统可以显示屏幕，将来自鼠标或键盘的动作传递给计算机，并实际移动文字和界面。在操作系统中，Windows
    是著名的，由微软发布。Linux 也是一种操作系统，但它是开源的，任何人都可以免费开发。Linux 有许多发行版，其中 Kali Linux 被黑客使用，因为它拥有丰富的黑客工具；而
    Linux Mint 是一个著名的发行版，用于日常使用。


    ### Linux 简介

    Linux 提供了一个具有最低级别硬件控制和资源管理的完整操作系统。这种架构遵循 UNIX 传统，几十年来非常稳定且强大。此外，由于这种优秀的架构可以在当前的
    PC (x86) 上运行，许多软件开发者逐渐转向这种架构，使得 Linux 更加完整和强大。


    ## 为什么 Linux 重要？

    现在我们知道了 Linux 是什么，让我们谈谈它的用途。因为 Linux 内核非常小且精细，它可以在许多环境中执行并节省硬件资源。由于 Linux 发行版集成了大量软件（无论是专利还是免费），也非常适合个人电脑。Linux
    最常见的应用可以大致分为企业应用和个人应用，在下面的章节中解释 Linux 的应用。


    ### 企业环境的应用

    数字化的目标是为消费者提供有关企业的信息（例如网页），并实现统一的账户管理（例如文件系统）。此外，一些行业（如金融业）采用了 Linux 以增强安全。


    **Web 服务器**：

    这是 Linux 目前最流行的应用。它继承了 UNIX 的良好传统，非常稳定且强大。此外，由于 GNU 项目和 GPL 模型，许多优秀软件都是在 Linux
    上开发的。因此，作为 Web 服务器、邮件服务器和文件传输服务器，Linux 是绝对的最佳选择。


    ### 为什么 Linux 比 Windows 更好？

    **学术机构**：

    学术机构经常需要开发他们自己的软件。例如，哈佛大学的科学就需要这种环境来毕业。


    # Linux 命令介绍

    Linux 是一个在命令行界面（终端）运行的操作系统。在 Linux 被创建时，Arch 是一个著名的环境，基于终端界面。然而，在 Windows 之后，人们倾向于使用
    Debian 系统。因此，我们需要了解 Linux 的命令。每个新用户被分配一组相应的子目录。无论你当前在哪个目录，都可以使用 `cd ~` 回到主目录。root
    的根目录是 `/root`，这是一个特殊的地方。


    1. **ls**：`ls` 命令列出文件和目录信息。它是 UNIX 的第一个命令，是 Linux 命令中最常用的命令之一。

    ```

    ls

    ```

    显示当前目录下的文件列表。


    2. **cp**：`cp` 命令是“copy”的缩写，用于复制文件。如下：

    ```

    cp firstfile.txt copyfile.txt

    ```

    完成文件的复制。


    3. **mv**：`mv` 命令是“move”的缩写，是移动命令。例如，如果你想将 secondfile 移动到 example 目录：

    ```

    mv secondfile example/

    ```

    完成移动。


    4. **rm**：：`rm` 命令是“remove”的缩写，用于删除。它删除文件和目录。例如，在当前目录下删除 example1.dat：

    ```

    rm example1.dat

    ```


    5. **echo**：`echo` 是在屏幕上显示字符串的命令。如果你在屏幕上看到单词 Jesus，那么就是这个命令。

    ```

    echo Jesus

    ```


    6. **chmod**：

    在讨论该命令的使用之前，我们需要了解一点 Linux 操作系统的权限。

    什么是权限？

    权限是文件和目录的设置，由 UNIX 处理。可以根据所有者、组和其他类型设置文件或目录的访问，是否可以执行、写入或读取。例如，如果你想设置 test 文件夹中
    example.sh 的权限，让所有用户拥有所有权限如下：

    ```

    chmod 777 test/example.sh

    ```


    7. **find**：`find` 确是搜索命令。搜索文件和目录。例如，在 war 目录中搜索 ram.dat 需要使用以下命令：

    ```

    find ./war/ram.dat

    ```


    8. **cd**：

    在深入学习该命令之前，有必要了解目录是如何排列的。Linux 基于分级结构移动目录和工作目录。下面解释不同类型的目录：

    a) **当前目录**：指向你正在工作的目录。

    b) **根目录**：如果目录位于磁盘的顶层，则被称为根目录。

    c) **主目录**：所有用户（除 root 外）的主目录类似于 Win7 的 users 或 XP 的 "Documents and Settings"。每个新用户被分配一组相应的子目录。无论你当前在哪个目录，都可以使用
    `cd ~` 回到主目录。


    9. **kill**：`kill` 是一个杀死运行进程的命令。它可以终止执行异常操作的进程。此外，它还通过正则表达式停止在计算机上的操作。例如：

    ```

    kill 224

    ```


    10. **ifconfig**：`ifconfig` 命令在进行无线攻击时非常有用。我们可以找到关于适配器、路由器和无线设备的很多信息。例如：

    ```

    ifconfig wlan0

    ```


    11. **mount**：`mount` 是一个挂载或操作嵌入 Linux 目录设备的命令。今天，磁盘设备被广泛使用，如 CD、DVD、蓝光光、外硬盘、USB
    内存以及 Linux 中被称为文件系统的设备。它们都可以配置使用 `mount` 命令。

    ```

    mount

    ```


    12. **ping**：`ping` 是检查网络上计算机是否连接良好的命令。黑客通常在初始阶段用它检查服务是否正在运行。

    ```

    ping 192.232.2

    ```


    13. **ssh**：`ssh` 是访问外部计算机的命令。`telnet` 命令执行相同的功能，但在 `ssh` 中由于所有通信内容都是加密的，可以进行更安全的通信。

    ```

    ssh 192.232.2

    ```


    14. **ftp**：`ftp` 是一个连接到 FTP 服务器、上传文件并更改权限的 Linux 命令。主要用途将上传网站。通常如下：


