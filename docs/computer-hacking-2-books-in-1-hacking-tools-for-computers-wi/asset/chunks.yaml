    function, and runs in a completely isolated environment. The work that can be
    done on the physical machine can be implemented in the virtual machine. Because
    of this, more and more people are using virtual machines.When you create a new
    virtual machine on a computer, you need to use part of the hard disk and memory
    capacity of the physical machine as the hard disk and memory capacity of the virtual
    machine. Each virtual machine has its own CMOS, hard drive and operating system.
    Users can partition and format the virtual machine, install operating system and
    application software, just like a physical machine.The Java Virtual Machine is
    an imaginary machine that is typically implemented by software simulation on a
    real computer. The Java virtual machine has its own imagined hardware, such as
    processors, stacks, registers, etc., and has a corresponding instruction system.
    The Java virtual machine is mainly used to run programs edited by Java. Because
    the Java language has cross-platform features, the Java virtual machine can also
    directly run programs edited in Java language in multiple platforms without modification.
    The relationship between the Java virtual machine and Java is similar to the relationship
    between Flash Player and Flash.There may be users who think that the virtual machine
    is just an analog computer, and at most, it can perform the same operations as
    a physical machine, so it does not have much practical significance. In fact,
    the biggest advantage of a virtual machine is virtualization. Even if the system
    in the virtual machine crashes or fails to run, it will not affect the operation
    of the physical machine. And it can also be used to test the latest version of
    the application or operating system, even if the installation of the application
    with the virus Trojan is no problem, because the virtual machine and the physical
    machine are completely isolated, the virtual machine will not leak in the physical
    machine data.VMware is a well-known and powerful virtual machine software that
    allows users to run two or more Windows and Linux systems simultaneously on the
    same physical machine. Compared with the "multi-boot" system, VMware adopts a
    completely different concept. Multiple operating systems of a physical machine
    can only run one of the systems at the same time. The switching system needs to
    restart the computer, but VMware is different. It is the same. Multiple operating
    systems can be run at any time, thus avoiding the hassle of rebooting the system.The
    VMware installer can be downloaded from some common resource offering sites such
    as filehippo.com. After downloading the VMware installer, you can extract and
    install it. After the installation is successful, the corresponding shortcut icon
    will be displayed on the desktop.The following describes the steps to create a
    new virtual machine in VMware.STEP01:Start VMware Workstation by using the GUI
    interface.STEP02:Select a new virtual machineSTEP03:Select the configuration typeSTEP04:Select
    to install the operating system laterSTEP05:Select the guest operating systemSTEP06:Set
    the virtual machine name and installation locationSTEP07:Specify virtual machine
    disk capacitySTEP08:Click the "Finish" buttonInstallation of Kali LinuxNowadays,
    the installation process of Linux has been very "foolish", and the installation
    of the entire system can be completed with a few mouse clicks. The installation
    of the Kali Linux operating system is also very simple. This section describes
    the detailed process of installing Kali Linux to hard drive, USB drive. We will
    explain how to upgrade tools in the next section.Installing to a hard drive is
    one of the most basic operations. The implementation of this work allows users
    to run Kali Linux without using a DVD. Before you install this new operating system,
    you need to do some preparatory work. For example, where do you get Linux? What
    are the requirements for computer configuration? ... These requirements will be
    listed one by one below.'
