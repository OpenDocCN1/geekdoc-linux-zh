  trans: "\n`crunch` 命令的常用选项如下。\n\n- `-o`: 用于指定输出字典文件的位置。\n- `-b`: 指定写入文件的最大字节数。该大小可以用\
    \ KB、MB 或 GB 为单位，但必须与 `-o` 选项配合使用。\n- `-t`: 设置使用的特殊格式。\n- `-l`: 当 `-t` 选项指定 `@`、`%`\
    \ 或 `^` 时，此选项用于识别占位符的字符。\n\n### (2) 创建密码列表文件并保存到桌面\n生成的密码列表最小长度为 8，最大长度为 10，并使用\
    \ `ABCDEFGabcdefg0123456789` 作为字符集。执行命令如下：\n\n```bash\nroot@kali:~# crunch 8 10\
    \ ABCDEFGHIJKLMabcdefghijklm0123456789 –o /root/Desktop/\n```\n\n从上面的输出信息可以看出，将生成一个\
    \ 659 TB 的文件，总共 661,552,638,197,716 行。执行上述命令后，桌面上将生成一个名为 `generatedCrunch.txt`\
    \ 的字典文件。由于组合生成的密码很多，因此需要很长时间。\n\n### (3) 打开字典文件\n生成上述密码字典文件后，使用 `nano` 命令打开它。执行命令如下：\n\
    \n```bash\nroot@kali:~# nano /root/Desktop/generatedlist.txt\n```\n\n执行上述命令后，将打开\
    \ `generatedlist.txt` 文件。所有使用 `crunch` 命令生成的密码都保存在此文件中。\n\n# rtgen\n`rtgen` 工具用于生成彩虹表（rainbow\
    \ tables）。彩虹表是针对各种可能的字母组合的预计算哈希值的巨大集合。彩虹表并不一定适用于 MD5 算法。有多种算法，它可以快速破解各种密码。密码越复杂，彩虹表越大，现在主流的彩虹表为\
    \ 100G 或更大。\n\n使用 `rtgen` 工具生成彩虹表。具体步骤如下：\n\n### (1) 切换到 `rtgen` 目录\n执行命令如下：\n\
    \n```bash\nroot@kali:~# cd /usr/share/rainbowcrack/\n```\n\n### (2) 使用 `rtgen`\
    \ 命令\n基于 MD5 生成彩虹表。执行命令如下：\n\n```bash\nroot@kali:/usr/share/rainbowcrack# ./rtgen\
    \ md5 loweralpha-numeric 1 5 0 3800 33554432 0\n```\n\n上面的信息显示了彩虹表的参数和生成过程。例如，生成的彩虹表文件名为\
    \ `.md5_loweralpha-numeric#1-5_0_3800x33554432_0.rt`；该表使用 MD5 哈希算法进行加密，并使用了字符集\
    \ `abcdefghijklmnopqrstuvwxyz0123456789`。\n\n### (3) 排序彩虹表\n为了方便使用生成的彩虹表，使用 `rtsort`\
    \ 命令对表进行排序。执行命令如下：\n\n```bash\nroot@kali:/usr/share/rainbowcrack# rtsort md5_loweralpha-numeric#1-\
    \ 5_0_\n```\n\n# John the Ripper\n这是一个著名的密码破解工具，用于破解密码和其他内容。Web 攻击是黑客最重要的阶段之一，你需要详细了解它以获得更好的结果。\n\
    \n### John the Ripper 的四种破解模式：\n1. **字典文件 (Wordlist Mode)**：这是 John 支持的破解模式中最简单的一种。你唯一需要做的就是告诉\
    \ John 字典文件在哪里（字典文件是文本文件，内容每行一个单词）。它代表尝试的密码，以便进行提取和破解。在“字典文件”破解模式下，你可以使用“单词更改”功能自动将这些规则应用到每个读取的单词，以增加破解几率。\n\
    2. **单次破解模式 (Single Crack Mode)**：“简单”破解模式是为那些使用“账户作为密码”的懒人设计的。所谓的“使用账户作为密码”意味着如果用户账户是“John”，那么它的密码也被视为“john”。在“简单”模式下，john\
    \ 将使用密码文件中的“account”字段来破解密码，并使用各种“单词更改”规则应用到“account”上以增加破解几率。例如，账户“john”将尝试使用“john”、“john0”、“njoh”、“j0hn”等规则变化来尝试密码。\n\
    3. **增量模式 (Incremental Mode)**：这是 John 最强力的破解模式。它会自动尝试所有可能的字符组合并将它们作为密码进行破解。这种破解模式所需的时间非常长，因为尝试组合组合非常耗时，所以\
    \ John 会定义一些“字符频率表”来帮助破解。简而言之，这种破解方法是“暴力破解”，通过测试所有可能的密码组合来获得正确结果。\n4. **外部模式 (The\
    \ External Mode)**：这种破解模式允许用户用 C 语言编写一些“破解模块程序”，然后在 John 中它们。事实上，所谓的“破解模块程序”是用\
    \ C 语言设计的子函数声明，其功能是为 John 生成一些供其尝试破解的单词。在执行 John 程序时，它会在加载这些“破解模块程序”时自动编译这些 C\
    \ 语言子呈现形式，然后使用它们。\n\n# John the Ripper 命令行参数描述\n`John [-command column parameter]\
    \ [password file name] [command column parameters]`\n\n### 参数：\n- `-single`: \n\
    \  - 描述：使用“单次破解”模式进行解密，主要基于用户的“账户”变化来猜测，更改规则记录在 `JOHN.INI` 文件的 `[List.Rules:Single]`\
    \ 区域。\n  - 示例：`john -single passwd`\n- `-wordfile: [dictionary file name] -stdin`:\n\
    \  - 描述：使用“字典文件”解密模式，通过读取字典文件中的单个单词进行解密；或者你可以添加 `-stdin` 参数表示由键盘输入的单词。\n  - 示例：`john\
    \ -wordfile:bigdict.dic passwd`\n- `-rules`:\n  - 描述：在“字典文件”破解模式下，开启单词规则更改功能，例如将字典文件读入单词\
    \ cook，然后开启单词更改，程序可能会尝试 cook、c00k、cooker、cook0 等其他单词。详细的更改规则记录在 `JOHN.INI` 文件的\
    \ `[List.Rules:Wordlist]` 区域。\n  - 示例：`john -wordfile:bigdict.dic -rules passw`\n\
    - `-incremental[:mode name]`（参数也可以缩写为 `-i[:mode name]`）：\n  - 描述：使用“增强”破解模式解密，结合所有可能的字符作为密码。在\
    \ `JOHN.INI` 文件的 `[Incremental:*****]` 区域定义了许多方案名称，你可以指定使用哪种模式进行破解。\n  - 示例：`john\
    \ -i:all passwd`\n- `-external: [module name]`:\n  - 描述：使用“插件模块”进行解密模式，用户可以编写额外的“破解模块”。破解模块”记录在\
    \ `JOHN.INI` 文件的 `[List.External:******]` 区域。\n  - 示例：`john -external:double passwd`\n\
    - `-stdout[:LENGTH]`:\n  - 描述：此选项与破解无关，只是将 John 生成的单词显示在屏幕上。\n  - 示例：`john –i:all\
    \ –stdout`\n- `-restore[: Reply File Name]`:\n  - 描述：继续上次中断的解密。当 John 执行破解工作时，可以按下\
    \ `<CTRL C>` 键中断，当前的解密进度将存储在名为 \"restore\" 的文件中。使用 `-restore` 参数，你可以读取点击“restore”文件时上次断开的位置，然后继续破解。\n\
    \  - 示例：`john –restore`\n- `-session[:record file name]`:\n  - 描述：此选项用于设置当前会话的文件名。所谓的工作日志文件是可以使用\
    \ `-restore` 参数恢复工作的文件。此外，当使用 John 执行多路作业时，使用 `-session` 参数为每个作业设置一个单独的日志文件，防止混合。\n\
    \  - 示例：`john –wordfile:bigdict.dic –session:work1`\n- `-status[:record file name]`\n"
