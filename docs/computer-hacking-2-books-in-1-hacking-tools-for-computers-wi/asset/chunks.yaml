    learn how to maintain your anonymity in Kali Linux, we will have a good explanation
    about all the options we have for securing ourselves in this matrix world that
    is all connected.Why Anonymity matters?Imagine if your country has blocked your
    internet access to social networking during riots and all of your people want
    to use it for better communication. You can do with a VPN or TOR bundle and not
    are detected. However, tracking can be done in any other way if they want to.
    But make sure to follow this for some better peace. In the below section we will
    learn about anonymity services that has different uses.What is a proxy server?Proxy
    is a middle man between you and server that you are trying to reach. Imagine if
    you want to deliver a package from New York (your place) to Colorado (Server place).
    Instead of going and giving the package all by your own, you will ask your friend
    to deliver it. Here your friend acts a proxy for you. This is how the proxy server
    works.There are many proxy servers like Socks4, http, https and Socks5.How a hacker
    can use proxy server?When doing a password attack you will normally be blocked
    by the website due to too many requests. In these situations, you can use a bunch
    of free proxies to randomly occupy the proxy address and attack the login page.
    This is a famous technique called cracking that is used by novice hackers to get
    an access into the system.What is a VPN?A VPN is a quite common advertisement
    that you might have used while watching ads in YouTube. A virtual private network
    abbreviated as a VPN acts like a middle man but delivers your request in encrypted
    form to the server in such a way that the server can''t identify you. And when
    the server sends you the response it again encrypts it and sends towards you.
    Imagine this example to get a better understanding of how a Vpn works. Imagine
    that you want to deliver a Love Letter to your classmate. But you don''t want
    any other person to read it other than your best friend. So, you write a Letter
    in quite a different way that no one can understand and sends by your friend to
    your classmate. Remember that your friends know how to read it. He will decrypt
    it to her and she will send a response in the same way. This is basically how
    a VPN works.In the next section, we will describe about how internet communication
    works and will give a practical example that will let us understand the fact that
    Anonymity is a must.How the internet works?Every internet connected device has
    an IP address that can be easily tracked using different techniques by the government.
    When u send an email or surf internet without any Anonymity services, you are
    just being a product to Tech giants like Google. They will collect a lot of information
    from you and will sell you as adds to the businesses. Apart from that, every movement
    of yours will be tracked and can help them create new products.Normally when we
    click on an URL the packet that contains your request will also contain the IP
    addresses of both yours and the server that you are trying to reach. In the communication
    process, it will travel through different routers called hops before reaching
    its final destination. When a packet is travelling, it can be easily sniffed and
    can be used to acquire information about you.For an example, use traceroute command
    to check how many hops that a particular website takes as below.root @ kali: traceroute
    bing.comYou will get an output that shows the number of routers it needs to travel
    to reach the final destination. When the packet is travelling, anyone can sniff
    it and can attain sensitive information about you and your request.What is TOR?Concerned
    with security of Internet few independent security researchers has developed a
    network called TOR network that will encrypt the hop we are going through. TOR
    basically makes your request go through its servers all the while making your
    data encrypted and untraceable.  This will dramatically increase the security
    of your system. But remember that this may make your networking slow as it needs
    to travel between encrypted servers. But when you are trying to attack a target
    host, it is best to use TOR network.To access TOR as a command line interface
    you can enter the following command.root @ kali : tor service startThis will start
    the TOR bridge circuit for you and will make every request that is going on from
    your system to travel through TOR servers to reach destination server.You can
    also use TOR project bundle that consists of browser to use it for your daily
    purposes. A good thing about TOR browser that nothing of your information is tracked.Is
    TOR the safest?Unfortunately, you can''t fully depend on TOR because there are
    rumors that some of TOR servers belong to NSA organizations. If at all your packet
    travels through one of their hops, your information can be easily retrieved. So,
    try to use it with Sock5 proxies so that you can never be tracked.In the next
    section, we will explain about proxies in detail. Proxies are the middle man and
    can be used for secure and safe communication. They are even extensively used
    for password attacks.Kali Linux uses proxy chains a networking utility to manage
    proxy services in the operating system. We will learn about in detail in the next
