    ### Description

    Displays the working status recorded in the working log file.

    i) Example: `john –status:restoreParameters: -makechars: [file name]`


    ### Description

    Create "character frequency table". This option will generate a "character frequency
    table" based on the currently cracked password (note: John will record the cracked
    password in the `JOHN.POT` file). If the file of the specified file name already
    exists, it will be overwritten. The file generated by this option can be used
    in the "enhanced" crack mode.

    j) Example: `john –makechars:owncharsParameters: -show`


    ### Description

    Displays the password that has been cracked. Because the "Account" data is not
    stored in the `JOHN.POT` file, you should enter the corresponding password file
    at the same time.

    k) Example: `john –show passwd` (pictured) <img src=http://www.starkun.com/txtjpg/hacker.gif>

    Parameters: `-test`


    ### Description

    Tests the speed at which the current machine performs John''s various types of
    password cracking.

    l) Example: `john –test` (pictured) <img src=http://www.starkun.com/txtjpg/hacker2.gif>

    Parameters: `-users:[-]LOGIN|UID [,..]`


    ### Description

    Only crack the password of an "account", such as only for root or a user with
    root entitlement `UID=0`. (If you put the `-` symbol in front of the `LOGIN|UID`
    name, the opposite is true, indicating that you should not crack the password
    of this "account")

    m) Example: `john –i:all –users:root passwd` (pictured) <img src=http://www.starkun.com/txtjpg/hacker3.gif>

    Parameters: `-groups:[-]UID[,..]`


    ### Description

    Only the password of the user in a "group" is cracked. (If you put the `-` symbol
    in front of the `UID` name, the opposite is true, indicating that you should not
    crack the password of the user in this "group".

    n) Example: `john –i:all –groups:100`

    Parameters: `-shells:[-]SHELL [ ,..]`


    ### Description

    Like the above two parameters, this option is only for all users who can use the
    shell to crack the password work, ignore other users. (If you put the `-` symbol
    in front of the `SHELL` name, the opposite is true, indicating that you should
    not crack the password of the user who can use this `SHELL`). When specifying
    `SHELL`, you can omit the absolute path. For example, the parameter `-shells:csh`
    will contain paths such as `/bin/csh` or `/usr/bin/csh`, but if you specify `-shells:/
    Bin/csh` will only contain the `SHELL` name `/bin/csh`.

    0) Example: `john –i:all –shells:csh passwd` (pictured) <img src=http://www.starkun.com/txtjpg/hacker4.gif>

    Parameters: `-salts:[-]COUNT`


    ### Description

    Only crack the password of the account whose "salts" is larger than `COUNT`, which
    can make you get better crack speed (so-called "salts" refers to UNIX as the basis
    for "password" encoding. unit). For example, you can only crack the password `-salts:2`
    of a certain part of the user to get better speed, and then crack the remaining
    user''s password `-salts:-2` when there is time.

    p) Example: `john –i:all –salts:2 passwd` (pictured) <img src=http://www.starkun.com/txtjpg/hacker5.gif>

