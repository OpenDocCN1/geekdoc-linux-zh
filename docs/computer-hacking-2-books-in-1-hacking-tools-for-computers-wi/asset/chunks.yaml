    官方网站提供了 32 位和 64 位的 ISO 文件。本书将以 32 位为例介绍安装和使用。下载 ISO 文件后，将镜像文件刻录到 DVD。然后你就可以开始将
    Kali Linux 安装到硬盘上。


    (1) 将安装光盘插入用户的 CD-ROM 驱动器，重启系统，你将看到该界面。

    (2) 此界面是 Kali 的引导界面，在此界面上选择安装模式。在这里选择 `Graphical Install`（图形化安装）将显示一个界面。

    (3) 在此界面选择安装系统的默认语言为 `English`，然后点击 `Continue`（继续）按钮，将显示下一个界面。

    (4) 在界面选择区域选择 `Your country`（你的国家），然后点击 `Continue` 按钮，将显示下一个界面。

    (5) 在此界面选择键盘模式为 `English`，然后点击 `Continue` 按钮，将显示下一个界面。

    (6) 此界面用于设置系统主机名。这里使用了默认主机名 `Kali`（用户也可以输入自己的系统名称）。然后点击 `Continue` 按钮，将显示下一个界面。

    (7) 此界面用于设置计算机使用的域名。本例中输入的域名名为为 `kali.example.com`。如果当前计算机未连接网络，可以填写域名名并点击 `Continue`
    按钮。将显示下一个界面。

    (8) 在此界面设置 root 用户密码，然后点击 `Continue` 按钮，将显示下一个界面。

    (9) 此界面允许用户选择分区。在此处选择 `Use the entire disk`（使用整个磁盘），然后点击 `Continue` 按钮，将显示下一个界面。

    (10) 此界面用于选择要分区的磁盘。系统中只有一个磁盘，因此此处使用默认磁盘即可。然后点击 `Continue` 按钮，将显示下一个界面。

    (11) 界面需要分区方案，默认提供三种方案。选择 `Place all files in the same partition (recommended
    for beginners)`（将所有文件放在同一个分区中（推荐初学者使用））并点击 `Continue` 按钮，将显示下一个界面。

    (12) 在最后选择 `Partition setting ends and write the changes to disk`（分区设置结束并将更改写入磁盘），然后点击
    `Continue` 按钮，将显示下一个界面。如果你想修改分区，可以在此界面选择 `Undo the modification of the partition
    settings`（取消分区设置修改）来重新分区。

    (13) 在此界面勾选 `Yes` 复选框，然后点击 `Continue` 按钮，将显示下一个界面。

    (14) 现在开始安装系统。在安装过程中需要设置一些信息，例如设置网络镜像。如果安装 Kali Linux 系统的计算机未连接网络，在此屏幕上勾选 `No`
    复选框并点击 `Continue` 按钮。在此处勾选 `Yes` 复选框将显示下一个界面。

    (15) 在此界面设置 HTTP 代理信息。如果你不需要通过 HTTP 代理连接外部网络，只需点击 `Continue` 按钮，将显示下一个界面。

    (16) 扫描镜像站完成后，你可以进入下一个选项。

    (17) 在选择镜像的国家中，选择 `Your country` 并点击 `Continue` 按钮，将显示下一个界面。

    (18) 界面默认提供 7 个镜像站，其中一个被选为系统镜像站。在此选择 `mirrors.163.com`，然后点击 `Continue` 按钮，将显示下一个界面。

    (19) 在此界面勾选 `Yes` 复选框，然后点击 `Continue` 按钮，将显示下一个界面。

    (20) 此时继续安装。安装完成后，进程结束将出现 Kali Linux 登录界面。


    # 使用 USB 驱动器安装 kali Linux


    Kali Linux USB 驱动器提供了永久保存系统设置、在 USB 设备上永久更新和安装包的能力，并允许用户运行自己的个性化 Kali Linux。使用
    `Win32 Disk Imager` 为 Linux 发行版创建一个可引导的 Live USB 驱动器，其中包含 Kali Linux 的持续存储。本节介绍了将
    Kali Linux 安装到 USB 驱动器的步骤。


    将操作系统安装到 USB 驱动器与安装到硬盘有所不同。因此，在安装之前你需要一些准备。例如，从哪里获取 Linux？USB 盘格式是什么？USB 盘的大小是多少？这些要求将逐一列出。


    完成之前的准备后，即可安装系统。将 Kali Linux 安装到 USB 驱动器的步骤如下：

    (1) 将已格式化且可写的 USB 驱动器插入 Windows 系统。插入后，将显示下一个界面。

    (2) 启动 `Win32 Disk Imager`，显示启动界面。在 Image File location 处，点击图标选择 Kali Linux DVD
    镜像的位置，并选择将安装 Kali Linux 的 USB 设备。本例中的设备为 K。选择 ISO 文件和 USB 设备后，点击 `Write` 按钮将 ISO
    文件写入 USB 驱动器。

    (3) 使用 `UNetbootin` 工具制作设备 K 启动盘。启动 `UNetbootin` 工具，将显示下一个界面。

    (4) 在此界面勾选 `Disc Image` 复选框，然后选择 ISO 文件的位置，并将 Space used to preserve files across
    reboots（用于在重启时保留文件的空间）设置为 `4096MB`。

    (5) 选择 USB 驱动器，本例中的 USB 驱动器为 K，然后点击 `OK` 按钮；将开始创建可引导的 USB 驱动器。

    (6) 创建完成后，将显示下一个界面。

    (7) 此时，USB 驱动器已成功创建。在界面点击 `Restart Now` 按钮，进入 BIOS 菜单并选择 USB boot，即可安装 Kali Linux
    操作系统。


    # 更新和升级 Kali Linux


    当用户使用一段时间后，可能会对在不变化的系统中工作感到不满意，并渴望升级。此外，Linux 发行版和内核不断更新。在这种情况下，本节介绍更新和升级。


    更新和升级 Kali 的具体步骤如下：

    (1) 在图形界面中选择 `Application` | `System Tools` | `Software Update` 命令，将显示下一个界面。

    (2) 界面提示应用程序是否应以特权用户运行。如果继续，点击 `Continue` 按钮，将显示下一个界面。

    (3) 界面显示总共需要更新的包。点击 `Install Update` 按钮显示界面。

    (4) 此界面显示所依赖的包。点击 `Continue` 按钮显示界面。

    (5) 此界面显示软件更新的进度。其中，包出现在图标后面表示该包正在下载；如果安装成功，将以图标形式出现。此时，点击 `Exit` 按钮并重启系统。在更新过程中，下载的包会自动跳转到第一列。

    (6) 重启系统后，登录系统并执行 `lsb_release -a` 查看当前系统的所有信息。

    (7) 从输出中可以看到当前的系统版本。上述命令适用于所有发行版，包括 RedHat、SuSE 和 Debian。如果你只想查看版本号，可以执行命令：

    ```

    root@kali:~ cat /etc/issue

    ```


    # 黑客攻击路线图


    如果黑客想要攻击目标计算机，无法通过 DOS 命令实现。它还需要一些强大的入侵工具，如端口扫描工具、网络嗅探工具、木马病毒制作工具和远程控制工具。本节简要介绍黑客常用的入侵工具。


    ### a) 端口扫描

    端口扫描工具具有扫描端口的功能。所谓的端口扫描意味着黑客可以通过发送一组端口扫描信息来扫描目标计算机的信息。这些端口是黑客的入侵通道。一旦黑客了解了这些端口，他们就可以入侵目标计算机。除了扫描开放端口的能力外，端口扫描工具具有自动检测远程目标计算机安全漏洞的能力。使用端口扫描工具，用户可以在不留痕的情况下发现目标计算机上的各种
    TCP 端口。黑客常用的端口扫描工具有 `SuperScan` 和 `XScan`。


    ### b) 嗅探工具

    嗅探工具是在局域网内嗅探包的工具。所谓的嗅探是监听流经局域网的所有数据包。通过监听和分析这些数据包，你可以窥探局域网内他人的私密信息。嗅探工具只能在局域网中使用，无法直接嗅探互联网上的目标计算机。黑客常用的数据嗅探工具有
    `Sniffer Pro` 和 `Eiffel Detective`。


    ### c) 木马制作工具

    顾如名，木马制作工具是制作木马的工具。由于木马具有盗取目标计算机个人私密信息的功能，许多初级黑客喜欢使用木马制作工具。木马制作工具的工作原理基本相同：首先使用工具配置木马服务器。一旦木马服务器运行，黑客就可以使用木马完全控制计算机。木马制作工具的操作非常简单，黑客常用的木马制作工具是“冰川”等。


    ### d) 远程控制工具

    远程控制工具是具有远程控制功能的工具。尽管控制方法不同（有些工具通过植入服务器进行控制，有些用于直接控制局域网），一旦黑客使用远程控制工具控制计算机，就像坐在它面前一样。黑客常用的远程控制工具是网络执法工具。


    # 攻击计算机


    在互联网上，为了防止黑客入侵自己的计算机，有必要理解攻击计算机的常用方法。黑客常用的方法包括数据驱动攻击、文件攻击、伪造信息攻击和远程操作。


    ### 1) 数据驱动攻击

    数据驱动攻击是黑客发送或拷贝看似无害程序发起的攻击。这种攻击允许黑客在计算机上修改文件。数据驱动攻击主要包括缓冲区溢出攻击、格式字符串攻击、输入验证攻击和漏洞攻击。


    ### 2) 伪造信息攻击

    伪造信息攻击意味着黑客通过发送伪造路由信息在源计算机和目标计算机之间构建虚假路径。这可以获取账户信息和密码。


    ### 3) 信息协议

    在局域网中，IP 地址源允许数据包选择路径。当黑客尝试连接不可达的计算机时，只需要设置 IP 地址源使数据包到达防火墙，从而对 ICMP 协议进行攻击。


    ### 4) 远程操作

    远程操作意味着黑客在计算机上启动可执行程序。当用户输入账户和密码时，程序显示“系统失败”消息。这种类型的攻击在互联网上非常常见。


    ### 5) 局域网安全

    在局域网中，安全是重要因素之一。当系统管理员配置错误时，这些错误可以为黑客提供机会。黑客使用 `finger`、`netstat` 等来实现攻击。


    ### 6) 重发攻击

    重发攻击意味着黑客收集特定的数据包并将其重发到计算机。在局域网中，重发消息可以改变路由列表。


    ### 7) 漏洞攻击

    漏洞攻击意味着黑客传输源路径到局域网外的计算机。路由器会将此消息转发到防火墙，而不是计算机。


    # 第 2 章：Bash 和 Python 脚本


    本章将将介绍 `bash`（命令行界面语言）和 `python`（编程语言）。通过学习 `bash` 和 `python`，你可以不断增加自己的技能。


    ### 什么是 shell？

    在 Windows 系统中，我们有一个 GUI 帮助运行程序。除了 GUI，基于 Linux 的系统还包含了一个强大的命令行界面，称为 `shell`。`shell`
    帮助用户通过命令直接运行程序或通过文本编辑器轻松创建脚本。


    ### 什么是 UNIX？

    UNIX 是一个基于操作系统。学习 UNIX 历史可以帮助我们了解 `shell` 的重要性。


    ### 什么是 bash？

    有许多类型的 shell。其中 `bash` 是最熟悉的 shell 之一，用于自动化许多任务。


    ### 什么是终端？

    终端（Terminal）就像浏览器一样。终端是用于用户输入命令并启动 shell 的。


    ### 查看终端

    终端非常易理解。在 Kali Linux 中，我们可以看到 `user@machine`。详细了解 `bash` 是如何工作的。


    #### 1) echo

    `echo` 命令显示引号内的内容。你可能已经听过很多次了，它只需输出。

    ```bash

    echo "This happens in every shell"

    ```


    #### 2) date

    `date` 命令显示当前的日期和时间。编写脚本时非常常用。

    ```bash

    date

    Sun Dec 23 12:20 PST 2019

    ```


    #### 3) Cal

    此命令将显示你所在月份的日历。通过以下简单示例创建一个文件，而不是直接执行命令。


    **步骤 1：** 在第一步中，使用文本编辑器创建一个名为 `example.sh` 的文件，并写入以下行：

    ```bash

    #!/bin/bash

    echo "This happens in every shell"

    ```

    第一行是 shebang，第二行是注释。


    **步骤 2：** 保存文件。在下一步中，为了执行脚本，我们需要修改它的权限。可以使用以下命令：

    ```bash

    chmod +x example.sh

    ```

    这将为脚本创建执行权限。


    **步骤 3：** 在最后一步中，需要执行文件以获取输出。

    ```bash

    ./example.sh

    ```

    输出：

    ```

    This happens in every shell

    ```

    可以使用 `clear` 命令清除 shell 中的所有内容。

    ```bash

    clear

    ```


    #### 1) pwd

    `pwd` 命令将打印用户所在的的工作目录。你甚至可以使用额外的选项查看树结构。

    ```

    pwd

    /user/rod

    ```


    #### 2) ls

    `ls` 命令将显示当前目录的内容，所有文件和文件夹。我们通常用它来查看目录文件。

    ```bash

    ls

    shell.py  shell.img  shell.png

    ```


    #### 3) cd

    此命令用于切换目录。在你想要导航到的路径前加上 `cd`。可以通过 `ls` 命令检查目录是否切换。

    ```bash

    cd /home/desktop

    ```


    #### 4) mkdir

    此命令用于创建一个新的目录或文件夹。

    ```bash

    mkdir new/ruby

    ```


    #### 5) mv

    此命令帮助我们将文件或文件夹从一个目录移动到另一个。它遵循以下模式：`mv sourcepath destinationpath`。

    示例：

    `mv example.py code/`


    #### 6) touch

    这是一个特殊命令，用于在目录中创建任何类型的文件。例如，创建一个名为 `example.txt` 的空文本文件。

    ```bash

    touch example.txt

    ```


    #### 7) rm

    此命令帮助我们从磁盘删除文件。这将彻底删除文件。请谨慎使用。

    ```bash

    rm example.txt

    ```


    #### 8) rmdir

    此命令从磁盘删除目录。

    ```bash

    rmdir python

    ```


    #### 9) cat

    此命令可以读取文本文件并在输出屏幕上显示所有内容。

    ```bash

    cat rowdy.txt

    ```

    输出：

    ```

    Apple

    Bat

    Car

    Dog

    ```

    这将显示 `rowdy.txt` 文件中的所有内容。然而，当尝试显示包含大量数据的 txt 文件时，它会变得非常混乱。为了消除这个问题，我们使用下面的命令。


    #### 10) less

    此命令每次显示大页数据。它通过某些手势帮助我们。空格键可以带我们进入下一页，而 b 键可以带我们回到上一页。

    ```bash

    less rowdy.txt

    ```


    ### 1) 管道 (Pipelines)

    这显式意味着将第一个命令的输出作为第二个命令的输入。

    ```

    command1 | command2

    ```

    其中 `|` 管道运算符。


    ### 2) 过滤器 (Filters)

    过滤器用于分离或组织数据的额外技术。Linux 和 bash 包含许多过滤器命令来查找和组织数据。


    #### a) grep

    此命令有助于在文本文件中轻松查找单词。命令如下：

    ```

    grep raj cricket.txt

    ```


    #### b) sort

    此命令将按字母或数字对文件内容进行排序。示例管道过滤器：

    ```bash

    cat animals.txt | sort

    ```

    输出：

    ```

    Cat

    Dog

    Monkey

    Zebra

    ```

