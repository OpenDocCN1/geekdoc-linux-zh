    292.232.2.1 6870 > example.aviB as Server$nc -l 6870 > example.txtClient$nc 292.232.2.1
    6870 < example.avi4) Stream a Video in the serverThere are many other ways to
    do this but if using command line this can be an easy way.Server$cat tutorial.avi
    | nc  -l 2343Looking at following examples you might have understood how useful
    Netcat is. There are several tens of experiments that you can do with Netcat in
    such a way that can help you increase your hacking skills.In this chapter, we
    have dealt in detail about the hacking tools like Nmap, Nessus and Netcat along
    with explaining potential examples that can give you a good clarity over things
    that happen in the background. Next chapter deals with exploiting tool called
    Metasploit to enhance in our skills into an advanced level along with password
    attacking tools that can make you a bit clearer about the authentication systems
    that we need to deal with.Chapter 4: Advanced Kali Linux ToolsThis chapter deals
    with advanced kali Linux tools that can attack websites login forms and server
    configurations to create an authentication. We will also have a brief discussion
    about exploiting with the help of Metasploit and its payloads. This chapter occasionally
    introduces programming code. Don''t get overwhelmed with the code but try to concentrate
    on the concepts that needs to be learn to make your own attacks.ExploitingExploiting
    is a process in which hackers create exploits (like weapons) that can use known
    or unknown vulnerabilities to create a backdoor that can be used by hackers to
    exploit the system. Metasploit is a software that is available in kali Linux that
    is used to create and attack using exploits.Before talking about Metasploit in
    detail, I will explain a practical scenario where this method can be used.Practical
    Example:By using exploits in Metasploit, you can create an apk file and can send
    that exploited apk to your target using email or messenger services. When the
    target installs the app in his device, our exploit starts working in the backdoor
    and can send the files you wish to get from the target device. Hackers use much
    more complex techniques to use exploits to steal money or data.MetasploitMetasploit
    is an open source security vulnerability detection tool that comes with hundreds
    of known software vulnerabilities and is updated frequently. Metasploit was first
    announced at the black hat conference in August 2004 by four young people, HD
    Moore and Spoonm. Metasploit''s team completely rewrote and released Metasploit
    3.0 in 2007, using the Ruby programming language. This Metasploit migration from
    Perl to Ruby took 18 months more than lakh lines of code. With the release of
    version 3.0, Metasploit began to be widely adopted and received a significant
    increase in help and contributions across the security community.Some basic terminologyExploit:An
    attack by an attacker or penetration tester that exploits a security vulnerability
    in a system, application, or service.PayloadIt is the code that we expect the
    target system to execute after the attack.ShellcodeThis a set of machine instructions
    that runs as an attack payload in an infiltration attack, usually written in assembly
    language.ModuleThis is a piece of software that is available in Metasploit framework,
    can be used to launch a penetration attack or perform some secondary attack action.ListenerThis
    is a component in Metasploit that is used to wait for a network connection.How
    to use?The MSFCONSOLE, the most popular user interface for the Metasploit framework,
    provides interactive user input that can be used for anything.To start metasploit
    in the kali linux terminal enter the following code below# msfconsoleWhen you
    click the enter button you will get as follows along with the number of payloads
    available according to the date.MSF consoleCommand line (MSFCLI), MSFCLI scripting,
    and other command tool interoperability Armitage, a fully interactive graphical
    user interface in the Metasploit framework.It consists of functional programs
    as described below.MSF attack load generator (MSF payload) for generating your
    own custom shellcode, executable code, and so on.MSF encoders (MSFCODE) to help
    MSF payload encode, avoid bad characters, and evade antivirus software and IDS
    detection.Examples to describe the effectiveness of MetasploitVulnerability experimentWe
    will use this to explain the working and scope of metasploit for exploit making
    and attacking.Preparation:1\. The vulnerability exploits can be used in different
    ways according to the module we are using. This just explains the process that
