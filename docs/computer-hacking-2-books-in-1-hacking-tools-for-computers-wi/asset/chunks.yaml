    Use of Burp IntruderWorking principle:Intruder obtains different request responses
    by modifying various request parameters based on the original request data. In
    each request, Intruder usually carries one or more payloads (payloads), performs
    attack replay at different locations, and obtains the required feature data through
    comparison analysis of response data.Application scenario:1\. Identifier enumeration
    Web applications often use identifiers to reference data information such as users,
    accounts, assets, and so on. For example, username, file ID, and account number.2\.
    Extract useful data in some scenarios, rather than simply identifying valid identifiers,
    you need to extract some other data with a simple identifier. For example, you
    want to get the nickname and age of all users in the personal space standard through
    the user''s personal space id.3\. Fuzzy testing Many input-type vulnerabilities,
    such as SQL injection, cross-site scripting, and file path traversal, can be used
    to test applications by submitting various test strings through request parameters
    and analyzing error messages and other exceptions. Manual execution of this test
    is a time consuming and cumbersome process due to the size and complexity of the
    application. In this scenario, you can set up Payload to automate the fuzzing
    of web applications with Burp Intruder.Test steps:1\. Verify that the Burp Suite
    is properly installed and started up properly, and that the browser''s proxy settings
    are completed.2\. Enter Burp Proxy tab, turn off the proxy blocking.3\. Historical
    log (History) sub-tab and look for potential problems request logs, and right-click
    menu, sent to the Intruder.4\. Be Intruder tab, open the Target and Positions
    sub-tab. At this point, you will see the request message sent in the previous
    step.5\. Because we understand that the basis of the Burp Intruder attack is to
    set up a certain amount of attack payload Payload at the location specified by
    the original information around the original request information just sent, and
    send a request to obtain a response message through Payload. By default, all request
    parameters and cookie parameters are set to add payload6\. Click clear to clear
    the default load (if needed), circle the parameters that need to set the load,
    click add7\. When we open the Payload subtab, select the Payload generation or
    selection strategy, and select " Simple list" by default. Of course, you can also
    select other Payload types by drop-down or add them manually.8\. Then click start
    attack to launch the attack. At this time, the burp will automatically open a
    new interface containing the results of the execution of the attack, http status
    code, length and other information. We can also select one of the communication
    messages to view the details of the request message and the reply message.In many
    cases, in order to better indicate whether the response message contains the information
    we need, usually before the attack, the Options option is configured, and the
    most used is regular expression matching (Grep - Match). Or we select the filter
    in the Results tab to filter the results. At the same time, the columns shown
