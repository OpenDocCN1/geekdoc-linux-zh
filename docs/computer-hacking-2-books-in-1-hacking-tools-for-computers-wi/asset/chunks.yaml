    \ as follows:\n\n```bash\nroot@kali:/usr/share/rainbowcrack# rtsort md5_loweralpha-numeric#1-\
    \ 5_0_\n```\n\n# John the Ripper\nThis is a famous password-cracking tool that\
    \ is used to crack passwords and other stuff. Web hacking is the most important\
    \ phase of hacking and you need to understand it in detail for better results.\n\
    \n### John the Ripper's four crack modes:\n1. **Dictionary File (Wordlist Mode)**:\
    \ This is the simplest one in John's supported crack mode. The only job you have\
    \ to do is to tell John where the dictionary file is (the dictionary file is the\
    \ text file, and the content is one word per line). Represents the trial password\
    \ so that it can be extracted and cracked. In the \"dictionary file\" crack mode,\
    \ you can use the \"word change\" function to automatically apply these rules\
    \ to each read word to increase the chance of cracking.\n2. **Single Crack Mode**:\
    \ The \"Simple\" crack mode is designed for lazy people who use \"accounts as\
    \ passwords\". The so-called \"use an account as a password\" means that if a\
    \ user account is \"John\", its password is also taken as \"john\". In the \"\
    simple\" crack mode, john will use the \"account\" field in the password file\
    \ to crack the password, and use a variety of \"word change\" rules to apply to\
    \ the \"account\" to increase the chance of cracking. For example, the account\
    \ \"john\" will try to use the \"john\", \"john0\", \"njoh\", \"j0hn\", etc. rule\
    \ changes to try the password.\n3. **Incremental Mode**: This is John's most powerful\
    \ cracking mode. It automatically tries all possible combinations of characters\
    \ and then cracks them as passwords. The time required for this crack mode is\
    \ very lengthy, because trying to combine characters is very time consuming, so\
    \ John will define some \"character frequency tables\" to help crack. In short,\
    \ this method of cracking is the \"violence method\", testing all possible combinations\
    \ of passwords to get the correct results.\n4. **The External Mode**: This is\
    \ a crack mode that allows users to write some \"crack module programs\" in C\
    \ language and then use them in John. In fact, the so-called \"cracking module\
    \ program\" is a sub-declaration designed in C language, and its function is to\
    \ generate some words for John to try to crack. When executing the John program,\
    \ it automatically compiles these C language sub-presentations when loading these\
    \ \"crack module programs\" and then uses them.\n\n# John the Ripper command line\
    \ parameter description\n`John [-command column parameter] [password file name]\
    \ [command column parameters]`\n\n### Parameters:\n- `-single`: \n  - Description:\
    \ Use the \"Single Crack\" crack mode to decrypt, mainly based on the user's \"\
    account\" changes to guess the decryption, the change rules are recorded in the\
    \ `JOHN.INI` file within the `[List.Rules:Single]` area.\n  - Example: `john -single\
    \ passwd`\n- `-wordfile: [dictionary file name] -stdin`:\n  - Description: Use\
    \ the \"dictionary file\" to decrypt the mode and decrypt it by reading a single\
    \ word in the dictionary file; or you can add the `-stdin` parameter to represent\
    \ the word input by the keyboard.\n  - Example: `john -wordfile:bigdict.dic passwd`\n\
    - `-rules`:\n  - Description: In the \"dictionary file\" crack mode, open the\
    \ word rule change function, such as \"dictionary file\" read into the word cook,\
    \ then open the word change, the program may try cook, c00k, cooker, cook0 ...and\
    \ other words. The detailed change rules are recorded in the `[List.Rules:Wordlist]`\
    \ area of the `JOHN.INI` file.\n  - Example: `john -wordfile:bigdict.dic -rules\
    \ passw`\n- `-incremental[:mode name]` (parameters can also be abbreviated as\
    \ `-i[:mode name]`):\n  - Description: Decrypt using the \"enhanced\" crack mode,\
    \ which combines all possible characters as passwords. Define a lot of schema\
    \ names in the `[Incremental:*****]` area of the `JOHN.INI` file, and you can\
    \ specify which mode to use for cracking.\n  - Example: `john -i:all passwd`\n\
    - `-external: [module name]`:\n  - Description: Use the \"plug-in module\" to\
