  trans: "\n\n# 描述\n这两个参数与 John 的内部大脑有关，与破解本身没有直接关系，因此未介绍该内容。\n\n# Snort\n`Snort`\
    \ 是一款在 Kali Linux 中可用的开源软件，以其用 `C` 编写入侵检测系统 (NIDS) 而闻名。它支持 Windows 和 Linux 平台，我更倾向于\
    \ Linux 操作系统，因此我会在 Linux 上学习研究 `snort`。`Snort` 有三种运行模式，包括嗅探、数据包记录和入侵检测。\n\n##\
    \ Snort 规则选项\n所有 `snort` 规则选项都用分号 `;` 分隔。规则选项关键字及其参数之间用冒号 `:` 分隔。根据这种方法，`snort`\
    \ 中有 `42` 个规则选项关键字，可以帮助我们执行各种操作，如嗅探和记录包。\n\n- `Msg`: 在数据包日志中打印一条消息。\n- `Logto`:\
    \ 将数据包记录到用户定义的文件，而不是记录标准格式。\n- `Ttl`: 检查 `ip header` 中 `ttl` 的值。\n- `Tos`: 检查\
    \ IP 头中 `TOS` 字段的值。\n- `Id`: 检查 ip 头中的分片 `id` 值。\n- `Ipoption`: 查看 IP 选项字段的特定编码。\n\
    - `Fragbits`: 检查 IP 头的分片位。\n- `Dsize`: 检查数据包负载大小的值。\n- `Flags`: 检查 `tcp` 标志的值。\n\
    - `Seq`: 检查 `tcp` 序列号的值。\n- `Ack`: 检查 `tcp` 响应（确认）的值。\n- `Window`: 测试 `TCP` 窗口字段的特殊值。\n\
    - `Iype`: 检查 `icmp` 类型。\n- `Icode`: 检查 `icmp code` 值。\n- `Icmp_id`: 检查 `ICMP ECHO\
    \ ID` 值。\n- `Icmp_seq`: 检查 `ICMP ECHO` 序列号。\n- `Content`: 在数据包负载中搜索指定的样式。\n- `Content-list`:\
    \ 在数据包负载中搜索一组模式。\n- `Offset - content`: 选项的修符，设置开始搜索的位置。\n- `Depth - content`:\
    \ 选项的修符，设置搜索的最大深度。\n- `Nocase`: 指定内容字符串不区分大小写。\n- `Session`: 记录指定会话的应用层信息内容。\n\
    - `Rpc`: 监控特定应用程序/进程调用的 `RPC` 服务。\n- `Resp`: 反应（切断连接等）。\n- `React`: 响应（阻止网站）。\n\
    - `Reference`: 外部攻击引用 ID。\n- `Sid`: snort 规则 ID。\n- `Rev`: 规则的版本号。\n- `Classtype`:\
    \ 规则分类标识符。\n- `Priority`: 规则优先级标识号。\n- `Uricontent`: 在数据包 URI 部分搜索内容。\n- `Tag`:\
    \ 规则的高级记录行为。\n- `Ip_proto`: IP 头协议字段值。\n- `Sameip`: 确定源 IP 和目的 IP 是否相等。\n- `Stateless`:\
    \ 忽略流状态的有效性。\n- `Regex`: 通配符模式匹配。\n- `Within`: 强制关系模式匹配的范围。\n- `Byte_test`: 数字模式匹配。\n\
    - `Byte_jump`: 数字模式测试和偏移调整。\n\n## snort 基本命令\n1) `start snort`\n   ```bash\n \
    \  sudo snort\n   ```\n2) `snort help` 命令：\n   `Snort --help`\n   ```bash\n  \
    \ snort --help\n   ```\n3) `Snort` 启动特定的配置文件：\n   ```bash\n   sudo snort -i eth0\
    \ –c /example/snortexample/snort.conf -A fast -l /var/log/snort\n   ```\n4) 规则：\n\
    \   ```bash\n   alert tcp any any -> 10.232.2.1 80 (msg:\"Telnet Login\";sid:23434)\n\
    \   alert icmp any any -> 10.232.2.1 any (msg:\"ICMP PING\";sid:8845463)\n   ```\n\
    5) `test`\n\n以上就是 Kali Linux 提供的高级破解工具。在下一章中，我们将详细讨论无线破解。在进行无线破解之前，尝试练习本章中学到的内容。你可以使用\
    \ `Burp suite` 等 Web 应用分析软件来进一步了解协议和加密过程，从而成为一名高效的黑客。\n\n# 第 5 章：无线破解与渗透测试\n本章将详细解释使用\
    \ Kali Linux 进行无线攻击。首先，我们将简要介绍不同的用于分析网络数据包的无线网络分析工具。在下一节中，我们将介绍 `Aircrack-ng`，这是一种\
    \ Kali Linux 无线工具，用于破解某些加密的 wifi 密码。\n\n在今天，几乎每个人都连接了互联网。特别是如果你经常在路上，你希望随处都有无线信号以便你可以你正在做的事情。但在许多情况下，这些无线信号在使用之前需要经过身份验证。有时你急需网络，但不知道无线密码，这会让用户感到非常焦虑。在\
    \ Kali 中，有很多工具可以破解无线网络。本章描述了如何使用各种渗透测试工具执行无线网络攻击。\n\n## 什么是嗅探？\n嗅探是通过黑客工具获取无线数据包并将其用于恶意目的的过程。由于获取信息很容易，嗅探通常被称为“脚本小子（script\
    \ kiddies）的方法”。尽管网站和应用程序的加密能力大大提高，但许多用户仍会被嗅探技术骗出密码和一次性密码等敏感信息。`Wireshark` 是一个用于无线攻击的著名工具。\n\
    \n## 无线网络嗅探工具 Kismet\n如果要执行无线网络渗透测试，必须首先扫描所有有效的无线接入点。Kali Linux 恰好提供了 `Kismet`\
    \ 这一无线网络嗅探工具。使用该工具测量周围的无线信号并查看所有可用无线接入点。本节描述了如何使用 `Kismet` 工具嗅探无线网络。\n\n### 步骤\
    \ 1：启动 Kismet 工具\n执行以下命令：\n```bash\n# kismet\n```\n### 步骤 2\n界面提示你使用 root 用户运行\
    \ `Kismet` 工具。此时，选择 `Ok`。紧接着，界面提示自动启动 `Kismet` 服务。在此处选择“Yes”。\n### 步骤 3\n界面显示有关设置\
    \ `Kismet` 服务的信息。在此处使用默认设置并选择 `Start`。下一个界面显示你现在是否要添加未定义的包资源。选择 `Yes`。\n### 步骤\
    \ 4\n在界面中指定无线网卡接口和描述信息。在 `INTF` 中，输入无线卡接口。如果你的无线网卡已处于监听模式，输入 `WLAN0` 或 `MON0`。其他信息可以留空不添加。然后点击\
    \ `Add` 按钮。\n### 步骤 5\n下一个界面显示正在无线网络中嗅探的信号。运行一段时间后，停止修改。点击屏幕上的 `Kismet` 菜单选项并选择\
    \ `Quit` 命令。在此界面点击 `Kill` 将停止 `Kismet` 服务并退出终端模式。\n### 步骤 6\n在上述消息的 `Kismet` 正在关闭部分，你会看到几个日志文件已关闭。默认情况下，日志文件将保存在名为\
    \ `Root` 的目录中。在这些日志文件中，显示了日志生成的时间。当你多次运行 `Kismet` 或运行几天时，这些时间非常有帮助。\n\n让我们分析上述捕获的数据。切换到\
    \ `/Root/` 目录并使用 `ls` 命令查看生成的日志文件。执行以下命令：\n```bash\nroot@kali:~# ls Kismet -2034344-23-9-4-1.*\n\
    ```\n从输出中，你可以看到有五个不同后缀名的日志文件。`Kismet` 工具生成的所有信息都存储在这些文件中。\n- `alert`: 此文件包含所有警告信息\n\
    - `gps xml`: 如果使用了 GPS 源，相关的 GPS 数据将保存在文件中\n- `NETTXT`: 包含所有收集的文本输出信息\n- `NETXML`:\
    \ 包含所有 XML 格式的数据\n- `PCAPDUMP`: 包含会话期间捕获的数据包\n\n### 分析文本文件\n在 Linux 中，你可以使用各种文本编辑器打开\
    \ `nettxt` 文件。从输出中，你可以看到 `nettxt` 文件包含了大量信息，列出了每个无线网络和每个客户端。\n\n## Aircrack-ng\n\
    `Aircrack-ng` 是一款基于 `802.11` 协议、用于 WEP 和 WPA 加密的工具。该工具主要使用两种攻击来破解 WEP：一种是针对 WEP\
    \ 漏洞发现的 FMS 攻击；另一种是 `Korek` 攻击，这种攻击比 FMS 高效得多。\n\n### 破解 WEP\nWEP 协议是设备之间传输加密数据的一种，旨在防止非法用户窃听。然而，分析人员已识别出\
    \ WEP 在 2003 年之前的多个漏洞。本节描述了使用 `Aircrack` 破解 WEP 网络的方法。步骤如下：\n\n1) 使用 `airmon-ng`\
    \ 命令查看无线网络接口。执行以下命令：\n```bash\n# airmon-ng\n```\n输出显示了当前系统的无线网络接口：`Interface`、`Chipset`\
    \ 和 `Driver`。\n\n2) 尝试更改系统或设备的 MAC 地址。修改 MAC 地址可以隐藏真实地址。在更改 MAC 地址之前，需要停止接口。执行命令：\n\
    ```bash\nairmon-ng stop wlan0\n```\n执行上述命令后，`wlan0` 停止。此时你可以尝试命令：\n```bash\nroot@kali:~#\
    \ macchanger --mac 22:33:44:55:66 wlan0\n```\n永久 MAC: `00:c1:39` (未知);当前 MAC:\
    \ `00:c0:77` (未知);新 MAC: `22:33:44` (未知)。\n\n3) 使用 `airodump-ng` 命令定位附近的无线网络。执行以下命令：\n\
    ```bash\n# airodump-ng wlan0\n```\n显示附近所有的可用无线网络。当你找到想要攻击的路由器时，按 `C` 停止。从输出中，你可以看到几个参数：\n\
    - `BSSID`: 无线地址\n- `PWR`: 网卡报告的信号强度\n- `BEACONS`: 发布的包数\n- `Ch`: 通道（从 Beacon 中获得）\n\
    - `Essid`: 所谓的 SSID\n- `FRAMES`: 客户端发送的包数\n\n4) 使用 `airodump-ng` 捕获指定 BSSID 文件。`airodump-ng`\
    \ 常用选项如下：\n- `c`: 指定通道\n- `-w`: 指定保存文件名\n- `-b`: 指定 BSSID\n\n5) 打开一个新的终端窗口并运行\
    \ `aireplay-ng` 命令。`aireplay-ng` 的格式如下：\n`aireplay-ng -1 -a [BSSID] -h [our MAC\
    \ address] -e [ESSID] [Interface]` `auth`\n\n6) 使用 `aireplay-ng` 向路由器发送一些流量以便捕获数据。格式如下：\n\
    `aireplay-ng -3 -b [BSSID] -h [Our MAC address] [Interface]`\n输出是使用 `aireplay-ng`\
    \ 读取 ARP 请求，此时切换到 `airodump-ng` 接口，你可以看到 ARP 请求数量增加。在捕获到一定数量的 IV 包（达到 2000 个）后，继续抓取。\n\
    \n7) 使用 `aircrack-ng` 破解密码。执行命令：\n```bash\naircrack-ng -b xx:cap\n```\n从输出中，你可以看到“KEY\
    \ FOUND”，密码已找到。\n\n# Attack WPS (Wi-Fi 保护)\nWPS 是 Wi-Fi 联盟引入的一种新标准，旨在解决 WPS 设置过于复杂导致的许多安全问题。许多人使用\
    \ WPS 来设置设备。本节描述了使用各种工具攻击 WPS。\n\n## 使用 reaver 破解 WPS\n步骤如下：\n1) 插入无线网卡并使用 `IFCONFIG`\
    \ 查看网卡是否正确插入。执行命令：\n```bash\nifconfig\n```\n2) 激活无线网卡的监听模式。执行命令：\n```bash\n# airmon-ng\
    \ wlan0\n```\n注意：执行上述命令启动监听模式，确保正确识别网卡芯片和驱动，否则无线网卡可能导致攻击失败。\n3) 攻击 WPS。执行命令：\n\
    ```bash\nroot@kali:~# reaver -i mon0 -b 14:E6:E4:FB:20 -vv\n```\n输出：从上述输出中，你可以看到正在等待连接到\
    \ `14E4FB:20` 无线路由器，并通过发送 `PIN` 获取密码。如果路由器未启用 WPS，会出现以下信息：\n`[!] WARNING: Failed\
    \ to associate with 14:E6:E4:FB:20 (ESSID: XXXX)`\n\n## Fern wifi cracker\n`Fern\
    \ WiFi Cracker` 是测试网络安全的绝佳工具。该工具用于攻击 Wi-Fi 网络。第一步是使用 `Fern wifi cracker` 工具攻击\
    \ WPS。\n\n## 使用 Wifite 攻击 WPS\n步骤如下：\n1) 启动 `wifite` 工具并指定常用字典文件。命令行：\n```bash\n\
    root@kali:~# wifite -dict.txt\n```\n此信息显示了 `wifite` 的版本、支持的平台以及开始扫描。当扫描想要破解的网络时，按\
    \ `CTRL + C` 停止。\n2) 停止扫描。显示的消息如下：从上述输出中你可以你可以扫描到了五个接入点。输出中显示总共七列：接入点编号、Essid\
    \ 号、通道、加密模式、功率、是否开启 WPS 以及客户端。如果只有一个客户端连接，它就会出现。\n3) 此时选择要攻击的接入点。选择第五接入点并输入 `1`。然后回车开始攻击，显示的消息如下：\n\
    ```bash\nroot@kali:~# wifite 1-5\n```\n（目标数字用逗号分隔，或输入 'all'）。\n\n## GERIX WIFI\
    \ CRACKER\n`Gerix Wifi Cracker` 是另一个图形界面破解工具。本节描述了如何使用它破解 WEP 和 WPA2 加密网络。使用 `Gerix`\
    \ 自动攻击无线网络。步骤如下：\n1) 启动 `Gerix` 工具。\n```bash\nroot@kali:/usr/share/gerix-wifi-cracker#\
    \ python gerix.py\n```\n执行上述命令后界面出现。`Gerix` 数据库已加载。\n2) 从界面看到只有一个无线接口。切换到 `Configuration`\
    \ 标签，选择 `wlan1` 并点击 `Enable/Disable Monitor Mode` 按钮。\n3) 监听模式启动后，`WLAN1` 已成功启动。用鼠标选择\
    \ `MON0`，点击 `Rescan` 按钮。\n4) 从界面看到附近所有的无线网络。选择目标网络并点击 `Attack`。\n5) 界面用于配置 WEP\
    \ 相关信息。使用 `General` 部分进行配置。\n6) 界面显示如何攻击 WEP。点击 `Sniffing and Logging` 按钮，点击 `Start\
    \ Sniffing`。\n7) 如果攻击成功，网关 `192.168.6.332` 将发送数据。\n8) 本节描述了使用 `Chop` 攻击。界面是捕获数据包。生成名为\
    \ `.Cap` 的文件。\n9) 如果攻击成功，网关攻击。本节描述了使用 `Chop` 攻击。界面是捕获数据包。\n10) 询问是否要使用包？输入 `y`。当捕获的包数量达到\
    \ 2000 时，点击 `Cracking` 标签显示。\n11) 从界面看到破解 WEP 需几 分钟。\n\n## 使用 Gerix 创建伪接入点\n使用\
    \ `Gerix` 工具可以创建伪接入点 (AP)。设置伪接入点可以欺骗用户访问接入点。步骤如下：\n1) 启动 `Gerix` 工具。\n```bash\n\
    root@kali:/usr/share/gerix-wifi-cracker# python gerix.py\n```\n2) 切换到 `Configuration`\
    \ 标签。选择无线接口，更改网络通道。设置上述信息后，其他保持默认。点击 `Fake AP` 按钮。\n3) 伪接入点创建后，界面输出：`17:32:34`\
    \ Client；`18:AB:56:F0:62` 关联(WEP) 到 ESSID: \"itsnetwork\"。\n\n## 使用 Wifite 破解无线网络\n\
    一些破解网络程序使用 `Aircrack-ng` 工具集并添加图形界面或菜单，这让用户无需记忆命令就能破解。本节描述了使用命令行工具 `wifite` 扫描网络。\n\
    ```bash\n# wifite\n```\n你可以看到扫描到的接入点。选择目标接入点（目标数字用逗号分隔，或输入 'all'）。\n\n## 使用 Easy-creds\
    \ 工具攻击无线网络\n`Easy-creds` 是一种菜单风格的破解工具。它允许用户打开无线网卡并实施中间人攻击，分析数据流并恢复账户信息。本节描述了使用\
    \ `Easy-creds` 工具：\n1) 启动 `Easy-creds` 工具。\n```bash\nroot@localhost:~/easy-creds./easy-creds.sh\n\
    ```\n2) 选择伪 AP 攻击，在此输入 `3`。显示的信息如下：`Choice: 3`。\n3) 在此处选择静态伪 AP 攻击，输入 `1`。设置上述信息后，程序会自动启动。几秒后：\n\
    4) 当用户连接接入点时，`Easy-creds` 自动分配 IP 地址给客户端。\n5) 恢复数据，选择 `4`。显示的信息如下：`choice : 4`。\n\
    6) 恢复数据，选择 `3`。显示如下：\n7) `ettercap` 日志文件保存在：`/root/easy-creds-master/ettercap-2019-07-24.1722/ettercap2019-024`。\n\
    8) 此时 `ettercap` 时间。\n\n# 攻击路由器\n上述工具都可以直接破解无线网络密码。因为在网络环境中路由器是最重要的设备。通常用户会设置复杂的密码，利用漏洞进行破解。本节描述了使用\
    \ `Router` 工具实施攻击。从界面上看到许多路由器，如 `D-Link`、`Huawei`、`Netgear`。根据你的目标路由器选择 `TP-Link`，界面显示了不同类型的\
    \ TP-LINK 路由器。点击 `[SET IP]` 按钮弹出对话框。\n2) 在对话框中输入路由器用户名和密码。默认密码是 `admin`。\n3) 此时界面可以执行查看路由器信息，如路由表和\
    \ NAT。或者简单点击右侧栏查看信息。这也是 `interface`。\n\n## ARPSPOOF\n`ARPSPOOF` 是一个很好的 ARP 源程序。它的操作不影响整个网络通信，通过替换数据传输来实现目标。本节描述了使用\
    \ `ARPSPOOF` 工具。\n\n## URL 操控攻击\nURL 操作与规则类似：\n```bash\nalert tcp any any -> 10.232.2.1\
    \ 80 (msg:\"Telnet Login\";sid:23434)\nalert icmp any any -> 10.232.2.1 any (msg:\"\
    ICMP PING\";sid:8845463)\n```\n1) 使用 `ARPSPOOF` 注入攻击网关：\n```bash\n# arpspoof -i\
    \ eth0 -t 192.168.6.332 192.168.6.235\n```\n输出显示攻击者发送到目标主机的数据包。`503946` 代表攻击者的\
    \ MAC 地址；`fe5` 代表 `192.168.6.335` 的地址。当上述过程成功后，目标主机 `192.168.6.332` 将数据发送网关。\n\
    2) 使用 `ARPSPOOF` 注入攻击：\n```bash\n# arpspoof -i eth0 -t 192.168.6.235 192.168.6.332\n\
    ```\n输出显示攻击者发送到网关的数据包。`34` 代表攻击者的 MAC 地址；`fe` 代表网关的地址。`3` 是以下：\n`17:32:34` Client\n\
    `18:AB:56:F0:62:AF` 关联(WEP) 到 ESSID: \"itsnetwork\"\n\n# 端口重定向攻击\n端口重定向也称为端口转发或端口映射。接收端口数据包（如端口\
    \ 80）并将其流量重定向到不同端口（如端口 8080）的过程。这种攻击的益处是将流量重定向到给定设备的未加密端口。本节描述了使用 `Arspoof` 进行端口重定向。\n\
    1) 开启转发：\n```bash\n# echo 1 >> /proc/sys/ipv4/ip_forward\n```\n2) 使用 `arpspoof`\
    \ 向默认网络注入流量。例如，网关地址是 `192.168.6.332`。执行命令：\n```bash\n# arpspoof -i eth0 192.168.6.332\n\
    ```\n3) 在 Kali Linux 上执行上述命令后没有输出。这是因为 DSNIFF 包在系统中的版本。\n4) 为端口重定向添加防火墙规则：\n```bash\n\
    # iptables -t nat -A PREROUTING -p tcp --destinationport 80 -j REDIRECT --to-port\
    \ 8080\n```\n当上述设置成功后，用户向网关 `192.168.6.80` 发送请求。\n\n# 捕捉和监控无线数据\n使用中间人攻击，Kali\
    \ Linux 操作系统可以位于目标主机和路由器之间。通过这种方式，用户可以从路由器获取所有数据。本节描述了使用中间人工具捕捉和监控无线数据。\n1) 开启路由器功能。执行命令：\n\
    2) 使用 `arpspoof` 命令攻击主机。执行命令：\n```bash\n# arpspoof -i eth0 -t 192.168.6.332 192.168.6.235\n\
    ```\n执行上述命令后，输出显示：`192.168.6.332`（目标主机）收到的网关的 MAC 地址是 `00`。\n3) 修改 ARP 缓存表。执行命令：\n\
    ```bash\n# snarf -i eth0\n```\n输出显示了目标主机访问互联网。\n4) 用户也可以使用 `driftnet` 捕获图像。执行命令：\n\
    ```bash\n# driftnet -i eth0\n```\n执行上述命令后，窗口打开，目标主机访问页面。\n5) 当扫描网络时，按 `CTRL +\
    \ C` 停止。消息如下：\n```bash\n# wifite -i eth0\n```\n输出显示有五个接入点。输出中显示总共七列：接入点编号、Essid\
    \ 号、通道、加密模式、功率、是否开启 WPS 以及客户端。如果只有一个客户端连接，它就会出现。\n\n# 渗透测试\n渗透测试遵循特定的策略和指南，类似于其他方法。测试的操作由方\
    \ A 负责，而方 B 负责执行。测试的目标是识别漏洞并提供适当的保护措施。渗透测试，简称为 PT，分为：\n- 单节点（Single）：例如，提供特定服务的网站，攻击仅限于网站。\n\
    - 服务器（Server）：对于提供一个或多个服务的计算机，方法取决于提供的服务。\n- 农场（Farm）：有时方 A 想要尽可能在模拟攻击上下文中。\n\
    - 全系统（System-wide）：测试所有相关系统。概念与分段相同。\n- 人员（Personnel）：系统或应用程序通常由专门人员处理。在安全意识上，人员应高于平均水平。\n\
    - 所有机构（All institutions）：测试所有资产，因为范围太宽，很难进行全面的评估。\n- 健康检查（Health check is not\
    \ an attack）：渗透测试是为了尽早发现漏洞。作为改进的基础，测试必须考虑系统的持续操作。\n\n## 方法\n- 黑盒（Black box）：方\
    \ B 只知道目标的名称或 URL。其他信息必须在测试活动期间自行收集。使用黑盒测试是方 B 的技能，因为它接近真实的攻击。\n- 白盒（White Box）：方\
    \ A 将尽可能提供目标信息，方 B 可以专注于寻找系统的漏洞（漏洞），并使用白盒测试测试系统的保护能力。\n- 灰盒（Gray box）：当然，有时方 A\
    \ 不向测试目标（如外包开发的系统）提供完整信息。方 B 无法提前获取系统信息，但方 A 仍协助方 B 获取尽可能等的信息。盒子处于黑和白之间。\n- 双黑盒（Double\
    \ black box）：有时方 A 想要在模拟攻击上下文中尽可能测试。不仅要测试系统的保护能力，还要测试其人员的警觉性或弹性。秘密地委托方 B 进行渗透操作，相关人员不知道渗透测试，方\
    \ B 无法获取系统的详细信息。因此，进攻和防御双方在黑暗中竞争，这被称为双黑盒（或双盲）测试。\n- 双白盒（Double white box）：与双黑盒不同，双方彼此存在。\n\
    \n## 为什么公司需要渗透测试？\n系统上线服务，黑客会继续尝试攻击。为了保护组织，测试是为了：\n- 信息不当泄露或篡改\n- 网络架构设计问题\n-\
    \ 防火墙设置问题\n- 系统和应用程序漏洞\n- 评估同等能力的入侵者需要多久\n- 入侵实施评估\n- 加强系统安全\n- 减少入侵后的损失\n\n##\
    \ 本书涵盖了什么？\n- 破解都是关于保护。\n- 编程总是反向的。\n- 破解是关于构建。\n- 破解是关于破坏。\n- 破解是关于自动化。\n- 漏洞赏金猎（Bug\
    \ bounty hunting）。\n- 使用 Kali Linux 破解。\n- Kali 初学者和破解工具的完整指南。\n- 计算机破解工具。\n-\
    \ 脚本编写对黑客是必要的。\n\n# 引言\n恭喜下载破解工具，并感谢你这样做。接下来的章节将详细讨论破解过程，让乐于掌握破解的人能够理解这种方法论。使用\
    \ Kali Linux 破解是一个许多人使用的著名操作系统。\n\n# 第 1 章：破解过程与 Kali 安装\n本章向我们解释了初学者应该掌握的破解过程。虽然实用性较差，但本章将带你开始如何安装\
    \ Linux。\n\n## 黑客必备要素\n1) 了解大量的英语：学习英语对黑客很重要，因为现在大多数材料都是英文的。因此，黑客应该尝试阅读英语材料，使用英语软件，并关注外国安全网站。\n\
    2) 学习基础软件的使用：这里提到的基础软件指的是两个内容。一个是我们每天使用的常用命令，如 `ftp`、`ping`、`net`。另一方面，我们必须学习破解工具。这主要包括端口扫描器、漏洞扫描器、信息拦截工具和密码破解工具。由于这些软件种类繁多且功能不同，本书将介绍几种软件的使用方法。学习基本原理后，学习者可以选择自己的工具或创建自己的工具以更好地理解网络结构。\n\
    3) 初步了解网络协议和工作原理：所谓的“初步理解”是“获取自己的理解”。因为涉及的协议很复杂，如果一开始深入研究会极大地打击热情。建议学习者初步了解 `TCP/IP`\
    \ 协议，特别是网络在浏览网页时如何交换信息，以及服务器如何响应。\n4) 熟悉几种流行的编程语言和脚本：如上所述，不需要学习者深入学习，只要他们理解语言的执行结果。建议学习者最初学习\
    \ `python`、`asp` 和 `cgi` 脚本语言，并初步了解 `html`、`php`、`java` 等。你需要主要关注语言的变量和数组部分，因为这些语言之间存在固有的连接。建议学习者学习\
    \ `C` 语言和 `html` 语言。\n5) 熟悉 Web 应用：Web 应用包括各种服务器守护进程，如 `ftp`、`Apache` 和其他服务器背景。有很多流行的论坛。条件学习者应该将自己的电脑设置为服务器，然后安装并运行\
    \ `php` 代码。经过一些尝试后，他们将对网络工作原理有合理的理解，这比理论学习要容易得多。\n\n## 破解前需要掌握的重要概念\nI. 协议\n网络是信息交换的地方。所有连接到网络的计算机通过物理连接交换信息。物理设备包括最常见的电缆、光纤、无线接入点\
    \ (WAPs) 等。然而，仅仅拥有这些物理设备是不够交换信息的，还需要大脑控制的软件环境。这被称为“协议”。不同的计算机根据相同的协议进行通信。如果没有控制表，谁可以理解加密代码的内容。例如，`RFC1459`\
    \ 协议允许 `IRC` 服务器与客户端通信。\n\nII. 服务器和客户端\n最简单的网络形式是几台计算机作为客户端。每个客户端都有发送请求的能力，而服务器响应。这与点对点连接。\n\
    \nIII. 系统和环境\n必须安装操作系统。流行的操作系统有 `UNIX`、`Linux`、`Mac`、`BSD`、`Windows2000`、`Windows95/98`\
    \ 以及 `Windows NT`。这些操作系统运行独立的文件管理、内存管理和其他机制。这些操作系统可以作为服务器或客户端。\n\nIV. IP 地址和端口\n\
    每个连接到网络的计算机都有唯一的 IP 地址，类似于家庭地址。每个计算机可以打开 65535 个端口，数量很大。网络经常使用几十种协议，如浏览器端口 `80`、聊天端口\
    \ `667`。\n\nV. 漏洞\n漏洞是程序中的情况。例如，最简单的“弱密码”意味着系统漏洞。由于程序设计的缺陷，导致了溢出。本章的意义是漏洞。黑客利用这些漏洞完成各种攻击。\n\
    \nVI. 加密和解密\n我们在“协议”中提到了加密，因为网络问题。加密是信息在网络上传输的加密数据。只有知道密码的人才能解码工作。最长使用网络上是设置个人密码，使用\
    \ `DES` 加密锁，这两种加密方法可以完成用户登录系统、网站、邮箱和保护信息包。黑客想要做的是通过漏洞。\n\nVII. 木马\n木马是由程序员设计的程序。但无论用户是否理解，木马都被用于复制。根据某些人的观点，病毒不是故意损坏，木马无论如何定义，许多人使用木马来描述无法复制的恶意程序。\n\
    \n## 软件分类\n1. 预防：这是一类涉及安全角度的软件，如防火墙、病毒检查软件、系统进程监控、端口管理程序等。这种类型的软件最大化计算机用户的安全隐私。\n\
    2. 信息收集：信息收集类型包括端口扫描、漏洞扫描、弱密码扫描以及监控、数据包截获和其他间谍软件，大部分属于邪恶。这是黑客用来获取、以及黑客的。\n\n#\
