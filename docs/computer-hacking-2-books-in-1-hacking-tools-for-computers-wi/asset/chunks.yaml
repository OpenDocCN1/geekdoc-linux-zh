    Necessity option, must be used.3) a | b (dash): Indicates that one of several
    options is used.Overview of kali Linux toolsIn this below section, we will explain
    about the different types of software''s that are available in Kali Linux operating
    system.01 - Information Collection:Regardless of penetration testing or hacking,
    you must first figure out the details of the other party that is the host. You
