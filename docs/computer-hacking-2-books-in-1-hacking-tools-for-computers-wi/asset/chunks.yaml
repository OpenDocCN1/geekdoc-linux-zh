- fmt: "\n# Description\nThese two parameters are related to John's internal brain,\
    \ and there is no direct relationship with the crack itself, so the omission is\
    \ not introduced.\n\n# Snort\n`Snort` is an open source software that is available\
    \ in kali linux and is famously known for its intrusion detection system (NIDS)\
    \ written in `C`. It Support windows, Linux platform, I prefer Linux operating\
    \ system, so learn to study `snort` on Linux. `Snort` has three modes of operation,\
    \ including sniffing, logging packets, and intrusion detection.\n\n## Snort's\
    \ rule options\nAll `snort` rule options are separated by a semicolon `;`. Rule\
    \ option keywords and their arguments are separated by a colon `:`. According\
    \ to this approach, there are `42`-rule option keywords in `snort`, which can\
    \ help us to perform various operations like sniffing and logging packets. Sky\
    \ is the limit for what we can do with `Snort` because it is so complex and useful.\
    \ \n\n- `Msg`: Print a message in the packet logs.\n- `Logto`: logs the package\
    \ to a user decided file instead of logging to standard format.\n- `Ttl`: Check\
    \ the value of `ttl` of the `ip header`.\n- `Tos`: Check the value of the `TOS`\
    \ field in the IP header.\n- `Id`: Check the fragment `id` value of the ip header.\n\
    - `Ipoption`: View the specific encoding of the IP option field.\n- `Fragbits`:\
    \ Check the segmentation bits of the IP header.\n- `Dsize`: Checks the value of\
    \ the payload size of the package.\n- `Flags`: check the value of `tcp` flags.\n\
    - `Seq`: check the value of the `tcp` sequence number.\n- `Ack`: Checks the value\
    \ of the `tcp` response (acknowledgement).\n- `Window`: Tests the special value\
    \ of the `TCP` window field.\n- `Iype`: checks the value of `icmp` type.\n- `Icode`:\
    \ check the value of `icmp code`.\n- `Icmp_id`: Check the value of the `ICMP ECHO\
    \ ID`.\n- `Icmp_seq`: Checks the value of the `ICMP ECHO` sequence number.\n-\
    \ `Content`: searches for the specified style in the payload of the package.\n\
    - `Content-list`: Search for a collection of patterns in the packet payload.\n\
    - `Offset - content`: The modifier of the option, which sets the location at which\
    \ to start the search.\n- `Depth - content`: The modifier of the option to set\
    \ the maximum depth of the search.\n- `Nocase`: Specifies that the content string\
    \ is not case sensitive.\n- `Session`: Record the contents of the application\
    \ layer information for the specified session.\n- `Rpc`: Monitors `RPC` services\
    \ for specific application/process calls.\n- `Resp`: active reaction (cut connection,\
    \ etc.).\n- `React`: responds to the action (blocking the web site).\n- `Reference`:\
    \ the external attack reference ids.\n- `Sid`: snort rule id.\n- `Rev`: the version\
    \ number of the rule.\n- `Classtype`: the rule category identifier.\n- `Priority`:\
    \ the rule priority identification number.\n- `Uricontent`: Search for a content\
    \ in the URI part of the packet.\n- `Tag`: the advanced recording behavior of\
    \ the rule.\n- `Ip_proto`: The protocol field value of the IP header.\n- `Sameip`:\
    \ Determines whether the source IP and destination IP are equal.\n- `Stateless`:\
    \ ignores the validity of the Liu state.\n- `Regex`: wildcard pattern matching.\n\
    - `Within`: The range in which the forced relationship pattern matches.\n- `Byte_test`:\
    \ Number pattern matching.\n- `Byte_jump`: Digital mode test and offset adjustment.\n\
    \n## Basic commands of snort\n1) `start snort`\n   ```bash\n   sudo snort\n  \
    \ ```\n2) `snort help` command:\n   `Snort --help`\n   ```bash\n   snort --help\n\
    \   ```\n3) `Snort` starts a specific configuration file:\n   ```bash\n   sudo\
    \ snort -i eth0 –c /example/snortexample/snort.conf -A fast -l /var/log/snort\n\
    \   ```\n4) the rules:\n   ```bash\n   alert tcp any any -> 10.232.2.1 80 (msg:\"\
    Telnet Login\";sid:23434)\n   alert icmp any any -> 10.232.2.1 any (msg:\"ICMP\
    \ PING\";sid:8845463)\n   ```\n5) `test`\n\nThat is all about the advanced hacking\
    \ tools that kali Linux offers. In the next chapter, we will discuss in detail\
    \ about wireless hacking. Before going with wireless hacking try to practice things\
    \ you have learned in this chapter. You can use web application analysis software's\
    \ like `Burp suite` to understand much more about the protocols and encryption\
    \ process to become an efficient hacker.\n\n# Chapter 5: Wireless Hacking and\
    \ penetration testing\nThis chapter in detail will explain about the wireless\
    \ attacks that can be done using kali Linux. First of all, we will give a brief\
    \ overview about different wireless network analysis tools that are famously known\
    \ to analyze the network packets. And in the next section, we will go through\
    \ `Aircrack-ng` a kali linux wireless tool that can be used to crack wifi passwords\
    \ of certain encryptions.\n\nIn this day and age, almost everyone is connected\
    \ to the Internet. Especially if you're on the road a lot, you want wireless signals\
    \ everywhere so you can do whatever you're doing. But in many cases, these wireless\
    \ signals need to be authenticated before they can be used. Sometimes you may\
    \ need the network urgently, but do not know its wireless password, this user\
    \ may be very anxious. In Kali, as it happens, there are a number of tools available\
    \ to crack the wireless network. This chapter describes the use of various penetration\
    \ testing tools to carry out wireless network attacks.\n\n## What is Sniffing?\n\
    Sniffing is a process of acquiring wireless data packets by hacking tools and\
    \ using them for malicious purposes. Sniffing is often called script kiddies method\
    \ due to its easy acquiring of the information. Although websites and Applications\
    \ have improved, their encryption abilities a lot of users can be tricked to give\
    \ out their sensitive information like passwords and one-time passwords using\
    \ sniffing techniques. `Wireshark` is a famous tool that can be used for wireless\
    \ attacks.\n\n## Wireless network sniffer tool Kismet\nIf a wireless network penetration\
    \ test is to be performed, all valid wireless access points must be scanned first.\
    \ Just in time, Kali Linux offers `Kismet`, a wireless network sniffing tool.\
    \ Use this tool to measure the surrounding wireless signal and view all available\
    \ wireless access points. This section describes sniffing a wireless network using\
    \ the `Kismet` tool.\n\n### Step 1: Launch the Kismet tool\nExecute the command\
    \ as follows\n```bash\n# kismet\n```\n### Step 2\nThe interface prompts you to\
    \ run the `Kismet` tool using the root user. At this point, select `Ok`. Right\
    \ after that, the interface prompts you to start the `Kismet` service automatically.\
    \ Selecting “Yes” here.\n### Step 3\nThe interface displays some information about\
    \ setting up the `Kismet` service. Use the default settings here and select `Start`.\
    \ The next interface shows if you want to add the undefined package resource now.\
    \ Select `Yes`.\n### Step 4\nSpecify the wireless network card interface and description\
    \ information in the interface. In `INTF`, enter the wireless card interface.\
    \ If your wireless card is already in listening mode, type `WLAN0` or `MON0`.\
    \ Other information can be left unadded. Then click the `Add` button.\n### Step\
    \ 5\nThe next interface displays information that is being sniffed for signals\
    \ in the wireless network. When running for a certain amount of time, stop the\
    \ modification. Click the `Kismet` menu option on the screen and select the `Quit`\
    \ command. Clicking `Kill` in this interface stops the `Kismet` service and exits\
    \ terminal mode.\n### Step 6\nIn the `Kismet` is shutting down section of the\
    \ above message, you will see that several log files have been closed. By default,\
    \ log files will be saved in a directory called `Root`. In these log files, the\
    \ time when the logs were generated is displayed. These times are very helpful\
    \ when running `Kismet` many times or for a few days.\n\nLet's analyze the data\
    \ captured above. Switch to the `/Root/` Directory and use the `ls` command to\
    \ view the log file generated above. Execute the command as follows:\n```bash\n\
    root@kali:~# ls Kismet -2034344-23-9-4-1.*\n```\nFrom the output, you can see\
    \ that there will be five log files with different suffix names. All the information\
    \ generated by the `Kismet` tool is stored in these files.\n- `alert`: This file\
    \ contains all warning information\n- `gps xml`: If the GPS source is used, the\
    \ relevant GPS data is saved in the file.\n- `NETTXT`: includes all collected\
    \ text output information.\n- `NETXML`: includes data in all XML formats.\n- `PCAPDUMP`:\
    \ includes packets captured throughout the session.\n\n### Analyzing Text files\
    \ for Kismet\nIn Linux, you can use a variety of text editor to open a `nettxt`\
    \ file. Open the `nettxt` file using `leafpad`. From this interface, you can see\
    \ that the `nettxt` file contains a large amount of information, listing each\
    \ wireless network. Each wireless network has a label and lists each client connected\
    \ to those wireless networks.\n\n## Aircrack-ng\n`Aircrack-ng` is a `WEP` and\
    \ `WPA` encryption tool based on the `802.11` protocol. This tool mainly uses\
    \ two kinds of attack to carry on `Wep` to break. One is the `FMS` attack, named\
    \ after the researchers who discovered the `WEP` vulnerability. The other is `Korek`\
    \ attack, which is a statistical attack And this attack is much more efficient\
    \ than FMS attack. \n\n### Breaking the WEP encrypted network\n`Wep` protocols\
    \ are a way of encrypting data that travels between devices to prevent illegal\
    \ users from eavesdropping. However, cryptanalysts have identified several weaknesses\
    \ in `Wep`, which were eliminated by `WPA` in `2003`. This section describes a\
    \ wireless network that breaks WEP. Using `Aircrack` to crack a wireless network\
    \ with `WEP`. The steps are as follows:\n\n1) Use the `airmon-ng` command to see\
    \ the wireless network interface on the current system. Execute the command as\
    \ follows:\n```bash\n# airmon-ng\n```\nThe output indicates that there is a wireless\
    \ network interface in the current system. Output: `Interface`, `Chipset`, `Driver`,\
    \ `Wlan0`.\n\n2) Try to change the MAC address of the wifi system or device. Because\
    \ the MAC address identifies the host's network, modifying the MAC address can\
    \ hide the real address. You need to stop the interface before changing the MAC\
    \ address. Execute the command as follows:\n```bash\nroot@kali:~# airmon-ng stop\
    \ wlan0\n```\nAfter executing the above command, `WLAN0` interface stops. At this\
    \ point you can try the command:\n```bash\nroot@kali:~# macchanger --mac 22:33:44:55:66\
    \ wlan0\n```\nPermanent MAC: `00:c1:39:76:05` (unknown)\nCurrent MAC: `00:c3:40:77:0e`\
    \ (unknown)\nNew MAC: `22:33:44:55:66` (unknown)\n\n3) Use the `airodump-ng` command\
    \ to locate all wireless networks in the vicinity. Execute the command as follows:\n\
    ```bash\n# airodump-ng wlan0\n```\nShows all available wireless networks in the\
    \ vicinity. When you find the wireless router the user wants to attack, press\
    \ `C` to stop the attack. You can see from the output that there are several parameters:\n\
    - `BSSID`: Wireless address\n- `PWR`: Signal Level reported by network card\n\
    - `BEACONS`: Number issued wirelessly\n- `Data`: The number of packets captured,\
    \ including broadcast packets\n- `Ch`: Channel Number (obtained from Beacons)\n\
    - `Essid`: refers to the so-called SSID\n- `Rate-FRAMES`: Number of packets sent\
    \ by the client\n\n4) Use `airodump-ng` to capture a file that specifies a BSSID.\
    \ Execute the command as follows. options commonly used for `airodump-ng` are\
    \ shown below:\n- `C`: Specify the channel\n- `-W`: Specify a file name to hold\
    \ captured data\n- `-b`: specifies the `BSSID` of the attack\n\n5) Open a new\
    \ terminal window and run the `aireplay-ng` command. The Syntax Format for `aireplay-ng`\
    \ is as follows:\n`aireplay-ng -1 0 -a [BSSID] -h [our Chosen MAC address] -e\
    \ [ESSID] [Interface]`\n`aireplay-ng -dauth 1-a`\n\n6) Use `aireplay-ng` to send\
    \ some traffic to the wireless router so that data can be captured. The Syntax\
    \ format is as follows: `aireplay-ng 3 -b [BSSID] -h [Our chosen MAC address]\
    \ [Interface]`\n```bash\nroot@kali:~# aireplay-ng -3 -b 16...\n```\nThe output\
    \ is to use ARP Requests to read ARP Requests, at this point back to the `airodump-ng`\
    \ interface, you can see the `Test` column in the number of rapid increase. After\
    \ grabbing a certain number of wireless datagrams, the `IVX` value is above `20,000`\
    \ and can be cracked. If that doesn't work, wait for the data to continue grabbing\
    \ and try again.\n\n7) Using `Aircrack` to crack a password. Execute the command\
    \ as follows:\n```bash\naircrack-ng -b xx:mac attack.cap\n```\nFrom the output,\
    \ you can see the `KEY FOUND`, that the password has been FOUND.\n\n# Attack WPS\
    \ (Wi-Fi protected Setup)\n`WPS` is a new Wi-Fi security standards introduced\
    \ by the Wi-Fi consortium. The standard is mainly to solve the wireless network\
    \ encryption authentication set too complicated of the disease. Because the user\
    \ often because the setting step is too troublesome, do not make any encryption\
    \ security settings, resulting in many security problems. So many people use `WPS`\
    \ to set up wireless devices that can replace entering a long password phrase\
    \ with a `PIN` or a button (`PBC`). When this feature is enabled, an attacker\
    \ can attack `WPS` with a violent attack method. This section describes the various\
    \ tools used to attack WPS.\n\n## Using reaver to break WPS.\nThe steps are as\
    \ follows:\n1) Insert the wireless card and use the `IFCONFIG` command to see\
    \ if the wireless card has been inserted correctly. Execute the command as follows:\n\
    ```bash\n# ifconfig\n```\n2) Activate the Wireless Network Card to monitor mode.\
    \ Execute the command as follows:\n```bash\n# airmon-ng wlan0\n```\nNote: execute\
    \ the above command to start listening mode, be sure to correctly identify the\
    \ wireless card chip and driver. Otherwise, the wireless network card may cause\
    \ the attack to fail.\n3) Attacking WPS. Execute the command as follows:\n```bash\n\
    root@kali:~# reaver -i mon0 -b 14:E6:E4:DE:FB:20 -vv\n```\nOutput: From the above\
    \ output, you can see that you are waiting for a signal to connect to the `14E4FB:20`\
    \ wireless router. And get the password by sending a `PIN`.\nIf no router is enabled\
    \ and `WPS` is not enabled, the following information will appear:\n`[!] WARNING:\
    \ Failed to associate with 14:E6:E4:DE:FB:20 (ESSID: XXXX)`\n\n## Fern wifi cracker\n\
    `FERN WiFi Cracker` is a great tool for testing wireless network security. This\
    \ tool is used to attack Wi-Fi networks. The first step here is to use the `FERN\
    \ WIFI Cracker` tool to attack WPS.\n\n## Attacking WPS with Wifite.\nThe steps\
    \ are as follows:\n1) Start the `wifite` tool and specify the use of `common`\
    \ `txt`. The Command Line:\n```bash\nroot@kali:~# wifite -dict.txt\n```\nThis\
    \ information shows the version of `wifite`, support for the platform, and the\
    \ beginning of `wifite` scanning. When scanning the network you want to jailbreak,\
    \ press `CTRL + C` to stop.\n2) Stop scanning. The message shown below will be:\
    \ From the above output, you can see the scan has five access points. In the output,\
    \ total of seven columns are displayed. Indicate access point number, `Essid`\
    \ number, channel, encryption mode, power, whether to open `WPS` and client. If\
    \ only one client is connected, it appears.\n3) At this point, select the access\
    \ point to attack. Select the fifth access point here and type `1`. Then enter\
    \ to begin the attack, and the message shown as follows:\n```bash\nroot@kali:~#\
    \ wifite 1-5\n```\n(target numbers separated by commas, or 'all').\n\n## GERIX\
    \ WIFI CRACKER\n`Gerix Wifi Cracker` is another graphical interface crack tool.\
    \ This section describes how to use it to crack `WEP` and `WPA2` encrypted networks.\
    \ Using `Gerix` to automatically attack a wireless network. The steps are as follows:\n\
    1) Start the `Gerix` tool. Execute the command as follows:\n```bash\nroot@kali://usr/share/gerix-wifi-cracker#\
    \ python gerix.py\n```\nAfter executing the above command, the interface appears.\
    \ The `Gerix` database has successfully loaded.\n2) From the interface, you can\
    \ see that there is only one wireless interface. Switch to the `Configuration`\
    \ tab, select `wlan1` and click `Enable/Disable Monitor Mode` button.\n3) When\
    \ the listening mode is started, `WLAN1` has successfully started. Select `MON0`\
    \ with the mouse, click `Rescan` button.\n4) From the interface, you can see all\
    \ wireless networks near. Select the target network, and click `Attack`.\n5) This\
    \ interface is used to configure `WEP` related information. The `General` section\
    \ is used to configure.\n6) The interface shows how `WEP` can be attacked. Under\
    \ the `Sniffing and Logging` button, click `Start Sniffing` button.\n7) If the\
    \ attack is successful, the gateway `192.168.6.332` sends data to the attacker.\n\
    8) This section describes the use of the `Chop` attack. The interface is the process\
    \ of fetching the packet. When the `AP` is captured, the `Chop` is used to create\
    \ a file named `.Cap`.\n9) If the attack is successful, the gateway is the the\
    \ attack. This section describes the use of the `Chop` attack. The interface is\
    \ the process of fetching the packet. When the `AP` is captured, at this point,\
    \ the input `y` will begin to capture the data, generating a file named `.Cap`.\n\
    10) Ask if you want to use the packet? After entering `Y`, it will grab a large\
    \ number of packets. When the number of packets captured reaches `20,000`, click\
    \ the `Cracking` tab to display.\n11) From the interface, we can see the common\
    \ time for cracking `WEP` is 3 minutes.\n\n## Creating fake access points using\
    \ Gerix\nUsing the `Gerix` tool, you can create and establish a access point (AP).\
    \ Setting up a fake access point can trick the user into visiting the access point.\
    \ Here, the steps are as follows: fine1) Launch the `Gerix` tool. Execute the\
    \ command as follows:\n```bash\nroot@kali:/usr/share/gerix-wifi-cracker# python\
    \ gerix.py\n``````\n2) Switch to the `Configuration` tab. Select the wireless\
    \ interface, change the channel of the network, and also change it to a `honeypot`.\
    \ After the above information is set up, the other configurations will remain\
    \ the default settings. Then click the `Fake AP` button.\n3) When a user connects\
    \ to the network AP created, the interface outputs the information shown below:\n\
    `17:32:34` Client\n`18:AB:56:F0:62` associated(WEP) to `ESSID`: \"itsnetwork\"\
    \n\n## Jailbreaking wireless networks using Wifite\nSome jailbreaking network\
    \ programs use the `Aircrack-ng` toolset and add a graphical interface or use\
    \ text menus to jailbreak networks. This makes it easier for the user to use without\
    \ having to remember any commands. This section describes the use of the command-line\
    \ tool `Wifite` to scan and attack networks.\n```bash\n# wifite\n```\nThe message\
    \ shown below will be displayed. From the above information, you can see the scan\
    \ to 13 access points.. Choose the target of attack. The second access point selected\
    \ here is encrypted in WEP select target numbers (1-13) separated by commas, or\
    \ 'all'.\n\n## Use the Easy-Creds tool to attack wireless networks\n`Easy-creds`\
    \ is a menu-style cracking tool. The tool allows users to open a wireless network\
    \ card and implement a wireless access point platform. `Easy-creds` can create\
    \ a spoofing access point and run as a man-in-the-middle attack type to analyze\
    \ a user's data flow and account information. It can recover accounts from SSL\
    \ encrypted data. This section describes using the `Easy-Creds` tool to attack\
    \ wireless networks.\n1) Start the `Easy-Creds` tool. Execute the command as follows:\n\
    ```bash\nroot@localhost:~/easy-creds-master#./easy-creds.sh\n```\n2) Choose `pseudo-AP`\
    \ attack here, enter number `3`. The information will be displayed: `Choice: 3`\n\
    3) Here you choose to use a static pseudo-AP attack, enter number `1`. The following\
    \ information will be displayed: `choice : 1`\nAfter setting up the above information,\
    \ some programs will be started automatically. After a few seconds, several valid\
    \ windows will open\n4) When a user connects to a Wifi access point, `Easy-Creds`\
    \ automatically assigns an IP address to the client and has access to the Internet.\
    \ If you access a secure web site on the Internet, the tool will remove SSL, remove\
    \ the secure connection, and run in the background. Therefore, it is possible\
    \ to read the username and Password of a Web site logged in by the client.\n5)\
    \ Select data recovery from the main menu of `Easy-creds` and enter number `4`,\
    \ as follows: `choice : 4`\n6) After selecting data recovery, the information\
    \ shown below will be displayed:\n7) Select here to analyze the `ETTERCAP` ECI\
    \ file and enter number `3` to display the following information: Enter the full\
    \ path to your `ETTERCAP. ECI LOG FILE`: From the output, you can see where the\
