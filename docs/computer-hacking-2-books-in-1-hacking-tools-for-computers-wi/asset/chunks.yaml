    start, stop and restart for this service.a) startThis starts the logging function
    allover again.root@kali: service rsyslog startb) stopThis stops the logging function
    in a split of a second.root@kali: service rsyslog stopc) RestartThis will first
    stop the logging function and will start again as a new variable.root@kali: service
    rsyslog restartAutomating tasks with job schedulingAs a hacker, the most important
