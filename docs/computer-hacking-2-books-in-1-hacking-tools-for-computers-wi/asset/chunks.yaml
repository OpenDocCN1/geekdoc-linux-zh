  raw: ' The commonly used options for the crunch command are as follows.


    *   -o: Used to specify the location of the output dictionary file.


    *   -b: Specifies the maximum number of bytes to write to the file. This size
    can be specified in KB, MB or GB, but must be used with the -o START option.


    *   -t: Sets the special format to use.


    *   -l: This option is used to identify some characters of the placeholder when
    the -t option specifies @, % or ^.


    (2) Create a password list file and save it on the desktop. The minimum length
    of the generated password list is 8, the maximum length is 10, and ABCDEFGabcdefg0123456789
    is used as the character set. Execute the command as follows:root@kali:~# crunch
    8 10 ABCDEFGHIJKLMabcdefghijklm0123456789 –o /root/Desktop/From the information
    output above, it can be seen that a file of 659 TB will be generated, for a total
    of 661,552,638,197,716 lines. After the above command is executed, a dictionary
    file named generatedCrunch.txt will be generated on the desktop. Since the combination
    generates more passwords, it takes a long time.(3) After the above password dictionary
    file is generated, use the Nano command to open it. Execute the command as follows:root@kali:~#
    nano /root/Desktop/generatedlist.txtAfter executing the above command, the generatedlist.txt
    file will be opened. All passwords generated using the crunch command are saved
    in this file.RtgenThe rtgen tool is used to generate rainbow tables. The rainbow
    table is a large collection of pre-computed hash values for various possible combinations
    of letters. The rainbow table is not necessarily for the MD5 algorithm. There
    are various algorithms, and it can quickly crack all kinds of passwords. The more
    complex the password, the bigger the rainbow table is, and now the mainstream
    rainbow table is 100G or more.Use the rtgen tool to generate a rainbow table.
    The specific steps are as follows:(1) Switch to the rtgen directory. The execution
    commands are as follows.root@kali:~# cd /usr/share/rainbowcrack/Use the rtgen
    command to generate a rainbow table based on MD5\. Execute the command as follows:root@kali:/usr/share/rainbowcrack#
    ./rtgen md5 loweralpha-numeric 1 5 0 3800 33554432 0The above information shows
    the parameters and generation process of the rainbow table. For example, the generated
    rainbow table file is named.md5_loweralpha-numeric#1-5_0_3800x33554432_0.rt; the
    table is encrypted using the MD5 hash algorithm and the character set abcdefghijklmnopqrstuvwxyz0123456789
    is used.(3) In order to easily use the generated rainbow table, use the rtsort
    command to sort the table. Execute the command as follows:root@kali:/usr/share/rainbowcrack#
    rtsort md5_loweralpha-numeric#1- 5_0_John the ripperThis is a famous password-cracking
    tool that is used to crack passwords and other stuff. Web hacking is the most
    important phase of hacking and you need to understand it in detail for better
    results.John the Ripper''s four [crack](http://www.2cto.com/Article/jiami/) modes:1)
    Dictionary File" (Wordlist Mode) This is the simplest one in John''s supported
    crack mode. The only job you have to do is to tell John where the dictionary file
    is (the dictionary file is the text file, and the content is one word per line).
    Represents the trial password) so that it can be extracted and cracked. In the
    "dictionary file" crack mode, you can use the "word change" function to automatically
    apply these rules to each read word to increase the chance of cracking.2) Single
    Crack Mode“The "Simple" crack mode is designed for lazy people who use "accounts
    as passwords". The so-called "use an account as a password" means that if a user
    account is “John", its password is also taken as "john". In the "simple" crack
    mode, john will use the "account" field in the password file to crack the password,
    and use a variety of "word change" rules to apply to the "account" to increase
    the chance of cracking. For example, the account "john" will try to use the "john",
    "john0", "njoh", "j0hn", etc. rule changes to try the password.3) Incremental
    ModeThis is John''s most powerful cracking mode. It automatically tries all possible
    combinations of characters and then cracks them as passwords. The time required
    for this crack mode is very lengthy, because trying to combine characters is very
    time consuming, so John will define some "character frequency tables" to help
    crack. In short, this method of cracking is the "violence method", testing all
    possible combinations of passwords to get the correct results.4) The "External
    Mode" crack mode (External Mode) is a crack mode that allows users to write some
    "crack module programs" in C language and then use them in John. In fact, the
    so-called "cracking module program" is a sub-declaration designed in C language,
    and its function is to generate some words for John to try to crack.When executing
    the John program, it automatically compiles these C language sub-presentations
    when loading these "crack module programs" and then uses them.John the Ripper
