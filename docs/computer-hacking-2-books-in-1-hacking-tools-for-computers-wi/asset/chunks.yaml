    you click enter the process goes on and you will find something like shown below.[*]
    192.232.2.1:2234 - Sending Vulnerabiltyname1[*] 192.232.2.1:2234 - 343 bytes sent[*]
    192.232.2.1:2234 - Checking RDP status...[+] 192.232.2.1:2234 seems down[*] Auxiliary
    module execution completedMeterpreterIn the new version after Metasploitv4, Meterpreter
    acts as an implementation channel for the post-penetration attack module and can
    be flexibly extended according to the requirements of the penetration test.Scope:
    Information collection, password retrieval, authority enhancement, intranet expansion,
    etc.Meterpreter Advantages1\. Platform versatility provides meterpreter versions
    on various major operating systems and platforms, including windows, Linux, and
    BSD, and supports both x86 and x64 platforms. There are also implementations based
    on the Java and php languages to handle different environments.2\. Pure memory
    working mode work directly load the meterpreter dynamic link library to the target
    process space, instead of uploading to disk first, then call load library to load
    the dynamic link library to start. This starts the concealment, it is difficult
    to be detected by the anti-virus software, and will not leave any traces on the
    target host disk.3\. The flexible and encrypted communication protocol adopts
    the TLV (type length value) data encapsulation format; the communication data
    is XOR-encrypted, and then the OpenSSL library is called for SSL encapsulation
    transmission to ensure the confidentiality and concealment of the transmission.4\.
    Easy to extend Meterpreter plug-ins in the form of dynamic link library files,
    you can choose your favorite programming language to write the functions you need
    according to the interface of Meterpreter, and then compile into a dynamic link
    library, copy to the appropriate directory.Meterpreter Commandsa) Basic command
    (including the meterpreter and msf terminal, ruby interface, the target shell
    interaction command)(i) BackgroundThis is used when process is hidden in the background.(ii)SessionsView
    sessions that have been successfully acquired, -i resume sessions)(iii)QuitThis
    command can be used to close the current session.(iv)ShellGet the system console
    shell, if the target system command line executable does not exist or prohibit
    access, the shell command will be wrong(v)IrbInteract with the Ruby terminal,
    call the metasploit packaged function; in the irb you can also add the metasploit
    add-on railgun to interact directly with the windows native API.2) File system
    commands (interact with the target file system, including viewing, uploading,
    downloading, searching, editing)(i)Cat (target system file interaction)(ii)Getwd
    (get the current working directory of the target machine, getlwd local current
    working working directory)(iii)Upload (upload file or folder to target -r recursive)(iv)Download
    (download files or folders from the target machine -r recursively)(v)Edit (call
    vi editor to edit the file on the target)(vi)Search (search for files on the target
    machine)3) Network commands (view the target network status, connection information,
    port forwarding, etc.)(i)Ipconfig (get the network interface information on the
    target host)(ii)Portfwd (port forwarding: forwarding the port that the target
    host is open but not allowed to access)(iii)Route (display destination host routing
    information)4) System commands (view target system information, basic operations
    on the system, etc.)(i)Ps (view the progress information of the target machine
    running)(ii)Migrate (migrate the meterpreter session process to another process
    memory space)(iii)Execute (execute the file on the target machine)(iv)Getpid (the
    pid value of the process in which the current session is located)(v)Kill (end
    the specified pid program)(vi)Getuid (get the current session username)(vii)Sysinfo
    (get system information)(viii)Shutdown (turn off the target host)Metasploit V4.0
    officially introduces a post-infiltration module whose format is consistent with
    the penetration attack module and is located in the post/ directory for special
    or custom functions.The scope includes: privilege escalation, information theft,
    password capture and utilization, intranet expansion, tracing, and maintenance.Msf
    payloadThe attack payload (msfpayload) is the code we expect the target system
    to execute after being hacked. It can be freely selected, transmitted, and implanted
    in the metasploit framework.Use the command "msfpayload -l" to view the list of
    attack payloads:# msfpayload -lOutput:Name              DescriptionPayload name       Payload
    description(Will be for different categories like HTTP, HTTPS, and IPV6)Below
