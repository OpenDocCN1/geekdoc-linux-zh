    \ the generated password list is 8, the maximum length is 10, and `ABCDEFGabcdefg0123456789`\
    \ is used as the character set. Execute the command as follows:\n\n```bash\nroot@kali:~#\
    \ crunch 8 10 ABCDEFGHIJKLMabcdefghijklm0123456789 –o /root/Desktop/\n```\n\n\
    From the information output above, it can be seen that a file of 659 TB will be\
    \ generated, for a total of 661,552,638,197,716 lines. After the above command\
    \ is executed, a dictionary file named `generatedCrunch.txt` will be generated\
    \ on the desktop. Since the combination generates more passwords, it takes a long\
    \ time.\n\n### (3) Open the dictionary file\nAfter the above password dictionary\
    \ file is generated, use the `nano` command to open it. Execute the command as\
    \ follows:\n\n```bash\nroot@kali:~# nano /root/Desktop/generatedlist.txt\n```\n\
    \nAfter executing the above command, the `generatedlist.txt` file will be opened.\
    \ All passwords generated using the `crunch` command are saved in this file.\n\
    \n# rtgen\nThe `rtgen` tool is used to generate rainbow tables. The rainbow table\
    \ is a large collection of pre-computed hash values for various possible combinations\
    \ of letters. The rainbow table is not necessarily for the MD5 algorithm. There\
    \ are various algorithms, and it can quickly crack all kinds of passwords. The\
    \ more complex the password, the bigger the rainbow table is, and now the mainstream\
    \ rainbow table is 100G or more.\n\nUse the `rtgen` tool to generate a rainbow\
    \ table. The specific steps are as follows:\n\n### (1) Switch to the `rtgen` directory\n\
    The execution commands are as follows:\n\n```bash\nroot@kali:~# cd /usr/share/rainbowcrack/\n\
    ```\n\n### (2) Use the `rtgen` command\nGenerate a rainbow table based on MD5.\
    \ Execute the command as follows:\n\n```bash\nroot@kali:/usr/share/rainbowcrack#\
    \ ./rtgen md5 loweralpha-numeric 1 5 0 3800 33554432 0\n```\n\nThe above information\
    \ shows the parameters and generation process of the rainbow table. For example,\
    \ the generated rainbow table file is named `.md5_loweralpha-numeric#1-5_0_3800x33554432_0.rt`;\
    \ the table is encrypted using the MD5 hash algorithm and the character set `abcdefghijklmnopqrstuvwxyz0123456789`\
    \ is used.\n\n### (3) Sort the rainbow table\nIn order to easily use the generated\
