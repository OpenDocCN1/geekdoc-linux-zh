    the failure to lock the account several times, some even add a graphic verification
    code to automate the tools you are trying to log in are useless. Another One is
    offline cracking, but the key point is to get the password information first,
    that is, to find the user data from the system. In practice, you usually look
    for SQL Injection vulnerabilities, in order to dump the user''s account information
    from the database, but the passwords should be encrypted, you need to Use the
