    select the column we need, click the save button to save the attack results. You
    can also set the contents of the saved pair.Payload type and processingA total
    of 18 kinds1\. Simplelist:By configuring a string list as a payload, you can also
    manually add a string list or load a string list from a file.2\. Runtimefile:The
    specified file, as corresponding Payload on the location Payload list. At runtime,
    Burp Intruder will read each line of the file as a Payload.3\. Customiterator
    :A powerful Payload with a total of 8 placeholders. Each placeholder can specify
    a simple list of Payload types. Then, according to the number of places, a Cartesian
    product is generated with each simple list of Payload to generate a final Payload
    list.For example, the value format of a parameter isUsername@@password, the steps
    to set up this Payload are: location 1, select Usernames . Next, specify location
    2, enter the value @@ and finally specify location 3, and select Passwords. When
    we start the attack, the generated Payload values are as shown:4\. String replacement:As
    the name suggests, this type of Payload is to replace the predefined string to
    generate a new Payload. For example, the predefined string is ABCD. After setting
    the replacement rule as shown in the figure below, the value of AB will be enumerated
    to generate a new Payload.Then A will be replaced by 4 and B will be replaced
    by 85\. Case replacement:The generation rules are:1 NO change2To lower caser3To
    upper case4To Propername initial capitalization, other lowercase5To ProperName
    initial capitalization, others do not change6\. Recursivegrep:This Payload type
    is mainly used to extract valid data from the server side. It is necessary to
    extract data from the server response as Payload, and then replace the location
    of the Payload to attack. It comes from the original data response message, based
    on the original response, the Payload may option (the Options configuration) Grep
    rule, then according grep to extract data attacks can occur.For example, I set
    the server-side Eagle Id as the new Payload value in grep extract. After clicking
    OK, the payload settings are completed.When an attack is launched, Burp analyzes
    each response message. If the value of EagleId is extracted, thenA second request
    occurs as Payload.7\. Illegal unicode encoding:The payload itself is replaced
    with the specified illegal Unicode encoding in the payloads, and one or more payloads
    are generated from these Payload lists. This payload can be useful when trying
    to avoid input validation based on pattern matching.8\. Character block:This type
    of Payload refers to the use of a given input string to generate a specified size
    of the character block according to the specified settings, in the form of a string
    of the specified length. It usually uses a boundary test or a buffer overflow.9\.
    Number type:* Depending on the configuration, a series of numbers is generated
    as Payload.Type indicates whether to use a sequence or a random number.From indicates
    what number to start with, to indicates what number to cut off,* Step indicates
    how much the step size is. If it is a random number, how many is activated, indicating
    how many random numbers are generated.* Base indicates whether the number is in
    decimal or hexadecimal form.* Min integerdigits indicates what the smallest integer
    is, and Max integer digits indicates what the largest integer is.* If it is 10
    decimal, the Minfractiondigits represents the minimum number of digits after the
    decimal point, Max fraction digits represent up to several decimal numbers.10\.
    Date Type:Depending on the configuration, a series of dates is generated. The
    format can be selected from the sample format provided by Burp, or it can be customized.11\.
    Brute forcer:This type of payload generates all the payloads of a specified length
    that contain a specified character set, usually used to generate dictionary entries.Character
    set represents the data set of the generated dictionary, and characters are extracted
    from this data set for generation. Min length represents the minimum length of
    the generated Payload, and Max length represents the maximum length of the generated
    Payload.12\. Nullpayloads:This payload type produces a Payload whose value is
    an empty string. In the case of an attack, the same request is required to be
    executed repeatedly, and this Payload is very useful in the absence of any modification
    of the original request. It can be used for a variety of attacks, such as sequence
    analysis of cookies, application layer Dos, or keep alive session tokens for use
    in other intermittent trials.13\. Characterfrobber:This type of Payload is generated
    by modifying the value of the specified string at each character position in turn,
    each time incrementing the ASCII code of the character on the original character.
    It is typically used in test systems that use complex session token components
    to track session state. When you modify the value of a single character in a session
    token, your session is still processed, and then it is likely that the token is
    actually not used to track your conversation.14\. Bitflipper:The original value
    of the preset Payload is modified in order according to the bit.Setting Options:Operation:
    Specify whether to perform bit flip on the payload raw data, or specify the value
    for bit flip.Format of original data refers to whether to operate on the textual
    meaning of the original data, or should it be treated as ASCII hexadecimalSelect
    bits to flip refers to the position of the Bit that is selected for flipping.
    You can configure to operate based on textual meaning, or flip based on ASCII
    hexadecimal strings.15.  Username generator:This type of payload is mainly used
    for automatic generation of user names and email accounts. For example, I set
    the original value to 123456789 @qq.com , and then execute the payload generator,
    and the generated payload value is as shown in the figure.16.ECB blockshuffler:This
    type of Payload is a Payload generator based on the ECB encryption mode, which
    verifies whether the application is vulnerable by changing the location of the
    packet data.17\. Extension-generated plugin:This type of Payload is based on the
    Burp plugin to generate the Payload value, so you must install the configuration
    Burp plugin before use, register an Intruder payload generator in the plugin,
    which can be called here.18\. Copy another payload:This type of Payload copies
    the parameters of other locations to the Payload location. As a new Payload value,
    it is usually applied to request messages with multiple parameters. Its usage
    scenario may be: 1. Two different parameters need to be used. The same value,
    for example, when the user registers, the password setting will be entered twice,
    and the value is exactly the same, you can use this Payload type. 2\. In a request,
    the value of one parameter is based on the value of another parameter generated
    by the script in the front end. This Payload type can be used. Its setting interface
    and parameters are relatively simple, as shown in the following figure, where
    the index value of the Payload position is the value of the Payload set in the
    figure.Attack mode1\. Sniper (only one payload location can be used)Use a set
    of payloads to replace the text marked by § at the payload location (without the
    text marked by § will not be affected), requesting the server side, usually used
    to test whether the request parameters are vulnerable.2\. Battering ramIt uses
    a single Payload collection, which in turn replaces the text marked by § in the
    Payload position (the text without the § flag will not be affected), requests
    the server side, and the difference with the sniper mode is that if there are
    multiple parameters The Payload values used are the same when both are Payload
    position markers, while the sniper mode can only use one Payload position marker.3\.
    Pitchfork grassIt can use multiple sets of Payload collections to traverse all
    Payloads at each of the different Payload flag locations (up to 20). For example,
    if there are two Payload flag positions, the first Payload value is A and B, and
    the second Payload value is C and D, then when the attack is launched, two attacks
    will be initiated, and the first used Payload. A and C respectively, and the second
    used Payload are B and D respectively.4\. ClusterbombIt can use multiple sets
    of Payload collections, traversing all Payloads in turn at each of the different
    Payload flag positions (up to 20). The main difference between it and the grass-fork
    mode is the product of the Payload data Payload group that is executed. For example,
    if there are two Payload flag positions, the first Payload value is A and B, and
    the second Payload value is C and D, then when the attack is launched, a total
    of four attacks will be initiated, the first use of Payload. A and C respectively,
    the second used Payload are A and D respectively, the third used Payload are B
    and C respectively, and the fourth used Payload are respectively B and D.Optional
    options1.  Request message header is providedThis setting is mainly used to control
    the header information of the request message.Update Content-Length header if
    checked, Burp Intruder adds or updates the Content-Length header for each request
    to the correct length of the HTTP body of the request. This feature is usually
    used to attack the body of an HTTP request that inserts a variable-length Payload
    into the template. If the correct value is not specified, the target server may
    return an error and may respond to an incomplete request. Or you may wait indefinitely
    for a request to continue receiving data.Set the Connection:Close, if checked,
    indicates that Burp Intruder adds or updates a connector with a value of "closed"
    in each request message, which will be executed more quickly.2\. RequestEngine
      - mainly used to control the burst intruder attackNumber of threads ----- concurrent
    threadsNumber of Network retries ------ ON failure to a network failure, when
    the number of retriesPause before ---- retry pause interval before retryThrottle
    between---- requests request delayStarTime----- start time to happen3\. GrepMatchExtract
    result items from response messagesIf it matches, it is marked in the new column
    added in the attack result, which is convenient for sorting and data extraction.For
    example, in a password guessing attack, such as "password is incorrect" or "login
    successful", you can find a successful login; in the test SQL injection vulnerability,
    scanning messages containing " ODBC" , "error" and other messages can identify
    vulnerable parameters.4\. GrepExtractThese settings can be used to extract useful
    information from the response message. For each item configured in the list, Burp
    adds a new result column containing the text from which the item was extracted.
    You can then sort the data extracted by this column (by clicking the column header)
    command. This option is useful from application data mining and can support a
    wide range of attacks.5\. GrepPayloadsThese settings can be used to extract whether
    the response message contains the value of Payload6\. Redirection ( Redirections
    )These settings are mainly used to control the attacks a Burp how to handle the
    redirectionWe can modify the parameters of the packet here to perform message
    verification analysis of the request and response.7\. How to use the burst sequencerA
    tool for detecting the randomness quality of data samples usually used to detect
    whether the access token is predictable, whether the password reset token is predictable,
    etc., and the data sample analysis by Sequencer can well reduce the forgery of
    these key data. Risks of.Steps for usage:1\. Confirm the correct operation of
    the burpsuite, open the interception2\. From the history log of burpproxy, look
    for tokens or similar parameters (cookies, etc.), right click to pop up the context
    menu, click send to sequencer3\. Go to the live cature panel of burpsequencer,
    select the record you just sent and click configure to configure the token or
    parameter to be analyzed.4\. In the parameter configuration dialog box that pops
    up, select the value of the parameter and click ok to complete the parameter setting.5\.
    Click select live capture to start the parameter value acquisition.6\. When the
    total number of parameter values captured is greater than 100 , click [ pause
    ] or [ stop ], and then you can perform data analysis, and click [ Alylyze now
    ] to analyze the randomness of the data.7\. After the analysis is over, you can
    see the various charts of the analysis results.8\. We can also save the acquired
    data, and load the parameters from the folder for data analysis the next time
    we use it.- Click savetokens to save the data9\. When using again, directly in
    the manual load, click load ... to load the dataOptional settingsThe purpose of
    analyzing the option settings is mainly to control the token or parameters, what
    kind of processing needs to be done during the data analysis, and what type of
    randomness analysis. It consists mainly of token processing ( Token Handling )
    and token analysis ( Token Analysis ).* token handling, the main control token
    in the data analysis, how to be processed* shorttokens at start / end means that
    if the tokens generated by the application are of variable length, then these
    tokens need to be populated before data analysis to facilitate statistical testing.
    You can choose whether to fill in the starting position or the end of each token.
    In most cases, filling at the starting position is the most appropriate.* Padwith
    means you can specify the characters that will be used for padding. In most cases,
    a numeric or ASCII hex-encoded token, padded with a " 0" is most appropriate.*
    Base64-decode before analyzing indicates whether base64 decoding is performed
    in data analysis. If the token uses base64 encoding, you need to check this box.Token
    AnalysisMainly used to control the type of random analysis of data, we can select
    multiple analysis types, or you can enable or disable each character type level
    and byte level test separately. Sometimes, after performing a preliminary analysis
    with all analysis types enabled, some analysis types are disabled to better understand
    the characteristics of the token, or to isolate any unusual characteristics exhibited
    by the sample.Count:Analyzes the distribution of characters used in each position
    within the token. If it is a randomly generated sample, the distribution of characters
    used is likely to be roughly uniform.Transitions:Analyze changes between consecutive
    symbols in sample data. In the case of a randomly generated sample, the character
    appearing at a given position is a change in the next flag that may also be passed
    through any of the characters used at that position.The following settings are
    byte level tests used to control data analysis. In byte-level analysis enabled,
    each token is converted into a set of bytes, and the total number of bits determined
    by the size of the character set at each character position is determined.FIPS
    monobittestThe test analyzes the allocation of 0 and 1 at each bit position. If
    it is a randomly generated sample, the number of 1''s and 0 ''s is likely to be
    approximately equal. The FIPS test formal specification assumes a total of 20,000
    samples. If you want to get the same results as the FIPS specification, you should
    ...FIPS pokertestThe test divides the bit sequence into four consecutive, non-overlapping
    packets, then derives four numbers, calculates the number of times each number
    has 16 possible digits, and uses a chi-square check to evaluate the distribution
    of the numbers. If the sample is randomly generated, the distribution of this
    number may be approximately uniform.FIPS runs testsThe test divides successive
    bit sequences having the same value into segments at each position, and then calculates
    the length of each segment to be 1 , 2 , 3 , 4 , 5 , and 6 and 6 or more. If the
    samples are randomly generated, the length of these segments is likely to be within
    the range determined by the size of the sample set.FIPS longruns testThis test
    divides successive bit sequences with the same value into segments at each position,
    counting the longest segment. If the sample is randomly generated, the number
    of longest segments is likely to be within the range determined by the size of
    the sample set.CorrelationtestComparing the entropy between a token sample with
    the same value for each location and a short token sample with a different value
    for each location to test for any statistically significant relationship between
    values in different bit positions within the token. If the sample is randomly
    generated, the value at a given bit position is also likely to be accompanied
    by one or a zero at any other bit position.Thus, we ended this book with a bang
    after going through burp suite and quite a lot of information about web hacking.
    Now just make experiments with lot of examples and try to attack as many websites
    as possible.ConclusionThank you for making it through to the end of Book Title
    , let’s hope it was informative and able to provide you with all of the tools
    you need to achieve your goals whatever they may be.The next step is to make these
    things apply in real practical hacking life.After understanding the intrusion
    methods commonly used by hackers, it is not realistic to plan separate protection
    strategies for these methods. Therefore, users can only master the common protection
    strategies of personal computer security to ensure that the computer is in a relatively
    safe environment. Common PC protection strategies include: installing and upgrading
    anti-virus software, enabling firewalls, preventing Trojans and viruses, sharing
    folders and regularly backing up important data.The emergence of viruses has caused
    huge losses to computers on the Internet. These viruses can cause the system to
    fail to operate normally, and the system will be formatted and data will be formatted.
    In order to prevent the harm caused by these viruses, users need to install anti-virus
    software on the computer and turn on real-time monitoring. In addition, due to
    the improvement of virus production techniques and means, new viruses are constantly
    appearing, so users need to upgrade anti-virus software in time, so that anti-virus
    software can prevent new viruses in the Internet.A firewall is a method of separating
    a computer''s internal network from an external network. In fact, this is an isolation
    technique. A firewall is an access control scale that is executed when two internal
    and external networks communicate. It allows users'' licensed computers and specific
    data to enter the internal network, preventing hackers on the external network
    from accessing and attacking themselves to the maximum extent.In order to prevent
    Trojans and viruses from invading the Internet, first of all, do not download
    unidentified software and programs, select a reputable download site to download
    the program, and then put the successfully downloaded software and programs in
    addition to the system partition. Other partitions and need to use anti-virus
    software to scan downloaded programs before opening.In addition, do not open e-mails
    and attachments of unknown origin to avoid the invasion of mail viruses or bundled
    Trojans. Even if you download the attachment that came with the message, you need
    to scan it with anti-virus software.On the Internet, some hackers use "phishing"
    methods to scam, such as creating fake websites or sending e-mails containing
    fraudulent information, thereby stealing online banking, online payment tools,
    credit card accounts and passwords, and stealing funds from the account. . In
    order to prevent phishing, users must make sure that the URL of the private information
    they enter is the real URL, not the phishing website. Do not enter it at will.In
    the LAN, when users share files, there will be software vulnerabilities, and hackers
    will detect these vulnerabilities. Therefore, users must set the access password
    when setting up a shared folder. Unshared should be canceled as soon as sharing
    is not required. In addition, when setting up a shared folder, users must make
    the shared folder read-only and do not set the entire disk partition as shared.The
    importance of data backup is unquestionable, and no matter how tightly the computer''s
    preventive measures are made, it cannot completely prevent unexpected situations.
    If a hacker is fatally attacked, although the operating system and application
    software can be reinstalled, important data cannot be reinstalled, and only rely
    on daily backup work. Therefore, even if you take very strict precautions, don''t
    forget to back up your important data at any time and be prepared.Finally, if
    you found this book useful in any way, a review on Amazon is always appreciated!'
