  trans: "\n输出：这是最大的数字\n\nShell 脚本中的循环：\n循环意味着以固定的间隔重复相同的内容。Bash 提供了 `for` 循环和 `while`\
    \ 循环。为了精确地理解这一点，我们将使用下面的示例。\n\n# 用于 for 循环的 bash 程序\n```bash\nfor j in 6 7 8 9\n\
    do\n  echo \"This is $j\"\ndone\n```\n输出：\nThis is 6\nThis is 7\nThis is 8\nThis\
    \ is 9\n\nShell 脚本中的函数：\n函数是一组按照特定方式执行的指令集。Bash 提供了许多内置函数，我们也可以像下面所示创建自定义函数。\n\
    \n# 创建函数的语法\n```bash\naddition(){\n  echo ' Sum is $a + $b'\n  return\n}\n```\n\
    \n# 现在我们需要调用该函数\n`addition`\n输出：如果变量为 2 和 3，我们将得到输出为 Sum is 5\n\n这结束了我们进入 shell\
    \ 脚本世界的之旅。还有许多 bash 脚本模式和命令需要你掌握，才能成为一名精通的黑客。\n\n## 什么是脚本？\n脚本就是编程，但它是在代码规模较小时使用的术语，专门用于执行特定任务，而不是开发包含所有模块的软件。如今可以很容易学习许多编程语言。但\
    \ Python 被认为是初学者的最佳选择，因为它拥有巨大的资源、模块和开源内容，这将帮助初学者轻松高效地掌握脚本。\n\n## 为什么黑客需要学习脚本？\n\
    对于初学者这是一个非常基础的问题，因为他们可能看过关于某个能完成一切的应用程序的教程，并被新手作者称为黑客。在黑客术语中，借助其他黑客开发的软件来做事的人被称为“脚本小子”（script\
    \ kiddies）。始终记住，要成为一名专业的黑客，你需要创建小型脚本代码来自动化事务，并不像普通人一样高效完成任务。此外，脚本还可以帮助你更好地理解事物，并对正在使用的技术创建一个概述。倾向于某种编程语言不是问题，但黑客需要学习许多编程语言来理解语法。在下一节中，我们将通过示例详细介绍\
    \ Python 编程。\n\n## 为什么 Python 优越？\n黑客看好 Python 是由于它有可以使用 `pip` 命令安装的海量第三方模块。所有这些模块和一个源代码可以帮助初学者黑客理解事物是如何运作的。此外，Python\
    \ 同时支持函数式和面向对象语言，使得 Python 不仅是黑客，也是所有尝试学习编程的人的最佳选择。\n\n首先，你需要一个 IDE 或文本编辑器来编写脚本。Kali\
    \ Linux 中有许多 Python IDE。但我们先创建一个名为 `example.py` 的文件，并使用 `leafpad` 编辑它，以便在终端中执行它。JetBrains\
    \ 的 PyCharm 被认为是目前市场上最好的 Python IDE。\n\n现在我们将详细讨论 Python 中的不同概念以入门。\n\n### 1)\
    \ 变量\n变量是内存块，可以指定方式以便由任何数据类型调用。有不同类型的数据，如 `int`、`float`、`string`、`list`、`tuples`（元组）和\
    \ `dictionaries`（字典）。所有这些都试图在指定的内存中存储一个值。变量通过赋值运算符实现，并通过它们的名称调用。\n\n```python\n\
    this = \" reddy\"\nprint ( Hi + this)\n```\n输出：Hi reddy\n\n将上述代码保存到名为 `pythontest.py`\
    \ 的文件中，并尝试从命令行终端执行它。首先，你需要使用以下命令给 python 文件赋予执行权限。\n```bash\nroot @ kali : chmod\
    \ 755 example.py\n```\n这获得了执行权限并需要使用以下命令执行。\n```bash\nroot@kali : ./example.py\n\
    ```\n下面我们将通过不同的示例解释变量的不同应用，如下：\na) 字符串：`this = \" How to get it fast\"`\nb) 整数：`this\
    \ = 12`\nc) 浮点变量：`this = 3.1222`\nd) 列表：`this = [2,3,45,23]`\ne) 字典：`this = {\
    \ 'how' : is , 'this' : red}`\n\n### 注释\n注释是不随程序运行的内容，而是为了程序员和用户的方便而编写的。你可以直接使用三个引号之间的文本作为注释。\n\
    ```python\n'''\n  这是一个注释\n'''\n```\n\n### 函数\n函数是程序中使用的特殊程序。它们通常组成一个程序并在许多程序中一起，或在同一个程序中多次重复。函数可以根据需要多次调用。`help()`\
    \ 是 kali Linux 中的一个函数。事实上，许多预建函数正试图让用户体验更舒适。\n\n### 列表与字典\n我们将详细讨论列表和字典，因为它们是特殊的数据类型，可以用于容纳更多数据和技术。它们通常被称为数组，在处理元素数量时可以进行加、减、删除操作。\n\
    a) 例如，我们的列表示例是 `example = [1,2,3,4,5,6]`\n我们可以使用 `example[2]` 获取输出 `3`。如果使用 `example\
    \ [3]= 8`，列表会自动更改。这里是下面的代码。\n```python\nexample[4] = 8\nprint example[]\n```\n\
    输出：1,2,3,4,8,6\n\n### 模块\n模块是特殊的 python 文件，可以在 python 文件中反复使用。你可以将自己的扫描策略作为一个\
    \ python 模块，并在每次重启系统时随地调用它。这是模块的一种实际实现方式。\n```python\nimport metasploit\n```\n\
    这就是我们在 python 中使用模块的方式。\n\n### Python 中的 If - 条件判断\n条件语句是需要掌握的最重要的 python 技术之一，因为它减少了大量代码并帮助我们在两件事之间做出决定。这些简单的条件语句块将帮助我们创建更复杂的脚本。\n\
    示例：\n```python\nif this==0\n  print ( \" hurray\")\nelse\n  print ( \" Didnt happen')\n\
    ```\n\n### 循环语句：\n有没有好奇过你如何在电脑游戏中到达同一个地方？这是由于程序实现的循环函数致的。基本上，循环意味着在间隔内重复相同的内容。循环语句是复杂的，可以用来创造奇迹。\n\
    \n#### 1) While 循环\n```python\n// 用于理解 while 循环的程序\nthis = 3\nwhile ( this <=7):\n\
    \  print ( this)\nthis + = 1\n```\nWhile 循环简单来说是在开始循环时检查一个布尔表达式，如果为真，则执行循环；如果为假则停止循环。\n\
    \n#### 2) For 循环\nFor 循环的工作与 while 循环不同。它让我们使用变量集中每个可用变量，直到它满足条件。For 循环就像一个带有条件的暴力破解工具。\n\
    ```python\n// For 循环示例\nfor username in usernames:\n  result = connect ( usr,pwd)\n\
    \  if result == \" Tom\"\n    print ( username + \"found\")\n```\n输出：Tom found\n\
    \n## 面向对象编程\n尽管 Python 是一种模块化和面向函数的语言，但它也采用了面向对象的方法，由于其灵活性和模块化，帮助创建了数百种软件。我们在这里详细解释面向对象编程的不同概念。\n\
    \n### 什么是类？\n类是一个将一切组织在一个地方的模型或策略。每个可以使用的方法和变量都被组织并统称为一个类。\n\n### 什么是对象？\n这是实际工作的地方。它通过与每个变量或实例建立方法或连接，以获得你想要的结果。\n\
    \n### 什么是超类？\n与其到处创建方法，Python 再次使用了面向对象的方法。\n\n## 异常处理\n在编写脚本时，我们经常遇到错误和 bug。\n\
    \n# 第 3 章：Kali 基础\n\n## 管理网络\n黑客总是倾向于通过网络来做事。\n\n`ifconfig` 这是一个在所有 Linux 发行版中查看网络的命令\n"
