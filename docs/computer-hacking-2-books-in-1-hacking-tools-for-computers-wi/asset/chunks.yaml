    including RedHat, SuSE, and Debian. If you only want to view the version number,
    you can view the /etc/issue file. Execute the command as follows:root@kali:~#
    cat /etc/issueKali GNU/Linux 2.2.1\n \lA Hacking RoadmapIf a hacker wants to attack
    a target computer, it can''t be done by DOS commands. It also needs some powerful
    intrusion tools, such as port scanning tools, network sniffing tools, Trojan making
    tools, and remote-control tools. This section will briefly introduce the intrusion
    tools commonly used by hackers.a) Port scanningThe port scanning tool has the
    function of scanning the port. The so-called port scanning means that the hacker
    can scan the information of the target computer by sending a set of port scanning
    information. These ports are intrusion channels for the hacker. Once the hacker
    understands these ports, the hacker can invade the target computer.In addition
    to the ability to scan the open ports of a computer, the port scan tool also has
    the ability to automatically detect remote or target computer security vulnerabilities.
    Using the port scan tool, users can discover the distribution of various TCP ports
    on the target computer without leaving traces. And the services provided to allow
    users to indirectly or directly understand the security issues of the target computer.
    The port scanning tools commonly used by hackers are SuperScan and X-Scan.b) Sniffing
    toolA sniffing tool is a tool that can sniff packets on a LAN. The so-called sniffing
    is to eavesdrop on all the packets flowing through the LAN. By eavesdropping and
    analyzing these packets, you can peek at the private information of others on
    the LAN. The sniffing tool can only be used in the local area network, and it
    is impossible to directly sniff the target computer on the Internet. The data
    sniffing tools commonly used by hackers are Sniffer Pro and Eiffel Web Detective.c)
    Trojan making toolAs the name suggests, Trojan making tools are tools for making
    Trojans. Since Trojans have the function of stealing personal privacy information
    of the target computer, many junior hackers like to use Trojans to make Trojans
    directly. The Trojan creation tool works basically the same way. First, the tool
    is used to configure the Trojan server program. Once the target computer runs
    the Trojan server program, the hacker can use the Trojan tool to completely control
    the target computer of the Trojan.The operation of the Trojan making tool is very
    simple, and the working principle is basically the same, so many junior hackers
    favor it. Trojan horse making tools commonly used by hackers are "glacial" Trojans
    and bundled Trojans.d) Remote control toolsRemote control tools are tools with
    remote control functions that can remotely control the target computer, although
    the control methods are different (some remote-control tools are remotely controlled
    by implanting a server program, and some remote-control tools are used to directly
    control the LAN). All computers in the middle), but once the hacker uses the remote-control
    tool to control the target computer, the hacker acts as if it were sitting in
    front of the target computer. The remote-control tools commonly used by hackers
    are network law enforcement officers and remote control.Hacking Target ComputersIn
    Internet, in order to prevent hackers from invading their own computers, it is
    necessary to understand the common methods of hacking target computers. The intrusion
    methods commonly used by hackers include data-driven attacks, illegal use of system
    files, forged information attacks, and remote manipulation. The following describes
    these intrusion methods.1) A data driven attackA data-driven attack is an attack
    initiated by a hacker who sends or copies a seemingly harmless special program
    to a target computer. This attack allows hackers to modify files related to network
    security on the target computer, making it easier for hackers to invade the target
    computer the next time. Data-driven attacks mainly include buffer overflow attacks,
    format string attacks, input verification attacks, synchronous vulnerability attacks,
    and trust vulnerability attacks.2) Forgery information attackForgery information
    attack means that the hacker constructs a fake path between the source computer
    and the target computer by sending the forged routing information, so that the
    data packets flowing to the target computer are all passed through the computer
    operated by the hacker, thereby obtaining the bank account in the data packet.
    Personal sensitive information such as passwords.3) Information protocolIn a local
    area network, the source path option of the IP address allows the IP packet to
    choose a path to the target computer itself. When a hacker attempts to connect
    to an unreachable computer A behind a firewall, he only needs to set the IP address
    source path option in the sent request message so that one of the destinations
    addresses of the packet points to the firewall, but the final address points to
    Computer A. The message is allowed to pass when it reaches the firewall because
    it points to the firewall instead of computer A. The IP layer of the firewall
    processes the source path of the packet and sends it to the internal network.
    The message arrives at the unreachable computer A, thus achieving a vulnerability
    attack against the information protocol.4) Remote operationRemote operation means
    that the hacker launches an executable program on the target computer. The program
    will display a fake login interface. When the user enters the login information
    such as account and password in the interface, the program will input the account
    and password. Transferred to the hacker''s computer. At the same time, the program
    closes the login interface and prompts the “system failure” message, asking the
    user to log in again. This type of attack is similar to a phishing website that
    is often encountered on the Internet.5) LAN securityIn the local area network,
    people are one of the most important factors of LAN security. When the system
    administrator has a mistake in the configuration of the WWW server system and
    the user''s permission to expand the user''s authority, these mistakes can provide
    opportunities for the hacker. Hackers use these mistakes, plus the command of
    finger, netstat, etc., to achieve intrusion attacks.Resending an attack means
    that the hacker collects specific IP data packets and tampers with the data, and
    then resends the IP data packets one by one to spoof the target computer receiving
    the data to implement the attack.In the LAN, the redirect message can change the
    router''s routing list. Based on these messages, the router can suggest that the
    computer take another better path to propagate the data. The ICMP packet attack
    means that the hacker can effectively use the redirect message to redirect the
    connection to an unreliable computer or path, or to forward all the packets through
    an unreliable computer.6) Vulnerability attackA vulnerability attack for source
    path selection means that the hacker transmits a source path message with an internal
    computer address to the local area network by operating a computer located outside
    the local area network. Since the router will trust this message, it will send
    an answer message to the computer located outside the LAN, as this is the source
    path option requirement for IP. The defense against this type of attack is to
    properly configure the router to let the router discard packets that are sent
    from outside the LAN but claim to be from internal computers.7) Ethernet broadcast
    attackThe Ethernet broadcast attack mode refers to setting the computer network
    card interface to promiscuous, to intercept all the data packets in the local
    area network, analyze the account and password saved in the data packet, and steal
    information.UNIXOn the Internet, servers or supercomputers on many websites use
    the UNIX operating system. The hacker will try to log in to one of the computers
    with UNIX, get the system privilege through the vulnerability of the operating
    system, and then use this as a base to access and invade the rest of the computer.
    This is called Island-hopping.A hacker often jumps a few times before attacking
    the final destination computer. For example, a hacker in the United States may
    log in to a computer in Asia before entering the FBI network, then log in to a
    computer in Canada, then jump to Europe, and finally from France. The computer
    launched an attack on the FBI network. In this way, even if the attacked computer
    finds out where the hacker launched the attack, it is difficult for the administrator
    to find the hacker. What''s more, once a hacker gains the system privileges of
    a computer, he can delete the system log when exiting and cut "vine".In almost
    all protocol families implemented by UNIX, a well-known vulnerability makes it
    possible to steal TCP connections. When a TCP connection is being established,
    the server acknowledges the user request with a response message containing the
    initial sequence number. This serial number has no special requirements, as long
    as it is unique. After the client receives the answer, it will confirm it once
    and the connection will be established. The TCP protocol specification requires
    a serial number of 250,000 replacements per second, but the actual replacement
    frequency of most UNIX systems is much smaller than this number, and the number
    of next replacements is often predictable, and hackers have this predictable server
    initial. The ability of the serial number allows the intrusion attack to be completed.
    The only way to prevent this attack is to make the initial sequence number more
    random. The safest solution is to use the encryption algorithm to generate the
    initial sequence number. The resulting extra CPU load is now the hardware speed.
    It can be ignored.On UNIX systems, too many files can only be created by superusers,
    and rarely by a certain type of user. This makes it necessary for system administrators
    to operate under root privileges. This is not very safe. Since the primary target
    of hacking is root, the most frequently attacked target is the superuser''s password.
    Strictly speaking, the user password under UNIX is not encrypted. It is just a
    key for encrypting a common string as a DES algorithm. There are now a number
    of software tools for decryption that use the high speed of the CPU to search
    for passwords. Once the attack is successful, the hacker becomes an administrator
    on the UNIX system. Therefore, the user rights in the system should be divided,
    such as setting the mail system administrator management, and then the mail system
    mail administrator can manage the mail system well without superuser privileges,
    which makes the system much safer.Chapter 2: Bash and python scriptingThis chapter
