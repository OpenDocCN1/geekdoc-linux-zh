    |

    | drwxrwx--- | A directory. The owner and the members of the owner group may enter
    the directory, create, rename and remove files within the directory. |

    | drwxr-x--- | A directory. The owner may enter the directory and create, rename
    and delete files within the directory. Members of the owner group may enter the
    directory but cannot create, delete or rename files. |


    # chmod – Change file mode


    To change the mode (permissions) of a file or directory, the chmod command is
    used. Be aware that only the file''s owner or the superuser can change the mode
    of a file or directory. chmod supports two distinct ways of specifying mode changes:
    octal number representation, or symbolic representation. We will cover octal number
    representation first.'
