  md: '`diff` is a much more complex tool, supporting many output formats and the
    ability to process large collections of text files at once. `diff` is often used
    by software developers to examine changes between different versions of program
    source code, and thus has the ability to recursively examine directories of source
    code often referred to as *source trees*. One common use for `diff` is the creation
    of *diff files* or *patches* that are used by programs such as `patch` (which
    we’ll discuss shortly) to convert one version of a file (or files) to another
    version.


    If we use `diff` to look at our previous example files:


    ```

    ```text

    [me@linuxbox ~]$ diff file1.txt file2.txt

    1d0

    < a

    4a4

    > e

    ```

    ```


    we see its default style of output: a terse description of the differences between
    the two files. In the default format, each group of changes is preceded by a *change
    command* in the form of *range operation range* to describe the positions and
    type of changes required to convert the first file to the second file:


    *Table 21-4: diff Change Commands*


    | Change | Description |

    |---|---|

    | `r1ar2` | Append the lines at the position *r2* in the second file to the position
    *r1* in the first file. |

    | `r1cr2` | Change (replace) the lines at position *r1* with the lines at the
    position *r2* in the second file. |

    | `r1dr2` | Delete the lines in the first file at position *r1*, which would have
    appeared at range *r2* in the second file. |


    In this format, a range is a comma separated list of the starting line and the
    ending line. While this format is the default (mostly for POSIX compliance and
    backward compatibility with traditional Unix versions of `diff`), it is not as
    widely used as other, optional formats. Two of the more popular formats are the
    *context format* and the *unified format*.


    When viewed using the context format (the `-c` option), we will see this:'
  merge: -1
  img_proc: true
