  md: 'writing them, and since programmers use them extensively, they write editors
    to express their own desires as to how they should work.


    Text editors fall into two basic categories: graphical and text based. GNOME and
    KDE both include some popular graphical editors. GNOME ships with an editor called
    gedit, which is usually called “Text Editor” in the GNOME menu. KDE usually ships
    with three which are (in order of increasing complexity) kedit, kwrite, and kate.


    There are many text-based editors. The popular ones you will encounter are nano,
    vi, and emacs. The nano editor is a simple, easy-to-use editor designed as a replacement
    for the pico editor supplied with the PINE email suite. The vi editor (on most
    Linux systems replaced by a program named vim, which is short for “vi IMproved”)
    is the traditional editor for Unix-like systems. It will be the subject of our
    next chapter. The emacs editor was originally written by Richard Stallman. It
    is a gigantic, all-purpose, does-everything programming environment. While readily
    available, it is seldom installed on most Linux systems by default.


    # Using A Text Editor


    All text editors can be invoked from the command line by typing the name of the
    editor followed by the name of the file you want to edit. If the file does not
    already exist, the editor will assume that you want to create a new file. Here
    is an example using gedit:


    ```

    [me@linuxbox ~]$ gedit some_file

    ```


    This command will start the gedit text editor and load the file named “some_file”,
    if it exists.


    All graphical text editors are pretty self-explanatory, so we won’t cover them
    here. Instead, we will concentrate on our first text-based text editor, nano.
    Let’s fire up nano and edit the .bashrc file. But before we do that, let’s practice
