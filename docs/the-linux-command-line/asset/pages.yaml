  md: '# Table 16-2: Linux Storage Device Names


    | Pattern | Device |

    |---|---|

    | /dev/fd* | Floppy disk drives. |

    | /dev/hd* | IDE (PATA) disks on older systems. Typical motherboards contain two
    IDE connectors or channels, each with a cable with two attachment points for drives.
    The first drive on the cable is called the master device and the second is called
    the slave device. The device names are ordered such that /dev/hda refers to the
    master device on the first channel, /dev/hdb is the slave device on the first
    channel; /dev/hdc, the master device on the second channel, and so on. A trailing
    digit indicates the partition number on the device. For example, /dev/hda1 refers
    to the first partition on the first hard drive on the system while /dev/hda refers
    to the entire drive. |

    | /dev/lp* | Printers. |

    | /dev/sd* | SCSI disks. On recent Linux systems, the kernel treats all disk-like
    devices (including PATA/SATA hard disks, flash drives, and USB mass storage devices,
    such as portable music players and digital cameras) as SCSI disks. The rest of
    the naming system is similar to the older /dev/hd* naming scheme described above.
    |

    | /dev/sr* | Optical drives (CD/DVD readers and burners) |


    In addition, we often see symbolic links such as /dev/cdrom, /dev/dvd and /dev/floppy,
    which point to the actual device files, provided as a convenience.


