    \ ~]$\n```\n\nbash also provides a method of tracing, implemented by the -x option\
    \ and the set command with the -x option. Using our earlier trouble script, we\
    \ can activate tracing for the entire script by adding the -x option to the first\
    \ line:\n\n```\n#!/bin/bash -x\n\n# trouble: script to demonstrate common errors\n\
    \nnumber=1\n```"
