- pgno: 343
  md: '# 23 – Printing


    After spending the last couple of chapters manipulating text, it’s time to put
    that text on paper. In this chapter, we’ll look at the command line tools that
    are used to print files and control printer operation. We won’t be looking at
    how to configure printing, as that varies from distribution to distribution and
    is usually set up automatically during installation. Note that we will need a
    working printer configuration to perform the exercises in this chapter.


    We will discuss the following commands:


    +   - `pr` – Convert text files for printing

    +   - `lpr` – Print files

    +   - `a2ps` – Format files for printing on a PostScript printer

    +   - `lpstat` – Show printer status information

    +   - `lpq` – Show printer queue status

    +   - `lprm` – Cancel print jobs


    # A Brief History Of Printing


    To fully understand the printing features found in Unix-like operating systems,
    we must first learn some history. Printing on Unix-like systems goes way back
    to the beginning of the operating system itself. In those days, printers and how
    they were used was much different from today.


    # Printing In The Dim Times


    Like the computers themselves, printers in the pre-PC era tended to be large,
    expensive and centralized. The typical computer user of 1980 worked at a terminal
    connected to a computer some distance away. The printer was located near the computer
    and was under the watchful eyes of the computer’s operators.


    When printers were expensive and centralized, as they often were in the early
    days of Unix, it was common practice for many users to share a printer. To identify
    print jobs'
  merge: -1
  img_proc: true
- pgno: 344
  md: "belonging to a particular user, a *banner* page displaying the name of the\
    \ user was often printed at the beginning of each print job. The computer support\
    \ staff would then load up a cart containing the day’s print jobs and deliver\
    \ them to the individual users.\n\n# Character-based Printers\n\nThe printer technology\
    \ of the 80s was very different in two respects. First, printers of that period\
    \ were almost always *impact printers*. Impact printers use a mechanical mechanism\
    \ which strikes a ribbon against the paper to form character impressions on the\
    \ page. Two of the popular technologies of that time were *daisy wheel printing*\
    \ and *dot-matrix* printing.\n\nThe second, and more important characteristic\
    \ of early printers was that printers used a fixed set of characters that were\
    \ intrinsic to the device itself. For example, a daisy wheel printer could only\
    \ print the characters actually molded into the petals of the daisy wheel. This\
    \ made the printers much like high-speed typewriters. As with most typewriters,\
    \ they printed using monospaced (fixed width) fonts. This means that each character\
    \ has the same width. Printing was done at fixed positions on the page, and the\
    \ printable area of a page contained a fixed number of characters. Most printers\
    \ printed ten characters per inch (CPI) horizontally and six lines per inch (LPI)\
    \ vertically. Using this schema, a US letter sheet of paper is eighty-five characters\
    \ wide and sixty-six lines high. Taking into account a small margin on each side,\
    \ eighty characters was considered the maximum width of a print line. This explains\
    \ why terminal displays (and our terminal emulators) are normally eighty characters\
    \ wide. It provides a *WYSIWYG (What You See Is What You Get)* view of printed\
    \ output, using a monospaced font.\n\nData is sent to a typewriter-like printer\
    \ in a simple stream of bytes containing the characters to be printed. For example,\
    \ to print an “a”, the ASCII character code 97 is sent. In addition, the low-numbered\
    \ ASCII control codes provided a means of moving the printer’s carriage and paper,\
    \ using codes for carriage return, line feed, form feed, etc. Using the control\
    \ codes, it’s possible to achieve some limited font effects, such as bold face,\
    \ by having the printer print a character, backspace and print the character again\
    \ to get a darker print impression on the page. We can actually witness this if\
    \ we use nroff to render a man page and examine the output using `cat -A`:\n\n\
    ```\n```text\n[me@linuxbox ~]$ zcat /usr/share/man/man1/ls.1.gz | nroff -man |\
    \ cat -A | head\nLS(1)                                      User Commands    \
    \                                  LS(1)\n$\n$\n$\n^H^H^H^H^H^H^H^H^H^H^H^H^H^H$\n\
    \          ls - list directory contents$\n```\n```"
