    The prompt changes to indicate that we are performing a reverse incremental search.
    It is “reverse” because we are searching from “now” to some time in the past.
    Next, we start typing our search text. In this example “/usr/bin”:


    ```

    (reverse-i-search)`/usr/bin'': ls -l /usr/bin > ls-output.txt

    ```


    Immediately, the search returns our result. With our result, we can execute the
    command by pressing Enter, or we can copy the command to our current command line
    for further editing by typing Ctrl-j. Let’s copy it. Type Ctrl-j:


    ```

    [me@linuxbox ~]$ ls -l /usr/bin > ls-output.txt

    ```


    Our shell prompt returns and our command line is loaded and ready for action!


