    # paste


    The paste command does the opposite of cut. Rather than extracting a column of
    text from a file, it adds one or more columns of text to a file. It does this
    by reading multiple files and combining the fields found in each file into a single
    stream on standard output. Like cut, paste accepts multiple file arguments and/or
    standard input. To demonstrate how paste operates, we will perform some surgery
    on our distros.txt file to produce a chronological list of releases.


