    \ -0500\n***************\n*** 1,4 ****\n- a\n  b\n  c\n  d\n--- 1,4 ----\n  b\n\
    \  c\n  d\n+ e\n```\n```\n\nThe output begins with the names of the two files\
    \ and their timestamps. The first file is marked with asterisks and the second\
