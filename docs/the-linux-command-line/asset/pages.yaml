    cursor will move to line 3. Repeating the n command will move the cursor down
    the file until it runs out of matches. While we have so far only used words and
    phrases for our search patterns, vi allows the use of regular expressions, a powerful
    method of expressing complex text patterns. We will cover regular expressions
    in some detail in a later chapter.


    # Global Search And Replace


    vi uses an ex command to perform search and replace operations (called “substitution”
    in vi) over a range of lines or the entire file. To change the word “Line” to
    “line” for the entire file, we would enter the following command:


    ```

    :%s/Line/line/g

