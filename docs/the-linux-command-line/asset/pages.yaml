    > Note: Since we are the “maintainer” of this source code while we compile it,
    we will keep it in ~/src. Source code installed by your distribution will be installed
    in /usr/src, while source code intended for use by multiple users is usually installed
    in /usr/local/src.


    As we can see, source code is usually supplied in the form of a compressed tar
    file. Sometimes called a “tarball,” this file contains the source tree, or hierarchy
    of directories and files that comprise the source code. After arriving at the
    ftp site, we examine the list of tar files available and select the newest version
    for download. Using the get command within ftp, we copy the file from the ftp
    server to the local machine.'
