- pgno: 493
  md: '# Array Operations


    There are many common array operations. Such things as deleting arrays, determining
    their size, sorting, etc. have many applications in scripting.


    # Outputting The Entire Contents Of An Array


    The subscripts * and @ can be used to access every element in an array. As with
    positional parameters, the @ notation is the more useful of the two. Here is a
    demonstration:


    ```

    [me@linuxbox ~]$ animals=("a dog" "a cat" "a fish")

    [me@linuxbox ~]$ for i in ${animals[*]}; do echo $i; done

    a

    dog

    a

    cat

    a

    fish

    [me@linuxbox ~]$ for i in ${animals[@]}; do echo $i; done

    a

    dog

    a

    cat

    a

    fish

    [me@linuxbox ~]$ for i in "${animals[*]}"; do echo $i; done

    a dog a cat a fish

    [me@linuxbox ~]$ for i in "${animals[@]}"; do echo $i; done

    a dog

    a cat

    a fish

    ```


    We create the array animals and assign it three two-word strings. We then execute
    four loops to see the affect of word-splitting on the array contents. The behavior
    of notations ${animals[*]} and ${animals[@]} are identical until they are quoted.
    The * notation results in a single word containing the array''s contents, while
    the @ notation results in three words, which matches the arrays “real” contents.


    # Determining The Number Of Array Elements


    Using parameter expansion, we can determine the number of elements in an array
    in much the same way as finding the length of a string. Here is an example:'
  merge: -1
  img_proc: true
- pgno: 494
  md: '```

    [me@linuxbox ~]$ a[100]=foo

    [me@linuxbox ~]$ echo ${#a[@]}  # number of array elements

    1

    [me@linuxbox ~]$ echo ${#a[100]}  # length of element 100

    3

    ```


    We create array a and assign the string “foo” to element 100. Next, we use parameter
    expansion to examine the length of the array, using the @ notation. Finally, we
    look at the length of element 100 which contains the string “foo”. It is interesting
    to note that while we assigned our string to element 100, bash only reports one
    element in the array. This differs from the behavior of some other languages in
    which the unused elements of the array (elements 0-99) would be initialized with
    empty values and counted.


    # Finding The Subscripts Used By An Array


    As bash allows arrays to contain “gaps” in the assignment of subscripts, it is
    sometimes useful to determine which elements actually exist. This can be done
    with a parameter expansion using the following forms:


    ${!array[*]}

    ${!array[@]}


    where array is the name of an array variable. Like the other expansions that use
    * and @, the @ form enclosed in quotes is the most useful, as it expands into
    separate words:


    ```

    [me@linuxbox ~]$ foo=([2]=a [4]=b [6]=c)

    [me@linuxbox ~]$ for i in "${foo[@]}"; do echo $i; done

    a

    b

    c

    [me@linuxbox ~]$ for i in "${!foo[@]}"; do echo $i; done

    2

    4

    6

    ```


    # Adding Elements To The End Of An Array


    Knowing the number of elements in an array is no help if we need to append values
    to the end of an array, since the values returned by the * and @ notations do
    not tell us the maximum array index in use. Fortunately, the shell provides us
    with a solution. By using the += assignment operator, we can automatically append
    values to the end of an array. Here, we assign three values to the array foo and
    then append three more.'
