- pgno: 118
  md: 'choice of which command to use is largely determined by which Linux distribution
    you use. Your distribution probably includes both commands, but its configuration
    will favor either one or the other. We''ll start with su.


    # su – Run A Shell With Substitute User And Group IDs


    The su command is used to start a shell as another user. The command syntax looks
    like this:


    ```

    su [-l] [user]

    ```


    If the “-l” option is included, the resulting shell session is a login shell for
    the specified user. This means that the user''s environment is loaded and the
    working directory is changed to the user''s home directory. This is usually what
    we want. If the user is not specified, the superuser is assumed. Notice that (strangely)
    the “-l” may be abbreviated “-”, which is how it is most often used. To start
    a shell for the superuser, we would do this:


    ```

    [me@linuxbox ~]$ su -

    Password:

    [root@linuxbox ~]#

    ```


    After entering the command, we are prompted for the superuser''s password. If
    it is successfully entered, a new shell prompt appears indicating that this shell
    has superuser privileges (the trailing “#” rather than a “$”) and the current
    working directory is now the home directory for the superuser (normally /root.)
    Once in the new shell, we can carry out commands as the superuser. When finished,
    type “exit” to return to the previous shell:


    ```

    [root@linuxbox ~]# exit

    [me@linuxbox ~]$

    ```


    It is also possible to execute a single command rather than starting a new interactive
    command by using su this way:


    ```

    su -c ''command''

    ```'
