- pgno: 414
  md: "# 29 – Reading Keyboard Input\n\nThe scripts we have written so far lack a\
    \ feature common in most computer programs—interactivity. That is, the ability\
    \ of the program to interact with the user. While many programs don't need to\
    \ be interactive, some programs benefit from being able to accept input directly\
    \ from the user. Take, for example, this script from the previous chapter:\n\n\
    ```\n#!/bin/bash\n\n# test-integer2: evaluate the value of an integer.\n\nINT=-5\n\
    \nif [[ \"$INT\" =~ ^-?[0-9]+$ ]]; then\n    if [ $INT -eq 0 ]; then\n       \
    \ echo \"INT is zero.\"\n    else\n        if [ $INT -lt 0 ]; then\n         \
    \   echo \"INT is negative.\"\n        else\n            echo \"INT is positive.\"\
    \n        fi\n        if [ $((INT % 2)) -eq 0 ]; then\n            echo \"INT\
    \ is even.\"\n        else\n            echo \"INT is odd.\"\n        fi\n   \
    \ fi\nelse\n    echo \"INT is not an integer.\" >&2\n    exit 1\nfi\n```\n\nEach\
    \ time we want to change the value of INT, we have to edit the script. It would\
    \ be much more useful if the script could ask the user for a value. In this chapter,\
    \ we will begin to look at how we can add interactivity to our programs."
