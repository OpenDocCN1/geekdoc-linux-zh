    Notice what happens when we try to unmount the CD-ROM:


    ```

    [root@linuxbox cdrom]# umount /dev/hdc

    umount: /mnt/cdrom: device is busy

    ```


    Why is this? The reason is that we cannot unmount a device if the device is being
    used by someone or some process. In this case, we changed our working directory
    to the mount point for the CD-ROM, which causes the device to be busy. We can
    easily remedy the issue by changing the working directory to something other than
    the mount point:


    ```

    [root@linuxbox cdrom]# cd

    [root@linuxbox ~]# umount /dev/hdc

    ```


    Now the device unmounts successfully.


    # Why Unmounting Is Important


    If you look at the output of the free command, which displays statistics about
    memory usage, you will see a statistic called “buffers.” Computer systems are
    designed to go as fast as possible. One of the impediments to system speed is
    slow devices. Printers are a good example. Even the fastest printer is extremely
    slow by computer standards. A computer would be very slow indeed if it had to
    stop and wait for a printer to finish printing a page. In the early days of PCs
    (before multi-tasking), this was a real problem. If you were working on a spreadsheet
    or text document, the computer would stop and become unavailable every time you
    printed. The computer would send the data to the printer as fast as the printer
    could accept it, but it was very slow since printers don’t print very fast. This
    problem was solved by the advent of the printer buffer, a device containing some
    RAM memory that would sit between the computer and the printer. With the printer
    buffer in place, the computer would send the printer output to the buffer and
    it would quickly be stored in the fast RAM so the computer could go back to work
    without waiting. Meanwhile, the printer buffer would slowly spool the data to
    the printer from the buffer’s memory at the speed at which the printer could accept
    it.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'This idea of buffering is used extensively in computers to make them faster.
    Don''t let the need to occasionally read or write data to/from slow devices impede
    the speed of the system. Operating systems store data read from, and to be written
    to storage devices in memory for as long as possible before actually having to
    interact with the slower device. On a Linux system for example, you will notice
    that the system seems to fill up memory the longer it is used. This does not mean
    Linux is “using” all the memory, it means that Linux is taking advantage of all
    the available memory to do as much buffering as it can.


    This buffering allows writing to storage devices to be done very quickly, because
    the writing to the physical device is being deferred to a future time. In the
    meantime, the data destined for the device is piling up in memory. From time to
    time, the operating system will write this data to the physical device.


    Unmounting a device entails writing all the remaining data to the device so that
    it can be safely removed. If the device is removed without unmounting it first,
    the possibility exists that not all the data destined for the device has been
    transferred. In some cases, this data may include vital directory updates, which
    will lead to file system corruption, one of the worst things that can happen on
    a computer.


    # Determining Device Names


    It''s sometimes difficult to determine the name of a device. Back in the old days,
    it wasn''t very hard. A device was always in the same place and it didn''t change.
    Unix-like systems like it that way. Back when Unix was developed, “changing a
    disk drive” involved using a forklift to remove a washing machine-sized device
    from the computer room. In recent years, the typical desktop hardware configuration
    has become quite dynamic and Linux has evolved to become more flexible than its
    ancestors.


    In the examples above we took advantage of the modern Linux desktop''s ability
    to “automagically” mount the device and then determine the name after the fact.
    But what if we are managing a server or some other environment where this does
    not occur? How can we figure it out?


    First, let''s look at how the system names devices. If we list the contents of
    the /dev directory (where all devices live), we can see that there are lots and
    lots of devices:


    ```

    [me@linuxbox ~]$ ls /dev

    ```


    The contents of this listing reveal some patterns of device naming. Here are a
    few:'
