    case, the the world write permission. That''s what the mask does. Everywhere a
    1 appears in the binary value of the mask, an attribute is unset. If we look at
    a mask value of 0022, we can see what it does:


    | Original file mode | --- rw- rw- rw- |

    | Mask | 000 000 010 010 |

    | Result | --- rw- rw- r-- |'
