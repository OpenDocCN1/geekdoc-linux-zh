    Number is not equal to 1.\"\nfi\nset +x # Turn off tracing\n```\n\nIn this trivial\
    \ example, we simply display the value of the variable number and mark the added\
    \ line with a comment to facilitate its later identification and removal. This\
    \ technique is particularly useful when watching the behavior of loops and arithmetic\
    \ within scripts.\n\n# Summing Up\n\nIn this chapter, we looked at just a few\
    \ of the problems that can crop up during script development. Of course, there\
    \ are many more. The techniques described here will enable finding most common\
    \ bugs. Debugging is a fine art that can be developed through experience, both\
    \ in knowing how to avoid bugs (testing constantly throughout development) and\
