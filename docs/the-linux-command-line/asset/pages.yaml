    # Assignment


    Although its uses may not be immediately apparent, arithmetic expressions may
    perform assignment. We have performed assignment many times, though in a different
    context. Each time we give a variable a value, we are performing assignment. We
    can also do it within arithmetic expressions:


    ```

    [me@linuxbox ~]$ foo=

    [me@linuxbox ~]$ echo $foo


    [me@linuxbox ~]$ if (( foo = 5 ));then echo "It is true."; fi

    It is true.

    [me@linuxbox ~]$ echo $foo

    5

    ```


    In the example above, we first assign an empty value to the variable foo and verify
    that it is indeed empty. Next, we perform an if with the compound command (( foo
    = 5 )). This process does two interesting things: 1) it assigns the value of five
    to the variable foo and 2) it evaluates to true because the assignment was successful.


    > Note: It is important to remember the exact meaning of the = in the expression
    above. A single = performs assignment. foo = 5 says “make foo equal to five,”
    while == evaluates equivalence. foo == 5 says “does foo equal five?” This can
    be very confusing because the test command accepts a single = for string equivalence.
    This is yet another reason to use the more modern [[ ]] and (( )) compound commands
    in place of test.


    In addition to the =, the shell also provides notations that perform some very
    useful assignments:


    Table 35-3: Assignment Operators


    | Notation | Description |

    |---|---|'
