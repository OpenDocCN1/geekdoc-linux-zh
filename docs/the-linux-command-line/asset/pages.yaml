  md: "```\nYou can make this change permanent by adding this line to your `.bashrc`\
    \ file:\n\n```sh\nexport LANG=POSIX\n```\n```\n\n# POSIX Basic Vs. Extended Regular\
    \ Expressions\n\nJust when we thought this couldn’t get any more confusing, we\
    \ discover that POSIX also splits regular expression implementations into two\
    \ kinds: *basic regular expressions (BRE)* and *extended regular expressions (ERE)*.\
    \ The features we have covered so far are supported by any application that is\
    \ POSIX-compliant and implements BRE. Our `grep` program is one such program.\n\
    \nWhat’s the difference between BRE and ERE? It’s a matter of metacharacters.\
    \ With BRE, the following metacharacters are recognized:\n\n`^  $  .  [  ]  *`\n\
    \nAll other characters are considered literals. With ERE, the following metacharacters\
    \ (and their associated functions) are added:\n\n`(  )  {  }  ?  +  |`\n\nHowever\
    \ (and this is the fun part), the “(”, “)”, “{”, and “}” characters are treated\
    \ as metacharacters in BRE if they are escaped with a backslash, whereas with\
    \ ERE, preceding any metacharacter with a backslash causes it to be treated as\
    \ a literal. Any weirdness that comes along will be covered in the discussions\
    \ that follow.\n\nSince the features we are going to discuss next are part of\
    \ ERE, we are going to need to use a different `grep`. Traditionally, this has\
    \ been performed by the `egrep` program, but the GNU version of `grep` also supports\
    \ extended regular expressions when the `-E` option is used.\n\n> ### POSIX\n\
    > \n> During the 1980’s, Unix became a very popular commercial operating system,\
