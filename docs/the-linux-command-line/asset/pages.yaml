- pgno: 221
  md: 'The first time the connection is attempted, a message is displayed indicating
    that the authenticity of the remote host cannot be established. This is because
    the client program has never seen this remote host before. To accept the credentials
    of the remote host, enter “yes” when prompted. Once the connection is established,
    the user is prompted for his/her password:


    ```

    Warning: Permanently added ''remote-sys,192.168.1.4'' (RSA) to the list

    of known hosts.

    me@remote-sys''s password:

    ```


    After the password is successfully entered, we receive the shell prompt from the
    remote system:


    ```

    Last login: Sat Aug 30 13:00:48 2008

    [me@remote-sys ~]$

    ```


    The remote shell session continues until the user enters the exit command at the
    remote shell prompt, thereby closing the remote connection. At this point, the
    local shell session resumes and the local shell prompt reappears.


    It is also possible to connect to remote systems using a different user name.
    For example, if the local user “me” had an account named “bob” on a remote system,
    user me could log in to the account bob on the remote system as follows:


    ```

    [me@linuxbox ~]$ ssh bob@remote-sys

    bob@remote-sys''s password:

    Last login: Sat Aug 30 13:03:21 2008

    [bob@remote-sys ~]$

    ```


    As stated before, ssh verifies the authenticity of the remote host. If the remote
    host does not successfully authenticate, the following message appears:


    ```

    [me@linuxbox ~]$ ssh remote-sys

    @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@

    @    WARNING: REMOTE HOST IDENTIFICATION HAS CHANGED!     @

    @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@

    IT IS POSSIBLE THAT SOMEONE IS DOING SOMETHING NASTY!

    Someone could be eavesdropping on you right now (man-in-the-middle

    attack)!

    ```'
