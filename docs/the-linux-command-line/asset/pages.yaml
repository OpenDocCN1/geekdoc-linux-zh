    # Operators


    Even with all the tests that `find` provides, we may still need a better way to
    describe the *logical relationships* between the tests. For example, what if we
    needed to determine if all the files and subdirectories in a directory had secure
    permissions? We would look for all the files with permissions that are not 0600
    and the directories with permissions that'
