    \ to implement the interactive mode:\n\n```\n# interactive mode\nif [[ -n $interactive\
    \ ]]; then\n    while true; do\n        read -p \"Enter name of output file: \"\
    \ filename\n        if [[ -e $filename ]]; then\n            read -p \"$filename\
    \ exists. Overwrite? [y/n/q] > \"\n            case $REPLY in\n```"
