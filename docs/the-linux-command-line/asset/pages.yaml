    # Viewing File Contents With less


    The less command is a program to view text files. Throughout our Linux system,
    there are many files that contain human-readable text. The less program provides
    a convenient way to examine them.


    # What Is “Text”?


    There are many ways to represent information on a computer. All methods involve
    defining a relationship between the information and some numbers that will be
    used to represent it. Computers, after all, only understand numbers and all data
    is converted to numeric representation.


    Some of these representation systems are very complex (such as compressed video
    files), while others are rather simple. One of the earliest and simplest is called
    ASCII text. ASCII (pronounced "As-Key") is short for American Standard Code for
    Information Interchange. This is a simple encoding scheme that was first used
    on Teletype machines to map keyboard characters to numbers.


    Text is a simple one-to-one mapping of characters to numbers. It is very compact.
    Fifty characters of text translates to fifty bytes of data. It is important to
    understand that text only contains a simple mapping of characters to numbers.
    It is not the same as a word processor document such as one created by Microsoft
    Word or OpenOffice.org Writer. Those files, in contrast to simple ASCII text,'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'contain many non-text elements that are used to describe its structure and
    formatting. Plain ASCII text files contain only the characters themselves and
    a few rudimentary control codes like tabs, carriage returns and line feeds.


    Throughout a Linux system, many files are stored in text format and there are
    many Linux tools that work with text files. Even Windows recognizes the importance
    of this format. The well-known NOTEPAD.EXE program is an editor for plain ASCII
    text files.


    Why would we want to examine text files? Because many of the files that contain
    system settings (called configuration files) are stored in this format, and being
    able to read them gives us insight about how the system works. In addition, many
    of the actual programs that the system uses (called scripts) are stored in this
    format. In later chapters, we will learn how to edit text files in order to modify
    systems settings and write our own scripts, but for now we will just look at their
    contents.


    The less command is used like this:


    ```

    less filename

    ```


    Once started, the less program allows you to scroll forward and backward through
    a text file. For example, to examine the file that defines all the system''s user
    accounts, enter the following command:


    ```

    [me@linuxbox ~]$ less /etc/passwd

    ```


    Once the less program starts, we may view the contents of the file. If the file
    is longer than one page, we can scroll up and down. To exit less, press the “q”
    key.


    The table below lists the most common keyboard commands used by less.


    Table 4-3: less Commands


    | Command | Action |

    |---|---|

    | Page Up or b | Scroll back one page |

    | Page Down or space | Scroll forward one page |

    | Up Arrow | Scroll up one line |'
