    # Less Is More


    The less program was designed as an improved replacement of an earlier Unix program
    called more. The name “less” is a play on the phrase “less is more”—a motto of
    modernist architects and designers.


    less falls into the class of programs called “pagers,” programs that allow the
    easy viewing of long text documents in a page by page manner. Whereas the more
    program could only page forward, the less program allows paging both forward and
    backward and has many other features as well.


    # A Guided Tour


    The file system layout on your Linux system is much like that found on other Unix-like
    systems. The design is actually specified in a published standard called the Linux
    Filesystem Hierarchy Standard. Not all Linux distributions conform to the standard
    exactly but most come pretty close.


    Next, we are going to wander around the file system ourselves to see what makes
    our Linux system tick. This will give you a chance to practice your navigation
    skills. One of the things we will discover is that many of the interesting files
    are in plain human-readable text. As we go about our tour, try the following:


    +   1. cd into a given directory

    +   2. List the directory contents with ls -l

    +   3. If you see an interesting file, determine its contents with file

    +   4. If it looks like it might be text, try viewing it with less'
