  md: '```

    [bill@linuxbox ~]$ sudo mkdir /usr/local/share/Music

    Password:

    ```


    Since bill is manipulating files outside his home directory, superuser privileges
    are required. After the directory is created, it has the following ownerships
    and permissions:


    ```

    [bill@linuxbox ~]$ ls -ld /usr/local/share/Music

    drwxr-xr-x 2 root root 4096 2008-03-21 18:05 /usr/local/share/Music

    ```


    As we can see, the directory is owned by root and has 755 permissions. To make
    this directory sharable, bill needs to change the group ownership and the group
    permissions to allow writing:


    ```

    [bill@linuxbox ~]$ sudo chown :music /usr/local/share/Music

    [bill@linuxbox ~]$ sudo chmod 775 /usr/local/share/Music

    [bill@linuxbox ~]$ ls -ld /usr/local/share/Music

    drwxrwxr-x 2 root music 4096 2008-03-21 18:05 /usr/local/share/Music

    ```


    So what does this all mean? It means that we now have a directory, /usr/local/share/Music
    that is owned by root and allows read and write access to group music. Group music
    has members bill and karen, thus bill and karen can create files in directory
    /usr/local/share/Music. Other users can list the contents of the directory but
    cannot create files there.


    But we still have a problem. With the current permissions, files and directories
    created within the Music directory will have the normal permissions of the users
    bill and karen:


    ```

    [bill@linuxbox ~]$ > /usr/local/share/Music/test_file

    [bill@linuxbox ~]$ ls -l /usr/local/share/Music

    -rw-r--r-- 1 bill bill 0 2008-03-24 20:03 test_file

    ```


    Actually there are two problems. First, the default umask on this system is 0022
    which prevents group members from writing files belonging to other members of
    the group. This would not be a problem if the shared directory only contained
    files, but since this directory will store music, and music is usually organized
    in a hierarchy of artists and albums, members of the group will need the ability
    to create files and directories inside directories created by other members. We
    need to change the umask used by bill and'
