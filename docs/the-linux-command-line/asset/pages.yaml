  md: '# test


    By far, the command used most frequently with if is test. The test command performs
    a variety of checks and comparisons. It has two equivalent forms:


    ```

    test expression

    ```


    and the more popular:


    ```

    [ expression ]

    ```


    where expression is an expression that is evaluated as either true or false. The
    test command returns an exit status of zero when the expression is true and a
    status of one when the expression is false.


    # File Expressions


    The following expressions are used to evaluate the status of files:


    Table 28-1: test File Expressions


    | Expression | Is True If: |

    |---|---|

    | file1 -ef file2 | file1 and file2 have the same inode numbers (the two filenames
    refer to the same file by hard linking). |

    | file1 -nt file2 | file1 is newer than file2. |

    | file1 -ot file2 | file1 is older than file2. |

    | -b file | file exists and is a block special (device) file. |

    | -c file | file exists and is a character special (device) file. |

    | -d file | file exists and is a directory. |

    | -e file | file exists. |

    | -f file | file exists and is a regular file. |

    | -g file | file exists and is set-group-ID. |

    | -G file | file exists and is owned by the effective group ID. |

    | -k file | file exists and has its “sticky bit” set. |

    | -L file | file exists and is a symbolic link. |

    | -O file | file exists and is owned by the effective user ID. |

    | -p file | file exists and is a named pipe. |

    | -r file | file exists and is readable (has readable permission for |'
  merge: -1
