- pgno: 415
  md: "# read – Read Values From Standard Input\n\nThe read builtin command is used\
    \ to read a single line of standard input. This command can be used to read keyboard\
    \ input or, when redirection is employed, a line of data from a file. The command\
    \ has the following syntax:\n\n```\nread [-options] [variable...]\n```\n\nwhere\
    \ options is one or more of the available options listed below and variable is\
    \ the name of one or more variables used to hold the input value. If no variable\
    \ name is supplied, the shell variable REPLY contains the line of data.\n\nBasically,\
    \ read assigns fields from standard input to the specified variables. If we modify\
    \ our integer evaluation script to use read, it might look like this:\n\n```\n\
    #!/bin/bash\n\n# read-integer: evaluate the value of an integer.\n\necho -n \"\
    Please enter an integer -> \"\nread int\n\nif [[ \"$int\" =~ ^-?[0-9]+$ ]]; then\n\
    \    if [ $int -eq 0 ]; then\n        echo \"$int is zero.\"\n    else\n     \
    \   if [ $int -lt 0 ]; then\n            echo \"$int is negative.\"\n        else\n\
    \            echo \"$int is positive.\"\n        fi\n        if [ $((int % 2))\
    \ -eq 0 ]; then\n            echo \"$int is even.\"\n        else\n          \
    \  echo \"$int is odd.\"\n        fi\n    fi\nelse\n    echo \"Input value is\
    \ not an integer.\" >&2\n    exit 1\nfi\n```\n\nWe use echo with the -n option\
    \ (which suppresses the trailing newline on output) to display a prompt, then\
    \ use read to input a value for the variable int. Running this script results\
    \ in this:"
  merge: -1
