    ```


    The locate program has been around for a number of years, and there are several
    different variants in common use. The two most common ones found in modern Linux
    distributions are slocate and mlocate, though they are usually accessed by a symbolic
    link named locate. The different versions of locate have overlapping options sets.
    Some versions include regular expression matching (which we’ll cover in an upcoming
    chapter) and wild card support. Check the man page for locate to determine which
    version of locate is installed.'
