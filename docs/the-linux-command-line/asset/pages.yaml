    # chgrp – Change Group Ownership


    In older versions of Unix, the chown command only changed file ownership, not
    group ownership. For that purpose, a separate command, chgrp was used. It works
    much the same way as chown, except for being more limited.


    # Exercising Our Privileges


    Now that we have learned how this permissions thing works, it''s time to show
    it off. We are going to demonstrate the solution to a common problem—setting up
    a shared directory. Let''s imagine that we have two users named “bill” and “karen.”
    They both have music CD collections and wish to set up a shared directory, where
    they will each store their music files as Ogg Vorbis or MP3. User bill has access
    to superuser privileges via sudo.


    The first thing that needs to happen is creating a group that will have both bill
    and karen as members. Using the graphical user management tool, bill creates a
    group called music and adds users bill and karen to it:


    ![](img/a46aa7daacc8e16f7545c9756b3bf128_122_0.png)


    Next, bill creates the directory for the music files:'
