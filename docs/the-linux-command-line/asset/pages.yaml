- pgno: 288
  md: 'Many uses of sort involve the processing of tabular data, such as the results
    of the ls command above. If we apply database terminology to the table above,
    we would say that each row is a record and that each record consists of multiple
    fields, such as the file attributes, link count, filename, file size and so on.
    sort is able to process individual fields. In database terms, we are able to specify
    one or more key fields to use as sort keys. In the example above, we specify the
    n and r options to perform a reverse numerical sort and specify -k 5 to make sort
    use the fifth field as the key for sorting.


    The k option is very interesting and has many features, but first we need to talk
    about how sort defines fields. Let’s consider a very simple text file consisting
    of a single line containing the author’s name:


    ```

    William  Shotts

    ```


    By default, sort sees this line as having two fields. The first field contains
    the characters:


    ```

    "William"

    ```


    and the second field contains the characters:


    ```

    "  Shotts"

    ```


    meaning that whitespace characters (spaces and tabs) are used as delimiters between
    fields and that the delimiters are included in the field when sorting is performed.


    Looking again at a line from our ls output, we can see that a line contains eight
    fields and that the fifth field is the file size:


    ```

    -rwxr-xr-x 1 root  root  8234216 2008-04-07 17:42 inkscape

    ```


    For our next series of experiments, let’s consider the following file containing
    the history of three popular Linux distributions released from 2006 to 2008. Each
    line in the file has three fields: the distribution name, version number, and
    date of release in MM/DD/YYYY format:


    | SUSE | 10.2 | 12/07/2006 |

    | Fedora | 10 | 11/25/2008 |

    | SUSE | 11.0 | 06/19/2008 |

    | Ubuntu | 8.04 | 04/24/2008 |

    | Fedora | 8 | 11/08/2007 |

    | SUSE | 10.3 | 10/04/2007 |'
  merge: -1
  img_proc: true
- pgno: 289
  md: '```

    Ubuntu    6.10  10/26/2006

    Fedora    7     05/31/2007

    Ubuntu    7.10  10/18/2007

    Ubuntu    7.04  04/19/2007

    SUSE      10.1  05/11/2006

    Fedora    6     10/24/2006

    Fedora    9     05/13/2008

    Ubuntu    6.06  06/01/2006

    Ubuntu    8.10  10/30/2008

    Fedora    5     03/20/2006

    ```


    Using a text editor (perhaps vim), we’ll enter this data and name the resulting
    file distros.txt.


    Next, we’ll try sorting the file and observe the results:


    ```

    [me@linuxbox ~]$ sort distros.txt

    Fedora    10    11/25/2008

    Fedora    5     03/20/2006

    Fedora    6     10/24/2006

    Fedora    7     05/31/2007

    Fedora    8     11/08/2007

    Fedora    9     05/13/2008

    SUSE      10.1  05/11/2006

    SUSE      10.2  12/07/2006

    SUSE      10.3  10/04/2007

    SUSE      11.0  06/19/2008

    Ubuntu    6.06  06/01/2006

    Ubuntu    6.10  10/26/2006

    Ubuntu    7.04  04/19/2007

    Ubuntu    7.10  10/18/2007

    Ubuntu    8.04  04/24/2008

    Ubuntu    8.10  10/30/2008

    ```


    Well, it mostly worked. The problem occurs in the sorting of the Fedora version
    numbers. Since a “1” comes before a “5” in the character set, version “10” ends
    up at the top while version “9” falls to the bottom.


    To fix this problem we are going to have to sort on multiple keys. We want to
    perform an alphabetic sort on the first field and then a numeric sort on the third
    field. sort allows multiple instances of the -k option so that multiple sort keys
    can be specified. In fact, a key may include a range of fields. If no range is
    specified (as has been the case with our previous examples), sort uses a key that
    begins with the specified field and extends to the end of the line. Here is the
    syntax for our multi-key sort:'
  merge: -1
  img_proc: true
- pgno: 290
  md: '```

    [me@linuxbox ~]$ sort --key=1,1 --key=2n distros.txt

    Fedora      5     03/20/2006

    Fedora      6     10/24/2006

    Fedora      7     05/31/2007

    Fedora      8     11/08/2007

    Fedora      9     05/13/2008

    Fedora     10     11/25/2008

    SUSE       10.1   05/11/2006

    SUSE       10.2   12/07/2006

    SUSE       10.3   10/04/2007

    SUSE       11.0   06/19/2008

    Ubuntu     6.06   06/01/2006

    Ubuntu     6.10   10/26/2006

    Ubuntu     7.04   04/19/2007

    Ubuntu     7.10   10/18/2007

    Ubuntu     8.04   04/24/2008

    Ubuntu     8.10   10/30/2008

    ```


    Though we used the long form of the option for clarity, -k 1,1 -k 2n would be
    exactly equivalent. In the first instance of the key option, we specified a range
    of fields to include in the first key. Since we wanted to limit the sort to just
    the first field, we specified 1,1 which means "start at field one and end at field
    one." In the second instance, we specified 2n, which means that field two is the
    sort key and that the sort should be numeric. An option letter may be included
    at the end of a key specifier to indicate the type of sort to be performed. These
    option letters are the same as the global options for the sort program: b (ignore
    leading blanks), n (numeric sort), r (reverse sort), and so on.


    The third field in our list contains a date in an inconvenient format for sorting.
    On computers, dates are usually formatted in YYYY-MM-DD order to make chronological
    sorting easy, but ours are in the American format of MM/DD/YYYY. How can we sort
    this list in chronological order?


    Fortunately, sort provides a way. The key option allows specification of offsets
    within fields, so we can define keys within fields:


    ```

    [me@linuxbox ~]$ sort -k 3.7nbr -k 3.1nbr -k 3.4nbr distros.txt

    Fedora     10     11/25/2008

    Ubuntu     8.10   10/30/2008

    SUSE       11.0   06/19/2008

    Fedora      9     05/13/2008

    Ubuntu     8.04   04/24/2008

    Fedora      8     11/08/2007

    Ubuntu     7.10   10/18/2007

    SUSE       10.3   10/04/2007

    ```'
  merge: -1
  img_proc: true
- pgno: 291
  md: '```

    Fedora      7      05/31/2007

    Ubuntu      7.04   04/19/2007

    SUSE        10.2   12/07/2006

    Ubuntu      6.10   10/26/2006

    Fedora      6      10/24/2006

    Ubuntu      6.06   06/01/2006

    SUSE        10.1   05/11/2006

    Fedora      5      03/20/2006

    ```


    By specifying -k 3.7 we instruct sort to use a sort key that begins at the seventh
    character within the third field, which corresponds to the start of the year.
    Likewise, we specify -k 3.1 and -k 3.4 to isolate the month and day portions of
    the date. We also add the n and r options to achieve a reverse numeric sort. The
    b option is included to suppress the leading spaces (whose numbers vary from line
    to line, thereby affecting the outcome of the sort) in the date field.


    Some files don’t use tabs and spaces as field delimiters; for example, the /etc/passwd
    file:


    ```

    [me@linuxbox ~]$ head /etc/passwd

    root:x:0:0:root:/root:/bin/bash

