- pgno: 141
  md: '# 12 – The Environment


    As we discussed earlier, the shell maintains a body of information during our
    shell session called the *environment*. Data stored in the environment is used
    by programs to determine facts about our configuration. While most programs use
    *configuration files* to store program settings, some programs will also look
    for values stored in the environment to adjust their behavior. Knowing this, we
    can use the environment to customize our shell experience.


    In this chapter, we will work with the following commands:


    +   - `printenv` – Print part or all of the environment

    +   - `set` – Set shell options

    +   - `export` – Export environment to subsequently executed programs

    +   - `alias` – Create an alias for a command


    # What Is Stored In The Environment?


    The shell stores two basic types of data in the environment, though, with *bash*,
    the types are largely indistinguishable. They are *environment variables* and
    *shell variables*. Shell variables are bits of data placed there by *bash*, and
    environment variables are basically everything else. In addition to variables,
    the shell also stores some programmatic data, namely *aliases* and *shell functions*.
    We covered aliases in Chapter 6, and shell functions (which are related to shell
    scripting) will be covered in Part 5.


    # Examining The Environment


    We can use either the `set` builtin in *bash* or the `printenv` program to see
    what is stored in the environment. The `set` command will show both the shell
    and environment variables, while `printenv` will only display the latter. Since
    the list of environment contents will be fairly long, it is best to pipe the output
    of either command into `less`:


    ```

    [me@linuxbox ~]$ printenv | less

    ```'
  merge: -1
  img_proc: true
