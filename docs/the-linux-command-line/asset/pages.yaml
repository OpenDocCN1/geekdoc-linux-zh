- pgno: 220
  md: 'remotely via a network. In the early days, before the general adoption of the
    Internet, there were a couple of popular programs used to log in to remote hosts.
    These were the rlogin and telnet programs. These programs, however, suffer from
    the same fatal flaw that the ftp program does; they transmit all their communications
    (including login names and passwords) in cleartext. This makes them wholly inappropriate
    for use in the Internet age.


    # ssh


    To address this problem, a new protocol called SSH (Secure Shell) was developed.
    SSH solves the two basic problems of secure communication with a remote host.
    First, it authenticates that the remote host is who it says it is (thus preventing
    so-called “man in the middle” attacks), and second, it encrypts all of the communications
    between the local and remote hosts.


    SSH consists of two parts. An SSH server runs on the remote host, listening for
    incoming connections on port twenty-two, while an SSH client is used on the local
    system to communicate with the remote server.


    Most Linux distributions ship an implementation of SSH called OpenSSH from the
    BSD project. Some distributions include both the client and the server packages
    by default (for example, Red Hat), while others (such as Ubuntu) only supply the
    client. To enable a system to receive remote connections, it must have the OpenSSH-server
    package installed, configured and running, and (if the system is either running
    or is behind a firewall) it must allow incoming network connections on TCP port
    22.


    > Tip: If you don’t have a remote system to connect to but want to try these examples,
    make sure the OpenSSH-server package is installed on your system and use localhost
    as the name of the remote host. That way, your machine will create network connections
    with itself.


    The SSH client program used to connect to remote SSH servers is called, appropriately
    enough, ssh. To connect to a remote host named remote-sys, we would use the ssh
    client program like so:


    ```

    [me@linuxbox ~]$ ssh remote-sys

    The authenticity of host ''remote-sys (192.168.1.4)'' can''t be established.

    RSA key fingerprint is

    41:ed:7a:df:23:19:bf:3c:a5:17:bc:61:b3:7f:d9:bb.

    Are you sure you want to continue connecting (yes/no)?

    ```'
