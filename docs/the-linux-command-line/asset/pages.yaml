- pgno: 323
  md: '| 8 | Fedora | 7 | 05/31/2007 |

    | 9 | Ubuntu | 7.10 | 10/18/2007 |

    | 10 | Ubuntu | 7.04 | 04/19/2007 |


    Like cat, nl can accept either multiple files as command line arguments, or standard
    input. However, nl has a number of options and supports a primitive form of markup
    to allow more complex kinds of numbering.


    nl supports a concept called “logical pages” when numbering. This allows nl to
    reset (start over) the numerical sequence when numbering. Using options, it is
    possible to set the starting number to a specific value and, to a limited extent,
    its format. A logical page is further broken down into a header, body, and footer.
    Within each of these sections, line numbering may be reset and/or be assigned
    a different style. If nl is given multiple files, it treats them as a single stream
    of text. Sections in the text stream are indicated by the presence of some rather
    odd-looking markup added to the text:


    # Table 22-1: nl Markup


    | Markup | Meaning |

    | \:\\:\ | Start of logical page header |

    | \:\\: | Start of logical page body |

    | \: | Start of logical page footer |


    Each of the above markup elements must appear alone on its own line. After processing
    a markup element, nl deletes it from the text stream.


    Here are the common options for nl:


    # Table 22-2: Common nl Options


    | Option | Meaning |

    | -b style | Set body numbering to style, where style is one of the following:

    a = number all lines

    t = number only non-blank lines. This is the default.

    n = none

    pregexp = number only lines matching basic regular expression regexp. |

    | -f style | Set footer numbering to style. Default is n (none). |

    | -h style | Set header numbering to style. Default is n (none). |'
