  md: '# Identifying Commands


    It is often useful to know exactly which of the four kinds of commands is being
    used and Linux provides a couple of ways to find out.


    # type – Display A Command''s Type


    The type command is a shell builtin that displays the kind of command the shell
    will execute, given a particular command name. It works like this:


    ```

    type command

    ```


    where “command” is the name of the command you want to examine. Here are some
    examples:


    ```

    [me@linuxbox ~]$ type type

    type is a shell builtin

    [me@linuxbox ~]$ type ls

    ls is aliased to `ls --color=tty''

    [me@linuxbox ~]$ type cp

    cp is /bin/cp

    ```


    Here we see the results for three different commands. Notice that the one for
    ls (taken from a Fedora system) and how the ls command is actually an alias for
    the ls command with the “--color=tty” option added. Now we know why the output
    from ls is displayed in color!


    # which – Display An Executable''s Location


    Sometimes there is more than one version of an executable program installed on
    a system. While this is not very common on desktop systems, it''s not unusual
    on large servers. To determine the exact location of a given executable, the which
    command is used:


    ```

    [me@linuxbox ~]$ which ls

    /bin/ls

    ```


    which only works for executable programs, not builtins nor aliases that are substitutes
    for actual executable programs. When we try to use which on a shell builtin, for'
