    Tip: The diction program, like all GNU Project software, follows certain standards
    for source code packaging. Most other source code available in the Linux ecosystem
    also follows this standard. One element of the standard is that by unpacking the
    source code tar file, a directory will be created which contains the source tree,
    and that this directory will be named project-x.xx, thus containing both the project''s
    name and version number. This scheme allows easy installation of multiple versions
    of the same program. However, it is often a good idea to examine the layout of
    the tree before unpacking it. Some projects will not create the directory, but
    instead will deliver the files directly into the current directory. This will
    make a mess in your otherwise well-organized src directory. To avoid this, use
    the following command to examine the contents of the tar file:


    ```

    tar tzvf tarfile | head

    ```


