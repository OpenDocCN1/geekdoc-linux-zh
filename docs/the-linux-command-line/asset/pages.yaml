    formatting and printing tricks, but unlike a2ps, it only accepts text input.


    # Monitoring And Controlling Print Jobs


    As Unix printing systems are designed to handle multiple print jobs from multiple
    users, CUPS is designed to do the same. Each printer is given a print queue, where
    jobs are parked until they can be spooled to the printer. CUPS supplies several
    command line programs that are used to manage printer status and print queues.
    Like the lpr and lp programs, these management programs are modeled after the
    corresponding programs from the Berkeley and System V printing systems.


    # lpstat – Display Print System Status


    The lpstat program is useful for determining the names and availability of printers
    on the system. For example, if we had a system with both a physical printer (named
    "printer") and a PDF virtual printer (named "PDF"), we could check their status
    like this:'
  merge: -1
  img_proc: true
- pgno: 354
  md: '```

    [me@linuxbox ~]$ lpstat -a

    PDF accepting requests since Mon 08 Dec 2008 03:05:59 PM EST

    printer accepting requests since Tue 24 Feb 2009 08:43:22 AM EST

    ```


    Further, we could determine a more detailed description of the print system configuration
    this way:


    ```

    [me@linuxbox ~]$ lpstat -s

    system default destination: printer

    device for PDF: cups-pdf://

    device for printer: ipp://print-server:631/printers/printer

    ```


    In this example, we see that “printer” is the system’s default printer and that
    it is a network printer using Internet Printing Protocol (ipp://) attached to
    a system named “print-server”.


    The commonly useful options include:


    Table 23-5: Common lpstat Options


    | Option | Description |

    |---|---|

    | -a [printer...] | Display the state of the printer queue for printer. Note that
    this is the status of the printer queue’s ability to accept jobs, not the status
    of the physical printers. If no printers are specified, all print queues are shown.
    |

    | -d | Display the name of system’s default printer. |

    | -p [printer...] | Display the status of the specified printer. If no printers
    are specified, all printers are shown. |

    | -r | Display the status of the print server. |

    | -s | Display a status summary. |

    | -t | Display a complete status report. |


    # lpq – Display Printer Queue Status


    To see the status of a printer queue, the lpq program is used. This allows us
    to view the status of the queue and the print jobs it contains. Here is an example
    of an empty queue for a system default printer named “printer”:'
  merge: -1
  img_proc: true
- pgno: 355
  md: '```

    [me@linuxbox ~]$ lpq

    printer is ready

    no entries

    ```


    If we do not specify a printer (using the -P option), the system’s default printer
    is shown. If we send a job to the printer and then look at the queue, we will
    see it listed:


    ```

    [me@linuxbox ~]$ ls *.txt | pr -3 | lp

    request id is printer-603 (1 file(s))

    [me@linuxbox ~]$ lpq

    printer is ready and printing

    Rank Owner Job File(s) Total Size

    active me 603 (stdin) 1024 bytes

    ```


    # lprm / cancel – Cancel Print Jobs


    CUPS supplies two programs used to terminate print jobs and remove them from the
    print queue. One is Berkeley style (lprm) and the other is System V (cancel).
    They differ slightly in the options they support, but do basically the same thing.
    Using our print job above as an example, we could stop the job and remove it this
    way:


    ```

    [me@linuxbox ~]$ cancel 603

    [me@linuxbox ~]$ lpq

    printer is ready

    no entries

    ```


    Each command has options for removing all the jobs belonging to a particular user,
    particular printer, and multiple job numbers. Their respective man pages have
    all the details.


    # Summing Up


    In this chapter, we have seen how the printers of the past influenced the design
    of the printing systems on Unix-like machines, and how much control is available
    on the command line to control not only the scheduling and execution of print
    jobs, but also the various output options.


    # Further Reading


