    to a shared directory, such as /tmp.


    Here are some examples of using chmod with symbolic notation to set these special
    permissions. First assigning setuid to a program:


    ```

    chmod u+s program

    ```


    Next, assigning setgid to a directory:


    ```

    chmod g+s dir

    ```


    Finally, assigning the sticky bit to a directory:


    ```

    chmod +t dir

    ```


    When viewing the output from ls, you can determine the special permissions. Here
    are some examples. First, a program that is setuid:


    ```

    -rwsr-xr-x

    ```


    A directory that has the setgid attribute:


    ```

    drwxrwsr-x

    ```


    A directory with the sticky bit set:


    ```

    drwxrwxrwt

    ```


    # Changing Identities


    At various times, we may find it necessary to take on the identity of another
    user. Often we want to gain superuser privileges to carry out some administrative
    task, but it is also possible to “become” another regular user for such things
    as testing an account. There are three ways to take on an alternate identity:


    +   1. Log out and log back in as the alternate user.

    +   2. Use the su command.

    +   3. Use the sudo command.


    We will skip the first technique since we know how to do it and it lacks the convenience
    of the other two. From within our own shell session, the su command allows you
    to assume the identity of another user, and either start a new shell session with
    that user''s IDs, or to issue a single command as that user. The sudo command
    allows an administrator to set up a configuration file called /etc/sudoers, and
    define specific commands that particular users are permitted to execute under
    an assumed identity.'
