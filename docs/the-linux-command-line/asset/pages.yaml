  md: '# Examining And Monitoring A Network


    Even if you''re not the system administrator, it''s often helpful to examine the
    performance and operation of a network.


    # ping


    The most basic network command is ping. The ping command sends a special network
    packet called an IMCP ECHO_REQUEST to a specified host. Most network devices receiving
    this packet will reply to it, allowing the network connection to be verified.


    Note: It is possible to configure most network devices (including Linux hosts)
    to ignore these packets. This is usually done for security reasons, to partially
    obscure a host from a potential attacker. It is also common for firewalls to be
    configured to block IMCP traffic.


    For example, to see if we can reach linuxcommand.org (one of our favorite sites
    ;-), we can use use ping like this:


    ```

    [me@linuxbox ~]$ ping linuxcommand.org

    ```


    Once started, ping continues to send packets at a specified interval (default
    is one second) until it is interrupted:


    ```

    [me@linuxbox ~]$ ping linuxcommand.org

    PING linuxcommand.org (66.35.250.210) 56(84) bytes of data.

    64 bytes from vhost.sourceforge.net (66.35.250.210): icmp_seq=1

    ttl=43 time=107 ms

    64 bytes from vhost.sourceforge.net (66.35.250.210): icmp_seq=2

    ttl=43 time=108 ms

    64 bytes from vhost.sourceforge.net (66.35.250.210): icmp_seq=3

    ttl=43 time=106 ms

    64 bytes from vhost.sourceforge.net (66.35.250.210): icmp_seq=4

    ttl=43 time=106 ms

    64 bytes from vhost.sourceforge.net (66.35.250.210): icmp_seq=5

    ttl=43 time=105 ms

    ```'
