    1^H1s^HS [_^HO_^HP_^HT_^HI_^HO_^HN]... [_^HF_^HI_^HL_^HE]...$

    ```


    The ^H (Control-h) characters are the backspaces used to create the boldface effect.
    Likewise, we can also see a backspace/underscore sequence used to produce underlining.


    # Graphical Printers


    The development of GUIs led to major changes in printer technology. As computers
    moved to more picture-based displays, printing moved from character-based to graphical
    techniques. This was facilitated by the advent of the low-cost laser printer which,
    instead of printing fixed characters, could print tiny dots anywhere in the printable
    area of the page. This made printing proportional fonts (like those used by typesetters),
    and even photographs and high quality diagrams, possible.


    However, moving from a character-based scheme to a graphical scheme presented
    a formidable technical challenge. Here’s why: the number of bytes needed to fill
    a page using a character-based printer can be calculated this way (assuming sixty
    lines per page each containing eighty characters):


    60 X 80 = 4800 bytes


    In comparison, a three hundred dot per inch (DPI) laser printer (assuming an eight
    by ten inch print area per page) requires:


    (8 X 300) X (10 X 300) / 8 = 900000 bytes


    Many of the slow PC networks simply could not handle the nearly one megabyte of
    data required to print a full page on a laser printer, so it was clear that a
    clever invention was needed.


    That invention turned out to be the page description language (PDL). A page description
    language is a programming language that describes the contents of a page. Basically
    it says, “go to this position, draw the character ‘a’ in ten point Helvetica,
    go to this position...” until everything on the page is described. The first major
    PDL was PostScript from Adobe Systems, which is still in wide use today. The PostScript
    language is a complete programming language tailored for typography and other
    kinds of graphics and imaging. It includes built-in support for thirty-five standard,
    high-quality fonts, plus the ability to accept additional font definitions at
    run time. At first, support for PostScript was built into the printers themselves.
    This solved the data transmission problem. While the typical PostScript program
    was very verbose in comparison to the simple byte stream of character-based printers,
    it was much smaller than the number of bytes required to represent the entire
    printed page.


    A PostScript printer accepted a PostScript program as input. The printer contained
    its'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'own processor and memory (oftentimes making the printer a more powerful computer
    than the computer to which it was attached) and executed a special program called
    a *PostScript interpreter*, which read the incoming PostScript program and *rendered*
    the results into the printer’s internal memory, thus forming the pattern of bits
    (dots) that would be transferred to the paper. The generic name for this process
    of rendering something into a large bit pattern (called a *bitmap*) is *raster
    image processor* or RIP.


    As the years went by, both computers and networks became much faster. This allowed
    the RIP to move from the printer to the host computer, which, in turn, permitted
    high quality printers to be much less expensive.


    Many printers today still accept character-based streams, but many low-cost printers
    do not. They rely on the host computer’s RIP to provide a stream of bits to print
    as dots. There are still some PostScript printers, too.


    # Printing With Linux


    Modern Linux systems employ two software suites to perform and manage printing.
    The first, CUPS (Common Unix Printing System) provides print drivers and print
    job management, and the second, Ghostscript, a PostScript interpreter, acts as
    a RIP.


    CUPS manages printers by creating and maintaining print queues. As we discussed
    in our history lesson above, Unix printing was originally designed to manage a
    centralized printer shared by multiple users. Since printers are slow by nature,
    compared to the computers that are feeding them, printing systems need a way to
    schedule multiple print jobs and keep things organized. CUPS also has the ability
    to recognize different types of data (within reason) and can convert files to
    a printable form.


    # Preparing Files For Printing


    As command line users, we are mostly interested in printing text, though it is
    certainly possible to print other data formats as well.


    # pr — Convert Text Files For Printing


    We looked at pr a little in the previous chapter. Now we will examine some of
    its many options used in conjunction with printing. In our history of printing,
    we saw how character-based printers use monospaced fonts, resulting in fixed numbers
    of characters per line and lines per page. pr is used to adjust text to fit on
    a specific page size, with optional page headers and margins. Here is a summary
    of its most commonly used options:'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# 23 — Printing


    **Table 23-1: Common `pr` Options**


    | Option | Description |

    |---|---|

    | `+first[:last]` | Output a range of pages starting with *first* and, optionally,
    ending with *last*. |

    | `-columns` | Organize the content of the page into the number of columns specified
    by *columns*. |

    | `-a` | By default, multi-column output is listed vertically. By adding the -a
    (across) option, content is listed horizontally. |

    | `-d` | Double-space output. |

    | `-D “format”` | Format the date displayed in page headers using *format*. See
    the man page for the date command for a description of the format string. |

    | `-f` | Use form feeds rather than carriage returns to separate pages. |

    | `-h “header”` | In the center portion of the page header, use *header* rather
    than the name of the file being processed. |

    | `-l length` | Set page length to *length*. Default is 66 (US letter at 6 lines
    per inch) |

    | `-n` | Number lines. |

    | `-o offset` | Create a left margin *offset* characters wide. |

    | `-w width` | Set page width to *width*. Default is 72. |


    `pr` is often used in pipelines as a filter. In this example, we will produce
    a directory listing of `/usr/bin` and format it into paginated three-column output
    using `pr`:


    ```

    ```text

    [me@linuxbox ~]$ ls /usr/bin | pr -3 -w 65 | head


    2009-02-18 14:00                                      Page 1


    [

    411toppm                 apturl                 bsd-write

    a2p                     ar                     bsh

    a2ps                    arecord                 btflash

    a2ps-lpr-wrapper        ark                    bug-buddy

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# Sending A Print Job To A Printer


    The CUPS printing suite supports two methods of printing historically used on
    Unix-like systems. One method, called Berkeley or LPD (used in the Berkeley Software
    Distribution version of Unix), uses the lpr program, while the other method, called
    SysV (from the System V version of Unix), uses the lp program. Both programs do
    roughly the same thing. Choosing one over the other is a matter of personal taste.


    # lpr – Print Files (Berkeley Style)


    The lpr program can be used to send files to the printer. It may also used in
    pipelines, as it accepts standard input. For example, to print the results of
    our multi-column directory listing above, we could do this:


    ```

    [me@linuxbox ~]$ ls /usr/bin | pr -3 | lpr

    ```


    and the report would be sent to the system''s default printer. To send the file
    to a different printer, the -P option can used like this:


    ```

    lpr -P printer_name

    ```


    where printer_name is the name of the desired printer. To see a list of printers
    known to the system:


    ```

    [me@linuxbox ~]$ lpstat -a

    ```


    > Tip: Many Linux distributions allow you to define a “printer” that outputs files
    in PDF (Portable Document Format) format, rather than printing on the physical
    printer. This is very handy for experimenting with printing commands. Check your
    printer configuration program to see if it supports this configuration. On some
    distributions, you may need to install additional packages (such as cups-pdf)
    to enable this capability.


    Here are some of the common options for lpr:'
  merge: -1
  img_proc: true
- pgno: 349
  md: '# Table 23-2: Common lpr Options


    | Option | Description |

    |---|---|

    | -# *number* | Set number of copies to *number*. |

    | -p | Print each page with a shaded header with the date, time, job name and
    page number. This so-called "pretty print" option can be used when printing text
    files. |

    | -P *printer* | Specify the name of the printer used for output. If no printer
    is specified, the system''s default printer is used. |

    | -r | Delete files after printing. This would be useful for programs that produce
    temporary printer output files. |


    # lp – Print Files (System V Style)


    Like lpr, lp accepts either files or standard input for printing. It differs from
    lpr in that it supports a different (and slightly more sophisticated) option set.
    Here are the common ones:


    # Table 23-3: Common lp Options


    | Option | Description |

    |---|---|

    | -d *printer* | Set the destination (printer) to *printer*. If no d option is
    specified, the system default printer is used. |

    | -n *number* | Set the number of copies to *number*. |

    | -o landscape | Set output to landscape orientation. |

    | -o fitplot | Scale the file to fit the page. This is useful when printing images,
    such as JPEG files. |

    | -o scaling=*number* | Scale file to *number*. The value of 100 fills the page.
    Values less than 100 are reduced, while values greater than 100 cause the file
    to be printed across multiple pages. |

    | -o cpi=*number* | Set the output characters per inch to *number*. Default is
    10. |

    | -o lpi=*number* | Set the output lines per inch to *number*. Default is 6. |'
  merge: -1
  img_proc: true
- pgno: 350
  md: '| Option | Description |

    |---|---|

    | `-o page-bottom=points`

    `-o page-left=points`

    `-o page-right=points`

    `-o page-top=points` | Set the page margins. Values are expressed in points, a
    unit of typographic measurement. There are 72 points to an inch. |

    | `-P pages` | Specify the list of pages. pages may be expressed as a comma separated
    list and/or a range. For example "1,3,5,7-10" |


    We’ll produce our directory listing again, this time printing twelve CPI and eight
    LPI with a left margin of one half inch. Note that we have to adjust the pr options
    to account for the new page size:


    ```

    [me@linuxbox ~]$ ls /usr/bin | pr -4 -w 90 -l 88 | lp -o page-left=36 -o cpi=12
    -o lpi=8

    ```


    This pipeline produces a four column listing using smaller type than the default.
    The increased number of characters per inch allows us to fit more columns on the
    page.


    # Another Option: a2ps


    The a2ps program is interesting. As we can surmise from it name, it’s a format
    conversion program, but it also much more. Its name originally meant “ASCII to
    PostScript” and it was used to prepare text files for printing on PostScript printers.
    Over the years, however, the capabilities of the program have grown, and now its
    name means “Anything to PostScript.” While its name suggest a format conversion
    program, it is actually a printing program. It sends its default output to the
    system’s default printer rather than standard output. The program’s default behavior
    is that of a “pretty printer,” meaning that it improves the appearance of output.
    If we use the program to create a PostScript file on our desktop:


    ```

    [me@linuxbox ~]$ ls /usr/bin | pr -3 -t | a2ps -o ~/Desktop/ls.ps -L 66

    [stdin (plain): 11 pages on 6 sheets]

    [Total: 11 pages on 6 sheets] saved into the file `/home/me/Desktop/ls.ps`

    ```


    Here we filter the stream with pr, using the -t option (omit headers and footers)
    and then with a2ps, specifying an output file (-o option) and 66 lines per page
    (-L option)'
