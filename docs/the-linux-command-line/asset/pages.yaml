- pgno: 272
  md: 'As always with proprietary vendors, each was trying to play a winning game
    of “lock-in” with their customers. This dark time in the history of Unix is known
    today as “the Balkanization.”


    Enter the IEEE (Institute of Electrical and Electronics Engineers). In the mid-1980s,
    the IEEE began developing a set of standards that would define how Unix (and Unix-like)
    systems would perform. These standards, formally known as IEEE 1003, define the
    application programming interfaces (APIs), shell and utilities that are to be
    found on a standard Unix-like system. The name “POSIX,” which stands for Portable
    Operating System Interface (with the “X” added to the end for extra snappiness),
    was suggested by Richard Stallman (yes, that Richard Stallman), and was adopted
    by the IEEE.


    # Alternation


    The first of the extended regular expression features we will discuss is called
    alternation, which is the facility that allows a match to occur from among a set
    of expressions. Just as a bracket expression allows a single character to match
    from a set of specified characters, alternation allows matches from a set of strings
    or other regular expressions.


    To demonstrate, we’ll use grep in conjunction with echo. First, let’s try a plain
    old string match:


    ```

    [me@linuxbox ~]$ echo "AAA" | grep AAA

    AAA

    [me@linuxbox ~]$ echo "BBB" | grep AAA

    [me@linuxbox ~]$

    ```


    A pretty straightforward example, in which we pipe the output of echo into grep
    and see the results. When a match occurs, we see it printed out; when no match
    occurs, we see no results.


    Now we’ll add alternation, signified by the vertical bar metacharacter:


    ```

    [me@linuxbox ~]$ echo "AAA" | grep -E ''AAA|BBB''

    AAA

    [me@linuxbox ~]$ echo "BBB" | grep -E ''AAA|BBB''

    BBB

    [me@linuxbox ~]$ echo "CCC" | grep -E ''AAA|BBB''

    [me@linuxbox ~]$

    ```'
  merge: -1
  img_proc: true
