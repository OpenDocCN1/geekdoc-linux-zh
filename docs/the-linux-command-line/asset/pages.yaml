  md: "| * | Multiplication |\n| / | Integer division |\n| ** | Exponentiation |\n\
    | % | Modulo (remainder) |\n\nMost of these are self-explanatory, but integer\
    \ division and modulo require further discussion.\n\nSince the shell’s arithmetic\
    \ only operates on integers, the results of division are always whole numbers:\n\
    \n```\n[me@linuxbox ~]$ echo $(( 5 / 2 ))\n2\n```\n\nThis makes the determination\
    \ of a remainder in a division operation more important:\n\n```\n[me@linuxbox\
    \ ~]$ echo $(( 5 % 2 ))\n1\n```\n\nBy using the division and modulo operators,\
    \ we can determine that five divided by two results in two, with a remainder of\
    \ one.\n\nCalculating the remainder is useful in loops. It allows an operation\
    \ to be performed at specified intervals during the loop’s execution. In the example\
    \ below, we display a line of numbers, highlighting each multiple of five:\n\n\
    ```\n#!/bin/bash\n\n# modulo : demonstrate the modulo operator\n\nfor ((i = 0;\
    \ i <= 20; i = i + 1)); do\n    remainder=$((i % 5))\n    if (( remainder == 0\
    \ )); then\n        printf \"<%d> \" $i\n    else\n        printf \"%d \" $i\n\
    \    fi\ndone\nprintf \"\\n\"\n```"
  merge: -1
  img_proc: true
- pgno: 479
  md: 'When executed, the results look like this:


    ```

