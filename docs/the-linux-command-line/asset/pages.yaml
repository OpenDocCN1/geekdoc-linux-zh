  md: "The script evaluates the file assigned to the constant FILE and displays its\
    \ results as the evaluation is performed. There are two interesting things to\
    \ note about this script. First, notice how the parameter $FILE is quoted within\
    \ the expressions. This is not required, but is a defense against the parameter\
    \ being empty. If the parameter expansion of $FILE were to result in an empty\
    \ value, it would cause an error (the operators would be interpreted as non-null\
    \ strings rather than operators). Using the quotes around the parameter insures\
    \ that the operator is always followed by a string, even if the string is empty.\
    \ Second, notice the presence of the exit commands near the end of the script.\
    \ The exit command accepts a single, optional argument, which becomes the script's\
    \ exit status. When no argument is passed, the exit status defaults to zero. Using\
    \ exit in this way allows the script to indicate failure if $FILE expands to the\
    \ name of a nonexistent file. The exit command appearing on the last line of the\
    \ script is there as a formality. When a script “runs off the end” (reaches end\
    \ of file), it terminates with an exit status of zero by default, anyway.\n\n\
    Similarly, shell functions can return an exit status by including an integer argument\
    \ to the return command. If we were to convert the script above to a shell function\
    \ to include it in a larger program, we could replace the exit commands with return\
    \ statements and get the desired behavior:\n\n```\ntest_file () {\n    # test-file:\
    \ Evaluate the status of a file\n    \n    FILE=~/.bashrc\n    \n    if [ -e \"\
    $FILE\" ]; then\n        if [ -f \"$FILE\" ]; then\n            echo \"$FILE is\
    \ a regular file.\"\n        fi\n        if [ -d \"$FILE\" ]; then\n         \
