  md: "```\nfile\n```\n\n```\n${parameter/pattern/string}\n${parameter//pattern/string}\n\
    ${parameter/#pattern/string}\n${parameter/%pattern/string}\n```\n\nThis expansion\
    \ performs a search and replace upon the contents of parameter. If text is found\
    \ matching wildcard pattern, it is replaced with the contents of string. In the\
    \ normal form, only the first occurrence of pattern is replaced. In the // form,\
    \ all occurrences are replaced. The # form requires that the match occur at the\
    \ beginning of the string, and the /% form requires the match to occur at the\
    \ end of the string. /string may be omitted, which causes the text matched by\
    \ pattern to be deleted.\n\n```\n[me@linuxbox ~]$ foo.JPG.JPG\n[me@linuxbox ~]$\
    \ echo ${foo/JPG/jpg}\njpg.JPG\n[me@linuxbox ~]$ echo ${foo//JPG/jpg}\njpg.jpg\n\
    [me@linuxbox ~]$ echo ${foo/#JPG/jpg}\njpg.JPG\n[me@linuxbox ~]$ echo ${foo/%JPG/jpg}\n\
    JPG.jpg\n```\n\nParameter expansion is a good thing to know. The string manipulation\
    \ expansions can be used as substitutes for other common commands such as sed\
    \ and cut. Expansions improve the efficiency of scripts by eliminating the use\
    \ of external programs. As an example, we will modify the longest-word program\
