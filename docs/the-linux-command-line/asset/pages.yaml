- pgno: 311
  md: '# Table 21-8: sed Basic Editing Commands


    | Command | Description |

    |---|---|

    | = | Output current line number. |

    | a | Append text after the current line. |

    | d | Delete the current line. |

    | i | Insert text in front of the current line. |

    | p | Print the current line. By default, sed prints every line and only edits
    lines that match a specified address within the file. The default behavior can
    be overridden by specifying the -n option. |

    | q | Exit sed without processing any more lines. If the -n option is not specified,
    output the current line. |

    | Q | Exit sed without processing any more lines. |

    | s/regexp/replacement/ | Substitute the contents of replacement wherever regexp
    is found. replacement may include the special character &, which is equivalent
    to the text matched by regexp. In addition, replacement may include the sequences
    \1 through \9, which are the contents of the corresponding subexpressions in regexp.
    For more about this, see the discussion of back references below. After the trailing
    slash following replacement, an optional flag may be specified to modify the s
    command''s behavior. |

    | y/set1/set2 | Perform transliteration by converting characters from set1 to
    the corresponding characters in set2. Note that unlike tr, sed requires that both
    sets be of the same length. |


    The s command is by far the most commonly used editing command. We will demonstrate
    just some of its power by performing an edit on our distros.txt file. We discussed
    before how the date field in distros.txt was not in a “computer-friendly” format.
    While the date is formatted MM/DD/YYYY, it would be better (for ease of sorting)
    if the format were YYYY-MM-DD. To perform this change on the file by hand would
    be both time-consuming and error prone, but with sed, this change can'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'be performed in one step:


    ```

    [me@linuxbox ~]$ sed ''s/\([0-9]\{2\}\)\/\([0-9]\{2\}\)\/\([0-9]\{4\}\)/$\3-\1-\2/''
    distros.txt

    SUSE      10.2  2006-12-07

    Fedora    10    2008-11-25

    SUSE      11.0  2008-06-19

    Ubuntu    8.04  2008-04-24

    Fedora    8     2007-11-08

    SUSE      10.3  2007-10-04

    Ubuntu    6.10  2006-10-26

    Fedora    7     2007-05-31

    Ubuntu    7.10  2007-10-18

    Ubuntu    7.04  2007-04-19

    SUSE      10.1  2006-05-11

    Fedora    6     2006-10-24

    Fedora    9     2008-05-13

    Ubuntu    6.06  2006-06-01

    Ubuntu    8.10  2008-10-30

    Fedora    5     2006-03-20

    ```


    Wow! Now that is an ugly looking command. But it works. In just one step, we have
    changed the date format in our file. It is also a perfect example of why regular
    expressions are sometimes jokingly referred to as a “write-only” medium. We can
    write them, but we sometimes cannot read them. Before we are tempted to run away
    in terror from this command, let’s look at how it was constructed. First, we know
    that the command will have this basic structure:


    ```

    sed ''s/regexp/replacement/'' distros.txt

    ```


    Our next step is to figure out a regular expression that will isolate the date.
    Since it is in MM/DD/YYYY format and appears at the end of the line, we can use
    an expression like this:


    ```

    [0-9]{2}/[0-9]{2}/[0-9]{4}$

    ```


    which matches two digits, a slash, two digits, a slash, four digits, and the end
    of line. So that takes care of regexp, but what about replacement? To handle that,
    we must introduce a new regular expression feature that appears in some applications
    which use BRE. This feature is called back references and works like this: if
    the sequence \n appears in replacement where n is a number from one to nine, the
    sequence will refer to the'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'corresponding subexpression in the preceding regular expression. To create
    the subexpressions, we simply enclose them in parentheses like so:


    ```

    ([0-9]{2})/([0-9]{2})/([0-9]{4})$

    ```


    We now have three subexpressions. The first contains the month, the second contains
    the day of the month, and the third contains the year. Now we can construct *replacement*
    as follows:


    ```

    \3-\1-\2

    ```


    which gives us the year, a dash, the month, a dash, and the day.


    Now, our command looks like this:


    ```

    sed ''s/([0-9]{2})/([0-9]{2})/([0-9]{4})$/\3-\1-\2/'' distros.txt

    ```


    We have two remaining problems. The first is that the extra slashes in our regular
    expression will confuse sed when it tries to interpret the s command. The second
    is that since sed, by default, accepts only basic regular expressions, several
    of the characters in our regular expression will be taken as literals, rather
    than as metacharacters. We can solve both these problems with a liberal application
    of backslashes to escape the offending characters:


    ```

    sed ''s/\([0-9]\{2\}\)/\([0-9]\{2\}\)/\([0-9]\{4\}\)$/\3-\1-\2/'' distros.txt

    ```


    And there you have it!


    Another feature of the s command is the use of optional flags that may follow
    the replacement string. The most important of these is the g flag, which instructs
    sed to apply the search and replace globally to a line, not just to the first
    instance, which is the default. Here is an example:


    ```

    [me@linuxbox ~]$ echo "aaabbbccc" | sed ''s/b/B/''

    aaabbbccc

    ```'
  merge: -1
  img_proc: true
