  md: "sequential order from one to five. a bash script could be constructed as follows:\n\
    \n```\n#!/bin/bash\n\n# while-count: display a series of numbers\n\ncount=1\n\n\
    while [ $count -le 5 ]; do\n    echo $count\n    count=$((count + 1))\ndone\n\
    echo \"Finished.\"\n```\n\nWhen executed, this script displays the following:\n\
    \n```\n[me@linuxbox ~]$ while-count\n1\n2\n3\n4\n5\nFinished.\n```\n\nThe syntax\
    \ of the while command is:\n\nwhile commands; do commands; done\n\nLike if, while\
    \ evaluates the exit status of a list of commands. As long as the exit status\
    \ is zero, it performs the commands inside the loop. In the script above, the\
    \ variable count is created and assigned an initial value of 1. The while command\
    \ evaluates the exit status of the test command. As long as the test command returns\
    \ an exit status of zero, the commands within the loop are executed. At the end\
    \ of each cycle, the test command is repeated. After six iterations of the loop,\
    \ the value of count has increased to six, the test command no longer returns\
    \ an exit status of zero and the loop terminates. The program continues with the\
    \ next statement following the loop.\n\nWe can use a while loop to improve the\
    \ read-menu program from the previous chapter:\n\n```\n#!/bin/bash\n\n# while-menu:\
    \ a menu driven system information program\n```"
  merge: -1
  img_proc: true
