    | `-t fd` | *fd* is a file descriptor directed to/from the terminal. This can\
    \ be used to determine whether standard input/output/error is being redirected.\
    \ |\n| `-u file` | *file* exists and is setuid. |\n| `-w file` | *file* exists\
    \ and is writable (has write permission for the effective user). |\n| `-x file`\
    \ | *file* exists and is executable (has execute/search permission for the effective\
    \ user). |\n\nHere we have a script that demonstrates some of the file expressions:\n\
    \n```\n```bash\n#!/bin/bash\n\n# test-file: Evaluate the status of a file\n\n\
    FILE=/.bashrc\n\nif [ -e \"$FILE\" ]; then\n    if [ -f \"$FILE\" ]; then\n  \
    \      echo \"$FILE is a regular file.\"\n    fi\n    if [ -d \"$FILE\" ]; then\n\
    \        echo \"$FILE is a directory.\"\n    fi\n    if [ -r \"$FILE\" ]; then\n\
    \        echo \"$FILE is readable.\"\n    fi\n    if [ -w \"$FILE\" ]; then\n\
    \        echo \"$FILE is writable.\"\n    fi\n    if [ -x \"$FILE\" ]; then\n\
    \        echo \"$FILE is executable/searchable.\"\n    fi\nelse\n    echo \"$FILE\
