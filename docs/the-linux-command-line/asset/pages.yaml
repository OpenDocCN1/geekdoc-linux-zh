- pgno: 293
  md: "```\n[me@linuxbox ~]$ sort foo.txt | uniq\na\nb\nc\n```\n\nThis is because\
    \ uniq only removes duplicate lines which are adjacent to each other.\n\nuniq\
    \ has several options. Here are the common ones:\n\n# Table 21-2: Common uniq\
    \ Options\n\n| Option | Description |\n| --- | --- |\n| -c | Output a list of\
    \ duplicate lines preceded by the number of times the line occurs. |\n| -d | Only\
    \ output repeated lines, rather than unique lines. |\n| -f n | Ignore n leading\
    \ fields in each line. Fields are separated by whitespace as they are in sort;\
    \ however, unlike sort, uniq has no option for setting an alternate field separator.\
