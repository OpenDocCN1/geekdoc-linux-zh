    When creating symbolic links, you can either use absolute pathnames:


    ```

    ln -s /home/me/playground/fun dir1/fun-sym

    ```


    or relative pathnames, as we did in our earlier example. Using relative pathnames
    is more desirable because it allows a directory containing symbolic links to be
    renamed and/or moved without breaking the links.


    In addition to regular files, symbolic links can also reference directories:


    ```

    [me@linuxbox playground]$ ln -s dir1 dir1-sym

    [me@linuxbox playground]$ ls -l

    total 16

    drwxrwxr-x 2 me me 4096 2008-01-15 15:17 dir1

    lrwxrwxrwx 1 me me 4 2008-01-16 14:45 dir1-sym -> dir1

    drwxrwxr-x 2 me me 4096 2008-01-15 15:17 dir2

    -rw-r--r-- 4 me me 1650 2008-01-10 16:33 fun

    -rw-r--r-- 4 me me 1650 2008-01-10 16:33 fun-hard

    lrwxrwxrwx 1 me me 3 2008-01-15 15:15 fun-sym -> fun

    ```


    # Removing Files And Directories


    As we covered earlier, the rm command is used to delete files and directories.
    We are going to use it to clean up our playground a little bit. First, let''s
    delete one of our hard links:


    ```

    [me@linuxbox playground]$ rm fun-hard

    [me@linuxbox playground]$ ls -l

    total 12

    drwxrwxr-x 2 me me 4096 2008-01-15 15:17 dir1

    lrwxrwxrwx 1 me me 4 2008-01-16 14:45 dir1-sym -> dir1

    drwxrwxr-x 2 me me 4096 2008-01-15 15:17 dir2

    -rw-r--r-- 3 me me 1650 2008-01-10 16:33 fun

    lrwxrwxrwx 1 me me 3 2008-01-15 15:15 fun-sym -> fun

    ```


    That worked as expected. The file fun-hard is gone and the link count shown for
    fun is reduced from four to three, as indicated in the second field of the directory
    listing. Next, we''ll delete the file fun, and just for enjoyment, we''ll include
    the “-i” option to show what that does:'
