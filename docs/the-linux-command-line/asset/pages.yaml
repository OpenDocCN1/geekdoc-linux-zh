    # Deleting Text


    As we might expect, vi offers a variety of ways to delete text, all of which contain
    one of two keystrokes. First, the x key will delete a character at the cursor
    location. x may be preceded by a number specifying how many characters are to
    be deleted. The d key is more general purpose. Like x, it may be preceded by a
    number specifying the number of times the deletion is to be performed. In addition,
    d is always followed by a movement command that controls the size of the deletion.
    Here are some examples:


    Table 13-3: Text Deletion Commands


    | Command | Deletes |

    |---|---|

    | x | The current character. |

    | 3x | The current character and the next two characters. |

    | dd | The current line. |

    | 5dd | The current line and the next four lines. |

    | dW | From the current cursor position to the beginning of the next word. |

    | d$ | From the current cursor location to the end of the current line. |

    | d0 | From the current cursor location to the beginning of the line. |

    | d^ | From the current cursor location to the first non-whitespace character
    in the line. |

    | dG | From the current line to the end of the file. |

    | d20G | From the current line to the twentieth line of the file. |


