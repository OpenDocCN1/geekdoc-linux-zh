  md: "```\nTry `cp --help` for more information.\n```\n\nWe assign values to two\
    \ variables, foo and foo1. We then perform a cp, but misspell the name of the\
    \ second argument. After expansion, the cp command is only sent one argument,\
    \ though it requires two.\n\nThere are some rules about variable names:\n\n+ \
    \  1. Variable names may consist of alphanumeric characters (letters and numbers)\
    \ and underscore characters.\n+   2. The first character of a variable name must\
    \ be either a letter or an underscore.\n+   3. Spaces and punctuation symbols\
    \ are not allowed.\n\nThe word “variable” implies a value that changes, and in\
    \ many applications, variables are used this way. However, the variable in our\
    \ application, title, is used as a constant. A constant is just like a variable\
    \ in that it has a name and contains a value. The difference is that the value\
    \ of a constant does not change. In an application that performs geometric calculations,\
    \ we might define PI as a constant, and assign it the value of 3.1415, instead\
    \ of using the number literally throughout our program. The shell makes no distinction\
    \ between variables and constants; they are mostly for the programmer’s convenience.\
    \ A common convention is to use upper case letters to designate constants and\
    \ lower case letters for true variables. We will modify our script to comply with\
    \ this convention:\n\n```\n#!/bin/bash\n\n# Program to output a system information\
    \ page\n\nTITLE=\"System Information Report For $HOSTNAME\"\n\necho \"<HTML>\n\
    \    <HEAD>\n        <TITLE>$TITLE</TITLE>\n    </HEAD>\n    <BODY>\n        <H1>$TITLE</H1>\n\
    \    </BODY>\n</HTML>\"\n```\n\nWe also took the opportunity to jazz up our title\
    \ by adding the value of the shell variable HOSTNAME. This is the network name\
    \ of the machine."
