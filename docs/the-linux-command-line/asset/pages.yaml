  md: '```

    [[ -d $HOME/tmp ]] || mkdir $HOME/tmp

    ```


    # Asynchronous Execution


    It is sometimes desirable to perform more than one task at the same time. We have
    seen how all modern operating systems are at least multitasking if not multi-user
    as well. Scripts can be constructed to behave in a multitasking fashion.


    Usually this involves launching a script that, in turn, launches one or more child
    scripts that perform an additional task while the parent script continues to run.
    However, when a series of scripts runs this way, there can be problems keeping
    the parent and child coordinated. That is, what if the parent or child is dependent
    on the other, and one script must wait for the other to finish its task before
    finishing its own?


    bash has a builtin command to help manage asynchronous execution such as this.
    The wait command causes a parent script to pause until a specified process (i.e.,
    the child script) finishes.


    # wait


    We will demonstrate the wait command first. To do this, we will need two scripts,
    a parent script:


    ```

    #!/bin/bash


    # async-parent : Asynchronous execution demo (parent)


    echo "Parent: starting..."


    echo "Parent: launching child script..."

    async-child &

    pid=$!

    echo "Parent: child (PID= $pid) launched."


    echo "Parent: continuing..."

    sleep 2


    echo "Parent: pausing to wait for child to finish..."

    wait $pid


    echo "Parent: child is finished. Continuing..."

    ```'
