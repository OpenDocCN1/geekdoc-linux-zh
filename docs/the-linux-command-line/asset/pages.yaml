  md: "Just as with design, testing is a function of time, as well. Not every script\
    \ feature needs to be extensively tested. It’s really a matter of determining\
    \ what is most important. Since it could be so potentially destructive if it malfunctioned,\
    \ our code fragment deserves careful consideration during both its design and\
    \ testing.\n\n# Debugging\n\nIf testing reveals a problem with a script, the next\
    \ step is debugging. “A problem” usually means that the script is, in some way,\
    \ not performing to the programmers expectations. If this is the case, we need\
    \ to carefully determine exactly what the script is actually doing and why. Finding\
    \ bugs can sometimes involve a lot of detective work.\n\nA well designed script\
    \ will try to help. It should be programmed defensively, to detect abnormal conditions\
    \ and provide useful feedback to the user. Sometimes, however, problems are quite\
    \ strange and unexpected and more involved techniques are required.\n\n# Finding\
    \ The Problem Area\n\nIn some scripts, particularly long ones, it is sometimes\
    \ useful to isolate the area of the script that is related to the problem. This\
    \ won’t always be the actual error, but isolation will often provide insights\
    \ into the actual cause. One technique that can be used to isolate code is “commenting\
    \ out” sections a script. For example, our file deletion fragment could be modified\
    \ to determine if the removed section was related to an error:\n\n```\nif [[ -d\
    \ $dir_name ]]; then\n    if cd $dir_name; then\n        rm *\n    else\n    \
    \    echo \"cannot cd to '$dir_name'\" >&2\n        exit 1\n    fi\n# else\n#\
    \ echo \"no such directory: '$dir_name'\" >&2\n# exit 1\nfi\n```\n\nBy placing\
    \ comment symbols at the beginning of each line in a logical section of a script,\
    \ we prevent that section from being executed. Testing can then be performed again,\
    \ to see if the removal of the code has any impact on the behavior of the bug.\n\
    \n# Tracing\n\nBugs are often cases of unexpected logical flow within a script.\
    \ That is, portions of the"
