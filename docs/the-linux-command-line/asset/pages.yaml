    # Creating CD-ROM Images


    Writing a recordable CD-ROM (either a CD-R or CD-RW) consists of two steps: first,
    constructing an *iso image* file that is the exact file system image of the CD-ROM
    and second, writing the image file onto the CD-ROM media.


    # Creating An Image Copy Of A CD-ROM


    If we want to make an iso image of an existing CD-ROM, we can use dd to read all
    the data blocks off the CD-ROM and copy them to a local file. Say we had an Ubuntu
    CD and we wanted to make an iso file that we could later use to make more copies.
    After inserting the CD and determining its device name (we’ll assume `/dev/cdrom`),
    we can make the iso file like so:


    ```

    dd if=/dev/cdrom of=ubuntu.iso

    ```


    This technique works for data DVDs as well, but will not work for audio CDs, as
    they do not use a file system for storage. For audio CDs, look at the cddao command.


    # Creating An Image From A Collection Of Files


    To create an iso image file containing the contents of a directory, we use the
    genisoimage program. To do this, we first create a directory containing all the
    files we wish to include in the image and then execute the genisoimage command
    to create the image file. For example, if we had created a directory called `~/cd-rom-files`
    and filled it with files for our CD-ROM, we could create an image file named `cd-rom.iso`
    with the following command:'
