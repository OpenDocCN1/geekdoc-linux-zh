    The first step in managing a storage device is attaching the device to the file
    system tree. This process, called mounting, allows the device to participate with
    the operating system. As we recall from Chapter 3, Unix-like operating systems,
    like Linux, maintain a single file system tree with devices attached at various
    points. This contrasts with other operating systems such as MS-DOS and Windows
    that maintain separate trees for each device (for example C:\, D:\, etc.).


    There is a file named /etc/fstab that lists the devices (typically hard disk partitions)
    that are to be mounted at boot time. Here is an example /etc/fstab file from a
    Fedora 7 system:


    ```

    LABEL=/12      /           ext3    defaults    1 1

    LABEL=/home    /home       ext3    defaults    1 2

    LABEL=/boot    /boot       ext3    defaults    1 2

    tmpfs          /dev/shm    tmpfs   defaults    0 0

    devpts         /dev/pts    devpts  gid=5,mode=620 0 0

    sysfs          /sys        sysfs   defaults    0 0

    proc           /proc       proc    defaults    0 0

    LABEL=SWAP-sda3 swap        swap    defaults    0 0

    ```


    Most of the file systems listed in this example file are virtual and are not applicable
    to our discussion. For our purposes, the interesting ones are the first three:


    ```

    LABEL=/12      /           ext3    defaults    1 1

    LABEL=/home    /home       ext3    defaults    1 2

    LABEL=/boot    /boot       ext3    defaults    1 2

    ```


    These are the hard disk partitions. Each line of the file consists of six fields,
