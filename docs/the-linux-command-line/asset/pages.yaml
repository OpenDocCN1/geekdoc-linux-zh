- pgno: 398
  md: "# 28 – Flow Control: Branching With if\n\nIn the last chapter, we were presented\
    \ with a problem. How can we make our report generator script adapt to the privileges\
    \ of the user running the script? The solution to this problem will require us\
    \ to find a way to “change directions” within our script, based on a the results\
    \ of a test. In programming terms, we need the program to branch.\n\nLet’s consider\
    \ a simple example of logic expressed in pseudocode, a simulation of a computer\
    \ language intended for human consumption:\n\nX = 5\nIf X = 5, then:\n    Say\
    \ “X equals 5.”\nOtherwise:\n    Say “X is not equal to 5.”\n\nThis is an example\
    \ of a branch. Based on the condition, “Does X = 5?” do one thing, “Say X equals\
    \ 5,” otherwise do another thing, “Say X is not equal to 5.”\n\n# if\n\nUsing\
    \ the shell, we can code the logic above as follows:\n\n```\nx=5\n\nif [ $x =\
    \ 5 ]; then\n    echo \"x equals 5.\"\nelse\n    echo \"x does not equal 5.\"\n\
    fi\n```\n\nor we can enter it directly at the command line (slightly shortened):"
  merge: -1
  img_proc: true
- pgno: 399
  md: "```\n[me@linuxbox ~]$ x=5\n[me@linuxbox ~]$ if [ $x = 5 ]; then echo \"equals\
    \ 5\"; else echo \"does not equal 5\"; fi\nequals 5\n[me@linuxbox ~]$ x=0\n[me@linuxbox\
    \ ~]$ if [ $x = 5 ]; then echo \"equals 5\"; else echo \"does not equal 5\"; fi\n\
    does not equal 5\n```\n\nIn this example, we execute the command twice. Once,\
    \ with the value of x set to 5, which results in the string “equals 5” being output,\
    \ and the second time with the value of x set to 0, which results in the string\
    \ “does not equal 5” being output.\n\nThe if statement has the following syntax:\n\
    \n```\nif commands; then\n    commands\n[elif commands; then\n    commands...]\n\
    [else\n    commands]\nfi\n```\n\nwhere commands is a list of commands. This is\
    \ a little confusing at first glance. But before we can clear this up, we have\
    \ to look at how the shell evaluates the success or failure of a command.\n\n\
    # Exit Status\n\nCommands (including the scripts and shell functions we write)\
    \ issue a value to the system when they terminate, called an exit status. This\
    \ value, which is an integer in the range of 0 to 255, indicates the success or\
    \ failure of the command’s execution. By convention, a value of zero indicates\
    \ success and any other value indicates failure. The shell provides a parameter\
    \ that we can use to examine the exit status. Here we see it in action:\n\n```\n\
    [me@linuxbox ~]$ ls -d /usr/bin\n/usr/bin\n[me@linuxbox ~]$ echo $?\n0\n[me@linuxbox\
    \ ~]$ ls -d /bin/usr\nls: cannot access /bin/usr: No such file or directory\n\
    [me@linuxbox ~]$ echo $?\n2\n```"
  merge: -1
  img_proc: true
- pgno: 400
  md: 'In this example, we execute the ls command twice. The first time, the command
    executes successfully. If we display the value of the parameter $?, we see that
    it is zero. We execute the ls command a second time, producing an error and examine
    the parameter $? again. This time it contains a 2, indicating that the command
    encountered an error. Some commands use different exit status values to provide
    diagnostics for errors, while many commands simply exit with a value of one when
    they fail. Man pages often include a section entitled “Exit Status,” describing
    what codes are used. However, a zero always indicates success.


    The shell provides two extremely simple builtin commands that do nothing except
    terminate with either a zero or one exit status. The true command always executes
    successfully and the false command always executes unsuccessfully:


    ```

    [me@linuxbox ~]$ true

    [me@linuxbox ~]$ echo $?

    0

    [me@linuxbox ~]$ false

    [me@linuxbox ~]$ echo $?

    1

    ```


    We can use these commands to see how the if statement works. What the if statement
    really does is evaluate the success or failure of commands:


    ```

    [me@linuxbox ~]$ if true; then echo "It''s true."; fi

    It''s true.

    [me@linuxbox ~]$ if false; then echo "It''s true."; fi

    [me@linuxbox ~]$

    ```


    The command echo "It''s true." is executed when the command following if executes
    successfully, and is not executed when the command following if does not execute
    successfully. If a list of commands follows if, the last command in the list is
    evaluated:


    ```

    [me@linuxbox ~]$ if false; true; then echo "It''s true."; fi

    It''s true.

    [me@linuxbox ~]$ if true; false; then echo "It''s true."; fi

    [me@linuxbox ~]$

    ```'
  merge: -1
  img_proc: true
