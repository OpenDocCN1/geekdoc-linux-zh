    indicating that a permission is to be added, a "-" indicating that a permission
    is to be taken away, or a "=" indicating that only the specified permissions are
    to be applied and that all others are to be removed.


    Permissions are specified with the "r", "w", and "x" characters. Here are some
    examples of symbolic notation:


    *Table 10-5: chmod Symbolic Notation Examples*


    | Notation | Meaning |

    | u+X | Add execute permission for the owner. |

    | u - X | Remove execute permission from the owner. |

    | +X | Add execute permission for the owner, group, and world. Equivalent to a+X.
    |

