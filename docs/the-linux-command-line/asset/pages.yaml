    # Brace Expansion


    Perhaps the strangest expansion is called *brace expansion*. With it, you can
    create multiple text strings from a pattern containing braces. Here''s an example:


    ```

    [me@linuxbox ~]$ echo Front-{A,B,C}-Back

    Front-A-Back Front-B-Back Front-C-Back

    ```


    Patterns to be brace expanded may contain a leading portion called a *preamble*
    and a trailing portion called a *postscript*. The brace expression itself may
    contain either a comma-separated list of strings, or a range of integers or single
    characters. The pattern may not contain embedded whitespace. Here is an example
    using a range of integers:


    ```

    [me@linuxbox ~]$ echo Number_{1..5}

    Number_1 Number_2 Number_3 Number_4 Number_5

    ```


    A range of letters in reverse order:


    ```

    [me@linuxbox ~]$ echo {Z..A}

    Z Y X W V U T S R Q P O N M L K J I H G F E D C B A

    ```'
