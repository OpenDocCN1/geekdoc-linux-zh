  md: '```

    :set hlsearch

    turns on the option to highlight search results. Say we search for the word “echo.”
    With this option on, each instance of the word will be highlighted.

    :set tabstop=4

    sets the number of columns occupied by a tab character. The default is eight columns.
    Setting the value to four (which is a common practice) allows long lines to fit
    more easily on the screen.

    :set autoindent

