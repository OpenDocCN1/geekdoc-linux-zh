- pgno: 434
  md: "while. Let’s look at what happens if we remove the semicolon after the test\
    \ in the if command:\n\n```\n#!/bin/bash\n\n# trouble: script to demonstrate common\
    \ errors\n\nnumber=1\n\nif [ $number = 1 ] then\n    echo \"Number is equal to\
    \ 1.\"\nelse\n    echo \"Number is not equal to 1.\"\nfi\n```\n\nThe result is\
    \ this:\n\n```\n[me@linuxbox ~]$ trouble\n/home/me/bin/trouble: line 9: syntax\
    \ error near unexpected token `else'\n/home/me/bin/trouble: line 9: `else'\n```\n\
    \nAgain, the error message points to a error that occurs later than the actual\
    \ problem. What happens is really pretty interesting. As we recall, if accepts\
    \ a list of commands and evaluates the exit code of the last command in the list.\
    \ In our program, we intend this list to consist of a single command, [, a synonym\
    \ for test. The [ command takes what follows it as a list of arguments. In our\
    \ case, three arguments: $number, =, and ]. With the semicolon removed, the word\
    \ then is added to the list of arguments, which is syntactically legal. The following\
    \ echo command is legal, too. It’s interpreted as another command in the list\
    \ of commands that if will evaluate for an exit code. The else is encountered\
    \ next, but it’s out of place, since the shell recognizes it as a reserved word\
    \ (a word that has special meaning to the shell) and not the name of a command,\
    \ hence the error message.\n\n# Unanticipated Expansions\n\nIt’s possible to have\
    \ errors that only occur intermittently in a script. Sometimes the script will\
    \ run fine and other times it will fail because of results of an expansion. If\
    \ we return our missing semicolon and change the value of number to an empty variable,\
    \ we can demonstrate:"
  merge: -1
  img_proc: true
- pgno: 435
  md: "```\n#!/bin/bash\n\n# trouble: script to demonstrate common errors\n\nnumber=\n\
    \nif [ $number = 1 ]; then\n    echo \"Number is equal to 1.\"\nelse\n    echo\
    \ \"Number is not equal to 1.\"\nfi\n```\n\nRunning the script with this change\
    \ results in the output:\n\n```\n[me@linuxbox ~]$ trouble\n/home/me/bin/trouble:\
    \ line 7: [: =: unary operator expected\nNumber is not equal to 1.\n```\n\nWe\
    \ get this rather cryptic error message, followed by the output of the second\
    \ echo command. The problem is the expansion of the number variable within the\
    \ test command. When the command:\n\n```\n[ $number = 1 ]\n```\n\nundergoes expansion\
    \ with number being empty, the result is this:\n\n```\n[ = 1 ]\n```\n\nwhich is\
    \ invalid and the error is generated. The = operator is a binary operator (it\
    \ requires a value on each side), but the first value is missing, so the test\
    \ command expects a unary operator (such as -z) instead. Further, since the test\
    \ failed (because of the error), the if command receives a non-zero exit code\
    \ and acts accordingly, and the second echo command is executed.\n\nThis problem\
    \ can be corrected by adding quotes around the first argument in the test command:\n\
    \n```\n[ \"$number\" = 1 ]\n```"
  merge: -1
  img_proc: true
- pgno: 436
  md: 'Then when expansion occurs, the result will be this:


    ```

    [ "" = 1 ]

    ```


    which yields the correct number of arguments. In addition to empty strings, quotes
    should be used in cases where a value could expand into multi-word strings, as
    with filenames containing embedded spaces.


    # Logical Errors


    Unlike syntactic errors, *logical errors* do not prevent a script from running.
    The script will run, but it will not produce the desired result, due to a problem
    with its logic. There are countless numbers of possible logical errors, but here
    are a few of the most common kinds found in scripts:


    +   1. **Incorrect conditional expressions.** It’s easy to incorrectly code an
    if/then/else and have the wrong logic carried out. Sometimes the logic will be
    reversed or it will be incomplete.

    +   2. **“Off by one” errors.** When coding loops that employ counters, it is
    possible to overlook that the loop may require the counting start with zero, rather
    than one, for the count to conclude at the correct point. These kinds of errors
    result in either a loop “going off the end” by counting too far, or else missing
    the last iteration of the loop by terminating one iteration too soon.

    +   3. **Unanticipated situations.** Most logic errors result from a program encountering
    data or situations that were unforeseen by the programmer. This can also include
    unanticipated expansions, such as a filename that contains embedded spaces that
    expands into multiple command arguments rather than a single filename.


    # Defensive Programming


    It is important to verify assumptions when programming. This means a careful evaluation
    of the exit status of programs and commands that are used by a script. Here is
    an example, based on a true story. An unfortunate system administrator wrote a
    script to perform a maintenance task on an important server. The script contained
    the following two lines of code:


    ```

    cd $dir_name

    rm *

    ```'
  merge: -1
  img_proc: true
- pgno: 437
  md: "There is nothing intrinsically wrong with these two lines, as long as the directory\
    \ named in the variable, dir_name, exists. But what happens if it does not? In\
    \ that case, the cd command fails, the script continues to the next line and deletes\
    \ the files in the current working directory. Not the desired outcome at all!\
    \ The hapless administrator destroyed an important part of the server because\
    \ of this design decision.\n\nLet’s look at some ways this design could be improved.\
    \ First, it might be wise to make the execution of rm contingent on the success\
    \ of cd:\n\n```\ncd $dir_name && rm *\n```\n\nThis way, if the cd command fails,\
    \ the rm command is not carried out. This is better, but still leaves open the\
    \ possibility that the variable, dir_name, is unset or empty, which would result\
    \ in the files in the user’s home directory being deleted. This could also be\
    \ avoided by checking to see that dir_name actually contains the name of an existing\
    \ directory:\n\n```\n[[-d $dir_name]] && cd $dir_name && rm *\n```\n\nOften, it\
    \ is best to terminate the script with an error when an situation such as the\
    \ one above occurs:\n\n```\nif [[ -d $dir_name ]]; then\n  if cd $dir_name; then\n\
    \    rm *\n  else\n    echo \"cannot cd to '$dir_name'\" >&2\n    exit 1\n  fi\n\
    else\n  echo \"no such directory: '$dir_name'\" >&2\n  exit 1\nfi\n```\n\nHere,\
    \ we check both the name, to see that it is that of an existing directory, and\
    \ the success of the cd command. If either fails, a descriptive error message\
    \ is sent to standard error and the script terminates with an exit status of one\
    \ to indicate a failure."
  merge: -1
  img_proc: true
- pgno: 438
  md: '# Verifying Input


    A general rule of good programming is that if a program accepts input, it must
    be able to deal with anything it receives. This usually means that input must
    be carefully screened, to ensure that only valid input is accepted for further
    processing. We saw an example of this in the previous chapter when we studied
    the read command. One script contained the following test to verify a menu selection:


    ```

    [[ $REPLY =~ ^[0-3]$ ]]

    ```


    This test is very specific. It will only return a zero exit status if the string
    returned by the user is a numeral in the range of zero to three. Nothing else
    will be accepted. Sometimes these sorts of tests can be very challenging to write,
    but the effort is necessary to produce a high quality script.


    # Design Is A Function Of Time


    When I was a college student studying industrial design, a wise professor stated
    that the degree of design on a project was determined by the amount of time given
    to the designer. If you were given five minutes to design a device "that kills
    flies," you designed a flyswatter. If you were given five months, you might come
    up with a laser-guided "anti-fly system" instead.


    The same principle applies to programming. Sometimes a "quick and dirty" script
    will do if it''s only going to be used once and only used by the programmer. That
    kind of script is common and should be developed quickly to make the effort economical.
    Such scripts don''t need a lot of comments and defensive checks. On the other
    hand, if a script is intended for production use, that is, a script that will
    be used over and over for an important task or by multiple users, it needs much
    more careful development.


    # Testing


    Testing is an important step in every kind of software development, including
    scripts. There is a saying in the open source world, "release early, release often,"
    which reflects this fact. By releasing early and often, software gets more exposure
    to use and testing. Experience has shown that bugs are much easier to find, and
    much less expensive to fix, if they are found early in the development cycle.


    In a previous discussion, we saw how stubs can be used to verify program flow.
    From'
  merge: -1
  img_proc: true
