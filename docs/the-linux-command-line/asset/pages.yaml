    Second, each file and directory created by one member will be set to the primary
    group of the user rather than the group music. This can be fixed by setting the
    setgid bit on the directory:


    ```

    [bill@linuxbox ~]$ sudo chmod g+s /usr/local/share/Music

    [bill@linuxbox ~]$ ls -ld /usr/local/share/Music

    drwxrwsr-x 2 root music 4096 2008-03-24 20:03 /usr/local/share/Music

    ```


    Now we test to see if the new permissions fix the problem. bill sets his umask
