  md: "the earliest stages of script development, they are a valuable technique to\
    \ check the progress of our work.\n\nLet’s look at the file deletion problem above\
    \ and see how this could be coded for easy testing. Testing the original fragment\
    \ of code would be dangerous, since its purpose is to delete files, but we could\
    \ modify the code to make the test safe:\n\n```\nif [[ -d $dir_name ]]; then\n\
    \    if cd $dir_name; then\n        echo rm * # TESTING\n    else\n        echo\
    \ \"cannot cd to '$dir_name'\" >&2\n        exit 1\n    fi\nelse\n    echo \"\
    no such directory: '$dir_name'\" >&2\n    exit 1\nfi\nexit # TESTING\n```\n\n\
    Since the error conditions already output useful messages, we don’t have to add\
    \ any. The most important change is placing an echo command just before the rm\
    \ command to allow the command and its expanded argument list to be displayed,\
    \ rather than the command actually being executed. This change allows safe execution\
    \ of the code. At the end of the code fragment, we place an exit command to conclude\
    \ the test and prevent any other part of the script from being carried out. The\
    \ need for this will vary according to the design of the script.\n\nWe also include\
    \ some comments that act as “markers” for our test-related changes. These can\
    \ be used to help find and remove the changes when testing is complete.\n\n# Test\
    \ Cases\n\nTo perform useful testing, it’s important to develop and apply good\
    \ test cases. This is done by carefully choosing input data or operating conditions\
    \ that reflect edge and corner cases. In our code fragment (which is very simple),\
    \ we want to know how the code performs under three specific conditions:\n\n+\
    \   1. dir_name contains the name of an existing directory\n+   2. dir_name contains\
    \ the name of a non-existent directory\n+   3. dir_name is empty\n\nBy performing\
    \ the test with each of these conditions, good test coverage is achieved."
