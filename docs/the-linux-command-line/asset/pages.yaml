    \n`*** 1,4 ***`\n\nwhich indicates lines one through four in the first file. Later\
    \ we see:\n\n`--- 1,4 ---`\n\nwhich indicates lines one through four in the second\
    \ file. Within a change group, lines begin with one of four indicators:\n\n_Table\
    \ 21-5: diff Context Format Change Indicators_\n\n| Indicator | Meaning |\n|---|---|\n\
    | `blank` | A line shown for context. It does not indicate a difference between\
    \ the two files. |\n| `-` | A line deleted. This line will appear in the first\
    \ file but not in the second file. |\n| `+` | A line added. This line will appear\
    \ in the second file but not in the first file. |\n| `!` | A line changed. The\
    \ two versions of the line will be displayed, each in its respective section of\
    \ the change group. |\n\nThe unified format is similar to the context format,\
