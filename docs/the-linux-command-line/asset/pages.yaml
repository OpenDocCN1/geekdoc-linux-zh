    as expected.


    # Pathname Expansion


    The mechanism by which wildcards work is called pathname expansion. If we try
    some of the techniques that we employed in our earlier chapters, we will see that
    they are really expansions. Given a home directory that looks like this:


    ```

    [me@linuxbox ~]$ ls

    Desktop      ls-output.txt  Pictures  Templates

    Documents  Music          Public     Videos

    ```


    we could carry out the following expansions:


    ```

    [me@linuxbox ~]$ echo D*

    Desktop Documents

    ```


    and:


    ```

    [me@linuxbox ~]$ echo *s

    Documents Pictures Templates Videos

    ```


    or even:


    ```

    [me@linuxbox ~]$ echo [[:upper:]]*

    Desktop Documents Music Pictures Public Templates Videos

    ```


    and looking beyond our home directory:


