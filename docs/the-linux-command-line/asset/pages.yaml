- pgno: 384
  md: '**Note:** The shell actually does provide a way to enforce the immutability
    of constants, through the use of the `declare` builtin command with the `-r` (read-only)
    option. Had we assigned TITLE this way:


    ```

    declare -r TITLE="Page Title"

    ```


    the shell would prevent any subsequent assignment to TITLE. This feature is rarely
    used, but it exists for very formal scripts.


    # Assigning Values To Variables And Constants


    Here is where our knowledge of expansion really starts to pay off. As we have
    seen, variables are assigned values this way:

    *variable=value*


    where *variable* is the name of the variable and *value* is a string. Unlike some
    other programming languages, the shell does not care about the type of data assigned
    to a variable; it treats them all as strings. You can force the shell to restrict
    the assignment to integers by using the `declare` command with the `-i` option,
    but, like setting variables as read-only, this is rarely done.


    Note that in an assignment, there must be no spaces between the variable name,
    the equals sign, and the value. So what can the value consist of? Anything that
    we can expand into a string:


    ```

    a=z                  # Assign the string "z" to variable a.

    b="a string"        # Embedded spaces must be within quotes.

    c="a string and $b" # Other expansions such as variables can be expanded into
    the assignment.

    d=$(ls -l foo.txt)    # Results of a command.

    e=$((5 * 7))          # Arithmetic expansion.

    f="\t\ta string\n" # Escape sequences such as tabs and newlines.

    ```


    Multiple variable assignments may be done on a single line:


    ```

    a=5 b="a string"

    ```


    During expansion, variable names may be surrounded by optional curly braces "{}".
    This is useful in cases where a variable name becomes ambiguous due to its surrounding'
