    ```


    The program’s many options allow wget to recursively download, download files
    in the background (allowing you to log off but continue downloading), and complete
    the download of a partially downloaded file. These features are well documented
    in its better-than-average man page.


    # Secure Communication With Remote Hosts


    For many years, Unix-like operating systems have had the ability to be administered'
