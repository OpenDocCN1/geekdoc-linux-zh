    # Modifying The Environment


    Since we know where the startup files are and what they contain, we can modify
    them to customize our environment.


    # Which Files Should We Modify?


    As a general rule, to add directories to your PATH, or define additional environment
    variables, place those changes in .bash_profile (or equivalent, according to your
    distribution. For example, Ubuntu uses .profile.) For everything else, place the
    changes in .bashrc. Unless you are the system administrator and need to change
    the defaults for all users of the system, restrict your modifications to the files
    in your home directory. It is certainly possible to change the files in /etc such
    as profile, and in many cases it would be sensible to do so, but for now, let’s
    play it safe.


    # Text Editors


    To edit (i.e., modify) the shell’s startup files, as well as most of the other
    configuration files on the system, we use a program called a text editor. A text
    editor is a program that is, in some ways, like a word processor in that it allows
    you to edit the words on the screen with a moving cursor. It differs from a word
    processor by only supporting pure text, and often contains features designed for
    writing programs. Text editors are the central tool used by software developers
    to write code, and by system administrators to manage the configuration files
    that control the system.


    There are a lot of different text editors available for Linux; your system probably
    has several installed. Why so many different ones? Probably because programmers
    like'
