  md: "script are either never being executed, or are being executed in the wrong\
    \ order or at the wrong time. To view the actual flow of the program, we use a\
    \ technique called tracing.\n\nOne tracing method involves placing informative\
    \ messages in a script that display the location of execution. We can add messages\
    \ to our code fragment:\n\n```\necho \"preparing to delete files\" >&2\nif [[\
    \ -d $dir_name ]]; then\n    if cd $dir_name; then\n        echo \"deleting files\"\
    \ >&2\n            rm *\n    else\n        echo \"cannot cd to '$dir_name'\" >&2\n\
    \        exit 1\n    fi\nelse\n    echo \"no such directory: '$dir_name'\" >&2\n\
    \    exit 1\nfi\necho \"file deletion complete\" >&2\n```\n\nWe send the messages\
    \ to standard error to separate them from normal output. We also do not indent\
    \ the lines containing the messages, so it is easier to find when it's time to\
    \ remove them.\n\nNow when the script is executed, it's possible to see that the\
    \ file deletion has been performed:\n\n```\n[me@linuxbox ~]$ deletion-script\n\
