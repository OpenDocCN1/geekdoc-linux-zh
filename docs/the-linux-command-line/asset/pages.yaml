- pgno: 112
  md: 'each digit in an octal number represents three binary digits, this maps nicely
    to the scheme used to store the file mode. This table shows what we mean:


    | Octal | Binary | File Mode |

    |---|---|---|

    | 0 | 000 | --- |

    | 1 | 001 | --x |

    | 2 | 010 | -w- |

    | 3 | 011 | -wx |

    | 4 | 100 | r-- |

    | 5 | 101 | r-x |

    | 6 | 110 | rw- |

    | 7 | 111 | rwx |


    By using three octal digits, we can set the file mode for the owner, group owner,
    and world:


    ```

    [me@linuxbox ~]$ > foo.txt

    [me@linuxbox ~]$ ls -l foo.txt

    -rw-rw-r-- 1 me me 0 2008-03-06 14:52 foo.txt

    [me@linuxbox ~]$ chmod 600 foo.txt

    [me@linuxbox ~]$ ls -l foo.txt

    -rw------- 1 me me 0 2008-03-06 14:52 foo.txt

    ```


    By passing the argument “600”, we were able to set the permissions of the owner
    to read and write while removing all permissions from the group owner and world.
    Though remembering the octal to binary mapping may seem inconvenient, you will
    usually only have to use a few common ones: 7 (rwx), 6 (rw-), 5 (r-x), 4 (r--),
    and 0 (-- -).


    chmod also supports a symbolic notation for specifying file modes. Symbolic notation
    is divided into three parts: who the change will affect, which operation will
    be performed, and what permission will be set. To specify who is affected, a combination
    of the characters “u”, “g”, “o”, and “a” is used as follows:


    Table 10-4: chmod Symbolic Notation


    | Symbol | Meaning |

    |---|---|

    | u | Short for “use,r” but means the file or directory owner. |

    | g | Group owner. |'
