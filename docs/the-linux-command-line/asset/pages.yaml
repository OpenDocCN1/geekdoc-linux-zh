  md: '# 20 – Regular Expressions


    In the next few chapters, we are going to look at tools used to manipulate text.
    As we have seen, text data plays an important role on all Unix-like systems, such
    as Linux. But before we can fully appreciate all of the features offered by these
    tools, we have to first examine a technology that is frequently associated with
    the most sophisticated uses of these tools—regular expressions.


    As we have navigated the many features and facilities offered by the command line,
    we have encountered some truly arcane shell features and commands, such as shell
    expansion and quoting, keyboard shortcuts, and command history, not to mention
    the vi editor. Regular expressions continue this “tradition” and may be (arguably)
    the most arcane feature of them all. This is not to suggest that the time it takes
    to learn about them is not worth the effort. Quite the contrary. A good understanding
    will enable us to perform amazing feats, though their full value may not be immediately
    apparent.


    # What Are Regular Expressions?


    Simply put, regular expressions are symbolic notations used to identify patterns
    in text. In some ways, they resemble the shell’s wildcard method of matching file
    and pathnames, but on a much grander scale. Regular expressions are supported
    by many command line tools and by most programming languages to facilitate the
    solution of text manipulation problems. However, to further confuse things, not
    all regular expressions are the same; they vary slightly from tool to tool and
    from programming language to language. For our discussion, we will limit ourselves
    to regular expressions as described in the POSIX standard (which will cover most
    of the command line tools), as opposed to many programming languages (most notably
    Perl), which use slightly larger and richer sets of notations.


    # grep


    The main program we will use to work with regular expressions is our old pal,
    grep. The name “grep” is actually derived from the phrase “global regular expression
    print,” so we can see that grep has something to do with regular expressions.
    In essence, grep searches text files for the occurrence of a specified regular
    expression and outputs any'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'line containing a match to standard output.


    So far, we have used grep with fixed strings, like so:


    ```

    [me@linuxbox ~]$ ls /usr/bin | grep zip

    ```


    This will list all the files in the /usr/bin directory whose names contain the
    substring “zip”.


    The grep program accepts options and arguments this way:


    ```

    grep [options] regex [file...]

    ```


    where regex is a regular expression.


    Here is a list of the commonly used grep options:


    Table20-1: grep Options


    | Option | Description |

    | --- | --- |

    | -i | Ignore case. Do not distinguish between upper and lower case characters.
    May also be specified --ignore-case. |

    | -v | Invert match. Normally, grep prints lines that contain a match. This option
    causes grep to print every line that does not contain a match. May also be specified
    --invert-match. |

    | -c | Print the number of matches (or non-matches if the -v option is also specified)
    instead of the lines themselves. May also be specified --count. |

    | -l | Print the name of each file that contains a match instead of the lines
    themselves. May also be specified --files-with-matches. |

    | -L | Like the -l option, but print only the names of files that do not contain
    matches. May also be specified --files-without-match. |

    | -n | Prefix each matching line with the number of the line within the file.
    May also be specified --line-number. |

    | -h | For multi-file searches, suppress the output of filenames. May also be
    specified --no-filename. |


    In order to more fully explore grep, let’s create some text files to search:'
