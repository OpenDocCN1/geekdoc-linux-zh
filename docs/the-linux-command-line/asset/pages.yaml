    </body>

    </html>

    ```


    Now, if we try to spell check our modified file, we run into a problem. If we
    do it this way:


    ```

    [me@linuxbox ~]$ aspell check foo.txt

    ```


    we''ll get this:


    ```

    <html>

    ```'
