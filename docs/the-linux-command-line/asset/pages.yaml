- pgno: 335
  md: 'simple tasks, but what about larger jobs? One of the reasons that Unix became
    a popular operating system among technical and scientific users (aside from providing
    a powerful multitasking, multiuser environment for all kinds of software development)
    is that it offered tools that could be used to produce many types of documents,
    particularly scientific and academic publications. In fact, as the GNU documentation
    describes, document preparation was instrumental to the development of Unix:


    > The first version of UNIX was developed on a PDP-7 which was sitting around
    Bell Labs. In 1971 the developers wanted to get a PDP-11 for further work on the
    operating system. In order to justify the cost for this system, they proposed
    that they would implement a document formatting system for the AT&T patents division.
    This first formatting program was a reimplementation of McIlroy’s ‘roff’, written
    by J. F. Ossanna.


    There are two main families of document formatters that dominate the field: those
    descended from the original roff program including nroff and troff, and those
    based on Donald Knuth’s TeX (pronounced “tek”) typesetting system. And yes, the
    dropped “E” in the middle is part of its name.


    The name “roff” is derived from the term “run off” as in, “I’ll run off a copy
    for you.” The nroff program is used to format documents for output to devices
    that use monospaced fonts, such as character terminals and typewriter-style printers.
    At the time of its introduction, this included nearly all printing devices attached
    to computers. The later troff program formats documents for output on typesetters,
    devices used to produce “camera-ready” type for commercial printing. Most computer
    printers today are able to simulate the output of typesetters. The roff family
    also includes some other programs that are used to prepare portions of documents.
    These include eqn (for mathematical equations) and tbl (for tables).


    The TeX system (in stable form) first appeared in 1989 and has, to some degree,
    displaced troff as the tool of choice for typesetter output. We won’t be covering
    TeX here, due both to its complexity (there are entire books about it) and to
    the fact that it is not installed by default on most modern Linux systems.


    Tip: For those interested in installing TeX, check out the texlive package which
    can be found in most distribution repositories, and the LyX graphical content
    editor.


    # groff


    groff is suite of programs containing the GNU implementation of troff. It also
    includes a script that is used to emulate nroff and the rest of the roff family
    as well.'
  merge: -1
  img_proc: true
- pgno: 336
  md: "While roff and its descendants are used to make formatted documents, they do\
    \ it in a way that is rather foreign to modern users. Most documents today are\
    \ produced using word processors that are able to perform both the composition\
    \ and layout of a document in a single step. Prior to the advent of the graphical\
    \ word processor, documents were often produced in a two-step process involving\
    \ the use of a text editor to perform composition and a processor, such as troff\
    \ to apply the formatting. Instructions for the formatting program were embedded\
    \ into the composed text through the use of a markup language. The modern analog\
    \ for such a process is the web page, which is composed using a text editor of\
    \ some kind and then rendered by a web browser using HTML as the markup language\
    \ to describe the final page layout.\n\nWe’re not going to cover groff in its\
    \ entirety, as many elements of its markup language deal with rather arcane details\
    \ of typography. Instead we will concentrate on one of its macro packages that\
    \ remains in wide use. These macro packages condense many of its low-level commands\
    \ into a smaller set of high-level commands that make using groff much easier.\n\
    \nFor a moment, let’s consider the humble man page. It lives in the /usr/share/man\
    \ directory as a gzip compressed text file. If we were to examine its uncompressed\
    \ contents, we would see the following (the man page for ls in section 1 is shown):\n\
    \n```\n[me@linuxbox ~]$ zcat /usr/share/man/man1/ls.1.gz | head\n.\\\" DO NOT\
    \ MODIFY THIS FILE! It was generated by help2man 1.35.\n.TH LS \"1\" \"April 2008\"\
    \ \"GNU coreutils 6.10\" \"User Commands\"\n.SH NAME\nls \\- list directory contents\n\
    .SH SYNOPSIS\n.B ls\n[\\fIOPTION\\fR]... [\\fIFILE\\fR]...\n.SH DESCRIPTION\n\
    .\\\" Add any additional description here\n.PP\n```\n\nCompared to the man page\
    \ in its normal presentation, we can begin to see a correlation between the markup\
    \ language and its results:\n\n```\n[me@linuxbox ~]$ man ls | head\nLS(1)    \
    \                      User Commands                         LS(1)\n\nNAME\n\n\
    \       ls - list directory contents\n```"
  merge: -1
  img_proc: true
- pgno: 337
  md: "# ## 22 – Formatting Output\n\n```\nSYNOPSIS\n    ls [OPTION]... [FILE]...\n\
    ```\n\nThe reason this is of interest is that man pages are rendered by groff,\
    \ using the mandoc macro package. In fact, we can simulate the man command with\
    \ the following pipeline:\n\n```\n[me@linuxbox ~]$ zcat /usr/share/man/man1/ls.1.gz\
    \ | groff -mandoc -T ascii | head\nLS(1)                                     \
    \ User Commands                                      LS(1)\n\n\nNAME\n    ls -\
    \ list directory contents\n\nSYNOPSIS\n    ls [OPTION]... [FILE]...\n```\n\nHere\
    \ we use the groff program with the options set to specify the mandoc macro package\
    \ and the output driver for ASCII. groff can produce output in several formats.\
    \ If no format is specified, PostScript is output by default:\n\n```\n[me@linuxbox\
    \ ~]$ zcat /usr/share/man/man1/ls.1.gz | groff -mandoc | head\n%PS-Adobe-3.0\n\
    %%Creator: groff version 1.18.1\n%%CreationDate: Thu Feb  5 13:44:37 2009\n%%DocumentNeededResources:\
    \ font Times-Roman\n%%+ font Times-Bold\n%%+ font Times-Italic\n%%DocumentSuppliedResources:\
    \ procset grops 1.18 1\n%%Pages: 4\n%%PageOrder: Ascend\n%%Orientation: Portrait\n\
    ```\n\nWe briefly mentioned PostScript in the previous chapter, and will again\
    \ in the next chapter. PostScript is a page description language that is used\
    \ to describe the contents of a printed page to a typesetter-like device. If we\
    \ take the output of our command and store it to a file (assuming that we are\
    \ using a graphical desktop with a Desktop directory):"
