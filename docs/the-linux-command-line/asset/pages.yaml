    # Metacharacters And Literals


    While it may not seem apparent, our grep searches have been using regular expressions
    all along, albeit very simple ones. The regular expression “bzip” is taken to
    mean that a match will occur only if the line in the file contains at least four
    characters and that somewhere in the line the characters “b”, “z”, “i”, and “p”
    are found in that order, with no other characters in between. The characters in
    the string “bzip” are all literal characters, in that they match themselves. In
    addition to literals, regular expressions may also'
  merge: -1
