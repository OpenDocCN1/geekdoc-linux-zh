    # sudo – Execute A Command As Another User


    The sudo command is like su in many ways, but has some important additional capabilities.
    The administrator can configure sudo to allow an ordinary user to execute commands
    as a different user (usually the superuser) in a very controlled way. In particular,
    a user may be restricted to one or more specific commands and no others. Another
    important difference is that the use of sudo does not require access to the superuser''s
    password. To authenticate using sudo, the user uses his/her own password. Let''s
    say, for example, that sudo has been configured to allow us to run a fictitious
    backup program called "backup_script", which requires superuser privileges. With
    sudo it would be done like this:


    ```

    [me@linuxbox ~]$ sudo backup_script

    Password:

    System Backup Starting...

    ```


    After entering the command, we are prompted for our password (not the superuser''s)
    and once the authentication is complete, the specified command is carried out.
    One important difference between su and sudo is that sudo does not start a new
    shell, nor does it load another user''s environment. This means that commands
    do not need to be quoted any differently than they would be without using sudo.
    Note that this behavior can be overridden by specifying various options. See the
    sudo man page for details.


    To see what privileges are granted by sudo, use the "-l" option to list them:


    ```

    [me@linuxbox ~]$ sudo -l

    User me may run the following commands on this host:

    ```'
