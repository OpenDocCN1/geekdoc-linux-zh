    the change to umask permanent.


    # Changing Your Password


    The last topic we''ll cover in this chapter is setting passwords for yourself
    (and for other users if you have access to superuser privileges.) To set or change
    a password, the passwd command is used. The command syntax looks like this:


    ```

    passwd [user]

    ```


