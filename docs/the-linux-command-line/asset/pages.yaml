- pgno: 367
  md: '```

    [me@linuxbox diction-1.11]$ ls -l diction getopt.c

    -rwxr-xr-x 1 me me 37164 2009-03-05 06:24 diction

    -rw-r--r-- 1 me me 33125 2009-03-05 06:23 getopt.c

    ```


    The ability of make to intelligently build only what needs building is a great
    benefit to programmers. While the time savings may not be very apparent with our
    small project, it is very significant with larger projects. Remember, the Linux
    kernel (a program that undergoes continuous modification and improvement) contains
    several million lines of code.


    # Installing The Program


    Well-packaged source code will often include a special make target called install.
    This target will install the final product in a system directory for use. Usually,
    this directory is /usr/local/bin, the traditional location for locally built software.
    However, this directory is not normally writable by ordinary users, so we must
    become the superuser to perform the installation:


    ```

    [me@linuxbox diction-1.11]$ sudo make install

    ```


    After we perform the installation, we can check that the program is ready to go:


    ```

    [me@linuxbox diction-1.11]$ which diction

    /usr/local/bin/diction

    [me@linuxbox diction-1.11]$ man diction

    ```


    And there we have it!


    # Summing Up


    In this chapter, we have seen how three simple commands:

    ./configure

    make

    make install

    can be used to build many source code packages. We have also seen the important
    role that make plays in the maintenance of programs. The make program can be used
    for any task that needs to maintain a target/dependency relationship, not just
    for compiling source code.'
  merge: -1
  img_proc: true
