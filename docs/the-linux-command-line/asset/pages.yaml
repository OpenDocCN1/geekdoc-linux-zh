  md: '# Creating Your Own Commands With alias


    Now for our very first experience with programming! We will create a command of
    our own using the alias command. But before we start, we need to reveal a small
    command line trick. It''s possible to put more than one command on a line by separating
    each command with a semicolon character. It works like this:


    ```

    command1; command2; command3...

    ```


    Here''s the example we will use:


    ```

    [me@linuxbox ~]$ cd /usr; ls; cd -

    bin games kerberos lib64 local share tmp

    etc include lib libexec sbin src

    /home/me

    [me@linuxbox ~]$

    ```


    As we can see, we have combined three commands on one line. First we change directory
    to /usr then list the directory and finally return to the original directory (by
    using ''cd -'') so we end up where we started. Now let''s turn this sequence into
    a new command using alias. The first thing we have to do is dream up a name for
    our new command. Let''s try "test". Before we do that, it would be a good idea
    to find out if the name "test" is already being used. To find out, we can use
    the type command again:


    ```

    [me@linuxbox ~]$ type test

    test is a shell builtin

    ```


    Oops! The name "test" is already taken. Let''s try "foo":


    ```

    [me@linuxbox ~]$ type foo

    bash: type: foo: not found

    ```


    Great! "foo" is not taken. So let''s create our alias:


    ```

    [me@linuxbox ~]$ alias foo=''cd /usr; ls; cd -''

    ```'
