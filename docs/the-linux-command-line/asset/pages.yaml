- pgno: 502
  md: "handling routine.\n\nWhen we design a large, complicated script, it is important\
    \ to consider what happens if the user logs off or shuts down the computer while\
    \ the script is running. When such an event occurs, a signal will be sent to all\
    \ affected processes and, in turn, the programs representing those processes can\
    \ perform actions to ensure a proper and orderly termination of the program. Let's\
    \ say, for example, that we wrote a script that created a temporary file during\
    \ its execution. In the course of good design, we would have the script delete\
    \ the file when the script finishes its work. It would also be smart to have the\
    \ script delete the file if a signal is received indicating that the program was\
    \ going to be terminated prematurely.\n\nbash provides a mechanism for this purpose\
    \ known as a trap. Traps are implemented with the appropriately named builtin\
    \ command, trap. trap uses the following syntax: trap argument signal [signal...]\n\
    \nwhere argument is a string which will be read and treated as a command and signal\
    \ is the specification of a signal that will trigger the execution of the interpreted\
    \ command.\n\nHere is a simple example:\n\n```\n#!/bin/bash\n\n# trap-demo : simple\
    \ signal handling demo\n\ntrap \"echo 'I am ignoring you.'\" SIGINT SIGTERM\n\n\
    for i in {1..5}; do\n    echo \"Iteration $i of 5\"\n    sleep 5\ndone\n```\n\n\
    This script defines a trap that will execute an echo command each time either\
    \ the SIGINT or SIGTERM signal is received while the script is running. Execution\
    \ of the program looks like this when the user attempts to stop the script by\
    \ typing Ctrl-C:\n\n```\n[me@linuxbox ~]$ trap-demo\nIteration 1 of 5\nIteration\
    \ 2 of 5\nI am ignoring you.\nIteration 3 of 5\nI am ignoring you.\nIteration\
    \ 4 of 5\nIteration 5 of 5\n```"
  merge: -1
  img_proc: true
- pgno: 503
  md: "As we can see, each time the user attempts to interrupt the program, the message\
    \ is printed instead.\n\nConstructing a string to form a useful sequence of commands\
    \ can be awkward, so it is common practice to specify a shell function as the\
    \ command. In this example, a separate shell function is specified for each signal\
    \ to be handled:\n\n```\n#!/bin/bash\n\n# trap-demo2 : simple signal handling\
    \ demo\n\nexit_on_signal_SIGINT () {\n    echo \"Script interrupted.\" 2>&1\n\
    \    exit 0\n}\n\nexit_on_signal_SIGTERM () {\n    echo \"Script terminated.\"\
    \ 2>&1\n    exit 0\n}\n\ntrap exit_on_signal_SIGINT SIGINT\ntrap exit_on_signal_SIGTERM\
    \ SIGTERM\n\nfor i in {1..5}; do\n    echo \"Iteration $i of 5\"\n    sleep 5\n\
    done\n```\n\nThis script features two trap commands, one for each signal. Each\
    \ trap, in turn, specifies a shell function to be executed when the particular\
    \ signal is received. Note the inclusion of an exit command in each of the signal\
    \ handling functions. Without an exit, the script would continue after completing\
    \ the function.\n\nWhen the user presses Ctrl-c during the execution of this script,\
    \ the results look like this:\n\n```\n[me@linuxbox ~]$ trap-demo2\nIteration 1\
    \ of 5\nIteration 2 of 5\nScript interrupted.\n```"
  merge: -1
  img_proc: true
- pgno: 504
  md: '# Temporary Files


    One reason signal handlers are included in scripts is to remove temporary files
    that the script may create to hold intermediate results during execution. There
    is something of an art to naming temporary files. Traditionally, programs on Unix-like
    systems create their temporary files in the /tmp directory, a shared directory
    intended for such files. However, since the directory is shared, this poses certain
    security concerns, particularly for programs running with superuser privileges.
    Aside from the obvious step of setting proper permissions for files exposed to
    all users of the system, it is important to give temporary files non-predictable
    filenames. This avoids an exploit known as a temp race attack. One way to create
    a non-predictable (but still descriptive) name is to do something like this:


    ```

    tempfile=/tmp/$(basename $0).$$.$RANDOM

    ```


    This will create a filename consisting of the program''s name, followed by its
    process ID (PID), followed by a random integer. Note, however, that the $RANDOM
    shell variable only returns a value in the range of 1-32767, which is not a very
    large range in computer terms, so a single instance of the variable is not sufficient
    to overcome a determined attacker.


    A better way is to use the mktemp program (not to be confused with the mktemp
    standard library function) to both name and create the temporary file. The mktemp
    program accepts a template as an argument that is used to build the filename.
    The template should include a series of "X" characters which are replaced by a
    corresponding number of random letters and numbers. The longer the series of "X"
    characters, the longer the series of random characters. Here is an example:


    ```

    tempfile=$(mktemp /tmp/foobar.$$ .XXXXXXXX)

    ```


    This creates a temporary file and assigns its name to the variable tempfile. The
    "X" characters in the template are replaced with random letters and numbers so
    that the final filename (which, in this example, also includes the expanded value
    of the special parameter $$ to obtain the PID) might be something like:


    ```

    /tmp/foobar.6593.U0ZuvM6654

    ```


    While the mktemp man page states that mktemp makes a temporary filename, mktemp
    also creates the file as well.


    For scripts that are executed by regular users, it may be wise to avoid the use
    of the /tmp directory and create a directory for temporary files within the user''s
    home directory, with a line of code such as this:'
  merge: -1
  img_proc: true
