- pgno: 329
  md: 'style” formatting to the text. This means a single space between words and
    two spaces between sentences. This mode is useful for removing “justification,”
    that is, text that has been padded with spaces to force alignment on both the
    left and right margins.


    | -w width | Format text to fit within a column width characters wide. The default
    is 75 characters. Note: fmt actually formats lines slightly shorter than the specified
    width to allow for line balancing. |


    The -p option is particularly interesting. With it, we can format selected portions
    of a file, provided that the lines to be formatted all begin with the same sequence
    of characters. Many programming languages use the pound sign (#) to indicate the
    beginning of a comment and thus can be formatted using this option. Let’s create
    a file that simulates a program that uses comments:


    ```

    [me@linuxbox ~]$ cat > fmt-code.txt

    # This file contains code with comments.


    # This line is a comment.

    # Followed by another comment line.

    # And another.


    This, on the other hand, is a line of code.

    And another line of code.

    And another.

    ```


    Our sample file contains comments which begin the string “# ” (a # followed by
    a space) and lines of “code” which do not. Now, using fmt, we can format the comments
    and leave the code untouched:


    ```

    [me@linuxbox ~]$ fmt -w 50 -p ''# '' fmt-code.txt

    # This file contains code with comments.


    # This line is a comment. Followed by another

    # comment line. And another.


    This, on the other hand, is a line of code.

    And another line of code.

    And another.

    ```


    Notice that the adjoining comment lines are joined, while the blank lines and
    the lines that do not begin with the specified prefix are preserved.'
  merge: -1
