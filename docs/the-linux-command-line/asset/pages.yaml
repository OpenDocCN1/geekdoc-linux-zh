- pgno: 482
  md: '| ~ | Bitwise negation. Negate all the bits in a number. |

    | << | Left bitwise shift. Shift all the bits in a number to the left. |

    | >> | Right bitwise shift. Shift all the bits in a number to the right. |

    | & | Bitwise AND. Perform an AND operation on all the bits in two numbers. |

    | | | Bitwise OR. Perform an OR operation on all the bits in two numbers. |

    | ^ | Bitwise XOR. Perform an exclusive OR operation on all the bits in two numbers.
    |


    Note that there are also corresponding assignment operators ( for example, <<=)
    for all but bitwise negation.


    Here we will demonstrate producing a list of powers of two, using the left bitwise
    shift operator:


    ```

    [me@linuxbox ~]$ for ((i=0;i<8;++i)); do echo $((1<<i)); done

    1

    2

    4

    8

    16

    32

    64

    128

    ```


    # Logic


    As we discovered in Chapter 28, the (( )) compound command supports a variety
    of comparison operators. There are a few more that can be used to evaluate logic.
    Here is the complete list:


    Table 35-5: Comparison Operators


    | Operator | Description |

    | <= | Less than or equal to |

    | >= | Greater than or equal to |

    | < | Less than |'
  merge: -1
  img_proc: true
- pgno: 483
  md: '|  |  |

    |---|---|

    | > | Greater than |

    | == | Equal to |

    | != | Not equal to |

    | && | Logical AND |

    | || | Logical OR |

    | *expr1?expr2:expr3* | Comparison (ternary) operator. If expression *expr1* evaluates
    to be non-zero (arithmetic true) then *expr2*, else *expr3*. |


    When used for logical operations, expressions follow the rules of arithmetic logic;
    that is, expressions that evaluate as zero are considered false, while non-zero
    expressions are considered true. The (( )) compound command maps the results into
    the shell''s normal exit codes:


    ```

    [me@linuxbox ~]$ if ((1)); then echo "true"; else echo "false"; fi

    true

    [me@linuxbox ~]$ if ((0)); then echo "true"; else echo "false"; fi

    false

    ```


    The strangest of the logical operators is the *ternary operator*. This operator
    (which is modeled after the one in the C programming language) performs a standalone
    logical test. It can be used as a kind of if/then/else statement. It acts on three
    arithmetic expressions (strings won''t work), and if the first expression is true
    (or non-zero) the second expression is performed. Otherwise, the third expression
    is performed. We can try this on the command line:


    ```

    [me@linuxbox ~]$ a=0

    [me@linuxbox ~]$ ((a<1?++a:--a))

    [me@linuxbox ~]$ echo $a

    1

    [me@linuxbox ~]$ ((a<1?++a:--a))

    [me@linuxbox ~]$ echo $a

    0

    ```


    Here we see a ternary operator in action. This example implements a toggle. Each
    time the operator is performed, the value of the variable a switches from zero
    to one or vice versa.'
