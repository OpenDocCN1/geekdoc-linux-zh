- pgno: 243
  md: '# # 19 – Archiving And Backup


    One of the primary tasks of a computer system’s administrator is keeping the system’s
    data secure. One way this is done is by performing timely backups of the system’s
    files. Even if you’re not system administrators, it is often useful to make copies
    of things and to move large collections of files from place to place and from
    device to device.


    In this chapter, we will look at several common programs that are used to manage
    collections of files. There are the file compression programs:


    +   - `gzip` – Compress or expand files

    +   - `bzip2` – A block sorting file compressor


    The archiving programs:


    +   - `tar` – Tape archiving utility

    +   - `zip` – Package and compress files


    And the file synchronization program:


    +   - `rsync` – Remote file and directory synchronization


    # ## Compressing Files


    Throughout the history of computing, there has been a struggle to get the most
    data into the smallest available space, whether that space be a memory, storage
    devices or network bandwidth. Many of the data services that we take for granted
    today, such as portable music players, high definition television, or broadband
    Internet, owe their existence to effective *data compression* techniques.


    Data compression is the process of removing *redundancy* from data. Let’s consider
    an imaginary example. Say we had an entirely black picture file with the dimensions
    of one hundred pixels by one hundred pixels. In terms of data storage (assuming
    twenty-four bits, or three bytes per pixel), the image will occupy thirty thousand
    bytes of storage:


    ```

    100 * 100 * 3 = 30,000

    ```


    An image that is all one color contains entirely redundant data. If we were clever,
    we could encode the data in such a way that we simply describe the fact that we
    have a block'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'of thirty thousand black pixels. So, instead of storing a block of data containing
    thirty thousand zeros (black is usually represented in image files as zero), we
    could compress the data into the number 30,000, followed by a zero to represent
    our data. Such a data compression scheme is called run-length encoding and is
    one of the most rudimentary compression techniques. Today’s techniques are much
    more advanced and complex but the basic goal remains the same—get rid of redundant
    data.


    Compression algorithms (the mathematical techniques used to carry out the compression)
    fall into two general categories, lossless and lossy. Lossless compression preserves
    all the data contained in the original. This means that when a file is restored
    from a compressed version, the restored file is exactly the same as the original,
    uncompressed version. Lossy compression, on the other hand, removes data as the
    compression is performed, to allow more compression to be applied. When a lossy
    file is restored, it does not match the original version; rather, it is a close
    approximation. Examples of lossy compression are JPEG (for images) and MP3 (for
    music.) In our discussion, we will look exclusively at lossless compression, since
    most data on computers cannot tolerate any data loss.


    # gzip


    The gzip program is used to compress one or more files. When executed, it replaces
    the original file with a compressed version of the original. The corresponding
    gunzip program is used to restore compressed files to their original, uncompressed
    form. Here is an example:


    ```

    [me@linuxbox ~]$ ls -l /etc > foo.txt

    [me@linuxbox ~]$ ls -l foo.*

    -rw-r--r-- 1 me me 15738 2008-10-14 07:15 foo.txt

    [me@linuxbox ~]$ gzip foo.txt

    [me@linuxbox ~]$ ls -l foo.*

    -rw-r--r-- 1 me me 3230 2008-10-14 07:15 foo.txt.gz

    [me@linuxbox ~]$ gunzip foo.txt

    [me@linuxbox ~]$ ls -l foo.*

    -rw-r--r-- 1 me me 15738 2008-10-14 07:15 foo.txt

    ```


    In this example, we create a text file named foo.txt from a directory listing.
    Next, we run gzip, which replaces the original file with a compressed version
    named foo.txt.gz. In the directory listing of foo.*, we see that the original
    file has been replaced with the compressed version, and that the compressed version
    about one-fifth the size of the original. We can also see that the compressed
    file has the same permissions and time stamp as the original.


    Next, we run the gunzip program to uncompress the file. Afterward, we can see
    that'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'the compressed version of the file has been replaced with the original, again
    with the permissions and time stamp preserved.


    gzip has many options. Here are a few:


    Table 19-1: gzip Options


    | Option | Description |

    | --- | --- |

    | -c | Write output to standard output and keep original files. May also be specified
    with --stdout and --to-stdout. |

    | -d | Decompress. This causes gzip to act like gunzip. May also be specified
    with --decompress or --uncompress. |

    | -f | Force compression even if compressed version of the original file already
    exists. May also be specified with --force. |

    | -h | Display usage information. May also be specified with --help. |

    | -l | List compression statistics for each file compressed. May also be specified
    with --list. |

    | -r | If one or more arguments on the command line are directories, recursively
    compress files contained within them. May also be specified with --recursive.
    |

    | -t | Test the integrity of a compressed file. May also be specified with --test.
    |

    | -v | Display verbose messages while compressing. May also be specified with
    --verbose. |

    | -number | Set amount of compression. number is an integer in the range of 1
    (fastest, least compression) to 9 (slowest, most compression). The values 1 and
    9 may also be expressed as --fast and --best, respectively. The default value
    is 6. |


    Going back to our earlier example:


    ```

    [me@linuxbox ~]$ gzip foo.txt

    [me@linuxbox ~]$ gzip -tv foo.txt.gz

    foo.txt.gz: OK

    [me@linuxbox ~]$ gzip -d foo.txt.gz

    ```


    Here, we replaced the file foo.txt with a compressed version, named foo.txt.gz.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'Next, we tested the integrity of the compressed version, using the -t and -v
    options. Finally, we decompressed the file back to its original form.


    gzip can also be used in interesting ways via standard input and output:


    ```

    [me@linuxbox ~]$ ls -l /etc | gzip > foo.txt.gz

    ```


    This command creates a compressed version of a directory listing.


    The gunzip program, which uncompresses gzip files, assumes that filenames end
    in the extension .gz, so it''s not necessary to specify it, as long as the specified
    name is not in conflict with an existing uncompressed file:


    ```

    [me@linuxbox ~]$ gunzip foo.txt

    ```


    If our goal were only to view the contents of a compressed text file, we can do
    this:


    ```

    [me@linuxbox ~]$ gunzip -c foo.txt | less

    ```


    Alternately, there is a program supplied with gzip, called zcat, that is equivalent
    to gunzip with the -c option. It can be used like the cat command on gzip compressed
    files:


    ```

    [me@linuxbox ~]$ zcat foo.txt.gz | less

    ```


    > Tip: There is a zless program, too. It performs the same function as the pipeline
    above.


    # bzip2


    The bzip2 program, by Julian Seward, is similar to gzip, but uses a different
    compression algorithm that achieves higher levels of compression at the cost of
    compression speed. In most regards, it works in the same fashion as gzip. A file
    compressed with bzip2 is denoted with the extension .bz2:'
  merge: -1
  img_proc: true
- pgno: 247
  md: '```

    [me@linuxbox ~]$ ls -l /etc > foo.txt

    [me@linuxbox ~]$ ls -l foo.txt

    -rw-r--r-- 1 me me 15738 2008-10-17 13:51 foo.txt

    [me@linuxbox ~]$ bzip2 foo.txt

    [me@linuxbox ~]$ ls -l foo.txt.bz2

    -rw-r--r-- 1 me me 2792 2008-10-17 13:51 foo.txt.bz2

    [me@linuxbox ~]$ bunzip2 foo.txt.bz2

    ```


    As we can see, bzip2 can be used the same way as gzip. All the options (except
    for -r) that we discussed for gzip are also supported in bzip2. Note, however,
    that the compression level option (-number) has a somewhat different meaning to
    bzip2. bzip2 comes with bunzip2 and bzcat for decompressing files.


    bzip2 also comes with the bzip2recover program, which will try to recover damaged
    .bz2 files.


    # Don''t Be Compressive Compulsive


    I occasionally see people attempting to compress a file, which has been already
    compressed with an effective compression algorithm, by doing something like this:


    ```

    $ gzip picture.jpg

    ```


    Don''t do it. You''re probably just wasting time and space! If you apply compression
    to a file that is already compressed, you will actually end up a larger file.
    This is because all compression techniques involve some overhead that is added
    to the file to describe the compression. If you try to compress a file that already
    contains no redundant information, the compression will not result in any savings
    to offset the additional overhead.


    # Archiving Files


    A common file management task used in conjunction with compression is archiving.
    Archiving is the process of gathering up many files and bundling them together
    into a single large file. Archiving is often done as a part of system backups.
    It is also used when old data is moved from a system to some type of long-term
    storage.


    # tar


    In the Unix-like world of software, the tar program is the classic tool for archiving
    files.'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'Its name, short for *tape archive*, reveals its roots as a tool for making
    backup tapes. While it is still used for that traditional task, it is equally
    adept on other storage devices as well. We often see filenames that end with the
    extension .tar or .tgz which indicate a “plain” tar archive and a gzipped archive,
    respectively. A tar archive can consist of a group of separate files, one or more
    directory hierarchies, or a mixture of both. The command syntax works like this:


    ```

    tar mode[options] pathname...

    ```


    where *mode* is one of the following operating modes (only a partial list is shown
    here; see the tar man page for a complete list):


    # Table 19-2: tar Modes


    | Mode | Description |

    |------|-------------|

    | c | Create an archive from a list of files and/or directories. |

    | x | Extract an archive. |

    | r | Append specified pathnames to the end of an archive. |

    | t | List the contents of an archive. |


    tar uses a slightly odd way of expressing options, so we’ll need some examples
    to show how it works. First, let’s re-create our playground from the previous
    chapter:


