    # Some Helpful Shortcuts


    In table 3-1 we see some useful ways the current working directory can be quickly
    changed.


    Table 3-1: cd Shortcuts


    | Shortcut | Result |

    |---|---|

    | cd | Changes the working directory to your home directory. |

    | cd - | Changes the working directory to the previous working directory. |

    | cd ~user_name | Changes the working directory to the home directory of user_name.
    For example, cd ~bob will change the directory to the home directory of user “bob.”
    |


    # Important Facts About Filenames


    +   1. Filenames that begin with a period character are hidden. This only means
    that ls will not list them unless you say ls -a. When your account was created,
    several hidden files were placed in your home directory to configure things for
    your account. Later on we will take a closer look at some of these files to see
    how you can customize your environment. In addition, some applications place their
    configuration and settings files in your home directory as hidden files.

    +   2. Filenames and commands in Linux, like Unix, are case sensitive. The filenames
    “File1” and “file1” refer to different files.

    +   3. Linux has no concept of a “file extension” like some other operating systems.
    You may name files any way you like. The contents and/or purpose of a file is'
