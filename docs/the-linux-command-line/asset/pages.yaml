    a new, empty file) we can use a trick like this:


    ```

    [me@linuxbox ~]$ > ls-output.txt

    ```


    Simply using the redirection operator with no command preceding it will truncate
    an existing file or create a new, empty file.


    So, how can we append redirected output to a file instead of overwriting the file
    from the beginning? For that, we use the “>>” redirection operator, like so:


    ```

    [me@linuxbox ~]$ ls -l /usr/bin >> ls-output.txt

    ```


    Using the “>>” operator will result in the output being appended to the file.
    If the file does not already exist, it is created just as though the “>” operator
    had been used. Let’s put it to the test:


