- pgno: 382
  md: '```

    [me@linuxbox ~]$ foo="yes"

    [me@linuxbox ~]$ echo $foo

    yes

    [me@linuxbox ~]$ echo $fool


    [me@linuxbox ~]$

    ```


    We first assign the value “yes” to the variable foo, then display its value with
    echo. Next we display the value of the variable name misspelled as “fool” and
    get a blank result. This is because the shell happily created the variable fool
    when it encountered it, and gave it the default value of nothing, or empty. From
    this, we learn that we must pay close attention to our spelling! It’s also important
    to understand what really happened in this example. From our previous look at
    how the shell performs expansions, we know that the command:


    ```

    [me@linuxbox ~]$ echo $foo

    ```


    undergoes parameter expansion and results in:


    ```

    [me@linuxbox ~]$ echo yes

    ```


    Whereas the command:


    ```

    [me@linuxbox ~]$ echo $fool

    ```


    expands into:


    ```

    [me@linuxbox ~]$ echo

    ```


    The empty variable expands into nothing! This can play havoc with commands that
    require arguments. Here’s an example:


    ```

    [me@linuxbox ~]$ foo=foo.txt

    [me@linuxbox ~]$ fool=fool.txt

    [me@linuxbox ~]$ cp $foo $fool

    cp: missing destination file operand after `foo.txt''

    ```'
