    with this command we get an entirely different result (only a partial listing
    of the results is shown). Why is that? It''s a long story, but here''s the short
    version:


    Back when Unix was first developed, it only knew about ASCII characters, and this
    feature reflects that fact. In ASCII, the first thirty-two characters (numbers
    0-31) are control codes (things like tabs, backspaces, and carriage returns).
    The next thirty-two (32-63) contain printable characters, including most punctuation
    characters and the numerals zero through nine. The next thirty-two (numbers 64-95)
    contain the uppercase letters and a few more punctuation symbols. The final thirty-one
    (numbers 96-127) contain the lowercase letters and yet more punctuation symbols.
    Based on this arrangement, systems using ASCII used a collation order that looked
    like this:


    ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz


    This differs from proper dictionary order, which is like this:


    aAbBcCdDeEfFgGhHiIjJkKlLmMnNoOpPqQrRsStTuUvVwWxXyYzZ


    As the popularity of Unix spread beyond the United States, there grew a need to
    support characters not found in U.S. English. The ASCII table was expanded to
    use a full eight bits, adding characters numbers 128-255, which accommodated many
    more languages. To support this ability, the POSIX standards introduced a concept
    called a locale, which could be adjusted to select the character set needed for
    a particular location. We can see the language setting of our system using this
    command:


    ```

    [me@linuxbox ~]$ echo $LANG

    en_US.UTF-8

    ```


    With this setting, POSIX compliant applications will use a dictionary collation
    order rather than ASCII order. This explains the behavior of the commands above.
    A character range of [A-Z] when interpreted in dictionary order includes all of
    the alphabetic characters except the lowercase "a", hence our results.


    To partially work around this problem, the POSIX standard includes a number of
    character classes which provide useful ranges of characters. They are described
    in the'
