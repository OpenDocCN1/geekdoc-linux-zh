    11, 11 (November 1981), 1119-1184.

    ```


    Much better. By adding the -c option, we now have the desired result.


    fmt has some interesting options:


    # Table 22-3: fmt Options


    | Option | Description |

    |---|---|

    | -c | Operate in crown margin mode. This preserves the indentation of the first
    two lines of a paragraph. Subsequent lines are aligned with the indentation of
    the second line. |

    | -p string | Only format those lines beginning with the prefix string. After
    formatting, the contents of string are prefixed to each reformatted line. This
    option can be used to format text in source code comments. For example, any programming
    language or configuration file that uses a "#" character to delineate a comment
    could be formatted by specifying -p ''# '' so that only the comments will be formatted.
    See the example below. |

    | -s | Split-only mode. In this mode, lines will only be split to fit the specified
    column width. Short lines will not be joined to fill lines. This mode is useful
    when formatting text such as code where joining is not desired. |

    | -u | Perform uniform spacing. This will apply traditional "typewriter |'
