- pgno: 263
  md: 'include *metacharacters* that are used to specify more complex matches. Regular
    expression metacharacters consist of the following:


    ^ $ . [ ] { } - ? * + ( ) | \


    All other characters are considered literals, though the backslash character is
    used in a few cases to create *meta sequences*, as well as allowing the metacharacters
    to be escaped and treated as literals instead of being interpreted as metacharacters.


    > **Note:** As we can see, many of the regular expression metacharacters are also
    characters that have meaning to the shell when expansion is performed. When we
    pass regular expressions containing metacharacters on the command line, it is
    vital that they be enclosed in quotes to prevent the shell from attempting to
    expand them.


    # The Any Character


    The first metacharacter we will look at is the dot or period character, which
    is used to match any character. If we include it in a regular expression, it will
    match any character in that character position. Here’s an example:


    ```

    [me@linuxbox ~]$ grep -h ''.zip'' dirlist*.txt

    bunzip2

    bzip2

    bzip2recover

    gunzip

    gzip

    funzip

    gpg-zip

    preunzip

    prezip

    prezip-bin

    unzip

    unzipsfx

    ```


    We searched for any line in our files that matches the regular expression “.zip”.
    There are a couple of interesting things to note about the results. Notice that
    the zip program was not found. This is because the inclusion of the dot metacharacter
    in our regular expression increased the length of the required match to four characters,
    and because the name “zip” only contains three, it does not match. Also, if there
    had been any files in our lists that contained the file extension .zip, they would
    have also been matched as well, because the period character in the file extension
    is treated as “any character,” too.'
