- pgno: 467
  md: "The basis of this tradition comes from the Fortran programming language. In\
    \ Fortran, undeclared variables starting with the letters I, J, K, L, and M are\
    \ automatically typed as integers while variables beginning with any other letter\
    \ are typed as real (numbers with decimal fractions). This behavior led programmers\
    \ to use the variables I, J, and K for loop variables, since it was less work\
    \ to use them when a temporary variable (as loop variables often are) was needed.\n\
    \nIt also led to the following Fortran-based witticism:\n“GOD is real, unless\
    \ declared integer.”\n\n# for: C Language Form\n\nRecent versions of bash have\
    \ added a second form of for command syntax, one that resembles the form found\
    \ in the C programming language. Many other languages support this form, as well:\n\
    \n```\nfor (( expression1; expression2; expression3 )); do\n    commands\ndone\n\
    ```\n\nwhere expression1, expression2, and expression3 are arithmetic expressions\
    \ and commands are the commands to be performed during each iteration of the loop.\n\
    \nIn terms of behavior, this form is equivalent to the following construct:\n\n\
    ```\n(( expression1 ))\nwhile (( expression2 )); do\n    commands\n    (( expression3\
    \ ))\ndone\n```\n\nexpression1 is used to initialize conditions for the loop,\
    \ expression2 is used to determine when the loop is finished and expression3 is\
    \ carried out at the end of each iteration of the loop.\n\nHere is a typical application:\n\
    \n```\n#!/bin/bash\n\n# simple_counter : demo of C style for command\nfor (( i=0;\
    \ i<5; i=i+1 )); do\n    echo $i\ndone\n```"
  merge: -1
