  md: 'is a modal editor. When vi starts up, it begins in command mode. In this mode,
    almost every key is a command, so if we were to start typing, vi would basically
    go crazy and make a big mess.


    # Entering Insert Mode


    In order to add some text to our file, we must first enter insert mode. To do
    this, we press the “i” key. Afterwards, we should see the following at the bottom
    of the screen if vim is running in its usual enhanced mode (this will not appear
    in vi compatible mode):


    ```

    -- INSERT --

    ```


    Now we can enter some text. Try this:


    ```

    The quick brown fox jumped over the lazy dog.

    ```


    To exit insert mode and return to command mode, press the Esc key.


    # Saving Our Work


    To save the change we just made to our file, we must enter an ex command while
    in command mode. This is easily done by pressing the “:” key. After doing this,
    a colon character should appear at the bottom of the screen:


    ```

    :

    ```


    To write our modified file, we follow the colon with a “w” then Enter:


    ```

    :w

    ```


    The file will be written to the hard drive and we should get a confirmation message
    at the bottom of the screen, like this:


    ```

    "foo.txt" [New] 1L, 46C written

    ```'
