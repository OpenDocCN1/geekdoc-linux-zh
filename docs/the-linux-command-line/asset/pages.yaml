- pgno: 281
  md: '# 21 – Text Processing


    All Unix-like operating systems rely heavily on text files for several types of
    data storage. So it makes sense that there are many tools for manipulating text.
    In this chapter, we will look at programs that are used to “slice and dice” text.
    In the next chapter, we will look at more text processing, focusing on programs
    that are used to format text for printing and other kinds of human consumption.


    This chapter will revisit some old friends and introduce us to some new ones:


    +   - `cat` – Concatenate files and print on the standard output

    +   - `sort` – Sort lines of text files

    +   - `uniq` – Report or omit repeated lines

    +   - `cut` – Remove sections from each line of files

    +   - `paste` – Merge lines of files

    +   - `join` – Join lines of two files on a common field

    +   - `comm` – Compare two sorted files line by line

    +   - `diff` – Compare files line by line

    +   - `patch` – Apply a diff file to an original

    +   - `tr` – Translate or delete characters

    +   - `sed` – Stream editor for filtering and transforming text

    +   - `aspell` – Interactive spell checker


    # Applications Of Text


    So far, we have learned a couple of text editors (`nano` and `vim`), looked a
    bunch of configuration files, and have witnessed the output of dozens of commands,
    all in text. But what else is text used for? For many things, it turns out.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# Documents


    Many people write documents using plain text formats. While it is easy to see
    how a small text file could be useful for keeping simple notes, it is also possible
    to write large documents in text format, as well. One popular approach is to write
    a large document in a text format and then use a *markup language* to describe
    the formatting of the finished document. Many scientific papers are written using
    this method, as Unix-based text processing systems were among the first systems
    that supported the advanced typographical layout needed by writers in technical
    disciplines.


    # Web Pages


    The world’s most popular type of electronic document is probably the web page.
    Web pages are text documents that use either *HTML (Hypertext Markup Language)*
    or *XML (Extensible Markup Language)* as markup languages to describe the document’s
    visual format.


    # Email


    Email is an intrinsically text-based medium. Even non-text attachments are converted
    into a text representation for transmission. We can see this for ourselves by
    downloading an email message and then viewing it in `less`. We will see that the
    message begins with a *header* that describes the source of the message and the
    processing it received during its journey, followed by the *body* of the message
    with its content.


    # Printer Output


    On Unix-like systems, output destined for a printer is sent as plain text or,
    if the page contains graphics, is converted into a text format *page description
    language* known as *PostScript*, which is then sent to a program that generates
    the graphic dots to be printed.


    # Program Source Code


    Many of the command line programs found on Unix-like systems were created to support
    system administration and software development, and text processing programs are
    no exception. Many of them are designed to solve software development problems.
    The reason text processing is important to software developers is that all software
    starts out as text. *Source code*, the part of the program the programmer actually
    writes, is always in text format.


    # Revisiting Some Old Friends


    Back in Chapter 7 (Redirection), we learned about some commands that are able
    to'
  merge: -1
  img_proc: true
