- pgno: 432
  md: "# 31 – Troubleshooting\n\nAs our scripts become more complex, it’s time to\
    \ take a look at what happens when things go wrong and they don’t do what what\
    \ we want. In this chapter, we’ll look at some of the common kinds of errors that\
    \ occur in scripts, and describe a few useful techniques that can be used to track\
    \ down and eradicate problems.\n\n# Syntactic Errors\n\nOne general class of errors\
    \ is syntactic. Syntactic errors involve mis-typing some element of shell syntax.\
    \ In most cases, these kinds of errors will lead to the shell refusing to execute\
    \ the script.\n\nIn the following the discussions, we will use this script to\
    \ demonstrate common types of errors:\n\n```\n#!/bin/bash\n\n# trouble: script\
    \ to demonstrate common errors\n\nnumber=1\n\nif [ $number = 1 ]; then\n    echo\
    \ \"Number is equal to 1.\"\nelse\n    echo \"Number is not equal to 1.\"\nfi\n\
    ```\n\nAs written, this script runs successfully:\n\n```\n[me@linuxbox ~]$ trouble\n\
    Number is equal to 1.\n```"
  merge: -1
  img_proc: true
- pgno: 433
  md: "# Missing Quotes\n\nIf we edit our script and remove the trailing quote from\
    \ the argument following the first echo command:\n\n```\n#!/bin/bash\n\n# trouble:\
    \ script to demonstrate common errors\n\nnumber=1\n\nif [ $number = 1 ]; then\n\
    \    echo \"Number is equal to 1.\nelse\n    echo \"Number is not equal to 1.\"\
    \nfi\n```\n\nwatch what happens:\n\n```\n[me@linuxbox ~]$ trouble\n/home/me/bin/trouble:\
    \ line 10: unexpected EOF while looking for matching \"'\n/home/me/bin/trouble:\
    \ line 13: syntax error: unexpected end of file\n```\n\nIt generates two errors.\
    \ Interestingly, the line numbers reported are not where the missing quote was\
    \ removed, but rather much later in the program. We can see why, if we follow\
    \ the program after the missing quote. bash will continue looking for the closing\
    \ quote until it finds one, which it does immediately after the second echo command.\
    \ bash becomes very confused after that, and the syntax of the if command is broken\
    \ because the fi statement is now inside a quoted (but open) string.\n\nIn long\
    \ scripts, this kind of error can be quite hard to find. Using an editor with\
    \ syntax highlighting will help. If a complete version of vim is installed, syntax\
    \ highlighting can be enabled by entering the command:\n\n```\n:syntax on\n```\n\
    \n# Missing Or Unexpected Tokens\n\nAnother common mistake is forgetting to complete\
    \ a compound command, such as if or"
