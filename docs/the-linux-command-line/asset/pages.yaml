  md: 'nothing receiving data from the other end of the pipe yet. When this occurs,
    it is said that the pipe is *blocked*. This condition will clear once we attach
    a process to the other end and it begins to read input from the pipe. Using the
    second terminal window, we enter this command:


    ```

    [me@linuxbox ~]$ cat < pipe1

    ```


    and the directory listing produced from the first terminal window appears in the
    second terminal as the output from the cat command. The ls command in the first
    terminal successfully completes once it is no longer blocked.


    # Summing Up


    Well, we have completed our journey. The only thing left to do now is practice,
    practice, practice. Even though we covered a lot of ground in our trek, we barely
    scratched the surface as far as the command line goes. There are still thousands
    of command line programs left to be discovered and enjoyed. Start digging around
    in /usr/bin and you’ll see!


    # Further Reading


    +   - The “Compound Commands” section of the bash man page contains a full description
    of group command and subshell notations.

    +   - The EXPANSIONS section of the bash man page contains a subsection of process
    substitution.

    +   - *The Advanced Bash-Scripting Guide* also has a discussion of process substitution:
    http://tldp.org/LDP/abs/html/process-sub.html

    +   - *Linux Journal* has two good articles on named pipes. The first, from September
    1997: http://www.linuxjournal.com/article/2156

    +   - and the second, from March 2009: http://www.linuxjournal.com/content/using-named-pipes-fifos-bash'
