  md: "# (( )) - Designed For Integers\n\nIn addition to the [[ ]] compound command,\
    \ bash also provides the (( )) compound command, which is useful for operating\
    \ on integers. It supports a full set of arithmetic evaluations, a subject we\
    \ will cover fully in Chapter 35.\n\n(( )) is used to perform arithmetic truth\
    \ tests. An arithmetic truth test results in true if the result of the arithmetic\
    \ evaluation is non-zero.\n\n```\n[me@linuxbox ~]$ if ((1)); then echo \"It is\
    \ true.\"; fi\nIt is true.\n[me@linuxbox ~]$ if ((0)); then echo \"It is true.\"\
    ; fi\n[me@linuxbox ~]$\n```\n\nUsing (( )), we can slightly simplify the test-integer2\
    \ script like this:\n\n```\n#!/bin/bash\n\n# test-integer2a: evaluate the value\
    \ of an integer.\n\nINT=-5\n\nif [[ \"$INT\" =~ ^-?[0-9]+$ ]]; then\n    if ((INT\
    \ == 0)); then\n        echo \"INT is zero.\"\n    else\n        if ((INT < 0));\
    \ then\n            echo \"INT is negative.\"\n        else\n            echo\
    \ \"INT is positive.\"\n        fi\n        if (( (INT % 2) == 0)); then\n   \
    \         echo \"INT is even.\"\n        else\n            echo \"INT is odd.\"\
    \n        fi\n    fi\nelse\n    echo \"INT is not an integer.\" >&2\n    exit\
    \ 1\nfi\n```\n\nNotice that we use less than and greater than signs and that ==\
    \ is used to test for equivalence. This is a more natural looking syntax for working\
    \ with integers. Notice too, that because the compound command (( )) is part of\
    \ the shell syntax rather than"
