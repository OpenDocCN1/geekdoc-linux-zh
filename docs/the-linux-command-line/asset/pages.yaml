  md: 'Notice the structure of this command:


    ```

    alias name=''string''

    ```


    After the command “alias” we give alias a name followed immediately (no whitespace
    allowed) by an equals sign, followed immediately by a quoted string containing
    the meaning to be assigned to the name. After we define our alias, it can be used
    anywhere the shell would expect a command. Let’s try it:


    ```

    [me@linuxbox ~]$ foo

    bin  games  kerberos  lib64  local  share  tmp

    etc  include  lib  libexec  sbin  src

    /home/me

    [me@linuxbox ~]$

    ```


    We can also use the type command again to see our alias:


    ```

    [me@linuxbox ~]$ type foo

    foo is aliased to ''cd /usr; ls ; cd -''

    ```


    To remove an alias, the unalias command is used, like so:


    ```

    [me@linuxbox ~]$ unalias foo

    [me@linuxbox ~]$ type foo

    bash: type: foo: not found

    ```


    While we purposefully avoided naming our alias with an existing command name,
    it is not uncommon to do so. This is often done to apply a commonly desired option
    to each invocation of a common command. For instance, we saw earlier how the ls
    command is often aliased to add color support:


    ```

    [me@linuxbox ~]$ type ls

    ls is aliased to ''ls --color=tty''

    ```


    To see all the aliases defined in the environment, use the alias command without
    arguments. Here are some of the aliases defined by default on a Fedora system.
