    # Blanking A Re-Writable CD-ROM


    Rewritable CD-RW media needs to be erased or *blanked* before it can be reused.
    To do this, we can use *wodim*, specifying the device name for the CD writer and
    the type of blanking to be performed. The *wodim* program offers several types.
    The most minimal (and fastest) is the “fast” type:


    ```

    wodim dev=/dev/cdrw blank=fast

    ```


    # Writing An Image


    To write an image, we again use *wodim*, specifying the name of the optical media
    writer device and the name of the image file:


    ```

    wodim dev=/dev/cdrw image.iso

    ```


    In addition to the device name and image file, *wodim* supports a very large set
    of options. Two common ones are “-v” for verbose output, and “-dao” which writes
    the disk in *disk-at-once* mode. This mode should be used if you are preparing
    a disk for commercial reproduction. The default mode for *wodim* is *track-at-once*,
    which is useful for recording music tracks.


    # Further Reading


    We have just touched on the many ways that the command line can be used to manage
    storage media. Take a look at the man pages of the commands we have covered. Some
    of them support huge numbers of options and operations. Also, look for on-line
    tutorials for adding hard drives to your Linux system (there are many) and working
    with optical media.


    # Extra Credit


    It’s often useful to verify the integrity of an iso image that we have downloaded.
    In most cases, a distributor of an iso image will also supply a *checksum file*.
    A checksum is the result of an exotic mathematical calculation resulting in a
    number that represents the content of the target file. If the contents of the
    file change by even one bit, the resulting checksum will be much different. The
    most common method of checksum generation'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'uses the md5sum program. When you use md5sum, it produces a unique hexadecimal
    number:


    ```

    md5sum image.iso

    34e354760f9bb7fbf85c96f6a3f94ece  image.iso

    ```


    After you download an image, you should run md5sum against it and compare the
    results with the md5sum value supplied by the publisher.


    In addition to checking the integrity of a downloaded file, we can use md5sum
    to verify newly written optical media. To do this, we first calculate the checksum
    of the image file and then calculate a checksum for the media. The trick to verifying
    the media is to limit the calculation to only the portion of the optical media
    that contains the image. We do this by determining the number of 2048 byte blocks
    the image contains (optical media is always written in 2048 byte blocks) and reading
    that many blocks from the media. On some types of media, this is not required.
    A CD-R written in disk-at-once mode can be checked this way:


    ```

    md5sum /dev/cdrom

    34e354760f9bb7fbf85c96f6a3f94ece  /dev/cdrom

    ```


    Many types of media, such as DVDs require a precise calculation of the number
    of blocks. In the example below, we check the integrity of the image file dvd-image.iso
    and the disk in the DVD reader /dev/dvd. Can you figure out how this works?


    ```

    md5sum dvd-image.iso; dd if=/dev/dvd bs=2048 count=$(($($stat -c "%s" dvd-image.iso)
    / 2048 )) | md5sum

    ```'
