- pgno: 465
  md: "The really powerful feature of for is the number of interesting ways we can\
    \ create the list of words. For example, through brace expansion:\n\n```\n[me@linuxbox\
    \ ~]$ for i in {A..D}; do echo $i; done\nA\nB\nC\nD\n```\n\nOr pathname expansion:\n\
    \n```\n[me@linuxbox ~]$ for i in distros*.txt; do echo $i; done\ndistros-by-date.txt\n\
    distros-dates.txt\ndistros-key-names.txt\ndistros-key-vernums.txt\ndistros-names.txt\n\
    distros.txt\ndistros-vernums.txt\ndistros-versions.txt\n```\n\nOr command substitution:\n\
    \n```\n#!/bin/bash\n\n# longest-word : find longest string in a file\n\nwhile\
    \ [[ -n $1 ]]; do\n    if [[ -r $1 ]]; then\n        max_word=\n        max_len=0\n\
    \        for i in $(strings $1); do\n            len=$(echo $i | wc -c)\n    \
    \        if (( len > max_len )); then\n                max_len=$len\n        \
    \        max_word=$i\n            fi\n        done\n        echo \"$1: '$max_word'\
    \ ($max_len characters)\"\n    fi\n    shift\ndone\n```"
  merge: -1
  img_proc: true
- pgno: 466
  md: "In this example, we look for the longest string found within a file. When given\
    \ one or more files names on the command line, this program uses the strings program\
    \ (which is included in the GNU binutils package) to generate a list of readable\
    \ text “words” in each file. The for loop processes each word in turn and determines\
    \ if the current word is the longest found so far. When the loop concludes, the\
    \ longest word is displayed.\n\nIf the optional in words portion of the for command\
    \ is omitted, for defaults to processing the positional parameters. We will modify\
    \ our longest-word script to use this method:\n\n```\n#!/bin/bash\n\n# longest-word2\
    \ : find longest string in a file\n\nfor i; do\n    if [[ -r $i ]]; then\n   \
    \     max_word=\n        max_len=0\n        for j in $(strings $i); do\n     \
    \       len=$(echo $j | wc -c)\n            if (( len > max_len )); then\n   \
    \             max_len=$len\n                max_word=$j\n            fi\n    \
    \    done\n        echo \"$i: '$max_word' ($max_len characters)\"\n    fi\ndone\n\
    ```\n\nAs we can see, we have changed the outermost loop to use for in place of\
    \ while. By omitting the list of words in the for command, the positional parameters\
    \ are used instead. Inside the loop, previous instances of the variable i have\
    \ been changed to the variable j. The use of shift has also been eliminated.\n\
    \n# Why i?\n\nYou may have noticed that the variable i was chosen for each of\
    \ the for loop examples above. Why? No specific reason actually, besides tradition.\
    \ The variable used with for can be any valid variable, but i is the most common,\
    \ followed by j and k."
