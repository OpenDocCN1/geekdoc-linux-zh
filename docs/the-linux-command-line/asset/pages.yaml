    # Some Special Permissions


    Though we usually see an octal permission mask expressed as a three digit number,
    it is more technically correct to express it in four digits. Why? Because, in
    addition to read, write, and execute permission, there are some other, less used,
    permission settings.


    The first of these is the setuid bit (octal 4000). When applied to an executable
    file, it sets the effective user ID from that of real user (the user actually
    running the program) to that of the program''s owner. Most often this is given
    to a few programs owned by the superuser. When an ordinary user runs a program
    that is "setuid root", the program runs with the effective privileges of the superuser.
    This allows the program to access files and directories that an ordinary user
    would normally be prohibited from accessing. Clearly, because this raises security
    concerns, number of setuid programs must be held to an absolute minimum.


    The second is the setgid bit (octal 2000) which, like the setuid bit, changes
    the effective group ID from the real group ID of the user to that of the file
    owner. If the setgid bit is set on a directory, newly created files in the directory
    will be given the group ownership of the directory rather the group ownership
    of the file''s creator. This is useful in a shared directory when members of a
    common group need access to all the files in the directory, regardless of the
    file owner''s primary group.


    The third is called the sticky bit (octal 1000). This is a holdover from ancient
    Unix, where it was possible to mark an executable file as "not swappable." On
    files, Linux ignores the sticky bit, but if applied to a directory, it prevents
    users from deleting or renaming files unless the user is either the owner of the
    directory,'
  merge: -1
  img_proc: true
- pgno: 117
