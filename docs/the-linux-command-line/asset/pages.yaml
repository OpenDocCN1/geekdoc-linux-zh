  md: "```\ncount=$(($count + 1))\ndone\necho \"Finished.\"\n```\n\nBy changing the\
    \ test expression to $count -gt 5, until will terminate the loop at the correct\
    \ time. The decision of whether to use the while or until loop is usually a matter\
    \ of choosing the one that allows the clearest test to be written.\n\n# Reading\
    \ Files With Loops\n\nwhile and until can process standard input. This allows\
    \ files to be processed with while and until loops. In the following example,\
    \ we will display the contents of the distros.txt file used in earlier chapters:\n\
    \n```\n#!/bin/bash\n\n# while-read: read lines from a file\nwhile read distro\
    \ version release; do\n    printf \"Distro: %s\\tVersion: %s\\tReleased: %s\\\
    n\" \\\n        $distro \\\n        $version \\\n        $release\ndone < distros.txt\n\
    ```\n\nTo redirect a file to the loop, we place the redirection operator after\
    \ the done statement. The loop will use read to input the fields from the redirected\
    \ file. The read command will exit after each line is read, with a zero exit status\
    \ until the end-of-file is reached. At that point, it will exit with a non-zero\
    \ exit status, thereby terminating the loop. It is also possible to pipe standard\
    \ input into a loop:\n\n```\n#!/bin/bash\n\n# while-read2: read lines from a file\n\
    sort -k 1,1 -k 2n distros.txt | while read distro version release; do\n    printf\
    \ \"Distro: %s\\tVersion: %s\\tReleased: %s\\n\" \\\n        $distro \\\n    \
    \    $version \\\n        $release\ndone\n```"
