    # Quoting


    Now that we''ve seen how many ways the shell can perform expansions, it''s time
    to learn how we can control it. Take for example:


    ```

    [me@linuxbox ~]$ echo this is a    test

    this is a test

    ```


    or:


    ```

    [me@linuxbox ~]$ echo The total is $100.00

