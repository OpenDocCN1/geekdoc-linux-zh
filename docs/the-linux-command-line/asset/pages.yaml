    |---|---|

    | cursor or changing text colors. |  |

    | \] | Signals the end of a non-printing character sequence. |


    # Trying Some Alternate Prompt Designs


    With this list of special characters, we can change the prompt to see the effect.
    First, we''ll back up the existing string so we can restore it later. To do this,
    we will copy the existing string into another shell variable that we create ourselves:


    ```

    [me@linuxbox ~]$ ps1_old="$PS1"

    ```


    We create a new variable called ps1_old and assign the value of PS1 to it. We
    can verify that the string has been copied with the echo command:


    ```

    [me@linuxbox ~]$ echo $ps1_old

    [\u@\h \w]\$

    ```


    We can restore the original prompt at any time during our terminal session by
    simply reversing the process:


    ```

    [me@linuxbox ~]$ PS1="$ps1_old"

    ```


    Now that we are ready to proceed, let''s see what happens if we have an empty
    prompt string:


    ```

    [me@linuxbox ~]$ PS1=

    ```


    If we assign nothing to the prompt string, we get nothing. No prompt string at
    all! The prompt is still there, but displays nothing, just as we asked it to.
    Since this is kind of disconcerting to look at, we''ll replace it with a minimal
    prompt:


    ```

    PS1="\$ "

    ```


    That''s better. At least now we can see what we are doing. Notice the trailing
    space within the double quotes. This provides the space between the dollar sign
    and the cursor'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'when the prompt is displayed.


    Let''s add a bell to our prompt:


    ```

    $ PS1="\a\$ "

    ```


    Now we should hear a beep each time the prompt is displayed. This could get annoying,
    but it might be useful if we needed notification when an especially long-running
    command has been executed.


    Next, let''s try to make an informative prompt with some host name and time-of-day
    information:


    ```

    $ PS1="\A \h \$ "

    17:33 linuxbox $

    ```


    Adding time-of-day to our prompt will be useful if we need to keep track of when
    we perform certain tasks. Finally, we''ll make a new prompt that is similar to
    our original:


    ```

    17:37 linuxbox $ PS1="\u@\h \w>\$ "

    <me@linuxbox ~>$

    ```


    Try out the other sequences listed in the table above and see if you can come
    up with a brilliant new prompt.


    # Adding Color


    Most terminal emulator programs respond to certain non-printing character sequences
    to control such things as character attributes (like color, bold text and the
    dreaded blinking text) and cursor position. We''ll cover cursor position in a
    little bit, but first we''ll look at color.


    # Terminal Confusion


    Back in ancient times, when terminals were hooked to remote computers, there were
    many competing brands of terminals and they all worked differently. They had different
    keyboards and they all had different ways of interpreting control'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'information. Unix and Unix-like systems have two rather complex subsystems
    to deal with the babel of terminal control (called termcap and terminfo). If you
    look in the deepest recesses of your terminal emulator settings you may find a
    setting for the type of terminal emulation.


    In an effort to make terminals speak some sort of common language, the American
    National Standards Institute (ANSI) developed a standard set of character sequences
    to control video terminals. Old time DOS users will remember the ANSI.SYS file
    that was used to enable interpretation of these codes.


    Character color is controlled by sending the terminal emulator an ANSI escape
    code embedded in the stream of characters to be displayed. The control code does
    not “print out” on the display, rather it is interpreted by the terminal as an
    instruction. As we saw in the table above, the \[ and \] sequences are used to
    encapsulate non-printing characters. An ANSI escape code begins with an octal
    033 (the code generated by the escape key) followed by an optional character attribute
    followed by an instruction. For example, the code to set the text color to normal
    (attribute = 0), black text is:

    \033[0;30m


    Here is a table of available text colors. Notice that the colors are divided into
    two groups, differentiated by the application of the bold character attribute
    (1) which creates the appearance of “light” colors:


    # Table14- 2: Escape Sequences Used To Set Text Colors


    | Sequence | Text Color | Sequence | Text Color |

    |---|---|---|---|

    | \033[0;30m | Black | \033[1;30m | Dark Gray |

    | \033[0;31m | Red | \033[1;31m | Light Red |

    | \033[0;32m | Green | \033[1;32m | Light Green |

    | \033[0;33m | Brown | \033[1;33m | Yellow |

    | \033[0;34m | Blue | \033[1;34m | Light Blue |

    | \033[0;35m | Purple | \033[1;35m | Light Purple |

    | \033[0;36m | Cyan | \033[1;36m | Light Cyan |

    | \033[0;37m | Light Grey | \033[1;37m | White |


    Let''s try to make a red prompt. We''ll insert the escape code at the beginning:'
  merge: -1
  img_proc: true
- pgno: 178
  md: '```

    <me@linuxbox ~>$ PS1="\[\033[0;31m\]<\u@\h \W\>$ "

    <me@linuxbox ~>$

    ```


    That works, but notice that all the text that we type after the prompt is also
    red. To fix this, we will add another escape code to the end of the prompt that
    tells the terminal emulator to return to the previous color:


    ```

    <me@linuxbox ~>$ PS1="\[\033[0;31m\]<\u@\h \W\>$\[\033[0m\] "

    <me@linuxbox ~>$

    ```


    That''s better!


    It''s also possible to set the text background color using the codes listed below.
    The background colors do not support the bold attribute.


    Table 14-3: Escape Sequences Used To Set Background Color


    | Sequence | Background Color | Sequence | Background Color |

    |---|---|---|---|

    | \033[0;40m | Black | \033[0;44m | Blue |

    | \033[0;41m | Red | \033[0;45m | Purple |

    | \033[0;42m | Green | \033[0;46m | Cyan |

    | \033[0;43m | Brown | \033[0;47m | Light Grey |


    We can create a prompt with a red background by applying a simple change to the
    first escape code:


    ```

    <me@linuxbox ~>$ PS1="\[\033[0;41m\]<\u@\h \W\>$\[\033[0m\] "

    <me@linuxbox ~>$

    ```


    Try out the color codes and see what you can create!


    > Note: Besides the normal (0) and bold (1) character attributes, text may also
    be given underscore (4), blinking (5), and inverse (7) attributes as well. In
    the interests of good taste, many terminal emulators refuse to honor the blinking
    attribute, however.'
  merge: -1
