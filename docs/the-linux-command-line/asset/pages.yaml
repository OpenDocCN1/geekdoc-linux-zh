    | mv -i file1 file2 | Same as above, except that if file2 exists, the user is
    prompted before it is overwritten. |

    | mv file1 file2 dir1 | Move file1 and file2 into directory dir1. dir1 must already
    exist. |

    | mv dir1 dir2 | If directory dir2 does not exist, create directory dir2 and move
    the contents of directory dir1 into dir2 and delete directory dir1.

    If directory dir2 does exist, move directory dir1 (and its contents) into directory
    dir2. |


    # rm – Remove Files And Directories


    The rm command is used to remove (delete) files and directories:


    ```

    rm item...

    ```


    where “item” is one or more files or directories.


    # Useful Options And Examples


    Here are some of the common options for rm:


    # Table 5-8: rm Options


    | Option | Meaning |

    |---|---|

    | -i, --interactive | Before deleting an existing file, prompt the user for confirmation.
    If this option is not specified, rm will silently delete files. |'
  merge: -1
  img_proc: true
- pgno: 51
  md: '| -r, --recursive | Recursively delete directories. This means that if a directory
    being deleted has subdirectories, delete them too. To delete a directory, this
    option must be specified. |

    | -f, --force | Ignore nonexistent files and do not prompt. This overrides the
    --interactive option. |

    | -v, --verbose | Display informative messages as the deletion is performed. |


    Table 5-9: rm Examples


    | Command | Results |

    | rm file1 | Delete file1 silently. |

    | rm -i file1 | Same as above, except that the user is prompted for confirmation
    before the deletion is performed. |

    | rm -r file1 dir1 | Delete file1 and dir1 and its contents. |

    | rm -rf file1 dir1 | Same as above, except that if either file1 or dir1 do not
    exist, rm will continue silently. |


    # Be Careful With rm!


    Unix-like operating systems such as Linux do not have an undelete command. Once
    you delete something with rm, it''s gone. Linux assumes you''re smart and you
    know what you''re doing.


    Be particularly careful with wildcards. Consider this classic example. Let''s
    say you want to delete just the HTML files in a directory. To do this, you type:


    rm *.html


    which is correct, but if you accidentally place a space between the "*" and the
    ".html" like so:


    rm * .html


    the rm command will delete all the files in the directory and then complain that
    there is no file called ".html".'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'Here is a useful tip. Whenever you use wildcards with rm (besides carefully
    checking your typing!), test the wildcard first with ls. This will let you see
    the files that will be deleted. Then press the up arrow key to recall the command
    and replace the ls with rm.


    # ln – Create Links


    The ln command is used to create either hard or symbolic links. It is used in
    one of two ways:


    ```

    ln file link

    ```


    to create a hard link, and:


    ```

    ln -s item link

    ```


    to create a symbolic link where “item” is either a file or a directory.


    # Hard Links


    Hard links are the original Unix way of creating links, compared to symbolic links,
    which are more modern. By default, every file has a single hard link that gives
    the file its name. When we create a hard link, we create an additional directory
    entry for a file. Hard links have two important limitations:


    +   1. A hard link cannot reference a file outside its own file system. This means
    a link may not reference a file that is not on the same disk partition as the
    link itself.

    +   2. A hard link may not reference a directory.


    A hard link is indistinguishable from the file itself. Unlike a symbolic link,
    when you list a directory containing a hard link you will see no special indication
    of the link. When a hard link is deleted, the link is removed but the contents
    of the file itself continue to exist (that is, its space is not deallocated) until
    all links to the file are deleted.


    It is important to be aware of hard links because you might encounter them from
    time to time, but modern practice prefers symbolic links, which we will cover
    next.'
  merge: -1
  img_proc: true
