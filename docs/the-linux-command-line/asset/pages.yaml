- pgno: 362
  md: 'others, will supply the documentation files README, INSTALL, NEWS, and COPYING.
    These files contain the description of the program, information on how to build
    and install it, and its licensing terms. It is aways a good idea to carefully
    read the README and INSTALL files before attempting to build the program.


    The other interesting files in this directory are the ones ending with .c and
    .h:


    ```

    [me@linuxbox diction-1.11]$ ls *.c

    diction.c getopt.c getopt.c misc.c sentence.c style.c

    [me@linuxbox diction-1.11]$ ls *.h

    getopt.h getopt_int.h misc.h sentence.h

    ```


    The .c files contain the two C programs supplied by the package (style and diction),
    divided into modules. It is common practice for large programs to be broken into
    smaller, easier to manage pieces. The source code files are ordinary text and
    can be examined with less:


    ```

    [me@linuxbox diction-1.11]$ less diction.c

    ```


    The .h files are known as header files. These, too, are ordinary text. Header
    files contain descriptions of the routines included in a source code file or library.
    In order for the compiler to connect the modules, it must receive a description
    of all the modules needed to complete the entire program. Near the beginning of
    the diction.c file, we see this line:


    ```

    #include "getopt.h"

    ```


    This instructs the compiler to read the file getopt.h as it reads the source code
    in diction.c in order to “know” what’s in getopt.c. The getopt.c file supplies
    routines that are shared by both the style and diction programs.


    Above the include statement for getopt.h, we see some other include statements
    such as these:


    ```

    #include <regex.h>

    #include <stdio.h>

    #include <stdlib.h>

    #include <string.h>

    ```'
