    \ It's important to know how to use test, since it is very widely used, but [[\
    \ ]] is clearly more useful and is easier to code.\n\n# Portability Is The Hobgoblin\
    \ Of Little Minds\n\nIf you talk to “real” Unix people, you quickly discover that\
    \ many of them don’t like Linux very much. They regard it as impure and unclean.\
    \ One tenet of Unix followers is that everything should be “portable.” This means\
    \ that any script you write should be able to run, unchanged, on any Unix-like\
    \ system.\n\nUnix people have good reason to believe this. Having seen what proprietary\
    \ extensions to commands and shells did to the Unix world before POSIX, they are\
    \ naturally wary of the effect of Linux on their beloved OS.\n\nBut portability\
    \ has a serious downside. It prevents progress. It requires that things are always\
    \ done using “lowest common denominator” techniques. In the case of shell programming,\
    \ it means making everything compatible with sh, the original Bourne shell.\n\n\
    This downside is the excuse that proprietary vendors use to justify their proprietary\
    \ extensions, only they call them “innovations.” But they are really just lock-in\
    \ devices for their customers.\n\nThe GNU tools, such as bash, have no such restrictions.\
    \ They encourage portability by supporting standards and by being universally\
    \ available. You can install bash and the other GNU tools on almost any kind of\
    \ system, even Windows, without cost. So feel free to use all the features of\
    \ bash. It’s really portable."
