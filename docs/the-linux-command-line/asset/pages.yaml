  md: '# 3 – Navigation


    The first thing we need to learn to do (besides just typing) is how to navigate
    the file system on our Linux system. In this chapter we will introduce the following
    commands:


    +   - pwd - Print name of current working directory

    +   - cd - Change directory

    +   - ls - List directory contents


    # Understanding The File System Tree


    Like Windows, a Unix-like operating system such as Linux organizes its files in
    what is called a hierarchical directory structure. This means that they are organized
    in a tree-like pattern of directories (sometimes called folders in other systems),
    which may contain files and other directories. The first directory in the file
    system is called the root directory. The root directory contains files and subdirectories,
    which contain more files and subdirectories and so on and so on.


    Note that unlike Windows, which has a separate file system tree for each storage
    device, Unix-like systems such as Linux always have a single file system tree,
    regardless of how many drives or storage devices are attached to the computer.
    Storage devices are attached (or more correctly, mounted) at various points on
    the tree according to the whims of the system administrator, the person (or persons)
    responsible for the maintenance of the system.


    # The Current Working Directory


    Most of us are probably familiar with a graphical file manager which represents
    the file system tree as in Figure 1. Notice that the tree is usually shown upended,
    that is, with the root at the top and the various branches descending below.


    However, the command line has no pictures, so to navigate the file system tree
    we need to think of it in a different way.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'Imagine that the file system is a maze shaped like an upside-down tree and
    we are able to


    ![](img/a46aa7daacc8e16f7545c9756b3bf128_28_0.png)


    Figure 1: File system tree as shown by a graphical file manager


    stand in the middle of it. At any given time, we are inside a single directory
    and we can see the files contained in the directory and the pathway to the directory
    above us (called the parent directory) and any subdirectories below us. The directory
    we are standing in is called the current working directory. To display the current
    working directory, we use the pwd (print working directory) command.


    ```

    [me@linuxbox ~]$ pwd

    /home/me

    ```


    When we first log in to our system (or start a terminal emulator session) our
    current working directory is set to our home directory. Each user account is given
    its own home directory and when operating as a regular user, the home directory
    is the only place the user is allowed to write files.


    # Listing The Contents Of A Directory


    To list the files and directories in the current working directory, we use the
    ls command.


    ```

    [me@linuxbox ~]$ ls

    Desktop  Documents  Music  Pictures  Public  Templates  Videos

    ```'
