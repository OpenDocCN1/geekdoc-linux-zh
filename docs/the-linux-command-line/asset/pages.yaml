- pgno: 473
  md: '# Expansions That Return Variable Names


    The shell has the ability to return the names of variables. This is used in some
    rather exotic situations.


    `${!prefix*}`

    `${!prefix@}`


    This expansion returns the names of existing variables with names beginning with
    *prefix*. According to the bash documentation, both forms of the expansion perform
    identically. Here, we list all the variables in the environment with names that
    begin with BASH:


    ```

    ```bash

    [me@linuxbox ~]$ echo ${!BASH*}

    BASH BASH_ARGC BASH_ARGV BASH_COMMAND BASH_COMPLETION

    BASH_COMPLETION_DIR BASH_LINENO BASH_SOURCE BASH_SUBSHELL

    BASH_VERSIONINFO BASH_VERSION

    ```

    ```


    # String Operations


    There is a large set of expansions that can be used to operate on strings. Many
    of these expansions are particularly well-suited for operations on pathnames.


    `${#parameter}`


    Expands into the length of the string contained by *parameter*. Normally, *parameter*
    is a string; however, if *parameter* is either @ or *, then the expansion results
    in the number of positional parameters.


    ```

    ```bash

    [me@linuxbox ~]$ foo="This string is long."

    [me@linuxbox ~]$ echo "$foo" is ${#foo} characters long.

    ''This string is long.'' is 20 characters long.

    ```

    ```


    `${parameter:offset}`

    `${parameter:offset:length}`


    This expansion is used to extract a portion of the string contained in *parameter*.
    The extraction begins at *offset* characters from the beginning of the string
    and continues until the end of the string unless the *length* is specified.


    ```

    ```bash

    [me@linuxbox ~]$ foo="This string is long."

    [me@linuxbox ~]$ echo ${foo:5}

    string is long.

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 474
  md: '```

    [me@linuxbox ~]$ echo ${foo:5:6}

    string

    ```


    If the value of offset is negative, it is taken to mean it starts from the end
    of the string rather than the beginning. Note that negative values must be preceded
    by a space to prevent confusion with the ${parameter:-word} expansion. length,
    if present, must not be less than zero.


    If parameter is @, the result of the expansion is length positional parameters,
    starting at offset.


    ```

    [me@linuxbox ~]$ foo="This string is long."

    [me@linuxbox ~]$ echo ${foo: -5}

    long.

    [me@linuxbox ~]$ echo ${foo: -5:2}

    lo

    ```


    # ${parameter#pattern}

    ${parameter##pattern}


    This expansion removes a leading portion of the string contained in parameter
    defined by pattern. pattern is a wildcard pattern like those used in pathname
    expansion. The difference in the two forms is that the # form removes the shortest
    match, while the ## form removes the longest match.


    ```

    [me@linuxbox ~]$ foo=file.txt.zip

    [me@linuxbox ~]$ echo ${foo#*.}

    txt.zip

    [me@linuxbox ~]$ echo ${foo##*.}

    zip

    ```


    # ${parameter%pattern}

    ${parameter%%pattern}


    These expansions are the same as the # and ## expansions above, except they remove
    text from the end of the string contained in parameter rather than from the beginning.


    ```

    [me@linuxbox ~]$ foo=file.txt.zip

    [me@linuxbox ~]$ echo ${foo%.*}

    file.txt

    [me@linuxbox ~]$ echo ${foo%%.*}

    ```'
  merge: -1
  img_proc: true
