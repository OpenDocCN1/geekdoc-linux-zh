    everyone else only gets read permission. The reason that world does not have write
    permission is because of the value of the mask. Let''s repeat our example, this
    time setting the mask ourselves:


    ```

    [me@linuxbox ~]$ rm foo.txt

    [me@linuxbox ~]$ umask 0000

    [me@linuxbox ~]$ > foo.txt

    [me@linuxbox ~]$ ls -l foo.txt

    -rw-rw-rw- 1 me me 0 2008-03-06 14:58 foo.txt

