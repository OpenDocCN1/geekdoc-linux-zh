- pgno: 378
  md: "# 26 – Starting A Project\n\nStarting with this chapter, we will begin to build\
    \ a program. The purpose of this project is to see how various shell features\
    \ are used to create programs and, more importantly, create good programs.\n\n\
    The program we will write is a report generator. It will present various statistics\
    \ about our system and its status, and will produce this report in HTML format,\
    \ so we can view it with a web browser such as Firefox or Konqueror.\n\nPrograms\
    \ are usually built up in a series of stages, with each stage adding features\
    \ and capabilities. The first stage of our program will produce a very minimal\
    \ HTML page that contains no system information. That will come later.\n\n# First\
