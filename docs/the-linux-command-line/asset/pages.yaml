- pgno: 418
  md: "| -s | Silent mode. Do not echo characters to the display as they are typed.\
    \ This is useful when inputting passwords and other confidential information.\
    \ |\n| -t seconds | Timeout. Terminate input after seconds. read returns a non-zero\
    \ exit status if an input times out. |\n| -u fd | Use input from file descriptor\
    \ fd, rather than standard input. |\n\nUsing the various options, we can do interesting\
    \ things with read. For example, with the -p option, we can provide a prompt string:\n\
    \n```\n#!/bin/bash\n\n# read-single: read multiple values into default variable\n\
    \nread -p \"Enter one or more values > \"\n\necho \"REPLY = '$REPLY'\"\n```\n\n\
    With the -t and -s options we can write a script that reads “secret” input and\
    \ times out if the input is not completed in a specified time:\n\n```\n#!/bin/bash\n\
    \n# read-secret: input a secret pass phrase\n\nif read -t 10 -sp \"Enter secret\
    \ pass phrase > \" secret_pass; then\n    echo -e \"\\nSecret pass phrase = '$secret_pass'\"\
    \nelse\n    echo -e \"\\nInput timed out\" >&2\n    exit 1\nfi\n```\n\nThe script\
    \ prompts the user for a secret pass phrase and waits ten seconds for input. If\
    \ the entry is not completed within the specified time, the script exits with\
    \ an error. Since the -s option is included, the characters of the pass phrase\
    \ are not echoed to the display as they are typed."
  merge: -1
  img_proc: true
