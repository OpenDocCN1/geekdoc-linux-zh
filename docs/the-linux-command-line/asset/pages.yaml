  md: "standard error we must refer to its *file descriptor*. A program can produce\
    \ output on any of several numbered file streams. While we have referred to the\
    \ first three of these file streams as standard input, output and error, the shell\
    \ references them internally as file descriptors zero, one and two, respectively.\
    \ The shell provides a notation for redirecting files using the file descriptor\
    \ number. Since standard error is the same as file descriptor number two, we can\
    \ redirect standard error with this notation:\n\n```\n[me@linuxbox ~]$ ls -l /bin/usr\
    \ 2> ls-error.txt\n```\n\nThe file descriptor “2” is placed immediately before\
    \ the redirection operator to perform the redirection of standard error to the\
    \ file ls-error.txt.\n\n# Redirecting Standard Output And Standard Error To One\
    \ File\n\nThere are cases in which we may wish to capture all of the output of\
    \ a command to a single file. To do this, we must redirect both standard output\
    \ and standard error at the same time. There are two ways to do this. First, the\
    \ traditional way, which works with old versions of the shell:\n\n```\n[me@linuxbox\
    \ ~]$ ls -l /bin/usr > ls-output.txt 2>&1\n```\n\nUsing this method, we perform\
    \ two redirections. First we redirect standard output to the file ls-output.txt\
    \ and then we redirect file descriptor two (standard error) to file descriptor\
    \ one (standard output) using the notation 2>&1.\n\n> **Notice that the order\
    \ of the redirections is significant.** The redirection of standard error must\
    \ always occur *after* redirecting standard output or it doesn’t work. In the\
    \ example above,\n> \n> >ls-output.txt 2>&1\n> \n> redirects standard error to\
    \ the file ls-output.txt, but if the order is changed to\n> \n> 2>&1 >ls-output.txt\n\
    > \n> standard error is directed to the screen.\n\nRecent versions of bash provide\
    \ a second, more streamlined method for performing this"
