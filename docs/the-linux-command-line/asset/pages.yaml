- pgno: 284
  md: '# MS-DOS Text Vs. Unix Text


    One of the reasons you may want to use cat to look for non-printing characters
    in text is to spot hidden carriage returns. Where do hidden carriage returns come
    from? DOS and Windows! Unix and DOS don’t define the end of a line the same way
    in text files. Unix ends a line with a linefeed character (ASCII 10) while MS-DOS
    and its derivatives use the sequence carriage return (ASCII 13) and linefeed to
    terminate each line of text.


    There are several ways to convert text files from DOS to Unix format. On many
    Linux systems, there are programs called dos2unix and unix2dos, which can convert
    text files to and from DOS format. However, if you don’t have dos2unix on your
    system, don’t worry. The process of converting text from DOS to Unix format is
    very simple; it simply involves the removal of the offending carriage returns.
    That is easily accomplished by a couple of the programs discussed later in this
    chapter.


    cat also has options that are used to modify text. The two most prominent are
    -n, which numbers lines, and -s, which suppresses the output of multiple blank
    lines. We can demonstrate thusly:


    ```

    [me@linuxbox ~]$ cat > foo.txt

    The quick brown fox


    jumped over the lazy dog.

    [me@linuxbox ~]$ cat -ns foo.txt

    1       The quick brown fox

    2

    3       jumped over the lazy dog.

    [me@linuxbox ~]$

    ```


    In this example, we create a new version of our foo.txt test file, which contains
    two lines of text separated by two blank lines. After processing by cat with the
    -ns options, the extra blank line is removed and the remaining lines are numbered.
    While this is not much of a process to perform on text, it is a process.


    # sort


    The sort program sorts the contents of standard input, or one or more files specified
    on the command line, and sends the results to standard output. Using the same
    technique'
  merge: -1
  img_proc: true
