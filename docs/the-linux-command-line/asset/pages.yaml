- pgno: 429
  md: "```\necho \"Home Space Utilization ($USER)\"\n    du -sh $HOME\nfi\nsleep $DELAY\n\
    continue\nfi\nif [[ $REPLY == 0 ]]; then\n    break\nfi\nelse\n    echo \"Invalid\
    \ entry.\"\n    sleep $DELAY\nfi\ndone\necho \"Program terminated.\"\n```\n\n\
    In this version of the script, we set up an endless loop (one that never terminates\
    \ on its own) by using the true command to supply an exit status to while. Since\
    \ true will always exit with an exit status of zero, the loop will never end.\
    \ This is a surprisingly common scripting technique. Since the loop will never\
    \ end on its own, it's up to the programmer to provide some way to break out of\
    \ the loop when the time is right. In this script, the break command is used to\
    \ exit the loop when the \"0\" selection is chosen. The continue command has been\
    \ included at the end of the other script choices to allow for more efficient\
    \ execution. By using continue, the script will skip over code that is not needed\
    \ when a selection is identified. For example, if the \"1\" selection is chosen\
    \ and identified, there is no reason to test for the other selections.\n\n# until\n\
    \nThe until command is much like while, except instead of exiting a loop when\
    \ a non-zero exit status is encountered, it does the opposite. An until loop continues\
    \ until it receives a zero exit status. In our while-count script, we continued\
    \ the loop as long as the value of the count variable was less than or equal to\
    \ five. We could get the same result by coding the script with until:\n\n```\n\
    #!/bin/bash\n\n# until-count: display a series of numbers\n\ncount=1\n\nuntil\
    \ [ $count -gt 5 ]; do\n    echo $count\n```"
