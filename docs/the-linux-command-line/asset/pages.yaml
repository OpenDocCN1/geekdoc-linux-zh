    Let''s break this command down into separate items and see what each one does:


    | Item | Meaning |

    |------|---------|

    | : | The colon character starts an ex command. |

    | % | Specifies the range of lines for the operation. % is a shortcut meaning
    from the first line to the last line. Alternately, the range could have been specified
    1, 5 (since our file is five lines long), or 1, $ which means “from line 1 to
    the last line in the file.” If the range of lines is omitted, the operation is
    only |'
