  md: "```\n```sh\nfunct_1\necho \"global:  foo = $foo\"\nfunct_2\necho \"global:\
    \  foo = $foo\"\n```\n```\n\nAs we can see, local variables are defined by preceding\
    \ the variable name with the word `local`. This creates a variable that is local\
    \ to the shell function in which it is defined. Once outside the shell function,\
    \ the variable no longer exists. When we run this script, we see the results:\n\
    \n```\n```text\n[me@linuxbox ~]$ local-vars\nglobal:  foo = 0\nfunct_1: foo =\
    \ 1\nglobal:  foo = 0\nfunct_2: foo = 2\nglobal:  foo = 0\n```\n```\n\nWe see\
    \ that the assignment of values to the local variable `foo` within both shell\
    \ functions has no effect on the value of `foo` defined outside the functions.\n\
    \nThis feature allows shell functions to be written so that they remain independent\
    \ of each other and of the script in which they appear. This is very valuable,\
    \ as it helps prevent one part of a program from interfering with another. It\
    \ also allows shell functions to be written so that they can be portable. That\
    \ is, they may be cut and pasted from script to script, as needed.\n\n# Keep Scripts\
    \ Running\n\nWhile developing our program, it is useful to keep the program in\
    \ a runnable state. By doing this, and testing frequently, we can detect errors\
    \ early in the development process. This will make debugging problems much easier.\
    \ For example, if we run the program, make a small change, then run the program\
    \ again and find a problem, it’s very likely that the most recent change is the\
    \ source of the problem. By adding the empty functions, called stubs in programmer-speak,\
    \ we can verify the logical flow of our program at an early stage. When constructing\
    \ a stub, it’s a good idea to include something that provides feedback to the\
    \ programmer, which shows the logical flow is being carried out. If we look at\
    \ the output of our script now:\n\n```\n```text\n[me@linuxbox ~]$ sys_info_page\n\
    <HTML>\n        <HEAD>\n```\n```"
