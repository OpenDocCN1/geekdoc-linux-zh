- pgno: 120
  md: '# Ubuntu And sudo


    One of the recurrent problems for regular users is how to perform certain tasks
    that require superuser privileges. These tasks include installing and updating
    software, editing system configuration files, and accessing devices. In the Windows
    world, this is often done by giving users administrative privileges. This allows
    users to perform these tasks. However, it also enables programs executed by the
    user to have the same abilities. This is desirable in most cases, but it also
    permits malware (malicious software) such as viruses to have free reign of the
    computer.


    In the Unix world, there has always been a larger division between regular users
    and administrators, owing to the multi-user heritage of Unix. The approach taken
    in Unix is to grant superuser privileges only when needed. To do this, the su
    and sudo commands are commonly used.


    Up until a couple of years ago, most Linux distributions relied on su for this
    purpose. su didn’t require the configuration that sudo required, and having a
    root account is traditional in Unix. This introduced a problem. Users were tempted
    to operate as root unnecessarily. In fact, some users operated their systems as
    the root user exclusively, since it does away with all those annoying “permission
    denied” messages. This is how you reduce the security of a Linux system to that
    of a Windows system. Not a good idea.


    When Ubuntu was introduced, its creators took a different tack. By default, Ubuntu
    disables logins to the root account (by failing to set a password for the account),
    and instead uses sudo to grant superuser privileges. The initial user account
    is granted full access to superuser privileges via sudo and may grant similar
    powers to subsequent user accounts.


    # chown – Change File Owner And Group


    The chown command is used to change the owner and group owner of a file or directory.
    Superuser privileges are required to use this command. The syntax of chown looks
    like this:'
  merge: -1
  img_proc: true
- pgno: 121
  md: '```

    chown [owner][: [group]] file...

    ```


    chown can change the file owner and/or the file group owner depending on the first
    argument of the command. Here are some examples:


    Table 10-6: chown Argument Examples


    | Argument | Results |

    |---|---|

    | bob | Changes the ownership of the file from its current owner to user bob.
    |

    | bob:users | Changes the ownership of the file from its current owner to user
    bob and changes the file group owner to group users. |

    | :admins | Changes the group owner to the group admins. The file owner is unchanged.
    |

    | bob: | Change the file owner from the current owner to user bob and changes
    the group owner to the login group of user bob. |


    Let''s say that we have two users; janet, who has access to superuser privileges
    and tony, who does not. User janet wants to copy a file from her home directory
    to the home directory of user tony. Since user janet wants tony to be able to
    edit the file, janet changes the ownership of the copied file from janet to tony:


    ```

    [janet@linuxbox ~]$ sudo cp myfile.txt ~tony

    Password:

    [janet@linuxbox ~]$ sudo ls -l ~tony/myfile.txt

    -rw-r--r-- 1 root root 8031 2008-03-20 14:30 /home/tony/myfile.txt

    [janet@linuxbox ~]$ sudo chown tony: ~tony/myfile.txt

    [janet@linuxbox ~]$ sudo ls -l ~tony/myfile.txt

    -rw-r--r-- 1 tony tony 8031 2008-03-20 14:30 /home/tony/myfile.txt

    ```


    Here we see user janet copy the file from his directory to the home directory
    of user tony. Next, janet changes the ownership of the file from root (a result
    of using sudo) to tony. Using the trailing colon in the first argument, janet
    also changed the group ownership of the file to the login group of tony, which
    happens to be group tony.


    Notice that after the first use of sudo, janet was not prompted for her password?
    This is because sudo, in most configurations, “trusts” you for several minutes
    until its timer'
