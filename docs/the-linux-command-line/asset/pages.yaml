- pgno: 357
  md: '# 24 – Compiling Programs


    In this chapter, we will look at how to build programs by compiling source code.
    The availability of source code is the essential freedom that makes Linux possible.
    The entire ecosystem of Linux development relies on free exchange between developers.
    For many desktop users, compiling is a lost art. It used to be quite common, but
    today, distribution providers maintain huge repositories of pre-compiled binaries,
    ready to download and use. At the time of this writing, the Debian repository
    (one of the largest of any of the distributions) contains almost twenty-three
    thousand packages.


    So why compile software? There are two reasons:


    +   1. **Availability.** Despite the number of pre-compiled programs in distribution
    repositories, some distributions may not include all the desired applications.
    In this case, the only way to get the desired program is to compile it from source.

    +   2. **Timeliness.** While some distributions specialize in cutting edge versions
    of programs, many do not. This means that in order to have the very latest version
    of a program, compiling is necessary.


    Compiling software from source code can become very complex and technical; well
    beyond the reach of many users. However, many compiling tasks are quite easy and
    involve only a few steps. It all depends on the package. We will look at a very
    simple case in order to provide an overview of the process and as a starting point
    for those who wish to undertake further study.


    We will introduce one new command:


    +   - `make` – Utility To Maintain Programs


    # What Is Compiling?


    Simply put, compiling is the process of translating *source code* (the human-readable
    description of a program written by a programmer) into the native language of
    the computer’s processor.


    The computer’s processor (or *CPU*) works at a very elemental level, executing
    programs in what is called *machine language*. This is a numeric code that describes
    very small operations, such as “add this byte,” “point to this location in memory,”
    or “copy this'
  merge: -1
  img_proc: true
- pgno: 358
  md: 'byte.” Each of these instructions is expressed in binary (ones and zeros).
    The earliest computer programs were written using this numeric code, which may
    explain why programmers who wrote it were said to smoke a lot, drink gallons of
    coffee, and wear thick glasses.


    This problem was overcome by the advent of assembly language, which replaced the
    numeric codes with (slightly) easier to use character mnemonics such as CPY (for
    copy) and MOV (for move). Programs written in assembly language are processed
    into machine language by a program called an assembler. Assembly language is still
    used today for certain specialized programming tasks, such as device drivers and
    embedded systems.


    We next come to what are called, high-level programming languages. They are called
    this because they allow the programmer to be less concerned with the details of
    what the processor is doing and more with solving the problem at hand. The early
    ones (developed during the 1950s) included Fortran (designed for scientific and
    technical tasks) and COBOL (designed for business applications). Both are still
    in limited use today.


    While there are many popular programming languages, two predominate. Most programs
    written for modern systems are written in either C or C++. In the examples to
    follow, we will be compiling a C program.


    Programs written in high-level programming languages are converted into machine
    language by processing them with another program, called a compiler. Some compilers
    translate high-level instructions into assembly language and then use an assembler
    to perform the final stage of translation into machine language.


    A process often used in conjunction with compiling is called linking. There are
    many common tasks performed by programs. Take, for instance, opening a file. Many
    programs perform this task, but it would be wasteful to have each program implement
    its own routine to open files. It makes more sense to have a single piece of programming
    that knows how to open files and to allow all programs that need it to share it.
    This is accomplished by what are called libraries. They contain multiple routines,
    each performing some common task that multiple programs can share. If we look
    in the /lib and /usr/lib directories, we can see where many of them live. A program
    called a linker is used to form the connections between the output of the compiler
    and the libraries that the compiled program requires. The final result of this
    process is the executable program file, ready for use.


    # Are All Programs Compiled?


    No. As we have seen, there are programs such as shell scripts that do not require
    compiling. They are executed directly. These are written in what are known as
    scripting or interpreted languages. These languages have grown in popularity in
    recent years and'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'include Perl, Python, PHP, Ruby and many others.


    Scripted languages are executed by a special program called an interpreter. An
    interpreter inputs the program file and reads and executes each instruction contained
    within it. In general, interpreted programs execute much more slowly than compiled
    programs. This is due to the fact that each source code instruction in an interpreted
    program is translated every time it is carried out, whereas with a compiled program,
    a source code instruction is only translated once, and this translation is permanently
    recorded in the final executable file.


    So why are interpreted languages so popular? For many programming chores, the
    results are “fast enough,” but the real advantage is that it is generally faster
    and easier to develop interpreted programs than compiled programs. Programs are
    usually developed in a repeating cycle of code, compile, test. As a program grows
    in size, the compilation phase of the cycle can become quite long. Interpreted
    languages remove the compilation step and thus speed up program development.


    # Compiling A C Program


    Let’s compile something. Before we do that however, we’re going to need some tools
    like the compiler, linker, and make. The C compiler used almost universally in
    the Linux environment is called gcc (GNU C Compiler), originally written by Richard
    Stallman. Most distributions do not install gcc by default. We can check to see
    if the compiler is present like this:


    ```

    [me@linuxbox ~]$ which gcc

    /usr/bin/gcc

    ```


    The results in this example indicate that the compiler is installed.


    > Tip: Your distribution may have a meta-package (a collection of packages) for
    software development. If so, consider installing it if you intend to compile programs
    on your system. If your system does not provide a meta-package, try installing
    the gcc and make packages. On many distributions, this is sufficient to carry
    out the exercise below.


    # Obtaining The Source Code


    For our compiling exercise, we are going to compile a program from the GNU Project
    called diction. This is a handy little program that checks text files for writing
    quality and style. As programs go, it is fairly small and easy to build.'
  merge: -1
  img_proc: true
- pgno: 360
