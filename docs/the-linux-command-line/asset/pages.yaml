- pgno: 179
  md: '# Moving The Cursor


    Escape codes can be used to position the cursor. This is commonly used to provide
    a clock or some other kind of information at a different location on the screen
    such as an upper corner each time the prompt is drawn. Here is a list of the escape
    codes that position the cursor:


    Table 14-4: Cursor Movement Escape Sequences


    | Escape Code | Action |

    |---|---|

    | \033[ l ; c H | Move the cursor to line l and column c. |

    | \033[ n A | Move the cursor up n lines. |

    | \033[ n B | Move the cursor down n lines. |

    | \033[ n C | Move the cursor forward n characters. |

    | \033[ n D | Move the cursor backward n characters. |

    | \033[ 2 J | Clear the screen and move the cursor to the upper left corner (line
    0, column 0). |

    | \033[ K | Clear from the cursor position to the end of the current line. |

    | \033[ s | Store the current cursor position. |

    | \033[ u | Recall the stored cursor position. |


    Using the codes above, we''ll construct a prompt that draws a red bar at the top
    of the screen containing a clock (rendered in yellow text) each time the prompt
    is displayed. The code for the prompt is this formidable looking string:


    ```

    PS1="\033[s\033[0;0H\033[0;41m\033[K\033[1;33m\t\033[0m\033[u\<\u@\h \w>$ "

    ```


    Let''s take a look at each part of the string to see what it does:


    | Sequence | Action |

    |---|---|

    | \[ | Begins a non-printing character sequence. The real purpose of this is to
    allow bash to correctly calculate the size of the visible prompt. Without this,
    command line editing features will improperly position the cursor. |

    | \033[s | Store the cursor position. This is needed to return to the prompt |'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'location after the bar and clock have been drawn at the top of the screen.
    *Be aware that some terminal emulators do not honor this code.*


    |  |  |

    |---|---|

    | \033[0;0H | Move the cursor to the upper left corner, which is line zero, column
    zero. |

    | \033[0;41m | Set the background color to red. |

    | \033[K | Clear from the current cursor location (the top left corner) to the
    end of the line. Since the background color is now red, the line is cleared to
    that color creating our bar. Note that clearing to the end of the line does not
    change the cursor position, which remains at the upper left corner. |

    | \033[1;33m | Set the text color to yellow. |

    | \t | Display the current time. While this is a “printing” element, we still
    include it in the non-printing portion of the prompt, since we don’t want bash
    to include the clock when calculating the true size of the displayed prompt. |

    | \033[0m | Turn off color. This affects both the text and background. |

    | \033[u | Restore the cursor position saved earlier. |

    | \] | End non-printing characters sequence. |

    | <\u@\h \W>\$ | Prompt string. |


    # Saving The Prompt


    Obviously, we don’t want to be typing that monster all the time, so we’ll want
    to store our prompt someplace. We can make the prompt permanent by adding it to
    our .bashrc file. To do so, add these two lines to the file:


    ```

    PS1="[\033[s\033[0;0H\033[0;41m\033[K\033[1;33m\t\033[0m\033[u]\n<\u@\h \W>\$
    "

    export PS1

    ```


    # Summing Up


    Believe it or not, there is much more that can be done with prompts involving
    shell functions and scripts that we haven’t covered here, but this is a good start.
    Not everyone'
  merge: -1
