    \n| Operation | test | [[ ]] and (( )) |\n|-----------|------|-----------------|\n\
    | AND | -a | && |\n| OR | -o | || |\n| NOT | ! | ! |\n\nHere’s an example of an\
    \ AND operation. The following script determines if an integer is within a range\
    \ of values:\n\n```\n#!/bin/bash\n\n# test-integer3: determine if an integer is\
    \ within a\n# specified range of values.\n\nMIN_VAL=1\nMAX_VAL=100\n\nINT=50\n\
    \nif [[ \"$INT\" =~ ^-?[0-9]+$ ]]; then\n    if [[ INT -ge MIN_VAL && INT -le\
    \ MAX_VAL ]]; then\n        echo \"$INT is within $MIN_VAL to $MAX_VAL.\"\n  \
    \  else\n        echo \"$INT is out of range.\"\n    fi\nelse\n    echo \"INT\
