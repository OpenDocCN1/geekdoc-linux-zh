    always a good idea to create a backup copy of the file first. This protects us
    in case we mess the file up while editing. To create a backup of the .bashrc file,
    do this:


    ```

    [me@linuxbox ~]$ cp .bashrc .bashrc.bak

    ```


    It doesn’t matter what you call the backup file, just pick an understandable name.
    The extensions “.bak”, “.sav”, “.old”, and “.orig” are all popular ways of indicating
    a backup file. Oh, and remember that cp will overwrite existing files silently.'
