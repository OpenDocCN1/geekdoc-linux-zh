    # lftp – A Better ftp


    ftp is not the only command line FTP client. In fact, there are many. One of better
    (and more popular) ones is lftp by Alexander Lukyanov. It works much like the
    traditional ftp program, but has many additional convenience features including
    multiple protocol support (including HTTP), automatic re-try on failed downloads,
    background processes, tab completion of path names, and many more.


    # wget


    Another popular command line program for file downloading is wget. It is useful
    for downloading content from both web and FTP sites. Single files, multiple files,
    and even entire sites can be downloaded. To download the first page of linuxcommand.org
    we could do this:


    ```

    [me@linuxbox ~]$ wget http://linuxcommand.org/index.php

    --11:02:51--  http://linuxcommand.org/index.php

