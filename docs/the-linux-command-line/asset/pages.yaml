- pgno: 152
  md: '# Activating Our Changes


    The changes we have made to our .bashrc will not take affect until we close our
    terminal session and start a new one, since the .bashrc file is only read at the
    beginning of a session. However, we can force bash to re-read the modified .bashrc
    file with the following command:


    ```

    [me@linuxbox ~]$ source .bashrc

    ```


    After doing this, we should be able to see the effect of our changes. Try out
    one of the new aliases:


    ```

    [me@linuxbox ~]$ ll

    ```


    # Summing Up


    In this chapter we learned an essential skill—editing configuration files with
    a text editor. Moving forward, as we read man pages for commands, take note of
    the environment variables that commands support. There may be a gem or two. In
    later chapters, we will learn about shell functions, a powerful feature that you
    can also include in the bash startup files to add to your arsenal of custom commands.


    # Further Reading


    +   - The INVOCATION section of the bash man page covers the bash startup files
    in gory detail.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# 13 – A Gentle Introduction To vi


    There is an old joke about a visitor to New York City asking a passerby for directions
    to the city''s famous classical music venue:


    Visitor: Excuse me, how do I get to Carnegie Hall?

    Passerby: Practice, practice, practice!


    Learning the Linux command line, like becoming an accomplished pianist, is not
    something that we pick up in an afternoon. It takes years of practice. In this
    chapter, we will introduce the vi (pronounced "vee eye") text editor, one of the
    core programs in the Unix tradition. vi is somewhat notorious for its difficult
    user interface, but when we see a master sit down at the keyboard and begin to
    "play," we will indeed be witness to some great art. We won''t become masters
    in this chapter, but when we are done, we will know how to play "chopsticks" in
    vi.


    # Why We Should Learn vi


    In this modern age of graphical editors and easy-to-use text-based editors such
    as nano, why should we learn vi? There are three good reasons:


    +   - vi is always available. This can be a lifesaver if we have a system with
    no graphical interface, such as a remote server or a local system with a broken
    X configuration. nano, while increasingly popular is still not universal. POSIX,
    a standard for program compatibility on Unix systems, requires that vi be present.

    +   - vi is lightweight and fast. For many tasks, it''s easier to bring up vi
    than it is to find the graphical text editor in the menus and wait for its multiple
    megabytes to load. In addition, vi is designed for typing speed. As we shall see,
    a skilled vi user never has to lift his or her fingers from the keyboard while
    editing.

    +   - We don''t want other Linux and Unix users to think we are sissies.


    Okay, maybe two good reasons.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# A Little Background


    The first version of vi was written in 1976 by Bill Joy, a University of California
    at Berkley student who later went on to co-found Sun Microsystems. vi derives
    its name from the word “visual,” because it was intended to allow editing on a
    video terminal with a moving cursor. Previous to visual editors, there were line
    editors which operated on a single line of text at a time. To specify a change,
    we tell a line editor to go to a particular line and describe what change to make,
    such as adding or deleting text. With the advent of video terminals (rather than
    printer-based terminals like teletypes) visual editing became possible. vi actually
    incorporates a powerful line editor called ex, and we can use line editing commands
    while using vi.


    Most Linux distributions don’t include real vi; rather, they ship with an enhanced
    replacement called vim (which is short for “vi improved”) written by Bram Moolenaar.
    vim is a substantial improvement over traditional Unix vi and is usually symbolically
    linked (or aliased) to the name “vi” on Linux systems. In the discussions that
    follow, we will assume that we have a program called “vi” that is really vim.


    # Starting And Stopping vi


    To start vi, we simply type the following:


    ```

    [me@linuxbox ~]$ vi

    ```


    And a screen like this should appear:


    ```

    - -

    - -

    -                 VIM - Vi Improved

    - -

    -                     version 7.1.138

    -                     by Bram Moolenaar et al.

    -                 Vim is open source and freely distributable

    - -

    -                     Sponsor Vim development!

    - -         type  :help sponsor<Enter>      for information

    - -         type  :q<Enter>                 to exit

    - -         type  :help<Enter>  or  <F1>    for on-line help

    - -         type  :help version?<Enter>     for version info

    - -

    -                     Running in Vi compatible mode

    - -         type  :set nocompatible<Enter>  for Vim defaults

    ```'
  merge: -1
  img_proc: true
