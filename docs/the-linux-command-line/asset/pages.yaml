- pgno: 330
  md: '# pr – Format Text For Printing


    The pr program is use to paginate text. When printing text, it is often desirable
    to separate the pages of output with several lines of whitespace, to provide a
    top and bottom margin for each page. Further, this whitespace can be used to insert
    a header and footer on each page.


    We’ll demonstrate pr by formatting our distros.txt file into a series of very
    short pages (only the first two pages shown):


    ```

    [me@linuxbox ~]$ pr -l 15 -w 65 distros.txt


    2008-12-11 18:27                 distros.txt                 Page 1


    SUSE      10.2   12/07/2006

    Fedora    10     11/25/2008

    SUSE      11.0   06/19/2008

    Ubuntu    8.04   04/24/2008

    Fedora    8      11/08/2007


    2008-12-11 18:27                 distros.txt                 Page 2


    SUSE      10.3   10/04/2007

    Ubuntu    6.10   10/26/2006

    Fedora    7      05/31/2007

    Ubuntu    7.10   10/18/2007

    Ubuntu    7.04   04/19/2007

    ```


    In this example, we employ the -l option (for page length) and the -w option (page
    width) to define a “page” that is sixty-five columns wide and fifteen lines long.
    pr paginates the contents of the distros.txt file, separates each page with several
    lines of whitespace and creates a default header containing the file modification
    time, filename, and page number. The pr program provides many options to control
    page layout. We’ll take a look at more of them in the next chapter.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# printf – Format And Print Data


    Unlike the other commands in this chapter, the printf command is not used for
    pipelines (it does not accept standard input) nor does it find frequent application
    directly on the command line (it''s mostly used in scripts). So why is it important?
    Because it is so widely used.


    printf (from the phrase, “print formatted”) was originally developed for the C
    programming language and has been implemented in many programming languages including
    the shell. In fact, in bash, printf is a builtin.


    printf works like this:


    printf "format" arguments


    The command is given a string containing a format description which is then applied
    to a list of arguments. The formatted result is sent to standard output. Here
    is a trivial example:


    ```

    [me@linuxbox ~]$ printf "I formatted the string: %s\n" foo

    I formatted the string: foo

    ```


    The format string may contain literal text (like “I formatted the string:”), escape
    sequences (such as \n, a newline character), and sequences beginning with the
    % character, which are called conversion specifications. In the example above,
    the conversion specification %s is used to format the string “foo” and place it
    in the command’s output. Here it is again:


    ```

    [me@linuxbox ~]$ printf "I formatted ''%s'' as a string.\n" foo

    I formatted ''foo'' as a string.

    ```


    As we can see, the %s conversion specification is replaced by the string “foo”
    in the command’s output. The s conversion is used to format string data. There
    are other specifiers for other kinds of data. This table lists the commonly used
    data types:


    Table 22-4: Common printf Data Type Specifiers


    | Specifier | Description |

    |-----------|-------------|

    | d | Format a number as a signed decimal integer. |

    | f | Format and output a floating point number. |

    | o | Format an integer as an octal number. |'
  merge: -1
