    \   -not -perm 0711 \\\\\n        -exec chmod 0711 '{}' ';' \\\\\n    \\)\n```\n\
    ```\n\nBy using line continuations (backslash-linefeed sequences) and indentation,\
    \ the logic of this complex command is more clearly described to the reader. This\
    \ technique works on the command line, too, though it is seldom used, as it is\
