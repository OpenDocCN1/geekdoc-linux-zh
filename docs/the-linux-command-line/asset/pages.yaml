- pgno: 315
  md: '| UBUNTU | 6.06 | 2006-06-01 |

    | UBUNTU | 8.10 | 2008-10-30 |

    | FEDORA | 5 | 2006-03-20 |


    As we can see, our script produces the desired results, but how does is do it?
    Let’s take another look at our script. We’ll use cat to number the lines:


    ```

    [me@linuxbox ~]$ cat -n distros.sed

    1 # sed script to produce Linux distributions report

    2

    3 1 i\

    4 \

    5 Linux Distributions Report\

    6

    7 s/\([0-9]\{2\}\)\/\([0-9]\{2\}\)\/\([0-9]\{4\}\)$/\3-\1-\2/

    8 y/abcdefghijklmnopqrstuvwxyz/ABCDEFGHIJKLMNOPQRSTUVWXYZ/

    ```


    Line one of our script is a comment. Like many configuration files and programming
    languages on Linux systems, comments begin with the # character and are followed
    by human-readable text. Comments can be placed anywhere in the script (though
    not within commands themselves) and are helpful to any humans who might need to
    identify and/or maintain the script.


    Line two is a blank line. Like comments, blank lines may be added to improve readability.


    Many sed commands support line addresses. These are used to specify which lines
    of the input are to be acted upon. Line addresses may be expressed as single line
    numbers, line number ranges, and the special line number "$" which indicates the
    last line of input.


    Lines three through six contain text to be inserted at the address 1, the first
    line of the input. The i command is followed by the sequence backslash-carriage
    return to produce an escaped carriage return, or what is called a line continuation
    character. This sequence, which can be used in many circumstances including shell
    scripts, allows a carriage return to be embedded in a stream of text without signaling
    the interpreter (in this case sed) that the end of the line has been reached.
    The i, and likewise, the a (which appends text, rather than inserting it) and
    c (which replaces text) commands, allow multiple lines of text as long as each
    line, except the last, ends with a line continuation character. The sixth line
    of our script is actually the end of our inserted text and ends with a plain carriage
    return rather than a line continuation character, signaling the end of the i command.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '**Note:** A line continuation character is formed by a backslash followed *immediately*
    by a carriage return. No intermediary spaces are permitted.


    Line seven is our search and replace command. Since it is not preceded by an address,
    each line in the input stream is subject to its action.


    Line eight performs transliteration of the lowercase letters into uppercase letters.
    Note that unlike `tr`, the `y` command in `sed` does not support character ranges
    (for example, `[a-z]`), nor does it support POSIX character classes. Again, since
    the `y` command is not preceded by an address, it applies to every line in the
    input stream.


    # People Who Like sed Also Like...


    sed is a very capable program, able to perform fairly complex editing tasks to
    streams of text. It is most often used for simple one line tasks rather than long
    scripts. Many users prefer other tools for longer tasks. The most popular of these
    are awk and perl. These go beyond mere tools, like the programs covered here,
    and extend into the realm of complete programming languages. perl, in particular,
    is often used in place of shell scripts for many system management and administration
    tasks, as well as being a very popular medium for web development. awk is a little
    more specialized. Its specific strength is its ability to manipulate tabular data.
    It resembles sed in that awk programs normally process text files line-by-line,
    using a scheme similar to the sed concept of an address followed by an action.
    While both awk and perl are outside the scope of this book, they are very good
    skills for the Linux command line user.


    # aspell


    The last tool we will look at is `aspell`, an interactive spelling checker. The
    `aspell` program is the successor to an earlier program named `ispell`, and can
    be used, for the most part, as a drop-in replacement. While the `aspell` program
    is mostly used by other programs that require spell checking capability, it can
    also be used very effectively as a stand-alone tool from the command line. It
    has the ability to intelligently check various type of text files, including HTML
    documents, C/C++ programs, email messages and other kinds of specialized texts.


    To spell check a text file containing simple prose, it could be used like this:'
  merge: -1
  img_proc: true
- pgno: 317
  md: '```

    aspell check textfile

    ```


    where textfile is the name of the file to check. As a practical example, let''s
    create a simple text file named foo.txt containing some deliberate spelling errors:


    ```

    [me@linuxbox ~]$ cat > foo.txt

    The quick brown fox jimped over the lazy dog.

    ```


    Next we''ll check the file using aspell:


    ```

    [me@linuxbox ~]$ aspell check foo.txt

    ```


    As aspell is interactive in the check mode, we will see a screen like this:


    ```

    The quick brown fox jimped over the lazy dog.

    1) jumped          6) wimped

    2) gimped          7) camped

    3) comped          8) humped

    4) limped          9) impede

    5) pimped          0) umped

    i) Ignore          I) Ignore all

    r) Replace         R) Replace all

    a) Add             l) Add Lower

    b) Abort           x) Exit

    ?

    ```


    At the top of the display, we see our text with a suspiciously spelled word highlighted.
    In the middle, we see ten spelling suggestions numbered zero through nine, followed
    by a list of other possible actions. Finally, at the very bottom, we see a prompt
    ready to accept our choice.


    If we press the 1 key, aspell replaces the offending word with the word “jumped”
    and moves on to the next misspelled word which is “laxy.” If we select the replacement
    “lazy,” aspell replaces it and terminates. Once aspell has finished, we can examine
    our file and see that the misspellings have been corrected:'
  merge: -1
  img_proc: true
- pgno: 318
  md: '```

    [me@linuxbox ~]$ cat foo.txt

    The quick brown fox jumped over the lazy dog.

    ```


    Unless told otherwise via the command line option --dont-backup, aspell creates
    a backup file containing the original text by appending the extension .bak to
    the filename.


    Showing off our sed editing prowess, we''ll put our spelling mistakes back in
    so we can reuse our file:


    ```

    [me@linuxbox ~]$ sed -i ''s/lazy/laxy/; s/jumped/jimped/'' foo.txt

    ```


    The sed option -i tells sed to edit the file “in-place,” meaning that rather than
    sending the edited output to standard output, it will re-write the file with the
    changes applied. We also see the ability to place more than one editing command
    on the line by separating them with a semicolon.


    Next, we''ll look at how aspell can handle different kinds of text files. Using
    a text editor such as vim (the adventurous may want to try sed), we will add some
    HTML markup to our file:


    ```

    <html>

    <head>

