    vim, on the other hand, supports basic regular expressions, so our search expression
    would look like this:


    ```

    /([0-9]\{3\}) [0-9]\{3\}-[0-9]\{4\}

    ```


    We can see that the expression is mostly the same; however, many of the characters
    that are considered metacharacters in extended expressions are considered literals
    in basic expressions. They are only treated as metacharacters when escaped with
    a backslash.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'Depending on the particular configuration of vim on our system, the matching
    will be highlighted. If not, try this command mode command:


    ```

    ```text

    :h lsearch

    ```

    ```


    to activate search highlighting.


    > **Note:** Depending on your distribution, vim may or may not support text search
    highlighting. Ubuntu, in particular, supplies a very stripped-down version of
    vim by default. On such systems, you may want to use your package manager to install
    a more complete version of vim.


    # Summing Up


    In this chapter, we’ve seen a few of the many uses of regular expressions. We
    can find even more if we use regular expressions to search for additional applications
    that use them. We can do that by searching the man pages:


    ```

    ```text

    [me@linuxbox ~]$ cd /usr/share/man/man1

    [me@linuxbox man1]$ zgrep -El ''regex|regular expression'' *.gz

    ```

    ```


    The zgrep program provides a front end for grep, allowing it to read compressed
    files. In our example, we search the compressed section one man page files located
    in their usual location. The result of this command is a list of files containing
    either the string “regex” or “regular expression”. As we can see, regular expressions
    show up in a lot of programs.


    There is one feature found in basic regular expressions that we did not cover.
    Called *back references*, this feature will be discussed in the next chapter.


    # Further Reading


    There are many online resources for learning regular expressions, including various
    tutorials and cheat sheets.


    In addition, the Wikipedia has good articles on the following background topics:


    +   - POSIX: http://en.wikipedia.org/wiki/Posix

    +   - ASCII: http://en.wikipedia.org/wiki/Ascii'
