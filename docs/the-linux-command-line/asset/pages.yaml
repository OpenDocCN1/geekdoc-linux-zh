    \ >&2\n    exit 1\n    ;;\nesac\n```\n\nThe case command looks at the value of\
    \ word, in our example, the value of the REPLY variable, and then attempts to\
    \ match it against one of the specified patterns. When a match is found, the commands\
    \ associated with the specified pattern are executed. After a match is found,\
    \ no further matches are attempted.\n\n# Patterns\n\nThe patterns used by case\
    \ are the same as those used by pathname expansion. Patterns are terminated with\
    \ a \")\" character. Here are some valid patterns:\n\nTable32-1: case Pattern\
    \ Examples\n\n| Pattern | Description |\n|---|---|\n| a) | Matches if word equals\
    \ \"a\". |\n| [[:alpha:]]) | Matches if word is a single alphabetic character.\
    \ |\n| ???) | Matches if word is exactly three characters long. |\n| *.txt) |\
    \ Matches if word ends with the characters \".txt\". |\n| *) | Matches any value\
    \ of word. It is good practice to include this as the last pattern in a case command,\
    \ to catch any values of word that did not match a previous pattern; that is,\
    \ to catch any possible invalid values. |\n\nHere is an example of patterns at\
    \ work:"
  merge: -1
