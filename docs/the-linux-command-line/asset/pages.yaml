- pgno: 55
  md: '# Moving And Renaming Files


    Now, the name “passwd” doesn’t seem very playful and this is a playground, so
    let’s change it to something else:


    ```

    [me@linuxbox playground]$ mv passwd fun

    ```


    Let’s pass the fun around a little by moving our renamed file to each of the directories
    and back again:


    ```

    [me@linuxbox playground]$ mv fun dir1

    ```


    to move it first to directory dir1, then:


    ```

    [me@linuxbox playground]$ mv dir1/fun dir2

    ```


    to move it from dir1 to dir2, then:


    ```

    [me@linuxbox playground]$ mv dir2/fun .

    ```


    to finally bringing it back to the current working directory. Next, let’s see
    the effect of mv on directories. First we will move our data file into dir1 again:


    ```

    [me@linuxbox playground]$ mv fun dir1

    ```


    then move dir1 into dir2 and confirm it with ls:


    ```

    [me@linuxbox playground]$ mv dir1 dir2

    [me@linuxbox playground]$ ls -l dir2

    total 4

    drwxrwxr-x 2 me me 4096 2008-01-11 06:06 dir1

    [me@linuxbox playground]$ ls -l dir2/dir1

    total 4

    -rw-r--r-- 1 me me 1650 2008-01-10 16:33 fun

    ```'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'Note that since dir2 already existed, mv moved dir1 into dir2. If dir2 had
    not existed, mv would have renamed dir1 to dir2. Lastly, let’s put everything
    back:


    ```

    [me@linuxbox playground]$ mv dir2/dir1 .

    [me@linuxbox playground]$ mv dir1/fun .

    ```


    # Creating Hard Links


    Now we’ll try some links. First the hard links. We’ll create some links to our
    data file like so:


    ```

    [me@linuxbox playground]$ ln fun fun-hard

    [me@linuxbox playground]$ ln fun dir1/fun-hard

    [me@linuxbox playground]$ ln fun dir2/fun-hard

    ```


    So now we have four instances of the file “fun”. Let’s take a look our playground
    directory:


    ```

    [me@linuxbox playground]$ ls -l

    total 16

    drwxrwxr-x 2 me me 4096 2008-01-14 16:17 dir1

    drwxrwxr-x 2 me me 4096 2008-01-14 16:17 dir2

    -rw-r--r-- 4 me me 1650 2008-01-10 16:33 fun

    -rw-r--r-- 4 me me 1650 2008-01-10 16:33 fun-hard

    ```


    One thing you notice is that the second field in the listing for fun and fun-hard
    both contain a “4” which is the number of hard links that now exist for the file.
    You’ll remember that a file will aways have at least one because the file’s name
    is created by a link. So, how do we know that fun and fun-hard are, in fact, the
    same file? In this case, ls is not very helpful. While we can see that fun and
    fun-hard are both the same size (field 5), our listing provides no way to be sure.
    To solve this problem, we’re going to have to dig a little deeper.


    When thinking about hard links, it is helpful to imagine that files are made up
    of two parts: the data part containing the file’s contents and the name part which
    holds the file’s name. When we create hard links, we are actually creating additional
    name parts that all refer to the same data part. The system assigns a chain of
    disk blocks to what is called an inode, which is then associated with the name
    part. Each hard link therefore refers to a specific inode containing the file’s
    contents.'
  merge: -1
  img_proc: true
