    is now world writable. To understand how this works, we have to look at octal
    numbers again. If we take the mask and expand it into binary, then compare it
    to the attributes we can see what happens:


    | Original file mode | --- rw- rw- rw- |

    | Mask | 000 000 000 010 |

    | Result | --- rw- rw- r-- |


