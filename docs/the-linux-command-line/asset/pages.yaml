    # Summing Up


    In this chapter, we have looked at a few of the many command line tools that operate
    on text. In the next chapter, we will look at several more. Admittedly, it may
    not seem immediately obvious how or why you might use some of these tools on a
    day-to-day basis, though we have tried to show some semi-practical examples of
    their use. We will find in later chapters that these tools form the basis of a
    tool set that is used to solve a host of practical problems. This will be particularly
    true when we get into shell scripting, where these tools will really show their
    worth.


