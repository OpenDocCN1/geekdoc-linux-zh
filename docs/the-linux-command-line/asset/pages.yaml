  md: '.bash_history. The history facility is a useful resource for reducing the amount
    of typing you have to do, especially when combined with command line editing.


    # Searching History


    At any time, we can view the contents of the history list by:


    ```

    [me@linuxbox ~]$ history | less

    ```


    By default, bash stores the last five hundred commands you have entered. We will
    see how to adjust this value in a later chapter. Let''s say we want to find the
    commands we used to list /usr/bin. One way we could do this:


    ```

    [me@linuxbox ~]$ history | grep /usr/bin

    ```


    And let''s say that among our results we got a line containing an interesting
    command like this:


    ```

    88  ls -l /usr/bin > ls-output.txt

    ```


    The number "88" is the line number of the command in the history list. We could
    use this immediately using another type of expansion called history expansion.
    To use our discovered line we could do this:


    ```

    [me@linuxbox ~]$ !88

    ```


    bash will expand "!88" into the contents of the eighty-eighth line in the history
    list. There are other forms of history expansion that we will cover a little later.


    bash also provides the ability to search the history list incrementally. This
    means that we can tell bash to search the history list as we enter characters,
    with each additional character further refining our search. To start incremental
    search type Ctrl-r followed by the text you are looking for. When you find it,
    you can either type Enter to execute the command or type Ctrl-j to copy the line
    from the history list to the current command line. To find the next occurrence
    of the text (moving "up" the history list), type Ctrl-r again. To quit searching,
    type either Ctrl-g or Ctrl-c. Here we see it in action:'
