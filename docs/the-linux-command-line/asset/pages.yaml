  md: "the loop terminates and execution continues with the line following done.\n\
    \n# Breaking Out Of A Loop\n\nbash provides two builtin commands that can be used\
    \ to control program flow inside loops. The break command immediately terminates\
    \ a loop, and program control resumes with the next statement following the loop.\
    \ The continue command causes the remainder to the loop to be skipped, and program\
    \ control resumes with the next iteration of the loop. Here we see a version of\
    \ the while-menu program incorporating both break and continue:\n\n```\n#!/bin/bash\n\
    \n# while-menu2: a menu driven system information program\n\nDELAY=3 # Number\
    \ of seconds to display results\n\nwhile true; do\n    clear\n    cat <<- _EOF_\n\
    \        Please Select:\n\n        1. Display System Information\n        2. Display\
    \ Disk Space\n        3. Display Home Space Utilization\n        0. Quit\n\n \
    \   _EOF_\n    read -p \"Enter selection [0-3] > \"\n\n    if [[ $REPLY =~ ^[0-3]$\
    \ ]]; then\n        if [[ $REPLY == 1 ]]; then\n            echo \"Hostname: $HOSTNAME\"\
    \n            uptime\n            sleep $DELAY\n            continue\n       \
    \ fi\n        if [[ $REPLY == 2 ]]; then\n            df -h\n            sleep\
    \ $DELAY\n            continue\n        fi\n    fi\n    if [[ $REPLY == 3 ]];\
    \ then\n        if [[ $(id -u) -eq 0 ]]; then\n            echo \"Home Space Utilization\
    \ (All Users)\"\n            du -sh /home/*\n        else\n```"
