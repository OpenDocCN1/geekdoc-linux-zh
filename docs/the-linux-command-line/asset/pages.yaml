  md: '# 37 – Exotica


    In this, the final chapter of our journey, we will look at some odds and ends.
    While we have certainly covered a lot of ground in the previous chapters, there
    are many bash features that we have not covered. Most are fairly obscure, and
    useful mainly to those integrating bash into a Linux distribution. However, there
    are a few that, while not in common use, are helpful for certain programming problems.
    We will cover them here.


    # Group Commands And Subshells


    bash allows commands to be grouped together. This can be done in one of two ways;
    either with a group command or with a subshell. Here are examples of the syntax
    of each:


    Group Command:


    ```

    { command1; command2; [command3; ...] }

    ```


    Subshell:


    ```

    (command1; command2; [command3; ...])

    ```


    The two forms differ in that a group command surrounds its commands with braces
    and a subshell uses parentheses. It is important to note that, due to the way
    bash implements group commands, the braces must be separated from the commands
    by a space and the last command must be terminated with either a semicolon or
    a newline prior to the closing brace.


    So what are group commands and subshells good for? While they have an important
    difference (which we will get to in a moment), they are both used to manage redirection.
    Let''s consider a script segment that performs redirections on multiple commands:


    ```

    ls -l > output.txt

    echo "Listing of foo.txt" >> output.txt

    cat foo.txt >> output.txt

    ```


    This is pretty straightforward. Three commands with their output redirected to
    a file'
  merge: -1
  img_proc: true
- pgno: 499
  md: 'named output.txt. Using a group command, we could code this as follows:


    ```

    { ls -l; echo "Listing of foo.txt"; cat foo.txt; } > output.txt

    ```


    Using a subshell is similar:


    ```

    (ls -l; echo "Listing of foo.txt"; cat foo.txt) > output.txt

    ```


    Using this technique, we have saved ourselves some typing, but where a group command
    or subshell really shines is with pipelines. When constructing a pipeline of commands,
    it is often useful to combine the results of several commands into a single stream.
    Group commands and subshells make this easy:


    ```

    { ls -l; echo "Listing of foo.txt"; cat foo.txt; } | lpr

    ```


    Here we have combined the output of our three commands and piped them into the
    input of lpr to produce a printed report.


    # Process Substitution


    While they look similar and can both be used to combine streams for redirection,
    there is an important difference between group commands and subshells. Whereas
    a group command executes all of its commands in the current shell, a subshell
    (as the name suggests) executes its commands in a child copy of the current shell.
    This means that the environment is copied and given to a new instance of the shell.
    When the subshell exits, the copy of the environment is lost, so any changes made
    to the subshell’s environment (including variable assignment) is lost as well.
    Therefore, in most cases, unless a script requires a subshell, group commands
    are preferable to subshells. Group commands are both faster and require less memory.


    We saw an example of the subshell environment problem in Chapter 29, when we discovered
    that a read command in a pipeline does not work as we might intuitively expect.
    To recap, if we construct a pipeline like this:


    ```

    echo "foo" | read

    echo $REPLY

    ```'
  merge: -1
  img_proc: true
- pgno: 500
  md: "The content of the REPLY variable is always empty because the read command\
    \ is executed in a subshell, and its copy of REPLY is destroyed when the subshell\
    \ terminates.\n\nBecause commands in pipelines are always executed in subshells,\
    \ any command that assigns variables will encounter this issue. Fortunately, the\
    \ shell provides an exotic form of expansion called process substitution that\
    \ can be used to work around this problem.\n\nProcess substitution is expressed\
    \ in two ways:\n\nFor processes that produce standard output:\n\n```\n<(list)\n\
    ```\n\nor, for processes that intake standard input:\n\n```\n>(list)\n```\n\n\
    where list is a list of commands.\n\nTo solve our problem with read, we can employ\
    \ process substitution like this:\n\n```\nread < <(echo \"Foo\")\necho $REPLY\n\
    ```\n\nProcess substitution allows us to treat the output of a subshell as an\
    \ ordinary file for purposes of redirection. In fact, since it is a form of expansion,\
    \ we can examine its real value:\n\n```\n[me@linuxbox ~]$ echo <(echo \"foo\"\
    )\n/dev/fd/63\n```\n\nBy using echo to view the result of the expansion, we see\
    \ that the output of the subshell is being provided by a file named /dev/fd/63.\n\
    \nProcess substitution is often used with loops containing read. Here is an example\
    \ of a read loop that processes the contents of a directory listing created by\
    \ a subshell:\n\n```\n#!/bin/bash\n\n# pro-sub : demo of process substitution\n\
    \nwhile read attr links owner group size date time filename; do\n    cat <<- EOF\n\
    \        Filename:  $filename\n```"
  merge: -1
