- pgno: 453
  md: "```\n$8 = Desktop\n$9 = dirlist-bin.txt\n```\n\nOn this example system, the\
    \ wildcard * expands into eighty-two arguments. How can we process that many?\
    \ The shell provides a method, albeit clumsy, to do this. The shift command causes\
    \ all of the parameters to “move down one” each time it is executed. In fact,\
    \ by using shift, it is possible to get by with only one parameter (in addition\
    \ to $0, which never changes):\n\n```\n#!/bin/bash\n\n# posit-param2: script to\
    \ display all arguments\n\ncount=1\n\nwhile [[ $# -gt 0 ]]; do\n    echo \"Argument\
    \ $count = $1\"\n    count=$(($count + 1))\n    shift\ndone\n```\n\nEach time\
    \ shift is executed, the value of $2 is moved to $1, the value of $3 is moved\
    \ to $2 and so on. The value of $# is also reduced by one.\n\nIn the posit-param2\
    \ program, we create a loop that evaluates the number of arguments remaining and\
    \ continues as long as there is at least one. We display the current argument,\
    \ increment the variable count with each iteration of the loop to provide a running\
    \ count of the number of arguments processed and, finally, execute a shift to\
    \ load $1 with the next argument. Here is the program at work:\n\n```\n[me@linuxbox\
    \ ~]$ posit-param2 a b c d\nArgument 1 = a\nArgument 2 = b\nArgument 3 = c\nArgument\
    \ 4 = d\n```\n\n# Simple Applications\n\nEven without shift, it’s possible to\
    \ write useful applications using positional parameters. By way of example, here\
    \ is a simple file information program:"
  merge: -1
  img_proc: true
- pgno: 454
  md: "```\n#!/bin/bash\n\n# file_info: simple file information program\n\nPROGNAME=$(basename\
    \ $0)\n\nif [[ -e $1 ]]; then\n    echo -e \"\\nFile Type:\"\n    file $1\n  \
    \  echo -e \"\\nFile Status:\"\n    stat $1\nelse\n    echo \"$PROGNAME: usage:\
    \ $PROGNAME file\" >&2\n    exit 1\nfi\n```\n\nThis program displays the file\
    \ type (determined by the file command ) and the file status (from the stat command)\
    \ of a specified file. One interesting feature of this program is the PROGNAME\
    \ variable. It is given the value that results from the basename $0 command. The\
    \ basename command removes the leading portion of a pathname, leaving only the\
    \ base name of a file. In our example, basename removes the leading portion of\
    \ the pathname contained in the $0 parameter, the full pathname of our example\
    \ program. This value is useful when constructing messages such as the usage message\
    \ at the end of the program. By coding it this way, the script can be renamed\
    \ and the message automatically adjusts to contain the name of the program.\n\n\
    # Using Positional Parameters With Shell Functions\n\nJust as positional parameters\
    \ are used to pass arguments to shell scripts, they can also be used to pass arguments\
    \ to shell functions. To demonstrate, we will convert the file_info script into\
    \ a shell function:\n\n```\nfile_info () {\n\n    # file_info: function to display\
    \ file information\n\n    if [[ -e $1 ]]; then\n        echo -e \"\\nFile Type:\"\
    \n        file $1\n        echo -e \"\\nFile Status:\"\n        stat $1\n    else\n\
    \        echo \"$FUNCNAME: usage: $FUNCNAME file\" >&2\n        return 1\n}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 455
  md: "```\n```shell\n        fi\n}\n```\n```\n\nNow, if a script that incorporates\
    \ the `file_info` shell function calls the function with a filename argument,\
    \ the argument will be passed to the function.\n\nWith this capability, we can\
    \ write many useful shell functions that can not only be used in scripts, but\
    \ also within the `.bashrc` file.\n\nNotice that the PROGNAME variable was changed\
    \ to the shell variable FUNCNAME. The shell automatically updates this variable\
    \ to keep track of the currently executed shell function. Note that `$0` always\
    \ contains the full pathname of the first item on the command line (i.e., the\
    \ name of the program) and does not contain the name of the shell function as\
    \ we might expect.\n\n# Handling Positional Parameters *En Masse*\n\nIt is sometimes\
    \ useful to manage all the positional parameters as a group. For example, we might\
    \ want to write a “wrapper” around another program. This means that we create\
    \ a script or shell function that simplifies the execution of another program.\
    \ The wrapper supplies a list of arcane command line options and then passes a\
    \ list of arguments to the lower level program.\n\nThe shell provides two special\
    \ parameters for this purpose. They both expand into the complete list of positional\
    \ parameters, but differ in rather subtle ways. They are:\n\n**Table 33-1: The\
    \ `$*` And `$@` Special Parameters**\n\n| Parameter | Description |\n|---|---|\n\
    | `$*` | Expands into the list of positional parameters, starting with 1. When\
    \ surrounded by double quotes, it expands into a double quoted string containing\
    \ all of the positional parameters, each separated by the first character of the\
    \ IFS shell variable (by default a space character). |\n| `$@` | Expands into\
    \ the list of positional parameters, starting with 1. When surrounded by double\
    \ quotes, it expands each positional parameter into a separate word surrounded\
    \ by double quotes. |\n\nHere is a script that shows them in action:"
  merge: -1
  img_proc: true
- pgno: 456
  md: "```\n#!/bin/bash\n\n# posit-params3 : script to demonstrate $* and $@\n\nprint_params\
    \ () {\n    echo \"$1 = $1\"\n    echo \"$2 = $2\"\n    echo \"$3 = $3\"\n   \
    \ echo \"$4 = $4\"\n}\n\npass_params () {\n    echo -e \"\\n\" '$* :' ;  print_params\
    \ $*\n    echo -e \"\\n\" \"$*\" ':' ; print_params \"$*\"\n    echo -e \"\\n\"\
    \ '$@ :' ; print_params $@\n    echo -e \"\\n\" \"$@\" ':' ; print_params \"$@\"\
    \n}\n\npass_params \"word\" \"words with spaces\"\n```\n\nIn this rather convoluted\
    \ program, we create two arguments: “word” and “words with spaces” and pass them\
    \ to the pass_params function. That function, in turn, passes them on to the print_params\
    \ function, using each of the four methods available with the special parameters\
    \ $! and $@. When executed, the script reveals the differences:\n\n```\n[me@linuxbox\
    \ ~]$ posit-param3\n\n$* :\n$1 = word\n$2 = words\n$3 = with\n$4 = spaces\n\n\"\
    $*\" :\n$1 = word words with spaces\n$2 =\n$3 =\n$4 =\n\n$@ :\n$1 = word\n$2 =\
    \ words\n$3 = with\n$4 = spaces\n\n\"$@\" :\n$1 = word\n```"
  merge: -1
  img_proc: true
- pgno: 457
  md: "# 33 – Positional Parameters\n\n```\n```sh\n$2 = words with spaces\n$3 =\n\
    $4 =\n```\n```\n\nWith our arguments, both `$!` and `$@` produce a four word result:\n\
    \n```text\nword words with spaces\n```\n\n`\"$*\"` produces a one word result:\n\
    \n```text\n\"word words with spaces\"\n```\n\n`\"$@\"` produces a two word result:\n\
    \n```text\n\"word\" \"words with spaces\"\n```\n\nwhich matches our actual intent.\
    \ The lesson to take from this is that even though the shell provides four different\
    \ ways of getting the list of positional parameters, `\"$@\"` is by far the most\
    \ useful for most situations, because it preserves the integrity of each positional\
    \ parameter.\n\n# A More Complete Application\n\nAfter a long hiatus, we are going\
    \ to resume work on our `sys_info_page` program. Our next addition will add several\
    \ command line options to the program as follows:\n\n+   - **Output file.** We\
    \ will add an option to specify a name for a file to contain the program’s output.\
    \ It will be specified as either `-f file` or `--file file`.\n+   - **Interactive\
    \ mode.** This option will prompt the user for an output filename and will determine\
    \ if the specified file already exists. If it does, the user will be prompted\
    \ before the existing file is overwritten. This option will be specified by either\
    \ `-i` or `--interactive`.\n+   - **Help.** Either `-h` or `--help` may be specified\
    \ to cause the program to output an informative usage message.\n\nHere is the\
    \ code needed to implement the command line processing:\n\n```\n```sh\nusage ()\
    \ {\n        echo \"$PROGNAME: usage: $PROGNAME [-f file | -i]\"\n        return\n\
    }\n\n# process command line options\n\ninteractive=\n```\n```"
  merge: -1
  img_proc: true
- pgno: 458
  md: "```\nfilename=\nwhile [[ -n $1 ]]; do\n    case $1 in\n        -f | --file)\n\
    \            shift\n            filename=$1\n            ;;\n        -i | --interactive)\n\
    \            interactive=1\n            ;;\n        -h | --help)\n           \
    \ usage\n            exit\n            ;;\n        *)\n            usage >&2\n\
    \            exit 1\n            ;;\n    esac\n    shift\ndone\n```\n\nFirst,\
    \ we add a shell function called usage to display a message when the help option\
    \ is invoked or an unknown option is attempted.\n\nNext, we begin the processing\
    \ loop. This loop continues while the positional parameter $1 is not empty. At\
    \ the bottom of the loop, we have a shift command to advance the positional parameters\
    \ to ensure that the loop will eventually terminate.\n\nWithin the loop, we have\
    \ a case statement that examines the current positional parameter to see if it\
    \ matches any of the supported choices. If a supported parameter is found, it\
    \ is acted upon. If not, the usage message is displayed and the script terminates\
    \ with an error.\n\nThe -f parameter is handled in an interesting way. When detected,\
    \ it causes an additional shift to occur, which advances the positional parameter\
