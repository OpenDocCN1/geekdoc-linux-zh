    \      echo \"is a single alphabetic character.\" ;;\n  [ABC][0-9])        echo\
    \ \"is A, B, or C followed by a digit.\" ;;\n  ???)               echo \"is three\
    \ characters long.\" ;;\n  *.txt)             echo \"is a word ending in '.txt'\"\
    \ ;;\n  *)                 echo \"is something else.\" ;;\nesac\n```\n\nIt is\
