    # scp And sftp


    The OpenSSH package also includes two programs that can make use of an SSH encrypted
    tunnel to copy files across the network. The first, scp (secure copy) is used
    much like the familiar cp program to copy files. The most notable difference is
    that the source or destination pathnames may be preceded with the name of a remote
    host, followed by a colon character. For example, if we wanted to copy a document
    named document.txt from our home directory on the remote system, remote-sys, to
    the current working directory on our local system, we could do this:


