    # Creating New File Systems


    Let''s say that we want to reformat the flash drive with a Linux native file system,
    rather than the FAT32 system it has now. This involves two steps: 1. (optional)
    create a new partition layout if the existing one is not to our liking, and 2.
    create a new, empty file system on the drive.


    > **Warning!** In the following exercise, we are going to format a flash drive.
    Use a drive that contains nothing you care about because it will be erased! Again,
    **make absolutely sure you are specifying the correct device name for your system,
    not the one shown in the text. Failure to heed this warning could result in you
    formatting (i.e., erasing) the wrong drive!**


    # Manipulating Partitions With `fdisk`


