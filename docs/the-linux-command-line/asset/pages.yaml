    As we can see, the shell pays no attention to the quotation marks. It treats them
    as ordinary characters. This allows us to embed quotes freely within a here document.
    This could turn out to be handy for our report program.


    Here documents can be used with any command that accepts standard input. In this
    example, we use a here document to pass a series of commands to the ftp program
    in order to retrieve a file from a remote FTP server:


    ```

    #!/bin/bash


    # Script to retrieve a file via FTP


    FTP_SERVER=ftp.nl.debian.org

    FTP_PATH=/debian/dists/lenny/main/installer-1386/current/images/cdrom

    REMOTE_FILE=debian-cd_info.tar.gz


    ftp -n << _EOF_

    open $FTP_SERVER

    user anonymous me@linuxbox

    cd $FTP_PATH

    hash

    get $REMOTE_FILE

    bye

    _EOF_

    ls -l $REMOTE_FILE

    ```


    If we change the redirection operator from “<<” to “<<-”, the shell will ignore
    leading tab characters in the here document. This allows a here document to be
    indented, which can improve readability:


    ```

    #!/bin/bash


    # Script to retrieve a file via FTP


    FTP_SERVER=ftp.nl.debian.org

    ```'
