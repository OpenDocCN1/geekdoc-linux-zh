  md: "```\n<TITLE>$TITLE</TITLE>\n</HEAD>\n<BODY>\n<H1>$TITLE</H1>\n<P>$TIME_STAMP</P>\n\
    $(report_uptime)\n$(report_disk_space)\n$(report_home_space)\n</BODY>\n</HTML>\n\
    _EOF_\n```\n\nWe could create these additional commands two ways. We could write\
    \ three separate scripts and place them in a directory listed in our PATH, or\
    \ we could embed the scripts within our program as shell functions. As we have\
    \ mentioned before, shell functions are “mini-scripts” that are located inside\
    \ other scripts and can act as autonomous programs. Shell functions have two syntactic\
    \ forms:\n\n```\nfunction name {\n    commands\n    return\n}\n```\n\nand\n\n\
    ```\nname () {\n    commands\n    return\n}\n```\n\nwhere name is the name of\
    \ the function and commands are a series of commands contained within the function.\
    \ Both forms are equivalent and may be used interchangeably. Below we see a script\
    \ that demonstrates the use of a shell function:\n\n```\n1  #!/bin/bash\n2\n3\
    \  # Shell function demo\n4\n5  function funct {\n6      echo \"Step 2\"\n7  \
    \    return\n8  }\n9\n10 # Main program starts here\n11\n12 echo \"Step 1\"\n\
    ```"
