- pgno: 386
  md: "command. There is a third way called a here document or here script. A here\
    \ document is an additional form of I/O redirection in which we embed a body of\
    \ text into our script and feed it into the standard input of a command. It works\
    \ like this:\n\n```\ncommand << token\ntext\ntoken\n```\n\nwhere command is the\
    \ name of command that accepts standard input and token is a string used to indicate\
    \ the end of the embedded text. We’ll modify our script to use a here document:\n\
    \n```\n#!/bin/bash\n\n# Program to output a system information page\n\nTITLE=\"\
    System Information Report For $HOSTNAME\"\nCURRENT_TIME=$(date +\"%x %r %Z\")\n\
    TIME_STAMP=\"Generated $CURRENT_TIME, by $USER\"\n\ncat << _EOF_\n<HTML>\n   \
    \ <HEAD>\n        <TITLE>$TITLE</TITLE>\n    </HEAD>\n    <BODY>\n        <H1>$TITLE</H1>\n\
    \        <P>$TIME_STAMP</P>\n    </BODY>\n</HTML>\n_EOF_\n```\n\nInstead of using\
    \ echo, our script now uses cat and a here document. The string _EOF_ (meaning\
    \ “End Of File,” a common convention) was selected as the token, and marks the\
    \ end of the embedded text. Note that the token must appear alone and that there\
    \ must not be trailing spaces on the line.\n\nSo what’s the advantage of using\
    \ a here document? It’s mostly the same as echo, except that, by default, single\
    \ and double quotes within here documents lose their special meaning to the shell.\
    \ Here is a command line example:\n\n```\n[me@linuxbox ~]$ foo=\"some text\"\n\
    [me@linuxbox ~]$ cat << _EOF_\n> $foo\n```"
  merge: -1
  img_proc: true
