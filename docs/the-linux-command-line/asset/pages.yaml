    and we enclosed the regular expression in quotes to prevent the shell from interpreting
    the vertical bar metacharacter as a pipe operator. Alternation is not limited
    to two choices:


    ```

    ```sh

    [me@linuxbox ~]$ echo "AAA" | grep -E ''AAA|BBB|CCC''

    AAA

