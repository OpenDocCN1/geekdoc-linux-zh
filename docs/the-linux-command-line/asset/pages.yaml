    # Variables And Constants


    There is an issue with our script, however. Notice how the string “System Information
    Report” is repeated? With our tiny script it’s not a problem, but let’s imagine
    that our script was really long and we had multiple instances of this string.
    If we wanted to change the title to something else, we would have to change it
    in multiple places, which could be a lot of work. What if we could arrange the
    script so that the string only appeared once and not multiple times? That would
    make future maintenance of the script much easier. Here’s how we could do that:


    ```

    #!/bin/bash


    # Program to output a system information page


    title="System Information Report"


    echo "<HTML>

    <HEAD>

    <TITLE>$title</TITLE>

    </HEAD>

    <BODY> <H1>$title</H1>

    </BODY>

    </HTML>"

    ```


    By creating a variable named title and assigning it the value “System Information
    Report,” we can take advantage of parameter expansion and place the string in
    multiple locations.


    So, how do we create a variable? Simple, we just use it. When the shell encounters
    a variable, it automatically creates it. This differs from many programming languages
    in which variables must be explicitly declared or defined before use. The shell
    is very lax about this, which can lead to some problems. For example, consider
    this scenario played out on the command line:'
