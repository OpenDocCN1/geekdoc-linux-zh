- pgno: 217
  md: '# ftp


    One of the true “classic” programs, `ftp` gets it name from the protocol it uses,
    the *File Transfer Protocol*. FTP is used widely on the Internet for file downloads.
    Most, if not all, web browsers support it and you often see URIs starting with
    the protocol `ftp://`.


    Before there were web browsers, there was the ftp program. `ftp` is used to communicate
    with *FTP servers*, machines that contain files that can be uploaded and downloaded
    over a network.


    FTP (in its original form) is not secure, because it sends account names and passwords
    in *cleartext*. This means that they are not encrypted and anyone *sniffing* the
    network can see them. Because of this, almost all FTP done over the Internet is
    done by *anonymous FTP servers*. An anonymous server allows anyone to login using
    the login name “anonymous” and a meaningless password.


    In the example below, we show a typical session with the ftp program downloading
    an Ubuntu iso image located in the `/pub/cd_images/Ubuntu-8.04` directory of the
    anonymous FTP server `fileserver`:


    ```

    ```text

    [me@linuxbox ~]$ ftp fileserver

    Connected to fileserver.localdomain.

    220 (vsFTPd 2.0.1)

    Name (fileserver.me): anonymous

    331 Please specify the password.

    Password:

    230 Login successful.

    Remote system type is UNIX.

    Using binary mode to transfer files.

    ftp> cd pub/cd_images/Ubuntu-8.04

    250 Directory successfully changed.

    ftp> ls

    200 PORT command successful. Consider using PASV.

    150 Here comes the directory listing.

    -rw-rw-r-- 1 500 500 733079552 Apr 25 03:53 ubuntu-8.04-desktop-i386.iso

    226 Directory send OK.

    ftp> lcd Desktop

    Local directory now /home/me/Desktop

    ftp> get ubuntu-8.04-desktop-i386.iso

    local: ubuntu-8.04-desktop-i386.iso remote: ubuntu-8.04-desktop-i386.iso

    200 PORT command successful. Consider using PASV.

    150 Opening BINARY mode data connection for ubuntu-8.04-desktop-i386.iso (733079552
    bytes).

    226 File send OK.

    733079552 bytes received in 68.56 secs (10441.5 kB/s)

    ```

    ```'
