    ```


    In the first example, word-splitting by the shell removed extra whitespace from
    the echo command''s list of arguments. In the second example, parameter expansion
    substituted an empty string for the value of "$1" because it was an undefined
    variable. The shell provides a mechanism called quoting to selectively suppress
    unwanted expansions.


