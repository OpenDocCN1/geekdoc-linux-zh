    The command fg followed by a percent sign and the job number (called a jobspec)
    does the trick. If we only have one background job, the jobspec is optional. To
    terminate xlogo, type Ctrl-c.


    # Stopping (Pausing) A Process


    Sometimes we''ll want to stop a process without terminating it. This is often
    done to allow a foreground process to be moved to the background. To stop a foreground
    process, type Ctrl-z. Let''s try it. At the command prompt, type xlogo, the Enter
    key, then Ctrl-z:


    ```

    [me@linuxbox ~]$ xlogo

    [1]+ Stopped                  xlogo

    [me@linuxbox ~]$

    ```


    After stopping xlogo, we can verify that the program has stopped by attempting
    to resize the xlogo window. We will see that it appears quite dead. We can either
    restore the program to the foreground, using the fg command, or move the program
    to the background with the bg command:


    ```

    [me@linuxbox ~]$ bg %1

    [1]+ xlogo &

    [me@linuxbox ~]$

    ```


    As with the fg command, the jobspec is optional if there is only one job.


    Moving a process from the foreground to the background is handy if we launch a
    graphical program from the command, but forget to place it in the background by
    appending the trailing "&".


    Why would you want to launch a graphical program from the command line? There
    are two reasons. First, the program you wish to run might not be listed on the
    window manager''s menus (such as xlogo). Secondly, by launching a program from
    the command line, you might be able to see error messages that would otherwise
    be invisible if the program were launched graphically. Sometimes, a program will
    fail to start up when launched from the graphical menu. By launching it from the
    command line instead, we may see an error message that will reveal the problem.
    Also, some graphical programs have many interesting and useful command line options.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Signals


    The kill command is used to “kill” programs. This allows us to terminate programs
    that need killing. Here’s an example:


    ```

    [me@linuxbox ~]$ xlogo &

    [1] 28401

    [me@linuxbox ~]$ kill 28401

    [1]+  Terminated              xlogo

    ```


    We first launch xlogo in the background. The shell prints the jobspec and the
    PID of the background process. Next, we use the kill command and specify the PID
    of the process we want to terminate. We could have also specified the process
    using a jobspec (for example, “%1”) instead of a PID.


    While this is all very straightforward, there is more to it than that. The kill
    command doesn’t exactly “kill” programs, rather it sends them signals. Signals
    are one of several ways that the operating system communicates with programs.
    We have already seen signals in action with the use of Ctrl-c and Ctrl-z. When
    the terminal receives one of these keystrokes, it sends a signal to the program
    in the foreground. In the case of Ctrl-c, a signal called INT (Interrupt) is sent;
    with Ctrl-z, a signal called TSTP (Terminal Stop.) Programs, in turn, “listen”
    for signals and may act upon them as they are received. The fact that a program
    can listen and act upon signals allows a program to do things like save work in
    progress when it is sent a termination signal.


    # Sending Signals To Processes With kill


    The kill command is used to send signals to programs. Its most common syntax looks
    like this:


    ```

    kill [-signal] PID...

    ```


    If no signal is specified on the command line, then the TERM (Terminate) signal
    is sent by default. The kill command is most often used to send the following
    signals:


    Table 11-4: Common Signals


    | Number | Name | Meaning |

    |---|---|---|

    | 1 | HUP | Hangup. This is a vestige of the good old days when terminals were
    attached to remote |'
