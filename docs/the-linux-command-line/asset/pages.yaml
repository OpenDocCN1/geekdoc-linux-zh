    # Change umask to make directory sharing easier

    umask 0002


    # Ignore duplicates in command history and increase

    # history size to 1000 lines

    export HISTCONTROL=ignoredups

    export HISTSIZE=1000


    # Add some helpful aliases

    alias l=''ls -d .* --color=auto''

    alias ll=''ls -l --color=auto''

    ```


    Ah, much better! With our changes complete, type Ctrl-o to save our modified .bashrc
    file, and Ctrl-x to exit nano.


    # Why Comments Are Important


    Whenever you modify configuration files it''s a good idea to add some comments
    to document your changes. Sure, you will remember what you changed tomorrow, but
    what about six months from now? Do yourself a favor and add some comments. While
    you''re at it, it''s not a bad idea to keep a log of what changes you make.


    Shell scripts and bash startup files use a "#" symbol to begin a comment. Other
    configuration files may use other symbols. Most configuration files will have
    comments. Use them as a guide.


    You will often see lines in configuration files that are commented out to prevent
    them from being used by the affected program. This is done to give the reader
    suggestions for possible configuration choices or examples of correct configuration
    syntax. For example, the .bashrc file of Ubuntu 8.04 contains these lines:


    ```

    # some more ls aliases

    #alias ll=''ls -l''

    #alias la=''ls -A''

    #alias l=''ls -CF''

    ```


    The last three lines are valid alias definitions that have been commented out.
    If you remove the leading "#" symbols from these three lines, a technique called
    uncommenting, you will activate the aliases. Conversely, if you add a "#" symbol
    to the beginning of a line, you can deactivate a configuration line while preserving
    the information it contains.'
