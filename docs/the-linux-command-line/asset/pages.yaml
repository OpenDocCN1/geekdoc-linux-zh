- pgno: 470
  md: '# 35 – Strings And Numbers


    Computer programs are all about working with data. In past chapters, we have focused
    on processing data at the file level. However, there are many programming problems
    that need to be solved using smaller units of data such as strings and numbers.


    In this chapter, we will look at several shell features that are used to manipulate
    strings and numbers. The shell provides a variety of parameter expansions that
    perform string operations. In addition to arithmetic expansion (which we touched
    upon in Chapter 8), there is a common command line program called bc, which performs
    higher level math.


    # Parameter Expansion


    Though parameter expansion came up in Chapter 8, we did not cover it in detail
    because most parameter expansions are used in scripts rather than on the command
    line. We have already worked with some forms of parameter expansion; for example,
    shell variables. The shell provides many more.


    # Basic Parameters


    The simplest form of parameter expansion is reflected in the ordinary use of variables.
    For example:


    ```

    $a

    ```


    when expanded, becomes whatever the variable a contains. Simple parameters may
    also be surrounded by braces:


    ```

    ${a}

    ```


    This has no effect on the expansion, but is required if the variable is adjacent
    to other text, which may confuse the shell. In this example, we attempt to create
    a filename by appending the string "_file" to the contents of the variable a.


    ```

    [me@linuxbox ~]$ a="foo"

    [me@linuxbox ~]$ echo "$a_file"

    ```'
  merge: -1
  img_proc: true
- pgno: 471
  md: 'If we perform this sequence, the result will be nothing, because the shell
    will try to expand a variable named a_file rather than a. This problem can be
    solved by adding braces:


    ```

    [me@linuxbox ~]$ echo "${a}_file"

    foo_file

    ```


    We have also seen that positional parameters greater than 9 can be accessed by
    surrounding the number in braces. For example, to access the eleventh positional
    parameter, we can do this:


    ${11}


    # Expansions To Manage Empty Variables


    Several parameter expansions deal with nonexistent and empty variables. These
    expansions are handy for handling missing positional parameters and assigning
    default values to parameters.


    ${parameter:-word}


    If parameter is unset (i.e., does not exist) or is empty, this expansion results
    in the value of word. If parameter is not empty, the expansion results in the
    value of parameter.


    ```

    [me@linuxbox ~]$ foo=

    [me@linuxbox ~]$ echo ${foo:-"substitute value if unset"}

    substitute value if unset

    [me@linuxbox ~]$ echo $foo


    [me@linuxbox ~]$ foo=bar

    [me@linuxbox ~]$ echo ${foo:-"substitute value if unset"}

    bar

    [me@linuxbox ~]$ echo $foo

    bar

    ```


    ${parameter:=word}


    If parameter is unset or empty, this expansion results in the value of word. In
    addition, the value of word is assigned to parameter. If parameter is not empty,
    the expansion results in the value of parameter.


    ```

    [me@linuxbox ~]$ foo=

    [me@linuxbox ~]$ echo ${foo:="default value if unset"}

    ```'
  merge: -1
  img_proc: true
- pgno: 472
  md: '```

    default value if unset

    [me@linuxbox ~]$ echo $foo

    default value if unset

    [me@linuxbox ~]$ foo=bar

    [me@linuxbox ~]$ echo ${foo:="default value if unset"}

    bar

    [me@linuxbox ~]$ echo $foo

    bar

    ```


    Note: Positional and other special parameters cannot be assigned this way.


    # ${parameter:?word}


    If parameter is unset or empty, this expansion causes the script to exit with
    an error, and the contents of word are sent to standard error. If parameter is
    not empty, the expansion results in the value of parameter.


    ```

    [me@linuxbox ~]$ foo=

    [me@linuxbox ~]$ echo ${foo:?"parameter is empty"}

    bash: foo: parameter is empty

    [me@linuxbox ~]$ echo $?

    1

    [me@linuxbox ~]$ foo=bar

    [me@linuxbox ~]$ echo ${foo:?"parameter is empty"}

    bar

    [me@linuxbox ~]$ echo $?

    0

    ```


    # ${parameter:+word}


    If parameter is unset or empty, the expansion results in nothing. If parameter
    is not empty, the value of word is substituted for parameter; however, the value
    of parameter is not changed.


    ```

    [me@linuxbox ~]$ foo=

    [me@linuxbox ~]$ echo ${foo:+"substitute value if set"}


    [me@linuxbox ~]$ foo=bar

    [me@linuxbox ~]$ echo ${foo:+"substitute value if set"}

    substitute value if set

    ```'
