- pgno: 33
  md: '# 4 – Exploring The System


    Now that we know how to move around the file system, it''s time for a guided tour
    of our Linux system. Before we start however, we''re going to learn some more
    commands that will be useful along the way:


    +   - ls – List directory contents

    +   - file – Determine file type

    +   - less – View file contents


    # More Fun With ls


    The ls command is probably the most used command, and for good reason. With it,
    we can see directory contents and determine a variety of important file and directory
    attributes. As we have seen, we can simply type ls to see a list of files and
    subdirectories contained in the current working directory:


    ```

    [me@linuxbox ~]$ ls

    Desktop  Documents  Music  Pictures  Public  Templates  Videos

    ```


    Besides the current working directory, we can specify the directory to list, like
    so:


    ```

    me@linuxbox ~]$ ls /usr

    bin  games  kerberos  libexec  sbin  src

    etc  include  lib  local  share  tmp

    ```


    Or even specify multiple directories. In this example we will list both the user''s
    home directory (symbolized by the "~" character) and the /usr directory:


    ```

    [me@linuxbox ~]$ ls ~ /usr

    /home/me:

    ```'
  merge: -1
  img_proc: true
- pgno: 34
  md: '```

    Desktop  Documents  Music  Pictures  Public  Templates  Videos


    /usr:

    bin  games  kerberos  libexec  sbin  src

    etc  include  lib  local  share  tmp

    ```


    We can also change the format of the output to reveal more detail:


    ```

    [me@linuxbox ~]$ ls -l

    total 56

    drwxrwxr-x 2 me me 4096 2007-10-26 17:20 Desktop

    drwxrwxr-x 2 me me 4096 2007-10-26 17:20 Documents

    drwxrwxr-x 2 me me 4096 2007-10-26 17:20 Music

    drwxrwxr-x 2 me me 4096 2007-10-26 17:20 Pictures

    drwxrwxr-x 2 me me 4096 2007-10-26 17:20 Public

    drwxrwxr-x 2 me me 4096 2007-10-26 17:20 Templates

    drwxrwxr-x 2 me me 4096 2007-10-26 17:20 Videos

    ```


    By adding “-l” to the command, we changed the output to the long format.


    # Options And Arguments


    This brings us to a very important point about how most commands work. Commands
    are often followed by one or more options that modify their behavior, and further,
