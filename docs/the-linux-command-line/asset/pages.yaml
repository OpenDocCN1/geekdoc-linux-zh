- pgno: 366
  md: '```

    de.mo      diction.texi.in  INSTALL      README

    ```


    Among the files, we see diction and style, the programs that we set out to build.
    Congratulations are in order! We just compiled our first programs from source
    code!


    But just out of curiosity, let’s run make again:


    ```

    [me@linuxbox diction-1.11]$ make

    make: Nothing to be done for `all''.

    ```


    It only produces this strange message. What’s going on? Why didn’t it build the
    program again? Ah, this is the magic of make. Rather than simply building everything
    again, make only builds what needs building. With all of the targets present,
    make determined that there was nothing to do. We can demonstrate this by deleting
    one of the targets and running make again to see what it does. Let’s get rid of
    one of the intermediate targets:


    ```

    [me@linuxbox diction-1.11]$ rm getopt.o

    [me@linuxbox diction-1.11]$ make

    ```


    We see that make rebuilds it and re-links the diction and style programs, since
    they depend on the missing module. This behavior also points out another important
    feature of make: it keeps targets up to date. make insists that targets be newer
    than their dependencies. This makes perfect sense, as a programmer will often
    update a bit of source code and then use make to build a new version of the finished
    product. make ensures that everything that needs building based on the updated
    code is built. If we use the touch program to “update” one of the source code
    files, we can see this happen:


    ```

    [me@linuxbox diction-1.11]$ ls -l diction getopt.c

    -rwxr-xr-x 1 me     me       37164 2009-03-05 06:14 diction

    -rw-r--r-- 1 me     me       33125 2007-03-30 17:45 getopt.c

    [me@linuxbox diction-1.11]$ touch getopt.c

    [me@linuxbox diction-1.11]$ ls -l diction getopt.c

    -rwxr-xr-x 1 me     me       37164 2009-03-05 06:14 diction

    -rw-r--r-- 1 me     me       33125 2009-03-05 06:23 getopt.c

    [me@linuxbox diction-1.11]$ make

    ```


    After make runs, we see that it has restored the target to being newer than the
    dependency:'
