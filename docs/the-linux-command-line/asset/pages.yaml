- pgno: 392
  md: "```\n13  funct\n14  echo \"Step 3\"\n```\n\nAs the shell reads the script,\
    \ it passes over lines 1 through 11, as those lines consist of comments and the\
    \ function definition. Execution begins at line 12, with an echo command. Line\
    \ 13 calls the shell function funct and the shell executes the function just as\
    \ it would any other command. Program control then moves to line 6, and the second\
    \ echo command is executed. Line 7 is executed next. Its return command terminates\
    \ the function and returns control to the program at the line following the function\
    \ call (line 14), and the final echo command is executed. Note that in order for\
    \ function calls to be recognized as shell functions and not interpreted as the\
    \ names of external programs, shell function definitions must appear in the script\
    \ before they are called.\n\nWe’ll add minimal shell function definitions to our\
    \ script:\n\n```\n#!/bin/bash\n\n# Program to output a system information page\n\
    \nTITLE=\"System Information Report For $HOSTNAME\"\nCURRENT_TIME=$(date +\"%x\
    \ %r %Z\")\nTIME_STAMP=\"Generated $CURRENT_TIME, by $USER\"\n\nreport_uptime\
    \ () {\n    return\n}\n\nreport_disk_space () {\n    return\n}\n\nreport_home_space\
    \ () {\n    return\n}\n\ncat << _EOF_\n<HTML>\n    <HEAD>\n        <TITLE>$TITLE</TITLE>\n\
    \    </HEAD>\n    <BODY>\n        <H1>$TITLE</H1>\n        <P>$TIME_STAMP</P>\n\
    \        $(report_uptime)\n        $(report_disk_space)\n```"
