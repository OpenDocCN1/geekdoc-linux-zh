    # Reverting To Traditional Collation Order


    You can opt to have your system use the traditional (ASCII) collation order by
    changing the value of the LANG environment variable. As we saw above, the LANG
    variable contains the name of the language and character set used in your locale.
    This value was originally determined when you selected an installation language
    as your Linux was installed.


    To see the locale settings, use the locale command:


    ```

