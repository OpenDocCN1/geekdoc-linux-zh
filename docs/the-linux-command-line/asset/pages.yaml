- pgno: 173
  md: '# 14 – Customizing The Prompt


    In this chapter we will look at a seemingly trivial detail—our shell prompt. This
    examination will reveal some of the inner workings of the shell and the terminal
    emulator program itself.


    Like so many things in Linux, the shell prompt is highly configurable, and while
    we have pretty much taken it for granted, the prompt is a really useful device
    once we learn how to control it.


    # Anatomy Of A Prompt


    Our default prompt looks something like this:


    ```

    [me@linuxbox ~]$

    ```


    Notice that it contains our user name, our host name and our current working directory,
    but how did it get that way? Very simply, it turns out. The prompt is defined
    by an environment variable named PS1 (short for “prompt string one”). We can view
    the contents of PS1 with the echo command:


    ```

    [me@linuxbox ~]$ echo $PS1

    [\u@\h \W]\$

    ```


    > Note: Don''t worry if your results are not exactly the same as the example above.
    Every Linux distribution defines the prompt string a little differently, some
    quite exotically.


    From the results, we can see that PS1 contains a few of the characters we see
    in our prompt such as the brackets, the at-sign, and the dollar sign, but the
    rest are a mystery. The astute among us will recognize these as backslash-escaped
    special characters like'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'those we saw in Chapter 8. Here is a partial list of the characters that the
    shell treats specially in the prompt string:


    # Table 14-1: Escape Codes Used In Shell Prompts


    | Sequence | Value Displayed |

    |---|---|

    | \a | ASCII bell. This makes the computer beep when it is encountered. |

    | \d | Current date in day, month, date format. For example, “Mon May 26.” |

    | \h | Host name of the local machine minus the trailing domain name. |

    | \H | Full host name. |

    | \j | Number of jobs running in the current shell session. |

    | \l | Name of the current terminal device. |

    | \n | A newline character. |

    | \r | A carriage return. |

    | \s | Name of the shell program. |

    | \t | Current time in 24 hour hours:minutes:seconds format. |

    | \T | Current time in 12 hour format. |

    | \@ | Current time in 12 hour AM/PM format. |

    | \A | Current time in 24 hour hours:minutes format. |

    | \u | User name of the current user. |

    | \v | Version number of the shell. |

    | \V | Version and release numbers of the shell. |

    | \w | Name of the current working directory. |

    | \W | Last part of the current working directory name. |

    | \! | History number of the current command. |

    | \# | Number of commands entered into this shell session. |

    | \$ | This displays a “$” character unless you have superuser privileges. In
    that case, it displays a “#” instead. |

    | \[ | Signals the start of a series of one or more non-printing characters. This
    is used to embed non-printing control characters which manipulate the terminal
    emulator in some way, such as moving the |'
