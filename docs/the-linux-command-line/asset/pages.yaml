    We first removed any old copy of foo.txt to make sure we were starting fresh.
    Next, we ran the umask command without an argument to see the current value. It
    responded with the value 0002 (the value 0022 is another common default value),
    which is the octal representation of our mask. We next create a new instance of
    the file foo.txt and observe its permissions.


