- pgno: 232
  md: 'are not 0700. Fortunately, find provides a way to combine tests using logical
    operators to create more complex logical relationships. To express the aforementioned
    test, we could do this:


    ```

    [me@linuxbox ~]$ find ~ \( -type f -not -perm 0600 \) -or \( -type d -not -perm
    0700 \)

    ```


    Yikes! That sure looks weird. What is all this stuff? Actually, the operators
    are not that complicated once you get to know them. Here is the list:


    # Table 18-4: find Logical Operators


    | Operator | Description |

    |---|---|

    | -and | Match if the tests on both sides of the operator are true. May be shortened
    to -a. Note that when no operator is present, -and is implied by default. |

    | -or | Match if a test on either side of the operator is true. May be shortened
    to -o. |

    | -not | Match if the test following the operator is false. May be abbreviated
    with an exclamation point (!). |

    | ( ) | Groups tests and operators together to form larger expressions. This is
    used to control the precedence of the logical evaluations. By default, find evaluates
    from left to right. It is often necessary to override the default evaluation order
    to obtain the desired result. Even if not needed, it is helpful sometimes to include
    the grouping characters to improve readability of the command. Note that since
    the parentheses characters have special meaning to the shell, they must be quoted
    when using them on the command line to allow them to be passed as arguments to
    find. Usually the backslash character is used to escape them. |


    With this list of operators in hand, let’s deconstruct our find command. When
    viewed from the uppermost level, we see that our tests are arranged as two groupings
    separated by an -or operator:


    ```

    ( expression 1 ) -or ( expression 2 )

    ```'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# 18 – Searching For Files


    This makes sense, since we are searching for files with a certain set of permissions
    and for directories with a different set. If we are looking for both files and
    directories, why do we use -or instead of -and? Because as find scans through
    the files and directories, each one is evaluated to see if it matches the specified
    tests. We want to know if it is either a file with bad permissions or a directory
    with bad permissions. It can’t be both at the same time. So if we expand the grouped
    expressions, we can see it this way:


    ```

    ( file with bad perms ) -or ( directory with bad perms )

    ```


    Our next challenge is how to test for “bad permissions.” How do we do that? Actually
    we don’t. What will test for is “not good permissions,” since we know that “good
    permissions” are. In the case of files, we define good as 0600 and for directories,
    as 0711. The expression that will test files for “not good” permissions is:


    ```

    -type f -and -not -perms 0600

    ```


    and for directories:


    ```

    -type d -and -not -perms 0700

    ```


    As noted in the table of operators above, the -and operator can be safely removed,
    since it is implied by default. So if we put this all back together, we get our
    final command:


    ```

    find ~ ( -type f -not -perms 0600 ) -or ( -type d -not -perms 0700 )

    ```


    However, since the parentheses have special meaning to the shell, we must escape
    them to prevent the shell from trying to interpret them. Preceding each one with
    a backslash character does the trick.


    There is another feature of logical operators that is important to understand.
    Let’s say that we have two expressions separated by a logical operator:


    ```

    expr1 -operator expr2

    ```


    In all cases, expr1 will always be performed; however the operator will determine
    if expr2 is performed. Here’s how it works:


    *Table 18-5: find AND/OR Logic*


    | Results of expr1 | Operator | expr2 is... |

    |---|---|---|

    | True | -and | Always performed |

    | False | -and | Never performed |

    | True | -or | Never performed |

    | False | -or | Always performed |'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'Why does this happen? It’s done to improve performance. Take -and, for example.
    We know that the expression expr1 -and expr2 cannot be true if the result of expr1
    is false, so there is no point in performing expr2. Likewise, if we have the expression
    expr1 -or expr2 and the result of expr1 is true, there is no point in performing
    expr2, as we already know that the expression expr1 -or expr2 is true.


    OK, so it helps it go faster. Why is this important? It’s important because we
    can rely on this behavior to control how actions are performed, as we shall soon
    see..


    # Predefined Actions


    Let’s get some work done! Having a list of results from our find command is useful,
    but what we really want to do is act on the items on the list. Fortunately, find
    allows actions to be performed based on the search results. There are a set of
    predefined actions and several ways to apply user-defined actions. First let’s
    look at a few of the predefined actions:


    Table 18-6: Predefined find Actions


    | Action | Description |

    |---|---|

    | -delete | Delete the currently matching file. |

    | -ls | Perform the equivalent of ls -dil s on the matching file. Output is sent
    to standard output. |

    | -print | Output the full pathname of the matching file to standard output. This
    is the default action if no other action is specified. |

    | -quit | Quit once a match has been made. |


    As with the tests, there are many more actions. See the find man page for full
    details.


    In our very first example, we did this:


    ```

    find ~

    ```


    which produced a list of every file and subdirectory contained within our home
    directory. It produced a list because the -print action is implied if no other
    action is specified. Thus our command could also be expressed as:'
  merge: -1
  img_proc: true
- pgno: 235
  md: '```

    find ~ -print

    ```


    We can use find to delete files that meet certain criteria. For example, to delete
    files that have the file extension “.BAK” (which is often used to designate backup
    files), we could use this command:


    ```

    find ~ -type f -name ''*.BAK'' -delete

    ```


    In this example, every file in the user’s home directory (and its subdirectories)
    is searched for filenames ending in .BAK. When they are found, they are deleted.


    > Warning: It should go without saying that you should use extreme caution when
    using the -delete action. Always test the command first by substituting the -print
    action for -delete to confirm the search results.


    Before we go on, let’s take another look at how the logical operators affect actions.
    Consider the following command:


    ```

    find ~ -type f -name ''*.BAK'' -print

    ```


    As we have seen, this command will look for every regular file (-type f) whose
    name ends with .BAK (-name ''*.BAK'') and will output the relative pathname of
    each matching file to standard output (-print). However, the reason the command
    performs the way it does is determined by the logical relationships between each
    of the tests and actions. Remember, there is, by default, an implied -and relationship
    between each test and action. We could also express the command this way to make
    the logical relationships easier to see:


    ```

    find ~ -type f -and -name ''*.BAK'' -and -print

    ```


    With our command fully expressed, let’s look at how the logical operators affect
    its execution:


    | Test/Action | Is Performed Only If... |

    | -print | -type f and -name ''*.BAK'' are true |'
  merge: -1
  img_proc: true
