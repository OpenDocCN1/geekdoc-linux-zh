- pgno: 306
  md: 'character-based search-and-replace operation. Transliteration is the process
    of changing characters from one alphabet to another. For example, converting characters
    from lowercase to uppercase is transliteration. We can perform such a conversion
    with tr as follows:


    ```

    [me@linuxbox ~]$ echo "lowercase letters" | tr a-z A-Z

    LOWERCASE LETTERS

    ```


    As we can see, tr operates on standard input, and outputs its results on standard
    output. tr accepts two arguments: a set of characters to convert from and a corresponding
    set of characters to convert to. Character sets may be expressed in one of three
    ways:


    +   1. An enumerated list. For example, ABCDEFGHIJKLMNOPQRSTUVWXYZ

    +   2. A character range. For example, A-Z. Note that this method is sometimes
    subject to the same issues as other commands, due to the locale collation order,
    and thus should be used with caution.

    +   3. POSIX character classes. For example, [:upper:].


    In most cases, both character sets should be of equal length; however, it is possible
    for the first set to be larger than the second, particularly if we wish to convert
    multiple characters to a single character:


    ```

    [me@linuxbox ~]$ echo "lowercase letters" | tr [:lower:] A

    AAAAAAAAA AAAAAAA

    ```


    In addition to transliteration, tr allows characters to simply be deleted from
    the input stream. Earlier in this chapter, we discussed the problem of converting
    MS-DOS text files to Unix style text. To perform this conversion, carriage return
    characters need to be removed from the end of each line. This can be performed
    with tr as follows:


    tr -d ''\r'' < dos_file > unix_file


    where dos_file is the file to be converted and unix_file is the result. This form
    of the command uses the escape sequence \r to represent the carriage return character.
    To see a complete list of the sequences and character classes tr supports, try:


    ```

    [me@linuxbox ~]$ tr --help

    ```'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# ROT13: The Not-So-Secret Decoder Ring


    One amusing use of tr is to perform ROT13 encoding of text. ROT13 is a trivial
    type of encryption based on a simple substitution cipher. Calling ROT13 “encryption”
    is being generous; “text obfuscation” is more accurate. It is used sometimes on
    text to obscure potentially offensive content. The method simply moves each character
    thirteen places up the alphabet. Since this is half way up the possible twenty-six
    characters, performing the algorithm a second time on the text restores it to
    its original form. To perform this encoding with tr:


    ```

    echo "secret text" | tr a-zA-Z n-za-mN-ZA-M

    frperg grkg

    ```


    Performing the same procedure a second time results in the translation:


    ```

    echo "frperg grkg" | tr a-zA-Z n-za-mN-ZA-M

    secret text

    ```


    A number of email programs and USENET news readers support ROT13 encoding. Wikipedia
    contains a good article on the subject:

    http://en.wikipedia.org/wiki/ROT13


    tr can perform another trick, too. Using the -s option, tr can “squeeze” (delete)
    repeated instances of a character:


    ```

    [me@linuxbox ~]$ echo "aaabbbccc" | tr -s ab

    abccc

    ```


    Here we have a string containing repeated characters. By specifying the set “ab”
    to tr, we eliminate the repeated instances of the letters in the set, while leaving
    the character that is missing from the set (“c”) unchanged. Note that the repeating
    characters must be adjoining. If they are not:


    ```

    [me@linuxbox ~]$ echo "abcabcabc" | tr -s ab

    abcabcabc

    ```


    the squeezing will have no effect.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# sed


    The name sed is short for stream editor. It performs text editing on a stream
    of text, either a set of specified files or standard input. sed is a powerful
    and somewhat complex program (there are entire books about it), so we will not
    cover it completely here.


    In general, the way that sed works is that it is given either a single editing
    command (on the command line) or the name of a script file containing multiple
    commands, and it then performs these commands upon each line in the stream of
    text. Here is a very simple example of sed in action:


    ```

    [me@linuxbox ~]$ echo "front" | sed ''s/front/back/''

    back

    ```


    In this example, we produce a one word stream of text using echo and pipe it into
    sed. sed, in turn, carries out the instruction s/front/back/ upon the text in
    the stream and produces the output "back" as a result. We can also recognize this
    command as resembling the "substitution" (search and replace) command in vi.


    Commands in sed begin with a single letter. In the example above, the substitution
    command is represented by the letter s and is followed by the search and replace
    strings, separated by the slash character as a delimiter. The choice of the delimiter
    character is arbitrary. By convention, the slash character is often used, but
    sed will accept any character that immediately follows the command as the delimiter.
    We could perform the same command this way:


    ```

    [me@linuxbox ~]$ echo "front" | sed ''s_front_back_''

    back

    ```


    By using the underscore character immediately after the command, it becomes the
    delimiter. The ability to set the delimiter can be used to make commands more
    readable, as we shall see.


    Most commands in sed may be preceded by an address, which specifies which line(s)
    of the input stream will be edited. If the address is omitted, then the editing
    command is carried out on every line in the input stream. The simplest form of
    address is a line number. We can add one to our example:


    ```

    [me@linuxbox ~]$ echo "front" | sed ''1s/front/back/''

    back

    ```'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'Adding the address 1 to our command causes our substitution to be performed
    on the first line of our one-line input stream. If we specify another number:


    ```

    [me@linuxbox ~]$ echo "front" | sed ''2s/front/back/''

    front

    ```


    we see that the editing is not carried out, since our input stream does not have
    a line two.


    Addresses may be expressed in many ways. Here are the most common:


    Table 21-7: sed Address Notation


    | Address | Description |

    |---|---|

    | n | A line number where n is a positive integer. |

    | $ | The last line. |

    | /regexp/ | Lines matching a POSIX basic regular expression. Note that the regular
    expression is delimited by slash characters. Optionally, the regular expression
    may be delimited by an alternate character, by specifying the expression with
    \cregexpc, where c is the alternate character. |

    | addr1,addr2 | A range of lines from addr1 to addr2, inclusive. Addresses may
    be any of the single address forms above. |

    | first~step | Match the line represented by the number first, then each subsequent
    line at step intervals. For example 1~2 refers to each odd numbered line, 5~5
    refers to the fifth line and every fifth line thereafter. |

    | addr1,+n | Match addr1 and the following n lines. |

    | addr! | Match all lines except addr, which may be any of the forms above. |


    We’ll demonstrate different kinds of addresses using the distros.txt file from
    earlier in this chapter. First, a range of line numbers:


    ```

    [me@linuxbox ~]$ sed -n ''1,5p'' distros.txt

    SUSE 10.2 12/07/2006

    Fedora 10 11/25/2008

    SUSE 11.0 06/19/2008

    ```'
  merge: -1
