    # Programmable Completion


    Recent versions of bash have a facility called programmable completion. Programmable
    completion allows you (or more likely, your distribution provider) to add additional
    completion rules. Usually this is done to add support for specific applications.
    For example it is possible to add completions for the option list of a command
    or match particular file types that an application supports. Ubuntu has a fairly
    large set defined by default. Programmable completion is implemented by shell
    functions, a kind of mini shell script that we will cover in later chapters. If
    you are curious, try:


