  md: "![](img/82794ff9433a50ada079e99ce57c4c4f_392_0.png)\n\n# # Get Certified!\n\
    \nCertification in one or more of Corel's world-class applications informs current\
    \ or prospective employers of your proficiency and helps to enhance your marketability\
    \ in today's competitive business world.\n\nAs a Corel-Certified candidate, you\
    \ will enjoy the following benefits:\n\n+   - official recognition from Corel\n\
    +   - validation of your proficiency in a specific software application\n+   -\
    \ a certificate stating your credentials\n+   - Corel product discounts\n+   -\
    \ use of the Corel Certification Program logo\n\nIf your organization uses WordPerfect\
    \ or CorelDRAW, consider certifying your employees in one or more of these suites\
    \ applications, including WordPerfect, Quattro Pro, Corel Presentations, CorelDRAW\
    \ and Corel PHOTO-PAINT.\n\nCorel has enhanced its certification program by offering\
    \ application-simulated exams delivered over the Web using the latest technology.\
    \ This means that, instead of answering multiple choice questions and memorizing\
    \ menus, you will be tested within the application and assessed on your ability\
    \ to perform simulated day-to-day tasks. Each exam consists of 40 to 60 questions\
    \ and has a suggested retail price of $50 US.\n\nAnd this coupon now makes certification\
    \ at any level an excellent value!\n\n## Your $10 instant discount\n\nForm and\
    \ present it to a participating Corel 'testing Center' prior to taking a Corel\
    \ exam.\n\n- Dec. 31, 2000\n- You must be received by your Corel Approved testing\
    \ Center by Jan. 31, 2001\n- $ ( ) voucher per person per test\n- Valid only in\
    \ the United States and Canada\n- Will not be void where prohibited by law\n-\
    \ Cannot be combined with any other promotions\n- Will be issued in the currency\
    \ in which the exam is taken\n\nLocating Testing Centers only\n\ncore.com/webtraining\
    \ for a list of Corel Approved Testing Centers in your area, or for details on\
    \ the Corel Certification Program.\n\n**Note**: Information should be used in\
    \ the following order: Title, Date, State, City, Zip/Postal Code, Tel, E-mail,\
    \ Name, Address\n\nPlease print clearly.\n\nName:  \n\nAddress:  \n\nCity: State:\
    \  \n\nZip/Postal Code: Tel:  \n\nE-mail:\n\n![](img/82794ff9433a50ada079e99ce57c4c4f_392_1.png)\n\
    \n> From this time we provide you customers with information about Corel, its\
    \ products and services. We may contact you regarding the following products/services:\
    \ software products or services, hardware, third-party products or services. These\
    \ communications may include: product updates, promotions, and special offers.\
    \ You may opt out of the mailing list by calling 1-800-250-3446 in North America,\
    \ or 416-250-3550 outside North America. We will use your e-mail to send you news\
    \ from the Corel Corporation about products and services we think would be of\
    \ interest to you. Your personal information will not be sold or shared with third\
    \ parties. For more information on Corel's privacy policy, please visit us online\
    \ at www.corel.com/en_privacy."
