  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_81_0.png)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_81_1.png)


    3. Click Next and then select the manufacturer and printer model from the drop-down
    lists, as shown in Figure 4-7.'
  merge: -1
