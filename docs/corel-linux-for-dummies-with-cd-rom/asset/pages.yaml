- pgno: 83
  md: '+   6.  If you have more than one printer and want to change the default printer
    used by your Linux applications, select the printer and click Set as Default.

    +   7.  Click OK to keep your new printer setup.


    You should now be able to use your printer from most Linux applications. Test
    it out by using the Text Editor in the panel.


    # Connecting to the Internet


    You *do* want to connect to the Internet, right? And you do have an idea of what
    it is, like some super-stupendous network that in some mysterious way lets millions
    of folks all over the world


    +   - E-mail letters with attached photos

    +   - Chat (not on camera, please!)

    +   - Discuss

    +   - Conspire

    +   - Research

    +   - Shop

    +   - Form beautiful (and sometimes cantankerous) relationships


    In one way or another, we''re all getting connected, either through an Internet
    dial-up connection, a network, or (if you''re so lucky) some other high-speed
    connection, such as ISDN, cable, DSL, fiber optics, or satellite.


    I can''t cover all the high-speed possibilities, and they mostly come with some
    high-powered setup help anyway, such as your next-door neighbor''s high-school
    kid. I stick to the dial-up (modem) access that most of us have (sigh), and see
    how to hook into a network further on.


    # Essential dial-up hardware


    Stripped down to the bare essentials, a dial-up connection requires


    +   - A Linux-compatible modem to transmit and receive data

    +   - A telephone line'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'I know, I know, a telephone line''s pretty obvious. (Please, no dumb technical-support-call
    jokes about the woman — never a man! — who uses the mouse as a foot pedal.) What''s
    not so obvious is not only what you might want to spring for a separate line if
    you plan to use the Internet a lot. And who doesn''t? The nice thing about a lot
    of high-speed options is that they combine phone (voice) and data in one.


    As for the modem, most computers come with them nowadays, so you''re likely to
    have an *internal* one, buried somewhere in your computer''s inards. You''ll also
    see *external* modems that plug into one of your machine''s outlets, like a serial
    port or a USB connection. Then there''s the PCMCIA modem on a little PC card,
    used mainly with portable PCs.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_84_0.png)


    External modems are a bit more expensive, and I find their external wires to be
    a pain. Looks like a snake pit behind my computer as it is! That said, you''ll
    rarely have a problem configuring Corel Linux to use an external modem.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_84_1.png)


    If you have an ISDN modem, you have to recompile the kernel to enable support
    for ISDN (and any specific hardware). After that, you can use Corel Update to
    download and install the ISDN utility package.


    # Another essential: Your ISP


    If you''re dialing into the Internet, who''re you gonna call? That''ll be your
    friendly *Internet Service Provider* (ISP) who hooks you up to e-mail, browsing,
    and other Web services. If you don''t have an ISP, you might check with your friends
    and neighbors for the best bets in your area.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_84_2.png)


    Dialing into a local network, say from your home to the office, is much like dialing
    an ISP, so the same principles apply.


    Your ISP will supply you with the essential setup information. Normally this entails


    +   - A phone number to dial for access.

    +   - The alphabetic domain name of your ISP.

    +   - Primary and secondary Domain Name Server (DNS) numbers, in the 123.456.789.0
    format.

    +   - Your login ID and password.

    +   - Your e-mail address, usually in the form *username@domain name*. The username
    is often the same as the login ID.'
  merge: -1
  img_proc: true
- pgno: 85
