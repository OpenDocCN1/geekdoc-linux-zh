- pgno: 66
  md: '# ## Logging in as root


    As a rule, avoid logging in as the root superuser because this gives you the power
    to screw up critical system files. Log on as plain dick or jane when you''re not
    performing system tasks. This type of system security is an unknown concept in
    the land of Windows 95/98.


    I usually let you know whenever root access is required, such as to add a user
    or change your boot defaults. In some cases, it''s not obvious that you have to
    log in as root. For example, as a longtime Windows user, it took me a while to
    figure out that I had to log in as root to add fonts to WordPerfect 8.


    So when you do need root access, get in the habit of logging out when your root
    tasks are finished and then logging back in under your regular user name.


    Where the program is smart enough, you don''t have to log in as root to perform
    a system task. For example, when using Corel Update as a regular user, you''re
    asked to supply the root password for temporary rights to update the system.


    # # Starting Windows or Another OS


    If you have a dual (or multiple) boot machine, simply choose the operating system
    you want from the list when you boot up.


    # # Starting Corel Linux in a DOS/Windows Partition


    If you installed to a DOS/Windows partition, launching Corel Linux is a bit more
    complicated:


    +   1. From Windows, choose Start <> Shut Down and then choose Restart in MS-DOS
    mode.

    +   2. If Corel Linux is installed to a different drive than the one you''re in,
    type d: and press Enter, where d is the name of the drive.

    +   3. Type cd \c\l and press Enter to go to the Corel Linux folder.

    +   4. Type startcrl and press Enter.


    This reboots your computer and starts Corel Linux.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_66_0.png)


    Type Exit in DOS mode to reboot to your normal Windows mode.'
  merge: -1
  img_proc: true
