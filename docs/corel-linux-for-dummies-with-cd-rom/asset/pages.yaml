- pgno: 326
  md: '# # Customizing Your File Manager View


    When you’re in File Manager, click the View menu to alternately display (with
    a check mark) or hide various File Manager elements and types of files, as shown
    in Figure 19-6.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_326_0.png)


    Two important file viewing options are to show hidden files and to show the system,
    not just your personal folders and files. Figure 19-7 shows what File Manager
    looks like when you remove the system from view but reveal the hidden files. See
    Chapter 11 for more File Manager details.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_326_1.png)'
