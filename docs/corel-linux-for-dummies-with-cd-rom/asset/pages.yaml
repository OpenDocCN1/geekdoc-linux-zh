- pgno: 40
  md: '11


    # Born free


    Instead of trying to get rich by selling Linux, Torvalds gave it away. He had
    the foresight to make Linux into a pioneering *open source* operating system that
    anyone can modify, as long as the enhancements are made available to all. Thousands
    of programmers from all over the world joined Linux in his crusade to create a
    sophisticated, complex, and powerful operating system that is forever free.


    Yes, Linux is free. The latest Linux *kernel* (core programs), as well as many
    supporting programs, can always be downloaded free of charge—or $1.95 if you buy
    a CD with a Linux *distribution* (complete package with installation).


    But clever you, you bought this book, so you got the CD with Corel Linux for nothing!
    (If you''re reading this book in the store, you may now proceed to the checkout
    counter.)


    # No more software criminals


    One great result of free software (along with falling hardware prices) is that
    you no longer have to belong to the richest one percent of the world''s population
    to have access to a personal computer. A nation such as Korea, South Africa, or
    Mexico can think about putting computers in all their schools.


    This is an important point for the future of cyber-democracy. When you have to
    pay a $200 software tax to join the ranks of the computing elite, you have a cyber-plutocracy
    instead. You might argue that folks in the Third World can get by with pirated
    software, but isn''t that a sad commentary on our times? You can''t pirate Linux—it''s
    always free!


    Sure, but what about the applications? True, commercial programs and games are
    available for Linux, as they are for any other operating system. But you can legitimately
    get a surprising number of applications for free, and the list grows longer by
    the day. You can get a free Star Office for Linux, complete with a word processor,
    a Web editor, a spreadsheet, a database, and drawing, charting, image editing,
    and mail applications. You can even get a free version of Corel''s venerable WordPerfect
    8 for Linux.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Why Should I Use Linux?


    Linux is powerful and Linux is free, but what can it offer you? Take a look at
    these benefits:


    +   - A true, stable, *multitasking* environment that can run several programs
    at once

    +   - An intuitive, graphical alternative to the Windows and Mac interfaces

    +   - Hundreds of software applications, most of which you can download free of
    charge

    +   - Built-in support for networking and Internet access

    +   - An operating system that runs like greased lightning --- even on an old
    machine


    Linux improvements are being made even as you read this page. If you''re having
    a problem, you can expect to find a fix within hours or days.


    # What''s So Special about Corel Linux?


    Why should you use Corel Linux rather than Red Hat, Mandrake, OpenLinux, or SuSE?
    Glad you asked.


    # Simple to use


    Corel''s Install Express is a snap, and the geeks-only Linux interface is gone.
    You won''t have to identify the chip on your graphics card to get Linux to work,
    and you won''t have to type mind-bending commands such as `mount -t msdos /dev/fd0
    /mnt/floppy` to do the simplest thing. This frees your brain for important things,
    like making a peanut-butter-and-jelly sandwich, and means your desk won''t collapse
    under the weight of a stack of manuals.


    # Smoother than Windows


    Corel gives you a Windows-like desktop, but it''s faster and smoother than Windows!
    You can click away on a graphical interface that is a joy to use and includes
    ingenious file and update managers. Linux veterans will especially appreciate
    many small details that remove the mind-boggling mystery and aggravation of other
    distributions. Your floppy and CD-ROM drives are automatically mounted, and you
    can drag a simple slide bar to adjust your video resolution!'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# The Debian advantage


    What you don''t see is as important as what you do see. Corel Linux is powered
    by Debian GNU/Linux, generally regarded as the purest Linux version available.
    Debian is maintained by volunteers who are dedicated to the "Free Software" ideal
    and put together a distribution meeting the strictest Linux file system standards.
    Debian is rock-solid.


    Debian is also technically superior in how its *packages* (components) are stored
    and organized. They''re sorted in standardized directory structure, in which relationships
    among *packages* are carefully monitored. This assures trouble-free updates that
    no other distribution can provide.


    # Updates don''t get easier than this!


    When you install a Debian package, other packages upon which it depends are also
    automatically installed, and so on down the line. You also have the option of
    updating all your installed packages at once, either from a CD or directly from
    your favorite Internet location. Should your network connection be cut in the
    middle of a download, you can seamlessly pick up from where you left off. The
    knock on Debian was that their package managers were difficult to use, but that
    obstacle''s gone with the graphical Corel Update!


    # The Four Flavors of Corel Linux


    Corel released a free download version of Corel Linux — before the release of
    the packaged versions. It turned into an instant hit, as thousands of users jammed
    the Internet sites hosting the 325MB download.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_42_0.png)


    Your *Corel Linux For Dummies* CD includes the Download Edition of Corel Linux
    plus other goodies described in Table 1-1.


