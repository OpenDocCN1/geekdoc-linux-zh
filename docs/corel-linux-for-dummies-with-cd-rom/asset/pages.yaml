  md: '# # How many desktops did you say?


    Having multiple desktops is a fabulous feature that alone would be worth the price
    of Linux, if it weren''t free. The default four is a reasonable number of desktops,
    but you can have anywhere from two to eight:


    +   1. Right-click a blank spot in the panel and then choose Configure.

    +   2. Click the Desktops tab.

    +   3. In the Visible list, choose the number of desktops you want, as shown in
    Figure 9-24, and then click OK.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_174_0.png)


    > **Figure 9-24:** How many desktops did you say?


    # # Renaming your desktops


    You may rename your desktops (Desktop 1, Desktop 2, and so on) to anything you
    choose — although I''m not sure how doing so would affect the quality of your
    computing life. Right-click a blank spot in the panel and choose Configure. Then
    click the Desktops tab, type the new names, and then click OK.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# # Customizing Window Operations


    Holy smokes! You can customize window operations too. I''m not talking about appearances
    here — beautification is covered in Chapter 10. I''m talking about things that
    affect everyday window operations. These options are all found in the Control
    Center, though their arrangement is somewhat bewildering.


    # ## Setting keyboard window controls


    You can customize the Ctrl+Tab and Alt+Tab keystrokes for walking thorough windows:


    +   1.  **Choose Application Starter Control Center.**

    +   2.  **Double-click Windows and then choose Advanced.**

    +   3.  If you want Ctrl+Tab to walk you through desktops, click to select the
    first option on the Advanced tab, as shown in Figure 9-25.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_175_0.png)'
  merge: -1
  img_proc: true
- pgno: 176
  md: '+   4. If you want **Alt+Tab** to walk you through just the windows in the
    current desktop, click to select the second option.

    +   Otherwise, **Alt+Tab** walks you through all the windows in all the desktops.

    +   The option to use the CDE mode for your **Alt+Tab** walkthroughs doesn''t
    work in the initial release of Corel Linux. Also, leave the Grab the Right Mouse
    Button option checked to allow certain programs to use their own right mouse button
    settings when necessary.

    +   5. When you''ve finished making your selections, click **OK**.


    # Changing how your mouse behaves around windows


    You can change two types of mouse behavior around windows:


    +   What happens when you click various buttons on various window spots

    +   The way windows come into focus as you point to them


    # Retraining your mouse buttons


    You can specify what each mouse button does when you click various places on active
    and inactive windows. Before you start, here are the operational terms:


    +   **Raise** brings the window to the top of the pile.

    +   **Lower** pushes the window down to the bottom.

    +   **Activate** switches the focus from the active window to the one you click.

    +   **Pass click** both activates the window and does the operation on the active
    window with one click.

    +   **Operations** menu gives you a list of all the window tricks you can perform,
    including move, iconify, and sticky.


    To retrain your mouse buttons:


    +   1. Choose **Application Starter Control Center**.

    +   2. **Double-click Windows** and then choose **Mouse**.

    +   The various click operations are displayed, as shown in Figure 9-26.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_176_0.png)'
  merge: -1
  img_proc: true
