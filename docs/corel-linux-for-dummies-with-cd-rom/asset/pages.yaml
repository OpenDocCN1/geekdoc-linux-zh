  md: '# 28  Part I: Leaping to Linux


    ![](img/82794ff9433a50ada079e99ce57c4c4f_57_0.png)


    Figure 2-3: Selecting what to install.


    In most cases, the recommended setup (Install standard desktop) is fine. You can
    always add and remove stuff later (see Chapter 17). If you''re installing the
    standard desktop, go to Step 5 now.


    If you plan to do such expert tasks as setting up a server or creating Linux programs,
    do the following:


    +   1. Click **Show advanced install options** and then click **Next** to view
    the advanced install options shown in Figure 2-4.


    +   2. Click one of the following:


    +   * **Desktop (minimum installation)** to install only the essential Linux and
    desktop components.


    +   * **Desktop Plus (development tools, editors)** to install the default desktop
    plus the workstation environment for developing or modifying programs.


    +   * **Server (Web, file, print, Ftp)** to install all Linux server components,
    including http, ftp, and Samba servers. Includes minimal system components plus
    the development tools.


    +   * **Custom (choose one or more applications)** to choose the precise components,
    known as *packages*, you want to install from various categories.


    # *Step 5: Where do you want to put it?*


    After you''ve selected what to install, you''re ready for the *big* decision:
    where to put the stuff. This decision is *irreversible* and, depending on your
    selection, can wipe out an existing system and its accompanying data. Unless you''re
    using the “Install in DOS/Windows partition” option, Corel Linux grabs all or
    part of your drive and formats it to suit the Linux file system.'
