- pgno: 70
  md: "# My Kingdom for a Command Prompt!\n\nThe graphical interface is a wonderful\
    \ thing, but experienced Linux users often work from the command line. Why? Because\
    \ a number of command-line Linux programs don't have a graphical interface. Plus,\
    \ some utilities offer a lot of command-line options, or parameters, that might\
    \ not be found in the graphical mode. For example, even though my screen capture\
    \ utility has a graphical interface, I find it much quicker and easier to perform\
    \ sophisticated capture operations in command mode.\n\nSometimes you have no choice\
    \ but to use commands, such as when something goes haywire with your graphical\
    \ system. Hey, all Linux once had was the command line, just like DOS in the good\
    \ old days — it's nothing to be afraid of. Indeed, after you perform some magic\
    \ from the command prompt, you'll feel a much closer bond with the operating system.\n\
    \nYou can enter commands from the Corel desktop in two ways:\n\n+   - Click the\
    \ Console button on the panel to enter commands and view their results, as seen\
    \ in Figure 3-7.\n+   \tPress the up arrow to scroll through your previous commands.\n\
    \n![](img/82794ff9433a50ada079e99ce57c4c4f_70_0.png)\n\n+   - Press Alt+F2 (or\
    \ choose Application Starter>Run) and enter the command you want to run, as seen\
    \ in Figure 3-8. (Choose the Run in Terminal Window option to view the results\
    \ in the Console.)\n\n![](img/82794ff9433a50ada079e99ce57c4c4f_70_1.png)"
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Part I: Leaping to Linux


    The Console lets you access the command line in three modes: Linux Console (the
    default), Shell, and Midnight Commander, the revered DOS-like file manager. See
    the Console''s online help for details.


    For details on working with Linux commands, see Appendix A.


    # ## Logging Out of the Desktop and Shutting Down


    You need to log out of the desktop to switch users, shut down the system, or boot
    to another OS:


    +   1. **Choose Application Starter->Logout.**


    Or right-click the desktop and then choose Logout.


    If any applications are running, you might see the warning in Figure 3-9 that
    data might be lost.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_71_0.png)


    +   2. If in doubt, click Cancel to go back and exit the programs gracefully.


    +   3. Click OK to log out.'
