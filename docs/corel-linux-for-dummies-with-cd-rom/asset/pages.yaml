- pgno: 202
  md: '# Chapter 11


    # Managing Your Files


    # In This Chapter


    +   ▶ Seeing out what types of files you have

    +   ▶ Finding out where everything is kept

    +   ▶ Going to your home folder

    +   ▶ Uncovering more than files in File Manager

    +   ▶ Swinging through the folder tree

    +   ▶ Granting file permissions, sorting the folder view, and more

    +   ▶ Renaming, copying, moving, and deleting files and folders — and still more


    A nice thing about computers is that all your documents and files are always within
    easy reach . . . if you can find them. With Corel Linux, you’re in luck because
    it comes with the best file manager in the business. Before you know it, you’ll
    be swinging from branch to branch on your folder tree like a pro!


    The focus of this chapter is the Corel File Manager, but keep in mind that you’ll
    be managing files in plenty of other places as well, such as WordPerfect, the
    Text Editor, and graphics programs.


    # What Kinds of Files Are We Talking About?


    Now, what kinds of files are we talking about? Your system is full of different
    types of files, but some of the more important ones are


    +   ✔ **System files** make everything tick in Corel Linux; they include a number
    of text configuration files.

    +   ✔ **Programs** are the files you use to do stuff.

    +   ✔ Personal **user files** are letters, reports, photographs, and so on.'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'System files are generally off-limits to all but the root user. No need to
    mess with them unless you''re fixing a problem, updating your system, or performing
    some other administrative task, such as managing user accounts.


    > I''ve said this before, but I''ll say it again. Do not log in as root unless
    you absolutely have too. Access to system files gives you the power to screw things
    up.


    Like system files, programs are generally installed and left alone. Although this
    chapter explains where you can find system files and programs, the user files
    are the focus of your day-to-day file management activities.


    # Going Home


    Before you get started with managing files, you should check out how they''re
    organized. Log in as a regular user and then click the **My Home** shortcut on
    your desktop to open File Manager at your home base, as shown in Figure 11-1.
    (If File Manager is already open, click **My Home** in the left pane.)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_203_0.png)'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'You''ll notice a little house in the Address list just below the toolbar, followed
    by /home/username, with your ID as the username.


    Also note how File Manager has two panes: on the left is a tree view of all the
    folders on your system, and on the right is a detailed view of the contents of
    the selected folder. Click Desktop in the tree view to display the contents of
    your Desktop folder.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_204_0.png)


    If you don''t see the tree, choose View ⇓ Tree. Make sure Show the System selection
    on the View menu also has a check mark because we''ll be looking at the system
    files in a moment.


    # What''s All This Other Stuff in the File Manager?


    When you look at the tree view in the File Manager, you see not only My Home and
    The System but also a bunch of other stuff, including removable media such as
    floppies and CD-ROMs, and possible network connections. This is an indication
    that your file system is popping out of your computer''s case and hauling in stuff
    from outside. In our increasingly networked and Web-enabled world, you can access
    outside information as if it were right there on your hard drive!


    Look for the following virtual folders in the tree view:


    +   - **Windows Network**, to access files and folders on a Windows network, if
    your machine is connected to one. See Chapter 4 for look-up details.

    +   - **NFS Network**, to access outside files and folders if you''re hooked into
    a standard UNIX or Linux local network. See Chapter 4 for more information.

    +   - **CD-ROM and Floppy** (and other removable media). Before Corel Linux, it
    was a real pain to access removable media in Linux. Now they appear automatically
    in File Manager.

    +   - **Web Browser**, to access recently visited Web locations. Yup, File Manager
    can be used as a Web browser too!

    +   - **V-Drive**, soon to make an appearance in File Manager. Choose Application
    Starter ⇓ Online Services ⇓ Corel VDrive to sign up for free virtual hard drive
    space that you can access from anywhere.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Poking around Your Folders


    The programs, documents, graphics, and other files on your system are stored in
    folders. Folders can also contain subfolders, so that files can be organized in
    a logical hierarchy, or tree, much as you organize the drawers, sections, and
    folders of a filing cabinet. Note how your home folder in Figure 11-1 has separate
    Desktop, Important!, and nmail subfolders. (I added the Important! one.) The Important!
    and nmail subfolders can, in turn, have subfolders of their own, and so on.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_205_0.png)


    Your desktop isn''t pictured as a folder in the tree, but it''s still a folder.


    # The virtue of virtual neatness


    Folders are very useful. I tend to throw all the papers on my desk into one big
    vertical pile. When I need something, I hope to find it near the top of the pile.
    I usually don''t, though, and end up shuffling through everything in a fruitless
    search.


    Same goes for letters, reports, graphics, e-mail, and other stuff you store in
    your machine. If you throw everything into one big folder, you''re searching for
    the needle in the haystack all the time. A virtual mess in your machine is the
    same as the real one on the top of your desk.


    # Field guide to folder trees


    Let''s take a closer look at your folder tree:


    +   ✔ Unlike its arboreal counterpart, your Linux file tree starts with a single
    root folder, denoted by a single slash ( `/` ).

    +   ✔ The tree itself is a logical, rather than a physical, structure. For example,
    your floppy drive, CD-ROM, and hard drive partitions are all *mounted* on your
    tree as so many branches. Even Windows and network drives can appear on your Linux
    file tree.


    # Revealing the tree


    When you go to your home folder, what you see in the tree view isn''t the tree
    at all but visual shortcuts to various branches. To see what I mean, double-click
    The System in the tree view and then double-click the root folder ( `/` ), as
    shown in Figure 11-2. Ah-ha, there it is!'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'When the Windows interface was plastered over DOS, *directories* were renamed
    *folders* and given cute little folder icons that you could click open with your
    mouse. Although traditionalists objected, *folder* is a much more useful concept,
    especially in a graphical environment. Think about it: A real-life directory,
    such as a phone directory, is just a book. In a file cabinet, you often put folders
    inside of folders, and you certainly don''t put a book inside a book! Anything''s
    possible, I suppose.


    So I''m glad to see that the Core! File Manager uses the *folder* terminology
    to go along with the visuals. For now, you''ll see many more Linux references
    to *directories* instead of *folders*. The terms are interchangeable.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_206_0.png)


    Note how the *Address* line in File Manager now shows only /, to indicate that
    you''re in the root folder.


    You can also click the little plus and minus signs to the left of the folders
    to expand or collapse tree branches and then click to select the folder you want.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# Beating a path to your files


    Now that Linux has gone graphical, you can see everything in front of you as you
    thread your way among the folders. As you go deeper and deeper into the woods,
    you''ll notice that a lengthening path appears in the Address fine in File Manager.
    For example, if you organize your letters into various folders, you might see
    the following path emerge for your personal essay:


    ```

    /home/becky/letters/school/

    PersonalEssay.wpd

    ```


    Thus, the address of your personal essay is nothing more than a string of folders,
    separated by slashes (\). Same thing goes when you''re browsing Web addresses.
    (Just to confuse you, MS-DOS and Windows slashes go the other way. \\)

    Simple, right? Handy too. Suppose you want to search for a particular letter.
    Rather than look all over the system, you can confine your hunt to the subfolders
    in the /home/becky/letters path.


    # Climbing the branches


    When you open the root folder, you see an intimidating list of subfolders with
    technical sounding names of bin, boot, dev, disks, and so on. Don''t worry, you''re
    not going to be quizzed on the periodic elements of your Linux file system. But
    take a look at Table 11-1, which explains the type of stuff that goes in the various
    system folders.


    Table 11-1 What Stuff Goes into Various System Folders


    | Folder | What You''ll Find There |

    | --- | --- |

    | / | The logical home of all files and folders, regardless of their physical
    location. The system root folder is where it all begins. Do not confuse your system
    root folder with the /root folder further down in this list. |

    | /bin | Linux system programs, including various command-line utilities such
    as cp, dir, ls, mkdir, mount, and mv. |

    | /boot | The Linux kernel and other essential system files to get you up and
    running. |

    | /dev | All device files used to represent various system devices, such as disk
    drives, CD-ROMs, printers, sound cards, and serial ports. |

    | /etc | System configuration files and initialization scripts. |

    | /home | The home folders for all users other than root. For example, the home
    folder for monica is /home/monica. |

    | /lib | Library files for C and other programming languages. |

    | /proc | A virtual file system containing system parameters and status information.
    |'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Will the real root folder please stand up?


    Linux is afflicted by the naming calamity, whereby everyone refers to the primeval/folder
    as the root directory, upon which there hangs another folder named root, for the
    root user’s files. It takes a while to realize that we’re talking about two entirely
    different entities!


    It would be less confusing if whoever did this had hung the root user’s folder
    from the /home folder, along with everyone else’s, but that’s not the way it is.


    | Folder | What You’ll Find There |

    | --- | --- |

    | /lost+found | Folder for lost files. |

    | /mnt | Various mounted file systems, including your automounted floppy disk
    or CD-ROM. |

    | /proc | Files your system uses to keep track of itself. |

    | /root | The home folder for the root user’s files. |

    | /sbin | Various programs to maintain and configure your system. |

    | /tmp | Files that are needed temporarily but are normally deleted each time
    you boot the system. |

    | /usr | Lots and lots of subfolders for user programs, including games, documentation,
    and icons. The X11R6 subfolder has many programs from Corel, KDE, and more. |

    | /var | System definition files and status information. |


    # Checking Out Your Folders and Files


    The best way to get the hang of using File Manager is to start checking out your
    folders and files:


    +   1. Click the **File Manager** button on the panel.

    +   2. Choose **View  Tree**, if necessary, to display the tree view.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_208_0.png)'
  merge: -1
  img_proc: true
- pgno: 209
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_209_0.png)


    Drag the border between the two panes to adjust the width of the tree view.


    +   3. To expand the system tree, double-click The System, if necessary, or click
    the plus (+) sign to its right.


    +   4. Go along the tree and click to open the user folder, then click the X11R6
    folder within that, and finally click the bin subfolder.


    The contents of /usr/X11R6/bin are listed in the right panel, as shown in Figure
    11-3.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_209_1.png)


    # File Manager clicking school


    You have several click choices while browsing folders in File Manager. They’re
    all pretty intuitive, but you might want to practice them a bit:


    +   - Click the \+ and \- buttons in the tree view to alternately expand and collapse
    the tree branches.

    +   - Click a folder in the tree view to display its contents in the right pane
    of File Manager.

    +   - Double-click a folder to both alternately expand or collapse its branch
    *and* display its contents in the right pane.

    +   - Double-click a folder in the contents display to view that folder’s contents
    *and* expand its branch in the tree view.


    Try all these tricks and observe what happens and then send away for your Clicking-School
    diploma.'
  merge: -1
  img_proc: true
- pgno: 210
  md: "# I didn't want to see them anyway!  \n(Granting permissions)\n\n![](img/82794ff9433a50ada079e99ce57c4c4f_210_0.png)\n\
    \nAs you swing from branch to branch on the system tree as a regular user, you'll\
    \ land on folders where File Manager shows you nothing but a blank gray panel\
    \ with an Access denied message, as shown in Figure 11-4. Geez, at least it could\
    \ say I'm sorry and display a smiley face or a pastoral scene.\n\n![](img/82794ff9433a50ada079e99ce57c4c4f_210_1.png)\n\
    \n![](img/82794ff9433a50ada079e99ce57c4c4f_210_2.png)\n\nTo put it bluntly, this\
    \ message means that the contents of this folder don't belong to it. It means\
    \ also that the owner hasn't granted you permission to read, write, or execute\
    \ any of its files.\n\n![](img/82794ff9433a50ada079e99ce57c4c4f_210_3.png)\n\n\
    When you land on a gray wasteland, click the Properties button on the tool-bar\
    \ to reveal the permissions for that folder or file, as shown in Figure 11-5.\
    \ Notice the Permissions:\n\n```\ndrwx---\n```\n\nThe $d$ just means it's a directory,\
    \ but the six hyphens (-) at the end mean that nobody but the owner has permission\
    \ to view, write to, or search the folder."
  merge: -1
  img_proc: true
- pgno: 211
  md: '# 182 Part IV: Doin'' Your Own Thing


    ![](img/82794ff9433a50ada079e99ce57c4c4f_211_0.png)


    Figure 11-5: Click the Properties button to see who has permission to read, write,
    or execute a folder or file.


    This is all as it should be in a multiuser environment such as Linux. Normally,
    you don''t have to worry about these permissions, which are part of the properties
    of every folder and file. You can, however, change the permissions as to who gets
    to muck about with the folders and files you own.


    To set permissions on a file that *you* created:


    +   1.  Select the file.

    +   2.  Click the Properties button.

    +   3.  Click the Permissions tab, as shown in Figure 11-6.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_211_1.png)


    Figure 11-6: Setting permissions for a file you created.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '+   4. Click to add or remove a check mark from the options to grant or deny
    the following permissions to you (because you’re the user), group, or others:

    +   * **Read** (view the file)

    +   * **Write** (modify the file)

    +   * **Execute** the file (if it’s a program)


    5. When you’re finished setting permissions, click **OK**.


    Removing read access provides the highest level of security and lets you hide
    from others information such as your financial records or the invitation to your
    spouse’s surprise birthday party. Write protection keeps folks from changing the
    file, but they can read or copy it to another name or place. Note that you can
    prevent yourself from modifying your own file! This lets you preserve for your
    records the original form of a report you wrote or a letter you sent.


    Now select one of your folders just as you did the file. Click the **Properties**
    button and then click the **Permissions** tab, as shown in Figure 11-7. Here,
    you set the following permissions for the user, group, and others:


    +   ❧ **Show entries**, to view the folder’s contents

    +   ❧ **Write entries**, to add files to the folder

    +   ❧ **Search**, to allow the folder’s contents to appear in search results


    ![](img/82794ff9433a50ada079e99ce57c4c4f_212_0.png)'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# 184 Part IV: Doin'' Your Own Thing


    # TECHNICAL STUFF


    # **Root doesn''t ask anyone!**


    The root user doesn''t need anyone''s permission to view any folder or file on
    the system. They don''t call root **superuser** for nothing! In fact, root has
    the power to lock you out of your own folders and files and even to change their
    ownership!


    # ### Sorting your folder listing


    Click the buttons above the listing on the right side of File Manager to sort
    the folder''s contents by Name, Size, Attributes, and Modified date. Click the
    same button twice to sort the listing in reverse order. Figure 11-8 shows the
    list sorted in reverse order by size. Note how the little sort triangle moved
    over to the Size button and now points upward.


    # **Figure 11-8:** Click a button to sort your folder listing.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_213_0.png)


    # ### Retracing your steps


    ![](img/82794ff9433a50ada079e99ce57c4c4f_213_1.png)


    You can use the handy navigation arrows on the File Manager toolbar to go back
    and forth between folders you''ve visited. Click the Back arrow on the left to
    retrace your steps.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Chapter 11: Managing Your Files


    Click the Forward arrow to come back again. Try both, they''re great!!!


    To go back up the folder tree toward the root folder, click the Up button on the
    toolbar successive times.


    In case you haven''t noticed, your File Manager is a lot like a Web browser. In
    fact, *it is* a Web browser. When you''re online, you can browse through Web pages
    just as you browse the files on your system.


    Here''s a great file and Web browsing trick: Click the Address listing, as shown
    in Figure 11-9, to return to a recently visited folder or Web location. Note how
    the Web Browser locations also appear in the tree view.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_214_0.png)


    # Customizing your File Manager view


    Choose the View menu to alternately display or hide various File Manager elements
    and types of files, as shown in Figure 11-10. Click an item to add a check mark
    and display the item; click again to remove the check mark and hide the item.
    You can also display large icons in place of the file listing, if that suits your
    tastes.'
  merge: -1
  img_proc: true
- pgno: 215
