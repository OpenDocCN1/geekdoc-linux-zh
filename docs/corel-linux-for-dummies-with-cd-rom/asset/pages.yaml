- pgno: 308
  md: '# Debian package categories


    Debian packages have their own distinctive categories. These are puzzling at first
    but make perfect sense when you realize that the ultimate goal of the Debian folks
    is to release a pure version of Linux, unhampered by any commercial licensing
    restrictions:


    +   - **Main packages** comprise the latest release of the main distribution of
    Debian. All packages come with full source code and can be freely distributed.

    +   - **Contrib packages** are free themselves but depend on other non-free software.
    That means they can’t be part of a pure, free Debian distribution.

    +   - **Non-Free packages** don’t necessarily cost money but have some onerous
    condition restricting the redistribution of the software.

    +   - **Non-US packages** might be free, but they can’t be exported from the United
    States. (They’re mostly encryption software that’s dangerous in the hands of Europeans
    and other known criminals.)


    # Getting Rid of Stuff You Don’t Use


    Corel Update is also adept at removing packages you no longer want:


    +   1. **Choose Application Starter \Applications \System \Corel Update.**

    +   2. **For each package you want to remove, click the little lock in the Status
    column twice to change it to a trash can, as seen in Figure 17-9.**

    +   3. **Click the Upgrade & Install Packages button to remove the packages you
    selected.**


    You can always install the packages again if you want them back. And don’t worry
    that the button says Upgrade & Install. The same process handles deletions too.'
  merge: -1
  img_proc: true
