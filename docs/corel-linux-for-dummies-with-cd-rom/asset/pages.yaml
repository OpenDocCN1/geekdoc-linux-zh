  md: "# Setting Archive Administrator options\n\nYou can fine-tune various file archiving\
    \ options for just the current session or permanently:\n\n+   1. Choose **Application\
    \ Starter** \\( \\rightarrow \\) **Applications** \\( \\rightarrow \\) **Utilities**\
    \ \\( \\rightarrow \\) **Archive Administrator**.\n+   2. Click the **Options**\
    \ button.\n+   3. Select or modify any of the following options, as shown in **Figure\
    \ 12-18**:\n+   \t- **Store full path** recreates the original file paths as you\
    \ extract the files.\n+   \t- **Only add newer files** ensures that when you update\
    \ an archive, all its files are the latest version.\n+   \t- **Location** changes\
    \ the default location for your archives.\n+   \t- **Application name** changes\
    \ the utility that Archive Manager uses to create and extract archives.\n+   \t\
    - **Save settings on exit** uses your new settings in future sessions.\n+   4.\
    \ Click **OK**.\n\n![](img/82794ff9433a50ada079e99ce57c4c4f_239_0.png)\n\nNow\
