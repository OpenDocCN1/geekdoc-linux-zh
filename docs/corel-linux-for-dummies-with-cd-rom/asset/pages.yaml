- pgno: 64
  md: '# Chapter 3


    # Starting Up, Doing Things, and Shutting Down


    # In This Chapter


    +   Starting Corel Linux and logging in


    +   Starting Windows or another OS instead


    +   Starting Corel Linux another way


    +   Launching WordPerfect and other applications


    +   Checking your disk space


    +   Issuing commands


    +   Shutting down Corel Linux


    After Corel Linux starts up, it might never go down — at least not on its own,
    as is the habit with other systems. Still, you’ll want to know how to start Corel
    Linux and log in and then exit the desktop and shut down.


    And while you’re there, you might want to launch WordPerfect or Netscape or maybe
    play a little minesweeper or poker.


    # Starting Up and Logging In


    For most Corel Linux installations, getting to the desktop is a breeze:


    +   1. **Turn on your computer.**


    The splash screen and menu in Figure 3-1 appear.'
