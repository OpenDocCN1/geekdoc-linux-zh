  md: '# **Adding and removing themes**


    Suppose you just downloaded a bunch of jazzy new themes. To use them, you must
    add them to your list:


    +   1. Choose **Application Starter** ⇄ **Control Center**.

    +   2. Double-click **Desktop** and then click **Theme Manager**.

    +   3. Click the **Add** button.

    +   4. Select the theme package and then click **OK** to add it to the list, as
    shown in Figure 10-15.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_195_0.png)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_195_1.png)


    To remove a theme, select the theme in the Theme Manager and then click the **Remove**
    button. Removing the theme from the list does not delete the theme package file.


    > **TECHNICAL STUFF**

    > Themes are usually saved in each user’s home folder. The themes in the global
    folder at /usr/X11R6/share/apps/kthememgr/Themes automatically appear in everyone’s
    list and can’t be removed by anyone except the root user.


    # **Creating your own themes**


    The Theme Manager has a tempting **Create** button, but it doesn’t get you too
    far. However, creating your own themes is not so difficult, assuming you’re among
    the artistically gifted. Go to the **kde.themes.org** Web site for complete instructions
    with examples.


