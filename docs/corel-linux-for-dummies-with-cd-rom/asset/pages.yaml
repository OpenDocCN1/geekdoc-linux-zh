- pgno: 358
  md: '# Appendix B


    # Glossary


    **C**omputer terms just keep rolling off the assembly line. This glossary attempts
    to take care of critical encounters.


    .: The current folder (directory) is often indicated by a single period, or dot.


    …: The parent of the current folder (directory) is often indicated by two periods.


    **access rights:** Permissions granted or denied by the owner (creator) of a file
    to allow other users to read, write to, or execute the file.


    **anchor:** Fixing a graphic relative to page margins, text, or another object,
    so that its relative position remains fixed during editing.


    **application:** A program that performs tasks for the user (for example, Netscape
    or WordPerfect) as opposed to systems software.


    **archive:** A collection of related files stored as one file in a compressed
    format.


    **ASCII:** A standard set of characters used in many text files, including Linux
    configuration files.


    **autohide:** When certain screen features automatically disappear when not needed;
    this clears the deck for your work. Point to the spot where a feature disappeared
    to pop it back into view.


    **binary:** A coding or counting system with only two symbols or conditions (off
    and on, zero and one, mark and space, high and low). The binary system is the
    basis for storing data in computers.


    **bit:** A binary digit, the fundamental unit of computer data representing either
    0 or 1 (off or on).


    **bitmap:** A digital image made up of an assemblage of different colored *pixels*.'
  merge: -1
  img_proc: true
- pgno: 359
  md: '**boot:** To load the *operating system* and other utilities when you start
    your computer.


    **boot diskette:** A diskette from which you can boot your computer to install
    or recover programs in some cases. If your computer can boot from a CD-ROM, a
    Corel Linux boot diskette should not be necessary.


    **boot sequence:** The order in which your computer searches your drives for the
    *operating system* to load on startup, such as A:, C:, CD-ROM.


    **byte:** An ensemble of eight bits of memory in a computer.


    **case sensitivity:** Names and **commands** are sensitive to case. Thus, a search
    for *myletters.wpd* won’t turn up *My.Letter.wpd*. The Linux convention has been
    to use all lowercase commands and filenames.


    **CD-ROM (compact disc read-only memory):** A non-rewritable CD that commonly
    stores 650MB of data.


    **CD-R (compact disk-recordable) drive:** Lets you write once to create your own
    CDs.


    **CD-RW (compact disk-rewritable) drive:** Lets you write to a CD many times,
    just as you can with a floppy or hard drive.


    **command:** A text instruction to your computer, something you can usually avoid
    with a *graphical user interface*.


    **command line:** Any place where you can type character commands, such as the
    *terminal window*, rather than execute commands through graphical selections,
    such as menus and buttons.


    **CPU (central processing unit):** The processing engine of your computer.


    **cursor:** A blinking line that indicates your text position as you type. Not
    to be confused with *cursor*, who is someone installing new hardware or software.


    **data:** Digital information that is input to, output from, or processed and
    stored in a computer.


    **daemon:** Not an evil spirit but any background process performing system chores
    that you don’t see on-screen. Daemons load automatically and take care of such
    things as watching for network connections.


    **dependency:** When one package can’t be installed unless another one is.


    **desktop:** A convenient graphical workplace, such as Windows, KDE, or Gnome,
    set up for a *multitasking* environment.'
  merge: -1
  img_proc: true
- pgno: 360
  md: '**device:** File systems or hardware on your computer mapped to the `/dev`
    subdirectory within Linux. For example, `/dev/hda1` is the first *partition* on
    an IDE hard disk, and `/dev/ttyS1` is the second serial port to which you might
    have a modem attached.


    **digital:** A system of storing information as on or off bits for computer manipulation
    and precise replication.


    **directory:** Same as *folder*, a place for keeping related files.


    **distribution:** A Linux package made up of the Linux kernel, other system software,
    user applications, and with all major distributions, an installation program.
    Anyone can put together a Linux distribution, and the operating system can vary
    widely depending on the kernel version and system software employed.


    **disc:** Optical storage media (CD, DVD, and video disc).


    **disk:** Magnetic storage media (floppy disk or hard disk).


    **DNS (*Domain Name Server*):** A service that translates alphabetic domain names
    into unique, numeric *IP addresses*.


    **domain:** A group of computers making up a network or a distinct part of a network
    with a particular set of privileges. Also refers to Internet *domain name*.


    **domain name:** The name of the network domain in which your computer resides.
    Also, the searchable name of an Internet server, such as `Corel.com`.


    **DOS equivalent commands:** Many Linux *commands* are similar to those used in
    DOS, even though you type them differently (and they’re always lowercase). To
    change directories, you type `CD` in DOS and `cd` in Linux; to list all the files
    in a directory, you type `DIR` in DOS and `ls -l` in Linux; and so on.


    **DPI (*dots per inch*):** The resolution of a printer, a video monitor, or another
    device based on dot density. (Camera resolution is the number of *pixels*.) For
    example, most laser printers have a resolution of 300 dpi, and most monitors have
    a resolution of 72 dpi.


    **drag and drop:** Moving (or copying) stuff from one place to another with a
    mouse. Can be within an application, such as moving a selected paragraph in a
    word processor or even between two applications, such as dragging a graphic from
    a drawing program to a word processor.


    **driver:** A program to operate a computer device, such as a hard drive, a keyboard,
    a mouse, a video card, or a printer.'
  merge: -1
  img_proc: true
- pgno: 361
  md: '**DVD** (*digital video disk*): A high-capacity replacement for a *CD-ROM*,
    employing various recording technologies.


    **Ethernet**: A standard way to move packets of data between two or more computers
    hooked together with cables.


    **export**: Transporting data from one computer, program, format, or device to
    another.


    **FAQ** (*frequently asked questions*): A compiled list, especially lists of the
    most common problems encountered with a program.


    **file**: A collection of information, such as text, data, or images saved on
    a disk or a hard drive.


    **file compression**: To squish down a file or collection of files for efficient
    transport. The files are then uncompressed for use after arrival at the new location.
    Various utilities for this purpose are *gzip* and *gunzip*, tar, and rpm. Compressed
    files are identified by the respective filename extensions of .gz, .tgz, and .rpm.
    (An uncompressed tar archive is .tar.)


    **file format**: A type of program or data file. Some common image file formats
    include *TIFF*, *PICT*, and *EPS*.


    **file permissions**: See *access rights*.


    **file server**: A computer that serves as the storage component of a local area
    network and permits users to share its hard disks, storage space, and so on.


    **file system**: Formatted space on a drive where directories and files are stored.
    Several types of file systems are available, such as ext2 for Linux, VFAT for
    Windows 98, and iso9660 for CD-ROMs. Because file systems don''t have drive letters
    in Linux, you *mount* them to empty Linux directories so that you can access them.


    **flame**: Incendiary newsgroup posting, usually best ignored.


    **floppy disk**: A common removable magnetic computer storage medium, usually
    a 3.5-inch disk.


    **folder**: Same as a *directory*, a place for keeping related files and folders.
    Now that Linux has gone *graphical*, directories look like folders and act like
    folders, so that''s what we call ''em.


    **format**: (1) The particular way a file, such as text or a graphic, is stored,
    either unique to a program or common to many programs. (2) To prepare a disk to
    have files written to it, normally wiping out any existing files in the process.'
  merge: -1
  img_proc: true
- pgno: 362
  md: 'FTP (File Transfer Protocol): Used for sending files over the Internet. An
    FTP site is a remote location for uploading and downloading files.


    gigabyte (GB): A thousand (1024) megabytes of computer memory.


    graphical user interface (GUI): A computer screen with picture icons (such as
    Windows or the KDE desktop) that you can click to do things instead of typing
    in obscure commands.


    group: On a Linux network, users can be organized into groups for security purposes,
    especially for granting access rights to various files. A user can belong to more
    than one group.


    gzip and gunzip: Linux utilities to compress files for transport and uncompress
    them after they’re received, respectively. The .gz filename extension is added
    to compressed files.


    hidden files: Linux files that begin with a period and normally aren’t displayed.
    The idea is that if you don’t see it, you won’t mess with it.


    home directory: Each user account in Linux has a home directory (folder), in which
    the user is free to create and delete files. For example, the user seth will have
    a /home/seth folder.


    HTML (HyperText Markup Language): The styles behind the richly formatted pages
    you view in your Web browser.


    HTTP (Hypertext Transfer Protocol): Used for formatting and transferring Web pages.


    icon: A graphical representation of an object (such as a printer or a file folder)
    or action (such as saving or pasting) that lets you work intuitively and quickly,
    without memorizing keystrokes or typing obscure commands.


    Internet: A global “network of networks” connecting millions of computers and
    hundreds of millions of users who exchange data, mail, news, and opinions. The
    operators of each independent host computer decide which Internet services to
    use and which local services to provide to the global Internet. The terms Web
    and Internet are often used interchangeably although the two have technical distinctions.


    Internet service provider (ISP): A commercial vendor or organization that hosts
    Web sites and provides dial-up access to the Internet. They also serve large companies
    by providing a direct connection from the company’s networks to the Internet.


    IP address: A unique numeric identifier for a computer or device on a TCP/IP network,
    written as four numbers separated by periods, such as 1.160.10.240.'
  merge: -1
  img_proc: true
- pgno: 363
  md: '**Intranet:** An in-house network where members of an organization publish
    information and interact with each other much as they do on the global *Internet*.
    Although intranet users can get out to the Internet, access from the Internet
    to the intranet is usually restricted by a security firewall to prevent unauthorized
    access.


    **kernel:** The central part of an *operating system* that remains in memory and
    performs essential services such as managing memory, processes, tasks, and disks.


    **kilobyte:** One thousand (1024) bytes of computer memory or disk space.


    **LAN (local area network):** A network of physically connected computers to exchange
    files and share peripherals.


    **LILo (Linux loader):** A utility installed in the *Master Boot Record* (or in
    the boot sector of your Linux partition) that lets you select your operating environment
    on bootup.


    **link:** (1) A pointer to a file so that you can reference it under another name,
    without specifying the path. (2) A clickable reference that jumps you to a document
    or Web page. See also *Web link*.


    **login:** Because Linux is a multiuser system, each user must log in using a
    valid user name and password.


    **logout:** The exit of a Linux user, so no that no one else can use that account.
    The Linux system continues to run for other users and processes. See also *shutdown*.


    **Master Boot Record (MBR):** The first sector of your hard disk that contains
    important stuff used when you boot your computer, including a partition table
    and a small program to read the table. The program sees which *partition* to boot
    the *operating system* from and then transfers program control to the boot sector
    of that partition.


    **maximize:** To enlarge a window to its maximum size, often the full screen.


    **megabyte (MB):** A million (1,048,576) bytes of computer memory.


    **mime type:** Characteristics attributed to a file based on its filename extension.
    For example, a file with the _.exe* extension is identified as an executable program;
    a _.wpd* file is a WordPerfect document.


    **minimize:** To shrink a window down to a taskbar icon, to get it out of the
    way.


    **modem (modulator/demodulator):** A device that converts digital computer data
    into signals for transmission over telephone lines.'
  merge: -1
  img_proc: true
- pgno: 364
  md: 'mount: To load a file system to an empty Linux directory so you can access
    its directories and files.


    multitasking: Running several programs at once—Linux excels at this. The kernel
    switches between processes so quickly that they appear to be running simultaneously.


    multiuser: You can create multiple user accounts in Linux, each with its own home
    directory and access rights. If access is provided via a modem, a dumb terminal,
    or a network connection, multiple users can access the system and run programs
    simultaneously.


    network: A group of computers connected to each other, so that they can share
    information, resources, and peripherals.


    newsgroup: An online discussion group or forum, in which you can view and post
    messages.


    open source: Software for which the programming code is freely available to all
    developers.


    operating system (OS): A program, such as Linux or Windows, that controls your
    computer and manages everything from keyboard and mouse input to monitor, disk,
    and printer output. It also maintains security and acts as a traffic cop to keep
    programs from tripping over one another.


    package: A compressed bundle of files that make up a specific software component.
    Various flavors of Linux employ different package formats, such as .deb for Debian
    (Corel Linux) and .rpm for Red Hat.


    panel: The bar at the bottom of the KDE desktop that provides quick access to
    tools and programs.


    parallel port: A high-speed computer connection for printers and other devices.


    partition: An isolated portion of a hard disk devoted to a particular system or
    set of files. Linux programs reside on Ext2 partitions, but Linux can read from
    and write to DOS and Windows FAT, FAT 32, and NTFS partitions.


    path: The address of a file on your machine, made up of a string of folder names
    separated by slashes, such as /usr/local/wp8/wpbin/xwp.


    pixel (picture element): The smallest element of a digitized image. Also, one
    of the tiny points of light that make up a picture on a computer screen.


    Plug and Play (PnP): Computer devices that are automatically installed and configured
    to keep out of each other''s way. Often works better in theory than in practice.'
  merge: -1
  img_proc: true
- pgno: 365
  md: '**program:** Computer instructions to perform a related set of tasks. The Linux
    **kernel** and WordPerfect *application* are examples of programs.


    **protocol:** Agreed-upon format for transmitting data between two devices, including
    error checking and any data compression.


    **proxy server:** Intermediate server that intercepts and coordinates the requests
    of numerous users, often on a single network. Thus, if three users on a network
    request the same Web page, the proxy server can fetch the page once (a time-consuming
    operation) and quickly send it to all three users.


    **RAM** (*random access memory*): The most common type of high-speed computer
    memory; it’s where the CPU stores software, programs, and data currently being
    used.


    **ROM** (*read-only memory*): Nonvolatile computer memory, similar to *RAM*, designed
    for device instructions that remain when the power is off. Can also refer to nonalterable
    CDs.


    **root folder:** The base of your Linux file tree, indicated by /*. Also the */root*
    folder for the **root user**’s files.


    **root user:** The *superuser*, or system administrator, of a Linux installation
    who can perform any task. The root user can accidentally damage critical files,
    so even if you have root access, as on a standalone installation, log in as a
    regular user unless you need to perform system tasks.


    **rpm:** See *file compression*.


    **serial port:** A computer interface connection that transmits data one bit at
    a time.


    **shortcut:** See *symbolic link*.


    **shutdown:** The process of gracefully closing down your computer during which
    program settings and files are saved.


    **SMTP** (*Simple Mail Transfer Protocol*): For sending e-mail messages between
    servers or from client to server, particularly over the Internet.


    **spam:** Junk e-mail or newsgroup postings. Whatever you do, don’t respond to
    it!


    **superuser:** See **root user**.


    **swap partition:** A separate partition on your hard disk that the Linux kernel
    uses to store active programs that aren’t doing anything at the moment, to make
    room in system memory for those that are. The space can’t be used for normal programs
    and data.'
  merge: -1
  img_proc: true
- pgno: 366
  md: '**symbolic link:** A pointer that lets you access or execute a file from another
    location, without actually copying the file. Similar to a Windows shortcut.


    **tar:** Short for the tape archive utility that combines a group of files into
    a single file with a .tar extension. In most cases *file compression* is used
    when a file is tarred.


    **taskbar:** The bar at the top of the KDE desktop that lets you switch between
    active applications.


    **TCP/IP:** Primary networking protocol (transmission format) used by Linux and
    the Internet. Other protocols such as the Web’s *HTTP* and *SMTP* (for e-mail)
    work under TCP/IP.


    **terabyte:** A thousand (1024) gigabytes.


    **terminal window:** Any place for typing Linux *commands*, often called a terminal
    emulator in a graphical environment.


    **thread:** A string of related messages, especially in a newsgroup.


    **TWAIn:** The protocol for exchanging information between applications and devices,
    such as scanners and digital cameras. TWAIn makes it possible for digital cameras
    and software to “talk” with one another on PCs.


    **universal serial bus (USB):** A replacement for *serial ports* and *parallel
    ports* that permits high data transfer rates between the computer and multiple
    peripheral devices, including cameras, monitors, printers, mice, and keyboards.


    **UNIX:** Popular *multiuser*, *multitasking* operating system developed in the
    early 1970s, from which much of Linux is derived.


    **URL** (Uniform Resource Locator): The Internet equivalent of a pathname to contact
    a site or locate a file. Also called a Web address.


    **USB** (universal serial bus): The new, easy way of hooking up scanners, keyboards,
    mice, speakers, modems, printers, and other devices. Avoids the exasperating hardware
    conflicts of the old way.


    **user:** Because Linux is a *multiuser* system, each person with system access
    should have a separate user account and password.


    **Web:** Short for World Wide Web, a collection of documents (called *pages*)
    located on computers all over the world.


    **Web link:** Clickable reference attached to highlighted words or an image that
    contains the URL (address) of a web document. Click the links to jump from page
    to page on the Internet.'
  merge: -1
  img_proc: true
- pgno: 367
  md: 'Web pages: Scrollable hypertext documents with HTML formatting codes that you
    see on the Web.


    Web site: A collection of related Web pages. Corel’s Web site, for example, has
    many pages attached to it.


    Web server: A computer where Web sites reside. One service provider (such as a
    university) can support many sites on their Web server. You can also set up a
    Web site on a personal computer.


    window: An on-screen box where you work in a program. You can enlarge, shrink,
    and rearrange multiple windows on your desktop.


    WINS (Windows Internet Naming Service): A dynamic network database that lets you
    quickly locate another computer on the network through its current network address.


    wizard: A program that leads you through a set of step-by-step instructions, providing
    help with your selections.


    WYSIWYG: Stands for what you see (on the screen) is what you get (as output) and
    is pronounced "wizzywig."


    X Window System: A UNIX/Linux graphical user interface (XFree86 in most distributions)
    that supports a desktop environment such as KDE or GNOME.


    ZIP: A Windows standard form of nondestructive file compression used on all types
    of files for storage and transfer.'
  merge: -1
  img_proc: true
- pgno: 368
  md: '# Appendix C


    # About the CD


    This appendix describes how to install the bonus stuff on your *Corel Linux For
    Dummies* CD:


    +   - Adobe Acrobat Reader (12MB installed)

    +   - Netscape Communicator suite (36MB installed, plus room for e-mail and temporary
    files)

    +   - A bonus collection of more than 100 dazzling desktop themes (40MB)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_368_0.png)


    Please note that you install these bonus items *after* you''ve installed Corel
    Linux, as described in Chapter 2.


    # System Requirements


    The minimum system requirements for Corel Linux are


    +   - A Pentium 90 (or equivalent) processor

    +   - 24MB of RAM (64MB recommended)

    +   - 500MB of unpartitioned hard drive space, plus additional space for the bonus
    stuff on your *Corel Linux For Dummies* CD

    +   - A 2MB VGA PCI graphics card

    +   - A CD-ROM drive

    +   - A 3½-inch floppy disk drive (required if your CD-ROM drive is not bootable)

    +   - A mouse or other pointing device


    See Chapter 2 for complete hardware details.'
  merge: -1
  img_proc: true
- pgno: 369
  md: '# # Installing Adobe Acrobat Reader


    To install Adobe Acrobat Reader:


    +   1. Start Corel Linux and log in as root.

    +   2. Put your Corel Linux For Dummies CD in the CD player.

    +   3. Click the File Manager button on the panel.

    +   4. In tree view, double-click The System and then double-click the / folder.

    +   5. In tree view, double-click your CD-ROM.

    +   6. Double-click the extras folder.

    +   7. Drag the Acrobat Reader archive linux-ar-405.tar.gz to /tmp, under The
    System in tree view, as shown in Figure C-1.

    +   8. Click the Console button on the panel.

    +   9. Type cd /tmp and press Enter.

    +       Everything you type in the Console is case-sensitive, so please type names
    exactly as they appear in these instructions.

    +   10. Type tar xzf linux-ar-405.tar.gz and press Enter.

    +   11. Type cd lLNXR.install and press Enter.

    +   12. Type ./INSTALL and press Enter (as shown in Figure C-2).


    ![](img/82794ff9433a50ada079e99ce57c4c4f_369_0.png)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_369_1.png)'
  merge: -1
  img_proc: true
- pgno: 370
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_370_0.png)


    13. Read the agreement. When you get to the end, type accept and press Enter.


    14. When you’re asked to specify the installation directory, press Enter to accept
    /usr/local/Acrobat4. Press Enter again to create it.


    That’s it for the Acrobat Reader 4.05 install. Sorry about all the work, but now
    you can pat yourself on the back for installing from the Console!


    Now that you did the hard stuff, change the menu shortcut to find Adobe Acrobat:


    +   1. Click Application Starter ⇆ Applications.

    +   2. Right-click Acrobat Reader and then click Properties.

    +   3. Click the Execute tab and type /usr/local/Acrobat4/bin/acroread (as shown
    in Figure C-3).

    +   4. Click OK.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_370_1.png)'
  merge: -1
  img_proc: true
- pgno: 371
  md: 'Your Acrobat Reader is now ready for use. Click Application Starter Applications
    Acrobat Reader and you''re on your way. See Chapter 14 for Acrobat details.


    # # Installing the Netscape Communicator Suite


    The download edition of Corel Linux installs *only* the standalone Netscape Navigator
    browser. By installing the full Netscape Communicator Suite from your *Corel Linux
    For Dummies* CD, you''ll enjoy all the e-mail, newsgroup, and HTML composition
    facilities described in this book.


    To install Netscape Communicator:


    +   1. Start Corel Linux and log in as root.

    +   2. Put your *Corel Linux For Dummies* CD in the CD player.

    +   3. Click the File Manager button on the panel.

    +   4. Double-click The System in tree view and then double-click the / folder.

    +   5. In tree view, double-click your CD-ROM.

    +   6. Double-click the extras folder.

    +   7. Drag the Communicator archive *communicator-v472-export.x86-unknown-linuxglibc2.0.tar.gz*
    to /tmp, under The System in tree view, as shown in Figure C-4.

    +   8. Click the Console button on the panel.

    +   9. Type `cd /tmp` and press Enter.


    > Everything you type is case-sensitive, so please type names exactly as they
    appear in these instructions.


    +   10. Type `tar zxvf communicator-v472-export.x86-unknown-linuxglibc2.0.tar.gz`
    and press Enter.

    +   11. Type `cd communicator-v472.x86-unknown-linux2.0` and press Enter.

    +   12. Type `./ns-install` and press Enter (as shown in Figure C-5).

    +   13. When you''re asked to specify the installation folder, as shown in Figure
    C-6, press Enter to accept /usr/local/netscape. Press Enter again to create it.


    Lo and behold, Netscape Communicator 4.72 installs on your system! Bet you didn''t
    know it would be so easy.'
  merge: -1
  img_proc: true
- pgno: 372
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_372_0.png)


    Figure C-4:

    Dragging the Communicator archive to the /tmp folder.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_372_1.png)


    Figure C-5:

    Installing Communicator from the Console.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_372_2.png)


    Figure C-6:

    Accepting the default installation folder.'
  merge: -1
  img_proc: true
- pgno: 373
  md: 'Now that you''ve installed Communicator, getting it to launch from the menu
    or a desktop icon is a breeze:


    +   1. Click **Application Starter** \* **Applications**.

    +   2. **Right-click Netscape Navigator** and then click **Properties**.

    +   3. Click the **Execute** tab and type **/usr/local/netscape/netscape** "%u"
    **(**as shown in Figure C-7**)**.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_373_0.png)


    +   4. Click the **Application** tab and change the name from **Netscape Navigator**
    to **Netscape Communicator**.

    +   5. Click **OK**.


    That takes care of your menu configuration.


    +   6. **Right-click the Netscape icon on your desktop**, click **Properties**,
    and **make the same changes as described in Steps 3 through 5**.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_373_1.png)


    Your Netscape Communicator is now ready for use. Click the Netscape icon on your
    desktop (or click **Application Starter** \* **Applications** \* **Netscape Communicator**)
    and you''re on your way.


    When you launch Communicator, the browser appears. From here, you can access your
    e-mail, newsgroups, and composition facilities. See Chapters 15 and 16 for Communicator
    details.


    Want to get really fancy? Create a **Communicator** submenu with shortcuts to
    the individual applications, using the following links:'
  merge: -1
  img_proc: true
- pgno: 374
  md: '+   * Collabra: /usr/local/netscape/netscape -news

    +   * Composer: /usr/local/netscape/netscape -edit

    +   * Messenger: /usr/local/netscape/netscape -mail


    See Chapter 9 for menu editing details.


    # Installing the Bonus Themes


    Your *Corel Linux For Dummies* CD also includes a bonus collection of more than
    100 desktop themes. If you copy them to the global Themes folder, they''ll be
    available to all users:


    +   1. Log in as root to Corel Linux.

    +   2. Insert your *Corel Linux For Dummies* CD into your CD-ROM drive.

    +   3. Click the File Manager button on the panel.

    +   4. In tree view, select your CD-ROM and then double-click the Themes folder.

    +   5. Press Ctrl+A to select all the themes and then click the Copy button on
    the toolbar, as shown in Figure C-8.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_374_0.png)'
  merge: -1
  img_proc: true
- pgno: 375
  md: '6. Locate and highlight the global themes folder at

    /usr/X11R6/share/apps/kthememgr/Themes.


    7. Click the Paste button on the toolbar to copy the themes.


    Then use the Theme Manager described in Chapter 10 to preview and apply your themes.
    Enjoy!


    # If You Have Problems of the CD Kind


    I tried my best to supply programs that work on most computers that meet the minimum
    system requirements. Alas, your computer might differ, and some programs might
    not work properly for some reason. The most likely problem is that you have a
    Winmodem or some other hardware that is not yet supported by Corel Linux, as described
    in Chapter 2.


    If your machine meets the hardware requirements and you still have trouble installing
    the items from the CD, please call the IDG Books Worldwide Customer Service phone
    number at 800-762-2974 (outside the United States, call 317-596-5430).'
  merge: -1
  img_proc: true
