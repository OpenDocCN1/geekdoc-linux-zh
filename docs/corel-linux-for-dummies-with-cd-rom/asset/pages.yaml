- pgno: 258
  md: 'Hold Shift and click when using the pencil to draw straight lines. This technique
    also works with the paintbrush, eraser, airbrush, clone tool, and convolver.


    Choose File ↔ Dialogs ↔ Brushes to choose tips for your pencil, paintbrush, or
    eraser, as shown in Figure 14-5.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_258_0.png)


    # Using the selection tools


    The first six tools in the toolbox let you select and manipulate a specific part
    of your image. The boundary of your selection becomes a blinking dotted line,
    affectionately known as marching ants. Anything you do to the selected part of
    your image doesn’t affect the rest of the image. Click anywhere in the image to
    turn off the selection.


    # Selecting foreground and background colors


    You can change the foreground color you paint with and the background color that’s
    left when you erase or cut. Do any of the following in the Color Selector at the
    bottom of the toolbox:


    Double-click the foreground or the background to display the Color Selection dialog
    box shown in Figure 14-6 and then choose the color you want.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_259_0.png)


    Click the double arrow to swap the foreground and background colors.


    Click the foreground or background, and then click the Color Picker button to
    choose a color from any of the images you have on display.


    Click the little black-and-white icon in the lower-left to restore the black-and-white
    defaults.


    # Taking an art course


    Now choose the Xtns menu in the toolbox (look back at Figure 14-4) to view a huge
    array of tools and options. Included on the Web Browser submenu are selections
    to hook you up with the GIMP community, such as updates, plug-ins, and tutorials,
    as shown in Figure 14-7. Be sure to check out the FAQs (Frequently Asked Questions).


    ![](img/82794ff9433a50ada079e99ce57c4c4f_259_1.png)


    If you go to the GIMP User''s Manual, shown in Figure 14-8, you''ll find detailed
    instructions, with examples, of many of GIMP features.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_260_0.png)


    Figure 14-8: Web-based instructions and examples.


    # Working with PostScript and PDF Files


    As you go about your appointed tasks in Corel Linux and on the Web, you’ll often
    encounter the following two common Adobe Systems file types:


    +   ✓ **PostScript** documents display images and fonts as precise scalable graphics
    that can be sent to high-resolution printers and other output devices.


    Although you need a PostScript printer to take advantage of this graphical precision,
    PS Viewer (described in the next section) can send output to a standard laser
    or inkjet printer.


    +   ✓ **Portable Document Format (PDF)** files, produced from a growing number
    of desktop publishing applications, can be viewed by the recipient in their original
    format.


    TIP'
  merge: -1
  img_proc: true
- pgno: 261
  md: "# Opening and viewing a PostScript file\n\nCorel Linux comes with PS Viewer,\
    \ which can open and view PostScript files:\n\n+   1. Choose **Application Starter**\
    \ **\\** Applications **\\** Graphics **\\** PS Viewer.\n+   \t\tYou can also\
    \ double-click a PostScript file in File Manager to open it in PS Viewer.\n+ \
    \  2. Click the **Open** button, and then locate the folder with your files.\n\
    +   3. If you’re looking for *.eps files instead of *.ps files (the default),\
    \ type \\*.eps in the **Filter** box and press **Enter**.\n+   4. Select the file,\
    \ as shown in Figure 14-9, and then click **OK**.\n\n![](img/82794ff9433a50ada079e99ce57c4c4f_261_0.png)\n\
    \n+   5. Click pages in the listing or use the various navigation buttons to view\
    \ the file.\n+   \t\tThe **Read Down** button is especially handy for reading\
    \ one screen of information at a time.\n+   6. Click the **Zoom** buttons to zoom\
    \ in or out of your document display.\n+   7. Click the **Flag** button to mark\
    \ the current page as one you want to come back to or print, as shown in Figure\
    \ 14-10.\n+   8. Click the **Close** button if you want to exit the viewer without\
    \ printing your file."
  merge: -1
