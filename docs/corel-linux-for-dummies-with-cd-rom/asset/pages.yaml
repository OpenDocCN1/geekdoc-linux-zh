- pgno: 72
  md: 'After you log out of the desktop, you can do either of the following:


    +   - Click Login to reenter the desktop as the same or another user.

    +   - Click Shutdown, as shown in Figure 3-10, to either shut down your computer,
    or shut down your computer and restart to Windows or another OS.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_72_0.png)


    **Figure 3-10:** Click Shutdown to shut down your computer or restart to another
    OS.


    Notice I didn''t say to use shutdown and restart to clean up the mess with your
    current Linux session. That''s a Windows trick you can unlearn when using Linux!


    > In the "never say never" department, it''s not unknown to have a software problem
    in Linux that logging out and back in can correct or a hardware hiccup where it
    pays to restart your system.'
