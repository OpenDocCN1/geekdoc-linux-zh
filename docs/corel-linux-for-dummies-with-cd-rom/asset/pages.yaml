    +   ✓ HTTP sites to view Web pages

    +   ✓ FTP sites for transferring files from a remote location


    # Up, Up, and Away! Launching Netscape


    Strap on your seat belt, if your chair has one, and blast off into cyberspace:


    +   1. Activate your network or dial-up access, if necessary.

    +   For a dial-up, choose Application Starter  Applications  Network Dial-Up and
    then choose Connect to ignite your engines.'
