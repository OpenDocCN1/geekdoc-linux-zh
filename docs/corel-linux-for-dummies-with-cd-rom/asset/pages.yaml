    ![](img/82794ff9433a50ada079e99ce57c4c4f_127_0.png)


    A lot of window business is transacted at bars, so I expect you’ll be right at
    home. Click the stubby pencil on the panel at the bottom-left to open the Text
    Editor, so you can go on a stroll and check out the saloons.


    # Opening and closing times


    Did you notice those little doodads with diagonal lines to the left of the menu
    bar and toolbar in the Text Editor? A lot of Linux programs have these. Click
    the doodad to alternately open and close your bars, as shown in Figure 7-2. Clever!


    For bars without doodads, such as those in WordPerfect, look for selections on
    the View or Options menu to alternately view or hide your bars.


