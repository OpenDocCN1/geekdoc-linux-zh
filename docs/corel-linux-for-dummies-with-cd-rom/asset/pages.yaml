- pgno: 28
  md: '# # Foreword


    The arrival of *Corel Linux For Dummies* is a harbinger of Linux''s spring. The
    success of Linux is inevitable because of the gigantic, global team effort behind
    it. We at Corel are especially proud to deliver a desktop version of the Linux
    OS for the millions of potential users addressed by Steve Harris''s book.


    Corel Linux received a rave reception, and it''s selling like hotcakes in the
    retail channels. Corel Linux was named CNET''s "Editor''s Choice" as the best
    of seven major Linux distributions reviewed. And according to TUCOWS.com Inc.,
    the Internet''s leading distributor of digital content, Corel attained the highest
    percentage of downloads in December, 1999, at 37 percent, almost double the percentage
    of the nearest contender.


    The publication of *Corel Linux For Dummies* can only add to this momentum. Here,
    you''ll find clear, step-by-step instructions for installing, configuring, and
    updating Corel Linux. Readers of *Corel Linux For Dummies* will find hundreds
    of tips and tricks on everything from customizing your desktop to managing your
    files and cruising the Internet.


    "The Part of Tens" highlights some great Corel Linux tricks and shows you where
    to get all kinds of stuff for free. Best of all is the "Ten Places to Get Free
    Help" chapter, which brings home the point that Corel Linux is not just a bunch
    of program code but an open community of support as well.


    It''s amazing when you think of it — you get the Corel Linux OS, Netscape Communicator,
    Adobe Acrobat Reader, and a collection of themes all for the price of this great
    *For Dummies* title. Don''t you love Linux! Corel is thrilled to be such a major
    player in Linux, and I''m delighted that Steve and Erwin are part of our team.


    Enjoy the freedom!


    Mike Cowpland, president and CEO

    Corel Corporation'
  merge: -1
  img_proc: true
