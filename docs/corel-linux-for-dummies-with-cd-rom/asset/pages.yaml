- pgno: 93
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_93_0.png)


    # Hooking up to a Windows Workgroup


    After you’ve pried a little information out of your network administrator, hooking
    up to a Windows Workgroup is a slice of pie:


    +   1. Log out, if necessary, and log in as root.

    +   2. Choose Application Starter  Control Center and then double-click Network.

    +   3. Choose Windows Workgroups.

    +   4. Click to check Enable Samba, as shown in Figure 4-20, and then enter the
    following identifying information:


    +   * Description of your computer

    +   * Workgroup to which your computer belongs

    +   * WINS server (if your network has one) to quickly locate another computer
    on the network through its current network address'
