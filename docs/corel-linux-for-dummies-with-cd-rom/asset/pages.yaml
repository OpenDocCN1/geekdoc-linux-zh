- pgno: 126
  md: '# Chapter 7


    # Graphical Gizmos


    # In This Chapter


    +   ❖ Going bar hopping

    +   ❖ Freeing up brain cells with the incredible right-click

    +   ❖ Holding a dialog

    +   ❖ Selecting stuff

    +   ❖ Deleting stuff — and getting it back


    A dog does tricks to please its master. A cat does tricks to please itself. You
    do tricks to have fun. There’s no getting around it. I could say that the techniques
    in this chapter will make you 37 percent more productive, but the real reason
    I present them is because it’s out-and-out fun to teach your mouse new tricks.


    But more productive you will be! Computing curmudgeons can spout off about how
    efficient they were at pre-Windows computing. They neglect to tell you that it
    took seven years to learn the commands, when they could have been going to movies
    or walking their mouse.


    One favor I ask is that you please try out these tricks as you go along. This
    is a practical guide, not a theoretical treatise. That said, grab your mouse and
    hang on!


    # Jumping into Windows


    Most business in a graphical environment is conducted in windows, custom decorated
    by each program for the tasks at hand. While doing a research report on potato
    chips, for example, you might have WordPerfect and calculator windows open in
    Desktop 1, while using Dial-Up and Navigator on Desktop 2 to get the latest news
    from chip central. Figure 7-1 gives you the anatomy of the sophisticated window
    you see when you open a document in WordPerfect 8.'
  merge: -1
  img_proc: true
- pgno: 127
