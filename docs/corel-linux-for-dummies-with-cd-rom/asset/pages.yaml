- pgno: 295
  md: '# Forwarding a message


    To forward the current message for others to see:


    +   1.  **Click the Forward button (or choose Message ⇧ Forward).**

    +       This automatically changes the subject to “[Fwd: Subject]” to indicate
    that the message is forwarded.

    +       To quote the forwarded message within the body of your message, right-click
    the message and choose Forward Quoted.

    +   2.  **Enter the recipients for the forwarded message.**

    +   3.  **Preface the message with an explanation, if necessary.**

    +   4.  **Click the Send button to forward the message.**


    ![](img/82794ff9433a50ada079e99ce57c4c4f_295_0.png)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_295_1.png)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_295_2.png)


    # Selecting multiple messages


    You can perform a number of operations (such as moving or deleting) on several
    messages at once. You can hold Ctrl while you click to select multiple messages,
    or you can hold Shift and click to select a range of messages. Press Alt+A (or
    choose Edit ⇧ Select ⧉ All) to select the entire listing.


    # Deleting and organizing messages


    If you send and receive a great deal of e-mail (especially if you get spammed
    with junk mail), your messages will pile up in a hurry. This makes for a messy
    mailbox and eats up a lot of hard drive space.


    To tidy up your mailbox:


    +   1.  **Select the messages you want to discard and click the Delete button
    (or press Alt+D).**

    +       Your messages are simply moved to the Trash folder rather than deleted,
    so you aren’t warned when deleting. To undelete, press Alt+Z immediately.

    +   2.  **To create folders and subfolders for your messages, choose File ⇧ New
    Subfolder (or right-click a folder and choose New Subfolder).**

    +       Drag folder icons to rearrange them.

    +   3.  **Sort and select messages and then choose Message ⇧ Move Message and
    specify the folder to move them to.**


    ![](img/82794ff9433a50ada079e99ce57c4c4f_295_3.png)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_295_4.png)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_295_5.png)'
  merge: -1
  img_proc: true
- pgno: 296
