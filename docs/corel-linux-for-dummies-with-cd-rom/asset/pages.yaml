- pgno: 10
  md: '# # About the Authors


    **Stephen E. Harris** is the founder and president of QwkScreen, a software development
    and consulting firm dedicated to making the computer screen a friendlier place.
    Author of the best-selling *WordPerfect for Linux* and *WordPerfect Office 2000
    Bibles*, Steve''s a proud member of the Corel Beta Squad. He lives in the woods
    of western Massachusetts with his wife, Githa, three cats (Tiger, Becky and Chester),
    bears, deer, turkeys, and other assorted wildlife. You''ll find Steve, plus WordPerfect
    solutions and links, at www.qwkscreen.com.


    **Erwin Zijlman** started out as a development sociologist, specializing in urban
    sociology and education in third-world countries, particularly Southeast Asia.
    He now works as a software scientist, specializing in PC office applications.
    Erwin is an avid beta tester of Corel products, and has co-authored other WordPerfect
    titles with Steve. He lives near Amsterdam, in the historic center of Leiden.
    He enjoys the companionship of Anja as well as his cat, Bagu.'
