- pgno: 331
  md: '# Subscribe to Support Newsgroups


    For the most fabulous and caring support, start your newsreader, add the cnews.corel.ca
    server to your news reader, and then subscribe to the free Corel Linux support
    groups on installation, networking, and so on. (See how to do this in Chapter
    16.) The corelsupport.linux.corel.ca newsgroup is the centerpiece of the Corel
    Linux support groups, with hundreds of messages posted every day.


    No matter what your question — from the most basic to the most obscure — you’ll
    get friendly advice from Corel’s C_Tech volunteers and other users with similar
    experiences. More often than not, you’ll get two or three alternate solutions!


    > We authors love getting e-mail from readers, but we can’t handle technical queries.
    Even if we could, the newsgroups would still be a better bet because you’ll find
    experts there in every imaginable specialized issue.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_331_0.png)


    # Start from the Corel Community Web Site


    Try the Web site of the Corel Linux community at http://linux.corel.com. This
    site directs you to important information and support sources, including the growing
    FAQs (Frequently Asked Questions) list, as shown in Figure 20-1. Click the Technical
    Support link and then click the Complementary support link to get there.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_331_1.png)


    Figure 20-1: Access the FAQ list from the Corel Community site.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# Search Corel''s Knowledge Base


    Corel''s technicians pool their knowledge in a searchable knowledge base at http://search.corel.com/kbsearch/.
    If others have encountered your problem, you''re likely to find step-by-step instructions
    on getting it resolved.


    # Join Your Local Linux User Group


    Linux user groups are sprouting up faster than dandelions. Go to http://www.linux.com/lug/
    to locate and join a group near you. You''ll even find special interest groups
    devoted to particular Linux topics.


    # Find KDE Support and Documentation


    Because KDE has a prominent place in Corel Linux OS, the KDE Frequently Asked
    Questions at http://www.kde.org/documentation/faq/kdefaq.html can be quite helpful
    to users of Corel Linux as well.


    # Get Help at Linux Online


    Linux Online was one of the first sites focusing on the Linux OS. The Linux Online
    Help Center, at http://www.linux.org/help/index.html, provides FAQ''s, HOWTOs,
    manuals, and lots of other information, as seen in Figure 20-2.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '**Figure 20-2:** Go to Linux Online for FAQs, HOWTOS, manuals, and more.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_333_0.png)


    # Look through the Linux Documentation Project


    The Linux Documentation Project, at http://metalab.unc.edu/mdw/ and shown in Figure
    20-3, is dedicated to provide you with free, high-quality documentation for the
    GNU/Linux operating system.


    Browse through the HOWTOS and Linux guides to find assistance with your problem
    or project. For example, you''ll fine the basic System Administrator''s Guide,
    as shown in Figure 20-4.'
