  md: '# Corel® Linux® For Dummies®


    ![](img/82794ff9433a50ada079e99ce57c4c4f_3_0.png)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_3_1.png)


    # Handy-Dandy Desktop Keystrokes


    | Keystroke | Does This Trick |

    | --- | --- |

    | Ctrl+Tab | Switches desktops; hold the Ctrl key and keep pressing Tab until
    you arrive at the desktop you want |

    | Ctrl+F11– Ctrl+F8 | Switches to Desktop #1–Desktop #8 |

    | Alt+Tab | Switches between active applica-tions; hold Alt and press Tab until
    you arrive at the one you want |

    | Alt+F1 | Pops up the program menu; you can then search the menus by using the
    arrow keys and press Enter to run the highlighted program |

    | Alt+F2 | Enables you to type a Linux command |

    | Alt+F3 | Displays a menu of window operations |

    | Alt+F4 | Closes the current window |

    | Alt+F7 | Enables you to move the window by using the arrow keys |

    | Alt+F8 | Enables you to resize the window by using the arrow keys |

    | Alt+F9 | Makes the current window an icon |

    | Alt+F10 | Maximizes or restores the current window |

    | Ctrl+Esc | Displays the list of tasks you can switch to |

    | Ctrl+Alt+Esc | Immediately closes the next window you click, without prompting
    you to save your latest changes |


    # Keystroke Operations in a Window


    | Keystroke | Operation |

    | --- | --- |

    | Ctrl+W | Close |

    | Ctrl+C | Cut |

    | Ctrl+X | Copy |

    | Ctrl+End | End |

    | Ctrl+F | Find |

    | F1 | Help |

    | Ctrl+Home | Home |

    | Ctrl+Insert | Insert |

    | Ctrl+N | New |

    | Page Down | Next |

    | Ctrl+O | Open |

    | Ctrl+V | Paste |

    | Ctrl+P | Print |

    | Page Up | Prior |

    | Ctrl+Q | Quit |

    | Ctrl+R | Replace |

    | Ctrl+S | Save |

    | Ctrl+Z | Undo |


    # Linux Commands to Use in a Pinch


    +   * **ls**: List files

    +   * **cd**: Change directories

    +   * **cp**: Copy files

    +   * **mv**: Move or rename files

    +   * **rm**: Delete files


    +   * **mkdir**: Create a directory

    +   * **rmdir**: Remove a directory

    +   * **pwd**: Display the working directory

    +   * **cat**: View a file


    +   * **more**: View a file one screen at a time

    +   * **lpr**: Print files

    +   * **find**: Find files

    +   * **grep**: Find text


