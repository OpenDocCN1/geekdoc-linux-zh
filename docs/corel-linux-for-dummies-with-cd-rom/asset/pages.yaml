- pgno: 128
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_128_0.png)


    # A quick look in the title bar


    The *title bar*, as its name implies, provides descriptive information, such as
    the name of the program or the file you’re working on. It blew me away to see
    that when the title can’t fit in the bar, its text slides back and forth so you
    can view the complete title! Corel Linux is full of these pleasant little surprises.


    Now try these title bar tricks:


    +   - Click and hold the title bar and then drag the window around your desktop.

    +   - Double-click the title bar to alternately *shade* (roll up) and *unshade*
    the window. Too much!

    +   - The window shade sounds are a hoot! To activate sounds, see Chapter 10.

    +   - Right-click the title bar to select from a list of everything you can do
    with the window.


    # Big things from little buttons


    Mustn’t overlook those little buttons to the left and right of the title bar.
    Table 7-1 shows you the big things that those little buttons can do. Give them
    a try!


    | Table 7-1 | Big Things from Little Buttons | |

    | --- | --- | --- |

    | Click This Button | To . . . | |

    | | Upper-Left Buttons | |

    | <br> | Window menu button (miniature program icon) | Get an all-purpose list
    of everything you can do with the window, such as iconify, maximize, close, or
    move. |'
  merge: -1
  img_proc: true
