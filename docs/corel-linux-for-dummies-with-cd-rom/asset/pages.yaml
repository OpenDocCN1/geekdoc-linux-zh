- pgno: 243
  md: '214 Part IV: Doin’ Your Own Thing


    ![](img/82794ff9433a50ada079e99ce57c4c4f_243_0.png)


    Figure 13-3: The editor highlights program keywords, data types, and other elements.


    # # Setting Word Wrap and Editing Options


    If you’ve ever used a word processor such as WordPerfect, you’ll know that if
    you don’t first end a line by pressing Enter, your line of text automatically
    wraps to the next line when it bumps against the right margin. Well, a line in
    the Text Editor goes on and on and on unless you tell it not to. It doesn’t have
    fixed margins of a certain width, but you can tell it to automatically wrap your
    text when you reach a certain number of characters.


    To set word wrap and other editing options, choose Options ⌥ Preferences. Then
    click to choose any of the following options, which also appear in Figure 13-4:


    +   - **Auto Indent** aligns subsequent lines of text to where you tabbed the
    current line.

    +   - **Backspace Indent** goes back to previous indents when you press Enter
    followed by Backspace.

    +   - **Word Wrap** wraps lines of text at the number of spaces you specify in
    the Wrap Words At box.

    +   - **Replace Tabs** resets existing tabs when you change the tab width.

    +   - **Remove Trailing Spaces** removes any spaces at the ends of your lines.'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'Wrap Cursor makes the cursor go to the end of the next line when you press
    the down arrow.


    Auto Brackets creates sets of brackets when you type [, {, or (.


    Tab Width sets the number of spaces between tabs.


    Undo Steps sets how many editing changes you can back out of.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_244_0.png)


    # Setting Text Selection Options


    In the same dialog box that contains the edit options, you’ll find several selection
    options that can come in handy, especially when you’re working on program files.
    Choose Options Preferences and then choose the options you want:


    Persistent Selections keeps selections on screen as you type.


    Multiple Selections (with Persistent) lets you make more than one selection at
    a time.


    Vertical Selections selects text in columns rather than line by line. Choose Options
    Vertical Selections (or press F5) to toggle vertical selections on and off.


    Delete on Input deletes selected text upon pressing Enter.


    Toggle Old (with Persistent and Multiple) inverts the select state by selecting
    text again.


    TIP


    Some options, such as Toggle Old, work only in combination with others, so play
    around with them to see how they work.'
  merge: -1
  img_proc: true
- pgno: 245
  md: "# # Jotting Down Notable Ideas\n\nWord processors are for big ideas, such as\
    \ an article on \"Unidentified Flying Penguins.\" That's why you go through all\
    \ the fuss and bother of creating, for-matting, spell checking, saving, and naming\
    \ your documents. \"But,\" you ask, \"what do I do when I have a little idea,\
    \ the size of a sticky note?\"\n\nDid I hear *sticky note*? Well guess what? You\
    \ can now have the virtual sticky notes shown in Figure 13-5. Moreover, they come\
    \ in whatever size or color you want!\n\n![](img/82794ff9433a50ada079e99ce57c4c4f_245_0.png)\n\
    \nFigure 13-5:  \nVirtual sticky note.\n\nThese virtual notes also offer distinct\
    \ advantages over the paper kind:\n\n+   You don't need to scatter a bunch of\
    \ little notepads all over the place, just so you can locate one before your idea\
    \ fades from view.  \n+   They don't stick where they don't belong.  \n+   They\
    \ don't cling to the insides of your wastebasket.  \n+   You can attach an alarm\
    \ to a note so that it will pop up at the appointed time, beep three times, and\
    \ tell you to walk the dog.  \n+   You can e-mail them to your friends and enemies.\n\
    \n# ## Once it starts, it never stops\n\nOne nice thing about the Note utility\
    \ is that after you start it, it keeps running from session to session, without\
    \ getting in the way. I don't mean that you can't turn it off. It's just that\
    \ when the Note utility is running, all you see is a cute little Note icon in\
    \ the docking station.\n\nTo write a note for the first time:\n\n+   1. Choose\
    \ Application Starter  Applications  Utilities  Note.\n\n![](img/82794ff9433a50ada079e99ce57c4c4f_245_1.png)\n\
    \nThis puts a blank note on the screen and the cute little Note icon in the docking\
    \ station, as shown in Figure 13-6."
  merge: -1
  img_proc: true
