- pgno: 312
  md: '# Chapter 18


    Ten Cool Desktop Tricks


    # In This Chapter


    +   ☛ Autohiding your panel and taskbar

    +   ☛ Moving a window to the top of the pile

    +   ☛ Using multiple desktops

    +   ☛ Using sticky windows

    +   ☛ Dancing around with the Desktop Manager

    +   ☛ Iconifying windows

    +   ☛ Going for the max

    +   ☛ Doing the incredible right-click

    +   ☛ Changing your color scheme

    +   ☛ Adopting a whole new theme


    You can do so many cool things with the Corel Linux desktop, that it’s hard to
    choose the top ten. Some tricks make you more productive; others are just plain
    fun! In this chapter, I present ten that you’ve got to try!


    # Autohiding Your Panel and Taskbar


    The panel is a fabulous tool, but it does take up quite a bit of your screen’s
    real estate. Want to have your cake and eat it too? Then autohide your panel to
    tuck it discreetly out of view. Then, whenever you need it, just point to where
    the panel is hidden to pop it back into view.'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'Right-click a blank spot in the panel, choose Configure, and then click the
    Options tab. Choose the Auto hide panel option to do just that, as shown in Figure
    18-1. You can then drag the sliders to adjust the autohide delay (how long it
    waits before disappearing) and speed (how fast it disappears).


    ![](img/82794ff9433a50ada079e99ce57c4c4f_313_0.png)


    Figure 18-1: My favorite desktop trick is autohiding the panel.


    # # Moving a Window to the Top of the Pile


    Suppose that the window you want is buried under a bunch of other windows, with
    just a little piece sticking out. How can you use it? Easy, just click the little
    piece, as seen in Figure 18-2, and whoosh! It flies into view.


    You’ll find a lot more window tricks in Chapter 8.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# Chapter 18: Ten Cool Desktop Tricks


    285


    ![](img/82794ff9433a50ada079e99ce57c4c4f_314_0.png)


    **Figure 18-2**: Click a piece of any window to move it to the top of the pile.


    # Using Multiple Desktops


    The trick of using multiple desktops is both useful *and* fun, so it isn’t even
    an option. Multiple desktops are a great way to reduce clutter and arrange what
    you’re doing, plus clicking the desktop buttons on the panel to jump from place
    to place is a blast.


    For example, you can tuck your poker game down in Desktop 4, and then use Desktop
    1 for the report you’re writing, Desktop 2 for your graphics programs, and Desktop
    3 for Internet dial-up, browsing, and e-mail.


    Corel Linux gives you four desktops by default, though you can run as many as
    eight desktops at once. Right-click a blank spot on the panel and choose Configure.
    Then click the Desktops tab and choose how many desktops you want.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# Using Sticky Windows


    After the invention of multiple desktops, could sticky windows be far behind?
    Click that little pushpin at the upper left of any window to stick the window
    on all your desktops. For example, you might want to make the Text Editor sticky
    if you''re writing something that involves applications in several desktops.


    > I like to use the sticky (pushpin) button to move a window to another desktop.
    For example, to move my poker game from Desktop 1 to Desktop 4, I simply click
    the sticky button, go to Desktop 4, and click the pushpin again to unstick the
    poker game, so it appears only in Desktop 4.


    # Dancing around with the Desktop Manager


    Click the little button to the left of the desktop buttons on the panel to pop
    up the graphical Desktop Manager, as seen in Figure 18-3. Now you can drag applications
    between desktops. Cool!


    ![](img/82794ff9433a50ada079e99ce57c4c4f_315_0.png)'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# Iconifying Windows


    Even when you''re using multiple desktops, they can still get pretty messy. One
    of the best ways to get rid of window clutter is to iconify the windows you''re
    not using at the moment. This removes the windows from view but leaves their task
    buttons behind on the panel.


    +   To iconify a window, you can either click its iconify button in the upper
    right or click its task button on the panel. To bring the window back, click the
    task button.


    # Going for the Max


    +   For big-time programs such as WordPerfect, you might want to push everything
    else aside and grab all the screen space you can get. Simple, just click the maximize
    button (the middle one in the upper right) to plaster your window all over the
    desktop.


    +   Notice that when you blow up a window to the max, the maximize button becomes
    restore. Click the restore button to deflate the window back to its original size.


    # Doing the Incredible Right-Click


    One great thing about a graphical interface is the context-sensitive right-click,
    which presents you with different options depending on where you are and what
    you''re doing. For example, right-click on the desktop, as in Figure 18-4, to
    arrange your icons, create a new nickname or desktop folder, or log out of the
    system.


    The incredible right-click works in almost every application. You don''t know
    what to do? Right-click!'
  merge: -1
  img_proc: true
