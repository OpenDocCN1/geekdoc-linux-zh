- pgno: 166
  md: '# Adding buttons to the panel (not)


    In a normal KDE environment, you can add buttons to the panel similar to the way
    you add desktop icons, such as by dragging a program from File Manager to the
    panel. Unfortunately, this feature isn''t present in the initial release of Corel
    Linux.


    The closest you can come to adding a button to the panel is to create a desktop
    nickname (not a link) and then drag the nickname to the panel to create a button.
    However, you can''t then remove the desktop icon, leaving just the panel button,
    because deleting the icon deletes also the kdelnk file used by the panel button.


    You can rearrange your panel buttons, if you''re so inclined. Right-click a button,
    choose Move, and then drag the button to another location in the row.


    # It''s Your Keyboard, Too!


    Keyboard shortcuts often get short shrift in a graphical environment. They take
    a bit of memorization, whereas the graphical ways are usually staring you in the
    face. That said, if you look over the keystroke tables in Chapter 5, you''ll find
    a lot of handy tricks that can speed up your work, such as


    +   - Global desktop keys such as Ctrl+Tab to switch desktops and Ctrl+Esc to
    display and switch tasks

    +   - Standard program keys such as Ctrl+C for copy, Ctrl+V for paste, Ctrl+S
    for save, and Ctrl+P for print. I almost forgot: Ctrl+Z (Undo) comes in handy
    a lot!


    You can modify your global and standard shortcut keys. The best way to do this
    is by setting up custom keyboard schemes. Before you go and do that, keep in mind
    a few points:


    +   - Keyboard changes and custom keyboard schemes apply to each particular user
    but are not desktop-specific.

    +   - You can''t change your function keys (F2, F3, and so on).

    +   - You can assign actions to any Shift, Ctrl, or Alt key combinations with
    another key. If a combination is already taken, the editor lets you know.

    +   - Standard keyboard changes do not apply to all programs. For example, if
    you change save to Ctrl+A, you might still find that certain programs still insist
    on using Ctrl+S to save.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# ## Creating a custom keyboard scheme


