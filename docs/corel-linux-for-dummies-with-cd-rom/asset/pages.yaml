- pgno: 289
  md: 'Some users of POP mail servers click the POP tab and choose to leave messages
    on the mail server so that they can read them from two or more locations. Most
    servers have a size quota, though, so be sure you delete the messages when they’re
    no longer needed. Otherwise, you may find that future incoming messages are bounced!


    # How Your Personal Mail Is Organized


    Although you might never spot them, your e-mail system comes with little gremlins
    that sort your messages as you go about your e-mail business. As you can see from
    Figure 16-1, your e-mail gets sorted into various folders, described in Table
    16-1.


    **Table 16-1 Folders That E-mail Gremlins Use to Sort Messages**


    | Folder | What the Gremlins Put in It |

    | :--- | :--- |

    | Inbox | Messages you got |

    | Unsent messages | Messages completed (usually offline) and waiting to be sent
    |

    | Drafts | Messages you’re still working on |

    | Templates | Standard partial messages that you can fill out and send over and
    over, such as a weekly report of UFO sightings |

    | Sent | Copies of messages you sent to others |

    | Trash | Deleted messages (until you empty the trash) |


    As messages relentlessly pile up, you can sort them into subfolders organized
    by topic. (See “Deleting and organizing messages” later in this chapter.)


    # Picking up Your E-Mail


    Suppose you’re all set up and want to see whether the friend you gave your e-mail
    addresses to has sent you any messages. Ready? Time to go pick up your e-mail:


    +   1. **Activate your network or dial-up access, if necessary.**

    +      For a dial-up, choose Application Launcher → Applications → Network → Dial-Up.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '+   2.  Choose **Application Starter** Applications Netscape Communicator Netscape
    **Messenger**.


    If you’re already browsing the Web with Netscape Navigator, simply click the little
    Inbox button in the Component bar and skip Steps 1 and 2. You see a little green
    arrow when you have messages waiting.


    +   3.  Select the message you want to read.

    +   Unread messages appear in **bold**.


    # Printing and saving messages


    Click the **Print** button (or choose File Print) if you want to print the current
    message and show it to a friend. (Just make sure the message doesn’t contain last
    year’s jokes.)


    To save the current message to disk (outside your mail folder), choose File Save
    As File and then specify the filename and location. You can also choose File Save
    As Template to save the message as a reusable fill-in-the-blanks message in the
    **Templates** folder.


    # Viewing e-mail links and attachments


    If a message includes a Web link, you can click the link to view the object of
    the link in your browser. When a message has an attached file, a paper clip icon
    appears in the message. Click the paper clip and then click the file, to view
    it in its associated application or save it to disk.


    # Picking up new messages


    Your incoming mail server is checked every 10 minutes or at whatever interval
    you specify. If you can’t wait, click the **Get Msg** button.


    # Configuring Your Messenger Display


    You can configure your Messenger display to view your folders, listings, and messages
    more readily:'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# 262

    Part IV: Doin'' Your Own Thing


    ![](img/82794ff9433a50ada079e99ce57c4c4f_291_0.png)


    # Figure 16-6: Select folders from the Location bar when they''re not on display.


    Click the buttons in the upper right to maximize and minimize your display or
    drag a side or corner of the display to adjust its size.


    Drag the little squares to adjust the dividing lines separating the folder listing,
    message listing, and message display.


    Click the little triangle to the left of the Location bar to alternately hide
    and display the folder listing. Note in Figure 16-6 how you can still select folders
    from the Location bar when they''re not displayed.


    # Addressing Your Needs


    It’s funny how when you want to contact someone these days, the first thing you
    look for is not their street address or telephone number but their virtual e-mail
    address! Of course, the Communicator address book has entries for the physical
    address too, but it’s the virtual one we need for e-mail. Choose Communicator
    → Address Book to display the address book, as shown in Figure 16-7.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Use your Windows address book in Linux!


    Communicator’s addresses are stored in the pab.na2 database in your personal .netscape
    folder. Do you have a Netscape Address book in Windows that you want to use in
    Linux? Copy the pab.na2 file (usually in C:\Program Files\Netscape\Users\yourname)
    over to Linux. You can also choose File ⇄ Import from the Address Book to add
    other types of address books to Communicator.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_292_0.png)


    To add someone to your address book, click the New Card button and fill in the
    entries.


    Click the From: line in a message you received to instantly add the sender''s
    e-mail address to your collection!


    # Creating and Sending E-Mail


    To create and send a new e-mail message from Netscape Messenger:


    +   1. Click the New Msg button. You can also choose Message ⇄ New Message (or
    press Alt+M).'
  merge: -1
  img_proc: true
- pgno: 293
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_293_0.png)


    2.  Type the addresses of your recipients. Or click the Address button, double-click
    the names of your recipients, and then click OK.


    As you begin typing an address, partial matches on Address Book names appear automatically.


    3.  Click the triangle to the left of the To field to choose another recipient
    type, as seen in Figure 16-8:


    +   *   Cc (carbon copy), to send a copy to someone indirectly affected by the
    message

    +   *   Bcc (blind carbon copy), to send a private copy, unknown to other recipients


    +   *   Reply-To, to indicate a reply to a message you''ve received

    +   *   Newsgroup, to post to a newsgroup

    +   *   Followup-To, to redirect a newsgroup posting to another newsgroup


    4.  Fill in the Subject box and type the body of your message.


    5.  If you want to spell-check your message, click the Spelling button.


    6.  To include a file, Web page (URL), or your Address Book card, click the Attach
    button.


    7.  Click the Send button to send your message on its way.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_293_1.png)


    Figure 16-8:  Changing the recipient type.'
  merge: -1
  img_proc: true
- pgno: 294
  md: "# Sending messages later\n\nTo compose messages now to send later:\n\n+   1.\
    \ Create each message in the normal manner.\n+   2. Choose File ⇔ Send Later.\n\
    +   3. When you’re ready to send your messages, choose File ⇔ Send Unsent Messages.\n\
    \n![](img/82794ff9433a50ada079e99ce57c4c4f_294_0.png)\n\nThis feature enables\
    \ you to compose your messages while you’re offline, either because you don’t\
    \ have access at the moment or you want to save online charges.\n\n# Drafting\
    \ a message\n\nTo draft a message and then complete and send it later:\n\n+  \
    \ 1. Create the message in the normal manner.\n+   2. Click the Save button and\
    \ choose As Draft.\n+   3. When you’re ready to complete the message, display\
    \ the Drafts folder under Local Mail and double-click the message in the listing.\n\
    \n# Replying to a message\n\nTo reply to a message you received:\n\n+   1. Click\
    \ the Reply button (or right-click the message and choose Reply to Sender Only).\n\
    +   \n+   Click the Reply All button to reply to the sender and all recipients.\n\
    +   2. Type your reply above, below, or within the quoted message (wherever seems\
    \ most appropriate).\n+   \n+   You can also delete superfluous parts of the quoted\
    \ message to focus your reply.\n+   3. Click the Send button."
  merge: -1
