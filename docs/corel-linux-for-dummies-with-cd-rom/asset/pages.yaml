- pgno: 44
  md: 'All versions of the program include a slew of other programs and utilities
    to let you play games, create graphics, set up a network or Web server, and even
    create your own Linux programs.


    # Corel Linux Is Less Powerful, Right?


    If Corel Linux is so easy, surely it''s less powerful, Right?


    Wrong! If anything, Corel Linux is more powerful than other versions, with such
    tools as the Corel File Manager, a super-clever update facility, and a souped-up
    Control Center. It might be aimed at the desktop user, but you can still set up
    a Web server or install a zillion packages, and the command line is there for
    any geek who needs it.


    And don''t forget, the Debian engine powers Corel Linux!


    # Can I Still Use Windows?


    Perhaps you''re saying, "I have Windows installed, with my favorite word processor,
    Web browser, and drawing program — and I crash only two or three times a day.
    Can I use Corel Linux, but keep the (ugh) Windows stuff for now?"


    Certainly! Having two operating systems on one machine is not as simple as, say,
    two word processors, but most Linux vendors provide the tools to do just this.
    Hey, Linux is the new penguin on the iceberg — it''s gotta get along with its
    neighbors!


    Corel Linux offers some nice possibilities:


    +   - You can set up a *dual-boot* machine, where you can choose which operating
    system — Linux or Windows — you want to run on startup.

    +   - You can take Corel Linux for a test drive, without reformatting your hard
    drive or creating a Linux partition. This is a relatively safe way to try out
    Corel Linux on a Windows machine.

    +   - Corel Linux lets you read and write to files in folders set up by Windows
    programs. (From Windows, you can only read Linux files — and it takes a third-party
    utility to do so.)

    +   - If your machine is on a Windows network, you can set up Corel Linux to access
    the network too.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# # Preparing for Takeoff


    You don’t have to give up Windows to use Linux. Many folks will have Linux and
    Windows coexisting for the next couple of years. Linux is coming on fast and has
    some great advantages, but it’s still playing catch-up in some areas. For example,
    you might be using a speech program or scanning software that, as yet, has no
    equivalent in Linux.


    Or perhaps you’ve paid for Windows and a bunch of other programs that you have
    no intention of giving up. Then there’s the adage, “If it ain’t broke, don’t fix
    it.” That’s one I’ve never managed to follow, but boy, does it ever apply to computers!


    Enough said. Join in the fun and games! Take a deep breath . . . or run around
    the block to get rid of your excess energy before turning to Chapter 2. Setting
    up Corel Linux is a snap, but you should be at your mental and physical best.
    If Corel Linux is already installed on your machine, take a free pass to Part
    II or anywhere else you want to go. You can stop by the refrigerator along the
    way.'
  merge: -1
