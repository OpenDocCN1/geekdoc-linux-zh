- pgno: 252
  md: '# Chapter 14

    Playing with Pictures and Sounds


    # In This Chapter


    +   - Creating original art masterpieces

    +   - Opening, viewing, and printing PostScript and PDF files

    +   - Playing around with CDs


    Although words are a necessity, sometimes, pleasurable pictures, accompanied by
    a little music, of course, can really liven up that old newsletter or report.
    In this chapter, you look at some of the things that Corel Linux lets you do in
    the graphics and sound departments:


    +   - Create graphics with GIMP

    +   - View and print PostScript and PDF files (serious business)

    +   - Play CDs (a blast!)


    # GIMPing with Graphics


    Digital graphics are all over the place these days, especially with the explosion
    of Web graphics and digital photography. Corel Linux comes with a powerful image
    manipulation program known as the *GIMP* that''s designed for professionals and
    amateurs alike, as shown in Figure 14-1.


    The GIMP is short for the GNU Image Manipulation Program. It''s a freely distributed
    piece of software that lets you create original images and edit others, such as
    with photo retouching.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_252_0.png)


    Corel will be porting its signature CorelDRAW powerhouse to Linux in the near
    future. Now that''s something to look forward to!'
  merge: -1
  img_proc: true
- pgno: 253
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_253_0.png)


    Figure 14-1:

    Example of a professional artist GIMPing along.


    # What GIMP can do


    Now just because GIMP is free, don''t get the idea that it''s not powerful. When
    I right-click on my original masterpiece, as shown in Figure 14-2, I see enough
    tools, filters, dialog boxes, and options to make my head spin. This one powerful
    bitmap, baby!


    ![](img/82794ff9433a50ada079e99ce57c4c4f_253_1.png)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_253_2.png)


    Figure 14-2:

    A powerful bitmap, baby!'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# What’s GNU?


    So what’s GNU? Not the animal, but the Free Software Foundation’s name for its
    “not UNIX” UNIX-compatible nonproprietary software. GIMP is a prime example of
    this software, which anyone can download, modify, and redistribute, as long as
    they agree not to limit further redistribution.


    Just to give you an idea of GIMP’s power, I compiled a tip-of-the-iceberg list
    of features taken from the GIMP. org Web site. GIMP features


    +   * A brush, pencil, airbrush, clone, and more

    +   * Tile-based memory management so that image size is limited only by available
    disk space

    +   * Sub-pixel sampling for all paint tools for high quality anti-aliasing

    +   * Full alpha-channel support

    +   * Layers and channels

    +   * A procedural database for calling internal GIMP functions from external
    programs, as in Script-fu

    +   * Advanced scripting capabilities

    +   * Multiple undo/redo (limited only by disk space)

    +   * A virtually unlimited number of images may be open at one time

    +   * A powerful gradient editor and blend tool

    +   * The capability to load and save animations in a convenient frame-as-layer
    format

    +   * Transformation tools such as rotate, scale, shear and flip

    +   * Support for file formats such as gif, jpg, png, xpm, tiff, tga, mpeg, ps,
    pdf, pcx, and bmp

    +   * The capability to load, display, convert, and save to many file formats

    +   * Selection tools such as rectangle, ellipse, free, fuzzy, bezier, and intelligent

    +   * Plug-ins for the easy addition of new file formats and new effect filters

    +   * More than 100 plug-ins

    +   * Support for custom brushes and patterns

    +   * Much, much more!


    Much, much, more for sure, and more features and enhancements with each release.
    GIMP does screen captures too.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# Bitmap and vector images


    GIMP handles many kinds of bitmap images. Bitmaps are digital images made up of
    thousands of tiny squares of different-colored picture elements, known as pixels.
    Bitmaps are good for photographs and fine art, with subtle shadings and vivid
    detail.


    Another class of images, *vector* graphics, is used for drawing, charting, and
    computer aided design (CAD) programs.


    # Launching GIMP


    To start GIMP, choose Application Starter ☣ Applications ☣ Graphics ☣ GIMP. The
    program sets itself up the first time around, and then loads itself and numerous
    plug-in extensions, as shown in Figure 14-3.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_255_0.png)


    # Creating an image


    After loading and displaying your GIMP tip of the day, the little GIMP toolbox,
    shown in Figure 14-4, appears on your screen.


    "What," you exclaim, "this is all I get? Oh well, waddya expect for free? Be patient,
    from a little acorn a mighty oak can grow. For starters, choose the File menu
    at the top of the toolbox and then choose New to open an image window. Grab a
    pencil or brush or some other tool described in Table 14-1, and start creating
    your bitmapped masterpiece."


    When you right-click in the image window, you get the File menu selections plus
    all the tools, filters, selections, and so on.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_256_0.png)


