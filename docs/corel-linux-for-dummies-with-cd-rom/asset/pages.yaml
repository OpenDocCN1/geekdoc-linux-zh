    +   * Choose Specify static IP address and enter the address if an IP address
    is permanently assigned to your computer. (Check with your system administrator
    for the information required here.) If your network contains subnetworks, fill
    in the IP address of the subnet mask and default gateway so your computer can
    access the entire network.


    +   7. Click the DNS Server tab. Then click Add to enter the IP address for each
    Domain Name Service (DNS) server your local network uses, as shown in Figure 4-19.
    Click OK.


    The DNS server resolves host and domain names into IP addresses.


    +   8. Click OK to save your TCP/IP network setup.'
