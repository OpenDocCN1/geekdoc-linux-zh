- pgno: 234
  md: '# Creating and Managing File Archives


    Oh, no, another one of those scary headings! No sweat, as soon as you try your
    hand at creating an archive, you''ll see that it''s no big deal.


    > “But, wait, what''s a file archive?”


    Thanks for asking. I like readers like you. An *archive* is a collection of related
    files, stored as one file, normally in a compressed format. “Why do that?” you
    ask. Because a single archive is neat, compact, and easy to handle, especially
    if you''re sending it to someone else. For example, when I sent this chapter and
    all its figures to my editor, I packed them into a single archive and then attached
    the archive to an e-mail saying “Sorry this chapter''s late; the readers asked
    a lot of questions!”


    Another archive example is the desktop themes covered in Chapter 10. Each theme
    is a single archive containing wallpapers, buttons, sounds, and all kinds of other
    stuff. Look at the archive for the MGBreizh theme in Figure 12-11 to see what
    I mean.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_234_0.png)


    **Figure 12-11:** The archive of the MGBreizh theme contains all sorts of stuff.


    The MCBreizh archive has 28 files totaling 694K. When you look in File Manager,
    you see that the MCBreizh archive file is only 459K, however, because the files
    in the archive are compressed. When you select MCBreizh in Theme Manager, the
    archive is uncompressed for use.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Help! What are all these archive types?


    Oops, more technical stuff. Several archive file types are available. Each employs
    a different technique to squash down a file (or collection of files) for efficient
    transport and then uncompress it for use after its arrival at the new location.


    gunzip to compress and uncompress archives, respectively.


    ZIP is the most popular compressed format in Windowland. Many utility programs,
    such as WinZip, simplify the task of managing zip archives.


    Compressed files are identified by their respective filename extensions. (An uncompressed
    tar archive is simply .tar.)


    The Corel Linux Archive Administrator employs the tarutility, which, in turn,
    can employ gzip and


    The Archive Administrator can recognize a number of compressed file types, including
    .gz, .tgz, tar.Z, tar.lzo, .lzh, .rar, .zoo, and .zip.


    Please note that .tgz is short for, and equivalent to, tar.gz. This combined use
    of tar and gzip is often used under Linux.


    # Creating an archive


    So when you assemble a theme, a chapter with figures, a bunch of photos, or whatever,
    put them in an archive:


    +   1. Choose Application Starter ✧ Applications ✧ Utilities ✧ Archive Administrator.


    +   2. Click the New button, as shown in Figure 12-12.


    +   3. Go to the folder where you want to place your archive.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_235_0.png)'
  merge: -1
  img_proc: true
- pgno: 236
  md: '4. **Type a name for the archive, as shown in Figure 12-13.** Typing an extension
    is optional. If you don''t type an extension, .tgz is used, creating an archive
    compressed with gzip. Specify _.tar to create an uncompressed archive.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_236_0.png)


    5. **Click Save.**


    6. **Click the Add button. Select the files to add to your archive, as shown in
    Figure 12-14. Click OK to add the files.**


    ![](img/82794ff9433a50ada079e99ce57c4c4f_236_1.png)


    7. **Repeat Step 6 to add files from other folders.** The files you add are copied,
    not moved — the original files remain intact.


    8. **Click the Close button to exit the Archive Administrator.**'
  merge: -1
  img_proc: true
