- pgno: 197
  md: '# Putting on the Pixels


    Most of the old, low-resolution, 14-inch monitors are long gone — and not missed.
    In the bad old days, you had to press your nose to the screen to see what was
    there, meanwhile getting zapped with a dose of radiation.


    If you''re using a desktop computer, chances are that the mysterious measurement
    of your monitor is 15 inches, 17 inches, or even 19 inches or larger. If so, the
    amount of information you display on your screen is a matter of personal preference.
    Depending on your graphics card, you can go from the minimal 640 x 480 screen
    pixels (recommended only for crash recovery) to the 1280 x 1024 pixels in Figure
    10-17 or higher.


    The greater the number of pixels on your screen, the sharper the images appear.
    On the other hand, you might end up squinting at dialog boxes, toolbars, and other
    screen objects because their fixed number of pixels will take up less screen space
    on a particular monitor. Corel Linux seems to be most comfortable at 800 x 600
    pixels, the resolution used for the figures in this book, or at 1024 x 768.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_197_0.png)


    Figure 10-17: Putting on the pixels — a screen resolution of 1280 x 1024.'
  merge: -1
  img_proc: true
