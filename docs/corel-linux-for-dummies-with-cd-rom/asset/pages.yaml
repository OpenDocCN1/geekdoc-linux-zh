- pgno: 38
  md: '# Chapter 1


    # I Can''t Believe It''s Really Better!


    # In This Chapter


    +   ► Finding out how to pronounce Linux

    +   ► Discovering why Linux is not just another OS

    +   ► Revealing what’s special about Corel Linux

    +   ► Savoring the four flavors of Corel Linux

    +   ► Exposing the power of Corel Linux

    +   ► Getting the answer to “Can I still use Windows?”

    +   ► Preparing yourself to install Corel Linux


    The first thing you’ll want to know about Linux is how the heck to pronounce it.
    Okay, stretch your mouth back and repeat after me, “lee-nucks, lee-nucks, lee-nucks!”


    Now that the hard part’s over, we can get on with the rest of the book.


    # All Right, What Is Linux?


    Just what is Linux and where does it come from? Linux is the brainchild of Linus
    Torvalds, who decided to write a compact version of the powerful UNIX operating
    system while he was a student at the University of Helsinki in Finland.


    What’s an operating system (or OS), you ask? It’s a program, such as Linux or
    Windows, that controls your computer and manages everything from keyboard and
    mouse input to monitor, disk, and printer output — and everything in-between.
    It also maintains security and acts as a traffic cop to keep programs from tripping
    over one another.


    Until now, Linux has served as a low-cost computing workhorse, powering many networks
    and servers behind the scenes. Although it has been around less than a decade,
    its capabilities have grown at a prodigious rate. For example, the animations
    for the Oscar-winning movie Titanic were produced on Linux systems. And when the
    U.S. Department of Energy built the world’s most powerful supercomputer, guess
    what operating system they used!'
  merge: -1
  img_proc: true
