- pgno: 114
  md: '# Chapter 6

    Meet the Stars!


    # In This Chapter


    +   ► Checking out the program stars on your desktop

    +   ► Finding out who’s costarring on the main menu

    +   ► Meeting the supporting cast of submenu selections

    +   ► Discovering the installed extras not on the menus

    +   ► Giving the command line its due

    +   ► That’s just the tip of the iceberg of program talent


    A Although Corel Linux is a wonderful operating system, it’s still only a means
    to an end. I’m sure you came here with a purpose — maybe to write a letter, play
    Smielttris, draw a picture, or browse the Web.


    Thousands of Linux programs are out there, with more arriving every day. Choosing
    the ones to put on your system is sort of like wandering the supermarket aisles
    with a shopping cart: text editors on your left in aisle 2; games in aisle 4;
    spreadsheets in aisle 7. Most of the goods in this supermarket are free, so if
    you’re like me, you’re tempted to drive home with a truckload of stuff.


    How do you choose which programs to use? Rather than overwhelming you with every
    text editor or game out there, Install Express does your shopping for you and
    then serves up a carefully prepared feast of applications.


    Of course, none of these programs will do you much good if you don’t know where
    they are or how to run them. That’s where the graphical interface comes in. If
    you’ll allow me to switch metaphors, we can think of the available programs as
    a hierarchy of film or stage actors:


    +   ✓ The stars, with desktop icons or panel buttons

    +   ✓ The costars on the main menu

    +   ✓ The supporting cast, on the submenus

    +   ✓ The installed extras, not on the menus

    +   ✓ The waiting-on-tables-and-driving-cabs crowd of uninstalled programs'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'This chapter shows you what programs you have, with handy cross-references
