- pgno: 103
  md: '# # 74 Part II: Taking the Grand Tour


    ![](img/82794ff9433a50ada079e99ce57c4c4f_103_0.png)


    Wow, this is Linux? Corel Linux is cooler than a Mac or a Windows machine!


    # ## Panel Discussion


    Pretty clean screen, no? First, you have a few "nickname" shortcut icons for quick
    access to your favorite tools and applications, such as the trash can for discarded
    files. North American users generate tons of waste, so they get a dumpster instead.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'Second, you get an all-purpose panel is at the bottom of the screen. The panel
    is your desktop center of operations, so let''s give it a little test run:


    +   1. Click the little **show/hide button** on the left to scoot the panel out
    of the way. Click the button again to bring it back.

    +       When you slide the panel off the screen, a miniature Application Starter
    and window list appear in the upper-left corner of the screen.

    +   2. Click **Application Starter** to locate and run various programs.

    +   3. Click a few **application buttons** just to the right of the Application
    Starter, to launch handy utilities such as the File Manager and Text Editor.

    +       Point to an icon for a second or two to display a descriptive tip of what
    the icon does.

    +   4. Note how for each program you launch, a **task button** appears in the
    middle of the panel. Click the task buttons to switch between applications.

    +   5. Move further to the right and click a **desktop button**. Behold, you can
    switch entire virtual desktops, each with its own applications, just as easily
    as you switch applications on a single desktop! (We''ll get to virtual desktops
    in a few minutes.)

    +   6. Finally, you see the good ol'' date and time in the *docking station* on
    the right, plus a handy icon to click when you''re in the mood to tiddle your
    display settings. You''ll notice that other programs you run, such as notes and
    international keyboards, place icons here for easy access.


    There you have the panel essentials. Oh, try this: Click a blank spot in the panel
    and then hold the mouse button as you drag the panel to the top or side of the
    screen. For a bunch of other panel tricks, check out Chapter 9. You tell me this
    isn''t fun!


    # ## Launching Programs


    Icons on the desktop and panel are great for launching your favorite programs
    and utilities. If you''re looking for everything but the kitchen sink, however,
    go to the program menu instead:


    +   1. Click the **Application Starter**.

    +   2. Click your way through the menus and then **click the program you want
    to launch**, as shown in Figure 5-2.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_105_0.png)


    Figure 5-2: Click the Application Starter, browse the menus, and then click a
    program to launch it.


    Notice how the top selections on the main Application Starter menu have little
    triangles on the right that branch out to *submenus* of additional selections.
    The Applications selection, in turn, branches out into more categories, for Games,
    Graphics, Multimedia, and so on.


    Take a minute to explore the menus to see all the stuff on your system. Jump to
    Chapter 6 if you care to hang out there for a while. Okay, you can play Snake
    Race, but come back soon — there''s more stuff to see in the rest of this chapter!


    # # Switching between Programs


    Back so soon? Want to find out about more tricks?


    Because Linux is a true multitasking environment, you can run a bunch of programs
    at one time without fear that they''ll trip over one another or crash the system.
    But how do you switch from one active program to another, such as from your word
    processor to your Internet browser?


    Couldn''t be easier. Just click the program window you want to use, as shown in
    Figure 5-3.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Chapter 5: Dancin'' on the Desktop


    ![](img/82794ff9433a50ada079e99ce57c4c4f_106_0.png)


    If the program you want isn''t visible, you can always click its task button on
    the panel. Note how the task button for the active program appears pushed in.
    Drag a program window by its title bar (the top part with the name) to position
    it on the screen.


    Tired of using the mouse? Press Alt+Tab to switch between the active programs
    on your desktop. (Press Alt+Shift+Tab to switch in reverse.)


    # Did Someone Say “Multiple Des tops”?


    So, you think running multiple programs is handy? Try running multiple desktops!
    Corel Linux lets you run as many as eight desktops at once, and each desktop can
    have its own program windows.


    Want to play Asteroids at work when your boss isn''t looking? Click the 2 button
    on the panel and play Asteroids in Desktop 2. Then click the 1 button when you
    hear footsteps, to jump back to your regular work. It''s that simple!'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'Even when you''re not playing games, multiple desktops are a handy way to reduce
    clutter and arrange what you''re doing. You might use Desktop 1 for a full-screen
    display of the report you''re writing, Desktop 2 for your graphics programs, Desktop
    3 for browsing the Internet, and Desktop 4 to run a Web server. The possibilities
    are endless and entirely up to you.


    I know, you can''t keep a single Windows desktop from crashing, so it''s hard
    to believe that Linux can handle multiple desktops with aplomb. You''ll just have
    to get used to it! Desktops come in twos, so you can have either two, four, six,
    or eight. Chapter 9 shows how to change this and other desktop settings.


    # Sticky windows


    Now here''s a cute trick:


    +   1. On Desktop 1, open the poker game and play with it a bit.

    +   2. Click the pushpin at the upper left to “stick” the poker game on all your
    desktops.

    +   3. Click the 4 button on the panel to switch to Desktop 4 and then play a
    few more hands.

    +   4. Go to Desktop 3 and click the pushpin again. This “unsticks” the poker
    game, so it appears only in Desktop 3.

    +   5. Try this on a Windows machine (just kiddin'').


    Note that the result (aside from losing $50) was that you moved the poker game
    from Desktop 1 to Desktop 3. Another way to move a window is to right-click its
    title bar, click the To Desktop option, and then choose another desktop, as shown
    in Figure 5-4.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_107_0.png)


    > Figure 5-4: Right-click the title bar to move an application to another desktop.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Desktop Manager tricks


    I saved the best desktop tricks for last. Still playing poker on Desktop 3? Well,
    just to the left of the desktop buttons on the panel, find the little button with
    an arrow. Click the button to pop up the graphical Desktop Manager. Then drag
    the miniature display of the poker game from Desktop 3 in the upper right to Desktop
    2 in the lower left, as shown in Figure 5-5. Way cool, or whatever superlative
    you care to use!


    ![](img/82794ff9433a50ada079e99ce57c4c4f_108_0.png)


    The Desktop Manager gives you a nice visual display of what''s on all your desktops.
    You can switch desktops from there with a click of the mouse. Again, folks, don''t
    try this on Windows.


    # Your Keys to Success


    For those of us who hate to memorize keystrokes and birthdays, the graphical interface
    is a goddess. Like a kid in the candy store or a tourist in a foreign land, we
    just point (and click) to get what we need.


    Nonetheless, most graphical operations have keystroke equivalents that you might
    want to use for any of these reasons:


    +   * You hate using a mouse or other pointing device.

    +   * Your speed demon hands can''t stand the constant interruptions of mou-sing
    around.

    +   * You have a physical limitation that makes pointing and clicking a difficult
    or impossible task.

    +   * You want to show your friends how good you are at memorizing stuff.'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'If you''re old enough to have used a typewriter, you know it''s an excellent
    device for entering text. But the computer keyboard, shown in Figure 5-6, has
    it all over the typewriter. It has the features described in Table 5-1 that make
    it a powerful, versatile tool.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_109_0.png)


    **Figure 5-6:** Your computer keyboard is a powerful, versatile tool.


    **Table 5-1** Keyboard Features


    | Type of Key | Operation |

    | --- | --- |

    | Numeric (keypad) | Found on most full-sized keyboards, lets you perform calculations
    and enter numbers (make sure Num Lock is on). |

    | Function | The pre-mouse standard for performing specific program operations.
    The most notorious function key is F1, for Help. |

    | Shift | Enables all keys, including the function keys, to perform two operations.
    |

    | Ctrl and Alt | Enables the other keys to do multiple functions, just as the
    Shift key does. When used in combination with Shift, they provide more possibilities
    than you’d care to remember. |

    | Arrow | Gets you anywhere on the screen in two seconds flat. Like most other
    keys, the arrow keys repeat when you hold them down. |'
  merge: -1
  img_proc: true
- pgno: 110
  md: '| Type of Key | Operation |

    | :--- | :--- |

    | Special-purpose | Insert, Delete, Home, End, Page Up, and Page Down are special-purpose
    keys. They can be especially handy when used with other keys (such as Ctrl, Alt,
    and the arrow keys). |

    | Esc | A quick way out of dialog boxes, menus, and other tight places. |


    Corel Linux has two types of keyboard shortcuts:


    +   - Global keys for chugging around the desktop and managing windows

    +   - Standard keys for when you''re working in many programs


    Here are the cheat sheets to the global (desktop) and standard (program) keystrokes.
    You can customize these to your liking, as described in Chapter 9. Some programs,
    such as WordPerfect, have separate settings for their keyboard shortcuts.


    # Global (desktop) keyboard shortcuts


    Table 5-2 provides a handy cheat sheet to the global (desktop) shortcut keys.


    # Table 5-2 Handy-Dandy Global (Desktop) Keystrokes


    | Keystroke | Does This Desktop Trick |

    | :--- | :--- |

    | Ctrl+Tab | Switches desktops; hold the Ctrl key and keep pressing Tab till you
    arrive at the one you want |

    | Ctrl+F1 through Ctrl+F8 | Switches to desktop 1 through 8 |

    | Alt+Tab | Switches between active applications; hold Alt and press Tab till
    you arrive at the one you want |

    | Alt+F1 | Pops up the program menu; you can then search the menus by using the
    arrow keys and press Enter to run the highlighted program |

    | Alt+F2 | Enables you to type a Linux command, as described in Chapter 3 |

    | Alt+F3 | Displays a menu of window operations, such as maximizing the window
    to fill the entire desktop, resizing it with the arrow keys, or moving it to another
    desktop |'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Table 5-2 (continued)


    | Keystroke | Does This Desktop Trick |

    | :--- | :--- |

    | Alt+F4 | Closes the current window |

    | Alt+F7 | Moves the window by using the arrow keys |

    | Alt+F8 | Resizes the window by using the arrow keys |

    | Alt+F9 | Makes the current window an icon |

    | Alt+F10 | Maximizes or restores the current window |

    | Ctrl+Esc | Displays the list of tasks you can switch to |

    | Ctrl+Alt+Esc | Kills the next window you click without saving any work |


    ![](img/82794ff9433a50ada079e99ce57c4c4f_111_0.png)


    Alt+Ctrl+Fx and Alt+Ctrl+Shift+Fx (where Fx is any function key) result in a new
    Linux login, like using another machine, and you might not be able to find your
    way out. Stay away from these keystrokes!


    What, you didn’t listen? Okay then, press Alt+Ctrl+F7 to return to your cozy Corel
    Linux desktop.


    # Standard (program) keyboard shortcuts


    Table 5-3 provides a handy cheat sheet to the standard (program) shortcut keys.


    # Table 5-3 Handly-Dandly Standard (Program) Keystrokes


    | Operation | Keystroke |

    | :--- | :--- |

    | Close | Ctrl+W |

    | Cut | Ctrl+C |

    | Copy | Ctrl+X |

    | End | Ctrl+End |

    | Find | Ctrl+F |

    | Help | F1 |

    | Home | Ctrl+Home |

    | Insert | Ctrl+Insert |

    | New | Ctrl+N |'
  merge: -1
  img_proc: true
