- pgno: 320
  md: '# Chapter 19

    # Ten Things I Circeled in the Book


    +   **In This Chapter**

    +   - Logging in as a regular user

    +   - Changing your boot order

    +   - Creating program shortcuts

    +   - Adding the menu editor to your menus

    +   - Using the find-the-window keyboard trick

    +   - Sounding off

    +   - Putting on the pixels

    +   - Customizing your file manager view

    +   - Moving files with drag-and-drop

    +   - Fishing stuff out of the trash


    Do you revere books and hate to dog-ear pages or smear them with marking pens?
    I understand. This chapter gives you some highlights without dog-earing and smearing.


    # ## Logging In as a Regular User


    If there’s one thing for you to remember, it’s to avoid logging in as the root
    superuser, because this gives you the power to screw up critical system files.
    Make a habit of logging in under your regular user name instead. When you do need
    root access to, say, add a new user or install fonts in WordPerfect 8, remember
    to log out when your root tasks are finished and then log back in under your regular
    user name.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_321_0.png)


    Often you don’t have to log in as root to perform a system task. For example,
    when using Corel Update as a regular user, the program simply prompts you to enter
    the root password.


    # Changing Your Boot Order


    Suppose you converted your Windows machine to a dual-boot Linux/Windows system.
    Normally, you boot up and do all your work, Web browsing, and e-mail in Linux.
    You only occasionally use Windows programs when there’s no close substitute.


    But your spouse just hasn’t gotten around to changing from the old ways and goes
    berserk when the machine boots up to Linux. The best way out of trouble, in this
    case, is to follow the instructions in Chapter 4 to change your Corel Linux Loader
    (LLO) to boot to Windows by default.


    # Creating Program Nicknames


    Putting program nicknames on your desktop is a great way to launch your favorite
    applications. For example, if you used Dial-Up a lot, you can put its nickname
    right on your desktop, so you don’t have to hunt in your menus.


    Here’s the trick for putting a program nickname on your desktop:


    +   1. Log in as the user for whom you’re creating the shortcut.


    +   2. Do one of the following:


    +   • Open the program for which you’re creating the shortcut.

    +   • Open File Manager and locate the program.


    +   3. Right-click the title bar of the program’s window or the program in the
    File Manager and then click Create Nickname, as shown in Figure 19-1.


    +   4. Type the nickname to appear on the desktop and then specify any command-line
    options, as shown in Figure 19-2.


    For more on creating nicknames, see Chapter 9.'
  merge: -1
  img_proc: true
- pgno: 322
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_322_0.png)


    Figure 19-1:

    Creating a nickname.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_322_1.png)


    Figure 19-2:

    Enter the nickname to appear on the desktop and specify any command-line options.


    # ### Adding Programs to Your Menus


    The best way to spot various program birds in the application forest is to perch
    them neatly on the branches of your menu tree — ducks here, wrens over there,
    with a crow or two on top. Here, in a nutshell, is a real easy way to add a program
    bird, though you have to be logged in as root to do it:'
  merge: -1
  img_proc: true
- pgno: 323
  md: '+   1.  Right-click a submenu, and then choose New ➜ Nickname.

    +   2.  Fill in the name.

    +   3.  Click **Browse**, select the program, and then click **OK**.

    +   4.  If you want to select the program’s icon or a close substitute, click
    **Change icon**.

    +   5.  Click **OK** to add the menu selection.


    Adding a submenu folder is even easier. You’ll find this and other menu-editing
    tricks in Chapter 9.


    # # Using the Find-the-Window Keyboard Trick


    You’ll find lots of keyboard tricks in Chapter 5, but here’s one I especially
    like. When you lose sight of the window you need, hold down the **Alt** key and
    press **Tab** till you find the window you want, as shown in Figure 19-3. Then
    let go, and up pops your window!


    ![](img/82794ff9433a50ada079e99ce57c4c4f_323_0.png)


    Another trick is to press **Ctrl+Esc** to display a scrollable list of all the
    windows on all your desktops.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# # Sounding Off


    If you want to hear what you''re doing, try adding a little noise to your computing
    life:


    ![](img/82794ff9433a50ada079e99ce57c4c4f_324_0.png)


    +   1.  Choose **Application Starter Control Center**, double-click **Sound**,
    and then choose **System Sounds**.


    +   2.  Choose the **enable system sounds** option.


    +   3.  Select an event to which you want to apply a sound, select an associated
    sound, and then click **Apply**, as shown in **Figure 19-4**.


    +   4.  Repeat Step 3 for additional event/sound associations.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_324_1.png)


    Figure 19-4: Associating sounds with your desktop happenings.'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# **Putting on the Pixels**


    Perhaps no other setting affects your visual comfort more than the screen resolution
    you employ. Depending on your graphics card, you can adjust your screen resolution
    anywhere from the minimal 640 x 480 screen pixels to the 1280 x 1024 pixels (shown
    in Figure 19-5) or higher.


    Chapter 10 gives you step-by-step instructions for changing your screen resolution.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_325_0.png)


    > **Figure 19-5**: This screen resolution is 1280 x 1024.'
