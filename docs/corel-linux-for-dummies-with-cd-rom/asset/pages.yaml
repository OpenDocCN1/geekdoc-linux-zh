- pgno: 216
  md: '✓ **Show Hidden Files** refers to files that begin with a period (.), which
    normally aren’t displayed. The idea is if you don’t see it, you won’t mess with
    it.


    ✓ **Show The System** gives you the option to view the entire system, not just
    your personal folders and files.


    Figure 11-12 shows what File Manager looks like when you remove the system from
    view but reveal the hidden files. Normally, there’s no need to mess with hidden
    files, so you might as well keep them from cluttering up your view. But remember
    that they’re there because sometimes you might need to access a hidden file to,
    say, change a user setting.


    +   Figure 11-12:

    +   File Manager with the system hidden but the hidden files revealed.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_216_0.png)


    # Working with Files and Folders


    Now that you know your way around the File Manager, it’s time see what you can
    do with folders and files. Note that all the operations in this section assume
    that you’ve already opened File Manager and gone to the files and folders you
    want to work with.'
  merge: -1
  img_proc: true
- pgno: 217
  md: "Naming files and folders is sort of like naming children, except there are\
    \ lots more of them so you'd better make them easy to remember and organize. For\
    \ example, you might create a *Schoolwork* folder, with subfolders for History,\
    \ Music, Literature, Physics, Basketweaving, and so on.\n\n# Here are the naming\
    \ rules:\n\n+   ◄ Names can be longer than you'll ever want (256 characters)\n\
    +   ◄ You can mix uppercase and lowercase letters, numbers, and special characters,\
    \ such as the underscore (\\_) and hyphen (-).\n+   ◄ Names are case-sensitive,\
    \ meaning that your Letters folder could have three subfolders named Seth, seth,\
    \ and seTh. (Windows, wisley, won't let you do this.)\n+   ◄ A dot, or period\
    \ (.), is used to set off a filename extension from the rest of the filename.\
    \ For example, LettertoDan.wpd denotes a WordPerfect document; MyDrawing.xbm is\
    \ identified as a bitmap graphic.\n\nThe full path is used to determine whether\
    \ a name is unique. Thus, you can copy a file from one folder to another, and\
    \ have folders for . . ./business/letters and . . ./personal/letters.\n\n# ##\
    \ Creating folders\n\nTo create a new folder within the current one:\n\n+   1.\
    \ **Right-click in the folder and then choose New Folder.**\n+   \n+   You can\
    \ also choose File \\ New Folder.\n+   2. **Type a name for your folder and press\
    \ Enter.**\n\nYou can also right-click the desktop and choose New \\ Folder to\
    \ create a desktop folder as described in Chapter 9.\n\n# ## Renaming a folder\
    \ or a file\n\nTo rename a folder or file:\n\n+   1. Click the name of the folder\
    \ or file and then pause a second and click it again."
  merge: -1
  img_proc: true
- pgno: 218
  md: "You can also click File Rename, or right-click the file and choose Rename.\n\
    \n+   2. Do either of the following:\n+   \n+      * Start typing to replace the\
    \ entire name.\n+      * Click again or press the arrow keys to edit the name.\n\
    \n+   3. Press Enter or click elsewhere in File Manager.\n\n# ## Launching an\
    \ application or viewing a file\n\nTry this trick to launch an application straignt\
    \ from File Manager:\n\n+   1. Make your way to the /usr/X11R6/bin folder.\n\n\
    +   2. Scroll the listing and then double-click the kcalc program, as shown in\
    \ Figure 11-13.\n\nUp pops the calculator, ready to use!\n\n![](img/82794ff9433a50ada079e99ce57c4c4f_218_0.png)\n\
    \n> **Figure 11-13:**\n> Double-click an application to launch it."
  merge: -1
  img_proc: true
- pgno: 219
  md: 'Double-click the icon, not the name, to avoid accidentally renaming your file.


    Likewise, double-click a plain text file, and the file immediately opens in the
    Text Editor. Double-click a WordPerfect document to open the document in WordPerfect.
    Double-click a .tar.gz compressed archive to open it in Archive Administrator.
    Couldn''t be easier!


    # ## Selecting files and folders


    File management operations, such as move, copy, or delete, are performed on selected
    files and folders. You can select a single file or a whole slew of files and folders
    at once. Selecting a folder also selects any subfolders within it.


    Click individual files (or folders) in File Manager to select them. (An individual
    folder can be selected in either tree view or the contents listing.)


    To select a consecutive group of files, click the first file, hold the Shift key,
    and then click the last file, as shown in Figure 11-14.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_219_0.png)


    To select two or more nonconsecutive files in the File Manager, hold the Ctrl
    key as you click each file.


    Click a blank spot in the listing to deselect all the files or hold the Ctrl key
    and click files to deselect them one at a time.'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'Here are a few more tricks:


    +   - Press Ctrl+A or choose Edit ☙ Select All to select the entire contents of
    a folder.


    +   - Choose Edit ☙ Invert Selection to reverse the select state of all the folder''s
    items. For example, if you select one file and then invert the selection, everything
    but that file will be selected.


    # Moving files and folders to another folder


    To move files or folders to another folder:


    +   1. Select the files or folders to be moved.


    +   2. Click the Cut button on the toolbar (or choose Edit ☙ Cut).


    +   3. Open the target folder.


    +   4. Click the Paste button on the toolbar (or choose Edit ☙ Paste).


    # Copying files and folders to another folder


    To copy files or folders to another folder:


    +   1. Select the files or folders to be copied.


    +   2. Click the Copy button on the toolbar (or choose Edit ☙ Copy).


    +   3. Open the target folder.


    +   4. Click the Paste button on the toolbar (or choose Edit ☙ Paste).


    # How do I cut, copy, and paste thee?


    # Let me count the ways!


    Cut, copy, and paste are such ubiquitous file management operations that a whole
    slew of shortcuts have been invented to carry them out. For example, to copy selected
    files you can


    +   - Click the Copy button on the toolbar


    +   - Choose Edit ☙ Copy


    +   - Right-click your selection and choose Copy


    +   - Press Ctrl+C


    Same goes for Cut and Paste. Their respective keystrokes are Ctrl+X for cut and
    Ctrl+V for paste.


    This doesn''t count the drag-and-drop method, which you get to later in the chapter!'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Moving and copying with drag and drop


    To move selected files and folders with your mouse, drag them to the new location
    and drop them into place, as shown in Figure 11-15.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_221_0.png)


    To copy the selected items rather than move them, hold the Ctrl key as you drop
    them into place.


    **TIP**

    In the first release of File Manager, the move operation just described copies
    the files, rather than moves them. No real danger in that, but just be aware that
    you''ll have to go back to the original location and delete the files if you don''t
    want to keep duplicates.


    **TIP**

    You can also drag files and folders to the desktop to move, copy, or link to them,
    as described in Chapter 9.


    # Dumping stuff in the trash


    To dump selected files and folders in the trash:


    +   1. Click the Move to Trash button on the toolbar (or choose File → Move to
    Trash).

    +   2. When asked to confirm your decision, click Yes.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'You can also drag your selection over to the Trash icon on your desktop or
    right-click your selection and click Move to Trash.


    # ### Fishing stuff out of the trash


    Sometimes you dump a file or a whole folder in the trash, and a few minutes later,
    it dawns on you, "Uh, oh (or some more forceful expression), I didn’t mean to
    do that!" Not to worry:


    +   1. Click the Trash icon on your desktop.

    +   2. Select the files or folders you want to retrieve.

    +   3. Right-click and choose Restore, as shown in Figure 11-16, or choose File
    Restore.


    This sends them back from whence they came.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_222_0.png)


    # ### Emptying the trash can


    As I’m sure you noticed, when you trash your folders or files, you’re simply moving
    them to another place — your personal trash folder, to be precise. The files are
    still there, taking up space on your hard drive. Plus your taking'
  merge: -1
  img_proc: true
- pgno: 223
  md: "listing gets so long that it's a bit overwhelming. Well, if you're really,\
    \ really sure you won't be needing something again, you can empty it from your\
    \ trash:\n\n+   1. **Click the Trash icon on your desktop.**\n+   2. **Do either\
    \ of the following:**\n+   \t*   Choose File <sup>↩</sup> Empty Trash to toss\
    \ everything overboard into your hard drive's Bermuda Triangle.\n+   \t*   Select\
    \ only the files and folders you're sure you'll never need and then choose File\
    \ <sup>↩</sup> Delete to deep-six that part of your cargo.\n\nUnlike the bottles,\
    \ cans, fliers, and bubble wrap we throw away, dumping virtual trash leads to\
    \ a cleaner computing environment!\n\n# Deleting files and folders\n\nTo delete\
    \ selected files and folders:\n\n+   1. **Right-click your selection and then\
    \ click Delete (or choose File <sup>↩</sup> Delete).**\n+   2. **When asked to\
    \ confirm your decision, click Yes.**\n\nDeleting stuff removes it immediately\
    \ and for good. You can't go back and fish it out of the trash can."
  merge: -1
  img_proc: true
- pgno: 224
  md: '# ## Chapter 12


    # # Finding Stuff and Opening Archives


    # ### In This Chapter


    +   ▶ Searching for files and folders

    +   ▶ Looking for a computer on your network

    +   ▶ Accessing files on a network

    +   ▶ Unhooking from a network share

    +   ▶ Creating and managing compressed file archives


    Life is an eternal quest — no more so than on your computer or network. Well,
    at least Corel Linux comes with the tools to help you quickly locate stuff on
    your machine or elsewhere on a network.


    Very often, what you find is a collection of related files, such as 96 cauliflower
    recipes, packaged into one neat, compressed archive. You’ll see how to open the
    archive and cook the cauliflower and then create your own archive of 127 ways
    to make peanut butter and cauliflower sandwiches, the healthy alternative to peanut
    butter and jelly sandwiches.


    # ## Finding Files and Folders


    It’s nice to have all your files perfectly classified and organized so that you
    can always figure out exactly where something should be, but real life isn’t so
    logical and tidy. Besides, you might be searching someone else’s files. Perhaps
    you’re looking for a utility on your system or a folder on koalas somewhere on
    a network drive.'
  merge: -1
  img_proc: true
- pgno: 225
  md: "# 196  Part IV: Doin' Your Own Thing\n\nNo matter what you're looking for,\
    \ the Find Files utility is the place to go. You can search for files and folders\
    \ based on any or all of the following:\n\n+   Name  \n+   Location  \n+   Date\
    \ modified  \n+   File type  \n+   File size  \n+   Text found in the file\n\n\
    Text names are case sensitive (for example, Cat and cat are not the same). If\
    \ you're not sure of the exact name or contents, you can use the following wild-card\
    \ substitutes for particular characters:\n\n+   * substitutes for zero or more\
    \ characters  \n+   ? substitutes for a single character  \n+   [A-Z] or [a-z]\
    \ substitutes a range of uppercase or lowercase characters for a single character\
    \  \n+   [0-9] substitutes a range of numbers for a single character\n\nFor example:\n\
    \n```\nTe*.wpd\n```\n\nmatches all WordPerfect documents starting with Te. A search\
    \ on\n\n```\nwil*d*d\n```\n\nmight find files containing wildcard or wildcat ed.\
    \ A search on\n\n```\n[1-2 2][0-4]*.tif\n```\n\nmatches 1417.tif and 2009.tif\
    \ but not 0114.tif or 2501.tif, for example.\n\n# Doing a basic search\n\nTo search\
    \ for files or folders:\n\n+   Choose Application Starter -> Find -> Files or\
    \ Folders.\n+       Or in the File Manager, choose Tools -> Find Files or Folders.\n\
    +       In the Named box, type the name of the folder or file you're searching\
    \ for, as shown in Figure 12-1.\n\n![](img/82794ff9433a50ada079e99ce57c4c4f_225_0.png)"
  merge: -1
  img_proc: true
- pgno: 226
  md: "197\n\n![](img/82794ff9433a50ada079e99ce57c4c4f_226_0.png)\n\nYou can click\
    \ the **Named** drop-down list to select from your previous searches.\n\n+   3.\
    \ **Under Look in, specify where you want to start searching from.**\n+   \n+\
    \       Your home folder is filled in by default. You can click the list to select\
    \ from previous search locations or click the **Browse** button to locate a folder.\n\
    +   \n+       Type / to search your entire system. Leave the *Look in* box blank\
    \ to start searching from the /root folder.\n\n+   4. To search the entire branch\
    \ of your file system, starting at the folder you specified, choose the **Include\
    \ subfolders** option.\n\n+   5. Click the **Start Search** button. (You can also\
    \ press Enter or choose **File** \\[icon\\] **Start Search**.)\n+   \n+      \
    \ You should hear a whirring and clicking as little elves run around to fulfill\
    \ your search and then deliver the results, as shown in Figure 12-2.\n\n# Stopping\
    \ a search in its tracks\n\nSometimes you want to stop a search before it’s finished.\
    \ Perhaps what you’re looking for has already shown up in the list, or the search\
    \ is going on forever, or you’re searching for the wrong thing. Simply click the\
    \ **Stop Search** button to end it now (or choose **File** \\[icon\\] **Stop Search**)."
  merge: -1
  img_proc: true
- pgno: 227
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_227_0.png)


    Figure 12-2: Hey, the elves found something!


    # Clearing your search results


    Click the **New Search** button if you want to clear your search results before
    starting a new search.


    # What do I do with the stuff I found?


    Okay, you''ve found what you''re looking for. Now what? You can do pretty much
    do everything you can do in File Manager:


    +   1. Click an item in the search results listing.

    +   2. Click the following buttons to perform various tricks:


    +   - **Open** performs the operation associated with the item, such as launch
    an application, open a folder in File Manager, or open a document in the text
    editor. You can also double-click an item to perform its open operation.

    +   - **Open Containing Folder** opens the folder where the item is stored (the
    parent folder for a folder).

    +   - **Delete** gets rid of the item for good.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'When you delete an item, it’s gone and you can’t get it back. For a more cautious
    approach, drag the item in the listing over to the trash can on your desktop.


    +   * **Add to Archive** adds the item to an existing file archive. (You can’t
    create a new one.)

    +   * **Save Search Results** creates a file of clickable links from your listing.


    # *Sophisticated searching*


    In most cases, a basic search is all you need to quickly locate something. If
    you’re having trouble, though, try a sophisticated search:


    +   1. Choose **Application Starter ⌘ Find ⌘ Files or Folders**.

    +   2. Type the name of the folder or file you’re searching for, where you want
    to search from, and whether to include subfolders in your search.

    +   3. Choose the **Date Modified** tab and make your selections.


    You can specify dates to search between, as shown in Figure 12-3, or you can search
    during a previous number of months or days.

    Enter “between” dates in the dd/mm/yyyy format.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_228_0.png)'
  merge: -1
  img_proc: true
- pgno: 229
  md: '4. **Click the Advanced tab and make your selections.**

    You may select a particular type of file to search for, text to look for if you''re
    searching a document, or a file size no bigger (At Most) or smaller (At Least)
    than the number of kilobytes you specify, as shown in Figure 12-4.


    5. **Press Enter or click the Start Search button.**


    ![](img/82794ff9433a50ada079e99ce57c4c4f_229_0.png)


    # ## Finding a Computer on Your Network


    If you need stuff from another computer on your network but you don''t know where
    the computer is located, you can search to find its location. You''ll then be
    able to access its files and create a desktop link so you won''t have to search
    again:


    +   1. **Choose Application Starter ❊ Find ❊ Computer.**

    +   Or in the File Manager, choose Tools ❊ Find Computer.

    +   2. **Type the name of the computer you''re searching for and then click the
    Start Search button.**

    +   All computers found are listed, as shown in Figure 12-5.'
