- pgno: 231
  md: '4. Click the Close button to exit Find Computer.


    # # Getting into Files on a Network

    (Mounting a Network Share)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_231_0.png)


    Because you''re reading this, I guess you''re not intimidated by technical sounding
    terms such as “mounting a network share.” And now that you''re here, I suppose
    you want to know what it means. Well, mounting is the process of taking a file
    system from somewhere, such as your floppy or CD-ROM, and plugging it in as a
    branch of your file system tree. The network share part is nothing more than a
    folder on another computer, so here we''re talking about making a remote folder
    part of your local tree. Of course, this section is useless if you have a machine
    that''s not hooked into a network.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_231_1.png)


    You must also have permission to access the remote folder to mount it. If not,
    you''ll be prompted for the password.


    Still sounds complicated? Well, it''s not hard to do:


    ![](img/82794ff9433a50ada079e99ce57c4c4f_231_2.png)


    +   1. Click the File Manager button on the panel.

    +   2. In the tree listing (on the left), choose either a Windows network or an
    NFS network, as shown in Figure 12-7.

    +   3. Choose the server, as shown in Figure 12-8, and then locate and double-click
    the share you want to mount.

    +   4. Choose Tools Mount Network Share to display your mounting information,
    as shown in Figure 12-9.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_231_3.png)


    *The mount point in the figure is where your network share will be inserted in
    your local tree. You can change this mount point, as long as it''s to a folder
    you''re permitted to access.*


    +   5. If you want to automatically mount this network share every time you start
    Corel Linux, choose the Reconnect at logon option.

    +   6. Click OK.


    You can now access the contents of the network folder and perform various file
    operations, just as you do with folders and files on your local drive.'
  merge: -1
  img_proc: true
