- pgno: 155
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_155_0.png)


    # Nicknames or shortcuts?


    Linux nicknames are similar to shortcuts under Windows. I prefer the more user-oriented
    Windows term, but nobody asked me!


    You can save files to a desktop folder just like any other folder. You can also
    drag and drop existing files to the folder, to move, copy, or link the files.


    To go straight to your files, simply click the folder, as shown in Figure 9-3.


    # Creating program nicknames


    Putting program nicknames on your desktop is a great way to launch your favorite
    applications. For example, if you use Dial-Up a lot, you can put its nickname
    right on your desktop, so you don''t have to hunt in your menus.


    What''s especially handy is that you can configure your program nicknames to launch
    with specific parameters. For example, you can have one WordPerfect icon for the
    English interface and another for the French one.


    Figure 9-3: Click the desktop folder to go straight to your files!'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'To put a program nickname on your desktop:


    +   1. **Log in as the user for whom you''re creating the nickname.**


    +   2. **Do either of the following:**

    +       * Open the program for which you''re creating the nickname.

    +       * Open File Manager and locate the program.


    Nicknames created by root appear only on root''s desktop.


    +   3. **Right-click the title bar of the program''s window or the program in
    File Manager and then choose Create Nickname, as shown in Figure 9-4.**


    ![](img/82794ff9433a50ada079e99ce57c4c4f_156_0.png)


    +   4. **Select the nickname as you want it to appear on the desktop.**


    +   5. **Specify any command-line options, as shown in Figure 9-5.** When in doubt,
    leave the Command-line options text box blank.


    +   6. **If you want to customize the desktop icon, click Change icon.** Select
    an icon from one of the lists, as shown in Figure 9-6.


    +   7. **Click OK.**'
  merge: -1
  img_proc: true
- pgno: 157
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_157_0.png)


    **Figure 9-5:**

    Enter the nickname and any command-line options.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_157_1.png)


    **Figure 9-6:**

    Selecting the icon to appear on your desktop.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_157_2.png)


    The xpm icons you select can be found in /usr/X11R6/share/icons and the subfolders
    of /usr/X11R6/share/apps. You can also create your own by using a bitmap editor,
    such as Gimp. Icons you create or find on the Web can then be put in the /usr/X11R6/share/icons
    folder, so they''ll appear among your icon selections.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_157_3.png)


    You can also right-click on your desktop to create a program nickname and then
    browse to select the program.


    # Creating URL nicknames


    If you put URL nicknames on your desktop, you can go directly to your favorite
    Web pages and FTP (file transfer protocol) sites. Just follow these steps:'
