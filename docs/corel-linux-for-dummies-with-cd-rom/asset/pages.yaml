    # Throwing a Theme Party


    You''re invited to a theme party! To attend, you have to dress up your desktops
    in all kinds of crazy outfits. **Themes** are all-in-one packages with everything
    from custom colors and wallpapers to borders, icons, sounds, and more. Some theme
    party outfits are sedate and formal; others are totally wacky and wild!


    ![](img/82794ff9433a50ada079e99ce57c4c4f_192_1.png)


    > Your theme outfits come wrapped in packages — compressed archives containing
    all the elements for that theme. The archive names are in the form of *Themename.tgz*
    or *Themename.tar.gz*.


    Let''s go party!


    +   1. **Choose Application Starter Control Center.**

    +   2. **Double-click Desktop** and then choose Theme Manager.

    +   3. Select various themes in the list to preview them, as shown in Figure 10-12.
    Then select the one you want to apply.

    +   4. Click the Contents tab and choose the various theme parts you want to apply,
    as shown in Figure 10-13. Click to remove or add a check mark.

    +   5. **Click Apply** to wear your new desktop outfit.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_192_2.png)'
