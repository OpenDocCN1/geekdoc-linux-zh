- pgno: 169
  md: '+   1. Choose Application Starter ⚙ Control Center.

    +   2. Double-click Keys and then choose either Global Keys or Standard Keys.

    +   3. In the Key schemes list, select the keyboard you want and then click Apply.


    # Deleting a custom keyboard scheme


    To delete a custom keyboard scheme:


    +   1. Choose Application Starter ⚙ Control Center.

    +   2. Double-click Keys and then choose either Global Keys or Standard Keys.

    +   3. In the Key schemes list, select the keyboard you want and then click Remove.


    When you click the Remove button, your keyboard is immediately deleted, without
    giving you a chance to reconsider the fateful decision. Removing the keyboard
    doesn’t even put it in your trash can.


    # Fine-Tuning Desktop Operations


    The desktop works just fine out of the box or off the CD in the back of this book.
    If you want, however, you can customize desktop operations to suit your tastes
    in a lot of little ways. It’s fun to experiment with the settings described here.
    Who knows? You might just latch onto something that improves the quality of your
    computing life.


    For me, the biggest bonus of the bunch is to autohide the panel. Please, don’t
    get me wrong; the panel is lovely — I just don’t want to stare at it all day.


    # Changing the location and size of the panel and taskbar


    Before we get to autohiding the panel, did you know that you can move it around
    and change its size?


    You can also separate the taskbar from the panel and let the panel go its merry
    way, as shown in Figure 9-19. This can be disorienting, to say the least, but
    some folks can get used to anything.'
  merge: -1
  img_proc: true
