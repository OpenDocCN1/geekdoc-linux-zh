  md: "+   2. Click and drag to enlarge or shrink the window and then let go.\n+ \
    \  \n+   Keyboard alternative: Press A+F8, enlarge or shrink the window by using\
    \ the arrow keys, and then press Enter.\n\n![](img/82794ff9433a50ada079e99ce57c4c4f_146_0.png)\n\
    \nThe current size and shape of each application’s window is remembered from session\
    \ to session.\n\n# Going for the max\n\nFor big-time programs such as WordPerfect,\
