- pgno: 240
  md: '# Chapter 13


    Putting In a Good Word


    # In This Chapter


    +   - A few words about WordPerfect

    +   - Introducing the Text Editor

    +   - Fine-tuning Text Editor options

    +   - Customizing text selections

    +   - Turning your ideas into sticky notes


    A picture might be worth a thousand words, but can you imagine if we communicated
    only with pictures? I know about the prehistoric drawings on the walls of caves,
    but even cave folks spoke, didn''t they? It''s speech that makes us human, and
    writing is just scribble to represent the noises we make. If cave folks had writing,
    I''m sure we''d see “I love you, Muttonbrain” scrawled on the walls or maybe “Meet
    me at the roasting pit when the moon is in the walnut tree.”


    Yes, there''s no substitute for writing, so I expect you''ll be doing some in
    Corel Linux.


    # The Premier Word Processor


    ![](img/82794ff9433a50ada079e99ce57c4c4f_240_0.png)


    If you bought Corel Linux in a box, you''ll have either the Standard Edition''s
    light version of WordPerfect 8 or the Deluxe Edition''s full version. If you have
    WordPerfect, click the WordPerfect icon on the desktop to pop up the most powerful
    Linux word processor around, as shown in Figure 13-1.


    A free, downloadable version of WordPerfect 8 for Linux is available via Corel''s
    Linux Web site at linux.corel.com.


    I''d like to tell you all about the wonders of WordPerfect 8 for Linux, but that
    would take a book in itself—such as my WordPerfect for Linux Bible (published
    by IDG Books Worldwide, Inc.). There''s also the help menu and the printed *User
    Manual* that comes with the Deluxe Edition.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# 212 Part IV: Doin'' Your Own Thing


    ![](img/82794ff9433a50ada079e99ce57c4c4f_241_0.png)


    # Your Handy Little Text Editor


    Many types of text files don''t require all the fancy formatting of your word-processed
    letters and reports. For these, click the pencil on the panel to pop up the handy-dandy
    little Text Editor, which is shown in Figure 13-2.


    If for some reason your panel isn''t around, choose Application Starter → Applications
    → Utilities → Text Editor.


    You can turn off the Text Editor''s toolbar or status bar from the Options menu,
    though there''s really no need to. The status bar shows useful information, such
    as the cursor position, insert or overwrite mode, and whether something such as
    vertical selection is active.


    Is this a word processor we see? No, don''t look for a spell checker, graphics,
    or fancy formatting here. This gizmo is for creating and editing ASCII text files.
    (ASCII is the standard set of character types used in many text files, including
    Linux configuration files.) Ah, ha! The Text Editor is also great for jotting
    down shopping lists, drafting e-mail messages, or anything else where the word
    is the thing. Think of the Text Editor as a plain pizza, not a gourmet meal.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'Menu bar


    Toolbar


    ![](img/82794ff9433a50ada079e99ce57c4c4f_242_0.png)


    Status bar


    # Figure 13-2:

    Click the pencil on the panel to pop up the Text Editor.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_242_1.png)


    TECHNICAL STUFF


    Although ASCII characters remain the same, text file formats can vary from platform
    to platform. For example, the carriage returns in a Linux text file don''t appear
    in the Windows Notepad, so you''ll have to add them back if you copy the file
    to Windows.


    # The programmer''s delight


    Hark programmers: This text editor speaks your language! You can choose Options  Highlight
    Type to select various language types, including C++, Java, Perl, and HTML, as
    shown in Figure 13-3. The editor then makes your life easier by automatically
    applying various highlight styles to keywords, data types, comments, and so on.
    Very clever!


    # Creating a text file


    To create a text file from scratch, simply click the pencil and start typing.
    Notice how the *insertion point* (the blinking vertical bar) moves along as you
    type. As soon as you fill up more than the width or height of the window, scroll
    bars appear. You can drag these or use the arrow keys to navigate the window.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_242_2.png)'
  merge: -1
