    # Good Old Command-Line Extras


    Once upon a time, most Linux programs were run from the command line, without
    the nice, intuitive, graphical interfaces that we''ve come to expect today. Perfectly
    good, even powerful programs, mind you, but many as easy to use as their graphitized
    brethren. For example, who would want to use a command-line text editor, such
    as vi, when you have the graphical kwirite instead. Command-line stalwarts say
    vi is faster after you master its tricks, but I have enough to do figuring out
    my VCR remote.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'That said, some Linux pros resort to command line utilities for some of the
    powerful options they provide. They''re also great to have in emergencies, as
    described in Appendix A. For example, suppose your system''s graphics go wacky
    and you (or some computer guru) must drop into Linux repair mode to fix your settings
    with that little editor we just scorned. Aha!


    # # Program Wannabes


    ![](img/82794ff9433a50ada079e99ce57c4c4f_124_0.png)


    Install Express puts a choice selection of applications on your system, but it''s
    the tip of the iceberg of the thousands and thousands of talented programs floating
    around. You can find a huge waiting-on-tables-or-driving-cabs crowd of uninstalled
    programs on your *Corel Linux For Dummies* CD, at the Corel Linux distribution
    site, or at another distribution site. Chapter 17 shows you how to discover what''s
    out there and how to add, remove, and update programs with Corel Update.'
  merge: -1
  img_proc: true
