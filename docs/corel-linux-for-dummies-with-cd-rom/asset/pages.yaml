    then do one of the following:

    +       * Choose the **No key** option to remove the keystroke assignments.

    +       * Choose the **Default key option** to restore the KDE default to a key
    you’ve changed. (This option appears dimmed for actions not assigned to the default
    KDE keyboard.)

    +       * Choose the **Custom key** option, choose the SHIFT, CTRL, and ALT options
    you want, and then click the button to the right and press the key to use in combination
    with the keys you checked. As you can see in the figure, I chose Ctrl+Down.


