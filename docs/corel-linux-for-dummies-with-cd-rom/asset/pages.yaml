    Your program stars on stage are just one click away.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_115_2.png)


    You can figure that if the Corel folks saw fit to put them front and center, they''re
    pretty essential for most users. If you''re not one of the "most users," you can
    add, remove, and rearrange the cast as you see fit. But that''s a subject for
    Chapter 9. For now, let''s look at these star programs as described in Table 6-1.'
