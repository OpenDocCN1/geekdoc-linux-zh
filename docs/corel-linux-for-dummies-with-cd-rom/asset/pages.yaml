- pgno: 247
  md: '# ## Renaming a note


    As your create notes, they''re given the default names of *knote 1*, *knote 2*,
    and so on. To give them meaningful names such as *Shopping List* or *Things to
    Do*, right-click your notes and choose **Operations ⇄ Rename Note**.


    # ## Mouse dragging operations


    Try these dragging operations with your notes:


    +   - Drag a note by its title to move it around the screen.

    +   - Overflow a note with text and then drag a scroll bar to navigate the note.

    +   - For a note with borders, drag a side or a corner to enlarge or shrink the
    note.

    +   - Right-click a note and choose **Options ⇄ 3D Frame** to give it a border.

    +   - Drag text to select it.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_247_0.png)


    # ## Cutting, copying, and pasting text


    After you select text, you can cut, copy, and paste it in the same note, between
    two notes, or between your notes and another application, such as the Text Editor.


    Cut, copy, and paste are a keystroke-only affairs when you''re editing a note:


    +   - Ctrl+X for cut

    +   - Ctrl+C for copy

    +   - Ctrl+V for paste


    # ## Inserting the date or a calendar


    If you''re so inclined, you can right-click a note and then choose **Insert Date**
    to insert the current day, date, and time. To insert a mini-calendar, right-click
    and choose **Operations ⇄ Calendar**.


    # ## Alarming notes!


    You can use notes as virtual alarm clocks to remind you to walk the dog or watch
    *The Simpsons*:'
  merge: -1
  img_proc: true
