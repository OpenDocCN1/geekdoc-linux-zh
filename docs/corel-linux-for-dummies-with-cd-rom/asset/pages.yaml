- pgno: 33
  md: '# Part III: Linux the Way You Want It


    Let''s say you just moved into a beautifully furnished house. How can you call
    it home until you move the furniture around, haul in boxes of books, hang pictures
    on the wall, put dirty dishes in the sink, throw your clothes on the floor, and
    install a cat or a dog? Same in Part III with the Corel Linux desktop.


    # Part IV: Doin’ Your Own Thing


    Like the automobile, the beer can, and the telephone, computers change the way
    we live, work, and communicate. In Part IV, you see how the Corel File Manager
    makes organizing your stuff a breeze. But “Where did I put it?” you ask. Well,
    tracking stuff down is easy too. Want to get in touch? Here you get to link, browse,
    e-mail, and discuss. You see how to lay down some words with the text editor and
    sticky notes. Looking for the latest and greatest? Thanks to Corel Update it couldn’t
    be easier!


    # Part V: The Part of Tens


    In the finest ...For Dummies tradition, I’ve put together lists of the handiest
    information imaginable (with a little help from my friends). You’ll find them
    all here — ten cool desktop tricks, ten neat things to do, ten places to go for
    help, and ten places to get all kinds of free gifts. Come and get it!


    # Part VI: Appendices


    I know Corel Linux is a graphical environment, but sometimes Linux commands can
    come in handy too. They’re here in Part VI in an appendix when you want to use
    them. Computer jargon driving you bonkers? Check out the compact glossary terms,
    and then drop a couple at the next staff meeting or party. Last, but hardly least,
    all the software talked about in this book is on your Corel Linux For Dummies
    CD. How’s that for an unbeatable bargain! To find out more about the CD, check
    out Appendix C.'
