    as seen in Figure 17-2:

    +   - Corel LINUX CD-ROM, to use any CD with Debian packages

    +   - Distribution Site, to update from Corel’s FTP site

    +   - Custom Path(s), to access other sites with Debian packages (see “Setting
    Custom Package Sources” later in this chapter)


    +   5. Click OK and then click the Update Profile button.

    +   Corel Update goes to the sources to find what’s available, as seen in Figure
    17-3.'
