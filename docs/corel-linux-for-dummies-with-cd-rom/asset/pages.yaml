- pgno: 68
  md: '# # Managing System and User Tasks


    Okay, your Linux system seems to run fine. But you really want to be in control.
    You can use the Task Manager to find out about every process and program running
    on your system and terminate any that are misbehaving. Choose Application Starter->Applications->System->Task
    Manager, and then do any of the following:


    +   - To terminate a particular task, click the task and then click the Kill task
    button, as seen in Figure 3-4.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_68_0.png)


    The root user can terminate any user or system process. Other users can terminate
    only the processes they own.


    +   - Click the buttons at the top of the listing to sort tasks by name, user
    ID, memory, and so on.


    +   - Choose the Show Tree option to view groups of dependent processes. Click
    the nearby drop-down list to show all processes, all user processes, your own
    processes, or system processes.


    +   - Click the Performance Meter tab to view your system''s processor (CPU) load
    and memory usage, as seen in Figure 3-5.'
  merge: -1
  img_proc: true
