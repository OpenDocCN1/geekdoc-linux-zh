- pgno: 47
  md: '# The essentials


    No sense installing if you ain''t got the right hardware. As far as the computer
    itself goes, the requirements are minimal. You might even want to get in the closet
    and dig out that old computer that can no longer run Windows (it''s under the
    sneakers and boots) and give it a go. Here are the minimum requirements for Corel
    Linux:


    +   A Pentium 90 (or equivalent) processor

    +   *   24MB of RAM (64MB recommended)

    +   *   500MB of unpartitioned hard drive space (or free space to install on a
    Windows partition) — you can get by with as little as 200MB by using a custom
    install

    +   *   A 2MB VGA PCI graphics card

    +   *   A CD-ROM drive

    +   *   A 3½-inch floppy disk drive (required if your CD-ROM drive is not bootable)

    +   *   A mouse or other pointing device


    I suppose a keyboard and a monitor could come in handy, too.


    Some things you might want to do with Corel Linux require additional hardware:


    +   A modem for dial-up Internet access (and an Internet service provider to dial
    up to)

    +   *   A network card for network hookup

    +   *   A sound card and speakers and maybe a microphone


    # Hardware reality check


    Although Corel Linux requires fewer resources than Windows, its support for particular
    disk drives, modems, printers, mice, and other hardware is not yet as broad. Linux
    does not yet support internal ISDN cards and some DVD drives. This situation is
    improving rapidly as the Linux kernel evolves and as the mushrooming interest
    in Linux spurs hardware vendors into action.


    Avoid Windows-only hardware such as WindowsModems, which employ software to grab
    your computer''s memory for basic operations rather than run them from an on-board
    chip. Some of these modems will be supported by'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'upcoming versions of Linux, but don''t count on it. A similar problem arises
    with some Windows-only (GDI) printers, but they''re much less common than Winmodems.


    The video cards that display stuff on your monitor can also be a problem. Some
    cards don''t have Linux versions of *software drivers* (programs to operate computing
    devices), but this situation is improving quickly. Likewise with sound cards and
    other multimedia hardware.


    When Corel Linux doesn''t have a driver for your particular piece of hardware,
    it substitutes a generic version that lets you utilize most, if not all, of its
    capabilities.


    Many hardware devices come with utilities that run under Windows, but no utilities
    that run under Linux. Windows-only examples might include a scanner that comes
    with page managing and copying software and a CD-RW drive that arrives with programs
    to back up data and burn audio CDs. As with hardware drivers, Corel Linux or third-party
    equivalents might be available that are just as good, or finding them might take
    a bit of looking. For example, Corel Linux Deluxe comes with the versatile BRU
    backup program for performing tape backups.


    # Getting hardware help


    If you experience a Linux hardware predicament, take solace in the fact that thousands
    of open source programmers are resolving these issues with astonishing speed.
    Linux is the “Little Kernel That Could”!


    Meanwhile, Corel has compiled a huge list of compatible and incompatible hardware.
    You can find the list at


    ```

    http://linux.corel.com/products/.linux_os/hardware.htm

    ```


    If you''re having hardware troubles, don''t despair. Take a look at all the support
    options described in Chapter 20, especially the support newsgroups. It''s easy
    to find other users having the same problems, and experts who are more than happy
    to help!


    # Don''t engage in unprotected installs


    If you already have stuff on your computer, when was the last time you backed
    it up? Well, do it now! When you move a new operating system into your computer,
    you''re doing some heavy-duty lifting and arranging of existing'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'software furniture. Corel’s Install Express is well tested and easy to use,
    but no matter how sure-fire the software and how careful you are, something can
    always go wrong. Believe me, I’ve learned the hard way!


    # Can I remove Corel Linux after it''s installed?


    Remember, installing an operating system such as Corel Linux is a final act, more
    so than adding a software application such as WordPerfect. Normally, the only
    ways to remove an operating system are to reformat your hard drive, or use partitioning
    software such as Partition Magic to surgically remove the Linux partitions, without
    affecting others. (If you select the option to install in DOS/Windows Partition,
    described later in this chapter, you delete the Corel Linux folders instead.)


    # What''s automatic and what ain''t?


    Until recently, installing Linux was way too complicated for the average user
    without a degree in computer engineering. Linux books devote literally hundreds
    of pages to such delightful topics as partitioning drives, checking package dependencies,
    selecting the right X server for your video card, installing the Linux loader
    . . . the list goes on and on.


    Sure some folks enjoy the sport, just as others love to climb Mount Everest or
    compete in a triathon. The rest of us can think of other ways to spend a few months.


    # Automatic


    Corel Linux automatically detects your hard drive, CD-ROM, sound card, video,
    mouse, and other hardware as it installs and then sets up a Linux driver to operate
    each component. If a particular component doesn''t have a Linux driver, Corel
    Linux installs the most appropriate generic driver instead.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_49_0.png)


    Corel Linux detects standard, PCI-based cards only.


    When you add new hardware, Corel Linux recognizes it the next time you start the
    computer.


    # Not automatic


    Linux doesn''t support every piece of hardware, and some hardware that Linux does
    support might not be automatically detected by Corel Linux.'
  merge: -1
  img_proc: true
