- pgno: 89
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_89_0.png)


    # Trashing your dial-up options


    When you tried to connect, did you get an error that pppd died unexpectedly (what
    a phrase!) or timed out? If so, contact your ISP to ask what options need to be
    set in the /etc/ppp/options file. In many cases, an empty options file — or no
    file at all — does the trick. As root, rename the /etc/ppp/options file to options.old
    in case you need to return to the original. Then create a new /etc/ppp/options
    and leave it empty or don''t create a file at all!


    ![](img/82794ff9433a50ada079e99ce57c4c4f_89_1.png)


    Please, tell me you made it! If so, you''re ready for a cyberspace cruise in Chapter
    15.


    # Connecting and disconnecting


    After you have the dial-up working, connecting to your ISP is a no-brainer. Choose
    *Application* Starter \Applications \Applications Network \Dial-Up\ and then click
    Connect. Unless you changed the default setting, Dial-Up remembers your login
    ID and password from the previous session.


    The Connect button becomes Disconnect after you''re in. Simply click Disconnect
    when you want to end the session. The session also terminates if you log out of
    the desktop.


    # Hooking into a Local Network


    Dialing up from home to your ISP is one form of networking. Usually when we speak
    of a *network* though, we''re talking about a *local area network* (LAN).'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'found in corporate skyscrapers, your local health clinic, or even in a home
    office. A local network consists of


    +   - A *server* computer that runs the show

    +   - Terminals, computers, printers, and other devices


    All the devices (nodes) on a local network are physically linked together through
    *Ethernet* (network) cards and cables, so that they can communicate with one another
    and share files, programs, and other resources.


    Some LANs don''t even have a server. Smaller networks often use a peer-to-peer
    architecture of computing equals, rather than the client/server architecture of
    larger networks. This is your typical home network if, say, you network a Linux
    PC and a Windows PC.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_90_0.png)


    # Two types of local network hookups


    The Corel Linux Control Center has two types of local network hookups:


    +   - **TCP/IP**, which uses industry-standard means of transmitting local network
    and Internet data. UNIX/Linux machines usually run this type of network.

    +   - **Windows Workgroups**, which can share resources on a Windows-based network.


    Corel Linux works perfectly with either or both!


    # Getting hooked up


    “Whoa,” you say, “stop right here! I’m over something-teen years old. I can’t
    do this!” Wrong! As long as you have a supported network card, Corel Linux automatically
    detects it during installation and sets things up so it will work. All that’s
    left for you to do is hook up the cable and fill in a few blanks with identifying
    details.


    Take a clean notepad over to your network administrator (the drudge who keeps
    the data flowing), and have the administrator write down the information you need.
    Promise pizza, bonuses . . . whatever’s his or her weakness. If you’re the one
    who set up the network, you still deserve a reward!


    # *Hooking up to a TCP/IP network*


    To hook up to a TCP/IP network, here’s what you do:'
  merge: -1
  img_proc: true
- pgno: 91
  md: '1. Wedge the notepad with the administrator’s weird scribbles between your
    keyboard and the right side of your monitor.


    2. Log out, if necessary, and log in as root.


    3. Choose Application Starter Control Center and then double-click Network.


    4. Choose TCP/IP and then enter the hostname (the name of your computer) and the
    domain name (the name of the local network), as shown in Figure 4-17.


    This tells your computer who to connect to, and tells the network who you are,
    so you can get on the office joke list.


    5. Click the IP Address tab and then click to select the Enable ethernet option,
    as shown in Figure 4-18.


    The Ethernet interface selection is in case you have two cards. If so, select
    the card your cable is hooked up to.


    You can uncheck (disable) Ethernet to save on resources if you don’t plan on running
    on a network. You might also want to disable Ethernet to secure a machine, such
    as a point-of-sale terminal, so that information doesn’t get out to the network.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_91_0.png)'
  merge: -1
  img_proc: true
- pgno: 92
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_92_0.png)


    Figure 4-18: Enabling your Ethernet connection.


    +   6. Next, do one of the following to provide your computer''s network address:

    +   * Choose Use DHCP server if the network server assigns a different IP address
    to your computer each time you connect. (You won''t need to enter the IP address,
