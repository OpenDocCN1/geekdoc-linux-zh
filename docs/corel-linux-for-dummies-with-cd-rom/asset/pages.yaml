  md: '# # Installed Extras Not on your Menus


    When the Install Express sets up your system, it doesn''t put everything on your
    menus. The omissions on my system included the menu editor of all things! Kind
    of amusing — or frustrating — depending on your mental state. A classic Catch-22
    that''s solved in Chapter 9.


    Of course, if everything were on the menus, we''d be overwhelmed by choices when
    we start using Corel Linux. For example, why put five or six command-line text
    editors on the menus when we already have the fabulous, graphical, kwrtie editor
    on the panel? Still, some biggies didn''t make it on my install, including korganizer,
    the KDE calendrar and appointment utility, and, the e-mail client.


    Although you wouldn''t want everything on your menus, it''s hard to discover the
    things that aren''t. That''s why I give you Table 6-4, showing some of the end-user
    extras that aren''t on your menus after a default install. (It doesn''t include
    system and programming tools.) Your results may vary depending on your edition,
    install choices, and perhaps the date of your Corel Linux release.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_120_0.png)


