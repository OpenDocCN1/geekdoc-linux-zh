    +   5. Repeat Step 4 for any other action keys you want to add or change.

    +   6. To save your custom assignments, click the Save changes button.

    +   7. To use your new scheme now, click Apply.


    # Switching keyboard schemes


    When you have multiple keyboard schemes, either for the global or standard keys,
    you may switch among them:'
