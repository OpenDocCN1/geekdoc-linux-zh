- pgno: 140
  md: '# # Chapter 8

    ## Window Wonders


    **In This Chapter**

    ➤ Diving for windows

    ➤ Cleaning up your desktop


    The great thing about the Corel Linux desktop is that you can do dozens of tasks
    at the same time — word processing here, a Reversi game there, with maybe a little
    dial-up, Netscape, file find, help, Control Center, and Corel Update thrown in.
    Before you know it, you have windows all over the place, and the one you really
    want — Reversi — has disappeared from view.


    Window Washers to the rescue! This chapter lets you in on tricks for taking control
    of this visual clutter of buttons, bars, and other graphical gimmacks.


    You have two categories of solutions:


    +   - Go diving for the window you want

    +   - Clean up the place a bit


    Before you try out the tricks in this chapter, go about your normal business to
    make an unsightly mess of your desktop. That’s not a hard assignment, is it?


    Now that you’ve made a mess, you can try the various window diving and cleanup
    techniques.


    # ### Window Diving


    If you’re like me, you usually open applications all over the place, without any
    thought as to their sensible arrangement. This isn’t really as bad as it sounds
    because you can perform several diving tricks to come up with the window you want.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Moving a window to the top of the pile


    Sometimes all you see on your desktop is a collage of overlapping windows. Your
    active window is in full view, but the poker game you want is at the bottom of
    the pile, with a bit of its title bar protruding, as shown in Figure 8-1. That
    little bit is yelling “I’m here, click me!” Click the title bar. Whoosh! The poker
    game flies into view, ready for action.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_141_0.png)


    You can have your mouse automatically bring a window to the fore and make it active,
    just by pointing. To change this and other window settings, see Chapter 9.


    # Pushing the panel button


    Is the little window you want completely obscured by other window-hogging apps?
    No need to push the panic button. Push the *panel button* instead, as shown in
    Figure 8-1. I can’t believe they pay me to write jokes like this.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_141_1.png)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_141_2.png)


    > Figure 8-1: Click a piece of the window and it whooshes into view.


    Or click the panel button.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# Keyboard to the rescue


    Did you forget that you can do more than type with your keyboard? Well, let''s
    put that neglected utensil back into action. When you lose sight of the window
    you need, try this keyboard-to-the-rescue trick:


    +   1. Hold down the Alt key and press Tab till you find the window you want,
    as shown in Figure 8-2.

    +   2. Let go and up pops your window!


    ![](img/82794ff9433a50ada079e99ce57c4c4f_142_0.png)


    Wait, here''s another:


    +   1. Press Ctrl+Esc to display a list of all the windows on all your desktops.

    +   2. Scroll the list with the arrow keys. When you come to the window you want,
    press Enter to switch desktops and pop up the window.


    Or, if you must use your mouse, double-click a window in the list.


    # Cleaning Up the Place


    Cleaning your desktop is about as exciting as cleaning your abode, but it does
    make it easier to work. So grab your virtual broom and dustpan and follow me as
    we toss windows out, move them around, whisk them under the rug, or sweep them
    into neat piles. We can shrink and enlarge them too, but not to fit in the metaphor.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Close the window!


    Close that window! (Only don’t do it now.) When I’m finished with an application,
    I try to remember to get rid of it, so that it doesn’t get in the way of what
    I want to do next. As with junk mail, don’t let it hang around to distract you.


    Okay, closing a window to clean up is pretty obvious — but sometimes the obvious
    is easy to forget.


    # Moving windows around


    Another way to arrange your desktop is to grab your windows by their title bars
    and move them around, as shown in Figure 8-3.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_143_0.png)


    Notice how a window snaps to the desktop border, though you can move it beyond
    the border too. Windows also snap to the edges of other windows.


    To move the current window using the keyboard, press A+F7, position the window
    by using the arrow keys, and then press Enter.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_143_1.png)'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# Roll up the window


    Think, for a moment, of an app window not as a window but as a window-shade. Want
    to roll up the window? Double-click its bar, as shown in Figure 8-4. This keeps
    your window where it is, but gets it out of the way of other windows. Double-click
    the title bar again to unroll the window.


    # Iconify, iconify!


    ![](img/82794ff9433a50ada079e99ce57c4c4f_144_0.png)


    Iconify, iconify! I like that word, so I wrote it twice. Shading is fun, but the
    best way to make a window disappear is to click its iconify button, as shown in
    Figure 8-5. This removes the window from view, but leaves its task button behind
    on the panel. When you click the task button on the panel, the window pops right
    back to its previous location, ready for action.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_144_1.png)


    To iconify the current window, you can also click its task button on the panel
    or press Alt+F9.


    Rolled-up window


    ![](img/82794ff9433a50ada079e99ce57c4c4f_144_2.png)


    **Figure 8-4:** Double-click the title bar to roll (or unroll) a window.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# 116 Part II: Taking the Grand Tour


    ![](img/82794ff9433a50ada079e99ce57c4c4f_145_0.png)


    # Making the window BIGGER (Or smaller)


    Is the size of your current window cramping your style? Then make it bigger. Or
    if the current window is in the way of other windows, make it smaller. Doing either
    is really simple:


    +   Position the mouse pointer over the window border you want to move. Or for
    two-dimensional enlarging or shrinking, point to a corner, as shown in Figure
    8-6.

    +   Notice how your pointer switches to border-grabbing mode.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_145_1.png)


    Pointer in border-grabbing mode'
  merge: -1
