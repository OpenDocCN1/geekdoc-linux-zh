- pgno: 74
  md: '# Chapter 4

    # Post-Install Tweaking


    +   **In This Chapter**

    +   - Checking out the settings in the Control Center

    +   - Using other languages

    +   - Changing keyboard and mouse configurations

    +   - Changing the date and time

    +   - Setting up printers

    +   - Hooking up to the Internet or a local network

    +   - Adding new users

    +   - Finding out about boot defaults

    +   - Installing Acrobat Reader and Netscape Communicator too


    A fter you’ve installed Corel Linux and romped around in its dazzling desktop,
    your next reaction might be “Hey, this is great so far, but how do I hook up my
    printer and connect to the Internet? The time is wrong, how do I change that?
    How do I set up accounts for the kids?”


    Well, well, well, well, well, you came to the right place. Here, I take care of
    post-install tweaking and a few questions besides.


    # Welcome to Mission Control


    So where do you go to tweak? Most settings are conveniently gathered under the
    big tent of the Corel Linux Control Center, similar to the Windows Control Panel.
    The one exception in this chapter is the dial-up Internet connection, made through
    the Dial-Up utility on the Network submenu.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_75_0.png)


    Without further ado, click Application Starter (shown in the margin) and then
    choose Control Center from the main menu. Simply click the plus sign (+) to view
    the details for the various groups of settings described in Table 4-1. You can
    also double-click the headings.


    # **Table 4-1 Control Center Settings**


    | Setting | Lets You . . . | See |

    |---|---|---|

    | Desktop | Customize desktop aesthetics to your heart''s delight, including eye-popping
    themes that will be the envy of your Windows brethren—plus, choose from 34 interface
    languages | Chapters 9 and 10 |

    | Input Devices | Select international keyboards and set options for your keyboard
    and mouse | Chapter 4 |

    | Keys | Customize your keyboard shortcuts | Chapter 9 |

    | Network | Hook up your computer to a network | Chapter 4 |

    | Sound | Enable system sounds and assign sounds to particular operations, such
    as maximizing a window | Chapter 10 |

    | Windows | Customize window controls, placement, focus, and other properties
    | Chapter 9 |

    | Password | Change your password | Chapter 4 |

    | Date & Time | Set the date, time, and time zone | Chapter 4 |

    | Printers | Add, remove, and customize printers | Chapter 4 |


    ![](img/82794ff9433a50ada079e99ce57c4c4f_75_1.png)


    As you explore the Control Center settings, click OK or Cancel to exit one group
    before going on to the next. Otherwise, the group will reappear after you close
    the next group. Very confusing.


    # ## Using Other Languages in Corel Linux


    Corel Linux lets you change the entire interface to whichever language you like!
    You can choose anything from Breton to Turkish, with Chinese, Dutch, German, French,
    Japanese, Korean, Russian, Spanish, and 24 other languages in-between. I''m talking
    about the menus, dialog boxes, online help—the works.


    Hard to believe? Yeah, afraid so. Only a few KDE applications in the initial Corel
    Linux are in more than one language, and all help leads to the Corel'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'Linux help, initially only in English. (And to think that KDE started in Germany.)
    But, as with everything else in the Linux world, this too is changing quickly,
    and you can expect the language support to proliferate as Linux spreads throughout
    the world. So try the settings now, if only to see what you have to look forward
    to.


    # # Changing your preferred language


    To change the preferred language for your menus, dialog boxes, and online help:


    +   1.  Choose **Application Starter**  Control Center (KDE Kontrollzentrum),
    double-click **Desktop**, and then choose **Language** (Sprache).

    +   2.  Select your **first language** and then select your **second** and **third
    backup languages** in order of preference, as shown in Figure 4-1.

    +   3.  Click **OK** to change the language for any applications you now open.


    If the first language is not available, Corel Linux tries your second and third
    choices. If none of your preferred languages is available, Corel Linux uses the
    default, which is Esperanto. Just kidding, the default language is English.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_76_0.png)'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# Using international keyboards


    To go along with your multilingual menus and dialogs, you can use international
    keyboard maps to type in languages with non-English characters:


    +   1. Choose Application Starter $\Rightarrow$ Control Center, double-click Input
    Devices, and then choose International Keyboard, as shown in Figure 4-2.


    +   2. For each keyboard you want, click Add and select the keyboard from the
    drop-down list.


    +   3. You can select a keyboard in the listing and then click the Up or Down
    button to change its position in the keyboard picking order.


    +   4. Click the StartUp tab and then choose


    +   *   **Autostart** to have your first international keyboard load when you
    log into the desktop


    +   *   **Docked** to place the keyboard selection button in the docking station
    (see Chapter 5) to the right of the panel instead of in one of the desktop corners


    ![](img/82794ff9433a50ada079e99ce57c4c4f_77_0.png)


    **Figure 4-2:** Setting up international keyboards so you can type non-English
    characters.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '+   5. If you want to change the colors or font for the keyboard selection
    button, click the Style tab.


    +   6. Click OK to use the new list of keyboards.


    The next time you log in (if you selected Autostart and Docked), you can click
    the keyboard selection button on the desktop or panel to switch keyboard language
    maps.


    # # Configuring Your Keyboard and Mouse


    In addition to your international keyboards, Input Device settings give you a
    few keyboard and mouse options:


    +   1. Choose Application Starter \rightarrow Control Center and then double-click
    Input Devices.


    +   2. Choose Keyboard to turn keyboard repeat onnnnnnnnnn or off, as shown in
    Figure 4-3. Slide the volume up if you want to hear annoying clicks as you type.
    Click OK.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_78_0.png)'
  merge: -1
  img_proc: true
- pgno: 79
  md: '3. Choose Mouse to adjust the following:


    +   * Acceleration, how fast the mouse goes

    +   * Threshold, how quickly the mouse responds when you move it

    +   * Button mapping (for right-handed or left-handed (left and right button actions
    reversed))


    4. Click OK to use the new mouse settings.


    In Chapter 9, you can find a bunch of mouse settings related to window activities.


    # # Setting the Date and Time


    Isn’t it great to be on vacation and not even worry about the date or time? Wake
    up, you’re at your computer, and it’s time to synchronize! You wouldn’t want to
    stamp the wrong date on your files or the wrong time on your e-mail messages,
    would you?


    To prevent such temporal discord:


    +   1.  Choose **Application Starter Control Center Date & Time**, as shown in
    Figure 4-4.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_79_0.png)


    Figure 4-4:

    Setting the

    date and

    time.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '+   2. Select the month from the list, click the day, and then type the year.
    Or click the +/- buttons to adjust it.

    +   Click Today to restore the current settings.


    +   3. Click the hour, minute, and second boxes and type the correct time. Or
    click the +/- buttons to adjust it.

    +   It''s a 24-hour clock, so 10 P.M. is 22 hours. Click Now to restore the current
    time.


    +   4. To keep in sync with the rest of the world, click the Time Zone tab and
    select your time zone from the list.


    +   5. Click OK to make your changes.


    # # Setting Up Printers


    So, you wanna print stuff, too? You have to set up your printer first. Not to
    worry, getting your printer to work in Corel Linux is easy. How your printer works,
    however, is not always so easy because not every printer has a custom-tailored
    driver for Linux; you might have to use a close substitute instead.


    To set up one or more printers:


    +   1. **Choose Application Starter Control Center Printers**, as shown in Figure
    4-5. If you''re not logged in as root, supply the root password when asked.


    +   2. Click **Add** and choose either


    +   - **Locally on my Computer** for a printer hooked up to your machine. You
    are asked to give the printer a nickname and choose the port it uses (if in doubt,
    use lp0), as shown in Figure 4-6.


    +   - **Remotely on the Network** to access a printer connected to the network.
    You are asked to give the printer a nickname, specify the hostname of the server
    that controls the printer, and choose whether it''s a Windows or UNIX/Linux network.
    (For a Windows network printer, you are asked to supply your network name and
    password.)


    To install a network printer, you must to set up your network first.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_80_0.png)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_80_1.png)'
  merge: -1
  img_proc: true
