    standard keys:


    +   1.  Choose **Application Starter** **⊕** **Control Center**.

    +   2.  Double-click **Keys** and choose either the **Global Keys** or **Standard
    Keys**, as shown in Figure 9-16.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_167_0.png)


    # **Figure 9-16:**

    You may customize the global or standard keys.


    The **Current scheme** is the same as the KDE default at this stage because there
    is no other keyboard and no changes have been made.


    +   3.  Click the **Add** button, give your custom keyboard a name, and then click
    **OK**, as shown in Figure 9-17.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_167_1.png)


    # **Figure 9-17:**

    Naming a '' custom

    keyboard.'
  merge: -1
  img_proc: true
