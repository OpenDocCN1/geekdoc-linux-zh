- pgno: 30
  md: "# # Introduction\n\nWelcome to *Corel Linux For Dummies!* I hope it's half\
    \ as much fun to read as it was to write! It's not every day that a *_For Dummies_\
    \ book falls into an author's lap, and to do a...*_For Dummies_ book on Corel\
    \ Linux, well, that's just the cinnamon and sugar on the donut. Yup, this is history\
    \ in the making, my friend. Let's have a moment of silence to bear witness to\
    \ this awesome event.\n\n# ## About This Book\n\nHave no fear, dear reader — this\
    \ is a Linux book for you and me. **Corel Linux For Dummies** is not a mind-numbing,\
    \ post-graduate course in disguise, with all those weird hieroglyphics that only\
    \ a computer geek can love. Corel Linux is easy to use, and this book makes it\
    \ even easier.\n\nNote to nerds: Don't despair, the command line's still there,\
    \ and Corel Linux is pure Debian — the most powerful Linux yet!\n\nI figured IDG\
    \ Books would charge at least 50 bucks for ***Corel Linux For Dummies***, but\
    \ they said, \"No, $24.99 is our price point — we make it up on volume.\" What\
    \ a steal! Look what you get:\n\n+   ☑ A special ***Corel Linux For Dummies***\
    \ CD that includes the download edition of Corel Linux, plus the full Netscape\
    \ Communicator suite, Adobe Acrobat Reader, and a hand-picked selection of spectacular\
    \ desktop themes.  \n+   ☑ Clear, concise descriptions and step-by-step instructions.\
    \ Lots of helpful pictures too.\n\n# ## Conventions Used in This Book\n\nI follow\
    \ standard shorthand when asking you to do something. Here's all you need to know:\n\
    \n+   ☑ ***Key*1***-*Key*2* (such as Ctrl-V) means that you press and hold the\
    \ first key, press the second key, and then release both keys.  \n+   ☑ ***Command*\
    \ 1***:***Command* 2* and so on (for example, ***Tools***:***QuickCorrect***:***SmartQuotes***)\
    \ means to click the items in succession."
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Text you type is in **bold**.


    New terms appear in *italic*.


    ```

    mount -t msdos /dev/fdo /mnt/floppy

    ```


    You need a mouse or other pointing device to get around a graphical desktop. The
    standard mouse actions are


    +   Action

    +   - **Point**: Move the mouse to place the pointer on a screen item.

    +   - **Click**: Press and release the left mouse button once.

    +   - **Double-click**: Quickly press and release the left mouse button twice.

    +   - **Right-click**: Press and release the right mouse button. In many cases,
    a shortcut menu of context-sensitive choices appears.

    +   - **Drag**: Point to what you want to drag, press and hold the left mouse
    button, move the mouse, and then release the button. You can also drag across
    text to select it.


    A *click* becomes a *tap* if you''re using a pen device; *left* becomes *right*,
    and vice versa, if you''re using the left-handed mouse setup.


    # What You''re Not to Read


    Because Corel Linux is so easy to set up and use, you don''t need a machete to
    slash through a jungle of instructions on your way to the fun stuff. And after
    you''re set up, this book is strictly nonsequential. Where your busy brain hops,
    the page can flop.


    # Foolish Assumptions


    Authors have a lot of artistic freedom when writing a _For Dummies_ book, but
    this section is mandatory, as in “you must make some foolish assumptions.” Makes
    me think of those tired technical support tall tales that endlessly circulate
    the Internet, such as


    +   - The woman who thinks the mouse is a foot pedal (gender for illustration
    purposes only)

    +   - The man who tries to fax a letter by holding it up to the monitor.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'The man or woman who calls to say that his or her computer isn''t responding,
    and when asked to read the serial number says, "Wait a minute while I get a flashlight,
    the power is out."


    I will assume that you are none of the above, but that you do have one or both
    of the following purposes in mind:


    +   You want a clear, friendly guide to Corel Linux.

    +   You want to install Corel Linux on your computer, using the CD that''s in
    the back of the book.


    In either or both cases, you''ve come to the right place!


    # ## How This Book Is Organized


    Half the battle of writing a computer book is getting it organized. The great
    thing about Corel Linux is that it doesn''t take three-quarters of the book to
    install the darned thing. In this section, you get a bird''s-eye view of Corel
    Linux For Dummies.


    # ### Part I: Leaping to Linux


    After an inspiring sales pitch for Corel Linux, you''ll be fired up and raring
    to go! In Part I, you check out your hardware, back up any existing data, and
    then break the sacred seal at the back of the book. You stick the CD in your computer,
    and the rest is easy, thanks to Corel''s super-cool Install Express (and this
    super-cool book). After a quick look around, you can set up the rest of your stuff,
    such as your printer and your Internet connection or network access. (Even if
    someone already installed Corel Linux for you, this part is a painless and interesting
    read.)


    # ### Part II: Taking the Grand Tour


    Corel Linux is sure to be as exciting as your first kiss, bungee jumping, hang-gliding,
    or maybe the first rainbow you saw as a child. Even if you''re a veteran Linux
    user, you''ll be thrilled by what you see as you start up Corel Linux and explore
    the desktop. After the grand tour in Part II, you can wow your Windows friends
    with some tricks they won''t believe!'
