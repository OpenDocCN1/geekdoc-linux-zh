    # Toolbox tricks


    Try these tricks with various tools:


    +   - ✓ Hold the Ctrl key, or the Shift key, or both while using a tool.

    +   - ✓ Double-click a tool to choose various options, such as the Transform tool’s
    rotate, scale, shear, or distort option.'
