    \ one in the upper-right) to plaster your window all over the desktop.\n\nNotice\
    \ that when you blow up a window to the max, the maximize button becomes restore.\
    \ Click the restore button to deflate the window back to its original size.\n\n\
    Keyboard alternative: Press Alt+F10 to alternately maximize and restore the current\
    \ window.\n\n# Arranging and uncluttering windows\n\nAs you open windows, notice\
    \ how your desktop normally follows a “smart placement” policy of putting the\
    \ window in the largest vacant desktop space. Try this: Close all your open windows\
    \ and then open the Text Editor. Notice how it’s placed in the upper-left of your\
    \ screen. Now close the Text Editor and then open the Console and Help. Open the\
    \ Text Editor again, and you see how it does the best it can to find a new location,\
    \ away from the other windows.\n\nSmart placement is a big help. But when things\
    \ get really messy, you can try the arrange and unclutter options:\n\n+   1. Go\
    \ to a blank spot on your desktop (if you can find one!) and right-click.\n+ \
    \  2. Choose either of the following:\n\n+   • Arrange Windows, to place your\
    \ windows in a (relatively) neat pile, as shown in Figure 8-7, where you can click\
    \ the one you want.\n+   • Unclutter Windows, to restore a semblance of smart\
    \ placement after you’ve moved windows around, as shown in Figure 8-8."
  merge: -1
