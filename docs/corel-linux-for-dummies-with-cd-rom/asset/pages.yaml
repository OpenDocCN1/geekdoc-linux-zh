- pgno: 136
  md: '# # Working with Selected Stuff


    The remainder of this chapter deals with some basic tricks of the trade in a graphical
    environment such as Corel Linux or Windows. You take a look at how you can select
    text and graphics and then cut, copy, and paste stuff all over the place. I use
    WordPerfect 8 for illustration, but the same principals apply in other applications.


    # ## Selecting text and graphics


    One of the most powerful and flexible features of a program such as WordPerfect
    is its capability to perform operations on selected (blocked) text and graphics.
    You can move, copy, or delete highlighted information or change the format of
    your text. You can even save your block as a file.


    You may use many selection tricks, but here are two basic techniques:


    > ✔ **Using the mouse**, simply drag across the text and graphics you want to
    select, as shown in Figure 7-9, and then release the mouse button.


    > ✔ **Using the keyboard**, place the insertion point where you want to start
    selecting and then press F8 or hold the Shift key (in WordPerfect) and use the
    arrow keys to extend your selection.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_136_0.png)'
  merge: -1
  img_proc: true
- pgno: 137
  md: "![](img/82794ff9433a50ada079e99ce57c4c4f_137_0.png)\n\nTIP\n\nAgain, you may\
    \ select things in many ways, depending on the program you're using, but mouse\
    \ dragging is almost universal.\n\nTry **Edit** **Select All** to select everything\
    \ in the window.\n\n# ## Moving and copying selections\n\nAfter you select stuff,\
    \ you can do many things with it. After you select text in WordPerfect, for example,\
    \ you can change its format, font, and other properties.\n\nBest of all, you can\
    \ move your selected text around to rearrange your ideas or copy it to avoid retyping\
    \ it. Essentially, you have two ways to move and copy:\n\n+   - By **cutting or\
    \ copying** the selected information (text or graphics) to the clipboard and then\
    \ **pasting** it to the new location\n+   - By **dragging** the information with\
    \ the mouse and dropping it into place\n\n# ### Drag and drop with the mouse\n\
    \nFor nearby moving or copying of text, try using the mouse to drag and drop:\n\
    \n+   1. Drag to make your selection and then release the left mouse button.\n\
    +   2. Put the mouse pointer on the selected text and then drag it to the new\
    \ location.\n+   3. Do one of the following:\n+   \t• To move the information,\
    \ release the mouse button.\n+   \t• To copy the information while leaving the\
    \ original intact, hold down the **Ctrl** key while you release the mouse button.\
    \ (The mouse pointer usually looks different when you press **Ctrl**.)\n\n![](img/82794ff9433a50ada079e99ce57c4c4f_137_1.png)\n\
    \nTIP\n\nDrag and drop is okay for short-haul moving of small selections. For\
    \ long-distance moving and copying, use cut, copy, and paste.\n\n# ### Move and\
    \ copy with the clipboard\n\nAlthough you can't drag and drop in every program,\
    \ you can nearly always move and copy your selections with a clipboard. A *clipboard*\
    \ is a holding area (or buffer) to which you can cut and copy information and\
    \ then paste it to another location in the current file, in another file, or even\
    \ in another file in another application."
  merge: -1
  img_proc: true
- pgno: 138
  md: "To move or copy using the clipboard:\n\n+   1. **Select the information.**\n\
    +   2. **Place the selection on the clipboard in either of two ways:**\n+   \n\
    +   \t* To move the information, click the Cut (scissors) button on the toolbar.\
    \ (You can also press Ctrl+X or click Edit **Cut**.) The selection disappears\
    \ from the document and is transferred to the clipboard.\n+   \n+   \t* To copy\
    \ the information, click the Copy button on the toolbar. (You can also press Ctrl+C\
    \ or click Edit **Copy**.) The selection remains in its place in the document,\
    \ and a copy of the selection is placed in the clipboard.\n+   3. **Move the insertion\
    \ point to where you want to put the information.**\n+   4. **Click the Paste\
    \ button on the toolbar.**\n+   \tYou can also press Ctrl+V or click Edit **Paste**.\n\
    +   \tYou can paste the clipboard multiple times.\n\n# ## Deleting Information\n\
    and Getting It Back\n\nDeleting zaps your stuff for good, *without* placing it\
    \ on the clipboard. Use the Delete or Backspace key to delete one character at\
    \ a time. The same Delete and Backspace keys can also delete a whole selection.\n\
    \n> > “Egad, I didn’t mean to delete (move, copy) that! How do I put my stuff\
    \ back the way it was?” If you just performed the regretted action, you’re in\
    \ luck (in most text editors or drawing programs):\n\n+   1. **Click the Undo\
    \ button to reverse your last editing action.**\n+   \tYou can also click Edit\
    \ **Undo** or press Ctrl+Z.\n+   2. **Repeat Undo to backtrack your editing session,\
    \ one action at a time, for as many Undos as your program permits.**\n\nTo undo\
    \ the Undos, click the Redo button on the toolbar. (You can also click Edit **Redo**.)\
    \ When there are no more Redos, the Redo arrow on the toolbar appears dim.\n\n\
    Undo and Redo work with any editing change. For example, if you just changed your\
    \ font or margins, Undo can put them back to the way they were."
  merge: -1
