- pgno: 262
  md: '# # Printing a PostScript file


    To print the current file:


    +   1. Click the Print button.


    The options shown in Figure 14-11 appear.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_262_0.png)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_262_1.png)


    # ## Figure 14-10: Flagging a page for later printing or viewing.


    # ## Figure 14-11: Selecting your print options.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '2. Specify any of the following options:


    • Print to file to send your print selection to another PostScript file for printing
    later.


    • Print All the pages, the Current page, only Marked pages, or the Range of pages
    you specify.


    • Print the document in reverse order.


    3. Click OK to print your file or selection.


    > Your printer has to be set up to print, as explained in Chapter 4.


    # Viewing and printing a PDF file


    PS Viewer can view and print some Adobe PDF files, but the best tool for the job
    is, naturally enough, the free Adobe Acrobat Reader shown in Figure 14-12.


    Adobe Acrobat Reader is not on the download version of Corel Linux, but it is
    on your Corel Linux For Dummies CD. See Appendix C for installation instructions.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_263_0.png)'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# ## Using Adobe Acrobat Reader


    You can launch Adobe Acrobat in either of these ways:


    +   - Click Application Starter &#8644; Applications &#8644; Acrobat Reader

    +   - Double-click a PDF file in File Manager


    Any special PDF formatting appears in the reader. If you choose Help &#8645; Reader
    Guide, you''ll find a handy guide to all Acrobat features, including the capability
    to cut and paste selections to other applications.


    # ## All That Jazz


    After all this graphical intensity, I think it''s time for a little music — assuming,
    of course, that your sound system is up and running, as described in Chapter 4.


    # ## The Internet connection


    Wouldn''t it be great to know what you''re listening to? Well, just log onto the
    Internet and the CD Player automatically gets the information for you! It uses
    your CD''s identification code to access the gigantic CD database (CDDb) of hundreds
    of thousands of album titles and several million tracks. The player then automatically
    displays the album, artist, and track names as your CD plays.


    After you have the artist''s name, you can then get tour and background information
    from various sources.


    What if your CD isn''t in the database? You can write up the information yourself
    and add it to your local collection. If you''re in a generous spirit, upload your
    information to the Internet CDDb for others to share!


    # ## Playing a CD


    So why not grab a CD and give it a whirl:


    +   1. Log onto the Internet, if you want to grab information as you play the
    CD.

    +   2. Slide the digital donut into your CD drive.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '+   3. Choose **Application** Starter \* Applications \* Multimedia \* CD Player.


    +   4. If you''re **prompted** to enter your local CDDB base folder, click **OK**.

    +   Normally, this should default to /usr/X11R6/apps/kscd/cddb/

    +   If your folder exists, you shouldn''t be prompted. If necessary, create the
    folder yourself, as root, in File Manager, and add any of the following subfolders:
    rock, classical, jazz, soundtrack, newage, blues, folk, country, reggae, misc,
    and data.


    +   5. If no exact match is found in the online database, select from a list of
    one or more entries, as shown in Figure 14-13.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_265_0.png)


    **Figure 14-13:**

    Selecting the title of your CD.


    If the play list doesn''t appear, click the **Configure** button and make sure
    **Enable Remote CDDB** has a check mark.


    +   6. Click any of the following controls to control the CD play:


    +   * **Play/Pause** alternately plays and pauses the CD.

    +   * **Stop** stops play.

    +   * **Eject** ejects the CD (not supported on some older CD drives).

    +   * **Backwards** moves 30 seconds back in the current track.

    +   * **Forward** moves 30 seconds forward in the current track.

    +   * **Previous** goes back to the previous track.

    +   * **Next** advances to the next track.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '**Shuffle** plays the tracks in random order.


    **Loop** plays the CD from beginning to end continuously.


    +   7. Drag the slider to adjust the volume of play, as shown in Figure 14-14.

    +   8. Click the Quit button to exit the CD player.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_266_0.png)


    # ## Using Sound Mixer


    The volume and balance of your CD Player is also affected by the Sound Mixer''s
    settings. Choose **Application Starter** -> **Applications** -> **Multimedia**
    -> **Sound Mixer Panel** to adjust these settings, as shown in Figure 14-15.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_266_1.png)


    # ## Selecting a particular track


    To choose a particular track, click the listing and then select the track, as
    shown in Figure 14-16.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_267_0.png)


    # Changing the time display


    Click the Time Display button to toggle the time display between the elapsed time
    on the current track (the default), the track time remaining, the total elapsed
    time, and the total remaining time.


    # Getting the sordid details about your favorite recording artist


    After you''re connected to the Internet and the artist''s name appears in CD Player,
    click the Information button. Choose from the following, which are shown also
    in Figure 14-17:


    +   Performance, to find out about tour dates.


    +   Purchases, to buy CDs by the artist, though you have only two sites to choose
    from.


    +   Information, to tell various search engines to get the biography, photos,
    and other information on the artist, as shown in Figure 14-18.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_267_1.png)'
  merge: -1
  img_proc: true
