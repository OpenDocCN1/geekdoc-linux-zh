- pgno: 298
  md: '# Putting in your two cents


    Ready to put in your two cents? To join a discussion:


    +   1.  Click the plus (+) box to the left of the **server name** in the folder
    listing to display the groups you’ve subscribed to.


    Newsgroup servers appear underneath your personal mail folders in the listing.


    +   2.  Select a group to download its message headings.


    +   3.  If the **number of headings** exceeds the specified limit, you’ll be asked
    whether you want to download them all, as seen in Figure 16-11.


    To change the message limit, choose Edit \ Preferences and then go to the Newsgroup
    Server setting under Mail & Newsgroups.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_298_0.png)


    +   4.  Click the thread you want to read, as seen in Figure 16-12.


    Any thread with unread messages appears in **bold**.


    Messages are normally arranged by threads, but you can click the buttons at the
    top of the listing to sort them by subject, sender, date, and so on. Click a button
    twice for a reverse sort.


    +   5.  Click the plus (+) box next to the thread to display all its messages,
    or click the minus (-) box to fold the thread back up.


    +   6.  Click the **Reply** button to make your lucid contribution to the discussion.


    Note that your message is addressed to the newsgroup and appears underneath the
    current message in the thread.


    To reply privately to another poster, right-click the message and choose Reply
    to Sender Only.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_299_0.png)


    Figure 16-12:

    Click the thread you want to read.


    # Starting a new thread


    Now that you have the hang of contributing to existing newsgroup threads, perhaps
    you’d like to start a new thread on a topic of your own. Easy enough— just click
    the New Msg button, type the heading and body of the message, and then send your
    posting to the newsgroup.


    # To quote or not to quote?


    Normally when you reply to a newsgroup posting, the previous message is quoted,
    which might have a quote from the message before that, and so on up the line.
    This means that even though you might be adding only a few words of wisdom, the
    reader of your post will have long quotes to wade through, probably for a second
    or third time.


    It’s a good idea to select and delete all the old stuff, if your response is perfectly
    clear without it. You can also selectively quote from the previous message, to
    make it clear to the next reader exactly what you’re responding to.'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'Chapter 16: You''ve Got Mail! 271


    # Marking threads as read


    When you''re finished viewing the current discussion group, you can click the
    as Read button and select All Read to mark all the threads as read. That way,
    you''ll feel like you aren''t falling hopelessly behind, and you can easily distinguish
    the new messages the next time you visit the group.


    To mark just a particular thread, click the as Read button and select Thread Read.
    You can select by Date to mark only older messages as read.


    # Searching for messages on a vital topic


    "I know I read a message on this. Where is it?" To search for messages by subject
    and content:


    +   1. Choose **Edit** **Search Messages**.

    +   2. Select the e-mail folder to search.

    +   3. Construct your query by **selecting search fields and conditions** and
    by **typing the contents** (see Figure 16-13).


    ![](img/82794ff9433a50ada079e99ce57c4c4f_300_0.png)


    +   4. Create more or fewer search criteria, then click **Search** and choose
    your message from the search results listing.


    If your search returns too many hits, click **More** to add another search criterion.
    For example, if a search on *Microsoft* returns 400 messages, click **More** and
    add *Linux* to your search. Just be sure to choose the Match all of the following
    option, not the Match any option!'
  merge: -1
  img_proc: true
