- pgno: 182
  md: '# # Chapter 10

    ## Decorating Your Desktop


    In This Chapter


    +   - Wallpapering or painting your backgrounds

    +   - Coloring your window

    +   - Fooling around with screen fonts

    +   - Rearranging your desktop icons

    +   - Styling yourself after other operating systems

    +   - Adopting a whole new theme

    +   - Sounding off

    +   - Resolving your resolution


    Do you suffer from the Desktop Dolldrums? Tired of looking at the same old interface?
    Then it’s time to add a little color to your computing life — and a little sound,
    a little style. Maybe a lot of color, a lot of sound, and a lot of style. In fact,
    why not go totally crazed with some Fantasy, SciFi, or Nature theme, as shown
    in Figure 10-1!


    Can’t promise the stuff in this chapter will make you 23 percent more productive
    or even 3 percent more productive, but you will have a good time.


    Okay, I’m going to risk sounding like a spoilsport or, yuck, a prude. A lot of
    careful design and testing went into the default desktop to create a pleasant
    and productive environment. A completely wacko desktop makeover can make you decidedly
    less productive. Still, you gotta try out the themes!'
  merge: -1
  img_proc: true
- pgno: 183
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_183_0.png)


    Figure 10-1:

    Pasteurized

    pixels.


    # Customizing Your Desktop Backgrounds


    Tired of staring at the same old wall? Then customize your desktop backgrounds
    to use one color, two colors, or maybe a zany wallpaper. Each desktop can provide
    a characteristic backdrop, such as a single color for Desktop 1, two colors for
    Desktop 2, and different wallpapers for Desktops 3 and 4. Not a bad idea, really,
    because the background will immediately alert you to which desktop you’re in.


    # Painting your backgrounds


    To use color backgrounds for your desktops:


    +   1. **Choose Application Starter ⇄ Control Center.**

    +   You can also click the display icon on the right of your panel for most desktop
    appearance settings.

    +   2. **Double-click Desktop and then choose Background.**

    +   The settings shown in Figure 10-2 appear.'
  merge: -1
  img_proc: true
