- pgno: 97
  md: "# # Changing Your Boot Defaults\n\n![](img/82794ff9433a50ada079e99ce57c4c4f_97_0.png)\n\
    \nLet's say you converted your Windows machine to a dual-boot Linux/Windows system.\
    \ You normally boot up and do all your work, Web browsing, and e-mail in Linux,\
    \ and only occasionally use Windows programs when there's no close substitute.\n\
    \nBut your spouse, well, just hasn't gotten around to changing from the old ways\
    \ and goes berserk when the machine boots up to Linux. \"I don't want this . .\
    \ . how do I get out of this screen?\" (How come kids never say that?) The best\
    \ way out of trouble, in this case, is to change your Corel Linux Loader (LILLO)\
    \ to boot to Windows by default.\n\n![](img/82794ff9433a50ada079e99ce57c4c4f_97_1.png)\n\
    \nThis is an advanced operation that involves messing with your *master boot record*.\
    \ If you screw up, your machine might not boot until you restore the boot record.\
    \ I'm assuming that you're a responsible child or maybe an adult. Otherwise, how\
    \ did you get root access?\n\nIf you have an inkling of what you're doing, here's\
    \ the trick:\n\n![](img/82794ff9433a50ada079e99ce57c4c4f_97_2.png)\n\n+   1. Log\
    \ in as root, click the Text Editor button on the panel, and open the `/etc/lilo.conf`\
    \ file.\n+   2. Among the list of boot selections, find the label for the multiline\
    \ section describing your Windows boot partition, as shown in Figure 4-24.\n+\
    \   \n+   The label is probably near the bottom of the OS pecking order. You'll\
    \ see the likes of label=dos or, in this example, label=MS_Windows.\n+   \n+ \
    \  3. On a line near the top of the file, above the list of boot selections, add\
    \ `default=dos` (or whatever the selection is labeled).\n+   \n+   In Figure 4-25,\
    \ I added the line Default = MS_Windows, to match the label of the Windows partition\
    \ shown in Figure 4-24. I also changed the boot-up delay from 300 to 100 (10 seconds).\
    \ For more on using the Text Editor, see Chapter 13.\n+   \n+   A trickier way\
    \ to make Windows the default is to move the section describing the Windows section\
    \ to the top of the pecking order.\n\n![](img/82794ff9433a50ada079e99ce57c4c4f_97_3.png)\n\
    \n+   4. Do you want to adjust the time your computer waits before going on if\
    \ you don't press a key? Change `delay=300` (30 seconds) to another value, as\
    \ I did in Figure 4-25.\n+   5. Click the Save button on the toolbar to save your\
    \ changes.\n\n![](img/82794ff9433a50ada079e99ce57c4c4f_97_4.png)"
  merge: -1
  img_proc: true
