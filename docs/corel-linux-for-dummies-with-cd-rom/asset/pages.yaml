- pgno: 274
  md: '# # Going from link to link


    Most Web pages contain clickable *links* to other pages or locations. A link might
    appear as a highlighted word, an image, a bar containing several selections, and
    other ways. When your mouse pointer is over a link, the pointer changes to a hand
    with a pointing finger.


    # ## Typing an Internet address


    You can type an Internet address, such as `http://www.corel.com`, directly in
    the Location toolbar and then press Enter to go to that location.


    You can omit parts of a standard Internet address. Navigator automatically assumes
    `http://` for the prefix, `http://www.` for the pathname, and `.com` for the suffix.
    Thus, you could simply type **Corel** to go to Corel’s Web site.


    # ## Selecting a recently typed address


    Click the address listing to select from the last ten addresses you typed, as
    shown in Figure 15-4.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_274_0.png)'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# # Going back and forth


    Click the Back button to retrace your steps during a browsing session. Click the
    Forward button to come back. Click and hold either the Back or Forward button
    to select from a menu of previous pages.


    > TIP

    > You can also right-click in the Web page and then choose Forward or Back from
    the menu that appears.


    Click the Home button to return to the home page at the start of your session.
    The home page is initially set to Corelicity.com, but you can change it to whatever
    you like. See “Configuring Navigator,” later in this chapter.


    Click the Netscape button to go to the Netscape home page.


    # # Stopping and reloading pages


    Sometimes when you’re loading a Web page, things don’t seem to connect. When this
    happens, you can click the Stop button and then try again or go to a more promising
    site.


    Many Web pages are constantly updated, especially news and financial ones. You
    can click Reload to ensure that you have the latest information.


    # # I Know It’s out There Somewhere!


    With such a vast amount of information out on the Web, the construction of search
    engines and their associated databases has become an industry in itself. You may
    choose from several brands, including (in alphabetical order) AltaVista, Excite,
    HotBot, Infoseek, Lycos, Magellan, and Yahoo! Some are better than others at delivering
    relevant hits from your query, allowing custom queries, and eliminating dead and
    duplicate links.


    To search for information on the Web:


    +   1. Click the **Search** button (or choose **Edit  Search Internet**) and then
    click the tab or link of the search engine you want.

    +   2. Follow the search engine’s instructions.


    Normally, you type a query and click a search button (see Figure 15-5).'
  merge: -1
  img_proc: true
- pgno: 276
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_276_0.png)


    +   3. Browse the search result listing and click any link that looks promising.


    > **TIP** If the link isn''t what you''re looking for, click the **Back** button
    to return to the search result listing and try another link.


    # # Searching the current page


    To locate text in the current page, choose **Edit** \ **Find in Page** (or press
    **Ctrl+F**), type the text, and click **Find Next**.


    # # Bookmarking your favorite places


    You can personalize your browser by displaying bookmarks to your favorite sites
    in the **Bookmarks** listing in the **Location** toolbar. You can also add your
    very favorite sites to the **Personal** toolbar.'
  merge: -1
  img_proc: true
- pgno: 277
  md: "# Use your Windows bookmarks in Linux!\n\nBookmarks are stored in a Web document,\
    \ called bookmarks.html, in your personal .netscape folder. Do you have a bunch\
    \ of Netscape bookmarks in Windows that you want to use in Linux? Create a backup\
    \ of your bookmarks file and then go to Windows and copy the bookmark.html file\
    \ (which is usually in C:\\Program Files\\Netscape\\Users/\\yourname) over to\
    \ Linux. Then rename the file you copied to bookmarks.html (Log in as root and\
    \ have hidden files showing.)\n\n# Adding a bookmark\n\nSuppose you've just landed\
    \ on the coolest Web page on termite colonies you've ever seen. You know you're\
    \ going to want to come back to it time and again to see how the termites are\
    \ progressing. You can either\n\n+   - Scribble the address down somewhere. Then\
    \ if you don't lose it, you can type it in again each time you want to visit the\
    \ site.\n+   \n+   - Create a bookmark. Drag the icon that appears to the left\
    \ of the Location box, as shown in Figure 15-6, to the position you want in the\
    \ Personal toolbar.\n\nNot much of a contest, is it?\n\n![](img/82794ff9433a50ada079e99ce57c4c4f_277_0.png)\n\
    \nFigure 15-6:\nDrag the bookmark icon to a place on your Personal toolbar."
  merge: -1
  img_proc: true
- pgno: 278
  md: 'You can also choose Bookmarks \u2194 Add Bookmark from the toolbar to add a
    bookmark to your primary bookmark folder (the one that appears when you click
    the Bookmarks button) or choose Bookmarks \u2194 File Bookmark to add a bookmark
    to a particular folder, as shown in Figure 15-7.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_278_0.png)


    Right-click in the Web page and then click Add Bookmark to add a bookmark to your
    primary bookmark folder.


    # ### Checking Out Corel''s Online Services


    Corel sees its future out on the Web. To get there, it has to bring you along.
    That''s why you''ll find a number of inducements on the Online Services menu.
    Choose **Application Starter** \u2194 **Online Services**, as shown in Figure
    15-8, and then choose any of the following:


    +   *   \u2713 **Business Community** to read articles and join discussions on
    business topics

    +       \u2713 **Clipart and Photos** to download clipart, photos, graphics, and
    animations

    +       \u2713 **Corel Printing Service** to create the T-shirt or coffee mug
    of your dreams'
  merge: -1
  img_proc: true
- pgno: 279
  md: '+   - Corel vDrive to create your own virtual hard drive, and then upload and
    download files to and from anywhere

    +   - Current Events to catch the latest news

    +   - Designer F/X to customize your graphics images

    +   - eFax Services to send and receive faxes by e-mail

    +   - Email to set up an online e-mail account and then send and receive messages
    from anywhere

    +   - Graphic Community to download free goodies and join up with the artistic
    set

    +   - JabberIM to hold text-based person-to-person conversations with other users

    +   - Linux Community for information, support, and discussions on Corel Linux
    and Corel''s Linux applications

    +   - New Online Services to look for additional goodies

    +   - Search the Internet to use the mother of all search engines to search for
    Web pages, people, or businesses

    +   - Text F/X to create graphical text objects using all sorts of special effects


    ![](img/82794ff9433a50ada079e99ce57c4c4f_279_0.png)'
  merge: -1
  img_proc: true
- pgno: 280
  md: "> **TIP** Use Corel vDrive, eFax Services, and E-mail as your office-on-the-road!\n\
    \n# Telling Your Browser Where to Start and How Much to Remember\n\nYou can tell\
    \ Netscape Navigator where to start when you launch it and how many days of history\
    \ to keep:\n\n+   1. Choose **Edit** \\( **Preferences** and then choose **Navigator**\
    \ in the tree listing, as shown in Figure 15-9.\n\n![](img/82794ff9433a50ada079e99ce57c4c4f_280_0.png)\n\
    \n+   2. Select whether you want Navigator to start with a blank page, the home\
    \ page (the default), or the last page you visited.\n\n+   3. Specify the home\
    \ page you want to go to when you launch Navigator or click the Home button:\n\
    +   \t- **Use Current Page**, to use the current page displayed in the browser.\n\
    +   \t- **Choose**, to select a Web document on your system.\n\n+   4. Specify\
    \ how many days of history to keep or click **Clear History** to clear the history\
    \ immediately."
  merge: -1
  img_proc: true
- pgno: 281
  md: 'The history keeps track of the links you’ve clicked (showing them in the visited
    color), and where you’ve been in the history listing. Clearing your history protects
    your privacy but makes it harder to retrace your steps.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_281_0.png)


    +   5. When you’ve finished making your selections, click OK.


    # ## Getting Your Advanced Navigator’s License


    To get your advanced Navigator license, choose Help : Help while browsing. The
    NetHelp facilities appear, with handy contents and an index to locate the information
    you need.


    When using the help contents, click a main heading to display its help topics
    and then click the topic you want, as shown in Figure 15-10.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_281_1.png)


    Figure 15-10: Click the headings and topics you want to see.


    # ## Taking File Manager for a Cyber-Ride


    ![](img/82794ff9433a50ada079e99ce57c4c4f_281_2.png)


    It’s great to be able to pop out to the Web from File Manager whenever you want,
    without having to launch Netscape. If you’re online, simply click the Web button
    on File Manager’s right to go straight to CorelCity, as shown in Figure 15-11.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_282_0.png)


    When browsing with File Manager, try any of these tricks:


    +   - Go to any Web page by entering its URL (Web address).

    +   - Click the Back and Forward arrows to retrace your browsing session.

    +   - Click the Address drop-down list to select any site you visited during the
    current browsing session.

    +   - Choose View: Tree to select from the tree the sites you visited.

    +   - Click the Stop button if the Web page doesn''t seem to be loading properly.

    +   - Click the Refresh button to make sure you''re viewing the latest information.


    The beauty of File Manager is that it seamlessly integrates the Web with your
    local and network files and folders.


    Do keep in mind that File Manager is just that— a file manager first and a Web
    browser second (for now). You won''t find bookmarks and other browser features,
    nor do you get e-mail, newsgroups, and chat integrated in the package.'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# Transferring Files from a Remote Site


    When you''re online, you can use File Manager to download files from a remote
    FTP site:


    +   In the Address box, type the address of the FTP site (such as ftp://ftp.corel.com).


    ![](img/82794ff9433a50ada079e99ce57c4c4f_283_0.png)


    Make sure to include the initial ftp:// when entering the address. Otherwise,
    if you type ftp.corel.com, File Manager will think it''s a Web site.


    +   Press Enter.


    +   Locate and select the files you want to transfer.


    +   Use copy and paste or drag and drop, as shown in Figure 15-12, to download
    the files to your local folder.


    +   If the FTP site prompts you for your ID and password, provide them.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_283_1.png)


    That''s it. Get up, stretch, and then go make a peanut butter and cauliflower
    sandwich as your files are being transferred.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# Chapter 16


    # You’ve Got Mail!


    # In This Chapter


    +   ▶ Finding out what Corel Linux offers for e-mail

    +   ▶ Setting up your mailbox

    +   ▶ Uncovering how your e-mail is sorted

    +   ▶ Getting your e-mail

    +   ▶ Customizing the Messenger display

    +   ▶ Setting up your address book

    +   ▶ Writing and mailing messages

    +   ▶ Participating in discussions


    E-mail is one of those inventions, like the telephone, radio, and TV, that’s fast
    becoming part of our daily lives and revolutionizing the way we communicate. For
    example, in putting this book together, my editors and I e-mailed chapters back
    and forth across continents as fast as you click a mouse. Separation of place
    and time vanished. Amazing!


    I don’t know about the telephone and radio, but if I had to choose between e-mail
    and television, the boob tube would be out the door in a minute.


    In this chapter, you look at two uses of e-mail:


    +   1. To send private messages to others

    +   2. To add your two cents to public newsgroups, or forums


    You’re in charge of your personal mail folders. Newsgroup messages are kept on
    a remote server and managed by someone else. Other than that, mail and newsgroup
    operations are pretty much the same.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# # E-Mail Facilities in Corel Linux


    Corel Linux comes with a couple of e-mail facilities:


    +   - The Messeneger component in Netscape Communicator

    +   - The Kmail utility from KDE


    The Messeneger facility, which is shown in Figure 16-1, is nicely integrated with
    the browser. Plus, it’s a more mature application than Kmail that handles newsgroups
    as well, so it’s one I use in this chapter. If you decide to use Kmail, the setup
    procedures and operations are similar.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_285_0.png)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_285_1.png)


    The download version of Corel Linux comes with only the Netscape browser. The
    entire Communicator suite, however, is available on your Corel Linux For Dummies
    CD. See Appendix C for installation instructions.


    # ## Putting up Your Mailbox


    As with browsing the Web, you have to be wired to the Internet to use e-mail.
    See Chapter 4 for details.'
  merge: -1
  img_proc: true
- pgno: 286
