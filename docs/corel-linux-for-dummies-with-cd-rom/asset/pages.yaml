    # Rearranging menus and other menu editor tricks


    When you’re in the KDE menu editor, here are some tricks you can employ:


    +   - Click submenus to display succeeding levels of entries. Click again to

    +   close a submenu and all the levels below it.

    +   - Drag a menu item to another location to copy it.

    +   - To start over without saving your changes, click the Reload button on

    +   the menu editor toolbar.

    +   - Right-click entries; then move them by cutting and pasting or copy them

    +   by copying and pasting.

    +   - Drag, cut, copy, and paste submenus just like you do individual entries.

    +   This lets you rearrange submenus to suit your preferences.

    +   - Drag an item to another location by holding the middle mouse button

    +   (or both the left and right buttons).


    The menu editor takes some getting used to, so play around with it to get the

    feel of how it works. One trick you might try is to copy an entry similar to the

    one you want to add and then right-click and choose Change to customize it.

    You can always click the Reload button to start over or simply discard your

    changes.'
