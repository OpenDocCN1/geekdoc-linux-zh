- pgno: 159
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_159_0.png)


    You can also right-click your desktop to create a URL nickname. If you have the
    location in Netscape at the time, you can cut and paste the URL location from
    there.


    # Removing and editing nicknames


    To remove a nickname from your desktop, simply drag it over to the Trash icon.
    You can also right-click the icon and choose Move to Trash.


    To edit a desktop nickname, right-click its icon and choose Properties.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_159_1.png)


    Each program and URL nickname has an associated kdelnk file in the user’s Desktop
    folder. The root user can, for example, copy kdelnk files to the Desktop folders
    belonging to various users, to give them the same nicknames.


    # Putting links on your desktop


    Desktop links are similar to nicknames, as you can see in Figure 9-9. Links are
    straight from-here-to-there deals, without the nicknames’ configuration options.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_159_2.png)'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'The basic varieties of desktop links are easy to create:


    +   - **Folder links** open folders in File Manager. The folder you link to can
    be anywhere, unlike a nickname folder, which always resides on your desktop.

    +   - **File links** open files. For a known file type, the file opens in its
    associated program, such as WordPerfect for a WP doc or the Text Editor for a
    text file.

    +   - **Program** links launch the application you''re linked to.


    Notice how the link icons include little link arrows in the lower-left, to distinguish
    them from the originals from whence they came. If you move the original program,
    folder, or file, the link no longer works.


    To create a desktop link:


    +   1. **Open File Manager and locate the folder, file, or program.**

    +   2. **Drag and drop the item on your desktop.**

    +   3. **Choose Link from the menu that appears, as shown in Figure 9-10.**


    ![](img/82794ff9433a50ada079e99ce57c4c4f_160_0.png)


    Pretty simple. Now just click the link whenever you want to go to the folder or
    file or launch the program.


    **TIP**


    You can drag the nicknames and links around your desktop to rearrange them. Then
    right-click on your desktop and choose Arrange Icons to line them up straight.


    # ## Customizing your menus


    Let''s face it, you can have only so many nickname icons on your desktop. After
    a point, sparks start bouncing around your eye sockets, making things harder to
    find, not easier. The best way to dig a program out of the haystack is to cruise
    through a nice set of menus, clearly arranged by topic.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# ### Linking to links


    One cute trick I discovered is that you can link to the KDE link files, created
    for menu selections and other items. For example, I created the links for Web
    sites in Figure 9-9 by doing a file find on *.kdelink to locate the entries for
    the Online


    Services menu and then right-clicking those. Clicking the resulting link opens
    Netscape and takes me straight to the site, just as if I had made the menu selection.


    Why isn''t a program you use on the menus? Either because it wasn''t put there
    in the first place (see Chapter 6) or because you''ve since added the program
    to your repertoire, through Corel Update (see Chapter 17).


    The basic operations of adding or removing folders and applications are simple
    ... once you know how. It''s also simple to move applications from one submenu
    folder to another. More sophisticated menu editing tasks require the KDE menu
    editor.


    # **Adding submenu folders and applications to your menus**


    As I said, it''s simple to add submenu folders and applications (nicknames) to
    your menus. Unfortunately, the easy way works only for the root user in the initial
    release of Corel Linux. The KDE menu editor doesn''t have this restriction, so
    the first thing you''d do is add the KDE menu editor to your Utilities submenu:


    +   1. **Log in under root, assuming you''re allowed to do so.**


    Remember, root access gives you power to mess up system files, so log out and
    then log back in under your normal user ID as soon as possible.


    +   2. **Choose Application Starter ⇄ Applications ⇄ Utilities.**


    +   3. **Right-click Utilities, and choose New ⇄ Nickname, as shown in Figure
    9-11.**


    To add a subfolder instead of an application nickname, choose Folder when you
    right-click and give the subfolder a name.


    +   4. **In the Nickname box, type Menu Editor, as shown in Figure 9-12.**


    ![](img/82794ff9433a50ada079e99ce57c4c4f_161_0.png)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_161_1.png)'
  merge: -1
  img_proc: true
- pgno: 162
