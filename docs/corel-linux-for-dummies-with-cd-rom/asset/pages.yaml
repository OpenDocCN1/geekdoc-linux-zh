- pgno: 52
  md: '23


    # ## When free space isn''t free


    To install Corel Linux, Install Express must find find free space on your hard
    drive that it can format as a Linux partition, to hold your operating system and
    Linux files.


    Suppose you have a typical Windows PC with, say, a 5GB hard drive fully allocated
    to your Windows c: drive. If you''ve installed only 2GB of programs and files,
    you''re left with 3GB of free space as far as Windows programs are concerned.


    Unfortunately, this 3GB of space isn''t free space to Install Express because
    it''s part of a Windows partition that''s off limits to the Linux file system.
    Corel Linux is really looking for *unpartitioned space* that''s not being used
    by Windows.


    You have three ways out of this predicament:


    +   * **Option 1:** Let Corel Linux reformat your hard drive, wiping out Windows
    and any existing data as it does.


    +   * **Option 2:** Use the Corel Linux trick of installing to that “free space”
    on your Windows 95/98 partition. Corel Linux will be awkward to launch and you''ll
    take a huge performance hit, but at least you''ll get a taste of Corel Linux.


    +   * **Option 3:** If you''re a computer guru, you can use a third-party disk
    partitioning utility, such as PowerQuest''s PartitionMagic or the open source
    FIPS utility, to reduce the size of your Windows partition, thus creating true
    unpartitioned free space that Corel Linux can use.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_52_0.png)


    Don''t use a disk partitioning tool unless you really know what you''re doing.
    With such a tool, you can easily destroy an existing system.


    If you want to run both Windows and Linux on one machine but you''re not happy
    with any of these options, Corel Linux is probably not for you at this time.


    # ## Waddaya mean I can dual boot?


    When you install Corel Linux to share your machine with an existing OS, you get
    a *dual-boot* machine that let''s you choose which OS to use on boot-up. (However,
    if you go the “Install in DOS/Windows partition” route, you''ll have to boot to
    Windows before you can get to Linux.)'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'Corel Linux sets up its LLO (Linux loader) so you can choose which OS to use
    on boot-up. The default is Corel Linux, but you can change that (see Chapter 4).


    TECHNICAL STUFF

    LLO is installed in your Master Boot Record (MBR), generally the preferred location.
    But there''s no option to install in the first sector of the root partition (where
    the Linux system files and kernel reside). This can knock out another boot manager,
    such as BootMagic or System Commander.


    # **Peace, brother OS! (Linux and Windows under one roof)**


    Before you let Install Express blast away at your computer''s innards, take a
    moment to reflect on how Corel Linux is physically installed on your computer
    — especially if Corel Linux and Windows will be living under one roof.


    Linux and Windows will get along well enough, but each has to have its own room,
    or partition, on your hard drive. Linux partitions have a different format (ext2)
    from Windows partitions.


    If you want to have a Linux-only machine, you can simply let Install Express take
    over your entire hard drive. But if you intend to also install Windows or another
    operating system, you''ll want to choose the “Use free disk space” option, to
    leave room for the other system. Likewise, if you''re installing Corel Linux on
    a machine that already has Windows 95 or 98, you wouldn''t want to choose the
    “Take over data” option — unless you intend to wipe out Windows and all your existing
    data.


    TECHNICAL STUFF

    Actually, Install Express normally creates two Linux partitions, one for your
    programs and data and a swap partition to soup up your Linux engine. You can create
    additional partitions by selecting the Edit partition table option.


    Just to add to the confusion, the unique Corel Linux option to install in a DOS/Windows
    partition does so without changing the partition to the Linux format. This is
    a great way to test out Corel Linux on a Windows 95/98 machine, though it''s not
    an efficient way to run Linux. Corel Linux will be awkward to launch, and performance
    will be much slower than in a native Linux partition.


    # **Get Set . . . (Making Your Selections)**


    Are you ready? Then it''s time to start the install! I assume you''ve been waiting
    patiently for this moment, resisting the urge to break the seal at the back of
    the book — like not opening a present before your birthday.'
  merge: -1
  img_proc: true
- pgno: 54
