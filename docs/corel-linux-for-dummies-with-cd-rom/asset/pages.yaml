  md: 'You can mix parts from various themes. Suppose you want the Wood theme (which
    doesn''t have sounds) and you want the sounds from the MGBreizh theme. Apply the
    Wood theme, choose the MGBreizh theme, click the Contents tab, choose the Sounds
    option, and then click the Apply button. Voila!


    The Default theme selection consists of the KDE default settings with no special
    theme elements. This selection is the easiest on system resources.


    # Satisfying your theme hunger


    After seeing some of the stupendous effects of some themes, you''re bound to be
    hungry for more. To satisfy your visual appetites, head over to the kde.themes.org
    Web site, as shown in Figure 10-14. You can download themes to your heart''s content
    and then add them to your list.


    You might be tempted to go after wild, dark, and mysterious themes. If you''re
    still using your computer for work and not just play, look for the small, simple,
    elegant makeovers. They won''t leave you buried in foliage or squinting at the
    screen to make out the text.


