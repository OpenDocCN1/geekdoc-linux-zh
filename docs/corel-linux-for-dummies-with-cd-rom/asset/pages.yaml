- pgno: 318
  md: '# Adopting a New Theme


    Changing colors isn’t enough? Try adopting a whole new theme! Themes are all-in-one
    packages with everything from custom colors and wallpapers to borders, icons,
    sounds, and more. Some theme party outfits are sedate and formal; others are totally
    wacky and wild!


