- pgno: 152
  md: '# Chapter 9


    # Desktop Dynamics


    # In This Chapter


    +   Tailoring your desktop

    +   Customizing the keyboard

    +   Moving the panel and taskbar

    +   Improving your desktop operations

    +   Customizing your window operations


    The Corel Linux desktop is a great place for most people to work and play. You’re
    not “most people”? No problem. This chapter shows you how to arrange the furniture
    in your desktop environment in a way that’s most efficient—and fun—for you.


    The idea here is to experiment—try stuff out and choose the settings you like
    best. Remember, though, that lots of work went into designing the Corel Linux
    environment, so in most cases you should be quite happy with the program’s defaults.


    Still, desktop settings aren’t the meat-and-potato critical settings of Chapter
    4, where you connect to the Internet or hook into a local network. Think of them
    as detectable graphical desserts to fine-tune desktop operations and make programs
    easier to launch.


    # It’s Your Desktop!


    Think of your desktop as *valuable real estate*. Just as a prime time television
    commercial gets quick access to millions of susceptible brains, vendors of potato
    chips and SUVs would love to grab a place on your upwardly mobile monitor.'
  merge: -1
  img_proc: true
- pgno: 153
  md: "But guess what? You're tuned into Linux, so your channels are off-limits to\
    \ Crispy Foods and Mogle Motors. The closest you come to commercialism in Corel\
    \ Linux is the trail of cookie crumbs scattered on the Online Services menu, leading\
    \ to various Corel Web pages.\n\nYup, the desktop is yours and yours alone, both\
    \ as a work-and-play place and as a launching pad for whatever you want to do.\
    \ If you use, say, the Gimp graphics program a lot, give it a prominent place.\
    \ That's your choice, not the dictates of Cyclops Software.\n\n# Keeping your\
    \ desktop from  \nsession to session\n\nOne aspect of your desktop settings that\
    \ is totally automatic is called *session*  \n*management*. You should still be\
    \ aware of how session management works, however, to make the most of it.\n\n\
    Suppose you want to log out of the system, but you're in the middle of running\
    \ some screen captures from the command line in the Console and copying files\
    \ from one folder to another in File Manager. Rather than close everything down,\
    \ just leave your desktop as-is when you exit. The next time you log in, the File\
    \ Manager automatically opens to the same folder and the Console is there, ready\
    \ to continue where you left off.\n\n> **WARNING!** Be aware, however, you can\
    \ lose your work in certain applications if you don't save it before you exit.\
    \ You get a warning that shows the open applications when you exit the desktop.\n\
    \n**TECHNICAL STUFF**  \nYou can even single out groups of windows to exclude\
    \ from automatic session management. See \"Filtering windows for special treatment,\"\
    \ later in this chapter.\n\n# Putting nicknames on your desktop\n\n*Nicknames*,\
    \ as their name implies, are the quickest way to get from here to there. Desktop\
    \ nicknames come in three flavors, as shown in Figure 9-1:\n\n+   - **Folders**,\
    \ which place a file folder right on your desktop  \n+   - **Program nicknames**,\
    \ which execute programs  \n+   - **URL nicknames**, which take you straight to\
    \ Internet locations"
  merge: -1
  img_proc: true
- pgno: 154
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_154_0.png)


