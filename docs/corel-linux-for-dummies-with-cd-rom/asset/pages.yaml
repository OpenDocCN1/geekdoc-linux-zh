- pgno: 56
  md: 'The “detecting hardware” part means that Corel Linux is doing the hard part
    for you — automatically probing your system to find out what type of video, sound
    card, tracking device, and other hardware you have. This is where much of the
    pain of the traditional Linux installs is removed. This step takes a while — please
    be patient.


    # Step 2: Agree to the onerous terms


    Next you arrive at the inevitable license agreement. Read the agreement and click
    Accept to become an indentured servant to Corel or click Decline and remain a
    slave to Microsoft.


    # Step 3: Who are you?


    Think you can fill in the name entry in Figure 2-2? This is the name you want
    Corel Linux to know you by. It can be up to 16 letters and numbers, but no capital
    letters please. On a multis user system, it’s common to use your first name plus
    the first letter of your last name (such as janed for Jane Doe).


    ![](img/82794ff9433a50ada079e99ce57c4c4f_56_0.png)


    Figure 2-2: What''s your name?


    This is your working name. Every Linux system also has a *superuser* named root,
    who can access all the settings and muck about with the system.


    # Step 4: What do you want to install?


    Now that you’ve figured out your name, click Next to choose what to install, as
    shown in Figure 2-3.'
  merge: -1
