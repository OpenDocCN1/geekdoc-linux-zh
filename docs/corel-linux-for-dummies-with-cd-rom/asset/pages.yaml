    # # Rescue Missions


    A few real-life examples will illustrate how some simple commands can get you
    out of major difficulties.


    # ## Where did my letters go?


    Suppose that you sit down to begin work but Corel Linux starts only in command
    mode. You don’t want to waste time and energy trying to fix things, so you decide
    to reinstall Corel Linux. However, you want to rescue some letters first. You
    know that their names all started with *Letter* but you don’t remember exactly
    where you stored them. You also know that you stored important addresses in a
    text file in the same directory.


    You need to do the following:


    +   - Find your letters

    +   - Find your addresses

    +   - Copy your files to a safe place (a folder in the Windows partition or a
    floppy disk)


    At first, without your nice graphical desktop and familiar File Manager, you might
    feel like you’re alone in the wilderness. But as soon as you see how easy it is
    to find your letters, you’ll start to realize that command mode is nothing to
    be afraid of. To find your files:


    +   1. **Type `cd /` to go to the root level.**

    +   2. **Type find -name Letter*.wpt to find your files.**


    Linux searches for the files and displays the names of the files found (including
    the path):


    ```

    ```

    /home/elmz/data/Letter2000_01.wpd

    /home/elmz/data/Letter2000_02.wpd

    /home/elmz/data/Letter2000_03.wpd

    /home/elmz/data/Letter2000_04.wpd

    /home/elmz/data/Letter2000_05.wpd

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 352
  md: '3. **Type `cd /home/elmz/data` to go to the directory where Corel Linux found
    your letters.**


    4. **Find your addresses by searching for a specific string, such as by a name
    in your addresses list.**


    For instance, if you type


    ```

    ```bash

    grep -i "Zijijeman" *.txt

    ```

    ```


    Corel Linux displays the name of the file(s) found, such as


    ```

    ```

    Important.txt

    ```

    ```


    Now that you’ve found the files, it’s time to copy them to a safe place. You have
    a choice of copying the files to your Windows partition or to a floppy disk.


    To copy the files to your Windows partition, type


    ```

    ```bash

    cp /home/elmz/data/Letter*.wpd /disks/c/data

    cp /home/elmz/data/Important.txt /disks/c/data

    ```

    ```


    If you instead want to copy the files to a floppy disk, you must mount the floppy
    drive first:


    ```

    ```bash

    mount -t msdos /dev/fd0 /mnt/floppy

    ```

    ```


    Then you type


    ```

    ```bash

    cp /home/elmz/data/Letter*.wpd /mnt/floppy

    ```

    ```


    That wasn’t too hard, was it?


    # Moving some system files


    Here’s a real-life example of using command mode that I encountered while writing
    this book. In demonstrating how you can create a desktop link to your files, I
    accidentally copied my X11R6 graphical system files to the desktop instead of
    linking to them! My Corel Linux graphical lights immediately went out as I was
    unceremoniously kicked into back-screened command mode.


    The tragedy of moved system files can happen only when you’re logged in as root.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_352_0.png)'
  merge: -1
  img_proc: true
- pgno: 353
  md: 'After my initial panic, I thought "Wait. This isn''t the Windows Blue Screen
    of Death. I''m still in Linux! I could use Linux commands to see where my files
    had gone and then copy them to their original location. Here''s how I did it:"


    +   1.  In command mode, I typed **root** and pressed Enter to log back in as
    root.

    +   2.  I typed my root password. (The password doesn''t appear as you type it.)

    +   3.  I typed **cd /root/Desktop** to tipoe over to root''s desktop directory.

    +   4.  I typed **ls** to see what was on my desktop. (Every icon you place on
    your desktop has an entry in your Desktop directory.) I saw a bunch of icons,
    a few folders and files, and sure enough, **X11R6**!

    +   5.  Next, I typed **ls /X11R6** and saw that all my subdirectories were there
    too.

    +   6.  Just to confirm what had happened, I typed **ls /usr**, and saw that **X11R6**
    was no longer in its proper place, in the **/usr** directory.

    +   7.  I typed **cp /root/Desktop/X11R6 /usr/X11R6 -R** to copy everything back
    from whence it came.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_353_0.png)


    Note the *-R* option. That''s to *recursively copy everything* in the directory
    plus all the subdirectories. (Without the *-R* option, only the directory would
    have been copied, without its subdirectories.) And note I used an uppercase *R*
    — options are case sensitive, so *-r* (reverse, in this case) and *-R* are different
    options.


    +   8.  When my hard drive stopped making its reassuring whirring and clicking
    noises, I typed **ls /X11R6** again. Sure enough, the directory and its subdirectories
    were back where they belonged!

    +   9.  I typed **shutdown now -r** and my system restarted in graphical mode!


    # # Editing Configuration Files


    Well, rescuing your files wasn''t that hard using Linux commands. Now suppose
    that you have to only edit a few configuration files to get your system back to
    work. You probably think this will be a snap — just start the editor and make
    the necessary changes. Unfortunately it''s not that easy. You can''t use the familiar
    Text Editor to edit your configuration files. Instead, you have to use a command-line
    editor such as *vi*.


    Although *vi* is not the easiest editor to use, most experienced Linux users can''t
    live without it. And after you know how it works, you too might find it fast and
    powerful. Most Linux distributions offer more than one text editor (such as *Emacs*
    or *Joe*) but *vi* is the only editor you will always find on any Linux (or UNIX)
    system.'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# Appendix A: Commands to the Rescue!


    The most confusing thing about vi is that it has three modes of operation:


    +   * Command mode

    +   * Insert mode

    +   * Last-line mode


    When you start vi, it’s in command mode, which means you have to use commands
    to edit files and to change to other modes. For example, if you type x, you won’t
    see an x appear in your file. Instead, vi deletes the character underneath the
    cursor.


    If you want to add or edit existing text, you have to switch to insert mode first.
    Type i from command mode to switch to insert mode. In insert mode, vi more or
    less works like the editor you’re accustomed to. Just don’t press the Esc key
    because you’ll be returned to command mode.


    Last-line mode is a type of command mode as well but is used for complex vi commands.
    To switch to last-line mode, you type : in command mode. In last-line mode, every
    command you type is executed after you press Enter. For instance, to save the
    current file and end your vi session, you would type wq and press Enter.


    This sounds more complex than it is. Maybe you should just give vi a try:


    +   1. **To start vi, type vi filename.**

    +   For instance, if you type vi first_try.txt, you open a new file called first_try.txt
    in vi, as shown in Figure A-1. Not much to see yet. Maybe you should add some
    text.

    +   Don’t start typing yet. Remember, you’re still in command mode.

    +   2. **Type i to switch to insert mode.**

    +   3. **Add text to your file.**

    +   You can type as many lines of text as you want. Simply press the Enter key
    to move to the next line.

    +   Don’t try to use the arrow keys to navigate through the text — they won’t
    work, unless you switch to command mode (by pressing Escape) first.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_354_0.png)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_354_1.png)


    This isn’t hard, is it? Well, vi wouldn’t be vi if things weren’t a little more
    complex. Forget about one insert mode — vi has a few. Type


    +   * i to insert text at the cursor position

    +   * a to insert text after the cursor position

    +   * o to begin a new line in insert mode'
  merge: -1
  img_proc: true
