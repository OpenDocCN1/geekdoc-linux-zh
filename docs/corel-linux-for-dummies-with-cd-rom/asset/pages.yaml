- pgno: 335
  md: '# Connect with the Debian Support Site


    Corel Linux OS is based on Debian, so the Debian Support site at http://www.debian.org/support
    can provide you with details on what''s under the hood. Go here for interesting
    clues rather than detailed instructions.


    # Join Other Linux Newsgroups


    In addition to Corel-sponsored Linux newsgroups, others might be of interest.
    Connect to your ISP''s newsreader and search for newsgroups on Linux. Expect to
    find plenty! Here are four you might like:


    +   - alt.os.linux, on Linux in general

    +   - alt.os.linux.corel, on you-know-who

    +   - comp.os.linux, on Linux in general

    +   - linux.debian, on Debian Linux


    # Visit IDG''s LinuxWorld


    Walk, bike, fly, drive, train, or swim to IDG''s LinuxWorld exposition and conferences
    at http://www.linuxworldexpo.com/. Meet technicians, check out the latest vendor
    offerings, and immerse yourself in the Linux culture. Win prizes, buy books, and
    pick up all kinds of goodies. Hear keynotes by Linux leaders and join the excitement.
    (Some pretty good parties too!)


    # Browse Online and Print Magazines


    A sure sign of our times is to see several interesting Linux magazines emerge:


    +   - **Linux Today**, at http://linuxtoday.com/index.html, is the place to go
    to see what''s happening. They gather news from many sources, so the articles
    are a mixed bag in terms of journalistic quality.

    +   - **Linux Magazine** provides excellent background articles and interviews,
    covering both the business and technical sides of Linux for all levels of users.
    Check their Web site at http://www.linux-mag.com/ for back issues and subscriptions.'
  merge: -1
  img_proc: true
- pgno: 336
  md: '> > - *Linux Journal*, at http://www2.linuxjournal.com/, is another good source
