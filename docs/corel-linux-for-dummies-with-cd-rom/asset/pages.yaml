    +   Or if you log in as a regular user, be prepared to supply the root password
    when prompted.


    +   2. Connect to the Internet if you’re updating from a remote site rather than
    from a CD.


    +   3. Choose Application Starter ⇢ Applications ⇢ System ⇢ Corel Update.

