  md: '**Table 7-1 (continued)**


    | Click This Button | Upper-Left Buttons | To . . . |

    | :--- | :--- | :--- |

    | [Sticky button icon] | **Sticky button** | Stick the window to make it appear
    in all your desktops. Click again to unstick the window and make it appear in
    only the current desktop. |

    | | Upper-Right Buttons | |

    | [Iconify button icon] | **Iconify button** | Make the window get out of the
    way. Click its button on the panel to get it back. |

    | [Maximize button icon] | **Maximize button** | Enlarge (maximize) the window
    to fill the entire screen, minus the panel.* |

    | [Restore button icon] | **Restore button** | Return a maximized window to its
    previous size.* |

    | [Close button icon] | **Close button** | Close the window. |


    *Maximize and restore are alternating states of the same button. |



    > TIP

    > If you’re using a different desktop theme (see Chapter 10), your buttons might
    take on a wacky appearance, but they’ll do the same things.


    # Dropping in at the menu bar


    If you’re really hungry, especially if you’re looking for an oddball delicacy
    such as chocolate ants, drop in at the menu bar. There you’ll find nearly every
    program offering, logically arranged under the menu categories of File, Edit,
    and so on. Many menu selections lead to submenus (File Open Recent) or dialog
    boxes (Options Default Style). These selections are indicated by right-pointing
    triangles or ellipses (...) for dialog boxes.


    To mouse around the menu bar:


    +   1. Click a menu bar selection, such as File or Edit.

    +   2. Move the mouse to browse through the menu and submenu selections.

    +   Point to the menu bar selections to move from menu to menu.

    +   3. Click to select the delicacy of your choice.'
