- pgno: 82
  md: 'If your printer’s listed, check your printer’s documentation for other compatible
    printers you can select. You can also check with the manufacturer for the latest
    Linux drivers.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_82_0.png)


    +   4.  Click Finish.


    +   5.  Select the printer from the list and then click Properties to change any
