- pgno: 302
  md: '# Chapter 17

    # Upgrade Madness


    # **In This Chapter**


    +   - Upgrading and adding software

    +   - Setting up your custom package sources

    +   - Installing Debian packages

    +   - Deleting stuff


    ![](img/82794ff9433a50ada079e99ce57c4c4f_302_0.png)


    To say that Linux changes are coming at a rapid rate borders on under-

    statement. Linux is hot, and its pace of development is torrid! Literally

    thousands of folks are hard at work on the Linux kernel and its myriad hard-

    ware drivers and supporting applications. The contributions of major corpo-

    rations are accelerating the work of independent hackers. I''m talking about

    not just the likes of Corel and Red Hat, but also IBM, Sun Microsystems,

    and other companies too numerous to mention.


    Does this mean that your Corel Linux system is obsolete the minute you

    install it? Certainly not, but it will get better and better. Pretty soon, you''ll
    be

    able to do everything in Corel Linux that you can in Windows — on a stable,

    efficient platform. How can you resist checking for the latest stuff?


    In addition to upgrading, you might want to add that game or some other

    application from your *Corel Linux For Dummies* CD that wasn''t part of your

    initial install. Likewise, it''s simple to remove a program you no longer need.


    # ## Updating (Or Adding) with a Smile


    Because you''re the proud owner of Corel Linux, you''re in luck when it comes

    to upgrades. There are two reasons for this:


    +   - Corel Linux comes in the technically superior Debian modules, or *pack-

    +   ages*, which declare any related requirements (*dependencies*) to the

    +   installer.

    +   - The Corel Update package manager makes updating your system an

    +   incredibly simple and foolproof task.'
  merge: -1
  img_proc: true
- pgno: 303
