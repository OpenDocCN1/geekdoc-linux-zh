- pgno: 2
  md: '# Helpful Hints


    +   Use multiple desktops to arrange your tasks, putting WordPerfect in Desktop
    #1, Netscape in Desktop #2, and so on. If you haven''t used Linux before, you''re
    going to love this feature!

    +   Iconify the windows you''re not using to clear your desk for the stuff you''re
    working on. Click a window''s task button on the panel to make the window disappear
    or to bring it back.

    +   Double-click the title bar to alternately shade (roll up) and unshade (unroll)
    the window.

    +   Right-click pretty much anywhere for a context-sensitive menu of things to
    do. If in doubt, right-click!

    +   Whenever possible, log in under your regular user name, not as root. It''s
    easy for root to mess up system files.

    +   For a program that you use a lot, right-click its title bar and then choose
    Create Nickname. After that, you can click the nickname on the desktop whenever
    you want to launch the program.

    +   Autohide your panel to tuck it discreetly out of view. Right-click a blank
    spot in the panel, choose Configure, click the Options tab, and then choose Auto
    hide panel.

    +   Press Ctrl+Esc to display a scrollable list of all the windows on all your
    desktops.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_2_0.png)'
  merge: -1
  img_proc: true
