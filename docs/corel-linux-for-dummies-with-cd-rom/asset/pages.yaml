    # Creating folder nicknames


    You can place folders right on your desktop, for direct access to important files:


    +   1. Right-click on your desktop and choose New Folder.

    +   2. Give the folder a name and then click OK, as shown in Figure 9-2.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_154_2.png)


    Figure 9-2:

    Creating a

    desktop

    folder for

    direct

    access to a

    bunch of

    files.'
