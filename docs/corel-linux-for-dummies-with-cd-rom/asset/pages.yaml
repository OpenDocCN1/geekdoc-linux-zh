- pgno: 270
  md: '# Chapter 15


    # Cruising in Cyberspace


    +   **In This Chapter**

    +   - Launching into cyberspace

    +   - Launching Netscape

    +   - Finding a contact lens on the beach

    +   - Using Corel’s online services to set up a virtual office

    +   - Setting your browser preferences

    +   - Bookmarking your favorite places

    +   - Browsing cyberspace with your File Manager

    +   - Transferring files between your place and theirs


    **T**he Web is a fabulous way to connect with others around the world and get
    instant information on *anything*. This chapter has you hopping from Web page
    to Web page all over cyberspace. And in Chapter 16, you send messages across continents
    in less time than it takes to print snail mail and stuff it in an envelope.


    # Cruising in Cyberspace


    Netscape Navigator, shown in Figure 15-1, is your ticket to cruising the virtual
    universe. It comes bundled with all versions of Corel Linux.


    And look at Figure 15-2 — you can access Web sites through File Manager as well!
    A file on your computer, a folder on the network, or a Web page in Timbuktu —
    they’re all the same to File Manager!


    The great thing about the Web isn’t the software or the commercial sites — it’s
    the people. Instead of being a couch potato watching television, you can be couch
    potato communicating with others on the Internet.


    Interested in Cajun cooking, raising goats, riding the Earth of land mines, or
    tricks on using Corel Linux? You’ll find many others on the Web who share your
    interests and concerns.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# What''s the Web?


    If you''re new to the Web, some explanation might be in order. The Web, also known
    as the World Wide Web, WWW, and W3, has taken the computer industry by storm.
    Politicians try to censor it and giant corporations vie to control it, but the
    infant Web (for now) is toddling off in its own direction and growing at its own
    pace - which happens to be a breakneck speed.


    universities, companies, and government agencies, and lets you hop from page to
    page around the globe.


    The Web supports


    +   *   Information, such as reports, files, and bulletins

    +   *   Communication, including e-mail, forums, and conferences

    +   *   Services, such as banking, airline reservations, and catalog shopping


    To the user, the great thing about the Web is its simplicity. It appears on the
    screen one richly formatted hypertext page at a time. The next page you click
    to can be in the same folder as the current one or on another site a continent
    away.


    A spider''s web is an apt metaphor — the Web is the gigantic creation of millions
    of individuals,


    Another great thing about the Web is that it''s platform independent. It''s the
    only place where all the operating systems meet!


    ![](img/82794ff9433a50ada079e99ce57c4c4f_271_0.png)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_271_1.png)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_271_2.png)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_271_3.png)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_271_4.png)


    ![](img/82794ff9433a50ada079e99ce57c4c4f_271_5.png)'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# Chapter 15: Cruising in Cyberspace


    ![](img/82794ff9433a50ada079e99ce57c4c4f_272_0.png)


    Figure 15-2: The same Web site viewed in the Corel File Manager.


    Of course, the Web has lots and lots of information. You can print a map of Oshkosh,
    Wisconsin, check train and airline schedules, and research any topic imaginable.
    Whatever you’re looking for, it’s there!


    Your Web browser can take you to different types of places depending on your *protocol*
