  img_proc: true
- pgno: 130
  md: "If a menu selection appears *grayed out*, you can't use it at the moment. In\
    \ WordPerfect, for example, the Cut selection on the Edit menu appears grayed\
    \ out if you haven't selected any text. The little KDE text editor hasn't learned\
    \ this yet.\n\nIf you're not into mousing, peruse menus with the keyboard:\n\n\
    +   1. **Choose a menu** by pressing the Alt key plus the underlined letter. \n\
    +      Press the Alt key alone to go to the top of the leftmost menu, which is\
    \ usually File.\n+   2. **Scroll the menus** by using the arrow keys.\n+   3.\
    \ **Press Enter** to select the highlighted item.\n\nTo exit a menu without making\
    \ a selection, click outside the menus or press Esc.\n\n# ## Getting fast food\
    \ from the toolbar\n\nToolbars are sort of a fast food drive-through, with one-click\
    \ access to frequently used features. Instead of the vast buffet of the menus,\
    \ toolbars have an eye-catching selection to satisfy ravenous appetites.\n\nCorel\
    \ programs for Linux sport a *property bar* beneath the toolbar. This chameleon-like\
    \ toolbar presents a set of features pertaining to the current task (such as drawing,\
    \ tables, or outlining). If you're in WordPerfect, select some text or create\
    \ a table and note how the property bar selections change, while the standard\
    \ toolbar items remain the same.\n\n# ## Going for a scroll (bar)\n\nThe *scroll\
    \ bar* along the right side (and sometimes the bottom) of the window lets you\
    \ move quickly through long documents. The position of the *scroll box* indicates\
    \ exactly where you are in the document.\n\nThe real fun is in getting from here\
    \ to there:\n\n+   - Click the **scroll arrows** at either end of the bar to move\
    \ line by line or row by row. Hold an arrow down to scroll continuously.\n+  \
    \ - Drag the **scroll box** to quickly move to another location.\n+   - Click\
    \ a **blank spot** above or below the scroll box to scroll a screenful of information\
    \ at a time."
  merge: -1
  img_proc: true
- pgno: 131
  md: "# Grabbing the latest gossip  \nat the status bar\n\nDrop at the *status bar*,\
    \ at the bottom of the window, to hear the latest on what’s happening in your\
    \ program. For example, when you click a folder in the File Manager, the status\
    \ bar shows you the number of files in the folder and their total size, as shown\
    \ in Figure 7-3.\n\n![](img/82794ff9433a50ada079e99ce57c4c4f_131_0.png)\n\nVarious\
    \ programs display different things on the status bar. The WordPerfect status\
    \ bar (which it calls the application bar) shows what documents you have opened,\
    \ your location in the current document, and whether your shadow cursor is on.\
    \ When you’re working on a table, it tells you which table and cell you’re in.\n\
    \n# The Incredible Right-Click\n\nOne amazing thing about a graphical interface\
    \ is that programs seem to know where you are and what you’re doing and can guess\
    \ what you want to do next. The buzzword for this omniscient clairvoyance is *context\
    \ sensitive*."
  merge: -1
  img_proc: true
- pgno: 132
  md: 'This context-sensitiveness can make your life a lot easier. Plus, it gives
    your right mouse button something to do. Try this: Right-click the desktop, as
    in Figure 7-4. Now, you wouldn''t do this to add a new user. Instead, the program
    figures that you might want to arrange your icons, create a nickname or folder,
    or log out of the system because dinner is getting cold.


    +   Figure 7-4: When you right-click the desktop, the program figures out what
    you want to do.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_132_0.png)


    When you right-click in WordPerfect, you get such likeliest as center your text,
    run a spell check, or change the font. Pop quiz: Where are you going to right-click
    to customize your panel? That''s the beauty of right-click — it usually pops up
    what you''re looking for, thus saving tons of memorizing and hunting around. Enjoy
    your dinner.


    # Conducting a Dialog


    When you do something in Corel Linux, such as change the font or search for a
    file, your choices are often presented in the form of a dialog box, or dialog
    for short, as in Figure 7-5. The dialog allows for back-and-forth between you
    and the program. The program says "here are the things from which to choose,"
    and you say "thanks, these are the things I''m choosing and here are their names."


    # Consulting a wizard


    A sophisticated cousin to the dialog box is the wizard, which offers a relatively
    foolproof method to accomplish a complex task. A good example is the Installation
    Wizard of Chapter 2, which lets you install an entire operating system in a few
    easy steps. The selections you make in Step 2 of a wizard may affect your choices
    in Step 3, and so on till you complete the task. Another example of a wizard is
    the one used to add a printer, described in Chapter 4.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '![](img/82794ff9433a50ada079e99ce57c4c4f_133_0.png)


    You''ll get the idea quickly enough, so no need to attend night classes at dialog
    school. Table 7-2 summarizes the gizmos you can find in a dialog and how they''re
