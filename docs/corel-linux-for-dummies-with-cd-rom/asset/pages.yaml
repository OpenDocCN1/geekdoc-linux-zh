  md: '# Printing a note


    When subliminal messages like “Buy Crispy Crunches” pop into your brain, you can
    add the items to your shopping note. Then, when it’s time to shop, right-click
    the note and click Operations → Print Note, so you can take it with you.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_250_0.png)


    Your printer has to be set up to print, as explained in Chapter 4.


    # E-mailing a note


    You can write a shopping list note and then e-mail it to your spouse at another
    location. Right-click the note, choose Operations → Mail Note, and then specify
    the receiver’s e-mail address.


    # Exiting the Note utility


    Like I said, the Note utility keeps going and going from session to session, until
    you tell it to stop. If you want to turn it off for some reason, right-click the
    Note icon in the docking station and choose Exit knots.


    ![](img/82794ff9433a50ada079e99ce57c4c4f_250_1.png)


    Alarms won’t sound when the program is closed.'
  merge: -1
  img_proc: true
