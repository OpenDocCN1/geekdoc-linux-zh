- pgno: 346
  md: '# Appendix A


    # Commands to the Rescue!


    Hey, didn''t you tell me that Corel Linux offers a graphical user interface? Why
    should I use Linux commands? You''re right: Corel Linux will probably run in graphical
    mode all the time. But accidents can happen. What if your graphics fail and Corel
    Linux boots into command mode? You can


    +   - Wipe out your system and start all over again.

    +   - Try to rescue your files and your configuration.


    If Corel Linux starts in command mode, rescuing your files is easy. And with a
    little outside advice, you might be able to restore your system just by editing
    a configuration file.


    # Command Anatomy 101


    After you get to know the Linux commands, you''ll find that they''re nothing to
    be afraid of. In fact, consider them your friends, waiting to do what they can
    for you.


    Commands can have up to three components:


    +   - The **command** itself, such as `ls`, `cd`, or `cp`

    +   - **Variable information** that you plug into the command, such as a directory
    name and a path

    +   - **Options** (arguments) that expand or alter what the command does for you


    For example, the command


    ```

    ```

    ls /home/erwin/work -l

    ```

    ```


    lists the files in the /home/erwin/work directory and displays their file size
    and permissions.'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'The basic rules for entering commands are simple:


    +   • You must type the command first.

    +   • You may use multiple options at one time, in any order.

    +   • You must separate items in the command line by spaces or tabs.


    Each command is normally entered in a single command line. If a command is too
    long for a single line, press the backslash key (`\`), followed by the rest of
    the command. If you want to enter multiple commands in a single line, separate
    each with a semicolon (`;`).


    # Essential Linux Commands


    I know it ain''t gonna happen to you, but just suppose your graphics go belly-up
    and you find yourself staring at the Linux command prompt. What to do? For starters,
    you can type the ls command to list files in the current directory.


    In command mode, folders go by their old name of *directories* because you no
    longer get those cute folder icons to click.


    Now suppose that you want to back up some files before you get started. Which
    commands do you need? How about these:


    +   • The ls command to list files in the current directory

    +   • The cd command to navigate through directories

    +   • The cp command to copy files


    These three Linux commands can rescue your files! Suppose that all your Linux
    data files are in `/home/<erwin>/data`. You would type this to go to your data
    directory:


    ```

    `cd /home/<erwin>/data`

    ```


    Then you''d type the following to make sure all the files are there:


    ```

    `ls`

    ```


    Finally, you''d type the following to copy all the data files to your data directory
    in your Windows partition (or copy to a floppy disk, as described later in this
    chapter, if you don''t have or can''t access your Windows partition):


    ```

    `cp * . * /disks/c/data`

    ```


    Sometimes, however, you need more than three commands to get out of a particular
    scrape. Table A-1 lists the essential ones.'
  merge: -1
  img_proc: true
