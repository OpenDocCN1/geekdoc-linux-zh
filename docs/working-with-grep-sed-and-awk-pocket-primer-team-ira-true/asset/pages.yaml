    # Characters and Hexadecimal Numbers


    The awk command works as expected with printable characters and decimal-valued
    numbers. However, there are some considerations involved when working with non-printable
    characters and hexadecimal numbers, as discussed in the following subsections.


    # Non-Printable Characters


    Most of the code samples in this book involve printable ASCII characters, which
    includes uppercase letters, lowercase letters, digits, and punctuation characters.
    In addition, you might encounter non-printable characters in a text file, in which
    case you need special character sequences to match those characters in a regular
    expression. Specifically, use the following:


    +   \t for a tab character (ASCII 0x09)

    \r for a carriage return (0x0D)

    \n for a line feed (0x0A)


    # Hexadecimal Numbers


    A hexadecimal number is specified with the prefix \0x or \x, such as xA for decimal
    10 and \xF for decimal 15. Hence, the number 255 is represented as \xFF.


    Next, the echo and printf commands handle hexadecimal numbers in a different manner,
    as shown here:


    ```

    $ awk ''BEGIN {print "\x61"}''

    a

    $ printf ''\x61'' | awk ''{print}''

    a

    ```'
