    # The passplit() Function


    The split() function involves a separator, whereas the passplit() function matches
    a pattern between separators. The following example invokes the split() function:


    ```

    $ echo ''spicy,food'' | awk ''{n = split($0,a,,/);

    for(i=1;i<=n;i++) print a[i]}''

    spicy

    food

    ```


    By comparison, the following awk command contains the passplit() function:


    ```

    $ echo ''spicy,food'' | awk ''{n = passplit($0,a,[^,]*/);

    for(i=1;i<=n;i++) print a[i]}

    spicy

    food

    ```


