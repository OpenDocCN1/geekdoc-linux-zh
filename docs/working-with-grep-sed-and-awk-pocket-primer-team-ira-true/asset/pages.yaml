    The following code snippets illustrate how to specify sequences of digits and
    sequences of character strings using a short-hand notation that is much simpler
    than specifying every matching digit:


    +   - [0-9] matches a single digit

    - [0-9] [0-9] matches 2 consecutive digits

    - [0-9]{3} matches 3 consecutive digits

    - [0-9]{2,4} matches 2, 3, or 4 consecutive digits

    - [0-9]{5,} matches 5 or more consecutive digits

    - ^[0-9]+$ matches a string consisting solely of digits


    You can define similar patterns using uppercase or lowercase letters that are
    much simpler than explicitly specifying every lowercase letter or every uppercase
    letter:


    +   - [a-z][A-Z] matches a single lowercase letter that is followed by 1 uppercase
    letter

    - [a-zA-Z] matches any uppercase or lowercase letter


    # Working with "^" and "\"


    The purpose of the "^" character depends on its context in a regular expression.
    For example, the following expression matches a text string that starts with a
    digit:


    ```

    ^[0-9]

    ```


    However, the following expression matches a text string that does not start with
    a digit because the "^" metacharacter is at the beginning of an expression in
    square brackets as well as the "^" metacharacter that is to the left (and outside)
    the expression in square brackets (which you learned in a previous note):


    ```

    [^[0-9]

    ```


    Thus, the "^" character inside a pair of matching square brackets ("[\]") negates
    the expression immediately to its right that is also located inside the square
    brackets.


    Other examples involving the backslash metacharacter are here:


    ```

    \H.* matches the string Hello

    H.* matches the string Hello

    \.ell matches the string Hello.

    .ell matches the string Hello

    ```'
