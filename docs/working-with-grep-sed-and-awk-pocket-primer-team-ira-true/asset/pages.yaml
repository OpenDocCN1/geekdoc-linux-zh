    \ one\nparagraph two\nfirst div element\nsecond div element\n\n# The gsub() Function\
    \ and Captured Groups\n\nThe gsub() function extends the gsub() with the ability\
    \ to specify\nregular expressions that \"capture\" portions of a string by means\
    \ of\nparentheses, and then refer to the captured substring by specifying \\N,\n\
    where N can be between 1 and 9 inclusive.\n\nListing 6.20 displays the content\
    \ of gsub1.sh that shows how you\nto capture one or more captured groups via an\
    \ awk command.\n\n# LISTING 6.20: gsub1.sh\n\n```\necho aabbccc | awk '{ print\
    \ gsub(/(a*) (b*) (c*)*/,\\\"\\\\3 2\\\\\\\\\\\\1\\\", \"g\", $1); }'\n#result:\
    \ ccc bba aa\n```\n\n```\necho aabbccc | awk '{ print gsub(/(a*) (b*) (c*)*/,\n\
    \"\\\\\\32Y\\\\\\\\1X\", \"g\", $1); }'\n#result: ccc2bbbyYaa\n```\n\n```\necho\
    \ \"aa bbb ccc\" | awk '{ print gsub(/(a*) (b*) (c*)*/,\n\"\\\\\\3 \\2\\\\\\\\\
    1\", \"g\", $0); }'\n#result: ccc bba aa\n```\n\n```\necho \"aa bbb ccc\" | awk\
    \ '{ print gsub(/(a*) (b*) (c*)*/,\n\"\\\\\\3 \\2\\\\\\\\1\", \"g\", $1); }'\n\
    #result: aa\n```\n\nListing 6.20 contains four awk commands, each of which has\
    \ a string as its\\input. The four awk matches strings that contain the following\n\
    regular expressions:\n\n+   - (a*) (b*) (c*)\n- (a*) (b*) (c*)\n- (a*) (b*) (c*)\n\
    - (a*) (b*) (c*)\n\nIn addition, each awk command displays one of the following\
    \ output\nstrings when there is a matching input string:\n\n```\n\\\\3 \\2\\\\\
    \\\\1\n```"
