    +   - SUBSEP


    +   - IGNORECASE


    The variables FS and RS specify the field separator and record separator, respectively,
    whereas the variables OFS and ORS specify the output field separator and the output
    record separator, respectively. If need be, you can change the value of RS, such
    as text fields where records span multiple lines.


    You can think of the field separators (IFS) as delimiters, whereas the record
    separators behave in a similar way to how sed treats individual lines. For example,
    sed can match or delete a range of lines instead of matching or deleting something
    that matches a regular expression. The default awk record separator is the newline
    character, so by default, awk and sed have similar ability to manipulate and reference
    lines in a text file. In addition, NR contains the number of the currently processed
    record and NF contains the number of fields in the currently processed record.


    Other built-in variables include FILENAME (the name of the file that awk is currently
    reading), FNR (the current record number in the current file), NF (the number
    of fields in the current input), and NR (the number of input records awk has processed
    since the beginning of the program''s execution).


    Consult the online documentation for additional information regarding these (and
    other) arguments for the awk command.


    # How Does the awk Command Work?


    The awk command reads the input files one record at a time (by default, one record
    is one line). If a record matches a pattern (specified by you), then an associated
    action is performed (otherwise no action is performed). If the search pattern
    is not given, awk performs the actions for each record of the input. The default
    behavior if no action is given is to print all the records that match the given
    pattern. Finally, without any action does nothing; i.e., it will not perform the
    default printing operation. Note that statement in actions should be delimited
    by a semicolon.


