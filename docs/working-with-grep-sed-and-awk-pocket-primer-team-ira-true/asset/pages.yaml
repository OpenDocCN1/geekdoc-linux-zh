- img_proc: true
  md: '# WORKING WITH GREP


    This chapter introduces you to the versatile grep command that can process an
    input text stream to generate a desired output text stream. This command also
    works well with other Unix commands. This chapter contains many short code samples
    that illustrate various options of the grep command.


    The first part of this chapter introduces the grep command used in isolation,
    in conjunction with meta characters (such as ^, $, and so forth), and with code
    snippets that illustrate how to use some of the options of grep command. Next,
    you will learn how to match ranges of lines, how to use the back references in
    grep, and how to "escape" meta characters in grep.


    The second part of this chapter shows you how to use the grep command to find
    empty lines and common lines in datasets, as well as the use of keys to match
    rows in datasets. Next, you will learn how to use character classes with the grep
    command, as well as the backslash () character, and how to specify multiple patterns.
    You will learn how to combine the grep command with the find command and the xargs
    command, which is useful for matching a pattern in files that reside in different
    directories. This section contains some examples of common mistakes that people
    make with the grep command.


    The third section briefly discusses the egrep command and the fgrep command, which
    are related commands that provide additional functionality that is unavailable
    in the standard grep utility. The fourth section contains a use case that illustrates
    how to use the grep command to find matching lines that are then merged to create
    a new dataset.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# What is the grep Command?


    The grep ("Global Regular Expression Print") command is useful for finding strings
    in one or more files. Several examples are here:


    +   - grep abc *sh displays all the lines of abc in files with suffix sh.


    +   - grep -i abc *sh is the same as the preceding query, but-insensitive.


    +   - grep -l abc *sh displays all the filenames with suffix sh that contain abc.


    +   - grep -n abc *sh displays all the line numbers of the occurrences of the
    string abc in files with suffix sh.


    You can perform logical AND and OR operations with this syntax:


    +   - grep abc *sh | grep def matches lines containing AND def.


    +   - grep "abc\def" *sh matches lines containing OR def.


    You can combine switches as: the following command displays the names of the files
    that contain the string abc (case insensitive):


    grep -il abc *sh


    In other words, the preceding command matches filenames containing abc, Abc, ABC,
    ABC, abc, and so forth.


    Another (efficient way) to display the lines containing abc (case insensitive)
    is here:


    ```

    cat file|grep abc

    ```


    The preceding command involves two processes, whereas the "grep -l switch instead
    of cat to input the files you want" approach involves a single process. The execution
    time is roughly the same for small text files, but the execution time can become
    more significant if you are working with multiple large files.


    You can combine the sort command, the pipe symbol, and the grep command. For example,
    the following command displays the files with a "Jan" date in increasing size:


    ```

    ls -l |grep Jan | sort -n

    ```


    A sample output from the preceding command is:


    | -rw-r--r-- 1 oswaldcampesato2 staff 3 Sep 27 2022 abc.txt |

    | -rw-r--r-- 1 oswaldcampesato2 staff 6 Jun 21 2022 control.txt |

    | -rw-r--r-- 1 oswaldcampesato2 staff 27 Sep 28 2022 fiblist.txt |'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Meta Characters and the grep Command


    The fundamental building blocks are the regular expressions that match a single
    character. Most characters, including all letters and digits, are regular expressions
    that match themselves. Any meta-character with special meaning may be quoted by
    preceding it with a backslash.


    A regular expression may be followed by one of several repetition operators, as
    shown here:


    +   "." matches any single character.


    +   \?" indicates that the preceding item is optional and will be matched at most
    once: Z? matches Z or ZZ.


    +   \* indicates that the preceding item will be matched zero or more times: Z*
    matches Z, ZZ, ZZZ, and so forth.


    +   \+ indicates that the preceding item will be matched one or more times: Z+
    matches Z, ZZ, ZZZ, and so forth.


    +   \{n\} indicates that the preceding item is matched exactly n times: Z{n} matches
    ZZ.


    +   \{m\} indicates that the preceding item is matched n or more times: Z{m} matches
    Z, ZZ, ZZZ, and so forth.


    +   \{0,m\} indicates that the preceding item is matched at most m times: Z{0,m}
    matches Z, ZZ, ZZZ.


    +   \{n,m\} indicates that the preceding item is matched at least n times, but
    not more m times: Z{n,m} matches ZZ, ZZZ, ZZZ.


    The empty regular expression matches the empty string (i.e., in the input stream
    with no data). Two regular expressions can be joined by the infix operator (|).
    When used in this manner, the infix operator behaves exactly like a logical "OR"
    statement, which directs the grep command to return any line that matches either
    regular expression.


