  md: '# Counting Comments with Regular Expressions


    Listing 6.13 displays the content of comments.txt with various comment style for
    awk, C, and Python. Listing 6.14 displays the content of comments.sh that counts
    the number of comments using different styles.


    # LISTING 6.13: comments.txt


    ```

    # this is an awk and Python style comment

    // this is a C-style comment

    x = 1

    y = 3

    # pound-style comment number two

    // another C-style comment

    # pound-style comment number three

    // a third C-style comment

    """python style comment """

    ```


    # LISTING 6.14: comments.sh


    ```

    awk ''

    BEGIN {

    c_count = 0; awk_count = 0;

    c_count2 = 0; awk_count2 = 0

    PY_count = 0

    }


    if($0 ~ /^\#/) { awk_count++ }

    else if ($0 ~ /\\/\\\/) { c_count++ }

    else if ($0 ~ /\\"\\"/) { py_count++ }

    else if ($0 ~ /^\[.*#\/) { awk_count2++ }

    else if ($0 ~ /^\[.*\\/\\\\/) { c_count2++ }

    END {

    print "C-style comments:",c_count

    print "awk-style comments:",awk_count

    print "C-style comments:",c_count2

    print "awk-style comments:",awk_count2

    print "python-style comments:",PY_count

    }

    comments.txt

    ```


    Listing 6.14 contains an awk variable that starts with a BEGIN block that initializes
    several scalar variables that are used to count the number of occurrences of different
    types of command statements. Listing 6.14 contains the main execution block that
    contains conditional code snippets with the first character in $0, """, #, and
    //, which are comment statements for C, Python, awk, and C again, respectively.
    Each one of the conditional code matches these strings, the corresponding scalar
    variable is incremented.'
