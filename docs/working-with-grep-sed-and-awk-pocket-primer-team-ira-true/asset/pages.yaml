    # Search and Replace with sed


    The previous section showed you how to delete a range of rows of a text file based
    on a start line and end line using either a numeric range or a pair of strings.
    As deleting is just substituting an empty result for what you match, it should
    be clear that a replace activity involves populating that part of the command
    with something that achieves your desired outcome. This section contains various
    examples that illustrate how to get the exact substitution you desire.


    The following examples illustrate how to convert lowercase abc to uppercase ABC
    in sed:


    ```

    $ echo "abc" | sed "s/abc/ABC/"

    ```


    The output of the preceding command is here (which only works on one case of abc):


    ```

    ABC

    echo "abcdefabc" | sed "s/abc/ABC/g"

    ```


    The output of the preceding command is here (/g) means works on every case of
    abc:


    ```

    ABCdefABC

    ```


    The following sed expression performs three consecutive substitutions, -e to string
    them together. It changes exactly one (the first) a to A, one b to B, one c to
    C:


    ```

    $ echo "abcde" | sed -e "s/a/A/" -e "s/b/B/" -e "s/c/C/"

    ```


    The output of the preceding command is here:


    ```

    ABCde

    ```


    Obviously, you can use the following sed expression that combines three substitutions
    into one substitution:


    ```

    $ echo "abcde" | sed "s/abc/ABC/"

    ```'
