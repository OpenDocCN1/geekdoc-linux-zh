  md: "234 • WORKING WITH GREP, SED, AND AWK POCKET PRIMER\n\n# LISTING 6.17: sed_awk.sh\n\
    \nListing 6.17 starts with the cat command directs the contents of the CSV file\
    \ employees.csv to a sed command that removes the first line, and then removes\
    \ the remaining lines to an awk command, which simply increments the scalar variable\
    \ expenses with the contents of $4.\n\nThe final portion of Listing 6.17 is an\
    \ END block that performs the matching of rows as well as the value of the variable\
    \ expenses. Launch the code in Listing 6.17, and you will see the following output:\n\
    \nExpenses for 3 employees: 264.94\n\n# Removing HTML Tags\n\nListing 6.18 displays\
    \ the content of abc.html whose HTML tags are removed by an awk command.\n\n#\
    \ LISTING 6.18: abc.html\n\n```\n<html>\n<body>\n  <paragraph>one</p>\n  <paragraph>two</p>\n\
    \  <div>first div element</div>\n  <div>second div element</div>\n</body>\n</html>\n\
    ```\n\nThe awk command displays a message each time that an HTML tag is encountered\
    \ in the input to the awk command:\n\n```\n$ cat abc.html | awk '{ ($0 ~ /.*</*/)\
    \ { print \"found a tag\" }'\nfound a tag\nfound a tag\nfound a tag\nfound a tag\n\
    found a tag\nfound a tag\nfound a tag\nfound a tag\n```\n\nThe following awk command\
    \ removes all HTML tags as well as all the text:\n\n```\n$ cat abc.html | awk\
    \ '{ gsub(/.*</, \"\", $0); print } '\n```"
