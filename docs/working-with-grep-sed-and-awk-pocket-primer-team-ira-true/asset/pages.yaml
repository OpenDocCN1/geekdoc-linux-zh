    # Convert Strings to Mixed Case in awk


    Suppose we want to capitalize the first letter of each person''s first name. Since
    the first names in employees.csv is already mixed case, let''s convert all letters
    to lowercase using a combination of the tr command and awk, as shown here:


    ```

    $ cat employees.csv | tr [A-Z] [a-z]

