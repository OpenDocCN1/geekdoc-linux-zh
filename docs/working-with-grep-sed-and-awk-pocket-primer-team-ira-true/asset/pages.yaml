    # What is Recursion?


    Recursion-based algorithms can provide elegant solutions to tasks that would be
    difficult to implement via iterative algorithms. For some tasks, such as calculating
    factorial values, the recursive solution and the iterative solution have comparable
    code complexity.


    As simple example, suppose that we want to add the integers from 1 to n (inclusive),
    and let n = 10 so that we have a concrete example. If we denote s as the partial
    sum of successively adding integers, then we have the following:


    ```

    S = 1

    S = S + 2

    S = S + 3

    ...

    S = S + 10

    ```'
