  md: '# 106 WORKING WITH GREP, SED, AND AWK POCKET PRIMER


    However, the following does not work as desired:

    $ echo ''\x61'' | awk ''{print}''

    \x61


    A workaround involves using awk with strtok() and substr() built-in functions,
    as shown here:

    $ printf ''%s\n'' ''\x61'' | awk -n ''{printf "%c\n", strtok(substr($0,3))}''

    a


    The gawk command supports a command switch for processing hexadecimal numbers,
    as shown here:

    $ echo 0x12345678 | gawk --non-decimal-data ''{ printf "%s: %x\n", $1, $1 }''

    0x12345678:


    The awk command, and the gawk command without the preceding command switch, return
    the value 0:

    $ echo 0x12345678 | awk ''{ printf "%s: %x\n", $1, $1 }''

    0x12345678: 0


    $ echo 0x12345678 | gawk ''{ printf "%s: %x\n", $1, $1 }''

    0x12345678: 0


    $ echo 0x12345678 | gawk ''{ printf "%s: x - %x\n", $1, strtonum($1) - strtonum($1)
    }''

    0x12345678: 0 - 12345678


