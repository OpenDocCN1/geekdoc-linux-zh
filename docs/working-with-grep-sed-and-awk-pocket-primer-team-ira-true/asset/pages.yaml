    # Omit the Header Line of a File


    The header line in a text file (if it is present) is the first line, which means
    that the value of the built-in variable NR equals 1. Therefore, the following
    example presents the contents of the CSV file employees.csv without the header
    line:


    ```

    $ awk ''NR>1'' employees.csv

    1000,Jane Jones,12/05/2021,93.55

    2000,John Smith,03/08/2020,87.23

    3000,Dave Stone,07/15/2022,84.16

    ```


    # Display a Range of Lines in a Text File With NR


    You have already seen how to display the contents of a text file, and another
    way to do so is by specifying NR, as shown here:


    ```

    $ awk ''NR'' employees.csv

    ```


    If you want to skip the first 3 rows and display the remaining rows in a text
    file, you can use this:


    ```

    $ awk ''NR > 3'' employees.csv

    2000,John Smith,03/08/2020,87.23

    3000,Dave Stone,07/15/2022,84.16

    ```


    The following snippet is a slightly longer version of the preceding command that
    does the same thing:


    ```

    $ awk ''NR > 3 { print }'' employees.csv

    awk ''/start/,/stop/ {if($0 ~ /stop/) {print}; if($0 ~ /stop/) {printf "%s" "}}''
    file

    ```


