    but not 3a or ba.


    The backreference \n, when n is a single digit, matches the substring previously
    matched by the n parenthesized sub-expression of the regular expression. For example,
    grep ''\a\())\1'' matches aa and grep ''\a\())\2'' matches aaa.


    When used with alternation, if the group does not participate in the match, then
    the backreference makes the whole match fail. For grep ''\a\.)|b1'' does not match
    ba or ab or bb (anything else really).


    If you have more than one regular expression inside a pair of parentheses, they
    are referenced (from left to right) \1, \2, ..., \9:


    ```

    grep -e \[a-z]\]\([0-9]\])\1'' is the same as this command:

    grep -e \[a-z]\]\([0-9]\])\2'' is the same as this command:

    grep -e \[a-z]\]\([0-9]\])\3''

    ```


    The easiest way to think of it is that it is the number (for example, \2) is the
    placeholder or variable that you are typing the longer regular expression it references.
    As regular expressions can become extremely complex, this often helps cope clarity.


    You can match consecutive digits or characters using the pattern \([0-9]\])\1.
    For example, the following command is a successful match because the string 1223
