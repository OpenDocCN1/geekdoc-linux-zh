    # What are Regular Expressions?


    Regular expressions are referred to as REs, regexes, or regex patterns, and they
    enable you to specify expressions that can match specific “parts” of a string.
    For instance, you can define a regular expression to match a single character
    or digit, a telephone number, a zip code, or an email address. You can use metacters
    and character classes (defined in the next section) as part of regular expressions
    to search text documents for specific patterns. As you learn how to use REs, you
    will find other ways to use them, as well.


    # Metacharacters


    The awk command supports a set of metacters, most of which are the same as the
    metacters in other scripting languages such as Perl, as well as programming languages
    as JavaScript and Java. The complete list of metacters in Python is:


    +   ^ $ * + ? { } [ ] \ |


    The meaning of the preceding metacters is here:


    +   ? (matches 0 or 1): the expression a? matches the string aaa

    * (matches 0 or more): the expression a* matches the string aaa (but not baa)

    + (matches 1 or more): the expression a+ matches aaa (but not baa)

    ^ (beginning of line): the expression ^[a] matches the string abc (but not bc)'
