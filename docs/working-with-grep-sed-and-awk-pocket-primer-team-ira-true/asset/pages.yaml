    \ in a line and then the line itself.\n\nLISTING 4.16: field_counts1.sh\n\n```\n\
    # print number of fields\nawk '\n    print \"NF\",NF, $0\n}' variable_lines.txt\n\
    \n#one-line version:\nawk '{ print \"NF\",NF, $0 }' variable_lines.txt\n```\n\n\
    Listing 4.16 contains an awk command that prints the number of fields in each\
    \ row, with the contents of each row. Launch the code in Listing 4.16, and you\
    \ will see the following output:\n\n```\nNF: 4 is a line\nNF: 4 second line is\
    \ here\nNF: 3 new york manhattan\nNF: 3 san francisco downtown\nNF: 4 deep dish\
    \ chicago pizza\nNF: 2 short line\n```\n\nListing 4.17 displays the content of\
    \ field_counts2.sh that illustrates how to print the number of fields in a line\
    \ and then the line itself.\n\nLISTING 4.17: field_counts2.sh\n\n```\nawk '\n\
    BEGIN { arr = \"\"\"; first_count = 0 }\narr[NR] = $0\n\nif( NR == 1) {\n    first_count\
    \ = NF\n    print \"-> Length of first line:\",NF\n}\n\nif(NF == first_count)\
    \ {\n    print \"NR\",matches field count\",first_count\n} else if (NF > first_count)\
    \ {\n    print \"NR\",is longer than\",first_count,\":\",\",NF\n} else {\n   \
    \ print \"Line\",is shorter than\",first_count,\":\",\",NF\n}\nEND {\n    print\
    \ \"-> Initial array:\"\n    for (i=1; i<=NR; i++) {\n        print \"Row\",i,arr[i]\n\
    }\n```"
