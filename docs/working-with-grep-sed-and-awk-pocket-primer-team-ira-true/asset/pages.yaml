    # Binary Search Walkthrough


    Let''s perform a walkthrough of a binary search that searches for an item in a
    sorted array of integers.


    Example #1: item = 25 and arr1 = [10,20,25,40,100], so the midpoint of the array
    is 3. Since arr1[3] == item, the algorithm terminates successfully.


    Example #2: item = 25 and arr1 = [1,5,10, 15, 20, 25, 40], which means the midpoint
    is 4.


    First iteration: Since arr1[4] < item, we search the array [20,25,40]. Second
    iteration: The midpoint is 1, and the corresponding value is 25. Third iteration:
    25 and the array is the single element [25], which matches the item.


    Example #3: item = 25 and arr1 = [10, 20, 25, 40, 100,150], so the midpoint is
    4.


    First iteration: Since arr1[4] > 25, we search the array [10,20,25]. Second iteration:
    The midpoint is 1, and the corresponding value is 20. Third iteration: 25 and
    the array is the single element [25], which matches the item.


    Example #4: item = 25 and arr1 = [1,5,10, 15, 20, 30, 40], so the midpoint is
    4.


    First iteration: Since arr1[4] < 25, we search the array [20,30,40]. Second iteration:
    The midpoint is 1, and the corresponding value is 30. Third iteration: 25 and
    the array is the single element [20], so there is no match.


    As mentioned in the first paragraph of this section, a binary search can be implemented
    with an interactive solution, which is the topic of the next section.


