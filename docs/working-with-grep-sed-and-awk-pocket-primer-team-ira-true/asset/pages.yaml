    The following awk command removes the first digit in an input string:


    ```

    $ echo "1234b5c678" | awk ''{ gsub(/^[0-9]/, "", $0); print }''

    234b5c678

    ```


    The following awk command removes all the initial digits in an input string:


    ```

    $ echo "1234b5c678" | awk ''{ gsub(/^[0-9]+/,, "", $0); print }''

