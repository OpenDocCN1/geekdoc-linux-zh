    # Matching Subgroups with ?, +, * Metacharacters


    You can match a subgroup within a regular expression, which is useful when you
    need to match a two-word sequence, where the first word is the same in all cases.
    Examples of such are “red sunset” and “red planet,” “eat well” and “eat slow.”
    Here is an awk command that contains grouping in a regular expression:


    ```

    $ echo -e "Apple Juice\nPie\nApple Tart\nApple Cake" | awk

    ''/Apple (Juice|Cake)/''

    Apple Juice

    Apple Cake

    ```


