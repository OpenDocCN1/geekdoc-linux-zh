    # CSV Files with Multirow


    This section contains a CSV file with multirow records that that each field is
    on a separate line (e.g., survived:0) instead of comma-separated field values
    for each record.


    The solution is surprisingly simple when we use awk: set RS equal to the string
    pattern that separates records. In our case, we need to set RS equal to \n\n,
    after which $0 will contain the contents of each multiline record. In addition,
    specify FS=''\n'' so that each line is treated as a field (i.e., $1, $2, and so
    forth).


