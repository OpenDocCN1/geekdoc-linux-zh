  md: '# WORKING WITH GREP, SED, AND AWK POCKET PRIMER


    The third step is to invoke awk and check for words that match the regular expression
    ^[a-zA-Z]+, which matches any string consisting of one or more uppercase and lowercase
    letters (and nothing else):


    ```

    ($0 ~ /^[a-zA-Z]+$/) { print $0 }

    ```


    The output from the preceding code snippet is here:


    +   ghi

    abc

    Ghi


    Finally, if you also want to sort the output and print only the unique words,
    redirect the output from the awk command to the sort command and the uniq command.


    The second awk command uses the regular expression ^[0-9]+ to check for integers
    and the third awk command uses the regular expression ^[0-9a-zA-Z]+ to check for
    alphanumeric words. The output of launching 5.29 is here:


    +   Only words:

    Ghi

    abc\ghi


    +   Only integers:

    123


    +   Only alphanumeric words:

    123

    123z

    Ghi

    abc

    ghi


    You can replace the variable x with a dataset to retrieve only alphabetic strings
    from that dataset.


