    # Printing File Contents as a Single Line


    The contents of `test4.txt` are here (note the blank lines):


    abc

    def

    abcabc


    The following code snippet illustrates how to print the contents of `test4.txt`
    as a single line:


    ```

    $ awk "printf("%s", $0)" test4.txt

    ```


    The output of the preceding code snippet is here. See if you can tell what is
    happening before reading the explanation in the next paragraph:


    abcdeffababc


    Explanation: %s is here the record separator syntax for `printf()` with an ending
    quotation mark after it, which means the record separator is the empty field """.
    Our default record separator for `awk` is `/n` (newline), what the `printf` is
    doing is stripping out all the new lines. The blank rows will vanish entirely,
    as all have the new line, so the result is that actual text will be merged together
    with nothing between them. Had we added a space between the %s and the ending
    quotation mark, there would be a space between each character block, plus an extra
    space for each new line.


    Notice how the following comment helps the comprehension of the code snippet:


    ```

    # Merging all text into a single line by removing the new lines

    $ awk "printf("%s", $0))" test4.txt

    ```


