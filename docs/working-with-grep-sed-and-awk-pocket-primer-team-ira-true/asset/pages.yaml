    # Logical Operators in awk


    The logical operators &&, |, and ! represent AND, OR, and NOT, respectively. These
    operators are useful for creating compound expressions to select a subset of the
    rows in a text file that satisfy a set of logical criteria. For example, the following
    code snippet || to exclude rows 2 and 3:


    ```

    $ awk ''NR < 2 || NR > 4'' employees.csv

    emid,full_name,start_date,expenses

    ```


    3000,Dave Stone,07/15/2022,84.16


    The following code snippet && to display only rows 2, 3, and 4:


    ```

    $ awk ''NR > 1 && NR < 5'' employees.csv

    1000,Jane Jones,12/05/2021,93.55

    ```


    2000,John Smith,03/08/2020,87.23


