  md: '# Displaying Only “Pure” Words in a Dataset


    For simplicity, let''s work with a text string and that way we can see the intermediate
    results as we work towards the solution. This example will be familiar from prior
    chapters, but now we see how awk does it.


    Listing 5.29 displays the content of onlywords.sh contains three awk commands
    for displaying the words, integers, and alphanumeric strings in a text file.


    # LISTING 5.29: onlywords.sh


    ```

    x="ghi abc Ghi 123 #def5 123z"


    echo "Only words:"

    echo $x | tr -s '' '' ''\n'' | awk -F " ""

    {

    if($0 ~ /^[a-zA-Z]+$/) { print $0 }

    }

    | sort | uniq

    echo

    ```


    ```

    echo "Only integers:"

    echo $x | tr -s '' '' ''\n'' | awk -F " ""

    {

    if($0 ~ /^[0-9]+$/) { print $0 }

    }

    | sort | uniq

    echo

    ```


    ```

    echo "Only alphanumeric words:"

    echo $x | tr -s '' '' ''\n'' | awk -F " ""

    {

    if($0 ~ /^[0-9a-zA-Z]+$/) { print $0 }

    }

    | sort | uniq

    echo

    ```


    Listing 5.29 starts by initializing the variable x as a space separated of tokens:


    ```

    x="ghi abc Ghi 123 #def5 123z"

    ```


    The next step is to split x into words:


    ```

    echo $x | tr -s '' '' ''\n''

    ```


    The output from the preceding code snippet is shown here:


    ```

    ghi

    abc

    Ghi

    123

    #def5

    123z

    ```'
