    # The grep command and the xargs Command


    The xargs command is often used in conjunction with the grep command in bash.
    For example, you can search for the files under the current directory (including
    subdirectories) that have the sh suffix and check which one of those contains
    the string abc, as shown here:


    ```

    find .print |grep "sh$\" | xargs grep -l abc"

    ```


    A more useful combination of the find and xargs command is shown here:


    ```

    find .mtime -7 -name "*.sh" | xargs grep -l abc

    ```


    The preceding command searches for all the files (including subdirectories) with
    suffix sh that have not been modified in at least seven days, and pipes that to
    the xargs command, which displays the files that contain the string abc (case
    insensitive).


    The find supports many options, which can be combined via AND as well as OR to
    create complex expressions.


    Note that grep -R hello also performs a search for the string hello in all files,
    including subdirectories, and follows the "process" recommendation. The find .print
    command searches for all files in all subdirectories, and you can pipe the output
    to xargs grep hello to find the occurrences of the word hello in all files (which
    involves two processes instead of one process).


    You can use the output of the preceding code snippet to copy the matching files
    to another directory, as shown here:


    ```

    cp `find .print |grep "sh$\" | xargs grep -l abc` /tmp"

