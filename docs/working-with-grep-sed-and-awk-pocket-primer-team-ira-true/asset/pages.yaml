    # Summary


    This chapter started with an explanation of metacharacters and character classes,
    followed by code samples that define regular expressions with digits and letters
    (uppercase as well as lowercase), and also how to use character classes in regular
    expressions. Next, you saw code samples with regular expressions involving metacharacters,
    such as `.` `^` `$` and `[|.-]`. In addition, you learned how to match subsets
    of strings via regular expressions.


    In addition, you saw examples of the built-in `sub()` and `gsub()` functions in
    `awk` to remove digits, characters, and consecutive characters via `awk` commands.
    Then you learned how to split strings with regular expressions, how to define
    dynamic regular expressions, and how to count comments in text fields.


    Furthermore, you saw examples of combining the `grep` and `sed` commands, which
    you learned in Chapter 1 and Chapter 2, with the `awk` command. Finally, you learned
    how to use the `gsub()` command with captured groups.'
