    \ | awk -F'[a-b]' '{print $1, \"x\", $2}'\nx\n```\n\n# Dynamic Regular Expressions\n\
    \nDynamic regular expressions are expressions such as [[[:digit:]] that are evaluated\
    \ and if need, converted to a string. Some dynamic regular expressions are listed\
    \ here:\n\n+   - [[[:digit:]] matches a digit\n\n+   - [[[:alpha:]] matches an\
    \ uppercase or lowercase letter\n\n+   - [[[:alpha:]] matches an alphanumeric\
    \ character\n\n+   - [[[:punct:]] matches a punctuation mark\n\nYou can find additional\
    \ information online: https://support.google.com/a/answer/1371415?hl=en.\n\nListing\
    \ 6.10 displays the content of dynamic_regex1.sh that checks for the occurrence\
    \ of digits in an input string.\n\n# Listing 6.10: dynamic_regex1.sh\n\n```\n\
    echo \"123\" | awk '\nBEGIN {\n  digits_regexp = \"[[:digit:]]+\"\n}\n$0 { print\
    \ }'\n```\n\nListing 6.10 contains an awk command with a BEGIN block that initializes\
    \ the variable digits_regexp as the pattern of one or more digits. The next snippet\
    \ checks whether $0 matches the pattern defined in digits_regexp, and if so, the\
    \ contents of $0 are printed. Launch the code in Listing 6.10, and you will see\
    \ the following output:\n\n```\nabc 123\n```"
