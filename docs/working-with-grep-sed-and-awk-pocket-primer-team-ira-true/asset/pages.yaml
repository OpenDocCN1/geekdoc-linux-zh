    The rand() function gives you a random number. The values of rand() are uniformly-distributed
    between 0 and 1: the value is never 0 and never 1.


    Often, you want random integers instead. Here is a user-defined function you can
    use to obtain a random nonnegative integer less than n:


    ```

    function randint(n) {

    return int(n * rand());

    }

    ```


    The product produces a random number greater than 0 and less than n. We make it
    an integer (using int) between 0 and n - 1.


    Here is an example where a similar function is used to produce random integers
    between 1 and n:


    ```

    awk ''

    # Function to roll a simulated die.

    function roll(n) { return 1 + int(rand()) * n }

    # Roll 3 six-sided dice and print total number of points.

    {

    printf("%d points\n", roll(6)+roll(6)+roll(6))

    ''

    ```


