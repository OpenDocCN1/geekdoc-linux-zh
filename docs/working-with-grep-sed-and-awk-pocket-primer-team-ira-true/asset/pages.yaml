    # Examples Using the sub() Function


    The following command uses the sub() function to replace the first occurrences
    of the letter "a" with ABC:


    ```

    echo aaaabcd | awk ''{ sub(\/a/, "ABC"); print }''

    ABCabcd

    ```


    The following command uses the sub() function to replace multiple occurrences
    of the letter "a" with ABC:


    ```

    echo aaaabcd | awk ''{ sub(\/a+/, "ABC"); print }''

    ABCabcd

    ```'
