  md: '# Insert Blank Lines


    You can print a blank line after each line of a file by changing ORS from the
    default of one new line to two new lines, as shown here:


    ```

    cat columns.txt | awk ''{ ORS="\n\n" } { print $0 }''

    ```


    Alternatively, you can include one or more (or print) statements in the body of
    an awk script, depending on the number of blank lines that you want to appear
    in the output after each input line. In fact, you can use conditional logic to
    print a different number of blank lines after a given input.


    # Remove Blank Lines


    The following code snippet prints lines that are not blank:


    ```

    $ awk ''NF'' employees.csv

