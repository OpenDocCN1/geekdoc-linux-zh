    0 :

    2 : 2000,John Smith,03/08/2020,87.23

    0 :

    2 : 3000,Dave Stone,07/15/2022,84.16

    ```


    The following code snippet specifies "-" as the field delimiter and also prints
    the number of fields in each line:


    ```

    $ awk "-F," ''{print NF, ":$0}'' employees.csv

