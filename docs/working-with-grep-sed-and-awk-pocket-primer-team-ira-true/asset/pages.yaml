    $ (end of line): [c]$ matches the string abc (but not cab)

    . (a single dot): matches any character (except newline)


    Sometimes you need to match the metacharacters themselves rather than their representation,
    which can be done in two ways. The first way involves "escaping" their symbolic
    meaning with the backslash "\" character. Thus, the sequences \?, \*, \+, \$,
    and \ represent the literal characters instead of their symbolic meaning. You
    can also "escape" the backslash character with the sequence "\\\\ If you have
    two consecutive backslash characters, you need an additional backslash for each
    of them, which means that "escaped" sequence for "\\".


    The second way is to list the metacharacters inside a pair of square brackets.
    For example, [+?] treats the two characters ''+'' and ''?'' as literal characters
    instead of metacharacters. The second approach is obviously more compact and less
    prone to error (it is easy to forget a backslash in a long sequence of metacharacters).
    As you might surmise, the methods in the re module support metacharacters.


    > The "^" character is to the left (and outside) of a sequence in square brackets
    (such as [^A-Z]) "anchors" the regular expression to the beginning of a line,
    whereas the "^" character that is the first character inside a pair of square
    brackets negates the regular expression (such as [^A-Z]) inside the square brackets.


    The interpretation of the "^" character in a regular expression depends on its
    location in a regular expression, as shown here:


    +   [a-z]* means any string that starts with any lowercase letter

    [^a-z]* means any string that does not contain any lowercase letters

    [^a-z]* means any string that starts with anything except a lowercase letter

    [^a-z]$$ means a single lowercase letter

    [^[a-z]$]$ means a single character (including digits)


    # Character Sets


    A single digit in base 10 is a number between 0 and 9 inclusive, which is represented
    by the sequence [0-9]. Similarly, a lowercase letter can be any letter between
    a and z, which is represented by the sequence [a-z]. An uppercase letter can be
    any letter between A and Z, which is represented by the sequence [A-Z].


