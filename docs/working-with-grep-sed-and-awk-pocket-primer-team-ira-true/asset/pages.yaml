  md: "The reason is simple: the * meta character performs a greedy match, which means\
    \ it will continue to match beyond the first occurrence of a “>” character. See\
    \ the following site for more information: https://stackoverflow.com/questions/68511098/awk-multiline-greedy-matching-workaround\n\
    \nListing 6.19 displays the content of remove_tags.sh that shows how you disable\
    \ greedy matching to remove the HTML tags and retain the text.\n\n# LISTING 6.19:\
    \ remove_tags.sh\n\n```\nawk '\n  #disable greedy match for \"*\"\n  gsub(/[^<>]*/>,\
    \ \"\", $0); print\n' abc.html\n```\n\nListing 6.19 contains an awk command that\
    \ invokes gsub built-in function to remove any text that matches the pattern [<^]*.\
    \ This pattern will match text that consists of the following parts:\n\n+   1.\
    \ the character “<\"\n2. followed by any character except the “>” character\n\
    3. followed by zero or more occurrences of anything other than “>\n4. followed\
    \ by a “>” character\n\nFor example, the HTML tags <HTML>, <BODY>, <html>, <body>,\
    \ and <p> match the regular expression [<^]*. Launch the code, and you will see\
    \ the following output:\n\n```\nparagraph one\nparagraph two\nfirst div element\n\
    second div element\n```\n\nHowever, the removal of the four <html> and <body>\
    \ HTML tags results in blank lines, which we can remove as follows:\n\n```\n./remove_tags.sh\
    \ | sed '/^\\s$/d'\n```\n\nThe preceding command generates the following output:\n\
    \n```\nparagraph one\nparagraph two\nfirst div element\nsecond div element\n```"
  merge: -1
  pgno: 251
