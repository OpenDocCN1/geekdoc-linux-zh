    Use the srand(x) function to set the starting point, or seed, for generating random
    numbers to the value x. Each seed leads to a particular sequence of "random” numbers.
    Thus, if you set the seed to the same value a second time, you will get the same
    sequence of "random” again. If you omit the argument x, as in srand(), then the
    current date and time of day are used for a seed.


    This is how to obtain numbers that are unpredictable. The return value of srand()
    is the previous seed. This makes it easy to keep track of the seeds for use in
    consistently reproducing sequences of random numbers.


