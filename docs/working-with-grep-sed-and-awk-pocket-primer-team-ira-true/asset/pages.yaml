  md: '# REGULAR Expressions


    The following awk command removes metacharacters in an input string:


    ```

    $ echo "a@b#?c$d^\

    ```


    Now compare the result of the following awk command that omits the square brackets
    with the preceding awk command that includes the square brackets:


    ```

    echo "a@b#?c$d^" | awk ''{ gsub(/@#?$^]/, "", $0); print }''

    a@b#?c$d^

    ```


    # Removing Spaces in Text Fields


    The following awk command uses the gsub function to replace the space between
    first and last names with a hyphen:


    ```

    $ awk -F,\

    ```


    If there are multiple spaces between first name and last names, use the following
    modification of the preceding awk command:


    ```

    $ awk -F,\

    ```


    # Splitting Strings with Regular Expressions


    The following awk command splits an input string by specifying the letter "a"
    as the delimiter:


    ```

    $ echo "abcdef" | awk -F''a'' ''{print $1, "x", $2}''

    x bcdef

    ```


    The following awk command splits an input string by specifying the letter "a*"
    as the delimiter for a string that contains multiple consecutive occurrences of
    the letter "a":


    ```

    $ echo "aaabcdef" | awk -F''a'' ''{print $1, "x", $2}''

    x

    ```


    The following awk command splits an input string by specifying the regular expression
    "a*" as the delimiter:


    ```

    $ echo "abcdef" | awk -F''a*'' ''{print $1, "x", $2}''

    x bcdef

    ```


    The following awk command splits an input string by specifying the letters "bc"
    as the delimiter:


    ```

    $ echo "abcdef" | awk -F''cd'' ''{print $1, "x", $2}''

    ab x ef

    ```'
