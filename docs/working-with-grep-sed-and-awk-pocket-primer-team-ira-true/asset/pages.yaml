    # Matching with ?, +, or * Metacharacters


    The metacharacter “?” matches 0 or 1 occurrences, whereas the metacharacter “+”
    matches 1 or more occurrences, and finally, the metacharacter “*” matches 0 or
    more occurrences.


    You might think that the metacharacter “?” has limited value, but it is actually
    useful in some situations. For example, you can use the metacharacter “?” to match
    0 or 1 occurrences of a letter in a word, which is useful for words that have
    slightly different spellings, either “color” and “colour,” “favor” and “favour,”
    “traveled” and “travelled,” depending on whether you are using the US (for the
    former spelling) or UK (for the latter spelling) form of the word.


    As another example, you can use a metacharacter to match US postal codes, which
    have two potential patterns: either (\d) {5}, which matches five adjacent digits,
    or (\d) {5}-(\d){4}. If you want one regular expression to handle both patterns,
    you can use either of the following regular expressions:


    +   - (\d) {5} (\d) {4}

    - (\d) {5}-(\d){4}


    The first regular expression uses the “|” metacharacter to specify both postal
    code patterns, and the second regular expression uses the “?” metacharacter, which
    makes the second expression optional, in which the regular expression “reduces”
    to (\d) {5}.


    The following awk command uses the “?” metacharacter to match multiple strings:


    The following example matches Colour as well as Color. We have made u an optional
    character by ?.


    ```

    $ -e "Colour\nColor" | awk /Colou?r/

    ```


    On executing this code, you get the following result:


    Colour

    Color'
