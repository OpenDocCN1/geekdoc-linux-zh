  md: '# PREFACE


    # WHAT IS THE GOAL?


    The goal of this book is to introduce readers to three powerful command line utilities
    that can be combined to create simple yet powerful scripts for performing a multitude
    of tasks. The code samples and scripts use the bash shell, and typically involve
    small text files, so you can focus on understanding the features of grep, sed,
    and awk. Aimed at a reader new to working in a bash environment, the book is comprehensive
    enough to be a good reference and teaches new tricks to those who already have
    some experience with these command line utilities.


    This book takes introductory concepts and demonstrates their use in simple yet
    powerful scripts. Keep in mind that this book does not cover “pure” system administration
    functionality.


    # IS THIS BOOK IS FOR ME AND WHAT WILL I LEARN?


    This book is intended for general users as well as anyone who wants to perform
    a variety of tasks from the command line.


    You will acquire an understanding of how to use grep, sed, and awk functionality
    is discussed in the first five chapters. Chapter 1 introduces the grep command,
    Chapter 2 introduces the sed command, and Chapters 3 through 5 discuss the awk
    command. The sixth and final chapter introduces you to regular expressions.


    This book saves you the time required to search for relevant code samples, adapting
    them to your specific needs, which is a potentially time-consuming process.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# HOW WERE THE CODE SAMPLES CREATED?


    The code samples in this book were created and tested bash on a MacBook Pro with
    OS X 10.15.7 (macOS Catalina). Regarding their content: the code samples are derived
    primarily from scripts prepared by the author, and in some cases, there are code
    samples that incorporate short sections of code from discussions in online forums.
    The key point to remember is that the code samples follow the "Four Cs": they
    must be Clear, Concise, Complete, and Correct to the extent that it is possible
    to do so, given the size of this book.


    # WHAT YOU NEED TO KNOW FOR THIS BOOK


    You need some familiarity with working from the command line in a Unix-like environment.
    However, there are subjective prerequisites, as a desire to learn shell programming,
    along with the motivation and discipline to read and understand the code samples.
    In any case, if you are not sure or not you can absorb the material in this book,
    glance through the code samples to get a feel for the level of complexity.


    # HOW DO I SET UP A COMMAND SHELL?


    If you are a Mac user, there are three ways to do so. The first method is to use
    Finder to navigate to Applications > Utilities and double-click on the Utilities
    application. Next, if you already have a command shell available, you can launch
    a new command shell by typing the following command:


    ```

    open /Applications/Utilities/Terminal.app

    ```


    A second method for Mac users is to open a new command shell on a MacBook that
    is already visible simply by clicking command+n in that command shell, and your
    Mac will launch another command shell.


    If you are a PC user, you can install Cygwin (open source https://cygwin.com/)
    that simulates bash commands or use another toolkit like MKS (a commercial product).
    Please read the online documentation that describes the download and installation
    process.


    If you use RStudio, you need to launch a command shell inside RStudio by navigating
    to Tools > Command Line, and then you can launch bash commands. Note that command
    aliases are not automatically set if they are defined in a file other than the
    main start-up file (such as .bash_login).'
  merge: -1
  pgno: 14
