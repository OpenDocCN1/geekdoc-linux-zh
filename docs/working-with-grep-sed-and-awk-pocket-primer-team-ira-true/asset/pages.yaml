    can “feed” it data from another command if that other command adds value (such
    as adding line numbers, removing blank lines, or other similar activities).


    The -n option suppresses all output, and the p option prints the matching line.
    If you omit the -n option every line is printed, and the p option causes the matching
    line to be printed again. Hence, if you issue the following command,


    ```

    sed "/3/p" numbers.txt

