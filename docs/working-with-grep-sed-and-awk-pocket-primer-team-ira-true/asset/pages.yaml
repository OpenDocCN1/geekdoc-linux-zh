  md: "# LISTING 5.35: multi_line_rows.sh\n\n```\nfilename=\"multi_line_rows.csv\"\
    \ncat $filename | awk '\nBEGIN { RS=\"\\n\\n\"; FS=\"\\n\\n\" }\n  # name/value\
    \ pairs have this format:\n  # survived:0 pclass:3 sex:male age:22.0\n  split($1,arr,\"\
    :\"); printf(\"%s,\\n\",arr[2]);\n  split($2,arr,\":\"); printf(\"%s,\\n\",arr[2]);\n\
    \  split($3,arr,\":\"); printf(\"%s,\\n\",arr[2]);\n  split($4,arr,\":\"); printf(\"\
    %s\\n\",arr[2]);\n}'\n```\n\nThe main idea in Listing 5.35 is shown in bold, which\
    \ specifies the value of RS (record separator) as two consecutive linebreak characters\
    \ and specifies FS (field separator) as a linefeed character. The main block of\
    \ code splits the $1, $2, $3, and $4 by a colon (\":\") separator, and prints\
    \ the second field, which is the actual data value.\n\nNote that arr[1] contains\
    \ the name of the fields, such as survived, pclass, sex, or age, whereas arr contains\
    \ the value of the fields. Launch the code in Listing 5.35, and you will see the\
    \ following output:\n\n0,male,22.0\n1,female,38.0\n0,male,35.0\n1,female,27.0\n\
    \nThere is one more detail: Listing 5.35 does not display the header with the\
    \ names of the fields. Listing 5.36 shows you how to modify Listing 5.34 to generate\
    \ the header line.\n\n# LISTING 5.36: multi_line_rows2.sh\n\n```\nfilename=\"\
    multi_line_rows.csv\"\ncat $filename | awk '\nBEGIN { RS=\"\\n\\n\"; FS=\"\\n\\\
    n\"; count=0 }\n  if(count == 0) {\n  count += 1\n  split($1,arr,\":\"); header\
    \ = header \",\" arr[1]\n  split($2,arr,\":\"); header = header \",\" arr[1]\n\
    \  split($3,arr,\":\"); header = header \",\" arr[1]\n  split($4,arr,\":\"); header\
    \ = header \",\" arr[1]\n  print header\n}\n  # name/value pairs have this format:\n\
    \  # survived:0 pclass:3 sex:male age:22.0\n  split($1,arr,\":\"); printf(\"%s,\\\
    n\",arr[2]);\n  split($2,arr,\":\"); printf(\"%s,\\n\",arr[2]);\n```"
