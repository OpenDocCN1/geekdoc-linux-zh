  md: 'In the prior command, you instructed sed to substitute ("s) the first text
    pattern (/abc) with the second pattern (/def) and no further instructons (/).


    Deleting a text pattern is simply a matter of leaving the second pattern empty:


    $ echo "abcdefabc" | sed "s/abc//"


    The result is here:

    defababc


    As you see, this only removes the first occurrence of the pattern. You can remove
    all the occurrences of the pattern by adding the "global" terminal instruction
    (/g\):


    $ echo "abcdefabc" | sed "s/abc//g"

    The result of the preceding command is here:


    def


    Note that we are operating directly on the main stream with this command, as we
    are not using the -n tag. You can also suppress the main stream with -n and print
    the substitution, achieving the same output if you use the terminal p (print)
    instruction:


    $ echo "abcdefabc" | sed -n "s/abc//gp"

    def


    For substitutions, either syntax will do, but that is not always true of other
