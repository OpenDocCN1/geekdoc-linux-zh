    # Uniformity of Data Values


    An example of uniformity of data involves verifying that the data in a given feature
    contains the same data units measure. For example, the following set of values
    have numeric values that are in a narrow range, but the units of measure are incorrect:


    ```

    50mph

    50kph

    100mph

    20kph

    ```


    Listing 4.41 displays the content of same_units.sh that illustrates how to ensure
    that items in a set of strings have the same unit of measure.


    # LISTING 4.41: same_units.sh


    ```

    strings="120kph 100mph 50kph"

    new_unit="fps"


    for x in `echo $strings`;

    do

    number=`echo $x | tr -d [A-Z]`

    unit=`echo $x | tr -d [0-9]`

    initial=`$x`

    new_num=`${number}${new_unit}`

    echo "new_num: $new_num"

    echo

    done

    ```


    Listing 4.41 starts by initializing the variables strings and new_unit, followed
    by a for loop that iterates through each string in the strings variable. During
    each iteration, the variables number and unit are initialized with the characters
    and digits, respectively, in the current string represented by the loop variable
    x.


    Next, the variable new_num is initialized as the concatenation of the contents
    of number and new_unit. Launch the code in Listing 4.41, and you will see the
    following output:


    ```

    initial: 120kph

    new_num: 120fps

    ```'
