    # The awk Command


    The awk (Aho, Weinberger, and Kernighan) command has a C-like syntax and you can
    use this to perform very complex operations on numbers and text strings.


    As a side comment, there is also the gawk command (that is, GNU awk), as well
    as the nawk command (“new” awk), but neither command is discussed in this book.
    One advantage of nawk is that it allows you to set externally the value of an
    input variable.


    You can find The One True Awk, which is the awk written by Aho, Weinberger, and
    Kernighan, on GitHub:


    ```

    https://github.com/onetrueawk/awk

    ```


    # Launching awk Commands and File Extensions


    The awk command allows you to execute awk-based scripts in several ways, with
    several similar (yet different) ways in which commands cannot be executed. Many
    awk-based code samples in this book specify an input file, which is described
    in a later section.


    However, there are also awk scripts that do not involve an input file, such as
    an awk script that calculates arithmetic sums or geometric sums. Specifically,
    the following will not work from the command line:


    ```

    awk ''{print "hello" }''

    ```


    However, this works:


    ```

    echo " | awk ''{print "hello" }''

    ```'
