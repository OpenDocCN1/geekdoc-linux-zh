    # Generic Character Classes


    This section contains character classes that you will encounter in other programming
    languages, such as Python and JavaScript. Some convenient character sequences
    that express patterns of digits and letters:


    +   \d matches a single digit

    \w matches a single character (digit or letter)

    \s matches a single whitespace (space, newline, return, or a tab)

    \b matches a boundary between a word and a non-word

    \n, \r represent a newline, a return, and respectively

    "escapes" any character


    Based on the preceding definitions, \d+ matches one or more digits and \w+ matches
    one or more characters, both of which are more compact expressions using character
    sets. In addition, we can reformulate the expressions in the previous section:


    \d is the same as [0-9] and \D is the same as [0-9]

    \s is the same as [\t\n\r\f\v] and it matches any non-whitespace character, \S
    is the opposite ([^\t\n\r\f\v])

    \w is the same as [a-zA-Z0-9_] and it matches any alphanumeric character, \W is
    the opposite ([^a-zA-Z0-9_])


    Another useful feature is the ability to specify the minimum, maximum, or range
    of occurrences of a character, as shown in the following examples:


    +   \d(2) is the same as [0-9] {0-9}

    \d(3) is the same as [0-9] {3}

    \d(2,4) is the same as [0-9] {2,4}'
