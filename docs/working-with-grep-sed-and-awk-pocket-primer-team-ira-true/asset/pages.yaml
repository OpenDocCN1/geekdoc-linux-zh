    ```


    The following awk command counts the number of lines that start with one or more
    digits, followed by a comma, and followed by the J:


    ```

    $ awk ''/^[0-9]+,J/ { count=1 } END { print "Rows starting with a J in the second
    field:", count } employees.csv

    Rows starting with a J in the second field: 2

    ```


