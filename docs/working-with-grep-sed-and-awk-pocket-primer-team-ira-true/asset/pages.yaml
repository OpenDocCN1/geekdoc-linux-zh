    output from the preceding command is the content of employees csv. The digit 1
    can be replaced by any positive value (including floating point numbers) and the
    result is the same. If you replace 1 with 0, then nothing is printed. If you replace
    1 with a negative number, you will see a list of command line switches for the
    awk command.'
