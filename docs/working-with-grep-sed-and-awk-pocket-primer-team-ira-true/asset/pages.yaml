    Basic stream output :123

    Pattern Matched text:123

    Basic stream output :3

    Pattern Matched text:3

    Basic stream output :five

    Basic stream output :4

    ```


    It is also possible to match two patterns and print everything between the lines
    that match:


    ```

    sed -n "/123/,/five/p" numbers.txt

    ```


    The output of the preceding command (all lines between 123 and five, inclusive)
