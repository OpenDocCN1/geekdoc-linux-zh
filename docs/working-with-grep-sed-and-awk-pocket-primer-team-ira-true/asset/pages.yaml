    \ 3.24: if-else.sh\n\n```\necho \"\" | awk\nBEGIN { x = 10 }\n{\n  if (x % 2 ==\
    \ 0) {\n    print \"x is even\"\n  }\n  else {\n    print \"x is odd\"\n  }\n\
    }\n```\n\n# The break, continue, and new Keywords in awk\n\nThe following code\
    \ snippet illustrates how to use next and continue in a for loop in awk:\n\n```\n\
    awk '\n{\n/expression1/ { var = 5; next }\n/expression2/ { var2 = 7; next }\n\
    /expression3/ { continue }\n// some other code block\nsomefile\n```\n\nWhen the\
    \ current line matches expression1, var1 is assigned the value 5 and awk reads\
    \ the next input line: hence, expression2 and expression3 will not be tested.\
    \ If expression1 does not match and expression2 does match, then var2 is assigned\
    \ the value 7 and then awk will read the next input line. If only expression3\
    \ results in a positive match, then awk skips the remaining block of code and\
    \ processes the next input line.\n\nListing 3.25 displays the contents of next_lines.txt,\
    \ and Listing 3.26 displays the content of next_lines.sh that illustrates the\
    \ effect of the next keyword in an awk command."
