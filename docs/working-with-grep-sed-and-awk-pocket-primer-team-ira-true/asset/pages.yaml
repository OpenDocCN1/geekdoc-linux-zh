    ```

    Male,19,190,0

    Male,19,190,0

    Male,15,180,0

    Male,15,180,0

    Female,16,150,0

    Female,16,150,0

    Female,17,170,0

    Female,17,170,0

    Male,19,160,0

    Male,19,160,0

    ```


    # LISTING 4.39: remove-duplicates.sh


    ```

    filename1="duplicates.csv"

    filename2="no_duplicates.csv"

    ```


    ```

    cat $filename1 | sort | uniq > $filename2

    ```


    Listing 4.39 is straightforward: after initializing the variables filename1 and
    filename2 with the names of the input and output files, the only remaining code
    snippet contains the Unix pipe ("|") with a sequence of commands.


    The left-most sort command displays the contents of the input file, which is redirected
    to the sort. The result of the sort command is redirected to the uniq command,
    which removes duplicate rows, and this result set is redirected to the file specified
    in the variable filename2.


    Keep in mind that the sort followed by uniq command is required; this is how the
    uniq command can remove adjacent duplicate rows. Launch the code in Listing 4.39,
    and you will see the output that is displayed in Listing 4.40.'
