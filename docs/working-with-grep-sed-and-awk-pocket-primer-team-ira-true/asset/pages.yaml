  md: '# 28 WORKING GREP, SED, AND AWK POCKET PRIMER


    text editor. The sed command is a "non-interactive" stream-oriented editor that
    can be used to automate editing via shell scripts. This ability to modify an entire
    stream of data (which can be the contents of multiple files, in a manner similar
    to how grep behaves) as if you were inside an editor (It is not common in modern
    programming languages). This behavior allows some capabilities not easily duplicated
    elsewhere, while behaving exactly like any other command (grep, cat, ls, find,
    and so forth) in how it can accept data, output data, and pattern match with regular
    expressions.


    Some of the most common uses for sed include print matching lines, delete matching
    lines, and find/replace matching strings or regular expressions.


    # The sed Execution Cycle


    Whenever you invoke the sed command, an execution cycle refers to various options
    that are specified and executed until the end of the file/input is reached. Specifically,
    an execution cycle performs the following steps:


    +   - Reads an entire line from stdin/file.

    - Removes any trailing newline.

    - Places the line in its pattern buffer.

    - Modifies the pattern buffer according to the supplied commands.

    - Prints the pattern buffer to stdout.


    # Matching String Patterns Using sed


    The sed command requires you to specify a string to match the lines in a file.
    For example, suppose the file numbers.txt contains the following lines:


    ```

    1

    2

    123

    3

    five

    4

    ```


    The following sed command prints all the lines that contain the string 3:

    cat numbers.txt |sed -n "3/p"


    Another way to produce the same result is as follows:


    ```

    sed -n "3/p" numbers.txt

    ```'
