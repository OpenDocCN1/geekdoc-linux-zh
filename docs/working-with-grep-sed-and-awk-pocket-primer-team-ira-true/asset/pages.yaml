    # Geometric Series


    This section shows you how to calculate the geometric series of a set of positive
    integers, such as the numbers from 1 to n, inclusive. The first algorithm uses
    an iterative approach and the second algorithm uses recursion.


    Before delving into the code samples, there is a simple way to calculate the closed
    form sum of the geometric series of integers from 1 to n, where r is the ratio
    of consecutive terms in the geometric series. Let s denote the sum, which we can
    express as:


    ```

    S = 1+ r + r^2 + r^3 + . + r^(n-1) + r^n

    r*S = r + r^2 + r^3 + . + r^(n-1) + r^n + r^(n+1)

    ```


    Now subtract each term in the second row from the corresponding term in the first
    row, and we have the following:


    ```

    S - r*S = 1 - r^(n+1)

    ```


    Factors s from both terms on the left side of the preceding equation, and we obtain
    the following result:


    ```

    S*(1 - r) = 1 - r^(n+1)

    ```'
