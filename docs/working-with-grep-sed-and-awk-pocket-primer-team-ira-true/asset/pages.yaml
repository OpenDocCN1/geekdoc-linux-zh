  md: "# 228 • WORKING WITH GREP, SED, AND AWK POCKET PRIMER\n\nThe following awk\
    \ command removes the lowercase letters and the uppercase letters in an input\
    \ string:\n\n```\n$ echo \"ABC1b2c3XYZ\" | awk '{ gsub(/[a-zZ]/)/, \"\", $0);\
    \ print }' \n123\n```\n\n# Removing Consecutive Characters with gsub() Function\n\
    \nThe examples in an earlier section show how to remove a single uppercase or\
    \ lowercase letter, as well as all uppercase and lowercase letters. However, you\
    \ might need to remove only consecutive uppercase (or lowercase characters) instead\
    \ of all occurrences of such characters. For example, the following awk command\
    \ removes two consecutive uppercase letters in an input string:\n\n```\n$ echo\
    \ \"ABC1b2c3XYZ\" | awk '{ gsub(/[A-Z]{2}/, \"\", $0); print }' \nCalc2c3z\n```\n\
    \nThe following command removes the initial occurrence of three consecutive digits\
    \ (1, 2, and 3) that are followed by one or more lowercase letters in an input\
    \ string:\n\n```\n$ echo \"123a4b5c678\" | awk '{ gsub(/123[a-z]+/,)/, \"\", $0);\
    \ print }' \n4b5c678\n```\n\n# Removing Complements of Strings with the gsub()\
    \ Function\n\nThe following awk command removes the everything except the digits\
    \ 1, 2, and 3 in an input string:\n\n```\n$ echo \"123a4b5c678\" | awk '{ gsub(/^123]/)/,\
    \ \"\", $0); print }' \n123\n```\n\nKeep in mind that the occurrence of the \"\
    ^\" metacharacter inside a pair of brackets is different from outside a pair of\
    \ brackets. For example, the following awk command removes any character that\
    \ does not start with any of the digits 1, 2, and 3 in an input string:\n\n```\n\
    $ echo \"123a4b5c678\" | awk '{ gsub(/[^123]/)/, \"\", $0); print }' \n123a4b5c678\n\
    ```\n\nThe following awk command removes the trailing character that matches any\
    \ of the digits 6, 7, and 8 in an input string:\n\n```\n$ echo \"123a4b5c678\"\
    \ | awk '{ gsub(/[678]$/)/, \"\", $0); print }' \n123a4b5c67\n```\n\n# Removing\
    \ Metacharacters with the gsub() Function\n\nThe following awk command removes\
    \ the $ metacharacter in an input string:\n\n```\n$ echo \"?ab?c?\" | awk '{ gsub(/\\\
    $/)/, \"\", $0); print }' \nabc\n```"
  merge: -1
