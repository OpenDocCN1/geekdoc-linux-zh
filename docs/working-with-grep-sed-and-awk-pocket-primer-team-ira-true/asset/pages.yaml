  md: '# WORKING WITH GREP, SED, AND AWK POCKET PRIMER


    The egrep ("extended grep") command supports extended regular expressions, as
    the pipe (|) to specify multiple words in a search pattern. A match is successful
    if any of the words in the search pattern appears, you can think of the search
    pattern as “any” match. Thus, the pattern `abc|def` matches lines that contain
    either abc or def (or both).


    For example, the following code snippet enables you to search for occurrences
    of the string abc as well as occurrences the string def in all lines with the
    suffix sh:


    ```

    egrep -w ''abc|def'' *sh

    ```


    The preceding egrep command is an “or” operation: a line matches if it contains
    either abc or def.


    You can also use metacharacters in grep expressions. For example, the following
    code snippet matches lines that start with abc or end with four and a whitespace:


    ```

    egrep ''^123|four $'' columns3.txt

    ```


    A more detailed explanation of grep, egrep, grep is online: https://superuser.com/questions/508881/what-is-the-difference-between-grep-pgrep-pgreprep


    # Displaying “Pure” Words in a Dataset with egrep


    For simplicity, let''s work with a text string and that we can see the intermediate
    results as we work towards the solution. Let’s initialize the variable x as shown
    here:


    ```

    x="ghi abc Ghi 123 #def5 123z"

    ```


    The first step is to split x into words:


    ```

    echo $x |tr -s '' '' ''\n''

    ```


    The output is here:


    ```

    ghi

    abc

    Ghi

    123

    #def5

    123z

    ```


    The second step is to invoke egrep with the regular expression ^[a-zA-Z]+, which
    matches any string consisting of one or more uppercase and lowercase letters (and
    nothing else):


    ```

    echo $x |tr -s '' '' ''\n'' |egrep "^[a-zA-Z]+$"

    ```'
