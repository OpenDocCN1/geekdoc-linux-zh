    # Character Classes


    Character classes are convenient expressions that are shorter and simpler than
    their “bare” counterparts that you saw in the previous section. There are character
    classes that are supported in programming languages such as Perl, Python, and
    JavaScript (discussed in the first subsection) and there are character classes
    that are supported in awk.


    For example, the character class \d represents a single (base 10) digit, which
    is supported in the first group of programming languages. However, [:digit:] matches
    a single (base 10) digit in awk. Similar comments apply to character classes such
    as \D, \w, and \W.


    # POSIX Character Classes


    POSIX classes differ from regular expression character classes that we have discussed
    in the previous chapters in this book. POSIX classes use a string to define a
    class, which is probably more intuitive than the backlash style that you will
    see in regular expressions in other languages such as JavaScript and Java. For
    example, POSIX uses [[:digit:]] to specify a digit of [0-9] or \d to represent
    a digit in regular expressions. In addition, the POSIX standard defines 12 character
    classes, some of which are listed here:


    +   * [:alpha:] Alphabetic characters

    * [:alnum:] Alphabetic characters and digits

    * [:digit:] Digits

    * [:xdigit:] Hexadecimal digits

    * [:blank:] Space and Tab

    * [:cntrl:] Control characters


    For example, the following awk commands work with IPv4 addresses with a regular
    expression that uses POSIX character classes:


    ```

    $ echo "192.168.10.13" |awk -F"" ''^[[:digit:]]+/{ print $1 }''

    #192

    ```


    ```

    $ echo "ABC.168.10.13" |awk -F"" ''^[[:alnum:]]+/{ print $1 }''

    #ABC

    ```


