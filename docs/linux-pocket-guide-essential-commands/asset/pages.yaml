  md: '# RAID Arrays for Redundancy


    mdadm Manage RAID arrays.


    RAID (Redundant Array of Independent Disks) is a technique that distributes a
    computer''s data across multiple disks, transparently, while acting like a single
    disk. Usually, RAID is for redundancy—if one disk dies, your files are still intact.
    Other types of RAID increase the performance of storage.


    A bunch of disks in a RAID arrangement is called a RAID array. The type of RAID,
    called the RAID level, determines how many drive failures the array can tolerate
    and still guarantee the data''s safety. Some standard RAID levels are RAID-0,
    RAID-1, RAID-5, RAID-10, and others you can explore on the web.


    Let''s create a minimal RAID-1 array using the most common RAID software for Linux,
    mdadm. RAID-1 adds redundancy simply by mirroring data from one drive to the others
    in the array. As long as one drive is operating, the data is safe. For this example,
    I start with two disks, /dev/sdf and /dev/sdg, each of which has a 10 GB partition,
    /dev/sdf1 and /dev/sdg1. The steps I show are largely the same for other RAID
    levels and additional devices. For full details, visit the Linux Raid Wiki.


    > WARNING


    RAID operations can wipe out filesystems without confirmation. Practice the commands
    on spare drives or a virtual machine for safety.


    # Create a RAID Array


    First, show that no RAID setup exists yet:


    +   - cat /proc/mdstat Personalities : No RAID types listed


    Create the RAID-1 array /dev/md1, from the two partitions:'
