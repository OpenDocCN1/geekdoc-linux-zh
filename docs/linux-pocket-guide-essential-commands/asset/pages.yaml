    # # Installing Software from Source Code


    configure Prepare to build software manually with make.

    make Build software from source code.


    Package managers, described in “Installing Software Packages on page 195, generally
    require superuser privileges to install software. As an ordinary user, you can
    also install software within your home directory. The process requires more steps
    and more understanding than using a package manager.


    # # Downloading the Source Code


    Plenty of Linux software is distributed as source code to be downloaded and built
    on your local system. The two most common forms of distribution are:


    +   - Compressed TAR or ZIP files found on websites

    - Git repositories, cloned from servers like GitHub


    I briefly explain each and then show how to build the source code with the commands
    configure and make.


    # # Method 1: Download and unpack a TAR or ZIP file


    A compressed TAR file, “tarball,” is just a collection of files packed up by tar.
    The file is usually compressed with gzip and has the filename extension .tar.gz
    or .tgz, or bzip2 with the extension .tar.bz2 or .tbz. Similarly, a .zip file
    is a collection of files packed by zip. To unpack files:'
