    To use of any Linux system, you must become comfortable with Linux files and directories
    (a.k.a. folders), collectively called the filesystem. On a graphical desktop,
    files and directories are obvious on screen. In a command-line interface like
    the Linux shell, the same files and directories are still present but less visible,
    so at times you must remember which directory you are “in” and how it relates
    to other directories. You’ll use shell commands like cd (change directory) to
    move between directories, and commands like pwd (print working directory) to keep
    track of where you are in the filesystem.


    Let’s cover some terminology. Linux files are collected into directories. The
    directories form a hierarchy, or tree, as in Figure 1-3. One directory may contain
    other directories, called subdirectories, which may themselves contain other files
    and subdirectories, and so on, into infinity. The topmost directory is called
    the root directory and is denoted by a slash (/).⁴


