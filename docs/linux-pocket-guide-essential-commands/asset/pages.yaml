- img_proc: true
  md: '# WARNING


    Protect all files in /etc/postfix. Keep the files sasl_passwd and sasl_passwd.db
    readable only by root (mode 0600) because they contain passwords.


    Postfix usually runs automatically, but you can start and stop it by hand:


    +   - sudo postfix start Run the server

    - sudo postfix status Check that the server is running

    - sudo postfix stop Halt the server gracefully

    - sudo postfix abort Kill the server ungracefully


    After a mail delivery problem, to deliver all queued mail immediately, run:


    +   - sudo postfix flush


    For more information on Postfix, visit postfix.org.


    # Nullmailer: Simple Outgoing Email


    Postfix is complicated. A simpler solution is to forward your local host''s email
    to another mail server for delivery. (You''ll need an account on the remote mail
    server.) This is called setting up a relay-only mail server.


    Suppose you have an account “smith” on a Linux host example.com, and you want
    to configure that host to send email. You also have an account “sandy” on a remote
    server, mail.example.com, that already runs Postfix for delivering mail. Install
    Nullmailer on your local host, either using your distro''s package manager (preferred)
    or from https://oreil.ly/82aMq. Then, as the superuser, create three local files
    in the directory /etc/nullmailer:


    adminaddr


    Contains the email address to receive administrative emails, such as Nullmailer
    notices.'
