  md: '-x When copying a tree of files, remain within the current filesystem; do not
    cross over into other mounted filesystems.


    -z Compress the data for transit. Only useful for remote hosts over slow connections.
    Avoid compression when copying files locally (it''s wasteful).


    -n Dry-run mode: don''t actually copy. Just display what would be.


    -v Verbose mode: print status information during the copy. Add -progress to display
