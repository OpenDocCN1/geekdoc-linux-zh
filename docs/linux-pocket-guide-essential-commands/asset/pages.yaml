  md: '# About the Author


    **Daniel J. Barrett** has been teaching and writing about Linux and related technologies
    for more than 30 years. His numerous O''Reilly books include Efficient Linux at
    the Command Line; Linux Pocket Guide; SSH, The Secure Shell: The Definitive Guide;
    Linux Security Cookbook; Macintosh Terminal Pocket Guide; and MediaWiki. Dan has
