  md: '- v Verbose mode: print lots of diagnostic output.


    - s Silent mode: no diagnostic output.


    # wget stdin stdout -file --opt --help --version


    wget [options] URL


    The wget command downloads data from a URL to a file. It’s great for capturing
    individual web pages, downloading files, or duplicating entire website hierarchies
    to arbitrary depth. For example, let’s capture the Yahoo! home page:


    +   - wget https://www.yahoo.com

    2023-10-22 13:56:53 (3.45 MB/s) - ''index.html'' saved


    which is saved to a file index.html in the current directory. wget can resume
    a download if it gets interrupted in the middle, say, due to a network failure:
    just run wget -c with the same URL and it picks up where it left off.


    Perhaps the most useful feature of wget is its ability to download files without
    needing a web browser:


    +   - wget https://linuxpocketguide.com/sample.pdf


    This is great for large files like videos and ISO images. You can even write shell
    scripts to download sets of files if you know their names. Here’s a script that
    downloads three MP4 videos named 1.mp4, 2.mp4, and 3.mp4 from the root of a website.


    ```

    - for i in 1 2 3

    do

    wget https://example.com/$i.mp4

    done

    ```


    wget has over 70 options, so I cover just a few important ones.'
