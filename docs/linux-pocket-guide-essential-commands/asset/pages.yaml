  md: '# nice


    nice [-n level] command_line


    When invoking a system-intensive program, be nice to the other processes (and
    users) by lowering its priority. That’s what the nice command is for: it sets
    a nice level (an amount of “niceness”) for a process so it receives less attention
    from the Linux process scheduler.¹ Here’s an example of setting a big job to run
    at nice level 7:


    +   - nice -n 7 sort hugefile > outfile


    Normal processes (run without nice) run at level zero, which you can see by running
    nice with no arguments:


    +   - nice

    0


    If you omit the -n option, the default nice level is 10. The superuser can also
    lower the nice level, increasing a process’s priority:


    +   - sudo nice -n -10 some_program


    The nice levels of processes appear in the output of ps (the NI column) and top
    (the N column).


    +   - ps -o pid,user,args,nice


    For programs with a lot of disk accesses, also check out the command ionice, which
    is like nice for input/output.


    > 1 This is called “nicing” the process. You’ll hear the term used as a verb:
    “I|ced the process to 12.”'
