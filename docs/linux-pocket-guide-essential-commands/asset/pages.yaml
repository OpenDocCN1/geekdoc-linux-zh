    # Tailoring Shell Behavior


    Several files in your home directory control the behavior of bash shells. The
    startup files .bash_profile, .bash_login, and .profile contain commands that run
    each time you log in. (Choose just one startup file and stick with it. I recommend
    .bash_profile because other shells also use .profile.) Commands in the initialization
    file .bashrc run every time you launch an interactive shell, and commands in .bash_logout
    run each time you log out. All these files can set variables, run programs, print
    silly messages, or whatever you like. Other Linux shells use other configuration
    files as shown in Table 1-1.


    Table 1-1. Shell configuration files in $HOME and when they are read


    | Shell | On login | By other interactive shells | On logout |

    | bash | .bash_profile, .bash_login, .profile | .bashrc | .bash_logout |

    | dash | .profile | | |

    | fish | .config/fish/config.fish | .config/fish/config.fish | |

    | ksha | .profile, .ksh | .kshrc | |

    | tcsh | .tcshrc, .tcsh, .login | .tcshrc, .tcsh | |

    | zsha | .zenv, .profile, .zlogin | .zenv, .zshrc | .zlogout |


    > a To override these files with environment variables, see the manual.


