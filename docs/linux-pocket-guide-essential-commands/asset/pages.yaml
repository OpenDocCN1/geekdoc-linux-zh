    mount has many uses; I discuss only the most basic. In common cases, mount reads
    the file /etc/fstab (filesystem table, pronounced “F stab”) to learn how to mount
    a desired disk. For example, if you run mount /usr /usr, the mount command looks
    up “/usr” in /etc/fstab, whose line might look like this:


    ```

    /dev/sda8 /usr ext4 defaults 1 2

    ```


    Here learn means that device /dev/sda8 should be mounted on /usr as a Linux ext4-formatted
    filesystem with default options. Mount it with either of these commands:


    +   - sudo mount /dev/sda8

    - sudo mount /usr


    By device

    By directory


    mount is run typically by the superuser, but common removable devices like USB
    keys and DVDs can be mounted and unmounted by any user.


    # Useful options


    +   - t type Specify the type of filesystem, such as ext4 or ntfs.

    - -l List all mounted filesystems; works with -t too.'
