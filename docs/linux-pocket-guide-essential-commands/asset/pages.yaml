  md: 'The syntax is a bit unusual. After the input filename, provide one or more
    patterns that represent dividing lines in the file. Patterns have two types:


    Regular expressions


    An expression (see Table 2-2) enclosed in forward slashes, such as ^[A-Z]*$/ for
    a line of all uppercase letters. Each expression is matched once by default.


    Repeaters


    A repeater has the form ''{N}'' which means ''match'' the preceding pattern up
    to N times. An example is ''{2}'' which matches its preceding pattern twice. The
    special repeater ''{*}'' matches its preceding pattern as many times as possible
    until the input ends.


