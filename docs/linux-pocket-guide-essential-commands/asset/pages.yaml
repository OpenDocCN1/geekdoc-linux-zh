    Figure 1-4. Directory scope, category, and application


    # Directory path part 1: scope


    The *scope* of a directory path describes, at a high level, the purpose of an
    entire directory tree. Some common ones are:


    +   - / (Pronounced "root") System files supplied with your distro

    - /usr (Pronounced "user") More system files supplied with your distro

    - /usr/local (Pronounced "user local") System files that are not supplied with
    your distro; they may be unique to your local Linux network or your individual
    computer


    There isn''t a clear distinction between / and /usr in practice, but is considered
    "lower level" and closer to the OS.


    # Directory path part 2: category


    The *category* of a directory path in Figure 1-4 describes the types of files
    found in a directory. For example, if the category is *lib*, you can be reasonably
    sure that the directory contains library files for programming. If the category
    is *bin*, the contents are usually *binary* files—executable programs.


    When you precede a category like *bin* with a scope, you produce paths like */bin,
    */usr/bin, and */usr/local/bin. A distro''s most fundamental system programs like
    *ls* and *cat* are typically in */bin, and other system programs are in */usr/bin.
    */usr/local/bin contains locally installed programs not included in your distro.
    These are not hard-and-fast rules but typical cases.


    > 6 Some distros no longer make these distinctions. Fedora, for example, makes
    /bin a symbolic link to /usr/bin.'
