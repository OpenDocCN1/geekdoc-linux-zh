    flock [options] lockfile command...


    Do you ever need to ensure that only one instance of a program runs at a time
    on your computer? For example, if you run automatic backups every hour using a
    command like rsync, there''s a slight chance that a previous backup might still
    be running when the next backup launches. The flock command solves this sort of
    problem. It creates a lock file that prevents a command, such as a backup script,
    from running concurrently with itself. If you try to run two copies of the command
    at once with the same lock file, the second fails. For example, rsync command,
    when run with flock and the lock file /tmp/mylock, instantly fails if no other
    instance of the same command is already running:


    +   → flock -n /tmp/mylock rsync -av dir1 dir2


