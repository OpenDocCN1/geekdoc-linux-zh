    md2, etc.


    nvme0n1 First NVMe SSD device; partitions are nvme0n1p1, nvme0n1p2, .... Likewise
    for nvme1n, nvme2n1, the second integer, like the 1 in nvme0n1p2, is called the
    namespace ID, and most users can ignore it.


    After a partition can hold files, it is formatted by a program that creates a
    filesystem on it (see “Creating and Modifying Filesystems” on page 219). A filesystem
    defines how files are represented; examples are ext4 (a Linux journaling filesystem)
    and NTFS (a Microsoft Windows filesystem). Formatting is generally done for you
    when you install Linux.


    After creating a filesystem, make it available by mounting its partition on an
    empty directory.¹ For example, if you mount a Windows filesystem on a directory
    /mnt/win, it becomes part of your system''s directory tree, and you can create
    and edit files like /mnt/win/myfile.txt. Mounting generally happens automatically
    at boot time. You can also unmount partitions to make them inaccessible via the
    filesystem for maintenance.


    ```

    df stdout -file --opt --help --version

    df [options] [disk devices | files | directories]

    ```


    The df (disk free) command shows the size, used space, and free space on a given
    disk partition. If you supply a file or directory, df describes the disk device
    on which that file or directory resides. With no arguments, df reports on all
    mounted filesystems:


    > You can mount a filesystem on a nonempty directory, but the directory''s contents
    become inaccessible until you unmount.'
