    or recursively copy a remote directory to your local machine:


    +   - scp -r remote.example.com:mydir .


    You can copy files from one remote machine to another if you have SSH access to
    both machines:


    +   - scp remote1.example.com:myfile remote2.example.com:


    To specify an alternate username on the remote system, use the username@host syntax:


    +   - scp myfile sandy@remote.example.com:


