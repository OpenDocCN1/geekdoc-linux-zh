    - w Match only complete words.


    - x Match only complete lines. Overrides -w.


    - a Treat all files as plain text. Sometimes grep mistakenly treats a file as
    binary and won''t print matching lines.


    - A N After each matching line, print the next N lines from its file.


    - B N Before each matching line, print the previous N lines from its file.


    - C N Same as -A -N B: print N lines (from the original file) above and below
    matching line.


    --color Highlight the matched text in color, for better readability.


    - r Recursively search all files in a directory and its subdirectories.


    - R Same as -r but follow all symbolic links.


    - E Use extended regular expressions. See egrep.


    - F Use lists of fixed strings instead of regular expressions. See fgrep.


    Table 2-2. Regular expressions for grep (plain) and egrep (extended)


    | Plain | Extended | Meaning |

    | --- | --- | --- |

