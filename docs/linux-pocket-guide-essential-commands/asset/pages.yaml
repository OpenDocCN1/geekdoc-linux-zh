    64 bytes from connie.slackware.com (64.57.102.36):

    icmp_seq=1 ttl=52 time=107 ms

    64 bytes from connie.slackware.com (64.57.102.36):

    icmp_seq=2 ttl=52 time=107 ms

    ^

    -- slackware.com ping statistics

    2 packets transmitted, 2 received, 0% packet loss, ...

    rtt min/avg/max/mdev = 107.207/107.350/107.494/0.143 ms

    ```


    Here, the slackware.com replied in 107 milliseconds. (Notice that its real name
    is connie.slackware.com.) Pings blocked by firewalls, so a running host might
    not respond.


    # Useful options


    +   -c N Ping at most N times. (Note that "ping" is a verb).

    - i N Wait N seconds (default 1) between pings. (Here "ping" is a noun).

    - n Print IP addresses in the output, rather than hostnames.

    - U Use IPv6 instead of the default IPv4.


