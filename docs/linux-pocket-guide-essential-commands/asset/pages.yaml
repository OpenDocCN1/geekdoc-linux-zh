  md: '# Keystrokes


    I use certain symbols for keystrokes. The caret (^) means “hold down the Control
    key,” usually labeled Ctrl. For example, ^D (Ctrl D) means “hold down the Ctrl
    key and type D.” I also write ESC to mean “press and release the Escape key” Keys
    like Enter and mean the space bar should be self-explanatory.


    # Downloading the Practice Files


    I’ve created a collection of files to help you practice with Linux. Download and
    install them on any Linux machine, and you can run most of the example commands
    in this book verbatim. To download them for the first time, run the following
    commands. (Note that -0 contains a capital O, not a zero.)


    +   - cd

    - curl -0 https://linuxpocketguide.com/LPG4.tar.gz

    - tar -xf LPG4.tar.gz


    The preceding commands create a directory named linuxpocket-etguide in your home
    directory. Visit this directory:


    +   - cd ~/linuxpocketguide


    and run commands as you read the book. The output should match the book’s except
    for local details like dates and usernames.


    To re-download and install the practice files (say, if you’ve modified them),
    simply run the provided reset-lpg script:


    +   - cd ~/linuxpocketguide

    - bash reset-lpg


    > 1 Or, if you are experienced with git and GitHub, download the files and skip
    the rest of my instructions. If you clone the repository and want to restore the
    files to their original state, don’t run the reset-lpg script; run git reset -hard
    instead.'
