  md: 'A symbolic link (also called a symlink or soft link) is a pointer to the path
    (not the inode) of another file or directory. If you''re familiar with Windows
    shortcuts or macOS aliases that point to another file or folder, they are much
    like symbolic links. To create a symbolic link, add the -s option:


    +   - ln -s myfile softlink


    Hard and symbolic links have important differences:


    +   - If you rename or delete the original file, a hard link is not affected:
    it still points to the same data that the original file did. A symbolic link breaks,
    however. It still points to the original file''s path, which no longer exists.
    The symbolic link is now "dangling", and if you use it in a command, you''ll probably
    receive a "file not found" error.

    - Hard links can exist only on the same device as the original file inodes having
    meaning only on a single device. Symbolic links can point to files on other devices
    because they refer to file paths, not file data.

    - Symbolic links can point to directories, whereas hard links generally cannot.
    (On some filesystems, the superuser can create a hard link to a directory with
    the -d option.)


    # Useful options


    +   - s Make a symbolic link instead of a hard link.

    - i Interactive mode. Ask before overwriting target files.

    - f Force the link. If the target already exists, overwrite it unconditionally.

    - b Create a backup. If the target already exists, rename it by appending a tilde,
    then create the link.

    - d Create a hard link to a directory if possible (superusers only).'
  merge: -1
