    cat [options] [files]


    The simplest viewer is cat, which just prints its files to standard output, concatenating
    them (hence the name):


    +   - cat myfile Print one file on screen

    - cat myfile* Print many files

    - cat myfile* | wc Concatenate files and pipe the text to wc


    If a file contains more lines than your screen can display, less to present the
