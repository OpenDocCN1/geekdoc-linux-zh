- img_proc: true
  md: 'the files myfile and myfile2, then standard input, then myfile3:


    ```

    wc myfile myfile2 - myfile3

    ```


    A double-dash option (--) means "end of options": any strings appearing later
    on the command line are not treated as options. A double dash is sometimes necessary
    to work with a filename that begins with a dash, which otherwise would be (mistakenly)
    treated as an option. For example, if you have a file named -dashfile, the command
    wc -dashfile fails because the string -dashfile is treated as an (invalid) option.
    Run wc -- -dashfile to indicate -dashfile is a filename. If a command does not
    support "-", you can still work around the problem by prepending the current directory
    path \./" to the filename so the dash is no longer the first character:


    ```

    wc ./-dashfile

    ```


    --help


    The option --help makes the command print a help message explaining proper usage,
    then exit.


    --version


    The option --version makes the command print its version information and exit.


    # Commands, Prompts, and Output


    The Linux command line, or shell, prints a special symbol, called a prompt, when
    it''s waiting for a command. In this book, the prompt is a right-facing arrow:


    →


    Prompts come in all shapes and sizes, depending on how your shell is configured.
    Your prompt might be a dollar sign ($), a combination of your computer name, username,
    and various symbols (myhost:~smith$), or something else. Every'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'prompt means the same thing: the shell is ready for your next command.


    When I show a command line in this book, some parts are meant to be typed by the
    user, and other parts are not (like the prompt and the command''s output). I use
    bold to identify the parts going to type. Sometimes I add italic comments to explain
    what''s going on:


    +   - wc -l myfile The command to type at the prompt

    18 myfile The output it produces


    # Your Friend, the echo Command


    In many of my examples, I print information to the screen with the echo command,
    which I formally describe in “Screen Output” on page 275. echo is one of the simplest
    commands—it merely prints its arguments on standard output, once those arguments
    have been processed by the shell:


    +   - echo My dog has fleas

    My dog has fleas

    - echo My name is $USER The shell variable USER

    My name is smith


    # Long Command Lines


    Sometimes, a command is longer than the width of a page, so I split it onto multiple
    lines. A final backslash character means “continued on the next line”:


    +   - echo This is a long command that does not fit on \none line

    This is a long command that does not fit on one line


    If you enter one of my multiline commands in a running shell, feel free to break
    it up with backslashes as I did, or just type the whole command on one line without
    backslashes.'
