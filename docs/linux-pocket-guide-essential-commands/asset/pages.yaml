  md: 'ls [options] [files]

    which means you’d type “ls” followed, if you choose, “[options] and then filenames.
    Don’t type the square brackets “[” and “]”—they just indicate their contents are
    optional. Words in italics mean you have to fill in your own values, like names
    of actual files. If you see a vertical bar between options or arguments, perhaps
    grouped by parentheses:


    (file | directory)


    this indicates choice: you may supply either a filename or directory name as an
    argument.


    | ls stdin stdout -file --help --version |

    | ls [options][files] |


    Figure P-1. Standard command heading


    The standard heading shown in Figure P-1 also includes six properties of the command,
    printed in black (supported) or gray (unsupported):


    stdin


    +   - The command reads by default from standard input (i.e., your keyboard).
    See “Input, Output, and Redirection” on page 43.


    stdout


    +   - The command writes by default to standard output (i.e., your display). See
    “Input, Output, and Redirection” on page 43.


    -file


    +   - A single-dash argument (-), when provided as an input filename, tells the
    command to read from standard input rather than a disk file. Likewise, if the
    dash is supplied as an output filename, the command writes to standard output.
    For example, the following wc command line reads'
  merge: -1
