  md: '# Running Multiple Shells at Once


    Job control can manage several commands at once, but only one can run in the foreground
    at a time. More powerfully, you can run multiple shells at once, each with a foreground
    command and any number of background commands.


    If your Linux computer runs a window system like KDE or GNOME, you can easily
    run many shells at the same time by opening multiple shell windows (“Launching
    a Shell” on page 21). In addition, certain shell window programs, such as KDE’s
    console, can open multiple tabs within a single window, each one running a shell.


    Even without a window system—say, over an SSH network connection—you can manage
    multiple shells at once. The tmux command simulates multiple shell windows in
    an ordinary ASCII terminal. Using special keystrokes, you can switch from one
    virtual window to another at will. (Another such program is screen, tmux is better
    maintained and easier to configure.) To begin a session with tmux, run:


    +   - tmux


    A new shell launches with an extra status bar at the bottom of the terminal, indicating
    that you’re running one virtual window. The tmux program provides 10 windows by
    default, labeled from 0 to 9, that you may switch between. Each window runs a
    single shell at first, but you can split a window into multiple “panes” to display
    multiple shells at once. Try these keystrokes to get the hang of tmux:


    +   1. In the current tmux window, run ls.

    2. Press ^Bc (Ctrl-B, then press c). tmux displays a fresh shell prompt in a second
    virtual window. The status bar changes to show two virtual windows 0 and 1.

    3. In this second window, run a different command (say, df).

    4. Press ^Bn and you’ll switch back to window 0, where your output from ls is
    now visible again.'
