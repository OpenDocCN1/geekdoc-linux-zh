    newgrp [-] [group]

    When you''re added to a new group (e.g., with usermod -aG), normally the change
    isn''t effective until your next login. the newgrp command avoids this hassle.
    Run newgrp with the new group name as an argument, and it launches a fresh shell
    with your current group ID set to that group. In this way, you can immediately
    use newly granted group privileges. The effect lasts only until the new shell
    runs, but it beats logging out and back in. Exit the shell to restore your default
    group ID.


    For example, suppose you''ve just been added to the group video. If you haven''t
    logged out yet, you won''t see video among your groups.


