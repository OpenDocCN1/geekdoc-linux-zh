    +   - nano A simple text editor found in virtually all Linux distros.

    - emacs A powerful text editor from Free Software Foundation.

    - vim A powerful text editor based on Unix vi.


    To get far with Linux, you must become proficient with one

    it its editors. The three major ones are nano, Emacs,

    and Vim. Teaching these editors fully is beyond the scope

    of this book, but they all have online tutorials, and common

    operations are in Table 2-1. To edit a file, run any of these

    commands:


    +   - nano myfile

    - emacs myfile

    - vim myfile


    If myfile doesn''t exist, the editor creates it.


    Linux also has programs to edit Microsoft Office docu-\ments: LibreOffice (all
    documents), AbiWord (Word only), and

