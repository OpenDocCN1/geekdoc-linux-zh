  md: '# System Administration Basics


    # Becoming the Superuser


    Normal users, for the most part, can modify only the files they own. One special
    user, called the superuser or root, has full access to the machine and can do
    anything on it. Superuser privileges are mainly for system administration tasks;
    use them only when absolutely necessary so you don''t accidentally harm your Linux
    system. And don''t log in as root unless you must (e.g., when rescuing a broken
    boot process).


    > WARNING

    Superuser commands can destroy a Linux system if you''re not careful.


    You can become the superuser in several ways. One is to use the sudo command to
    gain superuser abilities for the duration of a single command. Simply type "sudo"
    followed by the command. You may be prompted for your password, depending on how
    sudo is configured on your machine:'
  merge: -1
  pgno: 161
- img_proc: true
  md: '+   → sudo rm some_protected_file

    [sudo] password: xxxxxxxxxx Your own password


    To maintain your superuser powers without constantly running sudo, launch a superuser
    shell with either of the following commands:


    +   → sudo -s

    → sudo bash


    A superuser shell is convenient, say, for browsing through many protected directories
    with cd. When finished executing commands as the superuser, press ^D or run exit
    to end the superuser shell and become yourself again. If you forget whether your
    shell is a superuser shell or just a normal one, check your identity with the
    whoami command. If you''re the superuser, it displays root.


    Another way to become the superuser is the su command, which also creates a superuser
    shell, but you''ll need a different password, called the root password, to use
    it. (Whoever installed Linux chose the root password during installation.)


    +   → su

    Password: xxxxxxxxxx root password #


    Your shell prompt may change, often to a hash mark (#), to indicate you are the
    superuser. Add the option -l to run a login shell that includes root''s full environment,
    as root''s shell aliases.


    +   → su -l Run a login shell

    Password: xxxxxxxxxx root password #


    If you provide a username to sudo or su, you become that user, provided you have
    the prerequisites:


    +   → sudo -u sophia command Become user sophia with sudo

    [sudo] password: xxxxxxxxxx You must have sudo permission

    → su sophia Become user sophia with su

    Password: xxxxxxxxxx You must know sophia''s password'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'Use sudo rather than su whenever possible, especially if your system has multiple
    users. su relies on a shared password, which is a security concern. sudo uses
    your own password, but it must be configured to do so (and many distros come with
    sudo preconfigured). sudo also provides precise control over privileges in the
    file /etc/sudoers, and even logs the commands that users run. A full discussion
    is beyond the scope of this book: see man sudo for details.


    # # Viewing Processes


    +   - ps List processes.

    - pgrep List the IDs of processes that match a regular expression.

    - uptime View the system load.

    - w List active processes for all users.

    - top Monitor resource-intensive processes interactively.

    - free Display free memory.


    A process is a unit of work on a Linux system. Each program you run represents
    one or more processes, and Linux provides commands for viewing and manipulating
    them. Every process is identified by a numeric process ID, or PID, and can be
    examined in the directory /proc (“Kernel-Related Directories” on page 33).


    Processes are different from jobs (see “Shell Job Control” on page 49). Processes
    are part of the OS. Jobs are higher-level constructs known only to the shell in
    which they’re running. A running program comprises one or more processes; a shell
    job consists of one or more programs executed as a shell command.'
  merge: -1
  pgno: 163
