  md: '# Linux Pocket Guide


    If you use Linux in your day-to-day work, then Linux Pocket Guide is the perfect
    on-the-job reference. This thoroughly updated 20th anniversary edition explains
    more than 200 Linux commands, including new commands for file handling, package
    management, version control, file format conversions, and more.


    In this concise guide, author Daniel Barrett provides the most useful Linux commands
    grouped by functionality. Whether you''re a novice or an experienced user, this
    practical book is an ideal reference for the most important Linux commands.


    You''ll learn:


    +   - Essential concepts—commands, shells, users, and the filesystem


    +   - File commands—creating, organizing, manipulating, and processing files of
    all kinds


    +   - Sysadmin basics—superusers, processes, user management, and software installation


    +   - Filesystem maintenance—disks, RAID, logical volumes, backups, and more


    +   - Networking commands—working with hosts, network connections, email, and
    the web


    +   - Getting stuff done—everything from math to version control to graphics and
    audio


    ![](img/dd09ac8c00ea7e7983be7cf6460cc90d_1_0.png)'
