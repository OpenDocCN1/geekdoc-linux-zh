    # pgrep stdin stdout -file --opt --help --version


    pgrep [options] regex


    The pgrep command prints the process IDs (PIDs) of processes that match certain
    criteria, given by a regular expression. (A similar command, pidof, matches only
    fixed strings.) For example, print the PIDs of all running python processes:


    +   → pgrep python

