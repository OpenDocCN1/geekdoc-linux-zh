    # Snapshot a ZFS Dataset


    ZFS supports snapshots: storing the state of a dataset so you can easily return
    to that state (roll back) later. Before performing a risky change on your files,
    for example, take a snapshot, and if something goes wrong, you can revert the
    change with a single command. Snapshots occupy very little disk space, and you
    can send them efficiently to other zpools or hosts (with zfs send recv). Create
    a snapshot of mypool/data named safe:


    ```

    sudo zfs snapshot mypool/data@safe

    ```


    List your snapshots:


    ```

    zfs list -t snapshot

    ```


    | NAME USED AVAIL REFER MOUNTPOINT |

    | mypool/data@safe 0 - 24K - |


    ```

    sudo zpool set listsnapshots=on mypool

    ```


    Try changing some files in mypool/data. Then roll back to the snapshot safe and
    ensure that your changes are gone:


    ```

    sudo zfs rollback mypool/data@safe

    ```


    # Destroy a ZFS Dataset or Snapshot


    Be careful with the zfs destroy command—it runs immediately with confirmation.


    ```

    sudo zfs destroy mypool/data@safe

    sudo zfs destroy mypool/data

    ```'
