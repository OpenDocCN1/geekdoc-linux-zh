    # rclone stddin stdout -file --opt --help --version


    rclone subcommand [options] [arguments]


    The rclone command connects your Linux system to popular cloud storage providers
    to copy files conveniently. It works with Dropbox, Google Drive, Microsoft OneDrive,
    Amazon S3, and about 50 other destinations. To started, run rclone config and
    follow the prompts to set up a connection with your cloud provider of choice,
    which rclone calls a remote. Visit rclone.org/docs for detailed instructions on
    configuration.


    After choosing a name for your remote, such as myremote, refer to remote files
    with the syntax remote:path, where path is a Linux-style file path. For example,
    a file photo.jpg in a remote directory Photos would be myremote:Photos/photo.jpg.


    Backups are usually done with the rclone sync command, which synchronizes a local
    directory and a remote directory so they contain the same content, adding or deleting
    as necessary. It works much like the rsync --delete command. You can synchronize
    in either direction, from your local machine to the remote, or from the remote
    to your local machine. You can even set up client-side encryption, so files are
    transparently encrypted before they''re copied to the remote and decrypted when
    they''re copied back to your local system (see the docs).


