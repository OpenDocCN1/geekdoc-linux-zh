  md: '# CHAPTER 1


    # Essential Concepts


    # What’s Linux?


    Linux is a free, open source operating system (OS) that’s an alternative to Microsoft
    Windows and Apple macOS. Linux powers most of the servers on the internet. It
    operates behind the scenes on every Android mobile phone and Chromebook, and on
    millions of network-connected devices like routers, firewalls, and robotic cow-milking
    systems (seriously). It also runs fine on desktop and laptop computers.


    Linux has four major parts, shown in Figure 1-1:


    +   The kernel


    Low-level software. It controls the hardware and basic functions like process
    scheduling and networking. Few users interact with the kernel directly.


    +   Supplied programs


    Thousands of programs for file handling, text editing, software development, web
    browsing, audio, video, encryption, mathematics...you name it. These programs
    talk to the kernel. Programs that run on the command line are called commands.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# The shell


    A Linux program for running commands and displaying the results. Linux has an
    assortment of shells with different features. This book focuses on a shell called
    bash, which is often the default for user accounts. Some other shells are dash,
    fish, ksh (Korn shell), tcsh (TC shell, or T shell), zsh (Z shell), and to a lesser
    extent, busybox. All shells have similar functions, though their usage varies.


    # Graphical desktop environment (optional)


    A UI with windows, menus, icons, mouse support, and other familiar GUI elements.
    GNOME and KDE Plasma. Most applications built for GNOME can run in KDE and vice
    versa.


    This book focuses on the command-line parts of Linux, namely the supplied programs
    and the shell. Windows and macOS have command-line interfaces too (cmd and powershell
    on Windows, Terminal on the Mac), but most of users stick with the GUI and might
    never see or need a command line. On Linux, the shell is critical. If you use
    Linux without the shell, you are missing out.


    Linux is extremely configurable and comes in hundreds of varieties that serve
    different needs and tastes. Each variety is called a distro (short for “distribution”).
    All distros share some core components but may look different and include different
    programs and files. Some popular distros include Mint, Ubuntu, Manjaro, Arch,
    Gentoo, Red Hat, and OpenSUSE, among others. The core material in this book should
    apply to every distro.


    +   GNOME, KDE, and other environments are built on a common windowing system
    that is either X or Wayland. To see which system you''re using, run the command
    echo $XDG_SESSION_TYPE.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '![](img/dd09ac8c00ea7e7983be7cf6460cc90d_21_0.png)


    Figure 1-1. The four major parts of Linux, conceptually. Low-level kernel functions
    are called by programs, which are invoked in a shell, which can be launched by
    a graphical desktop.


    # Launching a Shell


    Where do shells come from? Sometimes Linux will launch one for you automatically.
    This is often the case when you log in over a network using ssh or a similar tool.
    The first significant thing you see is a shell prompt awaiting your command.


    Other times, you have to launch a shell manually. This is common when using a
    graphical desktop full of icons and menus with no in sight. In cases, you need
    a GUI application called a terminal or terminal program that runs shells in a
    window. The sidebar “Shell Versus Terminal” on page 22 clarifies the difference
    between shells and terminals.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'Every distro with a graphical desktop includes at least one terminal program,
    but you might have to hunt for it. Search for an application, icon, or menu item
    named Terminal, Konsole, xterm, gnome-terminal, uxterm, or something similar,
    and run it to open a terminal. Also try pressing Ctrl-Alt-t (hold the Control
    and Alt keys and press T), which opens a terminal in some environments.


    # Shell Versus Terminal


    A shell is a command-line interface for launching Linux commands by typing plain
    text. It prints a prompt and waits for your command:


    +   → A terminal is a program that opens a window and presents a running shell,
    shown in Figure 1-2. It''s like a graphical wrapper around a shell. A terminal
    adds menus, scrollbars, copy and paste, and other GUI features that support the
    shell.


