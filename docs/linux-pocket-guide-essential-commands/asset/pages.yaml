  md: '# NOTE


    ffmpeg is sensitive to the order of its options, unlike most other Linux commands.
    Wherever you place the option -i filename on the command line, input file options
    come before it and output file options come after. If an input option sits among
    output options or vice versa, ffmpeg may fail mysteriously.


    Convert a video file myvideo.mp4 from MP4 to MOV format:


    +   → ffmpeg -i myvideo.mp4 myvideo.mov


    Extract 10 seconds of video (-t 10) beginning at the minute mark (-s 00:02:00)
    and store it in a file extract.mp4:


    +   → ffmpeg -i myvideo.mp4 -ss 00:02:00 -t 10 \

    -codec copy extract.mp4


    Extract audio from myvideo.mp4 into an MP3 file audio.mp3:


    +   → ffmpeg -i myvideo.mp4 -q:a 0 -map a audio.mp3


    Append multiple videos to create movie.mp4. Start with a text file that lists
    the paths to the source videos, then run ffmpeg:


    +   → cat videos.txt

    file ''video1.mp4''

    file ''video2.mp4''

    file ''video3.mp4''

    → ffmpeg -f concat -safe 0 -i videos.txt -c copy \

    movie.mp4


    Create a thumbnail image from a video file myvideo.mp4 by extracting a single
    frame (-vframes 1) at the second-mark (ss 5) into a JPEG thumb.jpg, sized 160
    × 120 pixels:


    +   → ffmpeg -ss 5 -i myvideo.mp4 -vcodec ffmpeg \

    -vframes 1 -an -f rawvideo -s 160x120 thumb.jpg


