    \n> WARNING\nZFS operations can wipe filesystems without confirmation. Practice\
    \ the commands on spare drives or a virtual machine for safety.\n\nZFS (Zettabyte\
    \ File System) packs advanced features like RAID, logical volume management, encryption,\
    \ and compression into one convenient package. If you're accustomed to traditional\
