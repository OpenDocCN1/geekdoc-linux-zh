  md: 'To mirror the directory mydir and its contents into another directory mydir2
    on a single machine:


    rsync is finicky about how you specify the first directory. If you write “mydir”
    as in the example here, that directory is copied into mydir2, creating the subid
    mydir2/mydir. If instead, you''d rather have the contents of mydir copied into
    mydir2, append a slash to “mydir”:


    +   - rsync -a mydir mydir2


    rsync can mirror a directory over a network to another host, securing the connection
    with SSH to prevent eavesdropping. Here I copy directory mydir to the account
    “smith” on remote host server.example.com, in a directory D2:


    +   - rsync -a mydir smith@server.example.com:D2


    If you like rsync but also want to have incremental backups and manage them efficiently,
    try rsnapshot (https://oreil.ly/VNfb-).


    # Useful options


    +   - o Copy the ownership of the files. (You might need superuser privileges
    on the remote host.)


    +   - g Copy the group ownership of the files. (You might need superuser privileges
    on the remote host.)


    +   - p Copy the file permissions.


    +   - t Copy the file timestamps.


    +   - r Copy directories recursively (i.e., including their contents).


    +   - l Permit symbolic links to be copied (rather than the files they point to).


    +   - D Permit devices to be copied. (Superuser only.)


    +   - a Mirroring: copy all attributes of the original files. This implies all
    of the options -Dogpatrl (think “dog patrol”).'
