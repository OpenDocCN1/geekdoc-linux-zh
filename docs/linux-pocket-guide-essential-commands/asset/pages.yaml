  md: 'suspend Suspend a shell.


    fg Unsuspend a job: bring it into the foreground.


    bg Make a suspended job run in the background.


    disown Forget a job.


    All Linux shells have *job control*: the ability to run commands in the background
    (multitasking behind the scenes) and foreground (the active process at your shell
    prompt). A *job* is simply the shell''s unit of work. When you run a command interactively,
    your current shell tracks it as a job. When the command completes, the associated
    job disappears. Jobs are at a higher level than Linux processes; the Linux OS
    knows nothing about them. They are merely constructs of the shell. Here is some
    important vocabulary about job control:


    # Foreground job


    +   - In a shell, a running job that occupies the shell prompt you cannot run
    another command


    # Background job


    +   - In a shell, a running job that doesn''t occupy the prompt, so you can run
    other commands in the same shell


    # Suspend


    +   - To stop a foreground job temporarily


    # Resume


    +   - To cause a suspended job to start running in the foreground again


    # Disown


    +   - To tell the shell to stop tracking the job; the underlying processes continue
    to run'
  merge: -1
