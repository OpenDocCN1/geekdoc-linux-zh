    # Public Key Authentication with SSH


    Public key authentication is a more secure way to log into remote hosts with SSH.
    It uses a pair of cryptographic keys. Your private key remains on your local host
    in the directory ~/.ssh, protected by a passphrase. Your public key is copied
    to remote hosts. First, generate a key pair:


    +   - ssh-keygen

    Enter file to save the key (~/.ssh/id_rsa): <Enter>

    Enter passphrase (empty for no passphrase): xxxxxxxxxx

    Enterter same passphrase again: xxxxxxxxxx

    Your identification has been saved in ~/.ssh/id_rsa


    Then, copy your public key to the remote host and log in:


    +   - ssh-copy-id sandy@remote.example.com

    sandy@remote.example.com''s password: xxxxxxxxxx

    Number of key(s) added: 1

    - ssh sandy@remote.example.com


    Enter passphrase for ''/home/sandy/.ssh/id_rsa'': xxxxxxxxxx


    If the final ssh command fails to log you in, check:


    +   - The local and remote ~/.ssh directories have mode 0700.

    - The local private key file ~/.ssh/id_rsa has mode 0600.

    - The remote file ~/.ssh/authorized_keys has mode 600.

    - The public key in local file ~/.ssh/id_rsa.pub appears in remote file ~/.ssh/authorized_keys.
    If not, append the local file''s contents to the remote authorized_keys and try
    again.


    Also run ssh -v to print debug messages and look for clues.

    Run ssh -vvv for more verbose detail.'
