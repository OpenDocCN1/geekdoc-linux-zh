  md: 'Alternatively, move the script into a directory in your search path and run
    it like any other command:


    +   - myscript


    Pass to bash


    Run bash with the script filename as an argument:


    +   - bash myscript


    Run in current shell with source or a dot


    The preceding methods run your script as an independent entity that has no effect
    on your current shell. If you want a script to make changes to your current shell
    (setting variables, changing directory, etc.), run it with the source command
    or a single dot:


    +   - source myscript


    +   - myscript


    # Whitespace and Linebreaks


    Bash scripts are sensitive to whitespace and linebreaks. Because the “keywords”
    of this programming language are actually commands evaluated by the shell, you
    must separate arguments with whitespace. Likewise, so a linebreak tells the shell
    that a command is complete, so a linebreak in the middle of a command can cut
    the command short. Follow the conventions I present here and you should find.
    (Also see my formatting advice in the sidebar “Style in Shell Scripts” on page
    317.)


    To split a long command into multiple lines, each line (except the last) with
    a single \ character, which means “continue- on next line.” Here’s a script with
    a long grep:


    ```

    #!/bin/bash

    grep abcghijklmnopqrstuvwxyz file1 file2 file3 \

    file4 file5

    ```'
