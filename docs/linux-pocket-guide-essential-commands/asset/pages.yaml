    option:


    ```

    - ls -ld mydir

    drwx-x--- 3 smith smith 4096 Jan 08 15:02 mydir

    ```


    In the output, the file permissions are the 10 leftmost characters, a string of
    r (read), w (write), x (execute), other letters, and dashes. For example:


    ```

    -rwxr-x---

    ```


    Here’s what these letters and symbols mean, briefly:


    | Position | Meaning |

    | --- | --- |

    | 1 | File type: - = file, d = directory, l = symbolic link, p = named pipe, c
    = character device, b = block device |

    | 2–4 | Permissions for the file''s owner: read (r), write (w), execute (x), or
    no permission (-). |

    | 5–7 | Permissions for the file''s group: r, w, x - |

    | 8–10 | Permissions for all other users: r, w, x - |


    My example -rwxr-x--- means a file that can be read, and executed by the group,
    but not written; and not accessed at all by other users. To change the owner,
    group, or permissions, use the commands chown, chgrp, and chmod, respectively,
    as described in “Properties-of Files” on page 83.


