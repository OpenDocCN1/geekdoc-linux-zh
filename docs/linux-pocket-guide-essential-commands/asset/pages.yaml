    # File Permissions


    A Linux system may have many user accounts. To maintain privacy and security,
    most users can access only some files on the system, not all. This access control
    is embodied in two questions:


    +   Who has permission?

    Every file and directory has an owner who can do anything they want with it. Typically,
    a file’s owner is the user who created it. A superuser can change a file’s owner.


    Additionally, a predefined group of users may access a file. Groups are defined
    by the system administrator and I cover them in “Group Management” on page 192.


    Finally, a file or directory can be opened by all users who have accounts on the
    system. You’ll also see this set of users called the world or simply other.


    +   What kind of permission is granted?

    File owners, groups, and the world may each have permission to read, write (modify),
    and execute (run) particular files. Permissions also extend to directories, which
    users may read (view files within the directory), write (create and delete files
    within the directory), and execute (enter the directory with cd).


    To see the ownership and permissions of a file named myfile, run -l, described
    in “Basic File Operations” on page 61:


    ```

    ls -l myfile

    rw-r--r-- 1 smith smith 1168 Oct 28 2015 myfile

    ```'
