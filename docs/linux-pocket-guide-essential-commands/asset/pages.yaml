  md: '# grep [options] pattern [files]


    The grep command is one of the most consistently useful and powerful in the Linux
    arsenal. Its premise is simple: given one or more files, print all of their lines
    that match a regular expression. For example, if a randomlines contains these
    lines:


    The quick brown fox jumped over the lazy dogs!

    My every mother just served us nine pancakes.

    Film at eleven.


    and you print all lines containing “pancake”, you get:


    +   - pancake randomlines

    My every mother just served us nine pancakes.


    Now use a regular expression to print lines ending in an exclamation point:


    +   - grep ''!$’ randomlines

    The quick brown fox jumped over the lazy dogs.


    grep can use two different types of regular expressions: basic and extended. They
    are equally powerful, just different, and their syntax is in Table 2-2. Regular
    expressions are well worth your time to learn. Other powerful Linux programs use
    them too, as sed and pernl.


    # Useful options


    +   -v Print only lines that do not match the regular expression.


    +   -l Print only the names of files that contain matching lines, not the lines
    themselves.


    +   -L Print only the names of files that do not contain matching lines.


    +   -c Print only the count of matching lines.


    +   -o Print only the strings that match, not whole lines.


    +   -n In front of each line of matching output, print its original line number.
    (Or print the byte offset with -b.)'
