    # The Structure of Commands


    A Linux command typically consists of a program name followed- by options and
    arguments:


    wc -l myfile


    The program name (wc, short for “word count”) refers to a program somewhere on
    disk that the shell locates and runs. Options, which usually begin with a dash,
    affect the behavior of the program. In the preceding command, the -l option tells
    wc to count lines and not words. The argument myfile specifies the file that we
    should read and process.


    Commands can have multiple options and arguments. Options may be given individually,
    or combined after a single dash:'
  merge: -1
  pgno: 24
- img_proc: true
  md: '```

    wc -l -w myfile

    Two individual options

    Combined options, same as -l w

    ```


    though some programs are quirky and do not recognize combined options. Multiple
    arguments are also OK:


    ```

    wc -lw myfile2

    Count lines in two files

    ```


    Options are not standardized. They may be a single dash and one character (say,
    -l), two dashes and a word (--lines), or several other formats. The same option
    may have different meanings to different programs: in the wc -l, the option -l
    means "lines of text", but in ls -l means "long output" Two programs might also
    use different options to mean the same thing, such as -q for "run quietly" versus
    -s for "run silently.” Some options are followed by a value, such as -s 10, and
    space between them might not be required (-s10).


    Arguments are usually filenames for input or output, but they can be other things
    too, like directory names, usernames, nicknames, IP addresses, regular expressions,
    or arbitrary expressions.


    A command that’s just a single program with options and arguments is called a
    simple command. Here’s a simple command that lists users who are logged into a
    Linux server:


    +   - who

    silver pts/0 Sep 23 20:44

    byrnes pts/0 Sep 15 13:51

    barrett pts/1 Sep 22 21:15

    silver pts/2 Sep 22 21:18


    A command can also invoke several programs at once and even connect programs so
    they interact. Here’s a command that connects the output of one to the input of
    wc, which counts lines of text. The result is the number of lines in the output
    of who:


    > User “silver,” who is listed twice, is running two interactive shells at once.'
