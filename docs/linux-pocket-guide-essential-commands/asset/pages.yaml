  md: '# Web Browsing


    lynx Text-only web browser.


    curl Access online content from the command line.


    wget Download web pages and files.


    Besides the usual web browsers such as Chrome and Firefox, Linux offers several
    ways to explore the World Wide Web via the command line.


    # lynx stdin stdout -file --opt --help --version


    lynx [options] [URL]


    Lynx is a stripped-down text-only web browser. It doesn''t display pictures or
    play audio or video. All browsing is done by keyboard, not with a pointing device.
    But Lynx is incredibly useful when you just want a quick look at a page, when
    the network is slow, or for downloading the HTML of a website. It''s particularly
    good for checking out a suspicious URL because Lynx doesn''t run JavaScript and
    won''t accept a cookie without asking you first.


    Many pages won''t look right, especially if they use tables or frames, but usually
    you can find your way around a site.


    | Keystroke | Meaning |

    |--- | --- |

    | ? | Get help. |

    | k | List all keystrokes and their meanings. |

    | ^G | Cancel a command in progress. |

    | q | Quit Lynx. |

    | Down arrow | Go to the next link or form field. |

    | Up arrow | Go to the previous link or form field. |'
