  md: '# Comparing Files


    diff Line-by-line comparison of two files or directories.


    comm Line-by-line comparison of two sorted files.


    cmp Byte-by-byte comparison of two files.


    shasum Compute checksums of the given files.


    md5sum Compute checksums of the given files (insecure).


    You can compare Linux files in at least three ways:


    +   - Line by line (diff), best suited to text files.

    - Byte by byte (cmp), often used for binary files.

    - By comparing checksums (shasum). Avoid older, weaker commands such as sum, cksum,
    and md5sum, which use insecure algorithms.


    ```

    diff stdin stdout -file -opt --help --version

    diff [options] file1 file2

    ```


    The diff command compares two files line by line, or two directories file by file.
    If there are no differences, diff produces no output. For text files, diff produces
    detailed reports of their differences. For binary files, diff merely reports whether
    they differ or not.


    The traditional output format looks like this:


    ```

    Affected line numbers, and the type of change

    < Corresponding section of file1, if any

    -- > Corresponding section of file2, if any

    ```


