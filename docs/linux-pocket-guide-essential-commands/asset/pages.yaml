    %o Octal integer

    %x Hexadecimal integer

    %f Floating point

    %lf Double-precision floating point

    %c A single character

    %s String

    %q String with any special characters escaped

    %% A percent sign by itself


    Set the minimum width of the output by inserting a numeric expression just after
    the leading percent sign. For example, "%%5d" means to print a decimal number
    in a five-character-wide field, and "%%6.2f" means a floating-point number in
