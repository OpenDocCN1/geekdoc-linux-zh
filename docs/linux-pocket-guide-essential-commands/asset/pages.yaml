    To search for manual pages (manpages) by keyword for a particular topic, use the
    `-k` option followed by the keyword:


    +   - `man -k database`


    If the list of manpages is longer than the screen, pipe it to less to display
    it in pages (press `q` to quit):


    +   - `man -k database | less`


    Run the `info` command


    The `info` command is an extended, hypertext help system covering many Linux commands.


    +   - `info ls`


    While info runs, some useful keystrokes are:


    +   - To get help, press `h`n- To quit, press `q`n- To page forward and backward,
