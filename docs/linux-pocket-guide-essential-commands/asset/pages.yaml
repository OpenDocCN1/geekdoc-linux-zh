  md: 'LVM solves these problems by wrapping a layer of abstraction around physical
    storage. It collects together a bunch of physical disks of any sizes, called physical
    volumes, to simulate one disk, which it calls a volume group. The volume group
    becomes a playground for creating simulated partitions, called logical volumes,
    which can grow and shrink on demand. Figure 4-1 shows the relationship between
    physical volumes (PVs), the volume group (VG) that contains them, and logical
    volumes (LVs) that you carve out of the total space. If the VG runs out of space,
    simply add another physical volume and the VG grows. If a partition (LV) is the
    wrong size, just change it. Existing files are preserved. Any storage devices
    can be part of a volume group, even RAID arrays created with madam (see "RAID
    Arrays for Redundancy" on page 224).


    ![](img/dd09ac8c00ea7e7983be7cf6460cc90d_230_0.png)


    Figure 4-1. LVM concepts. Physical volumes (PV) are collected into a volume group
    (VG). Logical volumes (LV) are carved out of the VG.


    The most popular LVM software for Linux is called lvm2. It includes over 50 commands,
    which might seem like a lot, but their names follow a simple pattern: pv, vg,
    or lv, followed by a verb like create, remove, or display. So vgcreate creates
    a volume group, and pvsdisplay prints information about a physical volume.'
  merge: -1
  pgno: 230
- img_proc: true
  md: "# WARNING\n\nLVM operations can wipe out filesystems without confirmation.\
    \ Practice the commands on spare drives or a virtual machine for safety.\n\nAlso,\
    \ LVM provides no inherent redundancy. If one physical volume dies, you lose the\
    \ whole volume group. For more safety, run LVM on top of RAID; see \"RAID Arrays\
    \ for Redundancy\" on page 224.\n\nI now present examples of using the most common\
    \ lvm2 commands, using empty 10 GB disk partitions, /dev/sdb1, /dev/sdc1, and\
    \ /dev/sdd1 has dozens more commands, however. For a full list, view the manpage\
    \ of any lvm2 command and jump to the end or visit sourceware.org/lvm.\n\n# Create\
    \ a First Logical Volume\n\nThis sequence of steps sets up two physical volumes,\
    \ groups them into a 20 GB volume group, myvg, and creates a 15 GB logical volume,\
    \ staff:\n\n+   - sudo pvcreate /dev/sdb1 /dev/sdc1  Create two PVs\n  Physical\
    \ volume \"/dev/sdb1\" successfully created.\n  Physical volume \"/dev/sdc1\"\
    \ successfully created.\n- sudo vgcreate myvg /dev/sdb1 /dev/sdc1  Create a VG\n\
    \  Volume group \"myvg\" successfully created\n- sudo lvcreate -L 15G -n myvg\
    \  Create the LV\n  Logical volume \"staff\" created.\n- sudo pvs  View the PVs\n\
    \n| PV VG Fmt Attr PSize PFree |\n| /dev/sdb1 myvg lvm2 a-- <10.00g 0 |\n| /dev/sdc1\
    \ myvg lvm2 a-- <10.00g 5.34 |\n\n> 4 Operate on partitions rather than whole\
    \ disks."
