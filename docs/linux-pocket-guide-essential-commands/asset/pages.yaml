  md: '# Useful options


    +   -U name

    If a site is blocking wget, set the useragent to present as a different browser.
    Try -U mozilla.

    -O filename

    Write all the captured HTML to the given file.

    -i filename

    Read URLs from the given file and retrieve them in turn.

    -c

    Continue an interrupted download. For example, if wget downloaded 100K of a 150K
    file, wget -c retrieves the remaining 50K. wget can be fooled, however, if the
    remote file has changed since the first (partial) download, so use -c only if
    the remote file hasn''t changed.

    -t N

    Try N times before giving up. N=0 means try forever.

    --progress=dot

    Print dots instead of bars to show download progress.

    --spider

