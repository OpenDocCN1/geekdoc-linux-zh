- img_proc: true
  md: 'like a RAID-1 setup. They might operate as a disk cache; and there are other
    possibilities.


    A collection of vdevs is called a pool. A pool acts like one big storage device.
    You can carve it into units that sort of like partitions, called datasets, and
    you can change their size limits and other attributes flexibly. Dataset names
    like Linux paths without a leading slash. For example, a pool named mypool with
    a dataset named stuff would be named mypool/stuff. (Datasets can contain other
    datasets too, like mypool/stuff/important.) Add a leading slash, and you get the
    dataset''s default Linux mount point, like /mypool/stuff.


    ZFS isn''t the only filesystem with advanced capabilities—another popular one
    is Btrfs—but it''s among the easiest to configure.


    # NOTE


    I discuss only the minimal ZFS functionality to do interesting. Real ZFS systems
    need careful configuration, tuning, and plenty of RAM; read the docs at https://oreil.ly/-t5Fu.


    I demonstrate ZFS with both mirroring and striping, I use two pairs of disks,
    as in Figure 4-2. Each pair is a vdev with mirroring (RAID-1). ZFS then stripes
    across the two vdevs (RAID-0), effectively creating a RAID-10 setup. This redundant
    pool can tolerate one failed drive in each vdev and keep the data safe.'
