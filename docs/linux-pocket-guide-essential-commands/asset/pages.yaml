  md: '# First Things First


    Welcome to Linux! If you’re a new user, this book can serve as a quick introduction,
    as well as a guide to common and practical commands. If you have Linux experience,
    feel free to skip the introductory material.


    # What’s in this Book?


    This book is a short guide, not a comprehensive reference. I cover important,
    useful aspects of Linux so you can work productively. I do not, however, present
    every single command and every last option (my apologies if your favorite was
    omitted), nor delve into at detail about operating system internals. Short, sweet,
    and essential—that’s our motto.


    I focus on commands, those pesky little words you type on a command line to tell
    a Linux system what to do. Here’s an example command that counts lines of text
    in a file, myfile:


    ```

    wc -l myfile

    ```


    This book covers important commands for most users, such as ls (list files), grep
    (search for text), mplayer (play audio and video files), and df (measure free
    disk space). I touch only briefly on graphical environments like GNOME and KDE
    Plasma, each of which could fill a Pocket Guide by itself.'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'I''ve organized the material by function to provide a concise learning path.
    For example, to help you view the contents of a file, I introduce many file-viewing
    commands together: cat for short text files, less for longer ones, od for binary
    files, and so on. Then I explain each command in turn, briefly presenting its
    common uses and options.


    I assume you have access to a Linux system and can log in. If not, it''s easy
    to try out Linux on most computers. Just download and install a “live” Linux distribution
    onto a USB thumb drive and boot it. Examples are Ubuntu, Fedora, and KNOOPPIX.


    # What''s New in the Fourth Edition?


    New commands


    I''ve added 50 new commands to this edition, such as git and svn for version control,
    split and column for text manipulation, pandoc and ffmpeg for file conversion,
    snap and flatpak for package management, mdadm, lvcreate, and zfs for fancy storage
    management, gpg for encryption, and many others.


    Clearer organization


    I''ve reorganized the book into chapters on concepts, files, basic system administration,
    networking, and other topics.


    Goodbye, ancient commands


    Some commands from previous editions of this book are mostly obsolete today, such
    as write and finger, or deprecated, such as ftp. I''ve replaced them with more
    relevant commands for modern Linux systems.


    # Conventions Used in This Book


    Each command I present in this book begins with a standard heading. Figure P-1
    shows the heading for ls, a command that lists the names and attributes of files.
    The heading demonstrates the command''s general usage in a simple format:


    x | First Things First'
