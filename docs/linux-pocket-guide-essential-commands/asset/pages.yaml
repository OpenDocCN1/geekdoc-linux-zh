  md: '# Filesystem Maintenance


    # Using Disks and Filesystems


    +   - df Display available space on mounted filesystems.

    - lsblk List disks and other block devices.

    - mount Make a disk partition accessible.

    - umount Unmount a disk partition (make it inaccessible).

    - fsck Check a disk partition for errors.


    Linux systems can have multiple disks or partitions. In casual conversation, these
    are variously called devices, filesystems, volumes, even directories. I''ll try
    to be more precise.


    A disk is a mass storage device, which may be divided into partitions that act
    as independent devices. Disks and partitions are represented on Linux systems
    as special files in the directory /dev. For example, /dev/sda7 could be a partition
    on your hard drive. Some common devices in /dev are:


    +   - sda First block device, such as SCSI, SATA, or USB hard drives; partitions
    sda1, sda2, . ...

    - sdb Second block device; partitions are sdb1, sdb2, . . . Likewise for sdd,
    etc.'
