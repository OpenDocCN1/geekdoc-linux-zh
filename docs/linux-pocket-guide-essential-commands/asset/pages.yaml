  md: '# Beyond Mail Readers


    Email is more “transparent” on Linux than other platforms that merely display
    your mailbox and send and receive messages. The ability to list outgoing email
    messages with mail is just one example. Here are some other options to whet your
    appetite and encourage you to explore.


    +   - Process your mailboxes with any command-line tools, such as grep, because
    mail files are plain text.

    - Manually retrieve messages from a remote mail server at the fetchmail command.
    Using a simple configuration file, this command can reach out to IMAP and POP
    servers and download mail in batch.

    - Run a mail server, such as postfix, for complex mail delivery situations; see
    “Email Servers” on page 266.

    - Control local mail delivery in sophisticated ways with the procmail command,
    which filters arriving mail messages through any arbitrary program. See man procmail.

    - Perform spam filtering with the SpamAssassin suite of programs. Run it personally
    on your incoming email or at the server level for large numbers of users.


    In short, email is not limited to the features of your mail-reading program. Investigate
    and experiment!


    # Email Servers


    Configuring a mail server is a complex job that can’t be taught in a few pages,
    so I just present some common operations. For Postfix, one of the most popular
    mail servers, I assume it''s already running on your local host. In case you don''t
    have a mail server yet, I also present Nullmailer, a simpler service that relays
    your mail to another server for delivery.'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# Postfix: A Full-Featured Mail Server


    Postfix is a powerful and popular mail server, and it''s controlled by the postfix
    command. Important configuration files for the server are located in the directory
    /etc/postfix:


    main.cf


    Variables that control Postfix''s behavior, such as your server''s name and domain,
    locations of important files, size limits on mailboxes and incoming mail, and
    more. After changing this file, run sudo postfix reload for the changes to take
    effect.


    master.cf


    Defines how Postfix runs various services. Most users don''t commonly edit this
    file, but if you do, run sudo postfix reload for the changes to take effect.


    postfix-files


    Defines the correct permissions for all Postfix files. These permissions are critical
    for email security. Most users won''t modify this file. To restore a Postfix installation
    to these permissions, run sudo postfix set-permissions.


    sasl_passwd


    Authentication information for connecting to a remote SMTP provider. After changing
    this file, run sudo postmap /etc/postfix/sasl_passwd for the changes to take effect.
    The format is:


    ```

    [smtpserver]:port username:password

    ```


    where smtpserver is the remote SMTP server, port is its TCP port number (optional),
    and username and password are the authentication credentials. For example:


    ```

    [smtp.example.com]:587 smith:SEEKRIT_PASSWUR

    ```'
