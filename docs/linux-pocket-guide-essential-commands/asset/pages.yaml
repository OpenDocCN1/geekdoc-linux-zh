    # Powerful manipulations


    Linux has hundreds of other filters that produce ever more complex manipulations
    of the data. But with great power comes a great learning curve, too much for a
    short book. Here are a few of the most capable filters to get you started.


    # awk


    AWK is a pattern-matching language. It matches data by regular expression and
    then performs actions based on the data. Here are a few simple examples to process
    a text file, myfile.


    Print the second and fourth word on each line:


    +   → awk ''{print $2, $4}'' myfile


    Print lines that are shorter than 60 characters:


    +   → awk ''length < 60 {print}'' myfile


    # sed


    Like AWK, sed is a pattern-matching engine that manipulates lines of text. Its
    syntax is shared by several other Linux programs, such as Vim. For example, print
    a file with all occurrences of the string “me” changed to “YOU”:


