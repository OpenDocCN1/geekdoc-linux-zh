  md: '# kill


    kill [options] [process_ids]


    The kill command sends a signal to a process. This can terminate a process (the
    default action), interrupt it, suspend it, crash it, and so on. You must own the
    process, or be the superuser, to affect it. To terminate process 12343, run:


    +   → kill 12343


    If this does not work—some programs catch this signal without terminating—add
    the -KILL or (equivalently) -9 option:


    +   → kill -KILL 12343


    which is virtually guaranteed to work. However, this is not a clean exit for the
    program, which may leave resources allocated (or cause other inconsistencies)
    upon its death.


    To learn the PID of a process, run ps and examine the output, or better yet, run
    pgrep to produce the PID directly:


    +   → ps -uax | grep emacs

    smith 8374 ... emacs myfile.txt Actual emacs process

    smith 9051 ... grep emacs Spurious result to ignore

    → pgrep emacs More accurate output


    Now kill process by PID, or kill it by name using command substitution (see “Command
    substitution” on page 45):


    +   → kill 8374 Kill by PID

    → kill $(pgrep emacs) Kill by name


    Or use the pkill command to kill all processes for a given program:


    +   → pkill emacs'
