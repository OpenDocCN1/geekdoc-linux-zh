    \    wget https://example.com/photo2.jpg\n    :\n    wget https://example.com/text100.jpg\n\
    \nYes, you've constructed the set of 100 commands. Now pipe the output to bash,\
    \ which runs all 100 commands as if you'd typed them by hand:\n\n+   - for i in\
    \ `seq 100`\n  do\n    echo wget https://example.com/photo$i.jpg\n  done | bash\n\
    \nHere's a more complex but practical application. Suppose you have a set of files\
    \ you want to rename. Put the old names into a file `oldnames`, and the new names\
    \ into a file `newnames`:\n\n+   - cat `oldnames`\n  oldname1\n  oldname2\n  oldname3\n\
    - cat `newnames`\n  newname1\n  newname2\n  newname3\n\nUse the commands paste\
    \ and sed (“Manipulating Text in Files” on page 107) to place the old and new\
    \ names side by side and prepend the word “mv” to each line, and the output is\
    \ a sequence of “mv” commands:"
  merge: -1
  pgno: 326
- img_proc: true
  md: '```

    → cat oldnames \

    | paste -d'' '' oldnames newnames \

    | sed ''s/^/mv'' /'' \

    mv oldfile1 newfile1

    mv oldfile2 newfile2

    mv oldfile3 newfile3

    ```


    Finally, pipe the output to bash, and the renaming takes place!


    ```

    → cat oldnames \

    | paste -d'' '' oldnames newnames \

    | sed ''s/^/mv'' /'' \

    | bash

    ```


