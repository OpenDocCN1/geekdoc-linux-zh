    # # Programming with Shell Scripts


    Bash has a built-in programming language. You can write shell scripts (bash programs)
    to accomplish tasks that a single command cannot. The command reset-lp, supplied
    in the book''s examples directory, is a shell script that you can read:


    +   - ~/linuxpocketguide/reset-lpg


    Like any programming language, bash has variables, conditionals (if-then-else),
    loops, input and output, and more. Entire books and online courses have been written
    on shell scripting; I cover the bare minimum to get you started. For greater detail,
    run info bash, pick up a bash scripting book, or search the web for bash scripting
    tutorials.


    # # Creating and Running Shell Scripts


    To create a script, simply put bash commands into a file as you would type them.
    To run the script, you have three choices:


    Prepend #!/bin/bash and make the file executable


    This is the most common way to run scripts. Add the line:


    #!/bin/bash


    to the very top of the script file. It must be the first line of the file, left-justified.
    Then make the file executable:


    +   - chmod +x myscript


    Then run the script. For a script in the current directory, you will probably
    have to prepend "./" so the shell can locate the script. (The current directory
    is generally not in your search path for security reasons. You wouldn''t want
    a malicious script named “ls” in the current directory to silently override the
    ls command.)


    +   - ./myscript'
