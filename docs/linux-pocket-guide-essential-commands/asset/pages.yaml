    # Backups and Remote Storage


    +   rsync | Efficiently copy a set of files, even across a network.


    +   rclone | Sync files with various cloud providers.


    +   dd | Low-level copying of data.


    +   growisofs | Burn a DVD or Blu-ray disc.


    You can back up your precious Linux files in various ways:


    +   - Copy them to a remote machine.


    +   - Copy them to a backup medium like an external drive.


    +   - Burn them onto a disc.


    I present a few popular Linux commands for backups, but there are others. Some
    users prefer cpio for its flexibility, and some long-time administrators swear
    by dump and restore as the reliable way to back up and restore every type of file.
    See the manpages for these commands if you are interested in them.


    # rsync


    ```

    stdout --file --opt --help --version

    ```


    ```

    rsync [options] source destination

    ```


    The rsync command copies a set of files. It can make an exact copy, including
    file permissions and other attributes (called mirroring), or it can just copy
    the data. It can run over a network or on a single machine. rsync has many uses
    and over 50 options; I present just a few common cases relating to backups.'
  merge: -1
