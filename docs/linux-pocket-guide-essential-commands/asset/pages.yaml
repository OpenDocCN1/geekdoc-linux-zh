  md: '# Creating a File Quickly


    Text editors create files on request, but you can also create an empty file (for
    later editing) at the command line with the touch command:


    +   - touchfile Create myfile if it doesn''t exist


    or use output redirection (see “Input, Output, and Redirection” on page 43) to
    create a file with or without contents:


    +   - echo -n > newfile2 Echo the empty string to a file

    - newfile3 Redirect nothing to a file

    - ls > newfile4 Redirect a command''s output to a file


    # Your Default Editor


    Various Linux programs run an editor when necessary. For example, your email program
    may invoke an editor to compose a new message, and less invokes an editor if you
    press “v”. Usually the default editor is nano or Vim. But what if you want a different
    default editor? Set the environment variables VISUAL and EDITOR to your choice,
    for example:


    +   - EDITOR=emacs

    - VISUAL=emacs

    - export EDITOR EDITOR


    Both variables are necessary because different programs check one variable or
    the other. Set them in a bash configuration file if you want your choices to stick.
    Any program can be your default editor if it accepts a filename as an argument.


    Regardless of how you set these variables, I recommend learning basic commands
    for all three editors in case another program unexpectedly invokes one on a critical
    file.


    > The -n option of echo suppresses the newline character.'
