    000020 000003 000076 000001 000000


    displays the bytes file /usr/bin/who in octal, eight bytes per line. The leftmost
    column is the file offset of each row, again in octal.


    If your binary file also contains character text, consider the -tc option, which
    displays character data. For example, binary executables like contain the string
    "ELF" at the beginning:


    +   - od -tc -w8 /usr/bin/who | head -3

