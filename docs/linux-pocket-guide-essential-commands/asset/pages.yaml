  md: '# printf


    printf format_string [arguments]


    The printf command is an enhanced echo: it prints formatted strings on standard
    output. It operates much like the C programming language function printf(), which
    applies a format string to a sequence of arguments to create specified output.
    For example:


    +   * printf "User %s is %d years old.\n" sandy 29

    User sandy is 29 years old.


    The first argument is the format string, which in our example contains two format
    specifications, %s and %d. The subsequent arguments, sandy and 29, are substituted
    by printf into the format string and then printed. Format specifications can get
    fancy with floating-point numbers:


    +   * printf "That''ll be $60.2, my friend.\n" 3

    That''ll be $3.00, my friend.


    Linux has two printf commands: one built into bash, and one in /usr/bin/printf.
    The two behave identically with small differences; for example, only the built-in
    printf can store output in a shell variable (with the -v option).


    Make sure the number of format specifications (%) equals the number of arguments
    to printf. With too few arguments, printf outputs default values (0 for numeric
    formats, an empty string for string formats). With too many arguments, printf
    iterates over the extras until they run out. Treat such mismatches as errors,
    even though printf is forgiving: they are bugs waiting to happen.


    +   * printf "%d %d\n" 10

    10 0

    * printf "%d %d\n" 10 20 30 40

    10 20 30 40'
