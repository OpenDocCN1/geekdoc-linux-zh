    od [options] [files]


    To view binary files, consider od (octal dump) for the job. It displays their
    data in ASCII, octal, decimal, hexadecimal, or floating point, in various sizes
    (byte, short, long). For example, this command:


    +   - od -w8 /usr/bin/who

