    # View LVM Details


    The pvdisplay, vgdisplay, and lvdisplay commands print details about physical
    volumes, volume groups, and logical volumes, respectively. The commands pvs, vgs,
    and lvs provide helpful summaries of that information.


    +   - sudo pvdisplay Show all PVs

