- img_proc: true
  md: '# Colophon


    The animal on the cover of Linux Pocket Guide is a Belgian horse. The first breeding
    of these gentle giants was recorded in the 17th century, with the creation of
    the first studbook in 1886. These horses are descendants of the Great Horse of
    medieval times. They were developed for industrial and farm work and hauling.
    They have a gentle, cooperative temperament, are willing to work, easy to handle,
    and rarely spooked. They are also adaptable to a wide range of environments.


    Belgian horses have a small head compared to the size of their body. They have
    a compact, short body with a broad chest and a wide back. They have a straight
    profile with kind eyes and a thick neck, which is particularly thick on stallions.
    Their legs are feathered around their medium-sized hooves. They stand between
    16 and 18 hands, with males being taller than females. They reach their full size
    around five years of age and can weigh between 1,800 and 2,200 pounds.


    While their predecessors may be extinct, Belgian horses are a very popular breed
    of draft horse and are not at risk of extinction. Many of the animals on O''Reilly
    covers are endangered; all of them are important to the world.


    The cover image is a color illustration by Kate Montgomery, based on an antique
    line engraving from Wood''s Animate Creation. The series design is by Edie Freedman,
    Ellie Volckhausen, and Karen Montgomery. The cover fonts are URW Typewriter and
    Guardian Sans. The text font is Adobe Minion Pro; the heading font is Adobe Myriad
    Condensed; and the code font is Dalton Maag''s Ubuntu Mono.'
  merge: -1
