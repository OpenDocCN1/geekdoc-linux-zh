    ssh [options] host [command]


    The ssh (Secure Shell) command securely logs you into a remote machine. If your
    local and remote usernames are the same, just provide the remote hostname:


    +   - ssh remote.example.com

    smith@remote.example.com''s password: xxxxxxxxxx


    Otherwise, provide your remote username as well:


    +   - ssh sandy@remote.example.com One syntax

    - ssh -l sandy remote.example.com Another syntax


    If you provide a command, ssh invokes it on the remote machine without starting
    an interactive login session:


    +   - ssh sandy@remote.example.com df Check free disk space


    ssh encrypts all data that travels across its connections, including your username
    and password. The SSH protocol also supports other ways to authenticate, such
    as public keys: see the sidebar "Public Key Authentication with SSH" on page 258.


    # Useful options


