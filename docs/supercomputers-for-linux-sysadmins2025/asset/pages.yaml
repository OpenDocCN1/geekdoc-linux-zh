- img_proc: true
  md: '# CHAPTER 21 COMPILERS AND ENVIRONMENTS, FOR PARALLEL TECHNOLOGIES


    set base /opt/mpi/openmpi-4.0.1-icc

    module-whatis "adds OpenMPI 4.0.1 build by Intel compilers".


    prepend-path PATH $base/bin/

    prepend-path LD LIBRARY_PATH $base/lib

    prepend-path MANPATH $base/share/man


    The first line of the module file should be ##Module1.0.

    If the version number (1.0) is omitted, the file format is assumed to be compatible

    with the latest version of Environment Modules.


    The module file is a program in Tcl language. Output to the standard error

    stream (stderr) will be shown to the user. It is not worthwhile to output anything
    to the

    standard output stream (stdout); it may spoil the whole module system.


    It is not necessary to know Tcl to write module files. As you can see, the syntax
    of the

    description is simple. The main actions are performed by prepend-path commands

    (append-path) - they change the contents of variables containing colon lists,
    such as

    PATH, LD_LIBRARY_PATH, and MANPATH. Many other actions are allowed, such as explicitly

    setting the value of a variable, deleting a variable, loading another module,
    etc. You can

    learn more about the syntax in the documentation, e.g., by typing man modulefile.


    The original Environment Modules project, also called Tcl modules or Tcl/C

    modules, developed for a while in 2012 with the release of version 3.2.10.

    The main drawbacks encountered with this version were difficulties in loading
    a package

    if another version was already loaded and in tracking dependencies between different

    modules (e.g., MPI implementations built with different compilers).


    To solve these and other problems, an alternative Lua Modules⁵ (LMOD) was

    created. As the name implies, this project is designed to use the Lua language
    for module

    files. At the same time, it can use files from the original modules written in
    Tcl,

    transl them on the fly. That is, LMOD can be used on a ready-made infrastructure
    of

    module files, allowing you to add new functionality to them.


    LMOD, solves the two problems already mentioned. When loading a\module for a package
    for which a module to support another version has already been

    loaded, the previously loaded module is automatically unloaded (the version change

    diagnostic is printed). This avoids the situation when two versions of the compiler
    are

    available at once, which can create a conflict between their runtimes.


    > ⁵https://www.tacc.utexas.edu/research-development/tacc-projects/lmod'
