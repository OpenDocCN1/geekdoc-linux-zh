  md: '# CHAPTER 13 JOB MANAGEMENT SYSTEMS


    full information about the allocated resources. Many MPI implementations have
    support for resource managers, and commands like mpirun typically can be executed
    without specifying the full nodes list. There is a special standard PMIx, which
    unifies the interface as resource managers, as for parallel libraries, like MPI.
    Using this interface, parallel program can start its processes using resource
    manager''s agents, which makes the program start fast and controllable.


    # Kubernetes, etc.


    There are still some cases when it is reasonable, but please, think twice before
    such instruments for managing your cluster resources.


    # Access Problem


    Resource management systems usually only allocate resources between tasks but
    do not always set strict restrictions on these resources. So user can sometimes
    run a task “directly” – bypassing the system by explicitly specifying a list of
    nodes to the mpirun command or by ssh-ing to the desired node and running his
    program there.'
