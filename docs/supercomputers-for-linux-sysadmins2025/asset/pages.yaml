  md: '# IPMI


    As it was mentioned in the “Remote Management” chapter, IPMI allows you to read
    many system sensors, as locally, as remotely. ipmitool and similar utilities can
    read sensors data, but note that often remote sensors reading may overload BMC
    controllers (depending on the model). I recommend using any metrics collector,
    like prometheus, and collect local sensors info via local IPMI interface. In addition
    to sensors, IPMI can store information about system events, which may be useful
    for hardware issues resolving.


    # APCUPS


    Computing clusters are usually used for solving large resource-intensive tasks.
    Therefore, it is very important to ensure their reliable uninterrupted power operation,
    and this task cannot be accomplished without the use of a quality uninterruptible
    power supply system. A system which includes both physical devices called uninterruptible
    power supplies (UPS) and software for organizing interaction between the power
    supply and the protected equipment.


    Uninterruptible power supply (UPS) is a device that provides power supply to electrical
    equipment connected to it in case of a short-term loss of voltage in the power
    grid. The main purpose of a UPS is to maintain equipment operability in the event
    of a short-term power failure, but the functionality of modern UPS is much broader.


    As a rule, the system is designed to provide power to the cluster for at 10–30
    minutes in the event of a power failure. If power is not restored within five
    minutes, the UPS must ensure the cluster is shut down correctly. Prepare and test(!)
    emergency shutdown scripts, taking special care for the proper storage un and
    shutdown.


    If your cluster uses APC UPSs, you can use apcupsd service to monitor the UPS
    equipment and react in case of emergency. The apcupsd package is a freely distributed
    software that allows organizing interaction with most APC UPS models. It consists
    of several components:


    +   - A daemon that receives information from available uninterruptible power
    supplies and generates signals for various events

    - A program that allows you to read the UPS status information'
  merge: -1
  pgno: 290
- img_proc: true
  md: 'Programs to adjust the parameters of its operation


    +   - A set of cgi-scripts allowing to use the web interface - to control and
    manage the UPS


    The acupsd package is included in many Linux distributions, but it is more practical
    to download the latest version as source code and install it yourself. This allows
    you to customize the package to your needs at the installation stage. The installation
    procedure is straightforward and is accomplished by sequential execution of three
    commands: configure && make make install. The only command that requires attention
    is configure, which defines the basic properties of the package. As a rule, it
    is executed with a set of parameters. In a typical case, the command looks as
    follows:


    ```

    ./configure \\n--prefix=/usr \\n--bindir=/sbin \\n--enable-threads \\n--enable-snmp
    \\n--enable-cgi \\n--with-libwrap=/lib64/libwrap.so.0 \\n--with-cgi-bin=/usr/apache/cgi-bin

