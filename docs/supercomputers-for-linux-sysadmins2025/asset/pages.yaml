    in frequency analysis. The library is a set of C and Fortran modules for computing
    the Fastest Fourier Transform (FFTW). FFTW allows you to work with both real and
    complex numbers, with an arbitrary input data size, i.e., with the data length
    not necessarily being a multiple of 2".


    The library also includes parallel FFT processing modules that allow its use on
    multiprocessor machines with shared and distributed memory. FFTW consists of four
    different variants of FFT calculation:


    +   - One-dimensional transformation for complex numbers

    - Multivariate transformation for complex numbers

    - One-dimensional transformation for real numbers

    - Multivariate transformation for real numbers


