    +   - **Job is running, new steps start and end via srun** - Also some plugins
    can handle these events (but rarely). During the job is running (and actually
    when not), Slurm can run a HealthCheckProgram - a script, which makes quick(!)
    and harmless(!!) checks of the node. If it fails, e.g., detects important errors
    in the kernel logs, or a GPU fail, then it may do some actions - usually drain
    the node. You can specify in which nodes state it should run and in which interval.


    +   - **Job preempted** - See the chapter about the preemption.


    +   - **Job ends** - It can happen if the batch script is finished, canceled,
    or if the job is out of the time limit. The Slurm sends to all job processes on
    all allocated nodes SIGTERM, then in some time SIGKILL. Then epilogue script is
    executed and plug-ins hooks, just like for the prologue. And I also recommend
    using it for additional checks and cleanups.


    Note - If prologue script fails (returns nonzero code), Slurm stops the job start,

    drains the node, and neither cancels the job or requues it. Be careful in the
    prologue and epilogue scripts.


    # # scontrol


    The next important command is scontrol. With its help, you can quickly change
    the state of partitions, nodes, tasks, and much more. Regular users can use it
    to check full status of a partition of a job and hold/unload their jobs if needed.
    The command has many subcommands, Table 15-5 presents the most interesting ones.'
  merge: -1
