    An InfiniBand Host Channel Adapter (HCA) is installed in each device connected
    to the InfiniBand network (a cluster node, typically referred to in InfiniBand
    literature as a Processor Node, Storage Server, etc.). The standard provides a
    simplified version of the HCA, called TCA (Target Channel Adapter), which was
    intended to be used for connecting storage systems, but this type of adapter has
    not been modern.


    An adapter can have several ports to connect to the network. An InfiniBand network
    (also called InfiniBand Fabric) consists of adapters that are connected by switches
    and routers. Switches and routers always have more than one port. Each switch
    has a dedicated virtual port 0, through which the switch can be managed.


    The ports to which switches are directed are end ports. A set of adapters connected
    by switches make a subnet. Subnets have a limit on the number of devices it can
    contain – no more than 2¹⁵ + 2⁴ - 1 = 49,151 end ports and switches. Subnets are
    connected using routers, allowing the creation of InfiniBand fabrics of virtually
    unlimited size.'
