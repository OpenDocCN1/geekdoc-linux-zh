    # IPMI


    Intelligent Platform Management Interface is a standard for remote server management.
    The standard assumes the presence of a special component in the server hardware
    - management controller (MC). In fact, it is a small independent server that monitors
    the performance of the main server by various sensors (e.g., I2C, SMB buses).
    It is able to manage the power of the main server and emulates a serial port for
    the main server, through the MC, if the OS is configured correctly. MC can (must!)
    be configured for access to it out-of-band, over the network, which allows remote
    access to information about the state of the server, even if it is hung, as well
    as to reboot or simply shut down.


    Since IPMI is an open standard, there are several implementations of its client
    part. For Linux, the most popular are ipmitool and openipmi. We will take a look
    at ipmitool and give the most common scenarios of its use. The ipmitool package
    is available in all popular distributions, install it through the package manager,
    including compute nodes.


    Most often network access to MC is disabled by default, and you need to enable
    it from the BIOS (which is not always implemented in the BIOS itself) or from
    the OS on the node. The second method always works, so let''s consider it. First,
    you need to load the kernel modules that are responsible for communication with
    MC, if these modules are not already loaded or statically connected to the kernel:'
