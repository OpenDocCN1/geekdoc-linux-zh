  md: '# CHAPTER 16


    # # Containers


    Today, many applications are available via docker containers – in most cases,
    they help avoid dependency hell while recompiling or trying to run a single binary.
    What is the container? Simply put, it is an isolated set of processes, which don''t
    have any access to other processes and are limited to access full network, full
    file system, devices, etc. It is similar to a virtual machine, but there is no
    emulation; all processes are real, and from the "top level," you can see all of
    them.


    In Linux, it is possible to cgroups, namespaces, and chroot technologies. Cgroups
    allow you to limit sets of processes in memory, CPU, network, devices, and some
    other resources. Namespaces help to isolate PIDs, UIDs, etc., so processes in
    one namespace do not see others and can have "virtual" numbers. chroot is a very
    old kernel trick, which allows to change root of the file system for the process
    to any directory.


    Container actually is a combination of those technologies, applied to a set of
    processes. For example, if you want to test a new database, but don''t want to
    install it into your system, as it will conflict with the existing one. If you
    have a container with this database, it has a file system with all needed files,
    like binaries, libraries, and even its libc. When you start this container, this
    file system is mounted into yours, then a set of cgroups and namespaces is created,
    and finally, the first container process is started with chroot mounted file system.


    As a result, all processes in the container have access only to other processes
    in the same container. They have their own set of users and have access to the
    file system dedicated to it as if it were the root file system. From the network
    perspective, it is a bit more complicated, but the overall idea is the same –
    you can limit the container to "see" only certain interfaces, usually virtual,
    which you created especially for this container. There may be many options. You
    can even allow this container to use no more than 20% of your memory or 1 CPU
    core.


    Docker is the most popular container technology today, and in addition to all,
    it squashes – "layered" file system. The idea is to have a "base" file system,
    e.g., a freshly installed Ubuntu, which is a first layer, then you can install
    some libraries and'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# CHAPTER 16 CONTAINERS


    other software and “save” all changes in a second layer. And you can continue
    to create new layers as far as you want – all changes will be saved (even file
    deletions). All layers are stored in the docker repository and/or on your docker
    storage. If you install one container, all its layers are cached on your file
    system, and if you install a second one, which has some same layers (e.g., is
    based on the same Ubuntu version), only new ones will loaded. To save space and
    memory. If you have worked with docker and know about Dockerfile format, you may
    know that every line in this file creates a new squashfs layer (OK, almost every).
    When you change the line and rebuild the container, it will be rebuilt from the
    changed line, because all previous layers are unchanged.


    “OK, but I need to process my data!”, a user would say. No problem, in Linux,
    you can mount local directory as a file system into any other directory, using
    ‘bind’ key. Using this trick, you can make your directory with data or anything
    else in the container. By default, all container systems allow you to specify
    what you want to mount and what path inside the container.


    How can we use docker in HPC? Unfortunately, docker technology has a lot of limitations,
    and we almost cannot use it in HPC in 2025. By default, docker requires a special
    service, running with root privileges, does not allow using InfiniBand and GPUs
    directly, and badly integrates with job managers. There are ways to overcome those
    and some other issues, but fortunately, we have many other technologies, which
    allow using containers and even prebuilt docker containers. Let’s talk about the
    most useful today.


    # Singularity


    This is the project by Sylabs Inc., but it has a mature open source community
    edition. It uses its own format, but you can easily convert a docker container
    into singularity. There is an option to run a docker container “directly,” but
    actually singularity will import it, convert, run, and then delete one, so it
    is not recommended.


    Also, you can build a singularity container using special “definition file,” similar
    to Dockerfile. Singularity containers were designed especially for HPC and can
    be easily integrated with any batch system. It allows HPC applications to have
    transparent access to InfiniBand interfaces and GPU accelerators. To use it with
    NVIDIA GPUs, you should have nvidia-container-toolkit installed.'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'To run an MPI application in the singularity container, you can use a command
    like this:


    ```

    mpirun -n $NP singularity run app.sif /opt/my-mpi-app

    ```


    Here, NP is the number of processes, app.sif is the singularity container, and
    /opt/my-mpi-app is the path to the MPI application inside the container. This
    command line can be used inside the batch file. In case of SLURM, we''d recommend
    to use srun instead of mpirun.


    Read more about singularity here: https://docs.sylabs.io/guides/latest/user-guide.


    # Appptainer


    This technology is a fork of singularity, developed independently by the Linux
    Foundation. Almost everything, related to the singularity, is applied to apptainers.


    Actually, versa, the singularity was a fork, but it is a bit complicated; if you
    want, you can read some details here: https://apptainer.org/news/community-announcement-20211130.


    # CharlieCloud


    The open source technology, similar to singularity, but is intended to be lightweight
    and uncomplicated. It contains several utilities, ch-image, ch-build, ch-run,
    and ch-convert, and allows you to deal with docker images, extract the squashfs,
    build your containers, and run squashfs as a container. It integrates with job
    management via PMIx, so its is pretty simple.


    # Pyxis + Enroot


    These projects are open source and developed by NVIDIA, so only NVIDIA GPUs will
    be well managed if you use them. Enroot is a lightweight container implementation;
    it doesn''t require docker or other container engine to be installed. When you
    run the'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'container using enroot, it extracts the squashfs into the local file system
    then runs the application with cgroups/namespaces/chroot set. Pyxis is a complimentary
    SLURM plug-in, which adds some useful flags to srun command and runs the container
    using enroot transparently. This technology is really easy to use and requires
    minimum overhead, comparing to the other options.


    # Caching


    If you use containers, please be ready that each process before the start will
    download this container, prepare it (unpack/convert/etc.), and then start. It
    takes time and also forces the container images to be downloaded many times and
    often at the same time. This is not efficient, so I recommend to


    +   - Stimulate your users to load containers into the shared file system and
    reuse loaded images.


    +   - Use caching options when available (Charliecloud and Enroot) give you some.


    +   - Use special caching proxy, like docker-registry-proxy project. Regular proxy
    may not be a good choice, because docker image registries frequently require authorization
    and also you don''t to cache manifests (at least for a long time).


    # Brief Summary


    Containers are a lightweight option of virtual machines; they are convenient to
    use if you need to run applications without installing new packages or compiling
    them from the source code. In HPC world, you should be cautious, because you need
    low-latency access to devices and ability to run MPI applications.


    # Search Keywords


    Linux Containers, Docker, Open Container Initiative, cgroups, linux kernel namespaces,
    chroot, singularity, apptainer, charliecloud, enroot, pyxis'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# CHAPTER 17


    # Clouds


    If you don''t have an HPC cluster and cannot build it right now but need to run
    HPC computations, you can try to get access to an existing one. Another option
    is build your own HPC cluster in clouds. Today, some cloud providers give you
    special HPC instances - virtual machines with almost transparent access to high-performance
    network and accelerators. Please note that the overall performance will still
    be less than on a “real” hardware, depending on the provider, it can have a 5-15%
    performance drop. If it is OK to you, let''s take a look to the details.


    A very important aspect is price; carefully cluster would expenses, it might turn
    out that building and managing an on-prem cluster would be even cheaper in the
    long term! Cloud can be a perfect playground to test technologies and software
    before production use. Some cloud providers give you almost raw HPC hardware today,
    so you can imitate almost cluster.


    Before you buy cloud resources, precisely check which type of the network is used
    and what resources are included into your instances. In many cases, if you use
    a high-performance-low-latency network, you are limited in number of instances,
    which can be connected. Make sure they are in one performance subnet (capacity
    reservation, domain, etc.). Otherwise, the overall performance can be times lower.


    Network file system is really important, and you should ensure that you have access
    to a good one. If it is just an NFS volume, probably it is not what you want.
    If the cloud provider give you performance estimations, you can try to buy cheap
    instances with run I/O performance tests, ideally similar to your production I/O.
    For example, you know that your HPC application saves temporary data every five
    minutes and size is around the compute node memory. Then you can simulate this
    pattern and check long this saves and how long it loads from the file system.


    Some cloud providers allow you to bring up a SLURM-based HPC cluster as an option.
    In simple cases, it may be really useful. But if there is no such option, or you
    need some features, not included in this option, you can bring it by yourself.
    I recommend'
  merge: -1
  pgno: 261
- img_proc: true
  md: '# CHAPTER 17 CLOUDS


    to use automation tools like terraform for the initial setup. After bringing up
    the nodes, you need to install all needed software, and this process also should
    be automated. You can use Ansible or other tools. If it is possible to create
    a custom image and use it on new nodes, this will be the best solution. Some cluster
    management tools, like BCM, can help you manage them. Test your solution on cheap
    instances!


    Check the cloud API to be able to automate any additional actions, like terminating
    the instance and bringing up a new one, or just power on/off any subset of instances.


    Via cloud API, you might be able to collect useful metrics, like power consumption,
    network counters, node health, etc. If it is possible, use this ability. If not,
    try to collect as much as you can directly on the nodes.


    All questions, you have to check before building an on-prem cluster, are actual
    in the cloud, but may be slightly corrected. For example, user management may
    be integrated with your corp authentication mechanisms, but may be implemented
    independently. Checking nodes and reporting service tickets may be automated via
    cloud provider API. Take another look at the chapter “How to Build and Start It?”


    # Brief Summary


    Many HPC applications can be run on HPC clouds today, and in some cases, it may
    be a cheap solution. Amazon, Oracle, Google, Coreweave, Lambda, and HyperStack
    are just a few providers I can name off the top of my head.¹¹ But don’t underestimate
    the management overhead and limited choice of assets in the cloud environment.
    Check for the network and storage options, price for traffic, price for turned
    off nodes, and other possibly hidden factors. Make a test, try to assess the risks
    and performance first.


    # Search Keywords


    HPC cloud, HPC cloud network, Cloud security, Low-latency cloud network


    > ¹ Not an advertisement, they don’t pay me :'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# CHAPTER 18


    # Remote User Access


    # SSH


    This is the main method of remote access to supercomputers today. Don''t be intimidated
    by the fact that access will be on the command line and your users are working
    in graphical environments. They only need to know a few commands to work, and
    if they use open source projects that require building or developing programs
    themselves, the command line is no longer scary for them.


    To ease the plight of newcomers, I recommend installing the mc (Midnight Commander)
    file manager package on the access node, the interface which is very similar to
    Far Manager or TotalCommander for Windows or other "two-panel" managers. Our experience
    shows that beginners rarely have problems in communicating with the command line,
    because for them, the set of operations is limited to putting a task in the queue
    and viewing its status. Copying files from to a cluster is done in a convenient
    client on a personal computer, and editing is also done.


    So, to organize remote access, we need to install openssh server (see chapter
    "Remote Management") and configure it for the mode we need. The "classic" password
    access will work by default, but I advise against it. Pass can be allowed from
    a limited set of addresses (from administrator workstations) and only to a limited
    set of users. This may be necessary to resolve emergency situations.


    For regular users, I recommend allowing access only by key. When registering,
