  md: '# CHAPTER 25


    # # Out-of-the-Box Stacks\ and Deployment Systems


    As we have seen, it is not easy to install the software of an entire cluster.
    And it still needs to be updated, new software installed, etc. Linux “cluster
    distributions” were created to simplify this task. Unfortunately, they only solve
    the problem of cluster deployment to a limited extent. It is not always possible
    to install additional software, commercial, or even open source tools in them.
    I don’t recommend using them if your cluster will not work with a limited set
    of tasks, but with a growing set of tasks or if users will compile their own or
    open source packages. But if the set of tasks is small, and they can successfully
    work with the stacks under consideration, using them can save you a lot of time
    and effort. Let’s take a look at some of them.


    # ## ROCKS


    This project was developed by the National Partnership for Advanced compute Infrastructure
    and San Diego Supercomputer Center in 2000. The distribution is based on the RedHat
    distribution, but currently uses CentOS. A modified version of the RedHat anaconda
    auto-installer is used for automatic installation. The distribution is divided
    into so-called Roll CDs with software suites, e.g., for Java, Lustre, Ganglia,
    etc. It is possible to create Roll CDs yourself. All information about the cluster
    configuration is stored in a MySQL database, and you can update the installed
    software using new Roll CD images.


    For typical tasks and small configurations, this distribution may be a good choice.
    However, if you plan to use nonstandard or not-so-standard hardware, network topology,
    or applications, it can take a lot of time and effort to optimize and configure
    ROCKS.'
