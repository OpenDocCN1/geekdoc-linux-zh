    # # What “Super” Means to a Supercomputer Administrator


    At first glance, a large cluster is no different from many office computers connected
    by a local area network and a few standard servers – disk storage, etc. In fact,
    there are differences, and very important ones. Let’s start with the hardware
    – the requirements for a cluster are much higher. If in a local network you can
    temporarily replace a broken switch with a simpler one or even break the network
    connectivity for a few days (well, you will have to print reports on the second
    floor, bear with me), in a cluster, it is unacceptable. If we replace Infiniband
    switch (we''ll talk about them later) with Gigabit Ethernet or a node with 8 GB
    of memory of a node with 4 GB of memory, we can easily get a cluster that works
    badly and all users will flood us with complaints.


    It is strongly recommended that you have an emergency stock of all key components,
    unless they have a hardware redundancy, and a service agreement to replace the
    equipment within clearly defined SLAs.


    Let’s also remember that a cluster, unlike office computers, is packed on several
    square meters (a large one – on dozens, rarely – hundreds). Therefore, the cooling
    requirements for it are much higher; you can’t do that with an open window or
    a household air conditioner. Electricity for a supercomputer is much more than
    many office PCs, and household UPS will not be enough here, and you can’t plug
    it into a household socket or even a dozen of them.'
