  md: '# CHAPTER 10 REMOTE MANAGEMENT


    Let’s consider the most popular ssh server and client for Linux - openssh. In
    most distributions, the server and client are installed as separate packages.
    When installing the server, a host key is automatically generated. When you reinstall
    the ssh server, take care to save and restore the host keys!


    In addition to providing console access, the openssh server provides several other
    features. The most important ones are present in Table 10-1.


    # Forwarding Environment Variables


    SSH allows us to set environment variables (e.g., LANG) in a remote session to
    be the same as on the work computer running the ssh. The list of variables that
    the client passes is set in its configuration or on the command line, and the
    list of variables that the server can “cast” is set in the server configuration.


    The variable must be enabled for both client and server to be able to proxy. Some
    variables, such as LD_PRELOAD, are not allowed to be thrown unless specific server
    options are specified (see below).


    # Port Forwarding


    A very flexible tool that allows you to create a small proxy server for a single
    connection. There are two options for port forwarding – on the client and the
    server. Port forwarding on the client means that on your work computer, a connection
    on a given port will be automatically tunnelled to the ssh server.


    For example, you need to access an internal web server with the address 192.168.0.10,
    which is available only on the internal network. When running ssh, we will specify
    that we need to forward port 8080 to 192.168.0.10:8080. After that, the connection
    to local port 8080 will be automatically tunnelled to port 80 on the server. For
    the web server, this connection will look like a connection from the computer
    where the ssh is installed.


    This is easily done by the command


    ```

    ssh -L 8080:192.168.0.10 your.server.address

    ```


    Similarly, it is possible to forward connections in the opposite direction (a
    port on the server is forwarded to the client): assign a port on the server to
    which a connection will be established through a secure channel to a host accessible
    from the machine where the client is running. In this case, -R is used instead
    of the -L switch.


    142'
