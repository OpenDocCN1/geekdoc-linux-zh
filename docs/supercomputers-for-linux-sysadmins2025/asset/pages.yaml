    command on the server (if IPMI is configured for the first port).


    Example of running a sol session in ipmitool:


    ```

    ipmitool sol activate

    ```


    To exit a sol session, type “~”. Be careful if the same keyboard shortcut is used
    in ssh to end the ssh session. A complete list of available MC sensors, along
    with their values and other parameters, can be obtained with the sensor command
    or (in a slightly different form) sdr. To get the value and details of a sensor
    named NAME, use the command:


    ```

    ipmitool sensor get <NAME>

    ```


    To set up remote command execution, we need to create (or use an existing) user,
    give it a password and a network interface. Below is the command sequence that
    allows us to do:


    ```

    ipmitool user set name 3 adminuser

    ipmitool user set password 3 MYPASSWORD

    ipmitool user priv 3 4 1

    ```'
