- img_proc: true
  md: '# CHAPTER 30 SYSTEMMD – A SHORT COURSE


    PartOf=srv11 - All actions (start, restart, stop) on the specified unit will be
    performed on this unit as well.


    Conflicts=srvv1, ... - Starting this unit will cause the specified ones to stop
    and vice versa.


    Before=, After= ... - Specifies the launch order relative to other units, if they
    are launched simultaneously or by dependency.


    PropagatesReloadTo= ... - When restarting this unit, the specified ones will be


    ReloadPropagatedFrom= ... - When one of the specified units is restarted, this
    unit is restarted.


    StopWhenNeeded=false - Stop this unit if it is no longer needed for any other
    unit. The default is false, i.e., if the unit was started by dependency and the
    “parent” unit is stopped, this continues to work.


    You can also specify other options, but it is better to read about them in the
    documentation.


    The next section is Service; it describes the life cycle of our service and everything
    related to it. For the different types of units, this section will be omitted
    and replaced by a relevant one, e.g., for timer unit, service [Timer] will be
    used. The most necessary options are in this section:


    Type=... - Variant of Possible values:


    +   simple starts the program specified in the ExecStart option and monitors this
    process. Its completion means that the service is terminated.


    +   forking is similar to simple, but expect the program to call fork and create
    a new process group (a standard “daemonizing” mechanism in UNIX-like systems).
    It is recommended to specify the PIDfile if the program creates a PID file.


    +   oneshot is similar to simple, but expect the program is expected to terminate
    shortly, only running units by dependencies.


    +   dbus is similar to simple, but expect the program to register the name in
    D-Bus. The name is specified in the BusName= parameter.


    +   notify is similar to simple, but expect the program to call sd_notify and
    send a notification. Only after the notification, the units by dependencies will
    be started.'
