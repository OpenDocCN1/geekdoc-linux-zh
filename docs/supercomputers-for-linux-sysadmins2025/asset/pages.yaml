    We will look at DHCP and TFTP configuration in more detail later.


    Typically, a parameter is passed to the kernel to indicate that the root file
    system is located on a network drive. Linux so only supports NFS as a network
    root. it is theoretically possible to use other options (e.g., Lustre), but this
    would require a lot of manual work to optimize the initrd image. The best option
    is to use read-only NFS for the root system.


    When booting a large number of nodes, you should be careful and boot them one
    by one with an interval of at least one to two seconds. This is due to several
    factors. Firstly, it is dangerous for the infrastructure equipment to increase
    power consumption sharply; it may end with an emergency shutdown. Secondly, if
    a one-rank network and one DHCP/TFTP server are used, then at startup the network
    will be filled by broadcast requests. The servers may not be able to cope with
    the flow of UDP packets, since UDP is a protocol without reliable data transmission,
    some nodes will simply fail to boot. for "DDOS-attack" it is usually enough to
    have five to ten nodes booting at the same time.


    When mounting a network root, there is a problem with directories that should
    be writable - /tmp,/var, possibly others if specific software is installed. To
    avoid this, you can apply a tmpfs file system that uses RAM. For the /tmp directory,
    this is solved by simply writing to /etc/fstab. For /var, it is a bit more complicated,
    as it must include a subdirectories and the contents of some that do not change
    (e.g., /var/lib). One solution is to use /var on NFS and replace the directories
    in which the files should change with symbolic links to directories located on
    tmpfs or directly mount them as tmpfs. Careful using tmpfs, as it takes up RAM.
    Just in case, set a hard limit on its size=xxxMb or size=yy%, where xxx is the
    size in megabytes and yyy is the percentage of total memory. This parameter is
    specified in the options field in the /etc/fstab file.


