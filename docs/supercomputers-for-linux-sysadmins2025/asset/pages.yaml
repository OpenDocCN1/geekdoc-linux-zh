    use mpun_rsh command, and its keys differ from mpun keys from MPICH. At the moment,
    Mvapich''s performance is not superior to OpenMPI on most applications, but the
    project is actively developing, and perhaps, new implementations will outperform
    its competitors.


    # Proprietary MPI: Spectrum MPI and IntelMPI


    IBM has its own implementation – Spectrum MPI. It is tuned for use on proprietary
    IBM hardware, is based on OpenMPI, and supports InfiniBand and GPUDirect RDMA.
    It is well documented and recommended for use on IBM hardware.


    IntelMPI is another good choice; it is developed almost “from scratch,” has good
    InfiniBand support, is well optimized and documented, and is pretty tunable. In
    2025, it is free, but has support option.


    # SHMEM Library, OpenSHMEM Standard


    The SHMEM programming system (from “shared memory library”) was developed by Cray
    Research in 1999 as a one-way communications interface capable of becoming an
    effective alternative and complement to MPI and PVM. In, SHMEM realizes the simplest
    variant of PGAS-style programming (Partitioned Global Address Space). Each node
    has local memory; each node also has access to remote memory: a node can directly
    access the local memory of any node in the system.'
  merge: -1
