  md: '# X Connection Forwarding


    Similar to port forwarding, you can forward connection to the X server. Remember,
    the X server is your local server; it handles your graphical display, mouse, and
    keyboard. If you use Windows, you may run a Windows implementation of X server,
    like Cygnus, Xming, or its fork VcXsrv. When you run an ssh client locally and
    connect to the remote computer with X connection forwarded, you may run an X application,
    e.g., xterm over the remote computer, and it will show you the window on your
    local X server managed display. You cannot run your local browser, e.g., on the
    remote computer.


    You must have xauth program installed on both computers and be careful running
    remote sudo - you will need to pass your XAUTHORITY variable through it (remote
    variable, which ssh set after you have logged in).


    # File Transfer


    SSH has two built-in protocols for file transfer: SCP and SFTP. In addition to
    the not very convenient console clients of the same name, there are many client
    implementations, such as sshfs, built-in support for Linux/macOS in Nautilus/Dolphin
    for Gnome/KDE shells, FileZilla, WinSCP for Windows, and many others.


    # SSH Agent


    This is an ssh built-in tool for storing keys. At the beginning, the agent loads
    ssh keys from files and asks for passwords to decrypt them, stores them in memory.
    When new ssh/sftp connections are established, any data can be encrypted or decrypted
    with these keys via the agent. This is useful for loading keys not from the ~/.ssh
    directory or with nonstandard names. Access to the agent can also be forwarded,
    which means that on the remote computer, you will have access to all keys from
    the local computer, but indirectly, only be able to crypt/decrypt the data.


    In case of all forwards, data is transmitted in a single encrypted channel, and
    no additional connections to the ssh server are made. This means that the ability
    to connect to the server on port 22 (or other port if the ssh server configuration
    is nonstandard) is sufficient for operation.'
