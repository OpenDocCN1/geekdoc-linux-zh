  md: '# CHAPTER 26


    # # Cluster Management

    Systems – xCAT

    and Others


    As your cluster contains a lot of nodes, OSes, it is reasonable to have a system,
    which tracks all their names, addresses, and other attributes and helps you to
    update them and keep consistent. There are several solutions; the most popular
    open source (at the date of writing this book) is **xCAT**. We will talk about
    it and show how to use such systems, then we will mention some alternatives.


    xCAT – Extreme Cloud Administration Toolkit [http://xcat.org](http://xcat.org).
    This toolkit was developed by IBM and has been fully open source since 2007 and
    is actively developed. It is not a distribution, unlike ROCKS and PelicanHPC,
    but a cluster deployment and management system.


    xCAT can


    +   - Create OS images for downloading over a network or installing on a hard
    disk

    - Automatically perform image installation

    - Manage nodes via IPMI, ILO, and other protocols

    - Maintain information about hosts in the internal database and in TFTP, DHCP,
    DNS, and hosts databases


    Please note that not all OS and OS versions are supported. You can have problems
    using fresh images and/or kernel; make sure that all your drivers and system software,
    especially proprietary, are compatible!'
