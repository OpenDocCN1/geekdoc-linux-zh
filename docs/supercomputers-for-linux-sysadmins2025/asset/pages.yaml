  md: '# CHAPTER 2 WHAT IS “SUPER”?


    In modern clusters, the computing part can occupy less than a quarter of the total
    installation area; all the rest is taken up by climate and energy equipment. Control
    and management of this equipment (but not maintenance) can also be a part of the
