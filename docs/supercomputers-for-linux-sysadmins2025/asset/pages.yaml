  md: '# CHAPTER 23 BOOTING AND INIT


    or


    update-rc.d apache2 enable


    By default, apache2 will start at boot levels 3 and 5. The chkconfig and update-rc.d
    commands allow you to specify at which boot level the service would start.


    In standard UNIX systems, boot scripts were just ordinary scripts that prepared
    the environment for running daemons (otherwise known as services or services,
    which we will discuss later in a separate chapter) and took the words start or
    stop as command-line arguments.


    On Linux systems, init scripts are shell scripts, but they often already contain
    additional information about the procedure for running them, allowing the system
    to automatically determine when the script should be executed when the system
    boots. This information is specified in comments in the first lines of the script
    – the header. Here is an example of such a script header:


    ```

    ### BEGIN INFO

    # Provides: skeleton

    # Required-Start: $remote_fs $syslog

    # Required-Stop: $remote_fs $syslog

    # Default-Start: 2 3 4 5

    # Default-Stop: 0 1 6

    # Short-Description: Example initscript

    # Description: This file should be used to construct scripts to be

    # placed in /etc/init.d.

    # Should-Start: $portmap

    # Should-Stop: $portmap

    # X-Start-Before: nis

    # X-Stop-After: nis

    # X-Interactive: true

    ```


    Each line is labeled with a # comment icon. The chkconfig command analyzes this
    information when it creates references in the Rc.d directories. The Required-Start
    keyword specifies which services must be loaded by the time script runs. In this
    example, the remote file system services and the system log must be started.


    $ $remote_fs construct denotes a set of services required to maintain remote systems.
    Such services are described in the /etc/insserv.conf file.


    345'
