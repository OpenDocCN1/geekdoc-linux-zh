  md: "# CHAPTER 15 SLURM\n\n| Name | Meaning |\n| --- | --- |\n| Age | How long the\
    \ job was waiting in the queue |\n| Assoc | Each association can have this factor\
    \ value, so you can give boosts to groups of users, e.g., in different partitions\
    \ |\n| FairShare | See below |\n| JobSize | The number of nodes or CPUs a job\
    \ is allocated |\n| Nice | Users can use it to change their job priorities (usually\
    \ to lower it); it always has the coefficient = -1 |\n| Partition | Each partition\
    \ can have a priority, not a PriorityTier! |\n| QoS | Each quality of service\
    \ can have its own priority factor |\n| Site | Slurm can manage several clusters\
    \ (sites), and they can have different priorities; its coefficient is always =\
    \ 1 |\n| TRES | Each TRES has its own factor too |\n\nFor each partition, except\
    \ Nice and Site, you can set the coefficient by PriorityWeight[FACTOR]=number\
    \ line in the config. PriorityFairSmall says if JobSize factor prioritizes small\
    \ jobs or large jobs. PriorityMaxAge specifies which job time in the queue makes\
    \ this factor, by default it is seven days.\n\nFairShare is an algorithm, which\
    \ distributes resources according to number of \"shares\" it has. The idea is\
    \ to give each account some shares, like this: \nsacctmgr modify account fee fairshare=100\n\
    \nThen, if any job of this account running, its FairShare factor becomes lower.\
    \ proportionally to allocated resource, number of allocated_cpus*seconds. You\
    \ can change it, any TRES resources with weight using configuration file option\
    \ TRESBillingWeights, e.g.,nTRESBillingWeights=GPU=1.0,CPU=0.001,Mem=0.01G\n\n\
    In this example, if the job requires 2 GPUs, 16 CPUs, and 1024 G memory, the number\
    \ of shares will be calculated as 2*1.0 + 16*0.001 + 1024*0.001. There is another\
    \ method, when instead of sum, the maximum value of each weighted TRES is taken.\
    \ It may be turned on by the option PriorityFlags=MAX_TRES in the config file.\
    \ It is a list; you can have different flags together."
