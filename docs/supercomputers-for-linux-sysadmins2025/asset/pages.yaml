- img_proc: true
  md: '# CHAPTER 9 NETWORK FILE SYSTEMS


    and the rest of the file (after 256 megabytes) on 8 OSTs with stripes of 1 megabyte
    size.

    See Figure 9-2 for the graphical representation of this layout. Note that OST’s
    indexes are here just for the illustration; they are chosen randomly and can repeat
