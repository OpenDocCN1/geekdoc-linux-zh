  md: '# CHAPTER 26 CLUSTER MANAGEMENT SYSTEMS – XCAT AND OTHERS


    You can change data in tables with the tabedit command – the editor defined by
    the EDITOR variable will open, and you can edit one or more rows of the table.
    If you need to change just one key, or do it in a script, the chtab command will
    come in handy. Here is an example of its use:


    ```

    chtab key=tftpd site.value=/tftpboot

    ```


    Since some descriptions can affect multiple tables, there is a chdef command.
    Here is an example of its use:


    ```

    chdef -t node=node01 groups=all,compute

    ```


    Here we change the object of type "node", named node01, and specify that it is
    now a member of the "all" and "compute" groups. This change will affect both the
    node and group descriptions.


    For some objects, such as nodes, there are specialized commands and the previous
    action can be performed like this:


    ```

    nodech node01 groups="all, compute"

    ```


    The lsdef command has a -z switch, which can be used to save the current object
    description, which can be edited and then loaded back with the mkdef -z command:


    ```

    lsdef -z node01 > /tmp/n01.stanza

    vi /tmp/n01.stanza mkdef -z

    cat /tmp/n01.stanza -z

    ```


    What objects does xCAT support? Here is a partial list:


    +   * site (cluster(s))

    * node

    * group (group of nodes)

    * network (subnetwork)

    * osdistro (OS distribution)

    * osimage (OS image)

    * route (routing description)'
