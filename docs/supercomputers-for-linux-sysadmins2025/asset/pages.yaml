  md: '# CHAPTER 9


    # Network File Systems


    Starting with this chapter, we will not only talk about the technologies used
    in supercomputers, but also give practical recommendations or brief instructions
    on how to install and configure them. Let''s start with network file systems and
    consider only the most common ones at the time of writing. In reality, there are
    many more, but not all of them are suitable for HPC.


    In a compute cluster, all nodes must have write access to the user''s directory.
    This imposes very serious limitations on the implementation, in particular, technologies
    like iSCSI, ATA-over-Ethernet, Network Block Device, etc., immediately disappear,
    as they do not provide synchronization of data on nodes writing.


    Another important limitation is the speed of data access. If there are several
    dozens of nodes in a cluster, the bandwidth of a single server is simply not enough
    for all of them. Already on two nodes, a single task can easily create a load
    that completely blocks the NFS server, creating large time-sensitive files. This
    leads to the need to use distributed file systems that can balance the load between
    multiple servers, as well as distribute the load to disk subsystems, increasing
    their throughput.


    # NTP


    NTP (Network Time Protocol) is not a network file system, as the name suggests,
    a protocol for time synchronization. I have intentionally included its description
    here because time synchronization is of paramount importance for almost all network
    file systems (and for cluster operation).


    I will not go into the details of the protocol; I will note one thing: the closer
    the server is to the client on the network, the better and faster the synchronization.
    Therefore, I recommend installing NTP server on at least one of the service servers,
    configure it to work with the local network and to synchronize with one of the
    external NTP servers. There are several implementations of NTP servers; we will
    shortly consider openntpd'
