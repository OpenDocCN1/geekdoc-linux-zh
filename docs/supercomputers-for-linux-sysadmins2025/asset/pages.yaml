    # DHCP


    Dynamic Host Configuration Protocol is a protocol used for initial configuration
    of computers. It allows you to get data about IP addresses, boot parameters, and
    some other parameters. I will focus only on the ones we are interested in computing
    cluster operation: IP addresses, routing settings, and DNS server. Currently,
    there are many implementations of the DHCP server, but in most cases, Linux uses
    the ISC implementation, so this is what we are going to look at.


    First, install the dhcp-server from the OS package manager (usually is called
    dhcp-server). After that, make sure the server starts automatically in the init
    scripts. The DHCP server configuration specifies the parameters of the server
    itself, the address ranges that will be “handed out” by the server, and the parameters
    that will be passed along the address. These parameters are known as options and
    have fixed numbers. A list of them can be found on the Internet, e.g., at this
    address: https://www.iana.org/assignments/boot-dhcp-parameters/boot-dhcp-parameters.xhtml.


    We will be interested in the following options:


    +   - routers - List of IP addresses used for the default route

    - ntp-server - List of NTP servers addresses

    - domain-name-servers - List of DNS servers addresses


    In addition, the parameters passed to clients are important: next-server and filename.
    These are, respectively, the address of the TFTP server from which the file will
    be downloaded and the name of the file. The configuration is typically located
    in /etc/dhcp/dhcp.conf file, and usually, there are already some commented examples
    there. Unlike “office” solutions, the workstation does not care what IP address
    it gets, in a cluster, it is highly desirable that each node has a fixed address.
    Otherwise, diagnosing hardware problems can become very difficult.


