    # Network Equipment


    Computer networks allow you to organize the interaction of computers with each
    other. Special equipment is used to build them: network cards and switches. As
    a rule, clusters have at least two internal networks. One, called a service network,
    performs the same functions as a regular computer network; it is used for remote
    nodes access, monitoring, etc., and includes all the cluster nodes. The other
    is called compute (or communication) network, which has compute nodes connected
    to it, and provides data exchange between compute tasks on different nodes. Some
    clusters may have dedicated storage, remote control, monitoring, or other types
    of networks, but this is a rare (and usually more expensive) case.


    Do not forget the external network, which is used by users and admins for the
    cluster access; if users will load a lot of data, it might be a bottleneck. As
    a rule, compute nodes, storage servers, and most service nodes don''t have direct
    access to the external network; they don''t have public (corporate) IP addresses.
    To access the world, NAT or proxy is used, to access internal services (monitoring
    dashboards, admin ssh, etc.) - port forwarding or reverse proxy. Plan this beforehand,
    to decide what type of network switch you need for external network, which nodes
    will have direct access, etc.


    The most serious requirements are placed on the communication network. Two basic
    parameters are used to characterize the capabilities of Networking technologies:
    throughput and latency.


    **Throughput** characterizes how much information can be transmitted per unit
    of time (most often a second). Network equipment manufacturers typically specify
    peak throughput. In real applications, as a rule, the speed is 1.5–2 times lower
    than the peak'
