    # # Installing OpenLDAP (Using RH As an Example)


    Let''s install the packages on the server:


    ```

    # yum install openldap-servers openldap-clients nss_ldap

    ```


    Generate a hash of the administrator password - the program will request the password
    twice and output its hash to the console:


    ```

    # slappasswd

    >>> {SSHA}ABCDEF1234567890.

    ```


    Copy this line and open the LDAP server configuration file /etc/openldap/slapd.conf
    for editing. Before opening it, make a backup copy.


    Find and correct the lines in this file:


    ```

    database bdb

    suffix "dc=ldap,dc=server,dc=org"

    rootdn "cn=Manager,dc=ldap,dc=server,dc=org"

    rootpw {SSHA}ABCDEF1234567890

    ```


    Here is the type of database, and suffix is the path to the subtree of directories
    where your information will be located. Instead of ldap.org, you can use any other
    address; it does not have to match the DNS name of the server.


    rootdn - Path to the administrator record. In this example, his name is Manager.
    And the last entry is the password hash we generated earlier.


    Now let''s specify in this file the circuits that we need for our work:


    ```

    include /etc/openldap/schema/core.schema

    include /etc/openldap/schema/cosine.schema

    include /etc/openldap/schema/inetorgperson.schema

    include /etc/openldap/schema/nis.schema

    ```'
