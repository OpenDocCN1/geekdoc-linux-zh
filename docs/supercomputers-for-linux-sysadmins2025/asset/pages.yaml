    # FTP and WWW


    FTP (File Transfer Protocol) was very popular for file transfer in the early days
    of the Internet. Nowadays, it is also used for file distribution, and FTP support
    is even built into most browsers and supported by many file managers. This protocol
    allows both downloading and transferring data to a server, which has made it a
    very popular means of file transfer. A significant disadvantage of this protocol
    is its weak security. The only way of authentication for FTP is the transfer of
    login and password without encryption.


    There are several implementations of secure FTP variants, but, alas, they are
    not standardized and are not supported by all clients. Besides, even with encryption,
    a password is required for authentication, and the very possibility to enter a
    password weakens security. It is not so difficult to find a weak password, and
    it is not always'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# CHAPTER 18 REMOTE USER ACCESS


    possible to control the strength of user passwords. FTP is a good solution only
    in one case: for organizing public file storage with anonymous (passwordless)
    read-only access.


    Currently, an excellent alternative to FTP is the SFTP and SCP protocols, standardized
    and supported by all SSH server implementations. They allow authentication by
    key, which virtually eliminates the possibility of tampering. The downside of
    these protocols is higher CPU consumption and often slower transfer speeds. This
    is due to both overhead encryption costs and peculiarities of data transmission
    over encrypted channels. There is a possibility to apply encryption only at the
    authentication stage and not to encrypt file transfer, but unfortunately, it is
    not supported by standard servers and clients.


    The second important protocol that can be used to access a supercomputer HTTP,
    which is the basis for the World Wide Web (WWW). In other words, access through
    a browser to a web server. Often there is no need for a web server on a supercomputer
    - all the necessary information can be placed on a separate server that is not
    part of the supercomputer. This option is much more preferable, as any web server
    becomes vulnerable as soon as it begins to serve dynamic content - cgi-scripts,
    application servers, etc. Even with static content only, a web server can be vulnerable
    to attacks that inadvertently included modules.


    But sometimes it is necessary to receive or transmit information directly to the
    supercomputer, e.g., to display the queue status, etc. In this case, you can implement
    such functionality through an external server, e.g., by receiving data via ssh
    or rsync, having previously limited the allowable command line in the server key
    (see the section about ssh), or configuring the web server in way as to exclude
    the possibility of hacking.


    It is advisable to severely restrict it with a chroot or, preferably, run it in
    a virtual machine such as a lightweight LinuxContainer (LXC). Do not forget log
    analysis and intrusion detection systems (IDS): any “unnecessary” services, especially
    those available from the outside, are a reason to try to break into your system,
    if only for fun.


    # X-Window


    The main feature of the graphics system in Linux, unlike MS Windows, that is it
    is not part of the operating system. In Linux, it is possible to work without
    problems only in terminal mode, without using the graphical interface. This is
    the mode in which you usually work with a supercomputer. But there are situations
    when the use of graphical


    249'
