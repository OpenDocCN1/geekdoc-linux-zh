  md: '# GLOSSARY OF TERMS


    **Superuser (a.k.a. administrator):** A user of the system, with rights to allow
    performing any regular actions. In UNIX-like operating systems, it is typically
    a user with UID = 0. Historically, it is named root, although the name itself
    can be changed.


    **Switch:** A device that allows multiple network adapters to join together to
    form a network.


    **System console:** A virtual screen and a keyboard connected to it. The system
    console receives messages from the OS kernel. From the system console, you can
    control the OS process.


    **Telnet:** A protocol for remote access to computers on a network. It uses an
    unencrypted data channel.


    **TFTP:** *Trivial File Transfer Protocol*, protocol that allows you to retrieve
    files from a server, such as a boot image.


    **Telecommunication cabinet:** A rack, designed for mounting computers and other
    equipment that meets certain standards (equipment width, mounting method, etc.).
    The most common racks are 19 inches wide.


    **Transport network:** Used for network file systems, run commands on nodes, etc.


    **Tunnelling:** The forwarding of a network connection through another connection
    (tunnel). The tunnel itself looks like a local connection or a direct connection
    to another host.


    **U:** *Unit*, a unit of measurement for the height of rack equipment, equal to
    5/4 inches or approximately 4.5 cm. The unit is sometimes referred to as RU –
    *rack unit*.


    **UPS:** Uninterruptible Power Supply.


    # Glossary of Jargon


    +   **Backslash:** "\" symbol.


    +   **Cooler:** A fan, cooling the system.


    +   **Chiller:** A refrigerating machine.


    +   **Fiber:** Fiber optics.


    +   **Folder:** The directory of the file system.'
