  md: 'pass (initial path). The packet also contains a hop count that indicates the
    number of elements in the port list, a pointer to the current element in the port
    list (hop pointer), a D direction pointer (direction, 0 – the packet is forwarded
    from the source to the destination of the request, 1 – the packet contains a response
    and is forwarded toward the source of the original request), and a reverse path.


    Upon receiving a packet with field D = 0, the switch uses the pointer to the current
    hop pointer to determine the port to which the received packet should be routed,
    writes the port number through which the packet was received to the reverse path
    field to store the reverse route, and increments the hop pointer by one. If the
    list runs out, the reverse processes the packet, generates a reply, changes the
    direction pointer to reverse path (sets the D field to 1), and sends the reply.
    When receiving a packet in which the direction pointer is set to reverse, the
    switch uses the reverse route to determine the port to forward, and accordingly
    do not write a new reverse route, and decrease the hop pointer value by one each
    step.


    In addition to a pure directed route, it is also possible to specify the LID of
    the switch to which the packet should be forwarded using normal addressing (by
    LID) and the LID of the destination to which the packet should be forwarded after
    the path defined by the directed route has traveled. Obviously, the parts of the
    fabric before and after the path defined by the directed route must already be
    initialized and support LID-based forwarding.


    # InfiniBand Subnet Management


    As it was mentioned above, for normal operation, the InfiniBand subnet must be
    configured: LIDs are assigned to adapter and switch ports, and switch forwarding
    tables are configured (unlike Ethernet networks, in InfiniBand networks, switches
    do not form their own forwarding tables; they must be configured externally).


    The component that is responsible for configuring and maintaining the subnet is
    the subnet manager (SM). A subnet manager is a program that can run on a computer
    with an InfiniBand adapter or on a switch (not all InfiniBand switches support
    running SM). For reliability, several managers can be launched in a subnet, in
    which case one of them is the master and the others standby. In case the master
    stops working, one of the standby takes over its functions. The master manager
    also explicitly delegate the role of master to one of the standby managers, e.g.,
    during a normal shutdown.'
