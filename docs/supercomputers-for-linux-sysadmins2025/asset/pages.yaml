  md: '# CHAPTER 7 UNIX AND LINUX – THE BASICS


    The cat command merges files and outputs them to a standard output stream. If
    there is no file argument, the cat command will accept input from a standard input
    (keyboard) file. Since the command works with a standard output file (terminal),
    it is most often used to view the contents of a file on the screen. It is not
    recommended to output binary files to the screen.


    ```

    cat ls.txt - Outputs the contents of a file named ls.txt to the terminal

    cat ls1.txt ls2.txt ls3.txt - Outputs the contents of files ls1.txt, ls2.txt,
    and ls3.txt to the terminal in turn.

    cat ls1.txt ls2.txt ls3.txt > lsall.txt - Merges three files into one. The old
    files are preserved. If the file lsall.txt already existed, it will be overwritten
    by the new content. It can be added to the end of the file if you use the >> sign
    (two “more” signs) for redirection.

    ```


    The cat command can be used to create a file:


    ```

    cat > ls.txt - Everything typed on the keyboard will be written to the file ls.txt.
    You can stop typing by pressing Ctrl-D.

    ```


    The cat command displays the entire contents on the screen. If the file is large,
    it will only see the last lines on the screen.


    You can directly use commands to view files in chunks:


    +   * more file.txt

    * less file.txt


    The less command contains a large set of internal commands for navigating through
    a file, finding context, and even editing (see Table 7-8).'
