  md: "# CHAPTER 7 UNIX AND LINUX – THE BASICS\n\nTo see data about all interfaces,\
    \ not just the running interfaces, run ifconfig the -a switch. With root privileges,\
    \ the ifconfig command can be used to control interface parameters. You can quickly\
    \ disable the eth0 interface with ifconfig eth0 down and enable it with ifconfig\
    \ eth0 up. Example of quick interface configuration and its address:\n\nifconfig\
    \ eth0 192.168.0.1 netmask 255.255.255.0\n\nThis command will set the eth0 interface\
    \ to 192.168.0.1 and mask 255.255.255.0. After that, the interface must be enabled\
    \ (up) with the ifconfig eth0 command. In most implementations, the ifconfig command\
    \ automatically creates a routing rule. In contrast to ip addr command, ifconfig\
    \ cannot manage and even display multiple ip addresses, assigned to an interface.\
    \ In kernel versions, this issue was addressed, using “interface aliases,” when\
    \ one interface could be represented by various virtual devices, e.g., eth0, eth0:1,\
    \ eth0:2, etc. This technology still is supported, but highly not recommended\
    \ (because routing and firewall rules turn to hell).\n\n# “Cluster\"\n\nCluster\
    \ commands are commands that perform operations on all nodes or on some set of\
    \ nodes. As such, there are no standard commands for clusters, but cluster administrators\
    \ with shell programming skills can create their own scripts to organize the execution\
    \ of commands on cluster nodes.\n\nIn real practice, I advise using commands like\
    \ pdsh or crush, but here I show a few variants of “cluster” scripts can be taken\
    \ as the basis of scripts for nonstandard cases.\n\nLet’s take at an example of\
    \ a command to copy a file to all nodes in the cluster:\n\n```\n#!/bin/sh\nfor\
    \ host in `grep -v ^# /etc/nodes` do\n  for file in \"$*\"; do\n    scp -r \"\
    $file\" \"$host:$file\"\n  done\ndone\n```"
