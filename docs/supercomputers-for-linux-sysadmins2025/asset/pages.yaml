    failure, actively files are used first, which reduces the time of recovery and
    recovery overhead. If you deploy Weka cluster in cloud, it supports auto expand
    and shrink. I have no information about the pricing plans or real performance
    tests and cannot compare it with GPFS or Pananas, but it seems like a real competitor.


    The list of distributed file systems supported by Linux is certainly longer than
    the one discussed. For example, I name Gluster, Coa, CEPH, Hadoop HDFS, BeeGFS,
    MooseFS, zFS (not to be confused with ZFS), and so far I cant say anything positive
    about them as applied to HPC. Most of them are not POSIX-complaint which breaks
    a lot of applications, some have problems with file sharing, others with reliability,
    others with performance under heavy load, some are still under development and
    not yet ready for serious production use.


    This does not mean that the list of options is strictly limited – file systems
    evolve and improve, new ones appear. I just want to warn you against making hasty
    decisions, the file system is always one of the “bottlenecks” of a supercomputer.'
