  md: '# CHAPTER 19 CLUSTER STATUS MONITORING SYSTEMS


    capabilities. This is due to the fact that each plug-in is a separate program
    (or script) and all its configuration consists of correctly specifying the command-line
    arguments of the startup, which are very different for different plug-ins.


    The implementation of plug-ins as separate programs is both a strength and a weakness
    of Nagios. On the one hand, it gives high flexibility - it is very easy to write
    your own plug-in. On the other hand, collecting many metrics requires running
    many separate programs, which creates a high load on the node on which they run.
    This is why polling frequency in a database is usually a few minutes. This is
    fine for monitoring services like a database, web server, etc., but it is very
    inconvenient when monitoring the state of a compute cluster, as it puts an unwanted
    load on the compute nodes. Besides, there are not so many services in a compute
    cluster; it is much more important for it to monitor resources; Nagios can do
    this too, but not as well and conveniently as we would like it to be.


    For small clusters, Nagios may be a good choice for tracking the overall health
    of nodes and infrastructure, such as SNMP hardware, but for clusters of several
    dozen nodes, it is not recommended or be limited to a small number of metrics.


    # Zabbix


    Zabbix is a free monitoring system designed to track the state of network services.
    All information is stored in a database - MySQL, PostgreSQL, SQLite, or Oracle.
    Zabbix supports several modes of data collection - over the network (for SMTP,
    HTTP and similar), through an agent installed on the host, and with the help of
    external programs.

    A monitoring complex based on Zabbix can consist of the following components:


    +   - **Server** Stores configuration data and statistics and is responsible for
    aggregation and storage of collected data and notification of problems. It can
    collect information from proxies, agents, and network services.

    - **Proxy** Collects data from other proxies, agents, and network services. The
    collected data is transmitted to the server. By using proxies, you can build hierarchical
    configurations and reduce the load on networks and the central server.'
