    # Job Life Cycle


    There are a lot of steps happening during the job life in Slurm. I''ll skip some,
    which are rarely used, but I recommend you to look in the docs about prologues/epilogues
    types and plug-ins invocation types. Here are the most common steps:


    +   **Submit the job (batch/srun/slalloc)** – Here Slurm makes some checks, if
    this job is allowed to be queued, and also invokes SPANK plug-ins, which are registered
    for this step. Plug-ins can add options and flags to batch and srun, like pyxis
    does. Special type of plug-ins, also invoked in this step, is job_submit plug-ins,
    where you can make special checks or actions.


    +   **Job start** – Before it happens, several types of prologue scripts and plug-ins
    are executed. Most common and interesting is the script (or a set of scripts)
    specified in the Prolog line in the config file. It is executed on all allocated
    nodes from the root user, and I highly recommend using it for making additional
    checks, if all hardware


    230'
