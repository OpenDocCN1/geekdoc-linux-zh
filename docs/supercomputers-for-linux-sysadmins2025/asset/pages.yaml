  md: '# Analyzing


    systemd-analyze allows you to analyze some issues in services loading and overall
    system boot process. systemd-analyze blame shows you the sequence of all services,
    started in the current session with times, taken for start. The list is sorted
    by time, so it is easy to check which services are slow to start. Another option
    is systemd-analyze critical-chain, showing only the longest chain of dependent
    units:


    $ systemd-analyze critical-chain


    The time after the unit is active or started is printed after the "@" character.


    The time the unit takes to start is printed after the "+" character.


    ```

    graphical.target @4min 4.109s

    watchdog.service @4min 3.616s +492ms

    multi-user.target @4min 3.552s

    remote-fs-pre.target @1min 48.526s

    open-iscsi.service @1min 48.101s +407ms

    liscdid.service @1min 34.602s +13.696s

    network-online.target @53.979s

    iptables-openvpn.service @26.857s +26.862s

    basic.target @26.853s

    pacpid.path @26.853s

    sysinit.target @26.301s

    sys-fs-fuse-connections.mount @53.921s +51.0855s

    systemd-modules-load.service @9.274s +2.112s

    systemd-journal.socket @8.536s

    system.slice @8.230s

    .slice @8.230s

    ```


    If you use systemd timers and want to use complicated time expressions, check
    them out using systemd-analyze calendar, like this:


    systemd-analyze calendar iterations=2 ''*-2-29 0:0:00''


    Original form: *-2-29 0:0:00

    Normalized form: *-02-29 00:00:00'
