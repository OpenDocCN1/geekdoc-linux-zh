  md: '# CHAPTER 26 CLUSTER MANAGEMENT SYSTEMS – XCAT OTHERS


    We have allowed the xadmin user to execute the nodels command from any remote
    servers. If we specify nothing instead of nodels, then any command will be allowed.
    You may specify more complex restrictions, like this:


    ```

    mkdef -t policy -o7 name=xadmin commands=rower \

    parameters=stat nodange=h02-h05 rule=allow

    ```


    Here we allow the rower stat command to be executed only for nodes h02..h05. That
    is, you cannot execute rower on h02 or rower stat h01.


    Note the key in this table is the execution priority. This is a numeric parameter,
    but it can be dotted, such as 6.1 or 7.012. Viewing policies is sorted in ascending
    order; the first matching rule is triggered.


    # Node Management


    Let''s add the first node to our cluster. Nodes in xCAT are of three types – stateful
    (OS installed on the hard disk), stateless (OS loaded over the network and runs
    in RAM), and satelite (OS loaded via NFS in read only and stores some files in
    RAM). The most convenient variants are stateful (for service nodes) and satelite
    (for compute nodes).


    First, we need to get the necessary packages and files to create the images. To
    do this, we will need an iso-image of the selected distribution. xCAT supports
    Redhat, Ubuntu, SLES, CentOS, and Windows, but not all versions, be careful. Other
    distributions are not officially supported. Example for RHEL 7.6:


    ```

    copyds RHEL-7.6-20181010.0-Server-x86_64-dvd1.iso

    ```


    Let''s create images to bootstrap the node:


    By default, the install, netboot, and satelite images will be created. The image,
    if not explicitly specified during generation, will be rhel76-x86_64-satellite-compute.


    Let''s add descriptions for the nodes in the “compute” group:


    ```

    chtab node=compute \

    noderes.netboot=pxe \

    noderes.tftpserver=10.0.0.0.102 \

    ```'
