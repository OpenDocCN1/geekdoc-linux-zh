- img_proc: true
  md: 'If the program is interactive, i.e., contains keyboard input, the script must
    use the input redirection mechanism.


    ```

    mpirun -np 4 proganame < input_file > $PBS_JOBID

    ```


    If the system has trouble finding the path where the output files should be written,
    they remain in the system directory /var/spool/PBS/undelivered/ on the cluster
    node where the task was read, and a mail message is sent to the user about it.


    # Job Control Commands


    In addition to the qsub command described briefly, there is a set of commands
    for task management. Their detailed description can be seen with the help of the
    man command:


    +   - qdel - Delete the task

    - qhold - Prohibit execution of the task

    - qmove - Move the task

    - qmsg - Send a message to the task

    - qrls - Remove the execution set by the qhold command

    - qselect - Task selection

    - qsig - Sending a signal (in UNIX OS sense) to the task

    - qstat - Output queue status (the most useful commands are qstat -a and qstat
    -q)

    - qsub - Puts the task in the queue

    - pestat - Output the state of all compute nodes (the command is built separately)'
