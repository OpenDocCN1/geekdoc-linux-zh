  md: 'RemovableMedia = no;

    LabelMedia = yes;


    In the Director section, we specify the name of the directory and the password
    to connect to it. In the Device section, we described the disk shelf connected
    to stor1 in the /mnt/backups directory. The Name parameter specifies the name
    of the device; the Media Type parameter specifies an arbitrary name to be used
    by bacula when restoring data. For each device describing the file storage (i.e.,
    the directory where the backups will be stored), a unique Media Type name must
    be specified, although this is already obvious. The main parameters of the Director
    section:


    +   - Archive Device - The path to the device, in this case a directory. For a
    stor2 that uses tape, this will be the path to the tape drive (e.g., /dev/nst0).

    - Device Type - The type of device. For a directory, it is File; for a tape drive,
    it is Tape.

    - Random Access determines whether the device can be accessed by a random address.
    Write "No" for tape and "Yes" for files.

    - RemovableMedia indicates whether the device can be removed. For tape, it is
