  md: '# CHAPTER 9 NETWORK FILE SYSTEMS


    An important feature of most ntp servers is their default policy of not changing
    the time too quickly. For us, this means that if the time on the client is different
    from the server, e.g., by, then synchronization may take many minutes. And during
    these minutes, some file systems that require precise synchronization may not
    be mounted, or other troubles may occur.


    Of course, sudden time jumps can also bring them, but they typically do not occur
    at system startup, by a long "pulling" to a single time can bring a lot of problems.
    That''s why I recommend running forced synchronization before starting the ntp
    service on the client node with the command:


    ```

    ntpdate server_ntp_server_address

    ```


    In many distributions, the ntpd package also provides a "service" of the same
    name, which quickly synchronizes the time with the server specified in /etc/ntpd.conf.
    Note that the ntpd command cannot be executed while ntpd is running.

    in modern systems, ntpd is replaced by systemd component timesyncd. Note that
    this service cannot run as a server; it can only synchronize the local time with
    remote servers. If you want to use it (or it is already enabled), check if it
