    # Configuring the ssh Client


    The openssh client also has a set of settings. Most of them do not need to be
    changed, and they are located in the /etc/ssh/ssh_config file. If a user needs
    to change something, it is enough to create a file ~/.ssh/config and make the
    necessary settings in it. The ~/.ssh directory contains public and private keys,
    as well as the authorized_keys (sometimes authorized_keys2), which contains all
    the public keys that can be used to authenticate a user, and the known_hosts file,
    which contains the public keys of those computers that have been connected to
    the past.


    Let''s consider the process of configuring remote login from client to server
    computer under foo user. On the client, run the command ssh-keygen -t rsa (if
    we have not done before).


    The t rsa key instructs you to create a key pair in RSA format. You can also use
    ecdsa, ecdsa-sk, ed25519, ed25519-sk, or a newer format if available. You can
    add -b NNN key, to specify key length in bits; the more bits, the stronger the
    key. For RSA, default length is 3072, and for ec/-ed-keys (elliptic curves), only
    256, 384, and 521 values'
