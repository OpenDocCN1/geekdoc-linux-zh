    This task is solved by monitoring everything and anything. It is very important
    to know as much as possible about the state of the cluster. The differences do
    not end here. One of the most significant is related to the mode of operation.
    In the office, the load on the computers is not high; you need a few minutes a
    day to display a large document or play a video clip of a new product advertisement.
    Ninety-nine percent of the time, these computers are waiting for a mouse click
    or a keystroke. In a cluster, everything is fundamentally different; its normal
    mode of operation is 80–100% utilization of each node at all times.


    In the office, the peak load of one or two computers will not be noticeable against
    the general background. But every experienced administrator knows what it is:
    “all computers have caught some virus” – the load on the network cannot cope with
    the flow of requests, everything starts to slow down.... And in a cluster, the
    situation when all the nodes are occupied by one task starting exchange data writing
    or writing intermediate data to the network disk is not a virus, but a completely
    normal situation. A special type of peak load is power-on. In the office, everything
    happens by itself: in the morning, everyone comes in, some early, some later,
