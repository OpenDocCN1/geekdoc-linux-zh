  md: '# Component Identification and Addressing in InfiniBand network Networks


    InfiniBand network components have identifiers GUIDs (globally unique ID), which
    are 64 bits long. Depending on the type of device, there may be more than one
    of these identifiers. GUIDs are assigned by the device manufacturer, although
    there may be means to change them. Each adapter has a NodeGUID and one PortGUID
    for each port of the adapter. One of the PortGUIDs can be the same as the adapter''s
    NodeGUID. The switch also has a NodeGUID and a PortGUID, but all PortGUIDs must
    be the same for all switch ports.


    There is also an identifier SystemImage GUID. Its purpose is to allow you to determine
    which components make up a system (under the control of a single software instance).
    For multich switches, e.g., this parameter is the same for all elementary switches
    that make up one large composite switch. For adapters installed in a single server,
    this parameter will be different each adapter has an independent management program
    (what is called firmware). SystemImage GUID can be equal to the NodeGUID of one
    of the components that make up a single system, or null if the component is not
    part of any system (or the vendor does not want to allow the components of their
    system to be identified).


    GUIDs are used to identify the components of an InfiniBand network, i.e., to distinguish
    one component from another. They are not used as addresses for data transmission.
    LIDs (local ID) are used as addresses for data transmission within a subnet. GIDs
    (global ID) are used as addresses when transferring data between subnets. GIDs
    with GIDs requires an additional GRH (Global Routing Header) in the data packet,
    which increases the size of the information in the data packet.


    The local ID - LID is 16 bits long. LID = 0 is reserved and cannot be used; LIDs
    from 1 to 0FFFF are regular LIDs for point-to-point (unicast) transmission: LIDs
    from 0xC000 to 0FFFF are for multicast; LID = 0FFFF is a so-called permissive
    LID, a packet addressed to such an LID will be processed by the first port to
    receive it. Each end port and each switch (the LID is assigned to the switch as
    a whole, not to its individual ports) in the subnet is assigned at least one LID
    during its initialization, and LIDs should be unique within the same subnet.'
