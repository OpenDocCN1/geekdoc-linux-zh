    # Journald


    The system-journal service is optional, but it is usually enabled by default.
    It can run in parallel with the regular syslog server, and messages will appear
    in both. Events are stored in a special database, which allows you to quickly
    find the necessary data. You can view logs with the journalctl command. Its useful
    keys


    +   - a - Show all fields completely, even if they contain problematic characters
    (control characters, etc.).

    - f - Go to the end of the list and show new lines as they appear.

    - n NNN - Output NNN lines of logs (10 by default); if “all” is specified instead
    of a number, then output all.


