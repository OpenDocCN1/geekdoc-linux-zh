- img_proc: true
  md: '# CHAPTER 2 WHAT IS “SUPER”?


    The first element will be processed in the required S clock cycles (this is called
    “pipeline acceleration time”), and then the device will produce one result per
    K clock cycle. In modern processors, often K = 1. However, pipelining does not
    necessarily imply vectorization and vice versa. For example, if the addition device
    is pipelined, and there are several regular additions in a row performed, they
    can perfectly utilize the pipeline.


    A system administrator doesn''t always need a thorough understanding of the processor,
    assembly language, and the ability to optimize user programs, and understanding
    how parallel execution in a processor works is very important.


    Many modern processors are multicore, i.e., they contain several full-fledged
    (or almost full-fledged) processors on one crystal (in one chip). GPUs have hundreds
    or thousands of cores - small processors, working in parallel. There is also parallelism
    at the level of memory access, when different memory banks can work independently,
    and it means they can give or write data faster. For example, if your motherboard
    has four memory banks (not slots!), then of four slots with 8 GB (one for each
    bank) will work better than one slot with 32 GB. While one data is being written
    into one bank, the second one can be started to be written into the next.


    There is also parallelism at the level of working with devices - you can form
    a block in memory in advance to write it to a disk or send it over the network
    and “command” the controller to write/transmit it. Then the processor can perform
    other actions, while data from memory will be written to disk or sent over the
    network.


    This parallelism is embedded in “hardware.” In order to use it to the maximum,
    to make calculators (cores, processors, compute nodes...) work in parallel, it
    is necessary to compose a program in such a way that uses all these resources.
    That is, write a parallel program. We will not deal with this (at within the framework
    of this book), but you will probably deal with parallel programs. You have to
    deal with parallel programs all the time, and need to know how they work.


    If a parallel program is written, does it mean that it will immediately work faster
    than a regular (sequential) one? Moreover, it may work even slower. The parts
