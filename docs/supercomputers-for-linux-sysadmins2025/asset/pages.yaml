- img_proc: true
  md: '# CHAPTER 15 SLURM


    For PrivateData, nodes and partitions hide nodes and partitions state; reservations
    hides the reservations, unless the user can use them; and accounts, jobs, usage,
    and users hide the information, unless the user is a coordinator or an operator.
    Useful PrologFlags (see full list in the docs):


    +   - Alloc – Run prologue in the allocation phase. By default, the prologue is
    executed before the allocation phase and is not executed with salloc. This flag
    is required by many others.

    - Contain – Use the ProcTrack plug-in to create a job container on all allocated
    compute nodes. pam_slurm_adopt then can place processes launched through a direct
    user login into this.

    - DeferBatch – Wait until the prologue completes on all allocated nodes before
    sending the batch job request. May prevent unsynced MPI job starts.

    - RunInJob – Run prologue and epilogue in the extern slurmstep. Implicitly sets
    the Contain and Alloc flag and runs prologue and epilogue in the job''s container.

    - Serial – Run prologue and epilogue on each node sequentially, one by one, instead
    of default parallel run. This is incompatible with RunInJob.


    The most useful (in my opinion) SchedulerParameters (note that different type
    of schedulers may take different parameters):


    +   - batch_sched_delay – How many seconds delay the job scheduling (default 3).
    May be useful if jobs are submitted with a high rate, and we want to collect many
    jobs before the scheduler starts.

    - bf_interval – The number of seconds between backfill iterations. Default: 0,
    -1 disables the backfill.

    - bf_max_job_assoc – The maximum number of jobs per user association to attempt
    starting with the backfill scheduler. Default: 0 (no limit).

    - bf_max_job_part – The maximum number of jobs per partition to attempt starting
    with the backfill scheduler. Default: 0 (no limit).


    237'
