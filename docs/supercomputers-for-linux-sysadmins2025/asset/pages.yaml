  md: '# Glossary of Terms


    **Backup:** A copy of data (files, databases) stored on a separate media or a
    group of media. Data can be restored from the backup copy to the original files,
    databases, or to other directories, databases.


    **Cable organizer:** A design that allows cables to be stacked within a dedicated
    space.


    **Communication network:** Used to exchange data by computing tasks.


    **Compute field:** A set of all compute nodes of the complex that are available
    for user tasks.


    **DAPL:** *Direct Access Programming Library*, a library for using direct access
    to remote memory without having to explicitly describe a particular type of hardware.


    **D-BUS:** *System Message Bus*, a server and protocol that allows any programs
    to communicate with the same server. A program can register as a service and publish
    messages (events) and as a client and subscribe to certain events.


    **DHCP:** Dynamic Host Configuration Protocol, a protocol that allows a computer
    to obtain information such as its IP address, network name, etc., from a server
    at the OS boot stage or later.


    **File server:** A computer that makes part of its file system available to other
    computers over a network.


    **File storage:** Equipment that provides disk space over a network or locally,
    such as for a file server.


    **Form factor:** Standard dimensions for computer cases, like mini-tower, 1U,
    2U, etc.


    **FPGA:** *Field Programmable Gate Array*, a device, which can be programmatically
    reconfigured into various combinations of "gates" – and form specialized compute
    devices.


    **FTP:** *File Transfer Protocol*, a protocol for transferring files over a network.


    **GPGPU:** *General-Purpose GPU*, a GPU, which is used for computations.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# GLOSSARY OF TERMS


    **GPU: Graphics Processing Unit**, device for generating and displaying (via separate
    display) graphics. Today, any video card.


    **Host:** A *node* on a network – a server, a computer.


    **HPC:** High-Performance Computing, the supercomputing industry.


    **Interconnect:** A jargon, usually referring to a communications network or just
    a base network.


    **Journaling:** Writing messages to a log. Many programs support logging to a
    file. In UNIX-like systems, there is a standard syslog service, which is used
    by many programs and services.


    **KVM: Keyboard and Video Monitor**, a device that allows you to connect multiple
    computers to a single monitor and keyboard.


    **Latency:** The time spent when a packet is transmitted through a network regardless
    of its length.


    **Linpack:** A test for estimation of real performance of parallel computing complexes.
    Most often, the High Performance Linpack (HPL) version is used.


    **Logging:** See journaling.


    **LVM: Logical Volume Manager**, a technology for building logical disks using
    multiple physical disks and/or RAIDs.


    **MAC address:** The unique address of a network card in the Ethernet standard.


    **MPI: Message Passing Interface**, an open library standard intended for message
    passing inside a parallel application. There are many implementations of this
    standard (mpich, lam, openmpi, etc.).


    **NIS: Network Information System**, a technology that allows user accounts, computer
    names, and other system information to be stored on a server and retrieved from
    any computer on the network.


    **Node (of a cluster):** a computer designed for certain tasks in the cluster
    (computing, controlling, I/O, etc.).


    **NTP: Network Time Protocol**, a protocol for synchronizing time over a network.


    **Rack:** See telecommunication cabinet.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'RAID: Redundant Array of Independent/Inexpensive Disks, an array of multiple
    hard disks logically combined for greater fault tolerance, speed, and/or capacity.


    RAID-0 (stripe): RAID, which are combined in such a way that logical blocks of
    disks alternate: block1 of the first disk, block1 of the second, ... block2 of
    the first disk, block2 of the second disk, etc.


    RAID-1 (mirror): RAID, the disks which are combined into a "mirror" to increase
    reliability. Information is written simultaneously to all disks in blocks with
    the same numbers.


    RAID-5: A RAID whose disks are combined into parity groups. When writing to a
    logical block, the written data is added by XOR method with other blocks in the
    group and the resulting information is written to a separate block. When reading,
    the correctness of the data is checked, and if one of the blocks is corrupted,
    the information is automatically restored.


    RAID controller: A device that combines multiple hard disks into a RAID.


    RDMA: Remote Direct Memory Access, a protocol for direct memory access to a remote
    computer.


    Register: Internal memory of the processor, works very fast, all arithmetic and
    logical operations are typically performed with registers only.


    Samba: A software package that implements the SMB and CIFS protocols used in MS
    Windows for network disks. It allows accessing Windows network disks from Linux,
    as well as creating network disks under Linux so that they can be used by Windows
    clients.


    SCI: Scalable Coherence Interface, an old standard for high-speed data transmission
    equipment. It means connecting network cards directly to each other in a ring
    or torus (two- or three-dimensional).


    Service network: Used to monitor and manage the state of compute nodes.


    SNMP: Simple Network Management Protocol, a protocol designed to monitor and manage
    equipment on a network.


    Software: In addition to the actual set of programs, this includes configuration
    and other files necessary for its operation.


    SSH: Secure Shell, a protocol for remote access to computers on a network, involving
    the use of an encrypted connection.'
