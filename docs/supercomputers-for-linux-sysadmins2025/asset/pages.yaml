  md: '# Topology


    Optional description of the network topology. I recommend using it if you have
    InfiniBand network or similar, do minimize number of network hops, and as a result
    latency and neighbor noise. To enable it, specify TopologyPlugin=topology/TOPO_NAME,
    where TOPO_NAME is one of:


    | Name | Meaning |

    | default | One-dimensional topology |

    | block | Block topology, see below |

    | 3d-torus | 3d-torus topology |

    | tree | Hierarchical topology, like tree, fat-tree, dragonfly |


    Block topology describes a simple network with several leaf switches (blocks)
    and one top switch. Topology configuration is specified in the topology.conf file.
    Here is an example for the block topology:


    ```

    # topology/block

    BlockName=block1 Nodes=n[1-32]

    BlockName=block2 Nodes=n[33-64]

    ```


    And - for the tree topology:

    # topology/tree

    SwitchName=s0 Nodes=n[0,2,4,6]

    SwitchName=s1 Nodes=n[1,3,5,7]

    SwitchName=top Switches=s[0-1]


    Note that in the second example, nodes are in the mixed order. If you have similar
    situation, this may cause communication problems in the apps, if they allocate
    nodes from several leaf switches, by default neighbor ranks will communicate via
    top switch. To prevent it, use TopologyParam=SwitchAsNodeRank parameter in the
    slurm conf. It will sort ranks (nodes list actually) by switches first, then by
    node names.


    Be careful - if you add new nodes, update the topology file; otherwise, those
    nodes will never be selected for jobs!'
