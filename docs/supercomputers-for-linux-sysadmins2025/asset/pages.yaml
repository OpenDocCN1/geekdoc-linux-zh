    kitcomponent, kitrepo, monitoring, notification, osdistribupdate, policy, rack,
    and zone.


    Alas, not all of them have clear descriptions. For example, you can specify racks,
    firmware, or switches, but there seems to be no tools to use or manage them (I''d
    be happy to be wrong).


    The description of one object can be distributed over several tables - tables
    the repository of all data in xCAT. There are already many more table types than
    object types, and some of them can store data from different object types to link
    these objects together.


    For example, a node description affects at least the tables domain, hosts, hwin,
    hypervisor(for container nodes), ipmi, litree, mac, nodegroup, nodelist, nodetype,
    postscripts, ....


    The list of all tables can be obtained with the tabdump command. If you add -d
    parameter, you will get the same list with explanations in English.


    By default, xCAT commands can only be executed by a superuser, which is inconvenient.
    xCAT supports permission sharing and remote management, i.e., you can install
    the xCAT server on the service node and execute commands on the management node.
    This requires installing the xCAT package on the management node and creating
    access certificates. It is important that the remote server and the xCAT server
    match and that the user details on the xCAT server are in /etc/passwd. In the
    example, the username will be xadmin.


    On the xCAT server, let''s perform certificate generation:


    ```

    /opt/xcat/share/xcat/scripts/setup-local-client.sh xadmin

    ```


    The following files will appear in the ~xadmin/.xcat directory: ca.pem, clientcert.pem,
    client-key.pem, and client-req.pem. If we want to perform remote management, we
    will copy them to the same directory on the remote server. Also, the environment
    variable XCATHOSE=xcat-server>:3001 must be set on the remote server.


    Now let''s allow the xadmin user to execute commands. To do this, edit the policy
    table with the tabedit policy command:


    ```

    #priority,name,host,commands,norage,parameters,time,rule,comments

    "1","root",,,,,,"allow",

    "2","xadmin","*","nodels",,,,,,"allow",

    ```'
