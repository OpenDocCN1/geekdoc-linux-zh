  md: "# CHAPTER 15 SLURM\n\nNote – Limits with prefix Grp summarize the resource\
    \ usage between all jobs, having this QoS, limits with Max prefix – only between\
    \ jobs, sharing specified attribute (username, account, ...). To specify TRES\
    \ limits, you can use a list, e.g., GrPTRES-cpu=20,gres/gpu:tesla=10, which will\
    \ set limit of 20 CPUs and 10 GPUs.\n\nUser associations are set by sacctmgr command.\
    \ With the sacctmgr command, you can set only associations, but also additional\
    \ constraints on each association. Below are the most useful ones:\n\n| Name |\
    \ Meaning |\n| --- | --- |\n| MaxJobs | Total number of counting tasks |\n| MaxNodes\
    \ | Number of nodes per task |\n| MaxSubmitJobs | Total number of tasks in the\
    \ queue |\n| MaxWall | Task time limit |\n\nThe time limit cannot exceed the limit\
    \ set in the partition settings, be careful. Here are some examples:\n\n```\n\
    sacctmgr add account name=acc1 [parent=accct0]\nsacctmgr add user name=user1,user2\
    \ account=acc1\nsacctmgr add assoc user=user1 account=acc1 maxsubmit=5\nsacctmgr\
    \ modify assoc where user=user1 account=acc1 \\\n  set maxjobs=2\n```\n\nTo delete\
    \ a limit, just set its value to -1. An important feature of the limits set via\
    \ sacctmgr is that there is no way to set default limits – only per individual\
    \ association.\n\n# Priorities and FairShare\n\nEach job in Slurm has a priority.\
    \ It can be set directly by admin using command like scontrol update jobid=123\
    \ priority=1000000, or, by default, a formula calculates it. In most cases, a\
    \ “multifactor priority plug-in” is used, which calculates each job priority summing\
    \ several “factors,” multiplied by a coefficient; each factor is in the range\
    \ from 0 to 1. All coefficients are tunable, so you can decide which factor impacts\
    \ the priority the most. The list of factors is follows:\n\n219"
