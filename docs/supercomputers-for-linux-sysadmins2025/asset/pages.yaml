  md: '# CHAPTER 7 UNIX AND LINUX – THE BASICS


    htop has a friendlier interface, uses color where where, displays CPU and memory
    load in the form of text bars, and can organize processes into trees (and collapse
    them into a single line, which is sometimes very convenient). Control keys are
    displayed in the bottom line in the style of Norton Commander (Midnight Commander/FAR
    manager).


    Other useful features of htop: Space key/untags processes (so you can kill or
    do anything with many processes if you want), s key allows to trace signals, made
    by process, 1 key shows opened files (using lsof, it should be installed), w key
    shows command line is a separate window, and x key shows all locks. See full list
    of hotkeys on the man page.


    I have already mentioned signals many times – they are a simple way for processes
    to communicate, any process can send a signal to another if it belongs to the
    same user (root user can send to everyone). A signal is an integer, so it doesn''t
    convey much information, but its function is to ask a process to perform some
    action. All signals except STOP and KILL can be intercepted and processed; if
    the process does not process the signal, the OS performs a predefined action for
    it.


    There are standard values for signals and actions; below are the most commonly
    used (See Table 7-1).


    # Table 7-1. Some signals in Linux


    | Number | Designation | Action |

    |---|---||

    | 9 | KILL | Terminate immediately. |

    | 15 | TERM | “Politely” end the process. |

    | 3 | QUIT | Keyboard completion signal (if the Ctrl-C combination is pressed).
    |

    | 19 | STOP | Stop execution. |

    | 18 | CONT | Continue implementation. |

    | 4 | ILL | Sent to the OS if a process has attempted to execute an invalid processor
    instruction. By default, the process is terminated. |

    | 11 | SEGV | Sent to the OS if the process has accessed a nonexistent address
    in memory. By default, the process is terminated. |

    | 8 | FPE | Sent to the OS if a floating-point operation exception occurred. By
    default, the process is terminated. |

    | 10 | USR | Custom signal, ignored by default |'
