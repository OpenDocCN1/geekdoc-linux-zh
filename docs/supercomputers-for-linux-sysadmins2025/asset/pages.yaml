  md: '# CHAPTER 7 UNIX AND LINUX – THE BASICS


    For a directory, the “execute” permission means that you can enter the directory.
    However, you are not guaranteed to see the list of files in the directory – you
    need to read permission for that. Write permission means the ability to create
    and delete files in the directory.


    Only the owner of a file (or other object) can change permissions for it. If you
    need to change permissions for a group, the owner must be a member of that group.
    And, of course, a superuser can change any rights, as well as the owner and group
    of any file.


    As it was already mentioned, the right to write to a directory allows you to create
    and delete files in it, in order to ensure the comfort of working with shared
    directories, such as /tmp, and not to delete other people’s files, the following
    was invented with an additional “sticky” flag. If a directory has this flag, only
    those who own the file and have write permission to the directory (and root, of
    course) are allowed to delete files.


    Speaking of the file system, two flags should be mentioned – laid and sgid. If
    a file has the laid flag, the EUID of the process will change to the owner of
    the file when it is started. For sgid, it is similar, but for a group. It is most
    often put on files whose execution is required with superuser rights, such as
    passwd. For scripts, they do not work. If the sgid flag is set on a directory,
    files and directories created in it automatically inherit the group. The suid
    flag on directories is ignored.


    > Note sgid flag on the directory is really useful for your users, working on
    the same project. Make sure that all project members use umask 0002, i.e., new
    files will allow group to write by default, give a project to the project directory
    and sgid bit, all new files and directories will inherit the group and will be
    available for all group members to read and write.


    As mentioned above, you can view permissions with the ls command. In the rights
    line, the first character shows the file type (‘-‘ = file, ‘d’ = directory, ‘l’
    = link, ‘s’ = socket, etc.), then three groups of rights for owner, group, and
    others with three characters each ‘r//w//x/’ for read, write, and execute, respectively
    (‘-’ means no rights). The sticky flag is indicated by a ‘t’ instead of an ‘x’
    in the ‘others’ group. suid/sgid flags are indicated by an ‘s’ in the ‘owner’
    or ‘group’ group, respectively. This line is followed by a ‘+’ character, it means
    acl is installed on this file (see below).


    You can change file permissions with the chmod command. Change the owner of a
    file with the chown command, and change the group with the chgrp command. In order'
