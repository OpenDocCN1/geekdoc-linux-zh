    distribution, but to successfully start an NFS server, it is sufficient to run
    postfix, followed by nfs and mountd. The latter is often started with nfsd, i.e.,
    the command systemctl start nfs'' often both services.


    NFS server (nfsd), as mentioned above, allows clients to work with part of their
    local system, or rather with a separate directory (as they say, "exports directory").
    In order to provide some kind of directory for clients, you need to specify it
    in the /etc/exports file. Startup options, nfs typically has no startup options,
    or accepts the number of server threads to be started. The number of these threads
    is equal to the number of concurrent operations, or if it makes sense to run as
    many as there are clients.


    The /etc/exports file consists of lines, each of which describes an export rule
    for a directory. One directory can be specified several times with different rules:


    ```

    /export/dir host1,host2,host3(rw,root_squash)

    ```


    Here, /export/dir is the directory to be exported, followed by a list of nodes
    to which access is granted, and options in brackets. The list of hosts is comma
    separated and can include both DNS names and IP addresses and subnets in the format
    1.2.3.4/8 or 2.3.4.5/255.0.0.0. In the names of hosts, you can specify * and ?,
    denoting any string or any character, e.g., *.local.net or host??.my.org. If you
    specify * or 0.0.0.0/0 as a list, any client will be granted access.


    The options may vary depending on the server implementation, but most are standard:


    +   - ro - Read-only access.


    +   - rw - Read-write access.


    +   - root_squash (default) - The client root user will have nobody (see below)
    on the server.


    +   - no_root_squash - The client root user will have root privileges over the
    server.


    > ¹/etc/init.d/nfsd start on older systems'
  merge: -1
