    You can see that in some lines, the parameters %I and %i are used; the instance
    name will be passed through when creating an instance from the template. The difference
    between them is that %I will be the real name, and %i – an adapted name, in which
    the characters ‘/’ will be replaced by ‘-’, and special characters (including
    ‘-’) by their hex code in the format \xAB. Therefore, the second option is convenient
