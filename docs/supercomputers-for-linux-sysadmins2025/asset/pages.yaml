  md: '# Alternatives


    Today, real alternatives to InfiniBand are RoCE and SlingShot. RoCE may be cheaper
    but usually lacks advanced routing and still had higher latency. In addition,
    you miss the network observability. SlingShot is very similar to InfiniBand; it
    has FabricManager, similar to SubnetManager in IB, supports wide range of topologies,
    has convenient network management tools, and has low latency and high speed and
    Ethernet compatibility. The key disadvantages of SlingShot in my opinion are limited
    community and in fact computational software support via libfabric.¹ Libfabric
    is an open source and well-supported initiative, which allows for using almost
    any network for the communication with low overhead. But still the libfabric itelf
    is the overhead and gives slightly lower performance than raw IB Verbs.


