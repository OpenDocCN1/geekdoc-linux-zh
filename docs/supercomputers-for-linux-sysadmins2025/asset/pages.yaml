  md: '# CHAPTER 20


    # Backup


    # Tar


    The tar (Tape ARchiver) command is one of the oldest commands in UNIX systems
    and is designed to work with tape drives. The command combines files into a single
    file to be written to magnetic tape. Although the tar command was created to work
    with tape devices, nowadays it is more often necessary to work with files located
    on disks; if you use -f-option, the archive is stored into specified file. By
    itself, tar is an archiver with very limited capabilities, e.g., it cannot compress
    files on its own. The Gnu version of the tar command on Linux systems can invoke
    the gzip, bzip2 or any other archivers to create compressed archives. The use
    of external archivers is reflected in the names of the archives, which usually
    have the extensions .tar.gz (.tgz) or .tar.bz2 (.tbz2), depending on which archive
    used to compress the files.


    When calling tar, you must be sure to compress one of the eight modes of operation
    using one of the key, presented in the Table 20-1.


    Table 20-1. Modes of operation of the tar command

    | Key | Meaning |

    | --- | --- |

    | -A, --catenate | Add files to an existing archive |

    | -c, --create | Create a new archive |

    | -d, --diff, --compare | Find the differences between the files in the archive
    and on disk |

    | --delete | Delete files from the archive (does not work on tapes) |

    | -r, --append | Append files to the end of the archive |

    | -t, --list | List the files in the archive |

    | -u, --update | Add only files that are newer than the existing copy in the archive
    |

    | -x, --extract, --get | Extract files from the archive |'
  merge: -1
  pgno: 300
- img_proc: true
  md: 'Note that single-letter tar options can be specified without the ''-'' prefix
    and can also be ''glued'' together. If several ''glued'' options require arguments,
    you should specify them in the same order as the options, but it is better to
    avoid such situations and not ''glue'' such options.


    General view of the tar command:


    ```

    tar [options] [files]

    ```


    To create an archive, the ''c'' option is used, frequently in conjunction with
    ''f'', to specify the name of the archive.


    ```

    tar cf filename_archive file1 file2

    ```


    Here file1 and file2 are the names of files that will be added to the archive
    when it is created. If a directory name is specified, its contents, including
    subdirectories, will be added to the archive. In the example below, all files
    with the extension ''.c'' located in the current directory and the includes directory
    are written to the archive named project:


    ```

    tar cf project.tar *.c includes

    ```


    File compression by archivers is enabled by the options z for the gzip archiver
    and j for the bzip2 archiver. GNU-tar, it is also possible to specify your own
    command for compression with the I key (the specified program must accept the
    -d key to decompress). This allows to use, e.g., pigz - parallel version of gzip,
    which can compress (but not decompress) data on many CPU cores. This is what the
    previous example with compression looks like:


    ```

    tar cvzf project.tar.gz *.c includes # gzip archive

    tar cvjf project.tar.bz2 *.c includes # bzip2 archive

    ```


    The v option outputs a list of processed files. This command will archive all
    files and folders in the ./folder directory while preserving its full structure:


    ```

    tar xvzf project.tar.gz /folder

    ```


    Files are unpacked using the x option. You can unpack the contents of the project.tar.gz
    file into the current directory with recreation of the entire directory and subdirectories
    structure from the archive file as:


    ```

    tar xvzf project.tar.gz

    ```'
