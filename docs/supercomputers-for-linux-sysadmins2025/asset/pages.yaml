  md: '# CHAPTER 7 UNIX AND LINUX – THE BASICS


    to change file permissions, the chmod command needs to specify the new permissions
    in octal or character format. The latter option allows you to add or remove separate
    permissions for the owner, group, or others, e.g.,


    ```

    chmod 660 myfile # read and write for owner and group

    chmod g-w myfile # remove write acces for the group

    ```


    In character form, chmod specifies one or more ‘u/g/o/a’ characters (owner, group,
    all three groups together), followed by a ''+'' or ''-'' character to set reset
    permissions, and one or more ‘r/w/x’ characters to indicate which permissions
    are affected. For example, chmod go+rw would allow read and execute permissions
    for group and others to myfile.


    The system described covers many needs, but not all. To improve it, various extensions
    implemented in Linux file systems have been created. One of them is extended file
    attributes. These are enabled by default and can be viewed and modified by the
    lsattr and chatter commands. The most important ones for us are presented in Table
    7-2.


    # Table 7-2. Some extended attributes


    | Attribute | Char | Meaning |

    |---|---|---|n| Append only | a | You can''t “erase” a file; you can only overwrite
    the information |

    | Compressed | c | Use compression (if supported) |

    | Immutable | i | File cannot be modified |

    | Secure deletion | s | File data is overwritten when deleted |

    | Undeletable | u | File cannot be deleted |

    | No time updates | A | Do not update the “last access time” field |


    If an extended attribute prohibits some action (such as deletion), this applies
    even to the superuser (unlike regular attributes). The superuser can easily unset
    or set any of them. Another extension, usually requiring activation on the file
    system, ACL (Access Control List). These can be viewed and modified with the getfac
    and setfac commands. They work similarly to the traditional access rights discussed
    above, but read/write/execute permissions can now be set for individual users
    and/or groups, as well as restricted by a mask. A mask is a set of “maximum” permissions
    from acl rules'
