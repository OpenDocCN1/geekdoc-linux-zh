    # CUDA


    The word "CUDA" often refers to several similar but different things: the programming
    technology offered by NVIDIA, the library and compiler to support this technology,
    and even the architecture of graphics cards and gas pedals that support this technology.
    The same is true for the CUDA version: sometimes it may be the revision number
    of the standard for the programming technology, sometimes it may be the software
    version, and sometimes it may be the maximum version of the standard supported
    by the gas pedal. Officially, NVIDIA calls CUDA a "parallel computing platform
    and programming model."


    The main tool for the CUDA programmer is the nvcc compiler, which supports the
    CUDA dialect of the C language. It is used to compile files with the .cu extension.
    Besides direct use of the compiler, it is possible to call CUDA functions from
    ordinary C or Fortran programs using the cudart library; this library is included
    in the CUDA SDK.


    Installation of CUDA SDK is quite simple. Download the RPM package or installer
    from the official website, and make sure the gcc compiler is installed on the
    host. Then install the downloaded package, which will add the official repository
    entry to the system, perform a repository update (yum clean-cache or zypper refresh
    or apt-get update depending on the distribution), and install the CUDA package:
    yum install CUDA or zypper install CUDA or apt-get install CUDA.


    If a binary installer has been downloaded, just run it, and it will automatically
    download and install the necessary files. The disadvantage of the binary installer
    is that it does not install the package into the system, which means that you
    will need to manually install the binary installer again when upgrading.


