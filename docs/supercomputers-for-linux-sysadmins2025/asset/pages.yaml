  md: 'both clients and servers for it. The authors have no successful experience
    in organizing RDP server on Linux.


    A good alternative is the x2go protocol, which is an open source variant of the
    closed NX protocol developed by NoMachine. x2go clients and servers are available
    for most distributions from a separate repository, as well as for Windows.


    The server doesn''t need to run a separate service – just install the required
    package. The client accesses the server node via ssh protocol (which solves many
    authentication problems) and runs the server program as a user. Thus, the use
    of x2go is not inferior to VNC; it also supports compression, scaling, and the
    ability to transfer the image not the entire desktop but only the windows of one
    program.


    You can also work with the previously mentioned NX protocol; it requires a server
    and a client from https://nomachine.com/. There are clients for Windows and Linux.
    In the free version, the server allows no more than two users to work simultaneously.
    An additional plus of NX is the ability to authenticate by password with session
    saving and possible subsequent reconnection.


    Another alternative is the SPICE protocol, but it is less widespread. You can
    learn more about it at https://www.spice-space.org/.


    # Brief Summary


    Remote access is the “face” of your computing complex for users (after the official
    website and registration, of course). It is the one they will use 99% of their
    time. Try to make the access process comfortable: describe basic procedures, problems
    on the site, and supplement this information with answers to questions as they
    come to you from users.


    For a supercomputer, for any server, the principle works: the less access, the
    better. But at the same time, users should not be clamped in a hedgehog’s grip.
    SSH combined with SCP/SFTP is usually sufficient for normal operation.


    # Search Keywords


    Ssh, putty, shellinab, secure ftp, xserver, X11, vnc, nx, rdp, spice remote, x2go,
    IDS, LXC, KVM/QEMU, logcheck, logwatch'
