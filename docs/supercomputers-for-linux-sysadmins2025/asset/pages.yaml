  md: '# CHAPTER 4 SUPERCOMPUTER HARDWARE


    Strictly speaking, CIFS and SMB are two different names for the same network file
    system originally developed by IBM and actively used in Microsoft operating systems.
    Nowadays, CIFS can be used in almost any operating system to provide access to
    files over a local network, but I don''t recommend using it, because of highly
    possible unexpected problems, related to implementation details. As a rule, NFS
    and CIFS, NAS systems can also provide access to stored data via other protocols
    such as FTP, HTTP, or iSCSI.


    Storage devices connected via dedicated storage area networks (SANs) are usually
    visible to the operating system as locally attached devices. The peculiarity of
    SAN is that duplicate switches can be used to form such a network in order to
    increase reliability. In this case, each node will have several routes for accessing
    the storage, one of which is designated as the main one, the rest are backup nodes.
    In case of failure of one of the components through which the network passes the
    primary route, access will be via the backup route.


    Switching to a backup route will be instantaneous, and the user will not detect
    that anything has failed at all. For this work, the hardware and OS must support
    multipath. Note that although there are standards for multipath, in reality, there
    are often "capricious" equipment, which requires nonstandard drivers or system
    software packages to work correctly with multipath.


    Note that SAN exports block devices, not a file system, and you should not mount
    one network device on more than one node at once. There are some exceptions, e.g.,
    for implementing “heartbeat” techniques, or sophisticated databases, but in general
    this is bad idea.


