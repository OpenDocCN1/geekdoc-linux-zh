  md: '# CHAPTER 19 CLUSTER STATUS MONITORING SYSTEMS


    +   * On the ISA bus

    * Using I2C and SMBus

    * Via SPI (Serial Peripheral Interface)

    * Integrated into the super-I/O controller

    * Integrated into the motherboard''s south bridge


    as well as


    +   * Temperature sensors integrated into the processor

    * Temperature sensors in the memory modules


    A special sensors-detect script written in perl is used to configure lm sensors.
    The script sequentially searches through the supported controllers, determining
    which kernel modules need to be loaded in order to read information from sensors
    located inside the computer. During operation, sensors-detect generates the configuration
    file /etc/sysconfig/lm_sensors, which lists the kernel modules to be loaded.


    The /etc/sensors3.conf file defines the format of data output. In the latest versions
    of LM-sensors, the /etc/sensors3.conf file is used. The file is written during
    package installation and contains entries for all supported sensors, each of which
    refers to a certain chip or chip family with the same parameters. The record begins
    with the keyword chip, followed by the names of the associated chips. The names
    are separated by spaces. They themselves consist of several fields separated by
    dashes.


    The first field is the chip type; the second field is the name of the bus to which
    the sensor is connected; the third field is the hexadecimal address of the chip.
    For an LM78 chip with address 0x2d on the I2C bus


    The chip can monitor many sensors. For example, the LM78 chip can control up to
    seven voltage sensors, one temperature sensor, and three fan sensors. Standardized
    sensor names are used:


    +   * in0, in1, in2, ... - For voltage

    * fan1, fan2, fan3, ... - For fans

    * temp1, temp2, temp3, ... - For temperature'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# CHAPTER 19 CLUSTER STATUS MONITORING SYSTEMS


    Each sensor can have several parameters: current value, minimum, maximum, and
    alarm values. Parameter names are also standardized. For example, for an in0 sensor,
    the parameter containing the current value is called in0_input; the minimum value
    is called the in0_min; the maximum value - in0_max; and containing alarm value
    - in0_alarm. Within the records, four keywords define the format of the output
    information.


    The label operator specifies which name to output the corresponding sensor:


    label in3 +5V


    The first field specifies the sensor, and the second field specifies how this
    sensor will be displayed in the output. The ignore operator specifies that no
    information should be output from the corresponding sensor. For example, in the
    case the return value is garbage: ignore fan1


    The compute statement is used to specify a formula for converting a read sensor
    to an output value. It is commonly used to output voltage data since it is usually
    taken from voltage dividers:


    ```

    compute in3 ((6.8/10)+1)*, @/((6.8/10)+1)

    ```


    The first parameter is the sensor name, and the second is an expression that specifies
    how the read value should be converted to an output value. “@” indicates the read
    value. The third parameter is an expression that specifies how the output value
    should be converted back to the sensor value. In this case, “@” denotes the output
    value; this formula is used if the data needs to be written to the chip. A comma
    separates functions.


    The set statement is used to write values to the chip:


    ```

    set in3_min 5 * 0.95

    set in3_max 5 * 1.05

    ```


    Not all values can be written to the chip, mainly the minimum and maximum allowable
    values. To write data to the chip, a command with a special option is used:


    ```

    sensors -s

    ```'
