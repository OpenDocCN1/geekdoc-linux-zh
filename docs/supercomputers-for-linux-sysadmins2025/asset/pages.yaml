  pgno: 231
- img_proc: true
  md: 'may be used to distinguish resource subtypes. :no_consume means Slurm won''t
    count it if a job requires this resource. Here is an example:


    GresType=gpu, fastfs

    Gres=gpu:volta:8,fastfs:lustre:no_consume:100G


    Some generic resources, e.g., GPUs can be autodetected by Slurm. Add gres.conf
    configuration file in the same location as other config files. In this file, you
    can specify the autodetect method and specifications for specific nodes. Here
    is an example:


    AutoDetect=nvml

    NodeName=nv4-[1-8] AutoDetect=off Name=gpu \

    File=/dev/nvidia[0-3]

    NodeName=amd-[1-4] AutoDetect=rsmi


    Here for all nodes by default, autodetect NVIDIA GPUs are enabled. For nodes nv4-[1-8],
    we force four GPUs and specify their devices. If any device is missing, Slurm
    will mark the node as invalid. For nodes amd-[1-4], we enable AMD GPUs autodetect.


    Please refer to the docs for current supported autodetect methods and additional
    options.


    You can use NodeSet to shorten your nodes lists in partition definitions:

    NodeSet=Set1 Nodes=n[10-20],n[55,66,77]


    # Generic and Trackable Resources


    Slurm supports tracking and limiting nodes resources, some of them are predefined
    (trackable resources), and some you can declare by yourself (generic resources,
    see above). List of supported trackable resources, which are tracked by default:


    +   * Billing

    * CPU

    * Energy'
