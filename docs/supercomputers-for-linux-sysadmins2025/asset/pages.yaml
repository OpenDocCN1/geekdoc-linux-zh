    speed. The term latency (delay) is the net time to transmit a zero-length message.
    It primarily depends on the time taken by network devices, and the system to prepare
    for transmitting and receiving information.


    Throughput and latency provide a measure of how efficiently tasks will be handled
    on the cluster. If a task requires frequent data exchange between nodes, using
    network hardware with high latency will result in most of the time spent on preparation
    rather than data, and the nodes will not be idle. With low bandwidth, data exchange
    between nodes will not keep up with the task count rate, and will have a negative
    impact on performance: nodes will spend a lot of waiting for data over the network.


