  md: '# CHAPTER 21 COMPILERS AND ENVIRONMENTS, FOR PARALLEL TECHNOLOGIES


    The simplest one – for one person (account) on one fixed computer. It is usually
    available from all compiler manufacturers, but in our case, this option is rarely
    suitable: we need to provide compilation for all our users.


    Another type of license is for an unlimited (rather large) number of users, but
    on a fixed computer. As a rule, this is the most optimal option, but it is not
    always available from compiler manufacturers.


    Another option limits the number of simultaneous users of the compiler, e.g.,
