    # Other File Systems


    Among other distributed proprietary file systems, I can also note Weka. I didn’t
    use it, but have good feedback from my friends. It has a lot of features, like
    POSIX, NFS, SMB, S3 and GPUDirect storage support, storage peering, namespaces,
