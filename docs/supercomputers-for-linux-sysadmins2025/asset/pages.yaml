  md: '# CHAPTER 19 CLUSTER STATUS MONITORING SYSTEMS


    collectd - it is modular and includes a lot of ready to use modules. In addition,
    it supports aggregation modules and store modules, so you can aggregate your data
    and send it using any protocols or store it in any formats. Action modules are
    also available, so you can implement a simple alerting system using collect.


    Data storage - There are several high-performance time-series databases, one of
    the most common is InfluxDB; it supports many types of requests with aggregations
    and selections. The next one is Prometheus TSDB, which is similar to InfluxDB
    and works natively with prometheus collectors. VictoriaMetrics is highly optimized
    time-series database; it is much faster than InfluxDB and requires less disk space,
    but cannot store any string data, only numeric data. PostgreSQL and MongoDB time-series
    extensions, because they have well known by many people query language and decent
    performance (but I still recommend to use native time-series database).


    Data visualization - The leader today is Grafana - it allows getting data from
    almost any source and visualize it in dozens ways. Because of modular structure,
    you can create custom databases requests and then filter the data as you want.
    Next option is Kibana - a lot of predefined profiles, visualization methods, and
    analytics. The drawback is that it is highly oriented on the Elasticsearch search,
    and it is not so easy (but sometimes possible) to integrate it with other software.
    And, of course, there are commercial solutions like Splunk and DataDog and commercial
    options for ElasticSearch and Grafana.


    Data processing and alerting - Prometheus has special package called alertmanager,
    Grafana project implemented its own Grafana Alert, I mentioned collectd processing
    and action modules and of course commercial options of ElasticSearch, Splunk,
    DataDog, and companies, who specialized on alerting, like PagerDuty.'
