- img_proc: true
  md: '# CHAPTER 21 COMPILERS AND ENVIRONMENTS, FOR PARALLEL TECHNOLOGIES


    In addition, LMOD supports on-the-fly change of the list of paths to module files
    (MODULEPATH variable). This allows you to dynamically generate lists of available
    modules. For example, when loading a compiler module, the path to the modules
    directory is added to the MODULEPATH variable for the version of packages built
    by this particular compiler (and this version of the compiler). When MODULEPATH
    is changed, not only new modules are available, but also what modules are no longer
    visible. Such modules are marked as inactive, i.e., the environment variables
    are modified as when the module is unloaded, the module itself remains in the
    list of loaded modules (with the corresponding marking).


    If later, due to changes in the MODULEPATH variable, a module with the same name
    becomes available, it is automatically loaded. In this way, it is realized as
    replacement of module versions in case of other modules which this module depends.


    For example, a cluster may have a version of OpenMPI built by two different compilers:
    gcc and Intel Compiler. We can load the gcc module and the OpenMPI module sequentially.
