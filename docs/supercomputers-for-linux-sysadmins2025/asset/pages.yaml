- img_proc: true
  md: '# CHAPTER 10 REMOTE MANAGEMENT


    SSH is based on two types of encryption: symmetric and asymmetric (public key).
    Symmetric encryption uses the same key for both the encryption and decryption,
    i.e., both parties must have the same key to exchange data.


    Asymmetric encryption algorithms use a pair of keys: one of them can encrypt the
    data and the other can decrypt. But with only one key, you cannot perform both
    operations or recover the second key.¹


    Thus, we can generate a pair of keys, one of which will be “public.” It can be
    transmitted through open channels to everyone with whom we need to communicate,
    published on the Internet (there are even key servers). The second key is called
    the private key; it should remain a big secret. Now, for secure communication
    between two parties, they need to exchange public keys and start encrypted data
    exchange: everything that one of them encrypts with its private key, the other
    can decrypt with the received public key. Moreover, it is often enough to have
    one key pair, since the second respondent can send data to the first by encrypting
    it with the public key received, while the first one decrypts it with the private
    key!


    The SSH protocol uses keys to identify not only clients but also servers. Each
    SSH server has its so-called host key. When connecting to a server for the first
    time, the client will ask the server for the key and ask the user to confirm that
    this is the right server by showing the fingerprint. If the user knows the correct
    fingerprint beforehand, the user can compare it to the reference and refuse the
    connection if they differ. If the user has confirmed the connection, the client
    stores the match between the host key and the server address (usually in the ~/.known_hosts
    file). In case the next connection shows that the host key has changed, ssh will
    reject the connection.


    This is to make it impossible to replace the remote server with your own and intercept
    the transmission of information while acting as a transmitter. This type of attack
    is called a man-in-the-middle attack.


    In the SSH protocol, a typical session occurs like this:


    +   - The client connects to the server and establishes an encrypted connection
    with a symmetric key using the Diffie-Hellman algorithm, then all communication
    is encrypted with this key.


    > ¹ In some algorithms, the private key can be used to recover the public key,
    but not vice versa. openssh, the public key is also stored in the private key
    file.'
  merge: -1
  pgno: 159
- img_proc: true
  md: '+   - If the client has the server’s public host key, it generates a random
    string, encrypts it with this key, and passes it to the server (if the key is
    not available, the client requests it from the server and asks the user to authenticate).


    +   - The server decrypts the string with the private host key and sends it to
    the client.


    +   - If the string matches the initial string, the client sends the server username
    under which access is requested.


    +   - The client tries possible key pairs for connection, and each attempt starts
    with sending the public part of the key to the server.


    +   - The server checks if the public key is in the list of allowed keys (in the
    ~USER/.ssh/authorized_keys files).


    +   - If there is no, the client tries the next key pair.


    +   - If the key exists, the server encrypts a random string with it and sends
    it to the client.


    +   - The client decrypts the string with a private key and sends it to the server.


    +   - If decryption is successful, the server acknowledges the session and starts
    the requested command or console session.


    Symmetric encryption is used because it is less resource intensive and to reduce
    the amount of data that can be intercepted and attempt to recover the private
    key. The symmetric key is periodically changed during an ssh session. SSH servers
    typically support nonpublic key authentication, such as password or Kerberos.
    In all case, all data is encrypted with symmetric keys.


    I strongly recommend that you do not use password authentication. Passwords are
    not very resistant to brute force, i.e., an attacker can simply pick the right
    password and no encryption will save them. That’s why “secure” versions of telnet
    and ftp over SSL/TLS encrypted connections are also considered insecure. It is
    almost impossible to find a private key. There is a possibility that the key itself
    be stolen, but even in this case, there is an additional guarantee: SSH private
    keys can (and should!) be password protected.'
