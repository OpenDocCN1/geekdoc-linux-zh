    # ScaLAPACK


    The most important role in numerical methods belongs to the solution of linear
    algebra problems. This is reflected in the fact that all manufacturers of high-performance
    computing systems supply with their systems highly optimized subroutine libraries,
    including mainly subroutines for solving linear algebra problems. The most common
    standard libraries in this area are BLAS, LINPACK, and LAPACK, originally developed'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# CHAPTER 22 PARALLEL COMPUTING SUPPORT LIBRARIES


    by Jack Dongarra, Jeremy Du Cruz, Sven Hammarling, and other researchers. They
    are distributed in open source; their optimized variants are included in such
    libraries as Intel MKL (Math Kernel Library) and ACML (AMD Core Math Library).


    With the emergence of multiprocessor systems with distributed memory, work began
    porting the LAPACK library to this platform as the most fully compliant with the
    architecture of modern processors (subroutines are optimized for efficient use
    of cache memory). Leading scientific and supercomputer centers of the USA participated
    in the work on LAPACK library porting. The result of this work was the creation
    of ScLAPACK (Scalable LAPACK) subroutine package. The project was successful,
    and the package actually became a standard in the software of multiprocessor systems.
    In this package, the composition and structure of the LAPACK package are almost
    completely preserved and the references to the top-level subroutines are practically
    unchanged. The success of this project was based on two fundamentally important
    decisions:


    +   In the LAPACK package, all elementary vector and matrix operations are performed
    using highly optimized subroutines of the BLAS (Basic Linear Algebra Subprograms)
    library. By analogy with this, a parallel version of this library – PBLAS – was
    developed to implement ScLAPACK, which eliminated the need to radically rewrite
    top-level subroutines.


    +   All communication operations are performed using subroutines from the specially
    developed BLACS (Basic Linear Algebra Communication Subprograms) library, so porting
    the package to different multiprocessor platforms requires setting up only this
    library.


    The general structure of the ScLAPACK package is shown in Figure 22-1. Here, the
    package components above the dividing line contain subroutines that are executed
    in parallel on some set of processors and use vectors and matrices distributed
    over these processors as arguments. Subroutines from package components below
    the dividing line are called on a single processor and operate on local data.
    Each of the package components is an independent library of subroutines that is
    not part of a library ScLAPACK, but is necessary for its operation. In cases where
    optimized proprietary implementations any of these libraries (BLAS, LAPACK) are
    available on the computer, it is strongly recommended to use these implementations
    for better performance.'
