    # Nagios


    The Nagios monitoring system was developed by the company of the same name exists
    in two variants - core (community) and a set of applications based on core (Nagios
    XI, Nagios Fusion, etc.). This system has become a default standard in many applications,
    mainly for monitoring equipment and network services. It is built on a modular
    principle – to perform monitoring of a certain type of services. I should note
    that there is an alternative implementation (a fork), named Icinga (https://icinga.com/),
    which has some additional features, but they lie outside our topic away, so I
    won''t make difference between it and Nagios here.


    There are numerous plug-ins for Nagios that allow you to monitor almost any type
    of service - SMTP, HTTP, SNMP, etc., as well as network equipment – Cisco, Brocade,
    etc.


    By default, Nagios is installed in a centralized manner: a server is installed
    on the master server, and data is collected and transmitted from the other nodes
    using execution via SSH, or local agents, using internal NRPE protocol. Using
    some techniques, it is possible to build hierarchical schemes as well as fault-tolerant
    ones. The basic installation does not include a web or GUI interface, but there
    are many clients that provide different interface options, but they do not provide
    configuration'
