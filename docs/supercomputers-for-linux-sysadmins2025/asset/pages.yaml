  md: '# CHAPTER 19


    # Cluster Status Monitoring Systems


    # SNMP


    SNMP (Simple Network Management Protocol) is a protocol designed for management
    and monitoring. It was created in 1988 and is supported by most network devices.
    It is a de facto industry standard, and many hardware platforms support it. The
    goal of this protocol is to give the ability to get monitoring data from (almost)
    any device and change its settings. At the moment, there are three major versions
    of the protocol: 1, 2c, and 3.


    First version uses "Simple" in the title as a keyword. Because of this simplicity,
    this version has a lot of problems – short counters, poor security, and no encryption.
    Version 2c (c = "community") is probably the most common today. It has additional
    commands, compared to version 1, but still has poor security and no encryption
    support. The only security feature in both versions is the "community" string
    with optional password. You can treat "community" as a "login." Third version
    supports authentication, encryption, and user-based views.


    Each device has its own set of internal variables and commands that are grouped
    into a tree structure. The names of all variables are encoded according to this
    structure (similar to DNS names). Such a name is called "object identifier" (OID).
    The description of the correspondence of OIDs to their actual purpose and type
    is stored in the management information base (MIB). There can be a different MIB
    for each type of device. SNMP supports several types of variables: integers, counters,
    strings, from more complex types – only tables. As a rule, interface counters
    of network devices are organized into tables.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# CHAPTER 19 CLUSTER STATUS MONITORING SYSTEMS


    OID consists of a sequence of numbers, e.g., 1.3.6.1.2.1.1.1.3. Such representation
    is not very convenient for perception, so MIB files usually contain “human-readable”
    names for OIDs. For the previous example, such a name would be iso.org.dod.internet.mgmt.mib-2.system.sysUpTime
    – the time the device has running since it was powered on. Most OID branches are
    standardized by IETF, ISO, and IANA, but are “given” to other organizations. A
    separate branch is dedicated to manufacturers, where each subbranch is controlled
    by a dedicated organization, e.g., Cisco, APC, etc.


    In SNMP terms, a device supporting SNMP protocol is called an agent (although
    it acts as a server), and a program communicating with the agent (management or
    monitoring) is called a manager. As a rule, the agent passively responds to the
    manager’s requests, but the protocol provides “traps”, notifications, which the
    agent can send to the manager in special cases. Usually, it is a signal about
    anomalies in the work, and the set of trap types is hardcoded in the agent. SNMP
    agent mainly uses UDP protocol and port 161. Notifications are sent to port 162
    of the manager. The encrypted version of the protocol (v3 TLS) uses ports 10161
    and 10162, respectively, or use 161 and 162 ports.


    Here is the set of commands used in the SNMP protocol:


    +   * GetRequest – A request to the agent from the manager to get the value of
    one or more variables

    * GetNext – A request to the agent from the manager to get the value of the next
    variable in the hierarchy

    * SetRequest – A request to the agent to set the value of one or more variables

    * GetRepse – A response from the agent to the manager returning the requested
    values

    * GetBulkRequest – A request to the agent to get a range of variables

    * Trap – One-way notification to the manager from the SNMP agent about the event


    > ¹https://www.rfc-editor.org/info/rfc6353'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# CHAPTER 19 CLUSTER STATUS MONITORING SYSTEMS


    When the manager calls the agent, it is necessary to correctly specify not only
    the OID, but also the protocol version, as well as the community - the name of
    the group that is allowed to access this variable and, if necessary, the password.
    Different versions of the SNMP protocol are incompatible, so it is important to
    specify the exact version of the protocol. Most devices support version 2c.


    To install command-line client programs (managers) in most distributions, it is
    enough to install the net-snmp package or sometimes snmp. The most interesting
    commands for this package are snmpget/snmpbulkget and snmpwalk/snmpbulkwalk. With
    their help, you can read values of specified variables or whole subtrees. If the
    snmpwalk command is not given the initial OID, it will try to read the entire
    tree from iso.org.internet.mgmt.mib-2 (where all branches for network devices
    start).


    The purpose of the snmpget program, is easy to: set the values of a variable.
    It can be a sensor threshold, a server name, an email address, etc.

    Let''s look at an example:


    ```

    $ snmpget -v 2c -c public test.net-snmp sysUpTime.0

    DISMAN-EVENT-MIB:sysUpTimeInstance Ticks:(4953618) 13:42:36:18

    ```


    Here we request the uptime of the test.net-snmp server it was last powered on.
    Now that by default, it is allowed to omit the prefix "iso.org.dod.internet.mgmt.mib-2".


    Another example is the description of MIB element we just received:


    ```

    $ snmptranslate -Td -Ib ''sysUpTime''

    SNMPv2-MIB::sysUpTime

    sysUpTime OBJECT-TYPE

    -- FROM SNMPv2-MIB, RFC1213-MIB

    SYNTAX TimeTicks

    MAX-ACCESS current

    STATUS current

    DESCRIPTION "The time (in hundredths of a second) since the

    the network management portion of the system was last

    re-initialized."

    ::={ iso(1) org(3) dod(6) internet(1) mgmt(2) mib-2(1) system(1) 3 }

    ```'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# CHAPTER 19 CLUSTER STATUS MONITORING SYSTEMS


    The snmptranslate command outputs description of the element (description), access
    level (max-access), and its full path (last line). This command does not access
    remote servers; it only translates complex MIBs into a human-friendly format.


    The next example is the operation of the snmpwalk command. With its help, we can
    "bypass" a whole tree of values without knowing its composition beforehand. Let''s
