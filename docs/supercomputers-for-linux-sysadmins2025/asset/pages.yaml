  md: '# CHAPTER 7 UNIX AND LINUX – THE BASICS


    Here eth0 is the physical interface, vlan101 is the name of the new interface
    through which traffic will flow to the VLAN, and 101 is the VLAN identifier. Accordingly,
    a VLAN with ID 101 must be created and configured on the switch.


    To have this interface automatically created at startup, on RedHat-like systems,
    create the file /etc/sysconfig/network-scripts/ifcfg-vlan101 and write a text
    similar to the one below:


    ```

    VLAN=yes

    VLAN_NAME_TYPE=VLAN_PLUS_VID_NO_PAD

    DEVICE=vlan101

    PHYSDEV=eth0

    BOOTPROTO=static

    ONBOOT=yes

    TYPE=Ethernet

    IPADDR=10.10.101.0

    NETMASK=255.255.255.250

    ```


    Please note that in modern Linux, distributes may be newer network manager systems,
    e.g., NetworkManager (please don''t use it on compute nodes and servers...), or
    netplan.


    I strongly recommend that you study the documentation for the ip command and use
    it.


    It is not necessary (although desirable) to know how to configure switches in
    detail; often you can invite a specialist to configure them only once. I''m not
    a big expert in switches, but I want to mention several Ethernet technologies
    that should take care of or be aware of, as an HPC admin: spanning tree and link
    aggregation groups (LAG).


    Spanning tree protocol (STP) is described in the IEEE 802.1D standard, but there
    are some variations. This protocol is aimed to eliminate any loops in the Ethernet
    network. If this protocol detects a loop, one of the ports, included into the
    loop, is disabled and entire network (subnet) becomes a tree. Because of that
    in most cases in an Ethernet network there is exactly one central (top) switch,
    which becomes a single point of failure. There are some strategies on how to eliminate
    this, but they highly depend on switch models and supported protocols.'
