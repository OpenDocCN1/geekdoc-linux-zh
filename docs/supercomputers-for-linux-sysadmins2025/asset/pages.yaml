  md: '# CHAPTER 15 SLURM


    Note that here you should use partition and name=… separately. Only accounts acc1
    and acc3 will be able to submit jobs to the new partition.


    # Nodes


    In slurm.conf file, nodes are declared via NodeName=… lines. You can use several
    sets of nodes or declare each node in its own line (don’t do that, please). After
    the equal sign, the list of nodes follows, and after space, you can specify nodes
    attributes. If you specify special name DEFAULT, then the attributes in this line
    will be applied to all nodeName line, till the next DEFAULT line if any. Explicit
    values in the attributes list override default values.


    Some important attributes for nodes:


    | Name | Meaning |

    | NodeHostname | If the real node hostname differs from NodeName, specify it |

    | NodeAddr | Node IP address (optional) |

    | Boards, CPUs, Sockets, SocketsPerBoard, CoresPerSocket, ThreadsPerCore, RealMemory
    | Motherboards, CPU cores, CPU sockets, and memory on the node. Detected by default,
    but may be overridden |

    | Features | List of any node feature strings, see below |

    | Gres | List of generic resources, see below |

    | Weight | If you really want some nodes to be more often used for jobs, set higher
    weight for them |


    Node features are generic node markers. For example, some nodes have access to
    additional file system, then you can mark them using Feature attribute. Users
    can require node with exact features when they submit a job. Features are Boolean
    – node either has a feature, either not.


    Generic resources are measurable resources the node has, e.g., GPUs, fast access,
    etc. Their names should be defined in GresType config parameters before the use.
    Format is <name>:<type>][:<no_consume]:<number>[K|M|G]. Type is optional and


    214'
