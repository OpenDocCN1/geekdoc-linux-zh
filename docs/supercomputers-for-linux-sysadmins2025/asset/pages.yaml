- img_proc: true
  md: '# CHAPTER 9 NETWORK FILE SYSTEMS


    If you want to retire the OST, e.g., you see the hardware issues, you can disable
    it using lctl --device N deactivate, where N is the "device number" of desired
    OST. You can get it using lctl1 dl command, which lists all "devices" visible
    on the client. After that, Lustre will stop to allocate new objects on the OST
    and you can migrate the data to others OSTs using lfs_migrate command. Removing
    and replacing of OSTs is in active development in 2025; check your Lustre version
    instructions, if they are supported.


    # Fault Tolerance in Lustre


    Lustre does not support data duplication or redundancy³,i.e., if data on OST or
    MDT is physically lost, it is impossible to recover it using Lustre tools. In
    the case of MDTs, this usually equates to losing the entire file system. That
    is why RAID is recommended, although it does not guarantee data safety. You can
    try to recover the (some) data, using officially recommended methods for your
    Lustre version.


    To make the situation a bit better, and at least minimize the risk of failing
    a server, but not a data volume, we use multiple service nodes in the volume definitions.
    If one node fails, the "partner" can mount its volumes and continue to serve them.
    The problem is that Lustre cannot do this on its own. As a rule, for this purpose,
    Corosyc+Pacemaker or similar software is used. Here we will not consider their
    configuration, but there is nothing complicated in it. Please pay attention to
    the installation and configuration; it does matter. In order for this mapping
    to work, the OSTs must be physically connected to two (or more) OSSs – service
    nodes. Common case is when two OSSs share the same OST set, but first mounts the
    first half of them, and the second - the rest.


    Network redundancy means that the OSS can be accessed via multiple addresses,
    e.g., via InfiniBand and via Ethernet. Both routes are used at the same time,
    but if one of them stops, communication will only continue via the second route.
    The addresses (and LNET drivers) must be prescribed in the file system settings
    in advance.


    > If multiple interfaces on the same subnet are used, traffic will always go through
    the first one. This is a limitation of the Linux kernel, use bonding for such
    configurations.


    ³ In the beginning of 2025


    132'
