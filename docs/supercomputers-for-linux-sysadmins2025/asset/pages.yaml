  md: '# CHAPTER 11


    # Users – Accounting Management


    # Account Synchronization


    Account management becomes a challenge in a supercomputer environment. One of
    the most important issues here is to ensure account synchronization between all
    nodes. This can be achieved in different ways: by using single data source over
    the network, like LDAP or NIS+, and by running periodic (or event-driven) synchronization
    of static information.


    In most cases, it is sufficient to keep basic information (uid, gid, home dir,
    ...) synchronized, but don''t forget things like quotas, access limitations, etc.
    Information about them may be stored separately from the basic credentials, and
    their synchronization should be organized separately. Moreover, it is not always
    necessary to synchronize it, and in some cases, it should even be on different
    service nodes. For example, the CPU time quota on the compute node should not
    be limited, but on the main machine, rather the opposite is true.


    User access to service nodes (e.g., backup server) is generally undesirable, but
    information about them is necessary. Do not forget about such moments and think
    about the synchronization scheme in such cases in advance.


    # Classic Approach


    Historically, Linux systems have stored user account information in /etc/passwd,
    /etc/shadow, and /etc/groups. The disadvantage of this approach for clusters is
    obvious – it is necessary to maintain a consistent state of these files for all
    nodes in the cluster.'
