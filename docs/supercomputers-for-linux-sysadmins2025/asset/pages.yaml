- img_proc: true
  md: 'Here in the first line, we give user number 3 the name adminuser. Then for
    this user, we set the password MYPASSWORD, and in the last line, we give him (number
    3) administrator rights (level 4) and the ability to log in from the first channel
    (1). The user number, password, and channel number can be different, look at your
    current settings.


    Now we need to configure the channel:


    ```

    ipmitool lan set 1 access on

    ipmitool lan set 1 auth admin md5

    ipmitool channel setaccess 1 3 privilege=4

    ipmitool sol payload enable 1 3

    ipmitool sol set enabled 1 3

    ```


    First line allows access on the first channel; second line allows password authentication
    on it (this is not the username!). In the next, for the first channel and user
    number 3, we allow access with level 4 (admin). The next two lines enable SOL
    payload for the channel 1 and user 3. In some cases, one or both are not needed,
    but better to run them to be.


    As you can see, the settings are partially duplicated, and in reality, only the
    user settings may suffice, but this depends on the specific BMC IPMI model.


    Now you can control the BMC remotely. You can enter a command from another server:


    ```

    ipmitool -I -U admin -P PASSWORD -H 10.0.1.2 sdr list all

    ```


    It will connect to the BMC at 10.0.1.2 and show the list of sensors. The remote
    BMC is running IPMI 2.0 protocol, but instead of -I lan should write -I lanplus.
    To avoid writing the password directly in the command line, which is unsafe, it
    is better to write it to a file and specify it with the -f pass_file instead of
    -P.


    IPMI network is not secure, and good practice is to separate it into dedicated
    physical network (yes, cheap Ethernet switches, miles of cables...), or if possible,
    set up a dedicated VLAN and enable only it on management (not user-facing!) nodes.
    VLAN option is supported by most BMC makers, but please, double-check that before
    planning your management network. Also, setting up VLAN on all compute nodes manually
    would be painful, so ask your supplier to set it up automatically if possible.'
