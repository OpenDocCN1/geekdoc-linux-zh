    # Types of Clusters


    When people say "cluster," they mean a lot of computers combined into something.
    But there can be several variants of this "something." They differ in purpose
    and, as a consequence, in implementation.


    The first type of clusters is high availability clusters. Their task is to provide
    access to some resource with maximum speed and minimum latency. The resource is
    usually a website, database, or other service. Today, they are typically used
    as part of a set of technologies with load balancing, A/B or canary testing, continuous
    deployment, and others.


    In such cluster, if one node fails, the entire resource remains available – clients
    of the failed node reconnect and access the resource from another node in the
    cluster. A very similar principle is applied in cloud technologies: you do not
    know which node your application or operating system image will run, the cloud
    will select free resources.


    Another type of cluster is high productivity. This type is similar to the previous
    one, but in this case, all nodes in the cluster are already working on a single
    task, broken into parts. If a node fails, its part of the task is sent to another
    node; if new nodes are added to the cluster, they are allocated parts that have
    not yet counted, and the overall count goes faster. Examples include GRID computing,
    programs like Seti@home and Folding@Home. However, only a narrow class of tasks
    can be solved with the help of such clusters. you can use home computers or servers,
    connecting them through a local network or the Internet.


    The third type is high performance (HPC – High-Performance Computing). It is the
    one we are interested in. Unlike the others, failure of one of the cluster usually
    leads to emergency termination of a parallel program; only in rare cases, the
    program execution automatically continues from the previously saved control point.
    That is why, unlike previous types of HPC clusters, they are less stable in operation,
    and without proper control and monitoring, they simply cannot be used.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# CHAPTER 2 WHAT IS “SUPER”?


    An important difference between this type of cluster and others is the close connectivity
    of all nodes. They have the fastest connecting nodes, high-performance parallel
    file systems, sometimes additional ways for node synchronization, and other things
    supporting parallel programs. Applications running on such clusters typically
    work in the model of message passing between parallel running processes. If you
    run them on many computers connected by a slow network, they will spend most of
    their time waiting for information from each other.


    The ideal that all cluster masters strive for is to create a virtual computer
    with large memory and a huge number of computing cores. Unfortunately, the reality
    is still far from ideal, and nowadays, any cluster is still a lot of separate
    compute nodes connected by a fast network. The network in such a cluster requires
    not only speed (throughput) but also low latency or overhead (latency). Most parallel
    programs exchange messages frequently, which means that the time for initializing
    and receiving a message starts to play a big role. On a network with high latency,
    some programs may run many times slower than a network where latency is low.


    # Clusters and Supercomputers – Common and Different


    We just talked about clusters. Does the word “supercomputer” always mean cluster?
    No, not always. An important feature of a cluster is that it can be built from
    commercially available components. I mean, you can buy all cluster components
    in a store and, having sufficient experience, assemble it yourself.


    A “supercomputer” in the historical perspective is a product made of unique components
    produced by a single vendor. For example, let’s take IBM’s Blue Green series –
    the architecture of these machines is similar to a cluster. The same software
    tools are available on them as computing clusters, but Blue Green can be purchased
    only from IBM or their distributors. It is impossible to build a Blue Green on
    your own: key components are not sold separately and it’s not about the brand,
    it’s about the unique technologies. Today, such products are rare, but still exist,
    e.g., NEC Tsubasa.


    The opposite example is “computing farms” i.e., groups of computers working on
    one task, usually not even transmitting data to each other, or clusters of the
    “BeoWulf!” class, i.e., assembled practically from improvised means.'
