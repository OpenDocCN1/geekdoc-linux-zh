    the libraries that are needed during the operation of programs compiled by them
    are available on compute nodes. For this purpose, it is best to install the compiler
    in a directory on the network file system.


    In order to make the libraries available to the dynamic linker, you need either
    to write the paths to them in the LD_LIBRARY_PATH environment variable (which
    is conveniently done via environment modules), or explicitly specify these paths
    in the /etc/ld.so.conf file and run the ldconfig command. do not forget to update
    this file when you update the compiler version: the path to the libraries may
    change. And of course, don''t forget to update the information on the nodes -
    run ldconfig on all nodes of the cluster.


    # Customizing the Job Management System


    This stage was described above, we will not dwell on it in detail. After installing,
    configuring, and testing the task management system, you can start deploying the
    rest of the compute nodes. As soon as the cluster is ready to run tasks, there
    is a great temptation (or pressure from users and not only) to put it to work
    right away.'
