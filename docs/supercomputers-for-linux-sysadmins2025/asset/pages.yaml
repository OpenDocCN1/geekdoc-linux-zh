    # Using Torque


    Running a program through Torque is done with the qsub command with the script
    name as an argument, which specifies the resources required by the task (node
    architecture, number of processors, and solution time). The command has the following
    form:


    ```

    qsub -q QUEUE -l ncpus=CORES script_name

    ```


    Where


    +   * QUEUE is the name of the queue in which the task is placed.

    * CORES is the number of cores.

    * script_name is the name of the running script, which can be created by any text
    editor.


    The qsub command has many options, but almost all of them can be placed inside
    the running script, including the -q option.

    Then the launch command is even more simplified:


    ```

    qsub script_name

    ```


    To run a single-processor program on a MYCLUSTER cluster, you can generate a file
    (e.g., named myprog.batch) with the following contents:


    ```

    #!/usr/bin/env bash

    #PBS -l nodes=1:ppn=4

    ```


    200'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# CHAPTER 14 OPENPBS AND TORQUE


    ```

    #PBS -q MYCLUSTER

    cd $PBS_O_WORKDIR

    ./progname

    ```


    In this case, a task, requesting one node and four processes per node, will be
    generated to run on the MYCLUSTER cluster with a program named progname and a
    default time order of one hour. The "PBS" special comments are recognized by the
    qsub command and set the limits for the task.


    The cd command specifies the path to the working directory of the executable program.
    It is assumed here that the task is started from the working directory where the
    executable program progname is located. The progname program should be started
    with the command:


    ```

    qsub myprog.batch

    ```


    A simple multithreaded program runs on a single node, and its startup is no different
    from the startup of a regular single-processor program, in terms of the startup
    script not in terms of the startup command. By default, an OpenMP program spawns
    as many threads as are cores on the node. If you want to control the number of
    threads spawned, the OMP_NUM_THREADS line is added to the script:


    ```

    #!usr/bin/env bash

    #PBS -l nodes=1

    #PBS -q MYCLUSTER

    #PBS -v OMP_NUM_THREADS

    cd $PBS_O_WORKDIR

    ./progname

    ```


    In this task, two threads will be spawned that engage two cores.

    Torque defaults to a maximum time for a task to run. For tasks that require more
    time, you need to explicitly specify the task runtime:


    ```

    #!usr/bin/env bash

    #PBS -l walltime=300:20:00

    #PBS -q MYCLUSTER

    #PBS -v OMP_NUM_THREADS

    cd $PBS_O_WORKDIR

    ./progname

    ```


    201'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# CHAPTER 14 OPENPBS AND TORQUE


    Here 300 hours and 20 min are ordered for solving the task. When the ordered time
    expires, the task will be forcibly terminated. The administrator has the ability
    to set limit values for any limits (solution time, maximum number of nodes, maximum
    number of running tasks).


    To run a parallel MPI program on four nodes of the MYCLUSTER cluster, the same
    command format is used, but the contents of the script must be different:


    ```

    #!/usr/bin/env bash

    #PBS -l walltime=30:00:00

    #PBS -l nodes=4:MYCLUSTER

    cd $PBS_O_WORKDIR

    mpirun -np 4 ./proname

    ```


    When the program is started by the qsub command, a unique number is assigned to
    the task. This number can be used to track the progress of the task, to withdraw
    it from the account or remove from the queue, move in the queue relative to your
    other tasks.

    Everything that is output to the standard output and error streams while the task
    was started at the end of the count. The names of these files are automatically
    generated as follows:


    ```

    <script_name>.<task_number> - Standard output

    <script_name>.ectask_number> - Error stream

    ```


    These names can be changed using the qsub options. If you want to view the results
    as the task progresses, you can use the output redirection mechanism in the program
    start command. Moreover, Torque internal variables can be used to make each output
    file have a unique name.

    For example:


    ```

    #!/bin/sh

    cd $PBS_O_WORKDIR

    mpirun -np 4 proname > $PBS_JOBID

    ```


    In this case, the results will be written to a file whose name will be formed
    from the task ID. This file can be viewed during program execution using the cat,
    less, or tail -f command.'
