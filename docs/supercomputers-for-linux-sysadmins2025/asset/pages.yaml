  md: '# CHAPTER 13


    # # Job Management Systems


    # ## Principles of Operation and Capabilities


    The most optimal mode of supercomputer utilization is continuous launching of
    tasks occupying the entire counting field. However, in reality, such a mode is
    practically uncommon, except for cases when the supercomputer is actually built
    to solve a single task. This is due to various reasons: limitations on the scalability
    of tasks, conditions on the number of processes (e.g., power of two), etc. Even
    if all the tasks can occupy the entire counting field, it is necessary to start
    a new task immediately after the previous one is finished. It is not easy to track
    this manually.


    What if you need to provide resources to more than one user? To solve this problem,
    there are *batch systems*, or *batch managers*, a.k.a *resource managers*. Originally,
    batch managers were used to manage the resources of large machines for the needs
    of composite tasks. Hence, the combination “batch processing” – in old machines,
    a task consisted of several steps that required different resources (disks, tapes,
    teletypes, processor, etc.), and the task of a batch manager was to plan the use
    of all resources efficiently as possible.


    Modern supercomputers rarely have tasks described in this way; as a rule, only
    one type of resource (processors, GPUs) and its quantity are specified. Sometimes
    additional requirements (attributes) are given: memory size, availability of licenses,
    etc. But the way of launching tasks and tracking their work has changed a lot.
    This has led to difficulties in using old control systems in the new realities.


    As a rule, the task management system itself is a software complex of three or
    more components: queue manager itself, scheduler, and agents on compute nodes.
    The resource manager allows you to put a task in the **queue**, view the status
    of queues and tasks, and change the statuses of nodes, queues, and tasks. It is
    also responsible for'
  merge: -1
  pgno: 202
- img_proc: true
  md: 'launching a task and tracking its status during the crashed. **Agents** on
    compute nodes to start a task and track its status. If a task has crashed or has
    been forcibly withdrawn from the account, agents must terminate the running processes
    of the task.


    **Scheduler** is a component that determines when and on which resources a task
    should be started. Many systems support replacing a simple built-in scheduler
    with a third-party one. The efficiency of supercomputer utilization depends on
    the quality of task scheduling. The usual "first-come, first-served" algorithm
    leads to the idle time of numerous processors when many tasks are waiting for
    a large task to run. The scheduler can also use predefined priorities, allow time
    intervals, and other rules set by the administrator to make more efficient use
    of the supercomputer.


    It is very important to choose a scheduler that works efficiently with your task
    flow. The scheduler may require significant resources for its operation – complex
    logic, large amounts of resources, and large number of tasks may result in scheduling
    times of minutes, which is unlikely to be acceptable in a real-world environment.
    In some systems, the scheduler may be described by the administrator himself;
    some may use an external service like MAUI (http://www.adaptivecomputing.com),
    e.g., Torque. Today, there are many task management systems available, both commercial
    (Moab, LSF) and freely distributed (Torque, Slurm, Condor, OpenLava).


    For clusters, it makes sense to divide the compute field into **partitions**.
    For example, if there are compute nodes and without accelerators, two corresponding
    partitions can be created. The same problem is solved by describing the resources
    of nodes and explicitly specifying the list of resources when a task is queued.
    But in this case, the task of planning becomes more complex, and the description
    of priorities and quotas becomes less transparent. As practice shows, it is easier
    for users to specify the name of a partition to write lists of additional resources.


    For clusters, a general partition for testing is very useful. In such partition,
    you should set a strict time limit (10–15 minutes) and the number of tasks in
    the queue from one user (3–5), which will allow you to quickly (within 1–2 hours)
    guarantee to run the task on several nodes with minimal data and make it work.


    Here I want to note the most important concepts of any HPC resource manager –
    **partitions** (usually they are the same as ‘queue’), **jobs priorities, users,
    agents,** and **schedulers**. Another essential thing is that **batch scripts**
    – most systems run a script, not a single command line. Even if they do, just
    wrap it into a temporary script. The batch script is executed on the first allocated
    node, when the job is started, and has'
