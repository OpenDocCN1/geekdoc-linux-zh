- img_proc: true
  md: '# CHAPTER 9 NETWORK FILE SYSTEMS


    Encryption alleviates this problem, but catastrophically reduces performance.
    So when using NFS, make sure that only trusted computers are on the network. For
    large systems, NFS is, alas, poor fit. Its bottlenecks are the inability to scale
    (multiple NFS servers cannot be made to work together, sharing the load) and the
    need to synchronize clients when writing to a file.


    # Lustre


    The Lustre file system architecture allows you to use multiple devices and storage
    nodes to serve many clients at the same time. Unlike NFS, there is no single server
    bottleneck – data is accessed by many servers simultaneously. And it is open source!
    And you can get commercial support – please check which company does it today,
    and they are changing so rapidly.


    Compared to NFS, the advantage of this file system is that it is designed to support
    not only concurrency in the storage part of a cluster cluster, but also to support
    concurrent data access by clients (i.e., compute nodes in the cluster). To the
    user, Lustre looks like a typical POSIX-compliant file system. Note that only
    Linux clients and servers are supported; for any other clients, you will need
    to reexport mounted Lustre file system as NFS or SMB, which zeroes its benefits.


    An undeniable advantage of this architecture is its easy scalability: at any time,
    a new server can be added to a running file system, increasing both speed and
    storage capacity. Lustre supports both traditional TCP/IP networks and fast networks
    such as InfiniBand. Note that the overall architecture is similar to other distributed
    file systems.


    # Architecture


    Let''s take a closer look at the Lustre architecture (see Figure 9-1). It includes
    the following components:


    +   - Management server (MGS) – Stores configuration information for the whole
    Lustre file system (or multiple fs), like all OSTs locations, MDTs, OSSes, MDSes,
    etc. It is recommended to dedicate a separate disk to store MGS data, but it is
    allowed to combine it with MDT (see below) and usually it is the case.'
  merge: -1
  pgno: 145
- img_proc: true
  md: '+   - Metadata servers (MDS) – Their purpose is to store metadata of all objects
    on the file system, like file names, permissions, and where they are stored (which
    OST). You can have multiple MDSes in one file system.


    +   - Object storage servers (OSS) – Provide file system objects, like file chunks,
    directories, etc.


    +   - Metadata target (MDT) – A metadata repository, such as a hard disk, DAS,
    or NAS. An MDT can be accessed by multiple MDSs, but only one of them is capable
    of using it. This helps to provide fault tolerance for the MDS.


    +   - Object storage target (OST) – Object storage (chunks of user files). Like
    MDT, it can be either a hard disk or a network storage.


    +   - Lustre clients – Compute and other nodes with Lustre software installed
    that allows them to mount the Lustre file system.


    ![](img/bf80ee52d79fecfa3ce237b9e3fd3292_146_0.png)


    Figure 9-1. Simple Lustre architecture'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# CHAPTER 9 NETWORK FILE SYSTEMS


    Each OSS can mount several OST (and this is typical) and also can be configured
    to be able to mount OSTs of one of its neighbors. This allows to survive if one
    OSS is its partner can mount volumes and continue to manage them. We''ll return
    to this later.


    The Lustre client software consists of the Metadata Client (MDC), Object Storage
    Client (OSC), and Management Client (MGC). Each client provides interaction with
    the corresponding component of the Lustre server side. The OSC group forms LOV
    - Logical Object Volume.


    In the Lustre architecture, communication over the network takes place through
    the LNET interface - Lustre Networking. LNET allows the use of different networks
    using Lustre Network Drivers (LNDs). LNET supports message passing for RPC request
    and RDMA for bulk movement and allows Lustre to work across InfinBand, TCP/IP,
    Quadrics Elan, Myrinet (MX and GM), and Cray. At the LNET level, recovery is supported
    when any connection fails.


    Each network interface in the LNET has a unique NID - Lnet Network Identifier,
    which has the format <address><LND><protocol>#. For address address, IPv4 address
    is used. In IB networks, where no IP is used as the transport layer, the NID will
    be a typical ip-over-ib address to identify the interface. For example, 10.20.30.40@021b
    may be a typical NID for IB interface and 192.168.2.3@tcp2 for TCP/IP. Each "protocol+index"
    represents an isolated network from the LNET perspective, so 1.2.3.4@tcp0 never
    can talk to 2.3.4.5@tcp1. Note that on IP level, LNET module uses port 988, do
    not block it by firewall.


    When storing files, Lustre automatically divides them into blocks, and each block
    can be stored on an OST, and the blocks be accessed in parallel. It is important
    to remember that Lustre does not provide redundancy when storing data. Consistency
    can be provided on OST and MDT level using RAID. MDT should use RAID-10 due to
    small I/O size, while OSTs should use RAID-6 due to larger I/O size, usually 1
    MB or larger.


    When planning a farm for Lustre, remember that MDT data is the most critical -
    its loss or corruption is equivalent to the loss of all other data. Read current
    recommendations from the official Lustre documentation to choose chunk size, raid
    levels, and check your servers'' memory size. Please refer to the latest Lustre
    recommendations; they may change pretty fast!'
  merge: -1
  pgno: 147
- img_proc: true
  md: "# Creation of Lustre File System\n\nLustre has no user-space services, clients\
    \ and servers are kernel modules. In some cases, it is possible to build Lustre\
    \ kernel modules for vanilla kernel, but the recommended way is to download precompiled\
    \ kernel module from official Lustre website² and Lustre packages.\n\nTo deploy\
    \ Lustre, you need to install the appropriate software on all components (both\
    \ servers and clients), configure LNET networks, format the MDT and OST partitions,\
    \ and then mount the resulting file system on the clients. Here is an example\
    \ for a simple configuration.\n\nCreate (or edit, if exists) file /etc/modprobe.d/lustre.conf,\
    \ which contains LNET configuration. There are two options to define LNET network\
    \ - networks and ip2nets. The first option is highly recommended. The second one\
    \ gives you more flexibility, but in most cases is redundant because of complexity.\
    \ To specify networks LNET configuration, put into the lustre.conf file a line\
    \ in format \"<lnet><#>(<dev>\", e.g.,\n\n```\noptions lnet networks=\"o2ib(ib0),tcp0(eth2)\"\
    \n```\n\nTo check if everything is OK, you can load LNet kernel module and run\
    \ lnetctl command (in this example, networks=\"tcp0(eth1\") was used):\n\n```\n\
    # modprobe lnet\n# lnetctl net show\nnet:\n  - net: lo\n    nid: 0@lo\n    status:\
    \ up\n  - net: tcp\n    nid: 192.168.2.3@tcp1\n    status: up\n    interfaces:\n\
    \      0: eth1\n```\n\n> ²https://Lustre.org as for 2025."
  merge: -1
