    # Commands for Working with the Directory Tree


    pwd – Print the full name of the current directory.


    cd [ dirname ] – Go to the specified directory (home directory if dirname is specified);
    dirname here is the name of the directory, which may consist of the name itself
    and the path to it. The path can be absolute if it starts with / and relative
    if it starts with any other character.


    Examples of moving through the directory tree:


