  md: '# CHAPTER 20 BACKUP


    +   - Pool - Pool is a representation of a data store. In our example, a disk
    shelf and a tape library are two pools.


    +   - Volume - A volume is a single copy of data stored in a pool.


    +   - Device - The device on which pools are stored (usually one device contains
    one pool).


    +   - FileSet - A set of files describes exactly what we will write to (or from)
    the volume.


    +   - Job - Job describes the process of writing or restoring data.


    Now lets turn to the files to configure the backup in our example. Let’s start
    with the storage servers (stor1, stor2). By default, their configuration file
    will be called /etc/bacula/bacula-sd.conf.


    All configuration are internally divided into sections. For a storage server,
    the main section is Storage. In the file, which is supplied by default, we must
    be sure to fix the Name parameter - it specifies the name of the server, which
    does not necessarily match the name of the physical server. Storage devices are
    described in the Device sections, of which there may be several. Example configuration
    file for stor1 (usually /etc/bacula/bacula-sd.conf:


    ```

    Storage {

    Name = stor1

    SDPort = 9103

    WorkingDirectory = "/var/spool/bacula"

    P Directory = "/var/run"

    Maximum Concurrent Jobs = 10

    }

    Director {

    Name = dir1

    Password = "storage-password"

    }

    Device {

    Name = DiskArray

    Media Type = MyFiles

    Archive Device = /mnt/backups

    Random Access = Yes;

    ```'
