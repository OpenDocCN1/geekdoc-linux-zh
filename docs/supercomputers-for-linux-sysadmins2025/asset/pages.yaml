  md: '# CHAPTER 30 SYSTEMD – A SHORT COURSE


    Restart= – In cases, the service will be automatically restarted:


    +   - no-Never

    - on-success – Upon successful completion or completion by a standard signal (TERM,
    PIPE, INT, HUP)

    - on-failure – When terminated with a nonzero code, by abnormal signal or timeout

    - on-abnormal – When terminated by timeout or abnormal signal

    - on-watchdog – On timeout

    - on-abort – On any of the abnormal cases


    TimeoutStartSec=/TimeoutStopSec= – Waiting time for confirmation of unit start/for
    dbus/notify types. For other types, stopping the unit, the TERM signal is sent
    first, and if the process has not finished after the specified time, the KILL
    signal is sent.


    WorkingDirectory= – The directory to which the transition will be made before
    launching all commands.


    User= Group= SupplementaryGroups= – Username, group, and the list of supplementary
    groups with which the unit will be launched.


    LimitCPU= LimitSIZE= LimitDATA= LimitSTACK= LimitCORE= LimitRSS= LimitNOFILE=
    LimitAS= LimitNPROC= LimitMEMLOCK= LimitLOCKS= LimitSIGPENDING= LimitMSGQUEUE=
    LimitNICE= LimitRRTTIME= – Limits (use limits).


    Umask= – File directory creation mask

    Nice= – Specify the level of “politeness",


    Environment= – Specify environment variables in the following format:

    “VAR1=word1” VAR2=word3 VAR+=word 5 6”. The list is separated by a space, values
    are specified in double quotes, and the ‘$’ sign has no special meaning.


    EnvironmentFile= Path to the file with environment variables in the format

    “VAR=word1”, one variable per line. Lines starting with ‘#’; '';''; without ‘=’
    or empty lines are ignored. If there is a ‘-’ sign before the file name, the file
    may be absent; otherwise, an error will be generated, and the unit will not start.'
