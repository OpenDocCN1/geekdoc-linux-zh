    To compile an object file, the ''-c'' key must be specified. By default (if the
    -c switch is not specified), the name of the object file will be the same as the
    original, but the extension will be changed to ''.o''. For convenience, the compiler
    can work as a linker (more precisely, it calls the linker itself with the necessary
    parameters). Here is a simplified example of compiling a program from several
    files with a mathematical library attached:


    ```

    gcc -c *.c

    gcc -o myexe *.o -lm

    ```


    First, we compile ''.c'' files into object files, then link them in place with
    the libm into it library named libzzz.so. The -I and -L keys are used to tell
    the compiler and linker to find where to include the files and libraries, respectively.


    In order not to compile all the files every time, the make program is usually
    used, which runs only the necessary commands for compilation on a prepared Makefile.
    You can read more about it in the documentation. By default, the compiler does
    minimal code optimization. To perform more serious optimization, various combinations
    of keys are used. The most common one is the -O key, which sets the "optimization
    level" equal to n, where n is an integer from 0 to 6.


    In fact, each level is simply a combination of other keys specifying different
