  md: '# CHAPTER 4


    # Supercomputer Hardware


    We shortly considered the “anatomy” of a computing cluster and know what components
    it consists of. Depending on the size and architecture of a particular cluster,
    some logical nodes may be combined into one physical. In the following, I will
    often write “node” – it is a synonym for “server”, but in HPC, it is the custom.


    So, a mandatory part of any cluster is compute nodes, or the so-called compute
    field. These are the servers where tasks will be counted. In addition to compute
    nodes, there should be at least one control node; in large systems, additional
    service nodes are added to it; there can be several dozens of them.


    Networks are necessary for effective cooperation of compute nodes:


    +   - Communication network, through which the data of compute tasks are exchanged


    +   - Control network, which is used to remotely access nodes, run tasks, etc.


    +   - One or more service networks – for access to the network file system, management
    via IPMI or iKVM protocols, monitoring, additional synchronization (interruptions,
    clock frequency, barriers, etc.), and possibly others


    A mandatory component of a modern computing cluster is a network file system.
    For the entire complex to work, it is mandatory to have infrastructure: power
    supply systems and climate systems. For a large installation, they can take up
    many times more space than compute nodes. As a rule, infrastructure maintenance
    is not the responsibility of the administrator, but they should, if possible,
    monitor its condition. If the infrastructure is on planning stage yet, make sure
    you have enough access to monitor critical infrastructure information.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Control Node


    All nodes in any cluster are divided into compute nodes and service nodes. One
    service node is always present - it is the management node. It is from that all
    subsystems are managed (or logged in to manage them), and sometimes it plays role
    of login node, which users use to access cluster via ssh. In small clusters, it
    can combine the functions of all service servers, but in general, I recommend
    having at least two control nodes and one or more user-facing nodes.


    # Compute Node


    “workhorse” of the cluster is the counting field. As a rule, all nodes here are
    of the same configuration, but sometimes the field can include nodes of two or
    more configurations. The more homogeneous the composition of compute nodes, the
    easier it is to manage them, and the easier to schedule tasks. You should create
    mixed configurations only when you are sure that ALL will be actively used by
    tasks.


    The hardware of the compute node is completely determined by the nature of the
    tasks that will be solved on the cluster, but you should always try to balance
    the composition of the “hardware” so that there are no bottlenecks, such as many
    cores with a narrow channel to memory, insufficient width of the channel to the
    computer network, etc.


    Having a hard disk drive has both pros and cons. Minuses are additional space,
    power consumption, and heat dissipation, as well as a high probability of failure.
    In addition, they cost a lot of money, especially NVME, and you need to have some
    valuable count in stock, to be able to replace failed ones, or have a good (priced)
    support contract. If your nodes “blade-servers” or use any other high-density
    architecture, all this is especially relevant. Pros – The possibility to install
    a local copy of the OS, which greatly simplifies the power-on procedure and speeds
    up the loading of system libraries (and hence the start of programs), as well
    as the possibility to add swap space and the local /tmp directory. This greatly
    improves memory efficiency.


    When installing a local copy of the OS, be very careful with software updates
    and local storage of credentials. To increase efficiency, the software configuration
    should be kept as light as possible: the fewer unnecessary services, the better.'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# CHAPTER 4 SUPERCOMPUTER HARDWARE


    On the compute node, it is quite possible to do away with such services as mail
    (you can send messages through the head node), cron (the most important tasks
    can be performed via ssh also from the head node), networkmanager, acpid, etc.
    Keep only the essentials, and use precreated device files instead of udev if possible
    – they won''t change over time anyway. The most essential services for the compute
    node is sshd and the network file system client. It is very desirable to set up
    monitoring of the node.


    As a rule, all compute nodes are logically organized into partitions (or queues)
    within the task management system. If there are nodes of different configurations
    in the field, it is convenient to create partitions for each configuration separately.
    Sometimes it is useful to unite several compute nodes into one partition to run
    small test backlogs (test queue), and it is useful to limit the runtime of such
    test tasks (e.g., 15–20 minutes).


    # Login Node


    I recommend having dedicated user-facing nodes (login, data preprocessing, visualization,
    data copying, etc.), and not share them with service nodes. Strict resource usage
    limits on those nodes, to prevent incorrect their usage. Simple example – Today
    (in 2025), many users’ workflows are streamlined by IDE plug-ins, like VSCode
    remote and others. They make remote work with cluster easier, at the first glance.
    But in fact, many of those plug-ins (VSCode particularly) take a lot of system
    resources and may paralyze login node.


    # Service Nodes


    All nodes not included in the field are service nodes. Combining the functions
    of a compute node and a service node (e.g., an NFS server) is highly discouraged,
    as it will certainly lead to unbalanced task operation and increased probability
    of service failure.


    There are several roles that service nodes fulfill, but often a single server
    fulfils several roles, if not all at once. Let’s consider typical roles. In large
    computing complexes, it is not always convenient to load control nodes with user
    and service processes. For example, if compute nodes with different versions of
    operating systems are installed, it is not reasonable to build programs on the
    control node; it is more logical to dedicate (or allocate) numerous nodes for
    compiling programs (compilation nodes). If your users need to move a lot of data,
    it is useful to have dedicated data copying nodes.


    29'
