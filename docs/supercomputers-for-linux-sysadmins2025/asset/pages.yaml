  md: '# CHAPTER 20 BACKUP


    If you need to perform the same update on many machines at once, you can use the
    --write-batch=update option. In this case, rsync will not perform a copy, but
    will create two files - update and update.sh. These files can be copied to the
    required machines or made available on them via the network FS, and then run the
    update.sh script on each machine, which will perform the required update. If rsync
    (rsync --daemon) is running on the host, you can use the syntax rsync://host/remote_path
    or host=:remote_path to access it, for example:


    ```

    rsync -avz rsync://host1:data_dir /backups/host1

    ```


    In this case, rsync will not use ssh/rhs and additional access control must be
    taken care of. I recommend to use daemon mode, if possible, because it doesn''t
    require encryption and save CPU resources. At the same time, it is less secure;
    therefore, I''d recommend to use chroot and separated secrets instead of UNIX
    passwords. The documentation for more details.


    There are several projects, using rsync to make incremental, encrypted, and observable
    backups. Also, there are some projects, using similar, but more efficient approaches,
    e.g., borgbackup,¹ which implements efficient deduplication and store all backups
    in a special database. Every backup is a set of internal links to unique file
    objects, so there are no incremental or differential backups, and backup database
    contains only files, used by one of backups. If you remove a backup, only its
    unique files are deleted from the database. Borg supports backups via sshfs or
    using its own service and backups encryption.


    In the repository https://github.com/zhum/hpc-book-materials, you can find a simple
    script, which makes managing borg backups a bit easier. Of course, there are many
    other good projects, open source, and you can use if you need more features.


