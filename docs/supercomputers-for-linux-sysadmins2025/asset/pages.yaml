  md: '# CHAPTER 7 UNIX AND LINUX – BASICS


    It is understood that the /etc/nodes file stores a list of all nodes in the cluster
    and the command for all nodes in this list copies all files or directories specified
    as arguments from the management computer to each node, preserving its name. If
    you add ''&'' to the end of the ''scp...'' line and add ''wait'' to the last line,
    the copying will run in parallel. However, the output of all scp commands will
    be mixed up, and in case of a large number of nodes, the head node may be significantly
    overloaded.


    As you can see, the script is very simple, but it makes the administrator’s task
    much easier. Pay attention to the grep command: with its help, we do not get the
    entire list of nodes, but only those whose names are not "commented out", i.e.,
    there is no "#" in front of them. Thus, if a node fails, its name is not removed
    from /etc/nodes, but simply "commented out" for the time being.


    An even simpler is a script to execute an arbitrary command on all nodes in the
    cluster:


    ```

    #!/bin/sh

    for host in $(grep -v \# /etc/nodes); do

    echo "$host =============" && ssh host "$*"

    done

    ```


    Here, the script is passed the name of the command with arguments to be executed
    on all nodes in the cluster.


    It is important that passwordless access to nodes is configured (see below).


