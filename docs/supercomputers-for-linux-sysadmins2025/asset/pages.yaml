    # Shell Tricks


    The command line has been and remains the administrator’s primary tool. The reason

    is its versatility. To know how to work in the shell means to be able to quickly
    solve

    administration tasks. These techniques become especially relevant when you need

    to execute dozens or even hundreds of commands simultaneously (or, even worse,

    sequentially).


    For example, rebooting at least ten nodes IPMI in the command line is no more

    one minute. But it takes much longer to open a browser window with the desired

    address times, select the desired menu with the mouse, and press the “reboot"

    button with the mouse. The person performing these actions will curse everything

    already on the fifth window. If you need to reboot 100 or 1000 nodes?


    Let’s share some techniques for working in bash (“standard” bash (or zsh) that
    improve efficiency.

    Many will work in the sh interpreter (e.g., dsh), but not all.


    The curly brackets specify an enumeration, for each element of which, including
    the

    empty one, a different argument will be created. Let’s use it!


    ```

    $ cp file{..bak} # equivalent to cp file.bak

    ```'
