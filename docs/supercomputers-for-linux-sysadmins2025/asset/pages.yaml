    # # OpenCL


    Open Computing Language – OpenCL - is designed as a standard for programming heterogeneous
    computing systems. Such systems may include GPGUs, FPGAs, and other devices. All
    of them must be connected to a host; distributed configurations are not supported
    in the standard. The basis of the OpenCL programming paradigm is the language
    of the same name, which is a dialect of C99. Unlike ordinary C, it does not contain
    pointers to functions, header files, bit fields, recursion is prohibited, memory
    qualifiers, and some other extensions are added.


    The standard defines a set of special procedures for organizing calculations.
    In this case, calculations can run on any device available to the system and supported
    by OpenCL, i.e., the same code can run simultaneously on CPU cores, video cards,
    and connected FPGA accelerators. This approach greatly facilitates programming
    in contrast to CUDA, where it is necessary to describe the code for GPGPU and
    CPU separately. But the price for universality is flexibility and performance
    (it is more difficult to write efficient code in OpenCL for NVIDIA cards than
    in CUDA), and optimization possibilities are much less.'
  merge: -1
