    Having determined the boot level, the system starts boot scripts from the /etc/rc.d/<number_level>.d
    directory:if you look through the contents of this directory with the command,
    you will see that there are references with special names like S<number><name>
    and K<number><name>.


    <number> specifies the sequence number of the script execution on loading. A script
    reference with the number 15 will be executed before a reference with the number
    20.<name> specifies the name of the script to be executed. The scripts themselves
    are located in the /etc/init.d directory.


    The S or K specifies the parameters with which scripts in the /etc/init.d directory
    will be executed. The scripts in this directory have many options, but the two
    main ones are start and stop. References starting with S will run with the start
    option, and those starting with K will be executed with the stop option. Scripts
    to start services can also be executed at any point in the system. For example,
    to start the apache web server, just run the following command:


    ```

    /init.d/apache2 start

    ```


    If the web server is already running, the script will give you a message about
    it. There are two ways to specify that the server automatically starts at system
    startup. The first is to run the chkconfig command (for RedHat-like systems) or
    update-rc.d (for Debian-like systems). Console command:


    ```

    chkconfig apache2 on

    ```'
