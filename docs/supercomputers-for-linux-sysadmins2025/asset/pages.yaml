  md: '# CHAPTER 6    HOW A SUPERCOMPUTER DOES THE JOB


    # How a Typical User Session Occurs


    There are many options for organizing work with specific compute packages that
    provide their own interface for working with a supercomputer. Let''s consider
    the “general” variant.


    So, a user is working on their computer – workstation, laptop, tablet, etc. To
    start a session, they start an ssh client (putty, openssh, IDE ssh plug-in, etc.),
    enter an address, login with a password or a private key file (or a profile where
    all is already specified), and open a connection to the supercomputer. Depending
    on the organization requirements, additional access procedures may be used, 2FA,
    key certificates, etc. Once at the access node, the user can access local files,
    edit and compile their own parallel programs, scripts, copy input data via sftp
    protocol, etc.


    To start a program, the user executes a special command that does his job. The
    job queue (or often “partition”) is implemented by a job management system, and
    users talk to it using special commands. In the command, they user check the status
    of their job and see the list of job in the queue. If it turns out that there
    is an error in the program, the user can cancel or remove it from the queue if
    it has not started.

    processes, possibly the number of nodes and other preferences, like memory, GPUs,
    licenses, etc., as well as the program and its arguments.


    If necessary, the user can submit to the queue several jobs (e.g., if they need
    to process several sets of input data). Once a job is queued, the I/O will be
    redirected to the files, so user can safely end the session and check the job
    status/download the results later in another session. Most job management systems
    allow you to run a job interactively as well, linking its I/O to the user’s terminal.
    In this case, you will have to leave the session until the job is finished.


    All work is at the command line, so the user must know the minimum set of Linux
    commands (usually this is not a problem). An elementary Linux self-study book
    or even a page on a website with a description of the necessary commands is sufficient
    in general. For file management, many users use the Midnight Commander (mc) program,
    which makes the job even easier.


    # Job Life Cycle


    A typical job on a supercomputer goes through several phases. The first phase
    is queuing the job. In this phase, the user specifies the path to the executable
    program, arguments, and startup parameters, such as the number of MPI processes,
    number of'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'nodes, node requirements, etc. Explicitly or implicitly, the user also specifies
    how the job should be started - via the mpirun or mpiexec command (for MPI applications),
    as a regular application, etc.


    The job management system regularly checks whether a new job can be started by
    reviewing the queue. As soon as our job reaches the beginning of the queue or
    is otherwise suitable for launching, the management system (or rather, its scheduler)
    will select a set of nodes on which to launch, notify them, possibly execute an
    initialization script (the so-called prologue), and proceed to launch the job.


    The startup phase may vary from system to system, as the general idea is the same:
    a startup process, such as mpir, is started on a compute or management node and
    is passed a list of nodes and other parameters. This process starts workflows
    on the compute nodes, either by itself (via ssh) or with the help of the job management
    system. From this point, on the management system considers the job to be running.
    It can monitor the state of the workflows on the nodes, if supported, or it can
    monitor only the state of the start process. As soon as the start process terminates
    or the job is forcibly canceled (either by the user or by the job management system
    itself), the job enters the termination phase.


    In this phase, the control system terminates the job correctly - to make sure
    all its processes have finished, there are no unnecessary files left in temporary
    directories, etc. A separate script, the so-called epilogue, is often used for
    this purpose. At the end of the termination phase, the job is considered complete.
    For some time, information about may be stored in the management system, usually,
    the data about it can now be found in logs. In the described cycle, there can
    be nonstandard actions, e.g., changing the priority of a job that changes the
    speed of its passing in the queue, blocking that temporarily prohibits the start
    of the job, suspending the job, and some others.


    # # What Is Hidden from the User


    All that was described above is visible to the average user. However, there is
    also something that remains "behind the scenes" for the user, but plays an important
    role for the administrator. These are the services that ensure correct operation
    of the supercomputer: account management, distributed file system, quota management,
    remote node monitoring, statistics collection and journaling, equipment and infrastructure
    monitoring, emergency notification and shutdown, and backup. All services work
    invisibly for the user, but their importance can hardly be overestimated.'
  merge: -1
