  md: '# Security Scans


    This subchapter should actually be a full chapter and be one of the first ones.
    In fact, I often can see that only basic security rules are applied, but the rest
    is just ignored. “The cluster is inside the protected perimeter, we are not exposed
    to the external world, firewalls will save us” – typical way of thinking, and
    this is a big mistake.


    There are a lot of specialized books and resources about the cybersecurity, so
    I will just touch the basic rules you can follow:


    +   1. Do regular system software updates. Test them on a small subset of nodes
    first. Do backups. I recommend doing updates to four times a year; this supposes
    to have relatively small updates and short maintenance times.


    +   2. Do daily security scans. You can use opensource solutions like chrootkit,
    rhunter, Nessus, Lysis, and Maltrail. And read the reports!


    +   3. Check remote logins activity, especially when we have sudo access.


    +   4. Firewall is still your friend, use it wisely.


    +   5. Monitor unusual activity – this is a hard part; manually, you can just
    check running processes list and detect new malware, missed by rhunter. I don’t
    know good opensource automation tools for this, but there are commercial solutions
    from SentinelOne, Palo Alto Networks, CrowdStrike, and others. You don’t have
    to install them on all nodes, but I recommend protecting all user facing and service
    nodes.


    # Brief Summary


    Superreliable systems, redundancy, redundant power, and cooling – all of these
    greatly increase the reliability of your computing complex. But, yes, there’s
    still no guarantee. Moreover, no redundancy will save you if a failure has already
    occurred and the system is running on standby, and you are not even aware of it.
    Monitoring is one of the most important components of any computing complex and
    even more so of a'
