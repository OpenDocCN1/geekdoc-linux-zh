    # NUT


    The acupsd program is designed only for APC UPSs, although it can work with some
    models as well. The purpose of the open source NUT (Network UPS Tools) project
    is to work with a wide range of UPSs from different manufacturers. The list of
    supported models is available on the website (http://www.networkuptools.org/).
    NUT is included in all popular Linux distributions. This package consists of three
    components: drivers, server, and clients.


    +   - Driver - A program that implements all the necessary commands to work with
    UPS; usually, it is not directly run. Server - A program that runs one or more
    drivers to monitor the status of UPS and control them through the network. Clients
    connect to a server (or at the same time) and monitor the status of UPSs or change
    their mode of operation. One of the most important clients included in the NUT
    is the monitor. This is a client that reacts to changes in the status of UPSs;
    it can send an alert about power loss in the network, shut down the equipment
    when the battery is low, etc.

    - To install NUT, use the package manager and install the server and monitor.
    Typically, the directory with the configuration files is located in /etc/nut.
    All components have their own configuration files:


    ```

    ups.conf driver settings

    uupsd.conf server settings

    uupsd.users access settings

    upsmon.conf monitor settings

    ```


    Let’s start with the driver (ups.conf):


    ```

    [ups1]

    driver = usbhid-ups

    port = auto

    serial = 1234567890

    ```


