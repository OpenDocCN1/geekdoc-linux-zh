  md: '# CHAPTER 23


    # Booting and Init


    This chapter is a bit out of the ordinary. It is a bit like Chapter 7, so it will
    be of no use to experienced administrators. Here I would like to take a closer
    look at the process of booting the server, from disk and over the network. Understanding
    the stages and logic of this process can help a lot in some situations, e.g.,
    with a broken xCAT.


    In addition booting, it also covers the operation of the “main” process in Linux-init,
    i.e., the first process in the system. So, if you are interested in the details,
    go ahead! But let''s start by describing the procedure of turning on and starting
    any computer, so that we can understand how init itself is started and what happens
    before it.


    # Booting from Hard Disk


    The boot procedure automatically starts when the computer is powered up. The process
    begins transferring control to the built-in system test program (Power-On Self-Test
    Procedure – POST). During the test, the hardware is checked, and external devices
    are numbered and initialized.


    There are two¹ mechanisms for booting an operating system, BIOS (Basic Input-Output
    System) and UEFI (Unified Extensible Firmware Interface). BIOS is a very old system,
    but still in use. To boot using BIOS, the disk is partitioned using MBR (Master
    Boot Record). MBR is the first sector of the disk (sector 1, cylinder 0, head
    0) with a size of 512 bytes. The MBR contains the partition table and the bootloader.
    number of primary partitions is limited to four; to create more partitions, you
    must create a special, so-called extended partition, in whose space additional
    partitions are created. The MBR partition size is limited to two terabytes. At
    boot, BIOS reads the MBR into memory and transfers control to the bootloader.


    > Actually more, but x86/x86-64 systems traditionally use these.'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# CHAPTER 23 BOOTING AND INIT


    MBR is replaced by GPT - GUID Partition Table, where the possible number of partitions
    is 128 and the partition size is more than 18 exabytes. Along with GPT, BIOS is
    replaced by UEFI (Unified Extensible Firmware Interface). For UEFI operation,
    a special "system" partition is created with the code EF00, formatted in VFAT32,
    where, in particular, bootloaders, drivers, device firmware, etc., are placed.
    The size of the system partition can be much larger than 512 bytes, so the situation
    with bootloaders is much better. The default bootloader is \efi\boot[architecture
    name].efi, e.g., for x86-64, the file will be called boot64.efi. In the system,
    you can choose an alternative bootloader.


    We consider booting using MBR as an example, since the process is not fundamentally
    different from UEFI. The first 446 bytes of MBR represent the program code of
    the bootloader. The 64 bytes located after the bootloader contain the partition
    table. The table can hold a record of four primary partitions (16 bytes each).
    At the end of the MBR, there are two bytes, and they are called "magic numbers"
    (0xAA55). This magic number is used to verify the integrity of the MBR.


    The purpose of the bootloader is to find and load the main boot program and transfer
    control to it. Currently, the primary bootloader for Linux operating systems is
    GRUB (GRand Unified Bootloader).


    One of the main advantages of GRUB is that it can understand the file systems
    used in Linux. GRUB is capable of booting the Linux kernel from file systems such
    as ext3 and vfat32, unlike previous bootloaders as LILO, which first had to read
    the sector numbers of the kernel disk and read the kernel code from when booting.


    The ability to work with file systems is achieved by introducing another stage
    at boot, making the two-stage bootloader a three-stage bootloader. Stage 1 (MBR)
    loads a 1.5-stage loader capable of understanding the system where the Linux kernel
    is stored. Examples are xfs_stage1_5 (for booting the XFS file system) or e2fs_stage1_5
    (for booting from ext2, ext3,ext4 file systems).


    After the stage 1.5 has been run, the stage 2 bootloader can be loaded. After
    loading stage 2, GRUB offers to make a choice from the available set of kernels,
    which are listed in a special configuration file /boot/grub/grub.cfg (for old
    version 1 /boot/grub/menu.1st), or to load a default kernel. It is possible to
    pass additional parameters to the bootable kernel before starting the boot, or
    to load a nonstandard kernel and initial system image (initrd). This is very useful
    if the bootloader is corrupted, and you are booting from an external disk. In
    this case, you can manually specify boot parameters, and after booting, install
    the bootloader again.


    340'
  merge: -1
  pgno: 355
- img_proc: true
  md: '# CHAPTER 23 BOOTING AND INIT


    If the user does not interfere with the boot process, the second stage bootloader
    loads the default kernel image and initrd image into memory. Once the kernel image
    is in memory, it receives control from the second stage loader. The stage of kernel
    loading comes. The kernel loading procedure also consists of several stages. In
    Linux distributions, the kernel is compressed. The kernel can be packed using
    zimage or bzImage, which use the zlib or libbz2 library. At the beginning of the
    compressed kernel image is a program that performs minimal hardware configuration
    and then unpacks the kernel, placing it in the top memory location.


    If the initrd RAM disk image is required to start the kernel, the program will
    also place it into RAM. The program is completed by passing control to the start_kernel()
    function, which performs further actions to prepare and configure the hardware
    to start the operating system.


    initrd acts as a temporary root system in RAM so that the kernel can fully boot
    without mounting any physical disks. Typically, initrd contains the kernel modules
    it needs to communicate with peripherals. This organization of the boot process
    allows you to work with a very compact kernel and still support a wide variety
    of hardware configurations. Once the kernel is booted, the initrd root file system
    is replaced by any other file system or the root file system is mounted using
    NFS (network file system). After loading the kernel, whose task is to make sure
    that the computer''s devices work, the root file system is mounted, and the init
    process is started. To start it, the kernel looks for the /sbin/init executable
    or the file specified in the kernel’s “init” parameter at startup. If no such
    file exists, the kernel tries several standard names and crashes if it finds no
    candidates for init. As a rule, init has PID = 1.


    # INIT in SystemV Style


    I, know that modern distributions don''t use SystemV-style init. You can safely
    skip it and look into systemd. But, some of SystemV init are alive even in 2025,
    so you may spend 15 minutes and know how this legacy works.


    A few words about the role of init in Linux. It is the only process that is monitored
    by the kernel - if init terminates, the kernel crashes. The task of init is to
    configure the system, mount the necessary file systems, and start the initial
    set of services and programs. Another function of init is to terminate zombie
    processes if they have no parent (they are automatically “assigned” to init’s
    descendants) by calling the wait system call.


    341'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# CHAPTER 23 BOOTING AND INIT


    The standard init program (SystemV style)² reads the configuration file /etc/inittab
    starts various processes according to this file. The most important line of the
    /etc/initt file is the following line:


    ```

    id:<number>:initdefault

    ```


    This entry specifies the startup level of the system at boot time. The startup
    level determines which scripts the init process will execute. By default, there
    are six levels in the system:


    +   0. System shutdown

    1. Single-user mode

    2. Multiplayer mode without network support

    3. Multiplayer mode with network support

    4. Not being used

    5. Multiplayer mode with network support and graphical shell launch

    6. Reboot


    Different Linux distributions may have their own special system boot levels, but
    this is very rare.


    Linux system is often booted to either level 3 or level 5. You can change the
    level by running the following command:


    ```

    init <level number>

    ```


    The init 6 command starts the system reboot, and init 0 turns it off. In addition
    to the line specifying the default system boot level, there are other lines in
    the configuration file /etc/inittab. If a line starts with a # sign, it is considered
    a comment and is not processed by the initcommand. All other lines consist of
    four colon-separated fields:


    ```

    id:runlevels:action:process

    ```


    > SystemV is one of the UNIX versions. For a long time, there were two main types
    of init program configuration files, SystemV-style and BSD-style. Some distributions
    (e.g., Slackware) use BSD-style init.


    342'
