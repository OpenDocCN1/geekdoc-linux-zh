    # # Rsync and Others


    With tar, the rsync program is one of the classic backup tools. The task of rsync
    is to synchronize the contents of two directories, and one of them can be on a
    remote machine. Synchronization is only one way, i.e., the newer contents of the
    first directory will be copied to the second, but the newer contents of the second
    will not be copied to the first. The good thing about rsync is that it performs
    a ''smart'' comparison of directory contents before copying starts: newer files
    are detected by update time, and then the contents of larger files are compared
    side by side using checksums and only the changed parts of the files are copied
    (this behavior can be overridden). The transport for accessing remote directories
    is rsh, ssh, or a proprietary protocol. In the latter case, the rsync process
    must run on the remote machine.


    The disadvantages of rsync include the absence of the ability to create incremental
    or differential copies, read data from standard input (for database backups),
    and the inability to work with removable drives. Nevertheless, for relatively
    small backup tasks, it remains a great tool.


    Let''s look at some simple scenarios for rsync.


    ```

    rsync -avz host1:data_dir /backups/host1

    ```'
