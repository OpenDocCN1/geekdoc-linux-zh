    StandardInput= – Where to redirect standard input from, possible values:


    +   - null (default) to /dev/null.

    - tty to the console specified in TTYPath.

    - tty-force is similar to tty, but first disconnect the occupying process, if
    any, from the terminal.

    - tty-fail is similar to tty, but if the terminal is occupied by another process,
    complete the startup crash.

    - data to the thread connected to the running process specified in StandardInputText=/StandardData.

    - file:path into a file system object (file, FIFO, socket, device).

    - socket (only for socket-activated units) to the active socket.


    StandardOutput=/StandardError – Where to redirect the output/error stream. Possible
    values:


    +   - inherit to the same place as standard input.

    - null to /dev/null.

    - tty to the console specified in TTYPath.

    - tty-force – As tty, but if the terminal was used by a running process, detach
    it first.

    - tty-fail – As tty, but if the terminal was used by a running process, fail.

    - journal to a journal that can be accessed via journalctl.

    - syslog to log and syslog to log.

    - kmsg to the kernel log buffer (by you can then see this output in dmesg).

    - journal+console, syslog+console and kmsg+console – Similar to the above three
    options and additionally to the system console.

    - file:path into a file system object (file, FIFO, socket, device).

    - socket (only for socket-activated units) to the active socket.'
