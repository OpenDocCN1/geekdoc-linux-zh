  md: '# CHAPTER 10 REMOTE MANAGEMENT


    Of course, the script can be improved and rewritten in a more convenient language.
    But this has already been done for us, e.g., by the authors of the pdsh program,
    which can run any commands on specified nodes in parallel, annotate the output,
    and limit the number of simultaneously running programs.


    The simplest example of using pdsh:


    ```

    pdsh -w node-[01-10] ''wl grep loadaverage''

    ```


    This command will execute on nodes node-01 ... node-10 shell with the given command
    line. Due to the fact that the string is executed in the shell, we can run not
    just one command, but several, as in the example. Each output string will have
    a prefix - the name of the node from which it is received.


    pdsh supports various transports other than ssh, so it can work in many exotic
    environments. Its most useful options are presented in Table 10-5.


    # Table 10-5. pdsh basic keys


    | Key | Meaning |

    | -a | Run the command on all machines listed in the host file (see below) |

    | -w | Execute the command on the listed nodes. The list is specified using commas
    (no spaces); ranges of numbers can be used, e.g., node-[10-20].² if ''-'' is specified
    as the list, the list is read from standard input |

    | -x | Exclude the listed nodes |

    | -g | Run the command on the nodes of the listed groups: the list of groups is
    specified using commas |

    | -N | Do not output the node name before each line of output |

    | -f | Specify the number of parallel execution threads |

    | -u | Set the timeout in seconds of command execution on the node (by default
    there is no timeout) |

    | -l | Execute the command as the specified user (similar to ssh) |

    | -b | Terminate execution by pressing Ctrl-C (by default, pressing Ctrl-C gives
    the current execution status, and the second press terminates execution) |


    > ² Note that the standard shell may interpret square brackets, so specify the
    node list in quotes.'
