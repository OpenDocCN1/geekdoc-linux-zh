  md: '# Setting Up Torque


    It is advisable to start Torque configuration with the configuration of the control
    node. The main configuration file of the main Torque server is $PBS_HOME/server_priv/nodes.
    The location of the file depends on the directory that was specified during system
    installation.


    The nodes file contains a list of compute nodes served by the server. This file
    contains a description for each node managed by the server, one line per:

    ode_name[:ts] [property ...] [np=NUMBER]


    +   - node_name Node name described in the /etc/hosts file; :ts is after the node
    name, this node belongs to the timeshared type. The state of nodes this type is
    polled by the server and their status is shown by information commands, but no
    tasks are sent to them by the server. These nodes can be used to run interactive
    programs.

    - property A set of any characters. Usually this attribute is used to associate
    a node with a particular task queue.

    - parameter np = NUMBER defines the number of cores on the node. The busy sign
    is set as soon as a task appears on a node, but any number of processes can be
    started on a node within this task.


    Example nodes file:

    ib02 MYCLUSTER

    ib03 MYCLUSTER

    ib04 MYCLUSTER

    ib05 MYCLUSTER


    The list of nodes and their properties can be changed dynamically using the qmgr
    administrator command, after which the system enters the waiting mode for input
    of internal subcommands.


    Add nodes:

    qmgr: create node node_name [attributes=values]


    The values that the attributes parameter can take are listed in the Table 14-1.
    Example:

    qmgr: create node ib01 np=1,ntype=cluster,properties="MYCLUSTER"'
