- img_proc: true
  md: "# Network Config, Time Sync, and Hostname\nResolving\n\nsystemd-networkd service\
    \ can be used to control and automatically configure your network interfaces.\
    \ When a new network device link appears, this service checks the rules from the\
    \ config files, and it finds a match, applies them. Files should have .network\
    \ extension and by default are located in /usr/lib/systemd/ directory. In the\
    \ /etc/systemd/network, you can place files to override defaults.\n\nThe file\
    \ has two sections: [Match], which defines if the configuration will be applied\
    \ to the link, and [Network], defining the interface configuration. The first\
    \ matched file will be applied, and the rest will be ignored, so the file name\
    \ is important. It has really many options and cases of application. I don’t describe\
    \ them here, and if you see some interfaces in your systems are managed by networkd\
    \ (or want to use it), please read the official documentation.\n\nTo replace ntp\
    \ client service in the systemd ecosystem, there is a system-timesynced the main\
    \ section of the service definition is [Time], and the main key is “NTP” – space-separated\
    \ list of remote ntp servers. Note that NTP servers can be obtained by networkd\
    \ from DHCP server; in this case, they are added to this list.\n\nsystemd-resolved\
    \ is a service, implementing the hostname DNS resolving. To enable it, add ‘resolve’\
    \ to the list of options in ‘hosts’ line in /etc/nsswitch.conf. Also if 127.0.0.53\
    \ or 127.0.0.54 are used as a DNS server (e.g., in /etc/resolve.conf), then also\
    \ resolved service will be used. Configuration file is resolved.conf, located\
    \ in well-known places. The most important options:\n\n| Option | Meaning |\n\
    |---|---|\n DNS=LIST | A space-separated list of IPv4 and IPv6 addresses of DNS\
    \ servers Domains=LIST | A space-separated list of domain prefixes, used in search\
    \ Cache=yes=no-negative | Controls whether the DNS responses should be cached\
    \ or not. no-negative means caching only positive results |\n\nThis service can\
    \ be controlled by resolvectl1 command. resolvectl status shows current settings,\
    \ including the actual list of remote DNS servers. resolvectl query works like\
    \ dig command – resolves the given hostname. Other useful subcommands are statistics,\
    \ reset-statistics, flush-caches, show-cache, and monitor."
