  md: '# CHAPTER 11 USERS – ACCOUNTING MANAGEMENT


    in this case, the functionality is wider: the information is not strings from
    text files (like passwd, group, hosts, etc.), but full-fledged database records,
    which can include links to other records, binary information (a picture, for example),
    you can search by a wide range of parameters and much more.


    A very important feature of LDAP is a complete system of access separation and
    authentication, i.e., a user can access only those records to which his rights
    allow. Approximately, as in a file system. LDAP is actively used to store user
    data and often successfully replaces passwd and NIS+. Therefore, it is tempting
    to use it to manage supercomputer users and many other things than we.


    Unfortunately, this idea works only with small clusters. The point is that a computing
    cluster is clustered not by uniform access to LDAP server, but by “explosive”
    access – at the moment of launching a task, all nodes on it is launched simultaneously
    access LDAP server information about the user. This mode of operation is not acceptable
    for LDAP server, and with large number of simultaneous requests, it discards the
    “unnecessary” ones, which leads to the impossibility of launching tasks.


    This problem can be solved by configuring a hierarchy of caching LDAP servers,
    but in practice, I have not encountered such solutions for clusters, so it is
    difficult to say anything about their effectiveness. Besides purely technical
    concerns, such a solution requires additional physical servers and careful implementation
    of the network, which entails, among other things, lower reliability and more
    complicated support. Nevertheless, for small clusters, such a solution can be
    very convenient, as it allows storing in LDAP-based advanced user data and integrating
    with various applications and web services.


    Configuring an LDAP server is not easy and is described in detail in the literature
    and on the Internet. Note that configuration in RedHat-like distributions can
    be done with the interactive authconfig program. After installing and configuring
    LDAP server, you can install programs for its administration. There are many such
    programs, such as phpLDAdmin or LDAP Account Manager. Besides OpenLDAP, there
    are other free implementations, such as Fedora Directory Server, Apache Directory
    Project, and Mandriva Directory Server. Some of them include administration tools
    as well.


    # Brief Summary


    The organization of account management seems very simple because it is built into
    the OS. But this is only the technical part, and how to use it is not always clearer.'
