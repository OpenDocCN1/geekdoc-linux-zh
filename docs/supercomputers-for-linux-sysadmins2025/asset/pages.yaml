  md: '# CHAPTER 23 BOOTING AND INIT


    Required-Stop specifies the services that must be stopped before running the script
    with the stop argument.


    Default-Start specifies the levels for starting the daemon by default; if not
    specified in the chkconfig command arguments, the script will be activated at
    the appropriate system boot when the daemon enable command is executed.


    The other keywords have the same meanings, specifying when initialization scripts
    are located can vary significantly from distribution to distribution. The major
    commercial Linux distributions-SuSE and RedHat-try to follow the directory structure
    of initialization scripts defined in the UNIX SystemV standard. But since Linux
    is not always rigidly adhering to the standards, the directory structure can vary.


    For example, most Linux distributions have a script called rc.local, which historically
    came from FreeBSD. This script is executed last the boot process. It can be used
    to run your own commands, but it is desirable to do it as a separate script. The
    use of rc.local is allowed, but not recommended.


    Finishing the topic of system booting, I would like to draw attention to a problem
    faced by cluster administrators when installing a system on a system installed
    on a hard disk by cloning. Often a system installed on a hard disk by cloning
    refuses to boot or mount file systems. This happens because when installing the
    system, factory disk identifiers are written in the configuration files in the
    disk partition addresses. This is done to increase the system security, but the
    system rewritten to another disk will not be able to find the required partitions.
    Therefore, before the cloning procedure, you should carefully review and correct
    the configuration files of the bootloader (/boot/grub/grub/grub/grub.cfg) and
    mounter (/etc/fstab) on the prototype node by deleting disk identifiers in the
    partition addresses.


    # Systemd


    Today, the most common init implementation is systemd; let''s take a look on it.


    Besides the standard SystemV-style init, there are several other popular boot
    managers: daemonontools, OpenRC, Upstart, Initng, and others. Some of them are
    just lightweight versions of init (for embedded devices, e.g.), and some of them
    to solve the problem of parallel loading and service dependencies.'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# CHAPTER 23 BOOTING AND INIT


    Parallel loading is an important problem of standard init, it starts services
    only sequentially, and this can take a long time. Attempts to introduce elements
    of parallelism in standard init by introducing special comments in the start scripts
    have failed.


    Lennart Poetering, working at RedHat, with the participation of developers from
    Novell, IBM, Intel, and Nokia, has developed a new initialization system for the
    Linux operating system - systemd. The reason for creating systemd was the desire
    to make greater use of parallel execution of services at boot time, providing
    administrators with a new number of features that greatly simplify the process
    of system maintenance. Currently, systemd is used as init in many distributions,
    including RedHot/Centos (since version 7), Fedora, Debian, Archlinux, and others.


    Standard UNIX and Linux services (daemons) are started via init scripts. Such
    a script prepares the environment for the daemon and then starts it. Scripts are
    written in shell, so they are characterized by low speed and difficult to parse
    because the abundance of hard-to-read code. Many tasks arising when using services
    are hard to solve by many of scripts, e.g., as organizing parallel execution,
    correct tracking of processes, and configuration of various parameters of the
    process execution environment.


    There are advantages to using scripts: they are familiar to many administrators,
    and you can see the progress of starting or stopping a service. Therefore, systemd
    can also use standard init scripts to start system services, but this is sometimes
    problematic, so try not to do.


    You can determine which initialization method your distribution uses by looking
    the name of the first process. If the process is named systemd, or init is a symbolic
    reference to /bin/systemd.


    The basic concept of systemd is a unit, which is a description of a service, a
    group of services, just a command to be executed, etc. Units can be related to
    each other and always have a certain type. The key type is target - analog of
    runlevel in init, but unlike it, several targets can be activated simultaneously.
    Essentially, a target is a list of dependencies. A normal unit can be stopped
    or restarted. In the case of a target, restarting is impossible, and it is generally
    not possible to stop all units included in it. To stop a unit automatically if
    all the targets is part of stopped, you must have the StopWhenStopped-yes directive
    in its description.


    If you still need to stop all units from some target, you can use the type following
    command:


    ```

    systemctl stop -- $(systemctl show \

    -p Wants MYTARGET.target | cut -d= -f2)

    ```


    347'
  merge: -1
