    # Installation and Configuration of the Cluster Compute Node


    The main purpose of a compute node with maximum efficiency is to execute user
    tasks received by it. These can be independent programs and parallel program processes.
    Due to the different functional purpose of a compute node compared to a control
    computer, its architecture may differ significantly.


    The compute node does not need a powerful disk subsystem; moreover, its complete
    absence is acceptable. However, in this case, the load on the network infrastructure,
    which is already very busy, increases and the size of memory, available for user
    jobs, is decreased. NFS file system may become a bottleneck, especially for programs
    generating many temporary files during the computations; even parallel file system
    performance may degrade in such cases. I strongly recommend having at least local
    /tmp and suggest your users to use it as a scratch space. Also, enroot and others
    will unpack the container file systems by default.


    The main purpose of the disk subsystem in a compute node is to store temporary
    files. If you decide to install the operating system locally, create a separate
    partition at least of 50–100 GB for it.


    Be sure to create a swap partition and a partition for the /tmp directory. The
    swap partition does not need to be large – its purpose is to provide a small reserve
    for RAM. A large amount of swap is required, the task will spend more time waiting
    for memory pages than running. Allow all remaining space for the /tmp partition.
    If you have two local disks, I recommend that you create a swap partition on each
    and merge the partitions for /tmp into a logical RAID-1.


    A more careful approach is required when configuring the network subsystem. It
    must provide, first, high-speed communication between nodes for data exchange
    between processes of a parallel program; secondly, interaction with control and
    service nodes. The first task is solved by using specialized high-speed communication
    equipment, e.g., InfiniBand. To solve the second task, standard Ethernet networks
    are used as a rule. However, the load on this network can also be quite significant,


