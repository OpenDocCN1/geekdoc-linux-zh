- img_proc: true
  md: '# CHAPTER 27 COMMUNICATING WITH USERS


    Observe the culture of communication in email correspondence with users. Remove
    unnecessary quotations of the question (address, etc.), leaving only the key ones,
    and write your answer underneath them. If there are several questions in the letter,
    answer each one separately under the corresponding quotation.


    If you are asked a question that comes first in the documentation, you should
    not write “read the docs, it''s written for you”; it’s much better to write “pay
    attention to point 1.1 of frequent questions in our documentation (http://your.server/docs/faq.html#p1.1).”
    Don’t be lazy to create templates for typical emails – alerts, answers to common
    questions.


    # Accounting for Requests from Users


    Various software systems have already been created to facilitate communication
    with users, as well as to keep track of requests, problems, etc. Unfortunately,
    most of them are focused on a narrower range of tasks and do not involve close
    integration with third-party systems, especially such as a supercomputer. Nevertheless,
    they perfectly fulfill the tasks of processing and accounting of requests. Classic
    examples from the open source world in this area are RT, OTRS, Track, and OpenProject.
    All these systems are actively developed and supported.


    The main object in such systems is a ticket. It is created by a user (the administrator
    is also a user), and its processing can be subject to strict rules. A ticket has
    a status, creator, and a party responsible for the decision. Notes or correspondence
    can be attached to it, which allows the history of problems solving. As applied
    to a supercomputer, a request can be a user’s request for technical support, records
    about equipment failures and its transfer to service, records about installed
    software, and even users’ requests for access to the supercomputer.


    Such systems are often well integrated with email, both for sending information
    messages and for receiving applications. Often they can be well integrated with
    web forms. The main problems that arise when using such systems are


    +   - Complexity of authorization of users, as they are not tied to the users
    of the supercomputer


    +   - Complexity of linking actions in the system to actions on the supercomputer
    and vice versa'
  merge: -1
  pgno: 409
- img_proc: true
  md: '# CHAPTER 27 COMMUNICATING WITH USERS


    The solution to these difficulties always depends on many nuances specific to
    a particular supercomputer. And if we take into account the configuration of such
    systems itself requires serious qualification, their implementation becomes a
    very difficult task. In addition to storing information about requests from users,
    such systems can also store internal data: event logs, requests to technical support
    (not yours, those of hardware and software manufacturers), preventive maintenance
    plans, etc.


    Nevertheless, the use of such systems, even in their simplest form, can make accounting
    tasks much easier. I do not advise you to use bug accounting systems in programs
    like Bugzilla, Redmine, etc., as their adaptation to our tasks is much more difficult
    and often simply impossible, despite the apparent similarity of the problems being
    solved.


    # Actualization


    This part applies only to those supercomputers whose resources are not only given
    to internal users (employees of your organization).


    Let''s say you''ve already built a great system for account management, set up
    registration, alerts, etc. Think about what to do in three or four years when
    the number of accounts is in the dozens or even hundreds? I''m not talking about
    active users; I''m talking about accounts, many of which will be dead souls. How
    can you tell the difference between an account that has not been used for a long
    time and that is no longer needed? And if it takes up 5% of the disk and the question
    arises, “Can I delete all this data?”


    A solution is to introduce “draconian rules” and delete all accounts that have
    not been logged in, e.g., for more than a year. But it is better not to do this,
    because sooner or later you will delete the data of an important experiment or
    an important employee, and you will be guilty despite the rules. And in general,
    this policy is not very friendly to users.


    I recommend that you follow the re-registration procedure. This consists of regularly,
    e.g., once a year, asking users to confirm that their account is up-to-date. It
    is a good practice to ask for a report on the activity for the specified period.
    A “report” is a general term; it can be, e.g., a web form with a survey on several
    topics.'
  merge: -1
  pgno: 410
- img_proc: true
  md: '# CHAPTER 27 COMMUNICATING WITH USERS


    Users who have not re-registered within a given period of time are blocked.


    The duration of the re-registration period should be at least two to three weeks,
    as people may be on business trips, vacations, and writing a report may take a
    considerable amount of time, if it is supposed to describe the work or its results.
    Unregistered reports should not be deleted until least the next re-registration.
    If disk space is important to you, send the data of such users to the archive.


    Users who have not re-registered should be able to re-register. The form of registration
    can be very different – choose the most convenient for your infrastructure. It
    can be email distribution with subsequent automated processing of letters (if
    the number of users is not very large), but it is more convenient to filling out
    a web form with entering the results into the database, log, etc.; the web form
    can be a part of your IT infrastructure or a separate cgi-script. It does not
    matter much.


    If you develop a web-based re-registration form yourself, don''t forget about
    handling duplicate data (someone will probably submit the form by mistake two
    or three times), saving the submission date, notifying the administrator, and,
    of course, notifying the submitter that the data has been accepted. It is a good
    idea to give the submitter a message number they can refer to if there are any
    problems.


    # Education


    Provide as much possible information to your users, if it may help them to solve
    their issues and answer their question before they ask you. This is related not
    only to day-to-day cluster usage, like cluster limits, partitioning, and priority
    structure, but also links to the best practices, FAQs and docs of software vendors,
    and other useful materials. I may recommend very good series “The Art of HPC”¹
    by Victor Eijkhout from TACC (Texas Advances Computing Center). It touches many
    parallel programming aspects, HPC applied packages usage, basic SLURM knowledge,
    and many other aspects.


    > ¹https://theartofpc.com/'
  merge: -1
  pgno: 411
- img_proc: true
  md: '# Brief Summary


    Communication with users is an integral part of an administrator’s work. Try to
    organize it as transparently as possible for users and conveniently for yourself.
    Keep a history of correspondence; make a list of problems and solutions. Use automation
    tools for routine processes to communicate; they will save you a lot of time.


    Compile help notes on basic actions, such as gaining access, working with login
    and file transfer programs, how to contact tech support, and solving typical problems.


    # Search Keywords


    Mailman, majordomo, mail alias, RT, OTRS, Trac, helpdesk, openproject'
