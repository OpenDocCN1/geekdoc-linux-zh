    # Brief Summary


    It is not easy to write a parallel program, and the first thing you need is parallel
    programming technology. There are many such technologies - from manual thread
    and process management using libraries with built-in parallel methods. Currently,
    the most popular are MPI, OpenMP, CUDA, OpenCL, OpenACC, and SHMEM.


    +   - MPI and SHMEM are implemented as libraries but require a special way of
    launching because they support work of parallel processes on several compute nodes.
    Unlike other technologies, they do not require compiler support. That''s why the
    administrator takes care of installing and configuring them.


    +   - OpenMP and OpenACC are implemented as extensions of Fortran, C, and C++
    languages in the form of special comments, i.e., a program with OpenMP or OpenACC
    directives remains a correct program in the source language. CUDA and OpenCL implement
    C language extensions; a program using them cannot be compiled by a regular compiler.


    The efficiency of programs depends on the compiler, so try to install the one
    that best meets your needs.


