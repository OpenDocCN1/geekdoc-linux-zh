    It is no secret that at the very beginning of the computer era, the terms "processor"
    and "kernel" (meaning the core of the processor) were synonymous. To be more precise,
    the term "core" did not refer to the processor at all, because there were no multicore
    processors yet. Each computer usually had a single processor, which could execute
    only one process at any given time. Modern systems of this type can still be found
    today, but they are typically designed for special tasks (controllers, embedded
    systems).'
