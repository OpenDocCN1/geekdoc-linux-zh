  md: '# CHAPTER 12 USERS – QUOTAS AND ACCESS RIGHTS


    Quota is set for each specified file system; quotas on different file systems
    are not summarized. If some quota does not need to be specified (e.g., a soft
    quota on the number of files), then 0 is specified in the corresponding field.
    If you specify the -g switch, username will be the name of the group and the group
    quota will be set. The user quota is set by default; you can specify it explicitly
    with the -u switch.


    If you specify the -b switch instead of username and quota fields, setquota will
    expect these values on the standard input stream – one line per user or group.
    The fields must be specified in the same order as the command line.


    The size of disk space is specified in blocks, not (kilo)bytes.


    The time after a soft quota exceedance becomes a blocking quota is also specified
    by the setquota command using the -t (default for all) or -T (for an individual
    user or group) switch. Every second in or the string ''unset'' is specified if
    time is not limited. Command format:


    ```

    setquota -t [-u | -g] block-grace inode-grace -a | filesystems

    setquota -T [-u | -g] name block-grace inode-grace -a | filesystems

    ```


    Another way to change quotas is the edquota command. Unlike setquota, it starts
    an editor (set in the EDITOR environment variable), which is passed a text file
    in special format. You can report on current quotas and occupied space with the
    repquota command. Its format is similar to edquota and setquota: the -u (default)
    and -g keys specify the type of quota (user or group), -t and -T specify the time
    for soft quota, the name of the user or group, and the list of file systems (or
    the -a key). If no user (group) name is specified, statistics for all users (groups)
    are given.


    Typical output of the repquota command with -s switch to show information in human-readable
    format:


    ```

    # repquota -m /

    *** Report for user quotas on device /dev/sda

    Block grace time: 7days; Inode grace time: 7days

    Space limits File limits

    User used soft hard grace used soft hard grace

    root -- 52806M OK OK 803k 0 0

    ...

    ```'
