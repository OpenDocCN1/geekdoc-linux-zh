  md: '# CHAPTER 4 SUPERCOMPUTER HARDWARE


    External storage often differs in its internal structure and access method, which
    determines the level of reliability of data storage and the speed of data access.
    We will not discuss the internal structure of the storage system here, we will
    only mention the different access methods.


    Storage systems are categorized into at least two types based on their access
    method:


    +   - Direct attached storage or DAS

    - Network attached storage or NAS


    NAS can be connected via servers (or special hardware), connected to physical
    storage via dedicated storage network - storage area network or SAN (see Figure
    4-4).

    Direct attached storage is either connected to a dedicated storage node or to
    a management node. Such storage is always visible in the operating system of the
    node to which it is connected as a locally connected disk device (physical connection
    via SATA, SAS, FibreChannel, ...). RAID (redundant of independent disks) technology
    is often used in storage systems to provide fault tolerance and increase speed.
    RAID combines several disks of equal capacity into a single logical disk. Combining
    occurs at the block level (which may not coincide with physical disk blocks).
    One logical block can be mapped to one or more disk blocks.


    There are several “levels” that are accepted as the de facto standard for RAID:

    RAID-0 – logical blocks unambiguously correspond to disk blocks, and they alternate:
    block0 = block0 of the first disk, block1 = block1 of the second disk, and so
    on.


    RAID-1 is a mirrored array, logical block N corresponds to logical blocks N of
    all disks, and they must have the same contents.


    RAID-2 is an array with Hamming code redundancy.


    RAID-3 and RAID-4 are disk arrays with striping and a dedicated checksum disk.


    RAID-5 is a disk array with striping and an unallocated checksum disk.


    RAID-6 is a striped disk array that uses two checksums calculated in two independent
    ways.'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# CHAPTER 4 SUPERCOMPUTER HARDWARE


    Level 0 provides the highest sequential write speed – blocks are written in parallel
    to different disks, but does not provide fault tolerance; level 1 provides the
    highest fault tolerance, as failure of N-1 disk does not lead to data loss.


    Levels 2, 3, and 4 are not really used because level 5 provides better speed and
    reliability with the same degree of redundancy. In these levels, disk blocks are
    combined into strips, or stripes.


    In each stripe, one block is allocated for checksum storage (two strips for level
    6) and the remaining blocks are allocated for data, with the disk used for the
    checksum interleaved across successive strips to even out the load on the disks.
    When writing to any block, the data checksum for the entire stripe is calculated
    and written to the checksum block. If one of the disks fails to read the logical
    block that was on it, the entire stripe is read and the data of the working blocks
    and the checksum are used to calculate the block data.


    Thus, for RAID-5, it is possible to obtain fault tolerance with less redundancy
    than for a mirror (RAID-1) – instead of half disks, only one disk in a stripe
    (two disks for RAID-6) can be allocated for redundant data. As a rule, the “width”
    of a stripe is 3–5 disks. The cost of this speed of operation – to write a single
    block, you must first read the entire stripe to calculate a new checksum.


    Two-level schemes are often used – RAID arrays themselves are used as disks for
    other RAID arrays. In this case, the RAID level is indicated by two numbers: first
    the lower level, the upper level. The most common are RAID-10 (RAID-0 built from
    RAID-1 arrays) and RAID-50 and RAID-60 – RAID-0 arrays built from RAID-5 and RAID-6
    arrays, respectively. Read more about RAID in the literature and on the Internet.


    If distributed data storage is used, e.g., in Lustre (we will talk about later),
    there can be several storage nodes, and the data stored on such storage is distributed
    across the storage nodes. Storage with LAN access (or network attached storage,
    NAS) usually provide disk space to nodes using special protocols that can be grouped
    under the general name of network file systems. Examples of such file systems
    are NFS (network file system), server message block (SMB), or its modern variant
    – common Internet file system (CIFS).'
