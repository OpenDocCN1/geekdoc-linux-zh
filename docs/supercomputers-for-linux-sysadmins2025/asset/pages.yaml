- img_proc: true
  md: 'Specify all MGS NIDs via comma. If you forget your MGS NID, access it via ssh
    or

    console and run the command


    ```

    lctl list_nids

    ```


    Remember that Lustre does not route its traffic between the different networks,
    so

    both the client NID and MDS must be on the same network, and it is important to
    specify the

    correct NID list if you are using multiple networks.


    Lustre is quite demanding on RAM size, especially on OSS. For each OST, the default

    40 MB for logging and 600 MB for metadata caching. In addition, 1.5 MB for

    each service thread (the number of threads can be roughly estimated as the number
    of

    clients divided by the number of connected OSTs). For MDS, the calculation formula
    can

    be found on the official website, and I''d recommend having more memory, and it.


    The buffers of the operating system and network devices should also not be

    forgotten. For normal OSS operation, it is recommended to have 2 GB of RAM plus

    1 GB for each OST. Additional memory is not a bad thing; it will be used for additional

    caching. Fine-tuning the Lustre settings is done with the lctl and tunefs.lustre

    commands.


    The lctl set_param command performs on-the-fly configuration. The parameters

    can be changed temporarily (by default) or permanently and will be saved

    after a reboot (add -P option). The lctl get_param command gives a list of currently\valid
    parameters. lctl ping can be used to test if an OSS or MDS is available via the

    net transport. These commands affect the internal logic of Lustre, so don''t use
    them\unless you really need to. Be sure to study the documentation carefully,
    the wrong

    combination or order of commands can cause the file system to malfunction.


    # tunefs.lustre command is used in rare cases, like changing OST/MDT

    IDs, and is only executed on OSS or MDS when the server is stopped!


    If an OST has failed in the process of creation, the best recommendation is to

    format it. If it has failed while the file system has data, you should unmount
    all clients,

    then unmount all OSTs, then MDTs and MGS, and try to recover the OST. Usually
    it

    is done by mounting the OST as a 1disk file system if ext4 was used as a carrier
    file

    system and then checking using a special patched version of e2fsck. Please refer
    to the

    document of the exact version of Lustre you are using, the instructions may,

    and you can easily ruin your OST data. You''re warned.'
