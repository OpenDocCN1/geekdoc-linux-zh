  md: '# CHAPTER 8 UNIX AND LINUX – WORKING TECHNIQUES


    Sometimes you need to perform a simple (or not so simple) calculation. Running
    a graphical calculator is long and inconvenient, but bash has one ready! The expression
    in double brackets after the ''$'' sign will be calculated according to the rules
    of integer arithmetic:


    ```

    $ echo $((123*55+18))

    6783

    ```


    You can substitute variables there too, but without the ''$'' sign in front of
    the name:


    ```

    $ offset=18

    $ echo $((123*55+offset))

    6783

    ```


    This is especially useful for scripts. If you want something more complicated,
    such as real arithmetic, call the bc command for help; you may have to install
    the appropriate package first.


    You probably know that sh commands on the line are separated by semicolons. But
    this is not the only separator - the ''&'' sign not only sends the command to
    the background, but also separates it from the next one:


    ```

    $ abc & xyz & wait

    ```


    This code will run the abc and xyz commands in the background and wait for them
    to complete.


    Other delimiters are ''&&'' and ''|''. They differ from the others in that they
    specify conditional execution: the second command will be executed only if the
    first command succeeds for ''&&'' or fails for ''|''. Sample code to output the
    contents of a file, only if it exists:


    ```

    $ -f ''testfile'' && cat testfile

    ```


    Note that ''['' is a command, and in the old UNIX tradition, it is a reference
    to the test command.


    Sometimes you may want to process only the error stream and ignore the standard
    output stream or write it to a file. But the ''|'' operation works only with the
    standard output, what can we do? This trick of creating a dummy file descriptor
    can help; it swaps the output and error streams:


    ```

    $ my_command 3>&1 1>&&2 2>&3

    ```'
