    \ select command, with a number before each item. The user enters will get the\
    \ value of the corresponding item in the list or an empty string if an invalid\
    \ number is entered.\n\nYou can get user input in another way – by using the VAR\
    \ command. When this command is executed, the user will be prompted, and after\
    \ pressing the Enter key, everything he has entered will be written to the VAR\
    \ variable. If the script input is directed and is read from a file or from the\
    \ output of another program, one line will be read.\n\nAnother useful operator\
    \ in bash is getsopts; it allows you to process command-line options in a really\
    \ convenient way. The syntax is getsopts \"abc:d\" arg [...], where \"abc:d\"\
    \ are options description and arg is the variable name and optional list of strings;\
    \ if it is specified, it is used instead of \"$@\". Options description is a string;\
    \ each letter is a possible option (only one-letter options are allowed); if it\
    \ is followed by ':', then the option requires additional argument. If ':' is\
    \ specified in the string beginning, the 'quiet mode' is activated – the messages\
    \ about bad options won't be printed. Quiet mode can be activated by setting OPTER\
    \ variable into 0. getsopts gets one option per call and saves the current index\
    \ in the OPTIND array (you can change it if it is needed, e.g., set it into 1\
    \ to reset the index), if the option is successfully processed, it returns 0 into\
    \ the arg variable, if there was an argument, it puts it into the OPTARG variable.\
    \ If the option was not found or the argument was required but not found, then\
    \ arg will be set into '?', and the OPTARG will be unset. In quiet mode, if the\
    \ argument was not found, arg is set into ':' and OPTARG into the option value.\n\
    \nHere is an example:\n\n```\ncase $arg in\n```"
