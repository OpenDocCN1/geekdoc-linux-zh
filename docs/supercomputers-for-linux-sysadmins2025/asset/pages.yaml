  md: '# CHAPTER 12 USERS — QUOTAS AND ACCESS RIGHTS


    To avoid a fork-bomb attack,I strongly recommend limiting the number of simultaneously
    running processes on control nodes for ordinary users. Fifty to one hundred processes
    per user are usually more than enough for comfortable work. It is also worth limiting
    the processor time, e.g., to 100 seconds. This is not an astronomical process
    running time, exactly the time the processor spent on. This will help to limit
    random and nonrandom runs of calculations on the head machine.


    A CPU time limit that is too small will cause large file transfers via sftp/scp
    to the host machine to crash.


    All ulimits can also be set via cgroups, e.g., in the user slice in systemd. Note
    that some limits may have global limitation via kernel parameters, e.g., maximum
    number of opened file descriptors can be limited via sysctl fs.file-max, and in
    this case, if you set ulimit higher, it will actually be limited by sysctl value.


    Some limits, especially on compute nodes, should be increased. First, it is open
    files, when starting many processes via ssh, a socket is created for each connection,
    which is also a file in UNIX ideology. Second — max locked memory, memory for
    RDMA system buffers should be locked. On the user-facing nodes, e.g., login nodes,
    I recommend restricting system resources usage, like CPU, memory, and number of
    processes, to prevent accidental user misbehavior.


    In many cases, you should change the stack size limit, because it is actively
    used by OpenMP Don''t make it too big; otherwise, it will take up a lot of memory
    by default, if it is not required. All these limits are specified in /etc/security/limits.conf
    and with the PAM module pam limits.


    If you use systemd (most probably yes), then you can use limits per service. Check
    the chapter “System – a Short Course” for details.


    > A program or even a script (for example, “./_ & ./_”) written to a file named
    “_”) runs itself many times. The consequences of not setting a limit on the number
    of processes is fatal — the computer stops responding after a few seconds, and
    it is impossible to bring it back to life.


    181'
