    # Configuring the MOM Server on Compute Nodes


    Configuring Torque on compute nodes involves configuring the pbs_mom server to
    start during the operating system boot process, creating a $PBS_HOME/server_name
    file specifying the name of the computer running the head pbs_server, and creating
    a configuration file /var/spool/PBS/mom_priv/config for the pbs_mom server. This
    file is read when pbs_mom starts. Example file:


    ```

    $logevent 255

    $pbsserver rsufs

    $cputmult 1.0

    $ideal_load 2.0

    $max_load 2.0

    ```


    Here:


    +   $logevent is a bit string indicating which events will be logged in the log
    files.


    +   $pbsserver is the name of the computer running pbs_server.

    $cputmult is a multiplier that scales the performance of the node.'
