  md: '# CHAPTER 7 UNIX AND LINUX – THE BASICS


    The keyword to indicates the destination address or network, and via indicates
    the router for it.


    All ip commands can be abbreviated to a single-digit prefix, i.e., instead of
    ip addr show, you can write ip as (or even ip since show is the default action).

    Frequently used:


    +   - ip a = ip address

    - ip r = ip route

    - ip l = ip link

    - ip ru = ip rule


    I already mentioned VLAN (Virtual Local Area Network). This is a general name
    for a whole family of technologies and protocols, but the essence is the same
    – to unite devices in one or more connected physical networks into one virtual
    network, as if they were connected to one switch. We are interested in two cases
    – combining switches into one virtual switch and splitting a common physical network
    into two or more logically separated ones.


    The first case can be implemented in different ways, not only with VLAN (e.g.,
    stacking and others), but it all depends on the models of switches used. And even
    with the help of VLAN, such aggregation is done differently for different switches
    and manufacturers. If you need to do this kind of aggregation, call an experienced
    network engineer.


    The second case also requires configuring the switch (and supporting technology
    in it, of course), which varies from vendor to vendor, but it is much easier to
    handle. There are two ways to create VLANs in one physical network: untagged and
    tagged.


    An untagged VLAN is created by specifying the switch port(s) that will be included
    in it. Once configured, all traffic, even broadcast traffic, from these ports
    will be visible only within the created VLAN.


    What if there are several devices on the same port? When there''s a tagged VLAN
    comes to the rescue. it is an open IEEE 802.1Q standard, so it is widely supported,
    but requires configuration on the endpoint side (connected server). In Linux,
    this requires creating a new interface specifying a tagged VLAN:


    ```

    ip l add link eth0 name vlan101 type vlan id 101

    ```'
