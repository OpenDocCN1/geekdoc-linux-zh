  md: '# CHAPTER 15 SLURM


    +   - bfbf_max_job_user - The maximum number of jobs per user to attempt starting
    with the backfill scheduler for all partitions. Default: 0 (no limit).


    +   - bf_max_job_user_part - The maximum number of jobs per user partition to
    attempt starting with the backfill scheduler for any single partition. Default:
    0 (no limit).


    +   - bf_max_job_start - The maximum number of jobs which can be initiated in
    a single iteration of the backfill scheduler. Default: 0 (no limit).


    +   - bf_max_job_test - The maximum number of jobs to attempt to backfill. Default:
    500.


    +   - bf_max_time - The maximum time in seconds for the backfill scheduler loop.
    Default: bf_interval value.


    +   - default_queue_depth - The default number of jobs to attempt scheduling after
    a job completes or other routine actions occur. Default: 100.


    +   - defer - Defer the job scheduling at job submit time, but defer it until
    a later time when scheduling multiple jobs simultaneously may be possible.


    +   - defer_batch - Like defer, but only will defer scheduling for batch jobs.
    Interactive allocations from socalled/srun will still attempt to schedule immediately
    upon submission.


    +   - ignore_prefer_validation - Ignore errors requesting nodes features. May
    be helpful when you add and remove nodes frequently, but is dangerous otherwise.


    +   - max_rpc_cnt - Defer scheduling jobs, if the number of active controller
    daemon thread is equal or higher than this. Default: 0 (unlimited).


    +   - max_sched_time - Maximum seconds the scheduler loop can run. If it is set,
    then other operations will be deferred while scheduling, so ensure that it is
    lower than MessageTimeout.'
