    #  Advanced Parameters for slurm.conf


    Here are some (there are much more, read the latest doc) of parameters in slurm.conf,
    which can help you.


    | Parameter | Meaning |

    | PropagateResourceLimits | Force SLURM to set specified ulimits for the started
    jobs, as they are specified on the **submit** node. Possible values are ALL, NONE,
    CPU, NOFILE, ... |

    | HealthCheckInterval | Interval in seconds between health check script runs,
    0 (default) disables it |

    | HealthCheckNodeState | Nodes in which states should run health check script:
    ALLOC, ANY, CYCLE (run gradually on all nodes), IDLE, NONDRAINED_IDLE, MIXED.
    You may specify several via comma |

    | PrivateData | Hide information from regular users – list via comma: events,
    jobs, nodes, partitions, reservations, usage. See more info below |

    | PrologFlags | Control prologue behavior, list via comma. See more info below
    |

    | SchedulerParameters | Options for the scheduler |

    | SlurmSchedLogFile | Path to the log file for the schedulers |

    | SlurmSchedLogLevel | 1 = scheduler logging is enabled, 0 = disabled |'
