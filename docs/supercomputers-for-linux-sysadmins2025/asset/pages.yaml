    # Customizing Xorg


    In most cases, Xorg server does autodetection of everything pretty well. But sometimes
    you need to override something or give Xorg hints. The /etc/X11/xorg.conf file
    is divided into sections using the keywords section and end section. Let''s look
    at the most important sections. The ServerFlags section specifies the options
    with which the X server is started. In most distributions, the options for starting
    the server are set by window managers and are outside the xorg.conf.


    In this example, the AllowMouseOpenFail option tells the server even if the mouse
    is not present. The ZapWarning option causes the X server to sound a loud beep
    when the user presses the Ctrl-Alt-Backspace key combination, rather than terminating
    (as it did before). Only pressing Ctrl-Alt-Backspace again will terminate the
    X server.'
  merge: -1
