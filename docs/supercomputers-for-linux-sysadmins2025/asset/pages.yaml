    # Alternatives for X11


    A serious limitation of the X protocol is its low speed. When running applications
    with rich graphics, there can be very long delays, leading to almost impossible
    work, especially on narrow communication channels. An alternative in this case
    is protocols that have long been used for Windows systems. The VNC protocol is
    very common; there are many clients for it and several server implementations
    for Linux. The protocol supports scaling and compression, which allows you to
    dramatically increase the speed of transmission at the expense of quality.


    The disadvantage of this approach is that it does not support multiuser organization:
    the server is started by one of them and then any client connecting to it will
    have access to the applications and desktop running in the current session. Dynamic
    session spanning based on username is not available in any of the available servers,
    as far as I know. Nevertheless, this technology can be used to organize access
    to dedicated applications - visualization of scientific calculations (if the number
    of its users is small), administration of specific hardware, etc.


    Don''t forget to set a password to log in!


    For Linux, the best known implementations are tightvncserver, its modern fork
    TigerVNC. They run as X11 servers, so any X applications can run in their sessions.
    Images from the server can be sent to clients over the VNC protocol, and there
    can be multiple clients at the same time. They can be passive, receiving only
    the image but not being able to enter information, or operate with full access.
    Similar but more developed technology is RDP (Remote Desktop Protocol), used in
    the standard delivery of Windows. It supports authorization and simultaneous work
    of several users, as well as file transfer. The speed of RDP is usually faster
    than VNC and with higher image quality. Due to the fact that this protocol is
    closed, there are far fewer Linux implementations of


    254'
