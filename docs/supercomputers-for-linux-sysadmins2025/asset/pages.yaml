  md: 'CHAPTER 26 CLUSTER MANAGEMENT SYSTEMS – XCAT OTHERS


    # # Installation and Initial Setup


    You can install xCAT by cloning the git repository and compiling the required
    packages (most of them are per modules) or by installing the required packages
    from the repository. Repositories for RedHat-compatible, SuSE, and Debian-compatible
    distributions are supported. Let''s consider the RedHat repository option.


    Install the xCAT management server on the selected node (management or dedicated
    node). Download the xCAT-core.repo file from the download section of http://xcat.org/
    and place it in the /etc/yum.repos directory. Now run the command and respond
    affirmatively to all prompts. After installation, the /opt/xcat directory should
    appear, where all the necessary programs are located.


    You can now either re-login or run the command source /etc/profile.d/xcat.sh,
    and we are ready to work with xCAT.


    xCAT changes NFS, DHCP, and TFTP settings without preserving the original settings.
    Save your settings, if any, before executing xCAT commands.


    # # Architecture and Commands


    xCAT stores data about all objects in a specialized database. The tabdump, tabedit,
    and tabstore commands are used to view, modify, or replace data in, respectively.
    To maintain data integrity with complex objects, the commands lsdef, mkdef, rmdef,
    and chdef commands are often used to view, create, delete, and modify data, respectively.


    Based on data from the xCAT database, it creates configuration files for NFS,
    TFTP, DNS, and DHCP. Be careful, old configuration files will be overwritten.
    Updates do not occur automatically, but only by the corresponding command.


    When a node listed in the xCAT database is powered on, it attempts to perform
    a network boot (except in certain cases) and the DHCP server offers it a special
    bootloader via TFTP, which in turn performs the download or installation of the
    desired image. If the network is divided into several segments, a subordinate
    xCAT server with its own DHCP and TFTP servers can be installed in each segment.
    The xCAT includes many service commands, including those for node power management
    via IPMI and mass execution of commands, similar to pdsh.


