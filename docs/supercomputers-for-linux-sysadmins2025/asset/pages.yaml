    SNMPv2-MIB:sysUpTime.5 = Timeticks: (5) 00:00:00.05

    ```


    As you can see, the command returned a set of values with the names. Let''s see
    how to configure the SNMP server on the server. With its help, we will be able
    to remotely receive data about the server operation. Run the snmpconf program.
    The program will ask what it needs to read configuration files and file to generate.
    Select snmpd.conf (usually item 1).'
