- img_proc: true
  md: '# CHAPTER 7 UNIX AND LINUX – THE BASICS


    The title speaks for itself. The book contains many situations in which any system
    administrator finds himself and practical advice on how to get out of them with
    minimal losses.


    This chapter does not pretend to be a textbook on UNIX, but I have tried to collect
    in all the basic concepts that you will need to know later. The vast majority
    of supercomputers today use a UNIX-like operating system. I say “UNIX-like” because
    the legendary UNIX OS in its pure form is not developed and practically not used
    nowadays.


    Brief historical background. After the breakup of AT&T, which developed the operating
    system, the UNIX trademark and the rights to the original source code changed
    several times, most notably for a long time they belonged to Novell. In 1993,
    Novell transferred the rights to the trademark and to certify the software compliance
    with this mark to the X/Open consortium, which then merged with the Open Software
    Foundation and is now called “The Open Group.” This consortium develops open standards
    for operating systems, such as POSIX (now renamed the Single UNIX Specification).


    According to The Open Group, only operating systems certified to the Single UNIX
    Specification can bear the name “UNIX.” Currently, numerous operating systems
    have passed different versions of this certification, e.g., Solaris, AIX.


    Even those operating systems that have not passed UNIX certification (e.g., Linux)
    try to comply with these standards. This is why the architecture of applications
    on these OSes is very similar, and porting an application from one OS to another
    is easy, especially if only standard libraries and functions were used to write
    the program.


    It is qualities and the immense popularity of UNIX in the past, as well as its
    well-established successors – Solaris, OpenBSD, FreeBSD, AIX, and, of course,
    Linux – that have given UNIX-like leadership on servers around the world.


    Computing clusters and supercomputers are no exception. The de facto standard
    is Linux. It is this operating system that we will focus on. Although there are
    many installations on other operating systems, such as Windows, FreeBSD, Solaris,
    and others, we will not dwell on their peculiarities in the HPC class in this
    book.'
