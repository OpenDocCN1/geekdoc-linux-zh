- img_proc: true
  md: 'These commands will correct or create data on the current usage of the file
    system by users and groups. You cannot run the command while users are working,
    because the data obtained will be incorrect. To avoid this situation, it is better
    to run the command with the -M switch, then it will set the file system to read-only
    mode before checking. It is recommended to reboot into single-user mode with the
    command systemctl isolate rescue; to stop all running services.


    Linux supports so-called soft and hard quotas. When a user or a group reaches
    a hard quota, disk space allocation is stopped and the corresponding system calls
    (write, seek, etc.) are terminated with an error in the user''s applications.
    When a soft quota is reached, the user is allowed to continue using the resource
    for some fixed time (of course, if the hard quota is not exceeded). After the
    specified time, the soft quota continues to be exceeded, disk space allocation
    stops.


    Once the data has been created, the quotaon, quotaoff, setquota, repquota, and
    edquota commands can be used. The quotaon and quotaoff commands turn quota on
    and off, respectively. As an argument, they take the path to the mounted file
    system or the -a switch, which means all file systems for which the quota option
    is specified in the /etc/f file.


    > On systems with systemV-style init - init 1'
