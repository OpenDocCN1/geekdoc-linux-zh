    # Cluster Shell


    Another package, to run commands in parallel on many nodes and copy files, is
    cluster shell. It is written in python and often is available as a system package,
    but can be installed as a python module:


    ```

    pip install --user ClusterShell

    ```


    The command to run something on many nodes is clush. Here is an example:


    ```

    clush -w node-[01-10] uname -a

    ```


    -w specifies the list of nodes, and after all switches and options, the remote
    command comes, so -a in this case won''t be treated as a clush switch. You can
    put the remote command in quotes if needed, e.g., in this case, we want grep to
    be executed on the remote nodes:


    ```

    clush -w node-[01-10] ''ps aux | grep foo''

    ```'
