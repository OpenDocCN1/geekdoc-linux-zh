  md: '# CHAPTER 6


    # How a Supercomputer Doeses the Job


    Which software stack is necessary to make a supercomputer alive? Let''s try to
    look at this stack:


    +   - Operating system

    - The system software, which is required for hardware operation – drivers, etc.,
    as well as software for the network file system

    - Overall system control software (boot, images, etc.), remote software, monitoring

    - Task control system (queuing system, batch system)

    - Applied software – software required for parallel programs, like parallel packages
    and libraries, e.g., MPI, CUDA, etc.


    An optional, but frequently required, component is compilers and additional libraries
    often required for compute programs, such as BLAS, FFT, etc. If your users are
    developers, or you plan to use applications, which require compilation (e.g.,
    VASP, NAMD, etc.), this is really needed, because compilation on the target architecture
    usually turns on all needed optimizations, which maximizes performance, and makes
    the installation easier.


    For complete management of the supercomputer, you will also need software for
    backup, alerting, statistics, and visualization of the supercomputer state.'
