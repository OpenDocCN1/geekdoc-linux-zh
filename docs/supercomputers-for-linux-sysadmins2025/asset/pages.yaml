  md: '# CHAPTER 7 UNIX AND LINUX – THE BASICS


    If it is necessary to send a packet over the network to the address x.y.z.q, the
    kernel will sequentially check this address against the table: a mask (genmask)
    will be applied to the address and the destination field, and if it matches, the
    packet will be forwarded to the gateway via the network interface. Masking is
    done by a bitwise operation, i.e., all bits in the mask will also be zero in the
    result, and the bits set to 1 in the mask will result in the same as the original
    address.


    It follows that the 0.0.0.0 specifies a route that will always work, since the
    result of its application will always be 0.0.0.0. Such a route is often referred
    to as the default. In our example, network 9.10.11.* is accessible through eth1,
    network 10.*.*.* is accessible through interface eth0 (this is the internal network),
    and all other packets are routed to router 9.10.11.1, which is accessible through
    interface eth1.


    You can also add and delete routes with the route command. To add a route to a
    network,


    ```

    route -net 1.2.3.0 netmask 255.255.255.255 gw 1.2.3.1 dev eth

    ```


    Here we added a route for network 1.2.3.\* on interface eth0:


    ```

    route add default 1.2.3.4

    ```


    This command is a shortened version of the command


    ```

    route add -net 0.0.0.0 0.0.0.0 gw 1.2.3.4

    ```


    The interface is determined automatically by the router (gw) is accessible through
    other rules. If we replace ''add'' with ''del'' in the previous commands, we get
    the command to delete a route. When deleting, you must also specify all parameters:
    netmask, gw, dev, even if they are obvious; otherwise, the command may not work.

    Theconfig command controls the operation of a network interface. Without arguments,
