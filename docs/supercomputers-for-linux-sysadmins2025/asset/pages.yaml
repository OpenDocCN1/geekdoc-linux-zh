    # LDAP


    The purpose of LDAP (Lightweight Directory Access Protocol) is to provide a universal
    way to access structured data.


    The protocol defines so-called schemes that specify what kind of data, with what
    structure and of what type, can be stored and received by the user, e.g., data
    about an organization (its name, address, etc.), a user (his login, password,
    password validity time, etc.), a computer, and much more. Most of the schemes
    are standard, so different client programs can retrieve the information without
    problems.


    There are many LDAP server implementations, both commercial and free. The well-known
    Microsoft Active Directory product is actually an LDAP server with a set of extensions.
    As you can see from the description, the idea is very similar to NIS+, but


