  md: '# CHAPTER 4 SUPERCOMPUTER HARDWARE


    ![](img/bf80ee52d79fecfa3ce237b9e3fd3292_62_0.png)


    **Figure 4-6.** NUMA architecture


    Another “roadblock” in modern multicore systems is the migration of processes
    between cores. In general, to organize the work of multiple processes, the operating
    system gives each process a certain period of time (usually milliseconds), after
    the process is switched to passive mode.


    The task scheduler, when moving a process out of passive mode, selects a CPU core
    that is not necessarily the same as the one on which the process was running before.
    It often happens that a process “walks” on all the cores available in the system.
    Even in the case of SMP systems, and in NUMA systems, the influence of the speed
    of program operation at such migration is noticeable, and it leads to large delays
    at memory access.


    In order to get rid of the parasitic influence of process migration between cores,
    processor affinity (processor pinning) is used. Binding can be performed either
    to a single core or to several cores or even to one or more NUMA nodes. With pinning,
    process migration will either occur in a controlled manner or will be eliminated
    altogether. Most implementations of MPI (see later) can set pinning for you.


    A similar problem is present in the mechanism of memory allocation to user processes.
    Suppose a process running on one NUMA node needs to allocate additional memory
    for its work. In what memory area will the block be allocated? What if it falls
    on a remote NUMA node, which will sharply reduce the speed of exchange? In order
    to avoid memory allocation on third-party nodes, there is a mechanism of binding
    processes to the memory of a certain NUMA node (memory affinity).


    In a normal case, each process of a parallel program is bound to certain NUMA
    node by both core and memory. The parallel program’s speed will not depend on
    the launch and will be rather stable. When launching parallel programs, binding'
