- img_proc: true
  md: '# CHAPTER 8 UNIX AND LINUX – WORKING TECHNIQUES


    This is what a special udev service does. It filters events in /sys and creates
    deletes device files according to a set of rules. In addition, it can do other
    operations, but it is better not to get carried away with such tricks. The udev
    rules can be located in different places, usually /lib/udev/rules.d/. Do not change
    the rules located there, but create your own in /etc/udev/rules.d.


    Each rule consists of a sequence of “matches” and “assignments,” all listed comma-separated
    on a single line. At least one match and assignment must be specified. The matches
    specify the condition that the event must satisfy. If more than one match is specified,
    all listed matches must match. Assignment always looks like assigning a value
    to a variable, but in reality, it can also assign an option. For example:


    ```

    KERNEL="loop*, NAME="loop/%n", SYMLINK="%k"

    ```


    This rule will work when a device named ''loop0'', ''loop1'', etc., appears. It
    will create a /dev/loop/N device and a /dev/loopN reference to it.


    The match will be of the form NAME == VAL or NAME != VAL, WHERE NAME is one of
    the options from Table 8-1.


    | Table 8-1. Some names for match rules in udev |

    | Name | Meaning |

    | --- | --- |

    | ACTION | Event name – add or remove |

    | KERNEL | Kernel device name |

    | SUBSYSTEM | Subsystem name |

    | DRIVER | Driver name |

    | TEST[file] | Permissions on file (file) |

    | ATTR(name) | File “name” in the appropriate /sys branch |

    | ENV{name} | Device name property |

    | PROGRAM | Run the program |

    | RESULT | Execution result |


    Other names are also possible – see the documentation for details. In the right
    part of comparisons, you can specify shell-style substitutions: *, ?, and [].'
