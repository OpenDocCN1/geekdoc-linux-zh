- img_proc: true
  md: "$ideal_load is the normal load level of the node.\n\n$max_load is the level\
    \ of maximum load node.\n\nAll configuration files are identical on all compute\
    \ nodes, so they can be created once and copied to all nodes.\n\nFor most batch\
    \ systems, including Torque, this problem is typical: when executing a parallel\
    \ program, the head process terminates for some reason, while processes on other\
    \ nodes continue executing, often consuming resources. At the same time, the status\
    \ free is set for these nodes, and they are considered ready to receive the next\
    \ task. In Torque, this can be dealt with the so-called \"epilogue\": when any\
    \ task on the head node is finished, the pbs server automatically launches the\
    \ epilogue executable file located in the mom server working directory /var/spool/PBS/mom_priv.\n\
    \nBy default this script simply not exist, and no clear sample is offered either.\
    \ Below is an example of a epilogue script that cleans the remaining application\
    \ processes and cleans the file system:\n\n```\n#!/usr/bin/env bash\nJOBID=$1\n\
    USER=$2\n########## Get the list of task nodes ############\nif test -r \"/var/spool/PBS/aux/$1\"\
    ; then\n  PBS_NODEFILE=\"/var/spool/PBS/aux/$1\"\n\n# Perform cleanup on each\
    \ node of the task\nfor node in $PBS_NODEFILE; do\n  ssh -o ConnectTimeout=5 $node\
    \ \\\n  pkill -KILL -u $USER; \\\n  find /tmp -user $USER -exec rm \\{} \\; >&dev/null\n\
    done\n```\n\nThe script is designed so that only one user task is executed on\
    \ one node. Otherwise, when one task is finished, other tasks will be deleted\
    \ as well."
