    Environment variables are set for all running processes (they can be changed via
    the Environment and EnvironmentFile options):


    +   $PATH is forcibly reset to /usr/local/usr/local/bin:/usr/sbin:/bin:/bin.

    $LANG is the locale from locale.conf or kernel.

    $USER, $LOGNAME – Username.

    $HOME is the home directory.

    $SHELL – Login shell.

    $INVOCATION_ID is a string with a hexadecimal representation of a 128-bit number
    unique to each unit run.

    $XDG_RUNTIME_DIR is the directory to save the state.

    $XDG_SESSION_ID, $XDG_SEAT, $XDG_VTNR – Session, login, and virtual identifiers.

    $MAINPID – PID of the head process, if known, is passed to processes started via
    ExecReload= etc.

    $TERM – Terminal type (only for units connected to the terminal).

    $SERVICE_RESULT for service type, passed to processes via ExecStop= and ExecStopPost=,
    the value reflects the service termination status:

    * success – The service was completed successfully.

    * protocol – The service did not perform the necessary steps at startup.

    * timeout – One of the startup steps has timed out.

    * exit-code – The service has terminated with a nonzero status; the start code
    is passed to $EXIT_CODE.

    * signal – The service was terminated by sending a signal without saving the core
    file.

    * core-dump – The service was terminated abnormally by sending a signal with saving
    the core file.


