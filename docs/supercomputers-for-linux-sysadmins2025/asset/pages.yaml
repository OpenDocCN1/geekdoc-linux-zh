  md: '# Templates


    The standard shell in UNIX is a very powerful tool and, in addition to running
    commands, has a lot of features that will simplify work in the console. The simplest
    tool is file name templates. For example, writing the command `ls *.c` will list
    all files with the extension `.c` in the current directory.


    It is important to realize that *.c` is not a single argument, the shell itself
    will substitute the desired list indent. If there are only two files in the directory,
    1.c and 2.c, the command `ls 1.c 2.c`. If there is no file with a name matching
    the template, the template itself will be substituted (i.e., the `ls *.c` will
    be expanded to `ls 1.c 2.c).


    **Table 7-7.** Templates in shell


    | Template | Meaning |

    | --- | --- |

    | * | Matches any string (except ''*'') at the beginning of the name |

    | ? | Matches any character (except ''*'') at the beginning of the name |

    | [c1- c2] | Any character from the range c1..c2 |

    | ![c1-c2] | Any character other than the specified range (bash/zsh only) |

    | {a,b,c} | Exact list of words, comma separated (only in bash/zsh) |

    | {10..20} | Sequence of numbers from 10 to 20 inclusive |


    All templates except ''{}'' apply to the actual list of files and select only
    that fall under the template. Using ''{}'' brackets, you can construct more complex
    templates (see Table 7-7).


    For example, `ls *.{cx,h,la}` will turn into `ls *.cx *.h *.la`. A more interesting
    trick is `*cp config,{bak}`, which will turn into cp config config,bak. The second
    file does not exist; the template explicitly sets it.


    If a template is specified by `*`; ? or ''{}''; no file falls under it, the template
    itself will be passed to the command. For example, if a directory is empty, and
    the `ls *.abc` command in it, the command `ls *.abc` will be executed, i.e., the
    template text will be given to the command as an argument. Be careful with accidentally
    or deliberately created files starting with dashes, as their names may be taken
    by the command as name of the command''s control key after the template is expanded!'
