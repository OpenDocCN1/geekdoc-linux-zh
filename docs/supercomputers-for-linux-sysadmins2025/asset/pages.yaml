  md: '# CHAPTER 7 UNIX AND LINUX – THE BASICS


    As we can create virtual networks (vlans), most switches use STP for each vlan
    and the non-vlan network. If we need to pass more data, than one link allows,
    we can make several parallel links, all of them one will be disabled by STP. To
    fix that, switches allow declaring virtual links, combining many parallel physical
    links – aggregation. There are various standards, e.g., IEEE 802.1AX, LACP, and
    others, so not all switches, even made by one producer, can “understand” each
    other.


    “If it is so restrictive, maybe I just disable it?” – you may win. Times it is
    not so bad idea, but only in cases, when your subset is simple, and you have strong
    control on it. If you don’t use Ethernet network as a computer network, I’d recommend
    keep it enabled.


