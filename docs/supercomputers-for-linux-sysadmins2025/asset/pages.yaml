    \ will be performed, only new or modified files will be stored in the archives.\
    \ To perform full archiving, you should set the --level=0 option or delete the\
    \ /var/log/usr.snar file:\n\n```\ntar --create \\\n  --file=archive.1.tar \\\n\
    \  --listed-incremental=/var/log/usr.snar \\\n  --level=0 \\\n  /usr\n```\n\n\
    Please note: compression is not supported when creating incremental archives.\n\
    Besides tar, there are other classic tools for creating archives - cpio and pax.\
    \ cpio is not designed to work with tapes and, unlike tar, cannot get file lists\
