- img_proc: true
  md: '# CHAPTER 15


    # Slurm


    Slurm Workload Manager, formerly called "Simple Linux Utility for Resource Management,"
    is a freely distributed resource manager for supercomputers. It is written in
    C and was built entirely from scratch by coalition of Lawrence Livermore National
    Laboratory, SchedMD, Linux NetworkX, Hewlett-Packard, and Groupe Bull. SchedMD
    is currently providing primary development and commercial support for this project.


    Slurm is designed to be extensible and modular. In practice, there are very few
    additional (not included in the distribution) modules, primarily because the interfaces
    of modules are not always well-thought-out. That''s why you often have to use
    internal Slurm functions and structures to implement a module that extends functionality.
    Many standard modules do exactly that. This approach makes modules intolerable
    data formats and frequencies frequently change from version to version. Nevertheless,
    Slurm has a lot of plug-ins available by default or which you can compile/install
    in addition. They give you a lot of flexibility, but remember to turn off needed
    and not needed others.


    I specially use SPANK plug-ins, which have fixed API, are so portable between
    Slurm versions. Also job_submit plug-ins have fixed API and reach functionality.
    Moreover, there is a possibility to use LUA for writing such plug-ins, which makes
    some tasks much easier to implement. I won''t stop on them, but the official doc
    is really good. Also, you can check the git repository https://github.com/zhum/hpc-book-materials
    for some useful scripts (and contribute!).


    The basic Slurm modules give good flexibility and wide capabilities, so they are
    sufficient for most cases. Most Linux distributions include ready-made packages
    for Slurm.


    The manager architecture is similar to Torque. The main process slurmctl runs
    on one or more servers (this provides fault tolerance). This daemon compute nodes,
    task accounting, resource scheduling. Optionally, the slurmmd process can be run,
    which writes task, user, etc., credentials to a database and can analyze resource
    usage. The same database stores an extended set of restrictions for users, which
    are not available without slurmmd.'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# CHAPTER 15 SLURM


    The slurmd agent runs on compute nodes, and slurmctld determines the state of
    the node based on its operability. The same agent is used to launch applications,
    but the slurmstepd process is started beforehand, which launches and further controls
    the application.


    Launching an application in Slurm happens in stages. First, on the nodes allocated
    by the scheduler, agents execute "prologue" scripts that prepare a node for launching.
    Then, on the first of these nodes, the script that the user queued is run. The
    script can get a list of all the allocated nodes and, e.g., run something on them
    with the ssh command. But it is more correct to execute the srun command, which
    will run what it was asked to run on all the nodes allocated to the task, with
    the slurmstepd process controlling the running processes. After the task is finished,
    the agents run the "epilogue" scripts and the task is finished. As noted above,
    only scripts can be queued, and Slurm will generate an error if you try to queue
    a binary file.


    Unlike Torque, Slurm configuration is stored in a file. If a database is used,
    Slurm stores statistics and additional settings in it, such as the number of simultaneously
    running tasks of one user, the number of tasks in the queue of one user, etc.
    The runtime data, which should be saved between Slurm controller restarts, is
    stored in a set of files, located in the directory provided by StateSaveLocation
    option in the config file.


    Important additional service required for Slurm is munge - it "confirms" which
    user sent the request to the controller and agents. munge servers on all nodes
    (compute, controller, submit, etc.) should share the same certificate, and all
    nodes should have synchronized time.


    # ## Slurm Installation


    Before installation, make sure that the compute and control nodes have synchronized
    credentials (passwd/ldap), time (ntp), and the munge package installed and running.
    latter is available in the repositories of almost all distributions and serves
    for authentication of remote requests; without it, Slurm will not work. I recommend
    creating a Slurm user on the control node to prevent the main daemon from running
    as a superuser.


    Most distributions have Slurm packages, but they are often pretty old not updated
    for a long time. You can install them if you want. On compute nodes and Slurm
    control nodes, we put packages: slurm and slurm-munge; if desired, we add slurm-perlapi
    and slurm-torque (for compatibility with torque-scripts). On the


    206'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'controller node, we have to even install slurm-slurmctld and slurm-plugins
    packages, optionally (but recommended) slurm-plugins, and on compute nodes slurm-runmd.
    On the node with database (used), we install MySQL/MariaDB and slurm packages,
    slurm-munge, slurm-slurmdbd, slurm-sql, and if desired slurm-plugins. Of course,
    the actual names may vary in different distributions.


    In the Slurm versions starting from 23.11, there is a slurm-sock package, containing
    internal plug-if for authentication as an alternative to munge; see the documentation
    if you want to use it.


    If you need a fresh Slurm version, you can compile it from source code and even
    build packages, which is pretty convenient. To do this, download the latest version
    from schedmd.com or from https://github.com/SchedMD/slurm repository. Unpack the
    archive, navigate to the created directory, checkout the desired version by tag,
    e.g. slurm-24-11-5-1, and execute the commands:


    ```

    ./configure --prefix=/opt/slurm

    make

    make install

    ```


    You can do it even easier - build rpm- or deb-packages by yourself; just run rpmbuild
    -ta slurm-XX.YY.Z.tar.bz2


    or

    mk-build-deps -i debian/control

    debuild -b -uc -us


    Don''t forget the devel packages for mysql/mariadb if you plan to use accounting
    and all prerequisite devel packages. If you don''t have any installed slurm config
    file, you can generate a simple one at https://slurm.schedmd.com/sched_config.html.


    # Accounting


    All (almost) information about the user jobs, like submit time, start and end
    time, requested and actual resources, user login, etc., may be stored in the database
    and used for traditional accounting and for dynamic priority changing. Also without
    accounting, many things won''t work, like QOS, multifactor priority, FairShare,
    and some others.'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# CHAPTER 15 SLURM


    If you use accounting, each user should be a member of at least one “account”
    – a group of users. Accounts can be nested and intersected, and each account can
    be associated with its own parameters and limits.


    Slurm has two main commands for working with accounts: sacct for viewing statistics
    and sacctmgr for managing accounts and associations. An association is a relationship
    of four parameters user, cluster, partition, and account, where user is the user
    login, cluster is the cluster name, partition is the cluster partition, and account
    is the account name. First, you need to create a cluster with the sacctmgr create
    cluster mycluster command.


    You can create an account with the command:


    ```

    sacctmgr create account name=first

    ```


    You can create an association with the command:


    ```

    sacctmgr create user name=user1 cluster=mycluster \

    account=first partition=def matasks=2 maxwall=60:00

    ```


    Here, for login user1, we have created an association with cluster mycluster,
    partition=def, and account first. Within this association, the user will be able
    to run no more than two tasks at a time, and the maximum time a task can run is
    limited to one hour. A user can log in to multiple accounts through different
    associations, in which case you can explicitly specify the account with the -A
    switch of the sbatch or srun commands.


    You can change the association like this:


    ```

    sacctmgr modify user name=user1 partition=def set \

    MaxSubmit=10

    ```


    Here we set records with the parameter (all records that fall under the condition
    will be changed) and changes with the set parameter. As a result, the maximum
    number of tasks in the queue for user1 in all accounts and on all clusters the
    def partition will be limited to 10.


    To view the current associations, you can command:


    ```

    sacctmgr list assoc

    ```


    or


    ```

    sacctmgr list assoc user=user1

    ```'
