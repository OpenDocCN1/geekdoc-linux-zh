  md: '# About the Author


    ![](img/bf80ee52d79fecfa3ce237b9e3fd3292_14_0.png)


    Sergey Zhumatiy has been managing supercomputers since 1999, starting out with
    building and managing HPC clusters at Moscow State University, and holds a PhD
    in Computer Science. Several supercomputers under his supervision, like Chebyshev,
    Lomonosov, and Lomonosov-2, achieved top rankings in the top 500 supercomputers
    list and dominated the Russian top 50 supercomputers list. Now he works as an
    HPC architect and SysAdmin at NVIDIA.'
  merge: -1
