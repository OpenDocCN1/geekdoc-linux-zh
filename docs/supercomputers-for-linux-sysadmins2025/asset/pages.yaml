- img_proc: true
  md: 'There are several ways to solve this problem. In our experience, the best way
    is to use PAM modules that either integrate with the task management system themselves
    or the management system itself sets the necessary rights in the prologue and
    epilogue¹ of the task, e.g., via the pam_listfile module. Some systems, e.g.,
    SLURM, provide special PAM module, which controls user access.


    # Brief Summary


    The job management system is one of the most important parts of your HPC cluster.
    Choose it wisely, know it well, and use it smart. How the task management system
    is configured directly affects whole cluster efficiency. Different scheduler settings
    can change the average waiting time of tasks in the queue and node idle time by
    times. Don’t forget about statistics: only with its help you will be able to understand
    how efficiently your supercomputer works, what the real demand for it is, and
    whether there is a need for expansion or modernization.


    # Search Keywords


    batch system, resource management systems, SLURM, PBS, LSF, Moab, Grid Engine
    Scheduler


    > ¹ Prologue and epilogue are usually the names of the scripts called by the resource
    management system before and after the task is started, respectively.'
