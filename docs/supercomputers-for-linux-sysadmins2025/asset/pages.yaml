    This specifies the two ntp servers will synchronize with, as well as the IP address
    of the interface from which clients can connect. For the client, the listen string
    is simply not specified.


    The last line specifies restrictions for the clients:


    +   - kod – "Kiss-of-death," special packet, sent to the client to reduce unwanted
    queries.

    - modifyf restricts remote configuration updates.

    - notrap turns off protocol traps support.

    - nopeer prevents a peer association being formed (peers are clients and servers
    for each other).

    - noquery option prevents nptq and ntpdc queries, but allow time queries.


    If you server IPv6 interfaces, copy "restrict line" and add a -6 option. If you
    want to limit the IP addresses, allowed to request, you can replace "default"
    keyword by, e.g., 192.168.2.0 mask 255.255.255.0.


