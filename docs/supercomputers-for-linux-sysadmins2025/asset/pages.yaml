    # Lm_sensors/Hwmon


    Yes, I know that this information can be collected by the collectors from the
    previous subchapter. But I want to show you how to get some low-level information
    if you haven''t installed the collector yet. lm_sensors and hwmon packages collect
    information from the low-level sensors, like temperature, voltage, and fan speeds.
    Hwmon is not so common, and I will show you some examples with lm sensors only.


    In the Linux environment, the standard for working with sensors is the lm_sensors
    package, which includes kernel modules for interacting with sensors (most of them
    are already shipped with the kernel), the libsensors library, and a set of basic
    user utilities for reading data and outputting the read information. This project
    does not work on creating graphical interfaces for colorful presentation of information,
    but independent developers have created many utilities and plug-ins based on the
    libsensors library to display information in graphical form.


    Unfortunately, for the long history of microprocessor technology development,
    there are no unpaid standards for sensors and their connection to electronic devices;
    on the contrary, their variety is increasing every year. In this regard, the lm_sensors
    package is constantly updated to expand the range of supported devices. Currently,
    it supports more than 150 different sensors, including:


    +   3https://pcp.io/

    4https://github.com/TACC/tacc_stats'
