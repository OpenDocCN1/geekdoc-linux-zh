    +   2. Set the file system to read only or unmount:


    mount -o remount,ro /dev/sda6


    or

    umount /export


    +   3. Create a quota database:

    quotacheck -vugc /dev/sda6


    +   4. Remount the file system with the new options:

    umount /dev/sda6

    mount /dev/sda6


    +   5. Enable quota on the file system:


    quotaon -va


    This is usually done automatically in startup scripts.


    +   6. Set quotas for users:


    edquota username


    You can use any existing user or group as a reference to set quota for other users/groups
    - use -p option. In this example, we copy quotas on all file systems from user
    foo bar:


    ```

    setquota -p foo -u bar -a

    ```'
