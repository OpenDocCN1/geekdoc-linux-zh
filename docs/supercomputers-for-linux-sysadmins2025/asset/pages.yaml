- img_proc: true
  md: '# CHAPTER 28 ONE-TWO-THREE INSTRUCTIONS


    Section "ServerFlags"

    Option "AllowMouseOpenFail" "on"

    Option "ZapWarning" "on"

    EndSection


    The Files sections contain the paths to files that are necessary for the X server
    to function properly. For example, the paths to the X server fonts are specified
    here. Fonts can be located not only on the local computer, but also on a remote
    computer where XFS (X Font Server) is installed:


    Section "Files"

    FontPath "/usr/share/fonts/misc:unscaled"

    FontPath "/usr/share/fonts/local"

    ....

    EndSection


    The Modules section lists the modules that will be loaded by the X server at startup:


    Section "Module"

    Load "dri"

    Load "glx"

    ....

    EndSection


    There can be several InputDevice sections; they are distinguished by a unique
    identifier (Identifier). For each input device connected to the computer, an InputDevice
    section is created in the file. If a mouse and keyboard are connected, the xorg.conf
    file will have at least two sections: one to describe the keyboard and one to
    describe the mouse:


    Section "InputDevice"

    Driver "kbd"

    Identifier "Keyboard[0]"

    Option "XkbLayout" "us,ru"

    Option "XkbOptions" "grp:ctrl_shift_toggle,grp_led:scroll"

    EndSection

    Section "InputDevice"

    Driver "mouse"'
