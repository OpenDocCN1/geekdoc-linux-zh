    # Packages


    All Linux distributions have an excellent (in our opinion) system – packing software
    into so-called “packages”. There are many variants of package systems; the most
    popular rpm (RedHat, Fedora, CentOS, SuSE and others), deb (Debian, Ubuntu, Mint,
    and others), ports (Arch Linux and derivatives), ebuild (Gentoo and derivatives),
    and pkg (Slackware and derivatives).


    They all offer to store the tree of some software, such as a web server, or a
    part of it, such as an encryption module, in a single file (usually a compressed
    archive). In addition to files, a package stores metadata such as package name,
    description, and other data. The set of metadata varies from package system to
    package system, so the capabilities vary.'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# CHAPTER 7 UNIX AND LINUX – THE BASICS


    The most important features of package metadata in our opinion:


    +   - Dependencies – Specifies other packages that are required or desired to
    be installed. A function (e.g., smtp-server) may be specified instead of packages,
    if it can be obtained from the metadata.


    +   - Checksums of the files.


    +   - Specifying files are configuration files.


    Dependencies make software installation much easier, and you can quickly figure
    out which additional packages needs to be installed. Often “package managers”
    such as yum or dnf (RedHat), apt or aptitude (Debian), pacman (Arch Linux), etc.,
    take care of calculating and installing all additional packages.


    In deb format, dependencies can be specified flexibly from “required” to “desirable”
    (typically documentation and examples) to “optional”, so an interactive package
    manager like aptitude can choose the right set of optional packages. In the world
    of rpm format frequently along with a package automatically a dozen more unnecessary
    packages are installed, possibly be required with it.


    Having checksums of all files in a package, you can check the integrity of the
    system to see if any important files have changed (course, only those included
    in packages); most package systems have separate commands for this.


    Knowing the configuration files allows you not to overwrite them when upgrading–
    the new version is copied “next to” the original one, so you can check the difference.
    In the interactive aptitude mode, you can see the difference at a glance and select
    whether to use the old or the updated version. Similarly, when you uninstall a
    package, as a rule, its configuration files remain and are not overwritten by
    a new installation.


    It is usually possible to uninstall a package with its configuration files by
    specifying an additional key when uninstalling it.


    Information about packages installed on your computer is stored in a database,
    and if it gets corrupted, it is very hard to restore it. Therefore, I do not recommend
    uninstalling or installing packages on a file system that is 100% occupied, as
    this may result in loss of the database.


    Package files themselves can be simply downloaded or copied from somewhere, and
    most often repositories are used – indexed directories of packages, often available
    from the Internet. On the CD/DVD with the OS distribution disk, the package repository
    takes up almost all the space, and after installation, it will be specified in
    the settings. In addition to it, the main network repository of the OS (or several)
    will almost certainly be specified.'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# CHAPTER 7 UNIX AND LINUX – THE BASICS


    Besides the main repository, you may need additional or even third-party repositories.
    For example, the standard RedHat repository does not contain many packages, and
    it is frequently necessary to plug in third-party packages like EPEL. Some software
    projects create their own mini-repositories for their software, e.g., OFED. Sometimes
    it makes sense to create your own local repositories, e.g., for computers without
    Internet access.


    The most important yum and dnf commands and useful keys are presented in Table
    7-10.


