    Identifier "Mouse[1]"

    Option "Buttons" "9"

    Option "Device" "/dev/input/mice"

    Option "Protocol" "explorerps/2"

    Option "ZAxisMapping" "4 5"

    EndSection


    Let''s take a closer look at the options of the InputDevice section for the keyboard.

    The Driver parameter specifies the keyboard driver for graphical mode only; consoles
    and terminals are controlled by the terminal driver built into the kernel. The
    XkbLayout parameter specifies the keyboard layouts. XkbOptions sets the keys for
    switching between layouts, in this case Ctrl+Shift, and that the Scroll indicator
    on the keyboard will light up when the Russian layer is enabled.


    The second InputDevice section describes the mouse. The Option "ZAxisMapping"
    parameter "4 5" is responsible for scrolling the mouse wheel. If the numbers 4
    and 5 are swapped, the scrolling will run in the opposite direction. The Device,
    Monitor, and Screen sections describe the output devices. The Device section contains
    information about the video card and its drivers, the Monitor section describes
    the physical characteristics of the monitor, and the Screen section describes
    the screen characteristics (resolution, etc.). At least one section should be
    present in the configuration file, and if there are several devices (when several
    monitors are connected), then a corresponding section should be created for each
    device:


    Section "Device"

    Identifier "Intel Video Controller"

    Driver "i8180"

    EndSection


    Section "Monitor"

    Identifier "Universal Monitor"

    Option "DPMS"

    HorizSync 28-64

    VertRefresh 43-60

    EndSection


    Section "Screen"

    Identifier "Default Screen"

    Device "Intel Video Controller"


