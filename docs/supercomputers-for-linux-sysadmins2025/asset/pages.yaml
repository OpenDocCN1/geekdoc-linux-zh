    ```

    1 #key,value,comments,disable

    2 "domain", "mycluster",,\,

    3 "instaldir", "/install",,\,

    4 "ipmiretries", "3", "3",,\,

    5 "ipmitimeout", "2", "2",,\,

    6 "master", "10.0.5.1",,\,

    7 "forwarders", "8.8.8.8,4.4.4.4",,\,

    8 "nameserver", "10.0.5.1",,\,

    9 "Syncdfiledir", "/var/xcat/syncfiles",,\,

    10 "nodesyncfiledir", "/var/xcat/node/syncfiles",,\,

    11 "ftptdir", "/ftboot",,\,

    12 "xcatconf", "/etc/xcat",,\,

    13 "timezone", "Europe/London",,\,

    ```


    The structure is quite simple: the first line contains a list of fields, of which
    the first two – key and value – are the most interesting. Line 2 specifies the
    common domain name; lines 3, 9, 10, 11, and 12 are directories with key files;
    lines 4 and 5 specify IPMI parameters; line 6 is the address of the xCAT head
    server; and lines 7 and 8 are addresses of external and internal DNS servers.
    Line 13 specifies the time zone; most likely, it will need to be changed to the
    one you need.


    The same information can be obtained with the command lsdef -t site -1, but the
    presentation will be more concise:


    ```

    Object name: clustersite

    domain=mycluster

    forwarders=8.8.8.8,4.4.4.4

    instaldir=/install

    ipmiretries=3

    ipmitimeout=2

