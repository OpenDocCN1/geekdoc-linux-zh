  md: '# CHAPTER 7 UNIX AND LINUX – THE BASICS


    As you can see, the rule remains, but write privileges are restricted by the mask.

    Another useful property of ACL is rule inheritance. You can set ACL "default"
    on a directory, they may not be the same as ACL on the directory itself, and they
    will be automatically applied to all files and directories created.


    I suggest you read more about Linux permissions and the options of the above commands;
    we have touched on them only a bit.


    # Concept of Service, Key Services


    I have used the terms "service" and "daemon" many times above. They all mean the
    same thing: a process or a group of processes that run continuously or are automatically
    started on demand. Their task is to serve requests from users, other processes,
    and other computers on the network. For example, the apache web server is a service
    that serves requests using the http protocol. SMTP-server is responsible for requests
    to transfer mail messages, etc.


    Some services are launched via the "super daemon" inetd or its newer implementation,
    xinetd. In this case, the inetd/xinetd configuration file describes the required
    services: the start command, on which port to listen, on behalf of which user
    to start, etc. After launching, inetd/xinetd starts listening on the specified
    ports and upon receiving a request launches the corresponding command, which directs
    the established network connection to the standard input stream. This principle
    makes it easier to write the service and also allows for more flexible access
    policy customization. For example, xinetd allows you to specify the range of addresses
    from which access is allowed, the maximum number of simultaneous requests to the
    service, etc.


    To find out if a particular service is running, you can check if the corresponding
    process is running (except for services started via inetd/xinetd), if any process
    is listening to the required port (if the service is bound to a port) with the
    ss -ldap command (socket stats).


    Basic (but not all) services for the cluster are presented in Table 7-3.'
