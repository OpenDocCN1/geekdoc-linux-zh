    +   - max_rpc_cnt=N (for large number of jobs) increase max number of slurm node
    threads, 256 by default


    +   - defer - Do not try to schedule each job, do it together with all once in
    a period of time (for LONG queues)


    +   - sall_wait_nodes / sbatch_wait_nodes - Start the job only when all nodes
