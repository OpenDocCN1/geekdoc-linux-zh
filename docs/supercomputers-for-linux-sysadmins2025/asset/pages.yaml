    In addition, make sure that you enabled SelectType=select/cons_tres in the config
    file. Also, refer to the docs about SelectTypeParameters, because it defines resources
    are consumable and are taking in account in scheduling at first. For example,
    you can track CPUs or CPU cores.


    # Backfill and Preemption


    Pretty common situation is when the next job in the queue has not enough free
    resources and cannot be started, but there are some free resources. To reduce
    the resource waste in such situation, there is a backfill algorithm. It scans
    the queue back and looks for small jobs, which can be started right now, and the
    estimated start time of the first job in the queue won''t increase (or increase
    not so much).


    To enable this algorithm, set SchedulerType=sched/backfill in the config file.
    Some parameters of the algorithm can be tuned via SchedulerParameters; they usually
    have bf_ prefix. See most important options in the “Advanced Parameters for slurm
    conf” subchapter below.


    216'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# CHAPTER 15 SLURM


    In Slurm, jobs can be preempted by other jobs in several ways. The preempted job
    can be stopped, canceled, requeued, or started to share time slots with the other
    job with a low priority (“gang scheduling”) – I don’t recommend using it in HPC
    and will not stop on this option. Preemption happens, e.g., if you have two partitions
    sharing the same nodes, but one of them has PriorityTier higher than other. If
    all nodes are occupied by jobs, and new job comes from the high-priority partition,
    it can preempt a running job, belonging to the low-priority partition.


    To use or not use preemption in Slurm, you need to specify some parameters in
    the slurm.conf: PreemptType – plug-in name, which chooses the jobs, should be
    preempted. It can be preempt/none – to disable preemption, preempt/partition_prio
    – to use PriorityTier, like in the example above, and preempt/qos – use QoS in
    addition to PriorityTier. Also, you have to specify PreemptMode, to set how the
    jobs will be preempted. Possible values are


    +   - OFF - Disable job preemption and gang scheduling (default). PreemptType
    should be preempted/none.


    +   - CANCEL - The preempted job will be canceled.


    +   - GANG - Enable gang scheduling.


    +   - REQUEUE - Cancel the job and requeue, --requeue batch option was set or
    if JobRequeue parameter in slurm.conf was set to 1.


    +   - SUSPEND - The job will be stopped and then resumed after the high-priority
    job finishes, requires gang scheduling to be turned on.


    Preemption is a tricky option; I recommend using it only for partitions, where
    job interruption is not critical, if you have such. Your users should be well-informed
    of the behavior to exclude any surprises.


    # QoS and Limits


    QoS or quality of service is the most inappropriate title in Slurm. Actually,
    it is a named limit, which can be associated with user, partition, account, and
    can be attached to a job automatically or manually. Except of limits, QoS can
    specify priority or preemption. If QoS is associated with a partition, it will
    override others by default, but if you create a QoS with Flags=OverPartQoS, it
    will override partition QoS.


    217'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# CHAPTER 15 SLURM


    As QoS can set some limits, there is the order, to determine which limit definition
    will be enforced:


    +   1. Partition QOS limit (if OverPartQOS is set, goes after Job QoS)


    +   2. Job QoS limit


    +   3. User association


    +   4. Account association(s), ascending the hierarchy


    +   5. Root/cluster association


    +   6. Partition limit


    There are a lot of different limits, please check them in the docs,¹ here I will
    describe some most useful:


    +   * GrpJobs – Max jobs, allowed to run at the same time and sharing this QoS,
    e.g., if you associate it with two accounts, they could run in sum no more jobs
    than this limit.


    +   * GrpSubmitJobs – The same as above, but for jobs in queue (including running
    jobs).


    +   * GrpWall – The same as above, but for summary jobs work time.


    +   * MaxJobsPerUser – Max running jobs from one user.


    +   * MaxSubmitJobsPerAccount – Max jobs in the queue (running) from an account,
    including subaccounts.


    +   * MaxSubmitJobsPerUser – The same as above, but for user.


    +   * MaxRESPerAccount – Max TRES, which all running jobs from account can use
    at the same time.


    +   * MaxRESPerJob, MaxRESPerNode, MaxRESPerUser – Same as above, but relates
    to one job, each node, and one user, respectively.


    > ¹https://slurm.schedmd.com/resource_limits.html'
  merge: -1
