  md: '# CHAPTER 18 REMOTE USER ACCESS


    The X server can be started directly from the command line, but this method is
    very rarely used. Usually it is started as a service at system startup. In addition
    to the server, at least one client must be started for normal operation. In case
    of launching from the command line, the startx script is usually run, which in
    addition to the server starts a script that manages a set of clients. When this
    script (session) terminates, the server also terminates. The session script is
    typically located in /etc/X11/Xsession.d or in ~/.xsession.


    In the case of running X server as a service, only its client is the screen manager
    - an application that allows you to authenticate the user and launch the session
    of your choice (frequently a desktop environment manager like KDE).


    The basic linux server manager is xdm. Gnome and KDE have their own screen managers,
    gdm and kdm, and sometimes others, such as lightdm, are used. The main function
    of a screen manager is to allow the user to enter their login and password in
    graphical mode. Additional functions are selecting the input language, selecting
    a window manager or a graphical shell, and shutting down the computer without
    logging.


    The xdm manager configuration files are located in the /etc/X11/xdm/. After a
    user successfully logs in, the /etc/X11/xdm/Xsession script will run and continue
    loading the graphics system. Configuration files for gdm are located in the /etc/gdm/
    directory and for kdm (fourth version) in the /etc/kde4/kdm directory.


    If your workplace is running Windows, you will need to install X server to work
    with X clients. There are a lot of server implementations for different versions
    of MS Windows (Exceed, Xwin32, etc.), but almost all are of commercial products.


    However, there is a quality open source and free implementation of the X server.
    This is the Xming package. You can download it from the official site¹. There
    are two variants of this software on the site: xming and xming Mesa. The second
    variant allows you to run applications using OpenGL on a remote terminal. In addition
    to the X server itself, you can download additional backgrounds for it, using
    Cyrillic ones, and for program managing X server startup parameters - Xlunch.
    After installing the program on your computer, you could make a shortcut for the
    Xming program on your desktop. The program should be launched with a set of parameters:


    ```

    C:\Program Files\Xming\Xming.exe :0 -clipboard \ -multiwindow -xkblayout us,ru
    -xkbvariant winkies \ -xkboptions grp:ctrl_shift_toggle

    ```


    > ¹http://www.straightrunning.com/XmingNotes/'
