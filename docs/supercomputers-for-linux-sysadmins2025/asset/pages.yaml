  md: '# Accounting and Statistics


    If you have previously configured accounts, you can get statistics on tasks with
    the sacct command, filtering them by start/end time, accounts, logins, or partitions.
    If the taskacct_gather plug-in is enabled, you can get maximum/average CPU, memory,
    and disk utilization by individual tasks or by groups of tasks with the sstat
    command, filtering them as in sact.


    The sreport command can be used to get reports on cluster utilization. The following
    types of statistics are available:


    +   - cluster - Total utilization, can be grouped by logins and accounts.


    +   - task - Stats by task classes; class is set by the interval of number of
    cores per task, grouped by accounts.


    +   - user - Utilization by logins.


