  md: '# CHAPTER 11 USERS – ACCOUNTING MANAGEMENT


    The purpose of NIS is to distribute information over the network that must be
    identical across multiple clients, such as account data and passwords, /etc/hosts
    files, and so on. The first version of the system had fundamental security problems,
    so it was replaced by a new version, NIS+ (NIS plus). Note that despite the identical
    program names and many configuration files, NIS and NIS+ are not compatible and
    the client from one system will not work with the server of the other. Hopefully,
    there should be no NIS packages available, only NIS+.


    The NIS server is rarely used for user authentication on clusters. This is due
    to two circumstances: even NIS- is not sufficiently secure; there are reliability
    and performance issues with handling multiple RPC requests. If the number of clients
    is more than 30–40, it is likely that a single NIS server will struggle to cope
    with the load.


    On the other hand, the NIS+ subsystem has obvious attractive features such as
    simplicity and ease of administration, server redundancy, and hierarchy, so it
    is sometimes used on some small-scale cluster systems.


    Current administration consists of modifying (by any means, such as manual editing)
    source files to be translated over the network, such as swd, shadow, and group,
    and executing the make command to modify the network databases. Connecting a new
    node or an entire cluster is a matter of configuring it to a running NIS+ server.
    The initial configuration of the NIS+ server is usually performed with the help
    of special utilities, which may differ from one Linux distribution to another,
    but the actions performed by these utilities are quite standard:


    +   1) Configure NIS server components to start during the OS process. There are
    three server processes running in NIS:


    +   - ypserv is the main NIS+ server.


    +   - ypassswd is a server that monitors password modifications by users.


    +   - ypxfrd is a server that performs database synchronization by secondary NIS+
    servers.


    +   2) Open the necessary services in firewall (rpcbind, portmap, ypserv, ypassswd,
    ypxfrd).


    +   3) Create a NIS+ domain (which has nothing to do with DNS domain) - specify
    its name in a ypserv config file or start options; on the clients, put this name
    into the /etc/defaultdomain file.'
