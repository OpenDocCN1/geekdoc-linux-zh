  md: 'are available. The ssh-keygen program will ask where and with what name to
    form the private key, offering a standard passphrase. It is better not to change
    it. Then the program will ask what password (passphrase) to protect the key and
    ask you to confirm the password and generate a pair of keys. The public key will
    have the same name as the private key, but with a .pub extension. For example,
    for a standard RSA key, we will get the files ~/.ssh/id_rsa and ~/.ssh/id_rsa.pub.


    Next, copy the id_rsa.pub file to the ~/.ssh directory on the server computer.
    On the server, add the contents of id_rsa.pub to the list of allowed keys: cat
    ~/id_rsa.pub ~/.ssh/authorized_keys. Make sure that the ~/.ssh/authorized_keys
    file belong to the user and are not allowed to be written by anyone except foo.


    Now from the client computer, it is enough to execute the ssh command foo@my_server,
    confirm the addition of the public host key to known_hosts, and enter the private
    key password. To allow a user to log on to a host without a password, it is sufficient
    to generate a key pair by specifying an empty password. If the user''s directory
    is on a network drive, after that it is enough to add the public key to the same
    user''s authorized_keys.


    To ensure that the first time a user logs in, they are not asked for confirmation
    of being added to known_hosts, you can log in to all nodes in a loop using the
    command ssh -o StrictHostKeyChecking=no HOSTNAME true. This command will automatically
    put the node HOSTNAME key into known_hosts. The “true” at the end is the command
    to be executed on node name. You can specify any command, e.g., uname, and yes,
    but true is executed instantly and without display. If no command is specified
    at the end, the normal login to the remote system will be performed or the interactive
    shell will run.


    In the process, ssh intercepts a special control key combination – “Enter ~” After
    pressing this sequence, you can enter a control character command. The list of
    commands is displayed by pressing ?. The most convenient commands are


    +   - ‘~’ - Pass the ‘~’ symbol immediately

    - ‘.’ - Terminate the session immediately

    - ‘Z’ - Suspend and take the ssh process to the background

    (it can be resumed with the fg shell command)'
