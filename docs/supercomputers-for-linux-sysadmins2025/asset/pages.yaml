    systemd-analyze cat-config works line systemctl cat, but for configs, not for
    units. For example, if you put additional info into /etc/systemd/logind.conf/d/50-override.conf,
    systemd-analyze cat-config systemd/logind.conf shows you full with changes.


    When you modify or create a systemd unit, a good idea is to check if you made
    any types, or mistakes; in this case, systemd-analyze verify path-to-file can
    help. It will check the syntax, dependencies, and if referenced files and services
    exist in the system. If your file name is not in systemd format, you can specify
    alias for this unit: systemd-analyze verify .myfile:alias.service. For other useful
    commands, see the documentation.


    # Brief Summary


    Systemd today is the central system for managing services and many other aspects
    of the OS; even if you don''t use it, you have to know about its abilities and
    how it can spoil

    (or help) your life. For example, if you don''t see a cronjob, but something is
    running as a cronjob, it may be a systemd timer.


