  md: '# Table 15-5. Main control subcommands


    | Subcommand | Meaning |

    | --- | --- |

    | all | Show the partitions, their nodes, and assignments |

    | cluster NAME | Specify the cluster we are working with, followed by the following
    subcommand² |

    | create OBJECT | Create a Slurm object, see develo |

    | delete OBJECT | Delete the Slurm object |

    | show OBJECT | Show Slurm facility |

    | update OBJECT | Modify the Slurm object |

    | hold/release JOBS | Lock/unlock tasks |

    | suspend/release JOBS | Pause running tasks |


    The main objects that control works are with partition, task, node, and reservation.
    The delete subcommand works only with reservations and partitions. Block tasks
    from running on the nodes (drain the nodes):

    control update nodename=n[22,25] state=Drain reason='' badmem''


    Show the current running config:


    scontrol show config


    Reload all controllers and agents configuration:


    scontrol reconfigure


    Drain the node(s) and after the last job finishes reboots the node and set the
    state to STATE (really useful if you want to apply changes, like new image, kernel
    version, etc):\scontrol reboot asap nextstate=STATE NODE_LIST


