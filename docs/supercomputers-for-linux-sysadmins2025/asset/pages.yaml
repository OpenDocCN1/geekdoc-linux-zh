- img_proc: true
  md: '# CHAPTER 8 UNIX AND LINUX – WORKING TECHNIQUES


    Functions, implementing by modules, are divided into four groups:


    +   - Auth - Authentication/credential acquisition


    +   - Account - Account management


    +   - Password - Authentication token (e.g., password) updating


    +   - Session - Session management


    Auth identifies the user and sets the credentials (UID/GID) and also update some
    information, like last login time, set limits, etc. Account checks if this account
    is available/enabled, password allows changing password (or other auth token),
    session makes any action when user session is to start or is finished. One module
    can implement any subset of those groups. Each service PAM has its own list of
    modules, groups, and their options.


    PAM configuration file may be in “BSD-style” – one big file for all services,
    where the first word in every line is a service name, or a set of files named
    as the services. In Linux, the second approach is mostly used, and I’ll refer
    to it. The format of the line in the PAM config file is “group flag module [options]”
    where group is auth, account, password, or session; flag is required, requisite,
    optional, or a list of conditions; module is the modules; options is the module
    options. The lines are scanned by one in the same group, so the order is important.


    For each line, the mentioned module is called, and depending on the result (OK
    or FAIL) and flag, an action is taken:


    | Flag | Action |

    |---|---|

    | Required | OK=continue, FAIL=continue to process, but deny request in the end
    |

    | Requisite | OK=continue, FAIL=stop processing, and deny the request |

    | Sufficient | OK=stop processing and accept the request, FAIL=continue processing
    |

    | Optional | Ignore the result |


    Flag also can be a list in format “[value=action, ...]” where value is the value,
    returned by the module call, and action is what to do. Possible values are the
    following:'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# CHAPTER 8 UNIX AND LINUX – WORKING TECHNIQUES


    | Value | Meaning |

    |---|---|

    | Success | Module says it''s happy = OK |

    | Ignore | Module signals it wants return value to be ignored |

    | Abort | Module says stop now |

    | Default | |


    "All return values not explicitly mentioned in this set," often used to catch
    all errors/failures (because there is a bunch of those) having this forces you
    to mention ignore=ignore (and sometimes other times = some obvious), they would
    fail under the default action


    FAIL – all values from the list: open_err, symbol_err, service_err, system_err,
    buf_err, auth_err, session_err, cred_err, conv_err, authtok_err, authtok_recover_err,
    user_unknown, perm_denied, cred_insufficient, authtinfo_unavailable, new_authtok_reqd,
    authtok_lock_busy, authtok_disable_aging, authtok_expired, acct_expired, maxtries,
    cred_unknown, cred_expired, try_again, module_unknown, bad_item, conv_again, incomplete,
    no_module_data


    The actions can be


    +   - ok - Module''s return code should be considered (...if there are no errors).

    - bad - Flag ourselves as having failed (doesn''t terminate).

    - die - Bad + terminate.

    - done - OK and termination.

    - ignore - Module''s status will not contribute to the stack''s return code.

    - n (an integer >0) - OK and skip the next n rules.

    - reset - Clear module state.


    In this "list notation,"we can define regular flags as:


    required = [success=ok new_authtok_reqd=ok ignore=ignore default=bad]

    requisite = [success=ok new_authtok_reqd=ok ignore=ignore default=die]

    sufficient = [success=done new_authtok_reqd=done=ignore]

    optional = [success=ok new_authtok_reqd=ok default=ignore]'
