  md: '# CHAPTER 29 SHELL SCRIPTS – BASICS AND COMMON MISTAKES


    Any command can use I/O redirection.


    ```

    mycommand < ./outfile

    mycommand > ./outfile

    mycommand 2> ./errfile

    mycommand &> ./fulloutput

    mycommand | grep failed

    mycommand && grep error      # like &;, but for pipe

    ```


    In the first line, standard input is redirected from the ./infile file (by default,
    input is taken from the terminal); in the second line, output is redirected to
    ./outfile; in the third line, the error stream is redirected to the ./errfile
    file. In the fourth line, we use the pipeline– the output of a command is redirected
    to the standard input of another command, in this case command grep. Multiple
    redirects can be used at the same time. The ''&&'' is used to redirect the output
    and error stream to the same file at the same time.


    We have already used the control constructs in the shell more than once. Let''s
    briefly list:


    ```

    if COND then ... [elif COND then] [else ...] fi

    while COND do ... done

    until COND do ... done

    for VAR in LIST; do ... done

    case WORD in PAT[[IPAT...]] ;; [PAT[[IPAT]] ;;;] esac

    select VAR in LIST; do ... done

    ```


    The square brackets contain optional elements. We are already familiar with the
    if operator. As you can see, it allows you to use one or more branches with additional
    elif conditions:


    ```

    if mytest_one; then

    echo "test one passed"

    el mytest_two; then

    echo "test one failed, test two passed"

    else

    echo "both tests failed"

    fi

    ```'
  merge: -1
  pgno: 443
- img_proc: true
  md: '# CHAPTER 29 SHELL SCRIPTS - BASICS AND COMMON MISTAKES


    The classic while loop - its body is executed as long as the COND condition is
    true. The until loop is made for convenience - its body is executed while the
    condition is false, i.e., it is fully equivalent to the while ! COND; do ....
    The loop is very popular when processing files. At each of its iterations, the
    VAR variable is assigned a value from the LIST list. For example, this is how
    to extract all zip files in the current directory into the corresponding subdirectories:


    ```

    for i in *.zip; do

    base=$(basename "${i}") .zip

    mkdir "$base"

    pushd "$base"; unzip ../$i; popd

    done

    ```


    We use basename program to get the archive name without the extension, then create
    the directory, save the current path in a special stack command, by pushd and
    go into the new directory, unzip the content there, and return into our directory
    using popd, which takes the path from the stack. One more important detail: the
    variable name can be enclosed in curly brackets to avoid misinterpretations.


    The case branching command is only slightly similar to its C counterpart. It gets
    a string and compares it with templates in each branch. Templates are similar
    to file name templates: metacharacters * and ? and lists in square brackets are
    allowed. Multiple templates can be listed via pipe sign. One or more templates
    are followed by a block of commands that will be executed if the string falls
    under the template. The block ends with two semicolons. Example:


    ```

    case "$input" in

    Y|IYYES)

    echo "ok, let''s go."

    ;;

    n*ININO)

    echo "program canceled."

    exit 1

    ;;

    *)

    echo "Bad answer. Try again."

    retry=1

    nesac

    ```'
