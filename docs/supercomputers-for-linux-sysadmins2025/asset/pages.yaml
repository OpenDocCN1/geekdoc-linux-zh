    # User Experience


    For users, the basic Slurm commands are


    +   - sbatch - Put the task in the queue.

    - srun - Run the program interactively (it is queued as in sbatch,

    control is not given to the shell until the program terminates).

    - salloc - Allocate nodes for a task, but do not run anything on them,

    user must do it himself. It is necessary, e.g., for some interactive

    programs.

    - squeue - List of tasks in the queue.

    - sinfo - Information about the partition.

    - sacct, sshare, sprio - Information for advanced users about

    priority, resource usage, and FairShare.


    A job is a script, like in PBS. And in the similar way, the script can include
    special

    comments, starting with ''#BATCH'' and following any sbatch options, which will
    be

    applied by default. They can be overridden by the environment variables or explicit

    sbatch options. This script is executed on the first allocated node and has set

    environment variables, specific to the job. Unlike PBS, you can run ''srun something''

    inside the batch script and something will be executed on all allocated resources,
    e.g., if

    we run the script like this:


    ```

    #!/usr/bin/env bash

    #SBATCH --nodes 2

    #SBATCH --ntasks-per-node 2necho Start

    srun hostname

    echo End

    ```'
