    | Command | Meaning |

    | --- | --- |

    | install pkg1 pkg2 ... | Install packages and their dependencies |

    | remove | Uninstall packages |

    | update | Update all packages on the system, if there are new versions |

    | check-update | check for updates to installed packages |

    | reinstall pkg1 pkg2.... | Reinstall the packages |

    | --enablerepo/disableerepo=REPO | Temporarily activate/deactivate the repository
    |

    | --npgcheck | Disable signature verification (caution!) |

    | --skip-broken | Skip dependency checking, only if you are 100% sure it is needed
    |

    | --downloadonly | No installation, just download |

    | --downloadaddir=DIR | Package download directory |


    When you have to work with a particular package or rpm file, the rpm command comes
