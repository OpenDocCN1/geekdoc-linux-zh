  md: '# CHAPTER 29 SHELL SCRIPTS – BASICS AND COMMON MISTAKES


    That is why there must be a space before and after a square bracket and a line
    feed, semicolon, or other command delimiter after a closing square bracket. By
    the way, the closing square bracket is mandatory – the test program checks for
    its presence. Pay attention to quotation marks; they are very important in shells.
    For example, the strings


    ```

    myvar=''1 > 3''

    if [ $myvar = ''1 > 3'' ]; then ...

    ```


    equivalents


    ```

    myvar=''1 > 3''

    if [ 1 > 3 = ''1 > 3'' ]; then ...

    ```


    It is clear that the test command will generate an error on such a set of arguments.
    In this case, the value of myvar was substituted “as is” – with spaces. To avoid
    such problems, you should enclose the variable in quotes in the argument of the
    test command: "$myvar". Try to avoid tests where the variable can be empty, as
    it will cause an error. For example:


    ```

    v=''''

    if [ $v = '''' ]; then ....

    ```


    It''s better to write it like this:


    ```

    v=''''

    if [ "x$v" = ''x'' ]; then ....

    ```


    Shell separates script text, input argument values, and variable substitution
    results into separate words separated by spaces, tabs, or line feeds. If a variable
    must contain text with spaces, you can either escape the spaces or enclose the
    text in quotation marks.


    Quotation marks in the shell are of three types: single, double, and inverse.
    Text in single quotes is processed “as is”, without changes. If you need to insert
    a single quote in this text, it must be escaped. Double quotes allow you to interpret
    the text internally, i.e., to substitute variable values. In the example above,
    we used double quotes to get the value of the variable v.


    In addition to variable values, double-quoted variables reveal history by the
    ‘1!’ character (unless explicitly disallowed), backquotes, and their alternate
    entry. Backquotes interpret the string inside as a command with arguments, execute
    it, and return the output of the command as a string.'
  merge: -1
  pgno: 440
- img_proc: true
  md: '# CHAPTER 29 SHELL SCRIPTS – BASICS AND COMMON MISTAKES


    Interestingly, within double quotes, nested double quotes are grouped together,

    meaning such a string would work fine:


    ```

    base="basename $file .bak"

    ```


    You can use the $(...) construction instead of backquotes, and I recommend

    using it. For-in variables @@ and $* that represent script (or function) arguments,

    enclosing them in double quotes will list the arguments as if they were each enclosed

    in quotes.


    For example, by calling this script


    ```

    for i in "@"; do echo "$i";

    ```


    with arguments ''abc 123''qwe, we get


    ```

    abc 123

    qwe

    ```


    If you remove the quotation marks around @@, the result is this:


    ```

    abc

    123

    qwe

    ```


    Quotation marks should be put everywhere, except where they are definitely not

    needed (e.g., when a variable contains a prepared command line). Without quotation

    marks, even a simple command like


    ```

    echo $var

    ```


    may produce unexpected results if var contains a word that matches the command
    key,

    such as ''-n''.


    Shell supports the ''&&'' and ''||'' ''conditional'' constructs. They can be used
    both in ''if''

    conditions and instead of them. The com1 && com2 construct will execute com1,
    and if

    returns 0 (i.e., true, completed successfully), then com2 will be executed and
    its result

    returned. If com1 terminated with a code other than 0, com2 will not be executed.
    That''s

    why this construction is often used for ''light'' implementation of conditions.
    The same is

    the case with com1 || com2, but in this case, com2 will be executed only if the
    completion

    code of com1 is not equal to 0.'
  merge: -1
  pgno: 441
- img_proc: true
  md: "# CHAPTER 29 SHELL SCRIPTS – BASICS AND COMMON MISTAKES\n\nIt is not uncommon\
    \ to see lines of this kind in scripts:\n\n```\n[ \"xinp\" = '' ' ] && echo \"\
    Empty input. Exiting\"; exit 1\n# or\ngrep \"$search\" testfile || echo \"Nothing\
    \ found.\"\ninstead of\nif [ \"xinp\" = '' ' ]; then\n    echo \"Empty input.\
    \ Exiting\"\n    exit 1\nfi\n# or\nif ! grep \"$search\" testfile; then\n    echo\
    \ \"Nothing found.\"\"\n```\n\nRemember, it’s wrong to write that way:\n\n```\n\
    if [ \"$x\" = one || \"$x\" = two ]; then ...\n```\n\nThe || && constructs combine\
    \ different commands, and the -o and -a options are used within the test command\
    \ arguments for similar purposes.\nThe right options are\n\n```\nif [ \"$x\" =\
    \ one || \"$x\" = two ]; ... # 2 'test' runs\nif [ \"$x\" = one -o \"$x\" = two\
    \ ]; then ... # 1 'test' run\n```\n\nYou can invert the logical result of a command\
    \ execution with an exclamation point:\nif ! my_test; then echo my_test failed;\
    \ fi\n\nIf you are familiar with programming in C, Java, or a similar language,\
    \ you have noticed an unfamiliar comparison operator – an equal sign instead of\
    \ the double equal sign. This is not the only surprise: the usual comparison signs\
    \ =, !=, >, and work with strings only (and the value of any variable is a string).\
    \ To compare numbers, use keys -eq, -ne, -gt, and -lt of the test command, respectively.\n\
    For example:\n\n```\nif [ $count -gt 10 ]; then ...\n```"
  merge: -1
  pgno: 442
