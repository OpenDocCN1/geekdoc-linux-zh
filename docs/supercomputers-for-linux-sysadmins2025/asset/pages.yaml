    As I said before, systemd uses “slices” to run everything. There is a possibility
    to run several instances of the same service or user sessions in different slices.
    This is done by creating a unit template with a name ending in ‘@’. For example,
    the file getty.service:


    ```

    [Unit]

    Description=Serial Getty on %I

    BindTo=dev-%%i.device

    After=dev-%%i.device systemd-user-sessions.service

