    # udev Subsystem


    Almost every device in Linux has a special “device file.” In reality, there is
    nothing in this file, the most important thing is the minor and major numbers,
    which are properties of the file. By these numbers (not by name!), the kernel
    knows which device you want to access. Usually, the major number defines the device
    class, and the minor number defines the number of device in the class. For example,
    a hard disk would have a minor number of 0, its first partition would be 1, its
    second partition would be 2, etc. Another disk will have a different major number,
    and its partitions will have corresponding minor numbers.


    Here is a sample output of the ‘ls -l /dev/sda’ command. Note the first letter
    of the output: ‘b’ for block device. The digits 8 and 0 are the major and minor
    numbers, respectively:


    ```

    brw-rw---- 1 root disk 8, 0 Jun 27 17:27 /dev/sda

    ```


    Some devices have historically assigned numbers, but many get them dynamically.
    Take a look at /proc/devices – there is a correspondence of major device numbers
    to the current drivers for this computer.


    In older versions of Linux, there is a MAKEDEVICES script that created the necessary
    device files, but with the kernel’s support for a huge number of devices, it became
    impossible to cram them all into the script. At the moment (when this book was
    written), the kernel has a separate /sys file containing information about all
    devices. You can “subscribe” to changes that occur in it and learn about connecting,
    disconnecting, and changing the state of devices.'
