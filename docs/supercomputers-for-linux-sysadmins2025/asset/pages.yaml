  md: '# CHAPTER 7 UNIX AND LINUX – THE BASICS


    (traditional permissions do not apply) that will work. For example, let''s allow
    user foo to read and write to the test.txt file:


    ```

    setfacl -m u:foo:rw test.txt

    getfacl test.txt

    # file: test.txt

    # owner: root

    # group: root

    user::rwx-

    user:foo:rw-

    group::---

    mask:rwx-

    other::---

    ```


    Here, the ‘-m’ key specifies to modify acl rules. By specifying the ‘-set’ key,
    you can replace rules, i.e., remove old rules and replace with new ones (multiple
    rules can be specified in setfacl at the same time). With the key ‘-x’, rules
    can be deleted. The string ‘u:foo;rw’ indicates the rule refers to a user (u =
    user, g = group, o = others), its name is foo, and read and write permissions
    are set.


    Now let''s set a mask - allow user foo (and others with access via acl rules)
    “no more than” reading:


    ```

    setfacl -m m:r test.txt

    getfacl test.txt

    # file: test.txt

    # owner: root

    # group: root

    user::rwx-

    user:foo:rw-#effective:r-

    group::---

    mask:r---

    other::---

    ```'
