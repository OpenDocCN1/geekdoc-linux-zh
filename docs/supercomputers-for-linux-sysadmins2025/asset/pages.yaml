  md: '# CHAPTER 19 CLUSTER STATUS MONITORING SYSTEMS


    Install the ganglia package and related packages; they should be available in
    your Linux distributive by default. If some reason you can''t find them, or if
    you want to install the latest version, download the source code from http://ganglia.sourceforge/
    and build with the following commands:


    ```

    tar zxf ganglia*.gz

    cd ganglia-*/

    ./configure --with-metad

    make && make install

    ```


    You may need additional libraries for the build, supplying them if necessary.
    Now let''s install the web interface for ganglia (assuming the web server is already
    installed and its root directory is /var/www/html/):


    ```

    cp -ra /var/www/html/ganglia/

    cp gmetad/gmetad.init /etc/rc.d/init.d/gmetad

    cp gmond/gmond.init /etc/rc.d/init.d/gmond

    mdir /etc/ganglia

    gmond -t | tee /etc/ganglia/gmond.conf

    cp gmetad/gmetad.conf /etc/ganglia/

    mkdir -p /var/lib/ganglia/rrds

    chown nobody:nobody /var/lib/ganglia/rrds

    ```


    By default, ganglia uses multicast packets to communicate with the gmetad server.
    To ensure that this network is properly routed over our server, where the ganglia
    server will run, add a route:


    ```

    ip r add 239.2.11.71/4 dev eth0

    ```


    Here eth0 is the interface of the network on which the compute nodes reside. Add
    this setting to the network configuration. Start the server and the ganglia agent
    and restart the web server (apache on RG-based system in this example, adjust
    for your system!)


    ```

    systemctl start gmond

    systemctl start gmetad

    systemctl restart httpd

    ```'
