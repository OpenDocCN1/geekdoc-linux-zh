  md: '+   -e - Go to the end of the list; default assumes the key ''-n1000''


    +   -x - Add auxiliary information (return codes, etc.)


    +   - unit - Show information only for the specified unit; you can specify a mask,
    e.g., "*tty*"


    +   --disk-usage - How much the binary logs take up.


    +   --sync - Flush the data from memory to local files.


    +   --vacuum-size=NNNN - Delete old events from the log until the log size is
    less than the specified size (the number is assigned to ''K'', ''M'', and ''G''
    for kilo-, mega-, and gigabytes, respectively).


    +   --vacuum-time=NNNN - Remove events from the log older than the specified value;
    the suffix "s", "min", "h", "days", "months", "weeks", or "years" is specified
    to the value.


    +   --no-pager - Do not use an external program to display information; the default
    is less.


    +   --since / --until - From what moment/to time to show logs (time format YYYY-MM-DD
    HH:MM:SS; some fields can be omitted, also acceptable are the words today, yesterday,
    and tomorrow, to which you can add relative time, e.g., "yesterday-10:00:00")


    +   -b - Show logs since the last time the server was turned on; you can add relative
    time to it as in the previous option.


    +   -p - Limit output to events with priority not higher than specified. The priority
    is specified by number or name in syslog format: emerg (0), alert (1), crit (2),
    err (3), warning (4), notice (5), info (6), and debug (7).


    You can select the output option with the -o key. We will not dwell on the possible
    variants in detail; I will note short-iso, verbose, and json variants, which may
    be useful for further processing in some script. If you need to clear your journal
    records for some reason, use a command like journalctl --sync --vacuum-time=5s.
    Note that without --sync, only records written to the disk will be cleaned.'
