- img_proc: true
  md: '# CHAPTER 9 NETWORK FILE SYSTEMS


    lo interface is shown always by default. Next step - Format MGS and MDT

    volume(s)! Let''s run this command on the MDS:


    ```

    mkfs.lustre --mdt --mgs --index=0 \\

    --servicenode 192.168.2.3@tcp0 \\

    --servicenode 192.168.2.4@tcp0 \\

    --filename=large-fs /dev/sdX\nmount -t lustre /dev/sdX /mnt/mdt

    ```


    Here use one volume for the device name, both MGS and MDT. In this example, we
    use two nodes,

    which can manage this target and specified NIDs. Only one node can mount this

    volume at the same moment. /dev/sdX is the device name and large-fs is the

    system name. The file system name is limited to eight characters. Index is used
    for MDTs\and OSTs only. If you use more than one MDT, increase the index when
    you create the

    next. Created volume can be mounted immediately.


    Note that MGS and MDTs are recommended to be mounted first; all OST volumes

    sare safe to be mounted later. Remember that if you shut down the Lustre and then

    need to power it up.


    We then perform initialization on all OSTs:


    ```

    mkfs.lustre --ost --index=0 --filename=large-fs \\

    --mgsnode=192.168.2.3@tcp0 --mgsnode=192.168.2.4@tcp0 \\

    /dev/sdX\nmount -t lustre /dev/sdX /mnt/ost1

    ```


    Here /dev/sdX is the device name, fs is the system name, we used in MGS/MDS

    creation, and mgsnode is our MDS node(s) NID(s). You can also use --servicenode
    to

    allow several nodes to manage this volume; its useful for the Lustre redundancy
    - if

    one node goes down, you can mount the volume on the other.


    After all MGS, MDTs, and OSTs are mounted, the Lustre is ready to run; you can

    mount the file system on the clients with the command


    ```

    mount -t lustre 192.168.2.3@tcp0,192.168.2.4@tcp0:/large-fs /mnt/lustre

    ```'
