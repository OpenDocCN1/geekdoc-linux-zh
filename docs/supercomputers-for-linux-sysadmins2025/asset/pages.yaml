    # Healthchecks


    After the node is booted, it makes sense to run checks and decide if it is a good
    idea to do if it is healthy enough to run users'' jobs. Moreover, this is good
    to do before each job start. Usually, such checks are called “healthchecks.” If
    you use SLURM job manager, you can enable periodical execution of custom healthcheck
    script, and it is a good idea to include healthcheck run in the prologue scripts.


    What to check, how to react on issues (drain node, try to fix, alert sysadmins,
    send emails/notifications, push events into monitoring systems, ...), and which
    tests to run in different cases (full check, prologue, background check) – these
    are questions you have to answer. Note that prologue is limited, and it is also
    included into the job runtime, so you cannot run long tests.


    You may implement your own healthcheck script (or a set of scripts), or use one
    of the opensource solutions. I have good experience using LBNL Node Health Check;⁵
    it is highly portable, because it is written in bash, has a lot of modules, and
    simple configuration file. To implement different modes, e.g., full check and
    prologue check, you can just use different config files. If you miss some functions,
    you can implement your own custom module.


