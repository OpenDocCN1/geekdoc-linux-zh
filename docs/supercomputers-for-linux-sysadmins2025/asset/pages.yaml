- img_proc: true
  md: '# CHAPTER 15 SLURM


    By default, Slurm uses more complicated FairTree algorithm, which calculates shares
    hierarchically; you can read more about it on the slurm.schedmd.com website. If
    you don''t want to use it and want to use simple FairShare algorithm, add to PriorityFlags
    value NO_FAIR_TREE.


    As resources are consumed, you have either to give new shares to the accounts
    sometimes, either consumed resources should be reset somehow for all accounts.
    In Slurm, it is implemented by two options. First is a half-decay - period of
    time when the historical usage lowers its impact into FairShare value. Here is
    an example:


    PriorityDecayHalfLife=3-6:30


    Here we set the half-decay period to 3 days, 6 hours, and 30 minutes. If we set
    it to 0, then the second option does in play - reset-period:


    PriorityUsageResetPeriod=WEEKLY


    In this example, every Sunday at 00:00, FairShare usage is reset. Unfortunately,
    there is only fixed list of periods: DAILY, WEEKLY, MONTHLY, QUARTERLY, YEARLY
    - do reset at the midnight of the first day of the period, and special: ONE (default)
    and NOW - on the Slurm controller restart.


    There are ssize utility, which shows the current FairShare values. Here are some
    hints on how to "decode" its output. NormShares is a number of given shares, divided
    by total shares given to all, i.e., normalized shares; it is always in range from
    0 to 1. RawUsage - how many normalized shares are used. EffectVUsage - if it is
    under 0.5, then account used more shares, than it has, and its priority will be
    lowered a lot; if it is in the range 0.5-1, then its priority will be increased
    by the FairShare factor, closer to 1, the higher. Here is an example:


    ```

    $ sshare

    ```


    | Account RawShares RawUsage EffectVUsage FairShare |

    | root | 1.000000 | 694362950 | 1.000000 | 0.500000 |

    | abc | 2000 | 0.011481 | 28 | 0.000000 | 0.999998 |

    | foo | 3000 | 0.017221 | 4516247 | 0.065072 | 0.072870 |

    | bar | 100 | 0.000574 | 0 | 0.000000 | 1.000000 |

    | baz | 300 | 0.001722 | 19770 | 0.000028 | 0.988597 |'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# CHAPTER 15 SLURM


    Here foo account consumed a lot of resources (RawUsage) and has low FairShare
    factor, which will decrease the priority; other account will have higher priority
    (if you made the FairShare factor significant in the priority formula of course).


    The overall checking, if one job has higher priority than the other or should
    preempt the other, follows this order:


    +   * Reservation - Jobs with a reservation are higher priority than other jobs.


    +   * Partition priority tier - Jobs in a partition with higher tier has higher
    priority.


    +   * Job priority - In case of multifactor priority plug-in use, calculated priority
    is used.


    +   * Job ID - Jobs, submitted earlier (with lower job id), have higher priority.


    # User Levels


    Slurm allows executing privileged commands to non-root users, if they are allowed
    to. There are several levels of privileged users in Slurm:


    **Administrator** - Can do any commands, by default root and user specified in
    SlurmUser have these rights.


    **Operator** - Can add, modify, and remove any database object (user, account,
    etc), and add other operators. On a SlurmDB served cluster, these users can view
    information that is blocked by regular users by a PrivateData flag and manage
    reservations.


    **Coordinator** - Trusted users, who can change limits on account and user associations,
    as well as cancel, requue, or reassign accounts of jobs in their accounts. Also,
    they can add new users and subaccounts. They cannot increase job limits above
    the parent account allows.


    To revoke a privilege, use the command:


    ```

    sacctmgr update user name=USERNAME set \nadminlevel=[admin/operator/coordinator/none]

    ```'
