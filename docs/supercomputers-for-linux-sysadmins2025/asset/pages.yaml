  md: "# CHAPTER 11  USERS – ACCOUNTING MANAGEMENT\n\nThus, if a node is replaced\
    \ or temporarily disconnected, the data will still be updated when the node is\
    \ started. To reduce the load on the network, it is necessary to organize synchronization\
    \ properly: do not start copying processes at once and monitor their execution.\n\
    \nIn order to avoid multiple repetitions of data copying during mass additions\
    \ or deletions of users, it makes sense to create a separate command that starts\
    \ synchronization and execute it manually only when the administrator finishes\
    \ changing the credentials. The workflow should be organized to run synchronization\
    \ to remote nodes with some delay or pools so that the network is not overloaded.\
    \ You can use running commands at 0.1- to 0.5-second intervals or use the pdsh/clush\
    \ program, which is better.\n\nAn example of such a script is as follows:\n\n\
