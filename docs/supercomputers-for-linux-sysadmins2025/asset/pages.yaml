- img_proc: true
  md: '# Processes


    The basic concept in any OS is a process. It is something like a container (actually
    – a description in OS tables) containing a unique identifier (PID), rights (owner,
    group, and some others), program code, data area, stack, set of memory pages,
    table of open files, and other attributes. For the OS, a process is a unit of
    process scheduling; each process can be executed as follows: processor, pending
    execution, system call state (pass a request to the OS and wait for a response),
    stopped, and terminated. They are denoted as R (running), S (sleeping), D (uninterruptible
    sleep), T (stopped), and Z (zombie).


    For example, if you run 10 calculation programs on a computer with two cores,
    then only two will be able to count simultaneously. But the OS will pause the
    active process with a high frequency (e.g., 100 times per second), put it in the
    queue and send the next process from the queue (roughly, but the essence is exactly
    the same). For the process, it looks like it monopolizes the processor; it’s just
    that the speed of this processor is five times slower than it could be.


    The average number of processes in the queue is referred to as “Load Average”.
    If it is higher than the number of cores, it usually means that not all tasks
    “get” the processor and work slower. It should be taken into account that the
    queue also includes processes in D state, i.e., a high LA can cause processes
    that, e.g., read a lot from disk or write (and constantly wait for read or write
    calls). So high LA is a signal that something is potentially wrong, but it is
    good to check it.


    A process is stopped only if another process sent it a STOP signal. In this case,
    it “freezes” and stops executing until it receives the CONT signal (or is terminated).
    If the process is in state D, the signal is ignored, and in most cases, you cannot
    do anything to clear it. In principle, the process can ignore the STOP signal,
    but this is rarely done.


    The zombie state occurs when a process has terminated, but its parent has not
    “acknowledged” (it has not called the wait system call). This is done so that
    the parent process can get data about how the process terminated. That is, processes
    in the zombie state do consume resources, neither processor and memory. For the
    same reason, they cannot be forced to terminate – they are already terminated.


    Every process in the system has a parent process (PPID); if the parent process
    has terminated, it becomes a process with PID 1 (usually a special init process
    in the system, we will talk about it below), which performs a wait for all processes.'
  merge: -1
