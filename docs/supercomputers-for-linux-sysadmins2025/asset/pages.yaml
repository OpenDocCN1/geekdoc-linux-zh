  md: '# CHAPTER 5 INFINIBAND


    The available number of packet recipient is a limit on the number of devices in
    the subnet. The LID of the packet is used by switches to determine which port
    to forward the received packet: entries in the forwarding table of switches use
    the LID as the key. To simplify the processing of subnets, where there are many
    alternative routes between pairs of points, a port or switch can be assigned several
    LIDs. In this case, a Base LID and an LMC (LID Mask Control) are assigned. The
    LMC is a number between 0 and 128.


    The lower most bits of the Base LID must be zero, and it is considered that the
    port is assigned 2LMC of consecutive LIDs, i.e., the values from Base LID to Base
    LID + 2LMC -. If only one LID is assigned to a port, then LMC = 0. Typically,
    no more than two LMC values are used per subnet: one for assigning LIDs to adapter
    ports and one (often zero) for assigning LIDs to switches.


    The global ID - GID is 128 bits long. It is assigned to each port. In fact, a
    GID is an IPv6 address where the lower 64 bits are the GUID and the higher 64
    bits of the GID (GID Prefix) default to 0xFE80:: /64 (RFC2373 for details on the
    textual representation of IPv6 addresses and prefixes). The scope of this prefix
    is the subnet (local-scope area). Data packets with a destination GID with this
    prefix will not be transmitted by routers between subnets, i.e., GIDs with this
    prefix can only be used to transmit data within a subnet. One (or none) GID prefix
    other than the default prefix can be assigned during subnet initialization. The
    GID with the default prefix should still work as the port GUID.


    Prefix /64 is a site-local scope prefix. Data packets destined for such addresses
    can be transmitted by routers from subnet to subnet, but must not leave the site-local
    scope.


    A global prefix can also be assigned, and should be chosen according to the rules
    established for IPv6 addresses.


    In addition to unicast GIDs, there are also GIDs designed for multicast transmission.
    The prefix of multicast GIDs has the high byte 0xFF; the meaning of the other
    prefix bits can be found in RFC2373 and RFC2375.


