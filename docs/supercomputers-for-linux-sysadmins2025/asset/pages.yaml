- img_proc: true
  md: '# CHAPTER 18 REMOTE USER ACCESS


    programs is necessary. For example, some commercial systems can be configured
    only through graphical programs or a browser.


    Visualization of scientific data is also often preferred on the supercomputer
    side, as it is much more costly to transfer the data itself for visualization
    at the user''s workstation. This is why I have included a chapter on graphics
    in Linux to give an idea of how graphics programs work and how to access them
    remotely. The graphics system in Linux is called the X-Window System (or X-Window,
    or simply X). It is gradually being replaced by Wayland, but compatibility with
    X will be maintained for a long time to come.


    X-Window implements the basic functions of a graphical environment: drawing and
    moving windows on the screen, interacting with the mouse and keyboard, but does
    not define the details of window design — this is handled by window managers.
    Because of this, the appearance of graphical user interfaces in UNIX-like systems
    can vary greatly, depending on the capabilities and settings of a particular window
    manager.


    A window manager controls the placement and framing of application windows (frame
    and title bar). It can create a Microsoft Windows or Macintosh-like appearance
    (e.g., this is how own window managers work in KDE, Metacity in GNOME), or a completely
    different style, such as in frame-based window managers like Ion.


    A window manager can be simple and minimalistic (like twm, the basic window manager
    shipped with X), or it can offer additional functionality close to a full desktop
    environment (like Enlightenment). Many users use a window manager, various applications,
    and a unified interface style. The most popular desktop environments are GNOME
    and KDE. The Single UNIX Specification specifies the CDE environment. The freedesktop.org
    project attempts to provide interoperability between different environments and
    to develop the components needed for a competitive X-based desktop.


    X-Window is built using client/server technology; server is the X process, which
    "owns" resources as the screen and input devices, and the clients are graphical
    applications. The client and server communicate using a specially designed X protocol.
    At the moment, the 11th version of the protocol is up-to-date, so you can see
    the designation X11.


    X server consists of two main parts: drivers responsible for input/output devices
    (keyboard, mouse, video adapters, monitors, etc.) and a part that provides interaction
    with applications via X protocol UNIX sockets or Internet. The ability to communicate
    over a network allows the X server and client to run graphical applications remotely.'
