    and controller must support hot swap, otherwise the connection should be made
    only when the node is powered off) or by performing a network installation of
    the OS on them and adding the changes that were made on the reference node after
    the installation.


    # Installation and Configuration of the Login Node


    The login node by its functional purpose is a link between the user and the array
    of compute nodes. On the one hand, it provides user interaction with the cluster,
    and on the other hand, it serves various requests from compute nodes. Therefore,
    the login server must have at least two network interfaces – external and internal.
    Note that internal services should generally not be accessible from the outside.
    I strongly recommend that you configure a firewall on the external interface.


    In case of small clusters, often the login node has a role of the management (control)
    node too. I always recommend having a separated control node if possible, because
    you won''t lose control in case of incorrect user’s doings.'
