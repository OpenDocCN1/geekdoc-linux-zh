  md: '# CHAPTER 29 SHELL SCRIPTS - BASICS AND COMMON MISTAKES


    Subshell is convenient to use to execute parts of a script in the background or
    in a separate directory (in this case, you don''t need to return to the current
    directory).


    Another useful feature of shells is functions. Although bash has the function
    keyword, it is better not to use it, but define a function like this:


    ```

    myfunc () {

    ....

    }

    ```


    You should not write anything inside the parentheses! All arguments passed to
    the function will be available in the body via variables $1, $2, etc., or variables
    $@ and *. Local variables can be defined in the function body; for this purpose,
    the declaration must be preceded by the keyword local.


    You can exit a function by executing the last command in its body or the return
    command. A function is called in the same way as a normal command; no brackets
    for arguments and no commas between them are needed:


    ```

    myfunc arg1 arg2 arg3

    ```


    The shell has exception and signal handling. It is done with the trap command.
    The first argument of the trap command is the handler command or the ‘-'' sign,
    followed by the names of the signals to be handled. If the second argument is
    ‘-’, the handlers of the specified signals will be reset. You can pass a function
    name as a handler:


    ```

    myhandler () {

    echo "Auch"

    ntrap myhandler SIGINT SIGTERM

    sleep 60

    echo I was not interrupted

    ```


    This script will run for a minute and how many times it was attempted to be interrupted
    by pressing Ctrl-C or sending a SIGTERM signal. The special "signals" are RETURN,
    ERR, EXIT, and DEBUG. It is better to read about them in the documentation.'
