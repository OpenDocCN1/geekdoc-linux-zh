  md: '# CHAPTER 9  NETWORK FILE SYSTEMS


    Table 9-1 presents some additional options.


    # Table 9-1. Some NFS exports options


    | Option | Meaning |

    |---|---|

    | all_squash | All client users will have nobody rights (see below) on the server
    |

    | anonuid | User, whose rights will be given to clients during root_squash or
    all_squash operations (by default – nobody) |

    | anonguid | Similar to anonuid, but for the group |

    | no_subtree_check | Do not check user rights in directories before the mount
    point |

    | async | Allow the server to confirm operations before they are actually executed
    Confirm operations only after they have been performed |


    A more complete set of options can be obtained by running the man command. Note
    that the sync option does not mean that the server will confirm the write operation
    only when the data gets to the disk. The confirmation will be given after the
    ''write'' system call is completed on the server, and the data may remain in the
    OS file cache.


    After modifying the exports file, the exportfs -r command should be run to have
    the nfs server reread the configuration. The exportfs command also allows you
    to manually add or remove an export rule, but I do not recommend this, as the
    changes not written to /etc/exports and will not be saved when the nfs server
    is restarted.


    Another command that allows you to view nfs server statistics is showmount. It
    shows the list of clients using the nfs server resources. The client and server
    do not have to be connected all the time, the list may include clients that are
    no longer on the network.


    The -d option shows a list of directories by at least one of the clients, -a shows
    a list of host:directory pairs, and -e shows the contents of the /etc/exports
    file. NFS clients are computers that map the directories exported by the server
    in their file system. Therefore, all options for clients are contained in the
    /etc/fstab file or in the value of the -o switch of the mount command. The most
    typical options, supported by Linux are presented in the Table 9-2. There are
    many more in specific implementations, but as a rule, they have almost no impact
    on performance.'
