    # Quotas


    Lustre supports user, group, and project quotas. Soft and hard quotas are supported.\
    Hard quota cannot be exceeded, but soft quota can be for a grace time period.
    Here are some examples:


    ```

    lfs setquota -u foo -b 200G -B 300G -i 2M -I 3M /lustre

    lfs setquota -g bar -b 200G -B 300G -i 2M -I 3M /lustre

    lfs project -r /lustre/testdir

    lfs setquota -p 1 -b 200G -B 300G -i 2M -I 3M /lustre

    ```


    We set the same limits for user foo, group bar, and project 1 (projects have only
    numbers): maximum 3 million nodes and 300 gigabytes. Soft quota is lower – 2 million
    nodes and 200 gigabytes. For project 1, we marked all files under /lustre/testdir.\
    Default grace time is one week; it is global for each type – user nodes, user
    block, group nodes, group block, project nodes, and project block. To change it,
    use this command:

    lfs setquota -t -u 1d8h -b 2d /lustre'
  merge: -1
  pgno: 153
- img_proc: true
  md: 'Here we grace times for users inodes and block quotas as one day, eight hours,
    and two days, respectively. Default quota is also supported; to set it, -U, -G,
    or -P to set user, group, or project quota. If you set some quota to a user, e.g.,
    and want to reset it to default, use this command:


    ```

    lfs setquota -u foo --default /lustre

    ```


    This works for groups and projects too, of course. To remove any quotas to user/group/project,
    specify 0 as value when you use set quota.


    Lre is a good choice for a distributed file system used during computations to
    store temporary as well as input and output data (so-called scratch file system).
    However, for permanent storage of user data, I recommend using a more robust file
    system. You''re warned.


    # PanFS


    The PanFS file system is another representative of the parallel file system. Solutions
    based on this file system are a hardware-software complex produced by Pananas
    (now VDURA), consisting of one or more ActiveStor storage systems and file drivers
    for installation on clients.


    At the time of writing, file system drivers are available for Linux only. File
    system access is also possible via CIFS and NFS protocols, but in this case, the
    modules that provide file system export would be a potential bottleneck for the
    root file system. Nevertheless, in this way, it is possible to provide, e.g.,
    access to the root file system for diskless nodes.


    Note that file system drivers for clients (unlike, e.g., GPFS) are not licensed
    additionally by the number of clients. The PanFS file driver does not use the
    DKMS mechanism, so the set of compatible distributions and kernel versions is
    very limited. A driver for specific kernel can be obtained from VDURA on a separate
    request. The VDURA storage system includes metadata and management nodes (Directors)
    and object data storage nodes. The network may be only Ethernet (1, 10, or 25
    GB), but VDURA provides an Infiniband router (but may be a bottleneck).


    VDURA storage management software runs on the metadata and management nodes. The
    following configuration mechanisms are available to the cluster administrator:
    https access, console access via ssh, or serial port. Note that even with multiple
    VDURA systems (different volumes and access levels), it is possible to configure
    all systems from a single point.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# CHAPTER 9 NETWORK FILE SYSTEMS


    Data fault tolerance is provided by storing object data with RAID-1 level redundancy
    for small files or RAID-5 for large and medium files (these settings can be changed).
    RAID redundancy is provided on the file system level, and different stripes are
    stored on different nodes, which means, that if a node is down, the file system
    is still alive.


    Fault tolerance for metadata is provided by mirroring it to the metadata node,
    which is the primary node for this volume, to the standby node. If there are three
    or more metadata and management nodes in the system, you can enable the fault-tolerant
    cluster mode. In case of failure of the primary metadata node, the standby node
    will start to perform the functions of the metadata controller transparently for
    the user.


    A distinctive feature of the system is the transfer of the file system work to
    the client driver (i.e., the cluster nodes), in particular, RAID checksum calculation
    is performed by the client driver. If possible, the client part also caches data,
    so a lot of RAM on the client can be occupied by system buffers.


    PanFS storage systems are highly scalable. To increase data transfer speed and
    capacity, one or more storage systems can be added, and system expansion can be
    performed-on-the-fly without stopping applications.


    VDURA has a user-friendly administration and configuration system that makes it
    easy to manage the system for personnel who have in-depth knowledge of parallel
    file systems. Metadata nodes, object data nodes, and file system clients must
    have well-synchronized time for the file system to function properly. I strongly
    recommend that all nodes be configured to synchronize with the NTP server on the
    PanFS management node and that in turn be synchronized with a public NTP server.
    This allows you to remain operational in case of temporary problems with the external
    network.


    # GPFS/IBM Storage Scale


    General Parallel File System (GPFS) was developed by IBM in 1998 and has been
    available for Linux since 2001. It is a proprietary distributed file system that
    supports a wide range of Linux distributions. According to IBM’s 2013 information,
