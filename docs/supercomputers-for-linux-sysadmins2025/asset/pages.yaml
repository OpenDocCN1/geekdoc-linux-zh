- img_proc: true
  md: '# CHAPTER 30 SYSTEMMD - A SHORT COURSE


    +   - idle is similar to simple, program start is delayed until other active tasks
    are started. This is done only so that the output of the unit is not mixed with
    others and is at the very end.


    RemainAfterExit=true/false - If true, then after the program specified in StartExec
    is terminated, the service is considered to continue running (convenient in combination
    with Type=oneshot).


    ExecStart-prog - Start string. For oneshot type, you can specify any number of
    options, for all others - only one. Or prefixes can be specified before the start
    string:


    +   - "-" Ignore the return code (a nonzero return code is also considered a successful
    completion).


    +   - "+" Run the process with full permissions: User=, Group= CapabilityBoundingSet=,
    etc., options are ignored.


    +   - "! - Similar to "+", but only User, Group= and SupplementaryGroups= are
    ignored.


    +   - "!! - Similar to "!, but does not work on systems without AmbientCapabilities=
    and may be used if they are required.


    Multiple prefixes can be specified, but only one of "+\!" and "!!" can be used.
    The same prefixes work in other options where startup strings are specified: ExecStartPre,
    ExecStartPost, ExecReload= ExecStop, and ExecStopPost=.

    ExecStartPre, ExecStartPost = Execute the command before/after StartExec.

    ExecReload= Execute the command if necessary to reread the unit''s configuration.

    ExecStop= Execute the command to stop the unit. Often needed for forking or oneshot
    types, when systemd does not know the PID of the service.

    ExecStopPost= Execute the command after stopping the unit.


    RestartSec= Time to wait before restarting the unit. It can be set as a number
    or as a string like "1min 15sec"; default is 100 ms.'
