  md: '# CHAPTER 27


    # Communicating with Users


    One of the most important "components" of any supercomputer is its customers,
    or users. Without it, it is of no use to anyone. Therefore, any system administrator,
    a supercomputer administrator must communicate with users and help them solve
    problems that arise during operation.


    # Correspondence


    Email is one of the most popular ways of communicating in IT environments, including
    administrators with users, especially when users are remotely most. There are
    several options for organizing user support via email. We will consider the most
    convenient, from one point of view; in your work, you can adapt this set of techniques
    to your own needs.


    First, create an address for user addresses. Do not specify a personal or work
    address! Set up a virtual address (alias) on your mail server and forward emails
    from it to multiple addresses. This will help you over time or immediately connect
    to support assistants and easily separate user requests from other correspondence.
    You can create a separate mailbox, but in our opinion, it is inconvenient, even
    if everyone will use IMAP and store mails on the server.


    For most mail servers on Linux, to configure an alias address, all you need to
    do is write a line similar to this in the /etc/aliases file:


    ```

    cluster-support: foo, bar, expert@supermail.org

    ```


    Then you usually need to run the newaliases command, after which all mail sent
    to the "virtual" address cluster-support@your.server will be forwarded to foo@your.server,
    bar@your.server, and expert@supermail.org. In your email client, be sure to'
  merge: -1
  pgno: 407
- img_proc: true
  md: '# CHAPTER 27 COMMUNICATING WITH USERS


    create a support folder where all emails addressed to support will go - this is
    done by simply creating a filter. For example, in your Thunderbird mail client,
    go to the “Tools/Message Filters” menu and create a filter by the “whom/copy”
    field. Here are emails sent from the cluster-support address.


    It is better to create another folder, e.g., support_done, and put it into the
    emails that are finished (problem solved, question answered, etc.). This allows
    you to keep “in view” all user issues in the process of solution and conveniently
    store the history. Set up a profile in your email program to be able to reply
    from the cluster-support address and reply only from that. Be sure to set up your
    profile to set the headers “return address (reply-to)” and “blind carbon copy
    (bcc)” to “cluster-support@your.server”. This way, your helpers will immediately
    see your replies, and you will see their replies to users.


    In addition to individual communication, it is often necessary to notify all users
    about something: software updates, preventive maintenance, etc. You can use address
    groups in your main client for this purpose, but you and your assistants will
    have to manually add each new address to a group. It is enough to do it once and
    the user will be offended.


    To automate some operations, you can use mailing managers as mailman, majordomo,
    and others. If your registration process is somehow automated, supplement it by
    calling a program that adds a new user’s email to the mailing list (usually manager
    programs allow this). After that, only the operations of changing the address
    on request or deleting the address when a user is deleted will remain manual.


    Don’t forget to set moderated mode in the mailing list manager: there will be
    situations when a user will reply not to the address specified as the return address
    (reply-to), but to the mailing list and his reply should not go to everyone. The
    manager supports the possibility to limit the reception of mails to a set of addresses,
    then specify only the address cluster-support. Don’t forget to confirm sending
    a mail to the mailing list when moderating mode is enabled!


    If you have an chat or messenger, like Slack, Rocket.Chat, Microsoft Teams, Telegram,
    etc., where you can create a dedicated channel for the cluster support, it is
    a wonderful idea to do that. But the problem here is that the requests in the
    chat/messenger are not tracked, it is hard to keep up with a long-term problem
    or refer to old solutions. I highly recommend you to create tickets, or add any
    automation (bots, etc.) into the channels, which help to create such tickets.
    The same is about the emails – try to automate transform questions via emails
    into the tickets and track them.'
