    # PAM Modules


    Later, I will often refer to the PAM modules, so PAM stands for “pluggable authentication
    modules,” and it is a library, which is widely used in many programs, that requires
    authentication. The library gives a standard API and loads modules – shared libraries,
    implementing authentication methods and some other stuff and loaded when they
    are needed. Note, it is a library, not a service!'
