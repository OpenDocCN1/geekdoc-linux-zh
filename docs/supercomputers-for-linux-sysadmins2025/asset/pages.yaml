  md: '# Customizing the Scheduler


    In Torque, a separate process, the scheduler, is responsible for selecting the
    next task to launch it for execution. This allows the implementation of a more
    flexible policy of task execution organization on the computer system. The scheduler
    evaluates each task according to its strategy and deic\sides which one to run.
    The strategy can take into account many factors such as time of day, system load,
    task size, queuing time, etc. When the scheduling attribute is set to True, the
    server, responding to events, calls the scheduler to select the next task to run.
    Events in Torque can be


    +   - Adding a task to the queue

    - Completion of the assignment


    Torque comes with several schedulers with different strategies for advancing tasks
    in the queue. A third-party scheduler can be used if the proposed algorithms are
    suitable. Scheduler selection is done at the Torque installation stage when executing
    the command using the --set-sched and --set-sched-code options. For example:


    ```

    configure --set-sched=cc --set-sched-code=sgi_origin

    ```


    By default, FIFO scheduler is installed during installation, which implements
    the “First In First Out” strategy. The task that was first placed in the queue
    will be the first to be executed if there are enough free resources for it.


    In addition to the basic FIFO scheduling strategy, a number of additional strategies
    can be configured using the scheduler configuration file, which is located in
    /var/ spool/PBS/sched_priv/sched_config. The format of the entries in the file
    is


    ```

    name:value [prime | non_prime | all]

    ```


    Parameter round_robin - If true, tasks will be executed one by one from each queue
    cyclically; if false, tasks will be executed from one until they reach any of
    the limits (resources, max, max_running, max_user_run) set on the server, and
    only then the system will switch to processing tasks from another queue.


    by_queue - If true, the scheduler will work with queues; if false, all tasks on
    the server will be interpreted as one big queue.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# CHAPTER 14 OPENPBS AND TORQUE


    strict_fifo - If the value is true, the FIFO strategy will work strictly. This
    will cause that a task cannot be executed for some reason (no resources available),
    other tasks will not be executed. If strict_fifo is not set, this can lead to
    longer queue times for large tasks. Smaller tasks will go first, and there will
    be constantly insufficient resources to run the larger tasks.


    fair_share - If set to true, the fair share algorithm is enabled.

    load_balancing - If set to true, tasks will be distributed only on time share
    nodes.

    help_starving_jobs - If set to true, a special strategy for “suffering” tasks
    is enabled. A task is considered to be suffering if it has been waiting to start
    for more than specified by the max_starve parameter. Other tasks will not be started
    until the suffering task is started.


    sort_by - Enables sorting of tasks. Possible values are presented in the Table
    14-2.


    | Sorting | Meaning |

    |---|---|

    | no_sort | Don''t sort tasks |

    | shortest_task_first | In ascending order by cput attribute |

    | longest_task_first | Descending by cput attribute |

    | smallest_memory_first | Ascending by mem attribute |

    | largest_memory_first | Descending by mem attribute |

    | high_priority_first | In descending order by task_priority attribute |

    | low_priority_first | In ascending order by task_priority attribute |

    | large_walltime_first | Descending by task_walltime attribute |

    | short_walltime_first | In ascending order by task_walltime attribute |


    multi_sort - Sorting by a set of keys

    For example:


    ```

    sort_by: multi_sort

    key: sortest_task_first

    key: smallest_memory_first

    key: high_priority_first

    ```'
