    Commands can be grouped using parentheses or curly brackets. Commands in curly
    brackets are executed sequentially, and the result of the operation is the result
    of the last command. The command block in parentheses is executed in the same
    way, but in a separate shell instance (called subshell). This is to important
    to remember, because if you change the value of a variable in such a block, it
    will not change in the main shell:


    ```

    myvar=10

