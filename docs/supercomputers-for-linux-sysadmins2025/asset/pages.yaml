  md: '# CHAPTER 7 UNIX AND LINUX – THE BASICS


    You can view the list of processes and their status using the ps command. It has
    had a difficult fate, as it has historically had many, including conflicting,
    options in different versions of popular operating systems (UNIX, BSD, Solaris).
    As a result, Linux uses a GNU variant that tries to combine them. In particular,
    there are options that necessarily be specified with a minus in front and others
    that must be specified with only no minus. Below are the most useful ones from
    our point of view:


    +   * ps fax # all processes grouped into a tree

    * # you can see who''s descended from whom

    * # add ''u'' flag to see processes owners them

    * # all processes with most useful fields

    * ps aux # show processes and threads

    * ps -eo pid,ppid,user,vsize,pmem,pcpu,stat,wchan:32,comm

    * # explicitly specify the output format

    * # (-e = all processes)


    You can add combinations, then the process name field (typically a program with
    arguments) will be wider. If you add it twice, it will be even wider, and if you
    add it three times, there will be no width restrictions at all.


    It can be convenient to track the activity of processes in real time. This is
    where the top command and the newer htop command can help. They show processes
    in the form of a table sorted by one field and update it every five seconds (you
    can change the interval). In this case, only those processes that fit on the screen
    are shown, plus some general data about the system - CPU load, memory load, average
    load, and number of processes in different states.


    You can switch display and sorting modes. There are several hotkeys for top; their
    list can be obtained by pressing ''h''. The most convenient sorting options and
    commands:


    ```

    <Shift><P> - Sort processes by CPU usage

    <Shift><M> - Sort processes by memory usage


    1 - Show the load of each core or total

    k - Send a signal to the process

    r - Change the process priority

    u - Filter by user

    q - Quit

    ```'
