  md: '# CHAPTER 28 ONE-TWO-THREE INSTRUCTIONS


    The haltall script implements the controlled stage cluster shutdown algorithm,
    which should ensure the longest possible uptime of nodes busy with task execution.
    In real life, this script can be much larger, as it controls shutdown of, e.g.,
    several clusters and workstations.


    Below is a fragment related to one of the real clusters. Immediately after a power
    failure, the onbattery script is started, which runs the haltall script. The script
    outputs to the log file information about that the shutdown process has started
    and the start time. The process goes into standby mode for 30 minutes in case
    power is restored, and the shutdown process is interrupted. Next, all nodes are
    scanned to see if they are loaded and a poweroff command is sent to those that
    are not loaded.


    The tlwait function is then started and waits for the battery charge to drop to
    a level sufficient for only five minutes of battery life. When this state is reached,
    the task queue is stopped and a list of currently running tasks is generated.
    The user jobs are stopped; after a one-minute pause, the procedure of shutting
    down all nodes is started, and after next minute - shutting down the server itself.
    Such an algorithm allows keeping busy nodes in a workable state for as long as
    possible.


    Script for shutting down a cluster (PBS version):


    ```

    #!/bin/sh

    #

    CLUSTERNAME=MYCLUSTER

    OUT=/etc/apucsd/halt.log

    TPRED=7200

    ```


    ```

