- img_proc: true
  md: '# CHAPTER 7 UNIX AND LINUX – THE BASICS


    The “default” actions can be changed by the process (except for the STOP and KILL
    signals). They can be handled or ignored. If the process terminates correctly,
    the process memory can be written to a so-called core file that the cause of the
    error can be investigated by a debugger afterward. Whether a core file is created
    is determined by the OS settings and limits (see chapter quotas).


    You can send a signal from the command line with the kill command. For example,
    kill -9 1234 will forcibly terminate the process with PID 1234, and kill -STOP
    2345 will stop the process with PID 2345. As you can see, you can use either the
    signal number or the signal designation. kill -1 will show a list of all signals.


    Sometimes it is necessary to send a signal to one process, but to many, e.g.,
    to all processes of a user. Then the pkill process comes to the rescue: pkill
    -u foo -TERM will send the TERM signal to all processes of the user foo.


    It was mentioned above, the processes that are to be rescued are put into a queue.
    They are not always executed in a row; each of them has a priority and a nice
    number affecting it. The higher the priority, the faster the process moves to
    the beginning of the queue. You can select the priority explicitly, but you can
    change the politeness (often it is also called priority for simplicity, but it
    is not quite right). This is done with the nice or renice command, the first starts
    a program with the specified priority, and the second one changes the priority
    of the already started program. The higher the priority, the lower the priority;
    the program will more frequently “pass” others ahead. Historically, politeness
    varies from -20 to +19, and a normal user cannot specify it less 0, e.g.,


    ```

    nice -n 15 /my_program # start a program with low priority

    renice -n -10 -p 3322 # prioritize process 3322

    ```


    Here we change the priority from 0 to 15 (priority down) or to -10 (priority up).
    In addition to the queue for CPU resources, there is a hard disk resource, several
    processes can read-write simultaneously and their requests will compete. This
    queue also has a priority; it is controlled by the ionic command. There are three
    priority classes - idle (execute the request if there is no one else in the queue),
    best effort (normal queue), and real time (the request must be executed in a given
    time). Within the classes, besides idle, there are other priorities, but in our
    tasks, we can limit ourselves to assigning the idle class to a process that has
    a lot of time on disk operations but is not a priority:


    ```

    ionic -c 3 -p 89 # set idle class to process with PID 89

    ```'
