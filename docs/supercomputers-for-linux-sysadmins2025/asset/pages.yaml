  md: '# CHAPTER 30


    # Systemd – A Short Course


    # Units


    There was a brief introduction to systemd in the chapter “Booting and it.” The
    basic concept for systemd is unit – it can be a description of a service, an action,
    or a rule. As a rule, a unit is a file with a standard structure in the style
    of ini-file, i.e., the file is divided into sections, and the name of the section
    is given in square brackets. Within a section, each line has the form “key = value.”


    All processes, defined in units, are running inside control groups; each group
    is called “slice,” and inside the slice, you can specify various control group
    limits; we''ll stop at this later. Units can belong to system or to user, but
    here we''ll talk only about system ones.


    If you have changed or created a new unit, its description file should be copied
    to /etc/systemd/system/directory (or sometimes in one of many others, refer to
    the main page), but if you copy the file there, it may be overwritten when the
    package is updated, or use the /etc/systemd/system directory created to prevent
    such situations. Descriptions from this directory have higher priority, so you
    can override defaults.


    Moreover, you can override not the full unit definition, but just selected. And
    I recommend using this approach, instead of replacing system unit, even in /etc
    folder. In this case, future updates will be applied generally, if they don''t
    interfere with your changes.


    To do that, for service servicename, you have to create a directory titled /etc/systemd/system.d
    and then put file(s) with .conf extension. This applies not only for service units,
    but for all unit types. In these files, you can specify only sections you want
    to modify and only keys/values you want to add, update, or delete. To delete the
    value, usually just need to specify an empty value. Note that some keys'
  merge: -1
  pgno: 449
- img_proc: true
  md: '# CHAPTER 30 SYSTEMMD - A SHORT COURSE


    can be specified multiple times, e.g., ExecStart. If you specify such key, it
    will be just added, if you want to replace the current value, specify an empty
    value first, the key(s) and value(s) you want to set.


    After updating the unit descriptions, you should force systemd reread them with
    the systemctl daemon-reload command.


    Here is an example describing a service:


    ```

    [Unit]

    Description=MDM Display Manager

    Documentation=man:mdm(1)

    Conflicts=getty@tty7.service

    After=system-user-sessions.service

    ```


    ```

    [Service]

    ExecStart=/usr/sbin/mdm --nemon

    ExecReload=/usr/bin/mdm-restart

    ExecStop=/usr/bin/mdm-stop

    Restart=always

    RestartSec=1s

    TimeoutStopSec=5s

    ```


    ```

    [Install]

    WantedBy=graphical.target

    Alias=display-manager.service

    ```


    The first section, Unit, describes the dependencies; it also contains a description
    and optionally a link to documentation. Dependencies are managed by the following
    options:


    +   - Requires=srv1, ... - If our units, the units listed here start and continue
    all of them if they have started successfully.

    - Requisite=srv1, ... - If least one of the specified units is not started, the
    start of this unit automatically fails.

    - Wants=srv1, ... - Before starting this unit, the units listed here are started,
    but their status is not checked.

    - BindsTo=srv1, ... - Similar to Requires, but in addition, if one of the specified
    units stops, this also stops.'
