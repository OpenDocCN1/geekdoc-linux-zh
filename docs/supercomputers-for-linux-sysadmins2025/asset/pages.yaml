  md: '# CHAPTER 10


    # Remote Management


    For the simplest organization of remote access, it is enough to run sshd server
    on the nodes. This is the basic means of access to compute (and not only) nodes.
    But what to do if there is a problem with node and sshd does not start? How do
    you find out the cause of the issue? IPMI or iKVM/KVM-over-IP can help. In order
    to use remote access via IPMI, you need to activate beforehand; by default, only
    local access works, and network access is disabled. There are other similar technologies,
    e.g., Redfish and DCMI, but IPMI specification is still most common.


    IPMI remote access can be activated via BIOS, if it allows, or by booting root
    and configuring IPMI network settings with the ipmitool command (see IPMI chapter
    below). Ensure that IPMI network is enabled by vendor, and getting IP via DHCP
    is enabled (and you have MAC address list); otherwise, you''ll have to set up
    IPMI manually for all your nodes, which may take weeks. Access via iKVM usually
    needs to be preconfigured as well. In many implementations, it is combined with
    IPMI. Don''t change the default password!


    # ssh and Parallel ssh


    SSH is a secure shell; this protocol replaced the telnet and remote shell protocols,
    which were previously widely used for remote access, but were absolutely insecure.
    The same still applies to the FTP.


    In 1995, Finnish computer scientist Tatu Ylönen designed SSH – open secure protocol
    for remote access and file transfer. Now the most common implementation of client
    and server is OpenSSH, evolved by OpenBSD developers, but there are alternatives.
    By default, SSH server uses 22 port. Below we will use the abbreviation SSH for
    the protocol and ssh for the name of the client command of the same name.'
