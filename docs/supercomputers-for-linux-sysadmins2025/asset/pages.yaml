  md: '# UNIX Groups, ACLs


    Access to resources is rarely equal for all users. Not even because “everyone
    is equal, but some are more equal than others.” Different types of tasks often
    require different amounts of disk space, time for counting, and, in rare cases,
    higher priority for a short time, etc.


    To control disk space, the UNIX rights sharing system is traditionally used. For
    example, to organize work on a project, it is convenient to create UNIX groups
    and a common directory with a “sticky” bit group. Sometimes more flexible control
    of access to files and directories is required. In this case, an extension of
    the traditional system – access control lists (ACLs) – can help.


    Not file systems support them, especially network file systems. The principle
    of ACL is simple: in addition to the usual rights, lists of users with their own
    rights are added. This allows you not to create a group for each case, but to
    create an explicit list of users with the necessary rights. For example, it is
    possible to allow user1, user2, and user3 to read and write in the mydir directory;
    users reader1, reader2, and reader3 to read only; and all others deny access completely
    by commands:


    ```

    setfacl -m u:user1:rw, u:user2:rw, u:user3:rw mydir

    setfacl -m u:reader1:r, u:reader2:r, u:reader3:r mydir

    chmod o-rwx mydir

    ```


    If ACLs are set for a directory or file, the ls command will add a ''+'' to the
    list of permissions. You can view ACLs with the getfacl command. For more information,
    see the documentation, e.g., man acl.


    # Restrictive User Access


    Blocking is an extreme measure prohibiting the use of an individual resource (as
    a rule, direct access to compute nodes) or the supercomputer as a whole (login
    prohibition). Such means should be used cautiously, only in cases when it is seriously
    justified – the rules of operation are grossly violated or the user’s actions
    violate the operation mode of the complex.


    Now let''s look at how to block a user if necessary. There are different locking
    options available: blocking login; blocking blocking login except for file access;
    and blocking access to computing resources. Access to computing resources is controlled
    by the'
  merge: -1
