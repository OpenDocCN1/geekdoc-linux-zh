    # TBB


    Intel TBB (Intel Threading Building Blocks) library is a library of C++ templates
    and

    functions that allows you to simplify writing parallel programs in terms of threads.
    It

    supports various thread implementations – POSIX threads, Windows threads, and
    Boost

    threads. The library offers a way of building a program “in blocks,” abstracting
    from

    threads themselves. Due to this approach, the programmer doesn''t have to worry
    about

    thread synchronization, thread generation, and thread management.


    Most standard parallel constructions and algorithms are implemented in the library

    in the form of “tasks,” which are linked together and generate a graph of dynamically

    generated threads. In the process, the threads are optimized for efficient cache
    and CPU

    usage. On the other hand, this approach practically does not allow adapting a
    ready-

    made program – the algorithm must be initially written in terms of TBB task blocks.


    TBB library exists in two versions: commercial and free open source. The

    commercial library provides a wider set of algorithms and technical support. As

    the name implies, the library implements only thread support; it does not contain

    dributed block tasks. Therefore, working with MPI and distributed memory is left
    on

    the programmer’s side. It is necessary to be very careful, because in this case,
    the work

    on thread synchronization is hidden from the programmer, and in combination with

    asynchronous MPI calls, it can lead to hard-to-diagnose errors.


