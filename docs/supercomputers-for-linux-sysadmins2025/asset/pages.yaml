    # Ganglia


    Ganglia is an open source monitoring system originally developed to work with

    computing clusters by the University of Berkeley. Each machine runs the

    gmond daemon, which collects system information (CPU speed, memory usage, etc.)
    and

    sends it to one server (or several, as we will see below).


    Ganglia has two network transmission modes - unicast and multicast. The default

    mode is multicast. This mode assumes that data is sent to everyone who “subscribes”
    to

    t multicast stream. That is, the ganglia agent, which is called gmond, sends a
    packet of

    data to a certain multicast address, and all those who are “subscribed” to this
    address

    receive it. In the case of unicast mode, the packet is sent to only one subscriber,
    the

    server specified in the agent’s configuration.


    The modern version of Ganglia server is able to process the received data, e.g.,

    compute map or sum, then it stores it, usually in RRD files (Round-Robin Database).
    It

    can also pass up to the hierarchy by aggregating it. On a large scale, it is recommended

    to use aggregation, because otherwise it can affect network performance when gmonds

    from many nodes start transmitting data at the same time.'
  merge: -1
