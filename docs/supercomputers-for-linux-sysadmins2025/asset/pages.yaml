  md: '# CHAPTER 7 UNIX AND LINUX - THE BASICS


    With this program, you can navigate the directory tree, view the contents of directories
    and files, create directories (but not files), delete, copy, move directories
    and files, and search for files. For many users, the Midnight Commander text editor
    is a very good choice. It can be invoked separately with the mcedit command.


    Editing files is an important topic. There are numerous editors that work in both
    text and graphical modes. As administrators, we will foremost be interested in
    an editor that can work in the most difficult conditions – without a graphical
    interface, possibly over a network, when function keys are not available or do
    not work properly. There are several editors, e.g., nano and emacs. But, in our
    opinion, the most guaranteed to work, is installed on 99% of Linux systems, is
    the vim editor; it is installed almost everywhere.


    Its interface at first glance is not all friendly and logical, but in fact, most
    of its commands are well-thought and logical. Its main advantage is the ability
    to work in almost any environment and quick execution of mass operations (search,
    replace, etc.). It has two modes of operation – command mode and insert mode.
    Initially, the file is opened in command mode. Use the cursor keys to move through
    the text; if they don''t work, use `h`, `j`, `k`, `l` keys (look at the keyboard
    and you''ll understand why it''s such a strange set). The `w` and `b` keys move
    forward and backward per word.


    The main terms in vim are


    +   * **Buffer** - Place where you view or edit the text; vim can run several
    buffers at the same time.


    +   * **Window** - A view port to the buffer; you can have several windows on
    your screen, showing the same or different buffers (files).


    +   * **Register** - A place you can use to store some text (like a clipboard,
    but vim has many of them!).


    +   * **Mode** - How your input will be interpreted.


    There are also macros, bookmarks, tabs, and many more, but this is not a book
    about vim... Anyway, the nonintuititive fact at first in vim is by default. After
    starting vim, you are in **normal mode**. You can move around the text, search,
    delete and replace it, copy to the registers, and paste from the registers. If
    you want to type something new, then switch to the **insert mode**. Here you just
    type new text. There are several hotkeys, which allow you to paste from the register
    quickly (Ctrl-r x, where x is a register name) or indent the line (Ctrl-t) and
    even run a normal mode command quickly (Ctrl-o CMD), but usually if you don''t
    add new text, you use a different mode.'
