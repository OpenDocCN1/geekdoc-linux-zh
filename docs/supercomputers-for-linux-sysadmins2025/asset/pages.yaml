  md: "# CHAPTER 29\n\n# # Shell Scripts – Basics\n Common Mistakes\n\nThis chapter\
    \ is not intended to be a tutorial on shell programming but to come some basic\
    \ concepts that are useful for beginners to know about and some common mistakes\
    \ that are often encountered. I strongly recommend that you study the Advanced\
    \ Bash Scripting Guide and use this as a quick reference only. Here we treat bash\
    \ syntax as the most common syntax. Most of the constructs will work in shells\
    \ other than csh/tcsh. I deliberately do not include all shell expressions and\
    \ do not show all the features of the described constructs, but only the main\
    \ ones. I highly advise you to learn bash syntax, as it helps you to understand\
    \ your scripts and write efficient bash code.\n\nIn a script, the '#' character\
    \ is a comment character; the rest of the line after it is not processed by shell.\
    \ Scripts actively use special characters that are processed by shell (e.g., $,\
    \ !, etc.). In order to cancel their special action, 'escaping' is usually used\
    \ – inserting a backslash '\\ before the character.\n\nIf a script starts with\
    \ the '#' (shebang) and the script file is marked as executable, it can be run\
    \ directly by the operating system. In this case, the OS will run the command\
    \ that is written after these two characters and pass the path to the script as\
    \ the last argument. Note that there can be no other characters before or between\
    \ them. This means, in particular, if the script was prepared in a text editor\
    \ in UTF-8 mode, it may add a BOM (Byte Order Mark) character to the beginning\
    \ of the file. It is not displayed, but the OS will not be able to determine that\
    \ this file can be run as a script.\n\nA script consists of a sequence of commands;\
    \ each command is a call to a program, possibly with arguments, or a call to a\
    \ built-in shell command. Since a command can have multiple arguments, there are\
    \ special delimiters to help you understand where one command ends and the next\
    \ begins. These delimiters are\n\n+   - Line feed (UNIX-style '\\n' ONLY)\n- End\
    \ of file"
  merge: -1
  pgno: 438
- img_proc: true
  md: '# CHAPTER 29 SHELL SCRIPTS – BASICS AND COMMON MISTAKES


    +   * Semicolon (;) or double semicolon (;;) in the case construction

    * Ampersand (&)

    * Pipe (|)

    * I/O redirection (<, >, >&, >>, <<)

    * Logical commands (&&, ||)


    For example, you can write the condition like this:


    if mytest; then echo OK; else Fail; fi

    nor you could do this:


    ```

    if mytest

    then

    echo OK

    else

    echo Fail

    fi

    ```


    or even like this:

    if mytest; then

    echo OK

    else echo Fail; fi


    All operators that check conditions take a command as an argument, execute it,
    and check the return code. If the return code is 0, the result is interpreted
    as logical true; if not, it is interpreted as false. This applies to the if, elif,
    while, and until commands. The built-in shell command act as a command. Unlike
    “usual” languages like C, you cannot substitute the value of a variable. If you
    write $myvar instead of a command, the interpreter will get the value of the variable
    and use it as the name of the command. To check the value of a variable, use the
    built-in test command. There is “syntactic sugar” for the test command in the
    form of the ‘[ program, i.e., the following lines are completely equivalent:


    ```

    test "$myvar" = "ok"

    [ "myvar" = "ok" ]

    ```'
  merge: -1
  pgno: 439
