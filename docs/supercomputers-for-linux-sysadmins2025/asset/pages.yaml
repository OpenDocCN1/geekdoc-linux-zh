    SNMPv2-MIB:sysUpTime.1 = Timeticks: (4) 00:00:00.04

    SNMPv2-MIB:sysUpTime.2 = Timeticks: (4) 00:00:00.04

    SNMPv2-MIB:sysUpTime.3 = Timeticks: (5) 00:00:00.05

