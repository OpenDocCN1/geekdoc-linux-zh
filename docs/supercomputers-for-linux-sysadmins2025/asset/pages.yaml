- img_proc: true
  md: 'After that, we are taken to the section menu:


    +   1: Extending the Agent

    2: Monitor Various Aspects of the Running Host

    3: Trap Destinations

    4: Agent Operating Mode

    5: System Information Setup

    6: Access Control Setup


    We are interested in sections 4, 5, and 6. In section 4, you can specify the address
    (interface) on which the agent will run, as well as the user and group on behalf
    of which it will run. Section 5 is data about the server, which will be available
    in the system subtree. Section 6 allows you to specify the username (for SNMP
    v3) and/or community name for reading or read-write (by default – for all values):


    +   1: an SNMPv3 read-write user

    2: an SNMPv3 read-only user

    3: a SNMPv1/SNMPv2 read-only access community name

    4: a SNMPv1/SNMPv2 read-write access community name


    For example, let''s set the ability to read all values for the 192.168.0.0 network
    in a community named public (user input is indicated in bold):


    Select section: 3


    Configuring: rocommunity

    Description:


    +   an SNMPv1/SNMPv2 read-only access community name

    arguments: community [defaulthostnamenetwork/bits] [oid]


