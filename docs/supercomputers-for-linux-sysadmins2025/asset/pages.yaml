  md: "# Striping and PFL\n\nIt was mentioned before when storing a file, Lustre splits\
    \ it into blocks. It is known as **“striping”** will manage stripe size and number\
    \ of OSTs, between which file stripes will be distributed. Here is an example\
    \ how to apply new striping settings to a directory:\n\n```\nlfs setstripe -S\
    \ 4M -c 8 /lustre/testdir\n```\n\nHere we set stripe count to 8 and size to 4\
    \ megabytes. Each **new file**, created in this directory, will get stripe stripe\
    \ parameters. You cannot change stripe parameters for any existing file; the only\
    \ method to change them is to copy the file into the directory with desired parameters\
    \ set. To check the current file configuration and placement, you can use this\
    \ command (-y you yaml-formatted output):\n\n```\nlfs getstripe -y /Lustre/testdir/testfile\n\
    lmm_stripe_count: 8\nlmm_stripe_size: 4194304\nlmm_pattern: raid0\nlmm_layout_gen:\
    \ 2\nlmm_stripe_offset: 2\nlmm_objects:\n  - 1_ost_idx: 2\n    - 1_fid: 0x100020000:0x2:0x0\n\
    \  - 1_ost_idx: 3\n    - 1_fid: 0x100030000:0x2:0x0\n```\n\nLustre 2.10+ supports\
    \ **“Progressive File Layouts”** (PFL), which allows having different stripe counts\
    \ and sizes for different file regions (components in terms of Lustre). Let’s\
    \ modify our directory:\n\n```\nlfs setstripe -E 1M -S 512K -c 1 \\\n  -E 256M\
    \ -c 4 \\\n  -E 1 -S 1M -c 8 /lustre/testdir\n```\n\n-E option sets the end of\
    \ the component, and the options followed it - striping parameters. In this example,\
    \ the first megabyte of the file will be placed in 2 stripes with 512K on the\
    \ same OST, the next 255 megabytes on 4 OSTs using the same stripe size,"
  merge: -1
