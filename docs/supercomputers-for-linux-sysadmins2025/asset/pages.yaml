    several ways to solve it:


    +   - If the nodes themselves have the MAC address written on them, you can collect
    them manually.

    - If your Ethernet has SNMP support, you can enable all nodes and collect MAC
    address statistics by port.

    - Or use the same dhcp server:


    Let''s consider the last option, because the server keeps records of all requests.
    By default, requests are logged via syslog to /var/log/syslog or /var/log/messages
    file. If this does not happen for some reason, check if logging is enabled in
    your DHCP server, or in debug mode and redirect the output to a file.

    Beforehand, we need to create a “normal” configuration file, as such as this:


    ```

    subnet 192.168.123.0 netmask 255.255.255.0 {

    range 192.168.123.10 192.168.123.100

    }

    ```


    We specify that in the 192.168.123.0/24 network, a range of addresses with the
    last octet 10 to 100 is allowed for distribution to clients. Make sure that the
    addresses do not conflict with the addresses on the main network! Now start the
    DHCP server with the dhcpd eth0 command, where eth0 is to make the compute node
    network interface (don''t confuse it with an external interface). To make the
    DHCP server start correctly specify this interface in the /etc/sysconfig/dhcpd
    file (for RH-like systems) with the line “DHCPARGS=ethX” or in the /etc/default/dhcp3
    file (for Debian-like systems) with the line “INTERFACES=ethX”. Check if everything
    worked: click on the power button on the first node and wait for logging to start.
    A message like this should appear in the log:


    ```

    dhcpd: DHCPDISCOVER 00:01:02:03:04:05 via eth0

    ```


    That is, the MAC address of our server is 00:01:02:03:04:05. It remains on all
    nodes in turn (do it with an interval of 5-10 seconds, no less) and get the list
    of addresses in the required order by command:


    ```

    grep DHCPDISCOVER /var/log/syslog | awk ''{print $3}'' > macs.txt

    ```'
