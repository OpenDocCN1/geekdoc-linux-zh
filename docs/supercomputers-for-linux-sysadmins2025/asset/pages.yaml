  md: '# Extension Agreements


    The file extension is the part of the file name after the dot; e.g., the file
    ''text.cc'' has the extension ''.cc''. For most programs, the extension is not
    essential, but its presence makes it easier to understand the purpose of the file.
    The most common extensions are presented in Table 7-6.


    Table 7-6. Common file extensions

    | Extension | Common usage |

    | --- | --- |

    | .c | C program file |

    | .cc | C++ program file |

    | .hpp | Include-file of C/C++ program |

    | .f.for | Fortran program file |

    | .o | Object file |

    | .a | Static library |

    | .so | Dynamic library |

    | .html | HTML document |

    | .tar.cpio | Archive file |

    | .gz,.bz2,.7z,.zip | Compressed file |


    It is important to understand that the file extension is not crucial for the OS
    and most programs. Changing the file extension to ''.exe'' or ''.sh'' will not
    make the file executable. But a script named ''do_it_now'' can be made executable
    by executing ''chmod +x do_it_now''. Extensions make it easier to see what the
    file is, so you know what it is.


    Names starting with a dot (. ) are supposed to be hidden and often assigned to
    service files and directories. These files and directories are usually ignored
    by programs and file managers by default, but are visible if explicitly asked.
    For example, the ls command does not show them unless you specify the ''-a'' switch.


    Many commands allow the use of lists of file names as arguments. These lists can
    be conveniently generated using shell templates. Let''s consider them below.'
