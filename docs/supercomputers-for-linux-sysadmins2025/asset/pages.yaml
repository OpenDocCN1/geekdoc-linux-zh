  md: '# Table 9-2. Some NFS mount options


    | Option | Meaning |

    | --- | --- |

    | soft/hard | Algorithm for for behavior after a server connection timeout; hard
    (default) forces the client to repeat the request until a response is received;
    soft stops sending after retrans (see below) sends and returns an error to the
    calling program. This prevents program hangs, but can lead to data corruption
    |

    | retrans=n | Number of request sends to the server before an operation error
    is generated (if the soft option is used) |

    | rsize/wsize=n | Maximum packet size for read/write operations in bytes; must
    be a multiple of 1024 and greater than zero. For modern clients, this is of little
    relevance, since the maximum packet size is determined dynamically when mounting
    the file system |

    | ac/noac | Client can/can''t cache file attributes |

    | proto=udp/tcp | Which protocol to use for connection - tcp or udp |

    | intr/nointr | You can/can''t interrupt file operations by signal (Ctrl-C, etc.).
    If intr is received during an operation, it is terminated and the program returns
    an EINTR error |

    | acl/noacl | Use/not use the NFSACL auxiliary protocol to add access control
    lists to files |

    | nfsvers=N | Use the specified version of NFS. The default is the maximum version
    supported by both the client and the server |

    | sync/async | Whether or not to send data to the server before exiting the system
    call |

    | lock/nolock | Enable/disable the use of an additional protocol that allows flock
    calls to be made for files on NFS. Using lock requires an additional lock manager
    (usually lockd or nfslock) on the server. In addition, using lock increases the
    overhead of file operations |


    NFS is not a secure file system unless additional features are used, such as encryption
    and Kerberos authentication (available in NFSv4). This means that if someone can
    gain access to the network over which NFS data is transmitted, gain access to
    all of that data or connect with the highest possible privileges.'
