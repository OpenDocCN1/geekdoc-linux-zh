    # Table 26-1. Examples of how the rpower command works


    | Command | Meaning |

    | --- | --- |

    | rpower compute stat | Output the status of nodes in the compute group |

    | rpower node1 off | Shut down node1 |

    | rpower node1 cycle | Turn the unit off and on |

    | rpower node[1-100] on | Enable nodes node1... node100 |

    | rpower node1 reset | “Press” the reset button on the node |


