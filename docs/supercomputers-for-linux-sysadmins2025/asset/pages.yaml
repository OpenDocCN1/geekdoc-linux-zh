  md: '# CHAPTER 24 NODE SETUP AND SOFTWARE INSTALLATION


    specify it cloning. If the disks are identical and their number is small, you
    can connect them to the node one by one and perform a full disk cloning with the
    following command:


    ```

    dd if=/dev/sda of=/dev/sdb

    ```


    Here /dev/sda is the name of the disk with the prepared system, and /dev/sdb is
    the disk to be fabricated. This procedure may fail, and the system prepared by
    the cloning method will not boot if the prototype system is adjusted beforehand.
    The point is that many systems associate device names with fairly identification
    numbers in the bootloader and mount configuration files. For example, in SUSE
    OS in GRUB bootloader configuration file /boot/grub/grub.cfg, you can make an
    entry of this kind:


    ```

    root=/dev/disk/by-id/ata-WDC_077MA0_WCAPW5389339-part1

    ```


    It will not be correct on another computer with a different disk number. Therefore,
    before cloning, these entries should be replaced with anonymized device names,
    e.g., root=/dev/sda1. The /boot/grub/grub.cfg and /etc/fstab files should be edited
    in this way. After that, you will get a prototype OS that can be moved to other
    disks.


    Another problem arise if the OS binds network interfaces to MAC addresses. Usually,
    these are specified in /etc/udev/rules/70-persistent-net.rules or similar. If
    this is the case, you will need to mount the new file system and correct the MAC
    address after cloning. There may be other nuances - pay attention to the first
    boot from the cloned disk.


    A safer and faster option in this respect is to install the operating system on
    an NFS-root. To do this, you need to prepare a minimal image of the system ready
    for network booting and its mounting via NFS in read-write mode. After that, DHCP
    and TFTP servers are prepared,一遍ux is configured, and the initrd image is prepared.
    Once the node is booted, packages can be installed and configured. Do not put
