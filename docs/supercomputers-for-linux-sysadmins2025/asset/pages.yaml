  md: '# CHAPTER 2


    # # What Is “Super”?


    # General Concepts of Parallel Processing and Parallel Programs


    All modern supercomputers use parallel data processing. Since the beginning of
    the computer era, this has been and remains the most important way to achieve
    high performance. So, let''s start from **boring things** and try to understand
    how parallelism works! Yes, you can skip it if you''re sure you know all that
    stuff.


    Nowadays, even the simplest desktop computer, is almost certainly equipped with
    simultaneous multithreading technology (e.g., Intel''s HyperThreading or AMD SMT),
    which allows two (sometimes more) program threads to run simultaneously. Even
    cell phones and cameras are becoming parallel and multicore.


    The principle of parallel data processing is simple: if two or more operations
    are **independent** (i.e., the results of their execution do not affect each other''s
    input data), these operations can be performed simultaneously, i.e., in **parallel**.
    In hardware, there are traditionally two variants of embodiment of this principle
    – parallelism and pipelining.


    **Parallelism** – Parallel execution of machine instructions by different devices.
    For example, the commands x=a+b and y=b*c, where a, b, and c are stored in internal
    processor memory, can be executed independently if the processor has separate
    addition and multiplication devices (see Figure 2-1). This principle is embodied
    in modern processors. GPUs also use this principle – many cores do the same code
    in parallel.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# CHAPTER 2 WHAT IS "SUPER"?


    ![](img/bf80ee52d79fecfa3ce237b9e3fd3292_27_0.png)


    **Figure 2-1.** Parallel execution


    ipelining - Division of commands into stages, each of which is executed quickly
    by a separate hardware element, and execution of these stages according to the
    conveyor principle: one after another. Thus, several commands at different stages
    of the conveyor can be executed simultaneously. This principle is most often used
    in **vectorization**, execution of a single-type operation on vectors, i.e., data
    arrays located in memory on a regular basis (see Figure 2-2). This is used in
    “vector” processor operations, like AVX.


    ![](img/bf80ee52d79fecfa3ce237b9e3fd3292_27_1.png)


    **Figure 2-2.** Pipelining and vectorization


    Most frequently, the elements of the vector are arranged one after another. A
    typical example is the addition of vectors. Since the operation performed on vectors
    is the same, it is divided into phases - pipeline stages, e.g., loading elements
    from memory, normalization of mantissas, addition, correction, and writing to
    memory. After performing the first stage on the first element of the vector, this
    stage can be immediately performed on the second element without waiting for the
    completion of the whole operation on the first element.


    After each step is completed over one element, you can perform it over the next
    element. Thus, if the slowest stage of the conveyor is executed in K cycles, and
    all stages in S cycles, then the vector of N elements will be processed in K*
    (N-1)+S.'
  merge: -1
