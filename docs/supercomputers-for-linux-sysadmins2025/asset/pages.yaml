- img_proc: true
  md: 'When starting an X server, you can specify the number of the display it will
    serve.

    In Linux, multiple X servers can be started to serve different displays. By default,
    the X server starts on display number :0, after which this number is considered
    occupied, and an attempt is made to start a server with the same number will fail.
    Physically, a display can be real hardware (monitor, mouse, keyboard) connected
    to the server, or it can be virtual. A display in the X sense is not necessarily
    one monitor and one mouse-keyboard; it can include multiple screens and many input
    devices.


    Most applications that have a graphical interface have a special -display option
    that specifies which display the program will interact with:


    ```

    xclock -display :0

    ```


    If the option is not supported or if you just want to specify a default display,
    you must use the DISPLAY environment variable:


    ```

    export DISPLAY=:0

    ```


    X.Org Foundation''s reference implementation, called X.Org Server, is the canonical
    implementation of X-Window. Modern implementations of X.Org Server are capable
    of running, automatically detecting hardware parameters and requiring no manual
    configuration. However, in some cases, this is still necessary, e.g., to specify
    the use of a particular driver rather than what X.Org considers optimal.


    The main X server configuration file is /etc/X11/xorg.conf; many distributions
    maintain a /etc/X11/xorg.conf directory, which may contain multiple files with
    separate configuration sections. The X server will work with the /etc/X11/xorg.conf
    if it exists. The configuration defined in this file has a higher priority than
    other configurations.


    There may be situations when the system will incorrectly detect the parameters
    of your I/O devices, in which case you may need to edit the configuration file.
    Since this file does not exist by default, you can create it with the Xorg -configure
    command. This will result in the file xorg.conf.new, which can be edited and copied
    to /etc/X11/xorg.conf. The structure of this file is described in the chapter
    “One-Two-Three Instructions”, in the standard documentation (man xorg.conf) and
    on the Internet. If the X server fails to start, more detailed information can
    be found in the file /var/log/Xorg.0.log. Here 0 is the display number.'
