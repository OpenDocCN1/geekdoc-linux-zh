  md: '# CHAPTER 20 BACKUP


    The ''C'' option allows you to specify the directory where the archive will be
    deployed:

    tar xvzf project.tar.gz -C /path/to/folder


    It is not necessary to use the full path starting from the root directory, you
    can use a relative path from the current directory. To view the contents of the
    archive, use the command:

    tar tzf project.tar.gz


    An example of adding files to an archive:

    tar rvf project.tar new_file


    An example of adding directories to an archive:

    tar rvf project.tar new_folder


    You can add files and directories to the archive only if the archive is not compressed
    by archivers; otherwise, the tar command will generate an error.


    The tar command is often used to create data backups. Backing up information allows
    you to avoid complete data loss in case of failures and significantly reduce system
    recovery time, of course if you store backup on the different physical device,
    don''t you? The tar command algorithm is well suited for backup operations; it
    saves in the archive not just the contents of the file, but also full information
    about it: who is the owner, access rights to the file, etc.


    Moreover, the data structure is fully preserved during copying, i.e., character
    references and other special file system objects will be correctly restored. This
    property of the tar command is typically used for full copying of file systems,
    because the standard cp command does not always handle special files correctly.


    Command to completely copy the data01 directory to the new /db01 folder:

    tar cf - data01 (cd /db01; tar xvf -)


    This example uses the pipeline. The first tar cf - data01 command creates an archive
    and outputs it to the standard output stream, indicated by the "-” sign of the
    archive name; the second | command (cd /db01; tar xvf -) goes to the folder


