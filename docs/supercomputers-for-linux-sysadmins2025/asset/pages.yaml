  md: '# CHAPTER 7 UNIX AND LINUX – THE BASICS


    By the way, here we did not write the object and command names in full – instead
    of address show, we wrote addr sh. The ip command allows such abbreviations down
    to one letter, but only in the names of objects and commands. Be careful: some
    objects and commands start the same way. In many cases, you may want to see only
    essential data, use --brief or -br before object, e.g., ip -br a.


    Note that the interface eth0 has the two IPv4 addresses, and there may be even
    more.


    Static routing table is managed by the route object:


    ```

    # ip route sh

    9.10.11.0/24 dev eth1 proto kernel scope link src 9.10.11

    10.0.0.0/8 dev eth0 proto kernel scope link src 10.0.0.2

    default via 9.10.11.1 dev eth1

    ```


    Along with classic route table, there is special set of rules (policy routing
    tables and rules), allowing route the traffic using flexible conditions, the source
    address or interface, IP protocol, and many others. For this, use rule object.
    It may be useful when you have several interfaces and want to control the traffic
    to minimize hops and some other cases. This approach creates a set of routing
    tables and list of rules to use when to them. Read about it in the manual.


    Another useful object is the neighbor. This is a table of IP addresses matching
    MAC addresses, which is supported by the kernel (ARP-table). It can be used, e.g.,
    to make the kernel “memorize” MAC addresses of nodes forever and not allow them
    to be refined again using ARP requests. Here only the show command is demonstrated,
    but for each object, of course, a large set of commands is supported – add, delete,
    modify, etc. For example, adding the IP address 172.16.0.1 for interface eth0
    would look like this:


    ```

    ip add dev eth0 local 172.16.0/24 scope link

    # or just

    ip addr 172.16.0.1/24 dev eth0

    ```


    Here dev, local, and scope are keywords with arguments. Their order is important.


    Adding a route:


    ```

    ip route add to 172.0.0.0/8 dev eth0 via 172.16.0.2

    ```'
