  md: '# CHAPTER 12


    # Users – Quotas and Access Rights


    No matter how good our users are, there is always a need for restrictions on various
    resources both within the supercomputer as a whole and within an access node.
    This task breaks down into two: a rigid “can/can''t” restriction and a flexible
    “do no more than” restriction. The first restriction, as a rule, is realized by
    means of user and/or group rights to certain files and devices. The second one
    is realized with the help of quota mechanisms that are built into some subsystems.


    # File System Quotas


    Quotas and limits have been and still are one of the most effective methods of
    optimizing resource usage and keeping order on any computing system. Quotas, as
    a rule, refer to file systems, where they have existed for quite long time. However,
    some other resources can be quoted as well.


    So how do disk quotas work? Most standard file systems in Linux have quota support
    by default, but to activate it, you often need to specify special mount options
    – usquota and grpquota. Sometimes both options can be replaced by a single option
    – quota. To work with disk quotas, you need to install a separate package, usually
    called quota. Please note that for some file systems, like zfs, btrfs, and lustre,
    have special commands for managing quotas and have advanced quoting features.
    For such file systems, commands, listed below, won''t work, but the general idea
    is the same.


    After mounting the file system with the required options, you need to run the
    command from the superuser:


    ```

    quotacheck /path/to/fs

    ```'
