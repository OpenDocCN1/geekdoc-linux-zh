- img_proc: true
  md: '# CHAPTER 11 USERS – ACCOUNTING MANAGEMENT


    The simplest solution is to use the widely used LDAP or NIS+ technologies, but
    they have significant scalability limitations. How to get around them?


    We can use the classical variant and store data in the passwd file and synchronize
    its content with the master on all nodes. Let''s consider the pros and cons of
    this approach and try to take them into account in the implementation.


    Pros:


    +   - Absence of network requests “storm” when a user logs on to a lot of compute
    nodes (starts a large task)


    +   - Low time to obtain accounting information


    +   - Removing the point of failure as a network authentication service


    Cons:


    +   - In case of synchronization failure or node replacement, we get a hard-to-diagnose
    error (missing or incorrect user data).


    +   - Possible high load on the network when updating data.


    +   - When adding/removing multiple users, there is a lot of unnecessary data
    copying.


    +   - Low flexibility of the solution.


    So, the “bottlenecks” of our solution are potential data desynchronization and
    shock loads on the network. To eliminate the first threat, I suggest using the
    following synchronization scheme: data copying is started not on the master node,
    where the master files are stored, but on the destination node. Copying can be
    organized via sc or rsync, and it is better to put it in a separate script. This
    script should be automatically started at startup; if necessary, it can also be
    started remotely from the master node.


    Here is an example of such a script; let''s call it /usr/sbin/master-sync:


    ```

    #!/usr/bin/env bash

    SYNC="rsync -e ''ssh /root/secret_key''

    SRC_ADDR=root@master.cluster


    $SYNC $SRC_ADDR:/etc/passwd /etc/passwd

    $SYNC $SRC_ADDR:/etc/shadow /etc/shadow

    $SYNC $SRC_ADDR:/etc/group /etc/group

    ```'
