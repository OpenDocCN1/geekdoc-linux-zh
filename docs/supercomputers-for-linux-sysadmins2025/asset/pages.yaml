  md: 'CHAPTER 21 COMPILERS AND ENVIRONMENTS, FOR PARALLEL TECHNOLOGIES


    # # UCX AND NCCL


    Unified Communication X (UCX) - optimized production-proven communication framework
    for modern, high-bandwidth, and low-latency networks supports RoCE, InfiniBand,
    TCP sockets, shared memory (CMA, knem, xpem, SysV, mmap), and Gemini/Aries (ugni).
    It is well-supported by OpenMPI, MPICH, Charm++, NCCL, and many others. If you
    didn''t disable it in your MPI implementation and have problems, you may either
    disable it or try to tune via specific variables like this (OpenMPI example):


    ```

    mpirun -np 2 -mca pml ucx -x UCX_NET_DEVICES=mlx5_o:1 ./myapp

    ```


    Here we specify to use UCX as PML transport (-mca pml ucx) and pass the UCX-specific
    variable, forcing it to use specific device (-x UCX_NET_DEVICES=mlx5_o:1). You
    can get all UCX-specific variables via ucx_info -c command, and if you add ''-f''
    option, you get the documentation about each of them.


    NCCL stands for "NVIDIA Collective Communications Library," pronounced "Nickel."
    It is closed, freely available library, implementing a lot of point-to-point and
    collective operations, like MPI, but intended to be highly optimized to use on
    GPU and with RDMA. It can be used to scale up an application to use single-GPU,
    multi-GPUs, many nodes + GPUs. And it works without GPUs, of course, and even
    together with MPI. The advantage is automatic detection of the network topology,
    PCI-express configuration, etc.


    Via the environment variables, you can tune NCCL-based apps, e.g., in multiinterfaces
    networks, sometimes you need to specify network parameters explicitly. When you
    specify interfaces in NCCL, there is a convention:


    +   * If you specify a string, like ''eth'', it means prefix, and matches to all
    interfaces, starting with it.


    +   * If you add ''='' prefix, it means exact matching, e.g., ''=eth1'' matches
    only to one interface, but not to ''eth11''.


    +   * If you add ''^'' prefix, it means negative prefix, i.e., matches to all,
    except this prefix.


    +   * ''^='' means ''except exactly this interface."


    315'
