  md: '# CHAPTER 22 PARALLEL COMPUTING SUPPORT LIBRARIES


    is a program package with open source code, you may launch it under a debugger.
    The source code is needed to compile the package with the debugging information.
    Usually, it is enough to add the -g option to the compiler and linker.


    Unlike sequential programs, parallel programs are executed on several processes/or
    threads on different nodes at the same time. In this case, traditional debuggers
    such as gdb (GNU debugger) are of very limited use. Many MPI implementations allow
    you to run under a debugger, in which case each MPI process is run under a debugger,
    and if the process crashes, you can log into the debugger and find the local cause.
    Unfortunately, it is impossible to know what is happening in the other MPI processes.
    In some implementations, it is possible to execute the debugger command simultaneously
    in all processes, but if there are several hundred processes, the output of this
    command will be simply unbearable.


    There are several debuggers specially oriented to work with parallel programs.
    One of them is TotalView. It was developed by Ethus (later renamed TotalView Technologies),
