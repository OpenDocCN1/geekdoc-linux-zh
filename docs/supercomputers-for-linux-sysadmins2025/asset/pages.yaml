  md: 'xCAT is really good tool for your nodes management, but it has some flaws too.
    In my opinion, the most critical are


    +   - Limited support of the Linux distributions; you usually cannot add the latest
    version, because the image creation fails.

    - You cannot use already installed image snapshot as a base for the image.

    - DNS and DHCP management is limited to managed nodes; you cannot add custom zones,
    sections, options, etc.

    - No verification for the images, installed to the local disk.

    - No statistics, history, etc.


    Be aware, test before use, and plan wisely.


    # Canonical SaaS


    MaaS stands for "Metal-as-a-Service" and is widely used. For example, xCAT can
    be considered as a Maas platform. Canonical company has a product with the same
    name, and it is designed, how you can guess, automate the process of installing
    operating systems on cluster computing nodes and collecting information about
    the hardware of cluster nodes. Later, we use "MAAS" for canonical MAAS product.


    MAAS provides the following functions:


    +   - Storing images of Ubuntu, CentOS 7, CentOS 8, Oracle Linux, Windows, and
    VMware ESXi operating systems

    - Deploying stored OS images to computing nodes

    - Collecting information about the hardware of computing nodes

    - DNS, DHCP, TFTP, PXE, and NTP server functions

    - Computing node power management functions via the IPMI protocol

    - Network address space management functions


    Also, it has native integration with Ansible, Chef, Puppet, SALT, and Juju, REST
    API, CLI and Python bindings, which makes it really easy to build custom workflows.
    Support for KVM and LXD makes possible to provision virtual machines.'
