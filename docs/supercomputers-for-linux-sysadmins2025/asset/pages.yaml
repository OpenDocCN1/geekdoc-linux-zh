  md: '# Bacula


    Bacula is a backup system that is based on the network principle. It uses several
    types of server programs, each of which performs a different function. They can
    run either different physical servers or on a single server. The types of program
    servers used in bacula:


    +   - Storage server

    - Data server (file server)

    - Director


    In addition, various client programs can be used to manage and control the system.
    The purpose of the storage server is to work with archive drives. It receives
    data for archiving over the network or, conversely, gives the data read from the
    archives. Data servers supply data to storage servers, they must have direct access
    to the information to be archived. Finally, the director is the server that gives
    commands to the rest of the servers and manages the data streams. It stores information
    about what data has been stored in the database. Officially supported are sqlite,
    mysql, and postgresql.


    For example, you have a disk shelf connected to store1 and a tape library connected
    to store2. Your network file system is accessible from the head machine head1
    and you would like to additionally backup local data from servers svr1, srv2,
    and srv3. In this case, you can install storage servers on store1 and store2 and
    data servers on head1, srv1, srv2, and srv3. Director can be installed on any
    server, but it is better if it is the most fault-tolerant server you.


    Bacula allows you to create very flexible configurations for data archiving; its
    capabilities are probably the most extensive in its class of programs. The only
    serious disadvantage of bacula is the need to manually configure all parameters
    and operations. Once the settings are made, everything will work automatically.
    To control and manually start archiving or restoring data, you can use the bconsole
    program that comes with bacula, and third-party programs such as bat or web-bacula.
    Unfortunately, none of these programs support the ability to edit the configuration.


    The bacula configuration is "smeared" across servers – each instance of type of
    bacula server has its own configuration file. But this does not mean that the
    information is duplicated; on the contrary, this approach allowing the necessary
    settings only where they are needed. Let’s look at the concepts that bacula operates
    with in the configuration:'
