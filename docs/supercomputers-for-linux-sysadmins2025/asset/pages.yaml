- img_proc: true
  md: 'Since remote memory accesses occur through a communication network, their execution
    time is noticeably longer and their tempo is slower than that of local memory
    accesses. it is extremely expensive to wait for each single operation to be executed,
    so it is required that the programmer explicitly allocates accesses to nonlocal
    locations.


    Unlike other PGAS languages (e.g., UPC), SHMEM forces the programmer to explicitly
    allocate accesses using functions, with further grouping of accesses and optimization
    performed in hardware. Here we can add a comparison to OpenMP''s shared memory
    paradigm, where the programmer should slide computations into pieces without worrying
    about memory allocation. This paradigm take into account the difference in memory
    access of NUMA systems, especially systems with cache-coherent shared memory.
    That is why OpenMP support could not be implemented efficiently on systems with
    distributed memory, although unsuccessful attempts were made (Intel Cluster OpenMP
    and ScaleMP vSMP).


    The PGAS paradigm extends OpenMP''s shared memory paradigm in that the programmer
    needs to distribute only computations, but also data, and when distributing computations,
    take into account how the data has been distributed.


    Historically, the SHMEM interface has been supported by all MPP systems from Cray,
    Silicon Graphics, and Quadrics interconnects. All these implementations were essentially
    proprietary and available only on the equipment of those manufacturers who offered
    it. Most Russian supercomputers and clusters lacked support for programming with
    SHMEM. Another problem is the lack of a standard for SHMEM calls. Thus, different
    implementations from different vendors differed slightly in both call format and
    functionality. All this had a negative impact on the portability of existing applications
    and on the popularity of SHMEM.


    Since 2009, a group of the SHMEM user community has begun work on standardizing
    the SHMEM library under the name OpenSHMEM, emphasizing the openness of this initiative.
    At the time of writing, several references to implementations are available on
    the community website http://www.openshem.org, including those in OpenMPI and
    MVAPICH2-X.


    Compilation of programs using SHMEM is done with the osc/fort commands for C and
    Fortran, respectively. It should be noted that the MPI implementation is used
    to build and run the GASNET library and the compilers and libraries based on it.
    Thus, it will be required when building both GASNET and OpenSHMEM. On other hand,'
