  md: '# CHAPTER 4 SUPERCOMPUTER HARDWARE


    Another important issue to consider when designing networks for computing clusters.
    Without going into details, each high-speed network card costs about $1,000, and
    the price of a communicator can range from $10,000 to $1,000,000 and above. Today,
    the most popular technology for building clusters for creating data exchange networks
    is InfiniBand. The reasons for its popularity are related to the perfect performance,
    a good ratio between the price and capabilities of the equipment, as well as the
    availability of software. We will consider InfiniBand more precisely in the next
    chapter.


    Some networks can use only one topology (the way nodes are switched). For example,
    Gigabit Ethernet only supports star topology, but since it is only used in conjunction
    with TCP/IP in real-world applications, it is possible to combine multiple stars
    with links by configuring routing.


    InfiniBand allows you to use almost any topology that is supported by the installed
    subnet manager. Standard subnet manager implementations support star, tree, fat
    tree, and hypercube topology but newer implementations are being introduced. Due
    to the fact that InfiniBand allows multiple routes, the fat tree topology is well
    suited for medium-sized configurations and makes good use of duplicate links.


    Topology is an important factor in network efficiency. Topology bottlenecks can
    negate high network speeds. For example, two Gigabit Ethernet switches connected
    to a single link is not a good solution. And if you connect them with multiple
    links, you need to make sure that they are interconnected at the switch level.
    Such interconnection is supported by many types of network equipment; there are
    standard technologies such as EtherChannel, bonding, and trunking. It is significant
    to make sure in all parties involved in such interconnection use the same standards
    which may be implemented differently from one vendor to another.


    Let''s go through typical types of network topology, available today (2025):


    +   - Tree (star) - Typical Ethernet topology. Even if you have several switches,
    connected in parallel, usually spanning tree algorithm will left running only
    one and the second will work in standby mode.'
