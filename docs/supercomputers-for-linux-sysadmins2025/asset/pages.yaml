  md: '# CHAPTER 4 SUPERCOMPUTER HARDWARE


    To increase the power of a server or workstation, manufacturers installed multiple
    “single-core” processors (frequently from two to eight). Such systems still exist
    today and are called symmetric multiprocessor systems or SMP systems (see Figure
    4-5).


    ![](img/bf80ee52d79fecfa3ce237b9e3fd3292_61_0.png)


    Figure 4-5. Symmetric multiprocessor system (SMP)


    As you can see from the diagram, each processor, which is a single compute core,
    is connected to a common system bus. In this configuration, memory access for
    all processors is the same, so the system is called symmetric. More recently,
    each processor has multiple cores. Each of such cores can be considered as a processor
    in a specific SMP system. Of course, a multicore system differs from an SMP system,
    but these differences are almost imperceptible to the user (until they think about
    subtle optimization of the program).


    NUMA technology – nonuniform memory access – is often used to speed up work with
    memory. In this case, each processor has its own channel to memory, with a part
    of memory directly connected to it, and the rest – through a common bus. Now the
    access to “own” memory will be fast and to “others” memory – slower (see Figure
    4-6). If this architecture is used in an application, you can get a significant
    acceleration. The significant problem in both cases is that each processor (or
    CPU) uses its own cache, which increases the speed, but makes possible invalid
    data to be processed. To prevent it, caches should be synchronized (or be coherent),
    which can lead to performance degradation. If each processor (or core) uses its
    own memory region, and there is no need to synchronize caches, performance should
    be good.


