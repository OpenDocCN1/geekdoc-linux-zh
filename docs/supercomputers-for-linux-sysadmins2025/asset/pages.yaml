  md: '# CHAPTER 21 COMPILERS AND ENVIRONMENTS, FOR PARALLEL TECHNOLOGIES


    Since OpenCL is a set of specifications, independent implementations are made
    for each type of device. There is an NVIDIA implementation for its own video cards
    (it is included in the standard driver), AMD implementation for its processors
    and video cards, and Intel implementation for its processors.


    # OpenACC


    The OpenACC standard is a set of specifications according to which compiler can
    implement it. The standard also has a set of implementation recommendations for
    different gas pedals. Unlike OpenCL, OpenACC supports traditional languages –
    C, C++, and Fortran. When modifying the program text, only directives-special
    comments are introduced and the modified program can work without OpenACC, but
    in sequential mode without gas pedals.


    OpenACC directives are very similar to OpenMP directives, and for good reason:
    the initiators of the new standard were participants and developers of OpenMP
    standards. As a result, all OpenACC directives are compatible with OpenMP and
    can be used in the same program, and some OpenACC directives will probably be
    ported to OpenMP.


    From the administrator’s point of view, this technology does not require any separate
    support, except for a compiler supporting OpenACC. Currently, this technology
    is supported by NVIDIA, GCC (NVIDIA and AMD cards), and Intel (for Xeon Phi processors)
    compilers.


    # Environment Modules and LMOD


    I already mentioned above that it is very desirable to install several MPI compilers
    and implementations on a supercomputer at the same time. But how to use them simultaneously?
    It is very inconvenient to specify full paths to executable files and libraries
    every time. The problem is mostly solved by adding the necessary paths to environment
    variables such as PATH, LD_LIBRARY_PATH, and some others. In order to automate
    and removing the necessary paths, the Environment modules package,⁴ or modules
    for short, was created.


    > http://modules.sourceforge.net/'
