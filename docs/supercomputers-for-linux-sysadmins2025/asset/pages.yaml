  md: '# CHAPTER 7 UNIX LINUX – THE BASICS


    # File Naming Conventions


    One of the most common tools for UNIX is the shell. In shell, some characters
    have a special value (which can be overridden) – this makes it easier to work
    with files. Any characters except ''/'' and ''\0'' can be used in file and directory
    names, including those, which are used as special in shell. In the Table 7-5 you
    can see the list of shell special characters.


    Table 7-5. Shell wildcards


    | Special symbol | Meaning |

    | --- | --- |

    | Backslash | Special character escape character |

    | Ampersand (&) | Symbol of command execution in the background |

    | Parentheses ('''', '')'') | Tells the to run commands in a new instance of the
    shell |

    | Angle braces (< and) | Output/input redirection characters |

    | Space '' '' | Command argument delimiter |

    | Question mark (?) | Means any character in the pattern |

    | Dollar sign ($) | Means substituting the value of the variable |

    | Square braces ([]) | Define a range of characters |

    | Curly braces ({}) | Define a list of values in bash |

    | Asterisk (*) | Any (including 0) number of any characters |

    | Vertical bar (\|) | Conveyor operator |

    | Colon (:) | In many programs separates the name of a remote server from the
    path to a file on server, does not have special meaning in shell |

    | Semicolon(;) | Character to indicate the end of a shell command |

    | Newline (

    ) | Line feed also means the end of the command in shell |


    > UNIX does not prohibit the use of these characters in file names, but you must
    escape their special purpose with the ''\'' character or enclose them in single
    quotes ''...''.'
