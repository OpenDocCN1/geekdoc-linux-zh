    # XDMoD


    Grafana, data collectors, or ElasticSearch are flexible, but require a lot of
    work to set up collection and dashboards. Binding collection to data may be really
    painful, especially if you allow sharing nodes. And here XDMoD (XD Metrics on
    Demand) can help. It is developed at the University at Buffalo, SUNY, and it ingests
    data from job management systems, like SLURM, PBS, etc., and provides visualizations,
    which can help to analyze supercomputer resources usage efficiency, plan upgrades,
    and resources across user groups. All collected metrics are organized in hierarchy,
    allowing analyzing, e.g., specific user''s or group''s efficiency.


