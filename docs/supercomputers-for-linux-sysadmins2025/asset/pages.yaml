    | --- | --- |

    | Lan | Network configuration |

    | Power | Power management |

    | Mc | Controller management |

    | Sensor | Sensor value printing |

    | Sol | Serial over LAN – remote console |

    | User | MC user management |

    | Channel | MC channel setup |

    | Session | Session information |

    | Shell | Input commands interactively |


    Use the ipmitool lan print command to view the current MC network settings.

