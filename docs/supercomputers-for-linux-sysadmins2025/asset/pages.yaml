  md: '# Troubleshooting


    If you have a large cluster, refer to the recommendation on the page https://slurm.schedmd.com/high_throughput.html.
    In case of problems, the first place you want to look at is logs of code. By default,
    there are not so much information, so try to increase the verbosity of the logs
    and properly fine-tune DebugFlags to concentrate on something specific. Note that
    you can temporarily change them on the fly using control setdebug LEVEL and control
    setdebugflags {|-FLAG [+||-FLAG ...]. If you add ''nodes=...'' with the nodes
    list, your changes affect only specific nodes.


    Another good tool for looking inside your job manager sdiag. It shows useful statistics,
    especially RPC stats, so you can detect if your Slurm is under request storm.


    Agent queue size: 0


    Remote Procedure Call statistics by message type REQUEST_PARTITION_INFO (2009)
    count:325127 ave_time:183 total_time:5974845


    Remote Procedure Call statistics by user root ( 0) count:228986 ave_time:10228
    total_time:456422703 user1 ( 25002) count:29784 ave_time:13439 total_time:269036
    ...


    sacctmgr show stats gives you information about accounts and used resources; sacctmgr
    show problem displays issues, which Slurm treats as potential problems; and sacctmgr
    runjobs checks for jobs, which are orphaned somehow and ask for ifany control
    show config shows the current configuration parameters; they may differ from your
    actual slurm.conf, so it is useful to check for unexpected values.


    OK, you detected something odd and want to fix it. Depending on the type of the
    problem, the solutions may be quite different – sometimes you need to adjust users
    or accounts limits, sometimes you need to change Slurm scheduler parameters. In
    the second case, you usually want to change options using SchedulerParameters.
    There are a lot of them; here are some useful:'
