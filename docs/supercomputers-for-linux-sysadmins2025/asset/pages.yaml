    # PETSc


    PETSc (pronounced “petsy”) library was originally designed for problems that actively
    use the solution of partial differential equations. The library’s Internet address
    is https://petsc.org/release/. PETSc (Portable, Extensible Toolkit for Scientific
    Computation) is a set of data structures and procedures that are the building
    blocks for implementing large-scale application programs for both serial and parallel
    computers.


    This library has in its arsenal not only differential equations, but many other
    algorithms used in scientific calculations. PETSc uses the MPI standard, the hybrid
    MPI+thread model, and the MPI+GPU model (note that not all algorithms use these
    models). PETSc includes an extended package of linear and nonlinear equation solvers
    and time integrators that can be used in applications written in Fortran, C, and
    C++. The library is organized hierarchically, allowing users to select the levels
    of abstraction appropriate to their private problem. The library can be used with
    C, C++, Fortran, and Python.'
