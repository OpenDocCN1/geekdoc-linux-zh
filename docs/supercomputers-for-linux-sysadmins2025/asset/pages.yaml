    # Network Commands


    Since computing clusters are inherently networked structures, networking commands
    play an important role for cluster administrators. Let’s consider the most essential
    of them.


    The ping command is a command for checking the connection between two computers
    in networks requests on the TCP/IP protocol stack. The command sends Echo-Request
    to the other computer via ICMP protocol and receives incoming responses. By timing
    the time between sending a request and receiving a response, the program determines
    the delay in packet transmission along the route and the frequency of packet loss,
    allowing you to assess the quality of the network connection between two nodes.'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# CHAPTER 7 UNIX AND LINUX – THE BASICS


    Command syntax:


    ping [options] the host name or its IP address


    Example:


    ```

    ping host1.mynet

    PING host1.mynet (10.0.1.2) 56(84) bytes of data.

    64 bytes from host1.mynet (10.0.1.2): icmp_seq=1 ttl=64 time=4.69 ms

    64 bytes from host1.mynet (10.0.1.2): icmp_seq=2 ttl=64 time=0.169 ms

    64 bytes from host1.mynet (10.0.1.2): icmp_seq=3 ttl=64 time=0.120 ms

    --- host1.mynet ping statistics

    3 packets transmitted, 3 received, 0% packet loss, time 2002ms

    rtt min/avg/mdev = 0.120/1.661/4.694/2.144 ms

    ```


    When without a special option, the ping command in UNIX-like systems runs indefinitely,
    sending each request has its own number, by which the program determines whether
    it reached the target computer or not. In the command output, the number of request
    is shown in the icmp_seq field, the ttl – Time To Live – defines the lifetime
    of the response packet, specified in the number of nodes. This is exactly how
    many nodes the packet can pass through while traveling the route to the destination
    node.


    Each node through which the packet passes decreases the ttl value by one; if the
    counter value becomes zero, the packet will be destroyed as “lost” and will not
    be sent further along the route. The last field shows the message exchange time
    between the two nodes.


    You can terminate the ping command from the terminal by pressing the Ctrl-C key
    combination, with which the ping command will display the work statistics: how
    many packets were sent, how many were received, the percentage of lost packets,
    and the total running time in milliseconds. In addition, the minimum, average,
    and maximum packet transit times are displayed.


    The main options of the ping command:


    +   -c count limits the number of packets sent to the count value.


    +   -n cancel conversion of the IP address of the responding host to its DNS name.
    This mode can speed up the program and eliminate problems with DNS settings during
    network diagnostics.'
