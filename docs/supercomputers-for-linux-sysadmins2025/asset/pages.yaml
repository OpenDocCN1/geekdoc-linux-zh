  md: 'The concept of a process is a basic concept in any OS. Processes and threads
    should not be confused; it is important to know what is real and virtual memory
    of a process, how shared objects (so) and dynamic linker (ld. so) work. Look for
    documentation on these topics in your OS distribution or in the extensive documentation
    on the Internet.


    # Access Rights


    UNIX-like operating systems were originally designed as multiuser systems, which
    means that user use data and processes need to be protected from unwanted encroachment
    by other users. I already mentioned “process rights”, e.g. that your process cannot
    send a signal to another user, unless you have special rights to do that. The
    same principle is applied to the division of rights to other objects in the OS.


    The basic mechanism for separating rights in UNIX-like systems is based on the
    concepts of UID or user ID and GID or group ID. UIDs and GIDs are numbers, but
    it is common to associate text names with them. Each process has a “real” UID
    and GID (ruid/rgid) that does not change over time, as well as a list of additional
    groups to it belongs. In addition to the real, a process has “effective” UIDs
    and GIDs (euid/egid), which define its current capabilities (i.e., they are used
    to determine its rights), and “saved” UID/GID (suid/sgid) - the effective UIDs/GIDs
    are copied into them when the UID/GID is changed. UID/GID can be changed if a
    process has such permission (capability) or if EU or SU is 0.


    A user with UID = 0 usually has the text name ‘root’ and has almost unlimited
    permissions, so they are often referred to as ‘superuser’.


    Most typically, we deal with rights on the file system. Here each object (file,
    link, directory, device, socket, channel, hereinafter we will write “file” for
    brevity) has an owner and group, as well as associated rights - read, write, and
    execute. Typically, the octal number or the format of the ls command is used to
    write them. For example, permissions with the octal code 750 (in ls output rwx-x---)
    mean that the owner is allowed to read, write, and execute (rwx / 7), the group
    is allowed to read and execute (x- / 5), and the rest are allowed nothing (---
    / 0).


    The rights are checked in this order - if the owner of the file matches the EUID,
    the owner’s rights are taken. Otherwise, if the group or one of the additional
    groups coincides with the group of the file, the rights of the group are taken
    and otherwise the rights of “others” are taken.'
  merge: -1
