    # NFS


    NFS (Network File System) is one of the first network file systems. It was developed
    by SUN in 1984 and allows you to work with a part of the file system of a remote
    server over the network. The client does not even know what file system is used
    on the server – all file operations are completely abstracted, and for the client,
    this file system looks like a local one.


    NFS implementation is based on the RPC protocol – Remote Procedure Call. This
    protocol allows the implementation of remote subroutine calls and is used in many
    other programs and protocols besides NFS. For RPC to work, it is necessary to
    install and run the portmap (Port Mapper) service. This service is something like
    DNS for RPC. By the name of an RPC service, it gets its “coordinates” on the server
    – the port on which it works. Therefore, an NFS server may not have a fixed port,
    although in practice it is usually port 2049.


    There are two common NFS protocols – v3 and v4.1 (usually specified as v4). NFS4
    has a lot of new features, comparing to v3, like encryption, parallel NFS (pNFS),
    and smarter locks lock. In reality, there is a lot of “peculiarities” in implementations
    as for the server and as for the client. If everything is compatible and well
    implemented, v4 may give you performance boost, but in many cases, it gives performance
    drop, instability, and even data loss. Be careful and test any NFSv4 feature before
    you enable it in the production.


    If you don’t like to use NFS as main file system, I would recommend to use NFSv3.
    Most common case today is using NFS for home users directories, Lustre or other
    parallel file system for “scratch” directories, where users store data, used for
    compute jobs. “Scratch” file system is not supposed to be a long-term storage,
    but provides high performance. Here I will speak only about NFSv3. For v4 features,
    please


    122'
