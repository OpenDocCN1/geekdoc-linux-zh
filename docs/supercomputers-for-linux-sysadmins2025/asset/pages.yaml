  md: '# CHAPTER 12 USERS – QUOTAS AND ACCESS RIGHTS


    task management system, so it depends heavily on which system you are using. Access
    to the system can be restricted in several ways: in the ssh configuration, through
    the pam_access module, by changing the shell. There are other options, but these
    are the most common.


    To block with sshd, insert a line of the form in the sshd_config configuration
    file

    DenyUsers user1,user2


    and restart sshd (running sessions will still work). After that, user1 and user2
    will not be able to log in. This option can also be used in the Match section
    if you limit its effect by some condition. Instead of DenyUsers, you can use AllowUsers
    if you want to deny access to all but a few users (e.g., during maintenance work).


    You cannot mix AllowUsers and DenyUsers options – only one of them will work.


    An alternative to this method is to use the pam_access module. First, you need
    to include it in the PAM chain for sshd (/etc/pam.d/sshd) or for all kinds of
    authorization (/etc/pam.d/system-auth). Open the file in an editor and insert
    a line at the beginning:

    account required pam_access.so


    Edit the /etc/security/access.conf file by adding a line to the end:


    ```

    +:ALL:ALL

    ```


    The file format is simple: each line has three fields separated by a colon. The
    first field is a plus sign to allow access or a minus sign to deny access. The
    second field is a list of user/or or group names, separated by a space. The third
    field is a list of addresses to which the rule applies.


    To specify a user group, add an ‘@’ sign to the beginning of its name, e.g., ‘@wheel’.
    ALL keyword means all users. It is allowed to use the EXCEPT keyword, which indicates
    to exclude from the listed users or groups (e.g., ‘ALL EXCEPT @wheel’). You can
    specify the keyword in the address list, as well as the IP or DNS address or network
    (e.g., 10.0.0.0/8), terminal name (e.g., tty1, :0), or the LOCAL keyword to log
    in from the console or on behalf of a local service.'
