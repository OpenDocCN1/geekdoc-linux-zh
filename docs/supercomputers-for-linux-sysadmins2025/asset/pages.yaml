  md: '# CHAPTER 23 BOOTING AND INIT


    To set up a tftp server, it is enough to install the standard package from the
    distribution and configure it to distribute a separate directory (usually /tftproot
    or /srv/tftproot). In network booting, an OS bootloader is passed to the network
    card via the TFTP protocol. This is regulated by the standard PXE (Preboot Execution
    Environment, pronounced “pixie”) environment. Typically, a file from the syslinux
    package is used as the bootloader. Install this package and copy the file /usr/share/syslinux/pxelinux.0
    to the root directory of the TFTP server.


    Besides the bootloader, the kernel and initrd image to be booted and the directory
    with the bootloader configurations should be copied to this directory. If all
    nodes are loaded the same way, you can use one configuration file for all of them.
    All configuration files are located in the pxelinux.cfg directory, you need to
    create it yourself. Make sure it is read-only for everyone. The default configuration
    file is named default.


    An example of such a file:


    ```

    default linux

    timeout 30

    label linux

    kernel vmlinux

    append initrd=myinitrd splash=silent ip=dhcp root=/dev/nfs \

    fsroot=192.168.123.1:/noderoot,rsize=8192,wsize=8192,\nretrans=10,soft,intr


    label single

    kernel vmlinux

    append initrd=myinitrd single ip=dhcp root=/dev/nfs \

    fsroot=192.168.123.1:/noderoot,rsize=8192,wsize=8192,\nretrans=10,soft,intr

    ```


    Here the long lines are moved for ease of reading, but in a real file, everything
    should be on one line. At the beginning, we specify the default linux boot option,
    with a timeout of three seconds (timeout 30). Then we describe the boot options
    themselves. In this case, there are two of them – linux and single. The label
    directive marks a new variant and its name. The kernel directive specifies the
    name of the kernel file on the TFTP server, and the append directive specifies
    the kernel parameters.'
