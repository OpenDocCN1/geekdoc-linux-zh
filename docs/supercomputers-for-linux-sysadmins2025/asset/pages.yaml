  md: '# CHAPTER 8


    # UNIX and Linux – Working Techniques


    For those who are already familiar with Linux and bash, here are a few tricks
    that can save time, nerves, and effort. We will also look at a few Linux-specific
    subsystems that allow you to fine-tune your system.


    # The Magic of sysctl


    The Linux kernel allows you to change some parameters of its operation on the
    fly and to keep track of internal information. For this purpose, a special virtual
    file system proc is used, usually mounted in the /proc directory. Its subdirectories
    with numeric names reflect data about processes with corresponding PIDs (this
    is where ps, top, etc., commands get their data from). Other files and directories
    reflect various information about the system, but we will be interested in the
    sys subdirectory. It contains global settings, which are organized according to
    the principle of one file – one value. It is very similar to the registry in Windows.


    To read a value, it is enough to output the contents of the corresponding file,
    e.g., with the cat command. To change the value, redirect the desired number or
    string to the file, e.g., with the echo command, and redirect the output


    ```

    $ echo 1 > /proc/sys/net/ipv4/ip_forward

    $ cat /proc/sys/net/ipv4/ip_forward

    ```


