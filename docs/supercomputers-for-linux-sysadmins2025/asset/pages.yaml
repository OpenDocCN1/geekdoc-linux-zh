  md: '# CHAPTER 10 REMOTE MANAGEMENT


    modprobe ipmi_devintf

    modprobe ipmi_si

    modprobe ipmi_msghandler


    The ipmitool command can work with the local MC, and we can configure it, e.g.,
    for network access. If network access is already configured, you can do something
    on the remote MC with the command:


    ipmitool -I lan/lanplus -H host -U user -P password COMMAND


    The -I option specifies the protocol version: lan for 1.5 and lanplus for 2.0
    and higher. These versions are not compatible with each other, and backward compatibility
    is typically not ensured, you must explicitly specify the protocol version. For
    local MC, the command is specified directly after ipmitool. Table 10-6 presents
    the main commands, rather classes of commands, since almost every command has
    subcommands.


