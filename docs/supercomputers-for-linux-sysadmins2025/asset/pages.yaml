- img_proc: true
  md: '# CHAPTER 5 INFINIBAND


    Once started, the subnet manager uses the subnet: subnet management packets transmitted
    via directed routes to find out the structure of the subnet: adapters, switches,
    routers, and links are there between them. If after determining the subnet structure
    it turns out that there are no other higher priority SM in this subnet, this manager
    becomes active and configures the subnet, assigns LID to all ports, tells each
    end port the LID of the port on which the SM is running, sets up switch forwarding
    tables, and makes some other settings. After, the subnet is ready for operation.
    While the subnet is running, the SM receives notifications about changes to the
    network structure and reconfigures the subnet accordingly. The SM also periodically
    collects information about the topology of the subnet from scratch, like when
    the subnet initialization occurs, not relying on the reliability of topology changes
    notifications. This process is called


    Sweeping.

    The spare managers poll the master from time to time, and if the master responds,
    one of the spare managers becomes the master and reconfigures the subnet by pointing
    it to the location of the new SM.


    Note that bad ports in the network (node hangs, bad cable, etc.) slow down the
    collection, and SM sweep time, which can lead to the overall network failures,
    such as nodes network loss, shared file system break, etc. The same can happen
    if the SM takeover takes too long.


    In the modern IB networks, you can see Uniform Fabric Manager (UFM), which also
    has the role of SM. UFM usually has more features than a regular SM, like WebUI,
    regular network check and sending reports, etc. It is required if you need support
    for NVIDIA Scalable Hierarchical Aggregation and Reduction Protocol (SHARP). This
    technology allows performing collective operations, like barriers, summation,
    etc., directly on the switches, and UFM is required to configure them accordingly.


    # IP Over InfiniBand (IP Over IB, IPoIB)


    The operation of the TCP/IP protocol stack over InfiniBand is not part of the
    InfiniBand specification; it is defined in the relevant RFC documents. InfiniBand
    operation is quite possible without IPoIB. However, some programs and libraries,
    although designed to work over InfiniBand, also require working over InfiniBand.
    Most often IPoIB is used to determine InfiniBand identifiers (LIDs, GIDs) of processes
    running on other compute nodes, and once determined, further communications are
    performed without the TCP/IP stack.'
