  md: '# Manuals


    There are several thousand commands in the UNIX system, but a few dozen commands
    are enough for a user to know well in normal work. In this manual, we will briefly
    review a small set of the most common commands. First, we will need commands for
    working with directories and files. As before, we will specify optional parameters
    in square brackets.


    The most important command you will need is man. Its name comes not from man,
    but from manual. It is the main source of reference information on commands, packages,
    and much more in UNIX and Linux. All information in man is divided into sections,
    historically numbered (See Table 7-4).


    # Table 7-4. Sections of the man help


    | Number | Section |

    |---|---|

    | 1 | User commands |

    | 2 | System calls |

    | 3 | C standard library functions |

    | 4 | Devices and special files |

    | 5 | File formats and format conventions |

    | 6 | Games, etc. |

    | 7 | Miscellaneous |

    | 8 | System administration and daemons |


    As a rule, to get help on a command, just man command_name. Man command will find
    the first page with the given name and display it. Since there may be pages with
    the same name in different sections, sometimes it is necessary to specify the
    section number explicitly. For example, the man crontab command will display information
    on the crontab file from section 1. To display help on the format of the crontab
    file, you should type man 5 crontab, to display the list of files in which the
    required word is mentioned - man -k word. And of course, don''t forget to execute
    man man.


    In addition to man, there is also the info command, which was intended to replace
    man, but despite a lot of new features, it has not become popular. But many aspects
    of standard programs and services are described in info in much more detail than
    in man.'
