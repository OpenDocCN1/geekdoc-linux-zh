  md: '# CHAPTER 14


    # OpenPBS and Torque


    PBS (Portable Batch System) and its clones have gained great popularity. The system
    started to be developed in 1991 by NASA order. Most of the developers involved
    in its creation were employees of MRJ Technology Solutions. MRJ was absorbed by
    Veridian, from which Altair Engineering acquired the rights to the PBS. Transfer
    of PBS technologies to Altair Engineering and discontinuation of support for the
    open source version of OpenPBS led to the fact that there are now three implementations
    of distributed computing management systems based on PBS:


    +   1. The original “open source” OpenPBS project, developed in 1998 by MRJ (not
    supported since 2004).


    +   2. Torque (Terascale Open-Source Resource and QUEue Manager) is a project
    based on OpenPBS and maintained by Adaptive Computing Enterprises, Inc.


    +   3. PBS Professional (PBS Pro) is a commercial implementation offered by Altair
    Engineering.


    # Installing Torque


    The Torque package consists of four main components:


    +   1. A set of commands that includes system administrator commands to configure
    the system and control its operation and user commands to run and manage tasks.


    +   2. pbs_server, which is the central PBS server. The central server accepts
    tasks from users, deletes tasks, changes their status, logs completed tasks, and
    so on.'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# CHAPTER 14 OPENPBS AND TORQUE


    +   3. pbs_mom is a "machine oriented mini-server" (agent) that must run on each
    compute node and monitors the state of the compute node and the program running
    on it; starting with torque 4.0, the trqauthd authentication server must run with
    it.


    +   4. pbs_sched is a scheduler that manages task queuing and running tasks for
    execution.


    Note that Torque allows the use of third-party schedulers, and often Maui scheduler
    is used in conjunction with Torque, which has more functionality than the standard
    scheduler. Depending on what functional tasks are assigned to the computer included
    in the compute cluster, either all or some components of the system can be installed
    on it.


    The Torque system is most fully installed on the cluster management computer.
    Since tasks are not started on the management computer, there is no need to run
    the pbs_mom server on. As a rule, it is started to be monitor the status and load
    of the control server. Torque does not require any of the above components to
    run on a single cluster. For large clusters, Individual components can be spread
    across different computers; for small clusters, the management computer can easily
    handle all services.


    Torque is installed from distribution packages or source code, which can be obtained
    from https://github.com/adaptivecomputing/torque. Installation from source is
    done in the standard Linux way in three steps: ./configure; make; make install
    # or make packages.


    Torque services communicate with each other via fixed network port numbers. Port
    numbers for Torque are defined in the /etc/services file, which links port numbers
    and network names:


    | pbs | 1501/tcp | # pbs server |

    | pbs_mom | 15002/tcp | # mom to/from server |

    | pbs_resmom | 15003/tcp | # request mom to manage resources |

    | pbs_sched | 15004/tcp | # scheduler |


    Make sure that these ports are not blocked by a firewall. For compute nodes, the
    only required component of the Torque system is the pbs_mom server.'
