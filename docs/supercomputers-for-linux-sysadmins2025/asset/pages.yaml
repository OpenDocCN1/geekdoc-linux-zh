  md: '# CHAPTER 15 SLURM


    AccountingType and JobType specify how to store the accounting data. In this example,
    the task data will simply be written to a file. Commands to process this data,
    such as sacct, will not work.


    The NodeName and PartitionName can be repeated, i.e., you can enter a different
    NodeName string for each node or group of nodes, and if you need multiple partitions,
    each is described by its own string. Note the name range entry, Slurm uses it
    wherever it can. You can use square brackets in the multiple node entry to specify:
    a numeric range (e.g., [15-33]) or a list that includes ranges ([1-4,6,8]). Slurm
    does not include any tools to convert “brackets” notation to plain lists and vice
    versa, but there are some external tools for that, e.g., cluset for ClusterShell
    package.


    # Partitions


    Slurm uses several concepts in addition to those mentioned before, and here you
    can find the most useful of them. You already know about partitions if you read
    the subchapter above; if not, it is a set of nodes, possibly with some limits.
    Partitions can be nested, share the same nodes, or even intersect. Each partition
    in Slurm can have some important attributes, which you can specify in the partition
    definition in the configuration file and change temporarily via control:


    | Name | Meaning |

    |---|---|

    | Nodes | The list of nodes belongs to this partition |

    | AllowAccounts, AllowGroups | List of accounts or groups, allowed to use this
    partition; Deny-based options are also here |

    | Default | “yes,” all commands without explicit partition name specified will
    use this partition |

    | DefaultTime | If no time limit is specified in sbatch/run, this value will be
    used |

    | MaxTime | Maximal time limit, which can be specified |

    | Hidden | “yes,” the partition won’t be shown by default in any commands for
    nonadmin users; if the name is given explicitly, it will be shown |

    | MaxCPUsPerNode | Force number CPUs per node, useful, e.g., if you don’t want
    to use hyperthread CPU cores |


    (continued)'
