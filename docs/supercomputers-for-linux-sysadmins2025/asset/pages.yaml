  md: '# CHAPTER 4 SUPERCOMPUTER HARDWARE


    To protect against unauthorized access to system services and sensitive data (e.g.,
    a database of user passwords), the functions of control nodes are usually divided
    into two groups: access nodes and control nodes. **Access nodes** are intended
    for user login and further work in the system, and **control nodes** are intended
    for operation of the task management system.


    Almost any cluster has a **network file system**, which means a server for it,
    and often a whole farm if the file system is distributed. A fairly common service
    node is a **license server**, which hosts special services responsible for licensing
    commercial software and utilities. For example, a FlexLM server can be used for
    several commercial software packages.


    Locating license services on a separate machine is justified both from the point
    of view security (protection against theft of license files) and from the point
    of view of increasing fault tolerance of the complex as a whole. Be sure to make
    a note of the MAC address of this server; if it is suddenly replaced, it will
    be enough for many programs to set the old MAC address on the new server. And
    not to forget to request a license reissue for the new server, of course with
    its real MAC address.


    In modern computing complexes, **input data preparation and output data processing
    nodes** (so-called pre- and postprocessing nodes) are quite common. Such nodes
    are characterized by a larger amount of RAM than other nodes (256 GB or more),
    which is extremely important for preparing large tasks and processing the results
    of calculations.


    So-called **visualization nodes** are often useful. Usually, these are dedicated
    servers with special graphic cards for processing visual information and outputting
    the finished picture through the network to a remote user. This can be convenient,
    in particular, for remote preparation of tasks for calculation (e.g., for visualization
    of meshes and other input data). Visualization nodes can play the role of pre-/postprocessing
    nodes.


    **Storage nodes** can be used to organize a distributed data storage. Each node
    is connected to its own disk storage, and all storage nodes are united into a
    single network with common access to the file system from all nodes (more about
    this in the next section).


    There may also be dedicated nodes among the service nodes:


    +   * Backups

