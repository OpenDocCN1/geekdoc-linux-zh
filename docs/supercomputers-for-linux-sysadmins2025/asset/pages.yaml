    Here rescue is the name of the target, in this example a single-user mode.

    There are various kinds of units in systemd, the following are the main ones:


    +   - service - Services that can be started and stopped. Services can be

    classic SysV scripts of daemon initialization.

    - slice - A group of processes, in a separate cgroup space (e.g., user

    session, cron task, etc.).

    - socket - Bind points to network or file sockets, allowing to build an

    association with a certain service (analog of inet).

    - device - Elements of the device tree that can be handled by udev.

    - mount - Specify the file systems used, which are found in /etc/fstab.

    - automount - Determines which FS to mount when accessing a given

    directory.

    - target - Used for logical grouping of units. For example, multi-user.target
    is identical to runlevel5, bluetooth.target causes a

    bluetooth subsystem to initialize, etc.

    - timer - Designed to replace cron, runs on a schedule.


    Each unit can require other units for its correct operation, conflict with units,

    define possibility to run only after or before a certain unit (configuration directives

    Requires, Conflicts, Before, After, Wants). Systemd starts each unit in a separate

    namespace, which allows you to group all processes running within a unit (and
    if

    necessary, terminate them forcibly), set uniform restrictions for them, etc.

    You can get a list of running services by using the systemctl command, which gives

    t administrator a wide range of options for managing services. Common uses of
    this

    command are presented in Table 23-1.'
