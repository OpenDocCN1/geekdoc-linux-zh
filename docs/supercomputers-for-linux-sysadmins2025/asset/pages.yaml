  md: "# Reservations\n\nReservation is a way in Slurm to future the future. Other\
    \ users' assignments to these nodes will not be allocated, individual users for\
    \ a time in, even if the nodes are free. This is useful as dedicated calculations,\
    \ as for the maintenance, because admins can run test jobs on the nodes and keep\
    \ users in queue.\n\nIn a reservation, you should specify the number or exact\
    \ list of reserved nodes, start time, end, or duration. You can also specify a\
    \ list of allowed users or accounts, reservation name, and special flags. Let's\
    \ look at an example:\n\n```\ncontrol create reservation name=important \\\nStartTime=2100-06-01T08:00:00\
    \ Duration=5:00:00 \\\nUsers=user1,user2 NodeCnt=100 Flags=IGNORE_JOBS\n```\n\n\
    Here we have created a 100 node reserve for user1 and user2, which will be available\
    \ to them from 8am to 2100-06-01 for few hours. The IGNORE_JOBS flag means “if\
    \ the required number of nodes have not been released by this time, ignore it,”\
    \ and in this case, there may be fewer nodes than requested at the start of the\
    \ reservation. To use this, user must specify a key to the sbatch/run command:\n\
    \n```\nsbatch --reservation=important -N100 ./my_task\n```\n\nOther useful (but\
    \ not all) flags are\n\n+   - OVERLAP – Allow the list of nodes to overlap other\
    \ existing reservation(s).\n- NO_HOLD_JOBS_AFTER – By default if the reservation\
    \ ends, any tasks submitted to it will be held. This flag allows tasks to remain\
    \ in pending state. This flag cannot be removed using ‘='\n- DAILY, HOURLY, WEEKLY\
    \ – Repeat the reservation every day, hour, or week.\n- WEEKDAY, WEEKEND – Like\
    \ DAILY, but on weekdays or weekends.\n- STATIC_ALLOC – By default if you ask\
    \ to reserve a number of nodes and any node, selected for the reservation, goes\
    \ down, then a new node is added to the reservation (if possible). This option\
    \ prevents.\n MAINT – Like OVERLAP and STATIC_ALLOC together."
