  md: '# CHAPTER 5


    # InfiniBand


    Let''s separately take a look at InfiniBand network technology. On the one hand,
    this technology is widespread in the world of high-performance computing, and
    many administrators of HPC clusters have to deal with this technology in their
    work. But on the other hand, InfiniBand is quite different from Ethernet, which
    most network administrators are used to, and there are many difficulties when
    getting acquainted with it for the first time.


    InfiniBand standard is developed by the InfiniBand Trade Association; InfiniBand
    is an open technology whose standards are published and available, although there
    are vendor-proprietary extensions. There is also a set of open source software
    called OFED (OpenFabrics Enterprise Distribution), which contains everything needed
    to work with InfiniBand-based networks (except for adapter drivers, perhaps).
    InfiniBand equipment manufacturing companies may also release their own versions
    of the software stack. Most often they include OFED and additional components
    oriented to work with the equipment of a particular vendor.


    A link in InfiniBand network consists of multiple lanes operating in parallel.
    Each link works as a bidirectional communication channel. The most commonly used
    links are 4x lanes (four lanes working in parallel). 12x links are mostly used
    to connect individual elements, frequently switch chips, within one large switch,
    but the latest standards are going to use it for regular links too. The speed
    of data transmission over the line depends on the generation of the InfiniBand
    standard. PCB connections, copper wires (for short distances), and optical cables
    can be used for data transmission, often sold with transmitters. See Table 5-1
    for information on data transmission standards.


    InfiniBand networking materials usually specify the "raw" data rate, i.e., the
    rate at which data is physically transmitted over the transmission medium. In
    this case, the user data is encoded before transmission to recover from possible
    line errors. For SDR-QDR generations, the 8 bits of user data are turned into
    10 bits to be transmitted, and'
