    The last method is to change the shell. As you know, when a user logs in successfully,
    a shell process is started for the user to execute commands. Even if the user
    executes a separate command (e.g., ssh remote uptime), it is still executed through
    the shell.

    So if you change the default shell to a command like /bin/false, the user will
    not be able to execute any program. To change the shell, use the chsh command:


    ```

    chsh -s /bin/false user1

    ```


    For the command to work, you must first put the /bin/false command in the /etc/shells
    file. In some cases this method can be bypassed, but be careful.

    Somentimes you want to restrict users, but still be able to access files via scp/sftp.
    This can be done through the Match settings in the ssh configuration, which is
    usually very cumbersome. You can use the scponly package, which is available in
    most distributions and provides a special shell that allows only executing commands
    for sftp/scp. After installing the package, just change the user shell to /usr/bin/scponly.

    Blocking a user from logging in via ssh with usermod may not work if pam is not
    enabled in openssh settings. In addition, it will be difficult to get a current
    list of blocked users, so this method is not very good.


    # Brief Summary


    Restriction systems serve not much to prohibit as much as possible, but to protect
    the users themselves from making silly mistakes and, of course, deliberately (or
    not deliberately) causing harm. Use them wisely and you can avoid a lot of trouble.


    # Search Keywords


    chmod, chown, setfacl, ulimit, setquota, ssh_config'
