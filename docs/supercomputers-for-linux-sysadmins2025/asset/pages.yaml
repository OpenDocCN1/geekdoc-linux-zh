- img_proc: true
  md: "# CHAPTER 21 COMPILERS AND ENVIRONMENTS, FOR PARALLEL TECHNOLOGIES\n\nFor any\
    \ package or library, it is possible to create a “module” – a file describing\
    \ what should be added or removed from the required user environment variables\
    \ when loading or deleting the module. You can easily “switch” between compilers,\
    \ MPI implementations, and add environments to work with application packages.\
    \ All commands are implemented through a single command (actually a shell function)\
    \ – module. It takes as an argument the name of the command and additional arguments,\
    \ usually a list of modules. 21-1 presents the list of the main commands.\n\n\
    # Table 21-1. Basic module commands\n\n| Command | Meaning |\n| --- | --- |\n\
    | addilang | Add modules to the environment |\n| rmunload | Uninstall modules\
    \ from the environment |\n| displayshow | Show information about the specified\
    \ modules |\n| avail | Show list of available modules |\n| switchiswap | Switch\
    \ the status of the specified modules: if loaded – unload, if not – load |\n|\
    \ use [--append] | Add a directory with module files |\n| unuse | Delete the directory\
    \ with module files |\n| update | Try to reload all loaded modules by updating\
    \ the environment |\n| purge | Unload all modules |\n| list | Show loaded modules\
    \ |\n| clear | Clear the list of loaded modules, but do not change the environment\
    \ |\n\nFor a complete list of commands and options, please refer to the documentation.\
    \ Here is an example for OpenMPI:\n\n```\n##Module1.###################################\n\
    proc ModulesHelper { \n    global version\n    puts stderr \"\\tThis module will\
    \ set up \\\n      environment for OpenMPI 4.0.1 \\\n      (build by Intel compilers)\"\
    \n    puts stderr \"\\n\\tVersion $version\\n\"\n}\n```"
  merge: -1
