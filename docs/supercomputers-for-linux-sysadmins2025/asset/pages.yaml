    # NVIDIA Base Command Manager


    This product is proprietary and doesn''t have a “community edition” (at 2025),
    but it has a free license for the cluster of 16 nodes and 16 GPUs or less. Formerly
    it had lite **Bright Cluster Manager**, and you might hear about before. This
    solution is HPC-oriented and provides compute provisioning, storage setup, network
    switches control, monitoring. OS consistency control, and many more. IB and CUDA
    support is available out of the box, Slurm setup and control are included by default,
    and other job management systems are available.


    In addition, there is support for Kubernetes and CEPH, if it is needed for any
    tasks. Baremetal clusters can be combined with cloud nodes; fully cloud clusters
    are also supported. Available providers are Amazon EC2, Microsoft Azure, and Oracle
    Cloud, but new ones are added gradually. One of the most interesting features
    is seamless Slurm integration – new nodes are automatically added into the Slurm
    configuration and become available just after provisioning and are removed if
    you delete the node in the configuration. Base Command Manager supports integration
    with external LDAP, DHCP, and DNS servers, which makes it easy to integrate into
    existing infrastructure.

    Command-line interface makes automated control simple, but you can use web UI.
    My experience using BCM is very positive, but note that it requires commercial
    license.'
