  md: '# Conman


    Using a remote console connection via IPMI is really helpful in many cases, but
    sometimes raw ipmitool is not convenient, especially when you need to monitor
    consoles on several remote servers. In this case, you can use helper programs,
    like conman. It is a "console manager," which can keep the connection to a remote
    (local) console open, you can see the current status. In the case of conman, you
    can even automate some operations. There are some alternatives, e.g., xCAT includes
    r utility, which has similar functions. Conman does not support power management,
    but for this goal, I recommend using powerman³ project, which supports IPMI and
    wide range of remotely controlled PDU modules.


    I highly recommend using such console managers, as they significantly improve
    your efficiency in remote debugging.


    # iKVM


    KVM is an abbreviation for Keyboard+Video+Mouse. This is a system that allows
    you to connect a single console set (monitor, keyboard, and possibly a mouse)
    to multiple system units. These were originally physical signal switches and can
    still be found on the market today. Many rack-mounted consoles provide this capability.


    iKVM (or KVM-over-IP) is a device that allows you to get a picture from the screen
    and emulate the work of a keyboard and possibly a mouse connected to a computer
    via a network. There is no single standard for implementing this technology, so
    different manufacturers provide completely different features and interfaces.


    Most of them use a browser with Flash, Java, or a special plug-in installed as
    a client. The iKVM support itself can be built into the server or implemented
    by an external device. In the latter case, you will have to connect video and
    keyboard cables from the required servers to it. External iKVM devices cannot
    always provide power management of the connected servers unless built-in ones,
    I advise you to choose in favor of built-inKVM support.


    > ³https://github.com/chaos/powerman'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'CHAPTER 10 REMOTE MANAGEMENT


    As it was said, there is no standard for the iKVM protocol, which means that you
    probably can''t automate iKVM for mass administration tasks, such as changing
    a parameter in the BIOS for all nodes. If there is a protocol description for
    the iKVM implementation you are using, will be a big plus for you. Either way,
    iKVM will be a great complement to ssh and IPMI. Unlike them, iKVM allows you
    to see the output of a hung node, which makes diagnosing problems much easier.


    # Brief Summary


    Because the number of nodes in a cluster is usually large, remote command execution
    for administration and monitoring becomes critical. Use all the options you have
    for effective remote management – ssh, pdsh, IMPI, ILO, iKVM, SNMP, and other
    services.


    Take into account the peculiarities of these programs and services: they can poorly
    tolerate intensive load, as well as not very sparing to your network, and running
    in parallel a thousand copies of the file via scp, you can create difficulties
    connecting the head machine with the rest of the nodes.


