    This command will copy the contents of the data_dir directory along with subdirectories
    on the remote machine host1 to the local directory /backups/host1/data dir. To
    ensure that the data_dir directory is not created and only its contents are copied,
    the specify prescribes as host1:data_dir/, i.e., adding a slash to the directory
    name. The key ‘-a’ preserves saving of meta-information, like permissions, attributes,
    symbolic links, etc., ‘-w’ reporting the copying process, and ‘-z’ compressing
    the data during transmission.


    To explicitly specify ssh for remote access, with logging in as a specific user
    and with a non-standard private key, specify the -e switch:


    ```

    rsync -av -e "ssh -l backuper -i secret_key" \

