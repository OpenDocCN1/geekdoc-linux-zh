    having 5000 nodes. GPFS supports RD technology for InfininiBand.


    Metadata in GPFS is distributed, there is no dedicated metadata servers, and it
    supports indexing of directory entries for very large directories. It includes
    special heartbeat and quorum protocols, which allows keeping working in degraded
    mode


