  md: '# MANAGING THE BOOT PROCESS AND SCHEDULED PROCESSES


    # OBJECTIVES


    After completing this section, you should be able to manage service startup, schedule
    processes with, at, cron, and systemd-reboot, and control the default boot target
    on managed hosts.


    # SCHEDULING WITH THE AT MODULE


    Quick one-time scheduling is done with the at module. You create the job for a
    future time to run and it is held until time comes to execute. There are six parameters
    that come with this module. They are: command, count, script_file, state, unique,
    and units.


    The at module Example:


    +   - name: remove tempuser.

    at:

    command: userdel -r tempuser

    count: 20

    units: minutes

    unique: yes


    Parameters


    | PARAMETER | OPTIONS | COMMENTS |

    | --- | --- | --- |

    | command | Null | A command that is scheduled to run. |

    | count | Null | The count of units. (Must run with) |

    | script_file | Null | An existing script file to be executed in the future. |

    | state | absent, present | The state adds or removes a command or script. |

    | unique | yes, no | If a job is already running, it will not be executed again.
    |

    | units | minutes/hours/days/weeks | The time denominations. |


    # APPENDING COMMANDS WITH THE CRON MODULE.


    When setting a jobs task the cron module is used. The cron module will append
    commands directly to the crontab of the user designate.'
