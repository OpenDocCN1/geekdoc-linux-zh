    In this example, the copy module is used to copy a file located in the Ansible
    directory on the control node to selected managed hosts.


    By default this module assumes that force: yes is set. That forces the module
    to overwrite the remote file if it exists but contains different contents from
    the file being copied. If force: no is set, then it only copies the file to the
    managed host if it does not already exist.'
