  md: "# CHAPTER 5 | Implementing Task Control\n\nBlocks also allow for error handling\
    \ in combination with the **rescue** and **always** statements. If any task in\
    \ a block fails, tasks in its **rescue** block are executed in order to recover.\
    \ After the tasks in the block clause, as well as the tasks in the rescue clause\
    \ if there was a failure, then tasks in the **always** clause run. To summarize:\n\
    \n+   - **block**: Defines the main tasks to run.\n- **rescue**: Defines the tasks\
    \ to run if the tasks defined in the **block** clause fail.\n- **always**: Defines\
    \ the tasks that will always run independently of the success or failure of tasks\
    \ defined in the **block** and **rescue** clauses.\n\nThe following example shows\
    \ how to implement a block in a playbook. If tasks defined in the **block** clause\
    \ fail, tasks defined in the **rescue** and **always** clauses are executed.\n\
    \n```\ntasks:\n  name: Upgrade DB\n  block:\n    name: upgrade the database\n\
    \    shell:\n    cmd: /usr/local/lib/upgrade-database\n  rescue:\n    name: revert\
    \ the database upgrade\n    shell:\n    cmd: /usr/local/lib/revert-database\n\
    always:\n  name: always restart the database\n  service:\n    name: mariadb\n\
    \    state: restarted\n```\n\nThe **when** condition on a **block** clause also\
    \ applies to its **rescue** and **always** clauses if present.\n\n# REFERENCES\n\
    \n> ### Error Handling in Playbooks — Ansible Documentation\nhttps://docs.ansible.com/ansible/latest/user_guide/playbooks_error_handling.html\n\
    \n> ### Error Handling – Blocks – Ansible Documentation\nhttps://docs.ansible.com/ansible/latest/user_guide/playbooks_blocks.html#error-handling\n\
    \nRH294-RHEL8.0-en-1-201905351"
