  md: '# MANAGING FACTS


    # OBJECTIVES


    After completing this section, you should be able to reference data about managed
    hosts

    Ansible facts, and configure custom facts on managed hosts.


    # DESRIBING ANSIBLE FACTS


    Ansible facts are variables that are automatically discovered by Ansible on a
    managed host. Facts

    contain host-specific information that can be used just like regular variables
    in plays, conditionals,

    loops, or any other statement that depends on a value collected from a managed
    host.


    Some of the facts gathered for a managed host might include:


    +   * The host name

    * The kernel version

    * The network interfaces

    * The IP addresses

    * The version of the operating system

    * Various environment variables

    * The number of CPUs

    * The available or free disk space

    * The available disk space


    Facts are a convenient way to retrieve the state of a managed host and determine
    what action

    to take based on that state. For example:


    +   * A server can be restarted by a conditional task which is based on a fact
    containing the

    managed host''s current kernel version.

    * The MySQL configuration file can be customized depending on the available memory
    reported

    by a fact.

    * The IPv4 address used in a configuration file can be set based on the value
    of a fact.


    Normally, every play runs the setup module automatically before the first task
    in order to gather

    facts. This is reported as the Gathering Facts in Ansible 2.3 and later, or simply
    as setup

    in older versions of Ansible. By default, you do not need to have a task to run
    setup in your play. It

    is run automatically for you.


    One way to see what facts are gathered for your managed hosts is to run a short
    playbook that

    gathers facts and uses the debug module to print the value of the ansible_facts
    variable.'
  merge: -1
  pgno: 139
- img_proc: true
