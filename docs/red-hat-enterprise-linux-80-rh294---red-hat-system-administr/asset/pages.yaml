  md: "# CHAPTER 3 | Implementing Playbooks\n\n# IMPLEMENTING MULTIPLE PLAYS\n\n#\
    \ OBJECTIVES\n\nAfter completing this section, you should be able to:\n\n+   -\
    \ Write a playbook that uses multiple plays and per-play privilege escalation.\n\
    \n+   - Effectively use ansible-doc to learn how to use new modules to implement\
    \ tasks for a play.\n\n# WRITING MULTIPLE PLAYS\n\nA playbook is a YAML file containing\
    \ a list of one or more plays. Remember that a single play is an ordered list\
    \ of tasks to execute against hosts selected from the inventory. Therefore, if\
    \ a playbook contains multiple plays, each play may apply its tasks to a separate\
    \ set of hosts.\n\nThis can be very useful when orchestrating a complex deployment\
    \ which may involve tasks on different hosts. You can write a playbook that runs\
    \ one play against one set of hosts, and when finishes runs another play against\
    \ another set of hosts.\n\nWriting a playbook that contains multiple plays is\
    \ very straightforward. Each play in the playbook is written as a top-level item\
    \ in the playbook. Each play is a list item containing the usual play keywords.\n\
    \nThe following example shows a simple playbook with two plays. The first play\
    \ runs against web.example.com, and the second play runs against database.example.com.\n\
    \n```\n...\n# This is a simple playbook with two plays\n\n- name: first play\n\
    \  hosts: web.example.com\n  tasks:\n  - name: first task\n    yum:\n      name:\
    \ httpd\n      status: present\n\n  - name: second task\n    service:\n      name:\
    \ httpd\n      enabled: true\n\n- name: second play\n  hosts: database.example.com\n\
    \  tasks:\n  - name: first task\n    service:\n      name: mariadb\n      enabled:\
    \ true\n```\n\nRH294-RHEL8.0-en-1-20190531\n\n75"
