  md: "# CHAPTER S | Implementing Task Control\n\n| OPERATION | EXAMPLE |\n| --- |\
    \ --- |\n| Boolean variable is `true`. The values of `1`, `True`, or `yes` evaluate\
    \ to `true`. | `memory_available` |\n| Boolean variable is `false`. The values\
    \ of `0`, `False`, or `no` evaluate to `false`. | `not memory_available` |\n|\
    \ First variable's value is present as a value in variable's list | `ansible_distribution\
    \ in supported_distros` |\n\nThe entry in the preceding table might be confusing\
    \ at first. The following example illustrates how it works.\n\nIn the example,\
    \ the `ansible_distribution` variable is a fact determined during the **Gathering\
    \ Facts** task identifies the managed host's operating system distribution. The\
    \ variable `supported_distros` created by the playbook author contains a list\
    \ of operating system distributions that the playbook supports. If the value of\
    \ `ansible_distribution` is in the `supported_distros` list, the conditional passes\
    \ and the task runs.\n\n```\n-: Demonstrate the \"in\" keyword\n  hosts: all\n\
    \  gather_facts: yes\n  vars:\n    supported_distros:\n      - RedHat\n      -\
    \ Fedora\n  tasks:\n    - name: Install httpd using yum, where supported\n   \
    \   yum:\n        name: http\n        state: present\n      when: ansible_distribution\
    \ in supported_distros\n```\n\n> Notice the indentation of the `when` statement.\
    \ Because the `when` statement is not a module variable, it must be placed outside\
    \ the module by being indented at the top of the task.\n\n> A task is a YAML hash/dictionary,\
    \ and the `when` statement is simply one more key for the task like the task's\
    \ name and the module it uses. A common convention places any `when` keyword that\
    \ might present after the task's name and the module (and arguments).\n\n# Testing\
    \ Multiple Conditions\n\nOne `when` statement can be used to evaluate multiple\
    \ conditionals. To do so, conditionals can be combined with either the `and` or\
    \ `or` keywords, and grouped with parentheses.\n\nRH294-RHEL8.0-en-1-20190531\
    \ 161"
