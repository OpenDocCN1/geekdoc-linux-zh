  md: '# CHAPTER 8 | Simplifying Playbooks with Roles


    With RHEL System Roles, administrators no longer need to maintain configuration
    files for both services. Administrators can use rhel-system-roles, timesync to
    configure time synchronization for both Red Hat Linux 6 and 7 hosts. A simplified
    YAML file containing definitions of time synchronization for both types of hosts.


    # Support for RHEL System Roles


    RHEL System Roles are derived from the open source Linux System Roles project,
    found on Ansible Galaxy. Unlike System Roles, RHEL System Roles are supported
    by Red Hat as a standard Red Hat Enterprise Linux subscription. RHEL System Roles
    have the same life cycle support that comes with a Red Hat Enterprise Linux subscription.


    Every role is tested and stable. The Fully Supported system roles also have stable
    interfaces. For any Fully Supported system role, Red Hat will endeavour to ensure
    that variables remain unchanged in future versions. Playbook refactoring due to
    role changes should be minimal.


    The Preview system role may utilize different role variables in future versions.
    Integration testing is recommended for playbooks that incorporate any Technology
    Preview role. Playbooks may require refactoring if role variables change in a
    future version of the role.


    Other roles are in development in the upstream Linux System Roles project, but
    are not yet available through a RHEL subscription. These roles are available through
    Ansible Galaxy.


    # INSTALLING RHEL SYSTEM ROLES


    The RHEL System Roles are provided by the rhel-system-roles package, which is
    available in the AppStream channel. Install the package on the Ansible control.


    Use the following procedure to install the rhel-system-roles package. The procedure
    assumes the control node is registered to a Red Hat Linux subscription and that
    Ansible Engine is installed. See the section on Installing Ansible for more information.


    +   1. Install RHEL System Roles.


    ```

    [root@host ~] yum install rhel-system-roles

    ```


    After installation, the RHEL System roles are located in the /usr/share/ansible/roles/:


    ```

    [root@host ~] ls -l /usr/share/ansible/roles/

    total 20

    ... omitted... linux-system-roles.dump -> rhel-system-roles.dump

    ... omitted... linux-system-roles.network -> rhel-system-roles.network

    ... omitted... linux-system-roles.postfix -> rhel-system-roles.postfix

    ... omitted... linux-system-roles.selinux -> rhel-system-roles.selinux

    ... omitted... linux-system-roles.timesync -> rhel-system-roles.timesync

    ... omitted... rhel-system-roles.dump

    ... omitted... rhel-system-roles.network

    ... omitted... rhel-system-roles.postfix

    ... omitted... rhel-system-roles.selinux

    ... omitted... rhel-system-roles.timesync

    ```


    The corresponding upstream name of each role is linked to the RHEL System Role.
    This allows a role to be referred in a playbook by its name.'
