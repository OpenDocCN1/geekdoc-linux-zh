  md: '# INTERNATIONALIZATION


    # LANGUAGE SUPPORT


    Red Hat Enterprise Linux 8 officially supports 22 languages: English, Assamese,
    Bengali, Chinese (Simplified), Chinese (Traditional), French, German, Gujarati,
    Hindi, Italian, Japanese, Kannada, Korean, Malayalam, Marathi, Odia, Portuguese
    (Brazilian), Punjabi, Russian, Spanish, Tamil, and Telugu.


    # PER-USER LANGUAGE SELECTION


    Users may prefer to use a different language for their desktop environment than
    the system-wide default. They may also want to set their account to use a different
    keyboard layout or input method.


    # Language settings


    In the GNOME desktop environment, the user may be prompted to set their preferred
    language and input method on first login. If not, the easiest way for an individual
    to adjust their preferred language and input method is to use the Region & Language
    application. Run the command gnome-control-center from the top bar, select (User)
    -> Settings. In the window that opens, select Region & Language. The user can
    click the language bar and select their preferred language from the list that
    appears. This also updates the formats to the default for that language. The next
    time the user logs in, these changes will take full effect.


    These settings affect the GNOME desktop environment and any applications, including
    terminal, started inside it. However, they do not apply to that account if accessed
    through ssh from a remote system or a text console (such as tty2).


    > NOTEnUser can make their shell environment use the same LANG setting as their
    graphical environment, even when they log in through a text console or over ssh.
    One way to do this is to place code in the user''s ~/.bashrc file. This example
    code will set the language to a text console to match the currently set for the
    GNOME desktop environment:


    ```

    i=$(grep ''Language='' /var/lib/AccountService/users/$(USER) \

    | sed ''s/Language=/'')

    if [ "$i" != "" ]; then

    export LANG=$i

    fi

    ```


    Japanese, Korean, Chinese, or other languages with a non-Latin character set may
    not display properly on local consoles.


    Individual commands can be made to use another language by setting the LANG variable
    on the command line:


    RH294-RHEL8.0-en-1-20190531'
