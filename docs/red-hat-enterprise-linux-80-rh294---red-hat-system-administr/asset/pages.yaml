    # Scenario Overview


    You are responsible for managing a set of web servers. A recommended practice
    for web server configuration is to store web server data on a separate partition
    or logical volume.


    You will write a playbook to:


    +   - Manage partitions of the /dev/vdb device

    - Manage a volume group named apache-vg for web server device

    - Create two logical volumes named content-lv and logs-lv, both backed by the
    apache-volume group

    - Create an XFS file system on both logical volumes

    - Mount the content-lv logical volume at /var/www

    - Mount the logs-lv logical volume at /var/log/httpd


    If the storage requirements for the web server change, update the appropriate
    playbook variables and re-execute the playbook. The playbook should be idempotent.'
