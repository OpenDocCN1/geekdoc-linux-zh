    \ 2-space indentation when you press the **Tab** key and autoindients\n\n```\n\
    autoc Filetype yaml ts=2 sw=et\n```\n\nA playbook begins with a line consisting\
    \ of three dashes (---) as a start of document marker. It may end with three dots\
    \ (...) as an end of document marker, although in practice this is often omitted.\n\
    \nIn those markers, the playbook is defined as a list of lists. In a YAML list\
    \ starts with a single dash followed by a space. For example, a YAML list might\
    \ appear as follows:\n\n+   - apple\n- orange\n- grape\n\nIn Example 3.1, \"A\
    \ Simple Playbook\", the line after begins with a dash and starts the first (and\
    \ only) in the list of plays.\n\nThe play itself is a collection of key-value\
    \ pairs. Keys in the play should have the same indentation. The following example\
    \ shows a YAML snippet with three keys. The third key has a list of three items\
    \ as a value.\n\n```\nname: just an example\nhosts: webservers\ntasks:\n  - first\n\
    \  - second\n  - third\n```\n\nThe original example has three keys, **name**,\
    \ **hosts**, and **tasks**, because these keys all have the same indentation.\n\
    \nThe first line of the example play starts with a dash and a space (indicating\
    \ the play is the first item of a list), and then the first, the **name** attribute.\
    \ The **name** key associates an arbitrary string with the play as a label. This\
    \ identifies what the play is for. The **name** key is optional, but recommended\
    \ because it helps to document your playbook. This is especially useful when a\
