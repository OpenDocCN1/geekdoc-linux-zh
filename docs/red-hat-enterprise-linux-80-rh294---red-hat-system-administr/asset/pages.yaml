  md: '# CHAPTER CONFIGURATION

    CONFIGURATION FILE PRECEDENCE


    The search order for a configuration file is the reverse of the preceding list.
    The first file located in the search order is the one that Ansible selects. Ansible
    only uses configuration settings from the first file it finds.


    Any file specified by the ANSIBLE_CONFIG environment variable overrides all other
    configuration files. If variable is not set, the directory in which the ansible
    command was run is checked for a `ansible.cfg` file. If file is not present, the
    user''s home directory is checked for a `.ansible.cfg` file. The global `/etc/ansible/ansible.cfg`
    file is only used if no other configuration is found. Ansible contains which it
    uses.


    Because the multitude of locations in Ansible configuration files can be placed,
    it can be confusing which configuration file is being used by Ansible. You can
    run the `ansible --version` command to clearly identify which version of Ansible
    is installed, and which configuration file is being used.


    ```

    [controlnode ~]$ ansible --version

    ansible 2.8.0

    config file = /etc/ansible/ansible.cfg

    ...output omitted...

    ```


    Another way to display the active Ansible configuration file is to use the `-v`
    option when executing Ansible commands on the command line.


    ```

    [controlnode ~]$ ansible servers --list-hosts -v

    Using /etc/ansible/ansible.cfg as config file

    ...output omitted...

    ```


    Ansible only uses settings from the configuration file with the highest precedence.
    Even if other files with lower precedence exist, their settings are ignored and
    not combined with those in the selected configuration file. Therefore, if you
    choose to create your own configuration file in favor of the global `/etc/ansible/ansible.cfg`
    configuration file, you need to duplicate all desired settings from that to your
    user-level configuration file. Settings not defined in the user-level configuration
    file remain set to the built-in, even if they are set to some other by the global
    configuration file.


    # MANAGING SETTINGS IN THE CONFIGURATION FILE


    The Ansible file consists of several sections, with each section containing settings
    defined as key-value pairs. Section titles are enclosed in square brackets. For
    basic operation use the following sections:


    +   * [defaults] sets defaults for Ansible operation

    * [privilege_escalation] configures how Ansible performs privilege escalation
    on managed hosts


    For example, the following is a typical `ansible.cfg` file:


    ```

    [defaults]

    inventory = .inventory

    remote_user = user

    ask_pass = false

    ```


    RH294-RHEL8.0-en-1-20190531'
