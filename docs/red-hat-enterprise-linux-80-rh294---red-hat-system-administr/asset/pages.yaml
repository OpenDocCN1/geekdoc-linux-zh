  md: '# DEPLOYING CUSTOM FILES WITH JINJA2 TEMPLATES


    # OBJECTIVES


    After completing this section, you should be able to use Jinja2 templates to deploy
    customized files to managed hosts.


    # TEMPLATING FILES


    Red Hat Ansible has a number of modules that can be used to modify existing files.
    These include inlinefile and blockinfile, among others. However, they are not
    always easy to use effectively and correctly.


    A much more powerful way to manage files is to template them. With this method,
    you can write a template configuration that is automatically customized for the
    managed host when the file is deployed, using Ansible variables and factors. This
    can be easier to control and less error-prone.


    # INTRODUCTION TO JINJA2


    Ansible uses the Jinja2 templating system for template files. Ansible also uses
    Jinja2 syntax to reference variables in playbooks, so you already know a little
    about how to use it.


    # Using Delimiters


    Variables and logic expressions are placed between tags, or delimiters. For example,
    Jinja2 templates use (% EXP %) for expressions or logic (for example, loops),
    while {{ EXP %}) are used for outputting the results of an expression or a variable
    to the end user. The latter tag, when rendered, is replaced with a value or values,
    and are seen by the end user. Use {# COMMENT # }} syntax to enclose comments that
    should not appear in the final file.


    In the following, the first line includes a comment that will not be included
    in the final file. The variable references in the second line are replaced with
    the values of the system facts being referenced.


    ```

    # /etc/hosts line #

    {{ ansible_facts[''default_ipv4''] }} {{ ansible_facts[''hostname''] }}

    ```


    # BUILDING A JJA2 TEMPLATE


    A Jinja2 template is composed of multiple elements: data, variables, and expressions.
    Those variables and expressions are replaced with values when the Jinja2 template
    is rendered. The variables used in the template can be specified in the vars section
    of the playbook. It is possible to use the managed hosts'' facts as variables
    on a template.


    > Remember that the facts associated with a managed host can be obtained using
    the ansible system_hostname -i inventory_file -m setup command.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# CHAPTER 6 | Deploying Flies to Managed Hosts


    The following example shows how to create a template for /etc/ssh/sshd_config
    with variables and facts retrieved by Ansible from managed hosts. When the associated
    playbook executes, any files are replaced by their values in the managed host
    being configured.


    > NOTE

    A file containing a Jinja template does not need to have any specific file extension
    (for example, j2). However, providing such a file extension may make it easier
    for you to remember that it is a template file.


    ```

    # {{ ansible_managed }}

    # DO NOT MAKE LOCAL MODIFICATIONS TO THIS FILE AS THEY WILL BE LOST


    Port {{ ssh_port }}

    ListenAddress {{ ansible_facts[''default_ipv4''][''address''] }}


    HostKey = /etc/ssh/ssh_host_rsa_key

    HostKey = /etc/ssh/ssh_host_ecdsa_key

    HostKey = /etc/ssh/ssh_host_ed25519_key


    SyslogFacility AUTHPRIV

    ```


    ```

    PermitRootLogin {{ root_allowed }}

    AllowGroups {{ groups_allowed }}

    ```


    AuthorizedKeysFile /etc/.rht_authorized_keys .ssh/authorized_keys


    PasswordAuthentication {{ passwords_allowed }}


    ChallengeResponseAuthentication no


    ```

    GSSAPIServerication yes

    GSSAPICleanupCredentials no

    ```


    UsePAM yes


    ```

    X11Forwarding yes

    UsePrivilegeSeparation sandbox

    ```


    ```

    AcceptEnv LANG LC_CTYPE LC_NUMERIC LC_TIME LC_COLLATE LC_MONETARY LC_MESSAGES

    AcceptEnv LC_PAPER LC_NAME LC_ADDRESS LC LC_MEASUREMENT

    AcceptEnv LC_IDENTIFICATION LC_ALL LANGUAGE

    AcceptEnv XMODIFIERS

    ```


    ```

    Subsystem sftp /usr/libexec/openssh/sftp-server

    ```


    # DEPLOYING JINJA TEMPLATES


    Jinja templates are a powerful tool to customize configuration files to be deployed
    on the managed hosts. When the Jinja template for a configuration file has been
    created, it can be deployed to the managed hosts module, which supports the transfer
    of a local file on the control node to the managed hosts.'
