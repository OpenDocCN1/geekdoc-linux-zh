  md: '# RUNNING AD HOC COMMANDS


    # OBJECTIVES


    After completing this section, you should be able to run a single Ansible automation
    task using an ad hoc command and explain some use cases for ad hoc commands.


    # RUNNING AD HOC COMMANDS WITH ANSIBLE


    An ad hoc command is a way of executing a single Ansible task quickly, one that
    you do not need to save to run again later. They are simple, online operations
    that can be run without writing a playbook.


    Ad hoc commands are useful for quick tests and changes. For example, you can use
    an ad hoc command to make sure a certain line exists in the /etc/hosts file on
    a group of servers. You could use another ad hoc command to efficiently restart
    a service on many different machines, or to ensure that a particular software
    package is up-to-date.


    Ad hoc commands are very useful for quickly performing simple tasks with Ansible.
    They have their limits, and in general you will want to use Ansible Playbooks
    to realize the full power of Ansible. In many situations, however, ad hoc commands
    are exactly the tool you need to perform simple tasks quickly.


    # Running Ad Hoc Commands


    Use the host-pattern to run ad hoc commands:


    ```

    ansible host-pattern -m module [-a ''module arguments''] -i inventory

    ```


    The host-pattern argument is used to specify the managed hosts on which the ad
    hoc command should be run. It could be a specific managed host or host group in
    the inventory. You have already seen this used in conjunction with the --list-hosts
    option, which shows you which hosts are matched by a pattern host. You have also
    seen that you can use the -i option to specify a different inventory location
    than the default in the current Ansible configuration file.


    The -m option takes as an argument the name of the module that Ansible should
    run on the targeted hosts. Modules are small programs that are executed to implement
    your task. Some modules need no additional information, but others need additional
    arguments to specify the details of the operation. The -a option takes list of
    those arguments as a quoted string.


    One of the simplest ad hoc commands uses the ping module. This module does not
    do an ICMP ping, but checks to see if you can run Python-based modules on managed
    hosts. For example, the following ad hoc command determines whether all managed
    hosts in the inventory can run standard modules:'
