  md: '# SUMMARY


    In this chapter, you learned:


    +   - Ansible provides built-in logging. This feature is not enabled by default.

    - The `log_path` parameter in the `default` section of the `ansible.cfg` configuration
    file specifies the location of the log file to which all Ansible output is redirected.

    - The Debug module provides additional debugging information while running a playbook
    (for example, current value for a variable).

    - The `-v` option of the `ansible-playbook` command provides several levels of
    output verbosity. This is useful for debugging Ansible tasks when running a playbook.

    - The `--check` option enables Ansible modules with check mode support to display
    changes to be performed, instead of applying those changes to the managed hosts.

    - Additional checks can be executed on the managed hosts using ad hoc commands.'
