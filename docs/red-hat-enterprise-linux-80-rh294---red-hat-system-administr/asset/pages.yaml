  md: 'CHAPTER 2 | Deploying Ansible


    # Running Arbitrary Commands on Managed Hosts


    The command module allows administrators to run arbitrary commands on the command
    line of managed hosts. The command to be run is specified as an argument to the
    module using the -a option. For example, the following command runs the hostname
    command on the managed hosts referenced by the myhosts


    ```

    [user@controlnode ~]$ ansible myhosts -m command -a /usr/bin/hostname

    host1.lab.example.com | CHANGED | rc=0 <<

    host1.lab.example.com

    host2.lab.example.com | CHANGED | rc=0 <<

    host2.lab.example.com

    ```


    The previous ad command returned two lines of output for each managed host. The
    first line is a status report, showing the name of the managed host that the ad
    operation ran on, as well as the outcome of the operation. The second line is
    the output of the command executed remotely by the Ansible command module.


    For better reliability and parsing of ad command output, administrators might
    find it useful to have a single line of output for each operation performed on
    a managed host. Use the -o option to display the output of ad commands in a single
    format.


    ```

    [user@controlnode ~]$ ansible myhosts -m command -a /usr/bin/hostname -o

    host1.lab.example.com | CHANGED | rc=0 << (stdout) host1.lab.example.com

    host2.lab.example.com | CHANGED | rc=0 << (stdout) host2.lab.example.com

    ```


    The command module allows administrators to execute remote commands on managed
    hosts. These commands are not processed by the shell on the managed hosts. As
    such, you cannot access shell environment variables or perform shell operations,
    such as redirection and piping.


    > NOTE

    If ad command does not specify which module to use with the -m option,

    Red Hat Ansible Engine uses the command module by default.


    For situations where commands require shell processing, administrators can use
    the shell module. Like the command module, the commands can be executed as arguments
    to the module ad command. Ansible then executes the command remotely on the managed
    hosts. Unlike the command module, the commands are processed through a shell on
    the managed hosts. Therefore, shell environment variables are accessible and shell
    operations such as redirection and piping are also available for use.


    The following example illustrates the difference between the command and shell
    modules. If you try to execute the built-in Bash command set with these two modules,
    it only succeeds with the shell module.


    ```

    [user@controlnode ~]$ ansible localhost -m command -a set

    localhost | FAILED | rc=2 <<

    [user@localhost: /bin/sh failed]:

    [Errno 2] No file or directory

    [user@controlnode ~]$ ansible localhost -m shell -a set

    localhost | CHANGED | rc=0 <<

    BASH=/bin/sh

    ```


    RH294-RHEL8.0-en-US-20190531'
