- img_proc: true
  md: '# CHAPTER 9 | Troubleshooting Ansible


    # Verbosity Configuration


    | OPTION | DESCRIPTION |

    | -V | The output data is displayed. |

    | -VV | Both the output and input data are displayed. |

    | -VVV | Includes information about connections to managed hosts. |

    | -VVVV | Includes additional information about scripts that are executed on each
    remote host, and the user that is executing each script. |


    # RECOMMENDED PRACTICES FOR PLAYBOOK MANAGEMENT


    Although the previously discussed tools could help identify and fix issues in
    playbooks, when developing these playbooks it is important to keep in mind some
    recommended practices that can help ease the troubleshooting process. Some recommended
    practices for playbook development are listed below:


    +   - Use a concise description of the play''s task''s purpose to play names and
    tasks. The play name or task name is displayed when the playbook is executed.
    This also helps document what each play or task is supposed to accomplish, and
    why it is needed.

    - Include comments to add additional inline documentation about tasks.

    - Make effective use of vertical space. In general, organize task attributes vertically
    to make them easier to read.

    - Consistent horizontal indentation is critical. Use spaces, not tabs, to avoid
    indentation errors. Set up your text editor to insert spaces when you press the
    Tab key to make this easier.

    - Try to keep the playbook as simple as possible. Only use the features that you
    need.


    > REFERENCES

    Configuring Ansible – Ansible Documentation

    https://docs.ansible.com/ansible/latest/installation_guide/intro_configuration.html


    debug – Print statements during execution – Ansible Documentation

    https://docs.ansible.com/ansible/latest/modules/debug_module.html


    Best Practices – Ansible Documentation

    https://docs.ansible.com/ansible/latest/user_guide/playbooks_best_practices.html'
