  md: "# CHAPTER 10 | Automating Linux Administration Tasks\n\nthe different connections,\
    \ specified as a list of dictionaries, using the interface name as the connection\
    \ name.\n\nThe following table lists the options for the network_connections variable.\n\
    \n| OPTION NAME | DESCRIPTION |\n| --- | --- |\n| name | Identifies the connection\
    \ profile. |\n| state | The runtime state of a connection profile. Either up,\
    \ if the connection profile is active, or down if it is not. |\n| persistent_state\
    \ | Identifies if a connection profile is persistent. Either present if the connection\
    \ profile is persistent, or absent if it is not. |\n| type | Identifies the connection\
    \ type. Valid values are ethernet, bridge, bond, team, vlan, macvlan, and infiniband.\
    \ |\n| autoconnect | Determines if the connection automatically starts. |\n| mac\
    \ | Restricts the connection to be used on devices with a specific MAC address.\
    \ |\n| interface_name | Restricts the connection to be used by a specific interface.\
    \ |\n| zone | Configures the Firewall zone for the interface. |\n| ip | Determines\
    \ the IP configuration for the connection. Supports options like for example address,\
    \ to specify a static IP address, or dns to configure a DNS server |\n\nThe following\
    \ example uses some of the previous options:\n\n```\nnetwork_connections:\n  -\
    \ name: eth0\n    persistent_state: present\n    type: ethernet\n    autoconnect:\
    \ yes\n    mac: 00:00:5e:00:53:5d\n    ip:\n      address: 172.25.250.40/24\n\
    ```\n\n+   - Uses eth0 as the connection name.\n- Makes the connection persistent.\
    \ This is the default value.\n\n456 R1294-RHEL.8.0-en-1-20190531"
