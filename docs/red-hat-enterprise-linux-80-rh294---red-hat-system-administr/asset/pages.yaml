    # Making SELinux File Contexts Persistent


    The file module acts like chcon when setting file contexts. Changes made with
    that could be unexpectedly undone by running restorecon. After using file to set
    the context, you can use setcontext from the collection of System modules to update
    the SELinux policy like semanage context.


    - name: SELinux type is persistently set to samba_share_t

    setcontext:

    target: /path/to/samba_file

    setype: samba_share_t

    state: present


    Example outcome:


    ```

    $ ls -Z samba_file

    -rw-r--r-- owner unconfined-u:object_r:samba_share_t:s0 samba_file

    ```


    > > IMPORTANT

    > The setcontext module updates the default context for the target in the SELinux
    policy, but does not change the context on existing files.


