  md: "# YAML Lists\n\nYou have also seen lists written with the normal single--dash\
    \ syntax:\n\n+   hosts:\n  - servera\n  - serverb\n  - serverc\n\nLists also have\
    \ an inline format enclosed in square braces, as follows:\n\n```\nhosts: [servera,\
    \ serverb, serverc]\n```\n\nYou should avoid this syntax because it is usually\
    \ harder to read.\n\n# Obsolete key=value Playbook Shorthand\n\nSome playbooks\
    \ might use an older shorthand method to define tasks by putting the key-value\
    \ pairs for the module on the same line as the module name. For example, you might\
    \ see this syntax:\n\n+   tasks:\n  - name: shorthand form\n    service: name=http\
    \ enabled=true state=started\n\nNormally you would write the same task as follows:\n\
    \n+   tasks:\n  - name: normal form\n    service:\n      name: httpd\n      enabled:\
    \ true\n      state: started\n\nYou should generally avoid the shorthand form\
    \ and use the normal form.\n\nThe normal format has more lines, but it is easier\
    \ to work with. The task's keywords are stacked vertically and easier to differentiate.\
    \ Your eyes run straight down the play with less left-to-right motion. Also, the\
    \ normal format is native YAML; the shorthand format is not. Syntax highlighting\
    \ tools in modern text editors can help you work more effectively if you use the\
    \ normal format than if you use the shorthand format.\n\nYou might see this syntax\
    \ in documentation and older playbooks from other people, and the syntax still\
    \ function."
