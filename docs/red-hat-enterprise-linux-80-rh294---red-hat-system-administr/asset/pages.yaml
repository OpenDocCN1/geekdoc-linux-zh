  md: '# MODIFYING AND COPYING FILES TO HOSTS


    # OBJECTIVES


    After completing this section, you should be able to create, install, edit, and
    remove files on managed hosts, and manage permissions, ownership, SELinux context,
    and other characteristics of those files.


    # DESCRIBING FILES MODULES


    Red Hat Ansible ships with a large collection of modules (the "module library")
    that are developed as part of the upstream Ansible project. To make it easier
    to organize, document, and manage them, they are organized into groups based on
    function in the documentation and when installed on a system.


    The Files modules include modules allowing you to accomplish most tasks related
    to Linux file management, such as creating, copying, editing, and modifying permissions
    and other attributes of files. The following table provides a list of frequently
    used file management modules:


    Commonly Used Files Modules


    | MODULE NAME | MODULE DESCRIPTION |

    |---|---|

    | blockfile | Insert, update, or remove a multiline text surrounded by customizable
    marker lines. |

    | copy | Copy a file from the local or remote machine to a location on a managed
    host. Similar to the file module, the copy module can also set attributes, including
    SELinux context. |

    | fetch | This module works like the copy module, but in reverse: This module
    is used for fetching files from remote machines to the control node and storing
    them in a file tree, organized by host name. |

    | file | Set attributes as permissions, ownership, SELinux contexts, and time
    stamps of regular files, symlinks, hard links, and directories. This module can
    also create or remove regular files, symlinks, hard links, and directories. A
    number of other file-related modules support the same options to set attributes
    as the file module, including the copy module. |

    | linefile | Ensure that a particular line is in a file, or replace an existing
    line using a back-reference regular expression. This module is primarily useful
