- img_proc: true
  md: "# CHAPTER 8 | Simplifying Playbooks with Roles\n\nnamed according to each file's\
    \ purpose in the role, such as tasks and handlers. The files and templates subdirectories\
    \ contain files referenced in other YAML files.\n\nThe following command displays\
    \ the directory structure of the user.example role.\n\n```\n[user@host roles]$\
    \ tree user.example\nuser.example/\n├── defaults\n│   └── main.yml\n├── handlers\n\
    │   └── main.yml\n├── meta\n│   └── main.yml\n├── README.md\n├── tasks\n│   └──\
    \ main.yml\n├── templates\n├── tests\n│   ├── inventory\n│   └── test.yml\n└──\
    \ vars\n    └── main.yml\n```\n\n# Ansible role subdirectories\n\n| SUBDIRECTORY\
    \ | FUNCTION |\n| defaults | main.yml file in this directory contains the default\
    \ values of role variables that can be overwritten when the role is used. These\
    \ variables have low precedence and are intended to be customized in plays. |\n\
    | files | This directory contains static files that are referenced by role tasks.\
    \ |\n| handlers | main.yml file in this directory contains the role's handler\
    \ definitions. |\n| meta | main.yml file in this directory contains information\
    \ about the role, including author, license, platforms, and optional role dependencies.\
    \ |\n| tasks | main.yml file in this directory contains the role's task definitions.\
    \ |\n| templates | This directory contains Jinja2 templates that are referenced\
    \ by role tasks. |\n| tests | This directory can contain an inventory and test.yml\
    \ playbook that can be used to test the role. |\n| vars | main.yml file in this\
    \ directory defines the role variables. Often these variables are used for internal\
    \ purposes within the role. These variables have high precedence, and are not\
    \ intended to be changed when used in a playbook. |\n\nNot every role will have\
    \ all of these directories."
  merge: -1
  pgno: 308
- img_proc: true
  md: "# CHAPTER 8 | Simplifying Variables with Roles\n\n# DEFINING VARIABLES AND\
    \ DEFAULTS\n\nRole variables are defined by creating a vars/main.yml file with\
    \ key: value pairs in the role directory hierarchy. They are referenced in the\
    \ role YML file like any other variable: {{ VAR_NAME }}. These variables have\
    \ a high precedence and cannot be overridden by inventory variables. The intent\
    \ of these variables is that they are used by the internal functioning of the\
    \ role.\n\nDefault variables allow default to be set for variables that can be\
    \ used in a play to configure the role or customize its behavior. They are defined\
    \ by creating a defaults/main.yml file with key: value pairs in the role directory\
    \ hierarchy. Default variables have the lowest precedence of any available variables.\
    \ They can be easily overridden by any other variable, including inventory variables.\
    \ These variables are intended to provide the person writing a play the role with\
    \ a way to customize or control exactly what it is going to do. They can be used\
    \ to provide information to the role that it needs to configure or deploy something\
    \ properly.\n\nDefine a specific variable in either vars/main.yml or defaults/main.yml,\
    \ but not in both places. Defaults should be used when it is intended that their\
    \ values will be overridden.\n\n> IMPORTANT\nRoles should not have site-specific\
    \ data in them. They definitely should not contain any secrets leaks or private\
    \ keys.\n\nThis is because roles are supposed to be generic, reusable, and freely\
    \ sharable. Site-specific details should not be hard coded into them.\n\nSecrets\
    \ should be provided to the role through other means. This is one reason you might\
    \ want to set role variables when calling a role. Role variables set in the play\
    \ could provide the secret, or point to an Ansible Vault-encrypted file containing\
    \ the secret.\n\n# USING ANSI ROLES IN A PLAYBOOK\n\nUsing roles in a playbook\
    \ is straightforward. The following example shows one way to call Ansible roles.:\n\
    \n```\n---\n  hosts: remote.example.com\n  roles:\n    - role1\n    - role2\n\
    ```\n\nFor each role, the role tasks, role handlers, role variables, and role\
    \ dependencies will be imported into the playbook, in that order. Any copy, script,\
    \ template, or include_tasks/import_tasks in the role can reference the relevant\
    \ files, or task files in the role without absolute or relative paths. Ansible\
    \ looks for them in the role's files, templates, or tasks subdirectories.\n\n\
    When you use a section to import roles into a play, the roles will run first,\
    \ before any tasks that you define for that play.\n\nThe following example sets\
    \ values for two role variables of role2, var1 and var2. Any defaults and vars\
    \ variables are overridden when role2 is used."
