  md: "# TROUBLESHOOTING ANSIBLE\nMANAGED HOSTS\n\n# OBJECTIVES\n\nAfter completing\
    \ this section, you should be able to troubleshoot failures on managed hosts\n\
    running a playbook.\n\n# USING CHECK MODE AS A TESTING TOOL\n\nYou can use the\
    \ **ansible-playbook --check** command to run smoke tests on a playbook. This\n\
    option executes the playbook without making changes to the managed hosts configuration.\
    \ If a\nmodule used within the playbook supports check mode then the changes that\
    \ would have been\nmade to the managed hosts are displayed but not performed.\
    \ If check mode is not supported by\nmodule then the changes are not displayed\
    \ but the module still takes action.\n\n```\n$[demo ~~$ ansible-playbook --check\
    \ playbook.yml\n```\n\n> NOTE\nThe **ansible-playbook --check** command might\
    \ not work properly if your\ntasks use conditionals.\n\nYou can control whether\
    \ individual tasks run in check mode with the **check_mode** setting. If a\ntask\
    \ has **check_mode**: yes, it always runs in check mode, whether or not you passed\
    \ the --\ncheck option to **ansible-playbook**. Likewise, if a task has **check_mode**:\
    \ no, it always runs\nnormally, even if you pass --check to ansible-playbook.\
    \ \n\nThe following tasks run in check mode, and does not make changes.\n\n+ \
    \  tasks:\n  - name: task always in check mode\n    shell: uname -a\n    check_mode:\
    \ yes\n\nThe following is always normal, even when started with **ansible-playbook\
    \ --check**.\n\n+   tasks:\n  - name: task always runs even in check mode\n  \
    \  shell: uname -a\n    check_mode: no\n\nThis can be useful because you can run\
    \ most of a playbook normally while testing individual tasks\nwith **check_mode**:\
    \ yes. Likewise, you can make test run in check mode more likely to provide\n\
    reasonable results by running selected tasks that gather facts or set variables\
    \ for conditionals but\nd not change the managed hosts with **check_mode**: no."
