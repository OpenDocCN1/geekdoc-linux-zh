  md: '# CHAPTER 1 | Introducing Ansible


    2. Install Red Hat Ansible Engine.


    ```

    [root@host ~] yum install ansible

    ```


    # MANAGED HOSTS


    One of the benefits of Ansible is that managed hosts do not need to have a special
    agent installed. The Ansible control node connects to managed hosts using a standard
    network protocol to ensure that the systems are in the specified state.


    Managed hosts might have some requirements depending on how the control node connects
    to them and what modules it runs on.


    Linux and UNIX managed hosts need to have Python 2 (version 2.6 or later) or Python
    3 (version 3.5 or later) installed for most modules.


    For Red Hat Enterprise Linux 8, you may be able to depend on the platform-python
    package. You can also enable and install the python36 application stream (or the
    python27 stream).


    ```

    [root@host ~] yum install python36

    ```


    If SELinux is enabled on the managed hosts, you also need to make sure the python3-libselinux
    package is installed before using modules that are related to any copy, or template
    functions. (Note that if the other Python components are installed, you can use
    Ansible modules as yum package to ensure that this package is installed.)


    > Some package names may be different in Red Hat Enterprise Linux 7 and earlier
    because of the ongoing migration to Python 3.


    > For Red Hat Enterprise Linux 7 and earlier, install the python package, which
    provides Python 2. Instead of python3-libselinux, you will need to make sure the
    libselinux-python package is installed.


    Some modules might have their own additional requirements. For example, the dnf
    module, which can be used to install packages on current Fedora systems, requires
    the python3-dnf package (python-dnf) in RHEL 7.


    > Some modules do not use Python. arguments passed to the Ansible raw module run
    directly through the configured remote instead of going through the module subsystem.
    This can be useful for managing devices that do not have Python available or cannot
    have Python installed, or for bootstrapping Python onto a system that does not
    have it.


    However, the raw module is difficult to use in a safe idempotent way. If you use
    a normal module instead, it is generally better to avoid using raw and similar
    command modules. This is discussed further later in the course.'
