  md: "# MANAGING USERS AND AUTHENTICATION\n\n# OBJECTIVES\n\nAfter completing this\
    \ section, you should be able to:\n\n+   - provision multiple user accounts on\
    \ multiple servers.\n- Manage Linux users and groups, configure SSH, and Sudo\
    \ configuration on managed hosts.\n\n# THE USER MODULE\n\nThe Ansible user module\
    \ lets you manage user accounts on a remote host. You can manage a number of parameters\
    \ including remove user, set home directory, the UID for system accounts, manage\
    \ passwords and associated groupings. To create a user that can log into the machine,\
    \ you need to provide a hashed password for the password parameter. See the reference\
    \ section for a link to \"How do I generate encrypted passwords for the user module?\n\
    \n# Example of the User Module\n\n+   - name: user to the development machine\
    \ and assign the appropriate groups.\n  name: devops_user\n  shell: /bin/bash\n\
    \  groups: sys_admins, developers\n  append: yes\n\n> **The name** parameter is\
    \ the only requirement in the user module and is usually the service account or\
    \ user account.\n**The shell** parameter optionally sets the user's shell. On\
    \ other operating systems, the default is decided by the tool being used.\n**The\
    \ groups** parameter along with the **append** parameter tells the machine that\
    \ we want to append the groups sys_admins and developers to the user. If you do\
    \ not use the append parameter then the groups will overwrite in place.\n\nWhen\
    \ creating a user you can specify it to **generate_ssh_key**. This will **not**\
    \ overwrite an existing SSH key.\n\n# Example of User Module Generating an ssh\
    \ key\n\n+   - name: Create a SSH key for user1\n  name: user1\n  generate_ssh_key:\
    \ yes\n  ssh_key_bits: 2048\n  ssh_key_file: /ssh/id_my_rsa"
  merge: -1
  pgno: 420
- img_proc: true
  md: "# CHAPTER 10 | Automating Linux Administration Tasks\n\n> NOTE\nThe User module\
    \ also offers some return values. Ansible modules can take a return value and\
    \ register them into a variable. Find out more with ansible-doc and on the main\
    \ doc site.\n\nSome commonly used parameters\n\n| PARAMETER | COMMENTS |\n|---|---|\n\
    | comment | Optionally sets the description of a user account. |\n| group | Optionally\
    \ sets the user's primary group. |\n| groups | List of multiple groups. When set\
    \ to a null value, all groups except the primary group is removed. |\n| home |\
    \ Optionally sets the user's home directory. |\n| create_home | Takes a boolean\
    \ value of yes or no. A home directory will be created for the user if the value\
    \ is set. |\n| system | When creating an account state=present, setting this to\
    \ yes makes the user a system account. This setting cannot be changed on existing\
    \ users. |\n| uid | Sets the UID od user. |\n\n# THE GROUP MODULE\n\nThe group\
    \ module allows you to manage (add, delete, modify) groups on the managed hosts.\
    \ You need to have groupadd, groupdel or groupmod. For windows targets, use the\
    \ win_group module.\n\n# Example of the group module\n\n+   - name: Verify that\
    \ auditors group exists\n  group:\n    name: auditors\n    state: present\n\n\
    Parameters for the group module\n\n| PARAMETER | COMMENTS |\n|---|---|\n| gid\
    \ | Optional GID to set for the group. |\n| local | Forces the use of \"local\"\
    \ command alternatives on platforms that implement it. |\n| name | Name of the\
    \ group to manage. |\n\n406 RH-294-RI IEL8.0-en-1-20190531"
