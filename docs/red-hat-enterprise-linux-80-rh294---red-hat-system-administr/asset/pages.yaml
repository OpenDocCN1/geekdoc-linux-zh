  md: '# Microsoft Windows-based Managed Hosts


    Ansible includes a number of modules that are specifically designed for Microsoft
    Windows systems. These are listed in the Windows Modules [https://docs.ansible.com/ansible/latest/modules/list_of_modules.html]
    section of the Ansible index.


    Most of the modules specifically designed for Windows managed hosts require PowerShell
    3.0 or later on the managed host rather than Python. In addition, the managed
    hosts need to have PowerShell Remoting configured. Ansible also requires at least
    .NET Framework 4.0 or later to be installed on Windows managed hosts.


    This course Linux-based managed hosts in its examples, and does not go into great
    depth on the specific differences and adjustments needed when managing Windows-based
    managed hosts. More information is available on the Ansible web site at https://docs.ansible.com/ansible/latest/user_guide/windows.html.


    # Managed Network Devices


    You can use Ansible automation to configure managing network devices such as routers
    and switches. Ansible includes support for Cisco IOS, IOS XR, and NX-OS; Juniper
    Junos, Arista EOS; and VyOS-based networking devices, among others.


    You can write Ansible playbooks for network devices using the same basic techniques
    that you use writing playbooks for servers. Because most devices cannot run Python,
    Ansible runs modules on the control node, not on the managed hosts. Special connection
    methods are also used to communicate with network devices, typically using either
    CLI over SSH, XML over SSH, or API over HTTP(S).


    This course does not cover automation of network device management in depth. For
    more information on this topic, see Ansible for Network Automation [https://docs.ansible.com/ansible/latest/network/index.html]
    on the Ansible community website, or attend our alternative course Ansible for
    Network Automation (DO457) [https://www.redhat.com/en/services/training/do457-ansible-network-automation].


