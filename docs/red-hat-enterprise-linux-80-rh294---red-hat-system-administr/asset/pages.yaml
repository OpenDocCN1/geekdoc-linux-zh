  md: '# MANAGING VARIABLES


    # OBJECTIVES


    After completing this section, you should be able to create and reference variables
    in playbooks, affecting particular hosts or host groups, the play, or the global
    environment, and to describe variable precedence works.


    # INTRODUCTION TO ANSIBLE VARIABLES


    Ansible supports variables that can be used to store values that can then be reused
    throughout files in an Ansible project. This can simplify the creation and maintenance
    of a project and reduce the number of errors.


    Variables provide a convenient way to manage dynamic values for a given environment
    in your Ansible project. Examples of values that variables might contain include:


    +   * Users to create

    * Packages to install

    * Services to restart

    * Files to remove

    * Archives to retrieve from the internet


    # NAMING VARIABLES


    Variable names must start with a letter, and they can only contain letters, numbers,
    and underscores.


    The following table illustrates the difference between invalid and valid variable
    names.


    Examples of Invalid and Valid Ansible Variable Names


    | INVALID VARIABLE NAMES | VALID VARIABLE NAMES |

    |---|---|

    | web server | web_server |

    | remote.file | remote_file |

    | 1st file | file_1 |

    | | file1 |

    | remoteserver$1 | remote_server_1 |

    | | remote_server1 |'
  merge: -1
  pgno: 117
- img_proc: true
  md: "# DEFINING VARIABLES\n\nVariables can be defined in a variety of places in\
    \ an Ansible project. However, this can be simplified\nto three basic scope levels:\n\
    \n+   - *Global scope*: Variables set from the command line or Ansible configuration\n\
    - *Play scope*: Variables set in the play and related structures\n- *Host scope*:\
    \ Variables set on host groups and individual hosts by the inventory, fact gathering,\
    \ or\nregistered tasks\n\nIf the same variable name is defined at more than one\
    \ level, the level with the highest precedence\na narrow scope takes precedence\
    \ over a wider scope: variables defined by the inventory are\noridden by variables\
    \ defined by the playbook, which are overridden by variables defined on the\\\
    command line.\n\nA detailed discussion of variable precedence is available in\
    \ the Ansible documentation, a link\nto which is provided in the References at\
    \ the end of this section.\n\n# VARIABLES IN PLAYBOOKS\n\nVariables play an important\
    \ role in Ansible Playbooks because they ease the management of\nvariable data\
    \ in a playbook.\n\n# Defining Variables in Playbooks\n\nWhen writing playbooks,\
    \ you can define your own variables and invoke those values in a task.\nFor example,\
    \ a variable named `web_package` can be defined with a value of `httpd`. A task\
    \ can\nthen call the variable using the yum module to install the `httpd` package.\n\
    \nPlaybook variables can be defined in multiple ways. One common method is to\
    \ place a variable in\n`vars` block at the beginning of a playbook:\n\n```\n-\
    \ hosts: all\nvars:\n  user: joe\n  home: /home/joe\n```\n\nIt is also possible\
    \ to define playbook variables in external files. In this case, instead of using\
    \ a **vars**nblock in the playbook, the `vars_files` directive may be used, followed\
    \ by a list of names for\nexternal files relative to the location of the playbook:\n\
    \n+   - hosts: all\nvars_files:\n  - vars/users.yml\n\nThe playbook variables\
    \ are then defined in that file or those files in YAML format:\n\n```\nuser: joe\n\
    home: /home/joe\n```"
  merge: -1
  pgno: 118
- img_proc: true
  md: "# Using Variables in Playbooks\n\nAfter variables have been declared, administrators\
    \ can use the variables in tasks. Variables are referenced by the variable name\
    \ in double curly braces {{ }}}. Ansible substitutes the variable with its value\
    \ when the task is executed.\n\n```\nvars:\n  user: joe\n```\n\n```\ntasks:\n\
    \  # This line will read: Creates the user joe\n  name: Creates the user {{ user\
    \ }}\n  user:\n    # This line will create the user named Joe\n    name: \"{{\
    \ user }}}\"\n```\n\n> IMPORTANT\nWhen a variable is used as the first element\
    \ to start a value, quotes are mandatory. This prevents Ansible from interpreting\
    \ the variable reference as starting a YAML dictionary. The following message\
    \ appears if quotes are missing:\n\n```\nyum:\n  name: {{ service }}\n  ^\n```\n\
    \nWe could be wrong, but this one looks like it might be an issue with missing\
    \ quotes. Always quote template expression brackets when they start a value. For\
    \ instance:\n\n```\nwith_items:\n  - {{ foo }}\n```\n\nShould be written as:\n\
    \n```\nwith_items:\n  - \"{{ foo }}\"\n```\n\n# HOST VARIABLES AND GROUP VARIABLES\n\
    \nInventory variables that apply directly to hosts fall into two broad categories:\
    \ host variables and group variables apply to all hosts in a host group or in\
    \ a group of groups. Host variables take precedence over group variables, variables\
    \ defined by a playbook precedence over both.\n\nOne way to define host variables\
    \ and group variables is to do it directly in the inventory file. This is an older\
    \ approach and not preferred, but you may still encounter it.\n\n+   Defining\
    \ the user_host variable for demo.example.com:\n\n```\n[servers]\n  demo.example.com\
    \ ansible_user=joe\n```\n\n+   Defining the group variable for the servers host\
    \ group."
  merge: -1
  pgno: 119
