  md: "# INCLUDING AND IMPORTING FILES\n\n# OBJECTIVES\n\nAfter completing this section,\
    \ you will be able to manage large playbooks by importing or including other playbooks\
    \ or tasks from external files, either unconditionally or based on a conditional\
    \ test.\n\n# MANAGING LARGE PLAYBOOKS\n\nWhen a playbook gets large or complex,\
    \ you can divide it into smaller files to make it easier to manage. You can combine\
    \ multiple playbooks into a main playbook modularly, or insert lists of tasks\
    \ from a file into a play. This can make it easier to reuse playbooks or sequences\
    \ of tasks in different projects.\n\n# INCLUDING OR IMPORTING FILES\n\nThere are\
    \ two options that Ansible can use to bring content into a playbook. You can *include*\
    \ content, or you can *import* content.\n\nWhen you include content, it is a dynamic\
    \ operation. Ansible preprocesses included content during the run of the playbook,\
    \ as content is reached.\n\nWhen you import content, it is a static operation.\
    \ Ansible preprocesses imported content when the playbook is initially parsed,\
    \ before the run starts.\n\n# IMPORTING PLAYBOOKS\n\nThe `import_playbook` directive\
    \ allows you to import external files containing lists of plays into a playbook.\
    \ In other words, you can have a master playbook that imports one or more additional\
    \ playbooks.\n\nBecause the content being imported is a complete playbook, the\
    \ `import_playbook` feature can only be used at the top level of a playbook and\
    \ cannot be used inside a play. If you import multiple playbooks, then they will\
    \ be imported in order.\n\nA simple example of a master playbook that imports\
    \ two additional playbooks is shown below:\n\n+   - name: Prepare the web server\n\
    \  import_playbook: web.yml\n\n name: Prepare the database server\n  import_playbook:\
    \ db.yml\n\nYou can also interleave plays in your master playbook with imported\
    \ playbooks."
  merge: -1
  pgno: 284
- img_proc: true
  md: "# CHAPTER 7 | Managing Large Projects\n\n```\n- name: Play 1\nhosts: localhost\n\
    tasks:\n  - debug:\n    Msg: Play 1\n\n- name: Import Playbook\nimport_playbook:\
    \ play2.yml\n```\n\nIn the preceding example, the Play 1 runs first, followed\
    \ by the plays imported from the play2.yml playbook.\n\n# IMPORTING AND INCLUDING\
    \ TASKS\n\nYou can import or include a list of tasks from a task file into a playbook.\
    \ A task file is a file that contains a list of tasks.\n\n```\n[admin@node ~]$\
    \ cat webserver_tasks.yml\n- name: Installs the httpd package\n  yum:\n    name:\
    \ httpd\n    state: latest\n\n- name: Starts the httpd service\n  service:\n \
    \   name: httpd\n    state: started\n```\n\n# Import Task Files\n\nYou can statically\
    \ import a task file into a play inside a playbook using the import_tasks feature.\
    \ When you import a task file, the tasks in that file are directly inserted when\
    \ the playbook is parsed. The location of import_tasks in the playbook controls\
    \ where the tasks are inserted and in the order which multiple imports are run.\n\
    \n```\n- name: Install web server\nhosts: webservers\ntasks:\n  - import_tasks:\
    \ webserver_tasks.yml\n```\n\nWhen you import a task file, the tasks in that file\
    \ are directly inserted when the playbook is parsed. Because import_tasks statically\
    \ imports the tasks when the playbook is parsed, there are some effects on how\
    \ it works.\n\n+   - When using the import_tasks feature, conditional statements\
    \ set on the import, such as when, are applied to each of the tasks that are imported.\n\
    - You cannot use loops with the import_tasks feature.\n- If you use a variable\
    \ to specify the name of the file to import, then you cannot use a host or group\
    \ inventory variable."
  merge: -1
  pgno: 285
- img_proc: true
  md: "# Including Tasks Files\n\nYou can also dynamically include a task file into\
    \ a play inside a playbook by using the include_tasks feature.\n\n```\n---\nname:\
    \ Install web server\nhosts: webservers\ntasks:\n  - include_tasks: webserver_tasks.yml\n\
    ```\n\nThe include_tasks feature does not process content in the playbook until\
    \ the play is running and that part of the include playbook content is processed\
    \ impacts the include tasks features.\n\n+   - When using the include_tasks feature,\
    \ conditional statements such as when set on the include determine whether not\
    \ the tasks are included in the play at all.\n- If you run ansible-playbook --list-tasks\
    \ to list the tasks in the playbook, then tasks in the included task files are\
    \ not displayed. By comparison, the import_tasks feature would not list import\
    \ task files, but instead list individual tasks from the imported task files.\n\
    - You cannot use ansible-playbook --start-at-task to start playbook execution\
    \ from a task that is in an included task.\n- You cannot use a notify statement\
    \ to trigger a handler name that is in an included task file. You can trigger\
    \ a handler in a playbook that includes an entire task file, in which case all\
    \ tasks in the included file will run.\n\n> NOTE\nYou can find a more detailed\
    \ discussion of the differences in behavior between import_tasks and include_tasks\
    \ when conditionals are used at \"Conditions\" [https://docs.ansible.com/latest/user_guide/playbooks_conditionals.html#applying-when-to-roles-imports-and-includes]\
    \ in the Ansible User Guide.\n\n# Use Cases for Task Files\n\nConsider the following\
    \ examples where it might be useful to manage sets of tasks as external files\
    \ separate from the playbook:\n\n+   - If servers require complete configuration,\
    \ administrators could create various sets of tasks for creating users, installing\
    \ packages, configuring services, configuring privileges, setting up a shared\
    \ file system, handling the servers, installing security updates, and installing\
    \ a monitoring agent. Each of these sets of tasks could be managed through a separate\
    \ self-contained task file.\n- If servers are managed collectively by the developers,\
    \ the system administrators, and every organization can write its own task file\
    \ which can be reviewed and investigated by the system manager.\n- If a server\
    \ requires a particular configuration, then it can be integrated as a set of tasks\
    \ that are executed based on a conditional. In other words, including tasks only\
    \ if specific criteria are met."
  merge: -1
  pgno: 286
- img_proc: true
  md: "# CHAPTER 7 | Managing Large Projects\n\n+   - If a group of servers need to\
    \ run a particular task or set of tasks, then the tasks might only be run on a\
    \ server if it is part of a specific host group.\n\n# Managing Task Files\n\n\
    You can create a dedicated directory for task files, and save all task files in\
    \ that directory. Then your playbook can simply include or import task files from\
    \ that directory. This allows construction of a complex playbook making it easy\
    \ to manage its structure and components.\n\n# DEFINING VARIABLES FOR EXTERNAL\
    \ PLAYS AND TASKS\n\nThe incorporation of plays or tasks from external files into\
    \ playbooks using Ansible's import and include features greatly enhance the ability\
    \ to reuse tasks and playbooks across an Ansible environment. To maximize the\
    \ possibility of reuse, task and play files should be as generic as possible.\
    \ Variables can be used to parameterize play and task elements to expand the application\
    \ of tasks and plays.\n\nFor example, the following task file installs the package\
    \ needed for a web service, and then enables and starts the necessary service.\n\
    \n```\nname: Install the httpd package\n  yum:\n    name: httpd\n    state: latest\n\
    - name: Start the httpd service\n  service:\n    name: httpd\n    enabled: true\n\
    \    state: started\n```\n\nIf you parameterize the package and service elements\
    \ as shown in the following example, then the task file can also be used for the\
    \ installation and administration of other software and their services, rather\
    \ than being useful for web service only.\n\n```\n- name: Install the {{ package\
    \ }} package\n  yum:\n    name: \"{{ package }}\"\n    state: latest\n- name:\
    \ Start the {{ service }} service\n  service:\n    name: \"{{ service }}\"\n \
    \   enabled: true\n    state: started\n```\n\nSubsequently, when incorporating\
    \ the task file into a playbook, define the variables to use for the task execution\
    \ as follows:"
  merge: -1
  pgno: 287
- img_proc: true
  md: "# CHAPTER 7 | Managing Large Projects\n\n```\n...output omitted...\ntasks:\n\
    \  - name: Import task file and set variables\n    import_tasks: task.yml\nvars:\n\
    \  package: httpd\n  service: service\n```\n\nAnsible makes the passed variables\
    \ available to the tasks imported from the external file.\n\nYou can use the same\
    \ technique to make play files more reusable. When incorporating a play file into\
    \ a playbook, pass the variables to the play execution as follows:\n\n```\n...output\
    \ omitted...\n- name: Import play file and set the variable\n  import_playbook:\
    \ play.yml\nvars:\n  package: mariadb\n```\n\n> IMPORTANT\nEarlier versions of\
    \ Ansible used an include feature to include both playbooks and task files, depending\
    \ on context. This functionality is being deprecated for a number of reasons.\n\
    Prior to Ansible 2.0, include operated like a static import. In Ansible 2.0 it\
    \ was changed to operate dynamically, but this created limitations. In Ansible\
    \ 2.1 it became possible for include to be dynamic or static depending on task\
    \ settings, which was confusing and error-prone. There were also issues with ensuring\
    \ that include worked correctly in all contexts.\nThus, include was replaced in\
    \ Ansible 2.4 with new directives such as include_tasks,import_tasks, and import_playbook.\
    \ You might find examples of include in older playbooks, but you should avoid\
    \ using it in new ones.\n\n# REFERENCES\n\nIncluding and Importing – Ansible Documentation\n\
    https://docs.ansible.com/ansible/latest/user_guide/playbooks_reuse_includes.html\n\
    \nCreating Reusable Playbooks – Ansible Documentation\nhttps://docs.ansible.com/ansible/latest/user_guide/playbooks_reuse.html\n\
    \nConditionals – Ansible Documentation\nhttps://docs.ansible.com/ansible/latest/user_guide/playbooks_conditionals.html"
