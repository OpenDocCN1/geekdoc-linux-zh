  md: "# OBJECTIVES\n\nAfter completing this section, you should be able to write\
    \ a basic Ansible Playbook and run it using the **ansible-playbook** command.\n\
    \n# ANSIBLE PLAYBOOKS AND AD HOC COMMANDS\n\nAd hoc commands run a single, simple\
    \ task against a set of targeted hosts as a one-time command. The real power of\
    \ Ansible, however, is learning how to use playbooks to run multiple, complex\
    \ tasks against a set of targeted hosts in an easily repeatable manner.\n\n*A\
    \ playbook* is an ordered set of tasks running against hosts from your inventory.\
    \ *A playbook* is a text file containing a list of one or more plays to run in\
    \ a specific order.\n\nAllow you to change a length, complex set of manual administrative\
    \ tasks into an easily repeatable routine with documented and successful outcomes.\
    \ In a playbook, you can save the sequence of tasks in a play into a human-readable\
    \ and immediately runnable form. The tasks themselves, because of the way in which\
    \ they are written, document the steps needed to deploy your application or infrastructure.\n\
    \n# FORMATTING AN ANSIBLE PLAYBOOK\n\nTo help you understand the format of a playbook,\
    \ review this ad hoc command from a previous chapter:\n\n```\n`[@workstation ~]$\
    \ ansible -m user -a \"name=newbie uid=4000 state=present\" \\> servera.lab.example.com`\n\
    ```\n\nThis can be rewritten as a single task play and saved in a playbook. The\
