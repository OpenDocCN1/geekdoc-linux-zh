  md: "# CHAPTER 9 | Troubleshooting Ansible\n\nA task can determine if the playbook\
    \ is running in check mode by testing the value of the magic variable ansible_check_mode.\
    \ This Boolean variable is set to true if the playbook is running in check mode.\n\
    \n> > WARNING Tasks that have check_mode: not set will run when the playbook is\
    \ running with ansible-playbook --check. Therefore, you cannot trust that the\
    \ --check option will not manage changes to managed hosts, without confirming\
    \ this to be the case by inspecting the playbook and any roles or tasks associated\
    \ with it.\n\n> > NOTE If you have old playbooks that use always_run: yes to force\
    \ tasks to normally even in check mode, you will have to replace that with check_mode:\
    \ no in Ansible 2.6 and later.\n\nThe ansible-playbook command also provides a\
    \ --diff option. This option reports the changes made to the template files on\
    \ managed hosts. If used with the --check option, those changes are displayed\
    \ in the command's output but not actually.\n\n```\n$student@demo~$ ansible-playbook\
    \ --check --diff playbook.yml\n```\n\n# TESTING WITH MODULES\n\nSome modules can\
    \ provide additional information about the status of the managed host. The following\
    \ list includes some of the modules that can be used to test and debug issues\
    \ on managed hosts.\n\n+   - The uri module provides a way to check that a RESTful\
    \ API is returning the required content.\n\n```\ntasks:\n  - uri:\n    url: http://api.myapp.com\n\
    \    return_content: yes\n    register: apiresponse\n\n  - fail:\n    msg: \"\
    version was not provided\"\n    when: \"version\" not in apiresponse.content\n\
    ```\n\n+   - The script module supports executing a script on managed hosts, and\
    \ fails if the return code for that script is nonzero. The script must exit on\
    \ the control node and is transferred to and executed on the managed hosts.\n\n\
    ```\ntasks:\n  - script: check_free_memory\n```\n\n+   - The stat module gathers\
    \ facts for a file like the stat command. You can use it to register a variable\
    \ and then test to determine if the file exists or to get other information about\n\
    \n368 RH294-RHEL8.0-en-1-20190531"
