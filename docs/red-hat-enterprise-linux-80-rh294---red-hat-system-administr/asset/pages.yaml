  md: "# Changing a Role's Behavior with Variables\n\nA well-written role uses default\
    \ variables to alter the role's behavior to match a related configuration scenario.\
    \ This helps the role more generic and reusable in a variety of contexts.\n\n\
    The value of any variable defined in a role's defaults directory will be overwritten\
    \ if that same variable is defined in\n\n+   - in an inventory file, either as\
    \ a host or a group variable.\n- in a YAML file under the group_vars or host_vars\
    \ directories of a playbook project\n- as a nested variable in the vars keyword\
    \ of a play\n- as a variable when including the role in roles keyword of a play\n\
    \nThe following example shows how to use the motd role with a different value\
    \ for the system_owner variable. The value specified, someone@host.example.com,\
    \ will replace the reference when the role is applied to a managed host.\n\n```\n\
    [host ~]$ cat use-motd-role playbook\n  name: use motd playbook\n  hosts: remote.example.com\n\
    \  remote_user: devops\n  vars:\n    system_owner: someone@host.example.com\n\
    \  roles:\n    role: motd\n```\n\nWhen defined this way, the system_owner replaces\
    \ the value of the default variable of the same name. Any variable definitions\
    \ nested within the vars keyword will not replace the value of that variable defined\
    \ in a role's vars directory.\n\nThe following example also shows how to use the\
    \ motd role with a different value for the system_owner variable. The value specified,\
    \ someone@host.example.com, will replace the reference regardless of being defined\
    \ in the role's vars or defaults directory.\n\n```\n[host ~]$ cat use-motd-role\
    \ playbook\n  name: use motd playbook\n  hosts: remote.example.com\n  remote_user:\
    \ devops\n  become: true\n  roles:\n    role: motd\n    system_owner: someone@host.example.com\n\
    ```"
  merge: -1
  pgno: 332
- img_proc: true
  md: '# CHAPTER 8 | Simplifying Playbooks with Roles


    > ### IMPORTANT

    Variable precedence can be confusing when working with role''s default variables.


    +   - Almost any other variable will override role''s default variables: inventory
    variables, play `vars`, inline role parameters, and so on.

    - Fewer variables can override variables defined in a role''s `vars` directory.
    variables loaded with `include_vars`, registered variables, and role parameters
    are some variables that can do that. Inventory variables and play `vars` cannot.
    This is important because it helps keep your play from accidentally changing the
    internal functioning of the role.

    - However, variables declared inline as role parameters, like the last of the
    preceding examples, have very high precedence. They can override variables defined
    in a role''s `vars` directory. If a role parameter has the same name as a variable
    set in play `vars`, a role''s `vars`, or an inventory or playbook variable, the
    role parameter overrides the other variable.


    # REFERENCES


    Using Roles – Ansible Documentation

    https://docs.ansible.com/ansible/latest/user_guide/playbooks_reuse_roles.html#using-roles


    Using Variables – Ansible Documentation

    https://docs.ansible.com/ansible/latest/user_guide/playbooks_variables.html'
