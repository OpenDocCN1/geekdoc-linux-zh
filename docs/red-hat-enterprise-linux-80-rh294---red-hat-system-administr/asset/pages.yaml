  md: "```\n\"children\": [\n  \"databases\",\n  \"ungrouped\",\n  \"webservers\"\n\
    ],\n\"databases\": {\n  \"hosts\": [\n    \"db1.lab.example.com\",\n    \"db2.lab.example.com\"\
    \n  ]\n},\n\"ungrouped\": {\n  \"hosts\": [\n    \"workstation1.lab.example.com\"\
    \n  ]\n},\n\"webservers\": {\n  \"hosts\": [\n    \"web1.lab.example.com\",\n\
    \    \"web2.lab.example.com\"\n  ]\n}\n```\n\nIf you want to write your own dynamic\
    \ inventory script, more detailed information is available at Developing Dynamic\
    \ Inventory Sources [http://docs.ansible.com/ansible/dev_guide/developing_inventory.html]\
    \ in the Ansible Developer Guide. The following is a brief overview.\n\nStart\
    \ the script with an appropriate interpreter line (for example, #!/usr/bin/python)\
    \ and should be executable so that Ansible can run it.\n\nWhen passed the `--list`\
    \ option, the script must print a JSON-encoded hash/dictionary of all the hosts\
    \ and groups in the inventory.\n\nIn its simplest form, a group can be a list\
    \ of managed hosts. The JSON-encoded output from an inventory script, webservers\
    \ is a host group that has web1.lab.example.com and web2.lab.example.com as managed\
    \ hosts in the group. The databases host group includes db1.lab.example.com and\
    \ db2.lab.example.com as members.\n\n```\nstudent@workstation ~$ ./inventory --list\n\
    {\n  \"webservers\": [ \"web1.lab.example.com\", \"web2.lab.example.com\" ],\n\
    \  \"databases\": [ \"db1.lab.example.com\", \"db2.lab.example.com\" ]\n}\n```\n\
    \nAlternatively, each group's value can be a JSON hash/dictionary containing a\
    \ list of managed host, any child groups, and any group variables that might be\
    \ set. The next example shows the JSON-encoded output for a more dynamic inventory.\
    \ The boston group has two child groups (backup and ipa), three managed hosts\
    \ of one, and a group variable set (example_host: false)."
