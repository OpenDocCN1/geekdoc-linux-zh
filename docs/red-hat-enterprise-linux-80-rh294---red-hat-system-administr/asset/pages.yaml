- img_proc: true
  md: '# DESCRIBING ROLE STRUCTURE


    # OBJECTIVES


    After completing this section, you should be able to describe what a role is,
    how it is structured, and how you can use it in a playbook.


    # STRUCTURING ANSIBLE PLAYBOOKS WITH ROLES


    As you develop more playbooks, you will probably discover that you have many opportunities
    to reuse code from playbooks that you have already written. However plays a role
    to copy a MySQL database for one application could be re-purposed, with different
    hostnames, and users, to configure a MySQL database for another application.


    But in the real world, a role might be long and complex, with many included or
    imported files, and with tasks and handlers to manage various situations. Copying
    all code into another playbook might be nontrivial work.


    Ansible roles provide a way for you to make it easier to reuse Ansible code generically.
    You can package, a role in a standardized directory structure, all the tasks,
    variables, templates, and other resources needed to provide infrastructure or
    deploy applications. Copy that role from project simply by copying the directory.
    You then can then simply call that role from a play to execute it.


    A well-written role will allow you to pass variables to the role from the playbook
    that adjusts its behavior, setting all the site-specific hostnames, IP addresses,
    user names, secrets, or other locally-specific details you need. For example,
    a role to deploy a database server might have been written to support variables
    which set the hostname, database admin user and password, and other parameters
    that need customization for your installation. The author of the role can also
    ensure that reasonable default values are set for those variables if you choose
    not to set them in the play.


    Ansible roles have the following benefits:


    +   - Roles group content, allowing easy sharing of code with others

    - Roles can be written that define the essential elements of a system type: web
    server, database server, Git repository, or other purpose

    - Roles make larger projects more manageable

    - Roles can be developed in parallel by different administrators


    In addition to writing, using, reusing, and sharing your own roles, you can get
    roles from other sources. Roles are included as part of Red Hat Enterprise Linux,
    in the rhel-system-roles package. You can also get many community-supported roles
    from the Ansible Galaxy website. Later in this chapter, you will learn more about
    these roles.


    # EXAMINING THE ANSIBLE ROLE STRUCTURE


    An Ansible role is defined by a standardized structure of subdirectories and files.
    The top-level directory defines the name of the role itself. Files are organized
    into subdirectories that'
  merge: -1
