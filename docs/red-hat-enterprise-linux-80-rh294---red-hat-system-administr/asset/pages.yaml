  md: '# CREATING ROLES AND USING DYNAMIC INVENTORY


    In your review, you will convert the ansible-vsftpd.yml playbook into a role,
    and then use that role in a new playbook that will run some additional tasks.
    You will also install and use a dynamic inventory script, which will be provided
    to you.


    # OUTCOMES


    You should be able to:


    +   - Create a role to configure the vsftpd service using tasks from an existing
    playbook.

    - Include a role in a playbook, and execute the playbook.

    - Use a dynamic inventory when executing a playbook.


    # INSTRUCTIONS


    Configure your Ansible project to use the dynamic inventory script crinventory.py
    and the static inventory file inventory.


    Convert the ansible-vsftpd.yml playbook into the role ansible-vsftpd, as specified
    below:


    +   - Use the ansible-galaxy command to create the directory structure for the
    role ansible-vsftpd in the review-roles/roles directory of your Ansible project.

    - The file defaults-template.yml contains default variables for the role. Move
    this file to an appropriate location in the role directory structure.

