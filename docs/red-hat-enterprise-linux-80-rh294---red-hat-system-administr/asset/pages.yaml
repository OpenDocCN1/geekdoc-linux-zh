  md: "# CHAPTER 8 | Simplifying Playbooks with Roles\n\n+   - src: geerlingguy.redis\n\
    \  version: \"1.5.0\"\n\nThe src attribute specifies the source of the role, in\
    \ this case the geerlingguy.redis role from Ansible Galaxy. The version attribute\
    \ is optional, and specifies the version of the role to install, in this case\
    \ 1.5.0.\n\n> IMPORTANT\nnYou should specify the version of the role in your requirements.yml\
    \ file, especially for playbooks in production.\n\nIf you do not specify a version,\
    \ you will get the latest version of the role. If the upstream author makes changes\
    \ to the role that are incompatible with your playbook, it may cause an automation\
    \ failure or other problems.\n\nTo install roles using a file, use the -r REQUIREMENTS-FILE\
    \ option:\n\n```\n[@host project]$ ansible-galaxy install -r roles/requirements.yml\
    \ \\\n -p roles\n  download role 'redis', owned by geerlingguy\n  download role\
    \ from https://github.com/geerlingguy/ansible-role-redis/archive/1.6.0.tar.gz\n\
    \  extracting geerlingguy.redis to /opt/project/roles/geerlingguy.redis\n  geerlingguy.redis\
    \ (1.6.0) was installed successfully\n```\n\nYou can use ansible-galaxy to install\
    \ roles that are not in Ansible Galaxy. You can host your own proprietary or internal\
    \ roles in a Git repository or on a web server. The following example shows how\
    \ to configure a requirements file using a variety of remote sources.\n\n```\n\
    [@host project]$ cat roles/requirements.yml\n# From Ansible Galaxy, using the\
    \ latest version\n- src: geerlingguy.redis\n\n# From Ansible Galaxy, overriding\
    \ the name and using a specific name\n- src: geerlingguy.redis\n  version: \"\
    1.5.0\"\n  name: redis_prod\n\n# From any Git-based repository, using HTTPS\n\
    - src: https://gitlab.com/guardianproject-ops/ansible-nginx-acme.git\n  scm: git\n\
