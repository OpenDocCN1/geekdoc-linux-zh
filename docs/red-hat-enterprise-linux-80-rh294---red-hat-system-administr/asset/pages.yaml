    # Connection Settings


    By default, Ansible connects to managed hosts using the SSH protocol. The most
    important parameters that control how Ansible connects to the managed hosts are
    set in the [defaults] section.


    By default, Ansible attempts to connect to the managed host using the same user
    name as the local user running the Ansible commands. To specify a different remote
    user, set the remote_user parameter to that user name.


    If the local user running Ansible has private SSH keys configured to allow them
    to authenticate as the remote user, Ansible automatically logs in. If that is
    not the case, you can configure Ansible to prompt the local user for the password
    used by the remote user by setting the directive ask_pass = true.


