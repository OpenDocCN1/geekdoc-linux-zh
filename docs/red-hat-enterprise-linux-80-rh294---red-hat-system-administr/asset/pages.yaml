  md: 'CHAPTER 10 | Automating Linux Administration Tasks


    # LAB


    # AUTOMATING LINUX ADMINISTRATION

    TASKS


    # PERFORMANCE CHECKLIST


    In this lab, you will configure and perform administrative tasks on managed hosts
    using a

    playbook.


    # OUTCOMES


    You should be able to create playbooks for configuring a managed host a software

    repository, users and groups, logical volumes, cron jobs, and additional network
    interfaces.


    # BEFORE YOU BEGIN


    On workstation, run the lab script to confirm that the environment is ready for

    the lab to begin. The script creates the working directory, called system-review,
    and

    populates it with an Ansible configuration file, a host inventory, and lab files.


    ```

    student@workstation~$ lab system-review start

    ```


    +   1. Create and execute on the webservers host group a playbook which configures
    the Yum

    internal repository located http://materials.example.com/yum/repository,

    and install the -mysql package available in that repository. All RPM packages
    are

    signed with an administrative GPG key pair. The GPG public key is available at
    http://nmaterials.example.com/repository/RPM-GPG-KEY-example.

    2. Create and execute on the webservers host group a playbook which creates the
    webadmin

    user group, and add two users to that group, ops1 and ops2.

    3. Create and execute on the webservers host group a playbook which uses the /dev/vdb

    device to create a logical volume named apache-vg. This also creates two logical

    volumes, named content-lv and log-lv1, both backed by the apache-vg volume.

    Finally, it creates VFS file system on each logical volume, and mounts the content-

    volume at /var/var and log-lv1 local volume at /var/log/bind.

    The lab script creates two files in ~/system-review, storage.yml which provides
    an

    initial skeleton for the playbook, and storage_vars.xml which provides values
    to all the

    variables required by different modules.

    4. Create and execute on the webservers host group a playbook which uses the cron
    module

    to execute the /etc/cron.d/usage cron file that schedules a recurring cron job.

    The job should run as the devops every two months from 09:00 and 16:59 on

    Monday through Friday. The job should append the current disk usage to the file
    /home/

    devops/disk_usage

    5. Create and execute on the webservers host group a playbook which uses the linux-\system-roles.
    network role to configure the 172.25.250.40/24 IP address the

    spare network interface, ens4.

    6. Run lab system-review grade on workstation to grade your work.


    46  RH294-RHEL.8.0-en-1-20190531'
