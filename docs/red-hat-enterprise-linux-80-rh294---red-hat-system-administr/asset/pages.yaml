  md: "# CHAPTER 5 | Implementing Task Control\n\nThe list used by loop can be provided\
    \ by a variable. In the following example, the variable mail_services contains\
    \ the list of services that need to be running.\n\n```\nvars:\n  mail_services:\n\
    \    - postfix\n    - docot\n```\n\n```\ntasks:\n  name: Postfix and Dovecot are\
    \ running\n    name: \"{{ item }}\"\n    state: started\n    loop: \"{{ mail_services\
    \ }}\"\n```\n\n# Loops over a List of Hashes or Dictionaries\n\nThe loop list\
    \ does not need to be a list of simple. In the following example, each item in\
    \ the list is actually a hash or a dictionary. Each hash or dictionary has two\
    \ keys, name and groups, and the value of each key in the current item loop variable\
    \ can be retrieved with the item.name and item.groups variables, respectively.\n\
    \n+   - name: Users exist and are in the correct groups\nuser:\n  name: \"{{ item.name\
    \ }}\"\n  state: present\n  groups: \"{{ item.groups }}\"\nloop:\n  - name: jane\n\
    \    groups: wheel\n  - name: joe\n    groups: root\n\nThe outcome of the preceding\
    \ task is that the user jane is present and a member of the group wheel, and that\
    \ the user joe is present and a member of the group root.\n\n# Earlier-Style Loop\
    \ Keywords\n\nBefore Ansible 2.5, playbooks used a different syntax for loops.\
    \ Multiple loop keywords were provided, which were prefixed with with_ followed\
    \ by the name of an Ansible look-up plugin-in (an advanced feature not covered\
    \ in this course). This syntax for looping is very common in existing playbooks,\
    \ but will be deprecated at some point in the future.\n\nA few examples are listed\
    \ in the table below:\n\nRH294-RHEL8.0-en-1-20190531\n\n155"
