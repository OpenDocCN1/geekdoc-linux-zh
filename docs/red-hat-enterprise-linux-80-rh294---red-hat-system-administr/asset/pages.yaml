  md: "```\n- debug:\n  msg: 'pre-task'\nnotify: my handler\nroles:\n  - role1\ntasks:\n\
    \  - debug:\n    msg: 'first task'\n    notify: my handler\npost_tasks:\n  - debug:\n\
    \    msg: 'post-task'\n    notify: my handler\nhandlers:\n  - name: my handler\n\
    \    debug:\n    msg: Running my handler\n```\n\nIn the above example, a debug\
    \ task executes in each section to notify the **my handler handler. The **my handler**\
    \ task is executed three times:\n\n+   - after all role tasks and tasks from the\
    \ **tasks** section execute\n- after all the **post_tasks** tasks execute\n\n\
    Roles can be added to a play using an ordinary task, not just by including them\
    \ in the **roles** section of a play. Use the `include_role` module to dynamically\
    \ include a role, and use the `import_role` module to statically import a role.\n\
    \nThe following playbook demonstrates how a role can be included in a task with\
    \ the `include_role` module.\n\n```\n- name: Execute a role as a task\nhosts:\
    \ remote.example.com\ntasks:\n  - name: A normal task\n    debug:\n    msg: 'first\
    \ task'\n  - name: A task to include role2 here\n    include_role: role2\n```\n\
    \n> NOTE\nThe `include_role` module was added in Ansible 2.3, and the `import_role`\
    \ module in Ansible 2.4.\n\n> REFERENCES\nRoles – Ansible Documentation\nhttps://docs.ansible.com/ansible/latest/user_guilde/playbooks_reuse_roles.html!"
