    \ Echo Task] ******************************************************************\n\
    ...output omitted...\n\n```\nTASK [Show stdout from the previous task] **************************************************\n\
    ok: [localhost] => item=((...output omitted...)) => {\n  msg: \"STDOUT from previous\
    \ task: This is my one\"\n}\nok: [localhost] => item=((...output omitted...))\
    \ => (\n  msg: \"STDOUT from previous task: This is my two\"\nn\n```\n\n# RUNNING\
    \ TASKS CONDITIONALLY\n\nAnsible can use conditionals to execute tasks or plays\
    \ when certain conditions are met. For example, a conditional can be used to determine\
    \ available memory on a managed host before Ansible installs or configures a service.\n\
    \nConditionals allow administrators to differentiate between managed hosts and\
    \ assign them roles based on the conditions that they meet. Playbook variables,\
    \ registered variables, and Ansible facts can all be tested with conditionals.\
    \ Operators compare strings, numeric data, and Boolean values.\n\nThe following\
    \ scenarios illustrate the use of conditionals in Ansible:\n\n+   - A hard limit\
    \ can be defined in a variable (for example, min_memory) and compared against\
    \ the available memory on a managed host.\n- The output of a command can be captured\
    \ and evaluated by Ansible to determine whether or not a task completed before\
    \ further action. For example, if a program fails, then a batch is skipped.\n\
    - Use Ansible facts to determine the managed host network configuration and decide\
    \ which template to send (for example, network bonding or躯).\n- The number of\
    \ CPUs can be evaluated to determine how properly tune a web server.\n- Compare\
    \ a registered variable with a predefined variable to determine if a service changed.\
    \ For example, test the MDS checksum of a service configuration file to see if\
    \ the service is changed.\n\n# Conditional Task Syntax\n\nThe when statement is\
    \ used to run a task conditionally. It takes as a value the condition to test.\
    \ If the condition is not met, the task runs. skipped.\n\nOne of the simplest\
    \ conditions that can be tested is Boolean variable is true or false. The when\
    \ statement in the following example causes the task to run only if run_my_task\
    \ is true:\n\nRH294-RHEL8.0-en-1-20190531 159"
  merge: -1
