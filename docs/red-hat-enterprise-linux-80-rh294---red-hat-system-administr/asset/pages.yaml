  md: "# CHAPTER10 | Automating Linux Administration Tasks\n\n```\n- name: NIC configuration\n\
    nmcli:\n  conn_name: ens4-conn\n  ifname: ens4\n  type: ethernet\n  ip4: 172.25.250.30/24\n\
    \  gw4: 172.25.250.1\n  state: present\n```\n\n+   - Configures ens4-conn as the\
    \ connection name.\n- Binds the ens4-conn connection to the ens4 network interface.\n\
    - Configures the network interface as ethernet.\n- Configures the 172.25.250.30/24\
    \ IP address on the interface.\n- Sets the gateway to 172.25.250.1\n- Makes sure\
    \ the connection is available.\n\nThe hostname module sets the hostname for a\
    \ managed host without hosts. This module uses the name parameter to specify the\
    \ new hostname, as on the task shown below:\n\n```\n- name: Change hostname\n\
    hostname:\n  name: managedhost1\n```\n\nThe firewall module supports the management\
    \ of FirewallD on managed hosts. This modules supports the configuration of FirewallD\
    \ rules for services and ports. It also supports the zone management, including\
    \ the association or network interfaces and rules to a specific zone.\n\nThe following\
    \ task shows how to create a FirewallD rule for the http service on the default\
    \ zone (public). The task configures the rule as permanent, and makes sure it\
    \ is active.\n\n```\n- name: Enabling http rule\nfirewalld:\n  service: http\n\
    \  permanent: yes\n  state: enabled\n```\n\nThis task configures the eth0 in the\
    \ external FirewallD zone.\n\n```\n- name: Moving eth0 to external\nfirewalld:\n\
    \  zone: external\n  interface: eth0\n  permanent: yes\n  state: enabled\n```\n\
    \nThe following table lists some of the parameters for the firewalld module."
