  md: '# Determining Modified Options


    When working with configuration files, you might want to find out which options
    have been set to values which are different from the built-in defaults.


    You can do this by running the ansible-config dump -v \-only-changed command.
    The -v option depends on the location of the ansible.cfg file used when processing
    the command. The ansible-config command follows the same order of precedence previously
    mentioned for the ansible command. Output will vary depending on the location
    of the ansible.cfg file and which directory the ansible-config command is ran.


    In this example, there is a single configuration file located at /etc/ansible/ansible.cfg.
    The ansible-config is first ran from student''s home directory, from a working
    directory with the following results:


    ```

    [controlnode] $ ansible-config dump -v \-only-changed

    Using /etc/ansible/ansible.cfg as config file

    DEFAULT_ROLES_PATH(/etc/ansible/ansible.cfg) = [''/etc/ansible/roles'', ''u''/usr/share/ansible/roles'']

    ```


    ```

    [controlnode] -$ cd /home/student/workingdirectory

    [controlnodeworkingdirectory]$ ansible-config dump -v \-only-changed

    Using /etc/ansible/ansible.cfg as config file

    DEFAULT_ROLES_PATH(/etc/ansible/ansible.cfg) = [''/etc/ansible/roles'', ''u''/usr/share/ansible/roles'']

    ```


    However, if you have a custom ansible.cfg file in your working directory, the
    same will display information based on where it is ran and the relative ansible.cfg
    file.


    ```

    [controlnode] -$ ansible-config dump -v \-only-changed

    Using /etc/ansible/ansible.cfg as config file

    DEFAULT_ROLES_PATH(/etc/ansible/ansible.cfg) = [''/etc/ansible/roles'', ''u''/share/ansible/roles'']

