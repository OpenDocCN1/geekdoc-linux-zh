  md: "# CHAPTER 9 | Troubleshooting Ansible\n\nFor example, the following inventory\
    \ entry configures Ansible to connect to 192.0.2.4 when\nprocessing the host web4.phx.example.com:\n\
    \n```\nweb4.phx.example ansible_host=192.0.2.4\n```\n\nThis is a useful way to\
    \ control Ansible connects to managed hosts. However, it can also cause\nproblems\
    \ if the value of ansible_host is incorrect.\n\n# TESTING MANAGED HOSTS USING\
    \ AD HOC\nCOMMANDS\n\nThe following examples illustrate some of the checks that\
    \ can be made on a managed host\nthrough the use of ad hoc commands.\n\nYou have\
    \ used the ping module to test whether you can connect to managed hosts. Depending\n\
    on on the options you provide you can also use it to test whether privilege escalation\
    \ and credentials are\ncorrectly configured.\n\n```\n[student@demo ~]$ ansible\
    \ demohost -m ping\ndemohost | SUCCESS => {\n  \"ansable_facts\": {\n    \"discovered_interpreter_python\"\
    : \"/usr/libexec/platform-python\",\n    \"changed\": false,\n    \"ping\": \"\
    pong\"\n  }\n[student@demo ~]$ ansible demohost -m ping --become\ndemohost | FAILED\
    \ => {\n  \"ansable_facts\": {\n    \"discovered_interpreter_python\": \"/usr/libexec/platform-python\"\
    ,\n    \"changed\": false,\n    \"module_stderr\": \"sudo: a password is required\\\
    n\",\n    \"module_stdout\": \"\",\n    \"msg\": \"MODULE FAILURE\\See stdout\\\
    stderr for the exact error\",\n    \"rc\": 1\n}\n```\n\nThis example returns the\
    \ currently available space on the disks configured on the demohost\nmanaged host.\
    \ That can be useful to confirm that the file system on the managed host is not\
    \ full.\n\n```\n[student@demo ~]$ ansible demohost -m command -a 'df'\n```\n\n\
    This example returns the currently free memory from the demohost managed host.\n\
    \n```\n[student@demo ~]$ ansible demohost -m command -a 'free -m'\n```\n\n# THE\
    \ CORRECT LEVEL OF TESTING\n\nAnsible is designed to ensure that the configuration\
    \ in playbooks and performed by\nits modules is correct. It monitors all modules\
    \ for reported failures, and stops the playbook"
