  md: '# CHAPTER 5 | Implementing Task Control


    The following snippets show examples of how to express multiple conditions.


    +   - If a conditional statement should be met when either condition is true,
    then you should use the or statement. For example, the following condition is
    met if the machine is running either Red Hat Linux or Fedora:


    ```

    when: ansible_distribution == "RedHat" or ansible_distribution == "Fedora"

    ```


    +   - With the and, both conditions have to be true for the entire conditional
    statement to be met. For example, the following condition is met if the remote
    host is a Red Hat Linux 7.5 host, and the installed kernel is the specified version:


    The when keyword also supports using a list to describe a list of conditions.
    When a list is provided to the when keyword, all of the conditionals are combined
    using the and operation. The example below demonstrates another way to combine
    multiple conditional statements using the and and operator:


    when:


    +   - ansible_distribution_version == "7.5"

    - ansible_kernel == "3.10.0-327.el7.x86_64"


    This format improves readability, a key of well-written Ansible Playbooks.


    +   - More complex conditional statements can be expressed by grouping conditions
    with parentheses. This ensures they are correctly interpreted.


    For example, the following conditional statement should be met if the machine
    is running either Red Hat Linux 7 or Fedora 28. This example uses the greater-character
    (>) so the long conditional can be split over multiple lines in the playbook,
    to make it easier to read.


    when: >


    ```

    ( ansible_distribution == "RedHat" and

    ansible_distribution_major_version == "7"

    or

    ( ansible_distribution == "Fedora" and

    ansible_distribution_major_version == "28")

    ```


    # COMBINING LOOPS AND CONDITIONAL TASKS


    You can combine loops and conditionals.


    In the following example, the mariadb-server package is installed by the yum fact
    if there is a file system mounted on / with more than 300 MB free. The ansible_mounts
    is a list of directories, each representing facts about one mounted file system.
    The loop iterates over each directory in the list, and the conditional statement
    is not met unless dictionary found representing a mounted file system where both
    conditions are true.'
