  md: '# CHAPTER 7 | Managing Large Projects


    > NOTE

    When called with the --hostname option, the script must print a JSON hash/dictionary
    of the variables for the host. An empty JSON hash or dictionary may be printed
    if there are no variables provided.


    Optionally, if the --list option returns a top-level element called _meta, it
    is possible to return all variables in one script call, which improves script
    performance. In case, -host calls are not made.


    See Dynamic Inventory Sources [http://docs.ansible.com/ansible/developing_inventory.html]
    for more information.


    # MANAGING MULTIPLE INVENTORIES


    Ansible supports use of multiple inventories in the same run. If the location
    of the inventory is a directory (where specified by the -i value, the inventory
    parameter, or in some other way), all inventory files in the directory, either
    static or dynamic, are combined to determine the inventory. The executable files
    within that directory are used to retrieve dynamic inventories, and the other
    files are used as static inventories.


    Inventory files should not depend on other inventory files or scripts in order
    to Resolve. example, if a static inventory file specifies that a particular group
    should be a child of another group, then it also needs to have a placeholder entry
    for that group, even if all members of that group come from the dynamic inventory.
    Consider the cloud-east group in the following example:


    ```

    [cloud-east]

    [servers]

    test.demo.example.com

    [servers:children]

    cloud-east

    ```


    This ensures that matter the order in which inventory files are parsed, all of
    them are internally consistent.


    > NOTE

    The order in which inventory files are parsed is not specified by the documentation.
    Currently, when multiple inventory files exist, they are parsed in alphabetical
    order. If one inventory source depends on information from another inventory source,
    then the order in which they are loaded may determine if the inventory file works
    as expected or throws an error. Therefore, it is important to make sure that all
    files are self-consistent to avoid unexpected errors.


    Ansible ignores files in an inventory directory if they end with certain suffixes.
    This can be controlled with the inventory_ignore_extensions directive in the Ansible
    configuration file. More information is available in the Ansible documentation.


