    # Synchronizing Files Between the Control Node and Managed Hosts


    The synchronize module is a wrapper around the rsync tool, which simplifies common
    file management tasks in your playbooks. The rsync tool must be installed on both
    the local and remote host. By default, when using the synchronize module, the
    "local host" is the host that the synchronize task originates on (usually the
    control node), and the "destination host" is the host that synchronize connects
    to.


    The following example synchronizes a file located in the Ansible working directory
    to the managed hosts:


    +   - name: synchronize local file to remote files

    synchronize:

    src: /file

    dest: /path/to/file


    There are many ways to use the synchronize module and its many parameters, including
    synchronizing directories. Run the ansible-doc synchronize command for additional
    parameters and playbook examples.


    > REFERENCES

    ansible-doc(1), chmod(1), chown(1), rsync(1), stat(1) and touch(1) man pages

    Files modules

    https://docs.ansible.com/ansible/latest/modules/list_of_files_modules.html


    RH294-RHEL8.0-en-1-20190531'
