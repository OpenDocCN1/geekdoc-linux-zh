    ```\n\nThe scm keyword specifies the Ansible role name. If the role is not hosted\
    \ on Ansible Galaxy, the scm keyword indicates the role's URL.\n\nIf the role\
    \ is hosted in a source control repository, the scm attribute is required. The\
    \ ansible-galaxy command allows of downloading and installing roles from either\
    \ a Git-based or mercurial-based software repository. A Git-based repository uses\
