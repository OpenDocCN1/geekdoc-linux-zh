  md: '```

    [privilege_escalation]

    become = true

    become_method = sudo

    become_user = root

    become_pass = false

    ```


    The directives in this file are explained in the following table:


    # Ansible Configuration


    | DIRECTIVE | DESCRIPTION |

    |---|---|

    | inventory | Specifies the path to the inventory file. |

    | remote_user | The name of the user to log in as on the managed hosts. if not
    specified, the current user''s name is used. |

    | ask_pass | Whether or not prompt for an SSH password. Can be false if using
    SSH public key authentication. |

    | become | Whether to automatically switch on the managed host (typically to root)
    after connecting. This can also be specified by a plan. |

    | become_method | How to switch (typically sudo, which is the default, but su
    is an option). |

    | become_user | The user to switch to on the managed host (typically root, which
    is the default). |

    | become_ask_pass | Whether to prompt for a password for your become_method. Defaults
    to false. |


    # CONFIGURING CONNECTIONS


    Ansible needs to know how to communicate with its managed hosts. One of the most
    common reasons to change the configuration file is to control which methods and
    users Ansible uses to administer needed hosts. Some of the information includes:


    +   * The location of the inventory that lists the managed hosts and host groups

    * Which connection protocol to use with the managed hosts (by default, SSH), and
    whether or not a nonstandard network port is needed to connect to the server

    * Which remote user to use on the managed hosts; this could be root or it could
    be an unprivileged user

    * If the remote user is unprivileged, Ansible needs to know if it should try to
    escalate privileges to root and how to do it (for example, by using sudo)

    * Whether or not to prompt for an SSH password or sudo password to log in or gain
    privileges


    # Inventory Location


    In the [defaults] section, the inventory directive can point directly to a static
    inventory file, or to a directory containing multiple static inventory files and
    dynamic inventory scripts.


