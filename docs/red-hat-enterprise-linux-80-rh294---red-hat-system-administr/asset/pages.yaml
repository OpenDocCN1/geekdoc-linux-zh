    Some disadvantages of this approach are that it makes the inventory file more
    difficult to work with, mixes information about hosts and variables in the same
    file, and uses obsolete syntax.


    # Using Directories to Populate Host and Group Variables


    The preferred approach to defining variables for hosts and groups is to create
    two directories, **group_vars** and **host_vars**, in the same working directory
    as the inventory file or directory. These directories contain files defining group
    variables and host variables, respectively.


    > IMPORTANT

    The recommended practice is to define inventory variables using **host_vars**
    and **group_vars** directories, and not to define them in the inventory files.


    To define host variables for the servers group, you would create a YAML file named
    **group_vars/servers**, and then the contents of that file would set variables
    to values using the same syntax as in playbook.


    ```

    user: joe

    ```


    Likewise, to define host variables for a particular host, create a file with name
    matching the host in the **host_vars** directory to contain the host variables.


    The following examples illustrate this approach in more detail. Consider a scenario
    where there are two data centers to manage and the data center hosts are defined
    in the **~/project/inventory** file:


    RH294-RHEL8.0-en-1-20190531


    105'
