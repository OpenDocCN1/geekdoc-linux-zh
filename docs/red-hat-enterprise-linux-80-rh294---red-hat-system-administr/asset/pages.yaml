  md: '# GUIDED EXERCISE


    # MANAGING STORAGE


    In this exercise you will partition a new disk, create logical volumes and format
    them with XFS file systems, and mount them immediately and at boot time on your
    managed hosts.


    # OUTCOMES


    You should be able to:


    +   - Use the parted module to configure block device partitions.

    - Use the lvg module to manage LVM volume groups.

    - Use the lvol module to manage LVM logical volumes.

    - Use the filesystem to create file systems.

    - Use the mount module to control and configure mount points in /etc/fstab.


    # BEFORE YOU BEGIN


    Run the lab-system-storage start script from workstation to configure the environment
    for the exercise. The script creates the system-storage project directory, and
    downloads the Ansible configuration and the host inventory needed for the exercise.


