  md: '# CHAPTER 8 | Simplifying Playbooks with Roles


    The following command displays the contents of the motd.j2 template of the motd
    role. It references Ansible facts and a system_owner variable.


    ```

    [user@host ~]$$ cat roles/templates/motd.j2

    This is the system {{ ansible_facts[''hostname''] }}

    ```


    Today''s date: {{ ansible_facts[''date_time''][''date''] }}.


    Only use this system with permission.

    You can call as {{ system_owner }} for access.


    The role defines a default for the system_owner variable. The defaults/main.yml
    file in the role''s directory structure is where this value is set.

    The following defaults/main.yml file sets the system_owner variable to user@host.example.com.
    This will be the email address that is written in the /etc/motd of managed hosts
    that role is applied to.


    ```

    [user@host ~]$$ cat roles/defaults/main.yml

    system_owner: user@host.example.com

    ```


    # Recommended Practices for Role Content Development


    Roles allow playbooks to be written modular. To maximize the effectiveness of
    newly developed roles, consider implementing the following recommended practices
    in your role development:


    +   - Maintain each role in its own version control repository. Ansible works
    with git-based repositories.

    - Sensitive information, as passwords or SSM keys, should not be stored in the
    role repository. Sensitive values should be parameterized as variables with default
    values that are not sensitive. Playbooks that the role are responsible for defining
    sensitive variables through Ansible Vault files, environment variables, or other
    ansible-playbook options.

    - Use ansible-galaxy init to start your role, and remove any directories and files
    that you do not need.

    - Create and maintain README.md and meta/main.yml file to document what your role
    is for, and how to use it.

    - Keep your role focus on a specific purpose or function. Instead of making one
    role do many things, you might write more than one role.

    - Reuse and refactor roles. Resist creating new roles for edge configurations.
    If an existing role accomplishes a majority of the required configuration, refactor
    the existing role to integrate the new configuration scenario. Using integration
    and regression techniques to ensure that the role provides the required new functionality
    and does not cause problems for existing playbooks.


    # DEFINING ROLE DEPENDENCIES


    Role dependencies allow a role to include others as dependencies. For example,
    a role that defines a documentation server may depend upon another role that installs
    and configures a web server. Dependencies are defined in the meta/main.yml file
    in the role directory hierarchy.


    RH294-RHEL8.0-en-1-20190531 315'
