  md: '# AUTOMATING LINUX ADMINISTRATION WITH ANSIBLE


    # OBJECTIVE


    After completing this section, you should be able to describe the motivation for
    automating Linux administration tasks with Ansible, fundamental Ansible concepts,
    and Ansible''s basic architecture.


    # AUTOMATION AND LINUX SYSTEM ADMINISTRATION


    For many years, most system administration and infrastructure management has relied
    on manual tasks performed through graphical or command-line user interfaces. System
    administrators often work from checklists, other documentation, or a memorized
    route to perform standard tasks.


    This approach is error-prone. It is easy for a system administrator to skip a
    step or perform a step mistakenly. There is often limited verification that the
    steps were performed properly or that they result in the expected outcome.


    Furthermore, by managing each server manually and independently, it is very easy
    for many servers that are supposed to be in configuration to be different in minor
    (or major) ways. This can make maintenance more difficult and introduce errors
    or instability into the IT environment.


    Automation can help avoid the problems caused by manual system administration
    and infrastructure management. As a system administrator, you can use it to ensure
    that all your systems are correctly deployed and configured. This allows you to
    automate the repetitive tasks in your daily schedule, freeing up your time and
    allowing you to focus on more critical things. For your organization, this means
    you can more quickly roll out the next version of an application or updates to
    a service.


    # Infrastructure as Code


    A good automation system allows you to implement Infrastructure as Code practices.
    Infrastructure as Code means you can use to create a machine-readable automation
    language to define and describe the state you want your IT infrastructure to be.
    Ideally, this automation language should also be easy for humans to read, because
    then you can easily understand what that state is and make changes to it. This
    code is applied to your infrastructure to ensure that it is actually in state.


    If the automation is represented as text files, it can easily be managed in a
    version control system like software code. The advantage of this is that every
    change can be checked into the version control system, so you have a history of
    the changes over time. If you want to revert to an earlier known-good configuration,
    you can simply check that version of the code and apply it to your infrastructure.


    This builds a foundation to help you follow best practices in DevOps. Developers
    can define their desired configuration in the automation language. Operators can
    receive those changes easily to provide feedback, and use that automation to reproducibly
    ensure that systems are in the state expected by the developers.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Mitigating Human Error


    By reducing the tasks performed manually on using automation of tasks and Infrastructure
    as Code practices, your servers will be in consistent configurations more often.
    This means that you need to become accustomed to making changes through updating
    your automation code, rather than manually applying them to your servers. Otherwise,
    you run the risk of losing manually-applied changes the next time you change through
    your automation.


    Ansible allows you to use code review, peer review by multiple subject matter
    experts, and documentation of the procedure by the itself to reduce your operational
    risks.


    Ultimately, you can enforce changes to your IT Infrastructure must be made through
    automation in order to mitigate human error.


    # WHAT IS ANSIBLE?


    Ansible is an open source automation platform. It is a simple automation language
    that can perfectly describe an IT infrastructure in Ansible Playbooks. It is also
    an automation engine that runs Ansible Playbooks.


    Ansible can manage powerful automation tasks and adapt to many different workflows
    and environments. At the same time, new users of Ansible can quickly use it to
    become productive.


    # Ansible Is Simple


    Ansible Playbooks provide human-readable automation. This means that playbooks
    are automation tools that are also easy for humans to read, comprehend, and change.
    Special coding skills are required to write them. Playbooks execute tasks in order.
    The simplicity of playbook design makes them usable by every team, which allows
    new people to Ansible to get productive quickly.


    # Ansible Is Powerful


    You can use Ansible to deploy applications, for configuration management, for
    workflow automation, and for network automation. Ansible can be used to orchestrate
    the entire application life cycle.


    # Ans Is Agentless


    Ansible is built around an agentless architecture. Typically, Ansible connects
    to the hosts it manages using OpenSSH or WinRM and runs tasks (but not always)
    by pushing out small programs called Ansible modules to these hosts. These programs
    are used to push the system in its desired state. Any modules that are removed
    when finished with its tasks can start Ansible almost immediately because no special
    agents need to be approved for use and then deployed to the managed hosts. Because
    there are no agents and no additional custom security infrastructure, Ansible
    is more efficient and more secure than other alternatives.


    Ansible has a number of important strengths:


    +   - Cross platform support: Ansible provides agentless support for Linux, Windows,
    UNIX, and network devices, in physical, virtual, cloud, and container environments.

    - Human-readable automation: Ansible Playbooks, written as YAML text files, are
    easy to read and help ensure everyone understand what they want to do.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'Perfect description of applications: Every change can be made by Ansible Playbooks,
    and every aspect of your application environment can be described and documented.


    Easy to manage in version control: Ansible Playbooks and projects are plain text.
    They can be treated like source code and placed in your existing version control
    system.


    Support for dynamic inventories: The list of machines that Ansible manages can
    be dynamically updated from external servers in order to capture the current,
    list of all managed servers all the time, regardless of infrastructure or location.


    Orchestration that integrates easily with other systems: HP SA, Puppet, Red Hat
    Satellite, and other systems that exist in your environment can be leveraged and
    integrated into your Ansible workflow.


    # ANSIBLE: THE LANGUAGE OF DEVOPS


    ANSIBLE PLAYBOOK


    ![](img/c66fec31e9528c7da22e5fa5113dfa6e_19_0.png)


    Figure 1.1: Ansible across the application life cycle


    Communication is the key to DevOps. Ansible is the first automation language that
    can be read and written across IT. It is also the only automation engine that
    can automate the application life cycle and continuous delivery pipeline from
    start to finish.


    # ANSIBLE CONCEPTS AND ARCHITECTURE


    There are two types of machines in the Ansible architecture: control nodes and
    managed hosts. Ansible is installed and run from a control node, and this machine
    also has copies of your project files. A control node could be an administrator''s
    laptop, a system shared by a number of administrators, or a server running Red
    Hat Ansible.


    Managed hosts are listed in an inventory, which organizes systems into groups
    for easier collective management. The inventory can be defined in a static text
    file, or dynamically determined by scripts that get information from external
    sources.


    Instead of writing scripts, Ansible create high-level plays to ensure a host or
    group of hosts is in a particular state. A play performs a series of tasks on
    the hosts, in the order specified by the play. These plays are expressed in YAML
    format in a text file. A file that contains one or more plays is called a playbook.


    Each task runs a module, a small piece of code (written in Python, PowerShell,
    or some other language), with specific arguments. Each module is essentially a
    tool in your toolkit. Ansible has hundreds of useful modules that can perform
    a wide variety of automation tasks. They can act on system files, install software,
    or make API calls.'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'When used in a task, a module generally ensures that some particular aspect
    of the machine is in a particular state. For example, a task using one module
    may ensure that a file exists and has permissions and contents, while a task using
    a different module may make certain that a particular file is mounted. If the
    system is not in that state, the task should put it in that state. If the system
    is already in that state, it does nothing. If a task fails, Ansible''s default
    behavior is to abort the rest of the playbook for the hosts that failed.


    Tasks, plays and playbooks are designed to be idempotent. This means that you
    can safely run a playbook on hosts multiple times. When your systems are in the
    correct state the playbook makes no changes when you run it. This means that you
    should be able to run a playbook that should make no changes when you run it.
    There are a handful of modules that you can use to run arbitrary commands. However,
    you must use those modules with care to ensure that they run in idempotent way.


    Ansible also uses plug-ins. Plugins are code that you can add to Ansible and adapt
    it for new uses and platforms.


    The Ansible architecture is agentless. Typically, when an administrator runs an
    Ansible Playbook or an ad hoc command over SSH or WinRM. This means that clients
    do not need to have an Ansible-specific agent installed on managed hosts, and
    do not permit special network traffic to nonstandard port.


    Red Hat Ansible Tower is an enterprise tool to help you control, secure, and manage
    your Ansible automation at scale. You can use it to manage users who have access
    to run playbooks on hosts, share the use of SSH credentials without allowing users
    to transfer or see their contents, log all of your Ansible jobs, manage inventory,
    many other things. It provides a web-based user interface (web UI) and a RESTful
    API. It is not a core part of Ansible, but a separate product that helps you use
    Ansible more effectively with a team or at large scale.


    ![](img/c66fec31e9528c7da22e5fa5113dfa6e_20_0.png)


    Figure 1.2: Ansible architecture'
  merge: -1
