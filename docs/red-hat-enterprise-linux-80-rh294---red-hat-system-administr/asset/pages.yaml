  md: '# CHAPTER 7 | Managing Large Projects


    > IMPORTANT

    For certain purposes, each batch of hosts counts as if it were a full play running
    on a subset of hosts. This means that if an entire batch fails, the play fails,
    which causes the entire playbook run to fail.


    In the previous scenario with `serial`: 2 set, if something is wrong and the play
    fails for the first two hosts processed, then the playbook will abort and the
    remaining three hosts will not be run through the play. This is a useful feature
    because only a subset of the servers will be unavailable, leaving the service
    degraded rather than down.


    The `serial` keyword can also be specified as a percentage. This percentage is
    applied to the total number of hosts in play to determine the rolling update batch
    size. Regardless of the percentage, the number of hosts per pass will always be
    1 or greater.


    # REFERENCES


    +   * Rolling Update Batch Size – Delegation, Rolling Updates, and Local Actions
    – Ansible Documentation

    http://docs.ansible.com/ansible/playbooks_delegation.html#rolling-update-batch-size


    +   * Ansible Performance Tuning (For Fun and Profit)

    https://www.ansible.com/blog/ansible-performance-tuning'
