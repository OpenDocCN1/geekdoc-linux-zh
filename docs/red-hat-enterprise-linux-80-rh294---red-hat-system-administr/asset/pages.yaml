    \ software\ngathering facts.\n\nTo disable gathering for a play, set the gather_facts\
    \ keyword to **no**:\n\n+   - name: This play gathers no facts automatically\n\
    \  hosts: gather_farm\n  gather_facts: no\n\nEven if **gather_facts: no** is set\
    \ for a play, you can manually gather facts at any time by running\na task that\
    \ uses the **setup** module:\n\n+   - name: Manually gather facts\n  setup:\n\
    \    ...output omitted...\n\n# # CREATING CUSTOM FACTS\n\nAdministrators can create\
    \ *custom facts* which are stored locally on each managed host. These\nfacts are\
    \ integrated into the list of standard facts gathered by the **setup** module\
    \ when it runs on\nthe managed host. These allow the managed host to provide arbitrary\
    \ variables to Ansible which\ncan be used to adjust the behavior of plays.\n\n\
    Custom facts can be defined in a static file, formatted as an INI file or JSON.\
    \ They can also\nexecutable scripts that generate JSON output, just like a dynamic\
    \ inventory script.\n\nCustom facts allow administrators to define certain values\
    \ for managed hosts, which plays might\nuse to populate configuration files or\
    \ conditionally run tasks. Dynamic custom facts allow\nvalues for these facts,\
    \ or even when facts are provided, to be determined programmatically when\nthe\
    \ play is.\n\nBy default, the **setup** module loads custom facts from files and\
    \ scripts in each managed host's\n**/etc/ansible/facts.d**. The name of each file\
    \ script must end in //.fact** and must\nto be ordered. Dynamic custom fact scripts\
    \ must output JSON-formatted facts and must be\nexecutable.\n\nThis is an example\
    \ of a static custom fact written in INI format. An INI-formatted custom facts\n\
    file contains a top level defined by a section, followed by the key-value pairs\
    \ of the facts to define:\n\n```\n[packages]\nweb_package = httpd\ndb_package\
    \ = mariadb-server\n\n[users]\nuser1 = joe\nuser2 = jane\n```\n\nThe same facts\
    \ could be defined in JSON format. The following JSON facts are equivalent to\
    \ the\nfacts specified by the preceding example. The JSON data could be stored\
    \ in a\nstatic text file or printed to standard output by an executable script:"
  merge: -1
  pgno: 144
- img_proc: true
  md: "```\n{\n  \"packages\": {\n    \"web_package\": \"httpd\",\n    \"db_package\"\
    : \"mariadb-server\"\n  },\n  \"users\": {\n    \"user1\": \"joe\",\n    \"user2\"\
    : \"jane\"\n  }\n}\n```\n\n> NOTEnCustom facts cannot be in setup in YAML format\
    \ like a playbook. JSON format is the closest equivalent.\n\nCustom facts are\
    \ produced by the setup module in the ansible_facts.ansible_local variable. Facts\
    \ are organized by name of the file that defined them. For example, assume that\
    \ the preceding custom facts are produced by a file saved as /etc/ansible/facts.d/custom.fact\
    \ on the managed host. In that case, the value of ansible_facts.ansible_local['custom']['user1']\
    \ is joe.\n\nYou can inspect the structure of your custom facts by running the\
    \ setup module with an ad hoc command.\n\n```\n[user@demo ~]$ ansible demo.example.com\
    \ -m setup\ndemo.example.com | SUCCESS => {\n  \"ansible_facts\": {\n    ...output_local\"\
    : {\n      \"custom\": {\n        \"packages\": {\n          \"db_package\": \"\
    mariadb-server\",\n          \"web_package\": \"httpd\"\n        },\n        \"\
    users\": {\n        \"user1\": \"joe\",\n        \"user2\": \"jane\"\n      }\n\
    \    }\n    ...output omitted...\"\n  },\n  \"changed\": false\n}\n```\n\nCustom\
    \ facts can be used the same way as default facts in playbooks:\n\n```\n[user@demo\
    \ ~]$ cat playbook.yml\n---\n- hosts: all\n  tasks:\n```"
