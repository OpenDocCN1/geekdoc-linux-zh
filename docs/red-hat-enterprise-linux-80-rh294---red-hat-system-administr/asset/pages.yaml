    \  enabled: yes\n      gpgcheck: yes\n```\n\n+   * The file keyword allows you\
    \ to specify the the name of the file to create under the /etc/yum.repos.d/ directory.\
    \ The module automatically adds a .repo extension to that name.\n\n+   * Typically,\
    \ software providers digitally sign RPM packages using GPG keys. The RPM system\
    \ verifies package integrity by confirming that the package was signed by the\
