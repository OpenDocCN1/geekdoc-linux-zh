  md: "# CHAPTER 4 | Managing Variables and Facts\n\nBecause that file contains the\
    \ sensitive plain text password, it is vital that it be protected through file\
    \ permissions and other security measures.\n\n```\n[student@demo ~] ansible-playbook\
    \ --vault-password-file=vault-pw-file.yml\n```\n\nYou can also use the ANSIBLE_VAULT_PASSWORD_FILE\
    \ environment variable to specify the default location of the password file.\n\
    \n> IMPORTANTnStarting with Ansible 2.4, you can use multiple Vault passwords,\
    \ pass multiple --vault-id or --vault-password-file options to the ansible-playbook\
    \ command.\n\n```\n[student@demo ~] ansible-playbook \\\\\n> --vault-id one@prompt\
    \ --vault-id two@prompt site.yml\nVault password (one):\nVault password (two):\n\
    omitted...\n```\n\nThe IDs one and two can be anything and you can even omit them.\
    \ If you use the --vault-id option when you encrypt a file using ansible-vault\
    \ command, when you run ansible-playbook then the password for the matching IDs\
    \ is tried before any others. If it does not match, the other passwords provided\
    \ will be tried next. The vault ID @prompt with no ID is actually shorthand for\
    \ default@prompt, which means to prompt for the password for vault ID.\n\n# Recommended\
    \ Practices for Variable File Management\n\nTo simplify management, it makes sense\
    \ to set up your project so that sensitive variables and all other variables are\
    \ kept in separate files. The files containing sensitive variables can be protected\
    \ with the ansible-vault command.\n\nRemember that the preferred way to manage\
    \ group variables and host variables is to create directories at the playbook\
    \ level. The group_vars directory contains variable files with names matching\
    \ groups to which they belong. The host_vars directory normally contains variable\
    \ files with names matching hosts to which they can apply.\n\nInstead of using\
    \ a single group_vars.yml file, you can also use directories for each group or\
    \ managed host. Those directories then contain multiple variable files, all of\
    \ which are used by the group host or managed host. For example, in the following\
    \ project directory for playbook.yml, members of the webservers group use variables\
    \ in the group_vars/webservers/vars file, and example.com uses the variables in\
    \ host_vars/example.com/vars\n\n```\nansible.cfg\ngroup_vars\n  | webservers\n\
    \    | vars\nhost_vars\n  | demo.example.com\n```\n\nRH294-RHEL8.0-en-20190531"
