    \ time if it does. In this example, in addition to touching the file, Ansible\
    \ ensures that the owning user, group, and permissions of the file are set to\
    \ specific values.\n\n+   - Touch a file and set permissions\n  file:\n    path:\
    \ /path/to/file\n    owner: user1\n    group: group1\n    mode: 0644\n    state:\
    \ touch\n\nExample:\n\n```\n$ ls -l file\n--rw-r--r-- user1 group1 0 Nov 25 08:00\
    \ file\n```\n\n# ## Modifying File Attributes\n\nYou can use the file module to\
    \ ensure that a new or existing file has the correct permissions or SELinux type\
    \ as well.\n\nFor example, the file has retained the default SELinux context relative\
    \ to a user's home directory, which is not the desired context.\n\n```\n$ ls -z\
    \ samba_file\n--rw-r--r-- owner group unconfined:object_r:user_home_t:s0 samba_file\n\
