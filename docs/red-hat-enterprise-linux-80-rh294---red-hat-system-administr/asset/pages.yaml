    # Input method settings


    GNOME 3 in Red Hat Enterprise Linux 8 automatically uses the IBus input method
    selection system, which makes it easy to change keyboard layouts and input methods
    quickly.


    The Region & Language application can also be used enable alternative input methods.
    The Region & Language application''s window, the Input Sources box show what input
    methods are currently available. By default, English (US) will be the only available
    method. Highlight English (US) and click the keyboard icon to select the current
    keyboard layout.


    Some of the methods are marked with gears, which indicates that these methods
    have advanced configuration options and capabilities. For example, the Japanese
    (Kana Kanji) input method allows the user to pre-edit text in Latin and use Down
    Arrow and Up Arrow keys to select the correct characters.


    US English speakers may find also useful. For example, English (United States)
    is the keyboard layout English (international AltGr de keys), which treats AltGr
    (or the right Alt) on a PC 104/105-key keyboard as a "secondary-shift" modifier
    key and dead key activation key for adding additional characters. There are also
    Dvor and other alternative layouts available.


    > NOTE

    Any Unicode character can be entered in the GNOME desktop environment if the user
    knows the character Unicode code point, by typing Ctrl+Shift+U, followed by the
    code point. After Ctrl+Shift-U has been typed, an underlined u will be displayed
    to indicate that the system is waiting for Unicode code point entry.

    For example, the Lowercase Greek letter lambda has the code point U+03BB, and
    can be entered by typing Ctrl+Shift-U, then 03bb, Enter.


    # SYSTEM-WIDE DEFAULT LANGUAGE SETTINGS


    The system''s default language is set to US English, using the UTF-8 encoding
    of Unicode as its character set en_US.utf-8), but this can be changed during or
    after installation.


    From the command line, root can change the system-wide locale settings with the
    localectl command. If localectl is run with no arguments, it will display the
    current system-wide locale settings.'
