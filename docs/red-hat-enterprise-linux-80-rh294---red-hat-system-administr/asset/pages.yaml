  md: '# GUIDED EXERCISE


    # MANAGING USERS AND AUTHENTICATION


    In this exercise, you will create multiple users on your managed hosts and populate
    the authorized SSH keys for them.


    # OUTCOMES


    You should be able to:

    * Create a new user group.

    * Manage users with the user module.

