  md: "# CHAPTER 9 | Troubleshooting Ansible\n\nthe file. If the file does not exist,\
    \ the stat task will not fail, but its registered variable will report `false`\
    \ for `*.stat.exists`.\n\nIn this example, an application is still running if\
    \ `/var/run/app.lock` exists, in which case the play should abort.\n\n+   - Check\
    \ if `/var/run/app.lock` exists\n  stat:\n    path: /var/run/app.lock\n    register:\
    \ lock\n- Fail if the application is running\n  fail:\n    when: lock.stat.exists\n\
    \nThe assert module is an alternative to the `fail` module. The assert module\
    \ supports a option that takes a list of conditionals. If any of these conditionals\
    \ are false, the task fails. You can use the `success_msg` and `fail_msg` options\
    \ to customize the message it prints if it reports success or failure.\n\nThe\
    \ following example repeats the preceding one, but uses assert instead of fail.\n\
    \n+   - Check if `/var/run/app.lock` exists\n  stat:\n    path: /var/run/app.lock\n\
    \    register: lock\n- Fail if the application is running\n  assert:\n    that:\n\
    \      - not lock.stat.exists\n\n# TROUBLESHOOTING CONNECTIONS\n\nMany problems\
    \ when using Ansible to manage hosts are associated with connections to the host\
    \ and with configuration problems the remote user and privilege escalation.\n\n\
    If you are authenticating to a managed host, make sure that you have `remote_user`\
    \ set correctly in your configuration file or in your play. You should also confirm\
    \ that you have the correct SSH keys set up or are the correct password for that\
    \ user.\n\nMake sure that become is properly set, and that you are using the correct\
    \ `become_user` (which is root by default). You should confirm that you are entering\
    \ the correct `sudo` password and that `sudo` on the managed host is properly\
    \ configured.\n\nA more subtle problem has to do with inventory settings. For\
    \ a complex server with multiple network addresses, you might need to use a particular\
    \ address or DNS when connecting to that system. You might not want to use that\
    \ address as the machine's inventory name for better readability. You can set\
    \ a host inventory variable `ansible_host`, which will override the inventory\
    \ name with a different name or IP address and be used by Ansible to connect to\
    \ that host. This variable could be set in the `host_vars` file or directory for\
    \ that host, or be set in the inventory file itself.\n\nRH294-RHEL8.0-en-1-20190531\
    \ 369"
