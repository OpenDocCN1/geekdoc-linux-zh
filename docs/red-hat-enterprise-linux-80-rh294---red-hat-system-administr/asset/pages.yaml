    ok: [labhost1.example.com]\nok: [test1.example.com]\nok: [labhost2.example.com]\n\
    ok: [test2.example.com]\nok: [web.example.com]\nok: [data.example.com]\n```\n\n\
    The following example uses a wildcard pattern to match the names of hosts or host\
    \ groups that start with `192.168.2.`\n\n```\n[student@controlnode ~] $ cat playbook.yml\n\
    \  hosts: '192.168.2.*'\n  ...output omitted...\n[student@controlnode ~] $ ansible-playbook\
    \ playbook.yml\n```\n\n```\nPLAY [Test Host Patterns] ***********************************\n\
    ```\n\n```\nTASK [Gathering Facts] ***********************************\nok: [192.168.2.1]\n\
    ok: [192.168.2.2]\n```\n\nThe next example uses a wildcard pattern to match the\
