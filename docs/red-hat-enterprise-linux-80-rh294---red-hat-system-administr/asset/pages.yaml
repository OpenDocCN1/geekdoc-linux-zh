  md: '# CHAPTER 1 | Introducing Ansible


    # INSTALLING ANSIBLE


    # OBJECTIVES


    After completing this section, you should be able to install Ansible on a control
    node and describe the distinction between community Ansible and Red Hat Ansible
    Engine.


    # ANSIBLE OR RED HAT ANSIBLE AUTOMATION?


    Red Hat provides Ansible in special channels as a convenience to Red Hat Enterprise
    Linux subscribers, and you can use these software packages normally.


    However, if you want formal support for Ansible and its modules, Red Hat offers
    a special subscription for this, Red Hat Ansible Automation. This subscription
    includes support for Ansible itself, as Red Hat Ansible Engine adds this formal
    technical support with SLAs and a published scope of coverage for Ansible and
    its modules. More information on the scope of this support is available at Red
    Hat Ansible Engine Life Cycle [https://access.redhat.com/support/policy/updates/ansible-engine].


    # CONTROL NODES


    Ansible is simple to install. The Ansible software only needs to be installed
    on the control node (or nodes) from which Ansible will run. Hosts that are managed
    by Ansible do not need to have Ansible installed. This installation involves relatively
    few steps and minimal requirements.


    The control node should be a Linux or UNIX system. Microsoft Windows is not supported
    as a control node, although Windows systems can be managed hosts.


    Python 3 (version 3.5 or later) or Python 2 (version 2.7 or later) needs to be
    installed on the control node.


    > IMPORTANTnIf you are running Red Hat Enterprise Linux 8, Ansible 2.8 can automatically
    use the platform-python package that supports systems that use Python. You do
    not need to install the python-36 or python27 package from AppStream.


    ```

    [controlNode]# yum list installed platform-python

    Loaded plugins: langpacks, search-desired-repos

    Installed Packages

    platform-python.x86_64 3.6.2.el8_0 @anaconda

    ```


    Information on how to install the software package on a Red Hat Enterprise Linux
    system is available in the Knowledgebase article How Do I Download and Install
    Red Hat Ansible Engine? [https://access.redhat.com/articles/3174981].


    Ansible is under rapid development, and therefore Red Hat Ansible Engine has a
    rapid life cycle. Information on the current life cycle is available at https://access.redhat.com/support/policy/updates/ansible-engine.'
  merge: -1
