  md: "# CHAPTER 6 | Deploying Files to Managed Hosts\n\nTo use the template module,\
    \ use the following syntax. The value associated with the src key specifies the\
    \ source Jinja template, and the value associated with the dest key specifies\
    \ the file to be created on the destination hosts.\n\n```\ntasks:\n  - name: template\
    \ render\n    template:\n      src: /tmp/j2-template.j2\n      dest: /tmp/dest-config-file.txt\n\
    ```\n\n> NOTE\nThe template module also allows you to specify the owner (the user\
    \ that owns the file), group, permissions, and SELinux context of the deployed\
    \ file, just like the file. It can also use a validate option to run an arbitrary\
    \ command (such as visudo -c) to check the syntax of a file for correctness before\
    \ copying it into place.\nMore details, see ansible-doc template.\n\n# MANAGING\
    \ MANAGLED FILES\n\nTo avoid system administrators modify files deployed by Ansible,\
    \ it is a good practice to include a comment at the top of the template to indicate\
    \ that the file should not be manually edited.\n\nOne way to do this is to use\
    \ the \"Ansible managed\" string set in the ansible_managed directive. This is\
    \ not a normal variable but can be used as one in a template. The ansible_managed\
    \ directive is set in the ansible.cfg file:\n\n```\nansible_managed = Ansible\n\
    ```\n\nTo include the ansible_managed string inside a Jinja template, use the\
    \ following syntax:\n\n```\n{{ ansible_managed }}\n```\n\n# CONTROL STRUCTURES\n\
    \nYou can use Jinja control structures in template files to reduce repetitive\
    \ typing, or for each host in a dynamically, or conditionally insert text into\
    \ a file.\n\n# Using Loops\n\nJinja uses the for statement to provide looping\
    \ functionality. In this example, the user variable is replaced with all the values\
    \ included in the users's variable, one per line.\n\n```\n{% for in users %}\n\
    \  {{ user }}\n{% endfor %}\n```\n\nThe following example template uses a for\
    \ statement to run through all the values in the variable, replacing mysuer with\
    \ each value, except when the value is root.\n\nRH294-RHEL8.0-en-1-20190531 219"
  merge: -1
  pgno: 234
- img_proc: true
  md: "# CHAPTER 6 | Deploying Files to Managed Hosts\n\n```\n# for statement %\n\
    {% for myuser if not myuser == \"root\" %}\nUser number {{ loop.index }} - {{\
    \ myuser }}\n{% endif %}\n```\n\nThe loop.index variable expands to the index\
    \ number that the loop is currently on. It has a value of l which the first loop\
    \ executes, and assumes it increments by 1 through each iteration.\n\nAs another\
    \ example, this template uses a for statement, and assumes a myhosts variable\
    \ has been defined in the inventory file. This variable would contain a list of\
    \ hosts to be managed. With the following for statement, all hosts in the myhosts\
    \ group from the inventory\n\n```\n{% for myhost in groups['myhosts'] %}\n{{ myhost\
    \ }}\n{% endif %}\n```\n\nFor a more practical example, you can use this to generate\
    \ an /etc/hosts file from host facts dynamically. Assume that you have the following\
    \ playbook:\n\n+   - name: /etc/hosts is up to date\n  hosts: all\n  gather_facts:\
    \ yes\n  tasks:\n  - name: Deploy /etc/hosts\n    template:\n      src: templates/hosts.j2\n\
    \      dest: /etc/hosts\n\nThe three-line templates/hosts.j2 template constructs\
    \ the file from all hosts in the group all. The middle line is extremely long\
    \ in the template due to the length of the variable names. It iterates over each\
    \ host in the group to get three facts for the /etc/hosts file.\n\n```\n{% for\
    \ host in groups['all'] %}\n{{ hostvars['host']['ansible_facts']['default_ipv4']['address']\
    \ }}\n{{ hostvars['host']['ansible_facts']['fqdn'] }} {{ hostvars['host']\n['ansible_facts']['hostname']\
    \ }}\n{% endfor %}\n```\n\n# Using Conditionals\n\nJinja2 uses the if statement\
    \ to provide conditional control. This allows you to put a line in a deployed\
    \ file if certain conditions are met.\n\nIn the following example, the value of\
    \ the result variable is placed in the deployed file only if the value of the\
    \ finished variable is True.\n\n```\n{% if finished %}\n{{ result }}\n{% endif\
    \ %}\n```"
  merge: -1
  pgno: 235
- img_proc: true
  md: "# CHAPTER 6 | Deploying Files to Managed Hosts\n\n> **IMPORTANT\nYou can use\
    \ Jinja2 loops and conditionals in Ansible templates, but not in Ansible Playbooks.\n\
    \n# VARIABLE FILTERS\n\nJinja2 provides filters which change the output format\
    \ for template expressions (for example, JSON). There are filters available for\
    \ languages such as YAML and JSON. The **to_json** filter formats the expression\
    \ output using JSON, and the **to_yaml** filter formats the expression using YAML.\n\
    \n```\n{{ output | to_json }}\n{{ output | to_yaml }}\n```\n\nAdditional filters\
    \ are available, such as the **to_nice_json** and **to_nice_yaml** filters, which\
    \ format the expression output in JSON or YAML human readable format.\n\n```\n\
    {{ output | to_nice_json }}\n{{ output | to_nice_yaml }}\n```\n\nBoth **from_json**\
    \ and **from_yaml** filters extract strings in either JSON or YAML format, respectively,\
    \ to parse them.\n\n```\n{{ output | from_json }}\n{{ output | from_yaml }}\n\
    ```\n\n# VARIABLE TESTS\n\nThe expressions used with **when** clauses in Ansible\
    \ Playbooks are Jinja2 expressions. Built-in Ansible tests used to test return\
    \ values include **failed**, **changed**, **succeeded**, and **skipped**. The\
    \ following task shows how tests can be used inside of conditional expressions.\n\
    \n+   tasks:\n  - output omitted...\n  debug: msg=\"the execution was aborted\"\
    \n    when: returnvalue is failed\n\n> **REFERENCES**\n**template - Templates\
    \ a file out to a remote server – Ansible Documentation**nhttps://docs.ansible.com/ansible/latest/modules/template_module.html\n\
    \n**Variables - Ansible Documentation**nhttps://docs.ansible.com/ansible/latest/user_guide/playbooks_variables.html\n\
    \n**Filters - Ansible Documentation**nhttps://docs.ansible.com/ansible/latest/user_guide/playbooks_filters.html\n\
    \nRH294-RHEL8.0-en-1-20190531\n\n221"
