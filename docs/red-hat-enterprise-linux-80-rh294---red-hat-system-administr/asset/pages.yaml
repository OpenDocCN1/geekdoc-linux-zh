  md: "# CHAPTER 6 | Deploying Files to Managed Hosts\n\n| MODULE NAME | MODULE DESCRIPTION\
    \ |\n| synchronize | A wrapper around the rsync module to make common tasks quick\
    \ and easy. The synchronize module is not intended to provide access to the full\
    \ power of the rsync command, but does make the most common invocations easier\
    \ to implement. You may still need to call the rsync command directly via the\
    \ run command module depending on your use case. |\n\n# # AUTOMATION EXAMPLES\
    \ WITH FILES MODULE\n\nCreating, copying, editing, and removing files from managed\
    \ hosts are common tasks that you can implement using modules from the Files library.\
    \ The following examples show ways that you can use these modules to automate\
    \ common file management tasks.\n\n# ## Ensuring a File Exists on Managed Hosts\n\
    \nUse the file module to touch a file on managed hosts. This works like the touch\
