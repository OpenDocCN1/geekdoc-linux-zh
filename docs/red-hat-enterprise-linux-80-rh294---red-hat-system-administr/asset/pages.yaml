  md: "# HANDLING TASK FAILURE\n\n# OBJECTIVES\n\nAfter completing this section, you\
    \ should be able to control what happens when a task fails, and what conditions\
    \ cause a task to fail.\n\n# MANAGING TASK ERRORS IN EACH TASK OR PLAYS\n\nAnsible\
    \ evaluates the return code of each task to determine whether the task succeeded\
    \ or failed. Normally, when a task fails Ansible immediately aborts the rest of\
    \ the play on that host, skipping all subsequent tasks.\n\nHowever, sometimes\
    \ you might want to play execution continue even if a task fails. For example,\
    \ you might expect that a particular task could fail, and you might want to recover\
    \ by running some other task conditionally. There are a number of Ansible features\
    \ that can be used to manage task errors.\n\n# Ignoring Task Failure\n\nBy default,\
    \ if a task fails, the play is aborted. However, this behavior can be overridden\
    \ by ignoring failed tasks. You can use the `ignore_errors` keyword in a task\
    \ to accomplish this.\n\nThe following snippet shows how to use `ignore_errors`\
    \ in a task to continue playbook execution on the host even if the task fails.\
    \ For example, if the notapkg package does not exist then your module fails, but\
    \ using `ignore_errors` set to `yes` allows execution to continue.\n\n```\n- name:\
    \ Latest version of notapkg is installed\n  yum:\n    name: notapkg\n    state:\
    \ latest\n  ignore_errors: yes\n```\n\n# Forcing Execution of Handlers after Task\
    \ Failure\n\nNormally when a task fails and the play aborts on that host, any\
    \ handlers that had been notified earlier tasks in the play will not run. If you\
    \ use the `force_handlers`: yes keyword on the play, then notified handlers are\
    \ called even if the play aborted because a later task failed.\n\nThe following\
    \ snippet shows how to use the `force_handlers` keyword in a task to force execution\
    \ of the handler even if a task fails:\n\n```\n- hosts: all\n  force_handlers:\
    \ yes\n  tasks:\n    - name: a task which always notifies its handler\n      command:\
    \ /bin/true\n    notify: restart the database\n```"
  merge: -1
  pgno: 191
- img_proc: true
  md: "- name: a task which fails because the package doesn't exist\nyum:\n name:\
    \ notapkg\nstate: latest\n\nhandlers:\n name: restart the database\nservice:\n\
    \ name: mariadb\nstate: restarted\n\n> NOTE\nRemember that handlers are notified\
    \ when a task reports a changed result but are not notified when it reports an\
    \ ok or failed result.\n\n# Specifying Task Failure Conditions\n\nYou can use\
    \ the failed_when keyword on a task to specify which conditions indicate that\
    \ the task has failed. This is often used with command modules that may successfully\
    \ execute a command, but the command's output indicates a failure.\n\nFor example,\
    \ you can run a script that outputs an error message and use that message to define\
    \ the failed state for the task. The following snippet shows how the failed_when\
    \ keyword can be used in a task:\n\n+   tasks:\n name: Run user creation script\n\
    \ shell: /usr/local/bin/create_users.sh\n register: command_result\n failed_when:\
    \ \"Password missing\" in command_result.stdout\n\nThe fail module can also be\
    \ used to force a task failure. The above scenario can alternatively be written\
    \ as two tasks:\n\n+   tasks:\n name: Run user creation script\n shell: /usr/local/bin/create_users.sh\n\
    \ register: command_result\n ignore_errors: yes\n name: Report script failure\n\
    \ fail:\n msg: \"The password is missing in the output\"\n when: \"Password missing\"\
    \ in command_result.stdout\n\nYou can use the fail module to provide a clear failure\
    \ message for the task. This approach also enables delayed failure, allowing you\
    \ to run intermediate tasks to complete or roll back changes."
