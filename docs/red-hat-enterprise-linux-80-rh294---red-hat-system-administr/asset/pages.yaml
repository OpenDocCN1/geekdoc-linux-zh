  md: "# WRITING LOOPS AND CONDITIONAL TASKS\n\n# OBJECTIVES\n\nAfter completing this\
    \ section, you should be able to use loops to write efficient tasks, and use conditions\
    \ to control when to run tasks.\n\n# TASK ITERATION WITH LOOPS\n\nUsing loops\
    \ saves administrators from the need to write multiple tasks that use the same\
    \ module. For example, instead of writing five tasks to ensure five users exist,\
    \ you can write one task that iterates over a list of five users to ensure they\
    \ all exist.\n\nAnsible supports iterating over a set of items using the **loop**\
    \ keyword. You can configure loops to repeat task each item in a list, the contents\
    \ of each of the files in a list, a generated sequence of numbers, or using more\
    \ complicated structures. This section covers simple loops that iterate over a\
    \ list of items. Consult the documentation for more advanced looping scenarios.\n\
    \n# Simple Loops\n\nA simple loop iterates a task over a list of items. The **loop**\
    \ keyword is added to the task, and takes as a value the list of items over which\
    \ the task should be iterated. The loop variable **item** holds the value used\
    \ during each iteration.\n\nConsider the following snippet that uses the service\
    \ module twice in order to ensure two network services are running:\n\n```\n-\
    \ name: Postfix is running\n  service:\n    name: postfix\n    state: started\n\
    \n- name: Dovecot is running\n  service:\n    name: dovecot\n    state: started\n\
    ```\n\nThese two tasks can be rewritten to use a simple loop so that only one\
    \ task is needed to ensure both services are running:\n\n```\n- name: Postfix\
    \ and Dovecot are running\n  service:\n    name: \"{{ item }}\"\n  loop:\n   \
    \ - postfix\n    - dovecot\n```"
  merge: -1
