  md: '# DEPLOYING ANSIBLE


    # PERFORMANCE CHECKLIST


    In this lab, you will configure an Ansible control node for connections to inventory
    hosts and use ad hoc commands to perform actions on managed hosts.


    # OUTCOMES


    You should be able to configure a control node to run ad hoc commands on managed
    hosts.


    You will use Ansible to manage a number of hosts from workstation.lab.example.com
    as the student user. You will set up a project directory containing an ansible.cfg
    file with specific details, and an inventory directory containing an inventory
    file.


    You will use ad hoc commands to ensure the /etc/motd file on all managed hosts
    consists of specific content.


    # BEFORE YOU BEGIN


    Log in to workstation using student as the password.


    On workstation, run the lab deploy-review-start command. This script ensures the
    managed hosts are reachable on the network.


    ```

    student@workstation~~$ lab deploy-review

    ```


    +   1. Verify that the ansible package is installed on the control node, and run
    the ansible-version command.

    2. In the student user''s home directory on workstation, /home/student, create
    a directory named deploy-review. Change to that directory.

    3. Create an ansible.cfg file in the deploy-review directory, which you will use
    to set the following Ansible defaults:

    * Connect to managed hosts as devops user.

    * Use the inventory subdirectory to contain the inventory file.

    * Disable privilege escalation by default. If privilege escalation is enabled
    by command line, configure default settings to have Ansible use the sudo to switch
    to the root user account. Account should not prompt for login password or the
    devops password.

    The managed hosts have been configured with a devops user who can log in using
    SSH key-based authentication and can run any command as root using the sudo command
    without a password.

    4. Create the /home/student/deploy-review/inventory directory.'
