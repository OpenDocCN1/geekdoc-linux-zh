  md: '# CHAPTER 8 | Simplifying Playbooks with Roles


    The default roles_path on Red Hat Enterprise Linux includes /usr/share/ansible/roles
    in the path, Ansible should automatically find those roles referenced by a playbook.


    > NOTE Ansible might not find the system roles if roles_path has been overridden
    in the current Ansible configuration file, if the environment variable ANSIBLE_ROLES_PATH
    is set, or if there is another role of the same name in a directory listed earlier
    in roles_path.


    # Accessing Documentation for RHEL System Roles


    After installation, documentation for the RHEL System Roles is found in the /usr/share/doc/rhel-system-roles-<version>/
    directory. Documentation is organized into subdirectories by subsystem


    ```

    [root~$] ls -1 /usr/share/doc/rhel-system-roles/

    total 4

    drwxr-xr-x ... output omitted. ... kdump

    drwxr-xr-x ... output omitted. ... network

    drwxr-xr-x ... output omitted. ... postfix

    drwxr-xr-x ... output omitted. ... selinux

    drwxr-xr-x ... output omitted. ... timesync

    ```


    Each role''s documentation directory contains a README.md file. The README.md
    file contains a description of the role, along with usage information.


    The README.md file also contains role variables that affect the behavior of the
    role. Often the README.md file contains a playbook snippet that demonstrates variable
    settings for a common configuration scenario.


    Some role documentation directories contain example playbooks. When using a role
    for the first time, review any additional example playbooks in the documentation
    directory.


    Role documentation for RHEL System Roles matches the documentation for Linux System
    Roles. Use a web browser to access role documentation for the upstream roles at
    the Ansible Galaxy site, https://galaxy.ansible.com.


    # TIME SYNCHRONIZATION ROLE EXAMPLE


    Suppose you need to configure NTP time synchronization on your servers. You could
    write automation yourself to perform the necessary tasks. But RHEL System Roles
    includes a role that can do that, rhel-system-roles.timesync.


    The role is documented in README.md in the /usr/share/doc/rhel-system-roles/timesync
    directory. The file describes all the variables that affect the role''s behavior
    and contains three playbook snippets illustrating time synchronization configurations.


    To manually configure NTP servers, the role has a variable named timesync_ntp_servers.
    It takes a list of NTP servers to use. Each item is made up of one or more attributes.
    The two key attributes are


