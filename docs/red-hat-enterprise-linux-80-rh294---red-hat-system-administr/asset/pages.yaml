  md: '# CREATING PLAYBOOKS


    In this review, you will create three playbooks in the Ansible project directory,
    /home/student/review-playbooks. One playbook will ensure that ifftp is installed
    on systems that should be FTP clients, one playbook will ensure that vsftpd is
    installed and configured on systems that should be FTP servers, and one playbook
    (site.yml) will run both of the other playbooks.


    # OUTCOMES


    You should be able to:


    +   - Create and execute playbooks to perform tasks on managed hosts.

    - Utilize Jinja2 templates, variables, and handlers in playbooks.


    # INSTRUCTIONS


    Create a static inventory in review-playbooks/inventory with serverc.lab.example.com
    in the group ftpclients, and serverb.lab.example.com in the group ftpserver. Create
    a review-playbooks/ansible.cfg file which configures your Ansible project to use
    this inventory. You may find it useful to look at the system''s /etc/ansible/ansible.cfg
    file for help with syntax.


    Configure your Ansible project to connect to hosts in the inventory using the
    remote user, devs, and the sudo method for privilege escalation. Use SSH keys
    to log in as devs already configured. The devs user does not need a password for
    privilege escalation with sudo.


    Create a playbook named ftpclients.yml in the review-playbooks directory that
    contains a playbook targeting hosts in the inventory group ftpclients. The playbook
    must ensure that the ifftp package is installed.


    Create a second playbook named ansible-vsftpd.yml in the review-playbooks directory
    that contains a playbook targeting hosts in the inventory group ftpserver. It
    must meet the following requirements:


    +   - Create a configuration file for vsftpd generated from a Jinja2 template.
    Create a directory for templates, review-playbooks/templates, and copy the provided
    vsftpd.conf j2 into it. Create the directory review-playbooks/vars. Copy the provided
    defaults-template.yml file, which contains default variable settings used to complete
    that template when it is deployed, in the review-playbooks/vars


    Create a variable file, review-playbooks/vars/vars.yml, which sets three variables:


    | VARIABLE | VALUE |

    | vsftpd_package | vsftpd |

    | vsftpd_service | vsftpd |'
