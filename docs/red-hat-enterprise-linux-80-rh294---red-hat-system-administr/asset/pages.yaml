    \n  ],\n  \"boston\" : {\n    \"children\" : [\n      \"backup\"\n      \"ipa\"\
    \n    ],\n    \"vars\" : {\n      \"example_host\" : false\\} : [\n      \"server1.demo.example.com\"\
    ,\n      \"server2.demo.example.com\",\n      \"server3.demo.example.com\"\n \
    \   ]\n  },\n  \"backup\" : [\n    \"server4.demo.example.com\"\n  ],\n  \"ipa\"\
    \ : [\n    \"server5.demo.example.com\"\n  ],\n  \"meta\" : {\n    \"hostvars\"\
    \ : {\n      \"server5.demo.example.com\": {\n        \"ntpserver\" : \"ntp.demo.example.com\"\
    ,\n        \"dnsserver\" : \"dns.demo.example.com\"\n      }\n    }\n  }\n}\n\
    ```\n\nThe script should also support the --host managed-host option. This option\
    \ must print a JSON hash/dictionary consisting of variables which are associated\
    \ with that host, or an empty JSON hash/dictionary.\n\n```\n$student@workstation\
    \ ~$ ./inventoryscript --host server5.demo.example.com\n(\n  \"ntpserver\" : \"\
    ntp.demo.example.com\",\n  \"dnsserver\" : \"dns.demo.example.com\"\n)\n```"
