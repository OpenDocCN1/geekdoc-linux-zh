  md: "# MANAGING STORAGE\n\n# OBJECTIVES\n\nAfter completing this section, you should\
    \ be able to partition storage devices, configure LVM, mount file systems, format\
    \ partitions or logical volumes, and add swap files or spaces.\n\n# CONFIGURING\
    \ STORAGE WITH ANSIBLE MODULES\n\nRed Hat Ansible Engine provides a collection\
    \ of modules to configure storage devices on hosts. Those modules support partitioning\
    \ devices, creating logical volumes, and creating and mounting files.\n\n# The\
    \ parted Module\n\nThe parted module supports the partition of block devices.\
    \ This module includes the functionality of the parted command, and allows to\
    \ create partitions with a specific size, flag, and alignment. The following table\
    \ lists some of the parameters for the parted module.\n\n| PARAMETER NAME | DESCRIPTION\
    \ |\n| --- | --- |\n| align | Configures partition alignment. |\n| device | Block\
    \ device. |\n| flags | Flags for the partition. |\n| number | The partition number.\
    \ |\n| part_end | Partition size from the beginning of the disk specified in parted\
    \ supported units. |\n| state | Creates or removes the partition. |\n| unit |\
    \ Size units for the partition information. |\n\nThe following example creates\
    \ a new partition of 10 GB.\n\n```\n- name: 10GB partition\nparted:\n  device:\
    \ /dev/vdb ①\n  number: 1 ②\n  state: present ③\n  part_end: 10GB ④\n```\n\n+\
    \   1. Uses vdb as the block device to partition.\n2. Creates the partition number\
    \ one.\n3. Ensures the partition is available.\n4. Sets the partition size to\
    \ 10 GB."
  merge: -1
  pgno: 447
- img_proc: true
  md: "# The lvg and l1vol Modules\n\nThe lvg and l1vol modules support the creation\
    \ of logical volumes, including the configuration of physical volumes, and volume\
    \ groups. The lvg takes as parameters the block devices to configure as the back\
    \ end volumes for the volume group. The following table lists some of the parameters\
    \ for the lvg module.\n\n| PARAMETER NAME | DESCRIPTION |\n| --- | --- |\n| pesize\
    \ | The size of the physical extent. Must be a power of 2, or multiple of 128\
    \ KIB. |\n| pvs | List of comma-separated devices to be configured as physical\
    \ volumes for the volume group. |\n| vg | The name of the volume group. |\n| state\
    \ | Creates or removes the volume. |\n\nThe following task creates a volume group\
    \ with a specific physical extent size using a block device as a back end.\n\n\
    +   - name: Creates a volume group\n lvg:\n - vg: vg1\n - pvs: /dev/vda1\n - size:\
    \ 32\n\n> The volume group name is vg1.\nUses /dev/vda1 as the back end physical\
    \ volume for the volume group.\nSets the physical extent size to 32.\nIn this\
    \ example, if the vg volume group is already available with /dev/vdb1 as a physical\
    \ volume, the volume is enlarged adding a new physical volume with /dev/vdc1.\n\
    \n+   - name: Resize a volume group\n lvg:\n - vg: vg1\n - pvs: /dev/vdb1, /dev/vdc1\n\
    \nThe l1vol module creates logical volumes, supports the resizing and shrinking\
    \ of volumes, and the filesystems on top of them. This module also supports the\
    \ creation of snapshots for the logical volumes. The following table lists some\
    \ of the parameters for the l1vol module.\n\n| PARAMETER NAME | DESCRIPTION |\n\
    | --- | --- |\n| lv | The name of the logical volume. |\n| resizefs | Resizes\
    \ the filesystem with the logical volume. |\n| shrink | Enable logical volume\
    \ shrink. |\n| size | The size of the logical volume. |\n| snapshot | The name\
    \ of the snapshot for the logical volume. |"
  merge: -1
  pgno: 448
- img_proc: true
  md: "# CHAPTER 10 | Automating Linux Administration Tasks\n\n| PARAMETER NAME |\
    \ DESCRIPTION |\n| --- | --- |\n| state | Create or remove the logical volume.\
    \ |\n| vg | The parent volume group for the logical volume. |\n\nThe following\
    \ task creates a logical volume of 2 GB.\n\n+   - name: Create a logical volume\
    \ of 2GB\n  - vg: vg1\n  - lv: lv1\n  - size: 2g\n\nThe parent volume group name\
    \ is vg1.\nThe logical volume name is lv1.\nThe size of the logical volume is\
    \ 2 GB.\n\n# ## The filesystem Module\n\nThe filesystem module supports both creating\
    \ and resizing a filesystem. This module supports filesystem resizing for ext2,\
    \ ext3, ext4, ext4dev, f2fs, lvm, xfs, and vfat. The following table lists some\
    \ of the parameters for the filesystem module.\n\n| PARAMETER NAME | DESCRIPTION\
    \ |\n| --- | --- |\n| dev | Block device name. |\n| ftype | Filesystem type. |\n\
    | resizefs | Grows the filesystem size to the size of the block device. |\n\n\
    The following example creates a filesystem on a partition.\n\n+   - name: Create\
    \ an XFS filesystem\n  filesystem:\n  - ftype: xfs\n  - dev: /dev/vdb1\n\n+  \
    \ Uses the XFS filesystem.\nUses the /dev/vdb1 device.\n\n# ## The mount Module\n\
    \nThe mount module supports the configuration of mount points on /etc/fstab. The\
    \ following table lists some of the parameters for the mount module.\n\n| PARAMETER\
    \ NAME | DESCRIPTION |\n| --- | --- |\n| ftype | Filesystem type. |\n| opts |\
    \ Mount options. |"
  merge: -1
  pgno: 449
- img_proc: true
  md: "# CHAPTER 10 | Automating Linux Administration Tasks\n\n| PARAMETER NAME |\
    \ DESCRIPTION |\n| --- | --- |\n| path | Mount point path. |\n| src | Device to\
    \ be mounted. |\n| state | Specify the mount status. If set to mounted, the system\
    \ mounts the device, and configures /etc/fstab with that mount information. To\
    \ unmount the device and remove it from /etc/fstab use absent. |\n\nThe following\
    \ example shows a device with an specific ID.\n\n+   - name: device with ID\n\
    \  mount:\n    path: /data\n    src: UUID=a8063766-44dd-409a-b584-68be2c9f5570\n\
    \    fstype: xfs\n    state: present\n\n+   - Uses /data as the mount point.\n\
    - Mounts the device with a8063766-44dd-409a-b584-68be2c9f5570 ID.\n- Uses the\
    \ XFS filesystem.\n- Mounts the device and configures /etc/fstab accordingly.\n\
    The following example shows the NFS share available at 172.25.250.100:/share/nfsshare\
    \ directory at the managed host.\n\n+   - name: NFS share\n  mount: vg=nfsshare\
    \ src=172.25.250.100:/share fstype=nfs\n  opts=defaults,nowait dump=0 state=mounted\n\
    \n# Configuring swap with Modules\n\nRed Hat Ansible Engine does not currently\
    \ include modules to manage swap memory. To add swap memory to a system with Ansible\
    \ locales you will need to create a new volume group and local volume with the\
    \ lvg and lvol modules. When ready, you need to format as swap the local volume\
    \ using the command module with the mkswap command. Finally, you need to activate\
    \ the new swap device using the command module with the swap command. Red Hat\
    \ Ansible Engine includes the ansible_swaptotal_mb variable which includes the\
    \ swap memory. You can use this variable to trigger swap configuration and enablement\
    \ when swap memory is low. Following this, create a volume group and a local volume\
    \ for swap memory, format that local volume as swap, and activates it.\n\n+  \
    \ - name: create swap VG\n  lv: vg=vgswap vs=/dev/vda state=present\n\n+   - name:\
    \ create new swap LV\n  lvol: vg=lvswap size=10g\n\n+   - name: Format swap LV\n\
    \  command: mkswap /dev/vgswap/lvswap\n  when: ansible_swaptotal_mb < 128\n\n\
    RH294-RHEL8.0-en-US-20190531"
  merge: -1
  pgno: 450
