  md: '# MANAGING DYNAMIC INVENTORIES


    # OBJECTIVES


    After completing this section, you will be able to describe what dynamic inventory
    inventories are, as well as install and use an existing script as an Ansible dynamic
    inventory source.


    # GENERATING INVENTORIES DYNAMICALLY


    The static inventory files you have worked so far are easy to write, and are convenient
    for managing small infrastructures. When working with numerous machines, or in
    an environment where machines come and go very quickly, it can be hard to keep
    the static inventory files up-to-date.


    Most IT environments systems that keep track of which hosts are available and
    how they are organized. For example, there might be an external directory service
    maintained by a monitoring system such as Zabbix, or on FreePA or Active directory
    servers. Installation servers such as Cobler, or management services such as Red
    Hat Satellite, might track deployed systems. Similarly, cloud servers such as
    Amazon Web Services EC2 or an OpenStack deployment, or virtual machine infrastructures
    based on VMware or Red Hat Virtualization, might be sources of information about
    the instances and virtual machines that come and go.


    Ansible supports dynamic inventory scripts that retrieve current information from
    these types of sources without Ansible executes, allowing the inventory to be
    updated in real time. These are executable programs that collect information from
    some external source and output the inventory in JSON format.


    Dynamic inventory scripts are used like static inventory text files. The location
    of the inventory is specified either directly in the ansible cfg file, or using
    the -i option. If the inventory file is executable, then it is treated as a dynamic
    inventory program and Ansible attempts to run it. If the file is not executable,
    it is treated as a static inventory.


    > NOTE

    The inventory location can be configured in the ansible.cfg configuration file
    with the inventory parameter. By default, it is configured to /etc/ansible/hosts.


    # CONTRIBUTED SCRIPTS


    A number of existing dynamic inventory scripts were contributed to the Ansible
    project by the open source community. They are not included in the Ansible package
    or officially supported by Red Hat. These are available from the Ansible GitHub
    site at https://github.com/ansible/ansible/tree/devel/contrib/inventory.


    Some data sources, or platforms, that are targeted by contributed dynamic inventory
    scripts include:


    +   - Private cloud platforms, such as Red Hat OpenStack Platform.'
  merge: -1
  pgno: 265
- img_proc: true
  md: "# CHAPTER 7 | Managing Large Projects\n\n+   - Public cloud platforms, such\
    \ as Rackspace Cloud, Amazon Web Services EC2, and Google\nCompute Engine.\n\n\
    +   - Virtualization platforms, such as Red Hat Virtualization (oVirt), and VMware\
    \ vSphere.\n\n+   - Platform-as-a-Service solutions, such as OpenShift Container\
    \ Platform.\n\n+   - Life-cycle management tools, such as Foreman (with Red Hat\
    \ Satellite 6 or stand-alone) and\nSpacewalk (upstream of Red Hat Satellite 5).\n\
    \n+   - Hosting providers, such as Digital Ocean and Linode.\n\nEach script may\
    \ have its own dependencies and requirements in order to function. The contributed\
    \ scripts are mostly written in Python, but that is not a requirement for dynamic\n\
    inventory scripts.\n\n# WRITING DYNAMIC INVENTORY PROGRAMS\n\nIf a dynamic inventory\
    \ script does not exist for the directory system or infrastructure in use,\nYou\
    \ can write a custom inventory program. The custom program can be written in any\n\
    rogramming language, but must return inventory information in JSON format when\
    \ passed\nappropriate options.\n\nThe **ansible-inventory** command can be a helpful\
    \ tool for learning how to author Ansible\nin inventories in JSON format. You\
    \ can use the **ansible-inventory** command, available since\nAnsible 2.4, to\
    \ write an inventory file in JSON format.\n\nTo display the contents of the inventory\
    \ file in JSON format, run the **ansible-inventory --\nlist** command. You can\
    \ use the `-i` option to specify the location of the inventory file to process,\n\
    or just use the default inventory set by the current Ansible configuration.\n\n\
    The following example demonstrates using the **ansible-inventory** command to\
    \ process an\nini-style inventory file and output it in JSON format.\n\n```\n\
    $student@workstation projects-host]$ cat inventory\nworkstation1.lab.example.com\n\
    \n[webservers]\nweb1.lab.example.com\nweb2.lab.example.com\n\n[databases]\ndbi.lab.example.com\n\
    db2.lab.example.com\n```\n\n```\n$student@workstation projects-host]$ ansible-inventory\
    \ -i inventory --list\n{\n  \"hosts\": {\n    \"db1.lab.example.com\": {},\n \
    \   \"db2.lab.example.com\": {},\n    \"web1.lab.example.com\": {},\n    \"web2.lab.example.com\"\
    : {},\n    \"workstation1.lab.example.com\": {}\n  },\n  \"all\": {\n```\n\nRH294-RHEL8.0-en-1-2019031"
