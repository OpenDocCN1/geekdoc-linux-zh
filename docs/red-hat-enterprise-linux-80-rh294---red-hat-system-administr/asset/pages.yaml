  md: '# CHAPTER 9 | Troubleshooting Ansible


    Earlier in this course, you learned about the --syntax-check option, which checks
    the YAML

    s for the playbook. It is a good practice to run a syntax check on your playbook
    before using it or if you are having problems with it.


    ```

    [student@demo ~]$ ansible-playbook playbook.yml --syntax-check

    ```


    You can also use the --step option to step through a playbook task at a time.
    The ansible-playbook --step command interactively prompts for confirmation that
    which task you want to run.


    ```

    [student@demo ~]$ ansible-playbook playbook.yml --step

    ```


    The --start-at-task option allows you to start execution of a playbook from a
    specific task. it takes as an argument the name of the task at which to start.


    ```

    [student@demo ~]$ ansible-playbook playbook.yml --start-at-task="start http service"

    ```


    # DEBUGGING


    The output given by a playbook that was run with the ansible-playbook command
    is a good starting point for troubleshooting issues related to hosts managed by
    Ansible. Consider the following:


    ```

    PLAY [Service Deployment] *************************************************

    ...output omitted. *************************************************

    TASK: [Install a service] *************************************************

    ok: [demoservera]

    ok: [demoserverb]

    ```


    ```

    PLAY RECAP *************************************************************

    demoservera : ok=2  changed=0  unreachable=0 failed=0

    demoserverb : ok=2  changed=0  unreachable=0 failed=0

    ```


    The previous output shows a PLAY header with the name of the playbook to be executed,
    followed by one or more TASK headers. Each of these headers represents their associated
    task in the playbook, and it is executed in all managed hosts belonging to the
    group included in the playbook in the hosts parameter.


    As each host executes each task of yours, the name of the managed host is displayed
    under the corresponding TASK header, and with the state on that managed host.
    Task status can appear as ok, fatal, changed, or skipping.


    At the bottom of the output for each play, you can increase the verbosity of the
    output from ansible-playbook by adding one or more -v options. The ansible-playbook
    -v command provides additional debugging information, with up to four total levels.


    RH294-RHEL8.0-en-1-20190531'
  merge: -1
