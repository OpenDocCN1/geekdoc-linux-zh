  md: "# CHAPTER 10 | Automating Linux Administration Tasks\n\n| PARAMETER NAME |\
    \ DESCRIPTION |\n| --- | --- |\n| interface | The interface name to manage with\
    \ FirewallD |\n| port | Port or port range. Uses the port/protocol or port-port/protocol\
    \ format. |\n| rich_rule | Rich rule for FirewallD |\n| service | Service name\
    \ to manage with FirewallD |\n| source | Source network to manage with FirewallD\
    \ |\n| zone | The FirewallD zone |\n| state | Enables or disables a Firewall configuration.\n\
    | type | Type of device or network connection. |\n\n# ANSIBLE FACTS FOR NETWORK\
    \ CONFIGURATION\n\nAnsible facts to retrieve information to the control node about\
    \ the configuration of the managed hosts. You can use the setup Ansible module\
    \ to retrieve all the Ansible facts for a managed host.\n\n```\n[user@controlnode\
    \ ~]$ ansible webservers -m setup\nhost.example.com | SUCCESS => {\n  \"ansible_facts\"\
    : {\n    ...output omitted.\n  }\n}\n```\n\nAll network interfaces for a managed\
    \ host are available under the ansible_interfaces element. You can use the gather_subset=network\
    \ parameter for the setup module to restrict the facts to those included in the\
    \ network subset. The filter option for the setup module provides fine-grained\
    \ filtering based on shell-wildcards.\n\n```\n[user@controlnode ~]$ ansible webservers\
    \ -m setup \\\n- a 'gather_subset=network filter=ansible_interfaces'\nhost.example.com\
    \ | SUCCESS => {\n  \"ansible_interfaces\": [\n    \"ens4\",\n    \"lo0\",\n \
    \   \"ens3\"\n  ],\n  \"changed\": false\n}\n```\n\nThe previous command shows\
    \ that three network interfaces are available on the managed host, host.lab.example.com:\
    \ lo, ens3 and ens4.\n\nRH294-RHEL8.0-en-1-20190531 499"
