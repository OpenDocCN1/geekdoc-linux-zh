  md: "```\n[root@host playbook-project]# tree\n.\n ansible.cfg\n- group_vars\n| └\
    \ servers\n|     └ timesync.yml4\n- timesync_playbook.yml4\n```\n\nDefine the\
    \ time synchronization variables overriding the default roles for hosts in group\
    \ inventory. This file would look like:\n\n```\ntimesync_ntp_servers:\n- hostname:\
    \ 0.rhel.pool.ntp.org\n- iburst: yes\n- hostname: 1.rhel.pool.ntp.org\n- iburst:\
    \ yes\n- hostname: 2.rhel.pool.ntp.org\n- iburst: yes\ntimezone: UTC\n```\n\n\
    The content of the playbook simplifies to:\n\nThis structure clearly separates\
    \ the role, playbook code, and configuration settings. The role playbook code\
    \ is simple, easy to read, and should not require complex refactoring. The role\
    \ content is maintained and supported by Red Hat. All the settings are handled\
    \ as inventory variables.\n\nThis structure also supports a dynamic, heterogeneous\
    \ environment. Hosts with new synchronization requirements may be placed in a\
    \ new group. Appropriate variables are defined in a YAML file, and placed in the\
    \ appropriate group_vars (or host_vars) sub\\..\n\n# SELINUX ROLE EXAMPLE\n\n\
    As another example, the rhel-system-roles.selinux simplifies management of SELinux\
    \ configuration settings. It is implemented using the SELINUX-related Ansible\
    \ modules. The advantage of using this role instead of writing your own tasks\
    \ is that it relieves you from the responsibility of writing those tasks. Instead,\
    \ provide variables to the role to configure it, and the maintained code in the\
    \ role will ensure your desired SELinux configuration is applied.\n\nAmong the\
    \ tasks this role can perform:\n\n+   - Set enforcing or permissive mode\n- Run\
    \ restorecon on parts of the file system hierarchy"
