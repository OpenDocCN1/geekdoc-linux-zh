  md: '# CREATING ROLES


    # OBJECTIVES


    After completing this session, you should be able to create a role in a playbook''s
    project directory and run it as part of one of the plays in the playbook.


    # THE ROLE CREATION PROCESS


    Creating roles in Ansible requires no special development tools. Creating and
    using a role is a three step process.


    +   1. Create the role directory structure.

    2. Define the role content.

    3. Use the role in a playbook.


    # CREATING THE ROLE DIRECTORY STRUCTURE


    By default, Ansible looks for roles in a subdirectory called roles in the directory
    containing your Ansible playbook. This allows you to store roles with the playbook
    and other supporting files.


    If Ansible cannot find the role there, it looks at the directories specified by
    the Ansible configuration setting roles_path, in order. This variable contains
    a colon-separated list of directories to search. The default value of this variable
    is


    ```

    ~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles

    ```


    This allows you to install roles on your system that are shared by multiple projects.
    For example, you could have your own roles installed in your home directory in
    the ~/.ansible/roles and the system can have roles installed for all users in
    the /usr/share/ansible/roles directory.


    Each role has its own directory with a standardized directory structure. For example,
    the directory structure contains the files that define the motd role.


    ```

    [user@host ~]$ tree roles/

    roles/

    |-- defaults

    |   └── main.yml

    | files

    | handlers

    | meta

    |   └── main.yml

    | README.md

    | tasks

    ```'
  merge: -1
  pgno: 328
- img_proc: true
  md: "# CHAPTER 6 | Simplifying Playbooks with Roles\n\n```\n| main.yml\n  templates\n\
    \  motd.j2\n```\n\nThe **README.** md provides a basic human-readable description\
    \ of the role, documentation and examples of how to use it, and non-Ansible requirements\
    \ it might have in order to work. The **meta** subdirectory contains a **main.yml**\
    \ file that specifies information about the author, license, compatibility, and\
    \ dependencies for the module. The **files** subdirectory contains fixed-content\
    \ files and the **templates** subdirectory contains templates that can be deployed\
    \ when it is used. The other subdirectories can contain **main.yml** files that\
    \ define default variable values, handlers, tasks, metadata, and variables, depending\
    \ on the subdirectory they are in.\n\nIf a subdirectory exists but is empty, as\
    \ in this example it is ignored. If a role does not use a feature, the subdirectory\
    \ can be omitted altogether. For example, the **vars** subdirectory has been omitted\
    \ from this example.\n\n# Creating a Role Skeleton\n\nYou can create all the subdirectories\
    \ and files for a new role using standard Linux commands. Alternatively, ansible\
    \ galaxy exists to automate the process of new role creation.\n\n **ansible-galaxy**\
    \ command tool (covered in more detail later in this course) is used to manage\
    \ Ansible roles, including the creation of new roles. You run **ansible-galaxy\
    \ init** to create the directory structure for a new role. Specify the name of\
    \ the role as an argument to the command, which creates a subdirectory for the\
    \ new role in the current working directory.\n\n```\n[user@host playbook-project]$\
    \ cd roles\n[user@host]$ ansible-galaxy init my_new_role\nmy_new_role/ was created\
    \ successfully\n[user@host]$ ls my_new_role/\ndefault files handlers README.md\
    \ tasks templates vars\n```\n\n# DEFINING THE ROLE CONTENT\n\nOnce you have created\
    \ the directory structure, you must write the content of the role. A good place\
    \ to start is the **ROLENAME/tasks/main.yml** file, the main list of tasks run\
    \ by the role.\n\nThe following **tasks/main.yml** file manages the **/etc/motd**\
    \ file on managed hosts. It uses the **template** module to deploy the template\
    \ named **motd.j2** to the managed host. Because the **template** module is configured\
    \ within a role task, instead of a playbook task, the **motd.j2** is retrieved\
    \ from the role's subdirectory.\n\n```\n[user@host -]$ cat motd/tasks/main.yml\n\
    ---\n# tasks for motd\n---\nname: deliver motd file\n  template:\n    src: motd.j2\n\
    \    dest: /etc/motd\n    owner: root\n    group: root\n    mode: 0444\n```\n\n\
    314 RH294-RI IEL8.0-en-1-20190531"
