  md: '# IMPORTANT


    Use the **ansible-doc** command to find and learn how to use modules for your
    tasks.


    When possible, try to avoid using shell and raw modules in playbooks, even though
    they might seem simple to use. Because these take arbitrary commands, it is very
    easy to write non-idempotent playbooks with these modules.


    For the example, the following task using the shell module is not idempotent.
    Every time the play is run, it rewrites /etc/resolv.conf even if it already consists
    of the line **nameserver 192.0.2.1**


    +   - name: Non-idempotent shell module

    - shell: echo "nameserver 192.0.2.1" > /etc/resolv.conf


    There are several ways to write tasks using the shell module idempotently, making
    some changes and using shell is the best approach. A quicker solution may be to
    use **ansible-doc** to discover the copy module and use that to get the desired
    effect.


    The following example does not rewrite the /etc/resolv.conf file if it already
    consists of the correct content:


    +   - name: Idempotent approach with copy module

    - copy:

    - dest: /etc/resolv.conf

    - content: "nameserver 192.0.2.1\n"


    The copy module tests to see if the state has already been met, and if so, it
    makes no changes. The shell module allows a lot of flexibility, but also requires
    more attention to ensure that it runs idempotently.


    Idempotent playbooks can be run repeatedly to ensure systems are in a particular
    state without disrupting those systems if they are already.


    # PLAYBOOK SYNTAX VARIATIONS


    The last part of this chapter investigates some variations of YAML or Ansible
    Playbook syntax that you might encounter.


    # YAML Comments


    Comments can be used to add readability. In YAML, everything to the right of the
    number or hash symbol (#) is a comment. If there is content to the left of the
    comment, precede the number symbol with a space.


    ```

    # This is a YAML comment

    ```


    ```

    some data # This is also a YAML comment

    ```'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# YAML Strings


    Strings in YAML do not normally need to be put in quotation marks even if there
    are spaces contained in the string. You can enclose strings in either double quotes
    or single quotes.


    this is a string


    ''this is another string''


    "this is yet another string"


    There are two ways to write multiline strings. You can use the vertical bar (|)
    character to denote newline characters within the string to be preserved.


    ```

    include_newlines:

    Example Company

    123 Main Street

    Atlanta, GA 38303

    ```


    You can also write multiline strings using the greater-than (>) character to indicate
    that newline characters are to be converted and leading white spaces in the lines
    to be removed. This method is often used to break long strings at space characters
    so that they can span multiple lines for better readability.


    ```

    fold_newlines:

    This is an example

    of a long string,

    that will becomena single sentence once folded.

    ```


    # YAML Dictionaries


    You have seen collections of key-value pairs written as an indented block, as
    follows:


    ```

    name: svrole

    svcservice: http

    svcport: 80

    ```


    Dictionaries can also be written in an inline block format enclosed in curly braces,
    as follows:


    ```

    {name: svrole, svcservice: http, svcport: 80}

    ```


    In most cases the inline block format should be avoided because it is harder to
    read. However, there is at least one situation in which it is more commonly used.
    The use of roles is discussed later in this course. When a playbook includes a
    list of roles, it is more common to use this syntax to make it easier to distinguish
    roles included in a play from the variables being passed to a role.'
  merge: -1
