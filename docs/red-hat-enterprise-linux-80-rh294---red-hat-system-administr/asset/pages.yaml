  md: "# CONFIGURING PARALLELISM\n\n# OBJECTIVES\n\nAfter completing this section,\
    \ you will be able to tune the number of simultaneous connections that Ansible\
    \ opens to managed hosts, and how Ansible processes groups of managed hosts through\
    \ the play’s tasks.\n\n# CONFIGURE PARALLELISM IN ANSIBLE USING\nFORKS\n\nWhen\
    \ Ansible processes a playbook, it runs each play in order. After determining\
    \ the list of hosts for the play, Ansible runs through each task in order. Normally,\
    \ all hosts must successfully complete a task before any host starts the next\
    \ task in the play.\n\nIn theory, Ansible could simultaneously connect to all\
    \ hosts in the play for each task. This works fine if the play targets hundreds\
    \ of hosts, which can put a heavy load on the control node.\n\nThe maximum number\
    \ of simultaneous connections that Ansible makes is controlled by the forks parameter\
    \ in the Ansible configuration file. It is set to 5 by default, which can be verified\
    \ using one of the following.\n\n```\n$[user@demo] ~$ grep forks ansible.cfg\n\
    forks = 5\n```\n\n```\n$[user@demo] ~$ ansible-config dump | grep -i forks\nDEFAULT_FORKS(default)\
    \ = 5\n```\n\n```\n$[user@demo] ~$ ansible-config list | grep -i forks\nDEFAULT_FORKS:\n\
    \  description: Maximum number of forks Ansible will use to execute tasks on\n\
    \  (name: ANSIBLE_FORKS\n  (key: forks, section: defaults)\nname: Number of task\
    \ forks\n```\n\nFor example, an Ansible node is configured with the default value\
    \ of five forks and the play has managed hosts. Ansible will execute the first\
    \ task in the play on the five managed hosts, followed by a second round of execution\
    \ of the first task on the other five managed hosts. After the first task has\
    \ been executed on all the managed hosts, Ansible will proceed with executing\
    \ the next task across all the managed hosts in groups of five hosts at a time.\
    \ Ansible will do this with each task until the play ends.\n\nThe default for\
    \ forks is set to be very conservative. If your control node is managing Linux\
    \ hosts, most tasks will run on the managed hosts and the control node has less\
    \ load. In this case, you can usually set forks to a much higher value, possibly\
    \ closer to 100, and see performance improvements."
  merge: -1
  pgno: 275
- img_proc: true
  md: "# CHAPTER 7 | Managing Large Projects\n\nIf your playbooks run a lot of code\
    \ on the control node, then you should raise the fork limit judiciously. If you\
    \ use Ansible to manage network routers and switches, then most of those modules\
    \ run on the control node and not on the device. Because of the higher load places\
    \ on the control node, its capacity to increase in the number of forks will be\
    \ significantly lower than for a control node managing only Linux hosts.\n\nYou\
    \ can override the default setting for forks from the command line in the Ansible\
    \ configuration file. Both the ansible and the ansible-playbook commands offers\
    \ the -f or --fork options to specify the number of forks to use.\n\n# MANAGING\
    \ RUN UPDATES\n\nNormally, when Ansible runs a play, it makes sure that all managed\
    \ hosts have completed each task before starting the next task. After all managed\
    \ hosts have completed all tasks, then notified handlers are run.\n\nHowever,\
    \ running on all hosts can lead to undesirable behavior. For example, if a play\
    \ updates a cluster of load balanced web servers, it might need to take each web\
    \ server out of service while the update takes place. If all the servers are updated\
    \ in the same play, they could all be out of service at the same time.\n\nOne\
    \ way to avoid this problem is to use the serial keyword to run the hosts through\
    \ the play in batches. Each batch of hosts will run through the play before the\
    \ next batch is started.\n\nIn the example below, Ansible executes the play on\
    \ two managed hosts at a time, until all managed hosts have been updated. Ansible\
    \ begins executing the tasks in the play on the first two managed hosts. If either\
    \ or both of those hosts notified the handler, then Ansible runs the handler as\
    \ needed for two hosts. When the play execution is on these two managed hosts,\
    \ Ansible repeats the process on the next two managed hosts. Ansible continues\
    \ in this play until all managed hosts have been updated.\n\n+   - name: Rolling\
    \ update\nhosts: webservers\nserial: 2\ntasks:\n  name: latest apache package\
    \ is installed\n  yum:\n    name: httpd\n      state: latest\n  notify: restart\
    \ apache\nhanders:\n  name: restart apache\n  service:\n    name: httpd\n    \
    \  state: restarted\n\nSuppose the webservers group in the previous example contains\
    \ five web servers that reside behind a load balancer. With the serial parameter\
    \ set to 2, the play will run up to two web servers at a time. Thus, a majority\
    \ of the five web servers will always be available.\n\nIn contrast, in absence\
    \ of the serial keyword, the play execution and resulting handler execution would\
    \ occur across all five web servers at the same time. This would probably lead\
    \ to a service outage because web services on all the web servers were restarted\
    \ at the same time.\n\nRH2S4-RHEL8.0-en-1-20190531 261"
