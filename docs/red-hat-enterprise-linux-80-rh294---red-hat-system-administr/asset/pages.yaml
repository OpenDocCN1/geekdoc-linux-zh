  md: '# INTRODUCTION


    # RED HAT SYSTEM ADMINISTRATION III: LINUX

    AUTOMATION


    Red Hat System Administration III: Linux Automation (RH294) for Linux system administrators
    and developers who need to automate provisioning, configuration, application deployment,
    and orchestration.


    Students will learn how to install and configure Ansible on a management workstation
    and prepare managed hosts for automation. Students will write Ansible Playbooks
    to automate tasks, and run them to ensure servers are correctly deployed and configured.
    Examples of approaches to automate common Linux system administration tasks will
    be explored.


    # COURSE

    OBJECTIVES


    +   - Install and configure Ansible or Red Hat Ansible Engine on a control node.

    - Create and manage inventories of managed hosts, and prepare them for Ansible
    automation.

    - Run individual ad hoc tasks from the command line.

    - Write Ansible Playbooks to consistently automate multiple tasks and apply them
    to managed hosts.

    - Parameterize playbooks using variables and facts, and protect sensitive data
    with Ansible Vault.

    - Write and reuse Ansible roles to simplify playbook creation and reuse code.

    - Automate common Red Hat Enterprise system administration tasks using Ansible.


    # AUDIENCE


    +   - Linux system administrators, DevOps engineers, infrastructure automation
    engineers, and systems design engineers responsible for automation of configuration
    management, consistent and repeatable application deployment, provisioning and
    deployment of development, testing, and production servers, and integration with
    DevOps CI/CD workflows.'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# PREREQUISITES


    +   - Red Hat Certified System Administrator (EX200/RHCSA) certification or equivalent
    Red Hat Enterprise Linux knowledge and experience.'
