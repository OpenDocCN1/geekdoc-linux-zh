  md: "# Using Register Variables with Loops\n\nThe register keyword can capture the\
    \ output of a task that loops. The following snippet shows the structure of the\
    \ register variable from a task that loops:\n\n```\n[student@workstation loopdemo]$\
    \ cat loop_register.yml\n---\nname: Loop Register Test\ngather_facts: no\nhosts:\
    \ localhost\ntasks:\n  - name: Looping Echo Task\n    shell: \"echo This is my\
    \ item: {{ item }}\"\n    loop:\n      - one\n      - two\n    register: echo_results\n\
    \n  - name: Show echo_results variable\n```\n\nThe echo_results variable is registered.\n\
    The contents of the echo_results variable are displayed to the screen.\n\n```\n\
    [student@workstation loopdemo]$ ansible-playbook loop_register.yml\nPLAY [Loop\
