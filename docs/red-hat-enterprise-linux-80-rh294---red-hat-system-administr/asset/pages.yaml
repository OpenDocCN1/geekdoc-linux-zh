  md: '# SUMMARY


    In this chapter, you learned:


    # Ansible Roles


    +   - Roles organize Ansible code in a way that allows reuse and sharing.

    - Red Hat Enterprise Linux System Roles are a collection of tested and supported
    roles intended to help you configure host subsystems across versions of Red Hat
    Enterprise Linux.

    - Ansible Galaxy [https://galaxy.ansible.com/] is a public library of Ansible
    roles written by Ansible users. The **ansible-galaxy** command can search for,
    display information about, install, list, remove, or initialize roles.

    - External roles needed by a playbook may be defined in the **roles/requirements.yml**
    file. The **ansible-galaxy install -r roles/requirements.yml** command uses this
    file to install the roles on the control node.'
