    # Increasing Output Verbosity


    The default output by the **ansible-playbook** command does not provide detailed
    task execution information. The **ansible-playbook -v** command provides additional
    information, with up to four levels.


    # Configuring the Output Verbosity of Playbook Execution


    | OPTION | DESCRIPTION |

    | --- | --- |

    | -v | The task results are displayed. |

    | -vv | Both task results and task configuration are displayed |

    | -vvv | Includes information about connections to managed hosts |

    | -vvvv | Adds extra verbosity options to the connection plugins, including users
    being used in the managed hosts to execute scripts, and what scripts have been
    executed |


    # Syntax Verification


    Prior executing a playbook, it is good practice to perform a verification to ensure
    that the syntax of its contents is correct. The **ansible-playbook** command offers
    a --syntax-check option that you can use to verify the syntax of a playbook. The
    following example shows the successful verification of a playbook.


    ```

    [student@workstation -~\]$ ansible-playbook --syntax-check webserver.yml

    ```


    ```

    playbook: webserver.yml

    ```


    When syntax verification fails, a syntax error is reported. The output also includes
    the approximate location of the syntax issue in the playbook. The following example
    shows the failed verification of a playbook where the space separator is missing
    after the **name** attribute for play.'
