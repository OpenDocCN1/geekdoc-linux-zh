  md: "# OVERRIDING VARIABLES FROM THE COMMAND LINE\n\nInventory variables are overridden\
    \ by variables in a playbook, but both kinds of variables may be overridden through\
    \ arguments passed to the ansible and ansible-playbook commands over the command\
    \ line. Variables on the command line are called extra variables.\n\nExtra variables\
    \ can be useful when you need to override the default value for a variable for\
    \ one-off run of a playbook.\n\n```\n[user@demo]$ ansible-playbook main.yml -e\
    \ \"package=apache\"\n```\n\n# USING ARRAYS AS VARIABLES\n\nInstead of assigning\
    \ configuration that relates to the same element (a list of packages, a list of\
    \ services, a list of users, and so on), to multiple variables, administrators\
    \ can use arrays. One consequence of this is that an array can be browsed.\n\n\
    For example, consider the following snippet:\n\n```\nuser1_first_name: Bob\nuser1_last_name:\
    \ Jones\nuser1_home_dir: /users/bjones\nuser2_first_name: Anne\nuser2_last_name:\
    \ Cook\nuser2_home_dir: /users/acook\n```\n\nThis could be rewritten as an array\
    \ called users:\n\n```\nusers:\n  bjones:\n    first_name: Bob\n    last_name:\
    \ Jones\n    home_dir: /users/bjones\n  ac:\n    first_name: Anne\n    last_name:\
    \ Cook\n    home_dir: /users/acook\n```\n\nYou can then use the following variables\
    \ to access user data:\n\n```\n# Returns 'Bob'\nusers.bjones.first_name\n```\n\
    \n```\n# Returns '/users/acook'\nusers.acook.home_dir\n```\n\nBecause the variable\
    \ is defined as a Python dictionary, an alternative syntax is available."
  merge: -1
  pgno: 122
- img_proc: true
  md: "# CHAPTER 4 | Managing Variables and Facts\n\n```\n# Returns 'Bob'\nusers['bjones']['first_name']\n\
    \n# Returns '/users/acook'\nusers['acook']['home_dir']\n```\n\n> **IMPORTANT**\n\
    The dot notation can cause problems if the key names are the same as names of\
    \ Python methods or attributes, such as discard, copy, add, and so on. Using the\
    \ brackets notation can help avoid conflicts and errors.\n\nBoth syntaxes are\
    \ valid, but to make troubleshooting easier, Red Hat recommends that you use one\
    \ syntax consistently in all files throughout any Ansible Project.\n\n# CAPTURING\
    \ COMMAND OUTPUT WITH REGISTERED VARIABLES\n\nAdministrators can use the register\
    \ statement to capture the output of a command. The output is saved into a temporary\
    \ variable that can be used later for debugging purposes or to achieve something\
    \ else, such as a particular configuration based on a command's output.\n\nThe\
    \ following playbook demonstrates how to capture the output of a command for debugging\
    \ purposes:\n\n+   - name: Installs a package and prints the result\nhosts:\n\
    \  - all\ntasks:\n  - name: Install the package\n    yum:\n      name: httpd\n\
    \      state: installed\n    register: install_result\n  - debug: var=install_result\n\
    \nWhen you run the playbook, the debug module is used to dump the value of the\
    \ install_result registered variable to the terminal.\n\n```\n[user@demo]$ ansible-playbook\
    \ playbook.yml\nPLAY [Installs a package and prints the result] *********************************************************************\n\
    \nTASK [setup] *********************************************************************\n\
    ok: [demo.example.com]\n\nTASK [Install the package] *********************************************************************\n\
    ok: [demo.example.com]\n\nTASK [debug] *********************************************************************\n\
    ok: [demo.example.com] => {\nn\n```"
  merge: -1
