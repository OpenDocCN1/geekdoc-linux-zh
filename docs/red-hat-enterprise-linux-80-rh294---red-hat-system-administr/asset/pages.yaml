  md: '# CHAPTER 2 | Deploying Ansible


    BASHOPTS=cmdhist:extquote=force_fignore:hostcomplete:interact_ive=progcomp:promptvars=sourcepath

    Bash_ALIASES()


    Both command and raw, can run commands directly using the remote shell, bypassing
    the ansible module subsystem. This is useful when managing systems that cannot
    have Python installed (for example, a network router). It can also be used to
    install Python on a host.


    > **IMPORTANT**

    In circumstances, it is a recommended practice that you avoid the command, shell,
    and `run command` modules.


    Other modules are idempotent and can perform change tracking automatically. They
    test the state of systems and do nothing if they are already in the correct state.
    By contrast, it is much more complicated to use "run command" modules in a way
    that is idempotent. Depending upon them makes it harder for you to be confident
    that running your playbook would not cause an unexpected failure. When a shell
    or command module runs, it typically reports a CHANGED status based on whether
    it thinks it affected machine state.

    \There are times when "run command" modules are valuable tools and a good solution
    to a problem. If you need to use them, it is probably best to try to use the command
    module first, resorting to `shell` or `raw` modules if you need their special
    features.


    # CONFIGURING CONNECTIONS FOR AD HOC COMMANDS


    The directives for managed host connections and privilege escalation can be configured
    in the Ansible configuration file, and they can also be defined using ad hoc commands,
    they take precedence over the directive configured in the Ansible configuration
    file. The following table shows the analogous command-line options for each configuration
    directive.


    Ansible Command-line Options


    | CONFIGURATION FILE DIRECTIVE | COMMAND-LINE OPTION |

    |---|---|

    | inventory | -i |

    | remote_user | -u |

    | become | --become, -b |

    | become_method | --become-method |

    | become_user | --become-user |

    | become_ask_pass | --ask-become-pass, -K |


    By configuring these directives using command-line options, their currently defined
    values can be determined by consulting the output of `ansible --help`.


    RH294-RHEL8.0-en-1-20190531 45'
