  md: '# REGISTERING AND MANAGING SYSTEMS WITH RED HAT SUBSCRIPTION MANAGEMENT


    To entitle your new Red Hat Linux systems to produce subscriptions, Ansible provides
    the redhat_subscription and rhsm_repository modules. These modules interface with
    the Red Hat Subscription Management tool on the managed hosts.


    # Registering and Subscribing New Systems


    The first two tasks you usually perform with the Red Hat Subscription Management
    tool is to register the new system and attach an subscription.


    Without Ansible, you perform these tasks with the subscription-manager command:


    ```

    $[@host] ~subscription-manager register --username=yourusername \

    > --password=yourpassword

    [@host] ~subscription-manager attach --pool=poolID

    ```


    Remember that you list the available pools in your account with the subscription-manager
    list --available command.


    The redhat_subscription module performs the registration and the subscription
    in one task.


    +   - name: Register and subscribe the system

    redhat_subscription:

    username: yourusername

    password: yourpassword

    pool_ids: poolID

    state: present


    A state keyword set to present indicates to register and to subscribe the system.
    When it is absent, the module unregisters the system.


