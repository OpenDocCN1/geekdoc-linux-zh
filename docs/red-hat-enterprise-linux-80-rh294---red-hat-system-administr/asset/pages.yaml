  md: '# BUILDING AN ANSIBLE INVENTORY


    # OBJECTIVES


    After completing this section, you should be able to describe Ansible inventory
    concepts and manage a static inventory file.


    # DEFINING THE INVENTORY


    An inventory defines a collection of hosts that Ansible will manage. These hosts
    can also be assigned to groups, which can be managed collectively. Groups can
    contain child groups, and hosts can be members of multiple groups. The inventory
    can also set variables to the hosts and groups that it defines.


    Host inventories are defined in two different ways. A static host inventory can
    be defined by a text file. A dynamic host inventory can be generated by a script
    or other program as needed, using external information.


    # SPECIFYING MANAGED HOSTS WITH A STATIC INVENTORY


    A static inventory is a text file that specifies the managed hosts that Ansible
    targets. You can write this file using a number of different formats, including
    INI-style or YAML. The INI-style format is common and will be used for most examples
    in this course.


    > NOTE There are multiple static inventory formats supported by Ansible. In this
    section, we are focusing on the most common one, INI-style format.


    In its simplest form, an INI-style static inventory file is a list of host names
    or IP addresses of managed hosts, each on a single line:


    ```

    web1.example.com

    web2.example.com

    db1.example.com

    db2.example.com

    192.0.2.42

    ```


    Normally, you organize managed hosts into host groups. Host groups allow you to
    more effectively run Ansible against a collection of systems. In this case, each
    section starts with a host group name enclosed in square brackets []. This is
    followed by the host name or an IP address for each managed host in the group,
    each on a single line.


    In the following example, the host inventory defines two groups: webservers and
    db-servers.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# CHAPTER 2 | Deploying Ansible


    ```

    [webservers]

    web1.example.com

    web2.example.com

    192.0.2.42

    ```


    ```

    [db-servers]

    dbi1.example.com

    d2.example.com

    ```


    Hosts can be in multiple groups. In fact, recommended practice is to organize
    your hosts into multiple groups, possibly organized in different ways depending
    on the role of the host, its physical location, whether it is in production or
    not, and so on. This allows you to easily apply Ansible plays to specific hosts.


    ```

    [webservers]

    web1.example.com

    web2.example.com

    192.0.2.42

    ```


    ```

    [db-servers]

    dbi1.example.com

    d2.example.com

    ```


    ```

    [east-datacenter]

    web1.example.com

    dbi1.example.com

    ```


    ```

    [west-datacenter]

    web2.example.com

    dbi2.example.com

    ```


    ```

    [production]

    web1.example.com

    web2.example.com

    dbi1.example.com

    dbi2.example.com

    ```


    ```

    [development]

    192.0.2.42

    ```


    > IMPORTANT

    Two host groups always exist:


    - The all host group contains every host explicitly listed in the inventory.

    - The ungrouped host group contains every host explicitly listed in the inventory
    that is not a member of any other group.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Defining Nested Groups


    Ansible host inventories include groups of host groups. This is accomplished by
    creating a host name with the :children suffix. The following example creates
    a new group called north-america, which includes hosts from the usa and canada
    groups.


    ```

    [usa]

    washington1.example.com

    washington2.example.com


    [canada]

    tontario1.example.com

    tontario2.example.com


    [north-america]

    canada

    usa

    ```


    A group can have managed hosts and child groups as members. For example, in the
    previous inventory you could add a [north-america] section that has its own list
    of managed hosts. That list of hosts would be merged with the additional hosts
    that the north-america group inherits from its child groups.


    # Simplifying Host Specifications with Ranges


    You can specify ranges in the host names or IP addresses to simplify Ansible host
    inventories. You can specify either numeric or alphabetic ranges. Ranges have
    the following syntax:


    [START:END]


    Ranges match all values from START to END, inclusively. Consider the following
    examples:


    +   - 192.168:[4:7]:0-255 matches all IPv4 addresses in the 192.168.4.0/22 network
    (192.168.4.0 through 192.168.7.255).

    - server[01:20].example.com matches all hosts named server01.example.com through
    server20.example.com.

    - [a-c].dns.example.com matches hosts named adns.example.com, bns.example.com,
    and cns.example.com.

    - 2001:db8:[a:f] matches all IPv6 addresses from 2001:db8::a through 2001:db8::f.


    If leading zeros are used in numeric ranges, they are used in the pattern. The
    second example above does not match server1.example but does match server07.example.com.
