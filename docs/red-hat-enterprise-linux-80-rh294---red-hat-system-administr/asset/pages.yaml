- img_proc: true
  md: "# CHAPTER 5 | Implementing Task Control\n\n```\n---\nname: Simple Boolean Task\
    \ Demo\nhosts: all\nvars:\n  run_my_task: true\ntasks:\n  name: http package is\
    \ installed\n  yum:\n    name: httpd\n  when: run_my_task\n```\n\nThe next example\
    \ is a bit more sophisticated, and tests whether the my_service variable has a\
    \ value. If it does, the value of my_service is used as the name of the package\
    \ to install. If the my_service variable is not defined, then the task is skipped\
    \ without an error.\n\n```\n---\nname: Test Variable is Defined Demo\nhosts: all\n\
    vars:\n  my_service: httpd\ntasks:\n  name: \"{{ my_service }}\" package is installed\n\
    \  yum:\n    name: \"{{ my_service }}\"\n  when: my_service is defined\n```\n\n\
    The following table shows some of the operations that administrators can use when\
    \ working with conditionals:\n\n# Example Conditionals\n\n| OPERATION | EXAMPLE\
    \ |\n| Equal (value is a string) | ansible_machine == \"x86_64\" |\n| Equal (value\
    \ is numeric) | max_memory == 512 |\n| Less than | min_memory < 128 |\n| Greater\
    \ than | min_memory > 256 |\n| than or equal to | min_memory <= 256 |\n| Greater\
    \ than or equal to | min_memory >= 512 |\n| Not equal to | min_memory != 512 |\n\
    | Variable exists | min_memory is defined |\n| Variable does not exist | min_memory\
    \ is not defined |"
