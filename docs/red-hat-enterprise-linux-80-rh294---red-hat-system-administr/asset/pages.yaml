  md: '# CHAPTER 3 | Implementing Playbooks


    +   - stableinterface: The module''s keywords are stable, and every effort will
    be made not to

    remove keywords or change their meaning.


    +   - preview: The module is in technology preview, and might be unstable, its
    keywords

    change, or it might require libraries or web services that are themselves subject
    to incompatible

    changes.


    +   - deprecated: The module is deprecated, and will no longer be in some future
    release.


    +   - removed: The module has been removed from the release, but a stub exists
    for documentation

    purposes to help former users migrate to new modules.


    > NOTE

    The stableinterface status only indicates that a module''s interface is stable,

    does not rate the module''s code quality.


    The supported_by field records who maintains the module in the upstream Ansible
    community.

    Possible values are:


    +   - core: Maintained by the "core" Ansible upstream, and always included with
    Ansible.


    +   - curated: Modules submitted and maintained by partners or companies in the
    community.

    Maintainers of these modules must watch for any issues reported or pull requests
    against

    the upstream. "core" developers proposed changes to curated modules after

    the community maintainers have approved the changes. Core commit ensure that any

    issues with these modules due to changes in the Ansible engine are remediated.
    These modules

    are currently included with Ansible, but might be packaged separately at some
    point in the

    future.


    The upstream Ansible community has an issue tracker for Ansible and its integrated
    modules

    at https://github.com/ansible/ansible/issues.


    Sometimes, a module does not exist for something you want to do. As an end user,
    you can also

    write your own playbook, or get modules from a third party. Ansible searches for
    custom

    modules in the location specified by the ANSIBLE_LIBRARY environment variable,
    or if that is

    not set, by a library in the current Ansible configuration file. Ansible also
    searches for

    custom modules in the ..library directory relative to the playbook currently running.


    ```

    library = /usr/share/my_modules

    ```


    Information on writing modules is beyond the scope of this course. Documentation
    on how to

    this is available at https://docs.ansible.com/ansible/latest/dev_guide/developing_modules.html.'
