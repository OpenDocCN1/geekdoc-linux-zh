  md: "# CHAPTER 10 | Automating Linux Administration Tasks\n\n# MANAGING NETWORK\
    \ CONFIGURATION\n\n# OBJECTIVES\n\nAfter completing this section, you will be\
    \ able to configure network settings and name resolution on managed hosts, and\
    \ collect network-related Ansible facts.\n\n# CONFIGURING NETWORKING WITH THE\
    \ NETWORK SYSTEM ROLE\n\nRed Hat Linux 8 includes a collection of system Ansible\
    \ roles to configure RHEL-based systems. The *rhel-system-roles* package installs\
    \ those system roles which, for example, support the configuration of time synchronization\
    \ or networking. You can list the currently installed system roles with **ansible-galaxy\
    \ list** command.\n\n```\n[@controlnode ~]$ ansible-galaxy list\nlinux-system-roles.dump,\
    \ (unknown version)\nlinux-system-roles.network, (unknown version)\nlinux-system-roles.postfix,\
    \ (unknown version)\nlinux-system-roles.selinux, (unknown version)\nlinux-system-roles.timesync,\
    \ (unknown version)\nrhel-system-roles.dump, (unknown version)\nrhel-system-roles.network,\
    \ (unknown version)\nrhel-system-roles.postfix, (unknown version)\nrhel-system-roles.selinux,\
    \ (unknown version)\nrhel-system-roles.timesync, (unknown version)\n```\n\nRoles\
    \ are located in the `/usr/share/ansible/roles` directories. A role beginning\
    \ with **linux-system-roles** is a symlink to the matching **rhel-system-roles**\
    \ role.\n\nThe network system role supports the configuration of networking on\
