  md: "# IMPORTANT\nThe order in which the plays and tasks are listed in a playbook\
    \ is important, because Ansible runs them in the same order.\n\nThe playbooks\
    \ you have seen so far are as basic examples, and you will see more sophisticated\
    \ examples of what you can do with plays and tasks as this course continues.\n\
    \n# RUNNING PLAYBOOKS\n\nThe ansible-playbook command is used to run playbooks.\
    \ The command is executed on the control node and the name of the playbook to\
    \ be run is passed as an argument:\n\n```\n$[workstation ~$ ansible-playbook site.yml\n\
    ```\n\nWhen you run the playbook, output is generated to show the plays and tasks\
    \ being executed. The output also reports the results of each task executed.\n\
    The following example shows the contents of a simple playbook, and the result\
    \ of running it.\n\n```\n$[workstation playdemo]$ cat webserver.yml\n--\n- name:\
    \ setup web server\n  hosts: servera.lab.example.com\n  tasks:\n    - name: latest\
    \ httpd installed\n      yum:\n        state: latest\n        output: emitted\n\
    $[workstation playdemo]$ ansible-playbook webserver.yml\n```\n\nPLAY [play to\
    \ setup web server]\n\nTASK [Gathering Facts]\nsok: [servera.lab.example.com]\n\
    \nTASK [latest httpd version installed]\nchanged: [servera.lab.example.com]\n\n\
    PLAY RECAP\nservera.lab.example.com : ok=2 changed=1 unreachable=0 failed=0\n\n\
    Note that the value of name for each play and task is displayed when the playbook\
    \ is running. The **Gathering Facts** is a special task that the setup module\
    \ usually runs automatically at the start of a play (This is covered later in\
    \ course). For playbooks with multiple plays and tasks, setting **name** makes\
    \ it easier to monitor the progress of a playbook's execution.\n\nYou should also\
    \ see that the **latest httpd version installed** task is **changed** for servera.lab.example.com.\
    \ This means that the task changed something on that host to ensure its specification\
    \ was met. In this case, it means that the httpd package probably was not installed\
    \ or was not the latest version."
