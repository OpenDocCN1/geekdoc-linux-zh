  md: '# DEPLOYING ROLES WITH ANSIBLE GALAXY


    # OBJECTIVES


    After completing this section, you should be able to select and retrieve roles
    from Ansible Galaxy or other sources as a Git repository, and use them in playbooks.


    # INTRODUCING ANSIBLE GALAXY


    Ansible Galaxy [https://galaxy.ansible.com] is a public library of Ansible content
    written by an army of Ansible administrators and users. It contains thousands
    of Ansible roles and has a searchable database that helps Ansible users identify
    roles that help them accomplish an administrative task. Ansible Galaxy includes
    links to documentation and videos for new users and developers.


    ![](img/c66fec31e9528c7da22e5fa5113dfa6e_340_0.png)


    Figure 5.1: Ansible Galaxy home page


    In addition, the **ansible-galaxy** command that you use to get and manage roles
    from Ansible Galaxy can also be used to get and manage roles projects from your
    Git repositories.


    # Getting Help with Ansible Galaxy


    The Documentation tab on the Ansible Galaxy home page leads to a page that describes
    how to use Ansible Galaxy. There is content that describes how to download and
    use roles from Ansible Galaxy. Instructions on how to develop roles and upload
    them to Ansible Galaxy are also on that page.


    # Browsing Ansible Galaxy for Roles


    The Search tab on the left side of the Ansible Galaxy home page gives users access
    to information about the roles published on Ansible Galaxy. You can search for
    an Ansible role by its name, using tags, or by other role attributes. Results
    are presented in descending order of the'
