  md: "# REMOTE USERS AND PRIVILEGE ESCALATION IN\nPLAYS\n\nPlays can use different\
    \ remote users or privilege escalation settings for a play than what is\nspec\
    \ by the defaults in the configuration file. These are set in the play itself\
    \ at the same level\nas as the hosts or tasks keywords.\n\n# User Attributes\n\
    \nTasks in playbook are normally executed through a network connection to the\
    \ managed hosts. As\nwith ad hoc commands, the user account used for task execution\
    \ depends on various keywords in\nThe Ansible configuration, /etc/ansible/ansible.cfg.\
    \ The user that runs the tasks can be\ndefined by the remote_user keyword. However,\
    \ if privilege escalation is enabled, other keywords\nsuch as become_user can\
    \ also have an impact.\n\nIf the remote user defined in the Ansible configuration\
    \ for task execution is not suitable, it can be\noverridden by using the remote_user\
    \ keyword within a play.\n\n```\nremote_user: remoteuser\n```\n\n# Privilege Escalation\
    \ Attributes\n\nAdditional keywords are also available to define privilege escalation\
    \ parameters from within\na playbook. The become boolean keyword can be used to\
    \ enable or disable privilege escalation\nregardless of how it is defined in the\
    \ Ansible configuration file. It can take yes or true to enable\nprivilege escalation,\
    \ or no or false to disable it.\n\n```\nbecome: true\n```\n\nIf privilege escalation\
    \ is enabled, the become_method keyword can be used to define the\nprivilege escalation\
    \ method to use during a specific play. The example below specifies that sudo\n\
    be used for privilege escalation.\n\n```\nbecome_method: sudo\n```\n\nAdditionally,\
    \ with privilege escalation enabled, the become_user keyword can define the user\n\
    account to use for privilege escalation within the context of a specific play.\n\
    \n```\nbecome_user: privileged_user\n```\n\nThe following example demonstrates\
    \ the use of these keywords in a play:\n\n```\nname: /etc/hosts is up to date\n\
    hosts: datacenter-west\nremote_user: automation\nbecome: yes\\\n\ntasks:\n  name:\
    \ server.example.com in /etc/hosts\n  linefile:\n```"
