  md: '# MANAGING SECRETS


    # OBJECTIVES


    After completing this section, you should be able to encrypt sensitive variables
    using Ansible Vault, and run playbooks that reference Vault-encrypted files.


    # INTRODUCING ANSIBLE VAULT


    Ansible may need to encrypt sensitive data such as passwords or API keys in order
    to configure managed hosts. Normally, this information might be stored as plain
    text in inventory variables or other Ansible files. In that case, however, anyone
    with access to the Ansible files or a version control system that stores the Ansible
    files would have access to this sensitive data. This poses an obvious security
    risk.


    Ansible Vault, included with Ansible, can be used to encrypt and decrypt any structured
    data file used by Ansible. To use Ansible Vault, a command-line tool ansible-vault
    is used to create, edit, encrypt, decrypt, and view files. Ansible Vault can encrypt
    any structured data used by Ansible. This might include inventory variables, included
    variables in a playbook, variable files passed as arguments when executing the
    playbook, or variables defined in Ansible roles.


    > IMPORTANT

    Ansible Vault does not implement its own cryptographic functions but rather uses
    an external Python toolkit. Files are protected with symmetric encryption using
    AES256 with a password as the secret key. Note that the way this is done has not
    been formally audited by a third party.


    # Creating an Encrypted File


    To create a new encrypted file, use the ansible-vault create filename. The command
    prompts for the new vault password and then opens a file using the default editor,
    vi. You can set and export the EDITOR environment variable to specify a different
    default editor by setting and exporting. For example, to set the default editor
    to nano, export EDITOR=nano.


    ```

    $student@demo ~$ ansible-vault create secret.yml

    New vault password: redhat

    Confirm Vault password: redhat

    ```


    Instead of entering the vault password through standard input, you can use a vault
    password file to store the vault password. You need to carefully protect this
    file using permissions and other means.


    ```

    $student@demo ~$ ansible-vault create --vault-password-file=vault-password-file
    secret.yml

    ```


    The cipher used to protect files is AES256 in recent versions of Ansible, but
    files encrypted with older versions may still use 128-bit AES.'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# Viewing an Encrypted File


    You can use the **ansible-vault view filename** command to view an Ansible Vault-encrypted
    file when opening it for editing.


    ```

    [student@demo ~]$ ansible-vault view secreti.yml

    Vault password: secret

    less 458 (POSIX regular expressions)

    Copyright (C) 1994-2012 Mark Nudelman

    ```


    less comes with NO WARRANTY, to the extent permitted by law.

    For information about the terms of redistribution,

    see the file README in the less distribution.

    Homepage: http://www.greensoftware.com/less

    my_secret: "yYVjYHqHsiummpPdzjnndkNYJdj782meUczw"


    # Editing an Existing Encrypted File


    To edit an encrypted file, Ansible provides the **ansible-vault edit filename**
    command. This command decrypts the file to a temporary file and allows you to
    edit it. When saved, it copies the content and removes the temporary file.


    ```

    [student@demo ~]$ ansible-vault edit secret.yml

    Vault password: redhat

    ```


    > NOTE

    The **edit** subcommand always rewrites the file, so you should only use it when
    making changes. This can have implications when the file is kept under version
    control. You should always use the **view** subcommand to view the file''s contents
    without making changes.


    # Encrypting an Existing File


    To encrypt a file that already exists, use the **ansible-vault encrypt filename**
    command. This command can take the names of multiple files to be encrypted as
    arguments.


    ```

    [student@demo ~]$ ansible-vault encrypt secret1.yml secret2.yml

    Vault password: redhat

    Confirm New Vault password: redhat

    Encryption successful

    ```


    Use the **--output=OUTPUT** option to save the encrypted file with a new name.
    You can only use one input file with the **--output** option.


    # Decrypting an Existing File


    An encrypted file can be permanently decrypted by using the **ansible-vault decrypt
    filename** command. When decrypting a single file, you can use the **--output**
    option to save the decrypted file under a different name.'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# CHAPTER 4 | Managing Variables and Facts


    ```

    $student@demo~\]$ ansible-vault decrypt secret1.yml --output=secret1-decrypted.yml

    Vault password: redhat

    Decryption successful

    ```


    # Changing the Password of an Encrypted File


    You can use the ansible-vault rekey filename to change the password of an encrypted
    file. This can dekey multiple files at once. with the original password and then
    the new password.


    ```

    $student@demo~\]$ ansible-vault rekey secret.yml

    Vault password: redhat

    New Vault password: RedHat

    Confirm New Vault password: RedHat

    Rekey successful

    ```


    When using a vault password, use the --new-vault-password-file option:


    ```

    $student@demo~\]$ ansible-vault rekey \

    --new-vault-password-file=NEW_VAULT_PASSWORD_FILE secret.yml

    ```


    # PLAYBOOKS AND ANSIBLE VAULT


    To run a playbook that accesses files encrypted with Ansible Vault, you need to
    provide the encryption password to the ansible-playbook command. If you do not
    provide the password, the playbook returns an error:


    ```

    $student@demo~\]$ ansible-playbook site.yml

    ERROR: A vault password must be specified to decrypt vars/api_key.yml

    ```


    To provide the vault password to the playbook, use the --vault-id option. For
    provide the vault password interactively, use --vault-id @prompt as illustrated
    in the example:


    ```

    $student@demo~\]$ ansible-playbook --vault-id @prompt site.yml

    Vault password (default): redhat

    ```


    > IMPORTANT

    If you are using a release of Ansible earlier than version 2.4, you need to use
    the --ask-vault-pass option to interactively provide the vault password. You can
    still use this option if all vault-encrypted files used by the playbook were encrypted
    with the same password.


    ```

    $student@demo~\]$ ansible-playbook --ask-vault-pass site.yml

    Vault password: redhat

    ```


    Alternatively, you can use the --vault-password-file option to specify a file
    that stores the encryption password in plain text. The password should be a string
    stored as a single line in the file.'
