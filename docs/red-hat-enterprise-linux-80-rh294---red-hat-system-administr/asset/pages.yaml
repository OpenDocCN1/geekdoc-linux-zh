  md: '# CHAPTER 8 | Simplifying Playbooks with Roles


    The Filters pendulum to the right of the search box allow searches to be performed
    on keywords, IDs, platform, and tags. Possible platform values include EL for
    Red Hat Enterprise Linux (and closely related distributions as CentOS) and Fedora,
    among others.


    > IMPORTANT

    In the Ansible Galaxy search interface, keyword search words or phrases in the
    README file, content name, or content description. Tag searches, by contrast,
    specifically match tags set by the author for the role.


    # THE ANSIBLE GALAXY COMMAND-LINE TOOL


    The ansible-galaxy command line tool can be used to search for, display information
    about, install, list, remove, or initialize roles.


    # Searching for Roles from the Command Line


    The ansible-galaxy search subcommands Ansible Galaxy for roles. If you specify
    a string as an argument, it is used to search Ansible Galaxy for roles. You can
    use the --author,--platforms, and --tags options to narrow the results. You can
    use those options as the main key search. For example, the ansible-galaxy search
    --author geeringguy will display all roles submitted by the user geeringguy.


    Results are displayed in alphabetical order, not descending Best Match score.
    The following example displays the names of roles that include redis, and are
    available for the Enterprise Linux (EL) platform.


    ```

    [user@~]$ ansible-galaxy search ''redis'' --platforms EL

    ```


