  md: '# EXAMINING ANSIBLE CONFIGURATION OPTIONS


    # OBJECTIVES


    After completing this section, you should be able to use ansible-config to discover
    and investigate configuration options and to determine which options have been
    modified from the default settings.


    # Viewing Configuration Options


    If you want to find out what options are available in the configuration file,
    use the ansible-config list command. It will display an exhaustive list of the
    available configuration options and their default settings. This list may vary
    depending on the version of Ansible that you have installed and whether you have
    any additional Ansible plugins on your control node.


    Each option displayed by ansible-config list will have a number of key-value pairs
    associated with it. These key-value pairs provide information on how that option
    works. For example, the option ACTION_WARNING displays the following key-value
    pairs:


    | KEY | VALUE | PURPOSE |

    |---|---|---|

    | description | [By default Ansible will issue a warning when received from a
    task action (module or action plugin). These warnings can be silenced by adjusting
    this setting to False.] | Describes what this configuration option is for. |

    | type | boolean | What the type is for the option: boolean means true-false value.
    |

    | default | true | The default value for this option. |

    | version_added | 2.5 | The version of Ansible that added this option, for backward
    compatibility. |

    | ini | { key: action_warnings, section: defaults } | Which section of the INI-like
    inventory file contains this option, and the name of the option in the configuration
    file (action_warnings, in the defaults section). |

    | env | ANSIBLE_ACTION_WARNINGS | If this environment variable is set, it will
    override any setting of the option made in the setting of the file. |'
