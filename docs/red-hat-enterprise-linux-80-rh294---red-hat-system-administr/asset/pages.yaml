  md: '# Configuration Management


    Centralizing configuration file management and deployment is a common use case
    for Ansible, and it how many power users are first introduced to the Ansible automation
    platform.


    # Application Deployment


    When you define your application with Ansible, and manage the deployment with
    Red Hat Ansible Tower, teams can effectively manage the entire application life
    cycle from development to production.


    # Provisioning


    Applications to be deployed or installed on systems. Ansible and Red Hat Ansible
    Tower can streamline the process of provisioning systems, whether you are PXE
    booting and kickstarting bare-metal systems or virtual machines, creating virtual
    machines or cloud instances. Applications have to be deployed or installed on
    systems.


    # Continuous Delivery


    Creating a CI/CD pipeline requires coordination and buy-in from numerous teams.
    You cannot do it without a simple automation platform that everyone in your organization
    can use. Ansible Playbooks keep your applications properly deployed (and managed)
    throughout their entire life cycle.


    # Security and Compliance


    When your security policy is defined in Ansible Playbooks, scanning and remediation
    of site-wide security policies can be integrated into other automated processes.
    Instead of being afterward, it is an integral part of everything that is deployed.


    # Orchestration


    Configurations alone do not define your environment. You need to define how multiple
    configurations interact, and ensure the disparate pieces can be managed as a whole.


    > ### REFERENCES

    Ansible

    https://www.ansible.com


    ### How Ansible Works

    https://www.ansible.com/how-ansible-works'
