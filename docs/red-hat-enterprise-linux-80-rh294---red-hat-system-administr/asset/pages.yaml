  md: "# MANAGING SOFTWARE AND SUBSCRIPTIONS\n\n# OBJECTIVES\n\nAfter completing this\
    \ section, you should be able to subscribe systems, configure software channels\
    \ and repositories, and manage RPM packages on managed hosts.\n\n# MANAGING PACKAGES\
    \ WITH ANSIBLE\n\nThe Yum module uses the Yum Package Manager on the managed hosts\
    \ to handle the package operations. The following example is a playbook that installs\
    \ the httpd package on the servera.lab.example.com managed host.\n\n```\n---\n\
    name: Install the required packages on the web server\n  hosts: servera.lab.example.com\n\
    tasks:\n  name: Install the httpd packages\n    yum:\n      name: httpd\n    \
    \  state: present\n```\n\n+   - The name keyword gives the name of the package\
    \ to install.\n- The state keyword indicates the expected state of the package\
    \ on the managed host.\n\npresent\nAnsible installs the package if it is not already\
    \ there.\n\nabsent\nAnsible removes the package if it is installed.\n\nThe following\
    \ table compares some usage of the yum module with the equivalent yum command.\n\
    \n| ANSIBLE TASK | YUM COMMAND |\n|---|---|\n| name: Install httpd\nnyum:\n  name:\
    \ httpd\n  state: present | yum install httpd |"
  merge: -1
