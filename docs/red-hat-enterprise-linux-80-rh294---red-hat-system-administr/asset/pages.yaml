  md: '# Specifying When a Task Reports “Changed” Results


    When a task makes a change to a managed host, it reports the changed state and
    notifies handlers. A task does not need to make a change, it reports ok and does
    not notify handlers.


    The changed_when keyword can be used to control when a task reports changed. For
    example, the shell module in the next example is being used to get a Kerberos
    credential which will be used by subsequent tasks. It normally always report changed
    when it runs. To suppress that, changed_when: false is set so it only reports
    ok or failed.


    +   - name: get Kerberos credentials as "admin"

    - shell: echo "{{ krb_admin_pass }}\ | kinit -f admin

    changed_when: false


    The following example uses the shell module to report changed based on the output
    of the module that is collected by a registered variable:


    +   - name: shell

    - cmd: /usr/local/bin/upgrade-database

    - register: command_result

    changed_when: "Success" in command_result.stdout

    - notify:

    - restart_database


    +   - handlers:

    - name: restart_database

    - service:

    - name: mariadb

    - state: restarted


    # Ansible Blocks and Error Handling


    In playbooks, blocks are clauses that logically group tasks, and can be used to
    control how tasks are executed. For example, a block task can have a when keyword
    to apply a conditional to tasks:


    +   - name: block example

    - hosts: all

    tasks:

    - name: installing and configuring Yum versionlock plugin

    block:

    - name: package needed by yum

    yum:

    - name: yum-plugin-versionlock

    - state: present

    - name: lock version of tzdata

    lineinfile:

    - dest: /etc/yum/pluginconf.d/versionlock.list

    - line: tzdata-2016-j

    - state: present

    when: ansible_distribution == "RedHat"'
