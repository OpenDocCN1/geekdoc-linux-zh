  md: '# CHAPTER 5 | Implementing Task Control


    # Earlier-Style Ansible Loops


    | LOOP KEYWORD | DESCRIPTION |

    | --- | --- |

    | with_items | Behaves the same as the loop keyword for simple lists, such as
    a list of strings or a list of hashes/dictionaries. Unlike loop, if lists are
    provided to with_items, they are flattened into a single-level list. The loop
    variable item holds the item used during each iteration. |

    | with_file | This requires a list of control node file names. The loop variable
    item holds the content of a corresponding file from the list during each iteration.
    |

    | with_sequence | Instead of requiring a list, this keyword requires parameters
    to generate a list of values based on a numeric sequence. The loop variable item
    holds the value of one of the generated items in the generated sequence during
    each iteration. |


    An example of with_items in a playbook is shown below:


    > IMPORTANT

    Since Ansible 2.5, the recommended way to write loops is to use the loop keyword.
    However, you should still understand the old syntax, especially with_items, because
    it is likely to encounter and continue to use with_* for looping.


    Any task using the old syntax can be converted to loop in conjunction with Ansible
    filters. You do not need to know how to use Ansible filters to do this. There
    is a good reference on how to convert the old loops to the new syntax, as well
    as examples of how to loop over items that are not simple lists, in the Ansible
    documentation in the section Migrating from X to loop [https://docs.ansible.com/ansible/latest/user_guide/playbooks_loops.html#migrating-from-with-x-to-loop]
    of the Ansible User Guide.


    You will likely encounter tasks from older playbooks that contain with_* keywords.


    Advanced looping techniques are beyond the scope of this course. All iteration
    tasks in this course can be implemented with either the with_items or the loop
    keyword.'
