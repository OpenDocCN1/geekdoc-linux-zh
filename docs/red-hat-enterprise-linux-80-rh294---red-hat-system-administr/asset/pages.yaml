  md: "# CHAPTER 7 | Managing Large Projects\n\n> IMPORTANT\nThe wildcard hosts patterns\
    \ match all inventory names, hosts, and host groups. They do not distinguish between\
    \ names that are DNS names, IP addresses, or groups, which can lead to some unexpected\
    \ matches.\n\nFor example, compare the results of specifying the datacenter* host\
    \ pattern from the preceding example with the results of the data* host pattern\
    \ based on the example inventory:\n\n```\n[student@controlnode ~]$ cat playbook.yml\n\
    \nhosts: 'data'\n  ...output omitted...\n[student@controlnode ~]$ ansible-playbook\
    \ playbook.yml\n```\n\n```\nPLAY [Test Host Patterns]\n**********************************************************************************\n\
    ```\n\n```\nTASK [Gathering Facts]\n**********************************************************************************\n\
    ok: [labhost1.example.com]\nok: [test1.example.com]\nok: [labhost2.example.com]\n\
    ok: [test2.example.com]\nok: [data.example.com]\n```\n\n# Lists\n\nMultiple entries\
    \ in an inventory can be referenced using logical lists. Comma-separated list\
    \ of host patterns matches all hosts that match any of those host patterns.\n\n\
    If you provide a comma-separated list of managed hosts, then all managed hosts\
    \ will be targeted:\n\n```\n[student@controlnode ~]$ cat playbook.yml\n--\nhosts:\
    \ labhost1.example.com,test2.example.com,192.168.2.2\n  ...output omitted...\n\
    [student@controlnode ~]$ ansible-playbook playbook.yml\n```\n\n```\nPLAY [Test\
    \ Host Patterns]\n**********************************************************************************\n\
    ```\n\n```\nTASK [Gathering Facts]\n**********************************************************************************\n\
    ok: [labhost1.example.com]\nok: [test2.example.com]\nok: [192.168.2.2]\n```\n\n\
    If you provide a comma-separated list of groups, then all hosts in any of those\
    \ groups will be targeted:\n\nRH294-RHEL8.0-en-1-20190531 239"
