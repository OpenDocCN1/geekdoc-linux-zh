  md: '# CHAPTER 8 | Simplifying Playbooks with Roles


    # REUSING CONTENT WITH SYSTEM

    ROLES


    # OBJECTIVES


    After completing this section, you should be able to write playbooks that take
    advantage of

    Red Hat Enterprise Linux System Roles to perform standard operations.


    # RED HAT ENTERPRISE LINUX SYSTEM ROLES


    Beginning with Red Hat Enterprise Linux 7.4, a number of Ansible roles have been
    provided with

    the operating system as part of the rhel-system-roles package. In Red Hat Enterprise
    Linux 8 the

    package is available in the AppStream channel. A brief description of each role:


    # RHEL System Roles


    | NAME | STATE | ROLE DESCRIPTION |

    | rhel-system-roles.kdump | Fully Supported | Configures the kdump crash recovery
    service. |

    | rhel-system-roles.network | Fully Supported | Configures network interfaces.
    |

    | rhel-system-roles.selinux | Fully Supported | Configures and manages SELinux
    customization, using SELinux mode, file and port contexts, Boolean settings, and
    SELinux users. |

    | rhel-system-roles.timesync | Fully Supported | Configures time synchronization
    using Network Time Protocol or Precision Time Protocol. |

    | rhel-system-roles.postfix | Technology Preview | Configures each host as a Mail
    Transfer Agent using the Postfix service. |

    | rhel-system-roles.firewall | In Development | Configures the host''s firewall.
    |

    | rhel-system-roles.tuned | In Development | Configures the tuned service to tune
    system performance. |


    System roles to standardize the configuration of Red Hat Enterprise Linux subsystems
    across

    multiple versions. Use system roles to configure any Red Hat Enterprise Linux,
    version 6.10 and

    onward.


    # Simplified Configuration Management


    As an example, the recommended time synchronization service for Red Hat Enterprise
    Linux 7

    is the chronyd service. In Red Hat Enterprise Linux 6 however, the recommended
    service is the

    tppd service. In an environment with a mixture of Red Hat Enterprise Linux 6 and
    7 hosts, an

    administrator must manage the configuration files for both services.


    RH294-RHEL8.0-en-1-201905031

    299'
