  md: "# CHAPTER 8 | Simplifying Playbooks with Roles\n\nThe following is a sample\
    \ meta/main.yml file.\n\n```\n---\ndependencies:\n  role: apache\n  port: 8080\n\
    \  role: postgres\n  dbname: serverlist\n  admin_user: felix\n```\n\nBy default,\
    \ roles are only added as a dependency to a playbook once. If another role also\
    \ lists it as a dependency it will not run again. This behavior can be overridden\
    \ by setting the allow_duplicates variable to yes in the meta/main.yml file.\n\
    \n> IMPORTANT\nLimit your role's dependencies on other roles. Dependencies make\
    \ it harder to maintain your role, especially if it has many complex dependencies.\n\
    \n# USING THE ROLE IN A PLAYBOOK\n\nTo access a role, reference it in the roles:\
    \ section of a play. The following playbook refers to the motd role. Because no\
    \ variables are specified, the role is applied with its default variable values.\n\
    \n```\n[user@host ~]$ cat use-motd-role.yml\n-\nname: use motd role playbook\n\
    hosts: remote.example.com\nremote_user: devops\nbecome: true\nroles:\n  - motd\n\
    ```\n\nWhen the playbook is executed, tasks performed because of a role can be\
    \ identified by the role prefix name. The following output illustrates this with\
    \ the motd : prefix in the task name:\n\n```\n[user@host ~]$ ansible-playbook\
    \ -i inventory use-motd-role.yml\nPLAY [use motd role playbook] *********************************************************************\n\
    TASK [setup] *********************************************************************\n\
    ok: [remote.example.com]\nTASK [motd: deliver motd file] *********************************************************************\n\
    changed: [remote.example.com]\nPLAY RECAP *********************************************************************\n\
    remote.example.com : ok=2  changed=1 unreachable=0 failed=0\n```\n\nThe above\
    \ scenario assumes that the motd role is located in the roles directory. Later\
    \ in the course you will see how to use a role that is remotely located in a version\
    \ control repository."
