  md: '# Introduction


    The primary function of bastion is that it acts as a router between the network
    that connects the student machines and the classroom network. If bastion is down,
    other student machines will only be able to access systems on the individual student
    network.


    Several systems in the classroom providing services. Two servers, content.example.com
    and materials.example.com, are for software and lab materials used in hands-on
    activities. Information on how to use these servers is provided in the instructions
    for these activities. These are provided by the classroom.example .com machine.
    Both classroom and bastion should always be running for proper use of the lab
    environment.


    # CONTROLLING YOUR SYSTEMS


    In an instructor-led training classroom, students are assigned a physical computer
    (foundationX.ilt.example.com), which is used to access their virtual machines
    running on that host. Students are automatically logged in to the physical machine
    as the kiosk user, with the password redhat. The classroom systems with which
    you work virtual machines running on that host.


    On foundationX, a special command called rht-vmctl is used to work with the virtual
    machines. The commands in the following table should be run as the kiosk user
    on foundationX, and can be used with any of the virtual machines.


    rht-vmctl Commands


    | ACTION | COMMAND |

    | --- | --- |

    | Start server machine | rht-vmctl start server |

    | View "physical console" to log in and work with the server machine | rht-vmview
    view server |

    | Reset server machine to its previous state and restart the virtual machine |
    rht-vmctl reset server |


    At the start of a lab exercise, if the instruction "reset your server" appears,
    you should run the rht-vmctl reset servera on the foundationX system as the kiosk
    user. Likewise, if the instruction "reset your workstation" appears, you should
    run the rht-vmctl reset workstation command on foundationX as the kiosk user.'
