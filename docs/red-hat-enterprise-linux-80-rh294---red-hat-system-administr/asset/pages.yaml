  md: "# IMPLEMENTING HANDLERS\n\n# OBJECTIVES\n\nAfter completing this section, you\
    \ should be able to implement a task that runs only when other task changes change\
    \ the managed host.\n\n# ANSIBLE HANDLERS\n\nAnsible modules are designed to be\
    \ idempotent. This means that in a properly written playbook, the playbook and\
    \ its tasks can be run multiple times without changing the managed host unless\
    \ they need to make a change to get the managed host to the desired state.\n\n\
    However, when a task makes a change to the system, a further task may need to\
    \ be run. For example, a change to a configuration file may require that the service\
    \ be reloaded so that the changed configuration takes effect.\n\nHandlers are\
    \ tasks that respond to a notification triggered by other tasks. Tasks notify\
    \ the handler when a task changes something on a managed host. Each handler has\
    \ a globally unique name and is triggered at the end of a block of tasks in a\
    \ playbook. If no notification triggers the handler, the handler will run exactly\
    \ once after all other tasks in the playbook have completed. Because handlers\
    \ are tasks, administrators can use the same modules in handlers that they would\
    \ use for any other task. Normally, handlers are used to reboot hosts and restart\
    \ services.\n\nHandlers can be considered inactive tasks that only get triggered\
    \ when explicitly invoking a notify statement. The following snippet shows how\
    \ the Apache server is only restarted by restart handler when a configuration\
    \ file is updated and notifies it:\n\n```\ntasks:\n- name: copy demo.example.conf\
    \ configuration template\n  template:\n    src: /var/lib/templates/demo.example.conf.template\n\
    \    dest: /etc/httpd/conf.d/demo.example.conf\nnotify:\n  - restart apache\n\
    ```\n\n```\nhandlers:\n- name: restart apache\n  service:\n    name: httpd\n \
    \   state: restarted\n```\n\n+   1 The task that notifies the handler.\n2 The\
    \ notify statement indicates the task need to trigger a handler.\n3 The name of\
    \ the handler to run.\n4 The handlers keyword indicates the start of the list\
    \ of handler tasks."
  merge: -1
  pgno: 183
- img_proc: true
  md: "# CHAPTER 5 | Implementing Task Control\n\n+   - The name of the handler invoked\
    \ by tasks.\n- The module to use for the handler.\n\nIn the previous example,\
    \ the restart apache handler triggers when notified by the template task that\
    \ has a change. A task may call more than one handler in the notify section. Ansible\
    \ treats the notify statement as an array and iterates over the handler names:\n\
    \n```\ntasks:\n  name: copy demo.example.conf configuration template\n  src: /var/lib/templates/demo.example.conf.template\n\
    \  dest: /etc/httpd/conf.d/demo.example.conf\n  notify:\n    - restart mysql\n\
    \    - restart apache\n```\n\n```\nhandlers:\n  name: restart mysql\n    service:\n\
    \      name: mariadb\n      state: restarted\n\n  name: restart apache\n    service:\n\
    \      name: httpd\n      state: restarted\n```\n\n# DESCRIBING THE BENEFITS OF\
    \ USING HANDLERS\n\nAs discussed in the Ansible documentation, there are some\
    \ important things to remember using handlers:\n\n+   - Hand always run in the\
    \ order specified by the handlers section of the play. They do not run in the\
    \ order in which they are listed by notify statements in a task, or in the order\
    \ in which tasks notify them.\n- Hand normally run after all tasks in the play\
    \ complete. A handler called by a task in the tasks part of the playbook will\
    \ not run until all tasks under tasks have been processed. (There are some exceptions\
    \ to this)\n- Handler names exist in a per-play namespace. If two handlers are\
    \ incorrectly given the same name, only one will run.\n- Even if more than one\
    \ task notifies a handler, the handler only runs once. If no tasks notify it,\
    \ a handler will not run.\n- If a task that includes a notify statement does not\
    \ report a changed result (for example, a package is already installed and the\
    \ task reports ok), the handler is not notified. The handler is skipped unless\
    \ another task notifies it. Ansible notifies handlers only if the task reports\
    \ the changed status.\n\n> IMPORTANTnHHandlers are meant to perform an extra action\
    \ when a task makes a change to a managed host. They should not be used as a replacement\
    \ for normal tasks.\n\nRH294-RHEL8.0-en-1-20190531\n\n169"
