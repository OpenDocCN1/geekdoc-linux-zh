  md: 'CHAPTER 9 | Troubleshooting Ansible


    # LAB


    # TROUBLESHOOTING ANSIBLE


    # PERFORMANCE CHECKLIST


    In this lab, you will troubleshoot problems that occur when you try to run a playbook
    that has been provided to you.


    # OUTCOMES


    You should be able to:


    +   - Troubleshoot playbooks.


    +   - Troubleshoot managed hosts.


    # BEFORE YOU BEGIN


    Log in to workstation as using student as the password. Run the lab troubleshoot-review
    start command.


    ```

    $student@workstation -$ lab troubleshoot-review start

    ```


    This script verifies that Ansible is installed on workstation, and creates the
    syntax of the secure-troubleshoot-review/html/directory. It downloads the ansible.cfg,
    inventory-lab,secure-web.yml and hosts.conf files from http://materials.example.com/labs/troubleshoot-review/
    to the /home/student/troubleshoot-review/directory. It also downloads the index.html
    file to the /home/student/troubleshoot-review/html/directory.


    +   1. From the ~/troubleshoot-review directory, check the syntax of the secure-web.yml
    playbook that sets up Apache HTTPD with TLS/SSL for hosts in the group webservers.
    Fix the issue that is reported.


    +   2. Check the syntax of the secure-web.yml playbook again. Fix the issue that
    is reported.


    +   3. Check the syntax of the secure-web.yml playbook a third time. Fix the issue
    that is reported.


    +   4. Check the syntax of the secure-web.yml playbook a fourth time. It should
    not show any syntax errors.


    +   5. Run the secure-web.yml playbook. Ansible is not able to connect to server.lab.example.com.
    Fix this problem.


