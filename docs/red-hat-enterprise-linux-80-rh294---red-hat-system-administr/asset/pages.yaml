  md: '# CHAPTER 1 | Introducing Ansible


    Red Hat provides the ansible-2.8-for-rhel-8-x86_64-rpm channel for Red Hat Enterprise
    Linux 8. You can also get the latest update of the Red Hat Ansible Engine 2 major
