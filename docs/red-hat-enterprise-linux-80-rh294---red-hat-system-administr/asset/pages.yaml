    \n# Installing Roles from Ansible Galaxy\n\nThe **ansible-galaxy install** command\
    \ downloads a role from Ansible Galaxy, then installs it locally on the control\
    \ node.\n\nBy default, roles are installed into the first directory that is writable\
    \ in the user's **roles_path**. Based on the default roles_path for Ansible, the\
    \ role will be installed into the user's **~/.ansible** directory. The default\
    \ roles_path might be overridden by your current Ansible configuration file or\
    \ by the environment variable ANSIBLE_ROLES_PATH, which affects the behavior of\
    \ **ansible-galaxy**.\n\nYou can also specify a specific directory to install\
    \ the role by using the **-p DIRECTORY** option.\n\nIn this example, **ansible-galaxy**\
    \ installs the **geerlingguy.redis** role into a playbook project's **roles**\
    \ directory. The command current working directory is **/opt/project**.\n\n```\n\
