  md: '# MANAGING ANSIBLE CONFIGURATION

    FILES


    # OBJECTIVES


    After completing this section, you should be able to describe where Ansible configuration
    files are located, how they are selected by Ansible, and edit them to apply changes
    to default settings.


    # CONFIGURING ANSIBLE


    The behavior of an Ansible installation can be customized by modifying settings
    in the Ansible configuration file. Ansible chooses its configuration file from
    one of several possible locations on the control node.


    # Using /etc/ansible/ansible.cfg


    The ansible package provides a base configuration file located at /etc/ansible/ansible.cfg.
    This file is used if no other configuration file is found.


    # Using ~/.ansible.cfg


    Ansible looks for a .ansible.cfg file in the user''s home directory. This configuration
    is used instead of /etc/ansible/ansible.cfg if it exists and there is no ansible.cfg
    file in the current working directory.


    # Using/ansible.cfg


    If an ansible.cfg file exists in the directory where the ansible command is executed,
    it is used instead of the global file or the user''s personal file. This allows
    administrators to create a directory structure where different environments or
    projects are stored in separate directories, with each directory containing a
    configuration file tailored with a unique set of settings.


    > IMPORTANT

    The recommended practice is to create an ansible.cfg file in a directory from
    which you run Ansible. This directory would also contain any files used by your
    Ansible project, such as an inventory and a playbook. This is the most common
    location used for the Ansible configuration file. It is unusual to use a ~/.ansible.cfg
    or /etc/ansible/ansible.cfg file in practice.


    # Using the ANSIBLE_CONFIG environment variable


    You can use different configuration files by placing them in different directories
    and executing Ansible from the appropriate directory, but this can be restrictive
    and hard to manage as the number of configuration files grows. A more flexible
    option is to define the location of the configuration file with the ANSIBLE_CONFIG
    environment variable. When this variable is defined, Ansible uses the configuration
    file that the variable specifies instead of any of the previously mentioned configuration
    files.'
