    You can also manage managed hosts, host groups, and wildcards, as shown below:


    ```

    [student@controlnode ~]$ cat playbook.yml

    ---

    hosts: lab,data*,192.168.2.2

    ...output omitted.

    [student@controlnode ~]$ ansible-playbook playbook.yml

    ```


    PLAY [Test Host Patterns] *************************************


    +   TASK [Gathering Facts] *************************************

    ok: [labhost1.example.com]

    ok: [labhost2.example.com]

    ok: [test1.example.com]

    ok: [test2.example.com]

    ok: [data.example.com]

    ok: [192.168.2.2]


    > NOTE

    The colon character (:) can be used instead of a comma. However, the comma is
    the preferred separator, especially when working with IPv6 addresses as managed
    hosts names. You may see the colon syntax in older examples.


    If an item in a list starts with the ampersand (&), then hosts must match that
    item in order to match the pattern. It operates similarly to a logical AND.


    For example, based on our example inventory, the following host matches machines
    in the lab group only if they are also in the datacenter1 group:


    ```

    [student@controlnode ~]$ cat @playbook.yml

    ---

    hosts: lab,&datacenter1

    ...output omitted...

    [student@controlnode ~]$ ansible-playbook playbook.yml

    ```


    PLAY [Test Host Patterns] *************************************


