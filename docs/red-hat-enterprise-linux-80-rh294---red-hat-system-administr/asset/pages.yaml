    \nSome variables are not facts or configured through the setup module, but *magic\
    \ variables* can also be useful to get information specific to a particular managed\
    \ host.\n\nFour of the most useful are:\n\n**hostvars** Contains the variables\
    \ for managed hosts, and can be used to get the values for another managed host's\
    \ variables. It does not include the managed host's facts if they have not yet\
    \ been gathered for that host.\n\n**group_name** Lists all groups the current\
    \ managed host is in.\n\n**groups** Lists all groups and hosts in the inventory.\n\
    \n**inventory_hostname** Contains the name for the current managed host as configured\
    \ in the inventory. This may be different from the host name reported by various\
    \ reasons.\n\nThere are a number of \"magic variables\" as. For more information,\
    \ see https://docs.ansible/ansible/latest/user_guide/playbooks/variables.html#variable-precedence-where-shows-i-a-variable.\
    \ One way to get its value to yours is to use the **debug** module to report the\
    \ contents of the hostvars variable for a particular host:\n\n```\n[user@demo~$]\
