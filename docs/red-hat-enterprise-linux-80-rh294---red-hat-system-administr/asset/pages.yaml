  md: '# Introduction


    To set the system-wide language, run the command localctl set-locale LANG=locale,
    where locale is the appropriate SLANG from the "Language Codes Reference" table
    in this chapter. The change will take effect for users on their next login, and
    is stored in /etc/locale.conf.


    ```

    [root@host ~]# localctl set-locale LANG=fr-FR.utf8

    ```


    In GNOME, an administrative user can change this from Region & Language and clicking
    the Login Screen at the upper-right corner of the window. Changing the Language
    of the login screen will also adjust the system-wide default language setting
    stored in the /etc/locale.conf configuration file.


    Local text consoles are tty more limited in the fonts that they can display gnome-terminal
    and ssh sessions. For example, Japanese, Korean, and Chinese characters may not
    display as expected on a local text console. For this reason, it may make sense
    to use English or another language with a Latin character set for the system''s
    console.


    Likewise, local text consoles are more limited in the input methods they support,
    and this is managed separately from the graphical desktop environment. The available
    global input settings can be configured through localctl for both local text virtual
    consoles and the XI graphical environment. See the localctl(1), kbd(4), and vconsole.conf(5)
    man pages for more information.


    # LANGUAGE PACKS


    When using non-English languages, you may want to install additional "language
    packs" to provide additional translations, dictionaries, and so forth. To view
    the list of langpacks, run yum langavailable. To view the list of langpacks currently
    installed on the system, run yum langlist. To add an additional langpack to the
    system, run yum langinstall code, where code is the code in square brackets after
    the language name in the output of yum langavailable.


    > REFERENCES

    (7),localctl(1), kbd(4), locale.conf(5), vconsole.conf(5), unicode(7), utf-8(7),
    and yum-langpacks(8) man pages


    Conversions between the names of the graphical desktop environment''s X11 layouts
