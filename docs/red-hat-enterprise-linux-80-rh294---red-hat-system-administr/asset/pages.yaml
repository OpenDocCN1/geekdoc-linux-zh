  md: "# CHAPTER 8 | Simplifying Playbooks with Roles\n\n```\nhosts: remote.example.com\n\
    roles:\n  role: role1\n  role: role2\nvar1: val1\nvar2: val2\n```\n\nAnother equivalent\
    \ YAML syntax which you might see in this case:\n\n```\nhosts: remote.example.com\n\
    roles:\n  role: role1\n  { role:role2, var1:val1, var2:val2 }\n```\n\nThere are\
    \ situations where this is harder to read, even though it is compact.\n\n> IMPORTANT\n\
    Role variables set inline (role parameters), as in the preceding examples, have\
    \ very high precedence. They will override most other variables.\nBe very careful\
    \ not to rename the names of any role variables that you inline anywhere in your\
    \ play, since the values of the role variables will override inventory variables\
    \ and any play vars.\n\n# CONTROLLING ORDER OF EXECUTION\n\nFor each play in a\
    \ playbook, tasks execute as ordered in the tasks list. After all tasks handlers\
    \ are executed.\n\nWhen a role is added to a play, role tasks are added to the\
    \ beginning of the tasks list. If a second role is included in a play, its tasks\
    \ list is added after the first role.\n\nRole handlers are added to plays in the\
    \ same manner that role tasks are added to plays. Each play defines handlers.\
    \ Role handlers are added to the handlers list, followed by any handlers defined\
    \ in the handlers section of the play.\n\nIn scenarios, it may be necessary to\
    \ execute some tasks before the roles. To support such scenarios, plays can be\
    \ configured with a pre_tasks section. Any task list in this section executes\
    \ before any roles. If any tasks notify a handler, those handler execute before\
    \ the roles or normal tasks.\n\nPlays also support a post_tasks keyword. These\
    \ tasks execute after the play's normal tasks, and any handlers they notify, are\
    \ run.\n\nThe following play shows an example with pre_tasks, roles, tasks, post_tasks\
    \ and handlers. It is unusual that a play would contain all of these sections.\n\
    \n```\nname: Play to illustrate order of execution\nhosts: remote.example.com\n\
    pre_tasks:\n```\n\nRH294-RHEL8.0-en-1-20190531 295"
