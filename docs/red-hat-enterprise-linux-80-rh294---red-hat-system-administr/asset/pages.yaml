    # FINDING MODULES FOR TAS


    # Module Documentation


    The large number of modules packaged with Ansible provides many tools for common
    administrative tasks. Earlier in this course, we discussed the Ansible documentation
    website at http://docs.ansible.com. The Module Index on the website is an easy
    way to browse the list of modules shipped with Ansible. For example, modules for
    user and server management and modules for database administration can be found
    under Systems Modules and Database Modules.


    For each module, the Ansible documentation provides a summary of its functions
    and instructions on how each specific function can be invoked with the module.
    The documentation also provides useful examples that show you how to use each
    module and how to set your keywords in a task.


    You have already learned with the ansible-doc command to look up information installed
    on the local system. As a review, see a list of modules available on a control
    node, run the ansible-doc -1 command. This displays a list of module names and
    a synopsis of their functions.


    ```

    [student@workstation]$ ansible-doc -1

    a1_server             Manage Networks      devices server object.

    a10_server_axapi3       Manage Networks      devices

    a10_service_group      Manage Networks      devices service groups.

    a10_virtual_server     Manage Networks      devices virtual servers.


    ... output omitted.

    zfs_facts              Gather facts about ZFS datasets.

    znode                 Create, and update nodes using ZooKeeper

    zpool_facts            Gather facts about ZFS pools.

    zypper                Manage packages on SUSE and openSUSE

    zypper_repository      Add and remove Zipper repositories

    ```


    Use the ansible-doc [module name] command to display detailed documentation for
    a module. Like the Ansible documentation website, the command provides a synopsis
    of the module''s function, details of its various options, and examples. The following
    example show the documentation for the yum module.


