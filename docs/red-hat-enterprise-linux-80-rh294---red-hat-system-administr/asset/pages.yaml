  md: "# CHAPTER 10 | Automating Linux Administration Tasks\n\n```\nPLAY RECAP *********************************\
    \ server.lab.example.com : ok=4 changed=0 unreachable=0 failed=0\n```\n\n# Review\
    \ Alternative Modules to Manage Packages\n\nThe Yum Ansible module works on managed\
    \ hosts that are the Yum Package Manager. For other package managers, Ansible\
    \ usually provides a detailed module. For the dnf module packages operating on\
    \ operating systems such as Fedora using the DNF package manager. The apt module\
    \ package tool available on Debian or Ubuntu. The win_package module can install\
    \ software on Microsoft Windows systems.\n\nThe following playbook conditions\
    \ select the appropriate module in an environment of Red Hat Enterprise Linux\
    \ and Fedora systems.\n\n+   - name: Install the required packages on the web\
    \ servers\nhosts: webservers\ntasks:\n  - name: Install http on RHEL\n    yum:\n\
    \      name: httpd\n      state: present\n    when: \"ansible_distribution ==\
    \ 'RedHat'\"\n  - name: Install http on Fedora\ndnf:\n      name: httpd\n    \
    \  state: present\n    when: \"ansible_distribution == 'Fedora'\"\n\nAs an alternative,\
    \ the generic package module automatically detects and uses the package available\
    \ on the managed hosts. With the package module, you can rewrite the previous\
    \ playbook as follows.\n\n+   - name: Install the required packages on the web\
    \ servers\nhosts: webservers\ntasks:\n  - name: Install httpd\n    package:\n\
    \      name: httpd\n      state: present\n\nHowever, notice that the package module\
    \ does not support all the features that the more specialized modules provide.\
    \ Also, operating systems have different names for the packages they provide.\
    \ For example, the package that installs the Apache HTTP Server is http on Red\
    \ Hat Enterprise Linux and apache2 on Ubuntu. In that situation, you still need\
    \ a conditional for selecting the correct package name depending on the operating\
    \ system of the managed host.\n\n392 RH294-RI ICL.8.0-en-1-20190531"
