  md: 'CHAPTER 1 | Introducing Ansible


    # THE ANSIBLE WAY


    # Complexity Kills Productivity


    Simpler is better. Ansible is designed so that its tools are simple to use and
    automation is simple to write and read. You should take advantage of this to strive
    for simplification in how you create your automation.


    # Optimize For Readability


    The Ansible automation language is built around simple, declarative, text-based
    files that are easy for humans to read. Written properly, Ansible Playbooks can
    clearly document your workflow automation.


    # Think Declaratively


    Ansible is a desired-state engine. It approaches the problem of how to automate
    IT deployments by expressing them in terms of the state that you want your systems
    to be. Ansible''s goal is to put your systems into the desired state, only making
    changes that are necessary. Trying to treat Ansible like a scripting language
    is not the right approach.


    ![](img/c66fec31e9528c7da22e5fa5113dfa6e_21_0.png)


    Figure 1.3: Ansible provides complete automation


    # USE CASES


    Unlike some tools, Ansible combines and unites orchestration with configuration
    management, provisioning, and application deployment in one easy-to-use platform.


    Some use cases for Ansible include:'
