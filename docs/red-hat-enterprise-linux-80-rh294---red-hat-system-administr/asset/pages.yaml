  md: '# TROUBLESHOOTING PLAYBOOKS


    # OBJECTIVES


    After completing this section, you should be able to troubleshoot generic issues
    with a new playbook and repair them.


    # LOG FILES FOR ANSIBLE


    By default, Red Hat Ansible is not configured to log its output to any log file.
    It provides a built-in infrastructure that can be configured through the `log_path`
    parameter in the `default` section of `ansible.cfg` configuration file, or through
    the `$ANSIBLE_LOG_PATH` environment variable. If both are configured, Ansible
    stores output from both the `ansible` and `ansible-playbook` commands in the log
    file configured, either through the `ansible.cfg` configuration file or the `$ANSIBLE_LOG_PATH`
    environment variable.


    If you configure logrotate to manage files to `/var/log`, then Red Hat recommends
    that you configure logrotate to manage the Ansible files.


    # THE DEBUG MODULE


    The debug module provides insight into what is happening in the play. This module
    can display the value at a certain point in the play. This feature is key to debugging
    tasks that use variables to communicate with each other (for example, using the
    output of a task as the input to the following one).


    The following examples use the msg and var settings inside debug tasks. The first
    example displays the value at run time of the `ansible_facts[''memfree_mb'']`
    as part of a message printed to the output of `ansible-playbook`. The second example
    displays the value of the output.


    +   - name: Display the "output" variable

    debug:

    var: output

    verbosity: 2


    # MANAGING ERRORS


    There are several issues that can occur during a playbook run, mainly related
    to the syntax of either the playbook or any of the templates, or due to connectivity
    issues with the managed hosts (for example, an error in the name of the managed
    host in the inventory file). These errors are issued by the `ansible-playbook`
    command at execution time.'
  merge: -1
