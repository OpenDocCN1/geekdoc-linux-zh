    \ that specifies which roles are needed. This file acts as a dependency manifest\
    \ for the playbook project which enables plays to be developed and tested separately\
    \ from supporting roles.\n\nFor example, a simple **requirements.yml** to install\
    \ **geerlingguy.redis** might look like this:"
