  md: "# CHAPTER 10 | Automating Linux Administration Tasks\n\n+   - Sets the connection\
    \ type to ethernet.\nAutomatically starts the connection at boot. This is the\
    \ default value.\n- Restricts the connection to a device with MAC address.\n-\
    \ Configures the 172.25.250.40/24 IP address for the connection.\n- Configures\
    \ the external zone as the Firewall zone of connection.\n\nTo use the network\
    \ system role, you need to specify the role name under the roles clause in your\
    \ playbook as:\n\n```\n- name: NIC Configuration\nhosts: webservers\nvars:\n \
    \ network_connections:\n    name: ens4\n    type: ethernet\n    ip:\n      address:\n\
    \        - 172.25.250.30/24\nroles:\n  rhel-system-roles.network\n```\n\nYou can\
    \ specify variables for the network role with the vars clause, as in the previous\
    \ example, or create a YAML file with those under the group_vars or host_vars\
    \ directories, depending on your use case.\n\n# CONFIGURING NETWORKING WITH MODULES\n\
    \nAs an alternative to the network system role, Red Hat Ansible Engine includes\
    \ a collection of modules which support the networking configuration on a system.\
    \ The nmcli module supports the management of both network connections and devices.\
    \ This module supports the configuration of both teaming and bonding for network\
    \ interfaces, as well as IPv4 and IPv6 addressing.\n\nThe following table lists\
    \ some of the parameters for the nmcli module.\n\n| PARAMETER NAME | DESCRIPTION\
    \ |\n|---|---|n| conn_name | Configures the connection name. |\n| autoconnect\
    \ | Enables automatic connection activation on boot. |\n| dns4 | Configures DNS\
    \ servers for IPv4 (up to 3). |\n| gw4 | Configures the IPv4 gateway for the interface.\
    \ |\n| ifname | Interface to be bound to the connection. |\n| ip4 | IP address\
    \ (IPv4) |\n| state | Enables or disables the network interface. |\n| type | Type\
    \ of device or network connection. |\n\nThe following example configures a static\
    \ IP configuration for a network connection and device."
