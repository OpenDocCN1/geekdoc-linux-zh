  md: '# SELECTING HOSTS WITH HOST PATTERNS


    # OBJECTIVES


    After completing this section, you will be able to write sophisticated host patterns
    to efficiently select hosts for a play or ad hoc command.


    # REFERENCING INVENTORY HOSTS


    Host patterns are used to specify the hosts to target by a play or ad hoc command.
    In its simplest form, the name of a managed host or host group in the inventory
    is a host pattern that specifies that host or host group.


    You have already used host patterns in this course. In a play, the hosts directive
    specifies the managed hosts to run the play. For an ad hoc command, provide the
    host pattern as a command line argument to the **ansible** command.


    It is usually easier to control what a play targets by carefully using host patterns
    and having appropriate inventory groups, instead of setting complex conditionals
    on the play''s tasks. Therefore, it is important to have a robust understanding
    of host patterns.


    The following example inventory is used throughout this section to illustrate
    host patterns.


    ```

    [student@controlnode ~]$ cat myinventory

    web.example.com

    data.example.com


    [lab]

    lab1.example.com

    lab2.example.com


    [test]

    test1.example.com

    test2.example.com


    [datacenter1]

    lab1.example.com

    test1.example.com


    [datacenter2]

    lab2.example.com

    test2.example.com


    [datacenter:children]

    datacenter1

    datacenter2


    [new]

    192.168.2.1

    192.168.2.2

    ```'
  merge: -1
  pgno: 249
- img_proc: true
  md: "# CHAPTER 7 | Managing Large Projects\n\nTo demonstrate how host patterns are\
    \ resolved, you will execute an Ansible Playbook, **playbook.yml**, using different\
    \ host patterns to target different subsets of managed hosts from this inventory.\n\
    \n# Managed Hosts\n\nThe most basic host pattern is the name for a single managed\
    \ host listed in the inventory. This specifies that the host will be the only\
    \ one in the inventory that will be acted upon by the **ansible command**.\n\n\
    When the playbook runs, the first **Gathering Facts** task should run on all managed\
    \ hosts to match the host pattern. A failure during this task can cause the managed\
    \ host to be removed from the play.\n\nIf an IP address is listed explicitly in\
    \ the inventory, instead of a host name, then it can be used as a host pattern.\
    \ If the IP address is not listed in the inventory, you cannot use it to specify\
    \ the host if the IP address resolves to that host name in the DNS.\n\nThe following\
    \ example shows how a host pattern can be used to reference an IP address contained\
    \ in an inventory.\n\n```\n$[controlnode-$] cat playbook.yml\n-\nhosts: 192.168.2.1\n\
    \  output omitted...\n```\n\n```\n$[controlnode-$] ansible-playbook playbook.yml\n\
    ```\n\nPLAY [Test Host Patterns] *****************************************************\n\
    \nTASK [Gathering Facts] ************************************\nok: [192.168.2.1]\n\
    \n> NOTE\nOne problem with referring to managed hosts by IP address in the inventory\
    \ is that it can be hard to remember which IP address matches which host for your\
    \ plays and ad hoc commands. However, you may have to specify the host by IP address\
    \ for connection purposes if the host does not have a resolvable host name.\n\n\
    It is possible to point an alias at a particular IP address in your inventory\
    \ by setting the **ansible_host** variable. For example, you could have a host\
    \ in your inventory named **dummy.example**, and then direct connections using\
    \ that name to the IP address 192.168.2.1 by creating a **host_vars/dummy.example**\
    \ file containing the following host variable:\n\nansible_host: 192.168.2.1\n\n\
    # Specifying Hosts Using a Group\n\nYou have already used inventory groups as\
    \ host patterns. When a group name is used as a host pattern, it specifies that\
    \ Ansible will act on the hosts that are members of the group.\n\nRH294-RHEL8.0-en-1-20190531"
  merge: -1
