  md: "# CHAPTER 4 | Managing Variables and Facts\n\n```\nvars:\n  vault\n---\ninventory:\n\
    \  playbook.yml\n```\n\nIn this scenario, the advantage is that most variables\
    \ for demo.example.com can be placed in the vars file, but sensitive variables\
    \ can be kept secret by separating them in the vault file. Then the administrator\
    \ can use ansible-vault to encrypt the vault file, while leaving the vars as plain\
    \ text.\n\nThere is nothing special about the file names used in this example\
    \ the host_vars/demo.com directory. That directory contain more files, some encrypted\
    \ by Ansible Vault and some which are not.\n\nPlaybook variables (as opposed to\
    \ inventory variables) can also be protected by Ansible Vault. Sensitive playbook\
    \ variables can be placed in a separate file which is encrypted with Ansible Vault\
    \ and is included in the playbook through a vars_files directive. This can be\
    \ useful, because playbook variables take precedence over inventory variables.\n\
    \nIf you are using multiple vault passwords with your playbook, make sure that\
    \ each encrypted file is assigned a vault ID, and that you enter the matching\
    \ password with that vault ID when running the playbook. This ensures that the\
    \ correct password is selected first when decrypting the vault-encrypted file,\
    \ which is faster than forcing Ansible to try all the vault passwords you provided\
