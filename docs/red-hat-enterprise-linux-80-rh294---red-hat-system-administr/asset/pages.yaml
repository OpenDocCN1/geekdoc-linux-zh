  md: "# CHAPTER 10 | Automating Linux Administration Tasks\n\nYou can retrieve additional\
    \ information about the configuration for a network interface with the ansible_NIC\
    \ name filter for the setup module. For example, to retrieve the configuration\
    \ for the ens4 network interface, use the ansible_ens4 filter.\n\n```\n[user@controlNode\
    \ ~] ansible webservers -m setup \\\\\n> -a 'gather_subset=network interface=ansible_ens4'\
    \ \\\nhost.lab.example.com SUCCESS => {\n  \"ansible_facts\": {\n    \"ansible_ens4\"\
