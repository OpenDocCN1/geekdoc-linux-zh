  md: '# CHAPTER 2 | Deploying Ansible


    ran Ansible command, not remote_user. This can lead to confusion if the two users
    have deffer sudo privileges.


    If you want to make sure you connect to localhost using SSH like other managed
    hosts, one approach is to list it in your inventory. But this includes it in the
    all and ungrouped groups, which you may not want to do.


    Another approach is to change the protocol used to connect to localhost. The best
    way to do this is to set the ansible_connection host variable for localhost. To
    do this, in the directory from you run Ansible Commands, create a host_vars subdirectory.
    In that subdirectory, create a file named localhost, containing the line ansible_connection:
    smart. This ensures that smart (SSH) connection protocol is used instead of local.


    You can use this other way around well. If you have 127.0.0.1 listed in your inventory,
    by default you will connect to using smart. You can also create a host_vars/127.0.0.1
    file containing the line ansible_connection: local and it will use local installed.


    Host variables are covered in more detail later in the course.


    > NOTE You can also use group variables to change the connection type for an entire
    host group. This can be done by placing files with the same name as the group
    in a group_vars directory, and ensuring that those files contain settings for
    the connection variables.


    You might want all your Windows managed hosts to use the winrm protocol and port
    5986 for connections. To configure this, you could put all of your managed hosts
    in group windows, and then create a file named group_vars/windows containing the
    following lines:

    ```

    ansible_connection: winrm

    ansible_port: 5986

    ```


    # CONFIGURATION FILE COMMENTS


    There are two character comments allowed by Ansible configuration files: the hash
    (#) or the semicolon (;).


    The number sign at the start of a line comments out the entire line. It must not
    be on the same line with a directive.


    The semicolon character comments everything to the right of it on the line. It
    can be on the same line as a directive, so long as that directive is to its left.


    > REFERENCES ansible(1), ansible-config(1), ssh-keygen(1), and ssh-copy-id(1)
