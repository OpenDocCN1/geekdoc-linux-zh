- img_proc: true
  md: "# CHAPTER 8 | Simplifying Playbooks with Roles\n\n+   - Set SELINux Boolean\
    \ values\n\n+   - Set SELINux file contexts persistently\n\n+   - Set SELINux\
    \ user mappings\n\n# Calling the SELINux Role\n\nSometimes, the SELINux rule must\
    \ ensure the managed hosts are rebooted in order to completely apply its changes.\
    \ However, it does not ever reboot hosts itself. This is so that you can control\
    \ how the reboot is handled. But it means that it is a little more complicated\
    \ than usual to properly use this role in a play.\n\nThe way this works is that\
    \ the role will set a Boolean variable, selinux_reboot_required, to true if a\
    \ reboot is needed. You can use a block/rescue structure to recover from the failure,\
    \ by failing the play if that variable is not set to true or rebooting the managed\
    \ host and rebooting the role if it is true. The block in your play should look\
    \ like this:\n\n```\nname: Apply SELINux role\nblock:\n  include_role:\n    name:\
    \ rhel-system-roles.selinux\nrescue:\n  name: Check for failure for other reasons\
    \ than required reboot\n  fail:\n    when: not selinux_reboot_required\n  name:\
    \ Restart managed host\nreboot:\n  name: Reapply SELINux role to complete changes\n\
    \  include_role:\n    name: rhel-system-roles.selinux\n```\n\n# Configuring the\
    \ SELINux Role\n\nThe variables used to configure the rhel-system-roles.selinux\
    \ role are documented in the README.md. The following examples show some ways\
    \ to use this role.\n\nThe selinux_state variable sets the mode SELINux runs in.\
    \ It can be set to enforcing, permissive, or disabled. If it is not set, the mode\
    \ is not changed.\n\n```\nselinux_state: enforcing\n```\n\nThe selinux_booleans\
    \ variable takes a list of SELINux Boolean values to adjust. Each item in the\
    \ list is a hash/dictionary of variables: the name of the Boolean, the state (whether\
    \ it should be on or off), and whether the setting should be persistent across\
    \ reboots.\n\nThis example sets httpd_enable_homedirs to persistently:\n\n```\n\
    selinux_booleans:\n  name: 'httpd_enable_homedirs'\n  state: 'on'\n  persistent:\
    \ 'yes'\n```"
  merge: -1
  pgno: 319
- img_proc: true
  md: "# CHAPTER 8 | Simplifying Playbooks with Roles\n\nThe selinux_fcontext variable\
    \ takes a list of file contents to persistently set (or remove). It works much\
    \ like the `selinux fcontext` command.\n\nThe following example ensures the policy\
    \ has a rule to set the default SELinux type for all files under `/srv/www/httpd_sys_content_t`.\n\
    \n```\nselinux_fcontext:\n  - target: '/srv/www/(.*)'\n    setype: 'httpd_sys_content_t'\n\
    \    state: 'present'\n```\n\nThe selinux_restore_dirs variable specifies a list\
    \ of directories on which to run `restorecon`.\n\n```\nselinux_restore_dirs:\n\
    \  - /srv/www\n```\n\nThe selinux_ports variable takes a list of ports that should\
    \ have a specific SELinux type.\n\n```\nselinux_ports:\n  - ports: '82'\n    setype:\
    \ 'http_port_t'\n    proto: 'tcp'\n    state: 'present'\n```\n\nThere are other\
    \ variables and options for this role. See its `README.md` file for more information.\n\
    \n> REFERENCES\n**Red Hat Enterprise Linux (RHEL) System Roles**\nhttps://access.redhat.com/articles/3050101\n\
    \n**System Roles**\nhttps://linux-system-roles.github.io/"
