  md: "# Optimizing Multiple Package Installation\n\nTo operate on several packages,\
    \ the name keyword accepts a list. The following example shows a playbook that\
    \ installs three packages on servera.lab.example.com.\n\n```\nname: Install the\
    \ required packages on the web server\nhosts: servera.lab.example.com\ntasks:\n\
    \  name: Install the packages\n    yum:\n      name:\n      - httpd\n      - mod_ssl\n\
    \      - httpd-tools\n    state: present\n```\n\nWith this syntax, Ansible installs\
    \ the packages in a single Yum transaction. This is equivalent to running the\
    \ yum install httpd mod_ssl httpd-tools command.\n\nA commonly seen but less efficient\
    \ and slower version of this task is to use a loop.\n\n```\nname: Install the\
    \ required packages on the web server\nhosts: servera.lab.example.com\ntasks:\n\
    \  name: Install the packages\n    yum:\n      name: \"{{ item }}\"\n    state:\
    \ present\nloop:\n  - httpd\n  - mod_ssl\n  - httpd-tools\n```\n\nAvoid using\
    \ this method as it requires the module to perform three individual transactions,\
    \ one for each package.\n\n# Gathering Facts about Installed Packages\n\nThe package_facts\
    \ Ansible module collects the installed package details on managed hosts. It sets\
    \ the ansible_facts variable with the package details.\n\nThe following playbook\
    \ calls the package_facts module, the debug module to display the content of the\
    \ ansible_facts variable, and the debug module again to view the version of the\
    \ NetworkManager package.\n\n```\nname: Display installed packages\nhosts: servera.lab.example.com\n\
    tasks:\n  name: Gather info on installed packages\n    package_facts:\n      manager:\
    \ auto\n```"
