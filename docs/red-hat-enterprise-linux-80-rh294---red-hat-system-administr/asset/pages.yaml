  md: "# The cron module example:\n\n+   - cron:\n  name: \"Flush Bolt\"\n  user:\
    \ \"root\"\n  minute: 45\n  hour: 11\n  job: ./php/nut cache:clear\n\nThis play\
    \ uses a company's cache:clear immediately flushes Bolt cache, removing cached\
    \ files and directories of the CMS server every morning at 11:45.\n\nAnsible will\
    \ write the play to the crontab with the correct syntax as the user stated.\n\n\
    Checking the crontab will verify that it has been appended.\n\nSome commonly used\
    \ parameters for the cron module are:\n\n# Parameters\n\n| PARAMETER | OPTIONS\
    \ | COMMENTS |\n|---|---|--|\n| special_time | reboot, yearly, monthly, weekly;\
    \ daily, hourly | A set of reoccurring times. |\n| state | absent, present | If\
    \ set to present, it will create the command. Absent will remove it. |\n| cron_file\
    \ | Null | If you have large banks of servers to maintain them sometimes it is\
    \ better to have a pre-written crontab file. |\n| backup | yes, no | Backs up\
    \ the crontab file prior to being edited. |\n\n# MANAGING SERVICES WITH THE SYSTEMD\
    \ AND SERVICE MODULE.S\n\nFor managing services or reloading daemons, Ansible\
    \ has the systemd and the service modules. Service offers a basic set of options\
    \ to start, restart, enable. The systemd module offers more configuration options.\
    \ Systemd will allow you to do a daemon-reload where the service module will not.\n\
