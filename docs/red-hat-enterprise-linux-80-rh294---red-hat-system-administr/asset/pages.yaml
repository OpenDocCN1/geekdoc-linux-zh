    # Module Maintenance


    Ansible ships with a large number of modules that can be used for many tasks.
    The upstream community is very active, and these modules may be in different stages
    of development. The ansible-doc documentation for the module is expected to specify
    who maintains that module in the upstream Ansible community, and what its development
    status is. This is indicated in the METADATA section at the end of the output
    of ansible-doc for module.


    The status field records the development status of the module:'
