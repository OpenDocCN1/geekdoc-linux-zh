  md: "# Matching Multiple Hosts With Wildcards\n\nAnother method of accomplishing\
    \ the same thing as the all host pattern is to use the asterisk (*) wildcard character,\
    \ which matches any string. If the host pattern is just a quoted asterisk, then\
    \ all hosts in the inventory omitted.\n\n```\n[student@controlnode ~]$ cat playbook.yml\n\
    ---\nhosts: '*'\n  output omitted....\n[student@controlnode ~]$ ansible-playbook\
    \ playbook.yml\n```\n\nPLAY [Test Host Patterns]\n\n```\nTASK [Gathering Facts]\n\
    ok: [labhost2.example.com]\nok: [test2.example.com]\nok: [web.example.com]\nok:\
    \ [data.example.com]\nok: [labhost1.example.com]\nok: [192.168.2.1]\nok: [test1.example.com]\n\
    ok: [192.168.2.1]\n```\n\n> IMPORTANT\nSome characters that are used in host patterns\
    \ also have meaning for the shell. This can be a problem when using host patterns\
    \ to run ad hoc commands from the command line with ansible. It is a recommended\
    \ practice to enclose host patterns used on the command line to protect them from\
    \ unwanted shell expansion.\n\nLikewise, if you are using any special wildcards\
    \ or list characters in an Ansible Playbook, you must put your host pattern in\
    \ single quotes to ensure it is parsed correctly.\n---\nhosts: '!test1.example.com,development'\n\
    \nThe asterisk character can also be used to match any managed hosts or groups\
    \ that contain a particular substring.\nFor example, the following wildcard host\
    \ pattern matches all inventory names that end in .example.com.\n\n```\n[student@controlnode\
    \ ~]$ cat playbook.yml\n---\nhosts: '*.example.com'\n  output omitted....\n[student@controlnode\
    \ ~]$ ansible-playbook playbook.yml\n```\n\nPLAY [Test Host Patterns]"
  merge: -1
  pgno: 252
