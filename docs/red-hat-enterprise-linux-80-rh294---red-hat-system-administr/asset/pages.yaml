  md: '# SUMMARY


    In this chapter, you learned:


    +   - Any system upon which Ansible is installed and which has access to the required
    configuration files and playbooks to manage remote systems (managed hosts) is
    called a control node.

    - Managed hosts are defined in the inventory. Host patterns are used to reference
    managed hosts defined in an inventory.

    - Inventories can be static files or dynamically generated by a program from an
    external source, such as a directory service or cloud management system.

    - Ansible looks for its configuration file in a number of places in order of precedence.
    The first configuration file found is used; all others are ignored.

    - The ansible command is used to perform ad hoc commands on managed hosts.

    - Ad hoc commands determine the operation to perform through the use of modules
    and their arguments, and can make use of Ansible''s privilege escalation features.'
