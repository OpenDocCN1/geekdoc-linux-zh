    \ / this is something / let’s do this”\n  - http://addxorrol.blogspot.com/2020/03/before-you-ship-security-mitigation.html\n\
    \  - With dearth of public exploits, developers only have have to convince each\
    \ other\n  - Little to no independent/expert evaluation (outside of Jann Horn)"
  merge: -1
  pgno: 32
- img_proc: true
  md: "# # Recommendations\n\n+   * Improve the quality of benchmarks for security\
    \ features before inclusion into the kernel\n     KAISER once claimed a 0.1% performance\
    \ hit\n* 1% performance hit was claimed for STACKLEAK (not by us)\n* Retpolines\
    \ ended up having a large impact on network throughput\n* Benchmarks mostly appear\
    \ to involve kernel compilation, a task that only spends a tiny percentage of\
    \ its time in the kernel, diluting any performance hit that exists\n* Ideally,\
    \ a suite of benchmarks should be performed on a farm of consumer/server CPUs\
    \ of at least the past 5 years"
  merge: -1
  pgno: 33
- img_proc: true
  md: "# # Recommendations\n\n+   - Development organization still focused on patches\
    \ and mailing lists\n  - In many instances (including some of the examples provided)\
    \ information was available online pointing to a bug or a proper fix\n  - Current\
    \ process involves essentially ignoring that external information until it falls\
    \ in line with the standard Linux development process\n  - Maintainers exist to\
    \ corral patches into the upstream kernel – what about corralling information\
    \ into a centralized location to improve the quality of the kernel?\n    - Example:\
    \ a group in charge of ensuring stable kernels apply applicable security fixes\n\
    \    - Problem: the public didn’t sign up for the behind-closed-doors decision\
    \ to extend stable kernel support from 2 years to 6 years for the benefit of phone\
    \ vendors, certainly not for free"
  merge: -1
  pgno: 34
- img_proc: true
  md: "# # Recommendations\n\n+   - Fail fast, iterate faster\n  - A lot of review\
    \ for security patches is trivial nitpicking and can-kicking\n  - Appears to be\
    \ a different set of standards for merging non-security features vs even optional\
    \ security code\n  - Is having the KASLR PIE/S.A.R.A. code dragged out over 3\
    \ years an an effective use of developers’ time?\n  - When an abysmal patch is\
    \ presented that has no chance of being merged in any form, is it really helpful\
    \ to lead the submitter on by suggesting trivial nitpicks and typo fixes and asking\
    \ them to put out a v2/v3/v20?\n\nThe time to decide on an “unprivileged” sysctl\
    \ for an easily abused new feature is when the feature is first introduced, not\
    \ years after the necessity is obvious via multiple exploits (unpriv users, userfaultfd,\
    \ etc)"
  merge: -1
  pgno: 35
