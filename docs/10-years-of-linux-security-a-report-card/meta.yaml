    \ being listed on the CII website\n    * No reply, OpenSSH and OpenSSL still falsely\
    \ listed as currently-supported projects today\n\n+   * Actually practice what\
    \ you preach\n\n# ## Millions of Dollars of Shared Vigilance\n\nThe stakes have\
    \ never been higher for open-source software security. With millions of people\
    \ around the world relying on open source software — and vulnerabilities Heartbleed\
    \ putting everyone at risk — it's time to change the way we support, protect,\
    \ and fortify open software. With our Core Infrastructure Initiative, we're taking\
    \ a collaborative, pre-emptive approach for strengthening cyber security. Many\
