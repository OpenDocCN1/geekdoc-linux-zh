- md: "\n# 10 Years of Linux Security\nA Report Card\n\nBradley Spengler\nOpen Source\
    \ Security, Inc.\n2020 Linux Security Summit NA\n\n## Outline\n\n- Timeline\n\
    - KSPP\n- XLTS\n- Syzkaller\n- Exploitation Trends\n- Recommendations\n\n## Timeline\n\
    \n- Not an exhaustive timeline\n- Primarily selected from changes that rose to\
    \ the level of being mentioned on kernelnewbies.org\n- Won't include things that\
    \ have a relation to security in some instances (e.g. ramp-up of KUNIT/selftests)\n\
    - X86-specific\n\n- In fact, the ARM64 and PowerPC maintainers are landing significant\
    \ security functionality recently\n\n## Timeline\n\n- August 2010 – “Linux Security\
    \ in 10 Years” presented at Linux Security Summit\n- Mentioned little mainline\
    \ attention to kernel self-protection\n- 2009/2010 saw a large influx of published\
    \ kernel exploits, many by me with techniques still in use today\n- Recommended:\n\
    \  - Removing RWX from the kernel, eliminating information leaks, protecting sensitive\
    \ kernel data (function pointers, IDT/GDT, etc)\n  - Protecting against invalid\
    \ userland memory accesses, refcount overflows, overflows of allocation sizes\n\
    \  - Implementing CFI, preparing for data-only attacks\n\n## Timeline\n\n- June\
    \ 2011 – kernel-hardening mailing list created\n  - Helped track GSoC project\
    \ for Vasily Kulikov\n    - Port of Openwall’s /proc restrictions via a mount-time\
    \ 'hidepid'\n    - Polkit/dbus-broker/etc refusing to support it:\n      - https://github.com/bus1/dbus-broker/issues/207\n\
    \      - https://github.com/systemd/systemd/issues/12955\n    - Currently being\
    \ re-implemented as a per-ns mount setting\n  - Unprivileged ping sockets\n  \
    \  - Unfortunately, introduced some security flaws of its own\n      - https://www.openwall.com/lists/oss-security/2017/03/25/1\n\
    - During GSoC (June to August 2011), averaged 173 posts per month\n  - Dropped\
    \ to 131 in Sept, and 8 in Oct\n  - Nov 2011 - Nov 2015, average monthly post\
    \ count of 24, median of 3, 12 posts total in 2014\n\n## Timeline\n\n- July 2011\
    \ (v3.0) – Supervisor Mode Execution Prevention (SMEP) support added\n- Not usable\
    \ until Ivy Bridge shipped in Q2 2012\n- May 2012 (v3.4) – Yama LSM introduced\n\
    \  - Implemented ptrace restrictions present in grsecurity\n  - Originally manually\
    \ stacked with other LSMs\n- July 2012 (v3.5) – BPF-based seccomp introduced\n\
    \  - Adopted early on by systemd and Chromium\n- September 2012 (v3.6) – symlink/hardlink\
    \ restrictions introduced\n  - Adapted from functionality first implemented for\
    \ Linux 2.0.22 by Andrew Tridgeell in 1996, reimplemented shortly after Openwall,\
    \ and later by grsecurity\n  - http://lkml.iu.edu/hypermail/linux/kernel/9610.2/0086.html\n\
    -- \"Tightening security: not for the impatient\": https://lwn.net/Articles/503660/\n\
    - Addresses common cases of /tmp race vulnerabilities\n\n## Timeline\n\n- December\
    \ 2012 (v3.7) – Supervisor Mode Access Prevention (SMAP) support added\n  - Not\
    \ usable until Broadwell shipped in Q4 2014\n- February 2013 (v3.8) – Unprivileged\
    \ User Dataspace support added\n  - Patch to allow unprivileged users to create\
    \ user namespaces was written Nov 2011, merged a year later\n  - Greatly increased\
    \ kernel attack surface, exposed many interfaces that previously saw little security\
    \ scrutiny\n  - Removal of privilege check wasn’t contingent on any analysis of\
    \ that attack surface, only on completion of the user namespaces work\n- September\
    \ 2013 (v3.11) – O_TMPFILE support added\n  - Race-free temporary files, requiring\
    \ application support\n\n## Timeline\n\n- March 2014 (v3.14) – Kernel Address\
    \ Space Layout Randomization (KASLR) introduced\n- After publication of “KASLR:\
    \ An Exercise in Cargo Cult Security” in March 2013:\n  https://grsecurity.net/kaslr_an_exercise_in_cargo_cult_security\n\
    - Large developer time sink, overstated security claims, defeated by single information\
    \ leaks/generic attacks\n- As went went unnoticed until April 18 2020, trivially\
    \ defeated by coredumps also\n- October 2014 (v3.17) – Signed kexec kernel support\n\
    - December 2014 (v3.18) – eBPF added\n- In January 2016 (v4.4) – Unprivileged\
    \ access permitted\n\n## Timeline\n\n- April 2015 (v4.0) – Live patching and KASAN\
    \ support\n- August 2015 – Live patching added (grsecurity-style)\n- November\
    \ 2015 (v4.3) – userfaultfd added\n- November 2015 – KSPP announced\n- November\
    \ 2015 – grsecurity-style patches\n- November 2015 – grsecurity-style\n- April\
    \ 2015 – 2015\n  - https://www.openwall.com/lists/oss-security/2017/03/1\n\n##\
    \ Timeline\n\n- March 2016 (v4.5) – UBSAN support\n- March 2016 (v4.5) – memory\
    \ accounting added\n- May 2016 (v4.6) – Memory Keys (PKEYs)\n- July 2016 (v4.7)\
    \ – Slab randomization\n- July 2016 (v4.7) – KSP patches\n- October 2016 (v4.8)\
    \ – PAX_USERCOPY (slab whitelisting)\n- December 2016 (v4.9) – VMAP_STACK\n\n\
    ## Timeline\n\n- April 2017 (v4.11) – STATIC_USERHELPER\n- July 2017 (v4.12) –\
    \ LSM structures read-only\n- September 2017 (v4.13) – REFCOUNT_FULL, FORTIFY_SOURCE\n\
    - November 2017 (v4.14) – Sane stack limits enforced\n\n## Timeline\n\n- January\
    \ 2018 (v4.15) – KPTI and Retpolines\n- April 2018 (v4.16) – PAX_USERCOPY\n- August\
    \ 2018 (v4.18) – Unprivileged mount\n- October 2018 (v4.19) – L1TF fixes, FIFO\
    \ protection\n- May 2019 (v5.1) – LSM stacking\n"
  mdcn: "\n\n# Linux 安全 10 年\n报告单\n\nBradley Spengler\nOpen Source Security, Inc.\n\
    2020 年 Linux 安全峰会 (北美)\n\n## 大纲\n\n- 时间线\n- KSPP (内核安全保护项目)\n- XLTS (长期支持内核版本)\n\
    - Syzkaller\n- 攻击趋势\n- 建议\n\n## 时间线\n\n- 并非详尽的时间线\n- 主要从在 kernelnewbies.org 上被提及的变更中选出\n\
    - 某些情况下不包含与安全相关的内容（例如 KUNIT/自单元测试的启动）\n- 仅限 X86 架构\n\n- 事实上，ARM64 和 PowerPC 的维护者近期也引入了重大的安全功能\n\
    \n## 时间线\n\n- 2010 年 8 月 – 在 Linux 安全峰会上发表了《未来 10 年的 Linux 安全》\n- 提到主线对内核自我保护的关注较少\n\
    - 2009/2010 年间，内核漏洞大量发布，其中许多由我编写，其技术至今仍在使用\n- 建议：\n  - 从内核中移除 RWX 权限，消除信息泄露，保护敏感内核数据（函数指针、IDT/GDT\
    \ 等）\n  - 防止无效的用户态内存访问、引用计数溢出、分配大小溢出\n  - 实现 CFI（控制流完整性），为纯数据攻击做准备\n\n## 时间线\n\
    \n- 2011 年 6 月 – 创建了内核加固邮件列表 (kernel-hardening)\n  - 帮助了 Vasily Kulikov 的 GSoC\
    \ 项目\n    - 将 Openwall 的 /proc 限制移植到通过挂载时的 'hidepid' 实现\n    - Polkit/dbus-broker/等拒绝支持：\n\
    \      - https://github.com/bus1/dbus-broker/issues/207\n      - https://github.com/systemd/systemd/issues/12955\n\
    \    - 目前正在重新实现为每个命名空间（per-ns）的挂载设置\n  - 无权限 ping 套接字 (ping sockets)\n    - 遗憾的是，它也引入了一些安全漏洞\n\
    \      - https://www.openwall.com/lists/oss-security/2017/03/25/1\n- 在 GSoC 期间（2011\
    \ 年 6 月至 8 月），平均每月 173 条\n  - 9 月降至 131 条，10 月降至 8 条\n  - 2011 年 11 月至 2015 年\
    \ 11 月，平均每月帖数为 24，中位数为 3，2014 年共计 12 条\n\n## 时间线\n\n- 2011 年 7 月 (v3.0) – 增加了内核模式执行保护\
    \ (SMEP) 支持\n- 直到 2012 年第二季度 Ivy Bridge 发布后才可用\n- 2012 年 5 月 (v3.4) – 引入了 Yama\
    \ LSM\n  - 实现了 grsecurity 中存在的 ptrace 限制\n  - 最初与其他 LSM 手动堆叠\n- 2012 年 7 月 (v3.5)\
    \ – 引入了基于 BPF 的 seccomp\n  - 早期被 systemd 和 Chromium 采用\n- 2012 年 9 月 (v3.6) –\
    \ 引入了符号链接/硬链接限制\n  - 适配自 Andrew Tridgeell 在 1996 年为 Linux 2.0.22 实现的功能，随后在 Openwall\
    \ 之后重新实现，之后又由 grsecurity 实现\n  - http://lkml.iu.edu/hypermail/linux/kernel/9610.2/0086.html\n\
    -- “加强安全：不是给缺乏耐心的人准备的”: https://lwn.net/Articles/503660/\n- 解决了常见的 /tmp 竞态漏洞\n\
    \n## 时间线\n\n- 2012 年 12 月 (v3.7) – 增加了内核模式访问保护 (SMAP) 支持\n  - 直到 2014 年第四季度 Broadwell\
    \ 发布后才可用\n- 2013 年 2 月 (v3.8) – 增加了无权限用户空间 (Unprivileged User Dataspace) 支持\n\
    \  - 2011 年 11 月编写了允许无权限用户创建用户命名空间的补丁，一年后合并\n  - 大大增加了内核攻击面，暴露了许多此前很少受安全审查的接口\n\
    \  - 移除权限检查并不取决于对该攻击面的任何分析，仅取决于用户命名空间工作的完成\n- 2013 年 9 月 (v3.11) – 增加了 O_TMPFILE\
    \ 支持\n  - 无竞态的临时文件，需要应用程序支持\n\n## 时间线\n\n- 2014 年 3 月 (v3.14) – 引入了内核地址空间布局随机化\
    \ (KASLR)\n- 在 2013 年 3 月发表《KASLR：一次信条式的安全练习》后：\n  https://grsecurity.net/kaslr_an_exercise_in_cargo_cult_security\n\
    - 耗费了大量开发时间，安全声称过大，被单一信息泄露/通用攻击击败\n- 直到 2020 年 4 月 18 日才被注意到，同样轻易被核心转储 (coredumps)\
    \ 破解\n- 2014 年 10 月 (v3.17) – 增加了签名的 kexec 内核支持\n- 2014 年 12 月 (v3.18) – 增加了 eBPF\n\
    - 2016 年 1 月 (v4.4) – 允许无权限访问\n\n## 时间线\n\n- 2015 年 4 月 (v4.0) – 热补丁 (Live patching)\
    \ 和 KASAN 支持\n- 2015 年 8 月 – 增加了热补丁 (grsecurity 风格)\n- 2015 年 11 月 (v4.3) – 增加了\
    \ userfaultfd\n- 2015 年 11 月 – 宣布 KSPP\n- 2015 年 11 月 – grsecurity 风格补丁\n- 2015\
    \ 年 11 月 – grsecurity 风格\n- 2015 年 4 月 – 2015\n  https://www.openwall.com/lists/oss-security/2017/03/1\n\
    \n## 时间线\n\n- 2016 年 3 月 (v4.5) – UBSAN 支持\n- 2016 年 3 月 (v4.5) – 增加了内存计数\n- 2016\
    \ 年 5 月 (v4.6) – 内存密钥 (PKEYs)\n- 2016 年 7 月 (v4.7) – Slab 随机化\n- 2016 年 7 月 (v4.7)\
    \ – KSP 补丁\n- 2016 年 10 月 (v4.8) – PAX_USERCOPY (slab 白名单)\n- 2016 年 12 月 (v4.9)\
    \ – VMAP_STACK\n\n## 时间线\n\n- 2017 年 4 月 (v4.11) – STATIC_USERHELPER\n- 2017 年\
    \ 7 月 (v4.12) – LSM 结构只读\n- 2017 年 9 月 (v4.13) – REFCOUNT_FULL, FORTIFY_SOURCE\n\
    - 2017 年 11 月 (v4.14) – 强制执行合理的栈限制\n\n## 时间线\n\n- 2018 年 1 月 (v4.15) – KPTI 和\
    \ Retpolines\n- 2018 年 4 月 (v4.16) – PAX_USERCOPY\n- 2018 年 8 月 (v4.18) – 无权限挂载\n\
    - 2018 年 10 月 (v4.19) – L1TF 修复，FIFO 保护\n- 2019 年 5 月 (v5.1) – LSM 堆叠\n\n"
