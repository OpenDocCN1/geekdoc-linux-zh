    +   - Not even the 4.4 Android kernel page will help, that hasn''t been updated
    in 460+ days


    +   - What the public thinks is happening in terms of support for these kernels
    simply doesn''t match reality'
- md: "\n## XLTS\n\nOur observations from having an independent stable backport process:\n\
    \n- As our final 4.4 patch, had at least 1250 security-relevant fixes missing\
    \ in the upstream 4.4 LTS\n- https://twitter.com/grsecurity/status/12435236055264285696\n\
    - AUTOSEL is getting better at spotting security fixes that miss the proper tags\
    \ that previously only we were backporting\n  - To see the full benefits, however,\
    \ number of people involved in backporting has to increase, otherwise they simply\
    \ get dropped at the –stable mailing list level\n  - The above situation doesn't\
    \ appear to have noticeably improved\n  - https://lwn.net/Articles/805473/ : Dan\
    \ Carpenter - \"Everyone is over worked.\"\n\n- Patches selected by AUTOSEL could\
    \ more review, however, to make sure it's proper to apply them to older kernels\
    \ and whether they need adjustments regardless of whether they cherry-pick cleanly\n\
    \  - https://www.spinics.net/lists/bpf/msg11641.html\n  - Was exploited as part\
    \ of ZDI's pwn2own\n\n## Syzkaller\n\n- In the past 10 years, the adoption of\
    \ syzkaller has had possibly the largest impact on upstream kernel development\n\
    \n- Developers notified when an issue in their code is found\n\n- Has integrated\
    \ well with the existing development process\n\n- Constantly improving, integrating\
    \ new debugging/testing features\n\n- KCOV_ENABLE_COMPARISONS\n\n- Helps reach\
    \ more code paths (and more quickly)\n\n- KASAN\n\n- Detects UAFs and other OOB\
    \ memory accesses\n\n- KMSAN\n\n- Detects uninitialized memory accesses\n\n- KCSAN\n\
    \n- Detects concurrency issues\n\n## Syzkaller\n\n- A bit of a double-edged sword\n\
    \  - Custom syzkaller instances can find vulnerabilities syzkaller.appspot.com\
    \ does not\n  - Rapid pace of kernel development means there is always a plethora\
    \ of unfixed issues\n    - Particularly when syzkaller reaches new areas of the\
    \ kernel (USB, etc)\n    - https://twitter.com/dvyukov/status/1248241187854696450\n\
