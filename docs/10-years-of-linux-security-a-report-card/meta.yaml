    \ 的针对更新补丁的回复\n  - 0.3% 的针对重发补丁的回复\n  - 2.7% 因为 `get_maintainer.pl` 涉及 KSPP 列表\n\
    \  - 8.5% 为所有其他安全讨论\n\n## KSPP\n\n占总邮件百分比名前列贡献者：\n\n| 邮箱 | 百比 |\n| :--- | :---\
    \ |\n| keescook@chromium.org | 15.05 |\n| thgarnie@google.com | 3.44 |\n| ard.biesheuvel@linaro.org\
