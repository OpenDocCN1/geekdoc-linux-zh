  - '[PAGE 3]


    # # Timeline


    +   - August 2010 – “Linux Security in 10 Years” presented at Linux Security Summit


    +   - Mentioned little mainline attention to kernel self-protection


    +   - 2009/2010 saw a large influx of published kernel exploits, many by me with
    techniques still in use today


    +   - Recommended:


    +   - Removing RWX from the kernel, eliminating information leaks, protecting
    sensitive kernel data (function pointers, IDT/GDT, etc)


    +   - Protecting against invalid userland memory accesses, refcount overflows,
    overflows of allocation sizes


    +   - Implementing CFI, preparing for data-only attacks'
  - "[PAGE 4]\n\n# Timeline\n\n+   * June 2011 – kernel-hardening mailing list created\n\
    \  * Helped track GSoC project for Vasily Kulikov\n    * Port of Openwall’s /proc\
    \ restrictions via a mount-time 'hidepid'\n    * Polkit/dbus-broker/etc refusing\
    \ to support it:\n      * https://github.com/bus1/dbus-broker/issues/207\n   \
    \   * https://github.com/systemd/systemd/issues/12955\n    * Currently being re-implemented\
    \ as a per-ns mount setting\n  * Unprivileged ping sockets\n    * Unfortunately,\
    \ introduced some security flaws of its own\n      * https://www.openwall.com/lists/oss-security/2017/03/25/1\n\
    * During GSoC (June to August 2011), averaged 173 posts per month\n  * Dropped\
    \ to 131 in Sept, and 8 in Oct\n  * Nov 2011 - Nov 2015, average monthly post\
    \ count of 24, median of 3, 12 posts total in 2014"
  - '[PAGE 5]


    # Timeline


    +   July 2011 (v3.0) – Supervisor Mode Execution Prevention (SMEP) support added


    +   - Not usable until Ivy Bridge shipped in Q2 2012


    +   May 2012 (v3.4) – Yama LSM introduced


    +   - Implemented ptrace restrictions present in grsecurity


    +   - Originally manually stacked with other LSMs


    +   July 2012 (v3.5) – BPF-based seccomp introduced


    +   - Adopted early on by systemd and Chromium


    +   September 2012 (v3.6) – symlink/hardlink restrictions introduced


    +   - Adapted from functionality first implemented for Linux 2.0.22 by Andrew
    Tridgeell in 1996, reimplemented shortly after Openwall, and later by grsecurity


    +   [http://lkml.iu.edu/hypermail/linux/kernel/9610.2/0086.html](http://lkml.iu.edu/hypermail/linux/kernel/9610.2/0086.html)


    +   - "Tightening security: not for the impatient": [https://lwn.net/Articles/503660/](https://lwn.net/Articles/503660/)


    +   - Addresses common cases of /tmp race vulnerabilities'
  - "[PAGE 6]\n\n# Timeline\n\n+   - December 2012 (v3.7) – Supervisor Mode Access\
    \ Prevention (SMAP) support added\n  - Not usable until Broadwell shipped in Q4\
    \ 2014\n- February 2013 (v3.8) – Unprivileged User Dataspace support added\n \
    \ - Patch to allow unprivileged users to create user namespaces was written Nov\
    \ 2011, merged a year later\n  - Greatly increased kernel attack surface, exposed\
    \ many interfaces that previously saw little security scrutiny\n  - Removal of\
    \ privilege check wasn’t contingent on any analysis of that attack surface, only\
    \ on completion of the user namespaces work\n- September 2013 (v3.11) – O_TMPFILE\
    \ support added\n  - Race-free temporary files, requiring application support"
  - '[PAGE 7]


    # Timeline


    +   - March 2014 (v3.14) – Kernel Address Space Layout Randomization (KASLR) introduced


    +   - After publication of “KASLR: An Exercise in Cargo Cult Security” in March
    2013:

    https://grsecurity.net/kaslr_an_exercise_in_cargo_cult_security


    +   - Large developer time sink, overstated security claims, defeated by single
    information leaks/generic attacks


    +   - As went went unnoticed until April 18 2020, trivially defeated by coredumps
    also


    +   - October 2014 (v3.17) – Signed kexec kernel support added


    +   - December 2014 (v3.18) – bpf syscall added for direct eBPF use


    +   - In January 2016 (v4.4), unprivileged access became permitted


    +   - Frequent source of vulnerabilities due to churn, complexity, improper validation
    and complexity of validation'
  - '[PAGE 8]


    # Timeline


    +   - April 2015 (v4.0) – Live patching and KASAN support added


    +   - Live patching already offered by various distributions at the time, e.g.
    ksplice


    +   - August 26 2015 – Grseurity stops making its stable patches publicly available


    +   - November 2015 (v4.3) – userfaultfd() merged


    +   - (Ab)used by most Project Zero Linux kernel exploits


    +   - November 5 2015 – “The Kernel of the Argument” Washington Post article published


    +   - Coincidentally, also on November 5 2015 – KSPP announced on kernel-hardening
    mailing list


    +   - “I’m organizing a community of people to work on the various kernel self-protection
    technologies (most of which are found in PaX and Grsecurity)”


    +   - “Between the companies that recognize the critical nature of this work,
    and with Linux Foundation''s Core Infrastructure Initiative happy to start funding
    specific work in this area, I think we can really make a dent.”


    +   https://www.openwall.com/lists/kernel-hardening/2015/11/05/1'
  - '[PAGE 9]


    # Timeline


    +   - March 2016 (v4.5) - UBSAN support added


    +   - Largely unused due to large amount of benign reports, barrier to entry


    +   - March 2016 (v4.5) - Kernel memory accounting switch to whitelisting


    +   - Previously, allocations that shouldn''t be accounteded to a memory control
    needed a special flag


    +   - After "memcg: only account kmmem allocations marked as __GFP_ACCOUNT", only
    explicitly marked allocations are accounteded


    +   - Causes continued confusion, lack of knowledge of the change results in exaggerated
    isolation promises


    +   https://twitter.com/dvyukov/status/10736278723266088193


    +   - May 2016 (v4.6) - Initial Memory Protection Keys support added


    +   - Not usable until Skylake-server shipped in Q2 2017


    +   - Interface redesigned in December 2016 for v4.9'
  - "[PAGE 10]\n\n# Timeline\n\n+   - July 2016 (v4.7) – Slab freelist randomization\
    \ added\n\n+   - October 2016 (v4.8) – weakened form of PAX_USERCOPY and GCC plugin\
    \ support added\n    - Plugin support added by Emese Revfy as part of CII funding\n\
    \n+   - December 2016 (v4.9) – VMAP_STACK merged\n    - Weakened form of GRKERNSEC_KSTACKOVERFLOW,\
    \ caused DoS or device malfunction in dozens of instances\n\n+   - April 26 2017\
    \ – Grsecurity stops making its test patches publicly available\n\n+   - April\
    \ 2017 (v4.11) – PAX_STRUCTLEAK plugin and STATIC_USERMODEHELPER option added\n\
    \    - STATIC_USERMODEHELPER inspired by auto-enabled grsecurity feature that\
    \ doesn't require userland adjustments"
  - "[PAGE 11]\n\n# Timeline\n\n+   - July 2017 (v4.12) – Basic support added for\
    \ making LSM hook structures read-only when runtime SELinux disabling disallowed\n\
    \n+   - September 2017 (v4.13) – REFCOUNT_FULL added, FORTIFY_SOURCE support added\
    \ for some kernel string routines\n  - FORTIFY_SOURCE follows earlier work by\
    \ grsecurity in 2009 that was dropped as it didn’t have sufficient coverage and\
    \ added overhead for perfectly normal uses\n  - Even earlier work in 2005 by Arjan\
    \ van de Ven\n  - REFCOUNT_FULL is a slower, opt-in reimplementation of PAX_REFCOUNT\n\
    \  - Very recent rewrite provides performance closer to PAX_REFCOUNT, but coverage\
    \ remains much lower\n\n+   - November 2017 (v4.14) – Sane stack limits enforced\
    \ on execution of privileged binaries\n  - 7 reviewers, but still trivially bypassed:\
    \ https://grsecurity.net/~spender/sorry_kees.c"
  - "[PAGE 12]\n\n# Timeline\n\n+   * January 2018 (v4.15) - KPTI and Retpolines introduced\
    \ to address Meltdown/Spectre v2\n  * PTI initially only supported for x64, 32-bit\
    \ support wasn't added until October 2018 in v4.19\n* April 2018 (v4.16) - Additional\
    \ bits of PAX_USERCOPY (slab whitelisting)\n* August 2018 (v4.18) - Unprivileged\
    \ mount (within container) support added\n* October 2018 (v4.19) - L1TF fixes\
    \ and protection against attacker-controlled FIFOs/files in /tmp added\n  * FIFO\
    \ protection adapted from ancient Openwall (and later, grsecurity) to feature\n\
    * May 2019 (v5.1) - LSM stacking\n  * Nearly 20 years of missing LSM-based innovations\
    \ because this functionality wasn't available"
- md: "\n## Timeline\n\n- July 2019 (v5.2) – Microarchitectural Data Sampling (MDS)\
    \ fixes and reshuffling of existing hardening options out of “Kernel Debugging”\
    \ area and into their own “Kernel Hardening” area\n- November 2019 (v5.4) – Lockdown\
    \ mode added\n  - 29-patch series went through 40 published revisions by Matthew\
    \ Garrett, David Howells, and others\n  - https://lkml.org/lkml/2019/8/19/1190\n\
    - Functionality already present in distros (and grsecurity) for many years\n \
    \ - “Code I wrote 7 years ago is finally merged” https://twitter.com/mjg59/status/1178167356029169664\n\
    - January 2020 (v5.5) – Finer-grained ‘perf’ permission controls added\n\n## KSPP\n\
    \n- Kernel-hardening mailing list statistics\n  - 3638 mails in 2016\n  - 5202\
    \ mails in 2017\n  - 3759 mails in 2018\n  - 2727 mails in 2019\n  - 25% new patches\
    \ submitted to the list\n  - 29% updated patches submitted to the list\n  - .5%\
    \ resent patches\n  - 19% replies to new patches\n  - 13.5% replies to updated\
    \ patches\n  - .3% replies to resent patches\n  - 2.7% involved the KSPP list\
    \ due to get_maintainer.pl\n  - 8.5% all other security discussion\n\n## KSPP\n\
    \nTop contributors in % of overall emails:\n\n| Email | Percentage |\n| :--- |\
    \ :--- |\n| keescook@chromium.org | 15.05 |\n| thgarnie@google.com | 3.44 |\n\
    | ard.biesheuvel@linaro.org | 2.75 |\n| mark.rutland@arm.com | 2.49 |\n| jason@zx2c4.com\
