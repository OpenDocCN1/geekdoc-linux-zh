  - '[PAGE 2]


    # # Timeline


    +   - Not an exhaustive timeline

    - Primarily selected from changes that rose to the level of being mentioned on
    kernelnewbies.org

    - Won''t include things that have a relation to security in some instances (e.g.
    ramp-up of KUNIT/selftests)

    - X86-specific


    +   - In fact, the ARM64 and PowerPC maintainers are landing significant security
