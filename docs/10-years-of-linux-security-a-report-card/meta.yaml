    | yanaiijie@huawei.com | 1.08 |\n| igor.stoppa@gmail.com | 1.05 |\n| re.emese@gmail.com\
    \ | 1.00 |\n\n## KSPP\n\n- “其他”类别是人们预期看到最有趣讨论的地方\n  - 在决定实现方案并提交补丁之前提出新想法/进行头脑风暴\n\
    \  - 这种情况极少在列表中发生（占8%）\n\n补丁本身占了发送到 KSPP 邮件的一半以上\n\n三分之一的邮件是对这些补丁的评审\n\n专门提到 KASLR\
    \ 的邮件占了所有邮件的近 9%\n\n只有 9% 的邮件是在周末发送的\n\n向列表发送邮件的人群呈现极长尾效应\n\n- 上一张幻灯片中只有 23 人占比\
