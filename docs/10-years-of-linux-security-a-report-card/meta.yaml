  md: '# # Timeline


    +   - August 2010 – “Linux Security in 10 Years” presented at Linux Security Summit


    +   - Mentioned little mainline attention to kernel self-protection


    +   - 2009/2010 saw a large influx of published kernel exploits, many by me with
    techniques still in use today


    +   - Recommended:


    +   - Removing RWX from the kernel, eliminating information leaks, protecting
    sensitive kernel data (function pointers, IDT/GDT, etc)


    +   - Protecting against invalid userland memory accesses, refcount overflows,
    overflows of allocation sizes


    +   - Implementing CFI, preparing for data-only attacks'
