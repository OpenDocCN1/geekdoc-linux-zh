- md: "\n## Recommendations\n\n- Fail fast, iterate faster\n- A lot of review for\
    \ security patches is trivial nitpicking and can-kicking\n- Appears to be a different\
    \ set of standards for merging non-security features vs even optional security\
    \ code\n- Is having the KASLR PIE/S.A.R.A. code dragged out over 3 years an an\
    \ effective use of developers’ time?\n- When an abysmal patch is presented that\
    \ has no chance of being merged in any form, is it really helpful to lead the\
    \ submitter on by suggesting trivial nitpicks and typo fixes and asking them to\
    \ put out a v2/v3/v20?\n\nThe time to decide on an “unprivileged” sysctl for an\
    \ easily abused new feature is when the feature is first introduced, not years\
    \ after the necessity is obvious via multiple exploits (unpriv users, userfaultfd,\
    \ etc)\n\n## Recommendations\n\n- Find a way to fund security work again\n- CII\
    \ is long dead, but no obituary was ever posted\n    - https://twitter.com/TomRittervg/status/11815728965729305473\n\
    \    - Last announcement in 2017\n    - Last mail on cii-discuss mailing list\
    \ was December 2017 regarding CII support for OpenSSH ending in 2016 but still\
    \ being listed on the CII website\n    - No reply, OpenSSH and OpenSSL still falsely\
    \ listed as currently-supported projects today\n- Actually practice what you preach\n\
    \n## Millions of Dollars of Shared Vigilance\n\nThe stakes have never been higher\
    \ for open-source software security. With millions of people around the world\
    \ relying on open source software — and vulnerabilities Heartbleed putting everyone\
    \ at risk — it's time to change the way we support, protect, and fortify open\
    \ software. With our Core Infrastructure Initiative, we're taking a collaborative,\
    \ pre-emptive approach for strengthening cyber security. Many industry giants\
    \ signed on to harden the security of key open source projects.\n\n# Thank You!\n\
    \nQuestions?\n"
  mdcn: "\n\n## 建议\n\n- 快速失败，更快迭代\n- 对安全补丁的大量审查往往是琐碎的挑剔和推诿责任\n- 合并非安全功能与合并即使是可选的安全代码相比，似乎执行了另一套不同的标准\n\
    - 将 KASLR PIE/S.A.R.A. 代码拖延 3 年，这真的是对开发者时间的有效利用吗？\n- 当提交了一个没有任何机会以任何形式合并的糟糕补丁时，通过建议一些琐碎的毛病检查和修复拼写错误来误导提交者，并要求他们发布\
    \ v2/v3/v20 版本，真的有帮助吗？\n\n对于一个极易被滥用的新功能，决定“非特权”sysctl 的时机应该是该功能首次引入时，而不是在通过多个漏洞利用（非特权用户、userfaultfd\
    \ 等）证明其必要性多年之后。\n\n## 建议\n\n- 重新找到为安全工作提供资金的方法\n- CII 早已灭亡，但从未发布过讣\n    - https://twitter.com/TomRittervg/status/11815728965729305473\n\
    \    - 最后一次公告是在 2017 年\n    - cii-discuss 邮件列表上的最后封邮件是 2017 年 12 月，关于 CII 对 OpenSSH\
    \ 的支持于 2016 年结束但仍在 CII 网站上列出\n    - 无回复，OpenSSH 和 OpenSSL 今日仍被错误地列为当前支持的项目\n-\
    \ 诸行行一\n\n## 数百万美元的共同警惕\n\n开源软件的安全风险从未如此之。全球有数百万人依赖开源软件——而 Heartbleed 漏洞让所有人都处于危险之中——是时候改变我们支持、保护和加固开源软件的方式了。通过核心基础设施倡议（Core\
    \ Infrastructure Initiative），我们正在采取协作、预防性的方法来加强网络安全。许多行业巨头已签署共同加强关键开源项目的安全性。\n\
    \n# 感谢！\n\n有疑问吗？\n\n"
