  - '[PAGE 28]


    # # Exploitation Trends


    +   - Data-only attacks are on the rise, public attacks continue to focus on the
    path of least resistance


    +   - STATIC_USERMODEHELPER doesn’t seem to have caught on at all, UMH paths continue
    to be targeted


    +   -  - Kernel itself performs the task of breaking out of any container and
    executing a process with full privileges


    +   - Public, unfixed syzkaller reports a good source of information


    +   -  - Tweaks to syzkaller, differences in config discover kernel vulnerabilities
    that do not appear in the Syzkaller dashboard the public uses uses (http://syzkaller.appspot.com/)


    +   - Attack surface exposed by unprivileged user namespaces isn’t decreasing
    anytime soon


    +   -  - Even more functionality being exposed:


    +   -  - 2abe05234f2e l2tp: Allow management of tunnels and session in user namespace


    +   -  - 4a92602aa1cd openswitch: allow management from inside user namespaces


    +   -  - 5617c6cd6f844 nl802111: Allow privileged operations from user namespaces


    +   - “Does this newly-allowed code pass existing fuzzing tests?” doesn’t appear
    to be a consideration for enabling such functionality'
