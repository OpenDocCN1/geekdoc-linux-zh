  - '[PAGE 30]


    # Exploitation Trends


    +   Reactionary security doesn''t work anymore – outside of Project Zero, few
    exploits are published publicly


    +   Today''s security professionals (the younger, newer generation) expect to
    be paid for their work


    +   Companies like Zerodium will buy exploits for widely-used software, including
    Linux


    +   Several other security companies develop and sell these exploits with in-house
    talent


    +   Techniques more important than individual vulnerabilities


    +   Exploit shops plug the vulnerability into their existing exploitation frameworks


    +   Can''t wait for a public exploit to start thinking about how to improve security


    +   The mouse in the cat and mouse game has slipped into the hole in the wall


    +   Automatic Exploit Generation


    +   Current state of art is effective unless CFI is employed


    +   https://i.blackhat.com/eu-19/Wednesday/eu-19-Chen-Hands-Off-And-Putting-SLAB-SLUB-Feng-Shui-In-A-Blackbox.pdf'
  - "[PAGE 31]\n\n# # Recommendations\n\n+   - KASLR has been repeatedly proven to\
    \ be security theater\n  - Operating under the assumption of no information leaks\
    \ for the Linux kernel is a losing bet\n  - Continues to consume a lot of developer\
    \ time across multiple architectures\n  - Confusedprintk %p hashing effort in\
    \ support of KASLR has hampered bug reporting\n  - Takes up an oversized focus\
    \ on KSPP mailing list\n    - PIE support to extend KASLR (for an extra 2 bits\
    \ of equally-leakable entropy) currently on v11 of patch series that started in\
    \ August 2017\n\n+   - Consider modern/realistic threat models and implement security\
    \ that can be effective/performant under those models\n  - Why is FG-KASLR being\
    \ discussed when CFI has already been demonstrated for years?"
  - "[PAGE 32]\n\n# # Recommendations\n\n+   - Seemingly “simple” mitigations can\
    \ create sunk cost fallacies\n  - Arises when they cannot offer the security they\
    \ purport under realistic threat models\n  - Each workaround for an attack can\
    \ add performance hit\n  - Had all the issues been known from the beginning, mitigation\
    \ wouldn't have landed\n  - After years of work, will you remove an indefensible\
    \ mitigation, or keep adding to the hacks and performance hit?\n  - FG-KASLR will\
    \ prove to be an example of this\n\n+   - Resist the thinking of “we have to do\
    \ something / this is something / let’s do this”\n  - http://addxorrol.blogspot.com/2020/03/before-you-ship-security-mitigation.html\n\
    \  - With dearth of public exploits, developers only have have to convince each\
    \ other\n  - Little to no independent/expert evaluation (outside of Jann Horn)"
  - "[PAGE 33]\n\n# # Recommendations\n\n+   * Improve the quality of benchmarks for\
    \ security features before inclusion into the kernel\n     KAISER once claimed\
    \ a 0.1% performance hit\n* 1% performance hit was claimed for STACKLEAK (not\
    \ by us)\n* Retpolines ended up having a large impact on network throughput\n\
    * Benchmarks mostly appear to involve kernel compilation, a task that only spends\
    \ a tiny percentage of its time in the kernel, diluting any performance hit that\
    \ exists\n* Ideally, a suite of benchmarks should be performed on a farm of consumer/server\
    \ CPUs of at least the past 5 years"
  - "[PAGE 34]\n\n# # Recommendations\n\n+   - Development organization still focused\
    \ on patches and mailing lists\n  - In many instances (including some of the examples\
