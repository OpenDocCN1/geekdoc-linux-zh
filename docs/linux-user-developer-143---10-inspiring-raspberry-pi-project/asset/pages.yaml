  md: '# Your view


    NHS, LXLE, Steam Machines


    # LETTERS


    out how to port it, or b) suddenly find that they, quite simply, painted themselves
    into the same corner, and can''t port it, or c) went out of business, and are
    no longer around to fix their own mess.


    Deanne Cooley


    It''s an unfortunate factor of business that problems like these arise. Extra
    money would be required for training on any kind of new software as well, whether
    Microsoft-created or open source. The weird thing is, WINE has better compatibility
    with older software than modern Windows does -- a bit of a scary thought. The
    next time they need to do such an upgrade, though, there may have been a bit of
    a paradigm change in terms of popular operating systems. It will be interesting
    to see how this plays out.


    only thing we saw from it all was Portal 2 (the PS3 version shipped with a Steam
    key and supported cross-play with the Steam version).


    Steam Machines aren''t for everyone, but there''s a market for them. I want one,
    though I''ll likely end up piecing my own together due to costs. The ability to
    buy XCOM (for example) just one time and play it wherever I want -- on my Linux
    laptop, my Windows desktop (in theory; I only run Linux), or my Mac (again, in
    theory), as well as on my TV in my living room using my Steam Machine console.
    And not only that, but I have one friends list, one achievements list, one online
    community... I couldn''t do this sort of thing with my PS3 games (Portal 2 being
    the exception). Point is: this is unification, not fragmentation.


    Dana


    It''s a valid point, though with all the different types of Steam Machine that
    are planned, there is real fragmentation as well. The cheaper ones are moderately
    powerful but nowhere near the capabilities of the others.


    Buying something for a Steam Machine in a year or two may well have you asking
    ''Does it work on my specific hardware?'', which is the problem Ron was alluding
    to. It''s the same issue we get with Android, as you yourself alluded to. As the
    hardware isn''t really out yet, we don''t know if there''s going to be some kind
    of compatibility requirement for these systems to make it easier. Valve likely
    still has some tricks up its sleeves we''ve yet to see.


    # Fragmented universe


    In your Steam article you quoted Ron''s concern being just fragmentation with
    the Steam Machines. It''s not fragmentation. It''s unification. Fragmentation
    would be if Steam Machines were just another console with another console ecosystem
    and community. Steam Machines are not that. And I have a feeling that Valve originally
    hoped to partner with Sony for this endeavour to meld Steam with the living room,
    but for whatever reason, it fell through and the


    Below Steam Machines are on the horizon but will they be fragmented?


    ![](img/daaca9116bc2b1db669c224de81abc7c_94_0.png)


    # Android Magazine


    With more and more Android features being merged back into the Linux kernel, it''s
    becoming easier to develop for one of the most popular mobile operating systems
    around. With over 25 billion app downloads, and over 100 million Android devices
    worldwide, there''s a wide audience of folks ready and willing to consume your
    apps. For more Android-driven editorial, you can look to our sister mag Android
    Magazine, the only publication dedicated to the platform. Along with news and
    reviews to keep you up to date on everything Android, there''s also tutorials
    and advice on developing and hacking your hardware.


