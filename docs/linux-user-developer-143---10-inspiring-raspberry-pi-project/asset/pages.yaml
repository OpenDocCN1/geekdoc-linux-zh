  md: '# Further reading


    Find even more inspiration inside these brilliant resources


    If you''ve worked your way through all ten projects and even had a crack at combining
    some of them, you''re likely wondering where to go next. Well, there are many
    places we can point you towards for even more inspiring projects, as well as places
    to shop for parts and read up on the technical details of anything you''re not
    sure about. As well as the sources below, there''s a wealth of Pi goodness to
    be found on our website – www.linuxuser.co.uk – just search for ''Raspberry Pi''.
    We also recommend reading *Raspberry Pi: The Complete Manual* (shown right) and
    *Understanding & Implementing Python*, which lives in the Special Editions slot
    of your *Linux User & Developer* app.


    ![](img/daaca9116bc2b1db669c224de81abc7c_65_0.png)


    **Buy now from imagineshop.co.uk**


    ![](img/daaca9116bc2b1db669c224de81abc7c_65_1.png)


    # Adafruit Learning System


    If you are looking for more inspiration, then the Adafruit Learning System is
    a brilliant place to begin, especially if you check out the main Raspberry Pi
    category. You can find dozens more projects here that will test your knowledge
    and help you push it even further, and if you find yourself needing any Adafruit
    modules or other parts then you can always grab them from the shop, which is linked
    right at the top of the page. It''s a great little community to be a part of,
    and it''s well worth creating an account and uploading your own projects too.


    learn.adafruit.com/category/raspberry-pi


    ![](img/daaca9116bc2b1db669c224de81abc7c_65_2.png)


    # CPC


    For electrical components, we recommend that you pay a visit to CPC. For this
    projects feature, we bought the majority of the components that we didn''t already
    have lying around (like the time-lapse project''s camera) from here. For UK orders
    placed online, you can even get free delivery and a same-day dispatch. CPC''s
    catalogue really is comprehensive, so you can get pretty much any electrical component
    you need from them.


    cpc.farnell.com


    ![](img/daaca9116bc2b1db669c224de81abc7c_65_3.png)


    # Raspberry Pi Foundation


    As the popularity of the Raspberry Pi has grown, so has the Foundation''s website.
    New blog posts are going up all the time, announcing new kit like the Model B+,
    and you''ll also find posts showing off some of the amazing work being done by
    the Raspberry Pi Community as a whole. It''s a great place to visit when you''re
    looking for some ideas to spark off a new one of your own – there are a bunch
    of recommended sources to found under the Community tab as well, so you can keep
    tabs on the latest projects.


    www.raspberrypi.org/forums'
