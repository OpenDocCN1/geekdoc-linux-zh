    \    client = dropbox.client.DropboxClient(access_token)\n    print client.account_info()\n\
    \nif __name__ == '__main__':\n    get_token()`\n```\n\n```\nFig 02\n\n`def createClient(token):\n\
    \    global client\n    try:\n        client = dropbox.client.DropboxClient(token)\n\
    \        load_list_of_watched_files_and_folders()\n    except dropbox.rest.ErrorResponse,\
    \ e:\n        print(\"Error accessing Dropbox. Likely because of an expired token.\"\
    )\n        get_token()`\n```\n\n```\nFig 03\n\n`#python watcher.py run`\n`def\
    \ run():\n    if len(sys.argv) > 2:\n        waitingPeriod = int(sys.argv[2])\n\
    \        haveTokenFile = os.path.isfile(\"token.txt\")\n        if haveTokenFile\
    \ is True:\n            f = open(\"token.txt\",'rb')\n            createClient(f.read())\n\
    \        else:\n            get_token()`\n```\n\n# 05 Selecting files for upload\n\
    \nNow that we have a way of telling our script what we want to upload, let’s write\
    \ some logic to help it actually do that. Insert Fig. 05 after sys.argv[2] = \"\
    file\".\n\nThis is nice and simple, as all we’re doing here is splitting the filename\
    \ argument at the last slash so we can get the path of the folder it’s in and\
    \ the name we’ll need to upload it.\n\n# 06 Adding folders for upload\n\nStraight\
    \ after that, we’re loading our JSON file that would have been created just before\
    \ this conditional if it didn’t exist already. That JSON is converted into a dictionary\
    \ object which we can append our file object to and then write back to file. Simple,\
    \ but adding a folder is a little more involved.\n\nWatching a file for changes\
    \ is trivial: accessing the modified date or the file size is easy. However, with\
    \ directories it gets a little harder. In order to make sure we have"
