  md: '# Ongoing Development


    Ted Ts''o (original author of ext2fs, ext3fs, ext4fs) posted an RFC (Request For
    Comment) patch entitled “random: introduce getrandom(2) system call,” which introduces
    a new kernel interface for providing applications with random numbers. “But why,”
    you may ask, “is such a new interface being introduced now, especially as the
    kernel has long had support for the generation of random numbers through reading
    the /dev/random and /dev/urandom special kernel files?” The problem lies in how
    these files operate. Because they must be opened by an application requiring random
    numbers, it is possible for an attacker to arrange that all available file descriptors
    (one is used per open file) are exhausted immediately prior to a system security
    daemon (like the OpenSSh remote login software) requiring the use of random numbers
    for an SSH (or SSL, etc.) protocol handshake. By exhausting all available file
    descriptors (fds), an attacker can make it hard for such software to function
    (or generate weak random numbers), and compromise the ability to provide a secure
    environment.1 The new API instead works through a system call, as on BSD.


    John Stulz and Rafael Wyocki discussed a patch previously posted by Ruthi Kandic
    (of Google) that would provide an interface within the kernel’s sysfs hierarchy
    (under /sys/kernel/wakeup_reasons/last_resume_reason) informing the user (or software
    developer) of the reason for the last kernel wakeup from a low-power state. This
    is important on mobile devices where the goal is to remain in a low-power state
    for long periods of time between bursts of activity, as it is hoped that management
    software can capture the effects of bugs or errant apps causing drain upon the
    user’s battery life and phone using experience.


    Prabhakar Kushwaha, Tammy Hanna, and Liuvi Dudau (of ARM) discussed the requirements
    for PCIe support on the 64-bit ARM Architecture known to the kernel as “arm64”.
    Liuvi Dudau has posted some generic patches which rely upon system boot firmware
    (such as UEFI) to have correctly configured various hidden platform specifics
    before booting the kernel proper. This is similar to platforms such as x86 PCs,
    but differs from how many embedded devices are configured. Nonetheless, there
    is a general push to adopt UEFI across the board on arm64, and this was conveyed
    in the replies, which noted that there would not be an emphasis on supporting
    non-UEFI here.

    A number of kernel developers debated the presence of the words “Copyright,” followed
    by “All Rights Reserved” in the upstream kernel. According to Paul Bolis, who
    used the “git” source code management system command “git grep -i” to search for
    matching lines of kernel source code, there were 5203 instances of this in Linux
    3.16-rc3. Greg Kroah-Hartman (of the Linux Foundation) responded that “I used
    to be ‘worried’ about that as well, turns out it means nothing.” According to
    Greg, “It’s the license of the code that is the issue, not the copyright line,
    which all lawyers tell me now shouldn’t even be in a file, as it again means nothing.”
    This is interesting to know.

    Finally this month, the Linux Foundation posted a “rare look inside” Linus Torvalds’
    home office, in the form of a YouTube video that showcases his newly installed
    desk setup. The video featuring Linus is online at www.youtube.com/watch?v=H5GUP4yqAws.


