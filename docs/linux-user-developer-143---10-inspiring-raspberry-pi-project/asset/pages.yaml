  md: '# Feature


    # Shutting the

    Windows


    The home computers of the Seventies and Eighties often came with the code, and
    users were encouraged to learn assembler and Basic, and to write their own code.
    The gradual change away from the perception of software as a tool to be understood
    and tinkered with, to allow users a better understanding of the machines that
    they had paid for, has often been dated, rightly or wrongly, to the famous Open
    Letter to Hobbyists (ldiggban.com/collection/newsletters/homelbrew/V2_01/gatesletter.html),
    written by Bill Gates, "General Partner, Micro-Soft", on 3 February, 1976, in
    which Gates declared:


    > "As the majority of hobbyists must be aware, most of you steal your software.
    Hardware must be paid for, but software is something to share. Who cares if the
    people who worked on it get paid? Forlornly, he then asked: ''Who can afford to
    do professional work for nothing? What hobbyist can put 3 man-years into programming,
    finding all bugs, documenting his product and distribute for free?''

    > This question has been answered many times over the years by free software developers
    the world over."


    ![](img/daaca9116bc2b1db669c224de81abc7c_21_0.png)


    Above Raspberry Pi is the latest in a long line of computers that have fired the
    imagination of a generation


    > Like a rock band that makes it big and starts demanding payments. Linux has
    become like Metallica.


    # Under the radar


    By the end of the decade, Linux had drifted in under the radar, alongside Samba
    or Apache, and had been ported onto every available piece of hardware from the
    smallest device to the IBM mainframe. Inevitably the big Unix companies began
    to take notice. Red Hat had its successful IPO, and Linux began to be supplied
    on hardware made by SGI, IBM and HP. Free software, under the soubriquet of ''open
    source'', had arrived.

    Red Hat was the company that profited most from the success of Linux, and prospered
    because it stayed close to the ground. Unlike SUSE and Caldera, the other ''commercial''
    Linux distributions of the time, Red Hat CDs didn''t contain proprietary installers
    and were always freely downloadable. Every feature developed by Red Hat was distributed
    under the GPL. The raising of Red Hat''s profile and brand meant that, by the
    time Linux began to take off in commercial environments at the end of the decade,
    Red Hat was perfectly positioned to take advantage, and become ''The Linux company.''

    Of necessity, success has changed Linux and the Linux community; sometimes for
    the better, sometimes less obviously so. Commercial success has removed the uncertainties
    and has improved the polish and shine of most Linux distributions, but along with
    the rough edges, some of the fun and charisma and spirit of the early days has
    gone.

    The success of Linux has changed the way we work, rest and play. Most Linux developers,
    old and new, are employed by big corporations and are well paid, often to work
    from home, and to work more independently. Developers are allowed more autonomy
    than used to be the case. Free software, to various degrees, has become acceptable
    as a way of business.

    "Linux is now the embedded industry. It''s what you use," notes Jeremy Allison.
    "It''s become the establishment, like a rock band that makes it big and starts
    demanding


    payments for its downloads. Linux has become like Metallica...''

    "But the best way to see how Linux has changed is to think of the parties. LinuxWorld
    used to be an alternative event, the Woodstock of the computing world. You went
    to LinuxWorld, and everybody got boozed up and had a good time. The stories I
    could tell you... A lot of people had a lot of good times. LinuxWorld was the
    rock event of the technology world, and then slowly but surely more and more suits
    started turning up, and by the end of it me and a few other gurus were sat there
    not wearing suits in a sea of PR people.''

    Times have changed, and not always for the better, but if some of the excitement
    of the early days has gone, the spirit lives on in community distributions such
    as Debian and Fedora, Gentoo and Arch, and even more so in the fun and freedom
    generated by Raspberry Pi, with its echoes of the past and its unlimited scope
    for experiment and play.'
