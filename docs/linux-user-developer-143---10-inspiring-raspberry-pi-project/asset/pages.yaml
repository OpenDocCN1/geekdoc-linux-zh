- pgno: 18
  md: "# Rise of Linux \nFrom Sinclair QL to Raspberry Pi\n\nFEATURE\n\n![](img/daaca9116bc2b1db669c224de81abc7c_18_0.png)\n\
    \n![](img/daaca9116bc2b1db669c224de81abc7c_18_1.png)\n\nAbove Inside the Sinclair\
    \ QL.\n\nLeft Alan Cox – “Some things weren’t really fixed until somebody became\
    \ involved who really understood how the maths behind these things worked”\n\n\
    For those who spent their childhood or adolescence delving into the home computers\
    \ of the late Seventies and early Eighties, playing with software was a learning\
    \ experience, and something to be shared. Linux could be said to have grown out\
    \ of this ethos as much as it grew out of the free software movement, or the early\
    \ Nineties culture of Usenet where “if you wrote something neat you posted it\
    \ to Usenet” and the only proviso that came with the software was that “if the\
    \ software breaks you get to keep both pieces”.\n\nAs almost everybody knows,\
    \ Linux came into being shortly after Linus Torvalds bought a PC in January 1991.\
    \ As Lars Wendler tells it, “He’d been using a Sinclair QL before that, which,\
    \ like much British computer stuff, was ingenious and almost unusably different\
    \ from everything else. Like every self-respecting hacker, Linus had written some\
    \ software development tools of his own; an editor and an assembler, I think.\
    \ He’d also modified the QL hardware a bit, to replace a broken keyboard, and\
    \ to add a PC-compatible floppy drive. When he bought the PC, he wrote a device\
    \ driver for the QL so he could move stuff from the QL to the PC”.\n\n# From Minix\
    \ to Linux\n\nSpurred by a curiosity about Unix, and a desire to install a Unix-like\
    \ operating system on his brand new PC, Torvalds installed a copy of Minix, the\
    \ operating system developed as a teaching tool by Andrew Tanenbaum, and began\
    \ to write a stand-alone terminal emulator to access the UNIX server at Helsinki\
    \ University. The terminal emulator grew beyond its original purpose, and by August\
    \ 1991, Torvalds was able to announce to the comp.os.minix newsgroup on Usenet\
    \ that he was “doing a (free) operating system (just a hobby, won’t be big and\
    \ professional like GNU) for 386/486 AT clones.” (See bit.ly/1pAY3DH for the original\
    \ post).\n\nThe first iteration of the Linux kernel was written explicitly to\
    \ explore the workings of the 80386 chip on Torvalds’ computer using GCC, the\
    \ GNU C Compiler, and would “probably never support anything other than AT-hard\
    \ disks, as that’s all I have.” The Linux kernel was machine-specific and monolithic,\
    \ and quickly attracted followers and critics. After a couple of months, Torvalds\
    \ made the momentous decision to release the code under the GNU GPL, and quickly\
    \ attracted the help and participation of a growing band of enthusiasts and hobbyists\
    \ who, like Torvalds, had grown up in the age of the Sinclair QL and wanted to\
    \ explore the code.\n\nSo right from the beginning, Linux belonged to everyone\
    \ and no-one, and was a playground for hackers and hobbyists, happy to learn as\
    \ they went along. Alan Cox installed Linux on the Swansea Computer Society machine,\n\
    \n## Copyleft licence \nTorvalds originally released Linux “under a non-GPL copyright\
    \ that was actually much more restrictive than the GPL” but told Hiroo Yamaagata\
    \ in 1997 that he “changed the copyright to the GPL within roughly half a year,\
    \ as it quickly became evident that my original copyright was so restrictive that\
    \ it prohibited some entirely valid uses (disk-copying services etc – this was\
    \ before CD-ROMs became really popular). And while I was nervous about the GPL\
    \ at first, I also wanted to show my appreciation to the GCC C compiler that Linux\
    \ depended on, which was obviously GPLed. Making Linux GPLed was definitely the\
    \ best thing I ever did.\nOnce GNU/Linux had been adopted by more than one hardware\
    \ company it became obvious to these companies that there was a mutual advantage\
    \ in contributing back to the project, and they did. The framework that made this\
    \ possible was Section 2(b) of the GPL. The release of core chunks of corporate\
    \ code accelerated the development of Linux and ensured its success in the enterprise,\
    \ enhanced by its portability across a wide range of hardware.\nCompanies don’t\
    \ use GNU/Linux because of sentimental attachment to Linux, or the GPL, or “open\
    \ source”. They use GNU/Linux and free software because it makes sense. And the\
    \ GPL, which gives assurance of the continued freedom and commonality of the code,\
    \ is the driver behind it."
  merge: -1
