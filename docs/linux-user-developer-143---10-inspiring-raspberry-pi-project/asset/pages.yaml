    \ NumPy version but you also know that NumPy is properly installed.\n\n![](img/daaca9116bc2b1db669c224de81abc7c_38_0.png)\n\
    \n# 02 About NumPy\n\nDespite its simplistic name, NumPy is a powerful Python\
    \ package that is mainly for working with arrays and matrices.\n\nThere are many\
    \ ways to create an array but the simplest is by using the array() function.\n\
    \n```\n```\n>>> oneD = array([1,2,3,4])\n```\n\n```\n\nThe aforementioned command\
    \ creates a one-dimensional array. If you want to create a two-dimensional array,\
    \ you can use the array() function as follows:\n\n```\n```\n>>> twoD = array([\n\
    \            [ 1,2,3],\n            [ 3,3,3],\n            [-1,-0.5,4],\n    \
    \        [0,1,0]] )\n```\n\n```\n\nYou can also create arrays with more dimensions.\n\
    \n# 03 Making simple calculations using NumPy\n\nGiven an array named myArray,\
    \ you can find the minimum and maximum values in it by executing the following\
    \ commands:\n\n```\n```\n>>> myArray.min()\n>>> myArray.max()\n```\n\n```\n\n\
    Should you wish to find the mean value of all array elements, run the next command:\n\
    \n```\n```\n>>> myArray.mean()\n```\n\n```\n\nSimilarly, you can find the median\
    \ of the array by running the following command:\n\n```\n```\n>>> median(myArray)\n\
    ```\n\n```\n\nThe median value of a set is an element that divides the data set\
    \ into two subsets (left and right subsets) with the same number of elements.\
    \ If the data set has an odd number of elements, then the median is part of the\
    \ data set. On the other side, if the data set has an even number of elements,\
    \ then the median is the mean value of the two centre elements of the sorted data\
    \ set.\n\n# 04 Using arrays with NumPy\n\nNumPy not only embraces the indexing\
    \ methods used in typical Python for strings and lists but also extends them.\
    \ If you want to select a given element from an array, you can use the following\
    \ notation:\n\n```\n```\n>>> twoD[1,2]\n```\n\n```\n\nYou can also select a part\
    \ of an array (a slice) using the following notation:\n\n```\n```\n>>> twoD[0:1,1:3]\n\
    ```\n\n```\n\nFinally, you can convert an array into a Python list using the tolist()\
    \ function.\n\n# 05 Reading files\n\nImagine that you have just extracted information\
    \ from an Apache log file using AWK and you want to process the text file using\
    \ NumPy.\n\nThe following AWK code finds out the total number of requests per\
    \ hour:\n\n```\n```\n$ cat access.log | cut -f2 | cut -d\\\n-f1 | awk -F: '{print\
    \ $2}' | sort -n | uniq\n-c | awk '{print $2, $1}' > timeN.txt\n```\n\n```\n\n\
    The format of the text file (timeN.txt) with the data is the following:\n\n```\n\
    ```\n00 191\n01 225\n02 121\n03 104\n```\n\n```\n\nReading the timeN.txt file\
    \ and assigning it to a new array variable can be done as follows:\n\n```\n```\n\
    \ aa = np.load(txt(\"timeN.txt\"))\n```\n\n```\n\n# 06 Writing to files\n\nWriting\
    \ variables to a file is largely similar to reading a file. If you have an array\
    \ variable named aal, you can easily save its contents into a file called aal.txt\
    \ by using the following command:\n\n```\n```\nIn [17]: np.save(\"al.txt\", aal)\n\
    ```\n\n```\n\nAs you can easily imagine, you can read the contents of aal.txt\
    \ later by using the loadtxt() function.\n\n# 07 Common functions\n\nNumPy supports\
    \ many numerical and statistical functions. When you apply a function to an array,\
    \ the function is automatically applied to all array elements.\n\nWhen working\
    \ with matrices, you can find the inverse of a matrix AA by typing \"AA.I\". You\
    \ can also find its eigenvectors by typing \"np.linalg.eigvals(AA)\" and its eigenvector\
    \ by typing \"np.linalg.eig(BB)\".\n\n# 08 Working with matrices\n\nA special\
    \ subtype of a two-dimensional NumPy array is a matrix. A matrix is like an array\
    \ except that matrix multiplication replaces element-by-element multiplication.\
    \ Matrices are generated using the matrix (or mat) function as follows:\n\n```\n\
    ```\nIn [2]: AA = np.mat(\"0 1 1; 1 1; 1 1 1\")\n```\n\n```\n\nYou can add two\
    \ matrices named AA and BB by typing AA + BB. Similarly, you can multiply them\
    \ by typing AA * BB."
