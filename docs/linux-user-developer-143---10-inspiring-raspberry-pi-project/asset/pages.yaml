  md: "# Tutorial\n\n# LinuxDeveloper\n\n# 09 Plotting with Matplotlib\n\nThe first\
    \ major you should make is to install Matplotlib. As you can see, Matplotlib has\
    \ many dependencies that you should also install.\n\nThe first thing you will\
    \ learn is how to plot a polynomial function. The necessary commands for plotting\
    \ the $3x^2+4x$ polynomial are the following:\n\n```\n```\nimport numpy as np\n\
    import matplotlib.pyplot as plt\nmyPoly = np.poly1d(np.array([3, -1, 1]))\n\n\
    astype('float')\nx = np.linspace(-5, 5, 100)\ny = myPoly(x)\nplt.xlabel('x values')\n\
    plt.yxlabel('f(x) values')\nyticks = np.arange(-5, 5, 10)\nplt.xticks(xticks)\n\
    plt.yticks(yticks)\nplt.grid(True)\nplt.plot(x,y)\n```\n```\n\nThe variable that\
    \ holds the polynomial is myPoly. The range of values that will be plotted for\
