  md: '# THE ESSENTIAL GUIDE FOR CODERS & MAKERS


    # **PRACtICAL**

    # **Raspberry Pi**


    # # **Contents**


    +   * **66** Further reading and inspiring resources


    +   * **68** Pi Project: Andrew Langley''s Pi2D2


    +   * **70** FAQ: Raspberry Pi Model B+


    +   * **72** Python column: Science on a Pi


    # # **10**

    # **Inspiring Pi projects**

    **Fire up your imagination and test your Python skills**


    The Raspberry Pi has come a long way over the last couple of years, and it’s all
    down to the creativity and imagination of a burgeoning community that’s bought
    over three million of these single-board computers. They’ve powered quadcopters
    and coffee makers, self-sailing boats and even touched the edge of space, but
    the one thing that’s still as much in demand as it was on launch day is an idea.


    Our Raspberry Pi community works so well because we all share our work with each
    other. We can all see what everyone else is up to and, if we see something we
    like, we can have a go at making it ourselves – and then changing it, so we can
    share a different version. It’s all about inspiration.


    So for this issue we made ten inspiring projects for you to try – and we encourage
    you


    to deviate from the steps when a new idea takes hold and let us know where your
    project leads you! There’s a range of different projects here for you to try,
    covering media and entertainment, networks, security and more. All the components
    you’ll need for each one are listed on the page, and if you turn to the back of
    this feature (pages 66-67) then you’ll find a further resources round-up. You
    can also get the full code for these projects from our website.


    One more thing to mention – some of our Raspberry Pi creations are designed to
    be combined, to give you a great starting point when you begin adapting these
    projects to the way you want them. If you come up with any combinations we’ve
    missed, be sure to tweet us a photo – and have fun making them!'
