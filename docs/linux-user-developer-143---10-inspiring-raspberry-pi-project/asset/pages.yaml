  md: '# OpenWRT gets native IPv6


    Barrier Breaker release includes shiny new features


    Popular embedded distribution OpenWRT has announced a new release which adds fully
    native support for the Internet Protocol version 6 (IPv6) via DHCP for the first
    time.


    Commonly used to replace the stock software on off-the-shelf router hardware,
    previous OpenWRT packages have been slowly introducing support for IPv6, starting
    with the ability to route IPv6 traffic over more common IPv4 connections.


    Dubbed “Barrier Breaker”, OpenWRT 14.07 enhances the IPv6 stack with the introduction
    of DHCPv6, allowing an OpenWRT-based router to receive both IPv4 and IPv6 addresses
    from a wide-area network provider.


    Additional new features include source-constrained routing, router advertisements,
    and multihoming with local prefix allocations.


    Additional tweaks in the latest release include better wireless configuration
    through netifd, support for dynamic firewall rules and zones, a UCI data validation
    layer, filesystem tweaks including snapshots and rollbacks, and draft support
    for self-managing home networks using the HNCP standard.


    A new package feed has also been created, due to organisers’ displeasure with
    the quality of existing feeds.


    The Barrier Breaker release uses the 3.10 Linux kernel, with the project leaders
    stating their intentions to release a Chaos Calmer build before the end of the
    year with either 3.14 or a newer long-term support (LTS) kernel version.


    # EFF launches router OS


    Privacy-focused package unveiled at HOPE X


    The Electronic Frontier Foundation has released what it describes as a “hacker
    alpha” of its planned operating system for routers, part of the privacy group’s
    Open Wireless Movement.


    Linux-based, the Open Wireless Router software has been developed in conjunction
    with Fight for the Future, Mozilla, Free Press and other privacy advocate groups
    with the view of providing a simple and easy-to-use means for internet users to
    help increase their privacy.


    The software will, in its final stage, include bandwidth-controlled public and
    encrypted private wireless networks, offer anonymisation and encryption features,
    be hardened against attack and feature an auto-update mechanism over a secured
    connection.


    The EFF also promises to include advanced network queueing functionality for reduced
    latency in time-sensitive applications. This, coupled with the bandwidth controls
    on the public network side, is hoped to encourage users to open their internet
    connections to public use without the need for a network key or other authentication
    measures.


    Building on the Caro/WRT project, the early-version alpha currently supports only
    the Netgear WNDR3800 router. “This release is a work in progress”, the team behind
    it warned at the unveiling, “and is intended only for developers and people willing
    to deal with the bleeding edge.”'
