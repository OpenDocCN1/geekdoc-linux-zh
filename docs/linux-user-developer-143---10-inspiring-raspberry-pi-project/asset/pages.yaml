    # # Write useful shell scripts – part 2


    Employ your newfound Bash scripting knowledge and start prototyping programs for
    any language


    # ## Advisor


    **Richard Smedley**

    A Linux jack-of-all-trades, Richard doesn''t spend enough time in any language
    to get truly proficient, but always has a shell open so learn scripting by osmosis


    # ## Resources


    *   Bash shell

    *   Your favourite text editor


    As with Python, Ruby, Lisp, and all of the other languages that give you an interactive
    shell to play with, you can try out snippets of Bash programs interactively in
    the shell, before you put them in a script. Indeed, scripts often grow from just
    one short chain of commands, with features added until the original short script
    is buried in other detail.


    However, if you have a clear idea for a longer program, then it''s well worth
    planning in advance, laying out the design with comments, then adding in code
    snippets – testing as you go – until you have a functioning piece of code. Do
    this, and even if you take out the comments, your script should be logical and
    easy to read.


    Before we get on to planning, we''re going to look at some of those practical
    bits, in the form of making your scripts interactive, taking in more flow control
    logic along the way. We''ll introduce some simple ways of producing menu choice
    – which will work across distros – and some validation of input, to protect your
    script from error-prone or malicious users.


    Finally, we fabluse Bash''s weak dynamic typing to help lay an Easter Egg.'
