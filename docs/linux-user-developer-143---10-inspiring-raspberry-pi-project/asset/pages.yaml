  md: "# # On the DVD\nFind out what lies in store for you on issue 143's Linux User\
    \ & Developer DVD...\n\nWelcome to the Linux User & Developer DVD, accompanying\
    \ issue 143 and delivering the hottest new distros and libre software.\n\nThis\
    \ month you'll find the Tails 1.1 update, Ubuntu 14.04.1 and also CentOS 7 on\
    \ your DVD, with the new CentOS being based on the recent Red Hat Enterprise Linux\
    \ 7 release. As well as this, we've also included the GPartEd Live partition manager\
    \ environment for you.\n\nAs usual, you'll also find 20 software packages covering\
    \ some of the tools we look at this issue and a bunch of other useful programs.\
    \ Plus there's access to all the code from this month's tutorials.\n\n+   **Distros**\n\
    +   Tails 1.1 and Ubuntu 14.04.1 both live-boot from your DVD. CentOS 7 and GPartEd\
    \ Live are both ISOs that can be downloaded.\n+   \n+   **Tutorial Files**\n+\
    \   The staple of every issue, you can find all the assets and code you'll need\
    \ to follow the tutorials in this section of your DVD\n+   \n+   **Software**\n\
    +   Here you'll find 20 of the latest and greatest software packages, including\
    \ this issue's group-tested network managers\n+   \n+   **Tutorial Archives**\n\
    +   De-archived for your programming pleasure, some of the greatest guides from\
    \ past issues\n\n![](img/daaca9116bc2b1db669c224de81abc7c_95_0.png)\n\n# ## How\
    \ to burn an ISO\nWant to try a new distro ISO? Here's how to get started...\n\
    \n+   **STEP 1: Grab a new ISO**\n+   Copy the distro's ISO from our cover disc\
    \ to your hard drive: go to the Distros tab, click ISO and choose to Save. Alternatively,\
    \ find an ISO online to download. If you're not sure if you need a 32-bit or 64-bit\
    \ version, go with the former to be safe.\n+   \n+   ![Step 1 Screenshot](placeholder_for_step1_screenshot)\n\
    +   \n+   **STEP 2: Open or install Brasero**\n+   Brasero is the most popular\
    \ open source disc-burning utility. If it's not already installed on your distro,\
    \ locate it in your distro's repository and install it. Then open the program\
    \ and select 'Burn image' from the Projects tab on the left.\n+   \n+   ![Step\
    \ 2 Screenshot](placeholder_for_step2_screenshot)\n+   \n+   **STEP 3: Burn your\
    \ disc image**\n+   On the Image Burning Setup menu, click the first box - marked\
    \ 'click here to select a disc image' - and navigate to the ISO you just put on\
    \ your hard disk. Once selected, ensure you've got a CD or DVD writable disc inserted\
    \ and click 'Create Image'.\n+   \n+   ![Step 3 Screenshot](placeholder_for_step3_screenshot)"
