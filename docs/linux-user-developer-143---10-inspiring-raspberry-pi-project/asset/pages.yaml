  md: "# ## 08 Creating folder paths and uploading files\n\nWhen we added folders\
    \ to our JSON for uploading, we did so that each one could be independent of any\
    \ other folder being existent or non-existent. That decision helps us now that\
    \ we're ready to upload to Dropbox. But before we even think about uploading a\
    \ file to Dropbox, we need to check whether or not there is already a directory\
    \ we can upload to. By splitting the path with our folder on our system, we can\
    \ work through each sub-folder and create the directories as we go along. This\
    \ gives us an identical folder hierarchy on our Dropbox account to the one on\
    \ our system — this way, every file we upload will be in the same relative place\
    \ to every file that was on our system. By calling client.metadata() we can check\
    \ whether a directory already exists. If the directory doesn't already exist,\
    \ the Dropbox SDK will throw an error. RestResponse that we can catch and then\
    \ use the client.file_create_folder(path) endpoint to create the required directory.\
    \ Simple. (Fig. 09).\n\nNow we have the folder in place, we can start uploading\
    \ the files in those directories. (Fig. 10). We're treating files a little differently\
    \ from folders here. Whereas with the folders we're merely checking that they\
    \ do in fact exist, since files can be larger and thus more taxing if we continuously\
    \ upload them willy-nilly; here—if we find that there is already a file with the\
    \ same name in the same folder— we simply check whether it is any different from\
    \ the file we have on our system. If it is different, we'll upload it, but if\
    \ not then we'll skip over it. If we don't find a file with the same name, then\
    \ we will just upload it; there's no point in checking for something that wasn't\
    \ already there.\n\nHandling the upload of a single file is a little simpler.\
    \ We apply the same criteria for checking whether or not the file has changed,\
    \ but rather than uploading the file to the equivalent folder on Dropbox, we upload\
    \ it to the Files folder in our apps root folder.\n\n# ## 09 Conclusion\n\nFinally\
    \ execute the following in your terminal...\n\n```\n```python\npython watcher.py\
    \ run @\n```\n```\n\n...and that's how you sync files to Dropbox with Python.\
    \ Now you can store your files across an almost limitless expansive platform in\
    \ preparation for that next dreaded time you spill coffee over your laptop.\n\n\
    # # Store files across an almost limitlessly expansive platform\n\n```\n```python\n\
    # Fig 08\ndef now_my_watch_begins(fileList):\n    print(\"\\\\n\\\\nNow my watch\
    \ begins.\\\\n\\\\n\")\n    for item in fileList:\n        if item['type'] ==\
    \ \"file\":\n            check_contents_of_file(item)\n        elif item['type']\
    \ == \"folder\":\n            check_contents_of_folder(item)\n\nglobal items\n\
    f = open('watched_json', 'wt')\nf.write(json.dumps(items))\nitems = []\ntime.sleep(waitingPeriod)\n\
    f = open('watched_json', 'rt')\nthingsWeAreWatching = json.loads(f.read())\nnow_my_watch_begins(thingsWeAreWatching)\n\
    ```\n```\n\n```\n```python\n# Fig 09\ndef check_contents_of_folder(folder):\n\
    \    print folder['path']\n    rootPath = folder['path'].split('/')\n    builtPath\
    \ = \"//Folders/\"\n    folderSize = 0\n    for aFolder in rootPath:\n       \
