  md: "# Sync your files to Dropbox with Python\n\nWe're going to use Python and the\
    \ Dropbox SDK to make an app and script to back up your most important files automatically\n\
    \n# Advisor\n\n![](img/daaca9116bc2b1db669c224de81abc7c_41_0.png)\n\nSean M Tracey\
    \ is a creative technologist at a leading digital agency. He spends a lot of his\
    \ time living inside of Node.js, Python and Arduino\n\n# Resources\n\nPython 2.7+\n\
    A Dropbox Account 0.10.0\nhttp://dropbox.com\nPython Dropbox SDK\nhttps://www.dropbox.com/developers/core/sdk#python\n\
    \nCast your mind back to the technology of a few decades passed... What do you\
    \ seek? Original Game Boys? The Apple II? Floppy disk drives? Sinclair? Cassette\
    \ tapes? What do all these things have in common? They all had tiny amounts of\
    \ storage space. Of course, that's relatively speaking – try by today's storage\
    \ capacity per square centimetre. Long ago, filling 1.44Mb was something achieved\
    \ by only the most prolific of computer users. But with all of the music, video,\
    \ photos and huge games eating up your storage space, keeping everything on one\
    \ device has become a near impossibility. And sharing all of those things effortlessly\
    \ with your friends and family? Forget it! Larger than 20Mb? This is where Dropbox\
    \ comes in. In this tutorial we're going to look at writing a script that will\
    \ automatically sync your files with the Dropbox Servers to save you any file\
    \ loss woes.\n\n# 01 Setting up your Dropbox app\n\nIn order to upload files and\
    \ folders to your Dropbox, we need to create an app with read and write permissions.\
    \ If you browse to www.dropbox.com/developers/apps you'll be presented with a\
    \ list of apps that have access to your Dropbox account in one form or another.\n\
    \nHit the 'Create app' button in the top right corner of the window and you'll\
    \ be presented with two options: to create an app for 'Drop-ins' or to create\
    \ an app that uses the Dropbox API. We're going to be using the Core data API,\
    \ so select the second option, then select the 'Files and Datasources' option\
    \ that appears. The final question before you get set up is 'Can your app be limited\
    \ to it's own folder?' While it's not necessary to do so, it's always handy to\
    \ keep a degree of separation between an app and your precious data when you're\
    \ handling things programmatically. Long story short, in this instance, select\
    \ yes. Enter an app name, and you're good to go. You'll now be presented with\
    \ the settings view for this app. Jot down your app key and secret, as you'll\
    \ be needing things shortly. Before we start, head to the root folder for your\
    \ app and create two new folders – one name 'Files' and another named 'Folders'.\
    \ These will be useful later on.\n\nand this will output a code – an access token.\
    \ Head on back over to your command line and a prompt will be waiting for you\
    \ to paste in the code you just received. With this code the Dropbox library will\
    \ request an OAuth token which will be used through the session. If all of that\
    \ has gone well, you should now see your account details printed out in your terminal.\n\
    \n# 02 Connecting to Dropbox with Python\n\nNow that we have our app set up on\
    \ the Dropbox side, we need to get Python talking to it. Download the Python Dropbox\
    \ SDK and uncompress it, then run:\n\n```\n$ python setup.py install\n```\n\n\
    You should have Python ready to start talking away. Create a new folder with any\
    \ name that you like and inside that folder create a new file called watcher.py.\
    \ Open your newly-created file and then insert **Fig. 01**. Dropbox has a couple\
    \ of different methods that allow you to authenticate with their service. In this\
    \ tutorial we're going to use what is referred to as the \"no flow\" authentication\
    \ method. This method allows us to authenticate an app without having to handle\
    \ any redirects, but it does require a little copy and pasting. If you run the\
    \ above script, it will print out a URL for you to visit. Head on over there and\
    \ click the authenticate button,\n\n# 03 Storing our auth token for later\n\n\
    Now we have access to our Dropbox account, but we don't want to have to go through\
    \ the authentication flow every time we run the script, so let's save it to a\
    \ file for future use. Just before the client variable in our get\\_token() function,\
    \ add the following:\n\n```\n```python\nprint access_token\nstoreToken = open('token.txt',\
    \ 'w')\nstoreToken.write(access_token)\nstoreToken.close()\nclient = drobox.client.DropboxClient(access_token)\n\
    ```\n```\n\nNow, when we authenticate our app in the future, our token will be\
    \ stored. Let's write a check for its existence. Create a new function called\
    \ run():\n\nInside run, we're going to check if a file called token.txt exists.\
    \ If it does, then we'll read the contents, try to create a Dropbox session with\
    \ it, and if that fails (expired/maformed token) for any reason, request a new\
    \ one. We can do that with the following:\n\n```\n```python\ndef run():\n    haveTokenFile\
    \ = os.path.isfile('token.txt')\n    if haveTokenFile is True:\n        f = open('token.txt',\
    \ 'r')\n        createClient(f.read())\n    else:\n        get_token()\n\nif __name__\
    \ == '__main__':\n    run()\n```\n```"
