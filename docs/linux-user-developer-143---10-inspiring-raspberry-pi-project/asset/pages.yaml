  md: "# ## Python column\n\n![](img/daaca9116bc2b1db669c224de81abc7c_71_0.png)\n\n\
    **Joey Bernard**\n*As a true renaisssance man, he splits his time between building\
    \ furniture, helping researchers with scientific computing problems and writing\
    \ Android apps*\n\n# # Science on a Raspberry Pi\n\n# ## This month learn how\
    \ to do some scientific number-crunching on your Raspberry Pi\n\nA few issues\
    \ ago, we looked at using **MPI with Python on your Raspberry Pi**. This is useful\
    \ when you are dealing with large problems that you want to spread across multiple\
    \ machines. But what kind of work can you do on each of these machines? If you\
    \ want to create a cluster of Raspberry Pis to do scientific work, you will want\
    \ to look into using *scipy* to handle the actual computation tasks. *Scipy* is\
    \ built on top of *numpy*, a Python module that provides enhanced number handling\
    \ capabilities.\n\n*Numpy* uses optimised shared libraries, like LAPACK or BLAS,\
    \ to handle linear algebra type operations at the same speed as code written in\
    \ C or FORTRAN. With these modules, we will take a quick look at what kind of\
    \ science you can do with these powerful little machines.\n\nAlmost every Linux\
    \ distribution, including the standard ones for the Raspberry Pi, include packages\
    \ for *scipy* and *numpy*. To install *scipy*, you would execute:\n\n```\nsudo\
    \ apt-get install python-scipy\n```\n\nSince *numpy* is part of the *scipy* environment,\
    \ it will get automatically installed when you install *scipy*. In order to use\
    \ them you will need to import them, usually with an alias...\n\n```\nimport numpy\
    \ as np\nimport scipy as sp\n```\n\nThis import of the main *scipy* module only\
    \ provides some core functionality that is available. All of the rest of the functions\
    \ are subdivided into a number of sub-modules, such as *cluster* (providing clustering\
    \ algorithms), *integrate* (providing integration and ordinary differential equation\
    \ solvers), *signal* (for signal processing) and *weave* (for C/C++ integration).\
    \ Each of these sub-modules needs to be imported individually.\n\nIn this way,\
    \ you can just import the sections you need to solve the problem at hand without\
    \ cluttering up the name-space with unneeded objects.\n\nBefore we dive into *scipy*,\
    \ it is worth taking a look at *numpy* and why it is worth considering Python\
    \ for scientific computing. The default extended object in Python is a list. The\
    \ problem with this is that a list could contain any type of object. *Numpy* provides\
    \ an *array* object that can only containing elements of a single type. With this\
    \ concession, you can start to take some shortcuts because you have some meta-knowledge\
    \ about the data.\n\nIn regular Python, when you scale a vector you might use\
    \ a for loop like:\n\n```\na = [1,2,3,4]\nb = []\nscale = 2\nfor curr_a in a:\n\
    \    b.append(curr_a * scale)\n```\n\nIn this small example, there is a lot of\
    \ overhead involved. On each iteration around the for loop, Python needs to check\
    \ the type of scale and the type of the current element from the list to see what\
    \ it needs to do to apply the multiplication operation. When you use *numpy* arrays,\
    \ all of this goes away. The equivalent code would look like:\n\n```\na = np.array([1,\
    \ 2, 3, 4])\nscale = 2\nb = scale * a\n```\n\nIn this case, Python only needs\
    \ to check the type of scale and a once, it then hands the two objects out to\
    \ the shared linear algebra library to handle the actual multiplication step.\
    \ Then the answer object comes back and is stored in b. So you get some speed-ups,\
    \ one from removing all of the type checking that Python does and another from\
    \ using optimised routines in the shared library.\n\nGetting back to *scipy*,\
    \ we should look at what we can do. A common task in scientific problem solving\
    \ is integrating a function over some range. The usual *scipy* function to do\
    \ this is `integrate.quad()`. You can either hand in a predefined Python function,\
    \ or create a lambda expression on the fly. As an example, say you want to integrate\
    \ the sine function from 0 to 1. You could do so with:\n\n```\nimport scipy.integrate\
    \ as spi\nimport math as m\nresult = spi.quad(lambda x:\n    m.sin(x), 0.0, 1.0)\n\
    ```\n\nHopefully, you should get the result **(0.45969769413186023, 5.103669643922839e-15)**.\
    \ The first value is the integral, and the second value is an estimate of the\
    \ absolute error in the result.\n\nAnother common task is to try and fit a function\
    \ to some experimental data. The usual method is to do a least-square fitting\
    \ to minimise the difference between the function and the experimental data. The\
    \ function 'leastsq' is in the '*scipy.optimize*' sub-module. To do this type\
    \ of calculation, you need to provide a function to compute the residuals, and\
    \ a starting point for each of the adjustable parameters in this function. As\
    \ an example, say you had some measurements that seemed to be in a sinusoidal\
    \ shape. You could try fitting a general sinusoidal function...\n\n```\ny = A\
    \ * sin(2*pi*k*x + theta)\n```\n\n# ## Why Python?\n\nIt's the official language\
    \ of the Raspberry Pi. Read the docs at **www.python.org/doc**\n\n# ## We will\
    \ look at the science you can do with these powerful little machines"
