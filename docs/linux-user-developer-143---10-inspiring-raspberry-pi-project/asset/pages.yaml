  md: '# Mayhem malware spotted in the wild


    > ‘Restricted privileges offer little protection’


    A new malware package, dubbed Mayhem, has been spotted in the wild on Linux web
    servers and other “nix-based systems, providing its creators with remote control
    in a similar fashion to Windows-based botnets.”


    According to an analysis of the malware by Yandex employees Andrew Kovalev, Konstantin
    Orashkevich and Evgeny Sidorov published in Virus Bulletin, Mayhem is capable
    of running on a system even under restricted privileges. It is dropped via a malicious
    PHP script and has been found on systems worldwide, with the biggest number of
    infections found in the USA, Russia, Germany and Canada and smaller pockets of
    infection in the UK, Europe and Australia.


    Its primary use appears to be to create a botnet of infected systems, which are
    then sent the command from a command and control server to begin attempts to brute-force
    administrative logins to public-facing WordPress installations. The nature of
    the malware would allow it to be used for other purposes; however, “We can confidently
    say that botnets made up of “nix web servers are becoming more and more popular
    as a modern trend in malware,” the team claimed. “Web servers have good uptime,
    network callbacks and are more powerful than ordinary personal computers. In the
    “nix world, autoupdate technologies aren’t widely used, especially in comparison
    with desktops and smartphones. [Additionally,] the use of anti-virus technologies
    isn’t widespread. A lot of vendors don’t offer any proactive defence or process
    memory-checking modules.”


    With a surprisingly high infection rate, web admins are advised to check their
    systems for the presence of the Mayhem malware.


    # Zero-day vulnerabilities found in Tails


    Tails, the privacy-enhancing Linux distribution favoured by whistleblower Edward
    Snowden, has been found to have several major security vulnerabilities, according
    to a report by cash-for-bugs firm Exodus Intelligence.


    Details of the precise vulnerabilities have been provided by the company to the
    Tails project, which has stated that it will be addressing them as soon as possible.
    In the meantime, Exodus Intelligence has indicated that it will be selling vulnerability
    details to its customers – likely to include, among others, the US National Security
    Agency. The vulnerabilities have been fixed upstream in the Invisible Internet
    Project (I2P), but at the time of writing the Tails team had not announced a timescale
    for a fixed release.


    # Entire world illustrated


    > How It Works team launch travel-sized magazine


    Setting its sights on nothing less than the complete illustration of the world
    – or at least, all the exciting bits that fascinate both kids and grown-ups –
    the team behind the award-winning How It Works, All About Space, World of Animals
    and All About History have launched a brand new magazine.


    Travel-sized, packed full of gorgeous artwork and also supporting Key Stage 2
    learning, the new How It Works Illustrated launched on 31 July for just £6.98.
    This 132-page magazine is not only bursting at the seams with premium illustration
    and educational content, but is also shaking up the newsstand with a refreshing
    blast from the past and a new strategy.


    How It Works Illustrated is uniquely designed to be a collectible publication,
    reinventing the powerhouse for the modern age. Not only that, each issue of How
    It Works Illustrated will look at a single, high-interest topic in depth, such
    as Ancient Rome or dinosaurs. Collect the whole series and you’ll have an illustrated
    guide to the entire world.


    Grab the first issue – History of the World! – from our store: bit.ly/UIA4WS.
    To make sure you don’t miss a single issue, subscribe now and save up to 50%:
    bit.ly/1pg4do5R.


