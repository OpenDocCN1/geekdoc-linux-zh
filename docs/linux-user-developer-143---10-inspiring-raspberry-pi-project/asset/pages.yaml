- pgno: 53
  md: '# **Audiobook reader**


    Create an audiobook player that works at the touch of a button


    # ### What you''ll need


    +   - Speakers

    +   - LED

    +   - 1.2 k resistor

    +   - 10 k resistor

    +   - Push-button switch

    +   - Breadboard and wires


    **Audiobooks and podcasts** are becoming more and more prevalent in a society
    where we’ve learned to multi-task thanks to all our modern devices.


    Whether out and about or doing some chores, it can be nice to have some extra
    sensory input when you’re not using your full concentration. Enter, like always,
    the Raspberry Pi. With only a small selection of components and a pair of earphones
    or portable speakers, you can take your Raspberry Pi with you and have it play
    audio books.


    First, you need to get the Raspberry Pi ready. Do your usual apt-get update and
    apt-get upgrade in the terminal before you start, although there isn’t really
    much preparation involved. Once that’s done, all we need to do is install VLC,
    which is done with:


    ```

    `$ sudo apt-get install vlc`

    ```


    Once that’s done, turn off your Pi, disconnect the power and begin hooking up
    your circuit as according to the Fritzing diagram below. It’s a fairly simple
    setup – we’re going to use the button to activate the playing of the audiobook
    and the LED will turn on while this is happening.


    Once you’re confident with the circuit, turn your Raspberry Pi back on and open
    up the terminal. Type in the following to download the Python code for this project:


    ```

    `$ wget http://www.linuxuser.co.uk/wp-content/uploads/2014/08/audiobook.zip`

    ```


    There are a couple things we need to note about the code: it first of all assumes
    you have your audiobook located in a directory known as audiobook within your
    home folder. It also looks for a file called audiobook.mp3 to play; you can easily
    change this by editing the path but you’ll need to be consistent with the name
    of the file you have on your Pi. You could always have it point to a specific
    location on a USB stick, swapping out the files on another computer and renaming
    them appropriately once you’ve finished with previous book.


    Test it out by running the code – one press of the button will start the process
    while another press will stop playing the book. If you find the button press too
    sensitive or not sensitive enough, edit the delay in time.sleep which is currently
    set at a default of 0.2 seconds.


    ![](img/daaca9116bc2b1db669c224de81abc7c_53_0.png)


    **Right** The synergy between these two projects means you can use the same setup
    for both


    **Below** This circuit will work on both the Model B and Model B+ – the pins begin
    at the same end of each board'
  merge: -1
  img_proc: true
- pgno: 54
  md: '![](img/daaca9116bc2b1db669c224de81abc7c_54_0.png)


    # Web radio


    A portable radio that streams web content wherever you are


    Our Raspberry Pi web radio is a true companion piece to the audiobook over the
    page, and we''ll get into why as we go through this tutorial. Like the audiobook,
    we''re taking full advantage of the Raspberry Pi to help aid you in a real-life
    situation. As standard radio methods begin to die out, the established web-streaming
    platforms will become more and more popular, so you can get in on those straight
    away using this project. The circuit for this is also the exact same one as the
    audiobook, so if you''ve already had a crack at that, then you''ll just need to
    grab the code for this tutorial.


    Before you wire it up, it''s time to prepare your Raspberry Pi. Open the terminal
    and do an apt-get update and apt-get upgrade to make sure everything is up to
    date, followed by installing VLC using:


    ```

    $ sudo apt-get install vlc

    ```


    When it''s finished installing, you will need to turn off your Raspberry Pi. Disconnect
    the USB cable, break out the breadboard and components and follow the wiring diagram.
    It''s not a complicated circuit at all, and revolves around sensing a button being
    pressed and lighting an LED on command. Double check all your connections on the
    breadboard and then plug your Pi back in.


    Open the terminal and use it to download our Python script for playing internet
    radio:


    ```

    $ wget http://www.linuxuser.co.uk/wp-content/ uploads/2014/08/webradio.zip

    ```


    Unzip the file and put it wherever you want; it doesn''t require any special placement
    in your Pi''s file structure. You will likely want to change the radio station
    that the code is currently tuned to, and this can be found in the subprocess.Popen
    line in the code. Find an m3u URL for your favourite radio station and replace
    the URL already in that code to get it to play. There may be a short delay between
    pressing the button and the music starting as VLC launches and gets the stream
    buffered. We''re making it so the light comes on straight away, though, so at
    least you''ll know the process has started. Pressing the button again will kill
    VLC and stop the radio stream. If you feel the button is too sensitive or not
    sensitive enough, look for the time.delay setting and change the amount of time
    it requires the button to be pressed.


    # Put ''em together


    You can easily put both projects together and have an all-in-one radio and audiobook.
    Wire up a second button that will play the audiobook instead and maybe even add
    extra buttons for different radio stations.'
  merge: -1
  img_proc: true
