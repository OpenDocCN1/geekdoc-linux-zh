  md: "...to these measurements. The mathematical residual function would be...\n\n\
    ```\nresiduals = y + A*sin(*pi**kx * theta)\n```\n\n...and the adjustable parameters\
    \ would be 'A', 'k' and 'theta'. In order to use the 'leastsq' Python function,\
    \ you would need to write this residual equation as a Python function that does\
    \ the relevant calculation. Then you can hand in the function, an array with an\
    \ initial guess for the parameters, and any arguments needed for the residual\
    \ function to the function 'optimize. leastsq()'.\n\nThe last example we are going\
    \ look at is solving linear systems of equations. This is something done by many\
    \ disciplines, such as physics and engineering. You can do this by using the linear\
    \ algebra module (linalg). Using matrix notation, the system is defined by 'Ax=b',\
    \ where 'A' is the matrix of coefficients, 'x' is the vector of variables and\
    \ 'b' is the vector containing the right-hand sides of each equation. If you have\
    \ 'A' and 'b' defined, you can solve this problem just by using:\n\n```\nimport\
    \ scipy.linalg as sla\nx = sla.solve(A,b)\n```\n\nSince it uses the new data-types\
    \ provided by numpy, it simplifies the code you need to write, making it easier\
    \ to understand later what you were trying to write.\n\nHopefully we have covered\
    \ enough in this article to convince you to give scipy and numpy a try with any\
    \ problems you may need to work on. There are hundreds of functions available\
    \ to do rather complicated calculations - check out page 62. And you can't beat\
    \ the power usage per flop that you can get from the Raspberry Pi.\n\n# Full code\
    \ listing\n\n```\n# The start of all scientific code should\n# import numpy and\
    \ scipy\nimport numpy as np\nimport scipy as sp\n\n# The old way of multiplying\
    \ a vector\n# by a scale factor is by using\n# a for loop\na = [1, 2, 3, 4]\n\
    scale = 2\nfor curr_a in a:\n    b.append(curr_a * scale)\n\n# The cleaner, optimized\
    \ way is by\n# using the numpy array data-type\na = np.array([1, 2, 3, 4])\nscale\
    \ = 2\nb = scale * a\n\n# To integrate sin(x) over 0 to 1,\n# we need to import\
    \ the integrate\n# sub-module and use the quad function\nimport scipy.integrate\
    \ as spi\nimport math as m\n# Result will contain both the answer\n# and an estimate\
    \ of the error in the\n# answer\nresult = spi.quad(lambda x: m.sin(x), 0.0, 1.0)\n\
    \n# This leastsq example is from\n# the scipy docs\nx = np.arange(0, 6e-2, 6e-2/30)\n\
    y_meas = y_true + 2*np.random.randn(len(x))\n# For testing, we will add noise\
    \ to the true\n# values for y\ny_true = A * m.sin(*pi**kx + theta)\ndef residuals(p,\
    \ y, x):\n    A, k, theta = p\n    err = y - A*np.sin(*pi**kx + theta)\n    return\
    \ err\np0 = [8, 1/2, 3e-2, pi/3]\nfrom scipy.optimize import leastsq\nplsq = leastsq(residuals,\
    \ p0, args=(y_meas, x))\n\n# To solve systems of equations\n# we need to import\
    \ the linalg sub-module\nimport scipy.linalg as spl\n# A will be the matrix of\
    \ coefficients\nA = np.array([[1],[1],[2],[3]])\n# b will be the vector of right-hand\n\
    # side values\nb = np.array([15, 6, 11])\n# We can find the values of x with\n\
    # 'solve()'\nx = spl.solve(A, b)\n```\n\n# Plotting data\n\nA module that is used\
    \ along with scipy and numpy is matplotlib. The first two modules handle all of\
    \ the number crunching tasks, while matplotlib provides a set of graphical routines\
    \ to handle the displaying of all of this data and results. On our Raspberry Pi,\
    \ you can install it with the command:\n\n```\nsudo apt-get install python-matplotlib\n\
    ```\n\nYou can then import the module with:\n\n```\nimport pylab as pl\n```\n\n\
    The plotting functions are grouped into two broad categories, low-level and high-level.\
    \ Most of the functions you will want to use are of the high-level ones. The most\
    \ basic thing you will want to do is plot some data. If you have a vector of numbers\
    \ stored in the variable y, you can plot them with:\n\n```\npl.plot(y)\npl.show()\n\
    ```\n\nThe vector is assumed to have a set of y values, where the x values are\
    \ assumed to be the indexes of the elements. If you have a set of x and y points,\
    \ you can plot them with:\n\n```\npl.plot(x, y)\n```\n\nThese high-level functions\
    \ will make some sensible decisions for the details of your plot with respect\
    \ to items like the axes, labels, colours, etc. With the low-level functions,\
    \ you take control of these options and set them explicitly. If you have used\
    \ the plotting functionality in R, it is very similar to that system."
