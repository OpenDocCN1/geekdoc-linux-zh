  md: "# **Questions & answers**\n\n**Contact us…**\n\nWeb: www.linuxuser.co.uk\n\n\
    Email: linuxuser@imagine-publishing.co.uk\n\n# # Your questions answered\n\nSend\
    \ us your questions and we'll do our best to answer them!\n\n# ## X and mouse\n\
    \nI have a bluetooth mouse, and when I use it, I disable the touchpad on my laptop.\
    \ If my mouse does not connect for some reason (it's happened before), I have\
    \ no easy way to turn the touchpad back on.\n\nI can enable the touchpad using\
    \ a terminal in X with synclient TouchpadOff=0, but I can't get to a terminal\
    \ in X with no mouse! If I switch to another terminal (Ctrl+Alt+F1), synclient\
    \ fails with the error message \"Failed to connect to X Server\". I have tried\
    \ DISPLAY=\":0\" with no effect. How can I get this to work? Is there a way to\
    \ run a command on a terminal other than the one that I am logged into?\n\nRobin\
    \ Allan\n\n**Your synclient needs to use environment variables set by X, which\
    \ you can grab using the following while logged in as a normal user:**\n\n```\n\
    $ export -p > envars\n```\n\n**Log in as root in another terminal and copy the\
    \ envars file into the home folder. Open it up in nano and remove all the variables\
    \ but \\_XAUTHORITY and DISPLAY, followed by sourcing the file from root. You\
    \ could try writing a little script to do it automatically for you that looks\
    \ something like this:**\n\n```\n#!/bin/bash\n```\n\n```\ndeclare -x DISPLAY=\"\
    [variable]\"\ndeclare -x XAUTHORITY=\"[variable]\"\n\nif [ $1 is \"on\" ]\nthen\n\
    \    synclient TouchpadOff=0\nfi\n\nif [ $1 is \"off\" ]\nthen\n    synclient\
    \ TouchpadOff=1\nfi\n```\n\n# ## WINE and dine\n\nOne of my Kingston USB thumb\
    \ drives suddenly became write-protected recently. If I try to update one of its\
    \ .txt files, Linux tells me that the file is write-protected. \"Properties\"\
    \ shows me as its owner with read and write privileges. Actually, all the drive's\
    \ files and directories are...\n\n![](img/daaca9116bc2b1db669c224de81abc7c_87_0.png)\n\
    \n# ## FAQ: Steam on Linux\n\n**Q: What distros is Steam officially available\
    \ for?**\n\nA: Right now it's just Ubuntu that officially supports Steam, although\
    \ that means it leaks into any distro based on Ubuntu.\n\n**Q: Can I get Steam\
    \ for any other distros?**\n\nA: Absolutely. At the very least, Valve distributes\
    \ a deb file that will work on any Debian-based distro, and a few other distros\
    \ have their own build of Steam in their repos.\n\n**Q: What's the state of SteamOS?**\n\
    \nA: It's still being updated and still published by Valve. The in-home streaming\
    \ has been added recently and some of the Debian elements are slowly being removed\
    \ where necessary. It can still be a little tricky to install, though."
