  md: '# Feature


    # Retro arcade cabinet


    ![](img/daaca9116bc2b1db669c224de81abc7c_51_0.png)


    Create a tiny arcade machine and learn how to expand it into a fully-stocked games
    cabinet


    Our office is home to the legendary Retro Gamer magazine, and when the Raspberry
    Pi was released a couple of years ago the team immediately recognised its potential
    as an excellent device to power a homemade, MAME-using arcade machine.


    After a chat between our editor and Retro Gamer’s, the team was satisfied that
    maybe one day it would use a Raspberry Pi or another Linux-powered machine to
    run a cabinet in the future.


    They weren’t the only ones that realised how well a Pi would fit in an arcade
    machine; many projects have been completed since then with impressive results.
    If you don’t fancy carving out custom pieces of wood just yet then you can always
    start small with the Cupcade kit from Adafruit. The kit is composed of laser-cut
    plastic panels, a PITFT screen and a selection of buttons, custom boards and a
    special joystick that can be assembled into a miniature MAME arcade cabinet.


    Unfortunately, for the moment, the Cupcade only supports the original Model B.
    However, we like Model B: think of it as a great excuse to test out whether or
    not your Model B is up to the task of powering an arcade machine in case you want
    to expand. If not, that means you’ll need another Raspberry Pi to replace the
    arcade one, in which case you can upgrade to a Model B+ (see our review starting
    on page 92).


    When you get the kit in, you’ll need to assemble the components step-by-step.
    It’s a long process which we don’t quite have room for in this issue, so instead
    we’re going to point you towards the excellent Adafruit instructions for constructing
    your Cupcade. https://learn.adafruit.com/cupcade-raspberry-pi-micro-mini-arcade-game-cabinet/


    A brief word of warning: it will take you a few hours to complete, so make sure
    you have some time clear to do so. It’s quite fiddly in places as well, so it
    might be worth getting a second pair of hands to help you.


    # What you''ll need


    +   - Raspberry Pi Model B

    +   - Adafruit Cupcade (adafruit.com/product/1763)

    +   - 1.5 A power supply

    +   - Soldering iron

    +   - Wire strippers

    +   - A short length of audio wire


    > Left: It’s a bit tricky to get across the size of the Cupcade in this picture.
    Imagine the joystick is the same size as the analogue stick on a console controller'
