  img_proc: true
- pgno: 35
  md: '# Tutorial


    +   05

    +   **Collaborative editing**

    +   As a cloud platform for data sharing, ownCloud does great, but collaboration
    using ownCloud was a little difficult. This is no more the case now. OwnCloud
    now allows up to five different users to edit the same ODT files simultaneously.
    There is no need to even enable this app; it is enabled right off the bat. Here’s
    what you need to do: go to the “Documents” section, and upload a file you’d like
    to collaborate on. After you upload it, share it with relevant users/groups by
    clicking on the “Share” button on the far left. (Take care to give sufficient
    privileges while sharing). Now that it is shared, the other user(s) can just go
    to the “Documents” section while they are logged in and edit the document even
    when it is opened somewhere else. To make things clearer, names of all the users
    currently accessing the document are shown in the document-editing page, and all
    the edits are colour-coded.


    # 06

    **Configuring external storage**

    Since ownCloud 6, we’ve had the option to enable the external storage app and
    add a secondary storage to ownCloud installations. You can use a local drive –
    Dropbox, Google Drive, even an Amazon S3 server – as a secondary storage. You
    can then encrypt the data stored in ownCloud and external storage using the encryption
    app. Let’s take the example of adding a local storage and then encrypting the
    contents (note that only the newly-added data to external storage gets encrypted).
    Let’s assume you have added a new USB drive to your system and wish to add it
    to your ownCloud as storage space. Enable the “External storage support” app.
    After the app is enabled, go to the admin page’s “External Storage” section. Now
    select the storage type as “Local” from the drop-down, fill in the absolute path
    of the external drive under configuration, and finally add the users/groups you
    like to give access to the drive. If everything is fine, you should be able to
    see the green light on the far left. If it’s red, there is a problem. This drive
    should now be seen under the “Files” section as “External storage”. To encrypt
    the files, just enable the “Encryption” app and re-login to generate the encryption
    keys and encrypt the data.


    # 07

    **Tasks enhanced**

    Collaboration generally depends on how clearly the tasks are defined for each
    of the collaborators. While core ownCloud doesn’t support tasks or lists, the
    “Tasks enhanced” app comes in handy in managing tasks. This plug-in doesn’t come
    bundled with the default installation, though. You need to download the files
    from the app store and place them in the ownCloud/Apps folder. Then, when you
    visit the apps page in ownCloud, you should be able to view the “Tasks” plug-in,
    so just select it and click enable. As the plug-in is enabled you can see a new
    option “Tasks” in the top left menu. In the tasks page, you can add lists, and
    then tasks within the lists. As you add a list, corresponding calendar gets created,
    thus the whole list and the related tasks can be shared across ownCloud (you can
    share your calendars with other users).


