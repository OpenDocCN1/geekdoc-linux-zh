  md: "![](img/daaca9116bc2b1db669c224de81abc7c_55_0.png)\n\n# Media caster\n\nCast\
    \ your content over the local network to receive it from multiple clients so you\
    \ don’t lose your place\n\n# What you’ll need\n\n+   • Raspberry Pi Model B\n\
    +   • XBMC  \n+   http://xbmc.org\n+   • Portable hard drive\n\nHave you ever\
    \ wanted to move between rooms while watching or listening to the same film or\
    \ song? We often find ourselves switching from a phone or tablet to the desktop.\
    \ There are some complicated setups you can use for this involving MythTV and\
    \ various custom-built servers and receivers, but you can also do it with just\
    \ one Raspberry Pi server and then many XBMC receivers with a lot less hassle.\n\
    \nBroadcasting your media over your network so that the clients can pick up pick\
    \ up where you left off in your track or film wherever you move to, without having\
    \ to make a note of the track position and find the file again. Here’s how to\
    \ get set up.\n\n![](img/daaca9116bc2b1db669c224de81abc7c_55_1.png)\n\n# 01 Install\
    \ storage drivers\n\nYou’ll likely be using a portable NTFS hard drive if you\
    \ want to store a lot of media on your Raspberry Pi caster. This means you need\
    \ to install the NTFS libraries on the Pi, which requires you to open the terminal\
    \ and type:\n\n```\n$ sudo apt-get install ntfs-3g\n```"
  merge: -1
