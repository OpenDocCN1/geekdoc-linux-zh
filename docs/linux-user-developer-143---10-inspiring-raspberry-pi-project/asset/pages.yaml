  md: '# Opinion

    The latest in the Linux community

    OPEN SOURCE


    # THE OPEN SOFTWARE COLUMN

    Should the world be appier?

    Simon asks whether Apple’s creation of an ‘app’ culture is good for software


    ![](img/daaca9116bc2b1db669c224de81abc7c_10_0.png)


    **Simon Brew** is a technology writer and editor, working across the Linux, Windows
    and Mac OSX platforms


    ![](img/daaca9116bc2b1db669c224de81abc7c_10_1.png)


    Right! Apple managed to reinigorate the computer program for the modern age with
    its App Store


    **Apple-ﬁcation isn’t really a word, and I’m not going to pretend otherwise.**
    But it is something that increasingly (and badly) describes how computer products
    and software are being described. In particular, Apple has taken the word ‘app’
    (which is now a standard word), and it’s being exchanged with the old fashioned
    way of describing things, as computer programs. We’re not even allowed to call
    them ‘applications’ any more under this new world order.


    Apple’s marketing savvy is the subject of exhaustive books and endless PowerPoint
    presentations, but it’s interesting what it’s achieved. Who, after all, describes
    an iPad as a computer? A mobile phone has been exchanged for the shorthand of
    iPhone, and the injecting of a lower case letter ‘i’ before any other word seems
    to be the foundation of many a major product launch now. Heck, I might start calling
    this an iColumn and sending in an invoice for double the amount. It’s worth a
    try.


    What’s interesting is that Apple’s ideology (in both user interface and proprietary
    tech) is moving beyond the core technology with which it’s usually associated.
    For instance, I’ve recently bought a new television. It’s always fun getting one,
    especially as I’m one of those old duffers who likes to buy a new telly and then
    keep it for the best part of a decade (in an old fashioned approach, granted).
    I noticed, on unpacking it all, that I appeared to have an ‘App’ button on my
    new remote control, and duly pressed it once the set was up and running. And as
    you might expect, a screen popped up, listing a collection of installed applications,
    and inviting me to go to whatever the manufacturer concerned had called its ‘App
    Store’, getting as close as possible without attracting a letter of Apple’s legal
    department. An IT threat, no doubt.


    It’s easy to sneer at the proliferation of the ‘App’ culture, that has taken bloated
    computer programs in some cases and boiled them down to individual tasks, no least
    because most of the options on my new telly are plain tat. Still, if you look
    at the history of the PC, budget publisher Cosmi made a living for a while by
    oﬀectively cutting up the functionality of Microsoft Oﬃce into chunks, and selling
    software that took it at a time. So, a business card designer, or a labels product.
    You more than likely had the features


    already, but there’s something inherently more simple about having one tool for
    one job, rather than a big suite to encompass lots of things.


    What Apple has managed to do, and what open source software also embraces from
    time to time, is to put all that into a package that sounds attractive, non-techy
    and accessible. Many ﬁrms beforehand did the technological pathﬁnding that Apple
    stands on the shoulders of, and many now stand on the shoulders of Apple itself.
    But few have worked out how to package it all together in quite as appealing a
    way.


    It’s a shame, because there’s not a tool that Apple oﬀers for which a competent-to-brilliant
    open source alternative doesn’t exist. But quality doesn’t necessarily bubble
    to the top, especially when most people ﬁnd their ‘app’ by a search rather than
    a browse in a physical store. As such, and it goes against some of the ethos of
    why many get into open source in the ﬁrst place, maybe a drop of Apple inﬂuence
    in some regards, if not Apple behaviour, might just be of us.'
