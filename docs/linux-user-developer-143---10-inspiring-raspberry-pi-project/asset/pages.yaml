    # Hackers and hobbyists


    This open, collaborative attitude to software development certainly wasn''t popular
    with everybody, but it worked, despite the protestations of many at the time who
    should have known better. As recently as 2003 Scott McNealy, CEO of Sun Microsystems,
    dismissed GNU/Linux as a "great environment for the hobbyist", but not for the
    enterprise. He was proved wrong in subsequent years as Linux replaced Solaris
    as the chosen platform for enterprise server farms and Sun went into terminal
    decline.


    Linux undeniably had its roots and inspiration among hackers and hobbyists. Far
    from being a drawback, this is what gave Linux its vibrant drive and energy. The
    developers had little urge or necessity to satisfy the usual commercial urges
    or imperatives, and the software developed organically as an expression of the
    collective talents of the contributors. Linux and GNU demonstrated the power and
    potential of distributed software development, where anybody from any walk of
    life could contribute to the whole, and find a sense of achievement as an equal
    partner.


    At one extreme, the projects that sprang from the nascent Linux community abounded
    with high-achievers. At the other end, those who had made a mess of their academic
    careers, or had developed enthusiasms far removed from their working lives and
    academic opportunities, were able to dip into the code and make a difference in
    an atmosphere that was ultimately democratic.


    # Packaged for delivery


    Linux and GNU allowed home users the ability to explore the possibilities of the
    code, and the networking potential of their machines. Linux had replaced The Hurd
    as the kernel at the heart of the GNU operating system, and users began to package
    the elements of Linux and GNU into coherent ''distributions'' with installers
    and partitioning tools that made the software accessible, and user tools that
    made the software friendly.


    Owen le Blanc compiled the first ''MCC interim release'' of Linux in February
    1992, named after the Manchester Computing Center in Manchester, England. Later
    that year Peter McDonald released SLS (Softlanding Linux System), which was the
    first attempt to pull together all the available software to make a popular Linux
    distribution as we might recognise it today.


    But SLS wasn''t to everybody''s liking. There was little concept of packaging,
    and though the system was ''good enough'' it left the user'
