- pgno: 70
  md: '# # FAQ


    ![](img/daaca9116bc2b1db669c224de81abc7c_70_0.png)


    > **B+ was actually released after the original model B and it''s a bit cheaper
    as well**


    was changed at the last minute. Either way, the model B version 2 has been around
    longer than the original model B and probably the one most people have.


    So why not release the B+ as the B version 3? Or why not call it the Raspberry
    Pi model C? Or Raspberry Pi 2?


    Fundamentally, the chips and such that power the model B+ are the same that power
    the B and even the A as well. It''s just a new configuration and doesn''t really
    add much major functionality; for example, the A lacks networking but the B has
    an ethernet port.


    **What kind of functionality would allow it to become a model C?**


    Well, that''s up to the Raspberry Pi Foundation, but perhaps wireless or another
    kind of major input or output.


    **So what exactly is the difference between the last model B and the model B+?**


    The model B+ has been re-arranged to have a slimmer profile and to fit within
    the confines of the circuit board. To do this it has switched to a microSD port
    on the underside that clicks in and out, while the Video out jack has also been
    removed. Another dual USB port has been added as well, meaning you won''t need
    to use your powered USB


    hub as often. There are also a few more GPIO pins lining the side of the Pi.


    **That''s a fair amount of change. But it''s not enough to call it a model C?**


    Again that''s up to the Raspberry Pi Foundation, but there''s been no real added
    functionality.


    **Apart from the extended GPIO pins? Would they count? Also, does that ruin a
    lot of projects that rely on the GPIO pins to be setup?**


    Well, yes, there''s a bit more you can do with extended GPIO pins but nothing
    major. And yes, everything you would have been able to do before still works with
    the B+ – the extras pins are just added onto the end of the original arrangement.
    If you''ve seen the PiFTS screen we''ve used before, that still works perfectly
    fine on the board. Also, just to clarify, the pins start at the edge, so the pins
    have been extended into the board rather than shifting them up the board.


    **Well, that all sounds interesting. Should I upgrade to it?**


    If all the information here still has you on the fence, you can check out our
    review later on in the issue. It''s also the same price as the original model
    B and is completely replacing it as well, so if you need to buy any more in the
    future then they will most certainly be B+.


    > *Left: Moving the headphone jack to the other side means all the media outputs
    are together in one place*


    # ## Focus on change


    **What are the changes that have been made to the Raspberry Pi?**


    ![](img/daaca9116bc2b1db669c224de81abc7c_70_1.png)


    **USB**


    The most noticeable one is the inclusion of more USB ports – something the Pi
    was always in need of. There are now four ports all lining one side of the Raspberry
    Pi.


    **GPIO port**


    There are now 40 GPIO pins lining the side of the Raspberry Pi, adding 14 onto
    the original 26 without ruining their original configuration


    ![](img/daaca9116bc2b1db669c224de81abc7c_70_2.png)


    **MicroSD**


    This one is the biggest change as it will involve you getting more hardware (a
    microSD card), however it really helps reduce the Raspberry Pi''s profile'
