  md: '# Upgrade your private cloud with ownCloud 7


    Access, sync and share your data much more effectively


    # TUTORIAL


    # **08** ocDashboard


    Have you experienced a sudden urge to look something up on Google while working?
    Maybe you like to check on what the weather will be like at the weekend, or see
    what''s happening in the news. These kinds of distractions are plentiful on the
    internet, and most of the time that''s fine. But if you find your productivity
    suffering, then the dashboard app is a great way to cut them out. It needs to
    be downloaded and installed as the earlier app. Once installed, you get the “Dashboard”
    option in the top left menu. To manage the dashboard settings, go to your personal
    page (top-right menu » Personal). Here you can add various dashboard items like
    clock, calendar, weather, search, activity, news and much more. It even supports
    the tasks; you can enable the tasks app and then view them on your dashboard.


    ![](img/daaca9116bc2b1db669c224de81abc7c_36_0.png)


    # **09** Files move


    The default file management in ownCloud allows you to rename or download files
    and move files using drag and drop. While this is fine if there are fewer files
    to handle, it may prove to be inefficient when you have to handle lots of files,
    as many files means many folders to segregate related files! The “Files move”
    app can be of help in such cases. Just download it from the ownCloud apps website
    and enable it. Once enabled, you can directly visit the files page. Here you can
    see the option to move files when you hover on a file/folder.


    As you click on the move icon, all the available destinations for the file are
    automatically listed. You just need to select the proper destination and click
    Move.


    # **10** ocGame


    Well, so much for productivity! Now we can have a brief look at the ocGame app,
    which integrates some of the more traditional computer games to your ownCloud
    installation. As usual, enable it after download, and you get the “Games2+” link
    in the top left menu. This page you have games like Minesweeper, Tic-tac-toe,
    Fire In A Row and others. While these are not on quite the same level as smartphone
    games, they are briefly entertaining and can definitely help you ease your nerves
    after hectic work.


