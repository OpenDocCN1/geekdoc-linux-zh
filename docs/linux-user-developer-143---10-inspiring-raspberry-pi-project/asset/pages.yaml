- pgno: 56
  md: "# 10 Inspiring Raspberry Pi projects\n\n![](img/daaca9116bc2b1db669c224de81abc7c_56_0.png)\n\
    \nLeft: Media stored on your portable hard drive will show up in a dedicated folder\n\
    \n# 02 Create mounting folder\n\nWe’re going to have the Raspberry Pi automatically\
    \ mount the hard drive for us whenever it boots up, and in order to do this it\
    \ first needs to have a place where the files will be accessible. Let’s create\
    \ a directory called mediadrive inside the Home folder. Keep the directory name\
    \ to just one word to make your life easier later.\n\n```\n$ mkdir mediadrive\n\
    ```\n\n# 05 XBMC stream receiver\n\nThis bit is dead simple – on any computer\
    \ you can easily get files off of, create a file called Stream.strm, and add this\
    \ line to it, with IP as the last two sets of Pi’s IP address:\n\n```\nudp://239.255.[IP].[IP]:1234\n\
    ```\n\nSave it and move it to your XBMC clients that you want to receive the cast\
    \ from.\n\n![](img/daaca9116bc2b1db669c224de81abc7c_56_1.png)\n\n![](img/daaca9116bc2b1db669c224de81abc7c_56_2.png)\n\
    \n# 03 Boot-time mount parameters\n\nYour hard drive will likely be mounted as\
    \ /dev/sda1, but do a disk -l if you want to double check. To make sure it mounts\
    \ at boot, go to fstab with sudo nano /etc/fstab and write the following line\
    \ below, with a tab between each bit of information:\n\n```\n/dev/sda1\t\t/home/pi/mediadrive\t\
    nfs3-g\ndefaults,noatime\t\t\t\t\t\t\t\t\t\t0\t\t\t\t\t\t\t\t0\n```\n\n# 06 Custom\
    \ VLC command\n\nHere’s the really fun part. Go back to your Pi and right click\
    \ on one of the files you’d like to play, go to Properties and click the down\
    \ arrow next to Open with, Go to Customise and then Custom Command Line and type\
    \ in the following, with IP as the last two sets on your IP address:\n\n```\n\
    cvlc --sout udp:239.255.[IP].[IP] %f\n```\n\n# 04 Install VLC on Pi\n\nSo all\
    \ our media is now accessible, and now we need a way to broadcast it. For this\
    \ we’ll use multi-functional media player VLC, which was originally designed to\
    \ be the client for a casting server. You can install it with:\n\n```\n$ sudo\
    \ apt-get install vlc\n```\n\n# 07 Test out casting\n\nHere’s the big test: boot\
    \ up XBMC, open your media on the Raspberry Pi and use the Stream file on XBMC\
    \ to receive the cast. It might take a moment to load but it will start playing\
    \ via XBMC in short time.\n\n# 08 Command line alternative\n\nYour setup may not\
    \ always be convenient for you to go to the Pi and start launching files from\
    \ the desktop. You can always SSH into your Pi from another computer or an Android\
    \ device and run the file using a similar custom command to the one we used earlier:\n\
    \n```\n$ cvlc --sout udp:239.255.[IP].[IP] [file location]\n```\n\n# SSH into\
    \ your Pi from another computer or an Android device\n\n# Be inspired\n\nWhy not\
    \ add a web interface to your Pi so that you can browse from your laptop or smartphone?\
    \ Have it run the multicast code when clicking on files it’s scraped from the\
    \ media drive to make the process much easier. You can also fuse the project with\
    \ our cloud server in a few pages time."
  merge: -1
  img_proc: true
