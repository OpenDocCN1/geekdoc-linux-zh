  md: '# 10 Inspiring Raspberry Pi projects


    ![](img/daaca9116bc2b1db669c224de81abc7c_52_0.png)


    When attaching the side panel to the screen, speaker and buttons, we suggest ignoring
    the instruction to carefully lift the panel off your work desk. Instead, try sliding
    it slightly off the desk itself so that you can access each screw one at a time
    without having to precariously balance the sections at an angle.


    ```

    ```

    $ wget http://adafruit-download.s3.amazonaws.com/cupcade-5-13-2014.img.zip

    ```

    ```


    Write it to a 4 GB card (your Cupcade comes with one), download the free, non-commercial
    ROMs, they provide to test the setup and power it up with a proper plug adapter.
    The components are running directly off the Pi and can be quite power-hungry,
    so it''s imperative that you properly power it.


    The image we''ve written has a full MAME arcade emulator in it, and a NES emulator.
    They''re both configured to use the buttons you''ve installed on the case by default:
    this means that because the NES emulator directly maps the cabinet''s A and B
    buttons to its own A and B, the layout is the reverse of the NES controller, which
    had A on the right and B on the left. Depending on what you plan to use the cabinet
    for, you can either swap over the buttons or just get used to a slightly altered
    control scheme.


    How can we expand the Raspberry Pi from here to create a full-sized cabinet? The
    good news is that the emulators will still work when you use the HDMI port for
    output instead, allowing you to hook it up to a normal TV. The buttons and speakers
    will still work as well and they can be plugged straight into the Raspberry Pi''s
    GPIO port via a connecting ribbon, like we used with the board to the screen.
    However, this does leave you with only four buttons and the small joystick; luckily
    there are plenty of USB arcade sticks and components that can be connected via
    USB, and with the right configuring you can get them working on the emulators
    just fine.


    There''s a lot more you can do with the Pi once you''ve got it set up in a cabinet,
    such as letting it connect to the network so you can remotely maintain it without
    having to disassemble the entire thing to retrieve an SD card. Make sure you do
    your research on specific parts and look out for any community forums that will
    definitely have helpful advice on what to buy.


    ![](img/daaca9116bc2b1db669c224de81abc7c_52_1.png)


    +   - **Top left:** You can always reverse the button mapping for traditional
    NES-style control

    +   - **Top right:** The Raspberry Pi sits snugly below a great bale of wires

    +   - **Bottom:** Upgrading to a full-size arcade cabinet is easily done, as the
    principles are the same as with the Cupcade build


    > > The emulators will still work when you use the HDMI port to hook it up to
    a normal TV


    ![](img/daaca9116bc2b1db669c224de81abc7c_52_2.png)


    # Be inspired


    One of the best arcade cabinet projects we''ve seen has been featured on the Raspberry
    Pi blog: [bit.ly/lpWJGWE](bit.ly/lpWJGWE)


    Using an old arcade cabinet for parts, the maker managed to modify the inputs
    to re-add the Joystick and got the coin slot to work. You don''t need to go this
    far by getting a CRT monitor or even an old busted cabinet, but it certainly adds
    a flair of authenticity to a project like this.'
