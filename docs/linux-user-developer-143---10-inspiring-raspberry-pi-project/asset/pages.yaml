- pgno: 58
  md: "![](img/daaca9116bc2b1db669c224de81abc7c_58_0.png)\n\n![](img/daaca9116bc2b1db669c224de81abc7c_58_1.png)\n\
    \n![](img/daaca9116bc2b1db669c224de81abc7c_58_2.png)\n\n# ## Secure Tor web station\n\
    \nStay private online by routing all your web traffic through Tor on your Raspberry\
    \ Pi\n\nIn a much more privacy-focused world, being able to browse securely online\
    \ is an important freedom for many people. With the use of Tor and a few tweaks\
    \ to the Raspberry Pi, you can make sure all your internet traffic is kept private.\n\
    \nFirst of all, you'll need to make sure to install Tor from the repos. Open up\
    \ the LXTerminal and simply type:\n\n```\n`sudo apt-get install tor`\n```\n\n\
    Once that's done, edit the torrc file by using sudo nano /etc/tor/torrc and add\
    \ this to the top of the file:\n\n```\n``` \nVirtualAddrNetworkIPv4 10.192.0.0/16\n\
    AutoMapHostsOnResolve 1\nTransPort 9040\nDNSPort 53\n```\n```\n\nSave this file\
    \ and then open the next file with sudo nano /etc/resolv.conf file and modify\
    \ it:\n\n```\n`nameserver 127.0.0.1`\n```\n\nFinally, you need to change the iptables\
    \ ruleset, but before you do this, use top to confirm the uid of Tor and make\
    \ a note of it. Now open up a new file with nano /etc/init.d/iptables and enter\
    \ the code found at: [http://www.linuxuser.co.uk/wp-content/uploads/2014/08/tor.tor.zip](http://www.linuxuser.co.uk/wp-content/uploads/2014/08/tor.tor.zip).\
    \ Now save it and enter:\n\n```\n``` \nchmod 755 /etc/init.d/iptables\nupdate-rc.d\
    \ iptables defaults 12\n```\n```\n\n```\n``` \n$ wget http://www.linuxuser.co.uk/wp-content/uploads/2014/08/repeater.zip\n\
    $ cp LXDRepeater.conf /etc/hostapd/hostapd.conf\n```\n```\n\nDo a reboot and test\
    \ the configuration file with:\n\n```\n`$ hostapd -dd /etc/hostapd/hostapd.conf`\n\
    ```\n\nIf there are no errors, open the file using nano /etc/hostapd/hostapd.conf\
    \ and then add the following into the file:\n\n```\n``` \nDAEMON_CONF=\"\"/etc/hostapd/hostapd.conf\"\
    \"\nRUN_DAEMON=yes\n```\n```\n\nAlso change the SSID to be the same one for your\
    \ network in the ssid field. Once that's done, you'll need to install the bridge\
    \ utilities with apt-get install bridge-utils. Then configure it with the following\
    \ four commands:\n\n```\n``` \nbrctl addbr bridge0\nbrctl addif bridge0 wlan0\n\
    brctl addif bridge0 wlan1\nifconfig bridge0 up\n```\n```\n\nTest it out to make\
    \ sure it works and then place it around the house to extend your wireless signal!\n\
    \n# ## Put 'em together\n\nA secure wireless connection can be created using the\
    \ Raspberry Pi by looking at the Onion Pi project from Adafruit: [learn.adafruit.com/onion-pi/overview](http://learn.adafruit.com/onion-pi/overview)\n\
    \nThis creates a wireless access point connected to the internet that anonymises\
    \ all web traffic by directing it through the Tor network.\n\nThis means all your\
    \ home computers and smart devices can be connected to Tor and not just the Raspberry\
    \ Pi itself. You can also apply some of the lessons learnt in the Wi-Fi repeator\
    \ tutorial to unshackle it from the ethernet cable, although that will reduce\
    \ slightly its overall security."
  merge: -1
  img_proc: true
- pgno: 59
  md: '# **Feature**


    # # Private cloud storage


    Turn the Pi into your own personal Dropbox using ownCloud and an internet connection


    ![](img/daaca9116bc2b1db669c224de81abc7c_59_0.png)


    The themes of a lot of our Raspberry Pi guides revolve around the size and portability
    of the Pi itself, lending it to tasks you may have used a full-sized or small
    computer for in the past that the Pi can now take over. Having your own private
    cloud is another excellent use of the Raspberry Pi''s capabilities, because you
    can store it hidden away somewhere and it will require very little day-to-day
    maintenance. Make sure you invest in some decent, portable USB storage such as
    an external HDD, and also get a case for your Pi in the process.


    ![](img/daaca9116bc2b1db669c224de81abc7c_59_1.png)


    # 01 **Set a static IP**


    After setting up your wired or wireless internet connection, you need to make
    it static. Use sudo nano /etc/network/interfaces to open up the network settings
    file. Find the face eth0 line so you can change and add to it:


    ```

    ```

    iface eth0 inet static

    address 192.168.0.50

    gateway 192.168.0.1

    netmask 255.255.255.0

    network 192.168.0.0

    broadcast 192.168.0.255

    ```

    ```


    # What you''ll need


    +   - External storage

    +   - Constant internet connection


    > *Left* Rather than store all your media and files on a cloud server in an unknown
    location, you can keep a cloud in your own home'
