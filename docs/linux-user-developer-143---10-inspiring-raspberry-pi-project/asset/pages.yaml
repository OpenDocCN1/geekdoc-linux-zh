- pgno: 63
  md: "![](img/daaca9116bc2b1db669c224de81abc7c_63_0.png)\n\n# Outdoor\ntime-lapse\
    \ camera\n\nGet beautiful views of the sunset using your Raspberry Pi, a Pi camera\
    \ and a small Python script\n\n+   **What you’ll need**\n+   \n+   *   Pi camera\
    \ module\n+   *   A weatherproof case, such as a PICE+\n\nWe love the Raspberry\
    \ Pi camera. It’s a lovely little piece of kit that is as versatile as the Pi\
    \ and it doesn’t even take up any of the USB slots. We’ve done a bit of time-lapse\
    \ photography in the past but that was using a proper camera attached to the Pi\
    \ – now we’re doing it with just the Pi camera and a lot less code thanks to the\
    \ picamera Python module.\n\nWe need to set up our Pi with a few things before\
    \ we start with the code, though. We’ll start off by assuming you’ve got a freshly\
    \ installed Raspbian SD card, so the first thing to do is an apt-get update followed\
    \ by an apt-get upgrade to make sure your files are up to date. Follow this with\
    \ an rpi-update to make sure your firmware is also up to date – this step is very\
    \ important because if you’re using an outdated firmware then the camera won’t\
    \ work.\n\nThe next step is to get the camera enabled. Open up the terminal if\
    \ you’re on the desktop, or simply write into the command line:\n\n```\n`$ sudo\
    \ raspi-config`\n```\n\nFind the Enable Camera option. Press Enter and key over\
    \ to Enable. Go to Finish but don’t restart straight away as you have some more\
    \ commands to get through. Install your picamera module using this:\n\n```\n`$\
    \ sudo apt-get install python-picamera`\n```\n\nYou also need to install the software\
    \ that you’re going to use for compiling your images into the finished time-lapse\
    \ video. We’re using gstreamer to compile the video as it works well with the\
    \ Raspberry Pi GPU. To get it installed, first add the repo to the sources list\
    \ with the:\n\n```\n`$ sudo sh -c 'echo deb http://vantaane.de/raspbian-updates/\
    \ . main >> /etc/apt/sources.list'`\n```"
