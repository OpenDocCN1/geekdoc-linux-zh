  md: '# Design advanced user interfaces for Android


    Create complex GUIs with minimal effort and learn your way around the system


    The previous instalment of our Android tutorial concluded with a small RSS reader,
    which displayed the results of the downloading process in a text view. This is
    not particularly elegant: using a list and a dedicated form would lead to a much
    nicer app.


    Both Palm OS and Windows Mobile provided developers with an easy-to-use list box.
    Developers provided the widget with a batch of strings, which were then displayed.
    Android’s list architecture is more academic, forcing applications to be designed
    around a relatively complex set of classes which act as a broker between the stored
    data and the widgets used for its display.


    Tablets provide a new source of grief. Their larger screens can not be utilised
    efficiently by “normal” programs, instead demanding a complete redesign of your
    interface. Fragments can be used to simplify this process by dividing the user
    interface into smaller components. These can then be arranged in order to form
    different layouts that are ideally suited to the screen at hand.


    ```

    <xml version="1.0" encoding="utf-8">

    <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent"
    android:layout_height="wrap_content" android:orientation="horizontal">


    <TextView android:id="@+id/textLarge" android:textSize="38sp" android:textStyle="bold"
    android:textColor="#FF0000" android:layout_width="40dp" android:layout_height="wrap_content"/>


    <TextView android:id="@+id/textSmall" android:textSize="16sp" android:textColor="#000000"
    android:layout_width="fill_parent" android:layout_height="wrap_content"/>


    </LinearLayout>

    ```


    Using these features is surprisingly very easy, once the basic concepts have been
    understood. Let us guide you through the world of advanced user interfaces for
    smartphones and tablets.


    We will get started by creating a new fragment which will host an “overview” of
    the elements found in the folder. Right-click the folder res/ layout, and select
    “New>Android XML File”, and select “LinearLayout” from the list of Root Elements.
    Select a name and click Finish in order to create the new file. Replace its code
    with that in **Fig. 01**.


    Android’s list engine permits you to create widgets whose individual lines are
    populated from an XML resource. At runtime, the operating system simply rescues
    the layout in its entity, and squashes it into the list.


    In the next step, the fragment must be created. For now, FeedListItemFragment.java
    is to be populated with the code in **Fig. 02**.


    ListFragment-derived classes are provided with a ListView out of the box. Our
    code limits itself to assigning a data source to the list, so that the elements
    can be displayed. The context


    object must be passed in from the caller, as the getlActivity function can be
    unreliable during the setup routine.


    Finally, adjust the structure of MainActivity in order to push the new fragment
    onto the screen by adding the code in **Fig. 03**.


    Google’s default project skeleton comes with a routine which uses the fragment
    manager to push a single fragment onto the screen. We simply modify the class
    declaration in order to use an instance of our FeedListItemFragment, which gets
    set up before it gets deployed.


    # Processing data


    Our display infrastructure is ready. Sadly, the data generated by the HTTPTask
    currently can not be displayed anywhere – the list framework has no way to figure
    out what it should do with the vector passed in.


    As mentioned before, adapter classes act as a “broker” between the list and its
    data. The getCount() function is used in order to inform the operating system
    about the number of items which need to be displayed.


    ![](img/daaca9116bc2b1db669c224de81abc7c_45_0.png)


    **Left:** We can tailor our app so that it will work differently depending on
    if it’s in portrait or landscape'
