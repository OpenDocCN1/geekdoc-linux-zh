  md: "# # Raspberry Pi Model B+\n\nIs it worth the upgrade?\n\n**REVIEW**\n\n![](img/daaca9116bc2b1db669c224de81abc7c_84_0.png)\n\
    \n**GPIO pins** The B+ has had its ports upgraded to a respectable 40. There’s\
    \ nothing new that the ports can do – though they all have duplicated functions\
    \ from other ports – but what it does mean is that you have more choice\n\n**USB\
    \ 2.0 ports** Doubling the USB ports up to a total of four gives you so many more\
    \ possibilities – even if it’s as simple as being able to have mouse, keyboard,\
    \ wireless and storage all connected at once\n\n**Ethernet port** Largely remaining\
    \ the same, the ethernet port is still the only network interface connected by\
    \ default to the Model B+\n\n**MicroUSB power** The placement of the power socket\
    \ has changed, and we believe it makes the Pi tidier. Benchmark tests have shown\
    \ that the B+ uses significantly less power than the B, but a 1.5 A supply is\
    \ still recommended\n\n**3.5mm headphone jack** Moved so it lives next to the\
    \ HDMI port, the 3.5mm jack is not only sleeker and more streamlined, it’s also\
    \ received some audio improvements and is able to output a higher quality feed\n\
    \n**HDMI port** With the 3.5mm jack on the same side of the board as the HDMI\
    \ port, all the AV connectors are grouped together. The HDMI is no different from\
    \ the B and still delivers high-def digital video and audio\n\n> “This isn’t a\
    \ ‘Raspberry Pi 2’, but rather the final evolution of the original Raspberry Pi”\n\
    > \n> — Eben Upton, Raspberry Pi Founder"
