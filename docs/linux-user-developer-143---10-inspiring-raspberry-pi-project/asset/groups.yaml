    ## 使用 ownCloud 7 升级您的私有云


    更高效地访问、同步和共享您的数据


    教程


    ![](img/daaca9116bc2b1db669c224de81abc7c_34_0.png)


    ### 您的数据 - 由您掌控


    借助 ownCloud，您可以同步和共享文件、日历、联系人等更多内容。您可以通过开放平台在所有设备上访问您的数据，并对其进行扩展和修改。


    ### 01 用户界面


    在 ownCloud 7 中，旧的用户界面已被整洁清爽的新界面所取代——其重点明确地放在了共享和功能分区上。现在您访问的几乎所有页面都有共享选项。如果您使用过旧版本，您会注意到许多变化：左侧菜单栏现在仅显示您当前所在部分的相关选项。您可以通过左上角的下拉菜单选择各个部分；可用的部分包括文件、活动、图片、联系人、日历、书签和应用。例如，如果您在“文件”部分，您只能看到与文件相关的选项，当您切换到其他部分时，这些选项也会随之改变。不过，与用户相关的菜单保持不变；您可以通过点击右上角用户名旁边的下拉菜单来访问它。


    ### 02 文件


    作为云存储工具，文件处理可能是 ownCloud 最重要的方面，而最新版本在这方面更上一层楼。以前很难追踪其他人（与您）共享的文件和您自己的文件，但在 ownCloud
    7 中，您可以选择分别查看共享给您的文件或由您共享的文件。现在，通过链接共享的文件也可以单独查看。不过，共享操作保持不变；只需将鼠标悬停在要共享的文件上，您就能看到共享图标以及下载和版本选项。与以前一样，文件可以共享给您
    ownCloud 群组和用户，或通过链接共享给不在您 ownCloud 中的某人。旧的改名选项现在已缩减为一个图标，放置在离文件名更近的位置。


    ### 03 活动


    以前，在使用 ownCloud 时，您基本上是自己一个人。即使有其他用户在忙碌，对您来说也是不可见的。没有办法清楚地了解正在发生的事情。考虑到如今在线互动的重要性，这多少有些令人烦恼。最新版本的发布解决了这个问题。“活动”现在是左上角菜单下的一个部分，它让您可以看到（甚至可以发送电子邮件通知给您）周围的活动。您可以看到是否有人共享了文件、重命名或删除了文件等。同样，在这里您也有选项仅查看您的活动、他人的活动，或者两者的活动。


    ### 04 联系人与日历


    在此版本中，联系人功能已完全重塑。以前只有少数字段存储了非常少的相关信息，但现在联系人部分可以捕获完整的数据，如电子邮件地址、电话号码等。您甚至可以根据需要选择为联系人添加额外字段。前往联系人部分查看其实际效果。日历也看起来像是一个全新的功能（尽管旧的
    ownCloud 有一个极简日历，但每个选项都隐藏在右侧的设置图标后面）。现在日历清晰地显示在左侧面板中。这里没有添加额外功能，但链接的位置确实更好，这有助于提高功能的可操作性。


    ![](img/daaca9116bc2b1db669c224de81abc7c_34_1.png)


    ### 05 协同编辑


    作为一个用于数据共享的云平台，ownCloud 表现非常出色，但使用 ownCloud 进行协作稍微有些困难。现在这种情况已经不再存在。OwnCloud 现在允许多达五名不同用户同时编辑相同的
    ODT 文件。您甚至不需要启用此应用程序；它开箱即用。以下是您需要做的：进入“文档”部分，上传您想要协作的文件。上传后，通过点击最左侧的“共享”按钮将其共享给相关用户/群组。（请在共享时注意给予足够的权限）。现在，一旦共享，其他用户只需登录并进入“文档”部分，即可编辑文档，即使该文档在别处处于打开状态。为了更清晰，正在访问该文档的所有用户姓名都显示在文档编辑页面上，并且所有编辑操作都按颜色编码。


    ![](img/daaca9116bc2b1db669c224de81abc7c_35_0.png)


    ### 06 配置外部存储


    从 ownCloud 6 开始，我们就有了启用外部存储应用程序并添加二级存储的选项。您可以使用本地驱动器——Dropbox、Google Drive，甚至
    Amazon S3 服务器——作为二级存储。然后，您可以使用加密应用程序对存储在 ownCloud 和外部存储中的数据加密。让我们以添加本地存储然后加密内容为例（请注意，只有新添加到外部存储的数据会被加密）。假设您已系统将一个新的
    USB 驱动器，并希望将其作为存储空间添加到您的 ownCloud 中。启用“外部存储支持”应用程序。启用应用程序后，转到管理页面的“外部存储”部分。现在从下拉菜单中选择存储类型为“本地”，在配置下填写外部驱动器的绝对路径，最后添加您希望访问该驱动器的用户/群组。如果一切正常，您应该能在最左侧看到绿灯。如果是红灯，则存在问题。此驱动器现在应在“文件”部分下显示为“外部存储”。要加密文件，只需启用“加密”应用程序并重新登录以生成加密密钥并加密数据。


    ### 07 任务增强


    协作通常取决于任务在每位协作者之间定义得有多清楚。虽然核心 ownCloud 不支持任务或列表，但“任务增强”应用程序在管理任务时非常有用。然而，这个插件并不随默认安装捆绑。您需要从应用程序商店下载文件并将其放置在
    ownCloud/Apps 文件夹中。然后，当您访问 ownCloud 中的应用程序页面时，您应该能看到“任务”插件，只需选择它并点击启用。插件启用后，您可以在左上角菜单中看到新选项“任务”。在任务页面，您可以添加列表，然后在列表中添加任务。当您添加一个列表时，会创建相应的日历，因此整个列表和相关任务可以在
    ownCloud 中共享（您可以与其他用户共享您的日历）。


    ### 08 ocDashboard


    您是否在工作时突然想去谷歌查点什么？也许您想查看周末的天气，或者看看新闻里有什么新鲜事。互联网上这种干扰有很多，大多数时候这都没问题。但如果您发现生产力受到影响，那么仪表板应用程序是一个消除这些干扰的好方法。它需要像前面的应用程序一样下载和安装。安装后，您在左上角菜单中获得“仪表板”选项。要管理仪表板设置，请转到您的个人页面（右上角菜单
    » 个人）。在这里，您可以添加各种仪表板项目，如时钟、日历、天气、搜索、活动、新闻等。它甚至支持任务；您可以启用任务应用程序，然后在您的仪表板上查看它们。


    ![](img/daaca9116bc2b1db669c224de81abc7c_36_0.png)


    ### 09 文件移动


    ownCloud 中的默认文件管理允许您重命名或下载文件，并使用拖放移动文件。如果文件较少，这样没问题，但当您需要处理大量文件时，这可能效率低下，因为文件越多，意味着需要更多的文件夹来分类相关文件！在这种情况下，“文件移动”应用程序可以提供帮助。只需从
    ownCloud 应用程序网站下载并启用它。一旦启用，您可以直接访问文件页面。在这里，当您悬停在文件/文件夹上时，可以看到移动文件的选项。


    当您点击移动图标时，该文件的所有可用目的地会自动列出。您只需选择正确的目的地并点击移动。


    ### 10 ocGame


    好了，就说这么多关于生产力的事！现在我们可以简单看看 ocGame 应用程序，它将一些更传统的电脑游戏集成到您的 ownCloud 安装中。像往常一样，下载后启用它，您会在左上角菜单中获得“Games2+”链接。这个页面有像扫雷、井字棋、一字连等游戏。虽然这些游戏与手机游戏水平不太一样，但它们能短暂娱乐，并绝对能帮助您在工作紧张后放松神经。


    ![](img/daaca9116bc2b1db669c224de81abc7c_36_1.png)


