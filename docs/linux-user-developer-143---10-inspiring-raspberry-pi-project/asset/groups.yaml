    \ **树莓派**\n\n## 目录\n\n- **66** 进一步阅读和启发性资源\n- **68** Pi 项目：Andrew Langley 的 Pi2D2\n\
    - **70** 常见问题解答：树莓派 Model B+\n- **72** Python 专栏：Pi 上的科学\n\n## 10\n**令人激发的 Pi\
    \ 项目**\n**激发你的想象力并测试你的 Python 技能**\n\n过去几年里，树莓派已经走了很长的路，这一切都归功于一个蓬勃发展的社区的创造力和想象力，他们购买了三百万多台这些单板计算机。它们为四旋翼飞机和咖啡机供电，用于自主帆船，甚至触及了太空的边缘，但自发布日以来仍然与之前同样需求旺盛的是创意。\n\
    \n我们的树莓派社区运作如此良好，是因为我们彼此分享工作成果。我们可以看到其他人都在做什么，如果我们看到喜欢的东西，我们可以尝试自己制作 - 然后改变它，以便我们可以分享不同的版本。一切都关乎灵感。\n\
    \n因此，在这期中，我们为你们制作了十个令人激发的项目供你尝试 - 我们鼓励你当新想法浮现时偏离步骤，并告诉我们你的项目将你带向何方！这里有一系列不同的项目供你尝试，涵盖媒体和娱乐、网络、安全等。每个项目所需的组件都在页面上列出，如果你翻到本特性的末尾（第\
    \ 66-67 页），你会找到进一步资源的汇总。你也可以从我们的网站获取这些项目的完整代码。\n\n还有一件事要提到 - 我们的一些树莓派创作旨在进行组合，以便在你开始将这些项目改编成你想要的方式时给你一个很好的起点。如果你想到了任何我们遗漏的组合，请务必给我们发一张照片的推文\
    \ - 并在制作过程中享受乐趣！\n\n## 10 令人激发的树莓派项目\n\n- **54** 有声读物播放器\n- **55** 网络收音机\n- **56**\
    \ 媒体投送器\n- **58** Wi-Fi 中继器\n- **59** 安全网络站点\n- **60** 私有云\n- **62** AirPi\n-\
    \ **63** 暮光灯光\n- **64** 延时摄影相机\n\n![](img/daaca9116bc2b1db669c224de81abc7c_50_0.png)\n\
    \n# 特性\n\n## 复古街机机柜\n\n![](img/daaca9116bc2b1db669c224de81abc7c_51_0.png)\n\n\
    创建一台微型街机机器，并学习如何将其扩展为配备完整游戏的机柜\n\n我们的办公室是传奇杂志《Retro Gamer》的家园，当树莓派在几年前发布时，团队立即认识到它作为自制、使用\
    \ MAME 的街机机器的优秀设备的潜力。\n\n在我们编辑与《Retro Gamer》的编辑交谈之后，团队确信，也许有一天他们会使用树莓派或另一台由 Linux\
    \ 驱动的机器在未来运行一个机柜。\n\n他们并不是唯一意识到树莓派在街机机器中搭配得多好的人；自那以后已经完成许多项目并取得了令人印象深刻的结果。如果你目前还不打算雕刻定制木件，你随时可以从\
    \ Adafruit 的 Cupcade 套件开始，从小处着手。该套件由激光切割塑料面板、PITFT 屏幕、一组按钮、定制板和一个可以组装成微型 MAME\
    \ 街机机柜的特殊摇杆组成。\n\n不幸的是，目前，Cupcade 仅支持原始的 Model B。然而，我们喜欢 Model B：把它看作是一个很好的借口，测试你的\
    \ Model B 是否胜任为街机机器供电的任务，以防你想扩展。如果不是，这意味着你需要另一台树莓派来替换街机的那台，在这种情况下，你可以升级到 Model\
    \ B+（见我们第 92 页开始的评测）。\n\n当你收到套件后，你需要逐步组装组件。这是一个漫长的过程，我们在这期中没有足够的空间详细介绍，因此我们将引导你参考优秀的\
    \ Adafruit 构建 Cupcade 的说明。 https://learn.adafruit.com/cupcade-raspberry-pi-micro-mini-arcade-game-cabinet/\n\
    \n简短的警告：完成它需要几个小时，所以确保你有充足的时间。它在某些地方相当繁琐，所以请第二双手来帮助你可能值得一试。\n\n### 你将需要什么\n\n\
    - 树莓派 Model B\n- Adafruit Cupcade (adafruit.com/product/1763)\n- 1.5 A 电源\n- 烙铁\n\
