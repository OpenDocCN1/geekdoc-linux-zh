    8 | Best used for network analysis, rather than managing your connections 6 |
    Perfect for the job and with a wide range of customisable settings 9 |


    # AND THE WINNER IS...


    # Wicd


    It really was a tough one, with the battle ultimately coming down to GNOME Network
    and Wicd, but in the end it was Wicd''s wide array of deeply customisable features
    and smart design that gave it the edge. While GNOME Network is a better-looking
    and better-functioning GNOME app most, the minimal design isn''t for everyone
    - especially those who are looking to go into more detail on certain aspects of
    their network and connections. With Wicd, having all of the tools and information
    readily available doesn''t translate into the kind of complexity you get with
    Network Tools. Instead, it''s just as easy to use as GNOME Network but with way
    more for you to actually play with.


    ![](img/daaca9116bc2b1db669c224de81abc7c_77_0.png)


    ![](img/daaca9116bc2b1db669c224de81abc7c_77_1.png)


    > Wicd is packed with options for both individual connections and your whole network


    Feature-wise, we particularly like the separate connection profiles - a real boon
    if you find yourself switching between connections that require different settings
    quite often. More than that, though, is the fact that all of the advanced options
    are hugely configurable. If you find yourself needing to step beyond the usual
    day-to-day use of a network manager, it''s likely you won''t have to go for a
    secondary tool as you would with something like GNOME Network. Unless, of course,
    you''re concerned about the lack of privacy features - our only real gripe with
    this otherwise excellent network manager.


    Rob Zwetsloot'
