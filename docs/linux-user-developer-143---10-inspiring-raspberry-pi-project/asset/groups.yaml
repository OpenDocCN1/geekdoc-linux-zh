    \ at the time who should have known better. As recently as 2003 Scott McNealy,\
    \ CEO of Sun Microsystems, dismissed GNU/Linux as a \"great environment for the\
    \ hobbyist\", but not for the enterprise. He was proved wrong in subsequent years\
    \ as Linux replaced Solaris as the chosen platform for enterprise server farms\
    \ and Sun went into terminal decline.\n\nLinux undeniably had its roots and inspiration\
    \ among hackers and hobbyists. Far from being a drawback, this is what gave Linux\
    \ its vibrant drive and energy. The developers had little urge or necessity to\
    \ satisfy the usual commercial urges or imperatives, and the software developed\
    \ organically as an expression of the collective talents of the contributors.\
    \ Linux and GNU demonstrated the power and potential of distributed software development,\
    \ where anybody from any walk of life could contribute to the whole, and find\
    \ a sense of achievement as an equal partner.\n\nAt one extreme, the projects\
    \ that sprang from the nascent Linux community abounded with high-achievers. At\
    \ the other end, those who had made a mess of their academic careers, or had developed\
    \ enthusiasms far removed from their working lives and academic opportunities,\
    \ were able to dip into the code and make a difference in an atmosphere that was\
    \ ultimately democratic.\n\n### Packaged for delivery\n\nLinux and GNU allowed\
    \ home users the ability to explore the possibilities of the code, and the networking\
    \ potential of their machines. Linux had replaced The Hurd as the kernel at the\
