    \ '{print $2, $1}' > timeN.txt\n```\n\n包含数据的文本文件（timeN.txt）的格式如下：\n\n```\n00 191\n\
    01 225\n02 121\n03 104\n```\n\n读取 timeN.txt 文件并将其赋值给新的数组变量可以按以下方式进行：\n\n```\n\
    \ aa = np.loadtxt(\"timeN.txt\")\n```\n\n### 06 写入文件\n\n将变量写入文件与读取文件大体相似。如果你有一个名为\
    \ aal 的数组变量，你可以使用以下命令轻松将其内容保存到名为 aal.txt 的文件中：\n\n```\nIn [17]: np.save(\"aal.txt\"\
    , aal)\n```\n\n如你所想，你可以稍后使用 loadtxt() 函数读取 aal.txt 的内容。\n\n### 07 常用函数\n\nNumPy\
