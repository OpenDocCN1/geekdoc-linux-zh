    \ Dropbox 账户上拥有与系统上相同的文件夹层级——这样，我们上传的每个文件都将处于与系统中每个文件相同的相对位置。通过调用 `client.metadata()`，我们可以检查目录是否已存在。如果目录尚未存在，Dropbox\
    \ SDK 将抛出错误。这是一个 RestResponse，我们可以捕获它，然后使用 `client.file_create_folder(path)` 端点创建所需的目录。很简单。（图\
