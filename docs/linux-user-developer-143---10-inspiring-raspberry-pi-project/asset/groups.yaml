  - '[PAGE 14]


    # ## Firefox OS app development


    Create, edit and test web apps in the Firefox browser


    FEATURE


    ![](img/daaca9116bc2b1db669c224de81abc7c_14_0.png)


    With Firefox OS, an operating system completely based on open-web standards and
    on the Linux kernel, Mozilla wants to prove that the web is the platform for development,
    regardless of tools, languages or devices. As part of this initiative, it''s recently
    introduced a powerful new design to the OS, and in-browser performance debugging
    features. The real unique new feature is a full-fledged development IDE in Firefox
    Nightly that will make it easier to create and build web apps without any overhead.


    With so many different tools and templates available when creating and designing
    your app, it can be hard to know where to start. In this article, we''ll be looking
    at the in-built Firefox features, where to find the right tools to help you use
    them and giving you handy hints and tips on how to improve and progress your development.


    # ### Getting started


    To get started on the WebIDE, This can be found in your developer tools bar menu.
    Once open, select ''new app'' from the menu bar and you will find a number of
    example starter templates to choose from. Save the template to your desktop. Within
    the template you can select the index.html file to view the blueprint app and
    source files that are already set up for you.


    > > The community is working hard to bring an even greater choice of templates
    for different use cases


    Advanced developers can work with Mozilla to build these starter templates. So
    while a good few are available already, the community is working hard to bring
    an even greater choice of templates for different use cases. If you would like
    to become part of the community and contribute templates then visit github.com/mozilla/mortar.


    # ### Editing


    Once you''ve started your project, you can edit the source files in WebIDE. Its
    integrated editor - based on the open source CodeMirror editor with the Tern.js
    code analysis framework - gives you a simple but powerful editor for


    Chris Heilermann has a focus on the Open Web and HTML5. He built his first website
    around ''99 and spent the following years working on lots of large, international,
    Web projects. Chris wrote and contributed to four books on Web development and
    was editor-in-chief of Ajaxian, OneStopMagazine, and Stash.builds.


    # ### Christian Heilmann


    Mozilla Developer Evangelist'
  - '[PAGE 15]


    # Feature


    # App design perks


    Firefox Beta for Windows, Mac, Linux and Android introduces some powerful new
    features and tools to help developers create and build web content, apps and add-ons
    more easily than before.


    **Firefox Hub APIs:** Firefox Beta includes support for Firefox Hub APIs, allowing
    add-on developers to add their own content to the Firefox for Android homepage
    (where users find bookmarks, top sites etc), providing them with a large area
    to entice users to interact with their add-on. For more details about building
    add-ons with these APIs, check out the documentation on MDN and see this collection
    of experimental add-ons as examples. **mzl.la/1tZ2FLv**


    **APK Factory Performance and Stability Improvements:** Mozilla has been working
    on providing more performance improvements to this ‘native experience’ for web
    apps on Firefox for Android. Using APK Factory, Firefox OS app developers can
    now target millions of Firefox for Android users without changing a line of their
    app code. By giving web apps native updates, native installation and native app
    management, developers can now provide a more familiar way for users to manage
    their web apps. The APK Factory also ensures web apps use a modern up-to-date
    runtime, so there are no performance degradation or compatibility issues.


    ![](img/daaca9116bc2b1db669c224de81abc7c_15_0.png)


    > *Abou* You can use WebIDE as a simple interface for managing runtimes and validating
    apps


    HTML, JavaScript, and CSS files. Test out the editing by adding in a heading <h1>
    tag and see your heading appear within the template. Editing is only a small part
    of what the WebIDE does for you. It automatically validates your web application
    manifest and creates and installs a packaged app either in a simulated runtime
    or on a device connected via USB. The application validator ensures that your
    application has a valid manifest file, a requirement for submitting to the Firefox
    Marketplace. While the IDE is enough for your basic editing needs, you might want
    to use your own preferred editor instead. To do this you can connect your editor
    to the toolchain of the WebIDE with a simple API. This one allows external editors
    to access all the advanced functionality of the tool – its runtime


    # Publish your HTML5 apps to other platforms with Apache Cordova


    management, pushing applications to different devices and connecting Firefox Developer
    Tools. You can turn off the internal editor and use WebIDE as a simple, clean
    interface for managing runtimes and validating applications.


    # Runtimes and Testing


    When you’re ready to test your application, choose a runtime – install Firefox
    OS or connect to your Firefox OS device. Once connected to a runtime, you can
    use the tools that you’ve used in desktop Firefox to try your application. You
    have the same sort of rapid iteration that makes developing for the desktop web
    simple – just hit Ctrl/Cmd+R to reload the application on your device or simulator.
    You can get information about the device and runtime and take screenshots.


    # Improved manifest management


    You can publish your HTML5 apps to other platforms than the web and Firefox OS
    by using Apache Cordova tools, which now support Firefox OS in addition to Android
    and iOS. Before we dive into these features, make sure you have the latest version
    by running:


    ```

    $ sudo npm install -g cordova

    $ sudo npm install -g plugin

    ```


    In order to turn any HTML5 page into a Firefox OS app, you need to create a manifest
    file. This file has crucial information that Firefox OS needs in order to interact
    with your app. Cordova has a configuration file called config.xml that already
    contains the same information needed for the manifest file. Cordova will create
    and update the manifest based on your config.xml file. In the new version, plugins
    can add configuration specifying which permissions are necessary. Whenever you
    run a Cordova prepare, the manifest is updated based on your configuration. Now
    you can have all your app’s information in one place.


    # Converting your app to Android


    With the new Firefox for Android, we will now automatically convert your Open
    Web App into a native Android app. This means you probably also want to test your
    app on Android, before we submit it to the Marketplace. **mozilla-apk-cli** is
    a command-line application that makes testing your app easy (**github.com/mozilla/apk-cli**):


    ```

    npm install mozilla-apk-cli

    ```


    This will give you a new program mozilla-apk-cli available in ~/.node_modules/bin/.
    You can also globally install with:


    ```

    npm install -g mozilla-apk-cli

    ```


    Open Web Apps come in three flavours and the CLI can build them all: hosted apps,
