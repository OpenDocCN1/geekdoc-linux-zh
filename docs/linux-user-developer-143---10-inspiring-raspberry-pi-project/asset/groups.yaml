    # 开源


    # 安全


    ## 谷歌启动零项目（Project Zero）


    旨在提升全网的网络安全性


    广告巨头谷歌宣布启动“零项目”（Project Zero），这是一个安全计划，公司希望它能帮助提升网络的安全性——更重要的是，在 OpenSSL 的 Heartbleed
    等备受瞩目的漏洞事件之后，增强消费者对该安全性的信心。


    谷歌安全研究员 Chris Evans 在“零项目”启动声明中表示：“你应该能够放心地使用网络，而不必担心犯罪分子或由国家支持的行为者利用软件漏洞感染你的计算机、窃取机密或监视你的通信。”“然而，在复杂的攻击中，我们看到零日漏洞被用来针对例如人权活动家或进行工业间谍活动。这种情况需要停止。我们认为还可以做更多的事来解决这个问题。零项目是我们的贡献，以推动这一进程。”


    类似于 Linux 基金会的核心基础设施计划（Core Infrastructure Initiative，该计划将资源和资金投入应用于选定的开源项目以改进其安全性），“零项目”的重点显著更广泛。“我们没有给这个项目设定任何特定的界限，我们将致力于改进任何被大量人群依赖的软件的安全性，仔细关注攻击者的技术、目标动机，”Evans
    解释道。


    该计划将让谷歌雇佣的“一支新的、人员配备充足的团队”将其整个工作日都用于研究改进面向互联网的网络安全的方法。


    Evans 解释说，这包括发现和报告漏洞、研究缓解措施、探索性分析、进行形式化程序分析以及“我们的研究人员认为值得投资的其他任何事情”。


    “零项目”的成果最初将仅与软件供应商或开源开发团队共享，这是负责任披露的一个例子。当针对特定漏洞的补丁已发布或被接受后，报告将连同统计数据一起公开，例如供应商修复时间表现以及历史利用信息副本和崩溃跟踪信息。“我们还承诺尽可能以接近实时的方式向供应商发送漏洞报告，”Evans
    补充道，“并致力于与他们合作，以便在合理时间内将修复方案提供给用户。”


    谷歌表示，他们仍在积极招聘团队成员，首批确认的“零项目”员工之一是 George Hotz。Hotz 更为人知的代号是“geohot”，他因开发 Apple
    iPhone 和 Sony PlayStation 3 的“越狱”利用工具而闻名。


    “我们相信，大多数安全研究人员做这份工作是因为他们热爱它。我们认为我们提供的创新之处在于，一个让你可以公开地进行你所热爱之事的平台，且不受干扰，”Evans
    总结道。“我们还将探索如何涉及更广泛的社区，例如扩展我们受欢迎的奖励计划和漏洞赏金帖子。”


    “你应该能够放心地使用网络。”Evans 断言。


    # 发行版


    ## VolksPC 将 Debian 与 Android 合并


    MicroXwin 团队新发行版专注于 ARM


    MicroXwin 背后的团队宣布了一款新发行版，旨在通过添加对原生执行 Android 应用的支持，使 Debian 成为基于 ARM 设备的更具吸引力的选择。


    该团队的发行版基于为 ARM 编译并支持硬件浮点的 Debian Wheezy，将预装多个 Debian 软件包，包括基于内核的 MicroXwin 实现和
    XFCE 桌面环境。其相对于标准 Debian 的最大特点是能够直接运行来自 Google Play 市场的 Android 应用。


    该团队已宣布计划生产预装该发行版的 VolksPC 品牌硬件。已确认一款基于低成本 Rockchip RK3066 双核 1.4GHz ARM 处理器和 1GB
    内存的桌面系统，如果初始设备证明成功，还计划推出一款带键盘底座的未来平板电脑。


    VolksPC 硬件尚未定价，VolksPC 软件尚不可供公众下载。开发者未提供这两者中的任何时间表。


    ![](img/daaca9116bc2b1db669c224de81abc7c_6_0.png)


    ![](img/daaca9116bc2b1db669c224de81abc7c_6_1.png)


    ■ 该混合操作系统将在 ARM 设备上并行运行 Debian Linux 和 Android


    # 发现 Mayhem 恶意软件在野活动


    > “受限权限提供的保护微乎其微”


    一种名为 Mayhem 的新恶意软件包在野外被发现存在于 Linux Web 服务器和其他“基于 nix 的系统”上，以其创建者可以像基于 Windows
    的僵尸网络那样远程控制系统。


    根据 Yandex 员工 Andrew Kovalev、Konstantin Orashkevich 和 Evgeny Sidorov 在 Virus Bulletin
    上发布的分析报告，Mayhem 即使在受限权限下也能在系统上运行。它通过恶意的 PHP 脚本植入，已在世界各地发现，其中感染数量最多的是美国、俄罗斯、德国和加拿大，英国、欧洲和澳大利亚也有少量感染点。


    其主要用途似乎是为创建受感染系统的僵尸网络，然后这些系统会从命令与控制服务器收到指令，开始尝试暴力破解面向公众的 WordPress 安装版本的行政登录。该恶意软件的特性允许其用于其他目的；然而，“我们可以自信地说，由‘基于
    nix’Web 服务器组成的僵尸网络正成为一种现代恶意软件趋势，越来越受欢迎，”团队声称。“Web 服务器具有良好的正常运行时间，网络回调功能，且比普通个人电脑更强大。在‘基于
    nix’的世界中，自动更新技术并不广泛使用，尤其是与桌面和智能手机相比。[此外，] 反病毒技术的使用也不普遍。许多供应商不提供任何主动防御或进程内存检查模块。”


    由于感染率惊人，建议 Web 管理员检查其系统是否存在 Mayhem 恶意软件。


    # 在 Tails 中发现零日漏洞


    Tails，一种增强隐私的 Linux 发行版，受吹哨人爱德华·斯诺登青睐，被据现金换漏洞（cash-for-bugs）公司 Exodus Intelligence
    报告称存在多个严重安全漏洞。


    具体漏洞详情已由该公司提供给 Tails 项目，该项目表示将尽快解决这些问题。在此期间，Exodus Intelligence 表示将向客户出售漏洞详情——客户可能包括（除其他外）美国国家安全局。这些漏洞已在
    Invisible Internet Project（I2P）上游修复，但截至发稿时，Tails 团队尚未宣布修复版本的时间表。


    # 描绘整个世界


    > 《How It Works》团队推出袖珍旅行杂志


    目标是至少对世界——或者至少是那些吸引孩子和成人的精彩部分——进行完整的图解，获奖的《How It Works》、《All About Space》、《World
    of Animals》和《All About History》背后的团队推出了一本全新的杂志。


    《How It Works Illustrated》篇幅小巧，充满了精美的美术作品，同时也支持关键阶段 2（Key Stage 2）学习，新杂志于 7 月
    31 日发行，售价仅为 6.98 英镑。这本 132 页的杂志不仅以优质的插图和教育内容让人应接不暇，还以怀旧的新策略为报刊亭带来清新的冲击。


    《How It Works Illustrated》独特设计为一本可收藏的出版物，为现代时代重塑这一 powerhouse。不仅如此，《How It Works
    Illustrated》的每期都将深入探讨单一的高关注度主题，如古罗马或恐龙。收集全套系列，你将拥有一部涵盖整个世界的图解指南。


    从我们的商店获取第一辑——《世界历史》！：bit.ly/UIA4WS。为了确保你不错过任何一期，现在订阅并节省高达 50%：bit.ly/1pg4do5R。


