    **也许下一个可以引入 C3PO。**


    你知道，在 Telltale 我们正在制作一款 *Borderlands*（无主之地）游戏，我觉得制作一个 *Borderlands* 机器人来在办公室里到处跑并骚扰人们会非常有趣。所以，你懂的……谁知道呢。


