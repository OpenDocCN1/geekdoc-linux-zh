    \ 2.39 秒，解压缩时间为 0.21 秒，而树莓派分别为 8.64 秒和 3.08 秒。\n\n更快的处理器得到了更可靠的 USB 端口的支持，但最可能引起大多数人兴趣的是\
    \ SATA 连接。使用主板顶部的斜角端口，可以轻松地将大容量存储设备连接到香蕉派，而无需占用 USB 端口——这是即使最新的树莓派 Model B+ 也无法提供的。遗憾的是，作为紧凑型单驱动器\
    \ NAS 的实用性受到系统瓶颈的限制，整体网络吞吐量仅为 233Mb/s 左右。**Gareth Halfacree**\n\n![](img/daaca9116bc2b1db669c224de81abc7c_80_2.png)\n\
    \n**Raspberry Pi Model B+**\n**£27.44**\n作为经典树莓派设计的最新修订版，单核 ARM6 处理器尽管价格相似，但与香蕉派相比完全无法望其项背。然而，其小型生态系统无疑更加成熟，从最大的机箱到完美贴合的配件都很容易找到。**raspberrypi.org**\n\
    \n### 总结\n\n虽然很容易嘲笑 Lemaker 公然试图追随树莓派的路线，但香蕉派确实带来了一些令人印象深刻的改进。处理器性能显著增强，SATA 端口提供了高速存储的访问能力。然而，改变过的布局、受限的网络以及一些软件\
    \ bug 阻止了它获得满分。\n\n![](img/daaca9116bc2b1db669c224de81abc7c_80_3.png)\n\n# 更多信息\n\
    \nwww.bananapi.org\n\n# 评测\n\n![](img/daaca9116bc2b1db669c224de81abc7c_81_0.png)\n\
    \n# 树莓派 Model B+\n\n迷你电脑\n\n$35/£20.53\n\n初代树莓派的最新版本有一些必要的更新，但总体上保持不变。这次升级值得吗？\n\
    \n- 优点\n  - 新的硬件配置允许更整洁的线缆和设置，同时保留相同的核心组件\n- 缺点\n  - 没有理由升级，而且买 microSD 卡时的折扣稍微更容易获取\n\
    \n在过去两年里，我们对树莓派的设计越来越喜爱。它在某种程度上几乎成了标志性设计，我们认为认为这一点的不仅仅是我们：正如您在上一页的香蕉派评测中看到的，其布局与标准\
    \ Model B 几乎相同。\n\n凭借全新的 Model B+，作为 Model B 第二版的增强版，一些硬件被重新布置到更具逻辑性和更整洁的布局中。这是任何人注意到的设备的第一件事，这也可能很大程度上是因为新的\
    \ USB 端口非常突出，吸引了人们审视板子上其余部分的视线。\n\n# 新配置\n\n新布局非常适合更整洁的工作站或项目内部。所有东西都更平整地贴合在板上，没有\
    \ USB 端口或视频连接器伸得老远，而且由于所有端口都在两侧而不是四周，布线可以整洁得多，放置可以更灵活，对于特定设置来说也少了许多尴尬。\n\n当然，增加两个\
    \ USB 端口对许多希望同时使用鼠标、键盘、Wi-Fi 网卡以及外部存储而不需要额外带电源的 USB 集线器的树莓派用户来说是福音。你可以使用其他配置，但原版树莓派限制了上述这些常用功能。\n\
    \n除了多两个 USB 端口外，GPIO 端口还增加了 14 个引脚，其位置大致仍在板的同一侧。额外的引脚只是附加在原始布局的末端，这意味着你的旧项目仍然可以正常工作。不过，现在你可以用它们做更多事情，这应该真的有助于扩展你的项目。\n\
    \n这是一个小小的发现，但对我们来说，新的 Model B+ 配置失去了一些美学魅力。现在 B+ 看起来平淡、统一且高效。坦白说，出于许多原因，这样其实更好，我们确信在未来两年内我们会习惯这种风格。\n\
    \n![](img/daaca9116bc2b1db669c224de81abc7c_82_0.png)\n\n左：Model B+ 具有推锁/解锁式的 microSD\
    \ 卡插槽 - 这是对旧式摩擦式 SD 插槽的巨大升级\n\n### 技术规格\n- **操作系统**: Linux\n- **处理器**: Broadcom\
    \ BCM2835\n- **内存**: 512 Mb\n- **尺寸**: 85mm x 56mm\n- **重量**: 42g\n- **存储**: MicroSD\
    \ 卡插槽\n- **端口**: 4 x USB 2.0，以太网，3.5mm 音频插孔，HDMI，40 针 GPIO，CSI（用于摄像头），DSI（用于显示屏）\n\
    - **电源**: MicroUSB\n\n> Model B+ 正在取代 Model B 成为旗舰树莓派\n\n### 老一套，老一套\n\n尽管配置全新，树莓派\
    \ B+ 的核心实际上与 Model B 的第二版基本相同——它仍然拥有第二版中的同型 Broadcom ARM v6 系统级芯片以及 512 Mb 内存。\n\
    \n一方面，这非常好。刚开始接触树莓派的人不需要通过艰苦的方式发现所有在线教程都已不再适用。决定升级的人不需要专门学习任何新的东西，他们可以制作一张 SD\
    \ 卡的副本，直接就能在 B+ 上工作。\n\n对于那些对自己的树莓派满意的人来说，核心没有变化使得很难推荐其作为升级选择。当然，整体上好多了，你可以稍微做更多事情，但额外功能只会影响树莓派社区的一小部分用户。\n\
    \n无论如何，Model B+ 正在取代 Model B 成为旗舰树莓派，所以当不可避免的升级欲望产生时，它就会在那里。对于仍然抱着第一版树莓派的人来说，现在是升级并领先一步的好时机。\n\
    \n\U0001F3A8 Rob Zwetsloot\n\n### 总结\n\n这是我们要爱的当前树莓派的终极进化，所以不用说，B+ 获得了满分。从实用角度来看，重新排列的组件比原始布局好得多。如果你对普通的\
    \ B 型号感到满意，这还不算是一次必需的升级，但它仍然是更好的 \U0001F427\U0001F427\U0001F427\U0001F427\U0001F427\
    \U0001F427\n\n### 型号选择\n\n树莓派的各种版本可能让新入门者有点困惑，但基本上是这样的：Model B 于 2012 年首先发布，随后\
    \ Model A 在 2013 年发布。Model A 通常用于嵌入式项目和机器人技术，因为它更轻，功耗更低，加上本身性能稍弱。新发布的 Model B+\
    \ 基本上是 Model B 的抛光升级版。这三个型号共同代表了第一代 Pi——我们迫不及待地想看下一代会是什么。\n\n![](img/daaca9116bc2b1db669c224de81abc7c_82_1.png)\n\
    \n**更多信息**\nwww.raspberrypi.org\n\n"
