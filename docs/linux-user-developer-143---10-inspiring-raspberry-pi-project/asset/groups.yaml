    new project to the repository? Hope you can give me a hand with this.


    **Rich Shepard**


    Ah, unfortunately you can''t really add the subdirectories. What you should have
    done is create the whole project using the svnadmin tools, creating _path/to/my/repository/_
    for the repository itself. Also, create project root directories using ''svn mkdir
    project-name / path/to/my/repository/''.


    **Also for each project root directory you should create branches/, tags/, and
    trunk/ as above. Now the repository and its directory structure are in place,
    use ''svn import /path/ to/my/repository/project'' from the source directory.
    Now just add a log comment with the -m option.**


    **Finally, remove, or back up with a different name, your original source directory.
    Then use ''svn checkout /path/to/my/repository/project/ trunk/'' to produce the
    working copy in your preferred location.**


    *This should get you started again.*'
