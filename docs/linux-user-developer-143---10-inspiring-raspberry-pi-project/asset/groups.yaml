    # Raspberry Pi Model B+

    Is it worth the upgrade?


    ![](img/daaca9116bc2b1db669c224de81abc7c_82_0.png)


    Left: The model B+ has a push-to-lock/unlock microSD card slot - a great upgrade
    on the old friction-fit SD slot


    ### Technical specs

    - **Operating System**: Linux

    - **Processor**: Broadcom BCM2835

    - **Memory**: 512 Mb

    - **Dimensions**: 85mm x 56mm

    - **Weight**: 42g

    - **Storage**: MicroSD card slot

    - **Ports**: 4 x USB 2.0, Ethernet, 3.5mm audio jack, HDMI, 40-pin GPIO, CSI (for
    camera), DSI (for display)

    - **Power**: MicroUSB


    > The Model B+ is replacing the Model B as the flagship Raspberry Pi


    same position on the side of the board. The extra pins are merely added on to
    the end of the original layout, meaning your old projects will still work just
    fine. You can now do a lot more with them, though, which should really help to
    expand your projects.


    # ### Same old, same old


    Despite the new configuration, the actual core of the Raspberry Pi B+ is fundamentally
    the same as the revision two of the model B - it still has the same Broadcom ARM
    v6 system-on-a-chip along with the 512 Mb of RAM found in the revision two.


    On the one hand, this is excellent. People getting into Raspberry Pi don''t need
    to learn the hard way that all the online tutorials have stopped being relevant.
    Those who decide to upgrade don''t need to learn anything specifically new and
    they can create a copy of their SD card that will work straight away in the B+.


    For those satisfied with their Raspberry Pi, the lack of core changes makes it
    difficult to recommend as an upgrade. Sure, it''s a lot nicer overall and you
    can do slightly more with it, but the extra features won''t affect more than a
    small percentage of the Pi community.


    Either way, the Model B+ is replacing the Model B as the flagship Raspberry Pi,
    so it will be there when the inevitable urge to upgrade arises. For those still
    hanging onto the revision one Raspberry Pi, it''s a great time to upgrade and
    get ahead of the curve.


    🎨 Rob Zwetsloot


    # ### Summary


    It''s the ultimate evolution of the current Raspberry Pi which we already adore,
    so it goes without saying that the B+ gets a perfect score. From a utilitarian
    standpoint, the rearranged components are much better than the original layout.
    It''s not quite an essential upgrade if you''re satisfied with the normal B but
    it''s still better 🐧🐧🐧🐧🐧🐧


    # ### Choice of models


    The various versions of the Raspberry Pi can be a little confusing to newcomers,
    but essentially it goes like this: the model B was released first in 2012, and
    was followed in 2013 by the model A. The model A is usually used for embedded
    projects and robotics because it''s lighter and draws less power, in addition
    to being a little less powerful itself. The new model B+ just released, is basically
    a polished, upgraded version of the model B. Together, the three models represent
    the first generation of Pi - we can''t wait to see what comes next.


    ![](img/daaca9116bc2b1db669c224de81abc7c_82_1.png)


    **More information**

    www.raspberrypi.org'
