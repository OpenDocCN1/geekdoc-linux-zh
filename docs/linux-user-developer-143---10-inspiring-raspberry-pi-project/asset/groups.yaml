    \n### 02 关于 NumPy\n\n尽管名字简单，但 NumPy 是一个功能强大的 Python 包，主要用于处理数组和矩阵。\n\n创建数组的方法有很多种，但最简单的是使用\
    \ array() 函数。\n\n```\n>>> oneD = array([1,2,3,4])\n```\n\n上述命令创建一个一维数组。如果你想创建一个二维数组，可以按照以下方式使用\
