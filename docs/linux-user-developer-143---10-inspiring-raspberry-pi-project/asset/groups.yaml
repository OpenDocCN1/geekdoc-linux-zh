    # Master NumPy


    Perform scientific computing with NumPy, SciPy and Matplotlib


    ![](img/daaca9116bc2b1db669c224de81abc7c_40_0.png)


    ```

    image = np.array(Image.open(''SA.png''),

    convert=''L'')

    ```


    This line allows you to read a usual PNG file and convert it into a NumPy array
    for additional processing. The program will also separate the output into four
    parts and displays a different image for each of these four parts.


    # 12 Other useful functions


    It is very useful to be able to find out the data type of the elements in an array;
    it can be done using the dtype() function.


    Similarly, the ndim() function returns the number of dimensions of an array.


    When reading data from external files, you can save their data columns into separate
    variables using the following way:


    ```

    In [10]: aa1, aa2 = np.loadtxt(''timeN.txt'',

    usecols=(0,1), unpack=True)

    ```


    The aforementioned command saves column 1 into variable aa1 and column 2 into
    variable aa2. The ''unpack=True'' allows the data to be assigned to two different
    variables. Please note that the numbering of columns starts with 0.


    # 13 Fitting to polynomials


    The NumPy polyfit() function tries to fit a set of data points to a polynomial.
    The data was found from the timeN.txt file, created earlier in this article.


    The Python script uses a fifth degree polynomial, but if you want to use a different
    degree instead then you only have to change the following line:


    ```

    coefficients = np.polyfit(aa1, aa2, 5)

    ```


    # 14 Array broadcasting in NumPy


    To close, we will talk more about array broadcasting because it is a very useful
    characteristic. First, you should know that array broadcasting has a rule: in
    order for two arrays to be considered for array broadcasting, ''the size of the
    trailing axes for both arrays in an operation must either be the same size or
    one of them must be one.''


    Put simply, array broadcasting allows NumPy to ''change'' the dimensions of an
    array by filling it with data in order to be able to do calculations with another
    array. Nevertheless, you cannot stretch both dimensions of an array to do your
    job.


