    ## 10 个鼓舞人心的树莓派项目


    ### 树莓派中心


    关于树莓派你可能需要的所有技术信息都可以在 elinux 维基的 RPi Hub 页面上找到。那里有购买指南、初学者指南、硬件和软件资源、完整文档的链接，还有社区项目和教程的汇总。如果你访问“项目”页面，会发现一个庞大的项目列表以及指向源页面的链接。因此，Hub
    不仅是知识的来源，还能帮助你找到更多树莓派创意作品。


    elinux.org/RPi_Hub


    ### 树莓派论坛


    树莓派基金会网站的远比你想象的要丰富得多——点击页面顶部的“论坛”链接，你就会发现所有对话真正发生的地方。这是一个非常活跃的社区，人们不断发布树莓派项目、创意和完成的作品，因此通过寻求或提供树莓派项目帮助来参与其中是一种绝佳方式。与所有此类资源一样，最好先搜索论坛再开始提问，并阅读置顶帖，因为很可能别人已经问过相同的问题，你只需找到那个特定的帖子即可。


    www.raspberrypi.com/forums


    ### 亲自动手玩转你的树莓派


    我们非常兴奋地宣布，还有一项针对你的新树莓派资源——RasPi。这本纯数字杂志通过 iTunes 提供，价格仅为 69 便士/99 美分，内容包含大量树莓派项目、Python
    教程、采访等。它是专为那些每期都直接翻到这些红边页面阅读树莓派内容的读者打造的专用树莓派杂志，并专门为 iPad 用户设计，提供出色的阅读体验。每期杂志都会包含一个供你深入体验的大型项目，我们以一篇关于如何编程你自己的无人车的指南开启了第一期。RasPi
