    # # Write useful shell scripts – part 2


    Prototype programs for any language




    ![](img/daaca9116bc2b1db669c224de81abc7c_26_0.png)


    # ## 01 Well read


    We can only scratch the surface of scripting in these few pages. As well as running
    and changing the code in these tutorials, dip into as many shell scripts as you
    can on your system.


    # ## 02 Arguments


    You’ll start to see things like this – a $1 (and often $2, $3, etc.) appearing
    in the script without being declared. This is the command-line argument(s) you’ve
    entered with a script, being called.


    ![](img/daaca9116bc2b1db669c224de81abc7c_26_1.png)


    # ## 03 Callingvalue


    We could add something to last month’s backup script to read the name of the directory
    wanted to be backed up. If we cd into the folder before CURDIR is assigned to
    pwd, then the script works on the $PWD if called without parameters.


    ![](img/daaca9116bc2b1db669c224de81abc7c_26_2.png)


    # ## 04 Are we there yet?


    Changes like this need checking. You may try to back up a directory without permission
    to do so. If the script isn’t running with enough privilege to cd, then it needs
    to exit and tell the user.


    ![](img/daaca9116bc2b1db669c224de81abc7c_26_3.png)


    # ## 05 Gotcha!


    If you tried the last step in your own code, you’ll find it fails if the directory
    parameter has a trailing slash – which won’t match the pwd report given without
    one. $1(%) will knock it off.


    ![](img/daaca9116bc2b1db669c224de81abc7c_26_4.png)


    # ## 06 Positional


    As well as $1 et al, there’s $0 – which represents the name under which the script
    is called. Here we’re just using the name of $0, then checking what in $1 is a
    directory or file. A wordy if –F


    ![](img/daaca9116bc2b1db669c224de81abc7c_26_5.png)


    # ## Lay out the design with comments, then add in code snippets


    All parameters — The expansion of $* – note, not $(@) or similar – gives you a
    block of arguments to run through. Here we are echoing them back and categorising
    as directory or file.


    # ## 08 Small step


    Not a wildly useful program yet, but we’ll be coming back to positional parameters
    in the future – and you’ll need them if you’re using Bash to prototype programs.


    ![](img/daaca9116bc2b1db669c224de81abc7c_26_6.png)


    # ## 09 Talking to you


    But, to get really interactive, we need to read input from the keyboard during
    execution of a script, and capture it as a variable – and read variablename does
    the job admirably.'
