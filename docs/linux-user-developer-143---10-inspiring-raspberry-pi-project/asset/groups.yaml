    \ tools that made the software accessible, and user tools that made the software\
    \ friendly.\n\nOwen le Blanc compiled the first 'MCC interim release' of Linux\
    \ in February 1992, named after the Manchester Computing Center in Manchester,\
    \ England. Later that year Peter McDonald released SLS (Softlanding Linux System),\
    \ which was the first attempt to pull together all the available software to make\
    \ a popular Linux distribution as we might recognise it today.\n\nBut SLS wasn't\
    \ to everybody's liking. There was little concept of packaging, and though the\
    \ system was 'good enough' it left the user...\n"
  mdcn: "\n\n## Firefox OS 应用开发\n\n在 Firefox 浏览器中创建、编辑和测试 Web 应用。你可以构建、打包并上传应用 zip\
    \ 文件，也可以从源代码目录打包应用。假设你正在开发一个打包应用。你的目录结构如下所示：\n\n```\nwww/\n    index.html\n  \
    \  manifest.webapp\ncss/\n    style.css\ni/\n    icon-256.png\n    icon-128.png\n\
    \    icon-64.png\njs/\n    main.js\n```\n\n你可以使用以下命令构建一个可测试的 Android 应用：\n\n```\n\
    mozilla-apk-cli /www/my_test_app.apk\n```\n\n这将生成 `my_test_app.apk`，你可以通过两种方式将其侧载（side-load）到你的手机上：将其上传到网络并从\
    \ Android 设备上的浏览器下载/安装，或者使用 `adb` 来安装该应用：\n\n```\nadb install my_test_app.apk\n\
    ```\n\n### 未来：为整个 Web 开发\n\nWebIDE 的核心是 Firefox 远程调试协议。Firefox 开发工具可以在通过 USB 连接的远程设备上工作。目前，该协议对\
    \ Firefox 桌面版、Firefox Android 版和 Firefox OS 都有用。但这不会止步于此。在未来，一种协议适配器将允许开发者使用 Firefox\
    \ 远程调试协议——包括开发工具和 WebIDE——与所有移动浏览器通信，无论其渲染引擎或运行时如何。\n\n这个“Web 无处不在”项目尚未准备好进行测试，但如果你迫不及待想要参与或查看其实现方式，它目前位于\
    \ github.com/camp/fxd-adapters。\n\n如果你正在开发一款工具并希望开始尝试该协议，那么你现在就可以开始了，针对 Firefox\
    \ 桌面版、Firefox Android 版和 Firefox OS 进行开发。有关远程调试协议的信息，请查看 mozilla/teardown 上的文档。如果你想看\
    \ WebIDE 的实际操作效果，请查看这个屏幕录制：bit.ly/1nFcn3U。\n\n![](img/daaca9116bc2b1db669c224de81abc7c_16_0.png)\n\
    \n上图：CodeMirror 和 Term.js 结合成一个强大的编辑器，用于处理 HTML、JS 和 CSS 文件。\n\n### 合成的 APK\n\n\
    APK 工厂服务接收你的代码并将其发送到该服务的审查员实例（相对于生产发布环境）。\n\n该服务会合成一个原生 Android 应用，使用 Android\
    \ SDK 构建它，并最终使用开发证书对其进行签名。如前所述，这个合成的 APK 是可调试的，并且不应该被分发。\n\n该服务的一个优点是，你不必在本地计算机上安装\
    \ Java、Android SDK 和其他 Android 开发工具。你可以专注于 Web，并在手头任何可用的设备上测试。\n\n## Linux 的崛起\n\
    \n### 从 Sinclair QL 到树莓派\n\n![](img/daaca9116bc2b1db669c224de81abc7c_17_0.png)\n\
    \n> Richard Hillesley 回顾软件黑客的黄金时代，探索 Linux 精神的起源\n\nLinux 的原始代码是为了乐趣而编写的，或者用 Eric\
    \ Raymond 的话说，是为了“挠痒痒”——满足 Linus Torvalds 的编程渴望，后来又满足了众多黑客和业余爱好者的热情和编程冲动。这些人大多在\
    \ ZX80、BBC Micro、Acorns 和 Apricots 的时代长大，这些机器的代码通常是可以获得的——而且可以修改。\n\n![](img/daaca9116bc2b1db669c224de81abc7c_18_0.png)\n\
    \n![](img/daaca9116bc2b1db669c224de81abc7c_18_1.png)\n\n上图：Sinclair QL 内部。\n\n\
    左图：Alan Cox —— “有些问题直到有人真正理解背后的数学原理并参与进来才真正得到解决”\n\n对于那些在 70 年代末和 80 年代初的家用计算机中度过童年或青春期的那些人来说，摆弄软件是一种学习体验，也是值得分享的事情。可以说，Linux\
    \ 既诞生于这种精神，也诞生于自由软件运动，或者是 90 年代初 Usenet 的文化，在那里“如果你写了些好东西就发布到 Usenet 上”，而软件附带的唯一条件是“如果软件坏了，你可以保留两块碎片”。\n\
    \n几乎每个人都知道，Linux 诞生于 Linus Torvalds 在 1991 年 1 月购买了一台 PC 之后不久。正如 Lars Wendler\
    \ 所说：“在此之前他一直在使用 Sinclair QL，这台机器像许多英国计算机产品一样，设计巧妙，但与其他一切几乎完全不同。像每个有自尊的黑客一样，Linus\
    \ 编写了一些自己的软件开发工具；我记得是一个编辑器和一个汇编器。他还稍微修改了一下 QL 硬件，以更换损坏的键盘，并添加一个兼容 PC 的软盘驱动器。当他购买\
    \ PC 时，他为 QL 编写了一个设备驱动程序，以便他可以将东西从 QL 转移到 PC 上”。\n\n### 从 Minix 到 Linux\n\n出于对\
    \ Unix 的好奇，以及渴望在他崭新的 PC 上安装类 Unix 操作系统的愿望，Torvalds 安装了 Minix 的一个副本——这是 Andrew\
    \ Tanenbaum 开发的一种教学操作系统——并开始编写一个独立的终端模拟器，以访问赫尔辛基大学的 UNIX 服务器。这个终端模拟器超出了其原始目的，到\
    \ 1991 年 8 月，Torvalds 能够在 Usenet 的 comp.os.minix 新闻组上宣布，他正在“开发一个（免费的）操作系统（只是一个爱好，不会像\
    \ GNU 那样庞大和专业化），用于 386/486 AT 克隆机。”（有关原始帖子，参见 bit.ly/1pAY3DH）。\n\nLinux 内核的第一个迭代版本是专门用\
    \ GCC（GNU C 编译器）编写的，目的是探索 Torvalds 计算机上 80386 芯片的工作原理，并且“可能永远不会支持除 AT 硬盘以外的任何东西，因为我就只有这些”。Linux\
    \ 内核是特定于机器的单体架构，并迅速吸引了追随者和批评者。几个月后，Torvalds 做出了重要的决定，将代码以 GNU GPL 许可证发布，并迅速吸引了越来越多的爱好者和业余爱好者提供帮助和参与，这些人就像\
    \ Torvalds 一样，在 Sinclair QL 时代长大，想要探索代码。\n\n因此，从一开始，Linux 既属于每个人，也不属于任何人，它是黑客和业余爱好者的游乐场，他们乐于在过程中学习。Alan\
    \ Cox 在斯旺西计算机协会机器上安装了 Linux，并“开始尝试让网络代码正常工作，因为当时它有 bug”。斯旺西大学有一个“很好的、非常嘈杂的多协议网络，非常适合搞砸你的计算机。我开始修复这些问题，这就是我最终编写网络代码的方式，建立在其他人已经编写的基础网络代码之上。我基本上是在下载标准并在阅读过程中学习……有些问题直到有人真正理解背后的数学原理并参与进来才真正得到解决。”\n\
    \n### Copyleft 许可证\n\nTorvalds 最初将 Linux 发布“在一个非 GPL 的版权下，实际上比 GPL 更严格”，但他在 1997\
    \ 年告诉 Hiroo Yamaagata，他“在大约半年内将版权更改为 GPL，因为很快明显看出我最初的版权限制如此之多，以至于禁止了一些完全有效的用途（磁盘复制服务等——这是在\
    \ CD-ROM 变得真正流行之前）。虽然一开始我对 GPL 感到紧张，但我也想表达对 Linux 所依赖的 GCC C 编译器的感激之情，它显然受 GPL\
    \ 保护。让 Linux 采用 GPL 绝对是我做过的最好的事情。”\n\n一旦 GNU/Linux 被多于一家硬件公司采用，这些公司就明显意识到对项目做出回馈是互利互惠的，它们也这样做了。使这成为可能的框架是\
    \ GPL 的第 2(b) 节。核心企业代码片段的发布加速了 Linux 的开发，并确保其在企业中的成功，其跨广泛硬件的可移植性进一步增强了这一优势。\n\n\
    公司使用 GNU/Linux 并非出于对 Linux、GPL 或“开源”的 sentimental attachment（情感依恋）。他们使用 GNU/Linux\
    \ 和自由软件是因为它讲道理。而 GPL，它保证了代码的持续自由性和通用性，是背后的驱动力。\n\n![](img/daaca9116bc2b1db669c224de81abc7c_19_0.png)\n\
    \n上图：GNOME 基金会是在 2000 年 LinuxWorld 上宣布成立的。\n\n![](img/daaca9116bc2b1db669c224de81abc7c_19_1.png)\n\
    \n右图：Scott McNealy 的说法后来被证明是错误的，因为 Linux 取代 Solaris 成为主要企业平台。\n\n> Scott McNealy\
    \ 将 GNU/Linux 斥为“业余爱好者的绝佳环境”，但不适合企业。\n\n### 黑客和业余爱好者\n\n这种开放的、协作的软件开发态度确实并不受每个人的欢迎，但它奏效了，尽管当时有许多本应知道得更多的人提出了抗议。早在\
    \ 2003 年，Sun Microsystems 的首席执行官 Scott McNealy 还曾将 GNU/Linux 斥为“业余爱好者的绝佳环境”，但不适合企业。随后的几年证明他是错的，因为\
    \ Linux 取代 Solaris 成为企业服务器群的首选平台，而 Sun 则走向了彻底的衰落。\n\nLinux 无疑其根源和灵感来自黑客和业余爱好者。这绝非缺点，正是赋予了\
    \ Linux 充满活力的驱动力和能量。开发者们很少或没有必要去满足通常的商业冲动或指令，软件作为贡献者集体天赋的表达而有机地发展起来。Linux 和 GNU\
    \ 展示了分布式软件开发的潜力和潜能，任何人都可以来自任何背景，为整体做出贡献，并作为平等的伙伴找到成就感。\n\n在一端，从新兴的 Linux 社区中涌现出的项目充满了高成就者。在另一端，那些在学术生涯中搞砸了，或者开发了与其工作和学术机会相距甚远的热情的人，能够在最终具有民主氛围的环境中深入代码并产生影响。\n\
    \n### 打包交付\n\nLinux 和 GNU 允许家庭用户探索代码的可能性，以及其机器的网络潜力。Linux 已取代 The Hurd 成为 GNU\
    \ 操作系统内核，用户开始将 Linux 和 GNU 的元素打包成连贯的“发行版”，配有安装程序和分区工具，使软件易于访问，并配有用户工具，使软件友好。\n\
    \nOwen le Blanc 于 1992 年 2 月编译了 Linux 的第一个“MCC 临时发行版”，以英格兰曼彻斯特的曼彻斯特计算中心命名。同年晚些时候，Peter\
    \ McDonald 发布了 SLS（Softlanding Linux System），这是首次尝试将所有可用软件整合在一起，以制作一个我们今天可能认可的流行\
    \ Linux 发行版。\n\n但 SLS 并不受所有人的欢迎。几乎没有打包的概念，虽然该系统“足够好”，但它留给了用户……\n\n"
