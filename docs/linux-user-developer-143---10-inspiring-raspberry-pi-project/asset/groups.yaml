    \ JSON 文件及其包含的所有文件/文件夹。（**图 08**）。\n\n### 08 创建文件夹路径并上传文件\n\n当我们将文件夹添加到 JSON 以便上传时，我们是让每个文件夹独立于其他文件夹的存在与否。这一决定有助于我们现在准备上传到\
