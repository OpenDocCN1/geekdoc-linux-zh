    ## Media caster


    Cast your content over the local network to receive it from multiple clients so
    you don’t lose your place.


    ### What you’ll need


    - Raspberry Pi Model B

    - XBMC

    - http://xbmc.org

    - Portable hard drive


    Have you ever wanted to move between rooms while watching or listening to the
    same film or song? We often find ourselves switching from a phone or tablet to
    the desktop. There are some complicated setups you can use for this involving
    MythTV and various custom-built servers and receivers, but you can also do it
    with just one Raspberry Pi server and then many XBMC receivers with a lot less
    hassle.


    Broadcasting your media over your network so that the clients can pick up where
    you left off in your track or film wherever you move to, without having to make
    a note of the track position and find the file again. Here’s how to get set up.


    ![](img/daaca9116bc2b1db669c224de81abc7c_55_0.png)


    ![](img/daaca9116bc2b1db669c224de81abc7c_55_1.png)


    ### 01 Install storage drivers


    You’ll likely be using a portable NTFS hard drive if you want to store a lot of
    media on your Raspberry Pi caster. This means you need to install the NTFS libraries
    on the Pi, which requires you to open the terminal and type:


    ```

    $ sudo apt-get install ntfs-3g

    ```


    ### 02 Create mounting folder


    We’re going to have the Raspberry Pi automatically mount the hard drive for us
    whenever it boots up, and in order to do this it first needs to have a place where
    the files will be accessible. Let’s create a directory called mediadrive inside
    the Home folder. Keep the directory name to just one word to make your life easier
    later.


    ```

    $ mkdir mediadrive

    ```


    ![](img/daaca9116bc2b1db669c224de81abc7c_56_0.png)


    *Left: Media stored on your portable hard drive will show up in a dedicated folder*


    ### 03 Boot-time mount parameters


    Your hard drive will likely be mounted as /dev/sda1, but do a `disk -l` if you
    want to double check. To make sure it mounts at boot, go to fstab with `sudo nano
    /etc/fstab` and write the following line below, with a tab between each bit of
    information:


    ```

    /dev/sda1  /home/pi/mediadrive  ntfs-3g  defaults,noatime  0  0

    ```


    ### 04 Install VLC on Pi


    So all our media is now accessible, and now we need a way to broadcast it. For
    this we’ll use multi-functional media player VLC, which was originally designed
    to be the client for a casting server. You can install it with:


    ```

    $ sudo apt-get install vlc

    ```


    ![](img/daaca9116bc2b1db669c224de81abc7c_56_1.png)


    ![](img/daaca9116bc2b1db669c224de81abc7c_56_2.png)


    ### 05 XBMC stream receiver


    This bit is dead simple – on any computer you can easily get files off of, create
    a file called Stream.strm, and add this line to it, with IP as the last two sets
    of Pi’s IP address:


    ```

    udp://239.255.[IP].[IP]:1234

    ```


    Save it and move it to your XBMC clients that you want to receive the cast from.


    ### 06 Custom VLC command


    Here’s the really fun part. Go back to your Pi and right click on one of the files
    you’d like to play, go to Properties and click the down arrow next to Open with,
    Go to Customise and then Custom Command Line and type in the following, with IP
    as the last two sets on your IP address:


    ```

    cvlc --sout udp:239.255.[IP].[IP] %f

    ```


    ### 07 Test out casting


    Here’s the big test: boot up XBMC, open your media on the Raspberry Pi and use
    the Stream file on XBMC to receive the cast. It might take a moment to load but
    it will start playing via XBMC in a short time.


    ### 08 Command line alternative


    Your setup may not always be convenient for you to go to the Pi and start launching
    files from the desktop. You can always SSH into your Pi from another computer
    or an Android device and run the file using a similar custom command to the one
    we used earlier:


    ```

    $ cvlc --sout udp:239.255.[IP].[IP] [file location]

    ```


    ### SSH into your Pi from another computer or an Android device


    ### Be inspired


    Why not add a web interface to your Pi so that you can browse from your laptop
    or smartphone? Have it run the multicast code when clicking on files it’s scraped
    from the media drive to make the process much easier. You can also fuse the project
    with our cloud server in a few pages time.


    ## Portable Wi-Fi signal repeater


    Boost your signal using a Raspberry Pi and two USB Wi-Fi dongles.


    What we like about the Raspberry Pi for this project is that it''s very low maintenance
    and extremely easy to put in an appropriate location. All you need for this project
    are two USB wireless adaptors, a nice little case and a way to power it. Once
    you''ve set it up, you can basically leave it to its own devices, checking in
    over SSH every now and then to do some updates.


    Set this up on a monitor with a keyboard, using a fresh image of Raspbian and
    with your Wi-Fi dongles plugged in. On first boot keep it as CLI and after doing
    the usual apt-get updates and upgrades, type `startx` to get to the desktop. Configure
    the wireless for wlan0 to connect to your home network and make sure it has a
    fixed IP address, then reboot to make sure it all works from the command line
    by using `ping www.google.com`. Now you need to install your first bit of software
    using:


    ```

    $ sudo apt-get install hostapd iw

    ```


    ### What you''ll need


    - 2 USB Wi-Fi adaptors

    - Raspberry Pi case

    - Portable power pack


    After it''s installed, you''ll want to download and save the file we''ve created
    directly to config by entering the following two commands:


    ```

    $ wget http://www.linuxuser.co.uk/wp-content/uploads/2014/08/repeater.zip

    $ cp LXDRepeater.conf /etc/hostapd/hostapd.conf

    ```


    ![](img/daaca9116bc2b1db669c224de81abc7c_57_0.png)


    **Right** One Wi-Fi adaptor picks up your main Wi-Fi network, while the other
    one broadcasts a new signal


    Do a reboot and test the configuration file with:


    ```

    $ hostapd -dd /etc/hostapd/hostapd.conf

    ```


    If there are no errors, open the file using `nano /etc/hostapd/hostapd.conf` and
    then add the following into the file:


    ```

    DAEMON_CONF="/etc/hostapd/hostapd.conf"

    RUN_DAEMON=yes

    ```


    Also change the SSID to be the same one for your network in the ssid field. Once
    that''s done, you''ll need to install the bridge utilities with `apt-get install
    bridge-utils`. Then configure it with the following four commands:


    ```

    brctl addbr bridge0

    brctl addif bridge0 wlan0

    brctl addif bridge0 wlan1

    ifconfig bridge0 up

    ```


    Test it out to make sure it works and then place it around the house to extend
    your wireless signal!


    ![](img/daaca9116bc2b1db669c224de81abc7c_58_0.png)


    ![](img/daaca9116bc2b1db669c224de81abc7c_58_1.png)


    ![](img/daaca9116bc2b1db669c224de81abc7c_58_2.png)


    ## Secure Tor web station


    Stay private online by routing all your web traffic through Tor on your Raspberry
    Pi.


    In a much more privacy-focused world, being able to browse securely online is
    an important freedom for many people. With the use of Tor and a few tweaks to
    the Raspberry Pi, you can make sure all your internet traffic is kept private.


    First of all, you''ll need to make sure to install Tor from the repos. Open up
    the LXTerminal and simply type:


    ```

    sudo apt-get install tor

    ```


    Once that''s done, edit the torrc file by using `sudo nano /etc/tor/torrc` and
    add this to the top of the file:


    ```

    VirtualAddrNetworkIPv4 10.192.0.0/16

    AutoMapHostsOnResolve 1

    TransPort 9040

    DNSPort 53

    ```


    Save this file and then open the next file with `sudo nano /etc/resolv.conf` and
    modify it:


    ```

    nameserver 127.0.0.1

    ```


    Finally, you need to change the iptables ruleset, but before you do this, use
    `top` to confirm the uid of Tor and make a note of it. Now open up a new file
    with `nano /etc/init.d/iptables` and enter the code found at: [http://www.linuxuser.co.uk/wp-content/uploads/2014/08/tor.tor.zip](http://www.linuxuser.co.uk/wp-content/uploads/2014/08/tor.tor.zip).
    Now save it and enter:


    ```

    chmod 755 /etc/init.d/iptables

    update-rc.d iptables defaults

    ```


    ### Put ''em together


    A secure wireless connection can be created using the Raspberry Pi by looking
    at the Onion Pi project from Adafruit: [learn.adafruit.com/onion-pi/overview](http://learn.adafruit.com/onion-pi/overview)


    This creates a wireless access point connected to the internet that anonymises
    all web traffic by directing it through the Tor network.


    This means all your home computers and smart devices can be connected to Tor and
    not just the Raspberry Pi itself. You can also apply some of the lessons learnt
    in the Wi-Fi repeater tutorial to unshackle it from the ethernet cable, although
    that will reduce slightly its overall security.

    '
