    \ another terminal and copy the envars file into the home folder. Open it up in\
    \ nano and remove all the variables but XAUTHORITY and DISPLAY, followed by sourcing\
    \ the file from root. You could try writing a little script to do it automatically\
    \ for you that looks something like this:**\n\n```bash\n#!/bin/bash\ndeclare -x\
    \ DISPLAY=\"[variable]\"\ndeclare -x XAUTHORITY=\"[variable]\"\n\nif [ $1 is \"\
