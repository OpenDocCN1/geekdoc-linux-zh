  mdcn: "\n## 网络管理器\n\n哪一个最适合处理你日常的网络连接？\n\n![](img/daaca9116bc2b1db669c224de81abc7c_76_0.png)\n\
    \n![](img/daaca9116bc2b1db669c224de81abc7c_76_1.png)\n\n### 网络工具\n\n尽管功能繁杂，但它是否包含了核心功能？\n\
    \n![](img/daaca9116bc2b1db669c224de81abc7c_76_2.png)\n\n网络工具中海量的信息使得排查网络故障变得更加容易。\n\
    \n#### 易用性\n\n虽然对新手来说稍微有些吓人，但网络工具的主标签页几乎包含了日常网络管理所需的一切，尽管它在可行范围内依赖默认的无线管理系统进行管理。更高级的功能也都有清晰的标签。\n\
    \n#### 功能\n\n除了连接和查看周围环境外，它还拥有大量不同的网络功能，可用于查找网络中的任何潜在问题。它管理的不仅仅是本地网络适配器；如果你愿意，它可以管理你的整个网络。\n\
    \n#### 自定义\n\n它在许多嗅探和路由工具方面表现出色，但在实际的网络连接方面则略显不足。很高兴你可以执行高度自定义的网络检测功能，但在这项测试中，我们更专注于实际建立网络连接。\n\
    \n#### 隐私\n\n除了找出网络中的漏洞外，该应用本身无法提供使连接私密化的方法。没有代理，没有隧道技术，当然也没有 Tor 工具。颇具讽刺意味的是，你可以发现网络问题，却无法在计算机上真正修复它们。\n\
    \n#### 总体评价\n\n网络工具在特定用途方面非常出色，但在实际管理网络连接方面稍显不足。这并不是它的错，如果你需要对网络进行全面且快速的检查，它非常棒。\n\
    \n![](img/daaca9116bc2b1db669c224de81abc7c_76_3.png)\n\n### Wicd\n\n一款流行的图形网络管理器，轻便且易于使用。\n\
    \n![](img/daaca9116bc2b1db669c224de81abc7c_76_4.png)\n\n每个连接拥有独立的配置文件，使得快速切换配置变得简单容易。\n\
    \n#### 易用性\n\n将所有重要内容置于前台，Wicd 让连接任何无线网络变得轻而易举，同时也为有线网络提供了出色的控制。任何配置菜单都绑定到单个连接，并且可以方便地找到快速断开所有连接和关闭\
    \ Wi-Fi 的选项。\n\n#### 功能\n\n除了单个连接偏好设置中的功能外，还可以通过界面访问一些高级设置，以更深入地利用网络；包括选择在进行更改时使用的外部程序，以及切换驱动程序等。\n\
    \n#### 自定义\n\n网络连接的几乎每个部分都可在某种程度上进行配置 – 从 IP 设置和网络 ID 到外部和底层系统如何连接和交互。这让你几乎可以为任何情况获取最佳的连接设置，比本次测试中的其他应用程序深入得多。\n\
    \n#### 隐私\n\n尽管你可以对单个连接和适配器进行大量的编辑和自定义，但没有代理工具，且隧道选项几乎被隐藏起来。如果你想获得更高的隐私保护，Wicd\
    \ 可能是一款你会配合 Tor 使用的工具。\n\n#### 总体评价\n\n在有限的管理器选择中，Wicd 显然是最好的。它的受欢迎程度名副其实，很高兴看到它越来越多地出现在发行版中作为默认管理器。\n\
    \n## 网络管理器\n\n### 简评：对比我们的结论\n\n| | lconfig | GNOME 网络 | 网络工具 | Wicd |\n|---|---|---|---|---|\n\
    | 易用性 | 比图形工具更难上手，但一旦掌握既快速又实用 4 | 设计简单清晰，功能不妥协 9 | 略显复杂，但关键工具位于主标签页，高级功能有标签 7\
    \ | 结构合理，配置菜单绑定到每个单独连接 8 |\n| 功能性 | 隐藏了许多功能，但没有代理控制 5 | 功能范围适中，并有高级设置选项 8 | 你可以使用此工具管理整个网络\
    \ 8 | 针对网络本身有很多高级选项 9 |\n| 自定义 | 非常可自定义的命令行工具；可以向字段输入外部数据 7 | 有线和无线连接均可设置地址、安全和热点控制\
    \ 7 | 非常适合网络检测，但在日常连接方面表现一般 5 | 几乎一切均可自定义，深入至驱动程序和底层交互 9 |\n| 隐私 | 仅限于 IP 隧道 –\
    \ 需要支持工具 3 | 系统级代理控制和飞行模式使其在隐私方面最佳 7 | 没有隐私工具来补充广泛的检测功能 0 | 没有代理且隧道几乎隐藏。最好与其他工具配合使用\
    \ 3 |\n| 总体评价 | 出色地完成简单工作。非常适合运行命令行界面的用户 5 | GNOME 简化过程的成功典范 – 良好的默认选项 8 | 最适合网络分析，而非管理你的连接\
    \ 6 | 完美胜任，且具有广泛的自定义设置 9 |\n\n### 获胜者是...\n\n### Wicd\n\n这真的是一场硬仗，最终对决集中在 GNOME\
    \ 网络和 Wicd 之间，但最后 Wicd 凭借广泛且深度可自定义的功能以及智能设计脱颖而出。虽然 GNOME 网络在大多数情况下是一个外观更好、功能更好的\
    \ GNOME 应用，但其极简设计并非适合所有人 – 尤其是那些希望在网络连接的某些方面深入细节的人。使用 Wicd，所有工具和信息唾手可得，并不会带来像网络工具那样的复杂性。相反，它和\
    \ GNOME 网络一样易用，但可供你实际操作的更多。\n\n![](img/daaca9116bc2b1db669c224de81abc7c_77_0.png)\n\
    \n![](img/daaca9116bc2b1db669c224de81abc7c_77_1.png)\n\n> Wicd 提供了丰富的选项，适用于单个连接和整个网络\n\
    \n在功能方面，我们特别喜欢独立的连接配置文件 - 如果你发现自己经常在需要不同设置的连接之间切换，这将是一个巨大的福音。更重要的是，所有高级选项都极具可配置性。如果你发现自己需要超越网络管理器的日常使用，你很可能不需要像使用\
    \ GNOME 网络那样去寻求第二工具。当然，除非你担心隐私功能的缺乏 – 这是这款否则卓越的网络管理器唯一真正的瑕疵。\n\nRob Zwetsloot\n\
