    \n然而，如果你有一个较长的程序的清晰想法，那么提前规划是非常值得的，用注释布局设计，然后添加代码片段——边测试边进行——直到你拥有一个功能正常的代码片段。这样做，即使你删除了注释，你的脚本也应该是有逻辑且易读的。\n\
