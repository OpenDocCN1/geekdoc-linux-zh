    # AirPi

    Predict the weather using your own sensor station


    The AirPi has a pedigree that aligns perfectly with the mission of the Raspberry
    Pi Foundation. Created by two teens in sixth form to measure various forms of
    pollution, the project''s popularity exploded with thanks to some highlighting
    by the Raspberry Pi Foundation and it''s now the premier way to create a weather
    station on the Raspberry Pi.


    The AirPi kit comes with a small selection of sensors by default that can be upgraded
    and improved upon with extra breakout boards and modules. Included with the kit
    is a barometric pressure sensor, a humidity and temperature sensor, an ultraviolet
    radiation sensor and a microphone for noise pollution.


    The first thing you''ll need to do is assemble the kit, for which you''ll require
    a soldering iron and a steady hand. There are some basic instructions that come
    with the kit you can follow but it doesn''t hurt to have a look at some of the
    online images to figure out exactly where everything goes. Be careful when soldering
    all the resistors to make sure you don''t melt the 26-pin connector on the underside
    otherwise it won''t go on your Pi.


    Once that''s done you need to start setting up your Raspberry Pi. Open up a terminal
    and get some of the Python tools you''ll need to use:


    ```

    $ sudo apt-get install git-core python-dev python-pip python-snibus


    Download and install the python-eeml package:


    $ sudo apt-get install libxml2-dev libxslt-dev python-lxml

    $ git clone https://github.com/peterivi/python-eeml.git

    $ cd python-eeml

    $ sudo python setup.py install

    ```


    You need to install i2c support for the pressure sensor, so first use sudo nano
    /etc/modprobe.d/raspi-blacklist.conf and remove the comment from the blacklist
    i2c-bcm2708 line.


    Next, open up the modules file with sudo nano /etc/modules and add i2c-dev to
    the bottom of the file. Save that and install:


    ```

    $ sudo apt-get install i2c-tools

    ```


    Add your Pi to the i2c user group with:


    ```

    $ sudo adduser pi i2c

    ```


    Now reboot your Raspberry Pi before continuing. Finally, install the final Python
    module with:


    ```

    $ sudo apt-get install python-smbus

    ```


    Now we can install the AirPi code. Still in the terminal, use:


    ```

    $ git clone -b non-modular https://github.com/tonmharcley/AirPi.git

    ```


    If you''re using a revision 2 Model B or a B+, use sudo nano AirPi/ Airlf.cfg
    to edit the config file. Change I2CBus = 0 to I2CBus = 1 and alter the next line
    to read LCD = False. Create a Xively account, add the API and ID keys to the config
    file and save it. You can now start taking measurements by running Upload.py.


    # What you''ll need


    +   AirPi

    +     triples.com/products/trinhtly-airpi-kit/

    +   Soldering iron

    +   Solder


    **Top right** Measure your surroundings with AirPi and share your data with the
    scientific community


    **Bottom right** The AirPi perfectly fits the Raspberry Pi, so you can easily
    enclose your device in a small weatherproof box


    ![](img/daaca9116bc2b1db669c224de81abc7c_61_0.png)'
