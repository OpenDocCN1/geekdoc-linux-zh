    \n最后，我们滥用 Bash 的动态类型特性来放置一个复活节彩蛋。\n\n# 编写有用的 Shell 脚本 – 第二部分\n\n为任何语言的原型程序建模\n\
    \n![](img/daaca9116bc2b1db669c224de81abc7c_26_0.png)\n\n## 01 博览群书\n\n在这几页中，我们只能触及脚本编写的表面。除了运行和修改这些教程中的代码外，还要深入挖掘你系统上尽可能多的\
    \ Shell 脚本。\n\n## 02 参数\n\n你开始会看到这样的事情——脚本中出现了一个 $1（以及通常是 $2、$3 等）而没有声明。这是你在调用脚本时输入的命令行参数。\n\
    \n![](img/daaca9116bc2b1db669c224de81abc7c_26_1.png)\n\n## 03 调用值\n\n我们可以在上个月的备份脚本中添加一些内容，以读取想要备份的目录名称。如果我们在\
    \ CURDIR 被赋值为 pwd 之前 cd 到该文件夹，那么脚本在未带参数调用时将在 $PWD 上工作。\n\n![](img/daaca9116bc2b1db669c224de81abc7c_26_2.png)\n\
    \n## 04 我们要到了吗？\n\n像这样的更改需要检查。你可能尝试备份一个你没有权限操作的目录。如果脚本没有足够的权限来 cd，那么它需要退出并告诉用户。\n\
    \n![](img/daaca9116bc2b1db669c224de81abc7c_26_3.png)\n\n## 05 陷阱！\n\n如果你在自己的代码中尝试了最后一步，你会发现如果目录参数有一个尾随斜杠，它将失败——因为它不会匹配没有斜杠的\
    \ pwd 报告。${1%/} 会去掉它。\n\n![](img/daaca9116bc2b1db669c224de81abc7c_26_4.png)\n\n\
    ## 06 位置参数\n\n除了 $1 等，还有 $0——它代表脚本被调用的名称。这里我们只是使用 $0 的名称，然后检查 $1 中什么是目录或文件。一个啰嗦的\
    \ if -F\n\n![](img/daaca9116bc2b1db669c224de81abc7c_26_5.png)\n\n## 用注释布局设计，然后添加代码片段\n\
    \n所有参数 —— $* 的展开 – 注意，不是 $(@) 或类似的 – 给你一个参数块来遍历。这里我们将它们回显出来并分类为目录或文件。\n\n## 08\
    \ 小步慢走\n\n目前还不是一个非常实用的程序，但我们将在未来回到位置参数——如果你使用 Bash 构建原型程序，你将需要它们。\n\n![](img/daaca9116bc2b1db669c224de81abc7c_26_6.png)\n\
    \n## 09 与你对话\n\n但是，为了真正具备交互性，我们需要在脚本执行期间从键盘读取输入，并将其捕获为变量 – 读取变量名就能很好地完成这项工作。\n\
    \n# 教程\n\n# 编写有用的 Shell 脚本 – 第二部分\n\n![](img/daaca9116bc2b1db669c224de81abc7c_27_0.png)\n\
    \n![](img/daaca9116bc2b1db669c224de81abc7c_27_1.png)\n\n# 15 将其分解\n\n# 10 需要选择\n\
    \n选择是好的——人们喜欢充满选项的友好菜单。虽然许多发行版提供 dialog 或 whiptail 来启用交互中的类菜单选择，但我们将使用基本的 Bash\
    \ 命令创建自己的。\n\n![](img/daaca9116bc2b1db669c224de81abc7c_27_2.png)\n\n# 11 哈里伯？\n\
    \n我们目前还没有验证输入 – 并且在下一页末尾我们依赖于此来放置一个复活节彩蛋！– 但对于你打算保留或分享的脚本，过滤掉无效的输入……\n\n> 编程，就其本质而言，是将复杂任务分解为简单部分\n\
    \n![](img/daaca9116bc2b1db669c224de81abc7c_27_3.png)\n\n![](img/daaca9116bc2b1db669c224de81abc7c_27_4.png)\n\
    \n![](img/daaca9116bc2b1db669c224de81abc7c_27_5.png)\n\n# 12 就案论案\n\nCase 允许你精确匹配每个选项，并丢弃其余部分。*\
    \ 像 `*` 一样作为通配符展开 – 在第 7 步的 $8* 示例中尝试它，看看你是否注意到任何输出差异。\n\n# 13 嵌套 if\n\n内置的 select\
    \ 命令是构建此类列表的另一种方式，但为了允许一些灵活性，你可以使用嵌套的 if 语句从头开始构建。注意用于验证输入为数值的正则表达式。\n\n# 14 规划以成功\n\
    \n它工作得很好，但我们正在接近一个需要思考和规划以避免错误的大小。Bash 非常适合这种规划，因为你可以从注释、通过条件语句和回显文本构建到命令……\n\n"
