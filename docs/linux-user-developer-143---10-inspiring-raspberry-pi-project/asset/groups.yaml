  mdcn: '


    # 开源软件专栏


    ### 世界是否应该更加“应用化”？


    西蒙质疑苹果公司塑造的“应用”文化是否对软件行业有益


    ![](img/daaca9116bc2b1db669c224de81abc7c_10_0.png)


    **西蒙·布鲁**是一名科技作家和编辑，其工作涉及 Linux、Windows 和 Mac OS X 平台


    ![](img/daaca9116bc2b1db669c224de81abc7c_10_1.png)


    没错！苹果通过其应用商店成功地为现代重新注入了计算机程序的活力。


    “Apple 化”（Apple-ﬁcation）其实并不是一个真正的词，但我也不会假装它是。不过，这个词正越来越多地（且糟糕地）被用来描述计算机产品和软件是如何被定义的。特别是，苹果采用了“app”（应用）这个词（它现在已经是一个标准词汇），并将它用来取代过去将事物描述为计算机程序的陈旧方式。在这个新的世界秩序下，我们甚至不再被允许称它们为“applications”（应用程序）了。


    苹果的营销智慧是众多详尽书籍和无尽 PowerPoint 演示文稿的主题，但它所取得的成就确实很有趣。毕竟，谁会称 iPad 为一台计算机呢？移动电话已被
    iPhone 的简称为取代，而在任何其他词前加上小写字母“i”似乎已成为如今许多重大产品发布的基础。天哪，我可能开始把这称为 iColumn，并寄出双倍的账单。值得一试。


    有趣的是，苹果的理念（无论是在用户界面还是专有技术方面）正在超越其通常关联的核心技术。例如，我最近买了一台新电视。拥有一台新电视总是很有趣，尤其是像我这样喜欢买新电视然后保持使用接近十年（当然是老式做法）的老古董。在开箱整理时，我注意到新的遥控器上似乎有一个“App”按钮，于是在电视启动并正常运行后我按了一下。正如你预期的那样，弹出了一个屏幕，列出了一组已安装的应用程序，并邀请我前往相关制造商所称的“应用商店”，在不引发苹果法律部门来函的前提下，尽量接近那个名称。毫无疑问，这是一个
    IT 威胁。


    很容易对“App”文化的泛滥嗤之以鼻，这种文化在某些情况下将臃肿的计算机程序削减为单项任务，这很大程度上是因为我新电视上的大多数选项都平淡无奇。不过，如果你回顾
    PC 的历史，预算发行商 Cosmos 曾靠将 Microsoft Office 的功能切割成块并单独销售软件而谋生了一段时间。比如，一个名片设计器或标签产品。你很可能已经拥有了这些功能，但对于一项工作使用一个工具，而不是一个涵盖许多功能的大型套件，在本质上显得更简单。


    苹果所做到的，以及开源软件时不时也采纳的，是将所有这些东西打包成听起来吸引人、非技术性且易于接近的形式。许多公司在苹果之前进行了技术探索，苹果站在巨人的肩膀上，如今许多人又站在苹果的肩膀上。但很少有公司能像苹果那样以如此吸引人的方式将一切打包在一起。


    这很遗憾，因为苹果提供的每一个工具，都存在一个称职到出色的开源替代品。但质量并不总能浮出水面，尤其是当大多数人通过搜索而非在实体商店浏览来找到他们的“应用”时。因此，这与许多人最初投身开源的一些理念背道而驰，也许在某种程度上（如果不是苹果的行为），一点苹果的影响反而对我们有益。


    # 内核专栏


    乔恩·马斯特斯总结了 Linux 内核社区的最新动态，从刚刚发布的 3.16 内核开始


    ![](img/daaca9116bc2b1db669c224de81abc7c_11_0.png)


    **乔恩·马斯特斯** 是一名 Linux 内核黑客，从事 Linux 工作已有约 19 年，自他 15 岁首次上大学时开始。乔恩住在马萨诸塞州剑桥，为一家大型企业
    Linux 供应商工作。他在 kernel@podcast.org 发布每日 Linux 内核邮件列表摘要


    在我们即将付印之际，林纳斯·托瓦兹宣布发布了 3.16 Linux 内核，并表示：“所以，本周没有什么特别令人兴奋的事情发生[自一周前的最终 3.16 发布候选版
    7 以来]，3.16 已经发布了。” 林纳斯在发布邮件中指出，3.16 的时间点对 3.17 的合并窗口（merge window）的影响可能有点不幸。“合并窗口”是（大致）为期两个月的内核开发周期初期允许重大内核变更发生的时期。通常，合并窗口限制在两三周以内，并且紧随上一个内核开发周期的最终发布之后。因此，3.17
    的合并正在开放，而林纳斯（和其他人）正准备前往芝加哥参加 2014 年内核峰会（以及 LinuxCon 会议）。林纳斯说：“所以我们将看看下一个合并窗口会怎样，但我不会过于担心。如果我发现没有时间完成所有合并，我可能会将事情推迟到内核峰会那一周，但我希望在上路之前，能在接下来的这一周完成大部分重要的合并。”


    在过去几周里，Linux 社区一直担忧 Linux 3.16 “看起来有点不对劲”，主要原因是开发周期后期代码变更量大。到了 3.16-rc6 时，林纳斯拉响了警报，说：“周复一周，我们达到了本应是最后一个
    rc 的阶段，但坦白说，情况并没有像预期那样平静下来。” 随后他指出 RC5 比 RC4 大，而 RC6 仍然比 RC5 大。“这不是这一切应该运作的方式，”
    林纳斯说。尽管如此，当 3.16 最终版发布时，林纳斯的焦虑感降低了，他认为情况已经“ nicely 清晰了”，就在他开始担心可能需要（异常地）额外的稳定
    RC 版的同时。有可能，这与人们对 3.17 合并窗口在内核峰会期间进行的担忧相结合，意味着在下一个合并周期中，对于此类代码变更会更加谨慎。


    Linux 3.16 带来了许多新功能。与许多最近的开发周期不同，这些新功能更加“内部化”——面向开发者——而非面向最终用户的革命性新功能。例如，内核的 earlyprintk
    诊断输出支持已被重构为新的通用 “earlycon” 接口，并且一些块 I/O 子系统组件已被移至内核的 `code/` 目录中（以更清楚地表明维护责任，而对代码本身的改动很少）。值得注意的面向最终用户的变更包括支持
    ARM64（Arch64）64 位 ARM 架构上的 UEFI 启动固件，这对于即将到来的行业标准 ARM 服务器浪潮将尤为重要，这些服务器都将使用此方法启动。


    ### 早期内核日志


    3.16 中重新设计的 “earlycon” 内核机制将现有的内核内 “earlyprintk” 机制在不同架构间进行了泛化。早期打印（Early printc）是一种机制，允许内核在启动过程的早期（在内核日志的常规设施完全上线之前）输出诊断信息（包括包含版本号的著名
    kernel_banner）。历史上，每种架构的实现方式略有不同。例如，64 位 ARM 架构——在内核中被称为 arm64——使用一个简单的驱动，该驱动在内核启动周期内的
    early_param 解析期间注册（在运行 setup_arch 之后，但在将基本的虚拟内存子系统启动并运行等更多操作之前）。ARM 内核会查找名为 “early_printk=”
    的内核命令行选项，该选项包含串行端口 UART 控制器的地址及其类型，内核在正确初始化其串行控制台之前会向该端口记录消息。


    那些在没有特殊 early_printk 选项的情况下启动的系统仍然可以看到启动消息，但它们会被缓冲，并在启动过程的稍后阶段（一旦日志记录的标准基础设施上线）显示出来。用户不太可能注意到这种差异，因为许多系统默认不显示这些消息，而且无论如何，缓冲只会将输出延迟不到一秒，但在那关键的一秒钟内，许多其他事情可能会出错，而内核开发者在调试关键内核问题时对此会很在意。用于诊断日志记录的新调试基础设施被称为
    “earlycon”，它取代了同名的启动参数。顺带一提，诸如 ACPI 等规范允许系统供应商定义诊断控制台，并且希望诸如 PC 等系统在未来能够自动使用此信息。


    '
