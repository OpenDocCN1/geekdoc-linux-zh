    ## OpenWRT 实现原生 IPv6 支持


    ### Barrier Breaker 版本引入了众多新功能


    流行的嵌入式发行版 OpenWRT 宣布了一个新版本，首次通过 DHCP 添加了对互联网协议第六版（IPv6）的完全原生支持。


    OpenWRT 通常被用于替换现成路由硬件上的原厂软件。之前的 OpenWRT 软件包已经逐步引入对 IPv6 的支持，首先实现了通过更常见的 IPv4 连接路由
    IPv6 流量。


    OpenWRT 14.07 版本被称为“Barrier Breaker”（壁垒破坏者），通过引入 DHCPv6 增强了 IPv6 协议栈，使基于 OpenWRT
    的路由器能够从广域网提供商处同时接收 IPv4 和 IPv6 地址。


    新增的其他功能包括源约束路由、路由器通告以及通过本地前缀分配实现的多宿主功能。


    最新版本中的其他调整包括：通过 netifd 优化无线配置、支持动态防火墙规则和安全区域、UCI 数据验证层、文件系统调整（包括快照和回滚），以及使用 HNCP
    标准实现家庭网络自管理的草案支持。


    此外，由于组织者对现有软件源质量的不满，还创建了一个新的软件源（package feed）。


    Barrier Breaker 版本使用 3.10 Linux 内核。项目领导层表示，他们计划在该年底前发布基于 3.14 或更新长期支持（LTS）内核版本的“Chaos
    Calmer”构建版。


    ## EFF 推出路由器操作系统


    ### 聚焦隐私的套餐在 HOPE X 大会上发布


    电子前沿基金会（EFF）发布了其计划中的路由器操作系统的“黑客阿尔法版”，这是该隐私组织“开放无线运动”（Open Wireless Movement）的一部分。


    基于 Linux 的 Open Wireless Router 软件是联合 Fight for the Future、Mozilla、Free Press
    以及其他隐私倡导组织共同开发的，旨在为互联网用户提供一种简单且易于使用的手段，以帮助提高他们的隐私保护水平。


    在其最终阶段，该软件将包括带宽控制的公共无线网络和加密的私有无线网络，提供匿名化和加密功能，加固以抵御攻击，并具备通过安全连接进行自动更新的机制。


    EFF 还承诺包含先进的网络队列功能，以降低时间敏感应用的延迟。这与公共网络侧的带宽控制相结合，有望鼓励用户在不使用网络密钥或其他认证措施的情况下，开放其互联网连接供公众使用。


    基于 Caro/WRT 项目，早期的阿尔法版本目前仅支持 Netgear WNDR3800 路由器。幕后团队在发布会上警告说：“此版本仍在开发中，仅供开发人员以及愿意接受前沿技术（bleeding
    edge）的用户使用。”


    ## 自由软件专栏


    ### 社区感


    尽管公司渴望从自由和开源软件中获利，但理查德不确定他们是否仔细考察过是什么促成了社区的运作


    ![](img/daaca9116bc2b1db669c224de81abc7c_9_0.png)


    > **Richard Hittlesey** *撰写* 关于艺术、音乐、数字权利、Linux 和自由软件的文章，发表于多种出版物


    正如理查德·斯托曼（Richard Stallman）仔细解释的那样，开源和自由软件是两个非常不同的概念（[www.gnu.org/philosophy/open-source-misses-the-point.html](http://www.gnu.org/philosophy/open-source-misses-the-point.html)）。虽然“开源计划”（Open
    Source Initiative）最初是 1999 年为了向企业推销自由软件而进行的营销举措，且开源倡导者往往倾向于将其据为己有，但自由和开源软件在商业世界的成功是由在
    Copyleft（版权复用）许可证下授权的 GNU/Linux 的兴起所保证的。


    自由软件可以被称为“开源”，许多开源软件也是“自由软件”，但这些术语不能互换。将自由软件与“开源”区分开来的概念是“四大自由”以及 Copyleft 理念（详见
    [www.gnu.org/philosophy/free-sw.html](http://www.gnu.org/philosophy/free-sw.html)）。Copyleft
    许可证（如 GPL）允许第三方获取代码、重新打包，并以他们希望的任何形式传播，但通过强制分发代码者在相同许可证下传递任何更改来确保互惠性，从而防止代码分叉（fork）并保留代码的开源和自由本质。


    Copyleft 的性质和影响对 GNU/Linux 的成功以及前 Unix 公司的采纳都至关重要。这些公司在 80 年代和 90 年代曾深受 Unix 和开放标准分裂之苦。如果从“Unix
    战争”中学到了什么，那就是专有操作系统，即使是自己的，也会花费资金并为企业业务的其它部分制造障碍。Unix 曾被誉为通用操作系统，而每一家 Unix 公司都投入巨大资源开发同一操作系统的专有条线，这以牺牲其核心业务——硬件、服务和用户层软件——为代价。


    GNU/Linux 的到来开辟了新的可能性。GNU/Linux “属于”所有人，并依据 GPL 授权。一旦超过一家公司对 Linux 形成承诺，大家就明显意识到对回馈该项目存在共同利益，于是他们确实这样做了。使这一切成为可能的框架是
    GPL。


    GPL 保护代码免受分叉，并促进了商品化（commodisation），而商品化降低了成本并惠及所有人。更宽松的许可证不会提供这种保护，分叉必然随之而来。核心企业代码的发布加速了
    Linux 的开发，确保了其在企业界的成功，并因其跨广泛硬件的可移植性而得到增强。数十家公司为 Linux 内核做出贡献，并获得了访问其他所有公司贡献利益的机会。这种效应使得以大大降低成本的方式将任何东西移植到任何平台上成为可能，因为成本是共享的。可移植性可能并非
    GNU/Linux 最初被采纳的因素，但它为众多参与者的长期利益发挥了作用，自由和开源软件因此普及，并带来了一些有益的后果。GNU/Linux 履行了 Unix
    的承诺，而无需应对无数不兼容且专有的 Unix 变体所导致的资源浪费。


    GPL 和 Copyleft 对这一成功的贡献并未总是得到应有的认可，原因有多方面。公司仍在寻找在回馈代码之前如何货币化他人贡献的方式，因此倾向于推广“开源”或诸如“开放核心”（open
    core）或版权转让等理念，希望在不承担返还更改义务的情况下赢得开发者的参与——通常以便将代码子集融入专有产品。


    行业中的“开源”倡导者也常常轻率地贬低 Copyleft 为不必要的装饰，或者找到方式歪曲其原始目的。然而，当代码的领导权和所有权存在双重性和模糊性时，项目不会蓬勃发展，就像
    Oracle 从 Sun Microsystems 继承的各种项目中产生的混乱所证明的那样。同样，诸如双重许可、版权转让和社区许可协议（CLAs）等机制，歪曲了开发者的共同目的，可以剥夺项目目的的清晰度，并对作为“开源”项目生命线的社区感产生阻碍作用。


    90 年代的 Linux “社区”以及如 Debian 等衍生项目，是围绕一件软件和促进互惠性的许可证成长起来的。它们几乎是自愿和自发的。软件和许可证是粘合剂。社区感、乐趣，以及“一切皆有可能”的坚定信心，是驱动力。也许令人遗憾的是，尽管公司热衷于从自由和开源软件中获利，但他们并不总是更仔细地审视是什么让这些社区有效运作。


