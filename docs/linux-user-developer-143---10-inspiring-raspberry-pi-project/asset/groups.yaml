    # **GROUP TEST**


    # # Network Managers


    Fundamental utilities and long-time favourites all go head-to-head as we pick
    the network manager that offers the complete package


    **Ifconfig**

    Part of your command line toolset, ifconfig can be used from your CLI or terminal
    emulator and is the bedrock of network management – many other network managing
    tools roll this up as part of the package, while some people prefer to use it
    direct. Check the docs for instructions on the options available.

    Documentation: bit.ly/1pol4eX


    **GNOME Network**

    A simple app you''ll find in many Ubuntu spins, and one that''s been around for
    absolutely years, the GNOME Network app is a simplified network connections manager
    that''s very much in line with GNOME design. It''s also one that most people have
    used at some point.

    Download: bit.ly/U2P65I


    **Network Tools**

    Again pre-installed in many Ubuntu spins, Network Tools is the more advanced counterpart
    to GNOME Network. Offering all sorts of functionality, it''s often the first port
    of call for those who are looking to undertake more involved network detection
    tasks or identify problems.

    Download: bit.ly/1uiCPyl


    **Wicd**

    Something of a rising star, Wicd has been turning up as the default network manager
    in more and more Linux distros of late. It boasts a number of interesting features,
    too, including few dependencies and separate profiles for each network connection.

    Download: bit.ly/1rC17CI'
  - '[PAGE 75]


    # Review


    ![](img/daaca9116bc2b1db669c224de81abc7c_75_0.png)


    # Iconfig


    Your standard Linux network-managing command line tool, preferred by many


    ![](img/daaca9116bc2b1db669c224de81abc7c_75_1.png)


    +   - ifconfig outputs can help you identify problems with your connections, if
    you know how to read them


    # Ease-of-use


    As a command line tool, ease of use is very subjective. Learning it from scratch
    is much more difficult than figuring out how the individual elements work in a
    graphical tool. Having said that, once you know exactly what you''re doing, it
    can be fast and very useful.


    # Functions


    There are plenty of functions hidden away in ifconfig for various connection settings
    such as MTUs and tunnelling along with the basic features needed to get a wired
    or wireless network setup. There''s no proxy control going on though that you
    can append to settings, meaning you''ll need an external program for that.


    # Customisation


    Being a command line tool, it''s dangerously customisable in that any function
    can be done literally however you want – it will just break the connection much
    more easily than you''d be able to do with the graphical tools in this test. This
    also means you''re more able to bring in external data to input into your fields,
    which the other tools don''t allow.


    # Privacy


    IP tunnelling is about the only thing you can do in terms of privacy without bringing
    in external proxy or Tor tools. Tor is a lot more powerful than the tools you
    could get for ifconfig, but some extra form of privacy control would still be
    a great addition if the tool were ever to be updated.


    # Overall


    > Iconfig is a simple command line tool that does the job it was designed for
    and quite well at that. If you''re running a command line interface it''s still
    an excellent way to configure your networks.


    5


    ![](img/daaca9116bc2b1db669c224de81abc7c_75_2.png)


    # GNOME Network


    GNOME''s networking tool is quite basic but still very functional


    ![](img/daaca9116bc2b1db669c224de81abc7c_75_3.png)


    +   - Easily accessible proxy settings are a welcome sight in this straightforward
    software


    # Ease-of-use


    As a GNOME app, Network is easy to navigate and laid out very plainly and simply
    within a single window. All the major options are available from here with more
    advanced settings available through a clearly labelled button. It''s classic GNOME
    design but instead of taking away features, it instead just makes everything a
    little easier to get to.


    # Functions


    There is a decent selection of features available throughout Network, with advanced
    setup for the various networks you''ve set up. There''s also an airplane mode,
    similar to that in a mobile phone, and another example that GNOME is thinking
    more in terms of portable computing these days.


    # Customisation


    Both wired and wireless have pretty great customisation controls, allowing you
    full control over addresses for both IPv4 and v6 along with various security controls
    and even the ability to turn the wireless communications into a hotspot. It''s
    about the same as you''d get from something like ifconfig but it''s presented
    a lot better.


    # Privacy


    As well as the aforementioned airplane mode that is quite good for just cutting
    off all access, there are simple proxy controls that can be applied system-wide
    to give you a little more security over the internet. They''re nothing on Tor
    but they do a lot more than your standard connections.


    # Overall


    > Network is one of the few GNOME apps that we really like, as the simplification
    process has made it easier to use and not dumbed down the entire application.
    If you''re using it by default, you''ve got a great app.


