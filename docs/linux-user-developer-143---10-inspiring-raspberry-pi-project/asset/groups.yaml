    #  Linux 主导 TOP500 超级计算


    # 驱动 97% 的高性能系统


    根据最新的 TOP500 调查结果，GNU/Linux 依然保持着高性能计算（HPC）领域最受欢迎操作系统的地位。


    半年发布一次的 TOP500 列表记录了全球 500 台最强大的超级计算机系统。今年的榜单显示对 Linux 变体的依赖仍在持续，其中令人瞩目的是，列出的
    500 台计算机中有 486 台使用 Linux 变体——其中包括全球最快的超级计算机，中国的天河二号（MilkyWay-2），以及沙特阿拉伯的一套混合平台蓝色基因系统，该系统将
    SUSE Linux Enterprise Server 9 与 IBM 的计算节点内核（CNK）结合使用。


