  - '[PAGE 34]


    # Upgrade your private cloud with ownCloud 7


    Access, sync and share your data much more effectively


    TUTORIAL


    ![](img/daaca9116bc2b1db669c224de81abc7c_34_0.png)


    # Your data - under your control


    With ownCloud you can sync & share your files, calendar, contacts and more.


    Access your data from all your devices, on an open platform you can extend and
    modify.


    # 01 The UI


    With ownCloud 7, the old UI has made way for a neat and clean new UI – with clear
    focus on sharing and segregation of features. Almost all of the pages you go to
    now have an option to share. If you’ve used the older versions you’ll notice a
    lot of changes: the left menu panel now only shows options specific to the section
    that you are currently in. You can select various sections using the drop-down
    at the top-left; the various sections available are Files, Activity, Pictures,
    Contacts, Calendar, Bookmarks and Apps. So, for instance if you are in “Files”,
    you can see options related to files only, and these options change as you move
    to other sections. The user related menu remains unchanged though; you can access
    it by clicking the drop-down next to your login name on the top-right corner.


    # 02 Files


    As a cloud storage tool, file handling is probably the most important aspect of
    ownCloud, and the latest version takes it a notch higher. While earlier it was
    difficult to keep track of files shared by someone else (with you) and your own
    files, with ownCloud 7 you get the option to separately view the files shared
    to you or shared by you. Even the files shared via links can now be viewed separately.
    The act of sharing remains the same, though; just hover on the file to be shared
    and you can see the share icon along with download and versions. As earlier, files
    can be shared to your ownCloud groups and users or to someone not on your ownCloud
    via a link. The old rename option has been now reduced to just an icon, placed
    closer to the file name.


    # 03 Activity


    Before, while using ownCloud, you’d be pretty much on your own. Even if there
    were other users doing their stuff, it was all pretty much invisible to you. There
    was no way to actually have a clear picture of what is going on. Considering how
    important online interaction is these days, it was something of a mild annoyance.
    With the latest release has been taken care of. Activity is a section now available
    under the top-left corner menu, which lets you see (and can even send you email
    notifications about) the activity going on around you. You can see if someone
    has shared a file, renamed or deleted it, etc. Again, here you have the option
    to view just yours, or others, or both activities.


    # 04 Contacts & Calendar


    Contacts have been completely revamped with this version of ownCloud. While earlier
    there were only a few fields with very little relevant information stored, the
    contacts section now captures complete data such as email addresses, phone numbers,
    and more. You even have the option to add extra fields to contacts as per your
    needs. Head over to the contacts section to view it in action. Calendar also seems
