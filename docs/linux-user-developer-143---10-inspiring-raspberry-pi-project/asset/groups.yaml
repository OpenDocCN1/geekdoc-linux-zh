    # 户外延时摄影相机


    使用您的树莓派、Pi 相机和一个简单的 Python 脚本拍摄美丽的日落景色


    **您需要什么**


    - Pi 相机模块

    - 一个防天气的盒子，例如 PICE+


    我们非常喜爱树莓派相机。这是一个精致的小部件，和树莓派一样功能强大，甚至不会占用任何 USB 插槽。我们过去做过一些延时摄影，但当时使用的是连接在树莓派上的专用相机——现在，得益于
    picamera Python 模块，我们仅使用 Pi 相机和更少的代码就能实现同样的效果。


    然而，在开始编写代码之前，我们需要在树莓派上做一些设置。我们将假设您有一张新安装的 Raspbian SD 卡，因此首先要做的是执行 `apt-get update`，然后执行
    `apt-get upgrade`，以确保您的文件是最新的。接着执行 `rpi-update` 以确保您的固件也是最新的——这一步非常重要，因为如果您使用的是过时的固件，相机将无法正常工作。


    下一步是启用相机。如果您在桌面环境下，请打开终端；或者直接在命令行中键入：


    ```

    $ sudo raspi-config

    ```


    找到“启用相机”选项。按回车键，然后导航到“Enable”并确认。选择“完成”但不要立即重启，因为您还有一些命令需要执行。使用以下命令安装您的 picamera
    模块：


    ```

    $ sudo apt-get install python-picamera

    ```


    您还需要安装用于将图片编译成最终延时视频的软件开发包。我们使用 gstreamer 来编译视频，因为它与树莓派的 GPU 配合良好。要安装它，首先使用以下命令将软件源添加到源列表中：


    ```

    $ sudo sh -c ''echo deb http://vantaane.de/raspbian-updates/ . main >> /etc/apt/sources.list''

    ```


    **左图** 在树莓派断电的情况下，做好接地保护，并小心插入您的 Pi 相机。


    **下图** PiCE+ 盒子目前正在 Kickstarter 上进行众筹，因此在撰写本文时还无法买到，但请留意今年年底前可能会上市


    执行一次 `apt-get update`，然后使用以下命令安装大量软件包：


    ```

    $ sudo apt-get install libgstreamer1.0-0 liborc-0.4-0 gir1.2-gst-plugins-base-1.0
    gir1.2-gstreamer-1.0 gstreamer1.0-alsa gstreamer1.0-omx gstreamer1.0-plugins-bad
    gstreamer1.0-plugins-base gstreamer1.0-plugins-oss-apps gstreamer1.0-plugins-good
    gstreamer1.0-plugins-ugly gstreamer1.0-pulseaudio gstreamer1.0-tools gstreamer1.0-x
    libgstreamer-plugins-bad1.0-0 libgstreamer-plugins-base1.0-0

    ```


    解压文件，并使用 IDLE 快速浏览一下。如果您希望修改代码，请注意代码中的几个要点。`photos` 变量被设置为 500，这是编译视频前要拍摄的照片数量。实际上，由于
    Python 的数学特性，它可能会多拍一张，但这通常无关紧要。`delay` 参数以秒为单位，通过稍微研究一下就可以发现，以 30 秒间隔拍摄 500 张照片大约需要
    4 个小时完成。


    完成后，关闭树莓派。拔掉 USB 线，找到用于相机的专用 DS1 端口，它位于 HDMI 端口旁边。轻轻捏住边缘抬起卡扣，插入您的树莓派相机排线——确保银色连接器面向
    HDMI 端口。重新打开树莓派并回到 Raspbian 系统。此时一切应该都准备就绪了，所以请通过打开终端并使用以下命令来测试相机：


    ```

    $ raspistill -o test.jpeg

    ```


    那行较长的 `subprocess.call` 代码用于将图片以每秒 24 帧的速度编译成 AVI 文件。它使用我们之前提到的目录的完整路径，如果您的路径有所不同，请确保现在将其更改。


    您可以使用它制作户外延时摄影的方法有很多种；最简单且最安全的方法是找到一扇拥有您所需视野的窗户。不过，这并不总是容易做到的，在这种情况下，我们建议您尝试 PiCE
    或 PiCE+ 盒子。这是一个耐用且防水的盒子，专为容纳树莓派和 Pi 相机而设计。一旦安装到位，您只需将其连接到电源（最好使用长线），然后运行代码。完成后，取回树莓派和
    AVI 文件。


    它会显示预览屏幕，然后在五秒后拍摄一张照片；如果能做到这一点，您就可以准备好使用我们的代码了。我们首选的方法是先在主目录下创建一个名为 `timelapse`
    的文件夹；您只需打开终端并输入以下命令即可实现：


    ```

    $ mkdir timelapse

    ```


    通过对代码和树莓派进行一些修改，您可以让它变得更加自动化，例如在启动后运行 Python 脚本，并将其上传到我们之前设置的云存储。得益于随 PiCE 附带的额外防护罩，我们甚至可以将它用作闭路电视（CCTV）摄像头。


    如果您没有更改用户名等设置，这应该会在 /home/pi/timelapse 创建该目录。请记住这一点，我们稍后也会解释其重要性。现在，在终端中，我们将下载为本项目创建的
    Python 代码：


    ```

    $ wget http://www.linuxuser.co.uk/wp-content/uploads/2014/08/timelapse.zip

    ```


    # 10 个鼓舞人心的树莓派项目


    # 延伸阅读


    在这些精彩的资源中找到更多灵感


    如果您已经完成了所有十个项目，甚至尝试将它们中的几个结合起来，您可能会想知道接下来该去哪里。嗯，我们可以为您提供许多方向，以获取更多鼓舞人心的项目，以及购买零件和阅读您不确定之处的技术细节的地点。除了下面的资源外，我们的网站（www.linuxuser.co.uk）上也有大量关于树莓派的好内容——只需搜索“Raspberry
    Pi”即可。我们还推荐阅读《树莓派：完整手册》（见右侧）以及位于《Linux 用户与开发者》应用特刊栏目的《理解与实现 Python》。


    立即购买：imagineshop.co.uk


    # Adafruit 学习系统


    如果您正在寻找更多灵感，那么 Adafruit 学习系统是一个绝佳的起点，特别是如果您查看主要的树莓派类别。您可以在这里找到几十个更多的项目，它们将考验您的知识并帮助您进一步扩展，如果您需要任何
    Adafruit 模块或其他零件，您总是可以从页面顶部链接的商店中获取。这是一个很棒的小社区，参与其中非常有价值，创建账户并上传您自己的项目也是值得的。


    learn.adafruit.com/category/raspberry-pi


    # CPC


    对于电子元件，我们建议您访问 CPC。对于这个项目专题，我们在这里购买了大部分我们手头没有的元件（例如延时摄影项目的相机）。对于在线下的英国订单，您甚至可以享受免费配送和当天发货服务。CPC
    的目录确实非常全面，您可以从那里买到几乎任何您需要的电子元件。


    cpc.farnell.com


    # 树莓派基金会


    随着树莓派受欢迎程度的增长，基金会的网站也日益壮大。新博文不断发布，宣布像 Model B+ 这样的新设备，您还会找到展示树莓派社区整体完成的许多惊艳作品的帖子。当您想要寻找灵感来激发自己的新想法时，这是一个很好的去处——在“社区”选项卡下也有一组推荐的资源源，因此您可以随时关注最新的项目动态。


    www.raspberrypi.org/forums

