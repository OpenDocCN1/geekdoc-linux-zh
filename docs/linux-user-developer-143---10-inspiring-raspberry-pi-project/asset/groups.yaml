    \ 接口，用于连接高速扩展板。也有更便宜的版本，不包含 mSATA 和 mPCIe。**newit.co.uk**\n\n> “定位为那些觉得树莓派不够用的用户的升级之选”\n\
    \n除了这些恼人的问题外，启动香蕉派你会发现该项目也有很多值得推荐的地方。为了加快上市速度，Lemaker 选择致力于将现有的 Linux 发行版移植到其主板上，而不是自己制作一个发行版。因此，用户可以下载\
