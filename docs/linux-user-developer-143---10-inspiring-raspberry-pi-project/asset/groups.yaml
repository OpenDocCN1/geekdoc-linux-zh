  - '[PAGE 79]


    # Review


    # MINI PC


    # Banana Pi


    $48.88/£28.50


    Does the first of the true Raspberry Pi clones have what it takes to come out
    from the shadow of its highly successful inspiration?


    ![](img/daaca9116bc2b1db669c224de81abc7c_79_0.png)


    +   * **Pros**

    +       * The dual-core ARMv7 processor, 1GB of RAM and SATA connector make it
    an upgrade from its source of inspiration


    +   * **Cons**

    +       * The design isn’t as Raspberry Pi compatible as it first appears, while
    its clone nature may be off-putting to many


    Even if Lemaker, the Chinese-based company behind the Banana Pi, had picked a
    different name for its product, there would be no hiding its source of inspiration.
    The single-board computer boasts a 26-pin general-purpose input-output (GPIO)
    header at the top-left, both composite and HDMI video outputs, a 3.5mm stereo
    analogue audio jack, uses an SD slung on the underside for storage, and includes
    two USB 2.0 ports and an Ethernet connector.


    In some respects, it’s surprising it has taken this long for someone to create
    a Pi-alike. A dig into the specifications reveals rather interestingly that the
    Banana Pi isn’t a direct clone, but a considerable evolution: the single-core
    ARMv6 700MHz Broadcom BCM2835 is replaced with a more modern dual-core ARMv7 1GHz
    AllWinner A20, the RAM doubled to 1GB, and additional connectivity added in the
    form of a SATA 2.0 port with on-board 5V power supply for 2.5” storage devices.


    The Banana Pi, then, is being positioned as an upgrade for users who have found
    the berry-flavoured variant lacking. Sadly, there is a fistful of caveats for
    those hoping for a drop-in solution to their woes. The Banana Pi’s footprint is
    somewhat larger than that of the Raspberry Pi, meaning that it’s not directly
    compatible with any cases or mounts designed for its rival. The 26-pin GPIO header,
    while designed to be pin-for-pin compatible electrically, is shifted sideways
    from the Raspberry Pi layout to make room for a corner mounting hole. This causes
    larger piggyback boards to foul on the composite video output.


    A bigger issue presents itself in what Lemaker calls the Camera Serial Interface
    (CSI) connector. The A20 chip lacks a true CSI implementation, using instead a
    parallel camera interface. As a result, there are no off-the-shelf camera modules
    that will connect to the Banana Pi, although Lemaker promises to launch a module
    of its own in the near future.'
  md: "\n## Network Managers\n\nWhich is best for handling your day-to-day network\
    \ connections?\n\n![](img/daaca9116bc2b1db669c224de81abc7c_76_0.png)\n\n![](img/daaca9116bc2b1db669c224de81abc7c_76_1.png)\n\
    \n### Network Tools\n\nWith a lot of superfluous features, does it include the\
    \ core ones?\n\n![](img/daaca9116bc2b1db669c224de81abc7c_76_2.png)\n\nThe huge\
    \ amount of info in Network Tools makes it easier to troubleshoot your network.\n\
    \n#### Ease-of-use\n\nWhile slightly more intimidating for newcomers, the main\
    \ tab in Network Tools has just about everything you need for normal network management,\
    \ although it does rely on default system wireless managing where it can. The\
    \ more advanced features are plainly labelled, too.\n\n#### Functions\n\nThere\
    \ are a huge amount of different networking functions not only for connecting\
    \ and seeing what's around but also for looking around your network for any problems.\
    \ It manages a lot more than just your local network adapters; it can manage your\
    \ entire network if that's a thing you'd want it to do.\n\n#### Customisation\n\
    \nIt's great for a lot of the sniffing and routing tools but for the actual network\
    \ connection it's a little lacking. It's nice that you can do really customised\
    \ network detection functions but we're concentrating a little more on actually\
    \ making the connection to the network in this test.\n\n#### Privacy\n\nApart\
    \ from figuring out the vulnerabilities in your network, there's no way to actually\
    \ make your connection private from within the app itself. No proxy, no tunnelling\
    \ and certainly no Tor tools either. It's a little ironic that you can figure\
    \ out the problems with your network and then can't really fix them on your computer.\n\
    \n#### Overall\n\nNetwork Tools is very good for specific uses but for actually\
    \ managing your network connections it fails a bit shy. It's not really its fault,\
    \ though, and it's great if you need a proper and quick look through your network.\n\
    \n![](img/daaca9116bc2b1db669c224de81abc7c_76_3.png)\n\n### Wicd\n\nA popular\
    \ graphical network manager that's lightweight and easy to use.\n\n![](img/daaca9116bc2b1db669c224de81abc7c_76_4.png)\n\
    \nSeparate profiles for each connection make it quick and easy to switch setups.\n\
    \n#### Ease-of-use\n\nPutting everything important up front, Wicd makes connecting\
    \ to any wireless network easy while also having great controls for wired networks\
    \ as well. Any configuration menus are tied to the individual connections as well,\
    \ and some quick options to disconnect everything and turn Wi-Fi off are readily\
    \ available.\n\n#### Functions\n\nAs well as the functions within the individual\
    \ connections' preferences, there are some advanced settings available via the\
    \ interface to get a little bit more out of the network; from selecting what external\
    \ programs to use when making changes to switching the drivers as well.\n\n####\
    \ Customisation\n\nAlmost every part of the networking is in some way configurable\
    \ – from the IP settings and network ID down to the way that external and low-level\
    \ systems connect and interact. This lets you really get the optimal connection\
    \ settings for just about any situation and goes a lot deeper than the other apps\
    \ in this test.\n\n#### Privacy\n\nFor all the editing and customising you can\
    \ do for the individual connections and adapters, there are no proxy tools and\
    \ an almost hidden-away tunnelling option. Wicd is probably something you'd be\
    \ using in conjunction with Tor, if you want to have a bit more privacy.\n\n####\
    \ Overall\n\nOf a limited selection of managers, Wicd is clearly the best of the\
    \ bunch. Its popularity is well earned in this case and it's great to see it popping\
    \ up more and more in distros as the default manager.\n\n## Network Managers\n\
    \n### In brief: Compare and contrast our verdicts\n\n| | lconfig | GNOME Network\
    \ | Network Tools | Wicd |\n|---|---|---|---|---|\n| Ease-of-use | Harder to learn\
    \ than a graphical tool, but fast and useful once mastered 4 | Simple, clear design\
    \ that doesn't compromise on features 9 | A little complex, but the key tools\
    \ are in the main tab and advanced features are labelled 7 | Sensibly structured\
    \ with config menus tied to each individual connection 8 |\n| Functionality |\
    \ Plenty of features hidden away, but no proxy control 5 | Decent range of features\
    \ and advanced setup options 8 | You could manage your entire network using this\
    \ tool 8 | Lots of advanced options for the network itself 9 |\n| Customisation\
    \ | Very customisable command line tool; can input external data into fields 7\
    \ | Address, security and hotspot controls are available for wired and wireless\
    \ connections 7 | Great for network detection, not so much for day-to-day connection\
    \ 5 | Almost everything is customisable, down to drivers and low-level interactions\
    \ 9 |\n| Privacy | Limited to IP tunnelling - supporting tools needed 3 | System-wide\
    \ proxy controls and an airplane mode make this tool best for privacy 7 | There\
    \ are no privacy tools to complement wide range of detection features 0 | No proxy\
    \ and tunnelling is almost hidden. Best used with another tool 3 |\n| Overall\
    \ | Does a simple job well. Great for those running a command line interface 5\
    \ | A successful example of GNOME's simplification process - good default option\
    \ 8 | Best used for network analysis, rather than managing your connections 6\
    \ | Perfect for the job and with a wide range of customisable settings 9 |\n\n\
    ### AND THE WINNER IS...\n\n### Wicd\n\nIt really was a tough one, with the battle\
    \ ultimately coming down to GNOME Network and Wicd, but in the end it was Wicd's\
    \ wide array of deeply customisable features and smart design that gave it the\
    \ edge. While GNOME Network is a better-looking and better-functioning GNOME app\
    \ most, the minimal design isn't for everyone - especially those who are looking\
    \ to go into more detail on certain aspects of their network and connections.\
    \ With Wicd, having all of the tools and information readily available doesn't\
    \ translate into the kind of complexity you get with Network Tools. Instead, it's\
    \ just as easy to use as GNOME Network but with way more for you to actually play\
    \ with.\n\n![](img/daaca9116bc2b1db669c224de81abc7c_77_0.png)\n\n![](img/daaca9116bc2b1db669c224de81abc7c_77_1.png)\n\
    \n> Wicd is packed with options for both individual connections and your whole\
    \ network\n\nFeature-wise, we particularly like the separate connection profiles\
    \ - a real boon if you find yourself switching between connections that require\
    \ different settings quite often. More than that, though, is the fact that all\
    \ of the advanced options are hugely configurable. If you find yourself needing\
    \ to step beyond the usual day-to-day use of a network manager, it's likely you\
    \ won't have to go for a secondary tool as you would with something like GNOME\
    \ Network. Unless, of course, you're concerned about the lack of privacy features\
    \ - our only real gripe with this otherwise excellent network manager.\n\nRob\
    \ Zwetsloot\n\n## Subscribe\n\nSubscribe today & start saving\nNon-USA readers\
    \ see page 24\n\n### USA special offer\n\n### Subscribe today and get\n5 free\
    \ issues*\n\n![](img/daaca9116bc2b1db669c224de81abc7c_78_0.png)\n\n### Exclusive\
