  md: "\n## On the DVD\n\nFind out what lies in store for you on issue 143's Linux\
    \ User & Developer DVD...\n\nWelcome to the Linux User & Developer DVD, accompanying\
    \ issue 143 and delivering the hottest new distros and libre software.\n\nThis\
    \ month you'll find the Tails 1.1 update, Ubuntu 14.04.1 and also CentOS 7 on\
    \ your DVD, with the new CentOS being based on the recent Red Hat Enterprise Linux\
    \ 7 release. As well as this, we've also included the GPartEd Live partition manager\
    \ environment for you.\n\nAs usual, you'll also find 20 software packages covering\
    \ some of the tools we look at this issue and a bunch of other useful programs.\
    \ Plus there's access to all the code from this month's tutorials.\n\n- **Distros**\n\
    \  - Tails 1.1 and Ubuntu 14.04.1 both live-boot from your DVD. CentOS 7 and GPartEd\
    \ Live are both ISOs that can be downloaded.\n\n- **Tutorial Files**\n  - The\
    \ staple of every issue, you can find all the assets and code you'll need to follow\
    \ the tutorials in this section of your DVD\n\n- **Software**\n  - Here you'll\
    \ find 20 of the latest and greatest software packages, including this issue's\
    \ group-tested network managers\n\n- **Tutorial Archives**\n  - De-archived for\
    \ your programming pleasure, some of the greatest guides from past issues\n\n\
    ![](img/daaca9116bc2b1db669c224de81abc7c_95_0.png)\n\n### How to burn an ISO\n\
    \nWant to try a new distro ISO? Here's how to get started...\n\n- **STEP 1: Grab\
    \ a new ISO**\n  - Copy the distro's ISO from our cover disc to your hard drive:\
    \ go to the Distros tab, click ISO and choose to Save. Alternatively, find an\
    \ ISO online to download. If you're not sure if you need a 32-bit or 64-bit version,\
    \ go with the former to be safe.\n  \n  ![Step 1 Screenshot](placeholder_for_step1_screenshot)\n\
    \n- **STEP 2: Open or install Brasero**\n  - Brasero is the most popular open\
    \ source disc-burning utility. If it's not already installed on your distro, locate\
    \ it in your distro's repository and install it. Then open the program and select\
    \ 'Burn image' from the Projects tab on the left.\n  \n  ![Step 2 Screenshot](placeholder_for_step2_screenshot)\n\
    \n- **STEP 3: Burn your disc image**\n  - On the Image Burning Setup menu, click\
    \ the first box - marked 'click here to select a disc image' - and navigate to\
    \ the ISO you just put on your hard disk. Once selected, ensure you've got a CD\
    \ or DVD writable disc inserted and click 'Create Image'.\n  \n  ![Step 3 Screenshot](placeholder_for_step3_screenshot)\n\
    \n### On the DVD\n\nWelcome to the Linux User & Developer DVD\n\n### Editor’s\
    \ picks\n\n**Hugin** The possibilities for image editing on Linux can often feel\
    \ quite limited, so Hugin is refreshing for being not just another GIMP clone\
    \ but a unique tool in itself. Use it to stitch together a mosaic of overlapping\
    \ photos into a single immersive panorama. It’s good fun.\n\n**Geany** This is\
    \ essentially a text editor using the GTK2 toolkit, offering the features of a\
    \ basic integrated development environment. Aside from being lightweight and fast,\
    \ it’s also designed to be independent from DEs such as KDE or Gnome, requiring\
    \ just the GTK2 library.\n\n**Tor** If you don’t want to hop onto Tails for some\
    \ safe surfing then you can always set up Tor for yourself. It seems to be making\
    \ the news almost every week now, and Tor is popular for a reason – get ahead\
    \ of the curve and protect your privacy now.\n\n### Complete index\n\n#### Operating\
    \ systems\n\n**Tails 1.1** This updated version of Tails now includes some user-visible\
    \ changes in addition to security and bug fixes, such as UEFI boot support and\
    \ VirtualBox guest modules.\n\n**CentOS 7** With the recent release of RHEL 7,\
    \ CentOS has gone up a version number as well. Among the improvements is the inclusion\
    \ of systemD, Gnome3 and a default XFS file system.\n\n**Ubuntu 14.04.1** The\
    \ first of many more point updates to come, this release includes security updates\
    \ and updated installation media, to reduce the amount of updates needed post-installation.\n\
    \n**GParted Live** This great tool provides you with a graphical environment for\
    \ any partitioning tasks you need to carry out. It contains all the tools you’d\
    \ find in the GParted application.\n\n![](img/daaca9116bc2b1db669c224de81abc7c_96_0.png)\n\
    \n#### Software\n\n- Audacious\n- ARM Eclipse plug-in\n- Audacity\n- Dropbox Python\
    \ SDK\n- Filezilla\n- Firefox\n- Geany\n- GRUB\n- Hugin\n- KDiff3\n- Midori\n\
    - NetworkTools\n- NumPy\n- OWASP ZAP\n- PostInstallerF\n- Python 2\n- SMPlayer\n\
    - SQLite Browser\n- Tor\n- Wicd\n\n![](img/daaca9116bc2b1db669c224de81abc7c_96_1.png)\n\
    \n> It’s the closest you’ll get to Red Hat without paying for it\n\n![](img/daaca9116bc2b1db669c224de81abc7c_96_2.png)\n\
    \n> You can get set up with Tor using the included files\n\nImagino Publishing\
    \ Ltd \nRichmond House, 33 Richmond Hill \nBournemouth, Dorset, BH2 6EZ \n+44\
    \ (0) 1202 586200 \nWeb: www.imagino-publishing.co.uk \nwww.imumag.co.uk \nwww.greatgifts.com\n\
    \nNext issue \nWhat’s coming up ... \nLook for \nissue 144 on \n25 September \n\
    Want it sooner? \nSubscribe \ntoday!\n\n## COMING IN THE NEXT ISSUE\n\n![](img/daaca9116bc2b1db669c224de81abc7c_97_0.png)\n\
    \n### Install Linux on Android\n\nSpecialist distros, \nyour favourite tools,\
    \ \non your device\n\n### Build a looping drum machine\n\nLiam shows us how to\
    \ make \na simple audio sampler using \nthe power of Raspberry Pi\n\n### Write\
    \ useful shell scripts — part 3\n\nRichard Smedley concludes \nhis brilliant Bash\
    \ series\n\n### Manage enterprise content with Alfresco\n\nDiscover the open source\
    \ answer \nto SharePoint and streamline \nyour content management\n\n#### ALSO\
    \ INSIDE:\n\n- Using Nginx with Joomla!\n- IMAP/POP3 servers with Node.js\n- Mastering\
    \ awk and SED\n- Nvidia Jetson TK1 reviewed\n\nMagazine Team\n\nDeputy Editor\
    \ **Gavin Thomas**\ngavin.thomas@imagino-publishing.co.uk\n\nDesigner **Sam Kilburn**\n\
