    ## Linux 的崛起

    ### 从 Sinclair QL 到树莓派


    **专题报道**


    ![](img/daaca9116bc2b1db669c224de81abc7c_20_0.png)


    ![](img/daaca9116bc2b1db669c224de81abc7c_20_1.png)


    当时还有大量工作要做。SLS 的缺陷促使 Patrick Volkerding 创造了 Slackware，它后来成为许多商业发行版（包括 Red Hat
    和 SuSE）的蓝图。对 SLS 的不满也是 Ian Murdock 决定发起 Debian 项目的动力。他在 1994 年写道：“SLS 可能是现有 Linux
    发行版中 bug 最多且维护最差的。不幸的是，它也很可能是最受欢迎的。”


    ### 协作的妙计


    Linux 的出现恰逢万维网（World Wide Web）的诞生，以及第一代能够更广泛访问互联网的学生和程序员的出现。由此诞生了分布式开发方法论的雏形，这是一种无计划且自然形成的方法，当它与自由软件框架相结合时，将彻底改变编程世界。


    Murdock 的想法是利用这种协作技巧并将其应用于 Linux 发行版的概念。众人拾柴火焰高。他们还可以在一个日益复杂的系统各个角落进行探查，在软件发布到更广阔的世界之前识别并移除
    bug。Linux 内核开发者开创了这种工作方式，但 Debian 是第一个明确以分布式软件开发为模式的项目。


    Murdock 于 1993 年 8 月 16 日在 comp.os.linux.development 邮件列表中宣布 Debian 即将发布。该公告包含了后来
    Debian 许多特征的种子。对可靠性、稳定性、安装便利性、升级和包管理的强调，自那以后一直成为所有 Debian 衍生发行版的标志性特征。


    Debian、Red Hat 和 Slackware 是九十年代的流行发行版。Debian 是社区发行版，也是 Linux 的良知。Slackware 最像
    Unix，而 Red Hat 则具有商业优势。如今几乎所有的 GNU/Linux 发行版，除了少数值得称赞的例外，都演自其中某一个或另一些发行版。


    ### 可能发生的另一种情况


    第一个“免费”的类 Unix 操作系统是 BSD，由伯克利大学在 70 年代末编写。第一台在 IBM PC 上可用的“免费” Unix 是 386BSD，Linus
    Torvalds 在 1993 年说：“如果我开始开发 Linux 时 386BSD 已经可用，Linux 可能永远不会发生。”


    386BSD 的问题在于它耗时很长。第一次公开发布（Version 0.0）是在 1991 年圣帕特里克节，几乎无法运行。大多数用户不得不等到 1992 年巴士底日，才能看到第一个功能正常的发布版本（Version
    0.1）。


    Linus Torvalds 的学生朋友 Lars Wirznen 回忆道：“当时 FreeBSD 还不存在。386BSD 确实存在，但它在我的电脑上无法运行，因为它需要
    387 协处理器。我从 1991 年秋季到 1992 年春或夏一直使用 SCO Xenix，直到 Linux 成熟到足以成为一个可用的编码环境为止。”


    386BSD 是 Bill Joy 的伯克利软件分发版（Berkeley Software Distribution）的直接后代，后者是 SunOS 和其他专有
    Unix 发行版的核心。386BSD 以及针对 Intel 芯片移植的补丁包构成了 FreeBSD、NetBSD 和 OpenBSD 的基础，这些系统至今仍然传承着
    BSD 和开源 Unix 的火种。


    Alan Cox 讲述了一个类似的故事。当他看到 386BSD 的公告时，他心想：“哇！终于有值得在 PC 上运行的东西了！”问题在于 386BSD 需要浮点硬件，而
    Linux 不需要。“我没有那块浮点芯片，当时它要 70 英镑，所以我安装了 Linux。”


    如果早个一两年，加上一些小修复，Linux 可能永远见不到光。


    ## 关闭 Windows（双关语：指微软 Windows 及窗口操作）


    七十年代和八十年代的家用电脑通常附带代码，用户被鼓励学习汇编语言和 Basic，并编写自己的代码。软件观念逐渐从一种需要理解和 tinkered with（捣鼓/修改）的工具，转变为让用户更好地理解他们付费购买的机器，这种转变（无论对错）通常被追溯到比尔·盖茨（Bill
    Gates，"General Partner, Micro-Soft"）在 1976 年 2 月 3 日写的著名《致业余爱好者的公开信》（ldiggban.com/collection/newsletters/homelbrew/V2_01/gatesletter.html），其中盖茨宣称：


    > “作为大多数业余爱好者必须意识到的那样，你们中的大多数人都在窃取软件。硬件必须付费，但软件是共享的东西。谁在乎那些为之工作的人能否得到报酬呢？他绝望地接着问道：‘哪个业余爱好者能够花
    3 人年的时间去编程，发现所有 bug，记录他的产品并免费分发？’多年来，世界各地的自由软件开发者已经无数次回答了这个问题。”


    ![](img/daaca9116bc2b1db669c224de81abc7c_21_0.png)


    *上图：树莓派是漫长的一系列点燃了一代人想象力的电脑中的最新一款*


    > “就像一支走红的摇滚乐队开始要求付费一样。Linux 变得像 Metallica（金属乐队）了。”


    ### 潜伏于雷达之下


    到十年结束时，Linux 像 Samba 或 Apache 一样悄然潜入雷达之下，并被移植到从最小设备到 IBM 大型机的所有可用硬件上。不可避免的是，大型
    Unix 公司开始注意到这一点。Red Hat 成功上市，Linux 开始出现在由 SGI、IBM 和 HP 制造的硬件上。被称为“开源”的自由软件已经到来。


    Red Hat 是从 Linux 的成功中获利最多的公司，因为它贴近基层而繁荣发展。与当时其他“商业”Linux 发行版 SUSE 和 Caldera 不同，Red
    Hat 的光盘不包含专有安装程序，并且始终可以免费下载。Red Hat 开发的每个功能都在 GPL 下分发。Red Hat 知名度和品牌的提升意味着，当 Linux
    在十年末开始在商业环境中起飞时，Red Hat 处于完美地位以利用这一优势，并成为“Linux 公司”。


    成功必然改变了 Linux 和 Linux 社区；有时变好了，有时则不明显。商业成功消除了不确定性，并提高了大多数 Linux 发行版的精致度和光泽，但随着粗糙边缘的去除，早期的一些乐趣、魅力和精神也消失了。


    Linux 的成功改变了我们工作、休息和娱乐的方式。大多数 Linux 开发者，无论新旧，都受雇于大公司，薪水丰厚，通常可以居家工作，并更独立地工作。开发者被赋予了比过去更多的自主权。在不同程度上，自由软件已成为一种可接受的商业模式。


    “Linux 现在是嵌入式行业。它是你使用的东西，”Jeremy Allison 指出。“它变成了既得利益者，就像一支走红的摇滚乐队开始为其下载收费一样。Linux
    变得像 Metallica……”


    “但看待 Linux 如何变化的最佳方式是想想聚会。LinuxWorld 曾经是一个替代性活动，是计算界的伍德斯托克。你去参加 LinuxWorld，每个人都喝得醉醺醺的，玩得很开心。我能给你讲的故事……很多人都度过了一段美好的时光。LinuxWorld
    是科技界的摇滚盛事，然后慢慢但确定地，越来越多的西装革履的人开始出现，到最后，我和其他几位大师坐在那里，没有穿西装，置身于 PR 人员的大海中。”


    时代变了，并不总是往好的方向变，但如果早期的某些兴奋感已经消失，这种精神仍然存活在 Debian 和 Fedora、Gentoo 和 Arch 等社区发行版中，甚至更强烈地体现在由树莓派产生的乐趣和自由中，它回响着过去的声音，并拥有无限的实验和玩耍空间。


    '
