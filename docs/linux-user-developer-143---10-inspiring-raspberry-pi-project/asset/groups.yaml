    ## 我的树莓派项目


    ### Pi2D2


    曾参与《无主之地》、《行尸走肉》和《我们中的狼人》设计的游戏设计师打造了我们一直在寻找的机器人


    **是什么激发了你制作 Pi2D2 的灵感？**


    从小，我就对机械人偶既着迷又有些恐惧——你知道，就像老式的 Chuck E. Cheese 那种机器人之类的。我当时正在跟这个社区（barrio）的一些人合作——我们在修复一家八十年代餐厅里的一些旧机械人偶——就在那时树莓派发布了。所以我最初的想法是可以用它来控制这些机械人偶，但后来我也产生了其他想法。我想，我真的很想做一个由树莓派控制的
    R2D2。我看到网上有人已经抢先一步——他们用树莓派做了一个声控 R2D2，我觉得那很酷——但随后我想到，“我想对我的做什么？”


    我觉得如果能通过键盘或遥控器直接控制他会很酷，然后我妻子有一个旧的……像是 Pico 口袋投影仪，她在 eBay 上买的，原本想用于课堂，但她实际上无法使用。我想我可以利用它做些什么，所以就有了一个想法：做一个遥控
    R2D2，它可以四处移动，带一个小投影仪，可以将图像投射到墙上，同时还可以把它当作音效板使用，我可以把任意数量的音频文件放进去，让它在 Telltale Games
    的办公室里到处跑，骚扰大家。


    然后我在网上看到了另一个教程，关于一个人制作了一个叫 Cambot 的项目，他使用安装在由树莓派供电的遥控车上的摄像头。因此，我能够将他的做法应用到我的项目中。也就是说，很多这些元素已经存在了，问题只在于将它们整合起来并使其正常工作。


    **那么，Pi2D2 能做什么？你给了它哪些功能？**


    它有一个小的 USB 驱动器插槽，你可以插入并加载任意数量的 WAV 文件、MP3 文件，甚至电影文件。一旦插入，并打开 R2D2，它会加入你指定的任何 Wi-Fi
    网络。然后有一个网页；如果你访问 R2D2 的 IP 地址，你会看到一个网页界面，显示摄像头画面以及你放在 USB 驱动器上的所有声音按钮。你可以按键盘快捷键播放任何你想要的声音，还可以随意开关投影仪。你可以从网页播放任何视频。


    基本上这就是它的功能。在一家游戏公司工作，我使用了传统的移动角色键盘控制——所以是用 WASD 键移动它，空格键，我可以旋转它的穹顶四处看，让人走到别人跟前跟他们说话，在工作时稍微吓唬吓大家。


    **你考虑过为它制作智能手机或平板电脑界面吗？**


    是的，我尝试过——在我开发它的时候，我没有找到很好的支持触控控制的库，但我想后来已经出现了一些提供这种功能的库，所以这绝对是我考虑的方向。我有许多想要进行升级的地方：第一，让
    R2D2 加入当前所在的 Wi-Fi 网络有点棘手，所以我认为我会让它自己成为一个小型 Wi-Fi 热点，这样任何电脑都可以直接登录它，然后就会看到用于控制它的网页界面。这绝对是我下一步想要做的事情。


    **那么是什么在提供动力呢？**


    它使用 LiPo 电池——实际上是两块 LiPo 电池——其中一块为运行 Raspbian Linux 镜像的树莓派供电，另一块电池为旋转穹顶和腿部的直流电机供电。当你打开树莓派（启动通常需要大约二十秒）时，它会自动加入你的
    Wi-Fi 网络。目前我让它做到的是，一旦登录网络，它会 ping 我服务器上的一个 PHP 脚本，该脚本会提供它的 IP 地址，然后你可以在浏览器中输入该
    IP 地址，看到网页界面、摄像头和按钮，你可以随心所欲地控制它。


    **看起来你也内置了一些储物空间？**


    是的，原始玩具两侧带有两个小储物 compartment。其中一个有一个可以伸出的小杯架，你可以放一杯啤酒或别的什么，另一个原本是空的。出于某种原因，保留杯架完好无损对我来说很重要，我做到了；然后在另一侧，打开后，可以看到投影仪和电机电池的充电端口，也是插入装有所有声音和视频文件的
    USB 驱动器的地方。我将文件命名方式设置了一下——比如我有 1.wav, 2.wav——如果你想要超快速控制，键盘上对应的按键也会播放这些声音。


    **你认为花了多少时间？**


    这是一个相当漫长的项目。显然我没有全职工作，但我可能花了六个月的时间来处理它，大部分时间都在编写软件。很多软件是用 Python 编写的——比如摄像头控制、音效板等——所以大部分时间都在让软件运行并解决一些小故障。例如，每当它失去
