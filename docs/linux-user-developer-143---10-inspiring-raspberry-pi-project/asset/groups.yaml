    ## 10 个极具启发性的树莓派项目


    ![](img/daaca9116bc2b1db669c224de81abc7c_52_0.png)


    将侧面板安装到屏幕、扬声器和按钮上时，我们建议忽略“小心翼翼地将面板从工作台上提起”的说明。相反，试着将面板稍微从桌面上滑出，这样你每次就可以拧动一颗螺丝，而无需将部件以危险的角度悬空平衡。


    ```

    $ wget http://adafruit-download.s3.amazonaws.com/cupcade-5-13-2014.img.zip

    ```


    将其写入一张 4 GB 存储卡（你的 Cupcade 自带一张），下载他们提供的免费、非商业 ROM 来测试设置，然后使用合适的电源适配器为其供电。这些组件直接由树莓派供电，且可能耗电较高，因此务必正确供电。


    我们写入的镜像中包含完整的 MAME 街机模拟器和一个 NES 模拟器。它们默认都配置为使用你安装在机箱上的按钮：这意味着由于 NES 模拟器将机箱的 A
    键和 B 键直接映射为自身的 A 键和 B 键，因此布局与 NES 手柄相反，后者是 A 键在右，B 键在左。根据你计划如何使用该机箱，你可以交换按钮设置，或者适应略微改变的操作方案。


    从这里开始，我们如何扩展树莓派以制造一个全尺寸的街机机箱？好消息是，当你使用 HDMI 端口作为输出时，模拟器仍然可以工作，允许你将其连接到普通电视。按钮和扬声器也将继续正常工作，并且可以通过连接排线直接插入树莓派的
    GPIO 端口，就像我们将主板连接到屏幕那样。然而，这仍然只留下了四个按钮和一个小型摇杆；幸运的是，有大量可通过 USB 连接的 USB 街机手柄和组件，经过正确的配置，它们可以在模拟器上正常工作。


    一旦你将其安装在机箱中，你可以用树莓派做很多事情，例如让它连接到网络，这样你就不必拆解整个机箱取出 SD 卡进行远程维护。务必对相关部件进行研究，并留意社区论坛，那里肯定会有关于购买什么部件的有用建议。


    ![](img/daaca9116bc2b1db669c224de81abc7c_52_1.png)


    - **左上：** 你可以随时反转按钮映射，以传统的 NES 风格控制

    - **右上：** 树莓派紧凑地坐落在一束巨大的电线下方

    - **底部：** 升级到全尺寸街机机箱很容易实现，因为其原理与 Cupcade 的构建相同


    > 当你使用 HDMI 端口将其连接到普通电视时，模拟器仍然可以工作


    ![](img/daaca9116bc2b1db669c224de81abc7c_52_2.png)


    ### 获取灵感


    我们见过的其中一个最好的街机机箱项目已被树莓派博客报道：[bit.ly/lpWJGWE](bit.ly/lpWJGWE)


    利用旧街机机箱的部件，该创客设法修改了输入，重新添加了摇杆，并让投币口正常工作。你不需要做到使用 CRT 显示器甚至旧损坏机箱的地步，但这确实为这类项目增添了一丝真实性。


    ### 有声读物播放器


    创建一个只需触碰按钮即可工作的有声读物播放器


    #### 你需要什么


    - 扬声器

    - LED

    - 1.2 k 电阻

    - 10 k 电阻

    - 轻触开关

    - 面包板和导线


    在我们学会多任务处理的所有现代设备时代，**有声读物和播客**正在社会中变得越来越普及。


    无论是外出还是做家务，当你不需要全神贯注时，拥有一些额外的感官输入是很好的。而树莓派又如往常一样登场。只需少量组件和一副耳机或便携扬声器，你就可以携带树莓派并播放有声读物。


    首先，你需要准备好树莓派。在开始之前，在终端中执行常规的 `apt-get update` 和 `apt-get upgrade`，虽然准备工作并不多。完成后，我们只需安装
    VLC，方法如下：


    ```

    $ sudo apt-get install vlc

    ```


    完成后，关闭树莓派，断开电源，并按照下图中的 Fritzing 示意图开始连接电路。这是一个相当简单的设置——我们将使用按钮来启动有声读物的播放，在此期间
    LED 会亮起。


    当你熟悉电路后，重新打开树莓派并打开终端。输入以下命令下载此项目的 Python 代码：


    ```

    $ wget http://www.linuxuser.co.uk/wp-content/uploads/2014/08/audiobook.zip

    ```


    关于代码有几点需要注意：首先，它假设你的有声读物位于主目录下一个名为 audiobook 的目录中。它还在寻找一个名为 audiobook.mp3 的文件进行播放；你可以轻松通过编辑路径来更改，但你需要对树莓派上文件的命名保持一致。你也可以让它指向
    USB 存储设备上的特定位置，在另一台电脑上更换文件，并在读完上一本书后适当重命名它们。


    通过运行代码进行测试——按下一次按钮将启动过程，再次按下将停止播放书籍。如果你发现按钮按得太灵敏或不灵敏，请编辑 `time.sleep` 中的延迟，目前默认设置为
    0.2 秒。


    ![](img/daaca9116bc2b1db669c224de81abc7c_53_0.png)


    - **右侧：** 这两个项目之间的协同效应意味着你可以使用相同的设置来运行两者

    - **下方：** 该电路适用于 Model B 和 Model B+——引脚从每个板的同一端开始


    ### 网络收音机


    一个便携式收音机，无论你在哪里都可以流式传输网络内容


    我们的树莓派网络收音机是上文有声读物的真正伴侣项目，随着教程的深入，我们将解释原因。与有声读物一样，我们充分利用树莓派来帮助你应对现实生活中的情况。随着传统广播方式逐渐消亡，成熟的网络流媒体平台将变得越来越流行，所以你可以立即通过此项目参与其中。此项目的电路也有声读物完全相同，因此如果你已经尝试过有声读物项目，那么只需获取此教程的代码即可。


    在接线之前，是时候准备你的树莓派了。打开终端，执行 `apt-get update` 和 `apt-get upgrade` 以确保所有软件都是最新的，然后使用以下命令安装
    VLC：


    ```

    $ sudo apt-get install vlc

    ```


    安装完成后，你需要关闭树莓派。断开 USB 线缆，拿出面包板和组件，并遵循接线图。电路并不复杂，核心在于检测按钮被按下以及按命令点亮 LED。仔细检查面包板上的所有连接，然后重新插上树莓派。


    打开终端并使用它下载用于播放网络广播的 Python 脚本：


    ```

    $ wget http://www.linuxuser.co.uk/wp-content/uploads/2014/08/webradio.zip

    ```


    解压文件并放在你想要的任何位置；它不需要在树莓派的目录结构中放在特定位置。你可能想要更改代码当前调谐的电台，这可以在代码中的 `subprocess.Popen`
    行中找到。找到你最喜欢的电台的 m3u URL，并替换代码中已有的 URL 以开始播放。按下按钮和音乐开始之间可能会有短暂的延迟，因为 VLC 启动并缓冲流媒体。不过，我们让灯光立即亮起，这样你至少知道过程已经启动。再次按下按钮将终止
    VLC 并停止广播流。如果你觉得按钮太灵敏或不灵敏，寻找 `time.delay` 设置并更改它要求的按钮按下时间。


    ### 合二为一


    你可以轻松地将这两个项目结合在一起，拥有一个集收音机和有声读物于一体的设备。接线一个第二按钮用于播放有声读物，甚至可以为不同的电台添加额外的按钮。


    ![](img/daaca9116bc2b1db669c224de81abc7c_54_0.png)


    '
