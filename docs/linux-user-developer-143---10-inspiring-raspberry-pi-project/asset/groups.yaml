    # ## Rise of Linux

    From Sinclair QL to Raspberry Pi


    **FEATURE**


    ![](img/daaca9116bc2b1db669c224de81abc7c_20_0.png)


    ![](img/daaca9116bc2b1db669c224de81abc7c_20_1.png)


    with lots of work to do. The shortcomings of SLS led Patrick Volkerding to create
    Slackware, which became the blueprint for many later commercial distributions,
    including Red Hat and SuSE. Dissatisfaction with SLS was also the spur for Ian
    Murdock''s decision to initiate the Debian project. “SLS is possibly the most
    bug-ridden and badly maintained Linux distribution available,” he wrote in 1994.
    “Unfortunately, it is also quite possibly the most popular.”


    # ### A collaborative trick


    The arrival of Linux had coincided with the birth of the World Wide Web, and the
    first generation of students and programmers with wider access to the Internet.
    Out of this had grown the beginnings of what was to become an unplanned and organic
    methodology of distributed development which, when allied to the framework of
    free software, was to revolutionise the world of programming.


    Murdock''s notion was to take this collaborative trick and apply it to the concept
    of a Linux distribution. Many hands make light work. They can also prod round
    the corners of an increasingly complex system and identify and remove bugs before
    they are released into the wider world. The Linux kernel developers pioneered
    this way of working, but Debian was the first project to be modelled explicitly
    on distributed software development.


    Murdock announced the imminent arrival of Debian on comp.os.linux.development
    on 16 August, 1993. The announcement contained the seeds of much that was to feature
    later in Debian. The emphasis on reliability, stability, ease of installation,
    upgrades, and package management has been the defining characteristic of all Debian
    derived distributions ever since.


    Debian, Red Hat and Slackware were the popular distributions of the Nineties.
    Debian was the community distribution and the conscience of Linux. Slackware was
    the most Unix-like, and Red Hat had the commercial edge. Nearly all the GNU/Linux
    distributions of the present, with some honourable exceptions, evolved from one
    or other of these distributions.


    # ## What might have been


    The first ''free'' Unix-like operating system was BSD, written at Berkeley University
    in the late 70s. The first ''free'' Unix available on the IBM PC was 386BSD, of
    which Linus Torvalds said in 1993: “If 386BSD had been available when I started
    on Linux, Linux would probably never have happened.”


    The problem with 386BSD was that it was a long time coming. The first public release
    (Version 0.0) was on St. Patrick''s Day, 1991, and was barely functional. Most
    users had to wait until Bastille Day, 1992 for the first functional release (Version
    0.1).


    Lars Wirznen, a student friend of Linus Torvalds, recalled: “FreeBSD didn''t exist
    then. 386BSD did, but it wouldn''t have worked on my computer, since it required
    a 387 co-processor. I used SCO Xenix from fall 1991 to spring or summer of 1992,
    until Linux matured enough to be a usable environment for writing code.”


    386BSD was a direct descendant of Bill Joy''s Berkeley Software Distribution,
    which was the core of SunOS and other proprietary Unix distributions. 386BSD and
    the patchkit for the port to the Intel chip formed the basis for FreeBSD, NetBSD
    and OpenBSD, which carry the torch for BSD and open source Unix to this day.


    Alan Cox tells a similar story. When he saw the 386BSD announcement he thought
    “Wow! Finally there is something worth running on a PC!” The trouble was that
    386BSD needed floating point hardware, and Linux didn''t. “I hadn''t got the floating
    point chip, which was 70 quid at the time, so I installed Linux.”


    A year or two earlier, a couple of small fixes, and Linux may never have seen
    the light of day.


