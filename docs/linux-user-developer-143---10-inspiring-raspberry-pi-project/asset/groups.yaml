    ### 香蕉派 (Banana Pi)\n\n$48.88/£28.50\n\n作为第一款真正的树莓派克隆机，它是否有能力走出其灵感来源巨大成功的阴影？\n\
    \n![](img/daaca9116bc2b1db669c224de81abc7c_79_0.png)\n\n- **优点**\n    - 双核 ARMv7\
    \ 处理器、1GB 内存和 SATA 接口使其成为其灵感来源的升级产品\n- **缺点**\n    - 设计并不像乍看上去那样兼容树莓派，而其克隆性质可能会让许多人望而却步\n\
    \n即使 Lemaker（香蕉派背后的中国公司）为其产品选择了不同的名称，也无法掩盖其灵感来源。这款单板计算机在左上角配备了 26 针通用输入/输出 (GPIO)\
    \ 排针，同时具有复合视频和 HDMI 视频输出、3.5mm 立体声模拟音频插孔，使用背面的 SD 卡插槽进行存储，并包含两个 USB 2.0 端口和一个以太网接口。\n\
    \n从某些方面来看，有人竟然花了这么长时间才制作出一个类似 Pi 的产品，这令人惊讶。查看规格表明，有趣的是，香蕉派并非直接克隆，而是一次相当大的演变：单核\
    \ ARMv6 700MHz 博通 BCM2835 被更现代的双核 ARMv7 1GHz AllWinner A20 取代，内存翻倍至 1GB，并增加了 SATA\
    \ 2.0 端口作为额外的连接方式，该端口自带 5V 电源，用于 2.5 英寸存储设备。\n\n因此，香蕉派被定位为那些发现“浆果风味”（树莓派）版本性能不足的用户的一款升级产品。遗憾的是，对于希望找到即插即用解决方案的人来说，有一些注意事项。香蕉派的体积略大于树莓派，这意味着它与其竞争对手设计的任何外壳或支架都不直接兼容。虽然\
    \ 26 针 GPIO 排针在设计上是电气引脚对引脚兼容的，但为了腾出角落安装孔的空间，它相对于树莓派的布局向侧面偏移。这导致较大的背板会干扰复合视频输出。\n\
    \n一个更大的问题出现在 Lemaker 所称的摄像头串行接口 (CSI) 连接器上。A20 芯片缺乏真正的 CSI 实现，而是使用并行摄像头接口。因此，没有现成的摄像头模块可以连接到香蕉派，尽管\
    \ Lemaker 承诺将在不久的将来推出自己的模块。\n\n"
