    # CCTV Conversions


    I am trying to convert an H264 video (from CCTV controller) into mov, mp4, or
    any other more accessible format. However, I am experiencing dropped frames and
    mplayer while playing back the converted output issues a huge list of errors.


    I am using this command for the conversion:


    ```

    $ avconv -i /media/usb8/RecordFile/ video_264 -vcodec copy video.mov

    ```


    Anything you can see that''s instantly wrong? Am I missing anything?


    **Ed Rounds**


    **Our first thought is that maybe you need to update oll of your software and
    have a minimal load on the CPU while encoding the file. Otherwise, you might also
    consider dropping the -vcodec option or even trying out ffmpeg.**


    **It may also be a driver issue with your graphics card if for some reason your
    PC has decided to use it to help with the encode, so if there are some alternate
    drivers you can use, then have a go with them.**


