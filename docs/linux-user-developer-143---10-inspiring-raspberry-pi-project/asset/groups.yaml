    \ Mobile 都向开发者提供了易于使用的列表框。开发者为小部件提供一批字符串，这些字符串随后会被显示出来。Android 的列表架构更具学术性，迫使应用程序围绕着一套相对复杂的类进行设计，这些类充当存储数据与用于显示这些数据的小部件之间的中介。\n\
    \n平板电脑带来了新的痛点。它们的较大屏幕无法被“常规”程序高效利用，反而要求对界面进行彻底重新设计。碎片（Fragments）可用于通过将用户界面划分为更小的组件来简化这一过程。然后，这些组件可以排列起来，形成最适合当前屏幕的不同布局。\n\
