    BBC Radio 4 喜剧节目《 Cabin Pressure 》的粉丝可能想添加“吃根香蕉！”以示敬意，致敬该系列第四集《Xinzhou》中的 FizzBuzz
    游戏。下次，也就是要帮助阐明一些晦涩的脚本和功能。


    ![](img/daaca9116bc2b1db669c224de81abc7c_28_8.png)


    # 教程


    # 使用 OWASP 提高 Web 应用安全性


    ![](img/daaca9116bc2b1db669c224de81abc7c_29_0.png)


    # 利用 OWASP 编码技巧提高 Web 应用安全性


    了解 OWASP 指南如何帮助你在不拖慢开发周期的情况下提高基于 Web 的应用程序的安全性


    **顾问**


    ![](img/daaca9116bc2b1db669c224de81abc7c_29_1.png)


    **Nitish Tiwari** 职业是软件开发者，内心则是开源爱好者。除了为知名开源杂志撰稿外，他还帮助企业建立和使用开源软件以满足其业务需求


    **资源**


    - OWASP 主页 <www.owasp.org>

    - 开发者指南 <https://github.com/OWASP/DevGuide>


    软件开发在过去几十年中取得了长足的进步；每天都有新的编程语言、开发模型、应用领域甚至新的漏洞出现。具体到漏洞而言，大多数（即使是新发现的）仍然基于一些基本的攻击方式，如
    SQL 注入和跨站脚本等。如果遵循安全的编码实践，几乎总是可以避免此类问题。从一开始就避免安全漏洞，比在它们已被利用后再去修复要好得多。正如人们所说，你必须始终领先一步。


    OWASP，即开放 Web 应用安全项目，是一个开源论坛，可以帮助你加强安全性。为了说清楚，OWASP 并不是一个无需你投入即可清除代码中漏洞的软件或工具。OWASP
    更像是一套由全球安全专家编纂的最佳实践，可以在编写代码时遵循。因此，当你查阅 OWASP 时，就像在成千上万位专家的集体指导下工作——而且是免费的！OWASP
    主要分为指南（例如：开发指南、测试指南、十大项目等）和速查表（cheat sheets）。指南提供了与其涵盖主题相关的安全各个方面的详尽细节，而速查表则提供直接、切中要害的信息。因此，速查表可用于你需要关于特定功能（例如，密码重置功能）的安全方面简洁信息的场合。


    # 使用 OWASP 提高 Web 应用安全性


    在不拖慢开发周期的情况下提高安全性


    **教程**


    ![](img/daaca9116bc2b1db669c224de81abc7c_30_0.png)


    *上方 应用安全专业人员针对广泛的主题创建 OWASP 速查表*


    ## 01 身份验证实现


    这是验证实体（通常通过用户 ID 和密码组合完成）的过程。OWASP 的身份验证速查表包含若干建议。其中主要的建议包括：


    - 用户 ID 应始终对大小写不敏感。这有助于避免围绕名称产生混淆。强制实施密码长度和强度。少于十个字符的密码通常被认为较弱。然而，最大长度应该较高；如果你将最大长度设置得较低，可能会阻止用户选择他们容易记住的密码。用户还应被强制在密码中使用小写字母、特殊字符、数字等。

    - 密码的存储和传输应始终通过 TLS 进行，确保没有窃听发生。

    - 身份验证错误的 HTTP 和 HTML 响应应始终通用。它也不应泄露任何关于账户状态的信息。


    ## 02 忘记密码功能


    密码总是会被遗忘，你必须提供一种重置它们的方式。大多数人都会承认，通过侧信道向用户发送他们的旧密码是一个好主意。OWASP 速查表提供了这种密码重置策略。


    - 收集身份数据和安全相关问题。

    - 验证安全问题。

    - 使用侧信道发送身份验证令牌。侧信道可以是发送给用户电子邮件或短信。

    - 允许基于通过侧信道接收的令牌更改密码。


    同样，在密码重置期间如果发生任何错误，你也可以遵循通用错误消息的规则。


    ## 03 会话管理


    会话允许你验证身份并跟踪用户在网站上的活动。它通常通过一系列 HTTP 请求和响应对实现。会话是最容易受到利用的主要点之一。OWASP 的会话管理速查表强调了几种确保会话不被泄露的做法。首要的是，你通常应尝试使用
    Web 开发框架内置的会话管理机制。几乎所有主要平台 – PHP、J2EE、ASP、.NET 等 – 都有可用的会话管理机制。使用它不仅速度更快，而且确保你使用的是经过广泛测试的解决方案。注意，始终使用最新版本是很好的做法，这样新发现的漏洞已经得到修补。现在让我们来看看关于处理
    Cookie 的更具体细节。


    ## 04 Cookie 管理


    会话管理通常使用 Cookie 或 URL 重写（或两者结合）作为底层机制。正如我们从最近的统计数据中看到的，Cookie 因其灵活性和健壮性而日益受到欢迎。如果你决定使用
    Cookie，请记住以下几点：


    - Secure 和 HttpOnly 属性：添加 Cookie 属性 secure 和 HttpOnly，因为这确保 Cookie 始终仅通过 Https
    连接发送，并且不允许脚本访问 Cookie。这将减少 Cookie 被截获的可能性。

    - Domain 和 Path 属性：设置这些属性以指示 Cookie 应发送到哪个精确的浏览器，从而确保它仅到达目标目的地，而不是其他地方。

    - Expire 和 Max-age 属性：设置这些属性以使 Cookie 非持久化，这样一旦浏览器实例关闭，它就会被清除。


    > OWASP 是一套由全球安全专家编纂的最佳实践

