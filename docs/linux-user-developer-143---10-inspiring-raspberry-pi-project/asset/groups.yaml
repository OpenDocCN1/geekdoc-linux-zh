    # ## Raspberry Pi Hub


    All the technical information you could possibly need about the Raspberry Pi can
    be found over on the RPi Hub page of the elinux wiki. There’s a buyer’s guide,
    a beginner’s guide, resources for the hardware and software, links to the full
    documentation, and there are also round-ups of community projects and tutorials.
    If you head through to the Projects page then you’ll find a massive list of projects
    and links to check out the source pages. So as well as being a good source of
    knowledge, the Hub can also help you find even more Raspberry Pi creations.


    elinux.org/RPi_Hub


    ![](img/daaca9116bc2b1db669c224de81abc7c_66_1.png)


    # ## Raspberry Pi forum


    There’s more to the Raspberry Pi Foundation’s website than you might think – head
    to the Forums link right at the top of the page and you’ll find out where all
    the conversations are really happening. It’s a really active community, with people
    are posting in Pi projects, ideas and finished projects all the time, so it’s
    a fantastic way to get involved by asking for or giving a hand with Pi projects.
    As with all resources like this, it’s best to search through the forums before
    you do start asking questions, though, and to read the stickies, because people
    will likely have already asked the same thing already and you can just find that
    particular thread.


    www.raspberrypi.com/forums


    # ## Get hands-on with your Raspberry Pi


    We’re really excited to announce that there’s a fantastic new Raspberry Pi resource
    for you as well – RasPi. This digital-only magazine, available through iTunes,
    costs only 69p/99c and is jam-packed full of Raspberry Pi projects, Python tutorials,
    interviews and more. It’s the dedicated Raspberry Pi magazine for those of you
    who flick straight to these red-edged pages each issue, and has been designed
    especially for iPad users to make for a brilliant reading experience. Each issue
    will feature a big project for you to get stuck into, and we kick-started the
    first issue with a guide to programming your own drone. There’s a free sample
    issue available inside the RasPi app showing you how to build a Pi-powered buggy,
    so head over to iTunes and check it out for yourself.


    bit.ly/1ogRd0


