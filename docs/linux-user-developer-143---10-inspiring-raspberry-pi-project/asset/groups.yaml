    \ app and source files that are already set up for you.\n\n> The community is\
    \ working hard to bring an even greater choice of templates for different use\
    \ cases\n\nAdvanced developers can work with Mozilla to build these starter templates.\
    \ So while a good few are available already, the community is working hard to\
    \ bring an even greater choice of templates for different use cases. If you would\
    \ like to become part of the community and contribute templates then visit github.com/mozilla/mortar.\n\
    \n### Editing\n\nOnce you've started your project, you can edit the source files\
    \ in WebIDE. Its integrated editor - based on the open source CodeMirror editor\
    \ with the Tern.js code analysis framework - gives you a simple but powerful editor\
    \ for HTML, JavaScript, and CSS files. Test out the editing by adding in a heading\
    \ <h1> tag and see your heading appear within the template. Editing is only a\
    \ small part of what the WebIDE does for you. It automatically validates your\
    \ web application manifest and creates and installs a packaged app either in a\
    \ simulated runtime or on a device connected via USB. The application validator\
    \ ensures that your application has a valid manifest file, a requirement for submitting\
    \ to the Firefox Marketplace. While the IDE is enough for your basic editing needs,\
    \ you might want to use your own preferred editor instead. To do this you can\
    \ connect your editor to the toolchain of the WebIDE with a simple API. This one\
    \ allows external editors to access all the advanced functionality of the tool\
    \ – its runtime management, pushing applications to different devices and connecting\
    \ Firefox Developer Tools. You can turn off the internal editor and use WebIDE\
    \ as a simple, clean interface for managing runtimes and validating applications.\n\
    \n**Christian Heilmann**  \nMozilla Developer Evangelist  \nChris Heilermann has\
    \ a focus on the Open Web and HTML5. He built his first website around '99 and\
    \ spent the following years working on lots of large, international, Web projects.\
    \ Chris wrote and contributed to four books on Web development and was editor-in-chief\
    \ of Ajaxian, OneStopMagazine, and Stash.builds.\n\n# App design perks\n\nFirefox\
    \ Beta for Windows, Mac, Linux and Android introduces some powerful new features\
    \ and tools to help developers create and build web content, apps and add-ons\
    \ more easily than before.\n\n- **Firefox Hub APIs:** Firefox Beta includes support\
    \ for Firefox Hub APIs, allowing add-on developers to add their own content to\
    \ the Firefox for Android homepage (where users find bookmarks, top sites etc),\
    \ providing them with a large area to entice users to interact with their add-on.\
    \ For more details about building add-ons with these APIs, check out the documentation\
    \ on MDN and see this collection of experimental add-ons as examples. **mzl.la/1tZ2FLv**\n\
    - **APK Factory Performance and Stability Improvements:** Mozilla has been working\
    \ on providing more performance improvements to this ‘native experience’ for web\
    \ apps on Firefox for Android. Using APK Factory, Firefox OS app developers can\
    \ now target millions of Firefox for Android users without changing a line of\
    \ their app code. By giving web apps native updates, native installation and native\
    \ app management, developers can now provide a more familiar way for users to\
    \ manage their web apps. The APK Factory also ensures web apps use a modern up-to-date\
    \ runtime, so there are no performance degradation or compatibility issues.\n\n\
    ![](img/daaca9116bc2b1db669c224de81abc7c_15_0.png)\n\n> *Abou* You can use WebIDE\
    \ as a simple interface for managing runtimes and validating apps\n\n### Runtimes\
    \ and Testing\n\nWhen you’re ready to test your application, choose a runtime\
    \ – install Firefox OS or connect to your Firefox OS device. Once connected to\
    \ a runtime, you can use the tools that you’ve used in desktop Firefox to try\
    \ your application. You have the same sort of rapid iteration that makes developing\
    \ for the desktop web simple – just hit Ctrl/Cmd+R to reload the application on\
    \ your device or simulator. You can get information about the device and runtime\
    \ and take screenshots.\n\n### Improved manifest management\n\nYou can publish\
    \ your HTML5 apps to other platforms than the web and Firefox OS by using Apache\
    \ Cordova tools, which now support Firefox OS in addition to Android and iOS.\
    \ Before we dive into these features, make sure you have the latest version by\
    \ running:\n\n```\n$ sudo npm install -g cordova\n$ sudo npm install -g plugin\n\
    ```\n\nIn order to turn any HTML5 page into a Firefox OS app, you need to create\
    \ a manifest file. This file has crucial information that Firefox OS needs in\
    \ order to interact with your app. Cordova has a configuration file called config.xml\
    \ that already contains the same information needed for the manifest file. Cordova\
    \ will create and update the manifest based on your config.xml file. In the new\
    \ version, plugins can add configuration specifying which permissions are necessary.\
    \ Whenever you run a Cordova prepare, the manifest is updated based on your configuration.\
    \ Now you can have all your app’s information in one place.\n\n### Converting\
    \ your app to Android\n\nWith the new Firefox for Android, we will now automatically\
    \ convert your Open Web App into a native Android app. This means you probably\
    \ also want to test your app on Android, before we submit it to the Marketplace.\
    \ **mozilla-apk-cli** is a command-line application that makes testing your app\
    \ easy (**github.com/mozilla/apk-cli**):\n\n```\nnpm install mozilla-apk-cli\n\
    ```\n\nThis will give you a new program mozilla-apk-cli available in ~/.node_modules/bin/.\
    \ You can also globally install with:\n\n```\nnpm install -g mozilla-apk-cli\n\
    ```\n\nOpen Web Apps come in three flavours and the CLI can build them all: hosted\
    \ apps, packaged\n"
  mdcn: "\n# 持续开发\n\nTed Ts'o（ext2fs、ext3fs、ext4fs 的原始作者）发布了一个名为“random: introduce\
    \ getrandom(2) system call”（random：引入 getrandom(2) 系统调用）的 RFC（征求意见）补丁，该补丁引入了一个新的内核接口，用于为应用程序提供随机数。“但为什么”，你可能会问，“要在现在引入这样一个新接口，尤其是内核长期以来一直支持通过读取\
    \ /dev/random 和 /dev/urandom 特殊内核文件来生成随机数？”问题在于这些文件的工作方式。因为需要随机数的应用程序必须打开这些文件，攻击者有可能让所有可用的文件描述符（每个打开的文件使用一个）在系统安全守护进程（如\
    \ OpenSSH 远程登录软件）需要为 SSH（或 SSL 等）协议握手使用随机数之前立即耗尽。通过耗尽所有可用的文件描述符（fd），攻击者可以使得此类软件难以运行（或生成弱随机数），从而破坏提供安全环境的能力。1\
    \ 新的 API 则通过系统调用来工作，类似于 BSD。\n\nJohn Stulz 和 Rafael Wyocki 讨论了一个由 Ruthi Kandic（来自\
    \ Google）之前提交的补丁，该补丁将提供内核 sysfs 层级（位于 /sys/kernel/wakeup_reasons/last_resume_reason\
    \ 下）中的一个接口，通知用户（或软件开发者）上一次内核从低功耗状态唤醒的原因。这在移动设备上非常重要，因为移动设备的目标是希望在活动爆发之间的长时间段内保持低功耗状态，并且希望管理软件能够捕获导致用户电池寿命和手机使用体验受到影响的\
    \ bug 或错误应用的效果。\n\nPrabhakar Kushwaha、Tammy Hanna 和 Liuvi Dudau（来自 ARM）讨论了内核中被称为“arm64”的\
    \ 64 位 ARM 架构的 PCIe 支持需求。Liuvi Dudau 已经提交了一些通用补丁，这些补丁依赖于系统启动固件（如 UEFI）在启动正式内核之前正确配置各种隐藏的平台特定设置。这与\
    \ x86 PC 等平台类似，但与众多多嵌入式设备的配置方式不同。尽管如此，在 arm64 上普遍采用 UEFI 的趋势正在推进，并且在回复中也传达了这一点，指出这里不会强调支持非\
    \ UEFI。\n\n一些内核开发者就上游内核中出现的“Copyright”一词以及紧随其后的“All Rights Reserved”一词进行了辩论。根据\
    \ Paul Bolis 的说法，他使用“git”源代码管理系统的命令“git grep -i”搜索匹配的内核源代码行，在 Linux 3.16-rc3 中有\
    \ 5203 个此类实例。Greg Kroah-Hartman（来自 Linux 基金会）回应道：“我以前也‘担心’过这一点，结果发现这根本没什么意义。”据\
    \ Greg 所说，“代码的许可证才是问题所在，版权行则不然，所有律师现在都告诉我，版权行甚至不应该出现在文件中，因为它再次毫无意义。”了解这一点很有趣。\n\
    \n最后，本月 Linux 基金会发布了“罕见的内部一瞥”，展示了 Linus Torvalds 的家庭办公室，形式是一段 YouTube 视频，展示了他新安装的桌面设置。这段关于\
    \ Linus 的视频在线地址为 www.youtube.com/watch?v=H5GUP4yqAws。\n\n# “等到我们到达 3.16-rc6 时，Linus\
    \ 已经在发出警报”\n\n![](img/daaca9116bc2b1db669c224de81abc7c_12_0.png)\n\n![](img/daaca9116bc2b1db669c224de81abc7c_12_1.png)\n\
    \n![](img/daaca9116bc2b1db669c224de81abc7c_13_0.png)\n\n## Firefox OS 应用开发\n\n\
    Christian Heilmann 审视了 Mozilla 开发的新工具和特性，使创建适用于 Firefox OS 的 Web 应用程序变得比以往任何时候都更容易\n\
    \n在 Firefox 浏览器中创建、编辑和测试 Web 应用\n\n特性\n\n![](img/daaca9116bc2b1db669c224de81abc7c_14_0.png)\n\
    \n凭借 Firefox OS，这是一个完全基于开放 Web 标准和 Linux 内核的操作系统，Mozilla 希望证明 Web 是开发平台，无论工具、语言或设备如何。作为这一计划的一部分，它最近向\
    \ OS 引入了一个功能强大的新设计，以及浏览器内的性能调试特性。真正独特的新功能是 Firefox Nightly 中的一个全功能的开发 IDE，这将使创建和构建\
    \ Web 应用变得更容易，无需任何额外开销。\n\n在创建和设计你的应用时，有如此多的不同工具和模板可供选择，很难知道从哪里开始。在本文中，我们将探讨 Firefox\
    \ 内置的特性，在哪里找到合适的工具来帮助你使用它们，并提供有用的提示和技巧，以帮助你改善和推进开发。\n\n### 入门\n\n要开始使用 WebIDE，可以在你的开发者工具栏菜单中找到它。打开后，从菜单栏选择“新应用”，你会发现有几个示例启动模板可供选择。将模板保存到你的桌面。在模板内，你可以选择\
    \ index.html 文件来查看已经为你设置好的蓝图应用和源文件。\n\n> 社区正在努力带来针对不同使用场景的更多模板选择\n\n高级开发者可以与 Mozilla\
    \ 合作构建这些启动模板。因此，虽然已经有不少模板可用，但社区正在努力带来针对不同使用场景的更多模板选择。如果你希望成为社区的一部分并贡献模板，请访问 github.com/mozilla/mortar。\n\
    \n### 编辑\n\n一旦你开始了你的项目，你就可以在 WebIDE 中编辑源文件。它集成的编辑器——基于开源的 CodeMirror 编辑器和 Tern.js\
    \ 代码分析框架——为你提供了一个简单但强大的编辑器，用于 HTML、JavaScript 和 CSS 文件。通过添加一个标题 `<h1>` 标签并查看标题出现在模板中来测试编辑功能。编辑只是\
    \ WebIDE 为你做的事情的一小部分。它会自动验证你的 Web 应用清单，并在模拟运行时或通过 USB 连接的设备上创建并安装包化应用。应用验证器确保你的应用具有有效的清单文件，这是提交到\
    \ Firefox Marketplace 的要求。虽然 IDE 足以满足你的基本编辑需求，但你可能想使用自己首选的编辑器。为此，你可以使用简单的 API\
    \ 将你的编辑器连接到 WebIDE 的工具链。这允许外部编辑器访问工具的所有高级功能——其运行时管理、将应用推送到不同设备以及连接 Firefox 开发者工具。你可以关闭内部编辑器，将\
    \ WebIDE 用作管理运行时和验证应用的简单、干净的界面。\n\n**Christian Heilmann**  \nMozilla 开发者传教士  \n\
    Chris Heilermann 专注于开放 Web 和 HTML5。他大约在 '99 年左右建立了他的第一个网站，并在随后的几年里从事许多大型国际 Web\
    \ 项目。Chris 撰写并参与了四本关于 Web 开发的书籍，并担任 Ajaxian、OneStopMagazine 和 Stash.builds 的主编。\n\
    \n# 应用设计优势\n\n适用于 Windows、Mac、Linux 和 Android 的 Firefox Beta 版本引入了一些功能强大的新特性和工具，帮助开发者比以前更容易地创建和构建\
    \ Web 内容、应用和附加组件。\n\n- **Firefox Hub API：** Firefox Beta 包含对 Firefox Hub API 的支持，允许附加组件开发者将他们的内容添加到\
    \ Firefox for Android 主页（用户在那里找到书签、热门网站等），为他们提供一个大区域来吸引用户与其附加组件互动。要了解使用这些 API\
    \ 构建附加组件的更多细节，请查看 MDN 上的文档，并参阅此实验性附加组件集合作为示例。 **mzl.la/1tZ2FLv**\n- **APK 工厂性能和稳定性改进：**\
    \ Mozilla 一直在努力为 Firefox for Android 上的 Web 应用提供更好的“原生体验”性能改进。使用 APK 工厂，Firefox\
    \ OS 应用开发者现在可以在不改变一行应用代码的情况下，将目标瞄准数百万 Firefox for Android 用户。通过为 Web 应用提供原生更新、原生安装和原生应用管理，开发者现在可以为用户提供更熟悉的方式来管理他们的\
    \ Web 应用。APK 工厂还确保 Web 应用使用现代且最新的运行时，因此没有性能退化或兼容性问题。\n\n![](img/daaca9116bc2b1db669c224de81abc7c_15_0.png)\n\
    \n> *Abou* 你可以使用 WebIDE 作为管理运行时和验证应用的简单界面\n\n### 运行时和测试\n\n当你准备好测试你的应用程序时，选择一个运行时——安装\
    \ Firefox OS 或连接到你的 Firefox OS 设备。一旦连接到运行时，你可以使用你在桌面 Firefox 中使用的工具来尝试你的应用程序。你拥有与开发桌面\
    \ Web 应用同样快速的迭代体验——只需按 Ctrl/Cmd+R 在你的设备或模拟器上重新加载应用程序。你可以获取关于设备和运行时的信息并截图。\n\n\
    ### 改进的清单管理\n\n你可以使用 Apache Cordova 工具将你的 HTML5 应用发布到 Web 和 Firefox OS 以外的其他平台，这些工具现在除了\
    \ Android 和 iOS 外还支持 Firefox OS。在我们深入这些功能之前，请通过运行以下命令确保你拥有最新版本：\n\n```\n$ sudo\
    \ npm install -g cordova\n$ sudo npm install -g plugin\n```\n\n为了将任何 HTML5 页面变成\
    \ Firefox OS 应用，你需要创建一个清单文件。此文件包含 Firefox OS 与你的应用交互所需的重要信息。Cordova 有一个名为 config.xml\
    \ 的配置文件，其中已经包含了清单文件所需的相同信息。Cordova 将根据你的 config.xml 文件创建和更新清单。在新版本中，插件可以添加配置，指定哪些权限是必要的。每次你运行\
    \ Cordova prepare 时，清单都会根据你的配置进行更新。现在你可以将所有应用信息集中在一个地方。\n\n### 将你的应用转换为 Android\n\
    \n随着新的 Firefox for Android，我们现在会自动将你的开放 Web 应用转换为原生 Android 应用。这意味着在你将其提交到 Marketplace\
    \ 之前，你可能也想要在 Android 上测试你的应用。 **mozilla-apk-cli** 是一个命令行应用程序，使测试你的应用变得轻松（**github.com/mozilla/apk-cli**）：\n\
    \n```\nnpm install mozilla-apk-cli\n```\n\n这将给你一个名为 mozilla-apk-cli 的新程序，位于 ~/.node_modules/bin/。你也可以全局安装：\n\
    \n```\nnpm install -g mozilla-apk-cli\n```\n\n开放 Web 应用有三种形式，CLI 可以构建它们全部：托管应用、包化\n\
    \n"
