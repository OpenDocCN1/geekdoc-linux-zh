  mdcn: "\n## DVD 内容\n\n探索第 143 期《Linux User & Developer》DVD 中为您准备的精彩内容...\n\n欢迎使用《Linux\
    \ User & Developer》DVD，这是随第 143 期附赠的，提供了最新的热门发行版和自由软件。\n\n本月，您将在 DVD 上找到 Tails\
    \ 1.1 更新版、Ubuntu 14.04.1 以及 CentOS 7，其中新的 CentOS 基于最近发布的 Red Hat Enterprise Linux\
    \ 7。除此之外，我们还为您包括了 GPartEd Live 分区管理环境。\n\n照例，您还可以找到 20 个软件包，涵盖本期介绍的一些工具以及其他许多实用程序。此外，您还可以访问本月教程中的所有代码。\n\
    \n- **发行版**\n  - Tails 1.1 和 Ubuntu 14.04.1 均可从您的 DVD 直接启动。CentOS 7 和 GPartEd\
    \ Live 均可作为 ISO 下载。\n\n- **教程文件**\n  - 每期不可或缺的一部分，您在本 DVD 的这一部分可以找到跟随教程所需的所有资源和代码\n\
    \n- **软件**\n  - 这里您将找到 20 个最新、最棒的软件包，包括本期经小组测试的网络管理器\n\n- **教程档案**\n  - 为您编程乐趣而解压缩，来自往期的一些最棒的指南\n\
    \n![](img/daaca9116bc2b1db669c224de81abc7c_95_0.png)\n\n### 如何烧录 ISO\n\n想尝试新的发行版\
    \ ISO 吗？以下是入门方法...\n\n- **步骤 1：获取新的 ISO**\n  - 从我们的封面光盘将发行版的 ISO 复制到您的硬盘：转到“发行版”标签，点击\
    \ ISO 并选择“保存”。或者，在线寻找一个 ISO 进行下载。如果您不确定需要 32 位还是 64 位版本，为了安全起见，请选择前者。\n\n  ![Step\
    \ 1 Screenshot](placeholder_for_step1_screenshot)\n\n- **步骤 2：打开或安装 Brasero**\n\
    \  - Brasero 是最受欢迎的开源光盘烧录工具。如果它尚未安装在您的发行版中，请在您的发行版软件仓库中找到它并安装。然后打开程序，并在左侧的“项目”选项卡中选择“烧录映像”。\n\
    \n  ![Step 2 Screenshot](placeholder_for_step2_screenshot)\n\n- **步骤 3：烧录您的光盘映像**\n\
    \  - 在“映像烧录设置”菜单中，点击第一个框——标记为“点击此处选择光盘映像”——并导航到您刚放入硬盘的 ISO。选择后，确保您已插入一张可写的 CD\
    \ 或 DVD，然后点击“创建映像”。\n\n  ![Step 3 Screenshot](placeholder_for_step3_screenshot)\n\
    \n### DVD 内容\n\n欢迎使用《Linux User & Developer》DVD\n\n### 编辑精选\n\n**Hugin** 在 Linux\
    \ 上进行图像编辑的可能性有时感觉相当有限，因此 Hugin 让人耳目一新，它不仅是一个 GIMP 克隆，本身就是一个独特的工具。使用它将重叠照片的镶嵌图拼接成单个沉浸式全景图。这很有趣。\n\
    \n**Geany** 这本质上是一个使用 GTK2 工具包的文本文本编辑器，提供了基本集成开发环境的功能。除了轻量级和快速外，它的设计还独立于 KDE 或\
    \ Gnome 等桌面环境，仅需 GTK2 库。\n\n**Tor** 如果您不想使用 Tails 进行安全浏览，那么您可以随时自行设置 Tor。它似乎几乎每周都会上新闻，而且\
    \ Tor 有其受欢迎的原因——赶在趋势之前，现在就保护您的隐私。\n\n### 完整索引\n\n#### 操作系统\n\n**Tails 1.1** Tails\
    \ 的更新版本除了安全修复和错误修复外，现在还包括一些用户可见的变化，例如 UEFI 启动支持和 VirtualBox 来宾模块。\n\n**CentOS\
    \ 7** 随着 RHEL 7 的近期发布，CentOS 也提升了版本号。改进中包括引入 systemD、Gnome3 和默认的 XFS 文件系统。\n\n\
    **Ubuntu 14.04.1** 这是众多后续更新中的第一个，此版本包含安全更新和更新的安装介质，以减少安装后所需的更新量。\n\n**GParted\
    \ Live** 这款很棒工具为您提供图形化环境，以执行任何您需要进行的分区任务。它包含了您在 GParted 应用程序中会找到的所有工具。\n\n![](img/daaca9116bc2b1db669c224de81abc7c_96_0.png)\n\
    \n#### 软件\n\n- Audacious\n- ARM Eclipse 插件\n- Audacity\n- Dropbox Python SDK\n\
    - Filezilla\n- Firefox\n- Geany\n- GRUB\n- Hugin\n- KDiff3\n- Midori\n- NetworkTools\n\
    - NumPy\n- OWASP ZAP\n- PostInstallerF\n- Python 2\n- SMPlayer\n- SQLite Browser\n\
    - Tor\n- Wicd\n\n![](img/daaca9116bc2b1db669c224de81abc7c_96_1.png)\n\n> 这是在不付费的情况下最接近\
    \ Red Hat 的体验\n\n![](img/daaca9116bc2b1db669c224de81abc7c_96_2.png)\n\n> 您可以使用随附文件设置\
    \ Tor\n\nImagino Publishing Ltd \nRichmond House, 33 Richmond Hill \nBournemouth,\
    \ Dorset, BH2 6EZ \n+44 (0) 1202 586200 \nWeb: www.imagino-publishing.co.uk \n\
    www.imumag.co.uk \nwww.greatgifts.com\n\n下一期 \n即将到来 ... \n请关注 \n第 144 期 \n9月25日\
    \ \n想更早收到？ \n立即订阅！\n\n## 下一期内容\n\n![](img/daaca9116bc2b1db669c224de81abc7c_97_0.png)\n\
    \n### 在 Android 上安装 Linux\n\n专业发行版， \n您喜爱的工具， \n在您的设备上\n\n### 构建循环鼓机\n\nLiam 向我们展示如何使用\
    \ \nRaspberry Pi 的强大功能制作 \n一个简单的音频采样器\n\n### 编写实用 shell 脚本 — 第 3 部分\n\nRichard\
