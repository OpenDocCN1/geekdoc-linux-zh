  mdcn: "\n\n# 树莓派 B+ 型\n\n内含完整评测与常见问题解答 • 另有 24 页树莓派专题内容\n\nwww.linuxuser.co.uk\n\
    \n# Linux 用户与开发者\n\n4 种发行版直播启动 DVD\n\n# 10 个令人振奋的树莓派项目\n\n延时摄影机 | AirPi | 复古街机\
    \ »\n\n- 10 个令人振奋的树莓派项目\n- 《Linux 用户与开发者》第 143 期\n\n![](img/daaca9116bc2b1db669c224de81abc7c_0_0.png)\n\
    \n# 自动化你的 Dropbox 备份\n\n编写 Python 脚本以跟踪更改并进行备份\n\n# 另有 5 个专家教程\n\n- >> 编写 Shell\
    \ 脚本\n- >> 编写 Android 应用\n- >> 提高 Web 应用安全性\n- >> 升级你的 ownCloud 配置\n- >> 使用 NumPy\
    \ 绘制科学数据\n\n- www.linuxuser.co.uk\n\nLinux 的崛起——黑客的历史\n\n![](img/daaca9116bc2b1db669c224de81abc7c_0_1.png)\n\
    \n# Firefox OS 技巧与窍门\n\nMozilla 为开发者分享的最佳建议\n\n# 网络管理器\n\n四款最佳网络工具在本期综述测试中一决高下\n\
    \n# 香蕉派\n\n树莓派的继任者？\n\n第 143 期 | £5.99 | 4.3 >\n\n![](img/daaca9116bc2b1db669c224de81abc7c_1_0.png)\n\
    \n![](img/daaca9116bc2b1db669c224de81abc7c_1_1.png)\n\n![](img/daaca9116bc2b1db669c224de81abc7c_1_2.png)\n\
    \n# 你愿意为代码俱乐部做志愿者吗？\n\n代码俱乐部是一个全国性的志愿者主导的课外编程俱乐部网络，面向 9 至 11 岁的儿童。\n\n我们需要懂计算机编程的人自愿每周在他们当地的公立小学、图书馆或社区中心为一个小时的俱乐部活动提供支持。\n\
    \n我们为志愿者创建教学项目，通过这些项目向孩子们展示如何通过制作电脑游戏、动画和网站来学习编程。\n\n加入我们，让我们教会下一代编写代码！\n\n访问\
    \ www.codeclub.org.uk 了解更多详情\n\n![](img/daaca9116bc2b1db669c224de81abc7c_1_3.png)\n\
    \n# 欢迎\n\n来到《Linux 用户与开发者》第 143 期\n\n你的 Linux 专家团队...\n\n![](img/daaca9116bc2b1db669c224de81abc7c_2_0.png)\n\
    \n**Rob Zwetsloot** 主修航空航天工程，使用 Python 对复杂模拟进行建模。在与一个具有自我意识的 Makeblock 坦克达成一项未公开协议后，Rob\
    \ 的视频播放器被归还给他，他开始着手他的下一个由树莓派驱动的项目（第 50 页）。由 Arduino 驱动的 Robot-chan 对此并不感到高兴。\n\
    \n![](img/daaca9116bc2b1db669c224de81abc7c_2_1.png)\n\n**Richard Smedley** 早在所见即所得（WYSIWYG）出现之前就开始使用计算机，并且至今仍认为命令行和\
    \ Emacs 是最具生产力的工作环境。本月，Richard 继续他的 Shell 脚本系列，这次通过一个简单的 FizzBuzz 游戏示例来探讨程序的原型设计（第\
    \ 26 页）。\n\n![](img/daaca9116bc2b1db669c224de81abc7c_2_2.png)\n\n**Nitish Tiwari**\
    \ 职业是软件开发人员，内心是开源爱好者。除了为顶级开源杂志撰稿，他还帮助公司部署和使用满足业务需求的开源软件。在本期中，他解释了 OWASP 实践（第 30\
    \ 页）和新的 ownCloud 7（第 34 页）。\n\n![](img/daaca9116bc2b1db669c224de81abc7c_2_3.png)\n\
    \n**Mihaliss Tsoukalos** 是一位 UNIX 系统管理员，擅长编程、数据库和数学。他自 1993 年起开始使用 Linux。Mihaliss\
    \ 本月向我们展示如何在 NumPy、SciPy 和 Matplotlib 的帮助下进行科学计算和数学运算（第 38 页）。\n\n![](img/daaca9116bc2b1db669c224de81abc7c_2_4.png)\n\
    \n**Jon Masters** 是一位 Linux 内核黑客，从事 Linux 开发已有约 19 年，自他 13 岁首次进入大学以来便是如此。Jon 居住在马萨诸塞州剑桥市，为一家大型企业\
    \ Linux 供应商工作。你可以在本月第 12-13 页找到他精彩的内核专栏。\n\n![](img/daaca9116bc2b1db669c224de81abc7c_2_5.png)\n\
    \n**Gareth Halfacree** 是我们的常驻新闻记者，为我们带来来自全球开源界的最新发展，从第 6 页开始。在第 80 页，Gareth 评测了新的香蕉派，并询问它是否是树莓派的合格继任者。\n\
    \n# 本期内容\n\n- » 编写 Android GUI\n- » 提高 Web 应用安全性\n- » 使用 Python 自动化 Dropbox\n\
    - » 评测：树莓派 B+ 型\n\n欢迎来到《Linux 用户与开发者》最新一期，这是英国和美国最喜爱的 Linux 和开源杂志。\n\n![](img/daaca9116bc2b1db669c224de81abc7c_2_6.png)\n\
    \n随着新 B+ 型在七月份的发布（详见第 70 页和第 82 页），似乎所有的目光都再次转向了树莓派。我们也看到越来越多的树莓派仿制品涌现，其中一些实际上相当不错，例如我们在第\
    \ 80 页评测的香蕉派。因此，自然而然地，我们觉得是时候为你带来另一批树莓派项目了。这次我们的项目基于你可以组合成更复杂项目的想法，例如将私有云转变为基于私有云的媒体流媒体播放器。拿起你的树莓派，转到第\
