    # ## Network Managers


    Which is best for handling your day-to-day network connections?


    ![](img/daaca9116bc2b1db669c224de81abc7c_76_0.png)


    ![](img/daaca9116bc2b1db669c224de81abc7c_76_1.png)


    # # Network Tools


    With a lot of superfluous features, does it include the core ones?


    ![](img/daaca9116bc2b1db669c224de81abc7c_76_2.png)


    The huge amount of info in Network Tools makes it easier to troubleshoot your
    network


    # ## Ease-of-use


    While slightly more intimidating for newcomers, the main tab in Network Tools
    has just about everything you need for normal network management, although it
    does rely on default system wireless managing where it can. The more advanced
    features are plainly labelled, too.


    # ## Functions


    There are a huge amount of different networking functions not only for connecting
    and seeing what''s around but also for looking around your network for any problems.
    It manages a lot more than just your local network adapters; it can manage your
    entire network if that''s a thing you''d want it to do.


    # ## Customisation


    It''s great for a lot of the sniffing and routing tools but for the actual network
    connection it''s a little lacking. It''s nice that you can do really customised
    network detection functions but we''re concentrating a little more on actually
    making the connection to the network in this test.


    # ## Privacy


    Apart from figuring out the vulnerabilities in your network, there''s no way to
    actually make your connection private from within the app itself. No proxy, no
    tunnelling and certainly no Tor tools either. It''s a little ironic that you can
    figure out the problems with your network and then can''t really fix them on your
    computer.


    # ## Overall


    Network Tools is very good for specific uses but for actually managing your network
    connections it fails a bit shy. It''s not really its fault, though, and it''s
    great if you need a proper and quick look through your network.


    6


    ![](img/daaca9116bc2b1db669c224de81abc7c_76_3.png)


    # # Wicd


    A popular graphical network manager that''s lightweight and easy to use


    ![](img/daaca9116bc2b1db669c224de81abc7c_76_4.png)


    Separate profiles for each connection make it quick and easy to switch setups


    # ## Ease-of-use


    Putting everything important up front, Wicd makes connecting to any wireless network
    easy while also having great controls for wired networks as well. Any configuration
    menus are tied to the individual connections as well, and some quick options to
    disconnect everything and turn Wi-Fi off are readily available.


    # ## Functions


    As well as the functions within the individual connections'' preferences, there
    are some advanced settings available via the interface to get a little bit more
    out of the network; from selecting what external programs to use when making changes
    to switching the drivers as well.


    # ## Customisation


    Almost every part of the networking is in some way configurable – from the IP
    settings and network ID down to the way that external and low-level systems connect
    and interact. This lets you really get the optimal connection settings for just
    about any situation and goes a lot deeper than the other apps in this test.


    # ## Privacy


    For all the editing and customising you can do for the individual connections
    and adapters, there are no proxy tools and an almost hidden-away tunnelling option.
    Wicd is probably something you''d be using in conjunction with Tor, if you want
    to have a bit more privacy.


    # ## Overall


    Of a limited selection of managers, Wicd is clearly the best of the bunch. Its
    popularity is well earned in this case and it''s great to see it popping up more
    and more in distros as the default manager.


    9'
