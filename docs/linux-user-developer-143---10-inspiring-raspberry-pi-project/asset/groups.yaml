  md: "\n## Firefox OS app development\n\nCreate, edit and test web apps in the Firefox\
    \ browser. You can build, package and upload app zip files, and packaged apps\
    \ from a directory of source code. Let's assume you're working on a packaged app.\
    \ You have a directory layout like this:\n\n```\nwww/\n    index.html\n    manifest.webapp\n\
    css/\n    style.css\ni/\n    icon-256.png\n    icon-128.png\n    icon-64.png\n\
    js/\n    main.js\n```\n\nYou can build a testable Android app with the following:\n\
    \n```\nmozilla-apk-cli /www/my_test_app.apk\n```\n\nThis will produce `my_test_app.apk`\
    \ which can be side-loaded to your phone in one of two ways: put it on the web\
    \ and download/install from a browser on your Android device, or instead use `adb`\
    \ to install the app:\n\n```\nadb install my_test_app.apk\n```\n\n### The Future:\
    \ Developing for the Whole Web\n\nAt the heart of the WebIDE is the Firefox Remote\
    \ Debugging Protocol. The Firefox Developer Tools work on remote devices running\
    \ over USB. Right now this protocol is useful for Firefox Desktop, Firefox Android,\
    \ and Firefox OS. But it won't stop there. In the future, a protocol adapter that\
    \ will allow developers to use the Firefox Remote Debugging Protocol – including\
    \ the Developer Tools and WebIDE – will talk to all mobile browsers, regardless\
    \ of rendering engine or runtime.\n\nThis web-everywhere project isn't yet ready\
    \ for testing, but if you're excited to get involved or see how it is being implemented,\
    \ it currently lives at github.com/camp/fxd-adapters.\n\nIf you're building a\
    \ tool and want to start playing with the protocol, then you can start now, developing\
    \ against Firefox Desktop, Firefox Android, and Firefox OS. For information about\
    \ the Remote Debugging Protocol, take a look at the documentation at mozilla/teardown.\
    \ If you want to see the WebIDE in action, check out this screencast: at bit.ly/1nFcn3U.\n\
    \n![](img/daaca9116bc2b1db669c224de81abc7c_16_0.png)\n\nAbove: CodeMirror and\
    \ Term.js combine into a powerful editor for HTML, JS and CSS files.\n\n### Synthesised\
    \ APKs\n\nThe APK Factory Service takes your code and sends it to a reviewer instance\
    \ of the service (as opposed to the production release environments).\n\nThis\
    \ service synthesises a native Android app, builds it with the Android SDK and\
    \ finally signs it with a development cert. As mentioned, this synthesised APK\
    \ is debuggable and should not be distributed.\n\nThe nice thing about the service\
    \ is that you do not have to have Java, Android SDK, and other Android development\
    \ tools installed on your local computer. You can focus on the web and test on\
    \ whatever device you have handy.\n\n## Rise of Linux\n\n### From Sinclair QL\
    \ to Raspberry Pi\n\n![](img/daaca9116bc2b1db669c224de81abc7c_17_0.png)\n\n> Richard\
    \ Hillesley looks back to the halcyon days of software hacking to explore the\
    \ origin of the spirit of Linux\n\nThe original code of Linux was written for\
    \ fun, or in Eric Raymond's phrase, to 'scratch the itch' of Linus Torvalds, and\
    \ later to satisfy the enthusiasm and programming itch of an assortment of hackers\
    \ and hobbyists who, for the most part, had grown up in the age of the ZX80 and\
    \ the BBC Micro, Acorns and Apricots, for which the code was often available –\
    \ and hackable.\n\n![](img/daaca9116bc2b1db669c224de81abc7c_18_0.png)\n\n![](img/daaca9116bc2b1db669c224de81abc7c_18_1.png)\n\
    \nAbove: Inside the Sinclair QL.\n\nLeft: Alan Cox – “Some things weren’t really\
    \ fixed until somebody became involved who really understood how the maths behind\
    \ these things worked”\n\nFor those who spent their childhood or adolescence delving\
    \ into the home computers of the late Seventies and early Eighties, playing with\
    \ software was a learning experience, and something to be shared. Linux could\
    \ be said to have grown out of this ethos as much as it grew out of the free software\
    \ movement, or the early Nineties culture of Usenet where “if you wrote something\
    \ neat you posted it to Usenet” and the only proviso that came with the software\
    \ was that “if the software breaks you get to keep both pieces”.\n\nAs almost\
    \ everybody knows, Linux came into being shortly after Linus Torvalds bought a\
    \ PC in January 1991. As Lars Wendler tells it, “He’d been using a Sinclair QL\
    \ before that, which, like much British computer stuff, was ingenious and almost\
    \ unusably different from everything else. Like every self-respecting hacker,\
    \ Linus had written some software development tools of his own; an editor and\
    \ an assembler, I think. He’d also modified the QL hardware a bit, to replace\
    \ a broken keyboard, and to add a PC-compatible floppy drive. When he bought the\
    \ PC, he wrote a device driver for the QL so he could move stuff from the QL to\
    \ the PC”.\n\n### From Minix to Linux\n\nSpurred by a curiosity about Unix, and\
    \ a desire to install a Unix-like operating system on his brand new PC, Torvalds\
    \ installed a copy of Minix, the operating system developed as a teaching tool\
    \ by Andrew Tanenbaum, and began to write a stand-alone terminal emulator to access\
    \ the UNIX server at Helsinki University. The terminal emulator grew beyond its\
    \ original purpose, and by August 1991, Torvalds was able to announce to the comp.os.minix\
    \ newsgroup on Usenet that he was “doing a (free) operating system (just a hobby,\
    \ won’t be big and professional like GNU) for 386/486 AT clones.” (See bit.ly/1pAY3DH\
    \ for the original post).\n\nThe first iteration of the Linux kernel was written\
    \ explicitly to explore the workings of the 80386 chip on Torvalds’ computer using\
    \ GCC, the GNU C Compiler, and would “probably never support anything other than\
    \ AT-hard disks, as that’s all I have.” The Linux kernel was machine-specific\
    \ and monolithic, and quickly attracted followers and critics. After a couple\
    \ of months, Torvalds made the momentous decision to release the code under the\
    \ GNU GPL, and quickly attracted the help and participation of a growing band\
    \ of enthusiasts and hobbyists who, like Torvalds, had grown up in the age of\
    \ the Sinclair QL and wanted to explore the code.\n\nSo right from the beginning,\
    \ Linux belonged to everyone and no-one, and was a playground for hackers and\
    \ hobbyists, happy to learn as they went along. Alan Cox installed Linux on the\
    \ Swansea Computer Society machine, and \"started trying to make the networking\
    \ code work properly, because it was buggy at the time.\" Swansea University had\
    \ a \"nice, very noisy multi-protocol network which was just perfect for crapping\
    \ your computer. I started fixing these things, which is how I ended up doing\
    \ the networking code, building on the base networking code that other people\
    \ had done. I was pretty much downloading standards and learning it as I read...\
    \ Some things weren't really fixed until somebody became involved who really understood\
    \ how the maths behind these things worked.\"\n\n### Copyleft licence\n\nTorvalds\
    \ originally released Linux “under a non-GPL copyright that was actually much\
    \ more restrictive than the GPL” but told Hiroo Yamaagata in 1997 that he “changed\
    \ the copyright to the GPL within roughly half a year, as it quickly became evident\
    \ that my original copyright was so restrictive that it prohibited some entirely\
    \ valid uses (disk-copying services etc – this was before CD-ROMs became really\
    \ popular). And while I was nervous about the GPL at first, I also wanted to show\
    \ my appreciation to the GCC C compiler that Linux depended on, which was obviously\
    \ GPLed. Making Linux GPLed was definitely the best thing I ever did.”\n\nOnce\
    \ GNU/Linux had been adopted by more than one hardware company it became obvious\
    \ to these companies that there was a mutual advantage in contributing back to\
    \ the project, and they did. The framework that made this possible was Section\
    \ 2(b) of the GPL. The release of core chunks of corporate code accelerated the\
    \ development of Linux and ensured its success in the enterprise, enhanced by\
    \ its portability across a wide range of hardware.\n\nCompanies don’t use GNU/Linux\
    \ because of sentimental attachment to Linux, or the GPL, or “open source”. They\
    \ use GNU/Linux and free software because it makes sense. And the GPL, which gives\
    \ assurance of the continued freedom and commonality of the code, is the driver\
    \ behind it.\n\n![](img/daaca9116bc2b1db669c224de81abc7c_19_0.png)\n\nAbove: The\
    \ GNOME Foundation was announced at LinuxWorld 2000.\n\n![](img/daaca9116bc2b1db669c224de81abc7c_19_1.png)\n\
    \nRight: Scott McNealy's claim was later proven wrong as Linux replaced Solaris\
    \ as the primary enterprise platform.\n\n> Scott McNealy dismissed GNU/Linux as\
