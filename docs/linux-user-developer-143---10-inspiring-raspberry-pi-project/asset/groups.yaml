  mdcn: "\n## 树莓派 B+ 是什么？\n\n树莓派发布了新版本，但究竟是什么，以及 B+ 又意味着什么？\n\n那么，树莓派又出了新版本？没错，完全正确——树莓派\
    \ Model B+，是树莓派的最新版本。\n\n关于这个名字，我有些疑问。这是第一个型号，B 型？之前有 A 型吗？有的，现在仍然有 A 型。它是树莓派的廉价版本，功能比标准的\
    \ B 型少得多。\n\n那么，A 型缺少哪些功能呢？A 型不包含以太网端口；它只有一个 USB 端口，而且内存也比 B 型少——实际上只有 256 MB，是\
    \ B 型的一半。\n\n既然它是“劣质”版本，为什么还在销售呢？实际上，它是在原始 B 型之后发布的，而且价格也比 B 型稍便宜。它主要面向那些真正只需要利用树莓派计算能力来进行项目制作和其他创客构建的人。现在\
    \ B+ 型已经推出，A 型也将继续供应。\n\n明白了。回到 B+ 型：所以它是 B 型的第二个版本吗？不，从技术上讲，它是 B 型的第三个版本。在首次发布后不久，B\
    \ 型进行了一次小升级，将其内存翻倍至 512 MB，因为最初它的内存与 A 型相同。事实上，在发布前，A 型原本计划搭载 128 MB 内存，但在最后一刻被更改了。无论如何，B\
    \ 型 2 版本已经存在的时间比原始 B 型更久，而且可能是大多数人拥有的版本。\n\n那么为什么不把 B+ 型发布为 B 型 3 版本呢？或者为什么不叫它树莓派\
    \ C 型呢？或者树莓派 2 呢？\n\n从根本上说，驱动 B+ 型的芯片等部件与驱动 B 型甚至 A 型的部件相同。它只是一种新的配置，并没有增加太多主要功能；例如，A\
    \ 型缺乏网络功能，而 B 型有一个以太网端口。\n\n**什么样的功能可以让它成为 C 型？**\n\n嗯，这取决于树莓派基金会，但也许是无线功能或其他类型的主要输入或输出。\n\
    \n**那么，上一个 B 型与 B+ 型之间的确切区别是什么？**\n\nB+ 型经过重新布局，具有更薄的机身，并契合电路板的范围。为此，它采用了底部插入式\
    \ microSD 端口，同时移除了视频输出插孔。还增加了一组双 USB 端口，这意味着你不需要那么频繁地使用带电源的 USB 集线器。此外，树莓派侧面还增加了一些\
    \ GPIO 引脚。\n\n**这是一相当大的变化。但还不够称为 C 型？**\n\n再次强调，这取决于树莓派基金会，但并没有真正增加功能。\n\n**除了扩展的\
    \ GPIO 引脚外？它们算吗？另外，这是否破坏了大量依赖 GPIO 引脚设置的用途？**\n\n嗯，是的，扩展的 GPIO 引脚让你能做更多事情，但没有什么重大变化。是的，之前能做的所有事情在\
    \ B+ 上仍然有效——额外的引脚只是添加在原始布局的末端。如果你之前看过我们使用过的 PiFTS 屏幕，它在板上仍然完美工作。另外，澄清一下，引脚从边缘开始，所以引脚是向板内延伸，而不是在板上移位。\n\
    \n**好吧，听起来都挺有趣的。我应该升级吗？**\n\n如果这里的信息还让你犹豫不决，你可以稍后查看本期的评测。它的价格与原始 B 型相同，并且正在完全取代它，所以如果你未来需要购买更多，它们很可能都是\
