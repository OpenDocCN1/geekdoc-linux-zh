    \ 5V 供电的 SATA 2 |\n| 其他 | 26 针 GPIO 排针，红外接收器，麦克风 |\n\n## 也可考虑\n\n![](img/daaca9116bc2b1db669c224de81abc7c_80_1.png)\n\
    \n**HummingBoard-12eX**\n**£88**\n价格比香蕉派不到 £30 的价格高出不少，但 SoloBuys 的 HummingBoard（前身为\
