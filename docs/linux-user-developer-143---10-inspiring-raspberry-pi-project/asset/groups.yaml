    \ 3,3,3],\n            [-1,-0.5,4],\n            [0,1,0]] )\n```\n\n你还可以创建具有更多维度的数组。\n\
    \n### 03 使用 NumPy 进行简单计算\n\n给定一个名为 myArray 的数组，你可以通过执行以下命令来查找其中的最小值和最大值：\n\n```\n\
    >>> myArray.min()\n>>> myArray.max()\n```\n\n如果你想查找所有数组元素的平均值，请运行以下命令：\n\n```\n\
    >>> myArray.mean()\n```\n\n同样，你可以通过运行以下命令来查找数组的中位数：\n\n```\n>>> median(myArray)\n\
    ```\n\n一组数据的中位数是一个元素，它将数据集分为两个子集（左侧子集和右侧子集），且两个子集的元素数量相同。如果数据集的元素数量是奇数，那么中位数是数据集的一部分。另一方面，如果数据集的元素数量是偶数，那么中位数是排序后数据集中两个中心元素的平均值。\n\
    \n### 04 使用 NumPy 处理数组\n\nNumPy 不仅采用了典型 Python 中用于字符串和列表的索引方法，还对其进行了扩展。如果你想从数组中选择给定的元素，可以使用以下记法：\n\
    \n```\n>>> twoD[1,2]\n```\n\n你还可以使用以下记法选择数组的一部分（切片）：\n\n```\n>>> twoD[0:1,1:3]\n\
    ```\n\n最后，你可以使用 tolist() 函数将数组转换为 Python 列表。\n\n### 05 读取文件\n\n假设你刚刚使用 AWK 从 Apache\
    \ 日志文件中提取了信息，并希望使用 NumPy 处理该文本文件。\n\n以下 AWK 代码用于查找每小时请求的总数：\n\n```\n$ cat access.log\
