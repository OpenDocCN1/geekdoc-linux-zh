    ## Linux 用户来信

    您对杂志、Linux 和开源的看法


    ### 百万英镑的问题

    在您关于英国国家医疗服务体系（NHS）在微软产品上花费更多资金的专栏中，我认为说他们“决定向一家公司投入更多资金”并不恰当。不幸的是，在所谓的“专业”领域，包括
    NHS 这样的地方，安装的软件通常是为其定制开发的，由那些自身在同一个操作系统（OS）上投入巨大的开发人员编写（否则他们不会只为那个操作系统开发），并且有意或无意地设定了锁定机制，将他们的客户锁定在所选的操作系统中。在美国，许多卡车维修点也面临同样的问题——它们使用的软件根本无法在更新版本的
    Windows 上运行，更不用说在其他操作系统上了，因为操作系统中的某些行为对于程序的安全性和/或功能性是强制要求的。要替换程序，甚至获取一个通常能工作的版本，无论是在新的操作系统上，还是在卡车上的计算机上，实际上是不可能的，因为唯一能这样做的人（要么
    a）尚未弄清楚如何移植它，要么 b）突然发现他们把自己画进了同一个角落，无法移植它，要么 c）已经破产，不再存在来修复他们自己的烂摊子。


    Deanne Cooley


    这是商业中一个不幸的因素，导致了这类问题的出现。对于任何类型的新软件，无论是微软开发的还是开源的，培训都需要额外的资金。奇怪的是，WINE 对旧软件的兼容性比现代
    Windows 还要好——这是一个有点可怕的想法。不过，当他们下次需要进行此类升级时，主流操作系统方面可能已经发生了一些范式转变。看看这一切如何发展将会很有趣。


    > *上方：NHS 面临许多资金问题——长期来看，将更多资金投入微软可能并不划算*


    ### 线程裸露

    ### 范式转变

    我们在上一期杂志中评测了最新的 LXLE，一些读者讨论了他们对这个发行版及其作为能在旧款上网本上与 Windows 并行工作的发行版的能力的兴趣。在这里加入对话：[bit.ly/1LXzsai](bit.ly/1LXzsai)。


    **Brendan Perrine 说：**

    我同时使用 lubuntu 和 xle。但是 lubuntu 使用 lxterminal 作为默认终端，并且还有 lxterm 和 xeterm。此外，你可以在
    lubuntu 中拥有 roxterm，但必须从软件仓库中安装它。


    **Roger Etherington 说：**

    我在上网本上安装了 Lubuntu 12.10，与 Windows XP 双启动……升级到 LXLE 值得吗？& 它还能设置为双启动吗？


    **Brendan Perrine 说：**

    你可以设置 lubuntu 和 xle 双启动。从 lubuntu 升级到 xle 并不真的容易，全新安装会更容易。


    ![](img/daaca9116bc2b1db669c224de81abc7c_93_2.png)


    > *上方：LXLE 基于 Lubuntu 并添加了多种不同的桌面环境以供尝试*


    此外，上网本并不总是拥有最大的存储空间，而双启动会消耗这些空间。


    **Roger Etherington 说：**

    感谢你的评论：经过进一步的“挖掘”，似乎 Lubuntu 14.04 已经包含了最新 LXLE 升级的很多内容，所以我认为我会走那条路。

    供参考：我在我的上网本上使用 Lubuntu 12.10 和 Windows XP 双启动系统已经好几年了，没有遇到任何资源问题。再次感谢。


    ### 碎片化的宇宙

    在您关于 Steam 的文章中，您引用了 Ron 对 Steam Machines 的担忧，仅仅是碎片化问题。这不是碎片化。这是统一。碎片化应该是 Steam
    Machines 只是另一个具有另一个控制台生态系统和社区的控制台。Steam Machines 不是那样。我有一种感觉，Valve 最初希望与 Sony
    合作，将 Steam 与客厅融合，但不知何故，这没成，而我们从中看到的唯一结果就是《传送门 2》（PS3 版本附带了一个 Steam 密钥并支持与 Steam
    版本的跨平台游戏）。


    Steam Machines 并不适合每个人，但它们有一个市场。我想要一台，尽管我可能会因为成本而自己组装一台。能够只需购买一次《XCOM》（例如），就可以在任何我想玩的地方玩——在我的
    Linux 笔记本电脑上，在我的 Windows 台式机上（理论上；我只运行 Linux），在我的 Mac 上（再次，理论上），以及在我的客厅里使用我的 Steam
    Machine 控制台在电视上玩。不仅如此，我只有一个好友列表，一个成就列表，一个在线社区... 我无法对 PS3 游戏做到这一点（《传送门 2》是个例外）。重点是：这是统一，而不是碎片化。


    Dana


    这是一个有效的观点，但鉴于计划中的各种不同类型的 Steam Machine，确实也存在真正的碎片化。较便宜的机型功率适中，但远不及其他机型的能力。


    一两年后为 Steam Machine 购买软件时，你可能会问“它在我的特定硬件上能运行吗？”，这正是 Ron 暗示的问题。这与我们在 Android 上遇到的问题是一样的，正如你本人所暗示的那样。由于硬件尚未真正推出，我们还不知道这些系统是否会有一些兼容性问题，以使事情变得更简单。Valve
    很可能还有一些我们尚未看到的锦囊妙计。


    > 下方 Steam Machines 即将到来，但它们会被碎片化吗？


    ![](img/daaca9116bc2b1db669c224de81abc7c_94_0.png)


    ## Android 杂志

    随着越来越多的 Android 功能被合并回 Linux 内核，为当今最受欢迎的移动操作系统之一开发应用程序变得更加容易。拥有超过 250 亿次应用下载和全球超过
    1 亿台 Android 设备，有一大群准备并愿意使用你应用的用户群体。要获取更多以 Android 为主题的内容，你可以看看我们的姐妹杂志 Android
    Magazine，这是唯一专门针对该平台的出版物。除了保持你对所有 Android 新闻和评测了解的最新资讯外，还有关于开发你的硬件和进行黑客操作的教程和建议。


    www.littlegreenrobot.co.uk


    Twitter:

    @linuxusermag

    Facebook:

    Linux User & Developer


