    \n### 关注变化\n\n**树莓派做了哪些改变？**\n\n- **USB**\n  最明显的变化之一是增加了更多的 USB 端口——树莓派一直需要这个。现在有四口排成一侧。\n\
    - **GPIO 端口**\n  现在树莓派侧面有 40 个 GPIO 引脚，在原有 26 个的基础上增加了 14 个，且未破坏其原有配置。\n- **MicroSD**\n\
    \  这是最大的变化，因为它涉及你获取更多硬件（microSD 卡），但它确实有助于降低树莓派的厚度。\n\n### Python 专栏\n\n**乔伊·伯纳德**\n\
    *作为一个真正的文艺复兴式人物，他在制作家具、协助研究人员解决科学计算问题和编写 Android 应用之间分配时间*\n\n## 树莓派上的科学\n\n###\
    \ 本月学习如何在你的树莓派上进行一些科学数值计算\n\n几期之前，我们探讨了在树莓派上**使用 Python 运行 MPI**。这在处理你希望分散到多台机器上的大型问题时非常有用。但在每台机器上能做什么样的工作呢？如果你想创建一个树莓派集群来进行科学工作，你需要研究使用\
    \ *scipy* 来处理实际计算任务。*Scipy* 建立在 *numpy* 之上，这是一个提供增强数字处理功能的 Python 模块。\n\n*Numpy*\
    \ 使用优化后的共享库（如 LAPACK 或 BLAS）来处理线性代数类型的操作，速度可与用 C 或 FORTRAN 编写的代码相媲美。使用这些模块，我们将快速了解你可以用这些强大小型机器做些什么样的科学工作。\n\
    \n几乎每个 Linux 发行版，包括树莓派的标准发行版，都包含 *scipy* 和 *numpy* 的软件包。要安装 *scipy*，你需要执行：\n\n\
    ```python\nsudo apt-get install python-scipy\n```\n\n由于 *numpy* 是 *scipy* 环境的一部分，当你安装\
    \ *scipy* 时它会被自动安装。为了使用它们，你需要导入它们，通常使用别名...\n\n```python\nimport numpy as np\n\
    import scipy as sp\n```\n\n导入主 *scipy* 模块只提供了一些可用的核心功能。其余的所有功能都细分为多个子模块，例如 *cluster*（提供聚类算法）、*integrate*（提供积分和普通微分方程求解器）、*signal*（用于信号处理）和\
    \ *weave*（用于 C/C++ 集成）。这些子模块中的每一个都需要单独导入。\n\n通过这种方式，你可以只导入解决当前问题所需的章节，而不用不必要的对象来\
    \ clutter 命名空间。\n\n在深入了解 *scipy* 之前，值得看看 *numpy* 以及为什么值得考虑使用 Python 进行科学计算。Python\
    \ 默认的扩展对象是列表。这个问题在于列表可以包含任何类型的对象。*Numpy* 提供了一个 *array* 对象，它只能包含单一类型的元素。有了这个让步，你可以开始采取一些捷径，因为你对数据有一些元知识。\n\
    \n在常规 Python 中，当你缩放向量时，你可能会使用一个 for 循环，例如：\n\n```python\na = [1, 2, 3, 4]\nb =\
    \ []\nscale = 2\nfor curr_a in a:\n    b.append(curr_a * scale)\n```\n\n在这个小例子中，涉及大量的开销。在\
    \ for 循环的每次迭代中，Python 需要检查 scale 的类型和列表中当前元素的类型，以看它需要执行什么操作来应用乘法运算。当你使用 *numpy*\
    \ 数组时，所有这些都不再需要。等效的代码看起来像这样：\n\n```python\na = np.array([1, 2, 3, 4])\nscale =\
    \ 2\nb = scale * a\n```\n\n在这种情况下，Python 只需要检查一次 scale 和 a 的类型，然后它把这两个对象交给共享线性代数库来处理实际的乘法步骤。然后结果对象返回并存储在\
    \ b 中。因此你获得了一些加速，一个是去除了 Python 进行的所有类型检查，另一个是利用共享库中的优化例程。\n\n回到 *scipy*，我们应该看看我们能做什么。科学问题解决中的一个常见任务是在某个范围内对函数进行积分。通常用来执行此操作的\
    \ *scipy* 函数是 `integrate.quad()`。你可以提交一个预定义的 Python 函数，或者即时创建一个 lambda 表达式。作为一个例子，假设你想从\
    \ 0 到 1 对正弦函数进行积分。你可以这样做：\n\n```python\nimport scipy.integrate as spi\nimport\
    \ math as m\nresult = spi.quad(lambda x: m.sin(x), 0.0, 1.0)\n```\n\n希望你会得到结果\
    \ **(0.45969769413186023, 5.103669643922839e-15)**。第一个值是积分值，第二个值是结果中绝对误差的估计值。\n\
    \n另一个常见任务是尝试将一个函数拟合到一些实验数据。通常的方法是进行最小二乘拟合，以最小化函数与实验数据之间的差异。函数 'leastsq' 位于 '*scipy.optimize*'\
    \ 子模块中。为了进行这种计算，你需要提供一个计算残差的函数，以及该函数中每个可调参数的起始点。作为一个例子，假设你有一些看起来呈正弦形状的测量值。你可以尝试拟合一个通用正弦函数...\n\
    \n```python\ny = A * sin(2*pi*k*x + theta)\n```\n\n### 为什么是 Python？\n\n它是树莓派的官方语言。在\
    \ **www.python.org/doc** 阅读文档\n\n### 我们将看看你可以用这些强大小型机器做的科学工作\n"
