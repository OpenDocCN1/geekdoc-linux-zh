    **15 拆解问题**


    编程的本质，就是将复杂任务分解为简单的部分。实现这些部分的具体方式取决于语言的语法和功能，但初步分析可以放在注释中。


    FizzBuzz 是一个简单的程序——输出整数，但将 3 的倍数的每个数字替换为“Fizz”，将 5 的倍数的每个数字替换为“Buzz”——它源于一个儿童游戏。然而，大多数申请编程工作的计算机专业毕业生即使只用伪代码也无法实现它。


