    # Questions & answers

    All your technical problems solved

    Q/A


    write-protected. I''ve tried chown and chmod to no avail. I am not familiar enough
    with /etc/ fstab to put it to work.


    By the way. I''ve seen too many similar reports online and yet not one link seems
    to help my case. Any advice would be much appreciated.


    **Georgina Smith**


    Well there are a couple of things this could be caused by. *Firstly*, does your
    stick have one of those switches on the side that makes it write-protected? You
    may have accidentally activated that and not quite realised it.


    *Otherwise the stick itself might be corrupted.* If copying files off means they''re
    still write-protected, there could be another issue at play so we suggest keeping
    the backup and reformatting the disk completely in Linux. You may need to create
    copies of some of the text files in case they won''t work again, but just save
    these to the device once it''s been reformatted.


    If it still doesn''t work then your stick may be corrupted beyond repair.


    # Virtual development


    I am reorganising the way I do development and rather than create one virtualhost
    per project I want to use a wildcard DNS and virtualhost.


    I have a directory called dev and test. I want to make it so it goes to dev/*
    folder if I type...


    \*.d.server.loc (.d. for dev, .t. for test)


    So say I have a folder called project1 in dev I want to type project1.d.server.loc
    and it will go to that folder.


    I already have the wildcard DNS setup. I''m guessing in Apache this may be doable
    with mod rewrite. How would I be done, if possible?


    **Malcolm Powers**


    So it seems for something like this you can use mod\_rewrite to get this to work
    with you. For


    # Configuring wireless drivers


    I''ve just installed a driver for the Linksys AE2500 wireless adapter using ndiswrapper
    and was able to set up the wireless network configuration for WPA-WPA2 security
    mode. My Linux distribution is Ubuntu 12.04.


    The driver is bcmwl-hid and the device''s MAC is c0:c1:03:0a:d2:d7 ndiswrapper
    -l reports the following status:


    **bcmwl-hid: driver installed**

    **device (13b1:003a) present**


    I am puzzled by the driver''s failure to detect the wireless network, which normally
    works with several other wireless adapters. But then sudo lshw does not report
    this device either.


    I''d be very grateful if you could give me a hand with this.


    **Julian**


    **What may well be happening is that the module is not loading properly.** This
    can happen with any kind of driver or module but to fix this specific case use


    `$ modprobe ndiswrapper`


    ...followed up by adding ndiswrapper to the end of /etc/modules file. It will
    autoload ndiswrapper at boot time and get your wireless working as soon as you
    log in.


