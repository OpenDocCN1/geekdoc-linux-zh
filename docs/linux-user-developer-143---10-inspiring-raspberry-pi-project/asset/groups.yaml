  md: "\n# Tutorial: Improve web app security with OWASP\n\n![Image](img/daaca9116bc2b1db669c224de81abc7c_31_0.png)\n\
    \n## 05 Session ID management\n\nCookies act as the carrier to transport the session\
    \ IDs between the client (generally a web browser) and the server, as does the\
    \ URL rewriting mechanism. Having secured the container, we can now explore ways\
    \ to secure the payload as well:\n\n- Always generate the session IDs after a\
    \ successful authentication, and maintain a note of the IDs generated. The idea\
    \ here is to never accept an ID that has not been generated by the application.\n\
    - It is also necessary to always treat the session IDs as untrusted, similar to\
    \ any other user input, and to validate and verify the IDs before processing them.\n\
    - Session IDs should be renewed in case there is a change in the privilege level\
    \ of the user. This way session fixation attacks can be mitigated, as the session\
    \ ID has changed after the login and the attacker no longer knows it.\n- For further\
    \ information on session ID management, you can read more on the OWASP site: https://www.owasp.org/index.php/Session_Management_Cheat_Sheet.\n\
    \n```php\n/* Prepared statement, stage 1: prepare */\nif (($stmt = $mysqli->prepare(\"\
    INSERT INTO test(id) VALUES (?)\")) == FALSE) {\n    echo \"Prepare failed: (\"\
    \ . $mysqli->errno . \") \" . $mysqli->error;\n}\n\n/* Prepared statement, stage\
    \ 2: bind and execute */\n$id = 1;\nif (!$stmt->bind_param(\"i\", $id)) {\n  \
    \  echo \"Binding parameters failed: (\" . $stmt->errno . \") \" . $stmt->error;\n\
    }\n\nif (!$stmt->execute()) {\n    echo \"Execute failed: (\" . $stmt->errno .\
    \ \") \" . $stmt->error;\n}\n```\n\n## 06 Database handling\n\nDatabases are the\
    \ primary components of any web application. We need them to store data, and so\
    \ they are inevitably the prime targets of attackers. Now, databases can't be\
    \ accessed easily; malicious access is difficult to obtain. But what if this malicious\
    \ access is from your own application? It's not as strange as it sounds; the database\
    \ queries that form the business logic of your application are one of the most\
    \ vulnerable points for attacks – courtesy of SQL injection attacks. Typically,\
    \ such attacks are carried through injecting a piece of SQL query to the application\
    \ via user input fields like text boxes etc. The OWASP cheat sheet on SQL injection\
    \ attacks mentions three major solutions for this, which we will explore in the\
    \ next steps.\n\n```php\n/* Create the stored procedure */\nif ($mysqli->query(\"\
    DROP PROCEDURE IF EXISTS p\") ||\n    !$mysqli->query(\"CREATE PROCEDURE p(IN\
    \ id INT) BEGIN INSERT INTO test VALUES(id,val); END;\")\n) {\n    echo \"Stored\
    \ procedure creation failed: (\" . $mysqli->errno . \") \" . $mysqli->error;\n\
    }\n\n/* Call the stored procedure in the application */\nif ($mysqli->query(\"\
    CALL p(1)\")) {\n    echo \"CALL failed: (\" . $mysqli->errno . \") \" . $mysqli->error;\n\
    }\n```\n\n## 07 Parameterized queries and stored procedures\n\nParameterized queries\
    \ (Fig. 01) are the first defence option; the result is exactly the same as normal\
    \ SQL queries, the only difference being that you need to define the SQL code\
    \ first and pass the parameters to the query later. So, even if someone tries\
    \ to attack by passing malicious data to the query, the query searches for the\
    \ exact match of whatever is sent as input. For example, if someone tries to pass\
    \ “or 1=1” as the data, the query will look up the DB for a literal match of the\
    \ data. The next defence against SQL injection attacks is using stored procedures\
    \ (Fig. 02). In principle, a stored procedure has an effect similar to parameterised\
    \ queries. The only difference being that the procedure or the method is itself\
    \ stored in the database, and called by the application when required. But there\
    \ is a downside as well, as in some cases this can harm performance, because parameterised\
    \ queries or stored procedures need server resources.\n\n## 08 Escaping user input\n\
    \nThis approach needs the user input to be manually – or sometimes with the help\
    \ of DBMS escaping mechanisms – escaped for valid strings, thus minimising any\
    \ chance of malicious input being sent to the database. This option may sometimes\
    \ prove insufficient, but can be useful in cases where you want better performance\
    \ or are rewriting a legacy code and want to finish with lesser effort. PHP provides\
    \ automatic input escape mechanism called `magic_quotes_gpc` which you can use\
    \ before sending the input to back end, but it would be better to use the escaping\
    \ mechanism provided by your database, since the query comes to the database,\
    \ and the database would know better about what is a valid query. MySQL provides\
    \ the `mysql_real_escape_string()` method to escape the input. Check your database\
    \ documentation to find the escape function supported.\n\n## 09 Cross site-scripting\
    \ prevention\n\nSuch attacks work by injecting a malicious script, in the form\
    \ of JavaScript, Flash or even HTML, to a genuine website. When the user accesses\
    \ the site, the browser has no idea whether the script is genuine or not, and\
    \ executes it. Once executed, they can access the cookies, session data or other\
    \ sensitive information stored in the browser, since they are sent via a genuine\
    \ website that the user tried to access. OWASP suggests treating the web pages\
    \ as templates with certain slots for the untrusted data. For example, suppose\
    \ you are creating the home page, on the top left you have a slot for the username,\
    \ which is retrieved by the application and displayed to the user during the rendering\
    \ of the web page.\n\n**Untrusted data in HTML tags and attributes:** When you\
    \ need to insert untrusted data in the HTML tags, make sure it is escaped before\
    \ being used. For example, characters such as `<`, `>`, `&` etc should be changed\
    \ to `&lt;`, `&gt;`, `&amp;` respectively. You can have a look at the ESAPI reference\
    \ implementation of HTML entity escaping and un-escaping. Here is a sample usage\
    \ of the API:\n\n```java\nString safe = ESAPI.encoder().encodeForHTMLAttribute(request.getParameter(\"\
    input\"));\nString safe = ESAPI.encoder().encodeForCSS(request.getParameter(\"\
    input\"));\n```\n\n**Untrusted data in HTTP GET parameter:** URLs like `'http://mysite.com(value=data)'`\
    \ can be a target. In such cases, make sure to escape all the characters with\
    \ an ASCII value less than 256 using the `%HH` escaping format. The ESAPI for\
    \ URL validation looks like this:\n\n```java\nString safe = ESAPI.encoder().encodeForURL(request.getParameter(\"\
    input\"));\n```\n\n**Untrusted data in CSS:** In cases where you need to put untrusted\
    \ data in CSS, it is important that you take care that it is done only in a property\
    \ value and nowhere else. Especially when you need to pass a URL check if it starts\
    \ with `'http'`. Then, except for alphanumeric characters, escape all the other\
    \ characters with an ASCII value less than 256.\n\n## 10 Safe URL redirects\n\n\
    Phishing is slowly turning out to be a big threat for user security. More so because\
    \ it is not related to a website directly except for its look and feel. Attackers\
    \ can easily put up similar looking websites at similar sounding web addresses\
    \ to trap users, who think that they have approached a genuine site, then proceed\
    \ to provide their authentication details. While many times such attacks are out\
    \ of scope from your application perspective, you should make sure that nowhere\
    \ in your application are the URL redirects compromised, as attackers generally\
    \ try to implant malicious URLs to the valid applications. You should usually\
    \ avoid redirects – even if it can't be done, at least do not take URL inputs\
    \ from the users without proper validation.\n\n> When the user accesses a site,\
    \ the browser has no idea whether the script is genuine or not, and executes it.\n\
    \n![Image](img/daaca9116bc2b1db669c224de81abc7c_32_0.png)\n\n---\n\n# Tutorial:\
    \ Upgrade your private cloud with ownCloud 7\n\nAccess, sync and share your data\
    \ much more effectively using ownCloud 7's brand new features and built-in apps\n\
    \n![Image](img/daaca9116bc2b1db669c224de81abc7c_33_0.png)\n\n*   This is the link\
    \ to reveal the menu related to ownCloud functionality\n*   Upload or create new\
    \ files here\n*   User related menu here\n*   Depending on the functionality selected,\
    \ this side bar shows relevant options\n*   This option lets you move files throughout\
    \ your ownCloud server with a single click\n\n### Advisor\n\n**Nithish Tiwari**\
    \ is a software developer by profession and an open source enthusiast by heart.\
    \ As well as writing for leading open source magazines, he helps firms set up\
    \ and use open source software for their business needs.\n\n### Resources\n\n\
    -   ownCloud website: [owncloud.org](https://www.owncloud.org)\n-   ownCloud app\
    \ page: [apps.owncloud.com](https://apps.owncloud.com)\n\nSome time back in LUB\
    \ 135, we ran a tutorial on setting up your own private cloud using **ownCloud\
    \ 5.0.13**. Along with installation, we also saw how to set up desktop syncing\
    \ and the ways to extend ownCloud functionality using various apps. Today we revisit\
    \ ownCloud – version 7.0.0. The new ownCloud 7 was released recently with several\
    \ new features and a revamped UI. As per the ownCloud website, the main focus\
    \ with this version is to help you in accessing, syncing and sharing your data.\n\
    \nIn this latest incarnation, the ownCloud UI has been tweaked heavily, with the\
    \ main focus on sharing. Also the functionality is now clearly segregated with\
    \ related functionality grouped together. But the changes are not only skin deep;\
    \ several new features have been added as well. ownCloud 7 now has external storage,\
    \ which lets you add extra storage from Dropbox, Google Drive and others, and\
    \ collaborative editing, which enables up to five people to work on a doc simultaneously,\
    \ along with many other enhancements. We will have a look at the new features\
    \ in this tutorial, as well as check out ways to extend ownCloud functionality\
    \ using apps. As you're aware, apps are integral parts of ownCloud – adding them\
    \ is as simple as selecting the app and clicking Enable. Some of the apps like\
    \ calendar, contacts etc. are enabled out of the box in your ownCloud installation.\n"
  mdcn: "\n\n# 教程：使用 OWASP 提升 Web 应用安全性\n\n![Image](img/daaca9116bc2b1db669c224de81abc7c_31_0.png)\n\
    \n## 05 会话 ID 管理\n\nCookie 作为载体，负责在客户端（通常是 Web 浏览器）和服务器之间传输会话 ID，URL 重写机制也起到类似的作用。在确保容器安全之后，我们现在可以探索保护有效载荷的方法：\n\
    \n- 始终在成功认证后生成会话 ID，并记录生成的 ID。这里的理念是绝不接受任何未由应用程序生成的 ID。\n- 与任何其他用户输入一样，必须始终将会话\
    \ ID 视为不可信输入，并在处理前对其进行验证和确认。\n- 如果用户的权限级别发生变化，应重新生成会话 ID。这样可以缓解会话固定攻击，因为登录后会话\
    \ ID 已更改，攻击者不再知晓该 ID。\n- 有关会话 ID 管理的更多信息，您可以阅读 OWASP 网站上的内容：https://www.owasp.org/index.php/Session_Management_Cheat_Sheet.\n\
    \n```php\n/* Prepared statement, stage 1: prepare */\nif (($stmt = $mysqli->prepare(\"\
    INSERT INTO test(id) VALUES (?)\")) == FALSE) {\n    echo \"Prepare failed: (\"\
    \ . $mysqli->errno . \") \" . $mysqli->error;\n}\n\n/* Prepared statement, stage\
    \ 2: bind and execute */\n$id = 1;\nif (!$stmt->bind_param(\"i\", $id)) {\n  \
    \  echo \"Binding parameters failed: (\" . $stmt->errno . \") \" . $stmt->error;\n\
    }\n\nif (!$stmt->execute()) {\n    echo \"Execute failed: (\" . $stmt->errno .\
    \ \") \" . $stmt->error;\n}\n```\n\n## 06 数据库处理\n\n数据库是任何 Web 应用程序的核心组件。我们需要它们来存储数据，因此不可避免地成为攻击者的主要目标。尽管数据库不易被直接访问，且恶意访问难以获取，但如果这种恶意访问来自您自己的应用程序呢？这听起来可能有些奇怪，但构成应用程序业务逻辑的数据库查询是攻击中最脆弱的环节之一——这主要归因于\
    \ SQL 注入攻击。通常，这类攻击是通过在用户输入字段（如文本框等）中注入一段 SQL 查询代码来实施的。关于 SQL 注入攻击的 OWASP 速查表提到了三大主要解决方案，我们将在接下来的步骤中加以探讨。\n\
    \n```php\n/* Create the stored procedure */\nif ($mysqli->query(\"DROP PROCEDURE\
    \ IF EXISTS p\") ||\n    !$mysqli->query(\"CREATE PROCEDURE p(IN id INT) BEGIN\
    \ INSERT INTO test VALUES(id,val); END;\")\n) {\n    echo \"Stored procedure creation\
    \ failed: (\" . $mysqli->errno . \") \" . $mysqli->error;\n}\n\n/* Call the stored\
    \ procedure in the application */\nif ($mysqli->query(\"CALL p(1)\")) {\n    echo\
    \ \"CALL failed: (\" . $mysqli->errno . \") \" . $mysqli->error;\n}\n```\n\n##\
    \ 07 参数化查询和存储过程\n\n参数化查询（图 01）是首选的防御手段；其结果与普通 SQL 查询完全相同，唯一的区别在于您需要先定义 SQL 代码，稍后传入参数。因此，即使有人试图通过向查询传递恶意数据进行攻击，该查询也会查找与输入内容完全匹配的记录。例如，如果某人试图传递“or\
    \ 1=1”作为数据，查询将在数据库中查找该数据的字面匹配项。针对 SQL 注入攻击的下一道防线是使用存储过程（图 02）。原则上，存储过程的作用与参数化查询类似。唯一的区别在于，过程或方法本身存储在数据库中，并在需要时由应用程序调用。但这也有缺点，因为在某些情况下，这可能会影响性能，因为参数化查询或存储过程需要消耗服务器资源。\n\
    \n## 08 转义用户输入\n\n这种方法需要手动——或者有时借助 DBMS 的转义机制——将用户输入转义为有效的字符串，从而最大限度地减少恶意输入被发送到数据库的可能性。虽然这种方案有时可能不足以满足需求，但在需要更好性能或希望以较少工作量重写遗留代码的情况下非常有用。PHP\
    \ 提供了一种名为 `magic_quotes_gpc` 的自动输入转义机制，您可以在将输入发送到后端之前使用它，但最好使用数据库提供的转义机制，因为查询最终会到达数据库，而数据库更清楚什么是有效的查询。MySQL\
    \ 提供了 `mysql_real_escape_string()` 方法用于转义输入。请查阅您的数据库文档以查找支持的转义函数。\n\n## 09 跨站点脚本（XSS）预防\n\
    \n此类攻击通过向真实网站注入恶意脚本（形式为 JavaScript、Flash 甚至 HTML）来实现。当用户访问该网站时，浏览器无法识别脚本是真实的还是恶意的，并会执行它。一旦执行，攻击者就可以访问存储在浏览器中的\
    \ Cookie、会话数据或其他敏感信息，因为这些信息是通过用户试图访问的真实网站发送的。OWASP 建议将 Web 页面视为包含某些用于不可信数据槽位的模板。例如，假设您正在创建主页，左上角有一个用于显示用户名的槽位，该用户名由应用程序获取并在渲染\
    \ Web 页面时显示给用户。\n\n**HTML 标签和属性中的不可信数据：** 当您需要在 HTML 标签中插入不可信数据时，请确保在使用前先对其进行转义。例如，字符如\
    \ `<`、`>`、`&` 等应分别更改为 `&lt;`、`&gt;`、`&amp;`。您可以参考 ESAPI 的 HTML 实体转义和解转义的参考实现。以下是该\
    \ API 的使用示例：\n\n```java\nString safe = ESAPI.encoder().encodeForHTMLAttribute(request.getParameter(\"\
    input\"));\nString safe = ESAPI.encoder().encodeForCSS(request.getParameter(\"\
    input\"));\n```\n\n**HTTP GET 参数中的不可信数据：** 类似 `'http://mysite.com(value=data)'`\
    \ 的 URL 可能成为目标。在这种情况下，请确保使用 `%HH` 转义格式转义所有 ASCII 值小于 256 的字符。用于 URL 验证的 ESAPI\
    \ 代码如下：\n\n```java\nString safe = ESAPI.encoder().encodeForURL(request.getParameter(\"\
    input\"));\n```\n\n**CSS 中的不可信数据：** 在需要将在 CSS 中放入不可信数据的情况下，务必注意仅将其放置在属性值中，而不要放在其他位置。特别是当需要传递\
    \ URL 时，请检查其是否以 `'http'` 开头。然后，除了字母数字字符外，转义所有其他 ASCII 值小于 256 的字符。\n\n## 10 安全的\
    \ URL 重定向\n\n钓鱼攻击正逐渐变成用户安全的重大威胁。这是因为除了外观和感觉外，它并不直接针对网站本身。攻击者可以轻松地在听起来相似的网络地址上设置外观相似的网站来诱骗用户，用户误以为访问了真实网站，随后提供其身份验证详细信息。虽然从应用程序角度来看，此类攻击往往超出了范围，但您应确保应用程序中的\
    \ URL 重定向未被攻破，因为攻击者通常会试图向有效应用程序植入恶意 URL。您通常应避免重定向——即使无法完全避免，也请至少在未对用户提供的 URL 输入进行适当验证的情况下不予接受。\n\
    \n> 当用户访问网站时，浏览器无法识别脚本是真实的还是恶意的，并会执行它。\n\n![Image](img/daaca9116bc2b1db669c224de81abc7c_32_0.png)\n\
    \n---\n\n# 教程：使用 ownCloud 7 升级您的私有云\n\n利用 ownCloud 7 的全新功能和内置应用程序，更高效地访问、同步和共享数据\n\
    \n![Image](img/daaca9116bc2b1db669c224de81abc7c_33_0.png)\n\n*   这是显示与 ownCloud\
    \ 功能相关菜单的链接\n*   在此处上传或创建新文件\n*   用户相关菜单在此处\n*   根据所选功能，此侧边栏会显示相关选项\n*   此选项允许您单击一下即可在整个\
    \ ownCloud 服务器中移动文件\n\n### 编辑寄语\n\n**Nithish Tiwari** 职业是一名软件开发人员，内心则是开源爱好者。除了为顶尖的开源杂志撰稿外，他还协助企业部署和使用开源软件以满足业务需求。\n\
    \n### 资源\n\n-   ownCloud 网站：[owncloud.org](https://www.owncloud.org)\n-   ownCloud\
    \ 应用页面：[apps.owncloud.com](https://apps.owncloud.com)\n\n在稍早前的 LUB 135 期中，我们发布了一篇关于使用\
    \ **ownCloud 5.0.13** 搭建私人云存储的教程。除了安装过程，我们还探讨了如何设置桌面同步以及如何使用各种应用程序扩展 ownCloud\
    \ 功能。今天，我们重新审视 ownCloud——版本 7.0.0。新的 ownCloud 7 最近发布，带来了多项新功能和全新的 UI。根据 ownCloud\
    \ 网站的说明，该版本的主要目标是帮助用户访问、同步和共享数据。\n\n在这个最新版本中，ownCloud 的 UI 进行了大幅调整，重点在于共享。此外，功能现在被清晰地划分，相关功能被组合在一起。但变化并不止于表面；还添加了许多新功能。ownCloud\
    \ 7 现在支持外部存储，允许您从 Dropbox、Google Drive 和其他来源添加额外存储空间；还支持协作编辑，允许多达五人同时编辑文档，并进行了许多其他增强功能。我们将在本教程中查看这些新功能，并探讨如何使用应用程序扩展\
    \ ownCloud 功能。如您所知，应用程序是 ownCloud 的组成部分——添加它们很简单，只需选择应用程序并点击启用即可。日历、联系人等某些应用程序在您的\
    \ ownCloud 安装中默认已启用。\n\n"
