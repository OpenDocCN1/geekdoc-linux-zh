    # LINUX Linux dominates TOP500 supercomputing


    # Powers 97% of high-performance systems


    GNU/Linux has retained its position as the most popular operating system for high-performance
    computing (HPC), according to the most recent TOP500 survey results.


    Published twice a year, the TOP500 List records the 500 most powerful supercomputer
    systems in the world. This year''s list shows a continued dependence on Linux
    variants, with an impressive 486 of the 500 computers listed using a Linux variant
    — including the world''s fastest supercomputer, China''s Tianhe-2 (MilkyWay-2),
    and a mixed-platform Blue Gene system in Saudi Arabia which couples SUSE Linux
    Enterprise Server 9 with IBM''s Compute Node Kernel (CNK).


    The remaining systems in the latest TOP500 list use Unix (12 systems), with Microsoft''s
    proprietary Windows platform running on only two — one of which, at position 433,
    is the company''s own Azure cloud computing platform.


    | **Top 10** | Cores | Maximum achieved (TFlops/s) | Power (kW) |

    |---|---|---|---|

    | 1. Tianhe-2 (MilkyWay-2), China | 3,120,000 | 33,863 | 17,808 |

    | 2. Titan, USA | 560,640 | 17,590 | 8,209 |

    | 3. Sequoia, USA | 1,572,864 | 17,173 | 7,890 |

    | 4. K computer, Japan | 705,024 | 10,510 | 12,660 |

    | 5. Mira, USA | 786,432 | 8,587 | 3,945 |

