  \n# 引言\n\nIT 服务管理是所有 IT 专业人员一个日益重要的研究领域。IT 管理人员已经意识到，无论使用何种技术，高效且地管理这些技术并交付符合业务需求的服务，其重要性比以往任何时候都更加凸显。\n\
  \n国际公认的 ITIL 框架是 IT 服务管理最广为人知的方法。ITIL 的普及已席卷全球，其中在印度、中东和中国的应用尤为热烈。对于大多数 IT 员工来说，该认证现在被视为简历中不可或缺的补充，许多招聘广告都明确将基础级认证作为强制性要求。本书迈出了下一步，从基础级认证迈向中级能力水平。其内容侧重于流程最佳实践的实际应用。\n\
  \n能力模块可以教导组织和个人如何管理 ITIL 流程，并更好地理解如何实施这些流程，使他们能够为客户交付并支持服务。\n\n它还涵盖了与人员、关系、流程以及基础设施技术相关的问题，以确保组织或项目能够提供满足组织需求的高质量且极具成本效益的\
  \ IT 服务。\n\n\n\n\n要获得任何中级 ITIL 认证，基础级证书是先决条件。此外，必须参加由认证培训机构提供的认证课程，这可以是一门课堂课程，也可以是经过认证的在线学习课程。本书旨在补充此类课程，而非取代它。作为经验丰富的课堂辅导员和多门在线学习课程的作者，我们支持这一强制性要求。然而，我们认为在这些课程提供的材料之外，确实存在对额外材料的需求。对于那些参加了课程的学生来说，常见的反馈是允许的时间内涵盖的内容太多了。指南规定，学生在完成一门认证课程外，还至少应完成\
  \ 21 小时的活动。购买官方核心教材是一项巨额投资，可能超出了负担能力。通过提供中级能力课程大纲的每个关键方面，本书克服了这些困难。本书是购买核心教材经济型替代方案；它比幻灯片或视频更具深度。课程中令人困惑的概念可以学生按照自己的进度进行深入学习。大量的练习题有助于强化理解。\n\
  \n*ITIL Intermediate Certification Companion Study Guide* 为 IT 从业者提供中级培训。读者将获得 ITIL\
  \ 流程、角色和功能的概览。他们将在一个或多个流程中获得专业知识，重点关注 ITIL 实践的日常执行以及它们如何相互作用。\n\n本书涵盖了四个能力课程的完整大纲。这四项考试包括：\n\
  \n## 运营支持与分析 (OSA)\n重点关注 OSA 实践的实际，以实现事件、事故、请求、问题、访问、技术、IT 运营和应用程序管理。内容主要基于《ITIL\
  \ 服务运营》（Service Operation）出版中的最佳实践指南。\n\n## 规划、保护与优化 (PPO)\n重点关注 PPO 实践的实际，以实现容量、可用性、IT\
  \ 服务连续性、信息安全和需求管理。课程内容主要基于《ITIL 服务设计》（Service Design）出版中的最佳实践指南。\n\n## 发布、控制与验证\
  \ (RCV)\n重点关注 RCV 实践的实际，以确保满足组织或用户需求的新服务能够成功的规划、测试和实施。课程内容主要基于《ITIL 服务过渡》（Service\
  \ Transition）出版中的最佳实践指南。\n\n## 服务提供与协议 (SOA)\n重点关注 SOA 实践的实际，以实现服务组合、服务水平、服务目录、需求、供应商和财务管理。课程内容主要基于《ITIL\
  \ 服务策略》（Service Strategy）和《ITIL 服务设计》（Service Design）出版中的最佳实践指南。\n\n## 交互式在线学习环境与题库\n\
