  大部分处于服务生命周期服务过渡阶段的流程显示在中间矩形中；这些流程之前和之后的其他生命周期阶段显示在较小的、深色的矩形中。支持整个生命周期的服务过渡流程显示在中间矩形中。\n\
  \n图中未包含但被认为是发布、控制和验证流程之一的是来自服务运营生命周期阶段的 `Request Fulfillment`（请求履行）。该流程在第 3 章“事件管理、请求履行和访问管理”中介绍。\n\
  \n### 对业务的价值\n\n选择并采用 ITIL 推荐的最佳实践将有助于组织获得显著收益。采用并实施服务过渡的标准且一致的方法将使业务更容易估算与服务过渡相关的成本、时间、资源需求和风险。这反过来能够实现更多的成功变更，因为所需的返工更少。其他收益还包括易于采用和遵循的清晰流程，以及在项目之间共享资产，同时避免那些同时需要相同资产（如\
  \ `test environment`）的过渡项目之间发生冲突。避免此类冲突还将减少延迟。遵循建议还将减少在管理服务过渡测试环境和试点环境上花费的精力。\n\n\
  良好的服务过渡可确保以下收益：\n\n*   为所有参与服务过渡的利益相关者建立更好的预期，包括客户、用户、供应商、合作伙伴和项目\n*   增加信心，确保新或变更的服务能够规范交付，而不会意外影响其他服务或利益相关者\n\
  *   确保新或变更的服务具有可维护性和成本效益，并加强对服务资产和配置的控制\n\n过渡流程的使用会影响其他生命周期阶段，并促进和支持整体的服务管理方法。例如，在整个生命周期中，我们可以观察到\
  \ `change management`与其他流程之间的交互，例如来自 `design` 的 `service level management`、`availability\
  \ and capacity`，来自 `service strategy` 的 `financial management` 以及来自 `service operation`\
  \ 的 `incident and problem management`。\n\n过渡不仅连接了服务设计和服务运营；它在生命周期的所有阶段之间提供了接口和连接。\n\
  \n### 服务过渡策略的制定\n\n为了适当管理服务过渡活动，组织应该根据提供的服务的规模和类型、所需的发布次数和频率以及用户的任何特定需求来决定其方法。\n\
  \n服务过渡策略将涵盖组织所采用的管理服务过渡和分配资源的整体方法的定义。每个组织的要求不同，但应考虑的方面应以下内容：\n\n*   服务过渡的目的和目标\n\
  *   服务过渡的组织背景，涉及客户和供应商的合同义务\n* 范围，指明包含和排除的内容\n* 适用的内部或外部标准或法规要求，包括遵守行业标准和合同义务\n\
  * 参与过渡的利益相关者和组织，可能包括\n    *   第三方、供应商、服务提供商和战略合作伙伴\n    *   客户和用户\n    *   服务管理\n\
  *   服务过渡框架：\n    *   服务过渡的策略、流程和程序，包括服务提供商接口 (`SPIs`)\n    *   与程序和项目管理方法的集成\n \
  \   *   角色和职责\n    *   过渡的资源规划和估算\n    *   过渡的培训需求\n    *   变更和发布的授权\n    *   知识使用，包括经验、专业知识、工具、历史数据和组织内部现有知识\n\
  *   过渡标准，包括每个发布阶段的进入和退出、停止或重启活动、成功与失败\n*   新或变更服务的需求识别内容，包括\n    *   要过渡的服务，以及目标位置、客户和组织单元\n\
  \    *   发布定义\n    *   `SDP`（应包含架构设计）\n    *   将使用的环境（位置、组织和技术）\n    *   环境的规划和管理（调试/拆除）\n\
  \    *   人员，包括角色职责的分配、授权矩阵、培训和知识传递需求\n*   过渡方法：\n    *   过渡模型\n    *   管理变更、知识、资产和配置的计划\n\
  \    *   基线和评估点\n    *   配置审计和验证点\n    *   授权点的识别\n    *   变更窗口的识别\n    *   过渡的估算、资源和成本规划\n\
  \    *   过渡准备\n    *   变更授权和变更评估\n    *   发布和部署活动\n    *   错误处理\n    *   进度监控和报告\n\
  \    *   服务性能和测量，包括关键性能指标和改进目标\n*   过渡活动的交付物（部分是强制性文档，部分是可选文档），包括\n    *   过渡计划\n\
  \    *   发布策略和计划\n    *   构建、测试和部署计划\n    *   评估计划和报告\n    *   过渡结束报告\n*   里程碑计划\n\
  \n\n\n\n\n# 财务需求\n\n财务需求应包括预算和资金\n\n### 服务过渡生命周期阶段\n\n适用于新服务过渡的生命周期阶段应在服务设计包中定义并达成一致。一种有效的方法是采用项目管理方法论，允许在每个阶段结束、进入下一阶段之前进行检查。\n\
  \n典型的阶段可能包括：\n\n* 获取并测试新的配置项 (`CIs`) 和组件\n* 构建与测试\n* 服务发布测试\n* 服务运行就绪性测试\n* 部署\n\
  * 早期运行支持\n* 审查并结束服务过渡\n\n对于每个阶段，定义准入和退出标准至关重要，这些标准可以作为过渡过程中特定阶段的“质量关口”。\n\n### 服务过渡准备\n\
  \n服务过渡准备活动包括以下内容：\n\n* 审查并接受来自其他服务生命周期阶段的输入\n* 审查并检查输入交付物——例如服务设计包、服务验收标准和评估报告\n\
  * 识别、提交并调度变更请求 (`RFCs`)\n* 在服务过渡开始前检查配置基线已记录在配置管理系统 (`CMS`) 中\n* 检查过渡就绪情况\n\n所有这些活动都提供了一个参考点，通过确保已建立基线来跟踪进度，从而支持成功的过渡。跟踪和追踪进度将确保过渡过程中的任何偏差或路线调整都能被识别并妥善管理。变更评估在建议授权变更方面将发挥关键作用，允许业务部门确认对过渡的接受和就绪绪。\n\
  \n我们对就绪性的基本要求必须是：\n\n* 参与或接收过渡的利益相关者达成共识\n* 我们有一个适当的过渡计划\n* 该计划将按照服务设计包中设计和记录的方式提供服务\n\
  \n服务设计包将作为其签通过流程的一部分，由变更评估过程进行评估。此中期报告将成为我们过渡活动准备的重要输入，因为它将识别成功实施的概率。\n\n### 规划与协调服务过渡活动\n\
  \n为了协调服务过渡阶段的流程，有必要对每次过渡进行规划，以确保工作有效且高效地完成。作为过渡策略方法的一部分，识别在此阶段将使用的服务过渡模型至关重要。每次过渡将根据预期的结果有自己的需求，并应有特定的计划。该计划至少应涵盖以下章节：\n\
  \n* 工作环境和基础设施\n* 活动进度\n* 将开展的活动和任务\n* 资源和预算分配\n* 启动时可以确定的问题和风险，并在计划执行过程中增加\n* 任何特定行动或设备的提前期和应急方案\n\
  \nIT 环境是复杂的，并且通常分布在广泛的组织结构中。管理新服务的引入或现有服务的变更是复杂且充满了依赖关系。采取集成方法来规划过渡至关重要。必须确保整体计划保持一致，并支持过渡每个阶段的个人计划。例如，发布和部署计划需要考虑，特定资源用于测试的使用可能有非常特定的时间表。\n\
  \n如果过渡涉及新服务或现有服务的变更，它将需要一个总体计划，该计划应包括：\n\n* 里碑活动\n* 发布组件、包发布、构建、测试、部署、评估、早期运行支持\n\
  * 构建和维护服务以及 IT 基础设施\n* 测量系统\n\n由于可能同时进行许多活动，ITIL 建议采用项目管理方法。这允许将所有活动作为一个计划进行协调。\n\
  \n可以使用多种项目管理方法——例如，`PRINCE2` 或《《项目管理知识体系指南》(PMBOK® Guide)》。但无论采用何种方法，确保所有活动都得到协调都是关重要的。较大的发布（例如对业务影响更大的发布，或者可能涉及更复杂方法的发布）可能会作为独立的项目进行管理。\n\
  \n### 提供过渡过程支持\n\nITIL 服务过渡出版物的主要目的之一是为参与所实施变更的利益相关者提供建议。这包括向项目经理（他们可能不具备服务管理专业知识）就服务管理的重要因素提供指导——例如能够使服务过渡有效运行策略和流程。\n\
  \n过渡规划和支持为正在进行的活动管理提供协助，并与计划办公室和项目办公室保持联系。\n\n服务管理很大程度上取决于成功且有效的沟通，特别是在处理生产环境变更时。服务过渡提供了沟通计划指导，应涵盖以下内容：\n\
  \n* 沟通目标\n* 定义的利益相关者\n* 沟通内容\n* 频率和格式\n* 成功的衡量\n\n在执行计划的同时，确保足够的监控和进度报告以建立计划成功的。\n\
  \n定期监控进度有助于识别计划是否仍然业务。在项目周期内，业务需求可能会发生，监控进度有助于识别是否需要对计划进行修正。\n\n## 总结\n\n在本章中，我们介绍了服务过渡的介绍。我们探讨了服务过渡的、目标、范围及其对业务的价值。我们还识别了支持过渡阶段的关键要素。这包括服务过渡准备、过渡协调以及在过渡期间为利益相关者提供的支持。\n\
  \n## 考试要点\n\n理解服务过渡的。所有生命周期阶段都是重要的，但服务过渡的目的是确保策略和设计被正确实施。\n\n能够解释并扩展服务过渡的目标。确保任何所有新服务或变更服务的实施对业务来说都是无缝且有效的。\n\
  \n理解并扩展服务过渡的范围。服务过渡的范围是提高组织将新服务和变更服务转移到支持环境的能力，包括对新的、修改的、淘汰的或退役服务的变更、发布、评估和测试的所有方面。\n\
  \n能够解释并论证服务过渡对业务的价值。过渡是生命周期中的关键部分，使服务能够无缝集成到组织中。没有这一阶段，测试和准备可能会被忽视，导致交付和支持方面的困难。\n\
  \n\n\n\n\n# 理解并解释服务过渡准备。过渡需要大量的支持和准备，以确保支持团队和其他利益相关者准备就绪。清晰地阐述利益相关者的需求并确保这些需求得到满足是非常重要的。\n\
  \n# 理解规划过渡的方法。识别并能够解释规划过渡的方法，以及使用项目管理方法论来支持此活动。\n\n# 理解服务过渡如何为利益相关者提供支持。理解在过渡管理中评估和跟踪的作用，以确保运营利益相关者的准备就绪。\n\
  \n## 复习题\n\n你可以在附录中找到复习题的答案。\n\n1. 下列哪个*不是*服务过渡的目标？\n    1. 对新或变更服务的性能和使用建立正确的预期。\n\
  \    2. 关于服务和服务资产提供高质量的知识和信息。\n    3. 记录如何使用服务资产交付服务以及如何优化其性能。\n    4. 确保服务变更产生预期的业务价值。\n\
  \n2. 关于服务过渡，以下哪些述是/是正确的？\n    1. 过渡将策略变为交付物。\n    2. 在服务过渡阶段，设计被应用于现实世界，策略得以实现。\n\
  \    3. 服务的价值在策略阶段被确定，并通过过渡服务以交付该价值。\n    4. CSI 识别的改进可能需要通过过渡来实施。\n        1. 以上全部\n\
  \        2. 仅 1, 2 和 3\n        3. 仅 3 和 4\n        4. 仅 2, 3 和 4\n\n3. 下列哪些情况不属于服务过渡的范围？\n\
  \    1. 供应商之间的转移\n    2. 制定业务案例以证明将服务外包给外部供应商是合理的\n    3. 与多个供应商建立合作伙伴关系\n    4.\
  \ 与另一个组织建立合资企业\n    5.终止与供应商的合同\n        1. 以上都不是\n        2. 仅 1, 3 和 4\n     \
  \   3. 仅 1, 2, 3 和 4\n        4. 仅 1, 3, 4 和 5\n\n4. 正确或错误？服务过渡的目的是确保新或变更的服务是根据策略进行设计的。\n\
  \    1. 正确\n    2. 错误\n\n5. 下列选项中，哪一个*不是*成功服务过渡的一个方面？\n    1. 开发容量计划以识别客户需求\n  \
  \  2. 评估并减轻风险\n    3. 控制服务资产以确保其完整性\n    4. 构建用于构建、测试和发布服务的高效可重复机制\n\n6. 下列哪个过程被认为其重点与服务过渡密切相关，而不是在整个服务生命周期中使用？\n\
  \    1. 变更管理\n    2. 变更评估\n    3. 知识管理\n    4. 服务资产和配置管理\n\n7. 关于服务过渡的范围，以下哪些陈述是/是正确的？\n\
  \    1. 新服务的引入涵盖在服务过渡范围内。\n    2. 服务之间的之间的转移涵盖在服务过渡范围内。\n        1. 仅陈述 1\n    \
  \    2. 仅陈述 2\n        3. 两个陈述都是\n        4. 两个陈述都不对\n\n8. 下列哪些包含在过渡活动管理中？\n   \
  \ 1. 内部包\n    2. 外包\n    3. 共同包\n    4. 离岸包\n        1. 1, 2, 3\n        2. 2, 3,\
  \ 4\n        3. 1, 3, 4\n        4. 1, 2, 3, 4\n\n9. 关于服务生命周期，以下哪个陈述是正确的？\n    1.\
  \ 服务策略描述了供应商作为交付优先事项的需求。\n    2. 服务设计控制运营环境并优化服务交付。\n    3. 服务过渡为开发引入新服务的能力提供了指导。\n\
  \    4. 服务运营利用业务需求来描述和制定改进策略。\n\n10. 正确或错误？服务过渡与持续服务改进集成，并将应用 PDCA 方法来改进过渡生命周期阶段的流程。\n\
  \    1. 正确\n    2. 错误\n\n# 第 12 章\n\n## 变更管理与服务资产和配置管理\n\n本章讨论了以下 ITIL 发布、控制和验证能力中级考试目标：\n\
  \n* ![images](img/00005.jpeg) 变更管理和服务资产和配置管理将从以下方面进行讨论：\n    * 目的\n    * 目标\n  \
  \  * 范围\n    * 价值\n    * 策略、原则和基本概念\n    * 过程活动、方法和技术\n    * 触发器、输入、输出和接口\n    *\
  \ 信息管理\n    * 过程角色\n    * 关键成功因素和关键性能指标\n    * 挑战\n    * 风险\n\n![](img/00006.jpeg)\
  \ 发布、控制和验证能力大纲了每个过程的日常运营以及过程活动、方法、技术和信息管理的细节。服务过渡过程的管理和监督将在生命周期课程以及《Sybex ITIL 中级认证学习指南：ITIL\
  \ 服务生命周期考试》中涵盖。\n\n变更管理通过实施升级、迁移以及问题和事件解决，确保服务及其基础技术能够支持不断变化的业务需求，同时通过仔细评估这些变更的风险和影响来保护运行环境。服务资产和配置管理提供了许多其他过程（包括变更管理），提供了有关所有硬件、软件和其他资产所在的信息，关重要的是它们之间的关系。\n\
  \n我们将逐一检查这些过程。\n\n# 变更管理\n\n在 IT 管理中，我们可以确定的唯一事实是总是需要对已有的东西进行变更。IT 不停滞，无论变更是为了利用新技术，还是因为业务需求的演变，有效的服务管理都能够在不中断所提供服务的情况下实施变更。变更可以是主动的（如上述描述——改进或扩展服务），也可以是对错误或变化情况的反应。我们需要管理这些变更，以最大限度地减少对服务的风险，同时确保用户和客户充分做好准备。\n\
  \nITIL 的变更管理指南可以扩展到适用于各种规模和类型的组织。\n\n### 变更管理的目的\n\n变更管理过程的目的是控制所有变更的生命周期，以便在 IT\
  \ 服务产生最小干扰的情况下做出有益的变更。\n\n### 变更管理的目标\n\n变更管理的目标是促进业务所需的变更，从而确保服务继续与业务需求保持一致。这意味着满足客户不断变化的业务需求的同时，避免事件、中断和重复工作。变更管理寻求优化整体业务风险。优化风险可能意味着完全避免某种风险，但也包括由于潜在收益而意识地接受某种风险。\n\
  \n\n\n\n响应变更请求需要对风险、影响、资源需求和业务效益进行评估。还应该考虑不实施变更的风险，以及变更可能引入的任何风险。在变更需求与变更影响之间保持平衡至关重要。\n\
  \n这意味着该过程还负责管理服务生命周期各个阶段之间的接口，确保输入和输出的质量。\n\n变更管理的另一个目标是确保所有变更都得到充分理解。这意味着变更必须以受控的方式进行记录、评估、优先级排序、计划、测试、实施、文档化和评审。变更管理还确保对配置项（CIs）的所有变更都记录在配置管理系统中。\n\
  \n## 变更管理的范围\n\n在这里，我们可以看到 ITIL 对“变更”的定义——“对可能对 IT 服务产生影响的任何添加、修改或删除”。这意味着变更管理的范围包括对所有架构、流程、工具、指标和文档的变更，以及对\
  \ IT 服务和其他配置项（CIs）的变更。改变这些中的任何项都可能对 IT 服务产生影响，因此变更管理确保我们理解自己正在改变什么以及该变更的潜在影响。\n\n\
  变更管理的范围由每个组织定义，但它通常包括跨越整个服务生命周期所有配置项的变更，包括物理和虚拟资产。服务设计五个方面的任何变更都在范围内，包括对服务解决方案的变更；提供服务运行所需的管理信息系统和工具、技术和管理架构的变更；设计、过渡、运行和改进服务所需的流程；以及用于衡量服务的系统、方法和指标。\n\
  \n每个组织必须准确决定哪些内容超出其变更管理过程的范围，例如那些具有更广泛影响的变更——例如部门组织、政策或业务运营的变更。需要注意的是，此类变更以后将涉及变更请求（`RFCs`），以满足随之而来的服务变更。操作性变更（如组件维修）也可以被排除在外；然而，如果任何确定的配置项被修改、删除或替换，则需要对配置系统信息进行更改，因此此类操作应记录为变更。\n\
  \n图 12.1 展示了 IT 部门变更管理过程典型范围。它展示了该过程如何在战略、战术和运营层面与业务和供应商对接。它展示了与内部服务提供者的接口，以及与那些拥有需要变更管理的共享资产的外部服务提供者的接口。\n\
  \n![图像显示位于中心的服务组合，连接到业务、服务提供者和供应商中的战略（业务和供应商）、战术（业务流程和外部服务）以及运营（业务和外部运营）变更。](img/00050.jpeg)\n\
  \n图 12.1 服务变更管理与发布部署管理的范围\n\nCopyright © AXELOS Limited 2010\\. 保留所有权利。根据 AXELOS\
  \ 的许可复制\n\n服务变更管理对接业务变更管理（图中左侧）以及供应商的变更管理（右侧）。在这种情况下，供应商可能是使用自身变更管理过程的外部供应商，或者是使用项目变更机制的项目团队。\n\
  \n服务组合定义了当前、计划和退休的服务，因此有助于相关人员理解变更对当前服务的潜在影响。变更可能源于生命周期的不同领域——战略变更来自服务策略和服务组合管理的提案，而对服务的变更来自服务设计、持续服务改进、服务水平管理和服务目录管理。还会实施更正变更以解决故障，这些将源于事件和问题管理。\n\
  \n记住：变更管理*并不*负责协调各种服务管理流程以确保项目的顺利实施。这是由过渡规划与支持完成的。\n\n## 变更对业务的价值\n\n接下来，我们考虑变更管理为业务提供的价值。考虑你自己的组织。糟糕的\
  \ IT 变更管理会对业务产生什么影响？引入良好的变更管理获得哪些收益？你将如何向业务解释这些？\n\n服务的可用性是一个关键的保证方面；如果没有可靠的服务，业务无法获得该服务旨在提供的效益。保护这一方面，确保变更不中断服务，是实施变更管理的主要收益。良好的变更管理使服务提供者能够在实施有益变更的同时保护现有服务，从而为业务增加价值。它确保变更满足业务需求的同时优化变更成本。通过提供管理的证据，可以证明组织对治理、法律、合同和监管要求的合规性。这对于服务提供者需要遵循最佳实践流程的证据以通过\
  \ `ISO/IEC 20000` 或 `ISO/IEC 38500` 标准审计的情况非常有帮助。\n\n随着对复杂 IT 服务的依赖增加，有效的变更管理对任何组织都是至关重要的。花时间分析业务变更对\
  \ IT 的影响以及 IT 变更对业务的影响是必要的，与受影响的人进行沟通以及对所采取的行动进行准确记录也是如此。它使服务提供者能够及时且受控地满足业务需求和成本，并确保变更符合治理标准；通过控制变更，服务提供者能够准确预测变更所需的时间成本并评估风险。尽管做出了努力，变更引起的某些中断是不可避免的；与业务就即将发生的变更进行良好沟通，并高效处理由变更引起的任何事件或问题，可以将这种影响降至最低。通过计划良好的变更和发布可以获得大量的成本节约和效率。\n\
  \n## 变更管理政策与原则\n\n本节讨论了变更管理中支持其有效执行的政策和原则。\n\n### 政策与原则\n\n\n\n\n在一份或多个策略文件中阐明变更流程背后的原则，将帮助员工理解高层对该流程的重视程度。反之，这种理解将有助于建立一种重视变更管理并遵循既定流程的文化。这种变更管理文化的采用将提高变更和发布的成功率，从而帮助建立该流程的信誉，并减少绕过该流程的尝试。\n\
  \n确保在这一领域遵循最佳实践可能是具有挑战性的。满足截止日期要求和削减成本的压力会促使人们通过减少测试和培训来偷工减料。已发布政策的存在将有助于抵御这种压力；这可能包括由于忽视了这些政策而决定不实施某项所需的变更。\n\
  \n现在让我们来看看组织可能采用的一些支持变更管理的可能策略。这些策略的目标是鼓励对未经授权的变更采取零容忍态度。该流程必须与业务、项目和利益相关者的变更管理流程保持一致才能有效。IT\
  \ 不负责业务变更流程，但应确保 IT 流程符合业务需求。其他策略还包括：\n\n*   所有变更都必须创造业务价值，并且必须对业务效益进行衡量和报告。\n*\
  \   变更的优先级排序应遵循有关创新型、预防型、检测型和纠正型变更的指南。\n*   变更的问责和责任贯穿整个服务生命周期。\n*   职责分离控制确保（例如）同意测试通过的人不是执行测试的人员。\n\
  *   变更的单一焦点点有助于尽可能地减少冲突变更以及对受支持环境的潜在干扰。\n\n组织可能采用的其他支持变更管理的可能策略还包括涵盖以下领域的策略：\n\n\
  *   与访问管理协作，以确保未经授权进行变更的人员无法访问受支持的环境\n    *   确保具有变更权限的人员仅在变更获得授权后才进行操作\n*   与其他流程（如服务资产和配置管理）协作，以检测未经授权的变更，并与事件管理协作以识别与变更相关的事件\n\
  *   通过指定变更窗口并强制执行，以确保变更在适当的时间点实施\n*   评估所有影响服务的变更的风险\n*   衡量流程的效率和有效性\n\n## 设计与规划考虑\n\
  \n健壮变更管理流程的设计应包含组织内部存在的任何法律或法规要求。它还应该考虑有效管理该流程所需的组织角色和职责，以及与其他服务管理流程的依赖关系和关系。衡量是任何流程的关键特征，应该包含适当的衡量措施以确保流程有效运行。所有这些方面都应充分记录，以确保理解整个流程，包括如何对变更进行分类和授权。变更的识别和分类包括将使用的变更文档标识符、所需的变更文档类型、变更文档模板以及预期内容。使用影响和紧急性对变更进行优先级排序的方法应结合角色、职责和问责制进行规定。\n\
  \n在设计变更管理流程时需要考虑的其他要求如下：\n\n*   组织角色、职责和问责制，例如对变更进行独立测试和正式评估的职责\n*   变更授权级别、升级规则以及\
  \ `CAB` 和 `ECAB` 的组成\n*   如何计划并向利益相关者沟通变更细节\n*   如何将变更分组为发布或变更窗口，以及提出、评估、评价和验证变更的详细程序\n\
  *   识别变更之间的依赖和冲突\n*   与其他服务管理流程的接口，特别是向服务资产和配置管理提供信息\n*   变更的衡量和报告\n\n变更管理流程应与发布部署管理以及服务资产和配置管理相结合。这有助于服务提供商评估变更对当前及计划的服务和发布的影响。\n\
  \n## 变更管理基本概念\n\n变更请求是寻求更改一个或多个配置项的正式通信。这可能是一个 `RFC` 文档，也可能是通过拨打服务台或作为项目启动文档的结果提出的。重大变更可能需要变更建议，由服务组合管理流程创建。不同类型变更的程序应适用于该类型——微小变更不应需要大量的文档。同样，所需的授权级别也应与该级别的变更匹配。\n\
  \n## 变更请求类型\n\n有三种不同的服务变更类型：\n\n*   许多变更可以归类为标准变更。这些是低风险且相对常见的，并遵循定义的程序。因此，它们在每次被请求时不需要进行评估；相反，这些变更是预授权的。每个标准变更都应该有一个定义其处理方式的变更模型。许多标准变更由请求履行触发，并可能由服务台直接记录并转交执行。标准变更的关键要素包括用于启动变更的定义触发器、一系列已知、文档化、经过证明且预授权的任务。预算批准将是预授权的，或在变更请求者的控制范围内。至关重要的是，实施变更涉及的风险通常很低且始终是明确理解的。在构建变更管理流程时应尽早识别标准变更。这有助于避免不必要的高水平管理负担。\n\
  *   紧急变更必须以最小的延迟实施——例如为了解决重大事件或实施安全补丁。这些通常被定义为：`不`执行变更的风险大于实施变更风险的变更。紧急变更的示例包括克服严重的安全漏洞和服务已受到严重影响或预计服务即将发生故障的重大事件。\n\
  *   所有其他变更都被定义为正规变更。\n\n根据涉及的成本和风险，变更可以分为重大、显著和微小。这种分类可用于确定适当的变更权限。\n\n应尽可能利用委托授权，包括通过标准变更程序以及通过变更管理人员对微小变更进行授权。\n\
  \n## 变更、RFC 和变更记录\n\n`change`、`change record` 和 `RFC` 等术语的使用并不一致。ITIL 核心指南对这些术语的定义如下：\n\
  \n**变更** 对 IT 服务产生任何影响的内容的添加、修改或删除，包括架构、流程、工具、指标和文档的变更，以及 IT 服务和其他配置项的变更。\n\n\n\n\
  \n\n# 变更记录\n\n`Change Record`（变更记录）是一个包含单个变更生命周期并引用受影响 CI（配置项）的记录。每个接收到的请求都会创建一个记录，并可以存储在配置管理系统或服务知识管理系统的其他地方。\n\
  \n`RFC`（变更请求）——对要进行的变更的正式提案。它可以以纸质或电子形式记录。\n\nRFC 仅用于提交请求；不用于传输变更管理的决策，也不用于记录变更的细节。变更记录包含了变更所需的所有信息，包括来自\
  \ RFC 的信息，并用于管理该变更的生命周期。\n\n## 变更模型和工作流\n\n许多组织会创建变更模型应用于特定的变更。变更模型定义了如何处理特定类型的变更；这些模型可以被编制到支持工具中以管理变更，确保每个此类变更都按照这种方式处理。模型对于常见变更非常有用，对于需要特殊处理的变更也是如此，例如紧急变更（可能有不同的授权方式，并可能需要追溯记录），或者任何需要特定测试和实施顺序的变更。\n\
  \n变更模型对于标准变更（包括由服务请求产生的变更）特别有用。\n\n变更模型通常会包含处理变更要执行的步骤，包括解决问题和意外事件。它将包含采取这些步骤的时间逻辑顺序（以及任何依赖关系或并发步骤），并定义每个步骤的责任。还包括完成操作的时间跨度、阈值以及任何升级程序。所使用的支持工具可以对这些许多方面实现自动化。\n\
  \n## 变更提案\n\n涉及重大成本、风险或组织影响的重大变更通常通过服务组合管理流程启动。在新服务或已更改的服务立项之前，需要对其潜在影响进行评审。变更提案的授权并不授权变更的实施，但允许服务被立项，以便开始服务设计活动。\n\
  \n提案包含了对变更的高级描述，包括效用性（utility）和保证性（warranty）水平以及其支持的业务结果。完整的业务案例以及变更设计和实施的概要计划是剩余内容。\n\
  \n当变更提案获得授权后，将更新变更计划以包含提议的变更。随后 RFC 将按正常方式用于请求特定变更的授权。\n\n## 变更授权\n\n任何机构都不可能拥有评估所有变更所需的知识，特别是在大型复杂的组织中。在这种情况下，应该为不同类别的变更识别变更机构。每个变更都必须由变更机构授权，变更机构可以是一个角色、一个人或一组人。授权级别取决于变更的类型、规模、风险和潜在的业务影响。当计划影响大型企业多个地点的变更时，可能需要更高级变更机构的授权，例如全球\
  \ CAB 或董事会。变更机构的所有成员都应该根据影响、紧急性、风险、收益和成本对变更进行评估。\n\n根据组织的文化，可能会有很多或很少的授权层级，并且可能根据指定的参数存在委托授权。图\
  \ 12.2 显示了变更授权模型的示例。每个组织都应该正式记录自己的变更授权分级，这可能与此处显示的示例非常不同。所有变更机构都应记录在 CMS 中。\n\n\
  ![图像显示了通信、决策和行动（向下箭头），以及用于 RFC 的通信升级，以及在不同变更机构范围和风险/影响水平下的风险、问题（向上的箭头）。](img/00051.jpeg)\n\
  \n**图 12.2**](#part0021_split_001.html_figureanchor12-2) 变更授权模型\n\nCopyright © AXELOS\
  \ Limited 2010\\. 保留所有权利。材料根据 AXELOS 的许可复制。\n\n在图 12.2 中，如果第 2、3 或 4 级的变更评估检测到更高级别的风险，则授权请求将升级到相应风险水平的更高级别。从高级别到本地级的委托授权必须伴随着对这些低级判断的信任。授权变更的级别应处于承担接受风险和修复责任的所在。\n\
  \n## 变更咨询委员会\n\n变更咨询委员会（CAB）是一组协助变更经理决定是否应该授权变更的人员。它也可以对优先级和调度决策提供意见。CAB 可以是某些变更类别的变更机构，对其他类别仅起咨询作用。根据组织的不同，可能有一个\
  \ CAB，也可以有多个，每个 负责处理特定地理区域、业务单元或其他类别的变更。某些成员是永久性的，参与每次评估；另一些成员可能在涉及专业知识的特定变更中被要求参加。\n\
  \nCAB 或多个 CAB 的成员必须具备足够的知识和权限来理解所呈现的变更，并能够评估涉及的潜在风险。CAB 代表应能够评估技术风险和业务风险。他们随后向适当的变更机构提出建议。根据所使用的服务管理工具，变更可以在\
  \ CAB 会议之前分发评估。为了确保会议尽可能高效，应提前分发变更提案、RFC、评估报告、变更计划和预计服务中断（PSO）文档。PSO 识别了计划变更、维护活动和测试计划对所约服务水平的影响。\n\
  \nCAB 通常由变更经理主持。潜在成员包括：\n\n* 客户\n* 用户经理\n* 用户组代表\n* 业务关系经理\n* 服务所有者\n* 应用程序开发人员/维护人员\n\
  * 专家和/或技术顾问\n* 服务和运营人员，如服务台台、信息安全管理和容量管理\n* 在变更涉及办公室搬迁时的设施管理人员\n* 承包商或第三方代表——例如，在外包情况下\n\
  * 根据需要的其他相关方\n\n标准的 CAB 议程可能包括：\n\n* 来自服务组合管理的变更提案\n* 待评估的 RFC，或已循环由 CAB 成员分发并评估的\
  \ RFC\n* 对已实施变更的审阅\n* 未完成的变更和进行中的变更\n* 来自变更评估的评估报告\n* 变更调度以及对变更计划和预计服务中断文档所需的更新\n\
  * 通过服务资产和配置管理检测到的任何未经授权变更的审阅\n* 失败的变更；未经授权的已回滚变更；或在未参考 CAB 的情况下应用的变更\n* 下次 CAB 评审所需的\
  \ RFC 预告\n\n\n\n\n\n在某些情况下，可能没有足够等到下一次预定的变更委员会（CAB）会议来决定变更。在这种情况下，可能会召集紧急变更委员会（`ECAB`）。`ECAB`\
  \ 由少数授权快速做出决策的人员组成。`ECAB` 成员通常为高级人员，涵盖业务部门和技术人员的代表。明确说明并同意将变更宣布为紧急变更的标准至关重要；由于紧急变更本身具有高风险，因为没有足够的时间进行详细的评估和测试。如前所述，只有当不实施某变更的后果大于其涉及的风险时，该变更通常才会归类为紧急变更。\n\
  \n## 修复措施\n\n所有变更必须包含一份处理失败的计划；该计划本身必须经过测试。理解修复方案有助于评估变更的风险——如果可以简单回滚（backout），风险就会降低。变更计划应包含何时需要修复的决策点，并留出足够的时间执行修复。\n\
  \n## 变更管理过程活动、方法和技术\n\n在本节中，我们将检查变更过程中特定方法和技术的细节。有效管理变更需要处理若干活动。这些包括：\n\n*   规划和控制变更，确保实施变更的时间表是适当的\n\
  *   在正确的时间向利益相关者传递正确的信息以沟通变更\n*   确保有权授权或做出变更决策的人是具有相应权限级别的最合适人员\n\n我们已经提到了确保修复计划到位的重要性。衡量和控制变更对于保护生产环境至关重要，理解变更的影响也是如此。最后，通过报告提供管理信息有助于识别流程中的薄弱环节，这些薄弱环节可以通过持续服务改进来解决。\n\
  \n管理单项变更的典型活动包括创建和记录 `RFC`（变更请求），然后对其进行评审，以便识别并过滤掉不完整或路由错误的变更。对变更进行评估和分析，并确定适当的变更授权。对于谁应该参与此变更的\
  \ CAB 做出决策。根据业务合理性、影响、成本、效益、风险以及预测性能对变更进行评估，并提交至变更评估流程。然后对变更进行批准或拒绝，并通知利益相关者（特别是发起者）。如果获得批准，则对实施进行计划、协调、评审和关闭。文档（如基线、评估报告和教训）将汇总在服务知识管理系统（`SKMS`）中。当所有操作完成后，变更即告关闭。\n\
  \n图 12.3 显示了正常变更的示例，例如对服务提供者的服务、应用程序或基础设施的变更。你可以看到变更状态是如何变化的。随着变更的进行，关于它的的信息以及涉及的配置项的信息将会更新。\n\
  \n![图像显示了正常变更流程，从创建、记录和评审 RFC，到如评估、授权、协调变更、授权变更部署、协调变更部署和关闭的工作流。这些都连接到以更新 CMS 中的信息。](img/00052.jpeg)\n\
  \n图 12.3 正常变更流程示例\n\nCopyright © AXELOS Limited 2010\\. 保留所有权利。材料根据 AXELOS 的许可复制。\n\
  \n让我们更详细地查看主要活动。\n\n### 记录变更\n\n流程从变更发起者提出请求开始。发起者将是需要该变更的人员或部门。请求将接受初始评估，以确定其是否为重大变更、提供的信息是否完整，以及所需的变更是否表述清晰。在此阶段，可能需要将请求返回给发起者进行澄清。\n\
  \n变更记录将包含基本信息，并随着变更的进展不断完善。所需的文档水平将根据变更的规模和复杂性而异。表 12.1 显示所需的文档示例。理想情况下，变更将记录在集成服务管理工具中。该工具能够将变更与配置项关联。方便获取这些信息有助于评估系统某一组件的变更对其他组件可能产生的影响。工具还可以维护操作日志，以便明确做了什么、何时完成以及由谁完成。变更记录将包含基本信息，并随着变更的进展不断完善。\n\
