  \ 共享的 (Shared)\n    4. 基于 Web 的 (Web based)\n\n# 第二部分\n## 规划、保护与优化\n\n# 第章\n## 规划、保护与优化简介\n\
  \n本章讨论了以下 ITIL 规划、保护与优化中级考试目标：\n\n* ![images](img/00005.jpeg) 服务设计的目的、目标和价值\n* ![images](img/00005.jpeg)\
  \ 语境中的生命周期\n* ![images](img/00005.jpeg) 服务设计基础\n* ![images](img/00005.jpeg) 设计协调与其他\
  \ PPO 相关的流程的接口\n\n\n\n\n\n![](img/00006.jpeg) 规划、保护与优化（PPO）汇集了与服务优化、安全及相关规划的核心指南相关的许多相关实践。本对\
  \ PPO 的介绍包含了服务设计和服务策略中的基本目的和目标，以在生命周期背景下支持 PPO。PPO 章节的这一章从其目的、目标和价值方面考虑了服务设计的的核心概念，以及它与其他\
  \ ITIL 生命周期生命周期阶段的关系。我们将探讨服务设计的基本概念，特别是设计协调流程如何与 PPO 相关的流程衔接。\n\n# 服务设计的目的、目标和价值\n\
  \n服务设计采用服务策略（服务生命周期的前一阶段）的输出，并利用这些输出来确保所产生的解决方案设计与 IT 服务提供者的整体策略一致，以支持不断变化的业务。换句话说，服务设计旨在开发服务，将服务策略中的目标转化为服务组合和服务资产组合。它还涉及对现有服务的重新设计。服务设计是服务生命周期中至关重要的阶段。在设计阶段，服务策略背后的意图开始变为现实。糟糕的服务设计将无法实现战略，可能会阻止获得价值的回报，并可能损害业务绩效和声誉。然而，为了赶上项目期限，这一阶段往往会被仓促完成；这种做法是愚蠢的——在设计上花费的时间可以节省后期重新工作的时间。\n\
  \n## 服务设计的目的\n\n生命周期服务设计阶段的目的是设计 IT 服务，以及必要的辅助 IT 实践、流程和策略，以实现服务提供者的策略。理解这一点非常重要——设计不仅关乎技术设计；还考虑了使用方式和所需的流程。设计还应该包括考虑服务如何过渡；它应该促进服务引入到支持的环境中，以确保高质量的服务交付、客户满意度和具有成本效益的服务提供。因此，设计的任务是将战略转变为实际现实。重要的是，设计必须考虑服务将*如何*运行。\n\
  \n## 服务设计的目标和目的\n\n让我们从考虑服务设计的目标和目的开始。服务设计必须设计出满足业务目标并符合业务需求的服务。这包括对质量、合规性、风险和安全要求的考虑，通过协调\
  \ IT 服务的所有设计活动，确保交付更有效、高效的 IT 和业务解决方案。在设计中确保一致性和业务关注点是一个关键目标。\n\n服务设计的客观是尽可能有效地设计\
  \ IT 服务，使其在生命周期内仅需要最少的改进。只有当服务在生产环境中使用时，我们才能理解对它们的要求。服务的使用也会随着时间的推移而变化。因此，服务设计在所有活动中嵌入持续改进是至关重要的。这确保了解决方案和设计随着时间的推移变得更加有效。识别并采取可能提供改进机会的业务变化趋势。服务设计活动可以是定期的，也可以基于异常的，由特定的业务需求或事件触发。\n\
  \n服务设计的其他目标和目的还包括：\n\n*   确保设计的服务能够适应未来需求，以便能够轻松地扩展、缩减或开发以满足变化的需求。\n*   运行成本过高的服务没有未来，因此设计应旨在减少、最小化或限制提供的长期成本。\n\
  *   设计一个高效且有效的服务管理系统，包括对高质量 IT 服务进行设计、过渡、运行和改进所需的流程。\n*   除了流程之外，设计必须提供支持性的工具、系统和信息（特别是服务组合），以在整个全生命周期内管理服务。\n\
  *   设计还需要识别和管理风险，以便在服务上线之前消除或减轻风险。\n\n服务设计的最后一组目标和目的包括：\n\n*   设计评估设计流程及其交付物有效性和效率的测量方法和指标。设计必须考虑如何衡量服务的有效性，并确保设计服务以便收集这些指标。\n\
  *   制作并维护设计高质量 IT 解决方案所需的 IT 计划、流程、策略、架构、框架和文档，以满足当前和未来的约定业务需求。\n*   服务设计有助于在 IT\
  \ 服务的设计和规划的所有领域制定政策和标准。通过接收并处理其他领域对设计流程的反馈，并将这些反馈纳入未来的流程，设计确保了这些流程的持续改进。\n*   设计旨在通过将战略和设计活动转化为运营任务，开发\
  \ IT 内部的技能和能力，有效高效地利用所有 IT 服务资源。\n*   设计有助于在既定的设计条件下提高 IT 服务的整体质量。它减少了在生产环境中实施后对服务进行重新工作和增强的需求。\n\
  \n## 设计为业务带来的价值\n\n采用 ITIL 推荐的最佳实践可以带来显著的业务利益。良好的服务设计确保了服务的质量和成本效益。如果服务对业务有用，那么这两个方面都需要得到交付。良好的服务设计使用标准、一致的方法可以带来许多利益，我们将逐一考虑。这些是：\n\
  \n**降低总拥有成本 (TCO)** 设计将考虑各种设计方案的成本，并选择一个在不产生不必要支出的情况下交付要求的方案。此外，因为设计符合业务需求，将不会有大量的更改来更有效地与业务需求对齐。通过在设计中考虑可用性和容量等方面，将故障事件降到最低，支持成本也会更低。\n\
  \n**提高服务质量** 设计良好并符合客户预期结果将提供更高质量的服务。\n\n**提高服务的一致性** 在公司策略、架构和限制范围内设计服务将确保交付一致的服务水平。\n\
  \n**易于实施的新或变更的服务** 设计良好的服务更容易过渡。\n\n**提高服务对齐** 通过从开始引入服务设计，我们可以确保新服务或变更的服务的设计符合业务需求，并能够支持所需的服务水平。\n\
  \n**提高服务性能** 服务将经过设计以满足特定的性能标准，将容量、可用性和 IT 服务连续性要求纳入设计中。\n\n**改进 IT 治理** 这将确保将必要的控制置于设计中的结果。\n\
  \n\n\n\n\n## 提高服务管理和 IT 流程的有效性\n\n流程设计在本章后的“服务设计基础”部分讨论的服务设计的五个方面之一；通过将流程视为设计的一部分，可以预期它们的设计将兼顾质量和成本效益。\n\
  \n## 改进信息和决策制定\n\n设计包括衡量标准和指标的设计——这使服务提供者能够确信他们拥有准确的信息来做出决策。这些衡量也将成为评估服务的基础，并能够在整个服务生命周期内识别服务及服务管理持续改进的机会。\n\
  \n## 增强与客户价值和策略的对齐\n\n如果组织拥有推广绿色 IT 等概念的政策，或使用云技术的策略，服务设计将确保新服务或变更服务的设计与这些价值和策略一致。\n\
  \n服务设计确保 IT 服务专注于支持业务流程和目标。这包括以下内容：\n\n*   根据业务影响和紧急程度对 IT 活动进行优先级排序，以确保关键业务流程和服务能够获得最多的关注\n\
  *   通过确保 IT 流程的高效有效来提高业务生产力\n*   通过适当的 IT 治理和控制支持公司治理需求，确保符合法规和法律要求\n*   利用 IT 基础设施并提供创新解决方案以创造竞争优势\n\
  *   提高服务质量、客户满意度和用户感知\n*   确保所有 IT 和信息资产得到适当的保护和安全\n\n## 服务设计的背景与服务生命周期\n\n服务设计需要在整个服务生命周期的背景下考虑。您应该熟悉服务生命周期的概念，见图\
  \ 7.1。每个阶段都针对成功服务管理需要解决的特定挑战，且每个阶段对所有其他阶段都有影响。\n\n![图像显示了 ITIL 服务生命周期，中心圈是服务策略，周围是闭环中的的服务过渡、运营和设计，外圈是持续服务改进。](img/00027.jpeg)\n\
  \n图 7.1 ITIL 服务生命周期\n\nCopyright © AXELOS Limited 2010\\. 保留所有权利。根据 AXELOS 的许可复制。\n\
  \n让我们依次考虑每个生命周期阶段。\n\n### 服务策略\n\n服务策略是服务生命周期的核心。策略的作用是理解组织目标和客户需求。人员、流程和产品应该支持该策略。ITIL\
  \ 服务策略在思考如何做之前先询问为什么要这样做。它帮助服务提供者设定目标；设定服务客户和市场的性能预期；并识别、选择和优先考虑机会。服务策略确保提供者理解并能够处理与与其服务组合相关的成本和风险。\n\
  \n服务策略流程的完整列表包括 IT 服务策略管理、服务组合管理、IT 服务财务管理、需求管理和业务关系管理。我们在第 9 章“IT 服务连续性管理与需求管理”中深入考虑需求管理，作为规划、保护和优化的一部分。\n\
  \n### 服务设计\n\n服务设计与规划、保护和优化特别相关，它将战略想法转化为交付物。设计必须始终考虑策略，以确保设计服务是以业务目标为考虑的。设计考虑了整个\
  \ IT 组织以及它如何交付和支持服务，将服务策略转化为实现业务目标的计划。记住：设计包括对现有服务的更改。\n\n服务设计流程的完整列表包括处理服务保证（warranty）方面的流程。这些包括可用性管理、容量管理和信息安全管理（在第\
  \ 8 章“容量、可用性和信息安全管理”中涵盖），以及 IT 服务连续性管理（在第 9 章作为规划、保护和优化的一部分涵盖）。其他服务设计流程在第 4 部分“服务报价与协议”中涵盖，包括服务目录管理（在第\
  \ 17 章“服务组合管理与服务目录管理”中涵盖）、服务水平管理和供应商管理（在第 18 章“服务水平管理与供应商管理”中涵盖）。最后一个设计流程是设计协调，我们将在本书稍后简要考虑。通过这些流程，设计确保在设计中同时考虑了新服务或变更服务的实用（utility）和保证，涵盖了服务的连续性、对约定的容量和可用性服务水平的实现，以及对安全标准和法规的遵循。\n\
  \n## 服务过渡\n\n服务过渡为将新服务和变更服务引入支持环境的能力提供了指导。服务的价值在策略中被识别，并设计服务以交付该价值。服务过渡通过允许必要的更改发生且不对现有服务产生不可接受的风险，确保价值的实现。服务过渡实现了新服务的实施和现有服务的修改，以确保提供的服务实现了实现业务目标的服务策略，并使服务设计的效益充分发挥。服务过渡还引入了服务知识管理系统，确保知识被存储并供服务生命周期的所有阶段使用，确保吸取教训并用事实数据支持决策，从而随着时间的推移提高效率和效果。\n\
  \n第 3 部分“发布、控制和验证”涵盖了服务过渡流程的完整列表。这些包括过渡规划与支持（在第 11 章“发布、控制和验证简介”中简要涵盖）、变更管理和服务资产与配置管理（在第\
  \ 12 章“变更管理和服务资产与配置管理”中涵盖）、服务验证与测试以及变更评估（在第 13 章“服务验证、测试与变更评估”中涵盖），以及发布部署管理和知识管理（在第\
  \ 14 章“发布部署管理与知识管理”中涵盖）。每个流程都有其作用，以确保有利的更改能够发生，从而能够引入服务并按照设计运行。\n\n## 服务运营\n\n服务运营描述了在支持环境中管理服务的最佳实践。它包括关于在交付和支持服务方面实现有效性、效率、稳定性和安全的指导，以为客户、用户和服务提供者创造价值。如果没有这些，服务将无法所需的价值，业务目标的实现将变得困难或不可能。\n\
  \n\n\n\n因此，服务运营阶段对于交付设计并以此实现服务战略至关重要。服务运营通过问题管理进行被动和主动的事题处理，通过事件管理进行被动的事题处理，为在约定的服务水平内交付服务提供详细指导。它为服务的交付人员提供指导，帮助其管理服务的可用性、控制需求、优化容量利用、调度操作、避免或解决服务事件以及管理问题。它还包括关于共享服务、实用程序计算、Web\
  \ 服务和移动商务的建议。通过按约定的水平交付服务，服务运营使业务能够利用服务来实现其业务目标。\n\n服务运营过程涵盖在第 1 部分“运营支持与分析”完整列表包括第\
  \ 2 章“事件与问题管理”中的事件管理和问题管理，以及第 3 章“事件管理、请求履行和访问管理”中的事件管理、请求履行和访问管理。每个过程都发挥着作用，以确保在约定的服务水平内交付服务。服务运营还描述了四个服务运营功能：服务台（涵盖第\
  \ 4 章“服务台”）、技术管理、IT 运营管理和应用管理（涵盖第 5 章“技术管理、应用管理和 IT 运营管理”）。每个功能负责在整个生命周期的所有阶段管理其自身的交付领域。\n\
  \n## 持续服务改进\n\n生命周期的最后一个阶段是持续服务改进（CSI）。CSI 通过确保服务的策略、设计、过渡和运行持续审查，确保服务提供者继续为客户提供价值。来自服务生命周期任何阶段的反馈都可以用于识别该阶段或生命周期任何其他阶段的改进机会。它使任何个人都能识别改进，并且每个过程都应该包含\
  \ CSI 元素。它使每个新设计都能吸纳之前设计的教训。它确保在合理的情况下识别、评估并实施改进机会。这些改进可能包括服务质量或服务提供者能力的提升。它可能涉及开发更好的工作方法，或者以相同水平但更高效的方式进行工作。改进可以是大的，也可以是小而渐进的。它使每个新操作都能吸纳之前操作的教训，并就如何开发服务管理的设计能力提供指导。\n\
  \nCSI 确保来自生命周期每个阶段和过程的反馈被捕获、分析并执行。CSI 的改进方法基于建立基准并检查改进措施是否有效。它使用了计划-执行-检查-处理（PDCA）循环，结合了服务衡量、通过指标展示价值以及进行成熟度评估。七步改进过程为这些方法提供了一个框架。\n\
  \n## 服务设计基础\n\n生命周期的服务设计阶段始于一组新的或变更的业务需求，结束于开发出旨在满足业务记录需求的服务解决方案。该解决方案记录在其服务设计包中，然后被传递给服务过渡阶段，以评估、构建、测试和部署新或变更的服务，之后由服务运营负责按设计交付服务。服务设计必须考虑服务将运行的环境，同时确保设计具有灵活性，以便在需求以后发生变化时可以轻松更改。服务的设计必须兼顾可维护性和成本效益。\n\
  \n使用标准化和一致的方法进行服务设计的益处包括：对所需成本和资源的准确估计、对所需预算的现实评估、更高数量的成功变更以及可重复方法和可用设计资产的开发。在良好的服务设计上花费的时间通过交付“一次做对”的设计获得回报。这会导致减少在返工上花费的时间和资金。服务设计应该管理利益相关者的预期，使他们理解正在交付的内容以及他们将获得的益处；这将增加利益相关者对成功结果信心。\n\
  \n### 服务设计与业务变更\n\nIT 服务变更的需求通常是业务流程变更的结果。一旦业务需求明确，就可以进行服务设计以满足当前和未来约定的业务需求。图 7.2\
  \ 显示了业务变更过程与 IT 之间的交互。\n\n![流程图显示了线性步骤，如业务流程变更、业务需求、开发、实现、收益实现。业务需求通过另一个箭头通过 IT\
  \ 服务需求指向 IT 服务生命周期，后者通过 IT 服务连接到实现。](img/00028.jpeg)\n\n图 7.2 业务变更过程\n\nCopyright\
  \ © AXELOS Limited 2010\\. 保留所有权利。材料根据 AXELOS 的许可复制。\n\n### 服务设计的四个 P\n\n将 IT 服务管理作为一种实践进行实施，在于准备和计划有效高效使用四个\
  \ P：人员（people）、过程（processes）、产品（products，服务、技术和工具）和伙伴（partners，供应商、制造商和厂商）。这些在图\
  \ 7.3 中显示。服务设计必须考虑四个 P 中的每一个，以确保满足要求的稳健设计。\n\n![图像显示了一个维恩图，四个圆分别代表人员、产品/技术、伙伴/供应商和过程，中心圆写着“四个\
  \ P”。](img/00029.jpeg)\n\n[图 7.3] 四个 P\n\n#### 人员\n\n如果需要使用或支持设计的人没有经过充分准备，最好的技术设计也会失败。服务设计中的人员元素确保了人为因素不被忽视。人既是资源（你需要正确数量的人），也是能力（你需要具有正确技能的正确的人）。服务设计师必须考虑需要多少人员来支持新服务（资源），以及他们有效地完成工作需要什么技能组合（能力）。使用该服务的人还需要在使用方法方面的培训，以获得服务的全部收益。\n\
  \n### 过程\n\n第二个要考虑的元素是过程。除了 ITIL 框架中描述的服务设计过程外，新服务可能设计额外的过程，例如授权或采购过程。作为服务设计的一部分，过程应该被记录，以及它们与其他过程之间的接口。应该对整个生命周期中的所有现有过程进行评估，以确定是否需要对其进行任何更改，以使此新或变更的服务能够投入运行并获得支持。\n\
  \n### 产品\n\n\n\n\n产品不仅是指由服务设计阶段本身产生的服务，还包括为了辅助设计或后期支持服务的选和工具。例如，某项服务设计可能是针对在线购物服务的，而其他产品可能包括信用卡处理应用程序、库存水平达到阈值时的自动补货服务、当用户响应时间超过设定时间时向服务提供者发出警的监控工具等。\n\
  \n##合作伙伴\n\n合作伙伴是指提供整体服务部分内容的专业供应商——通常是外部第三方供应商、制造商和供应商。确保选择正确的供应商至关重要，因为供应商的失败可能导致\
  \ IT 服务提供者违反约定的服务水平。外部供应商通过 `supplier management`（供应商管理）过程进行管理，该过程确保了必要的合同到位，并根据合同条款监控供应商的交付情况。供应商管理详见第\
  \ 19 章。\n\n## 整体性与平衡的服务设计\n\n在设计新服务或对现有设计进行修改时，仅关注服务解决方案是不够的；还需要考虑其他方面。设计过程必须采用**整体方法**来设计新服务或变更的服务，因为成功不仅取决于技术解决方案，还取决于该方案运行所需的管理和架构环境、确保其有效运行所需的流程和技能，以及监控和管理该服务所需的指标。为了使服务设计过程有效，设计的每个基本要素都必须被考虑在内。整体方法考虑了设计的五个方面；我们在“服务设计的五个方面”中将检查这些方面。ITIL\
  \ 推荐的**集成化方法**可确保服务的开发、其在生命周期内的任何变更以及最终的退役在不产生不可预见后果的情况下实现。它还确保了服务交付所需的功能和质量。每项设计都是所需资源、可用时间和预期功能之间平衡的结果。例如，具有高功能的服务将需要大量的资源或大量的时间来开发。\n\
  \n## 结构化的服务设计方法\n\n服务设计中有许多需要完成的活动。管理所有活动并满足时间、预算和质量标准的交付具有挑战性，这需要一种正式且结构化的方法。这种方法将有助于以合理的成本、效用和保证，在合适的时间范围内交付新服务。\n\
  \n此类方法及其组成阶段的示例见 `图 7.4`，以及在此过程中需要涉及的其他主要领域。这是一个复杂的图表；请花时间充分理解它。\n\n![图表显示了新服务与业务需求的对应关系，内容包括设计和开发、项目（SAC）、策略、设计、过渡、运营（SLM,\
  \ SLR，试点和上线 SLA）、改进、变更管理等。](img/00030.jpeg)\n\n`图 7.4` 将新服务与业务需求对接\n\nCopyright\
  \ © AXELOS Limited 2010\\. 保留所有权利。根据 AXELOS 的许可复制。\n\n`图 7.4` 显示了服务从初始或变更的业务需求到设计、过渡和运营阶段的生命周期。\n\
  \n首先，我们看到服务如何流过设计和开发阶段，进入试点，最后上线运行。项目团队参与前两个阶段，但未参与上线运营阶段。我们可以看到全程 `service level\
  \ management`（服务水平管理）和 `change management`（变更管理）过程的参与，以及服务过渡中的 `release and deployment\
  \ management`（发布和部署管理）过程。\n\n我们可以看到业务需求如何转化为服务验收标准。记录的需求和服务水平需求是在策略和设计生命周期阶段产生的。\n\
  \n随着解决方案的设计、开发和构建，业务需求持续输入这些阶段，允许纳入任何变更（如果已达成一致）。`SLRs` 和 `SACs` 将被更新以适应变更的需求。`SLRs`\
  \ 由业务部门和服务提供者最终并达成一致。随后在过渡阶段根据这些标准对服务进行测试并部署。在所有阶段，运营人员和项目人员之间进行有效的知识传递非常重要，以确保图中所示的每个阶段顺利进行。\n\
  \n图中还说明了项目团队在向业务交付新和变更 IT 服务这一活动中的角色，以及其与设计活动的关系。这种方法必须是迭代且增量的，以确保服务能够满足业务在业务流程开发和\
  \ IT 服务生命周期发展过程中不断变化的业务需求。可能需要分配额外的项目经理和项目团队来管理生命周期内部署新服务的各个阶段。\n\n## 服务设计的五个方面\n\
  \n如前所述，有效的服务设计取决于对五个关键方面的整体方法。我们需要确保这五个方面的每一个方面都考虑了预期的业务结果和计划结果，以便交付的最终服务符合客户和用户的预期。你可能会发现缩写\
  \ `STAMP` 有助于记忆这些内容——解决方案（Solutions）、工具（Tools）、架构（Architecture）、测量（Measurements）、流程（Processes）：\n\
  \n*   解决方案的设计\n*   管理服务所需的服务管理系统和工具\n*   服务将使用的管理和技术架构\n*   所需的测量系统、方法和指标\n*   支持服务运行所需的流程\n\
  \n在你的基础学习中我们已经考虑过这五个方面。关键方面是设计新的或变更的服务解决方案以满足不断变化的业务需求。每个新解决方案都必须经过检查，以确保它符合这五个方面并能与其他服务成功对接。让我们逐一查看每个方面；更多信息可以在\
  \ ITIL 服务设计出版物中找到。\n\n### 设计服务解决方案\n\n第一个方面是设计服务解决方案。服务解决方案的设计应包括以下内容：\n\n*   分析已约定的业务需求\n\
  *   审查现有的 IT 服务和基础设施，以识别可能的替代解决方案，或可以在新设计中复用的组件\n*   设计解决方案，涵盖所需的特性和功能（即效用 utility）以及非功能保证需求\n\
  *   确保设计将交付所需的信息，以便使服务或过程得到充分的监控、测量和改进\n*   处理任何受影响业务流程的需求，确保设计考虑了依赖关系、优先级、关键性和服务的影响\n\
  *   确保设计将满足验收标准，包括服务水平需求和服务水平目标（即保证需求 warranty），并且设计将提供所需的服务衡量和指标\n*   理解所需的时间范围以及新服务如何影响现有服务\n\
  *   规划服务的测试，包括任何用户验收测试 (`UAT`)\n\n\n\n\n\n# 将新服务集成到整体服务管理系统中\n\n## 管理信息系统与工具的设计\n\
  \n管理信息系统和工具的设计是服务设计的第二个方面。这些系统和工具对于服务在整个生命周期内的管理至关重要。管理信息系统通常是一个被称为管理系统的更大型框架的一部分。示例包括质量管理系统、信息安全管理系统以及整体服务管理系统。\n\
  \n服务管理系统可能包括服务目录、配置管理系统 (`CMS`)、容量管理信息系统 (`CMIS`)、可用性管理信息系统 (`AMIS`)、安全管理信息系统 (`SMIS`)\
  \ 以及供应商和合同管理信息系统 (`SCMIS`)。\n\n## 管理与技术架构\n\n架构设计可以被视为 IT 基础设施开发和部署的蓝图，以满足业务当前和未来的需求。在这种背景下，架构被为系统的基础组织——即其组件之间以及与环境的关系，以及引导其设计和演变的原则。它可以被认为涵盖服务、应用、数据/信息和基础设施架构。让我们逐考虑这些不同的架构。\n\
  \n**服务架构**：将应用程序、基础设施、组织和支持活动转化为一组服务。在不改变服务本身的情况下，这些架构可能会发生变化。它包括服务本身、其整体集成以及对这些服务的管理。\n\
  \n**应用架构**：将业务和功能需求映射到应用程序上，并显示应用程序之间的相互关系。\n\n**数据/信息架构**：描述企业的逻辑和物理数据资产以及数据管理资源。它展示了如何为了企业的利益而管理和共享信息资源。\n\
  \n**IT 基础设施架构**：描述支撑整体架构的组件结构、功能和地理分布，以及适用于它们的技术标准。\n\n**环境架构**：描述环境控制的所有方面、类型、水平及其管理。\n\
  \n**技术架构**：包括应用程序和系统软件；信息、数据和数据库；基础设施设计。\n\n## 过程\n\n服务设计的下一个方面是过程设计。过程是为了实现特定目标设计的结构化活动集合。它接收一个或多个输入并将其转换为定义的输出。过程定义应包含可靠交付输出所需的角色、职责、工具和管理控制。如果需要，定义还可能定义或修订策略、标准、指南、活动、过程、程序和工作指导书。\n\
  \n每个过程都应该由一个过程所有者拥有，该所有者应对该过程及其改进负责，并确保该过程符合其目标。服务设计应协助过程的设计，以确保过程之间的一致性并实现过程之间的集成。\n\
  \n## 测量系统与指标\n\n服务设计的五个方面中的最后一个是测量系统和指标的设计。为了管理和控制过程和服务，你必须对它们进行监控和测量。在选择测量、指标以及产生这些指标的方法时应谨慎。这是因为所选的指标和测量实际上会影响并改变被测量者的行为，特别是当这涉及目标、个人和团队绩效以及绩效相关的薪酬方案时。因此，你应该只包含鼓励朝着实现业务目标或预期行为变化进展的测量。\n\
  \n测量应当：\n\n- “符合用途”，提供所需的信息。\n- “符合使用需求”——不要设计过度或设计不足。\n- “一次性做对”，并尽可能减少重做工作。如果测量的基准被不断调整，将引发对结果有效性的质疑，并使无法建立任何趋势趋势。\n\
  - 反映业务和客户的视角。\n- 反映交付的解决方案满足业务识别并认可的需求的能力。\n\n可以使用四种指标来衡量过程的能力和性能：这些指标衡量：\n\n- 进度——即过程能力中的里程碑和交付物。\n\
  - 过程对治理要求的合规性，以及人员对过程使用的合规性。\n- 过程有效性及其交付正确结果的能力。\n- 效率——过程的生产力、速度、吞吐量和资源利用率。\n\n\
  ### 服务设计包\n\n服务设计负责为这五个不同方面的设计、过渡及后续运行创建计划。这些计划应涵盖方法、时间表和资源需求；组织和技术影响；风险；商业方面；培训需求以及适当的通信方法。这种规划的输出记录在服务设计包\
  \ (`SDP`) 中，该包由设计协调过程汇编，并是该过程的输出。`SDP` 应包含后续解决方案或服务测试、引入和运行所需的所有内容。这应该包括产生一套服务验收标准\
  \ (`SAC`)，该标准将用于确保服务提供商准备好在现场环境中交付并支持新服务或更改的服务。\n\n## 设计协调与其他与 PPO 相关过程的接口\n\n正如你预期的那样，与生命周期相邻阶段的主要接口是通过使用\
  \ IT 策略和服务目录中包含的信息进行服务策略制定，以及通过 `SDP` 移交服务解决方案的设计以进行服务过渡。\n\n设计协调与其他各个过程之间的接口有很多，因为这是服务设计这一生命周期阶段的关键协作过程。设计协调过程与所有服务设计过程衔接，包括可用性、容量、连续性和安全性（“保证”过程）以及需求管理；我们已经在第\
  \ 8 章和第 9 章涵盖了这些主题。其他接口包括：\n\n- 服务目录管理，提供服务章程、业务需求、实用性和保证需求、风险和优先级。\n- 变更管理，产生变更请求并与设计协调协作定义与变更相关的设计策略和实践。大型变更通过服务策略和服务目录管理进行；较小变更直接从变更传递到设计协调。设计协调提供与变更相关的设计里程碑更新，变更管理在定义点授权后续操作，确保所需操作已执行并符合质量标准。变更的实施后评审为设计协调的可能改进提供了价值反馈。\n\
  - IT 服务财务管理，提供预算信息和价值主张的细节。\n- 业务关系管理，提供有关业务所需结果、客户需求和优先级的信息。\n\n\n\n\n*   过渡规划与支持，接收来自设计协调的\
  \ `SDP`，并在过渡到设计协调在设计阶段的角色中扮演着类似的角色。\n*   IT 服务策略管理，提供当前和演进的服务策略信息，从而确保设计协调的指南和文档随时间推移与策略保持一致。\n\
  *   发布与部署管理，计划并执行单个授权的变更、发布和部署。发布和部署的规划与设计在服务设计阶段进行。设计协调将此规划与其他服务设计活动相结合，该计划构成了整体\
  \ `SDP` 的部分。\n*   服务验证与测试，计划并执行测试以确保服务符合其设计规范。测试的规划和设计在服务设计阶段进行。同样，设计协调将此规划与其他服务设计活动相结合，该计划构成了整体\
  \ `SDP` 的部分。\n*   变更评估，确定服务变更的性能以确保其能够满足预期的需求。设计协调确保可用资源来执行评估：\n    *   `Service\
  \ level management` 定义并同意新服务或变更服务的 `SLRs`；这必须根据与设计协调协作开发的实践进行。\n    *   `Supplier\
  \ management` 与设计协调合作，确保供应商对设计活动的贡献得到妥善管理。`Supplier management` 将设计协调的协助下在服务设计期间管理供应商及其性能。\n\
  \n## 总结\n\n本章是对规划、保护和优化的介绍。它涵盖了核心指南中与服务优化、安全以及相关规划相关的实践。我们从服务设计和服务策略的角度出发，探讨了在生命周期背景下支持\
  \ `PPO` 的基本目的和目标，并探讨了服务设计在目的、目标、价值以及与其他 ITIL 生命周期阶段关系方面的核心概念。我们查看了服务设计的基本概念，特别是设计协调流程如何与与\
  \ `PPO` 相关的流程进行衔接。\n\n## 考试要点\n\n**理解“整体化服务设计”这一短语的含义。** 能够举出使用这种方法时需要考虑的方面的示例。\n\
  \n能够解释支持每个服务组件的人员、流程、产品和伙伴四个独立领域。理解设计需要涵盖这四个领域，并举例说明。\n\n**能够列出服务设计包（SDP）的典型内容。**\
  \ 理解为什么需要每项内容以及它们如何被使用。\n\n**了解服务设计的目的。** 其目的是设计 IT 服务，并配备必要的辅助 IT 实践、流程和策略，以实现服务提供者的策略。设计不仅关于技术设计，还考虑了其使用方式以及所需的流程。\n\
  \n**理解服务必须设计为适应未来的需求。** 服务应该是易于扩展或开发的，以便能够轻松扩展以满足变化的需求。\n\n**理解服务设计与业务变更之间的关系。**\
  \ 理解设计适当且创新的 IT 服务对于满足当前和未来约定的业务需求是必要的，但如果没有业务变更的发生，仅靠 IT 服务将无法产生业务成果。\n\n**能够列出并解释服务设计的五个方面。**\
  \ 能够命名并描述服务设计的五个方面（解决方案、管理系统、架构、流程和指标）以及它们为什么重要。\n\n**理解良好的设计如何为业务带来财务和其他其他收益。**\
  \ 通过确保设计符合业务需求并适应不断变化的需求，避免了完全重新设计服务的需要，从而最大限度地降低了总成本。\n\n## 复习题\n\n你可以在附录中找到复习题的答案。\n\
