  \ 7. 以下哪些项是供应商管理的职责？\n1. 与内部供应商谈判\n2. 与外部供应商谈判\n3. 按照合同要求监控交付情况\n4. 确保物有所值\n1. 仅\
  \ 1 和 2\n2. 以上所有\n3. 1, 2 和 3\n4. 2, 3 和 4\n\n### 8. 以下哪些项是 ITIL 中描述的供应商类别？\n1.\
  \ 战略型（Strategic）\n2. 运营型（Operational）\n3. 信任型（Trusted）\n4. 通用型（Commodity）\n1. 仅\
  \ 1 和 2\n2. 以上所有\n3. 1, 2 和 4\n4. 2, 3 和 4\n\n### 9. 供应商根据哪些因素进行分类以展示其优先级？\n1. 风险和重要性/价值和影响\n\
  2. 成本和重要性/风险和价值\n3. 风险和影响/价值和重要性\n4. 价值和成本/风险和概率\n\n### 10. 以下哪些陈述是正确的？\n1. 关于供应商策略的信息存储在\
  \ SCMIS 中。\n2. 供应商合同存储在 SCMIS 中。\n1. 仅陈述 1\n2. 仅陈述 2\n3. 两项陈述均正确\n4. 均正确\n\n# 第\
  \ 19 章\n\nIT 业务关系管理与财务管理\n\n本章讨论了以下 ITIL 服务范围和协议考试目标：\n\n* ![images](img/00005.jpeg)\
  \ IT 业务关系管理与财务管理\n* ![images](img/00005.jpeg) 每个流程将从以下方面进行讨论：\n    * 目的\n    * 目标\n\
  \    * 范围\n    * 价值\n    * 政策\n    * 原则和基础概念\n    * 流程活动、方法和技术\n    * 触发因素、输入、输出和接口\n\
  \    * 信息管理\n    * 角色和职责\n    * 关键成功因素和关键绩效指标\n    * 挑战\n    * 风险\n\n![images/00006.jpeg)\
  \ 业务关系管理确保服务提供者拥有有关业务所需成果、客户需求和优先级的必要信息，并在战略层面上作为与客户的接口。\n\nIT 财务管理（FMITS）是服务提供者（以及其他业务部门）计算、预测和跟踪与服务相关的成本和收入的过程。\n\
  \n本章涵盖每个流程的日常操作；其活动、方法、技术的细节；以及其信息管理。\n\n## 业务关系管理\n\n业务关系管理最初是一种角色，旨在确保业务在 IT 服务提供者内部有一个具名的联系人。随着时间的推移，该流程已趋成熟，成为成熟的服务管理方法中不可或缺的一部分。BRM\
  \ 现在被认为是一个独立的战略流程，而不仅仅是支持执行级服务水平管理的角色。\n\nBRM 流程在组织高管人员与服务提供者的战略管理之间提供了联系。\n\n###\
  \ 业务关系管理的目的\n\n该流程在 IT 服务提供者与客户的对齐方面起着重要作用。该流程的目的有两个：\n\n* 在服务提供者与客户之间建立关系，并通过持续审查业务和客户需求来维护这种关系。这种关系对于建立服务提供者与客户之间的业务关系至关重要。\n\
  * 识别客户需求并确保服务提供者现在和未来都能满足这些需求。BRM 是确保服务提供者能够理解随时间推移变化的业务需求的过程。这种关系还允许客户向服务提供者阐述服务的价值。\n\
  \n这种关系中最重要的概念之一是“预期”——客户对服务提供者能力的预期，以及服务提供者对客户需求的预期。客户的预期不要超过他们准备支付的至关重要，而 BRM 在这种沟通的管理中起着关键作用。\n\
  \n### 业务关系管理的目标\n\nBRM 的目标如下：\n\n* 确保服务提供者对客户的服务视角有清晰的理解，以便服务提供者能够对服务和资产进行排序。\n\
  * 确保客户满意度保持高水平，这将证明服务正在满足客户的需求。\n* 建立并维护客户与服务提供者之间的关系，能够理解业务驱动因素和客户。\n* 确保组织和服务提供者进行有效沟通，以便服务提供者意识到客户环境的任何变化。客户环境的变化对提供的服务产生影响。\n\
  * 识别可能影响服务类型、水平或利用率的技术变化或趋势。\n* 确保服务提供者能够阐述新或变更服务的业务需求，并确保服务继续满足业务需求并继续交付价值。\n*\
  \ 在业务部门之间发生服务使用冲突时提供调解。这可能是资源分配的冲突，也可能是特定部门对利用或更改功能的要求存在差异。\n* 建立一套管理客户投诉和升级的正式程序。\n\
  \n### 业务关系管理的范围\n\nBRM 的范围将取决于组织的性质和文化。如果组织与内部服务提供者合作，BRM 可能会在 IT 部门和业务部门的高级管理代表之间进行。在较大的组织中，你能够找到专门的业务关系经理，但在较小的组织中，该角色可能与其他管理职责相结合。业务关系经理将与客户代表合作，理解业务目标，并确保提供的服务与这些目标一致并支持这些目标。\n\
  \n\n\n\n\n如果外部服务提供商支持该组织，你通常会发现有一个专门的客户经理负责该流程，并将人员分配给某个客户，或一组具有相似需求的小型客户。由于外部服务提供商与业务之间的关系记录在合同中，因此其重点将放在通过提高客户满意度来实现合同价值最大化。\n\
  \n业务关系经理（BRM）的主要要求之一是专注于理解我们提供的服务如何满足客户的需求。该流程必须确保我们能够与客户有效沟通，以便理解他们的需求。我们应该考虑的一些关键领域如下：\n\
  \n*   我们需要考虑业务结果，以便理解客户想要实现的目标。\n*   我们需要了解客户如何使用我们的服务，以及向他们提供了哪些服务。\n*   我们需要考虑如何管理正在提供的服务，包括提供方面的责任、我们交付的服务水平以及所实现的服务质量。我们还应该考虑为了响应业务和\
  \ IT 计划而可能需要的任何变更。\n*   作为 IT 服务提供商，跟踪技术趋势和进展至关重要，这些可能会影响我们的服务交付。客户经常会听到新技术的，但不理解其影响。业务关系经理的责任是确保我们就如何更好地利用技术来交付服务价值进行沟通并提供建议。\n\
  *   我们需要衡量客户满意度水平，并对任何满意度的下降采取适当的行动计划。业务关系经理将是此类计划沟通和管理的关键人物。\n*   我们需要考虑未来如何优化我们为之提供的服务。\n\
  *   BRM 流程应该关注服务提供商向客户呈现的方式。这可能意味着与业务部门对接，以确保双方的承诺都已履行。\n\n为了成功执行 BRM 流程并考虑到所有这些因素，有必要与其他服务管理流程和职能合作。例如，将业务结果与服务相关联的能力是服务组合管理的一部分；服务水平管理提供有关服务水平及其实现情况的信息；服务资产和配置管理则将客户和服务所有者映射到基础设施、应用程序和服务上。\n\
  \n通常，其他活动（如项目管理）在需要有人与客户沟通时，会使用业务关系经理。沟通由业务关系经理完成，但它仍然是项目的一部分。业务关系经理的角色将在本章稍后部分进一步讨论。\n\
  \n这需要在 BRM 和其他服务管理流程之间识别出清晰的边界、关系和责任，因为存在巨大的混淆风险。业务关系管理应该关注客户与服务提供商之间的关系，以及客户满意度的实现，但其他服务管理流程应该关注服务本身以及它们满足特定要求的良好程度。\n\
  \n业务关系管理并没有忽略服务，但它应该专注于高层视角，即服务是否满足了业务需求，而不是特定的交付目标。同样，其他服务管理流程也没有忽视客户满意度这一方面，但它们应该专注于服务的质量以及如何满足客户期望。\n\
  \n这方面的例子是服务水平管理流程和 BRM 流程之间的区别。它们都与客户进行定期互动，并且都关注对服务和服务质量的持续评审和管理。但它们的目的不同，与客户交互界面的性质在内容和责任上也不同。这在表\
  \ 19.1 中清楚所示，该表是服务策略出版物的摘。\n\n| | 业务关系管理 | 服务水平管理 |\n| --- | --- | --- |\n| 目的 |\
  \ 基于对客户及其业务的需求，在服务提供商与客户之间建立并维护业务关系。识别客户需求（实用性和保证）并确保服务提供商能够满足这些需求。 | 与客户协商服务水平协议（保证条款），并确保所有服务管理流程、运营水平协议和底层合同都适用于服务水平目标。\
  \ |\n| 重点 | 战略性和战术性的——重点是服务提供商与其客户之间的整体关系，以及服务提供商将交付哪些服务来满足客户需求。 | 战术性和执行性的——重点是就新旧服务将交付的服务水平达成一致，以及服务提供商是否能够满足这些协议。\
  \ |\n| 主要衡量标准 | 客户满意度，以及客户更好地使用和付费服务的意愿的提升。另一个指标是客户是否愿意向其他（潜在）客户推荐该服务。 | 实现约的服务水平（这将带来客户满意）。\
  \ |\n\n表 19.1 BRM 与服务水平管理之间的区别\n\n业务关系管理还涉及服务的设计，这使其成为服务提供商所有部门与客户进行战略沟通的理想接触。BRM\
  \ 与应用程序开发以及其他开发和设计领域存在潜在联系。\n\nBRM 与服务水平管理和其他服务管理流程之间存在许多联系和相似之处，这些角色通常是合并的。但正如你在表\
  \ 19.2 中看到的，各个流程的活动存在明显的差异，并且需要清楚地理解，在执行 BRM 时，个人需要意识到自己何时是在进行战略性业务关系，何时是在进行战术性工作。\n\
  \n| 场景 | 执行的主要流程 | 涉及的其他流程 |\n| --- | --- | --- |\n| 为拟议的新服务开发高层客户需求 | 业务关系管理 |\
  \ 服务组合管理 |\n| 为拟议的新服务构建业务案例 | 业务关系管理 | 服务组合管理 |\n| 确认客户对新服务的详细功能性需求 | 设计协调 | 业务关系管理\
  \ |\n| 确认客户对新服务可用性的需求 | 服务水平管理 | 业务关系管理、可用性管理 |\n| 建立业务活动模式 | 需求管理 | 业务关系管理 |\n\
  | 评估客户新服务请求的业务案例并决定通过/否 | 服务组合管理 | 业务关系管理、IT 服务财务管理 |\n| 根据服务水平报告服务性能 | SLM | 业务关系管理\
  \ |\n\n表 19.2 BRM 流程与其他服务管理流程\n\n### 价值\n\n\n\n\n\n业务关系管理通过与客户之间提供结构化的通信来传递价值。这使得服务提供者能够理解客户当前的业务需求，以及随着业务发展的未来需求。只有达到这种程度的理解，服务提供者才能确保其提供的服务正是业务所需要的。同时，这也能帮助客户理解服务提供者的观点以及其能够实际交付的内容。这种相互理解和信任的关系在出现困难问题时会有很大帮助。在这种情况下，BRM\
  \ 可以充当调解员，因为它受到了客户的信任，且不被认为偏袒服务提供者。有效的 BRM 鼓励客户和服务提供者作为战略伙伴通力合作。\n\nBRM 对客户满意度的关注使服务提供者和客户能够了解业务目标是否达成。虽然在没有\
  \ BRM 的情况下也可以提供服务，但 BRM 有助于确保服务在客户可以承受的范围内理解并持续提供客户所需的内容。\n\n## 策略、原则和基本概念\n\n接下来我们考虑\
  \ BRM 的一些策略、原则和基本概念。\n\nBRM 过程经常与业务关系经理的角色混淆。这是因为许多业务关系经理的角色比单纯的 BRM 过程要广泛得多。业务关系经理在参与\
  \ BRM 时，往往代表其他过程——例如，在获取有关客户需求和业务结果的信息时，供服务组合管理、需求管理和容量管理使用。\n\n关键概念中包括若干数据仓库。你之前在查看服务组合时已经见过这些内容：\n\
  \n*   客户组合（The customer portfolio）是一个数据库或结构化文档，用于记录 IT 服务提供者的所有客户。它是 BRM 对从 IT 服务提供处获取服务的客户的视图。它由\
  \ BRM 过程产生并被其他若干过程（如服务组合管理）使用。客户组合记录了服务提供者相对于每个客户的承诺、投资和风险。\n*   客户协议组合（The customer\
  \ agreement portfolio）是一个数据库或结构化文档，用于管理 IT 服务提供者与其客户之间的服务合同或协议。它是服务水平管理过程的输出，包含了为每个客户提供的每个\
  \ IT 服务的合同或其他协议。尽管它由 `SLM` 产生，但它是 BRM 的重要工具。\n*   合同或 `SLAs` 是针对每个客户分别进行谈判和管理的。对于内部服务提供者，`SLAs`\
  \ 由服务水平管理进行谈判和维护，并在存在的情况下涉及业务关系经理；而对于外部服务提供者，该过程涉及法律专家、服务水平管理和专门的业务关系经理。\n\nBRM\
  \ 在整个服务生命周期中工作，以理解客户的需求和期望，并确保它们得到满足或超越：\n\n*   在服务策略阶段，BRM 确保服务提供者理解客户的目标和整体需求。\n\
  *   在服务设计阶段，BRM 确保服务提供者已正确理解了客户的详细需求，并在情况并非如此时启动纠正措施。此外，BRM 将与服务水平管理协作，以确保客户对新服务的期望设定在适当的水平。\n\
  *   在服务过渡阶段，BRM 确保客户参与到影响其服务的变更、发布和部署活动中，确保他们的反馈得到了充分考虑。业务关系经理可能在 `CAB` 上代表客户，或者在适当的情况下安排客户参加\
  \ `CAB` 会议和变更评估会议。\n*   在服务运营阶段，BRM 与服务水平管理、事件管理和服务台合作，以确保服务根据合同或 `SLA` 交付，并可能很好作为升级程序的一部分。\n\
  *   在持续服务改进阶段，BRM 监控服务报告，并频繁获取有关客户满意度水平、服务水平异常或客户特定请求或投诉的更新。通过与其他过程和职共同工作，BRM 将帮助识别适当的补救措施并与客户达成一致。\n\
  \n业务关系管理涉及定义和澄清对服务的需求。客户有时可能会请求特定的解决方案，而该方案可能不是最有效的。BRM 需要关注客户所需的成果和价值，然后反向定义服务。\n\
  \n业务关系管理使服务提供者能够参与到有关客户业务的战略讨论中。BRM 还确保将有关客户战略方向的相关信息传回给服务提供者组织内部适当的流程和人员。\n\n##\
  \ 过程活动、方法和技术\n\nBRM 过程本身由服务生命周期每个阶段的活动组成，而不是单一的端到端过程。执行的特定活动将取决于导致服务提供者或客户启动该过程的情况。该过程在整个服务生命周期与许多其他服务管理过程对接。业务关系管理不是一个具有起点和终点的单一端到端过程。相反，它由若干相互关联的关键活动组成。图\
  \ 19.1 显示了过程活动。\n\n![图像显示了 BRM 活动，如服务提供者（服务组合管理、需求管理等）、BRM（服务策略、设计、过渡等）和客户（机会、变更请求、投诉和赞誉），它们是相互关联的。](img/00094.jpeg)\n\
  \n图 19.1 BRM 活动\n\nCopyright © AXELOS Limited 2010\\. 版权所有。材料根据 AXELOS 的许可复制。\n\n\
  BRM 过程由客户或服务管理过程和职能启动——通常是通过联系业务关系经理。对于客户而言，BRM 为客户提供了一种与服务提供者沟通其需求、机会和要求的方式，并能以正式、有组织的方式处理这些需求。\n\
  \n业务关系经理应该记录所有机会、请求、投诉和赞誉，以确保它们得到跟进，而不是遗落在不同的过程和职能之间。如果服务提供者需要客户的输入，或者需要启动创建新服务或对现有服务的更改，也可以启动\
  \ BRM 过程。\n\n### 服务策略\n\nBRM 致力于应用策略、策略和计划，以协调服务提供者的过程与客户需求及机会。策略管理将识别关键市场空间和业务机会。BRM\
  \ 将确保这些内容从客户角度得到适当的定义和执行。\n\nBRM 将与其他服务策略过程协作：\n\n*   与 IT 策略管理协作，了解请求是否符合策略\n*\
  \   与服务组合管理协作，决定是否需要新服务，或是否可以利用现有服务\n*   与 IT 服务财务管理协作，了解如何进行资金支持\n*   与需求管理协作，了解业务活动的模式\n\
  \n### 服务设计\n\n\n\n\n\n在服务设计阶段，`BRM` 将致力于确保服务的详细设计和开发持续满足客户需求，并确保其对于已定义的业务结果是有效的。\n\
  \n`BRM` 将参与的主要活动和流程如下：\n\n*   项目管理（通过与客户联系）\n*   财务管理（BRM 确保成本与预期投资一致）\n*   服务水平管理（BRM\
  \ 将帮助定义 SLA）\n*   需求管理（BRM 将确认业务活动模式）\n*   服务清单目录管理（BRM 将帮助定义目录条目）\n*   可用性管理（BRM\
  \ 将确切确定服务何时需要处于可用）\n*   容量管理（BRM 将识别性能需求）\n*   IT 服务连续性管理（BRM 将与客户一起识别业务影响和恢复目标）\n\
  \n## 服务过渡\n\n在服务过渡阶段，`BRM` 将协调客户参与到服务过渡期间活跃的流程中。它还负责确保所有的变更和发布都符合客户设定的需求。\n\n`BRM`\
  \ 将参与的主要流程如下：\n\n*   变更管理（BRM 的角色是代表客户）\n*   知识管理（确保在正确的时间将正确的信息传递给正确的人）\n*   服务测试与验证（协调用户验收测试）\n\
  *   发布与部署管理（确保最小干扰）\n*   变更评估（记录并协调由评估产生的任何行动）\n\n## 服务运营\n\n在服务运营阶段，仍然需要 `BRM`。首先，客户对服务的使用会随时间推移而变化，`BRM`\
  \ 将此反馈给服务提供商。其次，虽然服务台能够处理大多数事件和请求，但某些情况需要更高水平的参与和沟通，这正是 `BRM` 所提供的。\n\n`BRM` 将参与的主要流程如下：\n\
  \n*   `Request Fulfillment` `BRM` 可能是请求某些服务的联系点。\n*   `Incident Management` `BRM`\
  \ 通常在重大事件期间参与，为客户提供专注的沟通。`BRM` 为事件管理提供业务信息，这将有助于评估事件的相对优先级。\n\n## 持续服务改进\n\n在持续服务改进（CSI）阶段，`BRM`\
  \ 通过识别改进机会，并协调服务提供商和客户的活动来促进这些改进。`BRM` 还会开展客户满意调查，这对于识别改进领域和新机会至关重要。`BRM` 衡量客户满意度，并将服务提供商的绩效与客户满意目标以及之前的得分进行比较，通常通过定期调查进行。`BRM`\
  \ 调查关注服务是否在每个层面都实现了其目标，而不是单个事件的日常处理。\n\n满意度的显著波动或下降趋势应与客户进行调查和讨论，以了解其原因。看似异常的结果应进行调查以识别其他可能的原因。任何改进机会都应记录在\
  \ `CSI register` 中，并结合服务水平管理进行后续审查和优先级排序。\n\n## 触发因素\n\n`BRM` 的触发因素包括：\n\n*   启动了新的战略倡议、新服务，或对现有服务的更改。\n\
  *   识别了新机会，或由服务组合管理授权了一项服务。\n*   其他触发因素可能是客户的请求、建议或投诉，或者已安排客户会议或客户满意度调查。\n\n###\
  \ 输入\n\n`BRM` 的输入包括：\n\n*   客户需求、请求、投诉、升级或赞扬\n*   服务策略以及在可能的情况下的客户策略\n*   服务和项目组合、SLA\
  \ 和 RFC\n*   验证由需求管理定义的业务活动模式或用户配置的请求\n\n### 输出\n\n`BRM` 的输出包括：\n\n*   利益相关者定义、定义的业务结果以及资助（内部）或支付（外部）服务的协议\n\
  *   用于策略、设计和过渡的客户组合和服务需求\n*   客户满意度调查及其结果\n*   客户在各种服务管理流程活动中的安排以及培训和意识活动的安排\n*\
  \   关于客户对服务性能感知的报告\n\n### 接口\n\n与 `BRM` 的主要接口包括：\n\n*   IT 服务战略管理与 `BRM` 紧密合作，根据从客户收集的信息识别市场空间。`BRM`\
  \ 还收集战略需求和期望的业务结果，并确保资金（内部）或寻求交易（外部）。\n*   服务组合管理与 `BRM` 协作，识别创建服务模型和评估建议服务所需的更详细的需求和客户环境信息。\n\
  *   IT 服务财务管理获取客户财务目标的信息，并帮助服务提供商理解客户愿意接受的资金水平或定价。\n*   需求管理与 `BRM` 协作，识别并验证业务活动模式和用户配置。`BRM`\
  \ 还会识别这些模式的更改或特定业务活动的优先级。\n*   服务水平管理使用 `BRM` 收集的客户信息和服务需求，理解客户对服务性能和交付物的优先级。在与客户进行的服务审查期间同意的行动将由\
  \ `BRM` 协调和监控，无论这些行动适用于客户还是服务提供商。\n*   容量和可用性管理依赖通过 `BRM` 收集的业务结果和服务需求信息。`BRM` 还会验证建议的性能和可用性水平是否会被客户接受。\n\
  *   `BRM` 为 IT 服务连续性管理提供业务优先级和结果信息，并确保应对措施、恢复计划和测试能够准确反映客户的世界。\n*   服务清单目录为通过 `BRM`\
  \ 发起的大许多讨论、审查和请求提供了基础。\n*   `BRM` 往往是变更请求的起点，并将参与评估变更的影响和优先级。\n*   `BRM` 确保客户在发布与部署管理以及服务验证与测试过程中具有适当水平的参与度。\n\
  *   `BRM` 与 `CSI` 有着强力的接口，因为服务改进和七步改进流程是 `BRM` 的重要部分。`BRM` 将与服务水平管理相结合，与客户验证、优先排序并沟通改进机会和计划。\n\
  \n## 信息管理\n\n我们探讨了有效 `BRM` 所需的一些文档和信息，特别是服务组合、项目组合和应用组合。这些重要信息源记录了当前和未来的服务，并被 `BRM`\
  \ 用于促进客户与服务提供商之间的有效沟通。`BRM` 确保客户组合和客户协议组合得到维护。\n\n\n\n\n\n客户满意度调查是另一个重要信息来源。`BRM`\
  \ 过程确保调查涵盖了服务的相关方面，并以公平、一致和客观的方式进行，以确保结果能够准确反映客户满意度。调查结果还需要被存储，以便识别趋势并衡量相对于基准的进展情况。\n\
  \n服务目录是另一个重要的参考依据，用于与客户沟通可用服务。\n\n## 业务关系管理过程角色\n\n本节描述了为支持 `BRM` 过程而需要执行的若干角色。与其他章节中描述的针对特定过程的角色一样，这些是针对第\
  \ 1 章“运营支持与分析介绍”中描述的适用于整个服务生命周期的通用角色的特定额外要求。\n\n### 业务关系经理\n\n许多组织会有职位名称为 `business\
  \ relationship manager` 的的人员。这一职位可能将 `BRM` 过程所有者和 `BRM` 过程经理的角色合并，并分配给一个人。\n\n`business\
  \ relationship manager` 也用于描述在 `BRM` 内部工作的若干员工，每人关注不同的客户细分或群体。在某些组织中，这一角色可能与服务水平经理的角色相结合。\n\
  \n在某些组织中，业务关系经理的角色和 `BRM` 过程可能会混淆。由于业务关系经理与客户对接，他们经常参与其他过程的活动；然而，这使得这些活动成为 `BRM`\
  \ 过程的一部分。\n\n### 业务关系管理过程所有者\n\n`BRM` 过程所有者的职责通常包括：\n\n- 执行 `BRM` 过程的通用过程所有者角色\n\
  - 与其他过程所有者合作，确保在 `BRM` 的设计和实施方面采用整合的方法\n\n### 业务关系管理过程经理\n\n`BRM` 过程经理的职责通常包括：\n\
  \n- 执行 `BRM` 过程的通用过程经理角色\n- 识别客户需求，并确保通过适当的服务目录满足这些需求\n- 与客户合作，使其期望与其意愿支付的金额之间取得平衡\n\
  - 在同意交付服务之前，确保服务提供者理解需求并能够在要求的水平交付服务\n- 通过确保服务提供者满足客户需求，以确保高水平的客户满意度\n- 基于对客户及其业务驱动因素，在服务提供者与客户之间建立并培养建设性的关系\n\
  - 理解客户环境的变化对提供的服务类型、水平或利用率的影响\n- 理解技术趋势对所提供服务的类型、水平或利用率的影响\n- 为新服务或现有服务的变更建立并传达业务需求\n\
  - 对由于不同业务部门对服务的的需求冲突而产生的争议进行调解\n\n### 客户/用户\n\nIT 服务的客户和用户是 `BRM` 的另一端。他们需要在与 `BRM`\
  \ 的互动中发挥作用，确保他们的需求得到理解。成功的关系需要双方的投入，客户的参与将有助于确保支持业务成果。\n\n## 关键成功因素和关键绩效指标\n\n最后，我们考虑此过程的\
  \ `CSFs` 和 `KPIs`。以下是 `BRM` 的 `CSFs` 和 `KPIs` 的示例：\n\n- 关键成功因素：记录和理解客户对服务的需求及其希望实现的业务结果的能力。\n\
  \    - `KPI`: 业务结果和客户需求已记录并获得客户确认，作为服务组合管理和服务设计过程的输入。如果存在并实现了这一 `KPI`，则实现了 `CSF`。\n\
  - 关键成功因素：为新服务或现有服务的变更建立并阐述业务需求的能力。\n    - `KPI`: 每项新服务都有由业务经理和员工定义的完整需求集，且这些需求在策略、设计和过渡阶段已获得业务和\
  \ IT 领导的确认。\n    - `KPI`: 服务变更的原因、预期结果和详细需求已在策略、设计和过渡阶段进行记录并获得确认。\n\n### 挑战\n\n\
  `BRM` 面临的挑战包括：\n\n- 不仅仅将 `BRM` 视为处理客户满意度水平的手段。`BRM` 需要参与定义服务，并跟踪其是否按照指定的服务水平进行交付。\n\
  - 另一个挑战可能是克服过去糟糕服务的历史，这意味着 `BRM` 难以获得任何信誉。这有时导致客户不愿分享需求、反馈和机会。\n- 业务关系经理的角色与 `BRM`\
  \ 过程之间可能存在混淆。虽然业务关系经理经常因为其面向客户的职位而被执行其他过程的活动，但这并不使这些活动成为 `BRM` 过程的一部分。\n\n### 风险\n\
  \n业务关系管理风险包括：\n\n- 关于 `BRM` 与其他过程之间界限的混淆。这可能导致重复劳动，或者某些活动可能被忽视。例如，在重大事件期间，事件经理可能会收到来自\
  \ `BRM`、服务水平管理等多个电话。明确这些界限至关重要。\n- 面向客户的过程（如 `BRM`）与关注技术的过程（如容量管理）之间的脱节。两者对于成功都至关重要，并且需要适当的整合。\n\
  \n## IT 服务财务管理\n\n组织必须能够管理其财务，但这是一个贯越整个组织的复杂过程。它通常由一位非常高级的高管拥有，并作为一个独立的业务职能进行管理。这是一个极其重要的领域，允许组织管理资源并确保其目标的实现。\n\
  \nIT 服务提供者作为整个组织的一部分，必须参与财务管理过程。确保所有财务实践保持一致是一关重要的；尽管可以使用独立的过程，但它应该遵循组织的整体原则和要求。\n\
  \n### IT 服务财务管理的目的\n\n为了设计、开发和交付满足组织需求的服务，我们必须获得适当的资金支持。这是 IT 服务财务管理的主要目的。同时，财务管理过程应作为\
  \ IT 服务支出的守门员，确保服务提供者在交付所需服务时财务上不会过度负荷。显然，这需要在服务的成本和质量之间取得平衡，与服务提供者与其客户之间的供需平衡相一致。\n\
  \n成本和质量是提供服务的关键因素，我们分配和理解服务提供成本的唯一方法是通过稳健的财务实践。\n\n### IT 服务财务管理目标\n\n财务管理过程的目标包括：\n\
  \n\n\n\n\n*   定义并维护一个财务框架，使服务提供者能够识别、管理和沟通服务交付的实际成本。\n*   理解并评估任何新或变更的组织策略对服务提供者的财务影响和意义。\n\
  *   确保为提供约定的服务所需的资金。这一过程需要业务部门大量的投入，并取决于组织内部财务管理和内部结算的整体方法。\n*   促进对服务和客户资产的良好管理，以确保组织实现其目标。这应该通过与服务资产配置管理以及知识管理的合作来实现。\n\
  *   就支出与收入之间的关系进行基础财务会计处理，并确保这些根据组织的整体财务政策保持平衡。\n*   代表利益相关者对服务提供的开支进行报告和管理。\n*\
  \   管理和执行组织与财务控制相关的政策和实践。\n*   确保将财务控制和会计实践应用于服务的创建、交付和支持中。\n*   理解组织未来的财务需求；为服务承诺提供财务预测，并满足法律和法规控制的任何合规性要求。\n\
  *   在适当的情况下，定义一个允许从客户处收回服务交付成本的框架。\n\n## 财务管理的范围\n\n财务管理是任何组织中广为人认可的活动，但管理与 IT 服务提供相关的资金的具体要求可能还没有那么完善。\n\
  \n理解与 IT 服务提供相关的所采用战略方法至关重要。它将如何被管理；是内部还是外部来源？如果是内部提供，是否需要对服务进行内部结算，或者是否有其他成本回收机制？\n\
  \n在大多数组织中，合格的会计师负责公司财务，通常作为财务部门的一部分。他们将为业务制定政策、标准和会计实践。与 IT 资金相关的策略将是整体会计方法的一部分，但具体细节可能作为\
  \ IT 部门的一部分进行本地管理。\n\n参与 `FMITS` 的人员必须确保这些实践与公司控制一致，并确保报告和会计活动符合整个组织定义的治理标准。遵守这些标准还将帮助各个业务单元通理解\
  \ IT 资金的来源。在整个组织范围内进行内部资金实践的沟通和报告，对于真实理解 IT 服务的成本至关重要。\n\n使用服务管理方法来交付服务意味着 IT 服务的会计处理将更加有效、详尽和高效。在内部服务提供者中，这将实现服务提供者与业务之间的信息转换。\n\
  \n财务管理由三个主要过程组成：\n\n**预算编制** `Budgeting` 是预测和控制组织内部资金收入和支出的过程。`Budgeting` 包括一个周期的循环（通常为每年一次）谈判以设定预算，以及对这些预算的支出进行每月监控。\n\
  \n**会计** `Accounting` 是一个让 IT 组织能够对其资金支出方式进行充分核算的过程。它应该能够按客户、服务、活动或其他因素进行成本分解，以证明资金的分配情况。它通常需要某种形式的会计系统（总账、会计科目、日记账等），并应由具有会计资格或技能的人员管理和监督。\n\
  \n**收费** `Charging` 是为向客户收取服务费所需的流程，且仅适用于组织会计模型要求执行此操作的情况。它需要健全会计实践和支持系统，以确保任何内部结算都是准确且可追踪的。\n\
  \n与财务管理相关的周期见表 19.3。这二周期是：\n\n*   计划周期（年度），其中成本预测和工作量预测形成成本计算和价格定价的基础\n*   运营周期（每月或每季度），其中根据预算对成本进行监控和检查，发布账单并收集收入\n\
  \n| 频率 | 预算编制 | IT 会计 | 收费 |\n| --- | --- | --- | --- |\n| 计划（年度） | 同意总支出 | 为每个\
  \ IT 资源建立标准单位成本 | 建立定价策略并发布价格表 |\n| 运营（每月） | 行动管理预算异常或成本变更 | 按成本中心监控支出 | 编制并发布账单\
  \ |\n\n**表 19.3** 预算编制、IT 会计和收费周期\n\n### 价值\n\n内部 IT 组织现在意识到他们与面向市场的公司非常相似。他们和任何其他业务一样，都有分析、包装、营销和交付服务的需求。他们共同且日益增长是理解并控制供需因素，并以最具成本效益的方式提供服务，同时最大化对相关成本结构的透明度。\n\
  \n健全的 `FMITS` 为服务提供者实现以下目标所需的信息：\n\n*   增强决策\n*   变更速度\n*   服务组合管理\n*   财务合规与控制\n\
  *   运营控制\n*   价值捕获与创造\n\n财务管理提供了产生策略或设计利用资产的方法以实现我们目标的信息。它使业务理解当前策略的财务结果——例如：\n\n\
  *   降价带来了更多业务吗？\n*   这些业务盈利吗？\n*   哪些服务对我们来说成本最高，为什么？\n*   与替代方案相比，我们的效率如何？\n* \
  \  我们可以在哪些方面进行改进？\n*   哪些领域应该优先进行 `CSI`？\n\n良好的财务管理为业务带来了许多具体的益处。它使业务能够遵守法律法规要求和公认的会计原则。这种合规性确保了业务合法运营，并且没有因不合规而被罚款的风险。通过理解成本，可以制定一份真实的预算，使可用资金足以覆盖服务成本。最后，业务拥有了关于\
  \ IT 的使用和投资做出明智业务决策所需的信息。\n\n健全的财务管理还确保在涉及 IT 服务收费时，内部服务提供者可以根据需要从业务部门收回全部成本。业务部门也将获得准备其自身预算所需的费用信息。外部提供者可以确保他们向客户收取足够的金额以覆盖成本并获得利润。最根本的是将\
  \ IT 服务与业务结果挂钩，确保所有的 IT 支出都有业务理由。\n\n## 政策、原则和基本概念\n\nIT 服务的财务管理应用了组织的财务管理政策。因此，它必须遵循整个政策和实践。影响\
  \ IT 服务提供者的政策可能包括：\n\n*   需要跟踪什么种水平的财务支出\n\n\n\n\n\n* 哪些配置项需要记录为财务资产以及应如何进行分类\n\
  * 固定资产如何进行折旧\n* 成本如何报告\n* 收入如何核算（并与 IT 服务关联）\n* 服务成本是进行单独核算，还是计算 IT 总成本并将其分摊回业务部门\n\
  * 符合法律或其他监管要求的要求\n\nIT 是利润中心还是成本中心，是组织高管层的一项政策决策。成本中心是一个分配了成本但不不对所提供的服务收费的业务部门或部门。它必须核算支出。利润中心是一个对所提供的服务收费的业务部门。创建利润中心的目标可能是盈利、回收成本或亏损运营。\n\
  \n## 资金\n\n资金是为特定目的或项目募集和分配资金。对于 IT 服务管理，资金是 IT 服务提供者用于支付 IT 服务设计、过渡、运营和改进的财务资源的手段。\n\
  \n资金来自两个来源：\n* 外部资金来自向外部客户销售服务所获得的收入。\n* 内部资金来自同一组织内部的其他业务部门。\n\n资金模型包括：\n* **滚动计划资金（Rolling\
  \ Plan Funding）**：滚动计划是针对固定月数、年份或其他周期的计划。在第一个周期结束时，计划只需额外延长一个周期。\n* **触发型资金（Trigger-Based\
  \ Funding）**：在这种模型中，当发生特定情况或事件时，会启动计划并提供资金。\n* **零基预算资金（Zero-Based Funding）**：大多数内部服务提供者使用这种模型进行资金，因为它基于确保\
  \ IT 实现收支平衡。IT 允许支出最高达到指定的预算金额，并在财务末（每月、每季度或每年）通过成本转移从其他业务部门收回资金。\n\n### 价值\n\n\
  服务经济学关乎于提供服务的成本、所实现成果的价值以及服务提供者通过服务能够获得的回之间的平衡。需要有效的 FMITS（财务管理与 IT 服务）流程来计算、预测和跟踪与待计算服务相关的成本和收入。只有通过清晰定义并正确执行的\
  \ FMITS 实践，才能计算服务的价值。价值的计算是服务提供者和客户的共同责任。他们需要对成本和回报的计算有共同理解，以便证明 IT 服务的价值。\n\n##\
  \ 合规\n\n合规性涉及证明正在采用适当且一致的会计方法和/或实践的能力。企业财务管理政策必须明确列出哪些法律或其他监管要求适用于服务提供者和客户组织。《巴塞尔\
  \ II》和《萨班斯-奥克斯法案》等法规对财务审计和合规活动产生了巨大影响。\n\n尽管这增加了成本，但监管合规往往能够改善数据安全和质量流程。\n\n## 流程活动、方法和技术\n\
  \n图 19.2 显示了财务管理流程。我们将检查会计、预算和收费的高级步骤。\n\n![图像显示监管要求、企业财务管理政策、服务管理流程等与会计、预算和收费连接，并流向服务估值、投资分析等。](img/00095.jpeg)\n\
  \n图 19.2 IT 服务财务管理的主要输入、输出和活动\n\nCopyright © AXELOS Limited 2010\\. 保所有权利。材料根据 AXELOS\
  \ 的许可复制。\n\n### 会计\n\n首先我们来看会计。会计是负责识别交付 IT 服务的实际成本、将其与预算成本进行比较，并管理与预算偏差的流程。会计还负责跟踪服务所赚取的任何收入。会计使服务提供者能够：\n\
  * 针对预算跟踪实际成本\n* 支持健全投资策略的开发，识别并评估从现代技术中获得的选项和灵活性\n* 为服务性能和交付提供成本目标\n* 促进资源使用的优先排序\n\
  * 在充分理解成本影响的情况下做出决策，从而使风险降至最低\n* 在需要时支持引入 IT 服务的收费\n* 审查之前战略决策的财务后果，以便组织能够学习和改进\n\
  \n一项重要的会计活动是创建成本模型。成本模型是一个框架，允许服务提供者确定提供服务的成本，并确保这些成本被正确分配。它帮助提供者理解拟议的变更对当前服务、客户和客户协议组合的影响。\n\
  \n会计还使服务提供者能够根据预算跟踪实际成本。它有助于支持健全投资策略的开发，并使提供者能够为服务性能和交付设定成本目标。服务提供者能够在充分理解成本影响的情况下做出决策，从而使风险降至最低。会计还支持在需要时引入\
  \ IT 服务的收费。它提供了审查之前战略决策财务后果的机会，以便组织能够学习和改进。\n\n### 预算\n\n我们查看的下一个高级流程领域是预算。预算是预测和控制资金支出的活动。预算由周期性谈判循环组成用于设定未来预算（通常是按年的）以及对当前预算进行常规监控和调整。\n\
  \n预算是调集实现组织战略和战术目标所需资源的机制。它回答了基本的业务问题，例如“我们是否有实现目标所需的资源，资源从哪里来？我们需要什么以及什么时候需要？”\n\
  \n预算通常以电子表格的形式记录，其中行表示支出项目，列显示支出发生的时间。该流程步骤可以总结为：\n* 分析上一次预算\n* 评估当前计划\n* 确保你理解资金和支出的任何变化\n\
  * 预估预计成本和收入\n* 制定预算\n\n### 收费\n\n最后我们来看收费。收费是对交付的服务收取费的活动。对于内部服务提供者来说，收费是可选的——服务提供者的成本可能由中央财务部门使用内部收费方法简单地重新分配回其他业务部门。这是组织的决策，而不是\
  \ IT 部门的决策。外部服务提供者必须对其服务收费，因为这是组织获取维持运营收入的来源。\n\n收费必须是简单、公平且现实的。观点认为，付费服务的客户可能更看重这些服务。他们可能还会质疑自己真正需要哪些服务。服务提供者必须决定哪些项目可以收费，以及如何收费——将使用哪些成本单位。\n\
  \n\n\n\n计费可以通过多种方式计算，例如按次服务收费、按人头收费或按处理量收费。各项项目的价格需要设定，这取决于提供者是寻求盈利、覆盖成本还是提供补贴服务。最后，由提供者负责发布账单并收取款项。\n\
  \n## 触发因素\n\nFMITS（IT 财务管理系统）的触发因素包括：\n\n* 强制性的月度、季度和年度财务报告周期，例如预算编制\n* 审计输出的建议或强制要求的改进措施\n\
  * 其他服务管理流程，这些流程可能会请求（例如）投资回报率数据的财务信息\n* 对新服务机会的调查\n* 为内部服务提供者引入 IT 服务收费机制，或为外部服务提供者确定服务价格的需求\n\
  * 变更请求，这将触发对变更成本的财务信息需求以及对变更产生的持续财务影响的需求\n\n### 输入\n\n我们之前讨论了过程输入。典型的输入包括：\n\n*\
  \ 法律法规或监管机构建立的策略、标准和惯例，以及组织财务经理施加的规定\n* 通用之会计原则 (`GAAP`) 及其局部变体\n* 所有存储财务信息的数据源，包括供应商数据库、配置管理系统、服务资产组合、客户协议组合、应用程序组合和项目组合\n\
  * 服务资产组合，它提供了服务的结构（这些服务将作为会计体系的基础，因为所有成本和收益最终以所提供服务的形式表示）\n\n### 输出\n\n接下来我们将查看财务管理的输出。我们之前讨论过这些内容，所以这里简要回顾一下：\n\
  \n**服务估值**：这是理解服务成本相对于业务价值的能力。\n\n**服务投资分析**：财务管理提供信息和历史记录，使服务提供者能够确定服务投资的价值。\n\n\
  **合规**：无论服务提供者位于何处，无论是内部还是外部，财务数据都受法规和法律限制。IT 服务财务管理有助于实施和执行政策，确保组织能够存储和归档财务数据，对其进行安全和控制，并确保将其报告给相关人员。\n\
  \n**成本优化**：成本优化的目标是确保投资与客户需求的服务水平以及预期收益水平相匹配。业务影响分析 (`BIA`) 涉及理解服务不可用对业务的影响。这使得业务能够对服务和业务连续性的投资进行排序。\n\
  \n**规划信心**：规划信心并非实物产出；它指的是服务利益相关者对服务提供者能够准确预测成本和收益的信心程度。\n\n### 接口\n\n所有服务管理流程都使用财务管理来确定流程本身的成本和效益。某些流程还利用它来支持其流程活动的执行。与\
  \ IT 服务财务管理的主要接口包括：\n\n* 策略管理与企业财务管理合作，确定组织的财务目标。它根据财务管理提供的信息定义预期的投资回报。财务管理将跟踪并报告\
  \ `ROI` 的实现情况。\n* 服务资产组合管理提供服务结构，用于定义成本模型、会计和预算系统，以及计费的基础。\n* 业务关系管理为财务管理提供有关业务如何衡量服务价值以及他们准备为服务支付多少费用的信息。\n\
  * 容量和可用性管理能够为 IT 服务财务管理提供关于技术方案选择和服务性能的宝贵信息。这反过来将用于计算成本。\n* 变更管理使用 IT 服务财务管理帮助确定变更带来的财务影响或需求。\n\
  * 服务资产和配置管理记录有关资产和配置项的财务数据。这些数据被用财务分析和报告的基础。企业财务管理还提供管理组织资产（如折旧）的政策。\n* 持续服务改进利用\
  \ IT 服务财务管理来确定改进措施是否值得投入。\n\n## 信息管理\n\n有效的财务管理所需的文档和信息来源包括：\n\n* 财务管理系统，如会计、预算和计费系统\n\
  * 外部实体定义的财务管理政策、法律法规，以及内部财务经理\n* 财务报告结构、模板和表格（例如预算），以及报告本身，它是与其他管理流程的主要输出\n* 组织的会计科目\n\
  * 服务知识管理系统\n\n## IT 财务过程角色\n\n本节描述了支持财务管理过程需要执行的若干角色。与其他章节描述的特定角色一样，这些是对第 1 章描述的整个服务生命周期中通用角色的特定要求。\n\
  \n许多组织设有 IT 财务经理的职位，该职位通常结合了 FMITS 过程所有者和经理的角色。\n\n### IT 服务财务管理过程所有者\n\nIT 服务财务管理过程所有者的职责包括：\n\
  \n* 执行 FMITS 过程通用所有者角色\n* 与其他所有者合作，确保 IT 服务财务管理的设计和实施具有集成性\n\n### IT 服务财务管理过程经理\n\
  \nIT 服务财务管理过程经理的职责包括：\n\n* 执行 FMITS 过程通用经理角色\n* 编制年度 IT 预算并提交 IT 指导小组审查和批准\n* 在每日、每月和每年范围内管理\
  \ IT 预算，并在需要时采取行动以平衡预算支出\n* 生成用于管理信息的定期报表，允许相关经理管理其所属预算领域\n* 制定并管理针对 IT 客户的收费系统\n\
  * 就 IT 内部所有重大活动、项目和拟议支出项目的价值报告\n\n### 预算持有者\n\n各种 IT 经理可能对其特定领域的预算负责。预算持有者的职责包括：\n\
  \n* 提交年度预算估计\n* 谈判并同意其年度预算\n* 持续管理预算\n* 定期报告预算活动和结果\n\n\n\n最后，我们将涵盖此流程的关键成功因素（CSF）和关键绩效指标（KPI）。我们将讨论一些示例；完整列表可以在\
  \ ITIL 服务策略出版物中的 FMITS（IT 服务财务管理）章节中找到。IT 服务财务管理的 CSF 和 KPI 示例包括：\n\n*   CSF：存在一个企业级的框架，用于识别、管理和沟通财务信息，包括服务的成本和相关的回报。\n\
  \    *   KPI：存在已建立的标准、政策和科目表，企业财务管理要求所有业务单元使用并遵守这些标准。审计将指示合规程度。\n    *   KPI：IT\
  \ 服务财务管理框架规定了如何对服务进行核算；定期提交报告并作为衡量服务提供商绩效的依据。\n    *   KPI：每个组织单元及时、准确地提交财务报告。\n\
  *   CSF：要求服务提供者能够核算在创建、交付和支持服务上所花费的资金。\n    *   KPI：服务提供者使用会计系统，且该系统配置为按服务报告成本。\n\
  \    *   KPI：提供有关设计、过渡和运行阶段服务成本的定期报告。\n\n### 挑战\n\nFMITS 面临的挑战包括：\n\n*   开发有效的财务报告和成本模型，重点应放在基础设施和应用程序的成本而非服务的成本上，否则将很难传达服务的价值。\n\
  *   确保 FMITS 在必须遵守企业标准和政策的同时，其科目表和报告应适用于 IT 服务提供商。\n*   抵制组织对成本节约而非成本优化的关注，这导致了关注削减成本而不是展示投资回报和价值。\n\
  *   在初始阶段，寻找财务数据所在位置以及如何控制这些数据遇到困难。\n*   该流程依赖于其他流程提供的规划信息，而这些信息可能质量很差或不存在。\n* \
  \  内部服务提供商在引入收费（charging）时遇到困难。这需要文化和衡量成功的方式发生变化，特别是需要阐述与替代服务提供商相比的价值。用户可能会因为被收费而变得产生更高的要求。\n\
  *   外部服务提供者需要在服务成本与服务的感知价值之间取得平衡，以确保正确的定价模型。正确的价格必须高于成本，但必须反映出对客户的价值（客户愿意为服务支付的金额）。\n\
  \n### 风险\n\nIT 服务财务管理面临许多风险，包括：\n\n*   为内部服务提供商引入专门的财务管理流程可能被认为是不必要的，尽管关于服务类型和水平的糟糕投资决策的成本可能远高于实施该流程的成本。\n\
  *   缺乏足够的 IT 服务财务管理流程可能导致不合规的罚款。\n*   组织中可能没有既懂 IT 又懂财务的人员。\n\n## 总结\n\n在本章中，我们通过研究\
  \ BRM（业务关系管理）和 IT 财务管理，完成了对服务方案和服务协议相关的服务策略流程的审查。我们涵盖了每个流程的目的、目标以及范围。我们看了流程的价值；然后回顾了每个流程的策略以及活动、方法和技术。\n\
  \n最后，我们回顾了每个流程的触发因素、输入、输出、接口以及相关的信息管理。我们还考虑了关键成功因素、关键绩效指标以及流程面临的挑战和风险。\n\n我们研究了这些流程对业务和\
  \ IT 服务提供商的重要性。业务关系管理通过与高级业务管理层合作，使提供的服务符合业务战略需求，从而确保在短期和长期满足组织的需求。财务管理在管理成本、评估性价比、管理资源以及在适当的情况下通过收费回收成本方面起着至关重要的作用。\n\
  \n## 考试要点\n\n**理解 IT 服务财务管理和 BRM 的目的。** 你需要理解 BRM 和 IT 服务财务管理的目的。\n\n**理解每个流程的业务价值。**\
  \ 你应该能够解释业务从每个流程中获得的价值。\n\n**掌握财务管理的关键活动。** 你需要能够识别财务管理的目的、目标和范围。记住三个主要领域：预算编制、IT\
  \ 会计和收费。财务管理对于计算服务的价值至关重要。\n\n**理解 BRM 如何与高级业务管理层合作。** 确保你理解业务关系经理如何工作，以确保服务提供商理解业务战略，并提供进一步实现该战略的服务。理解此流程还涉及向业务解释服务提供商可以做什么和不能做什么。\n\
  \n**能够描述 BRM 和服务水平管理之间的主要区别。** 你应该能够列出并解释 BRM 和服务水平管理在活动和关注点上的差异。\n\n## 习题可以在附录中找到习题的答案。\n\
  \n1. `service valuation`（服务定价）的定义是什么？\n    1. 负责识别交付 IT 实际成本、将其与预算成本进行比较并管理预算偏差的流程\n\
  \    2. 一个允许服务提供者确定提供服务成本的框架\n    3. 预测和控制资金支出的活动\n    4. 理解服务的成本相对于其业务价值的能力\n2.\
  \ 下列陈述哪项是正确的？\n    1. IT 财务管理与企业的财务管理是分开的。\n    2. 所有 IT 服务提供者都必须执行会计、预算和收费这三个核心财务流程。\n\
  \    3. 提供 IT 服务的成本对客户应该是可见的。\n    4. IT 支出需要业务理由。\n3. 下列哪项是财务管理的目标之一？\n    1. 确保客户期望不超过他们愿意支付的金额\n\
  \    2. 帮助业务阐述服务的价值\n    3. 确保服务提供商不承诺他们无法提供的服务\n    4. 确保服务提供商理解并能够满足客户需求\n4. `budgeting`（预算编制）的定义是什么？\n\
  \    1. 负责识别交付 IT 实际成本、将其与预算成本进行比较并管理预算偏差的流程\n    2. 一个允许服务提供者确定提供服务成本的框架\n    3.\
  \ 预测和控制资金支出的活动\n    4. 理解服务的成本相对于其业务价值的能力\n5. 下列哪项责任*不是* BRM 的责任？\n    1. 识别客户需求（效用和保证）并确保服务提供者能够满足这些需求\n\
  \    2. 战略关注\n\n\n\n3. 决定服务提供商交付哪些服务以满足客户需求\n4. 运营重点\n\n6. 下列哪些是 BRM（业务关系管理）的职责？\n\
  1. 为拟议中的新服务建立业务案例\n2. 就新服务和现有服务将交付的服务水平达成一致\n3. 监控服务提供商是否能够履行协议\n4. 确保所有运营水平协议（OLA）和基础合同（UC）均适用于约定的服务\n\
  \n7. 正或错？客户组合（customer portfolio）是用于记录 IT 服务提供商所有客户的数据库或结构化文档，而客户协议组合（customer agreement\
  \ portfolio）是用于管理 IT 服务提供商与其客户之间服务合同或协议的数据库或结构化文档。\n1. 正\n2. 错\n\n8. 下列哪个*不是* BRM\
  \ 的触发因素？\n1. 启动了新的战略倡议或新服务，或对现有服务进行了更改。\n2. 服务提供者的投资回报率（ROI）低于业务案例中的预测。\n3. 识别了一个新机会，或由服务组合管理授权设立了一项服务。\n\
  4. 收到了客户投诉。\n\n9. 下列哪个是 BRM 使用的数据存储库？\n1. 客户组合\n2. 配置管理系统 (CMS)\n3. 客户协议组合\n4. 供应商和合同管理信息系统\
  \ (SCMIS)\n1. 仅 1 和 2\n2. 仅 1 和 3\n3. 以上所有\n4. 仅 1、2 和 4\n\n10. 下列哪个*不是* IT 服务财务管理的输出结果？\n\
  1. 服务估值\n2. 服务投资分析\n3. 合规性\n4. 资助（内部）或支付（外部）服务的协议\n\n# 第 20 章\n\n服务供给与协议的技术因素\n\n\
  本章讨论了以下 ITIL 服务供给和协议的考试目标：\n\n- ![images](img/00005.jpeg) 辅助服务设计的通用技术需求\n- ![images](img/00005.jpeg)\
  \ 用于过程实施的技术和工具的评估标准\n- ![images](img/00005.jpeg) 实践和过程实施的良好实践\n- ![images](img/00005.jpeg)\
  \ 与实施实践和过程相关的挑战、关键成功因素和风险\n- ![images](img/00005.jpeg) 如何规划和实施服务管理技术\n- ![images](img/00005.jpeg)\
  \ 在支持规划、保护和优化实践中的过程时实施技术的考虑，特别是技术架构的设计\n\n![](img/00006.jpeg) 本章将所有技术和实施需求整合在一起，以定义一套集成服务管理技术工具的整体需求，以支持服务供给和协议中的过程。相同的技术（连同一些可能的扩展）应用于\
  \ IT 服务管理（ITSM）的生命周期阶段——服务策略、服务设计、服务过渡、服务运营和持续服务改进——以保持一致性并允许有效的 ITSM 生命周期得到妥善管理。\n\
  \n工具可以帮助服务管理过程运行得更高效。它们应该能够快速且一致地执行大量大量的重复性工作。工具还提供了丰富的管理信息，有助于识别弱点和改进机会。\n\n工具的使用将有助于实践标准化，并实现过程的集中化和集成。\n\
  \n我们将考虑此类工具的通用需求。所使用的工具应该支持过程，而不是反过来，这一点非常重要。\n\n 技术的通用需求和评估标准\n\n我们首先考虑支持服务设计的通用技术需求，对于\
  \ IT 服务管理而言，这意味着 IT 服务管理工具。在本节中，我们将查看其中的许多需求，你可以预计任何良好的集成工具集都会提供这些需求。\n\n前两个需求是自助服务功能和工作流引擎。\n\
  \n你应该从对发布履行过程的讨论中回想起，我们讨论过通过自助服务功能处理请求或简单事件的选项。这可能仅限于请求和事件的记录，也可以允许它们在整个生命周期内被跟踪和更新。提供自助服务设施的优势在于，请求和事件可以随时记录，而且该过程不依赖于服务台人员在场接听电话。如果不紧急的电话通过自助服务、自助记录网站处理，这有助于服务台处理大量的来电。自助服务请求工具可以协助重置密码，例如，要求用户在重置发生前通过回答之前设置的问题来验证其身份。此外，自助服务请求工具还可以下载批准的请求软件版本。\n\
  \n下一个通用需求是需要一个工作流或过程引擎，它可以自动执行过程的步骤（分配、升级等）。它还可以在完成先决步骤后发布工作单。\n\n下一个通用需求是一个集成的配置管理系统（`CMS`）。\n\
  \n服务管理工具应与 `CMS` 集成，以便组织的配置项（`CI`）信息可以被查询并根据需要与事件、问题、已知错误和更改记录关联。\n\n另一个通用需求是发现、部署和许可方面的技术工具。这些工具在验证\
  \ `CMS` 的准确性方面非常有帮助，特别是在许可证使用方面。如果可以仅提取并报告自上次审计以来的更改，也将很有帮助。相同的技术通常可以用于将新软件部署到目标；这对于将补丁、升级等分发给正确的用户至关重要。\n\
  \n当与之前提到的自助服务功能结合使用时，服务管理工具集促进了许多软件请求履行的自动化。\n\n另一个通用需求是远程控制。这允许服务台分析师在受控的安全条件下控制用户的桌面，执行诸如调查和纠正设置等操作。\n\
  \n某些工具将存储诊断脚本和其他诊断程序，以帮助尽早诊断事件。\n\n良好的报告是任何 ITSM 工具集的需求。工具持有关于日常发生情况的海量数据。这些数据对于规划和跟踪趋势很有帮助，但此类报告必须灵活才才有用。标准报告和即时报告都应该易于获取。\n\
  \n另一个需要考虑的通用需求是仪表板功能。仪表板对于日常运营以及 IT 和业务管理层清晰地了解实时性能都是用的。\n\n为了促进更深层次的业务对齐，业务应用程序和工具需要能够与\
  \ ITSM 支持工具对接，以提供所需的功能。集成的一个示例是事件管理工具发现信用卡上的异常消费模式。\n\n软件即服务（`SaaS`）技术通过互联网提供托管的服务管理能力。`SaaS`\
  \ 提供的优势包括较低的资本和启动成本、更快的实施以及内置的服务连续性。\n\n\n\n\n然而，这也意味着定制化和功能更改受到限制，访问受限于供应商的业务可用时间，且许可方案可能变得具有限制性或昂贵。数据存储大小也可能存在限制，并可能存在安全和访问管理方面的约束或风险。最后，与其他服务管理工具的集成可能会非常困难，甚至无法实现。\n\
  \n每个组织都应该仔细审查其需求，以获取最符合其需求的工具集。\n\n## 实践与流程实施的良好实践\n\n在接下来的章节中，我们将考虑实施良好实践和流程的基础。我们需要考虑与服务提供和协议流程相关的需求，以及实施服务设计的方法。这应该包括：\n\
  \n*   我们从哪里开始？\n*   我们如何改进？\n*   我们如何知晓自己正在取得进展？\n\n在考虑任何服务管理流程（包括服务设计中的流程）的实施时，你必须考虑客户和业务的需求和愿。根据以下因素对活动进行排序：\n\
  \n*   业务需求和业务影响\n*   对服务和流程的风险\n\n活动还将受到服务水平协议中达成的服务水平要求和协议的影响。\n\n### 业务影响分析\n\n\
  理解业务需求、影响和风险的关键输入之一是业务影响分析（BIA）的输出。BIA 用于多个服务设计流程，特别是 IT 服务连续性管理（参见第 9 章“IT 服务连续性管理与需求管理”），它对于定义降低风险和业务连续性的策略至关重要。BIA\
  \ 通常用于识别灾难对业务的影响，包括对单个部门和整个业务的影响。它用于识别任何特定业务流程或活动的关键性，并将被用于识别这些情况特别影响业务的时间。BIA 也用于其他流程——例如，可用性管理、容量管理和信息安全管理。\n\
  \nBIA 有两个领域。一个是用于业务管理的，它涉及理解损失对业务流程或功能的影响。另一个是从服务损失的角度来理解 BIA。这两者都应该应用于识别关键服务，并在设计新服务时确定什么构成了服务的大故障。BIA\
  \ 还将有助于定义服务中断的接受水平和持续时间，包括需要避免的重点时期。此外，BIA 还可以助于理解财务损失和任何安全问题。\n\n### 服务水平要求\n\n\
  作为服务水平管理流程的一部分（参见第 18 章“服务水平管理与供应商管理”），将识别所有服务的服务水平要求，并在服务水平协议中评估并定义满足需求的能力。这需要是设计方法的一部分。\n\
  \n### 对服务和流程的风险\n\n在考虑任何服务管理流程（包括服务设计中的流程）的实施时，你必须考虑客户和业务的需求和欲望。根据以下因素对活动进行排序：\n\
  \n*   业务需求和业务影响\n*   对服务和流程的风险\n\n### 实施服务设计\n\n我们建议\n\n*   我们从哪里开始？\n*   我们如何改进？\n\
  *   我们如何知晓自己正在取得进展？\n*   愿景是什么？\n*   我们现在在哪里？\n*   我们想去哪里？\n*   我们如何到达那里？\n*   我们到达那里了吗？\n\
  *   我们如何保持势头？\n\n### 挑战、关键成功因素和风险\n\n当我们考虑实施良好实践与服务提供及流程之间的关系时，意识到挑战、CSF（关键成功因素）和风险是重要的。\n\
  \n### 挑战\n\n挑战有多种形式，取决于组织的性质。某些因素适用于大多数组织。这些包括：\n\n*   理解业务需求和优先级\n*   理解组织文化\n\
  *   与业务和员工进行有效沟通\n*   与所有利益相关者的协作和参与\n*   获得管理层的承诺\n*   供应商管理和合同义务\n\n#### 关键成功因素\n\
  \n如你所知，`critical success factor`（`CSF`）是一个用于组织或项目实现其使命所需的要素。CSF 可用于识别成功的重要元素。这些通过关键绩效指标（`KPIs`）进行衡量，并应作为服务设计的一部分进行设定和衡量。SOA\
  \ 流程在建立需求方面至关重要。\n\n### 风险\n\n与挑战一样，一些常见的风险适用于大多数组织。这些需要被恰地识别和处理，以确保成功的实施。一些示例是：\n\
  \n*   满足识别出的 CSF\n*   流程的成熟度\n*   不明确的业务需求\n*   服务设计、过渡和运行的不切实际的业务时间\n*   测试不足\n\
  *   在创新或稳定性方面的关注上缺乏平衡\n*   业务、IT 和供应商之间缺乏协调\n*   资源不足，包括成本和预算\n*   缺乏跨整个服务管理生命周期的整体方法\n\
  \n### 服务管理工具的选择\n\n有很多服务管理工具可用，每种工具都有自己的优缺点，这使得选择正确的工具变得困难。为了克服这个问题，你应该定义一些客观的选取标准（参见图\
  \ 20.1](#part0030_split_002.html_figure20-1）。\n\n一种简单的方法是 MoSCoW 分析。这涉及创建一个所有需求的详细列表，并将每项分类为必须具有（must\
  \ have）、应该具有（should have）、可以具有（could have）或未来想要（would like in the future）。\n\n\n\
  \n\n*   `Should have` 需求是我们期望的但并非必须的需要。\n*   `Could have` 需求是有用但并非极其重要的需求。\n*  \
  \ `Would like in the future` 需求是那些现在不需要但将来会需要的需求。例如，我们现在正在选择一个事件管理工具，但我们希望它以后能具有问题管理能力。\n\
  \n随后，你可以根据此分析制定一套评分系统，这将使你能够对备方案进行排序。你可以对决策进行加权，通过建立评分系统来确保你获得了了符合你要求的的服务管理工具。\n\
  \n## 规划与实施服务管理技术\n\n本章的最后一个主题是服务管理工具。一个良好的服务管理工具有助于基于 ITIL 框架实施流程，但工具本身不应定义流程。许多组织通过实施新工具来协助其新流程或改进流程。如果要让新工具既有用又合适，这些组织需要考虑许多因素。\n\
  \n### 许可证\n\n首先要考虑的因素是许可证类型。通常会提供几种不同成本的选项。当工具按模块授权时，则需要仔细的规划，以确保获得正确的权限，以便人员开展工作，同时避免购买不必要的模块。以下是一些可能的选项：\n\
  \n*   **专用许可证（Dedicated Licenses）**：对于此选项，每个具名人员都有自己的自己的许可证。专用许可证适用于频繁且长时间使用特定模块的员工。例如，服务台台人员需要专用许可证来使用事件管理模块。\n\
  *   **共享许可证（Shared Licenses）**：这些许可证可以在个人之间共享；然而，可能存在员工成员因为许可证已被占用而无法访问工具的情况。共享许可证适用于不需要持续访问的常规用户，例如二线支持人员。需要经过仔细计算以确定用户与许可证之间的正确比例。这些许可证比专用许可证昂贵，但需要的数量较少。\n\
  *   **网页许可证（Web Licenses）**：这些许可证允许通过网络浏览器访问。网页许可证通常适用于需要远程访问或仅偶尔访问的人员。它们通常比其他许可证便宜得多（甚至与其他许可证随附赠）。通过购买少量此类许可证，就可以为大量临时用户提供足够的访问权限，因为并发用户以及所需的许可证数量将较低。通过这种方式可以进一步降低整体成本。\n\
  *   **按需（On Demand）**：在需要时提供工具访问（按需提供），供应商根据使用应用程序的时间收取费用。这对于规模较小的组织，或者相关工具非常专业且使用频率较低的情况来说可能很有吸引力。其变体是作为咨询任务的一部分使用专业工具（例如，专业的容量管理工具）；在这种情况下，许可证费用可能已包含在咨询中。\n\
  *   **代理/活动（Agent/Activity）**：许可证选项的另一种变体是基于代理/活动授权并收费的软件。其例子是模拟软件（例如，可以模拟客户在网站上的路径以评估并报告性能和可用性的代理软件）。\n\
  \n在所有情况下，都必须进行充分的调查以确保理解并同意成本，并确保组织在拥有足够许可证方面保持合规。\n\n### 部署\n\n许多 ITSM 工具（特别是发现和事件监控工具）在使用之前，可能需要在所有目标位置部署某些客户端/代理软件。这种部署需要仔细的规划和执行，并应通过正式的发布和部署管理来处理。以下的一些部署考虑因素：\n\
  \n*   应该进行仔细的调度和测试，并对部署进行跟踪，以便明确哪些 CI（配置项）已拥有软件，哪些尚未接收。\n*   随着部署的进行，应该更新 CMS（配置管理系统）。\n\
  *   通常需要重启设备以识别客户端软件，这需要提前安排以尽量减少服务中断。\n*   对于便携设备可能需要特殊安排，因为这些设备在部署期间可能不在现场。\n\
  *   必须提前检查接收软件的设备，确保它们有足够的存储和处理能力来托管和运行新软件。\n*   需要检查网络容量，以确保其能够传输所有所需内容。\n*   部署工具的最佳时间取决于成熟度。过早部署的工具会将改进计划的重点从改变流程和工作方式的需求转移，使得整个改进活动演变成仅仅是工具实施。\n\
  *   如果要实现收益，在部署之前对工具进行培训是必要的。\n\n记住，一个工具通常无法让事情变得更好。然而，如果它支持流程且用户已经接受了培训，良好的工具可以帮助员工执行新流程。\n\
  \n以下是必须考虑的部署的其他方面：\n\n*   **所使用的引入类型（The Type of Introduction To Be Used）**：必须决定采用“大爆炸式”引入还是某种阶段性方法。由于大多数组织在引入期间必须保持现有服务的运行，因此阶段性方法更有可能是必要的。\n\
  *   **工具之间的过渡（Transition between Tools）**：如果正在替换旧工具，必须考虑旧工具和新工具之间过渡的最佳方式。例如，服务台不应将新工具上的事件分配给一个尚未从旧工具过渡的团队。\n\
  *   **数据迁移（Data Migration）**：需要决定哪些数据需要从旧工具迁移到新工具。这可能需要重新格式化，因此在迁移后可能需要进行验证，特别是当数据通过电子传输时。相反，可以实施并行运行，在初始阶段旧工具以只读模式与新工具一起运行，以便需要时引用历史数据。\n\
  \n有关发布和部署管理过程的完整细节可以在 ITIL 服务过渡出版物找到。\n\n## 总结\n\n在本章中，我们研究了选择和实施新的集成服务管理工具时要执行的关键步骤。这包括收集需求、考虑其他因素、根据需求评估工具以及实施工具。\n\
  \n## 考试要点\n\n*   **理解集成服务管理工具带来的收益。** 这包括理解工具如何处理大量数据并提供一致性，以及它们将不同信息（如事件和问题）连接在一起并生成服务交付报告的能力。\n\
  *   **解释定义工具所需的所需的实用性（utility）和保证性（warranty）方面的重要性。** 理解明确规定工具需要做什么，以及它在容量、可用性和安全性方面需要交付的性能的重要性。\n\
  *   **理解不同类型的需求。** 能够识别强制性需求和理想需求之间的区别。\n\n\n\n\n解释名为 MoSCoW 的选择技术。理解该缩写代表的含义（Must/Should/Could/Would），并能够解释其在工具选择中的应用。\n\
  \n## 复习题\n\n你可以在附录中找到复习题的答案。\n\n1. 关于需求说明书（statement of requirements），以下陈述中哪些是错误的是？\n\
  \    1. `SoR` 应该始终包含业务需求。\n    2. `SoR` 应该识别强制性功能。\n    3. `SoR` 应该始终列出可用预算。\n \
  \   4. `SoR` 应该指定解决方案运行所需的架构。\n\n2. 关于实施新工具，以下哪些陈述是正确的是？\n    1. 每次升级都必须重复进行定制化。\n\
  \    2. 配置可能会影响供应商的支持义务。\n    3. 开箱即用的工具需要定制培训。\n    4. 在配置之后、部署之前，应该定义所有新流程。\n\n\
  3. 在准备新的服务管理工具需求请求时，通常采用 `MoSCoW` 方法。该术语中的大写字母代表什么？\n    1. Might, Should, Could,\
  \ Wanted\n    2. Mandatory, Should, Costed, Wanted\n    3. Must, Should, Could,\
  \ Would\n    4. Mandatory, Should, Customizable, Won’t\n\n4. 以下哪项显示了选择工具时执行的正确步骤顺序？\n\
  \    1. 同意选择标准。识别需求。识别产品。评估产品。排名。对每个产品评分。编制合适的产品短名单。选择产品。\n    2. 识别需求。识别产品。同意选择标准。评估产品。对每个产品评分。排名。编制合适的产品短名单。选择产品。\n\
  \    3. 识别需求。识别产品。同意选择标准。评估产品。编制合适的产品短名单。对产品评分。排名。选择产品。\n    4. 识别产品。识别需求。同意选择标准。评估产品。排名。编制合适的产品短名单。对每个产品评分。选择产品。\n\
  \n5. 以下哪项不是在服务设计期间使用工具的优点？\n    1. 它们允许快速且一致地进行大量的重复性工作。\n    2. 它们节省了时间，因为对解决方案的测试较少。\n\
  \    3. 工具提供了丰富的管理信息。\n    4. 工具的使用有助于标准化实践并整合流程。\n\n6. 以下哪些陈述中是不正确的？\n    1. 应该先购买工具，然后编写流程以充分利用其功能。\n\
  \    2. 应该先编写流程，然后找到适合该流程的工具。\n    3. 如果没有工具支持该流程，可以选择一个可能在某种程度上重新设计流程的工具，只要它能达到预期的结果即可。\n\
  \    4. 如果工具满足了业务运营需求的 80% 或以上，则被认为适用于其目的。\n\n7. 关于工具选择，以下陈述中哪些/哪些是正确的？\n    1.\
  \ 工具的功能以及它与流程的匹配程度是选择工具时唯一考虑的因素。\n    2. 应该评估供应商提供的支持质量；糟糕的支持可能导致产品被拒绝。\n      \
  \  1. 仅 1\n        2. 仅 2\n        3. 两者都是\n        4. 都不是\n\n8. 在评估不同产品时，应该考虑服务设计工具的哪些方面？\n\
  \    1. 符合国际开放标准\n    2. 实现、使用和数据共享的灵活性\n    3. 可用性——用户界面允许的易用性\n    4. 支持监控服务水平\n\
  \    5. 之前跟踪数据的转换需求\n    6. 数据备份、控制和安全\n        1. 仅 1, 3, 5 和 6\n        2. 仅 2,\
  \ 3, 5 和 6\n        3. 以上所有\n        4. 仅 3, 4, 5 和 6\n\n9. 在实施新工具时，除了软件购买成本外，还应该为哪些额外成本编制预算？\n\
  \    1. 员工使用工具的培训\n    2. 设置网络门户的时间成本\n    3. 配置成本\n    4. 设置报告的时间成本\n        1.\
  \ 以上都不是；这些是日常业务成本。\n        2. 仅 1, 2 和 3。\n        3. 仅 1, 3 和 4。\n        4. 以上所有。\n\
  \n10. 在在软件即服务（SaaS）安排下实施新工具的优点是哪些？\n    1. 不需要额外的硬件。\n    2. 不需要额外的软件。\n    3. 不需要额外的培训。\n\
  \    4. 较少的管理开销。\n        1. 以上所有\n        2. 仅 1, 2 和 4\n        3. 仅 1, 2 和 3\n\
  \        4. 仅 1, 3 和 4\n\n# 附录\n\n## 复习题答案\n\n### 第 1 章：运营支持与分析简介\n\n1. D. 测试和发布服务是服务过渡阶段的一部分，而停止服务的决策是战略性的。\n\
  2. D. 设计协调仅发生在服务设计生命周期阶段，而其他流程都包含运营性质的元素。\n3. C. 这包含了服务运营中正确的功能列表。\n4. B. 定义基础设施需求将是服务设计的一部分。\n\
  5. B. 选项 B 正确匹配了活动和功能。\n6. C. 问题管理流程负责预防事件发生。\n7. B. 设计协调是一个服务设计过程，而变更管理是一个服务过渡过程。\n\
  8. D. 服务所有者不是特定于某个流程的角色；它适用于整个服务。\n9. A. 设施管理和运营控制是运营管理的两个元素，流程角色适用于流程，而不适用于整个服务。\n\
  10. C. 流程执行者负责执行流程的工作指示。服务的交付是服务所有者的责任，流程所有者负责流程策略，流程经理将管理流程的资源。\n\n### 第 2 章：事件与问题管理\n\
  \n1. B. 选项 B 是 ITIL 框架中对事件的定义。选项 A 指的是事件，选项 C 是诊断后的问题。\n2. C. 在用户确认服务已恢复之前，不应关闭事件。\n\
  3. B. 选项 B 没有将服务恢复到约定水平或提供规避方案；其他选项可以。\n4. C. 选项 C 是 ITIL 框架中对正常服务运营的定义。正常服务运营是客户应该期待的，因为双方在\
  \ SLA 中达成了一致。\n5. C. 这些被称为事件模型。模型是处理特定项目（在本例中为特定类型的事件）的可重复方法。它定义了解决事件要采取的步骤，以及时间表和升级点。这加快了记录速度并提高了一致性。\n\
  6. D. 所有事件都应该记录，以确保获得客户体验的真实状况；这也允许评估 Minor 事件的累积影响。它提供了这些事件发生时间的证据，这在诊断根本原因时可能有用。选项\
  \ B 是错误的，因为并非所有事件都来自用户；它们可能来自事件日志、供应商、技术人员等。\n7. B. ITIL 术语中的优先级始终基于影响（对业务的影响）和紧急性（业务需要多快解决问题）。\n\
  \n\n\n\n\n## 8. B. 职级升级是指向上命令链汇报以获取信息或获得额外资源。功能升级则是跨越不断增加的技术技能水平，以加速问题的解决。\n\n##\
  \ 9. C. 问题管理是指对一个或多个事件中的未知原因进行诊断，确定原因，并在可能的情况下确定永久解决方案，从而将未知变为已知。\n\n## 10. D. 这些都是问题管理的潜在输出结果。已知错误和相关的变通方案（workarounds）会被记录并传递给服务台，以便解决新发生的相同事件。为了实施永久解决方案，可能需要提交一个\
  \ `RFC`（变更请求）。\n\n## 第 3 章：事件管理、请求履行和访问管理\n\n1. D. 情况 2 无法通过使用事件获得帮助。情况 1 会检测到存在时间阈值或优先级条件的警报，并执行定义的升级。情况\
  \ 3 同样会对特定事件（如警报）做出响应，并自动通知警察局。情况 4 可以利用每个文件备份成功的事件来自动执行下一个文件的备份。\n\n2. C. 1、2 和\
  \ 4 都是可以使用事件管理的示例。可以通过事件管理监控热量和水分含量，并在其超出可接受参数时采取行动。可以通过监控谁登录了应用程序来控制许可，并在超过最大合法人数时发出警报。员工班表没有可以利用事件进行监控的变更条件。\n\
  \n3. C. 本章描述的两种事件监控类型是被动监控和主动监控。被动监控等待检测到错误消息，而主动监控定期检查 `CI`（配置项）的“健康状况”。另外两种不被\
  \ ITIL 认为是事件监控类型。\n\n4. D. 只有具有记录在案的履行程序的常见低风险请求才应该通过请求履行过程实施。其他变更需要通过变更顾问委员会进行风险评估。\n\
  \n5. A. 服务台员工履行许多请求，二线员工执行安装、移动等工作。请求不属于 `SLM`（服务水平管理）或 `BRM`（业务关系管理）的职责。\n\n6.\
  \ A. 请求不需要 `CAB` 批准。如果需要变更来履行请求，通常应该是预先授权的，因为风险水平较低，且履行过程是已知且定义的。通常财务控制仍然适用，因此履行的一部分可能包括获得预算持有者对支出的同意。正如章节提到的，可能需要技术授权。\n\
  \n7. B. 选项 A 是错误的，因为安全管理并不能防止未经授权的用户访问。选项 C 是错误的，因为安全管理负责制定安全策略。选项 D 是错误的，因为访问管理执行负责授权访问员（通常是业务经理）的意愿；它不做决策。\n\
  \n8. D. 除了第 3 条外，所有陈述都是正确的。组织通常有法律要求保护数据，未能这样做可能会损害其声誉并导致业务减少。数据属于业务，需要有效的访问管理以确保访问是基于业务原因，而不是\
  \ IT 部门的想法。访问管理并不一定能降低成本。\n\n9. C. 人力资源部门管理用户名的变更；这并不是访问管理的挑战。\n\n10. A. 访问管理将移除或限制长期休假员工的访问，因为他们没有访问数据的有效理由。任何此类尝试都会引起怀疑。离开组织的人员的访问权限应被移除。将他们的访问信息留给剩余员工使用是糟糕的做法；如果有需要应进行调整以确保适当的审计跟踪。\n\
  \n## 第 4 章：服务台\n\n1. C. 问题管理过程负责预防事件，包括重复性事件。服务台不承担问题管理，它提供第一个接触点，在首次接触期间解决尽可能多的事件，并向用户更新分配给二线支持团队的事件的进展。\n\
  \n2. B. 设计协调是服务设计的过程，变更管理是服务过渡的过程。这两者都不由服务台执行。\n\n3. D. 应用程序管理功能需要详细的应用程序知识，而不是服务台。服务台员工只需具备的技术能力以及对基础设施和应用程序的理解，能够识别已知错误并应用变通方案，或将事件升级到正确的支持团队即可。在优先处理事件时，需要具备业务知识以理解业务影响。\n\
  \n4. B. 矩阵（Matrix）在 ITIL 框架中不被认为是服务台结构。\n\n5. B. 服务台分析师使用事件诊断脚本来帮助一线解决事件。已知错误数据库将提供变通方案，允许服务台恢复服务。`CMS`（配置管理系统）将提供有关出现问题的\
  \ `CI` 信息，并显示其与其他 `CI` 的关系，因为其他 `CI` 的故障可能会导致特定 `CI` 故障（例如，故障的路由器可能会导致打印机无法打印）。最后，对变更计划的访问将显示故障\
  \ `CI` 最近是否经历过可能导致故障的变更。\n\n6. D. 在未升级到其他团队的情况下关闭的事件百分比将显示服务台的一线解决率；服务台的解决提供了最快且最便宜的解决方案，并最大限度地减少了对业务的影响。在记录时正确分类的事件百分比显示了服务台员工对问题的理解程度；分类错误可能导致事件升级到错误的支持团队，浪费时间并延长对业务的影响。客户满意度调查得分将显示所提供的服务是否符合业务需求。被判定为硬件故障的事件百分比不在服务台的控制范围内，不能反映所提供的服务水平。\n\
  \n7. B. 服务台解决简单事件；这意味着这些事件不会升级给技术人员。服务台不记录服务水平需求或授权 `RFC`。虽然服务台员工可能帮助更新 `CMS` 从而提高其准确性，但这是一种间接利益，因为\
  \ `CMS` 是服务资产和配置管理的直接职责。\n\n8. A. 所有事件都必须记录，无论是由超级用户还是服务台记录；如果故障在未记录的情况下被解决，问题管理将无法察觉这些故障，因此将没有根源分析和防止再次发生的永久解决方案。此外，如果二线支持团队在未记录事件的情况下处理事件，关于其工作负载和生产力的管理信息将是不完整的。这些事件也可能被赋予高于所需的优先级进行处理。\n\
  \n9. B. 选项 B 描述了一种虚拟服务台结构。选项 A 描述的是本地服务台，选项 C 描述的是“随日制”（follow-the-sun）结构，而选项 D\
  \ 没有描述 ITIL 指南中提到的任何结构。\n\n\n\n\n10. B. 组织的高层管理人员决定提供哪些服务，并对所提供的服务水平负责，即使他们聘请了外包商来交付。外包商负责确保所提供的服务水平符合或超过合同中约的标准。\n\
  \n## 第 5 章：技术管理、应用管理和 IT 运营管理\n\n1. B. 定义基础设施需求将是服务设计的一部分。\n2. B. 选项 B 正确地匹配了各项活动和功能。\n\
  3. D. 设施管理和运行控制是运营管理的两个要素。\n4. A. 技术管理处理新或变更服务的技术方面。选项 B 由 IT 运营管理执行，选项 C 由应用管理执行，选项\
  \ D 由服务台台执行。\n5. C. 这些都是应用管理的目标。\n6. D. 技术管理指的是基础设施的技术专业知识和管理。\n7. A. 维持日常运营活动的现状是\
  \ IT 运营的目标；规划新应用程序的部署是应用管理的角色。\n8. D. 应用管理将对所有与应用程序相关的问题承担整体责任。\n9. C. 技术管理包括专家技术架构师、设计师、维护和支持人员。\n\
  10. B. 这是 IT 运营管理的主要目标。虽然其他功能可能参与日常任务，但这不是它们的主要目标。\n\n## 第 6 章：运营支持与分析的技术与实施考量\n\
  \n1. B. 工具是实现流程而非替代流程，尽管工具被用于支持流程，但它们不应该定义流程。\n2. A. 陈述 2 是错误的；工具不需要拥有服务知识管理系统也可以成为一种服务管理工具。然而，拥有所有\
  \ `CIs` 的细节并能够关联事件、问题、请求等是极其有用的。\n3. B. 选择工具集的第一步应该是收集需求；如果无法满足需求，工具的功能可能不足以支持流程和团队的需求。\n\
  4. C. 所有选项都属于服务管理工具的通用需求的一部分。\n5. A. 必须、应该、可以、如果可以的话就做（`MoSCoW`）技术用于在选择工具时对需求进行分类。例如，工具必须具备将事件记录关联到问题记录的能力。\n\
  6. D. 授权变更请求的能力不太可能是自服务门户的一部分，但其他所有功能都可能是标准能力。\n7. D. 报告在服务管理中至关重要。良好的工具将有一系列通用报告，但还应该提供支持定制报告需求的功能，以满足组织需求。\n\
  8. A. 管理层在整个服务管理过程中应提供支持和指导，如果他们提供预算以进行培训、获取工具等，则体现了他们的承诺。\n9. B. 采用项目管理并不意味着服务运营不需要为变更付费。所有其他答案都是使用项目管理的益处。\n\
  10. B. 时间限制的*不是*一种有效的许可证类型。所有其他条款都是可能的许可选项的描述。\n\n## 第 7 章：规划、保护和优化的引论\n\n1. D.\
  \ 服务设计的 4P 是确保设计满足要求的稳健设计的四个方面。第一个方面是**人员（people）**——计算支持新服务所需的人数，并确保他们具备必要的技能组合以有效执行。第二个考虑的方面是**流程（process）**——服务设计流程以及任何额外流程，例如授权或采购流程。第三个方面是**合作伙伴（partners）**——确保选择最好的供应商，因为他们提供了组件。最后一个方面是**产品（products）**——正在设计的服务以及以后支持该服务的技术和工具。\n\
  2. B. 平衡的设计对资源、时间和功能给予了适当的权重。这意味着，例如，如果对功能丰富的产品有需求，该产品将需要大量的资源或大量的时间来开发。另一方面，如果最重要的需求是快速交付，则可能需要牺牲功能，或者需要额外的资源。因此，这三个元素应该保持平衡——在最佳的时间范围内交付出最佳的功能水平，并以合理的资源支出实现。\n\
  3. B. 整体性方法确保了以下五个方面中的每一个都得到考虑：\n    * 实际解决方案本身的设计\n    * 管理服务所需的服务管理系统和工具\n   \
  \ * 服务将使用的管理架构和技术架构\n    * 支持服务运行所需的流程\n    * 所需的度量系统、方法和指标\n4. C. 设计缺乏灵活性、交付延迟以及对容量、可用性、服务连续性和安全性等保证（warranty）方面的关注不足，都对设计的成功构成了风险。选项\
  \ C 是错误的，因为它错误地将保证（warranty）描述为“适用适用性（fit for purpose）”。保证描述的是“可用性（fitness for use）”。\n\
  5. D. 如果设计要成功，必须考虑列出的所有方面。必须指定所需的技术组件，以及第三方支持合同，以确保供应商提供的那些服务组件按要求的质量和成本交付。如果服务要产生收益，则需要经过良好培训的人员在发生任何事件时提供支持。最后，必须建立所需的报告和治理控制，以确保服务的安全并提供所需的信息。其中一个例子是确保财务系统提供财务支出授权的审计跟踪。\n\
  6. B. 服务设计阶段负责研究和评估满足业务需求的备选解决方案，推荐最佳解决方案，并在最佳方案是购买产品并根据需要进行进一步定制时进行采购。如果最佳方案是在内部开发解决方案，这这也是设计阶段的责任。业务案例的开发是服务策略阶段的责任。\n\
  7. A. 生命周期中服务设计阶段的目的是设计 IT 服务，以及必要的支持 IT 实践、流程和策略，以实现服务提供者的策略。理解这一点非常重要——设计不仅仅关乎技术设计；它还考虑了使用方式和所需的流程。设计还应该包括考虑服务将如何过渡；它应该促进服务引入到受支持的环境中，以确保高质量的服务交付、客户满意和具有成本效益的服务提供。评估新或变更策略对服务提供者的财务影响是\
  \ IT 服务财务管理流程的目的，它是服务策略的一部分。\n\n\n\n\n\n## 8. B\nITIL 将服务设计的五个方面列为：实际解决方案的设计；管理服务所需的服务管理系统和工具的设计（在此提供的选项中缺失）；服务将使用的管理架构和技术架构；支持服务运行所需的流程；以及将要需要的测量系统、方法和度量。风险管理不是这五个方面之一。\n\
  \n## 9. C. 服务设计计划应涵盖方法、时间表和资源需求；对组织和技术的影响；风险；商业方面；培训需求以及适当的沟通方法。该规划的输出被记录在服务设计包（`SDP`）中。`SDP`\
  \ 应包含解决方案或服务后续测试、引入和运行所需的所有内容。这还包括产生一套服务验收标准（`SAC`）。因此，问题中建议的所有内容都是有效的，但变更计划和 `CMS`\
  \ 除外。\n\n## 10. D. 设计协调流程的职责包括根据服务章程和变更请求制作服务设计包，并确保按照约定将这些包交付给服务过渡阶段。\n\n## 第 8\
  \ 章：容量、可用性和信息安全管理\n\n### 1. A. 监控和预测容量需求，以及处理容量问题和事件，是容量管理流程的职责。虽然在就容量需求达成纳入 `SLA`\
  \ 之前会咨询容量管理部门，但为服务水平协议协商这些目标是服务水平管理流程的职责。\n\n## 2. A. ITIL 框架描述的容量管理子流程包括业务容量管理、服务容量管理和组件容量管理。\n\
  \n## 3. C. 业务容量管理关注理解未来的业务计划及其对 IT 基础设施的影响。技术方面的详细规划和管理由组件容量管理子流程涵盖，而服务容量管理子流程负责运营环境中环境中实现的服务性能。\n\
  \n## 4. A. 该流程既有响应性的元素，也有前瞻性的元素，用于用于规划和响应运营需求。\n\n## 5. B. 风险管理是信息安全管理的一部分，但不是容量管理的职责，容量管理会提前计划，并包含一些应急措施，以防对容量需求的预期证明是不准确的。这两个都是循环的——规划、实施、监控结果、决定进一步采取的行动并对其进行规划，依此类推。\n\
  \n## 6. A. 信息安全管理流程的目的是制定和维护一项信息安全策略，使 IT 安全与业务安全对齐，并确保组织的资产、信息、数据和 IT 服务的机密性、完整性和可用性始终符合业务的需求。这里列出的其他目的是实施此类策略的方面。\n\
  \n## 7. C. 信息安全管理系统的元素包括计划、实施、评估、维护和控制。规划包含了各种协议和合同中的细节和目标，以及业务和 IT 同意的各种策略。实施要求所有影响因素了解这些策略和系统。评估涉及对安全的内外审计，维护记录教训以便规划和实施改进。整体方法旨在维护控制并为整个组织建立管理框架。\n\
  \n## 8. D. 安全管理信息系统（`SMIS`）是 `ISM` 流程的输出，是所有与信息安全管理相关的信息的库。\n\n## 9. D. 四个核心概念是可靠性、韧性、服务性和可维护性。ITIL\
  \ 将可靠性定义为“服务、组件或 `CI` 在不中断的情况下执行其约定功能的持续时间”。韧性是指设计服务，使组件故障不会导致停机。可维护性的衡量标准是服务恢复平均时间（`MTRS`）。服务性定义为第三方供应商满足其合同条款的能力。\n\
