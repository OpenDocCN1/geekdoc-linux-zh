  \ 服务供给与协议 (SOA) 汇总了来自核心指南的许多相关实践，这些实践涉及创建和管理服务供给以及支持这些供给所需的协议。SOA 中级证书的考试目标考虑了从服务战略阶段的\
  \ SOA 流程，包括服务组合管理、需求管理、财务管理和业务关系管理，并概述了 IT 服务战略管理流程；以及从服务设计阶段，包括服务目录管理、服务水平管理和供应商管理。它还包含了设计协调流程的概述。SOA\
  \ 部分的介绍性章节还考虑了为什么理解客户对效用和保证的感知对于服务的成功至关重要，以及这种理解对 SOA 流程的关联性。我们研究了 SOA 流程作为理解和识别客户需求的起点。我们还考虑了投资回报率\
  \ (ROI) 和业务案例。## 来自战略和设计的 SOA 流程及其在服务生命周期中的上下文服务供给与协议需要在服务生命周期的上下文中进行考虑——主要的关联是与服务战略阶段和服务设计阶段。你应该熟悉服务生命周期的概念，如图\
  \ 16.1 所示。每个阶段都针对成功的服务管理需要解决的一系列特定挑战，并且每个阶段对所有其他阶段都有影响。![图像显示 ITIL 服务生命周期，以服务战略为中心，周围环绕着服务设计、服务过渡和服务运营的箭头。这些阶段被一个称为持续服务改进的外圆所包围。](img/00072.jpeg)\n\
  \n**图 16.1**](#part0026_split_001.html_figureanchor16-1) ITIL 服务生命周期\n\nCopyright\
  \ © AXELOS Limited 2010. 保留所有权利。根据 AXELOS 的许可复制。\n\n现在让我们检查服务战略和服务设计生命周期阶段及其对应的\
  \ SOA 流程。\n\n### 服务战略\n\n服务战略位于服务生命周的核心。战略的作用是理解组织目标和客户需求。人员、流程和产品应该支持该战略。ITIL 服务战略在考虑如何做之前，先询问为什么要这样做。它帮助服务提供者设定目标；设定服务客户和市场的性能预期；以及识别、选择和优先考虑机会。服务战略确保提供者理解并能够处理与其服务组合相关的成本和风险。\n\
  \n我们考虑的作为 SOA 流程的服务战略流程包括服务组合管理（在第 17 章“服务组合管理与服务目录管理”涵盖）、以及 IT 服务财务管理和业务关系管理，这两者都在第\
  \ 19 章“业务关系管理与 IT 财务管理”中涵盖。我们已经在第 9 章“IT 服务连续性管理与需求管理”中深入考虑了需求管理，将其作为规划、保护和优化的一部分。我们将在其他章节中详细查看这些内容，因此让我们在这里进行简要总结。除了这些流程外，IT\
  \ 服务战略管理将在本章稍后部分进行更深入的。\n\n#### 服务组合管理\n\n该流程旨在确保服务提供者交付适当的服务组合，以满足客户的需求。它能够跟踪有关服务的重要信息，包括已投入的投资以及与其他服务的交互。它将正在提供的服务与其所支持的业务结果联系起来，并根据对可能产生的回报和接受风险水平的分析，帮助决定应该提供哪些服务。该服务的主要输出是服务组合，它是服务的最终定义列表，显示了计划服务的管水线、当前服务的目录以及已退役的服务。\n\
  \n#### IT 服务财务管理\n\n组织必须能够管理其财务——以管理资源并确保其目标的实现。财务管理流程和控制将应用于整个组织。IT 服务提供者可能有一个独立的\
  \ IT 财务管理流程，但该流程应遵循组织的整体原则和要求。IT 服务财务管理的目的是为满足组织要求的 IT 服务的设计、开发和交付确保获得适当水平的资金。同时，该流程应充当\
  \ IT 服务支出的守门员，确保服务提供者在交付所需服务时财务上不会过度延伸。\n\n成本和质量是提供服务的关键因素，我们分配和理解服务提供成本的唯一途径是通过健全的财务实践。财务管理流程的目标包括识别、管理和沟通服务交付的实际成本，并理解和评估任何新或变更组织战略对服务提供者的财务影响和意义。\n\
  \n#### 业务关系管理\n\n业务关系管理已经从仅仅在 IT 服务提供者组织内部提供一名联系人，演变为一个在组织高管与服务提供者的战略管理之间提供连接的角色。该流程在\
  \ IT 服务提供者与客户的协调方面起着非常重要的作用。该流程在服务提供者和客户之间建立了关系，并通过对业务和客户需求的持续审查维护这种关系。这种关系对于建立服务提供者与客户之间的业务交流至关重要。它有助于识别客户需求，并确保服务提供者现在和未来都能满足这些需求。业务关系管理是确保服务提供者能够理解随时间变化的业务需求，并管理客户对所服务的预期的流程。\n\
  \n#### 需求管理\n\n需求管理是寻求理解、预测和影响客户对服务的需求以及满足这些需求的容量提供的流程。它是服务管理中的一个关键方面。管理不当的需求是服务提供者的风险来源，因为存在不确定性。过剩容量会产生成本而不创造价值。\n\
  \n\n\n\n\n需求管理的目的是理解、预测和影响客户对服务的需求，并与容量管理合作，确保服务提供商有足够的容量满足这些需求。需求管理寻求预测并防止或管理对服务的需求超过其交付能力的情况，因为资源不足会影响业务目标的实现。需求管理贯穿生命周期的每个阶段，以确保服务的设计、测试和交付能够在恰当的活动水平上支持业务结果的实现。其目标是调整交付服务的资源利用，以满足这些服务不断波动的需求水平。\n\
  \n# IT 服务策略管理流程概述\n\n现在让我们详细地查看剩余的策略 SOA（面向服务的架构）流程，即 IT 服务策略管理流程。我们将考虑该流程的目的、目标、范围以及对业务的价值。\n\
  \n我们首先从该流程的定义开始。IT 服务策略管理是决定提供哪些服务以及如何管理这些服务的流程。这是一个重要的流程，因为它确保了服务提供商定义了策略，并采取行动确保实现其目的。没有了这个流程，服务提供商可能在没有明确方向的情况下只是“漂流”，在不评估服务是否合适的情况下提供服务，导致错失机会等。\n\
  \n### 目的\n\n服务策略的目的是制定并描述服务提供商如何帮助组织实现其业务结果；它描述了如何决定提供哪些服务以及如何管理这些服务。IT 服务策略管理确保了此类策略的存在，并定义、维护和定期评估该策略，以确保其实现了其目的。\n\
  \n### 目标\n\n服务策略管理的目标包括以下内容：\n\n*   考虑服务提供商运营的环境（包括内部和外部）。目标是识别可能对组织有利的机遇。\n*  \
  \ 识别任何影响业务实现预期结果或阻碍服务交付或管理的限制因素，并识别如何消除这些限制因素或减轻其影响。\n*   定义并达成服务提供商的观点，并确保其保持相关性，以便对服务提供商的愿景和使命进行清晰的表述。\n\
  *   理解服务提供商相对于客户和其他服务提供商的定位，以便定义交付到每个市场空间的服务。服务提供商还将理解如何相对于其他提供商保持竞争优势。\n*   最终目标涵盖战略计划。应该产生、维护并分发给相关利益相关者一个关键文档库。这些应包括\
  \ IT 策略文档、服务管理策略文档以及每个服务的策略计划。\n\n将这些战略计划转化为负责交付的相关部门或小组所所需的实际战术和操作指导至关重要。与所有关键文档一样，应该建立流程以确保文档随情况的变化而更新。\n\
  \n### 范围\n\n现在让我们考虑服务策略管理的范围。组织策略是高管人员的责任，他们设定组织目标并优先考虑必要的投资以实现这些目标的实现。大型组织将有一个专门的策略和规划经理直接向董事会报告，负责评估、策略文档和策略的执行。\n\
  \n重要的是，组织的策略不仅限于单一文档，而是更有可能被分解为每个业务单元的策略。你可以在 `图 16.2` 中看到业务策略如何分解为 IT 策略和制造策略的示例。这些每一个目标的实现都使整体战略得以达成。\n\
  \n![流程图显示了业务策略单元如何流入 IT 策略（例如：架构）和制造策略（例如：我们必须制造哪些产品？）。](img/00073.jpeg)\n\n**图\
  \ 16.2** `图 16.2` 整体业务策略和业务单元的策略\n\nCopyright © AXELOS Limited 2010\\. 版权所有。材料根据\
  \ AXELOS 的许可进行复制。\n\nIT 服务策略管理必须确保服务及其管理方式支持整个企业的的战略。\n\n策略管理可以是一个通用的流程，适用于整个业务或任何业务单元。然而，ITIL\
  \ 特别关注此流程如何作为 IT 服务提供商被应用于 IT。你应该注意，对于外部服务提供商来说，业务策略可能与交付给外部客户的 IT 服务有关，而 IT 策略将与这些服务如何被交付和支持有关。同时，外部服务提供商不仅向客户提供\
  \ IT 服务，他们也是自身（以及可能的其他第三方）IT 服务的消费者。外部服务提供商还有必须满足的内部 IT 服务需求，以便他们能够生存。\n\nITIL 中策略管理的范围如图\
  \ `图 16.3` 所示。我们可以看到业务策略如何被用于开发一套战术——一组用于实现战略目标的详细方法、流程和技术——以及操作——由个人和团队执行的具体程序、技术和活动。\n\
  \n![图像显示了策略管理的范围，如业务策略、业务战术、业务操作、IT 策略、服务的 IT 战术以及 IT 服务操作。所有类别在相应的框内都有相关问题并相互连接。](img/00074.jpeg)\n\
  \n**图 16.3** `图 16.3` 策略管理的范围\n\nCopyright © AXELOS Limited 2010\\. 版权所有。材料根据 AXELOS\
  \ 的许可进行复制。\n\nIT 策略（因此也包括 IT 服务策略）基于业务策略的需求。IT 策略决定战略目标在技术上是否可行，以及所需的投资水平，以便业务有相关信息来决定是否应该包含该目标以及优先级如何。\n\
  \nIT 战术受到 IT 策略和业务战术的影响。如果业务战术需要遵守某项法规，IT 将必须确保 IT 战术使之可行，并在如果无法实现时识别克服此所需的投资水平。\n\
  \nIT 操作源于 IT 战术，但也取决于业务操作的需求。不同运营环境的协调方式以及它们如何相互作用，对于 IT 服务策略管理至关重要。\n\n\n\n\n\n\
  图 16.3 中的虚线显示了 IT 战略与业务战术之间的关系。IT 不得定义与业务战术冲突的战略。关于使用 IT 的业务战术必须与 IT 战略兼容。如果 IT\
  \ 战略不允许某种类型的使用，则业务战术不应就如何使用 IT 服务做出战术决策。同样，IT 战术需要对业务运营有效。\n\nIT 服务的策略管理旨在管理服务提供者的策略。它将包括其将交付的服务类型、这些服务的客户，以及服务提供者执行策略时将实现的整体业务结果的说明。IT\
  \ 服务策略是 IT 战略的一个子集，除了 IT 服务策略外，它还包括 IT 架构策略、组合管理（服务之外）、应用管理、基础设施管理、项目管理、技术方向等策略。\n\
  \n记住，服务策略不等同于 ITSM 策略，后者实际上是一个战术计划。\n\n*   服务策略是服务提供者遵循的策略，用于定义和执行符合客户业务目标的服务。对于\
  \ IT 服务提供提供者而言，服务策略是 IT 战略的一个子集。\n*   服务管理（ITSM）策略是识别、实施和执行用于管理服务策略中所识别的服务的流程的计划。在\
  \ IT 服务提供者中，ITSM 策略将是服务策略的一个子集。\n\n### 价值\n\n定义良好且管理的策略通过确保以下方面交付价值：所有利益相关者对目标达成一致，资源和能力与实现业务结果一致，投资与预期的开发和增长匹配。结果是服务提供者提供了最佳的服务平衡，每项服务都有明确的业务目的。\n\
  \nIT 服务的策略管理鼓励适当水平的投资，产生以下结果：\n\n*   成本节省；投资和支出与经验证业务目标的实现匹配，而不是根据未经证实的需求\n*   增加关键项目或服务改进的投入\n\
  *   转变投资优先级\n\n如果没有战略，就会存在一种真正的危险，即谁叫得大谁就决定发生什么，并且服务（以及支出）与未经验证的需求匹配。\n\n有时，客户要求的内容需要偏离服务提供者的策略。外部服务提供者需要决定是更改策略还是拒绝该业务。内部提供者通常没有第二个选择，在这种情况下，IT\
  \ 服务的策略管理将使他们能够与业务部门合作，让他们意识到其需求对当前战略的影响。在某些情况下，客户需求不会改变整体战略，但可能涉及优先级的变化。\n\n###\
  \ 服务设计\n\n服务设计特别与服务报价和协议相关，它将战略构想转化为交付物。设计必须始终考虑战略，以确保以业务目标为核心进行服务设计。设计考虑整个 IT 组织以及它将如何交付和支持服务，将服务策略转化为实现业务目标的计划。记住：设计包括对现有服务的更改。\n\
  \n我们考虑的作为服务报价和协议流程的服务设计流程包括服务目录管理（涵盖在第 17 章“服务组合管理和服务目录管理”）以及服务水平管理和供应商管理（涵盖在第 18\
  \ 章“服务水平管理和供应商管理”）。我们将在其他章节中详细介绍这些内容，因此在这里简要总结一下。\n\n除了这些流程外，设计协调流程在本章稍后将深入讨论。服务设计流程的完整列表包括处理服务保障方面的流程。这些包括可用性管理、容量管理和信息安全管理（涵盖第\
  \ 8 章“容量、可用性和信息安全管理”），以及作为规划、保护和优化部分的 IT 服务连续性管理（涵盖第 9 章）。\n\n通过这些流程，设计确保了新服务或变更服务的实用性和保障在设计中都考虑，涵盖了服务的连续性、对约定容量和可用性服务水平的实现，以及对安全标准和法规的遵循。\n\
  \n### 服务目录管理\n\n`service catalog` 在 ITIL 词表中的定义如下：\n\n> 一个数据库或结构化文档，包含有关所有运行中的 IT\
  \ 服务的信息，包括可部署的服务。服务目录是服务组合的一部分，包含两类 IT 服务的信息：对业务可见的面向客户的服务，以及服务提供者交付面向客户的服务所需的支持性服务。\n\
  \n目录收集服务信息并以业务易于理解的形式呈现。目录包含了业务可用的服务详细信息；通过这种方式，它区别于服务组合的其他组件（服务流水线和退役服务）。收集和维护这些信息是服务目录管理的工作。服务目录应该让那些有权访问它的人能够轻松获取。信息的视图可能会根据受众而异——例如，技术支持人员对服务的视角与用户不同。\n\
  \n该流程管理服务目录中包含的信息，确保服务目录是准确的，并反映了运行环境中运行或正准备运行的所有服务的当前细节、状态、接口和依赖关系。\n\n### 服务水平管理\n\
  \nITIL 指出，服务水平管理的目的是确保所有当前和计划中的 IT 服务都能交付到约定的可实现目标。服务水平管理主要关注服务的保障方面。新服务的响应时间、容量、可用性等将是\
  \ `SLA` 的主题。\n\n服务水平管理关注定义服务、在协议中记录这些服务，然后确保目标得到衡量和实现，在必要时识别未能达到目标的原因，并尽可能提高所交付的服务水平。这些改进通常作为持续服务改进的一部分进行。该流程要求对\
  \ IT 服务目标和实现情况进行谈判、达成一致、监控、报告和审查的周而复始循环。\n\n### 供应商管理\n\nITIL 将 `supplier management`\
  \ 定义为负责从供应商处获得价值的流程，确保与供应商的所有合同和协议都支持业务需求，并确保所有供应商履行其合同承诺。\n\n\n\n\n供应商管理流程描述了管理供应商的最佳实践，以确保他们提供的服务符合预期。供应商管理的目的是确保供应商提供物有所值的服务。通过管理供应商，服务提供者可以确保为客户提供最佳的服务交付。管理供应商可确保必要的合同均已到位并得到执行。在服务设计过程中，考虑这一方面至关重要。\n\
  \n## 设计协调流程概述\n\n现在让我们更详细地查看剩余的设计 SOA 流程：设计协调流程。我们将考虑该流程的目的、目标、范围以及对业务的价值。\n\n服务设计涉及许多不同方面，不仅仅是设计一个新应用程序以提供新功能（效用/utility）。必须考虑服务在现在和未来将如何运行；需要提供何种水平的可用性、安全性、连续性和能力；以及实现这些点的最佳方法（保障/warranty）。其他流程将与服务设计流程相对接。为了确保获得成功的成果，必须对设计活动进行协调。\n\
  \n### 目的\n\n`design coordination` 流程的目的是对服务设计的许多不同活动进行协调。涉及的许多流程和众多接口都是潜在的冲突来源。通过提供单一接触点，应该避免复杂问题和误解。\n\
  \n### 目标\n\n设计协调的目标是确保在服务设计的五个方面中都应用一致的方法。设计是一个复杂的生命周期阶段。协调设计活动是一个关键目标，因为这些活动将跨越项目、团队和供应商，并跨越了需要管理的许多冲突需求。这将包括与日常运营活动相关的时间、金钱和资源。\n\
  \n为了确保设计流程是有效的，必须对每个流程所使用的资源和能力进行协调。一个常见的挑战是，对于相同的资源可能存在重叠的需求，这就是为什么建立这种协调能力至关重要。这是一个更高层次或战略性的目标——例如，从长远来看，我们需要什么样的技能和多少位设计师？设计协调不应该是针对特定流程的个别资源管理。\n\
  \n设计协调流程负责确保服务设计包（`SDP`）的元素已汇集并交付 `SDP`。\n\n这意味着该流程还负责管理服务生命周期阶段之间的接口，确保输入和输出的质量。设计协调应确保设计符合策略、架构以及监管、法律、安全和其他治理要求。\n\
  \n### 范围\n\n设计协调流程的范围包括所有设计活动，特别是所有正在设计进入运行环境（在服务退役时为退出）的新服务或更改的服务解决方案。\n\n所需的的设计协调程度将有所不同，且应在需要时使用。某些设计工作将是项目的一部分，而另一些将仅通过变更流程进行管理，而没有正式定义的项目。某些设计工作将是广泛且复杂的，而另一些则简单快捷。\n\
  \n每个组织都需要定义标准，用于确定在每个设计的设计协调中应用的严谨程度或关注度。当我们考虑设计协调流程的进一步范围时，它应该包括协助和支持每个项目或其他重大变更。该流程还负责为所有服务设计流程和活动维护策略、指南、标准、预算、模型、资源和能力。在战略层面，设计协调将负责服务设计资源的协调、排序和调度，以满足所有项目和变更的冲突需求。这对大多数组织来说是一个重大挑战。它将涉及规划和预测未来服务设计活动所需的资源。\n\
  \n由于该流程负责确保设计生命周期阶段的输出，它将参与评审、衡量和改进所有服务设计活动和流程的性能。这将确保所有需求在服务设计中得到恰善解决，特别是效用和保障需求。服务设计协调流程的最后一个活动是确保服务设计和/或\
  \ `SDPs` 的产生并将其交由服务过渡。\n\n### 价值\n\n设计协调流程对业务的主要价值是产生一系列质量一致的解决方案设计和服务设计包，这些设计将提供预期的业务结果。\n\
  \n设计协调将改进以下每一个方面：\n\n*   通过确保设计在可接受的风险和成本水平内进行，实现服务预期的业务价值\n*   减少与在后期服务生命周期阶段中重做设计问题而相关的返工和非计划的人力成本\n\
  *   支持实现更高的客户和用户满意度，并增强对 IT 以及所收到的服务的信心\n*   确保所有服务符合一致的架构，允许服务与系统之间的集成和数据交换\n*\
  \   提高对服务价值以及业务和客户结果的关注\n*   提高所有服务设计活动和流程的效率和有效性，支持以及时且具有成本效益的方式交付更多成功的变更\n*  \
  \ 在项目和重大变更中，实现服务解决方案设计更大的敏捷性和更好的质量\n\n## 效用、保障与 SOA 流程的相关\n\n接下来，我们将考虑什么让服务在客户眼中具有价值，以及服务提供者采用营销思维的必要。我们还将查看效用（utility）和保障（warranty）的概念。\n\
  \n### 价值\n\n服务的价值取决于它在多大程度上符合客户的预期以及它让客户能够做什么，因此其价值是由使用它的客户决定的。价值的关键特征如下：\n\n* \
  \  **由客户定义的价值**：价值不在于提供的成本；某服务的提供成本可能很低，但被客户高度看重，或者反之亦然。\n*   **负担得起的功能组合**：客户将始终根据他们愿意支付的价格下所获得的最佳功能组合来判断服务的价值。\n\
  *   **目标的实现**：服务通常根据其提供的财务回报来衡量，但许多服务还有其他目标，其价值源于这些目标的实现程度。例如，医疗服务将侧重于治疗的成功结果；警察可能侧重于犯罪率的降低。如果不了解客户的目标，很难提供他们认为有价值的服务。\n\
  \n\n\n\n\n## 随时间和环境而变化的价值\n\n客户现在的需求与两年前的需求是不同的。例如，就在几年前，大多数人只是想能够通过手机连接互联网；而现在他们要求高带宽，以便流媒体体育或电视节目。许多零售组织在最近几年失败了，因为它们继续提供客户以前所看重的价值，而没有进行调整以提供客户现在想要的东西。\n\
  \n计算价值有时可以是一个直接的财务计算：该服务是否以适当的成本实现了所需的结果？如果成本不影响盈利且价格保持竞争力，那么该服务就是有价值的。然而，要归因价值，服务提供者需要理解三个特定的输入：\n\
  \n* 提供了哪些服务？\n*   服务实现了什么目标？\n*   它们的成本是多少，或者支付的价格是多少？\n\n这些问题的答案将使服务提供者能够向客户证明价值。但服务提供者始终受限于客户对价值的感知。\n\
  \n如果我们从客户的角度来考虑价值，那么有三个因素构成了对价值的理解，如图 16.4 所示。如你所见，价值的定义取决于所实现的业务成果，以及客户对交付内容的偏好和感知。\n\
  \n![图像显示了代表业务成果、偏好和感知的三个圆的维图。中心圆内有价值。](img/00075.jpeg)\n\n**图 16.4** 价值的组成部分\n\n\
  Copyright © AXELOS Limited 2010\\. 版权所有。材料根据 AXELOS 的许可复制。\n\n客户的感知受到服务属性、客户当前或先前的经历，以及组织的形象或市场地位的影响。偏好和感知是选择一个服务提供者而非另一个的基础，通常情况下，价值越无形，价值的定义和差异化就越重要。这在图\
  \ 16.5 中所示，该图基于 Nagle 和 Holden 在 2002 年完成的研究。Nagle, T.N. and Holden, R.K., *Strategy\
  \ and Tactics of Pricing: A Guide to Profitable Decision Making, 3rd edition* (Prentice-Hall,\
  \ 2002)。\n\n![条形图显示了两个参考线之间的感知价值、正差异、负差异、净差异（负值与正条形值之间的差异）以及服务的经济价值。](img/00076.jpeg)\n\
  \n**图 16.5** 客户如何感知价值\n\nCopyright © AXELOS Limited 2010\\. 版权所有。材料根据 AXELOS 的许可复制。\n\
  \n客户感知价值的基础是存在一个客户可以以此为判断依据的价值。这被称为*参考值*（reference value）。参考值是之前讨论的感知，基于当前或先前的经历。利用服务所获得的收益被视为正差异，即对参考值的补充。在理想情况下，这将形成客户的价值感知。但利用服务并不总是被视为一种正向体验。中断将产生负差异，从而损害现有的正感知。这显示为*净差异*（net\
  \ difference）。\n\n因此，在最终分析中，对服务经济价值的感知将是原始参考值和净差异。任何负面感知都可能对服务的整体感知产生重大影响。\n\n###\
  \ 营销思维\n\n在为 IT 服务提供者制定策略时，拥有营销思维是有用的。这不仅限于通过广告服务来影响客户感知，还包括理解客户的背景和需求，并确保服务旨在满足客户认为重要的结果。与其关注服务的生产，不如需要从外向内看，从客户的角度来看待问题。\n\
  \n营销思维始于这些简单的问题：\n\n* 我们的业务是什么？\n* 我们的客户是谁？\n* 客户看重什么？\n* 谁依赖我们的服务？\n* 他们如何使用我们的服务？\n\
  * 为什么这些服务对他们有价值？\n\n营销思维使服务提供者能够从客户的角度理解价值的组成部分。\n\n### 效用与保证\n\n正如我们之前讨论的，在考虑服务的价值时，服务提供者应该关注交付业务成果和实现业务目标。价值是通过交付服务的两个主要要素创造的：*效用*（适用性）和*保证*（可用性）。这两个要素共同工作，交付所需的结果，允许客户评估价值。\n\
  \n效用是产品或服务为满足特定客户需求而提供的功能。通常被总结为“服务做什么”，这显示了服务是否能够满足所需的结果。这也被称为“适用性”（fit for purpose）。服务价值的这一方面指的是与实现结果相关的任务。\n\
  \n保证提供了产品或服务将符合约定要求的确保。这可以作为正式协议的一部分，例如服务水平协议（SLA）或合同。它指的是服务在需要时可用、具有足够的容量来满足需求，并在安全和连续性方面是可靠的。这通常被总结为“服务是如何交付的”，通常被称为“可用性”（fit\
  \ for use）。\n\n效用是服务做什么，而保证是它是如何交付的，如图 16.6 所示。效用将提高用于实现结果的任务的性能，或消除防止任务充分执行的限制。保证确保服务是可用、连续且安全的，并具有足够的容量以便其能够在所需的水平上运行。如果服务既适用目的又可用使用，它将创造价值。\n\
  \n![图像显示了服务交付的过程，其中业务服务位于中心，连接到业务流程 1、2 和 3、SLAs/SLBs、基础设施、环境、数据等。列出了 IT 服务的需求。](img/00077.jpeg)\n\
  \n**图 16.6** 服务的设计、构建和交付同时考虑了效用和保证。\n\nCopyright © AXELOS Limited 2010\\. 版权所有。材料根据\
  \ AXELOS 的许可复制。\n\n客户无法从适用但不可用的东西获益，反之亦然。只有当交付了所需的效用和保证时，才能实现价值。如果只关注效用，客户可能会选择更便宜的选项，但由于没有提供所需的可用性，这将无法交付价值。重要的是，如果没有规划和投入的增加，增加效用可能无法提供所需的保证。\n\
  \n\n\n\n\n有效的服务设计取决于对五个关键方面的整体方法。我们在第 7 章“规划、保护和优化的介绍”中已经考虑过这五个方面。关键方面是设计新的或变更的服务解决方案，以满足不断变化的业务需求。每个新解决方案都必须检查，以确保它符合这五个方面，并能够与其他服务成功对接。\n\
  \n我们需要确保这五个方面中的每一个都考虑了预期的业务结果和计划结果，以便最终交付的服务能够满足客户和使用者的预期。这五个方面是：\n\n* 实际解决方案本身的设计\n\
  * 管理该服务所需的服务管理系统和工具\n* 服务将使用的管理架构和技术架构\n* 支持服务运行所需的流程\n* 所需的测量系统、方法和指标\n\n这种整体方法还考虑了服务的组成部分及其相互关系，确保交付的服务在以下方面满足业务需求：\n\
  \n* 服务为了满足未来需求的扩展性\n* 服务支持的业务流程和业务单元\n* 对功能性上约定的业务需求（即：效用 utility）\n* 服务本身及其服务水平要求或\
  \ SLA（解决保障 warranty）\n* 所选用的技术组件，包括基础设施、环境、数据和应用程序\n* 支持性服务和组件及其相关的运营水平协议（如果是内部支持），或底层合同（如果由外部第三方支持）\n\
  * 所需的性能测量和度量标准\n* 所需的安全级别\n* 可持续性需求\n\n这些元素之间的关系和依赖关系如图图 16.7](#part0026_split_003.html_figure16-7)所示。\n\
  \n![图像显示了服务关系和依赖关系，代表不同类型的业务单元，通过服务类型、基础设施、OLA 和支持性服务连接到团队和供应商。](img/00078.jpeg)\n\
  \n图 16.7 服务关系与依赖关系\n\nCopyright © AXELOS Limited 2010\\. 保留所有权利。材料根据 AXELOS 的许可进行复制。\n\
  \n## 业务需求和驱动因素\n\n业务驱动因素是支持业务目标实现的人、信息和任务。IT 服务提供者必须理解业务需求和驱动因素，以确保其提供符合业务需求且服务质量水平可接受的服务。第\
  \ 19 章涵盖的业务关系管理过程有助于确保服务提供者理解业务的运营、战术和战略需求。为了维持服务的同步，需要三个主要领域的业务信息：现有服务、新服务和退役服务的需求。\n\
  \n### 现有服务\n\n关于现有服务变更所需的信息示例可能包括：\n\n* 新的设施/特性和功能性需求（效用 utility）\n* 业务流程、依赖关系、优先级、关键性和影响的变更\n\
  * 服务交易量的变化\n* 由于新的业务驱动因素导致的服务水平和的水平目标增加，或由于旧服务而减少，从而降低了那些待更换服务的优先顺序（保障 warranty）\n\
  * 业务合理性，包括财务和战略方面\n* 对额外服务管理信息的需求\n\n### 新服务\n\n新服务所需的信息示例可能包括：\n\n* 所需的设施/特性和功能需求（效用\
  \ utility）\n* 所需的管理信息和管理需求\n* 所支持的业务流程、依赖关系、优先级、关键性和影响\n* 业务周期和季节性变化\n* SLR 和服务水平目标（保障\
  \ warranty）\n* 业务交易水平、服务交易水平、用户数量和类型以及预期的未来增长\n* 业务合理性，包括财务和战略方面\n* 预测的变更水平——例如，已知的未来业务需求或增强\n\
  * 将提供的业务能力水平或支持水平——例如，基于本地业务的支持\n\n### 退役服务\n\n退役服务所需的信息示例可能包括：\n\n* 精确的退役范围：哪些设施/特性和功能将退役\n\
  * 业务合理性，包括财务和战略方面\n* 什么（如果有的话）将取代退役的服务\n*与其他服务、组件或配置的接口和依赖关系\n* 与退役服务相关的服务资产和配置项的处置和/或重复使用需求\n\
  * 与退役策略和计划相关的业务需求，例如退役的时间和使用的退役方法（即：分阶段退役）\n* 对任何业务数据的归档策略，以及对与退役服务相关的存档数据的任何潜在访问需求\n\
  \n这些信息必须准确且完整，并与高级业务代表达成一致并签署。错误的信息将导致交付不符合业务需求的服务。随着随时间的变化，这些变化也必须被捕获，同时要防止“范围蔓延”。信息应包括所有利益相关者的识别；需求的优先级排序、一致和记录；概述预算；业务收益。应就可实现的服务与成本之间的平衡与业务部门达成一致。\n\
  \n## 投资回报率和业务理由\n\n本介绍章节的最后一个主题涵盖了 ROI（投资回报率）和业务理由。\n\n### 投资回报率\n\n投资回报率 (`ROI`)是一个衡量投资价值的认可概念。这种计算通常由财务管理执行。该术语并不总是一致使用，有时用于计算业务性能。在服务管理中，`ROI`\
  \ 用于衡量利用资产产生额外价值的能力。\n\n从最简单的意义上，它是服务产生的利润增加除以对该服务的总投资。然而，这种计算过于简单——在为客户的服务管理价值中，需要考虑许多主观因素。一个项目可能旨在提供定性而非定量的收益。例如，更改公司标志或改进组织网站的可用性、外观和感受，可能会间接导致销售额增加或客户忠诚度提高，但这并不是简单的计算。\n\
  \n为了涵盖这种主观性，ITIL 在 `ROI` 中涵盖了三个主要领域：\n\n* 业务理由，它是识别取决于服务管理的业务必要性的手段；我们将在稍后详细讨论。\n\
  * 项目前 `ROI`，包括量化分析服务管理投资的技术。\n* 项目后 `ROI`，包括回顾分析服务管理投资的技术。\n\n外部服务提供者的服务经济动态和 `ROI`\
  \ 的计算与内部服务提供者不同。\n\n\n\n\n\n图 16.8 展示了外部 IT 服务提供商如何向外部客户提供服务并付费。服务提供商衡量交付服务所获得的总收入与交付该服务所需的总投资之间的对比。\n\
  \n![图像显示服务提供商向客户发送服务并收回收入。客户分为三个客户结果。投资和投资回报连接到外部服务提供商。](img/00079.jpeg)\n\n`图 16.8`](#part0026_split_004.html_figureanchor16-8)\
  \ 外部服务提供商的服务经济动态\n\nCopyright © AXELOS Limited 2010\\. 版权所有。材料根据 AXELOS 的许可复制。\n\
  \n对于内部服务提供商，IT 服务的投资由业务部门承担，而不是服务提供商。这意味着提供给 IT 服务提供商的资金不能被视为投资回报，因为投资是由业务部门做出的。回报必须根据业务部门产生的利润进行计算，且投资回报率（ROI）的计算由业务部门执行。图\
  \ 16.9 展示了内部 IT 服务提供商如何向另一个业务部门提供服务，以涵盖 IT 服务的成本。\n\n![图像显示内部服务提供商向业务部门（内部客户）发送\
  \ IT 服务并接收资金。业务部门（内部客户）向客户（外部）发送业务服务并获得收入。](img/00080.jpeg)\n\n`图 16.9`](#part0026_split_004.html_figureanchor16-9)\
  \ 内部服务提供商的服务经济动态\n\nCopyright © AXELOS Limited 2010\\. 版权所有。材料根据 AXELOS 的许可复制。\n\
  \n### 业务案例 (Business Case)\n\n业务案例是一种决策支持和规划工具，用于预测业务行动可能产生的后果。结果可以根据定性和定量标准进行评估。财务分析通常是良好业务案例的核心。表\
  \ 16.1 显示了业务案例的结构。\n\n| 标题 | 描述 |\n| --- | --- |\n| A. 引言 | 介绍服务所解决的业务目标。 |\n| B.\
  \ 方法和假设 | 定义业务案例的边界，例如时间范围，以及使用什么组织背景来定义成本和效益。 |\n| C. 业务影响 | 预期服务或服务管理计划将产生的财务和非财务结果。请注意，许多非财务结果也可以用财务术语表示。例如，员工士气的提高会导致员工流动率降低，从而减少招聘和培训的支出。\
  \ |\n| D. 风险和突发情况 | 出现替代结果的概率。 |\n| E. 建议 | 建议的特定行动。 |\n\n`表 16.1`](#part0026_split_004.html_tableanchor16-1)\
  \ 业务案例示例结构\n\n业务目标是业务案例的重要部分，并将作为申请资金的理由。营利组织与非营利组织的业务目标之间存在差异。任何服务提供商在构建业务案例时，都必须考虑这种差异。\n\
  \n业务影响是业务案例的另一个核心部分，但通常基于成本分析。如果存在非财务业务影响，应将其与业务目标起来以提供价值。这通常包括将非财务结果转换为财务术语，例如将员工状况的转化为培训和招聘支出的减少。\n\
  \n一个最简单的业务案例示例结构包括引言（介绍要解决的业务目标），随后是所使用的方法和假设。这定义了业务案例的边界，例如期限以及如何计算效益和成本。风险和突发情况对决策过程至关重要，必须包含业务案例中。最后部分应涵盖建议和特定行动。\n\
  \n`业务案例 (business case)` 一术语可能意味着仅包含服务或项目的财务方面。事实并非如此。应当包含拟议项目或服务的财务和非财务影响。\n\n\
  ## 总结\n\n本章介绍了服务供给（service offerings）和服务协议（agreements）。考虑了服务供给的创建与管理，以及支持它们所需的协议。介绍了服务策略和设计中的相关流程，这些流程将在后续章节中进行详细介绍。我们还考虑了\
  \ IT 服务的策略管理和设计协调。我们看了识别客户需求时的因素，以及投资回报和业务案例的基本概念。\n\n## 考试要点\n\n**理解服务策略的重要性。**\
  \ 如果没有特定的策略来指导 IT 方法，将面临管理不当或无法提供客户所需内容的严重风险。\n\n**理解良好的设计如何为业务带来财务和其他利益。** 通过确保设计符合业务需求并能适应变化的需求，避免了完全重新设计服务的需要，从而使总拥有成本最小化。\n\
  \n**在组织背景下解释服务价值。** 回忆并解释在开发策略中使用`效用 (utility)`和`保证 (warranty)` 术语的作用。\n\n**了解设计协调的和目标。**\
  \ 能够解释设计协调流程的目的和目标对你是非常重要的。该流程的存在是为了确保设计的五个方面得到成功执行，并创建和发布服务设计包（service design package）。\n\
  \n**理解服务必须设计为适应未来的需求。** 服务应该易于扩展或开发，以便能够轻松地扩展或开发以满足变化的需求。\n\n**能够列出并解释服务设计的五个方面。**\
  \ 能够命名并描述服务设计的五个方面（解决方案、管理系统、架构、流程和指标）以及它们为什么重要。\n\n## 复习题\n\n你可以在附录中找到复习题的答案。\n\
