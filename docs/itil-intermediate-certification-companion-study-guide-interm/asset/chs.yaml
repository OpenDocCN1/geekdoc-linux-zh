  3. B. 由于他们与服务提供者属于不同的组织，因此他们是外部客户。选项 D 中提到的人（内部客户）与服务提供者属于同一组织。选项 A 和 C（战略客户和价值客户）可能属于也可能不属于其他组织。\n\
  4. A. 流程必须有一个所有者以确保其被遵守，有一项政策来指导其活动，以及详细活动本身。选项 B 只有流程程序，这是有效的。在选项 C 中，流程不需要 OLA。在选项\
  \ D 中，每个流程可能只包含工作说明。\n5. D. 服务设计监督新服务或变更服务的设计。其他三个选项将在某些阶段参与。设计将在变更管理（选项 A）下进行，接收来自服务策略（选项\
  \ C）的输入，并向服务过渡（选项 B）提供输出。\n6. B. 服务过渡将确保变更符合时间、成本和质量目标，从而为业务交付价值。选项 A 是服务水平的目标。选项\
  \ C 是服务运营的目标，选项 D 与服务目录管理有关。\n7. A. 只有语句 1 是服务运营的目的。服务运营通过其流程和功能在约定的水平上管理服务。陈述 2\
  \ 是服务过渡的目的。\n8. A. 业务案例将包含成本、收益和风险，允许组织对行动的可行性做出明智决策。选项 B 描述的是一个公文包！选项 C 描述了服务评审会议上可能提出的问题。选项\
  \ D 描述的是可能在业务案例中进行评估的内容，但不是业务案例本身。\n9. C. 两个语句都是正确的。在语句 1 的情况下，监控器本身可能是一个配置项（CI），但当与基础单元结合时，可以是\
  \ PC 配置项的一部分。第二个陈述也是正确的。例如，组织选择记录其硬件情况的详细程度可能取决于行业法规对控制水平的要求。\n10. D. 这是书本上的定义。选项\
  \ A 描述了可维护性的一个要素。选项 B 是可维修性。选项 C 仅关注服务台和技术，*不涉及*服务，因此是错误的。\n11. D. 将定义介质库（DML）的介质逻辑列表作为\
  \ CI 存储在 CMS 中，这定义了为什么它是服务资产和配置管理的职责范围。其他三个可能参与，但仅处于较次要的角色。设施管理（选项 A）可能负责防火保险箱，允许实际介质的物理存储。访问管理（选项\
  \ B）可能涉及授予使用 DML 的权限。请求履约（选项 C）可能是用户和客户访问 DML 中组件的途径。\n12. C. 这是对问题的书本定义。\n13. A.\
  \ CSI 注册表包含了所有待考虑的改进机会。选项 B（已知错误数据库）顾于名称，包含了已知错误。选项 C 是错误的，因为容量管理信息系统包含业务、服务和组件数据，以便容量管理流程能够运行。选项\
  \ D（CMDB）包含 CI 信息。\n14. B. 价值的感知由客户偏好（选项 A）定义——即他们想要什么；客户感知（选项 C）定义——即如果他们认为它有价值，它就有价值；以及结果的交付（选项\
  \ D）定义——即它使他们能够完成任务。业务政策不属于此计算的一部分。\n15. A. 服务设计的平衡通过流程、产品、合作伙伴和人的平衡来实现。\n16. A.\
  \ 技术指标是 CSI 使用的三个类别之一。组件通过它们进行衡量。另外两种类型是过程（选项 B）和服务（选项 C）。客户满意度不属于这三类中的任何一。\n17.\
  \ C. 流程的最后阶段是“我们如何保持势头？”\n18. C. 服务指标衡量覆盖整个服务的要素。在可用的两种类型指标（技术和过程）中，函数的性能（选项 A）可能通过对流程的遵循情况或其他流程成功指标来衡量。成熟度（选项\
  \ B）是一个过程指标。基础设施可用性（选项 D）是一个技术指标。\n\n\n\n\n## 19. D\n`SLAM` 图表以简单的直图形式显示了相对于服务目标的进展。选项\
  \ A (`OLA`) 是支持 `SLA` 的内部支持目标。选项 B (`capacity plan`) 显示了组织内部对容量的未来需求和计划。选项 C (`SLA`)\
  \ 包含了 `SLAM` 图表用作目标的指标。\n\n## 20. B\n服务水平需求文档记录了客户对服务的实际需求，这些需求可以由服务提供者验证，并可能在签署\
  \ `SLA` 之前通过谈判进行修改。选项 A (`OLA`) 是支持 `SLA` 的内部支持目标。服务目录（选项 C）将作为开始讨论服务水平需求的基础。选项\
  \ D（`CMDB`）不作为此流程的一部分。\n\n## 21. A\n如果变更失败，则需要补救计划，因此应在批准变更之前进行评估。如果认为补救计划不充分，风险将大大增加，因为变更失败可能无法恢复到之前的状态，因此提议的变更可能被拒绝。选项\
  \ B 是错误的，因为在即将使用计划时进行评估已经太晚了。选项 C 是错误的，因为如果变更成功，计划可能不会被使用。选项 D 是错误的，因为补救计划是为了在失败时立即撤回变更。在实施后审查中发现的问题需要授权第二次变更来解决该问题。\n\
  \n## 22. C\n`PSO` 和变更计划实际上是客户和服务提供者对正在发生的变更的视图。它们可能会根据 `CAB` 的决定进行更新。错误答案中提到的其他文档不在\
  \ `CAB` 的变更职责范围之内——即 `SLA`、服务管线和服务目录。\n\n## 23. A\n我们对任何事物（包括事件）进行分类的原因是为了更易于管理。通过类别识别反复发生的事件将有助于更方便地提出问题。仅仅对事件进行分类并不能意味着\
  \ `SLA` 一定会被违背（选项 B）。事件管理数据库的分区（选项 C）在决定事件类别时不是考虑因素。在某些情况下，分类可以被用于判断用户是否可以记录事件（选项\
  \ D），但问题问的是*最佳*理由。\n\n## 24. B\n只有语句 2 是正确的。语句 1 是不实际的。一个组织可以有一个用于恢复打印服务的事件模型。打印服务实际上可能支持多个\
  \ `SLA` 目标，因此将它们包含在模型中意义不大。事件本身将是恢复目标的指南。事件模型告诉我们如何处理该类型的事件，因此步骤的时间顺序是必须包含的。\n\n\
  ## 25. B\n这是问题管理的目标之一。\n\n## 26. A\n共享分类和影响代码使得将事件与问题及已知错误匹配成为一项更更容易、通常是自动化的任务。问题管理将在其流程中使用\
  \ `CMDB`（选项 B），但不会共享类别。容量管理（选项 C）将与问题管理共享数据，但不共享代码和类别。`ITSC`（选项 D）可能会与问题管理共享用于风险评估的信息（包括影响代码），但极不太可能共享类别。\n\
  \n## 27. B\n财务管理将使用成本模型、`ROI` 分析等来理解服务的财务价值。服务水平管理（选项 A）可能从客户满意度理解服务的非财务价值。需求管理（选项\
  \ C）将识别可能通过增加容量来维持服务价值的趋势。风险管理（选项 D）虽然不是 ITIL 流程，但也可以从减少风险的角度衡量服务的价值，但这仍然是非财务的。\n\
  \n## 28. B\n服务目录将通过其业务和技术组件记录接口和依赖关系。服务水平管理（选项 A）使用目录来理解依赖关系。需求管理（选项 C）和服务转换（选项\
  \ D）将使用目录，但不会在其中记录细节。\n\n## 29. A\n这是容量管理的三个子流程。\n\n## 30. C\n设计协调负责实用性（用途适用性）和保证（使用适用性）。可用性（选项\
  \ A）和容量（选项 B）都只涉及保证。发布和部署（选项 D）是一个服务转换过程，因此不值得作为正确答案考虑。\n\n## 31. B\n构建和测试是发布和部署流程的第二阶段。其他流程在测试中的参与非常细微。\n\
  \n## 32. C\n知识是经验和想法的集合，是理解如何执行某活动所需的元素。数据（选项 A）在被处理成信息（选项 B）后会变得更有价值。这些信息成为知识的基础。治理（选项\
  \ D）涉及政策和控制，与此无关。\n\n## 33. A\n服务转换规划和支持几乎在服务转换中承担了项目管理的角色，这意味着规划和资源协调在范围内。 B 描述了变更管理的角色。记录和跟踪（选项\
  \ C）由服务资产和配置管理完成，而测试脚本（选项 D）是发布和部署管理的一部分。\n\n## 34. C\n服务台人员缺勤将通过 ITIL 范围之外的 HR\
  \ 系统记录。所有其他区域都可以在事件管理流程下进行监控。\n\n## 35. C\n投诉、感谢和一般咨询几乎完全由服务台处理请求履行流程。服务水平管理（选项\
  \ A）可能处理投诉，但在客户层面，并且通常不接受一般咨询。此类交互远超出服务组合管理（选项 B）和需求管理（选项 D）的范围。\n\n## 36. D\n单一集中服务台支持整个组织。选项\
  \ A 描述的是本地服务台。选项 B 是虚拟服务台，选项 C 描述的是服务台的模式模式。\n\n## 37. B\n应用管理负责功能。选项 A 是错误的，因为定义供应商的位置可能是由供应商管理定义和管理的策略。C\
  \ 更可能由技术管理提供建议。选项 D 是错误的，因为约定服务水平是服务水平管理的领域。\n\n## 38. A\n服务所有者了解其服务的监控和运行，但实际上不会直接参与该活动。其他三个活动都是服务所有者角色的一部分。\n\
  \n## 39. A\n一个流程应该只由一个人负责。这立即导致选项 A 错误。某项活动不需要咨询（选项 B）；例如，记录一个服务台电话不需要咨询其他人。选项 D\
  \ 是错误的，因为可能由多个人负责。\n\n## 40. B\n技术和自动化可以帮助监控（选项 1），例如服务器的可用磁盘空间。模式识别（选项 2）也可以自动化，例如通过服务台工具集识别重复的事件。优先级排序（选项\
  \ 4）也可以通过工具自动化，例如，当针对特定类型服务记录事件时。智慧（选项 3）无法自动化。\n\n# 第一部分\n## 运营支持与分析\n\n# 第一章\n\
  ## 运营支持与分析简介\n\n**本章讨论了以下 ITIL 运营支持与分析能力中期考试目标：**\n\n* OSA 活动对业务的价值\n\n\n\n\n\n\
  *   ![images](img/00005.jpeg) 服务生命周期中 OSA 活动的上下文\n*   ![images](img/00005.jpeg)\
  \ OSA 活动如何支持服务生命周期\n*   ![images](img/00005.jpeg) 优化服务运行性能\n*   ![images](img/00005.jpeg)\
  \ 与所有服务管理过程相关的通用角色\n\n![](img/00006.jpeg) 服务运行的主要目标是按照约定的水平向业务用户和客户交付并管理服务。服务运行阶段是实际交付服务的阶段，这个阶段通常比之前的策略、设计和过渡阶段要长得多。它是生命周期中对业务而言可见的部分。我们将涵盖服务运行过程的用途、目标和范围，以及它们在服务生命周期中的上下文。我们将探讨为业务提供的价值，并讨论这些过程中涉及的基本概念和定义。\n\
  \n## 理解运营支持与分析（OSA）过程的、目标和价值\n\n服务策略、设计和过渡的产出在服务运行阶段变得可见。正是在运行阶段，最初在策略中被考虑、在设计中组装并在过渡阶段实施的服务，才交付了业务所需且服务设计时旨在交付的利益。它也是生命周期中比前三个阶段长得阶段；服务应该在几个月甚至几年内持续满足定义的业务需求。\n\
  \n大多数 IT 人员（在不同程度上）都参与了服务运行阶段。他们可能对生命周期的其他阶段做出贡献，但他们的主要重点是运营服务的交付。\n\n服务运行是服务生命周期中的一个关键阶段。毕竟，如果服务管理不当，最好的策略也会失败；如果服务运行得不有效，良好的设计价值也有限。只有当服务要过渡进入的环境准备好接收它并承担管理它的责任时，过渡才可能成功。最后，如果没有来自性能监控和其他数据的可靠指标，服务改进将无法实现。服务运行收集了用于\
  \ `baselines` 和衡量改进成功的测量数据，因此，一致且系统的测量是服务运行的关键要素。\n\n工作在服务生命周期这一阶段的人员需要完善的 `processes`\
  \ 和支持工具以便他们能够开展工作——能够让他们对服务运行和交付有整体视图的监控工具，以便他们能够快速检测并解决故障。他们还需要服务管理工具，以确保每个过程都发生正确的工作流，并易于访问必要信息。这可能涉及监控外部提供商提供的服务要素。\n\
  \n由于服务可能全部或部分由一个多个 `partner`/`supplier` 组织提供，端到端服务的运行视图需要涵盖服务提供的外部方面，包括管理跨组织的工作流。\n\
  \n**过程（Process）** `process` 被定义为“一组旨在实现特定目标的协调活动。过程接受一个或多个定义的输入并将其转换为定义的输出。”\n\n\
  运营支持与分析中包含的过程如下：\n\n### 事件管理（Event Management）\n该过程关注有关 IT 基础设施和服务的有用通知。事件管理通过建立规则来确保生成事件，以便在必要时对其进行监控、捕获并采取行动。\n\
  \n### 事件管理（Incident Management）\n事件管理的目的是尽快地为用户恢复正常的 IT 服务。这可能会引发一个问题：我们如何定义 `normal\
  \ service`？它是在服务水平协议（SLA）中指定并同意的服务水平。其目标是尽可能地减少事件对业务（以及随后对服务质量和业务生产力）的负面影响。事件管理的目标是保持尽可能好的与业务对齐的服务质量水平。\n\
  \n### 问题管理（Problem Management）\n问题管理的责任是管理问题的生命周期，这在管理问题直到结论之外，还包括对过程进行监控和审查。问题管理关于事件的预防和减少，解决并消除其根源。至少，如果无法预防事件，则应通过已知错误数据库（known\
  \ error database）提供的变通方案来减少对业务的影响。\n\n### 请求履行（Request Fulfillment）\n请求履行过程的目标是以简单、高效的方式记录并满足用户的标准请求。为了使请求符合条件，必须存在一个预定义的审批和鉴定流程。请求履行还向用户提供有关服务可用性以及如何获取的信息。用户可以请求并接收他们使用服务所需的服务或软件/硬件。请求履行也是通用信息、投诉和意见的渠道。\n\
  \n### 访问管理（Access Management）\n访问管理负责将可用性和信息安全管理策略付诸日常实践。控制访问以保护组织的数据和知识产权至关重要，同时让授权用户能够获得他们所需的访问权限。访问管理并不负责确保这种访问在所有约定时间内都可用——这一责任由\
  \ `availability management` 过程提供。\n\n## 运营支持与分析过程的用途\n\n服务生命周期服务运行阶段的目的是通过 `service\
  \ level management` 过程约定的水平交付服务。这包括执行交付服务所需的所有活动，以及管理用于交付服务的技术（例如应用更新和备份数据）。这些是由运营支持与分析过程执行的活动。\n\
  \n服务运行必须有效地交付服务，但还必须确保该交付成本在原始业务案例中形成的运营成本范围内。如果服务的运行成本比最初预想的要高，计划中的收益（如成本节约）可能永远无法实现。\n\
  \n服务运行工作人员必须将服务视为一个整体，并被提供他们所需的工具来评估交付是否符合要求的标准。一个常见的错误是让员工关注服务的单个方面，或者忽视由第三方提供的服务部分，从而忽视了客户眼中看到的端到端服务。可以利用技术来非常快速地发现偏离预期服务或\
  \ `response levels` 的情况，从而立即采取补救措施。\n\n## 运营支持与分析过程的目标\n\n\n\n\n\n服务运营的目标及其流程源于其目的。服务运营是客户所看到和体验到的。他们对服务提供质量的感知基于他们的体验，而不是基于服务的设计或实现（这些设计可能做得好，也可能做得不好）。务必记住，服务运营远不仅仅是管理组成服务的组件。在服务运营中，一切才汇聚在一起……或者全部分崩瓦析！\n\
  \n因此，第一个目标是通过 `SLA` 中约定的、有效且高效的服务交付和支持，来维护业务对 IT 的满意度和信心；这确保了业务获得了其所预期的服务水平。第二个目标支持第一个目标：通过发现、预防和解决可能影响业务的`incidents`（事件）和`problems`（问题），将服务`outages`（中断）对日常业务活动的影响至最低。某些服务中断不可避免；服务运营将致力于减少中断的数量和影响。问题管理的服务运营流程旨在减少干扰业务活动的事件再次发生的频率，而事件管理则旨在尽快解决已经发生的事件。\n\
  \n服务运营还负责控制对 IT 服务的`access`（访问）。最终目标是保护服务免受未经授权的访问。访问管理流程确保只有经过授权的用户才能访问所提供的服务。\n\
  \n### 运营支持与分析流程的范围\n\n`ITIL` 框架描述的服务运营范围包括用于交付和支持约定服务的“流程、职能、组织和工具”。这些流程负责执行关键的日常活动，以确保服务满足业务需求并使业务能够实现其目标。它们还收集了持续改进改进所需的性能数据，以识别并跟踪改进机会。\n\
  \n**技术** IT 服务的交付依赖于对适当技术的使用，如网络、台式电脑、服务器、数据库和监控工具。服务运营负责管理交付服务的技术。\n\n**人员** 尽管有自动化，但服务运营仍依赖于支持人员的操作，以确保服务按预期方式运行。他们对技术和流程的管理是成功交付服务的关键。\n\
  \n## 运营支持与分析流程为业务交付的价值\n\n服务运营负责运行新服务并修复任何不可预见的缺陷。如果服务的成本要低于为业务带来的收益，该服务就必须高效运行。`ITIL`\
  \ 框架为在各个生命周期阶段可以使用的最佳实践提供了指导，遵循这些建议可以带来真正的利益。在服务运营领域，遵循最佳实践可以获得以下收益：\n\n*   通过实施问题管理和事件管理服务运营流程，减少停机时间带来的财务节约。问题管理将减少故障频率，从而减少业务因无法工作而浪费的时间（以及金钱）。它将确保熟练的\
  \ IT 人员精力集中在识别和消除事件的`root cause`（根因），从而防止再次发生。同时，高效的事件管理确保服务能够尽快恢复，通常由服务台台人员使用定义的`workarounds`（替代方案）。这既加速了服务的恢复，又降低了成本，后者是因为不需要派遣资历更高的\
  \ IT 人员来解决简单的事件。\n\n*   服务运营还产生有关服务交付效率和效果的管理信息。这些信息被其他流程用于针对、论证和实施持续服务改进倡议。技术可以用于自动化此类报告的生成，降低生产成本。\n\
  \n*   通过执行访问管理活动，服务运营确保业务能够满足组织安全策略的目标和目标，确保只有获得授权的人员访问 IT 服务；根据组织安全策略保护服务免受未经授权的访问。\n\
  \n*   服务运营还通过请求履行提供对标准服务的快速有效访问。这通过让用户能够快速访问实现最佳效率所需的服务和设备，提高了用户的生产力，同时保持对支出的控制。技术可为用户提供自助服务设施，例如重置密码、订单标准物品或通过\
  \ Web 门户记录事件。这为提供这些服务提供了一种高效且成本效益的方法。\n\n*   通过根据事件管理流程提供的信息利用技术自动化常规任务，服务运营减少了运营服务所需的人员。这意味着随着用户数量的增加和服务复杂性的增加，支持用户所需数基本保持不变。这降低了成本，并让技术人员空出来专注于识别改进和新机会。自动化还提供了更可靠、更一致的服务。\n\
  \n*   服务运营还提供运营结果和数据，这些数据被其他 `ITIL` 流程作为服务改进需求的证据（回答“我们现在在哪里？”的问题）或作为服务改进活动投资的合理性依据。它还提供了回答“我们到达那里了吗？”所需的数据。\n\
  \n### 服务运营如何提供业务价值\n\n服务生命周期中的每个阶段都为业务提供价值，但正如我们所说的，从客户的角度来看，真正的价值是在服务运营中看到的。除了服务的日常运行，服务运营还需要继续交付业务价值还需要应对其他挑战。这些挑战集中在对该生命周期这一阶段的投资意愿较低上。服务运营需要在预计成本内交付服务以实现`return\
  \ on investment (ROI)`（投资回报率），但一旦项目交付，可能很少或没有预算用于服务的持续管理成本（例如修复设计缺陷或不可预见的需求），因为这超出了原始项目范围。\n\
  \n大多数组织从未对运营服务的设计和价值进行正式评审。事件和问题管理预计会解决问题，但如果设计从根本上存在缺陷，这些缺陷可能无法被识别。\n\n服务运营可能难以获得改进效率的工具或改进措施（包括培训）的必要预算，因为它们与特定服务的功能没有直接联系。尝试优化服务或使用新工具更有效地管理服务，只有在服务过去出现很多问题时才被认为是成功的；否则，任何行动都被视为“修理没有坏掉的服务”。\n\
  \n## 服务运营、运营支持与分析流程以及服务生命周期的背景\n\n\n\n\n\n服务运营需要在整个服务生命周期的背景下进行考虑。`lifecycle` 的每个区域都解决了一组特定的挑战，这些挑战对于成功的服务管理至关重要，而且每个阶段都会影响其他阶段。图\
  \ 1.1 中的服务生命周期图显示了生命周期的五个区域。\n\n![图像显示 ITIL 服务生命周期，以服务策略为中心，周围由服务设计、服务过渡和服务运营的箭头包围。这些区域被一个称为持续服务改进的外圆包围。](img/00007.jpeg)\n\
  \n`图 1.1` ITIL 服务生命周期\n\nCopyright © AXELOS Limited 2010 保留所有权利。材料根据 AXELOS 的许可复制。\n\
  \n生命周期的各个阶段作为一个集成系统共同工作，以支持服务管理的最终目标，即交付业务价值。每个阶段都相互依赖，如图图 1.2 所示。特别要注意服务运营与其他每个生命周期阶段的相互依赖关系。\n\
  \n![图像显示 ITIL 生命周期的集成，内容包括服务知识管理系统、服务组合和目录、业务/客户、服务（策略、设计、过渡和运营）、CSI 注册等，通过箭头相互连接。](img/00008.jpeg)\n\
  \n`图 1.2` ITIL 服务生命周期的集成\n\nCopyright © AXELOS Limited 2010 保留所有权利。材料根据 AXELOS 的许可复制。\n\
  \n### 服务策略\n\n服务策略是生命周期的核心。策略的作用是理解组织目标和客户需求。人员、流程和产品应该支持策略。ITIL 服务策略在考虑如何做之前询问为什么要这样做。它帮助服务提供者设定目标，并为客户和市场设定性能预期。它有助于识别、选择和优先考虑机会。服务策略确保提供者理解并能够处理与其服务组合相关的成本和风险。\n\
  \n服务策略过程完整列表包括 IT 服务策略管理、`service portfolio`（服务组合）管理、IT 服务财务管理、`demand`（需求）管理以及\
  \ `business relationship management`（业务关系管理）。这些过程以以下方式影响服务运营：\n\n*   服务运营提供的服务是否能够满足业务需求，将确认服务策略管理过程是否有效。\n\
  *   服务组合管理通过管道为服务运营提供未来需求的预告，而服务目录（service catalog）定义了服务运营提供的内容（换句话说，它定义了服务运营的范围）。\n\
  *   如果需求管理成功，服务运营将能够应对服务的需求水平以及需求的任何波动，并在需要时拥有影响需求水平的技术。\n*   财务管理和业务关系管理都是在服务运营生命周期阶段发生的战略过程；管理预算和在高级层与业务进行联系是涉及生命周期所有区域的持续活动。\n\
  \n### 服务设计\n\n服务设计将策略思想转化为交付物。设计必须始终考虑策略，以确保设计服务是以业务目标为考虑的。设计考虑了整个 IT 组织及其将如何交付和支持服务，将服务策略转化为交付业务目标的计划。必须考虑来自服务运营流程、人员和工具的\
  \ string，以确保设计能够在运营环境中发挥。记住，设计包括对现有服务的更改。\n\n服务设计过程完整列表包括设计协调、`service catalog`（服务目录）管理、服务水平管理、`availability`（可用性）管理、`capacity`（容量）管理、`IT\
  \ service continuity`（IT 服务连续性）管理、`information security`（信息安全）管理以及供应商管理。通过这些过程，设计确保了新或变更服务的\
  \ `utility`（效用）和 `warranty`（保证），涵盖服务的连续性、服务水平的实现以及对安全标准和法规的符合性。\n\n*   设计协调负责确保将服务运营需求纳入设计，并存在运营计划。\n\
  *   如前，服务目录定义了服务运营的范围，因为它提供了有关所有运营服务的信息。\n*   服务运营提供了管理可用性和容量目标交付所需的监控和指标，并识别关注的领域。\n\
  *   针对服务水平目标的报告以及交付服务改进计划所需的任何行动都是作为服务运营的一部分进行的。\n*   IT 服务连续性计划作为运营的一部分定期进行测试，对计划的任何启动都是为了确保服务运营能够继续为业务交付所需的服务。\n\
  *   信息安全提供了访问管理在服务运营中实施的策略。\n*   供应商管理依赖于运行运营服务的指标，以了解供应商是否提供了约定的服务。\n\n## 服务过渡\n\
  \n服务过渡为开发和改进 `capabilities`（能力）并将新和变更的服务引入支持的环境提供指导。服务的价值在策略中被识别，并被设计以交付该价值。服务过渡确保价值的实现；它通过允许必要的更改发生，而不对现有服务产生不可接受的风险来实现。它实现了新服务的实施和现有服务的修改，以确保所提供的服务实现了实现业务目标的服务策略，并使服务设计的效益充分实现。服务过渡还引入了\
  \ `service knowledge management system`（服务知识管理系统），它确保知识被存储并供服务生命周期的所有阶段使用，并确保经验得到事实数据的支持，从而随着时间的推移提高效率和有效性。\n\
  \n服务过渡过程完整列表包括 `transition planning and support`（过渡规划与支持）、变更管理、`service asset`（服务资产）与配置管理、`release`（发布）与部署管理、`service\
  \ validation`（服务验证）与测试、change evaluation（变更评估）以及 `knowledge management`（知识管理）。每个过程都发挥着作用，以确保有利的变更发生，因此服务可以引入并在过渡后正常工作。\n\
  \n\n\n\n\n* 变更评估通过将服务运行中新服务或变更服务的实际性能和结果与预测的性能和结果进行比较。变更评估的成功完成确保了服务可以正式关闭并并交给服务运营部门和`持续服务改进\
  \ (CSI)`。\n* 知识管理提供了知识库文章，这些文章对于事件、问题和请求流程具有巨大的实用价值。\n\n## 服务运营\n\n服务运营是本节的主题，描述了在受支持环境中管理服务的最佳实践。它包含了在交付和支持服务方面实现`有效性`、`效率`、稳定性和安全性的指导，以确保为客户、用户和服务提供者创造价值。如果没有这些，服务将无法提供所需的价值，且业务目标的实现将变得困难或不可能。\n\
  \n因此，服务运营阶段对于交付设计并实现服务战略至关重要。服务运营提供了详细的指导，通过问题管理和事件管理主动处理问题，以及通过事件管理被动处理问题，在约定的服务水平内交付服务。它为交付服务的人员提供了关于管理服务可用性、控制需求、优化容量利用、调度操作以及避免或解决服务事件和管理问题的指导。它包括关于共享服务、实用计算、Web\
  \ 服务和移动商务的建议。通过按照约定的水平交付服务，服务运营使企业能够利用服务来实现其业务目标。\n\n服务运营还描述了四个服务运营功能：`服务台`、`技术管理`、`IT\
  \ 运营管理`和`应用管理`。每个功能负责管理其在生命周期所有阶段的交付领域。\n\n## 持续服务改进\n\n生命周期的最后一个阶段是持续服务改进(`CSI`)。`CSI`\
  \ 通过确保服务的策略、设计、过渡和运行持续审查，确保服务提供者继续为客户交付价值。来自生命周期任何阶段的反馈都可以用于识别生命周期其他任何阶段的改进机会。这确保了改进机会在合理的情况下被识别、评估和实施。这些可能包括服务质量或服务提供者能力的改进。它可能是开发更好的工作方法，或者是在保持相同水平但提高效率。改进可以是大的，也可以是小且渐进的。`CSI`\
  \ 使每一项新操作都能从之前的操作中汲取经验。\n\n`CSI` 确保捕获、分析并采取来自每个周期阶段的反馈。服务运营是服务性能信息的来源，因此服务运营生命周期阶段是\
  \ `CSI` 的重要信息来源。许多由 `CSI` 驱动的改进计划将直接影响服务运营流程、产品和人员；其他生命周期阶段的改进可能会间接提高运营性能。\n\n`CSI`\
  \ 的改进方法基于建立基准并检查改进措施是否有效。它使用了`计划-执行-检查-处理 (PDCA)` 循环，结合服务测量、通过指标展示价值以及进行成熟度评估。七步法改进流程为这些方法提供了一个框架。\n\
  \n## 优化服务运营性能\n\n服务运营通过两种方式进行优化。首先是长期的渐进式改进。随着时间的推移，对服务运营流程、技术、功能和输出进行分析，并决定是否需要改进，如果需要，如何通过服务设计和过渡进行实施。改进记录在`CSI\
  \ 注册`中，并设计和过渡到服务中。典型示例包括部署一套新工具、流程设计的更改以及基础设施的重新配置。\n\n其次是短期的持续改进；这些是对支撑服务运营的流程、功能和技术中的工作实践所做的改进。它们通常是较小的改进，在不改变流程或技术基本性质的情况下实施。示例包括调优、负载均衡、人员重新部署和培训。\n\
  \n## 服务管理流程中的通用角色与职责\n\n组织 IT 部有许多不同的方式，没有两个服务提供者是完全相同的，因此每个组织内部角色的具体配置会有不同。通常两个或多个角色可能会合并；在其他组织中，一个角色可能会被拆分。ITIL\
  \ 提供的是指导而非规定的规则，因此每个组织都应该考虑最符合其自身的需求。\n\n我们将首先明确`角色`一词的含义。官方术表的定义如下：\n\n> 分配给个人或团队的职责、活动和权限。角色在流程或功能中定义。\n\
  \n在我们整个服务生命周期中涵盖的每个流程中，都有许多角色。角色可以由个人或团队执行，一个人可能拥有多个角色。负责基础设施可用性管理的人通常也兼任容量管理角色。容量管理可能分配给几个人，其中一人考虑网络容量，另一个人负责存储，以此此类推。\n\
  \n重要的是，尽管角色可能是共享或合并的，但每个流程只能有一个流程所有者，每个服务只能有一个服务所有者。\n\n通常，职位名称可能与角色描述相同；`服务水平经理`就是这样一个例子。职位由每个组织决定，在特定组织中，服务水平经理的工作可能包括服务水平经理的角色，以及一个或多个其他角色，例如`供应商经理`。\n\
  \n通常也是如此，个人执行的一项任务可能涉及多个流程。技术人员可能会提交变更请求以解决由问题管理识别出的容量问题。该操作可能被认为是服务改进计划(`SIP`)的一部分是理想的，该计划已记录在`CSI\
  \ 注册`中。因此，技术人员的操作涉及多个流程：问题、变更、容量、服务水平管理和持续服务改进。\n\n每个流程都有其特定的角色。在这里，我们将关注出现在所有生命周期阶段的通用角色。\n\
  \n## 服务所有者\n\n由于每个服务都与许多流程交互，存在服务本身可能不再获得关注的危险。为了避免这种情况，ITIL 建议每个服务都应该有一个单一的服务所有者。这明确了谁对服务负责，并确保关注在服务支持的业务流程上。\n\
  \n无论使用什么技术来交付服务，无论技术方面是内部提供还是外包，服务所有者仍然对交付服务负责。该角色向客户对服务的开发、实施和维护负责，但同时也对 IT 总监或服务管理总监的交付负责。\n\
  \n\n\n\n\n正如我们将审查的，ITIL 建议每个流程都应该有一个可识别的所有者。每个流程可能会影响许多服务，而无论执行何种流程，都由每个服务的所有者来确保服务能够有效高效地交付。服务所有者通常拥有多个服务。对于每项服务，他们将承担以下职责：\n\
  \n* 通过与所有 IT 组和流程所有者合作，确保按照所需的标准交付并支持服务\n* 通过与业务关系经理合作，确保理解客户需求并实施交付这些需求所需的任务\n\
  * 根据需要就有关服务交付的所有问题与客户进行沟通\n* 使用服务组合管理流程来定义新的服务模型，并评估对现有服务进行任何更改的影响\n* 通过识别可能的改进并在并在客户同意的情况下，将这些改进作为变更请求提出，以确保服务进行持续的服务改进\n\
  * 确保正在进行适当的监控和报告，以便准确查看所交付的服务水平\n* 确保交付了所需的性能和可用性水平\n* 深入了解构成服务的组件，并确保意识到它们故障的潜在影响\n\
  * 在整个组织中代表服务，并参加与业务部门的服务评审\n* 在 IT 内部以及变更顾问委员会 (CAB) 会议和内部服务评审中代表服务\n* 作为影响服务的重大事件的升级（通知）点\n\
  * 与服务团队合作，协商满足客户需求的服务水平协议 (SLA) 以及在约定水平上支持服务提供的运营水平协议 (OLA)\n* 维护服务目录条目\n* 与 CSI\
  \ 经理合作，识别要添加到 CSI 注册表中的改进，并参与这些改进的评审、优先级排序及最终的实施\n\n作为服务所有者，该角色关注任何影响服务的流程的影响。这意味着服务所有者应该被视为这些流程的利益相关者，并根据情况具有相应程度的参与。\n\
  \n例如，服务所有者在重大事件过程中起着至关重要的作用，并将参加或可能主持任何危机会议。他们还将参与调查影响其服务的根本原因。服务所有者将在 CAB 会议上代表服务，并参与有关是否以及何时应该发布的讨论。他们将希望确保其服务的服务组合、目录条目以及持有的配置数据是准确的。\n\
  \n正如前面提到的，服务水平管理流程与作为服务联系点的服务所有者之间应该存在紧密的关系。服务所有者还将与更具技术性的流程所有者（如可用性和容量）联系，以确保这些流程收集的数据表明服务的性能和可靠性符合约定标准。\n\
  \n服务所有者负责确保其服务的 IT 服务连续性管理 (ITSCM) 计划是切实的，计划的每个元素都已到位。他们将与 ITSCM 经理合作，确保考虑到所有方面。他们通常会参加计划的演练，观察其实运行情况以确认没有遗漏任何。\n\
  \n服务所有者理解交付服务所需的成本，并将与供应商经理和其他经理合作，以控制成本并实现物有所值。在业务部门收取 IT 服务费的组织中，他们将按照约定确保成本回收。\n\
  \n最后，服务所有者确保服务遵循信息安全管理策略。\n\n## 流程所有者 (Process Owner)\n\n正如我们看到的，服务所有者是所有流程领域某一特定服务的焦点。相反，流程所有者对单一流程负责，无论它影响什么服务。\n\
  \n流程所有者必须确保流程高效有效地运行。尽管该角色通常由履行流程经理角色的人担任，但在较大的组织中，这种情况较少。例如，一家全球性公司可能有一个变更管理流程所有者以及若干不同国家执行该流程的流程经理。流程所有者负责确保流程符合其用途，并由流程经理和从业者正确执行。因此，该角色既具有设计方面也具有执行方面。\n\
  \n流程所有者对以下事项负责：\n\n* 开发流程策略、策略和标准\n* 协助设计流程并根据需要进行修改，以实施使流程更有效或更高效的改进\n* 协助设计流程指标，并确保这些指标为判断流程的有效性和效率提供必要信息\n\
  * 确保流程已文档化，确保这些文档对需要的人是可用的，并根据需要进行更新\n* 当流程发生变化时，确保流程文档已更新并将变更传告给流程从业者（实际执行流程步骤的人）\n\
  * 审计流程活动，以确保遵循正确的流程\n* 确保有所需的资源来执行流程，并确保相关员工已接受过执行该流程的培训\n* 向流程从业者传达遵循文档化流程的重要性，并解释不遵守流程对\
  \ IT 和业务的影响\n* 作为持续服务改进的一部分，评审流程策略和流程本身的有效性，以识别可能的改进\n* 在识别出对有效性或效率的改进之处时，将这些改进包含在\
  \ CSI 注册表中，并与 CSI 经理合作，根据情况对其进行评审、优先级排序和实施\n\n### 流程所有者角色对于流程的成功至关重要。在没有此类单一所有权的组织中，执行流程的人可能会决定删除或修改流程中的步骤，并且没有人拥有总体权限来防止这种现象。在全球性组织中，这意味着流程可能会出现区域差异。除了失去流程目的关注的风险外，这可能会导致流程报告失效，因为每个区域输入数据的方式可能不同。\n\
  \n如果没有流程所有者，就没有人负责确保应用流程的一致性，也没有人确保流程输出仍然符合流程目标。流程文档可能不会更新，因为维护它的责任将不明确。最后，将没有人评估流程并识别改进。\n\
  \n## 流程经理 (Process Manager)\n\n流程所有者对流程的成功负责，但通常不负责实际执行流程。管理流程日常实施的责任属于流程经理。在大型或地理位置分散的组织中，可能有多个流程经理负责管理同一流程的实施，每个负责区域或基础设施方面的职责。\n\
  \n\n\n\n\n流程经理负责以下工作：\n\n*   与流程所有者联系，确保流程在所有生命周期阶段中都按照流程所有者的意图得以实施\n*   确保为流程中的各个角色分配了合适的人员，并确保他们理解对自身的要求\n\
  *   与其他流程经理和其他服务所有者合作，确保服务按要求交付\n*   监控流程指标，以确认流程正按设计要求运行\n*   作为持续服务改进（CSI）的一部分，审查流程性能以识别潜在的改进点\n\
  *   在识别出改进点后，将其纳入 CSI 注册表，并与 CSI 经理和流程所有者合作，根据情况对这些改进进行审查、确定优先级并予以实施\n\n流程经理这一角色至关重要，因为正是由于流程经理确保了流程在日常工作中得到了正确的执行。由于流程所有者可能与流程发生地距离较远（例如，在总部工作，而流程在分机构进行）。流程经理（或经理们）将确保员工理解其职责要求，并已获得执行任务所需的正确资源和培训。由于流程经理接近流程执行，他们是识别问题和可能改进点的理想人选。任何改进计划的成功将很大程度上取决于流程经理的积极参与，以确保员工采用改进后的流程。\n\
  \n## 流程执行者\n\n根据流程的不同，可能会有一位或多位人员执行流程活动。在小型组织或简单流程中，这可能由一个人完成，此人很可能也是流程经理。对于大型组织或复杂流程，可能会有很多人，每个人执行流程的一部分。参与执行流程活动的人员被称为流程执行者。\n\
  \n流程执行者通常负责以下工作：\n\n*   按照要求的标准完成流程活动\n*   理解流程的重要性及其在流程中的角色，以及他们如何为交付服务做出贡献\n*\
  \   与所有流程利益相关者合作，确保流程的输入、输出和接口正常运行，以便流程交付所需的结果\n*   以记录的形式提供流程活动已正确执行的证据\n*   识别对流程或支持工具的必要改进\n\
  \n流程执行者角色负责实际交付流程活动。在流程经理的指导下（除非这两个角色合并），执行者负责按照设计、持续且高效地执行流程。人们可能容易认为执行者除了执行活动之外并无做任何其他贡献；这与事实并非如此。作为执行者，员工将亲身体验流程中的任何问题，例如无法有效支持流程的工具、流程流中的瓶颈或文档中的歧义。因此，流程经理和流程所有者在尝试识别可能的改进点时，应当寻求执行者的意见。\n\
  \n每个角色都有其特定的目的。即使角色由同一个人承担，该人员也应尝试考虑每个角色的各个方面。执行者的优势在于每天与流程进行互动，但可能因为太接近流程而无法客观地看待它；流程经理的评价标准是流程的结果，因此他们对有效高效地交付这些结果所需的资源有特别关注。他们将密切监控流程指标，以确保输出按时且在预算内交付。然而，经理只能看到其负责的流程交付部分。流程所有者的优势在于能够看到全局，比较在不同地点和不同流程经理管理下的流程交付情况。通过理解每个视角的优劣，可以获得流程交付的完整画面，并从每个层面收集改进计划。\n\
  \n## 总结\n\n本章涵盖了运营支持和分析流程的价值、目的和目标，以及它们如何为组织创造价值。我们在服务生命周期的背景下查看了流程，并考虑了运营支持和分析流程的基础。我们涵盖了其他生命周期阶段的哪些流程需要服务运营操作。我们还考虑了适用于流程的通用角色，包括服务所有者角色，流程与该角色有显著的交互。\n\
  \n请记住，通用角色适用于所有生命周期阶段和服务管理流程。\n\n在接下来的章节中，我们将检查事件管理、问题管理、访问管理、请求履行和事件管理的服务运营流程。\n\
  \n## 考试要点\n\n*   **理解运营支持和分析流程的价值。** 这些流程构成了服务运营活动的核心，决定了服务运营生命周期阶段如何为业务增加价值。\n\
  *   **理解运营支持和分析流程在服务生命周期中的位置。** 理解其他每个生命周期阶段对服务运营的影响。了解这些其他阶段到服务运营流程的输入，以及服务运营到生命周期其余部分的输出。\n\
  *   **理解服务运营根据与业务达成的 SLA（服务水平协议）交付服务的责任。** 转换阶段应该通过测试和试点验证 SLA 目标；在服务生命周期的运营阶段继续满足\
  \ SLA 目标是服务运营的职责。\n*   **理解运营支持和分析流程在确保服务交付业务价值方面发挥的作用。** 通过高效地按约定的服务目标交付服务，服务运营确保业务按计划从服务中受益。\n\
  *   **理解服务运营的关键流程。** 能够说出五项服务运营流程：事件管理、请求履行、访问管理、问题管理和事件管理。\n*   **理解与服务运营流程相关的通用角色。**\
  \ 能够命名并解释与服务运营中所有流程相关的角色意义。\n\n## 复习题\n\n你可以在录中找到复习题的答案。\n\n1.  服务运营包括哪些活动？\n  \
  \  1.  测试服务\n    2.  发布服务\n    3.  决定是否退役服务\n    4.  优化服务\n2.  其他生命周期阶段的许多流程也在服务运营阶段进行。下列哪些流程不属于这一类？\n\
  \    1.  IT 服务连续性管理\n    2.  可用性管理\n    3.  服务水平管理\n    4.  设计协调\n3.  下列是 ITIL 描述的服务运营功能的正确列表？\n\
  \    1.  技术管理功能、设施管理功能、服务台台功能\n    2.  基础设施管理功能、桌面支持功能、应用管理功能、服务台台功能\n\n\n\n\n3.\
  \ 技术管理功能、运营管理功能、应用管理功能、服务台功能\n4. 基础设施管理功能、服务台功能、应用开发功能\n\n### 4. 下面哪些活动不是设施管理负责的？\n\
  1. 确保服务器房空调维持在要求的水平\n2. 定义支持服务的基础设施需求\n3. 确保灾难恢复站地的电源供应符合要求\n4. 测试 UPS 和发电机\n\n\
  ### 5. 将活动与功能进行匹配。\n1. 活动：控制台管理\n2. 活动：识别应用软件的功能性和可管理性需求\n3. 活动：提供单一接触点\n4. 活动：设计和管理基础设施\n\
  \n1. 功能：服务台\n2. 功能：技术管理\n3. 功能：应用管理\n4. 功能：运营管理\n\n1. 1d, 2a, 3c, 4b\n2. 1d, 2c,\
  \ 3a, 4b\n3. 1a, 2b, 3c, 4d\n4. 1b, 2c, 3d, 4a\n\n### 6. 服务台不负责以下哪项内容？\n1. 提供第一接触点\n\
  2. 解决简单的事件\n3. 防止事件再次发生\n4. 为用户提供更新\n\n### 7. 服务台执行两个流程。它们是什么？\n1. 事件管理\n2. 设计协调\n\
  3. 请求履行\n4. 变更管理\n\n1. 2 和 4\n2. 1 和 3\n3. 以上所有\n4. 3 和 4\n\n### 8. 下面哪些是所有流程的通用角色？\n\
  1. 服务所有者\n2. 过程所有者\n3. 过程经理\n4. 过程执行者\n\n1. 1 和 2\n2. 2 和 3\n3. 以上所有\n4. 2, 3, 和\
  \ 4\n\n### 9. 下面哪哪项对服务所有者职责的描述是正确的？\n1. 确保服务根据客户需求交付\n2. 管理过程活动\n3. 执行过程活动\n4. 设施管理、运营控制\n\
  \n### 10. 下面哪哪项是过程执行者的职责？\n1. 管理服务的交付\n2. 确保过程策略被正确记录\n3. 执行过程的工作指令\n4. 管理过程的资源\n\
  \n# 第 2 章：事件管理与问题管理\n\n**本章讨论了以下 ITIL 运营支持与分析中级考试目标：**\n\n* **![images](img/00005.jpeg)\
  \ 事件管理和问题管理从以下方面进行了讨论：**\n    * 目的\n    * 目标\n    * 范围\n    * 对业务及服务生命周期的价值\n  \
  \  * 策略、原则和基本概念\n    * 过程活动、方法和技术以及它们与服务生命周期的关系\n    * 触发因素、输入、输出和接口\n    * 内部的信息管理\n\
  \    * 角色\n    * 挑战与风险\n    * 使用关键成功因素和关键绩效指标检查过程的有效性和效率\n\n![](img/00006.jpeg)\
  \ 本书是一份学习指南，旨在帮助获得 ITIL 中级能力证书；它支持获得这些资质所需的强制认证课程，这些课程可能是课堂课程或远程学习。书的第一部分涵盖了运营支持与分析资质。该课程的大纲包括每个流程的日常运营以及过程活动、方法和技术的细节，及其信息管理。涵盖服务运营过程管理和监督方面的更详细指导包含在服务生命周期中级资质中。每个过程都从运营角度进行考虑。本书的第一部分包含第\
  \ 1 至 6 章，涵盖了运营支持与分析。这意味着在该部分结束时，你应该理解事件管理和问题管理的原理、技术和关系，以及它们对有效服务解决方案的支持和运营的应用。\n\
  \n## 事件与问题：两个关键的服务管理概念\n\n`事件`管理和`问题`管理这两个流程是所有 ITIL 流程中最重要的。它们通常是决定采用 ITIL 框架的组织首先实施的流程。事件管理与问题管理之间的区别是一项重要的区分，采纳了这两个流程的组织在改进其服务和服务管理方面迈出了巨大一步。\n\
  \n这两个流程都由每个 IT 服务提供者执行，无论它们是否被称为这些名称。所有服务提供者在故障发生时都会尽可能地修复故障（`事件管理`），并尝试确定故障发生的原因，以便防止其再次发生（`问题管理`）。然而，许多组织并不区分这两个流程，特别是问题管理可能无法以一致的方式执行。未能意识到问题与事件之间的区别可能会导致事件发生后的服务恢复延迟，并允许事件再次发生，从而每次都导致业务中断。\n\
  \nITIL 为这两个关键流程的最佳方法提供了指导。有效的事件管理将提高`可用性`，确保用户在故障后能够迅速恢复工作。问题管理将提高服务的整体质量和可用性（因此与持续服务改进\
  \ [`CSI]）协同工作）；它还充分利用了熟练的 IT 员工，他们从解决重复事件中解放出来，能够花时间防止它们的发生。\n\n## 事件管理\n\n在 ITIL\
  \ 术语中，`事件`被定义为 IT 服务的意外中断、IT 服务的质量的降低，或尚未影响 IT 服务的配置项（`CI`）故障（例如，镜像组中一个磁盘的故障）。我们可以很容易地想到“IT\
  \ 服务的意外中断”的例子——服务器崩溃、硬件故障等。后部分的一个很好的例子是具有 `RAID`（独立磁盘冗余阵列）配置的存储设备中的一个磁盘发生故障。这被视为一个事件，尽管存储设备仍然可用。关键点在于，一个磁盘的故障意味着存储不再受另一块磁盘故障的保护。如果另一块磁盘发生故障，设备将故障，上面的数据将无法访问。\n\
  \n这是一个重要的定义；因为事件是对服务的干扰，恢复服务或将服务质量提高到约定水平就可以解决事件。注意，事件解决并不一定包括理解故障发生的原因或防止其`再次发生`；这些是问题管理的事。通过理解这种区别，你可以发现解决事件不需要解决问题才所需的技能。如果服务可以通过简单的重启来恢复，那么服务台人员就可以指导用户这样做，而无需涉及技术水平更高（因此更昂贵）的二线技术人员。\n\
  \n\n\n\n\n从用户和业务的角度来看，重点在于能够恢复工作，而对故障原因兴趣较小。反复发生的故障将影响他们的工作，并增加向服务台呼叫的次数。需要对原因进行调查并对底层问题提供永久性解决方案，但这可以在不影响用户的情况下进行。\n\
  \n事件管理流程负责推动所有事件从首次报告到关闭的进展。某些组织可能拥有专门的事件管理人员，但最常见的方法是让服务台负责该流程。\n\n## 事件管理的目的\n\
  \n`incident management`（事件管理）的目的是尽快恢复正常服务运行，并尽可能地减少对业务运营的负面影响，从而确保维持约定的服务质量水平。`Normal\
  \ service operation`定义为服务和配置项（CIs）在约定的和服务运行水平内运行的工作状态。\n\n如所述，通过专注于服务恢复，事件管理能够使业务快速恢复工作，从而确保减少对业务流程和截止日期的影响。\n\
  \n## 事件管理的目标\n\n事件管理流程的目标如下：\n\n*   使用标准化的方法和模型来管理事件。这意味着无论服务、技术或支持小组如何，事件都应该以一致的方式处理。这使得业务部门和服务提供者管理层对任何特定事件将如何处理有清晰的预期。\n\
  *   增加事件的可见性和沟通。这允许业务部门跟踪其报告的事件的进展，并确保所有 IT 人都能访问与事件相关的信息。\n*   增强业务对 IT 的认知。所有\
  \ IT 服务提供者都会遭遇事件，但其响应方式可以提升其声誉；一个设计良好的事件管理流程应该通过展示专业、有效的方法来增强 IT 在业务中的声誉。\n*   通过确保根据其对业务的重要性对事件进行优先级排序，使活动与业务需求保持一致。\n\
  *   维护用户满意度。\n\n所有事件都必须得到高效的响应、分析、记录、管理、解决和报告。通过高效有效的方式执行这些任务，并确保根据要求更新受影响客户的状态，IT\
  \ 服务提供者旨在即使发生了故障，也能提高客户满意度。在事件管理过程的整个期间，必须考虑业务需求；业务优先级必须影响 IT 优先级。\n\n## 事件管理的范围\n\
  \n事件管理涵盖所有事件：所有事件对服务质量都具有实际或潜在的影响。事件大多数是作为用户联系服务台的结果被记录的，但事件管理工具可能会在告警后报告事件（参见第\
  \ 3 章“事件管理、请求履行和访问管理”中关于事件管理的讨论）；通常事件系统与事件管理工具之间存在链接，以便符合标准的事件可以自动生成事件日志。供应商可能会向服务台通知故障，或者技术人员可能注意到发生了错误状况并记录事件。\n\
  \n请求可以在服务台进行记录和管理，但区分这些请求和事件至关重要；在请求的情况下，没有服务受到影响。事件和问题管理寻求随着时间的推移减少事件数量，而 IT 服务提供者可能希望通过服务台和请求履行流程处理日益增加的请求，作为一种快速、高效且以客户为中心的方法。\n\
  \n## 事件管理对业务和服务生命周期的价值\n\n高效的事件管理为业务带来了多项收益。例如，它通过快速解决事件并使用技能较低的人员来降低事件解决的成本。当需要升级事件时，解决速度更快（因为所需的相关信息已由一线人员收集，并完成了初步诊断）。更快的事件解决意味着受影响的用户更快恢复工作，他们能够再次利用服务功能来产生业务利益。有效的事件管理提高了组织的整体效率，因为非生产性用户是公司的成本。\n\
  \n`incident prioritization`（事件优先级排序）基于对业务优先级的影响和紧急程度的评估，这确保了资源分配能够最大化业务利益。服务台收集的关于事件数量和类型的数据可以进行分析，以识别培训需求或潜在的改进领域。\n\
  \n正如第 4 章“服务台”中对服务台的讨论所强调的，事件管理是最可见流程之一，也是所有用户都理解其必要的流程。因此，它是容易改进的领域之一，因为改进事件解决服务为业务带来了显而易见的收益。\n\
  \n事件管理流程还为服务生命周期的其他领域带来价值。通过专注于减少机时间，它帮助服务水平管理确保达到可用目标。此外，通过确保在现场解决简单的事件，它通过确保对更高成本的人员进行更高效的使用来协助财务管理。它记录了有关容量和安全的问题细节。它收集了有关第三方性能的有用数据以供供应商管理，以及有关由变更引起的问题的数据。它突出了持续服务改进（CSI）的领域；通过事件收集的数据还可以显示改进倡议的有效性。\n\
  \n## 事件管理策略\n\n接下来我们考虑一些支持有效事件管理的策略。\n\n`事件及其状态必须以及时有效的方式进行沟通。` 必须让用户了解影响他们的事件的进展，并且给他们提供的信息必须对他们有用——大多数用户不理解技术术语，因此不应使用这些。这项策略表明，事件管理不仅仅关乎解决事件——业务需要关于开放事件状态的信息，以便其做出决策以最大限度地减少对业务的影响。这是服务台的关键职责之一。\n\
  \n`事件必须在业务可以的时间范围内得到解决。` 我们应该记住 IT 是业务的服务员。服务水平管理将决定哪些时间范围是可以接受的，并且必须确保必要的`operational\
  \ level agreements`（运营水平协议）和`underpinning contracts`（支撑合同，UCs）到位以支持它们。你在基础学习中熟悉这些概念。有关服务水平管理的更多信息可以查阅第\
  \ 18 章“服务水平管理和供应商管理”。在要求的时间完成解决需要分配充足且适当的资源来处理事件，并访问必要的工具、技术、事件`known error`（已知错误）以及配置信息。\n\
  \n\n\n\n# 必须始终保持客户满意度。客户满意度不仅关乎满足 `SLA` 目标。如果支持人员态度粗鲁或傲慢，即使 IT 满足或超过了所有事件相关目标，用户和客户仍然会感到不满。即使未达到目标，让客户知晓进展也能提高客户满意度的水平。\n\
  \n# 事件的处理和处置应与整体服务水平和目标保持一致。处理事件不应为了适应 IT 的便利或优先级；事件管理活动应根据实际业务需求对这些活动进行优先级排序，以支持服务水平和目标。\n\
  \n# 所有事件都应存储并管理在一个单一管理系统中。使用单一系统可以为事件信息提供明确且认可的来源，并支持报告和调查工作。应在事件记录中及时记录并更新事件的状态及详细信息。\n\
  \n# 所有事件应以标准方式进行分类。标准化的`categorization`能够实现有效的分析和报告；通过更轻松在事件数据库或`known error database`中查找故障的其他发生情况，它可以加快故障排除的速度。它还有助于识别趋势。为了确保有效性，必须有一套定义良好且已沟通的事件分类标准。服务管理工具可以编程以防止输入非标准类别。\n\
  \n# 事件记录应定期进行审计。事件数据库是关于基础设施正在发生的情况以及业务所遇困难的丰富信息源。然而，其可用性取决于其准确性和完整性。我们已经考虑了数据输入一致性的重要性；本策略通过对事件记录进行准确性和完整性审计，确保遵循了此类数据的指南。发现的任何问题都应记录并采取行动。\n\
  \n# 所有事件应使用通用格式。人员应以标准格式记录服务提供商认为必要的信息。这有助于进行活动事件的管理，也有利于后期的报告和分析。\n\n# 使用通用且约定的的一套标准进行优先级排序和升级。这确保了客户需求在所有服务和组件中得到一致处理，而不是取决于记录事件的人的个人意见。\n\
  \n## 事件管理的原则和基本概念\n\nITIL 描述了在实施事件管理过程中需要注意的若干原则和基本概念。它们将在以下章节介绍。\n\n### 时间跨\n在事件管理中，时间至关重要，因为每个事件都代表了服务的损失或恶化。流程的每个方面都需要经过优化，以产生最快的结果。服务水平协议（`SLAs`）、运营水平协议（`OLAs`）和底层合同将定义支持小组或第三方完成每个步骤所需的时间，并附带可衡量的目标。当事件传递给支持小组进行调查时，时钟就开始滴答；该小组有定义的时间来完成工作，该时间定义在\
  \ `OLA` 中。如果事件传递给第三方，则适用底层合同中设置的时间跨度。这些 `OLA` 和合同 `target` 时间跨度支持实现 SLA 目标。\n\n\
  服务管理工具集应配置为捕获：记录和升级事件所需的时间、在最初几分钟内在不需要升级的情况下解决的事件数量，以及支持团队响应和修复事件所需的时间。这些时间应被进行监控，并应采取措施识别瓶颈或表现不佳的团队，以便采取改进措施。这些工具可以用于自动化时间跨度，并根据预定义的规则按需要升级事件。\n\
  \n### 事件模型\n许多事件以前发生过，并且很可能再次发生。因此，许多组织会发现预定义“标准”`incident models`并在发生适当事件时将其应用于这些事件是有帮助的。模型是执行某项常用任务的预定义方式。ITIL\
  \ 建议对事件、请求和变更等多个流程使用模型。事件模型描述了调查和解决特定类型事件所需的步骤。这些模型的用处是加快了事件的解决。大多数服务管理工具都有存储多个模型的能力；当这些事件之一发生时，使用相应的预先准备的模型记录事件。然后可以使用该模型对事件进行处理。工具还可以自动执行模型中的许多步骤，例如自动分配给正确的支持小组并进行升级。\n\
  \n需要专门处理的事件可以这样进行处理（例如，与安全相关的事件可以路由到信息安全管理和容量，或与性能相关的事件可以路由到容量管理）。使用事件模型将有助于确保方法的一致性并加快解决。\n\
  \n一个典型的事件模型的内容应包含以下内容：\n* 处理事件所需的步骤，包括它们的时间跨度和按时间顺序，以及任何依赖关系\n* 负责每个步骤的人员详细信息以及升级联系人\n\
  * 任何需要采取的预防措施，如备份数据，或符合健康安全相关指南的步骤（例如将设备与电源隔离开）\n* 在发生安全和容量相关事件时，应采取的任何保护证据的步骤\n\
  \n### 重大事件\n所有事件都应尽快解决，但某些事件非常严重，对业务的影响如此巨大，以至于需要额外的关注。第一步是就什么是`major incident`达成共识。某些组织会将所有优先级一事件定义为重大事件；另一些组织可能将优先级一事件限制为影响会被外部客户感知到的事件。在这种定义中，组织内部产生重大影响的事件通常不会被归类为重大。例如，阻止客户从组织网站订购从而影响收入和声誉的事件将被包含在内。定义必须与优先级方案一致以避免混淆。\n\
  \n将事件定义为重大事件目的是使其获得特别关注。预先定义要采取的具体行动，以便在重大事件发生时，每个人都知道预期做什么。典型的行动可能包括：\n* 在宣布重大事件后立即通知服务提供者组织和业务的关键联系人\n\
  * 通过约定的渠道（内网、关键用户等）发布定期更新\n* 在服务台电话设置录制的问候，告知来电者事件已发生并正在处理，以减少服务台处理的电话数量\n* 指派重大事件经理（这可能是服务台经理）并任命一个专门团队专注于解决该事件\n\
  \n与任何事件一样，某些重大事件可以在不理解原因的情况下解决（可能通过重启服务器）；某些则需要理解根本原因。在第二种情况下，问题管理将介入。然而，事件管理的焦点仍然保持在尽快恢复服务上是至关重要的。\n\
  \n\n\n\n正如我们在第 4 章中所讨论的，服务台台的主要职责之一与用户进行通信；这在重大事件的情况下尤为如此。应当提供定期更新。服务台台人员还负责确保事件记录在整个事件过程中保持更新，尽管实际输入信息的可能是其他团队的技术人员。在事件发生期间，准确的记录至关重要，以避免混淆；它还将在事件解决后作为重大事件审查的一部分被使用。显示所采取步骤以及执行是否成功的定期更新，将有助于识别未来事件的改进之处。\n\
  \n## 事件状态\n\n事件管理通过状态代码对事件的整个生命周期进行追踪，从识别事件开始，经过诊断、解决，最后到关闭。事件管理将提醒解决小组相关的目标时间，确保没有事件被遗忘或忽略。\n\
  \n大多数服务管理工具套件都允许为每个事件定义多个状态，以便于跟踪进度。典型状态包括：\n\n- **已开启 (Open)**：事件已识别并记录。它可能正在由服务台台分析师处理，或者服务台台正在考虑将其升级到哪个二线团队。由一线团队解决的事件可能直接从“已开启”移动到“已关闭”，因为服务台台分析师已获得用户确认事件已得到满意解决。\n\
  - **已分配 (Assigned)**：这可能意味着事件已发送到支持团队，但尚未分配给特定的个人。\n- **已接入或处理中 (Allocated or In\
  \ Progress)**：这通常定义为技术人员已分配到该电话。\n- **挂起 (On Hold)**：此状态有时用于用户不在场或没有时间测试解决方案的情况。它被用于“停止目标计时”，因为没有用户，服务提供商无法采取任何进一步行动来解决事件。\n\
  - **已解决 (Resolved)**：此状态表示技术人员已完成其工作，但尚未获得用户确认执行成功。通常会使用服务管理的邮件功能，在事件解决时自动向用户发送邮件，如果用户仍然不满意，则要求在一定时间范围内给予回复。如果没有收到回复，事件将自动关闭。\n\
  \    - 如果用户不满意，电话将被放回“处理中”状态，并进行进一步工作来解决它。\n    - 服务台台应在自动关闭之前尝试联系用户以获得关闭工单的许可，特别是对于高影响事件，因为用户可能尚未意识到解决方案。\n\
  - **已关闭 (Closed)**：此状态确认事件已让用户满意并结束。事件管理过程不再参与，尽管问题管理现在可能会调查根本原因。\n\n## 扩展事件生命周期\n\
  \n扩展的事件生命周期用于服务设计可用性管理过程以及 CSI（持续服务改进）中。扩展的生命周期将过程的每一步进行分解，以便对其进行检查，以理解未达到目标的原因。例如，对事件的诊断可能很快确定解决方案需要恢复数据，这需要三小时；此信息将用于确定在何处进行改进。生命周期中任何步骤的延迟都可以被分析，并实施改进以加快解决。实施知识库或在现场存储备用零件是缩短诊断和修复步骤的两种典型措施。\n\
  \n## 事件管理过程活动、方法和技术\n\n本节高要概述了事件管理中的各项活动。请参考图 2.1，该图显示了流程图。\n\n![流程图显示了事件管理流程，从事件管理、Web\
  \ 界面、电话和和电子邮件流向事件（识别、分类、优先级排序、诊断）、升级决策、调查等。](img/00009.jpeg)\n\n**FIGURE 2.1**](#part0009_split_002.html_figureanchor2-1)\
  \ 事件管理流程图\n\nCopyright © AXELOS Limited 2010. 保留所有权利。根据 AXELOS 的许可复制。\n\n### 第 1\
  \ 步：事件识别与记录\n\n首先，识别事件然后进行记录。许多事件将报告给服务台台，由其进行记录。但并非所有拨打服务台的电话都与事件有关；有些是请求，由请求履行过程处理。正如图\
  \ 2.1 中的图所示，这些请求会被重定向。\n\n在最短时间内解决事件至关重要，因为每个事件都代表了业务中断。因此，尽可能，我们应该尝试在用户注意到或在他们向服务台台报告之前识别出事件发生。第\
  \ 3 章描述了如何使用事件管理监控工具来识别故障。事件管理过程应直接链接到事件管理，以便发现的任何事件都能立即得到处理并快速解决。在没有事件管理的情况下，事件将通过用户联系服务台台来识别。\n\
  \n`incident record` 包含有关特定事件的所有信息；记录、分配、解决和关闭的详细信息可能用于服务水平管理报告。症状细节和受影响的设备细节可能被问题管理使用。解决事件所采取的步骤可能用于填充知识库。在记录通过其生命周期期间，将所有相关信息添加到记录中是至关重要的。\n\
  \n良好的集成服务管理工具可以使记录工作变得容易得多，因为它可以自动向记录中填充用户详情（来自 `Active Directory` 或类似工具）以及设备和保修详细信息（基于\
  \ `CI` 编号）。通过对每次更新进行自动日期时间戳标记并识别是谁执行了更新，可以提高记录中信息的完整性。\n\n### 第 2 步：事件分类\n\n事件在记录阶段进行分类。这有助于引导服务台台代理员找到正确的已知错误条目或用于升级的适当支持团队。然而，应该使用简单的分类结构；过于复杂的方案会导致所有事件都被记录为“其他”或“杂项”，因为代理员不想花时间考虑哪种类别是正确的。这使得随后的分析变得非常困难。如图\
  \ 2.2 所示，多级方案可以在实现粒度的同时，而不会让服务台台代理员面对长列表进行选择。如果原始选择错误，应在调查和解决期间对事件进行重新分类。\n\n![图像显示了多级服务分类的两个流程图，受（位置、服务、系统和应用程序）影响或（应用程序、数据库、服务器和磁盘驱动器）影响。](img/00010.jpeg)\n\
  \n**FIGURE 2.2**](#part0009_split_002.html_figureanchor2-2) 多级事件分类\n\nCopyright\
  \ © AXELOS Limited 2010. 保留所有权利。根据 AXELOS 的许可复制。\n\n### 第 3 步：事件优先级排序\n\n\n\n\n\n\
  需要对事件进行优先级排序，以确保最关键的事件首先得到处理。人们常说，所有用户都认为自己的事件是优先级最高的，因此在服务水平谈判期间，就约定使用哪些标准来决定优先级至关重要。\n\
  \nITIL 框架建议考虑两个因素：业务影响和紧急性（业务需要解决方案的速度）。可以通过考虑若干因素来评估业务影响：受影响的人数、服务的关键性、正在遭受的财务损失、对声誉的损害等。取决于组织的类型，可能还会考虑其他因素，如健康与安全（针对医院、铁路公司或类似组织）以及潜在的违规（针对金融机构）。\n\
  \n在事件的生命周期内，如果影响评估发生变化或解决方案变得更加紧急，则可能需要调整事件的优先级。\n\n确定优先级必须简单简单，因为事件必须快速记录。聘用具有良好业务知识的服务台人员，并确保他们经过培训以意识到业务影响，将有助于对业务影响进行现实的评估。表\
  \ 2.1 显示了一种简单但有效的优先级确定方法。\n\n| 影响 | 紧急性 | |\n| --- | --- |\n| | 高 | 中 | 低 |\n| 高\
  \ | 1 | 2 | 3 |\n| 中 | 2 | 3 | 4 |\n| 低 | 3 | 4 | 5 |\n\n**表 2.1** 影响与紧急性：确定事件优先级的矩阵\n\
  \n表 2.2 显示了如何利用使用表 2.1 中矩阵确定的优先级，反过来用于设置事件的目标解决时间。\n\n| 优先级代码 | 描述 | 目标解决时间 |\n\
  | --- | --- | --- |\n| 1 | 紧急 | 1 小时 |\n| 2 | 高 | 8 小时 |\n| 3 | 中 | 24 小时 |\n| 4\
  \ | 低 | 48 小时 |\n| 5 | 计划 | 已计划 |\n\n**表 2.2** 目标解决\n\n### 步骤 4：初始诊断\n\n初始诊断步骤是指在服务台采取的诊断故障的行动，并在可能的情况下在此阶段解决故障。服务台人员将使用由问题管理部门提供的已知错误数据库、事件模型（之前已涵盖）以及任何其他诊断工具来协助诊断并寻求可能的解决方案。如果服务台无法解决事件，初始诊断将识别出适当的升级支持团队。\n\
  \n此阶段的部分工作是收集信息，以协助二线技术人员快速解决事件。再次，这一步需要足够的时间；快速将事件传递给二线技术人员但提供不足或稀疏的细节来“节省”时间是毫无帮助的。二线技术人员将需要联系客户获取信息，这会增加延迟和挫败感。支持团队应该为服务台提供指导，说明他们应该收集信息的类型和水平。\n\
  \n### 步骤 5：事件升级\n\nITIL 框架描述了事件管理过程中可能发生的两种升级形式：*功能升级*和*层级升级*。\n\n功能升级发生在服务台无法解决事件时；这可能是由于事件本身的类型（如服务器故障）立即发生的，也可能是因为服务台人员已经花费了组织指南允许的最长时间尝试解决事件但未果。这时，需要将其传递给具有更高知识的小组。接收此类升级事件的二线支持小组也有解决时间限制，到那时事件将再次升级到下一个支持级别。有时，像服务台一样，很明显看出事件需要高水平的技术知识，在这种情况下，事件将立即升级，而无需由二线支持人员尝试解决。\n\
  \n为了避免不必要的延迟，服务台必须知道将事件升级到哪个正确组；因此，服务台人员需要充分的技术知识来能够识别哪个事件应交给哪个团队。运营水平协议（OLA）将规定每个小组的职责。可能会出现需要支持小组之间协作的情况，或者需要将事件提交给第三方（如硬件维护公司）的情况。OLA\
  \ 和可用合同（UC）应该规定在这种情况下发生什么。\n\n第二种升级是层级升级，通常发生在高优先级或重大事件，或超过解决目标的事件中。这种升级包括向适当级别的管理层报告事件以便他们知情。这确保了管理层能够就工作优先级、涉及供应商等做出任何所需的决策。在重大事件的情况下，IT\
  \ 总监可能需要向业务总监简报事件进展；即使并非如此，当发生严重事件时，业务经理可能会直接去找高级 IT 管理人员，因此 IT 管理人员本身得到充分的汇报至关重要。\n\
  \n当事件进展没有预期那么快，或者支持小组之间对于应分配给谁存在分歧时，有时也需要使用层级升级。\n\n良好的服务管理工具能够根据 SLA 目标自动升级事件，并更新记录详情。例如，工具可以设置为当\
  \ SLA 目标时间已过去 90% 时通知团队负责人，并在事件违反目标时通知团队负责人的直属经理。\n\n### 步骤 6：调查与诊断\n\n针对每个事件都会发生的主要活动是调查和诊断。事件将经历过之前涵盖的初始诊断步骤；这识别了服务台是否可以解决该事件，因为该事件以前出现过。此处的调查和诊断阶段不同；它涉及尝试确定发生了什么以及如何解决该事件。\n\
  \n应更新事件记录以记录已采取的行动，并对症状和采取的各种行动进行准确描述，以防止重复劳动；这在事件进行审查时（可能作为问题管理的一部分）也将很有用。典型的调查和诊断行动包括收集问题及其影响和紧急性的完整描述、创建事件时间线、识别可能的原因（如近期变更）、查询知识源（如已知错误数据库）等。\n\
  \n重要的是，这里的主要重点是识别需要采取哪些行动以恢复服务。它的重点不是完全的根原因分析，后者仅在需要时才会由问题管理过程进行。\n\n### 步骤 7：解决与恢复\n\
  \n潜在的事件解决方案应该经过测试，以确保它们能够完全解决问题且没有产生意外后果。这种测试可能涉及用户。其他解决行动可能包括服务台人员或技术人员远程接管用户的设备以实施解决方案，或向用户展示他们需要做什么。一旦事件解决，它将返回服务台进行关闭。\n\
  \n### 步骤 8：事件关闭\n\n\n\n\n当事件已解决且服务恢复后，服务台台将联系用户以验证事件是否可以关闭。这是一个重要的步骤，因为故障在 IT 部门看来可能已经解决，但用户可能仍然面临困难，特别是当实际上存在两个事件，且其中一个的症状被另一个掩盖时。只有在第一个事件解决后，第二个事件才会变得明显。服务台台可能会直接联系用户，也可以像之前描述的发送一封邮件，规定事件关闭的时间限制。\n\
  \n尽管事件已经解决，如果事件的根本原因仍然未知，则可能建立一个问题记录（problem record）以调查根本原因并防止再次发生。如前所述，有必要时检查并修改事件类别。最后，可能会进行用户满意度调查。\n\
  \n## 事件管理的触发器、输入和输出\n\n现在让我们来看一下事件管理过程的触发器、输入和输出。\n\n### 触发器\n\n事件管理过程是由事件通知触发的。正如已经讨论过的，这些通知可能来自用户、支持人员或供应商，也可能来自事件管理过程。\n\
  \n### 输入\n\n事件管理所需的输入信息包括：\n\n*   来自事件管理的事件通报。\n*   来自配置管理系统（`CMS`）关于 `CIs` 的信息。这些信息包括硬件位置及其配置、`CI`\
  \ 状态以及软件版本号。\n*   来自已知错误数据库的已知错误（known errors）及其变通解决方案（workarounds）。该数据库包含了变通解决方案的详细信息，能够快速解决某些反复发生的事件。\n\
  *   事件及其症状。\n*   最近的变更和发布。许多事件与具有意外副作用的变更有关；变更计划提供了有关近期和计划中变更的信息，这有助于诊断事件。有关计划变更的信息也可能有用，特别是当这些变更旨在实现对反复出现故障的修复时。\n\
  *   运营和服务水平目标。`SLAs` 中的信息为事件管理提供了解决目标，并对影响服务的事件的影响和紧迫性提供了指导。\n*   客户反馈。\n*   事件优先级排序和升级的准则。\n\
  \n### 输出\n\n事件管理的的输出信息包括：\n\n*   已解决的事件以及解决操作的记录\n*   具有准确事件细节和历史记录的更新后的事件记录\n*\
  \   原因已知后更新的事件分类；这交供问题管理使用\n*   未识别出事件根本原因的新型问题记录\n* 验证问题解决在停止反复事件方面是有效的\n* 关于与变更和发布相关的事件反馈\n\
  * 对受影响 `CIs` 的识别\n* 客户满意度反馈\n* 对事件管理活动有效性的反馈\n* 协助评估整体服务质量的事件和解决历史细节\n\n## 事件管理与生命周期阶段之间的接口\n\
  \n事件管理是所有服务提供商执行的关键过程。该过程与其他服务运营过程以及服务设计阶段和服务过渡阶段的内部过程之间存在若干联系。\n\n## 服务运营\n\n事件管理与问题管理之间存在强有力的接口。访问管理问题也可能导致事件，事件可能由于事件管理过程生成的警报而被记录。\n\
  \n**问题管理** 当你在在本章的后续讨论问题管理时将学，事件管理和问题管理之间有许多联系。事件管理提供关于重复事件的数据，问题管理利用这些数据来识别根本问题。这些问题的永久解决通过减少事件发生的次数来帮助事件管理。事件的影响和紧迫性信息有助于问题管理在不同问题之间进行优先级排序。\n\
  \n问题管理提供已知错误信息，使事件管理能够恢复服务。\n\n**访问管理** 事件管理在发生安全漏洞或未经授权的访问尝试后会提出事件。这些信息可以被访问管理用于调查访问违规。未能确保用户获得其工作所需的必要访问，可能会导致用户在尝试执行任务时遇到错误消息，从而报告事件。\n\
  \n**事件管理** 事件管理可能会根据事件管理报告的定义的警报条件提出事件。示例包括设备未能响应 `ping`，或者响应时间或磁盘使用率超过阈值，这表明发生了故障。某些服务管理工具可能配置为在某些情况下自动创建事件记录，甚至将其分配给正确的解决小组。\n\
  \n### 服务设计\n\n几个服务设计过程直接与事件管理过程接口。这些过程是我们在其他章节中讨论的内容之一，其中许多过程活动发生在服务运营生命周期阶段。\n\n\
  **服务水平管理** 正如我们所见，事件与服务水平管理（`SLM`）之间存在众多联系。事件具有目标响应时间和目标解决时间；这些目标设定在 `SLAs` 中。反之，事件管理提供来自服务管理工具集的管理信息，使\
  \ `SLM` 能够报告在实现这些目标方面取得的成功。事件报告使 `SLM` 能够识别失效的服务并为它们实施服务改进计划（结合 `CSI`）。\n\n**信息安全管理、IT\
  \ 服务连续性管理、容量管理和可用性管理** 事件管理收集有关安全相关事件和容量问题的数据。它提供了可用性管理用于计算可用性报告的停机数据，对事件记录的分析有助于可用性管理理解基础设施中需要关注的弱点。高效的事件周期还能提高整体可用性。特别在重大事件的情况下，事件管理可能需要调用\
  \ IT 服务连续性计划。\n\n## 服务过渡\n\n服务资产和配置管理（`SACM`）以及变更服务的过渡过程与事件管理接口。`SACM` 为事件过程提供有用信息，变更可能是事件的原因，也是解决事件的手段。\n\
  \n**服务资产和配置管理** 事件管理使用 `SACM` 数据来理解事件的影响，因为它显示了对每个 `CI` 的依赖。它提供了关于谁支持特定类别 `CI` 的有用信息。通过针对每个\
  \ `CI` 记录每个事件并检查 `CI` 用户是否与 `CMS` 中的记录一致，事件管理有助于保持 `CMS` 的准确性。\n\n\n\n\n# 变更管理\n\
  变更通常是为了解决事件而实施的。事件往往由变更引起。事件调查中的一个重要输入是变更计划；提出“在这次事件发生之前发生了什么变化？”这个问题通常可以揭示事件的原因。对于由变更引起的重大事件，可能会做出回滚该变更的决策。识别出有多少事件是由变更引起的信息，应反馈给变更管理部门，以改进未来的变更。\n\
  \n## 事件管理过程中的信息管理\n接下来我们来看事件管理过程中的信息管理。正如我们在考虑该过程对服务生命周期的价值时所讨论过的，事件管理负责收集大量的信息；这些信息不仅用于事件管理，而且还是许多其他过程的输入。高效有效的事件管理也依赖于来自其他过程的信息。让我们来看此过程中使用的常用信息源。\n\
  \n### 事件管理工具\n这些工具用于记录每一个事件，无论这些事件是由用户向服务台报告的、由技术人员报告的，还是由于事件管理工具检测到告警状态而创建的。这些工具将包含事件和问题历史、事件分类以及解决事件所采取的任何行动。这些工具还包含一线分析师使用的诊断脚本，用于立即解决事件，或者在无法解决时，确保收集足够的信息以帮助二线或三线分析师更快地解决。\n\
  \n### 事件记录\n每个事件将有一个关联的事件记录。事件记录需要包含足够的信息以便跟踪和解决事件，包括有关停机时间的详情、解决时间等，以便根据事件目标进行服务水平报告，以及供问题管理部门用于分析和确定根本原因的信息。事件记录中包含的典型信息包括以下内容：\n\
  \n* 唯一引用编号\n* 分类/归类\n* 创建及任何更新的时间戳（包括诊断和解决操作）\n* 创建或更新事件记录的人员名称\n* 受影响用户的名称和联系方式\n\
  * 症状描述\n* 事件类别、影响、紧急程度和优先级\n* 指向其他事件、问题、变更或已知错误的链接\n* 结单详情，包括结单分类\n\n### 服务目录\n\
  服务目录是事件管理过程的重要信息源；除了它提供的有关服务水平目标和交付目标的详细信息外，它还包含了以客户和用户能够理解的术表达的服务信息。在与客户沟通服务时，这些信息可能非常有用。\n\
  \n### 配置管理系统\n事件管理还需要访问 `CMS`。服务台人员将使用它来识别受影响的 `CIs`。这将有助于确定事件的影响。它还可能揭示几个表面上独立的事件实际上都是同一个故障的症状。例如，当路由器发生故障时，用户可能会报告有关打印、电子邮件访问以及特定应用程序问题的事件，而这些所有都是由同一个网络\
  \ `CI` 故障引起的。\n\n### 已知错误数据库\n已知错误数据库 (`KEDB`) 由问题管理部门提供给事件管理部门。我们将在下一节中详细讨论。`KEDB`\
  \ 为事件提供变通方案（workarounds），即使底层原因尚未解决。事件管理的目标是尽快恢复服务；这些变通方案能够快速实现这种恢复。\n\n## 事件管理中的角色\n\
  ITIL 框架规定每个过程都应有一位承担通用所有权职责的所有者（owner），以及一位专注于管理执行人员活动管理的经理（manager）。\n\n除了第一章“运营支持与分析引论”中概述的过程所有者、经理和执行人员的通用职责外，每个过程在\
  \ ITIL 框架中都有特定的识别的角色。在这里我们考虑特定的事件管理角色；在本章的后半部分，我们将查看为问题管理确定的角色。\n\n对于事件管理，通常有三个执行人员角色：一线分析师、二线分析师和三线分析师。一线分析师角色通常与服务台分析师角色相结合。其他角色对应于功能升级的级别，这意味着它们反映了所支持技术方面的技能、资历或经验水平。三线分析师通常与技术或应用管理职能相关。\n\
  \n记住这些是角色，而不是职位。每个组织都会为履行这些角色的人员定义职位和描述。\n\n### 事件管理过程所有者\n事件管理过程所有者的职责不仅包括通用所有者职责，还包括额外的特定事件管理任务。他们将设计并记录不同类型事件所需的工作流，并确保这些工作流在服务管理工具中配置。他们还识别常见事件并为这些事件创建事件模型，预定义记录和解决这些事件的步骤。\n\
  \n事件管理过程所有者还将与问题、事件、访问管理以及请求履行的过程所有者联系，以确保这些过程与事件管理集成。\n\n### 事件管理过程经理\n与事件管理过程所有者一样，事件管理过程经理的职责不仅包括通用经理职责，还包括额外的特定事件管理任务。这些包括监控和开发事件管理过程，以确保其高效有效并根据需要与其他过程接口，并在需要时提出改进建议。经理还必须确保所使用的工具支持该过程并提供所需的管理信息。该角色还负责参与事件管理的一线和二线人员的日常管理，并在发生重大事件时进行管理。在小型组织中，此角色通常分配给服务台经理/主管，但大型企业可能有足够的事件量来支撑一个独立的角色。执行此角色的人必须被赋予足够的权限，以确保事件得到有效的管理，无论哪个团队负责解决。\n\
  \n### 一线分析师\n该角色通常由服务台分析师承担。职责包括将所有事件记录到服务管理工具中，并尽可能在首次接触时解决它们。如果一线分析师无法解决事件，他们负责将其升级到正确的二线支持团队或第三方。\n\
  \n一线分析师需要足够的业务知识以便根据业务影响和紧急性对事件进行优先级排序，并需要足够的技术知识来正确分类事件并识别正确的支持团队。\n\n\n\n\n当事件被分配给二线、三线团队或外部供应商时，作为服务台一员的一线分析师仍保留事件记录的所有权。这涉及到监控事件状态，并根据需要进行跟进，以确保满足解决服务水平目标。在必要时，分析师将根据事件管理升级策略对事件进行升级。分析师还将向受影响的用户通报已进展。当事件解决后，分析师将联系用户以获得关闭事件的同意。\n\
  \n### 二线分析师\n\n某些组织可能会聘用一个二线通用支持团队。该小组不会提供专家级的深度支持；相反，这些人员将比一线分析师拥有更深的技术知识，由于他们不需要接听支持电话，因此他们有更多的时间来寻求解决方案。这种做法的优点是确保不复杂的事件可以较快地解决，且成本比需要更多专家三线支持的事件更低。一线人员用于实现解决方案的时间可能很短——通常在分配事件前有\
  \ 5–10 分钟的时间，因为在第一线解决问题上花费太多时间将影响在约定目标内接听电话支持电话的能力。二线分析师能够花费更长的时间——通常为 10–30 分钟来实现解决方案。\n\
  \n这种安排可以确保快速解决，同时充分利用了成本更高的技术专家，他们能够集中处理最困难的事件，并通过问题管理来调查根本原因。理想情况下，二线小组应位于服务台附近；这将有利于知识共享，并实现团队之间的人员调动。二线分析师可以在忙碌期间为服务台提供帮助，并为一线分析师提供培训。\n\
  \n大型二线分析师团队通常会有自己的经理；较的小组可能有一个主管。在某些情况下，两个团队都将向同一个事件经理汇报。\n\n### 三线分析师\n\n三线支持由技术专家提供；这些专家可能是内部小组或第三方供应商。典型的小组包括网络、服务器和桌面支持团队。其他三线小组还包括提供数据库支持的团队以及硬件和环境设备维护工程师。\n\
  \n应用程序管理通常将根据不同的应用程序或应用程序类型由不同的团队提供。某些应用程序可能由外部供应商管理。在应用程序开发和管理由同一团队执行的组织中，必须确保现有应用程序的支持优先级不会低于新应用程序开发的优先级。\n\
  \n## 挑战与风险\n\n在对事件管理过程的检查这一部分，我们查看了与该过程相关的挑战和风险。\n\n### 挑战\n\n事件管理面临许多挑战。首先是尽早检测事件的挑战。对基础设施的全面监控在此处起着重要作用，但还有其他工作要做——例如，实施用户教育，并鼓励用户在事件发生时随时报告事件。\n\
  \n一个常见的挑战是说服技术人员记录他们遇到的事件。他们的自动反应是修复问题并继续，这虽然是好事，但关于问题点的信息将无法被捕捉。\n\n糟糕或不存在的问题管理过程将意味着事件管理的工作量将继续增加，因为根本错误没有被发现和纠正。\n\
  \n缺乏一个持有有关 `CIs` 及其关系的准确信息的 `CMS` 是另一个挑战。一个全面的 `CMS` 将通过将 `CIs` 与服务关联来支持事件的优先级排序，并提供有价值的诊断信息。\n\
  \n最后，将过程与 `SLM` 集成将有助于该过程正确评估事件的影响和优先级，并帮助定义升级程序。\n\n### 风险\n\n事件管理面临的风险包括未能应对这些挑战。其他风险包括支持人员在数量和能力方面的资源不足，这意味着过程将会被无法在约定时间内处理的事件所淹没。\n\
  \n另一个风险是由于支持工具不足导致事件积压。通常认为，通用的成功服务管理（特别是事件管理）需要良好的工具。工具不足也会产生信息不充分的风险。\n\n最后，由于支持人员没有通过符合流程目标的\
  \ `OLA` 目标得到妥当激励，存在无法达到约定解决时间的风险。\n\n## 关键成功因素和关键绩效指标\n\n接下来我们查看事件管理的一些关键成功因素 (`CSFs`)，以及衡量\
  \ `CSFs` 是否已实现的关键绩效指标 (`KPIs`)。\n\n第一个 `CSF` 是尽可能地解决事件，从而最大限度地减少对业务的影响。衡量此点的两个关键性能指标包括平均解决时间以及事件在每个阶段的分解情况。在一线解决或远程解决的事件百分比也是这一关键成功因素正在被实现的关键指标。\n\
  \n事件管理的另一个关键成功因素是保持用户对 IT 服务的满意度。衡量其成功的 `KPIs` 包括平均用户/客户调查得分（总分和按问题类别分类）以及回答的满意度调查数量与发送满意度调查总数的百分比。\n\
  \n第三个 `CSF` 是维护 IT 服务的质量，衡量标准为报告的事件数量以及等待解决的事件积压保持稳定或下降。\n\n事件管理的另一个 `CSF` 示例是确保使用标准化的方法和程序进行高效、及时的响应、分析、记录、持续管理和事件报告，以维持业务对\
  \ IT 能力的信心。衡量这一因素实现的关键指标包括错误分配或分类的事件数量较低且正在减少。\n\n### 事件管理如何支持持续改进\n\n持续改进取决于数据的收集和分析，以识别需要改进的领域（支持“我们现在哪里？”活动）并判断改进倡议的有效性（支持“我们到达那里了吗？”活动）。事件管理过程收集对\
  \ `CSI` 进行的分析有用的数据，特别是显示事件趋势的数据。这些数据可以进行分析以确保其准确性，识别问题，并发现约定服务水平的实现受到威胁。\n\n事件管理过程还支持\
  \ `CSI` 进行的演示活动。它提供了 `CSI` 报告中使用的数据，通过展示事件对业务的影响，协助改进的优先级排序。\n\n# 问题管理\n\n根据 ITIL\
  \ 官方术语，`problem` 被定义为一个或多个事件的根本原因。`problem management` 是调查事件原因并在尽可能实施永久解决方案以防止再次发生的过程。在应用永久解决方案之前，它还将尝试提供变通方案\
  \ (workaround)，以使服务恢复并解决事件。\n\n\n\n理解事件（incidents）与问题（problems）之间的区别，并意识到事件`绝不会`变成问题，是非常重要的；它们是相互独立的实体，或者是相互关联的记录。\n\
  \n许多组织都犯了一个错误，认为问题管理并非不可不可。除非开展了问题管理，否则事件将反复发生，给业务带来不便并占用支持人员的时间。问题管理将减少事件，从而释放出更多时间来开展更多的问题管理。这是一个良性循环：投入的时间越多，释放的时间就越多。\n\
  \n让我们从定义什么是“问题”开始。`ITIL` 使用的定义是“一个或多个事件的根本原因”。\n\n“问题”（problem）一词的使用经常被误解。在服务管理之外，我们可能会听到有人将网络完全崩溃描述为一个“大问题”。但服务管理会将其描述为一个“事件”，可能是一个“大事件”。如果我们不知道网络为何故障，那么我们就拥有了一个“问题”。如果我们知道故障发生的原因，那么就没有问题。所以，问题是一个谜团——即事件为何发生之之谜团。\n\
  \n### 目的\n问题管理流程的目的是记录、调查并消除事件的原因。它还提供了另一个实用的益处：通过提供临时解决方案（workarounds），它减少了已发生事件的影响。它主动识别基础设施中可能导致事件的错误，并提供永久解决方案，从而防止事件的发生。\n\
  \n### 目标\n问题管理旨在识别事件的根本原因，记录已知错误（known errors），并采取行动进行修复。问题管理有三个简单的目标：\n\n* 首先，它必须防止问题及由此导致的事件发生。\n\
  * 其次，它应该消除反复发生的事件。这是一个关键目标；没有什么比反复发生的事件对服务提供商声誉的损害更大的了。\n* 第三个目标是尽可能地减少无法避免的事件的影响。底层故障并不总是可以修复，或者可能需要一些时间来实施修复，但问题管理可以在事件发生时识别出一种快速、可靠的恢复服务的方法。\n\
  \n### 范围\n问题管理的范围包括诊断事件的根本原因，并与其他流程（如变更管理以及发布和部署管理）结合采取必要行动以永久消除它们。\n\n问题管理还负责汇有关问题以及任何相关的临时解决方案或解决方案的信息。通过识别故障、提供临时解决方案并然后永久消除它们，问题管理减少了事件的数量和影响。它与知识管理有着紧密的关系，因为它负责维护已知错误数据库，也可以说它是持续服务改进的一部分。\n\
  \n这两个主要的服务运营流程之间存在着重要的相似之处和差异。通常会使用同一个服务管理工具来跟踪事件和问题，一个良好的工具将有助于将事件发生与特定的问题记录相关联。可能会使用类似的类别和优先级分类。然而，问题管理可能是一个业务部门并不感知的流程。一旦应用了临时解决方案并解决了事件，用户可能就不再考虑它了。与此同时，IT\
  \ 服务提供者使用问题管理来防止再次发生。有效的临时解决方案可以减轻支持人员的压力，让他们有时间调查根本原因，而不会因为服务尚未恢复而被催促给出解决方案，因为服务已经恢复了。\n\
  \n正如我们所说的，事件是 IT 服务的非计划内中断或 IT 服务质量的降低。有时，在查明并修复原因之前，事件是无法解决的；例如，服务器由于硬件故障发生故障且无法重启。\n\
  \n### 问题管理对业务和服务生命周期的价值\n问题管理的价值源于它将减少事件对组织的影响。永久修复往往会减少事件的数量，而临时解决方案能够快速解决反复发生的事件。这些共同意味着服务可用性更高，以及随之而来的所有意义：\n\
  \n* 问题管理提高了 IT 员工的效率，因为他们花在调查和解决事件上的时间少了。\n* 问题管理识别事件的根本原因，因此能够制定出始终有效的修复方案或临时方案。如果根本原因未知或被误解，那么存在任何修复或临时方案可能无效的风险。\n\
  * 该流程减少了反复事件的影响，从而减少了相关成本。\n\n### 政策、原则和基本概念\n接下来我们考虑支撑问题管理的政策、原则和基本概念。\n\n### 政策\n\
  `ITIL` 服务运营出版物建议了三项支持问题管理的政策。\n\n第一项政策规定，“问题应该与事件分开跟踪”。这两个流程的关注点非常不同，特别是在问题管理的主动活动方面。\n\
  \n第二项政策规定，“所有问题都应该存储并管理在一个单一系统中”。例如，让每个技术团队拥有自己的问题数据库并不是一个好主意。有许多理由说明单一管理系统至关重要。例如，问题的调查需要使用稀缺的技术资源。为了充分利用这些资源，我们应该对这些活动进行优先级排序，在这种背景下，即优先考虑问题——如果问题信息散落在许多数据库或电子表格表中，你如何做到这一点呢？\n\
  \n最后一项问题管理政策规定，“所有问题都应该遵循一个跨越整个企业的标准分类方案”。问题的标准分类提供了更快速的调查和诊断数据访问，并能够实现更有效的分析，特别是通过主动的问题管理。注意，这项政策说的是“跨越整个企业”。对于全球性企业来说，无论在世界何地方出现都应该以相同的方式进行分类。\n\
  \n### 原则和概念\n问题管理的原则和概念包括响应性和主动方法、问题模型、已知错误和临时解决方案。\n\n**响应性与主动性**：与事件管理不同（事件管理完全是响应性的，在事件发生之前你无法解决它），问题管理同时具有响应性和主动性的特征。\n\
  \n* 问题管理将对事件做出响应，并尝试识别临时解决方案和永久解决方案。\n* 问题管理还将主动尝试识别潜在事件，并采取行动防止其发生。这可能包括对事件趋势的分析，例如对响应时间慢的间歇性但日益增加的投诉，以识别潜在的容量问题。通过与容量管理协作，我们可以采取主动措施提供足够的容量，并避免任何重大的服务中断。事件管理报告也可以达到相同的目的，即在用户意识到任何问题之前防止事件发生。\n\
  * 问题管理可以协助大事件回顾，试图识别如何防止再次发生。\n\n\n\n\n管理针对事件响应而产生的问题以及主动识别的问题，其流程步骤大体上相似。主要的区别在于流程的触发因素。响应性活动是由于事件报告而发生的，有助于防止事件再次发生，或者在无法避免时提供规通方法（workaround）；这些活动补充了事件管理流程。\n\
  \n主动性问题管理通过分析事件记录来识别事件的根本原因。对先前的事件进行分析可能会揭示某种在每个事件发生时并不明显的趋势或模式。例如，用户可能会周期性地投诉响应速度慢；但只有当对所有这些投诉进行分析时，才能发现响应缓慢总是针对同一个模块或来自同一个位置的报告。这将触发建立一个问题记录，以识别连接所有这些事件的共同原因。\n\
  \n响应性和主动性问题管理活动通常作为服务运营的一部分进行，但问题管理与持续服务改进（CSI）密切相关。如果通过问题管理识别出改进机会，应将其录入 CSI 注册。\n\
  \n### 问题模型 (Problem Models)\n大多数问题都是唯一的，无法以预定的方式进行调查。但有时存在无法解决的底层问题——它们太困难、解决成本太高，或者超出了我们的行动范围。例如，一个设计不当的应用程序随着时间的推移可能会经历间性的事件，每个事件都有不同的特定原因，并导致不同的问题。问题模型可以指导对该应用程序中问题的调查。例如，它可能描述如何收集和解释相关的诊断信息。\n\
  \n### 事件与问题 (Incidents vs. Problems)\n正如我们所说的，问题管理和事件管理关系非常密切。尽管事件管理不负责发现其所调查的事件的根本原因，但有时为了解决事件，有必要这样做。在那种情况下，问题管理应该参与。从潜在上来说，每当发生没有对应问题记录或已知错误记录的事件时，问题管理都可以介入，但那可能属于过度。。每个组织都应该根据其特定情况，定义决定何时参与问题管理标准。问题管理参与重大事件的处理是非常常见（甚至可以可以说是常态）的。\n\
  \n### 已知错误 (Known Errors)\n当我们详细检查问题管理流程时，会看到该流程尝试识别并记录已知错误，通常是在问题原因已知且有可用规通方法，但永久修复尚未应用的情况下。已知错误记录用于记录根本原因和规通方法，并在再次发生进一步事件时允许更快速的诊断和解决。这并非已知错误的唯一来源。有些错误来自应用程序开发。通常的情况是，新应用程序尽管软件存在已知\
  \ bug 也会上线，因为这些 bug 被认为不值得推迟发布。在这种情况下，这些 应该记录在已知错误数据库中，以便在现场运行期间发生事件时可以使用。这些 bug\
  \ 可能在开发阶段或服务转换的测试期间被发现。这些 bug 或在测试期间识别的缺陷通常被称为 `development known errors`（开发已知错误）。\n\
  \n### 规通方法 (Workaround)\n规通方法定义为减少或消除尚未完全解决方案的事件或问题的影响手段——例如，通过重启失败的配置项。问题的规通方法记录在已知错误记录中。\n\
  \n### 流程活动、方法和技术 (Process Activities, Methods, and Techniques)\n问题管理流程的首要考虑因素是决定何时以及在什么情况下应该建立问题记录。\n\
  \n有时，在事件仍然开启时建立问题记录是有帮助的。每个组织都将决定自己的何时建立问题记录的标准。例如，当支持团队确定事件是由新问题引起时，可能会建立问题记录，因为该事件似乎是某种趋势的一部分，或者与现有的已知错误不匹配。事件可能已由服务台或支持团队解决，但不知道原因，因此存在故障可能再次发生的风险。这在重大事件的情况下尤为如此；需要尽快识别根本原因，以防止未来对业务的干扰。（问题诊断活动可能与事件解决并行进行，并在成功解决后继续，直到根本原因被识别并消除。）\
  \ 供应商也可能向其客户通报他们已识别的问题。\n\n如前所述，问题管理不是一项可选的活动；它是提供符合 SLA 承诺的一致服务的基础。通过提供规通方法使一线员工能够解决事件，可以更有效地利用那些技能更高、因此也更昂贵的二线和三线人员，他们被释放出来利用其技能进行问题调查。\n\
  \n#### 流程活动 (Process Activities)\n现在我们将逐逐步检查问题管理流程。在讨论每个活动时，请参考图 2.3。\n\n![流程图显示问题管理流程从服务台、管理层（事件、事故和主动问题）和电子邮件开始，向下流问题（决策、记录、分类和优先级排序）、规通方法、变更等。](img/00011.jpeg)\n\
  \n**FIGURE 2.3** 问题管理流程\n\nCopyright © AXELOS Limited 2010\\. 保留所有权利。材料根据 AXELOS\
  \ 的许可复制。\n\n### 第一步：检测问题 (Detecting Problems)\n流程的第一步是识别问题的存在。正如我们之前讨论过的，问题记录可能是响应性地响应事件而建立，也可能是主动建立。除了之前识别的触发因素外，问题还可能是作为事件管理部分接收到的警报的结果识别的。事件监控工具可能在用户发现之前识别故障，并自动响应建立事件。\n\
  \n如图 2.3 所示，问题可以通过多种方式识别，但它们都由单一的问题管理流程处理并记录在单一数据库中。一个主要来源是代表事件管理流程运行的服务台。任何原因未知的事件都可能触发问题调查。在实践中，很少有组织会这样做，因为会产生大量的问题。大多数组织对记录和调查的问题具有很强的选择性。通过对事件数据进行定期分析来补充，寻找可能被遗漏的重复事件。潜在问题也可以事件管理和供应商识别，当然，主动性问题管理本身也会识别问题。\n\
  \n### 第二步：记录问题 (Logging Problems)\n\n\n\n\n\n在确认问题存在后，应该记录一个问题记录，其中包含所有相关信息并加时间戳，以提供完整的的视图。典型数据将包括报告人及时间详情、所使用的服务和设备详情，以及事件的描述和所采取的行动。还需要事件记录编号、优先级和类别。\n\
  \n在可能的情况下，请使用服务管理工具将问题记录与相关的事件记录关联起来。请记住，事件并没有“变成”问题；无论问题是否已解决，事件都必须继续被管理直到得到解决。\n\
  \n### 第 3 步：对问题进行分类\n\n然后将使用与事件管理相同的方法对问题进行分类，这使得事件和问题能够更容易地匹配。例如，可能将多种类型的事件与一个共同问题相关联，这将带来大量的额外诊断信息。\n\
  \n问题经理应该向服务台强调准确分类的重要性。在此处，使用事件模型（incident models）会很有帮助，因为它们标准化了常见事件的记录方式。如前所述，在解决事件时强制执行分类也有助于确保事件类别的准确性。\n\
  \n### 第 4 步：确定问题的优先级\n\n与事件一样，问题的优先级应该基于其引发的事件对业务的影响以及解决这些事件的紧急程度。问题经理还应该考虑事件发生的频率。可能一个可以通过重启解决的“屏幕死机”并不是一个高优先级事件；但如果它每天发生\
  \ 100 次，对业务的累计影响可能是严重的，因此该问题需要分配高优先级。必须始终考虑对业务的影响，因此在评估优先级时，解决事件的成本以及可能所需的时间因素是相关的。\n\
  \n分析受影响人数、停机持续时间和业务成本等因素被称为“痛苦价值分析”（pain value analysis）。这种技术对于确定问题的业务影响非常有用。当然，情况会发生变化，新信息会被获取，并且可能会发生进一步的事件，因此问题的优先级应保持审查并在并在时进行更改。\n\
  \n### 第 5 步：调查和诊断问题\n\n该流程的下一个阶段是调查和诊断问题。此阶段的目的首先是发现根本原因，然后确定临时解决方案（workaround）和永久修复。可能没有资源来调查每一个问题，因此分配给每个问题的优先级将决定哪些问题能获得必要的关注。为问题调查分配资源是重要的，因为在问题解决之前，事件会反复发生，资源将消耗在事件解决上。\n\
  \n通常，调查和诊断问题的任务会交给适当的技术或应用团队。如果不清楚问题源于何处，可能需要建立技术专家团队来进行调查。有时，有必要将问题升级给供应商。\n\n\
  ITIL 框架建议了多种不同的问题解决技术，有助于逻辑性地进行诊断。`CMS` 可以通过提供 `CI` 信息来帮助识别根本原因。当报告多个事件时，它也有助于识别故障点；`CMS`\
  \ 可能会识别出所有受影响的 `CIs` 都链接到同一个 `CI`。`KEDB` 也可能提供有关以前的类似问题及其原因的信息。如果存在测试环境，可以使用它来重现故障并尝试可能的解决方案。\n\
  \n### 第 6 步：识别临时解决方案\n\n虽然问题管理的目标是找到并消除事件的根本原因，但这可能需要一些时间；在此期间，事件将持续，服务也会受到影响。当用户遭受事件时，首要任务是恢复服务，以便他们能够继续工作。因此，该流程的优先级是提供一个临时解决方案，一直使用直到问题解决。临时解决方案是减少错误影响的手段。它可以以规避措施（circumvention）的形式存在，即避免触发事件的工作方法，也可以是在事件发生时解决事件的方法。此时，应该建立一个已知错误记录并将其存储在已知错误数据库中。\n\
  \n临时解决方案并不修复底层问题，但它通过提供实现相同结果的替代手段，允许用户继续工作。可以把临时解决方案提供给服务台，以便他们在继续开发永久解决方案的同时解决事件。问题记录保持开启状态，因为故障仍然存在并持续导致事件。临时解决方案的细节被记录在问题记录中，并可能对其优先级进行重新评估。\n\
  \nIT 或业务管理可能会决定继续使用临时解决方案，如果认为永久解决方案不合理，则暂停对永久解决方案的工作。例如，影响一个即将被替换的服务的问题，可能不值得实施永久解决方案所涉及的精力和风险。\n\
  \n当然，并非总能设计出临时解决方案，有时业务对临时解决方案是不可接受的——故障必须被修复。\n\n### 第 7 步：建立已知错误记录\n\n当问题管理识别并记录了根本原因和临时解决方案后，这些信息将作为“已知错误”（`known\
  \ error`）提供给支持人员。关于所有已知错误的信息（包括它与相关的问题记录）都记录在`已知错误数据库 (KEDB)` 中。当重复事件发生时，支持人员可以参考\
  \ `KEDB` 获取临时解决方案。\n\n有时尽管根本原因尚未明确，但已有临时解决方案（例如，重启恢复了服务，尽管我们不知道什么导致了错误）。在其他情况下，我们可能知道原因但没有临时解决方案，因为必须实施变更来修复故障。\n\
  \n有时在临时解决方案可用之前就会建立已知错误记录，有时甚至在根本原因被完全识别之前就会建立。这可能只是为了提供信息目的；可能存在一个尚未经过完全证明的临时解决方案。与其对于何时应该建立已知错误记录制定死板的规则，不如采取更务实的方法；一旦建立已知错误变得有用，就应该立即建立。\n\
  \n### 第 8 步：解决问题\n\n当问题管理识别出问题的解决方案后，应该实施该方案以解决底层故障，从而防止任何进一步事件干扰服务。然而，实施解决方案可能涉及一定风险，因此变更管理流程将在确保\
  \ `RFC` 的风险和影响评估满意之前允许该更改。错误可能存在于一个计划在近期阶段淘汰的应用程序中，因此业务可能会选择暂时接受可能的中断，而不是接受修复的成本和风险。根结底，在存在风险的情况下决定继续执行解决方案是一个业务决策；问题对业务造成的损害可能意味着业务愿意接受风险以实施修复。\n\
  \n### 问题关闭\n\n\n\n\n\n当问题的永久解决方案已通过变更管理流程经过识别、测试并实施后，就可以更新并关闭问题记录。由该问题引起的任何开放事件也可以被关闭。应该更新\
  \ `KEDB` 以显示问题已解决，这样未来的任何事件将不再由其引起；然而，问题记录中包含的信息可能在处理未来的类似问题时证明有用。\n\n## 重大问题审查\n\
  \n每个重大问题都应该是正式审查的对象，以便从经验中学习。每个组织都必须确定对其而言什么构成了重大问题。审查应该在事件发生后立即进行，此时记忆还很新鲜。审查由问题经理领导，但应包括所有参与过受审查事件的人员。\n\
  \n审查不仅关注最初触发重大问题的故障，还关注之后发生发生和所做的一切事情。换句话说，它采取的是整体视角。\n\n具体而言，审查提问：\n\n* 我们做了哪些事是正确的？我们做了哪些事让情况变得更糟？\n\
  * 未来我们哪些可以做得更好？\n* 我们可以做什么来防止其再次发生？\n* 是否有任何改进建议？这些可能涉及对流程或技术的更改，可能需要对支持或其他人员进行特定培训，也可能需要供应商采取行动或更改合同。\n\
  \n重大问题审查在重建客户信任方面也起着重要作用，客户信任可能已经因为重大问题而遭受损害。审查的实施和产生的报告应该考虑到这一点。在审查中包含一名业务代表可能是很有用的。\n\
  \n图 2.4 展示了事件、问题和变更管理活动之间的关联方式。它在很大程度上是自显明的。注意，事件在服务恢复时关闭，但只有在应用修复并确认有效后问题才会关闭。有时问题管理无法提供替代方案，因此事件将保持开放直到实施永久修复。\n\
  \n![图像显示了事件管理（记录、调查、实施替代方案和提出问题）、问题管理（调查、识别替代方案和解决方案并提出变更）以及变更（实施变更），每个类别的结尾都有关闭。](img/00012.jpeg)\n\
  \n图 2.4 事件、问题和变更如何关联\n\nCopyright © AXELOS Limited 2010. 版权所有。材料根据根据 AXELOS 的许可进行复制。\n\
  \n## 问题分析方法与技术\n\n分析问题有许多不同的方法。选择最合适的方法取决于情况、可用工具以及相关人员的偏好。在这里，我们检查一些更常用的技术：\n\n\
  ### 时间序列分析\n这种技术是许多人在使用时完全没有意识地将其视作一种技术；它是一种记录发生了什么以及在何时发生的逻辑方法。通过绘制时间线，我们可以看到哪些事件可能触发了事件，如果可能的原因不符合时间线，我们也可以排除它们。例如，可能倾向于将事件归咎于最近的某变更，但时间线可能证明事件在变更实施之前就已经发生了。\n\
  \n### 痛苦值分析\n这种技术用于评估影响。仅对发生次数进行简单计算，本身并不能告诉我们特定问题对业务的影响；某些事件可能发生频繁，但不会影响业务实现其目标。痛苦值分析使用公式来计算事件/问题给组织带来的痛苦程度。该公式将考虑因素，如影响人数、停机时间以及对业务成本的评估。通过估算痛苦值，可以对事件/问题进行排序，并按照与真实业务影响的顺序进行处理。\n\
  \n### Kepner-Tregoe 分析\n这种技术由 Charles Kepner 和 Benjamin Tregoe 发明。它有助于避免在理解问题之前就对原因跳下结论的倾向，这会导致精力和时间的浪费。该技术涉及一种结构化的、逻辑的问题分析方法，将潜在原因缩小到符合所经历问题属性的范围内。步骤是：\n\
  \n* 定义\n* 描述\n* 建立可能的原因\n* 测试\n* 验证\n\nKepner-Tregoe 方法从定义和描述问题开始，特别是关于它发生在何地以及何时，以及何地以及何时没有发生。例如，响应不佳的实例只发生在周二上午，且仅发生在某一个卫星办公室；任何可能的原因都必须符合这种模式（可能与该办公室仅在周二上午进行的工作有关）。其他不能解释为何故障仅在特定地点和时间发生的建议原因可以被排除。因此，使用这种技术可以对可能的原因进行建立、测试和验证。\n\
  \n### 头脑风暴\n当问题原因不明确时，经常使用这种技术；它有助于考虑所有可能的原因，而不仅仅是最明显或最常见的。它还帮助打破每个小组倾向于专注于自己专业领域的倾向，而解决方案可能需要了解不同技术如何相互作用的知识。所有相关人员都聚集在一起，通常是面对面的会议。头脑风暴要求引导者记录每一个关于可能原因的建议，在记录所有建议之前，不允许会议转向对建议的讨论或争论。这种方法有助于不明显的可能原因显现。一旦提出了所有建议，就会在会议期间进行讨论和评估，此时各小组代表的参与能够比单一支持团队提供更全面的评估。头脑风暴会议如果引导良好，通过打破关注熟悉事物的倾向并鼓励创新理论是有用的。\n\
  \n### 5 问法\n这是一种简单的技术，使我们能够追溯到根源。首先，我们询问为什么发生了某个事件——简单的答案可能是发生了硬件故障。通过进一步询问故障为什么发生，以此此类推，我们可以得出真正的根源。问五轮“为什么”通常足够了；有时根源可能很快显。例如：\n\
  \n描述：我的汽车无法启动。为什么？答案：因为电池没电了。为什么电池没电了？答案：灯没关。为什么灯没关？答案：当我从点火锁取出钥匙时，应该提醒我灯还亮着的报警器没有响。为什么报警器没有响？答案：报警器和仪表盘之间的连接松了——这就是根源。如果不找到根源并修复连接，事件将再次发生。这是一个简单且快速的技术。\n\
  \n### 故障隔离\n这种方法涉及理解正确操作中应该的一系列步骤，并按顺序检查每一个。例如，连接到网站需要 PC、浏览器软件、Wi-Fi 连接、调制解调器、宽带链路和远程网站正常工作。通过逐一测试每一个——PC\
  \ 是否正常、是否可以使用不同的浏览器访问网站、是否连接到路由器、是否可以访问其他网站等——我们就可以确定故障在哪里。\n\n\n\n\n\n## 亲性映射 (Affinity\
  \ Mapping)\n这种技术适用于需要处理大量数据的工作讨会。如果不进行妥善管理，此类研讨会可能导致只有最大的声音被听到，而良好的建议可能会丢失。这种方法允许根据头脑风暴产生的大量想法自然关系进行分组，以便进行评审和分析。\n\
  \n该过程始于将每个想法记录在卡片或便利签纸上，并将它们贴在墙上或桌子上。接下来，将所有卡片分组，并寻找看似相关的想法。每个生成的组都被赋予一个名称，以标识这些相似之处。然后对小组进行分析，查看是否可以识别出共同原因。\n\
  \n## 假设检验 (Hypothesis Testing)\n该方法在头脑风暴中使用有经验的推测来编制可能的根本原因列表，然后对每个假设进行测试。例如，解释与响应缓慢相关的事件的一个建议假设是由于最新应用程序版本的错误；这可以通过在其他地方安装该版本并观察是否产生响应缓慢的结果进行测试，并通过在其他\
  \ `CIs` 上回滚该版本，以确定事件是否停止发生。\n\n## 技术观察站 (Technical Observation Post)\n该方法用于原因不明的间歇性事件。某些问题只有在我们观察到它们发生时才能被完全理解。专家支持人员聚集在一起实时关注监控事件，专注于特定问题。一个经常被引用的例子是“城市传说”，解释每天晚上发生的服务丢失是由于办公室清洁员拔掉\
  \ IT 设备以插上吸尘器插头造成的。只有在观察到清洁员这样做时，原因才会被识别出来。\n\n## 石川图 (Ishikawa Diagram)\n石川图，有时也被称为鱼骨图或因果图，以日本质量控制专家石川馨（Kaoru\
  \ Ishikawa）的名字命名。这种技术是记录和视觉化表示可能原因和结果的有效方法。与讨论的其他一些方法一样，它通常用作头脑风暴研讨会的一部分，参与者在会上提出可能的原因。它与“5\
  \ 问法”类似，因为它深入到了可能导致故障的情况。主要目标由图的脊柱表示，主要原因由骨头表示。然后将次要原因作为骨头添加，从较高层次分叉，依此类推。图 2.5\
  \ 显示了此类图表的开头，其中识别出了网络停机的四个主要原因。图 2.6 显示了如何将这些每一个逐分解为可能的原因，然后这些原因再被分解。\n\n![图像显示了石川图，带有技术、过程、人员、环境的鱼骨模型，导致了不可接受的网络停机水平。](img/00013.jpeg)\n\
