  \ license from AXELOS\n\nTABLE 13.1 服务测试模型示例\n\n## 测试视角\n\n服务验证和测试应关注那些将使用、交付、部署、管理和运行服务的者的视角。测试的进入和退出标准将在服务设计包的开发期间制定。这应该涵盖以下几个方面：\n\
  \n* 服务设计（功能性、管理和运营性）\n* 技术设计\n* 流程设计\n* 测量设计\n* 文档\n* 技能和知识\n\n服务验收测试关注于服务需求的验证。这由利益相关者进行验证，这些人员包括业务客户或客户代表、供应商以及服务提供者。\n\
  \n### 业务用户和客户视角\n\n验收测试的业务视角应该包含一种定义并同意的服务衡量方法，以确保其符合他们的需求，并有适当的机制来管理与服务提供者的接口。这需要业务部门提供适当水平和能力的资源来参与测试。\n\
  \n服务提供者需要业务方的互动，以确保在过渡过程中的持续参与，并确保新或变更服务的整体质量符合预期。\n\n可以使用用例来确保测试涵盖了服务提供者与业务部门之间真实的交互场景。\n\
  \n用户测试应涵盖应用程序、系统和服务的需求，并确保这些满足最终用户的功能和质量需求。用户验收测试 (UAT) 尽可能真实地模拟生产环境。确保测试视角恰当，并且预期并非所有工作都能完美运行是非常重要的。\n\
  \n### 服务运营和持续服务改进视角\n\n不要忘记测试新或变更的服务是否可以被成功管理和支持。这应该包括一些基本元素：\n\n* 技术\n* 员工技能、知识和资源\n\
  * 支持流程和资源\n* 业务和 IT 连续性\n* 通过 SKMS 进行文档和知识管理\n\n持续服务改进的参与确保新或变更的服务作为整体服务管理改进方法范围的一部分被采用。\n\
  \n## 测试分级\n\n测试与服务资产和产品的直接相关，有确保每个资产都有相关的验收测试和活动，以验证其是否符合需求。\n\n图 13.1 中的图表有时被称为服务\
  \ V 模型，它将测试类型映射到开发的每个阶段。使用 V 模型可以确保测试涵盖了业务和服务需求，以及技术需求，使交付的服务能够满足客户对实用性（utility）和保证（warranty）的预期。左侧显示了从服务需求到详细的服务设计。右侧侧于针对这些规范执行的验证活动。在左侧的每个阶段，右侧相应的方都会直接参与。这表明服务验证和验收测试规划应该从定义服务需求开始。例如，签署了约定服务需求的客户也将签署服务验收标准和测试计划。\n\
  \n![图像显示了服务计划（评审、验收、运营和发布的设计与计划）的配置级别和基准。这些最终结束于服务组件的构建和测试。](img/00060.jpeg)\n\n\
