  \    4. 两个陈述都不是\n\n10. 服务稳定性的重要在本章中反复提到；维持这种稳定性的方法之一是确保一致地执行常规任务。哪个功能以此作为*主要*目标？\n\
  \    1. 技术管理\n    2. IT 运营管理\n    3. 应用管理\n    4. 服务台\n\n# 第 6 章\n\n## 运营支持与分析的技术与实施考虑\n\
  \n**本章讨论了以下 ITIL 运营支持与分析高级考试目标：**\n\n* **![images](img/00005.jpeg) 服务运营技术考虑：**\n\
  \    * 有利服务运营的工具类型\n    * 服务管理工具的通用需求\n    * 服务管理工具特定的服务运营流程需求\n    * 工具的使用以及它们如何支持服务生命周期\n\
  * **![images](img/00005.jpeg) 服务运营与项目管理**\n* **![images](img/00005.jpeg) 服务运营中的风险评估与管理**\n\
  * **![images](img/00005.jpeg) 设计与过渡中的运营人员**\n* **![images](img/00005.jpeg) 规划与实施服务管理技术**\n\
  * **![images](img/00005.jpeg) 挑战、关键成功因素和风险**\n\n![](img/00006.jpeg) 本章将所有技术和实施要求整合在一起，定义了用于服务运营的集成服务管理技术工具整体的需求。相同的技术（带有可能的补充）应用于\
  \ IT 服务管理（ITSM`的的其他阶段——服务策略、服务设计、服务过渡和持续服务改进——以确保一致性并允许有效的 `ITSM` 生命周期得到妥善管理。\n\n\
  工具可以帮助服务运营和其他流程更高效地工作。它们应该允许快速、一致地执行大量的重复性工作。工具还提供了丰富的管理信息，从而识别弱点和改进机会。\n\n工具的使用有助于标准化实践，并实现流程的集中和集成。\n\
  \n\n\n\n\n我们将考虑此类工具的通用需求，以及支持服务台台功能和请求履行、事件、事件、问题和访问管理等服务运营过程所需的特定需求。至关的一点是，使用的工具应该支持流程，而不是让流程来适应工具。\n\
  \n我们还考虑了适用于服务运营生命周期阶段的挑战、关键成功因素和风险。\n\n# 服务管理工具\n\n我们将首先考虑 IT 服务管理工具的通用需求。在这一节中，我们将查看其中许多需求，我们预期的任何良好的集成工具集都应该提供这些需求。\n\
  \n前两个需求是自服务功能和工作流引擎。\n\n你可能能从对请求履行过程的讨论中记得，我们曾讨论过通过自服务功能处理请求或简单事件的选项。这可能仅限于请求和事件的记录，也可以允许它们在整个生命周期内被跟踪和更新。提供自服务设施的优势在于可以随时记录请求和事件，而且此过程不依赖于服务台台人员在场接听。这有助于服务台台处理大量的电话，因为那些不那么紧急的电话可以通过自服务、自助记录站点来处理。例如，自服务请求工具可以协助重置密码，通过要求用户在重置发生前回答预设的问题来验证其身份。此外，自服务请求工具还可以下载已批准的请求软件版本。\n\
  \n下一个通用需求是工作流或流程引擎，它可以自动处理流程步骤（分配、升级等等.）。它还可以在完成先决步骤后发布工作单。\n\n下一个通用需求是集成的配置管理系统（`CMS`）。服务管理工具应与\
  \ `CMS` 集成，以便对组织的配置项（`CI`）信息进行查询，并根据情况将其与事件、问题、已知错误和变更记录关联起来。\n\n另一个通用需求是发现、部署和许可技术工具；这些工具在验证\
  \ `CMS` 的准确性方面非常有帮助，特别是在许可证使用方面。如果只能提取并报告自上次审计以来的更改，那也将非常有帮助。相同的技术通常用于将新软件部署到目标位置；这对于能够将补丁、升级等分发给正确的用户至关重要。\n\
  \n当与之前提到的自服务功能结合使用时，这将促进许多软件服务请求履行的自动化。\n\n另一个通用需求是远程控制。这允许服务台台分析师（在适当控制的安全条件下）接管用户的桌面，执行诸如调查和纠正设置等操作。\n\
  \n某些工具将存储诊断脚本和其他诊断程序，以协助对事件进行早期诊断。\n\n良好的报告是任何 ITSM 工具集的需求。工具持有大量关于日常发生情况的大信息。这些数据有助于提前规划和跟踪趋势，但此类报告要有用，就必须是灵活的。标准报告和临时报告都应该易于获取。\n\
  \n另一个需要考虑的通用需求是仪表板功能。仪表板对于日常运营以及 IT 和业务管理清晰了解实时性能都是很有用的。\n\n为了实现更强大的业务对齐，业务应用程序和工具需要能够与\
  \ ITSM 支持工具接口以提供所需的功能。集成的一个示例包括事件管理工具识别信用卡上的异常消费模式。\n\n软件即服务（`SaaS`）技术提供了通过互联网进行托管的服务管理能力。这带来的优势包括较低的资本和启动成本、更快的实施以及内置的服务连续性。\n\
  \n然而，这意味着定制和功能更改有限，访问受限于供应商合同的服务可用时间，并且许可方案可能变得具有限制性或昂贵。数据存储大小也可能存在限制，并可能存在安全和访问管理的约束或风险。最后，与其他服务管理工具的集成可能是困难是不可能的。\n\
  \n每个组织都应该仔细审查其需求，以便为其需求获取最合适的工具集。\n\n# 服务运营过程的需求\n\n在这一节中，我们将考虑每个服务运营过程的需求。\n\n\
  ## 事件管理\n\n该过程的工具需求包括与标准简单网络管理协议（`SNMP`）代理的开放接口，以便能够管理来自不同技术的事件。工具应该易于部署，并将所有事件路由到单个位置。它应该能够被编程根据症状和影响不同地处理告报，并在事件在规定时间内未收到响应时升级事件。工具提供有意义的管理信息和业务用户仪表板是关重要的。它还应该有直接进入组织事件管理过程的接口。另一个可能的能力是使用\
  \ `SMS` 消息将事件升级给支持人员。\n\n## 事件管理\n\n接下来，我们将考虑事件管理的特定工具需求。\n\n第一个是快速记录事件的能力，通常通过对常见事件使用预定义的“快速通话”（也称为事件模型），并带有预设的分类、优先级和分配。对事件的跟踪和报告也必须简单且高效。\n\
  \n另一个需求是集成的 `CMS`，允许在事件、服务请求、问题、已知错误、替代方案以及所有其他 `CI` 之间建立并维护自动关系。 `CMS` 还应该能够协助确定优先级、帮助调查和诊断，并升级到技术和应用管理中的适当解决方案团队。\n\
  \n流程流引擎至关重要，允许使用目标时间预定义流程，以实现工作流和升级自动化。例如，如果支持团队在 60 分钟内未对分配给他们的事件做出响应，团队长会自动收到通知。\n\
  \n如之前讨论的，应该有一个到事件管理的接口，以便故障自动转换为事件，并可以建立网络界面允许使用自服务工具以及对事件和服务请求进行自助记录。\n\n集成的已知错误数据库（`KEDB`）用于记录和搜索已诊断和或解决的事件和问题，可以帮助加速未来的事件解决。\n\
  \n需要易用的报告设施以便产生事件指标，诊断工具将帮助服务台台在首次接触时解决事件。报告功能应能够高效访问事件历史，并按类别、优先级、状态和受影响的 `CI`\
  \ 对事件进行汇总，为响应性和主动的问题管理活动提供数据和支持。\n\n请求履行\n\n\n\n\n请求履行的具体要求包括区分请求与事件的能力，以及将服务请求与启动它们的事件或事件进行关联的能力。如前所述，工具应包含自服务功能，允许用户通过基于\
  \ Web 的、由菜单驱动的选择过程来提交请求。\n\n否则，管理服务请求所需的设施与管理事件的设施相似。它们包括对请求模型进行预定义的工作流控制、设置并自动化优先级的能力、自动升级机制以及有效的报告功能。\n\
  \n# 问题管理\n拥有一台良好的问题管理工具至关重要。一个有效的问题管理工具可以进行根因分析和趋势识别。\n\n此外，还需要与变更管理集成，以确保在问题管理过程中识别出的解决方案得到有效实施。这有助于防止事件的再次发生。\n\
  \n`KDB`（已知错误数据库）是问题管理中至关重要的组成部分，它存储了已知错误及其临时解决方案，以缩短未来事件的解决时间。\n\n## 访问管理\n访问管理的最终要求涉及确保正确的人在正确的时间访问正确的资源。这对于安全和合规至关重要。\n\
  \n访问管理的过程包括访问的请求、修改和撤销。它通常与身份管理系统集成，以确保整个组织范围内的一致性。\n\n### 服务台功能\n服务台是用户寻求帮助的单一接触点。它负责记录事件、对其进行分类并提供状态更新。\n\
  \n有效的服务台提供高水平的客户服务，并确保事件得到快速高效的解决。它还作为识别服务管理改进领域的数据来源。\n\n\n\n\n# 服务运营中的风险评估与管理\n\
  \n服务运营的首要关注点是维护稳定性；任何对这种稳定性的威胁都必须进行紧急评估并采取行动。服务运营需要进行风险和影响评估的一个明显例子是潜在变更对稳定性构成的风险。服务运营人员必须评估变更可能产生的影响，并将此评估结果与变更顾问委员会（`CAB`）共享。\n\
  \n## 变更引起的风险\n\n尽管存在已知错误，变更仍可能被实施，这些错误在测试期间已经显现，但未被认为严重到足以延迟变更的程度。此类已知错误的存在对运营稳定性构成了风险；在错误解决之前，由其引发的事件可能会再次发生。必须评估这些事件的影响以及每个事件相应的适当变通方案（workaround）的有效性（包括其克服故障的速度）。这些评估结果将用于问题优先级的排序。拥有经过证明的变通方案可以在一定程度上降低风险，因为故障在服务运行时会发生并因此影响业务，但快速修复可以减少事件的影响。\n\
  \n每个事件，无论是通过事件和问题流程报告、还是通过供应商的警报，或是通过事件管理报告，都将对其影响和紧急性进行评估，以计算其优先级。这种评估也是对其对业务所构成风险的评估。最后，将交付到生产环境的新项目也需要进行评估，因为存在可能影响其他服务的风险。\n\
  \n## 其他风险来源\n\n还有其他需要风险评估的运营稳定性风险。首先是环境风险。环境风险包括作为 IT 服务连续性规划一部分进行评估的风险，例如火灾和洪水。可能还存在政治、商业风险以及与劳动关系相关的风险。这些示例包括：进行动物实验的药公司面临的风险（因此它们可能遭受反对此类做法的人的破坏），影响运营的罢工风险，甚至是竞争对手参与价格战的风险，这将导致收入下降。\n\
  \n供应商也可能构成风险源。他们的未能交付可能会影响整体服务的交付。他们提供服务的能力也受到其内部风险的影响。如果他们是某个服务要素的唯一供应商，这特别是一个问题。采用新供应商也涉及一些风险；在没有可靠交付的已知记录的情况下，存在其服务可能不令人意的风险。另一个主要的风险领域涉及安全；安全相关的事件或活动可能导致理论或实际的风险。最后，每一个新客户或要支持的服务既是成功的机会，也是失败的潜在风险。\n\
  \n# 设计与过渡中的运营人员\n\n所有的 IT 组在服务设计和服务过渡期间都将参与，以确保新组件或服务的的设计、测试和实施能够提供正确的功能、易用性、可用性和容量。此外，服务运营人员必须参与到服务设计和服务过渡的早期阶段，以确保新服务到达生产环境时，从服务运营的角度来看是符合目的的，并且在未来是“可支持的”。\n\
  \n在这种语境下，`supportable` 意味着它们不会对其他服务、流程、进度表或运营工作实践产生负面影响。它们还必须能够由现有人员在理解的成本下操作。支持结构（包括内部支持团队和第三方供应商提供的支持）必须是清晰且易理解的。服务上线后不应有意外成本，且合同义务必须清晰直了。\n\
  \n请注意，变更不仅仅关乎技术。还需要考虑组织层变更，以及员工或用户可能对变更产生敌意的可能性。可以通过沟通和培训计划来降低人们抵制变更的风险。关于组织变更的更多细节包含在《ITIL\
  \ 服务过渡》出版物。\n\n# 规划与实施服务管理技术\n\n本章的最后一个主题是服务管理工具。一个良好的服务管理工具对于实施基于 ITIL 框架的流程非常有帮助。许多组织实施新工具来协助其新流程或改进流程的实施。如果新工具要有用且合适，这些组织需要考虑若干因素。\n\
  \n## 许可\n\n要考虑的第一个因素是许可类型。通常有多种选择，成本各异。当工具按模块授权许可时，需要仔细的规划，以确保获得正确的访问权限，以便人们开展工作，而不会购买不必要的模块。以下是一些可能的选项：\n\
  \n**专用许可（Dedicated Licenses）**：对于此选项，每个具名人员都有自己的许可。专用许可适用于需要频繁且长时间使用特定模块的人员。例如，服务台人员需要专用许可来使用事件管理模块。\n\
  \n**共享许可（Shared Licenses）**：这些许可可以在个人之间共享；然而，可能某些员工成员因为许可已被占用而无法访问工具。共享许可适用于不需要持续访问的定期用户，例如二线支持人员。需要进行仔细计算以确定用户与许可的正确比例。这些许可比专用许可贵，但需要的数量较少。\n\
  \n**Web 许可（Web Licenses）**：允许通过网络浏览器访问。Web 许可通常适用于需要远程访问或仅偶尔访问的人员。它们的成本通常比其他许可低得多（甚至可能随其他许可免费提供）。通过购买少量此类许可，就可以为大量偶尔用户提供足够的访问权限，因为并发用户数以及所需的许可数将很低。通过这种方式可以进一步降低总成本。\n\
  \n**按需（On Demand）**：在需要时提供工具的访问（按需），供应商根据使用应用程序的时间收取费用。这对于规模较小的组织或如果工具非常专业且使用频率较低的情况来说可能具有吸引力。此的变体是作为咨询任务的一部分使用专业工具（例如，专门的容量管理工具）；在这种情况下，许可费可能包含在咨询费中。\n\
  \n**代理/活动（Agent/Activity）**：许可选项的进一步变体是按代理/活动进行许可和收费的软件。此类示例是模拟软件（例如，可以模拟客户在网站上的路径的代理软件，以评估并报告性能和可用性）。\n\
  \n在所有情况下，都务必进行充分调查，以确保成本得到理解并同意，并确保组织在拥有足够许可方面保持合法。\n\n### 部署\n\n\n\n\n\n许多 ITSM\
  \ 工具（特别是发现和事件监控工具）在使用之前，可能需要在所有目标位置部署某些客户端/代理软件。这需要仔细的规划和执行，并并通过正式的发布和部署管理来处理。这里列了一些部署考虑因素：\n\
  \n* 应该进行仔细的调度和测试，并对部署进行跟踪，以便明确哪些 CI（配置项）已安装了软件，哪些尚未接收。\n* 随着部署的进行，应该更新 `CMS`。\n\
  * 为了识别客户端软件，通常需要重启设备，这需要提前安排以尽可能地减少服务中断。\n* 对于便携式设备可能需要特殊安排，因为它们在部署期间可能不在现场。\n*\
  \ 必须提前检查接收软件的设备，确保它们有足够的存储和处理能力来托管和运行新软件。\n* 需要检查网络容量，以确保能够传输所有所需的内容。\n* 部署工具的最佳时机取决于成熟度。过早部署工具会将改进倡议的重点从改变流程和工作方式的需求转移开，整个改进活动将仅仅变成工具实施。\n\
  \ 如果 如果要实现收益，部署前必须对该工具进行培训。\n\n记住，通常一个工具不足以让事情运作得更好。然而，如果它支持流程且用户已经接受过使用培训，一个好的工具可以帮助员工执行新流程。\n\
  \n以下是部署过程中必须考虑的进一步方面：\n\n### 采用的引入类型\n必须决定是采用“大刀主义”引入还是某种分阶段的方法。由于大多数组织在引入期间需要保持现有服务的运行，因此分阶段的方法可能更有必要。\n\
  \n### 工具之间的过渡\n如果正在更换旧工具，必须考虑旧工具和新工具之间过渡的最佳方式。例如，服务台台不应在新工具上将事件分配给一个尚未从旧工具过渡的团队。\n\
  \n### 数据迁移\n需要对哪些数据需要从旧工具迁移到新工具做出决定。这可能需要重新格式化，因此在迁移后可能需要进行验证，特别是当数据通过电子传输时。相反，可以实施并行运行期，在初始阶段让旧工具以只读模式与新工具一同运行，以便在需要时引用历史数据。\n\
  \n关于发布和部署管理流程的完整细节可以在《ITIL 服务过渡》出版物找到。\n\n## 服务运营挑战\n\n本章详细阐述了服务运营管理面临的以下主要挑战：\n\
  \n* 与开发和项目人员缺乏参与\n* 在服务运营中证明资金的合理性\n* 设计活动与运营活动之间的差异\n* 疗无效的服务过渡\n* 疗无效的服务指标\n*\
  \ 虚拟团队的使用\n* 内部与外部关系的平衡\n\n### 与开发和项目人员的参与\n服务运营的第一个挑战是确保服务运营人员与开发及项目团队之间有正确的协作和参与。\n\
  \n开发和项目团队的重点与服务运营人员非常不同。参与项目和开发的人员将专注于新应用程序或功能的开发，并将其交付到运营环境中。他们的工作有一个定义的终点，即应用程序或功能交付时。参与服务运营的人员则关注已交付交付的长期运行。\n\
  \n项目人员认为准时、按预算交付服务至关重要，而运营人员对满足特定日期的关注不如关注服务运行得如何以及支持它将涉及什么。\n\n开发和项目人员可能对服务管理了解甚少，认为它只与运营有关。ITIL\
  \ 框架明确了服务管理流程从服务的开始（作为服务策略的一部分）一直贯到设计和过渡。服务运营应贯穿新服务或变更服务的开发，以确保交付物在最后是可支持的。\n\n\
  这两个 IT 领域通常分得很开，它们之间甚至可能敌意。开发人员可能认为运营人员为他们的项目引入了不必要的延迟，而运营人员可能觉得项目被“丢”给了他们，而对于如何在现场环境中运行，却得到很少的认可或考虑。\n\
  \n确保克服这种分歧是具有挑战性的，但这意味着运营方面在开发活动中得到了尽早考虑，这样它们就可以相当容易地整合到设计中。未能实现这一点将对新服务的成功过渡和运行构成风险。\n\
  \n### 证明资金的合理性\n服务运营经理面临着为其领域证明资金合理性的挑战。他们的资金请求可能会遇到阻力，因为在该领域花费的资金通常被视为基础设施成本，投资没有产生明确的收益。\n\
  \n服务运营经理应该能够展示对运营领域的投资如何为组织节省资金，并提高所交付服务的质量。以下是一些示例：\n\n* 通过更好地管理许可降低软件许可成本\n* 由于有效的问题管理，事件和问题更少且解决速度更快，从而降低了支持成本\n\
  * 改进流程，从而更好地利用现有资源并消除重复活动，* 通过持续提供更高水平的服务，获得更好的客户留存率\n* 得益于更好的容量管理，提高了现有基础设施设备的利用率并推迟了进一步支出\n\
  \n### 服务设计与服务运营重点及优先事项的差异\n设计活动与运营活动之间的差异将继续带来挑战：\n\n* 服务设计倾向于一次关注一种服务，而服务运营倾向于同时交付和支持所有服务。运营经理需要与服务设计和服务过渡紧密合作，以提供运营视角。\n\
  * 服务设计通常在项目中进行，而服务运营专注于持续持续的、可重复的管理流程和活动。这可能意味着运营人员无法参与服务设计项目活动，尽管正如我们刚刚提到的，如果新服务要考虑到运营问题，他们与开发和项目人员的参与和互动是关重要的。\n\
  * 一旦项目人员完成了一个 IT 服务的设计，他们就可以转向下一个项目，而无法无法提供支持。克服这一挑战意味着确保服务运营人员积极参与设计项目，并参与引入到运营环境中服务的早期支持。\n\
  \n\n\n\n设计与运营的衡量标准不同。服务设计的衡量标准是项目是否按时且按预算完成，而服务运营则必须通过参与设计阶段，确保服务能够按照预期运行。如果服务运营中的支持和其他成本高于预期，运营人员会归咎于设计部门，而服务设计人员则会归咎于运营部门。解决这一挑战需要服务运营积极参与生命周期中的服务过渡阶段。服务过渡的目标是确保所设计的服务能够按预期运行。当服务运营经理参与时，可以考虑运营因素，使过渡阶段能够在问题在运营环境中变成问题之前对其进行理解和修复。\n\
  \n## 其他挑战\n\n以下是其他挑战的列表：\n\n*   服务过渡流程不健全是另一个挑战。需要确保服务运营人员参与验证和测试，以便授权变更的决策是基于事实依据。良好的变更管理流程将确保不符合预期的变更被拒绝。\n\
  *   选择有意义的指标可能是挑战性的。容易测量的东西实际上可能不是所提供服务水平的有效指示。例如，衡量服务台接听电话的时间很容易，但并不能显示用户随后是否得到了良好的服务。（服务设计阶段负责确保在服务设计中包含适当指标）。每项服务都会产生自己的测量结果；解释这些结果以理解所提供的服务水平可能并不简单，因为这些测量结果可能与其他使用的指标不相同。服务水平管理可以帮助克服这一点，但这需要运营人员的参与。\n\
  \n## 人员管理\n\n人员管理也将带来许多挑战，其中一些在此处进行了描述：\n\n*   虚拟团队的使用也会带来挑战。层级管理结构不再适用于日益复杂的组织，因此发展出了矩阵式管理作为应对，员工根据不同的任务向不同的来源汇报。这使得分配责任变得困难。知识管理和\
  \ `RACI`（负责、问责、咨询、知会）矩阵的使用将对这种情况有所帮助。\n*   服务运营经理面临的最重大挑战之一是平衡许多内部和外部关系。当今大多数 IT\
  \ 组织都是复杂的，价值网络、合作伙伴和共享服务模型的使用日益增加。这增加了服务管理的复杂性，因此建议在关系管理知识和技能上投入，以帮助应对这一挑战。\n\n\
  ## 关键成功因素\n\n现在让我们考虑成功服务运营的一些关键成功因素：\n\n*   可见的持续管理支持（包括对流程的遵守、对工具的适当持续资金支持以及支持运营活动的人员）对于成功至关重要。\n\
  *   业务部门的支持也很重要，以协助制定事件管理的优先级排序表，确保用户联系服务台而不是直接接触支持团队，并提供资金资助运营活动。\n*   存在通过自己的榜样和热情领导他人的倡者（Champions）是另一个重要因素。这些可能是高级经理，但倡者可以出现在组织中的任何级别。\n\
  *   确保有充足的人员资源，以便花时间实施新的流程和工具，同时确保日常工作不受影响。\n*   具备正确知识和技能的人员非常重要。员工需要对技术和服务管理各个方面接受培训并提高意识，可能还需要其他领域的培训，例如“软技能”、业务意识和工具管理。\n\
  *   员工留存至关重要。在投入培训资金后，留住接受过培训的人员符合组织的利益，因此应尝试为这些员工开发职业通道。\n\n我们考虑的最后关键成功因素是与使用的工具集有关：\n\
  \n*   使用专为支持 ITIL 所述流程设计的工具将使这些流程的实施和管理容易得多。能够关联事件和问题，并获取有关配置项和变更的信息将支持这些流程，能够轻松针对\
  \ `KPIs` 进行报告也是如此。\n*   如果需要采购新工具，则需要根据一组定义的标准进行评估，以确保其符合需求。工具还需要进行配置和测试。\n*   工具的最后一个关键成功因素是产生报告以显示流程有效性的能力。\n\
  \n## 服务运营风险\n\n在本章的最后一部分，我们将介绍服务运营面临的风险。这些包括关键成功因素的缺失——例如，可见的管理支持是一个关键成功因素（CSF），而缺乏这种支持就是一种风险。\n\
  \n最终风险是关键 IT 服务的丢失以及随之带来的业务损害。除了财务损失外，可能存在极端情况，即受影响的 IT 服务用于关键健康或安全目的，而糟糕的服务运营导致健康和安全风险。\n\
  \n其他风险如下：\n\n*   **资金和资源不足**：需要建立清晰的业务理由以获得充足资金；资金不足将不可避免地对可交付的服务水平产生影响。一旦分配，此类资金必须留作预期用途，不能用于其他项目。\n\
  *   **动力流失**：在服务运营中实施最佳实践服务管理需要成为一项长期的“日常”活动，而不是短期的“一时风气”。如果没有这个明确的信息，员工可能会随着时间的推移失去热情并回到以前的习惯，认为向最佳实践的转变完全是暂时的。另一个风险是组织变更可能导致新的最佳实践方法被丢弃；同样，这是将变化视为暂时的、会被下一个倡议取代而非植根的后果。\n\
  *   **关键人员流失**：对于成熟度不高的组织，这可能是一个重大风险，因为一两个关键员工的丢失可能会产生严重影响。可以通过确保员工接受交叉培训来缓解，从而减少对个人的依赖。更成熟的组织应该将知识正式化地转移到流程、文档和工具中；这消除了对少数知识渊者的依赖。\n\
  *   **对变革的抵触或对变化的怀疑**：这一因素可以通过教育培训以及更好地沟通变化的益处来获得帮助。对变革的抵触实际上是对变化的的恐惧；向员工提供有关变化如何影响甚至可能在工作满意度和学习新技能方面使他们受益的信息，可能消除这些恐惧，从而减少抵触。\n\
  *   **缺乏管理支持**：中层经理可能看不到整体愿景，或者无法理解基层员工将获得的实际益处。如前所述，管理支持是实施最佳实践的关键成功因素。高层管理必须确保中层经理理解变革的益处和必要性，并对实现这些益处的变革提供可见的支持。让这些经理参与服务设计和过渡的适当阶段和流程，可能帮助他们理解这些益处。\n\
  \n\n\n\n## 设计不佳\n每个生命周期阶段的成功，至少在部分取决于该阶段输入的质量。设计阶段产生的低质量设计输出将同时影响过渡和运营。实施过程永远无法真正取得成功，最终将需要重新设计。\n\
  \n## 不信任\nIT 部门和业务部门都可能对服务管理持怀疑态度。IT 人员不喜欢新控制施加在其工作方法上的限制，而业务部门可能产生愤世嫉俗的观点，认为 IT\
  \ 在不提供任何改进的情况下索要更多资金。克服这种不信任和愤世嫉俗意味着要确保向利益相关者清晰地阐述收益，并实际交付。\n\n## 不同的客户期望\n不同的客户和用户群体可能有不同的期望。一组人可能为更优质的服务支付更多，但这种高水平会引起其他组的怨满。清晰的服务水平管理，以及在需要时引入业务关系管理，将有助于解决这些问题。解决方案并不是在没有需求或资金支持的情况下，简单地根据要求提供改进的服务水平。\n\
  \n## 总结\n这标志着我们本章的结束。我们回顾了与集成服务管理工具等工具相关的服务运营需求。\n\n我们探讨了以下主题：\n\n* 能够支持服务运营、辅助流程和服务服务台功能的工具类型\n\
  * 服务管理工具的通用需求\n\n我们研究了运营人员在服务设计和服务过渡中的参与，以及在公司内部规划和实施服务管理技术时需要考虑的方面。\n\n## 考试要点\n\
  \n**理解工具在支持服务运营中的作用。** 这包括理解如何选择符合组织需求的工具。\n\n**解释服务运营对工具集的通用需求以及为什么这些需求很重要。** 理解适用于服务运营的通用需求，以及这些工具如何支持生命周期的目标。\n\
  \n**理解各个服务运营流程的具体需求。** 能够识别服务运营中各个流程的需求，以确保工具集实现最大效率。\n\n**解释名为 MoSCoW 的选择技术。**\
  \ 了解该缩写代表的含义（Must/Should/Could/Would），并能够解释每个概念在工具选择中的用途。\n\n**解释项目管理流程如何帮助服务运营变更的实施。**\
  \ 理解使用项目管理流程实施服务运营变更的益处，以及可能受到阻力的原因。\n\n**了解变更对运营稳定性带来的风险。** 理解如何管理这些风险。\n\n**理解为什么服务运营人员需要参与设计和过渡阶段。**\
  \ 特别是，要理解“服务可支持”这一概念的含义，以及实现这一目标需要什么。\n\n**理解实施新服务管理工具时可用的许可选项。** 能够描述不同的选项并给出每个选项适用场景的示例。\n\
  \n**理解实施新服务管理工具时可用的部署选项。** 能够描述不同的选项并给出每个选项适用场景的示例。\n\n## 复习题\n你可以在附录中找到习题的答案。\n\
