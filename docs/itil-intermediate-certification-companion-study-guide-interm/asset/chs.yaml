  \ Material is reproduced under license from AXELOS.\n\n## 测试类型\n\n有许多测试方法和技术可以组合用于验证活动和测试。示例包括模拟或建模服务使用的场景、将测试限制在风险最高的领域、对相关标准的合规性进行测试、取专家关于测试内容的建议，以及使用瀑布模型或敏捷技术。其他示例涉及进行演练或工作坊、预演或现场试点。\n\
  \n\n\n\n功能测试和服务测试用于验证该服务是否满足用户和客户的需求，以及服务提供者对于管理、运营和支持服务的要求。功能测试将取决于服务的类型和交付渠道。服务测试将包含许多非功能测试，包括对可用性和可访问性的测试、对流程的测试以及知识和能力的测试。还包括对服务保证方面的方面的测试，包括容量、可用性、韧性、备份与恢复以及安全性和连续性。\n\
  \n### 过程活动、方法和技术\n\n服务验证和测试分为七个阶段，如图 13.2 所示。基本活动如下：\n\n* 验证和测试管理\n* 计划和设计测试\n*\
  \ 验证测试计划和测试设计\n* 准备测试环境\n* 执行测试\n* 评估退出标准并报告\n* 测试清理和关闭\n\n![图像显示验证和测试管理接收授权的变更并交付变更评估。这些进一步通过双向箭头连接到修订测试中的不同过程，以交付所需的结果。](img/00061.jpeg)\n\
  \n图 13.2 验证和测试过程示例\n\nCopyright © AXELOS Limited 2010. 版权所有。\n\n测试活动并非按顺序进行的；多个活动可以并行进行；例如，测试执行在所有测试设计完成之前就开始了。图\
  \ 13.2 展示了验证和测试过程的一个示例；下列表对其进行了详细描述：\n\n* 第一个活动是验证和测试管理，包括在服务转换的整个测试阶段对活动进行计划、控制和报告。还包括管理问题、缓解风险以及实施从测试活动中识别变更，因为这些可能会导致延迟。\n\
  * 下一步是计划和设计测试，它在服务生命周期的早期开始，涵盖了运行测试的许多实际方面，例如所需的资源；任何支持性服务（包括访问、安全、餐饮和通信服务）；对里程碑、交接和日期的约定；对考虑报告和其他交付物时间的约定；交付和验收的时间点和时间的指定；以及任何财务要求。\n\
  * 第三步是验证测试计划和测试设计，确保测试模型中包含的测试对于服务是充分且适当的，并涵盖了关键的集成点和接口。还应该检查测试脚本的准确性和完整性。\n* 下一步使用构建和测试环境人员的服务来准备测试环境；尽可能使用发布和部署管理过程来准备测试环境。这一步还包括捕获初始测试环境的配置基线。\n\
  * 接下来是执行测试步骤。在此阶段，测试人员使用手动或自动技术执行测试，并在记录测试期间的发现。在测试失败的情况下，必须充分记录失败原因，并在可能的情况下继续测试。如果部分测试失败，则应解决或记录该事件（例如作为已知错误），并由同一测试人员进行适当的重测。\n\
  * 下一步是评估退出标准和报告，该报告根据测试指标产生。在此阶段，将实际结果与预期结果进行比较。服务可能被视为通过或失败，也可能是服务可以运行，但风险或成本比计划高。将对是否满足退出标准做出决定。该步骤的最终操作是将配置基线捕获到\
  \ CMS 中。\n* 最后一步是测试清理和关闭。在这一步中，测试环境被初始化。对测试过程进行审查，并将任何可能的改进传递给 CSI。\n\n接下来我们将查看服务验证和测试的触发器、输入、输出和过程接口。\n\
  \n### 触发器\n\n该过程只有一个触发器，即计划活动。该计划活动可能位于发布计划、测试计划或质量保证计划中。\n\n### 输入\n\n该过程的关键输入是服务设计包。它定义了约定的服务需求，以服务模型和服务运营计划的形式表现出来。正如我们之前讨论过的，`SDP`\
  \ 包含服务章程，包括保证和实用需求、不同服务提供者之间接口的定义、验收标准和其他信息。运营和财务模型、容量计划和预期测试结果是进一步的输入。\n\n另一个主要输入由\
  \ `RFCs` 组成，请求对服务运行或将运行的环境所需的变更。\n\n### 输出\n\n服务验证和测试的直接输出是交付给变更评估的报告。它列出了测试环境的配置基线，识别了进行了哪些测试，并展示了结果。它还包括对结果的分析（例如实际结果与预期结果的比较）以及测试期间识别出的任何风险。\n\
  \n其他输出是从测试获得的更新数据、信息和知识，以及测试事件、问题和已知错误。\n\n### 接口\n\n服务验证和测试支持服务中所有的发布和部署管理步骤。记住，虽然发布和部署管理负责确保进行适当的测试，但实际测试是作为服务验证和测试的一部分进行的。服务验证和测试的输出是变更评估的关键输入。测试策略确保过程与服务生命周期的其他部分良好协作——例如，与服务设计确保设计是可测试的，以及与\
  \ `CSI` 管理测试中识别的改进。服务运营将使用维护测试来确保服务的持续有效性，而服务策略为测试提供资金和资源。\n\n### 服务验证和测试过程角色\n\n\
  在第 1 章“运营支持与分析简介”中，我们探讨了适用于整个服务生命周期所有过程的通用角色。这些角色与服务验证和测试过程相关，但也有特定的额外要求。记住，这些不是“职位名称”，而是对于成功运行该过程可能需要的角色的指导。\n\
  \n#### 服务验证和测试过程所有者\n\n第 1 章描述的通用过程所有者职责适用于此角色，此外，还适用这些特定要求：\n\n* 定义组织的整体测试策略\n\
  * 确保与变更管理、变更评估、发布和部署之间有集成方法\n\n#### 服务验证和测试过程经理\n\n重要的是确保该角色分配给与负责发布和部署管理的人不同的人，以避免利益冲突。\n\
  \n第 1 章描述的通用过程经理职责适用于此角色，此外，还适用这些特定要求：\n\n\n\n\n\n*   协助设计和规划测试条件、测试脚本和测试数据集，以确保适当且充分的覆盖范围和控制\n\
  *   分配并监督测试资源，确保遵循测试策略\n*   验证其他团队执行的测试（例如发布和部署）\n*   管理测试环境需求\n*   规划和管理对适当工具和流程的支持\n\
  *   提供关于测试结果、问题、风险和进展的管理报告\n\n## 服务验证与测试执业人员\n\n该角色通常包括：\n\n*   根据服务设计包中记录的计划和设计，执行定义的定义的测试\n\
  *   根据约定的标准，记录、分析、诊断、报告和管理测试事件、事故、问题和重测\n*   管理测试资产和组件\n\n## 对服务验证与测试贡献的其他角色\n\n\
  多个角色对服务验证与测试过程做出了贡献：\n\n*   变更管理——确保测试对于授权的变更是适当的\n*   开发人员/供应商——测试人员与开发/构建/供应商人员之间的协作\n\
  *   服务设计人员——设计测试是整体设计的一个元素\n*   客户和用户——性能验收测试\n\n## 信息管理\n\n如前所述，IT 服务管理的性质具有重复性，并从过渡期间数据、脚本和模型的重用中受益。服务管理建议维护一个测试库。这将包括自动化测试工具（计算机辅助软件测试）的使用，这些工具正日益成为服务验证与测试过程的一部分。\n\
  \n### 测试数据\n\n数据是所有测试的需求，其相关性将决定测试的成功与。在应用于软件时，这是显然必要的，但也适用于其他测试环境。\n\n### 测试环境\n\
  \n测试环境应得到维护和保护。应审查所有更改，以查看其是否对测试环境产生影响。需要考虑以下所有方面：\n\n*   测试数据的更新\n*   是否需要一组新的独立数据（现有服务将需要现有数据集）\n\
  *   测试数据或环境的冗余\n*   测试级别\n\n测试数据的维护应作为日常运营活动的一部分进行。它应该考虑：\n\n*   与现网数据分离\n*   数据保护法规\n\
  *   测试数据的备份\n*   随之产生的测试数据库，可以用作安全的训练环境\n\n## 关键成功因素和关键绩效指标\n\n与所有过程一样，服务验证与测试的性能应该被监控和报告，并应采取行动识别并实施过程的改进。每个关键成功因素（`CSF`）都应该有少量的关键绩效指标（`KPIs`）来衡量其成功情况，每个组织可以选择自己的\
  \ `KPIs`。\n\n以下是服务验证与测试的两个 CSF 示例以及每个相关的 KPI。\n\n`CSF` “在测试成本和测试有效性之间取得平衡”的成功可以使用衡量以下内容的\
  \ `KPIs` 来衡量：\n\n*   预算偏差的减少和修复错误成本的降低\n*   由于测试延迟的减少以及对支持测试所需的客户估计更准确，对业务的影响减轻\n\
  \n`CSF` “提供证据证明服务资产和配置已正确构建和实施，同时服务交付了客户所需”的成功可以使用衡量以下内容的 `KPIs` 来衡量：\n\n*   新服务和变更服务已测试的服务验收标准百分比的提高\n\
  *   在任何实用性或保证测试之外，单独进行构建和实施测试的服务百分比的提高\n\n### 挑战\n\n有效测试最频繁的挑战是其他人员对测试角色的尊重和理解。传统上，测试缺乏资金，导致无法维护适当的测试环境和与现网匹配的测试数据，且没有足够的人员、技能和测试工具来提供足够的测试覆盖。由于项目其他部分的超支，测试往往被压缩，以确保能满足上线日期。这影响了可以进行的测试水平和质量。供应商交付设备的延迟会减少可用的测试时间。\n\
  \n所有这些因素都可能导致测试不足，这再次导致了普遍认为测试几乎没有真实价值的感觉。\n\n### 风险\n\n该过程成功的最常见风险如下：\n\n*   对预期或目标缺乏清晰\n\
  *   对风险缺乏理解，导致测试没有针对关键要素\n*   资源短缺（例如用户、支持人员），这引入了延迟并对其他服务过渡产生影响\n\n## 变更评估\n\n\
  在过渡关闭之前，需要对其进行审查，以确保其实现了目的，且没有未识别的负面副作用。成功完成变更评估确保了服务可以正式关闭并移交给服务运营职能和 `CSI`。\n\n\
  准备一份评估报告，列出偏离服务章程/SDP` 的偏差，并包括风险概况和变更管理建议。\n\n### 目的\n\n变更评估过程的目的是理解服务变更的可能性能以及它可能如何对业务、IT\
  \ 基础设施和其他 IT 服务产生影响。该过程通过对比变更的实际性能与其预测性能，提供了一种评估这种影响的一致且标准的手段。识别并管理与变更相关的风险和问题。\n\
  \n### 目标\n\n变更评估的目标包括正确设定利益相关者的预期，并向变更管理提供准确信息，以防止产生负面影响和引入风险的变更在未经检查的情况下被过渡。另一个目标是评估服务变更的预期影响以及在可能情况下的非预期影响，并提供高质量的输出，以便变更管理快速决定是否授权某项服务变更。\n\
  \n### 范围\n\n有效的变更管理意味着每个变更都必须在其生命周期的各个位点获得适当变更机构的授权。典型的授权点包括在构建和测试开始之前、在提交到 `DML`（如果与软件相关）之前以及在部署到现网环境之前。是否授权下一步的决策是基于对该过程产生的变更进行评估做出的。评估报告为变更机构提供建议和指导。该过程描述了适用于重大变更的正式评估；每个组织将决定哪些变更需要正式评估，哪些变更将作为变更管理的一部分进行评估。\n\
  \n### 对业务的价值\n\n变更评估关注的是价值。有效的变更评估将判断用于交付由变更产生的益处的资源是否代表了良好的价值。这些信息将鼓励在未来的服务开发和变更管理中关注价值。`CSI`\
  \ 可以从变更评估关于变更过程本身可能的改进领域以及服务变更性能的预测和测量中获得巨大收益。\n\n### 政策、原则和基本概念\n\n\n\n\n\n以下内容回顾了适用于变更评估过程的一些关键策略。第一，服务设计或服务变更在过渡之前将进行评估。其次，尽管每项变更都必须经过评估，但正式的变更评估过程仅适用于重大变更；这反过来要求定义标准来识别哪些变更是“重大的”。\n\
  \n变更评估将识别与新服务或已更改的服务以及任何其他服务或共享基础设施相关的风险和问题。预测性能与实际性能之间的偏差将由客户通过处理：接受带有偏差的变更、拒绝变更，或引入新的变更来纠正偏差。这三种是变更评估允许的唯一结果。\n\
  \n变更评估背后的原则包括：尽可能识别并理解变更带来的非预期影响和预期影响的后果。其他原则包括：确保每项服务变更都得到公平、一致、透明且在尽可能客观的评估，并确保向变更管理提供评估报告，以促进每个授权点的决策制定。\n\
  \n变更评估过程使用计划-执行-检查-行动（PDCA）模型来确保所有评估的一致性。通过这种方法，每项评估都先进行计划，然后分阶段执行，检查评估结果，并采取行动解决发现的任何问题。\n\
  \n### 变更评估术语\n\n表 13.2 显示了变更评估过程使用的关键术语。\n\n| 术语 | 含义 |\n| --- | --- |\n| 实际性能 |\
  \ 服务变更后实现的性能。 |\n| 对策 | 为降低风险而实施的缓解措施。 |\n| 偏差报告 | 预测性能与实际性能之间差异的报告。 |\n| 评估报告 |\
  \ 由变更评估过程生成的报告，包含风险状况、偏差报告、建议和资质声明。 |\n| 性能 | 服务的功能和保证。 |\n| 性能模型 | 用于帮助预测性能的服务表示。\
  \ |\n| 预测性能 | 服务变更后服务的预期性能。 |\n| 剩余风险 | 部署对策后剩余的风险。 |\n| 服务能力 | 服务按要求执行的能力。 |\n\
  | 服务变更 | 对现有服务的更改或新服务的引入。 |\n| 测试计划和结果 | 测试计划是对拟议服务变更影响评估的响应。通常计划将指定如何对变更进行测试；测试将产生哪些记录以及存储何处；由谁授权变更；以及如何确保变更及其受影响的服务随时间推保持稳定。如果变更影响受监管的环境，测试计划可能包含资质计划和验证计划。结果代表实施变更后的实际性能。\
  \ |\n\nCopyright © AXELOS Limited 2010\\. 保留所有权利。材料根据 AXELOS 的许可复制。\n\nTABLE 13.2\
  \ 适用于变更评估过程的关键术语\n\n### 变更评估过程\n\n图 13.3 显示了变更评估过程及其关键输入和输出。你可以看到触发评估活动的输入，以及作为过程输出的期中和最终评估报告。当性能不符合要求时，由变更管理负责决定下一步做什么。\n\
  \n![流程图显示评估请求和输入（RFC、SDP、测试计划和结果）共同触发计划评估、评估预测性能、预测性能与实际性能是否一致？变更是否完成？以及结束。](img/00062.jpeg)\n\
  \nFIGURE 13.3 变更评估流程图\n\nCopyright © AXELOS Limited 2010\\. 保留所有权利。材料根据 AXELOS 的许可复制。\n\
  \n### 评估计划\n\n对变更的评估应确保理解变更带来的非预期影响以及预期影响。非预期影响在对其他服务、客户和用户的影响方面通常是负面的。变更的预期影响应符合验收标准。非预期影响通常在试点阶段甚至在在使用时才被发现；它们很难预测或衡量。\n\
  \n在表 13.3 中是考虑服务变更影响时应包含的因素。\n\n| 因素 | 服务设计的评估 |\n| --- | --- |\n| S—服务提供者能力 | 服务提供者或服务单元按要求执行的能力。\
  \ |\n| T—容忍度 | 服务吸收变更或释放的能力或容量。 |\n| O—组织设置 | 组织接受拟议变更的能力。例如，实施团队是否拥有适当的访问权限？所有受变更影响的现有服务是否已更新以确保平稳过渡？\
  \ |\n| R—资源 | 具备技能和知识的人员，以及过渡后运行服务所需的充足资金、基础设施、应用程序和其他资源的可用性。 |\n| M—建模与测量 | 从模型生成的行为预测与新服务或已更改服务的实际行为的匹配程度。\
  \ |\n| P—人员 | 系统内部的人员以及变更对他们的影响。 |\n| U—使用 | 服务是否适用？是否能够交付保证？它是否持续可用？容量是否足够？它是否足够安全？\
  \ |\n| P—目的 | 新服务或已更改的服务是否符合目的？是否支持所需的性能？约束条件是否按计划消除？ |\n\nTABLE 13.3 评估服务变更影响时考虑的因素\n\
  \n### 风险管理\n\n\n\n\n每个组织将有其自己的风险管理方法，这种方法应在变更评估过程中用于评估新服务或变更后的服务。风险水平应与预期收益和业务对风险的承受能力相匹配。通过对实际情况与预测情况进行比较，将评估对业务带来的风险。\n\
  \n此输出被称为偏差报告，将用于支持有关实施新服务或变更服务的决策。\n\n相关的测试计划和测试结果将与偏差报告结合使用，并在评估报告中呈现整体评估结果。\n\n\
  ## 评估报告\n\n评估报告包含以下部分：\n\n* 风险概况：解释了实施变更并采取应对措施后遗留的风险。\n* 偏差报告：描述了实施变更后预测性能与实际性能之间的差异。\n\
  * 确认与验证声明（如适用）：说明了 IT 基础设施是否恰当且配置正确，以支持特定的应用程序或 IT 服务。\n* 建议：即根据评估报告中的其他因素，向变更管理部门提出的接受或拒绝变更的建议。\n\
  \n现在让我们来看变更评估的触发器、输入、输出和流程接口。\n\n### 触发器\n\n让我们来看此过程的触发器。变更评估的触发器是接收来自变更管理部门的评估请求。\n\
  \n### 输入\n\n变更评估的输入包括服务设计包（包含服务章程和服务验收标准）、变更建议书、一个 `RFC`、变更记录以及详细的变更文档。其他可能的输入包括与利益相关者的讨论以及测试结果和报告。\n\
  \n### 输出\n\n变更评估的输出是提供给变更管理的中间和最终评估报告。\n\n### 接口\n\n变更评估与其他许多过程进行交互。主要接口如下：\n\n\
  **过渡规划与支持**：变更评估与过渡规划与支持协作，确保在需要时有适当资源，并确保每个服务过渡都得到良好管理。\n\n**变更管理**：与变更管理之间存在关键接口。变更评估和变更管理过程必须紧密集成，并对哪些类型的变更需要正式评估达成明确共识。在规划变更时必须包含此类评估所需的时间。此外，是变更管理触发了变更评估，而变更管理依赖于及时接收评估报告，以便\
  \ `CAB`（或其他变更机构）使用其来协助决策。\n\n**服务设计协调**：此过程以服务设计包的形式提供变更评估所需的服务信息。\n\n**服务水平管理或业务关系管理**：变更评估可能需要与这些过程协作，以理解任何出现问题的影响，并就使用客户资源进行评估达成一致。\n\
  \n**服务验证与测试**：此过程为变更评估提供信息；两个过程必须协调活动，以确保在足够的时间获得所需的输入。\n\n## 信息管理\n\n来自测试的信息应从服务知识管理系统中获取。中间和最终评估报告应存入配置管理系统。\n\
  \n### 变更评估过程角色\n\n本节探讨了与变更评估过程相关的角色。\n\n#### 变更评估过程所有者\n\n过程所有者角色将履行第一章描述的通用过程所有者角色。此外，所有者还将：\n\
  \n* 与其他过程所有者合作，确保跨设计、变更管理、变更评估、发布与部署以及服务验证与测试的集成方法\n\n#### 变更评估过程经理\n\n除了通用过程经理职责外，过程经理的职责还包括：\n\
  \n* 规划和协调资源以评估变更\n* 确保及时生成评估报告和中间评估报告，以便做出决策\n\n#### 变更评估过程执行者\n\n执行者角色职责包括：\n\n\
  * 使用服务设计包和发布包制定评估计划\n* 建立与过渡所有方面相关的风险和问题\n* 创建评估报告\n\n## 关键成功因素与关键绩效指标\n\n与其他过程一样，变更评估的性能应该被监控和报告，并应采取措施进行改进。以下是变更评估的两个关键成功因素（CSF）及其相关的关键绩效指标（KPI）。\n\
  \n* 关键成功因素：“利益相关者对新和变更服务的预期性能有良好的理解。”\n    * KPI：当新或变更服务未能提供所需的实用性或保证时，报告的事件数量减少。\n\
  \    * KPI：客户对新或变更服务的满意度提高。\n* 关键成功因素：“变更管理拥有高质量的评估，帮助他们做出正确决策。”\n    * KPI：在约定时间内交付的评估比例增加。\n\
  \    * KPI：失败或需要回滚的变更数量减少。\n    * KPI：调查时变更管理人员的满意度增加。\n\n### 挑战\n\n变更评估面临的挑战包括跨项目和供应商开发标准的性能衡量和测量方法；理解支持变更评估活动有效风险管理的不同利益相关者观点；以及理解（并能够评估）管理风险与承担风险之间的平衡，因为这影响了组织的整体策略和服务交付。进一步的挑战是衡量并证明过渡期间及之后预测的偏差更小。\n\
  \n变更评估剩余的挑战包括：在风险评估期间采取务实且审慎的风险方法，并有效沟通组织对风险的态度和风险管理方法。最后，变更评估需要应对挑战：对影响或可能影响服务和发布成功过渡的风险建立深入理解，并鼓励共享信息的风险管理文化。\n\
  \n### 风险\n\n此过程成功的最常见风险包括缺乏何时使用变更评估的明确标准，以及对所需时间的非实际预期。另一个风险是执行变更评估的人员经验不足或缺乏影响变更机构的组织权威。最后，未能按承诺日期交付的项目和供应商会导致变更评估活动安排的延迟。\n\
  \n## 总结\n\n本章探讨了服务过渡阶段的两个过程：服务验证与测试以及变更评估。你学习了服务验证与测试如何确保发布符合用途且适用。我们探讨了与该过程相关的活动以及信息管理的要求。\n\
  \n我们考虑了变更评估过程以及以中间或最终报告形式呈现的各种输出。\n\n\n\n\n最后，我们检查了这些过程是如何相互支持的，以及这些过程对业务和 IT 服务提供商的重要性。\n\
  \n## 考试要点\n\n**理解并能够列出服务验证与测试的目标。** 服务验证与测试的目标是确保发布能够交付预期的结果和价值，并通过验证服务是否符合用途和实际使用来提供质量保证。该过程旨在为发布能够满足其需求提供客观证据。\n\
  \n**理解发布与部署管理、服务验证与测试以及变更评估等服务过渡过程之间的依赖关系。** 发布与部署管理负责确保进行适当的测试，但测试是在服务验证与测试过程中中执行的。服务验证与测试的输出随后是变更评估的关键输入。\n\
  \n**能够列出在服务验证与测试中使用的典型测试类型。** 采用的主要测试方法如下：\n\n*   仿真测试\n*   场景测试\n*   角色扮演\n*  \
  \ 原型制作\n*   实验室测试\n*   回归测试\n*   联合演练/工作讨会\n*   正式演练/服务演练\n*   会议室试点\n*   现场试点\n\
  \n**能够描述测试模型的使用和内容。** 测试模型包括测试计划、待测试内容以及定义如何测试每个元素的测试脚本。测试模型确保测试以一种可重复、有效且高效的方式一致地执行。它提供了回到需求或设计标准的可追溯性，并通过测试执行、评估和报告提供了审计轨迹。\n\
  \n**理解变更评估的目的。** 变更评估使我们能够理解服务变更的可能性能，以及它可能对业务、IT 基础设施和其他 IT 服务产生什么影响。它通过将变更的实际性能与其预测性能进行比较，提供了一种评估这种影响的一致且标准的方法。\n\
  \n**能够解释变更评估的目标。** 变更评估的目标包括正确设定利益相关者的预期，以及在确定变更将按计划运行之前，防止其被接纳到现环境中。另一个目标是提供高质量的输出，以便变更管理快速决定是否授权该服务变更。\n\
  \n**理解哪些变更需要通过正式的变更评估过程并产生评估报告。** 只有组织认为足够重要或风险大到需要报告的变更才会通过正式的变更评估过程；较简单的变更不会，除非通过变更评审过程进行。\n\
  \n**能够列出并解释与变更评估交互的主要过程接口。** 主要接口与以下过程涉及：\n\n*   **过渡规划与支持**：确保在需要时有适当资源可用。\n* \
  \  **变更管理**：必须有约定的评估标准和允许完成的时间。变更管理依赖于及时收到评估报告，以便 `CAB`（或其他变更授权机构）使用它来协助做出决策。\n\
  *   **服务设计协调**：在服务设计包中提供服务。\n*   **服务水平管理或业务关系管理**：就使用客户资源进行评估达成共识。\n*   **服务验证与测试**：为变更评估提供信息；变更评估和服务验证与测试过程必须协调活动，以确保在足够的时间内获得所需的输入。\n\
  \n## 复习题\n\n你可以在附录中找到复习题的答案。\n\n1. 下列哪项*不是*测试模型的一部分提供的？\n    1. 测试计划\n    2. 待测试内容列表\n\
  \    3. 定义如何测试每个元素的测试脚本\n    4. 测试报告\n\n2. 在发布进行测试时，正确的动作顺序是哪一个？\n    1. 执行测试、设计测试、验证测试计划、准备测试环境、测试清理和关闭、评估退出标准并报告\n\
  \    2. 设计测试、执行测试、验证测试计划、准备测试环境、评估退出标准并报告、测试清理和关闭\n    3. 设计测试、验证测试计划、准备测试环境、执行测试、评估退出标准并报告\n\
  \    4. 验证测试计划、设计测试、准备测试环境、评估退出标准并报告、执行测试、测试清理和关闭\n\n3. 在哪里定义？\n    1. `SKMS`\n\
  \    2. `CMS`\n    3. `KEDB`\n    4. `SDP`\n\n4. 将测试类型映射到开发每个阶段以确保涵盖业务和技术需求的图被称为？\n\
  \    1. `DIKW`\n    2. V 模型\n    3. 测试计划\n    4. 测试策略\n\n5. 下列哪些是对退出标准的评估的有效结果？\n\
  \    1. 服务风险比计划高。\n    2. 服务通过。\n    3. 服务失败。\n    4. 服务成本比计划高。\n    1. 仅 2 和 3\n\
  \    2. 仅 2\n    3. 以上\n    4. 仅 1、2 和 3\n\n6. 哪一个选项是变更评估的目标？\n    1. 确保发布符合用途。\n\
  \    2. 优化整体风险。\n    3. 为发布提供质量保证。\n    4. 正确设定利益相关者的预期。\n\n7. 哪项*不是*变更考虑的因素？\n\
  \    1. 服务变更的实际性能\n    2. 服务变更的成本\n    3. 服务变更的预测性能\n    4. 服务变更的可能影响\n\n8. 评估报告可能包含？\n\
  \    1. 风险状况\n    2. 偏差报告\n    3. 建议\n    4. 资质声明\n    1. 1 和 2\n    2. 2 和 3\n\
  \    3. 1、2 和 3\n    4. 以上\n\n9. 哪项是对性能模型的*最佳*描述？\n    1. 性能基准\n    2. 交付良好性能的预定义步骤\n\
  \    3. 用于预测性能的服务表示\n    4. 用于管理过程性能的框架\n\n10. 什么过程触发变更评估活动？\n    1. 变更管理\n    2.\
  \ 过渡规划与支持\n    3. 发布与部署管理\n    4. 服务验证与测试\n\n# 第 14 章\n\n发布与部署管理与知识管理\n\n**本章讨论了以下\
  \ ITIL 中级考试目标：**\n\n*   ![images](img/00005.jpeg) 发布与部署管理和知识管理从以下方面进行了讨论：**\n  \
  \  *   目的\n    *   目标\n    *   范围\n    *   价值\n    *   政策\n    *   原则和基本概念\n   \
  \ *   过程活动、方法和技术\n    *   触发器、输入、输出和接口\n    *   过程角色和职责\n    *   关键成功因素和关键绩效指标\n\
  \    *   挑战\n    *   风险\n\n\n\n\n![](img/00006.jpeg) 本章涵盖了每个流程的日常操作以及流程活动、方法、技术的细节以及其信息管理。《ITIL\
  \ 中级证书学习指南*（Sybex, 2016）涵盖了服务过渡过程中的管理和监督方面。每个流程都从日常活动的角度进行考虑。这意味着在读完本书的这一部分内容后，你应该理解理解每个流程、其接口及其实现所需的各个方面，并能够提高其有效性和效率。\n\
  \n## 发布与部署管理\n\n一次发布可能包含许多不同类型的服务资产，并涉及许多人员。发布和部署管理确保了发布交接和验收的责任被定义和理解。它确保了必要的规划得以进行，并控制新的或变更的\
  \ `CIs` 的发布。\n\n### 目的\n\n发布和部署管理流程的目的是计划、调度和控制发布的构建、测试和部署，并在保护现有服务完整性的同时，交付业务所需的新功能。这是一个重要的流程，因为规划不当的部署可能会导致业务中断，并无法交付所发布发布应带来的收益。\n\
  \n### 目标\n\n发布和部署管理的主要目标是通过交付计划并有效管理发布，满足设计中定义的要求，从而确保目的的实现。其旨在确保发布包高效、按时地构建、安装、测试和部署，并确保新的或变更的服务交付约收益。发布和部署的一个重要方面是，它还寻求通过尽量减少发布对现有服务的任何不利影响来保护当前的服务。它旨在满足客户、用户和服务管理人员的不同需求。\n\
  \n发布和部署管理的目标包括与客户和利益相关者定义并同意发布和部署的计划，然后创建并测试兼容的 `CIs` 的发布包。另一个目标是在整个过渡过程中维护发布包及其组件的完整性。所有发布包都应按照既定计划存储在\
  \ `DML` 中并从其部署。它们还应该准确地记录在 `CMS` 中。\n\n发布和部署管理的其他目标包括确保发布包可以被跟踪、安装、测试、验证和/或卸载或回滚，并管理组织和利益相关者的变更。新的或变更的服务必须能够交付约定的效用和保证。\n\
  \n该流程确保通过采取必要的纠正措施来记录并管理任何偏差、风险和问题。客户和用户能够使用该服务来支持其业务活动，因为发布和部署确保了必要的知识转移作为过渡的一部分发生。它还确保了所需的知识转移发生，以便服务运营职能能够根据要求的保证和服务水平来交付、支持和维护服务。\n\
  \n### 范围\n\n发布和部署管理的范围包括用于打包、构建、测试和将发布部署到生产环境的流程、系统和功能，并在最终交付给服务运营之前建立服务设计包中指定的服务。\n\
  \n它还包括实现发布所需的所有 `CIs`。这些可能是物理的，如服务器或网络，也可以是虚拟的，如虚拟机或虚拟存储。此流程范围内的其他 `CIs` 包括应用程序和软件。正如我们之前提到的，用户和\
  \ IT 员工的培训也在内，以及与服务相关的所有合同和协议。\n\n你应该注意，发布和部署负责确保进行适当测试；实际测试是作为服务验证和测试过程的一部分进行的。发布部署管理也不授权变更。在发布生命周的各个阶段，它都需要变更管理的授权才能进入下一个阶段。\n\
  \n### 对业务的价值\n\n对新或变更服务的实施、发布和部署采用良好的规划方法可以对组织的整体成本产生重大影响。发布和部署过程以更快的速度、最优的成本和风险交付变更，同时确保新的或变更的服务支持业务目标。它确保了跨团队实施方法的一致性提高，并有助于满足追溯性的审计要求。\n\
  \n设计或管理不当的发布部署可能会导致不必要的支出和时间浪费。\n\n### 政策、原则和基本概念\n\n应当建立发布部署管理政策。正确的政策将有助于确保服务成本、服务稳定性与其以适应变化情况的能力之间实现正确的平衡。\n\
  \n这些不同元素的相对重要性在不同组织之间会有不同。对于某些服务，稳定性至关重要；对于其他服务，实施发布以支持快速变化的业务需求是最重要的，业务也愿意牺牲某些稳定性。为组织决定正确的平衡是一项业务决策；因此，发布和管理策略应支持总体目标。\n\
  \n#### 发布单元\n\n`release unit`（发布单元）一词描述了服务或 IT 基础设施的一部分，该部分根据组织的发布策略作为单一实体发布。该单元根据被发布的不同类型服务资产或服务组件（如软件或硬件）而异。\n\
  \n在图 14.1 中，你可以看到一个简化的示例，显示了一个由系统和服务资产组成的 IT 服务，而这些资产又由服务组件组成。在特定场合实际发布的组件可能包括一个或多个发布单元，并被分组成该特定发布的发布包。每个服务资产都将有一个适当的发布单元级。业务关键应用程序的发布单元可能是整个应用程序，以确保全面的测试，而网站的发布单元可能在页面级。\n\
  \n![流程图显示 IT 服务分支为 A1、A2 和 A3；A2 分支为 A2.1 和 A2.2；A3 分支为 A3.1。A2.1 进一步流向 A2.1.1。](img/00063.jpeg)\n\
  \n**图 14.1** IT 服务发布单元简化示例\n\nCopyright © AXELOS Limited 2010. 这里的材料根据 AXELOS 的许可复制。\n\
  \n在图 14.1 中，资产和组件可能如下：\n\n*   **A1** 服务器\n*   **A2** 应用程序\n*   **A2.1** 在 IT 内部开发的主应用程序\n\
  *   **A2.1.1** 应用程序使用的商业软件报告软件\n*   **A2.2** 在 IT 内部开发的第二个应用程序\n*   **A3** 在 IT\
  \ 内部开发的客户端软件\n*   **A3.1** 为客户端应用程序提供支持例程的商业软件库\n\n\n\n\n\n总体目标是为每个服务或组件决定最合适的发布单元。\n\
  \n部署的便利性是指定发布单元时的主要考虑因素。这取决于发布单元与其他服务以及 IT 基础设施之间接口的复杂性。发布应该具有唯一编号，编号应当具有意义，并引用其所代表的\
  \ CI 以及版本号——例如，`Payroll-System v.1.1` 或 `Payroll-System v.2.0`。当发布额外功能时，第一个数字会变化，而随后的数字表示对现有发布版本的更新。\n\
  \n## 发布包 (Release Package)\n\n发布包是一组将被构建、测试并作为单一发布部署的配置项。它可以是一个单一发布单元，也可以如图 14.1\
  \ 所示的结构化发布单元。当 CI 之间存在依赖关系时，发布包非常有用，例如应用程序的新版本需要操作系统升级，而这需要硬件变更。在某些情况下，发布包可能包括文档和流程。\n\
  \n图 14.2 显示了服务的架构元素如何从当前基线变为新基线，并在每个级别发布。发布团队需要理解相关的架构来计划、打包、构建和测试发布以支持新或变更的服务。例如，在安装应用程序之前，技术基础设施需要就绪——准备好支持它的功能。\n\
  \n![图像显示了当前基线和目标基线之间的发布包流程图，包含了业务、服务（组合）、技术和产品。](img/00064.jpeg)\n\nFIGURE14.2 需要构建和测试的架构元素\n\
  \nCopyright © AXELOS Limited 2010. 保留所有权利。根据 AXELOS 许可复制。\n\n图 14.3 中的示例显示了应用程序及其每个技术平台的发布单元，客户服务由两个支持服务支持：用于基础设施\
  \ `SSA` 和用于应用程序的 `SSB`。这些发布单元将包含有关服务的信息、保证和发布文档。\n\n![图像显示发布包进入用户文档、应用程序发布单元（分为客户端、数据库和中央服务器），以及客户服务（分为发布文档、SSA\
  \ 和 SSB）。](img/00065.jpeg)\n\nFIGURE14.3 发布包示例\n\nCopyright © AXELOS Limited 2010.\
  \ 保留所有权利。根据 AXELOS 许可复制。\n\n## 部署选项与考虑因素\n\n服务设计将定义采用的过渡方法将在 `SDP` 中记录。选择包括一次性部署（big\
  \ bang）与分阶段部署、使用推送（push）或拉取（pull）部署方法，以及自动化部署或手动执行。我们将查看这些。\n\n一次性部署在一次操作中将发布部署到所有区域。如果每个人都在处理相同的版本，这种方法很有用，但如果部署失败将产生重大影响。分阶段部署在计划内将发布部署到用户群的不同部分。这种方法风险较低但耗时更长，并且意味着会有多个版本同时运行。\n\
  \n使用推送机制发布意味着组件是从中心部署的，且接收者无法“退出”接收。拉取机制允许用户选择何时以及何时下载新发布。\n\n自动化部署方法将有助于确保重复性和一致性，如果部署对象是数百或数千个\
  \ `CI`，这可能是唯一可行的选择。然而，自动化方法需要建立分工具，这并不总是合理的。如果使用手动机制，应考虑更大的错误或效率低下风险。\n\n## 发布和部署模型\n\
  \n与其他流程一样，在发布和部署中使用预定义模型是实现方法一致性的有效方法，无论涉及多少人员。发布和部署模型将包含一系列预定义的步骤或活动，为流程的交付提供结构和一致性。还包括每个阶段的退出和进入标准、角色职责定义、受控的构建和测试环境以及基线和模板。所有的支持系统和流程将在交接活动模型中定义。\n\
  \n## 流程活动、方法与技术\n\n发布和部署管理有四个阶段，如图 14.4 所示。让我们在后续章节逐一查看。\n\n### 发布和部署规划\n\n发布和部署阶段将包括该阶段所有方面的计划；计划大部分服务设计期间制定并由变更管理批准。计划不仅包括发布和部署计划本身，还包括试点发布计划；构建、测试和打包发布的计划；以及详细的部署计划。还必须包括物流考量和财务计划。\n\
  \n![图像显示变更管理具有阶段，如授权发布规划、授权构建和测试、授权提交到 DML、授权部署以及实施后审查。](img/00066.jpeg)\n\nFIGURE14.4\
  \ 发布和部署管理阶段\n\nCopyright © AXELOS Limited 2010. 保留所有权利。根据 AXELOS 许可复制。\n\n#### 通过失败标准\n\
  \n在此阶段，将决定某项活动是否通过或未满足设计中要求的标准。发布这些标准对于正确设定预期非常重要。例如，所有测试均成功视为通过，或服务设计不符合设计中定义的特定运行要求视为失败。\n\
  \n#### 构建和测试规划\n\n接下来，考虑构建和测试阶段。该阶段包括编写发布和构建文档、确保必要的合同和协议到位，以及获取必要的配置项和组件。这些项都需要经过测试。\n\
  \n#### 发布打包和构建规划\n\n然后需要构建发布包，这是一个确保构建管理程序、方法论、工具和清单就位的机会，以确保发布包以一致、受控且可重复的方式构建。\n\
  \n\n\n\n\n发布包的最终版本（经变更管理授权）必须存放在 DML（部署主列表）中。发布包必须始终从 DML 获取，以部署到服务就绪环境、验收环境和生产环境。\n\
  \n## 部署规划\n\n“计划和准备部署”阶段的准入标准包括：所有利益相关者都确信已准备好部署，并接受发布带来的成本以及管理、组织和人员方面的影响。部署包含了部署、迁移或停用/退役服务或服务资产所需的活动。它还可能包括组织内部或组织之间的服务或服务单元的迁移，以及移动和处置活动。\n\
  \n## 试点规划\n\n在生产环境中进行试点有许多不同的方法，这些方法可以为组织尝试新服务或变更的服务提供显著收益。\n\n服务演练在实践环节中尽可能地模拟服务。它发生在服务部署之前。其目标是确认已识别了所有利益相关者，并获得他们对部署的承诺。它还可以验证所有利益相关者是否拥有相关的流程和程序来处理该服务。它也可以用于检查针对预期用户错误的响应措施。演练可以根据\
  \ PDCA 方法进行：计划当天工作、执行演练、记录发生的情况，并根据演练结果采取行动。\n\n试点还可以通过在组织的一个小型、受控且衡量的环境中实施，来检测服务是否能够运行。它可以用于建立指标，并对预测的性能和服务水平达成提供信心。试点还将展示将实现的实际收益和成本，并让用户群体对服务接受。在试点期间，还可能识别任何影响最终部署的风险，并为实施缓解措施留时间。\n\
  \n## 财务/商业规划\n\n与任何发布相关的成本在通过变更管理授权发布时已经过考虑。确保业务充分意识到并接受发布成本至关重要。\n\n这应该涵盖关键方面，如发布所需的营运资金、合同和许可；支持服务的资金；以及任何与知识产权相关的成本。\n\
  \n## 发布与构建文档\n\n随着发布进入下一个阶段（构建和测试阶段），确保提供正确的文档至关重要。这应该包括用于发布中资产的构建和发布的程序、模板和指南。\n\
  \n建议的解决方案应完整记录，以便在发布期间进行知识共享和传递。\n\n## 获取和测试输入配置项和组件\n\n确保配置项和组件满足要求的质量水平至关重要。将有许多验证活动来检查用于发布包或构建的组件。\n\
  \n这将确保构建是根据设计中指定的质量标准的资产和组件创建的。\n\n## 发布打包\n\n为了确保发布包以受控、可用且可重复的方式构建，应应用构建管理程序、方法、工具和清单。\n\
  \n构建发布包的关键活动如下：\n\n* 以受控可重复的方式汇总并集成发布组件。\n* 创建构建和发布文档。\n* 安装并验证发布包。\n* 对发布包的内容建立基。\n\
  * 通知接收者包已准备好安装和使用。\n\n如果在任何一步发布包的测试未能成功完成，将通过变更管理对发布进行重新评估和重新调度。\n\n## 构建和管理测试环境\n\
  \n有效的发布管理取决于以重复和可管理的方式执行构建和测试。确保对构建和测试环境有足够的控制至关重要。\n\n有必要确保对建议解决方案的任何更改导致对构建和测试环境的检查，并在实施变更时进行适当调整。\n\
  \n在构建或测试新服务之前，应始终对环境建立基线并验证。\n\n## 服务测试与试点\n\n我们在本节前面的部分回顾了服务测试和试点的规划要求，以下是生产部署前进行测试的一些考虑因素：\n\
  \n* **部署就绪性测试**：确保部署流程和程序能够成功将服务部署到目标环境\n* **服务管理测试**：确保服务性能在生产使用中可以被衡量、监控和管理\n\
  * **服务运营测试**：确保服务团队能够在生产中使用操作该服务\n* **用户测试**：确保用户能够访问和使用新服务\n* **服务提供者接口测试**：确保服务的接口工作正常\n\
  * **部署验证测试**：确保服务能力已正确部署\n\n### 部署阶段\n\n部署应该在之前的阶段作为计划的一部分完成，但此时有一个机会为组织以及支持团队为部署做准备。\n\
  \n#### 计划和准备部署\n\n在实际部署阶段，会制定详细的实施计划，包括为特定活动分配人员。\n\n规划和准备目标部署组的准入标准包括：\n\n* 部署利益相关者对服务发布有足够的信心执行部署。\n\
  * 高层管理、客户、业务和服务提供者团队接受部署的所有方面。\n\n适用于目标组部署的部署活动示例见图 14.5。请注意每个阶段采取的行动、在不同阶段从变更管理获得的授权，以及在关键点建立的基。\n\
  \n![图像显示部署活动示例，例如为每个目标组管理变更（授权）和管理部署（基线点）。其关键要点是评估就绪性、制定计划等。](img/00067.jpeg)\n\n\
  **图 14.5** 一组部署活动示例\n\nCopyright © AXELOS Limited 2010. 版权所有。材料根据 AX AX AXELOS 许可复制。\n\
  \n当部署活动完成后，确保用户、服务运营职能、其他以及利益相关者能够按照计划使用或操作服务至关重要。这是收集部署过程反馈的好时机，以用于未来的改进。\n\n####\
  \ 评估目标组的就绪性\n\n评估目标组的就绪性应包括\n\n* 问题和风险\n* 预期影响\n* 知识传递中需要填充的差距\n* 财务方面和资产\n* 业务和现有服务的当前能力\n\
  * 当前的服务管理能力\n* 组织就绪性\n* 信息管理\n* 基础设施和设施\n\n\n\n\n确保所有这些方面都得到涵盖不会保证部署的成功，但将支持部署并能够发现任何出现的问题\n\
  \n## 执行转移、部署和退役\n\n以下活动提供了部署期间需要执行的不同方面方面的示例：\n\n* 变更/转移财务资产。\n* 如果引入了新的服务提供商，则进行组织变更。\n\
  * 部署流程和材料。\n* 部署服务管理能力，包括新的或更改的流程、系统和工具。\n* 将服务转移给新的利益相关者。\n* 在接收点部署服务。\n* 如果新服务或更改的服务是现有服务的替代品，则在适用的情况下执行停用和服务退役。\n\
  * 移除冗余资产。\n* 验证部署以确保其符合验收标准。\n* 如果部署未成功，进行补救或执行回滚发布。\n* 使用早期生命支持（early life support），该支持提供了与部署团队保持联系的机会，协助修复服务部署过程中可能出现的初始问题。此步骤还提供了知识和文档的转移机会。\n\
  \n## 审查与关闭\n\n在审查部署时，应包含以下活动：\n\n* 收集客户、用户和支持人员对满意度的经验和反馈。\n* 强调未达质量标准。\n* 检查所有操作、修复和更改是否已完成。\n\
  * 审查任何开放的变更，以确保这些已移交到生产环境。\n* 审查性能目标和成就。\n* 确保问题、故障和已知错误已正确记录并归属。\n* 审查风险注册表并确保分配了持续的所有者。\n\
  * 确认冗余资产已移除。\n* 确认服务已准备好从早期生命支持移动到服务运营。\n\n重要的是，单次过渡可能由多个不同的部署组成。在整体过渡被认为完成之前，每个部署都必须经过审查并关闭。\n\
  \n对服务发布的正式评估将使用部署的输出结果。变更评估将实际服务性能与预测性能进行比较。变更评估的成功完成确保了部署可以正式关闭并交给服务运营职能和持续服务改进。教训和改进随后可以输入到变更管理过程中，用于事实施后审查以及对未来过渡的持续服务改进。\n\
  \n现在，让我们来看发布和部署管理的触发因素、输入、输出和过程接口。\n\n### 触发因素\n\n我们首先查看该过程的触发因素。发布和部署管理的触发因素是接收到授权的变更，以计划、构建和测试生产就绪的发布包。部署的触发因素是接收到授权的变更，将发布包部署到目标部署组或环境——例如，业务单元、客户组和/或服务单元。\n\
  \n### 输入\n\n发布和部署管理的输入包括授权的变更和包含服务章程的 `SDP`。章程定义了业务需求、预期的效用和保证、概述预算和时间表、服务模型以及服务验收标准。另一个输入是获取的服务资产和组件，以及用于构建、测试、发布、培训、灾难恢复、试点和部署的文档和规范。发布策略和设计、发布和部署模型，以及每个阶段的退出和进入准则是剩余的输入。\n\
  \n### 输出\n\n该过程有许多输出；主要输出是新的、更改的和退役的服务；发布和部署计划以及更新后的服务目录。其他输出还包括新服务能力的细节和文档、服务转换报告、发布包、SLAs、OLAs、合同、测试过的连续性计划、CI\
  \ 规范和容量计划。\n\n### 接口\n\n主要接口是与其他转换过程的接口：\n\n* 设计协调创建定义新服务及其创建方式的 `SDP`。这是发布和部署的主要输入。\n\
  * 转换规划和支持为发布和部署管理的运行提供了框架，转换计划为发布和部署计划提供了背景。\n* 变更管理与发布和部署紧密集成。变更授权发布和部署。发布和部署计划是变更的一部分。\n\
  * 服务资产和配置管理提供关键数据和信息，并更新 `CMS`。\n* 服务验证和测试与部署协调，以在需要时进行测试并在需要时提供构建版本。\n\n## 过程角色与职责\n\
  \n在第一章“运营支持与分析简介”中，我们探讨了适用于整个服务生命周期的通用角色。这些与发布和部署过程有关，但也有特定的额外要求。记住，这些不是“职位”，而是对于成功运行该过程所需的角色指导。\n\
  \n### 发布和部署过程所有者\n\n除了第一章中描述的通用过程所有者角色外，所有者角色将包括：\n\n* 设计发布模型和工作流\n* 与其他过程所有者合作，以确保设计、变更管理、服务资产和配置管理、发布和部署以及服务验证和测试的集成方法\n\
  \n### 发布和部署过程经理\n\n确保该角色不是由负责服务验证和测试的人员担任，以避免利益冲突。\n\n除了第一章中描述的通用过程经理角色外，经理角色将包括：\n\
  \n* 规划和协调该过程的所有资源\n* 规划和管理工具的支持\n* 确保在任何需要的情况下获得变更授权\n* 协调过程之间的接口，特别是变更管理、`SACM`\
  \ 和服务验证和测试\n\n### 发布包与构建人员\n\n在较小的组织中，需要将发布和部署的角色合并为经理角色或部署人员角色。这些不是职位描述，因此该角色可以由技术或应用管理部门的人员担任。\n\
  \n发布包与构建人员通常包括：\n\n* 协助发布包的设计\n* 建立最终发布配置\n* 构建发布\n* 测试发布\n* 建立并报告未解决已知错误和替代方案\n\
  * 为变更授权提供输入\n\n### 部署人员\n\n在较小的组织中，需要将发布和部署的角色合并为经理角色或发布与构建人员角色。这些不是职位描述，因此该角色可以由技术或应用管理部门的人员担任。\n\
  \n部署人员的角色通常包括：\n\n* 协助规划部署\n\n\n\n\n* 确保部署已获得变更管理的授权\n* 执行部署的物理交付\n* 协调发布文档和通信\n\
  * 在整个发布过程中提供技术和应用指导及支持\n* 对发布的有效性提供反馈\n* 记录并报告部署指标\n\n### 早期运行支持实践者\n\n该角色可以由技术或应用管理职能的人员承担。它可以与打包和构建实践者或部署实践者的角色结合。\n\
  \n早期运行支持实践者的角色通常包括：\n* 从部署到最终验收期间提供 IT 服务和业务功能支持\n* 确保支持文档的交付\n* 为服务台台提供支持\n* 为初始支持的提供提供发布验收\n\
  * 调整和完善随最终使用而演变的元素，例如用户文档\n\n### 构建与测试环境经理\n\n该角色可以由技术或应用管理职能的人员承担。它可以与部署实践者的角色结合。\n\
  \n构建与测试环境经理的职责通常包括：\n* 确保服务基础设施和应用程序按照设计规范构建\n* 规划 ICT 基础设施的获取、构建、实施和维护\n* 确保组件来自受控源\n\
  * 开发集成应用程序软件和基础设施构建\n* 为构建和测试环境交付适当的构建、运营和支持文档\n* 构建、交付和维护所需的测试环境\n\n### 运营人员参与发布和部署管理\n\
  \n服务运营人员将每天参与发布和部署的活动。我们已经提到了应用和技术管理对某些发布和部署管理角色的参与。此外，我们可能会发现服务运营人员以以下方式参与：\n*\
  \ 关于新版本部署的实际实施操作\n* 参与重大新版本的规划阶段，通过提供对服务运营问题和风险的建议\n* 对进或离开 `DML` 的 `CIs` 进行物理处理\n\
  * 参与失败发布的回滚或退出活动\n\n## 信息管理\n\n在整个发布和部署过程中，将创建并维护适当的记录。随着资产和配置项成功部署，它们的记录将在配置管理系统中更新。\n\
  \n除了捕获 `CI` 信息外，服务管理的其他数据和信息将在服务知识管理系统中捕获。例如 `DML` 中的发布包、安装和构建计划、测试计划和培训记录。\n\n\
  部署清理的一个重要部分将删除或归档与之前的服务或产品相关的任何冗信息项或记录。\n\n## 关键成功因素和关键性能指标\n\n与所有过程一样，发布和部署管理的性能应该被监控和报告，并应采取行动进行改进。正如我们讨论过的其他过程一样，每个关键成功因素（CSF）都应该有少量的关键性能指标（KPIs）来衡量其成功，且每个组织可以选择自己的\
  \ KPI。\n\n让我们来看发布和部署管理的两个 CSF 示例以及每个相关的 KPI。\n\nCSF “确保发布包及其组成部分在整个转换活动中的完整性”的成功可以使用\
  \ KPI 来衡量，这些 KPI 衡量了在进行审计时 `CMS` 和 `DML` 信息趋向准确性增加的趋势。此 CSF 的其他相关 KPI 包括拟议预算的准确性，以及由于部署错误组件导致的事件数量减少。\n\
  \nCSF “确保有适当的知识传递”的成功可以使用 KPI 来衡量，这些 KPI 衡量了类为“用户知识”的事件数量的减少、一级和二级支持解决的事件百分比的增加，以及在客户被询问发布和部署管理时客户满意度评分的提高。\n\
  \n### 挑战\n\n发布和部署管理的挑战包括跨项目和供应商开发标准的性能衡量和衡量方法，处理预计交付日期不准确的项目和供应商，以及理解支持有效风险管理的不同利益相关者的观点。最后的挑战是鼓励一种风险管理文化，让人们分享信息并对风险采取务实和谨慎的方法。\n\
  \n### 风险\n\n发布和部署的主要风险包括范围定义模糊和对依赖关系的理解不，导致发布和部署管理期间范围蔓延。缺乏专职人员会导致资源问题。其他风险包括规避流程、资金不足、对软件许可和其他领域的控制不力、组织和利益相关者变更管理不当以及供应商管理糟糕。可能存在由于员工对发布的敌对反应产生的风险。最后，由于对发布潜在影响的理解不，可能会应用程序或技术基础设施受到不利影响。\n\
  \n## 知识管理\n\n交付高质量服务或过程的能力在很大程度上取决于参与人员应对情况的能力。他们能够有效地做到这一点取决于他们的知识和经验。服务转换关乎变更，如果员工要发挥作用，变更则需要学习新信息。\n\
  \n### 目的\n\n知识管理过程目的是共享观点、想法、经验和信息；确保这些内容在正确的时间出现在正确的地方，以便做出明智的；并通过减少重新发现知识的需求来提高效率。\n\
  \n### 目标\n\n知识管理的主要目标是确保知识、信息和数据在整个服务提供者组织中被收集、分析、存储、共享、使用和维护。知识通过服务知识管理系统 (`SKMS`)\
  \ 进行管理，该系统为每个受众提供对知识、信息和数据的受控访问。拥有这些将产生以下结果：\n* 它将减少重新发现知识的需求，因此服务提供者可以更高效——能够在提供更高质量的服务并获得更高满意度的同时降低成本。\n\
  * 它将确保员工清楚理解使用这些服务所实现的价值和益处。\n* 它通过提供可靠安全的知识、信息和数据来改进管理决策。\n\n### 范围\n\n知识管理涉及所有生命周期领域，而不只是服务转换。该过程的主要范围包括对知识以及产生该知识的信息和数据管理的监督。排除在此之外的是资产和配置数据的捕获、维护和使用，这是服务资产和配置管理过程的职责。\n\
  \n\n\n\n知识管理对于生命周期的所有阶段、所有角色都至关重要。它对于服务过渡尤为重要，因为过渡过程中重点关注作为过渡一部分的知识转移的管理。这将使业务能够有效地使用交付的服务。\n\
  \n有效的知识管理可以确保符合法律及其他要求，例如公司政策和程序。它为每一类数据、信息和知识的留存和处置提供了文档化的需求，并确保数据、信息和知识是实时的、完整的、有效的，并且在需要它们的人员在需要时可以获取。它还确保了已建立相应的程序，以对对不再需要的知识进行安全处置。\n\
  \n## 政策、原则和基本概念\n\n现在让我们来看支撑知识管理的政策、原则和基本概念。\n\n### 政策\n\n知识管理政策指导员工采取必要的行为，以使知识管理有效。政策陈述通常包含以下项目：\n\
  \n* 应定义一种安全且便利的知识存储和访问方式。\n* 所有员工都应获得访问权限，以协助他们支持提供的服务。\n* 所有政策、计划和流程必须至少每年审查一次。\n\
  * 所有知识和信息应按照正式的文档化流程进行创建、审查、批准、维护、控制和处置。\n\n### 数据到信息到知识到智慧\n\n知识管理通常在数据、信息、知识、智慧（DIKW）模型中体现，如图\
  \ 14.6 所示。你应该从*ITIL Foundation Exam Study Guide* (Sybex, 2012) 中记住这一点。\n\n![图像沿\
  \ x 轴显示理解，y 轴显示上下文，数据位于中心。它解释了从数据到智慧的流程，中间是信息和知识。](img/00068.jpeg)\n\n图 14.6 从数据到智慧的流程\n\
  \nCopyright © AXELOS Limited 2010\\. 版权所有。材料根据 AXELOS 的许可进行复制。\n\n让我们来看这个模型，并检查这些概念的每一个含义：\n\
  \n* 数据是一组离散的事实。大多数组织在高度结构化的数据库中采集大量数据，例如服务管理、服务资产与配置管理工具/系统以及数据库。\n* 信息为数据提供上下文。信息的一个例子是关闭优先级\
  \ 2 事件的平均时间。这些信息是通过结合许多事件的开始时间、结束时间和优先级的数据创建的。\n* 知识由个人的隐性经验、想法、见解、价值观和判断组成。知识将信息转化为“易于使用”的形式，这可以促进决策制定。知识的一个例子是，自新版本的服务发布以来，关闭优先级\
  \ 2 事件的平均时间增加了约 10%。\n* 智慧利用知识，通过正确且信息充分的决策来创造价值。智慧涉及具备上下文的感知能力，以提供强有力的常识判断。智慧的一个例子是意识到关闭优先级\
  \ 2 事件时间的增加是因为新版本服务的文档质量不佳。\n\n### 服务知识管理系统\n\n服务知识管理系统（SKMS）存储所有与 IT 服务管理相关的知识。这些知识由通过各种流程收集并存储在\
  \ SKMS 中的大量数据支撑。一个非常重要的例子是配置管理系统（CMS），它是 SKMS 的组成部分。CMS 描述了配置项（CI）的属性和关系，其中许多配置项本身就是存储在\
  \ SKMS 中的知识、信息或数据资产。我们在第 12 章“变更管理与服务资产与配置管理”中涵盖了 CMS。\n\n图 14.7 显示了三个层级关系的非常简单的插图，配置数据记录在\
  \ CMDB 中，并通过 CMS 馈送到 SKMS。SKMS 提供的知识支持服务的交付和明智的决策。\n\n![图像显示了 CMDB、CMS 和 SKMS 之间的关系，箭头从底部向上流动，顺序为\
  \ CMDB、CMS 和 SKMS。SKMS 有两个箭头：支持决策和支持服务的交付。](img/00069.jpeg)\n\n图 14.7 CMDB、CMS 和\
  \ SKMS 的关系\n\nCopyright © AXELOS Limited 2010\\. 版权所有。材料根据 AXELOS 的许可进行复制。\n\nSKMS\
  \ 将包含许多不同类型的数据、信息和知识，包括服务组合、CMS、DML、SLA、OLA 以及合同、信息安全策略、供应商和合同管理系统（SCMIS）、预算和成本模型。这些许多知识和信息资产都是配置项。对\
  \ CI 的更改必须在变更管理流程的控制下，其属性和关系的细节将在 CMS 中记录。图 14.8 显示了 SKMS 中应包含的信息示例。\n\n![图像显示了服务知识系统中的数据和信息，带有管道、目录和存档。它有一个\
  \ CMS ，连接到 DML、发布计划、事件、技术文档等。](img/00070.jpeg)\n\n图 14.8 服务知识系统中的信息示例\n\nCopyright\
  \ © AXELOS Limited 2010\\. 版权所有。材料根据 AXELOS 的许可进行复制。\n\n### 知识转移\n\n\n\n\n知识需要在生命周期中的特定时间点被传递给其他人以及组织的其他部分。例如，知识传递的发生是为了确保在服务过渡到支持阶段时，服务台拥有最佳的知识。这包括来自发布和部署管理的信息，例如已知错误和来自任何技术支持团队的诊断脚本。还需要建立与人力资源部门（HR）、设施和其他支持性服务的联系，以促进知识的收集和共享。\n\
  \n知识传递有许多不同的方法：\n\n- 学习风格——人们以不同的方式学习，并随年龄、文化、态度和性格而异。用户对知识传递的需求可能与支持团队不同。\n- 知识可视化——旨在通过使用基于计算机和非基于计算机的视觉效果（如图表、图像、照片和故事草板）来改进知识的传递。这可以包括教育动画或游戏化。\n\
  - 行为引导——可以通过提供脚本或其他机制来指导员工如何执行特定任务。\n- 研讨会、网络研讨会和文档可用于发布新服务或变更的服务，并提供相应的知识传递，这些内容可以根据需要重复和使用。\n\
  - 日志和简报可以维持定期的通信渠道，并以增量的方式交付知识传递。这些机制还可以很容易针对特定受众进行调整，并提供针对特定群体的信息。\n- 讨论论坛和社交媒体也可以有效地与广泛受众进行通信，但必须对其进行监控和维护，以确保其有用性和相关性。\n\
  \n## 管理数据、信息和知识\n\n知识建立在对其支持和数据的管理之上。为了提高效率，这一过程需要对某些关键过程输入有理解，例如数据、信息和知识将如何被使用，提出如下问题：\n\
  \n- 需要哪些知识？\n- 我们需要监控什么？\n- 有哪些可用数据？\n- 采集和维护数据的成本是多少？\n- 其价值是否证明了成本？\n\n我们还需要考虑适用的策略、法律、标准、知识产权和版权问题。使用服务知识管理系统可以降低维护和管理服务的成本。\n\
  \n## 定义信息架构\n\n为了有效利用数据交付知识，创建并维护与组织结构和需求匹配的相关架构至关重要。\n\n知识、信息和数据架构的示例见图 14.9。\n\
  \n![图像显示了 SKMS 的架构层，如表示层（门户、计分卡、IT 治理视图等）、知识处理层、信息集成层（集成 IMDB 和其他集成数据）以及数据层（CMDB、DML\
  \ 等）。](img/00071.jpeg)\n\n图 14.9 SKMS 的架构层\n\nCopyright © AXELOS Limited 2010. 保留所有权利。材料根据\
  \ AXELOS 的许可进行复制。\n\n**表示层**——这实现了搜索、浏览、检索、更新、订阅和协作。面向其他层的不同视图适用于不同的受众。每个视图都应受到保护，以确保只有授权人员才能查看或修改底层的知识、信息和数据。\n\
  \n**知识处理层**——这是信息转换为能够支持决策的有用知识的地方。\n\n**信息集成层**——提供从数据层中多个源数据收集的集成信息。\n\n**数据层**——包括用于数据发现和数据收集的工具，以及非结构化和结构化形式的数据项。\n\
  \n## 建立数据、信息和知识管理程序\n\n一旦确定了需求和架构，关键步骤涉及建立以下机制以：\n\n- 识别需要收集的服务生命周期数据和信息\n- 定义维护数据和信息所需的程序，并提供给需要它的人\n\
  - 定义将数据转换为信息然后转换为知识的活动和转换\n- 存储和检索数据\n- 为所有所需项目建立权限和责任\n- 定义并公布关于知识、信息和数据项保留、传输和访问的权利、义务和承诺（基于适用要求并保护安全性、完整性和一致性）\n\
  - 建立数据和信息的充分备份和恢复\n- 识别根据技术变化、组织需求、政策演进和法律变化进行审查的需求\n- 处理收集和留存需求\n- 审查存储的知识、信息和数据，以确保其仍然相关且正确\n\
  - 更新、清理和归档知识、信息和数据\n\n这些程序应使组织能够从相关来源捕、存储和检索识别的数据。此外，组织应该能够根据法律要求在存储和移动方面管理数据、信息和知识。这将支持根据组织、法规和法律要求的存档管理。\n\
  \n与所有过程一样，知识管理和 SKMS 将接受持续的服务改进活动。\n\n## 使用服务知识管理系统\n\n服务知识管理系统的实施可以从多种方式和情况支持组织：\n\
  \n- 全球组织可以跨越时区或位置共享信息，只要指定了通用的语言方法。\n- SKMS 可以通过提高运营管理程序的效率，协助降低维护和管理服务的成本。\n- SKMS\
  \ 可以协助减少因信息缺失或管理不当而产生的风险。\n- 提供集中的信息和知识可以支持服务台等功能领域，通过支持事件解决和问题管理信息提供支持。\n- 服务知识管理系统可以包含客户使用的自服务门户，直接向用户提供支持知识并降低支持成本。\n\
  \n\n\n\n知识管理的核心产出是进行决策和管理 IT 服务所需的知识；这些知识维护在 `SKMS` 中。知识管理的成功在很大程度上取决于相关人员的参与。例如，一线运营人员将使用有关已知错误的信息来帮助支持用户；他们还将负责收集大量存储在\
  \ `SKMS` 中的数据，例如事件记录。问题管理人员将是事件数据的关键用户，而过渡人员将捕获数据并回馈给 `CSI` 和设计部门。\n\n### 接口\n知识管理与生命周期每个阶段的每一个其他服务管理过程都有接口。只有当所有过程和活动都使用\
  \ `SKMS` 来存储和管理它们的信息和数据以提取最大价值时，`SKMS` 才能真正发挥作用。\n\n### 知识管理角色\n在第 1 章中，我们探讨了适用于整个服务生命周期所有过程中通用角色。这些角色与知识管理过程相关，但也有一些特定的额外要求。请记住，这些不是“职位名称”，而是对成功运行该过程可能需要的角色的指导。\n\
  \n#### 知识管理过程所有者\n在许多组织中，这一角色将与知识管理过程经理角色合并。其他选项可能包括将该角色与服务资产和配置管理角色合并。\n\n除了过程所有者的通用职责外，该角色通常还包括：\n\
  * 为组织内部知识的识别、捕获和维护整体架构\n\n#### 知识管理过程经理\n知识管理过程经理的职责以及通用过程经理角色的职责包括：\n* 确保以高效有效的方式让需要的人员能够获取所有知识项\n\
  * 计划和管理对知识管理工具和过程的支持\n* 鼓励整个服务提供者的人员向服务知识管理系统 (`SKMS`) 贡献知识\n* 作为业务和 IT 人员在知识管理事务方面的顾问，包括关于存储、价值、重要性等方面的政策决策\n\
  \n#### 知识管理过程执行者\n在许多组织中，这一角色被称为“知识管理员”。该角色通常包括：\n* 识别、控制和存储任何被认为与所提供服务相关但无法通过其他手段的信息\n\
  * 维护受控的知识项，以确保其时效性、相关性和有效性\n* 监控有关知识信息的宣传情况，确保信息不重复并被视为信息的中心来源\n\n#### 知识创建者\n这可能由组织中的许多不同人员执行，因为知识的创建和共享是组织中（包括业务和\
  \ IT）大多数角色的前提。\n\n## 信息管理\n创建服务知识管理系统可能涉及对工具的大量投资。`SKMS` 可能由许多不同但集成的工具和仓库组成。\n\n\
  该过程最重要的方面是针对组织所需的每项数据、信息或知识，进行理解和记录：\n* 它与其他数据、信息和知识有何关系？\n* 它存储在何处以及如何存储？\n* 谁负责收集、更新和维护它？\n\
  * 适用哪些法律、法规或治理考虑因素？\n* 它需要持续多久？在不再需要时将如何整合、归档或删除？\n* 应该允许谁访问？从哪里？什么时候？\n* 应该允许谁更改它？\n\
  * 是否需要审计？如果是，如何审计、由谁审计以及频率是多少？\n\n这可以用于制定创建 `SKMS` 及其工具的方法。\n\n## 关键成功因素和关键绩效指标\n\
  与其他过程一样，知识管理的性能应该被监控和报告，并采取行动对其进行改进。以下是知识管理的两个 CSF 示例以及每个相关的 KPI。\n* 关键成功因素：“支持管理决策的知识和信息的可用性”\n\
  \    * KPI：经理访问 `SKMS` 的次数增加\n    * KPI：经理对 `SKMS` 搜索获得良好评分的百分比增加\n* 关键成功因素：“新和变更服务的成功实施和早期运行支持，且知识相关的错误很少”\n\
  \    * KPI：分类为知识相关的事件和问题数量减少\n    * KPI：服务成功过渡的百分比增加\n\n### 挑战\n实施知识管理可能具有挑战性。挑战包括证明为现有知识、信息和数据创建仓库所需的努力是合理的。人们可能会认为知识管理干扰了其他管理自身信息的团队的工作。最后的挑战是说服所有利益相关者，更具合作性和整体性的知识管理方法可以带来的利益。\n\
  \n### 风险\n成功实现知识管理的风险如下：\n* 重点可能在于工具而非价值的创造。\n* 可能对组织所需的知识、信息和数据理解不足。\n* 对该过程的价值可能怀疑，导致对支持\
  \ `SKMS` 所需工具和人员投入不足。\n* 如果没有的知识管理策略策略精力可能集中在知识捕获上，而对知识传递和重用的关注不足。\n* 如果存储和共享的知识和信息过时且无关，该过程可能会失去信誉。\n\
  * 如果利益不明确，利益相关者不太可能提供该过程所需的支持和承诺。\n\n### CSI 和知识管理\n知识管理通过实现数据捕获方法及其信息和知识的生成来支持七步改进过程。（七步改进过程在\
  \ *ITIL Foundation Exam Study Guide* [Sybex, 2012] 中涵盖，作为 ITIL Foundation 考试大纲的一部分。）这将被用于决策，即\
  \ DIKW 模型中的“智慧”。\n\n## 总结\n本章探讨了服务过渡阶段的两个过程：发布和部署管理以及知识管理。我们研究了发布和部署管理过程如何确保发布所需的计划得以执行，并管理发布活动以减少对现有服务的风险。我们还考虑了知识管理过程如何确保提供服务的人员拥有高效工作所需的所有信息，并对服务做出决策。我们审视了这些过程如何相互支持，以及这些过程对业务和\
  \ IT 服务提供者的重要性。\n\n## 考试要点\n**理解发布和部署管理的目的。** 发布和部署管理确保发布经过计划、调度和控制，以便新或变更的服务被成功构建、测试和部署。\n\
  \n\n\n\n\n# 理解并列出发布和部署管理的目标。\n发布和部署的目标是确保新服务或变更的服务成功过渡到生产环境，包括对问题和风险的管理。它还确保接收方和支持团队都完成了知识传递。\n\
  \n# 理解发布和部署管理的范围。\n发布和部署管理的范围涵盖了发布包打包、构建和测试的所有方面（包括管理作为发布组成的所有 `CIs`），以将发布部署到生产环境中。\n\
  \n# 能够解释发布策略的内容。\n发布策略描述了实施发布的方式，提供了发布类型的定义，并规定了在流程控制下应进行管理的活动。\n\n# 能够列出发布和部署管理的四个阶段。\n\
  发布和部署的四个阶段是发布和部署规划、发布构建和测试、部署、以及评审和关闭。所有四个阶段都应该由变更管理流程的授权触发。\n\n# 理解知识管理的目的。\n知识管理是在正确的时间、正确的地点共享观点、想法、经验和信息，以便做出明智的决策，减少重新发现知识的需求。\n\
  \n# 理解知识管理的目标。\n知识管理的目标是确保我们有捕和共享知识的机制，以提高服务质量和决策水平。\n\n# 能够描述知识管理的范围。\n知识管理贯穿整个服务生命周期，其范围包含了与客户和用户的交互信息。排除的是与知识相关的\
  \ `CIs` 的管理。\n\n# 能够描述 DIKW 模型。\nDIKW 代表数据到信息到知识到智慧。这确保了我们为支持的组织提供的通信增加了背景和理解。\n\
  \n* 数据是一组离散的事实集合。\n* 信息为数据提供背景。\n* 知识由个人的隐性经验、想法、见解、价值观和判断组成。\n* 智慧利用知识，通过正确且信息充分的决策来创造价值。\n\
  \n# 能够描述 SKMS 的角色和目的。\nSKMS 是管理与服务管理相关的知识的总系统。它整合了来自我们服务管理流程的所有所有现有数据源，并实现了整个服务生命周期知识管理的\
  \ DIKW 结构。\n\n## 复习题\n\n你可以在附录中找到复习题的答案。\n\n1. 以下是发布包的正确定义？\n    1. 一组将一起构建、测试和部署的配置项\n\
  \    2. 服务或 IT 基础设施的一部分，通常作为单个单元发布\n    3. 对 IT 服务的一项或多个变更，这些变更被一起构建、测试和部署\n   \
  \ 4. 处理特定类别发布的重复方法\n\n2. 发布和部署流程包含一个名为“早期运行支持”（early life support）的概念。早期运行支持是指什么？\n\
  \    1. 早期支持是指项目生命周期的结束以及实施后项目评审的管理。\n    2. 早期支持是指服务过渡与服务运营之间的交接，确保在运行初始阶段为新或变更的服务提供支持。\n\
  \    3. 早期支持是指在运营环境中引入新流程，使用服务过渡流程来确保新流程的完全集成。\n    4. 早期支持是指发布和部署流程中的一步，即项目团队将基础设施文档交付给服务管理团队。\n\
  \n3. 以下陈述中哪一个*没有*描述发布策略建议的部分？\n    1. 唯一的标识结构或命名规范，以确保发布易于识别和跟踪\n    2. 在发布所有阶段管理发布所需的角色和职责定义\n\
  \    3. 配置管理系统的命名规范定义\n    4. 使用权威媒体库（definitive media library）发布所有软件资产\n\n4. 以下哪个*不是*发布和部署流程的阶段之一？\n\
  \    1. 发布和部署规划\n    2. 部署\n    3. 评审和关闭\n    4. 验证和审计\n\n5. 早期运行支持是发布和部署管理流程中的一个重要概念。早期支持发生在发布和部署流程的哪个阶段？\n\
  \    1. 发布构建和测试\n    2. 评审和关闭\n    3. 部署\n    4. 发布部署规划\n\n6. 将每个 DIKW 概念与其定义匹配。\n\
  \    1. 数据\n    2. 信息\n    3. 知识\n    4. 智慧\n        1. 由隐性经验、想法、见解、价值观和判断组成\n \
  \       2. 一组离散的事实\n        3. 通过正确且信息充分的决策创造价值\n        4. 为数据提供背景\n\n7. 知识管理流程维护并更新一个用于知识管理的工具。这个工具叫什么？\n\
  \    1. 服务管理工具\n    2. 服务管理知识库\n    3. 服务知识管理系统\n    4. 服务管理数据库\n\n8. 服务生命周期的一个重点是与\
  \ IT 服务提供相关的知识的捕获和管理。知识管理流程在服务生命周期中是如何工作的？\n    1. 知识管理仅关注在新或变更服务实施时的知识传递。\n   \
  \ 2. 知识管理用于持续服务改进和服务运营的整个生命周期阶段，以确保改进得到有效的管理。\n    3. 知识管理仅用于生命周期的服务运营阶段，以确保高效地管理运营问题。\n\
  \    4. 知识管理贯穿整个服务生命周期，确保交付适当的知识以做出明智决策。\n\n9. 知识管理包含许多不同的角色。以下哪哪个是知识管理从业者的替代名称？\n\
  \    1. 信息知识分析师\n    2. 知识管理员\n    3. 资产管理员\n    4. 资产分析师\n\n10. 以下哪一个是知识管理流程所有者的职责？\n\
  \    1. 创建跨组织的数据、信息和知识捕获与维护架构\n    2. 更新知识记录\n    3. 创建已知错误记录\n    4. 维护已知错误数据库\n\
  \n# 第 15 章\n\n发布、控制和验证的考虑考虑与实施考量\n\n**本章讨论了以下 ITIL 中级能力考试目标：**\n\n* `![images](img/00005.jpeg)`\
  \ 集成 ITSM 技术的通用要求\n* `![images](img/00005.jpeg)` 用于流程实施的服务管理工具的评估标准\n* `![images](img/00005.jpeg)`\
  \ 用于流程实施的 `RCV` 实践，包括运营、服务运营和项目管理中的变更以及服务运营中的风险评估和管理\n* `![images](img/00005.jpeg)`\
  \ 服务设计和过渡中的运营人员\n\n\n\n\n\n*   ![images](img/00005.jpeg) 与实施服务过渡实践和流程相关的挑战、关键成功因素和风险\n\
  *   ![images](img/00005.jpeg) 如何计划和实施服务管理技术\n*   ![images](img/00005.jpeg) 实现知识管理、协作和配置管理工具的技术考量\n\
  \n![](img/00006.jpeg) 为了满足学习成果和考试难度水平，你必须确保自己能够理解、描述、识别、演示、应用、区分、制作、决定或分析本章中描述的概念。\n\
  \n## 集成 ITSM 技术的通用需求\n\n我们将首先考虑 IT 服务管理工具的通用需求。在本节中，我们将查看其中的几项需求，我们预计任何优秀的集成工具套件都应该提供这些需求。\n\
  \n前两项需求是自服务功能和工作流引擎。\n\n你应该能记得第三章“事件管理、请求履行和访问管理”中关于请求履行过程的讨论，自服务功能可以用于自动化该过程的某些方面。这可能仅限于请求的记录，也可以允许在整个生命周期内对其进行跟踪和更新。该功能也可用于事件管理过程。提供自服务设施的一个主要优势是，可以随时记录请求和事件，而且此过程不依赖于服务台人员必须在场接听电话。这有助于服务台处理大量电话，因为那些不紧急的电话可以通过自服务、自助记录站点进行处理。自服务请求工具可以协助重置密码，例如，要求用户在重置发生之前通过回答预设的问题来验证其身份。此外，自服务请求工具还可以下载已批准的请求软件版本。\n\
  \n下一项通用需求是一个工作流或过程引擎，它可以自动化过程的步骤（分配、升级等等）。它还可以在先决步骤完成后发布工作单。\n\n第三项通用需求是集成的配置管理系统（`CMS`）。服务管理工具应与\
  \ `CMS` 集成，以便对组织的配置项（`CI`）信息进行查询并根据情况将其与事件、问题、已知错误和变更记录关联。\n\n另一个通用需求是工具能够协助发现、部署和许可；这些对于验证\
  \ `CMS` 的准确性非常有帮助，特别是在许可证使用方面。如果可以提取并报告自上次审计以来的变更，也将非常有帮助。相同的技术通常可以用于将新软件部署到目标位置；这对于确保补丁和升级分给正确的用户至关重要。部署技术可以与自服务功能结合使用，以自动化软件请求服务的履行。\n\
  \n另一个通用需求是远程控制。这允许服务台分析师（在适当的安全条件下）控制用户的桌面以进行调查和纠正设置。某些工具将存储诊断脚本和其他诊断程序，以协助对事件进行早期诊断。\n\
  \n良好的报告是任何 ITSM 工具套件的要求。工具持有了关于日常运作的海量信息。这些数据对于提前规划和跟踪趋势很有帮助，但此类报告必须有用，就必须具有灵活性。标准报告和临时报告都应该易于获取。\n\
  \n另一个需要考虑的通用需求是仪表板功能。仪表板对于日常运营以及 IT 和业务管理都是的，可以清晰地了解实时性能。\n\n为了实现更好的业务对齐，业务应用程序和工具需要与\
  \ ITSM 支持工具接口以提供所需的功能。集成的示例包括事件管理工具识别信用卡上的异常支出模式。\n\n软件即服务（`SaaS`）技术提供了通过互联网进行托管服务管理的能力。这带来的优势包括较低的资本和启动成本、更快的实施速度以及内置的服务连续性。\n\
  \n然而，这也意味着有限的定制化和功能更改、访问受限于供应商的服务时间，以及可能变得具有限制性或昂贵的许可方案。数据存储大小也可能存在限制，并且可能的安全和访问管理限制或风险。最后，与其他服务管理工具的集成可能是困难甚至是不可能的。\n\
  \n## 服务管理工具的评估标准\n\n每个组织都应该仔细审查其需求，以便根据需求获取最合适的工具套件。服务管理工具的典型评估考量包括：\n\n*   数据结构、数据处理和集成\n\
  *   现在和未来集成多供应商基础设施组件的能力\n*   符合开放标准\n*   灵活性\n*   易用性\n*   监控针对服务水平目标达成情况的能力\n\
  *   客户端-服务器方法\n*   从之前的工具中导入数据的难易程度\n*   数据备份能力和安全方面\n*   提供的供应商支持水平\n*   可扩展性\n\
  \n有许多服务管理工具，每种工具都有自己的优缺点，这使得选择正确的工具变得困难。为了克服这个问题，需要定义客观的筛选标准。\n\n一种简单的方法是 MoSCoW\
  \ 分析。这涉及创建一个所有需求的详细列表，并将每项归类为必须具备（must have）、应该具备（should have）、可以具备（could have）或未来希望具备（would\
  \ like in the future）：\n\n*   `Must have` 需求是强制性的。任何不满足 `all` 这些需求的工具都被拒绝。\n*  \
  \ `Should have` 需求是预期的，但并非必不可少。\n*   `Could have` 需求是有用的，但不是极其重要。\n*   `Would like\
  \ in the future` 需求是目前不需要但将来会需要的。例如，一个事件管理工具的选择标准可能还会规定该工具应具有问题管理能力以备日后使用。\n\n基于此分析的评分系统可以对备方案进行排名。\n\
  \n## 服务运营中变更管理的发布、控制和验证实践\n\n接下来，我们考虑 IT 服务提供商如何管理服务运营中的变更。我们首先考虑运营中变更管理的挑战。生命周期运营阶段的重点是保护运行服务，因此服务运营中的变更必须在不影响稳定的情况下吸收。我们将检查导致运行环境变更的各种触发因素，并考虑实施前如何评估变更。最后，我们将观察如何衡量变更以判断其是否成功。\n\
  \n### 变更触发因素\n\n许多事件可以触发服务运营环境的变更。操作系统和实用程序的系统软件变更或升级也需要谨慎处理。某些变更触发因素是外部的，例如源于法律、需要符合外部标准或新的治理规则的结果。例如，关于交易记录需要保存更长时间的法律变更将影响归档和存储需求。\n\
  \n变更的触发因素包括：\n\n\n\n\n\n*   安装或升级硬件、网络组件或应用软件的需求。\n*   软件的定期更新，包括补丁和错误修复。这些更改需要经过仔细管理，因为如果实施不当，它们可能会对环境产生严重影响。\n\
  *   过时硬件或软件的更换。这些项目可能仍在正常运行，但不再受供应商的支持，并且可能与其他组件的未来版本不兼容，因此需要更换。对于任何服务管理工具也是如此，无论是升级还是更换。\n\
  *   由业务驱动的变更，这些变更可能需要 IT 来支持新的业务倡议，例如通过电子商务网站提供“预留和自提”设施。\n*   由于流程和程序的持续服务改进而导致的变更，这些变更需要在不产生任何不利后果的情况下实施。\n\
  *   人员变动可能会产生破坏性，需要确保必要的知识传递发生，以确保所提供的服务不受影响。\n*   对约定服务水平的要求或采购模式的变更（外包服务提供、更换外包商或将此前外包的服务内部化）将需要进行计划，以确保其顺利实施。\n\
  \n发布、控制和验证负责计划这些变更；服务运营必须准备好吸收这些变更，而不会中断所提供的服务。\n\n### 变更评估\n所有变更对运营都具有潜在影响。非运营人员并不总是理解这一点，因此服务运营人员必须有机会评估所有变更。仅仅在\
  \ `CAB` 阶段让运营人员参与是不够的，因为那时可能太晚了；关于新服务或变更服务的设计的根本性决定早在之前就已经做出了。认为在如此晚的阶段进行重新设计是不切实际的。为了防止这一点，务必在初始设计阶段就更早地咨询并通知运营人员，并在过程中保持参与。\n\
  \n变更经理告知所有受影响方正在评估的变更是一项良好的做法，这样受影响的区域（在这种情况下为服务运营区域）就可以准备应对措施，显示变更对运营的影响并列出任何担忧。这可以在\
  \ `CAB` 会议之前分发以供讨论参考。\n\n服务运营人员需要全程参与具有运营影响的变更的设计和实施。早期参与是必要的，以确保设计考虑了运营问题和需求；在后期阶段参与是必要的，以确保安排变更的时间以避免潜在的分歧或特别敏感的时期。\n\
  \n### 成功的变更衡量\n对服务运营所做的成功变更的最终衡量标准是没有出现意外的波动或中断；唯一可见的效应是由变更带来的利益，例如功能的增强、质量的提高或财务节省。\n\
  \n## 服务运营与项目管理\n在生命周期的其他阶段，使用项目管理过程来管理变更是很常见的，但通常不愿将这些过程用于运营变更。服务运营通常被视为“业务常态化”，不包含项目方法。事实上，项目管理过程对于重大的基础设施升级或新程序/变更程序的部署既是适当又有帮助的；这些重大任务将受益于项目管理所提供的对成本和资源更改进的控制和管理。使用项目管理来管理此类活动将带来许多益处：\n\
  \n*   对项目将交付的利益有清晰、一致的陈述。\n*   任务及其管理的可见性更高，使其他 IT 小组和业务部门理解运营团队的贡献。这有助于为传统上难以在成本上证明合理的项目获得资金。\n\
  *   交付物的一致性更高，质量得到提高。\n*   目标的实现，使运营小组获得信誉。\n\n## 服务过渡挑战\n服务过渡的挑战源于提供的复杂性，因为组织现在处理各种类型的客户、用户、程序、项目、供应商和合作伙伴。这为管理大型利益相关者群体带来了挑战，因为过渡影响着每个人。与客户、供应商、用户和项目的关系通常是复杂的，在过渡到运营阶段时需要进行管理。\n\
  \n确保过渡流程能够与其他业务流程（例如财务、人力资源和采购）集成也是一项挑战。可能还存在对遗留系统的依赖关系了解不足，导致影响分析变得困难，这可能对新系统和服务的引入产生重大影响。\n\
  \n一个主要挑战是解决维护稳定的运行环境与响应业务对不断变化的服务的需求之间的平衡问题，以及在务实主义与官僚主义之间取得平衡。过渡非常适合支持这一点，这也是为什么这一生命周期阶段如此重要，且不能被忽视或缩短的理由之一。\n\
  \n许多挑战与文化变革有关，例如，营造一个能够促进标准化、简化和知识共享的环境。服务过渡必须说服业务部门，使其成为业务变更的推动者，因此是业务变更计划中不可或缺的组成部分。如果寻找“流程倡导者”的挑战，情况就会变得更容易。这可以创造一种鼓励人们协作和有效工作的文化。\n\
  \n在所有项目和供应商之间开发标准的性能衡量标准，并确保交付和支持的质量与业务对新技术的使用相匹配，对所有组织来说都是一项重大挑战。有效利用服务过渡过程需要保护服务过渡时间和预算不受服务生命周期中早期事件的影响。\n\
  \n风险管理是几个挑战的源头，包括理解不同利益相关者对风险的观点。这反映了管理具有不同结构的组织的复杂性。在过渡期间，在管理风险和承担风险之间实现最佳平衡，并就风险管理和公司治理提供有效的报告。\n\
  \n某些组织将受到 `Sarbanes-Oxley`、`ISO/IEC 20000`、`ISO/IEC 38500` 和 `COBIT`（如果适用）的要求和报告驱动。这些标准和治理要求既支持也为服务过渡作为一个生命周期阶段的成功带来了挑战。\n\
  \n## 关键成功因素\n在所有组织中，服务提供与当前和快速变化的业务需求相匹配。目标是持续且高效地提高服务质量，同时确保其符合业务需求。为了实现这一目标，服务过渡需要考虑某些关键成功因素。\n\
  \n\n\n\n理解并管理支持组织内有效风险管理的不同利益相关者的观点是必要的。建立并维持利益相关者的参与意和承诺，并与计划和项目管理建立清晰定义的关系和接口，对于过渡的成功至关重要。同样重要的是，在服务过渡期间维持这些联系并管理所有关系。\n\
  \n另一个关键成功因素是将服务过渡与服务生命周期的其他阶段，以及影响服务过渡的流程和学科相结合。确保清楚地理解旧系统、新技术和人员要素之间的依赖关系，以及改变这些领域任何一个方面所涉及的风险非常重要。新旧系统之间的依赖关系往往被忽视，但可能对新服务的引入产生重大影响。\n\
  \n以下是成功服务过渡所需的其他一些关键成功因素：\n\n*   自动化流程以消除错误\n*   知识管理\n*   开发高质量系统、工具、流程和程序\n* \
  \  利用文化和政治环境\n*   理解技术配置和依赖关系\n*   理解服务过渡所需的流程、程序、技能和能力\n*   拥有具备必要知识和技能、适当培训和正确服务文化的员工\n\
  *   确保清晰的问责、角色和职责\n*   鼓励知识共享文化\n\n对于服务过渡而言，在过渡期间和之后交付变更时，时间、成本和质量预测的波动要尽可能小。这应该确保提高客户和用户满意度，这对于持续取得成功的过渡至关重要。\n\
  \n如果不能证明建立和改进服务过渡实践与流程的收益大于成本，那么将对过渡的信誉产生重大影响。这应该通过组织在服务过渡活动期间对风险态度的有效沟通，以及通过对影响或可能影响服务组合服务成功过渡的风险建立深入理解来支持。\n\
  \n## 服务运营中的风险评估与管理\n\n服务运营的首要考虑量是维护稳定性；任何对这种稳定性的威胁都必须尽快评估并采取行动。服务运营需要进行风险和影响评估的一个明显例子是潜在变更对稳定性构成的风险。服务运营人员必须评估变化的可能影响，并将此评估结果与\
  \ `CAB` 分享。\n\n### 变更引起的风险\n\n尽管存在已知错误（这些错误在测试期间变得显现，但未被认为严重到足以延迟变更），变更仍可能实施。此类已知错误的存在对运行稳定性构成了风险；在错误解决之前，由其引起的事件可能会再次发生。必须评估这些事件的影响以及每个事件适当变通方案的有效性（包括克服故障的速度）。此评估的结果将用于问题的排序以及实施变更的紧迫性。\n\
  \n### 其他风险来源\n\n还有其他需要进行风险评估的运行稳定性风险。首先是环境风险。环境风险将包括作为 IT 服务连续性规划的一部分而进行评估的风险，如火灾和洪水。可能还存在政治、商业风险以及与劳动关系相关的风险。这些的例子包括：进行动物实验的药公司面临的风险（因此可能受到反对此类做法的人的破坏），影响运营的罢工风险，甚至包括竞争对手参与价格战的风险，这将导致收入减少。\n\
  \n供应商也可能构成风险的源。他们未能交付可能会影响整体服务的交付。他们提供服务的能力也可能受到其内部风险的影响。如果他们是某项特定要素的唯一供应商，这尤其是一个问题。承担新供应商也涉及一些风险；由于没有可靠交付的已知记录，就存在其服务可能不满意的风险。另一个主要风险领域涉及安全；安全相关的事件或事件可能导致理论或实际的风险。最后，每个需要支持的新客户或服务既是成功的机会，也是失败的潜在风险。\n\
  \n实施过渡服务的新流程可能会产生干扰，在没有识别到当前正在过渡的服务和计划中的发布可能面临潜在风险的情况下，不应实施。对当前过渡和计划项目进行基线评估将帮助服务过渡识别实施风险。\n\
  \n过渡的风险来源是可能无法理解利益相关者对风险的不同观点。这反映了管理具有不同结构的组织的复杂性。在过渡期间，在管理风险和承担风险之间实现最佳平衡，并就风险管理和公司治理提供有效的报告很重要。\n\
  \n特定风险包括相关人员对新流程可能导致的问责和职责变更的反应；如果他们认为自己的角色被削弱，可能会导致员工士气低，关键支持和运营人员对变更产生怨恨和敌意。这可能导致由于感知官僚主义而对变更产生抵抗并规避流程。另一个实施风险是由于过度规避风险给业务带来过高的成本。\n\
  \n不受控制的知识共享（允许人们访问他们不应获得的信息）是另一种实施风险。系统和工具的成熟度和集成不足可能导致人们将其他缺陷“归咎”于技术。流程之间可能整合不当，导致交付\
  \ IT 服务管理 (`ITSM`) 时采用孤岛式方法，流程之间没有集成。最后，生产性小时的损失构成了一种风险，正如成本增加、收入损失以及由于服务过渡流程不佳可能导致业务失败一样。\n\
  \n## 设计与过渡中的运营人员\n\n所有 IT 组都将参与服务设计和服务过渡，以确保新组件或服务的的设计、测试和实施能够提供正确水平的功能、易用性、可用性和容量。此外，服务运营人员必须参与服务设计和服务过渡的早期阶段，以确保当新服务到达现场环境时，从服务运营的角度来看是符合用途的并在未来是“可支持的”。\n\
  \n在这种背景下，`supportable` 意味着它们不会对其他服务、流程、进度或运行工作实践产生负面影响。它们还能够由现有员工在理解的成本下操作。支持结构（包括内部支持团队和第三方供应商提供的支持）必须清晰且易于理解。服务上线后不应有意外成本，合同义务必须清晰明了。\n\
  \n\n\n\n请注意，变革不仅涉及技术，还需要考虑组织层面的。有关组织变革的更多细节包含在《ITIL 服务过渡》（Service Transition）出版书中，但通过提高意识和培训，降低人员抵触变革的风险。\n\
  \n## 规划与实施服务管理技术\n\n良好的服务管理工具对于实施基于 ITIL 框架的流程非常有帮助。许多组织实施新工具来协助其实施新的或改进流程。如果新工具要有效且合适，这些组织需要考虑许多因素。\n\
  \n### 许可\n\n首先要考虑的因素是许可类型。通常有多种选择，成本各异。当工具按模块授权许可时，则需要仔细计划，以确保获得正确的访问权限，以便人员开展工作，而无需购买不必要的模块。以下是一些可能的选项：\n\
  \n-   **专用许可 (Dedicated Licenses)**：对于此选项，每个具名人员都有自己的许可。专用许可适用于需要频繁且长时间使用特定模块的员工。例如，服务台员工可能需要专用许可来使用事件管理模块。\n\
  - ****共享许可 (Shared Licenses)**：这些许可可以在个人之间共享；但是，存在员工可能因为许可证在使用中而无法访问工具。共享许可适用于不需要持续访问的常规用户，例如二线支持人员。需要仔细计算以确定用户与许可之间的正确比例。这些许可比专用许可贵，但需要的数量较少。\n\
  - **Web 许可 (Web Licenses)**：这些允许通过网络浏览器访问。Web 许可通常适用于需要远程访问或偶尔访问的员工。它们的费用通常比其他许可便宜（甚至可能随其他许可免费提供）。\n\
  - **按需付费 (On Demand)**：在需要时（按需）提供对工具的访问，供应商根据使用应用程序的时间收取费用。这对于较小的组织，或者相关工具非常专业且使用频率较低的情况来说可能具有吸引力。其变体是作为咨询任务的一部分使用专业工具（例如，专业的容量管理工具）；在这些情况下，许可费可能包含在咨询费中。\n\
  - **代理/活动 (Agent/Activity)**：另一种许可方法是按代理/活动基础进行许可和收费的软件。这方面的例子是模拟软件（例如，可以模拟客户在网站上的路径的代理软件，以评估并报告性能和可用性）。\n\
  \n在所有情况下，都必须进行充分调查，以确保成本得到理解并达成一致，并确保组织在拥有足够许可方面符合法律规定。\n\n### 部署\n\n许多 ITSM 工具，特别是发现和事件监控工具，在使用之前需要向所有目标位置部署某些客户端/代理软件。这需要仔细的规划和执行，并应通过正式的发布和部署管理来处理。这里列了一些部署考虑：\n\
  \n-   应该进行仔细的调度和测试，并对部署进行跟踪，以便明确哪些 CI（配置项）已拥有软件，哪些尚未接收。\n-   `CMS` 应随着部署的进行而更新。\n\
  -   通常需要重启设备以识别客户端软件；这需要提前安排以尽地减少服务中断。\n-   对于便携设备可能需要特殊安排，这些设备在部署期间可能不在现场。\n- \
  \  必须提前检查接收软件的设备，以确保它们有足够的存储和处理能力来托管和运行新软件。\n-   需要检查网络容量，以确保其能够传输所有所需的内容。\n-  \
  \ 只有当其支持的流程成熟时才应部署工具。过早部署的工具将转型重心从改变人们的工作方式转向仅仅是工具的实施。\n-   如果要实现收益，部署前对工具进行培训是必要的。\n\
  \n记住，通常一个工具不足以让事情运行得更好。然而，如果它支持流程且用户已接受过培训，一个良好的工具可以帮助员工执行新流程。部署的进一步考虑方面还包括：\n\n\
  -   **所使用的引入类型**：必须决定采用“大爆炸式（Big Bang）”引入还是某种分阶段的方法。由于大多数组织在引入期间需要保持现有服务的运行，因此分阶段的方法可能更有必要。\n\
  -   **工具之间的过渡**：如果正在替换旧工具，必须考虑旧工具和新工具之间过渡的良好方法。例如，服务台不应将新工具上的事件分配给尚未从旧工具完成过渡的团队。\n\
  -   **数据迁移**：需要就哪些数据需要从旧工具迁移到新工具做出决定。这可能需要重新格式化，因此在迁移后可能需要进行验证，特别是当数据通过电子传输时。相反，可以实施并行运行，在初始阶段旧工具以只读模式与新工具并可用，以便在需要时可以引用历史数据。\n\
  \n有关发布和部署管理过程的完整细节可见第 14 章“发布与部署管理与知识管理”。\n\n## 实施知识管理、协作和 CMS 的技术考虑\n\n技术在服务过渡中起着重要作用，正如它在整个生命周期中一样。有很多特定的工具支持服务过渡的各个方面。在这里我们检查技术在支持以下方面的使用：\n\
  \n-   知识管理\n-   协作\n-   配置管理系统\n\n### 知识管理工具\n\n支持知识管理过程的工具包括支持文档管理、记录管理和内容管理的工具。\n\
  \n这些工具协作使用提供了服务知识管理系统（`SKMS`）的结构和功能。组织可以使用提供 `SKMS` 的单一服务管理工具，但这样做会限制该理念的能力。相反，成功应该建立在整合许多来源的能力之上，为所有形式知识的捕和管理提供完整的方法。\n\
  \n#### 文档管理\n\n文档管理定义文档和信息存储、保护、分类、搜索、检索、维护、存档和退休的能力。\n\n#### 记录管理\n\n记录管理定义记录存储、保护、分类、搜索、检索、维护、存档和退休的能力。\n\
  \n#### 内容管理\n\n内容管理提供了系统或网站文档和信息存储、维护和检索的能力。结果通常是以书文字、数字、图表和其他知识呈现形式表示的知识资产。\n\n\
  \n\n\n直接支持内容管理的知识服务示例包括网络发布工具、网络会议、维基和博客。其他示例还包括文字处理、数据和财务分析、演示工具、流程图绘制以及内容管理系统（编码、组织、版本控制、文档架构）。当然，还有出版和分发工具，它们支持知识传播的管理。\n\
  \n### 协作\n\n协作是共享隐性知识并共同努力完成既定目标和任务的过程。这种方法得到了共享日历、任务以及电子邮件中线程式讨论的支持。组织现在发现，使用即时消息（结合电子白板和视频）或电话会议已成为协作方法的关键部分。这些工具的引入支持了更具流动性的劳动力。它还实现了远程办公，并在支持国际或全球性组织方面具有价值。\n\
  \n成功的转型取决于组织对信息和知识拥有一种协作方法。如果没有这种方法，实现转型过程中许多方面的的必要整合将变得困难得多。\n\n### 社区\n\n现在，跨越时区和国界的人群利用社区进行通信、协作和知识共享已变得越来越普遍。这些社区通常通过内网或外网等在线媒介进行促进，且社区可以作为为其成员提供的所有知识服务的集成点。\n\
  \n支持这种协作方法所需的工具包括社区门户、焦点小组、在线活动以及网络展示。其他技术还包括电子邮件别名管理。在知识产权、最佳实践、工作示例和模板库方面需要保持谨慎，特别是当社区将第三方组织作为支持结构的一部分时。尽管如此，必须记住社区是多样化支持模型中知识共享的至关重要的部分。\n\
  \n在协作社区中鼓励共享往往很困难。为了打破“知识就是力量”的传统观念，可以使用针对信息信息的鼓励和奖励计划。\n\n### 工作流管理\n\n工作流管理是知识服务的另一个广阔领域。它通过预定义的工作流或过程为管理知识资产提供系统性支持。工作流应用程序提供了实施高效流程以完成特定类型任务的基础设施和支持。现在的许多知识资产都会通过工作流过程，该过程负责创建、修改、增强、告知或批准资产的各个方面。\n\
  \n此类类别内提供的典型工作流服务包括工作流设计、对象路由、事件服务、授权检查点的关口控制以及状态转换服务。\n\n服务管理工具包括可以配置以支持这些需求的工作流能力，而这将取决于具体的组织需求。\n\
  \n### 配置管理\n\n许多组织运行着某种形式的配置管理，但通常维护在单独的文件、电子表格甚至纸质上。虽然这种方法在小范围内可能是可以的，但对于大型复杂的基础设施，由能够维护配置管理系统（`CMS`）的软件工具支持，配置管理将运行得更有效。\n\
  \n在具有多个数据源的集成系统中，理想情况下这些源应该是连接的。这包括此类定义媒体库（`DML`），且 `CMDB` 与 `DML` 之间的连接应该记录在 `CMS`\
  \ 中。\n\n`CMS` 应防止在没有通过变更管理获得有效授权的情况下对 IT 基础设施或服务配置基准进行更改。只要可能，授权记录应自动驱动变更。重要的是，尽可能所有的更改都至少在变更实施时记录在\
  \ `CMS` 中。如果可能，受变更影响的每个 `CI` 的状态（例如：上线、归档等）应自动更新。如果集成工作是有益的，则此类活动和信息的采集应与主服务管理系统或配置管理系统集成。花费精力和集成系统以实现自动更新是很有吸引力的，但始终应仔细考虑任何工具定制的成本。此外，当集成设置中的系统需要升级时，其未来会发生什么也是一个考虑因素。集成应该始终从成本和精力上合理的，这可以通过使用服务生命周期方法进行管理。例如，应该回答这些问题：它是否对组织有利并支持战略？设计是否经过成本核算和范围界定以满足需求？能否成功转换？在运行中是否会有益且有效？它是否会支持持续的改进和升级？\n\
  \n### CMS 设计\n\n在设计配置管理系统时，考虑组织所需的功能很重要，例如基于开放标准或已知的接口和协议集成多个数据源的能力。需要足够的安全控制来根据“按需知”原则限制访问，并支持不同复杂性的\
  \ `CIs`——例如整个系统、发布版本、单个硬件项目或软件模块。\n\n`CMS` 的核心是 `CI` 之间的关系，在添加或删除 `CI` 时应该是简单的，同时自动维护项目的关系和历史。工具内部对于版本控制、数据验证和关系管理的自动化程度，系统就越有效。易用性对于鼓励准确更新记录以及配置基准的管理和使用至关重要。如果系统不能让操作员轻松进行更改和录入，他们就不可能保持信息更新。使用发现工具和其他自动填充信息的办法可能非常有用。某些软件系统将此作为一项功能；而其他则需要与不同的工具集成。该功能在管理软件\
  \ `CIs` 和用于补丁的版本控制时特别有用。\n\n可能存在无法通过工具发现的 `CI`，在这种情况下需要手动上传和维护。有必要确保 `CMS` 支持与其他流程集成。随着更改的发生（无论是否可被发现），`CI`\
  \ 数据库必须准确更新，以保持数据对组织的实用性。故障管理和问题管理等过程依赖于这种准确性，用于 IT 资产规划和正确管理的保证过程（可用性、容量、安全性和连续性）也是如此。\n\
  \n`CMS` 设计的另一个极其重要的因素是输出数据。如何使用它、谁来使用以及如何采集和管理数据，都是输出数据的关键问题。因此，`CMS` 的报告功能非常重要。这应该包括所有形式的报告、图形输出、标准报告、层级映射以及支持影响分析的关系。\n\
  \n## 总结\n\n本章到此结束，在本章中回顾了 ITSM 技术的通用需求以及选择此类工具的评估标准；我们还研究了如何计划和实施这些技术。\n\n\n\n\n\
  我们考虑了流程实施中相关的发布、控制和验证实践，包括运营中的变更管理、服务运营与项目管理之间的联系，以及在服务运营中评估和管理风险的重要性。我们还研究了运营人员在服务设计和过渡中的作用，以及在实施服务过渡实践和流程时面临的挑战、关键成功因素和风险。\n\
  \n最后，我们审阅了实施适用于整个服务过渡过程和服务全生命周期的特定工具的技术考虑考量，包括知识管理工具、协作工具和配置管理系统。\n\n## 考试要点 (Exam\
  \ Essentials)\n\n- **理解在服务运营中管理变更的必要性，以便在服务及其用户产生最小负面影响的情况下实施变更。** 理解变更可能的触发因素，以及如何以及为什么要进行评估和衡量。\n\
  - **解释项目管理过程如何帮助实施服务运营中的变更。** 理解使用项目管理过程实施服务运营变更的益处以及可能受到抵制的原因。\n- **了解变更对运营稳定性带来的风险。**\
  \ 理解如何管理这些风险。\n- **理解为什么服务运营人员需要参与设计和过渡阶段。** 特别是要理解“服务可支持”的概念意味着什么，以及实现这一目标需要什么条件。\n\
  - **理解实施新服务管理工具时可用的许可选项。** 能够描述不同的选项并给出每个选项适用场景的示例。\n- **理解实施新服务管理工具时可用的部署选项。**\
  \ 能够描述不同的选项并给出每个选项适用场景的示例。\n- **理解技术在发布、控制和验证中的重要性。** 技术在整个生命周期都很重要，特别是在新服务中引入新想法或概念时。\n\
  - **能够解释并描述技术在发布、控制和验证中的用途。** 这不仅对于服务提供者很重要，对于客户、用户以及业务的所有方面也同样。\n- **理解特定工具集在服务过渡过程和整个生命周期中的重要性。**\
  \ 意识到过渡工具的使用以及它们如何在整个服务生命周期中被是非常重要的——例如，其他流程如何使用`configuration management system`。\n\
  - **能够解释并描述与服务过渡相关的工具的使用。** 这些是用于测试或软件分发的工具。了解它们如何与发布和部署管理等服务过渡过程相关。\n\n## 复习题 (Review\
