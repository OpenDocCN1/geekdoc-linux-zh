  \    * 活动\n    * 组织\n\n![](img/00006.jpeg) 本章将继续探索 IT 服务提供商如何组织以按照要求的标准交付服务。服务运营阶段是实际交付服务的阶段，通常其所需的时间比之前的策略、设计和过渡阶段要长得多。我们将涵盖技术管理、应用管理和\
  \ IT 运营管理剩余职的目的、目标和范围，以及它们为业务提供的价值。\n\n当应用于 IT 环境时，运营管理涵盖了业务中日常维护和优化 IT 服务的方面。在较小的组织中，这种如此详细的划分概念可能看起来令人困惑；可能只是因为支持基础设施的所有人员都参与了运营管理和技术管理功能。记住，这些是职能，而不是特定的组织结构。\n\
  \n## ITIL 职能\n\nITIL 描述了四个负责执行所有生命周期过程的主要职能。这些是技术管理、应用管理、IT 运营管理和服务服务台。我们已经回顾了服务台（参见第\
  \ 4 章“服务台”），现在我们将转向剩余的职能。IT 运营管理职能进一步分为 IT 运营控制和设施管理。我们将依次涵盖其中的每一项，然后查看每个职能职责重叠的地方。需要记住，ITIL\
  \ 不是规定性的，它没有规定特定的组织结构或组织内团队的具体名称。这里描述的职能职责应当被履行，但每个组织都将有自己的结构。\n\n## 技术管理\n\n无论在任何特定组织中给团队或团队称为什么名称（基础设施支持、技术支持、网络管理等），ITIL\
  \ 框架中被称为 `technical management` 的职能都需要管理和开发 IT 基础设施。该职能涵盖了共同拥有技术专长和知识的组或团队，确保基础设施能够有效工作，以支持业务所需的服务。\n\
  \n### 角色\n\n技术管理职能有许多职责：\n\n* 它负责管理 IT 基础设施。这包括确保执行此职能的人员具有必要的技术知识，以设计、测试、管理和改进\
  \ IT 服务。\n* 尽管我们在服务运营下讨论这一职能，但该职能提供具备相应技能的人员来支持整个生命周期。技术管理人员将参与制定技术策略，并确保基础设施能够支持整体服务策略。技术管理人员还负责新服务或变更服务的技术设计，并参与其向运营环境过渡的规划和实施。\n\
  * 一旦服务上线，技术管理将提供技术支持，解决事件、调查问题、响应告警，并规定服务高效运行所需的任何更改或更新。技术管理人员将识别服务改进，并与 `CSI` 经理协作，设计、测试并实施这些改进。\n\
  \n该职能的经理或经理们负责确保有正确数量的人员具备正确的技能来完成所需的任务。所需的人数和技能水平在生命周期阶段的策略中进行讨论，并在服务设计生命周期阶段中详细说明。过渡测试测试人员是否能够按照设计支持服务，`CSI`\
  \ 则负责识别任何改进或培训需求。技术经理必须决定聘用具有正确技能的新员工、培训现有员工，或使用短期合同资源来满足特定需求。较大的组织可能有一个主题领域专家团队，当子部门需要时可以寻求他们的帮助，而不需要在整个组织范围内开发这些技能。\n\
  \n大多数的日常运营支持活动将由运营支持人员承担，但作为技术专家，指导和支持运营人员是技术管理职能的职责。\n\n### 目标\n\n技术管理的目标如下：\n\n\
  * 提供适当的技术基础设施以支持业务流程。这应该考虑到可用性和容量需求，以可负担的成本提供稳定且具韧性的基础设施。\n* 规划和设计任何新服务或变更服务的技术方面。\n\
  * 在现环境中实施这些技术方面并提供支持，利用该职能拥有的技术专长，确保任何出现的问题都能迅速解决。\n\n### 通用技术管理活动\n\n技术管理涉及两类型的活动。这包括对整个技术管理职能通用的通用活动。另一类活动与所有三个职能（技术、应用和\
  \ IT 运营管理）共同执行的流程相关。\n\n在本节中，我们将探索使技术管理能够执行其角色的活动。\n\n技术管理负责识别管理和运行 IT 基础设施以及交付\
  \ IT 服务所需的知识和专长。这一过程始于服务策略阶段，在服务设计中详细扩展，并在服务过渡和服务运营中执行。对这些技能的持续评估和更新在 `CSI` 进行。通过这种方式，技术管理贯穿整个服务生命周期。\n\
  \n该职能还负责记录服务提供商组织中存在的技能以及需要开发的技能。这包括技能清单的开发和技术培训需求分析的实施。随后，将由技术管理启动培训计划，以开发和完善相应技术人员的技能，并维护所有技术人员的培训记录。\n\
  \n技术管理职能应具备适当的技能，为用户、服务台和其他小组设计并提供培训。尽管培训需求必须在服务设计中定义，但它们在服务运营中执行。如果没有交付培训的能力，技术管理将负责识别能够提供此类培训的组织。\n\
  \n\n\n\n\n技术管理负责管理无法在内部开发的技能——例如，通过招聘或外包资源。当没有足够的人员执行所需的技术管理活动时，他们还负责获取额外的技能。\n\n\
  当内部或公开市场上无法获得所需技能，或者聘请专家更具成本效益时，该职能还将参与为特定活动采购技能。\n\n### 服务策略与设计阶段\n\n在服务策略和设计阶段，技术管理将定义用于新架构架构设计的标准，并参与技术架构的定义。作为技术专长知识的存储库，该职能还负责开发可以帮助扩展服务组合的解决方案，或用于简化或自动化\
  \ IT 运营、降低成本或提高 IT 服务水平。\n\n技术管理的额外活动包括参与新服务的设计和构建。技术管理将为 IT 服务的技术架构和性能标准的设计做出贡献。此外，它还负责指定持续管理\
  \ IT 基础设施所需的运营活动。\n\n### 项目与能力管理\n\n技术管理将参与项目，不仅是在服务设计和服务过渡期间，还存在于 CSI（持续服务改进）或运营类项目，例如操作系统的升级、服务器整合项目和物理迁移。\n\
  \n建模和工作负载预测通常由技术管理资源完成，以确保 IT 服务的可用性和能力管理满足业务所需的服务水平。这还需要评估风险、识别关键服务和系统依赖关系，并定义及实施应对措施。\n\
  \n### 服务过渡与供应商管理\n\n技术管理活动应包括对 IT 服务的的功能、性能和可用性进行设计和测试，以支持服务过渡活动。该职能还可能参与供应商管理；许多技术管理部门或小组是唯一准确了解供应商具体要求以及如何衡量和管理他们的人。因此，许多组织依赖技术管理部门来管理与特定\
  \ `CIs` 供应商的合同。如果是如此，确保这些关系作为 `SLM`（服务水平管理）和供应商管理流程的一部分就非常重要。\n\n### 运营流程\n\n显而易见，作为一个具有服务运营职责的职能，技术管理在运营过程中发挥着重要作用。例如，它将领导定义和管理事件管理标准及工具。技术管理应在服务过渡期间测试事件机制，并在服务运营期间监控并响应许多类别的事件。\n\
  \n技术管理部门或小组对于事件管理的执行是至关重要的。他们通过功能性升级接收事件，并提供二级及更高级别的支持。他们还参与维护分类，并定义在事件管理中执行的升级程序。他们可以提供脚本以确保捕获正确的事件细节，并提供规避方案（workarounds）以协助服务台台进行一线解决。\n\
  \n技术管理作为一个职能，为问题管理流程的执行提供资源。它提供用于诊断和解决问题的技术专长和知识。它还与供应商及其支持团队维护关系，用于升级和跟进技术问题、变更、事件和问题。它们在定义用于事件和问题管理的编码系统（例如事件分类）以及通过通过验证和维护已知错误数据库（KEDB）来支持问题管理方面发挥着重要作用。\n\
  \n### 变更与发布管理\n\n但正如你所看到的，不仅是运营流程能从这一职能中获益；其他生命周期阶段（如服务过渡）也将受益。技术管理将支持变更管理过程，在该过程中，可能需要依赖技术知识和专长来评估变更，并协助发布部署。\n\
  \n### 配置管理与文档\n\n技术管理将与应用管理合作，为 `CMS`（配置管理系统）及其数据提供信息并对其进行运营维护。这样做是为了确保在服务部署和 `CIs`\
  \ 生命周期内的持续维护中，创建正确的 `CI` 属性和关系。\n\n技术管理参与 CSI 活动，识别改进机会，特别是在突出改进领域方面，然后帮助评估替代解决方案。\n\
  \n系统和运营文档需要维护、更新并妥善利用。这包括确保所有管理、管理和用户手册都是最新且完整的，并且技术人员熟悉其内容。这需要由具有足够技术专长的人完成，且资源通常通过技术管理提供。\n\
  \n技术管理还负责更新和维护用于报告技术能力和服务能力的数据（例如能力和性能管理、可用性管理、问题管理），并协助 IT 服务财务管理以识别管理 IT 服务所使用的技术和\
  \ IT 人力成本。\n\n许多技术管理部门、小组或团队定义了作为 IT 运营管理部分的运营活动，并作为组织 IT 运营管理功能的一部分执行运营活动。\n\n\
  ### 技术管理组织\n\n技术管理通常不由单一部门或小组提供。通常会发现一个或多个技术支持团队或部门为 IT 基础设施提供技术管理和支持。在除最小的组织外（可能需要一个单一联合团队或部门涵盖所有内容），对于每种使用的基础设施可能需要独立的团队或部门。\n\
  \n由于技术管理由许多技术领域组成——每个领域可能都需要特定的技能组来管理和操作——可能会有多个团队。某些技能集是相关的，可以由通用人才完成，而另一些则是针对特定组件、系统或平台的。\n\
  \n技术管理组织结构的原理是人员根据其技术技能集进行分组，而这些技能集是由需要管理的技术决定的。\n\n### 技术设计与技术维护与支持\n\n在 ITIL 框架中，技术管理团队包括专家技术架构师和设计师（主要参与服务设计阶段）以及专家级维护和支持人员（主要参与服务运营阶段）。\n\
  \n许多组织将他们视为两个独立的团队甚至部门。这种分离方法的挑战在于，良好的设计需要负责管理解决方案的人员提供输入，而良好的运营需要设计该解决方案的人员参与。换句话说，支持人员应该在解决方案的设计或架构阶段参与。\n\
  \n\n\n\n\n如果可能，建议采取措施支持技术职能方法，因此，设计师应对其部分导致运行停机的设计缺陷负责，而支持人员应应对其对技术架构的贡献负责。\n\n\
  ## 技术管理绩效指标的衡量\n\n技术管理的性能指标在很大程度上取决于所管理的是哪种技术，但下面列出了某些通用指标。\n\n### 同意输出的衡量\n\n可以衡量以下输出内容：\n\
  \n*   关键业务事务的事务率和可用性\n*   服务台台培训\n*   记录在 `KEDB` 中的问题解决方案\n*   用户对 `SLAs` 中定义的输出质量的衡量\n\
  \n### 流程指标\n\n技术管理团队执行许多可以被衡量的服务管理流程活动：\n\n*   对事件的响应时间和事件完成率\n*   二线和三线支持的事件解决时间\n\
  *   问题解决统计\n*   升级次数及升级原因\n*   实施和回滚的变更数量\n\n### 技术性能\n\n这些指标基于服务设计规范，通常包含在 `OLAs`\
  \ 或标准操作程序 (`SOPs`) 中。实际指标会随技术不同而异，但可能包括以下内容：\n\n*   利用率（服务器的内存或处理器，网络的分带宽）\n*  \
  \ 系统、网络、设备和其他资源的可用性\n*   所呈现的信息和数据的准确性\n*   性能（例如，响应时间或队列率）\n\n### 指定设备的平均故障间隔时间\n\
  \n此指标用于确保了良好的采购决策，并确保设备得到了适当维护（后者通过与维护计划进行比较）。\n\n### 维护活动的衡量\n\n以下指标提供了有关维护活动的信息：\n\
  \n*   按计划执行的维护\n*   超过维护窗口的次数\n*   实现的维护目标（数量和比例）。\n\n### 培训与技能开发\n\n这些指标确保技术人员拥有管理其所控技术的技能和培训：\n\
  \n*   达到的技能性能水平\n*   向第三方或其他内部领域专家寻求额外帮助和支持的电话及升级次数\n*   技术人员技能问题导致的事件百分比\n\n衡量领域包括同意输出和流程指标。衡量技术性能（包括特定设备的平均故障间隔时间）是重要的。理解维护活动的成功对于该功能同样重要。由于技术管理将负责培训，因此衡量培训和技能开发的有效性非常重要。\n\
  \n## 技术管理文档\n\n技术管理作为其他流程（例如容量规划、变更管理和问题管理）的一部分，涉及起草和维护若干文档。会有某些特定于技术管理小组或团队的文档，例如\
  \ `CIs` 的技术文档（例如技术手册和管理手册）。\n\n在设计生命周期阶段，技术管理将参与基础设施维护计划的创建。他们还将根据流程、架构和性能标准维护技能清单，这将能够识别培训需求。需要记住，技能清单提供了有关部门交付服务能力的信息，并识别了技术培训需求。\n\
  \n## IT 运营管理\n\n在业务中，`operations management` 一词是指负责执行组织日常运营活动的部门、小组或团队，例如在制造环境中运行生产线，或在物流组织中管理分发中心和车队移动。以相同的方式考虑\
  \ IT 运营管理是有用的。\n\n我们现在将探索 IT 运营管理职能以及它如何有助于服务运营。我们将查看 IT 运营管理的角色以及如何平衡需求。我们将审查与该职能相关的目标、组织、指标和文档，以及它如何作为生命周期阶段支持服务运营。\n\
  \nIT 运营管理的角色是执行交付和支持所提供所需的所有日常活动。应用程序和技术管理职能是各自领域的领域专家，定义了应进行哪些运营活动；运营管理的角色是确保这些工作得到执行。\n\
  \n服务设计阶段定义了所需的服务水平，过渡阶段执行了测试以确保这些水平是可以实现的；运营管理负责确保一致满足这些服务水平。虽然主要重点是稳定性和可用性，但运营管理将寻求通过实施有助于保护实时服务的变更，或通过在可能的情况下实现常规任务的自动化来降低成本和人为错误的机会，从而持续改进。\n\
  \n交付给业务的服务质量取决于运营管理。这一角色分为两个部分：IT 运营控制和设施管理。\n\n### IT 运营控制\n\n运营管理的这部分负责 IT 基础设施。在较大的组织中，这可能作为运营桥接或网络操作中心\
  \ (`NOC`) 的一部分。在这些组织中，有专门的人员在控制台上监控运营事件并在必要时做出反应，这些人员通常位于 IT 其他部分的隔离开区域。在较小的组织中，技术管理和运营控制之间的界限可能更加模糊，运营控制由技术管理团队执行，他们从办公桌监控系统，可能还配有一两块壁挂等离子屏。无论选择哪种安排，取决于什么适合组织，但重要的是要有明确定义的预期，以确保运营控制任务按照要求的水平执行。\n\
  \n运营控制任务如下：\n\n*   对系统事件进行集中监控和管理（如前所述，有时被称为 `console management`）。\n*   批作业的调度和管理，以执行数据库更新等常规任务。\n\
  *   执行数据备份并确保这些数据在需要时可以恢复。这可能包括整个系统的备份，或对用户可能损坏的单个文件的恢复。\n*   虽然大多数打印现在已由用户直接完成，但对集中式打印可能存在某些要求；工资单需要在安全环境中打印以确保机密性，且大量的打印量可能使集中式打印更高效。这些及其他电子输出的打印和分发属于运营控制任务。\n\
  *   还应对对任何控制活动的输出进行管理，例如分发。\n*   运营控制还可以在技术或应用管理职能的指导下承担维护活动；这可能包括归档数据、应用系统包、更新病毒库等。\n\
  \n\n\n\n\nIT 运营管理的另一部分是*设施管理*。参与此工作的员工将负责物理 IT 环境。这包括以下内容：\n\n*   确保运营地和恢复站点提供必要的电力供应（包括对电力质量的任何要求，例如防止电压尖峰）。\n\
  *   运行和维护不间断电源（UPS）设备和发电机。设施管理负责确保这些设备可用，并进行测试以确保它们在发生停电时能够按照设计要求工作。在较小的组织中，这一角色可能仅涵盖一个机房；对于较大的组织，则可能涵盖一个或多个数据中心。\n\
  *   确保存放 IT 的房间具有良好的空调/冷却维护，无论该房间是运营地或恢复站点的机房还是完整的数据中心。\n\n近年来，许多组织都开展了数据中心或服务器整合项目，以利用技术进步。设施管理部门负责管理任何此类项目。在数据中心管理由第三方执行的情况下，应由设施管理负责确保外部服务提供商按照约定的标准执行所需任务，并利用供应商管理流程管理任何异常情况。\n\
  \n为了确保有效，运营管理需要了解技术以及它如何支持所提供的服务，尽管这种水平的知识将低于技术和应用管理部门提供的知识。存在一种风险，即运营人员在工作中不与业务进行互动，因此可能无法意识到故障对业务的影响，或无法理解服务的业务重要，而仅从技术角度考虑问题。确保他们对业务方面有充分的理解至关重要；显示技术如何支持业务的信息可以通过服务知识管理系统（`SKMS`）获取，但可能需要特定的培训以确保他们对技术对业务的影响有必要的认识。\n\
  \n已经提到了服务稳定的重要性；维持这种稳定性的一种方法是确保无论哪位员工值班，都能一致地执行例行任务。这要求运营人员可以使用记录完善的程序和技术手册。\n\n\
  运营管理部门的绩效应该基于服务性能的清晰目标进行衡量，而不仅仅是技术性能。在约定的成本内提供所需水平的服务至关重要，因此运营管理不仅应该能够证明其工作的有效性，还要证明其正以最高效率运行。运营管理应始终努力优化对现有技术的利用，并利用新的技术进步，以最佳成本提供所需水平的服务。\n\
  \n### 目标\n\nIT 运营管理的目标包括继续提供稳定的服务以使业务获得作为策略一部分确定的业务利益（这些利益在设计中记录、在过渡阶段构建和测试、在运营阶段交付），同时研究可能的改进以使服务能够更具成本效益地提供。\n\
  \n服务运营的其他目标是尽快克服发生的任何故障，以尽量减少对业务的影响，并在引入新服务时维持服务质量。\n\n图 5.1 说明 IT 运营管理被视为一项独立的功能，但在大多数组织中，来自技术和应用管理组的员工构成了该功能的一部分。\n\
  \n![图表显示服务运营功能，标题包括服务台、技术管理（大型主机、服务器等）、IT 运营管理（IT 运营控制和设施管理）以及应用管理。](img/00024.jpeg)\n\
  \n**图 5.1** 服务运营功能\n\nCopyright © AXELOS Limited 2010. 保留权利。材料根据 AXELOS 的许可复制。\n\
  \n一些技术和应用管理部门或小组将管理并执行自己的运营活动，而另一些则会将这些活动委托给专门的 IT 运营部门。\n\n每个组织都是不同的并有其自己的需求，因此没有分配活动的单一方法，因为这取决于所管理基础设施的成熟程度和稳定性。例如，相当新且不稳定的技术和应用管理功能倾向于管理自己的运营。技术或应用保持稳定、成熟且被良好理解的小组倾向于对运营进行更多标准化。这将实现这些活动的委托。\n\
  \n### 衡量 IT 运营管理绩效\n\n与所有生命周期过程和功能一样，衡量在理解和维持有效性和效率方面起着重要作用。IT 运营管理的绩效衡量标准是其对指定活动和程序的有效执行，以及对过程活动的执行情况。这是一个可以应用许多衡量示例的领域，但应该根据单个组织的需要进行定制，以衡量运营在业务方面所提供的真实价值。\n\
  \n用于衡量 IT 运营功能性能的关键指标示例包括：按时完成的计划作业百分比，或计划活动和作业的异常数量。所需数据或系统恢复的数量统计将有助于理解该部门的工作负载，设备安装统计数据（包括按类型安装的项目数量、成功安装数等）反过来将用于识别和报告运营活动的成本。\n\
  \nIT 运营管理执行许多服务管理过程活动。其执行能力将在适当的情况下作为过程指标的一部分进行衡量，一些示例包括响应时间、解决时间、变更和发布的实施时间，以及它们的成功或失败。还会有财务过程衡量以及与可用性和容量相关的衡量，所有这些基于\
  \ IT 运营功能执行的活动。这些衡量的细节最好被视为过程的一部分，并在生命周期各个相关过程区域中有更详细的说明。\n\n### IT 运营管理文档\n\n在\
  \ IT 运营管理期间产生并使用许多文档。在本节中，我们总结了最重要的文档，不包括由 IT 运营管理代表其他过程或功能生成的报告。\n\n第一组文档包括 `SOP`（标准操作程序）。这些文档代表每个设备、系统或程序的例行工作。`SOP`\
  \ 还应包括特定的安全管理程序，涵盖服务、系统、数据和物理安全的所有运营方面。它们还概述了检测到异常或需要更改时应遵循的程序。`SOP` 文档还可用于设备或程序的标准性能水平。\n\
  \n\n\n\n在某些组织中，`OLA` 并不列出详细的性能指标，而是引用 `SOP` 文档。文中会插入一个条款，引用 `SOP` 中的性能标准以及如何对这些标准进行衡量和报告。\n\
  \n作为 IT 运营一部分的任何活动都应该记录在运行日志中，因为它们可以用于确认特定作业或活动的成功完成，或者确认 IT 服务已按约定交付。它们是 IT 运营管理团队和部门性能报告的基础。这些日志的格式随系统和运营管理团队或部门的数量而异。它们还可能用于支持问题管理，以便对事件的根本原因进行研究。\n\
  \n在需要的情况下，IT 运营将负责管理轮模式。并非所有组织都实行 24 小时运行，但如果存在这种情况，则使用排班表来概述班次期间需要执行的准确活动。它们还将列出所有的依赖关系和活动顺序。可能会有多个排班表；每个团队都有适用于自己系统的版本。在班次开始之前协调所有调度至关重要。这通常由专门负责排班的人员借助调度工具完成。\n\
  \n班次报告与运行日志相似，但它们具有额外的功能，用于记录班次期间发生的重大事件和行动，并作为班次主管之间交接的一部分。它们将用于报告服务维护目标的异常，并识别可能影响后续服务小时内性能的未完成活动。\n\
  \n运营计划与排班表相似，但它们在高层涵盖了 IT 运营的所有方面。该计划可以包括对“变更前计划”文档的审查、所有计划变更操作的概述以及有关维护、常规作业和额外工作的信息。它还可以包括有关即将发生的业务或供应商事件的信息。运营计划可以作为每日运营的基础，也可供\
  \ IT 运营经理跟踪进度并检测异常。\n\n## 应用管理\n\nITIL 框架中描述的最后一个功能是`应用管理`。该功能与技术管理功能共享许多特征，尽管在这种情况下，在整个生命周期内支持和管理的是应用软件而非基础设施。应用管理和应用开发不是一回事，理解它们之间的区别至关重要：\n\
  \n*   应用`管理`涉及服务生命周期的每个阶段，从确定需求到设计、过渡，再到运营和改进。\n*   应用`开发` 主要涉及单一、有限的活动，例如设计和构建新服务。我们将在本章稍后的部分详细讨论这一点。\n\
  \n与技术管理一样，应用管理功能在许多组织中可能有不同的名称。无论哪个团队负责管理和支持运营软件应用程序，它们就是应用管理功能。与技术管理一样，该功能可能被划分为多个团队。\n\
  \n应用管理可能会作为应用开发项目的一部分执行某些任务，例如设计或测试。这与应用开发本身的工作不同。\n\n### 角色\n\n应用管理功能涉及所有应用。即使该功能已建议从外部供应商购买应用程序，仍要求进行管理活动。这些活动与技术管理功能的活动相似：\n\
  \n*   应用管理功能负责管理 IT 应用。这包括确保执行此功能的人员具有必要的技术知识，以设计、测试、管理和改进构成 IT 服务组成部分的应用。\n*  \
  \ 它是与管理应用相关的技术知识和专业知识的保管者。\n*   尽管我们在服务运营下讨论了这一功能，但它提供了具有相应技能的人员来支持整个生命周期。应用管理人员将参与制定应用策略。他们将执行新应用或更改应用的设计，并参与其向运营环境过渡的规划和实施。一旦服务上线，应用管理将提供支持、解决事件、调查问题，并指定为服务高效运行所需的变更或更新。应用管理人员将识别服务改进，并与\
  \ `CSI manager` 合作设计、测试和实施改进。\n\n应用管理的人员和培训职责与技术管理确定的职责相同，该功能同样与生命周期的其他阶段相互交互。\n\
  \n应用管理还承担其他特定角色：\n\n*   应用支持确保运营管理人员获得正确的培训，以便应用程序能够高效运行。他们还负责用户培训，使用户能够胜任地使用新的或更改的应用程序来支持其业务。\n\
  *   作为服务设计的一部分，应用管理可能会进行涵盖服务运营人员的培训需求分析并提供所需的培训，但这一角色是持续性的，为运营人员提供日常支持。\n\n### 目标\n\
  \n应用管理的目标是完成以下工作：\n\n*   识别应用软件的功能和可管理需求。\n*   帮助设计应用。\n*   协助部署。\n*   支持运行环境中的应用。\n\
  *   识别并实施改进。\n\n为了取得成功，应用管理必须确保应用设计良好，充分考虑服务设计中的实用性（utility）和保证性（warranty）方面。如果要实现业务效益，它们必须以合理的成本提供正确的功能。提供足够数量的相应技能的人员至关重要，以便这些技能可以用于解决任何应用故障。\n\
  \n### 应用管理原则\n\n应用管理负责决定是购买支持所需业务功能的应用程序，还是根据组织的需求专门构建应用程序。这些决策通常在高级管理层做出，可能由首席技术官\
  \ (`CTO`) 或指导委员会做出，但它们取决于来自多个来源的信息。这作为服务设计的一部分被涵盖，但从应用管理的角度来看，有许多考虑因素需要应用管理的专业知识和投入。\n\
  \n应用管理将探索现有应用交付所需功能的能力，如果需要定制，则考虑对组织的影响和成本。他们将通过提供应用规模估算、工作负载预测以及指定可管理需求、持续运营成本以及报告或集成到其他应用的需求来提供协助。\n\
  \n另一个重要方面是识别支持解决方案所需的技能，以及管理和安全需求的影响。\n\n\n\n\n一旦决定进行构建，就必须进一步决定是采用外包开发还是使用内部员工进行构建。为了实现这一点，必须对需求管理、验收标准以及运营环境管理进行认可。\n\
  \n这需要对运营模型有清晰的理解，运营模型是指应用程序最终上线时运行的运营环境的规范。运营模型应在正式运行之前用于测试和过渡。\n\n## 应用管理生命周期\n\
  \n应用程序开发和管理的生命周期有许多名称，包括软件生命周期 (SLC) 和软件开发生命周期 (SDLC)，这两者都被应用开发团队及其项目经理使用。这些生命周期方法的示例包括结构化系统分析与设计方法\
  \ (SSADM)、动态系统开发方法 (DSDM) 和快速应用开发 (RAD)。\n\n尽管这些对任何组织都非常重要，但 ITIL 主要关注的是作为 IT 服务一部分应用程序的整体管理，无论这些应用程序是内部开发的还是从第三方购买的。\n\
  \n在图 5.2 中，你可以看到生命周期中的六个，它同时适用于开发和购买的软件。\n\n![流程图显示了应用管理的生命周期，包括需求、设计、构建、部署、运行和优化等步骤。](img/00025.jpeg)\n\
  \nFIGURE 5.2 应用管理生命周期\n\nCopyright © AXELOS Limited 2010\\. 版权所有。材料根据 AXELOS 的许可复制。\n\
  \nSDL（软件开发周期）是开发者（特别是第三方软件公司）使用的有效方法。因此，应用程序的开发视图与这些应用程序的持续生命周期管理之间应该保持一致。\n\n基本生命周期也适用于大型第三方应用程序（如电子邮件），因为无论应用程序规模如何，它都需要需求、设计、定制化、运行和部署。通过更好的管理、对定制化的改进以及升级来实现优化。\n\
  \n应用管理生命周期并不是服务管理生命周期的替代方案。应用程序是服务的一部分，必须作为服务进行管理。在服务管理生命周期的每个阶段，应用程序都需要专门的关注。\n\
  \n在接下来的章节中，我们将回顾应用管理生命周期的每一个步骤。\n\n## 需求\n\n显而易见，需求阶段是根据组织的业务需求收集新应用程序需求的阶段。正如你所预期的，该阶段主要活跃在服务生命周的服务设计阶段。\n\
  \n任何应用程序都有六类需求，无论它是内部开发、外包还是购买的。\n\n第一是**功能性需求**，专门用于支持特定的业务功能。然后是**可管理性需求**；从服务管理的角度来看应用程序，这些需求解决了对响应式、可用和安全服务的需求，并处理部署、运行、系统管理和安全等问题。接下来是**易用性需求**，它解决终端用户的需求，并产生有助于易于使用的系统功能。如果需要对现有架构标准进行更改，则需要**架构需求**。\n\
  \n大多数应用程序不是独立的，因此一个重要因素是识别**接口需求**。当现有应用程序或工具与新应用程序之间存在依赖关系时，就需要这些需求。\n\n最后，并不是因为它们不重要，还有**服务水平需求**。这些需求规定了服务应如何表现、输出质量以及用户或客户衡量的其他定性方面。\n\
  \n## 设计\n\n设计阶段包括应用程序本身的设计以及环境的设计（或应用程序必须运行的运营模型的设计），因为此时需求正转换为规范。\n\n应用程序的架构考量（应用程序架构设计）与运营模型的架构考量（系统架构设计）密切相关，并需要保持一致。架构考量是该阶段最重要的方面，因为它们会影响应用程序和运营模型的结构和内容。\n\
  \n对于购买的软件，组织不太可能允许直接参与软件设计，因为软件已经构建完成。然而，应用管理能够就软件的功能、可管理性和性能向软件供应商提供反馈是非常关重要的。这应该是软件持续改进的一部分。良好的供应商会对改进做出响应，但应确保在响应改进与过度更改软件（以至于产生干扰或改变某些基本功能）之间取得平衡。\n\
  \n所购软件的设计阶段应包含任何所需的定制化设计。评估软件未来版本支持导入和维护定制化的能力非常重要。通常会发现，随着每次连续升级，为了将现有定制化重新应用到产品，实际发布时间会变得越来越长。\n\
  \n## 构建\n\n在此阶段，应用程序和运营模型都为部署做好了准备。应用程序组件经过编码或获取，然后进行集成和测试。\n\n测试是构建和部署阶段不可缺的组成部分，因为是对这些阶段活动和输出的验证，即使使用了不同的环境和人员。构建阶段的测试侧重于应用程序是否符合其功能和可管理性规范。测试环境允许对应用程序和运营模型的组合进行测试。\n\
  \n对于购买的软件，这将涉及应用程序的实际购买、任何所需的中间件以及相关的硬件和网络设备。如果需要定制化，则需要由相关的应用管理团队或部门进行试点实施。在全面实施之前，应对将要使用的表、类别等的创建进行成功性测试。\n\
  \n## 部署\n\n在部署阶段，运营模型和应用程序都得到了部署。运营模型被整合到现有的 IT 环境中，应用程序根据 ITIL 服务过渡出版物规定的发布和部署管理过程安装在运营模型之上。\n\
  \n测试在此阶段也会进行，尽管这里的重点是确保部署过程和机制有效运行——例如，测试应用程序在下载和安装后仍然符合规范。对于新或更改的 IT 服务在发布后一段时间提供的专门支持被称为早期生命支持\
  \ (ELS)。在此期间的支持活动包括对 KPI、服务水平和监控阈值进行审查，以及为事件和问题管理提供额外资源。ELS 在 ITIL 服务过渡出版物中有详细介绍。\n\
  \n## 运行\n\n\n\n\n在运行阶段，IT 服务组织运营应用程序，作为交付业务所需服务的一部分。\n\n需要理解的一点是，应用程序不等同于服务。在许多组织中，将应用程序称为服务是常见现象，但应用程序只是提供业务服务所需要的许多组件之一。应用程序相对于整体服务的性能，是持续根据服务水平和关键业务驱动因素进行衡量的。\n\
  \n运行阶段并非应用程序所专属，而是适用于任何产品、技术或服务的提供。\n\n### 优化\n\n在此阶段，将对服务水平性能的测量结果进行分析并采取行动。此时会讨论可能的改进方案，并在必要时启动开发。此阶段的两个主要策略是维护和/或提高服务水平以及降低成本。这可能导致生命周期的重复，或者对应用程序进行合理的退役。\n\
  \n关于应用程序管理生命周期，需要记住的一点重要点是：同一个应用程序可以同时处于生命周期的不同阶段。这显然需要强大的版本、配置和发布控制；例如，当应用程序的下一个版本正在设计中，而当前版本正在部署时，之前的版本可能在组织的某些部分仍在运行。\n\
  \n某些阶段可能比其他阶段耗时更长或看起来更，但它们都是至关重要的。\n\n至关重要的一点是，处理应用程序某一阶段的人员必须信息传递给处理下一阶段的人员。随着应用程序通过生命周期的各个阶段，良好的沟通是必不可少的。组织监控应用程序管理生命周期质量也很重要。理解应用程序管理生命周期中每个阶段的特征对于提高整体质量至关重要。某一阶段使用的方法和工具可能会对其他阶段产生影响，而某一阶段的优化可能会整体产生负面影响。\n\
  \n### 应用程序管理通用活动\n\n角的具体性质取决于支持的应用程序，但所有关键应用程序都需要应用程序管理团队或部门。这里有很多通用活动，我们将在本节中进行简要探讨。\n\
  \n与技术管理类似，通用活动包括识别和提供知识及专业技能，以管理和支持应用程序，并管理用于使用或支持应用程序的培训。\n\n进一步的活动将包括招聘或签约具有无法内部开发的技能的资源。当没有足够的人员执行所需的应用程序管理活动时，也需要招聘资源。\n\
  \n应用程序管理负责设计和交付最终用户培训。培训可以由应用程序开发组、应用程序管理组或第三方开发和交付，但应用程序管理负责确保以适当的方式进行培训。了解人员需求以及提供这些需求的最具效益的方法非常重要。这可能包括对于在内部或公开市场上无法获得所需技能、或外包更具效益特定活动进行外包。\n\
  \n在定义应用程序架构期间（作为服务策略流程的一部分），应用程序管理应帮助定义新架构设计中使用的标准。它们还可以在研究和开发解决方案方面发挥主要作用，这些解决方案有助于扩展服务组合，或用于简化或自动化\
  \ IT 操作、降低成本或提高 IT 服务水平。\n\n应用程序管理应参与新服务的的设计和构建。所有应用程序管理团队或部门将为 IT 服务的技术架构和性能标准做出贡献。它们还负责指定持续管理应用程序所需的运行活动。\n\
  \n此外，应用程序管理可能用于参与项目，不仅是在服务设计过程中，还包括 CSI（持续服务改进）或运营项目。\n\n他们将负责设计和执行 IT 服务的功能、性能和可管理性的测试（注意，测试应由独立的测试人员控制和执行）。\n\
  \n设计活动将包括设计满足业务所需服务水平的应用程序。可用性和容量管理依赖应用程序管理提供的设计专业知识和指导，以评估满足业务应用程序需求的适当资源水平。这意味着建模和工作负载预测通常由技术和应用程序管理资源共同完成。\n\
  \n应用程序管理和技术管理一样，在协助评估风险、识别关键服务和系统依赖关系，以及定义和实施应对措施方面将至关重要。\n\n许多应用程序管理部门或小组依赖管理特定应用程序供应商的合同，因为他们拥有所需的理解和知识。如果是这样，确保将这些关系作为\
  \ `SLM`（服务水平管理）和供应商管理流程的一部分进行管理很重要。\n\n应用程序管理功能将深度参与所有运行流程，并且应参与事件管理标准的定义，特别是对应用程序进行仪表化以生成有意义的事件。该功能还被要求提供有助于问题管理过程执行的资源。利用他们的技术专业知识和知识来诊断和解决问题。他们与供应商的关系也被用于升级并跟进供应商支持团队或部门。其他与事件和问题管理相关的活动包括定义用于事件和问题管理的编码系统（例如，事件类别），并提供资源支持问题管理团队和应用程序开发团队验证和维护已知错误数据库。应用程序管理还为服务服务热台提供脚本，以确保高质量的事件捕获并提供临时解决方案（workarounds）以促进首次修复。\n\
  \n服务转交也将利用应用程序管理，通过技术应用程序知识和专业知识来支持变更管理，以评估变更。许多变更可能由应用程序管理团队构建。它们还将参与发布和部署管理活动。应用程序管理经常是其所管理应用程序发布和部署管理过程的驱动力。\n\
  \n该功能的一个重要部分是协助定义、管理和维护 `CMS`（配置管理数据库）中应用程序 `CIs`（配置项）的属性和关系，并确保它们为软件配置策略提供输入和维护。它们还将帮助识别改进机会，并协助评估替代解决方案。\n\
  \n\n\n\n应用管理将负责与开发团队协调，以确保有一套机制来存储和维护与应用程序相关的文档。这包括确保所有的设计、管理和用户手册以及标准操作程序（SOP）都是最新的、完整的，并持续地得到适当利用。应用管理还确保应用管理人员和用户了解应用程序文档并熟悉其内容。\n\
  \n该职能的另一个关键领域是与技术管理协作，进行培训需求分析，并为参与支持应用程序的团队维护技能清单。\n\n应用管理职能贯穿于整个服务生命周期。他们将协助 IT\
  \ 服务的财务管理，以识别应用程序持续维护的成本。\n\n许多应用管理部门、小组或团队还作为组织 IT 运营管理功能的一部分执行运营活动，并将参与定义将作为 IT\
  \ 运营管理一部分的与应用程序相关的运营活动。\n\n应用程序 Bug 跟踪和补丁管理（针对内部代码的编码修复、第三方代码的传输/补丁）也是该角色的一部分，同样涉及应用程序的可操作性和可支持性问题，例如错误代码设计、错误消息传递和事件管理钩子。\n\
  \n作为服务设计的一部分，并支持容量和可用性管理流程，该职能将参与应用程序规模估算、性能、容量指标以及负载测试。\n\n他们将参与制定发布策略，当然还有从功能和可管理性的角度识别现有软件的改进点。\n\
  \n尽管所有的应用管理部门、小组或团队都执行类似的活动，但每个应用程序或一组应用程序都有不同的管理和操作要求。每个应用程序的开发都是为了实现特定的目标（通常是业务目标）。为了进行有效的支持和改进，管理应用程序的小组需要对业务背景以及如何使用应用程序来实现业务目标有全面的理解。业务目标取决于许多因素，例如应用程序的用途。业务目标的理解通常由接近业务并负责确保业务需求有效转换为应用程序规范的业务分析师实现。业务分析师应该意识到，业务需求必须同时转换为功能规范和可管理规范。另一个考虑因素是应用程序的功能。每个应用程序的设计方式都不同，并在不同的时间执行不同的功能。\n\
  \n并非所有应用程序都运行在相同的平台上，因此技术管理和应用管理在支持环境和应用程序时需要合作。即使功能相似的应用程序，在不同的数据库或平台上的运行方式也不同。同样，使用的技术类型或品牌也会产生影响。必须理解这些差异才能有效管理应用程序。\n\
  \n尽管管理这些应用程序的活动是通用的，但具体的活动计划和执行方式会有所不同。由于由于原因，应用管理团队和部门往往根据它们所支持的应用程序类别进行组织。\n\n\
  例如，在较大的组织中，由于许多不同的应用程序用于财务管理的各个方面，可能会有多个、小组或团队管理这些应用程序（例如：用于债务人、债权人和账龄分析、总账的应用程序）。\n\
  \n这种方法可以用于多种应用程序，例如消息和协作应用程序、HR 应用程序、制造支持应用程序以及销售、营销、呼叫中心、网络门户和在线购物等业务功能的应用程序。\n\
  \n### 应用程序开发与应用程序管理\n\n如前所述，应用管理和应用程序开发具有独立的目标和责任。这两个小组可能会紧密合作，也可能完全分离，具有不同的报告结构和与业务交互的不同界面。正如我们之前所说的，应用程序开发通常是开发应用程序的有限活动，团队在完成后会转到下一个需求。另一方面，应用管理贯穿于应用程序的整个生命周期。以下是它们之间区别的总结：\n\
  \n*   开发侧重于实用性方面，大部分工作在内部开发的应用程序上进行。管理活动同时考虑保证（warranty）和实用性（utility），无论应用程序是内部开发还是购买的，都会执行。\n\
  *   开发关注功能，而不考虑如何操作或管理应用程序，而应用管理关注如何一致地交付这些功能。\n*   开发通常作为项目的一部分进行，具有明确的交付物、成本和交接日期。这与应用管理不同，后者的活动贯穿整个服务生命周期，其成本可能无法被单独标识。\n\
  *   开发者可能不理解管理和操作应用程序需要什么，因为他们不支持自己开发的应用程序，而是转向下一个开发项目。同样，应用管理人员对开发的参与可能较少，因此对应用程序是如何开发的的理解也较少。\n\
  *   开发人员遵循软件开发生命周期。应用管理人员往往通常只参与服务生命周期中的运行和改进阶段。\n\n图 5.3 显示了应用管理团队和应用程序开发团队的各种角色；应用程序开发团队主要关注应用程序的功能，而应用管理团队考虑应用程序基础设施将如何支持应用程序，以及如何在运行中对其构建、部署和监控。\n\
  \n![图表详细显示了应用管理团队在应用程序开发和管理中的角色重点，涵盖了需求、设计、构建、部署、运行和优化等步骤。还显示了服务管理生命周期。](img/00026.jpeg)\n\
  \n图 5.3 应用程序管理生命周期中团队的角色\n\nCopyright © AXELOS Limited 2010. 版权所有。材料根据 AXELOS 的许可复制。\n\
  \n消除这两个小组之间划分的趋势日益增长，因为这让业务部门感到很困惑。理想情况下，这意味着开发角色的扩大将包含考虑应用程序将如何运行，并且意味着将要管理应用程序的人员将更多地参与开发，如表\
  \ 5.1 所示。\n\n| | 应用程序开发 | 应用程序管理 |\n| --- | --- | --- |\n| 活动性质 | 设计和构建应用程序解决方案的次性活动。\
  \ | 持续的活动，用于在整个生命周期内监督和管理应用程序。 |\n\n\n\n\n\n| 活动范围 | 主要针对内部开发的应用程序。 | 针对所有应用程序，无论是从第三方购买的还是内部开发的。\
  \ |\n| :--- | :--- | :--- |\n| 关注重点 | 侧重实用性。为客户构建功能。应用程序做什么比它如何运行更重要。 | 兼顾实用性和保修。关注功能是什么以及如何交付。应用程序的可管理性方面，即如何确保应用程序的稳定性和性能。\
  \ |\n| 管理模式 | 大部分开发工作在项目环境中进行，重点是根据规格、按时且在预算内交付特定的工作单元。这意味着开发者通常很难理解并为持续运营进行构建，特别是因为在他们离开项目并转到下一个项目后，他们就不再为该应用程序提供支持。\
  \ | 大部分工作作为重复的、持续的过程的一部分进行。只有相对少的人员参与项目。这意味着运维人员很难参与到开发项目中，因为这会让他们脱离他们正在进行的持续运维职责。\
  \ |\n| 衡量标准 | 员工通常因创意和完成一个项目而获得奖励，以便他们可以转向下一个项目。 | 员工通常因一致性以及防止意外事件和未经授权的功能（例如开发者添加的“花哨功能”）而获得奖励。\
  \ |\n| 成本 | 开发项目相对容易量化，因为资源是已知的，并且很容易将其费用与特定的应用程序或 IT 服务相关联。 | 持续管理成本通常与其他 IT 服务的成本混合，因为资源通常在多个\
  \ IT 服务和应用程序之间共享。 |\n| 生命周期 | 开发人员关注软件开发生命周期，这些生命周期强调了成功运行的依赖关系，但并未分配这些关系的责任。 |\
  \ 参与持续管理的人员通常只控制这些生命周期中的一两个阶段——运行和改进。 |\n\nCopyright © AXELOS Limited 2010. 版权所有。\n\
  \n`TABLE 5.1` 应用程序开发与应用程序管理\n\n### 衡量应用程序管理性能\n\n应用程序管理的性能指标在很大程度上取决于管理哪些应用程序，但这里包含了一些通用指标。\n\
  \n#### 约定输出的衡量\n\n可以使用以下指标来衡量约定的输出：\n\n* 能够访问应用程序及其功能的用户百分比\n* 准确且按时传输给用户的报告和文件百分比\n\
  * 关键业务交易的可用百分比\n* 与业务交易量相比的容量和性能相关事件数量\n* 具有适当支持技能的服务台人员百分比\n* `KEDB` 中记录的问题解决数量\n\
  * 用户对 `SLAs` 中定义的输出质量的衡量\n\n#### 过程指标\n\n应用程序管理团队执行许多服务管理过程活动。他们的执行能力将作为过程指标的一部分进行衡量，例如以下示例：\n\
  \n* 对事件的响应时间和事件完成率\n* 二线和三线支持的事件解决时间\n* 问题解决统计\n* 升级次数以及升级原因\n* 已实施和回滚的变更数量\n* 检测到的未经授权的变更\n\
  * 部署的发布数量（总数和成功数），包括确保符合组织发布策略的发布\n* 检测到并解决的安全问题\n* 实际应用程序交易量和需求负载与容量计划预测的对比（团队参与了该计划开发的场景）\n\
  * 对服务改进计划 (`SIPs`) 的跟踪情况\n* 预算支出情况\n\n#### 应用程序性能\n\n应用程序性能指标基于服务设计规范和供应商设置的技术性能标准，通常包含在\
  \ `OLAs` 或 `SOPs` 中。实际指标会随应用程序而异，但可能作为应用于应用程序性能的衡量体系的一部分，包含以下措施。\n\n#### 响应时间\n\n\
  应用程序的可用性有助于衡量团队或应用程序的性能，但不应与服务可用性混淆，服务可用性需要衡量服务整体可用性的能力，并可以使用多个单个系统或组件的可用性数据。以下指标用于衡量团队性能：\n\
  \n* 数据和报告的完整性与准确性\n* 维护活动的衡量\n\n以下指标是应用程序可用性指标：\n\n* 按计划进行的维护\n* 超过维护窗口的次数\n* 实现的维护目标（数量和百分比）\n\
  * 项目活动的衡量\n\n应用程序管理团队可能在项目中与应用程序开发团队紧密合作，应使用适当的指标来衡量，包括这些：\n\n* 在项目上花费的时间\n* 客户和用户对项目输出的满意度\n\
  * 参与项目的成本\n* 培训和技能开发\n\n这些指标确保员工具有相应的技能和培训来管理他们控制的应用程序，并识别出仍需培训的领域：\n\n* 个人已技能的衡量，以满足要求的技能水平\n\
  * 向第三方或其他内部领域专家寻求额外帮助和支持的电话和升级次数\n* 由技能问题导致的事件百分比\n\n### 应用程序管理文档\n\n如你所料，在应用程序管理期间会产生并使用许多文档。以下章节提供了一些最重要的文档的摘要，但不包括应用程序管理代表其他流程或功能产生的报告或文档。\n\
  \n#### 应用程序目录\n\n应用程序目录主要作为服务设计的一部分，它是组织内使用的所有应用程序的列表（更准确地说是一个系统或数据库）。它包含以下信息：\n\
  \n* 应用程序的关键属性\n* 客户和用户\n* 业务目的\n* 业务关键性水平\n* 架构（包括 IT 基础设施依赖）\n* 开发者、支持小组、供应商或厂商\n\
  * 至今对应用程序的投资。在这方面，应用程序目录可以作为应用程序的资产清单。\n\n应用程序目录的目的是分析组织对应用程序的需求和使用，它是整体 IT 服务组合的一部分。它可以将功能和投资与业务活动联系起来，因此是持续\
  \ IT 规划和控制的重要部分。应用程序目录的另一个优点是可以识别应用程序的重复和过度许可。\n\n#### 应用程序目录与服务目录\n\n应用程序目录不应误认为是服务目录，也不应作为服务列表向客户或用户宣传。应用程序本身不是一种服务。应用程序是服务资产，是提供\
  \ IT 服务所使用的许多组件之一。\n\n\n\n\n\n应用组合集应作为组织应用程序开发和管理经理及员工的规划文档。其他利益相关者（例如，可能被分配管理应用程序或运行应用程序的平台的\
  \ IT 人员）也应该能够访问应用组合集。\n\n服务目录将侧重于列出可用服务，而不是简单地列出应用程序。\n\n## 应用程序需求\n\n两类文档包含了应用程序的需求：业务需求文档和应用程序需求文档。\n\
  \n## 业务需求文档\n\n业务需求文档概述了所需应用程序的效用、保证条件以及任何限制条件。这包括应用程序的投资回报（ROI）以及对业务的所有相关改进，并概述了业务将如何使用该应用程序。业务需求文档还包括由服务客户和用户定义的服务水平需求。\n\
  \n## 应用程序需求文档\n\n应用程序需求文档基于业务需求，并详细说明了应用程序将如何满足这些需求。它们收集了用于委托开发新应用程序或对现有应用程序进行更改的信息。它们可以用于以下目的：\n\
  \n*   设计应用程序的架构（系统不同组件的规范、它们之间的关系以及将如何管理它们）\n*   为商业现货软件（COTS）应用程序编写需求建议书（RFP）\n\
  *   启动内部应用程序的设计和构建\n\n需求文档通常作为项目的一部分被所有，因此作为项目整体范围的一部分，受项目文档控制。\n\n需要定义四种不同类型的应用程序需求：\n\
  \n*   **功能需求**描述了应用程序旨在做的事情，可以表示为应用程序必须执行的服务、任务或功能。\n*   **可管理性需求**用于定义管理应用程序所需的条件，或确保其以所需的水平一致地执行所需的功能。可管理性需求还识别了\
  \ IT 系统的限制。它们驱动了 IT 运营中运营模型和性能标准的设计。\n*   **可用性需求**通常由应用程序的用户指定，涉及其易用性。还需要在此指定针对残障用户的特殊需求。\n\
  *   **测试需求**规定了确保测试环境具有运行环境的代表性且测试是有效的要求（即测试确实测试了它应该测试的内容）。\n\n## 用例\n\n用例在服务设计阶段开发，并由应用程序管理维护。对于购买的软件，开发功能规范的团队通常维护该应用程序的用例。用例通过真实场景记录了应用程序的意图用途，以展示其边界和完整功能。它们也可以作为建模和规模估算的场景。\n\
  \n## 设计文档\n\n并没有单一的设计文档。设计文档是由应用程序开发或管理产生的任何文档。由于这些文档通常由开发团队拥有和管理，应用程序管理应确保设计文档包含以下项目：\n\
  \n*   规模规范\n*   负载配置文件和利用率预测\n*   技术架构\n*   数据模型\n*   编码标准\n*   性能标准\n*   软件服务资产和配置管理定义\n\
  *   支持需求\n*   环境定义和构建考虑（如适用）\n*   对于第三方开发的应用程序，以应用程序规范形式存在并由应用程序管理拥有和管理的文档\n\n##\
  \ 手册\n\n应用程序管理负责手册的管理。尽管这些手册是由开发团队或第三方供应商生成的，但应用程序管理负责确保手册与运营相关。通常维护三种类型的手册：\n\n\
  *   **设计手册**包含有关应用程序结构和架构的信息。这些手册有助于创建事件关联规则，并有助于诊断问题。\n*   **管理或运维管理手册**描述了在设计阶段指定的水平上维护和运行应用程序所需的活动。这些手册包含了错误描述和常见维护任务的逐步操作说明。\n\
  *   **用户手册**描述了终端用户使用时的应用程序功能。\n\n## 手册与标准操作程序 (SOP)\n\n手册不应被视为 SOP 的替代品，而应作为 SOP\
  \ 的输入。SOP 应包含作为标准运营部分而需要管理的应用程序的所有方面。应用程序管理应确保从手册中提取此类指令并将其插入到 SOP 中，以便明确需要做什么。它还负责确保在软件的每次更改或新版本发布时更新这些内容。\n\
  \n### 技术与应用程序管理角色\n\n在服务运营（Service Operation）中定义的技术和应用程序管理角色执行这些功能的活动。如果您了解这些功能的作用，那么我们认为经理和分析师角色不需要任何解释。\n\
  \n技术操作员是执行与基础设施管理相关的日常任务的人员。如果 IT 运营管理作为一个组织单元，则该角色在那里执行。\n\n### IT 运营管理\n\n许多 IT\
  \ 运营小组采用某种轮班制，通常提供 24 小时覆盖。员工组织成若干班次，每个班都有一个具有监督作用的队长。\n\nIT 运营分析师是熟练、经验丰富的员工，能够确定执行运营职责的最佳方法。例如，他们会确定调度批作业的最佳方式。\n\
  \nIT 操作员执行 IT 运营管理定义的任务。\n\n\n\n\n\n## 考试要点\n\n**解释运营管理功能。** 理解运营管理的两个领域：运营控制和设施管理。能够列出这些领域职责的示例，例如监控环境条件（IT\
  \ 设施管理）和控制台管理（运营控制）。\n\n**解释技术管理功能。** 理解技术管理功能的作用，并能够清晰阐述该功能的职责并将其应用于特定场景。\n\n**理解应用管理功能。**\
  \ 理解应用管理功能的作用，并能够清晰阐述该功能的职责并将其应用于特定场景。\n\n**理解技术管理功能、应用管理功能与运营管理之间的重叠部分。** 理解技术管理功能和应用管理功能在为其他生命周期阶段提供资源，以及在规定服务运营人员应执行的运营任务方面的作用。\n\
  \n**解释应用管理功能与应用开发之间的区别。** 理解应用管理和开发功能的各自角色，并能够清晰阐述各自的职责并将其应用于特定场景。\n\n## 复习题\n\n\
