  \    2. 人员可能没有意识到过程的重要性\n    3. 收集信息的成本可能与其带来的收益不匹配\n    4. 无效的变更管理可能导致无法维护 `CMS`\n\
  \n6. 变更顾问小组（CAB）应包含相关的利益相关者；以下哪些利益相关者是 `ECAB` 的成员？\n    1. 客户\n    2. 应用支持团队代表\n\
  \    3. 高 IT 经理\n    4. 桌面支持团队代表\n    5. 高技术经理\n    6. 网络支持团队代表\n    7. 服务台经理\n\
  \    1. 以上\n    2. 2, 4, 6\n    3. 3, 5, 7\n    4. 1, 3, 5\n\n7. 以下哪些是变更过程的有效起点？\n\
