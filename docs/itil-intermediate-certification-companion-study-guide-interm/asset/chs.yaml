  \n## 帕托分析 (Pareto Analysis)\n这是一种将失败的最重要潜在原因与更微要的问题隔离开的技术。它识别了失败最常见的原因，即导致 80% 发生量的少数原因。这是通过创建一个表格，显示原因以及每个原因导致所有故障的百分比来实现的。然后对原因进行排序，以识别出百分比最高的那些。表\
  \ 2.3 显示了该技术的应用示例，包括累计百分比，图 2.7 中的柱状图显示网络控制器、文件损坏和地址冲突导致了 80% 的失败，因此应优先针对它们。\n\n\
  | 网络故障 |\n| --- |\n| 原因 | 占总量的百分比 | 计算 | 累计 (%) |\n| --- | --- | --- | --- |\n|\
  \ 网络控制器 | 35 | 0 + 35% | 35 |\n| 文件损坏 | 26 | 35% + 26% | 61 |\n| 地址冲突 | 19 | 61%\
  \ + 19% | 80 |\n| 服务器操作系统 | 6 | 80% + 6% | 86 |\n| 脚本错误 | 5 | 86% + 5% | 91 |\n\
  | 未经测试的 | 3 | 91% + 3% | 94 |\n| 操作错误 | 2 | 94% + 2% | 96 |\n| 备份失败 | 2 | 96% +\
  \ 2% | 98 |\n| 入侵尝试 | 1 | 98% + 1% | 99 |\n| 磁盘故障 | 1 | 99% + 1% | 100 |\n\nCopyright\
  \ © AXELOS Limited 2010\\. 保留所有权利。材料根据 AXELOS 的许可复制。\n\n**表 2.3** 帕托原因排序图\n\n###\
  \ 开发环境中的错误检测\n在服务过渡期间对新应用程序、系统或发布进行测试时，发现某些故障是不可避免的。被认为严重的故障将在服务部署到现场环境之前解决。然而，如果部署的益处大于故障带来的不便，则该错误将被记录，并安排在下一次发布中解决。这些已知的缺陷以及任何相关的变通方案应记录在\
  \ `KEDB` 中，并将这些信息正式交给服务运营部门。这避免了在调查报告的事件上浪费时间。\n\n![图表显示了原因与所有故障百分比之间的关系，带有柱状图和上升曲线。柱状图在网络控制器、文件损坏和地址冲突处达到最大。](img/00015.jpeg)\n\
  \n**图 2.7** 重要与微要原因\n\nCopyright © AXELOS Limited 2010\\. 保留所有权利。材料根据 AXELOS 的许可复制。\n\
  \n### 触发器、输入、输出和接口\n现在让我们查看问题管理过程的触发器、输入、输出和接口。\n\n### 触发器\n问题管理的触发器在不同组织之间会有不同。它们包括响应性和主动性问题管理的触发器：\n\
  \n响应性问题管理的触发器包括由服务台识别出一个或多个事件的原因，从而创建问题记录。这些事件可能已经解决，但原因尚不清楚；进行问题管理应该能够识别并消除根本原因，防止其再次发生。有时很明显地看出某个事件是由重大问题引起的，因此会立即创建问题记录。\n\
  \n另一个响应性问题管理的触发器是技术支持小组对事件的分析显示出底层问题。事件监控工具可能会自动引发事件，这些可能需要创建问题记录。最后，供应商可能会通知服务提供者存在需要解决的问题。\n\
  \n主动性问题管理的触发器包括对已发生事件的分析，导致创建问题记录以调查它们发生的原因。趋势分析可能会识别出一个或多个根本原因。通过消除原因，可以防止再次发生。\n\
  \n另一个可能的主动触发器可能源于持续服务改进。改进服务质量的步骤可能导致需要创建问题记录，以识别进一步可能的改进措施。\n\n\n\n\n趋势分析取决于对事件/问题进行有意义且详细的分类，以及对模式和事件重复发生情况的定期报告。通过对“前十大”事件进行定期报告可以实现这一点。\n\
  \n### 输入\n\n事件数据库是问题管理的重要信息来源。它包含了有关当前事件和问题的信息，是主动问题管理的基础。\n\n配置管理系统（`CMS`）提供了有关支撑\
  \ IT 服务的硬件和软件组件的信息。它对于问题调查和诊断至关重要。`CMS` 还可以通过显示组件与服务之间的链接，帮助 IT 部门适当地对问题进行优先级排序。\n\
  \n问题管理必须评估变更请求是否存在业务合理性；这需要财务信息。应咨询 `SLAs` 以确定业务需求。来自变更管理的输入将提供有关进展以及变更是否成功的反馈。\n\
  \n最后，出现在此列表中的是客户的反馈。建立和维护客户满意度是所有服务管理活动（包括问题管理）的核心目标。\n\n### 输出\n\n问题管理的输出包括显而易见的输出，如已解决或更新的问题记录、变更请求、解决方案以及错误记录。此外，该流程还会输出各种报告。例如，可以在服务评审会议上讨论问题报告。问题报告会提交给设计团队和其他流程。当这些报告包含改进建议时，它们可能会记录在\
  \ `CSI` 注册表中。\n\n### 接口\n\n正如我们在本章前面的部分讨论过的，在讨论事件管理时，问题管理与事件管理之间的主要关系是彼此。然而，问题管理确实与其他流程有接口。\n\
  \n问题管理使用“IT 服务财务管理”流程来评估可能的解决方案或解决方案的财务影响。这些信息可用于判断永久解决方案在财务上是否合理。\n\n问题管理与多个服务设计流程有接口；例如，可用性管理具有类似的目标：防止停机。可用性管理采取的主动活动与主动问题管理直接相关；可用性管理试图主动识别可能导致服务中断的风险并采取预防措施。问题管理可以向可用性管理提供有关所采取措施的成功信息。\n\
  \n某些性能问题可能是由容量问题引起的。容量管理将参与解决这些问题，并采取主动措施防止容量问题。同样，问题管理可以提供有关所采取措施的成功信息。\n\n如果一个重大问题正在或将对业务造成严重中断，则可能需要调用\
  \ IT 服务连续性管理（`ITSCM`）计划直到问题得到解决。`ITSCM` 计划也试图主动识别可能导致重大服务损失的风险并采取预防措施。\n\n服务水平管理（`SLM`）流程以不同的方式与问题接口。`SLM`\
  \ 依赖问题管理来识别事件的根源并解决它们，以防止可能导致服务水平目标违反的停机。\n\n问题管理与多个服务过渡流程有接口。如前所述，变更可能是问题的起或解决方案。服务资产和配置管理提供了宝贵的信息，以便识别跨多个事件的共同因素。发布和部署参与了问题管理已知错误数据库的构建，这也与知识管理相关。与服务设计的最后一个接口是知识管理。问题管理开发的解决方案是服务知识的示例，这正是知识管理的核心关注。`KEDB`\
  \ 可以作为服务知识管理系统（`SKMS`）的基础。\n\n最后，问题管理和持续服务改进具有相似的目标；问题管理活动也可以被视为 `CSI` 活动。`CSI`\
  \ 和问题管理的目标密切相关。两者都寻求消除错误并提高服务质量。如前，为解决或防止问题而确定的行动可以输入 `CSI` 注册表。七步改进流程可以被 `CSI`\
  \ 或问题管理用于识别和解决底层问题。\n\n## 问题管理流程中的信息管理\n\n本节探讨了问题管理中使用的信息来源。\n\n### 配置管理系统\n\n`CMS`\
  \ 为问题管理提供了 IT 组件及其相互关系的详细信息。这些信息有助于评估问题及随之事件的影响，因为它将显示哪些服务依赖于特定设备的正确运行。它也有助于问题诊断；如果某些设备出现故障而另一些设备没有，它将提供识别故障项中共同属性所需的信息——例如，它们是否都连接到基础设施的同一部分，或者它们是否最近都安装了新的软件版本。它可以提供有用的历史数据，帮助作为主动问题管理的一部分来识别趋势。\n\
  \n### 已知错误数据库\n\n`KEDB` 存储有关事件/问题以及相关解决方案的信息，以便快速解决重复发生的情况。每个已知错误记录都应该描述症状，以便重复发生的情况与已知错误以及解决方案或解决措施的细节匹配。\n\
  \n理想情况下，服务管理工具应该记录经常使用已知错误信息，以识别故障的频率，从而确定其永久解决的紧迫性。但需要注意的是，如果存在有效的解决方案，而永久解决方案成本高昂、风险大或耗时长，可能会决定该问题的永久解决方案的益处远大于其他收益，从而容忍该问题。\n\
  \n一个有效的 `KEDB` 必须能够快速有效地找到与特定症状匹配的已知错误，否则员工将不会参考它。需要避免信息重复、症状描述不当和过时记录。问题管理人员应担任\
  \ `KEDB` 的守门人，审核所有建议条目的质量，并在实施永久解决方案后归档记录。\n\n## 问题管理中的角色\n\n正如本章前面在讨论事件管理角色时所述的那样，ITIL\
  \ 框架规定每个流程都应该有一个执行通用所有权责任的所有者，以及一个侧重于管理从业人员活动管理的经理。\n\n在本节中，我们考虑了除第 1 章概述的流程所有者、经理和从业人员通用责任之外的特定问题管理角色。与之前一样，这些角色不是职位名称，每个组织将定义符合其要求的适当职位名称和工作描述。\n\
  \n### 问题管理流程所有者\n\n\n\n\n问题管理流程所有者的职责不仅包括通用的流程所有者职责，还包括特定的问题管理任务，例如为不同类型的问题设计所需的工作流，并确保这些工作流在服务管理工具中完成配置。流程所有者还会识别常见问题，并创建模型来定义记录和解决这些问题的步骤。\n\
  \n问题管理流程所有者还将与事件、事件、访问管理以及请求履行的流程所有者进行联系，以确保这些流程与问题管理集成。\n\n### 问题管理流程经理\n\n应该有一个指定人员作为问题管理流程的单一协调点；在较大的组织中，这可能是一个团队而非个人，而较小的组织可能会将此职责与其他角色相结合。与问题管理流程所有者一样，问题管理流程经理的职责不仅包括通用的流程经理职责，还包括额外的特定问题管理任务。这些包括：\n\
  \n*   支持问题管理工具和流程\n*   与各种支持团队以及第三方供应商合作，确保问题在 SLA 目标内解决\n*   `KEDB` 的所有权和维护，包括数据库门员的角色\n\
  *   进行重大问题评审，并确保识别出的任何必要措施得到执行\n*   对所有问题记录进行正式关闭\n*   协调问题管理与其他服务管理流程之间的接口\n\n\
  ### 问题分析师\n\n问题通常会分配给负责解决事件的同一技术团队。这也可能包括供应商或支持承包商。这些不同的支持资源在问题经理的协调下汇集，承担问题解决活动。他们的职责通常包括：\n\
  \n*   审查事件数据以实现问题解决或根因识别\n*   分析问题以进行正确的优先级排序和分类\n*   根据需要协调其他小组的行动以协助分析和解决措施\n\
  *   提出 `RFCs` 以解决问题\n*   监控已知错误的的解决情况\n*   告知事件管理人员针对事件的最可用变通方案\n*   更新 `KEDB`\n\
  *   协助处理重大事件并识别其根原因\n\n严重问题可能需要一个专门的问题管理团队专注于解决该特定问题。问题解决者必须确保提供正确的人员资源，并确保在所有相关组织的管理链上进行必要的升级和沟通。\n\
  \n## 挑战与风险\n\n在我们对问题管理流程审查的最后部分中，我们将观察与流程相关的挑战和风险。\n\n### 挑战\n\n我们已经看到问题管理依赖于事件管理流程。这带来了许多挑战：\n\
  \n*   事件流程必须足够成熟，能够正确识别可能的问题，并收集足够的信息使问题管理能够诊断原因。一个关键挑战是确保这两个流程具有正式的接口和共同的工作实践。\n\
  *   问题解决人员必须具备解决问题的技能和能力。\n*   理想情况下，应使用单一工具进行问题和事件管理。该工具应该能够将事件与问题关联起来，并能够确定 `CIs`\
  \ 之间的关系以协助问题诊断。\n*   必须在负责问题支持活动的二、三线人员与一线人员之间建立良好的工作关系。他们必须理解各自在问题调查中的角色，以及这很大程度上是团队协作。\n\
  *   从事问题解决的人员必须理解问题对业务的影响。理解业务以及 IT 在支持业务方面的作用是生命周期中的共同挑战。\n*   下一个挑战是活动与 `CMS`\
  \ 的集成，`CMS` 持有有关配置项及其关系和历史的重要信息。\n*   最后一个挑战是拥有具有必要技术知识以调查和诊断问题的员工。这要求人员能够投入处理问题。要将人员从其他工作中抽身出来进行问题管理可能是困难的。\n\
  \n### 风险\n\n问题管理面临的风险包括：\n\n*   未能满足上一节列出的任何挑战都是一种风险。\n*   由于资源不足或提出问题的标准太松，可能会有太多问题无法处理。\n\
  *   可能缺乏来自事件管理或来自 `CMS` 的信息。\n*   运营级协议的重点可能放在事件解决上，因此人员没有意识到问题管理的重要性。\n\n## 关键成功因素与关键绩效指标\n\
  \n我们将讨论的下一个主题是用于有效问题管理的 `CSFs` 以及显示这些 `CSFs` 是否已实现的 `KPIs`。ITIL《服务运营》出版提供了三个问题管理的\
  \ `CSFs` 示例。第一个是“减少无法预防的事件对业务的影响”。这一 CSF 关注的是变通方案及其有效性，因此我们需要 `KPIs` 来评估此项。第一个 `KPI`\
  \ 示例是“添加到已知错误数据库的错误数量”。这涉及衡量该流程在识别变通方案方面的成功率。只有在这些变通方案被使用时，识别它们才有意义。这就是第二个 `KPI`\
  \ 示例派上用场的地方：“服务台解决的事件百分比”。这里的假设是，服务台的修复率将随着记录的已知错误数量增加而增加。第二个 CSF 是“通过消除重复性事件来维护\
  \ IT 服务的质量”。这涉及衡量通过提供永久修复来消除事件根本原因的流程有效性。两个可能的 `KPIs` 是“问题积压量”和“重复事件的数量”。您应该能够设计其他支持这些\
  \ `CSFs` 的 `KPIs`。\n\nITIL《服务运营》中找到的第三个示例 CSF 是“提供问题处理活动的整体质量和专业水平，以维护对 IT 能力的信心”。这一\
  \ CSF 主要关流程本身，而不是其对 IT 服务质量的直接影响。许多可能的 `KPIs` 与此相关；让我们只考虑三个示例：\n\n**完成的重大问题评审百分比**：良好的问题管理流程会对每个重大问题进行正式评审。该\
  \ `KPI` 表明是否正在执行。一个能告诉我们评审是否及时完成的 `KPI` 也具有价值。\n\n**每个问题的平均成本**：这指的是调查和诊断的成本；它会告诉我们问题管理是否高效。\n\
  \n**未解决问题的积压及趋势**：该流程有多有效？这是一个在流程建立之初可能使用的 `KPI` 示例，在流程成熟并消除积压后可能会被丢弃。\n\n## 总结\n\
  \n本章探讨了服务运营阶段的前两个流程：事件管理和问题管理。我们涵盖了内容：\n\n*   目的\n*   目标\n*   范围\n*   价值\n\n\n\n\
  * 策略、原则和基本概念\n* 过程活动、方法和技术\n* 触发器、输入、输出和接口\n* 信息管理\n* 角色\n* 挑战与风险\n* 关键成功因素和关键绩效指标\n\
  \n我们研究了这些过程是如何相互支持的，以及这些过程对业务和 IT 服务提供商的重要性。\n\n我们研究了以下关键的 ITIL 概念：\n* 事件 (Incident)\n\
  * 重大事件 (Major incident)\n* 影响 (Impact)\n* 紧急性 (Urgency)\n* 优先级 (Priority)\n* 第一线支持\
  \ (First-line support)\n* 二线支持 (Second-line support)\n* 三线支持 (Third-line support)\n\
  * 功能性升级 (Functional escalation)\n* 级别升级 (Hierarchic escalation)\n* 问题 (Problem)\n\
  * 变通方法 (Workaround)\n* 已知错误 (Known error)\n* 错误数据库 (KEDB)\n* 石骨图 (Ishikawa diagram)\n\
  * Kepner-Tregoe 分析\n* 痛苦价值分析 (Pain value analysis)\n* 帕累托分析 (Pareto analysis)\n\
  * 主动性问题管理 (Proactive problem management)\n* 根因分析 (Root cause analysis)\n* 技术观察 (Technical\
  \ observation)\n\n## 考试要点\n\n**理解事件管理通过快速解决事件来减少停机时间的目的和目标。** 能够描述事件的范围和基本概念，如重大事件、事件模型以及及时解决的重要性。识别用户向服务台报告事件以外的事件报告来源；供应商、支持人员或事件管理告警都是可能的来源。理解事件管理是一个响应性过程。能够列出并解释事件管理与其他过程（接口，特别是问题管理和服务水平管理过程。\n\
  \n**理解事件管理的目标是恢复服务，而不是识别原因。** 这种对服务恢复的关注意味着，解决事件比解决问题需要技能较低的人员。能够描述事件、问题和服务请求之间的区别。\n\
  \n**解释如何使用业务影响和紧急性来计算优先级。** 理解这些术语的含义。\n\n**解释参与事件管理的不同角色。** 能够区分通用角色和特定角色。\n\n\
  **能够解释事件模型和问题模型的概念及其用途。** 能够描述事件的生命周期以及分配给每个阶段的不同状态的使用。能够列出在事件记录中记录的关键信息。能够描述两种升级（级别升级和功能升级）的区别以及它们各自的使用场景。\n\
  \n**理解问题管理的目的、目标、范围、基本概念、过程活动和接口。** 理解问题是一个或多个事件的未知底层原因，问题管理的目标是找到事件的原因并消除它以防止再次发生。能够描述问题管理与其他过程之间的关系。\n\
  \n**解释参与问题管理的不同角色。** 能够区分通用角色和特定角色。\n\n**理解变通方法和已知错误的概念。** 能够解释为什么当实施修复不符合成本效益时，某些问题可能无法得到解决，以及何时存在变通方法。能够解释如何使用错误数据库。\n\
  \n**理解各种问题分析方法。** 能够描述不同的方法及其使用方式。\n\n## 复习题\n\n你可以在附录中找到习题的答案。\n\n1. 关于事件的最佳描述是哪一个？\n\
  \    1. 一个具有意义并影响服务的事件\n    2. 对 IT 服务的意外中断或 IT 服务质量的降低\n    3. 导致 IT 基础设施故障的故障\n\
  \    4. 用户错误\n2. 应该何时关闭事件？\n    1. 当技术人员确信它不会再次发生时\n    2. 当桌面支持人员说事件已结束时\n    3.\
  \ 当用户确认服务已恢复时\n    4. 当达到目标解决时间时\n3. 下列哪项*不是*事件的满意的解决方案？\n    1. 用户投诉响应慢；重启加快了响应速度。\n\
  \    2. 用户投诉响应慢；二线支持运行诊断程序，以便在下次发生时进行监控。\n    3. 服务台使用 `KEDB` 提供一个变通方法来恢复服务。\n \
  \   4. 服务台远程控制用户的机器，并向用户如何运行他们遇到困难的报告。\n4. 事件管理的目标是尽快恢复正常服务运行。*正常服务运行*是如何定义的？\n\
  \    1. 用户所需的服务水平。\n    2. 技术管理人员认为合理的服务水平。\n    3. 在 `SLA` 中定义的服务水平。\n    4. IT\
  \ 部门认为最佳的服务水平。\n5. 服务管理工具具有存储常见事件模板的能力，这些模板定义了解决故障要采取的步骤。这些被称为什么？\n    1. 重大事件\n\
  \    2. 微小事件\n    3. 事件模型\n    4. 事件分类\n6. 哪些事件应该记录？\n    1. 重大事件\n    2. 所有因用户联系服务台产生的事件\n\
  \    3. 微小事件\n    4. 所有事件\n7. 在评估事件的优先级时，应该考虑哪些因素？\n    1. 影响和成本\n    2. 影响和紧急性\n\
  \    3. 紧急性和严重性\n    4. 严重性和成本\n8. 下列哪些是 ITIL 定义的事件升级类型？\n    1. 级别升级\n    2. 管理升级\n\
  \    3. 功能升级\n    4. 技术升级\n        1. 1 和 4\n        2. 1 和 3\n        3. 1, 2,\
  \ 和 4\n        4. 以上所有\n9. 问题的最佳定义是什么什么？\n    1. 服务台不知道如何修复的事件\n    2. 变更失败的结果\n\
  \    3. 一个或多个事件的原因\n    4. 需要更改才能解决的故障\n10. 问题管理可以产生以下哪项？\n    1. 已知错误\n    2. 变通方法\n\
  \    3. 解决方案\n    4. 变更请求 (RFC)\n        1. 1 和 4\n        2. 1 和 3\n        3.\
  \ 1, 2, 和 4\n        4. 以上所有\n\n\n\n\n\n访问管理是授予`authorized`用户使用服务的权限，同时防止未经授权的用户获得访问的过程。它有时也被称为`rights\
  \ management`或`identity management`。访问需求经常变化，服务运营部门负责根据业务需求快速授予访问权限，同时确保所有请求都经过了适当的授权。\n\
  \n## 事件管理\n\n首先，让我们考虑一下 ITIL 服务运营（Service Operation）出版物中的一些定义。这些定义在 `ITIL Foundation\
  \ Exam Study Guide` (Sybex, 2012) 中应该是熟悉的。\n\n`event`（事件）可以定义为任何对配置项（CI）或 IT 服务管理具有意义的状态变更。请记住，`event`\
  \ 并不一定意味着发生了错误；它可能仅仅是对系统运行运行的确认。许多事件纯粹是信息性的。信息性事件可能包括用户登录应用程序的通知（因为应用程序的使用可能会被计费），或交易成功完成的通知（因为成功完成的通知可能会触发下一次交易的开始）。\n\
  \n通知人员发生故障或突破`threshold`（阈值）的事件被称为 `alert`（告警）。例如，通知服务器发生故障，或者警告设备的内存或磁盘使用率超过 75%\
  \ 的告警。如果你在非 IT 环境下考虑这些概念，汽车控制台可能会发布一个事件表示系统已成功连接到蓝牙设备，或者可能会发出一个告警（伴随着蜂鸣声或闪灯），警告突破了阈值且燃油量低。\n\
  \n有效的服务运营依赖于了解基础设施的状态并检测任何偏离正常或预期运行的偏差。事件管理监控服务的任何可能影响其性能的发生。它还为其他流程提供信息，包括事故、问题和变更管理。\n\
  \n事件监控工具分为两种：\n\n*   `Active monitoring tools`（主动监控工具）通过自动定期检查监控配置项或 IT 服务，以发现当前状态。该工具发送消息并在定义时间内等待积极响应，例如向设备发送\
  \ `ping`。这被称为对设备的 `polling`（轮询），目的是检查它们是否运行正常。如果未响应，将通知支持人员。某些工具对此类情况具有 `automated\
  \ responses`（自动响应），例如自动重启设备或重路由数据以避开故障的 CI，从而确保服务不受影响。\n\n*   `Passive monitoring\
  \ tools`（被动监控工具）不发送轮询消息。它们检测由 CI 生成的事件并对其进行`correlate`（关联）；即识别相关的事件。它们依赖告警或通知来发现当前状态。此类通知可能包括错误消息。\n\
  \n### 目的\n\n事件管理的目的是检测事件、理解其含义，并在必要时采取行动。\n\n许多设备被设计为通信其状态，事件监控将收集这些通信并对任何需要采取的操作进行处理。某些通信报告运行信息，例如“文件备份完成”、“打印完成”等。这些事件表明服务运行正常。它们可以用于自动化常规活动，例如提交下一个要备份的文件或下一个要打印的文档。它们还可能用于监控多个设备的负载，根据收到的事件发布自动指令以平衡负载。如果事件是告警，例如“备份失败”、“打印机卡纸”或“磁盘已满”，将采取必要的纠正措施。发生故障时，应记录事故（incident）。\n\
  \n### 目标\n\n事件管理具有以下目标：\n\n*   它能够检测到 CI 或服务的所有重要意义的状态变更。事件管理应为每个事件确定适当的控制措施，并确保在必要时进行通信。\n\
  \n*   该流程为自动执行许多服务运营流程和运营管理活动提供了触发机制。例如，基础设施故障的通知将触发事故管理流程。通过在突破阈值时提供信息（例如，服务在约定时间内未响应），事件使服务水平管理能够将实际性能与\
  \ `SLA` 进行比较。实际性能还可以与设计阶段预期和计划的内容进行比较。\n\n*   它响应某些事件以触发自动化流程或活动。这可能包括在发生故障时在服务管理工具中自动记录事故。\n\
  \n*   最后，事件管理收集的数据构成了服务保障、报告以及基础，并为比较实施服务改进前后的性能提供了可能。\n\n### 范围\n\n事件管理可以应用于服务管理中任何需要控制且并可能从自动化中获益的方面。例如，服务管理工具集会根据收到的电子邮件或事件自动记录事故，在达到阈值时升级事故，并通知人员某些状况（例如记录了一个优先级为一的事故）。\n\
  \n事件管理工具可以对配置项进行监控。这种这种监控可能出于两个不同的原因：\n\n*   监控某些 CI 是为了确保它们始终可用。其中一个例子是，当网络设备等\
  \ CI 无法对 `ping` 做出响应时，需要立即采取行动。\n\n*   其他 CI 可能需要频繁更新。这种更新可以使用事件管理实现自动化，并且 `CMS`\
  \ 可以自动更新以显示新状态。\n\n跟踪许可证是事件管理工具的另一个用途；通过检查使用软件的人数是否超过持有的许可证，可以跟踪许可证以确保没有非法使用应用程序。这还可以节省费用；如果\
  \ IT 部门显示并发使用需求比认为的少，就可以减少许可证数量。\n\n监控和响应安全事件（如检测入侵者）是另一个用途；这些工具还可以用于检测拒绝服务攻击或类似事件。\n\
  \n另一个用途是监控`environmental conditions`（环境条件）。这可能是为了检测服务器房温度的突然升高或其他环境变化。\n\n### 价值\n\
  \n事件管理为业务带来了许多益处：\n\n*   组织可以进行大量的监控，而不需要大量人员。利用人员监控偶尔可能发生的错误并不能充分利用他们的技能。\n\n*\
  \   错误将被更快地识别，从而实现自动响应，这将减少停机时间及其对业务造成的成本。\n\n*   在太晚之前识别出接近容量的情况，为采取行动留出时间。\n\n\
  *   事件监控消除了对设备进行重复检查的需要；它通过仅对异常进行响应来减少工作量。\n\n*   事件管理与其他自动化一样持续进行，而人员可能有其他职责，因此可能会漏掉某些情况。它也更不容易出错。\n\
  \n*   事件管理提供历史数据，能够识别趋势和潜在问题。\n\n### 策略\n\n接下来，让我们考虑事件管理的建议策略。\n\n\n\n\n\n第一项策略规定，事件通知应仅发送给对采取行动有责任的人员。这意味着，对于我们选择处理的每一个事件，都必须确定目标受众——将通知发送给所有人并寄希望某人会采取行动是不可接受的。\n\
  \n第二项策略涉及事件管理的集中化。这确保了通知的处理是一致的，不会遗漏任何一个，且不会被多于一个个人或团队处理。这意味着将使用单一的规则引擎来处理通知，而且当然，这套规则应该受到变更管理。\n\
  \n第三项策略为新应用程序的设计者提供了指导和约束。应用程序生成的事件应该拥有一套共同的标准。这将确保跨应用程序的一致性，并且自然会缩短在新应用程序中工程化事件处理的时间。\n\
  \n第四项策略是事件处理应尽可能自动化。自动化的优点是众周知的：例如降低成本和减少错误等。\n\n第五项策略强制要求使用标准的分类方案对事件进行分类，以确保相似类型的事件以一致的方式进行处理。\n\
  \n最后项策略规定，所有识别出的事件至少都应该被记录。这将提供一个有价值的信息源，这些信息可能有多种用途，例如在问题调查中。对记录的事件进行更复杂的分析，可能会识别出事件模式，这些模式可以在故障实际发生之前进行预测。\n\
  \n### 原则与基本概念\n\n理解“监控”与“事件管理”这两个相似活动的区别至关重要。它们是相似的过程，但重点明确不同。\n\n### 监控与事件管理\n\n\
  我们需要监控事件，但监控涵盖的范围大于事件。例如，监控可以用于确保设备运行正常，即使没有产生任何事件也是如此。监控实际上寻找不产生事件的条件。\n\n事件管理是指获取有关\
  \ IT 基础设施和服务的有用通知。事件管理建立规则以确保生成事件，以便能够对其进行监控、捕获并在必要时采取行动。“行动”是事件管理的关键。\n\n特定的通知本身可能取决于特定供应商。然而，它们很可能使用\
  \ `Simple Network Management Protocol (SNMP)`，这是一种用于管理 IP 网络上设备的 Internet 标准协议。通常支持\
  \ SNMP 的设备包括路由器、交换机、服务器、工作站、打印机、调制解调器机架等。由于 `SNMP` 是一个开放标准，它使得不同产品之间的交互变得更简单。事件必须生成有用的通知。创建带有建议操作的有意义描述所花费的时间，将节省日后的精力。\n\
  \n事件管理在管理大型复杂基础设施方面可能极其有用。然而，通常情况下，这些工具的全部价值并无法实现。这通常是因为没有花足够的时间确保它们被正确配置，仅向员工通知他们实际上需要通知的事件。例如，未能指定正确的阈值将意味着报告了过多的违规情况，导致员工忽略了它们，因为这些违规通常极少具有重要性。当然，这意味着重大事件可能会被遗漏。如果事件没有被正确过滤，服务管理工具将被大量的虚假事件淹没，这将使其难以使用其自动创建事件的功能。\n\
  \n另一个重要的定义是“警报（alert））：警报是关于达到阈值、发生变化或发生故障的警告。警报通常由系统管理工具和事件管理过程创建并管理。当磁盘或邮箱几乎满额时创建警报就是此类示例。\n\
  \n### 信息、警告和异常事件\n\n某些事件表示必须修复的故障，而另一些仅标记发生了某些事情并应该记录。这是两种类型的事件：第一种是 `exception`（异常），第二种是\
  \ `informational`（信息）。第三种类型——`warning`（警告）事件。警告事件意味着异常但并不一定是异常行为。警告事件需要进一步分析以确定是否需要采取行动。事件将根据其类型进行处理。\n\
  \n以下是各类型事件的示例：\n\n*   信息 (Informational)\n    *   计划中的负载已完成。\n    *   用户已登录使用应用程序。\n\
  \    *   电子邮件已到达收件人。\n*   警告 (Warning)\n    *   服务器内存利用率达到其最高接受性能水平的 5% 以内。\n  \
  \  *   完成时间比正常长了 10%。\n*   异常 (Exception)\n    *   用户尝试用密码登录应用程序。\n\n注意，并非所有示例都与故障有关。（故障属于警报。）某些示例仅包含信息，但由于某些原因，记录这些信息很重要。例如，出于审计目的，可能可能维护谁在使用应用程序的记录。\n\
  \n确定事件类型没有明确的标准；它在很大程度上取决于组织的具体情况。例如，某个事件可能是网络上检测到了一个先未知的设备。某些组织允许员工将笔记本电脑连接到公司网络，在这种情况下，该事件将是信息性的。在高度安全的组织中，它几乎肯定会被视为异常。\n\
  \n### 过滤\n\n我们将检查的下一个主题是事件过滤。我们无法完全控制配置项生成的通知。硬件制造商决定将生成哪些通知，并且可能没有为客户提供关闭它们的功能。在开始监控网络时，常见的经验是，监控工具会被未识别的、因此不需要的通知所淹没。\n\
  \n过滤通过丢弃对组织没有意义的事件通知，防止事件管理系统过载。\n\n解决这个问题有四种可能的方法：\n\n*   第一方法是将事件管理集成到每个服务管理过程中。这意味着每个过程将识别它感兴趣的事件。\n\
  *   第二种方法是将事件管理需求包含在新服务的设计中。\n*   第三种方法是使用试错法——逐一评估通知并相应地调整过滤。\n*   最后一种方法是在正式项目中计划引入事件管理。\n\
  \n这些方法并非互斥；许多组织将采用这些方法的某种混合模式。\n\n#### 为事件管理进行设计\n\n服务运营中成功的事件管理需要对所需内容进行分析和规划。这应该发生在服务设计阶段，尽管在服务运行期间将继续进行调整。许多组织尝试并放弃了事件管理，或者未能从中获得真正的价值，因为这个关键的设计阶段被忽视了。\n\
  \n在设计服务或规划引入新技术时，应该询问以下问题：\n\n*   需要监控什么？\n*   需要什么类型的监控？我们为什么要监控？\n*   什么时候应该生成事件？\n\
  *   应该传递什么信息？\n*   消息是发给谁的？\n\n\n\n\n\n# 谁将响应事件？\n\n在建立建立事件管理之初，应该就现有的服务和基础设施提出这些问题。必须咨询的利益相关者包括业务部门、流程所有者和运营管理人员。这些团体中的每一个都有监控需求，并且在事件发生时都可能参与处理事件。\n\
  \n## 仪表化\n\n仪表化是指用于监控和控制基础设施及服务的特定方法。在设计事件管理系统时，需要解决许多实际问题：\n\n*   事件将如何产生？对于购买的组件，当然，这个问题实际上是：事件*是如何*产生的？\n\
  *   它们将如何被分类？这并非易事，而且分类可能会随着时间的推移而变化。\n*   它们将如何进行通信和升级？事件究竟如何到达相应的职能部门？例如，异常事件如何触发故障管理流程？理想情况下，这将通过集成事件管理和故障管理工具来实现自动化，从而自动记录故障（incident）日志。当然，只有当这两个工具具有必要的功能时，这种情况才能发生。\n\
  *   事件通知中必须包含哪些数据？事件管理系统本身解释和理解事件需要哪些数据，响应事件的职能部门需要哪些数据？如果事件与错误有关，那么它应该包含必要的诊断信息，如错误消息和代码。同样，对于购买的软件，这个问题实际上是：包含了哪些数据？\n\
  *   另一个需要问的问题与使用的监控类型有关。应该是主动的还是被被的？\n*   事件数据将存储在何处？可能会产生大量的事件数据，因此存储问题非常重要。与之相关的是数据应该保留多久的问题。这一决定必须在与利益相关者协商的基础上根据具体情况做出。如果业务有特定要求（例如金融行业的监管要求），可能还会制定相关的保留策略。\n\
  *   将如何收集补充数据？在某些情况下，仅凭事件数据不足以评估事件。例如，可能将事件管理系统与配置管理数据库 (`CMDB`) 集成。\n\n## 关联引擎\n\
  \n当检测到事件时，事件管理系统必须解释并决定如何处理它们。这是通过被称为*关联引擎*的软件实现的。关联引擎允许创建规则集，并使用它们处理事件。\n\n使用关联引擎将使系统能够确定每个事件的重要性，以及对事件是否有任何预定义的响应。事件模式被定义并编程到关联工具中，以供未来识别。关联引擎可以将组件级事件转换为服务影响和业务影响，如图\
  \ 3.1 所示。\n\n![图像显示了关联引擎，包含逻辑层（业务流程、关联业务事件、规则集、服务 1 和 2 等）和物理层（应用程序、主机、路由器、服务器等），并从底部向上连接。](img/00016.jpeg)\n\
  \n**图 3.1** 关联引擎\n\nCopyright © AXELOS Limited 2010\\. 保留所有权利。材料根据 AXELOS 的许可复制。\n\
  \n## 流程活动、方法和技术\n\n接下来，我们将查看事件管理流程。流程步骤如图 3.2 所示。\n\n![图像显示了事件管理流程图，包括事件发生、通知、检测、记录、一级事件关联和过滤、重要性（信息性或异常）、故障/问题/变更、响应选择等。](img/00017.jpeg)\n\
  \n**图 3.2** 事件管理流程图\n\nCopyright © AXELOS Limited 2010\\. 保留所有权利。材料根据 AXELOS 的许可复制。\n\
  \n事件管理流程中的初始活动序列如下：\n\n*   发生事件。\n*   发送事件通知。\n*   事件管理系统检测并记录事件。\n*   进行一级关联和过滤。\n\
  \n此时，事件类型（异常、警告或信息性）已确定。对于信息性事件，不需要进一步处理。对于异常事件，将触发一个或多个服务管理流程。如果事件涉及某些已损坏并需要恢复到正常服务水平的内容，应提交一个故障（incident）。如果发生了另一个正在调查的故障示例，则可以更新问题记录（problem）。对事件的自动响应可能包括提交变更。某些事件（例如“墨粉低”消息）可能需要请求履行流程来处理服务请求。\n\
  \n警告事件将进入二级关联，以识别如何进行。在某些情况下，事件将被视为信息性的或异常的。其他情况将触发自动响应或需要人工干预的警报，详见下节。\n\n### 事件通知\n\
  \n让我们更详细地查看初始流程活动。事件通知是指有关事件信息的通信。你已经看到某些组件会独立生成通知，而另一些则必须通过轮询来提示。\n\n### 事件检测和记录\n\
  \n某些事件将由事件管理工具直接检测。其他事件将由运行在监控设备上的软件代理检测。该代理随后生成可以被事件管理工具检测的通知。所有事件都会被记录。\n\n###\
  \ 关联和过滤\n\n在一级关联中，将就是否需要进一步的操作做出决定，包括事件对组织是否有任何重要性。关联将决定事件是信息性的、警告还是异常。我们之前讨论过过滤；这对于防止员工被不需要任何操作的事件或同一故障的多次报告所淹是必要的。\n\
  \n信息性事件在此关闭。异常事件将触发其他服务管理流程之一。警告事件将进入二级关联。\n\n接下来，我们考虑二级关联引擎可能用于解释事件的标准：\n\n*  \
  \ 相似事件的数量可能具有意义。例如，某个事件可能会通知我们尝试访问网络未成功。如果这只是单个实例，我们可能将其视为信息性的，但如果在过去的 5 分钟内发生了\
  \ 500 次此类尝试，我们可能判断我们是有组织的入侵尝试的目标。\n*   产生相似事件的设备数量可能具有意义。例如，这可能表明存在广泛的病毒感染。\n* \
  \  随事件提供的数据可能指示其重要性。\n*   与设备利用相关的事件可能与定义的阈值进行比较。\n\n关联引擎决定事件是否需要某些操作，或者是否可以被视为信息性的并关闭。\n\
  \n### 采取的行动\n\n响应选择涵盖了许多可能的选项。这些包括：\n\n\n\n\n\n**自动化** 某些事件指示了可以在人工干预的情况下自动解决的条件。例如，如果检测到文件服务器几乎已满，则可以运行脚本通过归档旧数据来释放空间。\n\
  \n**人工干预** 某些事件将需要人工干预——例如来自烟雾探测器的警报。将警报发送给正确的人并让该人员知道如何做至关重要。\n\n**事件** 异常事件通常会触发事件管理流程。理想情况下，事件管理和事件管理系统应该是集成的，以便自动创建事件记录。然而，需要警告的是：只有在您确认事件过滤正常工作时，才应实施此。如果并非如此，您的事件管理系统将被成千上万的虚假事件淹没！\n\
  \n**问题** 如果组织拥有一始终调查影响关键服务的事件根源的策略，则可能会触发问题管理流程。事件管理可以在检测到此类事件时通过自动创建问题记录来支持该策略。\n\
  \n**变更** 变更管理可以在以下两种情况下触发：\n\n* 第一次，如果检测到之前未知的设备，应该提交一个 `RFC`，由变更管理根据情况进行处理，将该设备添加到\
  \ `CMS` 中或根据需要将其移除。\n* 第二种情况是需要进行变更。例如，服务器可能需要从存储区域网络（`SAN`）分配更多存储空间。\n\n记住，有时有必要触发这些响应的组合。\n\
  \n## 审查与关闭\n\n每天可能有成千上万个事件，因此不可能对每一个都进行审查。仅审查服务提供商认为重要的事件是明智的。对于那些触发了其他服务管理流程的事件，可能没有必要进行审查，除非是为了确保触发器是有效的。\n\
  \n大多数事件既不打开也不关闭，只是记录在管理系统或系统日志中。许多其他事件可以自动关闭。例如，当触发脚本响应问题时，脚本本身可以检查纠正措施是否生效，并生成相应的事件。\n\
  \n## 触发器、输入、输出和接口\n\n我们现在考虑事件管理流程的触发器、输入、输出和接口。\n\n### 触发器\n\n任何类型的状态变化都可以触发事件管理，组织应该定义哪些状态变化需要采取行动。这里显示了一些示例：\n\
  \n* 与设计规范或标准操作程序中定义的任何级别 `CI` 性能的异常。\n* `OLA` 中的阈值违约也可以生成事件。\n* 流程的任何异常，例如未在目标时间内完成流程。异常也可以是分配给构建团队或由事件管理监控的业务流程的常规变更。\n\
  * 自动化任务或作业的完成可以触发事件的发布，服务器或数据库 `CI` 的状态变化也是如此。\n* 用户访问特定的应用程序或数据库也可能导致发布事件，如果这是业务部门或\
  \ IT 部门想要的信息。例如，IT 部门可能希望跟踪服务的使用频率以决定所需的许可证数量，或者业务部门可能希望知道客户服务代表需要多久查阅知识库来回答查询，因为这可能表明存在需求。\n\
  * 事件更常见的触发器，例如设备、数据库或应用程序达到预定义的性能阈值的情况。\n\n### 输入\n\n向事件管理的输入通常来自服务设计和服务转交。它们包括此处列出的示例：\n\
  \n* 与事件及其操作相关的操作需求和服务水平级需求。\n* 用于识别事件的警报、警示和阈值。\n* 支持事件管理活动的事件关联表、规则、事件代码和自动响应解决方案。\n\
  * 识别事件并将其通信给需要处理的人员的角色和职责。\n* 识别、记录、升级和通信事件的操作程序。\n* `SLAs`，可供关联引擎用于确定事件的重要性或识别性能阈值。\n\
  * 技术或应用管理人员根据监控和管理需求提供的规则集。例如，容量管理流程将定义应生成事件的容量阈值。\n* 所有相关人员的角色和职责。\n* 根据需要记录和升级事件的程序。\n\
  \n### 输出\n\n来自事件管理的输出通常传递给其他服务管理流程，例如事件管理、变更管理和请求履行。它们包括此处列出的示例：\n\n* 已通信并升级给负责进一步行动的人员的事件\n\
  * 事件产生所需的事件、问题、变更或请求记录\n* 描述发生了哪些事件以及为了支持取证、诊断或进一步 `CSI` 活动而采取的任何升级和通信活动的事件日志\n\
  * 指明事件已发生的事件\n* 指明可能违反 `SLA` 或 `OLA` 目标的事件\n* 指明部署、运行或其他活动完成状态的事件和警示\n* 填充了事件信息和历史记录的服务知识管理系统\
  \ (`SKMS`)\n\n该流程最明显的输出是事件本身。这些事件应该已经通信并升级给相应的人。另一个输出是按时间顺序的事件日志，描述发生了哪些事件以及采取的任何升级和通信活动。如果需要进一步调查或发现可能的改进机会，这些信息可能是很有用的。\n\
  \n事件管理输出的某些事件将指示事件已经发生，而另一些将警告可能违反 `SLA` 或 `OLA` 目标。当然，正如我们所说的的，并非所有事件都显示存在问题，许多事件只是指示部署或运行活动的成功完成。从事件管理输出的数据可用于向\
  \ `SKMS` 填充事件信息和历史记录。\n\n### 事件管理与生命周期阶段之间的接口\n\n最后，让我们考虑事件管理与其他生命周期阶段及其相关流程的接口。事件管理可以与任何需要监控和控制的流程对接，特别是那些不需要实时监控但在事件或一组事件后需要某种形式干预的流程。首先我们考虑该流程如何能够直接帮助业务。\n\
  \n### 业务流程\n\n事件监控提供的信息可帮助管理业务流程中的异常情况。\n\n### 服务设计\n\n事件管理与多个服务设计流程对接。示例包括：\n\n\
  * 服务水平管理是第一个此类接口。事件管理可以尽早检测对 `SLAs` 的任何潜在影响，以便采取行动修复故障并最大限度地减少该影响。\n\n\n\n\n\n*\
  \   信息安全管理可能会使用事件监控来监控异常活动。这可能包括多次登录尝试，或业务流程的异常活动，例如信用卡卡的异常消费，这会警报银行卡可能被盗。\n*  \
  \ 容量和可用性管理定义了哪些事件是重要的、阈值应该是多少以及如何响应这些事件。事件管理随后对这些事件做出响应，从而提高服务的性能和可用性。\n\n## 服务过渡\n\
  \n事件管理工具也可能用于支持服务过渡过程：\n\n*   服务资产和配置管理过程使用事件来确定任何 `CI` 的当前状态。与 `CMS` 中授权基线之间的差异将突出显示潜在的未经授权的更改。\n\
  *   事件管理可以确定资产的生命周期状态。例如，一个事件可能信号某个新资产已成功配置并正在运行。\n*   知识管理将通过事件管理获得的信息存储在知识管理系统中。例如，与业务活动相关的性能信息模式将被输入到未来的设计和战略决策中。\n\
  *   事件管理与变更管理衔接，以识别可能需要响应或行动的情况。\n\n## 服务运营\n\n事件管理是一项服务运营过程，它与该生命周期阶段的其他过程衔接：\n\
  \n*   它与事件管理和问题管理之间存在明显的接口，因为许多警报是故障的结果，需要启动事件。\n*   通过捕获并记录每种发生情况，事件管理为问题管理提供了关于事件发生的时间和地点的关键信息。\n\
  *   最后，访问管理可以利用事件管理来检测未经授权的访问尝试和安全违规。\n\n## 信息管理\n\n在事件管理的信息管理中，有几个元素应该被视为关键要素：\n\
  \n消息（简单网络管理协议 [`SNMP]` 消息）是通信有关 IT 基础设施中单个组件或一组组件状态的技术标准方式。\n\n构成 IT 设备信息基础的数据库（例如有关操作系统的信息；基本输入/输出\
  \ [`BIOS]` 版本；配置参数）是事件管理的有用信息源。但现有的系统必须能够查询这些数据库，然后将其与基准进行比较，这对于生成事件过程的成功至关重要。\n\
  \n供应商自身的监控系统通常是信息的关键来源。\n\n正如本章前面所述，相关性引擎提供了大量信息。\n\n目前没有适用于所有类型事件的标准的事件记录。它可以涵盖许多领域，但通常需要以下数据集：\n\
  \n*   设备\n*   组件\n*   故障类型\n*   日期/时间\n*   异常中的参数\n*   允许跨越事件管理基础设施进行事件跟踪，并关联到事件、问题和变更等其他\
  \ ITSM 过程的唯一标识符\n*   值\n\n## 过程角色\n\n在第 1 章“运营支持与分析引论”中，我们探讨了适用于整个服务生命周期所有过程的通用角色。这些角色与事件管理过程相关，但也存在特定的额外要求。请记住，这些不是“职位名称”，而是对于成功运行该过程可能需要的角色的指导。\n\
  \n在组织中发现特定的“事件经理”角色是不寻常的，因为事件通常在 IT 环境的许多不同领域进行管理。但确保整个组织范围内事件管理有一套一致的方法，并对工具和工作进行协调以避免重复是至关重要的。\n\
  \n### 事件管理过程所有者\n\n事件管理过程所有者的职责可能包括：\n\n*   履行事件管理过程的通用过程所有者角色（见第 1 章）\n*   规划和管理事件管理工具的支持\n\
  *   通过与其他过程所有者合作，确保此过程与运营生命周期阶段的其他过程集成\n\n### 事件管理过程经理\n\n事件管理过程经理的职责可能包括：\n\n*\
  \   履行事件管理过程的通用过程经理角色（见第 1 章）\n*   规划和管理事件管理工具的支持\n*   协调此过程与其他服务管理过程之间的接口\n\n###\
  \ 事件管理过程执行者：其他角色\n\n事件管理过程中可能没有特定的“执行者”角色的标识，但这些活动是由许多其他角色完成的。\n\n#### 服务台台人员的角色\n\
  \n除非事件需要属于服务台台职责范围的行动（例如，通知用户已完成的操作），否则服务台台可能不会参与。通常情况下，事件管理由运营桥接部门（operations bridge）执行（如果该部门存在的话），但在某些组织中，服务台台和运营桥接可能已经合并。\n\
  \n如果一个事件被识别为一个事件（incident），那么它可以在过程的正常进行中通过服务台进行处理。这将包括向用户和支持团队通报进度。\n\n#### 技术和应用管理人员的角色\n\
  \n技术和应用管理可能扮演几个重要角色，如下：\n\n*   在服务设计期间，他们将参与工具的设计、相关性引擎的配置以及事件的分类。如果需要自动化，也将在设计期间开发。\n\
  *   在服务过渡期间，他们将参与测试，以确保事件正在生成且响应是适当的。\n*   在服务运营期间，这些团队将为他们控制的系统提供专家知识和支持。确保执行和定义适当的程序是重要的。\n\
  *   如果一个事件被分类为事件（incident），技术和应用管理也可能参与解决。\n*   这些团队还有责任为服务台和运营管理提供相应水平的知识和培训以支持该过程。\n\
  \n#### IT 运营管理人员的角色\n\n如果 IT 运营管理独立于服务台以及技术或应用管理功能，由小组执行事件管理是常见的。他们将执行事件的监控和一线支持活动。\n\
  \n如果存在运营桥接，那么该区域将执行对事件管理过程设置的警报的监控。运营桥接可以启动、协调甚至执行所需的响应。\n\n## 关键成功因素和关键性能指标\n\n\
  下一个主题是关键成功因素 (CSF) 和关键性能指标 (KPI)。在查看与事件管理相关的 CSF 和 KPI 之前，让我们花分钟理解这些术语的含义：\n\n*\
  \   CSF 是一个过程如果要被判定为成功必须实现的目标的高级陈述。通常，一个过程只有三四个 CSF。CSF 无法直接衡量——那是 KPI 的作用。\n* \
  \  KPI 是衡量 CSF 某个方面的度量。每个 CSF 将有三个四个关联的 KPI。\n\n以下是事件管理的 CSF 和 KPI 示例：\n\n\n\n\n\
  \n## 事件管理\n\n* 关键成功因素：“检测所有对配置项（CI）和 IT 服务管理具有意义的状态变更。”与该成功因素相关的 KPI（关键性能指标）包括以下内容（注意，第一个\
  \ KPI 试图衡量检测故障的成功率，而第二个试图衡量事件管理实施的范围）：\n\n* 事件数量与事件数量对比及比例\n* 每个平台或应用程序上每种类型事件的数量和百分比，与支撑运行\
  \ IT 服务的平台和应用程序总数相比的情况\n\n* 关键成功因素：“确保所有事件都传达给需要通知或采取进一步控制措施的相应职。”相关的 KPI 可能如下：\n\
  \n* 需要人工干预的事件数量和百分比以及是否执行了干预\n* 发生的事件数量以及其中在没有对应事件的情况下触发的事件百分比\n\n* 关键成功因素：“提供手段将实际运行性能和行为与设计标准及\
  \ SLA 进行比较。”\n\n以下 KPI 将能够对该成功因素进行评估：\n\n* 在不对业务产生影响的情况下解决的事件数量和百分比（表明了事件管理过程及其底层解决方案的整体有效性）\n\
  * 导致事件或变更的事件数量和百分比\n* 由现有问题或已知错误引起的事件数量和百分比（这可能导致对该问题或已知错误的工作优先级的变更）\n\n### 挑战\n\
  \n在事件管理中可能会遇到以下挑战：\n\n* 缺乏工具资金以及成功实施工具所需的精力\n* 建立正确的过滤级别，以避免被事件淹没或有用信息不足\n* 在整个基础设施中安装监控代理\n\
  * 缺乏培训所需的时间和资金，以获取设计和解释事件所需的技能\n\n### 风险\n\n以下风险与事件管理相关；在许多情况下，这些风险是由于未能满足上述挑战导致的。\n\
  \n* 未能获得充分的资金\n* 未能应用正确的过滤级别\n* 未能在整个 IT 基础设施中部署必要的监控代理并保持动力\n\n如果这些风险中的任何一个没有解决，可能会对事件管理的成功产生不利影响。\n\
  \n## 请求履行\n\n关于什么会被归类为请求，没有绝对的定义，因为这可能因组织而异。事实上，许多请求可能只是小变更，符合标准变更的定义，因为它们需要对配置管理系统进行更改，例如设备移动或安装额外软件。服务请求发生频繁，成本低，且具有已知且可接受的低风险。不是标准变更的服务请求示例可能包括密码重置或信息请求。服务请求通常由服务台处理，不需要提交\
  \ `RFC`（变更请求记录）。\n\nITIL 使用的定义是“用户对提供某些内容的正式请求——例如对信息或建议的请求、重置密码或为新用户安装工作站请求。”\n\
  \n服务请求涉及小规模、定义明确且低风险可接受的活动，例如提供单个工作站或供应墨盒。ITIL 所称的“服务请求”的一个重要特征是，它们代表了服务提供者将被反复要求的事物。它们都是为用户提供其请求内容的机会，并使用请求履行过程来处理这些请求。\n\
  \n许多服务请求需要变更——例如安装工作站。如果你回想你的基础课程（Foundation）学习内容，你可能会记住标准变更，它们是低风险、简单且预先授权的变更。可以通过请求履行过程处理的变更仅限于存在标准变更的变更。但这里要小心——并非所有的标准变更都是通过请求履行实现的，也不是所有的服务请求都涉及标准变更。信息或建议的请求也属于请求履行的范围。\n\
  \n### 目的和目标\n\n请求履行是负责管理用户所有服务请求生命周期的过程。该过程有五个目标：\n\n* 通过高效、专业的处理所有服务请求来维护客户和用户的满意度。你已经了解到，确保满意度不仅涉及满足客观目标，还涉及人为因素——尊重请求者、随时告知他们进度等。\n\
  * 为用户提供一种请求的方法。这通常通过 Web 门户实现，也可以使用服务台。\n* 为用户提供一种查找他们可以使用哪些标准服务以及如何请求服务的方法。令人惊讶的是，特别是在大型组织中，用户并不了解服务提供者能为他们做的一切。\n\
  * 溯源并交付服务的有形组件——硬件、软件、许可证等。\n* 协助处理一般信息、投诉或意见。该过程不仅应该提供提交问题的手段，还应该确保用户获得满意的答复。\n\
  \n一旦某项经过评估并接受为与基础设施兼容，请求履行就为用户提供标准设备提供了一种高效的方法。此类设备的提供可以经过预先批准并作为标准变更进行处理。它可以作为服务添加到服务目录中，未来所有此类请求都可以通过此过程处理。这鼓励用户请求标准设备和软件，因为这是获取它们最容易、最快的方法。这对\
  \ IT 有益，因为设备已通过评估为可支持且与基础设施兼容。\n\n### 范围\n\n请求履行的范围会因组织而异；它可以包括任何可以标准化并在组织同意使用的地方使用的请求。每个请求都应该被分解为约定的活动，每个活动都有记录的程序。然后使用这些程序来构建请求模型。\n\
  \nITIL 将所有这些统称为 `service requests`；它们都是为用户提供其请求内容的机会，例如信息、建议、标准变更或对 IT 服务的访问（例如重置密码或为新用户提供标准\
  \ IT 服务），正如引言提到的，请求履行过程用于处理它们。\n\nITIL《服务运营》书籍建议，其他类型的请求（例如建筑维护请求）可以与 IT 请求一起处理。花一点时间考虑这种方法的优点：\n\
  \n* 两者处理方式相似\n* 扩展单点接触\n* 降低（通常是服务台）工作的技能门槛\n\n每个组织将决定并记录哪些服务请求将通过请求履行过程处理，哪些必须通过其他过程（例如处理新或变更服务请求的业务关系管理\
  \ `BRM` 过程）。\n\n### 对业务的价值\n\n请求履行过程在许多方面为业务带来利益。\n\n\n\n\n\n首先，它通过让员工快速、有效地获取完成工作所需的服务，提高了业务的生产力。通过提供一种简单的方式来满足其需求，业务人员可以保持高效的工作状态。集中化促进了一致性和效率，减少了官僚主义和延迟，从而降低了交付成本。其次，该流程提供了一种高效处理请求的方法，再次减少了官僚主义。正式流程意味着采购和供应的集中，使服务提供者能够标准化使用的硬件和软件，并降低支持成本。通过经批准的供应商进行集中采购还可以通过规模效应降低成本。\n\
  \n请求交付的标准化性质意味着它是自服务的服务的理想人选。虽然不是必不可少，但通过 `self-help` 前端实现流程自动化，可以使请求者直接与流程对接，从而加速交付过程。通常情况下，用户可以在公司外部网站或内网上访问可能请求的列表。这确保了用户提供了所有必要信息，并能够获知预期的交货时间（定义在\
  \ `SLA` 中）。\n\n自动化可以简化请求的记录。如果与必要的系统有直接接口，它还可以自动化交付过程，而无需服务台的干预。这种自动化交付的一个示例是，当你从如\
  \ `Amazon` 等在线购物网站请求并接收重置密码时，无需任何人工干预。请求的财务审批也可以自动化，请求在交付前会被发送给适当的预算持有者进行批准或拒绝。\n\
  \n接下来，我们考虑请求交付流程的策略、原则和基本概念。让我们从策略开始。\n\n### 策略\n\n在本节中，我们将考虑一些支持有效请求交付的策略。\n\n\
  **策略：应为每个服务请求定义流程流。** 应该为每个服务请求的整个生命周期定义流程流。这将确保请求能够得到有效、高效且一致的满足。服务设计人员在设计工作中应包含标准服务的新需求。\n\
  \n**策略：流程应由集中职能拥有。** 集中职能应拥有所有服务请求。这并不意味着有一个单一的功能来交付请求。相反，集中职能将作为单一接触点，监控请求进度，并在进度缓慢时采取行动。该集中职能还将在适当向请求者提供进度更新。通常由服务台承担这一角色。\n\
  \n**策略：当涉及配置项变更时，应使用标准变更流程。** 如果请求涉及配置项的变更，则必须通过标准变更实施。换句话说，请求交付必须遵循正常的变更管理程序。\n\
  \n**策略：所有服务请求应由单一系统处理。** 服务请求应由单一系统处理。这与事件管理和服务台具有类比性。\n\n**策略：所有服务请求必须经过授权。** 所有请求在交付前必须经过授权。许多请求会产生成本，例如购买硬件或软件许可，这些成本必须经过授权。\n\
  \n**策略：所有服务请求应根据业务标准进行优先级排序。** 满足请求所需的活动必须符合业务的需求和目标。换句话说，每个请求都必须使用业务标准进行优先级排序。这里与事件管理有另一个类比。\n\
  \n**策略：用户必须能够轻松地提交请求并获取更新。** 用户必须有明确的来提交请求并获取进度更新。这可以是服务台为事件提供的单一接触点。对于请求交付，接触点可以是服务台或\
  \ Web 门户。\n\n### 原则和基本概念\n\n许多组织使用其现有的事件管理流程（和工具）来处理服务请求，因为关键步骤通常是相同的。在每种情况下，都需要回答以下问题：\n\
  \n* 服务台可以处理这个吗？\n* 这会对事件处理产生负面影响吗？\n* 如果不是服务台，谁可以处理这个？\n* 时间跨度/约定的服务水平是什么？\n* 用户满意吗？\n\
  \n### 请求与事件的分离\n\n某些组织将请求与事件分开，因为事件是不可计划且不受欢迎的；服务管理的一个大目标是通过通过改进设计、问题管理和持续的服务改进来减少事件的数量。相反，可能有一项策略是增加通过请求交付流程可以处理的项目数量。事件和请求的目标可能非常不同：请求通常有指定的交货时间，这些时间取决于其他因素（例如，用户在参加培训课程之前无法获得访问权限），而对于事件，目标是尽快解决每一个事件。当有大量请求需要交付时，应该使用具有不同记录类型的独立流程。这允许以比使用事件报告更合适的方式对所提供的服务进行监控和报告。此外，事件的优先级可能会高于请求，导致请求因为修复工作优先考虑而无法满足\
  \ `SLA` 目标。同样，如果处理请求对事件的解决产生影响，客户将感到不满意。\n\n### 请求模型\n\n满足请求所需的流程取决于具体请求的是什么，但它通常可以被分解为必须执行的一系列活动。对于每个请求，这些活动都应该记录在\
  \ `request model` 中。在这种情况下，请求模型定义了如何处理某个特定的、频繁发生的请求。\n\n模型应该定义必须执行的动作序列、由谁执行这些动作，以及每个步骤以及整个请求交付所需的时间跨度。还应该包含可能需要的\
  \ `escalation` 路径。\n\n### 菜单选择\n\n如果请求交付有软件工具（可能可能是基于 Web 的工具）的支持，其有效性将得到极大的增强。此类工具应具具有一个可用服务的菜单，用户可以从中选择。通过使用强制性字段和提供可能选项的下拉列表可以强制提供所有必需信息。此外，工具应该通过显示交货时间、成本等来设定用户预期。\n\
  \n当组织已经向用户提供自服务 IT 支持能力时，将其与上述的请求交付系统结合是合理的。\n\n提供此类“购物篮”体验的专业 Web 工具可以与直接用于管理请求交付活动的后端集成\
  \ ITSM 工具接口一起使用。\n\n### 请求状态跟踪\n\n请求所有者必须能够在整个生命周期内跟踪请求并在适当时向请求者报告进度。每个组织将根据其需求选择适当的状态，但让我们考虑最常用的状态：\n\
  \n* `Draft` 表示请求正在准备提交。由于某种原因，请求者此时无法或不愿提交请求。\n\n\n\n\n\n* `In Review` 表示该请求已获得授权，目前正由相关的履行团队进行审查。例如，他们可能正在计划进行桌面端安装。\n\
  * `Suspended` 表示履行活动已暂停。这可能是因为履行小组正在等待请求者的操作或信息。\n\n其他常见的状态——`Waiting Authorization`（等待授权）、`Rejected`（已拒绝）、`Canceled`（已取消）、`In\
  \ Progress`（进行中）、`Completed`（已完成）和 `Closed`（已关闭）都是言自自明的。\n\n## 请求的优先级排序与升级\n\n所有服务请求都应该根据一套标准标准进行优先级排序。这可以像事件管理一样，通过考虑请求的影响和紧急性来完成。或者，组织也可以为不同类型的请求设置前置时间。\n\
  \n升级请求有很多原因。也许显而易见的是请求可能无法在约的时间范围内得到履行。如果业务部门误用了流程，也可能需要升级。例如，迁移多多五个工作站可能是一项服务请求，但超过五个则需要提交变更请求。业务中的某些经理可能会试图通过提交多个请求来绕过这一限制，每个请求包含五个工作站，但总数很大。请求所有者应该警惕这一点，并按照约定的方式进行升级。\n\
  \n## 批准\n\n正如你所看到的，许多请求将产生必须经过批准的成本。某些请求将有标准费用——例如软件许可或标准工作站。在其他情况下，履行小组必须根据具体需要执行的操作来确定成本，例如设备移动。应该在请求模型中识别负责批准支出的业务部门角色。财务批准可以是自动化的，并且可能在请求到达服务台之前就已经完成。标准成本项目的请求可能在到达服务台之前就已路由给批准者。\n\
  \n有时需要其他类型的批准。这些可能包括对组织政策的 `compliance`（合规性），特别是在信息安全方面，或者确认请求将与基础设施兼容的 `technical\
  \ approval`（技术批准）。请求履行必须具备在需要定义和检查此类批准的能力。获取所需批准的程序应作为请求履行模型的一部分，以节短处理服务请求的时间。\n\
  \n## 履行活动的协调与请求的关闭\n\n请求（包括履行在内）可以通过许多方式处理。某些请求可以自动化——例如重置密码。当需要人工干预时，请求可以由专门的履行小组、技术支持团队、供应商或这些者的结合来履行。但请记住，请求的所有权应保留在一个团队手中——通常是服务台，除非存在专门的请求团队。\n\
  \n服务台应该监控并跟进进度，并在过程中告知用户，无论实际的履行来源是什么。\n\n当服务请求履行后，必须将其交回服务台进行关闭。服务台应该执行一个关闭流程，检查用户对结果是否满意。\n\
  \n## 流程活动、方法和技术\n\n我们现在将查看图 3.3 所示的流程图。虽然你不需要详细了解流程细节，但理解履行服务请求涉及的内容将帮助你掌握其目标。\n\
  \n![流程图显示了请求履行流程，其中服务台、RFC、Web 界面、电话和电子邮件共同接收请求、分析请求、记录和验证、请求是否有效？、分类、优先级排序、授权、审查等。](img/00019.jpeg)\n\
  \n**图 3.3** 请求履行流程\n\nCopyright © AXELOS Limited 2010\\. 保留所有权利。根据 AXELOS 的许可复制此材料。\n\
  \n首先我们来看一下流程图，然后讨论层级活动。\n\n图 3.3 显示了完整的请求履行流程。你可以看到它包含了对请求进行像处理事件一样的记录、分类和优先级排序。它还包含了一些针对此流程的活动。请求被记录并验证、分类并排序。然后获取任何必要的授权，并对请求进行审查以确定由谁来履行。随后执行相应的请求模型，最后在请求者同意后关闭请求。我们将逐一查看这些步骤。\n\
  \n### 接收请求\n\n第一个活动是接收请求。大多数服务请求从 Web 门户或在服务台接收，但它们也可能通过其他路由进入，例如电子邮件甚至作为变更请求 (RFCs)。从服务提供者的角度来看，首选路由是通过\
  \ Web 门户，因为这会减少打向服务台的电话。并不是所有进入的请求都是服务请求；它们可能是事件或变更请求，在这种情况下，必须将其路由到相应的流程。\n\n###\
  \ 记录请求\n\n接收请求后，应对对其进行记录并分配唯一的引用编号，并记录所有必要信息。Web 端口的设计应能帮助请求者提供必要信息。随着请求在其生命周期中进行，应根据需要更新请求记录，并带有日期和时间戳，以跟踪发生了什么以及何时发生。\n\
  \n### 验证请求\n\n对请求进行检查以确认其有效性；这包括确保请求在提供的 IT 服务范围内。Web 端口可以通过限制可记录的内容为可选的服务请求类型来提供帮助。这些工具确保请求的来源是有效的，并且只发布有效类型的请求。任何无效的请求都应返回给请求者并给出解释；例如，请求的服务可能由服务提供者提供。\n\
  \n### 分类请求\n\n对请求进行分类将有助于未来的分析和报告。与事件分类一样，应该考虑所采用的系统。请求可以通过多种方式进行分类。例如，可以按活动分类，如重置密码或安装软件。另一个例子是根据履行请求的功能进行分类。\n\
  \n### 对请求进行优先级排序\n\n优先级排序将符合业务需求，考虑到请求的影响和紧急性。这里也可以使用像第 2 章“事件和问题管理”中描述的用于事件优先级排序的模型。\n\
  \n### 授权请求\n\n我们讨论过所有请求都必须授权是请求策略之一。这里所需的严谨程度很大程度上取决于请求的类型。无法授权的请求应返回给请求者，并附上拒绝解释。\n\
  \n### 履行请求\n\n请求获得授权后，将由服务台进行审查并确定相应的履行职能。在某些情况下，这将是服务台本身；在其他情况下，可能是专门的履行团队甚至是供应商。\n\
  \n\n\n\n\n随后通过执行相应请求模型中指定的操作来完成请求。请求模型可以有多种形式。在许多组织中，它将简单地记录在文书中；而在其他组织中，将使用工作流工具。\n\
  \n## 请求的完成与关闭\n\n当请求完成后，就可以将其关闭。通常会有两个阶段的关闭。第一阶段仅记录从服务提供者的角度来看，履行操作已经完成。第二阶段是最终关闭，应在咨询请求者后才执行。\n\
  \n如果执行的服务是收费的，那么在此时将触发相应的计费机制。这可能是发送账单或注册充值。服务台在最终关闭之前，应该检查请求文档是最新的，并确保其分类正确。对 `CMS`\
  \ 的任何更新都需要已完成。这也是进行满意度调查的时间。\n\n## 触发器、输入、输出和接口\n\nITIL 要求每个过程都应该有一个触发器，以及过程活动的输入和输出。每个过程还将与其他许多过程拥有接口。\n\
  \n### 触发器\n\n如前所述，当用户提交请求时，就会触发请求履行过程。正如你所看到的，这可能直接交付给服务台，或者通过 Web 门户交付，用户可以在门户上从可能的请求列表中进行选择。\n\
  \n### 输入\n\n该过程的主要输入是来自用户的请求。正如你所看到的，这可以通过多种途径，每种途径都有其特定的信息格式。另一个重要输入是某些请求可能需要的授权表。某些请求可能被记录为\
  \ `RFCs`。某些请求是为了获取信息，而另一些是为了为了提供的标准商品或服务。\n\n### 输出\n\n以下列表包含了过程输出的示例：\n\n* 已授权或被拒绝的请求，以及已取消的请求。\n\
  * 某些请求可能会重新路由为事件。例如，用户请求一台新笔记本电脑，因为他们目前的机器不断崩溃。这可以被重新路由以解决故障，从而节省购买新设备的不必要支出。\n\
  * 过程可能会输出状态状态报告。\n* 在需要标准变更时，必须创建一个 `RFC`。\n* 某些请求可能被路由为变更，因为它们要求的是非标准产品或应用程序，并且需要在组织内批准使用。\n\
  * 请求在履行过程中应不断进行更新。\n* 当请求完成后，输出将是一个已履行的请求，然后应该被关闭。\n* 最终输出是在进行标准变更后对 `CMS` 的更新。\n\
  \n### 接口\n\n与请求履行相关的主要接口示例如下：\n\n**IT 服务财务管理**：某些请求可能是收费的，并且可能需要财务批准。\n\n**服务目录管理**：可以被请求的服务应列列在\
  \ `service catalog` 中。\n\n**发布与部署管理**：当请求涉及新或升级组件的自动部署时，它将与请求履行建立接口。在这种情况下，发布是预定义的、构建的并测试过的，然后根据请求进行部署。\n\
  \n**服务资产与配置管理**：在作为履行活动的一部分可能进行的任何更改后，需要更新 `CMS`。在适当的情况下，软件许可检查和更新也是必要的。\n\n**变更管理**：当需要通过变更来履行请求时，它需要被记录为\
  \ `RFC` 并通过变更管理进行推进。\n\n**事件与问题管理**：如讨论，请求可以使用事件管理过程进行处理。在适当的情况下，有必要将 IT 发出的服务请求与产生这些请求需求的任何事件或问题相关联。\n\
  \n**访问管理**：该过程可能参与请求履行活动，以确保提交请求的人根据信息安全策略获得了授权。请求履行可以作为访问管理过程在创建和删除账户方面的输入。\n\n\
  ## 信息管理\n\n请求履行过程严重依赖于正式服务请求的信息，这些信息可能以下内容：\n\n* 正在请求什么服务。\n* 谁请求并授权了该服务。\n* 将使用哪个过程来履行请求。\n\
  * 请求被分配给谁以及采取了什么行动。\n* 记录请求的日期时间以及采取的所有行动的日期时间。\n* 关闭细节。\n* `RFCs`：在某些情况下，请求履行过程将由\
  \ `RFC` 启动。当服务请求涉及 `CI` 时，这是很典型的。\n* 服务组合，以便识别约定的服务请求范围。\n* 规定在提供服务时必须执行或遵守的任何控制的安全策略——例如，确保请求者有权访问该服务，或软件已授权。\n\
  \n每个组织都必须定义自己的需求，因为请求履行过程会因组织而异。\n\n## 过程角色\n\n有许多角色需要支持请求履行过程，这些并不是职位名称，但每个组织都需要理解自己的需求并适当分配角色。\n\
  \n### 请求履行过程所有者\n\n请求履行过程所有者的职责可能包括：\n\n* 执行请求履行过程的通用过程所有者角色（见第 1 章）\n* 设计请求工作流和模型\n\
  * 与其他过程所有者合作，以确保跨所有方法的集成方法\n\n### 请求履行过程经理\n\n请求履行过程经理的职责可能包括：\n\n* 执行请求履行过程的通用过程经理角色（见第\
  \ 1 章）\n* 计划和管理请求履行工具和过程的支持\n* 协调此与其他服务管理过程之间的接口\n* 处理员工、客户和管理层的关注、请求、问题和查询\n* 确保请求履行活动在服务水平目标内运行\n\
  * 主动寻求过程的改进\n* 管理客户和用户对过程反馈的收集\n* 管理资源和资源水平\n* 确保及时并按照任何所需的授权执行服务请求\n* 在 `CAB` 上代表请求履行工作\n\
  * 审阅过程记录以确保其准确性和一致性\n\n### 请求履行过程从业者/分析师\n\n该角色负责日常活动，并确保以高水平客户满意度完成服务请求。该角色包括：\n\
  \n* 提供单点接触和端到端责任，以确保服务请求得到正确执行\n* 在接触点对服务请求进行分拣以分配资源\n* 向涉及该过程的其他过程领域通信服务请求\n* 确保服务请求被妥善记录\n\
  \n\n\n\n\n服务请求的初始处理通常在服务台（service desk）完成，但最终的履行将根据需要由适当的服务运营人员或供应商承担。通常不需要识别额外的或特定的角色。在某些工作量足以证明其价值的情况下，可能会创建一个专门团队来执行该流程。\n\
  \n## 关键成功因素与关键性能指标\n\n请求履行有几个可能的关键成功因素（CSF），每个 CSF 都会有相应的关键性能指标（KPI）来显示是否实现了该 CSF。在查看\
  \ CSF 和 KPI 之前，让我们先花一分钟时间一下这些术语的含义：\n\n- CSF 是对一个流程若要判断为成功必须实现的目标的高层陈述。通常，一个流程只有三个或四个\
  \ CSF。`CSF` 无法直接衡量；这正是 KPI 的作用。\n- `KPI` 是衡量 `CSF` 某些方面的度量。每个 `CSF` 将有三个或四个相关的 KPI。\n\
  \n以下是请求履行的的一些 CSF 和 KPI 示例：\n\n- 关键成功因素：“必须以高效且及时的方式履行请求，并符合每种类型请求约定的服务水平目标。”\n\
  \  该 `CSF` 可能相关的 KPI 如下：\n  - 处理每种类型服务请求的平均耗时\n  - 在约定目标时间内完成的服务请求数量和百分比\n  - 第一个\
  \ KPI 与及时履行请求的要求有关，第二个 KPI 与满足约定目标有关。你可能还会想到其他 KPI。\n\n- 关键成功因素：“应仅履行已授权的请求。”\n\
  \  可以通过以下 KPI 进行衡量：\n  - 已获得适当授权的履行服务请求百分比\n  - 与请求履行活动相关的安全威胁的事件数量\n- 关键成功因素：“必须维持用户满意度。”\n\
  \  以下示例是与 `CSF` 相关的 KPI：\n  - 用户对服务请求处理的满意度水平（通过某种形式的满意度调查进行衡量）\n  - 与请求履行活动相关的事件总数\n\
  \  - 当前未处理服务请求的积压量\n\n### 挑战\n\n在实施和运行请求履行流程时会遇到一些常见的挑战：\n\n- 确保流程范围被清晰定义，记录该流程将处理或不处理的请求类型，以及哪些请求需要提交给变更管理。\n\
  - 提供一个有效的门户网站，鼓励用户在上面提交请求，而不是拨打服务台。必须与业务部门就每种请求类型达成明确的目标。这些目标将记录在服务水平协议（SLA）中。\n\
  - 与业务部门就应何处、何时以及如何寻求授权达成一致。遵循组织内部现有的正常预算控制是重要的。\n- 同意履行请求的成本，指定是否要重新收费，并确保服务请求不违反信息安全策略。\n\
  - 以易于访问的格式提供有关可用请求类型的信息，通常作为服务目录的一部分。\n- 为每种所请求的服务提供带有预定义流程流的文档化请求模型，以确保所有请求都遵循预定义的标准履行程序。\n\
  - 确保通过 Web 门户提交的所有服务请求都能得到及时处理，并符合约定的 SLA 目标，以确保客户满意度。应定期进行客户满意度调查。\n\n### 风险\n\n\
  请求履行流程面临五种常见风险：\n\n- 范围定义或沟通不当将导致用户和 IT 人员不清楚流程将处理和不处理什么。\n- 门户网站定义或实施不当将导致无人使用。用户将继续拨打服务台，导致流程的一个主要收益丧失。\n\
  - 后台履行活动设计不合理或资源不足将意味着流程无法有效或高效地运行。目标无法实现，积压将增加，客户满意度将大幅下降。\n- 监控能力不足将防止指标的收集，导致无法进行绩效。\n\
  - 如果基于 Web 的工具对组织来说是一个新概念，用户可能不愿意使用。\n\n## 访问管理\n\n访问管理是授予授权用户使用服务的权限，同时防止未经授权的用户获得访问的过程。它有时也被权限管理或身份管理。\n\
  \n### 目的\n\n在基础培训中，你已经涵盖了信息安全管理流程及其在定义安全策略中的作用。实施许多此类策略的流程就是访问管理。该流程为拥有所需授权的用户提供所需服务的能力。确保只有授权个人可以访问数据是每个\
  \ IT 服务提供者关注的问题；未能正确执行可能会导致损害并可能违反法律或法规要求。考虑一下如果一个组织因访问管理流程不当被发现允许非法访问医疗或银行记录，可能会造成什么损害。\n\
  \n组织需要确保，不仅在新员工入职并设置系统和服务访问权限时管理访问，在员工离职时也要进行管理。许多组织面临的挑战是，员工在部门之间变动时跟上不断变化的访问需求。通常会申请新的访问权限，但从未确定过新职位是否仍然需要现有的访问权限；因此，如果不执行这一步，该个人在多年后可能会积累大量的权限。这在一定程度上取决于业务部门告知\
  \ IT 服务提供商员工的部门变动；在请求额外访问时，IT 提供商应定期查询现有访问是否仍然需要。\n\n可能也会限制访问的情况——例如，在对疑似违规行为进行调查期间，防止任何证据被销毁。此类请求通常由高级管理或人力资源部门提出。\n\
  \n### 目标\n\n访问管理流程的目标是完成以下工作：\n\n- 管理服务的访问，执行信息安全管理中定义的策略（见第 15 章，“发布、控制和验证的技术与实施考虑因素”）。\n\
  - 确保所有访问请求都经过验证和授权。这可能包括限制或删除访问的请求。\n- 确保请求得到高效处理，在授权和控制的要求与对业务需求响应的需求之间取得平衡。\n\
  - 确保（一旦授予权限）根据安全策略使用已授予的权限。这可能包括例如用于个人用途的 Internet 访问。尽管允许某些个人用途，但可能某些类别的网站是不允许访问的。\n\
  \n### 范围\n\n\n\n\n\n正如我们所说，访问管理的范围是高效执行信息安全管理策略。执行这些策略可确保组织数据和知识产权的`confidentiality`、完整性和可用性（CIA）得到保护。这里的“机密性”意味着只有经过授权的用户才能看到数据。“完整性”意味着数据免受损坏或未经授权的更改的影响。“访问管理”则确保用户获得使用某服务的权利。这并不保证该服务在服务时间内始终是可用的，那是可用性管理的职责。\n\
  \n访问请求通常通过请求管理过程提出。某些组织会维持一个专门团队来执行请求，但更常见的是由其他部门执行。技术和应用管理职能会参与其中，流程很大一部分可以在服务台（service\
  \ desk）内部处理。应该有一个单一的协调点以确保一致性。\n\n### 价值\n\n访问管理过程为业务带来了多处利益：\n\n* 首先，通过控制对服务的访问，它保护了组织信息的机密性。例如，客户机密性是许多组织关注的重点。\n\
  * 第二大利益是员工拥有相应水平的访问权限来履行其职责。\n* 第三大利益是该过程提供了一种跟踪用户使用服务的方法。\n* 有时可能需要快速撤销访问权限——例如，如果用户被怀疑有犯罪行为。该流程能够实现这一点。\n\
  * 最后，该流程不仅通过管理访问来支持法规和法律合规性，还通过证明访问是经过管理的来实现。\n\n### 策略\n\n`ITIL Service Operation`出版物描述了用于访问管理的五项很有用策略。\n\
  \n* 第一项策略是对我们已经提到的内容的正式声明，特别是对服务的访问管理是由信息安全管理定义的策略和控制所引导的。其影响是，如果收到不常的访问请求，且该请求似乎不符合信息安全管理设定的指南，则应将该请求升级到信息安全管理部门。它不能由访问管理部门自行决定授予。\n\
  * 另一项策略是服务的使用应该被记录和跟踪。这里的 `Tracked` 意味着应该对访问进行实时监控，并在适当的情况下触发事件。这对服务设计人员也有影响——服务必须内置记录活动的的手段。\n\
  * 第三项策略是，该过程必须保持访问权限的最新状态。特别是在个人变更角色或离开组织时，应当修改权限。\n* 第四项策略与第二项相关。它规定该过程应该维护成功和未成功访问服务尝试的准确历史。这些信息将很有用，例如供审计员稍后检查。\n\
  * 最后一项策略是，应该对任何威胁安全的事件定义升级程序。\n\n## 原理与基本概念\n\n我们现在将检查一些基本的访问管理概念。\n\n**访问 (Access)**：指用户有权使用的服务功能或数据的级别和范围。\n\
  \n**身份 (Identity)**：指关于用户的信息，这些信息将其作为个体区分来，使其能够被唯一识别并验证其在组织中的状态。\n\n**权利或权限 (Rights\
  \ or Privileges)**：指为用户提供访问设置——例如读取、写入、执行、更改和删除。\n\n**服务组 (Service Groups)**：提供了一种简化分配权限任务的方法。服务组背后的想法是存在一组用户，他们对同一组服务需要完全相同的权限。不是单独授予权限，而是创建一个具有所需权限集的服务组。用户与服务组关联，并将继承组的权限。\n\
  \n**目录服务 (Directory Services)**：指用于管理访问和权限的特定类型工具。\n\n## 流程活动、方法和技术\n\n理解流程中的步骤和活动非常重要，如图\
  \ 3.4 所示的访问管理流程图。我们将查看流程的每一个步骤。\n\n![流程图显示了访问管理流程，其中变更请求、服务、人力资源和应用程序脚本流汇合到接收、验证、有效性决策（用户、请求和访问）等。](img/00020.jpeg)\n\
  \n**图 3.4**](#part0010_split_003.html_figureanchor3-4) 访问管理流程\n\nCopyright © AXELOS\
  \ Limited 2010\\. 保留所有权利。材料根据 AXELOS 的许可进行复制。\n\n### 请求访问\n\n访问请求可以通过多种方式提出：\n\n\
  * 访问请求可以通过请求履行门户作为服务请求来处理。\n* 它可能源于请求表单的完成。\n* 如果访问的变更影响了许多用户，则可能会使用变更请求。例如，新服务的过渡意味着要更新所有使用该服务的人的访问权限。\n\
  * 另一种路线是通过自动化过程。例如，每年学院或大学都会招收数以千计的新学生，他们每一个人都必须获得学生 IT 服务的访问权限。这通常在学生实际注册时由学生注册系统自动完成。\n\
  * 请求也可能从 HR 系统自动发出，当记录新员工或现有员工状态发生变化时（例如有人辞职、转岗或升职）。\n\n所有请求，无论是否有效，都会被记录。\n\n###\
  \ 验证与确认\n\n随后必须对访问请求进行验证。必须确认请求者的身份，并判断访问需求是合法的。\n\n通常，接受现有用户的用户名和密码作为身份证明。在更安全的环境中，可以使用生物识别数据或物理识别设备。\n\
  \n对于新用户，将需要某些身份的物理证明，例如官方身份证明（如护照或驾照）。\n\n新用户不仅包括新的正式员工，还包括临时和第三方用户，如访客、合同工和供应商。组织将定义如何验证请求。\n\
  \n验证的第二个方面是检查请求是否合法——即该用户是否有被授权拥有所请求的权限。这种验证必须独立于请求者。用户不能验证其自身请求的合法性。通常，请求将由部门经理或人力资源部门验证。通过\
  \ `RFC` 提交的请求已通过变更管理过程授权。\n\n某些服务将供任何请求的人可以使用；应该有一项定义此内容的策略。如果请求无效，则将进行记录并返回给请求者。如果认为必要，可能会启动事件来调查为什么会创建无效的请求。有效的请求将得到恰当的处理。\n\
  \n### 提供访问\n\n提供权限的任务通常委托给具有必要知识和技能的专家技术或应用团队。这项任务可以使用与多个应用程序接口的访问管理工具来自动化。当然，这只有在应用程序设计中包含此项需求时才是可能的。\n\
  \n\n\n\n\n访问权限与角色相关：薪资结算职员有权使用薪资结算系统。用户可以占据多个角色，每个角色都会带来一组权限，有时这些权限会与某些企业策略（如职责分离）发生冲突。例如，通常的做法是确保向供应商下订单的人不能授权付款。当发生角色冲突时，访问管理应将问题升级给相关的利益相关者，该人员应是相关业务部门的人。（例如，如果角色属于财务部门，则会将问题提交给该部门的相关利益相关者；如果角色属于\
  \ IT 部门，则咨询相关的 IT 经理。）\n\n## 监控访问\n\n权限授予后，应对用户状态进行监控，以确保他们对该访问仍有有效需求。在实践中，这很难实现。访问管理应收到员工离职的通知以便撤销其权限，许多组织拥有完健全的程序来确保这一点的落实。许多组织在跟踪用户不断变化的角色及随后的访问需求方面存在困难，特别是对于那些在机构工作多年的员工。在这种情况下，新的访问需求被添加到现有权限中，而没有验证现有权限是否仍然需要。应该考虑在访问请求表中增加关于现有访问需求的问题。人力资源部门需要意识到向访问管理提供有关职位变更信息的重要性，以保护组织的数据。访问管理应该理解这些不同类型的员工变更，并确定如何感知这些变更。理想情况下，这将通过与人力资源系统的接口实现自动化的。未能响应状态变化是一个常见的安全问题。例如，它会导致即使用户已经离开组织，其计算机账户仍处于可用状态。\n\
  \n跟踪访问活动可能会触发安全事件，例如，合法用户尝试访问某服务未成功。\n\n## 移除访问\n\n我们将查看的最后一个活动是移除或限制用户的权限。在许多情况下，这可能是必要的。尽管在许多情况下这种修改是永久的（例如解雇或升职的情况），但也可能存在仅是临时的情况。例如，在某些组织中，用户休假时其计算机账户会被挂起。\n\
  \n当用户离开组织时，应永久撤销访问；再次，人力资源部门需要理解在这种情况下快速通知访问管理的重要性。\n\n访问管理必须确保权限不被不当使用，这要求对访问进行记录和跟踪。所需的监督程度在服务设计时确定，并提供适当的日志机制。如果检测到可能的误用，流程必须做出相应响应。这通常涉及启动安全事件并提醒利益相关者。在这种情况下，访问可以在调查期间临时撤销，如果误用被认为是无意错误，则恢复访问；如果发现是故意的，则永久撤销。访问管理流程可能被要求提供访问记录，可能是在犯罪行为调查的背景下。\n\
  \n## 触发器、输入、输出和接口\n\n接下来让我们考虑流程的触发器、其输入和输出，以及它与其他流程共享的接口。\n\n### 触发器\n\n访问管理的触发器是用户或多个用户访问服务或一组服务的请求。这可能源于多种情况。\n\
  \n第一个可能的触发器是 `RFC`，特别是当需要大量访问更改时，也许作为发布或项目的一部分。\n\n另一个可能的触发器是服务请求。这通常通过服务台发起，或直接输入到请求履行系统中，并由相关的技术或应用管理团队执行。\n\
  \n来自人力资源部的请求是另一个可能的触发器。在这种情况下，人力资源管理人员通过服务台提交请求。这些请求通常是招聘、升职、调动、终聘或退休的结果。\n\n最后一个触发器可能是部门经理的请求，该经理可能担任人力资源角色，或者可能决定开始使用某项服务。\n\
  \n### 输入\n\n流程的输入是与触发器相关的内容，例如：\n\n* 授权的 `RFCs` 和授权的授予或终止访问权限的请求\n*   企业安全策略\n*\
  \   关于用户身份的任何信息\n\n其他输入是授予服务访问、执行访问管理管理活动以及响应与访问管理相关的事件的操作和服务水平需求。\n\n### 输出\n\n\
  访问管理流程具有以下输出：\n\n*   根据信息安全策略提供 IT 服务的访问\n*   访问管理记录，显示何时授予或拒绝了访问，以及被拒绝的原因\n*  \
  \ 关于不当访问或滥用服务的及时通信\n\n### 接口\n\n访问管理流程与许多其他服务管理流程对接。\n\n一个关键接口是与信息安全管理的接口。如前所述，访问管理在信息安全管理的指导和指示下运行，并在确保满足信息安全策略要求方面起着至关重要的作用。\n\
  \n许多访问请求将来自变更管理流程，形式为授权的变更请求甚至是标准变更。\n\n通过服务水平管理流程，与业务部门逐项服务地商定访问需求和标准。\n\n该流程与\
  \ IT 服务连续性管理之间的关系很有趣。如果启动连续性计划，访问需求可能需要发生变化。此外，在测试计划期间，可能需要授予临时访问。\n\n请求履行为用户提交访问请求提供了途径。\n\
  \n## 信息管理\n\n信息对于访问管理的成功至关重要，它是身份定义的一部分。\n\n### 身份\n\n用户身份可能包含的内容示例包括\n\n*   姓名\n\
  *   地址\n*   联系详情，如电话号码和电子邮件地址\n*   实体文件，如驾照、护照或结婚证\n*   指向文档或数据库条目的编号，如员工工号、税号、政府身份号码、驾照号\n\
  *   生物识别信息，如指纹、视网膜图像、语音识别模式、DNA\n*   过期日期（如果相关）\n\n访问管理应向任何合法用户提供 IT 服务或组织信息。这些可能包括正式员工或组织临时雇佣的承包人员、供应商人员（如客户经理或支持人员）或客户。\n\
  \n\n\n\n\n通常情况下，组织负责在用户加入并授予 IT 系统或服务的访问权限之前验证其身份。但 IT 部门需要验证所提供的信息与正确的人相关联。组织的安全级别越高，验证个人身份时所需的信息就越多。\n\
  \n管理临时访问与管理永久访问同样重要。任何身份识别都将被记录并作为员工记录的一部分存档。\n\n### 用户、组、角色和服务角色组\n\n将大量用户分组通常有助于更有效地管理访问权限。可以使用\
  \ `user profile` 或 `user template` 术语来描述这些分组。\n\n许多组织拥有一套用户可以访问的标准服务集，并可以使用此对用户进行分组。但这必须足够灵活，以满足个性化需求，同时提供足够的控制。用户角色目录可能有助于定义用户组。\n\
  \n然而，所有组或用户的数据配置必须遵守相关的法律或治理规定——例如英国的《数据保护法》(Data Protection Act (UK)) 或美国特定的州法律。这应该作为信息安全管理策略的一部分予以规定。\n\
  \n## 过程角色\n\n这些是由访问管理过程执行的角色和职责。与所有服务管理过程一样，为组织定义的角色取决于其需求。\n\n### 访问管理过程所有者\n\n\
  访问管理过程所有者的职责可能包括：\n\n*   执行访问管理过程的通用型过程所有者角色（见第 1 章）\n*   设计访问请求工作流\n*   与其他过程所有者合作，确保在整个生命周期内采用集成方法管理访问请求\n\
  \n### 访问管理过程经理\n\n访问管理过程经理的职责可能包括：\n\n*   执行访问管理过程的通用型过程经理角色（见第 1 章）\n*   规划和管理对访问管理工具和过程的支持\n\
  *   协调访问管理与其他服务管理过程之间的接口\n\n### 访问管理过程从业者/其他角色\n\n访问管理是信息安全管理和可用性管理过程的操作执行。因此，从业人员角色最可能是根据信息安全策略的内容，由这些设计过程定义的。这些角色可以识别如下。\n\
  \n#### 服务台人员的角色\n\n服务台通常是验证访问某服务请求的首要接触点。这可以通过服务请求来完成，这可能需要验证正确的授权级别，以及请求访问的用户身份。\n\
  \n一旦验证通过，请求可能会传递给相应的团队进行处理。根据组织要求的安全级别，这可能在服务台处完成，也可能需要更高级别的技术访问。\n\n与访问管理过程相关的事件也将由服务台处理。\n\
  \n#### 技术和应用管理人员的角色\n\n技术和应用管理可能扮演几个重要角色：\n\n*   在服务设计期间，他们将确保访问管理需求是服务设计能力的一部分。这应该包括对服务访问的检测和监控，以及对任何访问相关问题或事件的管理方法。\n\
  *   在服务过渡期间，他们将参与并负责对服务的访问进行测试。\n*   在服务运行期间，这些团队通常将管理其控制的系统的访问。\n*   技术和应用管理还将参与解决访问相关事件和问题的解决。\n\
  *   在服务台被授予管理特定服务访问权限的情况下，技术和应用管理必须确保提供适当的培训。\n\n#### IT 运营管理人员的角色\n\n如果存在运营管理职，通常做法是将访问管理活动委托给该组。这包括提供或撤销对服务或系统的访问权限，并且需要关于此类此类访问的明确指令。\n\
  \n如果存在运营桥接层（operations bridge），它可能负责管理访问事件的监控。\n\n## 关键成功因素和关键性能指标\n\n《ITIL 服务运营》出版物建议访问管理有三个关键成功因素\
  \ (CSF)。\n\n第一个是“确保根据信息安全策略保护服务的机密性、完整性和可用性”。KPI 显示是否实现了这些 CSF。第一个 KPI 是涉及不适当安全访问或尝试访问服务的事件百分比。你可以看到，这衡量的是访问管理不当导致的实际后果。第二个\
  \ KPI 是发现已变更角色或离开公司的用户访问设置错误的审计发现项数量。这衡量的是由于访问管理不当导致安全疏漏的可能性。\n\n访问管理的第二个 CSF 是“以足够满足业务需求的方式为服务提供适当的访问”。对此对应的示例性\
  \ KPI 是在既定 SLA 和 OLA 内提供的访问请求百分比。\n\n访问管理的最后一个 CSF 是“对于不当访问或滥用服务提供及时的沟通”。这（该项 CSF）以及建议的减少访问相关事件平均持续时间（从发现到升级的时间）的\
  \ KPI，都是为了确保任何任何问题都能得到及时处理。\n\n### 挑战\n\n为了使访问管理成功，它必须克服许多挑战。它必须能够做到以下：\n\n*   验证用户和审批人或机构的身份。\n\
  *   验证用户是否具备访问特定服务的资格。\n*   将多个访问权限关联到单个用户。\n*   随时确定用户的状态，例如评估他们是否仍是员工。\n*   管理用户访问需求的变更。\n\
  *   限制对未经授权用户的访问权限。\n*   维护一个包含所有用户及其被授予的的的数据库。\n\n应对这些挑战需要巨大的努力。\n\n### 风险\n\n\
  最后，我们考虑访问管理面临的风险。当然，未能满足前节中描述的任何挑战都是一种风险。还有五个额外的风险：\n\n*   第一个风险是缺乏适当的支持性技术，导致依赖于易出错的人工干预。\n\
  *   第二个风险是控制来自应用程序接口等“后门”源的访问。\n*   第三个风险是管理和控制来自外部第三方供应商的服务的访问。第三方可能出于各种合法原因需要访问，但这种访问通常是偶发且无计划的，这使得管理变得困难。\n\
  *   缺乏对该过程的管理支持是所有服务管理过程的风险。这里的一个特殊问题是，管理层通常认为安全控制阻碍了他们及其员工完成任务，因此不支持他们。\n*   存在访问控制阻碍用户开展业务的风险。\n\
  \n## 总结\n\n本章探讨了服务运营阶段的后续过程：事件管理、请求履行和访问管理。\n\n\n\n\n我们涵盖了利用事件监控来管理大量项目，以及对特定事件的自动化响应如何改进服务的交付。我们还解释了事件在流程自动化中的作用。\n\
  \n我们讨论了 ITIL 的核心概念 `events`（事件）和 `alerts`（告警），以及事件管理如何通过预判故障或缩短识别时间来提高可用性。最后，针对这一流程，我们考虑了实施事件管理流程面临的技术和人员挑战，以及该流程中包含的角色。\n\
  \n我们还探索了请求履行流程。我们讨论了服务请求的关键 ITIL 概念，以及请求履行流程如何通过加速简单的用户需求来节省时间和资金。\n\n我们深入研究了该流程，涵盖了其目的、目标、范围和价值。我们考虑了其策略、原则、活动和基本概念，以及如何衡量其成功。我们还讨论了哪些因素可能阻碍成功实施。本章还探索了适用于该流程的角色。\n\
  \n本章还涵盖了访问管理的目的、目标、范围和价值。我们讨论了策略、原则和基本概念；流程活动、方法和技术；触发器、输入、输出和接口；关键成功因素和关键绩效指标；以及挑战和风险。\n\
  \n你学习了 ITIL 的核心概念 `access`（访问）、`identity`（身份）、`rights`（权限）和 `service groups`（服务组）。\n\
  \n我们讨论了访问管理在防止未经授权访问数据方面，以及监控访问权限时出现的一些问题。这对参与管理此活动的人员的角色职责的探索。\n\n我们研究了以下关键 ITIL\
  \ 概念：\n* `Active monitoring` 主动监控\n* `Alert` 告警\n* `Event` 事件\n* `Identity` 身份\n\
  * `Information security management` 信息安全管理\n* `Information security policy` 信息安全策略\n\
  * `Monitoring` 监控\n* `Passive monitoring` 被动监控\n* `Request model` 请求模型\n* `Threshold`\
  \ 阈值\n\n# 考试要点 (Exam Essentials)\n\n**理解事件管理的目的、目标和范围。** 描述 `events`（对 CI 管理具有意义的状态变更）和\
  \ `alerts`（故障或突破阈值）以及它们之间的区别。能够提供各者的示例。\n\n**理解事件管理在自动化中的作用。** 描述 `passive monitoring`（被动监控）和\
  \ `active monitoring`（主动监控）及其区别。能够提供各者的示例。理解过滤 `events` 的重要性，并解释有效的事件管理如何减少停机时间。能够解释对某些类型事件的自动响应。\n\
  \n**了解事件管理如何有利于客户和 IT 部门。** 理解通过少数员工监控大量 CI 和服务所获得的效率益处。理解通过减少停机时间来提高可用性对业务的益处。\n\
  \n**理解如何使用事件管理来监控业务事件和环境状况。** 能够解释事件管理流程如何应用于技术 IT 环境之外。\n\n**理解请求履行的目的、目标和范围。**\
  \ 请求履行提供了一种向客户交付定义标准服务的有效手段，具有低风险的请求和定义的履行流程。它可以包括 IT 和非 IT 请求，并可以通过自帮助网络门户进行访问。\n\
  \n**了解请求履行如何有利于客户和 IT 部门。** 请求履行为客户提供了一种请求定义标准服务的简单、高效的手段，并使服务台和二线人员能够以最少的官僚程序完成请求。\n\
  \n**理解请求模型的使用。** 由于请求有预定义的履行流程，因此非常适合使用 `request models`，这些模型可以被编制到服务管理工具集中。\n\n\
  **理解技术和财务审批的必要性。** 虽然某些请求是预先授权的，但可能出现需要授权的情况。通常的企业财务控制仍然适用，因此预算持有者可能需要批准（例如购买设备）。技术授权可能是必要的，以确认请求与用户现有的设备兼容。\n\
  \n**理解在实现高效用户界面时使用网络门户和菜单选择。** 通过提供等同于在线商店的功能（配备“加入购物车”功能），可以极大增强请求履行。用户通过网上购物熟悉这种方法，它减少了服务台的数据输入需求。\n\
  \n**理解访问管理的目的、目标和范围。** 解释访问管理与 `information security management`（信息安全管理）之间的关系。访问管理不仅是授予访问——根据需要限制或移除访问。\n\
  \n**理解访问管理的主要流程活动。** 解释以下访问管理活动：请求访问、验证和确认请求、提供请求并监控其使用情况，最后在必要时将其移除。\n\n**理解并识别每个流程的角色和职责。**\
  \ 这不仅包括适用于所有情况的通用角色，还包括与每个流程相关的角色。\n\n# 复习题 (Review Questions)\n\n你可以在附录中找到复习题的答案。\n\
  \n1. 在哪些情况下，通过事件管理实施自动化支持来支持事件管理是合适的？\n    1. 事件的分级升级\n    2. 加快月底销售数字的处理速度\n  \
  \  3. 向当地警局发送“检测到入侵者”通知\n    4. 运行备份\n        1. 仅 3 和 4\n        2. 以上所有\n    \
  \    3. 仅 2 和 3\n        4. 仅 1, 3 和 4\n\n2. 事件管理可用于监控以下哪些内容？\n    1. 环境状况\n   \
  \ 2. 系统消息\n    3. 人员表\n    4. 许可证使用情况\n        1. 仅 1 和 2\n        2. 仅 2 和 3\n\
  \        3. 仅 1, 2 和 4\n        4. 以上所有\n\n3. 下列哪些是事件监控的类型？\n    1. 被动\n    2. 虚拟\n\
  \    3. 主动\n    4. 标准\n        1. 仅 1 和 2\n        2. 仅 2 和 3\n        3. 仅 1 和\
  \ 3\n        4. 以上所有\n\n4. 请求履行流程适用于以下哪些项？\n    1. 所有请求，包括 RFC\n    2. 仅限经过 CAB（变更委员会）批准的请求\n\
  \    3. 变更的紧急请求，因为该流程将确保快速实施\n    4. 具有记录在案履行程序的常见低风险请求\n\n5. 请求最可能由以下哪些人员履行？\n\
  \    1. 服务台人员\n    2. 二线人员\n    3. 服务水平经理 (SLM)\n    4. 业务关系经理 (BRM)\n        1.\
  \ 1 和 2\n        2. 以上所有\n        3. 1 和 3\n        4. 2 和 3\n\n6. 下列哪个陈述是错误的？\n\
  \    1. 请求需要 CAB 授权。\n    2. 当产生费用时，请求需要预算持有者的授权。\n    3. 当技术兼容性是一个问题时，请求需要技术管理层的授权。\n\
  \    4. 涉及变更的请求应主要是预授权的标准变更。\n\n7. 下列哪项是对访问管理的最佳描述？\n    1. 访问管理允许授权访问服务和数据。信息安全管理防止未经授权的人员获得访问。\n\
  \    2. 访问管理授予授权用户使用服务的权利，同时防止未经授权的用户获得访问。\n\n\n\n\n3. 访问管理负责制定安全策略。\n4. 访问管理决定用户应该拥有哪些服务的权限。\n\
  \n### 8. 为什么有效的访问管理对组织至关重要？\n\n1. 因为可能存在法律要求，对数据访问进行控制。\n2. 因为访问管理不善可能导致本该保护的数据泄露给未经授权的个人，从而导致可能损害组织声誉的负面媒体报道。\n\
  3. 因为有效的访问管理可以降低成本。\n4. 因为没有了它，潜在客户可能由于担心数据无法得到保护而犹豫于与该组织进行业务往来。\n5. 因为否则，决定允许哪些访问将变成一个\
  \ IT 决策而非业务决策。\n\n   1. 仅限 1, 2 和 4\n2. 仅限 1, 4 和 5\n3. 以上全部\n4. 仅限 1, 2, 4 和 5\n\
  \n### 9. 下列哪项*不是* 访问面临的挑战？\n\n1. 验证身份\n2. 验证访问请求\n3. 在用户更改姓名（例如结婚后）或与另一个用户同名时跟踪访问权限\n\
  4. 在用户换工作时跟踪需求的变更\n\n### 10. 访问管理何时可能会减少或移除访问？\n\n1. 如果用户处于长期休假状态\n2. 如果用户离开了组织\n\
  3. 如果用户正在接受不当行为的调查\n4. 如果用户在组织内部更换了工作\n\n   1. 以上全部\n2. 仅限 1, 3 和 4\n3. 仅限 2, 3\
  \ 和 4\n4. 仅限 1, 2 和 3\n\n# 第 4 章\n\n服务台 (Service Desk)\n\n**本章讨论了以下 ITIL 运营支持与分析高级考试目标：**\n\
  \n* ![images](img/00005.jpeg) 服务台角色\n* ![images](img/00005.jpeg) 目标\n* ![images](img/00005.jpeg)\
  \ 组织结构\n* ![images](img/00005.jpeg) 人员配置\n* ![images](img/00005.jpeg) 效率和有效性指标\n\
  * ![images](img/00005.jpeg) 外包时的问题与保障\n\n![](img/00006.jpeg) 本章和第 5 章“技术管理、应用管理和\
  \ IT 运营管理”涵盖了 IT 服务提供者如何组织以按标准交付服务。ITIL 指南中定义的四个功能是：服务台、技术管理、应用管理和 IT 运营管理。\n\n\
  ITIL 框架中描述的 `service desk`（服务台）是一个由专门工作人员组成的职单元，负责处理各种服务活动，通常通过电话、Web 界面或自动报告的基础设施事件进行。我们将详细介绍这一功能，因为它在客户和用户满意度方面起着至关重要的作用。虽然服务台工作人员的深度技术知识可能不如其他功能部门的人员，但他们的角色同样重要。\n\
  \n服务台功能是四个功能中可见度最高的；在每天的每一小时，他们都会与各个级别的业务用户接触。一个糟糕的服务台可能会导致对 IT 部门的整体印象不好，而一个高效的、以客户为中心的团队即使在服务运行低于约定的服务水平时，也能确保客户的满意度。\n\
  \n服务台的一个基本特征是它为需要帮助的用户提供单一接触点（SPOC）。无论用户需求如何，它都提供与 IT 的单一日常接口。它提供多种服务：\n\n* 处理事件，对于解决方案简单且在服务台权限范围内的事件，尽可能予以解决\n\
  * 拥有已升级到其他支持组进行解决的事件记录\n* 向问题管理流程报告潜在问题\n* 处理服务请求\n* 为用户提供信息\n* 就重大事件、即将到来的变更等与业务进行沟通\n\
  * 如果需要，为用户提供有关变更请求进展的接口\n* 跟踪第三方维护提供者的性能，确保他们按照事件和请求流程定义的提供约定的服务\n* 根据 `SLA` 中的目标监控事件和服务请求，并提供来自服务台工具的报告以显示实现的服务水平\n\
  * 按需更新 `CMS`（配置管理系统）\n* 采集由于事件导致停机的数据，供可用性管理使用\n\n## 角色\n\n提供单一接触点在许多行业中都被认为是良好客户服务的中心。如果没有服务台，用户将不得不识别他们应该联系哪一个\
  \ IT 支持团队。这可能会让业务感到困惑，导致问题解决的延迟。技术人员将浪费时间处理其专业领域之外的问题或可以由更初级的工作人员处理。\n\n提供良好的服务台带来许多益处：\n\
  \n* 提高客户服务的关注度\n* 提高客户满意度\n* 通过单一接触点更容易提供支持\n* 在服务台更快地解决事件并履行请求，无需进一步升级\n* 由于解决速度快，减少了故障对业务的影响\n\
  * 更有效地利用专业 IT 人员\n* 关于事件数量和性质的准确数据（从服务台工具中获取）\n\n### 目标\n\n正如我们已经说过的，服务台的主要目标是提供单一接触点。一个仅集中于此目标、记录并升级每一个事件的台台，并不是服务台；它是一个呼叫中心。服务台与呼叫中心的区别在于其下一个同样重要的目标：在发生故障时尽可能快地恢复服务。这并不意味着事件得到了完全解决；相反，可能意味着提供一种通融方案（workaround），使用户能够继续工作。履行请求、重置密码或回答“我如何……？”之类的查询都能帮助用户尽快恢复工作。\n\
  \n服务台还承担以下职责：\n\n* 以适当的详细程度记录所有事件和请求\n* 对事件和请求进行分类以供未来分析\n* 根据影响和紧急性与用户商定正确的优先级（尽可能利用\
  \ `SLAs` 以保持一致性）\n* 尽可能调查、诊断并解决事件\n* 当服务台无法解决事件时，决定将事件升级到正确的支持团队\n* 监控支持团队对事件的进展进展\n\
  * 向用户沟通进展\n* 与用户确认已解决事件的关闭\n* 代表用户拥有事件，以确保其进展直至解决\n* 开展调查以确定客户和用户的满意度\n\n这些活动在第\
  \ 2 章“事件和问题管理”中的事件管理部分有更深入的介绍，在第 3 章“事件管理、请求履行和访问管理”中的请求履行流程部分也有介绍。\n\n\n\n\n\n\
  ### 本地服务台席\n\n此选项提供一个与其服务的用户同地的服务台席；一个拥有三个办公室的组织将拥有三个本地服务台席。这种方法的优势在于服务台席是本地的，因此它理解当地的业务优先级。对于办公室遍布不同国家的组织，本地服务台席可以使用当地用户的母语言提供支持，在同一时区工作，拥有相同的公共节假日等。当不同地点有专门的支持需求时，这种结构也可能有用。它仍然保留了“单一接触点”的基本原则，因为从用户的角度来看，他们只有一个电话号码可以拨打，并且不知道可能存在其他其他服务台。\n\
  \n这是一个昂贵的选项，因为每个新的办公地点都需要一个新的服务台席。每个服务台都需要足够的人员，以备于年假、培训和病假。在空闲时，会有几名服务台席人员分散在各个服务台等待来。由于事件和请求以不同的语言记录，可能会产生潜在问题；这使得事件分析和问题识别变得困难。知识共享也变得更加困难：一个可以由某个服务台席解决的事件可能会被另一个服务台升级，因为解决方案没有在各个服务台之间共享。韧性也可能是另一个问题。对于本地分布式的服务台，可能有每个服务台为其他服务台提供的选项，但现实中这可能很难实现。\n\
  \n为了克服这些问题，IT 管理必须确保信息的有效共享。需要建立相关程序，以确保影响超过一个地点的问题得到有效管理，而不产生重复劳动（即每个服务台席都假设由另一个服务台席负责）。图\
  \ 4.1 显示了本地结构。\n\n![图像显示了本地服务台席，不同的用户图标连接到客户站点，向下连接到服务台席，后者分支为技术管理、应用管理、IT 运营管理、第三方支持和请求履行。](img/00021.jpeg)\n\
  \n图 4.1 本地服务台席\n\nCopyright © AXELOS Limited 2010. 保留所有权利。材料根据 AXELOS 的许可复制。\n\n\
  ### 集中式服务台席\n\n服务台更常见的结构是集中式服务台席。在这种模型中，所有用户都联系同一个服务台席。这种模式的好处是提供了规模效应，因为没有提供上的重复。对于集中式服务台席，采用特殊技术（如智能呼叫分配或集成服务管理工具）可能是合理的，但在许多站点实施此类技术时则可能如此。对于重大事件的归属不会产生困惑，知识共享也变得直观得多。在需求低迷时提供服务，只需为一个服务台席配备人员，更具成本效益。\n\
  \n集中式服务台席的人员将对特定事件获得积累的经验，而本地服务台席可能偶尔遇到这些事件，这提高了立即解决这些问题的能力。当集中式服务台席支持许多国家的用户时，语言问题可以通过以下方式解决：\n\
  \n*   雇佣具备语言技能的员工，并使用技术手段将需要特定语言支持的呼叫分配给具备该语言能力的人员。员工随后用主语言记录呼叫。\n*   统一使用一种语言；呼叫者需要用该语言报告事件，并用该语言提供支持。此选项取决于组织的类型，以及是否可以合理预期用户能够使用该语言交流。\n\
  *   可能需要本地超级用户来支持没有必要语言能力的用户，并代表他们记录呼叫。\n\n为了给全球组织提供支持，可能需要 24/7 服务。当解决方案需要物理干预时（例如，清理打印机），服务台席需要本地支持人员，他们可以被分配呼叫并负责更新事件记录，或者协助解决远程站点的问题。\n\
  \n还应该考虑维护业务连续性，因为影响集中式服务台席的事件将影响整个组织的支持。必须结合 IT 服务连续性管理，制定并测试在发生灾难时从另一个地点（可能使用不同的员工）提供服务的计划。还应该制定计划，确保在网络中断或断电情况下服务台席工具的韧性。这种集中结构见图\
  \ 4.2。\n\n![图像显示了集中式服务台席，来自客户站点 1、2 和 3 的不同用户连接到服务台席，后者分支为技术管理、应用管理、IT 运营管理、第三方支持和请求履行。](img/00022.jpeg)\n\
  \n图 4.2 集中式服务台席\n\nCopyright © AXELOS Limited 2010. 保留所有权利。材料根据 AXELOS 的许可复制。\n\n\
  ### 虚拟服务台席\n\nITIL 描述的第三种组织选项是虚拟服务台席。此选项由两个或多个作为一个席运行的服务台席位置组成。呼叫和电子邮件分配给各个员工，就像他们位于同一个中心位置一样。这确保了工作量在所有席之间保持平衡。对于用户来说，虚拟服务台席看起来是一个单一实体；用户可能完全不知道事实并非如此。虚拟服务台席保留了单一接触点原则。\n\
  \n我们之前讨论的关于知识共享和清晰归属的考虑在这种场景下更为适用，所有呼叫必须立即记录的需求也是如此。如果用户拨打服务台席并详细解释问题，结果在第二次拨打时发现服务台席分析师找不到第一次呼叫的记录，他们将变得非常沮丧。这对于所有服务台席来说都是事实，但在团队成员未在一起的虚拟环境中，定位“丢失呼叫”的难度增加了。\n\
  \n可以像集中式席席一样，考虑将呼叫路由给具有特定语言知识的分析师，或为所有用户采用一种语言。呼叫必须在一个公共系统上记录，并使用一种语言，因为处理事件的下一个分析师可能在另一个地点。\n\
  \n虚拟服务台席结构允许多种工作方式。许多呼叫中心使用居家办公的员工，他们登录服务台席电话系统并分配呼叫。在繁忙时期，其他团队的额外员工可以补充核心服务台席人员，而用户感知不到。我们许多人都有过这样的经历：拨打本地公司电话，却在非工作时间或繁忙期间由海外人员接听。\n\
  \n离岸支持（在员工成本可能较低的其他地理位置提供支持）可能具有成本效益，但需要仔细的管理以确保服务的一致性。经理需要具有文化敏感性，因为用户可能会对员工以他们认为不熟悉的行为感到感到恼。\n\
  \n\n\n\n\n虚拟结构的一个优势是它具有内置的弹性；如果某个位置因为影响该地区的重大中断而离线，服务将继续进行，影响很少或没有影响。\n\n图 4.3 显示了虚拟服务台结构。\n\
  \n![图像显示了位于中心的虚拟服务台，连接并被来自巴黎、旧金山、里约热内卢、悉尼知识管理系统、伦敦和北京等地的服务台包围。](img/00023.jpeg)\n\
  \n图 43 虚拟服务台\n\nCopyright © AXELOS Limited 2010. 版权所有。材料根据 AXELOS 的许可复制。\n\n## 追日太阳\n\
  \nITIL 中描述的第四种结构被称为“追日太阳”（follow the sun）。这是虚拟服务台的形式，但通过这种结构，各个服务台之间的电话分配是基于一天中的时间而不是工作量。\n\
  \n追日太阳模式让全球组织能够提供 24 小时的支持，而无需雇佣员工在夜间负责服务台。若干服务台将各自按照标准办公时间工作。电话将分配给拨打时处于开放状态的一个或多个服务台。通常，这意味着欧洲服务台将处理电话直到欧洲工作日结束，随后电话将分配给北美的一个或多个服务台。当北美工作日结束时，电话将导向亚太地区的另一个或多个服务台，最后在下一个欧洲工作日开始前被导回欧洲服务台。\n\
  \n这种选项对许多全球组织来说是很有吸引力的，它提供了 24 小时的覆盖，而无需轮班或待班工资。前文提到的虚拟结构对有效电话记录、集中式数据库和数据输入通用语言的要求也同样适用于这里。还需要服务台之间的交接程序，以确保接手的服务台了解（例如）任何重大事件的状态。\n\
  \n对于用户而言，单一接触点原则仍然适用；无论无论是谁接听，无论服务台分析师位于何处，他们都有一个电话号码拨打。\n\n## 专门化服务台小组\n\n之前结构的另一种可能变体是为特定服务提供专家支持。在这种结构中，用户可以拨打通常的服务台电话，然后根据他们的问题选择一个选项。通常，信息会说：“如果电话涉及系统\
  \ X，请按 1；如果涉及系统 Y，请按 2；如果您的电话涉及其他任何内容，请稍候服务台分析师。”\n\n尽管这种方法可能有用，特别是在解决电话需要深入知识的情况下，但当它扩展到许多可供选择的选项随后又是更多选项时，用户对此并不喜欢。\n\
  \n存在一种风险，即用户并不总是知道自己需要什么支持，可能会选择错误的选项，导致延迟和挫败感。例如，打印机无法打印可能是由于硬件故障、网络问题、应用程序故障或用户错误。用户将不知道应该选择哪一个选项。\n\
  \n这种专家支持选项对于少数复杂服务效果最好，这些服务所需的业务和技术知识水平超过了对服务台分析师的合理预期。使用此选项的另一个可能是由于服务包含机密数据。在这种情况下，组织可能希望限制对少数专门支持工作人员的访问。\n\
  \n## 服务台单一接触点\n\n建立单一接触点是服务台通信的重要部分。无论为了满足组织的整体服务台结构选择了何种选项组合，单个用户对于在需要帮助时应该联系谁，或者在哪里可以获取自助支持应该没有疑问。应该提供并广泛宣传单一电话号码（如果选择单独的服务台，则每个小组提供一个号码），以及单一电子邮箱地址和单一网页服务台联系页面。\n\
  \n有几种方法可以帮助宣传服务台电话号码和电子邮件，并在用户可能需要它们时易于获取，例如在用户可能咨询的组件的硬件 CI 标签上包含服务台电话号码，并在电话上打印服务台联系详情。对于\
  \ PC 和笔记本电脑，可以提供带有服务台联系详情的自定义背景或桌面，可能包括如 `IP address` 和 `OS build number` 等信息。\n\
  \n通信服务台详情的其他常见方式还包括在赠品材料（笔、铅笔、马克杯、鼠标垫等）上打印服务台号码、在互联网/内网网站上公布，以及在必要访问服务台时留给用户的名片或满意度调查卡上包含。在发送给用户的所有信函中重复细节（连同通话参考号），并在用户可能经常访问的公告板或物理位置（入口、食堂、茶歇区等）放置细节，是维护服务台企业形象存在感的重要部分。\n\
  \n## 服务台人员\n\n服务台通常会使用服务管理工具和其他技术资源来执行其任务，并遵循定义的流程（特别是事件管理和请求履行）。尽管这些工具和流程非常重要，但服务台的人员方面是关键的。与客户和用户的交互除了良好的技术知识，还需要良好的沟通技巧。知道答案只是工作的一部分；用用户能理解的语言进行解释是至关重要的。\n\
  \n招聘和留住良好的服务台员工是客户满意度的关键。这一功能通常充当其他功能的入口，让员工对所有服务、支持这些服务的技术以及失败对业务的影响有自己的理解。这为未来的技术专门化提供了良好的基础。\n\
  \n服务台员工需要技术知识和人际技巧的结合。技术知识可能不深入，但涵盖了 IT 服务提供商提供的所有服务。服务台分析师可以被认为对许多服务略有了解，而不是对少数服务非常了解。\n\
  \n根据业务影响和紧迫性正确确定事件优先级的能力，要求服务台分析师对业务流程有良好的意识。除了这些知识外，还需要耐心、乐于帮助、在处理未能达到目标的支持团队或第三方时表现出果断、组织良好并在压力下保持冷静。\n\
  \n正如我们在本章节一节“服务台组织结构”中所讨论的，服务台根据组织的特定需求进行不同的组织。所需的技能水平也可能不同；服务台可能被要求解决高比例（75% 到\
  \ 80%）的事件，或者仅限于记录并将其升级由其他团队解决。\n\n\n\n\n\n# 服务台人员配置管理\n\n组织必须确保在任何时刻都有正确数量的人员，以匹配业务对服务台的需求。服务台接收的电话量通常会有所不同。计划建立新服务台的组织应尝试预测电话的拨入率和特征，并据此配置人员。对当前话量或类似规模的电话拨入率进行统计分析，将为理解需求提供良好的依据。\n\
  \n电话来电常见的模式是早晨出现一个高峰，在一天稍晚些时候可能还有另一个高峰，大约在下午早些时候。每个组织的情况都不同，但通常会发现一种循环的模式。随后可以调整人员配置以满足需求。\n\
  \n## 影响人员水平的因素\n\n在选择人员水平时，应考虑许多因素，包括客户服务期望和业务需求（如预算和电话响应时间）。\n\n自助服务工具和服务请求处理的自动化（例如\
  \ `password resets`）也将对人员水平产生影响，IT 基础设施和服务目录的规模、相对年龄、设计和复杂性也是如此。例如，人员配置可能会受到事件数量和类型，或部署的定制化程度而非标准现成软件的影响。\n\
  \n显然，某些因素会直接影响服务台的人员水平，例如使用不同语言的客户和用户数量、员工的技能水平以及处理的电话类型。不同类型电话所需的时间（例如简单查询、专业应用程序查询、硬件等）以及对于事件和服务请求的数量和类型是否需要本地或外部专业知识也是因素。\n\
  \n其他因素还服务台接听电话的时间、下班后的支持需求、需要覆盖的时区以及需要支持的地点（特别是如果服务台人员还负责现场支持，考虑到地点与地点之间的旅行时间）。理解请求的模式（例如，每日、月底）和现行的服务水平目标（响应级别）也将产生影响，所需的响应类型也是如此。目前使用的有多种接触机制：电话、电子邮件/语音信箱/视频、在线聊天、短信和在线访问/控制。员工为了支持流程和程序所需要具备的技能水平和培训程度，将确定服务台的发展需求。\n\
  \n这些都是在对人员水平做出任何决定之前需要考虑的因素。这些因素也应该反映在对文档水平的要求上。服务台往往是其成功的受害者，因为服务越好，业务部门使用得越频繁。\n\
  \n## 工作负载建模工具\n\n有许多工具可以帮助确定服务台合适的人员。这些工作负载建模工具取决于对组织的详细局部了解，例如话量和模式，以及服务和用户特征。行业标准建议\
  \ `1,000 users` 等于 `104 calls/day`，但这可能并不适用于所有组织。\n\n## 技能水平与策略\n\n服务台的技能水平取决于业务需求的性质。基础的电话记录服务只需要员工具备非常基础的技术技能，它能够处理大量的电话，但解决率会很低。由组织中最具技术技能的员工组成的技术性服务台将具有很高的解决率，但由于处理每个电话需要花费的时间，将无法处理大量话量。\n\
  \n所需的技能水平通常取决于目标解决时间（与业务部门达成并记录在服务水平协议中）、所支持系统的复杂性以及业务预算。响应和解决目标与成本之间存在很强的相关性。通常，目标时间越短，成本越高，因为需要更多资源。\n\
  \n关于服务台应该如何设置没有规定，但组织通常会从电话记录方法开始，技术技能排在第二、第三位，并随着时间的推移在服务台积累专业知识。改进第一线技能组的一种方法是考虑二线和三线支持团队的物理位置。更近的距离将能够并促进信息交换，并能够利用更具技术支持的人员为服务台的高峰期提供支持和备份。然而，必须记住二线员工通常还承担服务台之外的职责。此外，处理常规电话可能会降低经验丰富的员工积极性。另一个潜在的缺点是，服务台侧重于解决事件，而二线员工的技能应该专注于消除根源。如果二线员工花时间在服务台工作，他们用于问题管理的时间就会减少。\n\
  \n值得注意的是，尽管成功的问题管理会通过提供已知错误的解决方案来提高服务台性能，但从长期来看，它可能会导致服务台的首次修复率下降。这是因为随着重复性故障被永久修复，服务台处理的是更加复杂和个性的电话。因此，修复率的下降并不意味着服务台的服务质量正在恶化。\n\
  \n一旦确定了所需的技能水平，确保具有正确技能平衡的人员在岗以保持一致性至关重要。\n\n## 培训与意识\n\n服务台需要必要的持续培训和意识计划，涵盖人际交往技巧，如电话技巧、沟通、积极倾听和客户护理技巧。业务意识以及对组织业务领域、驱动因素、结构和优先事项的特定知识对于有效支持至关重要。\n\
  \n对组织提供支持的所有关键 IT 服务的意识对于组织的有效支持也是必不可少的。根据提供的支持水平，可能需要某些诊断技能，使用支持工具和技术的能力将非常重要。所有服务台人员在新的系统和技术引入之前都需要培训。\n\
  \n服务台需要了解 IT 部门的流程和程序，特别是事件、请求、变更以及服务资产和配置管理，但对所有 ITSM 流程和程序的概述也有价值。另一个实用的技能是打字，以确保快速准确地输入事件或服务请求的细节。\n\
  \n为了确保服务台继续按要求运行，应定期评估技能需求和水平，并维护培训记录。应该维持仔细制定的人员轮换或时间表，以确保在所有关键运营期间，员工经验和适当技能水平保持一致的平衡。拥有正确的技能组合至关重要。\n\
  \n### 培训细节\n\n确保所有服务台人员在被要求负责服务台工作之前经过充分培训至关重要。这应该包括组织入职培训和业务意识计划，以确保员工熟悉他们将支持的组织。\n\
  \n\n\n\n\n在开始服务台工作时，新员工最初应该先“影子学习”经验丰富的员工（即坐在他们旁边旁听电话），然后再开始自己接听电话，期间由一名导师在旁旁听，并在必要时进行干预并提供支持。导师制是一种在服务台人员积累经验时维持培训的有效技术，随着他们职业生涯的发展，可以为每位服务台人员分配一名导师。\n\
  \n服务台人员需要接受培训，以保持知识的更新并关注新的进展、服务和技术。此类事件的发生时机至关重要，以免干扰正常工作。\n\n投资服务台以维持一支专业的团队是非常关重要的。传统上，服务台面临着人员流失率的问题，但可以通过让员工在组织内部晋升，而不是将知识带到新公司，来缓解这种情况。\n\
  \n## 员工留存\n\n所有 IT 经理都意识到服务台以及在该工作的员工的重要性是非常重要的。高人员流失率是昂昂的，因为新员工在充分发挥作用之前必须经过招聘和培训。这是运行服务台的共同挑战之一。任何重大的人员流失都可能导致服务中断并引起服务不一致，因此应该努力让服务台成为一个吸引人的工作场所。\n\
  \n认可服务台的重要性至关重要，这包括奖励方案、团队建设活动以及轮岗到其他活动（项目、二线支持等）。良好的文档记录工作和交叉培训可以支持这种方法。\n\n服务台通常可以作为进入其他更具技术性或监督/管理角色的跳板。然而，需要确保进行适当的人员继任计划，以确保服务台不会在一次丢失任何领域的关键专业知识。\n\
  \n## 超用户\n\n在整个用户社区中引入超级用户作为与 IT 部门（特别是服务台）的联络点是有益的，特别是在特定的应用程序专家方面。由于他们了解服务如何支持业务流程，他们可能就何时以及如何使用服务提供指导。\n\
  \n可以为超级用户提供额外的培训，并将其作为双向通信的渠道。需要注意的是，超级用户应该记录处理的所有电话，而不只是转发给 IT 的电话。他们需要访问并学习使用事件记录工具。这将确保有关事件和服务质量的价值历史不会丢失。\n\
  \n他们还可以将信息从服务台向下传递到整个本地用户社区，这对于快速向所有用户发布服务细节非常有用。\n\n必须确保超级用户有时间和兴趣履行这一角色。这需要其管理层的承诺和支持。\n\
  \n## 衡量服务台性能\n\n应该建立指标，以便定期评估服务台性能。这对于评估服务台的健康状况、成熟度、效率和有效性，并识别改进运营的机会至关重要。\n\n\
  不应孤立地看待指标，必须记住指标可能会驱动行为；例如，孤立的电话关闭率衡量标准可能会导致客户/用户满意度下降，因为支持分析师的驱动因素是关闭电话，而不是确保客户对结果满意。\n\
  \n典型的服务台指标包括电话处理统计数据和第一线解决率。第一线解决率通常是组织引用的作为衡量服务台性能的主要指标。它也被用于与其他服务台的性能进行比较，但在进行任何比较时需要小心，以确保在所提供的支持性质和服务台的技术能力方面是“同类”的比较。\n\
  \n其他服务台指标还包括实现特定目标的平均时间，例如解决事件的平均时间（当在第一线解决时）。\n\n理解升级事件的平均时间（当无法在第一线解决时）可能是重要的。这将表明服务台人员效率很高，并且了解自己的局限性，并识别出在什么情况下将电话升级给更专业的资源对用户服务最好。\n\
  \n服务台受服务目标的约束。用户对 IT 的体验往往基于他们与服务台的接触，并用服务台的服务目标进行衡量。因此，在 `SLA` 目标定义的范围内完成的客户或用户更新百分比，可能是用户对整个\
  \ IT 部门感知的唯一衡量标准。\n\n审查和关闭已解决电话的平均时间将证明服务台处理工作负载的效率。\n\n按每天和每周划分的电话数量，结合平均通话时长指标，对于确定所需人员至关重要。服务台的人员配备没有硬性规定，因此这种分析对于理解每个组织的特定需求至关重要。\n\
  \n关于指标以及如何使用它们提高服务质量的更多通用细节包含在《ITIL 持续服务改进》核心卷中。\n\n除了跟踪服务台性能的“硬性”指标，评估“软性”指标也很重要。这些指标通过客户和用户感觉他们的电话是否得到了回答、他们是否觉得服务台操作员礼貌且专业，以及操作员是否建立了用户的信任来表达。\n\
  \n软性指标的唯一成功方法是从用户那里获取。理解服务台问题的一种常用方法是通过电话回访调查，其中独立的服务台操作员或主管在事件解决后不久回访小部分用户，询问他们对所获得支持的意见。某些\
  \ `ITSM` 工具具有自动调查功能——例如，每十个已解决的电话将收到调查。\n\n这可以作为涵盖整个 IT 的广泛客户/用户满意度调查的一部分，也可以专门针对服务台问题。\n\
  \n应注意将问题数量保持在最低，以便用户有时间配合。调查问题的设计应让用户或客户知道问题涉及哪个领域或主题，以及他们指的是哪次事件或服务。为了对给定时间段的服务进行充分比较，每个期间应选择相同比例的电话，并且尽管有任何其他时间压力也应严格执行。\n\
  \n服务台必须对低满意度和收到的任何反馈采取行动。\n\n调查是一个复杂且专业的领域，需要对统计学和调查技术有良好的理解，但在学习《ITIL 服务运营》出版物时没有必要理解这些内容。\n\
  \n表 4.1 列出了一些典型的调查示例。\n\n| 技术/工具 | 优点 | 缺点 |\n\n| --- | --- | --- |\n\n\n\n\n| 方法\
  \ | 优点 | 缺点 |\n| :--- | :--- | :--- |\n| 电话后调查 | 要求呼叫者在通话结束后留在电话线上，然后对服务进行评分。 |\
  \ 响应率高，因为呼叫者仍在通话中。在通话后立即进行调查，他们可以轻松回忆自己的体验。 | 人们可能会感到被迫接受调查，从而导致负面的服务体验。调查者被视为被调查的服务部门的一部分这可能会抑制开放性的回答。\
  \ |\n| 外呼电话调查 | 在客户和用户之前使用服务台一段时间后与他们联系。 | 响应率较高，因为直接访谈了呼叫者。可以针对特定类别的用户或客户收集反馈（例如请求过特定服务的用户或经历过特定服务中断的人）。\
  \ | 如果电话干扰了用户或客户的工作，这种方法可能被认为具有侵入性。调查是在用户或客户使用服务台后进行的，因此他们的感知可能已经发生了。 |\n| 人面访谈\
  \ | 由调查人员对客户和用户进行个人访谈。这对于频繁使用服务台或有过非常负面体验的客户或用户特别有效。 | 访谈者能够观察非语言信号，并听取用户或客户的内容。用户和客户感到更大程度的个人关注，并觉得他们的答案被认真对待。\
  \ | 访谈对访谈者和受访者来说都很耗时。用户和客户可能会将访谈变成投诉会议。 |\n| 小组面试 | 以小组形式对客户和用户进行访谈。这对于收集总体印象以及确定是否有需要更改服务台某些方面（例如服务时间或地点）很好。\
  \ | 可以访谈更多的用户和客户。问题更加通用，因此访谈之间的一致性更高。 | 人在同事或经理面前可能无法自由表达。人们的意见在面试过程中很容易被其他人改变。\
  \ |\n| 邮政/电子邮件调查 | 将调查问卷寄给特定的客户和用户。要求他们通过电子邮件或普通邮件回复。 | 可以针对特定或所有客户或用户。邮政调查可以是匿名的，让人们更自由地表达。电子邮件调查不是匿名的，但可以使用自动化表单创建，方便用户回复，并增加完成调查的可能性。\
  \ | 邮政调查的处理非常耗费人力。回复邮政调查的人数比例通常较小。对问题的误解可能会影响结果。 |\n| 在线调查 | 将问卷发布在网站上，并通过电子邮件或热门网站的链接鼓励用户和客户参与调查。\
  \ | 这些调查的潜在受众相当大。受访者可以在自己的时间完成问卷。热门网站上的链接是很好的提醒且不具有侵入性。 | 无法预测受访者的类型和比例。 |\n\nCopyright\
  \ © AXELOS Limited 2010. 版权所有。材料根据 AXELOS 的许可再现。\n\n`TABLE 4.1` 调查技术和工具\n\n### 服务台环境\n\
  \n服务台应所在的位置应该仔细选择。要重要的是，员工通常被要求留在同一个地点很长时间，因此在可能的情况下，应该提供考虑到工作条件的设施。\n\n如果组织能够提供一个可以安置整个功能部门的位置，并有充足的自然光和整体空间，以提供足够的办公桌、存储空间以及在需要时移动的活动，这将使工作环境变得更容易接受。\n\
  \n服务台员工应能够方便访问支持其职责的正确设备，例如控制台、监控显示器和留言板，以便快速获取可能正在发生的任何关键运营或服务事件或问题的状况。由于服务台通常很忙，可能同时处理许多不同的对话，因此，一个具有良好声学控制的安静环境（使得一个电话对话不被另一个干扰）是至关重要的。\n\
  \n服务台可能是一个非常有压力的工作场所，周善利用空间、家具和辅助技术（如无线或降噪耳机）是有益的。许多组织发现，提供宜人的环境和舒适的家具来缓解情绪有助于压力管理。考虑在附近使用独立的洗手间和休息区，以便员工在需要时可以短时间休息，而不会离开太久。鼓励放松的休息区对于维持服务台的士气非常有帮助。\n\
  \n将服务台放在部门的中心而不是隐藏起来，将鼓励与二线和三线同事的协作工作。\n\n### 外包服务台\n\n外包服务台或 IT 的任何其他领域是一项战略性业务决策。外包服务台的决定并不意味着\
  \ IT 部门放弃了对所提供的服务台服务的所有责任；组织对决策的结果负最终责任。需要一些保障措施，以确保外包服务台与组织的其他 IT 团队和部门有效高效地工作，并维持端到端的服务管理控制。其中一些措施是外包服务台特有的，另一些则是无论外包什么内容的通用关注点。\n\
  \n#### 通用工具和流程\n\n在外包环境中，服务台工具不仅必须支持外包服务台，还必须支持客户组织的流程和业务需求。外包的一些挑战涉及对工具的访问——从内部员工需要访问外包商的工具和数据，到外包支持团队需要访问内部工具和数据。\n\
  \n服务台需要访问几种不同类型的数据才能发挥效用：\n\n* 所有事件记录和信息\n* 问题记录和信息\n* 已知错误数据\n* 变更计划\n* 内部知识来源（特别是技术或应用专家）\n\
  * `SKMS`\n* `CMS`\n* 来自监控工具的告警\n\n允许来自其他组织的员工此类访问可能会存在安全问题。整合不同的工具可能是挑战性的，但整合两个具有不同成熟水平和不同文化的非常不同组织的流程是非常复杂的。外包依赖于组织之间的成功整合。\n\
  \n组织了解外包伙伴的能力非常重要。人们可能会错误地假设，通过在采购过程中规定“ITIL 合规性”或“ISO/IEC 20000 认证”的要求，就可以保证外部外包伙伴的服务管理质量和成熟度。这些声明可能表示潜在供应商在向客户提供服务时使用了\
  \ ITIL 框架，或者其内部实践已获得标准认证。这并不保证其外包方法是以相同的方式进行管理的。\n\n#### SLA 目标\n\n\n\n\n在考虑外包安排时，在混合源环境中，运营级别协议（OLA）和基础合同（UC）可能会出现问题，这些问题可能非常复杂，如果处理不当，可能会影响服务。\n\
  \n重要的事实是，即使在服务交付中涉及多个外包组织，用户也必须获得无缝的服务。与服务组成部分的内部和外部提供者达成的 OLA 和 UC 必须是现实且实际的，并能够真正实现。\n\
  \n## 良好的沟通\n\n在这种复杂的情况下，只有在有计划的情况下才会发生良好的沟通；OLA 和 UC 可以规定应该如何这样做。\n\n服务台能够与用户以及支持与履行团队进行沟通至关重要。如果他们不在同一办公地点，这将变得困难；如果服务台既是离岸又是外包的，将变得非常有挑战性。\n\
  \n对客户组织的工具和操作方法的培训将有所帮助，特别是如果服务台人员与终端用户参加相同的培训，这样他们就能理解用户的能力。\n\n离岸服务台尽管可能存在文化和语言问题，但需要集中精力与用户建立良好的沟通。培训计划可以提供帮助，特别是理解客户市场语言的习惯用法。\n\
  \n## 数据所有权\n\n外包环境的另一个重要因素是数据管理必须定义清楚，因为某些交叉访问是必要的，而其他数据则必须保持保密。\n\n相对于用户、客户、受影响的\
  \ CI、服务、事件、服务请求、变更等所有数据的所有权必须归外包该活动的组织所有，但两个组织都需要访问这些数据。专门与外包公司员工（代表主组织执行工作的公司）绩效相关的数据仍属于该公司的财产。\n\
  \n有关数据所有权的所有报告要求和问题必须在与提供外包服务的签订的基础合同中规定。\n\n## 总结\n\n在本章中，我们探讨了服务台功能以及它如何贡献于服务运营。我们考虑了与服务台相关的角色、目标和结构以及潜在的人员配置方案。我们还审查了服务台的性能指标以及与内包或外包服务台相关的问题。\n\
  \n我们检查了以下关键的 ITIL 概念：\n\n*   呼叫中心\n*   日出模式 (Follow the sun)\n*   单点接触点\n*   超级用户\
  \ (Super user)\n\n## 考试要点\n\n**理解服务台功能的作用和重要性。** 解释呼叫中心和服务台之间的区别，以及它们在事件管理和请求履行过程以及服务台将与之交互的任何其他过程中的作用。\n\
  \n**能够列出并解释服务台人员所需的技能和属性。** 理解为什么该角色需要业务意识、技术意识和以客户为中心等技能和属性。\n\n**能够描述不同的服务台结构。**\
  \ 能够描述本地、集中、虚拟和日出模式的服务台结构。理解何时可以使用每种结构，以及每种方案的优缺点。\n\n**理解外包服务台时所需的保护措施。** 能够解释将服务的最终责任归属于组织的重要性，以及保留数据所有权的必要性。理解有关共享工具的问题，以及对通用流程的需求。\n\
  \n## 复习题\n\n你可以在附录中找到复习题的答案。\n\n1. 服务台*不*负责以下哪一项？\n    1. 提供第一点接触点\n    2. 解决简单的事件\n\
  \    3. 防止事件再次发生\n    4. 为用户提供更新\n\n2. 服务台执行两个流程。它们是什么？\n    1. 事件管理\n    2. 设计协调\n\
  \    3. 请求履行\n    4. 变更管理\n    1. 2 和 4\n    2. 1 和 3\n    3. 以上所有\n    4. 3 和 4\n\
  \n3. 服务台人员应该具备以下哪些能力？\n    1. 详细的应用程序知识\n    2. 人际技巧\n    3. 技术能力\n    4. 业务知识\n\
  \    1. 2 和 3\n    2. 1 和 2\n    3. 以上所有\n    4. 2, 3 和 4\n\n4. 以下哪项*不是* ITIL 中描述的服务台结构？\n\
  \    1. 虚拟\n    2. 矩阵\n    3. 日出模式\n    4. 本地\n\n5. 服务台人员应该可以使用以下哪些信息源？\n    1.\
  \ 变更计划\n    2. 覆盖所支持的基础和应用程序的配置管理系统\n    3. Known 错误数据库\n    4. 事件诊断脚本\n    1. 1\
  \ 和 2\n    2. 以上所有\n    3. 3 和 4\n    4. 1, 2 和 3\n\n6. 以下哪些项是服务台的有效性能指标？\n    1.\
  \ 未升级到其他团队即关闭的事件百分比\n    2. 在记录时正确分类的事件百分比\n    3. 记录的硬件事件数量\n    4. 客户满意调查得分\n\
  \    1. 以上所有\n    2. 1, 2 和 3\n    3. 3 和 4\n    4. 1, 2 和 4\n\n7. 拥有服务台是以下哪项的直接收益？\n\
  \    1. 客户服务水平要求已记录。\n    2. 技术支持人员不花费时间解决简单事件。\n    3. 变更请求在实施前已授权。\n    4. CMS\
  \ 中的所有信息都保持更新。\n\n8. 以下哪些项是利用指定超级用户的潜在收益？\n    1. 超级用户可以处理简单的查询而无需记录事件，减少了服务台的工作量。\n\
  \    2. 超级用户可以提供业务协调点，特别是在需要沟通信息时（例如重大事件期间）。\n    3. 超级用户理解 IT 服务的业务背景。\n    4.\
  \ 超级用户可以需要直接接触支持团队，节省原本要在服务台记录事件的时间。\n    1. 2 和 3\n    2. 以上所有\n    3. 1, 2 和 3\n\
  \    4. 3 和 4\n\n9. 虚拟服务台的描述描述是？\n    1. 服务台位于其服务的用户群所在的同一地点。\n    2. 服务台通过电话给出多个地点的台实际上是一个单一台的印象。\n\
  \    3. 服务台提供 24 小时全球支持，根据一天的时间转移到不同的国家。\n    4. 服务台人员在工作时间内接听，非工作时间转移给值班支持人员。\n\
  \n10. 当组织外包服务台时，以下哪些说法是正确的？\n    1. 外包服务台供应商对提供的服务水平负责任。\n    2. 外包服务台供应商对提供的服务水平负责。\n\
  \    3. 组织的高级管理对提供的服务水平负责任。\n    4. 外包方决定将提供什么服务。\n    1. 仅 2, 3 和 4\n    2. 仅 2\
  \ 和 3\n    3. 仅 1 和 2\n    4. 仅 1, 2 和 4\n\n\n\n\n本章讨论了以下 ITIL 运营支持与分析能力中级考试目标：\n\
