  \    4. 设计协调\n\n# 第 8 章\n\n容量管理、可用性管理与信息安全管理\n\n**本章讨论了以下 ITIL 规划、保护与优化能力高级考试目标：**\n\
  \n*   ![images](img/00005.jpeg) 容量管理、可用性管理和信息安全管理将从以下方面进行讨论：\n    *   目的\n    *\
  \   目标\n\n\n\n\n* 范围\n* 价值\n* 策略\n* 原则与基本概念\n* 过程活动、方法和技术\n* 触发因素、输入、输出和接口\n* 信息管理\n\
  * 过程角色\n* 关键成功因素和关键性能指标\n* 挑战\n* 风险\n\n![](img/00006.jpeg) 本章讨论的流程涵盖了保证（warranty）的四个方面中的三个；你应该在\
  \ ITIL 基础学习中记得，为了让服务交付价值，必须同时提供实用性（utility，即所需的功能，描述为“适用性”）和保证（warranty，即服务按所需水平运行所需的足够的可用性、容量、服务连续性和安全性，描述为“可用性”）。\n\
  \n容量管理确保服务及其基础技术能够支持业务活动模式。可用性管理确保服务是可靠且具有韧性的，并将任何停机时间控制在客户可以接受的水平，即服务水平协议中约定的水平。ITIL\
  \ 将信息安全管理定义为“企业治理框架内的管理过程，它为安全活动提供战略方向并确保目标的实现”。\n\n我们将逐一检查这些过程。\n\n## 容量管理\n\n\
  ITIL 规定，容量管理负责确保 IT 服务和 IT 基础设施的容量能够以成本效益且及时的方式满足约定的当前和未来容量及性能需求。因此，容量管理过程必须理解容量需求的可能变化，并确保服务的的设计和持续管理满足这些需求。正如我们刚刚所说的，足够的容量是服务的一个关键保证方面，如果要实现服务的效益，就必须交付这一保证。\n\
  \n容量管理在整个生命周期中都被考虑；作为策略的一部分，新服务的可能容量需求作为服务评估的一部分被考虑在，以确保服务满足实际需求。在设计阶段，对服务进行工程处理以应对这些需求，并保持足够的灵活性以适应不断变化的容量需求。过渡阶段确保服务在实施时按照其规范交付。生命周期的运行阶段确保实施为了满足需求变化而必要的日常调整。最后，作为持续服务改进的一部分，将处理与容量相关的问题并进行调整，以确保最具成本效益且最可靠的服务交付。\n\
  \n### 容量管理的目的\n\n容量管理过程的目的是理解服务的当前和未来容量需求，并确保服务及其支持服务能够达到这一水平。实际的容量需求已作为服务水平管理的一部分达成一致；容量管理不仅要满足这些需求，还要确保可能随时间变化的业务未来需求得到满足。\n\
  \n### 容量管理的目标\n\n容量管理的目标通过制定详细计划来实现，该计划说明了当前业务需求、预期的未来需求以及为满足这些需求将采取的行动。该计划应定期审查和更新（至少每年一次），以考虑业务需求的变化。同样，任何对当前配置的更改请求将由容量管理考虑，以确保它们符合预期；如果不符合，则修改容量计划以适应变化的需求。负责容量管理的人员将审查任何出现的问题，并帮助解决任何由于容量不足导致的事件或问题。这有助于确保服务满足其目标。一个核心目标是确保及时增加或减少容量，以免影响业务。\n\
  \n作为容量及其持续管理及其持续改进的一部分，将识别并采取任何可以以合理成本提高性能的积极措施。将提供有关容量和性能相关问题的建议和指导，并为服务运营部门在处理与性能和容量相关的事件和问题提供协助。\n\
  \n### 容量管理的范围\n\n容量管理过程负责确保任何时候都有足够的容量，包括对短期波动（如由季节性变化引起的波动）进行规划，并确保为长期业务扩展提供所需的容量。需求的变化有时实际上是需求的减少，这属于该过程的范围。容量管理应确保随着对服务需求的下降，为该服务提供的容量也相应减少或进行管理，以避免不必要的支出。\n\
  \n该过程涵盖服务提供的所有方面，因此可能涉及技术、应用和运营管理职能。容量的其他方面（如员工资源）也在考虑范围内。\n\n正如“容量管理”侧边栏所示，容量需求的增加可能会对基础设施以及管理它的\
  \ IT 人员资源产生连锁反应。虽然人员配备是直线管理的职责，但该领域的资源需求计算也是整体容量管理过程的一部分。\n\n容量管理还涉及监控“业务活动模式”，以理解基础设施满足需求的情况，并根据需要进行调整以确保满足需求。在合理的情况下，也可以对容量实施积极改进，并对任何由容量问题引起的事件进行调查。\n\
  \n容量管理可能会建议需求管理技术来平滑过度的需求高峰。这些技术将在第九章“IT 服务连续性管理和需求管理”中讨论。\n\n### 容量管理对业务的价值\n\n\
  容量管理通过提高业务所需的 IT 服务性能和可用性为业务提供价值；它通过帮助减少与容量和性能相关的事件和问题来实现。该过程还将确保以最具成本效益的方式提供所需的容量和性能。\n\
  \n所有过程都应以某种方式有助于实现客户满意度，容量管理通过确保满足所有与容量和性能相关的服务水平来实现这一点。容量管理需要在新技术和技术出现时保持警觉，利用它们提供具有成本合理性的性能改进并支持创新。\n\
  \n积极的容量管理活动将确保在新建或已变更服务的设计和过渡期间考虑容量方面。容量计划将确保在规划服务时考虑到业务需求和未来计划。\n\n与可用性管理一样，容量管理将有机会通过使用绿色技术和技术提高业务遵循具有环境责任的战略的能力。\n\
  \n### 容量管理的策略、原则和基本概念\n\n\n\n\n容量管理本质上是一种平衡术。它确保 IT 服务和系统的容量与性能能够以最具成本效益且及时的方式，匹配业务不断演变的需求。这要求在成本与所需的资源之间进行平衡。容量管理需要确保购买的处理能力在业务需求方面是成本合理的。它确保组织能够最有效地利用这些资源。\n\
  \n容量管理也涉及供需双方的平衡。确保可用的 IT 处理能力供应匹配业务现在和未来对其提出的需求至关重要。可能还有必要对特定资源的需求进行管理或影响。\n\n\
  容量管理策略应反映出容量管理在整个服务生命周期中发挥重要作用的需求。\n\n确保容量管理包含在所有服务水平协议（SLA）和运营水平协议（OLA）以及与供应商的任何支持性合同的考量中至关重要。这些协议将涵盖业务的服务需求，容量管理应根据当前和未来的业务需求考虑这些需求。\n\
  \n## 容量管理过程活动、方法与技术\n\n容量管理有三个辅助子过程：业务容量管理、服务容量管理和组件容量管理。每个子过程都会执行许多相似的活动，但每个过程的侧重点非常不同。业务容量管理侧重于当前和未来的业务需求，而服务容量管理侧重于支持业务的现有服务的交付，组件容量管理则侧重于支撑服务提供的\
  \ IT 基础设施。\n\n在图 8.1 中，你可以看到容量管理过程子过程、技术和活动的完整范围。我们将依次查看每个子过程。\n\n![图表显示了容量管理的业务（战略）、服务（战术）和组件（运营）子过程，最终导致容量计划过程，并在容量管理数据存储结束于\
  \ CMIS。](img/00031.jpeg)\n\n图 8.1 容量管理子过程\n\nCopyright © AXELOS Limited 2010. 保留所有权利。根据\
  \ AXELOS 的许可复制。\n\n## 业务容量管理\n\n业务容量管理子过程关注理解业务计划及其对 IT 基础设施的影响。这使得必要的变更（如存储升级）能够及时计划和实施，以确保在业务需要时提供所需的容量。容量管理将利用现有服务和资源的利用率数据，并推断趋势以预测未来需求。此外，容量管理还将根据服务策略和服务组合流程，为即将上线的新服务规划所需的容量。\n\
  \n容量需求随业务的变化而变化。业务变化可能需要新服务、对现有服务进行更改，或增加对这些服务的需求。某些服务将不再需要，这将释放空闲容量。这些新需求由需求管理识别，需求管理通过分析业务活动模式来理解这些模式如何产生\
  \ IT 服务的需求模式。这些信息使前瞻性的容量管理能够预测并满足未来需求。\n\n如果服务能够满足服务水平协议中设定的需求水平和性能目标，则容量管理需要尽早纳入所有的战略、规划和设计活动中。该过程将对许多不同场景的容量需求进行建模，以理解对容量需求的影响。例如，此类场景可能包括并发用户数量少于或多于预测的影响。\n\
  \n一旦理解了容量需求，容量管理将根据需要采购新容量，或根据需要采取其他措施。它还将确保所采取的操作通过变更管理过程实施。它还将建议服务水平管理哪些 SLA 性能目标是可实现的。\n\
  \n## 服务容量管理\n\n服务容量管理子过程专注于对运行、运营中的 IT 服务使用和工作负载的端到端性能和容量进行管理、控制和预测。它确保 `SLAs` 和\
  \ `SLRs` 中服务目标详细说明的所有服务的性能都得到监控和测量，并对收集的数据进行记录、分析和报告。在必要的情况下，应启动主动和反应性行动，以确保所有服务的性能符合其约定的业务目标。在可能的情况下，应使用自动化阈值来管理所有运营服务，以确保服务目标被违反或受到威胁的情况被迅速识别。服务容量管理将监控工作负载，以确保其不超过任何指定的限制。\n\
  \n服务容量管理监控性能水平的变化并评估变化的影响，以便在服务受影响之前预测并处理大多数问题。\n\n## 组件容量管理\n\n组件容量管理子过程专注于对单个\
  \ IT 技术组件（如处理器、内存、磁盘、网络带宽和网络连接）的性能、利用率容量进行管理、控制和预测。它确保 IT 基础设施内所有有限资源的组件都得到监控和测量，并对收集的数据进行记录、分析和报告。在可能的情况下，应通过事件管理过程实施自动化阈值管理所有组件，以确保迅速识别由于组件使用或性能导致服务目标被违反或受到威胁的情况，并实施成本效益的措施（如负载均衡）以减少或避免其潜在影响。\n\
  \n## 容量管理工具\n\n确保容量管理使用的工具符合组织的管理架构，并与其他用于 IT 系统管理和 IT 流程自动化的工具集成至关重要。\n\n服务运营监控和控制活动为工具支持容量管理提供了基础。IT\
  \ 运营管理部门和技术管理部门（如网络管理和服务器管理）可能执行大部分日常运营职责。他们将通过提供性能信息参与容量管理过程。\n\n## 反应性和主动活动\n\n\
  容量管理既有反应性活动也有主动活动（可用性管理也是如此，我们将在本章稍后部分检查）。在图 8.2 中，你可以看到与反应性和主动容量管理相关的活动，以及子过程之间的交互。\n\
  \n![图表显示服务组合（业务需求）流向容量管理（业务、服务和组件），连接到区块（改进当前服务、评估新需求和规划新容量），最后连接到 CMIS。](img/00032.jpeg)\n\
  \n\n\n\n\n# 图 8.2 带子过程的容量管理概述\n\nCopyright © AXELOS Limited 2010. 保留所有权利。材料根据 AXELOS\
  \ 的许可复制。\n\n容量管理应包含以下主动性活动：\n\n*   在问题发生前采取必要措施，预判性能问题\n*   产生当前组件利用率的趋势，并利用这些趋势估算未来需求，以及规划升级和增强\n\
  *   对 IT 服务的预测变化（包括服务退役）进行建模和趋势分析\n*   确保在违反 SLA 和服务目标或发生性能问题之前，完成升级的预算制定、规划和实施\n\
  *   在成本合理的情况下积极寻求提高服务性能\n*   制定并维护一份应对未来需求及实现这些计划的容量计划\n*   调优（也称为优化）服务和组件的性能\n\n\
  容量管理应包含以下响应性活动：\n\n*   对所有服务和组件的当前性能进行监控、测量、报告和审查\n*   响应所有与容量相关的“阈值”事件并启动纠正措施\n\
  *   对特定的性能问题做出反应并提供协助\n\n### 持续活动\n\n许多持续活动构成了容量管理过程的一部分。这些活动为容量管理中的所有其他活动和过程提供了必要的历史信息和触发器（见[图\
  \ 8.3]）。\n\n![图像显示了调优、实施、监控和分析的闭环流程图。资源和服务阈值以及 CMIS 连接到监控。分析和监控连接到服务和资源利用异常报告。](img/00033.jpeg)\n\
  \n图 8.3 容量管理的持续迭代活动\n\nCopyright © AXELOS Limited 2010. 保留所有权利。材料根据 AXELOS 的许可复制。\n\
  \n每项服务及其所有组件都应该经过监控，并与定义的阈值进行比较，以发现趋势并识别潜在问题。这使得能够采取必要的行动。还可以针对购买新容量或采用新技术提出建议。\n\
  \n典型的监控数据包括以下：\n\n*   处理器利用率\n*   内存利用率\n*   I/O 速率（物理和缓冲区）以及设备利用率\n*   队列长度\n*\
  \   磁盘利用率\n*   事务处理率\n*   响应时间\n*   批处理持续时间\n*   数据库使用情况\n*   索引使用情况\n*   命中率\n\
  *   并发用户数\n*   网络流量速率\n\n阈值应基于对正常活动的历史分析，并设置在服务受影响的水平以下，为纠正措施留出时间。如果超过了阈值，应触发报警并生成异常报告。\n\
  \n持续活动可能包括平衡服务、平衡负载、更改并发水平以及添加或删除资源。监控报告以及有关建议和采取采取的信息存储在容量管理信息系统 (`CMIS`) 中。\n\n\
  ### 容量管理的触发器、输入、输出和接口\n\n让我们考虑容量管理过程的触发器、输入、输出以及它与其他服务管理过程的接口。容量管理是一个在整个组织及其过程中具有许多活动连接的过程。明确定义触发器、输入、输出和接口对于避免重复工作或工作流空白至关重要。\n\
  \n### 触发器\n\n许多触发器将启动容量管理活动：\n\n*   需要额外容量的新及变更的服务\n*   服务违约、容量或性能事件以及告警（包括阈值事件）\n\
  *   异常报告\n*   对当前容量和性能进行定期修订，以及对预测、报告和计划进行审查\n*   定期的趋势分析和建模\n*   对业务和 IT 计划及策略进行审查和修订\n\
  *   对设计和策略进行审查和修订\n*   对 SLA、运营水平协议、合同或任何其他协议进行审查和修订\n*   服务水平管理针对容量和/或性能目标的协助请求以及对达成情况的说明\n\
  \n### 输入\n\n许多信息源与容量管理过程相关：\n\n*   业务信息\n*   服务和 IT 信息\n*   组件性能和容量信息\n*   服务性能问题信息\n\
  *   服务信息\n*   财务信息\n*   变更信息\n*   性能信息\n*   `CMS`\n*   负载信息\n\n### 输出\n\n容量管理的输出用于过程本身，也用于许多其他过程和组织的其他部分。这些信息通常以电子格式复制，作为性能的实时可视化显示。输出如下：\n\
  \n*   容量管理信息系统\n*   容量计划\n*   服务性能信息和报告\n*   负载分析和报告\n*   临时容量和性能报告\n*   预测性报告\n\
  *   阈值、告警和事件\n*   改进措施\n\n### 接口\n\n正如我们已经解释过的，容量管理在整个服务生命周期内与其他许多过程有着紧密的联系。例如，对服务和资源容量的所有更改必须遵循所有\
  \ IT 流程，如变更、发布、配置和项目管理。\n\n关键接口如下：\n\n*   可用性管理与容量管理协作，以确定确保服务和组件所需可用所需的资源。\n* \
  \  服务水平管理为确定容量目标提供协助，并对服务和组件容量相关的违约进行调查和解决。\n*   IT 服务连续性管理通过容量管理的支持，评估业务影响和风险，确定支持风险降低措施和恢复方案所需的容量。\n\
  *   容量管理为事件和问题管理提供协助，以解决和纠正与容量相关的事件和问题。\n*   需求管理根据用户画像和业务活动模式预测服务需求，并识别影响这些需求的方法，从而提供战略决策和容量管理可以采取行动的关键相关数据。\n\
  \n### 信息管理与容量管理\n\n`CMIS` 用于提供相关的容量和性能信息，以生成报告并支持容量管理过程。报告为多个 IT 和服务管理过程提供信息。这些应包括后续章节中描述的报告。\n\
  \n#### 基于组件的报告\n\n每个组件可能有一支专门的技术人员，他们应该负责各自的控制和管理。必须编制报告以说明组件的运行情况以及使用了其最大容量的比例。\n\
  \n#### 基于服务的报告\n\n基于服务的报告将为 SLM（服务水平管理）和客户服务报告的基础。必须编制报告和信息，以说明服务及其组成组件相对于整体服务目标和约束的运行情况。\n\
  \n#### 异常报告\n\n\n\n\n\n异常报告可向管理层和技术人员展示特定组件或服务的容量和性能何时变得不可接受。可以为 CMIS 内的任何组件、服务或测量值设置阈值。阈值的一个示例可能是：特定服务器的处理器利用率连续三小时超过\
  \ 70%，或者并发登录用户数超过了了的限额。\n\n特别地，异常报告对于服务水平管理（SLM）过程在确定 SLA 中的目标是否被违反方面具有重要意义。此外，事件和问题管理过程可能可以在解决事件和问题时使用异常报告；例如，响应缓慢可能追溯到由于容量不足。还应该识别出过量容量。未使用的容量可能代表着节省成本的机会。\n\
  \n## 预测与预测报告\n\n容量管理过程的一部分是预测未来的工作负载和增长。为了做到这一点，必须对未来的组件和服务容量及性能进行预测。这可以通过多种方式实现，取决于使用的技术和手段。容量预测的一个简单示例是业务驱动因素与组件利用率之间的相关性。如果对未来容量需求的预测发现了增加资源的需求，则需要将此需求输入容量计划并纳入\
  \ IT 预算周期中。\n\n## 流程角色\n\n在第 1 章“运营支持与分析简介”中，我们探讨了适用于整个服务生命周期所有流程的通用角色。这些角色与容量管理过程相关，但也存在特定的额外要求。请记住，这些不是“职位名称”，而是对于成功运行该流程可能需要的角色的指导。\n\
  \n### 容量管理流程所有者\n\n容量管理流程所有者的职责通常包括以下内容：\n\n*   履行容量管理流程的通用流程所有者职责（更多细节请参见第 1 章）\n\
  *   与所有职能部门经理合作，确保容量管理流程作为所有与容量和性能相关问题的单一协调点，无论涉及什么特定技术\n*   与其他流程所有者合作，确保在容量管理、可用性管理、IT\
  \ 服务连续性管理和信息安全管理的设计与实施方面采用整合方法\n\n### 容量管理流程经理\n\n容量管理流程经理的职责通常包括以下内容：\n\n*   履行容量管理流程的通用流程经理职责（更多细节请参见第\
  \ 1 章）\n*   协调容量管理与其他流程之间的接口，特别是服务水平管理、可用性管理、IT 服务连续性管理和信息安全管理\n*   确保有足够的 IT 容量以满足所需的服务水平\n\
  *   提供关于容量与需求匹配以及优化现有容量使用的建议\n*   与 SLM 合作从业务端确定容量需求\n*   理解每个组件的当前使用和最大容量\n*  \
  \ 对所有提议的新服务和系统进行建模和规模规划\n*   预测未来的容量需求\n*   根据组织的业务规划周期制定、评审和修订容量计划\n*   对资源和系统设置适当监控水平\n\
  *   分析使用和性能数据，并针对 SLA 中包含的目标对性能情况进行报告\n*   当检测到违反容量或性能阈值时，提出事件和问题，并协助对容量相关事件和问题的调查与诊断\n\
  *   进行调优以优化和改进容量或性能\n*   实施改进资源使用的倡议活动——例如，需求管理技术\n*   评估旨在提高性能的新技术，以及可用于改进流程的新技术和产品\n\
  *   评估所有变更对容量和性能的影响，并在适当的情况下参加变更控制委员会（CAB）会议\n*   就资源的当前使用情况、趋势和预测，以及相对于 SLA 中包含的目标的执行情况（性能情况）进行报告\n\
  *   测试新服务和系统的性能\n*   预测未来需求对性能服务水平的影响\n*   确定具有成本效益的可实现性能服务水平\n*   作为所有容量和性能问题的焦点\n\
  \n## 容量管理的关键成功因素和关键性能指标\n\n以下列表包含了容量管理的一些关键成功因素以及每个因素的关键性能指标（KPI）。\n\n*   关键成功因素：“准确的业务预测”\n\
  \    *   KPI：按时产工作负载预测\n    *   KPI：业务趋势预测的准确性（以百分比衡量）\n*   关键成功因素：“对当前和未来技术的了解”\n\
  \    *   KPI：根据业务需求对新技术进行及时的论证和实施（时间、成本和功能）\n    *   KPI：减少对旧技术的使用，避免因支持或性能问题导致\
  \ SLA 违反\n*   关键成功因素：“证明成本效益的能力”\n    *   KPI：减少为解决紧急性能问题而进行的最后时刻采购\n    *   KPI：减少\
  \ IT 的容量过剩\n*   关键成功因素：“规划并实施适当 IT 容量以匹配业务需求的能力”\n    *   KPI：由于性能不佳导致的事件数量减少（以百分比衡量）\n\
  \    *   KPI：由于容量不足导致的业务损失减少（以百分比衡量）\n\n## 容量管理面临的挑战\n\n容量管理面临的主要挑战之一是说服业务部门提供其战略业务计划。没有这些信息，IT\
  \ 服务提供者将难以提供有效的业务容量管理。如果由于商业或机密原因无法共享这些数据，对于服务提供者来说将变得更加困难。\n\n另一个挑战是将所有组件容量管理数据整合为一组可以以一致方式分析的信息集。当来自不同技术的信息由不同的工具以不同的格式提供时，这尤为具有挑战性。\n\
  \n业务容量管理（特别是服务容量管理和组件容量管理）产生的信息量是巨大的，对这些信息的分析往往难以实现。\n\n人员和流程关注关键资源及其使用情况而不忽略其他领域是非常重要的。为了实现这一点，必须使用适当的阈值，并依赖工具和技术来自动管理技术，并在情况严重偏离常态时提供警告和警报。\n\
  \n## 容量管理的风险\n\n以下列表包含了与容量管理相关的主要风险：\n\n*   业务部门对容量管理流程缺乏投入。\n*   业务部门提供的未来计划和策略信息不充分。\n\
  *   高层管理对容量管理流程缺乏投入，或缺乏资源和/或预算。\n\n\n\n\n\n*   服务容量管理和组件容量管理是孤立进行的，因为业务容量管理非常困难，或者缺乏适当且准确的业务信息。\n\
  *   流程变得过于官僚化或依赖人工操作。\n*   流程过于关注技术（组件容量管理），而对服务（服务容量管理）和业务（业务容量管理）的关注不足。\n*   提供的报告和信息技术性过强，未能提供客户和业务所需要或合适的信息。\n\
  \n## 可用性管理\n\n服务的可用性对其价值至关重要。无论服务多么智能或提供什么功能（其效用性），只要它没有交付预期的保证（保证），对客户来说就没有价值。可用性差是导致客户不满意的主要原因。可用性是服务符合使用（fit\
  \ for use）必须交付的四个保证方面之一。可用性目标通常包含在服务水平协议中，因此 IT 服务提供商必须理解在寻求满足或超过可用性目标时需要考虑的因素。本节涵盖了如何衡量可用性；可用性管理的目的、目标和范围；以及若干关键概念。\n\
  \n### 定义可用性\n\nITIL 将 `availability` 定义为 IT 服务或其他配置项在需要时执行其约定功能的能力。在约定的服务时间内（也称为服务水平协议中指定的约定服务时间）对服务的任何意外中断都被定义为\
  \ `downtime`。可用性量的计算方法是从约定服务时间中减去 `downtime`，并将其转换为约定服务时间的百分比。\n\n注意的是，定义中的 `when\
  \ required`（需要时）和计算中的 `agreed`（约定）非常重要。服务在客户不需要时可能是可用的；在计算中包含客户不需要服务的时间会从客户角度角度对可用性产生错误的印象。如果客户的感知与提供的报告不一致，客户将变得愤世嫉俗并不再信任报告。\n\
  \n记住，客户体验的是端到端服务；交付的可用性取决于链中的所有链路在需要时运行正常。无论故障发生在应用程序、网络还是硬件上，客户都会抱怨服务不可用。因此，可用性管理过程关注减少任何地点发生的影响服务的机时间。同样，在可用性报告中应明确说明计算是基于端到端服务还是仅基于应用程序可用性。因此，理解服务可用性和组件可用性之间的区别至关重要。\n\
  \n### 可用性管理的目的\n\n可用性管理过程的目的是采取必要的步骤来交付 `SLA` 中定义的可用性需求。该流程应同时考虑业务的当前需求和未来需求。所有改进可用性所采取行动都有相应的成本，因此必须对进行的所有改进进行成本效益评估。\n\
  \n可用性管理考虑 IT 服务提供的所有方面，以识别可用性的可能改进方案。某些改进将取决于新技术的实施；另一些将源于更有效地利用员工资源或精简流程。可用性管理分析停机原因，并评估改进的投资回报率，以确保采取最具成本效益的措施。该过程确保在整个生命周期的所有阶段中，优先交付约定的可用性。\n\
  \n### 可用性管理的目标\n\n可用性管理的目标如下：\n\n*   制定并维护一份计划，详细说明如何满足当前和未来的可用性需求。该计划应提前 12 到 24\
  \ 个月考虑需求，以确保任何必要的支出都能在年度预算谈判中达成一致，并在可用性受影响之前购买并安装新设备。计划应定期修订，以考虑业务的任何变化。\n*   在整个服务生命周期内为业务和\
  \ IT 提供有关所有可用性相关问题的建议，确保考虑任何决策对可用性的影响。\n*   管理服务的交付以满足约定的目标。在发生停机时，可用性管理将通过利用事件管理协助解决事件，并在适当的情况下利用问题管理过程解决根本问题。\n\
  *   评估所有变更请求，以确保考虑了对可用性的任何潜在风险。还将考虑并实施由于变更而需要对可用性计划进行的任何更新。\n*   考虑可以采取的以改进整个端到端服务可用性的所有可能的主动措施，评估这些改进的风险和潜在收益，并在合理的情况下实施它们。\n\
  *   实施可用性监控，以确保实现目标。\n*   优化 IT 服务提供的所有领域，以一致地交付所需的可用性，使业务能够使用所提供的服务来实现其目标。\n\n\
  ### 可用性管理的范围\n\n如所述，可用性管理过程涵盖了服务生命周期的所有阶段。它被包含在设计阶段，因为交付可用性的最有效方法是确保从开始就将可用性考虑设计进去。一旦服务运行，就会不断寻找消除可用性风险并使服务更健壮的机会。针对这些机会所进行的活动是主动可用性管理的一部分。在服务的现场交付期间，可用性管理分析任何停机情况并实施措施减少未来发生的频率和长度。这些是可用性管理的反应性活动。对现有的服务进行评估以理解对服务的风险，并建立测量以确保准确衡量停机时间。这将持续整个运行阶段，直到服务退役。\n\
  \n可用性管理的范围包括所有运行服务和技术。在实施 `SLAs` 的情况下，会有明确的约定目标。然而，可能存在其他服务没有正式的 `SLA`，但停机对业务有重大影响。可用性管理不应将这些服务排除在考虑之外；它应该根据停机对业务的潜在影响追求高可用性。服务水平管理应在未来为所有此类服务协商\
  \ `SLAs`——如果没有这些协议，将由 IT 服务提供商来评估所需的可用性水平——但这应该是一个业务决策。可用性管理应应用于所有新的 IT 服务，并适用于已建立\
  \ `SLRs` 或 `SLAs` 的现有服务。支持服务必须包含在内，因为这些服务的故障会影响面向客户的服务。可用性管理还可能与供应商管理合作，确保合作伙伴提供的服务水平不会威胁整体服务的可用性。\n\
  \n\n\n\n\n服务提供的每个方面都属于可用性管理的范围。糟糕的流程、未经过培训的员工以及无效的工具都可能导致停机或不必要地延长停机时间。可用性管理流程确保系统和服务的可用性与业务不断需求相匹配。\n\
  \nIT 在企业中的作用至关重要。IT 服务的可用性和可靠性直接影响客户满意度和企业声誉。可用性管理对于确保 IT 交付业务实现其目标所需的服务可用性水平，并交付客户所要求的服务质量至关重要。\n\
  \n客户满意度是所有企业的一个重要因素，并可能为组织提供竞争优势。对 IT 服务可用性和可靠性的不满，可能是客户将业务转向竞争对手的关键因素。\n\n通过在可用性管理中使用绿色技术和手段，可用性还可以提高企业遵循环境负责任战略的能力。\n\
  \n## 可用性管理策略\n\n可用性管理策略应规定，该流程是所有生命周期阶段的一部分，从服务策略到持续服务改进。应从初始设计阶段就开始在服务和组件中设计适当的可用性和弹性。这不仅将确保任何新服务或变更服务的可用性符合预期目标，还能确保所有现有服务和组件继续满足其所有目标。\n\
  \n可用性策略应由服务提供者建立，以确保可用性在整个生命周期中得到考虑。还应就定义服务或组件可用性与不可用性的标准以及如何衡量每项标准建立策略。\n\n可用性管理在两个相互关联的层面完成：\n\
  \n*   服务可用性涉及服务可用和不可用的所有方面。这包括组件可用性产生的影响，以及组件不可用对服务的潜在影响。\n*   组件可用性涉及组件可用和不可用的所有方面。\n\
  \n## 可用性管理原则和基本概念\n\n可用性管理必须使其活动和优先级与业务需求保持一致。这要求对业务流程以及 IT 服务如何支持这些流程有深入理解。关于未来业务计划和优先级，因此对业务可用性的未来需求的信息，是可用性计划的重要输入。只有理解了这些业务需求，服务提供者才能确保其改进可用性的努力目标是正确的。\n\
  \nIT 服务提供者对故障的响应可以改善客户对服务的感知，尽管服务已经发生了中断。服务提供者的行动可以表现出对停机对业务流程影响的理解，以及克服问题和防止再次发生的意愿，这让企业放心\
  \ IT 理解了其需求。\n\n此外，该流程要求对构成每个服务的单个组件、其能力及其当前性能有深的技术理解。通过这种业务理解与技术知识的结合，可以交付最优设计，以产生所需的可用性水平，满足当前和未来的需求。\n\
  \n在设计新服务并讨论其可用性需求时，服务提供者和业务必须关注服务对业务实现其目标的关键性。在服务的每个方面投入资金提供高可用性可能是不合理的。IT 服务所支持的业务流程可能是一个`关键业务功能\
  \ (VBF)`，因此识别哪些服务或服务的哪些部分是最关键的是一项业务决策。例如，基于互联网的网店能够处理信用卡付款的能力将是一项关键业务功能。显示“购买了此书的客户还购买了其他书籍”功能的能力并不至关重要。它可能会促进销售额增长，但购买者即使没有它也能完成购买。一旦理解了这些\
  \ `VBFs`，就可以开始设计服务以确保所需的可用性。理解 `VBFs` 有助于做出关于何处投入保护可用性的支出是合理的决策。\n\n确定服务合适的可用性目标应该是一项业务决策，而不是\
  \ IT 决策。然而，可用性是有价格的，服务提供者必须确保客户理解过高目标带来的成本影响。否则，客户可能会要求极高的可用性目标（`99.99%` 或更高），然后发现服务无法负担。\n\
  \n在极高可用性的成本合理的情况下，服务设计将包含高可靠性组件、弹性以及最少或无计划停机。\n\n在考虑了可用性对业务的重要性后，在接下来的章节中，我们将 IT\
  \ 服务提供者可能采用的一些可用性管理活动和概念，以减少停机时间并为业务交付所需的可用性，使其实现其业务目标。\n\n### 可用性概念\n\n可用性管理包括响应性和主动性活动，如图图\
  \ 8.4；这是所有可用性管理报告、计划、风险注册等的存储库，它构服务知识管理系统(`SKMS`）的一部分。\n\n![图表显示了可用性管理流程，包括响应性活动（例如：监控、测量、分析报告、等）、主动性活动（例如：风险评估和管理、等）以及\
  \ AMIS（例如：可用性管理报告、计划、等）。](img/00035.jpeg)\n\n图 8.4 可用性管理流程\n\nCopyright © AXELOS\
  \ Limited 2010\\. All rights reserved. 材料根据 AXELOS 的许可进行复制。\n\n### 可靠性\n\n\n\n\n\
  我们涵盖的第一个可用性概念是`reliability`（可靠性）。ITIL 定义其为“服务、组件或配置项（CI）在无中断的情况下执行其约定功能持续的时间”。我们通常通过说明某项物品在给定时间内预期故障的频率来描述其可靠性：“我的车非常可靠。在五年里只故障过两次。”我们通过计算`平均故障间隔（或平均故障时间，MTBF）`或`平均服务事件间隔（或平均服务事件时间，MTBSI）`来衡量可靠性。\n\
  \n服务的可靠性首先可以通过确保设计中指定的组件具有良好的质量且来自声誉良好的供应商来提高。即使最好的组件最终也会失效；然而，通过设计服务使得组件故障不会导致停机，就可以提高服务的可靠性。这是另一种可用性概念，称为`resilience`（弹性）。例如，通过确保设计包含备用网络路由，网络组件故障将不会导致服务停机，因为流量将重新路由。执行计划性维护以确保所有组件保持良好的工作状态也有助于提高可靠性。\n\
  \n## 可维护性 (Maintainability)\n\n无论设备有多可靠、设计有多有弹性，并不是所有的停机都是可以避免的。当故障发生且设计中足够的弹性来防止其影响服务时，导致的结果停机时间将取决于克服故障的快慢。这被称为`maintainability`（可维护性），其衡量标准是`平均服务恢复时间（MTRS）`。对于那些服务恢复时间较长的项目，专注于弹性措施可能更具成本效益。要计算`MTRS`，请将总停机时间除以故障总数。\n\
  \n可以采取简单措施来减少`MTRS`，例如在现场备用常用的备备件，这些措施对可用性可以产生重大影响。\n\nITIL 建议使用 `MTRS` 而不是`平均修复时间（MTTR）`，因为修复可能包含也可能不包含修复后的服务恢复。从客户的角度来看，停机包含了从故障发生到服务再次变得完全可用之间的所有时间。`MTRS`\
  \ 衡量的是这段完整时间，因此是一个更具意义的衡量标准。\n\n这些概念在图 8.5 中所示，该图展示了 ITIL 所说的`扩展事件生命周期`。它说明了事件导致停机期间的运行时间段。`MTRS`\
  \ 显示为事件停机时间的平均值。`MTBF` 显示为事件运行时间的平均值。\n\n![图像显示扩展的事件生命周期，包括事件开始、运行时间、服务可用、停机、服务不可用、过程（诊断、恢复、检测、修复和还原）以及时间：MTBSI\
  \ 和 MTBF。](img/00037.jpeg)\n\n图 8.5 扩展的事件生命周期\n\nCopyright © AXELOS Limited 2010\\\
  . 保留所有权利。根据 AXELOS 的许可复制材料。\n\n每个事件都需要检测、诊断和修复，并且需要恢复数据并恢复服务。任何缩短这些步骤任一一步的任何——例如，通过事件管理加速检测或通过使用知识库加速诊断——都会缩短停机时间并提高可用性。该图还展示了另一个概念：`MTBSI`，它计算从一个事件开始到下一次事件开始的平均时间，并用作可靠性的衡量。\n\
  \n## 可可用性 (Serviceability)\n\n可可用性被定义为第三方供应商满足其条款的能力。该合同将包括对支持服务或组件约定的可用性、可靠性和/或可维护性水平。\n\
  \n在图 8.6 中，你可以看到可用性管理中使用的术语和措施，这些措施在应用于提供可可用性的供应商时结合在一起。\n\n![可用性术语和措施的流程图顺序为：业务（客户）、服务水平协议、服务（A、B\
  \ 和 C）、IT 系统、MTBF 和 MTRS、内部支持团队和供应商。](img/00038.jpeg)\n\n图 8.6 可用性术语和措施\n\nCopyright\
  \ © AXELOS Limited 2010\\. 保留所有权利。根据 AXELOS 的许可复制材料。\n\n## 可用性测量\n\n`关键业务功能 (VBF)`\
  \ 一词用于反映业务流程中对业务成功至关重要的部分。业务功能越关键，通常在支持性 IT 服务设计中需要纳入的弹可用性水平就越高。所有服务（无论是否关键）的可用性要求应由业务部门而非\
  \ IT 决定。\n\n某些关键业务功能可能需要特殊设计。这些通常包括以下功能：\n\n**高可用性 (High Availability)**：IT 服务的一种特征，能够减少或掩盖\
  \ IT 组件故障对服务用户的影响。\n\n**容错能力 (Fault Tolerance)**：IT 服务、组件或配置项在部分组件故障后继续正确运行的能力。\n\
  \n**持续运行 (Continuous Operation)**：一种消除 IT 服务计划停机的方法或设计。单个组件或配置项可能处于停机状态，但 IT 服务仍然可用。\n\
  \n**持续可用 (Continuous Availability)**：一种实现 100% 可用性的方法或设计。持续可用的 IT 服务没有计划或非计划的停机。\n\
  \n在 IT 行业中，许多供应商承诺提供高可用或持续可用解决方案，但仅限于使用特定的环境标准和弹性流程的情况下。他们通常只在进行了额外的、有时是昂贵的改进后才同意此类合同。\n\
  \n可用性管理过程很大地取决于对服务和组件在可用性方面成就的测量。\n\n测量什么以及如何报告取决于支持哪种活动、接收者是谁以及如何使用这些信息。认识业务、用户和服务提供商对可用性的不同视角非常重要，以确保测量和报告满足这些多样化的需求。\n\
  \n业务视角考虑 IT 服务可用性时，考虑其对驱动业务运行的关键业务功能的贡献或影响。\n\n用户视角将 IT 服务可用性考虑为三个因素的结合。这些是影响的频率、持续时间和范围。对于许多应用程序，用户端的糟糕响应时间被认为与技术故障处于同一水平。\n\
  \nIT 服务提供者视角从可用性、可靠性和可维护性的角度考虑 IT 服务和组件的可用性。\n\n考虑以不同方式报告相同水平可用性所需的完整措施范围是关重要的，以满足不同的可用性视角。测量需要具有意义并增加价值。这在很大程度上取决于“你测量什么”和“你如何报告它”的结合。\n\
  \n## 可用性管理过程、方法和技术\n\n我们已经探讨了可用性管理过程中使用的概念和衡量。图 8.4 展示了该过程的关键要素，包括可用性管理信息系统。可用性管理可以使用许多不同的技术；我们现在来检查它们。\n\
  \n### 扩展的事件生命周期\n\n\n\n\n我们之前在考虑可用性概念时，简要回顾了扩展的事件生命周期，参见图 8.5。这种技术要求分析事件从开始到结束的整个生命周期，以及一次事件与下一次停机之间的间隔。停机并不总是可以避免的；可用性管理过程不仅寻求避免停机，还要在停机发生时尽可能缩短其持续时间和影响。通过分析流程中每个步骤所需的时间，并利用任何机会缩短该阶段，可以缩短停机时间。让我们逐一查看事件的每个阶段：\n\
  \n### 事件检测 (Incident Detection)\n这是从事件发生到 IT 服务提供者感知故障之间经过的时间。事件管理工具在这方面非常有帮助，它们发送故障通知，可能在用户自己感知之前就发出。这使得能够快速处理故障，从而缩短停机时间并提高可用性。工具可能具有诊断故障和自动恢复服务的能力。关于事件管理的更多信息请见第\
  \ 3 章“事件管理、请求履行和访问管理”。\n\n### 事件诊断 (Incident Diagnosis)\n这是识别故障原因的时间。更快的诊断将缩短停机时间并增加可用性。同样，某些监控工具可以协助收集必要的诊断数据帮助解决问题。这偶尔可能会延迟服务的解决，但它能够识别并消除重复故障的根源，从而减少整体停机时间。\n\
  \n### 事件修复 (Incident Repair)\n这是实施修复的时间。这可能会受到组件设计的影响，因此在服务设计阶段应小心选择可以快速修复的组件。它可能受到负责执行操作的内部团队或供应商性能的影响。服务级别管理和供应商管理应对监控相关的运营水平协议（OLA）和基础合同，以检查是否存在违约情况，并实施服务改进计划以防止未来发生此类违约。\n\
  \n### 事件恢复 (Incident Recovery)\n这是完成组件恢复的时间。应在设计周期内尽早识别硬件、软件和数据组件的备份和恢复需求，以便制定并测试适当的恢复计划。在可能的情况下，恢复操作应该是自动化的。可用性需求还应有助于确定在确定备件区域内保留哪些备件。我们在第\
  \ 12 章“变更管理和服务资产与配置管理”中讨论了确定备件的存储，该章节描述了一个专门用于安全存储备用组件和组件的存储区域，这些组件和组件的维护版本与受控测试或运行环境中的系统处于相同水平；它们用于在过渡阶段测试新服务，并在运行阶段更换故障设备。\n\
  \n### 事件恢复 (Incident Restoration)\n这是恢复正常业务服务的时间。在关闭事件之前，验证正常工作的能力至关重要。这可以通过服务台与服务用户交谈来验证。如果该服务是公众使用的（如\
  \ ATM 自动提取机或电子商务网站），可能需要对交易吞吐量进行视觉检查或使用验证端到端服务的模拟脚本。\n\n通过查看扩展事件生命周期的每个阶段，我们可以识别延迟并采取行动在未来减少这些延迟。例如，一个一小时的停机时间但修复操作时间仅为\
  \ 5 分钟，这将识别出某些延迟，例如由于事件管理工具配置不当导致在识别故障之前浪费的时间、诊断时间过长、缺乏技能、缺乏文档等。可用性管理需要与事件管理和问题管理紧密结合，以确保消除重复发生的情况。\n\
  \n#### 故障树分析 (Fault Tree Analysis)\n这种方法使用布尔逻辑（使用 `AND` 和 `OR` 语句）来分析导致故障的事件序列。这些事件可以被描述为基础事件、结果事件、条件事件或触发事件。`AND`\
  \ 语句意味着所有输入事件必须同时发生，结果事件才会发生（例如，当主线路和备用线路都中断时，网络才会中断）。`OR` 是当任何一个输入事件发生时，事件就会发生。还有一种\
  \ `INHIBIT`（抑制）语句，只有当输入条件不满足时，结果事件才会发生。图 8.7 给出了故障树和这些语句的示例。\n\n![故障树分析示例图表，服务宕和非服务时间共同汇聚到抑制，系统宕以及或（这进一步分支为服务器宕、应用程序宕和网络宕）。](img/00039.jpeg)\n\
  \nFIGURE 8.7 故障树分析示例\n\nCopyright © AXELOS Limited 2010\\. 保留所有。材料根据 AXELOS 的许可复制。\n\
  \n在图 8.7 中，如果网络或服务器或应用程序宕机，服务就会宕机（`OR` 语句的示例）。如果主线路和备用线路都中断，网络就会宕机（`AND` 语句的示例）。最后，如果故障发生在服务时间之外，服务不被认为宕机（`INHIBIT`\
  \ 语句的示例）。\n\n#### 组件故障影响分析 (Component Failure Impact Analysis)\n组件故障影响分析 (CFIA)\
  \ 是一种考虑单个组件对提供服务重要性的技术。它能够预测故障组件对服务的影响，特别是任何单点故障 (SPOFs)。这反过来将指示哪里需要弹性或风险降低措施来保护可用性。与其他技术结合，这种方法可以为未来服务的设计提供有用信息。\n\
  \nCFIA 是一种相对简单的技术，用于分析 IT 基础设施和应用程序的所有方面，例如硬件、网络、软件、应用程序、数据中心支持人员。此外，它还可以识别对 IT\
  \ 支持组织技能和人员能力的影响。\n\n该技术涉及识别要评估的 IT 基础设施配置元素，然后创建一个网格，一轴为 `CI`，另一轴为依赖于该 CI 的 IT\
  \ 服务，如图 8.8 所示。\n\n![图像显示 PC1 和 PC2 连接到交换机 1。WAN 连接到数据中心和环境（包含服务器 1 连接到磁盘系统 1 和\
  \ 2、系统软件和应用程序）。](img/00040.jpeg)\n\nFIGURE 8.8 组件故障分析示例\n\nCopyright © AXELOS Limited\
  \ 2010\\. 保留所有。材料根据 AXELOS 的许可复制。\n\n下一步是执行 CFIA 并为每个组件填充网格：如果 CI 故障不影响服务，则留空；如果\
  \ CI 故障会导致服务宕机，则填“X”；如果有备用 CI 提供服务，则填“A”；如果有备用 CI 但需要人工干预来恢复服务，则填“M”。\n\n完成后的网格将突出关键的\
  \ CI。然后可以采取措施提供弹性并保护可用性。\n\n#### 服务故障分析\n\n\n\n\n\n服务故障分析（SFA）被用作分析中断的结构化方法。每当发生中断时，都会作为一项任务或项目进行全面分析，以识别预防性措施。它采用全局视角，寻求技术、IT\
  \ 支持组织、流程、程序和工具方面的改进。其许多活动与问题管理活动紧密结合。这两个流程旨在识别根本原因，并鼓励跨部门团队合作、发散性思维以及创新且通常低廉的解决方案。\n\
  \nSFIA 应使用如图 8.9 所示的结构化方法。\n\n![结构化的 SFA 从选择机会、范围分配、计划分配、建立假设、分析数据、访问关键人员、发现与结论、建议、报告和验证开始](img/00041.jpeg)\n\
  \n图 8.9 SFA 的结构化方法\n\nCopyright © AXELOS Limited 2010\\. 保留所有权利。根据 AXELOS 的许可复制材料。报告应将建议分类在以下标题下：\n\
  \n**检测** 采取能够改进事件报告的措施，以确保尽早发现底层的 IT 服务问题，从而实现主动响应。\n\n**减少** 采取减少 IT 服务中断对用户影响的影响，可能通过缩短影响持续的时间。\n\
  \n**规避** 消除导致此类 IT 服务中断的特定原因。\n\n### 风险分析与管理\n\n风险分析和管理对可用性风险相关的业务影响可能性（某事发生的概率）提供分析。业务影响分析和对业务潜在影响的识别是风险管理的关键部分。识别风险的缓解措施是服务设计的关键组件。有关风险管理技术的更多信息可以在相关的\
  \ ISO 标准以及其他最佳实践框架（如风险管理框架）中找到。风险评估的一种常用方法是 ISO 标准 31000 中描述的方法。该评估方法包含三个步骤：\n\n\
  * `Risk identification` 创建可能影响服务的风险综合列表。\n* `Risk analysis` 涉及对风险建立全面的理解。\n* `Risk\
  \ evaluation` 决定哪些风险需要采取行动以及它们之间的相对优先级。\n\n应对风险的可能措施可能包括：\n\n* 通过决定不开始或继续高风险活动来规避风险\n\
  * 决定承担风险以从机会中获益\n* 消除风险\n* 采取行动降低风险发生的可能性\n* 减轻故障的影响\n\n### 可用性管理触发器、输入、输出和接口\n\n\
  我们现在回顾可用性管理的触发器、输入和输出，以及该流程如何与其他服务管理流程对接。\n\n### 触发器\n\n许多事件可能触发可用性管理活动，包括：\n\n\
  * 新的或变更的业务需求，或新的或变更的服务\n* 协议中新增或变更的目标，例如服务水平要求、服务水平协议（SLA）、运营水平协议（OLA）和合同\n* 服务或组件违、可用性事件和警报，包括阈值事件和异常报告\n\
  * 定期活动，如对服务进行审查、修订或报告\n* 对可用性管理预测、报告和计划的审查\n* 对业务和 IT 计划及策略的审查与修订\n* 设计和策略的审查与修订\n\
  * 业务流程、关键业务功能、IT 服务或组件风险或影响变化的识别或通知\n* 服务水平管理请求协助可用性目标并对达成情况进行解释\n\n### 输入\n\n若干信息源作为可用性管理流程的输入。部分包括：\n\
  \n* 来自组织业务战略、计划、财务计划的业务信息，以及其当前和未来需求的信息，包括对新或增强 IT 服务的可用性要求\n* 来自服务水平管理流程的服务信息，包含服务组合和服务目录中的服务详细信息；来自服务水平协议和服务水平要求中的服务水平目标；以及可能来自对\
  \ SLA 的监控、服务审查和 SLA 违约\n* 来自 IT 服务财务管理的财务信息、服务提供的成本以及资源和组件的成本\n* 来自变更管理流程的变更和发布信息，包含变更计划、发布和部署管理的发布计划，以及对所有变更对服务可用性影响的评估\n\
  * 服务资产和配置管理，包含业务、服务、支撑服务与技术之间关系的信息\n* 关于支撑 IT 服务的技术组件的可用性、可靠性和维护性要求的组件信息\n* 来自配置管理系统的技术信息\n\
  * 来自之前的测量、成就、报告以及可用性管理信息系统（`AMIS`）的历史性能\n* 来自事件和问题的不可用和故障信息\n\n### 输出\n\n可用性管理产生以下输出：\n\
  \n* 可用性管理信息系统 (`AMIS`)\n* 用于主动改进 IT 服务和技术的可用性计划\n* 针对新或变更服务的可用性和恢复设计标准以及建议的服务目标\n\
  * 针对目标的服务可用性、可靠性和维护性成就报告，包括所有服务报告的输入\n* 针对目标的组件可用性、可靠性和维护性成就报告\n* 修订后的风险评估审查和报告以及更新的风险注册\n\
  * IT 服务和组件的监控、管理和报告需求\n* 用于测试所有可用性、韧性和恢复机制的可用性管理测试计划\n* 计划的预防性维护计划\n* 为变更管理与发布和部署管理协作创建的预计服务中断\
  \ (`PSO`) 文档提供的贡献内容\n* 将部署的主动可用性技术和措施的细节\n* 包含在服务改进计划中的改进措施\n\n#### 可用性管理接口\n\n\
  正如你预期的那样，该流程在整个生命周期中存在许多接口。事实上，可用性管理可以与大多数服务管理流程关联。然而，可用性管理与其他流程对接的关键接口如下：\n\n**服务水平管理**\
  \ 此流程依赖可用性管理来确定和验证可用性目标，并调查解决服务和组件违约。它连接到可用性管理的响应性和主动性元素。\n\n**事件和问题管理** 正如你从可用性测量和管理中使用的技术所看到的那样，这些流程在可用性管理的协助下解决事件和问题。\n\
  \n\n\n\n### 容量管理\n这提供了适当的容量以支持韧性和整体服务可用性。服务的可用性与服务的容量之间存在着紧密的联系。通过业务活动模式和用户画像来理解业务对\
  \ IT 的需求，以便进行与业务对齐的可用性规划。\n\n# 变更管理\n根据对停机的调查或业务所需的改进，变更管理支持对变更的管理。这反过来被用于创建预测服务中断（PSO）文档，在可用性管理的贡献下，预测变更期间与可用性相关的问题。\n\
  \n### IT 服务连续性管理\n可用性管理与此流程协作，对业务影响和风险进行评估，并提供韧性、故障转移和恢复机制。连续启动（continuity invocation）是可用性管理问题的结果，该问题在没有恢复计划所述的额外资源的情况下，无法在约定的时间范围内解决。\n\
  \n### 信息安全管理\n简单来说，如果数据不可用，服务就会不可用。信息安全管理定义了必须在服务可用性设计和恢复设计中包含的安全措施和策略。\n\n## 访问管理\n\
  可用性管理提供了根据需要适当授予和撤销服务访问的方法。这应该被仔细监控，因为未经授权或不受控制的访问会对服务可用性构成重大风险。\n\n### 可用性管理中的信息管理\n\
  可用性管理流程强调了可用性管理信息系统的重要性。尽管在流程图（图 8.4）中显示为单一数据库或仓库，但与可用性的信息更有可能存在于不同的工具和系统中。可用性管理者的挑战在于理解这些不同的来源，并创建一个单一信息源，以便制定可用性计划。\n\
  \n尽管可用性管理工具的供应商声称，但通用工具集很难满足单个客户的独特需求。始终需要根据客户需求进行定制、适配和配置，并且对获得的信息进行管理，以确保其符合用途和目的。这些信息涵盖了服务、组件和支持服务，为定期的、临时的异常可用性报告提供了基础，并能识别数据中的趋势以启动改进活动。\n\
  \n可用性计划应有目标、目的和交付物，并应考虑人员、流程、工具和技术等更广泛的问题，同时关注技术重点。随着可用性管理流程的成熟，该计划应演进并涵盖以下内容：\n\
  \n* 关键 IT 服务实际可用性水平与约定可用性水平的对比。可用性测量应始终以业务和客户为中心，并报告业务和用户实际体验的可用性。\n* 为解决现有 IT 服务可用性不足而正在推进的活动。在需要投资决策时，应包含相关成本和效益的选项。\n\
  * 现有 IT 服务可用性需求变更的细节。计划应记录满足这些变更需求的可用选项。在需要投资决策时，应包含每个选项的相关成本。\n* 即将推出的新 IT 服务可用性需求细节。计划应记录满足这些新需求的可用选项。在需要投资决策时，应包含每个选项的相关成本。\n\
  * 计划 SFA 分配的前瞻性进度。\n* 对 SFA 分配进行定期审查。这些审查应完成，以确保技术可用性结合 SIP（服务改进计划）得到积极提高。\n* 技术未来章节，为计划中的技术升级提供的潜在收益和利用机会提供指示。预期的可用性效益应在可能的情况下结合容量管理，基于以业务为中心的措施进行详细说明。还应量化在可能实现这些效益所需的精力。\n\
  \n该计划跨度为六个月到一年，通常作为滚动计划产生，并不断更新以满足业务不断变化的需求。至少建议发布应与容量管理和业务预算周期对齐，并将可用性计划视为容量计划和财务计划的补充。更新的频率取决于组织的性质以及技术或业务变化的速率。\n\
  \n可用性管理信息系统可用于记录和存储选定的数据和信息，以支持报告生成、统计分析以及可用性预测和规划等关键活动。它应该是记录 IT 可用性指标、测量值、目标和文档的主要仓库，包括可用性计划、可用性测量、达成报告、SFA\
  \ 分配报告、设计准则、行动计划和测试计划。\n\n### 可用性管理流程角色\n如本章提到的，第一章探讨了适用于整个服务生命周期所有流程的通用角色。这些角色与可用性管理流程相关，并与在本章之前讨论的容量管理角色相似，但再次也适用特定的额外要求。请记住，这些不是“职位名称”，它们是对成功运行该流程可能需要的角色指导。\n\
  \n#### 可用性管理流程所有者\n可用性管理流程所有者的职责通常包括：\n\n* 履行可用性管理流程的通用所有者角色（更多信息见第 1 章）\n* 与其他经理合作，确保接受可用性管理作为所有可用性相关问题的单一协调点，无论涉及什么特定技术\n\
  * 与其他流程所有者合作，确保可用性管理、服务水平管理、容量管理、IT 服务连续性管理和信息安全管理采取集成方法\n\n#### 可用性管理流程经理\n可用性管理流程经理的职责通常包括：\n\
  \n* 履行容量管理流程的通用经理角色（更多信息见第 1 章）\n* 协调可用性管理与其他流程之间的接口，特别是服务水平管理、容量管理、IT 服务连续性管理和信息安全管理\n\
  * 确保所有现有和新服务都能交付业务在 SLA 中约定的可用性水平\n* 验证最终设计是否满足指定的最低可用性水平\n* 协助调查和诊断导致可用性问题或服务或组件不可用的事件和问题\n\
  * 参与 IT 基础设施设计，包括规定硬件和软件的可用性需求\n\n\n\n\n* 为用于自动监控 IT 组件可用性的新型或增强型事件管理系统规范需求。\n*\
  \ 为由内部和外部供应商提供的组件规范可靠性、可维护性和可服务性需求。\n* 监控并报告相对于 SLA 目标的实际 IT 可用性达成情况，以确保约定的可用性、可靠性和可维护性水平得到持续的衡量和监控。\n\
  * 尽可能主动改进服务可用性，并优化 IT 基础设施的可用性，以提供具有成本效益的改进，为业务带来切实利益。\n* 创建、维护并定期审查可用性管理信息系统以及前瞻性可用性计划，提高\
  \ IT 服务和基础设施组件的整体可用性，以确保满足现有和未来的业务可用性需求。\n* 确保可用性管理过程及其相关技术和方法定期接受审查和审计，并确保所有这些内容持续改进并符合实际需求。\n\
  * 创建应用于新设计或增强型基础设施设计的可用性和恢复设计标准。\n* 与 IT 服务财务管理部门合作，确保所需的 IT 可用性水平在成本范围内。\n* 维护并完成所有可用性机制的可用性测试计划，确保在每次重大业务变更后对所有可用性测试和计划进行测试。\n\
  * 协助安全和 IT 服务连续性管理进行风险评估和管理。\n* 评估变更对可用性所有方面的影响，包括整体服务可用性和可用性计划（这包括在适当参加 CAB 会）。\n\
  \n## 可用性管理的关键成功因素和关键指标\n\n本节包含了可用性管理的一些关键成功因素示例。还有许多因素，可以从《ITIL 服务运营》出版物或根据您在组织内的经验获得。\n\
  \n* 关键成功因素：“管理 IT 服务的可用性和可靠性”\n    * KPI：服务和组件不可用率减少（以百分比衡量）。\n    * KPI：服务和组件可靠性增加（以百分比衡量）。\n\
  \    * KPI：对所有与可用性和可靠性相关的 `SLA`、`OLA` 以及支持性合同违约进行有效的审查和跟进。\n* 关键成功因素：“满足业务对访问 IT\
  \ 服务的需求”\n    * KPI：服务不可用率减少（以百分比衡量）。\n    * KPI：由于 IT 不可用导致的事业务加班成本减少（以百分比衡量）。\n\
  * 关键成功因素：“在 SLA 中记录的 IT 基础设施和应用程序可用性，以优化成本提供”\n    * KPI：不可用成本减少（以百分比衡量）。\n    *\
  \ KPI： 服务交付成本改进（以百分比衡量）。\n\n## 可用性管理的挑战与风险\n\n我们将首先查看该流程的主要挑战。\n\n### 挑战\n\n主要的挑战是满足并管理客户和业务的预期。服务水平应向所有客户和业务领域公布，这样当服务发生故障时，对其恢复的预期将处于正确的水平。这意味着可用性管理必须获得有关当前业务对\
  \ IT 服务需求及其未来计划的正确级别的质量信息。\n\n可用性管理面临的另一个挑战是将所有可用性数据集成到一组信息集（`AMIS`）中。这可以通过一致的方式进行分析，提供所有服务和组件的可用性细节。当不同技术的信息由不同工具以不同格式提供时，这种情况往往非常具有挑战性。\n\
  \n可用性管理面临的另一个挑战是对主动可用性措施所需的投资。可用性管理应与 `ITSCM`、信息安全管理和容量管理紧密合作，为获得适当投资提供必要的理由。\n\n\
  ### 风险\n\n以下是与可用性管理相关的一些主要风险：\n\n* 业务对可用性管理过程缺乏投入。\n* 缺乏来自业务未来计划和策略的适当信息。\n* 高层管理对可用性管理过程缺乏投入，或缺乏可用的人力资源和/或预算。\n\
  * 劳动密集型的报告流程。\n* 过度关注技术而不够关注服务和业务需求的流程。\n\n当可用性管理信息系统处于孤立维护状态，且与其他流程领域（特别是 `ITSCM`、信息安全管理和容量管理）不共享或不一致时，另一个风险变得显而易见。在考虑满足特定需求的服务和组件备份及恢复工具、技术和流程时，这种交互尤为重要。\n\
  \n## 信息安全管理\n\n服务的另一个关键保证方面是安全，我们将在本章的最后一节讨论这一方面。不安全的服务将无法为客户创造价值，而且可能根本不会被使用。\n\
  \n`信息安全管理 (ISM)` 的核心是识别和缓解对组织信息安全的风险。`ISM` 流程确保在整个服务生命周期中考虑并管理所有安全方面。\n\n组织在整体公司治理框架下运行，信息安全管理是该框架的一部分。根据全组织范围的治理，`ISM`\
  \ 提供相关要求的指导，确保风险得到管理并实现组织目标。\n\n### 信息安全管理的目的\n\n信息安全管理流程的目的是 IT 安全与业务安全对齐。IT 和业务安全要求组织的资产、信息、数据和\
  \ IT 服务的机性、完整性和可用性始终符合业务指定的需要。\n\n### 信息安全管理的目标\n\n信息安全管理的目标是保护依赖信息的利益。它还应确保提供信息的系统和通信免受机密性、完整性和可用性故障造成的损害。\n\
  \n对于大多数组织来说，当满足以下条款时，即认为实现了安全目标：\n\n* 机密性：信息仅由有权访问的人员观察或披露。\n* 完整性：信息完整、准确，并防止受到未经授权的修改。\n\
  * 可用性：信息在需要时可用且可用，提供信息的系统能够适当抵抗攻击并从故障中恢复或防止故障。\n* 业务交易以及企业之间或与伙伴之间的信息交换是可以信赖的。这被称为真实性，在对拒绝访问有控制的情况下，则被称为不可否认性。\n\
  \n### 信息安全管理的范围\n\n\n\n\n\n`ISM` 的范围涵盖对业务至关信息安全的所有方面。定义哪些需要保护以及这种保护应该有多强度是业务部门的责任。必须识别安全风险，并实施适当的应对措施。这些措施可能包括物理方面（通过刷卡限制对安全区域的访问）也包括技术方面（密码策略、生物识别的使用等）。信息安全是企业治理不可或缺的一部分。\n\
  \n信息安全管理流程应当是所有 IT 安全问题的焦点。该流程的一个关键职责是制定信息安全策略，并对该策略进行维护和执行，使其涵盖所有 IT 系统和服务的使用及误用情况。\n\
  \n信息安全管理需要理解整体 IT 和业务安全环境。策略中必须包含的重要方面包括业务安全策略和计划，以及当前的业务运营及其安全需求。还必须考虑未来的业务计划和需求。外部因素（如法律和合性要求）也应包含在策略中。\n\
  \nIT 在安全方面的义务和责任应包含在与客户签署的服务水平协议中。策略还应包括对业务和 IT 风险及其管理的引用。\n\n信息安全管理流程应包括信息安全策略及辅助安全策略的制定、维护、发布和执行。这将涉及理解业务当前和未来的安全需求，以及现有的业务安全策略和计划。\n\
  \n该流程将负责实施一套支持信息安全策略的安全控制。这将支持与服务、信息和系统访问相关的风险管理。信息安全管理负责所有安全控制的文档记录，以及这些控制的运行维护及其相关风险。\n\
  \n在供应商管理方面，该流程还将处理涉及访问系统和服务的供应商及合同管理。\n\n在操作上，信息安全管理将参与管理与所有系统和服务相关的所有安全漏洞、事件和问题。它还负责主动改进安全控制、安全风险管理以及减少安全风险。\n\
  \n信息安全管理还负责将安全因素整合到所有其他 IT 服务管理流程中。为了实现有效的信息安全治理，该流程必须建立并维护信息安全管理体系（`ISMS`）。\n\n\
  ## 信息安全管理对业务的价值\n\n随着组织对 IT 系统的依赖增加，以及组织内部和组织之间使用更多电子媒体进行交易，安全已成为组织的关键问题。\n\n信息安全管理确保维护并执行一份符合业务安全策略需求和企业治理要求的信息安全策略。信息安全策略通过在所有\
  \ IT 领域实施适当的安全控制，为业务流程提供保障。该流程负责根据业务和企业风险管理流程及指南进行 IT 风险管理。\n\n## 信息安全管理策略\n\n信息安全管理活动应以整体安全策略和一系列基础特定安全策略为核心并为其驱动。\n\
  \n信息安全策略应获得高层 IT 管理全面支持。理想情况下，高层业务管理人员也应支持并致力于安全策略。策略应涵盖所有安全领域，确保恰当并满足业务需求。电子邮件使用策略、防病毒策略和远程访问策略都是特定安全策略的示例。\n\
  \n信息安全流程负责创建、管理和维护信息安全管理体系。管理体系的要素如图图 8.10 所示。它从识别客户需求和业务需求开始。\n\n![ISMS 循环过程图：计划（服务和运营层策略）、实施（物理网络安全）、评估（内部和外部审计）、维护（常规），并以控制为中心。](img/00042.jpeg)\n\
  \n图 8.10 管理 IT 安全的 ISMS 元素\n\nCopyright © AXELOS Limited 2010\\. 版权所有。材料根据 AXELOS\
  \ 许可复制。\n\n系统的规划整合了在各种协议和合同中捕获的细节和目标。它还涵盖了业务和 IT 同意的各种策略的使用。\n\n系统的实施需要所有受影响人员对策略和系统具有认知。这需要组织内所有部门的参与，因为策略将涵盖从人员安全到安全事件处理程序的所有内容。\n\
  \n下一阶段是评估，这需要对系统安全状态进行内部和外部审计，但也可能存在自评估。安全事件也将作为系统管理的此阶段的一部分接受评估。\n\n维护系统要求信息安全流程总结教训，以便规划和实施改进措施。\n\
  \n整体方法旨在维持控制，并为整个组织的安全管理建立一个框架。其中一部分是在 IT 部门和组织其他部分内，分配恰当的责任，以确保信息安全管理体系得到维护。\n\n\
  ## IT 安全管理流程活动、方法和技术\n\n在本节中，我们将详细探讨该流程。你应该确保自己熟悉该流程的所有方面以及每个方面的管理要求。在图图 8.11 中，你可以看到信息安全管理流程及其技术和活动。\n\
  \n![图像显示了信息安全管理流程，如沟通和执行安全策略、监控、报告和审查事件、制定和维护、评估、实施和审查，相互关联，并最终流向 SMIS 流程。](img/00043.jpeg)\n\
  \n图 8.11 信息安全管理流程\n\nCopyright © AXELOS Limited 2010\\. 版权所有。材料根据 AXELOS 许可复制。\n\
  \n信息安全管理流程确保根据业务需求和风险对安全因素进行适当的管理和控制。\n\n### 流程活动\n\n信息安全管理流程中的一项关键活动是制定和维护整体信息安全策略以及一系列辅助特定策略。该流程还负责安全策略的沟通、实施和执行，包括为业务和\
  \ IT 所有其他领域就与信息安全的所有问题提供建议和指导。\n\n\n\n\n\n信息安全管理还负责所有信息资产和文档的评估与分类。该过程涵盖了一系列安全控制的实施、评审、修订和改进，以及风险评估和响应，包括对所有变更对信息安全策略、控制和措施的影响进行评估。在可行的情况下，如果符合业务利益且成本合理，该过程应实施主动措施来改进信息安全。\n\
  \n对所有安全违和和重大安全事件的监控与管理是信息安全管理过程的关键部分。这包括对安全违和和事件的数量及影响进行分析、报告和减少。\n\n该过程还负责安排和完成安全审查、审计和渗透测试。该过程的输出将被捕获并记录在安全管理信息系统中。\n\
  \n## 安全策略\n\n信息安全管理过程结合程序、方法、工具和技术，构成了安全策略。安全经理有责任确保技术、产品和服务的到位，并配合发布的安全策略。安全经理还负责安全架构、身份验证、授权、管理和恢复。\n\
  \n信息安全面临的一项关键挑战是将良好的安全实践嵌入到业务的每一个领域。确保安全行为取决于培训和意识。安全实践需要易于遵循才能被接受。随着技术的变化，无论是向自带设备办公（BYOD）的趋势还是云计算，都会出现新的安全挑战。信息安全管理必须理解这些挑战并做好应对准备。\n\
  \n## 安全控制\n\n信息安全必须被视为所有服务和系统的不可或缺的一部分。它需要使用一套安全控制进行持续管理，以执行策略并最大限度地减少威胁。在设计新服务或更改现有服务时，应当考虑这些控制；这比在服务上线后尝试应用它们要容易得多且更具效益。一旦控制措施到位，所需的日常活动通常由访问管理执行。该过程在第\
  \ 3 章中介绍。\n\n安全措施可以用于预防和处理安全事件的特定阶段，如图 8.12 所示。大多数此类事件并非技术威胁，例如蓄意的拒绝服务攻击或尝试黑入系统。大多数违和都是人为失误的结果，甚至可能是意外的；它们可能涉及其他威胁，如安全、法律或健康。\n\
  \n![图像显示了安全控制的过程，通过每个步骤之间的预防、检测和纠，对威胁、事件、损害和控制进行评估或报告。](img/00044.jpeg)\n\nFIGURE\
  \ 8.12 针对威胁和事件的安全控制\n\nCopyright © AXELOS Limited 2010. 保留所有权利。材料根据 AXELOS 的许可复制。\n\
  \n威胁可以是任何中断业务流程或对业务产生负面影响的因素。首先存在威胁实际发生的风险。如果发生这种情况，则被称为安全事件。这可能导致必须修复或进行纠正的损害（对信息或资产）。这些每个阶段都需要采取适当的措施。措施的选择取决于信息所具有的重要性。这些措施都应该记录在信息安全管理系统中。它们包括以下类型：\n\
  \n- **预防性**：这些安全措施旨在防止安全事件的发生。此类措施的示例是将访问权限限制在少数的授权人员中。这需要控制访问权限的程序（授予、维护和撤销权限）、授权（识别谁允许访问哪些信息以及使用哪些工具）、识别和身份验证（确认谁在访问）以及访问控制（确保只有授权人员可以获得访问）。\n\
  - **减少性**：这些措施减少安全违和的潜在损害。一个示例是确保进行定期备份，以防任何数据丢失。确保已通过测试的应急计划是另一种减少性措施。\n- **检测性**：快速检测到任何安全违和是关重要的；检测性措施关注尽早发现违和。一个示例是使用与警报程序关联监控工具。另一个示例是病毒检查软件，它将检测病毒感染。\n\
  - **压制性**：这些安全措施反制安全事件的持续或重复。一个示例是在多次尝试登录失败后，账户或网络地址被临时锁定，或者在多次尝试使用错误的 PIN 码时卡片被留。\n\
  - **纠正性**：这些措施寻求修复造成的任何损害。示例包括恢复备份，或撤销/回滚到之前的稳定状态。\n\n## 安全违和与事件管理\n\n每发生严重的安全违和或事件时，必须在当时进行处理，并在事后进行评审，以确定哪里出了问题、原因是什么以及未来如何防止。然而，这种评估不应局限于严重的安全事件；所有的安全违和和安全事件都需要经过研究，以理解安全措施整体的有效性。每个安全事件都必须记录在，以便进行报告和分析。这种分析还需要安全事件记录之外的其他证据，例如日志文件和审计文件。信息安全管理应与问题管理合作，识别这些事件的根源，并采取所需的改进措施以克服弱点并防止此类事件再次发生。\n\
  \n## 信息安全管理触发器、输入和输出\n\n让我们考虑信息安全管理过程的触发器、输入和输出。信息安全管理是一个在整个组织及其流程中具有许多活动连接的过程。明确定义触发器、输入、输出和接口是非常重要的，以避免重复工作或工作流中的漏洞。\n\
  \n### 触发器\n\n信息安全管理活动可以由许多事件触发，包括：\n\n* 法定或监管要求的变更\n* 新发布或更改的企业治理指南\n* 新或更改的业务安全策略\n\
  * 新或更改的企业风险管理流程和指南\n* 新或更改的业务需求以及新或更改的服务\n* 协议中新发布或更改的要求，例如服务水平要求、服务水平协议、运营级别协议和合同\n\
  * 业务和 IT 计划及策略的评审与修订\n* 设计和策略的评审与修订\n* 服务或组件的安全违和或警告、事件和警报，包括阈值事件和异常报告\n* 定期活动，如评审、修订和报告，对评审和修订信息安全管理策略、报告和计划\n\
  * 对业务流程或关键业务功能、IT 服务或组件的风险或影响变更的识别或通知\n\n\n\n\n\n*   来自其他领域（特别是服务水平管理）对安全问题的协助请求\n\
  \n### 输入\n\n信息安全管理需要从许多领域获取输入：\n\n*   来自组织业务战略、计划和财务计划的业务信息，以及其当前和未来需求的信息\n*   来自公司治理和业务安全策略与指南、安全计划以及风险评估与响应的治理与安全信息\n\
  *   来自 IT 战略、计划和当前预算的 IT 信息\n*   来自 `SLM` 流程的服务信息，包含服务组合中服务的详情\n*   来自 `ISM`、可用性管理和\
  \ `ITSCM` 的风险评估流程和报告\n*   所有安全事件和违规事件的详情——来自 IT 和 IT 服务管理的所有领域，特别是事件管理和问题管理\n* \
  \  来自变更管理流程的变更信息\n*   配置管理系统，其中包含有关业务、服务、支撑服务和技术之间关系的信息\n*   来自供应商管理和可用性管理的合作伙伴和供应商对服务和系统的外部访问详情\n\
  \n### 输出\n\n信息安全管理过程产生以下输出，并应用于所有领域：\n\n*   一份整体信息安全管理策略，以及一系列特定的安全策略\n*   一个包含所有与信息安全管理相关信息的安全管理信息系统\
  \ (`SMIS`)\n*   修订后的安全风险评估流程和报告\n*   一组安全控制措施，包含其操作、维护细节以及相关的风险\n*   安全审计和审计报告\n\
  *   安全测试计划和方案，包括安全渗透测试和其他安全测试及报告\n*   一套安全分类和一套分类信息资产\n*   对安全违规和重大事件的审查和报告\n* \
  \  管理合作伙伴、供应商及其对服务和访问的策略、流程和程序\n\n### 信息安全管理接口\n\n信息安全管理与其他过程交互的关键接口如下：\n\n**服务水平管理**：信息安全管理协助确定安全需求和职责，并将其纳入\
  \ `SLRs` 和 `SLAs` 中，同时对服务和组件的安全违规进行调查和解决。\n\n**访问管理**：该过程负责在授予和撤销访问时遵循安全策略。\n\n\
  **变更管理**：信息安全管理 (`ISM`) 评估每个变更对安全和安全控制措施的影响。`ISM` 还可能检测并报告由于安全违规导致的未经授权的变更。\n\n\
  **事件和问题管理**：`ISM` 协助解决安全事件并调查安全问题。事件管理必须能够识别并处理安全事件。\n\n**IT 服务连续性管理**：信息安全管理与 `ITSCM`\
  \ 合作进行业务影响和风险评估，并提供弹性、故障转移和恢复机制。在测试或启动连续性计划时也必须考虑安全因素。\n\n**服务资产和配置管理**：准确的 `CMS`\
  \ 是对配置项进行安全分类的前提。\n\n**可用性管理**：`ISM` 确保数据的完整性得到保护；如果没有这种保证，服务执行约定功能的能力将受到损害。\n\n\
  **容量管理**：在选择和引入新技术时必须考虑安全因素。\n\n**IT 服务财务管理**：该过程应确保提供足够的资金以满足安全需求。\n\n**供应商管理**：安全管理与供应商管理合作，定义合同条款和条件，并对供应商访问服务和系统执行控制。\n\
  \n**法律和人力资源问题**：如前所述，安全违规往往人为行为的结果，无论是意外还是故意。因此，`ISM` 活动应与这些公司流程和功能相结合。\n\n### 信息安全中的信息管理\n\
  \n信息安全管理所需的所有信息都应包含在安全管理信息系统 (`SMIS`) 中。这包括有关安全控制、风险、违规、流程和报告的信息，涵盖所有 IT 服务和组件。`SMIS`\
  \ 应当与所有其他管理信息系统集成并保持一致，特别是服务组合和 `CMS`。`SMIS` 为安全审计、审查以及持续改进活动提供输入。`SMIS` 还为新系统和服务的的设计提供输入。\n\
  \n### 信息安全过程角色\n\n正如你所记得的，第一章探讨了适用于整个服务生命周期中所有过程的通用角色。这些角色与信息安全管理过程相关，并且与在本章之前讨论的容量和可用性管理角色相似，但再次也存在特定的额外要求。请记住，这些并不是“职位名称”，而是对于成功运行该过程可能需要的角色的指导。\n\
  \n#### 信息安全管理过程所有者\n\n信息安全管理过程所有者的职责通常包括：\n\n*   履行信息安全管理过程的通用所有者角色\n*   与业务部门合作，确保组织（业务）安全管理与信息安全管理之间进行良好的协调和沟通\n\
  *   与所有职能经理合作，确保将信息安全管理过程视为所有安全相关问题的单一协调点，无论涉及什么特定技术\n*   与其他过程所有者合作，确保在设计和实施信息安全管理、可用性管理、IT\
  \ 服务连续性管理以及组织安全管理时采取集成方法\n\n#### 信息安全管理过程经理\n\n信息安全管理过程经理的职责通常包括：\n\n*   履行信息安全管理过程的通用过程经理角色\n\
  *   协调信息安全管理与其他过程之间的接口，特别是服务水平管理、可用性管理、IT 服务连续性管理和组织安全管理\n*   制定和维护信息安全策略并支持特定策略，确保获得高级\
  \ IT 和业务管理层的适当授权、承诺和背书\n*   向所有相关方沟通传达并公布信息安全策略\n*   确保信息安全策略得到执行和遵守\n*   识别和分类\
  \ IT 和信息资产（配置项）以及所需的控制和保护级别\n*   协助业务影响分析\n*   与可用性管理及 IT 服务连续性管理结合，执行安全风险评估和风险管理\n\
  *   设计安全控制措施并制定安全计划\n*   制定并记录操作和维护安全控制措施的程序\n*   监控和管理所有安全违规并处理安全事件，尽可能采取补救措施以防止再次发生\n\
  \n\n\n\n\n-   结合问题管理，报告、分析并减少所有安全事件的影响和发生规模\n-   促进安全教育和安全意识\n-   维护一套安全控制措施和文档，并定期审查和审计所有安全控制措施和程序\n\
  -   确保对所有更改评估其对所有安全方面的影响，包括信息安全策略和安全控制，并在适当的情况下参加变更委员会（CAB）会议\n-   确保按照要求执行安全测试\n\
  -   参与任何由安全泄露引起的安全审查并启动补救措施\n-   确保服务的机密性、完整性和可用性维持服务水平协议（SLA）中约定的水平，并符合所有相关的法律要求\n\
  -   确保外部合作伙伴和供应商对所有服务的访问受合同协议和责任的约束\n-   作为所有安全问题的焦点点\n\n### 信息安全管理的关键成功因素和关键绩效指标\n\
  \n以下列表包含了信息安全管理的一些关键成功因素示例。\n\n*   关键成功因素：“保护业务免受安全违规行为的侵害”\n    *   `KPI`：向服务台台报告的安全泄露事件数量减少（以百分比衡量）\n\
  \    *   `KPI`：安全泄露和事件的影响减少（以百分比衡量）\n*   关键成功因素：“确定与业务需求相结合的清晰策略”\n    *   `KPI`：信息安全管理流程与业务安全策略及流程的不合规项数量减少\n\
  *   关键成功因素：“在安全需求方面进行有效的营销和教育，以及 IT 员工对支持服务的技术的意识”\n    *   `KPI`：整个组织对安全策略及其内容的意识得到提高\n\
  \    *   `KPI`：相对于构成这些服务的 IT 组件，支持性服务的完备性增加（以百分比衡量）\n*   关键成功因素：“客户群体对安全策略的清晰所有权和意识”\n\
  \    *   `KPI`：客户和用户完成的安全意识问卷中可接受得分增加（以百分比衡量）\n\n### 信息安全管理的挑战\n\n最大的挑战之一是确保获得来自业务、业务安全和高层的充分支持。如果不能在整个业务中强制执行，那么在\
  \ IT 中实施安全策略、程序和控制措施是毫无意义的。IT 服务和资产的主要使用场景在 IT 之外，大多数安全威胁和风险也是如此。\n\n如果建立了业务安全流程，那么挑战就变成了对齐和整合。一旦实现了对齐，挑战就变成了通过严格的变更管理以及服务资产和配置管理控制，对业务方法和\
  \ IT 系统的变更来保持它们的对齐。同样，这需要业务和高层的支持与承诺。\n\n### 信息安全管理的风险\n\n信息系统可以产生许多直接和间接利益——也会产生许多直接和间接风险。这意味着出现了新的风险领域，可能会对关键业务运营产生重大影响：\n\
  \n*   对可用性和健壮性的需求增加\n*   信息系统被误用和滥用的可能性增加，影响隐私和伦理价值观\n*   来自黑客的外部危险，导致拒绝服务攻击、病毒攻击、勒索、工业间谍活动以及组织信息或隐私数据的泄露\n\
  *   业务部门缺乏承诺\n*   高层缺乏承诺\n*   流程过于关注技术问题，而不够关注 IT 服务以及业务的需求和优先级\n*   孤立地进行风险评估和管理，未与可用性管理和\
  \ IT 服务管理（ITCM）相结合\n*   信息安全管理策略、计划、风险和信息过时，并失去与业务及业务安全相应的相关信息和计划的同步\n*   安全策略变得官僚化和/或极其难以遵循，阻碍了合规性\n\
  *   安全策略对业务没有产生价值\n\n## 总结\n\n本章探讨了容量、可用性和信息安全管理流程。它涵盖了每个流程的目的、目标以及范围。\n\n我们查看了这些流程的价值。然后我们审查了每个流程的策略以及活动、方法和技术。\n\
  \n最后，我们审查了每个流程的触发因素、输入、输出和接口以及与之相关的信息管理。我们还考虑了关键成功因素、关键绩效指标以及挑战和风险。\n\n我们检查了这些流程如何相互支持，以及它们对业务的重要性。\n\
  \n## 考试重点\n\n**理解可用性、容量和信息安全管理的目的目标。** 你需要能够解释这些流程的目的和目标。可用性管理应确保交付满足服务水平协议要求的可用性。容量管理关注服务的当前和未来容量。信息安全管理关注根据业务需求保护信息和数据。\n\
  \n**理解流程的关键成功因素和关键绩效指标。** 流程衡量是理解其成功的重要部分。你应该熟悉容量、可用性和信息安全管理的 CSF 和 KPI。\n\n**理解可用性的定义。**\
  \ ITIL 将可用性定义为 IT 服务或其他配置项在需要时执行其约定功能的能力。在服务水平协议中约定的服务时间（也称为约定服务时间）期间发生的任何非计划中断都被定义为停机。可用性衡量方法是从约定服务时间中减去停机时间，并将其转换为约定服务时间的百分比。\n\
  \n**解释可用性管理的不同概念。** 你需要能够区分可靠性、维护性和服务性。可靠性由 ITIL 定义为“衡量服务、组件或 CI 在不受中断的情况下执行其约定功能的持续时间”。维护性通过平均服务恢复所需时间（MTRS）来衡量。服务性被定义为第三方供应商满足合同条款的能力。该合同将包括支持服务或组件的约定可用性、可靠性和/或维护性水平。\n\
  \n**理解并区分可用性管理的方法和技术。** 可用性管理可以使用不同的技术。确保你熟悉每种方法并能解释每种方法的目的。\n\n**解释信息管理在可用性管理中的作用。**\
  \ 信息是服务周期的关键，因此你需要理解可用性信息系统的内容及其在整个生命周期中的用法。\n\n\n\n\n\n# 理解容量管理的迭代活动。容量管理包括主动活动和响应性活动。这些活动包括监控、调优和分析，它们可以作为主动或响应性方法的一部分进行。\n\
  \n# 理解容量管理的子过程。业务容量管理关注业务需求和理解业务需求。服务容量管理关注服务满足业务需求的能力。组件容量管理关注容量管理的技术方面以及单个服务组件的容量。\n\
  \n# 理解安全管理方法。计划、实施、评估、维护和控制——确保你能够解释这些阶段每一个如何支持信息安全管理方法。\n\n# 理解信息安全管理过程。确保你能够解释该过程的各个步骤以及它们与信息安全管理体系的关系。\n\
  \n## 复习题\n\n你可以在附录中找到复习题的答案。\n\n1. 下列哪些是容量管理的职责？\n    1. 协商包含在 SLA 中的容量需求\n    2.\
  \ 监控容量\n    3. 预测容量需求\n    4. 处理容量问题\n        1. 2, 3 和 4\n        2. 仅 1 和 2\n\
  \        3. 以上所有\n        4. 1, 2 和 4\n\n2. 容量管理包括三个子过程。它们分别是什么？\n    1. 服务容量、业务容量、组件容量\n\
  \    2. 系统容量、业务容量、组件容量\n    3. 服务容量、业务容量、配置容量\n    4. 系统容量、业务容量、基础设施容量\n\n3. 下列哪项是对业务容量管理子过程的正确描述？\n\
  \    1. 它考虑了支持新服务的员工资源容量。\n    2. 它提供了与技术资产性能管理相关的详细信息视图。\n    3. 它提供了组织未来计划和需求的视图。\n\
  \    4. 它提供了在运行环境中实现的服务性能视图。\n\n4. 正确或错误？容量管理既有响应性活动也有主动活动。\n    1. 正确\n    2. 错误\n\
  \n5. 下列陈述中哪些是正确的？\n    1. 风险管理是容量管理和信息安全管理的组成部分。\n    2. 容量管理和信息安全管理都是循环过程。\n  \
  \      1. 仅陈述 1\n        2. 仅陈述 2\n        3. 两个陈述都正确\n        4. 两个陈述都不正确\n\n6.\
  \ 下列哪个是信息安全管理过程的主要目的？\n    1. 创建并维护信息安全策略\n    2. 就安全问题向运营过程提供指导\n    3. 支持供应商管理在合同中维护安全关注点\n\
  \    4. 管理信息安全管理信息系统\n\n7. 下列陈述中哪些是正确的？\n    1. 计划（Plan）是信息安全管理体系的元素。\n    2. 维护（Maintain）是信息安全管理体系的元素。\n\
  \        1. 仅陈述 1\n        2. 仅陈述 2\n        3. 两个陈述都正确\n        4. 两个陈述都不正确\n\n\
  8. 信息安全管理将安全信息存储在哪里？\n    1. ISDB\n    2. IMSS\n    3. KEDB\n    4. SMIS\n\n9. 下列哪些概念是可用性的关键？\n\
  \    1. 可可靠 (Reliability)\n    2. 恢复能力 (Resilience)\n    3. 抗性 (Resistance)\n  \
  \  4. 可获得性 (Attainability)\n    5. 可服务 (Serviceability)\n    6. 可维护性 (Maintainability)\n\
  \    7. 可检测性 (Detectability)\n        1. 1, 2, 6, 7\n        2. 2, 3, 5, 6\n   \
  \     3. 1, 4, 6, 7\n        4. 1, 2, 5, 6\n\n10. 可用性管理考虑 VBFs。VBF 代表什么？\n    1.\
  \ 可行的业务因素 (Viable business factors)\n    2. 关键业务功能 (Vital business function)\n \
  \   3. 可见性、效益、功能 (Visibility, benefits, functionality)\n    4. 关键业务设施 (Vital business\
  \ facilities)\n\n# 第 9 章：IT 服务连续性管理与需求管理\n\n**本章讨论了以下 ITIL 计划、保护与优化能力中考试目标：**\n\n\
  * **![images](img/00005.jpeg) IT 服务连续性管理和需求管理将从以下方面讨论**\n    * 目的\n    * 目标\n  \
  \  * 范围\n    * 价值\n    * 策略\n    * 原理和基本概念\n    * 过程活动、方法和技术\n    * 触发器、输入、输出和接口\n\
  \    * 信息管理\n    * 过程角色\n    * 关键成功因素和关键性能指标\n    * 挑战\n    * 风险\n\n![](img/00006.jpeg)\
  \ IT 服务连续性管理是指在业务发生灾难时管理服务交付的过程，以及防止由 IT 服务引起灾难的过程。它涵盖了关键服务的保护以及这些服务的恢复计划。\n\n需求管理涵盖从业务活动模式对业务进行分析，以及为了满足和管理这些服务需求所需要采取的方法。\n\
  \n## IT 服务连续性管理\n\n事实是，服务只有在可用时才提供价值。除了在可用性管理过程下执行的活动外，IT 服务提供者还需要确保服务免受可能导致无法交付的灾难性事件的影响。在无法避免的情况下，需要有一份计划，以符合业务需求的时间范围和成本从任何此类中断中恢复。确保\
  \ IT 服务连续性是服务保障的一项重要要素。\n\n重要的是要理解 `IT 服务连续性管理 (ITSCM)` 负责业务业务所需的 IT 服务的连续性。业务应该有一份业务连续性计划，以识别并避免任何影响业务运行能力的潜在情况。如果无法避免此类事件，业务连续性管理过程应该有一份适当且负担得起的计划，以最大限度地减少其影响并从中恢复。因此，`ITSCM`\
  \ 可以被支持业务连续性管理 (BCM) 过程的多个要素之一，人力资源连续性计划、财务管理连续性计划、建筑管理连续性计划等。\n\n### IT 服务连续性管理的目的\n\
  \nIT 服务连续性管理过程的目的是支持整个 BCM 过程。尽管许多组织离开了其 IT 服务提供者无法生存，但它并不是业务连续性的替代品。该过程反映业务连续性需求是非常重要的。随后，服务提供者可以通过管理可能严重影响\
  \ IT 服务的风险，始终能够提供约定的最小业务连续性相关服务水平，从而支持这些需求。\n\n为了支持并与 BCM 过程保持一致，`ITSCM` 使用正式的风险评估和管理技术，将\
  \ IT 服务的风险降低到约定的接受水平。服务提供者将计划并准备恢复 IT 服务，以满足这些约定的水平。\n\n### IT 服务连续性管理的目标\n\n\n\n\
  \n\nIT 服务连续性管理的核心目标是制定并维护一套 IT 服务连续性计划，以支持组织的整体业务连续性计划。这需要进行完整且定期的业务影响分析活动，以确保所有连续性计划都与不断变化的业务影响和需求保持一致。\n\
  \n另一个目标是定期进行风险评估和管理活动，以便在约定的业务风险水平内管理 IT 服务。这应该与业务、可用性管理过程以及信息安全管理过程结合完成。\n\n与所有服务设计流程一样，该流程的目的是对业务和\
  \ IT 的所有其他领域就所有连续性相关问题提供建议和指导。\n\nIT 服务连续性还应确保建立适当的连续机制，以满足或超过约定的业务连续性目标。这需要对所有变更对\
  \ IT 服务连续性计划及支持方法和程序的影响进行评估。\n\n通过与可用性管理合作，该流程应确保实施成本合理的预防性措施，以提高服务的可用性。\n\n服务连续性管理还应与供应商管理流程相结合，与供应商谈判并约定合同提供必要的恢复能力，以支持所有连续性计划。\n\
  \n## IT 服务连续性管理的范围\n\n当我们考虑 IT 服务连续性管理的范围时，重要的是理解该流程关注的是业务认为足够重大并视为灾难的事件。不那么重要的事件将作为事件管理流程的一部分处理。\n\
  \n每个组织对什么构成灾难都有自己的理解。组织内部 IT 服务连续性管理的范围取决于组织结构、文化和战略方向（包括业务和技术），取决于所提供的服务以及这些服务随时间推移的发展和变化。\n\
  \nIT 服务连续性管理首先考虑支持业务流程的 IT 资产和配置。该流程通常不涉及长期风险，例如业务方向或其他业务相关变更引起的风险。同样，它通常不涵盖微小的技术故障（例如非关键磁盘故障），除非其对业务的影响可能是重大的。\n\
  \nIT 服务连续性管理流程包括对 `ITCM` 流程范围的约定以及为支持业务需求而采用的政策。该流程还将开展业务影响分析，以量化 IT 服务中断对业务产生的影响。\n\
  \n通过开展风险评估和管理来确定潜在威胁发生的概率至关重要。这还包括在成本合理的情况下采取措施来管理已识别的威胁。管理这些威胁的方法将形成 `ITCM` 策略和计划的核心。\n\
  \n该流程至关重要的是制定整体 IT 服务连续性管理策略，该策略必须整合到业务连续性管理策略中。这应该通过结合风险评估与管理以及业务影响分析来制定。策略应包括成本合理的风险降低措施，以及选择适当且全面的恢复方案。\n\
  \n作为策略的一部分，应要求制定 IT 服务连续性计划，该计划应与业务连续性计划相结合。这些计划应作为持续运行的一部分进行测试和管理。这将需要定期测试和维护，以确保它们与业务连续性保持一致。\n\
  \n## IT 服务连续性管理对业务的价值\n\nIT 服务连续性管理是组织 IT 服务提供保证和管理的组成部分，因为它支持业务连续性流程。它通常可以通过提高对故障对组织影响的意识，为业务连续性流程和计划提供依据。\n\
  \n该流程应由业务连续性识别的业务风险所驱动，并确保 IT 服务的恢复安排与识别的业务影响、风险和需求保持一致。\n\n## IT 服务连续性管理流程、方法和技术\n\
  \nIT 服务连续性管理是一个重复的循环过程。随着组织需求的变化，连续性和恢复的要求也会随之变化，因此必须不断审查该流程并验证其输出的有效性。该流程见图 9.1。\n\
  \n![图像显示了不同流程图中的 BCM（策略、计划、持续运行和启动）与 ITSCM（需求、实施、持续运行和启动）的启动，其内容通过双向箭头连接。](img/00045.jpeg)\n\
  \n`FIGURE 9.1` IT 服务连续性管理生命周期\n\nCopyright © AXELOS Limited 2010. 保留所有。材料根据 AXELOS\
  \ 的许可进行复制。\n\n### 启动\n\n该流程分为四个阶段。第一阶段是启动，即根据业务连续性要求建立连续性要求的政策和范围。在此阶段，如果范围需要，将采用项目管理方法。理想情况下，此阶段将由\
  \ BCM 团队或方法引导，因为它是 `ITCM` 需求的主要驱动力。在此阶段，重点关注组织定义的关键业务职至关重要。\n\n在此阶段应制定一份用于指定与连续性相关的管理意图和目标的政策。应设定\
  \ `ITCM` 的范围，包括组织内所有利益相关者的角色和职责。政策应根据组织的需求以及任何识别出的监管、立法或保险合规性问题来制定。这将包括组织中使用的任何标准，如\
  \ `ISO/IEC 20000` 或 `27001`。\n\n如果使用项目管理方法，它应涵盖以下内容：\n\n*   分配资源；需要考虑计划的建立以及后续的维护。这两个阶段所需的技能可能不同，外部咨询可能有助于支持建立。但应为常驻员工提供足够的培训以执行计划。\n\
  *   团队的结构；这对于此类性质的项目至关重要，因为职责将跨越 IT 和业务部门。\n*   项目的约定的输出；实现和最终产出连续性计划的计划。\n\n###\
  \ 需求和策略\n\n在下一阶段，需求和策略，将开展业务影响分析以及风险评估和管理活动。这将允许连续性策略的制定。\n\n#### 业务影响分析\n\n\n\n\
  \n\n业务影响分析允许我们理解特定服务中断对业务产生的影响以及这些影响在什么情况下发生。影响可能是财务上的、声誉上的、监管上的、人身安全风险、市场份额损失、政治影响、额外成本或商誉损失。这并不是一个全面详尽的列表；组织有必要确定适用于自己的影响。还应该考虑损失持续期间产生的影响——通常这种影响会随着时间的推移而变得更加关键。时间也将是恢复速度的因素，为了恢复服务交付最低需求所需的技能和能力也是如此。\n\
  \n影响应针对特定场景进行衡量——例如，理解无法处理来自网站订单的影响。应该审查组织内各层级员工的各种观点。组织不太可能负担得起在整个过程中恢复整个业务的费用，但部分恢复可能在成本上是合理的。理解业务的最低需求对于产生正确水平的恢复至关重要。\n\
  \n## 风险评估\n\n恢复策略的第二个驱动因素是需要恢复的概率。这将涉及对威胁水平以及在威胁情势发生时组织脆弱性的水平进行评估。可以使用多种风险管理方法，但重要的是\
  \ IT 部门应使用与组织其他部分推荐并使用的方法。\n\n使用结构化方法进行正式风险评估通常会产生风险概况。这将包括超出组织接受的“风险承受能力”的风险。通过使用该概况，可以计划缓解这些风险，并确保组织获得适当的风险管理保证。IT\
  \ 对许多不同的风险情势具有控制权，如下：\n\n* 内部网络或系统丢失\n* 外部系统丢失\n* 数据丢失\n* 网络服务丢失\n* 关键技术或支持人员不可用\n\
  * 服务提供商故障（例如，外包 IT）\n\n## IT 服务连续性策略\n\n基于风险评估和业务影响分析，应该开发出支持业务连续性管理（BCM）策略的 IT\
  \ 服务连续性策略。该策略应该平衡风险降低与恢复或连续性方案。这将包括响应业务影响分析的恢复方案。\n\n风险响应措施将作为可用性管理的一部分通过此过程确定，但最终的恢复方案必须经过业务部门同意以满足连续性要求。恢复方案包括：\n\
  \n`Manual Workarounds`（手动方案）某些情况下可以临时使用手动解决方案——例如，使用纸质方法在服务台进行通话记录。\n\n`Reciprocal\
  \ Arrangements`（互协议）与竞争对手共享继续运行的能力似乎是违反直觉的，但在某些情况下这是法律规定的——例如，手机公司共享网络以继续对紧急服务提供支持。\n\
  \n`Gradual Recovery`（渐进恢复）这种方案有时被称为 `cold standby`（冷备），提供一个具有电力环境控制的地点，但没有计算设备或数据。这种解决方案仅适用于非关键服务，这些服务可以承受数天而非小时的中断。该场所可能是便携的，并可能需要与计算机设备供应商签订休眠合同（在情况需要时启动）来完成该能力。\n\
  \n`Intermediate Recovery`（中级恢复）通常被称为 `warm standby`（温备），该方案可用于在规定的时间内进行恢复，以防止对业务产生影响。这在业务影响分析期间已获得业务部门的同意。\n\
  \n常用的方法是使用第三方恢复机构提供的商业设施。这些设施通常提供许多不同的订阅者，允许成本分摊到他们身上，从而降低每个人的总成本。该恢复方案的优势是可以在极短的时间可以使用具有基本计算能力的地点。然而，数据仍需要在设备上提供和配置，因此这不是一个即时解决方案。\n\
  \n如果中断要求在原始合同约定之外持续使用恢复站点，则使用此类场所可能会有进一步的财务考量。此外，如果安全是组织的关键因素，考虑使用第三方地点的风险也是重要的。\n\
  \n`Fast Recovery`（快速恢复）这种方案有时被称为 `hot standby`（热备），提供服务的快速恢复，并可以作为前一个方案（中级恢复）的扩展。某些组织可能在整个组织范围内提供自己的设施，但这些设施不是正常的运营中心。其他组织可能在备用地点拥有自己的第二个位置，以增强恢复方案的韧性。\n\
  \n现场服务器或系统可以安装组织数据，甚至可以从运行服务器进行镜像。在发生故障时，此恢复方案允许切换到备份站点而服务损失损失。这通常在 24 小时内实现。\n\n\
  `Immediate Recovery`（立即恢复）这种方案也可以被描述为 `hot standby`、`mirroring`（镜像）、`load balancing`（负载均衡）或\
  \ `split site`（拆分站点），提供服务的立即恢复，且对业务没有显著的服务损失。此方案可以应用于业务关键服务或需要持续运行的组织。通过在双地点提供设备和数据，该方案能够无缝切换到恢复站点。随后，可以在维持另一个正常运行的同时恢复第二个站点。由于该站点位置独立且距离足够远，不受主站点发生的任何事件的影响，它必须时刻有人值并能够承担组织的正常运行。由于让这些员工仅仅等待灾难发生是不现实的，这种类型的设施通常是组织日常运行的一部分。\n\
  \n无论采用何种方案，都必须考虑服务提供的支持领域，如电力、电信、水、快递、邮政、纸质记录和参考资料。\n\n### 实施\n\n策略的实施需要开发 IT 服务连续性计划，包括恢复计划和程序。这一阶段是实施风险降低措施并对计划进行初步测试。\n\
  \n### 开发 IT 服务连续性计划和程序\n\nITSCM 计划提供了在业务可接受的时间范围内支持关键系统、服务和设施的持续提供或恢复所需的信息。\n\n\n\
  \n\n\n计划应包含对所有所需活动的引用，以确保在被调用时提供的服务既符合`适用目的`又符合`使用需求`。计划还应包括测试需求（性能测试、功能测试、操作测试和验收测试）以及对数据完整性和一致性的验证。这些计划不仅仅是恢复计划——它们还应该包含风险措施以及对所选恢复方案的合理性说明。所有员工都应能够访问计划，并在调用时能够快速获取，因此优先信息应该易于查找，且清晰无误。\n\
  \n计划的子章节可能包括以下内容：\n\n- **应急响应**：与所有应急服务和活动的接口\n- **损害评估**：损害评估人员的联系方式、计划和流程的细节\n\
  - **打救**：打救联系人、活动和流程信息\n- **关键记录**：对业务运营至关重要的记录和信息详述\n- **危机管理与公关计划**：危机状况的指挥与控制，以及媒体和宣传管理\n\
  - **住宿与服务**：持续运营所需的住宿、设施和服务的管理\n- **安全**：涵盖主备地和恢复场所的安全方面\n- **人员**：在连续性事件期间如何管理人员问题\n\
  - **通信**：在整个连续性事件期间如何管理所有通信方面\n- **财务与行政**：获取任何必要应急资金的替代方法和流程细节\n\nITSCM 计划在被调用后，不仅将涵盖灾难情况下恢复\
  \ IT 系统和服务的所需信息，还将涵盖在灾难结束后如何恢复到正常工作。\n\n组织结构可能与正常运营结构不同，应在计划中进行详细说明。应当考虑以下因素：\n\n\
  - **执行层**：执行层和高级管理人员在组织控制、危机管理以及与外部服务和媒体联系方面的角色。\n- **协调层**：通常是执行层层级的下一层级，应当定义这些角色以管理恢复工作的整体协调。\n\
  - **恢复**：从业务和 IT 方面代表受恢复影响的系统和服务。每个团队都将定义具体的职责和活动，在连续性计划中明确定义这些角色至关重要。\n\n### 风险恢复/减少安排的实施\n\
  \n基础设施内的风险减少措施通常与可用性管理结合实施。但对连续性的特定要求可能需要涉及备用安排的额外活动。例如：\n\n- 与第三方恢复设施进行谈判并签订合同安排\n\
  - 准备并配备备用住宿\n- 购买并安装备用计算机系统\n\n### 初始测试\n\n可以假设，未经充分测试的恢复计划不太可能按预期运行（如果能运行的话）。测试是\
  \ ITSCM 过程中的关键部分，因为它是确保恢复方案、策略以及业务恢复计划和程序在实践中有效的唯一途径。服务提供商有责任确保 IT 服务在灾难后能够在约定的时间内按照约定的功能和性能进行恢复。\n\
  \n测试有四种基本类型：\n\n- **走演**：一种与相关人员模拟计划的初始方法。\n- **全测试**：在计划制定后进行，并在此之后至少每年定期间隔进行一次。测试应涉及业务部门，并尽可能涉及实际的备用安排。最终结果是同时测试恢复计划和业务流程的恢复。为了确保客观性，建议聘请外部观察员，其报告作为测试评审的一部分。测试可以是宣布的，也可以是不通知的；第一次测试可能会宣布并做好充分准备。随后的任何测试都可以不经通知，以检查恢复计划在特定时间和针对不同利益相关者的实际能力。\n\
  - **部分测试**：这些不是全测试的替代品，但对于检查单一服务或计划的特定元素非常有用。\n- **场景测试**：这些可以用于测试特定场景、事件或情况的计划。它们可以用于验证业务连续性计划和\
  \ IT 服务连续性计划是否正确整合。\n\n所有测试都应根据约定的测试场景进行，这些场景应尽可能真实。显然，即使是最全面的计划也无法涵盖每一个意外，或完全预测员工在发生严重灾难时的行为和态度。\n\
  \n### 持续运营\n\n在运营阶段，确保通过教育、意识和培训向组织传递充足的信息至关重要。应定期评审和审计计划，以确保它们满足业务的持续需求。这需要与变更管理过程相结合，连续性计划和程序应遵守变更程序。定期测试是该阶段的一部分，测试结果将反馈到该过程中。\n\
  \n### 教育、意识与培训\n\n教育、意识和培训的目的是确保所有员工都意识到业务连续性和服务连续性的影响，以及它们是如何成为正常工作的一部分的。参与计划的每个人都应接受培训，以履行他们在计划中的角色。\n\
  \n### 评审与审计\n\nITSCM 计划和所有交付物（例如合同、协议、角色和职责）必须定期评审，以确保它们保持更新。这是连续性管理中的重要因素；在调用计划时才发现它已经过时是不行的。\n\
  \n## 测试\n\n在初始测试之后，建立一个定期的测试程序很重要，最好每年一次。这应该根据业务连续性计划和业务需求安排。在每次业务变更后，都需要对计划进行评审、更新和重新测试，以确保\
  \ IT 在灾难后继续支持业务连续性和运营成功。\n\n# 变更管理\n\n应使用变更管理过程评估所有变更对连续性计划的影响。任何更改都必须作为整体实施的一部分来处理。服务或业务要求的任何更改都应通过业务影响分析和风险评估进行评估。ITSCM\
  \ 计划必须受到严格的变更控制，因为它本身就是一个重要的配置项。\n\n### 调用\n\n确保有一个清晰的何时调用连续性计划的机制和定义至关重要。这并不是过程中的一个阶段，但它是过程的重要部分，因为建立实施连续性计划的触发机制非常重要。调用计划的成本以及随之对业务的潜在中断意味着这不是在没有依据的情况下做出的决策。调用决策需要考虑以下因素：\n\
  \n- 损害的程度和潜在调用的范围。\n- 可能的持续时间以及场所和/服务的不可用时间。\n\n\n\n\n- 具体的日期/月份/年份以及潜在的业务影响。在年底期间，启动预案的需求可能更加紧迫，以确保年底处理工作按时完成。\n\
  \n启动程序对于整个组织来说将是一个高度活跃且压力巨大的时期，特别是对于参与实际恢复的人员而言。。管理层应当意识到潜在的职业倦怠问题，并确保人力资源的得到适当使用。其他关注点还包括维持正确水平的正常业务活动和信息安全，并确保数据保护得到保障。\n\
  \n一旦完成恢复且业务从恢复站点恢复运行，下一个目标就是恢复到正常状态。这些活动的细节应包含在计划中。使用恢复设施可能涉及特定的合同时间限制。恢复正常的计划与恢复计划同样重要，所有员工都需要对其中涉及的影响和活动了有所备。\n\
  \n### IT 服务连续性管理的触发器、输入和输出\n\n我们现在将回顾 IT 服务连续性管理的触发器、输入和输出。\n\n### 触发器\n\n许多事件都可能触发\
  \ IT 服务连续性管理活动，包括新的或变更的业务需求、新的或变更的服务，以及协议中新的或变更的目标，例如服务水平要求、服务水平协议（SLA）、运营水平协议（OLA）和合同。\n\
  \n需要评估可能启动业务或 IT 连续性计划的重大事件是该流程的另一个触发器，周期性活动也是如此，例如业务影响分析和风险评估活动；连续性计划的维护；其他审查、修订或报告活动。\n\
  \n对变更进行评估以及参加变更顾问委员会（CAB）会议应属于流程范围的一部分，因为正是在这里，有机会根据不断变化的业务需求来审查和修订业务及 IT 计划与策略，这可能会触发流程输出的变更。这包括对业务和\
  \ IT 服务提供商的设计与策略进行审查和修订。\n\n其他触发器还包括对业务流程或关键业务功能、IT 服务或组件风险或影响变化的识别或通知。计划测试的结果以及以往连续性事件中获得的教训也将为该流程提供触发器。\n\
  \n### 输入\n\nITSCM 流程需要许多输入源：\n\n- 来自组织的业务战略、计划和财务计划的业务信息，以及当前及未来需求\n- 来自 IT 战略、计划和当前预算的\
  \ IT 信息\n- 来自所有业务部门的业务连续性策略和一系列业务连续性计划\n- 来自 `SLM` 流程的服务信息，包括服务组合和服务目录中的服务详情，以及\
  \ `SLAs` 和 `SLRs` 中的服务水平目标\n- 来自 IT 服务财务管理的财务信息、服务提供的成本以及资源和组件的成本\n- 来自变更管理流程的变更信息，包括变更计划以及对所有变更对\
  \ ITSCM 计划影响的评估\n- 配置管理系统（`CMS`），包含业务、服务、支持性服务与技术之间关系的信息\n- 业务连续性管理和可用性管理测试计划\n\
  - 容量管理信息，识别在发生连续性事件时运行关键服务所需的资源\n- 相应的供应商和合作伙伴的 IT 服务连续性计划和测试报告\n\n### 输出\n\nITSCM\
  \ 流程的输出如下：\n\n- 新或修订的 ITSCM 策略和策略\n- 一系列 ITSCM 计划，包括所有的危机管理计划、应急响应计划和灾难恢复计划，以及与恢复服务提供商的支持计划和合同\n\
  - 与业务连续性管理及业务相关的业务影响练习和报告\n- 与业务、可用性管理和信息安全管理相关的风险评估和评审及报告\n- ITSCM 测试计划\n- ITSCM\
  \ 测试场景\n- ITSCM 测试报告和审查\n- 所有部门用于分析、预测和预判特定业务和 IT 场景及其潜在解决方案的预测和预测性报告\n\n### IT\
  \ 服务连续性管理接口\n\nIT 服务连续性应与整个服务生命周期中的所有其他流程建立接口。\n\n重要的示例如下：\n\n- 变更管理，因为所有变更都需要考虑其对连续性计划的影响。计划本身必须处于变更管理的控制之下。\n\
  - 事故和问题管理需要为启动 ITSCM 计划制定达成一致并记录的清晰标准。\n- 可用性管理负责风险评估，实施风险响应应与可用性流程紧密协调，以优化风险缓解。\n\
  - 恢复需求将在服务水平协议中达成一致并记录。在灾难情况下可以接受的不同服务水平可以通过服务水平管理过程来达成一致并记录。\n- 容量管理应确保有足够的资源，以便在灾难后能够恢复到替换系统。\n\
  - 服务资产和配置管理为连续性流程提供了宝贵的工具。配置管理系统记录了构成基础设施的组件以及组件之间的关系。\n- ITSCM 与信息安全管理之间存在非常紧密的关系。重大的安全漏洞可能被视为灾难，因此当服务提供商进行业务影响分析和风险评估时，安全性将是一个非常重要的考量。\n\
  \n#### 流程角色\n\n在第 1 章“运营支持与分析简介”中，我们探讨了适用于整个服务生命周期所有流程的通用角色。这些角色与 ITSCM 流程相关，但也有特定的额外要求。记住，这些不是“职位名称”，而是对于成功运行流程可能需要的角色的指导。\n\
  \n#### IT 服务连续性管理流程所有者\n\nIT 服务连续性管理流程所有者的职责以及通用要求通常包括：\n\n- 与业务合作，协调业务连续性和 IT 服务连续性管理\n\
  - 与所有职能经理合作，确保 IT 服务连续性管理流程被视为该流程及所有连续性问题的单一接触点\n- 确保其他流程引用 ITSCM\n\n#### IT 服务连续性管理流程经理\n\
  \nIT 服务连续性管理流程经理的职责包括通用要求通常包括：\n\n- 协调 IT 服务连续性管理与其他流程之间的接口，特别是服务水平管理、信息安全管理、可用性管理、容量管理和业务连续性管理\n\
  - 对所有现有和新服务执行业务影响分析\n- 实施并维护 IT 服务连续性管理流程\n\n\n\n- 确保所有的 IT 服务连续性管理计划、风险和活动都支持并符合所有业务连续性管理计划、风险和活动，并能够在任何情况下满足既定且在记录的目标。\n\
  - 在成本合理且可行的情况下，进行风险评估和风险管理以防止停机。\n- 开发和维护组织的 IT 连续性策略。\n- 评估潜在的服务连续性问题并在必要时启动服务连续性计划。\n\
  - 管理运行中的服务连续性计划。\n- 对连续性测试和启动进行事后审查，并在时采取纠正措施。\n- 开发和管理 IT 服务连续性管理计划。\n- 确保所有 IT\
  \ 服务领域已做好准备，并能够响应连续计划的启动。\n- 维护一个与业务连续性和业务变更一致的全面 IT 测试计划。\n- 对所有程序进行质量审查，并确保将其纳入测试计划。\n\
  - 传达并保持对 IT 服务连续性管理目标的意识。\n- 对连续性计划进行定期审查（至少每年一次）。\n- 与供应商管理结合，与第三方恢复服务提供商协商并管理合同。\n\
  - 评估变更对服务连续性和连续性计划的影响。\n- 适时参加变更控制委员会（CAB）会议。\n\n## 信息管理\n\nITSCM 需要记录维护全面 ITSCM\
  \ 计划所需的所有信息。该信息库应包含以下项目：\n* 来自最新版本 `BIA` 的信息\n* 风险注册中的全面风险信息，包括风险评估和风险响应\n* 最新版本的\
  \ `BCM` 策略和业务连续性计划\n* 所有已完成测试的细节以及所有计划测试的进度表\n* 所有 ITSCM 计划的细节及其内容\n* 与 ITSCM 计划相关的所有其他计划的细节\n\
  * 所有现有恢复设施、恢复供应商和合作伙伴、恢复协议和合同，以及备用和替代设备的细节\n* 所有备份和恢复过程、进度表、系统、介质及其各自位置的细节\n\n上述所有信息都需要整合并与所有\
  \ `BCM` 信息以及 ITSCM 需要的所有其他信息保持一致。需要与许多其他过程建立接口，以维护这种一致性。\n\n### IT 服务连续性管理关键成功因素和\
  \ KPI\n\n以下列表包含了 ITSCM 的一些示例关键成功因素。\n\n* 关键成功因素：“IT 服务已交付并可以恢复以满足业务目标。”\n    * KPI：增加对\
  \ ITSCM 计划定期审计的成功率，以确保在任何时候都能实现业务既定的恢复要求。\n    * KPI：持续实现对 ITSCM 计划的定期且全面的测试。\n\
  \    * KPI：与业务部门对业务和 IT 连续计划进行定期审查（至少每年一次）。\n    * KPI：减少 IT 服务可能故障的风险和影响。\n* 关键成功因素：“整个组织对业务和\
  \ IT 服务连续计划的意识”\n    * KPI：增加 IT 范围内对业务影响、需求和要求的验证意识。\n    * KPI：增加成功测试结果的数量，确保所有\
  \ IT 服务领域和员工已做好准备，并能够响应 ITSCM 计划的启动。\n\n### IT 服务连续性管理挑战与风险\n\n我们将首先查看该流程面临挑战，然后查看风险。\n\
  \n### 挑战\n\nITSCM 面临的一个主要挑战是在没有 `BCM` 过程的情况下提供适当的计划。如果没有 `BCM` 过程，IT 可能会采用错误的连续性策略和选项，并对业务流程的业务性做出错误的假设。此外，如果缺乏\
  \ `BCM`，业务可能无法识别出廉价的非 IT 解决方案，并将资金浪费在无效且昂贵的 IT 解决方案上。\n\n在某些组织中，人们认为连续性是 IT 的责任，而业务假设\
  \ IT 将负责灾难恢复，并且 IT 服务在任何情况下都能继续运行。\n\n如果建立了 `BCM` 过程，挑战就变成了对齐和集成。随后，挑战变为通过管理以及控制业务和\
  \ IT 变更使 ITSCM 过程与 `BCM` 过程一致。所有文档和计划都应受到变更管理和服务资产与配置管理的严格控制。\n\n### 风险\n\n以下是 ITSCM\
  \ 相关的重大风险：\n* 缺乏业务连续性管理过程\n* 业务缺乏 ITSCM 流程和程序的投入\n* 缺乏关于未来业务计划和策略的适当信息\n* 高层管理对\
  \ ITSCM 过程缺乏承诺或缺乏资源和/预算\n* 流程过度关注技术问题而不够关注 IT 服务以及业务需求和优先事项的风险\n* 如果风险评估和管理是孤立进行的，而不是与可用性管理和信息安全管理相结合，则该流程可能无法实现其目标\n\
  * ITSCM 计划和信息过时，并失去与业务及 `BCM` 信息和计划的一致性\n\n## 理解需求管理\n\n规划和优化中的一个重要过程是需求管理，它是生命周期服务策略阶段中的一个过程。\n\
  \n让我们先回顾一下什么是需求管理。需求管理是寻求理解、预测和影响客户对服务的需求，以及为满足这些需求的容量供应的过程。它是服务管理的一个关键方面。由于需求的不确定性，管理不当的需求是服务提供商的风险来源。过剩的容量产生成本而不创造价值。\n\
  \n### 目的\n\n需求管理的目的是理解、预测和影响客户对服务的需求，并与容量管理协作，确保服务提供商有能力满足这些需求。需求管理贯穿生命周期的每个阶段，确保服务的的设计、测试和交付能够支持在适当的活动水平实现业务成果。\n\
  \n### 目标\n\n\n\n\n\n-   需求管理的另一个目标是与能力管理协作，确保有足够的资源来满足服务需求，从而在服务成本与其所实现的价值之间保持平衡。未使用的资源是额外成本。\n\
  -   需求管理寻求预测并防止或管理服务需求超过交付能力的情况。资源不足将影响业务业务的实现。\n-   该流程旨在调整交付服务的资源利用率，以满足这些服务不断波动的需求水平。\n\
  \n### 范围\n需求管理流程的范围是识别和分析引发服务需求的业务活动模式，并识别和分析不同类型的业务用户如何影响服务需求。\n\n### 价值\n需求管理的主要价值是在服务成本与与其支持的业务结果的价值之间实现平衡。其他服务策略流程定义了业务结果、服务、资源和能力之间的关联（以及所需的投资）。需求管理则精炼了对这些元素如何、何时以及在何种程度上进行相互作用的理解。\n\
  \n### 政策、原则和基本概念\n需求管理是关于供需匹配的。与生产产品的工厂不同（工厂可以持续生产并储存产品以备未来需求增加），当我们提供服务时，需求必须被立即满足，而不是稍后满足。周五下午接听电话较少的叫中心无法在下周一早上开始接听电话！周一早上会很忙，但没有办法利用空闲时间来平衡那个忙碌的早晨。另一种说法是，消费产生需求，而生产以高度同步的模式消耗需求。存在一种真实的风险，即能力不足意味着在需要时无法满足需求。\n\
  \n#### 供需\n需求管理的一个主要是对理解潜在需求以及需求对服务资产的影响。这使得能力管理能够引导服务资产（及投资）走向最佳性能和成本。其目标是调整生产能力以满足需求预测和模式。某些类型的能力可以根据需要快速增加，并在未使用时释放。向客户提供价格激励以便在空闲时段使用服务，意味着可以在某种程度上影响需求的到来。然而，我们无法在需求实际发生之前储备服务输出。这种先产生需求再进行供应的需求循环只有在有可用能力时才能发挥作用；一旦能力不再可用，服务提供商将无法提供足够的服务来满足客户需求。\n\
  \n这种高度同步的供需模式可以在图 9.2 中看到。每当用户消费服务时，需求就会呈现给服务提供者，这会消耗服务资产的能力。这反过来导致提供服务以满足消费者的需求。服务的消耗越高，需求就越高，能力的消耗就越高，提供的服务也越多。\n\
  \n![图像显示了服务带，带有业务和服务流程（像滚筒一样），需求模式和交付计划沿着带带移动。服务带周围有能力、需求管理计划、激励和惩罚以及业务活动。](img/00046.jpeg)\n\
  \n图 9.2 需求、能力和供应之间的紧耦合\n\nCopyright © AXELOS Limited 2010\\. 保留所有权利。材料根据 AXELOS\
  \ 的许可复制。\n\n#### 调整服务资产\n供需平衡通过调整服务资产以满足服务的动态需求模式来实现。这意味着服务提供者不仅是对需求做出反应，而是主动预测需求，识别需求增加或减少的信号，并定义一种机制，以根据需要缩放投资和供应。\n\
  \n这涉及使用服务组合管理来识别服务，并量化业务活动模式。接下来，选择处理此类类型和数量需求的适当架构，能力和可用性规划流程确保在正确的时间有正确的服务资产，并使其在正确的水平运行。根据需要进行性能管理和调优以应对需求的变化。此类服务资产调整需要来自整个服务生命周期的输入：\n\
  \n**服务策略** 识别服务、结果和业务活动模式，并将预测需求传给设计团队。\n\n**服务设计** 服务设计确认可用性和能力需求，并验证服务资产的设计能够满足这些需求。\n\
  \n**服务过渡** 服务过渡确保新服务或更改的服务针对预测的利用率和业务活动模式进行测试和验证。还应该进行测试以检查影响和管理需求的能力。\n\n**服务运营**\
  \ 服务运营功能应监控服务资产和服务利用率水平，以确保需求在正常水平，如果不是，则启动性能调优或纠正措施。\n\n**持续服务改进** 持续服务改进将与需求管理协作，识别业务活动模式的趋势，并在适当的情况下启动服务提供能力的变更或客户行为的改变。\n\
  \n## 流程活动、方法和技术\n需求管理活动包括与能力管理一起，识别并实施影响和管理需求的措施。这可能发生在服务需求超过能力且无法增加能力的情况下。可以使用反向激励措施（如在高峰时段收取更高费用和实施惩罚）将需求减少到可交付的范围内。当能力超过需求时（可能对于新服务），可以使用低离峰费率等激励措施。\n\
  \n如果能够平滑需求的波峰和波谷，提供服务的成本将得到优化，因为始终可以交付所需内容，而不会产生过能力的浪费。\n\n#### 识别需求预测来源\n需求管理基于对业务活动以及这些活动如何影响服务需求的良好理解。因此，需求管理必须识别任何可以提供对这些活动洞察并协助预测需求水平的文档、报告或信息。这些来源将用于定义、监控和精炼下节中描述的需求管理的其他组件。\n\
  \n以下潜在信息源可以帮助需求管理预测需求：\n- 业务计划\n- 营销计划和预测\n- 新产品发布计划\n- 销售预测\n\n#### 业务活动模式\n\n\n\
  \n\n服务旨在支持业务活动，而活动进而实现业务成果。因此，每当执行一项业务活动时，它都会产生对服务的需求。客户资产（如人员、流程和应用程序）都会执行业务活动，由于这些资产的组织方式或由于它们正在完成的任务，在活动执行方式上往往会呈现出明显的模式。这些业务活动模式（PBAs）代表了业务的动态特性，并包括与客户、供应商、合作伙伴和其他利益相关者的交互。\n\
  \n必须对 PBA 进行恰当的理解、定义和记录，并对它们的任何更改进行妥善控制。每个 PBA 都需要有一个记录在案的 PBA 概要，其中包含以下详细信息：\n\n\
  *   **分类**：PBAs 按类型分类，类型可能指其来源（用户或自动化）、所支持的成果类型和影响，以及所支持的工作负载类型。\n*   **属性**：这些可能包括频率、量、地点和持续时间。\n\
  *   **需求**：这些可能是性能、安全性、可用性、隐私、延迟或对延迟的容忍度。\n*   **服务资产需求**：设计团队将根据每个 PBA 起草一份利用概要，说明它使用了哪些资源、何时使用这些资源以及使用了多少每种资源。如果资源数量和利用模式是已知的，只要在预测范围内，容量管理流程就能确保资源可用以满足需求。\n\
  \n图 9.3 显示了业务活动模式的若干不同示例。请花时间查看它们。\n\n![图表通过柱状图和折线图显示了业务活动模式，按时间（小时、天和月份）与相应公司的报纸销售量、工时交易和卡片销售量进行对比。](img/00047.jpeg)\n\
  \n图 9.3 业务活动模式示例\n\nCopyright © AXELOS Limited 2010\\. 保留所有权利。材料根据 AXELOS 的许可复制。\n\
  \n示例 A 显示了美国一家问候卡公司的销售模式。卡片销售模式随主要节假日或活动而变化；这将导致不同程度的 IT 服务利用。IT 服务提供商必须在每个重大节假日之前预判业务活动，以便公司能够及时准备和发货问候卡。此外，在线订单系统在节日前的两周内会有高需求。这种高需求并非典型，因此服务提供商可能需要投资空闲容量（这些容量在一年其他时间将闲置），或者他们需要能够在多个资源之间平衡工作负载。通过这种方式，处理低优先的服务将为高优先的季节性活动量留出空间。\n\
  \n在示例 B 中，一家咨询公司依赖工时服务来对顾问的时间计费。由于大多数顾问在周末前完成整周的工单，因此该服务更具关键性，并在周末期间的利用率更高。可能需要鼓励顾问在每天结束时或第二天开始时记录时间。\n\
  \n示例 C 显示了记者如何使用文字处理和编辑服务。从每天清晨的宁静开始，随着截止日的临近，服务变得越来越忙碌。这种行为与新闻业的性质一致，因此试图改变它不太可能成功。在这些情况下，必须采取措施确保资源可用以匹配\
  \ PBA。\n\n用户概要（UPs）基于组织内部的角色和职责，并可能包括业务流程和应用程序。许多流程是自动化的，可以独立消耗服务。流程和应用程序可以拥有用户概要。每个\
  \ UP 可以与一个或多个 PBAs 关联。\n\n### 基于活动的需求管理\n\n业务流程是服务需求的主要来源。PBAs 影响服务提供商所看到的需求模式。研究客户业务以识别、分析和分类此类模式至关重要，以便为容量管理提供充分依据。服务提供商必须从支持服务的角度将客户的业务活动和计划视觉化，如图\
  \ 9.4 所示。分析和跟踪业务流程的活动模式，可以预测支持该流程的目录中服务的需求模式。同样也可以预测支持这些服务的底层服务资产的需求。\n\n![流程图显示了业务活动模式的流向，方向业务计划、业务流程、员工人数和使用中的流程（需求）、服务请求和事件（需求）、服务台，以及容量计划。](img/00048.jpeg)\n\
  \n图 9.4 业务活动影响服务的需求模式。\n\nCopyright © AXELOS Limited 2010\\. 保留所有权利。材料根据 AXELOS\
  \ 的许可复制。\n\n分析 PBA 的一些优势体现在服务管理流程的输入中：\n\n*   服务设计可以优化设计以适应需求模式。\n*   容量管理将 PBA\
  \ 转换为工作负载概要，以便提供适当的资源。\n*   服务目录可以将需求模式映射到适当的服务上。\n*   服务组合管理可以批准对额外容量、新服务或服务变更的投资。\n\
  *   服务运营可以调整资源的分配和调度。\n*   服务运营可以通过对匹配的需求模式进行分组，发现合并需求的机会。\n*   IT 服务财务管理可以批准适当的激励来影响需求。\n\
  \n### 开发差异化产品\n\nPBAs 可能表明，在不同的时间或通过不同的效用组合，需要不同水平的性能。在这些情况下，需求管理和服务组合管理可以协作定义满足\
  \ PBA 变化的服务包。\n\n服务运营期间需求管理的活动之一是管理或影响服务或资源被过度利用的需求。通常会发生在以下情况：\n\n*   不准确的业务活动模式\n\
  *   业务环境的变化\n*   不准确的资源预测\n\n可能没有额外的预算增加资源。需求管理可以通过差异化收费或其他手段提供帮助。需要注意的是，需求管理采取的任何行动都将与其他流程（如财务管理、业务关系管理、容量管理和服务服务水平管理）结合进行。\n\
  \n### 触发因素\n\n需求管理的触发因素如下：\n\n*   客户对新服务或现有服务变更的请求。这将通过业务关系管理、服务组合管理和变更管理启动。\n*\
  \   为了满足战略计划而创建新服务是另一个触发因素。这将通过服务组合管理启动。\n*   定义新服务模型并记录其业务活动模式和/或用户概要的需求。\n*  \
  \ 如果利用率导致潜在的性能问题或可能违反 SLA，也会调用需求管理。\n*   业务活动模式预测出现异常。\n\n### 输入\n\n\n\n\n\n需求管理具有以下输入：\n\
  \n*   创建新服务或更改现有服务的动因。这些输入可能来自服务组合管理，也可能来自变更管理。\n\n*   服务模型需要经过验证，并且需要定义与每个服务模型相关的业务活动模式。客户组合、服务组合和客户协议组合（所有这些都包含服务供应和需求的信息）也是需求管理的输入。\n\
  \n*   将对收费模型进行评估，以确保内部服务提供者不会出现回收不足或过度的情况，或确保外部服务提供者的定价具有盈利性。需要对可收费项目进行验证，以确保客户能够感知并按照定义的方式使用它们。\n\
  \n*   需要评估服务改进机会和计划对需求的影响。\n\n### 输出\n\n需求管理的输出包括用户画像和记录在案业务活动模式，这些将包含在服务组合和客户组合中。其他输出是当资源过度使用时的需求管理策略，以及处理服务利用率高于或低于客户预期情况的策略。最后，需求管理将约定并记录差异化提供的各种方案，这些方案可用于创建服务包。\n\
  \n### 接口\n\n需求管理的主要接口如下：\n\n*   IT 服务策略管理将识别关键业务结果和业务活动，这些用于建立业务活动模式和用户画像。\n\n*\
  \   服务组合管理使用需求管理的信息来创建和评估服务模型，建立和预测利用需求，并识别服务的不同类型用户。此外，它还将根据业务活动模式和用户画像的信息开发服务包。\n\
  \n*   IT 服务财务管理预测提供满足需求所需容量的成本，并帮助识别在过度利用时调节需求的收费措施。\n\n*   业务关系管理是关于客户业务活动信息的主要来源。在客户组合和组合组合确认这些之前，业务关系管理对于验证用户画像和差异化服务提供也很有帮助。\n\
  \n*   服务水平管理将帮助正式化协议，在协议中客户承诺利用水平，服务提供者承诺性能水平。将在定期的服务水平评审会议（使用来自需求管理和容量管理的信息）上审查实际性能和利用水平，并记录任何偏差。需求管理将与服务水平管理协作，定义处理供需偏差的策略。\n\
  \n*   容量管理与需求管理紧密合作，定义如何在服务的的设计和运行中匹配供需，并理解利用趋势以及如何根据未来需求对服务进行调整。\n\n*   可用性管理通过分析业务活动模式，识别可用性最重要的时刻。\n\
  \n*   IT 服务连续性管理使用需求管理的信息来分析业务影响并确定恢复方案。\n\n*   变更管理与需求管理、容量管理合作，评估变更对业务使用服务的影响。\n\
  \n*   服务资产和配置管理识别对服务的需求与对系统和设备需求之间的关系。\n\n*   服务验证和测试确保服务能够处理需求模式，并验证防止过度利用措施的有效性。\n\
  \n*   最后，事件管理提供有关实际服务利用模式与该服务预期业务活动模式对比的信息。\n\n## 流程角色\n\n在第 1 章中，我们探讨了适用于服务生命周期的通用角色。这些与需求管理相关，但也存在特定的要求。\n\
  \n### 需求管理流程所有者\n\n需求管理流程所有者的职责除通用要求外，通常包括：\n\n*   与其他流程所有者合作，确保设计和实施有集成方法。\n\n\
  ### 需求管理流程经理\n\n需求管理流程经理的职责除通用要求外，通常包括：\n\n*   识别并分析业务活动模式\n*   定义用户画像\n*   帮助设计服务以满足业务活动模式和实现业务结果的能力\n\
  *   确保在适当水平上有足够的资源来满足需求\n*   预测并防止服务需求超过交付容量的情况\n*   调整资源利用率以满足波动的需求\n\n## 信息管理\n\
  \n有效的需求管理将使用多种不同的信息源。这些包括（但不限于）：\n\n*   服务组合，提供流水线、目录和退役服务的视图\n*   客户组合，显示客户详细信息以及他们可能代表的机会\n\
  *   项目组合，确保项目将需求管理作为其考量的一部分\n*   业务关系管理的输出，例如客户会议的纪要\n*   服务水平协议，以确保设置了适当的目标，并为未来的协议定义限制\n\
  *   配置管理系统，提供有关服务资产、客户资产的使用、配置以及业务结果的信息\n\n## 关键成功因素和关键绩效指标\n\n你可能记得之前的讨论中关于关键成功因素和关键绩效指标（KPI）的定义。以下是需求管理的示例：\n\
  \n*   关键成功因素：“服务提供者已识别并分析了业务活动模式，并能够利用它们来理解对服务的需求水平。”\n    *   KPI：为每个相关服务定义了业务活动模式。\n\
  \    *   KPI：容量管理已将业务活动模式转换为工作负载信息。\n\n*   关键成功因素：“存在一种手段来管理服务需求超过交付容量的情况。”\n  \
  \  *   KPI：需求管理技术已记录在容量计划中，并在适当的情况下记录在服务水平协议中。\n    *   KPI：差异收费（作为此类技术的一个示例）导致随着时间的推移服务的需求更加均衡。\n\
  \n### 挑战\n\n需求管理面临以下挑战：\n\n*   如果需求管理未包含在需求集中，有关业务活动的信息可能难以获取。\n\n*   客户可能苦于拆解对服务提供者有意义的单个活动。业务关系管理应该能够提供帮助。\n\
  \n\n\n\n\n* 缺乏正式的服务组合管理流程或服务组合将阻碍对业务需求、相对价值和业务优先级的理解。这可能意味着需求管理信息仅以随机的方式记录。\n\n\
  ### 风险\n\n需求管理的风险如下：\n\n*   缺乏配置管理信息或信息不准确，使得难以评估需求变化对服务提供者基础设施和应用程序的影响。\n*   服务水平管理可能无法从业务部门获得关于最小或最大利用率的承诺。如果没有这些关于利用率的承诺，需求管理很难承诺服务水平。结果是为了使服务提供者能够领先于需求，了比实际需要更高的水平的投资，即使该服务并非必不可少。\n\
  \n## 总结\n\n本章探讨了两个流程：IT 服务连续性管理和需求管理。除了范围之外，还涵盖了每个流程的目的和目标。\n\n我们看了这些流程的价值。然后，我们审查了每个流程的策略以及活动、方法和技术。\n\
  \n最后，我们审查了每个流程的触发因素、输入、输出、接口以及与之相关的信息管理。我们还考虑了流程的关键成功因素、关键绩效指标，以及流程面临的挑战和风险。\n\n\
  我们研究了这些流程是如何相互支持的，以及这些流程对业务和 IT 服务提供者的重要性。\n\n通过需求管理，服务提供者能够预测并影响客户对服务的需求。需求管理技术可以调节过度的需求，或在容量过剩时刺激需求。需求管理努力确保需求不超过交付能力，并确保没有昂贵的闲置容量。\n\
  \n## 考试要点\n\n**理解 IT 服务连续性管理和需求管理的目的和目标。** 对你来说，能够解释 IT 服务连续性管理和需求管理流程的目的和目标很重要。\n\
  \nIT 服务连续性管理应确保交付所需的业务连续性计划以满足业务需求。\n\n**了解需求管理的服务策略流程。** 从管理角度来看，了解需求管理的目的、目标、范围、原则和活动。\n\
  \n**理解与其他流程的接口。** 你需要描述需求管理流程如何与服务生命周其余部分以及其他生命周期阶段的流程对接。\n\n**理解每个流程的业务价值、挑战和风险。**\
  \ 你应该能够解释业务从 IT 服务连续性管理和需求管理中获得的价值，以及运行这些流程所涉及的挑战和风险。\n\n**理解需求管理的关键活动。** 确保你理解需求管理如何预测需求水平，并与容量管理和其他流程协作以满足这些需求。\n\
  \n**解释并区分 IT 服务连续性管理的不同阶段。** 启动是流程的开始，是接收来自业务连续性管理的触发因素。需求和策略是建立对业务需求和策略的清晰的阶段。实施是实现策略决策的阶段。运行是将连续性计划作为服务持续运行的一部分进行管理的阶段。\n\
  \n**理解流程的关键成功因素和关键绩效指标。** 对流程进行衡量是理解其成功的重要部分。你应该熟悉用于 IT 服务连续性管理和需求管理的 `CSFs` 和 `KPIs`。\n\
  \n## 复习题\n\n你可以在附录中找到复习题的答案。\n\n1. 以下哪些是 IT 服务连续性管理的职责？\n    1. 确保在灾难发生时 IT 服务能够继续\n\
  \    2. 进行风险评估\n    3. 确保业务在发生灾难时有应急预案\n    4. 确保所有 IT 人员在灾难发生时知道自己的角色\n       \
  \ 1. 2, 3 和 4\n        2. 1, 2, 和 4\n        3. 仅 1 和 2\n        4. 以上所有\n\n2. IT\
  \ 服务连续性管理与业务共同执行 `BIA`。`BIA` 代表什么？\n    1. 业务完整性评估\n    2. 业务信息替代方案\n    3. 效益整合评估\n\
  \    4. 业务影响分析\n\n3. 关于 IT 服务连续性管理 (`ITSCM`) 的以下哪个陈述是正确的？\n    1. `ITSCM` 定义了发生重大中断时可以提供的服务。业务随后计划如何使用该服务。\n\
  \    2. `ITSCM` 和业务连续性管理 (`BCM`) 之间互不影响。\n    3. `BCM` 定义了在发生重大中断时所需的 IT 服务水平。`ITSCM`\
  \ 负责交付这一水平的服务。\n    4. 交付一个适用于所有情况的单一连续计划是 `ITSCM` 的职责。\n\n4. 以下哪些是与 IT 服务连续性管理相关的\
  \ `KPIs`？\n    1. `KPI`: 实现了对 `ITSCM` 计划的定期且全面的测试\n    2. `KPI`: 与业务部门至少每年进行一次业务和\
  \ IT 连续计划的审查\n    3. `KPI`: 总体减少 IT 服务可能故障的风险和影响\n    4. `KPI`: 导致重大事件的事件数量\n  \
  \      1. 1, 3, 4\n        2. 2, 3, 4\n        3. 1, 2, 3\n        4. 1, 2, 4\n\n\
  5. 测试在 IT 服务连续性生命周期的哪些阶段进行？\n    1. 启动和运行\n    2. 启动和实施\n    3. 实施和运行\n    4. 需求和策略以及运行\n\
  \n6. 业务活动模式用于跟踪什么？\n    1. 用户对单个 IT 服务的使用情况\n    2. 部门对单个 IT 服务的使用情况\n    3. 实现业务结果的业务活动\n\
  \    4. 服务对业务的价值\n\n7. 需求管理是关于什么与需求匹配？\n    1. 服务\n    2. 供应\n    3. 策略\n    4.\
  \ 服务水平协议\n\n8. 需求管理应该使用哪些信息源？\n    1. 业务计划\n    2. 营销计划和预测\n    3. 生产计划（在制造环境中）\n\
  \    4. 销售预测\n    5. 新产品发布计划\n        1. 1, 2, 3, 4, 5\n        2. 1, 3, 5\n   \
  \     3. 2, 4\n        4. 1, 2, 3, 4\n\n9. 用户画像 (`UPs`) 是基于什么？\n    1. 组织内的角色和职责\n\
  \    2. 组织内的流程\n    3. 服务水平协议\n    4. 运营级别协议\n\n10. 以下哪个陈述是错误的？\n    1. 从战略角度来看，需求管理是关于将供应与需求匹配。\n\
  \    2. 需求管理可能使用差异化收费来试图影响服务或资源被过度利用的需求。\n    3. 与商品不同，服务无法提前制造并以成品库存的形式储在库存中以应对需求。\n\
  \    4. 消耗消耗需求，生产以高度同步的模式产生需求。\n\n# 第 10 章\n\n规划、保护和优化的技术与实施考虑因素\n\n**本章讨论了以下 ITIL\
  \ 中级考试目标：**\n\n\n\n\n\n* ![images](img/00005.jpeg) 技术辅助服务设计的通用需求\n* ![images](img/00005.jpeg)\
  \ 用于流程实施的技术和工具的评估标准\n* ![images](img/00005.jpeg) 实践和过程实施的良好实践\n* ![images](img/00005.jpeg)\
  \ 与实施实践和过程相关的挑战、关键成功因素和风险\n* ![images](img/00005.jpeg) 如何规划和实施服务管理技术\n* ![images](img/00005.jpeg)\
  \ 在支持规划、保护和优化实践过程中实施技术的考虑因素，特别是技术架构的设计\n\n![images/00006.jpeg) 本章汇总了所有技术和实施需求，旨在定义集成服务管理技术工具的整体需求，以支持规划、保护和优化的流程。相同的技术（带有一些可能的补充）应适用于\
  \ IT 服务管理（ITSM）的各个生命周期阶段——服务策略、服务设计、服务过渡、服务运营和持续服务改进——以保持一致性并允许有效的 ITSM 生命周期得到妥善管理。\n\
  \n工具可以帮助服务管理流程运行得更高效。它们应该允许快速一致地执行大量的重复性工作。工具还提供了丰富的管理信息，有助于识别弱点和改进机会。\n\n工具的使用将有助于规范实践，并实现流程的集中化和集成。\n\
  \n我们将考虑此类工具的通用需求。重要的一点是，所使用的工具应该支持流程，而不是相反。\n\n## 技术的通用需求与评估标准\n\n我们将首先考虑支持服务设计的通用通用需求，对于\
  \ IT 服务管理而言，这意味着 IT 服务管理工具。在本节中，我们将查看其中的许多需求，我们预计任何良好的集成工具集都应该提供这些需求。\n\n前两个需求是自助服务功能和工作流引擎。\n\
  \n你可能还从发布履行流程的讨论中回想起，我们探讨了通过自助功能处理请求或简单事件的选项。这可能仅限于请求和事件的记录，也可能允许在整个生命周期内对其进行跟踪和更新。提供自助设施的优势在于，可以在任何时间记录请求和事件，而且该过程不依赖于服务台人员在线接听电话。这有助于服务台处理大量的来电，因为那些不紧急的电话可以通过自助、自助记录站点来处理。自助请求工具可以协助重置密码，例如，要求用户在重置发生前通过回答设置的问题来验证其身份。此外，自助请求工具还可以下载已批准的请求软件版本。\n\
  \n下一个通用需求是工作流或流程引擎，它可以自动执行流程步骤（分配、升级等）。它还可以在先决步骤完成时发布订单（工作单）。\n\n下一个通用需求是一个集成的配置管理系统（`CMS`）。\n\
  \n服务管理工具应与 `CMS` 集成，以便查询组织的配置项（`CI`）信息，并根据情况将其链接到事件、问题、已知错误和变更记录。\n\n另一个通用需求是发现、部署和许可技术工具；这些工具对于验证\
  \ `CMS` 的准确性（特别是关于许可证的使用）非常有帮助。如果能够仅提取并报告自上次审计以来的更改，也将非常有帮助。相同的技术通常可以用于向目标位置部署新软件。这对于将补丁、升级等分发给正确的用户至关重要。\n\
  \n当与上述自助功能结合实施时，服务管理工具将促进许多软件请求履行的自动化。\n\n另一个通用需求是远程控制。这允许服务台分析师（在受控的安全条件下）接管用户的桌面，以执行诸如调查和纠正设置等操作。\n\
  \n某些工具将存储诊断脚本和其他诊断程序，以协助对事件进行早期诊断。\n\n良好的报告是任何 ITSM 工具集的要求。工具持有有关日常发生情况的海量信息。这些数据对于提前规划和跟踪趋势很有帮助，但此类报告必须有用，必须具有灵活性。标准报告和临时报告都应该是易于获取的。\n\
  \n另一个需要考虑的通用需求是仪表板功能。仪表板对于日常运营以及 IT 和业务管理清晰了解实时性能非常有用。\n\n为了促进更强的业务对齐，业务应用程序和工具需要能够与\
  \ ITSM 支持工具接口以提供所需的功能。集成的一个示例包括事件管理工具识别信用卡上的异常消费模式。\n\n软件即服务（`SaaS`）技术提供了通过互联网进行托管服务管理的能力。这带来的优势包括较低的资本和启动成本、更快的实施以及内置的服务连续性。\n\
  \n然而，这也意味着定制化和功能更改有限，访问受限于供应商的服务可用时间，并且许可方案可能变得具有限制性或昂贵。数据存储大小也可能存在限制，并可能存在安全和访问管理的约束或风险。最后，与其他服务管理工具的集成可能是困难甚至无法实现的。\n\
  \n每个组织都应仔细审查其需求，以便获取最符合其需求的工具集。\n\n## 实践和过程实施的良好实践\n\n在后续章节中，我们将考虑实施良好实践和过程的基础。我们需要考虑与规划、保护和优化过程相关的需求，以及实施服务设计的方法。这应该包括\n\
  \n* 我们从哪里开始？\n* 我们如何改进？\n* 我们如何知道我们正在取得进展？\n\n在查看任何服务管理流程（包括服务设计）的实施时，需要考虑的重要因素是客户和业务的需求和渴望。活动应按以下项进行优先级排序：\n\
  \n* 业务需求和业务影响\n* 对服务和过程的风险\n\n活动还将受到服务水平协议中约定的服务水平要求和协议的影响。\n\n### 业务影响分析\n\n\n\n\
  \n\n理解业务需求、影响和风险的关键输入之一是业务影响分析（BIA）的输出。BIA 用于许多服务设计过程，特别是在 IT 服务连续性管理（参见第 9 章“IT\
  \ 服务连续性管理与需求管理”）中，在该过程中对于帮助定义风险降低和灾难恢复策略至关重要。BIA 通常用于识别灾难对业务的影响，包括对单个部门和整个业务的影响。它被用于识别任何特定业务流程或活动的关键性，还用于识别这些活动产生尤为影响的时间。BIA\
  \ 也用于其他过程——例如，可用性管理、容量管理和信息安全管理。\n\nBIA 有两个领域。一个是业务管理，用于理解损失对业务流程或功能的影响；另一个是从服务中断的角度来理解\
  \ BIA。这两者都应该应用，以便在实施新服务时识别关键服务，并确定哪些情况构成了服务中的重大事件。BIA 还有助于定义服务中断的可接受水平和持续时间，包括需要避免的重要时期。BIA\
  \ 还可以帮助理解财务损失和任何安全问题。\n\n### 服务水平需求\n\n作为服务水平管理过程的一部分（参见第 18 章“服务水平管理与供应商管理”），将识别所有服务的服务水平需求，并在服务水平协议中评估并达成满足需求的能力。这需要成为服务设计方法的一部分，并且规划、保护和优化中的所有过程都必须作为需求捕获的一部分被考虑。\n\
  \n### 对服务和流程的风险\n\n确保日常业务流程不受规划、保护和优化过程实施的负面影响至关重要。这一因素需要作为设计期间风险评估的一部分，并将在过渡生命周期阶段进行更充分的探讨。风险评估和管理是规划、保护和优化过程的关键部分——例如，可用性管理和\
  \ IT 服务连续性管理。在服务设计期间创建的任何解决方案必须考虑风险。\n\n### 实施服务设计\n\n用于 IT 服务设计的流程、策略和架构需要记录并利用，以确保为业务提供适当的服务。\n\
  \n最佳实践建议服务设计应遵循持续服务改进方法，并基于业务需求进行设计：\n\n* 我们从哪里开始？\n* 我们如何改进——CSI 方法：\n    * 愿景是什么？\n\
  \    * 我们现在处于哪里？\n    * 我们想去什么哪里？\n    * 我们如何到达那里？\n    * 我们到了那里吗？\n    * 我们如何保持这种势头？\n\
  \n#### 挑战、关键成功因素和风险\n\n当我们考虑实施良好实践与规划、保护和优化过程之间的关系时，意识到与实施相关的挑战、关键成功因素（CSFs）和风险至关重要。\n\
  \n### 挑战\n\n挑战将采取许多不同的形式，取决于所支持的组织性质，但有一些共同因素可能在某些方面适用于所有组织。这些包括：\n\n* 理解业务需求和优先级\n\
  * 理解组织文化\n* 与业务部门和服务管理人员进行有效沟通\n* 与所有利益相关者的协作与参与\n* 获得管理层和员工的承诺\n* 供应商管理和合同义务\n\
  * 成本和预算限制\n\n这些是大多数组织的共性问题，解决这些挑战对于服务管理流程（包括规划、保护和优化流程）的成功实施关重要。\n\n#### 关键成功因素\n\
  \n如你所知，`critical success factor`（关键成功因素）是一个用于组织或项目实现其使命的要素要素。它们可以用于识别成功的重要要素。CSFs\
  \ 通过关键性能指标（KPIs）衡量，并应作为服务设计生命周期阶段的一部分设定和衡量。PPO 过程对于建立服务需求是关键的，理解每个过程的 CSFs 将为用于服务生命周期阶段证明成功的\
  \ KPI 提供坚实的基础。\n\n### 风险\n\n与挑战一样，一些常见风险适用于大多数组织。需要对其进行适当识别和解决，以确保服务管理的成功实施。一些示例包括：\n\
  \n* 满足识别出的 CSFs\n* 流程的成熟度\n* 不明确的业务需求\n* 服务管理设计、过渡和运行的不切实际的业务时间\n* 测试不足\n* 在创新或稳定性之间的关注点缺乏平衡\n\
  * 业务、IT 和供应商之间缺乏协调\n* 资源不足，包括成本和预算\n* 缺乏跨整个服务管理生命周期的整体方法\n\n## 服务管理工具选择\n\n有许多服务管理工具可用，每种都有其自身的优缺点，这使得选择正确的工具变得困难。为了克服这个问题，你应该定义一些客观的选取标准。\n\
  \n一种简单的方法是 MoSCoW 分析。这涉及创建所有所有需求的详细列表，并将每项分类为必须有（must have）、应该有（should have）、可以（could\
  \ have）或未来想要（would like in the future）。\n\n* `Must have` 需求是强制性的。任何不能满足 `all` 这些要求的工具都被拒绝。\n\
  * `Should have` 需求是我们期望的但并非必不可少的。\n* `Could have` 需求是有用的但并非极其重要。\n* `Would like\
  \ in the future` 需求是我们那些现在不需要但未来会需要的。例如，我们现在正在选择一个事件管理工具，但我们以后希望它具有问题管理能力。\n\n然后你可以根据此分析制定一套评分系统，这将让你能够对替代方案进行排序。你可以对决策进行加权，建立评分系统以确保你获得了符合要求的服务管理工具。\n\
  \n## 规划和实施服务管理技术\n\n本章的最后一个主题是服务管理工具。良好的服务管理工具对于基于 ITIL 框架实施流程非常有帮助。许多组织实施新工具来协助其新或改进流程的实施。如果新工具要有用且适当，这些组织需要考虑许多因素。\n\
  \n### 许可证\n\n要考虑的第一个因素是许可证类型。通常有几种不同成本的选项。当工具按模块授权时，需要仔细的规划，以确保获得正确的访问权限，以便人员开展工作，而不购买不必要的模块。以下是一些可能的选项：\n\
  \n`Dedicated Licenses`：对于此选项，每个命名人员都有自己的许可证。专用许可证适用于需要频繁且长时间使用特定模块的员工。例如，服务台台人员需要专用许可证来使用事件管理模块。\n\
  \n\n\n\n\n### 共享许可证 (Shared Licenses)\n这些许可证可以在个人之间共享；但是，可能某些员工由于许可证已被占用而无法访问工具。共享许可证适用于不需要持续访问的普通用户，例如二线支持人员。需要仔细计算以确定用户与许可证之间的正确比例。这些许可证比专用许可证昂贵，但需要的数量较少。\n\
  \n### Web 许可证 (Web Licenses)\n这些许可证允许通过网络浏览器访问。Web 许可证通常适用于需要远程访问或仅偶尔访问的人员。它们的费用通常低于其他许可证（与其他许可证一起购买时甚至可能是免费的）。通过购买少量此类许可证，就可以为大量临时用户提供足够的访问权限，因为并发用户数量（因此所需的许可证数量）较低。通过这种方式，可以进一步降低整体成本。\n\
  \n### 按需 (On Demand)\n在需要时（按需）提供工具访问，供应商根据使用应用程序的时间收费。这对于小型组织，或者工具非常专业且使用频率较低的情况来说，可能很有吸引力。另一种变体是作为咨询任务的一部分使用专业工具（例如，专业的容量管理工具）；在这些情况下，许可证费用可能包含在咨询费中。\n\
  \n### 代理/活动 (Agent/Activity)\n许可证选项的进一步变体是基于代理/活动进行许可和收费的软件。这方面的例子是模拟软件（例如，可以模拟客户在网站上的路径的代理软件，以评估并报告性能和可用性）。\n\
  \n在所有情况下，都必须进行充分的调查，以确保理解并同意成本，并确保组织在拥有足够许可证方面符合法律规定。\n\n### 部署 (Deployment)\n许多\
  \ ITSM 工具（特别是发现和事件监控工具）在使用之前，可能需要向所有目标位置部署一些客户端/代理软件。这需要仔细的计划和执行，并应通过正式发布和部署管理来处理。这里列出了一些部署考虑因素：\n\
  \n* 应该进行仔细的调度和测试，并且必须对部署进行跟踪，以便明确哪些 CI（配置项）已安装软件，哪些尚待接收。\n* 随着部署的进行，应更新 `CMS`。\n\
  * 通常需要重启设备以识别客户端软件，这需要提前安排，以最大限度地减少服务中断。\n* 对于便携设备可能需要特殊安排，因为这些设备在部署期间可能不在现场。\n\
  * 必须提前检查接收软件的设备，确保它们有足够的存储和处理能力来托管和运行新软件。\n* 需要检查网络容量，以确保其能够传输所有所需内容。\n* 部署工具的最佳时间取决于成熟度。过早部署的工具会将改进计划的重点从改变流程和工作方式的需求转移开，使得整个改进活动仅仅变成工具的实施。\n\
  * 如果要实现收益，部署前对工具进行培训是必要的。\n\n记住，一个工具通常不足以让事情变得更好。然而，如果它支持流程并且用户接受过培训，良好的工具可以帮助员工执行新流程。\n\
  \n以下是必须考虑部署的其他方面：\n\n#### 使用的引入类型 (The Type of Introduction to Be Used)\n必须决定采用“大爆炸式”引入还是某种分阶段的方法。由于大多数组织在引入期间需要保持服务运行，因此分阶段的方法更有可能是必要的。\n\
  \n#### 工具之间的过渡 (Transition between Tools)\n如果正在替换旧工具，必须考虑旧工具和新工具之间过渡的最佳方式。例如，服务台不应向尚未从旧工具过渡的团队在旧工具上分派事件。\n\
  \n#### 数据迁移 (Data Migration)\n需要决定哪些数据需要从旧工具迁移到新工具。这可能需要重新格式化，因此在迁移后可能也需要验证，特别是当数据通过电子传输时。相反，可以实施并行运行，在初始阶段旧工具以只读模式与新工具一同运行，以便在需要时参考历史数据。\n\
  \n关于发布和部署管理过程的完整细节可以在 ITIL 服务过渡（Service Transition）书中找到。\n\n### 设计技术架构 (Designing\
  \ Technology Architectures)\nIT 组织提供能够支持交付高质量 IT 服务的基础至关重要，这需要正确的技术和技术架构方法。`Architecture`\
  \ 是在许多不同背景下使用的术语。在此语境下，它可以描述为系统的基本组织，体现为其组件、组件之间以及与环境的关系，以及引导其设计和演变的原则。`System`\
  \ 在最通用的（不限于 IT）意义上使用，指的是为了实现特定功能或一组功能而组织的组件集合。\n\n架构设计工作必须评估并协调许多类型的需求，其中某些需求可能相互冲突。该工作应确保：\n\
  \n* IT 基础设施、环境、数据、应用程序和外部服务满足业务需求，不仅是在技术方面，还包括技术管理方面\n* 达到创新、风险和成本之间的正确平衡\n* 实现对标准、策略、政策、法规和框架的合从\n\
  * IT 规划者/设计师与业务规划者/设计师之间存在协调\n\n设计、计划、架构和策略应涵盖 IT 的所有方面，包括角色和职责、服务、技术、架构和框架、流程和程序、合作伙伴和供应商以及管理方法。架构设计工作还涵盖技术的所有领域，包括基础设施、环境、应用程序和数据，并且它应该与整体业务规划和设计过程紧密结合。\n\
  \n完整的企业架构可能是庞大且复杂的。Gartner 对企业架构的定义是：\n\n> 通过创建、沟通和改进关键需求、原则和模型，将业务愿景和战略转化为有效的企业变革的过程。这些模型描述了企业的未来状态并使其能够向该状态演进。\n\
  \n有许多用于开发企业架构的专有和非专有框架，如表 10.1 所示。\n\n| 框架全称 | 框架缩写 |\n| --- | --- |\n| 集成信息系统架构框架\
  \ | ARIS |\n| Bredemeyer 框架 | Bredemeyer |\n| 业务转型赋能计划转型框架 | BTEP |\n| 美国国防部架构框架\
  \ | DODAF |\n| CSC 催化剂 | Catalyst |\n| 计算机集成制造开放系统架构 | CIMOSA |\n| 企业架构框架 | Gartner\
  \ |\n| 企业架构规划 | EAP |\n| 扩展企业架构框架 | E2AF |\n| 联邦企业架构 (FEA) 参考模型 | FEA |\n| 通用企业参考架构和方法论\
  \ | GERAM |\n\n\n\n\n\n| 集成架构框架 | IAF |\n| :--- | :--- |\n| 企业架构 (EA) 支柱 | Forrester\
  \ |\n| 开源分布式处理的参考模型 | RM-ODP |\n| 信息管理技术架构框架 | TAFIM |\n| 财政部企业架构框架 | TEAF |\n|\
  \ 开放组架构框架 (TOGAF®) 技术参考模型 | TOGAF |\n| Zachman 框架 | Zachman |\n\n## 表 10.1 企业架构框架\n\
  \n这些框架包含了对所有相关组件的描述以及它们如何集成的说明。企业架构应该是业务架构的一个集成元素，并应包含以下主要领域：\n\n* 服务架构\n* 应用程序架构\n\
  * 数据/信息架构\n* IT 基础设施架构\n* 环境架构\n\n最可能与这些架构开发相关的角色通常描述为：\n* 业务/组织架构师\n* 服务架构师\n*\
  \ IT 基础设施架构师\n\n企业架构的真正收益和投资回报并非来自架构本身，而是来自组织能够以快速且一致的方式设计并成功实施项目和解决方案的能力。\n\n##\
  \ 技术管理\n\n对于信息技术的规划及其管理，应该采用战略性方法。架构需要在主要的技术领域内开发。\n\n### 技术架构\n\n所有信息技术领域都需要架构。在相关的情况下，需要在以下领域开发架构：\n\
  \n* 应用程序和系统软件\n* 信息、数据和数据库，包括信息安全与机密性、数据仓库和数据挖掘\n* 基础设施设计与架构：\n    * 中央服务器、大型机架构、分布式区域服务器，包括本地文件和打印服务器\n\
  \    * 数据网络（LAN、MAN、WAN、VPN、协议等）、互联网、内网和外联网系统\n    * 合并网络技术，包括语音网络（PABX、Centrex、话机、移动电话、传真等）\n\
  \    * 客户端系统（桌面级 PC、笔记本电脑 PC、移动访问设备（手持设备、手机手机、掌上电脑、PDA、扫描仪等））\n    * 存储设备、存储区域网络\
  \ (SAN)、网络附属存储 (NAS)，包括备份和恢复系统及服务（服务器、机器人等）\n    * 文档存储、处理和管理\n    * 特殊技术领域，如 EPOS、ATM、扫描设备、GPS\
  \ 系统等\n* 环境系统和设备，包括它们的监控和管理\n\n这将形成一个架构层次体系，需要对其进行集成，以构建组织构建一套技术架构。\n\n## 总结\n\n\
  在本章中，我们回顾了支持 PPO 流程和服务设计生命周期阶段的通用技术通用需求。我们探讨了与其实施相关的某些挑战和风险，并考虑了企业基础设施的重要性。我们讨论了集成服务管理技术工具集的整体需求，以支持规划保护和优化过程中的流程。\n\
  \n## 考试要点\n\n* **理解工具在支持服务设计中的作用。** 这包括理解如何选择符合组织需求的工具。\n* **解释服务设计对工具集的通用需求以及为什么这些需求之所以重要。**\
  \ 理解适用于 PPO 流程的通用需求，以及这些工具将如何支持生命周期的目标。\n* **理解各个 PPO 流程的特定需求。** 能够识别从 PPO 的各个流程的需求，以确保工具集实现最大效率。\n\
  * **解释名为 MoSCoW 的选择技术。** 了解该缩写的代表含义（Must/Should/Could/Would），并能够解释每个概念在工具选择中的用途。\n\
  * **理解实施技术中的风险。** 理解如何管理这些风险。\n* **理解实施新服务管理工具时可用的许可选项。** 能够描述不同的选项并给出各适用场景的示例。\n\
  * **理解实施新服务管理工具时可用的部署选项。** 能够描述不同的选项并给出各适用场景的示例。\n\n## 复习题\n\n你可以在录中找到复习题的答案。\n\n\
