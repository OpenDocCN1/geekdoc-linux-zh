  \n表格 12.1 变更文档内容示例\n\n某些服务管理工具集会向团队发布工单以执行任务，例如完成影响评估。这为变更的进度提供了可追溯性，并能显示流程在哪些环节出现了延迟。随着变更的进行，文档和相关的配置项将在\
  \ CMS 中更新。可能还会记录估计成本和实际成本以供后续分析。\n\n### 评估和评价变更\n\n重大变更应经过正式的变更评估。变更重要性的决策应基于定义良好的标准做出。如果认为必要，应提交正式的评估请求；如果不需要，评估将由适当的变更机构执行。\n\
  \n在评估影响时，使用通用的评估问题可能会帮助。其中一种方法被称为`七 Rs`，它涉及通过回答七个问题来评估所有变更：\n\n* 谁 `raised`（发起的）了变更？\n\
  * 变更的 `reason`（原因）是什么？\n* 变更要求的 `return`（回报）是什么？\n* 变更涉及的 `risks`（风险）有哪些？\n* 执行变更需要哪些\
  \ `resources`（资源）？\n* 谁对变更的构建、测试和实施负责 `responsible`（负责）？\n* 此变更与其他变更之间的 `relationship`（关系）是什么？\n\
  \n变更管理负责确保所有服务的变更都收到了所需的评估和授权，并确保其经过了开发、测试、实施和评审。特定 IT 服务的最终责任由服务所有者承担，该人员将参与该变更的变更机构。\n\
  \n无论由谁评估变更——`CAB`、`ECAB` 还是任何其他变更机构——必须理解潜在的业务影响、对基础设施、其他服务、SLA 性能以及其他服务管理方面（如容量、可用性和安全性）的影响。还必须考虑所需的资源和涉及的成本。必须将实施变更的影响与不实施该变更的影响进行比较，后者可能会阻止业务实现其目标。\n\
  \n评估变更的潜在影响在于评估风险。没有哪个变更是没有风险的，变更的大小并不一定与其涉及的风险一致。所谓的“小变更”可能对服务产生灾难性的影响，并对组织的品牌形象或声誉产生连锁反应。\n\
  \n在此示例中，变更构建、测试以及变更部署需要授权。对于其他变更，可能会有额外的授权步骤，例如授权变更设计或变更开发。\n\n### 确定变更优先级、计划和安排变更\n\
  \n确定优先级用于确立对所提变更的考虑顺序。如前所述，这应该基于影响和紧迫性，尽管请求者对这些因素的评估可能与变更经理和 `CAB` 不同。\n\n变更可以分组在一个发布版本中，并一起进行设计、构建、测试和部署。这可以节省时间，但需要小心以确保生成的发布版本不会过于复杂且包含许多重叠的依赖关系。由于此类发布产生的问题可能难以诊断。使用定期的变更和发布窗口可能会帮助，并允许服务提供商和业务进行提前计划。\n\
  \n### 授权变更构建和测试\n\n每个变更都由前述的适当变更机构进行授权。重大变更可能在其生命周期的多个时间点需要来自变更管理的多次授权，例如在设计开始之前、随后进行详细发布计划时、构建和测试开始之前、每次部署之前以及在同意关闭变更之前。\n\
  \n在每次授权之前，都应对对变更进行评估，以确保风险已得到管理，并且预测性能与实际性能符合业务需求。某些组织要求这些步骤中的每一步都有一个单独的 `RFC`；另一些则使用记录的工作流通过单个变更请求来管理所有阶段。\n\
  \n变更评估过程在第 13 章“服务验证、测试与变更评估”中有详细介绍。评估结果将使变更机构在提供部署授权之前做出明智的决策。\n\n当变更构建和测试完成后，将对结果进行评估，以确保风险已降至最低，并确认预测性能与实际性能符合业务需求。对于重大变更，变更评估过程将提供评估；对于较小的变更，变更管理过程本身将执行所需的检查。\n\
  \n如果变更机构对变更有担忧，可能会决定不授权当前形式的变更部署，而是要求修改设计。它可能担心部署进度并要求进行修改。对于复杂的变更，这种评估和修改请求可能会发生多次，直到变更机构满意为止。\n\
  \n### 协调变更构建和测试\n\n发布和部署管理负责将变更封装到发布版本中，随后对该发布进行构建和测试。简单变更可能不需要，这种情况下由变更管理过程协调部署。发布和部署管理过程在第\
  \ 14 章“发布和部署管理与知识管理”中有详细介绍。\n\n变更管理协调部署；部署活动本身将由适当的技术、应用和运营管理人员执行。\n\n工单可能用于请求技术团队构建变更。这有助于跟踪工作。变更管理还负责确保进行彻底测试。\n\
  \n### 授权变更部署\n\n当变更构建和测试完成后，将对结果进行评估，以确保风险已降至最低，并确认预测性能与实际性能符合业务需求。对于重大变更，变更评估过程将提供中间评估；对于较小的变更，变更管理过程本身将执行所需的检查。\n\
  \n发布和部署管理过程负责发布部署；某些变更将不会发布版本的一部分，在这种情况下，变更管理过程将协调部署。如前所述，在发生需要修复时将使用的程序已预先记录，以便在需要时可以使用。变更文档应定义谁有权决定何时对变更进行修复。\n\
  \n变更部署应根据业务需求进行安排——并选择对服务干扰最小的时间点。有时由于业务非常渴望发生变更，他们愿意接受一些干扰，而不是等待安静的时间。每当安排变更时，确保支持人员可用以解决可能出现的问题至关重要。\n\
  \n### 标准部署\n\n\n\n\n\n在变更已构建并测试，且部署程序已成功使用过一次或多次之后，那么对于该变更的未来部署，可能适合使用*标准部署请求*变更模型。这比完整的变更管理流程要简单得多。你可以在图\
  \ 12.4 中看到此类标准变更流程示例。\n\n![图像显示了标准部署请求流程，如通用变更、创建、评审、评估、评价订单、授权调度变更、协调变更实施以及评审和关闭。](img/00053.jpeg)\n\
  \n`图 12.4` 标准部署请求的流程示例\n\nCopyright © AXELOS Limited 2010\\. 保留所有权利。材料根据 AXELOS\
  \ 的许可复制。\n\n某些极低风险的变更可以委托给服务台或其他服务运营人员作为变更授权。此类标准变更的变更模型可能非常简单，如图 12.5 所示。\n\n![图像显示了标准运营变更请求，如创建\
  \ RFC（角色）、实施变更（发起者）、评审和关闭变更记录（变更管理）。](img/00054.jpeg)\n\n`图 12.5` 标准运营变更请求的流程示例\n\
  \nCopyright © AXELOS Limited 2010\\. 保留所有权利。材料根据 AXELOS 的许可复制。\n\n## 评审和关闭变更记录\n\
  \n部署完成后，将根据性能和剩余风险评估变更的成功与否。与构建和测试阶段的评估一样，在需要时，变更评估过程将产生一份正式的评估报告；对于较小的变更，由变更管理流程执行评估。评估报告应包括任何由变更引起的事件。如果评估识别出不可接受的风险，将通知变更授权部门，以便决定是否应采取行动。\n\
  \n如果评估结果良好，则由相关的利益相关者批准关闭已完成的变更。如果变更是为了解决问题或已知错误，那么这些记录此时也将一并关闭。\n\n应对对变更进行实施后评审（PIR），以确认变更已达到其目标、发起者和利益相关者对结果满意，并且没有出现意外的副作用。最后，任何识别出的对流程的可能改进都应提交纳入持续服务改进（CSI）注册表。虽然所有变更都应经过评审，但较小的组织可能选择对样本变更进行完整的\
  \ PIR，或仅对被认为重要的变更进行评审，而不是所有变更。\n\n服务变更对客户可见，评审通常将在下一次服务水平管理评审会议举行。基础设施变更通常对客户不可见，并在内部进行评估。\n\
  \n变更应在预定义的时间结束后进行评审，因为结果可能不会立即显现。例如，如果一个变更旨在解决某个问题，则只有在一段时间没有由该问题引起的事件后才能进行评估。如果变更是为了提高可靠性，则只有在过一段时间后才能进行评估。如前所述，变更评审是\
  \ CAB（变更委员会）的标准议程事项；如果发生了正式的变更评估，评估报告将是该评审的主要输入。评审将考虑变更是否按预期运行且没有意外的副作用，以及利益相关者是否满意。该流程本身也将对所需资源、时间及成本的预测准确性进行评估。部署或修复计划中的任何问题也将被记录。CAB\
  \ 或变更授权成员以及其他相关方将收到任何问题，并作为流程改进的一部分予以处理。\n\n如果变更被判定为未能实现其目标，变更管理（或变更授权部门）将决定任何必要的行动；成功的变更应正式关闭。\n\
  \n## 服务运营期间日常执行的典型变更管理活动\n\n变更管理是服务生命周期服务过渡阶段的关键过程；然而，在服务运营阶段有很多日常变更管理活动。这些活动包括处理日常运营需求的标准变更，以及为了处理服务运营问题而提出的\
  \ RFC。服务运营人员将参加变更委员会（CAB）或紧急变更顾问委员会（ECAB）会议，就拟议变更的风险和影响提供运营视角。当变更获得批准后，通常由运营人员负责实施行动。如果变更失败，通常也由运营人员负责回滚变更。此外，作为整体变更部分的日常数据中心设备移动将由运营人员执行。服务运营人员将收到变更计划，并确保他们已为变更做好准备。\n\
  \n服务运营人员将与设计和过渡的相关人员合作，以确保在规划或设计新服务或变更服务时，考虑到服务运营的需求和关注点。\n\n## 管理组织和利益相关者变更\n\n\
  所提供的 IT 服务的重大变更将导致组织内人员工作方式的变化。变更不仅影响技术，还影响组织本身。业务变更是业务部门的责任，但通常是 IT 服务变更落实业务战略，这就是为什么\
  \ IT 服务变更在实施此类变更时必须意识到管理利益相关者的重要性。影响组织工作方式的 IT 服务变更示例可能包括：改变零售组织服务客户的新型 IT 电子商务服务，或改变\
  \ IT 用户与 IT 服务提供商交互方式的 Web 门户。\n\n未能理解变更在组织和文化方面的重要性，是这些变更未能交付计划利益的根源。新服务在技术上可能是有效的，但如果用户对其产生反感，它永远无法被正常使用，利益也无法实现。员工可能会对新方法产生反感，直接离开组织。\n\
  \n有效的变更必须经过领导和管理。这意味着传达变更的必要性及其将实现的愿景。受变更影响的人也需要理解实现计划，相关的经理需要确保提供可用资源，以便用户不必在完成“日常工作”的同时努力掌握新方法。这些责任大部分属于业务部门，而非\
  \ IT，但服务过渡流程所有者或经理是关键利益相关者。实施技术方面的问题或发布期间对运营的任何影响，都需要报告给变更领导人员。\n\n\n\n\n理解组织文化非常重要；例如，被引入运行\
  \ IT 服务的外包公司往往难以理解公共部门或政府部门那种截然不同的组织文化。实现成功的服务过渡需要员工理解如何构建、测试、部署和运行服务。应该识别所需技能的缺口并采取行动克服这些缺口。向运营人员进行有效的知识传递至关重要，并且需要进行规划和资源配置；通常，人们倾向于假设运营人员会“在过程中自然掌握知识”。\n\
  \n### 触发器\n\n让我们来看一些变更管理过程的触发器示例。请记住，变更可以从生命周期的任何阶段触发。\n\n### 策略触发器\n\n首先，我们将检查作为策略输出的变更触发器。策略可能需要通过变更来实现特定目标，同时尽可能地减少成本和风险。不存在无成本且无风险的战略计划或倡议；我们只能尝试将其降至最低。以下是一些实施战略变更的计划和倡议示例。\n\
  \n法律、法规、政策或标准的变更可能需要服务进行变更，组织变更也是如此。变更可能源于业务、客户和用户活动模式的分析。增加新服务，或对服务、客户或合同组合进行任何其他更新，或者变更采购模式，也要求服务提供商执行变更。最后，技术不断有新进展；服务提供商可能希望利用这些进展。\n\
  \n通过服务组合提供的服务的变更，以及服务目录中当前服务的变更将触发变更管理过程。这些可能包括对服务包、定义或特征的变更；效用、保证或服务水平的变更；或者容量和资源需求。对成本、服务资产或验收标准的任何变更也可能触发该过程。花几分钟考虑所有这些可能的触发器示例，并考虑每个示例可能的影响；变更管理的责任是在确保实现收益的同时管理这些可能的影响。\n\
  \n### 运营变更\n\n许多来自用户的请求会导致运营变更；这些可能包括诸如重置密码、访问请求或移动 IT 资产的请求。这类变更通常由请求履行部门作为标准变更进行管理。\n\
  \n服务运营功能也将通过正常和标准变更程序实施变更。它们可能是纠正性的，例如重启服务器或重新应用程序；或者是预防性的，例如应用服务补丁以防止可能发生的事件。无论何种情况，这些变更都可能影响共享服务。\n\
  \n最后一个触发器来自 CSI（持续服务改进），涉及涉及以实现持续改进的变更。作为 CSI 措施的结果，可能会识别出对变更的需求。CSI 可能识别出技术、流程、文档等方面的改进，以交付服务的改进。这些变更将作为\
  \ `RFCs` 提出，它们的实施可能会对服务提供和其他 CSI 倡议产生意外的负面影响。因此，需要对它们进行管理以最小化风险。\n\n### 输入\n\n变更管理过程的输入包括以下示例：\n\
  \n* 新服务或重大变更服务的章程\n* 变更请求、变更记录和已批准的变更\n* 来自组织业务和 IT 策略、计划、财务计划的业务信息，以及及其未来需求的信息\n\
  * 业务影响分析，提供与每个服务或服务需求变更相关的影响、优先级和风险信息\n* 服务组合，包括服务目录，以及新或变更服务在服务包和服务选项方面的面的业务需求\n\
  * 治理需求\n* 公司、法律和法规政策及要求\n\n### 输出\n\n变更管理过程的输出包括：\n\n* 被拒绝或批准的 `RFCs`\n* 由批准的 `RFCs`\
  \ 导致的对服务或基础设施的变更\n* 新的、变更的或处置的资产或配置项，例如基线、服务包、发布包\n* 修订后的变更计划和预计的服务停机、已批准的变更计划、决策和行动\n\
  * 变更文档、记录和报告\n\n### 接口\n\n变更管理与其他各个过程之间存在多个接口。任何过程都可能受到变更的影响，因此变更管理的一个特征是不同领域之间需要协作。识别清晰的边界、依赖关系以及这些接口运行的规则是非常重要的。\n\
  \n变更管理与其他过渡过程紧密合作。例如，它与过渡规划与支持协作，以确保有协调的整体方法管理服务过渡；与服务资产和配置管理协作，确保对 `CIs` 的所有变更都被记录。该过程还与变更评估紧密集成，并明确约定哪些类型的变更将接受正式变更评估，并预留必要时间。评估报告将供\
  \ `CAB` 用于帮助其决策。变更的实施可能还需要与发布和部署管理建立接口。\n\n当建议的变更可能对组织的其他部分产生影响时，变更管理过程必须与业务变更过程和业务项目管理建立接口。服务组合管理过程将在制定新或变更服务的章程之前向变更管理提交变更建议，以识别潜在的资源冲突或其他问题。因此，任何可能影响或被变更影响的过程都必须与变更管理过程建立接口。随着故障修复的实施，问题管理过程将成为许多变更来源。变更管理与其他过程之间有几个主要连接，包括：\n\
  \n* 财务管理\n* 业务关系管理\n* 策略管理\n* 服务验证与测试\n* 服务水平管理\n* 可用性、容量、连续性和安全性（保证过程）\n\n这些每项都可以是变更的来源，或受到变更的影响。\n\
  \n## 信息管理：配置管理系统的角色\n\n将变更与单个 `CIs` 和服务关联的能力至关重要；良好的 IT 服务管理工具将能够定义这些关系，并应该能够将事件和问题与\
  \ `CIs` 以及变更关联起来。目标是能够追踪从事件和受影响的 `CIs` 到底层问题以及为了克服问题正在实施的变更之间的链路；必要时，从变更到结果事件的链路也应该是可追溯的。\n\
  \n变更管理依赖 `CMS` 来理解建议变更的潜在影响和风险。`SKMS` 中包含的其他信息（如服务设计包）将协助变更的规划和管理，并识别涉及的利益相关者。\n\
  \n## 变更管理过程角色\n\n\n\n\n\n本节描述了在支持变更管理过程中需要执行的若干角色。这些角色并非职位名称；而是对成功运行该过程可能需要的角色的指导，每个组织都必须根据其需求定义适当的职位和工作描述。第\
  \ 1 章“运营支持与分析简介”探讨了适用于整个服务生命周期中所有流程的通用角色。这些角色与变更管理过程以及我们在本章稍后部分讨论的服务资产和配置管理角色相关，但再次强调，还有一些特定的额外要求同样适用。\n\
  \n## 变更管理流程所有者 (Change Management Process Owner)\n\n除了履行该流程的通用流程所有者角色外，变更管理流程所有者的职责通常包括：\n\
  \n*   设计变更权限层级以及将 `RFCs` 分配给变更权限的标准\n*   设计变更模型和工作流\n*   与其他流程所有者合作，确保在变更管理、服务资产和配置管理；发布和部署管理以及服务验证和测试的设计与实施方面采用整合的方法\n\
  \n## 变更管理流程经理 (Change Management Process Manager)\n\n除了履行该流程的通用流程经理角色外，变更管理流程经理的职责通常包括：\n\
  \n*   计划和管理变更管理工具和流程的支持\n*   维护变更计划和预计的服务停机时间\n*   协调变更管理与其他流程之间的接口——特别是服务资产和配置管理以及发布和部署管理\n\
  \n## 变更发起者 (Change Initiator)\n\n每个变更都有一个单一的变更发起者；这可以是组织中的几乎任何人，但通常不是由负责变更管理的人员。该角色的职责通常包括：\n\
  \n*   识别变更需求，并在适当的情况下完成并提交 `RFC` 和变更建议\n*   在受邀时为 `CAB` 成员提供额外信息\n*   在变更管理要求时（特别是在关闭之前）审阅变更\n\
  \n## 变更执行者 (Change Practitioner)\n\n变更执行者的职责通常包括：\n\n*   验证 `RFCs` 已正确填写，并将其分配给相应的变更权限\n\
  *   提交评估请求\n*   传达变更权限的决策\n*   确保正确执行变更的构建和测试\n*   发布变更计划和预计的服务停机时间\n\n## 变更权限 (Change\
  \ Authority)\n\n每个变更类别将定义其自己的变更权限。他们的职责通常包括：\n\n*   审查特定类别的 `RFC`\n*   在约定的点正式授权变更\n\
  *   帮助在关闭前审阅变更\n*   根据需要参加 `CAB` 会议以讨论和审阅变更\n\n## CAB 成员 (CAB Member)\n\n`CAB` 可能纯粹是咨询，但它通常是某些变更类别的变更权限。某些\
  \ `CAB` 成员可能是其他特定类别变更权限。`CAB` 成员的职责通常包括：\n\n*   参加 `CAB` 会议，代表特定的小组或部门\n*   在参加\
  \ `CAB` 之前在其小组内沟通 `RFCs` 并收集反馈\n*   审阅 `RFCs` 并建议是否应授权\n*   审阅成功、失败和未经授权的变更\n* \
  \  对变更计划的决策做出贡献，以避免冲突或资源问题\n*   对预计的服务停机提供反馈\n\n## CAB 主席 (CAB Chair)\n\n`CAB` 通常由变更经理主持，除非存在多个\
  \ `CABs`；在这种情况下，可能有多个变更经理，每个人主持一个不同的 `CAB`。\n\n`CAB` 主席的职责通常包括：\n\n*   决定谁应该参加 `CAB`\
  \ 会议\n*   计划、调度、管理和主持 `CAB` 会议\n*   根据变更策略选择在 `CAB` 会议上审阅的 `RFCs`，并在会前发放\n*   在需要时召集紧急变更委员会\
  \ (`ECAB`) 会议\n*   选择在 `CAB` 会议上评审的成功和失败变更\n\n## 关键成功因素与关键绩效指标 (Critical Success\
  \ Factors and Key Performance Indicators)\n\n列表包含了变更管理的一些关键成功因素 (`CSFs`)。每个组织都应该根据其成熟度水平、`CSFs`\
  \ 以及特定情况开发相应的关键绩效指标 (`KPIs`)。\n\n**应对 `KPIs` 的达成情况进行监控，并用于识别改进机会，这些机会应记录在 `CSI`\
  \ 注册表中以便评估和可能的实施。\n\n`KPIs` 必须具有意义并符合 `SMART` 原则（具体、可衡量、可行、相关和有时限），因此应使管理层能够做出及时准确的可操作决策。`KPIs`\
  \ 显示了 `CSF` 是否正在实现。例如，“响应业务和 IT 变更请求以使服务与业务需求保持一致的同时实现价值最大化”这一 `CSF` 的实现可以通过 `KPI`\
  \ 来衡量，显示符合客户约定要求的变更百分比增加，或者交付的变更效益（通过改进价值和防止的负面影响衡量）超过了变更成本。其他相关的 `KPIs` 包括变更请求积压的减少，以及实施变更的平均时间落在\
  \ `SLA` 目标范围内。\n\n更多示例可参考 ITIL 服务过渡出版物。\n\n## 挑战 (Challenges)\n\n变更管理面临的主要挑战是确保所有变更都得到记录和管理，以便没有任何变更绕过流程。如果高层管理支持可见，将有助于说服员工理解该流程的重要性。要说服员工变更管理是促进而非阻碍或延迟变更，并通过帮助变更更快发生且成功率更高来增加价值，也可能是困难的。如果克服了这些说服员工认可价值的挑战，未经授权变更的数量将会减少。\n\
  \n机构的另一个常见挑战是从简单的变更授权（仅在变更即将上线前考虑 `RFCs`）转向完整的变更管理（即从生命周期更早阶段对其进行评估和计划）。较大的组织可能发现获得所需的变更权限级别的认可以及在层级之间进行有效沟通也面临挑战。\n\
  \n## 风险 (Risks)\n\n变更管理的风险主要是对变更管理流程缺乏投入。这可能是业务部门缺乏投入（缺乏业务赞助），或者 IT 管理层缺乏投入（缺乏 IT\
  \ 管理赞助），或者 IT 员工缺乏投入，导致变更绕过流程。\n\n其他风险包括对变更的评估不足（采取“走过场”的态度），这导致变更在没有充分评估的情况下进行，并导致变更实施出现不延迟。这通常由于过度的官僚主义导致。如果这些风险发生，会加剧对流程投入的缺乏。业务或项目可能存在走捷径的压力，导致评估的时间或资源不足。最后，与其他流程的接口可能定义不当，导致混淆。\n\
  \n## 服务资产和配置管理 (Service Asset and Configuration Management)\n\n\n\n\n\n在许多方面，服务资产和配置管理（`SACM`）是变更管理的伴侣过程；两者相互依赖以实现成功。没有配置管理，变更管理将难以理解任何变更的影响，因为它将缺乏关于\
  \ `CIs` 及其相互关系的信息。如果没有变更管理的纪律性，服务资产和配置管理将难以开发和维护准确的 `CMS`，因为变更可能会在没有任何任何通知或文档记录的情况下发生。\n\
  \n### 目的\n`SACM` 过程的目的是确保交付服务所需的资产得到妥善控制，并在需要的时间和地点能够获得有关这些资产的准确且可靠的信息。这些信息包含了资产如何配置的详细信息以及资产之间的关系。\n\
  \n### 目标\n服务资产和配置管理的目标如下：\n\n* 通过识别、控制、记录、报告、审计和验证所有配置项（包括在内），确保 IT 资产在整个生命周期内得到识别、控制和妥善维护。\n\
  * 由于变更可能在没有任何通知或文档记录的情况下发生，服务资产和配置管理将难以维护准确的 `CMS`。\n* 确保 IT 资产在整个生命周期内得到识别、控制和妥善维护。\n\
  * 确保 IT 资产在整个生命周期内得到识别、控制和妥善维护。\n* 确保 IT 资产在整个生命周期内得到识别、控制和妥善维护。\n* 确保 IT 资产在整个生命周期内得到识别、控制和妥善维护。\n\
