  （注：此处原文似乎存在大量重复内容，翻译已根据逻辑逻辑处理，核心目标如下：）\n* 通过识别、控制、记录、报告、审计和验证所有配置项，确保 IT 资产在整个生命周期内得到识别、控制和妥善维护。\n\
  * 与变更管理合作，确保仅使用授权的组件。\n* 考虑到、管理并保护 `CIs` 的完整性。\n* 通过准确的 `CMS` 确保 `CIs` 的完整性。\n*\
  \ 通过准确的 `CMS` 满足治理需求（如软件资产管理、Sarbanes-Oxley、ISO/IEC 20000、ISO/IEC 38500 或 COBIT），并交付\
  \ SLA 和合同定义的能力、资源。\n\n### 范围\n`SACM` 的范围包括对 `CI` 的完整生命周期管理，确保 `CIs` 是受控的。配置项的准确性确保了发布和审计，且\
  \ `CIs` 是经过授权的。通过识别、控制、记录、报告、审计和验证所有配置项，确保 IT 资产在整个生命周期内得到识别、控制和妥善维护。配置管理依赖于对资产的准确记录，以确保\
  \ `CIs` 是授权的。\n\n### 对业务的价值\n通常情况下，对业务的价值体现在配置管理不当导致的风险，例如故障、停机或问题。`SACM` 通过提供准确的配置信息有助于解决\
  \ `CIs` 的问题。提供准确的配置信息有助于 `CIs` 的可溯性。可追溯性。这有助于 `CIs` 的审计。`SACM` 通过提供准确的信息来跟踪 `CIs`\
  \ 的状态，从而支持决策。最终，通过准确的配置信息，资产管理受益于 `CIs`。\n\n## 策略与原则\n现代业务功能需要对项进行配置，例如在办公室使用 PC。对物理服务器的变更可能会影响服务。许多服务运行在不同的虚拟化服务器上。`SACM`\
  \ 的范围还确保 `CIs` 是受控的。\n\n### 政策\n在实施 `SACM` 过程之前，需要就目标、原则和关键成功因素（CSFs）做出决策。这些政策通常与变更和发布管理过程密切相关。每个组织将根据其特定的业务驱动因素制定政策。这些政策必须符合合同和服务管理需求。可能还需要特定的政策来应对诸如“自带设备（BYOD）”或确保符合法律、法规和标准（如知识产权、许可证）。\n\
  \n### 原则\n`SACM` 的典型原则包括：确保涉及的成本和所需的资源与潜在风险相匹配。配置管理可能成本较低，但未能记录 `CIs` 之间的关系和依赖关系可能会阻碍问题的解决，并导致比高效流程更昂贵的停机。可能需要满足治理需求（如软件资产管理、Sarbanes-Oxley、ISO/IEC\
  \ 20000、ISO/IEC 38500 或 COBIT），并交付 SLA 和合同定义的能力、资源和保证。提供的服务必须可用、可靠且具有成本效益。内部和外部利益相关者或其他流程可能需要\
  \ `SACM` 提供准确的资产和配置信息。必须支持 `CIs` 的可追踪性和审计性。\n\n## 基本概念\n让我们回顾该过程的一些基本概念和定义。你在基础学习中应该记得它们：\n\
  \n* 服务资产是任何可以对交付服务贡献资源或能力。\n* 配置项（`CI`）是为了交付 IT 服务而需要管理的资产。\n* 所有 `CI` 都是服务资产，但并非所有服务资产都是配置项。\n\
  \n\n\n\n\n*   配置记录是关于配置项（CI）的一组属性和关系。\n*   配置记录存储在配置管理数据库（`CMDB`）中，并在配置管理系统（`CMS`）中进行。\n\
  *   服务知识管理系统（`SKMS`）是一组用于管理知识、信息数据的工具和数据库。我们将在第 14 章详细介绍 SKMS。\n\n### 属性与关系\n\n\
  支撑服务资产配置管理（SACM）的策略定义了针对不同 CI 类型需要记录的属性和关系。每个 CI 必须包含唯一标识符和 CI 类型这两个最小属性。其他属性取决于\
  \ CI 的类型。典型属性包括：\n\n*   名称/描述\n*\n版本（例如：文件、构建、基线、发布）\n*   供应日期\n*   许可证详情，例如过期日期\n\
  *   状态\n*   审计跟踪\n\n关系类型通常包括：\n\n*   “父子关系”——一个 CI 是另一个 CI 的部分；例如，一个软件模块是程序的一部分。\n\
  *   “连接到”——例如，台式计算机连接到局域网（LAN）。\n*   “使用”——例如，一个程序使用了另一个程序的模块。\n*   “安装在”——例如，Microsoft\
  \ Project 安装在台式电脑上。\n\n其他关系可能还包括指向特定位置、CI 所有者、供应商、支持的服务、相关文档、适用 SLA 和主软件副本的链接。\n\
  \n### 配置模型\n\n服务资产和配置管理通过记录配置项之间的关系，提供了一种服务、资产和基础设施的模型，如图 12.6 所示。\n\n![图像显示了逻辑配置模型，其中客户和服务选项共同链接到合同，类似地，服务组合中的银行核心服务与合同链接，形成电子银行支持服务和应用程序托管服务。](img/00055.jpeg)\n\
  \n图 12.6 逻辑配置模型示例\n\nCopyright © AXELOS Limited 2010\\. 保留所有权利。材料根据 AXELOS 的许可复制。\n\
  \n配置模型使其他流程能够访问有价值的信息。以下是一些示例：\n\n*   这些信息将在评估事故和问题的影响及原因、评估拟议变更的影响以及规划和设计新或变更的服务时提供帮助。\n\
  *   这些信息将在规划技术更新或软件升级，或将服务资产迁移到不同位置和服务中心中心时提供帮助。\n*   通过理解哪些 CI 成了每个服务，可以优化资产利用和成本，并实现资产重用。\n\
  \n正如我们之前所说的，配置项（CI）是为了交付 IT 服务而需要管理的服务资产。配置项应包含 CI 属性的有用细节。维护此类信息可能需要大量的管理开销，因此应谨慎，只有当信息提供的价值大于收集和维护它的成本时才包含该信息。配置项在复杂度、大小和类型上可能很大，从包含所有硬件、软件、文档和支持人员在内的整个服务或系统，到单个软件模块或微型硬件组件。配置项可以被分组一起管理：例如，一组组件可以被分组为一个发布版本。\n\
  \n### 不同 CI 类型的示例\n\n我们通常从硬件、软件和网络组件的角度考虑 CI，事实上，大多数 CI 都属于这些类别。配置项包括我们想要管理和控制的任何内容，因此我们也可能包括以下其他\
  \ CI 类型：\n\n*   服务生命周期 CI，可能包括计划、业务案例、服务设计包等。\n*   服务 CI 可以描述：\n    *   能力资产，如管理、组织、流程、知识和人员\n\
  \    *   资源资产，如财务资本、系统、应用程序、信息、数据、基础设施和设施、财务资本和人员\n    *   服务模型和服务验收标准也可以是服务 CI。\n\
  *   组织 CI 包括业务策略文档或法定要求等项目。\n*   内部 CI 可能指交付和维护服务及基础设施所需的实体资产（数据中心）和无形资产（如软件）。\n\
  *   外部 CI 指外部客户需求和协议、供应商的发布版本以及外部服务。\n*   接口 CI 的示例可以是升级文档，规定两个服务提供商将如何合作。\n\n服务资产和配置管理使用配置管理系统（`CMS`）来管理\
  \ CI 数据。`CMS` 持有范围内的所有 CI 相关信息。服务 CI 将包含供应商、成本、购买日期以及许可证和维护合同的续约日期等属性；相关文档（如 SLA\
  \ 和基础合同）存储在 `SKMS` 中。\n\n图 12.7 显示了存储在 `CMS` 中的配置记录与实际 CI 之间的关系，实际 CI 可能存储在 `SKMS`\
  \ 中，或者作为 `SKMS` 之外的物理资产存在。\n\n![图像显示 CMS 和 SKMS 之间的关系。SKMS 内部包含 CMS 组件。CMS 由某些 CI\
  \ 组成。配置记录存储在 CMS 中的 CMDB 中。](img/00056.jpeg)\n\n图 12.7 CMS 与 SKMS 之间的关系示例\n\nCopyright\
  \ © AXELOS Limited 2010\\. 保留所有权利。材料根据 AXELOS 的许可复制。\n\n所有 CI 更改必须经过变更管理的授权，且所有更新必须包含对相关配置记录的更新。`CMS`\
  \ 还用于服务资产配置管理之外的广泛用途，例如固定资产财务报告。它维护所有服务组件之间的关系，并可能包含相关事故、问题、已知错误、变更和发布的记录。或者，这些也可以存储在\
  \ `SKMS` 中但显示与关联 CI 的链接。`CMS` 可以链接到关于员工、供应商、位置、业务单元、客户和用户的企业级数据，或者持有这些信息的副本。\n\n\
  在图 12.8 中，你可以看到 `CMS` 架构层的应用示例。我们将在稍后的第 14 章考虑知识管理时详细介绍这一点。`CMS` 可能包含来自存储在多个物理 `CMDBs`\
  \ 中的配置记录数据，这些数据在信息集成层汇聚形成一个集成的 `CMDB`。集成 `CMDB` 还可能整合来自外部数据源（如 HR 数据库或财务数据库）的信息。`CMS`\
  \ 的表示层将包含不同的视图和仪表板，以满足需要访问配置信息的不同群体的人的需求。除了为负责 SACM 的人员提供合适的视图外，还可能为参与变更管理、发布和部署管理的人员、技术和应用管理职能的人员或服务台台人员提供合适的视图。`CMS`\
  \ 将尽可能访问资产清单中的数据，而不是重复数据。\n\n![图像显示了 CMS 的架构层，如表示层、知识处理层、信息集成层（集成 CMDB）和数据层（带有配置记录、各种记录和数据库的\
  \ CMDB）。](img/00057.jpeg)\n\n图 12.8 CMS 架构层应用示例\n\n\n\n\n\nCopyright © AXELOS Limited\
  \ 2010\\. 版权所有。材料经 AXELOS 授权许可复制。\n\n## 配置基线\n\n配置基线是经过正式评审并同意的业务、产品或基础设施的配置状态。它捕获了配置的结构、内容和细节，并代表了一组相互关联的配置项。它用于标记服务开发过程中的里程碑，或者从一组定义的输入中构建服务组件。它还可用于在日后更改或重建特定版本，汇集所有相关组件以准备进行变更或发布，或为配置审计和回滚提供基础。\n\
  \n## 快照\n\n快照是在特定时间点记录的 CI（配置项）、过程或其他数据集的当前状态。当问题管理需要分析事件实际发生时的证据时，这非常有用。它还能辅助系统恢复并支持安全扫描软件，因为相对于之前的快照，任何更改都是显而易见的。\n\
  \n## 资产管理\n\n组织需要管理固定资产，因为它们具有财务价值。该过程包括对每个资产进行识别、命名和标记，并记录其所有者。这些信息将存储在资产登记中，包括每个资产的购买成本、折旧和净面值等细节。该过程还必须保护资产免受干扰或损坏，并进行审计以确保其完整性。资产管理与配置管理的主要区别在于，资产管理关注每个单独资产的财务方面，而配置管理关注每个项目与其他项目之间的关系以及对服务的提供。一个财务价值极低的资产可能在服务的提供中发挥关键作用。\n\
  \n外包服务提供商可能会管理组织的部分 CI 资产，并执行部分或全部的相同活动——跟踪、命名、标记、保护和审计。\n\n## 软件资产管理\n\n与其他资产类型相比，管理软件资产涉及额外的风险。这些风险包括许可数量太少或过多、购买证据丢失，以及无意违反条款和条件。软件资产管理负责管理软件、许可和激活码。\n\
  \n有效的 SAM（软件资产管理）依赖于适当工具的使用，包括 `CMS` 和最终媒体库（`DML`）。我们接下来查看 `DML`。\n\n## 安全库与安全存储器\n\
  \n`DML` 是一个安全的库，存放所有介质 CI 的最终授权版本。它由一个或多个软件库或文件存储区域组成，包含组织内所有受控软件的主副本。这包括购买的软件（带有许可文件）、现场开发的软件，以及相关受控文档的主副本。`DML`\
  \ 还将包含一个存放主副本的物理存储器——例如防火箱。只有授权的介质才能被接受 `DML`，并由 `SACM` 严格控制。`DML` 是发布和部署管理的基础。\n\
  \n还应留出一个区域用于安全存储最终的硬件备件。这些组件的细节、位置及其各自的构建和内容应在 `CMS` 中完整记录。\n\n`DML` 中的电子资产存储在 `SKMS`\
  \ 中，`DML` 中的每一项都是一个 CI。图 12.9 显示了 `DML` 与 `CMS` 中的 `CMDB` 之间的关系。\n\n![图像显示包含物理 CI、构建新发布和电子\
  \ CI 的 DML。CMS 包含 CMDB（关于 CI 和发布记录的信息），它与 DML 中的物理 CI 链接。](img/00058.jpeg)\n\n**图\
  \ 12.9** 最终媒体库与配置管理系统之间的关系\n\nCopyright © AXELOS Limited 2010\\. 版权所有。材料经 AXELOS\
  \ 授权许可复制。\n\n## 资产退役\n\n资产退役有多种原因，包括服务退役且使用的资产不再需要、技术更新替换了旧资产、硬件故障导致组件更换，或者容量需求降低释放了组件。\n\
  \n退役资产时应采取的详细步骤应在服务设计包中记录，与其他任何服务过渡的方式相同。这些步骤应包括在适当的情况下重新部署、重用或销售资产，以尽量减少浪费；在无法实现时，确保处置符合要求的环保标准。退役资产上存储的数据必须根据信息安全策略进行移除和管理。如果是租赁设备，应将其归还，并取消退役设备的维护合同。最后，应更新\
  \ `CMS` 中的资产状态，并通知固定资产管理流程，以便更新资产记录。\n\n## 过程活动、方法和技术\n\n在开始查看服务资产和配置管理过程活动之前，让我们看看这些活动是如何协同工作的。在图\
  \ 12.10 中，你可以看到服务资产和配置管理的层级活动——在本例中，这是一个活动模型。\n\n![图像显示包含管理和规划、配置识别、配置控制、状态统计和报告以及与反馈和控制链接的验证活动模型。](img/00059.jpeg)\n\
  \n**图 12.10** 的服务资产和配置管理活动模型\n\nCopyright © AXELOS Limited 2010\\. 版权所有。材料经 AXELOS\
  \ 授权许可复制。\n\n服务资产和配置管理活动包括管理和规划、配置识别、配置控制、状态统计和报告以及验证和审计。我们将逐一查看。\n\n### 管理和规划\n\
  \n不同组织所需的服务资产和配置管理水平不同，因此没有标准模板。管理团队应该决定特定服务或项目需要的什么水平，以及如何实现这一水平，然后将其记录在 `SACM`\
  \ 计划中。可能有多个 `SACM` 计划，针对每个项目、服务或服务组。这些计划定义了在总体 `SACM` 策略背景下的特定 `SACM` 活动。`SACM`\
  \ 计划的典型内容包括：\n\n*   范围定义；应包含哪些服务、位置、环境和基础设施元素\n*   问责制、追溯性、审计性以及配置管理系统的需求定义\n* \
  \  任何相关的政策和标准，如 `ISO/IEC 20000` 或 `ISO/IEC 19770-1`\n*   相关的内部标准，例如约定的硬件标准和桌面标准\n\
  *   角色和职责\n*   与变更管理的关系\n*   `SACM` 系统和工具\n*   关于配置识别、版本控制、供应商管理、发布和部署管理、构建和基线的流程和程序\n\
  *   对 `CMS` 的责任\n*   `CIs` 如何进行采购和退役\n*   验证和审计过程\n*   与其他过程和组的关系及接口，特别是与固定资产管理的关系\n\
  \n### 配置识别\n\n\n\n\n配置识别过程活动包括定义和记录选择 `CIs` 及其组件的标准，然后根据这些标准进行选择。随后，为每个 `CI` 分配一个唯一的标识符并对其进行相应的标记。指定每个\
  \ `CI` 的相关属性，包括其与其他 `CIs` 的关系，并识别负责每个 `CI` 的所有者。记录每个 `CI` 纳入 `SACM` 过程控制的日期。必须对定义\
  \ `CIs` 的层级做出决策，在有帮助的情况下，将顶层 `CIs` 拆分为组件级 `CIs`。一个 `CI` 可以同时属于多个 `CI groups`（例如，一个数据库可能被许多应用程序使用）。\n\
  \n存在一种风险，即如果选择的层级过低，管理开销可能不划算。例如，将工作站定义为单一 `CI` 可能比将其定义为键盘、显示器、鼠标和主机箱等多个 `CIs` 集合更具实践意义。正确的\
  \ `CI` 层级应当是在有用信息、所需的控制层级以及维护这些信息所需的精力之间取得平衡。这在不同组织之间会有不同；例如，一个安全的军事设施与其他组织相比，可能要求对\
  \ `CIs` 进行低层级的定义和控制。`CI` 信息应仅在其有用的层级进行收集和维护。\n\n## 配置控制\n\n配置控制活动确保在没有遵循适当程序的情况下，不添加、修改、替换或删除任何\
  \ `CI`。`CMS` 数据的控制取决于有效的变更管理，变更管理应管理所有的 `CI` 更改并确保在每次更改后更新 `CMS`。其他 `SACM` 过程还包括\n\
  \n* 确保在发布之前获取配置基线，以供后续与实际部署进行对比\n* 确保维护 `DML` 的完整性\n* 使用许可控制措施防止在没有有效许可的情况下使用软件，以及防止购买超过所需的许可\n\
  * 实施版本和构建控制\n* 对存储 `CIs` 的区域（特别是 `DML`）实施物理访问控制\n\n## 状态核算与报告\n\n这组过程活动通过多种状态跟踪\
  \ `CI` 发生发生的情况。每个 `CI` 将具有一个或多个状态，并在这些状态中演进。以下是生命周期的简单示例：\n\n* `Development or Draft`：表示\
  \ `CI` 正在开发中，不应对其产生特定的依赖\n* `Approved`：表示 `CI` 可以作为后续工作的基础\n* `Withdrawn`：表示 `CI`\
  \ 已从使用中撤出，因为它不再符合其用途，或者因为它不再被使用\n\n应当定义 `CIs` 从一个状态移动到另一个状态的方法。\n\n## 验证与审计\n\n\
  活动包括一系列审查或审计，以确保配置记录与实际情况相符——即 `CIs` 及其文档确实如 `CMS` 中所述存在。审计旨在验证 `CIs` 及其文档的真实性，并确认它们配置正确，特别是在计划发布时。发现的任何未注册和未经授权的物品都应进行调查，并采取纠正措施以解决由于某些人员规避程序可能导致的问题。所有异常都应被记录并报告，并创建审计记录以支持未来的合规性检查。\n\
  \n应在以下时机考虑配置审计：\n\n* `CMS` 更改后不久\n* 在 IT 服务或基础设施更改之前之后\n* 在发布或安装之前，以确保环境符合预期\n*\
  \ 灾难恢复后和恢复正常后（此审计应包含在应急预案中）\n* 按计划间隔（自动化审计工具可以实现按定期间隔进行检查，例如每周）\n* 按随机间隔\n* 在检测到任何未经授权的\
  \ `CIs` 时\n\n## 服务运营日常执行的典型 SACM 活动\n\n与变更管理一样，许多日常服务资产和配置管理活动发生在服务运营阶段。这些活动包括服务运营人员在运营活动（如事件解决）期间识别任何\
  \ `CIs` 与 `CMS` 之间的差异，并将其报告给 `SACM`。在获得 `SACM` 授权的情况下，运营人员可以进行必要的修改以纠正这些差异。参与服务运营的人员可能还负责对到达的新设备进行标记，并将详情记录到\
  \ `CMS` 中。`SACM` 经常利用服务运营人员来审计和验证 `CIs` 的位置。例如，访问远程站点的桌面工程师可能会收到一份该地 `CMS` 中列出的所有\
  \ `CIs` 列表，并被要求确认列表是否正确。\n\n尽管更新 `CMS` 的责任仍属于服务资产和配置管理，但在服务资产和配置管理的指导下，运营人员可能会被要求更新关系，甚至在\
  \ `CMS` 中添加新的 `CIs` 或将 `CIs` 标记为“已处置”。运营人员还可能向 `SACM` 报告受事件影响的 `CI` 状态或状况的变化。\n\n\
  ## 触发因素、输入输出以及过程接口\n\n现在让我们来看服务资产和配置管理的触发因素、输入、输出和过程接口。首先看此过程的触发因素。\n\n### 触发因素\n\
  \n资产和配置信息的更新是由变更、发布和部署过程的更新触发的。其他触发因素包括采购单、收购和服务请求。\n\n### 输入\n\n现在让我们考虑此过程的输入和输出。服务资产和配置管理的输入包含服务设计包中的设计、计划和配置，以及来自变更管理的\
  \ `RFCs` 和工作单。其他输入是发现工具和审计收集的配置信息，以及组织的固定资产清单。\n\n### 输出\n\n输出包括新的和更新的配置记录、快照和基线、审计和状态报告以及纳入固定资产清单的更新资产信息。该过程输出关于配置项属性和信息的将被所有其他服务管理过程使用。\n\
  \n### 接口\n\n`SACM` 为 IT 服务管理提供配置数据和信息的单一虚拟库，因此它在某种程度上与其他所有过程和活动都有接口。可能最重要的接口是与变更管理的接口，用于影响评估，并确保捕获\
  \ `CIs` 的更改，这对于 `SACM` 有效运行至关重要。\n\n其他重要接口包括与\n\n* 财务管理的接口：记录关键财务信息，如成本、折旧方法、所有者、维护和维修成本\n\
  * IT 服务连续性管理的接口：提供关于受保护的关键资产的信息\n* 事件和问题管理的接口：为服务台提供关键诊断信息和数据，并帮助识别问题原因\n* 可用性管理：配置管理系统中显示\
  \ `CI` 关系的信息有助于检测单点故障\n\n它与资产管理业务过程也有紧密的关系。\n\n## 信息管理\n\n\n\n服务资产和配置管理主要是管理存储在\
  \ `CMS` 中的配置信息。配置管理系统是许多过程的关键资源，因此应该建立建立程序程序以确保其可用性和准确性。它应该定期进行备份，并且 `CMS` 的备份副本应安全地存储。`CMS`\
  \ 的当前副本应在远程位置保留一份，以备在启动 IT 服务连续性计划时使用。信息必须是准确且实时的，因为它们将作为做出决策的依据。当 `CIs` 的状态或位置频繁变化时，也应该频繁进行备份；可能只需记录发生变化的\
  \ `CIs` 即可，全量备份的频率可以降低。自动化发现工具将帮助跟踪这些变化。\n\n`CMS` 包含 `CIs` 的历史信息和存档版本；也可能包括已删除的\
  \ `CIs` 或 `CI` 版本。保留信息的数量取决于其对组织的持续实用性，必须权衡信息的价值与保留它的成本。由于监管和法律要求，某些信息记录必须保留。\n\n\
  `CMS` 还包括指向存储在 `SKMS` 中的知识和信息资产的指针。这些资产必须以与 `CMS` 相同的控制级别进行维护。\n\n## 服务资产和配置管理过程角色\n\
  \n正如我们之前讨论变更管理时所提到的，有许多角色需要在支持 `SACM` 过程中执行。这些角色并不是职位，而是对成功运行该过程可能需要的角色的指导，每个组织都必须根据自己的需求定义适当的职位和职位描述。第\
  \ 1 章探讨了适用于整个服务生命周期所有过程的通用角色。这些角色与 `SACM` 过程有关，但再次强调，一些特定的额外要求也适用。\n\n### SACM 过程所有者\n\
  \n`SACM` 过程所有者的职责通常包括履行 `SACM` 过程的通用过程所有者角色。过程所有者还将同意并记录其范围，包括定义指定哪些服务资产应被视为配置项目的策略。此人员还将与其他服务过渡过程所有者合作，以确保\
  \ `SACM`、变更管理、发布和部署管理以及知识管理在设计和实施上的集成方法。\n\n### SACM 过程经理\n\n`SACM` 过程经理的职责通常包括履行\
  \ `SACM` 过程的通用过程经理角色。过程经理负责所有 IT 固定资产的维护，并将协助过程所有者定义并同意哪些服务资产将**视为配置项目。\n\n过程经理将确保在需要支持其他服务管理过程的时间和地点配置数据是可用的，并确保为\
  \ `SACM` 工具和过程提供必要的支持。此人员还将协调 `SACM`与其他过渡过程之间的接口，特别是变更管理、发布和部署管理以及知识管理。\n\n### 配置分析师\n\
  \n如果组织规模不足以为每个角色配备人员，大多数组织会将配置分析师与 `SACM` 过程经理或配置分析师与配置管理员的角色合并。\n\n配置分析师的职责通常包括：\n\
  \n*   建议服务资产和配置管理的范围\n*   支持过程所有者和过程经理创建原则、过程和程序\n*   定义配置管理系统的结构，包括 `CI` 类型、命名规范以及必需和可选的属性和关系\n\
  *   培训员工 `SACM` 原则、过程和程序\n*   执行配置审计\n\n### 配置管理员\n\n配置管理员是在配置管理系统中注册的资产的保管员。他们的职责通常包括：\n\
  \n*   控制所有受支持 `CIs` 的接收、标识、存储和取回\n*   维护 `CIs` 的状态信息\n*   对不再需要的 `CIs` 进行存档\n* \
  \  协助审计活动\n*   识别、记录、存储和分发与服务资产配置管理有关的问题\n\n## KPIs 和 CSFs\n\n与所有过程一样，`SACM` 的性能应该被监控和报告，并采取行动进行改进。正如你所看到的，`SACM`\
  \ 为许多其他过程提供所需信息方面发挥着本质作用，因此实施此过程的成功或失败会对客户产生间接影响。如之前所述，每个 `CSF` 应该有少量 `KPIs` 来衡量其成功，每个组织可以选择自己的\
  \ `KPIs`。ITIL 服务过渡出版物列出了若干 `CSFs` 和相应的 `KPIs`。我们现在来看其中几个。\n\n示例 CSF：“在整个服务生命周期内核算、管理和保护\
  \ `CIs` 的完整性”\n\n此 CSF 可以使用以下 `KPIs` 进行：\n\n*   提高每个客户或业务部门利用资产的预算和收费准确性\n*   增加低利用资源和资产的重复利用和重新分配\n\
  *   减少未经授权的硬件软件、非标准和变体构建的使用，这些增加了复杂性、支持成本和对业务服务的风险\n*   减少配置审计期间报告的异常数量\n\n示例 CSF：“建立并维护准确且完整的配置管理系统\
  \ (`CMS`)”\n\n此 CSF 可以使用以下 `KPIs` 进行：\n\n*   减少由于服务资产配置管理不导致的停机和事故对业务的影响\n*   提高配置信息的质量和准确性\n\
  *   提高审计合规性\n*   缩短审计时间，因为高质量的配置信息易于获取\n*   减少因人员使用过时信息导致的错误\n\n### 挑战\n\n`SACM`\
  \ 的挑战包括说服技术支持人员在对 `CIs` 进行更改时遵循该过程。他们通常认为该过程是快速响应支持服务的障碍。为服务资产配置管理吸引资金并证明其合理可能是困难的，因为它对客户来说是不可见的。另一个挑战是定义要收集和管理的最佳数据水平——发现工具可能会收集大量不需要但需要被管理的数据。最后，由于其不可见性，管理层可能不会重视它为所有其他过程提供的关键支持，从而未能提供所需的承诺和支持，特别是在执行该过程时。\n\
  \n### 风险\n\n成功 `SACM` 的风险包括将其视为侧重于技术的，并且不意识到它为业务带来的间接价值。如果不执行过程（以及变更管理过程），信息的准确性可能会下降。审计中发现的错误不仅必须纠正，还要调查以识别对过程的执行力差，然后应由管理层解决。不准确的\
  \ `CMS` 将导致基于错误数据的错误决策。范围太宽将产生成本而收益甚微；范围太窄也将无法提供任何实际收益。\n\n## 总结\n\n本章探讨了涉及发布、控制和验证活动的两个过程：变更管理和服务资产和配置管理。对于每个过程，我们涵盖了：\n\
  \n*   目的\n*   目标\n*   范围\n\n\n\n* 价值\n* 策略、原则和基本概念\n* 过程活动、方法和技术\n* 触发器、输入、输出和接口\n\
  * 关键成功因素和关键性能指标\n* 信息管理\n* 角色\n* 挑战\n* 风险\n\n我们研究了这些过程对业务以及对 IT 服务提供商的重要性。\n\n##\
  \ 考试要点\n\n**理解变更管理的目的和目标。** 能够解释变更管理过程如何控制所有变更的生命周期，从而能够在对 IT 产生最小干扰的情况下实施有益的变更。\n\
  \n**解释不同类型的变更以及适用场景。** 了解并非所有变更都需要的同相同水平的监督，而且即使在这样做是理想的情况下，某些情况下也可能无法实现。能够定义并解释正常变更、标准变更和紧急变更之间的区别。\n\
  \n**能够解释何时需要变更提议。** 只有当变更在风险、成本或资源方面对业务产生重大影响时，才需要变更提议。\n\n**能够解释为什么变更顾问小组（CAB）的成员可能随变更而异。**\
  \ 理解 `CAB` 的作用，以及让相关的利益相关者批准每项变更的重要性。\n\n**理解每个过程的关键成功因素和关键性能指标。** 对每个过程的衡量是理解其是否成功或需要改进的重要部分。\n\
  \n**理解服务资产和配置管理（SACM）的目的。** 能够解释服务资产和配置管理过程目的是获取有关构成我们服务的资产的准确且可靠的信息。\n\n**理解服务资产和配置管理的目标。**\
  \ `SACM` 的目标是维护关于配置项和服务的准确信息。理解这一点对于使许多过程能够做出明智的决策至关重要。\n\n**理解服务资产和配置管理的范围。** `SACM`\
  \ 涵盖了构成我们服务的所有服务资产和配置项，以及这些配置项如何作为配置管理系统（`CMS`）的一部分被识别和记录。\n\n**能够列出不同类型的配置项（CI）。**\
  \ 这些包括硬件 `CIs`、内部外部 `CIs`、服务 `CIs` 以及服务生命周期 `CIs`。能够给出每种类型的示例。\n\n**理解属性的概念。** 能够为不同的\
  \ `CI` 类型建议常见的属性。\n\n**理解配置模型的使用。** 这些模型显示了 `CIs` 之间的依赖和关系，以提供服务、资产和基础设施的模型。\n\n\
  **理解配置管理系统（CMS）中存储的信息如何被其他过程使用。** 提供示例。\n\n**能够解释配置基线的概念和用途。** 配置基线用于捕获特定点的基础设施状态以便进行审查和一致，并用于趋势分析、比较和规划。\n\
  \n**理解基线和快照之间的区别。** 快照是某一时间点基础设施的捕获，但由于没有经过审查和一致，它可能包含错误和不准确之处。\n\n**能够解释定义介质库（DML）的作用和内容。**\
  \ `DML` 是一个专门用于管理软件介质的安全区域。它可能由用于运行环境的许可或授权软件主副本的物理和电子存储，以及相关的文档。\n\n**能够列出并解释 SACM\
  \ 的五项主要活动。** 这些是计划、识别、控制、状态记录以及验证和审计。\n\n## 复习题\n\n你可以在附录中找到复习题的答案。\n\n1. 以下哪些陈述*不是*\
