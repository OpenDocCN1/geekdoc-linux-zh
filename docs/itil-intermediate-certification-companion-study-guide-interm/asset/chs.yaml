  \n2. D. 选项 A 是错误的，因为 IT 财务是企业财务的子集，适用于它的规则和控制与其他任何部门相同。关于选项 B，内部服务提供者不一定直接对其服务收费。选项\
  \ C 是错误的，因为外部服务提供者通常不会向其客户共享显示其利润率的信息。\n\n3. C. 确保服务提供者不承诺其无法提供的服务是财务管理的目标之一。其他选项是\
  \ BRM（业务关系管理）的目标。\n\n4. C. 预算定义为预测和控制资金支出的活动。\n\n5. D. 业务关系管理关注的是战略而非运营。它还负责识别客户需求，决定服务提供者将交付哪些服务以满足这些需求，并确保服务提供者能够满足它们。\n\
  \n6. A. 业务关系管理将与业务合作为新服务建立业务案例。服务水平仅仅确保按要求提供服务，而不涉及是否是投资资金的最佳用途。\n\n7. A. 两个都是正确的陈述，且两个组合都是\
  \ BRM 使用的数据库。\n\n8. B. 如果服务提供者的投资回报率（ROI）低于业务案例中的预测，这可能是 CSI（持续服务改进）的触发因素，但不是 BRM\
  \ 的触发因素。\n\n9. B. 业务关系管理使用客户组合记录 IT 服务提供者的所有客户，并使用客户协议组合管理 IT 服务提供者与其客户之间的服务合同或协议（尽管该组合实际上由服务水平管理管理）。它不使用供应商合同管理信息系统或\
  \ CMS。\n\n10. D. 服务估值是理解服务成本相对于业务价值的能力，它是 FMITS（IT 财务管理系统）的重要输出，正如服务投资分析一样，FMITS\
  \ 提供信息使服务提供者能够确定服务投资的价值。FMITS 确保符合有关财务数据存储和归档的公司及法律标准。FMITS 不对资金做出任何协议，或对服务收费；这是\
  \ BRM 的责任，尽管可能会咨询 FMITS。\n\n## 第 20 章：服务范围与协议的技术考量\n\n1. C. 提前说明预算将阻碍后续谈判，这使得选项\
  \ C 是错误的陈述。其他三个陈述都是正确的。\n\n2. A. 每次升级都必须重复进行定制（但不需要重复配置）。配置不会影响供应商的支持义务（定制可能会影响）。开箱即用的工具可以使用标准培训。在选择工具之前应定义流程。工具应该遵循流程，而不是反之。\n\
  \n3. C. 解释：`M` 代表必须有的（must have）需求，`S` 代表应该有的（should have）需求，`C` 代表可以有的（could have）需求，`W`\
  \ 代表未来想要（would like in the future）的需求。\n\n4. C. 选项 C 中的步骤顺序是正确的。选项 A 建议先进行选择标准，但在不了解需求的情况下无法这样做。选项\
  \ B 将筛选放在步骤的最后，这意味着可能会对不合适的工具进行许多不必要的调查。选项 D 直接进入产品识别，而没有进行需求收集。\n\n5. B. 使用服务设计工具不会缩短测试时间。所有其他选项都显示了使用工具的实际收益。\n\
  \n6. A. 工具应该适应流程，而不是相反。如果工具无法适应某些流程领域，并且对流程进行了一些变动，只要这些变动不是重大的，是可以接受的。\n\n7. B.\
  \ 仅解决工具的能力及其如何与流程匹配是不够的，应该进行尽职调查以确保提供的支持达到所需标准。\n\n8. C. 列出的所有方面都应被考虑。排除其中任何一项都可能意味着工具不满足需求。\n\
  \n9. D. 这些成本都应该包含在内。如果实施了工具但没有进行足够的培训或配置，工具的能力将无法实现。如果没有良好的报告，工具持有的数据将无法获取，因此监控目标的达成情况、监控\
  \ KPI 等等将是无效的。如果不花时间设置网络门户，效率方面将无法实现重大突破，因为实施不当的门户不会被客户使用。未能包含这些成本解释了为什么许多许多运营倡议会失败；因为他们试图作为日常业务交付过多内容，而不是作为一个经过成本核算和资金支持的项目。\n\
