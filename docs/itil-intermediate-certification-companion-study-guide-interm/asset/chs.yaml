  \    4. 研究可用工具。\n\n# 第三部分\n\n## 发布、控制与验证\n\n# 第 11 章\n\n## 发布、控制与验证简介\n\n本章讨论了以下\
  \ ITIL 发布、控制与验证能力高级考试的目标：\n\n* ![images](img/00005.jpeg) 服务过渡的目的是、目标和范围\n* ![images](img/00005.jpeg)\
  \ 对业务的价值以及 RCV 过程如何与生命周期其他阶段的过程进行相互作用\n* ![images](img/00005.jpeg) 开发有效的服务过渡策略\n\
  * ![images](img/00005.jpeg) 定义服务过渡生命周期阶段\n* ![images](img/00005.jpeg) 对有效准备服务过渡重要的关键举措\n\
  * ![images](img/00005.jpeg) 计划和协调服务过渡活动的方法和最佳实践\n* ![images](img/00005.jpeg) 服务过渡如何为相关者提供过渡过程支持\n\
  \n![](img/00006.jpeg) 在本章中我们将研究与服务过渡生命周期阶段相关的概念，包括该阶段的目的、目标和范围。你需要在考试应用对这些概念的理解。我们还将考虑发布、控制和验证过程与其他生命周期阶段的关系，你应该能够在考试中分析这些关系并证明你对其性的理解。\n\
  \n我们将研究与服务过渡相关的策略的开发和定义，以及准备该生命周期阶段的关键举措。接下来，我们将探索服务过渡协调以及为相关者提供过程支持的最佳实践。\n\n##\
  \ 服务过渡概念\n\n服务过渡的主要目标是确保对实时运行环境的任何修改或过渡——影响新的、修改的、退役或已淘汰的服务——符合业务、客户和用户的约预期。\n\n\
  ### 目的\n\n服务过渡的目的是过渡设计用于交付策略的新、修改的、退役或已淘汰的服务。过渡后，服务必须满足在早期生命周期阶段确立的业务预期。\n\n###\
  \ 目标\n\n服务过渡的目标包括确保服务的变更尽可能无缝地发生。服务发布被部署到受支持的实时环境中，在那里它们可以交付服务策略中确定的业务价值。新服务或更改的服务应该过渡到实时环境中，而不会干扰其他服务，因此不会干扰业务。过渡必须在避免对实时服务的风险与确保业务可以在不产生不延迟或成本的情况下获得所需的新或更改的服务之间取得平衡。因此，有效的风险管理也是该生命周期阶段的一个关键目标。\n\
  \n服务过渡的一个关键方面是沟通。业务必须知道对新服务或更改服务的性能和使用可以预期什么。如果业务预期没有得到管理，它可能会判断过渡是失败的，因为它没有交付其预期的收益或功能，而这些功能从未是设计的一部分。\n\
  \n尽管如此，过渡必须确保确保预期的业务价值得到交付。一个常见的错误是过分关注硬件或软件的成功安装，而未能确保业务从从中获得预期的价值。\n\n每个过渡的一个不可或缺的部分是伴随的知识转移。服务过渡的主要目标之一是提供关于服务和服务资产的高质量知识和信息。\n\
  \n服务过渡成功的需求如下：\n\n* 资源的仔细计划\n* 风险评估与缓解\n* 对服务资产的控制以确保其完整性\n* 高效的可重复机制，用于构建、测试和发布服务，以增加成功机会同时减少过渡的成本和风险\n\
  \n服务过渡必须理解服务运行的约束条件，并确保过渡的服务能够在这些约束下成功运行、管理和支持。\n\n### 范围\n\nITIL 服务过渡物提供的指南侧重于提高组织将新和更改的服务转移到受支持环境的能力。它的范围比变更管理的范围广；它涵盖了发布的计划、构建、测试，然后评估和部署。服务过渡的范围还包括在使用寿命结束时退役服务，以及在服务提供商之间转移服务，例如在外包或内部化期间，或者当服务从一个外包服务提供商移动到另一个时。服务过渡的核心是确保服务策略中在服务设计中开发的需求在服务运营中得到有效实现，同时控制失败和随后的中断风险。一个设计良好的服务如果过渡不当，在业务眼中可能会受到损害。如果因为计划或测试不足而未能可靠地交付收益，它可能会被业务拒绝。\n\
  \n服务过渡为管理服务和服务管理过程的变更提供指导，确保组织免受变更带来的意外后果的影响，同时能够实现交付业务收益的成功变更。这些变更可能是新服务或对现有服务的改进，例如扩展、减少、更换供应商、用户群或供应商的获取或处置，或需求的变化。\n\
  \n服务过渡还涵盖了管理实时服务的结束，包括设备拆除、终止合同或其他服务组件等。\n\n服务过渡的范围还包括管理对服务提供者的人员、流程、产品或合作伙伴的变更引入。\n\
  \n过渡包括管理向和从其他服务提供者转移服务：\n\n* 通过外包工作或供应商之间的转移转移给新供应商。有时这种转移是从供应商转到内部提供。这被称为内部化（insourcing）。\n\
  * 针对服务的某些方面转到合作伙伴关系或共同外包安排；这可能涉及多个供应商，有时被称为多源供应（multisourcing）。\n\n尽管服务本身可能没有变化，但此类转移并非风险，需要仔细计划以确保转移对业务来说是无缝的且没有遗漏任何内容。\n\
  \n其他过渡可能是与其他组织建立合资企业，或通过减少人员（裁员）或增加人员（扩员）来重组组织。这两种都被被称为规模优化（rightsizing），最佳解决方案在组织之间会有不同。最后，工作可能会转移到劳动力成本较低的地方。这被称为离岸外包（offshoring）。该组织可能涉及合并或收购。\n\
  \n\n\n\n当然，在任何组织中，这些转换中的几个都可能结合在一起。它们都存在风险和机遇，因此必须进行仔细的计划和执行。\n\n以下两个列表包含了服务过渡流程。根据这些活动在服务生命周期服务过渡阶段发生的程度，可以将它们分为两组。第一组是由在服务过渡阶段至关重要，但影响并支持服务生命周期所有阶段的流程组成的：\n\
  \n*   变更管理\n*   服务资产与配置管理\n*   知识管理\n\n第二组是由重点与服务过渡相关的流程组成的：\n\n*   过渡规划与支持\n* \
  \  发布与部署管理\n*   服务测试与验证\n*   变更评估\n\n我们将在本书的后续部分介绍其中一些流程（`transition planning and\
  \ support` 除外）。请记住，几乎所有的过渡流程在生命周期的其他阶段都是活跃的，而且过渡也会受到生命周期其他阶段流程的影响。\n\n所有的生命周期流程都应该紧密联系在一起，在设计服务或改进或实施流程时，定义流程之间的接口是非常关重要的。\n\
  \n图 11.1 显示了 ITIL 服务过渡出版物描述的所有流程。\n\n![图像显示服务过渡范围的面板，例如持续服务改进、变更管理、服务资产管理、过渡规划与支持、人员管理、变更评估、服务验证和知识管理。](img/00049.jpeg)\n\
