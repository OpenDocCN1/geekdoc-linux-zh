  \ 3, 4\n    3. 以上\n    4. 仅 1 和 4\n\n8. 关于变更管理的以下陈述中哪个*不是*正确的？\n    1. 所有变更都必须由\
  \ `CAB` 或 `ECAB` \n    2. 应该有一个单一的 `CAB` 来审查所有变更\n    3. 每个变更类别都有其定义的变更权限\n    4.\
  \ 复杂的变更可能在生命周期中的多个点需要授权\n\n9. 根据 ITIL，以下哪项不是有效的变更类型？\n    1. 紧急\n    2. 迫切\n   \
  \ 3. 正常\n    4. 标准\n\n10. 以下哪些陈述*不是*变更过程为业务交付价值的示例？\n    1. 它在保护现有服务的同时实现了有益的变更\n\
