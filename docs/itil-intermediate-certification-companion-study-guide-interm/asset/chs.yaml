  \n\n\n\n\n# 本章讨论了以下 ITIL 发布、控制与验证能力中间级考试目标：\n\n* ![images](img/00005.jpeg) 服务验证与测试以及变更评估将从以下方面进行讨论：\n\
  \n    * 目的\n    * 目标\n    * 范围\n    * 价值\n    * 策略\n    * 原则与基本概念\n    * 测试模型与测试视角\
  \ (SVT)\n    * 过程活动、方法和技术\n    * 评估概念与报告 (CE)\n    * 触发因素、输入、输出和接口\n    * 测试数据和模型\
  \ (SVT)\n    * 过程角色与职责\n    * 信息管理\n    * 关键成功因素和关键绩效指标\n    * 挑战\n    * 风险\n\n\
  ![](img/00006.jpeg) 教学纲涵盖了每个过程的日常运行，以及过程活动、方法、技术和信息管理的细节。服务过渡过程的管理和监督方面将在服务生命周期课程中涵盖。\n\
  \n本章涵盖了每个过程的日常运行，以及过程活动、方法、技术和信息管理的细节。服务过渡过程的管理和监督方面将在 *ITIL 中间证书辅助学习指南* (Sybex,\
  \ 2016) 中涵盖。\n\n在服务验证与测试中，我们回顾了质量保证的概念，确保新或更改的服务将满足业务需求。\n\n变更评估关注业务就新或更改的服务所做出的选择。它允许组织决定新或更改的服务是否符合设计阶段约定的验收标准。\n\
  \n## 服务验证与测试\n\n服务验证与测试背后的核心概念是质量保证——确保服务设计和发布将交付符合其用途和需求的新或更改的服务或服务方案。\n\n### 目的\n\
  \n服务验证与测试过程目的是确保新或更改的 IT 服务符合其设计规范并满足业务需求。\n\n### 目标\n服务验证与测试的目标是确保发布在预计限制内交付预期的结果和价值，通过验证服务是否“适用目的”且“适用使用”来提供质量保证。另一个目标是确认需求被正确定义，在服务生命周期早期纠正任何错误或偏差。该过程旨在为发布满足需求提供客观证据。最终目标是在整个服务过渡期间识别、评估并处理问题、错误和风险。\n\
  \n### 范围\n服务提供者承诺交付服务协议中定义的所需的保证级别。在整个服务生命周期中，可以应用服务验证与测试以确保所需的能力正在交付并满足了业务需求。\n\
  \n服务验证与测试的测试活动通过在发布、构建和部署活动期间确保适当的测试，直接支持发布和部署。它确保服务模型在通过服务目录授权为运行之前符合其用途和需求。测试的输出将供变更评估过程使用，以判断服务是否以可接受的风险状况交付服务性能。\n\
  \n### 对业务的价值\n服务测试和验证为业务和客户带来的关键价值在于，它提供了一种定程度的信心，确保新或更改的服务将交付所需的价值和结果，并对其提供了对风险的理解。\n\
  \n成功的测试提供的是可衡量的信心而非保证。服务失败可能会损害服务提供者的业务和客户的资产，并导致声誉损失、金钱损失、时间损失、伤害和死亡等后果。\n\n###\
  \ 策略、原则与基本概念\n现在我们来看服务验证与测试的策略、原则及其背后的基本概念。该过程的策略反映了战略和设计需求。以下列表包含了典型的策略声明：\n\n\
  * 所有测试必须由未参与该服务其他设计或开发活动的人员设计并执行。\n* 在开始任何测试之前，必须在服务设计包记录测试通过/失败标准。\n* 建立测试测量和监控系统，以提高服务验证与测试的效率和有效性。\n\
  * 将测试集成到项目生命周期中，帮助尽快检测并消除缺陷。\n* 测试库和重用策略。由于许多测试可以重复，保留一个可以重用的测试脚本、测试模型、测试用例和测试数据的库非常有价值。\n\
  * 与客户、利益相关者、用户和服务团队互动以增强测试技能。\n* 尽可能实现测试自动化。\n\n服务验证与测试受服务管理其他领域策略的影响。驱动和支持服务验证与测试的策略包括服务质量策略、风险策略、安全策略以及服务过渡、发布管理和变更管理策略。\n\
  \n服务质量将由高层根据客户和利益相关者的输入定义。这将驱动服务策略中列出的基本视角的采用和衡量——卓越水平、性价比、符合规范以及满足或超过预期。组织将帮助对这些进行优先级排序，这将影响采取的服务验证与测试的方法。\n\
  \n风险策略与测试有直接联系。测试必须根据组织的风险偏好来衡量风险。测试应包含安全策略中的任何风险要求。\n\n服务过渡策略为整个服务生命周期阶段设定了工作规范。这将包括管理各种规模过渡的方法，并定义生命周期阶段期间所需的控制级别。它将涵盖治理、框架的使用、重用方法、业务对齐与关系管理、知识传递、管理偏差修正、早期支持和资源管理等领域。\n\
  \n发布策略将定义发布的频率和类型，反过来也会影响测试方法。发布越频繁，越可能实现自动化并寻找可用的测试模型。\n\n变更窗口的使用也会影响测试，因此变更管理策略在定义测试方法方面至关重要。\n\
  \n### 测试模型与测试视角\n\n#### 测试模型\n\n\n\n\n\n测试模型应包含测试计划、待测试内容，以及用于服务中每个元素的测试脚本。使测试模型具有可重用和可重复性，可以确保测试的有效性和高效。这将支持追溯到设计标准或初始需求，并支持对测试执行、评估和报告进行审计。表\
  \ 13.1 展示了测试模型的一些示例。\n\n| 测试模型 | 目标/目标交付物 | 基于的测试条件 |\n| --- | --- | --- |\n| 服务合同测试模型\
  \ | 验证客户是否可以使用该服务交付价值主张 | 合同需求。符合适用性标准、符合使用之性标准 |\n| 服务需求测试模型 | 验证服务提供者能够/已经交付客户所需和预期的服务\
  \ | 服务需求和服务验收标准 |\n| 服务水平测试模型 | 确保服务提供者能够交付服务水平需求，并且在生产环境中能够满足服务水平需求，例如：测试响应和修复时间、可用性、产品交付时间、支持服务等\
  \ | 服务水平需求、SLA、OLA |\n| 服务测试模型 | 确保服务提供者能够根据设计的服务模型交付、运行和管理新或变更的服务，该模型包括资源模型、成本模型、集成流程模型、容量和性能模型等\
  \ | 服务模型 |\n| 运营测试模型 | 确保服务运营功能能够运行并支持新或变更的服务/服务组件，包括服务台、IT 运营、应用管理、技术管理。它包括负责 IT\
  \ 服务支持和运营的本地 IT 支持人员和业务代表。不同的发布/测试阶段可能会有不同的模型，例如技术基础设施、应用程序等 | 服务模型、服务运营标准、流程和计划\
  \ |\n| 发布部署测试模型 | 验证部署团队、工具和程序能够在预计的时间范围内内将发布包部署到目标部署组或环境中。确保发布包包含部署所需的所有服务组件，例如通过执行配置审计\
  \ | 发布和部署的设计与计划 |\n| 部署安装测试模型 | 测试部署团队、工具和程序能够在预计的时间范围内内将发布包安装到目标环境中 | 发布和部署的设计与计划\
  \ |\n| 部署验证测试模型 | 测试部署是否已成功完成，以及所有服务资产和配置是否按计划到位并符合其质量标准 | 对实际服务资产和配置的测试与审计 |\n\n\
