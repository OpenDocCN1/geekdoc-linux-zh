  \ 4\n    4. 1, 3, 4, 5\n\n3. 以下哪些陈述最能描述配置记录？\n    1. 任何有助于交付服务的资源或能力\n    2. 需要交付服务的服务资产\n\
  \    3. 存储在配置管理数据库中的属性和关系\n    4. 构成服务的 CI 分类\n\n4. 关于 `CMS` 业务价值的以下陈述中哪个*不是*正确的？\n\
  \    1. 通过识别可以重用的项目来避免设备购买\n    2. 确保服务台人员拥有解决故障所需的知识\n    3. 避免组织因无法证明法律要求而被罚\n\
