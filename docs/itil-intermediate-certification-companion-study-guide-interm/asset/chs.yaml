  \n\n\n\n*   ![images](img/00005.jpeg) SOA 流程在服务生命周期中的上下文，从服务设计阶段（服务目录管理、服务水平管理、供应商管理）\n\
  *   ![images](img/00005.jpeg) 设计协调流程的目的、目标、范围以及对业务的价值\n*   ![images](img/00005.jpeg)\
  \ 成功的服务如何取决于客户对效用和保证的感知，以及与 SOA 流程的关联性\n*   ![images](img/00005.jpeg) 理解 SOA 流程是理解和识别客户需求的起点\n\
