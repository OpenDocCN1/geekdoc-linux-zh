  \ IT 部门。\n    4. ROI 可能是客观衡量，也可以是主观衡量。\n\n# 第 17 章\n\n服务组合包管理与服务目录管理\n\n本章讨论了以下\
  \ ITIL 服务范围和协议考试目标：\n\n* ![images](img/00005.jpeg) 服务组合包管理与服务目录管理\n* ![images](img/00005.jpeg)\
  \ 每个过程将从以下方面进行讨论：\n    * 目的\n    * 目标\n    * 范围\n    * 价值\n    * 策略\n    * 原理基本概念\n\
  \    * 过程活动、方法和技术\n    * 触发器、输入、输出和接口\n    * 信息管理\n    * 角色与职责\n    * 关键成功因素和关键性能指标\n\
  \    * 挑战\n    * 风险\n\n![](img/00006.jpeg) 本章涵盖每个过程的日常运营；其活动、方法和技术的细节；及其信息管理。服务组合包管理确保服务提供者交付适当的服务组合以满足客户的需求。服务目录管理负责服务目录的编制，用于向客户展示正在运行的服务以及即将上线的服务。\n\
  \n## 理解服务组合包管理\n\n以下章节将介绍服务组合包管理过程，该过程为跨生命周期的服务管理提供了重要的信息来源。\n\n### 目的\n\n该过程的目的是确保服务提供者交付适当的服务组合，以满足客户的需求。该过程使我们能够跟踪有关服务的若干项重要信息，已已投入投资以及与其他服务的交互。\n\
  \n服务组合包中捕获的信息将提供的服务与其支持的业务结果联系起来。这确保了整个生命周期的活动保持对齐，以确保向客户交付价值。\n\n### 目标\n\n服务组合包管理的目标如下：\n\
  \n* 提供一种过程，允许组织管理其整体服务提供。通过该过程，服务提供者开发机制来调查并决定向客户提供哪些服务。这一决策基于对可能产生的潜在回报和可接受风险水平的分析。\n\
  * 维护服务提供者提供的定义的管理服务组合。每项服务都应被识别，以及其所支持的业务需求和结果。\n* 提供信息源，允许组织理解并评估所提供的 IT 服务如何帮助组织实现预期结果。它也将是一个跟踪\
  \ IT 如何响应组织内部或外部环境变化的机制。\n* 控制提供哪些服务、向谁提供、投入什么水平的投资以及在什么条件下提供。\n* 跟踪组织在整个生命周期内对\
  \ IT 服务的支出，允许对策略进行定期审查，以确保为所选策略方法投入了适当投资。\n* 提供信息以支持关于服务可行性及其何时应退役的决策。\n\n### 范围\n\
  \n服务组合包管理的范围很广泛，因为它涵盖了服务提供者交付的所有服务，以及其计划交付的服务和已从运行中退役的服务。\n\n由于服务组合包管理过程的主要关注点是确定提供的服务是否正在交付价值，因此该过程应该涵盖跟踪服务投资和支出的能力。该过程的结果可以根据客户所需的价值与预期的业务结果进行比较。\n\
  \n内部和外部服务提供商在将服务与业务结果连接方面可能采取不同的方法。对于内部服务提供商，有必要与组织中的业务部门紧密合作，将结果与投资进行比较。外部服务提供者更有可能将此类信息作为定义与业务关系的协议或合同的一部分进行记录。他们提供的服务也可能与产生收入或支持收入直接相关。\n\
  \n服务组合包管理应负责评估服务在整个生命周期内的价值。将现有服务与计划中的服务或其替代退役服务所提供的益处进行比较也是重要的。通过这种方式，我们可以确定提供的服务符合所需的业务需求。\n\
  \n#### 服务组合包\n\n我们现在将审查服务组合包本身，它是过程的输出。图 17.1 展示了服务组合包的组件：服务流水线、服务目录和退役服务。\n\n![图像显示服务知识管理系统，包含服务组合包组件如服务流水线、服务目录和退役服务。服务生命周期如服务状态、需求、定义等列在组合包中](img/00081.jpeg)\n\
  \n图 17.1 服务组合包及其内容\n\nCopyright © AXELOS Limited 2010\\. 版权所有。材料根据 AXELOS 的许可复制。\n\
  \n\n\n\n\n服务组合是服务提供者管理的完整服务集。这包括跨越内部、外部或第三方提供者的合同和财务承诺；新服务开发活动；以及改进倡议。所有服务都应该包含在内，无论是可见的、面向客户的服务（如核心服务或增强服务），还是支持它们的支撑服务。\n\
  \n服务组合还涵盖了目前仅处于概念阶段的服务，即在没有预算、资源或能力限制的情况下将会开发的的服务。服务组合显示了整个服务生命周期中所有使用资源的分配情况。生命周期的每个阶段都会对可用资源和能力提出需求，而服务组合允许我们看到这些分配情况，并根据业务结果的重要性解决任何潜在的冲突。\n\
  \n任何新项目或开发都应该有一个已批准的财务计划和分配的预算，以证明成本回收或投资回报，这将在记录在服务组合中。通过确保我们在整个流水线和和服务目录中拥有正确的服务组合，我们可以确保为整个服务生命周期中的所有\
  \ IT 服务提供者活动获得正确的资金。\n\n正如你之后将看到的，服务目录是服务组合中唯一面向客户的部分，它所包含的信息可以作为面向客户的报告、演示文稿和业务案例的一部分。记录在服务目录中的实时运营服务是唯一能够回收成本或获得利润的服务。\n\
  \n### 价值\n\n服务组合管理帮助业务决定投资何处。服务的实施不仅是因为它们是一个好主意或因为它们是行业标准，而是因为有一个良好的业务案例。将预期结果与构建和交付服务所需的投资进行比较。这意味着客户理解将交付什么以及在什么条件下交付；他们随后可以决定该服务是一项好投资还是坏投资。\n\
  \n服务提供者通过服务组合管理的一部分做出的决策，可以帮助其客户实现业务战略。\n\n## 策略、原则和基本概念\n\n服务组合代表了服务提供者跨所有客户和市场空间所做的承诺和投资。它显示了任何合同承诺以及正在开发的新服务。它还包括由持续服务改进\
  \ (`CSI`) 发起的当前服务改进计划。某些服务并非由服务提供者直接提供，而是从供应商处购买的。服务提供者对这些第三方服务负责，因为它们构成了客户服务提供的不可或缺的一部分。此类服务的示例是广域网服务。因此，重要重要的是，组合包含了由服务提供者管理的完整服务集。\n\
  \n服务组合管理确保服务提供者理解其提供的所有服务、在这些服务上所做的投资，以及每个服务的目标和所需回报。在制定服务管理战术计划之前，这些知识是必要的。该过程在策略生成中起着作用，确保约定的策略在每个阶段都得到适当执行。这防止了常见的错误，例如在优化流程之前选择新工具。它还确保了实际执行与意图相符。服务组合管理方法还帮助经理根据业务优先级分配资源。\n\
  \n此外，服务组合识别了组织在拥有无限资源、能力和资金的情况下将提供的服务。这有助于识别哪些可以做，哪些不能做。提供服务的每项决策都使用了本可以用于提供其他服务的资源，因此选择提供什么至关重要。\n\
  \n### 服务流水线\n\n服务流水线列出了所有正在评估的机会。流水线中的服务尚未向客户开放。服务在以下几种情况下进入流水线：\n\n* 作为客户请求的结果\n\
  * 当服务提供者识别出未充分服务的业务结果时\n* 由于新技术可用带来的结果\n* 当 `CSI` 过程识别出当前服务的缺口时\n\n服务流水线确保所有这些机会都得到适当评估，以便根据投资判断潜在回报。\n\
  \n### 服务目录\n\n服务目录是一个关于向客户可用服务的信息的数据库——这些服务可能已经上线或可供部署。服务组合的这部分发布给客户，它包含了有关交付物、价格、联系点以及订购和请求流程的信息。在将服务添加到目录之前，必须进行尽职调查，以便服务提供者了解如何以预期的成本成功交付服务。服务目录还包含了有关标准服务请求的细节，使用户可以通过适当的渠道请求这些服务。\n\
  \n服务目录还为服务管理决策提供信息。它识别了服务资产、服务与业务结果之间的联系以及服务组合中的任何潜在缺口。\n\n\n\n\n识别出表现良好且受欢迎的服务。可能会为这些服务分配额外资源，以确保它们继续按照要求运行，并能够满足增长的需求。\n\
  \n表现尚可但在效率或功能方面有改进空间的服务被视为可行服务。引入新特性、解决保修或效用问题、提高其与需求的匹配程度以及制定新的定价策略，都是可能用于使服务更受青的方法。而不受欢迎或持续表现糟糕的服务可能会标记为退役。\n\
  \n服务目录的一个子集可能是第三方或外包服务。这些服务在客户和市场领域扩展了服务目录的范围。图 17.3 显示了如何使用这些第三方服务作为临时方案，以解决未充分或未满足的需求，直到服务流水中的项目分阶段投入运行。它们也可以被用于替换正在从服务目录中退役的服务。\n\
  \n![图像显示了服务目录和需求管理，包含服务所有者和业务关系经理的表格。这两个类别都有空区块（用于利用率充分、利用率不足和未使用的资产等类别），并连接到服务目录中的区块。](img/00083.jpeg)\n\
  \n图 17.3 服务目录和需求管理\n\nCopyright © AXELOS Limited 2010. 保留所有权利。根据 AXELOS 的许可复制。\n\
  \n服务组合与服务目录的典型内容和目的的比较如图图 17.4 所示。\n\n![图像显示了业务影响（机会、价值主张、优先级、风险等）与服务目录（服务、策略、最低要求、依赖关系等）的比较。](img/00084.jpeg)\n\
  \n图 17.4 服务组合和服务服务目录\n\nCopyright © AXELOS Limited 2010. 保留所有权利。根据 AXELOS 的许可复制。\n\
  \n### 退役服务\n\n服务组合中的某些服务正在逐步淘汰或退役。每个组织都应该定期审查服务，以决定何时将服务从目录移到退役状态。可能会做出停止向新客户提供服务的决定以逐步淘汰该服务的供应，尽管该服务仍在向现有客户交付。其他组织则会等到该服务没有用户后，再将服务移出目录。\n\
  \n退役服务在服务组合中仍保持维护是出于几个原因：\n\n*   如果替代服务未能满足所有要求，则可能需要回退到先前的服务。\n*   在定义新服务时，服务组合管理可能会发现某些功能可以退役服务中提供。这可能导致该服务重新恢复到服务目录。\n\
  *   维护归档数据的监管要求可能意味着访问该数据所需的服务需要保持可用。在这种情况下，信息被导出到只读数据库以供未来之用。\n\n服务的退役应通过服务过渡进行管理，以确保所有客户承诺得到履行，并且服务资产从合同中释放。\n\
  \n### 其他信息源：配置管理系统\n\n配置管理系统（`CMS`）是一系列用于管理 IT 服务提供商配置数据的工具和数据库。`CMS` 由配置管理部门维护/维护，并被所有\
  \ IT 服务管理过程使用。它还包含有关事件、问题、已知错误、变更和发布的信息，并可能包含有关员工、供应商、地点、业务单元、客户和用户的数据。`CMS` 包含了用于收集、存储、管理、更新和展示所有配置项及其关系数据的工具。在\
  \ ITIL 服务过渡出版物中更详细地介绍了 `CMS`。\n\n配置管理数据库（`CMDB`）是一个用于在整个生命周期内存储配置记录的数据库。`CMS` 可能包含一个或多个\
  \ `CMDB`，每个数据库存储配置项（`CIs`）的属性及其与其他 `CI` 之间的关系。\n\n在服务组合管理的背景下，`CMS` 记录并控制有关每个服务、组成服务的\
  \ `CI`、支持服务的人和工具以及它们之间关系的数据。服务组合是服务知识管理系统（`SKMS`）的一部分，并基于来自 `CMS` 源的数据。\n\n### 其他信息源：应用、客户、客户协议和项目组合\n\
  \n接下来我们涵盖作为服务组合管理部分的其他信息库。它们是应用组合、客户组合、客户协议组合和项目组合：\n\n*   应用组合是一个用于管理应用程序整个生命周期的数据库或结构化文档。它包含所有应用程序的关键属性。记住：应用程序和服务不是一回事。一个像在线商店这样的单一服务可能会使用多个应用程序，或者一个应用程序可能会提供多个服务。因此，将应用组合和服务组合作为两个不同的项目分开是非常重要的。\n\
  \n    应用组合有助于防止重复——当提出新请求时，可以检查现有应用程序以查看它们是否可以满足需求或可以进行修改以满足需求。它在跟踪谁负责特定应用程序时也有帮助。它识别了哪些客户哪些和服务使用每个应用程序。它在服务组合管理中起着重要作用，原因有：第一，它将战略服务需求和请求连接到应用开发中的特定应用程序或项目。其次，它允许组织跟踪服务生命周期各个阶段的投资。第三，它允许应用开发和\
  \ IT 运营协调工作，并促进整个服务周期的深度合作。\n\n    应用组合中的一切都应该经过服务组合管理过程，因此应用组合中的每个条目都应该与服务组合中的一个或多个条目相关。\n\
  \n*   客户组合是由业务关系管理过程维护的数据库或结构化文档；我们在第 19 章“IT 业务关系管理与财务管理”中考虑该过程时将详细查看。它是业务关系经理对从\
  \ IT 服务提供商处接收服务的客户视图。服务组合管理利用客户组合来捕捉业务结果、客户和服务之间的关系。服务组合显示了这些链接，并通过业务关系管理与客户进行验证。\n\
  \n\n\n\n- 客户协议集是另一个数据库或结构化文档。它用于管理 IT 服务提供商与其客户之间的服务合同或协议。交付给客户的每项 IT 服务都应该有一份列在客户协议集中的合同或其他协议。在没有使用\
  \ SLA（服务水平协议）的情况下，也应对客户对所服务的期望进行正式记录。客户应当同意所记录的内容。\n    - 外部服务提供商使用客户协议集来跟踪法律合同要求。客户协议集将这些要求与服务组合集和客户组合关联起来。\n\
  \    - 内部服务提供商将使用客户协议集来跟踪 SLA 和不正式的协议。他们随后可以确保能够满足客户期望。通过记录客户期望，可以在没有合理（且有资金支持）需求的情况下，防止需求的发生任何“蠕变（creep）”。\n\
  \n- 项目组合集是一个数据库或结构化文档，用于管理已立项的项目。项目章程是一份授权项目并说明其范围、条款和参考的文档。项目组合集用于协调项目，确保在规定的时间和、成本和规格内实现目标。它能防止重复和范围蔓延，并确保每个项目都有可用资源。项目组合集可以用于管理单个项目以及大型多项目计划。项目组合集通常由大型组织中的项目管理办公室（PMO）维护。大多数组织会为\
  \ IT 项目使用单独的项目组合集，但有些组织会将业务和 IT 项目包含在内。项目组合集帮助服务组合管理跟踪这些项目的状态，将支出与预期进行比较，并确保服务正按预期构建和设计。当多个不同项目涉及单一服务时，项目组合集将协调并统一活动。\n\
  \n## 服务模型\n\n服务组合管理利用服务模型来分析新服务或现有服务变更的影响。服务组合管理将确保流水线中的每项服务都定义服务模型。服务模型在评估哪些现有服务资产可以支持新服务方面也很有价值，从而通过“一次创建，多次使用”的原则提高效率。\n\
  \n服务组合在资产的分配、部署和管理中起着重要作用。正如你之前看到的，成功的策略执行取决于将服务资产与客户结果进行有效对齐。服务组合和配置管理系统记录了服务资产、服务与业务结果之间的关系；服务组合中的每项服务在配置管理系统中表示为一组服务资产、性能需求、标准操作程序、功能和\
  \ SLA。\n\n## 整个服务生命周期的服务组合管理\n\n在这里我们将简要查看服务组合管理在服务生命周期其余部分所起的角色。虽然服务组合管理是服务策略中的一个过程，但它在生命周期的每个阶段都起着重要作用。我们首先看它在服务设计中的角色：\n\
  \n- 在服务设计生命周期阶段，服务组合管理确保设计工作根据业务需求进行优先级排序，并明确业务将如何衡量服务。它确保每项服务都与约定的业务结果清晰地关联，并记录所使用的服务资产和对服务要求的性能水平。与需求管理信息相结合，服务组合管理可以清晰地描绘何时需要服务以及预期的需求水平。服务组合管理帮助设计团队关注目标、结果和优先事项。它还与\
  \ PMO 或项目经理协作，确保服务按时、按规格和预算完成构建。\n- 服务过渡构建并测试将要放入服务目录中的服务。变更管理用于授权将服务移入服务目录。这种授权确保了最终产品已就绪并可以支持，确保其在技术上是行的、在财务上是可行的，并且具备了足够的运营能力。在将项目添加到目录之前，必须评估对客户做出的承诺的影响，并留出足够的资源和能力来提供服务。如果无法提供资源，该服务可能会被阻止上线。\n\
  - 服务运营交付服务组合中服务目录部分的服务。服务组合管理让运营部门理解服务以及如何及为何需要交付服务。这是定义标准操作程序、事件管理、事件处理优先级排序和升级升级程序的重要输入。\n\
  - 持续服务改进（CSI）评估组合中的服务是否达到了既定目标，如果没有达到，则识别可以纠正状况的方法。CSI 还会评估业务案例和目标，以确保它们仍然有效，并确保服务组合管理继续适当对服务进行优先级排序。\n\
  \n## 过程活动、方法和技术\n\n服务组合管理由四个主要活动阶段组成。我们将逐一检查：\n\n- 第一阶段是定义（Define）阶段。该阶段侧重于记录和理解现有服务和新服务。每项服务都必须有一个记录在案的业务案例。每个服务的数据（例如需要哪些服务资产以及在哪里进行投资）需要经过验证。\n\
  - 第二阶段是分析（Analyze）阶段。对组合中服务的分析将指示服务是否能够优化价值，以及如何对供需进行优先级排序和平衡。\n- 第三阶段是批准（Approve）阶段。每项服务都需要经过批准，并且必须授权投资水平，以确保有足够的资源交付预期的服务水平。\n\
  - 最后阶段是立项（Charter）阶段。章程是一份授权项目并说明其范围、条款和参考的文档。服务并非根据组织内任何人的请求就构建。它们必须经过正式立项，并且需要向利益者提供有关决策、资源分配和实际投资的信息。\n\
  \n在详细查看过程之前，记住我们如何定义服务组合本身很重要。我们从收集所有现有服务以及每个提议服务的信息开始。然而，组合不是静态的，因此必须定期对数据进行刷新和验证。频率取决于组合本身：它包含的是变化较少的稳定遗留系统，还是一个快速变化的领域？外部事件可能会触发对组合的重新评估；例如，合并或收购另一公司将需要彻底的重新评估以发现可能存在的重复。\n\
  \n\n\n\n\n新增或已变更的服务提案可能源于多个来源，例如计划的变更或识别出的服务改进计划。这些提案需要经过正式的评估和批准。服务组合管理维护着所有提交的计划、请求和提交案的中央记录。在某些组织中，它们被简单地称为请求，但它们与提交用于请求履行的标准请求并不相同，这可能会导致误解。服务组合管理的输入可能来自以下流程：\n\
  \n*   策略管理是服务组合管理的主要输入。它呈现了战略计划，概述了针对业务机会和成果的倡议，以及实现这些目标所需的服务。服务组合管理对这些计划进行技术和财务可行性及`ROI`评估。\n\
  *   业务关系管理接收来自客户的请求。这些请求可能通过`变更管理`、`请求履行`或`事件管理`进行处理，但某些需要提交给服务组合管理。它们包括对新服务的请求，或对现有服务增加功能或性能改进的请求。\n\
  *   `CSI` 为服务组合管理启动三类型的输入。这些输入可能包括对现有服务水平的可能改进。每项都将根据投资和预期回报进行评估。`CSI` 还可能识别当前服务组合中的新机会或差距，或者成本改进、风险缓解等方面的机会，这些会影响一个或多个现有服务，甚至影响服务提供者的整个运营。注意，`CSI`\
  \ 识别出的任何需要更改组织策略的机会将提交给策略管理。\n*   某些服务管理流程涉及对服务的变更管理，或对可以向客户提供的保证（warranty）和实用性（utility）选项进行建模。其中许多会对投资产生影响，因此服务组合管理应在启动这些建议进行评估。\n\
  \n# 定义组合\n\n在我们检查服务组合管理活动的四个阶段之前，我们将讨论现有的服务组合。现有服务和新服务都需要被记录。这提供了服务的初始清单，需要定期进行验证，特别是当业务需求变化迅速时。流水线中的每项服务都必须有记录在案的业务案例和验证的信息，显示需要哪些服务资产以及在何处投资。应该定义预期的业务成果，包括机会、实用性和保证需求、服务本身，以及实现这些成果所需的预期投资。如果批准理由具有说服力，拟议的服务将获得批准并移动到服务设计阶段进行设计和开发。\n\
  \n服务组合的变更可能源于新或已变更的策略。服务组合管理应考虑策略以识别特定的服务机会，并确定在定义服务时将咨询的利益相关者。服务组合变化的另一个可能是来自业务的请求。业务关系管理代表客户记录这些请求。请求可能以不同的格式出现，从详细的提案到非正式的想法（后期可以将其格式化为标准格式）。请求将被注册并向客户更新其状态。\n\
  \n服务组合变更的另一个来源是服务改进请求。`CSI` 识别改进机会并构建服务改进计划（`SIPs`）。这些机会可能涉及服务本身的变更，或支持或交付服务的流程、人员和工具。它们被提交给服务组合管理，因为它们影响了提供服务的整体投资，并在某些阶段需要分配给服务。\n\
  \n接下来，我们将更详细查看服务组合管理的四个阶段。\n\n# 定义\n\n`Define` 阶段包含以下内容：\n\n*   任何需要重大投资或对约定的服务实用性和保证产生影响的服务建议都将提交给服务组合管理。以下是一些示例：\n\
  \    *   由`容量管理`建议的提高性能的新技术\n    *   在识别出新的业务影响后，来自`IT 服务连续性管理`的新型恢复计划\n    *  \
  \ 为提高可用性而对数据中心进行的重大修改\n    *   针对间歇性问题的建议解决方案，其需要迁移到新平台\n    *   可能影响服务的第三方服务变更\n\
  *   新服务将根据提供的信息进行定义。在此阶段，不需要详细的架构或技术设计。相反，需要的是对服务的目的、客户、消费者、输入、输出和高级需求，以及其支持的业务活动进行定义。其他需求可能包括法规或法律要求、必须遵循的标准、业务成果、利益相关者以及预期的投资和回报水平。最后，将包含任何需要考虑的限制条件。\n\
  *   服务模型将被定义。这是对服务所有组件（包括客户资产和服务资产）的高层视图，以及它们如何结合在一起。新服务的影响将根据当前的业务成果、投资水平、服务水平协议、现有的保证和实用性水平、合同义务、业务活动模式和需求水平进行评估。现有服务变更的影响也将类似的评估，特别是对当前服务模型的影响。\n\
  \n# 分析\n\n每项服务都通过与其策略联系起来进行分析。服务组合管理阐述了视角、定位、计划和模式如何转化为实际的服务。需要执行的分析必须定义并理解，以确保收集正确的数据。它将需要多个专业领域的输入。\n\
  \n服务组合管理定期审查现有服务，以确定它们是否仍符合目标和组织策略。审查还将确保流水线中的服务已经过适当的定义、分析、批准和授权。\n\n此审查的输出反馈到投资、价值和优先级的分析中。有时服务组合管理会在策略管理周期期间发现新机会，作为策略评估阶段的一部分。`财务管理`有助于量化每项服务的投资和价值，以便进行优先级排序。准确成本需要详细的服务设计，但可以评估服务的可行性。投资分析和优先级结果记录在业务案例中，该案例描述了机会、潜在的业务成果以及组织准备对服务进行的投资。这些信息将用于计算`ROI`。业务案例是追求既定组织目标而采取行动的理由；它根据潜在收益以及所需的资源和能力来评估投资。\n\
  \n\n\n\n\n分析之后，将对服务的可行性以及是否应予以批准做出决策。这需要支出授权。（在此阶段，这仅为大纲批准，因为在没有详细设计的情况下，预期的投资水平可能不准确。）共有六种可能的决策：\n\
  \n*   保留/构建\n*   替换\n*   合理化\n*   重构\n*   更新\n*   退役\n\n如果客户对决策持不同意见，他们可能仍然希望服务提供商继续进行。可能的响应可能包括以下内容的组合：\n\
  \n*   向客户解释为什么无法满足需求\n*   向客户解释在开发新服务方面，在承诺、赞助或资金方面需要客户提供什么\n*   如果客户做出了必要的承诺，则开发该服务\n\
  *   如果客户无法承诺，则拒绝该机会\n*   考虑与第三方伙伴合作支持客户\n\n## 批准\n\n被判断为可行的新服务或现有服务的变更，将以变更提案的形式提交给变更管理进行批准。该提案将允许变更管理在批准或拒绝变更之前，协调调查客户需求和基础设施需求所需的所有资源的活动。变更提案应包含以下内容：\n\
  \n*   高层描述\n*   业务结果\n*   将提供的效用和保证\n*   完整的业务案例，包括风险、问题、替代方案以及预算和财务预期\n*   预期的实施进度\n\
  \n变更提案提交给变更管理，由其调查新服务或变更服务将如何，以及设计、构建和部署它需要什么。如果可行，则开始详细设计和部署，服务组合管理将起草服务章程。在被拒绝后，服务组合管理将通知所有利益相关者并更新服务组合的状态。\n\
  \n## 章程\n\n服务组合的最后一项活动是为新服务立章程。`Charter` 有两种含义：\n\n*   新服务（或对现有服务的变更）一旦获得客户或业务高管委托，就被认为已立项。\n\
  *   授权以满足定义的目标、输出、进度和支出的工作的文件可以称为章程。在服务组合管理中，服务是通过服务章程进行立项。\n\n服务章程确保所有利益相关者和员工对将构建什么、何时构建以及成本是多少有共同的理解。它将作为项目管理活动的输入，并列入项目组合。确保利益相关者获知从章程到部署的项目进度至关重要；这有助于确保他们的持续支持，并告知他们任何延迟或异常。对服务组合管理的更新允许该流程监控投资水平和能力。如果成本显著超过估算，服务组合管理将向利益相关者升级此情况。\n\
  \n部署后，将对服务进行评审，以确认服务已满足策略要求，并正在为实现利益相关者指定的业务结果做出贡献。服务组合中的服务投资评审应至少季度进行一次，以确保它们继续符合\
  \ IT 和整体组织策略。以下场景可能导致两者之间的脱节：\n\n*   环境和市场变化，导致先前的 ROI 计算失效\n*   由于合规或监管考虑，服务变得不再理想\n\
  *   发生如合并、剥离、新公共立法或重新部署的任务等事件\n\n注意，并非所有服务都需要低风险或高回报；一个具有最佳 ROI 和风险水平的高效率组合使价值最大化。\n\
  \n## 触发因素\n\n服务组合管理的触发因素如下：\n\n*   新策略或变更策略——观点、立场或行动模式的改变可能会影响现有服务或服务模型。\n*   业务关系管理接收到新服务或变更服务的请求；服务组合将在提交给变更管理作为变更提案之前，帮助定义并正式化该请求。\n\
  *   来自 CSI 的服务改进机会可能涉及服务组合管理。在流程的章程阶段，设计、构建和过渡团队报告的与规格、成本或发布时间的任何偏差，将涉及服务组合管理以估计影响并定义纠正措施。\n\
  *   服务水平管理识别出服务未能交付其预期结果，或使用方式与意图不符；服务组合管理将参与定义纠正措施。\n*   财务管理报告服务的成本与预期有显著差异，从而影响该服务的潜在投资回报；同样，服务组合管理将参与定义纠正措施。\n\
  \n### 输入\n\n服务组合管理具有以下输入：\n\n*   策略计划\n*   服务改进机会\n*   财务报告\n*   来自业务的请求、建议或投诉\n\
  *   流程中章程阶段服务的项目更新\n\n### 输出\n\n以下列表包含了服务组合管理的输出：\n\n*   最新的服务组合\n*   授权设计和构建新服务或变更现有服务的工作的服务章程\n\
  *   新服务或变更服务的状态报告\n*   关于服务组合中服务投资及其投资回报的报告\n*   允许变更管理评估并安排立项服务所需工作和资源的变更提案\n*\
  \   可以添加到中央风险登记中的策略风险\n\n### 接口\n\n接口包括与以下流程的接口：\n\n*   服务目录管理——服务组合管理决定哪些服务将被放入服务目录，而服务目录管理确保此工作的实现。\n\
  *   IT 服务策略管理定义服务的整体策略；该策略决定了组合中应包含什么类型的服务。它决定了根据预期回报的投资目标和理想市场空间。\n*   IT 服务财务管理提供信息和工具，使服务组合管理能够执行投资回报计算；有助于跟踪服务的实际成本。这些信息将用于改进未来服务的分析和预测。\n\
  *   需求管理提供有关业务活动模式的信息，用于确定服务的利用率和预期投资回报。\n*   业务关系管理发起请求并获取业务信息和需求，用于定义服务并评估它们是否能提供足够的投资回报。它让客户了解服务组合管理中服务的状态。\n\
  *   服务水平管理确保服务能够达到服务组合管理中定义的性能水平，并在未达到时提供反馈。\n*   容量管理和可用性管理确保立项服务的容量和可用性需求得到设计和构建。\n\
  \n\n\n\n* IT 服务连续性管理识别与交付服务相关的风险的业务影响，并设计应对措施和恢复计划，以确保服务能够实现服务资产组合管理期间定义的目标。\n*\
  \ 信息安全管理确保满足服务资产组合管理期间定义的机密性、完整性和可用性目标。\n* 供应商管理流程识别供应商无法继续提供服务或供应商关系面临风险的情形。\n\
  * 变更管理评估引入新服务或对现有服务进行更改所需的资源，从而实现服务的立项。它确保设计、构建和发布服务过程中涉及的所有变更都得到了控制和协调。\n* 服务验证和测试确保每项服务预期的功能和收益能够得以实现。\n\
  * 知识管理使 IT 经理和架构师能够就满足组织目标的最佳服务方案做出知情决策。\n* 持续服务改进提供服务的实际使用和收益与其预期使用和收益之间的反馈。这些信息被用于改进服务并对服务资产组合中服务的组合和可用性进行更改。\n\
  \n## 信息管理\n\n本节概述了服务资产组合的主要信息来源：\n\n* 服务资产组合，由服务流水线、服务目录和退役服务组成。\n* 项目组合，用于管理已立项并处于设计和构建阶段的服务。\n\
  * 应用组合，允许服务资产组合管理理解应用程序与服务之间的关系。\n* 客户组合和客户协议组合，允许服务资产组合管理理解客户需求、为满足这些需求而设计的服务以及为交付服务而达成的协议。\n\
  * 服务模型，允许服务资产组合管理在服务进入昂贵的设计和构建活动之前理解其组成和动态，并识别服务可能利用哪些现有投资。\n* 服务策略，提供了一个预期机会、约束、目标和所需业务结果的框架。服务资产组合管理预计定义什么样的服务组合能最地满足组织的战略目标。\n\
  * 配置管理系统提供数据和信息，支持服务模型的开发与评估，以及对新服务和现有服务更改的评估。\n\n### 角色与职责\n\n本节描述了在支持服务资产组合管理过程中需要执行的若干角色。\n\
  \n#### 服务资产组合流程所有者\n\n除了第 1 章“运营支持与分析简介”中描述的通用所有者角色外，服务资产组合流程所有者还要与其他所有者协作，以确保服务资产组合管理的设计和实施采取集成方法。\n\
  \n#### 服务资产组合流程经理\n\n除了第 1 章所述的流程经理通用职责外，服务资产组合流程经理的职责通常包括以下内容：\n\n* 管理和维护组织的服务资产组合\n\
  * 管理相关流程，以保持组合对客户的吸引力并保持更新\n* 对组合特别是服务目录进行营销，以便让客户和潜在客户了解可用服务\n* 帮助制定服务包及相关选项，以便服务能够以逻辑分组的方式组合，产生可以进行营销、销售和消费的产品，以最佳地满足客户需求。\n\
  \n## 关键成功因素与关键绩效指标\n\n最后，我们涵盖了该流程的 CSF 和 KPI。我们将涵盖一些示例，但完整列表请参阅 ITIL 服务策略出版物：\n\n\
  * 关键成功因素：“存在一个正式的流程来调查并决定提供哪些服务。”\n    * KPI：在服务资产组合管理流程所有者的拥有下，存在一个正式的服务资产组合管理流程。\n\
  \    * KPI：服务资产组合管理流程每年进行审计和审查，并符合其目标。\n* 关键成功因素：“能够记录每项提供的服务，以及其满足的业务需求和其支持的业务结果。”\n\
  \    * KPI：存在服务资产组合，并将其作为决定提供服务的依据。审计显示服务资产组合中的每项服务都已记录。\n    * KPI：存在定义业务需求和业务结果的记录化流程，该流程由服务资产组合管理流程所有者正式拥有。\n\
  \    * KPI：服务资产组合中的每项服务都至少关联一个业务结果。这通过对服务资产组合的定期审查进行验证。\n\n### 挑战\n\n服务资产组合管理面临以下挑战：\n\
  \n* 缺乏所需的客户业务信息，无法使服务资产组合管理理解预期的业务结果和策略\n* 缺乏正式的项目管理方法，使得在设计和过渡阶段对服务进行立项和跟踪变得更加困难\n\
  * 缺乏项目组合，使得评估新倡议对新服务或对服务的拟议更改的影响变得困难\n* 由于缺乏客户组合和客户协议组合，难以识别服务的目标、用途和投资回报率\n* 服务资产组合纯粹关注服务的提供者方面，这使得难以计算服务的价值、模拟未来利用率或验证客户对服务的真实需求\n\
  * 缺乏正式的变更管理流程来控制新服务的引入并管理现有服务的更改\n\n### 风险\n\n服务资产组合管理存在若干风险：\n\n* 应对客户压力并提供服务，但在没有经过验证或完整信息的情况下，且未对涉及风险进行充分调查。服务资产组合管理关注通过对提供的服务有充分理解来降低风险；仓促的回应会否定整个流程。\n\
  * 在未定义如何衡量服务的情况下提供服务。在未达成此协议之前，我们无法计算投资回报率。某服务可能正在交付价值，但无法证明，这将导致服务可能因成本削减而停止。\n\
  \n## 服务目录管理\n\n`service catalog` 在 ITIL 术语中的定义如下：\n\n> 一个数据库或结构化文档，包含有关所有运行中的 IT\
  \ 服务的信息，包括可部署的服务。服务目录是服务资产组合的一部分，包含两种类型 IT 服务的信息：对业务可见的面向客户的服务，以及服务提供者交付面向客户的服务所需的支持性服务。\n\
  \n让我们更详细地检查此定义：\n\n**数据库或结构化文档** 目录收集服务信息，并以业务易理解的形式呈现。\n\n\n\n\n\n# 关于所有运行 IT 服务的信息（包括可部署的服务）\n\
  \n目录包含了业务可用的服务详情；通过这种方式，它与服务组合的其他组成部分（服务流水线和退役服务）有所不同。收集和维护这些信息是服务目录管理工作的工作。\n\n\
  # 关于两种类型 IT 服务的信息\n\n目录提供了客户对可用服务所需的详细信息——交付物、价格、联系点、订购和请求流程。服务目录还有另一种视图——仅对 IT\
  \ 部门可见的视图，它展示了在交付客户服务时必须就位的支持服务。\n\n让我们先看看服务目录管理过程的目的。\n\n### 目的\n\n服务目录管理过程的目的是为所有运行服务提供并维护一个单一的一致信息源。它也可能包括那些正在准备投入运行的服务。服务目录管理过程确保服务目录能够广泛供授权访问的人员使用。\n\
  \n### 目标\n\n服务目录管理过程的目标包括管理服务目录中包含的信息。这确保了服务目录是准确的，并反映了运行环境中运行或正准备运行的所有服务的当前细节、状态、接口和依赖关系。\n\
  \n另一个目标是，该过程应确保以支持其有效高效使用信息的方式，将服务目录提供给获批准访问的人员。这可能根据受众而异；例如，技术支持人员对服务的视角与用户不同。\n\
  \n最后，确保服务目录支持所有其他服务管理过程对服务目录信息的不断需求很重要，包括所有的接口和依赖关系信息。\n\n### 范围\n\n服务目录管理过程的范围是为所有正在转换或已转换到运行环境的服务提供并维护准确的信息。由组织决定在何种点将服务显示为服务目录的一部分。服务目录中呈现的服务可以单独列出，或者更常见的是，部分或全部服务以服务包的形式呈现。\n\
  \n服务目录管理过程涵盖以下项目：\n\n* 对服务和服务包定义的贡献\n* 开发和维护适用于服务目录的服务和服务包描述\n* 制作和维护准确的服务目录\n*\
  \ 服务目录与整体服务组合之间的接口、依赖关系和一致性\n* 服务目录内所有服务与支持服务以及配置管理系统（CMS）之间的接口和依赖关系\n* 服务目录和 CMS\
  \ 内部所有服务与支持组件及配置项（CIs）之间的接口和依赖关系\n\n服务目录管理过程不包括以下内容：\n\n* 对捕获、维护和使用服务资产及配置数据的详细关注；这是通过服务资产和配置管理过程执行的\n\
  * 对捕获、维护和履行服务请求的详细关注；这是通过请求履行过程执行的\n\n### 价值\n\n服务目录提供了关于服务提供组织交付的 IT 服务的中心信息源。它包含了面向客户的视图（或多个视图），涵盖正在使用的\
  \ IT 服务、这些服务的预期使用方式、它们实现的业务流程，以及客户对每项服务可以期待的服务水平和质量。\n\n通过服务目录管理的工作，组织可以实现以下：\n\n\
  * 利用服务目录作为营销和通信工具，确保对 IT 服务的共同理解，并改善客户与服务提供之间的关系\n* 通过将内部服务提供活动和服务资产与业务流程及结果关联，提高服务提供对客户结果的关注\n\
  * 利用包含或连接到服务目录的信息，提高其他服务管理过程的效率和有效性\n* 在整个服务提供组织及其活动中提高对每个服务业务价值的认知、对齐和关注\n\n###\
  \ 策略\n\n每个组织都应该就整体服务组合和组成的服务目录制定并维护策略，涉及其中记录的服务以及记录了哪些细节（包括为每个服务记录了哪些状态）。\n\n策略还应包含整体服务组合每个部分的职责细节以及每个组成部分的范围。这将包括关于服务何时发布在服务目录中，以及服务何时从服务目录中移除并仅出现在服务组合的退役服务部分的策略。\n\
  \n### 原则和基本概念\n\n服务提供者提供不同类型的服务。在图 17.5 中，你可以看到框架描述的服务类型。\n\n![图像显示服务目录中业务流程 1、2\
  \ 和 3 的服务类型，通过面向客户的服务和支持服务列中的 SLA 连接到服务 A、服务 B、服务 C 和服务 D。](img/00085.jpeg)\n\n\
  图 17.5 服务目录中的服务类型\n\n*面向客户的服务*是客户可见的 IT 服务。它们通常是支持客户业务部门/业务流程的服务，直接促进客户期望的某些结果或多个结果。\n\
  \n*支持服务*是支持或“支撑”面向客户服务的 IT 服务。它们通常对客户是不可见的，但对于交付面向客户的 IT 服务至关重要。\n\n为了达到最有效，服务目录视图应该根据受众的需求进行定制。从客户角度所需的信息与技术支持团队所需的信息不同。在图\
  \ 17.6 中，你可以看到两种视图下的服务目录视角：业务客户视图和技术视图。\n\n![图像显示业务流程 1、2 和 3 的双向服务目录，链接到服务（A、B、C、D\
  \ 和 E）并互连到服务（1 到 6），最后链接到相关信息和服务资产。](img/00086.jpeg)\n\n图 17.6 双视图服务目录\n\nCopyright\
  \ © AXELOS Limited 2010\\. 版权所有。材料根据 AXELOS 的许可复制。\n\n目录应形成配置管理系统的一部分。这应该以适合组织的方式进行结构化和呈现。\n\
  \n\n\n\n\n在图 17.7 的示例中，面向客户的目录已经进行了分区，使得业务单元只能看到其正在使用的服务。这对于商业服务提供商可能是恰当的因为两个不同的客户组不需要共享整个目录的可见性。这两个客户组通常被统称为批发客户或零售客户。\n\
  \n![图像显示了用于批发和零售客户的三视图服务目录，它与服务（A, B, C, D 和 E）链接，并与服务（1 到 6）相互链接，最后链接到相关信息和服务资产。](img/00087.jpeg)\n\
  \n图 17.7 三视图服务目录\n\nCopyright © AXELOS Limited 2010. 保留所有权利。材料根据 AXELOS 的许可进行复制。\n\
  \n## 过程活动、方法和技术\n\n我们现在将从管理的角度考虑过程活动。有许多活动需要考虑，其中服务的协议化和文档化活动尤为重要。\n\n关键活动包括确保在文档中对服务进行适当定义和描述。\n\
  \n服务目录应当与服务组合（service portfolio）对接，因此服务目录管理过程和服务组合管理过程应该紧密结合。这将使两者的内容能够保持准确和更新。服务目录是\
  \ IT 服务连续性过程的重要来源，并支持业务连续性管理，确保根据业务连续性需求维护适当的服务。它还用于记录与供应商以及内部服务提供团队（如服务资产和配置管理）的关系，支持对整个\
  \ IT 资产的理解。服务目录同时支持服务水平管理和业务关系管理，确保与业务需求和流程一致。\n\n所有这些交互都需要服务目录过程经理的关注，以确保目录中捕获的信息得到持续有效的使用。\n\
  \n## 触发器、输入、输出和接口\n\n首先，我们将考虑该过程的触发器。\n\n### 触发器\n\n服务目录管理过程的触发器包括业务需求和服务的变化。主要触发器包括变更请求（RFC）和变更管理过程。这包括新服务、现有服务的变更以及正在退役的服务。\n\
  \n### 输入\n\n多个信息源与服务目录管理过程相关，并构成目录的输入：\n\n* 来自来自组织业务和 IT 战略、计划和财务计划的业务信息，以及来自服务组合的当前和未来需求信息\n\
  * 业务影响分析（BIA），提供与每个服务或服务需求变更相关的影响、优先级风险信息\n* 业务需求；来自服务组合的任何已同意、新的或已变更业务需求的详情\n*\
  \ 服务组合以及所有相关数据和文档\n* 配置管理系统\n* 变更请求\n* 来自所有其他过程的反馈\n\n### 输出\n\n服务目录管理过程的输出如下：\n\
  \n* 服务定义的文档化和协议化\n* 服务组合的更新；应包含所有服务的当前状态和对服务的需求\n* 变更请求的更新\n* 服务目录；应包含服务提供者提供的每项运行服务或每项正在过渡到运行环境的服务的详细信息和当前状态，以及接口和依赖关系\n\
  \n### 接口\n\n每个服务提供者过程都会使用服务目录，因此可以说服务目录管理过程与所有过程都对接。以下列表包含了一些最突出的接口：\n\n**服务组合管理**：该过程决定哪些服务将获得立项，从而推进并最终纳入服务目录。它还包括关于每项服务或潜在服务的关键信息，包括任何已约的服务包和服务选项。\n\
  \n**业务关系管理**：该过程确保服务与需要该服务的客户之间的关系有明确的定义，即该服务如何支持客户的需求。\n**服务资产和配置管理**：该过程与服务目录管理协作工作，确保\
  \ `CMS` 中的信息与服务目录中的信息得到适当的链接，以提供关于服务、客户、业务流程、服务资产和配置项（CIs）之间接口和依赖关系的一致、准确且全面的视图。\n\
  **服务水平管理**：该过程协商要交付的特定服务保证水平，这将反映在服务目录中。\n**需求管理**：与服务组合管理相结合，该过程决定如何将服务组合成服务包以供配置，并协助服务目录管理确保这些包在服务目录中得到适当的表示。\n\
  \n## 信息管理\n\n该过程的关键信息是包含在服务目录本身的内容。由于服务目录是服务组合的一部分，该信息的主要输入来自业务，通过业务关系管理或服务水平管理过程。在将信息记录到服务目录之前，验证信息的准确性至关重要。信息和服务目录本身需要使用变更管理过程进行维护。\n\
  \n管理服务目录信息有许多不同的方法：\n\n* 由服务提供者组织构建并利用现有技术的内网解决方案\n* 专为服务目录管理设计的可用解决方案\n* 作为更全面的服务管理套件一部分解决方案\n\
  \n服务目录数据可能存储在单个仓库或多个仓库中。某些服务提供者可能在不同的位置或工具集中维护支持服务目录不同视图的数据。\n\n例如，支持服务的详细数据可能存储在\
  \ `CMS` 中，并通过与访问其他服务资产和配置数据相同的接口进行呈现，而面向客户的服务数据可能存储用于通过企业内网基于浏览器的应用程序中向客户展示。\n\n\
  构建服务目录的不同视图应基于目标受众的视角和需求。服务提供者应该考虑在每个视图中包含哪些服务（数据行）以及哪些数据元素或字段（数据列）。例如，支持性服务的关系详情对于面向服务提供者内部人员的视图来说可能非常重要，而这些细节对客户来说通常没有吸引，可能会从面向客户的视图中排除。\n\
  \n在此，与服务组合管理的集成至关重要，同样还有访问其他密切相关的功能。客户应该能够查看其服务水平协议监控报告，或访问服务请求的自助帮助门户。一些市售服务目录工具正在趋成熟，能够提供从提议到退役的全服务组合管理。\n\
  \n\n\n\n每个组织都必须理解最能满足其当前和未来需求的解决方案。然而，重要的是不要将用于展示服务目录的工具集与服务目录本身混淆。拥有纸质目录的组织和拥有稳健技术解决方案的组织都同样拥有服务目录。\n\
  \n# 角色与职责\n\n本节描述了除第 1 章描述的通用角色和职责外，与服务目录过程相关的角色和职责。\n\n## 服务目录管理流程所有者\n\n服务目录管理流程所有者的职责通常包括与其他流程所有者合作，确保在服务目录管理、服务组合管理、服务水平管理和业务关系管理的设计与实施方面采取整合方法。\n\
  \n## 服务目录管理流程经理\n\n服务目录管理流程经理的职责通常包括：\n\n*   协调服务目录管理与其他流程之间的接口，特别是服务资产和配置管理，以及发布和部署管理\n\
  *   确保所有运行服务以及所有正准备运行的服务都记录在服务目录中\n*   确保服务目录中的所有信息都是准确且最新的\n*   确保维护服务目录的适当视图，并提供给目标受众\n\
  *   确保服务目录中的所有信息都与服务组合中的信息一致\n*   确保服务目录中的信息得到充分保护和备份\n\n## 关键成功因素与关键性能指标\n\n以下列表包含了服务目录管理的一些关键成功因素和关键性能指标。\n\
  \n*   关键成功因素：“一个准确的服务目录”\n    *   KPI：服务目录中记录和管理的的服务数量占活动环境中交付和过渡的服务数量的百分比增加\n \
  \   *   KPI：以百分比衡量，服务目录包含的信息与“现实世界”情况之间检测到的差异数量减少\n*   关键成功因素：“业务用户对所提供服务的认知”\n\
  \    *   KPI：相对于运营服务，服务目录面向客户视图的完整性增加（以百分比衡量）\n    *   KPI：业务用户调查响应中了解服务目录中所列服务的比例增加（以百分比衡量）\n\
  \    *   KPI：业务用户访问基于内网的服务目录的测量值增加\n*   关键成功因素：“IT 人员对支持服务的技术的认知”\n    *   KPI：相对于构成这些服务的\
  \ IT 组件，支持服务的完整性增加（以百分比衡量）\n    *   KPI：服务台和其他 IT 人员能够访问支持所有运行服务的信息，以具有适当服务相关信息的事件百分比衡量\n\
  \n### 挑战\n\n服务目录管理过程面临的主要挑战是维护一个准确的服务目录。这应该作为服务组合的一部分进行管理，将所有目录视图都纳入整体 `CMS` 和 `SKMS`\
  \ 的中。\n\n为了实现这一目标，组织文化需要接受目录和组合是本质的信息源。因此，确保 IT 组织中的每个人都理解他们都负责支持使用并帮助维护其准确性至关重要。\n\
  \n### 风险\n\n提供准确服务目录相关的风险如下：\n\n*   目录中数据不准确，且未受严格的变更控制。\n*   对目录及其使用的接受度低。\n* \
  \  维护信息所需的工具和资源不足。\n*   获取准确信息和流程的途径不良。\n*   信息过于详细而无法维护，或由于级别太高而导致 `CMS` 和 `SKMS`\
  \ 中没有任何价值。\n\n## 总结\n\n在本章中，我们研究了服务组合管理过程，该过程支持关于在整个组织中应向哪些人员提供哪些服务的决策。它包括正在开发中的流水线服务、运行服务和退役服务。\n\
  \n我们还探讨了服务目录管理过程，它为组织提供了运行服务的可见性。服务组合与服务目录密切相关，尽管服务组合管理被归类为策略过程，而服务目录管理被归类为设计过程。\n\
  \n# 考试重点\n\n**理解服务组合管理和服务目录管理流程。** 你需要理解服务组合管理和服务目录管理的目的、目标、范围、原则和活动。\n\n**能够描述服务组合的内容及其与生命周期的关系。**\
  \ 识别服务组合的各种组件至关重要。它由服务流水线、服务目录和退役服务组成。能够描述这些每一个如何与生命周期的其他部分以及其他生命周期阶段的过程交互。\n\n\
  **了解每个过程的业务价值、挑战和风险。** 能够解释业务从每个过程中获得的价值，以及运行该过程所涉及的挑战和风险。\n\n**理解服务目录的排除项。** 服务资产和配置管理涉及\
  \ `CIs` 的管理。服务请求的履行不受服务目录管理。\n\n**解释服务目录的不同视图。** 有许多视图用于显示服务目录的信息。能够区分技术视图和业务视图，并解释各自的目的。理解何时为组织提供多个服务目录视图也很关重要。\n\
  \n**理解服务目录与服务组合之间的关系。** 能够解释服务组合与服务目录之间的关系，并理解服务何时从服务组合流水线移动到服务目录。\n\n**解释信息管理在服务目录管理中的作用。**\
  \ 信息对于服务目录管理过程至关重要。该过程的输出是准确的信息及其维护。\n\n## 复习题\n\n你可以在附录中找到复习题的答案。\n\n1.  服务组合与服务生命周哪些阶段交互？\n\
  \    1.  服务策略、服务设计\n    2.  服务策略、服务过渡、持续服务改进\n    3.  服务策略、服务设计、服务运营、持续服务改进\n\n\n\
  \n\n## 4. 服务策略、服务设计、服务转换、服务运营、持续服务改进\n\n## 2. 以下哪个陈述反映了服务组合管理的目的？\n1. 确保为业务当前和未来的需求提供容量\n\
  2. 确保服务提供者交付的服务与业务需求一致\n3. 确保足够的可用性以满足业务当前和未来的需求\n4. 确保服务提供者拥有正确的服务组合，以平衡 IT 投资与实现业务结果之间的关系\n\
  \n## 3. 哪种描述（X, Y, 或 Z）与每种目录类型（1, 2, 和 3）最匹配？\n1. 业务/客户目录\n2. 技术目录\n3. 多视图目录\n\n\
  - X. 所有使用的服务的视图\n- Y. 用于交付面向客户服务的支撑服务视图\n- Z. 直接交付给客户的面向客户服务的视图\n\n1. X = 3, Y =\
  \ 2, Z = 1\n2. X = 1, Y = 2, Z = 3\n3. X = 2, Y = 1, Z = 3\n4. X = 2, Y = 3, Z =\
  \ 1\n\n## 4. 以下哪个是服务目录的正确定义？\n1. 一份描述 IT 服务、服务水平目标以及 IT 服务提供者和客户责任的文档\n2. 由服务提供者管理的完整服务集，用于管理所有服务的整个生命周期\n\
  3. 一个包含所有运行中的 IT 服务信息的数据库或文档\n4. 对特定支出项目的合理性说明，包括有关成本、收益、选项和风险的信息\n\n## 5. 以下哪些内容包含在服务目录中？\n\
  1. 面向客户的服务\n2. 战略性服务\n3. 支撑服务\n4. 已退役的服务\n\n1. 1 和 2\n2. 1, 2, 3 和 4\n3. 1 和 3\n\
  4. 2 和 3\n\n## 6. 以下哪个陈述是正确的？\n1. 服务目录是服务组合的一部分。\n2. 服务组合是服务目录的一部分。\n3. 服务目录与服务组合之间没有关系。\n\
  4. 面向客户的服务出现在服务目录中，而支撑服务出现在服务组合中。\n\n1. 1 和 3\n2. 仅 1\n3. 2 和 4\n4. 仅 4\n\n## 7.\
  \ 关于服务目录的以下陈述哪个是正确的？\n1. 服务目录仅包含面向客户的服务信息。\n2. 服务目录仅包含支撑服务信息。\n3. 服务目录显示了哪项 IT 服务支持每个业务流程。\n\
  4. 服务目录显示了开发中服务的细节。\n\n## 8. 关于服务目录管理的这些陈述中哪个最正确？\n1. 服务目录管理可以连接到大多数生命周期过程。\n2.\
  \ 服务目录管理可以不连接到任何生命周期过程。\n3. 服务目录管理只能连接到服务组合管理过程。\n4. 服务目录管理只能连接到服务水平管理过程。\n\n##\
  \ 9. 服务组合管理过程是哪个服务生命周期阶段的一部分？\n1. 服务设计\n2. 服务转换\n3. 服务策略\n4. 持续服务改进\n\n## 10. 哪个角色最可能负责服务组合的市场？\n\
  1. 服务组合过程所有者\n2. 服务组合过程经理\n3. 服务经理\n4. 服务所有者\n\n# 第 18 章\n## 服务水平管理与供应商管理\n\n本章讨论了以下\
  \ ITIL 服务方案和协议考试目标：\n\n- ![images](img/00005.jpeg) 服务水平管理与供应商管理\n- ![images](img/00005.jpeg)\
  \ 每个过程将从以下方面讨论：\n    - 目的\n    - 目标\n    - 范围\n    - 价值\n    - 政策\n    - 原理和基本概念\n\
  \    - 过程活动、方法和技术\n    - 触发、输入、输出和接口\n    - 信息管理\n    - 角色和职责\n    - 关键成功因素和关键绩效指标\n\
  \    - 挑战\n    - 风险\n\n![](img/00006.jpeg) 本章涵盖了每个过程的日常运营；其活动、方法和技术的细节；以及其信息管理。\n\
  \n服务水平管理关注定义服务、在协议中记录这些服务，然后确保目标得到衡量和满足，并在必要时采取行动以提高所交付的服务水平。\n\n供应商管理是负责从供应商处获得物有所值的过程，确保与供应商的所有合同和协议都支持业务需求，并验证所有供应商都履行了其合同承诺。\n\
  \n## 服务水平管理\n服务水平管理 (`SLM`) 过程需要对 IT 服务目标和成果进行不断的谈判、达成一致、监控、报告和评审。对服务水平的改进和纠正将作为持续服务改进的一部分并通过启动相关措施进行管理。\n\
  \n### 服务水平管理的目的\n我们将首先根据 ITIL 框架查看服务管理过程的目的。ITIL 指出，`SLM` 的目的是确保所有当前和计划的 IT 服务都能交付到可实现的目标。这里的关键词是\
  \ `agreed`（约定的）和 `targets`（目标）。服务水平管理是关于与客户讨论、谈判并就应该提供哪些 IT 服务达成一致，并确保使用客观衡量来确定是否已提供服务。\n\
  \n因此，服务水平管理关注定义服务、在协议中记录这些服务（包括双方的承诺），然后确保目标得到衡量和满足，并在必要时采取行动提高服务水平。这些改进通常将作为持续服务改进的一部分进行。\n\
  \n另注意，`SLM` 的定义提到了当前和计划的 IT 服务。服务水平管理的目的不仅是确保当前交付的所有 IT 服务都已建立`服务水平协议` (`SLA`)，还要对计划服务的需求进行讨论和谈判，以便在服务投入运行时已达成并建立了\
  \ `SLA`。在新或变更服务转换后的初始阶段，`SLA` 目标可能保持为临时状态，因为它们正在现场环境中进行测试。在最终确定之前，如果需要，可以对其进行调整。\n\
  \n正由于最后一个原因，服务水平管理是服务设计过程之一；服务的设计必须能够交付客户所需的可用性、容量等水平，而这些水平是服务水平管理在 `SLA` 中记录的。一个常见的问题是，`SLA`\
  \ 直到上线日期之前（甚至是之后）才被考虑，此时人们才发现设计无法满足客户的服务水平要求。服务水平管理主要关注服务的保障（warranty）方面。新服务的响应时间、容量、可用性等将是\
  \ `SLA` 的主题，确保服务设计同时满足效用（utility）和保障（warranty）要求是至关重要的。\n\n\n\n\n\nSLM（服务水平管理）的目标不仅限于“定义、记录、达成、监控、衡量、报告和审查”（IT\
  \ 服务的交付状况如何）以及在必要时采取改进措施。它还包括与业务关系管理合作，与业务客户建立良好的工作关系。作为服务水平管理的一部分，与业务部门定期行的会议构成了强大沟通渠道的基础，从而加强了客户与\
  \ IT 之间的关系。\n\nSLM 的一项核心特征是客户和 IT 双方对什么是可接受的服务水平达成共识。因此，SLM 的目标之一是为每个 IT 服务制定适当的目标。这些目标必须是具体的且可衡量的，这样对于是否实现目标就不会产生争议。抵制使用“尽快”或“合理努力”等表述的诱惑，因为客户和\
  \ IT 可能对什么是“尽快”或什么是“合理”产生分歧。在 SLA 中使用此类表达式，可能导致 IT 服务提供商无法失败，但这会导致客户产生愤世嫉俗的情绪并损害\
  \ SLM 旨在建立的关系。如果 IT 服务提供商是外部公司，法律部门不可避免地会减少提供商因违约被诉的可能性，因此这些短语可能会被包含；但对于内部服务提供者来说，没有这种借口。如果\
  \ SLM 要实现另一个目标：即确保客户和 IT 对服务水平具有“清晰且无歧义的预期”，那么使用客观成功标准是至关重要的。\n\nSLM 的另一个目标是确定客户对所提供服务的满意度，并采取措施提高这种满意度。这一目标面临挑战，因为获得客户满意度的准确评估并非易事。客户满意度调查可能仅由少数自愿选择的人员完成。不满意的人比满意的人更有可能完成此类调查。尽管有这种倾向，服务水平经理仍必须尝试使用任何适当的方法尽可能准确地监控客户满意度。除了调查、焦点小组和个人访谈外，还可以采用其他方法。\n\
  \nITIL 为 SLM 列出的最后一个目标是，即使在达到目标的情况下，也要提高服务水平。此类改进必须具有成本效益，因此必须对任何财务或资源投资的预期回报进行分析。SLM\
  \ 积极寻找此类具有成本效益的改进机会。实现这一目标是持续服务改进的一部分，而持续改进是所有 ITIL 过程中的基本要素。\n\n### 服务水平管理的范围\n\
  \n服务水平管理的范围包括正在提供的现有服务的性能，以及计划服务所需服务水平的定义。它在业务部门与 IT 服务提供者之间就所有涉及服务质量的问题形成了定期沟通渠道。因此，SLM\
  \ 在管理客户预期方面发挥着重要作用，以确保他们预期的服务水平与感知收到的服务水平相匹配。如前所述，SLM 的是确保服务的保修方面达到预期水平。计划服务的预期服务水平在客户提供的服务水平需求\
  \ `SLR` 规范中详细说明，而（经过谈判后）达成的服务水平记录在 `SLA` 中。`SLAs` 的编写应涵盖所有运行中的服务。通过参与设计阶段，SLM 确保了计划服务将交付业务所需的保修水平。\n\
  \n### 服务水平管理对业务的价值\n\n每个 IT 服务都由内部支持团队或外部第三方供应商提供的若干元素组成。成功的服务水平管理的一个基本要素是与提供每个服务元素的人员就其提供的服务水平进行谈判和达成协议。这些提供者的任何失败将转化为未能满足\
  \ `SLA`。我们将在在本章稍后部分介绍这些协议，对于内部团队称为`运营水平协议` (`OLAs`)，对于外部供应商称为`支撑合同` (`underpinning\
  \ contracts`）。\n\n最后，SLM 包括与约定的目标相比，对所有服务成果进行衡量和报告。所需的频率、衡量方法和报告深度是在 `SLA` 谈判过程中达成一致的。\n\
  \n理解服务水平管理与业务关系管理之间的关系至关重要。SLM 处理与提供的服务质量相关的问题；业务关系管理的角色更具战略性。业务关系经理与业务紧密合作，理解其当前和未来的\
  \ IT 需求。确保服务提供者理解这些需求并能够满足这些需求是业务关系经理 (`BRM`) 的责任。SLM 更多关注如何通过确保与内部和外部供应商达成协议以按要求标准提供服务元素来实现目标。业务关系管理将在第\
  \ 19 章“IT 的业务关系管理和财务管理”中进行更详细的介绍。\n\n服务水平管理与业务关系管理合作并补充。同样，SLM 在`服务改进计划` (`SIP`)\
  \ 中识别的改进措施将结合持续服务改进共同实施；它们记录在 `CSI 注册表` 中，并在其中进行排序和审查。\n\n### 服务水平管理政策、原则和基本概念\n\
  \n接下来我们考虑服务水平管理的一些政策、原则和基本概念。\n\n### 政策\n\n服务提供者应为服务水平管理过程的执行建立的政策。政策通常定义此类内容，例如服务水平协议和运营水平协议的最低要求内容；何时以及如何对协议进行审查、更新、修订和/或重新谈判；以及多久提供一次服务水平报告以及使用何种方法。\n\
  \n应优先考虑 SLM 与供应商管理之间的政策。供应商的性能可能是实现端到端服务水平承诺的关键要素。\n\n#### 原则\n\n服务水平管理是服务生命周期服务设计阶段的一部分，尽管其许多活动发生在服务运营和持续服务改进阶段。该过程的一个基本原则是它包含了对服务水平需求\
  \ (`SLRs`) 的捕获，并确保新或更改的服务设计能够满足这些需求。一旦服务完成，服务水平管理的工作就是确保其交付满足这些需求。`SLAs` 将正式化并记录已达成一致的内容，并构成了管理服务提供者与客户之间关系的基础。\n\
  \n\n\n\nSLA 应该包含相关各方的角色和责任，包括 IT 提供者、IT 客户以及实际用户。SLA 的措辞应尽可能简单清晰。涵盖向内部客户提供的服务的协议不需要使用法律术语。重点应放在清晰度以及对所做承诺的共同理解上。包含一个术语表是有帮助的；IT\
  \ 术语对客户来说可能是歧义的，而业务表达式对 IT 工作人员来说可能并不清晰。\n\nSLA 应由客户方和 IT 服务提供方双方相应资级的员工签署。这为所作出的承诺提供了信誉。一旦达成\
  \ SLA，就应该进行广泛传播，以确保客户、用户和 IT 工作人员都了解其存在以及关键目标。在可能的情况下，应将目标程序化到服务管理工具中，以便于报告，并在目标可能被违背时自动告警，以便采取行动。\n\
  \n## 基本概念\n\n服务水平管理术语是从 IT 服务提供者的角度表述的，特别是涉及底层合同和协议时。你应该已经在基础学习中熟悉了这些术语。\n\n###\
  \ 服务水平协议 (Service Level Agreement)\n\n`SLA` 一词专门指 IT 服务提供者与客户之间的协议。它应该是一份正式的书面协议，定义了双方的关键服务目标和责任。仅有口头的“理解”是不够的，因为任何关于所提供服务水平的分歧都需要根据已约定的、定义的且客观的目标来解决。`agreement`（协议）这个词很重要——SLA\
  \ 不能由任何一方强加，因为协议必须是互利互的。SLA 通常会定义服务应交付的保证性（warranty）方面的目标，并描述服务的实用性（utility）。\n\n\
  ### 底层合同 (Underpinning Contract)\n\n此处的 `underpinning contract` 指 IT 服务提供者与供应商之间任何支持向客户交付服务的协议或合同。例如与互联网服务提供商或软件供应商签订的合同，描述了所提供的服务和支持。\n\
  \n### 运营水平协议 (Operational Level Agreement)\n\n`operational level agreement` 是 IT\
  \ 服务提供者与同一组织内其他协助提供服务的部门之间的协议。它描述了内部团队就其交付的服务各个方面所达成的协议。示例包括事件响应和解决时间，以及每个二线支持团队的工作时间。\n\
  \n### 底层协议 (Underpinning Agreements)\n\n`Underpinning agreements` 是一个通用术语，用于指代所有\
  \ OLA，以及支撑客户 SLA 的合同或其他协议。`underpin`（支撑）一词意味着这些协议支持 SLA 中的目标。确保这些协议中包含的所有目标都支撑服务提供者及其客户约定的目标是至关重要的。在有适当底层协议的情况下，服务提供者可以确保\
  \ SLA 中的目标是可以实现的。图 18.1 显示了这些服务关系和依赖关系。\n\n![图像显示了业务单元 A、B 和 C 之间的服务关系和依赖关系，它们连接到服务\
  \ (A, B, C)，流向 IT 服务提供者的基础设施，最后连接到团队和供应商。](img/00088.jpeg)\n\n**图 18.1** 服务关系与依赖关系\n\
  \nCopyright © AXELOS Limited 2010\\. 版权所有。材料根据 AXELOS 的许可复制。\n\n### SLA 结构\n\nSLA\
  \ 有多种可能的结构，服务提供者应该选择最合适的结构。每种潜在结构都有优缺点。让我们逐一检查这些结构：\n\n*   基于服务的 SLA 结构是为该服务的所有客户每个服务提供一个\
  \ SLA。这适用于提供标准服务的组织，例如硬件维修服务，其中所有客户都获得相同的响应和维修服务目标。对于不同客户对服务有不同需求，或者不可避免地存在不同服务水平的情况，这种结构并不适用。例如，偏远地区的客户必须接受较慢的响应时间。在这些情况下，可能在同一协议内需要单独的目标。确定这些协议的适当签署人至关重要。在所有业务区域提供共同服务水平（例如电子邮件或电话）的情况下，基于服务的\
  \ SLA 可以是一种合适的结构。为了满足这些标准服务的某些需求变化，也可以使用多个类别的服务（例如金级、银级和铜级）。客户可能不喜欢需要为他们使用的不同服务参考不同的\
  \ SLA。\n*   基于客户的 SLA 是与单个客户组签订的协议，涵盖他们使用的所有服务。例如，与组织的财务或人力资源部门签订的 SLA，涵盖了他们使用的\
  \ IT 系统。通常只需要一个签署人，这简化了问题。服务提供者可能会发现同一项服务在多个 SLA 中被提及是不方便的。\n*   多级 SLA 是另一种选择，是图\
  \ 18.2 所示的三层结构示例。此示例中的三层分别是公司级、客户级和服务级。公司级描述了适用于组织内每个客户的所有通用 SLM 问题。客户级涵盖与一个特定客户组或业务单元相关的所有\
  \ SLM 问题，无论使用何种服务。第三级是服务级，涵盖了与特定客户组相关的特定服务的所有 SLM 问题（ SLA 涵盖的每个服务对应一个）。\n\n![图像显示了具有三层结构的多级\
  \ SLA，包括特定服务级 SLA、客户/业务单元级 SLA 和公司级 SLA。](img/00089.jpeg))\n\n**图 18.2** 多级 SLA\n\
  \nCopyright © AXELOS Limited 2010\\. 版权所有。材料根据 AXELOS 的许可复制。\n\n这种结构允许 SLA 保持在易管理的范围内，避免不必要的重复，并减少频繁更新的需求。这确实涉及额外的管理工作，以维护服务目录和\
  \ CMS（配置管理数据库）中必要的关系和链接。\n\n### 服务水平管理过程活动、方法和技术\n\n现在让我们详细探讨该过程及其活动。在图 18.3 中，你可以看到服务水平管理过程中活动的完整范围。\n\
  \n![图像显示服务水平管理过程，业务单元 A 和 B 连接到带有 SLA 的服务，进一步通过双向箭头连接到 SLR(s) 和 OLA(s) 过程，并以团队和供应商结束。](img/00090.jpeg)\n\
  \n**图 18.3** 服务水平管理过程\n\nCopyright © AXELOS Limited 2010\\. 版权所有。材料根据 AXELOS 的许可复制。\n\
  \nSLM 过程中的关键活动应包括以下内容；确保你能识别图中的每一个步骤。\n\n\n\n\n\n# 新服务、变更服务以及现有服务的需求的确定、谈判、记录和达成\n\
  \n`SLAs` 应在将新服务或变更服务部署到生产环境之前达成一致。`SLA` 中的目标将是服务水平需求协商的结果；对于新服务，这些目标将源于服务设计阶段早期开发的\
  \ `SLRs`，并被开发为试点或草案 `SLA`。该文档将在设计阶段进行精炼，并在早期运行支持期间进行监控。如果能够实现这些目标，`SLA` 将正式采纳并签署。如果未能实现目标，则可能需要对设计进行改进以支持所需的目标，或者需要对目标进行重新谈判。当服务符合指定目标时，草案\
  \ `SLA` 可由服务提供商和客户代表定稿并签署。\n\n如前所述，`SLRs` 描述客户对 IT 服务某方面的需求，并主要关注保修方面，例如服务的可用性。这些\
  \ `SLRs` 成了服务水平目标的基础。如果需求超过了基础协议目前提供的服务水平，服务水平经理将不得不重新协商这些基础协议，或者与客户协商以达成一个可以支持的服务水平。\n\
  \n现有的运营服务也需要服务水平协议。如果首次引入此流程，则这些服务的服务水平目标也需要进行谈判并达成一致。\n\n# 根据 SLA 内的目标对所有运营服务的成就进行监控和衡量\n\
  \n如前所述，服务性能目标必须是具体的、客观且可衡量的。在提供详细的服务报告与用大量图表淹没客户之间必须取得平衡。愤世嫉俗的服务提供商可能认为，提供大量的报告可能会掩盖服务水平达成情况的真相。报告需要简单清晰，并反映客户体验。报告几个关键指标，并对任何失败提供详细分析以及解决这些问题的行动计划，比提供客户无法完全理解的几十个图表要好。\n\
  \n一种简单的方法是每月生成一份报告，显示每项服务的状态，用红色、黄色或绿色表示。红色表示违反了约定的服务水平目标，黄色表示目标几乎被违反，绿色表示服务运行在目标范围内。这种“RAG”报告可以传达所有服务的大量信息，同时引起关注区域，以便对其进行处理。\n\
  \n生成的每份报告都应遵循报告最佳实践——它应该有明确的用途、定义的受众以及明确识别的数据源。报告应按照 `SLA` 规定的进度生成。\n\n# 执行服务评审\n\
  \n某些组织执行服务水平管理的谈判、记录和协议阶段，并产生约定的报告，但并不积极管理所提供的服务水平。与客户定期（按照定义的进度表）见面以讨论成就或问题并识别改进机会是重要的\
  \ SLM 活动。这些服务评审与客户建立了更牢固的关系，并能够识别和处理问题。遗憾的是，组织在前几次会议后未能举行定期会议是很常见的。客户会感到他们的担心没有得到解决。\n\
  \n# 收集、衡量和提高客户满意度\n\n客户满意度可以通过多种方式进行衡量。与针对目标报告一样，识别问题并采取行动至关重要。如果服务提供商组织没有人分析结果，服务台在事件解决或请求完成后常规收集此类信息几乎毫无意义。SLM\
  \ 还负责记录和管理投诉与赞誉。\n\n# 支持活动\n\nSLM 流程中的其他活动支持了关键活动的成功执行：\n\n*   如前所述设计 `SLA` 框架。\n\
  *   定期审查和修订当前的 `SLAs` 和服务范围。审查和修订 `OLAs` 和合同，以确保它们继续支持 `SLAs`（合同的修订将与供应商管理结合进行）。\n\
  *   开发、维护和运行 SLM 程序，包括记录、处理和解决所有投诉的程序，以及记录和分发赞誉的程序。\n*   提供并维护最新的 SLM 文档模板和标准，包括协助服务目录。这些模板被作所有\
  \ `SLAs`、`SLRs` 和 `OLAs` 的起点，并提供了一种一致的方法和格式，使它们更容易维护和管理。\n\n## 服务水平管理的触发因素、输入和输出\n\
  \n让我们考虑服务水平管理流程的触发因素、输入和输出。SLM 是一个在整个组织及其各个流程中都具有许多活动连接的流程。明确定义触发因素、输入、输出和接口是非常重要的，以避免重复工作或工作流中的空白。\n\
  \n### 触发因素\n\n许多触发因素会启动 SLM 活动：\n\n*   服务组合的变化，例如新的或变更的业务需求，或新的或变更的服务\n*   新的或变更的协议、服务水平需求、服务水平协议、运营水平协议或合同\n\
  *   服务评审会议和行动\n*   服务违约或即将违反\n*   赞誉与投诉\n*   定期活动，如审查、报告和客户满意度调查\n*   战略或策略的变化\n\
  \n### 输入\n\n若干信息源与服务水平管理流程相关：\n\n*   来自组织业务战略、发展计划和财务计划的信息，以及当前和未来需求的信息\n*   业务影响分析，提供了与每个服务相关的影响、优先级、风险和用户数量的信息\n\
  *   业务需求，详细说明了任何约定的、新的或变更的业务需求\n*   来自服务战略的策略、策略和限制\n*   服务组合和服务目录\n*   变更信息，包括来自变更管理流程的\
  \ `RFCs`，变更进度表，需要评估所有变更对所有服务的影响\n*   配置管理系统，包含了业务服务、支持服务与技术之间关系的信息\n*   客户和用户的反馈、投诉和赞誉\n\
  *   来自 CSI 的改进机会\n*   其他输入，包括来自任何其他流程（例如事件管理、容量管理和可用性管理）的建议、信息和输入，以及现有的 `SLAs`、`SLRs`\
  \ 和 `OLAs` 以及过去关于交付质量的服务报告\n\n### 输出\n\nSLM 的输出应包括以下内容：\n\n*   服务报告，提供了与 `SLAs`\
  \ 中包含的目标相关的已实现服务水平的细节\n*   服务改进机会，用于纳入 CSI 注册表，并在稍后结合 CSI 经理进行审查和优先级排序\n\n\n\n\n\
  - 服务改进计划（SIP），提供涵盖优先级改进措施的整体方案或计划，包括适当的服务和流程，以及相关的影响和风险\n- 服务质量计划，应记录并计划服务质量的整体改进\n\
  - 用于服务水平需求捕获、服务水平协议（SLA）、运营水平协议（OLA）和合同的文档模板\n- 关于 OLA 和支撑合同的报告\n- 服务评审会议纪要和行动项\n\
  - SLA 评审和服务服务范围评审会议纪要\n- 更新的变更信息，包括变更请求（RFC）的更新\n- 支撑合同的修订需求\n\n### 服务水平管理接口\n\n\
  服务水平管理（SLM）与其他多个流程对接，以确保满足约定的服务水平：\n\n- 问题管理将处理任何影响目标的故障原因，并努力防止其再次发生，从而提高针对目标的服务交付能力。\n\
  - 可用性管理致力于消除可能导致停机的任何单点故障，并处理此类停机的原因，以便为客户提供指定的可用性水平。\n- 容量管理进行提前规划，以确保提供足够的容量，从而防止本会发生的服务故障。\n\
  - 事件管理侧重于解决事件并尽快恢复服务。通过识别约定的优先级来衡量事件解决目标的达成情况通常是 SLA 中的一个主要领域。\n- IT 服务连续性将计划确保在发生重大变故时服务继续提供；在无法防止服务中断的情况下，它将努力确保根据业务需求恢复服务。\n\
  - 信息安全确保客户数据得到保护，并将与服务水平经理合作，教育客户和用户了解其在该领域的自身责任。\n- 供应商管理确保支撑合同到位并正在被履行。\n- 服务目录管理提供支持\
  \ SLA 的服务相关信息。\n- 财务管理提供成本信息。\n- 设计协调确保设计符合服务水平需求（SLR）。\n- SLM 与持续服务改进（CSI）协作设计并实施服务改进计划（SIP）。\n\
  - SLM 与业务关系管理（BRM）合作。BRM 更关注战略、识别客户需求以及确保目标的实现。\n\n### 信息管理与服务水平管理\n\n服务水平管理是一个流程，提供有关运营服务的关键信息、其预期目标以及所有运营服务的服务达成情况和违约情况。这意味着它是整个生命周期中信息管理的重要组成部分。它协助服务目录管理管理服务目录，并提供有关客户满意度的信息和趋势，包括投诉和表扬。\n\
  \n服务提供者组织依赖服务水平管理提供的关于向客户提供的 IT 服务质量的信息。这包括客户对该服务质量的期望和感知信息。这些信息应供服务提供者组织的所有领域广泛获取。\n\
  \n### 服务水平管理流程角色\n\n本节描述了支持服务水平管理流程中需要执行的若干角色。这些角色并非职位名称，而是对成功运行该流程可能需要的角色的指导，每个组织必须根据自己的需求定义相应的职位名称和工作描述。第\
  \ 1 章“运营支持与分析简介”探讨了适用于整个服务生命周期所有流程的通用角色。那里描述的角色与服务水平管理流程以及我们在本章稍后讨论的供应商管理角色相关，但再次强调，还存在若干额外要求。\n\
  \n#### 服务水平管理流程所有者\n\n服务水平管理流程所有者的职责通常包括：\n\n#### 执行服务水平管理流程的通用流程所有者角色\n- 与业务关系管理流程所有者联系，确保两个流程之间进行良好的协调和通信\n\
  - 与其他流程所有者合作，确保服务目录管理、服务组合管理、服务水平管理和业务关系管理的设计与实现具有集成方法\n\n#### 服务水平管理流程经理\n\n服务水平管理流程经理的职责通常包括：\n\
  \n- 执行服务水平管理流程的通用流程经理角色\n- 协调与其他流程的接口，特别是服务目录管理、服务组合管理、业务关系管理和供应商管理\n- 关注不断变化的业务需求\n\
  - 确保客户当前和未来的服务水平需求被识别、理解并记录在 SLA 和服务水平需求文档中\n- 与内部或外部客户谈判并达成待交付的服务水平，并在 SLA 中正式记录这些服务水平\n\
  - 谈判并达成支撑 SLA 的 OLA\n- 协助服务组合、服务目录的编制和维护\n- 确保支撑合同中约定的目标与 SLA 和 SLR 目标对齐\n- 确保为每个客户生成服务报告\n\
  - 调查 SLA 目标的违约情况并采取行动防止其再次发生\n- 确保按计划进行服务绩效评审，并记录了约定的行动项\n- 确保服务改进倡议得到执行，并向客户提供进度报告\n\
  - 定期评审服务范围、SLA、OLA 和其他协议（理想情况下至少每年一次）\n- 评估所有变更对服务水平（包括 SLA、OLA 和支撑合同）的影响；这包括在适当的情况下参加变更委员会（`CAB`）会议\n\
  - 识别并与所有客户和其他关键利益相关者建立关系，以参与 SLR、SLA 和 OLA 谈判\n- 管理投诉，确保投诉被记录、在必要时升级并解决\n- 衡量、记录、分析和提高客户满意度\n\
  \n以下两个角色不是服务水平管理角色，但对于流程的成功执行至关重要。\n\n## 服务所有者\n\n服务所有者在服务水平管理流程中的参与包括：\n\n- 确保持续的服务交付和支持符合约定的客户需求\n\
  - 确保与客户就服务相关的查询和问题进行一致且适当的沟通\n- 提供有关服务属性的输入，如性能和可用\n- 参加外部服务评审会议（与业务部门）\n- 收集所需的数据、统计和报告用于分析并促进有效的服务监控和绩效\n\
  - 参与涉及服务的 SLA 和 OLA 谈判\n\n#### 业务关系经理\n\n业务关系经理在服务水平管理流程中的参与包括：\n\n- 确保高水平的客户满意度\n\
  \n\n\n* 在战略层面在服务提供商与客户之间建立并维护建设性关系\n* 确认客户的高级需求\n* 通过确保正确的客户代表参与，促进服务水平协议（SLA）谈判\n\
  * 识别改进机会\n\n### 服务水平管理的关键成功因素和关键性能指标\n\n`关键成功因素 (CSF)` 一词用于组织或项目实现其使命所必需元素。`CSFs`\
  \ 可用于识别成功的重要要素。这些要素通过关键性能指标 (`KPIs`) 进行衡量。理解每个每个 `SOA` 过程的 `CSFs` 将为用于证明成功的 `KPIs`\
  \ 提供坚实的基础。\n\n关键性能指标可用于判断服务水平管理活动的效率、效果以及服务改进计划的进展。\n\n`KPIs` 应该从服务、客户和业务的角度制定，并应涵盖主观（定性）和客观（定量）衡量。\n\
  \n客观衡量包括以下内容：\n* 达到服务目标的数量或百分比\n* 服务违的数量和严重程度\n* 拥有最新 `SLAs` 的服务数量\n* 拥有及时报告和活跃服务评审的服务数量\n\
  \n主观衡量可以是客户满意度的提高。\n\n以下列表包含了一些 `SLM` 的示例关键成功因素和关键性能指标：\n* `CSF`: 管理在提供和管理的数量数量和服务方面所需的\
  \ IT 服务整体质量。\n    * `KPI`: 受威胁的 `SLA` 目标减少百分比\n    * `KPI`: 通过服务评审和客户满意度调查响应，客户对\
  \ `SLA` 成果的感知和满意度提升百分比\n* `CSF`: 以合理的成本按照之前的约定交付服务。\n    * `KPI`: 已建立的完整 `SLAs`\
  \ 总数和增加百分比\n    * `KPI`: 与服务提供相关的成本减少百分比\n    * `KPI`: 服务评审会议的频率\n* `CSF`: 管理与业务和用户的接口。\n\
  \    * `KPI`: `SLAs` 覆盖的服务百分比增加\n    * `KPI`: 已建立记录并同意的 `SLM` 流程和程序\n    * `KPI`:\
  \ 证明服务和 `SLA` 评审中提出的问题正在跟进和解决的文件证据\n    * `KPI`: `SLA` 违约的数量和严重程度减少\n    * `KPI`:\
  \ 对所有 `SLA`、`OLA` 和基础合同违约的有效评审和跟进\n\n### 服务水平管理的挑战\n\n在引入服务水平管理时，你将面临许多挑战。这需要整个组织的协调和参与。\n\
  \n服务水平管理面临的挑战之一是识别用于谈判的合适客户代表。客户方谁“拥有”服务？\n\n如果之前没有服务水平管理的经验，可能会出现另一个挑战。在这种情况下，建议从服务水平协议草案开始。如果一个组织刚刚开始建立\
  \ `SLM` 且尚未对现有服务建立 `SLAs`，那么定义它们的过程可能需要对当前交付的服务水平进行监控、测量和报告，并利用这些信息指导与客户的谈判以建立可接受的目标。\n\
  \n有时遇到的一个困难是，客户群不同层次的人员可能有不同的目标和感知。\n\n### 服务水平管理的风险\n\n与服务水平管理相关的一些风险如下：\n* 业务和客户缺乏准确的投入、参与和承诺\n\
  * 缺乏所需的适当工具和资源\n* 过程变成官僚化的行政流程\n* 无法访问和支持适当且最新的 `CMS` 和 `SKMS`\n* 跳过服务水平管理流程\n*\
  \ 客户高预期和低感知\n\n## 供应商管理\n\nITIL 将 `供应商管理` 定义为负责从供应商处获得物有所的过程，确保与外部供应商的所有合同以及内部供应商的协议都支持业务需求，并确保所有供应商履行其合同承诺。\n\
  \n供应商管理过程描述了管理供应商的最佳实践，以确保他们提供的服务符合预期。它包含在服务生命周期的设计阶段，因为在设计服务时考虑这一方面至关重要。供应商关系的类型将是战略阶段的一部分，成功的服务过渡需要与供应商建立紧密的关系。一旦服务投入运行，必须对根据合同进行的日常交付进行监控和管理，如果出现任何问题，改进计划将由持续服务改进部门负责。\n\
  \n### 供应商管理的目的\n\n供应商管理的目的是确保供应商提供物有所值的服务。通过管理供应商，服务提供商可以确保为客户提供最佳服务。管理供应商可确保必要的合同已经建立并得到执行。某些服务提供商将拥有采购策略，确保服务的大部分或所有元素由服务提供者自己交付，而不使用第三方；而另一些则将使用第三方供应商来提供大部分服务。当服务提供取决于供应商的性能时，适当管理供应商是至关重要的，以确保所提供的服务达到要求的质量。\n\
  \n### 供应商管理的目标\n\n供应商管理过程的主要目标是从供应商和合同中获得物有所值，并确保与供应商的合同符合业务需求。这些合同应在服务水平管理的基础上，支持并与服务水平要求和服务水平协议中的指定目标保持一致。\n\
  \n### 供应商管理的范围\n\n供应商管理过程应包括对支持向业务提供 IT 服务所需的所有供应商和合同的管理。每个服务提供商应该有正式流程来管理所有供应商和合同。\n\
  \n供应商管理过程应包括供应商策略的实施和执行，包括供应商合同管理信息系统 (`SCMIS`) 的维护。确保供应商和合同进行分类并进行风险评估至关重要。需要对供应商和合同进行评估和选择，以引入合适的供应商。\n\
  \n该过程的关键部分是合同的开发、谈判和达成，包括合同评审、续约和终止。这是供应商及供应商管理的一部分。\n\n过程还将识别改进机会以纳入 `CSI` 注册表，以及实施服务和供应商改进计划。\n\
  \n供应商管理还将负责标准合同、条款和条件的维护；合同争议解决；以及在适用情况下对分包供应商的聘。\n\nIT 供应商管理通常必须遵守组织或公司标准、指南和要求，特别是公司法律、财务和采购的要求。\n\
  \n### 供应商管理对业务的价值\n\n\n\n该流程将管理与供应商的关系，并监控和管理供应商绩效。供应商管理负责与供应商谈判并达成合同协议，并在整个生命周期内对其进行管理。该过程由开发和维护供应商策略以及配套的供应商和合同管理信息系统（`SCMIS`）提供支持。\n\
  \n其目的是确保交付给业务的是端到端、无缝、高质量的 IT 服务，并符合业务预期。供应商管理流程应符合所有公司要求以及所有其他 IT 和服务管理流程的要求，特别是信息安全管理和\
  \ IT 服务连续性管理。这确保了业务能够从支持供应商的服务中获得价值，并确保这些服务与业务需求一致。\n\n## 供应商管理原则、政策和基本概念\n\n供应商管理流程旨在确保服务提供者从第三方供应商处获得合同中规定的服务水平。它确保供应商符合合同的条款、条件和目标。该流程旨在增加从供应商及其提供的服务中获得的物有所值感。\n\
  \n### 原则\n\n所有的供应商管理流程活动都应由服务战略中的供应商策略和政策驱动。供应商策略（有时称为采购策略）定义了服务提供者的计划，即其如何利用供应商的贡献来实现整体服务策略。某些组织可能采取仅在非常特殊和有限的情况下使用供应商的策略，而另一些组织可能选择在\
  \ IT 服务提供中广泛使用供应商。供应商对业务价值的贡献越大，服务提供者在供应商管理上投入的精力就越越多。在图 18.4 中，你可以看到流程与合同经理以及组织内各种供应商经理的互动。\n\
  \n![图像显示了合同经理与供应商经理（1 到 4）连接，通过服务连接到不同的供应商，最后供应商 3 和 4 分别连接到分包供应商 1 和 2。](img/00091.jpeg)\n\
  \n图 18.4 供应商管理：角色与接口\n\nCopyright © AXELOS Limited 2010\\. 保留所有权利。材料根据 AXELOS 的许可复制。\n\
  \n你还可以看到与财务、采购以及法律部门的互动，这些在与主组织之外的第三方往来时至关重要。\n\n你可以看到对供应商提供或其分包伙伴支持的服务的管理。\n\n\
  ### 政策\n\n供应商管理政策为服务提供者员工提供了根据采购策略管理供应商的指导。供应商政策可能涵盖以下领域：\n\n*   在与潜在供应商就招标、投标和采购过程进行沟通时的规定，以确保公平和客观。\n\
  *   与供应商互动时界定的职责。\n*   关于接受供应商礼品或促销品的规则，以防止在授予合同时产生偏见。\n*   供应商标准——例如，符合有关健康安全、多样性和最低工资的法律规定。这可能包括供应商反过来对其分包商施加的标准，特别是在低工资经济体中。出现过组织因媒体报道其供应链存在不当做法而感到尴尬的例子。\n\
  *   针对各种供应商合同类型和/或协议类型的标准和指南。\n*   与信息安全管理共同开发的关于数据所有权以及关于供应商访问系统的政策。\n\n### 基本概念\n\
  \n现在让我们来看一下涉及供应商管理的一些基本概念。\n\n基础合同和协议在本章之前已就服务水平管理进行了讨论过。它们与供应商管理也同样相关，因为基础合同是通过供应商管理流程进行管理的。合同在\
  \ IT 服务提供者和供应商之间提供了约束性的法律承诺。这些协议的典型内容包括：\n\n*   待提供的服务范围\n*   服务性能要求\n* 职责的划分与约定\n\
  *   联系点、沟通以及报告的频率和内容\n*   合同审查和争议解决流程\n*   价格结构\n*   付款条款\n*   变更和投资的承诺\n*   协议变更流程\n\
  *   保密和公告\n*   知识产权和版权\n*   责任限制\n*   各方的终止权\n*   终止时及之后的义务\n\n采购和法律部门将对这些合同的措辞提供意见。合同还可能包含其他相关文档作为附件，包括安全和业务连续性要求、所需的技术标准、迁移计划和披露协议。\n\
  \n供应商和合同管理信息系统是一个数据库或结构化文档，提供了管理供应商合同整个生命周期所需的所有信息存储库。它包含了所有合同和供应商的关键属性，以及每个供应商提供的服务或产品类型的细节，以及与其他相关\
  \ CI（配置项）的所有其他信息和关系。它应该是服务知识管理系统的一部分。\n\n对于组织而言，意识到供应商以及未能提供约定服务水平可能产生的影响是非常重要的。这要求根据供应商的价值、重要性、风险以及供应商未按合同履行时的影响对其进行分类，如图\
  \ 18.5 所示。\n\n![图表显示了商品供应商、运营供应商、战术供应商、运营供应商和战略供应商的价值与重要性的影响，按低、中、高范围排列。](img/00092.jpeg)\n\
  \n图 18.5 供应商分类\n\nCopyright © AXELOS Limited 2010\\. 保留所有权利。材料根据 AXELOS 的许可复制。\n\
  \n分类分为四层：\n\n*   **战略 (Strategic)**：适用于重大的“伙伴”关系，涉及高级经理共享机密战略信息以促进长期计划。此类关系通常在服务提供者组织的高级管理层进行管理和拥有，并涉及定期频繁的接触和绩效审查。\n\
  *   **战术 (Tactical)**：涉及重大商业活动和业务互动的关系。此类关系通常由中层管理负责，涉及定期的接触和绩效审查，通常包括持续的改进计划。\n\
  *   **运营 (Operational)**：适用于运营产品或服务的供应商。此类关系通常由初级运营管理负责，涉及偶尔但定期的接触和绩效审查。\n*   **商品\
  \ (Commodity)**：适用于提供低价值和/或易得的产品和服务的供应商，这些可以相对容易地替代采购。\n\n## 供应商管理流程、方法和技术\n\n\n\
  \n\n一旦作为服务交付整体方案的一部分定义了对供应商的要求，供应商管理过程就需要评估合适的供应商，并确保合同符合用途和使用需求。与新供应商建立关系，并确保采取了适当的措施和管理以监控供应商性能至关重要。所有合同都应关于续约和终止的说明，这些说明应包含在合同的定期审查中。\n\
  \n所有信息、报告和衡量措施都应存储在供应商和合同管理信息系统中。\n\n供应商管理的活动包括以下内容：\n\n* 定义新的供应商和合同需求\n* 识别业务需求并准备业务计划书，包括选项（内部和外部）、成本、时间表、目标、收益和风险评估\n\
  * 编写需求说明书 (`SoR`) 和/或招标邀请书 (`ITT`)\n* 确保符合策略/政策\n* 评估新的供应商和合同\n* 识别首选的购买或采购方式\n\
  * 建立评估标准——例如服务、能力（包括人员和组织）、质量和成本\n* 评估替代方案\n* 根据评估标准选择最佳供应商\n* 谈判合同、目标以及条款和条件，包括责任、关闭、续约、延期、争议和转让\n\
  * *同并授予合同\n* 对供应商进行分类\n* 维护 `SCMIS`\n* 评估或重新评估供应商和合同\n* 确保更改通过服务过渡进行\n* 在 `SCMIS`\
  \ 以及任何其他相关的公司系统中建立供应商服务和合同\n* 迁移服务\n* 建立联系和关系\n* 监控、报告和管理供应商性能，包括实施改进计划\n* 管理与供应商之间的关系\n\
  * 至少每年根据业务需求、目标和协议审查服务范围\n* 为可能的关闭、续约和延期做计划\n* 重新谈判并续约或终止和/或转移合同\n\n该过程应遵守公司的供应商管理策略，但应制定\
  \ IT 供应商策略来管理 IT 服务交付的特定需求。图 18.6 显示了供应商管理过程的主要活动。\n\n![图像显示供应商管理过程，如评估新供应商、建立、管理、合同续约、合同分类以及定义新的供应商和合同需求。](img/00093.jpeg)\n\
  \n图 18.6 供应商管理过程\n\nCopyright © AXELOS Limited 2010\\. 版权所有。材料根据 AXELOS 的许可进行复制。\n\
  \n### 供应商管理的触发因素、输入和输出\n\n我们现在将审查供应商管理的触发因素、输入和输出。\n\n#### 触发因素\n\n许多触发供应商管理活动的事件：\n\
  \n* 新或变更的公司治理准则\n* 新或变更的业务和 IT 策略、政策或计划\n* 新或变更的业务需求或新的或变更的服务\n* 协议中新或变更的要求，例如服务水平要求、服务水平协议、运营水平协议或合同\n\
  * 对设计和策略的审查和修订\n* 定期活动，如审查、修订或报告，包括对供应商管理策略、报告和计划的审查和修订\n* 其他领域（特别是 `SLM` 和信息安全管理）协助供应商问题的请求\n\
  * 新合同、合同续约或合同终止的需求\n* 供应商和/或的重新分类\n\n### 输入\n\n供应商管理过程有许多输入：\n\n* 业务信息\n* 供应商和合同策略\n\
  * 供应商计划和策略\n* 供应商合同、协议和目标\n* 供应商和合同性能信息\n* IT 信息\n* 性能问题\n* 财务信息\n* 服务信息\n* `CMS`\n\
  \n### 输出\n\n供应商管理的输出用于过程的所有其他部分、许多其他过程以及组织的其他部分。\n\n提供的信息如下：\n\n* `SCMIS`\n* 供应商和合同性能信息和报告\n\
  * 供应商和服务审查会议纪要\n* 供应商服务改进计划\n* 供应商调查报告\n\n### 供应商管理接口\n\n供应商管理与其他过程对接的关键接口如下：\n\n\
  **服务水平管理** 供应商管理为确定供应商的目标、要求和责任提供协助。`SLM` 协助供应商管理调查因供应商性能不佳导致的 `SLA` 和 `SLR` 违约。`SLM`\
  \ 也为供应商管理审查过程提供了宝贵的输入。\n\n**变更管理** 合同文件应通过变更控制进行管理。\n\n**信息安全管理** 信息安全管理依赖供应商管理来管理供应商及其对服务和系统的访问，以及他们在符合服务提供商\
  \ `ISM` 策略和要求方面的责任。\n\n**IT 服务财务管理** 该过程提供充足的资金来资助供应商管理需求和合同，并在购买和采购事务上提供财务建议和指导。\n\
  \n**服务组合管理** 该过程寻求供应商管理的输入，以确保所有支持服务及其细节和关系都准确地反映在服务组合中。\n\n**IT 服务连续性管理** 该过程在管理连续性服务供应商方面与供应商管理合作。\n\
  \n## 信息管理\n\n供应商管理所需的信息应存储在供应商合同管理信息系统 (`SCMIS`) 中，并形成 `CMS` 或服务知识管理系统 (`SKMS`)\
  \ 的部分。\n\n与供应商和合同相关的信息，以及与供应商提供的支持服务运行的所有信息都应存储在系统中。有关这些支持服务的信息也应包含在服务组合中，以及与其他服务和其他组件的关系。这些信息应与所有其他\
  \ IT 管理信息系统集成并维护，特别是服务组合和 `CMS`。\n\n### 供应商管理过程角色\n\n本节描述了支持供应商管理过程需要执行的职责。与本章之前描述的服务水平管理角色一样，这些是对第\
  \ 1 章所述适用于整个服务生命周期通用角色的特定额外要求。\n\n#### 供应商管理过程所有者\n\n供应商管理过程所有者的职责通常包括\n\n* 执行供应商管理过程的通用过程所有者职责\n\
  * 与业务合作，确保公司供应商管理和/或采购与供应商管理之间良好的协调和沟通\n* 与其他过程所有者合作，确保在供应商管理、服务水平管理以及公司供应商管理和/或采购过程的设计和实施采取集成方法\n\
  \n#### 供应商管理过程经理\n\n\n\n\n\n供应商管理流程经理的职责通常包括：\n\n*   履行该流程的通用流程经理角色\n*   协调供应商管理与其他流程之间的接口，特别是服务水平管理、企业供应商管理和/或采购流程\n\
  *   协助开发和评审针对第三方供应商的 `SLAs`、合同、协议或任何其他文档\n*   确保从所有 IT 供应商处和合同中获得物超值的价值（value for\
  \ money）\n*   确保所有 IT 供应商流程均保持一致性，并符合企业供应商策略\n*   维护供应商和合同管理信息系统\n*   定期对所有供应商和合同进行风险评估\n\
  *   确保所有支持服务都已界定并记录，显示供应商之间的接口和依赖关系\n*   确保主导供应商与分包供应商之间的关系已记录并正式化\n*   至少每年进行一次合同或\
  \ `SLA` 评审，在需要时进行更新并遵循变更管理流程\n*   以高效有效的方式处理合同纠纷\n*   处理服务的预期结束、提前结束或转移\n*   根据目标对供应商性能进行监控、报告和定期审查，根据实际情况识别改进措施，并确保这些措施得到实施\n\
  *   评估影响供应商、支持服务和合同的变化，并在适当的情况下参加 `CAB` 会\n*   确保服务提供商组织内为每个供应商和合同指定了专职负责人\n\n###\
  \ 供应商管理的关键成功因素与 KPI\n\n以下列表包含了一些供应商管理的关键成功因素示例。\n\n*   `CSF`：业务免受供应商性能不佳或中断的影响\n\
  \    *   `KPI`：符合合同目标的供应商数量增加\n    *   `KPI`：违反合同目标的情况减少\n*   `CSF`：支持服务及其目标与业务需求和目标保持一致\n\
  \    *   `KPI`：与供应商进行的服务和合同评审次数增加\n    *   `KPI`：与 `SLA` 和 `SLR` 目标一致的供应商和合同目标数量增加\n\
  *   `CSF`：服务的可用性不受供应商性能的影响\n    *   `KPI`：由供应商导致的服务违约次数减少\n    *   `KPI`：由供应商引起威胁的服务违约次数减少\n\
  \n### 供应商管理的挑战与风险\n\n我们将首先介绍该流程面临的主要挑战。\n\n### 挑战\n供应商管理面临许多挑战，可能包括：\n\n*   在交付现有服务的同时，管理不断变化的业务和\
  \ IT 需求以及重大变更\n*   处理被迫接受的非理想合同（即合同目标或条款条件不佳，或对服务或供应商性能目标定义模糊或不存在的合同，包括对提前退出有惩罚性罚金的合同）\n\
  *   遗留问题，特别是最近才外包的服务\n*   组织内部保留的专业知识不足\n*   关于费用的纠纷\n*   任何一方对另一方运营的干涉\n*   陷入日常的“救火”模式，丧失主动性方法\n\
  *   沟通不畅——互动频率不够或速度不够快，或者没有关注正确的问题（包括性格冲突和/或文化冲突）\n*   一方利用合同损害另一方利益，导致“赢-输”的转变，而非“合作共赢”的转变\n\
  *   失去战略视角，仅关注运营问题\n\n### 风险\n与供应商管理相关的主要风险领域包括：\n\n*   业务和高级管理层对供应商管理流程和程序缺乏承诺\n\
  *   缺乏关于未来业务和 IT 政策、计划和策略的适当信息\n*   供应商管理流程缺乏资源和/预算\n*   遗留了编写糟糕且已签署的合同，这些合同无法支撑或支持业务需求或\
  \ `SLA` 和 `SLR` 目标\n*   供应商人员或组织文化与服务提供商或业务不一致\n*   供应商与服务提供商的服务管理流程、政策和程序缺乏清晰度和整合\n\
  *   糟糕的企业财务流程（如采购和购买），无法支持良好的供应商管理\n\n## 总结\n\n本章探讨了涉及服务提议和协议的两个流程：服务水平管理和可用性管理。涵盖了流程的目的和目标，以及其范围和价值。我们回顾了流程的政策，相关的活动、方法和技术。\n\
  \n最后，我们回顾了流程的触发因素、输入、输出和接口；与流程相关的信息管理；以及涉及的角色。我们还考虑了每个流程的关键成功因素、关键绩效指标、挑战和风险。\n\n\
  ## 考试要点\n\n**理解服务水平管理和供应商管理的目的与目标。** 能够解释服务水平管理和供应商管理流程的目的与目标至关重要。服务水平管理应确保交付让客户满意并符合其需求。供应商管理应确保从与外部组织的所有合同关系中获得物超值的价值。\n\
  \n**理解服务水平管理的范围。** `SLM` 不包括对实用性（utility）方面的达成协议。服务功能（实用性）的需求谈判和协议不属于该流程范围，除非该功能在影响服务水平需求或目标的范围内。\n\
  \n**解释并区分供应商管理的不同阶段。** 理解合同谈判和供应商策略实施的重要性。\n\n**解释服务提供者的不同类别。** 提供者分为三类：可以嵌入到业务单元中（I\
  \ 类内部服务）、跨业务单元共享（II 类共享服务）、或是组织外部的（III 类外部服务）。III 类服务提供者与其外部客户签署的 `SLA` 将是法律合同，因为它们是独立的组织。\n\
  \n**理解流程的关键成功因素和关键绩效指标。** 对流程的衡量是理解成功的重要部分。你应该熟悉服务水平管理和供应商管理的 `CSFs` 和 `KPI`。\n\n\
  ## 复习题\n\n你可以在附录中找到习题的答案。\n\n1.  以下哪些陈述对服务水平管理的目的描述最准确？\n    1. 确保所有当前和计划中的 IT 服务均按照约定的可行目标交付。\n\
  \    2. 确保与客户建立高层关系以获取业务需求。\n    3. 确保用户对于所有运营问题都有单一联系点。\n    4. 确保服务在服务提供者之间进行平滑转换。\n\
  2.  以下哪项是服务水平管理的目标之一？\n    1. 监控整个生命周期的变化\n    2. 定义、记录、达成协议、监控、测量、报告和评审服务\n   \
  \ 3. 及时响应服务请求和咨询\n\n\n\n\n\n### 4. 高效且成本效益地建立事件和问题的根源\n\n### 3. 以下哪项*不属于*服务水平协议（SLA）？\n\
  1. 服务描述\n2. 服务时间\n3. 业务策略的定义\n4. 服务连续性安排\n\n### 4. 以下哪些协议通常有助于服务水平协议的达成？\n1. 运营级别协议（OLA）\n\
  2. 战略业务计划\n3. 支撑合同（UC）\n4. 内部财务协议\n1. 1, 2 和 3\n2. 1, 2 和 4\n3. 1 和 3\n4. 2 和 4\n\
  \n### 5. 以下哪项是对支撑合同（underpinning contract）的最佳描述？\n1. IT 服务提供者与同一组织内其他部门之间的协议，协助提供服务\n\
  2. IT 服务提供者与客户之间关于服务交付的协议\n3. 不同客户之间关于服务要求的协议\n4. IT 服务提供者与外部第三方组织之间的合同，协助服务的交付\n\
