- "# ITIL 中级认证伴读指南：中级 ITIL 服务能力考试\n\n\n\n\n*我们将本书献给我们长期支持的伙伴 Gary Cleaver 和 John Callaghan，当我们每晚和周末在笔记本电脑前苦苦撰写这本书时，他们为我们提供了食物、饮料和鼓励。*\n\
  \n# 致谢\n\n我们感谢多年来许多机构的同事，他们帮助我们努力将最佳实践付诸实施。特别是 Liz Gallacher 感谢 Dave Cousin，他鼓励她遵循直觉，并在两个重大项目中给了她实行的机会。\n\
  \n我们感谢在多年前我们的 ITIL V2 管理师课程中分享对服务管理热情的老师们：Ben Weston、Andrew Jacobs 和 Mark Haddad（教过\
  \ Helen），以及 Dave Wheeldon 和 Lloyd Robinson（教过 Liz）。我们将职业专注于 IT 服务管理的承诺可以追溯到那几个密集的周。\n\
  \n我们感谢我们教过的所有学生与我们分享他们的经验，感谢信任我们以及我们将理论付诸实践能力的客户。我们对服务管理的理解随着我们合作的每一个机构而增长和发展。\n\
  \n我们感谢各地的 ITIL 培训师，他们全年每周都在传播服务管理理念。\n\n感谢 Dave Jones 和 Jim Tebby 检查本书内容，以及他们提出的非常有用的建议。\n\
  \n# 作者简介\n\nLiz Gallacher 是一位拥有 30 年实战经验的服务管理顾问和培训师。她在 ITIL 管理师证书考试中列名前 5%，并受邀加入\
  \ ISEB V2 管理师证书考官小组。她持有 ITIL 专家认证，并是认证的 ISO/IEC 20000 顾问。\n\nLiz 就 IT 服务管理的各个方面提供咨询和培训，重点关注\
  \ ITIL 框架和 ISO/IEC 2000 标准。她曾为各种规模的组织设计并实施了涵盖服务管理许多领域的改进倡议。她在过去 30 年中的经验融合了咨询、培训和实施，包括为许多大型机构建立服务台、与客户合作设计服务管理流程，以及评估和实施符合其需求的服务管理工具集。她还为寻求\
  \ ISO/IEC 20000 标准认证的组织提供建议，进行差距分析、提供建议和指导改进计划等。\n\nLiz 曾工作于全球性组织、中央和地方政府部门、英国国家医疗服务体系（NHS）等许多其他机构。她曾从零开始建立服务管理机构。在每个案例中，她都设计并记录了流程、采购了服务管理工具集、推荐了组织结构、起草了职位描述，并在多个项目中招募了数百员工。随后，她培训了员工，并策划了相应的营销活动，向客户群推广新的服务台。\n\
  \n她曾为多个客户实施了服务改进倡议，将流程和工具的改进与针对 IT 员工的客户意识培训相结合。对于一家国家铁路基础设施机构，她实施了 24×7×365 服务台以取代了其他\
  \ 18 个支持来源，交付的服务被 Gartner 和 Maven 组织评估为“世界级”和“高效高效”。\n\n她曾就服务管理的许多方面提供咨询，包括服务水平管理、变更管理、请求履行以及事件和问题管理。她还编制了详细的服务目录。\n\
  \n\n\n\n\n对于许多客户，Liz 收集了工具集需求，评估了产品，并推荐了符合需求的产品。她还规定了支持相应流程的工具配置，交付了所需的报告，并监督了实施过程。她还交付了用户培训。\n\
  \nLiz 为客户开发并交付了涵盖服务管理特定方面的定制化培训。她还共同编写了涵盖 ITIL 框架的课堂和远程学习课程。她在范围内提供 ITIL 基础和中级培训及咨询，目前已在\
  \ 22 个国家（包括英国）开展课程。她与 Helen Morris 一设计了一种创新的混合方法，用于远程指导和支持客户。\n\n## Helen Morris\n\
  为组织提供高质量的培训和咨询，协助交付 IT 服务管理。她擅长为组织提供文化变革支持和培训，以充分利用实施服务管理最佳实践带来的益处。\n\nHelen 在服务管理方面拥有\
  \ 25 年以上的经验，包括服务台运营管理、技术支持团队和服务水平管理。她拥有 ITIL 专家认证，并多年提供服务管理培训。她现在于英国、欧洲和美国提供 ITIL\
  \ 基础和中级培训。她共同编写并录制了涵盖 ITIL 框架的远程学习课程。Helen 还是认证的 ISO/IEC 20000 顾问。\n\nHelen 是一位丰富的培训师、顾问和服务交付经理，专注于提供客户满意度和业务效益。她的许多任务涉及根据最佳实践进行初步评估、提出改进建议以及设定目标。她领导的项目在提高客户满意度、服务质量、降低成本和加强控制方面取得了显著改进。\n\
  \nHelen 曾在多次国际服务管理会议上发表演讲，并定期撰写关于服务管理主题的博客。她与 Liz Gallacher 设计了一种独特的指导方法，在为客户提供协助和资源的同时，鼓励他们培养所需的技能，而无需昂贵的现场咨询。\n\
  \n作为一名丰富的顾问，Helen 领导了多个成功的服务管理改进计划，与组织合作制定其服务管理战略，并成为组织内部实施该战略的关键人物。她在客户满意度、服务交付和合规标准方面实现了战略性的改进。\n\
  \nHelen 曾管理一家微软合作伙伴的支持环境，并支持了 Windows 95 的发布，实施了一项改进计划以实现所需的客户满意度目标。在此期间，Helen 还领导一个团队在部门内实现并维持了成功的\
  \ ISO 9001 合规。这包括对支持部门进行广泛的流程重组，以确保有高效有效的流程来支持客户满意度目标。\n\n在与一家蓝筹电信公司的任务中，Helen 作为\
  \ ITIL 推广的负责人，实施了将最佳实践引入服务交付管理团队的策略。这是该公司旨在实现 BS15000（ISO 20000 的前身）倡议的一部分，Helen\
  \ 是其中的核心关键人物，专门负责事件和问题管理。\n\nHelen 的许多任务涉及评估和重组支持环境，以提高成本效益和客户满意度。这通常需要跨业务的广泛领域进行工作，以便在组织内部达成一致的方法。Helen\
  \ 曾为一家外包提供商交付服务改进计划担任首席顾问；她为大量蓝筹和金融机构提供了支持服务和网络，这些服务由一个超过 120 人的服务支持职能交付。Helen 在三个月内将所有服务区域的服务水平从\
  \ 80% 提升并维持在 95%（目标值）。\n\nHelenHelen 和 Liz 共同撰写了成功的 Sybex *ITIL Foundation Study\
  \ Guide* 和 *ITIL Lifecycle Exams Companion Guide*。\n\n## 插图列表\n\n1. 第 1 章\n    -\
