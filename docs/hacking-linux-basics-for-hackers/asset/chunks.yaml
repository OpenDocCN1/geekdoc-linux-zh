    "domains" if! Defined ($ DomainFilename);# Do checking on input.die ("mountDomains:
    $ DomainFilename is a directory. \ n") if (-d $ DomainFilename);# Open $ DomainFilename.open
    (DOMAINFILE, $ DomainFilename) ordie ("mountDomains: Cannot open $ DomainFilename
    for input. \ n");while (<DOMAINFILE>) {chomp ($ _);print "Now checking: $ _";#
    Note difference in program output capture from "geturl.pl". open (EXECFILE, "$
