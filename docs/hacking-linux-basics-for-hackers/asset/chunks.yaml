  trans: "\n\n# 黑客的 Linux 基础 (HackingLinux Basics for Hackers) 第 1 版\n作者：Alexander\
    \ Aronowitz\n\n**去那些利用计算机技能在我们的社区中建立赌场的人，也去那些为了以此取快感而破坏网站的人。** 那些利用网络参与人口贩卖并支持恋童癖者的人！！！我们像\
    \ SD 同事做的那样，邀请通过邮件炸弹（mailbombs）摧毁恋童癖网站，或通知当局……\n\n最后，向大家问好，并祝阅读愉快……\n\n**注意：**\
    \ 本文档包含 C 语言代码 - **请确保不要保存任何修改**。如果你有任何本文未涵盖的其他漏洞利用程序（Exploits）、漏洞、嗅探器或工具，请发送电子邮件至：`lordkasko@freeweb.essenet.it`\n\
    \n通过这种方式，我们可以不断为你更新该工具包的最新版本！\n\n--------------------------------------------------\
    \ ----------------------------\n\n## 目录：\n- 注意事项 (notice)\n- 前言 (Preface)\n- 第一章\
    \ - 你必须掌握的 Unix 命令\n    - 1A. 基础命令\n        - 如何返回主目录\n        - 如何轻松进入用户目录\n\
    \        - 如何查看当前所在\n        - 如何获取每个命令的完整手册\n    - 1B. Telnet\n    - Unix 文件权限\n\
    \    - Unix 用户组\n    - 如何更改权限和组\n    - 1C. rlogin.rhosts\n        - 如何准备一个无需密码登录的\
    \ `.rhost` 文件\n    - 1D. FTP\n        - 连接到站点，但永远不要离开它\n        - 使用提示符、哈希值和二进制文件（bins）\n\
    \        - 使用 `get`, `put`, `mget` 和 `mput`\n    - 1E. GCC (Unix 编译器)\n      \
