    7BBackdoors------------Creating a backdoors is one of the simplest and equally
    mostsafeto maintain root access to a system. In addition to those already seenwe
    propose some ideas that you can easily realize.Backdoors provide two or three
    main functions:1\. "Grants" access to the system even if the administrator tries
    tomake itmore secure, for example by changing all passwords.2\. "Grants" access
    to the machine in a less visible way forthe administrator.Some of them can make
    you invisible to those who control thesystem.3\. Provides access to the machine
    much faster than whenhe tried to exploit it.Backdoors 1: Cracking the password
    fileOne of the oldest methods of gaining access to a system. Of thiswe talked
    about it in depth in chapter 2.Backdoor 2: Rhosts ++On Unix machines, some services
    like Rsh and Rlogin use a simple methodidentification based on the hostnames that
    appear in the .rhosts file.The administrator can choose which machines do not
    need passwords forconnect. Just insert the line "+ +" in the rhost file. In this
    caseanyone who remotely connects to that machine does so without entering thepassword.
    Each user also has a .rhosts file in his HOME. Ifmanages to modify it by adding
    "+ +" you can do a rlogin to that userand enter without password !!ATTENTION that
    many administrators check the presence of the two + in everyonethe .rhosts !!!!Backdoor
    3: Checksum and TimestampMany hackers replace system files with their own trojan
    horses.As many administrators rely on programs to find outwhich check the checksum
    and time-stamp like the famous UNIX sum.As a countermeasure, the hackers in turn
    built programs thatthey recreate the original time-stamp to the trojans. All this
    by sending backthe system clock to the time of the original file then changing
    the time oftrojan at system time. Once the trojan has the time of the originalthe
    system clock is reset.The sum program relies on checking the CRC of files but
    it often comesspoofes. We hackers have developed programs that modify Trojansin
    order to have the original checksum, driving admins crazy.MD5 checksum is based
    on an algorithm that no one has been able to do so farspoof.Backdoor 4: LoginIn
    UNIX the login program is the one that deals with the identification andcontrol
