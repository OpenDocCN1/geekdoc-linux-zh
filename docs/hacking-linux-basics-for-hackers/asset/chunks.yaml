    \n---\n\n### 重新排版后的文本示例（针对核心逻辑部分）\n\n由于原始文本包含大量重复和乱码，我为您提取了其核心技术逻辑并进行了规范化排版：\n\
    \n[content]\n# Unix 基础命令核心指南\n\n## 1. 基础命令 (Basic Commands)\n\n如果你对 DOS 有基础知识，这将会你有帮助。在本文档的左侧是\
    \ DOS 命令，右侧是对应的 UNIX 命令：\n\n- `ls`：查看当前目录内容。\n- `cd ~`：回到用户主目录。\n- `ls -l`：详细列表文件信息（权限、所有者、大小、等）。\n\
    - `pwd`：查看当前目录路径。\n\n在 Shell 中，你可以使用以下命令：\n```bash\ncd /path/to/directory\nls\
    \ -la\npwd\n```\n\n## 2. 文件权限管理 (Unix File Permissions)\n\nUnix 系统通过 `chmod` 命令来管理文件权限。\n\
    \n- `r` (read): 4\n- `w` (write): 2\n- `x` (execute): 1\n\n**示例：**\n```bash\n\
    chmod 755 filename  # 设置所有者读写执行，组和其他用户读执行权限\n```\n\n## 3. 影子密码文件 (The Shadow Passwd\
    \ File)\n\n在现代 Linux 系统中，`/etc/shadow` 存储了加密后的密码哈希。只有 root 用户可以读取。\n\n如果你拥有 root\
    \ 权限，可以使用以下命令查看：\n```bash\ncat /etc/shadow\n```\n\n## 4. 权限提升漏洞利用 (Earning the\
    \ Root Account)\n\n### SUID (Set User ID)\nSUID 权限允许普通用户以文件所有者（通常是 root）的身份运行程序。\n\
    查找具有 SUID 权限的文件：\n```bash\nfind / -perm -4000 2>/dev/null\n```\n\n## 5. 日志清理与隐藏\
    \ (Deleting Log Files)\n\n为了隐藏足迹，需要清理系统日志。常见的日志包括用户登录记录：\n- `/var/log/wtmp`：记录当前登录和退出记录。\n\
    - `/var/log/lastlog`：记录用户最后登录。\n- `/var/log/syslog`：系统通用日志。\n\n**清理示例：**\n```bash\n\
    echo > /var/log/wtmp\n```\n"
