    section.use Mount to access a unix system------------------------------------------This
    is not difficult and there are many systems that are mountable.Mount is a unix
    command that allows you to mount drives on remote machines.This is done so that
    you can install from other machines, or just forshare drives or directories within
    the network.The problem is that many admins are good connoisseurs of unix. Or
    maybe I''m alonea bit of a slacker and they mount drives with global access without
    understandingthat anyone can mount drives and have write access to directoriesof
    the users of that system.You need a hacked root account to get started. To mount
    a driveremote and access it you need to change the system passwd phile and use
    thecommand up.Ok, let''s say you have root access. Let''s begin!You can see if
    there are any drive mountables using the showmount command.From the Root account:$
    root> showmount -e wwa.commount clntudp_create: RPC: Port mapper failure - RPC:
    Unable to receiveOk, no problem, this domain doesn''t work, let''s try the next
    one$ root> showmount -e seva.netExport list for seva.net:/ var / mail pluto.seva.net/
    home / user1 pluto.seva.net/ usr / local pluto.seva.net, rover.seva.net/export/X11R6.3
    rover.seva.net/ export / rover rover.seva.net, pluto.seva.net/export/ftp/linux-archive/redhat-4.1/i386/RedHat
    (everyone)Note the word ''anyone'' (everyone), this would be fine if we wanted
    toinstall linux from this system, but we want to open theusers, so let''s go to
    the next ...$ root> showmount -e XXXXX.XXX <this worked ... now find it;)Export
    list for XXXXX.XXX:/ export / home (everyone)Now this guy has mounted his home
    directory, user accounts havefind outside the home;) and look ... (everyone) can
    access it !!!Ok this section was to show you how to see if I''m mountable, in
