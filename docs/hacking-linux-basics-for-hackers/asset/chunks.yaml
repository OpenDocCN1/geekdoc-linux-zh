    1 row2 row3----------------------------Now we need to learn about permissions,
    users andgroups.Line # 1 indicates the file permissionsLine # 2 indicates who
    owns the fileLine # 3 indicates the group to which the file belongsFile permissions
    are grouped into 3 different groups.If the line begins with a d, it is a directory,
    if there is no d, it is a file.- --- --- ---| | | | --------> Other = Anyone accessing
    the machine| | | ------------> Group = some groups can access| | ---------------->
    User = Only the owner can access| ------------------> Directory Marker- rw- r--
    r--| | | | --------> ''Other'' can only read files| | | ------------> ''Group''
    can only read the file| | ----------------> ''User'' can write the file| ------------------>
    It is not a directory- rwx rwx rx| | | | --------> ''Other'' can read and execute
    the file| | | ------------> ''Group'' can read and execute the file| | ---------------->
    ''User'' can write and execute the file| ------------------> It is not a directoryThe
    owner is the user name in line # 2 and the group name is the name inrow # 3\.
    In DOS, files have the extension .exe, .com, or .bat forexecutables, but in unix
    just the --x in your group ''user'', ''other'' and''group''You can change these
    permissions if you are the owner of the file or if you are ROOT:--------------------------------------------------
    -------------------------chmod oug + r filename will give read access to the file
    for all three groupschmod og-r filename will make the file readable only by the
    user who owns thefile. (note that - or + set the truth value of the file parameter).chmod
    + x filename will make the file executable by everyone.chown username filename
    will make the file property of another userchgrp groupname filename will make
    the file owned by another group--------------------------------------------------
