  \ `gotoif`, `gosubif`。**\n\n### B.86 `mailboxExists()`\n\n检查指定的语音信箱是否存在。\n\n> `mailboxExists(*mailbox[@context][,options]*)`\n\
  \n检查在 `mailbox` 中定义的语音信箱是否存在。如果正在检查的信箱不在默认上下文中，可以指定一个语音上下文。\n\n将通道变量 `VMBOXEXISTSSTATUS`\
  \ 设置为 `SUCCESS`（找到信箱）或 `FAILED`（未找到信箱）。\n\n选项 `j` 允许成功后跳转到优先级 n+101。\n\n> ![image](img/00702.jpg)\n\
