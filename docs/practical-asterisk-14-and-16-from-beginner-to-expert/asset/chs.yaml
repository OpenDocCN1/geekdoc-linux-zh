  \ 中不可用 另阅 Appendix C。\n\n### B.110 Page()\n\n呼叫一个分机。\n\n\n\n\n\n# Page(**technology*/*resource*[&*technology2*/*resource2*[&...]][,*options*])\n\
  \n指定的设备被放入一个动态生成的会议室，且其麦克风处于静音状态。唯一可以发送音频的设备是呼叫者的设备。当呼叫结束，会议室将被关闭。选项如下：\n\n- `d`:\
  \ 激活全双工音频。\n- `q`: 抑制呼叫开始时的提示音。\n- `r`: 将呼叫记录到文件中。\n\n```\nexten => 123,1,Page(SIP/2000&SIP/2001&SIP/2002)\n\
  ```\n\n### 提示\n大多数设备将呼叫视为其他任何通话。如果没有显式指示设备自动接听，它将只会响铃，预期的接收者将听不到消息。可以告诉 SIP 设备自动接听，通常通过设置\
  \ SIP 头部来实现。每个设备都不同；请查阅您的 SIP 电话管理手册。\n\n**Asterisk 版本：**\n![image](img/00783.jpg)\n\
