  \n### B.179 TryExec()\n\n尝试执行拨号计划应用程序。\n\n```\nTryExec(application(arguments))\n\
  ```\n\n像 `Exec()` 一样尝试执行拨号计划应用程序，但如果尝试失败（因为应用程序不存在或其返回了错误码），不会终止通话。相反，通道变量 `TRYSTATUS`\
  \ 将被设置为以下值之一：\n\n> • `SUCCESS`: 应用程序返回了 0。\n> • `FAILED`: 应用程序返回了除 0 以外的值。\n> •\
  \ `NOAPP`: 找不到应用程序。\n\n更多信息，请参阅 `exec`#Practical_As-sk_1.4_and_1.6_split_029.html_filepos89211)。\n\
  \n**Asterisk 版本：**\n\n![image](img/01025.jpg)\n\n**Asterisk 1.4 中此应用程序的内部帮助：**\n\
  \n> ![image](img/01026.jpg)\n\n**Asterisk 1.2 到 1.4 的内部帮助差异：**\n\nAsterisk 1.2 不可用。\n\
  \n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n\n> ![image](img/01027.jpg)\n\n另参阅 `exec`#Practical_As-sk_1.4_and_1.6_split_029.html_filepos89211,\
  \ `execif`#...filepos9501, `trysystem`#...filepos25783。\n\n### B180 TrySystem()\n\
  \n尝试执行 shell 命令。\n\n```\nTrySystem(command)\n```\n\n与 `System()` 一样在 shell（`sh`\
  \ 或等等物）上执行命令，但总是返回 0。相比之下，`System()` 在出错时返回 −1。\n\n将通道变量 `SYSTEMSTATUS` 设置为 `SUCCESS`、`FAILURE`\
  \ 或 `APPERROR`（命令已执行但返回了非零的退出码）。\n\n```\nexten => 123,1,TrySystem(echo 'Hey' > /tmp/hey.txt)\n\
  ```\n\n**Asterisk 版本：**\n\n![image](img/01028.jpg)\n\n**Asterisk 1.4 中此应用程序的内部帮助：**\n\
