  \n### B.42 DISA()\n\n直接入站系统访问（DISA）允许外部主叫进入系统并为他们提供内部拨号音。\n\n![image](img/00529.jpg)\n\
  \n为外部主叫方提供内部拨号音，使其能够像从内部分号拨打一样。\n\n#### 警告\n> 这种访问类型存在严重的安全风险，在使用前应仔细计划和考虑。\n\n\
  `password` 选项是必须在听到拨号音后输入的数字访问代码。如果你想允许无密码访问，请输入字符串 `no-password` 而不是实际密码。\n\n`context`\
  \ 选项指定了发起的通话放置的上下文。如果没有提供，`DISA()` 假设名为 `disa` 的上下文。`callerid` 选项设置邮箱（以及可选的 `voicemail-context`）。如果邮箱有新消息，主叫方将听到断续的拨号音以指示。\n\
  \n或者，你可以使用 `password-file` 定义多个访问密码。该文件的每行可以包含一个访问代码或通过管道字符分隔的访问代码和上下文。如果没有指定上下文，则假设\
  \ `disa`。\n\n如果主叫方通过有效的访问代码通过验证，`DISA()`将在指定的上下文启动通话。\n\n![image](img/00530.jpg)\n\
