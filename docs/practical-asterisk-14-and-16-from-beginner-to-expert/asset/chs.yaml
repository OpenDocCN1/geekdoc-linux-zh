  \ 中不可用。\n\n### B.82 Macro()\n\n执行之前定义的宏。\n\n> `Macro(macroname,arg1[,arg2...])`\n\
  \n执行之前定义的宏 `macroname`，将通道交给 `s` 扩展并在宏完成后返回。被调用的扩展、上下文和优先级传递给宏 `${MACRO_EXTEN}`、`${MACRO_CONTEXT}`\
  \ 和 `${MACRO_PRIORITY}`。参数传递给宏 `${ARG1}`、`${ARG2}` 等。如果宏中的任何步骤返回 -1，`Macro()` 返回\
  \ -1，否则返回 0。如果宏结束时设置了变量 `${MACRO_OFFSET}`，应用将在 `n+1+MACRO_OFFSET` 继续执行，否则将在 n+1。如果在宏内部调用了\
  \ `Goto()`，宏执行结束，通话在 `Goto()` 指定优先级继续。\n\n> ![image](img/00688.jpg)\n\n**Asterisk\
  \ 版本：**\n\n![image](img/00689.jpg)\n\n**Asterisk 1.4 中此应用的内部帮助：**\n\n> ![image](img/00690.jpg)\n\
  \n**Asterisk 1.2 到 1.4 的内部帮助差异：**\n\n> ![image](img/00691.jpg)\n\n**Asterisk 1.4\
  \ 到 1.6 的内部帮助差异：**\n\n> ![image](img/00692.jpg)\n\n另参阅 `macro`, `goto`, `gosub`。\n\
  \n### B.83 MacroExclusive()\n\n执行之前定义的宏，但在任何时刻只允许一个宏实例执行。\n\n> `MacroExclusive(*macroname,arg1[,arg2...])`\n\
  \n与 `Macro()` 相同，执行位于 `macroname` 中的宏，将通道交给 `s` 扩展并在宏完成后返回。如果在拨号计划的其他地方同时调用了相同的宏，则第二个实例必须等待第一个实例完成。\n\
  \n被调用的扩展、上下文和优先级传递给宏 `${MACRO_EXTEN}`、`${MACRO_CONTEXT}` 和 `${MACRO_PRIORITY}`。参数传递给宏\
  \ `${ARG1}`、`${ARG2}` 等。如果宏中的任何步骤返回 -1，`Macro()` 返回 -1，否则返回 0。如果宏结束时设置了变量 `${MACRO_OFFSET}`，应用将在\
  \ `n+1+MACRO_OFFSET` 继续执行，否则将在+1 继续。\n\n> ![image](img/00693.jpg)\n\n**Asterisk\
