  ### B.39 Dictate()\n\n虚拟录音机。\n\n```\nDictate*([path[,filename]]*)\n```\n\n启动一个虚拟录音机。选项定义了基础目录（默认：`/var/spool/asterisk/dictate/`）和（数字）文件名。文件以\
