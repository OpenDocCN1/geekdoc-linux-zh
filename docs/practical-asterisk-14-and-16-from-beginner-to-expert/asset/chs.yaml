  \ 1.6 的内部帮助差异：**\n> ![image](img/01297.jpg)\n\n### C.53 STRPTIME()\n\n`STRPTIME(*datetime|timezone|format*)`\n\
  \n将格式化的日期时间字符串转换为 UNIX 时间戳。\n\n> ![image](img/01298.jpg)\n\n**Asterisk 版本：**\n![image](img/01299.jpg)\n\
