  ### B.12 Authenticate()\n\n要求呼叫者在进入下一个优先级之前输入密码。\n\n> `Authenticate(password[,options[,maxDigits]])`\n\
  \n要求呼叫者在进入下一个优先级之前正确输入指定的密码。允许呼叫者在挂断前三次机会正确输入密码。\n\n如果 `password` 以正斜杠 (`/`) 开头，Asterisk\
  \ 将假设它是一个文件名，其中包含一个有效密码列表（每行一个）。密码也可以存储在 Asterisk 数据库 (`AstDB`) 中；请参见下文的选项 `d`。\n\
  \n允许以下选项（也可以组合使用）：\n\n> • `a`\n> (accountcode) 将 CDR 的 `accountcode` 字段和通道变量 `ACCOUNTCODE`\
  \ 设置为输入的密码。\n\n> • `d`\n> (database) 将输入的密码解释为 Asterisk 数据库中的键。如果使用了数据库键，则关联记录中的值将被忽略，且可以是任意的。\n\
  \n> • `r`\n> (remove) 在成功输入密码后删除数据库键（仅在使用选项 `d` 时有效）。\n\n> • `j`\n> (jump) 在三次尝试均失败的情况下，跳转到优先级\
  \ `n+101`（如果存在）而不是挂断。\n\n> ### 警告\n\n> 使用选项 `d` 时，请注意 Asterisk 寻找的是名称与密码等同的*键*（key）：例如\
  \ `/passwords/1234`。记录本身的值是无关的。一种更符合逻辑的实现是将密码作为值放置在记录中，例如 `/passwords/type => 1234`。\n\
  \n如果设置了 `maxDigits`，一旦用户输入足够的数字，输入就会结束；这节省了输入井号 (`#`) 的步骤。（默认：0；对输入无限制。）\n\n如果用户在三次尝试内输入了正确密码，则返回\
  \ 0，否则挂断通道并返回 −1。\n\n> ![image](img/00403.jpg)\n\n**Asterisk 版本：**\n\n![image](img/00404.jpg)\n\
  \n## Asterisk 1.4 中此应用程序的内部帮助：\n\n> ![image](img/00405.jpg)\n\n## Asterisk 1.2 到\
  \ 1.4 的内部帮助差异：\n\n> ![image](img/00406.jpg)\n\n## Asterisk 1.4 到 1.6 的内部帮助差异：\n\n\
  > ![image](img/00407.jpg)\n\n## 另参 `vmauthenticate`。**\n\n### B.13 Background()\n\
  \n在等待 DTMF 输入的同时播放声音文件。\n\n> `Background(soundfile[sound2][options][language])`\n\
  \n在等待呼叫者时播放指定的语音文件。允许组合以下选项：\n\n> • `skip`\n> 如果指定了 `skip`，如果未被接听，则跳过该通道。\n\n> •\
  \ `noanswer`\n> 只有在语音文件播放后才接听通道。\n\n`language` 参数可指定当前使用的语言。\n\n如果语音文件不存在则返回 −1，否则返回\
  \ 0。\n\n### B.14 BackgroundDetect()\n\n在等待音频的同时播放声音文件。\n\n> `BackgroundDetect(soundfile[,silence[,min[,max]])`\n\
  \n类似于 `Background()`，但会监听音频。如果检测到的音频大于 `min` 毫秒但小于 `max` 毫秒，随后是至少 `silence` 毫秒的静音，则停止播放并将通话交给\
  \ `talk` 扩展。\n\n如果未指定 `silence`、`min` 和 `max`，默认值为：1000ms、100ms 和无限制。\n\n如果语音文件不存在返回\
  \ −1，否则返回 0（例如播放被输入中断）。\n\n### B.15 Bridge()\n\n将活动通道与指定的通道连接。\n\n> `Bridge(channel,options*)`\n\
  \n成功或失败通过 `BRIDGERESULT` 变量信号。\n\n> • `SUCCESS`\n> 连接成功。\n\n> • `LOOP`\n> 你尝试将通道连接到自身。\n\
  \n> • `NONEXISTENT`\n> 目标通道不存在。\n\n> • `INCOMPATIBLE`\n> 通道使用了不支持的技术。\n\n> • `FAILURE`\n\
  > 其他错误。\n\n### B.16 Busy()\n\n将通道设置为“忙忙”。\n\n\n\n\n\n> `Busy([*timeout*])`\n\n指示通道为忙碌，并等待调用者挂机或超时（`*timeout*`，单位为秒）。\n\
  \n此应用程序仅在桥接通道上指示忙碌状态。每种类型的通道都有其指示设备忙碌的方法。要播放实际的忙音，请使用 `Playtones (busy)`。\n\n始终返回\
  \ −1。\n\n> ![image](img/00420.jpg)\n\n**Asterisk 版本：**\n\n![image](img/00421.jpg)\n\
