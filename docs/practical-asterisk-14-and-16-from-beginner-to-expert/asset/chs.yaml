  \n> ![image](img/01112.jpg)\n\n**另阅 `dahdisendkeypadfacility`。**\n\n## C. 拨号计划函数\
  \ (Dialplan Functions)\n\n除了几乎从一开始就是 Asterisk 一部分的拨号计划应用程序外，Asterisk 从 Asterisk\
  \ 1.2 版本开始支持函数。这是为了使 Asterisk 行为更像一个编程环境而长期努力努力部分。与应用程序不同，函数不能被直接调用。相反，它们在应用程序内部被调用并返回一个值，或者——背离了函数的经典定义——它们甚至可以使用应用程序\
  \ `Set()` 进行写入（参见 附录 B，“拨号计划应用程序](#Practical_As-sk_1.4_and_1.6_split_028.html_filepos692029)`）。函数名始终用大写字母编写。令人惊讶的是，函数的编写方式与变量相同，位于花括号内，并在前面带有一个\
  \ `$` 字符（`${}`）。这是必要的，因为字符串并不总是由引号界定的。\n\n我们对于批评 Asterisk 应用程序、函数甚至变量之间这种不那么直观的区分是可以被原谅的。此外，并没有统一的命名规范：例如，`SIP_HEADER()`\
  \ 使用下划线（`_`）断开，而 `SIPCHANINFO()` 则没有。这是许多编程语言和环境中共同的问题；这些习惯上的差异没有增加任何有用信息，反而增加了学习的难度。此外，分隔符——逗号（`,`）、安符（`&`）和管道符（`|`）的使用似乎是任意的。以写入变量的方式写入函数的概念，违背了几乎所有其他编程语言中函数的的基本定义，并持续导致困惑，特别是对于具有编程背景的新\
  \ Asterisk 用户。\n\n想象 Asterisk 中函数的更好方法是将其视为一个关联数组^(1)（哈希表是关联数组的一种形式）。例如：\n\n1. [`en.wikipedia.org/wiki/Associative_array`](http://en.wikipedia.org/wiki/Associative_array)\n\
  \n> ![image](img/01113.jpg)\n\n在 PHP 中看起来像这样：\n\n> ![image](img/01114.jpg)\n\n许多函数允许我们关联数组类比中的键为空。例如：\n\
  \n> `Set(GROUP()=outgoing)`\n\n尽管 1.4 版本有了显著的改进，但与“真实”语言相比，拨号计划编程仍然缺乏活性。如果这证明很困扰，你可能会考虑深入研究\
  \ Asterisk 扩展语言 (AEL)。它使用相同的函数和应用程序，但结构更健壮，且通常更容易解释。\n\n要查找你的安装中当前可用哪些函数，请在 CLI\
  \ 中输入 `core show functions` 和 `core show function FUNCTIONNAME`（对于 Asterisk 1.2\
  \ 使用 `show functions` 和 `show function FUNCTIONNAME`）。^(2)。这可以通过 `asterisk -r` 调用。注意这些命令对大小写敏感。函数名必须完全使用大写字母。\n\
  \n### C.1 AGENT()\n\n`AGENT(agentNumber[:field])`\n\n返回由 `agentNumber` 标识的座席信息。可以查询以下字段：\n\
  \n> `status`:（默认值）座席的状态，为 `LOGGEDIN` 或 `LOGGEDOUT`。\n> `password`: 座席的密码。\n> `name`:\
  \ 座席的名字。\n> `mohclass`: 等待音乐类别。\n> `exten`: 座席的回调号码。这由 `AgentLogin()` 使用。\n> `channel`:\
  \ 座席活动通道的名称（由 `AgentLogin()` 使用）。\n\n> ![image](img/01115.jpg)\n\n**Asterisk 版本：**\n\
  \n![image](img/01116.jpg)\n\n**Asterisk 1.4 中此函数的内部帮助：**\n\n> ![image](img/01117.jpg)\n\
  \n**Asterisk 1.2 到 1.4 的内部帮助差异：**\n\n在 Asterisk 1.2 中不可用\n\n**Asterisk 1.4 到 1.6\
  \ 的内部帮助差异：**\n\n无\n\n### C.2 ARRAY()\n\n`ARRAY(var1[,var2[,]])`\n\n同时设置多个变量。（该名称具有误导性；程序员应该注意，它的行为并不像数组那样。）`ARRAY()`\
  \ 只能用于写入，不能用于读取。记住用逗号分隔值，并用反斜杠（`\\`）转义逗号。以像写入变量的方式写入函数的概念，违背了几乎所有其他编程语言中函数的的基本定义，并持续导致困惑，特别是对于具有编程背景的新\
  \ Asterisk 用户。\n\n### C.2 ARRAY() 衔接部分\n\n> 重要：记住用逗号分隔值，并用反斜杠（`\\`）转义逗号。\n> `ARRAY()`\
  \ 只能用于写入，不能用于读取。\n> 误导性：`ARRAY()` 是一个误导性的函数。使用多个 `Set()` 语句：\n\n> ![image](img/01118.jpg)\n\
