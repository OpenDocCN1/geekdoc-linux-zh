  \ `minivmrecord`, 附录 C: `minivmaccount`，以及在 附录 C 中参见 `minivmcounter`。**\n\n### B.98\
  \ MinivmNotify()\n\n为新的 Mini-Voicemail 消息发送电子邮件通知。\n\n> `MinivmNotify(*user@domain*,*template*)`\n\
  \n向指定的电子邮件地址提供新的 Mini-VoiceMail (`minivm`) 消息的电子邮件通知。\n\n### Asterisk 版本：\n\n![image](img/00744.jpg)\n\
