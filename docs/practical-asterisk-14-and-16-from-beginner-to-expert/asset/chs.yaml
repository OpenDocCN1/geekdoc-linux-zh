  \n\n播放默认或用户特定的欢迎语（参见 Mini-VoiceMail (`minivm`) 的 `minivmaccmess`）。\n\n可能的选项设置：\n\
  \n> • `b`\n> 播放忙音消息\n\n> • `u`\n> 播放不可用消息\n\n> • `s`\n> 跳过留语音留言指令的播放\n\n允许允许组合使用选项，但同时使用\
  \ `b` 和 `u` 是没有意义的。如果设置了临时消息，则会播放该消息并忽略 `b` 或 `u`。\n\n### Asterisk 版本：\n\n![image](img/00742.jpg)\n\
