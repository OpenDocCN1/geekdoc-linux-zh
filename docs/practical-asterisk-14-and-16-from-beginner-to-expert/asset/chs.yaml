  \ `strftime`相同，默认为 `%c`；即取决于区域的日期时间格式。\n\n> ![image](img/01293.jpg)\n\n**Asterisk\
  \ 版本：**\n![image](img/01294.jpg)\n\n**Asterisk 1.4 中此函数的内部帮助：**\n> ![image](img/01295.jpg)\n\
