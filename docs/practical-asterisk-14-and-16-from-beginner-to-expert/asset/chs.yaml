  \ 号码（或名称）。如果给定了选项 `j`，则该号码存在于 AstDB 中且优先级 `n+101` 存在，通道将交给该优先级。如果没有可用的主叫 ID，则应用将不执行任何操作。\n\
  \n将通道变量 `LOOKUPBLSTATUS` 设置为 `FOUND` 或 `NOTFOUND`。\n\n要从 CLI 向黑名单添加号码，输入 `database\
  \ put blacklist` \"number\" \"1\"；同样，输入 `database del blacklist` \"number\" 删除条目，并使用\
  \ `database show blacklist` 列出数据库中的所有条目。\n\n> ![image](img/00679.jpg)\n\n你可以通过以下拨号计划项实现与\
  \ `LookupBlacklist()` 的效果：\n\n> ![image](img/00680.jpg)\n\n**Asterisk 版本：**\n\n\
  ![image](img/00681.jpg)\n\n**Asterisk 1.4 中此应用的内部帮助：**\n\n> ![image](img/00682.jpg)\n\
