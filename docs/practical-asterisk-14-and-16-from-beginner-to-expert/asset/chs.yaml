  \n### 2.4.1 配置语音信箱 (Voicemail)\n\nAsterisk 已经包含了一个可以使用的信箱模块。我们只需要通过 `/etc/asterisk/voicemail.conf`\
  \ 文件对其进行配置。首先，我们将现有的示例文件移动到我们的示例备份目录：\n\n> debian:/etc/asterisk# mv voicemail.conf\
  \ /var/tmp/asterisk-etc-backup/\n\n现在我们创建一个新的 `/etc/asterisk/voicemail.conf` 文件并输入以下内容：\n\
  \n> ![image](img/00018.jpg)\n\n现在信箱已经配置好了（是的，真的这么简单）。每个条目都以访问密码开始，然后是用户的全名，最后是用户的电子邮件地址。最后一步是在\
  \ `/etc/asterisk/extensions.conf` 中添加几行，将此语音信箱功能附加到我们的电话上。别忘记在 `Dial()` 中添加 `,20`：\n\
  \n> ![image](img/00019.jpg)\n\n完成！使用 `asterisk -vvvvvc` 启动 Asterisk 并从一个电话拨打另一个。（在正在运行的\
  \ Asterisk 中，在 Asterisk CLI 中输入 `reload` 即可使配置文件的任何更改生效。）在响铃 20 秒后（这就是 `Dial()`\
  \ 中设置 `,20` 的原因），你将被转接到语音信箱。如果被叫分站忙忙，通话将直接进入语音信箱。从任何电话拨打 `2999` 即可访问该电话的语音信箱菜单。\n\
  \n> ### 注意\n> 如果你的 Asterisk 服务器拥有一个可以工作的邮件传输代理（MTA）（例如 send-mail 或 postfix），新的语音信箱将以邮件附件的形式直接发送到\
  \ `voicemail.conf` 中指定的电子邮件地址。\n\n如果你想用密码保护信箱，或想查看语音信箱菜单，请参见第 9 章，“语音信箱](#Practical_As-sk_1.4_and_1.6_split_017.html_filepos385865)”。\n\
  \n### 2.5 使用上下文（Contexts）进行权限管理\n\n到目前为止，我们能够从任何电话拨打任何分机。对于小型私有系统，这足够了。大型系统以及连接到其他电话网络的系统需要某种方式来管理呼叫权限（即决定哪些电话和用户允许拨打到何处的规则）。Asterisk\
  \ 通过上下文（contexts）来实现这一点。\n\n将上下文想象成一种类别。每个类别包含关于可以拨号内容的规则。要访问上下文中的规则，电话必须是该上下文的成员，或者被另一个规则引导到该上下文。\n\
  \n#### 2.5.1 起始上下文\n\n我们还没有为配置的 SIP 电话指定上下文。在这种情况下，Asterisk 假设使用 `[default]` 上下文。如果我们想为特定的电话指定特定的上下文，我们在\
  \ `sip.conf` 中使用以下语法：\n\n> context = ContextName\n\n我们可以为 `[general]` 部分中的所有电话设置一个上下文，但该上下文可以按电话为单位进行重写。让我们来看两个例子。\n\
  \n#### 2.5.1.1 上下文示例\n\nABC 公司拥有电话 `10` 和 `11`（SIP 电话）。它们都位于 `[internal]` 上下文中。`sip.conf`\
  \ 文件如下：\n\n> ![image](img/00020.jpg)\n\n不过，你可以通过简单的方法实现相同的结果：\n\n> ![image](img/00021.jpg)\n\
