  \ 问题，尤其是在传真较长时。这主要是由于音频频道上的时钟时间不同造成的。ISDN 卡使用 PSTN 作为时钟来源；而模拟接口卡使用自己的、通常是内部（且往往廉价且不稳定）的时钟来源。结果是时钟差异，通过缓冲器进行管理。平均每两页后，缓冲器为空，你会丢失一部分音频，足以压倒传真错误校正。结果通常是传真图像出现黑线或间隙。在最佳情况下，什么都不可见；在最差情况下，传好[/content<unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk>\
  \ \"content\"\n\nWe need to produce translation. Let's translate each sentence.\n\
  \nOriginal English:\n\n\"In the early years of Asterisk, there was no affordable\
  \ echo cancellation, so Mark Spencer and others wrote software to perform the cancellation.\
  \ This necessitated breaking the in- and outbound audio streams into 1ms chunks.\
  \ For this reason, all the standard ISDN cards in use today set interrupts at 1ms\
  \ intervals for each B channel.\"\n\nTranslation: \"在 Asterisk 的早期，没有负担得起的回声消除，所以\
  \ Mark Spencer 等人编写了软件来执行取消。这要求将入站和出站音频流分成 1ms 的块。因此，当今所有的标准 ISDN 卡都会在每个 B 信道上设置\
  \ 1ms 的中断间隔。\"\n\nSecond paragraph:\n\n\"This historical artifact can lead to problems\
  \ in some applications. You probably won’t notice this if you use a single `PRI`\
  \ or `BRI` connected to modern server hardware. If you’re using a compact, embedded\
  \ system, however, even a simple `BRI` with two B channels can cause problems under\
  \ load. If you have a large system with multiple `PRIs` and interface cards, similar\
  \ problems can occur. Enough interrupts can bring the most powerful system to its\
  \ knees.\"\n\nTranslate.\n\n\"If you arele<unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk>\
  \ the the,\n\n\n\n\n> 电话交换站（FXS）是任何提供线路电池电压的设备。这通常意味着还有拨号音调和振铃电压。如果你需要为模拟电话、传真机和调制解调器提供服务，你需要一个\
  \ FXS 设备。墙上的电话插座就是一个典型的 FXS “设备”。\n\n### 8.3.1 连接模拟设备\n\nFXS 设备提供较大的电压；处于“挂机”状态的电话线电压可高达\
  \ `52` 伏特直流，而振铃线路的电压可以在 `90` 到 `110` 伏特交流之间！当你用赤手指接触裸露的活动线路线对时，请务必记住交流振铃电压。虽然振铃信号不太可能对你造成伤害，但那种电击感会让你非常不舒服！如果你想避免这一点，请佩戴手套。\n\
  \n> ### 警告\n> 如果你将接口卡上的 FXS 模块连接到电话插座，可能会永久损坏你的卡卡，甚至导致电话公司的服务中断！将卡卡连接到线路时请务必小心。绝对确保你正在将\
  \ FXO 设备连接到入入电话线对。某些接口卡实际上会用彩色 LED 点亮端口，以指示该端口是 FXS（通常为绿色）还是 FXO（通常为红色）。如果没有，在将接口卡安装到服务器之前，用标签或标记标记端口。\n\
  \n在电话世界中，极性由 `tip`（尖端）和 `ring`（环）术语描述，这对应于电话系统早期电话操作员使用的插头部分。\n\n- **Tip**：这是正极\
  \ (+)，或地（插头的尖端）。\n- **Ring**：这是负极 (−)，或电池（紧随尖端之后的环）。相对于地的环电压从 `−48 VDC` 到 `−52 VDC`\
  \ 不等。\n\n如果设备与线路之间的极性反反，在某些情况下会导致问题。例如，如果你有一部旧的双音多频（DTMF）电话（例如西电电气 2500 型），你将无法拨出；众之极性反反会导致噪声问题。即使大多数新设备都忽略极性，在整个布线系统中保持极性一致也是良好的做法。这样，你就可以确保你的电话系统能够与任何标准设备正常工作。\n\
  \n### 8.3.2 模拟电话适配器\n\n模拟电话适配器（ATA）允许你将模拟电话设备连接到 IP 网络（无论是 SIP 或 IAX2，几乎总是以太网）。与模拟接口卡上的\
  \ FXS 模块相比，其优势是简单且廉价（低至 50 美元）。此外，FXS 模块可能会受到 Asterisk 服务器附近组件噪声的影响；ATA 则不会遇到这个问题。ATA\
  \ 的一个主要缺点是它在传真方面并没有更好。\n\n一个 ATA 有一个以太端口和一个至少一个 `RJ-11/RJ-12` 电话端口，有时有两个。ATA 可以通过连接的电话或\
  \ Web 界面进行配置。ATA 可以直接到电话，也可以连接到建筑布线以支持多个分机共享线路。\n\nSIP ATA 的处理就像任何其他 SIP 电话一样，你需要在\
  \ `sip.conf` 为它创建一个项目。\n\n## 9. 语音信箱\n\n在本章中，我们将回顾 Asterisk 内置语音信箱的功能。请注意，这与交互式语音响应（IVR）系统不同，后者将在第\
  \ 10 章中深入介绍，即“交互式语音响应”。\n\n语音信箱是任何专业电话系统的基本组成部分。1\n\n为了向名为 Meridian Mail 的流行的 Nortel\
  \ Meridian PBX 语音信箱系统致敬，Asterisk 开发者将 Asterisk 语音信箱系统命名为 *Comedian Mail*。\n\n##\
  \ 9.1 示例实现\n\n接下来的示例将让你快速概述典型的配置。具体细节和特殊功能将在第 9.3 节](#Practical_As-sk_1.4_and_1.6_split_017.html_filepos392671)“拨号计划应用””中介绍。\n\
  \n### 9.1.1 示例家庭系统\n\n在家庭现代化的过程中，Robinson 一家人决定安装一套 Asterisk 系统，包括一个为每个家庭成员都提供信箱的语音信箱系统。\n\
  \n每个家庭成员都需要一个信箱。分机号码和信箱参数如表 9.1 所示。\n\n**表 9.1** Robinson 家庭信箱\n\n![image](img/00148.jpg)\n\
  \n`voicemail.conf` 看起来如下：\n\n```\n![image](img/00149.jpg)\n```\n\n在 `extensions.conf`\
  \ 中，我们如下将未接听的发送到语音信箱：\n\n```\n![image](img/00150.jpg)\n![image](img/00151.jpg)\n\
  ```\n\n更优雅的实现可以使用宏：\n\n```\n![image](img/00152.jpg)\n```\n\n### 9.1.2 示例业务系统\n\n\
  像 Widgets, Inc. 这样的公司需要一个更全面的语音信箱系统。在这个示例中，你将看到使用 Comedian Mail 可以做什么。\n\n每个语音信箱的默认设置如下：\n\
  \n- 语音信箱以 WAV 格式保存。\n- 每个信箱限制最多 200 条消息。\n- 语音消息的最大长度为 5 分钟。\n- 语音消息存储在系统中，并作为电子邮件附件发送给用户。\n\
  \n除了这些默认设置外，各部门对信箱还有额外的需求和要求，如表 9.2 所示。\n\n**表 9.2** Widgets, Inc. 信箱\n\n![image](img/00153.jpg)\n\
  \nWidgets, Inc. 的 `voicemail.conf` 看起来如下：\n\n> ### 警告\n> 除非另有说明，所有代码示例中的语句都应输入在单行。\n\
  \n```\n![image](img/00154.jpg)\n```\n\n在 `extensions.conf` 中，通话被发送到语音信箱的方式：\n\n\
  ```\n![image](img/00155.jpg)\n![image](img/00156.jpg)\n![image](img/00157.jpg)\n\
  ```\n\nWidgets, Inc. 的 `extensions.conf` 已经开始看起来有些复杂了。这是因为我们为不同的用户和部门使用了不同的信箱功能。某些员工有个人信箱，而销售部和接待处有群组信箱；此外，销售人员必须能够在不输入密码的情况下访问消息。对于个人员工来说，这必须尽可能简单和透明，因此我们将所有人的标准信箱访问号码设为\
  \ `800`。\n\n## 9.3 拨号计划应用\n\n我们可以在拨号计划（`extensions.conf`）中使用两个语音信箱应用：\n\n- `VoiceMail()`：此应用程序将呼叫者发送到语音信箱系统，在那里她被要求留言。\n\
  - `VoiceMailMain()`：此应用程序让接收者检查他们的语音消息并录制新的语音信箱提示。\n\n#### 9.3.1 VoiceMail\n\n此命令提示呼叫者留言语音消息。\n\
  \n`VoiceMail()` 命令始终从拨号计划（`extensions.conf`）调用，如下例所示：\n\n```\nexten => 2000,2,VoiceMail(2000,u)\n\
  ```\n\n该命令使用以下语法：\n\n`VoiceMail(*mailbox[@*context][,u|b|s])`\n\n- `mailbox`：这是信箱号码。这不需要与呼叫者拨的分的分号码相同；然而，这是一个明智的做法，特别是在较大的安装中。\n\
  - `@`context：信箱可以在特定的上下文中实现。如果没有提供上下文，则使用[默认]上下文。\n- 如果呼叫者在听提示时按下 `0`，应用程序将跳转到指定上下文中的扩展\
  \ `o`（小字母 o）。\n\n\n\n\n\n> 如果拨叫者在提示期间按下 `*`，应用程序将跳转到指定上下文中的扩展 a（小字母 a）。\n\n> • `[u|b|s]`\n\
  \n> • `u`\n\n> 导致播放“不可用”（unavailable）消息。该消息的路径为 `/var/lib/asterisk/sounds/vm-isunavail.gsm`。如果你使用的是预封装的\
  \ Asterisk，路径可能会不同（例如，`/usr/share/asterisk/sounds`）。\n\n> • `b`\n\n> 导致播放“忙忙”（busy）消息。该消息的路径为\
  \ `/var/lib/asterisk/sounds/vm-rec-busy.gsm`。\n\n> • `s`\n\n> 抑制“不可用”或“忙忙”通知的播放，播放蜂鸣声并开始录音。\n\
  \n如果在 `voicemail.conf` 中没有为该号码配置邮箱箱，但存在 `n`+101 优先级，Asterisk 将跳转到该优先级并在那里继续执行。\n\
  \n### 9.3.2 VoiceMailMain\n\n此命令允许用户访问其消息并允许他们录制提示音。\n\n###VoiceMailMain()` 命令始终从拨号计划（`extensions.conf`）调用。例如：\n\
  \n![image](img/00158.jpg)\n\n> • `mailbox`\n\n> 这是邮箱箱号码。如果没有提供邮箱箱号码，Asterisk 将提示输入。\n\
  \n> • `@context`\n\n> 指定邮箱箱的语音信箱上下文（在 `voicemail.conf` 中）。\n\n> • `[s|p|g(#)]`\n\
  \n> • `s`\n\n> 禁用密码要求。\n\n> • `p`\n\n> 询问用户邮箱箱号码。输入的数字将作为后缀附加到 `[mailbox]` 内容之后；例如，如果用户输入\
  \ 123，则调用 `[mailbox]123`。这让你能够轻松地配置邮箱箱组。\n\n> • `g(#)`\n\n> 在录制语音信箱提示时调整增益（单位为分贝）。\n\
  \n`VoiceMailMain()` 语音菜单的完整描述很难，因为它们取决于所安装的提示音。主要功能描述在[表 9.3]。\n\n**表 9.3** VoiceMailMain()\
  \ 的菜单结构\n\n![image](img/00159.jpg)\n\n### 9.4 voicemail.conf\n\n语音信箱在 `voicemail.conf`\
  \ 中配置。该文件有三个部分，在本节中进行了详细说明：\n\n> • `[general]`\n\n> 全局配置选项在此处。\n\n> • `[zonemessages]`\n\
  \n> 对于跨越时区的组织，特定时区的选项在此处。\n\n> • 定义的上下文\n\n> 如果组织有多个分支或部门，你可以在单独的语音信箱上下维护它们。\n\n\
  #### 9.4.1 [general]\n\n语音信箱系统的全局配置在此处。该部分的可用选项在此处详细说明：\n\n> • `attach = [yes|no]`\n\
  \n> 设置是否将语音消息文件附加到电子邮件通知中。默认：yes。使用由 `format=` 行中第一个条目定义的格式。\n\n> • `callback=[context]`\n\
  \n> 指定通过语音信箱系统进行回调的上下文。如果未设置，则无法从语音信箱进行回调。默认：unset。\n\n> • `charset=[charset]`\n\
  \n> 指定用于编码电子邮件文本的字符集。在此示例中，设置了 ISO Latin-1：\n\n> `charset=ISO-8859-1`\n\n> • `delete=[yes|no]`\n\
  \n> 设置在发送带附件的电子邮件通知后是否删除消息。如果用户仅通过电子邮件接收消息，这将节省服务器上的磁盘空间。\n\n> • `directoryintro=[filename]`\n\
  \n> 指定声音文件的文件名（在默认声音文件目录 `/var/lib/asterisk/sounds` 中找到），用于替代名称拨号（Dial-by-Name）系统的默认声音文件。\n\
  \n> • `emailsubject=[subject]`\n\n> 指定用于电子邮件通知的主题行。有关变量的信息，请参见 `emailbody`。文本不需要包含引号：\n\
  \n> `emailsubject=New message from ${VM_CALLERID}`\n\n> • `pbxskip=[yes|no]`\n\n\
  > Asterisk 在每条电子邮件通知的主题前加上缀 `[PBX]`。此目的是让将电子邮件通知过滤到特定文件夹更加简单，但如果不需要，可以使用 `yes` 进行抑制。\n\
  \n> • `emailbody=[email_text]`\n\n> 这指定电子邮件通知的正文文本，限制为 512 个字符。\n\n你可以在电子邮件通知的主题和正文中使用变量：\n\
  \n> • `${VM_NAME}`\n\n> 邮箱箱所有名称\n\n> • `${VM_DUR}`\n\n> 消息长度\n\n> • `${VM_MSGNUM}`\n\
  \n> 消息编号\n\n> • `${VM_MAILBOX}`\n\n> 邮箱箱号码\n\n> • `${VM_CALLERID}`\n\n> 呼号者名称\n\n\
  > • `${VM_CID}`\n\n> 呼号者号码\n\n> • `${VM_CIDNAME}`\n\n> 呼号者名称\n\n> • `${VM_DATE}`\n\
  \n> 通话日期和时间\n\n> • `${VM_MESSAGE}`\n\n> 消息文件文本需要单行：\n\n![image](img/160.jpg)\n\n\
  > • `serveremail=[address]`\n\n> 这指定电子邮件通知中显示的信封地址。这是一个示例：\n\n> `serveremail=voicemail@widgets`\n\
  \n> • `fromstring=[name]`\n\n> 指定电子邮件通知中的 From 头部。这对于过滤和排序很有用：\n\n![image](img/161.jpg)\n\
  \n> • `mailcmd=[mailer]`\n\n> 指定用于发送消息的命令。如果 `attach=yes`，则使用指定的第一个格式作为电子邮件附件。\n\
  \n> • `externnotify=[application]`\n\n> 指定当新消息到达时 Asterisk 调用的应用程序（包括绝对路径）。你可以将其用于自定义脚本：\n\
  \n> `externnotify=/usr/bin/local/send-sms.sh`\n\n> • `externpass=[application]`\n\
  \n> 指定当用户更改密码时 Asterisk 调用的应用程序（包括绝对路径）。你可以将其用于自定义脚本：\n\n> `externpass=/usr/bin/local/password-notify.sh`\n\
  \n> • `forcegreetings=[yes|no]`\n\n> 设置用户在首次登录系统时是否强制要求其录制新的欢迎语。默认是 no。\n\n> • `forcename=[yes|no]`\n\
  \n> 设置用户在首次登录系统时是否强制要求其录制姓名。默认是 no。\n\n> • `format=[gsm|wav]`\n\n> 定义用于保存语音信箱消息的解码器。如果指定了多个解码器，则消息将存储在每个格式中。\n\
  \n> 如果 `attach=yes`，则使用指定的第一个格式作为电子邮件附件。\n\n> 要仅以 WAV 格式保存消息，请使用：\n\n> `format=wav`\n\
  \n\n\n\n\n`maxsilence=[length_in_seconds]`\n设置系统在认为调用者已结束之前允许的静音秒数。\n\n- `silencethreshold=[threshold]`\n\
  指定 Asterisk 在测量 `maxsilence=` 时认为静音的最大音量。数值越小，检测越灵敏。默认值为 `128`。Asterisk 源代码中没有说明该值的范围或单位。唯一合理设置该值的方法是通过不断尝试（试错）。\n\
  \n- `maxlogins=[no_of_login_attempts]`\n设置 Asterisk 挂起之前允许的最大登录失败次数（例如用户输入了错误的密码）。默认值为\
  \ `3`。\n\n- `skipms=[milliseconds]`\n设置在播放消息期间，“跳进”和“回退”键向前或向后跳转的毫秒数。默认值为 `3000`。\n\
  \n- `usedirectory=[yes|no]`\n允许调用者访问按名称拨号（Dial-by-Name）系统。默认值为 `no`。\n\n- `saycid=[yes|no]`\n\
  设置在听到消息时是否播报调用者的电话号码。默认值为 `no`。\n\n- `cidinternalcontexts=[contextA,contextB,...]`\n\
  定义（通过逗号分隔的列表）当根据 `saycid=` 播报源起始电话号码时，哪些上下文被视为内部上下文。对于定义为内部的上下文，仅播报调用者的分机。没有默认值。\n\
  \n- `pagerfromstring=[sendername]`\n指定寻呼机（pager）通知的发送者。参见 `fromstring=`。\n\n- `pagersubject=[subject]`\n\
  指定寻呼机通知的主题。参见 `emailsubject=`。\n\n- `pagerbody=[body_text]`\n指定寻呼机通知的消息正文。参见 `emailbody=`。\n\
  \n除了此处记录的参数外，还有其他参数；尽管如此，这些是最常用的。可以在 `voicemail.conf` 的示例版本找到可用参数及其简要描述的完整列表。\n\n\
  ## 9.4.2 [zonemessages]\n\n在大型企业中，语音信箱用户可能分布在不同的时区；`[zonemessages]` 部分允许对应用户时区的时间播报。请注意，在此处定义的时区仍必须为单个用户激活。\n\
  \n`zonename=timezone | format`\n\n- `zonename`\n这是一个用于标识时区的任意标识符。允许使用小字母（a–z）、数字（0–9）、连字符\
  \ (-）和下划线 (_)）。\n\n- `timezone`\n大多数 Linux 发行版的时区信息存储在 `/usr/share/zoneinfo` 中。通常，时区文件按大陆、然后是或城市排序，并用\
  \ `/` 分隔。\n示例：\n![image](img/00162.jpg)\n\n- `format`\n定义时间播报的格式。通过变量实现，这些变量在表 9.4\
  \ 中进行了描述。\n\n**表 9.4 voicemail.conf 中的时间格式变量**\n\n![image](img/00163.jpg)\n\n其他允许的变量包括\
  \ `${ANY_VARIABLE}`（变量的内容）和 `'sound_filename'`。在指定声音文件时，注意不要添加文件扩展名（例如 .wav, .gsm）；系统将播放\
  \ `/var/lib/asterisk/sounds` 中指定的语音文件。单引号是强制性的。\n\n以下是可以在 `voicemail.conf` 中使用的的一些示例格式：\n\
  ![image](img/00164.jpg)\n\n#### 9.4.3 定义上下文\n\n与拨号计划（`extensions.conf`）一样，我们可以在\
  \ `voicemail.conf` 中定义上下文。这在需要按部门、分支或城市分离语音信箱访问时非常有用，并使得能够定义不同的按名称拨号目录。\n\n`default`\
  \ 上文是强制性的。对于大多数安装，这已经足够了。\n\n## 9.4.4 邮箱箱\n\n你可以在给定的上下文中配置任意数量的信箱。正确的语法如下：\n\n`mailbox\
  \ => password,name[,e-mail[,pager-e-mail[,options]]]`\n\n下面的示例将语音信箱的附件格式设置为 WAV，并在消息附到电子邮件上并发送后删除该消息：\n\
  \n```\n202 => 1,delete,attachfmt=wav\n```\n\n以下是参数的解释：\n\n- `mailbox`\n信箱号码（数字）。\n\
  \n- `password`\n信箱的密码。\n\n- `e-mail`\n发送到的电子邮件地址。\n\n- `pager-e-mail`\n应向寻呼机发送通知的电子邮件地址。\n\
  \n- `options`\n由逗号分隔的多个选项。\n\n- `tz`\n设置之前在 `[zonemessages]` 中定义的时区。\n\n- `attach`\n\
  如果定义，设置消息文件是否附接到电子邮件通知中。\n\n- `attachfmt`\n如果定义，则覆盖在 `[general]` 中设置的 `format` 值。\n\
  \n- `saycid`\n设置是否播报调用者的电话号码。\n\n- `sayduration`\n设置是否播报消息长度。默认值为 `yes`。\n\n- `saydurationm`\n\
  定义在播报时长之前消息的最小时长。默认值为 `0`。\n\n- `dialout`\n指定从消息拨出时上下文。除非设置了此参数，否则无法从语音信箱拨号。\n\n\
  - `sendvoicemail`\n设置用户是否可以向其他语音信箱用户发送消息。\n\n- `callback`\n指定从消息拨出使用的上下文。如果已定义，则可以给留言消息的人回电话。\n\
  \n- `review`\n设置留言消息的调用者在发送前是否可以听听。默认值为 `no`。\n\n- `operator`\n设置调用者是否可以通过按 0 在录制消息之前、期间或之后连接到人工台。在\
  \ Asterisk 中，人工台总是当前上下文中的 `o`（小写）分机。默认值为 `no`。\n\n- `envelope`\n设置在听到消息前是否播报消息信封信息。设置此参数将覆盖其他参数（例如\
  \ `tz`）。默认值为 `yes`。\n\n- `delete`\n设置在附接到电子邮件通知后是否删除消息。默认值为 `no`。\n\n- `nextaftercmd`\n\
  设置在当前消息保存或删除后，系统是否跳转到下一条消息。默认值为 `no`。\n\n- `forcename`\n如果设置为 `yes`，强制系统用户在首次访问系统时录制姓名。默认值为\
  \ `no`。\n\n- `forcegreetings`\n\n\n\n\n[content]\n\n> 如果设置为 `yes`，则强制系统用户在第一次访问系统时录制个人问候。默认值为\
  \ `no`。\n\n> • `hidefromdir=[yes|no]`\n\n> 设置该用户的信箱是否从按姓名拨号（Dial-by-Name）目录中隐藏。默认值为\
  \ `no`。\n\n### 9.5 按姓名拨号 (Dial-by-Name)\n\n虽然它本身并不是语音系统的一部分，但我们在这里讨论按姓名拨号目录是因为它是与\
  \ Comedian Mail 一起开发的，并从 `voicemail.conf` 获取配置。\n\n呼叫者被要求使用电话键盘输入姓氏的前三个字母（如果指定了选项\
  \ `f`，则使用名字）。该应用程序会在目录中搜索该条目，并在确认该条目正确后连接呼叫者。\n\n回到我们 Robinson 家族的示例，我们做了以下微小的更改：\n\
  \n> ![image](img/00165.jpg)\n\n从这里开始，生成按姓名拨号目录是非常简单的事情。我们在 `extensions.conf` 中使用\
  \ Asterisk 应用程序 `Directory()`：\n\n```\nexten => 800,1,Directory(default,from-internal)\n\
  ```\n\n`Directory()` 的通用语法如下：\n\n```\nDirectory(*vm-context[,*dial-context[,*options]])\n\
  ```\n\n> • `vm-context`\n\n> 目录始终从特定的上下文生成；也就是说，只有此定义上下文中的条目会被输入到中。在大多数情况下，`default`\
  \ 上下文就足够了。在较大的企业中，你可能希望按部门划分目录；在这种情况下，你需要额外的上下文。\n\n> • `dial-context`\n\n> 目录用于拨打给特定个人；`dial-context`\
  \ 定义了拨号时使用哪个上下文。如果未定义，则将使用 `vm-context`。\n\n> 如果呼叫者按下 0（零），通话将发送到此上下文中的 o（小写 o）分机。如果他按下\
  \ *（星号），通话将发送到 a（小写 a）上下文。\n\n> • `options`\n\n> 选项 `f` 设置按名字而非姓氏进行搜索。\n\n### 9.6\
  \ 在 voicemail.conf 中保存密码\n\n`voicemail.conf` 文件不需要仅作为目录源；它还可以用作密码的通用存储文件。你可能会遇到用户必须出于获取语音邮件以外的原因而进行身份验证的情况（例如，呼叫中心的坐席人员登录）。\n\
  \n因此，有时为为用户创建 `voicemail.conf` 条目，即使他们不需要信箱。不要担心呼叫者无意在无人信箱中留下留言；只有通过 `extensions.conf`\
  \ 中使用 `VoiceMail()` 或 `VoiceMailMain()` 显式引用的信箱，呼叫者才能访问。\n\n例如，你可以在 `voicemail.conf`\
  \ 的 `[call-center-agents]` 上文中创建两个条目：\n\n> ![image](img/00166.jpg)\n\n你可以使用这些条目通过拨号应用程序\
  \ `VMAuthenticate()` 验证用户身份（参见 附录 B，“拨号应用程序”）：\n\n> ![image](img/00167.jpg)\n\n\
  然而，不要让这个示例限制了你的创意。验证用户有很多方法，这只是其中一种。在 AstDB 或另一个数据库（例如 MySQL）中保存密码通常是更好的。\n\n##\
  \ 10 交互式语音响应\n\n交互式语音响应（IVR）系统允许计算机系统与电话呼叫者进行交互，呼叫者通过在电话上按下键盘（双音多频 [DTMF] 按键，又称\
  \ Touch-Tone）或通过说话（自然语言语音识别）向系统提供输入。大多数 IVR 系统提供选择菜单来路由通话而无需人工干预，但现代 IVR 系统也可以是处理信息或控制设备的复杂应用程序。\n\
  \n然而，所有 IVR 系统的共同原理是：呼叫者被读取菜单并从菜单中选择选项以执行操作，或者输入信息（以数字格式，通过按下键盘）。IVR 可用于获取股票报价、火车日程和天气预报；它们还可以用于自动购买系统，例如购买音乐会门票。潜在应用仅限于你的想象力。\n\
  \n系统的复杂性各异。最先进的系统使用文本转语音（TTS）系统实时生成语音文本，并通过语音识别接受用户的语音输入。如果实施得当，它们可以提供高水平的用户友好性，但由于实现非常复杂，除了大型组织外，很少使用。\n\
  \n最简单的 IVR 形式也是最常见的。预录消息播放给呼叫者；呼叫者通过 DTMF 键盘输入做出响应，Asterisk 在默认安装中可以轻松识别这种。\n\n\
  公众对 IVR 的意见不一。有些人认为它们是有用的自动化形式，而另一些人则认为它们极其令人沮丧。这通常是菜单设计不良或语音识别失败率过高的结果。良好的 IVR\
  \ 可以让客户感到愉快，但实施不当的 IVR 会吓跑她。(1\n\n### 10.1 简单的 IVR\n\n将预录消息播放给呼叫者；呼叫者用 DTMF 键盘输入做出响应，Asterisk\
  \ 在默认安装中可以轻松识别这种输入。\n\n标准 Asterisk 声音库包含一个名为 `marry.gsm` 的文件，内容为“结婚吗？按 1 同意，按 2\
  \ 否”。(2 Allison Smith 是一位专业的配音员，她是“Asterisk 的声音”。她的人气赢得了一群追随者。（强烈建议不要使用此 IVR 进行实际求婚。）要构建一个“求婚”应用程序，如下拨号即可：\n\
  \n> ![image](img/00168.jpg)\n\n如果呼叫者拨打分机 30，Asterisk 将接听并播放 `marry.gsm`。通过使用 `Background()`\
  \ 应用程序，用户可以在播放期间随时输入。输入将被解释为分机并传递到该分机。如果呼叫者按下 1，他将听到“感谢配合”，随后 Asterisk 将挂断。\n\n\
  > ### 注意\n\n>\n\n> `Playback()`（附录 B，“拨号应用程序](#Practical_As-sk_1.4_and_1.6_split_028.html_filepos692029)”）仅播放声音文件；忽略输入。`Background()`\
  \ 在播放声音文件时收听呼叫者的输入，该输入将像是直接拨打了分机号一样被解释为分机号。\n\n#### 10.1.1 超时\n\n如果你有多个分机以相同的数字开头，你需要留足够的时间让\
  \ IVR 识别所有组合。让我们查看以下示例：\n\n> ![image](img/00169.jpg)\n\n`Background()` 在每个数字后等待设定的时间，以区分\
  \ 1、10 和 100。一旦这段时间 `(TIMEOUT)` 到期，输入即被认为完成。\n\n> ### 提示\n\n>\n\n\n\n\n\n> `TIMEOUT`\
  \ 允许你设置其他超时时间。如需更多信息，请在 Asterisk CLI 中输入 `show function TIMEOUT`，或参见 Appendix C\
  \ 中的“Dialplan Functions”。\n\n`TIMEOUT` 以秒为单位定义，可以如下设置为拨号计划：\n\n```\nexten => 123,1,Set(TIMEOUT(digit)=3)\n\
  ```\n\n在此拨号计划中，如果按下 2，Asterisk 将立即继续；但如果按下 1，则只有在超时过期后才会继续。Asterisk 会智能地判断输入的数字是否可以匹配多个扩展，并据此采取相应。\n\
  \n### 10.1.2 无效输入（i 扩展）\n\n无效条目（任何在拨号计划中没有匹配扩展的条目）可以通过 `i` 扩展来处理。在下面的示例中，IVR 会向呼叫者播放道歉并挂断。（真实的\
  \ IVR 在遇到无效条目时可能会将呼叫者带回主菜单。）\n\n> ![image](img/00170.jpg)\n\n#### 10.1.3 暂停\n\n\
  为输入创建暂停的最简单方法是播放空声音文件。在 `/var/lib/asterisk/sounds/silence` 中可以找到一系列长度在 1 到 9 秒之间的静音声音文件。如果我们需要在提示后允许\
  \ 5 秒钟的时间（毕竟求婚需要深思熟虑），以下是实现实现的方法：\n\n> ![image](img/00171.jpg)\n\n### 10.2 多级 IVR\
  \ 系统\n\n多级 IVR 的问题在于，呼叫者必须多次输入单数字（通常是同一个数字），但会根据菜单层级获得不同的响应。在 Asterisk 中，一个数字在给定的上下文中只能使用一次。如果我们需要多个对相同数字提供不同响应的菜单，我们必须将子菜单放在不同的上下文中（例如示例中的\
  \ `[cafeteria]`）。我们使用 `Goto()` 应用程序在这些上下文之间跳转（参见 Appendix B）。假设你已经在 `/var/lib/asterisk/sounds`\
  \ 中存储了一些自定义声音文件。以下是这些文件及其包含内容的简要描述：\n\n> • `mainmenu.gsm`\n> “按 1 接销售，按 2 接服务，或按\
  \ 3 进入食堂。”\n> • `cafeteria.gsm`\n> “按 1 听本周的菜单，或按 2 听下周的菜单。”\n> • `cafeteria-menu-this-week.gsm`\n\
  > “周一：青酱酱面。周二：猪排骨……”\n> • `cafeteria-menu-next-week.gsm`\n> “周一：炖菜，包含面条、罗勒和，嗯，猪排……”\n\
  \n如果销售部位于扩展 100，服务部位于 150，则此 IVR 的拨号计划看起来如下：\n\n> ![image](img/00172.jpg)\n\n尽管技术上可以支持无限数量的\
  \ IVR 层，但在实践中，建议将菜单层级保持在三层以内。许多呼叫者在第三层菜单后就会挂断。\n\n### 10.3 文本转语音\n\n文本转语音（TTS）简单来说是通过语音合成将文字文本转换为口语。在我们的\
  \ Asterisk 系统中，这意味着外部程序使用给定的文本文件（通常为 ASCII 格式）作为源生成声音文件。生成的声音文件将像其他声音文件一样播放，呼叫者会听到文本被读出来。\n\
  \nTTS 引擎的差异差异。根据经验，开源引擎没有商业引擎那么复杂。\n\n> ### 提示\n> 有时你可以通过网络门户测试高质量的引擎。IBM 为其 TTS\
  \ 引擎提供了一个测试门户：[www.ibm.com/software/pervasive/tech/demos/tts.shtml](http://www.ibm.com/software/pervasive/tech/demos/tts.shtml)。像\
  \ IBM 一样，Cepstral 在 [www.cepstral.com/demos](http://www.cepstral.com/demos) 也有演示门户。\n\
  \nTTS 引擎 Festival ([www.cstr.ed.ac.uk/projects/festival](http://www.cstr.ed.ac.uk/projects/festival))\
  \ 是一个广泛使用的开源版本，但其包含的语音通常缺乏专业实施所需的质量，特别是当你需要英语以外语言的语音时。\n\n许多 Asterisk 开发者使用 Cepstral\
  \ 商业销售的引擎和语音 ([www.cepstral.com](http://www.cepstral.com))。在编写本文时，价格是合理的。这里描述的解决方案基于\
  \ Cepstral 引擎。如果你想用开源的 Festival，这些指令可以很容易修改以适用于它。这适用于其他 TTS 引擎。其实现模型是相同的。\n\n####\
