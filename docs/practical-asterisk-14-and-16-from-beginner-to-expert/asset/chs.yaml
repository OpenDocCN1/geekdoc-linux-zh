  \n无\n\n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n\n无\n\n另参见 `sayalpha`(#Practical_As-sk_1.4_and_1.6_split_031.html_filepos1147650),\
  \ `saydigits`(#Practical_As-sk_1.4_and_1.6_split_031.html_filepos1149636), `saynumber`(#Practical_As-sk_1.4_and_1.6_split_031.html_filepos1151633)。\n\
  \n### B.144 SayUnixTime()\n\n以自定义格式宣布时间。\n\n> `SayUnixTime([*unixtime*][*timezone*[,*format*]])`\n\
  \n根据指定的时区和格式宣布当前时间。允许的选项如下：\n\n> • `unixtime` UNIX 时间格式；即从元时间（1970 年 1 月 1 日 00:00\
  \ UTC）开始以来经过的秒数。接受负值。默认值为当前时间。\n> • `timezone` 时区。可以在 `/usr/share/zoneinfo` 中找到列表。默认是系统时区。\n\
  > • `format` 宣布的时间格式。允许格式列表可以在默认安装的 `voicemail.conf` 中找到。\n\n当前时间的格式默认值为 `IMp`。返回\
  \ 0 或 -1。\n\n> `exten => 123,1,SayUnixTime(IMp)`\n\n**Asterisk 版本：**\n\n![image](img/00911.jpg)\n\
  \n**Asterisk 1.4 中此应用程序的内部帮助：**\n\n> ![image](img/00912.jpg)\n\n**Asterisk 1.2 到\
  \ 1.4 的内部帮助差异：**\n\n无\n\n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n\n> ![image](img/00913.jpg)\n\
  \n### B.145 SendDTMF()\n\n在通道上发送 DTMF 信号。\n\n> `SendDTMF(*digits*[,*timeout*])`\n\
