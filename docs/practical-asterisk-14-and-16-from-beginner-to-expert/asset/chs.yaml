  \n# B. 拨号计划应用程序\n\n本附录详细描述了拨号计划应用程序（换言 `/etc/asterisk/extensions.conf`）的使用。应用程序包含在模块中，因此只有加载到\
  \ Asterisk 中的模块包含的应用程序对你的拨号计划可用。你可以通过 `/etc/asterisk/modules.conf` 配置文件的 `[modules]`\
  \ 部分定义将加载哪些模块，既可以使用通用的 `autoload=yes` 语句，也可以通过 `load => app_`*application_name`*.so`\
  \ 显式地加载特定模块。你可以在 Asterisk CLI 中调用 `core show applications` 命令来确定哪些应用程序对你可用。可以通过调用\
  \ `core application` *`application_name`* 查看特定应用程序的详细信息。\n\n\n\n\n\n`core application\
  \ xyz` 和 `core applications` 命令仅从 Asterisk 1.4 版本开始有效。如果你在使用 Asterisk 1.2，可以使用 `show\
  \ application xyz` 和 `show applications` 命令获得相同的结果。旧命令在 Asterisk 1.4 中仍然可用，但已弃用。\n\
  \n请注意不要将应用程序（applications）与函数（functions）混淆。函数作为参数调用应用程序。\n\n> ### Note\n> Asterisk\
  \ 配置文件使用了微软定义的模糊的 INI 格式，该格式没有一致的语法，更不用说已发布的语法。Asterisk 的配置解析器也没有遵循传统的词法分析、标记化和语法分析流程。这就是为什么\
  \ Asterisk 的分支版本 OpenPBX 的开发者切换到了 Mac OS X“属性列表”（`.plist`）配置文件格式。\n> 这只是想说明，由于缺乏规范，并不总是清楚在何时以及是否允许空格，或者在哪里需要引号。通常，接受多种格式。如果某种语法对你特定的\
  \ Asterisk 版本不起作用，唯一确定的方法就是进行更改并进行测试。\n> 正如既往一样，我们欢迎反馈。如果你在书中发现任何错误，请告知作者。\n\n在许多情况下，参数可能会被省略；你仍然需要包含逗号以指示空字段（通常意味着\
  \ Asterisk 将假设一个默认值），如下：\n\n```\nexten => s,1,Dial(IAX2/User:password@example.com/123,,tT)\n\
  ```\n\n通常，失败会导致返回代码 −1；成功返回 0。返回代码 −1 意味着 Asterisk 会挂断通道并停止处理该通话的拨号计划。\n\n> ###\
  \ Note\n> 参数分隔符是逗号（`,`）或管道符（`|`），取决于 Asterisk 的版本。本书使用逗号。\n\n丰富的 Asterisk 用户可能会疑惑为什么某些应用程序被省略了。原因很简单：某些应用程序在\
  \ Asterisk 1.2 中就已经弃用，并且在 1.4 中完全不存在。这些应用程序在这里没有被描述；你可以在 附录 C 中的“拨号计划函数”中找到替换它们的对应函数。**内部帮助文档的文件比较（“diffs”）总是将较新的\
  \ 1.4 与旧的 1.2 进行比较。\n\n示例使用了假设且任意选择的扩展 `123` 和优先级 `1`；在实践中，这并不总是实用的。\n\n在 Asterisk\
  \ 1.2 之前，许多应用程序会跳转到优先级 n+101（如果它存在，且 n 是当前优先级）。这种旧行为（被称为“优先级跳转”）可以通过某些命令的 `j`（跳转）选项启用，或者通过在\
  \ `extensions.conf` 的 `[general]` 部分设置 `priorityjumping=yes` 来启用。然而，这种行为已被弃用。目前接受的方法是查询通道变量。\n\
