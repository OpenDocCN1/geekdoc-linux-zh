  \ Festival）。\n\n![image](img/00268.jpg)\n\n## 16.2.3 Ruby 和 Adhearsion\n\n尽管 Ruby\
  \ 是一门较老的（按 IT 标准而言）编程语言，但它在过去几年里人气增长巨大，主要归功于 Ruby on Rails ([`rubyonrails.org`](http://rubyonrails.org))。Adhearsion\
  \ ([`adhearsion.com`](http://adhearsion.com)) 是一种用于 Asterisk 的 Ruby on Rails。这个主题既有趣又深奥，足以可以为此写一本专著。未来，我们将尝试扩展并更新本本书网站上对\
  \ Adhearsion 的覆盖范围。\n\n### 16.2.3.1 安装\n\n与任何优秀的开源项目一样，Adhearsion 的文档是碎片化且偶尔不完整的。幸运的是，安装相对简单，因为有一个\
  \ Ruby `gem`可用。（对于 Ruby 初学者，gem 是 Ruby 的包管理系统）。安装 Adhearsion 只需要在系统 shell 中输入 `gem\
  \ install adhearsion`。\n\n### 16.2.3.2 快速设置\n\n当你使用 Adhearsion 时，Asterisk 拨号计划变得短小易读。每个入站上下文只需要如下行：\n\
