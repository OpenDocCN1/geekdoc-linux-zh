  \n另参见 `strftime`。\n\n### C.54 TIMEOUT()\n\n`TIMEOUT(*type*)`\n\n在通道上读取/设置超时。允许的类型：\n\
  \n- `absolute`: 通话的绝对最大时长。一旦达到，通话将跳转到扩展 T（如果存在），否则挂断。值为 0 表示无超时。调用此函数时，现有设置将被重置并覆盖。超时计数器在调用此函数时开始，而不是在通话开始时。\n\
  - `digit`: 数字之间的允许最大时间。超过则认为输入结束。如果生成的扩展号不存在，通话将跳转到扩展 i（如果存在），否则挂断。默认为 5 秒。\n- `response`:\
  \ 等待用户输入的最大时间。如果用户未输入扩展号，通话将跳转到扩展 t（超时）（如果存在），否则挂断。默认 10 秒。\n\n> ![image](img/01302.jpg)\n\
  \n**Asterisk 版本：**\n![image](img/01303.jpg)\n\n**Asterisk 1.4 中此函数的内部帮助：**\n> ![image](img/01304.jpg)\n\
