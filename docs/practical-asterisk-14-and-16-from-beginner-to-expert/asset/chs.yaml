  \n> ![image](img/00218.jpg)\n\n## 15. Asterisk 的外部控制\n\nAsterisk 的最大优势之一是它允许管理员从\
  \ shell 或通过外部应用程序对其进行控制。\n\n### 15.1 asterisk -rx “command”\n\n从外部 shell 或应用程序控制\
  \ Asterisk 的简单方法是执行带有 `-rx` 选项的 `asterisk` 命令，随后跟接 CLI 命令。可以通过这种方式从系统 shell 中输入任何\
  \ CLI 命令。\n\n假设你想查看 `[my-phones]` 上文中分机 23 的拨号计划；你可以在 shell 中输入 `asterisk -rx \"\
  dialplan show 23@my-phones\"`：\n\n> ![image](img/00219.jpg)\n\n### 15.2 调用文件 (Call\
  \ Files)\n\n调用文件类似于用于 Asterisk 的 shell 脚本。用户或应用程序将调用文件写入 `/var/spool/asterisk/outgoing`，Asterisk\
  \ 会立即对其进行处理。\n\n> ### 提示\n\n> `mv`（移动）是一个原子操作（即在操作未 100% 完成之前不会生效的操作），因此非常适合 `.call`\
  \ 文件（前提是在同一个分区上进行）。使用 `cp`（复制）时，文件是逐行复制的，这可能导致 Asterisk 处理一个不完整的文件。\n\n#### 15.2.1\
  \ 自动拨打\n\n让我们通过一个示例来演示 `.call` 文件的原理。假设我们已经在 Asterisk 中注册了一个号码为 2000 的 SIP 电话。此外，我们在拨号计划中还有以下分机：\n\
  \n> ![image](img/00220.jpg)\n\n我们在 `/tmp` 中创建一个名为 `a-test.call` 的调用文件，内容如下：\n\n\
  > ![image](img/00221.jpg)\n\n现在我们使用 `mv /tmp/a-test.call /var/spool/asterisk/outgoing/`\
  \ 移动此文件：\n\n```bash\nroot@molokai:~>mv /tmp/a-test.call /var/spool/asterisk/outgoing/\n\
  ```\n\n发生了以下情况：\n\n* Asterisk 轮询 `/var/spool/asterisk/outgoing` 的新的调用文件并处理发现的任何文件。\n\
  * Asterisk 打开到 `SIP/2000` 的连接。如果设备被占用或未接听，Asterisk 将再次尝试两次（参见 `MaxRetries`）。\n*\
  \ 如果有人接听 `SIP/2000`，Asterisk 开始处理 `[call-file-test]` 上文的分机 `10`。在这种情况下，Asterisk\
  \ 向接听方播放 `hello-world`。\n\n在执行调用文件时，Asterisk 会比较修改时间与当前时间。如果修改时间在未来，Asterisk 将忽略该调用文件。这是实现基于时间的调用文件的一种简单方法。\n\
  \n#### 15.2.2 参数\n\n这些参数可以用于调用文件：\n\n* `Channel: <channel>`：发起通话的通道。使用与 `Dial()`\
  \ 命令相同的语法。\n* `Callerid: <callerid>`：通话时使用的主叫者 ID。\n* `WaitTime: <number>`：系统等待通话接听的秒数。\n\
  * `MaxRetries: <number>`：尝试失败时的最大重试次数。\n* `RetryTime: <number>`：等待下一次尝试的秒数。\n* `Account:\
  \ <account>`：用于 CDR 的账户。\n* `Context: <context>`：上下文。\n* `Extension: <exten>`：拨号计划开始的分机。\n\
  * `Priority: <priority>`：优先级：优先级。\n* `Set: <var=value>`：允许设置一个或多个变量。\n* `Archive:\
  \ <yes|no>`：默认情况下，调用文件执行后会被删除。如果设置 `Archive: yes`，它们将被复制到 `/var/spool/asterisk/outgoing`。\n\
  \n#### 15.2.3 闹钟示例\n\n酒店想要实现一个简单的闹钟系统。客户必须通过以下方式设置日期和时间：\n\n> ![image](img/00222.jpg)\n\
  \n### 15.3 Asterisk 管理接口\n\nAsterisk 管理接口 (AMI) 是一个强大的工具，允许外部应用程序与 Asterisk 通信并控制它。通过在\
  \ `manager.conf` 的 `[general]` 部分设置 `enabled=yes` 来启用 AMI。\n\n> ### 注意\n\n> 除非已采取数据包过滤（如\
  \ `iptables`、`ipfw`）、外部防火墙或 SSH 隧道进行保护，否则永远不要在公共访问的服务器上这样做。恶意人员可以利用它接管你的电话系统。\n\n\
  #### 15.3.1 创建 AMI 用户\n\n为了访问 AMI，我们需要创建一个账户。为此，我们在 `manager.conf` 末尾添加用户条目 `admin`：\n\
  \n> ![image](img/00223.jpg)\n\n`read` 和 `write` 后面的选项可以通过 CLI 中输入 `manager show\
  \ commands`（在 Asterisk 1.2 中为 `show manager commands`）来了解命令所需的权限。\n\n> ### 注意\n\n\
  > 这种慷大的权限分配仅用于测试目的！`command` 权限级别意味着用户可以停止 Asterisk。从 Asterisk 1.4 版本开始，可以通过 AMI\
  \ 修改拨号计划，这意味着甚至可以使用 `System()` 以 root 权限运行 shell 命令。\n\n#### 15.3.2 与 AMI 交互\n\n\
  重启 Asterisk 后，我们可以使用 `telnet` 从系统 shell 连接到端口 5038 上的 AMI：\n\n> ![image](img/00224.jpg)\n\
  \n在这里我们仅将 `telnet` 作为接口，而不是以传统的交互方式。现在你可以手动输入通常由多行组成的命令。例如：\n\n> ![image](img/00225.jpg)\n\
  \n\n\n\n\n> 所有命令包都以两个回车符结束。\n\n在输入命令并关闭后，你将收到一个响应：\n\n> ![image](img/00226.jpg)\n\
  \n当然，我们最感兴趣的是通过脚本实现这种交互自动化。\n\n> 注意\n\n> `Manager API` 并不以其能够优雅地处理多个并发连接而闻名（尽管这在\
  \ 1.4 版本中已经有了巨大的改进）。如果你预见到会有这种负载，考虑使用一个 `AMI` 代理是值得的，它可以处理许多连接并将它们封装在单个连接中。这对于访问\
  \ `AMI` 的脚本来说是完全透明的。当然，如果只是为了玩玩的话，这并不是必要的。\n\n身份验证成功后，数据包可以双向发送。包类型始终由第一行决定。客户端发送\
  \ `Action` 包，服务器用 `Response` 回答，或者发送 `Event` 包。否则，数据包中行的顺序无关。每行以回车符（十进制 ASCII 13）和换行符（十进制\
  \ ASCII 10）的组合（`CR LF`）结束。整个包以额外的 `CR LF` 组合结束。\n\n`AMI` 客户端通常会在每个 `Action` 中发送一个随机但唯一的\
  \ `ActionID`，服务器在响应中使用它来管理重叠的数据包流。例如，它可以是脚本名称、时间戳和序列号（例如：`testscript.php-1169405408-1`）。\n\
  \n服务器向客户端发送 `Event` 包，这些包可以引用任何事件；也有由于客户端发起的 `Action` 结果产生的事件。在这种情况下，服务器会发送 `Response:\
  \ Follows`，然后是事件（这些事件将包含触发动作的 `ActionID`）和一个结束事件（通常是 `actionnameComplete`）。\n\n\
  如果你的客户端不需要事件，可以通过在认证包中包含 `Events: off` 来关闭这些通知。一旦设置，`AMI` 将仅对客户端发起的动作发送响应。\n\n截至本文编写时，Asterisk\
  \ 发送的事件实际上没有完善的文档。你可以在 [www.voip-info.org/wiki/view/asterisk+manager+events](http://www.voip-info.org/wiki/view/asterisk+manager+events)\
  \ 找到一个细节稀疏的列表。一些额外的解释可以在 [`asterisk-java.sourceforge.net/apidocs/net/sf/asterisk/manager/event/package-frame.html`](http://asterisk-java.sourceforge.net/apidocs/net/sf/asterisk/manager/event/package-frame.html)\
  \ 找到。这主要是 Asterisk-Java 的文档。\n\n### 15.3.3 AMI 命令\n\n可以在 CLI 中通过 `manager show commands`（或\
