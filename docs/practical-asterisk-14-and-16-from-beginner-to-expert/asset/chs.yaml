  \ 额外资源\n\n你遇到了问题但在书中没有找到答案吗？这里是你的选择：\n\n> • [www.voip-info.org](http://www.voip-info.org)\n\
  \n> 该网站专门用于通用 VoIP 和 Asterisk，它提供了大多数问题的解决方案。遗憾的是，许多文章都包含错误。如果你发现了，请修复它！下一个访问者将感激不尽的。\n\
  \n> • IRC 频道\n\n> 有一个 Asterisk 的 IRC 频道，位于 [irc.freenode.net](http://irc.freenode.net)\
  \ 的 `#asterisk`。有时你可以在那里获得你问题的快速答案，但请注意：某些频道参与者对懒惰的忍忍度较低。仔细思考你的问题会增加成功的几率。通常，“描述你的问题就解决了一半”这一格言是适用。\n\
  \n> 如果你是 IRC 新手，你可以在 [`en.wikipedia.org/wiki/Internet_Relay_Chat`](http://en.wikipedia.org/wiki/Internet_Relay_Chat)\
  \ 了解更多信息。\n\n> • 邮件列表\n\n> Digium 邮件列表并不适合所有人。该列表的信息量极大，新用户可能会很快被淹没。尽管如此，它仍有一些显著的优势：Digium\
  \ 的员工会阅读它，并且他们经常回答问题。你还可以获得比 IRC 通常更详细的答案。你可以在 [www.asterisk.org/support](http://www.asterisk.org/support)\
  \ 和 [`lists.digium.com`](http://lists.digium.com) 找到如何订阅邮件列表。\n\n> • 邮件给我\n\n> 如果其他方法都失败了，你总是尝试联系\
