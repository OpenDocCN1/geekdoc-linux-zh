  \n## 16.2.4 其他编程语言\n\n记住，你可以用任何语言编写 AGI 程序。已经为许多流行的语言提供了库，包括：\n\n* Java\n* Perl\n\
  * PHP\n* Python\n* Ruby\n* C\n\n最简单的方法是使用关键词 AGI 和你想使用的语言进行网络搜索。\n\n## 17. 传真服务器\n\
  \n人们曾尝试将 Asterisk 与传真进行完美整合，但结果不一致。长期以来，位于 [www.soft-switch.org](http://www.soft-switch.org)\
  \ 的 `app_rxfax` 是被接受的做法。遗憾的是它容易出错且不可。传真往往碎片化到达，或者糟糕的是完全没有。因此，我们在这里描述一种使用 IAXmodem\
  \ 的更可靠的方案（参见 [`iaxmodem.sourceforge.net`](http://iaxmodem.sourceforge.net)）。\n\n\
  IAXmodem 模拟了一个调制真器，可以由管理员选择的传真应用操作。我们将使用 Hylaf。\n\n### 17.1 安装 IAXmodem\n\nIAXmodem\
  \ 通过 IAX2 为 Asterisk。本章的所有步骤必须由 root 用户执行。\n\n为了安装 IAXmodem，我们需要一些 Debian 包，可以使用命令\
  \ `apt-get -y g++ libtiff-tools libtiff4 libtiff4-dev` 安装。\n\n![image](img/00272.jpg)\n\
  \n我们进入相应的目录 `cd /usr/src` 以安装 IAXmodem 源码：\n\n![image](img/00273.jpg)\n\n\n\n使用\
  \ `cd iaxmodem-0.3.0:` 进入解压后的目录。\n\n> ![image](img/00275.jpg)\n\n现在使用 `./configure\
  \ && make` 编译源码：\n\n> ![image](img/00276.jpg)\n\n使用 `cp iaxmodem /usr/bin/` 将生成的二进制文件拷贝到\
  \ `/usr/bin`：\n\n> ![image](img/00277.jpg)\n\n## 17.1.1 配置 IAXmodem\n\n现在我们可以配置调制解调器了。IAXmodem\
  \ 期望在 `/etc/iaxmodem` 中找到配置文件。使用 `mkdir /etc/iaxmodem` 创建该目录：\n\n> ![image](img/00278.jpg)\n\
  \n使用 `touch /etc/iaxmodem/ttyIAX0` 创建配置文件：\n\n> ![image](img/00279.jpg)\n\n该文件必须包含以下参数：\n\
  \n> • `device`\n> 在 `/dev` 中创建的设备节点。这是 Hylafax 用于连接到 IAXmodem 的设备。你可以选择任何喜欢的名称，但我们倾向于遵循惯，因此选择适用于串口接口的设备名称\
  \ ttyIAX0。\n\n> • `owner`\n> 设备的所有者（格式为 `user:group`）。最好使用与运行 Hylafax 相同的的用户和用户组。\n\
  \n> • `port`\n> IAXmodem 监听的端口。Asterisk 使用 4569 监听 IAX2 连接，因此你必须选择其他端口（例如 4570）。\n\
  \n> • `refresh`\n> 这设置了 IAXmodem 在与 Asterisk 注册之间等待的时间。如果此数字为 0，则调制解调器将完全不注册。\n\n\
  > • `server`\n> 运行 Asterisk 的服务器 IP 地址。如果它与 IAXmodem 在同一台机器上，使用本地地址 127.0.0.1。\n\
  \n> • `peername`\n> IAXmodem 向 Asterisk 注册时使用的名称。\n\n> • `secret`\n> 用于 Asterisk\
  \ 注册的密码。\n\n> • `codec`\n> IAXmodem 使用的编码器。允许的编码器有 `alaw`、`ulaw` 和 `slinear`。压缩编码器不适合传真；传真传输本身是压缩的，且无法容忍进一步压缩；此外，大多数压缩编码器是有损的，而传真传输无法容忍损失。这是通过\
  \ VoIP 传真仍然存在问题的主要原因之一。\n\n使用合适的编辑器（例如 vi），我们在 `/etc/iaxmodem/ttyIAX0` 文件中写入以下配置：\n\
  \n> ![image](img/00280.jpg)\n\nIAXmodem 现在已配置完成并可以启动。此操作方法是使用 `init`。通过 `echo \"\
  IA00:23: respawn:/usr/bin/iaxmodem ttyIAX0\" >> /etc/inittab` 在 `/etc/inittab` 中添加一行来启动\
  \ IAXmodem：\n\n> ![image](img/00281.jpg)\n\n设备名称 ttyIAX0 与 `/etc/iaxmodem` 中指定的设备相同。\n\
  \n## 17.1.2 配置 faxgetty 和日志\n\n为了接收传真，我们需要一个在 IAXmodem 上监听连接的 getty。这通过在 `/etc/inittab`\
  \ 中添加额外的条目来实现。使用 `echo \"mo00:23:respawn:/usr/sbin/faxgetty ttyX0\" >> /etc/inittab`\
  \ 添加它：\n\n> mo00:23:respawn:/usr/sbin/faxgetty ttyX0\n\n使用 `mkdir /var/log/iaxmodem/`\
  \ 为 IAXmodem 创建日志目录，并使用 `touch /var/log/iaxmodem/ttyIAX0` 和 `touch /var/log/iaxmodem/iaxmodem`\
  \ 创建日志文件：\n\n> ![image](img/0082.jpg)\n\n为了确保所有内容在启动时按预期启动，使用 `shutdown -r` 重启系统：\n\
  \n> ![image](img/00283.jpg)\n\n## 17.2 安装 Hylafax\n\n我们将从 仓库安装 Hylafax 以简化安装。使用\
  \ `apt-get -y install hylafax-server.`。依赖关系会自动解决：\n\n> ![image](img/00284.jpg)\n\
  \n下一步是配置传真服务器。使用 `faxsetup` 执行：\n\n> ![image](img/00285.jpg)\n\n在接下来的 2 或 3 个问题后直接按回车：\n\
  \n> ![image](img/00286.jpg)\n\n我们用 `yes` 确认重启服务器，并被询问是否安装调制解调器。我们的 IAXmodem 已经设置好了，所以我们可以继续并再次确认为\
  \ `yes`。\n\n指定调制解调器并按回车确认：\n\n> ![image](img/00287.jpg)\n\n后续有很多问题，但只有少数真正重要。在这里你设置国际拨号代码、传真号码、国家和区代码以及\
  \ CSID（呼叫用户 ID），CSID 会打印在接收端传真页的第一行。用 `yes` 确认。\n\n> ![image](img/00288.jpg)\n\n\
  随后是一个确认页面，你可以在其中双击检查输入：\n\n> ![image](img/00289.jpg)\n\n\n\n\n要做到此点，配置文件 `/var/spool/hylafax/etc/FaxDispatch`\
  \ 必须包含以下参数：\n\n> • `SENDTO`\n\n> 接收传真的目标电子邮件地址。\n\n> • `FILETYPE`\n\n> 附件的格式。除了\
  \ `pdf` 之外，`tiff`（标记图像文件格式）和 `ps`（Postscript）也是可接受的选项。\n\n参数使用等号设置，就像在 Asterisk\
  \ 配置文件一样：\n\n![image](img/00300.jpg)\n\n保存文件后，你必须使用 `/etc/init.d/hylafax restart`\
  \ 重启传真服务器：\n\n![image](img/00301.jpg)\n\n我们可以通过使用 `sendfax -n -d <faxnumber> <file.txt>`\
  \ 向自己发送一份传真来测试电子邮件传输：\n\n```bash\ndebian:~# sendfax -n -d 6045557977 /etc/issue.net\n\
  ```\n\n短段时间后，你的目标电子邮件地址应该收到一封格式如下的邮件：\n\n![image](img/00302.jpg)\n\n附件将是一个 PDF 文件。在这个示例中，PDF\
  \ 命名为 `fax000000016.pdf`。\n\n现在你不仅可以发送和接收传真，收到的传真作为电子邮件附件接收。\n\n# 18. 忙灯字段、提示、摘机\n\
  \nPhilipp Kempgen\nStephen Bosch\n\n忙灯字段（Busy Lamp Field，简称 BLF）是许多现代电话系统的常用功能。BLF\
  \ 可以彩色 LED 灯或 LCD 指示器，允许用户监控系统中其他用户的状态，它通常紧邻一个按钮，根据指示器的状态对被监控的分机执行操作。尽管它最常见于前台交换机，但也可以出现在普通的桌面电话上。\n\
  \n指示器告诉操作员线路的状态。线路可以有多种状态：\n\n> • 响铃\n> • 忙或“使用中”（通常包括激活的“请打扰”状态）\n> • 待机\n> • 空闲\n\
  \n这些状态可以通过 LED 灯指示（根据状态可能会改变颜色或闪烁）或 LCD 图标指示（改变外观；例如，为使用中的线路提供“请勿进入”标志）。并非所有型号的电话都提供所有状态。\n\
  \n如果系统经过此类配置，可以将按钮配置为在分机响铃时“摘机”通话。（对于某些电话，这是通过输入功能代码实现的。）\n\n我们在这里介绍了 Asterisk 和一些选定\
  \ SIP 电话的这些功能的配置。\n\n## 18.1 控制指示器\n\nBLF 通过提示（hints）和订阅（subscriptions）实现。提示告诉 Asterisk\
  \ 监控 SIP 通道的状态。SIP 设备可以订阅这些提示，当状态发生变化时，Asterisk 会向订阅的设备发送事件数据包以通知它们状态的变化。\n\n###\
  \ 18.1.1 sip.conf\n\n为了让 BLF 能够工作，必须在 `sip.conf` 的 `[general]` 部分添加一些额外的条目：\n\n\
  ![image](img/00303.jpg)\n\n单个 SIP 账户需要 `subscribecontext` 和 `call-limit` 条目。第一个参数\
  \ `subscribecontext` 告诉 Asterisk 检查哪个上下文（context）来判断此用户想要订阅另一个用户的提示。大多数情况下，这与所有其他内部用户的上下文相同。第二个\
  \ `call-limit` 限制了该用户允许的并发通话数（当值大于 0 时）。这很重要，因为它告诉 Asterisk 如何设置相关分机的状态。例如，如果通话限制设置为\
  \ 2，且该分机有一个活动中的通话，则 Asterisk 将该分机视为空闲。如果已经有两个活动中的通话，那么 Asterisk 将该分机视为为忙碌。至少设置为\
  \ 2 是最佳的；较低的设置可能会导致通话转移问题。\n\n对于摘机功能，额外的参数 `callgroup` 和 `pickupgroup` 是重要的。例如，具有\
  \ `pickupgroup=2` 的 SIP 用户只能摘取具有 `callgroup=2` 的其他用户的通话。这可以用于管理权限；但由于总只有 64 个可能的组（0\
  \ 到 63），所以这仅适用于中小型环境。对于规模较大的安装，所有的……\n\n### 18.1.2 sip. .\n\n如果系统经过此类配置，可以将按钮配置为在分机响铃时“摘机”通话。（对于某些电话，这是通过输入功能代码实现的。）\n\
  \n我们在这里介绍了 Asterisk 和一些选定 SIP 电话的这些功能的配置。\n\n## 18.2 订阅\n\n本节为感兴趣的人提供了订阅的技术背景知识。这对于配置目的来说并不是真正需要的。如果你只是想配置你的电话，请继续到下一节。\n\
  \n## 18.3 为 BLF 配置电话\n\n要实际使用 BLF，你必须在你想要用于监控的电话上配置 BLF。这将因你使用的每种电话型号而异。我们在这里简要介绍了常用的电话，以帮助你入门。请注意，固件（以及配置参数）可能会随时更改。最终解释为准，请查阅你正在配置的电话的文档。\n\
  \n\n\n*集中配置*（Central provisioning）是指通过中央服务器（无论通过 TFTP、FTP、HTTP 或其他手段）分发配置文件来对电话进行配置的术语。集中配置的设置超出了本章的讨论范围。由于集中配置是配置电话的一种非常常见的方法，而且对于大型安装来说是必须的，大多数制造商会在电话的管理员指南（而非用户指南）中提供此类说明。\n\
  \n## 18.3.1 Aastra 480i 上的 BLF\n\nAastra 电话像大多数 IP 电话一样可以通过 Web 界面或配置文件进行配置，电话会从配置服务器（几乎总是\
  \ Asterisk 服务器本身）加载配置文件。\n\n### 18.3.1.1 通过网页浏览器配置\n\n找到电话的 IP 地址。你可以在电话上按下 `Options`\
  \ 键并滚动到 `Network Setup`（网络设置）来执行。（默认密码为 `22222`。）\n\n在同一网络的计算机的网页浏览器中输入 IP 地址。此时，系统会提示你输入用户名和密码。默认情况下，用户名为\
  \ `admin`，密码为 `22222`。登录后，点击左侧配置菜单中的 `Operation` 部分下的 `Softkeys` 和 `XML`。图 18.1\
  \ 显示了软键配置页。\n\n**图 18.1** Aastra 480i 忙灯字段（Busy Lamp Field）网页配置。\n\n![image](img/00313.jpg)\n\
  \n选择你想配置的按键并将类型设置为 `BLF`。Aastra 电话会自动压缩空闲屏幕上的软键。例如，如果你只配置了按键 5，它将在你的电话上显示为按键 1。\n\
  \n`Label` 字段设置 BLF 的显示名称，其值是你想要监控的分机号码。右侧的复选框（`Idle` 空闲、`Connected` 已连接、`Incoming`\
  \ 接入和 `Outgoing` 呼）决定了按键在哪些状态下显示。（因为按键可以设置为执行各种功能，你可能并不是每种状态下都需要它们。）默认设置通常足够了。\n\
  \n一旦输入了所有需要的 BLF 设置，必须在重启电话之前保存设置。`Save Settings` 按钮位于窗口的左下角。（在上面的图中可见，因为你需要向下滚动才能看到。）通过点击左侧的\
  \ `Operation` 并点击 `Reset` 然后 `Restart` 来重启电话。\n\n### 18.3.1.2 通过配置文件配置\n\n配置 BLF\
  \ 的另一种方法是通过中央服务器对电话进行配置准备。\n\nAastra 电话可以通过 `aastra.cfg` 文件进行全局配置，也可以通过包含电话 MAC\
  \ 地址作为文件名的配置文件进行单台电话配置，例如 `00085D1840D1.cfg`。\n\nAastra 480i 的 BLF 配置示例如下：\n\n>\
  \ ![image](img/00314.jpg)\n\n注意，这并不是整个配置文件。虽然你可以将这些行放在文件中的任何位置，但为了清晰起见，将它们放在一起是有意义的。\n\
  \n在配置文件中，激活 BLF 至少需要三个参数；这里列出了四个。所有参数均带有 `softkeyN` 前，其中 `N` 是软键的编号：\n\n> • `type`\n\
  \n> 这设置按键类型。Aastra 具有高度可配置的软键。你需要指定想要让按键执行的功能类型。在这种情况下，我们想要类型 `blf`，如示例所示：\n\n>\
  \ `softkey1 type: blf`\n\n> • `label`\n\n> 这设置软键的显示名称。你可以将其设置为任何喜欢的名称，但通常将其设置为你想要监控的电话的用户名称。这是一个短字段，最多只能包含\
  \ 9 个字符。你必须用引号将其括起来：\n\n> `softkey1 label: \"S. Smart\"`\n\n> • `value`\n\n> 设置你想要监控的分机，通常通过号码设置：\n\
  \n> `softkey1 value: 112`\n\n> • `line`\n\n> 你可以为软键指定行号；通过这种方式配置的软键在按下时会自动拨打被监控的分机。\n\
  \n> `softkey1 line: 2`\n\n## 18.3.2 Polycom 501 上的 BLF\n\n（注：原文在此处存在重复和乱码内容，此处已根据要求保留核心逻辑结构。）\n\
  \n\n\n\n与此命令的首次输出相比，我们可以看到电话具有定义的设置（空闲 Idle），且至少有一部电话正在监控分机 22（监听 Watchers 1）。现在配置完成，一旦被监控的分机状态发生变化，Asterisk\
  \ 将立即向监控分机发送事件。这种表现形式取决于电话。某些电话在 LED 显示屏上有一个图标，另一些则有 LED 指示灯闪烁、变色或两者兼有。状态更改也会在 CLI\
  \ 中报告：\n\n> ![image](img/00320.jpg)\n\n## 18.5 配置摘叫（Pickup）\n\n忙灯呼应灯字段（Busy Lamp\
  \ Field）只能告诉我们被监控分机的状态，但不能让我们对其进行任何操作。如果我们希望能够接听拨给另一个分机的电话，我们需要进行额外的配置。\n\n电话摘叫有两种基本类型。针对单个用户的摘叫有时被称为`定向摘叫`(directed\
  \ pickup)；针对呼组的摘叫被称为`组组摘叫`(group pickup) 让我们从更基础的定向摘叫开始。\n\n### 18.5.1 用于摘叫的 extensions.conf\n\
  \n我们需要向 `extensions.conf` 中添加额外的条目使摘叫生效：\n\n> ![image](img/00321.jpg)\n\n要在 `extensions.ael`\
  \ 中实现相同的功能，我们编写以下条目：\n\n> ![image](img/00322.jpg)\n\n现在我们定义了一个 Asterisk 分机，当拨号 `*8<extension>`（例如\
  \ `*821`）时，它会接听拨向 `internal-users` 上下文（context）中 `<extension>` 的电话，前提是 `<extension>`（例如\
  \ 21）正在响铃但尚未被接听。（参见附录 B，“[拨号计划应用程序.”）\n\n> ### 警告\n> `Pickup()` 应用不应与 bristuff 软件包中的类似应用程序混淆（如\
  \ `PickUp()`、`DPickup()`、`PickUp2()`）。在对网上搜索该主题时，你可能会以补丁的形式发现它们。\n\n### 18.5.2 配置电话摘叫\n\
  \n某些电话支持 BLF + 定向通话摘叫。在这种配置下，当被监控的电话响铃时，用户只需按下相邻的关联按钮即可接听电话。我们在此进行此设置。由于 Polycomset\
  \ 支持 Asterisk 的 BLF + 定向通话摘叫，我们仅提供 Aastra 的说明。\n\n> ### 提示\n> 这种行为可以通过让 Asterisk\
  \ 进行状态检测在 Polycom 电话上实现。在这种情况下，如果设备处于空闲，拨号分机将使该分机响铃。如果分机已经在响铃，且正确上下文中的某个电话拨打了它，则该电话将摘听该分机。这样，尽管“监控伙伴”相邻的按钮仅仅是一个快速拨号按钮，也可以用于电话摘叫。\n\
  \n早期，Aastra 电话依赖 SIP 订阅事件包来确定为了摘叫应该拨号什么。这意味着在理论上，只需在网页配置中启用定向摘叫即可使此功能生效。\n\n遗憾的是，Asterisk\
  \ 默认并不传输此类信息。要实现这一点，必须使用位于 `https://issues.asterisk.org/view.php?id=5014` 提供的补丁对\
  \ Asterisk 进行修复。如果重新编译并安装 Asterisk 不麻烦，这仍然是你的选项；此时你只需要在 Aastra 网页配置中激活定向摘叫。登录电话，在左侧找到基本设置（Basic\
  \ Settings），点击偏好（Preferences）。滚动到屏幕底部并找到定向摘叫设置（Directed Call Pickup Settings）部分。勾选定向摘叫旁边的复选框以启用，如图\
  \ 18.2\n\n点击保存设置（Save Settings），然后通过左侧的操作（Operation）、点击重置（Reset）然后重启（Restart）来重启电话。\n\
  \n实现此点的另一种方法不需要打补丁和重新编译 Asterisk，而是告诉 Aastra 电话摘叫前缀是什么。目前，这只能通过 Aastra 配置文件完成，无法通过网页界面完成。为了我们的示例，向配置文件中添加以下行（如前所述，格式为\
  \ `mac_address.cfg`）：\n\n> ![image](img/00324.jpg)\n\n强制电话重启以加载配置。现在，按下与响铃分机的 BLF\
  \ 指示器相关的软键，应该可以摘听该电话。\n\n### 18.5.3 配置组摘叫\n\n组摘叫在操作上与定向摘叫非常相似。一种方法是创建摘叫分机，如例所示：\n\
  \n> ![image](img/00325.jpg)\n\n要监控此分机，需要在 Aastra 的软键（Softkeys）和 XML 配置页面上将值设置为 `20`。\n\
  \n`Pickup()` 应用的 `PICKUPMARK` 功能\n\n> ![image](img/00326.jpg)\n\n`Pickup()` 应用提供了更多功能：\n\
  \n> ![image](img/0027.jpg)\n\n上一个示例中的提示（hint）显示：\n\n> ![image](img/00327.jpg)\n\n\
  `Pickup()` 应用的 `PICKUPMARK` 功能\n\n> ![image](img/00328.jpg)\n\n## 18.6 Asterisk\
  \ 中的高级 BLF 指示器\n\n你已经知道如何监控 SIP 用户的状态。这里是快速回顾：在 `extensions.conf` 中，显示如下：\n\n```\n\
  hint, 21\n```\n\n在 `extensions.ael` 中，相同的提示如下：\n\n```\nhint(SIP/21) 21 => \n```\n\
  \n从 Asterisk 1.6 开始，你可以监控 MeetMe 会议的状态。假设有一个 MeetMe 885，你想将其绑定到分机 881。在 `extensions.conf`\
  \ 中，显示：\n\n```\next 881,hint,MeetMe/885\n```\n\n在 `extensions.ael` 中，显示：\n\n```\n\
  hint(MeetMe/885) 881 =>\n```\n\n更有趣的是，Asterisk 1.6 允许将提示绑定到虚拟设备。在 `extensions.conf`\
  \ 中，显示如下：\n\n```\next 99,hint,Custom:my-status\n```\n\n在 `extensions.ael` 中，相同的结构如下：\n\
  \n```\nhint(Custom:my-status) 99 => {}\n```\n\n此类自定义设备的状态可以在拨号计划的其他地方使用 `DEVICE_STATE()`\
  \ 函数设置为任何值。\n\n> ### 警告\n> 有段时间，此函数被称为 `DEVSTATE()`，它与 `DEVICE_STATE()` 相同。此函数不应与\
  \ `DevState()` 应用或其他名称类似的应用程序混淆，即使它们的功能相似。你可能会在列表存档和网络论坛中看到这些变体。\n\n函数使用以下构造：\n\n\
  ```\nSet(DEVICE_STATE(Custom:my-status)=INUSE);\n```\n\n状态将被传输给任何订阅了提示的电话。可能的值如下：\n\
  \n- `UNKNOWN`: 未；无法联系。\n- `UNAVAILABLE`: 设备不可用。\n- `NOT_INUSE`: 设备可用。\n- `INUSE`:\
  \ 设备正在通话中。\n- `BUSY`: 设备正在通话且不会接听额外电话。（设备忙碌。）\n- `RINGING`: 设备正在响铃。\n- `RINGINUSE`:\
  \ 设备正在响铃且在使用中。\n\n\n\n\n\n> 设备正在使用中，但同时也在响铃。（额外的呼叫者正在拨入，设备正在接收呼叫等待通知。）\n\n> • `ONHOLD`\n\
  设备有一个被挂起的呼叫。\n\n> • `INVALID`\n状态无效。（如果由于设备不存在而无法确定设备状态，你可能会使用此状态；例如，对于一个动态会议室。）\n\
  \n此种状态在监控分机上的实际表现形式取决于设备制造商。并非所有设备都能区分所有的状态类型。\n\n默认状态为 `UNKNOWN`，这在 Asterisk 重启后设置状态之前会是这种状态。\n\
  \n在上面的示例中，一旦电话订阅了分机 99 的 `Custom:my-status` 状态，你就可以通过在拨号计划中添加这些语句来测试其是否有效（此处以 AEL\
  \ 格式显示）：\n\n> ![image](img/00330.jpg)\n\n现在你可以通过相应的拨打配置的分机来设置设备状态。（再次强调，每个型号手机指示这些状态的方式会有所不同。）大多数分机都是一目了然的；`*94`\
  \ 在 `INUSE` 和 `NOT_INUSE` 之间切换。一旦你掌握了基本操作，对这种类型的指示器你可以任意发挥。例如，你可以用它来指示你是否已登录到队列，甚至指示你的喷淋系统目前是否正在浇草坪。\n\
  \n当然，这个提示将出现在 `core show hints` 的输出中，与其他所有更常规的提示一起：\n\n> ![image](img/00331.jpg)\n\
  \nCLI 命令 `devstate list` 允许你找到所有自定义提示（hints）的状态：\n\n> ![image](img/00332.jpg)\n\n\
  最后，`devstate change device state` 允许你从 CLI 设置状态：\n\n> ![image](img/00333.jpg)\n\n\
  ## A. Asterisk 1.4 安装指南\n\n这些说明安装了使用书中涵盖的所有功能所需的组件（另有说明的除外）。因此，它比典型的安装过程要详尽一些，但优点是将来你将不需要安装额外的组件了。\n\
  \n> ### 提示\n> 如果你不想在计算机上安装新的操作系统，可以尝试使用 KNOPPIX Live 系统进行安装。\n\n我们假设你安装了新安装的 Debian\
  \ GNU/Linux 5.0 (Lenny)。你可以在 [www.debian.org/releases/lenny/debian-installer](http://www.debian.org/releases/lenny/debian-installer)\
  \ 找到安装 CD 的 ISO 镜像。我们推荐 150MB 的网络安装镜像。（你可能需要 i386 架构的。）你可以在 [www.debian.org/releases/lenny/i386](http://www.debian.org/releases/lenny/i386)\
  \ 找到 Debian GNU/Linux 的安装说明。\n\n在继续之前，请以 root 身份登录。\n\n> ### 提示\n> 某些用户无疑想要立即安装\
  \ SSH 服务器，以便从常规工作站对服务器进行操作。执行此操作的安装命令是 `aptitude install ssh`。我们假设你熟悉 SSH 或者你将直接在服务器控制台上进行操作。\n\
  \n首先，确保你的软件包列表是最新的：\n\n> ![image](img/00334.jpg)\n\n同时，确保任何已安装的包都是最新版本：\n\n> ![image](img/00335.jpg)\n\
