  \n### Asterisk 1.4 到 1.6 内部帮助的差异：\n\n> ![image](img/00929.jpg)\n\n另参见 `sendimage`,\
  \ `sendtext`。\n\n## B.150 Set()\n\n将变量设置为指定的值。\n\n> `Set(*variable=*value*)`\n\n\
  将变量设置为指定的值。如果变量名以 `_` 开头，则设置单级继承（即该变量被任何从此通道打开的通道所继承）；如果以 `__` 开头，则设置无限继承（即此通道的所有子通道，无论何代级，都会继承该变量）。最多可以设置\
  \ 24 个变量。变量仅在通道中有效，并在通道挂起时取消。选项 `g` 在 Asterisk 1.2 中用于设置全局变量（不是函数！请见下文注释）；在 1.4\
  \ 中，这通过 Asterisk 函数 `GLOBAL()` 实现。\n\n> ![image](img/00930.jpg)\n\n> ### 注意\n> 全局变量是否在执行\
  \ `reload` 时被清空，取决于 `extensions.conf` 中 `clearglobalvars` 的设置。\n\n`Set()` 也用于写入函数（请参见\
  \ 附录 C）。\n\n> ![image](img/00931.jpg)\n\n> ### 注意\n> Asterisk 1.2 中的选项 `g` 仅适用于变量；函数的行为取决于函数本身。\n\
