  \ 中不可用\n\n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n\n无\n\n### C.5 BLACKLIST\n\nBLACKLIST()\n\
  \n此函数检查通道上的主叫 ID 是否在黑名单中。使用了 Asterisk 数据库 (AstDB)。主叫 ID (NAME) 或主叫 ID (NUMBER) 必须存储在\
  \ `blacklist` 中。键名无关。\n\n`BLACKLIST()` 只测试，不执行任何操作。如果发现匹配的主叫 ID，则返回 1，否则返回 0。\n\n\
  > ![image](img/01125.jpg)\n\n**Asterisk 版本：**\n\n![image](img/01126.jpg)\n\n**Asterisk\
  \ 1.4 中此函数的内部帮助：**\n\n> ![image](img/01127.jpg)\n\n**Asterisk 1.2 到 1.4 的内部帮助差异：**\n\
