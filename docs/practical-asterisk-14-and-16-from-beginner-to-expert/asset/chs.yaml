  \n**另请参 `goto`, `transfer`。**### B.20 ChanSpy()\n\n对通道开启窃听。\n\n> `ChanSpy([*channel*[,*options*])`\n\
  \n对通道开启监听。这与仅监听的 `Zap()` 不同。\n\n> ### 注意\n\n> 请注意，管辖区的法律可能禁止未经参与者允许的窃听。\n\n如果指定了\
  \ `channel`，则只有以该字符串开头的通道可用。选项可以组合：\n\n> • `b`\n> 限制为桥接通道。\n> • `g`\n> 限制为 `${GROUP}`\
  \ 变量包含冒号分隔列表的通道。\n> • `q`\n> 切换通道时不播放音调。\n> • `r`\n> 将监听会话记录在 `/var/spool/asterisk/monitor`\
  \ 中。默认前缀为 `chanspy`。\n> • `v`\n> 设置音量。范围为 −4 到 4。\n> • `w`\n> 加密模式。允许监听的用户向被听通道说话而不被听到。\n\
  > • `W`\n> 私密加密模式。类似于 `w`，但监听通道听不到被听通道。\n\n监听时，接受以下按键输入：\n\n> • `#`\n> 逐步增加音量（从\
  \ −4 到 4）。\n> • `*`\n> 切换到另一个通道。\n> • `X..X#`\n> 任意长度的数字，以 `#` 结尾。例如，如果扩展号调用 `ChanSpy(Agent)`\
  \ 且监听的用户拨了 `1234#`，则监听通道将开始监听 `Agent/1234`。\n\n> ![image](img/00434.jpg)\n\n**Asterisk\
