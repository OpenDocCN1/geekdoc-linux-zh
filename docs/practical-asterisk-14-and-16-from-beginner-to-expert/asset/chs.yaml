  \n> ![image](img/00004.jpg)\n\n使用你喜爱的终端文本编辑器，将以下文本输入到 `/etc/asterisk/extensions.conf:`：\n\
  \n如果你没有相应的编辑器，我推荐使用 `nano`。在 Debian 中以超级用户身份安装它非常简单，只需运行 `apt-get -y install nano`\
  \ 即可。使用 `nano <filename>` 打开要编辑的文件。最重要的命令显示在屏幕的底部。\n\n> ![image](img/00005.jpg)\n\
  \n#### 2.2.2 启动 Asterisk 并拨打“Hello World”\n\n你可能会很惊讶，仅仅四行代码就足够配置 Asterisk 了。也许你认为\
  \ Asterisk 比这更复杂。无论如何，让我们来尝试一下。使用命令 `asterisk -c` 启动 Asterisk（`-c` 选项为我们提供了控制台）：\n\
  \n> ![image](img/00006.jpg)\n\n通过这个控制台，你可以操作运行中的 Asterisk 服务器，并实时交互地向它发送命令。让我们尝试使用\
  \ `console dial 1001` 生成拨向我们“Hello World”扩展的电话：\n\n> ![image](img/00007.jpg)\n\n\
  命令 `console dial 1001` 会调用扩展 1001。该扩展会接听并播放来自 `/var/lib/asterisk/sounds` 目录的 `hello-world.gsm`\
  \ 文件。\n\n> Note\n> `console dial` 的行为就像简单的电话。你可以用它拨打扩展，并通过声卡收听声音。\n\n##### 2.2.2.1\
  \ 什么是扩展（Extension）？\n\n扩展是拨号计划中的编程单元。每个扩展至少由一行代码组成，格式如下：\n\n> `exten => *extension_name,priority,application`\n\
  \n在这里，`priority` 描述了各个扩展元素的顺序。我们的扩展 1001 有三个优先级：\n\n> ![image](img/00008.jpg)\n\n\
  这些应用程序是自而易见的：\n\n> • `Answer()`\n> 接听并打开一个新的 Asterisk 通道（参见附录 B，“[Dialplan Applications]”）。\n\
  \n> • `Playback(hello-world)`\n> 在当前通道中播放 `hello-world.gsm` 文件（参见附录 B）。\n\n> • `Hangup()`\n\
  > 挂断并关闭通道（参见附录 B）。\n\n##### 2.2.2.2 增加详细程度（Verbosity）\n\n当你调试 Asterisk 时，你通常会发现增加控制台消息的详细程度很有帮助。当使用\
  \ `asterisk -c` 启动 Asterisk 时，详细级别被设置为 0（允许范围为 0 到 10）。你可以通过控制台命令 `core set verbose\
  \ 5` 将其增加到级别 5，这是一个非常适合调试的级别：\n\n> ![image](img/00009.jpg)\n\n现在，当你输入命令 `console\
  \ dial 1001` 时，你会看到关于拨号计划执行的细节：\n\n> ![image](img/00010.jpg)\n\n你也可以在启动时使用切换选项 `-c`\
  \ 将详细级别设置为 5。\n\n> Note\n> `core set verbose 5` 对调试很有用。\n\n#### 2.2.3 停止 Asterisk\n\
