  \n## B.187 VoiceMail()\n\n允许调用者在指定的信箱中留下语音留言。\n\n> `VoiceMail(*mailbox*[@*context*][&*mailbox*[@*context*][&...]],*options*)`\n\
  \n旧版语法：\n\n> `VoiceMail([s|u|b]*mailbox*[@*context*][&*mailbox*[@*context*][&...]])`\n\
  \n允许调用者在指定的信箱中留下语音留言。该信箱必须已在 `voicemail.conf` 中配置。如果列出了多个信箱，则将播放第一个信箱的问候。如果信箱不存在，则拨号计划结束。\n\
  \n选项 `s`（静音）抑制提示。选项 `u` 如果存在，则播放“不可用”消息。选项 `b`（忙碌）如果存在，则播放忙碌消息（使用文件 `busy` 而不是 `unavail`）。\n\
  \n> ### 警告\n\n> 你不能混合语法类型。如果这样做，应用程序将失败，就像信箱不存在一样。我们建议始终使用新语法。\n\n如果设置了选项 `j`，则在失败时跳转到扩展\
  \ n+101（如果存在）。\n\n如果调用者在提示期间按下 `0`，通话将转到当前上下文中的扩展 `o`（小字母 o，代表接员）。\n\n如果调用者在提示期间按下\
  \ `*`，通话将转到当前上下文中的扩展 `a`（小字母 a，代表助理）。\n\n错误时返回 -1（找不到信箱或调用者挂断），否则返回 0。将通道变量 `VMSTATUS`\
  \ 设置为 `SUCCESS`、`USEREXIT`（调用者取消消息）或 `FAILED`。\n\n> ![image](img/01053.jpg)\n\n\
  **Asterisk 版本：**\n\n![image](img/01054.jpg)\n\n**Asterisk 1.4 中此应用程序的内部帮助：**\n\n\
  > ![image](img/01055.jpg)\n\n**Asterisk 1.2 到 1.4 的内部帮助差异：**\n\n> ![image](img/01056.jpg)\n\
  \n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n\n> ![image](img/01057.jpg)\n\n另参见 `voicemailmain`,\
  \ `voicemail.conf`。\n\n## B.188 VoiceMain()\n\n允许调用者检查语音留言。\n\n> `VoiceMain([*mailbox*][@*context*][,*options*])`\n\
  \n旧版语法：\n\n> `VoiceMain([[s|p]*mailbox*][@*context*])`\n\n允许访问信箱以听消息。如果未指定信箱号，系统将提示调用者输入信箱号。选项\
  \ `s` 跳过密码提示。选项 `p`（前缀）提示调用者输入信箱；命令中指定的数字将用作调用者提供的数字的前缀，生成的字符串将用作信箱号。这在虚拟托管时非常有用。选项\
  \ `a` 将调用者直接发送到指定的上下文（默认 `INBOX`）。\n\n如果指定了上下文，则只有该上下文中的信箱可访问。\n\n调用者挂断时返回 -1，否则返回\
  \ 0。\n\n> ![image](img/01058.jpg)\n\n**Asterisk 版本：**\n\n![image](img/01059.jpg)\n\
