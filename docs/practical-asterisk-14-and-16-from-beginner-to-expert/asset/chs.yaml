  \ 到 1.6 的内部帮助差异：**\n\n无\n\n**参见 `getcpeid`、`adsi.conf`。**\n\n### B.4 AgentCallbackLogin()\n\
  \n带回调的坐席登录：\n\n`AgentCallbackLogin(*agentid*][*options*[,extension@*context*]])`\n\
  \n允许通过 `agentid` 识别的坐席带回调登录队列。登录后，坐席可以在拿起手机时接听电话；每个电话前会有警告音。按星号 (*) 键可以结束通话。\n\n\
  选项 `s` 使登录静默；坐席登录不会被报告：\n\n![image](img/00369.jpg)\n\n可以在 [www.voip-info.org/index.php?page=Asterisk+cmd+AgentCallbackLogin](http://www.voip-info.org/index.php?page=Asterisk+cmd+AgentCallbackLogin)\
  \ 获取大量示例。\n\n### B.5 AgentLogin()\n\n呼叫坐席登录：\n\n`AgentLogin(*agentid*]*options*)`\n\
  \n将当前呼叫者（可选通过 `agentid` 识别）登录队列。登录后，坐席可以在拿起手机时接听电话；每个电话前会有警告音。按星号 (*) 键可以结束通话。\n\
  \n选项 `s` 使登录静默：\n\n![image**Asterisk 版本：**![image](img/00371.jpg)\n\n**Asterisk\
  \ 1.4 中此程序的内部帮助：**\n\n![image](img/00372.jpg)\n\n### B.6 AgentMonitorOutgoing()\n\
  \n记录坐席的所有呼出电话：\n\n`AgentMonitorOutgoing(*options*)`\n\n\n\n\n此应用程序尝试通过比较代理的呼叫 ID（caller\
  \ ID）与 `AgentCallbackLogin()` 应用程序设置的全局变量，来确定发起外呼的代理 ID。因此，它应该与 `AgentCallbackLogin()`\
  \ 一起使用，并且始终在较后的优先级中运行。此应用程序使用了 `chan_agent` 中的监控函数而非 `Monitor()`，因此必须在 `agents.conf`\
  \ 中配置通话录音。\n\n默认情况下，录音保存在 `/var/spool/asterisk/monitor`。你可以通过 `agents.conf` 中的 `savecallsin`\
  \ 参数来覆盖此行为。\n\n> ### 警告\n\n> 请注意，通话录音可能受您所在管辖区信息自由和隐私法律的限制。根据专业实践，您应该了解录制电话的法律条款。在大多数管辖区，在未经参与者知的情况下录音通话是非法的。\n\
  \n如果无法确定代理的呼叫 ID 和/或代理 ID，通话将跳转到优先级 `n+101`（如果存在）。\n\n除非选项另有规定，否则该应用程序返回 0。\n\n\
  可以使用以下选项：\n\n> • `d`\n\n> 如果不存在 `n+101` 优先级，在发生错误时强制返回 -1。\n\n> • `c`\n\n> 修改通话详情记录，使通话源变为\
  \ `agent/agentid` 而非呼叫 ID。\n\n> • `n`\n\n> 如果无法确定呼叫者/代理 ID，则抑制错误消息。这对于希望代理和非代理通话使用通用上下文的情况非常有用。\n\
  \n![image](img/00376.jpg)\n\n**Asterisk 版本：**\n\n![image](img/00377.jpg)\n\n**Asterisk\
  \ 1.4 中此应用程序的内部帮助：**\n\n> ![image](img/00378.jpg)\n\n**从 Asterisk 1.2 到 1.4 的内部帮助差异：**\n\
  \n无\n\n**从 Asterisk 1.4 到 1.6 的内部帮助差异：**\n\n> ![image](img/00379.jpg)\n\n### B.7\
  \ AGI()\n\n运行一个符合 AGI 标准的应用程序（类似于 `EAGI()`、`FastAGI()`、`DeadAGI()`）：\n\n```\nAGI(program[,arguments*])\n\
  ```\n\n它还会在当前通道上运行一个名为 `program` 的符合 AGI 标准的程序。AGI 脚本或程序可以用几乎任何想象到的语言（例如 Perl、PHP）实现，并用于操作通道、播放音频文件、解释\
  \ DTMF 振音等。Asterisk 通过 `stdin` 和 `stdout` 与 AGI 程序通信。参数在执行时直接传递给 AGI 程序。\n\nAGI\
  \ 程序必须在文件系统中被标记为可执行。该路径相对于 Asterisk AGI 目录，默认为 `/var/lib/asterisk/agi-bin`，也可以指定为绝对路径。\n\
  \n要在另一个服务器上运行程序或脚本，请使用格式如 `agi://host[:port[/program]]` 的 URL 来调用。通过这种方式，脚本、程序或守护进程可以一直运行并准备好接受连接，从而提高应用程序的性能。这种方法被称为\
  \ FastAGI，其功能和目的与 Web 服务器中 FastCGI 类似。如果没有提供端口号，默认端口为 4573。如果指定了 `program`，它将作为环境变量\
  \ `agi_network_script` 传递给 FastAGI 程序。在 `agi` 文件夹中有一个 Fast FastAGI Perl 脚本（`fastagi-test`）。将其作为你自己的\
  \ FastAGI 脚本的起点。\n\n关于 AGI 脚本可以发送给 Asterisk 的命令列表，请参见 agi-commands，或在 Asterisk CLI\
  \ 中输入 `agi show`。\n\n要在非活动通道上运行 AGI 程序（例如 `h` 扩展的情况下，即通道挂机），请改用 `DeadAGI()`。如果你的\
  \ AGI 程序需要访问传入音频流，请使用 `EAGI()` 而非 `AGI()`。传入音频流通过文件描述符 3 提供。\n\n提醒：0: `stdin`，1:\
  \ `stdout`，2: `stderr`。文件描述符 3 可以自由分配。\n\n在挂断或程序请求挂断时返回 -1；否则返回 0。\n\n> ![image](img/00380.jpg)\n\
