  \n### B.2 AddQueueMember()\n\n动态向队列添加接口：\n\n`AddQueueMember(*queue*[,*interface*[,*penalty*[|,*options*]]])`\n\
  \n将指定的接口动态添加到指定的队列中，该队列在 `queues.conf` 中配置。如果提供了惩罚 (penalty) 设置，将影响分配给队列中接口的优先级。惩罚值越的坐席将在惩罚值高的坐席之前接听电话。\n\
  \n如果指定的接口已经在队列中，且存在 n+101 优先级（其中 n 是当前优先级），则电话将跳转到该优先级；否则返回错误代码 (−1)。（取决于 Asterisk\
  \ 的版本，你可能需要提供 j 选项来启用优先级跳转。）\n\n如果调用 `AddQueueMember()` 时没有接口参数，则使用当前用户的活动接口。\n\n\
  某些版本的 Asterisk 允许逗号作为选项分隔符。\n\n此应用程序根据情况将通道变量 `${AQMSTATUS}` 设置为 `ADDED`、`MEMBERALREADY`（成员已在队列中）或\
  \ `NOSUCHQUEUE`（队列不存在）：\n\n![image](img/00361.jpg)\n\n**Asterisk 版本：**\n\n![image](img/00362.jpg)\n\
  \n**Asterisk 1.4 中此应用程序的内部帮助：**\n\n![image](img/00363.jpg)\n\n**Asterisk 1.2 到 1.4\
  \ 的内部帮助差异：**\n\n![image](img/00364.jpg)\n\n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n\n![image](img/00365.jpg)\n\
  \n**参见 `queue`、`removequeuemember`、`queues.conf`。**\n\n### B.3 ADSIProg\n\n将 ADSI\
  \ 脚本加载到手机：\n\n`ADSIProg(*script*)`\n\n使用提供的脚本加载 ADSI（模拟服务）手机。如果没有提供脚本，则使用 de `/etc/asterisk`。路径相对于\
  \ Asterisk 目录。使用 `GetCPEID()` 获取 CPE（用户设备）ID 以及关于 ADSI 的其他信息。\n\n![image](img/00366.jpg)\n\
