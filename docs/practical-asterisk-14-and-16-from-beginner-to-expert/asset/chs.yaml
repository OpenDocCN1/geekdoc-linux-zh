  \n使用 `Gosub()` 可以将调用定向到子程序；可以通过 `Return()` 返回到初始优先级：\n\n> ![image](img/00084.jpg)\n\
  \n### 5.2 变量\n\n变量是实际值的占位符。具体是什么值取决于变量的类型。在 Asterisk 中，变量可以包含数字、字母和字符串（字母和数字的序列）。变量非常有用，因为它们允许我们为呼叫流程创建规则，这些规则适用于变化的情况，并使其更容易适应未来电话应用程序或系统的变更。在\
  \ Asterisk 中，变量有不同的作用域。有本地变量（在 Asterisk 中称为*通道变量*），它们只能为当前活跃通道设置值；以及全局变量，它们为所有通道设置值。由于之前在\
  \ Asterisk 配置文件（例如 `sip.conf`）中将它们作为配置参数使用，我们应该已经对 Asterisk 设置的一些变量非常熟悉了。我们也有权定义自己的变量并在配置文件中使用它们。\n\
  \n### 5.2.1 在扩展中展开变量\n\n可以使用语法 `${VARIABLENAME}` 获取变量值。某些变量是由 Asterisk 自动设置的。例如，被号码始终存储在\
  \ Asterisk 系统变量 `${EXTEN}` 中。通过模式和变量，通常可以极大地压缩冗长的拨号计划。\n\n如果没有变量，一组扩展必须像所示表示：\n\n\
  > ![image](img/00085.jpg)\n\n然而，使用变量可以让我们多个扩展变得简洁：\n\n```text\nexten => _10X,1,Dial(SIP/${EXTEN})\n\
  ```\n\n### 5.2.2 通用考虑因素\n\n在使用变量时，你需要记住以下几点。首先，变量不区分大小写。根据习惯，字符串变量应该用引号括起来。如果你打算在变量中使用预留字符，则需要对它们进行转义，并且整数变量有大小限制。让我们详细探讨这些因素。\n\
  \n#### 5.2.2.1 大写\n\n变量名不需要像我们的示例中那样全部使用大写字母，用户定义的变量也不区分大小写。尽管如此，使用大写变量名仍然是一个好主意，因为这使得变量更容易识别，拨号计划代码更容易读。遗憾的是，这意味着你不能根据大小写来区分变量名。例如，`${FOO}`\
  \ 被认为与 `${foo}` 相同。\n\n> ### 注意\n\n> Asterisk 系统变量如 `${EXTEN}` 必须始终大写。\n\n#### 5.2.2.2\
  \ 在字符串变量中使用双引号\n\n字符串变量（即包含文本而非数字的变量）在使用双引号定义，尽管 Asterisk 仍然接受不带引号的形式。以下两个项目在功能上是等等的：\n\
  \n> ![image](img/00086.jpg)\n\n如果字符串包含逗号或空格，你必须使用双引号：\n\n```text\nexten => 1234,1,Set(FRUITTYPES=\"\
  Apple, Pear, etc.\")\n```\n\n这就是为什么养成为你定义的任何字符串变量使用引号的习惯是一个好主意。\n\n#### 5.2.2.3\
  \ 预留字符\n\n有时变量将包含预留字符（具有特殊功能且解释不同的字符）。例如，如果你想让变量包含划线字符 (_)，你必须使用“转义”字符来告诉拨号计划解释器忽略该预留字符。在变量中使用时，以下字符必须进行转义：\n\
  \n`[ ] $ \" \\`\n\n`extensions.conf` 中的转义字符是反斜线 (`\\`)：\n\n```text\nexten => 1234,1,Set(AMOUNT=\"\
  \\$10.00\")\n```\n\n同样，如果你想在变量中使用反斜线字符，必须对它进行转义：\n\n```text\nexten => 1234,1,Set(ROOMNUMBER=\"\
  48\\\\10\")\n```\n\n#### 5.2.2.4 整数大小限制\n\n如果变量包含整数，其不能超过 18 位。任何更大的值都会导致错误，错误将记录在日志文件中。\n\
  \n> ### 提示\n\n> 如果你需要处理更大的整数或浮点数，可以使用 AGI 脚本（参见第 16 章，“[Asterisk 网关接口]”）。\n\n###\
  \ 5.2.3 在 extensions.conf 中定义全局变量\n\n全局变量定义在 `extensions.conf` 的开头。你将将放在特殊的 `[globals]`\
  \ 上下文中，该上下文紧随在 `[general]` 之后：\n\n> ![image](img/00087.jpg)\n\n### 5.2.4 使用 Set()\
  \ 定义变量\n\n`Set()` 用于在扩展内部定义变量（另见录 B 中的应用程序描述）。通用语法为 `Set(<variable1>=<value1> [,<variable2>=<value2>])`。以下划线为前缀的变量是全局变量。如果没有下划线，变量被视为本地变量：\n\
  \n> ![image](img/00088.jpg)\n\n```text\nexten => 1234,1,Set(_CAKE=\"Marble cake\"\
  )\n```\n\n### 5.2.5 通道变量的继承\n\n以下列表描述了 5.2.5 通道变量的继承\n\n如果在对话过程中产生了新通道，它们将拥有自己的变量。\n\
  \n#### 5.2.5.1 单级继承\n\n有时你希望一个变量持续到新创建的通道中。可以通过在变量前加下划线 (_) 实现。这确保了变量只被继承一次。\n\n\
  ```text\nexten => 1234,1,Set(_CAKE)\n```\n\n#### 5.2.5.2 多级继承\n\n如果你需要变量的无限继承，可以在变量前加两个下划线\
  \ (__)。\n\n> ### 警告\n\n> Asterisk 不区分带下划线的变量名。在下面的示例中，具有多级继承的变量 (\"__CAKE\") 是全局的：\n\
  \n> ![image](img/00089.jpg)\n\n> 在此示例中，变量 CAKE 将任何生成的通道继承：\n\n```text\nexten =>\
  \ 1234,1,Set(__CAKE=\"Sponge cake\")\n```\n\n调用继承变量时，是否有前缀无关。这些项目的输出相同：\n\n> ![image](img/0090.jpg)\n\
  \n### 5.2.6 系统通道变量\n\n以下列表描述了重要的系统通道变量。这些变量可以读取但不会被 `extensions.conf` 中的项目覆盖，因为它们是由\
  \ Asterisk 预定义的。你可以在 `doc/README.variables` (Asterisk 1.2) 和 `doc/channelvariables.txt`\
  \ (Asterisk 1.4) 中找到所有预定义变量的完整列表。此列表中不包含弃用变量。例如，`${CALLERIDNUM}` 不在此列表中；建议使用 Asterisk\
  \ 函数 `${CALLERID(num)}`。\n\n> ### 提示\n\n> 一个良好的习惯是将依赖弃用变量或函数的拨号计划代码替换为使用推荐替代方案的代码。这将减少在升级\
  \ Asterisk 时安装出现问题的概率。\n\n与特定 Asterisk 函数相关的系统变量将在相应章节中再次介绍。这里描述的某些“变量”实际上并不是变量，而是内置函数。为了方便起见，它们在这里列出：\n\
  \n- `${ANSWEREDTIME}` 活跃连接的总持续时间（换句话说，从对话开始的秒数）\n- `${BLINDTRANSFER}` 盲转另一端的通道名称\n\
  - `${CHANNEL}` 当前通道名称\n- `${CONTEXT}` 上下文\n\n\n\n\n\n> 当前上下文的名称\n\n- `${EPOCH}`\n\
  - 当前 UNIX 时间（自 UNIX “纪元”开始以来经过的秒数，该纪元始于 UTC 时间 1970 年 1 月 1 日午 0 点）\n- `${EXTEN}`\n\
  - 当前拨打的分号\n- `${ENV(VARIABLENAME)}`\n- 环境变量 `VARIABLENAME`\n- `${HANGUPCAUSE}`\n\
  - 连接挂断的原因\n- `${INVALID_EXTEN}`\n- 用于 `i` 扩展，并包含拨打的分号\n- `${PRIORITY}`\n- 当前扩展中的当前优先级\n\
  - `${TRANSFER_CONTEXT}`\n- 转接电话的上下文\n- `${UNIQUEID}`\n- 当前连接的唯一 ID\n- `${SYSTEMNAME}`\n\
  - 由 `/etc/asterisk/asterisk.conf` 中的 `systemname` 定义的系统名称\n\n注：此处原文 `systemname`\
  \ 对应的 `systemname` 保持原样。\n\n### 5.2.7 操作变量\n\n当我们可以在执行时更改它们的内容时，变量最为有用。这为我们提供了 Asterisk\
  \ 系统中创建复杂且强大的行为的灵活性。\n\n#### 5.2.7.1 子字符串\n\n通常，一个字符串由一系列单独字符组成。字符串的大小由其中包含的字符数量决定。例如，字符串\
  \ `apple tree` 有十个字符；我们必须包含空格。任何字符串都可以被拆分为子字符串。例如，`apple`、`tree`、`app` 和 `le tre`\
  \ 都是 `apple tree` 的有效子字符串。理论上，字符串可以是任意长度的；整本书都可以包含在一个字符串中，尽管这并不实际。字符串操作是编程应用程序中的一项重要技术。Asterisk\
  \ 允许你使用冒号（:）字符来操作字符串和子字符串。使用冒号，你可以从现有字符串变量中提取指定部分：\n\n> `${VARIABLENAME[:start[:length]]}`\n\
  \n#### 5.2.7.1.1 示例\n\n许多电话系统要求拨打一个前缀数字来获取外线。（在北美，这通常是 9。））然而，目标号码不能包含这个前缀数字。如果我们拨打\
  \ `9-1-202-7075000`，我们可以使用下面的拨号条目将实际的外线号码存储在 `${OUTGOINGNUMBER}` 中。\n\n### 注意\n\
  ```\nexten => _0X.,1,Set(OUTGOINGNUMBER=${EXTEN:1})\n```\n\n如果省略了 `length` 选项，会自动提取字符串的剩余部分。\n\
  \n如果我们只需要拨号号码的最后七位数字呢？在这种情况下，我们对起始参数使用负数。以下条目将从上一个示例中的 `7075000` 存储在变量 `${LOCALNUMBER}`\
  \ 中。\n\n### 注意\n在 NANP（北美数字编号计划）的原始规则下，号码的最后七位数字构成了号码的本地部分。也就是说，如果你的电话号码与拨号号码位于同一个区号，你只需要拨打七位数字。为了适应人口增长和密度，NANP\
  \ 通过覆盖式拨号计划（overlay dialplans）进行了扩展。在具有覆盖计划的区域，同一条街道甚至同一栋建筑内的两条电话线可能有不同的区号。如果你在拨打本地电话时需要拨打十位数字，那么你就处于覆盖区域。在这种情况下，上所示的本地号码过滤器将是不合适的。此外，许多覆盖较大区域的区号仍有部分号码空间被视为长途电话。\n\
  \n```\nexten => _0X.,1,Set(LOCALNUMBER=${EXTEN:-7})\n```\n\n我们也可以只获取区号：\n\n```\n\
  exten => _0X.,1,Set(AREACODE=${EXTEN:2:3})\n```\n\n### 注意\n显然，世界上其他地区的读者（例如英国、澳大利亚或其他地区）将有不同的国家拨号计划，这会影响外线号码的处理方式。某些国家的区号和城市代码长度是可变的；在这些情况下，这种号码过滤将是不实际的。\n\
  \n那么，这里是我们如何从拨号号码中提取有用信息：\n\n![image](img/00091.jpg)\n\n### 5.3 特殊扩展\n\n由于所有的编程逻辑必须通过扩展来实现，我们需要一些额外的系统定义扩展。\n\
  \n### 5.3.1 h 扩展\n\n`h` 是标准的“挂断”扩展。如果配置了 `h` 扩展，当呼叫者挂电话时，`h` 扩展会被调用。注意，一旦发生这种情况，`${EXTEN}`\
  \ 的内容就会变为 `h`。\n\n假设我们希望全局变量 `CONNECTIONS` 反映任何给定时刻活动会话的数量。这意味着每当建立连接时，`CONNECTIONS`\
  \ 的值就会加一，每当有人挂电话时，该值就会减一。下面的拨号条目说明了基本思想：\n\n![image](img/00092.jpg)\n\n### 5.3.2\
  \ i 扩展\n\n为了让上下文优雅地处理每种可能的情况，我们使用特殊扩展 `i`（代表 invalid，无效）。注意，与 `h` 扩展一样，`${EXTEN}`\
  \ 不包含拨号号码。在我们的示例中，Widgets, Inc. 的员工只能拨打 `.`。拨打任何其他号码的人将听到这条消息：“抱歉。这不是有效的分号。请重试。”\n\
  \n![image](img/00093.jpg)\n\n### 5.3.3 o 和 a 扩展\n\n如果在 `voicemail.conf` 中设置了 `operator=yes`，则当呼叫者按下零（0）时，电话将导向\
  \ `o` 扩展（接线员）。按下 `*` 将电话导向 `a` 扩展（中止）。\n\n### 5.3.4 t 和 T 扩展\n\n`t` 和 `T` 扩展用于处理超时。\n\
  \n#### 5.3.4.1 t 扩展\n\n如果在交互语音响应（IVR）菜单在规定时间内没有输入，则 `t` 扩展会被调用。\n\n![image](img/00094.jpg)\n\
  \n#### 5.3.4.2 T 扩展\n\n在超过绝对超时后，将调用 `T` 扩展。可以使用 `Set(timeout=<seconds>)` 设置此超时值。\n\
  \n### 注意\n等号（=）前后不要有空格。计时器在设置超时值时启动。（也就是说，它不是随着连接启动的；必须通过 `Set()` 命令显式启动。）`Set(timeout=0)`\
  \ 禁用绝对超时。在以下示例中，超时设置为 120 秒。如果通话超过该时间，将调用 `T` 扩展，它会播放“感谢致电”并挂断：\n\n![image](img/00095.jpg)\n\
  \n### 5.3.5 s 扩展\n\n任何扩展中的第一个项目总是呼叫者拨打的名称或号码。然而，当电话从公共交换网（PSTN）接入时，Asterisk 并不知道拨打了什么，也不知道呼叫者想要联系谁。对于无法确定拨号号码的场景，我们使用\
  \ `s` 扩展。在例示例中，通过 PSTN 接入的电话将播放猴子的声音：\n\n![image](img/00096.jpg)\n\n### 注意\n如果你使用\
  \ ATA 设备（模拟电话适配器），则不需要 `s` 扩展。你可以在 ATA 的配置界面（通常是 Web 界面）中配置号码。\n\n### 5.4 宏\n\n\
  宏是一种子程序。它可以包含复杂的工作流，但通过单个条目调用。这减少了拨号计划中的重复，并使其更简洁、更小。一个简单的示例可能如下：\n\n![image](img/00097.jpg)\n\
  \n该宏将像这样调用：\n\n![image](img/00098.jpg)\n\n\n\n\n对于两行宏来说，其效果可能没有长宏那样令人深刻，但这种方法的优点是显而易见的。\n\
  \n宏的使用往往将 Asterisk 用户社区分为两组。一组人认为宏让拨号计划更易于理解，另一组人则认为它们让拨号计划变得混乱。我们鼓励你得出自己的结论！\n\n\
  在定义宏时，请注意以下几点：\n\n- • 在定义宏时，只允许一个扩展（即 `s` 扩展）。\n- • 宏内部不能使用原始的 `${EXTEN}` 和 `${CONTEXT}`\
  \ 变量。我们必须改用 `${MACRO_EXTEN}` 和 `${MACRO_CONTEXT}`。\n- • 在调用宏时，可以提供额外的逗号（`,`）或管道（|）分隔的参数。这些参数在宏内部通过\
  \ `${ARGn}` 调用（其中 `n` 是正整数，表示序列中的第几个参数）。\n- • 宏在方括号内（`[macro-macroname]`）中定义，并在扩展中使用\
  \ `Macro()` 应用进行调用。\n\n关于宏的更多信息可以参阅附录 B，“拨号计划应用](#Practical_As-sk_1.4_and_1.6_split_028.html_filepos692029)”。\n\
  \n> ### 提示\n> `MacroExclusive()` 应用确保特定的宏在任何时刻只能被调用一次。如果另一个通道正在调用该宏，则在它完成之前其他通道无法调用它（参见附录\
  \ B）。\n\n### 5.5 已弃特性\n\n长期以来，优先级跳转（priority jumping）一直是拨号计划中移动通话的标准方法。在某些情况下，特定应用（例如\
  \ `Dial()`）会将优先级提高 101。该功能现在已正式废弃。基本上，这意味着尽管目前仍然受到支持，但它最终*会*被移除。继续使用它的人将使他们的拨号计划在升级后面临失败的风险。\n\
  \n在操作 Asterisk 时，你会在网上遇到拨号计划配置示例。（在偶然遇到使用已弃用构造的严重过时的示例并不罕见。）在专业实践中，你应该使用最新的代码结构和\
  \ Asterisk 版本。软件一直在更新，但已废弃的特性将不再维护。\n\n总而言之，如果你希望你的 Asterisk 系统的操作尽可能具有预测性，请保持代码的最新性！\n\
  \n## 6. Asterisk 扩展语言\n\n从 1.4 版本开始，Asterisk 提供了两种组合拨号计划的方法：传统的 `extensions.conf`\
  \ 格式和较新的 AEL（即 Asterisk 扩展语言），它使用文件名 `extensions.ael`。\n\n对于那些发现大型 `extensions.conf`\
  \ 文件难以阅读的 Asterisk 用户来说，AEL 将会特别感兴趣。AEL 看起来更像一种真正的脚本语言。它们也不是互斥的。你可以同时使用两者，在其中一个或文件中定义上下文。如果两个文件都存在，当加载拨号计划时，`extensions.conf`\
  \ 将直接覆盖 `extensions.ael` 中的相同部分。\n\nAsterisk 附带了一个名为 `aelparse` 的命令行实用，用于将 AEL 文件转换为传统的\
  \ `extensions.conf` 格式。\n\n> ### 注意\n> 当提到 AEL 时，我们指的是 AEL2。第一个版本是实验性的。\n\n### 6.1\
  \ AEL 的 CLI 命令\n\n对于 AEL 最重要的 Asterisk CLI 命令是 `ael reload`。它将 `extensions.ael`\
  \ 读取到内存中，如果你对 `extensions.ael` 做了更改并想在不重启 Asterisk 的情况下应用更改，它非常有用。\n\n> *CLI> `ael\
  \ reload*\n\n`dialplan show` 命令显示由 Asterisk 从 `extensions.conf` 和 `extensions.ael`\
  \ 加载的聚合拨号计划。每个拨号规则的来源显示在规则之前的一行方括号内中。对于源自 `extensions.conf` 的规则，该行看起来如下：\n\n> [\
  \ Context 'office-incoming' created by 'pbx_config' ]\n\n对于源自 `extensions.ael` 的规则，该行看起来如下：\n\
  \n> [ Context 'queues' created by 'pbx_ael' ]\n\n### 6.2 aelparse\n\n从 1.4 版本开始的\
  \ Asterisk 都带了 `aelparse` 命令行实用工具。如果有需要，你可以使用此实用工具快速将 `extensions.ael` 文件转换为 `extensions.conf`\
  \ 格式。程序员可能会将其视为 AEL 的某种测试编译器，这是一种比 `extensions.conf` 中使用的语言稍高级一点的“语言”。\n\n默认情况下，`aelparse`\
  \ 读取 `/etc/asterisk/extensions.ael`，除非带有选项 `-d` 进行调用，此时它会在本地目录查找 `extensions.ael`。如果在未带选项\
  \ `-n` 的情况下调用，它将输出大量对 Asterisk 开发人员有用的信息。使用 `-n` 获取更简洁的输出，或使用 `-q` 输出仅显示警告和错误的错误。\n\
  \n> ### 提示\n> `aelparse` 有助于寻找 `extensions.ael` 中的语法错误。\n\n使用选项 `-w` 时，`aelparse`\
  \ 将输出转到本地目录的 `extensions.conf.aeldump` 文件中：\n\n> ![image](img/00099.jpg)\n\n###\
  \ 6.3 对 extensions.conf 与 extensions.ael\n\n以下示例显示了 AEL 与标准 `extensions.conf` 的对比。首先，我们假设你对拨号计划已经熟悉。在接下来的示例中，AEL\
  \ 版本通常看起来长，但它的优势在大型拨号计划中才能体现。\n\n这是一个在 `extensions.conf` 中编写的典型上下文：\n\n```\n(example)\n\
  ```\n\n相同的结果在 `extensions.ael` 中可以实现：\n\n```\n(example)\n```\n\n#### 6.3.1 行结束\n\
  \nAEL 命令必须以分号 `;`结束，因为多个命令可能出现在同一行。然而，为了可读性，大多数人将每个命令放在一行。\n\n#### 6.3.2 上下文、扩展和优先级\n\
  \n上下文和优先级的描述是 AEL 与其前身不同之处。AEL 使用大括号 `{...}`。不再需要编号优先级（`1, n`），因此我们免去了每行都必须编号的 BASIC\
  \ 风格编程之苦。在下面，代码块的功能是等价的。\n\n这是 `extensions.conf` 中的一组简单的扩展：\n\n```\n(example)\n\
  ```\n\n相同的扩展在 `extensions.ael` 中看起来如下：\n\n```\n(example)\n```\n\n对于只需要单个命令的扩展，你可以跳过一层大括号，你的拨号计划仍然可以工作：\n\
  \n```\n(example)\n```\n\n但不要养成这种习惯。最好的做法始终包含它们，即使它们可能是多余的：\n\n```\n(example)\n```\n\
  \n大多数扩展确实需要多个命令，在编写代码时一致性是你的朋友。只有在少数情况下短形式才是合适的（例如 `jump`）。\n\n> ### 警告\n> 代码块的大括号\
  \ `{` 必须出现在同一行，而不是单独占一行！\n\n#### 6.3.3 注释\n\n在 `extensions.conf` 中，注释以分号为开头：\n\n\
  ```\n; comment\n```\n\nAEL 中的注释用双正斜杠 `//` 表示，如下：\n\n```\n// comment\n```\n\n> ###\
  \ 警告\n> 程序员们：不要使用 C 语言注释样式（/* ... */`）。每一行注释都必须以自己的 // 注释标记开头。\n\n#### 6.3.4 包含\n\
  \n我们可以在上下文内部包含上下文。在 `extensions.conf` 中包含的典型用法如下：\n\n```\n#include other.conf\n\
  ```\n\n\n\n\n> ![image](img/00109.jpg)\n\n> ### Warning\n> 在 AEL 中编写时请务必使用 `includes`\
