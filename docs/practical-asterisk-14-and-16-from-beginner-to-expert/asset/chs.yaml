  \ `minivmnotify`, `minivmrecord`，并参考 附录 C 中的 `minivmaccount`, `minivmcounter`。\n\
  \n## B.96 MinivmDelete()\n\n在 Mini-Voicemail 中删除消息。\n\n> `MinivmDelete(*filename*)`\n\
