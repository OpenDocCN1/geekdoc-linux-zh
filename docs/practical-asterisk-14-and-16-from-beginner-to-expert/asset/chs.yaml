  \n### C.6 CALLERID()\n\n`CALLERID(field)`\n\n返回或设置关于主叫的信息。`field` 是以下内容之一：\n\n>\
  \ `name`: 主叫的名字，作为字母数字字符串。建议保持此字符串较短（例如 15 个字符）。\n> `num`: 主叫号码，仅限数字。（取决于 Asterisk\
  \ 版本，有时也出现在 `number` 字段中。）\n> `all`: 带有角括号的的名称和号码（例如 `\"Robert Cossack <2125558721>\"\
  `）。\n> `ani`: 外发电话的 ANI^(3)。\n> `dnid`: 自动主叫识别\n\n\n\n\n\n> `DNID` 码。对应于拨出的号码。（有时也会出现在\
  \ `dnis` 字段中，可能取决于 Asterisk 的版本。）\n\n### 拨号/目的号码识别服务\n\n> • `rdnis`\n\nRDNIS 码。被转发到当前分机的号码。（这非常有用，例如，当活动语音箱的号码与拨出的分机号码不一致时。）\n\
  \n### 重定向拨号号码识别服务\n\n从 Asterisk 1.4 开始，旧的通道变量 `${CALLERIDNUM}` 被函数 `${CALLERID(num)}`\
  \ 替换（同样地，`${RDNIS}` 被 `$(CALLERID (rdnis))` 替换等）。应用程序 `SetCIDName()` 被 `Set(CALLERID(name)=Name)`\
  \ 替换（同样地，`SetCallerID()` 被 `Set(CALLERID(all)=Name <Number>)` 等替换）。\n\n> ![image](img/01130.jpg)\n\
  \n**Asterisk 版本：**\n\n![image](img/01131.jpg)\n\n**Asterisk 1.4 中该函数的内部帮助：**\n\n\
  > ![image](img/01132.jpg)\n\n**Asterisk 1.2 到 1.4 的内部帮助差异：**\n\n> ![image](img/01133.jpg)\n\
  \n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n\n> ![image](img/01134.jpg)\n\n### C.7 CDR()\n\
  \n`CDR(*field*)`\n\n读取或设置 CDR 字段。*field* 是以下内容之一（除非另有说明，否则只能读取）：\n\n#### 通话数据记录\
  \ (Call Data Record)\n\n> • `clid`\n\n主叫 ID (Caller ID)\n\n> • `src`\n\n源号码（主叫 ID\
  \ 号）\n\n> • `dst`\n\n通话目的地\n\n> • `dcontext`\n\n目的上下文\n\n> • `channel`\n\n通道名称\n\
  \n> • `dstchannel`\n\n目的通道（如果适用）\n\n> • `lastapp`\n\n最后执行的应用程序\n\n> • `lastdata`\n\
  \n最后执行的应用程序的参数\n\n> • `start`\n\n通话开始时间\n\n> • `answer`\n\n通话接听时间\n\n> • `end`\n\
  \n通话结束时间\n\n> • `duration`\n\n通话时长（秒）\n\n> • `billsec`\n\n通话接听后的时长（秒）（换言之，为计费时长）\n\
  \n> • `disposition`\n\n通话状态：`ANSWERED`（已响应）、`NO ANSWER`（未接听）、`BUSY`（忙音）或 `FAILED`（失败）\n\
  \n> • `amaflags`\n\nAMA 标记。可能的标记有 `DEFAULT`（默认）、`BILLING`（计费）、`DOCUMENTATION` 和\
  \ `OMIT`（省略）。有时 `BILLING` 和 `OMIT` 被 `BILL` 和 `IGNORE` 替换，可能取决于 Asterisk 版本。）\n\n\
  #### 自动消息计数 (Automated Message Accounting)\n\n> • `accountcode`\n\n计费账户的 ID，最多 20\
  \ 个字符。可以设置也可以读取。\n\n> • `uniqueid`\n\n通道的唯一 ID（最多 32 个字符）。\n\n> • `userfield`\n\n\
  用于存储任意信息的用户字段（最多 255 个字符）。可以设置也可以读取。\n\n> ![image](img/01135.jpg)\n\n**Asterisk\
  \ 版本：**\n\n![image](img/01136.jpg)\n\n**Asterisk 1.4 中该函数的内部帮助：**\n\n> ![image](img/01137.jpg)\n\
  \n> ![image](img/01138.jpg)\n\n**Asterisk 1.2 到 1.4 的内部帮助差异：**\n\n> ![image](img/01139.jpg)\n\
  \n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n\n> ![image](img/01140.jpg)\n\n### C.8 CHANNEL()\n\
  \n`CHANNEL(*field*)`\n\n读取/设置特定的通道参数。*field* 是以下内容之一（除非另有说明，否则只能读取）：\n\n> • `audioreadformat`\n\
  \n通道上入站音频的格式。\n\n> • `audionativeformat`\n\n通道的原生音频格式。\n\n> • `audiowriteformat`\n\
  \n通道上输出音频的格式。\n\n> • `callgroup`\n\nAsterisk 中的分机可以被分类为 0 到 63 号的通话组（例如作为客户编号）。这\
  \ 64 个通话组的限制似乎完全是任意的，可能无法满足所有用户。\n\n> • `channeltype`\n\n当前通道的通道驱动程序或“技术”（例如 AAX）。\n\
  \n> • `language`\n\n提示音的语言。可以设置也可以读取。\n\n> • `musicclass`\n\n在 `musicconf` 中定义的音乐等待类。\n\
  \n> • `state`\n\n通道状态：`Down`（离线）、`Off`（关闭）、`Dialing`（拨号中）、`Ringing`（响铃中）、`Up`（在线）。\n\
  \n> • `tonezone`\n\n“音区”定义了特定区域的标准指示（拨号、响铃、忙音）。已设置。\n\n> • `videonativeformat`\n\
  \n通道的原生视频格式。\n\n> ![image](img/01141.jpg)\n\n**Asterisk 版本：**\n\n![image](img/01142.jpg)\n\
  \n**Asterisk 1.4 中该函数的内部帮助：**\n\n> ![image](img/01143.jpg)\n\n> ![image](img/01144.jpg)\n\
  \n**Asterisk 1.2 到 1.4 的内部帮助差异：**\n\n> ![image](img/01145.jpg)\n\n### C.9 CHECKSIPDOMAIN()\n\
  \n`CHECKSIPDOMAIN(domain)`\n\n检查指定的域名（也可以是 IP 地址）是否为本地。返回域名。\n\nSet(foo=${CHECKSIPDOMAIN(123.45.67)})\n\
  \n### C.10 CURL()\n\n`CURL(URL [POST-data])`\n\n使用 `GET` 从指定的 *URL* 加载网页。如果提供了 `POST-data`，将通过\
  \ `POST` 发送。以字符串形式返回页面。\n\n> ![image](img/01149.jpg)\n\n**Asterisk 版本：**\n\n![image](img/01150.jpg)\n\
  \n**Asterisk 1.4 中该函数的内部帮助：**\n\n> ![image](img/01151.jpg)\n\n### C.11 CUT()\n\n\
  `CUT(*variablename, delimiter, field*)`\n\n（从 Asterisk 1.2.8 开始，使用管道符 `|`而不是逗号作为参数分隔符。）\n\
  \n根据指定的分隔符处理变量中的字符串并返回请求的字段。*field* 也可以是字段范围（例如 `2-4`）或多个字段和范围，用 `&` 分隔（例如 `2–4&6`；范围如\
  \ `3-`（从第 3 字段开始之后）或 `–3`（到第 3 字段结束）是可能的。）\n\n如果使用逗号作为分隔符，必须先用反斜杠进行转义；例如 `CUT(var,\\\
  ,,2)`。\n\n> ![image](img/01153.jpg)\n\n> ### 重要\n\n> \n\n> 参数 `variablename` 必须是变量名，而不是字符串。如果\
  \ `foo` 是变量名而 `bar` 是内容，以下示例是错误的：`CUT(${bar},,3)`\n\n\n\n\n\n另参见 `fieldqty`。\n\n\
