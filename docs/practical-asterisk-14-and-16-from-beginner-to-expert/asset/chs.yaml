  \ 1.4 到 1.6 的内部帮助差异：**\n\n> ![image](img/00922.jpg)\n\n### B.148 SendText()\n\n\
  向通道发送文本。\n\n> `SendText(*text*[,*option])`\n\n如果通道和设备支持文本传输，则向通道发送文本（例如打印在显示屏）。之后通道交给下一个优先级。如果不支持文本传输，选项\
  \ `j` 会使通道跳转到优先级 n+101（如果存在）。大多数通道使用 7 位 ASCII。如果传输无错误，则返回 0，否则返回 -1。将通道变量 `SENDTEXTSTATUS`\
  \ 设置为 `SUCCESS`、`FAILURE` 或 `UNSUPPORTED`。\n\n> `exten => 123,1,SendText(Welcome\
  \ to Asterisk)`\n\n**Asterisk 版本：**\n\n![image](img/00923.jpg)\n\n**Asterisk 1.4\
  \ 中此应用程序的内部帮助：**\n\n> ![image](img/00924.jpg)\n\n**Asterisk 1.2 到 1.4 的内部帮助差异：**\n\
  \n无\n\n\n\n\n\n# Asterisk 1.4 到 1.6 内部帮助的差异：\n\n> ![image](img/00925.jpg)\n\n另参见\
  \ `sendimage`, `sendurl`。\n\n## B.149 SendURL()\n\n向通道发送一个 URL。\n\n> `SendURL(*URL[,options*])`\n\
  \n向通道发送一个 URL 供设备调用，然后将通道交给下一个优先级节点。\n\n如果通道不支持 URL 传输，选项 `j` 将使通道跳转到优先级 n+101（如果该优先级存在）。选项\
  \ `wait` 将让应用程序等待 URL 加载的确认后再继续执行下一个优先级。\n\n如果 URL 无错误地传输，则返回 0，否则返回 -1。将通道变量 `SENDURLSTATUS`\
  \ 设置为 `SUCCESS`、`FAILURE`、`UNSUPPORTED` 或 `NOLOAD`（需要选项 `wait`；客户端未能成功加载 URL）。\n\
  \n> `exten => 123,1,SendURL([`www.mobileweather.org/index.xml,wait`](http://www.mobileweather.org/index.xml,wait))`\n\
  \n### Asterisk 版本：\n\n![image](img/00926.jpg)\n\n### Asterisk 1.4 中此应用程序的内部帮助：\n\
