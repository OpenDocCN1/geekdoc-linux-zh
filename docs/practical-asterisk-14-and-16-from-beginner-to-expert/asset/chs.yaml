  \n**另另 `group`, `group_count`, `group_list`。**\n\n### C.27 IAXPEER()\n\n`IAXPEER(*peername[:field]*)`\n\
  \n返回关于 IAX 对端的信息。`peername` 可以替换为 `CURRENTCHANNEL` 以指定当前通道。`field` 是以下之一：\n\n- •\
  \ **`ip`**: （默认）对端的 IP 地址\n- • **`status`**: 对端状态（当 `qualify=yes` 时）\n- • **`mailbox`**:\
  \ 配置的信箱\n- • **`context`**: 配置的上下文\n- • **`expire`**: 连接的过期时间（Unix 时间）\n- • **`dynamic`**:\
  \ 连接是否为动态（`yes|no`）\n- • **`callerid_name`**: 配置的 CID 名称\n- • **`callerid_num`**:\
  \ 配置的 CID 号\n- • **`codecs`**: 可用的解码器\n- • **`codec[x]`**: 首选的解码器 `x`（从 0 开始）\n\n\
