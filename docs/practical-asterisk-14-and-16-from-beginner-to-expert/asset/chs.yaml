  \ 中不可用\n\n**另请阅 附录 C。**\n\n### B.168 `SMS()`\n\n发送或接收短信（短消息系统）消息。\n\n> `SMS(*queue*[,options*])`\n\
  \n在模拟线路或 ISDN 线上，与具备短信能力的电话，或通过支持 ETSI^(17) ES 201 912 SMS 协议的短信中心管理短信交换。由于终端客户端\
  \ `smsq` 使用 FSK^(18) 频移键控，这在 GSM 等压缩编码器上可能无法工作。\n\n17. ETSI（欧洲电信标准协会）\n\n18. 频移键控\n\
  \n选项：\n\n> • `a`\n> 充接收者\n> • `s`\n> 充发送者（短信服务中心），与电话通信\n\n所有发送和接收队列均存储在 `/var/spool/asterisk/sms/`：来自短信中心到设备的消息位于\
  \ `sc-me.queue/` 中，从设备到短信中心的消息位于 `me-sc.queue/` 中。日志写入 `/var/log/asterisk/sms`。\n\
  \n当作为接收者 `(a)` 连接时，位于 `me-sc.queue/` 的消息会被发送并删除；收到的消息将写入 `sc-me.queue/`，文件名中带有时间戳。当作为发送者（短信服务中心）连接时，情况反之。\n\
  \n消息文件格式下文所示。缺失的参数意味着默认值：\n\n> *oa=Originating Address（发送者号码）*\n\n这包含完整的国家直拨号码，包括国家代码并以\
  \ + 前缀。例如，+19255554101 是一个有效号码。\n\n> *da=Destination Address（接收者号码）*\n\n同样，带有 +\
  \ 的完整国家直拨号码。\n\n> *scts=Service Centre Time Stamp（短信中心时间戳）*\n\n使用格式 YYYY-MM-DD HH:MM:SS\n\
  \n> ![image](img/00984.jpg)\n\n如果消息中出现 10, 13, 32-126, 128-255（十进制）以外的字符，`ud=` 将替换为\
  \ `ud#`，消息内容用十六进制编码。\n\n> ![image](img/00985.jpg)\n\n发送到短信 C 时，仅使用 `da` 和 `ud`；`oa`\
  \ 被忽略。发送到设备时，仅需要 `oa` 和 `ud`；`da` 被忽略。\n\n接收短信的扩展可能如下（其中 4165553331 是我们短信中心的号码）：\n\
  \n> ![image](img/00986.jpg)\n\n其中 `handleincomingsms` 可能是一个包装器或命令，包含；例如，`smsq--process=queue--queue=me-incoming`，它会为每条入站消息执行一次。\n\
  \n出站消息写入文件，但也可能按照以下（过时的）序列生成（4165553331 是短信中心的号码）：\n\n> ![image](img/00987.jpg)\n\
  \n更多信息和更多示例可以在 [www.voip-info.org/wiki/view/Asterisk+cmd+Sms](http://www.voip-info.org/wiki/view/Asterisk+cmd+Sms)找到。由于短信实现的差异极大，最好不要期望\
  \ `SMS()` 开箱即用就能工作。\n\n**Asterisk 版本：**\n\n![image](img/00988.jpg)\n\n**Asterisk\
