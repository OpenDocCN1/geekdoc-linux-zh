  \n设置呼叫 ID 显示标志。\n\n> `SetCallerPres(*presentation*)`\n\n为 Q.31 PRI（速率接口）连接设置呼叫 ID\
  \ 显示标志。类似于 `CallerPres()` 方法，但使用的是单词而不是掩码。\n\n有效的显示方式如下：\n\n* `allowed_not_screen`:\
  \ 允许且未显示\n* `allowed_passed_screen`: 允许且显示\n* `allowed_failed_screen`: 允许但显示失败\n\
  * `allowed`: 允许，网络号码\n* `prohib_not_screen`: 禁止且未显示\n* `prohib_passed_screen`: 禁止且显示\n\
  * `prohib_failed_screen`: 禁止但显示失败\n* `prohib`: 禁止，网络号码\n* `unavailable`: 不可用\n\n\
  返回 0。\n\n> ![image](img/00945.jpg)\n\n你可能需要在 `zap.conf` 中设置 `usecallingpres=yes`\
  \ 以使其生效。\n\n### Asterisk 版本：\n\n![image](img/00946.jpg)\n\n### Asterisk 1.4 中此应用程序的内部帮助：\n\
