  ### B.57 Festival()\n\n使用文本转语音（TTS）引擎向通话者读取文本。\n\n> `Festival(*text[,keys])`\n\n\
  连接到本地运行的 Festival 服务器（需要单独安装），向通话者播放指定的文本。如果定义了按键，将中断播放并返回按键值。\n\n> ![image](img/00592.jpg)\n\
  \n作为 `Festival()` 的替代方案，你也可以使用 `System()` 命令调用 `text2wave` 命令行程序，并使用 `Background()`\
  \ 或 `Playback()` 播放生成的音频流。\n\n> ![image](img/00593.jpg)\n\n### B.58 Flash()\n\n\
  在 Zap (DAHDi) 通道上执行“闪断”（flash hook）。\n\n> `Flash()`\n\n在 Zap (DAHDi) 通道上执行“闪断”。\n\
  \n> ### 注意\n\n闪断（也称为 switchhook-flash、flash hook 或 link）只是短时间按下模拟电话上的挂机键，时间在 80\
  \ 到 500 毫秒之间（取决于运营商），主要用于为模拟电话机提供功能控制（例如呼叫、三方通话、电话转移和类似服务）。\n\n成功后返回 0，如果通道不是 Zap\
  \ 通道则返回 −1。\n\n> `exten => 123,1,Flash()`\n\n如果出线支持闪断转移（通常是一项额外服务），你可能会在 Zap 通道上使用它：\n\
  \n> ![image](img/00597.jpg)\n\n有时需要调整闪断时长；请询问您所在地区的规范。这可以在 `zapata.conf` 中通过参数实现；例如\
  \ `flash=200`（该值为毫秒）。\n\n\n\n\n\n## Asterisk 从 1.2 到 1.4 的内部帮助差异：\n\n> ![image](img/00600.jpg)\n\
