  \n### B.18 ChanIsAvail()\n\n指示指定的通道是否可用。\n\n> `ChanIsAvail(*technology1*/*resource1*[&*technology2*/*resource2*...][,*options*])`\n\
  \n按照指定的顺序验证一个或多个查询的通道是否可用。成功时返回 0，失败返回 −1。\n\n如果给出了 `s`（状态）选项，当通道正在使用时，Asterisk\
  \ 将其视为不可用，即使它能够能够接收另一个电话。选项 `j` 设置为如果通道不可用，则将优先级跳转到 n+101。\n\n> ### 注意\n\n> 通道可用这一事实本身并不自动意味着它是空闲的，也不意味着通道上的设备会接受电话。这是通过对通道使用\
  \ `Dial()` 来确定的。\n\n`ChanIsAvail()` 设置了以下通道变量：\n\n> • `${AVAILCHAN}`\n> 可访问通道的名称，包括电话的会话号。\n\
  > • `${AVAILORIGCHAN}`\n> 标准通道名称（即不带会话号的通道名称）。\n> • `${AVAILSTATUS}`\n> 通道的状态码：\n\
  > • `AST_DEVICE_UNKNOWN (0)`\n> 通道状态未知。这是一个有效通道，但我们不知道它的状态。\n> • `AST_DEVICE_NOT_IN_USE\
  \ (1)`\n> 通道未使用。\n> • `AST_DEVICE_IN_USE (2)`\n> 通道正在使用。\n> • `AST_DEVICE_BUSY (3)`\n\
  > 通道忙碌。\n> • `AST_DEVICE_INVALID (4)`\n> 通道未知。\n> • `AST_DEVICE_UNAVAILABLE (5)`\n\
  > 通道不可且未注册。\n> • `AST_DEVICE_RINGING (6)`\n> 通道正在振响。\n\n> ### 注意\n\n> 此应用程序在 MGCP\
  \ 通道上的行为不符合预期。\n> ![image](img/00427.jpg)\n\n**Asterisk 版本：**\n\n![image](img/00428.jpg)\n\
