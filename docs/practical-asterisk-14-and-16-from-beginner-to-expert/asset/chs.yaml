  \ `extensions.conf` 可能是更好的选择。然而，对于经常与 Asterisk 打道的应用开发者来说，AEL 拥有太多节省时间且减少头疼的功能，值得一试。即使\
  \ Digium 停止对 AEL 的支持（这极不可能），始终有 `aelparse` 可以回到旧 `.conf` 世界。\n\n## 7. 协议\n\n本章涵盖了我们实际上将语音数据从一点传输到另一点的技术。用于此目的的会话协议实际上是一种管理这种传输的“语法”，反过来构建在构成\
  \ TCP/IP 协议栈的传输层协议之上：即 TCP 和 UDP。在排除某些问题时，你应该对这些协议有基本的理解，这就是为什么我们在这里详细描述了它们。这种理解对于实现\
  \ Asterisk 并不是严格必要的，但仍然非常有价值。因此，本章旨在作为需要时的一个参考。\n\n### 7.1 网络协议\n\nTCP 是一种确保发送者传输的所有信息完整且按正确顺序到达接收者的协议。这种可靠性是以相对较高的传输开销为代价的，在拥塞期间，这更容易导致传输中断或延迟。相比之下，它的兄弟协议\
  \ UDP 在确保接收所有内容方面几乎没有投入投入；相反，它只是在每个数据包准备好交付时立即发送出去，而不考虑它们是否完整到达甚至是否按正确的顺序到达。TCP\
  \ 通过计算每个数据包的校验和并在接收数据包时比较校验和，以及为每个数据包附加序列号并向目标主机请求收发确认，来确保数据的安全、完整传输。如果数据包损坏或丢失，目标主机可以请求重传。这就是\
  \ HTTP（万维网）流量的传输方式。\n\n相比之下，流媒体数据（如视频和音频传输中使用的）实际上不需要这种程度的严谨性，因为它对时间非常敏感。如果丢失了视频包，重传它是没有意义的，因为当它到达时，视频已经播放过了缺失数据点。由于这个原因，UDP\
  \ 用于流媒体数据。它没有交付保证，但传输开销远小于 TCP。作为一个通用指南，你可以这样定义这两个协议：TCP 用于“当它必须完整到达，无论花费多长时间”，而\
  \ UDP 用于“当它必须快速到达，且我们不在乎丢失几个数据包时”。\n\n两种协议在 VoIP 应用中都很重要，因为连接是使用 TCP 建立，而语音数据本身是使用\
  \ UDP 传输的。特别是对于音频数据包，数量确实比质量更重要。\n\n#### 7.1.1 传输控制协议\n\n传输控制协议 (TCP) 是一种管理计算机之间数据传输的协议。所有现代计算机的操作系统都理解并支持\
  \ TCP，并使用它与网络上的计算机交换数据。它是一种可靠的、面向连接的传输协议，是互联网协议族的一部分。\n\nTCP 由 Robert E. Kahn 和\
  \ Vinton G. Cerf 开发，最初于 1973 年作为一个研究项目开始，并最终在 1981 年发布互联网标准文档 `RFC 793` 达到顶峰，该文档构成了之后所有\
  \ TCP 标准文档的基础，并且像它的许多伴侣协议一样，它仍然是一个“活的”协议，通过新的 RFC 文档不断扩展和更新，以满足新的需求和情况。\n\n[1].\
  \ 请求征询（Request For Comments）。这些文档最初是向互联网工程社区同仁提交的简单提议，并接受修订；当草案提议被接受后，它会被加上注释并成为标准正文的一部分。\n\
  \nTCP 在网络中的两个端点之间建立虚拟连接。数据可以向任何方向传输。TCP 几乎总是封装在 `IP`（互联网协议）中；由于这个原因，你经常会听到使用 `TCP/IP`\
  \ 术语。它允许双向数据传输，无论连接由哪个端点发起；它会自动检测并纠正数据丢失，并自动调整数据传输率以适应网络状况。这些功能加上标准开放的事实，使得 TCP\
  \ 成为最广泛的数据传输协议，今天它被用于万维网、电子邮件、点对点文件共享和其他流行的网络服务。\n\n##### 7.1.1.1 TCP 连接\n\nTCP\
  \ 是端到端（类似电路的）、全双工（意味着允许同时向两个方向传输数据）连接。或者，连接也可以被组装为两个半双工连接，信息可以在两个方向上传输，尽管不是同时进行；数据可以为了连接而返回。连接管理本身由\
  \ TCP 协议栈处理，该软件通常附属于操作系统内核或作为内核的一部分。在 Linux 的情况下，TCP 栈位于内核本身；网络软件（如电子邮件客户端、网络浏览器和服务器）访问该堆栈。\n\
  \n每个 TCP 连接由两个端点组成，每个端点建立一对标识特征：即端点的唯一 IP 地址和端口。这对组合形成了一个允许双向数据传输的软件接口，有时被称为套接字（socket）。参与连接的计算机通过其\
  \ IP 地址来标识，而特定的连接通过端口号来标识。结果是，例如 Web 服务器可以从其 80 端口到远程端建立多个连接；它跟踪这些多个连接，是因为每个连接在远程端都使用不同的端口。\n\
  \n端口是 16 位数字，因此范围从 0 到 65535。0 到 1023 的端口被保留并由互联网数字分配机构 (IANA) 分配给特定应用程序。例如，使用 HTTP\
  \ 的网络流量在为 HTTP 流量保留的端口 80 端口上传输。特定端口的使用没有强制性；管理员可以在 21 以外的端口上运行 FTP 服务器。然而，对于公共访问的服务，客户端软件将期望在\
  \ IANA 指定端口上找到其特定服务，而特殊的、私有的服务通常在 1024 以上的未分配端口上运行。\n\n##### 7.1.1.2 连接的建立与销毁\n\n\
