  \ `log`, `dumpchan`。\n\n## B.186 VMAuthenticate()\n\n使用指定信箱的语音密码对调用者进行验证。\n\n> `VMAuthenticate([*mailbox*][@*context*][,*options*])`\n\
  \n行为与 `Authenticate()` 相同，但密码是从 `voicemail.conf` 配置（以及可选上下文）中获取的。\n\n如果指定了信箱，则仅接受该信箱的密码。如果没有，将接受任何语音箱密码！通道变量\
  \ `${AUTH_MAILBOX}` 将填充为已验证的信箱名称。\n\n选项 `s` 抑制提示。\n\n> ![image](img/01049.jpg)\n\
