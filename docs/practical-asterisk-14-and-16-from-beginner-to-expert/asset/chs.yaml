  Asterisk 1.4 中不可用\n\n**另见 `dbget`，并在 附录 C 中参见 `db`。**\n\n### B.37 DeadAGI()\n在非活跃通道上运行符合\
  \ AGI 的程序。\n\n![image](img/00489.jpg)\n\n在非活跃（挂）通道上运行符合 AGI 的程序。通过 AGI (Asterisk\
  \ Gateway Interface)，你可以使用几乎任何语言编写的程序操作通道。AGI 程序可以控制通道、播放音频、解释并存储 DTMF 信号；AGI 程序通过\
  \ `stdin` 和 `stdout` 与 Asterisk 交换数据。指定的参数将原样传递给 AGI 程序。\n\n此应用专用于非活跃（挂）通道，因为标准的\
  \ AGI 接口在通道挂断后将无法工作。然而，执行时通道不需要是“死的”。\n\n如果应用导致挂断，则返回 -1；若无挂断退出返回 0。\n\n![image](img/00490.jpg)\n\
  \n### Warning\n只要 AGI 程序运行，通道就会被视为活跃状态。这会对 CDR 产生影响。此外注意，通道挂断时 DeadAGI 应用会接收 `SIGHUP`\
  \ 信号，你可能需要在 AGI 程序中显式忽略它：\n\n![image](img/00491.jpg)\n\nAGI 程序在挂断后停止通信也很，否则它将接收\
  \ `SIGPIPE` 信号并结束（如上面的示例所示显式忽略）。\n\n**Asterisk 版本：**\n![image](img/00492.jpg)\n\n\
  **Asterisk 1.4 中该应用的内部帮助：**\n![image](img/00493.jpg)\n\n**Asterisk 1.2 到 1.4 的内部帮助差异：**\n\
  ![image](img/00494.jpg)\n\n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n![image](img/00495.jpg)\n\
  ![image](img/00496.jpg)\n\n**另见 `agi`, `fastagi`](#Practical_As-sk_1.4_and_1.6_split_029.html_filepos910187)。**\n\
  \n### B.38 Dial()\n连接通道。\n\n![image](img/00497.jpg)\n\n将两个通道连接在一起。^(6)\n\n6。通常情况下，Asterisk\
  \ 支持的任何类型的通道都可以连接（例如，IAX, SIP, H.323, Skinny, PRI, FXO, FXS, Local）。\n\n`Dial()`\
  \ 可能是 Asterisk 中最重要的应用。我们建议你仔细阅读本节，并在必要时多次阅读。\n\n`Dial()` 接受所有有效的通道类型（例如 SIP, IAX2,\
  \ H.323, MGCP, Local 或 Zap），但允许的参数是特定于通道；即，通道需要或接受的参数取决于通道技术的性质。例如，SIP 通道需要 IP 地址和用户信息，而\
  \ ZAP 通道则需要电话号码。\n\n当指定基于网络的通道类型时，参数（如 IP 地址、用户名、密码和远程分机号）可以作为 `Dial()` 的选项提供，或者包含在相应的\
  \ `.conf` 文件的主机配置部分中。如果使用后种方法，必须存在所有所需的配置信息。\n\n这里有一个示例：\n\n```\nexten => s,1,Dial(SIP/richard:secret@widgets.biz)\n\
  ```\n\n此扩展实现相同的功能：\n\n```\nexten => s,1,Dial(SIP/a_SIP_friend)\n```\n\n...只要 `a_SIP_friend`\
  \ 在 `sip.conf` 中被定义为通道：\n\n![image](img/00498.jpg)\n\n有时分机附加在地址信息上，如示例所示：\n\n```\n\
  exten => s,1,Dial(IAX2/user:secret@widgets.biz/500)\n```\n\n\n\n\n远程系统被要求将呼叫连接到接入通道中的分机\
  \ 500。此分机并非必需，因为使用了远程系统上的通道配置；或者，呼叫被传递到接入上下文中的默认 `s` 分机。\n\n最终，由远程主机决定如何处理该呼叫；你所做的只是请求特殊的呼叫处理。\n\
  \n如果没有指定 `timeout`，通道将无限期振铃。这种行为并不一定是不可接受的，因此没有必要自动设置此参数。请注意，“无限”最终可能会变成非常长的时间。\n\
  \n`timeout` 以秒为单位。它始终跟在设备信息之后：\n\n```\nexten => s,1,Dial(IAX2/user:secret@widgets.biz/500,20)\n\
  ```\n\n通过 `Dial()`，你可以同时振号多个通道。呼叫将按照“先来后到”原则处理；第一个接听的分机将接听电话，所有其他分机将停止振铃并变为可用状态：\n\
  \n```\nexten => s,1,Dial(SIP/2000&SIP/2001&SIP/2303)\n```\n\n`Dial()` 应用的强大之处很大在于其选项，选项始终跟在设备和超时信息之后，如下：\n\
  \n```\nexten => s,1,Dial(IAX2/user:secret@widgets.biz/500,60,options)\n```\n\n###\
  \ 警告\n\n如果你想提供选项，即使超时值为空，仍需要提供一个用逗号分隔的位符：\n\n```\nexten => s,1,Dial(IAX2/user:secret@widgets.biz/500,,options)\n\
  ```\n\n以下是 `Dial()` 应用的有效选项：\n\n- `d`: 允许呼叫者在等待当前分机接听时拨打另一个单数字分机。（例如，当电话在振铃时，呼叫者拨打\
  \ 4，呼叫将立即传递到 4 分机。除非设置了 `${EXITCONTEXT}`，否则该分机将处于当前上下文。）\n- `t`: 由*被叫方*发起的盲转（Blind\
  \ transfer）。允许被叫方通过按下盲转键（通常为 #）转移呼叫。选择此选项时无法进行重新邀请（Reinvites），因为 Asterisk 必须监控连接以检测被叫方何时按下\
  \ # 键。\n- `T`: 由*呼叫方*发起的盲转。允许呼叫方通过按下盲转键（通常为 #）转移呼叫。选择此选项时无法进行重新邀请，因为 Asterisk 必须监控连接以检测被叫方何时按下\
  \ # 键。\n- `w`: 允许*被叫方*通过按下 `automon` 键序列（在 `features.conf` 中定义）开始录音呼叫。如果设置了 `TOUCH_MONITOR`\
  \ 变量，其值记录开始时作为参数传递给 `Monitor()`。如果没有设置，则将 `WAV,,m` 传递给 `Monitor()`。\n- `W`: 允许*呼叫方*通过按下\
  \ `automon` 键序列（在 `features.conf` 中定义）开始录音呼叫。\n- `f`: 将主叫 ID 设置为拨打或重定向出局呼叫的线路。某些公共电话网（PSTN）不允许使用分配给你的之外的分机\
  \ ID。例如，如果你有一个 PRI，你将使用 `f` 将 SIP 分机提供的主叫 ID 覆盖为属于 PRI 上出局 Zap 通道的 ID。\n- `o`: 使用呼叫接入侧收到的主叫\
  \ ID 作为出局侧的主叫 ID。这对于呼叫被接纳然后转移的情况非常有用；在正常情况下，初始接收者的主叫 ID 将用于出局侧，这可能会让最终接收者感到困惑。例如，Joe\
  \ 拨给 Mary；Mary 决定 Joe 确实需要和 Don 通话并转移了呼叫。如果设置了选项 `o`，当 Mary 转给 Don 时，Don 在显示器上看到的是\
  \ Joe 的号码，而不是 Mary 的号码。\n- `r`: 为呼叫方生成振铃音。通常 Asterisk 会在的时候生成振铃音。选项 `r` 强制它在任何情况下都这样做。有时终端设备不提供有用的呼叫进度信息（或完全没有），就需要\
  \ `r`；然而，这可能导致奇怪的行为，例如初始振铃被忙音信号中断。\n- `m[class]`: 向呼叫者播放音乐直到呼叫被接听。可选地，你可以提供等待音乐类（在\
  \ `musiconhold.conf` 中定义）。\n- `M(x[^arg])`: 当呼叫被接听时运行宏 `x`，可选地传递用 `^` 分隔的参数。宏可以将\
  \ `MACRO_RESULT` 通道变量设置为以下值之一：\n    - `ABORT`: 挂断呼叫的两端。\n    - `CONGESTION`: 表示线路拥堵。\n\
  \    - `BUSY`: 表示线路忙忙（并跳转到 n+101）。\n    - `CONTINUE`: 挂断被叫端并在拨计划中继续。\n    - `GOTO:<context>^<extension>^<priority>`:\
  \ 跳转到指定的点。\n- `h`: 允许被叫方通过按下 # 挂机（注：原文为 *，通常对应 #）。\n- `H`: 允许呼叫方通过按下 * 挂机。\n- `C`:\
  \ 重置此呼叫的通话详细记录 (CDR)。\n- `P[(x)]`: 如果没有主叫 ID，则使用隐私管理器。\n- `g`: 当目标通道挂断后在上下文中继续。\n\
  - `G(context^extension^priority)`: 当呼叫被接听时，将两个通道都丢入指定的*上下文*、*分机*和*优先级*。\n- `A(x)`:\
  \ 向被叫方播放公告，其中 `x` 是声音文件前缀。例如，`A(confirm)` 将播放 `/var/lib/asterisk/sounds` 中可以找到的最有效\
  \ confirm 版本（如 `confirm.gsm` 或 `confirm.wav`）。\n- `D([called][:calling])`: 在呼叫被接听后桥接前发送\
  \ DTMF 数字。`called` 数字传输给被叫方，`calling` 数字传输给呼叫方。可以设置一个或两个参数。\n- `L(x[:y][:z])`: 将呼叫时长限制为\
  \ `x` 毫秒。在达到最大时长前 `y` 毫秒，之后直到呼叫结束每 `z` 毫秒给一次警告。*x* 必须定义，*y* 和 *z* 是可选的。可以通过以下变量进一步控制：\n\
  \    - `LIMIT_PLAYAUDIO_CALLER=yes|no`: 设置呼叫方是否应该听到公告。\n    - `LIMIT_PLAYAUDIO_CALLEE=yes|no`:\
  \ 设置被叫方是否应该听到公告。\n    - `LIMIT_TIMEOUT_FILE=filename`: 指定在达到最大时长且呼叫结束时播放的文件。\n \
  \   - `LIMIT_CONNECT_FILE=filename`: 指定在呼叫连接时播放的文件。\n    - `LIMIT_WARNING_FILE=filename`:\
  \ 指定在设置 *y* 时为警告信号播放的文件。\n- `j`: 开启优先级跳转。也就是说，如果所有通道响应忙音，呼叫将跳转到优先级 n+101（其中 n 是当前优先级）。\n\
  - `n`: 隐私管理器设置。主叫介绍不会保存到 `priv-callerintros` 目录中。\n- `N`\n\n\n\n\n> 隐私管理器设置。如果提供了主叫\
