  \n**另参阅 附录 C。**\n\n### B.45 EAGI()\n\n调用符合 AGI 标准的应用程序。\n\n> `EAGI(*program[,argument1[,argument2[,...]]]*)`\n\
  \n（类似于 `AGI()`、`FastAGI()`、`DeadAGI()`）\n\n`EAGI()`（扩展 AGI）的工作与普通的 `AGI()` (agi)\
  \ 相同，但它提供了对传入音频流的访问。传入的音频流通过文件描述符 3 提供.^(7)\n\n7。提醒：0: stdin, 1: stdout, 2:stderr。文件描述符\
  \ 3 可以自由分配。\n\nAGI 脚本或程序可以用几乎任何可以想象的语言（例如 Perl、PHP）实现，并用于操作通道、播放音频文件、解释 DTMF 振音等。Asterisk\
  \ 通过 `stdin` 和 `stdout` 与 AGI 程序进行通信。参数在执行时直接传递给 AGI 程序。\n\nAGI 程序必须在文件系统中被标记为可执行。该路径相对于\
  \ Asterisk AGI 目录，默认路径为 `/var/lib/asterisk/agi-bin`，也可以以绝对路径的形式指定。\n\n若要在非活动通道上运行\
  \ AGI 程序（例如在 `h` 扩展的情况下，此时通道已挂机），请改用 `DeadAGI()`。\n\n在挂机或 AGI 程序请求挂机时返回 −1；若无挂机请求，则返回\
  \ 0。\n\n> ![image](img/00543.jpg)\n\n**Asterisk 版本：**\n\n![image](img/00544.jpg)\n\
