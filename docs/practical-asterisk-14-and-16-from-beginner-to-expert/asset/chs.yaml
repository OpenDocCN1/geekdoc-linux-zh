  \ SIP 数据包中可能会出现多次（例如 `Via`），你可以通过 `number` 指定你想要查看的标头实例。\n\n> ![image](img/01283.jpg)\n\
  \n**Asterisk 版本：**\n![image](img/01284.jpg)\n\n**Asterisk 1.4 中此函数的内部帮助：**\n> ![image](img/01285.jpg)\n\
