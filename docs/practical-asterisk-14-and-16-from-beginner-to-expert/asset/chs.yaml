  \ Demo\n演示 AMI 访问的小型示例程序可以在此处运行：\n\n`http://localhost:8088/asterisk/static/ajamdemo.html`\n\
  \n它使用了非常实用的 JavaScript 库原型 (`www.prototypejs.org`) 进行 AJAX 访问，并显示当前活动通道的 `Status`。你可以将\
  \ AMI 演示作为你自己的 AJAX 应用的基础。\n\n##### 5.4.2.3 Apache\nAsterisk Web 服务器是一个极简实现，不能被视为运行\
  \ PHP 脚本或使用模块的“正式”Web 服务器的完全替代。要统一同时使用这两者的系统，可以在 `httpd.conf` 的相应位置添加以下内容将 Apache\
  \ 作为 AMI 的代理：\n\n```\nProxyPass /ajam http://localhost:8088/asterisk\n```\n\n这样所有对\
  \ `/ajam` 的请求将传递给 AMI，而不是由 Apache 服务。\n\n## 16. Asterisk 网关接口\n\nAsterisk Gateway\
  \ Interface (AGI) 可以与 Web 服务器上的 CGI (通用网关接口) 进行比较。这些是在拨号计划 (`extensions.conf`) 内部调用的外部程序。AGI\
  \ 脚本可以与 Asterisk 交互并执行命令。原则上，AGI 脚本可以用任何语言编写。\n\n### 16.1 数据流\n\n使用 AGI，理解流模型是绝对要求的。以下是\
  \ Asterisk 可以传输的所有标头列表：\n\n#### 16.1.1 STDIN\nAGI 脚本通过标准输入 (STDIN) 从 Asterisk 接收信息。格式如下：\n\
  \n![image](img/00247.jpg)\n\n随后是一个空行，Asterisk 通过此指示传输完成。\n\n#### 16.1.2 STDOUT\n\
  一旦 AGI 脚本从 Asterisk 接收到信息，它通过标准输出 (STDOUT) 向 Asterisk 发布命令。要监控这些，请在 CLI 中输入 `set\
  \ verbose 5` 以增加详细程度。\n\n#### 16.1.3 STDERR\n标准错误 (STDERR) 是将错误或调试消息带到 Asterisk\
  \ 控制台 (CLI) 的流。\n\n### 16.2 各种语言示例\n\n默认情况下，Asterisk 在 `/var/lib/asterisk/agi-bin`\
  \ 中查找 AGI 脚本。\n\n确保 Asterisk 实际上允许运行你想让它运行的脚本。可以通过系统命令 `chmod 755` `script_name`\
  \ 来保证这一点。\n\n下面描述了几种不同语言的 AGI 程序。\n\n\n\n\n第一行指示 shell 这是一个 Perl 脚本，并将由位于 `/usr/bin/perl`\
