  \ B.118 Playback()\n\n向呼叫者播放音频文件。\n\n```\nPlayback(*filename*[,options*])\n```\n\
  \n\n\n\n向呼叫者播放 `filename`（位于 `/var/lib/asterisk/sounds` 目录下）。文件名不包含扩展名；Asterisk\
  \ 会自动选择转码成本最低的格式。可以指定选项。\n\n选项 `skip` 导致如果通道不在上电（up）状态，则跳过该消息。\n\n在播放音频文件之前响应通道，除非指定了\
  \ `noanswer`。注意，并非所有通道都支持在“挂机”时播放。\n\n当通道挂断时返回 −1。如果找不到文件，则跳转到存在的优先级 `n+101`。\n\n\
  > ![image](img/00814.jpg)\n\n**Asterisk 版本：**\n\n![image](img/00815.jpg)\n\n**Asterisk\
  \ 1.4 中此应用程序的内部帮助：**\n\n> ![image](img/00816.jpg)\n\n**Asterisk 1.2 到 1.4 的内部帮助差异：**\n\
  \n> ![image](img/00817.jpg)\n\n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n\n> ![image](img/00818.jpg)\n\
  \n**另见 `background`。**\n\n### B.119 Playtones()\n\n播放一个或多个音调。\n\n> `Playtones(*tones*)`\n\
  \n播放一个或多个音调的列表。`Playtones()` 在后台运行；即在拨号计划继续执行时，它将继续播放音调。参数 `tones` 是 `indications.conf`\
  \ 中定义的音调名称，或者是音调频率和持续时间的列表。关于如何定义自定义音调的解释，请参阅 `indications.conf`。\n\n使用 `StopPlaytones()`\
  \ 停止播放音调。\n\n> ![image](img/00819.jpg)\n\n**Asterisk 版本：**\n\n![image](img/00820.jpg)\n\
  \n**Asterisk 1.4 中此应用程序的内部帮助：**\n\n> ![image](img/00821.jpg)\n\n**Asterisk 1.2 到\
  \ 1.4 的内部帮助差异：**\n\n无\n\n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n\n> ![image](img/00822.jpg)\n\
  \n**另见 `stopplaytones`, `indications.conf`, `busy`, `congestion`, `progress`, `ringing`。**\n\
  \n### B.120 PrivacyManager()\n\n如果无法获取呼叫者 ID，则请求输入呼叫者的电话号码。\n\n> `PrivacyManager([maxRetries[,minLength[,options]]])`\n\
  \n如果没有收到 ID，通道将接通，并要求呼叫者输入自己的电话号码。如果线路上存在呼叫者 ID，`PrivacyManager()` 将不起作用。\n\n呼叫者有\
  \ `maxRetries`（默认值为 3）次尝试提供至少 `minLength`（默认值为 10）位数字的有效号码。默认值设置在 `privacy.conf`\
  \ 中，该文件可能包含以下内容：\n\n> • `maxretries`: 叫者尝试输入符合 `minLength` 设置长度的号码的最大次数（通常为 3）。\n\
  > • `minlength`:号码被接受时必须具有的最小位数（通常为 10）。\n\n如果你想防止 `PrivacyManager()` 每次被调用时都读取配置文件，可以在拨号计划中设置值。\n\
  \n如果设置了选项 `j`，当呼叫者在允许的次数内未能提供有效号码时，跳转到 `n+101`。通道变量 `PRIVACYSTATUS` 被设置为 `SUCCESS`\
  \ 或 `FAILED`，表示管理器是否能够从呼叫者处获取有效的电话号码。\n\n> ![image](img/00823.jpg)\n\n**Asterisk\
  \ 版本：**\n\n![image](img/00824.jpg)\n\n**Asterisk 1.4 中此应用程序的内部帮助：**\n\n> ![image](img/00825.jpg)\n\
  \n**Asterisk 1.2 到 1.4 的内部帮助差异：**\n\n无\n\n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n\n> ![image](img/00826.jpg)\n\
  \n**另见 `zapateller`。**\n\n### B.121 Proceeding()\n\n表示通话正在进行中。\n\n> `Proceeding()`\n\
  \n向呼叫通道发送消息，指示通话正在进行中。\n\n**Asterisk 版本：**\n\n![image](img/00827.jpg)\n\n**Asterisk\
  \ 1.6 中此应用程序的内部帮助：**\n\n> ![image](img/00828.jpg)\n\n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n\
  \n无\n\n**另见 `progress`。**\n\n### B.122 Progress()\n\n指示通话正在进行。\n\n> `Progress()`\n\
  \n向呼叫者提供带内指示（如果可用），以便其知道“正在发生某些情况”。返回 0。\n\n> ![image](img/00829.jpg)\n\n**Asterisk\
  \ 版本：**\n\n![image](img/00830.jpg)\n\n**Asterisk 1.4 中此应用程序的内部帮助：**\n\n> ![image](img/00831.jpg)\n\
  \n**Asterisk 1.2 到 1.4 的内部帮助差异：**\n\n无\n\n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n\n无\n\
  \n**另见 `busy`, `congestion`, `playtones`, `ringing`。**\n\n### B.123 Queue()\n\n\
  将通话放入指定的队列。\n\n> `Queue(*queue[,options[,announcement[,timeout]]*)`\n\n将接入通话传入指定的队列（在\
  \ `queues.conf` 中定义）。\n\n可用选项如下：\n\n> • `t`: 允许被叫者转移。\n> • `T`: 允许呼叫者转移。\n> • `d`:\
  \ 数据质量（调制解调）通话。\n> • `h`: 被叫者按键结束通话。\n> • `H`: 呼叫者按键结束通话。\n> • `n`: 超时时不重试；进入下一个优先级。\n\
  > • `r`: 播放等待铃音乐。\n> • `i`: 忽略来自队列的请求；无操作。\n> • `w`: 允许被叫者通过 `Monitor()` 录音。\n>\
  \ • `W`: 允许呼叫者通过 `Monitor()` 录音。\n\n如果通话可以转移，还可以被另一个用户提取。\n\n`announcement` 参数指定在队列成员接听之前向呼叫者播放的等待等待；如果有，则在\
  \ `queues.conf` 中定义。如果呼叫通道支持，则发送可选的 `URL`。这可以用于兼容的电话显示队列信息。\n\n`timeout` 参数导致通话在\
  \ `timeout` 秒后离开队列。默认值为 300 秒（5 分钟）。\n\n当起始通道挂断或通话与队列成员连接并由一方结束时，返回 −1。如果队列满、不存在或没有成员，则返回\
  \ 0；执行下一个优先级。\n\n> ![image](img/00832.jpg)\n\n**Asterisk 版本：**\n\n![image](img/00833.jpg)\n\
  \n**Asterisk 1.4 中此应用程序的内部帮助：**\n\n> ![image](img/00834.jpg)\n> ![image](img/00835.jpg)\n\
  \n**Asterisk 1.2 到 1.4 的内部帮助差异：**\n\n> ![image](img/00836.jpg)\n\n**Asterisk 1.4\
  \ 到 1.6 的内部帮助差异：**\n\n> ![image](img/00837.jpg)\n> ![image](img/00838.jpg)\n> ![image](img/00839.jpg)\n\
  > ![image](img/00840.jpg)\n\n**另见 `queuelog` 和 第 12 章, “队列](#Practical_As-sk_1.4_and_1.6_split_020.html_filepos478254).”**\n\
  \n### B.124 QueueLog()\n\n向队列日志写入一条条目。\n\n```\nQueueLog(*queue*,*uniqueID*,*agent*,*event*[,*additionalinfo*])\n\
  ```\n\n\n\n\n向队列日志（通常为 `/var/log/asterisk/queue_log`）写入条目。允许定义自定义事件。更详细的解释请参见第 12\
  \ 章。\n\n> `QueueLog(support,${UNIQUEID},${AGENT},LUNCH,Bon appetit)`\n\n**Asterisk\
  \ 版本：**\n\n![image](img/00841.jpg)\n\n**Asterisk 1.4 中此应用程序的内部帮助：**\n\n> ![image](img/00842.jpg)\n\
