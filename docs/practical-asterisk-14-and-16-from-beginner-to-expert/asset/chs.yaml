  \n![image](img/0030.jpg)\n\n默认设置在 `amd.conf` 中：\n\n> • `initialSilence`\n\n> 回报之前的静音。如果超过此值，将\
  \ `${AMDSTATUS}` 设置为 `MACHINE`。\n\n> • `greeting`\n\n> 回报时长。如果超过此值，将 `${AMDSTATUS}`\
  \ 设置为 `MACHINE`。\n\n> • `afterGreetingSilence`\n\n> 回报后的静音。如果超过此值，将 `${AMDSTATUS}`\
  \ 设置为 `HUMAN`。\n\n> • `totalAnalysisTime`\n\n`AMD()` 用于判断远端是 `HUMAN` 还是 `MACHINE`\
  \ 的允许时长。\n\n> • `minWordsSilence`\n\n> 被认为是单词的最小持续时间。\n\n> • `betweenWordsSilence`\
  \ 单词之间的最小静音时长。\n\n> • `maxNumberOfWords` 回报中的最大单词数。如果超过此值，将 `${AMDSTATUS}` 设置为 `MACHINE`。\n\
  \n> • `silenceThreshold`\n\n> 静音阈值。\n\n此应用程序通过通道变量 `AMDSTATUS` 和 `AMDCAUSE` 输出结果。\n\
  \n`AMDSTATUS` 可以取以下值：\n\n> • `MACHINE`\n\n> 远端是机器。\n\n> • `HUMAN`\n\n> 远端是人类。\n\n\
  > • `NOTSURE`\n\n> 阈值情况用 `NOTSURE` 表示。\n\n> • `HANGUP`\n\n> 远端已挂断。\n\n`AMDCAUSE`\
  \ 可以分配以下值：\n\n> • `TOOLONG`-*<%d total_time>*\n\n> • `INITIALSILENCE`-*<%d silenceDuration>-<%d\
  \ initialSilence>*\n\n> • `HUMAN`-<%d silenceDuration>-*<%d afterGreetingSilence>*\n\
  \n> • `MAXWORDS`-*<%d wordsCount>-<%d maximumNumberOfWords>*\n\n> • `LONGGREETING`-*<%d\
  \ voiceDuration>-<%d greeting>*\n\n> ![image](img/00391.jpg)\n\n\n\n\n## Asterisk\
