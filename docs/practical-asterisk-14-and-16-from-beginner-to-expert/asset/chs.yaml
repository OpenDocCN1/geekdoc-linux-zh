  \n## 11 重新许可\n\n“大规模多作者协作站点”（或“MMC 站点”）是指任何发布受版权保护的作品，并为任何人编辑这些作品提供显著设施的万维网服务器。任何人都可以编辑的公共维基就是此类服务器的示例。该站点中包含的“大规模多作者协作”（或“MMC”）是指在\
  \ MMC 站点上如此发布的任何受版权保护的作品。\n\n“CC-BY-SA”是指由知识产权组织（Creative Commons Corporation，一家总部位于加利福尼亚州旧金山的非营利机构）发布的知识共享署名-相同方式共享\
  \ 3.0 许可证，以及该组织发布的该许可证的未来后续许可版本。\n\n“合并”（Incorporate）是指将文档全部或部分作为另一文档的一部分发布或重新发布。\n\
