  \ transfer）结合使用，这样您就知道通话被停在了哪里。此应用程序在内部注册，因此可能不需要将其添加到拨号计划中，但您应该确保在 `features.conf`\
  \ 中启用了它。您可以通过 `include => parkedcalls` 语句包含上下文。\n\n![image](img/00787.jpg)\n\n**Asterisk\
