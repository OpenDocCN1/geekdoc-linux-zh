  \n### B.10 Answer()\n\n接听响铃中的通道。\n\n> `Answer([delay])`\n\n指示 Asterisk 如果通道处于响铃状态时接听该通道。如果通道没有响铃，此应用程序将不起作用。\n\
  \n通常建议在调用其他应用程序之前接听通道，除非有特殊理由不这样做。大多数应用程序都要求在运行之前接听通道；如果不这样做，可能会出现意料之外的行为。\n\n可选的\
  \ `delay` 参数指定了 Asterisk 在接听通道之前应该等待的时间（以毫秒为单位）。\n\n成功后返回 0。\n\n> ![image](img/00397.jpg)\n\
