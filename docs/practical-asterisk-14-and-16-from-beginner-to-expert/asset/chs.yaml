  \ [,...]]*)`\n\n处理键值对列表，并返回一个根据其浮点值排序的逗号分隔的键列表。\n\n> ![image](img/01287.jpg)\n\n\
  **Asterisk 版本：**\n![image](img/01288.jpg)\n\n**Asterisk 1.4 中此函数的内部帮助：**\n> ![image](img/01289.jpg)\n\
  \n**Asterisk 1.2 到 1.4 的内部帮助差异：**\n无\n\n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n无\n\n###\
  \ C.51 STAT()\n\n`STAT(*flag, filename*)`\n\n返回关于文件的状态信息（对比 shell 命令 `test` 和 `stat`）。`filename`\
  \ 指向一个 inode，因此它可以是一个目录也可以是一个特定文件。`flag` 可以是以下值之一：\n\n- `d`: 测试 `filename` 是否为目录。\n\
  - `e`: 检查文件是否存在。\n- `f`: 测试 `filename` 是否为普通文件（区别于块文件、字符特殊文件、符号链接、命名管道或套接字等特殊文件）。\n\
  - `m`: 返回 `filename` 的模式（八进制）；即权限（例如 0754）。\n- `s`: 返回以字节为单位的文件大小。\n- `A`: 返回最后访问时间（UNIX\
  \ 时间）。\n- `C`: 返回 inode 更改时间（UNIX 时间）。\n- `M`: 返回最后修改时间（UNIX 时间）。\n\n> ![image](img/01290.jpg)\n\
  \n**Asterisk 版本：**\n![image](img/01291.jpg)\n\n**Asterisk 1.4 中此函数的内部帮助：**\n> ![image](img/01292.jpg)\n\
