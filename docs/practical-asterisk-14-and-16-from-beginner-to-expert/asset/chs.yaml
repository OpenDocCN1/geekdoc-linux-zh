  SGFsb8gV29ybGQ=\"})`\n\n**Asterisk 版本：**\n\n![image](img/01121.jpg)\n\n**Asterisk\
  \ 1.4 中此函数的内部帮助：**\n\n> ![image](img/01122.jpg)\n\n**Asterisk 1.2 到 1.4 的内部帮助差异：**\n\
  \n在 Asterisk 1.2 中不可用\n\n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n\n无\n\n### C.4 BASE64_ENCODE()\n\
