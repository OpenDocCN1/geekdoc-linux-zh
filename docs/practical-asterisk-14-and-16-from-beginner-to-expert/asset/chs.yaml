  你可以在 [www.w3.org/TR/synthesis](http://www.w3.org/TR/synthesis) 了解更多关于 SSML 标准的信息。\n\
  \n## 11. 数据库\n\n在拨号计划中使用变量的问题是，它们容易受到 Asterisk 崩溃或重启的影响。如果发生其中任何情况，变量都会被删除或重置为默认值。这种限制排除了某些实现。在呼叫转发或电话卡应用中，某些值（例如余额）需要以持久化的方式存储，以便重启后调用。Asterisk\
  \ 数据库（AstDB）正为此此目的。\n\n### 11.1 数据库\n\n需要数据库的应用程序经常询问 AstDB 的性能如何。在某种程度上，简单的答案是取决于你正在做什么。如果你正在处理少量数据（如在重拨或呼叫转发场景中），AstDB\
  \ 的表现非常出色，无需进一步寻找。如果你正在处理大型复杂数据集，你应该考虑外部 SQL 服务器是否更好。\n\n在绝大多数情况下，这种讨论纯属理论性。Asterisk\
  \ 数据库构建在 Berkeley DB (BDB) 之上，后者本身已经一个非常快的数据库引擎。在处理键值对时，BDB 是最快的数据库之一。因此，数据库选择的问题在数据库速度被证明是问题的根源，或者你想构建一个比简单键值数据库功能更大的系统时。\n\
  \n在默认安装中，Asterisk 包含一个基于 BDB 构建的数据库。BDB 是一个简单、高性能的嵌入式数据库库，带有 C、C++、Java、Perl、Python、Tcl\
  \ 等许多编程语言的应用程序接口（API）。它存储键值对，对记录中的存储方式没有限制。它不支持 SQL 或任何其他查询语言，仅允许进程内 API 调用访问。该数据库以键值对的形式存储信息，键被分组为族（family）。\n\
  \n> ### 警告\n> 直到 Asterisk 1.2 版本，以下应用程序用于数据库访问：\n>\n> > DBput(*family*/*key*=*value*)\n\
  >\n> 在数据库中保存值。\n>\n> > DBget(*var*=*family*/*key*)\n\n\n\n\n从数据库中检索值。如果找不到调用的键，Asterisk\
  \ 将跳转到当前扩展的优先级 `101`。\n\n从 Asterisk `1.4` 版本开始，这些命令不再被支持。因此，这里只提到了使用 `DB()` 函数的新方法，该方法在\
  \ `1.2` 中同样适用。\n\n可以使用 `DB()` 函数操作此数据库中的信息（参见 Appendix C，“拨计划函数.”）。\n\n### 11.1.1\
  \ 向数据库写入值\n\n`DB()` 函数可以在 `Set()` 应用内部调用。要给 `fruit` 组中的 `apple` 条目赋予值 `20`，扩展编写如下：\n\
  \n```\nexten => 1234,1,Set(DB(fruit/apple)=20)\n```\n\n### 11.1.2 从数据库读取值\n\n可以使用\
  \ `${DB(*family*/*key*)}` 的形式从数据库中调用值。要在控制台上打印 `fruit` 组中 `apple` 的内容，请使用以下命令：\n\
  \n![image](img/00178.jpg)\n\n**警告**\n\n在所有代码示例中，除非另有说明，所有内容都写在一行，没有换行。由于书籍空间有限，我们在书中对行进行了换行。\n\
  \n你可以使用 `Set()` 将此数据库字段的值存储在变量中：\n\n```\nexten => 1234,1,Set(applequantity=${DB(fruit/apple)})\n\
  ```\n\n### 11.1.3 从数据库中删除值\n\n`DBdel()` 和 `DBdeltree()` 应用用于删除数据库条目。\n\n#### 11.1.3.1\
  \ DBdel() 和 ${DB_DELETE()}\n\n在 Asterisk `1.2` 中，使用 `DBdel()` 删除单个条目。删除 `fruit`\
  \ 组中的键 `apple` 如下：\n\n```\nexten => 1234,1,DBdel(fruit/apple)\n```\n\n`DBdel()`\
  \ 在 Asterisk `1.4` 中已弃用；请使用 `DB_DELETE()` 函数。其调用方式如下：\n\n```\nexten => 1234,1,NoOp(${DB_DELETE(fruit/apple)})\n\
  ```\n\n参见 Appendix B，“拨计划应用,””以及 Appendix C，“拨计划函数.”）。\n\n#### 11.1.3.2 DBdeltree()\n\
  \n如果你需要删除整个键组，请使用 `DBdeltree()`。删除 `fruit` 组如下：\n\n```\nexten => 1234,1,DBdeltree(fruit)\n\
  ```\n\n参见 Appendix B。\n\n### 11.2 从命令行界面访问数据库\n\n系统管理员可以从 CLI 访问数据库。\n\n**提示**\n\
  \n如果你难以记住某个命令或精确语法，可以在 CLI 中通过 `help database` 获取帮助：\n\n![image](img/00179.jpg)\n\
  \n对于后续示例，请记住，如果你的组、键或值包含任何空格，则整个名称必须用双引号（“ ”）括起来；例如，`database put test entry \"\
  Hello world\"`。\n\n#### 11.2.1 向数据库写入值\n\n使用 `database put family key value` 向数据库写入值：\n\
  \n![image](img/00180.jpg)\n\n### 11.2.2 从数据库读取值\n\n使用 `database get family key`\
  \ 从数据库读取值：\n\n![image](img/00181.jpg)\n\n#### 11.2.3 从数据库中删除值\n\n`database del family\
  \ key` 和 `database deltree family` 都可以从数据库中删除值。\n\n#### 11.2.3.1 database del\n\n\
  要仅删除 `fruit` 组中的键 `apple`，请使用 `database del`：\n\n![image](img/00182.jpg)\n\n####\
  \ 11.2.3.2 database deltree\n\n你可以使用 `database deltree` 删除整个键组：\n\n![image](img/00183.jpg)\n\
  \n#### 11.2.4 显示数据库内容\n\n`database show`（两个命令）都可以显示内容：\n\n![image](img/00184.jpg)\n\
  \n### 11.3 从 Shell 访问数据库\n\n记住，如果你的组、键或值包含任何空格，则整个名称必须用双引号（“ ”）括起来；例如，`database\
  \ put test entry \"Hello world\"`。\n\n**重要**\n\n如果你的组、键或值包含任何空格，整个名称必须用双引号（“ ”）括起来；例如，`database\
  \ put test entry \"Hello world\"`。\n\nAstDB 默认存储在 `/var/lib/asterisk/astdb`。你可以通过以下命令复制它：\n\
  \n```\nasterisk -rx \"database show\"\n```\n\n### 11.4 数据库备份\n\n你可以在操作期间通过以下命令备份数据库：\n\
  \n```\nasterisk -rx \"database show\" > /tmp/backup\n```\n\n### 11.5 应用示例：转发\n\n\
  任何不在时希望通话转发到其手机的人都需要转发。这可以实现。在实践中，我们倾向于后者，因为这意味着即使断电，设置也不会丢失。\n\n#### 11.5.1 简单转发\n\
  \nWidgets, Inc. 的所有员工都可以到他们选择的任何号码。要启用此转发，拨打内部扩展 `44` 以及目标号码。要取消此转发，再次拨打 `44`（此时不需要目标号码）。你可以通过拨计划来实现：\n\
  \n```\nexten => 1234,1,Set(DB(fruit/apple)=20)\n```\n（注：原文此处使用了不同的示例，但结构遵循要求）。\n\
  \n#### 11.5.2 复杂转发\n\n在此示例中，Widgets, Inc. 的所有员工都应该能够激活通话转发。然而，还存在整个部门的全局转发，以便在员工不在时将通话转发到另一个部门。这种全局转发通过扩展\
  \ `55` 激活（跟随目标号码）。全局转发优先级必须高于个人转发。实现方法所示：\n\n![image](img/00187.jpg)\n\n### 11.6\
  \ 应用示例：电话卡\n\n根据 Widgets, Inc. 的政策，私人电话必须通过虚拟电话卡拨打。这些卡由管理员通过电话付费（拨打扩展 `88`，随后是三位用户扩展以及所需的金额，单位为分）。¹\n\
  \n[¹]: 为了使示例尽可能简单，我们没有考虑已有余额并增加金额的情况（换句话之，即执行加法操作）。我们也忽略了员工可能从别人的扩展拨打私人电话的现实情况。\n\
  \n此类通话每每次收取 1 分钱。要拨打私人电话，用户拨打 `99` 然后是被拨打的号码。当然，我们不希望在遇到忙音信号时从账户中扣除任何费用。用户也可以通过拨打\
  \ `98` 查询账户余额：\n\n![image](img/00188.jpg)\n\n![image](img/00189.jpg)\n\n## 12\\\
  . 队列\n\n\n\n\n\n呼叫队列允许在没有人员立即接听电话时，让呼叫者自动进入等待状态。（我们大多数人称之为为“在线等候”）。 许多客户非常讨厌队列。遗憾的是，现如今几乎没有哪个企业不使用它们；也许它们比另一种选择（即完全不接听电话）要好。无论你对它们有何看法，它们都是通信现实的一部分，因此我们在这里将描述\
  \ Asterisk 中队列的配置和操作。\n\nAsterisk 1.4 中使用 AEL（Asterisk 扩展语言）的队列设置示例描述在 `doc/queues-with-callback-members.txt`\
  \ 中。\n\n对于队列来说，四个文件至关重要：\n\n* `queues.conf`：定义队列。\n* `agents.conf`：定义代理（agents）；这些是接听电话的工作人员。\n\
  * `musiconhold.conf`：定义等待音乐。\n* `extensions.conf`：拨号计划。使用 `Queue()` 将通话导向队列，并使用\
  \ `AgentLogin()` 或 `AgentCallbackLogin()` 添加代理。\n\n常见的误解原因之一是将“队列成员（queue members）”与呼叫者混淆。队列成员始终且仅是代理或队列设备，绝不是呼叫者。\n\
  \n#### 提示\n为了简单起见，我们主要使用 *agents（代理）* 一术语。你将队列成员称为代理。对于来自呼叫中心业务的人来说，这有点困惑，因为队列成员也可以是普通的\
  \ SIP 扩展。\n\n你并不要求使用代理；相反，你可以简单地将特定的 SIP 设备分配给队列。例如，你通过向 `queues.conf` 写入 `member\
  \ => SIP/1001` 来实现；或者，你也可以在拨号计划中使用 `AddQueueMember()` 命令动态地分配接口。参见附录 B，“拨号计划应用（Dialplan\
  \ Applications）”。\n\n代理可能属于多个队列，我们希望我们的代理能够在任何工作站登录（也称为热桌面/热插办公）。\n\n你在 `agents.conf`\
  \ 文件中配置代理：\n\n![image](img/00190.jpg)\n\n配置好的代理被添加到 `queues.conf` 文件中的特定队列中：\n\n\
  ![image](img/00191.jpg)\n\n队列本身通过 `extensions.conf` 中的扩展行进行调用：\n\n![image](img/00192.jpg)\n\
  \n工作原理如下：代理通过拨打扩展号 25 登录，听悦快的音乐并等待呼叫者。拨向扩展号 20 的电话将进入队列，并按照先入先原则进行接听。代理听到一个音调，第一个呼叫者被连接。\n\
  \n### 12.1 用于测试等待音乐的扩展\n\n我们在 `extensions.conf` 中添加了以下扩展进行测试，以确保等待音乐按我们预期的方式运行：\n\
  \n![image](img/00193.jpg)\n\n### 12.2 musiconhold.conf\n\n让我们从简单的部分开始：设置等待音乐。\n\n\
  #### 确保你的等待音乐合法\n注意，你用于等待音乐的音乐可能需要支付许可费。如果你想确保自己是在合法地使用音乐，可以从你国家的表演者权利组织获得使用许可。\n\
  \n在美国，请联系以下机构：\n* 美国作曲家、作者和出版者 (ASCAP), [www.ascap.com](http://www.ascap.com)\n\
  * 广播音乐公司 (BMI), [www.bmi.com](http://www.bmi.com)\n* SESAC, [www.sesac.com](http://www.sesac.com)\n\
  \n在加拿大，请联系以下机构：\n* 加拿大作曲家、作者和音乐出版者协会 (SOCAN) [`www.socan.ca`](http://www.socan.ca)\n\
  \n在英国，请联系以下机构：\n* PRS for Music, [www.prsformusic.com](http://www.prsformusic.com)\n\
  \n在澳大利亚和新西兰，请联系以下机构：\n* 澳新表演权协会与澳新机械复制版权所有者协会, [www.apra-amcos.com.au/](http://www.apra-amcos.com.au/)\n\
  * 澳新表演权协会（新西兰），[www.apra.co.nz](http://www.apra.co.nz)\n\n通常情况下，在候区域和电话系统中使用音乐的许可费用相当合理，因此这个选项值得考虑。或者，你可以从各种互联网来源获取免版税的音乐。最后，你可以使用\
  \ Asterisk 提供的三条轨道。\n\n允许的配置设置说明在示例 `musiconhold.conf` 中。关于通过 `mpg123` 支持 MP3 音乐的更多信息可以在\
  \ `doc/README.mp3` (1.2) / `doc/mp3.txt` (1.4) 中找到。MP3 文件的最佳采样率为 8000Hz，单声道。\n\n\
  这里是最简单的配置，仅使用一个音乐类（`default`）：\n\n![image](img/00194.jpg)\n\n现在我们停止并启动 Asterisk，例如使用\
  \ `asterisk -rx \"restart now\"`，以激活新的扩展和音频流。（仅重载是不够的。）现在，如果你拨打扩展号 222（如上定义），你应该能听到等待音乐。\n\
  \n尽管如此，以下是一个更好的配置，我们为此在 `/var/lib/asterisk` 中了另一个音乐目录 `moh-native`：\n\n![image](img/00195.jpg)\n\
  \n为此，有必要将 MP3 文件转换为 Asterisk 兼容的格式。\n\n\n\n\n\n队列在 `queues.conf` 中定义和配置。正如你所熟悉的，该文件被分成了多个节（sections）。\n\
  \n在 `[general]` 下，我们始终设置 `persistentmembers=yes`，这样当 Asterisk 启动时，代理会被重新添加到它们各自的队列中。\n\
  \n每个队列都有自己的节。在我们的示例中，我们在单独的节 `[support]` 中配置了一个支持队列。我们可以使用以下参数：\n\n> • `musiconhold`\n\
  \n> 设置队列的音乐类型。我们选择了上述配置的 `default`：\n\n> `musiconhold=default`。\n\n> • `announce`\n\
  \n> 定义一个在接听电话之前播放给代理的音频文件。这样，工作在多个队列的代理就会知道入电电话来自哪个队列，并能够做出相应的接听。\n\n> ```\n>;announce=queue-support\n\
  > ```\n\n> 如果你使用此选项，请记住在 `sounds` 目录中放置相应的公告音频文件（例如，`queue-support.gsm`）。\n\n> •\
  \ `strategy`\n\n> 设置通话分配策略（即决定如何将入电电话分配给代理的方法）：\n\n> • `ringall`\n\n> 振叫所有代理，直到有人接听（默认值）。\n\
  \n> • `roundrobin`\n\n> 按照顺序振叫代理，直到有人接听。\n\n> • `leastrecent`\n\n> 振叫空闲时间最长的代理。\n\
  \n> • `fewestcalls`\n\n> 振叫在该队列中接听次数最少的代理。\n\n> • `random`\n\n> 随机振叫一个代理。\n\n> •\
  \ `rrmemory`\n\n> 带内存的轮询。从上一次通话后的下一个排在队列中的代理开始轮询。\n\n> ### 注意\n\n> 预计 Asterisk 1.6\
  \ 将废弃现有的 `roundrobin` 方法；`rrmemory` 将重命名为 `roundrobin`。\n\n> 在所有策略中，始终会优先考虑惩罚（penalty）较低的代理。\n\
  \n> `strategy=ringall`\n\n> 适当的设置取决于情况；`ringall` 可能让代理感到非常困扰，而如果代理未能接听，其他值可能会导致呼叫者面临更长的等待时间。\n\
  \n> • `servicelevel`\n\n> 设置服务水平阈值（即设置呼叫者的最大等待时间）。这对于统计分析非常有用（例如，提问“在 x 秒的服务水平阈值内接听了多少个电话？”）。\n\
  \n> `servicelevel=60`\n\n> • `context`\n\n> 如果设置，当呼叫者在队列中等待时按下单个数字，我们将其传递到该上下文（context）。该数字被视为一个分号，电话将从队列中取出并路由到该上下文中的分号。\n\
  \n> ![image](img/00198.jpg)\n\n> • `timeout`\n\n> 设置电话在被我们视为为无人接听之前允许振叫的最长时间。\n\n\
  > `timeout=15`\n\n> • `retry`\n\n> 设置在再次振叫所有代理之前的间隔时间（秒）。\n\n> `retry=5`\n\n> •\
  \ `weight`\n\n> 该队列与其他队列相比的重要性。如果一个代理是多个队列的成员，则优先连接来自高权重队列的电话。例如，你可能会给紧急队列更高的权重。\n\
  \n> `weight=0`\n\n> • `wrapuptime`\n\n> 代理完成通话后，系统将另一个通话交给该代理之前的时间间隔（默认值：`0`）。\n\
  \n> ![image](img/00199.jpg)\n\n> • `maxlen`\n\n> 允许在队列中等待的最大呼叫者数量（默认值：`0`，意味着无限）。\n\
  \n> `maxlen=0`\n\n> • `announce-frequency`\n\n> 设置呼叫者听到指示其在队列中位置或预计等待时间的公告频率（`0`\
  \ 完全关闭此功能）。\n\n> `announce-frequency=90`\n\n> • `announce-holdtime`\n\n> 设置在队列位置之后是否要公告预计的等待时间。可能的值有\
  \ `yes`、`no` 或 `once`。\n\n> `announce-holdtime=yes`\n\n> • `announce-round-seconds`\n\
  \n> 等待时间公告的舍入级别。如果为 `0`，则只宣布分钟不宣布秒；其他可能值为 `0`、`1`、`5`、`10`、`15`、`20` 和 `30`。旧版本接受其他值，可能会导致产生混乱的公告。参见\
  \ Bug 9514。\n\n> 例如，当设置为 `30` 时，2:34 的等待时间将被舍入为 2:30。\n\n> `announce-round-seconds=0`\n\
  \n> • `periodic-announce-frequency`\n\n> 设置周期性公告（`periodic-announce`）的间隔时间（秒）（例如，“感谢您的耐心；我们所有的代理目前都在其他呼叫者服务。请继续等待。”）。\n\
  \n> `periodic-announce-frequency=60`\n\n> • `monitor-format`\n\n> 设置后，录音（类似于 `Monitor()`\
  \ 应用程序）将开启并定义录音格式。（如果未定义，则录音关闭。）你可以指定 `gsm`、`wav`（注意：大文件！）或 `wav49`。\n\n> ![image](img/00198.jpg)\n\
  \n> 默认情况下，录音命名为 `${UNIQUEID}`。你可以通过在 `Queue()` 之前放置 `Set` 来更改。\n\n> • `monitor-join`\n\
  \n> 将 `-in` 和 `-out` 文件合并为一个 `FILENAME`。允许的值：`yes` 或 `no`。\n\n> `monitor-join=yes`\n\
  \n> • `joinempty`\n\n> 设置是否将呼叫者放入空队列。\n\n> `joinempty=no`\n\n> • `leavewhenempty`\n\
  \n> 设置当所有代理注销时是否从队列中移除呼叫者。允许的值与 `joinempty` 相同。离开队列后，将在拨号计划中的下一个优先级继续。\n\n> `leavewhenempty=strict`\n\
  \n> • `eventwhencalled`\n\n> 设置是否在接口中创建事件：`AgentCalled`、`AgentDump`、`AgentConnect`、`AgentComplete`。可能的值有\
  \ `yes` 和 `no`。\n\n> `eventwhencalled=yes`\n\n> • `eventmemberstatus`\n\n> 设置是否在接口中创建\
  \ `QueueMemberStatus` 事件。（谨慎使用这将产生大量事件。）可能的值有 `yes` 和 `no`。\n\n> `eventmemberstatus=no`\n\
  \n> • `reporthold`\n\n> 设置在接通电话之前是否向代理公告呼叫者的等待时间。有些人喜欢知道呼叫者等了多久，因为该呼叫者可能很愤怒。可能的值有\
  \ `yes` 和 `no`。\n\n> `reporthold=no`\n\n> • `memberdelay`\n\n> 设置呼叫者在连接到代理之前听到的沉默间隔（秒）。\n\
  \n> `memberdelay=1`\n\n> • `timeoutrestart`\n\n> 设置在收到 `BUSY` 或 `CONGESTION` 信号后重置代理的接听超时。这对于允许拒绝电话的代理可能很有用。\n\
  \n> `timeoutrestart=yes`\n\n> • `autopause`\n\n> 设置未接听电话的代理是否自动暂停。\n\n> `autopause=no`\n\
  \n> • `ringinuse`\n\n> 设置是否要振叫正在通话中的代理。到目前为止，唯一提供此类信息的通道驱动程序是 SIP。\n\n> `ringinuse=no`\n\
  \n> • `member`\n\n> 可以在 `queues.conf` 中静态地定义代理，如下所示：\n\n> `member => technology/resource[,penalty]`\n\
  \n> 使用 Zap 通道的示例如下：\n\n> `member => Zap/2`\n\n\n\n\n\n> 这可能会被多次使用。在使用 `joinempty`\
  \ 和 `leavewhenempty` 时应谨慎使用，因为这些队列成员始终被视为处于可用状态，即使电话无人接听。另一个缺点是代理（agent）将始终绑定到特定的工作站，无法在另一个工作站上登录。\n\
  \n> 在我们的示例中，我们倾向于使用动态代理并按照以下格式添加代理：\n\n> `member` => `Agent/agentID`\n\n> 对于两个代理\
  \ `1001` 和 `1002`，配置如下：\n\n> ![image](img/00201.jpg)\n\n> 这些代理仍然在 `agents.conf`\
  \ 中定义（见下文）。代理编号是一个可以任意选择的数字，用于唯一标识每个代理。该数字与代理最终使用的分号无关。\n\n### 12.3.1 公告声音文件\n\n\
  以下参数定义了哪些声音文件用于哪些公告类型。通常不需要更改此设置。例如，`queue-youarenext=sound_filename` 将“您现在是排队的第一个”消息的文件设置为\
  \ `sound_filename`。\n\n如果未提供这些参数，则应用默认值（如下所示）：\n\n> • `queue-youarenext=queue-youarenext`\n\
  > “您现在是排队的第一个。”\n\n> • `queue-thereare=queue-thereare`\n> “有...……”\n\n> • `queue-callswaiting=queue-callswaiting`\n\
  > “等待中的电话。”\n\n> • `queue-holdtime=queue-holdtime`\n> “当前预计候机时间为……”\n\n> • `queue-minutes=queue-minutes`\n\
  > “分钟。”\n\n> • `queue-seconds=queue-seconds`\n> “秒。”\n\n> • `queue-thankyou=queue-thankyou`\n\
  > “感谢您的耐心。”\n\n> • `queue-lessthan=queue-less-than`\n> “小于。”\n\n> • `queue-reporthold=queue-reporthold`\n\
  > “候机时间。”\n\n> • `periodic-announce=queue-periodic-announce`\n> “所有座席均忙，请等待下一个空闲。”\n\
  \n### 12.4 agents.conf\n\n代理（也称为队列成员）定义在 `agents.conf` 中；代理的额外配置也存放在此处。与其他配置文件一样，它也被分为多个分节。\n\
  \n我们在 `[general]` 节中设置了 `persistentagents=yes`，这样即使 Asterisk 重启，代理登录状态也会持续（这意味着它们存储在\
  \ Asterisk 数据库中）。\n\n我们在 `[agents]` 节中设置了额外参数，并在那里定义了代理。可用参数如下：\n\n> • `autologoff`\n\
  > 设置电话在代理自动注销之前可以响铃的最长时间。\n> 注意，如果 `autologoff` 间隔大于队列超时，代理将不会被注销！我们将其设置为 15 秒，因此将\
  \ `autologoff` 设置为 14。\n\n```\nautologoff=14\n```\n\n> • `ackcall`\n> 设置使用 `AgentCallbackLogin()`\
  \ 登录的代理是否必须按井号 (#) 来接听电话。请注意，之前的 Asterisk 版本中的语音提示没有指示代理必须按 #。可能的值有 `yes` 和 `no`。\n\
  \n```\nackcall=no\n```\n\n> • `endcall`\n> 设置代理是否可以通过按井号 (#) 结束通话。可能的值有 `yes` 和\
  \ `no`。\n\n```\nendcall=yes\n```\n\n> • `wrapuptime`\n> 设置（与 `queues.conf` 中的 `wrapuptime`\
  \ 相同；不清楚为什么它出现在两个文件中）等待时间，这次以毫秒为单位，在代理可以接收另一个电话之前。默认：`5000`。\n\n```\nwrapuptime=5000\
  \ ; 留出 5 秒清清嗓\n```\n\n> • `musiconhold`\n> 设置代理的候音音乐类。\n\n```\nmusiconhold=default\n\
  ```\n\n> • `updatecdr`\n> 向 CDR 中添加代理信息，以便我们能够看到是哪个代理接听了电话。可能的值有 `yes` 和 `no`。\n\
  \n```\nupdatecdr=yes\n```\n\n> • `recordagentcalls`\n> 记录代理通话。可能的值有 `yes` 和 `no`。默认：`no`。\n\
  \n```\nrecordagentcalls=no\n```\n\n> • `recordformat`\n> 通话录音的格式。可能的值有 `gsm`、`wav`（注意，文件巨大！）或\
  \ `wav49`。默认：`wav`。\n\n```\nrecordformat=gsm\n```\n\n> • `createlink`\n> 设置通话录音的文件名是否写入\
  \ CDR 的用户字段，以便稍后可以将录音与 CDR 匹配。可能的值有 `yes` 和 `no`。\n\n```\ncreatelink=yes\n```\n\n\
  > • `urlprefix`\n> 如果 `createlink=yes`，文件名可以带有一个 URL 前缀，该录音可以在 Web 服务器上可用。\n\n>\
  \ ![image](img/00202.jpg)\n\n> • `savecallsin`\n> 定义录音保存的路径。默认：`/var/spool/asterisk/monitor`\n\
  \n> ![image](img/00203.jpg)\n\n> • `agent`\n> 定义单个代理。可以出现多次。\n\n> ![image](img/00204.jpg)\n\
