  \n## F. 配置模板\n\n如 `sip.conf`、`iax.conf` 等配置文件可能包含数百条条目；此类文件难以维护。\n\n以典型的 `sip.conf`\
  \ 为例：\n\n> ![image](img/01641.jpg)\n\n还有另一种方法。Asterisk 提供了鲜为人知的模板支持！使用模板后，我们的 `sip.conf`\
  \ 看起来应该是这样的：\n\n> ![image](img/01642.jpg)\n\n当你有一组具有非常相似特征的站点或类时，这种方法特别有用；也就是说，在无法在\
  \ `[general]` 部分放置所有通用参数的情况下。即使在这个简单的小例子中，我们也成功节省了几行代码，并将对“类” `my-phones` 的更改集中管理。\n\
  \n### F.1 创建模板\n\n原则上讲，任何节都可以作为其他条目的模板；使用标记 `!` 告诉解析器该节仅作为模板使用。请注意，方括号或括号之间不允许有空格。模板也可以基于其他模板。\n\
  \n> ![image](img/01643.jpg)\n\n### F.2 使用模板\n\n原则上讲，任何节都可以作为其他条目的模板；使用标记 `!` 告诉解析器该节仅作为模板使用。请注意，方括号或括号之间不允许有空格。模板也可以基于其他模板。\n\
  \n> ![image](img/01644.jpg)\n\n#### F.2.1 示例\n\n> ![image](img/01645.jpg)\n\n###\
  \ G. 从 1.4 升级到 1.6\n\n### G.1 AEL\n\n> ![image](img/01646.jpg)\n\n### G.2 Core\n\
  \n> ![image](img/01647.jpg)\n\n\n\n\n\n- `logger.conf` 选项 `rotatetimestamp` 已弃用，取而代之的是\
  \ `rotatestrategy`。此新选项支持一种在文件轮方面更接近系统日志的旋转策略。\n- 各种 CLI 命令的简写版本现已弃用。我们建议使用管理接口\
  \ (AMI) 来实现应用程序与 Asterisk 的集成，而不是使用 `asterisk -rx \"command\"`。\n\n### G.3 语音箱 (Voicemail)\n\
  \n- 语音箱配置值 `maxmessage` 和 `minmessage` 已更改为 `maxsecs` 和 `minsecs`，以明确其用途，并将它们与设置文件夹大小的\
  \ `maxmsgs` 区分开。旧变量在当前版本中将继续有效，但会带有弃用警告。\n- 如果你使用内置拨号计划应用程序以外任何接口来修改语音箱，则必须在 `voicemail.conf`\
  \ 的 `general` 部分设置 `pollmailboxes` 选项，以便消息等待指示 (MWI) 正常工作；轮询频率通过 `pollfreq` 设置。这是因为语音箱通知现在是基于事件的而非基于轮询的。通道驱动程序不再负责不断手动检查信箱的变化，以便向用户发送\
  \ MWI 信息。需要此选项的场景示例：语音箱的 Web 接口，或者在 fact 互联网消息访问协议 (IMAP) 存储时的邮件客户端。\n\n### G.4\
  \ 拨号计划应用程序与函数\n\n- `ChanIsAvail()` 现在有一个 `t` 选项，允许在不咨询通道驱动程序的情况下查询指定设备的状态。这主要执行类似于\
  \ `ChanExists` 的功能。\n- `ChannelRedirect()` 不再像以前那样终止未能执行通道重定向的通道。相反，`CHANNELREDIRECT_STATUS`\
  \ 将反映尝试是否成功。\n- `SetCallerPres()` 已被拨号计划函数 `CALLERPRES()` 取代并已弃用。\n- `DISA()` 的第五个参数现在是一个选项参数。如果你之前在此参数中使用过\
  \ `NOANSWER`，则需要将其转换为新选项 `n`。\n- `Macro()` 现在已弃用。如果你需要子程序，应该使用 `Gosub()`/`Return()`\
  \ 应用程序。为了替换 `MacroExclusive()`，我们引入了拨号计划函数 `LOCK()`、`TRYLOCK()` 和 `UNLOCK()`。你可以在任何希望确保同一时间只有一个通道执行该路径的地方使用这些函数。出于性能考虑，`Macro()`\
  \ 应用程序已弃用。然而，由于 `Macro()` 存在已久且许多拨号计划严重依赖它，为了向后兼容，它不会被移除。此外，`Read()` 现在退出时会设置 `READSTATUS`\
  \ 变量。它不再在出错时自动返回 `-1`（并挂断）。如果你想在出错时挂断，需要在拨号计划中显式操作。\n- `Privacy()` 不再使用 `privacy.conf`，因此任何选项必须直接在应用程序参数中指定。\n\
  - `MusicOnHold()` 应用程序现在有了时长参数，允许以秒为单位指定超时。\n- `WaitMusicOnHold()` 应用程序现已弃用，取而代之的是扩展的\
  \ MusicOnHold。\n- `SetMusicOnHold()` 现在已用。你应该使用 `Set(CHANNEL (musicclass)=...)`。\n\
  - `ExecIf()` 中的参数发生了微变化，使其更像其他应用程序。旧语法为：\n  ```\n  ExecIf(expression,application,arguments)\n\
  \  ```\n  新语法为：\n  ```\n  ![image](img/01647.jpg)\n  ```\n- `Set()` 应用程序的行为现在取决于\
  \ `asterisk.conf` 中设置的兼容选项。要使用旧的 1.4 行为（允许 `Set()` 接受多个键对），请在 `asterisk.conf` 的\
  \ `[compat]` 中设置 `app_set=1.4`。要使用新行为（允许设置嵌入逗号的变量），请在 `asterisk.conf` 的 `[compat]`\
  \ 中设置 `app_set=1.6`。注意，你可以同时拥有这两种行为，如果你想使用旧行为，切换到使用 `MSet()`。\n- 函数 `QUEUE_MEMBER_COUNT()`\
  \ 已弃用，取而代之的是 `QUEUE_MEMBER()` 函数。欲了解信息，请在 CLI 中执行 `show function QUEUE_MEMBER`。\n\
  \n### G.5 CDR\n\n- `cdr_sqlite` 模块已被标记为弃用，取而代之的是 `cdr_sqlite3_custom`。它在 Asterisk\
  \ 1.6 发布后可能会从树中移除。\n- `cdr_odbc` 模块现在使用 `res_odbc` 来管理其连接。因此，`cdr_odbc.conf` 中的用户名和密码参数不再使用。`dsn`\
  \ 参数现在指向 `res_odbc.conf` 中的项。\n- Asterisk 核心结构中的 `uniqueid` 字段已从最大 31 字符改为 149 字符，以考虑到\
  \ `systemname` 前缀所有可能的取值。过去，如果 `systemname` 太长，`uniqueid` 将被截断。\n- `cdr_tds` 模块现在当目标表包含列时支持\
  \ `userfield`。\n\n### G.6 音频格式\n\n- `format_wav`：引入 `GAIN` 预处理器定义是为了响应用户对声音断续或大声峰值裁剪的投诉。要增加语音箱消息的量，请使用\
  \ `voicemail.conf` 中的 `volgain` 选项。\n- 此前，Asterisk 源码发行包含了来自 Global IP Solutions\
  \ (ips.com) 的 iLBC 编码/解码器源码。该代码未获得发行许可，因此已从 Asterisk 源码发行中移除。如果你想使用 `codec_ilbc`\
  \ 在 Asterisk 中支持 iBC 通道，可以运行 `contrib/scripts/get_ilbc_source.sh` 脚本下载源码并将其放在正确位置。完成后，你可以按照正常步骤构建\
  \ Asterisk。你需要运行 `menuselect`  Codec Translators 类别中启用 iBC 编码器，然后执行 `make` 和 `make\
  \ install`。\n\n### G.7 通道驱动程序\n\n- **SIP:** 小幅升级以支持 SNOM360 上的录制按钮，该按钮会发送带有 `Record:\
  \ on` 或 `Record: off` 头的 sip INFO 消息。如果 Asterisk 设置（通过 `features.conf` 中的 `automon`\
  \ 参数）接受一键监控请求（默认通过 **1*），则会生成用户配置的拨号序列，并通过此按钮启动和停止录制。文件名和格式均通过正常机制控制。如果用户没有配置 automon\
  \ 功能，将返回正常的 `415 Unsupported media type` 且不做任何操作。\n- `sip.conf` 中的 `call-limit`\
  \ 选项被标记为弃用。它在当前版本的 Asterisk 中仍然有效，但将在后续版本中移除。请在拨号计划中使用 `GROUP()`、`GROUP_COUNT()`\
  \ 和 `GROUP_MATCH_COUNT()` 函数来强制限制通话。`limitonpeer` 配置选项现在重命名为 `counteronpeer`。\n\
  - `username` 选项重命名为 `defaultuser` 以匹配 `defaultip`。这些仅用于在注册前通过 URI `sip:defaultuser@defaultip`\
  \ 调用配端。`username` 设置仍然有效，但已弃用，并在下一个 Asterisk 版本中不再工作。\n- **`chan_local.c`:** 通道名称内部的逗号分隔符已改为分号，以便本地通道驱动程序兼容应用程序逗号分隔符的变化。\n\
  \n\n\n\n\n- **H323**: `tos` 设置已更名为 `tos_audio`，`cos` 重命名为 `cos_audio`，以与 `sip.conf`\
  \ 中的设置兼容。`tos` 和 `cos` 配置已弃用，并在 Asterisk 的下一个发布版本中停止工作。\n- **Console**: Asterisk\
  \ 添加了一个新的控制通道驱动程序 `chan_console`。此新模块不能与 `chan_alsa` 或 `chan_oss` 同时加载。默认的 `modules.conf`\
  \ 仅加载其中之一（默认加载 `chan_oss`）。因此，除非你修改了 `modules.conf` 以不使用 `autoload` 选项，否则你可能需要修改\
  \ `modules.conf` 添加另一行 `noload` ，以确保这三个模块中仅加载一个。\n- **DAHDI**: 之前使用 Zaptel 支持公用电话网络\
  \ (PSTN) 接口的 `chan_zap` 模块已重命名为 `chan_dahdi`，且现在仅支持 DAHDI 电话驱动包的 PSTN 接口。关于此类迁移的更多信息，请参阅\
  \ `Zaptel-to-DAHDI.txt` 文件。\n- `msdstrip` 选项已弃用，因为它与在拨号计划中使用变量子字符串语法剥离数字的方法相比没有额外价值。\n\
  \n### G.8 配置\n- `dundi.conf`: `tos` 参数已更改为使用新值。旧值如 `lowdelay`、`lowcost` 和 `other`\
  \ 现在不再被接受。请查看 `doc/tex/qos.tex` 获取有关该参数的更多信息。\n- `queues.conf`: `queue-lessthan`\
  \ 音频文件选项不再可用，`queue-round-seconds` 选项不再接受 `1` 作为有效参数。\n\n### G.9 Asterisk 管理接口 (AMI)\n\
  - 管理器已升级到 1.1 版本，包含大量更改。查看 `doc/manager_1_1.txt` 获取相关信息。\n- `IAXpeers` 命令的输出已更改，使其更接近\
  \ `SIPpeers` 命令的输出。\n- `cdr_manager` 模块现在在 `cdr` 级别报告，而不是之前的 `call` 级别。如果 AMI 用户想要查看生成的\
  \ CDR 事件，你可能需要修改 `manager.conf` 为现有 AMI 用户添加级别。\n- `Originate` 命令现在需要 `write` 权限。对于带有\
  \ `Application` 参数的 `Originate`，如果你想执行任何调用子外壳的操作，则需要额外的 `system` 权限。\n\n## H. 从\
  \ Zaptel 到 DAHDI\nDigium 长期以来使用 Zaptel 作为其公用电话网络 (PSTN) 驱动程序的名称。2006 年，商标所有者通知 Digium\
  \ 该名称实际上已注册为商标。作为回应，Digium 自 2008 年起将驱动包重命名为 DAHDI。Digium 软件开发总监 Kevin Fleming 在\
  \ 2008 年 5 月发表的博客中解释了这一点。\n\n![image](img/01648.jpg)\n![image](img/01649.jpg)\n\n\
  ### H.1 DAHDI\n\n#### H.1.1 Dial()\n任何使用 DAHDI 的用户（无论是在 Asterisk 1.6 还是 Asterisk\
  \ 1.4.22 及以上版本中）都应该注意，拨号计划中任何对 `Dial(Zap/...)` 的引用都必须改为 `Dial(DAHDI/...)`。\n\n为了拨号计划的向后兼容性，可以配置此行为。要使用旧术语，请在\
  \ `/etc/asterisk/asterisk.conf` 的 `[options]` 部分设置以下内容：\n\n```\ndahdichanname =\
  \ no\n```\n\n#### H.1.2 内核模块 (.ko)\n所有之前的 Zaptel 内模块也获得了新名称，如表 H.1 所示。\n\n**表 H.1**\
  \ 内核模块重命名\n![image](img/01650.jpg)\n\n单个接口卡的内核模块名称没有更改。\n\n#### H.1.3 文件\n配置文件和目录已相应更改，如表\
  \ H.2 所示。\n\n**表 H.2** 配置文件重命名\n![image](img/01651.jpg)\n\n**警告**\n如前所述设置 `dahdichanname\
  \ = no` 将导致 Asterisk 从 `zapata.conf` 而不是 `chan_dahdi.conf` 读取配置。\n\n#### H.1.4 Shell\
  \ 程序\n新的 Shell 程序和脚本具有这些对应的名称，如表 H.3 所示。\n\n**表 H.3** Shell 程序\n![image](img/01652.jpg)\n\
  \n#### H.1.5 Asterisk 模块\n同样，提供 `Zap...()` 应用程序的对应 Asterisk 模块也有新名称，如表 H.4 所示。\n\
  \n**表 H.4** Asterisk 模块\n![image](img/01653.jpg)\n\n对于拨号计划的向后兼容性，`Zap...()` 和新的\
  \ `DAHDI...()` 是可以交换的。你可以在 Appendix B 中找到更多关于应用程序的信息。\n\n### H.2 与 Kevin Fleming\
  \ 的采访\n2009 年 1 月，Stefan Wintermeyer 采访了 Digium 软件开发总监 Kevin Fleming，讨论了从 Zaptel\
  \ 到 DAHDI 的迁移以及 Asterisk 中 ISDN 支持的演变：\n\n**Q**: DAHDI 还需要 mISDN 来支持 B410P 卡吗，还是说它现在自带\
  \ Euro-ISDN？\n\n**A**: 你混淆了两个不同的东西；DAHDI 与 Zaptel 一。`chan_dahdi` 是驱动程序（以前是 `zap`），它包含了模拟、PRI\
  \ 和 SS7（在 Asterisk 1.6 中）。\n\nZaptel 和 mISDN 毫无关系，DAHDI 和 mISDN 也是如此。Zaptel 中对 mISDN\
  \ 的唯一引用是一个 Makefile target `b410p`，它允许以自动方式下载、编译和安装 mISDN 和 mISuser 包，但这只是为了方便用户。现在涉及到通道驱动层时，情况变得复杂。Asterisk\
  \ 1.4 有连接 Zaptel 的 `chan_zap` 和连接 mISDN 的 `chan_misdn`。它们没有共同的硬件，因此对于 Asterisk 1.4\
  \ 用户，EuroISDN BRI 的支持由 `chan_misdn` 处理。即使在最近的 Asterisk 1.4 版本中，`chan_zap` 已重命名为\
  \ `chan_dahdi` 且现在连接到 DAHDI 而不是 Zaptel。尽管 DAHDI 现在包含了 Digium B410P BRI 卡的驱动，但 Asterisk\
  \ 1.4 的 `chan_dahdi` 通道驱动不支持 EuroISDN BRI。\n\n在 Asterisk 1.6 中情况有所不同：`chan_misdn`\
  \ 通道驱动仍然存在，偏好 mISDN 或只有 mISDN 支持的用户的用户仍然欢迎。Asterisk 1.6 的 `chan_dahdi` 通道驱动仅与 DAHDI\
  \ 工作，并且包含了对 EuroISDN BRI 的协议级支持。这意味着 Asterisk 1.6 用户可以通过任何带有 DAHDI 驱动的 BRI 卡使用 `chan_dahdi`\
  \ 进行他们的 EuroISDN BRI 连接（详情见下文）。\n\n**Q**: 你认为它是稳定的且可以投入生产的吗？\n\n**A**: 对于这个问题有两个答案：`chan_dahdi`\
  \ 中的 EuroISDN BRI 协议支持（实际上来自 `libpri`）是稳定且可以投入生产的。它已经通过了广泛的电信认证测试，并将像以前支持 PRI 互操作性一样支持\
  \ BRI 互操作性。\n\n\n\n\n\n用于 Digium B410P 的 DAHDI 驱动非常新，并且在大量用户中运行得良好。然而，目前有一些开放问题正在处理中（可以在我们在\
  \ [bugs.digium.com](http://bugs.digium.com) 上的开源问题跟踪器查看），主要与欧洲各电信运营商的 ISDN L1 层行为有关。它无疑是稳定的，并受到\
  \ Digium 开发团队的完全支持，但在这些问题解决之前，可能在某些环境中尚未准备好投入生产。\n\n**问：** Euro-ISDN BRI 支持是否也会出现在\
  \ 1.4 版本和 Zaptel 中，还是只出现在 1.6 和 DAHDI 中？\n\n**答：** B410P 驱动永远不会成为 Zaptel 的一部分（无论以后也不会有更多的\
  \ Zaptel 发布了），而且 `chan_dahdi` 中的 EuroISDN BRI 支持不会被添加到 Asterisk 1.4，因为我们不会向该发布分支添加新功能。然而，提供\
  \ EuroISDN BRI 支持所需的 `chan_dahdi` 更改相对较小，因此我预计一位或多位社区成员将发布“回传（backport）”补丁，以便用户可以在\
  \ Asterisk 1.4 中使用 DAHDI B410P 驱动和 `libpri` EuroISDN BRI 支持。\n\n**问：** DAHDI 和 Zaptel\
  \ 支持通用 Cologne HFC-S BRI 卡吗，还是仅针对 B410P？\n\n**答：** B410P 卡的 DAHDI 驱动是专门为该卡编写的，但由于该卡基于\
  \ HFC-4S，驱动程序可以修改以支持其他制造商的卡。如果社区成员愿意提供，我们乐意通过标准的补丁提交流程（在 [bugs.digium.com](http://bugs.digium.com)\
  \ 上）接受补丁，以增加对通用或特定厂商版本的 HFC-S 卡的支持。\n\n**问：** 为什么我的 BRI 卡需要 libpri PRI 栈（正如在 asterisk-users\
  \ 上宣布的那样）？\n\n**答：** 因为 ISDN PRI（包括 ANSI 和 Euro）与 EuroISDN BRI 几乎是相同的协议；本质上，`libpri`\
  \ 的名字起错了，应该被称为类似于 `libisdn` 的名称，表示它实际上是一个 ISDN 协议栈（包括 Q.921 和 Q.931 等），而不是特定于某种接口类型。\n\
  \n**问：** DAHDI 中的 BRI 支持是否包含 PtP（点对点)/PtmP（点对多点）以及 TE/NT 模式？如果限制不在 DAHDI 中，libpri\
  \ 是否支持所有这些模式？\n\n**答：** DAHDI 中的 B410P 驱动支持 HFC4-S 芯片上的 TE 和 NT 模式，但在该层级（硬件层）PtP\
  \ 和 PtMP 没有区别。`libpri` 目前支持在 PtP 或 PtMP 链路上作为 TE，或者在 PtP 链路上作为 NT。目前不支持在 PtMP 链路上作为\
  \ NT，但当然欢迎补丁。\n\n**问：** Asterisk 会继续支持 `chan_misdn` 吗？\n\n**答：** 是的，我们将继续支持它（现在帮助它的社区成员也是如此），但我们主要的\
  \ ISDN 相关开发工作将继续放在 `libpri`/`chan_dahdi` 上。\n\n## I. IAX 对比 SIP\n\n你需要回答的一个问题，特别是当涉及到通过中继（trunk）连接两个\
  \ Asterisk 服务器时，是使用 IAX 还是 SIP。对于哪种是更好的选择意见不一，但 IAX 的编写是为了克服 SIP 的某些局限性。为了方便起见，我们附上了\
  \ Mark Spencer 发给 Asterisk 用户列表的一封邮件，他在邮件中描述了 IAX 的优势：\n\n![image](img/01654.jpg)\n\
  \n![image](img/01655.jpg)\n\n为了为 SIP 护，Mark 随后写道：\n\n![image](img/01656.jpg)\n\n\
  ## J. GNU 自由文档许可证\n\n1.3 版本，2008 年 11 月 3 日\n\n版权所有 ©2000, 2001, 2002, 2007, 2008\
