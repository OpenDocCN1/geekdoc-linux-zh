  \ 的内部帮助差异：**\n![image](img/00791.jpg)\n\n**另请 `parkandannounce`, `parkedcall`。**\n\
  \n### B.112 ParkAndAnnounce()\n\n暂停当前通话并在指定的通道上宣布暂停位置。\n\n```\nParkAndAnnounce(*template*,*timeout*,*channel*[,*return*-*context*])\n\
  ```\n\n将当前通话暂停在候机池中，但在另一个指定的通道上宣布暂停位置。`template` 指定了要用冒号分隔的音频文件列表；下方示例中的 `PARKED`\
  \ 单词将被替换为分配给暂停通话的暂停号码。`timeout` 设置了通话在被放回 `return`-`context` 之前可以被暂停的最长时间。`channel`\
  \ 表示要进行公告的通道（在我们的示例中，Console/dsp 将公告打印到 Asterisk 控制台）。`return-context` 是一个 `GoTo()`\
  \ 格式的标签，如果用户在定义的 `timeout` 窗口内未从候机池中提取通话，则决定将通话返回到哪个上下文。默认返回优先级是 `return`-`context`\
  \ 中的 *n*+1。\n\n![image](img/00792.jpg)\n\n**Asterisk 版本：**\n![image](img/00793.jpg)\n\
  \n**Asterisk 1.4 中此应用的内部帮助：**\n![image](img/00794.jpg)\n\n**Asterisk 1.2 到 1.4 的内部帮助差异：**\n\
  ![image](img/00795.jpg)\n\n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n![image](img/00796.jpg)\n\
  \n**另请 `park`, `parkedcall`。**\n\n### B.113 ParkedCall()\n\n获取已暂停的通话。\n\n```\nParkedCall(*extension*)\n\
