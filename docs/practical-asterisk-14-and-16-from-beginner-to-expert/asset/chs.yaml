  \ `minivmnotify`, 以及在 附录 C 中参见 `minivmaccount`, `minivmcounter`。**\n\n### B.100\
  \ MixMonitor()\n\n记录当前通道上的音频，但在写入文件之前对其混合。\n\n> `MixMonitor(*fileprefix*,*format*[,options*[,*command]])`\n\
  \n开始记录当前通道的音频。它不是将每个方向分开记录，而是将音频流混合后写入指定的文件。\n\n选项：\n\n> • `a`\n> 将音频追加到现有文件。\n\n\
  > • `b`\n> 仅在通道桥接时保存音频到文件；即一旦对话真正开始，直到挂起为止。\n\n> • `v(x)`\n> 将听到的音量调整为 `x`。\n\n\
  > • `V(x)`\n> 将说话的音量调整为 `x`。\n\n> • `W(x)`\n> 将听的和说话的音量均调整为 `x`。\n\n如果提供了 `command`，则在记录完成后执行。`${MONITOR_FILENAME}`\
  \ 设置为所使用的的文件。\n\n另请参见 `Monitor()`。\n\n### Asterisk 版本：\n\n![image](img/00748.jpg)\n\
  \n### Asterisk 1.4 中此应用程序的内部帮助：\n\n> ![image](img/00749.jpg)\n\n### Asterisk 1.2\
  \ 到 1.4 内部帮助的差异：\n\n无\n\n### Asterisk 1.4 到 1.6 内部帮助的差异：\n\n> ![image](img/00750.jpg)\n\
  \n另请 `monitor`。\n\n### B.101 Monitor()\n\n在两个独立文件中记录当前通道。\n\n> `Monitor([*format*[,fileprefix*[,options*]])`\n\
  \n开始记录当前通道的音频，直到挂起或停止监控。`format` 参数设置文件格式。如果未指定，则使用 `wav`。\n\nfileprefix` 参数指定不带扩展的文件名。如果没有指定，文件名由通道名和数字组成，例如\
  \ `IAX2[foo]-3`。输入音频写入 `fileprefix-in.format`，输出音频写入 `fileprefix-out.format`，均位于\
  \ `/var/spool/monitor`。\n\n可以指定两个选项：\n\n> • `m`\n> 记录完成后，将音频文件合并为一个文件并删除原始文件。需要服务器上安装了\
  \ `sox` 包中的 `soxmix`。(10)\n\n如果定义了 `${MONITOR_EXEC}`，则执行该程序代替 `soxmix` 并删除输入输出音频文件。取决于\
  \ Asterisk 版本；旧版本不删除。最好进行适当测试。\n\n> `soxmix` (11)\n\n> ### \n\n> 注意 `soxmix` 根据文件扩展名判断文件类型。GSM\
  \ 和 WAV 等格式通常没有问题，但对于 a-law 和 u-law 等格式，它分别期望 .al 和 .ul 扩展名。解决这个问题，请阅读 `sox` (`soxmix`)\
  \ 手页并使用 `${MONITOR_EXEC_ARGS}` 或编写一个读取格式参数的小脚本并在调用。\n\n> ### 注意\n\n> 如果你需要单一混合音频文件，`Monitor()`\
  \ 通常是更好的选择，因为它是实时混合的，从而避免了记录结束时 CPU 负载激增。\n\n> • `b`\n> 仅在通道桥接时保存音频到文件；即一旦对话真正开始，直到挂起为止。\n\
  \n成功返回 0，失败则返回 -1（例如无法打开音频文件进行写入，或者通道已在监控中）。\n\n> ![image](img/00751.jpg)\n\n> ###\
  \ 警告\n\n> 在录制对话之前，请确保符合你司法管辖的相关法律。在大多数情况下，双方都必须知晓自己正在被录制。(12)\n\n\n\n\n\n> 12. 另阅\
  \ [www.voip-info.org/wiki/view/Monitor+Recording+Legal+Issues](http://www.voip-info.org/wiki/view/Monitor+Recording+Legal+Issues)。\n\
  \n> ### 注意\n\n> 经常需要记录大量通话（50 到 500 个）的 Asterisk 用户报告说，如果在通话结束后将通话录音写入 RAM 磁盘（更少且更短的寻道操作），然后再复制到硬盘，性能会好得多。\n\
