  \ `minivmrecord`, 以及在 附录 C 中参见 `minivmaccount`, `minivmcounter`。**\n\n### B.99 MinivmRecord()\n\
  \n在 Mini-VoiceMail 中记录语音留言。\n\n> `MinivmRecord(*user@domain*,*option*)`\n\n在 Mini-VoiceMail\
  \ (`minivm`) 系统中记录呼叫者的语音留言。这在某种程度上等同于 `VoiceMail()`。\n\n### Asterisk 版本：\n\n![image](img/00746.jpg)\n\
