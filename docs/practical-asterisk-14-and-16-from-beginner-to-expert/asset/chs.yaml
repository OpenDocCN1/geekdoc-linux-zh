  \n### 1 适用范围与定义\n\n本许可证适用于任何媒介的任何手册或其他作品，只要该作品包含由版权所有者放置的通知，声明可以根据本许可证分发。此类通知授予了全球范围内的、免费的、无期的许可，按本文规定的使用该作品。下文“文档”是指任何此类手册或作品。公众任何成员都是被许可者，被称为“你”。如果你以版权法要求的方式复制、修改或分发作品，即接受该许可。\n\
  \n文档的“修改版本”是指包含文档或其部分的作品，无论是逐字复制还是经过修改和/或翻译成另一种语言。\n\n“要章节”是文档的命名附录或前言，专门讨论者或作者与文档主题（或相关事项）的关系，且不包含任何直接属于该主题的内容。（因此，如果文档部分是数学教科书，则要章节不能解释任何数学。）这种关系可以是与主题或相关事项的历史联系，或者是关于它们的法律、商业、哲学、伦理或政治立场。\n\
  \n“不变章节”是指某些要章节，其标题在声明可以根据本许可证分发的通知中被指定。如果某个章节不符合上述要章节定义，则不允许被指定不变。文档可以包含零不变章节。如果文档未标识任何不变章节，则没有。\n\
  \n“封面文本”是指某些短句，在声明可以根据本许可证分发的通知中被列为封面文本或封底文本。封面文本最多 5 个单词，封底文本最多 25 个单词。\n\n文档的“透明性”副本是指机器可读的副本，以公开可用的格式表示，该格式适用于使用通用文本编辑器直接修订文档（或对于像素图像使用通用绘图程序，或对于绘图使用某些广泛使用的绘图编辑器），并适用于输入文本格式化器或自动转换为多种适用于输入文本格式化器的格式。在原本透明的文件格式中制作副本，如果其标记或缺失标记的目的是阻碍或阻止读者的后续修改，则不是透明的。如果图像格式用于大量文本，则不是透明的。不“透明”的副本被称为“不透明”。\n\
  \n\n\n\n透明副本（Transparent copies）的适用格式示例包括不带标记的纯 ASCII、Texinfo 输入格式、LaTeX 输入格式、使用公开\
  \ DTD 的 SGML 或 XML，以及旨在人类修改的符合标准的简单 HTML、PostScript 或 PDF。透明图像格式示例包括 `PNG`、`XCF`\
  \ 和 `JPG`。不透明格式（Opaque formats）包括只能由专用文字处理器读取和编辑的专有格式、DTD 和/或处理工具通常不可用的 SGML 或 XML，以及某些文字处理器仅为了输出目的而生成的\
  \ HTML、PostScript 或 PDF。\n\n“标题页”（Title Page）对于印刷书籍而言，是指标题页本身，加上为了清晰可读地承载本许可证要求在标题页上显示的材料而所需的后续页面。对于没有此类标题页的格式的作品，“标题页”是指作品标题最显眼出现处的文本，位于正文开始之前的文本。\n\
  \n“出版者”（publisher）是指任何向公众分发文档副本的个人或实体。\n\n“名为 XYZ 的章节”（section Entitled XYZ）是指文档中一个命名的子单元，其标题要么精确为\
  \ `XYZ`，要么包含对另一种语言翻译 `XYZ` 的文本后的括号中的 `XYZ`。（此处 `XYZ` 代表下方提到的特定章节名称，例如“致谢”、“献词”、“认可”或“历史”。）在修改文档时“保留该章节的标题”，是指其仍然是根据此定义的“名为\
  \ XYZ 的章节”。\n\n文档可能在说明本许可证适用于该文档的通知旁边包含保证免责声明（Warranty Disclaimers）。这些保证免责声明被认为通过引用包含在本许可证中，但仅涉及免除保证：这些保证免责声明可能具有任何其他暗示均无效，且对本许可证的含义没有影响。\n\
  \n## 2 逐字复制\n\n您可以在任何介质上以商业或非商业方式复制并分发文档，前提是所有副本中都重制了本许可证、版权声明以及说明本许可证适用于该文档的许可通知，并且您没有对本许可证的条件添加任何其他条件。您不得使用技术措施阻碍或控制您所制作或分发的副本的阅读或进一步复制。然而，您可以接受补偿以交换副本。如果您分发了足够数量的副本，还必须遵循第\
  \ 3 部分 中的条件。\n\n您还可以在上述相同条件下租借副本，并可以公开展示副本。\n\n## 3 大批量复制\n\n如果您出版了文档的印刷副本（或通常有印刷封面的介质副本）且数量超过\
  \ 100 份，且文档的许可通知需要封面文本（Cover Texts），您必须将副本封装在封内，并清晰可读地印载所有这些封面文本：正封面上的封面文本和封底上的封面文本。两个封面都必须清晰可读地识别您为这些副本的出版者。正封面必须展示完整标题，标题中的所有文字同样显著且可见。您还可以在封面上添加其他材料。更改仅限于封面的复制，只要它们保留了文档标题并满足这些条件，在其他方面可以被逐字复制。\n\
  \n如果两个封面所需的文本过多而无法清晰容纳，您应该将列出的前面的文本（在合理范围内的尽可能）放在实际封面上，并将其余内容到相邻页。\n\n如果您出版或分发数量超过\
  \ 100 份文档的不透明副本，您必须在每个不透明副本中包含一份机器可读的透明副本，或者在每个不透明副本内部或附带一个计算机网络位置，普通网络用户可以使用公共标准网络协议从该位置下载不含添加材料的文档完整透明副本。如果您使用后一种方案，您在开始大量分发不透明副本时，必须采取合理的审慎步骤，以确保该透明副本在指定位置保持可访问状态，直到您最后一次向公众分发（直接或通过您的代理人或零售商）该版本的不透明副本后至少一年。\n\
  \n建议（但不是要求）您在重新分发任何大量副本之前尽早联系文档作者，以便他们有机会向您提供文档的更新版本。\n\n## 4 修改\n\n您可以在上述第 2 部分\
  \ 和第 3 部分 的条件下，复制并分发文档的修改版本（Modified Version），前提是您完全按照此许可证发布修改版本，并由修改版本承担文档的角色，从而许可任何拥有该版本副本的人分发和修改该版本。此外，您必须在修改版本中完成以下事项：\n\
  \n> A. 在标题页（以及封面，如有）上使用与文档不同、且与先一版本不同的标题（如果有之前的版本，则应列在文档的“历史”章节中）。如果该版本的原始出版者给予许可，您可以使用与先一版本相同的标题。\n\
  \n> B. 在标题页上列出负责修改版本中修改内容的一个或多个个人或实体作为作者，以及文档的至少五位主要作者（除非他们免除了您的此项要求）。\n\n> C. 在标题页上注明修改版本的名称，作为出版者。\n\
  \n> D. 保留文档的所有版权声明。\n\n> E. 在其他版权声明旁边添加适用于您修改内容的适当版权声明。\n\n> F. 在版权声明之后立即包含许可通知，允许公众根据本许可证的条款使用修改版本，格式如下附录所示。\n\
  \n> G. 在该许可通知中保留文档许可通知给出的完整部分列表和要求的封面文本。\n\n> H. 包含一份未修改的本许可证。\n\n> I. 保留名为“历史”的章节，保留其标题，并添加一项说明标题页上提供的修改版本的标题、年份、新作者和出版者。如果文档中没有名为“历史”的章节，则创建一个说明标题页上提供的文档标题、年份、作者和出版者的章节，然后添加如上句所述描述修改版本的项目。\n\
  \n> J. 保留文档给出的访问透明副本的网络位置（如有），以及文档所基于的先前版本给出的网络位置。这些可以放在“历史”章节中。如果某个作品在文档发布前至少四年发布，或者其引用的版本的原始出版者给予许可，您可以省略网络位置。\n\
  \n> K. 对于任何名为“致谢”或“献词”的章节，保留该章节的标题，并在章节内保留所有贡献者致谢和/或献词的实质和语气。\n\n> L. 保留文档的所有不变部分，其文本和标题均保持不变。章节编号或等效形式不视为章节标题的一部分。\n\
  \n\n\n\n\n> M. 删除任何标题为“认可”（Endorsements）的章节。修改版本中不得包含此类章节。\n\n> N. 不要将任何现有章节重命名为“认可”（Endorsements），或使其与任何“不变章节”（Invariant\
  \ Section）的标题冲突。\n\n> O. 保留任何免责声明（Warranty Disclaimers）。\n\n如果修改版本包含了符合“次要章节”（Secondary\
  \ Sections）的新前言或附录，且不包含复制自文档的实质内容，您可以根据选择将这些章节的部分或全部指定为不变章节。要做到这一点，请将它们的标题添加到修改版本许可声明中的“不变章节”列表中。这些标题必须与其他任何章节标题有所区分。\n\
  \n您可以添加一个标题为“认可”（Endorsements）的章节，前提是其内容仅包含各方对您修改版本的认可——例如，同行评审的声明，或者该文本已被某机构批准为该标准的权威定义。\n\
  \n您可以在修改版本`封面文本`（Cover Texts）列表的末尾添加最多五个字的`前封面文本`（Front-Cover Text）和最多 25 个字的`封封面文本`（Back-Cover\
  \ Text）。任何实体（或通过该实体的安排）只能添加一段`前封面文本`和一段`封封面文本`。如果文档已经包含了相同封面的封面文本，且该文本是由您或由您所代表的同一实体此前添加的，则您不能再次添加；但在获得添加旧内容的先前出版者明确许可的情况下，您可以替换旧内容。\n\
  \n文档的作者和出版者并不通过本许可允许将其名称用于宣传，或允许对任何修改版本表示背书或暗示认可。\n\n### 5 合并文档\n\n您可以根据上述针对修改版本在第\
  \ 4 节中定义的条款，将文档与其他根据本许可发布的文档合并，前提是您必须在合并中包含所有原始文档的所有`不变章节`且保持未经修改，并在您的合并作品的许可声明中将它们全部列为合并作品的`不变章节`，并且保留它们所有的`免责声明`。\n\
  \n合并作品仅需包含一份本许可副本，多个相同的`不变章节`可以替换为一份。如果存在多个同名但内容不同的`不变章节`，请通过在每个此类章节的末尾括号内添加该章节原始作者或出版者的名称（如果已知）或唯一的数字，来使每个章节的标题唯一。对合并作品许可声明中`不变章节`列表中的章节标题进行同样的调整。\n\
  \n在合并时，您必须将各种原始文档中任何标题为“历史”（History）的章节合并为一个标题为“历史”的章节；同样，合并任何标题为“致谢”（Acknowledgements）的章节以及任何标题为“献辞”（Dedications）的章节。您必须删除所有标题为“认可”（Endorsements）的章节。\n\
  \n### 6 文档集\n\n您可以创建一个由该文档和其他根据本许可发布的文档组成的集合，并将各种文档中的本许可副本替换为包含在集合中的单一副本，前提是您在其他所有方面遵循本许可关于每份文档的逐字复制的规则。\n\
  \n您可以从此类集合中提取单个文档，并根据本许可将其单独分发，前提是您在提取的文档中插入一份本许可副本，并在关于该文档逐字复制的所有其他方面遵循本许可。\n\n\
  ### 7 与独立作品的汇编\n\n将文档或其衍生品与其他独立的文档或作品汇编在存储或分发介质的卷中，如果由于汇编而产生的版权未被用于超出单个作品所允许的范围来限制汇编用户的法律权利，则被称为“汇编体”（aggregate）。当文档被包含在汇编中时，本许可不适用于汇编中本身不是该文档衍生品的其他作品。\n\
  \n如果第 3 节的`封面文本`要求适用于这些文档副本，那么如果文档少于整个汇编的一半，则文档的`封面文本`可以放置在汇编中环绕该文档的封面上，或者如果文档是电子格式的，则放置在等等同的电子封面上。否则，它们必须出现在包含整个汇编的打印封面上。\n\
  \n### 8 翻译\n\n翻译被视为一种修改，因此您可以根据第 4 节的条款分发文档的翻译版本。将`不变章节`替换为翻译需要获得版权持有者的特殊许可，但您可以在包含这些`不变章节`原始版本的同时，包含部分或全部`不变章节`的翻译。您可以包含本许可、文档中所有许可声明以及任何`免责声明`的翻译，前提是您还包含本许可的原始英文版本以及那些声明和免责声明的原始版本。如果翻译与本许可或声明或免责声明的原始版本冲突，则以原始版本为准。\n\
