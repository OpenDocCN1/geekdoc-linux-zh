  \n> ![image](img/00843.jpg)\n\n**另请阅 `queue`, 第 12 章。**\n\n### B.125 RaiseException()\n\
  \n抛出一个异常。\n\n> `RaiseException(reason)`\n\n`RaiseException()` 抛出一个异常；这会导致执行跳转到当前上下文中的扩展\
  \ `e`，在对应处可以使用 `EXCEPTION()` 函数来处理该异常。如果没有定义 `e` 扩展，则通道将被挂断。\n\n> ![image](img/00844.jpg)\n\
  \n**Asterisk 版本：**\n\n![image](img/00845.jpg)\n\n**Asterisk 1.6 中此应用程序的内部帮助：**\n\
  \n> ![image](img/00846.jpg)\n\n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n\nAsterisk 1.4 中不可用\n\
  \n**另请阅 附录 C。**\n\n### B.126 Random()\n\n随机跳转到优先级。\n\n> `Random([probability]:[[context,]*extension,]*priority*)`\n\
  \n根据提供的 `probability` 到到指定的优先级、扩展和上下文。`probability` 必须是 1 到 100 之间的整数；在 `probability`\
  \ 百比率的情况下，调用将跳转到指定的优先级。\n\n> ![image](img/00847.jpg)\n\n> ### 警告\n\n> 该应用程序自 1.4\
  \ 版本起已弃用；请使用 Asterisk 函数 `RAND()`。\n\n**Asterisk 版本：**\n\n![image](img/00848.jpg)\n\
  \n**Asterisk 1.4 中此应用程序的内部帮助：**\n\n> ![image](img/00849.jpg)\n\n**Asterisk 1.2 到\
  \ 1.4 的内部帮助差异：**\n\n> ![image](img/00850.jpg)\n\n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n\
  \nAsterisk 1.6 中不可用\n\n**另请阅 附录 C。**\n\n### B.127 Read()\n\n读取呼叫者的 DTMF 输入并将结果赋值给变量。\n\
  \n> `Read(variable[,filename[,maxDigits[,option[,attempts[,timeout]]]]]])])`\n\n\
  从呼叫者读取以 # 结尾的 DTMF 序列并将其放入指定的 `variable` 中。\n\n如果指定了 `filename`（不带文件后缀！），在读取输入之前向呼叫者播放此音频文件。\n\
  \n参数 `maxDigits` 定义了允许的最大数字数。如果提供，应用程序在输入这些数字后停止读取，无需呼叫者输入 # 来结束通话。默认设置为 0，意味着没有预设限制并等待\
  \ #；允许的绝对最大数字数为 255。\n\n选项 `skip`导致应用程序在通道非活动状态时立即结束。选项 `noanswer` 允许在通道非活动时也启用读取。\n\
  \n呼叫者在 `timeout` 秒内有最多 `attempts` 次机会输入序列。`timeout` 为零表示没有时间限制。\n\n如果通道被挂断，则返回 -1，否则返回\
  \ 0。\n\n> ![image](img/00851.jpg)\n\n**Asterisk 版本：**\n\n![image](img/00852.jpg)\n\
  \n**Asterisk 1.4 中此应用程序的内部帮助：**\n\n> ![image](img/00853.jpg)\n\n**Asterisk 1.2 到\
  \ 1.4 的内部帮助差异：**\n\n> ![image](img/00854.jpg)\n\n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n\
  \n> ![image](img/00855.jpg)\n\n**另请阅 `senddtmf`。**\n\n### B.128 ReadExten()\n\n\
  读取 DTMF 扩展。\n\n> `ReadExten(variable[,prompt_filename[,context[,option[,timeout]]]])`\n\
  \n提示呼叫者输入扩展，监听 DTMF 并输入的数字存储在指定的 `variable` 中。\n\n**Asterisk 版本：**\n\n![image](img/00856.jpg)\n\
  \n**Asterisk 1.6 中此应用程序的内部帮助：**\n\n> ![image](img/00857.jpg)\n\n**Asterisk 1.4 到\
  \ 1.6 的内部帮助差异：**\n\nAsterisk 1.4 中不可用\n\n**另请阅 `read`。**\n\n### B.129 ReadFile()\n\
  \n读取文件。\n\n> `ReadFile(variable=filename,length)`\n\n将 `filename` 的前 `length` 个字符读取到\
  \ `variable`。\n\n**Asterisk 版本：**\n\n![image](img/00858.jpg)\n\n**Asterisk 1.4 中此应用程序的内部帮助：**\n\
  \n> ![image](img/00859.jpg)\n\n**Asterisk 1.2 到 1.4 的内部帮助差异：**\n\n无\n\n**Asterisk\
  \ 1.4 到 1.6 的内部帮助差异：**\n\n> ![image](img/00860.jpg)\n\n### B.130 RealTime()\n\n\
  从实时数据库获取配置信息。\n\n> `RealTime(family,column,value[,prefix])`\n\n从实时数据库检索设置到通道变量。所有列名都被设置为变量。可选地，参数\
  \ `prefix` 加在列名前前面形成变量名。（在内部帮助示例中，`var_` 到 `test` 产生变量 `${var_test}`）。将通道变量 `REALTIMCOUNT`\
  \ 设置为读取的数量。\n\n在 `extconfig.conf` 中：\n\n> ![image](img/00861.jpg)\n\n在 `extensions.conf`\
  \ 中：\n\n> `exten => 123,1,RealTime(sipusers,ext,5678,var_)`\n\n这在 asterisk 数据库中执行以下\
  \ SQL 查询：\n\n```\nSELECT * FROM sip_users WHERE ext = 5678\n```\n\n假设表具有 `firstname`\
  \ 和 `lastname` 列，我们可以这种方式打印这些值：\n\n> ![image](img/00862.jpg)\n\n**Asterisk 版本：**\n\
  \n![image](img/00863.jpg)\n\n**Asterisk 1.4 中此应用程序的内部帮助：**\n\n> ![image](img/00864.jpg)\n\
  \n**Asterisk 1.2 到 1.4 的内部帮助差异：**\n\n> ![image](img/00865.jpg)\n\n**Asterisk 1.4\
  \ 到 1.6 的内部帮助差异：**\n\nAsterisk 1.6 中不可用\n\n**另请阅 `realtimeupdate`。**\n\n### B.131\
  \ RealTimeUpdate()\n\n更新实时数据库中的值。\n\n> `RealTimeUpdate(family,column,value,columnUpdate,valueUpdate)`\n\
  \n更新实时数据库中的值。使用匹配 `family`、`column` 和 `value` 的记录中的 `valueUpdate` 更新 `columnUpdate`\
  \ 字段。\n\n> ![image](img/00866.jpg)\n\n**Asterisk 版本：**\n\n![image](img/00867.jpg)\n\
  \n**Asterisk 1.4 中此应用程序的内部帮助：**\n\n> ![image](img/00868.jpg)\n\n**Asterisk 1.2 到\
  \ 1.4 的内部帮助差异：**\n\n> ![image](img/00869.jpg)\n\n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n\
  \nAsterisk 1.6 中不可用\n\n**另请阅 `realtime`。**\n\n### B.132 ReceiveFAX()\n\n接收传真。\n\n\
  > `ReceiveFAX(filename[,options])`\n\n`SendFax()` 和 `ReceiveFax()` 替换了著名的传真补丁命令\
  \ `TxFax()` 和 `RxFax()`，与它们一样使用了 SpanDSP 库。\n\n`ReceiveFax()` 接收传入的传真并将其存储为 TIFF\
  \ 文件。\n\n> ![image](img/00870.jpg)\n\n**Asterisk 版本：**\n\n![image](img/00871.jpg)\n\
  \n**Asterisk 1.6 中此应用程序的内部帮助：**\n\n> ![image](img/00872.jpg)\n\n**Asterisk 1.4 到\
  \ 1.6 的内部帮助差异：**\n\nAsterisk 1.4 中不可用\n\n**另请阅 `sendfax`。**\n\n### B.133 Record()\n\
  \n将音频从通道录到文件。\n\n自 Asterisk 1.2 起：\n\n> `Record(basename[.*format[,*maxSilence[,*maxDuration[,*options]]]]])`\n\
  \n从通道录音音频并保存到文件 `basename.format`。如果文件存在，则会被覆盖。\n\n允许的选项如下：\n\n> • `format`\n\n\n\
  \n\n\n> 指定录制的文件格式（`g723`, `g729`, `gsm`, `h263`, `ulaw`, `alaw`, `wav`, ...）。\n\n\
  - `maxSilence`: 定义录制结束前允许的最大静音时长。\n- `maxDuration`: 定义录制的最时长。如果未提供或为 0，则无限制。\n-\
  \ `options`: 可以设置以下一个或多个选项标志：\n    - `s`: 如果电话未接听，则不录制。\n    - `n`: 即使电话未接听也进行录制。\n\
  \    - `a`: 将录制追加到现有文件而不是覆盖它。\n    - `t`: 使用 DTMF 键结束通话，而不是默认的 `#` 键。\n    - `q`:\
  \ 录制前不播放提示音。\n    - `x`: 录制所有 DTMF 信号，包括 `#` 和 `*`。当达到 `maxDuration` 或拨号者挂断时通话结束。\n\
  \n如果 `basename` 包含 `%d`，将被替换为每次新录制递增 1 的数字。\n\n呼叫者可以通过按下 `#` 键结束录制；如果呼叫者在录制完成前挂断，录制将被丢弃。\n\
  \n挂机返回 `-1`，否则返回 `0`。\n\n> ![image](img/00873.jpg)\n\n注意 `Monitor()` 下关于隐私的警告。\n\
  \n**Asterisk 版本：**\n\n![image](img/00874.jpg)\n\n**Asterisk 1.4 中此应用程序的内部帮助：**\n\
  \n> ![image](img/00875.jpg)\n\n**Asterisk 1.2 到 1.4 的内部帮助差异：**\n\n> ![image](img/00876.jpg)\n\
  \n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n\n> ![image](img/00877.jpg)\n\n**另请 `dictate`,\
  \ `monitor`, `mixmonitor`。**\n\n### B.134 RemoveQueueMember()\n\n动态移除队列成员。\n\n```\n\
  RemoveQueueMember(*queue*[,*interface*[,*options*]])\n```\n\n动态从队列中移除一个成员。如果未提供\
  \ `interface`，应用程序将从指定的队列中移除当前接口（即在当前优先级中激活的接口）。\n\n如果接口不在指定的队列中且存在优先级 `n+101`，则应用程序将跳转到该优先级；否则返回错误。\n\
  \n发生错误时返回 `-1`，否则返回 `0`。\n\n> ![image](img/00878.jpg)\n\n**Asterisk 版本：**\n\n![image](img/00879.jpg)\n\
  \n**Asterisk 1.4 中此应用程序的内部帮助：**\n\n> ![image](img/00880.jpg)\n\n**Asterisk 1.2 到\
  \ 1.4 的内部帮助差异：**\n\n无\n\n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n\n> ![image](img/00881.jpg)\n\
  \n**另请 `addqueuemember`, `queue`, `queues.conf.`****\n\n### B.135 ResetCDR()\n\n\
  重置通话详细记录 (CDR)。\n\n```\nResetCDR([*options*])\n```\n\n重置活动通话的通话详细记录。如果给定了选项 `w`，则在重置之前会存储现有的\
  \ CDR。\n\n返回 `0`。\n\n> ![image](img/00882.jpg)\n\n**Asterisk 版本：**\n\n![image](img/00883.jpg)\n\
  \n**Asterisk 1.4 中此应用程序的内部帮助：**\n\n> ![image](img/00884.jpg)\n\n**Asterisk 1.2 到\
  \ 1.4 的内部帮助差异：**\n\n无\n\n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n\n> ![image](img/00885.jpg)\n\
  \n**另请 `forkcdr`, `nocdr`。**\n\n### B.136 ResponseTimeout()\n\n设置在通道上等待响应的最大时间。\n\
  \n```\nResponseTimeout(*seconds*)\n```\n\n#### 警告\n\n> `ResponseTimeout()` 从 Asterisk\
  \ 1.4 开始被移除，并由 `TIMEOUT()` 函数代替：\n> ```\nSet(TIMEOUT)=seconds\n```\n\n**Asterisk\
  \ 版本：**\n\n![image](img/00886.jpg)\n\n**Asterisk 1.2 中此应用程序的内部帮助：**\n\n> ![image](img/00887.jpg)\n\
  \n**Asterisk 1.2 到 1.4 的内部帮助差异：**\n\nAsterisk 1.4 中不可用\n\n**另请 `absolutimeout`,\
  \ `digittimeout`, 以及附录 C](#Practical_As-sk_1.4_and_1.6_split_033.html_filepos130429)，参见\
  \ `timeout`。**\n\n### B.137 RetryDial()\n\n失败后重拨。\n\n> ![image](img/00888.jpg)\n\
  \n像 `Dial()` 一样尝试连接设备。如果无法找到设备，则播放 `announcement` 文件（不带扩展名），然后等待 `sleep` 秒后再再次尝试。默认等待间隔为\
  \ 10 秒。在 `retries` 后，通话将交给拨号计划中的下一个优先级。如果 `retries` 设置为 0 或 -1，应用程序将无限重试。\n\n呼叫者在等待期间可能会拨打单数字扩展。如果该扩展存在于\
  \ `${CONTEXT}` 定义的上下文或当前上下文，则通话将交给该扩展。所有重试后的参数将直接传递给 `Dial()`。\n\n> ![image](img/00889.jpg)\n\
  \n**Asterisk 版本：**\n\n![image](img/00890.jpg)\n\n**Asterisk 1.4 中此应用程序的内部帮助：**\n\
