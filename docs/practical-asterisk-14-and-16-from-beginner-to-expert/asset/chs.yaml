  \n### B.178 Transfer()\n\n将呼叫转移到另一个分号。\n\n```\nTransfer(technology,destination,options)\n\
  ```\n\n请求将呼叫者转移到指定的分号或设备。如果指定了技术（例如 SIP、IAX2），则只有使用相同技术的通话会被转移。对于尚未接听的 SIP 通道，这通过向呼叫者发送\
  \ 302-REDIRECT 消息来实现；如果通话已接听，则通过 REFER 消息进行。目的地也可以是一个特定地址，例如 8885551212@sip.provider.tld。\n\
  \n如果设置了选项 `j`，当转移失败时跳转到优先级 n+101。\n\n将通道变量 `TRANSFERSTATUS` 设置为 `SUCCESS`、`FAILURE`\
  \ 或 `UNSUPPORTED`（意味着通道驱动不支持转移）。\n\n> ![image](img/01021.jpg)\n\n**Asterisk 版本：**\n\
