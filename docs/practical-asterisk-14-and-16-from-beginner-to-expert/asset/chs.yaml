  \ 的内部帮助差异：**\n在 Asterisk 1.4 中\n\n**另请参见 `md5`, 附录 C。**\n\n### B.90 `MeetMe()`\n\
  \n将调用者加入会议。\n\n> `MeetMe([conference][*options]])`\n\n将调用者加入会议。有效选项包括：\n\n- `a`:\
  \ 设置管理员模式。\n- `b`: 切换到菜单（用户或管理员）。\n- `c`: 通知会议人数。\n- `d`: 动态分配新会议。\n- `e`: 选择空会议。\n\
  - `E`: 选择空会议且不需要 PIN。\n- `i`: 宣布新参与者的加入和退出（\n- `I`: 宣布新参与者的加入和退出（不带评审）。\n- `m`:\
  \ 仅监听模式。\n- `M`: 音乐等待模式。\n- `o`: 设置说话者优化。\n- `p`: 参与者可以按 # 离开。\n- `P`: 即使提供了 PIN\
  \ 也请求 PIN。\n- `q`: 静音模式。\n- `r`: 录制会议。\n- `s`: 按下时切换到菜单。\n- `t`: 仅说话模式。\n- `T`:\
  \ 说话者检测。\n- `v`: 视频模式（尚未实现）。\n- `w`: 等待标记的成员加入会议。\n- `x`: 当最后一个标记的成员退出时结束会议。\n-\
  \ `X`: 参与者可以通过拨打单数字扩展退出会议。\n- `1`: 在第一个参与者进入时时不播放“你目前是会议中的唯一人员”消息。\n\n你可以使用 `e`\
  \ (或 `E`) 配合 `d` (或 `D`) 来动态打开一个新的会议。这意味着你需要找到一种向其他用户分发会议号码的方法，或者采用某些拨号逻辑来实现相同的目标。\n\
  \n> ### 注意\n\n\n\n\n\n> 参数 `d` 或 `D` *动态地*打开会议；会议在 `meetme.conf` 中*静态地*定义。\n\n>\
  \ ![image](img/00712.jpg)\n\n另请 `meetmeadmin`, `meetmecount`。\n\n## B.90.1 CLI 中的命令\n\
  \n以下命令用于从 CLI 管理会议。（`participant` 的值是参与者列表中显示的参与者人数）：\n\n> • `MeetMe`\n> 列出所有会议\n\
  \n> • `MeetMe list conference`\n> 列出指定会议中的参与者\n\n> • `MeetMe kick conference participant`\n\
  > 将某位参与者踢出会议\n\n> • `MeetMe kick conference`\n\n> 将所有参与者踢出会议\n\n> • `MeetMe lock\
  \ conference`\n> 锁定会议，不再允许新参与者加入\n\n> • `MeetMe unlock conference`\n> 解锁之前的锁定（见上文）\n\
  \n> • `MeetMe mute conference participant`\n> 静音某位会议参与者\n\n> • `MeetMe unmute conference\
  \ participant`\n> 取消某位会议参与者的静音（见上文）\n\n**Asterisk 版本：**\n\n![image](img/00713.jpg)\n\
  \n**Asterisk 1.4 中此应用的内部帮助：**\n\n> ![image](img/00714.jpg)\n\n> ![image](img/00715.jpg)\n\
  \n**从 Asterisk 1.2 到 1.4 的内部帮助差异：**\n\n> ![image](img/00716.jpg)\n\n> ![image](img/00717.jpg)\n\
  \n> ![image](img/00718.jpg)\n\n**从 Asterisk 1.4 到 1.6 的内部帮助差异：**\n\n> ![image](img/00719.jpg)\n\
  \n> ![image](img/00720.jpg)\n\n> ![image](img/00721.jpg)\n\n另请 `meetmecount`, `meetmeadmin`,\
  \ `meetmechanneladmin`，并参考 附录 C 中的 `meetme_info`。\n\n## B.91 MeetMeAdmin()\n\n管理\
  \ MeetMe 会议。\n\n> `MeetMeAdmin(*conference,command[,participant*])`\n\n在指定的会议中执行命令。该命令可以是以下之一（`participant`\
  \ 仅在 kick 命令 (`k`) 中需要需要）：\n\n> • `K`\n> 将所有参与者踢出会议\n\n> • `k`\n> 将 `participant`\
  \ 踢出会议\n\n> • `e`\n> 将最后一个加入的参与者踢出会议\n\n> • `L`\n> 锁定会议，不再允许新参与者加入\n\n> • `l`\n\
  > 解锁会议\n\n> • `M`\n> 静音某位会议参与者\n\n> • `m`\n> 取消被静音参与者的静音\n\n> • `N`\n> 对除会议管理员以外的所有进行静音\n\
  \n> • `n`\n> 取消由 `N` 静音的所有人的静音\n\n> ![image](img/00722.jpg)\n\n**Asterisk 版本：**\n\
  \n![image](img/00723.jpg)\n\n**Asterisk 1.4 中此应用的内部帮助：**\n\n> ![image](img/00724.jpg)\n\
  \n**从 Asterisk 1.2 到 1.4 的内部帮助差异：**\n\n> ![image](img/00725.jpg)\n\n**从 Asterisk\
  \ 1.4 到 1.6 的内部帮助差异：**\n\n无\n\n另请 `meetme`, `meetmecount`。\n\n## B.92 MeetMeChannelAdmin()\n\
  \n特定通道的 MeetMe 会议管理。\n\n> `MeetMeChannelAdmin(*channel,command*)`\n\n在指定的通道上执行提供的\
  \ MeetMe 命令。工作原理与 `MeetMeAdmin()` 类似，但针对的是特定通道而非会议。\n\n命令 `command` 可以是以下之一：\n\n\
  > • `k`\n> 将通道上的参与者踢出会议\n\n> • `M`\n> 静音通道上的参与者\n\n> • `m`\n> 取消通道上参与者的静音\n\n**Asterisk\
