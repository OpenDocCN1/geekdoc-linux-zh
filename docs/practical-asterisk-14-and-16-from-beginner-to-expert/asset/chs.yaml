  ### C.48 SIPPEER()\n\n`SIPPEER(*peername[,field]*)`\n\n返回关于 SIP 端点的信息。`field` 可能是以下值之一：\n\
  \n- `ip`: 端点的 IP 地址（默认）\n- `mailbox`: 配置的信箱\n- `context`: 配置的上下文\n- `expire`: 连接的过期时间（UNIX\
  \ 时间）\n- `dynamic`: 是否设置了 `dynamic` (`yes|no`)。\n- `callerid_name`: 配置的 CID 名称\n\
  - `callerid_num`: 配置的 CID 号\n- `codecs`: 可用的解码器\n- `status`: 状态（当设置了 `qualify=yes`\
  \ 时）\n- `regexten`: 注册扩展号\n- `limit`: 最大并发通话数\n- `curcalls`: 当前通话数（仅当设置了 limit 时）\n\
  - `language`: 该端点的默认语言\n- `useragent`: 端点的用户代理\n- `codec[x]`: 优选的解码器编号 `x`（从 0 开始）\n\
  - `accountcode`: 与此端点通话时 CDR 中的计费账户代码\n\n![image](img/01278.jpg)\n\n**Asterisk 版本：**\n\
  ![image](img/01279.jpg)\n\n**Asterisk 1.4 中此函数的内部帮助：**\n> ![image](img/01280.jpg)\n\
