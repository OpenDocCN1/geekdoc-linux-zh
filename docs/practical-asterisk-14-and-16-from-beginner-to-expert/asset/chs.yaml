  \n通过 [Queue() 应用程序](https://wiki.example.org/queue_application) 进入队列的代理和呼叫者，一个最小的扩展如下：\n\
  \n> ![image](img/00205.jpg)\n\n我们使用更完整的扩展：\n\n> ![image](img/00206.jpg)\n\n如果我们调用此扩展，会听到“无人接听”的消息，因为没有代理登录。\n\
  \n> ### 提示\n> 如果为了测试目的假装有代理，请在 `queues.conf` 中设置 `joinempty=yes` 和 `leaveempty=no`。\n\
  \n我们需要创建一个允许代理登录的扩展：\n\n> ![image](img/00207.jpg)\n\n### 12.5.2 AgentLogin() 和 AgentCallbackLogin()\n\
  \n`AgentLogin()` 建立一个活动通道，接入电话直接切换到此活动通道。如果代理挂断，她就会注销。`AgentCallbackLogin()` 的优势是让代理登录，然后系统从队列回拨。然而，该应用程序在版本\
  \ 1.4 中已弃用。尝试你所学的。编写一个拨计划首先将呼叫者带入 IVR 菜单；例如，“销售按 1，退货按 2。”然后根据呼叫者的输入将他们传递到两个不同的队列，每个部门一个。\n\
  \n### 12.6 日志文件\n\n队列中发生的事件除了常规录音外，还会以详细格式写入队列日志（通常为 `/var/log/asterisk/queue_log`）。事件将逐行记录在\
  \ `queue_log` 中，格式如下：\n\n> *timestamp*|*call_id*|*queue*|*channel*|*event*|*parameter1*[|*parameter2*[|*parameter3]]\n\
  \n> • `timestamp`\n> 事件的 UNIX 时间。\n\n> • `call_id`\n> 通话的唯一 ID（字母）。可以是 `NULL` 或\
  \ `NONE`（例如在 `QUEUESTART` 事件中）。\n\n> • `queue`\n> 队列名称（例如 `support`）。可以是 `NULL`\
  \ 或 `NONE`。\n\n> • `channel`\n> 桥接通道名称（例如 `Agent/1001`）。可以是 `NULL` 或 `NONE`。\n\n\
  > • `event`\n> 事件名称（类型）（见下一页）。后续参数取决于事件类型。\n\n可能的事件包括（参见 `doc/queuelog.txt`）：\n\n\
  > • ABANDON\n> 呼叫者通过挂断放弃了队列。参数：位置、进入位置、等待时间。\n\n> • AGENTDUMP\n\n\n\n\n\n> 坐席在听队列公告时挂断了呼叫者。\n\
  \n- • `AGENTLOGIN`\n  坐席已登录。参数：`channel`（例如：`SIP/127.0.0.1-0181ac00`）。\n- • `AGENTCALLBACKLOGIN`\n\
  \  回调坐席登录。参数：`login_extension[@context]`。\n- • `AGENTLOGOFF`\n  坐席已登出。参数：`channel`,\
  \ `login time`。\n- • `AGENTCALLBACKLOGOFF`\n  坐席已登出。参数：`login_extension[@context]`,\
  \ `login time`, `cause`（例如：自动登出）。\n- • `COMPLETEAGENT` 连续呼叫者与坐席之间的通话由坐席结束。参数：`wait\
  \ time`, `call time`, `queue entry position`。\n- • `COMPLETECALLER`\n  呼叫者与坐席之间的通话由呼叫者结束。参数：`wait\
  \ time`, `call time`, `queue entry position`。\n- • `CONFIGRELOAD`\n  配置已重载（例如通过\
  \ `asterisk -rx \"reload\"`）。\n- • `CONNECT`\n  呼叫者已连接到坐席。参数：`Wait time`。\n- • `ENTERQUEUE`\n\
  \  呼叫者已进入队列。参数：`URL`（如果可用），`caller ID`。\n- • `EXITEMPTY`\n  呼叫者因没有可用成员而离开队列。参数：`queue\
  \ position`, `entry position`, `wait time`。\n- • `EXITWITHKEY`\n  呼叫者通过按键离开了队列。参数：`key`,\
  \ `queue position`。\n- • `EXITWITHTIMEOUT`\n  呼叫者在队列中等待过长，导致超时。参数：`queue position`。\n\
  - • `QUEUESTART`\n  队列已启动。`call_id`, `queue` 和 `channel` 字段被设置为 `NULL`。\n- • `RINGNOANSWER`\n\
  \  呼叫了可用坐席，但在超时时间内未接听。参数：`ring time`（单位：毫秒）。\n- • `SYSCOMPAT`\n  坐席接了电话，但通道不兼容导致通话结束。\n\
  - • `TRANSFER`\n  呼叫者已被转移到另一个分号。参数：`extension`, `context`。\n\n一些商业队列日志分析工具包括 QueueMetrics\
  \ ([`queuemetrics.loway.it`](http://queuemetrics.loway.it)) 和 Easy PABX ([`www.easypabx.com`](http://www.easypabx.com))。另参阅\
  \ 附录 B。\n\n## 12.6.1 将队列日志导入 MySQL\n\n目前，Asterisk 直接将队列日志写入 SQL 数据库。遗憾的是，所有广泛使用的统计工具都假设并期望数据位于\
  \ SQL 数据库中。各种脚本试图解决这个问题（部分可以在 [www.voip-info.org/wiki/view/Asterisk+queue_log+on+MySQL](http://www.voip-info.org/wiki/view/Asterisk+queue_log+on+MySQL)\
  \ 找到），或者随分析工具一同提供。它们都遵循相同的原理：将 `queue_log` 替换为命名管道（FIFO）；一旦 Asterisk 尝试写入日志，日志条目就会转换并进入数据库。\n\
  \n> ### 警告\n> 该方法在 99% 的情况下有效。但仍然存在风险，即脚本在 Asterisk 启动之前未能启动，或者意外终止并停止从命名管道中读取，导致\
  \ Asterisk 在尝试写入日志时接收到 `SIGPIPE` 并崩溃！\n\n由于没有无需原生 Asterisk SQL 支持的替代方案，我们提供了一个 William\
  \ Lloyd 编写的 Perl 脚本，尽管存在相关风险：(3)\n\n3. wlloyd 位于 [slap.net](http://slap.net)，通过\
