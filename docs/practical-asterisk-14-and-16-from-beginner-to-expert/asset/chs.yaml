  \ 上下文。\n\n### 2.6 拨入和从公共交换网的通话\n\n在本节中，我们将微系统连接到公共电话交换网（PSTN）。\n\n#### 2.6.1 拨打\
  \ PSTN\n\n此时，我们已经有一个可以工作的系统，但还没有真正用处。为了实现这一点，我们需要一个服务商账户。首先，必须在 `sip.conf` 中定义账户：\n\
  \n> ![image](img/00024.jpg)\n\n你必须从 SIP 服务商获取用户名（示例为 `17941232`）和密码（示例为 `UHDJD`）；通常这可以通过服务商网站完成。\n\
  \n> ### 警告\n> 大多数 SIP 服务商按分钟收取费用，且许多需要预付。\n\n我们将为电话 `2000` 和 `2001` 配置 Asterisk。接下来我们需要一个拨号计划规则来允许出站：\n\
  \n> ![image](img/00025.jpg)\n\n输入这些条目后，保存文件并像以前一样启动 Asterisk，使用 `asterisk -vvvvvc`\
  \ 以进入控制台。等待几秒钟让 SIP 电话注册。现在拨打一个号码。\n\n> ### 提示\n> 通过大多数 VoIP 服务商拨号时，你需要拨打完整号码，包括拨号前缀（北美为\
  \ `1`）和区号，即使是本地通话也是如此。对于北美，这意味着先拨拨号前缀，然后是完整的十位数字。在我们的示例中，我们提供了一个开放拨号模式，将按拨号的内容进行传递。\n\
  \n如果一切正常，你将听到远程线路响铃，并在控制台中观察通话进度。现在解释其工作原理还为过早，你稍会读到更多内容。现在你只需要知道 `${EXTEN}` 始终包含呼叫者为特定实例拨打的号码（参见第\
  \ 5 章，“拨号计划编程](#Practical_As-sk_1.4_and_1.6_split_013.html_filepos239678)”）。\n\n\
  #### 2.6.2 从 PSTN 接入通话\n\n最后一步很小：我们希望能够通过我们的 SIP 服务商在分机 `2000` 上接来电。为此，我们需要在 `/etc/asterisk/extensions.conf`\
  \ 中添加另一个上下文：\n\n> ![image](img/00026.jpg)\n\n\n\n\n在我们的示例中，数字 `17984512232` 是你的\
  \ SIP 供应商提供给你账户的 PSTN 号（也称为 DID 或 DN；稍后会详细介绍）。DID 与用户名对应这纯属巧合，它们并非必须对应。\n\n当然，你可以为来自\
  \ PSTN 的入入电话配置语音信箱：\n\n> ![image](img/00027.jpg)\n\n如果你有此意，也可以直接保持现状并开始使用你的新 mini-PBX。但那样有什么趣呢？本章只是为了向你展示如何快速地构建一个可以运行的\
  \ Asterisk 系统。在接下来的章节中，我们将填补空白，并向你展示 Asterisk 真正能做很多。\n\n## 3. 拨号计划基础 (Dialplan\
  \ Fundamentals)\n\n拨号计划是 Asterisk 的核心，它的一切操作始于这里。\n\n在 Asterisk 1.4 中，`/etc/asterisk`\
  \ 中的两个重要文件构成了拨号计划。第一个是 `extensions.conf`，它使用了原始以及 Digium 推荐的优先级模型。第二个是 `extensions.ael`，它使用了较新的\
  \ Asterisk 扩展语言（Asterisk Extensions Language）；我们将在单独的章节中详细介绍。目前，我们将使用传统的优先级模型，因为即使在\
  \ 1.4 和 1.6 中，`extensions.ael` 在 Asterisk 启动时也会转换为优先级格式并添加到 `extensions.conf` 中。\n\
  \n`dialplan` 的准确定义在电话领域存在一定争议。在书中，我们按照 Asterisk 特有的含义使用这个词。\n\n> ### 注意\n> 应该使用\
  \ .conf 还是 .ael？Digium 说 “.conf 是默认的”。然而，对于某些应用程序，AEL 可以让拨号计划更具可读性和可维护性。\n\n###\
  \ 3.1 上上下文 (Contexts)\n\nAsterisk 拨号计划分为若干部分，每个部分称为一个上下文（context）。任何拨号计划必须以 `[general]`\
  \ 上下开始，其中存放着全局配置项，但后续上下文可以是任何名称。物理设备通过上下文绑定到拨号计划。这些设备通常是电话，但也可能是其他类型的硬件（例如 SIP 或\
  \ Zap 设备）。每个设备（无论是软电话、硬电话还是出局网关）的配置必须指定该设备的默认上下文。这里是一个来自 `sip.conf` 文件的示例：\n\n>\
  \ ![image](img/00028.jpg)\n\n此名为 2000 的 SIP 设备始终在 `internal-phones` 上下文中发起通话。这意味着如果呼叫者使用此电话拨打号码，Asterisk\
  \ 将在 `internal-phones` 上下文中查找匹配该号码的分号。如果没有匹配的分号，则什么都不会发生。\n\n> ### 警告\n> 深入理解上下文对于有效的\
  \ Asterisk 编程和管理至关重要。如果你不熟悉上下文，请遵循第 2 章“安装与‘Hello World’”中关于简单 PBX 系统的逐步演进示例。\n\n\
  > 花费时间熟悉这个概念是完全值得的。\n\n上下文通过方括号内的名称（`[name]`）定义。理想情况下，该名称应该是相关的，并有助于描述对该上下文的预期用途。此名称也将用于在其他地方引用上下文，无论是在其他上下文还是其他的\
  \ Asterisk 配置文件中。上下文名称之后的所有行都被视为该上下文的一部分，直到遇到下一个上下文名称：\n\n> ![image](img/00029.jpg)\n\
  \n### 3.2 扩展号 (Extensions)\n\n`extensions.conf` 中的单独条目被称为 `extensions`。每当为某个扩展号发起通话时，Asterisk\
  \ 都会执行该扩展的条目，但 `extensions.conf` 仅在启动时读取到 Asterisk 中。这意味着在拨号计划重新加载或重启 Asterisk 之前，更改不会生效。\n\
  \n> ### 注意\n> 一个异常是 Asterisk 实时架构（ARA）。在 ARA 系统中，拨号计划存储在数据库（例如 MySQL）中，并在每次通话时读取到\
  \ Asterisk，而不仅仅是在 Asterisk 启动时。因此，管理员可以在运行的 Asterisk 服务器上进行拨号计划更改，这些更改会立即生效。尽管如此，这种方法并非完美。你可以在\
  \ www.voip-info.org/wiki/view/Asterisk+RealTime 了解更多信息。\n\n你可以在运行期间通过 CLI（命令行界面）输入命令\
  \ `reload now`（重新加载所有配置）或 `extensions reload`（仅重新加载拨号计划）来刷新拨号计划。\n\n一个扩展号由以下部分组成：\n\
  \n- **Extension（扩展号）:** 名称或数字\n- **Priority（优先级）:** 一种程序行号\n- **Application（应用）:**\
  \ 告诉 Asterisk 它应该如何处理通话的指令\n\n以下是指定扩展号的模板示例：\n\n```\nexten => extension,priority,application\n\
  ```\n\n真实的语句看起来如下：\n\n```\nexten => 123,1,Answer()\n```\n\n> ### 警告\n> 扩展号中的第一个优先级必须为\
  \ 1（一）；否则 Asterisk 永远不会调用该扩展。随后的优先级必须递增 1。如果 Asterisk 在 n+1 处无法找到条目，它将停止执行且不会在 CLI\
  \ 中显示错误。\n\n#### 3.2.1 基础应用\n\n为了构建本章中的拨号计划示例，我们需要以下应用（所有应用均有详细描述）：\n\n- `Answer()`:\
  \ `Answer()` 应用顾名其名，接听电话。当信道响起时，`Answer()` 告诉 Asterisk “拿起听筒”。\n- `Hangup()`: `Hangup()`\
  \ 是 `Answer()` 的相反。终止活动连接，并让 Asterisk “挂断”虚拟听筒。\n- `Playback(soundfile)`: 这告诉 Asterisk\
  \ 播放指定的音频文件。默认情况下，它播放 `/var/lib/asterisk/sounds/` 中的文件，但你也可以指定另一个目录。不需要指定文件扩展名，因为目录可能包含不同格式的相同声音。Asterisk\
  \ 将选择最合适的格式。\n- `Wait(number)`: `Wait()` 定义了暂停；`number` 表示暂停的秒数。\n- `NoOp(string)`:\
  \ 此应用不做任何操作。`NoOp` 意味着“无操作”。然而，当你尝试排错拨号计划时，它是很有用的。当执行 `NoOp(string)` 时，Asterisk\
  \ 会在 CLI 上打印 *string*，但仅当详细程度级别设置为 3 时如此。（你可以通过在 CLI 中输入命令 `set verbose 3` 轻松地实现。）\n\
  - `VoiceMail(mailbox,u)`: 让呼叫者在指定的信箱中留言。\n- `VoiceMailMain()`: 提供对语音信箱系统的访问。信箱所有将使用它来提取消息。\n\
  \n#### 3.2.2 优先级\n\n一个典型的扩展号由多个条目组成。每个条目都有一个优先级，以便 Asterisk 知道应该按什么顺序执行这些条目。如果你接触过早期版本的\
  \ BASIC，你可能熟悉行号；优先级的运行方式非常相似，但有一个重要的区别。它们始终按照从小到大的数字顺序执行，但不能跳号！如果 Asterisk 执行了优先级为\
  \ *n* 的条目，它将查找 *n* + 1 处的下一个条目。如果它在 n + 1 处找不到条目，它将停止执行且不会在 CLI 中显示错误。\n\n#####\
  \ 3.2.2.1 “Hello World”示例\n\n当使用默认上下文 `widgets` 的电话拨打 8888 时，将调用以下扩展号。\n\nAsterisk\
  \ 拾起线路，播放 `hello-world` 音频文件（随 Asterisk 一起安装），然后挂断。\n\n\n\n\n\n![image](img/00030.jpg)\n\
  \n##### 3.2.2.2 n 优先级\n\n为了方便处理优先级，Asterisk 从 1.2 版本开始支持 `n` 优先级。`n` 优先级类似于自动行号标记；当\
  \ Asterisk 运行拨号计划并遇到优先级为 `n` 的条目时，它只需将其执行，就等同于前一个优先级加 1。当你拥有包含许多条目的扩展且需要添加或删除条目时，这非常有用，因为可以避免对整个扩展进行重新编号。下面的示例展示了标准扩展的样子：\n\
  \n![image](img/00031.jpg)\n\n你可以使用 `n` 优先级定义相同的扩展：\n\n![image](img/00032.jpg)\n\n\
  你可以在扩展的任何一点开始使用 `n` 优先级，只要后续的所有条目也使用它：\n\n![image](img/00033.jpg)\n\n### 3.3 模式匹配\n\
  \n在 `extensions.conf` 中，模式允许我们在单行中指定多个数字组合。\n\n根据我们目前所了解的知识，我们需要为每个电话号码编写单独的扩展。随着系统的扩展，这会导致拨号计划变得臃肿且易出错。假设在我们的示例中，我们需要数字\
  \ 100 到 109 播放 `hello-world` 音频文件。我们的 `extensions.conf` 看起来如下：\n\n![image](img/00034.jpg)\n\
  \n![image](img/00035.jpg)\n\n如果我们使用 `pattern`，同一个拨号计划将立即变得更加紧凑优雅：\n\n![image](img/00036.jpg)\n\
  \n`_10X` 扩展描述了从 100 到 109 的数字范围。\n\n#### 注意\n`pattern`（模式）和 `regular expression`（正则表达式）这两个术语经常被混用。通常，我们在\
  \ Asterisk 中使用的是 `pattern`，尽管许多程序员也会使用 `regular expression` 术语。\n\n#### 3.3.1 模式元素\n\
  \n拨号计划模式始终下划线 `_` 字符开头：\n\n```\nexten => *_pattern,priority,application\n```\n\n\
  Asterisk 拨号计划模式可以包含以下元素：\n\n- **[abc]**:\n  数字 `a`、`b` 和 `c`。例如，匹配 34、37 和 38\n\
  \  ```\n  exten => _3[478],1,NoOp(Test)\n  ```\n- **[a-b]**:\n  从 `a` 到 `b` 范围内的任何数字。例如，匹配\
  \ 31 到 35 之间的任何数字\n  ```\n  exten => _3[1-5],1,NoOp(Test)\n  ```\n  （例如，`[25-8]`\
  \ 对于数字 2,5,6,7,8 也是可以的）\n\n- **X**:\n  从 0 到 9 的任何一个数字。例如，匹配 300 到 399 之间的任何数字\n\
  \  ```\n  exten => _3XX,1,NoOp(Test)\n  ```\n- **Z**:\n  从 1 到 9 的任何一个数字。例如，匹配 31\
  \ 到 39 之间的任何数字\n  ```\n  exten => _3Z,1,NoOp(Test)\n  ```\n- **N**:\n  从 2 到 9 的任何一个数字。例如，匹配\
  \ 32 到 39 之间的任何数字\n  ```\n  exten => _3N,1,NoOp(Test)\n  ```\n- ***** *****:\n \
  \ 匹配星号 `*` 键\n  ```\n  exten => _*7,1,NoOp(Test)\n  ```\n- **#**:\n  匹配井号或 pound\
  \ 键 (`#`)\n  ```\n  exten => _#7,1,NoOp(Test)\n  ```\n- **_**:\n  任意数量任意数字。例如，匹配所有以\
  \ 011 开头的数字\n  ```\n  exten => _011.,1,NoOp(Test)\n  ```\n\n#### 警告\n不要使用 `_.` 模式！如果你这样做，该模式将包含特殊扩展，如\
  \ `i`、`t` 和 `h`，这将导致不可预测且可能不希望的行为。如果你需要宽泛的模式匹配，请使用 `_X.` 或 `_X`。\n\n- **!**:\n \
  \ 这个特殊的“通配符”字符会在拨号号码变得歧义时立即匹配；即，当正在拨出的号码无法匹配上下文中的任何其他扩展时。一旦匹配成功，出局线路将被接通，拨号将实时进行并带有直接反馈（这被称为*重叠拨号*/overlap\
  \ dialing）。\n\n#### 警告\n一个常见的错误是忘记模式开头的下划线 `_` 字符。这种约定是必要的，因为在 `sip.conf` 中配置的 SIP\
  \ 设备可以具有字母名称。（例如，在 Asterisk 中，333、loadingdock 和 A31 都是 SIP 设备的接受名称）。这同时也意味着如果你忘记使用下划线，你的扩展将永远不会匹配，而且你永远不会看到提示你错误的错误消息。\n\
  \n### 3.3.2 使用 dialplan show 测试模式\n\n一个拨号计划示例所示：\n\n![image](img/00037.jpg)\n\n\
  我们可以从 CLI 中调用 `dialplan show`（如果 Asterisk 已经在运行，则通过 `asterisk -r` 调用）来验证我们的拨号计划显示。\n\
  \n![image](img/00038.jpg)\n\n![image](img/00039.jpg)\n\n![image](img/00040.jpg)\n\
  \n![image](img/00041.jpg)\n\n![image](img/00042.jpg)\n\n![image](img/00043.jpg)\n\
  \n![image](img/00044.jpg)\n\n![image](img/00045.jpg)\n\n![image](img/00046.jpg)\n\
  \n![image](img/00047.jpg)\n\n#### 重要\n模式扩展在拨号计划中出现的顺序没有影响。模式扩展完全严格按照匹配精度的顺序进行匹配。\n\
  \n#### 3.3.3 模式匹配顺序\n\n\n\n\n在 Asterisk 1.2 中，`show dialplan 12346@sales` 给出的结果非常不同：\n\
  \n> ![image](img/00051.jpg)\n\n这就是为什么倾向于使用 `_X.` 作为通配符模式（如果我们确实使用通配符模式的话）。下面的拨号计划示例在\
  \ Asterisk 1.2 和 1.4 中的处理方式完全相同：\n\n> ![image](img/00052.jpg)\n\n优先级在两个版本中的显示如下：\n\
  \n> ![image](img/00053.jpg)\n\n### 3.4 Include 语句\n\nInclude 语句是简化和组织大型拨号计划的强大工具。使用\
  \ `include` 语句，你可以将其他上下文包含到当前上下。这里有一个更通用的示例：\n\n> include => *name-of-the-other-context*\n\
  \n以下是你可能在较大的拨号计划看到 `include` 语句的使用方式：\n\n> ![image](img/00054.jpg)\n\n### 3.4.1\
  \ 使用 Include 语句时的执行顺序\n\nAsterisk 在引用任何被包含的上下文之前，始终会在当前上下文中查找匹配。如果找到了匹配条目，则使用该条目。如果没有找到匹配条目，Asterisk\
  \ 将在第一个被包含的上下查找匹配，然后是下一个，依此类推。也可以存在嵌套包含；即包含之中的包含。\n\n你可以通过在 Asterisk CLI 中输入 `dialplan\
  \ show number@name-of-context` 来验证 Asterisk 正在使用哪个条目来处理呼叫。\n\n> ### 注意\n> Asterisk\
  \ 1.2 的用户使用 `show dialplan` 而不是 `dialplan show`。\n\n再次给出一个 `include` 语句的示例：\n\n\
  > ![image](img/00055.jpg)\n\n假设我们想了解 Asterisk 如何处理到 `sales` 上下文中 2000 的呼叫。为了做到这一点，我们在\
  \ CLI 中输入 `dialplan show 2000@sales`：\n\n> ![image](img/00056.jpg)\n\n如果我们像这样展开\
  \ `sales` 上下文：\n\n> ![image](img/00057.jpg)\n\n我们将看到此 CLI 输出：\n\n> ![image](img/00058.jpg)\n\
  \nAsterisk 将播放 `hello-world` 音频文件而不会将呼叫发送到 2000，即使 `include` 在拨号计划中先出现。这是因为 Asterisk\
  \ 在检查被包含的上下文之前，始终会在当前上下文中查找匹配。\n\n### 3.4.2 时间条件 Include 语句\n\n`include` 语句可以根据一天中的时间设置条件。这使得实现不同的白天和夜晚行为变得简单。基于时间的\
  \ `include` 语句的通用语法所示：\n\n> include => context|<*time*>|<*day*>|<*day-of-month*>|<*month*>\n\
  \n日期和月份使用全称的前三个字母指定。例如，工作日指定为 `mon`、`tue`、`wed`、`thu`、`fri`、`sat`、`sun`，月份指定为 `jan`、`feb`、`mar`、`apr`\
  \ 等。时间采用 24 小时格式。\n\n假设你有一家营业时间为周一至周五上午 9:00 到晚上 9:00，周六上午 9:00 到下午 6:00 的企业。拨号计划看起来如下：\n\
  \n> ![image](img/00059.jpg)\n\n### 3.5 ${EXTEN} 变量和 ${CALLERID(num)} 函数\n\n虽然我们稍后会详细检查变量和函数，但我们在这里想介绍两个简单直观的元素：系统变量\
  \ `${EXTEN}` 和函数 `${CALLERID(num)}`。\n\n#### 3.5.1 ${EXTEN}\n\nAsterisk 自动将拨打的号码放入\
  \ `${EXTEN}` 系统变量中。与其使用\n\n> exten => 2000,1,Dial(SIP/2000)\n\n我们可以使用\n\n> exten\
  \ => 2000,1,Dial(SIP/${EXTEN})`\n\n并得到相同的结果。对于单行代码来说这没有太大区别，但如果你将其与模式匹配结合使用，可以节省大量时间并使拨号计划更具读性。\n\
  \n要让所有分号为 2000 到 2999 的 SIP 电话均可拨打，在 `extensions.conf` 中只需要一行：\n\n> exten => _2XXX,1,Dial(SIP/${EXTEN})`\n\
  \n#### 3.5.2 ${CALLERID(num)}\n\n函数 `${CALLERID(num)}` 始终返回呼叫方的号码。这在与以下语句配合使用时\n\
  \n> exten => 99,1,VoiceMain()` 特别实用。\n\n## 4 案例研究：典型的电话系统\n\n在本章涵盖的内容的基础上，我们为一个虚构公司构建了一个更全面的系统。这样做将向你展示你在现实中可能面临的需求。我们的虚构公司是\
  \ Widgets, Inc.，一家小部件制造企业。我们被委托为新办公室规划电话系统，该办公室设有以下部门：\n\n• 管理层（2 人）\n• 接线员（3 人）\n\
  • 国内销售（6 人）\n• 国际销售（4 人）\n• 生产部（50 人）\n• 出货部（10 人）\n• IT 部门（2 人）\n• 楼经理（1 人）\n\n\
  每个员工都有自己的电话。Widgets, Inc. 应该预计哪些成本？这很大程度上取决于管理目标。应该考虑：\n\n• Asterisk 服务器是否需要容错能力？冷备服务器是否足够，还是我们需要热备？\n\
  • 我们购买什么服务器硬件？对于大多数系统，通用计算机即可。\n• 我们购买哪些电话？电话的价格范围从 30 美元到 300 美元不等。\n\nAsterisk\
  \ 对 Widgets, Inc. 是否有意义，还是这只是 IT 部门的一个找事做的项目？这取决于传统 PBX 供应商提供什么以及 Widgets, Inc.\
  \ 的需求。虽然传统供应商在发现有人在考虑 Asterisk 系统时出现意料之外的折扣并不罕见，但可能存在隐藏成本，有时表现为长期合同的形式，强制客户向该供应商购买多年。\n\
  \nAsterisk（以及一般的开源软件）的优势之一是支持和咨询服务的广泛选择和可用性。你可以自己完成一切，也可以聘佣顾问为你完成一切。如果你发现现有顾问的服务不满意，可以切换到另一位。这在传统供应商那里通常很困难，因为他们用合同锁定了你，而且产品的专有性质也意味着某种程度的销售区域独占。\n\
  \nAsterisk 在经济上是否可行必须根据具体情况计算。经验表明通常是行的。如果你在计算中考虑 Asterisk 的扩展性、升级自由（或不升级）以及可扩展性，那么\
  \ Asterisk 系统的中长期资本和运营成本通常证明是非常廉的。\n\n\n\n\n什么是封装好的 Asterisk 系统呢？例如 FreePBX、Trixbox、PBX-in-Flash、Elastix\
  \ 或 Gemeinschaft？“预装型”Asterisk 系统有其优点（安装和配置快速、常用常用功能界面简单、具有图形用户界面），也有其缺点（缺乏透明度、配置限制、安装基数较小）。对于通用\
  \ Asterisk 安装，一个编写良好的拨号计划（dialplan）可以作为新安装的模板，而经验丰富的 Asterisk 专家可以在设置预装 Asterisk\
  \ 相同或更短的时间内让新的复杂系统运行起来。无论你选择哪种，在采取预装路线之前，最好了解 Asterisk 在底层是如何运作的。这正是本书的目的所在！\n\n\
  ## 4.1 编号计划\n\n公司有 78 名员工。虽然使用两位数字分机号码也可以，但我们将使用三位数；这样在公司扩张或我们需要更多分机（例如，用于传真机或小组号码）时，我们就留出了一些余地。请参见表\
  \ 4.1。\n\n**表 4.1** Widgets, Inc. 的编号计划\n\n![image](img/00060.jpg)\n\n## 4.2 选择基础设施\n\
  \n新大楼将采用现代结构化布线系统，因此为每个工作站配备 SIP 电话是有意义的。这节省了我们在网络布线之外并行铺设电话布线带来的烦恼和额外费用。传真机和无线电话可以使用模拟电话适配器\
  \ (ATA) 设备连接到系统。\n\n> ### 警告\n> 尽管如此，在 Asterisk 中进行传真仍然存在问题。VoIP 连接取决于压缩方式，其可用带宽可能比传真连接所需的少。这可能导致传真传输只能被部分接收，更糟糕的是，完全失败。如果你仅在内部使用\
  \ VoIP，你必须确保所选的解码器能够充分支持传真。更好的选择是使用模拟电话卡为仅用于传真提供内部模拟分机，或者理想情况下，在 Asterisk 中构建传真服务器功能。\n\
  \n我们将 Asterisk 服务器安装在受控访问的、恒温的服务器机房内。只有授权人员才能访问服务器^(1)\n\n1。在过去，PBX 和密钥交换系统的制造商通常会在其系统中构建秘密后门，主要为了在发生故障时提供及时的支持。不可避免的是，聪明但不诚实的人员会找到方法利用这些后门来拨打免费的长途和国际电话，这通常是以那些规模大到无法清楚其系统配置情况的公共机构为代价的。在当今世界，你的系统的安全性（无论是\
  \ Asterisk 还是其他任何系统）始终应该是首要考虑的问题。\n\n### 4.2.1 网络\n\n网络是 Asterisk 功能中非常重要的一个方面，以至于需要更深入的讨论。\n\
  \n电话是一种同步介质，这意味着接收方必须在发送方发送的瞬间接收。人类可以忍受高达 300ms（毫秒）的延迟（也称为延迟），尽管当延迟超过 100ms 时是可以察觉的，超过\
  \ 200ms 时就会让人分心。大多数人认为超过 500ms 的延迟都是不可接受的。这是 IP 电话必须解决的主要挑战：在 IP 电话中，我们正试图在异步介质上传输同步数据流。TCP/IP\
  \ 是由美国国防高级研究计划署 (DARPA) 资助开发的，旨在最大化稳定性和健壮性，但这种目标是以牺牲我们对电话连接期望的实时性能为代价来实现的。\n\n当一封电子邮件在传输过程中偶尔停顿时，它在实质上不受影响。相比之下，语音对话高度依赖时间。如果有人对我们说“你好”，我们期望紧接着会有相关且易于理解的内容（例如我们的名字），因为这是人们面对面说话的方式。我们甚至能够在\
  \ IP 连接上承载语音流量，归功于现代网络的高性能。\n\n由于语音是同步的，网络对低延迟、低抖动和低丢包有很高要求。现代网络的高性能尽管如此，但网络状况是变化的。在正常工作时间内，网络会变得繁忙，员工发送邮件、浏览网页、下载文件。如果\
  \ ISP 无法保证低延迟，就会出现问题，这会影响通话质量。如果你计划使用 VoIP 并连接多个分支机构，你应该仔细考虑这一点并与你的 ISP 讨论。\n\n\
  Widgets, Inc. 的 Asterisk 系统至少有 78 个物理站。在最的情况下，会有 39 个并发通话（如果所有员工都互相通话）。取决于使用的解码器，我们可以预计最大带宽为\
  \ 6500kbps（比特每秒），对于典型的 100Mbps（兆比特每秒）结构化双绞线局域网来说，这不是问题。\n\n尽管如此，网络还将承载其他流量，几个大文件传输就足以达到性能限制。我们如何得到\
  \ 6500kbps 的值？G.711 压缩标准包含两种压缩算法：`u-law`（用于北美和日本）和 `a-law`（用于欧洲）。^(2)\n\n2。这两种算法用于在\
  \ ISDN 信道中（如 `T1` 和 `T3` 连接中）承载语音流量。\n\n它们提供了良好的音质，但至少需要 64kbps 带宽。单个连接由一个入站和一个出口信道组成，每个\
  \ 32kbps；39 个连接相加如下：`2 × 39 × 32kbps = 2496kbps`。除了通道所需的带宽外，还有 TCP/IP 网络开销，因此每个通道总共将使用约\
  \ 80kbps。现在我们的总数是 3120kbps；向上取整，我们有 3500kbps。虽然这只是最坏的情况之一，但在涉及语音系统时，患于未缪胜于其医！^(3)\n\
  \n\n\n\n\n[www.asteriskguru.com/tools/bandwidth_calculator.php](http://www.asteriskguru.com/tools/bandwidth_calculator.php)\
  \ 网站提供 Asterisk 带宽计算器，包含各种编码器的带宽值，可以帮助你进行规划工作。\n\n> **提示**\n> 如果你怀疑是否有足够的带宽来支持所有分机，可以考虑从损耗率较高的编码器开始，例如全球移动系统（GSM）。每个连接的带宽在\
  \ 13kbps 到 15kbps 之间，仅需 u-law 五分之一的带宽，并能为大多数应用提供足够的音质。在验证了系统的稳定性后，你可以尝试将一组分机切换到\
  \ u-law，并观察是否产生网络问题。请记住，像 GSM 这样高压缩编码器对处理器的资源要求更高，因此你需要确保 Asterisk 服务器上有有足够的 CPU\
  \ 资源。\n\n### 4.2.2 服务器硬件\n\nAsterisk 服务器硬件的选择也取决于许多相同的考虑因素。同步、实时数据传输的需求需要 Asterisk\
  \ 及时处理必要的进程。大部分计算工作源于数字音频流的编码和解码；如果你使用的设备使用了不同的编码器，且 Asterisk 必须在它们之间转码，那么工作量会更大。由于可用硬件种类多、数量大，计算处理器需求并没有一个硬性规则。然而，作为指南，我们可以从表\
  \ 4.2 开始。\n\n转码是将一种编码格式的音频流翻译为另一种编码格式的过程。例如，仅支持 GSM 的设备与仅支持 G.711 的设备之间的连接必须进行转码；这通常由\
  \ Asterisk 完成。\n\n### 表 4.2 服务器硬件基准\n\n![image](img/00061.jpg)\n\n我们所说的 `CPU` 是来自市售\
  \ PC 的典型 CPU（例如 Intel 或 AMD）。我们基于一个合理的假设：并非所有电话都会同时激活，而是处于三分之一到二分之一之间，并计算出并发数。请注意，这只是一个粗略的估计，留有相当的安全余量。如果需要的转码、会议或回声消除很少，支持的并发数会更高。尽管如此，任何特定安装环境的确切限制只能通过直接测试和实验来可靠地确定。\n\
  \n> **提示**\n> Linux 程序 `top` 提供了一个监控运行服务器上处理器负载的简单工具，但仅限于当前时间点。处理器和进程负载是动态的，并在时刻与时刻之间发生剧烈变化，因此点测量值的用处有限。你可以尝试使用如\
  \ Nagios ([www.nagios.org](http://www.nagios.org)) 等监控工具来监控你的 Asterisk 服务器的性能。如果你倾向于使用\
  \ Linux 原生工具，可以通过运行带有以下内容的 `bash script` 的 `cron job` 来进行简单的监控：\n\n```bash\nw |\
  \ head -n 1 >> /var/log/serverloads\n```\n\n通过每分钟运行此 cron job，你将随着时间推积出一组数据点，可以使用这些数据来评估服务器性能。这个\
  \ cron 确实是一个非常简单的分析工具。如果你熟悉 shell 脚本，可以编写更全面的脚本，通过使用 `top` 和 `uptime` 等工具的输出并对其进行处理，并将处理后的输出导出到逗号分隔的文本文件中，以便在电子表格程序中进行绘制图表。\n\
  \nWidgets, Inc. 有 78 名员工，估计 40 个并发连接是合理的，因此一台配备相当现代 CPU（例如 Pentium 4、AMD Athlon）且主频为\
  \ 1.5GHz 的电脑就足够了。通常，CPU 和系统越新，性能越好。处理器主频不再是衡量 CPU 性能的准确标准，特别是应用于较新的双芯处理器时，在相同的主频下，你的服务器可能可以使用新处理器处理更多的通话。双处理器机器将相应地提高性能。\n\
  \n对于语音信箱，每分钟消息时间大约需要 0.1MB（兆字节）的磁盘空间。这是用于 `wav49` 或 GSM 格式的消息文件的。如果你决定使用未压缩的 WAV\
  \ 格式文件，你将消耗许多倍的空间（高达十倍）。然而，由于磁盘空间廉价，这通常不是问题，更多的安装环境因为更高的音质而使用未压缩的 WAV。但请记住，使用的磁盘空间越多，备份所需的存储越多。\n\
  \n如果我们为每个用户分配 30 分钟的消息存储空间，预计总共将使用约 2GB（吉字节）的磁盘空间。语音消息数据是宝贵的业务数据甚至是关键数据，存储应该是冗余并定期备份的。`RAID\
  \ 1` 阵列（镜像配置的两个磁盘或磁盘组）将提供必要的冗余。\n\n> **警告**\n> 注意，软件 RAID 会显著增加 CPU 负担。如果可能，专业安装应使用硬件\
  \ RAID。\n\nAsterisk 的内存要求并不苛刻，512MB RAM 就足够了。拥有 1GB RAM 后，Asterisk 可以处理非常大的业务单元。任何旨在增强服务器可靠性和性能的额外步骤（例如安装冗余网络适配器、商业级电话接口卡和不间断电源），都将极大增强用户和决策者对系统的信心。\n\
  \n\n\n\n\n我们的示例 `sip.conf` 中有两个 `callerid` 变量实例。该变量设置了显示在被叫方电话上的内容：\n\n> callerid\
  \ = \"Building Manager\" <150>\n\n在我们的示例中，楼经理的两个电话（150 和 151）都使用主叫 ID 150 和主叫名称\
  \ Building Manager。这确保了回电总是拨向分机 150。\n\n### 4.3.2 拨号计划 (Dialplan)\n\n在第 2 章 中，我们为两个电话编写了一个简单的拨号计划。在本章的案例中，我们有更多的用户。编写一个包含\
  \ 100 个条目的拨号计划并不困难，但非常枯燥，而且维护可能会成为问题。在 `extensions.conf` 中使用书中之前描述的模式进行模式匹配会比好得多。\n\
  \n#### 4.3.2.1 extensions.conf\n\nWidgets, Inc. 的编号计划^(7) 转换为一个可读且易于维护的 `extensions.conf`，如下所示：\n\
  \n7。紧急号码除外。一旦建立了与外部世界的连接，我们将处理它们。\n\n> ![image](img/00067.jpg)\n\n> ![image](img/00068.jpg)\n\
  \n> ![image](img/00069.jpg)\n\n`[internal-calls]` 上下文中扩展意味着所有指向数字 100 到 599 的通话都将按照拨号完全传递给\
  \ `Dial()` 应用，将主叫方连接到相应的 SIP 电话。如果用户拨打 800，她将连接到该电话的语音箱。只有 IT 部门可以拨打 801，此时系统会提示信箱号码。这样做是为了让负责支持电话系统的\
  \ IT 部门能够出于调试目的访问所有信箱。\n\n在实际操作中，我们的拨号计划必须更复杂一些。编号计划包含了一些不包含电话的数字范围（例如 270 到 299）。我们的示例忽略了这一点，但这在实际部署中可能会导致混淆。如果用户拨了一个未分配的号码，通话将直接进入一个可能存在也可能不存在的语音箱；即使它存在，用户留下的信息也可能永远无人提取。\n\
  \n为了防止这种情况发生，`[internal-calls]` 上下文看起来像这样：\n\n> ![image](img/00070.jpg)\n\n对于 Widgets,\
  \ Inc., 为了简单起见，我们接受了这种风险并使用了以下配置：\n\n> ![image](img/00071.jpg)\n\n#### 4.3.2.2 voicemail.conf\n\
  \n`voicemail.conf` 保持如第 9 章所述的“语音邮件 (Voicemail)”，只是增加了几个条目，以限制消息长度并定义服务器电子邮件地址：\n\
  \n> ![image](img/00072.jpg)\n\n> ### Note\n\n> 前述示例中使用的密码仅用于演示目的。在实际生产安装中，您将需要使用更强密码。\n\
  \n### 4.4 接下来做什么？\n\n上述 Widgets, Inc. 的配置作为所有类似规模系统的规划示例。你可以使用此配置对书中的许多配置示例进行实验。\n\
  \n该系统仅允许电话通话，并包含一个简单的语音邮件系统。专业的安装通常需要电话会议和队列等功能。如果这是你需要的，你有两个基本选择：你可以重造轮子，从零开始构建包含这些功能的拨号计划；或者你可以使用标准框架如\
  \ FreePBX ([www.freepbx.com](http://www.freepbx.com)) 或 Gemeinschaft ([www.amooma.de/gemeinschaft](http://www.amooma.de/gemeinschaft))\
  \ 并根据你的需求进行配置。（目前，Gemeinschaft 仅提供德语版。欢迎愿意帮助国际化的志愿者！请通过 stefan.wintermeyer@amooma.de\
  \ 联系 Stefan。）\n\n## 5. 拨号计划编程\n\n在 Asterisk 中，函数或程序可以通过外部实现——通过 Asterisk 网关接口 (AGI)\
  \ 脚本（方式类似于通用网关接口 [CGI] 脚本为网页添加功能），或者通过内部实现——通过拨号计划中的函数和应用程序。本章将严格关注内部函数；AGI 将单独章节中详细介绍。\n\
  \n拨号计划定义在 `extensions.conf` 文件中。拨号计划本身看起来非常像一个 BASIC 程序。管理员可以使用简单的脚本语言来实现功能和呼叫流。\n\
  \n### 5.1 编程“如何做”\n\n无论你对 Asterisk 的经验水平如何（无论你是管理员、程序员、专家还是爱好者），你都需要掌握基础知识来编写实用的拨号计划，参见本章后部分的拨号计划\
  \ (Dialplan)。本指南应带给你基础理解，请参见变量 (Variables) 以利用 Asterisk。\n\n#### 5.1.1 程序结构\n\n\
  `/etc/asterisk/extensions.conf` 中定义的每个扩展实际上都是一个小程序。在 Asterisk 中，扩展看起来如下：\n\n> ![image](img/00073.jpg)\n\
  \n优先级可以按顺序编号：\n\n> ![image](img/00074.jpg)\n\n#### 5.1.2 使用 Set()\n\n使用 `Set()`\
  \ 创建和更改变量：\n\n> ![image](img/00075.jpg)\n\n有不同类型的变量：\n\n- **全局变量 (Global variables)**：在拨号计划的任何地方都有效，并通过\
  \ `Set(variable>=content,g)` 创建或修改。\n> ![image](img/00076.jpg)\n\n- **通道变量 (Channel\
  \ variables)**：仅在当前通道中有效（通道可以是两个人通话的连接）。通过 `Set(variable>=content)` 创建或修改（不带 `g`）。\n\
  > ![image](img/00077.jpg)\n\n- **系统变量 (System variables)**：这些动态变量由 Asterisk 设置，可以在拨号计划中调用无需创建。一个常用的系统变量是\
  \ `${EXTEN}`：\n\n> exten => 100,1,NoOp(Dialed number: ${EXTEN})\n\n#### 5.1.3 标签和\
  \ Goto()\n\n`Goto()` 允许你从一个拨号计划目的跳转到另一个。如果你使用 `n` 优先级，可能会出现问题。解决方案是使用标签标记特定目的，然后在\
  \ `Goto()` 中通过标签调用。\n\n你可以在扩展内部、扩展之间或上下文之间使用：\n\n- 你可以在扩展内部使用：\n\n> ![image](img/00079.jpg)\n\
  \n- 扩展之间：\n\n> ![image](img/00080.jpg)\n\n- 上下文之间：\n\n> ![image](img/00081.jpg)\n\
  \n#### 5.1.4 While() 循环\n\n循环允许你重复执行操作，这对于读取序列非常有用。使用 `While()` 在拨号计划中运行循环：\n\n\
