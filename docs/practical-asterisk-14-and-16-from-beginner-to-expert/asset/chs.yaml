  ### B.142 SayNumber()\n\n播读一个数字。\n\n> `SayNumber(*number*[,*gender*])`\n\n根据通道的语言设置播读提供的数字。语言可以通过\
  \ Asterisk 函数 `LANGUAGE()` 设置。\n\n以下语言支持从 1 到 99,999,999 的整数：\n\n> • `da` 丹语\n>\
  \ • `de` 德语\n> • `en` 英语\n> • `es` 西班牙语\n> • `fr` 法语\n> • `it` 意大利语\n> • `nl` 荷兰语\n\
  > • `no` 挪威语\n> • `pl` 波兰语\n> • `pt` 葡萄牙语\n> • `se` 瑞典语\n> • `tw` 台湾中文\n\n性别是可选的，取决于语言。\n\
  \n对于德语、法语、西班牙语等大陆语言，使用 `f` 表示阴性，`m` 表示阳性，`n` 表示中性。\n\n对于丹语、瑞典语和挪威语等斯堪的纳维亚语言，使用 `c`\
  \ 表示通用 (enn)，`n` 表示中性 (ett)。\n\n德语计数使用 `p`。\n\n为了让这些其他语言工作，`/var/lib/asterisk/sounds/digits`\
  \ 下必须存在相应的语言子目录（例如 `de/`）。\n\n> ![image](img/00905.jpg)\n\n**Asterisk 版本：**\n\n\
  ![image](img/00906.jpg)\n\n**Asterisk 1.4 中此应用程序的内部帮助：**\n\n> ![image](img/00907.jpg)\n\
  \n**Asterisk 1.2 到 1.4 的内部帮助差异：**\n\n无\n\n**Asterisk 1.4 到 1.6 的内部帮助差异：**\n\n无\n\
  \n另参见 `sayalpha`(#Practical_As-sk_1.4_and_1.6_split_031.html_filepos1147650), `saydigits`(#Practical_As-sk_1.4_and_1.6_split_031.html_filepos1151633),\
  \ `sayphonetic`(#Practical_As-sk_1.4_and_1.6_split_031.html_filepos1157877)。\n\n\
  ### B.143 SayPhonetic()\n\n使用 NATO 字母表拼读字符串。\n\n> `SayPhonetic(*string*)`\n\n使用\
  \ NATO 字母表或其语言变体拼读提供的字符串。语言可以通过 Asterisk 函数 `LANGUAGE()` 设置。尚不支持变音符号和其他特殊字符。\n\n\
