  \n\nUDP 建立了一种无连接的、可能不可靠的传输服务。这意味着传输的可靠性或接收顺序都无法保证；也就是说，UDP 是基于“尽力而为”的原则发送数据的。使用\
  \ UDP 的应用程序必须考虑这些特性，并在适当且必要的地方实现数据纠正。由于在数据传输之前不需要建立连接（如 `TCP` 那样），端点可以更快地开始交换数据。这种相对较低的开销使得\
  \ `UDP` 特别适用于仅交换少量量数据的应用程序，例如域名系统（DNS）。\n\n此外，缺乏握手过程意味着延迟（或抖动，jitter）的波动较小。如果一个\
  \ `TCP` 事务中丢失了数据包，接收方在等待发送者重传时需要宝贵的时间，而瞬时延迟可能会剧增。这对于对延迟敏感的多媒体应用至关重要。在 IP 电话（VoIP）应用中，这类延迟会导致声音失真和断断。\n\
  \n像 `UDP` 这样的无连接协议在数据包丢失时不会停止数据流。当数据包丢失时，由接收端来解释数据流中的空隙，大多数做法是通过暂时降低输出音频或视频的分辨率或质量。\n\
  \n`UDP` 与 `TCP` 一样，受底层网络栈层协议数据单元大小的限制。`IP` 数据包不能超过 65,535 字节，其中 `IP` 和 `UDP` 头部至少消耗\
  \ 28 字节，为实际负载留下最多 65,507 字节。此类数据报通常在 `IP` 中被分片。在实践中，`UDP` 数据包的大小很少超过几 KB。如果发生传输错误或溢出，`IP`\
  \ 将丢弃数据包，因此数据报可能会丢失。\n\n### 7.2 通道 (Channels)\n\n在 Asterisk 中，通道是两个端点（通常是对话中的人类）之间的连接。存在以下通道类型：\n\
  \n* **Agent**: 自动呼叫分配 (ACD) 代理通道\n* **CAPI**: ISDN 通道\n* **Console**: 用于声卡的 Linux\
  \ 控制台通道驱动程序，可以通过 `OSS` 和 `ALSA` 操作\n* **H.323**: 一种 VoIP 协议\n* **IAX**: 一种 VoIP\
  \ 协议\n\n#### 注意\n> 原则上，`IAX` 有两个版本（1 和 2）。今天，任何提到 `IAX` 的人几乎肯定是在说 `IAX2`（句话说，`IAX`\
  \ 版本 2）。`IAX` 版本 1 已废弃且不再使用。\n\n* **Local**: 指向另一个上下文的环回\n* **MGCP**: 一种 VoIP 协议\n\
  * **mISDN**: ISDN 通道\n* **NBS**: 网络广播音频\n* **phone**: Linux 电话通道\n* **SIP**: 一种\
  \ VoIP 协议\n* **Skinny**: 一种 VoIP 协议（也称为 `SCCP` 或 Skinny 客户端控制协议）\n* **vISDN**: ISDN\
  \ 通道\n* **VOFR**: Adtran 风格的分帧中继语音\n* **VPB**: 用于 PSTN 连接的 Voicetronix 硬件通道驱动程序\n\
  * **Zap**: 用于 PSTN 连接的 Digium 硬件通道驱动程序；也用于竞争厂商的硬件\n\n书中的大多数示例都假设使用 `SIP` 连接。原因很简单：目前，支持\
  \ `SIP` 的 VoIP 电话比任何其他 VoIP 协议的都要多。Asterisk 另一个重要的 VoIP 协议是 `IAX`。本章将详细介绍这两个重要协议，但也可以作为配置的参数参考。\n\
  \n### 7.3 对等体 (Peers)、用户 (Users) 和朋友 (Friends)\n\n在 Asterisk 中配置 IP 连接时，你必须指定连接的设备是对等体（peer）、用户还是朋友。Asterisk\
  \ 文档中这些分类之间的区别并不总是清晰的。\n\n简单来说，这些分类的作用如下。Asterisk...\n\n* 接受来自用户的呼叫\n* 向对等体拨叫\n\
  * 向朋友拨叫并接受朋友的呼叫\n\n在实践中，friend 使用得最多。\n\n### 7.4 IAX 对比 SIP\n\n每个 Asterisk 管理员最终都会面临一个问题，即是主要基于\
  \ `SIP` 还是 `IAX` 构建系统。尽管关于协议的争论有时带有宗教色彩，但我们认为，从纯技术角度来看，`IAX` 在某些重要方面至少略优于 `SIP`。在许多安装中，`IAX`\
  \ 意味着其实现问题比人们预期的 `SIP` 要少得多。其主要原因是 `SIP` 处理网络地址转换 (NAT) 的方式。`SIP` 连接是有问题的，因为它们需要在防火墙中打开一整个范围的端口才能工作。`IAX`\
  \ 在单个连接（`IAX trunk`）上复用会话的能力更加高效，因为它减少了开销。相比之下，`SIP` 为每次会话建立单独的连接。\n\n如果 `IAX` 可用且可行（即设备支持它），应该使用\
  \ `IAX`；否则，你应该使用 `SIP`。\n\nAsterisk 的发明者 Mark Spencer 在 2004 年给 Asterisk 用户邮件列表写了一封邮件，试图解决这个问题（见\
  \ 图 7.2）。\n\n**图 7.2** Mark Spencer 关于 IAX 的邮件。\n\n![image](img/00142.jpg)\n\n![image](img/00143.jpg)\n\
  \n在过去的几年里，`IAX` 本身已成为一个文档齐全的开放协议。`IAX` 2 已于 2009 年 2 月接受为信息性（非标准）协议 `RFC 5456`。\n\
  \n## 8 连接\n\nAsterisk 在连接到其他系统、电话设备和网络时发挥真正的威力。它通过音频编码器和各种传输介质（如数字 `T1`, `E1` 和模拟线路）来实现。在本章中，我们将更深入地研究编码器、ISDN\
  \ 和模拟信号。\n\n### 8.1 编码器 (Codecs)\n\n对电话中编码器的讨论会将某人放在一座大山的两侧之一。一侧是美国的情况，那里的 ISDN\
  \ 渗透率很低。普通的美国客户只用过模拟电话，因此数字编码器对他们来说就像尚未攀登的山：山顶是极具吸引力但又未知的数字编码器。\n\n另一侧是欧洲的情况，ISDN\
  \ 已经无处不在，模拟信号看起来像是黑暗时代。35 岁以下的欧洲客户只用过数字电话，因此数字编码器对他们来说就像已经去过的山：山顶很美，我们拍了一些照片，现在来打电话吧。\n\
  \n无论在那种情况下，编码器都远离人们的认知表面。然而，编码器的选择对 Asterisk 的实现有影响。无论你是在美国、欧洲还是世界其他地方，你都将面临这一选择。\n\
  \n作为一个通用指南，电话中最常用的数字编码器是 ISDN 编码器 `G.711`（`a-law` 或 `u-law` 压缩法；`u-law`(1) 用于美国和日本，而\
  \ `a-law` 是欧洲的标准）。\n\n1。实际上，这是 `μ-law`（希腊字母 mu，在物理中作为前缀表示“微”）。\n\n#### 8.1.1 编码器是做什么的？\n\
  \n\n\n\n简单来说，编解码器（codec）获取模拟音频信号并将其转换为数字位流。这由一系列步骤组成。首先，信号被数字化为带有时间编码的位流，然后使用压缩算法对该位流进行压缩，以便在传输时占用更少的带宽。这种压缩可以是近无损的（例如\
  \ `G.711`），也可以是有有损的（例如 `GSM`）。没有编解码器，音频就无法传输。应该选择哪种解码器取决于可用带宽和可用处理能力。使用任何解码器始终是在这两个考虑因素之间的权衡。\n\
  \n本章不会详细介绍编解码器的功能。对于我们的目的来说，概述一下即可。\n\n### 8.1.2 性能\n\n高压缩编解码器最大的问题是它们所需的处理能力。使用\
  \ Asterisk 控制台，输入命令 `core show translation` 来查看各种解码器所需的实际转码时间表格：\n\n![image](img/00144.jpg)\n\
  \n![image](img/00145.jpg)\n\n系统中不可用的解码器用破折号 (-) 标记。很容易看出哪种解码器消耗的处理器资源最多：`speex`。\n\
  \n为了最小化负载，请使用尽可能少数量的解码器。如果集合 A 和集合 B 在相互通话时使用相同的解码器，Asterisk 只需要通过数据包。如果集合 A 和集合\
  \ B 使用不同的解码器，Asterisk 必须对每个包进行转码，这涉及解码入包，然后使用另一个解码器对其编码后再发送到目标集合，并且在每个方向上都要这样做。你可以看到这如何迅速变得沉重。\n\
  \n### 8.1.3 配置解码器\n\n解码器的配置取决于技术。IAX 组在 `iax.conf` 中配置，SIP 组在 `sip.conf` 中配置。如果你想将所有\
  \ SIP 组设置为使用 `G.711`，你可以在 `sip.conf` 中写入以下：\n\n> ![image](img/00146.jpg)\n\n如果你有一个特定的电话（称之为\
  \ 2000）应该只使用 `GSM`，你可以这样设置：\n\n> ![image](img/00147.jpg)\n\n### 8.1.4 常用解码器\n\n\
  CLI 命令 `core show translation` 会显示之前看到的表格，它将向你显示系统中有哪些解码器（即所有对应列中有数字的解码器）。以下列表简要检查了\
  \ Asterisk 中最常用的解码器：\n\n> • **GSM**\n\n> 一种 Asterisk “经典”解码器，对任何有 GSM 手机服务的人来说都很熟悉。带宽为\
  \ 13.3kbps，质量可以接受，尽管并不十分惊艳。\n\n> • **iLBC**\n\n> iLBC 是一种用于低带宽情况的“秘密武器”。它的音质极佳，带宽限制在\
  \ 13.3kbps 到 15kbps 之间（取决于帧大小）。Skype 使用这种解码器的变体。iLBC 的问题在于它是处理器密集型的；这这也是为什么它没有在很多硬电话电话中实现的原因。\n\
  \n> • **G.711**\n\n> 另一个经典，来自 ISDN 解码器系列。这种解码器提供卓越的音质并需要 64kbps 的带宽。这是大多数在企业内网中传输通话的标准，也广泛用于公共互联网上的通话。\n\
  \n> • **G.722**\n\n> `G.722` 最终可能会取代 `G.711`；在最高分辨率下，它提供了比 `G.711` 好得多的音质，但需要的带宽相同（仅为\
  \ 64kbps）。遗憾的是，许多手机尚未支持它。\n\n> • **G.726**\n\n> 提供与 `G.711` 相同的音质，但只需要一半的带宽（32kbps）。与\
  \ `G.711` 相比，只传输相对于上一个语音包变化的数据（类似于 MPEG 视频的工作方式）。结果是用一半的带宽传输了相同的信息。`G.726` 并不太负担，但仍然比\
  \ `G.711` 需要更多的处理。\n\n> • **G.729a**\n\n> `G.729a` 是一种专利解码器，只需要 8kbps 就能提供与 GSM\
  \ 相当的音质。Asterisk 的许可可以从 Digium 购买（[www.digium.com](http://www.digium.com)）。它在音质或性能方面都不算卓越，但提供了一个公平平衡，并实现在许多\
  \ VoIP 电话中。因此，当你需要节省带宽时，它是一个很好的选择。\n\n> • **G.729.1**\n\n> `G.729.1` 是一种扩展，提供了与现有\
  \ `G.729` 解码器的位流互操作性，以及高水平的可配置性（它支持 8kbps 到 32kbps 流）。特别感兴趣的是宽带扩展，它们可以提供非常接近 CD\
  \ 级的音质；目前只有少数电话支持它们。要使用宽带扩展，媒体路径中的所有设备必须支持它们。\n\n### 8.1.5 带宽与中继\n\n任何想要在网络连接上通过多个并发通话的人（例如当两个\
  \ Asterisk 系统连接在一起时）很快就会带宽问题。根据解码器和帧大小的组合，IP 开销很容易超过有效载荷。例如，在 2Mbps 的数据连接上使用 SIP\
  \ 和 `GSM`，你可以支持最多 150 个通话。\n\n### 8.2 集成服务网络\n\nISDN 是一种用于 PSTN 和数据应用的双线数字复用标准。尽管在世界范围内被广泛使用，但在北美并不为人知。对于大多数数据应用，ISDN\
  \ 已被 ADSL、同轴电缆和 FTTH（光纤入户）技术取代，这些技术以具有竞争力的价格提供了更大的带宽。它仍用于语音和视频应用。我们在这里查看这些。\n\n\
  #### 8.2.1 ISDN 基础\n\nISDN 连接提供两种基本通道类型：B 和 D。（存在更专门的通道类型，但没有广泛使用，且此处未涵盖。）单个 B（信载）通道大致可以等同于单条模拟电话线：你可以在该通道上进行一次对话。它的不同之处在于，单个物理线对可以携带多个\
  \ B 通道，从而更好地利用现有的布线。数据是以数字格式而非模拟格式传输的，这意味着你不能将模拟电话连接到线路上并期望听到任何声音。当一切都配置妥当时，数字传输通常会提供更好的音质。\n\
  \nD（数据）通道携带有关电路上 B 通道的信令信息。\n\nB 通道和 D 通道的区别如下：\n\n> • 对于我们的目的而言，B 通道是一个语音通道。（在非\
  \ Asterisk 安装中，它可以携带数据。）B 通道提供 64kbps 的带宽。\n\n\n\n\n\n> `D` 信道仅传输数据，但专门用于信令。根据接口类型，`D`\
  \ 信道的速率可以是 16kbps 或 64kbps。ISDN 设备——无论是电话、PBX 还是接口卡——都使用 `D` 信道进行呼叫的建立和拆除。\n\n后续章节将介绍\
  \ ISDN 连接的两种主要类型：基本速率接口和原生速率接口。\n\n##### 8.2.1.1 ISDN 基本速率接口\n\n入门级 ISDN 服务被称为基本速率接口，或\
  \ `BRI`，用于家庭（北美以外的地区）和中小型企业。它在单对双线线（两根线）上提供两个 64kbps 的 `B` 信道和一个 16kbps 的 `D` 信道（这就是为什么有些人将其称为\
  \ `2B+D`）。你可以将 ISDN 电话、`PBX` 设备上的 `BRI` 端口、ISDN `BRI` 终端适配器（为模拟电话提供 `FXS` 端口）或 ISDN\
