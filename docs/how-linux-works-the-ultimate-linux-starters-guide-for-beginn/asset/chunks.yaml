  trans: "\n\n`.bash_profile`, `.bash_login` 和 `.profile` 文件，系统只会运行它看到的第一个文件。\n\n\
    虽然听起来很奇怪，但可以将非交互式 shell 作为登录 shell 运行，以强制其运行启动文件。要这样做，请启动 shell 时使用 `-l` 或 `--login`\
    \ 。\n\n## 非登录 Shell (Non-Login Shells)\n\n非登录 shell 是你登录后运行的额外 shell。简单来说，它就是任何不是登录\
    \ shell 的交互式 shell。窗口系统的终端程序（xterm、GNOME Terminal 等）除非你明确要求登录 shell，否则都会启动非登录\
    \ shell。\n\n作为非登录 shell 启动时，bash 会运行 `/etc/bash.bashrc`，然后运行用户的 `.bashrc`。\n\n\
    ## 两种模式的结果\n\n### Shell 的种类\n\n两种不同启动系统背后的逻辑是：在过去，用户通过带有登录 shell 的传统终端登录，然后通过窗口系统或屏幕程序启动非登录子\
    \ shell。\n\n对于非登录子 shell，反复设置用户环境并运行一系列已经运行过的程序被认为是浪费的。\n\n对于登录 shell，你可以在如 `.bash_profile`\
    \ 等文件中运行复杂的启动命令，只将别名和其他“轻量级”内容留给 `.bashrc`。\n\n如今，大多数桌面用户通过图形化显示管理器登录。其中大多数启动时会带一个非交互式登录\
    \ shell，以保留上述登录与非登录的模型。如果它们没有这样做，你需要在 `.bashrc` 中设置整个环境（路径、手动路径等），否则，你将在终端窗口 shell\
    \ 中永远看不到你的任何环境设置。\n\n然而，如果你以后想在控制台或远程登录，你仍然需要一个 `.bash_profile`，因为登录 shell 永远不会运行\
    \ `.bashrc`。\n\n### 示例 .bashrc\n\n为了同时满足非登录 shell 和登录 shell 的需求，如何创建一个可以作为 `.bash_profile`\
    \ 使用的 `.bashrc` 呢？这里有一个（足够的）示例：\n\n```bash\n# 命令路径。\nPATH=/usr/local/bin:/usr/bin:/bin:$HOME:$PATH\n\
    \n# PS1 是常规提示符。\n# 替换符包括：\n# 用户主机名 当前目录\n# ! shell  own\nPS1='\\u@\\h\\$ '\n\n\
    # EDITOR 和 VISUAL 决定在请求编辑文件时，less 和 mail 等程序使用什么程序。\n# PAGER 是 man 等程序的默认文本查看器。\n\
    # 这些是 less 的一些有用选项：\n# (F=退出, R=重绘, X=不使用屏幕)\n# 你必须导出环境变量。\nexport EDITOR VISUAL\
    \ PAGER\n\n# 默认，给其他用户只读文件。\numask 022\n```\n\n### 检查登录 shell 和交互式 shell\n\n通过一个与\
    \ `.bash_profile` 匹配的 `.bashrc`，你通常不需要为登录 shell 运行额外的。但是，如果你想为两者都定义不同的动作：\n\n\
    ```bash\ncase $- in\n*i*) # 交互式命令在此\n    command --snip\n    ;;\n*) # 非交互式命令在此\n\
    \    command --snip\n    ;;\nesac\n```\n\n## tcsh Shell\n\n几乎所有 Linux 系统上的标准 shell\
    \ 是 tcsh，这是一种增强型的 C shell，它普及了如命令行编辑以及多维文件名和命令补全等功能。即使你没有使用 tcsh 作为默认用户 shell（我们建议使用\
    \ bash），你仍然应该提供 tcsh 启动文件，以防你的用户碰巧遇到它。\n\n你不需要担心 tcsh 中登录 shell 和非登录 shell 区别。启动时，tcsh\
    \ 会寻找 `.tcshrc` 文件。如果没有，它会寻找 csh shell 的 `.cshrc` 启动文件。这种顺序的原因是，你可以使用 `.tcshrc`\
    \ 文件处理 csh 中无法运行的 tcsh 扩展。\n\n你可能应该坚持使用传统的 `.bashrc` 而不是 `.tcshrc`；极不太有人会使用 csh\
    \ 使用你的启动文件。而且如果用户确实在其他系统上遇到了 csh，你的 `.cshrc` 也能正常工作。\n\n### 示例 .cshrc\n\n```csh\n\
    # 命令路径。\nset PATH=/usr/local/bin:/usr/bin:/bin:$PATH\n\n# EDITOR 和 VISUAL 决定在请求编辑文件时，less\
    \ 和 mail 等程序使用什么程序。\nset EDITOR\nset VISUAL\n\n# PAGER 是 man 等程序的默认文本查看器。\n# 这些是\
    \ less 的一些有用选项：\n# (F=退出, R=重绘, X=不使用屏幕)\nset PAGER=less\n\numask 022\n```\n\n\
    ## 默认用户设置\n\n编写启动文件并为新用户选择默认值的最佳方法是使用测试用户。创建一个空目录的测试用户，并将自己的启动文件拷贝到测试目录。从零开始编写新文件。\n\
    \n当你认为你有一套可以运行的配置时，以所有方式登录测试用户（在控制台、远程等）。确保你测试了尽可能多的内容，包括窗口系统操作和菜单。当你对测试用户满意时，创建第二个测试用户。如果一切运行正常，你现在就有了一套可以分发给用户的新启动文件了。\n\
    \n### Shell 默认值\n\nLinux 系统上任何新用户的默认 shell 应该是 bash，因为：\n- 用户使用 shell 编写 shell\
    \ 脚本（例如，csh 是一个臭名昭著的糟糕脚本工具——别去想它）。\n- bash 是 Linux 上的标准。\n- bash 使用 readline，因此它的界面与其他许多工具相同。\n\
    - bash 让你能够对 I/O 重定向和文件句柄进行精细、易于理解的控制。\n\n然而，许多老练的高手使用 csh 和 tcsh 等 shell 仅仅是因为他们不忍切换。当然，你可以选择任何你喜欢的\
    \ shell，但如果你没有偏好，请选择 bash，并将其作为系统上任何新用户的默认 shell。（用户可以使用 `chsh` 命令更改其 shell 以适应个人偏好。）还有许多其他\
    \ shell（rc, ksh, zsh, es 等）。有些不适合作为初学者 shell，但 zsh 和 fish 有时受到寻找替代 shell 的新用户的欢迎。\n\
    \n### 编辑器\n\n在传统系统上，默认编辑器应该是 vi 或 emacs。这些是唯一保证在几乎任何系统上存在的编辑器，这意味着从长远来看，它们给新用户带来的麻烦最少。\n\
    \n然而，Linux 发行版通常将 nano 配置为默认编辑器，因为它对初学者更容易用。与 shell 启动文件一样，避免大型默认编辑器启动文件。在 .xrc\
    \ 启动文件中设置一点东西并无害，但要避免任何显著改变编辑器行为或外观的内容。\n\n### 分页器\n\n将默认 `PAGER` 环境变量设置为 `less`\
    \ 是完全合理的。\n\n### 启动文件陷阱\n\n- 不要要在 shell 启动文件中放置任何类型的图形化命令。\n\n"
