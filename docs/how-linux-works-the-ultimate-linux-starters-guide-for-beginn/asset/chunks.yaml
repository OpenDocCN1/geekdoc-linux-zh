    app store, with a directory of popular apps. You can install an app from the repositories
    in one of two ways: from a graphical software manager (again, which looks like
    an app store) or from the command line.


    To open Linux Mint''s Software Manager, click the menu button in the lower-left
    corner and head to Administration > Software Manager (or just start typing "software
    manager," like you would in Windows). From here you can download plenty of free,
    open-source apps. Some are Linux versions of their Windows counterparts, like
    Steam and Spotify, while others are open-source alternatives to common apps (Banshee
    is a music player similar to iTunes, GIMP is an image editor akin to Photoshop).
    You can browse here or search for apps using the bar at the top.


    ### How to Install and Uninstall Apps


    If you know what you''re looking for, it''s generally faster to install apps from
    the command line. And while it may seem intimidating at first, Linux still relies
    on the command line for various tasks, so it might behoove you to get comfortable
    with it. To install an app—let''s say the open-source media player VLC—open a
    Terminal window and run:


    ```

    sudo apt update

    sudo apt install vlc

    ```


    Let''s break that down: `sudo` tells the system to run the command as root (or,
    as it might be called in Windows, as an administrator), `apt` is the name of Linux
    Mint''s package manager, and `update` ensures the list of available apps is up
    to date.


    The second command, which includes `install vlc`, is self-explanatory. You should
    run `sudo apt update` before installing any app, and you can replace `vlc` with
    the name of any app you want to install. If you aren''t sure what the repository
    calls it, you can run `sudo apt cache search vlc` to see what comes up.


    To uninstall an app, just run:


    ```

    sudo apt remove vlc

    ```


    This will remove the app, but not your configuration files, so if you decide to
    reinstall it later, your settings will still be there. If you want to remove configuration
    files too, you can instead run:


    ```bash

    sudo apt purge vlc

    ```


    ### How to Update Apps


    You''ll also want to periodically update those apps, so you have the latest versions.
    You can do this, again, in two ways: from the graphical tool or from the command
    line. For the graphical tool, click the shield icon in the lower-right corner,
    which opens the Update Manager app. You can then click the Install Updates button
    to update all your software.


    Update Linux Mint Alternatively, you can open a Terminal and run two commands:


    ```bash

    sudo apt update

    sudo apt upgrade

    ```


    Again, the `update` command checks for new versions of your software, and the
    `upgrade` command actually upgrades all your apps. You''ll want to run these two
    together, just like you do for installing new apps.


    Those are the most critical things to know now, but take some time to browse around
    Mint''s interface and its settings to see what it has to offer. The Welcome window
    that appears at startup can be a big help—its First Steps area will show you how
    to choose different layouts, install media codecs you might want, and install
    necessary drivers for your hardware.


    You''ll get the hang of the basics quickly, but the Mint and Ubuntu forums are
    always there to help if you get stuck. Just be sure to search around, since there''s
    a good chance someone before you has had the same question.

