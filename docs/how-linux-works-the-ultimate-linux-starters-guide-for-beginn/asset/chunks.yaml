    Shell 启动文件的核心要素——从命令路径、提示符、别名到权限掩码。


    ## 命令路径


    任何 shell 启动文件中最重要的部分都是命令路径（path）。路径应该涵盖包含普通用户感兴趣的所有应用程序的目录。至少，路径应该按以下顺序包含这些组件：


    ```

    /usr/local/bin

    /usr/bin

    /bin

    ```


    这种顺序确保了你可以使用位于 `/usr/local` 的特定站点变体程序来覆盖标准的默认程序。


    大多数 Linux 发行版会将几乎所有软件包软件的可执行文件安装在 `/usr/bin` 中。它们偶尔会有所不同，例如将游戏放在 `/usr/games`，将图形化应用程序放在单独的位置，因此请先检查系统的默认设置。并确保系统上的每个通用程序都能通过上述列出的目录之一可用。如果不是这样，你的系统可能已经失控了。不要为了适应新的软件安装目录而更改你用户环境中的默认路径。适应独立安装目录的方法是在
    `/usr/local/bin` 中使用符号链接。许多用户会使用自己的 `bin` 目录来存储 shell 脚本和程序，因此你可能想将此添加到路径的前端：


    ```

    $HOME/bin

    ```


    注意：较新的习惯是将二进制文件放在 `$HOME/.local/bin` 中。


    如果你对系统实用工具（如 `traceroute`、`ping` 和 `lsmod`）感兴趣，请将 sbin 目录添加到你的路径中：


    ```

    /usr/local/sbin

    /usr/sbin

    /sbin

    ```


    ### 向路径中添加点 (.)


    有一个小但有争议的命令路径组件需要讨论：点（dot）。在路径中放置点 (`.`) 允许你在不在程序名前加 `./` 的情况下运行当前目录下的程序。


    这在编写脚本或编译程序时可能看起来方便，但由于两个原因这是一个坏主意：


    * 它可能导致安全问题。你不应该在路径开头放置点。这是一个可能发生的情况示例：攻击者可以在互联网分发的压缩包中放置一个名为 `ls` 的木马。即使路径末尾有一个点，你仍然容易受到
    `sl ors` 这样的拼写错误的影响。

    - 它是不一致的且可能引起混淆。


    路径中的点可能意味着命令将切换到当前目录。


    ### 手册路径


    传统的目录路径由 `MANPATH` 变量决定，但你不应该设置它来覆盖 `/etc/man` 中的默认值。


    ### 提示符


    经验丰富的用户倾向于避免长复杂的提示符。相比之下，新手会将所有内容拖入默认提示符中。你的提示符应该反映用户的需求；如果有帮助，将工作目录、主机名和用户名放在提示符中。


    上述，避免使用对 shell 有特殊含义的字符，例如：`{`, `}`, `=`, `<`, `>`。避免额外的字符，如果你复制粘贴窗口输出的内容，这些字符可能会导致你的当前目录下产生异常的空文件。即使是
    shell 的默认提示符也不理想。例如，默认提示符包含 shell 的名称和版本。bash 的这个简单提示符设置以 `$` 结尾（传统的是 `%`）：


    ```

    PS1=''\u$''

    ```


    `\u` 是当前用户名的替换符（参考 bash 手册页中的提示符）。其他常用的替换符包括：


    * `\h` 主机名（短格式，不带域名）

    * `\!` 历史编号

    * `\w` 当前目录。因为这可能会变得很长，你可以使用 `\W` 将显示限制为最后一个组件。

    * `\$` 如果作为用户运行，`#` 如果是 root


    ## 别名


    在现代环境中，较为复杂的点之一是别名（aliases）的作用，这种 shell 特性在执行命令之前用一个字符串替换另一个字符串。这些可以是高效的快捷方式，节省一些字量。然而，别名也有这些缺点：


    * 操作参数可能很麻烦。

    * 它们令人困惑；shell 内置的 `which` 命令可以告诉某内容是否是别名，但它不会告诉你在哪里定义的。

    *它们在子 shell 和非交互式 shell 中是不受欢迎的；它们在其他 shell 中不起作用。


    鉴于这些缺点，你应该尽可能避免别名，因为编写一个 shell 函数或完全全新的 shell 脚本更简单。现代计算机启动和执行 shell 的速度非常快，别名之间的差异对你来说可能毫无意义。当你希望用
    shell 脚本更改环境时，别名会很有用，因为脚本作为子 shell 运行（你也可以定义 shell 函数来影响这一点）。


    ## 权限掩码


    正如第 2 章所述，shell 内置的 `umask`（权限掩码）设置了你的默认权限。你应该在其中一个启动文件中运行 `umask`，以便你运行的任何程序创建的文件都具有你的权限。有两个选择：


    * `077` 这种掩码是最严格的掩码，因为它不允许其他用户访问新文件和目录。这通常用于多用户系统，在你不希望其他用户查看你的任何文件。然而，当设置为默认值时，当用户想要共享文件但不如何设置权限时，有时会导致问题。

    * `022` 这种掩码赋予其他人读取新文件和目录的权限。这在单用户系统中可能很重要，因为许多作为伪用户运行的守护进程无法看到使用严格的 `077` umask
    创建的文件和目录。


    注意：某些应用程序（尤其是邮件程序）会覆盖 umask，将其更改为 077，因为它们觉得文件是文件所有者的私事。


    ## 启动文件顺序和示例


    现在你已经知道了 shell 启动文件中写什么，是时候看一些具体的示例了。惊讶的是，创建启动文件最困难、最混乱的部分之一是决定使用多个启动文件中的哪一个。接下来的章节介绍了最流行的
    Unix shell：bash 和 tsh。


    ### Bash Shell


    在 bash 中，你可以从启动文件名 `.bash_profile`、`.profile`、`.bash_login` 和 `.bashrc` 中选择。哪一个适用于你的命令路径、手册路径、提示符、别名和权限掩码？答案是，你应该有一个
    `.bashrc` 文件，并配有一个指向 `.bashrc` 的 `.bash_profile` 符号链接，因为有几种 bash 实例类型。


    两种主要的实例类型是交互式和非交互式，但在其中只有交互式 shell 是登录式的（login）。非交互式（例如运行脚本的 shell）通常不读取任何启动文件。

