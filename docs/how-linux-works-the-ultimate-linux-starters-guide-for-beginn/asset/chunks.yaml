    Essentials of a shell startup file—from the command path, prompt, and aliases
    through the permissions mask.


    ## The Command Path


    The most important part of any shell startup file is the command path. The path
    should cover the directories that contain every application of interest to a regular
    user. At the very least, the path should contain these components, in order:


    ```

    /usr/local/bin

    /usr/bin

    /bin

    ```


    This order ensures that you can override standard default programs with site-specific
    variants located in `/usr/local`.


    Most Linux distributions install executables for nearly all packaged software
    in `/usr/bin`. There are occasional differences, such as putting games in `/usr/games`
    and graphical applications in a separate location, so check your system’s defaults
    first. And make sure that every general-use program on the system is available
    through one of the directories listed above. If not, your system is probably getting
    out of control. Don’t change the default path in your user environment to accommodate
    a new software installation directory. A way to accommodate separate installation
    directories is to use symbolic links in `/usr/local/bin`. Many users use a bin
    directory of their own to store shell scripts and programs, so you may want to
    add this to the front of the path:


    ```

    $HOME/bin

    ```


    NOTE: A newer convention is to place binaries in `$HOME/.local/bin`.


    If you’re interested in systems utilities (such as traceroute, ping, and lsmod),
    add the sbin directories to your path:


    ```

    /usr/local/sbin

    /usr/sbin

    /sbin

    ```


    ### Adding Dot (.) to the Path


    There is one small but controversial command path component to discuss: the dot.
    Placing a dot (`.`) in your path allows you to run programs in the current directory
    without using `./` in front of the program name.


    This may seem convenient when writing scripts or compiling programs, but it’s
    a bad idea for two reasons:


    * It can be a security problem. You should never put a dot at the front of the
    path. Here’s an example of what can happen: An attacker could put a Trojan horse
    named `ls` in an archive distributed on the Internet. Even if a dot were at the
    end of the path, you’d still be vulnerable to typos such as `sl ors`.

    - It is inconsistent and can be confusing.


    A dot in a path can mean that a command will change to the current directory.


    ### The Manual Path


    The traditional manual path was determined by the `MANPATH` environment variable,
    but you shouldn’t set it overriding defaults in `/etc/man`.


    ### The Prompt


    Experienced users tend to avoid long, complicated prompts. In comparison, beginners
    drag everything into a default prompt. Your prompt should reflect your user’s
    needs; place the working directory, hostname, and username in the prompt if it
    helps.


    Above, avoid characters that mean something to the shell, such as these: `{`,
    `}`, `=`, `<`, `>`. Avoid extra characters, which can cause erratic, empty files
    in your current directory if you copy and paste a section of your window that
    outputs. Even a shell’s default prompt isn’t ideal. For example, the default prompt
    contains the shell name and version. This simple prompt setting for bash ends
    with `$` (the traditional ends with `%`):


    ```

    PS1=''\u$''

    ```


    The `\u` is a substitution for the current username (the prompt of the bash manual
    page). Other popular substitutions include the following:


    * `\h` The hostname (short form, without domain names)

    * `\!` The history number

    * `\w` The current directory. Because this can become long, you can limit the
    display to just the final component with `\W`.

    * `\$` if running as a user, `#` if root


    ## Aliases


    Among the trickier points of modern environments is the role of aliases, a shell
    feature that substitutes one string for another before executing a command. These
    can be efficient shortcuts that save some typing. However, aliases also have these
    drawbacks:


    * It can be tricky to manipulate arguments.

    * They are confusing; a shell’s built-in `which` command can tell you if something
    is an alias, but it won’t tell you where it was defined.

    * They are frowned upon in subshells and noninteractive shells; they do not work
    in other shells.


    Given these disadvantages, you should probably avoid aliases whenever possible
    because it’s easier to write a shell function or an entirely new shell script.
    Modern computers can start and execute shells so quickly that the difference between
    aliases might mean nothing to you. That aliases come handy when you wish to alter
    environment with a shell script because scripts run as subshells (you can also
    define shell functions to affect this).


    ## Permissions Mask


    As described in Chapter 2, a shell’s built-in `umask` (permissions mask) sets
    your default permissions. You should run `umask` in one of your startup files
    to make any program you run creates files with your permissions. The two choices
    are:


    * `077` This mask is the most restrictive mask because it doesn’t give other users
    access to new files and directories. This is often on multi-user systems where
    you don’t want other users to look at any of your files. However, when set as
    default, it can sometimes lead to problems when users want to share files but
    don’t understand how to set permissions.

    * `022` This mask gives others read access to new files and directories. This
    can be important on a single-user system because many daemons that run as pseudo-users
    are not able to see files and directories created with the restrictive `077` umask.


    NOTE: Certain applications (especially mail programs) override the umask, changing
    it to 077 because they feel their files are the business of no one but the file
    owner.


    ## Startup File Order and Examples


    Now that you know what to into shell startup files, it’s time to see some specific
    examples. Surprisingly, one of the most difficult and confusing parts of creating
    startup files is determining which of several startup files to use. The next sections
    cover the two most popular Unix shells: bash and tsh.


    ### The Bash Shell


    In bash, you can choose from startup filenames `.bash_profile`, `.profile`, `.bash_login`,
    and `.bashrc`. Which one is appropriate for your command path, manual page path,
    prompt, aliases, and permissions mask? The answer is that you should have a `.bashrc`
    file accompanied by a `.bash_profile` symbolic link pointing to .bashrc because
    there are a few kinds of bash instance types.


    The two main instance types are interactive and noninteractive, but of those,
    only interactive shells are login. Noninteractive (such as those that run scripts)
    usually don’t read any startup files.

