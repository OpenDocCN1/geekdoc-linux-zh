    For example, `b?` matches `boat` and `brat`. If you don’t want the shell to expand
    a glob in a command, enclose the glob in single quotes (`''''`). For example,
    the command `echo *` prints a star. You will find this handy for a few of the
    commands described in the next section, such as `grep` and `find`.


    NOTE: It is important to remember that the shell performs expansions before running
    commands, and only then.


    Therefore, if a wildcard makes it to a command without expanding, the shell will
    do nothing more with it; it’s up to the command to decide what it wants to do.


    There is more to a modern shell’s pattern-matching capabilities, but `*` and `?`
    are what you need to know now.


    ## Intermediate Commands


    The following sections describe the most essential intermediate Unix commands.


    ### grep

    The `grep` command prints the lines from a file or input stream that match an
    expression. For example, to print the lines in the `/etc/passwd` file that contain
    the text `root`, enter this:


    ```

    $ grep root /etc/passwd

    ```

    The `grep` command is extraordinarily handy when operating on multiple files at
    once because it prints the filename in addition to the matching line. For example,
    if you want to check every file in `/etc` that contains the word `root`, you could
    use this command:


    ```

    $ grep root /etc/*

    ```

    Two of the most important `grep` options are `-i` (for case-insensitive matches)
    and `-v` (which inverts the search, that is, prints all lines that don’t match).
    There is also a more powerful variant called `egrep` (which is just a synonym
    for `grep -E`).


    `grep` understands patterns known as regular expressions that are grounded in
    computer science theory and are very common in Unix utilities. Regular expressions
    are more powerful than wildcard-style patterns, and they have a different syntax.
    There are two important things to remember about regular expressions:


    * `.*` matches any number of characters (like the `*` in wildcards).

    * `.` matches one arbitrary character.


    NOTE `grep` manual details regular expressions but it can be difficult to read.
    To learn more, you can read *Mastering Regular Expressions*, 3rd edition (O''Reilly,
    2006), or the regular expressions chapter of *Programming Perl*, 4th edition (O’Reilly,
    2012). If you like math and are interested in regular expressions look up *Introduction
    to Automata, Languages and Computation*, 3rd edition (Pearson, 2006).


    ### less

    The `less` command is handy when a file is big or when a command output is long
    and scrolls off the top. To page through a big file like `/usr/share/words`, use
    `less /usr/share/words`. When running `less`, you’ll see the contents of the file
    one at a time. Press spacebar to go forward in the file and `b` key to scroll
    back. Type `q`.


    NOTE: The `less` command is an enhanced version of an older program named `more`.
    Most Linux desktops have `less`, but it’s not standard on embedded systems and
    other systems. If you ever run into a situation when you can’t use `less`, try
    `more`. You can search for text inside `less`. For example to search forward for
    a word, type `/word`, and to search backward, use `?word`. When you find a match,
    press `n` to continue searching.


    As you’ll learn in Section 2.4, you can send the standard output of any program
    to another program’s standard input. This is exceptionally when you have a command
    with a lot of output to sift through and you’d like to use something like `less`
    to view the output. Here’s an example of sending the output of a `grep` command
    to `less`:


    ```

    $ grep /usr/share/words | less

    ```

    Try this command for yourself. You’ll probably use `less` like this a lot.


    ### pwd

    The `pwd` (print working directory) program simply outputs the name of the current
    directory. You may be wondering why you need this most Linux distributions account
    with the current directory in the prompt. There are two reasons. First, not all
    prompts include the current directory, and you may even want to get rid of it
    in your own prompt because it takes up a lot of space. Second, the symbolic links
    you’ll learn about in Section 2.17.2 can sometimes obscure the true full path
    of the current directory. You’ll use `pwd -P` to eliminate this confusion.


    ### diff

    To see the differences between two text files, use `diff`:


    ```

    $ diff file1 file2

    ```

    Several options can control the format of the output, and the default output format
    is often the most comprehensible for human beings. However, most programmers prefer
    the output from `diff` when they need to send the output to automated tools make
    it better.


    ### find

    If you have a file and are unsure of its format, using the `find` command to find
    it:


    ```

    $ find .

    ```

    You may be surprised how much `find` command does. It’s frustrating when you know
    a certain file is in a directory but just don’t know where. Run `find` by name:


    ```

    $ find . -name file

    ```

    Like most programs `find` is capable fancy stuff. However, don’t try options such
    as `-name` and `-print` before you know the form shown here. The `find` command
    accepts pattern such as `*`, but you must enclose them in single quotes (`*''`)
    to protect the pattern from the shell’s own globbing feature (Recall from Section
    2.4 that the shell expands globs before running commands). Most systems also have
    `locate` for finding files. Rather than searching for a file in time, `locate`
    searches an index that the system builds. Searching with `locate` is much faster
    than `find`, but if you’re looking for newer than the index, `locate` won’t find
    it.


    ### head and tail

    To quickly view a portion of a file or stream of data, use the `head` and `tail`
    commands. For example, `head /etc/passwd` shows the first 10 lines of the password
    file, and `tail /etc/passwd` shows the last 10 lines. To change the number of
    lines to display, use the `-n` option, where `n` is the number of lines you want
    to see (for example, `head -5 /etc/passwd`). To print lines starting at line n,
    use `tail +n`.


    ### sort

    The `sort` command sorts the lines of a text file in alphanumeric order. If the
    file’s lines start with numbers and you want to sort in numerical order, use the
    `-n` option. The `-r` option reverses the order of the sort.


    ### Changing Password and Shell

    Use the `passwd` command to change your password. You’ll be asked for your old
    password and then prompted for your new password twice. Choose a password that
    does not include real words in any language and don’t try to combine words. One
    of the easiest ways to create a good password is to pick a sentence, produce an
    acronym from it, and then modify the acronym with a number or punctuation. Then
    all you need to do is remember the sentence. You can change your shell with the
    `chsh` command (to an alternative shell as `ksh` or `tcsh`), but keep in mind
    that this book assumes that you’re running bash.


    ### Dot Files

    Change to your home directory, take a look around with `ls`, and then run `ls
    -a`. Do you see the difference in the output? When you run `ls` without the `-a`,
    you won’t see configuration files called dot files. These are files and directories
    whose names begin with a dot (.). Common dot files are `.bashrc` and `.login`,
    and there are dot directories, too, such as `.ssh`. There is nothing special about
    dot files or directories. Some programs don’t show them by default so that you
