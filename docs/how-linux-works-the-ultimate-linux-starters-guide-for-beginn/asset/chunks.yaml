- fmt: "\n`.bash_profile`, `.bash_login`, and `.profile` files, running only the first\
    \ one that it sees.\n\nAs strange as it sounds, it’s possible to run a non-interactive\
    \ shell as a login shell to force it to run startup files. To do so, start the\
    \ shell with the `-l` or `--login` option.\n\n## Non-Login Shells\n\nA non-login\
    \ shell is an additional shell that you run after you log in. It’s simply any\
    \ interactive shell that’s not a login shell. Windowing system terminal programs\
    \ (xterm, GNOME Terminal, and so on) start non-login shells unless you specifically\
    \ ask for a login shell.\n\nUpon starting as a non-login shell, bash runs `/etc/bash.bashrc`\
    \ and then runs the user’s `.bashrc`.\n\n## The Consequences of Two\n\n### Kinds\
    \ of Shells\n\nThe reasoning behind the two different startup systems is that\
    \ in the old days, users logged in through a traditional terminal with a login\
    \ shell, then started non-login subshells with windowing systems or the screen\
    \ program.\n\nFor the non-login subshells, it was deemed a waste to repeatedly\
    \ set the user environment and run a bunch of programs that had already been run.\n\
    \nWith login shells, you could run fancy startup commands in a file such as `.bash_profile`,\
    \ leaving only aliases and other “lightweight” things to your `.bashrc`.\n\nNowadays,\
    \ most desktop users log in through a graphical display manager. Most of these\
    \ start with one non-interactive login shell in order to preserve the login versus\
    \ non-login model described above. When they do not, you need to set up your entire\
    \ environment (path, manual path, and so on) in your `.bashrc`, or you’ll never\
    \ see any of your environment in your terminal window shells.\n\nHowever, you\
    \ also need a `.bash_profile` if you ever want to log in on the console or remotely\
    \ because login shells don’t ever `.bashrc`.\n\n### Example .bashrc\n\nIn order\
    \ to satisfy both non-login and login shells, how would you create a `.bashrc`\
    \ that can be used as `.bash_profile`? Here’s one (yet sufficient) example:\n\n\
    ```bash\n# Command path.\nPATH=/usr/local/bin:/usr/bin:/bin:$HOME:$PATH\n\n# PS1\
    \ is the regular prompt.\n# Substitutions include:\n# user hostname current directory\n\
    # ! shell number\nPS1='\\u@\\h\\$ '\n\n# EDITOR and VISUAL determine what programs\
    \ such as less and mail use when asked to edit file.\n# PAGER is the default text\
    \ viewer for programs such as man.\n# These are some helpful options for less:\n\
    # (F=quit, R=redraw, X=don't use screen)\n# You must export environment variables.\n\
    export EDITOR VISUAL PAGER\n\n# Default, give other users read-only files.\numask\
    \ 022\n```\n\n### Checking for Login and Interactive Shells\n\nWith a `.bashrc`\
    \ matching your `.bash_profile`, you don’t normally run extra commands for login\
    \ shells. However, if you want to define different actions for both:\n\n```bash\n\
    case $- in\n*i*) # interactive commands go\n    command --snip\n    ;;\n*) # non-interactive\
    \ commands go\n    command --snip\n    ;;\nesac\n```\n\n## The tcsh Shell\n\n\
    The standard shell on virtually all Linux systems is tcsh, an enhanced C shell\
    \ that popularized features such as command-line editing and multidimensional\
    \ filename and command completion. Even if you don’t use tcsh as the default user\
    \ shell (we suggest using bash), you should still provide tcsh startup files in\
    \ case your users happen to come across it.\n\nYou don’t have to worry about the\
    \ difference between login shells and non-login shells in tcsh. Upon startup,\
    \ tcsh looks for a `.tcshrc` file. Failing this, it looks for the csh shell’s\
    \ `.cshrc` startup file. The reason for this order is that you can use the `.tcshrc`\
    \ file for tcsh extensions that don’t work in csh.\n\nYou should probably stick\
    \ to using the traditional `.bashrc` instead of `.tcshrc`; it’s highly unlikely\
    \ that anyone will ever use your startup files with csh. And if a user actually\
    \ does come across csh on some other system, your `.cshrc` will work.\n\n### Example\
    \ .cshrc\n\n```csh\n# Command path.\nset PATH=/usr/local/bin:/usr/bin:/bin:$PATH\n\
    \n# EDITOR and VISUAL determine what programs such as less and mail use when asked\
    \ to edit file.\nset EDITOR\nset VISUAL\n\n# PAGER is the default text viewer\
    \ for programs such as man.\n# These are some helpful options for less:\n# (F=quit,\
    \ R=redraw, X=don't use screen)\nset PAGER=less\n\numask 022\n```\n\n## Default\
    \ User Settings\n\nThe best way to write startup files and choose defaults for\
    \ new users is with a test user. Create the test user with an empty directory\
    \ and copy your own startup files to the test directory. Write the new files from\
    \ scratch.\n\nWhen you think you have a working setup, log in as the test user\
    \ in all ways (on the console, remotely, and so on). Make sure you test as many\
    \ things as possible, including windowing system operation and menus. When you’re\
    \ happy with the test user, create a second test user. If everything works, you\
    \ now have a new set of startup files that you can distribute to users.\n\n###\
    \ Shell Defaults\n\nThe default shell for any new user on a Linux system should\
    \ be bash because:\n- Users use the shell to write shell scripts (for example,\
    \ csh is a notoriously bad scripting tool—don’t even think about it).\n- bash\
    \ is standard on Linux systems.\n- bash uses readline, and therefore its interface\
    \ is identical to that of many other tools.\n- bash gives you fine, easy-to-understand\
    \ control over I/O redirection and file handles.\n\nHowever, many seasoned wizards\
    \ use shells such as csh and tcsh simply because they can’t bear to switch. Of\
    \ course, you can choose any shell you like, but choose bash if you don’t have\
    \ any preference, and use bash as the default shell for any new user on the system.\
    \ (A user can change his or her shell with the `chsh` command to suit individual\
    \ preferences.) There are plenty of other shells there (rc, ksh, zsh, es, and\
    \ so on). Some are not appropriate as beginner shells, but zsh and fish are sometimes\
    \ popular with new users looking for an alternative shell.\n\n### Editor\n\nOn\
    \ a traditional system, the default editor should be vi or emacs. These are the\
    \ only editors guaranteed to exist on nearly any system, which means they’ll cause\
    \ the least trouble in the long run for a new user.\n\nHowever, Linux distributions\
    \ often configure nano to be the default editor, because it’s easier for beginners\
    \ to use. As with shell startup files, avoid large default editor startup files.\
    \ A little set in the .xrrc startup file never hurts anyone but steer clear of\
    \ anything that significantly changes the editor’s behavior or appearance.\n\n\
    ### Pager\n\nIt’s perfectly reasonable to set the default `PAGER` environment\
    \ variable to `less`.\n\n### Startup File Pitfalls\n\n- Don’t put any kind of\
    \ graphical command in a shell startup file.\n"
