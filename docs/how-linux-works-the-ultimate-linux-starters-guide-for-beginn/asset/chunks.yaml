- fmt: "\nyou use the `-` option. In addition, shell globs don’t match dot files unless\
    \ you explicitly use a pattern such as `.*`.\n\nNOTE You can run into problems\
    \ with globs because `.*` matches `.` and `..` (the current and parent directories).\
    \ You may wish to use a pattern such as `.[^.]*` or `.??*` to get all dot files\
    \ except the current and parent directories.\n\n# Environment and Shell\n\n##\
    \ Variables\nThe shell can store temporary variables, called shell variables,\
    \ containing the 65 values of text strings. Shell variables are very useful for\
    \ keeping track of values in scripts and some shell variables control the way\
    \ the shell behaves. (For example, the `bash` shell reads the `PS1` variable before\
    \ displaying the prompt.)\n\nTo assign a value to a shell variable, use the equal\
    \ sign (`=`). Here’s a simple example:\n\n```\n$ STUFF=blah\n```\n\nThe preceding\
    \ example sets the value of the variable named `STUFF` to `blah`. To assess this\
    \ variable, use `$STUFF` (for example, try running `echo $STUFF`).\n\nAn environment\
    \ variable is like a shell variable, but it’s not specific to the shell. All processes\
    \ on Unix systems have environment variable storage. The main difference between\
    \ environment and shell variables is that the operating system passes all of your\
    \ shell’s environment variables to programs that the shell runs, whereas shell\
    \ variables cannot be accessed in the commands that you run.\n\nAssign an environment\
    \ variable with the shell’s `export` command. For example, if you’d like to make\
    \ the `$STUFF` shell variable into an environment variable, use the following:\n\
    \n```\n$ STUFF=blah\n$ export STUFF\n```\n\nEnvironment variables are useful because\
    \ many programs read them for configuration and options. For example, you can\
    \ put your favorite less command-line options in the `LESS` environment variable,\
    \ and `less` will use those options when you run it. (Many manual pages contain\
    \ a section marked ENVIRONMENT that describes these variables.)\n\n## The Command\
    \ Path\n`PATH` is a special environment variable that contains the command path\
    \ (or path for short). A command path is a list of system directories that the\
    \ shell searches when trying to locate a command. For example, when you run `ls`,\
    \ the shell searches the directories listed in `PATH` for the `ls` program. If\
    \ programs with the same name appear in several directories in the path, the shell\
    \ runs the first matching program.\n\nIf you run `echo $PATH`, you’ll see that\
    \ the path components are separated by colons (`:`). For example:\n\n```\n$ echo\
    \ $PATH\n/usr/local/bin:/usr/bin:/bin\n```\n\nTo tell the shell to look in more\
    \ places for programs, change the `PATH` environment variable. For example, by\
    \ using this command, you can add a directory `dir` to the beginning of the path\
    \ so that the shell looks in `dir` before looking in any of the other `PATH` directories.\n\
    \n```\n$ PATH=dir:$PATH\n```\n\nOr you can append a directory name to the end\
    \ of the `PATH` variable, causing the shell to look in `dir` last:\n\n```\n$ PATH=$PATH:dir\n\
    ```\n\nNOTE Be careful when modifying the path because you can accidentally wipe\
    \ out your entire path if you mistype `$PATH`. If this happens, don’t panic! The\
    \ damage isn’t permanent; you can just start a new shell. (For a lasting effect,\
    \ you need to misture when editing a certain configuration file, and even then\
    \ it isn’t difficult.) One of the easiest ways to return to normal is to close\
    \ the terminal window and start another.\n\n## Command-Line Editing\nAs you play\
    \ with the shell, notice that you can edit the command line using left and right\
    \ arrows, as well as through previous commands using up and down arrows. This\
    \ is standard on most Linux systems. However, it’s a good idea to forget about\
    \ the arrow keys and use control keys. If you learn them, you’ll find you’re better\
    \ able to enter text in programs that use these standard keystrokes:\n\n- `ctrl-B`:\
    \ Move the cursor left\n- `ctrl-F`: Move the cursor right\n- `ctrl-P`: View the\
    \ previous command (or move cursor up)\n- `ctrl-N`: View the next command (or\
    \ move cursor down)\n- `ctrl-A`: Move the cursor to the beginning\n- `ctrl-E`:\
    \ Move the cursor to the end\n- `ctrl-W`: Erase the word\n- `ctrl-U`: Erase from\
    \ cursor to beginning\n- `ctrl-K`: Erase from cursor to end\n- `ctrl-Y`: Paste\
    \ erased text (for example, from `ctrl-U`)\n\n## Text Editors\nSpeaking of editing,\
    \ it’s time to learn an editor. To get started with Unix, you must be able to\
    \ edit files without damaging them. Most of systems use configuration files (like\
    \ `/etc`). It’s not difficult to edit files, but you will often need a powerful\
    \ tool for the job. You should try to learn one of two standard text editors,\
    \ `vi` and `emacs`. Most Unix wizards are picky about their choice but don’t list\
    \ them. Just choose for yourself.\n\nIf you choose one that matches the way you\
    \ work, you’ll find it easier to learn. Basically the choice comes down to:\n\n\
    - If you want an editor that can do almost anything and don’t mind doing extra\
    \ typing to get these features, try `emacs`.\n- If speed is everything, give it\
    \ a shot; it “plays” a bit like a video game. You might be tempted with a friendly\
    \ editor when you first start, such as `nano` or one of myriad GUI editors there,\
    \ but if you tend to make a habit of the first thing you use, you don’t want to\
    \ go down this route.\n\nNOTE: Editing is where you’ll first see a difference\
    \ between the terminal and the GUI. Editors such as `vi` run inside the terminal\
    \ window, using the standard terminal I/O interface. GUI start start their window\
    \ and present their own interface, independent of terminals. `emacs` runs in a\
    \ GUI by default but will run in a terminal window as well.\n\n# USER ENVIRONMENT\n\
    \n Guidelines for Creating Startup Files\nWhen designing startup files, keep the\
    \ user in mind. If you’re the only user on a machine, you don’t have much to worry\
    \ about errors only affect you and they’re easy to fix. However, if you’re creating\
    \ startup files meant to be the defaults for all new users on a machine or network,\
    \ or if you think that someone might copy your files for use on a different machine,\
    \ your task becomes considerably more difficult. If you make an error in a startup\
    \ file for 10 users, you might end up fixing this error 10 times. Keep two essential\
    \ goals in mind when creating startup files for other users:\n\n- Simplicity:\
    \ Keep the number of startup files small, and keep the files as small and simple\
    \ as possible so they are easy to modify. Each item is one more thing that can\
    \ break.\n- Readability: Use extensive comments in files so users get a good picture\
    \ of what each part of a file does.\n\n## When to Alter Startup Files\nBefore\
    \ making a change to a startup file, ask yourself whether you should making that\
    \ change. Here are some good reasons for changing files:\n\n- You want to change\
    \ the default prompt.\n- You need to accommodate some locally installed software.\
    \ (Consider using scripts first, though.)\n- Your existing startup files are broken.\n\
    \n## Shell Startup File Elements\nWhat goes into a shell startup file? Some things\
    \ might seem obvious, such as the path and a prompt setting. But what exactly\
    \ should be in the path, and what much is too much to put in a startup file? The\
    \ next few sections discuss the\n"
