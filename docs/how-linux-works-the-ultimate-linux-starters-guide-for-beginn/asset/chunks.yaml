    - Don’t set the `DISPLAY` environment variable in a shell startup file.

    - Don’t set the terminal type in a shell startup file.

    - Don’t skimp on descriptive comments in default startup files.

    - Don’t run commands in a startup file that print to the standard output.

    - Never set `LD_LIBRARY_PATH` in a shell startup file (see Section 15.1.4).


    ## Further Startup Topics


    Because this book deals only with the underlying Linux system, we won’t cover
    windowing environment startup files. This is a large issue indeed, because the
    display manager that logs you in to a modern Linux system has its own set of startup
    files, such as `.xsession`, `.xinit`, and the endless combinations of GNOME-and
    KDE-related items.


    The windowing choices may seem bewildering, and there is no common way to start
    a windowing environment in Linux. The next chapter describes some of the many
    possibilities. However, when you determine what your system does, you may get
    a little carried away with the files that relate to your graphical environment.
    That’s fine, but don’t carry it over to new users. The same tenet of keeping things
    simple in shell startup files works for GUI startup files, too. In fact, you probably
    don’t need to change your GUI startup files at all.


    ## HOW TO MAKE THE SWITCH


    ### FROM WINDOWS TO LINUX


    Microsoft is finally ending support for Windows 7 in January, meaning you won''t
    get bug fixes or security updates anymore. If you''re one of the final Windows
    7 holdouts and don''t want to get stuck with an unsafe system, you have a choice
    to make: upgrade to Windows 10 or switch to something entirely.


    If you don''t like the direction Microsoft has taken with Windows 10, we understand.
    It''s gotten better (and you can make it feel more like Windows 7 with a few tweaks),
    but its new approach to Windows as a Service means there will always be more of
    a focus on embedded advertisements, constant updates, and data collection. If
    you''ve been thinking about making the jump to Linux, now is the time.


    #### Choose Your Distribution


    Unlike Windows and macOS, there isn''t just one version of Linux. Instead, Linux
    is packaged into many different distributions, or "distros," each with their own
    interface and set of features. One uses a Mac-like interface with a dock and an
    "app store," while others use a more minimal interface and installing apps from
    the command line. Exploring the bevy of Linux distributions there is a fun part,
    but for your first installation, you will likely want something popular and beginner-friendly,
    so it''s easy to get help when you need it. That’s why I recommend starting with
    Linux Mint.


    ![](index-1)


    There are a lot of distributions that mimic Windows in functionality, like Zorin
    OS, but are small and you won''t have a big community to learn your way around.
    Ubuntu, on the other hand, is arguably the most popular distribution for desktops
    but it isn''t very Windows-like these days. Linux Mint is a perfect in-between:
    it''s designed for beginners, offers a familiar environment, and it''s based on
    Ubuntu so you can use the Ubuntu/Mint community when you need help. You''re free
    to check out other distros, but I''ll be using Mint for the purposes of this guide,
    and I recommend you too. It''s not my favorite distro, but it''s great for new
    Windows migrants, and it''s easier to explore others once you''ve downloaded the
    basics on a beginner-friendly system.


    #### Create Your Installation Drive


    Head to Mint''s download page and choose the 64-bit "Cinnamon" version. Cinnamon
    is the desktop environment I recommend for former Windows users, though MATE is
    also pretty Windows-like, even though it''s a bit less modern. XFCE is ideal for
    old or low-powered PCs, thanks to its light resource usage. Mint''s download page
    provides a number of links depending on where you live. If you use BitTorrent,
    I recommend grabbing the torrent file, which will download much faster.


    The installer will come as an ISO or disk image file. To install it on your system,
    you''ll need to burn it to a DVD (by right-clicking it and choosing Burn Disk
    Image in Windows 7) or USB flash drive. We''re going to do the latter a a tool
    called ` Rufus`. Install `Rufus`, open it up, and insert a flash drive that''s
    2GB or larger. (If you have a fast USB 3.0 drive, all the better.) You should
    see it appear in the Device drop-down at the top of `Rufus''` main window.


    Next, click the Select button next to Disk image, and choose the Linux ISO you
    just downloaded. Press Start, and if prompted to download new versions of Linux,
    click Yes. Note that this will erase your drive, so make sure there isn''t anything
    on it before. When it''s finished, you''ll see a message and your flash drive
    will be named LINUX MINT. Back up your data, reboot your computer and install.


    #### Install Linux on Your PC


    As your computer reboots, you should see a message telling you to press a key
    to access the Boot Menu (something like F12). If not, you''ll see a key to enter
    setup (often Del). Press one of those keys and look for the option to boot from
    the inserted USB. If you enter the full setup menu, it''ll be in Boot settings
    and you''ll have to exit the menu to reboot again when you''re done.


    ![](index-32)


    You will then be greeted by GRUB, Linux Mint''s boot menu, where you can choose
    to boot into Linux Mint. If you run into any errors, you may need to Google around
    for a fix. I had to enable the `nomodeset` option for my graphics card, for example.
    Others may have to tweak or disable Secure Boot in the BIOS.


    This installer is what we call a Live CD, where you can actually poke around and
    use the Linux Mint desktop before installing it. This will give you a chance to
    see if this particular distro appeals to you without touching your system drive.
    Once you''re satisfied, double-click the Install Linux Mint icon and go through
    the wizard. Be sure to check the box next to Install third-party software, since
    it contains useful drivers and codecs you almost want.


    From here, you have a few options. You can wipe your hard drive entirely, erasing
    all traces of Windows and using Linux as your operating system. (Make double sure
    you''ve backed up your data before doing this.) Alternatively, you can divide
    your drive up into partitions and dual boot Linux alongside Windows. This will
    allow you to reboot into one or the other whenever you want. Keep in mind that
    Windows 7 will be left insecure, so you don''t want to spend too much time there.
    If nothing else, it''s comforting to know you have that safety net during the
    transition before you remove Windows entirely.


    Choose the relevant option from the Installation Type, and click Install Now.
    The process may take a little while, but when it''s finished, you''ll see a message
    and your flash drive will be named LINUX MINT. Back up your data, reboot your
    computer and install.


    ## Get Acquainted With Linux


    ### Install Some Apps


    When you reboot, you''ll be dropped into the Linux Mint desktop—only this time,
    it''s installed on your PC. The basics are pretty familiar: click the button in
    the lower-left corner to see applications, manage windows from the bottom taskbar,
    and so on. There are, however, a few things in Linux that work differently than
    in Windows, with apps being the biggest.

