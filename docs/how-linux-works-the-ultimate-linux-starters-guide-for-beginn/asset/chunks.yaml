  trans: '


    例如，`b?` 可以匹配 `boat` 和 `brat`。如果你不想让 shell 在命令中展开通配符（glob），请将通配符括在单引号（''''``中。例如，命令
    `echo *` 会打印出一个星号。你会发现这对于下一节描述的某些命令（如 `grep` 和 `find`）非常有用。


    注意：务必记住，shell 在运行命令之前执行展开，且仅在此之后执行。


    因此，如果通配符在未经展开的情况下传递给命令，shell 将不再对其做任何额外处理；将由命令本身来决定它想做什么。


    现代 shell 的模式匹配能力还有更多内容，但你现在需要掌握的是 `*` 和 `?`。


    ## 中级命令


    以下章节描述了最核心的中级 Unix 命令。


    ### grep

    `grep` 命令打印来自文件或输入流的匹配表达式的行。例如，要打印 `/etc/passwd` 文件中包含 `root` 文本的行，请输入：


    ```bash

    $ grep root /etc/passwd

    ```

    在同时处理多个文件时，`grep` 命令非常有用，因为它在打印匹配行的同时还会打印文件名。例如，如果你想检查 `/etc` 中每一个一个包含 `root`
    单词的文件，可以使用此命令：


    ```bash

    $ grep root /etc/*

    ```

    两个最重要的 `grep` 选项是 `-i`（用于不区分大小写的匹配）和 `-v`（反向搜索，即打印所有不匹配的行）。此外还有一个更强大的变体称为 `egrep`（它只是
    `grep -E` 的同义词）。


    `grep` 理解被称为正则表达式的模式，这些模式基于计算机科学理论，并且在 Unix 工具中非常常见。正则表达式比通配符风格的模式更强大，并且它们有不同的语法。关于正则表达式有两点重要的内容需要记住：


    * `.*` 匹配任意数量的字符（类似于通配符中的 `*`）。

    * `.` 匹配任意一个字符。


    注意，`grep` 手册详细说明了正则表达式，但读起来可能困难。要学习更多知识，你可以阅读 *Mastering Regular Expressions*
    第 3 版（O''Reilly, 2006），或者 *Programming Perl* 第 4 版（O’Reilly, 2012）中的正则表达式章节。如果你喜欢数学并对正则表达式感兴趣，可以查找
    *Introduction to Automata, Languages and Computation* 第 3 版（Pearson, 2006）。


    ### less

    当文件很大或命令输出很长并滚出顶部时，`less` 命令非常有用。要翻页像 `/usr/share/words` 这样的大文件，请使用 `less /usr/share/words`。运行
    `less` 时，你将一次查看文件内容。按空格键向后移动，按 `b` 键向上滚动。输入 `q` 退出。


    注意：`less` 命令是一个名为 `more` 的旧程序的增强版本。大多数 Linux 桌面系统都带有 `less`，但在嵌入式系统和其他系统中并不是标准配置。如果你遇到无法使用
    `less` 的情况，请尝试 `more`。你可以在 `less` 内部搜索文本。例如，要向前搜索一个单词，输入 `/word`；向后搜索则使用 `?word`。当你找到匹配项时，按
    `n` 继续搜索。


    正如你将在第 2.4 节中学到的，你可以将任何程序的标准输出发送到另一个程序的标准输入。当你有一个具有大量输出需要筛选的命令，并想使用类似 `less` 的工具查看输出时，这一点特别有用。这里是将
    `grep` 命令的输出发送给 `less` 的示例：


    ```bash

    $ grep /usr/share/words | less

    ```

    尝试运行这个命令。你可能会经常这样使用 `less`。


    ### pwd

    `pwd`（打印工作目录）程序简单地输出当前目录的名字。你可能会奇怪为什么需要这个，因为大多数 Linux 发行版在提示符中包含当前目录。有两个原因：第一，并不是所有的提示符都包含当前目录，你可能甚至想在自己的提示符中去掉它，因为它占用了大量空间。第二，你在第
    2.17.2 节中将学习符号链接有时会模糊当前目录的真实完整路径。你可以使用 `pwd -P` 来消除这种困惑。


    ### diff

    要查看两个文本文件之间的差异，请使用 `diff`：


    ```bash

    $ diff file1 file2

    ```

    多个选项可以控制输出格式，默认输出格式通常对人类来说是最易理解的。然而，当程序员需要将输出发送给自动化工具以进行处理时，他们更倾向于使用 `diff` 的输出。


    ### find

    如果你有一个文件且不确定它的格式，可以使用 `find` 命令来查找它：


    ```bash

    $ find .

    ```

    你可能会惊讶于 `find` 命令能做多少事情。当你知道某个文件在目录中但不知道在哪里时，按名称查找 `find`：


    ```bash

    $ find . -name file

    ```

    像 `find` 这样的命令功能很多。它接受 `-name` 和 `-print` 等选项，但必须使用单引号（`*''`）来保护通配符（回顾第 2.4 节，shell
    在运行命令前会展开通配符）。大多数系统还有 `locate` 用于查找文件。使用 `locate` 搜索比 `find` 快得多，但如果你查找比索引更新的文件，`locate`
    就找不到它。


    ### head and tail

    要快速查看文件或数据流的一部分，使用 `head` 和 `tail` 命令。例如，`head /etc/passwd` 显示密码文件的前 10 行，而 `tail
    /etc/passwd` 显示最后 10 行。要更改显示的行数，使用 `-n` 选项，其中 `n` 是你想要看到的行数（例如 `head -5 /etc/passwd`）。要从第
    n 行开始打印，使用 `tail +n`。


    ### sort

    `sort` 命令按字母顺序对文件行排序。如果文件的行以数字开头且你想按数字顺序排序，使用 `-n` 选项。`-r` 选项反转排序顺序。


    ### Changing Password and Shell

    使用 `passwd` 命令更改密码。系统会要求输入旧密码，然后提示输入两次新密码。选择一个不包含任何语言真实单词的密码，不要尝试组合单词。创建密码最简单的方法之一是选取一个句子，产生缩写，然后用数字或标点符号修改缩写。这样你只需要记住句子即可。你可以使用
    `chsh` 命令更改 shell（改为 `ksh` 或 `tcsh`），但请记住本书假设你运行 bash。


    ### Dot Files

    进入你的主目录，使用 `ls` 查看，然后运行 `ls -a`。你看到输出的差异了吗？当你不带 `-a` 运行 `ls` 时，看不到被称为点文件的配置文件。这些是以点（.）开头的文件和目录。常见的点文件有
    `.bashrc` 和 `.login`，也有点目录，例如 `.ssh`。点文件或目录并没有特别之处。某些程序默认不显示它们，这样当你列出主目录内容时就不会看到一团乱。。


