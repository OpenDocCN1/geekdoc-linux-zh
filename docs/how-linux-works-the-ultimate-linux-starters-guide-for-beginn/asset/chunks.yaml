    ### 引言

    在深入 GNU/Linux 系统世界之前，了解它们是如何产生的以及你在接触和使用它们时遇到的一些术语是非常重要的。我将从三大巨头：UNIX、Linux 和
    GNU 的简史开始说。


    UNIX 是一种专有的、基于命令行的操作系统，最初由 Dennis Ritchie 和 Ken Thompson（等人）于 20 世纪 60 年代后期和 70
    年代初在 AT&T 的贝尔实验室开发。UNIX 几乎完全用 `C` 语言编写（同样由 Ritchie 发明），最初的设计目的是为程序员和研究人员提供一个可移植且方便的操作系统。由于涉及
    AT&T、贝尔实验室和联邦政府的长久而复杂的法律历史，UNIX 和类 UNIX 操作系统日益流行，汤普森具有影响力的模块化、极简软件设计哲学也随之流行。


    我们每天使用的现代操作系统（如 Windows 和 macOS）是由许多不同（且非常有技术性）组件组成的，包括帮助软件与硬件通信的内核，以及你在屏幕上看到的图形用户界面（GUI）元素。尝试思考一下，移动鼠标如何转化为光标在屏幕上的移动，或者文件是如何存储在你的固态硬盘上的。


    当你理解执行这些任务的所有部分时，看似简单的任务其实是很复杂的。Windows 和 macOS 设计使得用户不需要理解背后的原理。换句话说，GUI 是功能性的。


    现在让我们转向 Linux 发行版。发行版（distro 的缩写）最好被认为是组成 Linux 的组件包。考虑像 Fedora、ElementOS、Manjaro、Ubuntu
    等发行版。


    一个典型的 Linux 发行版包含 Linux 内核；GNU 工具和库；用于显示窗口的窗口系统；以及桌面环境。一些常见的桌面环境有 GNU 的 GNOME、KDE
    的 Plasma、MATE 和 XFCE。不同口味的发行版使用不同的环境——更华丽或更精简，更或更像 Windows——但操作系统的核心组件是相同的。


    软件公司或组织通常会将所有部分打包并创建一个 `ISO` 文件（技术上讲，是安装光盘 或 DVD 的压缩镜像），用户可以将其下载并安装在计算机上。


