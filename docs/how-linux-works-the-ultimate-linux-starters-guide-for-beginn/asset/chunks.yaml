    ### INTRODUCTION

    Before diving into the world of GNU/Linux systems, it''s important to understand
    how they came about and some of the terms you may encounter while reaching and
    using them. I''ll start with a brief history of the big three: UNIX, Linux and
    GNU.


    UNIX is a proprietary, command-line based operating system originally developed
    by Dennis Ritchie and Ken Thompson (among others) at AT&T''s Bell Labs in the
    late 1960s and early 1970s. UNIX is coded almost entirely in the `C` programming
    language (also invented by Ritchie) and was originally intended to be used as
    a portable and convenient OS for programmers and researchers. As a result of a
    long and complicated legal history involving AT&T, Bell Labs, and the federal
    government, UNIX and UNIX-like operating systems grew in popularity, as did Thompson''s
    influential philosophy of a modular, minimalist approach to software design.


    The modern operating systems we use every day, such as Windows and macOS, are
    made of many, different (and very technical) components, including kernels that
    help software communicate with hardware and the graphical user interface (GUI)
    elements you see on screen. Try thinking about, for example, how moving the mouse
    translates to the cursor moving across the screen or how a file is stored on your
    solid-state drive.


    Seemingly simple tasks are actually complex when you understand all the parts
    perform them. Windows and macOS are designed so users don''t need to understand
    what''s behind. In other words, the GUI is functional.


    Now, let''s move to Linux distros. A distribution (short for distro) is best thought
    of as a package of components that make up Linux. Consider distros like Fedora,
    ElementOS, Manjaro, Ubuntu.


    A typical Linux distribution includes the Linux kernel; GNU tools and libraries;
    a windowing system for displaying windows; and a desktop environment. Some common
    desktop environments are GNU''s GNOME, KDE''s Plasma, MATE, and XFCE. Different
    flavors of distros use different environments—fancier or leaner, more or less
    like Windows—but the core components of the OS are the same.


    A software firm or organization typically packages all these parts and creates
    an `ISO` file (technically, the compressed image of an installation CD-ROM or
    DVD), which users can download and install on their computers.


