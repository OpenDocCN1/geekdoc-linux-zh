    `name@host:path$`，在 Fedora 上，它是 `name@host:path$`。如果你熟悉 Windows，shell 窗口看起来会像
    DOS 命令提示符；OS X 中的 Terminal（终端）应用程序本质上与 Linux shell 窗口相同。


    本书包含了许多你将在 shell 提示符下输入的命令。


    它们都以单个 `$` 符号开头，用来表示 shell 提示符。例如，输入以下命令（仅输入加粗部分，不要包含 `$` ）并按回车：


    ```

    $ echo Hello there.

    ```


    注意：书中的许多 shell 命令以 `#` 开头。你应当以超级用户（`root`）身份运行这些命令。这些命令通常需要格外小心。


    现在输入此命令：


    ```bash

    $ cat /etc/passwd

    ```


    此命令显示 `/etc/passwd` 系统信息文件的内容，然后返回你的 shell 提示符。现在不用担心这个文件的作用；你稍后将在第 7 章中学习关于它的所有知识。


    ## cat 命令


    `cat` 命令是最容易理解的 Unix 命令之一；它简单地输出一个或多个文件的内容。`cat` 命令的一般语法如下：


    ```bash

    $ cat file1 file2 ...

    ```


    当你运行此命令时，`cat` 会打印 `file1`、`file2` 以及你指定的任何其他文件（用 `...` 表示）的内容，然后退出。该命令之所以被称为
    `cat`，是因为它在打印多个文件的内容时执行了连接（concatenation）操作。


    ### 标准输入与标准输出我们将使用 `cat` 来简要探索 Unix 的输入和输出（I/O）。Unix 进程使用 I/O 流来读写数据。进程从输入流读取数据并将数据写入输出流。流是非常灵活的。


    例如，输入流的源可以是文件、设备、终端甚至是另一个进程的输出流。要查看输入流的工作情况，输入 `cat`（不带文件名）并按回车。这次你不会收回 shell
    提示符，因为 `cat` 仍在运行。现在在每行的末尾输入任何内容并按回车。`cat` 命令会重复你输入的任何行。当你感到无聊时，在空行上按 `Ctrl-D`
    终止 `cat` 并返回 shell 提示符。


    `cat` 采用交互式行为的原因与流有关。因为你没有指定输入文件名，`cat` 从 Linux 内核提供的标准输入流读取，而不是连接到文件的流。在这种情况下，标准输入连接到你运行
    `cat` 的终端。


    注意：在空行上按 `Ctrl-D` 会停止来自终端的当前标准输入（通常会终止程序）。不要将其与 `Ctrl-C` 混淆，后者无论输入输出如何都会终止程序。


    标准输出也是类似的。内核为每个进程提供一个标准输出流，可以在其中写入输出。`cat` 命令始终将其输出写入标准输出。当你在终端中运行 `cat` 时，标准输出连接到该终端，因此你在那里看到了输出。输入和输出通常缩为
    `stdin` 和 `stdout`。许多命令的操作方式与 `cat` 相同；如果不指定输入文件，命令将从 `stdin` 读取。输出略有不同。某些命令（如
    `cat`）只将输出发送到 `stdout`，但另一些可以直接可以将输出发送到文件。第三种标准 I/O 流称为 `stderr`。你将在第 2 节看到它。


    流的特性之一是你可以轻松地操作它们，以读写终端以外的内容，正如你将在 2 节中学到的那样。


    ## 基本命令


    现在让我们一些 Unix 命令。以下大部分程序都接受参数，并具有更改列表显示的选项。这是一份基本命令的简化列表；你目前不需要了解所有细节。


    ### ls 命令


    `ls` 命令列出目录内容。默认是当前目录。使用 `-l` 进行详细列表，使用 `-F` 显示文件信息。


    ### 目录导航


    Unix 拥有分级目录结构，从 `/` 开始，称为根目录。父目录是 `/`，而不是反斜杠。根目录下有几个子目录，如 `/home`。当你引用文件或目录时，请指定路径名。当路径以
    `/` 开头时（例如 `/lib`），它是完整路径（或绝对路径）。路径分量后跟两个点（`..`）表示父目录。例如，如果你在 `/lib` 中工作，该路径将指向
    `/`。一个点（`.`）引用当前目录；例如，如果你在 `/lib`，路径仍然是 `/lib`，而 `./X` 就是 `/lib/X`。你不需要经常使用 `.`，因为大多数命令默认指向当前目录。不以
    `/` 开头的路径被称为相对路径。大多数时候，你会使用相对名称工作，因为你已经处于所需的目录中了。


    现在你已经对基本目录有了初步了解，这里是一些方向性命令。


    ### cd


    当前工作目录是进程（如 shell）所在的目录。`cd` 命令更改 shell 的工作目录：


    ```bash

    $ cd dir

    ```


    如果你省略了 `dir`，shell 将返回你的家目录，即你首次登录时所在的目录。


    ### mkdir


    `mkdir` 命令创建一个新目录 `dir`：


    ```bash

    $ mkdir dir

    ```


    ### rmdir


    `rmdir` 命令删除目录 `dir`：


    ```bash

    $ rmdir dir

    ```


    如果 `dir` 不为空，此命令将失败。然而，如果你等不及，你可能想先删除 `dir` 内部的所有文件和子目录。你可以使用 `rm -rf dir` 删除目录及其内容，但要小心！这是少数引起严重损害的命令之一，特别是当你以超级用户运行时。`-r`
    选项指定递归删除，`-f` 强制。在使用通配符（如星号 `*`）使用 `-rf` 标志时务必小心。而且，在运行命令之前务必双重检查。


    ### Shell 通配（通配符）


    Shell 可以根据简单模式匹配文件和目录名，这一过程被称为通配（globbing）。这与其他系统的通配符类似。通配符是 `*`，它告诉 shell 匹配任意数量的字符。例如，以下命令列出当前目录下的文件：


    ```bash

    $ echo *

    ```


    shell 匹配包含通配符的参数，用文件名替换这些参数，然后运行修改后的行。这种替换被称为扩展，因为 shell 替换了所有匹配的文件。以下是使用 `*`
    的某些方法：


    - at* 扩展为所有以 `at` 开头的文件名

    - *at 扩展为所有以 `at` 结尾的文件名

    - *at* 扩展为所有包含 `at` 的文件名


    如果没有匹配通配符，shell 不执行扩展，命令将带有字面运行。例如，尝试命令 `echo *dfkdsaf`。


    注意：如果你习惯了 MS-DOS，可能会输入 `*.*` 来匹配所有文件。现在打破这种习惯。在 Linux 和其他版本的 Unix 中，你必须使用 `*`
    来匹配所有文件。在 Unix shell 中，`*.*` 只匹配名称中包含点（`.`）的文件和目录。Unix 文件名不需要扩展名，通常也不携带扩展名。


    另一个 shell 通配符问号（`?`）指示 shell 匹配好一个任意字符。


