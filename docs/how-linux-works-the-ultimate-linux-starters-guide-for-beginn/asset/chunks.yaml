    平台系统同样复杂，但我将对它们的核心组件提供一个类似的简化版概述。macOS 的核心是一个名为 Darwin 的类 UNIX 操作系统，它构建在一个名为 `XNU`（X
    不是 UNIX）的类 UNIX 混合内核之上。Aqua 和 Finder GUI 元素只是组成整个 macOS 系统的某些额外组件。Chrome OS 则基于
    Chromium OS 和 Linux 内核。


    Windows 10 是 Windows NT 家族的一员，使用混合内核和 Windows Shell。顺带提一下，微软继续为其 Windows 的 Linux
    子系统（WSL）开发功能，该系统已为 Windows 10 添加了完整的 Linux 内核。


    我必须指出，运行 GNU/Linux 系统与运行 macOS 或 Windows 不同，特别是对于普通用户而言。简单的任务并不总是能如你预期的那样运行。例如，即使你使用发行版的内置应用商店，安装程序也不总是一帆风顺的，因为那里可能没有各种程序的最新版本。对于此类任务，你至少需要学习终端或命令行界面的基础知识。


    扫描仪、多功能打印机和其他外围设备也面临挑战，因为驱动程序的安装并不容易排查故障。请准备好花费大量时间重新学习如何以新方式完成基础任务，并在散布于网络各处的论坛搜索解决方案。如果你很容易对技术感到沮丧，那么
    GNU/Linux 系统可能不是你的最佳选择。


    根结底，开源操作系统是否是你的正确选择，取决于你如何使用电脑。如果你是一名程序员，你可能更倾向于稳定、精简的设计。如果你家里有一台闲置或旧 PC，一个轻量级的
    GNU/Linux 发行版可能会让它焕发新生。


    你可能考虑使用 GNU/Linux 发行版的主要原因之一是，许多版本在技术上是免费的，尽管你应该为你维护你所选发行版的社区尽一份绵之力。虽然在购买 PC 时通常不需要考虑操作系统的价格，但如果你自己组装台式机，这可能是一个考虑因素。你可以购买
    Windows 10 家庭版许可，但这至少要花费 139 美元。除非你为 Apple 硬件付费，否则你无法获得 macOS。


    对用户来说，另一个诱人胜的因素是开源 GNU/Linux 系统的可定制性和灵活性。正如前所述，发行版支持不同的桌面环境，每种环境都可以提供一种新颖的界面。另一个吸引点是长期支持。许多发行版维护者多年如一，如果你不想更新，他们就不会要求你更新。这有助于维护并确保减少崩溃。从
    Windows 迁移到 Linux 的动力已经足够。


    你可能也会喜欢指导 GNU/Linux 项目的一些术语。你会听到诸如 `Libre`（言论自由自由）、`FOSS`（自由且开源）以及 `FLOSS`（自由/自由
    且开源）。GNU 对软件内部的这些提供了更深入的解释。


    然而，对于技术知识有限且不希望被意外的复杂问题困扰的学生和家庭用户来说，绝对想要一台能让生活更简单的电脑。对于这些用户，Windows 和 macOS 更加熟悉，因此更加直观，解决大多数问题不需要使用命令提示符（Command
    Prompt）或终端（Terminal）。


    不过，并非一无所有。你仍然可以使用流行的浏览器，如 Chrome、Firefox 和 Tor 浏览器（微软也将把新的 Edge 引入 Linux）；如 Signal
    和 Slack 等通信工具；如 VPN 和密码管理器等安全软件；以及如 VLC Player 等多媒体基础软件。提到 VPN，Linux 内核现在支持 `WireGuard`
    VPN 协议。Linux 的防毒病毒软件并不常见，但一些选项包括 ClamAV 和 Sophos。


    Steam 可适用于基于 Debian 的 GNU/Linux OS，尽管如果你愿意确保你的操作系统符合安装要求，在其他发行版上你可能成功。或者，你可以使用
    Valve 的以游戏为中心的 SteamOS 发行版，它本身也是基于 Debian。请注意，越来越多的游戏（包括 AAA 大作）要么原生支持 GNU/Linux，要么通过
    Steam 的 `Proton` 工具获得支持。Valve 甚至宣布其最新的 VR 游戏《Half-Life: Aly》将为 Linux 平台完整发布。


    目前暴雪的 Battle.Net、Epic 商店和 EA 的 Origin 还没有 GNU/Linux 系统的原生版本，但你可能可以通过 Steam 的 `Proton`
    工具或 `Wine` 模拟器启动你喜欢的游戏以及非 Steam 游戏。


    # 为什么要用 Unix 命令？这本书不应该是关于 Linux 如何运行的吗？当然是，但 Linux 本质上是一个 Unix 变体。你在这一章中看到的“Unix”单词会比“Linux”更多；你可以将学到的知识直接应用于
    BSD 以及其他 Unix 变体。我尝试避免使用许多 Linux 特有的界面，不仅是为了让你在使用其他系统时有更好的背景，还因为它们往往不稳定。如果你熟悉这些命令，将能够更轻松地适应新版本。


    ## Bourne Shell: /sh


    Shell 是 Unix 系统中最重要的部分之一。Shell 是一个运行用户输入的这类命令的程序。Shell 还充当一个小型编程环境。Unix 程序员经常将任务拆分为许多微小的命令，并使用
    Shell 来管理和将它们组合在一起。


    系统的许多重要部分都是脚本——包含一系列命令的文件。如果你以前用用过 MS-DOS，可以把脚本想象成非常强大的 `.BAT` 文件。因为它们很重要，本章专门讲解了脚本。随着你阅读此书并获得实践，你将增加关于使用
    Shell 操作命令的知识。Shell 最棒的一点之一是，如果你犯了错误，可以很容易看到你输入了什么以找出哪里出了问题，然后重试。


    有许多不同的 Unix Shell，但它们的许多功能都源自 Bourne shell (`/bin/sh`)，这是由贝尔实验室为早期 Unix 版本开发的标准
    shell。每个 Unix 系统都需要 Bourne shell 才能正常运行，正如你在整本书中看到的那样。Linux 使用了 Bourne shell 的增强版本，称为
    `bash` 或“再次 Bourne”（Bourne-again）。`bash` Shell 是大多数 Linux 发行版的默认 Shell，而在 Linux
    系统上 `/bin/sh` 通常是指向 `bash` 的链接。在运行本书中的示例时，你应该使用 `bash` Shell。


    注意：如果你将本章作为你在非系统管理员组织的 Unix 账户的指南，那么你的默认 shell 可能不是 `bash`。你可以通过 `chsh` 更改 shell，或向你的系统管理员寻求帮助。


    ### 使用 Shell


    当你安装 Linux 时，除了 root 用户之外，应该至少创建一个普通用户；这将是你的个人账户。对于本章，你应该以普通用户登录。


    ### Shell 窗口


    登录后，打开一个 Shell 窗口（通常称为终端）。从 Gnome 或 Ubuntu 的 Unity 等 GUI 执行此操作最简单的方法是打开终端应用程序，它会在新窗口中启动一个
    shell。一旦打开了 shell，它顶部应该显示一个提示符，通常以美元符号 ($) 结尾。在 Ubuntu 上，该提示符看起来应该像


    '
- fmt: '

    `name@host:path$`, and on Fedora, it’s `name@host:path$`. If you’re familiar with
    Windows, the shell window will look something like a DOS command prompt; the Terminal
    application in OS X is essentially the same as a Linux shell window.


    This book contains many commands that you will type at a shell prompt.


    They all begin with a single `$` to denote the shell prompt. For example, type
    this command (just the part in bold, not the `$`) and press enter:


    ```

    $ echo Hello there.

    ```


    NOTE: Many shell commands in this book start with `#`. You should run these as
    the super-user (`root`). These commands usually require extra caution.


    Now enter this command:


    ```bash

    $ cat /etc/passwd

    ```


    This command displays the contents of the `/etc/passwd` system information file
    and then returns your shell prompt. Don’t worry about what this file does now;
    you’ll learn all about it later, in Chapter 7.


    ## Cat Command


    The `cat` command is one of the easiest Unix commands to understand; it simply
    outputs the contents of one or more files. The general syntax of the `cat` command
    is as follows:


    ```bash

    $ cat file1 file2 ...

    ```


    When you run this command, `cat` prints the contents of `file1`, `file2`, and
    any other files that you specify (denoted by `...`), and then exits. The command
    is called `cat` because it performs concatenation when it prints the contents
    of more than one file.


    ### Standard Input and Standard Output


    We’ll use `cat` to briefly explore Unix input and output (I/O). Unix processes
    use I/O streams to read and write data. Processes read data from input streams
    and write data to output streams. Streams are very flexible.


    For example, the source of an input stream can be a file, a device, a terminal,
    or even the output stream from another process. To see an input stream at work,
    enter `cat` (with no filenames) and press enter. This time, you won’t get your
    shell prompt back because `cat` is still running. Now type anything and press
    enter at the end of each line. The `cat` command repeats any line that you type.
    Once youre sufficiently bored, press `Ctrl-D` on an empty line to terminate `cat`
    and return to the shell prompt.


    The reason `cat` adopted an interactive behavior has to do with streams. Because
    you did not specify an input filename, `cat` read from the standard input stream
    provided by the Linux kernel rather than a stream connected to a file. In this
    case, the standard input was connected to the terminal in which you ran `cat`.


    NOTE: Pressing `Ctrl-D` on an empty line stops the current standard input entry
    from the terminal (and often terminates a program). Don’t confuse this with `Ctrl-C`,
    which terminates a program regardless of its input or output.


    Standard output is similar. The kernel gives each process a standard output stream
    where it can write its output. The `cat` command always writes its output to the
    standard output. When you run `cat` in the terminal, the standard output was connected
    to that terminal, so that’s where you saw the output. input and output are often
    abbreviated as `stdin` and `stdout`. Many commands operate as `cat` does; if you
    don’t specify an input file, the command reads from `stdin`. Output is a little
    different. Some commands (like `cat`) send output only to `stdout`, but others
    have the option to send output directly to files. There is a third standard I/O
    stream called `stderr`. You’ll see it in Section 2.


    One of the best features of streams is that you can easily manipulate them to
    read and write to other than the terminal, as you’ll learn in Section 2.


    ## Basic Commands


    Now let’s look at some Unix commands. Most of the following programs take arguments
    and have options that change listing. This is a simplified list of basic commands;
    you don’t need all the details yet.


    ### ls Command


    The `ls` command lists the contents of a directory. The default is the current
    directory. Use `-l` for detailed listing and `-F` to file information.


    ### Navigating Directories


    Unix has a directory hierarchy that starts at `/`, called root directory. The
    parent directory is `/`, not backslash. There are several subdirectories in root
    directory as `/home`. When you refer to a file or directory, specify a pathname.
    When a path starts with `/` (such as `/lib`), it’s a full or absolute path. A
    path component followed by two dots (`..`) specifies the parent. For example,
    if you’re working in `/lib`, the path would refer to `/`. One dot (`.`) refers
    to the current directory; for example, if you’re in `/lib`, the path is still
    `/lib`, and `./X` is `/lib/X`. You don’t have to use `.` often because most commands
    default to the current directory. A path not beginning with `/` is called a relative
    path. Most of the time, you’ll work with relative names because you’ll already
    be in the directory you need to be.


    Now that you have a sense of basic directories, here are some directional commands.


    ### Cd


    The current working directory is the directory that a process (such as the shell)
    is in. The `cd` command changes the shell’s working directory:


    ```bash

    $ cd dir

    ```


    If you omit `dir`, the shell returns to your home directory, the directory you
    started in when first logged in.


    ### mkdir


    The `mkdir` command creates a new directory `dir`:


    ```bash

    $ mkdir dir

    ```


    ### Rmdir


    The `rmdir` command removes the directory `dir`:


    ```bash

    $ rmdir dir

    ```


    If `dir` isn’t empty, this command fails. However, if you’re impatient, you probably
    don’t want to painstakingly delete all the files and subdirectories inside `dir`
    first. You can use `rm -rf dir` to delete a directory and its contents, but be
    careful! This is one of the few commands that can do serious damage, especially
    if you run it as the superuser. The `-r` option specifies recursive delete to
    delete everything inside `dir`, and `-f` forces the delete operation. Don’t use
    the `-rf` flags with globs such as a star (`*`). And above all, always double-check
    your command before you run it.


    ### Shell Globbing (Wildcards)


    The shell can match simple patterns to file and directory names, a process known
    as globbing. This is similar to wildcards in other systems. The glob character
    is `*`, which tells the shell to match any number of characters. For example,
    the following command lists files in current directory:


    ```bash

    $ echo *

    ```


    The shell matches arguments containing globs, substitutes the filenames for those
    arguments, and then runs the revised line. This substitution is called expansion
    because the shell substitutes all matching filenames. Here are some ways to use
    `*`:


    - `at*` expands to all filenames that start with `at`.

    - `*at` expands to all filenames that end with `at`.

    - `*at*` expands to all filenames that contain `at`.


    If no files match a glob, the shell performs no expansion, and the command runs
    with literal characters as `*`. For example, try a command such as `echo *dfkdsaf`.


    NOTE: If you’re used to MS-DOS, you might instinctively type `*.*` to match all
    files. Break this habit now. In Linux and other versions of Unix, you must use
    `*` to match all files. In the Unix shell, `*.*` matches only files and directories
    that contain the dot (`.`) in their names. Unix filenames do not need extensions
    and often do not carry them.


    Another shell glob character, the question mark (`?`), instructs the shell to
    match exactly one arbitrary character.

