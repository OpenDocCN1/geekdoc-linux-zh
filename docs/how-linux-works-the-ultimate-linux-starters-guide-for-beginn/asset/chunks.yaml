    -   不要在 shell 启动文件中设置 `DISPLAY` 环境变量。

    -   不要在 shell 启动文件中设置终端类型。

    -   在默认启动文件中不要吝于描述性注释。

    -   不要在启动文件中运行会输出到标准输出的命令。

    -   永远不要在 shell 启动文件中设置 `LD_LIBRARY_PATH`（参见第 15.1.4 节）。


    ## 其他启动主题


    由于本书仅涉及底层的 Linux 系统，我们不会涵盖窗口环境的启动文件。这确实是一个大问题，因为让你登录现代 Linux 系统的显示管理器有自己的一套启动文件，例如
    `.xsession`、`.xinit` 以及无尽的 GNOME 和 KDE 相关项组合。


    窗口环境的选择可能看起来令人困惑，而且 Linux 中没有启动窗口环境的通用方法。下一章将描述许多可能性中的一些。然而，当你确定了系统的功能时，你可能会与图形环境相关的文件过度着迷。这没关系，但不要把这种习惯带给新用户。在
    shell 启动文件中保持简单的这一原则同样适用于 GUI 启动文件。事实上，你可能根本不需要更改你的 GUI 启动文件。


    ## 如何进行切换


    ### 从 Windows 切换到 Linux


    微软终于于 1 月份停止对 Windows 7 的支持，这意味着你再也无法获得错误修复或安全更新。如果你是最后一批 Windows 7 的坚守者之一，并且不想被困在一个不安全的系统中，你有一个选择要做：升级到
    Windows 10 或完全切换到其他系统。


    如果你不喜欢微软在 Windows 10 上采取的方向，我们理解。它已经变得好了一些（通过一些调整你可以让它感觉更像 Windows 7），但它对“Windows
    即服务”的新方法意味着将永远更加关注嵌入式广告、持续更新和数据收集。如果你一直在考虑跳转到 Linux，现在就是时机。


    #### 选择你的发行版


    与 Windows 和 macOS 不同，Linux 并不是只有一个版本。相反，Linux 被封装成许多不同的发行版（或“distros”），每个版本都有自己的界面和功能
    set。有的使用带有 dock 和“应用商店”的类 Mac 界面，而另一些使用更极简的界面并从命令行安装应用。探索丰富的 Linux 发行版是一个有趣的部分，但对于你的第一次安装，你可能想要一个流行且对初学者友好的版本，这样在需要时可以轻松获得帮助。这就是为什么我推荐从
    Linux Mint 开始。


    ![](img/index-1)


    有很多功能上模仿 Windows 的发行版，例如 Zorin OS，但它们规模较小，你不会有一个大型社区来帮助你熟悉。另一方面，Ubuntu 可以说是桌面端最流行的发行版，但它现在看起来并不很像
    Windows 了。Linux Mint 是一个完美的折中：它是为初学者设计的，提供了一个熟悉的环境，并且它基于 Ubuntu，所以当你需要帮助时，可以使用
    Ubuntu/Mint 社区。你可以自由查看其他发行版，但我本指南将使用 Mint，我也建议你也这样做。它不是我最喜欢的发行版，但对于新的 Windows
    迁移用户来说非常棒，而且一旦你在初学者友好的系统上下载了基础内容，探索其他版本就会更容易。


    #### 创建你的安装驱动


    前往 Mint 的下载页面并选择 64 位的“Cinnamon”版本。Cinnamon 是我向原 Windows 用户的桌面环境，虽然 MATE 也很像 Windows，尽管它稍微没那么现代。得益于其轻量资源占用，XFCE
    是旧或低配置 PC 的理想选择。Mint 的下载页面根据你所在的地区提供了多个链接。如果你使用 BitTorrent，我建议获取 torrent 文件，下载速度会快得多。


    安装程序将以 ISO 或磁盘镜像文件的形式提供。要在系统上安装它，你需要将其刻录到 DVD（在 Windows 7 中右键点击它并选择“刻录磁盘映像”）或
    USB 闪盘。我们将使用一个名为 `Rufus` 的工具完成后者。安装 `Rufus`，打开并插入一个 2GB 或更大的闪盘。（如果你有快速的 USB 3.0
    驱动器就更好。）你应该能在 `Rufus` 主窗口顶部的 Device 下拉列表中看到它。


    接下来，点击 Disk image 旁的 Select 按钮，选择你刚刚下载的 Linux ISO。按下 Start，如果提示下载新版本的 Linux，点击
    Yes。注意，这将擦除你的驱动器，因此请在之前确保里面没有任何内容。完成后，你会看到一条消息，你的闪盘将被重命名为 LINUX MINT。备份你的数据，重启电脑并安装。


    #### 在你的 PC 上安装 Linux


    当电脑重启时，你应该会看到一条消息，提示你按某个键进入启动菜单（类似于 F12）。如果没有，你会看到一个进入设置的按键（通常是 Del）。按下这些按键之一并寻找从插入的
    USB 启动的选项。如果你进入了完整的设置菜单，它将在 Boot 设置中，你需要在完成后退出菜单并再次重启。


    ![](img/index-32)


    随后你将面对 GRUB，即 Linux Mint 的启动菜单，你可以在此处选择启动进入 Linux Mint。如果你遇到任何错误，你可能需要在 Google
    上搜索解决方案。例如，我曾不得不为我的显卡启用 `nomodeset` 选项。其他人则可能需要在 BIOS 中调整或禁用 Secure Boot（安全启动）。


    这个安装程序是我们所谓的 Live CD，你可以在安装之前实际上在其中尝试并使用 Linux Mint 桌面。这将给你一个机会，在不触碰系统驱动的情况下查看此特定的发行版是否吸引你。一旦你满意了，双击
    Install Linux Mint 图标并通过向导。务必勾选 Install third-party software 旁边的框，因为它包含了你需要的有用驱动程序和解码器。


    从这里开始，你有几个选项。你可以完全抹除硬盘，删除所有 Windows 的痕迹并使用 Linux 作为你的操作系统。（在这样做之前，务必确认你已备份了数据。）或者，你可以将驱动器划分多个分区，并在
    Windows 旁双启动 Linux。这将允许你随时重启进入其中一个。请记住，Windows 7 将保持处于不安全状态，所以你不想在上面花费太多时间。至少，在完全移除
    Windows 之前的过渡期间知道你有那个安全网是令人宽慰的。


    从 Installation Type 中选择相关选项并点击 Install Now。该过程可能需要一些时间，但完成后，你会看到一条消息，你的闪盘将被重命名为
    LINUX MINT。备份你的数据，重启电脑并安装。


    ## 熟悉 Linux


    ### 安装一些应用


    当你重启后，你将进入 Linux Mint 桌面——只是这次它已安装在你的 PC 上了。基础操作非常熟悉：点击左下角的按钮查看应用程序，从底部任务栏管理窗口，等等。然而，Linux
    中有几点工作方式与 Windows 不同，其中应用是差异最大的。


