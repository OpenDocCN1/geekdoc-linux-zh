    应用商店，其中包含许多应用程序的目录。你可以通过两种方式从仓库中安装应用程序：通过图形化软件管理器（同样，它看起来像应用商店）或通过命令行。


    要打开 Linux Mint 的软件管理器，请点击左下角的菜单按钮，导航到“管理” > “软件管理器”（或者直接像在 Windows 中那样开始输入“software
    manager”）。在这里，你可以下载许多免费的开源应用程序。其中一些应用是它们在 Windows 上对应软件的 Linux 版本，例如 Steam 和 Spotify；而另一些则是是常用软件的开源替代品（Banshee
    是一个类似于 iTunes 的音乐播放器，GIMP 是一个类似于 Photoshop 的图像编辑器）。你可以在这里进行浏览，也可以使用顶部的搜索栏搜索应用程序。


    ### 如何安装和卸载应用程序


    如果你知道自己想要找什么，从命令行安装应用程序通常速度更快。虽然初开始看起来可能令人生畏，但 Linux 仍然依赖命令行来完成各种任务，因此习惯使用它可能对你是有益的。要安装一个应用程序——例如开源媒体播放器
    VLC——请打开终端窗口并运行：


    ```

    sudo apt update

    sudo apt install vlc

    ```


    让我们来分解一下：`sudo` 告诉系统以 root 权限（或者在 Windows 中可能被称为管理员权限）运行命令，`apt` 是 Linux Mint
    包管理器的名称，而 `update` 确保可用应用程序列表是最新的。


    第二个命令包含 `install vlc`，这自言易懂。在安装任何应用程序之前，你应该运行 `sudo apt update`，并将 `vlc` 替换为你任何想要安装的应用程序名称。如果你不确定仓库中对它的称呼，可以运行
    `sudo apt cache search vlc` 来查看结果。


    要卸载应用程序，只需运行：


    ```

    sudo apt remove vlc

    ```


    这将删除该应用程序，但不会删除你的配置文件，因此如果你以后决定重新安装它，你的设置将仍然存在。如果你想也删除配置文件，可以改运行：


    ```bash

    sudo apt purge vlc

    ```


    ### 如何更新应用程序


    你可能还需要定期更新这些应用程序，以获得最新版本。同样，你可以通过两种方式实现：通过图形化工具或命令行。对于图形化工具，点击右下角的盾牌图标，这将打开“更新管理器”应用。然后你可以点击“安装更新”按钮来更新你所有的软件。


    更新 Linux Mint 另一种，你可以打开终端并运行两个命令：


    ```bash

    sudo apt update

    sudo apt upgrade

    ```


    同样，`update` 命令检查软件是否有新版本，而 `upgrade` 命令实际上会升级你所有的应用程序。你需要一起运行这两个命令，就像你安装新应用程序时一样。


    这些是你现在最需要了解的关键点，但请花时间浏览一下 Mint 的界面及其设置，看看它提供了哪些功能。启动时出现的“欢迎”窗口会有很大帮助——它的“第一步”区域将向你如何选择不同的布局、安装可能需要的媒体解码器，以及为你的硬件安装必要的驱动程序。


    你会很快掌握基础操作的，但如果你遇到困难，Mint 和 Ubuntu 论坛随时为你提供帮助。只需多搜索一下，因为很有可能在你之前已经有人遇到过同样的问题。


