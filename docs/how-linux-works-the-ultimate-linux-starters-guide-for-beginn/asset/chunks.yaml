    你使用 `-` 选项。此外，shell 通配符（globs）不会匹配点文件，除非你显式地使用如 `.*` 的模式。


    注意：使用通配符可能会遇到问题，因为 `.*` 会匹配 `.` 和 `..`（当前目录和父目录）。你可能希望使用如 `.[^.]*` 或 `.??*` 的模式来获取除当前和父目录以外的所有点文件。


    # 环境与 Shell


    ## 变量

    shell 可以存储临时变量，称为 shell 变量，其中包含 65 种文本字符串值。shell 变量对于跟踪脚本中的值非常有用，某些 shell 变量还会控制
    shell 的行为。（例如，`bash` shell 在显示提示符之前会读取 `PS1` 变量。）


    要给 shell 变量赋值，请使用等号（`=`）。这是一个简单的示例：


    ```

    $ STUFF=blah

    ```


    前面的示例将名为 `STUFF` 的变量值设置为 `blah`。要评估此变量，请使用 `$STUFF`（例如，尝试运行 `echo $STUFF`）。


    环境变量类似于 shell 变量，但它并不特定于某个 shell。Unix 系统上的所有进程都有环境变量存储。环境变量和 shell 变量的主要区别在于，操作系统会将你
    shell 的所有环境变量传递给 shell 运行的程序，而 shell 变量无法在你运行的命令中被访问。


    使用 shell 的 `export` 命令分配环境变量。例如，如果你想将 `$STUFF` shell 变量变为环境变量，请使用以下命令：


    ```

    $ STUFF=blah

    $ export STUFF

    ```


    环境变量是有用的，因为许多程序会读取它们来获取配置和选项。例如，你可以将最喜欢的 `less` 命令行选项放在 `LESS` 环境变量中，当你运行 `less`
    时，它将使用这些选项。（许多帮助页都包含一个标记为 `ENVIRONMENT` 的章节，其中描述了这些变量。）


    ## 命令路径

    `PATH` 是一个特殊的环境变量，它包含命令路径（简称为路径）。命令路径是 shell 在尝试定位命令时会搜索的系统目录列表。例如，当你运行 `ls` 时，shell
    会在 `PATH` 中列出的目录中搜索 `ls` 程序。如果路径中的多个目录中都出现了同名的程序，shell 将运行第一个匹配的程序。


    如果你运行 `echo $PATH`，你会看到路径组件是用冒号 (`:`) 分隔的。例如：


    ```

    $ echo $PATH

    /usr/local/bin:/usr/bin:/bin

    ```


    要让 shell 在更多地方查找程序，请更改 `PATH` 环境变量。例如，通过此命令，你可以将目录 `dir` 添加到路径开头，这样 shell 在查找任何其他
    `PATH` 目录之前会先查找 `dir`。


    ```

    $ PATH=dir:$PATH

    ```


    或者你可以将目录名追加到 `PATH` 变量的末尾，导致 shell 最后查找 `dir`：


    ```

    $ PATH=$PATH:dir

    ```


    注意：修改路径时要小心，因为如果你误写了 `$PATH`，可能会意外删掉你的整个路径。如果发生这种情况，不要慌慌！损坏不是永久的；你只需要启动一个新的 shell
    即可。（若要产生持久影响，你需要在编辑特定的配置文件时弄错，即使如此这也不难。）恢复正常状态的最简单方法之一是关闭终端窗口并启动另一个。


    ## 命令行编辑

    在你操作 shell 时，请注意你可以使用左右箭头键编辑命令行，还可以通过向上和向下箭头使用之前的命令。这在大多数 Linux 系统上都是标准配置。然而，忘记箭头键并使用控制键是一个好主意。如果你学会了它们，你会发现自己在使用这些标准按键的程序中更好地输入文本：


    - `ctrl-B`: 光标向左移动

    - `ctrl-F`: 光标向右移动

    - `ctrl-P`: 查看上一个命令（或光标向上移动）

    - `ctrl-N`: 查看下一个命令（或光标向下移动）

    - `ctrl-A`: 光标移动到开头

    - `ctrl-E`: 光标移动到末尾

    - `ctrl-W`: 删除单词

    - `ctrl-U`: 删除光标到开头的内容

    - `ctrl-K`: 删除光标到末尾的内容

    - `ctrl-Y`: 粘贴被删除的文本（例如，来自 `ctrl-U`）


    ## 编辑器

    说到编辑，是时候学习一种编辑器了。要开始使用 Unix，你必须能够在不损坏文件的情况下编辑文件。大多数系统使用配置文件（如 `/etc`）。编辑文件并不困难，但你通常需要一个强大的工具来完成工作。你应该尝试学习两种文本编辑器之一：`vi`
    和 `emacs`。大多数 Unix 高手对他们的选择非常挑剔，但不会列出来。自己选一个。


    如果你选择了一个符合你工作方式的编辑器，你会发现更容易学习。基本上选择取决于：


    - 如果你想要一个几乎可以做任何事情的编辑器，并且不在意通过额外输入来获得这些功能，请尝试 `emacs`。

    - 如果速度就是一切，尝试一下吧；它玩起来有点像视频游戏。在刚开始时，你可能会被友好的编辑器所吸引，例如 `nano` 或那里无数 GUI 编辑器之一，但如果你倾向于养成使用第一个工具的习惯，那么你不想走这条路。


    注意：编辑将是你首次看到终端和 GUI 差异的地方。像 `vi` 这样的编辑器在终端窗口内部，使用标准的终端 I/O 接口。GUI 启动自己的窗口并呈现自己的界面，独立于终端。`emacs`
    默认在 GUI 中运行，也可以在终端窗口中运行。


    # 用户环境


    ## 创建启动文件的指南

    在设计启动文件时，要考虑到用户。如果你是机器上唯一的用户，你不需要太担心错误，因为错误只会影响你，而且很容易修复。然而，如果你创建的启动文件旨在作为机器或网络上所有新用户的默认设置，或者你认为可能有人拷贝你的文件并在不同的机器上使用，那么你的任务就会变得相当困难。如果你在一个为
    10 个用户的启动文件中犯了错误，你最终可能需要修复 10 次这个错误。为其他用户创建启动文件时，请记住两个核心目标：


    - 简单性：保持启动文件的数量尽可能少，并保持文件尽可能小且简单，以便于修改。每一项都是多一个可能出错的地方。

    - 可读性：在文件中使用大量的注释，让用户能够很好地了解文件中每个部分的作用。


    ## 何时需要修改启动文件

    在更改启动文件之前，请问问自己是否应该进行该更改。以下是一些更改文件的良好理由：


    - 你想更改默认提示符。

    - 你需要适应本地安装的软件。（尽管如此，先考虑使用脚本。）

    - 你的启动文件损坏了。


    ## Shell 启动文件元素

    Shell 启动文件中应该包含什么？某些内容似乎显而易见，例如路径和提示符设置。但路径中到底应该包含什么，启动文件中放多少内容才合适？接下来的几节将讨论


