    Platforms are just as complex, but I''ll present a similarly simplified overview
    of their core components. The core of macOS is a UNIX-like OS called Darwin built
    on a UNIX-like hybrid kernel called `XNU` (X is not UNIX). The Aqua and Finder
    GUI elements are just some of the additional components that comprise the full
    macOS system. Chrome OS is based on Chromium OS and the Linux kernel.


    Windows 10 is a member of the Windows NT family and uses a hybrid kernel and the
    Windows Shell. On a side note, Microsoft continues to build out functionality
    for its Windows Subsystem for Linux (WSL), which added the full Linux kernel to
    Windows 10.


    I would be remiss not to state that running a GNU/Linux system is not like running
    macOS or Windows, especially for regular users. Simple tasks don''t always work
    as you expect. For instance, installing programs is not always straightforward
    even if you use a distro''s built-in app store, which might not have the latest
    versions of various programs. For such tasks, you need to be willing to at least
    learn the basics of the terminal or typed command-line interface.


    Scanners, multifunction printers, and other peripherals present challenges, too,
    as driver installations are not as easy to troubleshoot. Be prepared to spend
    a lot of time relearning how to do basic tasks in new ways and to search for solutions
    in various forums scattered across the web. If you get frustrated easily with
    technology, GNU/Linux systems are not the best fit.


    Ultimately, whether an open-source OS is the correct choice for you depends on
    how you use your computer. If you''re a programmer, you may prefer a stable, stripped-back
    design. If you have a spare or older PC lying around house a lightweight GNU/Linux
    distro might give it new life.


    One major reason you might consider using a GNU/Linux distro is that many are
    technically free, although you should certainly contribute what you can to the
    community that maintains your distro of choice. Although the price of the operating
    system isn''t something you typically consider when buying a PC, it might be a
    factor if you are building your own desktop. You can buy a Windows 10 Home license,
    but that will run you at least $139. You can''t even get macOS unless you pay
    for Apple hardware.


    Another temptation for users is the customizability and flexibility of open-source
    GNU/Linux systems. As stated, distros support different desktop environments,
    each of which can offer a fresh interface. Still another draw is long-term support.
    Many distro maintainers for years and don''t require you to update if you don''t
    want. This helps maintain and ensures fewer crashes. The move from Windows to
    Linux is strong enough for.


    You may also appreciate one of the terms that guide GNU/Linux projects. You''ll
    hear such terms as `Libre` (free as speech); `FOSS` (Free and Open Source); and
    `FLOSS` (Free/Libre and Open Source). GNU offers a more in-depth explanation of
    things within the software.


    However, for students and home users with little technical expertise don''t want
    to be bothered with unforeseen complications, there''s absolutely wanting a computer
    that makes your life easier. For these users, Windows and macOS are much more
    familiar and thus more intuitive, and troubleshooting most problems can be done
    without needing Command Prompt or Terminal.


    It''s not all lost, though. You can still get popular browsers such as Chrome,
    Firefox, and the Tor Browser (Microsoft is bringing the new Edge to Linux, too);
    communication tools such as Signal and Slack; security software such as VPNs and
    password managers; and multimedia essentials such as VLC Player. Speaking of VPNs,
    the Linux kernel now supports the `WireGuard` VPN protocol. AV software for Linux
    is not common, but some options include ClamAV and Sophos.


    Steam is available for Debian-based GNU/Linux OSes, though you may have luck with
    other distros if you are willing to ensure your OS meets the installation requirements.
    Alternatively, you can use Valve''s gaming-centric SteamOS distro, which itself
    is based on Debian. Note that a growing number of games, including AAA titles,
    support GNU/Linux either natively or with help from Steam''s `Proton` tool. Valve
    even announced that its latest VR game, Half-Life: Aly will get a full release
    for Linux platforms.


    There are still no native versions of Blizzard''s Battle.Net, Epic''s Game Store,
    and EA''s Origin for GNU/Linux systems, but you may be able to get your favorite
    game launching and non-Steam games with Steam''s `Proton` tool or emulator as
    `Wine`.


    # Why Unix commands? Isn''t this book about how Linux works? It is, of course,
    but Linux is a Unix flavor at heart. You''ll see the word Unix in this chapter
    more than Linux; you can take what you learn straight to BSD, and other Unix flavors.
    I''ve tried to avoid many Linux-specific interfaces, not only to give you a better
    background using the other systems but also they tend unstable. You''ll be able
    to adapt to new releases much easily if you know the commands.


    ## The Bourne Shell: /sh


    The shell is one of the most important parts of a Unix system. A shell is a program
    that runs commands like the ones users enter. The shell also serves as a small
    programming environment. Unix programmers often break tasks into little commands
    and use the shell to manage and piece things together.


    Many important parts of the system are scripts—files that contain a sequence of
    commands. If you''ve worked with MS-DOS previously, you can think of scripts as
    very powerful `.BAT` files. Because they are important, Chapter is dedicated to
    scripts. As you progress through this book and gain practice, you''ll add to your
    knowledge of manipulating commands using the shell. One of the best things about
    the shell is that if you make a mistake, you can easily see what you typed to
    find out what went wrong, and then try again.


    There are many different Unix shells, but all derive several of their features
    from the Bourne shell (`/bin/sh`), a standard shell developed at Bell Labs for
    early versions of Unix. Every Unix system needs the Bourne shell in order to function
    correctly, as you will see throughout this book. Linux uses an enhanced version
    of the Bourne shell called `bash` or the “Bourne-again” shell. The `bash` shell
    is the default shell on most Linux distributions, and `/bin/sh` is normally a
    link to `bash` on a Linux system. You should use the `bash` shell when running
    the examples in this book.


    NOTE: You may not have `bash` as your default shell if you''re using this chapter
    as a guide for a Unix account at an organization where you''re not the system
    administrator. You can change your shell with `chsh` or ask your system administrator
    for help.


    ### Using the Shell


    When you install Linux, you should create at least one regular user in addition
    to the root user; this will be your personal account. For this chapter, you should
    log in the regular user.


    ### The Shell Window


    After logging in, open a shell window (often referred to as a terminal). The easiest
    way to do so from a GUI like Gnome or Ubuntu''s Unity is to open a terminal application,
    which starts a shell inside a new window. Once you''ve opened a shell, it should
    display a prompt at the top that usually ends with a dollar sign ($). On Ubuntu,
    that prompt should look like

