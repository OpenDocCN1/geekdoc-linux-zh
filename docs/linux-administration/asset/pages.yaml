  md: '# Apache Server < 131


    encrypted. You also learn how digital certificates fit into the security picture,
    and how to create a self-signed certificate.


    +   For detail information about SSL and certificate creation, refer to the following
    links:

    SSL Certificates HOWTO (http://www.qldp.org/HOWTO/SSL-Certificates-HOWTO/index.html)

    OpenSSL Web site(http://www.openssl.org/)


    To create a secure Web server you need SSL and server certificates to work together.
    SSL uses keys pair to encrypt and decrypt the data. One key is public which is
    accessible to everyone and the other key is accessible only by you and authorized
    person. The public key is part of the certificate, and is used to verify how certificate
    is used to send and receive data from the server.


    Public key provides a secure communication as data encrypted with the public key
    can be decrypted by the private key, which you know. So anyone can send data encrypted
    with the public key only you can decrypt it because you only know the private
    key. Similarly data encrypted with your private key can be decrypted by the public
    key.


    Digital certificate is a form of electronic credentials for the Internet, which
    is issued by a third party to create the identity of the ID holder. The third
    party issues certificates is known as a Certification Authority (CA). Digital
    certificate technology is based on the theory of public key cryptography. According
    to, every entity has two keys, a public key and private key, which function only
    when they are placed together. When a CA issues Digital IDs, it verifies that
    the owner is not claiming a false identity.\Digital certificates work on two principles:


    +   Encryption: SSL encrypts the communication between a Web server and a Web
    client to ensure that the transmitted data is not altered during exchange.

    Trust: Digital certificates provide a certain level of trust that the identities
    behind a Web server and a Web client are genuine. CA issues Digital IDs to verify
    that the owner is not operating through a false identity.


    A certificate contains the following information about the certificate owner:


    +   The owner''s email address

    The owner''s name

    How the certificate is used

    How long the certificates are valid

    The URL of the Web site for which the certificate is issued

    A message digest to confirm that the certificate has been altered since it was
    issued


    +   It also contains the certificate ID of the person or entity that issued the
    certificate and the certified information in the certificate


    To view the list of root certificates of several recognized CAs, perform the following
    steps.


    Start the Mozilla Firefox browser and Click the Tools from the menu option. Select
    the options from the list appears on clicking Tools menu. An option window appears;
    Select the Advanced tab from the top menu. Then select the Encryption option from
    the menu. Click on the View Certificates to view the list of root certificates.
    A Certificate Manger window appears showing the list of certificates under the
    Authorities tab, as shown in Figure- 5-4:'
