    After learning TCP/IP networking in the previous section, let''s discuss network
    file system.


    # 2.3 The Network File System


    Networking services provide sharing files via a network file system (NFS).In Linux,
    NFS is supported by the kernel. NFS was developed by Sun Micros during the 1990s.
    NFS as a protocol that allows communications between different computing environments.
    It is a mechanism for storing files on a network. It is a distributed file system
    that allows users to treat the remotely accessed file as if they were local; it
    allows to access files on remote hosts in the same way as access local files.
    It allows you to access files and directories that are located on another system
    or even in a different city or different country using standard Linux commands.


    Using this method the administrator provides a central server. The file locking
    on a central server is completely transparent to the client. This file locking
    and needed files not to get corrupted by other users. NFS is based on client-server
    relationship. The computers that make their resources or file systems available
    for remote access are called servers. Servers contain several daemons that make
    these files visible and to be shared by client. In act of making file systems
    available is called exporting (configured on the server over /etc/exports file).


    The computers that use server resources are considered clients. The NFS counts
    the exported file system local, in the same way as files are mounted. This is
    known as NFS mount. Using the client/server format, the server allows the clients
    to easily access the NFS files.


    The NFS provides a seamless network that enables the client to have the appearance
    that the sub file system belongs to the client. For example, users can use operating
    system commands to create, read, write, and set file attributes for remote files
    and directories. NFS makes information sharing extremely simple, as file on one
    machine to another computer are shared over network and does not require any modifications
    to programs.


    Let''s learn different versions of NFS.


    # Versions of NFS


    The NFS protocol has experienced advancements and revisions. The initial NFS server
    implementations only support UDP packets, while the later versions support TCP
    connections; there are pros and cons for using both protocols.


    +   NFS version 2 (NFSv2) is older and widely supported. It is operated entirely
    over user datagram protocol (UDP). NFSv2 only allowed the first 2 GB of a file
    to be read.


    +   NFS version 3 (NFSv3) has more features, including 64bit file handles, handle
    files larger than 2 gigabytes (GB), safe asynchronous writes on the server and
    more robust error handling.


    +   NFS version 4 (NFSv4) works through firewalls and on the Internet, no longer
    requires portmapper, utilizes ACLs, and utilizes stateful operations.'
