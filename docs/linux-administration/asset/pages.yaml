- img_proc: true
  md: "206 LAB\n\n| Table- 3 showing the common ICMP (Ping) Match Criteria |\n| Match\
    \ | Description |\n| --icmp-type <type> | The most commonly used types are echo-reply\
    \ and echo-request |n\n\nExample:\n\n```\niptables -A OUTPUT -p icmp --icmp-type\
    \ echo-request -j ACCEPT\niptables -A INPUT -p icmp --icmp-type echo-reply -j\
    \ ACCEPT\n```\n\niptables being configured to allow the firewall to send ICMP\
    \ echo-requests (pings) and to turn, accept the expected ICMP echo-replies.\n\n\
    Example\n\n```\niptables -A INPUT -p icmp --icmp-type echo-request \\\n-m limit\
    \ --limit 1/s -i eth0 -j ACCEPT\n```\n\nThe limit feature in iptables specifies\
    \ the maximum number of matches to allow per second. You can specify time intervals\
    \ in the format /second,/minute /hour /day, or you can use abbreviations so that\
    \ 3/second is the same as 3/s.\n\nIn this case, ICMP echo requests are restricted\
    \ to no more than one per second. When tuned correctly, this feature allows you\
    \ to filter unusually volumes of traffic that characterize denial of service (DOS)\
    \ attacks and Internet storms.\nSome of the common extended match criteria are\
    \ given in Table-4:\n\n| Table-4: Showing the common extended Match Criteria |\n\
    | Switch | Description |\n| -m multiport -sports <port,port> | A variety of TCP/UDP\
    \ source ports separated by commas. Unlike when -m isn't used, they do not have\
    \ to be within a range. |\n -m multiport -dports <port,port> | A variety of TCP/UDP\
    \ destination ports separated by commas, unlike when -m isn't used, they do not\
    \ have to be within a range. |\n -m multiport -ports <port,port> | A variety of\
    \ TCP/UDP ports separated by commas. Source and destination ports are assumed\
    \ to be the same and do not have to be within a range. |\n -m -state <state> |\
    \ The most frequently tested states are: ESTABLISHED, NEW, RELATED, and INVALID\
    \ |\n\nAn example on the previous example:\n\n```\niptables -A FORWARD -s 0/0\
    \ -i eth0 -d 192.168.1.58 -p TCP \\\n--port 1024:65535 -m multiport --dports 80,443\
    \ -j ACCEPT\n```\n\n```\niptables -A FORWARD -d 0/0 -i eth0 -s 192.168.1.58 -i\
    \ eth1 -p TCP \\\n-m state --state ESTABLISHED -j ACCEPT\n```"
  merge: -1
