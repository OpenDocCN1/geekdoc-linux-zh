  md: '# # Introduction


    The book on Linux Administration endorses our continued commitment toward delivering
    quality books based on intensive research on the requirements of our readers.
    The book is the result of rich implementation of instructional acumen and technical
    precision of the authors and editors at Kogent Learning Solutions Inc. and Dreamtech
    Press. It promises you to offer affluent services to students and professionals
    associated with computer science. This book further extends our philosophy to
    provide comprehensive and easily understandable reference material on concepts
    related to Linux administration. The book is written considering the diverse scholars
    of computer science, and it assures an exceptional learning experience by presenting
    relevant, appropriate, and real-life examples. We have designed this book to grow
    with you providing the reference material you need as you move toward computing
    proficiency.


    The Linux operating system is based on UNIX operating system. It is freely distributable
    and an open source software. It is a robust, reliable operating system that can
    run on a variety of hardware. Linux administration is a crucial task to achieve
    maximum benefits from the operating system. You can consider Linux administration
    as a combination of administering the system file, network configurations, system
    configurations, Internet and network services, Mail and FTP services, Apache Web
    server and maintenance of the Linux system.


    # ## About This Book


    This book on Linux Administration extends the approach of providing comprehensive
    reference material on the Linux administration techniques. It helps you to learn
    about the formalized approach used for Linux administration, maintenance and optimization.
    In this book you learn about installing, configuring, maintaining and optimizing
    the Linux operating system and its services.


    This book mainly covers:


    +   - Introduction to Linux

    - System and Network configurations in Linux

    - Introduction to Microsoft Networks and Network services

    - Apache Web server

    - Optimizing Internet services


    # ## How to Use This Book


    In this book, figures, tables and Labs have been provided in each chapter to simplify
    the learning off the concepts. This book contains 6 chapters to explain the concept
    and features of the Linux administration techniques.'
