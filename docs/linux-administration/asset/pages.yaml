  md: '# Managing the init Scripts


    init process is responsible for starting system processes. When the init command
    starts, it becomes the root of all of the processes that start up automatically
    on the system. You can boot your Linux system to run different runlevels (discussed
    in previous chapter). The system behavior will differ in different runlevels.
    The system boots into the default runlevel set in /etc/initabab. Usually Linux
    starts in multiuser mode i.e. run level 3 with networking on.


    The init program starts all of the background processes by looking in the appropriate
    rc directory for the runlevel specified as default in init configuration. If you
    want to configure services that are started at boot time, you need to edit the
    RC scripts of the specified runlevel.


    In RC directories, all the listed files start with either S or K. The files starting
    with K are the processes that are killed on that level and the files starting
    with S are the processes that are started on that level. The S scripts depend
    upon the first alphabet of their name filenames. Scripts that do not start with
    a capital S do not run at startup. Therefore, the services with a small S keep
    them from starting at boot time without deleting them.


    When the system starts up at the default level, it runs the scripts in the rc/rc3
    directory. In the following Figure 2, you can see a directory listing of the rc/3
    directory. Services with capital S start in the numeric order. When the system
    shuts down, services with K or kill scripts run down the services from the rc
    directory. In every S has a corresponding K script to kill the service at shutdown.
    A directory listing of the rc/3 directory is shown in Figure 2:


    | K1initscripts | K1memys | S1initreserve | S800mail |

