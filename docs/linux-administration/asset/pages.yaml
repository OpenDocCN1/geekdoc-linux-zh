    Let''s discuss about mail queue.


    # Mail Queue


    When an email message is not delivered immediately, it remains in one of the MTA''s
    outgoing

    mail queues. There can be many reasons behind this. Whatever the reason, users
    can continue to

    compose email with their MUAs. When they send the message, sendmail puts the

    message into the mail queue and try to resent it after a set duration. You can
    find out these

    intervals by checking the initialization script that starts sendmail. The /etc/sysconfig/sendmail

    file depicts this information in the line showing:


    ```

    DAEMON =yes

    QUEUE=1h

    ```


    The line beginning with QUEUE defines the retry interval to retry as one hour.
    You can set

    interval in hours (h), minutes or seconds (s).

    Let''s discuss about aliases.


    # Mail Aliases


    The feature mail aliases is used to create distribution list and making access
    to users more

    conveniently. For example, you can set an alias if you have trouble spelling someone''s
    name;

    the mail still reaches the intended recipient if you misspell the name. You can
    also alias a

    nonexistent user to a real user. The aliases file is /etc/aliases, as shown below:


    ```

    # Basic system aliases -- these MUST be present

    mailer-daemon: root

    postmaster: root

