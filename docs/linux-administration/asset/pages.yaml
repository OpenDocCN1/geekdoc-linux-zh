    - Support for the REDIRECT target


    IP forwarding enables the kernel to send or forward packets that arrive on one
    network interface to other network interface. To enable IP forwarding on the system
    that runs Squid, run the following command:


    ```

    $ sysctl -w net.ipv4.ip_forward

    ```


    The above command returns the output 0 (depicting disable) or 1 (depicting enable).
    To enable it using the following command:


    ```

    $ sysctl -w net.ipv4.ip_forward=1

