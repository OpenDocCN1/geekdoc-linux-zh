  md: '# Introduction to Linux


    environment. The GNU operating system is subject to the GNU General Public License
    (GPL), GNU project is an attempt to freely distribute the operating systems that
    can be used in any way according to the requirement and is distributed in source
    form GNU is a software collection of applications, libraries, and developer tools,
    plus a program to allocate resources and talk to the hardware.


    After learning about different operating systems, such as UNIX, Linux, and GNU
    in the previous sections, let''s next explore about Linux distributions.


    # 1.4 Exploring Linux Distribution


    Linux distributions, often called distros, are the packages built on top of Linux
    kernel and operating system. it is a collection of software applications required
    for performing a single function for either an operating system or to add additional
    capabilities. There are various distributions from which a user can choose and
    install with installation of Linux operating system according to its requirement.
    A distribution package consists of: sources to compile and installation of Linux
    operating system.


    Each distribution has three attributes that is hardware, ease of use, the size
    of software repository, which make them unique from others. Some of the commonly
    used distribution packages:


    +   Fedora: Facilitates you with graphical interface, strong corporate backing
    and configuration tools. It serves as a general-purpose distribution and is suitable
    for both server and desktop applications as this is tailored with different apps
    and functionality.


    +   Knop: Mainly designed to be as a Live CD as it facilitates quick and safe
    mode to copy files from hard drives and does not require operating systems. It
    also provides efficient compression and automatic hardware detection


    +   Mandriva: It serves both size organizations (corporate market) as well as
    medium size organizations (consumer market). It is easy and safe. It uses a RPM
    based package management with uprui and configuration tools.


    +   S: It is a friendly distribution package that is used for desktop installations.
    It provides configuration tool such as Yaast (Yet Another Setup), and is a stable
    distribution package.


    +   Debian: Is used as a base for many other distributions; it provides security.
    Debian is founded on Open-Source with repositories maintaining thousands of software
    packages ready for installation and use. Debian focus on three branches: Stable
    (latest release), unstable (branch that is in perpetual evolution), and Testing
    (next release beta).


    +   Ubuntu: Failed to a distribution package based on unstable branch of Debian
    distribution, which facilitates with best looking default desktops. It encompasses
    features like hardware compatibility and ease of installation, fast release cycle,
    up to date and various packages, fast download mirrors, great documentation, and
    a dedicated community.


    In the previous section, you learn about different Linux distributions. Let''s
    next discuss about the duties of the System Administrator in the following section.'
