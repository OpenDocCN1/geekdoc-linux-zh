    in the directory by issuing /etc/rc.d/init.d/<command> stopcommand, where <command>
    is the process to be killed. It then starts all of the S symbolic links by issuing
    /etc/rc.d/init.d/<command> start.File placed at /etc/rc.local holds local system
    boot processes. If you want to to run any of your own script, you can put the
