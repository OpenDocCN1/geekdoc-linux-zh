  md: '# # 01 Introduction to Linux


    # OBJECTIVES


    +   * Understanding UNIX

    * Exploring Linux

    * Introducing GNU

    * Exploring Linux distributions

    * Describing various responsibilities of Linux system administrator

    * Explaining the booting and shutting down process

    * Understanding the file system structure

    * Learning the working and management of file system


    UNIX, Linux, and GNU are three operating systems based on open-source. Changes
    in these source codes, according to the requirement, can be made by a user without
    the source creator''s permission.

    Based on the UNIX core, developed in the 1960s, Linux retains its modular concept,
    which makes it very stable and easily customizable. GNU was developed in 1984;
    it aimed to provide a complete Unix-compatible software system. Linux is an UNIX
    operating system created by Lin Torvalds. It is freely distributable that, is
    freely available on the Internet. This source code allows for modification by
    anyone who uses it with one condition that changes made to the original source
    code are freely redistributed over the Internet. One choice advantage of Linux
    is the fact that it is free to obtain, a Linux distribution can be installed on
    any number of computers, free of cost. Due to its performance, it is the most
    preferred alternative to commercial UNIX and Microsoft operating systems. Most
    of the World Wide Web today is built upon the Linux platform as it. Linux, and
    GNU ensures stability, security and adaptability. In this chapter, you will learn
    about UNIX and Linux based operating systems such as UNIX, Linux, and GNU.

    The chapter begins with the introduction to various operating systems such as
    UNIX, Linux, and GNU. There are discussions on Linux distributions, and various
    responsibilities of Linux system administrator. Then you explore the duties of
    file system administrator in installing and configuring servers and Application
    performance, creating and maintaining user accounts, backing up and restoring
    files, monitoring and tuning performance, configuring a secure system and various
    tools used to monitor security. With this, you study about the booting and shutting
    down of system including various supporting processes, scripts and services. Towards
    the end, you will also explore the concept of file system and learn about the
    structure, working and management of file system.

    Let''s start the chapter by first understanding UNIX in the following section.'
