    There are two types of Digital certificates, one are signed by CAs and those that
    are self-signed. Now, you learn about certificates signed by CAs in the above
    section. Now, let''s learn about self-signed certificates.


    A self-signed certificate is one that is signed using the certificate itself.
    It is used to create secure servers do not trust the larger trees provided by
    formal CA. As a rule, you do not use self-signed certificates on publicly accessible
    websites because Web browsers do not automatically accept them and also because
    they do not provide sufficient level of trust.


    Let''s learn to create a self-signed digital certificate on Fedora Core.


    Using the following commands to create a self-signed certificate (use login credentials
    of root user):


