    writes data is written to drives. Each drive is exact mirror of other drive and
    can be used if either of the drive falls.


    +   - RAID-5 uses error correction codes which facilitates drives which do not
    have built-in error detection. Nowadays RAID-2 is not in much use as all the drives
    support built-in error detection


    +   - RAID-3 does not allow multiple IO operations to run simultaneously. It stripes
    data at a level across several drives. It requires hardware support for efficient
    use. It is used in single-user environments.


    +   - RAID-4 does not support multiple simultaneous writes. It stripes data at
    a block level across several drives. The performance of a level 4 array is very
    good for reads and provides small random writes.


    +   - RAID-5 is in multi-user environments. It requires at three and more typically
    disks and provides parity among the drives. This can speed small writes in multiprocessing
    systems but performance for reads is considerably lower.


