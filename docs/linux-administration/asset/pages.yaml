  md: '# Optimizing Internet Service


    # OBJECTIVES


    +   - Optimization of Internet services

    - Learning system administration


    Fedora is commonly deployed to provide Internet services. Therefore, optimization
    of these services to achieve maximum performance is a necessity. In this chapter,
    you explore several key tips to optimize the following services: LDAP, DNS, Mail,
    FTP and Web services.


    Further you learn some administration tasks. It includes updating your Fedora
    system, upgrading and customizing Kernel. At the end you discover the techniques
    to administer Users and Group accounts. In which you learn creating, deleting
    and modifying the User and Group accounts.


    Let''s proceed with Optimizing Internet services.


    # 6.1 Optimizing Internet Services


    In this section you get to know some optimization techniques that you can apply
    to the servers and services learnt so far. Server optimization requires analysis
    to minimize the problem related to domain, diagnosis to identify the performance
    problem and methods to evaluate the effectiveness of your optimization. Anything
    that leads improve overall system performance deinitely improves services performance
    also. Let''s discuss the steps that can be taken to optimize various services.


    Let''s start with optimization of LDAP services.


    # Optimizing LDAP Services


    The /etc/openldap/slapd.conf is the main configuration file for the stand-alone
    LDAP daemon. Options like: permission, password, database type, database location
    and so on be configured in this file. Several options in this configuration file
    can be configured to give better server performance. They can be modified for
    the following performance reasons:


    +   - Cache size modification: You can increase the size of the cache using the
    cache size directive in slapd.conf.


    +   - Disk subsystem: You can replace IDE disks with SCSI disks and SCSI disks
    with Fibre Channel to improve disk performance. If you have multiple LDAP data
    stores, situate each each on its own disk.'
  merge: -1
  pgno: 152
- img_proc: true
  md: "# Chapter 6\n\n+   - File system tuning: On file system that support it, disable\
    \ updating file access and modification timestamps. This decreases the number\
    \ of file operations that have to be performed by two-thirds.\n- Indexing: With\
    \ limits, indexes increase performance but also include cost of additional memory,\
    \ disk and CPU usage. It is recommended to not index the data that you do not\
    \ often search.\n- Logging: Add the following entry to slapd.conf, if excessive\
    \ message logging is hampers the performance of your LDAP server.\n\n```\nloglevel\
    \ 0\n```\n\n+   - This entry disables logging via the system log.\n- System memory:\
    \ Adding more physical memory, increases the size of OpenLDAP's cache to use more\
    \ RAM.\n- Let's next learn optimization of DNS services.\n\n# Optimizing DNS Services\n\
    \nDNS services are optimized to reduce the latency involved in making DNS queries.\
    \ You can get a great level of performance by reducing the number of DNS queries\
    \ that have to go to a remote server, even if that is service to the subnet to\
    \ which you are connected. By maintaining a local cache of DNS information you\
    \ can enhance the performance of client programs that are requesting for the DNS\
    \ services.\n\nOn the client side, running a caching-only server is the only option\
    \ available to enhance performance. On the server side, you have a wider range\
    \ of options to improve performance. Let's discuss them.\n\nLet's start with optimizing\
    \ DNS clients.\n\n# Improving Performance of DNS Clients\n\nOn the DNS clients,\
    \ server options can be modified in the /etc/named.conf to run caching-only server.\
    \ This file is created during installation of BIND. By default, BIND allows zone\
    \ transfers to all hosts. Zone transfers are necessary only for master and slave\
    \ servers but not for DNS clients. You can disable them by adding the following\
    \ line to /etc/named.conf:\n\n```\nallow-transfer {\n   ;\n};\n```\n\nYou can\
    \ configure your caching-only server to respond to constant queries only from\
    \ the specific hosts. Add the following line to the options section in /etc/named.conf,\
    \ replacing www.xxx.yyy.zzz with your network IP number:\n\n```\nallow-query {\n\
    \   www.xxx.yyy.zzz;\n   localhost;\n};\n```"
  merge: -1
  pgno: 153
- img_proc: true
  md: 'You can configure caching-only server to respond to recursive queries only
    from the specific hosts. Add the following line to the options section in /etc/named.conf,
    replacing www.xxx.yyy.zzz with your network IP number:


    ```

    allow-recursion {

    www.xxx.yyy.zzz;

    localhost;

    }

    ```


    Typically, a caching-only server does not have direct access to the Internet,
    so it creates a cache file to hold DNS information. You can specify the IP address
    of the servers to which you want forward requests. Add the following line to the
    options section in /etc/named.conf, replacing www.xxx.yyy.zzz with your network
    IP number:


    ```

    forwarders-transfer {

    www.xxx.yyy.zzz;

    }

    ```


    Next, to improve performance of DNS servers.


    # Improving Performance of DNS Servers


    BIND allows zone transfers to all hosts which are necessary for master and slave
    servers. You can specify the IP address of your slave server by adding the following
    line to /etc/named.conf, replacing www.xxx.yyy.zzz with your IP number of your
    slave server:


    ```

    allow-transfer {

    none;

    }

    ```


    You can configure your master server to respond to constant queries only from
    the specific hosts. Add the following line to the options section in /etc/named.conf,
    replacing www.xxx.yyy.zzzwith your internal IP number:


    ```

    allow-query {

    www.xxx.yyy.zzz;

    localhost;

    }

    ```


    You can configure your slave server to respond to recursive queries only from
    the specific hosts. Add the following line to the options section in /etc/named.conf,
    replacing www.xxx.yyy.zzz with your internal IP number:


    ```

    allow-recursion {

    www.xxx.yyy.zzz;

    localhost;

    }

    ```


    Let''s discuss about logging.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# Using Logging


    You can configure your caching-only slave and master servers to automatically
    rotate /var/log/named.log file to prevent your file system from filling up with
    old information. In the /etc/logrotate.d file (created during BIND installation)
    make the following changes:


    +   - Remove the line showing:


    ```

    create 0644 named named

    ```


    +   - Change the line:


    ```

    /bin/service named reload 2> /dev/null || true

    to:

    /bin/kill -HUP ''cat /var/run/named.pid 2> /dev/null 2>'' /dev/null || true

    ```


    +   - Disable logging for LAME servers, as these servers appear to be name servers
    for a domain but are not. Use the following line:


    ```

    logging(

    category lame-servers { null; };

    );

    ```


    Let''s learn optimization of Mail services.


    # Optimizing Mail Services


    To improve the speed of your mail services, you can take one of the following
    approaches: by using multiple mail servers to spread the mail processing load
    across a number of systems and you can also replace Sendmail with another mail
    server, to retrieve speed from Sendmail and number of methods you can try to get
    better performance from Postfix.


    Let''s study tips that help you to retrieve speed from Sendmail and number of
    methods you can try to get better performance from Postfix.


    First about improving performance of Sendmail


    # Improving Performance of Sendmail


    You can configure many options in the /etc/sendmail.cf file to increase the efficiency
    of your mail server. The most common configuration with which it runs the queue.
    You can modify this by editing /etc/sysconfig/sendmail.cf, change the line that
    reads QUEUE=1h. Set this option value for example QUEUE=15m, which runs every
    15 minutes instead of every hour.


    Restart the Sendmail after modifying this file.


    Let''s discuss about improving performance of Postfix.


    # Improving Performance of Postfix


    If you have a lot of mail that just lie in the Postfix''s outbound queue, you
    may be trying to deliver mail to a site that is quite busy. You can solve this
    problem by creating a transport map entry for such site that enables multiple
    parallel connections and then give each connection to that site a shorter timeout.'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Optimizing Internet Service 147


    For instance, let''s say there are two busy sites slowsite.com and reallyslowsite.net
    in which you have trouble getting email to them in a timely manner. Create the
    following entries in the /etc/postfix/transport:


    | slowsite.com | deadbeasts: |

    | reallyslowsite.net | deadbeasts: |


    Next create corresponding entry in /etc/postfix/main.cf that increases the number
    of simultaneous connections to 50, allowing more mail to slowsite.com and reallyslowsite.net
    to be transmitted at:


    The last line increases the number of parallel connections to slowsite.com and


    | deadbeasts | unix - n | smtp |

    | -0 | smtp_timeout=-5 | smtp_helo_timeout=5 |


    The above entries in /etc/postfix/master.cf tell postfix that SMTP connections
    to sites in the deadbeasts alias timeout after 5 seconds and SMTP transaction
    must commence within 5 seconds of the HELO command, or the connection closes.

    To reduce the timeout for incoming mail, modify /etc/postfix/master.cf as follows:


    | relay | unix - n | smtp |

    | -0 | smtp_timeout=2 -o | smtp_helo_timeout=2 |


    If postfix responds too slowly to incoming SMTP connections but POP or IMAP connections
    are responding fast, then you need to run more SMTP server processes. Edit the
    smtpd entry in the main.cf file and increase the process limit. Also increase
    the default_process_limit entry in the main.cf to allow FTP services.

    Let''s discuss how to optimize FTP Services


    # Optimizing FTP Services


    As you know vsftpd is secure and extremely fast FTP server daemon. The following
    steps can be achieved to achieve more performance from this service:


    +   - If possible, disable the NIS and NISplus for passwd, shadow and group lookups
    in /etc/nwitch.conf. It avoids using unnecessary libraries into the vsftpd''s
    memory space and using NIS for lookups that can be resolved more quickly by resorting
    to file-based lookups.

    - Break large directories into smaller directories to increase performance of
    CPU.

    - Limit the simultaneous connections to the FTP server.

    - Take the advantage of vsftpd''s bandwidth throttling features to limit the network
    bandwidth consumed by any one connection or connection classes.'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# Chapter 6


    # Optimizing Web Services


    The following settings can be applied to fine-tune Apache to get efficient performance:


    +   Increase the MaxClients setting increases the maximum number of simultaneous
    client connections to the httpd server before the server starts refusing additional
    connections. You can set to 256 MaxClients. There is a rule to calculate MaxClients:


    ```

    MaxClients = (Physical RAM - 128 MB + Size of Active Pages) / (Nonshared Memory
    for httpd Process)

    ```


    +   The longer TimeOut directive, the longer the connection tied up. The Timeout
    directive controls how long the server waits until protocol messages before it
    closes a connection.


    +   TheRequestsPerChild directive controls the number of HTTP requests an httpd
    process can serve before a new child process starts.


    +   The MaxKeepAlives is used to set the upper limit on the total number of requests
    from the same connection.


    Wisely setting the values to the above directives can provide efficient performance.
    If your server is serving a lot of CGI scripts or using PHP manuals, you should
    follow these tips to optimize them:


    +   Set HostLookups to Off. If you need to resolve IP addresses to hostnames,
    you can use Apache''s logresolve program or one of the resolver programs available
    in the log reporting and analysis package.


    +   Use IP addresses instead of host name Allow from domain and Deny from domain
    directives. It avoids resolving names to IP numbers before performing the reverse
    and forward queries.


    +   It is recommended to set Options FollowSymLinks for all directories and never
    set SymLinksOwnerMatch.


    +   Use AllowOverride everywhere in the Web space Apache is serving.


    +   Turn off the MultiViews option to enhance the performance.


    +   Avoid NFS mounted file systems to store files that Apache serves until very
    necessary.


    +   Use NFS-mounted file system as it is faster than read/write mounts. This increases
    performance as well as provide security level.


    +   Apache depends on the system resource therefore using more RAM is better.
    It improves Apache''s ability to store requested pages in its cache.


    After learning the steps to optimize Internet services, let''s look some tasks
    involved in system administration.


    # System Administration


    System can be administered using different tools and commands. It includes maintaining
    the system to keep it update, installing regular updates, upgrading your system
    with the available version and also maintaining the accounts in your system. In
    the next section you discover about the steps required to administer your system.


    Let''s proceed with updating your Fedora system.'
  merge: -1
  pgno: 157
