    # Configuring Squid


    The /etc/squid/squid.conf is the configuration file on Fedora core. Squid is controlled
    by the initialization script, /etc/rc.init/d/squid. It reads default values from
    the /etc/sysconf/squid. Following are some configuration settings required to
    configure Squid, as shown in Table 1:


    | Parameter | Default value |

    |---|---|

    | cache_effective_group | squid |

    | cache_effective_user | squid |

    | httpd_acc_host | None |

    | httpd_acc_with_proxy | off |

    | httpd_acc_port | 80 |

    | httpd_acc_host_header | off |

    | httpd_access | deny all |


    In the above Table 1, cache_effective_group and cache_effective_user identify
    the group ID (GID) and the user ID (UID) respectively, which default value set
    to off controls whether Squid runs as a cache or proxy or just as proxy. value
    depicts that Squid functions only as a proxy, and on value depicts that Squid
