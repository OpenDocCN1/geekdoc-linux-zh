    Configuration files perform various functions. Some hold configurations related
    to system behavior, network connections, file sharing, programs configurations
    and some are responsible to manage the appearance of the system. The system configuration
    files are the first, a system administrator goes after installing a system to
    set it up. The network configuration files are responsible to provide configurations
    needed by TCP/IP protocols to enable communication across networks. With Network
    File System (NFS), Linux provides a centralized file sharing on network.

    The chapter begins with an introduction of system configuration files. You also
    discuss about system wide shell configurations, environmental settings, network
    configuration files and managing the left scripts. After this, you also learn
    about network Interface Card (NIC) and subnetting. With this, you study about
    working with gateways and routers, configuring dynamic host configuration protocol,
    configuring the network using the network tool and editing your network configuration.
    Towards the end, you also explore the concept of Network file system and learn
    about its installation, configuration of NFS client and NFS server, automount
    services and examining the NFS security.

