    Now learn to administer users and groups accounts.


    # Administering Users and Groups


    Administering users and groups accounts is a fundamental Linux system administration
    activity. In Fedora Core you can administer these accounts through two ways: by
    using command line tools and by User Manager interface.

    Let''s discuss both techniques.


    # Administering Users and Groups using command line tools


    You can use command line to administer users and groups. You can use the following
    command line utilities that are listed in Table 1:


    Table 1: basic commands for administration of user and group accounts

    | Commands | Description |

    |---|---|

    | usermod/groupadd | Create user/group login accounts |

    | userdel/group | Delete user/group login accounts |

    | usermod/groupmod | Modify user/group login accounts |

    | passwd/gpasswd | Set or change user/group account password |

    | chsh | Set or change a user''s default shell |

    | chage | Modify password expiration information |


    # Add a New User or a Group Account


    To add a new user to the system, type the following command:


    ```

    # useradd [options] username

    ```


    where, options are command line options as described in Table 2.

    Run the following command to assign a password:


    ```

    # passwd username

    ```


    Table 2: useradd command line options

    | Option | Description |

    |---|---|

    | -c ''comment'' | Comment can be replaced with any string. This option is generally
    used to specify the full name of a user |

    | d home_directory | Home directory to be used instead of default /home/username/
    |

    | -e date | Date for the account to be disabled in the format YYYY-MM-DD |

    | -f days | Number of days after the password expires until the account is disabled.'
