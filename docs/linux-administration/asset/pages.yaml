  md: '```

    <Directory /var/www/>

    Options indexes FollowSymLinksMultiviews +includes

    AllowOverride None

    Order allow,deny

    allow from all

    AddType text/html .shtml

    AddOutputfilter INCLUDES .shtml

    </Directory>

    ```


    The line AddType text/html .shtml adds the path of the .shtml to the text/html
    MIME type. The AddOutputfilter INCLUDES .shtml directive tells Apache that files
    with a . extension should be processed using mod_include, the module that provides
    Apache’s SSI support. The Argument to the configuration file to tell Apache regarding
    which directory content needs to be parsed for SSI content.


    For example, you create a directory /var/www/html/tests and want to enable SSI
    for this directory. Add a file named tests.conf to the path /etc/httpd/conf.d
    that contains the above <Directory> block. Replace the path as ''/var/www/html/tests''
    in the <Directory> block. Includes directive instructs Apache to parse files it
    serves for this directory for SSI directive. Now create a web page itself.shtml
    and place it in /var/www/html/tests, as follows:


    ```

    <html>

    <head>

    <title>SSI Test Page</title>

    </head>

    <body>

    <h1>SSI Test Page</h1>

    <div id="div1">

    <!-- exec cmd="ls -lh /var/www" -->

    </div>

    <div id="div2">

    <!-- content -->

    <!--#include virtual="footer.html" -->

    </div>

    </body>

    </html>

    ```


    SSI directive takes the following format:


    ```

    <!--#element attribute=value -- -->

