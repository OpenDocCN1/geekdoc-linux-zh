  md: "# LAB-9: Setting up a NFS File Server\n\nObjective:\n\n+   - To install and\
    \ configure NFS File server and NFS File client.\n\nRequirement:\n\n+   - Fedora\
    \ Linux operating system\n- NFS Server (Example: server.lab.com, IP address: 192.168.0.100)\n\
    - NFS Client (Example: client.lab.com, IP address: 192.168.0.101)\n\nPerform the\
    \ following steps to set NFS File server:\n\n# Installing NFS\n\nFedora Linux\
    \ installs nfs by default and also gets activated by default when the system boots.\
    \ Run the following command to check whether the nfs related packages are installed\
    \ or not:\n\n```\nrpm -q nfs-utils\n```\n\nIf you don't have this package installed,\
    \ you can use the following YUM command to install nfs:\n\n```\nyum install nfs-utils\n\
    ```\n\n> Install on both NFS server and NFS client using the above command.\n\n\
    By using the following chkconfig command, you can configure nfs to start at boot\
    \ time:\n\n```\nchkconfig nfs on\n```\n\n# Configuring NFS server\n\nOnce you\
    \ have installed the package, you can begin to configure the NFS server. You have\
    \ a file in the /etc directory called 'exports'. This file determines the exported\
    \ directories, who are allowed to access and what permissions they have. In this\
    \ Lab you are exporting /home directory, which is accessible only by IP of 192.168.0.101\
    \ and have read and write permission on the exported.\n\n+   1. Edit the /etc/exports\
    \ file to add the following line:\n   /home 192.168.0.101(rw,nohide)\n\n+   2.\
    \ Then start the portmap daemon. The portmap daemon MUST always be running when\
    \ a NFS server. Use the following command to start portmap daemon:\n\n```\nservice\
    \ portmap start\n```"
  merge: -1
  pgno: 201
- img_proc: true
  md: '3. Start your NFS server:


