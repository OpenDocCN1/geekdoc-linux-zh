    and initial ramdisk. it does not use compression. When used init, it can be stored
    in compressed format on the boot media and is decompressed in while loading into
    the ramdisk.


    Let''s study about devfs.


    # procfs


    It is used to access kernel information about processes and other system information
    in a hierarchical file-like structure. the proc file system provides a method
    of communication between kernel space and user space. the /proc file system, virtual
    files can be read from or written to as a means of communicating with units in
    the kernel.


    # devfs


    It is used for presenting device files. it provides a tool for checking the availability
    of devices. It keeps tracks of device drivers currently registered and also automatically
    create and remove the corresponding device nodes in /dev.


    Let''s study about sysfs.


    # sysfs


    It holds information about buses, devices, firmware, file systems, etc. it exports
    information about devices and drivers from the kernel device to user space, and
    is also used for configuration. it acts as an interface to the kernel''s internal
    data structures.


