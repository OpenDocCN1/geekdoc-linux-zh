    # scp


    Secure Copy (scp) is a part of an SSH package. the scp command allows you to copy
    files over ssh connections. It is a replacement for RCP and FTP. The scp command
    can be used in three ways:


    +   - To copy from a (remote) server to your computer, use the following syntax:


    ```

    scp file yourusername@yourserver:/home/yourusername/

    ```


    +   - To copy from your (remote) server to another (remote) server, use the following
    syntax:


    ```

    scpyourusername@yourserver:/home/yourusername/file.

    ```


    +   - To copy from a (remote) server to another (remote) server, use the following
    syntax:


    ```

    scp

    yourusername@yourserver:/home/yourusername/file

    yourusername2@yourserver2:/home/yourusername/

    ```


    In the above commands, ''file'' is the file to be transferred to the directory
    ''/home/yourusername/'' at the server ''yourserver'' with the username ''yourusername''
    and the dot at the end means the current local directory.


    Let''s learn about sftp.


    # sftp


    Secure File Transfer Program (sftp) is replacement to traditional FTP. It performs
    all the functions over SSH. The syntax for sftp is:


    ```

    sftpuser@host:file file

    ```


    Here, user is the local PC, host is the remote PC and file is the file name.


