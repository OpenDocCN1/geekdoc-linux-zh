  md: '# 180 LAB


    # Configuring the FTP Server


    When you configure the FTP server, the vsftpd configuration file is used. The
    FTP server configuration file, which is stored in the /etc directory. You need
    to edit this /etc file to configure the server using a text editor, such as vi.


    Performing the following steps to configure the FTP server:


    +   1. Type the /etc/vsftpd.conf command in the Terminal window (Figure 4).


    +   2. Press the ENTER key (Figure 5).


    The vsftpd configuration file contains:


    ![](img/5cfda308a5eba7fcc04c6aeafbe7fe3f_189_0.png)


    > Figure 4: Configuring the FTP server


    ![](img/5cfda308a5eba7fcc04c6aeafbe7fe3f_189_1.png)


    > Figure 5: vsftpd configuration file


    +   3. Press the Insert key from the keyboard to insert into the insert mode (Fig.AT-2.46).


