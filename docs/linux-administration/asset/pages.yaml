    Let''s discuss about logical volumes.


    # Logical Volumes


    A physical volume is divided into Volume Groups, which are then combined to form
    logical volumes. A Volume Group is the term used for the logical collections of
    disks that have been grouped together into one volume. Storage created under Logical
    volume can be resized and move it does not need upgrading of file system tools
    which in turn reduces operational costs. Volume management provides a layer of
    abstraction over physical storage and provides much greater flexibility than physical
    storage directly.

    With logical management, the disk is allocated to a single volume group and logical
    volumes are created to hold the file systems. Logical volumes provide flexible
    capacity, resizable storage volumes, online relocation, device naming and disk
    stripping. Logical Volume Management (LVM) provides a higher-level view of the
    disk storage on a computer system in comparison to traditional view of disks and
    partitions. It provides much more flexibility to system administrators, applications,
    and logically naming volumes. In LVM, file systems can extend across disks, create
    logical volumes or reduce logical volumes without reformatting and repartitioning
    the disk, data can be rearranged on disks, rename logical storage volumes and
    stripes across two or more disks. The following commands are available in LVM
    and are shown in Table 2:


