- img_proc: true
  md: "iptables -A INPUT -p tcp -i eth0 --dport 80 --sport 1024:65535 \\\n  -m state\
    \ --state NEW -j ACCEPT\n\n# Allow your Firewall to access the Internet\n\nThis\
    \ iptables script enables a user on the firewall to use a Web browser to surf\
    \ the Internet. HTTP traffic uses TCP port 80, and HTTPS uses port 443.\n\n```\n\
    # Allow port 80 (www) and 443 (https) connections from the firewall\niptables\
    \ -A OUTPUT -j ACCEPT -o eth0 -p tcp \\\n  -state NEW,ESTABLISHED,RELATED -o eth0\
    \ \\\n  - multiport --dport 80,443 --sport 1024:65535\n\n# Allow previously established\
    \ connections\niptables -A INPUT -j ACCEPT -m state --state ESTABLISHED,RELATED\
    \ \\\n  -i eth0 -p tcp\n```\n\nIf you want all TCP traffic originating from the\
    \ firewall to be accepted, remove the line:\n\n```\n-- multiport --dport 80,443\
    \ --sport 1024:65535\n```\n\n# Allow your Home Network to access the Firewall\n\
    \nIn this example, eth1 is directly connected to a home network using IP addresses\
    \ from the\n192.168.1.0 network.\n\n```\n# Allow all bidirectional traffic from\
    \ your firewall to the protected\nnetwork\niptables -A INPUT -j ACCEPT -p all\
    \ -s 192.168.1.0/24 -i eth1\niptables -A OUTPUT -j ACCEPT -p all -d 192.168.1.0/24\
    \ -o eth1\n```\n\n# Masquerading\n\nMasquerading means traffic from all devices\
    \ on one or more protected networks will appear as\nif it originated from a single\
    \ IP address on the Internet side of the firewall. Example:\n\n```\n# Load the\
    \ NAT module\nmodprobe iptables_nat\n```\n\n```\n# Enabling routing by modifying\
    \ the ip_forward /proc sysctl file\necho 1 > /proc/sys/net/ipv4/ip_forward\n```\n\
    \n```\n# Allow masquerading\niptables -A POSTROUTING -t nat -o eth0 -s 192.168.1.0/24\
    \ -d 0/0 \\\n  -j MASQUERADE\n```\n\n```\n# Prior to masquerading, the packets\
    \ are routed via the filter table's\nFORWARD chain.\niptables -A FORWARD -t filter\
    \ -o eth0 -m state \\\n  --state NEW,ESTABLISHED,RELATED -j ACCEPT\n```\n\n```\n\
    iptables -A FORWARD -t filter -i eth0 -m state \\\n  --state ESTABLISHED,RELATED\
    \ -j ACCEPT\n```"
