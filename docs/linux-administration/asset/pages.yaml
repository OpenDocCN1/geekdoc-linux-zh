    Symbolic links used in each of the RC directories so that the runlevel can be
    reached by creating, modifying, and deleting the symbolic links without affecting
    the actual scripts they refer. They provide clarity and avoid duplicate scripts.
    Each symbolic link begins with a K (processes that are killed) or an S (processes
