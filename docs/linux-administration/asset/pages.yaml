    # Providing a Caching Proxy Server


    +   - Caching a proxy server is software that facilitates the storage of frequently
    requested Internet objects. Objects (as Web pages, scripts and other downloaded
    files) are requested by proxy server. Main aim of caching proxy server is:


    +   - provide faster web browsing by reducing access time for frequently requested
    objects.


    +   - to minimize bandwidth consumption, by caching popular data locally (on a
    server that exists between the requesting client and the internet).


    Squid provides the basic caching and proxy functions such as DNS lookups, speed
    up subsequent DNS queries and implements negative caching. Negative caching means
    that Squid remembers when a request was made for an object that does not exist
    and does not'
