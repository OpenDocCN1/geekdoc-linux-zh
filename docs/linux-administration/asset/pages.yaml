    Let''s discuss implementation of SSI.


    # Implementing SSI


    Server-Side Includes (SSI) directives that are placed in HTML pages, and evaluated
    on the server while the pages are sent to the client. It allows you to dynamically
    generated content to an existing HTML page, without having a need to serve the
    entire page through a CGI program, or other dynamic technology. It also provides
    a great way to specify static, header and footer into the web pages. Files using
    SSI must use the .shtml extension.

    The decision of when to use SSI, and when to have your page entirely generated
    by some program, is usually a matter of how much of the page is static, and how
    much needs to be recalculated every time the page is served. SSI is a great way
    to add small pieces of information, such as the current date. But if a majority
    of your page is being generated at the time that it is served, you need to look
    for some other solution.


    The core Apache configuration file (httpd.conf) supports for SSI using the following
    statements in the <Directory> block:'
  merge: -1
