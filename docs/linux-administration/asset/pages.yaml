    # 3.3 Internet Services


    Any services that are accessible through TCP/IP-based networks are categorized
    as Internet services.


    Internet services are provided through either secure or non-secure connections.
    Common services of TCP/IP connections are Telnet, FTP, SMTP, HTTP, ARP, DNS, SSH,
    scp, sftp and many more. TCP/IP provides platform-independent protocols to use
    these services.


    By using TCP/IP protocols, any operating system can connect and transmit data
    with other computer over the network. Linux machines facilitate us with a wide
    range of Internet services.


    In the following section, you will learn about secure services and Linux''s network
    capabilities with these services.


    Let''s learn about secure services.


    # Secure Services


    In the beginning stage of Internet services when everyone trusted everybody else
    on the Internet, data is used to send in the plain text format including the sensitive
    information. With the growth of Internet, exchanging information through these
    services is not a good idea as it leads to a high risk of fraud. Therefore common
    services as Telnet and FTP (less secure services) are replaced with some secure
    services that provide a stronger authentication control.


    Let''s discuss some of the secure services. First learn about SSH.


    # SSH


    SSH stands for Secure Shell. It is the protocol for remote access to computer
    systems. It was created as a replacement for Telnet. It uses a public/private
    encryption key exchange protocol to encrypt all traffic, including passwords.
    You can see the ssh manage by the following command in the terminal window:


    ```

    Manssh

    ```'
