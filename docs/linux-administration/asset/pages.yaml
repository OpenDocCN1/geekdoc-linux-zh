    Now let''s discuss configuration of secondary master DNS server.


    # Configuring a Secondary Master DNS Server


    To configure a secondary master DNS server you need to modify the /etc/named.conf
    file and add two more files to complete the slave configuration. In the /etc/named.conf
    file add two zones, for the forward lookup of your server and for the reverse
    lookup.

    In the following example, the master server is main.tacttechnology.com and the
    slave is p200.technology.com.


    Add the following for the forward lookup:


    ```

    zone "tacttechnology.com" {

    notify no;

    typesave no;

    file "tactech.com";

    masters {192.168.1.1};

    };

    ```'
