  md: '# Port Forwarding NAT


    Port is handled by the PREROUTING chain of the nat table. Example:


    ```

    # Load the NAT module

    modprobe iptable_nat


    # Get the IP address of the Internet interface eth0 (linux only)

    external_int="eth0"

    external_ip=$(ifconfig $external_int | grep ''inet addr'' | \\

    awk ''{print $2}'' | sed -e ''s/.*\:////'')


    # Enable port forwarding by modifying the ip_forward /proc filesystem file

    echo 1 > /proc/sys/net/ipv4/ip_forward


    # Allow port forwarding for traffic destined to port 8080 of the firewall''s IP
    address to be forwarded to port 8080

    iptables -t nat -A PREROUTING -p tcp --i eth0 -d $external_ip --dport 8080 -j
    DNAT --to 192.168.1.200:8080


    # After NAT, the packets are routed via the filter table''s

    iptables -A FORWARD - -i eth0 -o eth1 -d 192.168.1.200 \\

    --dport 8080 --sport 1024:65535 -m state --state NEW -j ACCEPT


    diptables -A FORWARD -t filter -i eth0 -o eth1 -m state \

    --state ESTABLISHED,RELATED -j ACCEPT


    diptables -A FORWARD -t filter -i eth0 -m state \

    --state ESTABLISHED,RELATED -j ACCEPT

    ```


    # Static NAT


    In this example, all a particular public IP address is translated to a single
    server on the protected subnet. Use NAT to specify the alias IP address to be
    used for connections initiated by all other servers in the protected network.


    ```

    # Load the NAT module

    modprobe iptable_nat


    # Enable port forwarding by modifying the ip_forward /proc filesystem file

    echo 1 > /proc/sys/net/ipv4/ip_forward


    # NAT traffic:

    # REMEMBER to create aliases for all the internet IP addresses below


    # TO:                                     MAP TO SERVER:

    # 97.158.253.26            Anywhere                192.168.1.100 (1:1 NAT - Inbound)

    # Anywhere                192.168.1.100           97.158.253.26 (1:1 NAT - Outbound)

    # Anywhere                192.168.1.0/24          97.158.253.29 (FW IP)


    # SNAT is used to NAT all other outbound connections initiated

    # from the protected network to appear to come

    # IP address 97.158.253.29


    # POSTROUTING:

    # NAT source addresses. Frequently used to NAT connections

    # your home network to the Internet

    ```'
