  md: '# Configuring the Default Server


    The second section consists of directives that define the parameters of the ''main''
    or ''default'' server, which responds to requests that are not handled by a virtual
    host. These directives also provide default values for the settings of all virtual
    hosts. A virtual host is an httpd process that runs on the same machine as the
    default server, which is distinguished from the primary server by the hostname
    or IP address assigned to the virtual host. Unless directives are specifically
    overridden, the configurations defined for the primary server also apply on the
    virtual servers. Here are the directives of the defaultserver section of /etc/httpd/conf/httpd.conf:


    ```

    ### Section 2: ''Main'' server configuration

    user apache

    Group apache

    ServerAdminroot@localhost

    CanonicalName off

    DocumentRoot "/var/www/html"

    <Directory />

    Options FollowSymLinks

    AllowOverride None

    </Directory>

    <Directory "/var/www/html">

    Options Indexes FollowSymLinks

    AllowOverride None

    Order allow,deny

    Allow from all

    </Directory>

    <IfModule mod_dir.c>

    UserDir disabled

    DirectoryIndex index.html index.var

    AccessFilename .htaccess

    Order allow,deny

    Deny from all

    </IfModule>

    TypesConfig /etc/mime.types

    DefaultType text/plain

    <IfModule mod_mime.c>

    MIMEMagicConfig conf/magic

    </IfModule>

    HostnameLookups off

    ErrorLog logs/error_log

    LogLevel warn

    LogFormat "%h %l %u "%r" %s %b "%{Referer}i" "%{User-Agent}i" combined"

    LogFormat "%h %l %u %s %b" common"

    LogFormat "%h%{Referer}i ->%> referer"

    LogFormat "%{User-agent}agent"\CustomLog logs/access_log combined

    ServerSignature off

    Alias /icons/ "/var/www/icons/"

    <Directory "/var/www/icons/">

    Options Indexes FollowSymLinks

    AllowOverride None

    Order allow,deny

    Allow from all

    </Directory>

    ```'
