  md: '# Chapter 1


    # Understanding Duties of the Linux System Administrator


    Linux is self-sufficient operating system which supports multitasking. In this
    regard, the title of system administrator entails some responsibilities, and should
    have better understanding of their duties. As Linux is a multiuser operating system,
    it requires an efficient administration as compared to other operating systems.
    To administer a system is a process of learning but with this, it also means that
    while configuring a system gaining skills and understanding that raise you above
    other computers. The Linux system administrator holds a full account of what the
    system does and how it works. The Linux system administrator is responsible for
    a business network which contains dozens of machines. In the nature of system
    administration remains constant; it doesn''t depend on the size of installation.
    But system administrator''s roles change over time with respect to change in user
    requirements.


    Linux system administrator is the person who has access that is, a ''superuser''.
    It means, he/she has privilege to access everything, which includes all user accounts,
    all system configuration, home directories with all files therein, all files on
    the system.

    As system administrator, you have the responsibility to keep track of the entire
    task performed on your system at any time, and to monitor all the things that
    are required to keep a system active or in order use. Installing new programs,
    creating accounts for users (and deleting them when no longer needed), ensuring
    security for file system, hardware and the system resources currently used, users
    logged on, what commands are running and so.


    Although the responsibility of being a system administrator may change from platform
    to platform, there are some philosophies which remain same. It includes automate
    everything (benefit of predictability and consistency of service), maintaining
    regular document, Communicate as much as possible with user (providing them step
    to step instructions of what they are doing, necessary warnings, balancing between
    available resources among the people and groups, security issues, plan ahead for
    the changing environment and anticipate problems before they occur.


    In the following sections, let''s study about responsibilities of Linux System
    administrator in installing and configuring servers.


    +   Installing and configuring servers


    A server is a basically program that facilitates the system or other computer
    by providing services to them. It is the most important element of modern operating
    system and network design. It involves storing files and making them accessible
    for reading and writing, software that manages one or more printers, manages network
    traffic, runs applications for clients; Transfer Protocols; Web access.

    In Linux operating system, the server has a broader concept. Due to the demand
    for more powerful servers, higher configurations are required to handle all the
    technical issues such as server optimization, security and its monitoring. When
    a machine is connected to a server, which is outside your physical control, security
    becomes a major issue. It allows users to access the files they required but also
    prevent them from opening up the system you are administering. It is the duty
    of a system administrator to configure the servers specifically so that the most
    essential servers remain inaccessible. He she must be aware of the bad practices
    and security bugs.

    Let''s study about responsibilities of Linux System administrator in installing
    and configuring application software.'
  merge: -1
