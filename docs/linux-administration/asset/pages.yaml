    Let''s learn enabling CGI.


    +   - Enabling CGI


    The Common Gateway Interface (CGI) is a protocol that provides a standard method
    enabling Web servers to communicate with external programs. These are generally
    known as CGIs, CGI scripts or CGI programs. Many programming and scripting languages
    are available to provide CGI implementation. In Linux Perl, Python, Ruby and Bash
    are used to create CGIs. CGI scripts are used to create or update web pages dynamically.
    CGI is far more flexible than SSI as it provides additional functionalities.


    Before learning about Apache configuration and procedures to enable CGI, perform
    the task to ensure that Apache''s configuration permits CGI script execution.
    In the httpd.conf locate the directive ScriptAlias. This directive associates
    a directory name with a file system path, means that Apache treats every file
    in that directory as a script. Add the following directive, if not present:


    ```

    ScriptAlias /cgi-bin/ /var/www/cgi-bin*

    ```


    This directive tells Apache that any URL calling /cgi-bin/ should be served from
    /var/www/cgi-bin. For example, in directory /var/www/cgi-bin create a CGI test
    script, cgiscript.pl. You can use the following content to test the configuration
    of CGI.'
