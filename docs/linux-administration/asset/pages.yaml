  md: '# Chapter 3


    # Less Secure Services


    There are some non-secure services that should not be used as all their traffic
    is sent over the network in plain text. In the following section, let''s discuss
    some of these less secure services:


    +   - Telnet: It is a protocol that enables you to have access to a virtual terminal
    on a remote host. it is a text-based console application.

    - FTP: It is the standard protocol that runs over ports 20 and 21. You can type
    help command to list the available commands in FTP. Two important commands are
    put and get which provide moving a file from your machine to the remote machine
    and to pull a file from the remote server to your machine respectively. Use mput
    and mget in case of multiple files.

    - rsync: This file transfer program is similar to RCP. It sends traffic encrypted.
    The server listens on port 873.

    - ssh: It is an encrypted protocol for executing commands on remote hosts.

    - login: It is a login program that connects your terminal to a remote machine''s
    terminal. It is a non-secure protocol and sends all information in plain text.

    - finger: It enables users on remote system to search for information about users
    on another system. It displays a user''s login name, real name, idle time, location
    and phone number. The finger daemon listens on port 79.

    - talk and expect: They are real-time chat protocols that run on port 517 and
    518 respectively. type talk username to send someone else a request.


    Let''s Linux machine as a server.


    # Linux Machine as a Server


    Following are the same secure protocols available on Linux:


    +   - HTTP: Apache is the most common web server on Linux, which is started out
    of a system''s rc scripts. You can easily configure Apache and its configuration
    file in /etc/httpd/conf/. Apache listens to port number 80 and can be set to listen
    to many different network ports.

    - sshd: The secure daemon (sshd) is started out of a system''s rc scripts. Its
    global system configuration file exists in /etc/sshd_config and user''s configuration
    files are placed in $HOME/. It listens on port 22.

    - ftp: The FTP daemon uses port 20 and 21 to start FTP requests. Its configuration
    files ftppass, ftpversions, ftgroups and ftpdusers are located in /etc directory.

    - DNS: The Domain Name Service (DNS) maps IP addresses to hostnames. It uses port
    53. Its configuration file is named.conf in the /etc directory.


