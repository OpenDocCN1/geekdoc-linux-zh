  md: '# Setting through editing X Configuration file


    # Video card


    With the following command you can get the information about what type of video
    card you have and how much video memory:


    ```

    lspci

    ```


    # Monitor


    Make the necessary changes in the following entries of the X server configuration
    file in the Monitor section:


    +   - Identifier: Specifies a unique name for this Monitor section. This is a
    required entry.

    - VendorName: An optional parameter which specifies the vendor of the monitor.

    - ModelName: An optional parameter which specifies the monitor''s model name.

    - DisplaySize: An optional parameter which specifies, in millimeters, the physical
    size of the monitor''s area.

    - HorSync: Specifies the range of horizontal sync frequencies with the monitor,
    in kHz. These values help the X server determine the validity of built-in or specified
    Model entries for the monitor.

    - VertRefresh: Specifies the range of vertical frequencies supported by the monitor,
    in kHz. These values help the X server determine the validity of built-in or specified
    Model entries for the monitor.

    - Modeline: An optional parameter which specifies additional video modes for the
    monitor at particular resolutions, with horizontal sync and vertical refresh rates.
    Refer to the xorg.conf(5) manual for a more detailed explanation of Modeline entries.

    - Option <option-name>: An optional entry which specifies extra parameters for
    the section. Replace <option-name> with a valid option listed for this section
    in the xorg.conf(5) man page.


    Mouse

    EachInputDevice in the X server configuration file configures one input device
    for the X server. The following options are typically used when adding a mouse
    in the xorg.conf:


    +   - Protocol: Specifies the protocol used by the mouse, such as IMPS/2.

    - Device: Specifies the location of the physical device.

    - Emulate3Buttons: Whether to allow a two-button mouse to act like a threbutton
    mouse when both buttons are pressed simultaneously. Consult the xorg.conf man
    page for a list of valid options for this section.


    # Installing KDE


    Perform the following steps to install KDE desktop


    +   1. Run the following yum command to install kde desktop


    ```

    yum install "KDE (K Desktop Environment)"

    ```


    +   2. Run the following yum command to install switchdesk interface in your system.
    This enables you to switch over your desktop from GNOME to KDE and vice-versa.'
  merge: -1
