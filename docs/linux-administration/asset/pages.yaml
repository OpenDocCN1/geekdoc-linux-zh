    Before ending the chapter, let''s summarize the key points discussed in chapter.


    # Summary


    This chapter introduced you to Apache Web server configuration. You also learn
    how to enable and test Apache''s SSI, CGI and PHP. Further, you explore creating
    a secure server using SSI. You learn about GNU Mailman. It covers explanation
    mailing list services. You also get acquaint with SquirrelMail which is a popular
    Fedora browser-based email solution. You also discover about RSS feed. Towards
    end of the chapter you also learn ready-to-run Web site search engine (Sage) features.


    # Exercise


    +   Q1. Which code is supported by Apache?

    a. XML b. HTML

    c. DHTML d. Javascript


    Ans. b is the correct option.


    +   Q2. Which is the default HTTP port that is responsible to listen and answer
    the child server requests?

    a. 20 b. 60

    c. 80 d. 40


    Ans. c is the correct option


    +   Q3. Which of the following is used to encrypt communications between your
    Web server and Web clients?

    a. SSL b. HTTP

    c. SSP d. FTP


    Ans. a is the correct option


    +   Q4. The third party who issues certificates is known as a ?na. Certified Authority
    b. Issue Certification

