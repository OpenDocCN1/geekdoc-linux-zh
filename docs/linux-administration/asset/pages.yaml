    Starting Up Services from xinetd: xinetd (Extended Internet Daemon), is an open-source
    daemon which manages Internet connectivity. It offers a more secure replacement
    to inetd, the Internet daemon. It starts programs to provide Internet services,
    is also referred to as a super-server as it listens all service ports for the
    services listed in its configuration file. When a request comes, xinetd starts
    the appropriate server. It provides extensive logging and lets you bind specific
    services to specific IP addresses on your host machine. Each service has its own
    configuration file, which is located in the /etc/xinetd/ directory./etc/xinetd.conf
    is the configuration file for xinetd.


    The services in xinetd''s configuration file can be separated into two groups:


    +   - Services in the group are called multi-threaded and they require a new server
    process for each new connection request.

    - The second group single-threaded in which the service daemon is responsible
    for handling all new connection requests.


    Starting Network Services via rc Scripts: rc Scripts start those network services
    which are not started by xinetd. Network services started at the default boot
    level 3 are started out of /etc/rc3 directory. A file with the name of the service
    is placed in directory. You can start or stop the service. The script to start
    the service starts with an S, and the script carries with a K.


    Other Network Configuration Files: Files present in /etc/sysconfig directory are
    used to create routes to other hosts i.e. on own network or on outside network.
    These files are used to set up firewall rules for your network to set permissions
    on your network connections. Files present in /etc/sysconfig/network-scripts directory
    are used to set parameters for the hardware and software used for networking.


    Let''s discuss about init scripts.'
