  md: '# LAB-1: Installing Fedora Linux and Configuring Grub Loader


    Objective:


    +   - Installing Fedora Linux and configure GRUB Boot Loader.

    - Requirement:

    - A processor with speed of 200 MHz Pentium for text-only installation and 400
    MHz for a GUI installation

    - RAM with minimum 64 MB memory for running Linux distribution in text mode and
    minimum 192 MB for running Linux distribution in graphical mode

    - A CD or DVD driver to install Fedora Linux

    - A network card

    - 3 GB of disk space


    Perform the following steps to install Linux:

    1. Insert the DVD in the CD/DVD driver and reboot the computer. A welcome screen
    appears (Figure 1).

    2. Select the required installation option from the list. In this case, we have
    selected the Install or upgrade an existing system option (Figure 1).

    A **Disc Found** dialog box appears (Figure 2).

    3. Select the Skip option (Figure 2).


    ![](img/5cfda308a5eba7fcc04c6aeafbe7fe3f_168_0.png)


