    Classless Domain Routing (CIDR) was introduced to enhance address space utilization
    and routing scalability in the Internet. The main idea behind it was to keep the
    Internet from running out of IP addresses. The allocation of IP addresses through
    classical class system can be very inefficient. It was wasteful when more than
    254 addresses were given a Class B block of 65533 addresses. Even more wasteful
    were companies and organizations that allocated Class A blocks, which contain
    over 16 million host addresses. This cause a huge wastage as in actual only a
    small percentage of the allocated Class A and Class B address space has been assigned
    to a host computer on the Internet.


    Later, it was realized that eliminating class system, addresses could be conserved.
    For this purpose scheme Subnetting was proposed in 1992. According to this scheme
    accurate number of address space is allocated that was actually needed. This can
    avoid the crisis of address space for many years.


    Under this, the classful subnet masks are extended so that a network address and
    subnet mask could create subnets with one address. For example, if you need thousand
    addresses, you can subnet four class C networks together as shown:'
