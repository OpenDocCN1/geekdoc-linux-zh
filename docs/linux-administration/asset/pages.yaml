  md: '# Chapter 4


    SMTP has a major shortcoming that it assumes that the sending and receiving MTAs
    are always connected to the Internet. This shortcoming is overcome by POP3.

    Let''s learn about POP3.


    # POP3


    POP3 was developed to solve the problem faced in SMTP. POP3 runs on a server that
    is connected to a network, which continuously sends and receives mail. The POP3
    server stores any messages it receives until the recipient requests them. If you
    want to read your mail, you need POP3 to retrieve messages that arrive at your
    MTA while you are not connected to the Internet (offline). POP3 uses the MTA''s
    storage to hold messages until they are requested. You can retrieve messages stored
    by the server, by connecting to the POP3 server. After retrieval, messages are
    stored locally and you can use MUA on your PC to read them. The messages you retrieve
    on your PC are removed from the server.

    When it comes to a case where a user does not want to remove their email from
    the server and want to access their email from any PC. This is fulfilled with
    the use of IMAP4.

    Let''s learn about IMAP4.


    # IMAP4


    The Internet Message Access Protocol Version 4 (IMAP4) provides the feature that
    enables you to store email on a networked mail server. With IMAP4 your email resides
    on a remote permanently and you can retrieve it whenever wherever you want. Your
    MUA must understand IMAP4 to retrieve messages from an IMAP4 server.


    > Tip: Decide whether your users needs POP3 or IMAP4 functionality (or both).
    There are email clients and servers that speak both protocols, but you cannot
    use a POP3 client to communicate with an IMAP4 server or an IMAP4 client to communicate
    with a POP3 server.


    Now, let''s learn to configure sendmail.


    +   - Configuring Sendmail

    Various transport agents are available in Linux, in which Sendmail is widely used.Sendmail
    aims to safely transfer email among hosts, usually using the SMTP protocol. Many
    system administrators elect to use Sendmail as their MTA due to its power and
    scalability. It is highly configurable.


    Before configuring, verify whether the Sendmail is installed in your system. Use
    the following command to check the installation of sendmail:


