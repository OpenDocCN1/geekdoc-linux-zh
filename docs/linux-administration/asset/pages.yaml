  md: '# Understanding UNIX


    UNIX is a multitasking operating system with protected memory, which was developed
    by Bell Laboratories in 1969. UNIX systems provide an easy to use environment
    as it has a GUI similar to MS Windows. UNIX operating systems is created using
    machine-independent language. It is a trademark purely governed by The Open Group,
    conforming to a specification - The Single UNIX. It defines the names of the interfaces
    and behavior of all the mandatory functions.


      Due to its networking capability, UNIX is commonly used as no additional software
    is required to get access on network. Linux as an operating system is commonly
    used in গ্রহণের as it facilitates portability, hierarchical directory structure,
    multiuser system, efficient virtual memory, access controls and security, flexibility,
    and power. Simplicity, ability to focus, reusable components, filters, open file
    formats, and flexibility are some of the characteristics that are shared by UNIX
    programs and operating systems.


      Let''s next explore Linux in the following section.


    # Exploring Linux


    Linux is self-sufficient operating system based on Linux kernel (central component
    system, that manages system''s resources). Linux is a multitasking and multiuser
    operating system, which means users are able to log in and each user can satisfactorily
    perform multiple tasks. Linux is one of the free and open source software in which
    the source code is used, freely modified, and redistributed under the terms of
    the GNU public license and other available licenses. Linux ensures high security
    levels, a virus-free environment, and regular virus-prevention while working with
    other operating systems. Regardless of its dynamic nature, it is totally complete
    in respect of functionality and interface. The Linux operating system can be installed
    on any system, which uses x86-compatible microprocessors.


      Linux enables the users to work with using different interfaces such as, Command
    Line Interface (CLI) and Graphical User Interface (GUI), or through controls attached
    to the hardware. Desktop Environment (KDE) and GNOME are the two commonly used
    and popular GUI used. Linux has high standards in the release of open-source distribution,
    which makes it accessible to millions of users online; therefore, it is used as
    both a desktop operating system and a server platform.


      Some of the characteristics managed by Linux, which distinguishes it from other
    operating systems, are low cost, stable performance, network friendliness and
    security, flexibility, compatibility, choice, fast and easy installations, multitasking,
    open source, managing different file system formats, ease in downloading applications,
    ability to modify the code according to the requirement and freedom to choose
    any Linux distribution.


      Let''s next explore GNU in the following section.


    # Exploring GNU


    GNU is a UNIX like operating system that is funded by Free Software Foundation.
    The GNU Project was launched in 1984; the purpose behind this operating system
    is to make it entirely free of software. It is compatible as it provides a familiar
    programming and user'
