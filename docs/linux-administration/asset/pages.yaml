    # Daemons and NFS server commands


    The daemons are part of the nfs-utils package, and may be either in the /sbin
    directory or the /usr/sbin directory. NFS service requires six daemons such as:
    /sbin/portmap, /usr/sbin/rpc.mount, /usr/sbin/rpc.nfs, /usr/sbin/rpc.statd, /usr/sbin/rpc.lockd,
    /usr/sbin/rpc.rqotd (if necessary). Most Linux distributions start these daemons
    in the boot scripts, but it is recommended to ensure the initialization of these
    daemons before working with NFS server.


    The NFS server daemons should be started in the following order:


    +   - portmap enables the clients to discover NFS services on NFS server


    +   - nfsd performs most of the work


    +   - mountd handles the initial mount requests


    +   - statd handles file locking


    +   - rquotd (if necessary) handles user file quotas on exported volumes


    +   - idmapd maps user and group names to NFSv4 IDs (and vice versa)


    +   - svgssd creates security contexts


