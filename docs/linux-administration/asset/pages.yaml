  md: '# Configuring Apache


    Apache is very easy to configure as its developers and maintainers have made continuous
    efforts towards its development. Before configuring Apache web server, ensure
    that Apache is installed in your system or not. Use the following command to verify
    whether Apache is installed in your system:


    ```

    # rmqueryhttpd

    httpd-2.2.15-fc11.i586


    # rmqueryhttpd[manual,devel]

    httpd-manual-2.2.15-fc11.i586

    httpd-devel-2.2.15-fc11.i586

    ```


    Install Apache if not installed. If you get the output, then your Apache is already
    installed and you can proceed to configure it.


    In this section you use the default configuration as a starting point towards
    configuration of Apache. You will learn about related Apache configuration directives
    and the default configuration provided in Fedora.


    When Apache starts, a master server reads and processes the /etc/httpd/conf/httpd.conf
    file (Apache configuration file). Apache also reads /etc/mime to configure the
    MIME system as it map file extensions to content types.


    After this master server performs some checks and opens the log files. Next, it
    launches one or more processes defined in the configuration file. These child
    servers are responsible for listening standalone process or a thread. It depends
    on the runtime configuration behavior of master server and how it is compiled.
    These servers answer the requests on the HTTP port (by default 80).


    Apache contains around 950 directives. Some of the directives are operating system
    specific, some of them provide backward compatibility and some are to handle specific
    situations. The Apache configuration file, /etc/httpd/conf/httpd.conf is organized
    into three sections named, directives describing Apache''s global characteristics,
    directives describing primary or default server and configuration about virtual
    hosts.


    Let''s learn the global behavior.


    # Configuring Global Behavior


    The first section consists of the directives that control the Apache server as
    a whole (the global environment). Following are the directives of the global environment
    of /etc/httpd/conf/httpd.conf:


    ```

    ### Section 1: Global Environment

    ServerTokens 0

    ServerRoot "/etc/httpd"

    Pidfile run/httpd.pid

    Timeout 120

    KeepAlive off

    MaxKeepRequests 100

    KeepAliveTimeout 15

    <IfModule prefork_module.c>

    StartServers 8

    MinSpareServers5

    ```'
