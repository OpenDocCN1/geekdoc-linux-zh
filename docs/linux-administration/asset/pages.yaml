    After learning DNS in the above section, let''s study about mail services.


    # Configuring Mail Services


    Before configuring a mail services, you need to understand how basically email
    works. Between sender and receiver, there are several programs that use network
    protocols to do the job of ensuring the message goes from sender to receiver.
    To make your email work properly, you need to configure the following items:


    +   - Programs:

    - A mail user agent for users to be able to read and write email

    - A mail transfer agent to deliver email messages across a network

    - A mail delivery agent to deliver messages to users'' mailbox files

    - A notification program to notify users about new mail

    - The SMTP protocols for packaging and transferring email messages between MTAAs.

    - TCP/IP ports through which programs communicate.


    Let''s see how these components work together to deliver a message.


    # Tracing The Mail Delivery Process


    In Linux, email creation, transmission and delivery is handled by different programs
    designed specifically for that task.The email delivery process involves three
    components, a mail user agent, a mail transfer agent and a mail delivery agent.
    These three components perform discrete tasks and have one advantage that you
    can replace one program without affecting the functionality of the entire system.


    Let''s learn about these processes in details, first start with exploring MUA.'
