    Each computer on its subnet use IP address as gateway of the other network. In
    the above example, the first computer or the computer on first subnet, the 192.168.1.0
    has the gateway 192.168.1.1. The computer on the second subnet, 192.168.1.129
    has the 192.168.1.129 as the gateway address. You can add this information through
    route command:


    ```

    route -net 192.168.1.0

    ```


    ```

    route add default gw 192.168.1.129

    ```


    This command set up the route for local routing and the external route for your
    first subnet. Repeat the commands, for every subsequent subnet and substitute
    the appropriate numbers. With this, you have established the communication between
    the two subnets.

    Let''s learn about configuring dynamic host protocol.


    +   - Configuring Dynamic Host Configuration Protocol


    You can automatically assign IP address and other information to the hosts connected
    to your network with the help of Dynamic Host Configuration Protocol (DHCP), DHCP
    aims to deliver configuration information to individual hosts connected to the
    network, either permanently or temporarily to reduce the time consuming of larger
    IP networks.


    When there is a need of changing IP address a large number of systems, modifications
    in DHCP configuration file is better than reconfiguring the whole system, you
    can set new IP address by just editing the DHCP configuration file.


    By using DHCP, you ensure that every host on your network has a valid IP address,
    subnet mask, broadband address and gateway. Each host on the subnet needs to be
    configured as a DHCP client. You also require the server that connects to your
    ISP as a DHCP client.'
