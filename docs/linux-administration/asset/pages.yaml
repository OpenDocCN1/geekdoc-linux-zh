    \ are commonly used options:\n\n+   - allow-query: it specifies the hosts that\
    \ are allowed to query the name server. By default, all hosts are allowed to query.\n\
    - allow-recursion: it applies to recursive queries. By default, all hosts are\
    \ allowed to perform recursive queries of the name server.\n- blackhole: it specifies\
    \ lists of hosts that are not allowed to query the server.\n- directory: it specifies\
    \ the named working directory.\n- forward: it specifies the forwarding behavior\
    \ of a forwards directive. If set to first, the servers in the forwards are queried\
    \ first and then the server tries to find the answer itself. If set to only, the\
    \ servers in the forwards list are queried.\n- forwards: it specifies a list of\
    \ valid IP addresses for name servers where requests are forwarded.\n- listen-on:\
    \ it specifies the port and interfaces on which server listen for queries (default\
    \ is port 53).\n- notify: it controls whether named notifies the slave servers\
    \ when a zone is updated. It accepts the following options: or no.\n- pid-file:\
    \ it specifies the name of the files holding the process ID.\n- statistics-file:\
    \ it specifies an alternate location for statistics files. By default, named statistics\
    \ are saved to the /var/named/named.stats file.\n\ninclude\nThe statement allows\
