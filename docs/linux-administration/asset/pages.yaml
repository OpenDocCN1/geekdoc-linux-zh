    An IP address (IPv4) is a unique address used to identify a device on an IP network.
    The address is made up of four (8-bit) for a total of 32 binary bits. To make
    them easier to read, they are broken into four octets. Each octet is of 8 bits
    and is converted to decimal, or separated by dots. The value in each octet ranges
    from 0 to 255, or 00000000 - 11111111. Let''s see how binary octets are converted
    to decimal: the right bit keeps increasing as we move leftwards (2'', 2...). The
    least bits hold the value of 2''. So if all binary bits are set to 1, the decimal
    equivalent of 256:


    | 1 | 1 | 1 | 1 | 1 | 1 | 1 | 1 |

    |---|---|---|---|---|---|---|-|

    | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |


    128+64+32+16+8+4+2+1=255, 192.168.1.1

    The binary notation of an IP address is:

    11000000.10101000.00000001.00000001

    The dotted quotation from this binary is:

    (128+64)+(32+16)+(1).(1)=192.168.1.1

    With the help of a subnet mask, IP address is divided into network portion and
    host portion. The leftmost bits of the IP number identify the network on which
    the host resides and the remaining bits of the IP number identify the network
    interface. The network classes identify the number of bits used by the network
