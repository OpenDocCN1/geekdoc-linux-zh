    Let''s learn about NFS security.


    # Examining NFS Security


    NFS is a well-known file sharing system with a large number of known hosts in
    a transparent way. With this feature, it brings a variety of potential security
    problems. The following section identifies some vital points that should be considered
    when exporting NFS systems on a server or mounting them on a client, to provide
    protection to the data on the server and minimizing the security threats.


    Once a file is exported any remote host can access the shared data which leads
    to security risk. NFS holds some weaknesses, the /etc/exports file is one of them.
    If the file lists the names or IP addresses for machines that are allowed to access
    or export NFS files, if someone is able to spoof or squash a true address they
    can access their NFS mounts. Another weakness is the access control. Once the
    NFS file system is mounted the user and group permissions on the file access control.
    Two users can modify others'' files, if they share the same UID and mount the
    same NFS file system. Additionally, with anyone on the client machine can become
    a user who can access particular files in the NFS share. To limit this file share,
    administrators allow read-only access or squash permissions to a common user and
    group ID.


    You can also restrict access to the ports via TCP wrappers. Wildcards should be
    used carefully when exporting directories via NFS. By installing firewall and
    netfilter you increase the security level in NFS. netfilter restrict the access
    to your server at the packet level. Access to ports used by rpcbind, rpc.mount,
    rpc.nfs, lockd, std, and quota can be limited by creating firewall rules via iptables.


    You have the following options to provide security:


    By using the root_squash option in /etc/exports we maintain security via NFS root
    squash. With this the server specifies the UID of the anonymous (nobody) user
    for root''s UID/GID, which prevents the client''s root account from having only
    the server''s root account access. It is suggested to turn off root squash. For
    instance, if a user with UID 0 on the client accesses the file system, the server
    substitutes the UID of the server''s nobody account. This means that the root
    user on the client can''t access or change that. Using the all_squash option when
    exporting an NFS share will use the UID of the nfs nobody user. To turn it off,
    use the no_root_squash option. With this command, the root user on the client
    can become any other user and access and change that files. To prevent all important
    files should be owned by root, and not by bin or other non-root account. As servers
    root account is the only account which is not accessible by the clients root user.'
