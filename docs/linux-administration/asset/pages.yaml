    xinetd performs the same function as inetd with addition of more new and features.
    It starts at system boot and runs the programs that provide Internet services.
    It waits and listens for connections to the ports to which they are assigned in
    their config files. The xinetd spawns a new server needed to listen to the connection
    request.


    It also provides access-controls. It does not limit its use to system administrators
    only, but also to those who are not root. Anyone can start the network services
    via xinetd. It also'
