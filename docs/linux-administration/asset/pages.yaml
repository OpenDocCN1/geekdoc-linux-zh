    # Understanding the File System Structure


    It is vital for administrator, users, programmers and installed software to know
    how and where the files are stored on the system for proper system functioning.
    File system is the method that an operating system uses to keep track of files
    on a disk or partition that is, it provides the way the files are organized on
    disk.


    Linux supports many different file systems which is based on the standards defined
    in the File system Hierarchy Standard (FHS). The FHS provides a structured tree
    where every location has its distinct meaning. Placement of files in the directory
    depends upon the type of information stored in it. Information can be of two types:
    sharable (files that can be accessed by other host) and unsharable (files that
    can only be accessible on local system). In Linux, separate file systems are combined
    into one hierarchical tree structure that denotes the file system as one unit.
    The root of the tree is the file system root, identified by the slash character:
    ''/''. All other directories branch off from the root. The Linux system contains
    many directories full of child directories.


    Linux''s file system manage this operating system from other operating system.
    For instance, in Windows operating system C: drives for more directories such
    as documents and settings, program files, etc. In Linux, we have / (root directory)
    as C drive in Windows with all file system unified. If /partition is filled up,
    you can create another file system as /usr/local and move your data from /usr/local
    in the original file system to a new file system definition. This frees up space
    on the /partition.


