    Let''s discuss some steps to optimize Nis.


    # Optimizing NIS


    Network Information Service (NIS) faces some problems like error messages with
    text ''Not responding'', slow login times and system hang-ups. Following tips
    can help to avoid common problems with NIS speed:


    +   - Examine the root of the problem. Sometimes the problems seem to be caused
    by NIS actually caused by busy NIS server.


    +   - Avoid using repetitive net groups. Groups that are recursive in nature are
    convenient for administrators as they limit their maintenance burden. But in time
    they are consuming and slowing down the server.


    +   - Divide NIS domains into smaller subdomains. It reduces the overall load
    on any NIS server and also minimizes the NIS mappings.

    Let''s discuss steps to optimize Samba networking.


    # Optimizing Samba Networking


    The most vital consideration for optimizing Samba is increasing file transfer
    between Samba servers and clients. The Samba configuration file /etc/smb.conf
    file has options that can be set to increase transfer performance. You can make
    necessary changes to the following options:


    +   - socket options: These are controls on the network layer of the operating
    system that enables connection tuning. It is recommended to use socket options=IPTOS_LOWDELAY_TCP_NODELAY.


    By adding socket options to the global section of your smb.conf, you can gain
    a 200% throughput increase over default settings.'
