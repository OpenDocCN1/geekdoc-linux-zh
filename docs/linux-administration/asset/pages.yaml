    CIDR provides a simplified notation of writing subnet. The subnet mask is simply
    listed as the number of 1 bit that starts the mask. For example, the subnet mask
    255.255.252.0 can be written as 192.60.128.0/22.


    It indicates the starting address and the number of 1 bit, that is, 22 in the
    network portion of the address. In network notation this can be represented as:


    ```

    11111111.11111111.11000000

    ```


    Classless addresses can be written in CIDR notation (Class A = /8, Class B = /16,
    and Class C = /24).


    Due to growing size of the routing table it is very difficult or impossible for
    an individual or company to allocate their own IP address blocks. The network
    routes are increasing by day. Ten years ago, there were less than 5000 network
    routes and today figure has crossed 1000.


    Using CIDR, the biggest ISPs are allocated large chunks of address space and the
    smaller ISPs'' customers are then allocated networks from the big ISPs'' pool.
    This keeps all the ISPs'' customers accessible via 1 network route on the Internet.
    It is expected that the use of CIDR, can save IP addresses at least for the next
    few years.


