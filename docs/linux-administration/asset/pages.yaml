    Let''s study about RAID.


    # RAID (Redundant Array of Inexpensive Disks)


    RAID provides data protection for Linux storage as it provide a reliable, redundant
    means of protecting vital data on a server. It aims at improving disk performance
    and provides data redundancy. Through RAID, information is spread across various
    physical hard drives using techniques such as: striping and disk mirroring to
    achieve redundancy, lower latency or higher bandwidth for reading and/writing,
    and recoverability from hard-disk crashes. A RAID can be deployed using both software
    and hardware.


    +   - Software-based RAID: It offers the cheapest solution that abstracts multiple
    devices and beats a single device. Software RAID performance depends on the server
    CPU performance and best performance with today''s fastest CPUs compare to hardware
    RAID. The MD in the Linux kernel is an example of software based solution. Software
    RAID offer features: threaded rebuild process, kernel-based configuration, portability
    of arrays between Linux machines without reconstruction, grounded array reconstruction
    using idle system resources, hot-swappable drive support, automatic detection
    to take advantage of certain CPU optimizations.

    - Hardware-based RAID: The hardware-based array manages the RAID subsystem and
    presents to the host only a single disk per RAID array. Most dedicated users use
    a hardware RAID controller. The controller simply presents the RAID as another
    logical drive. They do not require processor resources. They provide a read/write
    cache, which depends on the I/O workload. Hardware implementations provide guaranteed
    performance, with no computational overhead to the host computer, and can support
    many operating systems.


    There are six RAID levels that can be used:


    +   - RAID-0 is not redundant and most efficient array type which results in higher
    throughput but offers no fault-tolerance. It requires at least two disks and uses
    a method called stripping that writes data across both drives.

    - RAID-1 provides redundancy, faster performance, no data loss and fault-tolerant
    environments. It requires at least two disks and uses a method called mirroring
    that'
