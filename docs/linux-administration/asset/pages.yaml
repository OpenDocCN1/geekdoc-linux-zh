  md: '# Chapter 2


    The Media Access Control MAC Address: address of the device itself - its node
    or host address

    The Network Layer Address is the IP address that has been assigned to the device.
    The MAC address is built into the card by the manufacturer and is used to transfer
    data between devices. When data is transferred between computers the long stream
    of data is divided into small packets. To improve communication performance between
    two networks, it is beneficial to subdivide the message into packets. Each packet
    is sent individually through a computer network. Packet format generally contains
    a header (the destination address), body (contains the message data) and sometimes
    a footer (contains data signifying end of the packet). The receiving device reassembles
    the packets in the correct sequence and retrieves the original message.

    Let''s study about the various network classes.


    # Understanding Network Classes


    An Internet Protocol (IP) address is a unique number assigned to each machine
    connected either or temporarily. It serves two purposes: location addresses and
    computer host identification.

    Although IPv6 has developed, majority of hosts/devices are still using IPv4 (Internet
    Protocol Version 4) for addressing. The new IPv6 makes use of 128 bits for the
    IP address and is still in development process. In the following section you learn
    about the IPv4 (Internet Protocol Version 4) of addressing.

    IPv4 addresses are divided into classes. IP addresses are usually separated by
    4 decimal numbers and are written in standard dot notation (For example: 286.123.234.756).
    The decimal numbers must be within the numeric range of 0 to 255.


    +   - Class A addresses used for large networks

    - Class B was designed for use on medium to large networks

    - Class C for small local area networks (LANS)

    - Class D and E are used for multicast and experimental purposes


    To send data between devices on the same network the following process is followed:
    The sending device sends an ARP request to the Ethernet broadcast (MAC) address
    of a node on the network. The Ethernet broadcast address is a special address
    to which all the cards are configured. The ARP request holds the sender IP and
    search for the device whose address matches the particular IP address. The sender
    is able to send its data to the specific address.

    Router is used to send data to the different network. A router must be connected
    physically to such network. The router receives and sends its request to the router
    on its network, this router receives the request from the sending node and identifies
    the best route to transmit the data. The router sends the data to another router
    through a program called routing table. Routing tables can be manually configured
    or obtained dynamically. The destination network is mapped with routing table.
    The data packet delivers to the destination network if address of destination
    network is found in routing table. Packet is dropped and considered undesired
    if address of destination network is not found in routing table and sends an ICMP
    Destination Unreachable message to the sender.'
  merge: -1
