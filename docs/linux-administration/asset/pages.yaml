  md: '# # Linux Administration


    The book Administration provides hands-practice on Linux operating system. It
    covers topics that are of core importance from administration point of view, such
    as roles and duties of the system administrator, maintenance and management of
    system configuration files, network administration, configuration mail services,
    and Web server. It provides numerous examples in an easy-to-understand language
    along with exercise at the end of each chapter. Besides the examples, the book
    also provides a separate lab section that reader can use to check and enhance
    his/her practical skills on Linux.


    # ## In this book, you learn about:


    +   * Installation and configuration of servers and application software

    * Boot loaders, bootstrapping, and memory and virtual file systems

    * Working with file system

    * Backing up and restoring files

    * Transmission Control Protocol/Internet Protocol (TCP/IP) networking, planning
    a Network File System (NFS) installation, and configuring an NFS server and client

    * Installation and configuration of Samba server and Samba users

    * Connection of Windows PC to the Samba server

    * Configuration of time server and setting Linux machine as server

    * Configuration of inetd server and firewall packages

    * Configuration of DNS server

    * Configuration of Sending and using mail server

    * Serving e-mail with Post Office Protocol 3 (POP3) and Internet Message Access
    Protocol (IMAP), maintaining e-security, and configuring File Transfer (FTP) server

    * Configuration of Apache Web server and enabling Common Gateway Interface (CGI)
    and Hypertext Preprocessor (PHP)

    * Creation of mailing lists through mailman and setting up of Web-based email

    * Optimization of Domain Name System (DNS), mail, FTP, and Web services

    * Administering user accounts

    * Update of system and software packages, and customizing kernel


