    # Verifying the Kernel configuration


    You need to verify the Kernel configuration to use its features such as IP forwarding
    and Netfilter (iptables) support. Netfilter support handles the actual proxying
    of browser requests. Specifically, you need to enable Netfilter and the modules
    that support:


