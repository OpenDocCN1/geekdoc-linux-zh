  md: "iptables is configured to allow the firewall to accept TCP packets to be routed\
    \ when they enter on interface eth0 from any IP address for IP address of 192.168.1.58\
    \ that is reachable via interface eth1. The source port is in the range 1024 to\
    \ 65535 and the destination ports are port 80 (www/http) and 443 (https). The\
    \ return packets from 192.168.1.58 are allowed to be accepted. Instead of stating\
    \ the source and destination ports, you can simply allow packets to established\
    \ connections using the -m state and -state ESTABLISHED options.\n\n# Using User\
    \ defined chains\n\nYou can configure iptables to have user-defined chains. This\
    \ feature is frequently used to help the processing of iptables. For example:\n\
    \n```\niptables -A input-queue -i eth0 -d 206.229.110.2 -j fast-input-queue\n\
    iptables -A output-queue -o eth0 -s 206.229.110.2 -j fast-output-queue\n\niptables\
    \ -A fast-input-queue -p icmp -j icmp-queue-in\niptables -A output-queue -p icmp\
    \ -j icmp-queue-out\n\niptables -A icmp-queue-out -p icmp --icmp-type echo-request\
    \ \\\n  -m state state NEW -j ACCEPT\n\niptables -A icmp-queue-in -p icmp --icmp-type\
    \ echo-reply -j ACCEPT\n```\n\nHere six chains help in improving processing speed.\
    \ Table-5 summarizes the function of each:\n\n| Table-5: Showing the custom chains\
    \ |\n\n| Chain | Description |\n| INPUT | The regular built-in INPUT chain in\
    \ iptables |\n| OUTPUT | The regular built-in OUTPUT chain in iptables |\n| fast-input-queue\
    \ | Input chain dedicated to identifying specific protocols and shunting the packets\
    \ to specific chains.. |\n| fast-output-queue | Output chain dedicated to identifying\
    \ specific protocols and shunting the packets to specific chains.. |\n| icmp-queue-out\
    \ | Output queue dedicated to ICMP |\n| icmp-queue-in | Input queue dedicated\
    \ to ICMP |\n\nSaving your iptables scripts\nThe service command permanently saves\
    \ the iptables configuration in /etc/sysconfig/iptables file. Here is a sample\
    \ /etc/sysconfig/iptables configuration that allows ICMP, IPSec (ESP and AH packets),\
    \ already established connections, and input SSH.\n\n```\n# /etc/sysconfig/iptables\n\
    # Generated by iptables-save v1.2.9 on Nov 8 11:00:07 2004\n:INPUT ACCEPT [0:0]\n\
    :FORWARD ACCEPT [0:0]\n:OUTPUT ACCEPT [144:12748]\n:RM-Firewall|-1-INPUT [0:0]\n\
    ```"
  merge: -1
  pgno: 216
