    /etc/rc.conf. Using rorder/rc sorts the scripts in /etc/rc.d and then runs them
    in order. The RC directories are numbered to correspond to the runlevel they denote.
    For instance, /etc/rc.d is the directory with additional directories rc0.d, rc1.d,
    rc2.d, rc3.d, rc4.d, rc5.d and rc6.d. When booting to runlevel 5, the init program
