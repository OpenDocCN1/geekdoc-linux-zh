  md: '# LAB-4: Setting up a dial-up PPP


    Objective:


    +   To connect to the Internet using dial-up PPP connection.


    Requirement:


    +   - Fedora Linux operating system

    - A dial-up connection


    Accessing to the Internet


    You have different ways to connect to the Internet. One of the most common of
    accessing Internet is setting up a dial-up connection. Setting up a dial-up connection
    requires ordinary telephone lines. A dial-up Internet connection either supports
    data transmission or voice call at particular time.


    Setting up a dial-up PPP


    Let''s learn to create an Internet connection. Perform the following steps to
    set a dial-up PPP.


    +   1. Click the **System** menu from the top panel of the GNOME desktop. A drop-down
    menu appears (Figure 1).

    2. Select the **Administration** option from the drop-down menu. A submenu appears
    (Figure 1).

    3. Select the **Network** option from the submenu (Figure 1).

    The **Query dialog box** appears (Figure 2).

    4. Type, root user''s password in the Password text box (Figure 2).

    5. Click the OK button (Figure 2).


    ![](img/5cfda308a5eba7fcc04c6aeafbe7fe3f_182_0.png)


    ![](img/5cfda308a5eba7fcc04c6aeafbe7fe3f_182_1.png)


    The Network Configuration window appears (Figure 3).


    +   6. Click the New button (Figure 3).

    7. The **Add new Device Type wizard** appears (Figure 4).

    8. Select the Modem connection option from the Device Type pane (Figure 4).

    9. Click the Forward button (Figure 4).'
  merge: -1
  pgno: 182
- img_proc: true
  md: "# 174 LAB\n\n![](img/5cfda308a5eba7fcc04c6aeafbe7fe3f_183_0.png)\n\n![](img/5cfda308a5eba7fcc04c6aeafbe7fe3f_183_1.png)\n\
    \n**Figure 3:** Network Configuration window\n\n**Figure 4:** Add New Device Type\n\
    \nThe wizard searches for the modem properties from the Select Modem wizard screen\
    \ appears.\n\n+   1. **Modem Device:** Lets you select the /dev/ttyS0 option for\
    \ first serial port (COM1) and the /dev/ttyS1 option for the second serial port\
    \ (COM2). This gets linked with the dev/modem option.\n   * **Baud Rate:** Refers\
    \ to the rate at which a computer communicates with a modem. By default, the baud\
    \ rate is 115200 bits per second.\n   * **Flow Control:** Prevents data from being\
    \ sent to the modem. You can select the software flow control (XON/XOFF) if the\
    \ hardware flow control (CRCTS) is not supported by the modem.\n   * **Modem Volume:**\
    \ Refers to the volume of sound of the modem. This property is set off by default.\n\
    \   * **Use Tone Dialing:** Refers to the option that allows you to set touch\
    \ tone dialing on your phones. If the phone does not support touch tone dialing,\
    \ you can turn it off, in most of the cases, it is turn on.\n\n+   2. Click the\
    \ Forward button. The Select Provider wizard appears. Specified the following\
    \ information of ISP in the Select Provider:\n   * **Internet Provider:** Refers\
    \ to the name of the ISP\n   * **Phone Number:** Refers to the phone number used\
    \ to connect to the ISP\n   * **Provider Name:** Refers to the name of the ISP\n\
    \   * **Login Name:** Refers to the name for the connection provided by the ISP\n\
    \   * **Password:** Refers to the password of your login\n\n+   3. Click the Forward\
    \ button. The IP settings wizard appears. If a dial connection is already present,\
    \ select the Automatically Obtain IP Address Settings box and if the ISP has a\
    \ static IP address, then select the Statistically Set IP Addresses box and enter\
    \ your IP address, subnet mask, and gateway address in the IP settings wizard.\
    \ Click the Forward button.\n\nThe *Dial-up connection window* appears. This window\
    \ displays the information you entered in the preceding steps.\n\n+   4. Click\
    \ the Apply button and then the Forward button.\nThe *Network Configuration window*\
    \ appears, displaying the new connection."
