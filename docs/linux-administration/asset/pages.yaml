    After learning connection to Microsoft networks, let''s learn about network services.


    # 3.2 Additional Network Services


    Any administrator can control the requests for the new or enhanced services up
    constantly. One commonly requested service is a timeserver. It is a service that
    provides the authoritative clock against which other systems on the LAN sync their
    clocks. In the following section you learn about two non-essential LAN based services:
    an NTP-based timeserver and a caching proxy server.

    Let''s configure a Time Server.


    +   - Configuring a timeserver


    A timeserver is a daemon that runs on one machine and to other systems synchronize
    their clocks. Generally, you synchronize your timeserver with one or more reference
    timeser that are situated outside your LAN. In some cases, the timeserver synchronizes
    its time with a specially designed clock. This hardware clock is a separate device
    meant for special purpose, that is, to maintain accuracy. Its main aim is to keep
    the system time consistent throughout the LAN to facilitate the time-sensitive
    operations. As irregularities in the system clocks between client system and the
    server can have adverse effects.


    The most important and widely-used protocol for distributing and synchronizing
    time is the Network Time Protocol (NTP).NTP is a protocol used to synchronize
    your Linux system''s clock with an accurate time source. The ntpd, NTP daemon
    is dual purpose. It acts as a server for listening time synchronization requests
    and providing the time in response and as a client, it adjusts the local system
    time by communicating with other timeservers.'
  merge: -1
  pgno: 78
- img_proc: true
  md: '# Chapter 3


    Following are the NTP utility programs:

    * ntpq: standard NTP query program

    * npdc: special NTP query program

    * ntpdate: set the date and time via NTP

    * sntp: Simple Network Time Protocol (SNTP) client

    * nptrace: trace a chain of NTP servers back to the given server

    * tickadj: set time-related kernel variables

    * nptime: read and set kernel time variables

    * ntp-keygen: generate public and private keys

    * ntpsim: Network Time Protocol (NTP) simulator

    Let''s learn to install NTP.


    # Installing NTP

    Generally, Linux system is preinstalled with NTP package. If not, perform the
    following tasks:


    +   * Install the NTP software.

    * Locate suitable timeserver to act as a reference clock.

    * Configure your local timeserver.

    * Start the NTP daemon on the local timeserver.

    * Check whether NTP daemon is responding to requests.


    Installing NTP is simple process. Type the following command to check whether
    NTP package is installed on your system or:


    ```

    $ rpmqueryntp

    ```


    The command returns an output showing version number of NTP package installed
    in your system, as shown below:


    ```

    ntp-4.2.4p7-2.fc11.1586

    ```


    Let''s learn about reference clocks and configuration of local time server.


    # Reference Clocks


    Timeservice accurate your time after synchronizing it with one or more reference
    clocks or master clocks. NTP works on distributed platform, meaning that servers
    and clients are spread worldwide, any given client can request a time check from
    any given server. NTP uses a hierarchical system of level clocks known as a stratum,
    to reduce the load on any given server or set of servers. The stratum level defines
    its distance from the reference clock and exists to prevent cyclic dependencies
    in the hierarchy. Stratum 1 servers are referred to as primary servers, stratum
    2 servers as secondary servers and so on. Secondary servers sync to primary servers
    and clients sync to tertiary servers. NTP also provide a large class of publicly
    accessible accessory servers, pool servers to be used by large scale. The NTP
    pool timeservers are organized into the subnet pool.ntp.org. Main idea behind
    using it is to distribute the client load more or less equally across all servers'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# Introduction to Microsoft Networks and Network Services 71


    participating in the pool and to ensure that clients are syncing to an appropriate
    distributes set timeservers.


    In the following section you configure an NTP server to use the pool servers and
    also learn to configure your local timeserver. The following is /etc/ntp.conf
    file:


    ```

    # For more information about this file, see the man pages

    restrict 127.0.0.1

    restrict -6 ::


    # OUR TIMERSVERS

    server 0.fedora.pool.ntp.org

    server 1.fedora.pool.ntp.org

    server 2.fedora.pool.ntp.org


    # GENERAL CONFIGURATIONS

    server 127.127.1.0 # local clock

    fudge 127.127.1.10 stratum 10

    driftfile /var/lib/ntp/drift

    broadcastdelay 0.008

    keys /etc/ntp/keys

    ```


    In the above configuration file, line showing restrict directive shows the list
    of restricted IP addresses or hostnames. Entries starting with server directive
    are used to identify the timeservers used as reference clocks. In this case pool.ntp.org,
    in this case ntppd is configured to use the pool servers. Even though the names
    are the same, the NTP server pool is configured to use DNS round robin, so that
    three hostname lookups on the same name return three different IP addresses. You
    can type the following command to check the working of round robin:


    ```

    $ host_pool.ntp.org

    ```


    The above command returns the following output:


    ```

    pool_ntp.org.localdomain has address 123.108.200.163

    ```


    Normally, a hostname resolves to one IP address. But when DNS round robin behavior
    is enabled, a single hostname resolves to multiple IP addresses.


    In the general configuration section of NTP configuration file, operational policies
    are set to control over''s default. The server127.127.1.0 instructs the NTP daemon
    to use the local clock if no external reference clocks are available. The fudge127.127.1.0
    stratum 10 limits the use of local clock by assigning a very low place in the
    timeserver hierarchy. The driftfile /var/lib/ntp/driftfile makes the timeserver
    oscillation frequency of the local clock, which is used to make required adjustments
    to adjust the system time. The broadcastdelay sets the number of seconds used
    to calculate the network delay between local server and remote server. The last
    line, /etc/ntp/keys tells NTP to find the cryptographic keys for every client
    and server matches.


    This prevents an unauthorized reference server from sending signals to your locals
    timeserver accidentally or deliberately. NTP version 4 (NTPv4) supports asymmetric
    encryption, more commonly known as public key encryption, using a method or protocol'
