    attempts to read a map file from disk, which provides information regarding available
    operating system. This map file is created at installation time of Linux or by
    executing ''lilo'' command at command prompts. After successful loading of LILO
    prints out ''O''; LILO loads and reads kernel from the disk with the help of information
    in the map file and starts booting.


    It is beneficial to make LILO as boot record, as it supports many kinds of operating
