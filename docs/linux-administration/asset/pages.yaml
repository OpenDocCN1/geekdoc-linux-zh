    # Setting up a USB printer


    Perform the following steps to set up a USB printer in Fedora:


    +   1. For a USB printer, plug the USB cable into the computer. You are prompted
    to install print drivers if they aren''t already installed, and Fedora detects
    which ones you need in most cases.

    2. Click **Install** to begin installing the drivers. If the system asks you to
    confirm installation of some additional packages apart from the print drivers,
    click **Continue** to install them.

