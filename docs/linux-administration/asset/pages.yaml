    The commented portion of directive is deleted to reduce the space consumption.
    Let''s discuss behavior of each directive.

    In the Server directive, the name of the log files or additional configuration
    files are appended. By the default core Server directive value is /etc/httpd.
    In the Pidfile directive, containing the PID of the server process is defined.
    By default its value is set to /httpd.pid Timeout directive defines the maximum
    time Apache waits for send and receive operations. It is defined in seconds and
    value is set to 120. The KeepAlive directive (value=On) sets the connection to
    the client of direct contact specified by KeepAliveTimeout. By it is set to Off.
    The MaxAliveRequests directive sets the number of requests permitted per connection.
    By default it supports 100. The KeepTimeout directive sets the number of seconds
    permitted to elapse between requests from the same client on the server before
    the connection closes. Its value is set to 15 if KeepAlive is set On.

    The StartServers directive defines the number of child servers created when Apache
    starts. By default 8 child servers are created when Apache starts. The MinSpareServers
    defines the minimum number of child servers permitted. By default value is 5,
    the MaxSpareServers defines the maximum value of child servers that can be spawned
    by the master server. The ServerLimit specifies the upper limit on the number
    of server processes of threads running simultaneously. By default upper limit
    is 256. The MaxClients directive sets the maximum number of supported connections.
    By default it is set to 256. The MaxRequestsPerChild defines the maximum number
    of requests each child server performs before terminating. 4000 is the default.

    The LoadModule directive loads the filename into the server and adds it to the
    list of active modules using the name. The Listen directive defines the combination
    of IP address and port on which Apache listens for connections. By default it
    listens to port 80 and you can use multiple directives. The Include directive
    includes the content of the files whose name end in .conf.

    For most cases, the default value in the configuration file is sufficient. Necessarily
    needs to change except reducing the MaxSpareServers and StartServers values to
    10 and 5 respectively. Setting the value of KeepAlive On, results in better performance.

    Let''s learn configuring the default.'
