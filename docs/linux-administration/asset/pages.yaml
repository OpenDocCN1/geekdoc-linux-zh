    # Enabling Password Aging


    It is advisable to require users to change their passwords periodically. To configure
    password expiration for a user run the following command:


    ```

    # chage [options] username

    ```


    where, options are command line options as described in Table 4.


    | Table 4: chage command line options |

    | Option | Description |

    | -d days | Specifies the number of days since January 1, 1970 the password was
    changed YYYY-MM-DD. |

    | -E date | Specifies the date on which the account is locked, in the format YYYY-MM-DD.
    Instead of the date, number of days since January 1, 1970 can also be used |

    | -l days | Specifies the number of inactive days after the password expiration
    before locking the account. If the value is 0, the account is not locked after
    the password expires Lists current account settings |

    | -m days | Specify the minimum number of days after which the user must change
    passwords. If the value is 0, the password does not expire |

    | -M days | Specify the maximum number of days for which the password is valid.
    When the number of days specified by this option plus the number of days specified
    with the -d is less than the current day, the user must change passwords before
    using the account |

    | -W days | Specifies the number of days before the password expiration date to
    warn the user |


