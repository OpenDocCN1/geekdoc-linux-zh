- img_proc: true
  md: "# To start iptables\n\nYou can start, stop, and restart iptables after booting\
    \ using the commands:\n\n```\nservice iptables start\nservice iptables stop\n\
    service iptables restart\n```\n\nTo get iptables configured to start at boot,\
    \ use the chconfig command:\n\n```\nchkconfig iptables on\n```\n\nCheck the status\
    \ of iptables whether it is running or not. Use the following command to check:\n\
    \n```\nservice iptables status\n```\n\n# Packet Processing in iptables\n\nAll\
    \ packets look, over by iptables pass through a sequence of built-in tables for\
    \ processing. There are three tables in total.\n\nThe first is the mangle table\
    \ which is responsible for the alteration of quality of service bits in the TOP\
    \ header. This is hardly used in a home or Soho environment.\n\nThe second table\
    \ is the filter queue which is responsible for packet filtering. It has three\
    \ built-in chains in which you can place your firewall rules. These are: \n\n\
    +   - **Forward chain**: Filters packets to servers protected by the firewall.\n\
    - **Input chain**: Filters packets destined for the firewall.\n- **Output chain**:\
    \ Filters packets originating from the firewall.\n\nThe third table is the nat\
    \ queue which is responsible for the destination address of the packet needs to\
    \ be changed.\n\n+   - **Pre-routing chain**: NATs packets when the destination\
    \ address of the packet needs to be changed\n- **Post-routing chain**: NATs packets\
    \ when the source address of the packet needs to be changed\n\nEach firewall rule\
    \ inspects each IP packet and tries to identify it as the target of some operation.\
    \ Once a target is identified, the packet needs to jump over it for further processing.\
    \ The built-in tables that iptables uses: ACCEPT, DROP, LOG, REJECT, DNAT, SNAT,\
    \ MASQUERADE\n\nEach line of an iptables script has a command line options that\
    \ are used to append rules to match your defined packet characteristics. The most\
    \ common options are:\n\n| Table-1 showing the command line options |\n| Commands\
    \ | Description |\n| - | - |\n| -t <table> | If you don't specify a table, then\
    \ the filter table is assumed |\n| -j <target> | Jump to the specified target\
    \ when the packet matches the current rule. |\n| -A | Append rule to end of a\
    \ chain |"
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Table-1 showing the command line options


    | Commands | Description |

    | :--- | :--- |

    | -F | Flush. Deletes all the rules in the selected table |

    | -p <protocol-type> | Match protocol. Types include, icmp, tcp, udp, and all
    |

    | -s <ip-address> | Match source IP address |

    | -d <ip-address> | Match destination IP address |

    | -i <interface-name> | Match "input" interface on which the packet enters |

    | -o <interface-name> | Match "output" interface on which the packet exits |


    Example:


    ```

    iptables -A INPUT -s 0/0 -i eth0 -d 192.168.1.58 -p TCP -j ACCEPT

    ```


    iptables is configured to allow the firewall to accept TCP packets coming in interface
    eth0 from any IP address destined for the firewall''s IP address of 192.168.1.1.
    The 0/0 representation of an IP address means.

    Some of the common TCP and UDP Match Criteria are listed in the Table-2:


    # Table-2 showing the common TCP and UDP Match Criteria


    | Switch | Description |

    | :--- | :--- |

    | -p tcp --sport <port> | TCP source port. Can be a single value or a range in
    the format: start-port-number:port-number |

    | -p tcp --dport <port> | TCP destination port. Can be a single value or a range
    in the format: starting-port:ending-port |

    | -p tcp --syn | Used to identify a new TCP connection request. syn means, not
    a new connection request |

    | -p udp --sport <port> | UDP source port. Can be a single value or a range in
    the format: starting-port:ending-port |

    | -p udp --dport <port> | UDP destination port. Can be a single value or a range
    in the format: starting-port:ending-port |


    ```

    iptables -A FORWARD -s 0/0 -i eth0 -d 192.168.1.58 -p TCP -j ACCEPT

    --sport 1024:65535 --dport 80 -j ACCEPT

    ```


    iptables is configured to allow the firewall to accept TCP packets for routing
    when they enter on interface eth0 from any IP address and are destined for an
    IP address of 192.168.1.58 that is reachable via interface eth1. The source port
    is in the range 1024 to 65535 and the destination port is port 80 (www/http).

    Some of the common ICMP (Ping) Match Criteria are listed in the Table-3:'
