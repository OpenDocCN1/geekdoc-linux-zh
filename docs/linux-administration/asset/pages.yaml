    Let''s learn about search functionality ht://Dig.


    # Adding Search Functionality


    Fedora core facilitates ht://Dig search engine. It is a complete document searching
    and indexing system designed for a single domain or an intranet. It is capable
    of searching sites or domains that comprise multiple servers and thousands of
    documents. Lt://Dig handles thousands of documents because it uses a static search
    index that is very fast. Some of the major features of ht://Dig are:


    +   **Intranet searching:** It has the ability to search through many servers
    on a network by acting as a WWW browser.

    **Free available:** The whole system is released as free software under the GNU
    General Public License.

    **Boolean expression searching:** It can search complex data using Boolean expressions.

    **Configurable search results:** The output of a search can easily be configured
    to your needs through HTML templates.

    **Fuzzy searching:** Searches can be performed using configurable algorithms.
    Currently the following algorithms are supported (in any combination): exact,
    soundex, metaphor, common word endings (stemming), synonyms, accent stripping,
    substring and prefix

    **Searching of HTML and text files:** Both HTML documents and plain text files
    can be searched.

    **Keywords can be added to HTML documents:** Any number of keywords can be added
    to HTML documents which will not show up when the document is viewed.'
