    # Remote Desktop using VNC


    +   1. Run the following command to install VNC server on fedora:


    ```

    yum install tigervnc-server

    ```


    +   2. Provide the user name and password of the account for which you are configuring
    VNC.

    3. Start the vnc server by the following command:


    ```

    vncserver :1

    ```


    +   4. Then stop the vnc server using the following command:


    ```

    vncserver -kill :1

    ```


    +   5. Edit the following file /home/vamin/.vnc/xstartup by commenting the line
    that reads:


    ```

    #twm &

    ```


    +   6. Add at the last line


    ```

    exec gnome-session &

    ```


    +   7. Next run the following command:


    ```

    vncserver :1 -geometry 800x600 -depth 24

    ```


    +   8. Install VNC viewer on the client computer (in our case we are using Windows
    7 as client).

    9. Start VNC viewer after installing, a VNC viewer : Connection Details window
    appears, as shown in Figure 4:'
