  md: '# Chapter 3


    # Optimizing Network Services


    To improve the performance Fedora Core networking services some useful steps are
    required to eliminate the unnecessary wastage of resources and getting an improved
    overall throughput. In the following section you learn about the measures that
    you can implement to optimize your X Windows, NFS, NIS and your SAMBA services.
    These measures are only a starting point towards optimization, performance tuning
    is a never ending procedure.

    Let''s discuss these steps. First, learn how to optimize your X Windows system.


    # Optimizing the X Windows System


    X Window system enables the applications on one host to display on another host
    connected over any kind of network (LAN or Internet). Optimizing the X Windows
    system is not a matter of following basic steps. By using the available hardware
    such as mouse, graphics card, monitor and keyboard in the best way possible, the
    configuration of X Windows system can be optimized manually. Steps can be taken
    to improve the performance of X Windows:


    +   - Properly configuring the hardware (including upgrading your hardware)on
    which you are running X brings the biggest improvement in performance.

    - It is recommended to use a lightweight window manager and reduce the color depth
    at which you run X.

    - Avoid using full-color background wallpaper, as a solid-color image is much
    memory-intensive. Shaped windows and borders are resource expensive therefore
    should be avoided.

    - Run a local font server as they to be sent across the network. Remove the fonts
    that are not in use to free up memory and speed up the server''s font handling.

    - Make sure to use updated X server and drivers.

    - Unload the modules that are not required to free the memory.

    - Run X at a lower value that, by increasing its priority relative to other processes,
    you can get better throughput.


    Always remember to make careful configuration to your X windows, as any wrong
    step can cause irreparable damage to your hardware. The above suggestion one by
    one to pinpoint the level of improvement.

    Now learn to optimize NFS.


    # Optimizing NFS


    It is necessary to analyze your environment, both from the client and from the
    server point of view for optimal performance. NFS is sensitive to network performance,
    especially to network blocking and bandwidth problems. Here are few suggestions
    that can improve a system''s performance of an NFS:


    +   - By using a journaling file system for an NFS, you can recover data more
    quickly at the time of a crash than non-journaling file systems. It also maintains
    data integrity.

    - It is suggested to use multiple disks. Spreading NFS file systems across multiple
    disks, can avoid and reduce I/O traffic. This improves overall performance of
    the I/O subsystem.'
  merge: -1
  pgno: 87
