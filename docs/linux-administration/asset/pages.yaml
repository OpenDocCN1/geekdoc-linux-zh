    Generally, userdel -r deletes files in ftp''s home directory (/var/ftp), root
    does, but it fails to remove files in this case because the ftp user does not
    own /var/ftp, userdel also removes the entry from /etc/group, executing group
    is not required. The command locates all the files owned by the ftp user and deletes
    them. Use numeric UID (50) in place of the username (ftp) because the username
    no longer exists.


    This is not a good practice to disable anonymous FTP in this way if you want to
    permit anonymous FTP later; you will need to recreate the ftp user and group.
