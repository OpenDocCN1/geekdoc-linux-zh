    # Configuring a Primary Master Server


    The /etc/named.conf file on the master server needs to be modified. Add the following
    lines to the /etc/named.conf:


    ```

    zone "tacttechnology.com" {

    notify no;

    typemaster;

    file"tactech.com";

    };

    ```


    Add the following for the reverse lookup:


    ```

    zone "1.168.192.in-addr.arpa" {

    notify no;

    type master;

    file"tac.rev";

    };

    ```


    Always use the same names for the files on the master server as the slave server.
    As these files are downloaded by the slave in a zone transfer and stored on the
    slave in the files shown by the option. Now create the zone files that are referenced
    by the /etc/named.conf. Add name server and mail exchange information. Finally
    add information about your local host, FTP and webserver. Now set up the reverse
    lookup zone file, and add information about your name servers and their IP addresses.


    After the changes, restart the named daemon using following command:


    ```

    service named restart

    ```


    Your name server is ready to use after all the above steps. Let''s perform the
