  md: '# Creating Mailing Lists through Mailman


    Mailing list is an easy way to allow people who share a common interest or goal
    to communicate with each other. There are many mailing list managers available
    in which Mailman is one of the most popular. Mailman is the GNU Mailing List Manager.
    The most vital feature of using Mailman is that it facilitates a browser-based
    interface for administration. It can be used by groups whose members or participants
    are geographically dispersed. Some of the features of Mailman are:


    +   - Support archiving of messages and spam filtering

    - Provides individual customizable home page for every mailing list.

    - Automatic bounce processing

    - Multiple list owners and moderators

    - Per-list privacy features, such as closed-subscriptions, private archives, private
    membership rosters, and sender-based posting rules

    - Support for virtual domains

    - Web subscribing and unsub

    - Digest creation, maintenance and delivery

    - Integrated Usenet gateway

    - Password-based authentication

    - Subscription blacklists


    Before configuring Mailman, run the following commands to ensure that Mailman
    is installed in your system or not:


    ```

    # rpmquery mailman

    mailman-2.12-4.fc11.i586

    ```


    Install Mailman if not already installed. If you get the above output, then your
    Mailman is already installed on your system and you can proceed further to configure
    it. Use the following procedure to complete your Mailman configuration:


    +   - Edit the /etc/httpd/conf.d/mailman.conf, to set the domain for the Web server
    appropriately. Find the following line that read:


    ```

    RedirectMatch ^/mailman[/]* http://www.example.com/mailman/listinfo

    ```


    Uncomment the line above and change www.example.com to the domain of your Web
    server. For example:


    ```

    RedirectMatch ^/mailman[/]* http://localhost/mailman/listinfo

    ```


    +   - Restart Apache:


    ```

    # servicehttpd restart

    ```'
