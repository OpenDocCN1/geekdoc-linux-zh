- img_proc: true
  md: 'Domain Name System and Mail Services 99


    # Mail User Agent (MUA)


    MUA allows a user to read and compose email messages. It is widely referred to
    as mail client. The MUA provides an interface for reading and writing email messages.
    There are two types of MUAs available: graphical user interface (GUI) and command
    line interface (CLI). Both provide the same functionality. The MUA sends the composed
    email message to a Mail Transfer Agent (MTA) to transmit the message across the
    network.


    Let''s now study about MTA.


    # Mail Transfer Agent (MTA)


    MTA is the program that is responsible to send the message across the network.
    MTA works without intervention of the user, as most of the users are not aware
    of MTA. The MTA reads the information in the TO: section of the email message
    and determines the IP address of the recipient''s mail server. MTA then tries
    to connect to the recipient''s server through TCP/IP port (typically port 25).
    MTA queries a DNS mail exchanger to determine the host which is responsible for
    receiving mail for that. After establishing the connection with the destination
    MTA, it transmits the message using Simple Mail Transfer Protocol (SMTP).


    In some cases, when a message is not deliverable, the MTA stores it in a local
    queue and attempt retransmission after some delay. In some cases the MTA refuses
    delivery, causing the message to bounce and return it to the sender''s MTA.


    When none of the above problems occurs, the MTA adds header information to the
    message. This header contains information tracking the message and describing
    the delivery of message. Finally the MTA passes the message to another program
    called mail delivery agent to deliver the message to the recipient''s mailbox.


    Let''s now study about MDA.


    # Mail Delivery Agent (MDA)


    MDA receives the message from MTA. It stores it into the new message in the recipient''s
    mailbox file (known as mail spool). In many cases, the MDA is actually a Local
    Delivery Agent (LDA). Any program that actually handles a message for delivery
    to the point where it can be read by an client application can be considered an
    MDA.


    > The default MTA installed on your Fedora core is Sendmail. One popular MDA installed
    on your Fedora core is proc mail.


    After a brief introduction involved in mail services, let''s study about SMTP.


    +   - Introducing SMTP


    You learn in the previous section, that SMTP is used to send messages between
    MTAs. SMTP is the TCP/IP protocol used for transferring email messages between
    computers on a network. It is also referred as store and forward protocol:


    +   - Messages sent through SMTP go directly from the sender''s MTA to the recipient
    MTA


    +   - When a message is not delivered due to network conditions the MTA store
    it and attempt retransmission


    The SMTP protocol can transfer only ASCII text. It does not support fonts, colors,
    graphics or attachments. When MIME (Multipurpose Internet Mail Extensions) protocol
    with SMTP if you want to send these items.'
