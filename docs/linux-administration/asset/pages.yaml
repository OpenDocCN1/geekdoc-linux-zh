  md: "# Chapter 4\n\nserver\n\nIn server statement, you define the properties and\
    \ behavior of remote server. You can specify how local server access or respond\
    \ to a defined remote server, especially in regards to notifications and zone\
    \ transfers. Server statement syntax is same as other statements; following are\
    \ the valid values for server statement:\n\n+   - bogus: Specify ‘yes’ for not\
    \ querying remote server and “no” to send queries to the remote server.\n- transfer:\
    \ Specify the number of transfer.\n- transfer-format: Specify whether you want\
    \ one-answer or many-answers.\n- keys: Specify key ID.\n\nzone\n\nThe zone statements\
    \ refer to the zone files. Each statement starts with the word zone followed by\
    \ the domain name and data class. The data classes are, hs, hesiod and chaos.\
    \ The data class is default for internet.Next followed by the type option specifies\
    \ the server as a master, slave/stub or hint server. A stub server loads only\
    \ the NS records. The hints file is used to initialize the root cache and contains\
    \ a list of root servers.Further it is followed with the name of the zone file\
    \ for the specified zone. The most common options for the zone statements are\
    \ as follows:\n\n+   - allow-query: It specifies the clients that are allowed\
    \ to request information about this zone (default= allow).\n- allow-transfer:\
    \ It specifies the slave servers that are allowed to request a transfer of the\
    \ zone's information (default= allow).\n- allow-update: It specifies the hosts\
    \ that are allowed to dynamically update information in their zone(default= deny).\n\
    - file: It specifies the name of the file in the named working directory that\
    \ contains the zone's configuration data.\n- masters: It the IP addresses from\
    \ which to reach authoritative zone\n- notify: It specifies whether or not notified\
    \ members the slave servers when a zone is updated. This directive accepts yes\
    \ or no options.\n\nA zone statement takes the following form:\n\n```\nzone<name><zone-class>\
    \ {\n<zone-options>;\n  [zone-options>; ...]\n};\n```\n\nIn this statement,\n\
    <zone-name> is the name of the zone,\n<zone-class> is the optional class of the\
    \ zone, and\n<zone-options> is a list of options characterizing the zone.\nZone\
    \ files contain resource record (RR) about IP addresses. A zone file can contain\
    \ the following types of RRs:\n\n+   - Start of Authority (SOA)"
