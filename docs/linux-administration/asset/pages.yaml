  md: '# Installing and Configuring Application Software


    In order to ensure a correct execution environment a system administrator provides
    the software which is well configured and validated. To make an application run
    smoothly and produce the expected results system administrator guarantees the
    required configurations. They provide a mechanism for scheduling a software installation
    process, ensure adequate memory allotment and resolves software failure and dependency
    issues.


    Configuration and management of applications set the baseline for user to interact
    with application. For this, a system administrator provides default configurations,
    which are known as Skeleton configurations. This includes configuring user desktop
    to provide access as well as restricting its to access to various applications.
    For example, a company system administrator will provide this configuration. System
    administrator provides a set of activities to control hardware and software configurations
    and maintain policies for different ownership for prompting the software.


    Let''s study about responsibilities of Linux System administrator in creating
    and maintaining user account.


    # Creating and Maintaining User Accounts


    To access any computer, a user has an account through which a computer differentiates
    between users. An account is created for each user, which contains all the files
    and information regarding that particular user.


    A user can access any account but a system administrator has access on every user
    accounts as it logs in. They access accounts on the daily basis. System administrator
    performs some administrative tasks which include creating and manipulating user
    accounts (add, modify, delete, or copy accounts), change password whenever required,
    defining a deal of related users who can share access to a file or directory and
    providing access to connect to server. He/she is also responsible for maintaining
    security by providing role on a user account that defines the level of access.


    Let'' study about responsibilities of Linux System administrator in backing up
    and restoring files.


    # Backing Up and Restoring Files


    Data is the one and important investment in computers; you should protect it,
    as data is valuable and can cost you effort to rebuild it. You should take steps
    to avoid loss of data. Files can be lost by either a hardware or software failure,
    by human or natural action, accidental deletion of files, or when you reinstall
    or upgrade a system.


    Loss of data can be varied to a wide range of inconvenience. Hardware problems
    can be corrected by properly configuring the device or merely replacing it, if
    required. Software bugs are also caused by improper configuration and can be corrected
    by finding the roots of files. Human actions are unpredictable; they can destroy
    data mistakenly or purposely. There can be a natural disaster any time that can
    create.


    To minimize the disruption of data, the system administrator maintains backups
    of files, to restore them whenever required. Backing up files is one of the most
    critical tasks in system administration. Backing up files means storing a copy
    or copies of data on some removable media such as hard disk, tape as a protection
    against loss. Restoring files means copying the backup files from removable media
    to the working directory. It is suggested to maintain proper and regular backups
    to prevent damage to data. While backing up the files'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Chapter 1


    you may need to choose a suitable storage medium (removable media) by considering
    its cost, speed and usability. At the time of backing up files, System administrator
    needs to decide the ''what'' and ''how'' factors.


    +   - What are the necessary files to backup?

    - How frequently backups should be performed?


    Based on the level of damage, restoring the backup files is as significant as
