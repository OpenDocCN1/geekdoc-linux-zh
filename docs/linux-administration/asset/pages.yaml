  md: "# 208 LAB\n\n```\n-A INPUT -j Rh-Firewall-1-INPUT\n-A FORWARD -j Rh-Firewall-2-INPUT\n\
    -A Rh-Firewall-1-INPUT -lo -m icmp --icmp-type 255 -j ACCEPT\n-A Rh-Firewall-1-INPUT\
    \ -p esp -j ACCEPT\n-A Rh-Firewall-1-INPUT -p ah -m state RELATED,ESTABLISHED\
    \ -j ACCEPT\n-A Rh-Firewall-1-INPUT -p tcp -m state NEW -m tcp --dport 22 -j ACCEPT\n\
    ACCEPT\n-A Rh-Firewall-1-INPUT -j REJECT --reject-with-icmp-host-prohibited\n\
    COMMIT\n# Created on Mon Nov 8 11:00:00 2004\n```\n\n# Fedora's iptables generator\n\
    \nFedora comes with a program called tshirt that you can use to generate a firewall\
    \ rule set. It prompts for the level of security and gives you the option of doing\
    \ simple customizations. The tshirt saves firewall rules in a new /etc/sysconfig/iptables\
    \ file for the next reboot.\n\n# Sample iptables scripts\n\nThis section provides\
    \ some sample scripts to get iptables working for you. Pay special attention to\
    \ the logging example at the end.\nThe basic initialization snippet should also\
    \ be included in all your scripts to ensure the correct initialization of your\
    \ chains should you decide to restart your script after startup. This chapter\
    \ also includes others that will help you get basic functionality. It should be\
    \ a good guide to get you started.\n\n# Allow DNS to your Firewall\n\nThe following\
    \ statements apply to firewalls acting as DNS clients and also for firewalls working\
    \ in a caching or resolving server role.\n\n```\niptables -A OUTPUT -p udp -o\
    \ eth0 --dport 53 --sport 1024:65535 \\\n-j ACCEPT\niptables -A INPUT -p udp -i\
    \ eth0 --sport 53 --dport 1024:65535 \\\n-j ACCEPT\n```\n\n# Allow WWW and SSH\
    \ access to your Firewall\n\nThe following statement is for a firewall that serves\
    \ as a web server that is managed remotely by your system administrator via secure\
    \ (SSH) connections. Inbound packets for ports 80 and 22 are allowed thereby making\
    \ the first steps in establishing a connection. Connections initiated by persons\
    \ logged into the Web server are denied as outbound NEW connections arent allowed.\n\
    \n```\n# Allow previously established connections\niptables -A OUTPUT -o eth0\
    \ -m state ESTABLISHED,RELATED \\\n-j ACCEPT\n\n Allow port 80 (www) and 22 (SSH)\
    \ connections to the firewall\niptables -A INPUT -p tcp -i eth0 --dport 22 --sport\
    \ 1024:65535 \\\n-m state --state NEW -j ACCEPT\n```"
