  md: '# Chapter 5


    defines its feature set. Apache enfolds some qualities like speed, configurability,
    stability and rich feature set. Some of the features are:


    +   - Apache is easily extensible using Dynamic Shared Objects (DSOs), commonly
    known as modules. They can be dynamically loaded and unloaded at runtime, excluding
    the recomputation mechanism.


    +   - Apache also facilitate authentication mechanism. You can use a simple text
    file, a binary database format that supports multi-hosted servers. It enables
    a single machine to provide web servers for multiple domains.


    +   - It also supports virtual hosts when one instance of a client request adjusts
    to directory URL


    +   - Apache provides support for server logging. You can define custom log file
    formats as well as control the level of content in each log entry.


    +   - Apache automatically adjusts to the capabilities of connected Web clients,
    one instance of a more general process called negotiation. Content negotiation
    refers to the technique through which Web clients and servers use to select how
    to present a resource. For example a document can be available in many formats.
    It enables the client to choose the appropriate language automatically.


    It is easy to configure Apache and also is easy to reconfigure it. Configuration
    information is stored in plain-text files and uses simple English-language directives.
    Reconfiguring involves changing the appropriate configuration directive and reloading
    the configuration file.


    Before learning configuration of Apache, you must know how basically works. Normally
    a web browser requests a page and the Apache server responds. But what the actual
    process is going on between these two destinations, this you learn in the following
    section.


    The web client which basically our browser first performs the DNS lookup on the
    server name specified in the URL to get the IP address of the server and then
    connects to port 80 at that IP address. After establishing the connection, the
    client sends an HTTP GET request for the document in the URL. Upon receiving the
    request, server translates the document URL into the file name on the local system.
    Next Apache checks the requested document for access control. If access is effect,
    Apache requests for credentials from the clients or rejects it. If no access is
    granted, Apache satisfies the request.


    If the requested URL specifies a directory rather than a document, Apache looks
    for the directory index page (index.html) by default and returns the document
    to the client. If this index page is missing, Apache sends a directory listing
    in HTML format back to the client or returns an error message.


    Finally, after transmitting the requested document and the client also closes
    the connection and Apache writes an entry in one or more log files describing
    various levels of request.


    Let''s learn to configure Apache.'
