  md: '# LAB-15: Working with X-windows


    Objective:


    +   - Switching between text and graphical consoles

    - Setting up display and mouse for the x-server

    - Installing KDE

    - Remote Desktop using VNC


    Requirement:


    +   - Fedora Linux operating system

    - NFS Server (Example: server.lab.com, IP address: 192.168.0.0)

    - NFS Client (Example: client.lab.com, IP address: 192.168.0.101)

    - Another operating system to run VNC


    # Switching between text and graphical consoles


    While working on Linux you can have many consoles opened at the same time. You
    can switch between text consoles using the keys of keyboard as described following:


    +   - Use <Ctrl> + <Alt> + <F1> to switch to the first text console at any time.

    - Use <Ctrl> + <Alt> + <F2> to switch to the second text console at any time.

    - Use <Ctrl> + <Alt> + <F3> to switch to the third text console at any time.

    - You can use up to <Ctrl> + <Alt> + <F6> for the total of 6 text consoles.


    Similarly, you can switch between graphical consoles using the keys of keyboard
    as described following:


    +   - Use <Ctrl> + <Alt> + <F7> to switch to the first graphical user interface
    (GUI) console at any time.

    - Use <Ctrl> + <Alt> + <F8> to switch to the second graphical user interface (GUI)
    console at any time.

    - You can use up to <Ctrl> + <Alt> + <F11> for the total of 5 GUI consoles.


    # Setting up Display and Mouse for the X-server


    There are two ways to configure X server on Fedora Core. First is X Configuration
    tool, which enables you to apply changes in the settings such as display, monitor,
    video cards and mouse settings. The other way is editing the X Configuration file
    (/etc/x11/xorg.conf) directly.


    # Setting through X Configuration


    To apply settings in display, Select System -> Preferences -> Display. Display
    Preferences window appears (Figure 1). Make the necessary changes in the Resolution,
    Refresh Rate and Rotation option. Click Apply to apply the display settings.'
  merge: -1
