  md: '# 05 Apache Web Server


    | OBJECTIVES |

    |---| Introducing the Apache Web Server |

    | Describing Web services |


    Apache Web server is the most popular Web server. It is used to create an inexpensive
    and stable Web server. This chapter provides an introduction of Apache Web server.
    You learn how to configure and maintain the Apache Web server on your Fedora core.
    In addition to this, you learn to configure Apache to support server-side includes,
    CGI, SSI and PHP. Next, you explore to create a secure Web server using SSL.


    This chapter further shows how Web services are beneficial to you. This explains
    the mailing list of Web services. The Fedora core list manager, Mailman is introduced
    to you in this section. You learn to set up Web-based or browser-based access
    through SquirrelMail. Further you explore RSS feed, its features and its configuration.
    At the end of the chapter you learn about Fedora core: //Dig search engine.


    Let''s start with introduction of Apache Web.


    # 5.1 Introducing Apache Web Server


    Apache is the most widely used HTTP-server in the world today. It is also used
    as Linux system server. Apache is software that displays and serves HTML pages
    hosted on a server to a browser that understands the HTML code. It can become
    powerful software when mixed with third party modules and programs. It is a powerful
    and secure web server that can be hosting anything from personal websites to corporate
    domains. It provides strong and useful services to a client browser.


    Apache is considered one of the stable web servers:


    +   - There are fewer bugs. Apache''s web server is freely available, so is worked
    upon hundreds of developers. Bugs found in the source code are fixed by them and
    they also submit the correction in the source code. In this way Apache has been
    tested in real world environments.


    +   - Due to constant complaints and problems from the web site administrator
    while using Apache, resulted into making Apache a secure whenever. Frequent patches
    are released preventing the confirmed bugs and security holes.


    Apache is an open-source software project therefore anyone contribute better code
    for inclusion in the server. Acceptance of that code merely depends on the members
    of the core Apache team. But continuous feedbacks and bug detection drives Apache''s
    development and'
  merge: -1
