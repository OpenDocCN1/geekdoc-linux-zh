  md: '# # Security tools


    Ensure ne''er-wells don''t get their hands on your system and files.


    # ## ZULUCrypt


    While you can control access to the data on your computer using accounts and file
    permissions, they aren''t enough to prevent a determined intruder from gaining
    access to your private files. The only reliable mechanism for protecting your
    personal data is to encrypt it. Working with encrypted data is an involved process,
    but it''ll go a long way in reinforcing your security and insulating your data.


    ZuluCrypt is a graphical encryption tool that has an intuitive, easy-to-follow
    interface. Using the program you can create an encrypted device within a file,
    and partition USB disk. It can also encrypt individual files with GPG. ZuluCrypt
    can also perform volume encryption, which means it can encrypt everything within
    a cipher device. The device can be a whole disk, partition or a file mounted as
    a loopback device. With block device


    encryption, the user creates the file system on the block device, and the encryption
    layer transparently encrypts the data before writing to the actual lower block
    device. The storage area appears just like a large file, which doesn''t even reveal
    its directory structure. All these functions and more accessible via the excellent
    user interface. http://mhomongchu.github.io/zuluCrypt


    # ## GUFW


    GUFW is the graphical front end for UFW, the uncomplicated firewall, which is
    one of the easiest for iptables. This tool has a simple interface and preferences
    for regulating incoming and outgoing traffic. You can configure the incoming and
    outgoing policies of the profiles as you prefer. You can also use GUFW to define
    specific rules for allowing or blocking individual apps and services. http://ufw.org/


    ![](img/5f8379eaeda572d04307c37d75b0ba5d_175_0.png)


    Switch to the Report tab to get the network traffic report.


    # ## BITWARDEN


    The Bitwarden password manager uses end-to-end encryption and AES 256-bit encryption
    to secure your data. It does this through its unique little trick of storing your
    passwords in a remote Microsoft Azure cloud. You can also import passwords from
    various sources. https://bitwarden.com


    # ## STEGOSTEP


    Steganography is the art of concealing data inside seemingly harmless message
    or image. The most common mechanism for embedding it is by replacing unused data
    in graphical file with bits of information that isn''t visible when viewing the
    original piece of data. Steganography is used to complement encryption.


    StegoStep is a graphical tool that can hide text messages as well as any type
    of file inside an image. To insert, point to the file you want to hide inside
    and enter a secret key. To get the secrets from the image once again and use the
    Extract button with the secret key to reveal the hidden messages and from image.
    https://stegostep.org


    ![](img/5f8379eaeda572d04307c37d75b0ba5d_175_1.png)


    # MTR


    MTR is a simple network diagnostic tool that combines the functionality of traceoute
    and ping. It displays with the path of the packet a wealth of relevant information.
    http://www.pingand.net/mtr


    # A


    You can use aide to detect sort injections, checking the integrity of the files
    by their properties such as a baseline created on the initial run. http://aide.sourceforge.net


    # NIKTO2


    A CLI web server scanner that hunts for problems like server misconfigurations
    and outdated versions and files. It can also perform tests against security vulnerabilities.
    https://cert.net/nikto2


    # JOHN THE RIPPER


    A password cracker, John is famous for exposing weak attacks. It''s a CLI tool
    with a graphical interface called John exposes its various command lines.


    # MALTRAIT


    Maltrait is a traffic detection system that uses publicly accessible blocklists,
    custom-defined lists to detect and log malicious traffic. https://github.com/stammparam/maltrait


    # ## OSQUERY


    You can keep an eye on your network using the OSQUERY tool that enables you to
    turn your queries into a Database. You can use the tool to check logged in, keep
    an eye on the newly, identified faulty connections and keep an eye on the local
    network modules and the running processes. https://osquery.io'
