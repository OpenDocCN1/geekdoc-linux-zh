  md: '# FOSS


    # Protecting against the

    hazards of the internet.


    The applications featured in this Roundup provide different tools and software
    to safeguard your privacy of communications and the safety of your machines.

    In addition to default settings, many other methods can protect you from viruses
    and ad-plugins.

    You may have heard of using BOGoth or MailAssassin to detect and block spam messages
    with Evolution, KMail, and Claws. The core package includes several useful plug-ins
    like Blogfather, if you''ve installed it, or if you use anti-virus software like
    Bitdefender, you must install the anti-mail-plugins.

    KMail''s anti-spam and anti-virus widgets help you configure the respect tools.
    You may already have the tools installed to handle viruses, such as ClAV. If no
    tools are found, the wizard will merely inform you. We do not recommend any tools.
    Some users have reported problems with the wizard detecting anti-virus tools.
    Still, KMail''s performance is considerably slower, as each message is scanned
    for viruses.

    Thunderbird has an junk mail filter, which improves its filtering depending on
    what you mark as spam. All incoming messages pass through the filter, and you
    can get


    ![](img/5f8379eaeda572d04307c37d75b0ba5d_123_0.png)


    Even though it says OpenPP, it is possible to configure Evolution to work with
    GPG as well.


    Thunderbird wants to alert you about potential phishing emails, and also when
    a link in a message leads you to a website other than the one indicated.

    With the exception of Mailspring, all the clients can be configured to work with
    spam detection and encryption, by using popular GPG.


    # VERDICT


    | CLAWS'' MAIL | 10/10 | MAILSPRING | N/A |

    | EVOLUTION | 10/10 | THUNDERBIRD | 10/10 |

    | KMAIL | 10/10 | | |


    Despite repeated feature requests, Mailspring doesn''t have any encryption-or-spam
    capabilities.


    # Other features

    Will it make your breakfast?


    With the web browser, the applications are one of the most recognizable components
    of the desktop.

    What we started as a basic way to communicate with your contacts has expanded
    to vast feature set. Not all users would want their email client to set reminders
    or use up as a calendar. But for those who use it daily, it''s probably best to
    use just one, rather than several.

    Evolution offers free Personal Information Manager (PIM), a calendar, address
    book and a task manager. You can get the same features with Thunderbird in the
    KDE environment, with other well-known KDE components such as Contacts and KOrganizer.

    If you speak a language other than English and receive emails, you''ll appreciate
    Mailspring''s ability to translate emails written in English, Russian, simplified
    Chinese, French, and German. You can also adjust your language-preference and
    various message settings. It''s especially tailored for touch devices and configurable
    gestures as you swipe left or right.

    Unlike the other tools, Thunderbird can also connect with social network accounts.
    It keeps record of all your messages with your contacts. The advantage of its
    multi-channel chat support is that you can use the search feature to go through
    past conversations and emails exchanged with your contacts. Would you ever need
    to perform a search on the web, you can do so from the


    ![](img/5f8379eaeda572d04307c37d75b0ba5d_123_1.png)


    As many emails block based on size, you can configure

    Thunderbird to connect with your account on


    bar within the application, instead of switching over a web-browser, and can even
    search the search engine you wish. Claws-doesn''t provide any features out of
    the box but you can get all the same functionality with the use of it. It can
    easily be used as a news aggregator, manage appointments, and more. Evolution
    and Thunderbird are more resource hungry than the others. To consider if you use
