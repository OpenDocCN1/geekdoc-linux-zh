  md: '# User-friendly usability


    Some Linux distributions go out of their way to make new users comfortable. We
    shine a spotlight on those welcoming distros.


    Let''s look at Linux Mint, which continues to be favourite of ours. In particular,
    I would still recommend it to users who are taking their first steps with Linux.
    The 1.0 release which was based on Ubuntu took the codebase and built upon with
    Codering and FIMEware for a better out-of-the-box experience. With its own codebase
    for a couple of years, and since then they have returned to Ubuntu-though the
    latest version brings back the treasure trove of Ubuntu repositories, proving
    its own ownership.


    ![](img/5f8379eaeda572d04307c37d75b0ba5d_11_0.png)


    When Ubuntu switched to its latest version, Mint offered more convenient alternatives
    in the form of Cinnamon (which first appeared in Mint). Cinnamon was created on
    Gnome 3, but soon became its default. For those who prefer, they also offered
    the MATE desktop or Gnome 2. Cinnamon and Mate continue to thrive. 32-bit Ubuntu
    is still available but Mint went ahead and produced our 32-bit packages still
    available in the case for the latest edition, Mint 20 is 64-bit only.


    We''re still waiting for Mint 20 to arrive and the team to have really learned
    something about what to expect. In previous releases, we learned more about Ubuntu
    than what we''ve received from Ubuntu. For example, the ''anonymery'' telemetry
    that you have out of sending in Ubuntu is handled here.


    As Ubuntu moved towards snap package format, some users voiced concern about whether
