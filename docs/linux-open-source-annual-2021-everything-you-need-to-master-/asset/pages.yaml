    # # Unpacking Flatpak


    Like most other projects, Flatpak stands on the shoulders of giants to accomplish
    its goals. Two key technologies behind Flatpak are extra and bubblewrap.

    When you install Flatpak, you are installing a ''bundle'' inside a container.
    The project website describes it as something like ''git for operating systems'',
    in addition to others like atomic updates, which is a fancy way of saying that
    what you get updated, it also provides a rollback mechanism.

    Suppose you have a program with file 1 and file 2. An update replaces the version
    of file 2 with actually designated file 3. The program will operate using file
    1 and use file 3 until you want to roll back. But you don''t need to change or
    uninstall/reinstall anything. You just need to switch back to file 2 (which still
    exists, in case you want to go ''rollback'').


    The other technology is bubblewrap


    +   * The application''s runtime is mounted in the sandbox, the structure of which
    is explained in more detail in the box (right)

    * Configurations from the /etc directory are mounted in the sandbox as /etc

    * Only processes that are running inside the sandbox can access the /proc directory.

    * Assets such as icons, fonts and so on are available throughout the runtime by
    mounting one file directory (outside the sandbox) to a different spot in the filesystem.

    * Overall, the sandbox has only access to the resources it needs, and then only
    with the least possible.


    Now, if you''re not too confused yet, we''ll add another level of complexity.
    While most software requires privileges to install on a Linux system, normal users
    can install Flatpaks. In the next section we''ll explain the difference between
    these ''user installs'' and a more ''traditional system install''.


    # # System versus User


    Sealed Linux users are configured to require a root password when installing software.
    Software is installed outside your $HOME, such as /usr/bin, /opt or even as root
    user. As mentioned in our first list, Flatpak supports the ability to install
    a program for a specific user, as opposed to the entire system. This works because
    a normal user has access to the necessary resources to run a program.


    ![](img/5f8379eaeda572d04307c37d75b0ba5d_110_0.png)


    The results of the flatpak search command give you the home-path, reverse-domain
    ID that you need to install.


    # ATOM OF A FLATPAK


    Installing a Flatpak creates a file structure for the program and its runtimes.
    The basic structure of this consists of four-directories in $HOME/local/share
    or /var/lib/flatpak, depending on whether it is user or system-wide.


    The first of these is repo, which contains installed applications, and other runtimes.
    The metadata directory is where the applications live. Each application has a
    sub-directory with three parts: files and metadata. There are further subdirectories
    for architecture (such as x86_64), versions and.


    Associated runtimes are placed in the same way, but kept separate in the runtime
    directory. Each export contains more than one application. The exports related
    to Flatpak sets sit outside. The exports contain installation information and
    .desktop file (which will appear in your application''s menu folder). These files
    refer to the connections to the runtime. The exports directory includes Flatpak
    extensions, which are fully controlled checkpoints between the system and Flatpak''s
    sandbox.


    The structure of the tree below shows a LibreOffice Flatpak installation:


    ```

    $app=acp-demon//var/lib/flatpak$key -L2

    app:

    org.library.Libre.Office

    upstream

    flatub

    exports

    bin

    share

    repo

    config

    extensions

    flatpak.trucked.keys

    objects

    refs

    state

    runtime

    org.fredesktop.Platform

    org.fredesktop.Flatpak.ffmpeg

    org.fredesktop.Flatpak.Locale

    org.library.Libre.Office.Locale

    ```'
