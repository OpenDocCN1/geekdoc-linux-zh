  md: '# Developer tools


    Making your life easier with this collection of capable utilities.


    # >> ATOM


    Atom describes itself as a hackable text editor. Developed by GitHub, the tool
    has a built-in package manager that allows users to search and install plugins
    from within. About 800 packages come with the utility by default. One of its most
    features is the find and replace function that can also modify text across multiple
    files as you type.


    Atom can be used as an IDE and one of its highlights is the autocomplete feature.
    There''s also a bracket matcher that highlights the line of the closing bracket
    to the one under your cursor. You can also define key bindings and add more functionality
    for packages with items minimaps and syntax snippet libraries. https://atom.io.


    # >> BYPTON


    A Python shell provides modern IDE-like features inside a terminal window. You
    can start it with default settings and customise it by editing its config file.
    The shell code completion displays a list of expected parameters. It highlights
    syntax as you type and the Rewind feature in memory.


    https://bypython.org


    ![](img/5f8379eaeda572d04307c37d75b0ba5d_176_0.png)


    # >> ETHERPAD


    Collaboration is key to any project. The Etherpad text editor allows users to
    collaborate in real-time. It works inside the browser and enables participants
    to interact via a text-based chat. List of its features that you can take a for
    on its website.


    http://etherpad.org


    # >> VIRT-MANAGER


    The Virtual Machine Manager is the open source frontend for creating KVM-based
    VMs. It uses the qemu-kvm hypervisor, which is a version of the qemu machine emulator,
    and a VPC and SPICE client that displays a graphical console to the running VM.


    https://virt-manager.org


    # >> TUNNLKEY APPLIANCES


    Installing network software or web servers on a server can be tricky because they
    require a lot of infrastructure, which might take hours to put together. From
    DataB to basics, you''ll have to spend quite a time to assemble a fully functional
    web server before you deploy an application on the network.


    Furthermore, to save plenty users from the network,


    need to thoroughly examine your server for any security leaks. This is where Turnkey
    shines. Using its appliances you can deploy a new web server in minutes. Simply,
    a TurnKey appliance is a self-contained system that packs in a fully functional
    instance of a web app with enough components of operation to power that out. The
    system works


    deployed on both or any kind of virtual hardware.


    Turnkey appliances are available in several formats forming according to the hardware
    you want to deploy on, from local to OpenStack. Cloudantly, they''re up and running,
    irrespective of the platform, all they give you the same interface and manage
    the web


    https://turnkey.org


    # OCELOT GUI


    The database client can connect and interact with a MySQL or MariaDB server. You
    can create and query it and it has fast fetch and display results


    from the database. https://github.com/ocelotgui/ocelotgui


    # DOXYGEN


    Use this tool to generate HTML documentation from the comments in your code. The
    tool supports many programming languages and can cross-reference the documentation
    with the code for referrals:


    www.doxygen.org


    if with Java, C++ or Objective-C need to infer good code. The tool includes various
    analysis and interest points and more that it can work across various files.


    https://tfiber.com


    # MARK TEXT


    The markdown editor supports the GitHub markdown spec and the Common Mark spec.
    It has a live preview, supporting various elements and inline. Math support can
    and export documents,


    https://github.com/https28/markdown


    # MANTA


    When you''ve completed a project, Manta generates invoices and receipts. The receiving
    has a clean interface and features that you can customise per your requirements.


    https://github.com/https28/manta


