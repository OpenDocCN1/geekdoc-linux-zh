    FreeBSD offers two ways to get software. If you included it in the Ports Collection,
    you can install around the /ports directory. Alternatively, you can use pkg to
    install precompiled software as well. Each of these has its own pros and cons.


    Installing the precompiled packages is faster and easier/less error-prone. However,
    the software on your machine might be better for your hardware. The first step
    is to get the package you want. If you have pkg in your shell, and it''s not already
    present you will be prompted to download it. Your first step should be to update
    the package database:


    # pkg update


    Then, search for your desired program with pkg search [desired term]. To install
    it, use pkg install [package name]. You will see the progress of the install,
    including the dependencies, of all that and the actual installation. If you need
    to backtrack out, use pkg delete.


    ```

    pkg delete [package name]

    ```


    You can see all the packages you have installed with:


    ```

    pkg info

    ```


    If you''re a Linux user who regularly goes down a quick terminal to search and
    install software on Ubuntu or Fedora, you will find that all 14 of intents to
    get the hang of this. And installing Ports is just as easy.


    # Day-to-day usage


    Using FreeBSD for day-to-day basics is as described in the next section. If you''re
    navigating around and of course, applications operate just the same on FreeBSD
    as they do on Linux. There are two areas where a little adjustment will be required:
    the first is system configuration. With the /etc directory containing all configuration
    files, there''s only one way to free FreeBSD. As you work with FreeBSD you''ll
    refer to settings in the rc.conf file. This contains a startling of important
    system settings. You''ll see some of the things you need during install (as network
    config). It''s not very, but one would expect it to grow longer with your experience.


    The FreeBSD installer can help you with these tasks, and it''s also a control
    panel you can use while installing some sort of default configuration settings.
    A one-menu terminal program will not include the tools you might use to get around
    the adjustment. It won''t be too much of an adjustment, as some modern package
    systems use these types of tools when configuring individual packages.


    You might also expect to be troubleshooting on FreeBSD. This isn''t because FreeBSD
    is hard, but because there are FreeBSD that differs by design that a Linux user
    will have to learn to research. In a case of the pkg command defaults to the output
    which is not what you want, you might find a way to fix the issue.


    The author could use a pkg install list command, to produce the output which had
    a number of packages were installed. On completion, the startup failed with a
