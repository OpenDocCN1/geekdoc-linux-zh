    which we need favourably with a large collection of tools. Just having the lost
    collection of tools is not much in the hands of inexperienced users. Taking the
    collection into account, the winner of today has to be a distro which can be used
    by a large number of people.


    This is why ALT Linux loses out. While the distro is enough to handle all sorts
    of repair and rescue jobs, it is not in use by the hands of users - it''s designed
    for inexperienced users, respectively.


    Morpheus Arch Linux looks similar but for different reasons. Unlike ALT, the distro
