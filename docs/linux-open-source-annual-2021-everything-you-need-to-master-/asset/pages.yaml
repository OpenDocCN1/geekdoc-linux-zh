    If you need more data than a simple backup-solution, then you need to create an
    unused solution using a Raspberry Pi as a dedicated network storage (NAS) with
    the Debian-based Open Media Vault (OMV) server.


    OMV allows you to roll out and simple to manage, thanks to its well-designed browser
    user interface, which makes it suitable for non-technical users. It supports all
    the popular deployment mechanisms, with several levels of server


