  md: '# Photo editors


    # The Verdict


    The winner of this month''s Roundup was easy to identify. GIMP Image Manipulation
    Program, Gimp, is an undisputed champion and the best choice for photographers,
    regardless of their workflow. Gimp is the best for painting and retouching, but
    it''s also the most reasonable choice for repairing, replacing and adding variety
    with third party extensions from GMIC and FX. If you need to process RAW images,
    Gimp-can integrate with Ufraw and Rawtherape to use them as image sources. It''s
    a versatile and comprehensive software package.


    Deciding on the positions of this month''s programs was more difficult because
    they came close to each other. Securing second place is Rawtherape, with its superb
    colour correction tools and a stronger denoising algorithm. It is hard to tell
    if Rawtherape is better than Darktable – both are excellent RAW files. Darktable
    is versatile but doesn''t have a capable white balance fix, which is why it lost
    a few points.


    The next is Lightzone which brings us up, though not that it''s a bit perfect.
    However, we were disappointed that Lightzone—which has a poor noise level RAW
    processor—is well equipped with tools for cloning and removing spots, but denoising
    could just be a little better.


    So, for most cases we recommend using Gimp and Rawtherape, either separately or
    by running Rawtherape as a RAW import for Gimp. If you need better noise level
    and grain, we have at Pixeluv, which has everything for amateur photo processing.
    We don''t dislike Lightzone; it has certain advantages as a good second-tier photo-editing
    program.


    ![](img/5f8379eaeda572d04307c37d75b0ba5d_164_0.png)


    +   1st **Gimp** 10/10

    Web: [www.gimp.com](http://www.gimp.com) Licence: GPLv3

    Version: 2.10.8

    The one software perfect for all your photographic needs. Impossible!


    +   2nd **Rawtherape** 9/10

    Web: [rawtherape.com](http://rawtherape.com) Licence: GPLv3

    Version: 5.5

    It has more features than one needs, but it processes RAW shots perfectly.


    +   3rd **Pixeluv** 8/10

    Web: [www.pixeluv.com](http://www.pixeluv.com) Licence: EULA

    Version: 1.6

    It is easy to use, but it is a slightly lighter weight of colour.


    +   4th **Darktable** 8/10

    Web: [www.darktable.com](http://www.darktable.com) Licence: GPLv3

    Version: 2.6

    It has masks, and a greater denser, but it lacks a bit in some areas.


    +   5th **Lightzone** 6/10

    Web: [www.lightproject.com](http://www.lightproject.com) Licence: BSD

    Version: 4.1

    Capable image-editing software, but with poor grain/noise tools.


    # ## ALSO CONSIDER


    Some people will argue that *After Shot* from Corel, as well as some heavy weight
    open source software with a price to touch, and we certainly won''t turn our group
    test with OSIMP versus proprietary software.


    *Digikam* or *Krita* are also worth mentioning. *Digikam* is very good and delightful
    to work with, but it focuses on editing and shooting photos other than editing
    and processing. *Krita* is a great tool for


    artists, comics, writers and artists, but it''s less robust when used for editing
    photos. Other alternatives as well exist, and you may have read about them in
    issues of *Linux Format* (for example, *Photo* (see UKFOB) and Fotoxx, to just
    two). We of course, acknowledge these programs and other than one free software
    for editing photos, but for this *Roundup* we selected the most powerful and feature-rich
    titles that can use on a daily basis.


    165'
