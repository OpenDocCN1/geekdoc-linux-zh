  md: '# Office suites

    Verdict


    The choice of Roundup subjects over the past several issues has left us to conclude
    that one might not cater to all of needs. This is true for image and video editors,
    and office suites aren''t either. If you can spare the resources, you might find
    yourself preferring presentations of one suite''s application, while relying on
    other spreadsheets.


    With the exception of the polish finisher, these office suites also disappointed
    and improved in our view. WPS Office is a highly capable suite, and we optimistically
    advise others to give it a chance, but the lack of ODF support, with no wonder
    if it will ever be available, is a stated flaw for this suite. The last of all
    is that it is fast and responsive, and fun enough for Linux also.


    Calligraphy, despite being highly capable, is also a major disappointment – but
    cheap for its interface. If you can master its esoteric workflow, and don''t mind
    finding your way trial and error, there''s nothing wrong with it. But if you plan
    on running Calligraphy on a small, 14-inch laptop, you''ll barely have room for
    your dishes and you couldn''t make the poppies


    While OnlyOffice and LibreOffice support the primary requirements of documents.
    OnlyOffice fares far better at rendering documents. Unlike the other suites, however,
    it doesn''t feature a database or drawing application, offering only a spreadsheet,
    word processor and presentation application. The office edition provides all that
    you need except for the collaboration with the cloud variants. OnlyOffice performs
    well with the limited number of options offered, and isnt as robust as LibreOffice.
    If you don''t care about collaboration, then we would definitely advise you to
    give it a try.


    There''s very little speedy Google Docs and LibreOffice, for the fact that the
    first needs an internet connection to function, while the latter is a desktop
    solution.


    # ALSO-CONSIDER


    There aren''t any other open source suites to consider for the ones already featured
    in this Roundup. If none of our solutions work for you, check out the Apache OpenOffice
    suite. LibreOffice is based on it, but whereas the latter continues to innovate,
    OpenOffice has stagnated in recent years. Besides SoftMaker Office 2018, FreeOffice
    is another freeware suite, but as with WPS and OnlyOffice, it only features a
    spreadsheet, word processor and presentation tool.


    If you''re looking for a cloud-based alternative, there are a couple of others
    besides Google Docs, including the proprietary Zoho Office suite and the host-on-one
    office suite Tiki. The AGPL3 licensed Feng Office Editor is also a viable option.
    If you notice of these catch, you can grab individual applications, such as Gnumeric
    or Pymip for spreadsheets. Abword and Sozi can be similarly used for word processing
    or creating presentations, respectively.


    ![](img/5f8379eaeda572d04307c37d75b0ba5d_118_0.png)


    +   1 LibreOffice 10/10


    Web: www.libreoffice.org Licence: MPL 2.0, other open source Version: 6.2

    This suite excels at just except everything.


    +   2nd Google Docs 9/10


    Web: https://docs.google.com Licence: Proprietary

    N/A

    Collaboration makes it a breeze.


    +   3rd OnlyOffice 8/10


    Web: www.onlyoffice.com Licence: AGPLv3

    Version: 5.29

    Impressive support for proprietary formats, and as we advertised.


    +   4th Calligraphy 6/10


    Web: https://calligraphy.org Licence: GPL

    Version: 3.0

    Just as feature-rich as LibreOffice, but its interface is very cumbersome.


    +   5th WPS Office 5/10


    Web: http://wps-community.org Licence: 10.1.0

    Version: Proprietary

    Purists dislike the license and the lack of ODF support.'
