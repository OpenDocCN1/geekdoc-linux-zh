- pgno: 9
  md: '# NEXT-GEN DISTROS


    Step right – LXF''s greatest showman Jonni Bidwell is here to unveil the finest
    Linux distros around!


    ast your mind back 15 years, to pre-credit crunch optimism of the mid 2000s. We
    were wiped by Windows Vista, and this new Ubuntu operating system was claiming
    that it could displace Windows. Despite being free, you needed to have contributed
    to yourself or subscribe to an arcane journal such as Linux Format to understand
    that crappy brown hue was a good desktop color.


    Well, Windows may not have been wiped out by Ubuntu. But Linux has been developed
    in layers and bounds. It''s


    usable than ever and key players take it much more seriously now. Thanks to Valve
    and Vulkan, we can now play thousands of games. More companies than ever are shipping
    Linux on consumer hardware. Your wireless desktop works perfectly with it.


    Best-looking array of distros to choose from. Ubuntu has always been a great place
    to start, but it''s not for everyone.s taste. Here, we pick the best and since
    Making Linux is very easy difficult, we''ve got a section on usable distros, including
    long-time favourite for beginners: Linux Mint.


    Next, we''ll explore some of the best-looking distros out there that will give
    you a truly modern desktop. Elementary OS is making Linux simple, powerful, and
    dare leveraging the latest in open source. We say – it''s at least a bit like
    Mac OS. Finally, we look at some new technologies. You might not want these (or
    if it seems the number of changes about Wayland, Systemd et al.), or you might
    not be able to use your favourite software with them easily, but these will shape
    desktop Linux in the years to come.


    ![](img/5f8379eaeda572d04307c37d75b0ba5d_9_0.png)'
