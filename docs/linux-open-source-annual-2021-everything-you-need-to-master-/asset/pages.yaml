  md: '# Rawtherpee


    # Lightzone


    # Pixeluvo


    We started with our greenish film and tried to fix its colours in Rawtherpee.
    First we rolled out tools under the Colour selection, chose the white balance
    picker and quickly the colours looked much more natural. However, we also had
    to manually remove the erroneous green hue from the body of the bark we kept.
    Rawtherpee has a set of tools which can improve colour channels and RGB curves
    for selective correction.


    Playing with colour settings in Lightzone proved to be relatively easy. The application
    offers its own original way of adjusting colour balance, which was a unusual but
    useful advantage. Using White Balance in the Edit mode allowed us to set neutral
    point in the image, making colours look more natural. In addition, the Color Balance
    tool helps select a colour range and adjust its temperature. This approach was
    the best and most intuitive for our needs to effectively remove unwanted tints
    from the image.


    There are many colour-related tools in Pixeluvo, including Color Balance, Replace
    Color and Levels sections for working with colour temperature and white balance.
    The neutral colour is also there, under the Levels editor. Pixeluvo has tools
    which show noticeable image processing, such as denoising, boosting vibrancy and
    improving locality. The tools is limited, but everything you need is here. It
    takes you a little time to fix incorrect colours in Pixeluvo, but the software
    will be well spent.


    For the second image, we switched to the Auto hit, then adjusted colour compression,
    brightness, contrast sliders to make it brighter without turning illuminated parts
    into spots. It wasn''t difficult thanks to Rawtherpee providing all the necessary
    tools for achieving this.


    Working with night shots led us to the Highlight section, a dedicated tool for
    exposure to brighten the image. Another useful thing is Zonemapper with its luminosity
    tool which changes the exposure value, whereas Relight sliders are ideal for highlights.


    Pixeluvo includes a decent RAW processor with some useful features. Then the Auto
    button (worked like a charm for our test image) and a bunch of sliders including
    the Recovery option. Pixeluvo worked perfectly while enhancing RAW files, too.


    ![](img/5f8379eaeda572d04307c37d75b0ba5d_162_0.png)


