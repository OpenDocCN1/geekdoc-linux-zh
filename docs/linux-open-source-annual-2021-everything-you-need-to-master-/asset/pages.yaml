  md: '# Virtualisation 101


    Nobody can tell you what virtualisation is – you have to experience it for yourself,
    or you could just read this...


    virtualisation has been around since the 1960s.

    Of course, computing then was all done on mainframes and OSes were so different,
    it''s so harder for youngsters to get their trendy heads around how this worked.
    This is essentially the same as it is today: compute resources were to be (fairly)
    shared among users that concurrently running jobs would not interfere with one
    another. And each separate job was more or less its own entity (today we call
    ''supertasks'' programs as a master of course, but this wasn''t the case back
    then). So the underlying OS which generated these jobs was referred to as a virtual
    machine as we use today.


    Modern hypervisors like Xen and Microsoft''s Hyper-V are run on bare metal for
    the sole purpose of hosting guest VMs strictly and securely, much like the time-sharing
    schema of the mainframes. The existence of hypervisors has evolved. These are
    called Type-1, which are executed by Paravirtualox, and QEMU running on an operating
    system and are probably more famous for everyday users. Things are not limited
    to Linux KVM (Kernel Virtual Machine) doesn''t fit nicely into anything except
    it turns the kernel into a Type-1 hypervisor, but the host OS still stands in.

    With Intel VT-x and AMD-V extensions. These enabled operating systems to run virtualised
    without configuration, in contrast to previous approaches (which needed the OS
    to run in a guest environment) or complex software workarounds. Then virtualised,
    (any dectop CPU has


    ![](img/5f8379eaeda572d04307c37d75b0ba5d_68_0.png)


    We use only virtual penguins to test our disc-now, ever since we ugly prisingly
    three years ago.


    shipped with these hardware virtualization extensions.\And they have evolved to
    enable not only faster graphics - but deeper hardware interrupts, memory management
    units (MMUs) and onboard graphics - via Intel''s VT-d on the HP Pro graphics being
    virtualised.

    It''s even possible to break the boundaries between physical and actual hardware
    can be handed off to a virtual machine and seamlessly. A popular example of this
    is running Windows 10 with a seamless (usually quite high speed) graphics card.
    This trick, however, allows Linux users to play AAA games at near native speeds.
    PCIe and the general area of Virtual Function I/O (VFIO) require different CPU
    extensions, VT-d on Intel and AMD. Some of Intel''s overclocking focused chips
    (the one ending in K) take class


    A new project you keep eye on is Looking Glass (https://looking-glass.hostfirefox.com)
    which aims to streamline passthrough for Windows VMs. In particular, the need
    for a separate monitor and keyboard is solved.


    # ## VIRTUALISATION, EMULATION AND CONTAINERISATION


    It''s easy to confuse virtualisation and emulation. Both are type of software
    mastering as a machine, but both have been around for a long time. In one sense
    virtualisation is just a form of emulation. In Linux cases we use for example,
    Paravirtox with QEMU, and on macOS, we can also emulate software, using VirtualBox
    or Wine (Wine is not an emulator - as far as we are concerned)


    Emulation creates software, translating or meaning code that the host can understand.
    Virtualisation differs in that the guest code runs directly on the host, which
    means it''s faster (although sometimes other hardware still has to be emulated
    when it slows down), but also means it''s only possible to


    virtual architectures are not similar. A decade after the virtualisation revolution,
    a new technology emerged: Containers were popularised by Docker in 2013 and bring
    many of the benefits of virtualisation (isolation), but they use the host''s kernel,
    needing to run on the same operating system.


    Containers can be seen as server-level virtualisation, as opposed to machine-level.
    A container need contain only the libraries required to run a particular application,
    and they also know dependencies if that application only runs with a particular
    version of the binary. In the way that Qub runs on applications in different VMs,
    OSes like Container OS (coreOS Linux) and LinuxOS running in everything.'
