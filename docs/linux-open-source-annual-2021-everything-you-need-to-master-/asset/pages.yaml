  md: '# Cloning flexibility


    Do they offer enough to meet your cloning requirements?


    Clone offers a lot of control over the cloning process. You can use it to clone
    individual partitions or cluster disks, or to clone disks to partitions — which
    can then be saved to any other attached disk, or a removable drive. Driver can
    also directly clone a partition or disk to particles. In an image, Clone can easily
    fix this via direct FTP. This process works for when you are cloning disks, we
    wouldn''t recommend it and would rather suggest you go via the image route, which
    is a lot safer and offers far more flexibility than the direct disk to disk cloning.


    While GAL has a very verbose interface, which gives you several options to fine-tune
    settings when cloning and restoring images. Like Clone, you can use GAL in several
    modes, with RAW mode that can clone all types of disks and save the images locally
    or restore via FTP, SSH, or SMB. For the imager, GAL also has the option to directly
    clone a disk and write it to drive.


    Unlike Clone, Fog Project doesn''t work with a Live CD and has a different cloning
    mechanism. When you use Fog Project to image a computer, it offers plenty of options,
    with various fields to describe the hosts. It can also arrange the items into
