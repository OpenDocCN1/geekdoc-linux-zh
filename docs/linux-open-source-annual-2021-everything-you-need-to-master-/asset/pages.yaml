    Mailspring is the first tool we tested in this Roundup. The others have received
    extensive coverage, and we''ve discussed them over the past few weeks. In a break
    from tradition with our Roundups, we wanted to spend some time going over the
    pros and cons of each one before we finish the last place finisher and the other
    tools.


    This is because we''ve rarely come across an application that has so thoroughly
    features. We were so impressed that a few hours and the lack of interest in improving
    key features makes it one of the worst performers in the Roundup.


    Judging solely by the score on the tests, you can see that Mailspring leaves the
    other tools only in the add-ons and security department. It''s an early-day application
    that doesn''t encrypt your emails, which means you have to filter spam. It is
    unimaginable for it to be that Mailspring finishes last. Otherwise, we were stunned
    by the speedy performance and how easy-it was to configure anything you want to
