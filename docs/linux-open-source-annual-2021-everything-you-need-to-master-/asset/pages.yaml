    The Pattern Editor is pretty straightforward, but something that might throw you
    off is the Size function. Size is in beats, and the default is eighth notes (8
    quarters), so the Size function will be a full 4/4 bar. If you want eight eighth
    notes to fill a 4/4 bar, that''s slightly confusing at first, but if you want
    to make something 7/8, the Size would be 10, and if you want 9/8, the Size would
    be 12.

    If you want eighth notes, and if you need to change the Resolution to 16 notes
    (quarters), you need to right-click on the ruler to get 64 notes. If you would
    want a triplet-subdivision (for blues or jazz), you can use the same numbers,
    but with a T - as as eight eighth notes.


    Moving onto the Sound Editor in the top of the screen, there is a list of patterns
    on the left. Click a different pattern from one pattern to another while working
    in the Pattern Editor. It''s a good idea to name each pattern if you want to change
    it later.

    On the right is a grid with empty squares. Each square will represent a bar of
    music; clicking each square will generate a sound when the song reaches that point
    in time. For any highly complex arrangements, multiple patterns can run together.


    If you don''t like the default drumkit (GMKit, which is already mediocre), there
