    but it is included in a huge bargain.


    SystemRescueCd has some of the same problems. Earlier versions of the distro,
    which had a comprehensive boot menu, are no longer intuitive enough in the hands
    of someone who is familiar with its kind of tools.


    The two options that seem the most appropriate are System Rescue Kit and UBCD.
    Both are loaded to bring the boot with tools and are easy to find your way to
