    Gimp shines in this, the program was created exactly for manipulation of this
    kind. Gimp is the gorgeous Healing tool for super-smart removal of any spot defects
    within a photograph. Needless to say, Gimp has layers and masks that you can rearrange
    as any photo specialist uses frequently.


    Darktable has a useful spot tool, which also allows to add circles, and customize
    outlines to your photographs. When used with masks, this is possible to remove
    areas of the image, but it''s a far less intuitive process compared with using
    image-editing tools.


    Speaking about Lightroom, there''s a way of working with layers within the program.
    Most filters in Lightroom have the Colour Selection tab that enables you to select
    a range of colours, which the filter will be applied. Together with the Mask view
    this works like the layer approach,


    filter is another separate layer of the image. There''s also a spot removal tool.


