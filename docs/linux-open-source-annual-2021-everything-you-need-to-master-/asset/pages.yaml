  md: '# # Data management


    Control your data, where it can be accessed, and archive it, too.


    # ## ECIEL (45)


    Everything in Linux is a file and the access list (ACL) helps determine the rights
    for each file. You can modify the permissions from the command line or use graphical
    ECIEL utility that''s in the official repositories of most distros. https://linux-fererer.org/eciel


    # ## NEXTCLOUD


    Online storage services are a convenient option for accessing and sharing your
    data anywhere on the planet. With Nextcloud you can roll out a hosted server that
    gives you the benefit of an inconvenient storage service and sync your data to
    your party.


    Installing and rolling out Nextcloud is fairly straightforward and we


    documented process. It has a feature-rich and intuitive web interface that shouldn''t
    prove to be difficult even for first-time users, which is a feat in considering
    the sheer number of features wrap underneath. The project can be installed on
    a home network as well as an enterprise environment. You can use its administration
    section to keep it up with other related services such as directory server to
    import.


    Sharing files with others over network or via URL is simple enough. The server
    ensures that changes made to shared files are synced to all users. It can also
    access files stored on a variety of cloud services such as Amazon, Google and
    Dropbox.


    https://nextcloud.com


