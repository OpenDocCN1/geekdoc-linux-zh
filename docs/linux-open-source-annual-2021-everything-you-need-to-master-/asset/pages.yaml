  md: '# VirtualBox beginnings


    Learn the basics of virtualisation no matter which OS you’re running, and which
    OS you want to try.


    ne of the easiest ways to fire up your virtual machine is with Oracle’s VirtualBox.
    It is free (GPL-licensed) software for Windows, macOS and Linux. Windows users
    should download from https://virtualbox.org and Linux users should install `sudo
    apt install virtualbox`.

    It works for all platforms, so no matter what OS (or which OS you want to run),
    you can use our handy six-step guide outside. If you’re stuck for a bit to try,
    why not copy the Linux or OpenMedia ISO files off the LXVF? You can use VirtualBox
    to extract it from the thing; this would be awesome.

    If you find yourself stuck in fullscreen mode, just Ctrl+Alt to return to windowed
    mode. If your mouse cursor trapped in the guest window, just press the Ctrl Right
    Key again. Linux distributions do seamless mouse movement, so the shouldn’t have
    to-take the mouse past the edge of the screen in the guest window to control the
    host.


    # VirtualBox tweaks


    It’s straightforward to fire up a VM, but let’s look at some of the options that
    VirtualBox provides to make your virtual life feels as real as your own. First
    of all, if you store your virtual drive image on a traditional spinning hard disk,
    you’ll experience heavy workloads and you’ll probably notice a lot of disk activity
    while you’re using. Under such tasks, and if you’re brave enough to run a Windows
    VM, your life will be much better if you store it on an SSD.

    If you don’t have one, or don’t have space on one, you might be able to make out
    some extra performance by using the host cache for the VM. Select your VM from
    the column on the left, hit the Settings button on the toolbar, select the IDE
    file, and no


    ![](img/5f8379eaeda572d04307c37d75b0ba5d_69_0.png)


    You’ll also find VirtualBox in the Ubuntu Centre. It’s not really properly, don’t
    worry.


    ![](img/5f8379eaeda572d04307c37d75b0ba5d_69_1.png)


    Setting up a bridged network so your guest appears as a separate host on your
    LAN is easy, and so are all other network configurations.

    (optical) and disk: it’s possible to choose the type of controller presented to
    the VM from here, but generally the defaults (PIX4 for the IDE controller is optimal,
    and AHCI for the SATA controller) are better supported.

    VirtualBox, released recently, introduced enhanced support for storage, which
    means VirtualBox doesn’t have to use CPU cycles emulating the disk controller.
    This should speed up distributions, but all will require a driver to be installed
    in the guest to work. We’ll discuss this and the options over the coffee when
    we meet soon.

    The other thing about performance is to speed up graphics performance. The new
    defaults controller in VirtualBox (VMSGA, afterwards) should work well for Linux
    guests. If you’re using an older version, you may want to update to the new one.
    VirtualBox might work better with the VBoxSVGA graphics driver. There’s no reason
