  md: '# # Audio and Video


    Edit your videos within inches of their lives, and organise your music.


    # UMS


    This streaming server will transform your Linux desktop into the ultimate media
    streaming station to broadcast to other computers, smartphones, gaming consoles
    and even TVs. U streams via the Universal Plug and Play (UPnP) protocols to any
    DLNA-compliant device. You''ll have to roll-out UMS, although the procedure is
    fairly simple.


    The first time you launch it, UMS takes you through a basic three-step configuration
    wizard. Without further configuration, UMS includes an easily customizable options
    to guide new users. It also includes a minimal web interface for streaming your
    content. www.universalmediaserver.com


    # EMBY


    This is an all-inclusive media server that comes with plenty of features. Emby
    is a one-stop shop for accessing and viewing all your media on any device,from
    computers and mobile phones to Android, Chromecast, Xbox and Roku. Beyond local
    folders, Emby allows you to add network shares, which is a great feature if you
    have media on different computers. The network server is available as a pre-packaged
    library and its website has installation instructions for all distributors including
    Arch, Centos, and Ubuntu. You can right-click items to reveal useful options like
    downloading them, adding to playlists and collectors, or editing metadata. You
    can stream content during playback and full-screen. Emby also enables you to set
    parental controls, and you can block items with a rating higher than the maximum
    you''ve defined.emby.media


    # MPV


    A resource-conscious video player that looks good on modern machines. Based on
    mplayer2, MPV continues the tradition of CLI by introducing optimized and clean-code
    options and features. It offers a minimal user interface that stays out of the
    way, enabling you to watch your videos in peace.httpsmpv.io


    ![](img/5f8379eaeda572d04307c37d75b0ba5d_168_0.png)


    > MPV is built on top of ffmpeg and handles nearly all audio video codecs.


    # SHOTCUT


    A fairly advanced video editor, Shotcut is one of the few tools that supports
    4K video. The program supports many audio and video formats with a variety of
    transitions and effects. It has a long list of impressive features and a collection
    of tutorials to help you get started.httpsshotcut.org


    # CURLEW


    Powered by ffmpeg, Curlew is an easy-to-use media converter. It has the ability
    to clip and merge and convert only specified portions of files. Select one of
    the preset settings for various devices and you''ll be able to preview the files
    before conversion.httpscurlewc.org


    ![](img/5f8379eaeda572d04307c37d75b0ba5d_168_1.png)


    Emby can connect to TV tuner cards and DVR devices to stream and record live TV.


    # AIRSONIC


    Based on the now-open source project, the Airsonic audio streamer makes your music
    important. It is easy to configure and can stream files in any format to many
    players simultaneously.httpsairsonic.github.io


    # TUPITUNE


    A set of tools to engage kids to create 2 animations. Tupitone has an easy-to-use
    interface with the web and a host of text and video documentation to get started.


    # PICARD


    A little tool, Picard will get your music collection back into shape. The program
    can sort your music library and rename named files and identify incomplete albums.httpspicard.musicbrainz


    # TRAVERSO DAW


    A powerful audio recording and editing platform. Traverso is a digital audio tool
    that can do everything from creating simple records to editing multi-track audio.https://traverso-daw.org


    # MIXX


    If you need to DJ at an event, run your music library with mixxx and use scratchable
    waveform to tempo of tracks and change their pitch to create your own mix.www.mixxx.org'
