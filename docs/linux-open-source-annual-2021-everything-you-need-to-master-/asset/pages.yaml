    RAID, you can access the data it holds using all popular network protocols such
    as SSH, NFS, FTP. It also offers extensive permissions to control access to shared
    resources and folders. The server is modular and can be extended with official
    and third-party plugins. You can turn your NAS into a torrent to download data
    directly into the NAS or to stream music across the network.


    The open source alternative to the popular but proprietary Torrent Sync. Synching
    can sync your files between computers over the web. We also offers a discovery
