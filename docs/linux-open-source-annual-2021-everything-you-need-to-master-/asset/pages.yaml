  md: '# Roundup


    Gimp >> Rawtherpee >> Darktable >> Lightzone >> Pixeluvo


    > Alexander Tolstoy likes nothing better than rolling up his metaphorical sleeves
    and seeing what new gems the open source community has to offer.


    # # Photo editors


    Keen photographer Alexander Tolstoy keeps his imperfect snaps, for fixing later,
    using some of the best photo editors available for Linux.


    # HOW WE TESTED...


    Editing photos isn''t the same as editing general images. Therefore we decided
    to compare some of the best editors for Linux with a focus on fixing common faults,
    enhancing colour and lost details that might be considered gone for.


    The aim here is help you select the most feature-packed and practical software
    that can bring dull images back to life. We''ll take a closer look at their advanced
    features, such as automatic enhancements, the ability to fix dull, blurry, or
    over-exposed images, and whether or not they handle RAW files.


    It''s not the first time we''ve run a Roundup on image photo editors, but this
    current group includes a different selection of software. Out of the five open
    source tools, Ufraw had a better application in the past. The fifth is a commercial
    edition, which is well known to the reader, but should be of great interest to
    photo-editing enthusiasts. And to find out more!


    ![](img/5f8379eaeda572d04307c37d75b0ba5d_159_0.png)


    With comes to select an editor, there''s plenty of choice. There are general-purpose
    editors like Gimp, Pinta, image managers with such as Digikam or Darktable, and
    finally software for artists like Krita. Our interest lies in fixing photos and
    processing RAW files, so we grabbed Gimp with its set of built-in elements, Ufraw
    plugin, and lots of third-party plugins from FX Foundry and GIMP. Then we included


    Darktable and Rawtherape – two classic darkroom editors tools for dragging out
    barely visible details. Lightzone is similar to these two programs, but has a
    more consumer-friendly interface. Last but not, Pixeluvo is a program with a limited
    set of editing tools. Gimp is the only one that does use a UI theme by default.
    Although a theme adds a ''pro'' feel to the program, it won''t hide the truth
    in our Roundup!'
