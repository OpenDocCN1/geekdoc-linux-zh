  md: '# The master jacker


    Before we start making music, first we need to get the tricky configuration out
    of the way: that first thing called JACK.


    he JACK Audio Connection is a server for low-latency rendering, allowing extraordinary
    lines of interconnectivity between audio and MIDI, and some truly elaborate sound
    rigs. Most of them run without crashing JACK is the most advanced audio tool.
    Unfortunately, it takes a bit to get started with.


    The most popular tool to configure JACK is QjackCt. If you install it in all the
    main repos (Ubuntu, Fedora or else), so install qjackct and it''ll also pull in
    JACK as a dependency. Once installed, open QjackCt and start. You''ll see JACK
    start, then you will probably need to make a few adjustments. If you use JACK(LV2)
    your first thing is to ensure that ‘driver’ is set to ‘alsa’, and that ‘interface’
    is set to your actual sound card, rather than just (Default). The MIDI driver
    will be set to ‘no’, so you’ll need to ‘choose’ from the menu. Next, you try adding
    yourself to the audio group, and if it''s still not working, you may need to disable
    Realtime. It''s best to start with a clean session, and then you''ll run into
    anything unexpected, especially without bother.


    JACK might also fail if you''re already ready to use something that needs audio
    and you''re not re-syncing your audio over the network. It''s best to start with
    a clean session, and then you''ll run into anything unexpected, especially without
    bother.


    Note that when you find having trouble running JACK, it''s not like that nothing
    outside of JACK''s ecosystem will work. However, we''re not done; there''s still
    latency to contend. Latency is a problem that affects all sound engines of software
    that you use. If there is a delay between a new track and the track(s) it''s recording,
    then you have issues. Just don''t turn the latency down, - the greater the latency
    the worse the system, and the more likely there will be clicks and pops. You need
    to find a sweet spot: start with defaults, and adjust the latency until you can


    ![](img/5f8379eaeda572d04307c37d75b0ba5d_98_0.png)


    ![](img/5f8379eaeda572d04307c37d75b0ba5d_98_1.png)


    remove any delay without overwhelming the system.


    # Making connections


    Making the correct connections in JACK is probably the hardest part of the process.
    Start by connecting the client in QjackCt.


    The connections window is divided into two tabs: ReadOnly/Output Ports on the
    left, and Writable Clients/Input Ports on the right. It are also three tabs: Audio,
    for using JACK; and ALSA for underlying your system. Like the cables in real musical
    equipment, programs or modules can be assigned as inputs or outputs


    To make a connection, click the output on the left, then the input you want to
    connect to. For any connection JACK enables the possible client to be available,
    and when clicked, a line will be drawn from left to right, indicating a connection
    has been made


    In the image (below), we are using multiple JACK connections to create a new sound.
    In the MIDI tab, ‘jack-keyboard’ is attached to the MIDI module ‘asmynth’. In
    the audio tab of our image, ‘asmynth’ is effects to program JACK, which is aggregating
    your sounds. Jack is connected to-‘system’ which is the final output


    QjackCt''s connections window doesn''t float quite an interface. Each client is
    a box you can drag in space, and connecting between ports will make a connection.
    It''s more elaborate, but feels more like the stanie cables on the floor of the
    audio studio practice!


    ![](img/5f8379eaeda572d04307c37d75b0ba5d_98_2.png)


    It''s connecting everything until something works, but perhaps and methodical
    - you need to be able to replicate your connections.'
