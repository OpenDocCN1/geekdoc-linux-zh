    # What does it take to install the OS to your machine?


    Most OS in the Roundup are equipped with a graphical installer. Unfortunately,
    that doesn''t mean you can expose them to a physical drive on a production machine
    as you download the OS. You will realize that not all of them have undergone the
    same amount of testing - installers - as mentioned, it''s a good idea to try it
    in a VM.


    The one exception is Ubuntu. Linux allows you to navigate troubling through its
    installer, which is very polished and streamlined partition the built-in installer
    to save space for the OS, or to use the familiar Gparted tool''s available in
    the Live environment.


    There is also ReactOS, which is the only OS in the Roundup which you have an install-only
    version or a Live image, if you just want to test the OS on your hardware. You''re
    satisfied that if it works, you can use the install-only approach to install ReactOS
    to the computer. The OS is quite straightforward and isn''t particularly difficult
    to use. Like Linux, ReactOS runs through a first-boot configurator to help you
    create a user and a theme for the desktop.


    Haiku has both straightforward installers. All you need to do is point Haiku to
