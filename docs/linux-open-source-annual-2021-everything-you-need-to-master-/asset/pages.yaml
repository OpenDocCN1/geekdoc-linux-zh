  md: '# # Productivity


    Put some order into your life with finance, web filtering and admin tools.


    # ## OSMO


    A personal information manager (PIM) helps you keep track and organise all the
    information coming from various sources. Osmo is a lightweight PIM that helps
    manage appointments, tasks, contacts and notes. The application has a straightforward
    and integrated interface with four tabs on the top for Calendar, Tasks, Contacts
    and Notes. The program allows action-linked buttons at the top as you switch between


    components. The calendar pane provides a simple functional calendar along with
    some related information such as week and number of days to the end of the year.
    You can double-click to add notes or right-click to add a date


    you to mark the task as recurrent and define relevant properties. You can easily
    store the address of your contact using Contacts panes. It supports additional
    features including a search function, a birthday reminder and the ability to point
    out your contact on Google Maps. The Notes pane makes it possible to join text
    using rich editing functions and you can optionally encrypt all your notes using
    a password http://clyp.org/osmo


    The options for defining a task are housed within a basic and advanced tab. Use
    the basic tab to define the date and time and assign the task as priority, while
    the advanced enables


    # ## FOCUSWRITER


    Scritble without distraction with FocusWriter editor, which runs full-screen and
    uses auto-hide menu for a clean workspace. The editor supports the most popular
    formats and has basic support for ODT files as.


    The primary goal of FocusWriter is to help you focus on writing, while the so
    mild task will lead the dexterity of the mind towards this objective. It has several
