    # >> END APP DISTRIBUTION


    Flatpaks: All that they need for developers to share software in a distribution-agnostic
    manner. Whereas Snaps rely on a central app store, you can set up your own Flat
    marketplace. The Flatub repo (https://flatub.org) is a great place to find popular
    apps. Flatpaks are free images which are easy to install. Endless OS uses them
    to run your first (non-trivial) application on Endless OS (or your first Flatpak
    on another OS) and you''ll find the variety. It is because it depends on a large
    runtime (e.g. Gnome). Once installed it works across distributions.


    Fedora Silver brings atomic updates to the Fedora distribution. Here, a huge packaging
    system, RPM-OSTree, is used so that the base OS can be modified in layers. This
    is useful for installing low-level packages such as drivers and themes which can
    be rebuilt in this way, and there''s also support for containerised workloads


