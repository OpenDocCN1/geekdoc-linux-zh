    When it comes to correcting colours, Gimp thanks to its fast GEGL engine. We didn''t
    need any third-plug-ins to fix the colours of our test photo. The Colour-Levels
    menu is enough to fix the look (for three pictures: black, grey, and white) and
    we also managed to remove the desaturated green hue on the curtains using green
    channel. Using Gimp''s standard features for turning up levels and curves turned
