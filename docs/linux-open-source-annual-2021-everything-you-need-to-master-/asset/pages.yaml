    # FREEBSD LINUX COMPATIBILITY


    It might not be compatible with other OSs. FreeBSD has a feature that allows you
    to run Linux on it. The Linux Binary Compatibility allows you to install both
    32 and 64-bit Linux applications, although it appears that the i86-based system
    is default. To add Linux compatibility, first add the Linux Compatibility for
    the FreeBSD kernel (which is locked in root)


    ```

    linux64-pkg

    ```


    Then install the package (or port) for the environment: linux base


    ```

    pkg install emulators/linux-base-

    ```


    After edit /etc/rc.conf to make sure Linux is started at start:


    ```

    linux_enable=YES

    ```


    Your FreeBSD system is now up to run Linux programs. Other you may need to take
    into account include:

    - Does the program come in a package format? Some traditions like ports and EPKG
    are easy to get and use, but open ones like Flatpak (use LXF244 for a deep dive)
