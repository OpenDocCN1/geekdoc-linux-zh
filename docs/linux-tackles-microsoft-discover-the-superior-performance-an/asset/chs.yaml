  有专门网站提供有用的“交叉”信息，其中一个网站是 `groklaw.net` 提供的 `http://www.grokdoc.net/index.php/Application_Crossover_Chart`。`grokdoc.net`
  页面引用道：“Linux 有三种基础办公软件包：针对 `KDE` 的 `KOffice`，针对 `GNOME` 的 `GNOME Office` 或针对 `GNOME`
  的 `OpenOffice` (`OpenOffice.org`, 2007)”。


  研究人员建议进一步研究互操作性和节能问题。另一个研究领域是在 Linux 笔记本电脑上使用 `Citrix` 客户端。这将允许用户在 `Microsoft` 环境中运行时减少笔记本电脑的功耗。多个用户使用一个服务器将减少多个笔记本的功耗，而对该服务器的功耗增加微乎其微。这将从其他方面受益，例如减少笔记本上的软件支持，因为所有更新都在
  `Citrix` 服务器上进行。笔记本的节能可能无法抵消 `Citrix` 服务器的许可成本，应进行进一步分析。


  观察到的操作系统电池寿命表明程序效率存在差异。应考虑改进应用程序和操作系统代码作为减少功耗的方法。本研究定量地显示了 `SuSE Linux` 相比 `Microsoft
  Windows XP` 的节能。研究人员建议进一步分析在企业环境中使用 Linux 以减少功耗和不必要的热量的同时提高计算效率。


