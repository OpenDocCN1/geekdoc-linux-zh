  UNIX 和 Linux 系统相关的历史局限性。


  考虑到大多数用户使用电脑处理**电子邮件**、**网页浏览**以及如“Word”、“PowerPoint”和“Excel”等**办公工具**，或者更准确地说，文档、演示文和表格。对于普通微软用户来说，可能会让他们震惊的是：**Linux
  用户可以使用完全免费的应用程序**，微软和 Apple MacOS 用户也是如此。这些免费应用程序在三个操作系统上具有相同的功能和命令，并且具有互操作性，这意味着保存的文件可以在其他操作系统上使用，且使用工具的命令也是相同的。


  我使用 **Mozilla Thunderbird** 处理邮件，并享受着 **Microsoft Outlook** 提供的许多相同功能（实际上甚至更多），但无需担心宏病毒。Thunderbird
  有插件可以让我创建与在 Outlook 中相同的的规则，还能够自动从我配置在各个地点的安全摄像头发送的邮件中提取图像。通过在 Linux 中使用 `mencoder`
  等其他免费软件，我能够创建出时间延胶摄影，且大部分是通过这些免费工具自动完成的。





