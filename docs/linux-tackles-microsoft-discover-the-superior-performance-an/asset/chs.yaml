  # 第一章：引言


  ## 问题的背景

  计算计算行业正面临着能源危机。美国能源部高级官员安迪·卡斯纳 注意到当今计算设备能源消耗的不断增加（Shankland, 2006）。


  行业的焦点一直在硬件上，即优化芯片、显示技术和其他硬件。英特尔（Intel）和 IBM（IBM）正致力于通过在栅极中使用金属来减少硅氧化物中的漏电流，并将芯片部分从目前的
  65 纳米缩小到 45 纳米，以在技术缩减到原子级时进一步减少能量损失（Robertson, 2007）。随着硬件技术达到物理和材料科学的极限，另一个未被考虑过的选项出现了：计算机软件的效率。任何计算机系统的主要软件都是其操作系统（OS）。“操作系统是一个管理计算机硬件的程序”（Silberschatz,
  Galvin, & Gagne, 2002, p. 3）。


  运行基于英特尔架构 CPU 的 笔记本电脑上有两种主要的操作系统：Microsoft Windows 和 Linux。Microsoft Windows XP（Microsoft,
  n.d.）是本研究进行时最广泛的版本。“Linux 是一种由林纳斯·托瓦尔斯（Linus Torvalds）在世界各地开发者的帮助下创建的自由 Unix 类型操作系统。Linux
  在 GNU 通用许可许可证下进行开发，其源代码对所有人开放”（linux.org, n.d.）。


  研究人员在一次从华盛顿州西雅图到日本东京的往返飞行期间，观察了同一台双启动的 HP Evo N-600C 笔记本电脑上 Microsoft Windows XP
  和 SuSE Linux 电池续航时间的差异。当笔记本在 Windows XP 下运行时，研究人员实现了三小时的电池续航时间。运行 SuSE Linux 时，研究人员实现了五小时的电池续航时间。如果这些差异是可以重复的并在其他笔记本电脑上被发现，那么节电潜力可能会让其他人在往返会议时延长笔记本电脑的使用时间而受益，同时也减少企业的整体能源成本并帮助环境。计算机在使用电力时产生产生量，这些热量通常通过办公室环境中的空调排出。如果通过使用更高效的操作系统减少整体计算功耗，那么冷却办公室所需的能量也将相应减少。


  ### 本研究考虑的自变量是操作系统，Microsoft Windows XP 或 SuSE Linux。因变量是电池续航时间。


  ## 历史

  Microsoft Windows XP 于 2001 年 10 月 25 日发布。SuSE Linux 于 1992 年发布；它是第一个商业版 Linux。它一直是最受欢迎且最稳定的发行版之一。甲骨文（Oracle）自
  1998 年以来一直支持 SuSE 和其他版本的 Linux（"Oracle", 2007）。今天有数百种 Linux 发行版可用，它们都使用相同的底层内核并相互兼容。根据
  Distrowatch.com (n.d.)，SuSE Linux 位列前十。Linux 是林纳斯·托瓦尔斯于 1991 年开发的类 Unix 操作系统。Gumbel
  (2006 par. 1, 2.) 描述了托瓦尔斯和 Linux：


  林纳斯·托瓦尔斯在 21 岁时改变了世界。1991 年，他在赫尔辛基的家中公寓里工作，编写了一个名为 Linux 的新计算机操作系统内核，并并在互联网上免费发布了它——并邀请任何感兴趣的人帮助改进它。


  如今在 15 年后，Linux 驱动着世界上从超级计算机到手机的一切设备，托瓦尔斯已作为开源运动之父闻名，在这一运动中，软件代码通过协作努力共享和开发，而不是被单一所有者封锁。


  本研究评估的自变量是 Microsoft Windows XP 和 SuSE Linux。研究的因变量是电池续航时间。以分钟为单位测量电池续航时间将允许通过笔记本电池的额定值计算总功耗。


  ## 操作系统功能

  操作系统是运行计算机所需的软件。它是应用程序运行在其上的底层程序。操作系统的效率将影响功耗和电池续航时间。“效率和功能是操作系统实用用性的关键。效率为计算机上所有软件的性能奠定了基础”（Nutt,
  2003, p. 1）。


  ## 研究人员的工作角色与背景

  研究人员是波音（Boeing）787 软件开发与集成实验室的经理，支持五十多台 Windows XP、Windows 2000、Windows 2003 Server、Linux
  和 Windows Vista 系统。他在电信和数据中心拥有电子技术员、电路设计师和技术主管的经验。他曾担任系统和程序员分析师，并拥有 Windows、Linux
  和 UNIX 系统管理员的经验。他曾在英特尔、ITT、Intermec、默克、波音和美国陆军工作过。自 1979 年以来，他一直是教授电子、商业管理和计算机科学的技术讲师。他通过位于华盛顿州斯诺霍米的
  Clearview Consulting 在全国提供 Linux 和 UNIX 培训。他是西雅图城市大学（贝尔维视图）的兼职教师，教授操作系统和其他计算机科学课程。他于
  1981 年毕业于马里兰大学，获得理学学位。


  ## 问题陈述

  电池续航时间（即功耗）已成为笔记本用户和面临不断的成本及可用性的企业的一个大问题。员工流动性日益增加，在会议室之间穿梭，并参加来自全球的会议。对于那些在使用几小时后就需要充电的用户来说，电池续航时间是一个持续的问题。笔记本不再仅仅是专利波差人士的专利，而是隔间办公人员的常用工具。Roseberry
  (2006) 指出，商务级台式机的设计的设计针对商务用户而非家庭用户。这提供了访问灵活性和“虚拟”工作的能力。Kanellos (2005) 预测八小时笔记本电脑正在接近现实，而四小时是目前的标准，“尽管这种分配在现实生活中仍然难以实现”。


  ## 假设

  本研究未考虑实际能源成本，因为这随地点而异。本研究并未分析各型号的实际功耗。本研究旨在通过确定每个操作系统以分钟为单位的电池续航时间，来确定操作系统效率的差异。测试期间未对系统进行优化以消除其他变量。测试的假设是供应商已对这些操作系统进行了最稳定、高效和实用的配置优化；因此在安装过程中选择了默认安装和选项。






  本研究限于对 Microsoft Windows XP 和 SuSE Linux 操作系统的测试，以减少与其他 Linux 发行版和 Microsoft Windows
  版本相关的变量。测试在操作系统的默认安装下进行，无用户交互且没有应用程序运行。


  ## 术语定义


  - **安时 (Ah) 容量**：“衡量电池从完全充满电状态到其端电压电压下降至最低允许限制所能提供的总电量量”（Tranter, 1983, p. 27）。

  - **功率**：“功率衡量能量转换的速率。每秒内 1 焦耳能量的转换代表平均功率为 1 瓦”（Smith, 1984, p. 8）。


  ## 缩写词


  - **CPU**: 中央处理器 (Central Processing Unit)

  - **CS**: 计算机科学 (Computer Science)

  - **DLL**: 动态链接库 (Dynamic Link Library)

  - **GNU**: 一个递归缩写，意为“GNU 不是 Unix”（GNU is Not Unix），这是由开源运动创始人斯托曼（Richard Stallman）提供的名称。

  - **I/O**: 输入/输出 (input/output)

  - **IT**: 信息技术 (Information Technology)

  - **OS**: 操作系统 (Operating System)

  - **SuSE**: “软件与系统开发”（Software- und System-Entwicklung）成立于 1992 年底，最初是一个 UNIX 咨询小组。

  - **Wine**: Wine 不是一个（CPU）模拟器。（Wine Is Not a CPU Emulator, n.d., par. 2.2）。

  - **XP**: 2001 年 10 月发布的 Microsoft Windows 版本。


  # 第二章：相关文献与研究回顾


  ## 功耗


  “一位谷歌工程师警告说，如果今天计算机的每瓦性能得不到提高，运行它们的电力成本可能远高于初始硬件价格”（Shankland, 2005）。“计算机设备功耗失控可能对计算的整体负担能力产生严重后果，更不用说地球的整体健康了”（Barroso,
  2005）。Bangeman (2007) 报告说，美国环保署（EPA）将开始对数据中心的功耗进行为期六个月的研究，目标是鼓励部署更节能的硬件。


  Bangeman (2007) 识别了计算机的额外功耗：


  能源成本可占企业 IT 预算的 30%。功耗数据不仅包括服务器本身，还包括不间电源（sic）、交换机、NAS 设备和空调。这些能源账单引起了企业 IT 经理的关注。在去年秋天的英特尔开发者论坛上，谷歌研究员路易斯·巴罗索（Luis
  Barroso）表示，他的公司认为电源单元（PSU） 30% 到 45% 的输入功率被浪费了。考虑到谷歌数据中心的规模，这是一个巨大的数字。


  Bangeman (2007) 总结了这个问题及其整体影响：


  随着能源价格上涨以及对温室气体对地球气候影响的担忧，私营部门已经感到削减 IT 能源成本的需求。EPA 的研究可能会加强私营部门的这种态度，同时为联邦机构使用更节能设备减少
  IT 能源成本提供授权。


  在 CNET News.com 的一篇文章中，Shland (2006) 报道道：


  对于任何消耗能源的人来说，提高效率符合利益，EPA 能源计划的安德鲁·法纳拉（Andrew Fanara）认为。“公司必须问自己：‘我是否愿意赌能源成本会下降？’那是无所事事的代价，”法纳拉说。


  功耗是行业关注的焦点。重点一直一直是硬件的改进。运行在硬件上的操作系统和软件也必须被考虑。


  ### 计算机操作系统


  操作系统是每个计算机系统的一部分。一个计算机系统有四个主要部分：硬件、操作系统、应用程序和用户。（Silberschatz, Galvin, & Gagne,
  2002）。


  ### 计算机硬件


  硬件组件包括 CPU、内存、磁盘驱动器、视频显示器、键盘和图形用户界面。（O''Brien, 2002）。使用英特尔架构的笔记本电脑和台式机有两种主要的操作系统可用：Microsoft
  Windows 和 Linux。Microsoft Windows 和 Linux 在相同硬件上兼容的，并且可以加载到同一个系统和同一个磁盘驱动器上，尽管它们不能同时运行。在双启动配置中在同一个系统中加载操作系统将使用户兼得两者的优点。


  ### 单内核




  Linux 和 Windows 都是单内核操作系统。“在单内核中，所有软件和数据结构都放置在一个逻辑模块中……如果它们实现得当，它们可以非常高效”（Nutt,
  2004, p. 778）。Windows 和 Linux 的所有核心操作系统服务均在内核模式下的共享地址空间中运行。（Solomon & Russinovich,
  2006）。图 1 形象地表示了架构的相似性。


  ![](img/tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_me415778.png)


  *图 1.* 内核架构。注。来自 Solomon & Russinovich (2006)。


  ### 操作系统效率


  操作系统和硬件的效率将决定总功耗。根据 Brooks (1995) 的观点，软件开发项目的规模将会扩大。这种增长通常意味着程序体积增大，CPU 在程序执行期间执行的额外代码增加，从而导致功耗增加。低效的代码和缺乏优化将导致用户性能下降，这会导致获得更快、更强大的硬件，从而增加功耗。


  #### 源代码行数


  Dvorak (2004) 报道说，现在的代码量多到他被告知微软没有人能掌控它。Lohr 和 Markoff (2006) 估计 Windows XP 有超过
  2000 万行代码。Wheeler (2004) 估计一个 GNU/Linux 发行版包含 1700 万行代码，代表了 4500 人年的开发时间。两个操作系统的发行版代码量似乎相似，XP
  为 2000 万行，Linux 为 1700 万行。然而，根据 Linux 范式可以推断，Linux 代码经过开源社区的审查可能更高效。Linux 设计理念与
  UNIX 相同。由于这种理念的模块化，代码行数无法直接比较。正如 Gancarz (1995, 2003) 提出的九条原则中的第二条所示，每个程序应该只做好一件事。


  ### 笔记本电池与功耗


  电力问题对于移动工作者来说更为关键。电池为便携电脑提供电力的总时间允许用户进行生产性工作。Miles (1999) 指：“随着笔记本电脑价格下降和性能提高，它们终于成为数百万用户作为主电脑的可选项。但那些拥有最先进芯片和多媒体选项的电脑通常续航时间并不理想——许多系统只有一小时——这让许多焦虑的用户匆忙寻找电源插座。”





  目前的电池技术已经延长了许多系统的寿命，但即使在今天，大型笔记本系统的电池续航时间也仅多出一小时。运行 `Microsoft Windows` 时，典型的电池续航时间在两到三小时之间。这限制了人员的移动性，并要求携带充电器或备用电池。如果操作系统能够提供额外的续航时间，不仅可以节省能量，还能造福用户。此外，随着功率需求增加和可能发生内部短路，大多数便携式计算机中所含的
  `Lithium-Ion` 电池危险也随之增加（"PC Pitstop PC Safety", n.d.）。在 2004 年至 2006 年之间，`Dell Computers`
  与其他供应商由于缺陷电池发生内部短路的危险，导致了电池召回，“在极少数情况下，这些电池可能会过热，从而引发火灾风险”（"Battery", Dell, 2006）。`Lithium-Ion`
  是一种易燃液体，一旦发生短路，就会发生化学反应，可能导致电池熔化或爆炸，Kanellos (2006) 在为使用锌电池辩证时报告道：


  1990 年问世的锂电池是便携式电子产品中当之无愧的天才。这些储存的能量比普通充电电池得多，而且重量通常比传统的充电电池轻。笔记本电脑制造商和手机制造商利用这些特性创建了相当轻便的设备，这些设备单次充电即可运行几小时。


  遗憾的是，锂离子电池内部的短路会导致行业内所谓的“热失控”。这种反应可能导致电池外壳熔化并喷出热液体，或由于压力和热导致爆炸。全球范围内已有相关受伤报告。


  更糟糕的是，制造商通过薄化隔层（保持电极分离）和改变其他组件，继续增加锂离子电池的能量密度——即电池可以储存的能量量。这些变化带来了更长的运行时间——这是消费者的需求——但也增加了出现问题的可能性。


  “根源在于有限空间内需要越来越多的能量。你们加剧了安全问题，”制造直接甲醇燃料电池膜的 `PolyFuel` 业务发展副总裁 Rick Cooper 说。


  笔记本电脑电池的使用提供了一个有限的电源，以此评估总功耗并确定哪种操作系统更高效。减少现有硬件的功耗将有助于抵消持续增长的功率消耗。操作系统效率越高，在相同电池和硬件上的运行时间就越长。


  ## 总结


  `Microsoft Windows XP` 和 `SuSE Linux` 都使用相似的内核架构，并在相同的硬件平台上运行。它们都拥有数百万行代码。


  ### 假设陈


  基于对文献的审查和研究者的经验，本研究提出了以下假设。


  假设在笔记本电脑上，`Microsoft Windows XP` 和 `SuSE Linux` 之间的功耗之间没有显著的统计学差异（`α = .05`）。


  # 第三章：研究方法


  研究者收集了定性和定量数据以探索研究假设。完成了一项实验研究，测试了安装了默认版本 `Microsoft Windows XP` 和 `SuSE Linux`
  的笔记本电脑的电池续航时间。


  ### 研究模型


  通过实验研究考察了 `Microsoft Windows XP` 和 `SuSE Linux` 电池续航时间的差异。测试设计旨在隔离唯一的因变量：电池续航时间。测试了多种笔记本电脑型号，以消除一种型号可能相对于另一种操作系统所提供的任何优势。测试设计要求在对比测试中使用相同的物理硬盘。这确保了物理
  I/O、系统接口或磁盘驱动器的物理性能没有差异。


  为了确保在两个操作系统之间进行有效的比较，笔记本电脑被配置为“双启动”，这意味着两个操作系统都已加载并配置在同一台计算机和同一块物理硬盘上独立运行。这允许对因变量电池续航时间进行一致性测试。通过使用完全相同的硬件，自变量是测试期间唯一更改的条目。电池续航时间是功耗的代理变量。使用电池提供了有限数量的能量。两个自变量都使用同一个物理电池进行测试。在同一块电池上运行时间最长的操作系统效率最高。


  在目标笔记本电脑上进行的测试，每次测试都使用了完全相同的硬件，包括但不限于任何连接的键盘、`USB` 设备、图形输入设备（如鼠标）或连接的视频显示器。只要系统在每台笔记本电脑的两次测试中都是在相同的物理配置下测试的，电池续航时间数据就被认为是有效的。特定的电池类型或笔记本电脑型号无关，因为测试旨在显示
  `Microsoft Windows XP` 和 `SuSE Linux` 之间总功耗的差异。


  每个被测笔记本电脑的唯一自变量是操作系统。电池续航时间的测试是在操作系统在系统上完全加载并完全运行后进行的。确保操作系统完全启动并运行，可以确保电池和计算机处于工作温度，并且比较的是操作系统的静止状态。测试周期期间没有加载或运行任何应用程序。即使使用类似的应用程序也无法确保执行相同的代码，从而导致不同的系统活动并使测试结果无效。因此，研究者仅测试了没有运行应用程序的操作系统。测试期间的用户交互仅限于通过查看每个操作系统中的功率表或电池寿命指示器来观察剩余电池续航时间。


  定量数据收集自各种配置了默认安装 `Microsoft Windows XP` 和 `SuSE Linux` 的笔记本型号和品牌。操作系统加载在相同的硬件上（包括相同的硬盘），并在每个测试周期中使用相同的电池。研究收集了电池续航时间（以分钟为单位）。该研究项目的自变量是操作系统。因变量是电池续航时间。


  电池续航测试事件开始于测试人员已运行操作系统、已登录、关闭所有应用程序、关闭屏幕保护程序并打开功率表或电池指示工具时。然后测试人员记录了时间并拔掉笔记本电脑的电源。当电池耗尽导致笔记本电脑不再工作并关闭显示器时，测试人员记录了时间。测试人员记录了总运行时间（以分钟为单位）。


  总体






  研究的样本是附录 B 中找到的配置并用于测试的笔记本电脑。在选定的笔记本电脑上对每个操作系统进行了多次测试，以确保结果的有效性。此外，对范围广泛的笔记本电脑在每个操作系统下都至少进行了了两次测试，以减少硬件的变异性。电池测试可以在任何运行
  `Microsoft Windows` 或 `Linux` 的笔记本电脑上轻松复制。由于由于和资源限制，本研究仅限于研究人员和测试志愿者可以访问的系统，测试了足够数量以帮助确保统计有效性。测试人员记录时间，拔掉电池充电器或电源线，并观察笔记本电脑直到系统关机或关闭，然后记录时间并记录所测试系统的总电池续航时间（以分钟为单位）。测试人员重新连接系统电源，为电池充电，并进入另一个操作系统。一旦电池充满电，测试人员对另一个操作系统重复该过程。每个笔记本电脑的测试周期有两个数据点，一个针对
  `Microsoft Windows XP`，另一个针对 `SuSE Linux`。


  ### 数据收集设备


  从每台笔记本电脑收集的电池续航数据被汇总并加载到电子表中。记录的数据包括笔记本品牌和型号、`Microsoft Windows XP` 和 `SuSE Linux`
  的电池续航时间（分钟），并指出了两个操作系统之间的百分比差异。电子表中的参数数据使用独立样本 `t`-检验进行分析，以确定两组之间是否存在统计显著性差异。


  ### 可信度与有效性


  每台笔记本电脑都安装了 `Microsoft XP` 和 `SuSE Linux`。每个操作系统在测试中均使用默认安装。系统未进行节电优化。测试期间，硬盘和显示器未关闭，笔记本电脑也不允许进入睡眠模式。操作系统在静止状态下运行，没有应用程序运行，也没有用户交互。通过在没有应用程序和没有用户交互的情况下进行测试，每个操作系统都经过了独立测试，可以进行合理的比较。预计在实际操作中，用户不会修改系统参数，其预期的电池续航时间将与这些测试并行。测试了多个供应商和型号，以消除某个型号可能针对一个操作系统或另一个进行优化的可能性。测试多个型号还消除了可能使一个操作系统优于另一个系统的特定硬件特性。变量可能包括内存芯片、CPU
  类型、磁盘类型以及未纳入本次测试的其他设备。通过测试多台笔记本电脑，研究人员能够收集到有效且可靠的数据。


  ### 数据处理与步骤


  收集的电池续航数据使用配对样本 `t`-检验进行评估。（Cooper & Schindler, 2006）。显著性水平为 `p` < .05。零假设是 `Windows
  XP` 和 `SuSE Linux` 之间的电池续航时间没有统计显著差异。


  # 第四章：结果


  **在附录 B 中指定的 11 台不同笔记本电脑上进行了 88 次电池续航测试**。笔记本电脑被分为四种 CPU 类型。从每次电池测试中收集的数据（分钟）按独立变量——操作系统
  `Microsoft Windows XP` 和 `SuSE Linux` 进行组织。


  每次测试均在 `Windows XP` 或 `SuSE Linux` 电池充满电的情况下开始。测试在不使用应用程序、无用户交互且环境温度相同的情况下进行。在每个操作系统中都进行了静态测试，以确保研究人员不是电池耗电的变量。笔记本电脑上的两个操作系统均使用默认配置，以消除与自定义和优化相关的变量。未使用屏幕保护程序，且系统未关闭显示器和磁盘。使用相同的环境温度以消除电池温度这一变量。


  收集的数据分为四种 CPU 类型。第一组 CPU 是 `Intel Pentium 4`。在此组中测试的笔记本电脑有 `Fujitsu Lifebook C-2240`、`Toshiba
