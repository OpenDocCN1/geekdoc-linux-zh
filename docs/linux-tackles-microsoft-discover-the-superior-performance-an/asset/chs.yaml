  Linux 仍然优越。**


  第二个测试涉及总功耗。该测试在多种笔记本电脑上进行，仅限于 `Microsoft XP` 和 `SuSE Linux`。**使用四种不同的 CPU 类型在十一台不同的笔记本电脑上进行了八十八次电池寿命测试。**
  这些详尽的测试是我研究生研究的一部分，并在本书的第三章。中提供。


