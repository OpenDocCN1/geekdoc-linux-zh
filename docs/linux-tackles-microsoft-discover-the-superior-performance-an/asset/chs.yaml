  ## Unix 哲学

  该哲学是几十年软件开发的结果，源于 UNIX 社区而非强加于它。它是一种事实上的软件开发风格。


  Unix 哲学的九大主要原则包括：


  1. 小即是美

  2. 让每个程序只做好一件事

  3. 尽快构建原型

  4. 可移植性优于效率

  5. 将数值数据存储在平面文件中

  6. 利用软件杠杆

  7. 使用 Shell 脚本增加杠杆和可移植性

  8. 避免闭源用户界面

  9. 让每个程序都成为过滤器


  十个次要原则

  1. 允许用户定制环境

  2. 使内核保持小型且轻量化

  3. 使用小写并保持简洁

  4. 节省树

  5. 沉默是金

  6. 并行思考

  7. 部分之和大于整体

  8. 寻找 90% 的解决方案

  9. 坏胜于全

  10. 层级化思考





  “如果你无法理解它，那么你就不属于这里。”


  本书仅限于微软和 Linux 操作系统差异的两个因素进行分析。还有其他可以分析的因素，可以进一步展示这两个操作系统之间的差异。安全性可以单独写一本书，并且会很大程度上倾向于
  Linux 版本；而对易用性的分析可能很大倾向于微软版本。如果将 MacOS 也考虑在内，可能会发现另外两个操作系统最好和最坏部分的结合。MacOS 在 Dell
  硬件上进行过测试，但它是一个被黑破解以运行在 Dell Latitude 系列上的旧版本，并不能准确代表当前的 Mac 机型。然而，在将 MacOS 作为服务器和工作站使用后，它是对其整体性能的合理代表——与
  Linux 系统相比，这种性能非常糟糕，但可能优于微软。目前没有办法在本书涉及的两个测试所使用的硬件上准确地比较当前的 MacOS 版本。


  为了清楚地展示差异，确定使用同一台笔记本电脑是进行此测试的唯一准确方法。同一台笔记本电脑加载了不同版本的操作系统，然后运行了相同的测试，如第二章所示。测试最初写在批处理文件中，然后翻译成
  shell 脚本以进行这种比较。批处理文件和 shell 脚本都运行三次测试，并记录这三次测试的次数。为了确保数据的统计学有效性，我随后对每个操作系统至少运行了两次测试。这提供了六个性能数据样本。如果我注意到测试结果存在波动，我会检查系统以确保没有应用程序在测试期间启动，或者是否有其他干扰。在某些情况下，我将这三次测试重复了三次，以提供
  9 个多个样本。这些测试并非为了提供绝对值，也不是为了面对研究生委员会的严格审查，而仅仅是为了展示在特定硬件上不同操作系统之间的任何差异。


  测试期间设备未连接网络。没有激活屏幕保护程序；没有开启省电功能，且系统在测试前应处于空闲状态。在几次针对微软的测试中，确定了防病毒软件正在干扰测试，于是将其关闭并重新进行测试，这大大改进了微软版本的性能时间。糟糕的测试表现被排除在结果之外。在对双启动驱动器的一组测试中，特定的硬盘在两个操作系统上的表现都很糟糕，它也被排除在测试结果之外。这意味着进行的和重复的测试次数比报告的更多，以确保结果的可靠。Linux
  系统没有运行防病毒软件或防火墙，也断开了网络，且没有其他应用程序在运行。如果在测试期间我确实使用了系统，结果会有细微变化，但如果差异显著，我会运行更多无活动状态的测试以确保样本的可靠。


  第二组关于功耗的测试是在各种硬件上使用 XP 和 SuSE Linux 进行的，这些硬件使用相同的硬盘和电池。这是通过双启动实现的，以确保硬件是相同的，且硬盘之间没有差异。这些结果在本书的第三章中有详细描述。


  # 第二章：性能测试


  在本章中，问题是操作系统执行重复测试的效果如何以及需要多长时间。测试最初是为了测试 Windows XP 和 Windows 7 之间的差异而开发的。随后它被用于测试
  Windows 8 以及最近的 Windows 10。在下面的图中，有一只猫在田野上飞速奔跑![](img/tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m209dc91.jpg)。用于比较微软版本的测试引发了一个问题，即
  Linux 在相同硬件上运行相同测试时的表现如何。我将 Windows 批处理文件转换成了 `BASH` shell 脚本，任何熟悉 `UNIX` 脚本的人都会提供改进建议，但那样测试就不再相同了。微软的批处理文件在功能功能上非常有限，为了进行性能测试，我按行复制了批处理文件，用
  `DOS` 命令替换为可比的 `Linux` 命令。这是我的说法，我会坚持这一观点，尽管我对该脚本的粗糙感到有些羞愧，但正如我告诉学生们的那样，简单总是有效的（`SAW`）。


