  通过 Linux，人们可以拯救许多即将损坏的硬盘，保存童年照片、文档、电子表格和其他重要且不可替代的文件。这是 Linux 的另一个非常难以量化的优势：Linux
  读取微软系统无法挂载或读取的硬盘器的能力。如果微软系统无法读取某个驱动器，重要的是立即关闭该系统，并将驱动器取出并连接到 USB 设备上，然后连接到 Linux
  系统进行抢救。如果硬盘发生了机械故障，在尝试抢救之前，将硬盘放入冷冻可能会有所帮助。


  但那是另一本书的主题了——《简明 Linux：在现实世界中使用 Linux》，在书中，我将详细介绍挂载驱动器的步骤，以及如何使用如 `dd` 等命令逐块复制整个磁盘。这些命令在微软的操作系统中是不可用的，但即使是最精简的
  Linux 安装版也自带，包括 Live CD 以及像 `Gparted` 这样的工具。`Gparted` 是一个基于 Debian 的分区和磁盘管理实用，它也可以运行在
  Debian Linux 上，让人们可以在不安装系统的情况下尝试 Linux。下方显示了基于 Debian 的 `Gparted` 截图，你可以看到用于定义分区的图形工具，以及一个打开的终端窗口，其颜色已更改。显示的命令为：`sudo
  su -` 以在“实时会话”中获得 root 权限。从那里，你可以输入 `fdisk -l` 并确定哪个驱动器存在问题。你可以通过输入 `mkdir /a ;
  mount /dev/sdxx /a` 来创建一个虚拟挂载点 `/a`，其中 `sdxx` 是特定的分区。一旦挂载了系统，你就可以切换到该目录，检查文件并将其复制到本地驱动器或其他外部挂载的驱动器。


