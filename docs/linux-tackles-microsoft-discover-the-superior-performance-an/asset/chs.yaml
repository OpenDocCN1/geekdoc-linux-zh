  结果表格显示，在特定硬件上，未启用防病毒等安全功能的情况下，Linux 效率更高。这些测试是在不同硬件上运行的，结果显示 Linux 优于微软。在现实世界中，必须在微软系统上运行防病毒和防火墙等安全措施，因此这些测试结果实际上显示微软在现实世界中表现更好。尽管在分析后期才注意到这种差异，这说明这些测试需要仔细计划，以识别并消除变量。在这种情况下，我不会回去更改这些数据，尽管我可能会安装各种防病毒软件后对
  Win7 默认版本进行测试。这有助于指出 Symantec、McAfee 和 Microsoft Essentials 之间的性能影响。但那是另一个松鼠，我不会去追它。


  下面的图片显示了一只坐在 Tonka 玩具上的猫，看起来非常自得：


  ![](img/tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m278317.jpg)


  我感到有趣的是，SuSE 13.2（最新版本）比微软的版本快了 10 倍。公平地说，Windows 10 是一个测试版且是 32 位。但 SuSE 仍然比 Windows
  8.1 企业版快两倍，后者在测试中关闭防病毒软件时慢了近九倍。问题在于，在现实世界中人们必须运行防病毒、防火墙和其他安全措施，因此这些测试应该在开启这些功能的情况下进行。


  还有其他 Linux 版本可用，最流行的列在 distrowatch.com 上，截至 2014 年 12 月，排名前七的 Linux 版本是 Mint、Ubuntu、Debian、openSUSE、Fedora
  和 CentOS（所示）。这看起来是七个不同的版本，但实际上只有三个。Mint、Ubuntu 和 Debian 彼此密切相关，并使用许多相同的工具。Debian
  是这三者中的原始，Ubuntu 是基于 Debian 的流行更新版本，而 Mint 是为了提供一个利用了 Ubuntu 特性的改进版 Debian。这三者都使用相同的
  `apt-get` 更新工具和仓库。





  OpenSUSE 独一无帜，无论是在职业还是个人层面，都是我的最爱。它基本上与 `SLES/SLED`（即 SUSE Linux 企业服务器或桌面版）相同。OpenSUSE
  通常在企业版之前进行开发和发布。企业版非常稳定且更新频率不高，非常适合企业环境使用。它是两个获得 Oracle 认证可使用的主要发行版之一。另一个适用于 Oracle
  的版本系列是 RedHat 家族，在列表中由 `Fedora`（家庭版）和 `CentOS`（一个受专业支持的 RedHat Linux 版本，适用于 Oracle）代表。RedHat
  Enterprise 未列在 `distrowatch.com` 上的原因是因为它价格昂贵且使用受到限制。RedHat 采取了类似于微软的许可模式和成本结构，而
  RedHat 昂贵的支持费用和成本被微软营销部门用作展示微软是多么“可负担得起”。考虑到我们可以选择使用免费版本的 SUSE 和 `CentOS` Linux，配合
  Oracle 的不可破的 Linux（Unbreakable Linux）来运行 Oracle 工具套件，并依然获得 Oracle 认证和支持，这又是另一个伪善的
  FUD（恐惧、不确定、怀疑）论点。然而，如果你是一个 MBA、新入职的 CIO、一个普通的会计师或微软支持人员，并且你不了解 Linux 世界，你可能不知道它们之间的区别。但你现在知道了。


