  ## 关于照片


  这些照片由作者他的两只猫 `Mac` 和 `Jack` 从 2010 年左右开始拍摄。书封面显示 `Mac` 在车道上扑向 `Jack`。这张照片似乎非常适合这本书的主题：`Linux
  挑战 Microsoft`。`Jack` 毛茸脸上的表情表明它真的没有预料到发生的事情，我想大多数 `Microsoft` 用户也没有预料到 `Microsoft`
  和 `Linux` 正在发生的情况——`Microsoft` 正在衰落，而 `Linux` 却变得越来越好。


  `Jack` 是那种会玩食物并奇奇奇怪风险的猫。我会看着它刚踏上树枝就从树上掉下来。看着 `Jack` 从那棵悬在巨大岩石上的 `River Birch` 树掉下来真很难受……它直接四脸朝地摔在了石头上，然后起来坐在我儿子的
  `Jeep` 旁边，对着太空发呆，偶尔眨眨眼睛持续了好久。`Jack` 在受惊时会从两层楼楼顶全速冲下，脸朝下地掉落在车道上。`Jack` 会沉迷于玩它抓到的东西，这可能导致它被邀请参加晚餐并作为主菜。我们怀疑一只郊狼在它于野外拨弄零食时抓住了它。无论哪种情况，自
  2011 年以来我们就一直想念它。我们仍然在享受它的兄弟 `Mac`。不，`Mac` 的名字不是来自电脑，也不是来自雷德蒙的某种饮料，而是来自一个服装产品线。是我妻子给这些小猫起的名字。`Mac`
  是一个寻找热源的毛球，所以我必须让笔记本电脑只打开一半，并确保电脑后面有足够的空间供空气流通。如果我们找不到它，就会去车库看 `Jeeps` 的引擎盖上，那里有
  `Diesel` 发动机的涡轮增压器，在 `DVR` 上方，靠近地暖或任何产生热量的地方。如果有人开着笔记本离开，`Mac` 会进行一次 `buffer overflow`（溢溢）测试……


