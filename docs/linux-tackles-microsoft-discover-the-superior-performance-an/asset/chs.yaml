  ## 操作系统


  自从 1970 年代开始接触操作系统以来，我经历了各种版本。由于微软发布的版本具有各种名称，而在 Linux 中我们经常用版本号来限定这些功能。当微软发布下一个版本时，你可能会认为我在造假。现在，让我们看看这些差异。


  由于微软发布的版本具有各种名称，而在 Linux 中我们经常用版本号来限定这些功能。功耗（第二章） 功耗（第三章） 由于微软发布的版本具有各种名称，而在 Linux
  中我们经常用版本号来限定这些功能。由于微软发布的版本具有各种名称，而在 Linux 中我们经常用版本号来限定这些功能。。


  Windows 8.1 是 NT 版本 6.3，而 Windows 10 是 6.4。当你检查 `version` 命令的输出时，它提供了三部分信息。第一个是**主内核**版本，在最近的发布中为版本
  6。这包含了 Windows Vista 到 Windows 10。第二个值是**次要版本**，Win7 为 6.1，Win8 为 6.2，Win8.1 为 6.3。第三个值是**生成版本号**。Windows
  10 的早期版本显示为 6.4.9841。




  通过实验，我了解到注册表设置可以成功地在不同的 Windows 版本之间移动。我将设置从 `XP` 导出到 `Win7`、`Win8` 和 `Win10`。我还可以通过从
  `Win7` 的本地用户下导出 `IE` 设置并将其导入 `Win8`，从而让 `Internet Explorer` 在 `Win8` 中运行。这进一步证明了微软操作系统之间基础内核的相似性。然而，正如性能测试所示，性能上存在显著差异。对这些差异的分析超出了本文的范围，但会导致你系统上的可比测试结果出现变化。这取决于诸如`反病毒软件`、`防火墙软件`、`补丁`、`新增组件`以及你的环境变量和设置。它还取决于系统上的特定硬件，例如`CPU`
  类型、`内存芯片`、`硬盘型号`和品牌、`网卡`以及`显卡`。这也是为什么在比较版本或配置时必须在相同的硬件上进行测试的原因，否则会引入过多的变量，数据将失去意义。当一个朋友在他的系统上运行
  `LoadTest` 批处理文件时，他报告了他的分数，我不得不指出该数字并不代表与其他系统的相对分数，而是针对他特定计算机的，只能与该系统上的其他操作系统进行比较。他熟悉我们用来基准测试系统性能的早期测试软件。此测试仅限于一个系统上操作系统的比较。


