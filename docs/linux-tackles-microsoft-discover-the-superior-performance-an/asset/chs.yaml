  ## 性能测试方法

  本章描述的第一个测试记录了执行一系列旨在加载计算机输入/输出系统、`磁盘驱动器`、`内存`和`CPU`的步骤所需的时间。该测试对于相同硬件上的所有微软和`Linux`操作系统都是相同的，确保了唯一的变量是操作系统。如果你在不同的硬件上运行测试，除非你也在该相同硬件上运行另一个操作系统，否则你将无法获得可靠的指标。该测试不像旧的
  `Norton SI` 测试，后者可以在多种系统上运行以比较 `Windows 95` 上的相对性能。


  当我在本该优越得硬件上运行下方提供的性能测试时，结果并非我所预期。然而，在同一系统上运行几次测试后，我现在意识到这些结果之所以不同是因为我忘记禁用微软系统上开启的所有安全工具，这些工具极大地阻碍了它的性能。但在现实世界中，微软系统需要具备这些措施，但我试图运行一个比较可比配置的测试，由于
  `Linux` 不需要`反病毒应用程序`，我禁用了所测试的 `Microsoft` 系统上的这些工具。**换句话说，我在这些测试中赋予了微软一个它们在现实世界中无法享有的优势，而
  Linux 仍然优越。**


