- fmt: '

    It is recommended that Linux be used with interoperable tools like `OpenOffice`,
    `Mozilla Thunderbird`, and `Mozilla Firefox`. Using a dual-booted laptop would
    allow the user to switch to `Microsoft Windows` when `WINE`, `Code Weavers Cross
    Over`, `VMware`, or `Citrix` would not work or are unavailable and a `Microsoft
    Windows` proprietary application had to be used. Large scale proprietary applications
    could be run on `Citrix`, permitting users to experience the power savings and
    extended battery life of Linux, while also reducing overall software license costs
    by having fewer licensed applications.


    The researcher recommends research into the power savings while using applications.
    Both `SuSE` and `Microsoft Windows` use the application `OpenOffice`. The use
    of `OpenOffice` would provide the tools necessary for workers to be productive
    while maintaining interoperability with the `Microsoft Office` suite. The tests
    would be tailored to the particular environment used in a corporate environment.
    Comparisons of file creation, opens, saves and edit times would be monitored and
    tested on both operating systems and also compared with `Microsoft Office` on
    `Windows` to see if there are measurable differences in power consumption as well
    as performance. Additional tests would be conducted to ensure full interoperability
    between the two applications to determine if files created in either may be opened,
    edited and saved across both applications without file corruption or data loss.


    In addition to the power savings and extended battery life of Linux, the total
    costs of operation and ownership should be evaluated, such as the operating systems
    acquisition costs, installation times, time spent configuring the operating system
    for useful work, the installation of all applications to be used, the time spent
    dealing with malware, worms, viruses, `Trojan horses` and other destructive software,
    and their removal and restoration to normal operating, that currently plagues
    the `Microsoft Windows` operating systems.


    In addition to power, and costs, the performance of the operating systems should
    be monitored. It is likely that there will be performance benefits using Linux
    as the efficiency demonstrated in these battery life tests would also indicate
    more responsive user interaction with applications and the system. Specific tests
    with known file size documents or spreadsheets could be used and timed. The files
    would need to be of sufficient size to make any differences more noticeable and
    measurable.


    The researcher also suggests further testing of the difference between the latest
    release of `Microsoft Windows Vista` and `SuSE Linux` to see if there is even
    further power savings available by using `SuSE Linux`, as this would most likely
    be the case considering the additional lines of code and `DLLs` used in `Vista`
    over `XP`.


    The researcher conducted two tests of `Vista Enterprise Edition` on the `IBM R50p`
    used in the tests conducted for this study. `Vista` lasted 113 minutes in one
    test and 128 minutes in another. The mean time on the same `IBM R50p` for Linux
    was `266.2` minutes, `σ = 14.906`. The two tests of `Microsoft Vista` on the `IBM
    R50p` indicate that `SuSE Linux` would save an average of 57% over `Microsoft
    Vista`, where only 19% savings were realized over `Microsoft Windows XP`. The
    power consumed on the `IBM R50p` was estimated to be `16.07` Watts for `SuSE Linux`,
    `19.82` Watts for `Microsoft Windows XP`, and `35.49` Watts for `Windows Vista
    Enterprise` (See Figure 6, Appendix D). This startling and significant increased
    power consumption by `Windows Vista` is disturbing considering the claims of power
    savings presented by `Microsoft`. A savings of 57% of `SuSE Linux` over `Microsoft
    Vista` exceeds any of the systems tested using `Microsoft XP` and opens up the
    question of how much more savings might be realized on systems that showed more
    power savings over `Windows XP`. This should be an area for expanded research.


    There are a number of commercial and Open Source applications that work the same
    on `Microsoft Windows` and Linux. Some of these applications are web browsers,
    such as `Mozilla Firefox` and `Opera`, email clients, such as `Mozilla Thunderbird`,
    and of course the `OpenOffice` office suite that provides comparable tools to
    `Microsoft Office` at no cost, and `StarOffice`, which is one version newer than
    the free `OpenOffice` and supported through purchase by `Sun Microsystems`. There
    are specific commercially available products that permit the use of `Microsoft`
    applications directly in Linux. `CodeWeavers` `&quot;CrossOver&quot;` is one such
    product. (CodeWeavers, 2007) The `Xandros` distribution of Linux includes the
    `CodeWeavers` application `CrossOver`. (Xandros, 2007) Many of these applications
    are built on or use `Wine`.


    `Wine` is a translation layer (a program loader) capable of running Windows applications
    on Linux and other `POSIX` compatible operating systems. Windows programs running
    in `Wine` act as native programs would, running without the performance or memory
    usage penalties of an emulator, with a similar look and feel to other applications
    on your desktop.


    The `Wine` project started in 1993 as a way to support running `Windows 3.1` programs
    on Linux. Bob Amstadt was the original coordinator, but turned it over fairly
    early on to Alexandre Julliard, who has run it ever since. Over the years, ports
    for other Unixes have been added, along with support for `Win32` as `Win32` applications
    became popular. (`winehq`, n.d.).


    UPDATE 2020: Use Oracle''s `VirtualBox` - Virtual Machines to install Microsoft!


    There are websites dedicated to providing useful "crossover" information, one
    such site is `http://www.grokdoc.net/index.php/Application_Crossover_Chart` provided
    by `groklaw.net`''s `grokdoc.net` page, which cites, "There are three basic free
    office packages available for Linux. `KOffice` for `KDE`, `GNOME Office` for `GNOME`
    or `OpenOffice` (`OpenOffice.org`, 2007) for any Linux".


    The researcher recommends further research into the issues of interoperability
    and power savings. Another area of research would be the use of a `Citrix` client
    on a Linux laptop. This would allow a user to reduce power consumption on the
    client laptop computer while operating in a `Microsoft` environment that is running
    on a server. The use of one server by several laptop users would reduce the power
    consumption on several laptops with negligible increase in power use on that server.
    This would benefit an organization in other ways, such as reducing the software
    application support on the client laptops as all updates would occur on the `Citrix`
    server. The power savings on the laptops may not offset the license costs of the
    `Citrix` server, and further analysis is recommended.


    The observed differences in the operating system battery life reveal that there
    is a difference in program efficiency. Improvement of application and operating
    system code should be considered as a means of reducing power consumption. This
    study quantitatively showed the difference in power savings of `SuSE Linux` over
    `Microsoft Windows XP`. The researcher recommends further analysis towards applying
    the use of Linux in the corporate environment as a means of reducing power consumption
    and unnecessary heat while improving computing efficiency.


    REFERENCES


    *Application Crossover Chart* (2007, February 2) *.* Retrieved March 20, 2007,
    from http://www.grokdoc.net/index.php/Application_Crossover_Chart


    Bangeman, E. (2007, January 14). *EPA to study data center power consumption.*
    Retrieved February 7, 2007, from http://arstechnica.com/news.ars/post/20070114-8612


    Barroso, L. (2005, September). *ACM Queue - The price of performance.* Retrieved
    February 7, 2007, from http://acmqueue.com/modules.php?name=Content&pa=showpage&pid=330


    Brooks, F., Jr. (1995). *The mythical man-month: Essays on software engineering*.
    Reading, MA: Addison-Wesley.


    *CodeWeavers* (2007) Retrieved March 20, 2007 from, http://www.codeweavers.com/

