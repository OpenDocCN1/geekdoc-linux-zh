    ## Performance Testing Methodology

    The first test described in this chapter, records the time it takes to do a series
    of steps intended to load the computer’s input/output system, `disk drive`, `memory`
    and `CPU`. This test is the same for all Microsoft and `Linux` operating systems
    on the same hardware, ensuring that the only variable was the operating system.
    If you run the tests on different hardware you will not have a reliable metric
    unless you also run the other operating system on that same hardware. The test
    is not like the old `Norton SI` test that could be used on a variety of systems
    to compare relative performance on `Windows 95`.


    When I’ve run the performance test provided below on what should have been vastly
    superior hardware the results were not what I expected. However, after running
    the tests on the same system several times I realize now that those results differed
    because I had neglected to disable all the security tools enabled on the Microsoft
    system, which greatly hampers its performance. In the real world though a Microsoft
    system needs to have those measures in place, but I sought to run a test that
    compared comparable configurations, and in that `Linux` does not require an `anti-virus
    application` I disabled those tools on the `Microsoft` systems tested. **In other
    words, I gave Microsoft an advantage in these tests they are not able to enjoy
    in the real world, and Linux still was superior.**


    ## Power Consumption Analysis

    The second test involved total power consumption. This test was conducted over
    a variety of laptops between only `Microsoft XP` and `SuSE Linux`. **Eighty-eight
    battery life tests were conducted on eleven different laptops using four different
    CPU types.** The exhaustive tests were conducted as part of my graduate research
    and are provided in [Chapter Three of this book.](#tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_31a7c7d6.jpg)


