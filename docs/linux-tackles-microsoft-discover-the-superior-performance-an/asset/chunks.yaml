    Through experimentation I''ve learned that registry settings can be moved between
    versions of Windows with success. I''ve exported settings from `XP` into `Win7`,
    `Win8` and `Win10`. I was also able to get `Internet Explorer` working in `Win8`
    by exporting the `IE` settings under local user from `Win7` and imported them
    into `Win8`. This further shows the basic underlying kernel similarities in the
    Microsoft Operating Systems. However, as the performance tests have revealed there
    are significant differences in performance. The analysis of those differences
    is beyond the scope of this work, but will result in variations of comparable
    testing on your system. It depends on software such `anti-virus software`, `firewall
    software`, `patches`, `added components`, and your environment variables and settings.
    It is also dependent on the specific hardware on your system, e.g. the type of
    `CPU`, `memory chips`, `hard drive model` and brand, `network card` and the `video
    card`. This is also why the testing has to be done on the same hardware if comparing
    versions or configurations. Otherwise too many variables would be introduced and
    the data would be meaningless. When a friend ran the `LoadTest` batch file on
    his system he reported his score, and I had to point out that the number did not
    represent a relative score to other systems, but was specific to his computer
    and could only be compared with other operating systems on that system. He was
    familiar with earlier testing software we could use to benchmark system performance.
    This test is limited to the comparison of operating systems on one system.


