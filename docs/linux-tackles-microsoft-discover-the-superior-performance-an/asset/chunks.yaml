    While most UNIX or Linux users will not find any of this information terribly
    earth-shattering, as they likely know first hand that there is a difference through
    use. **However, they will likely not have quantified those differences.** That’s
    what these tests were intended to do, quantify the differences in order to contribute
    towards the greater analysis of TCO (Total Cost of Operation). It''s also to put
    legs on the argument that Linux really is better instead of just saying it is.
    To the casual computer user or the Microsoft user unfamiliar with the Linux operating
    system these comparisons may cause them to consider trying Linux and learning
    for themselves how Linux has significantly improved and is far more user friendly
    than when first introduced.


    The regular computer user typically uses a computer for web browsing, email, and
    office applications. Both Microsoft and Linux support Mozilla Firefox for web
    browsing, Mozilla Thunderbird for email, and OpenOffice or LibreOffice on both
    platforms, fully compatible with the Microsoft proprietary equivalents, but also
    completely free, and with fewer security concerns related to viruses, malware
    and related issues.


    The first thing that needs to be considered in the differences between Linux and
    Microsoft is the underlying paradigm. Microsoft is heavily slanted towards making
    the use of the computer as simple as possible for the user, providing very little
    control or options and makes extensive use of time consuming "**captive user interfaces**"
    that do not permit the copying of the information from, adding to more work if
    you want to document the system. This is evidenced in the crudeness of the Batch
    file created to test the difference in performance. The batch file is lacking
    in features that are readily available within the Linux shell environment. To
    the Linux or UNIX user, be aware that the shell script created to compare Microsoft
    to Linux was a direct translation of that Batch file and does not reflect good
    shell scripting. It is purposely the same as the Microsoft Batch file for direct
    performance comparison. **To distinguish the differences in the operating systems
    one must consider the underlying philosophy of both UNIX and Linux.**


