    ## Unix 哲学

    该哲学是几十年软件开发的结果，源于 UNIX 社区而非强加于它。它是一种事实上的软件开发风格。


    Unix 哲学的九大主要原则包括：


    1. 小即是美

    2. 让每个程序只做好一件事

    3. 尽快构建原型

    4. 可移植性优于效率

    5. 将数值数据存储在平面文件中

    6. 利用软件杠杆

    7. 使用 Shell 脚本增加杠杆和可移植性

    8. 避免闭源用户界面

    9. 让每个程序都成为过滤器


    十个次要原则

    1. 允许用户定制环境

    2. 使内核保持小型且轻量化

    3. 使用小写并保持简洁

    4. 节省树

    5. 沉默是金

    6. 并行思考

    7. 部分之和大于整体

    8. 寻找 90% 的解决方案

    9. 坏胜于全

    10. 层级化思考


