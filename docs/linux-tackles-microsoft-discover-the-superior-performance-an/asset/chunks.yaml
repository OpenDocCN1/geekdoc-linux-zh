    OpenSUSE 独一无帜，无论是在职业还是个人层面，都是我的最爱。它基本上与 `SLES/SLED`（即 SUSE Linux 企业服务器或桌面版）相同。OpenSUSE
    通常在企业版之前进行开发和发布。企业版非常稳定且更新频率不高，非常适合企业环境使用。它是两个获得 Oracle 认证可使用的主要发行版之一。另一个适用于 Oracle
    的版本系列是 RedHat 家族，在列表中由 `Fedora`（家庭版）和 `CentOS`（一个受专业支持的 RedHat Linux 版本，适用于 Oracle）代表。RedHat
    Enterprise 未列在 `distrowatch.com` 上的原因是因为它价格昂贵且使用受到限制。RedHat 采取了类似于微软的许可模式和成本结构，而
    RedHat 昂贵的支持费用和成本被微软营销部门用作展示微软是多么“可负担得起”。考虑到我们可以选择使用免费版本的 SUSE 和 `CentOS` Linux，配合
    Oracle 的不可破的 Linux（Unbreakable Linux）来运行 Oracle 工具套件，并依然获得 Oracle 认证和支持，这又是另一个伪善的
    FUD（恐惧、不确定、怀疑）论点。然而，如果你是一个 MBA、新入职的 CIO、一个普通的会计师或微软支持人员，并且你不了解 Linux 世界，你可能不知道它们之间的区别。但你现在知道了。


    下图是来自 `Distrowatch.com` 的截图，显示了发行版的评级：


    ![](img/tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m44ca1535.png)


    证据表明，虽然在两个操作系统上使用的基本命令相似，但整体性能存在明显差异，这使得 Linux 操作系统成为性能的领导者。考虑到下一个因素——功耗（我最初进行详尽测试的领域），这是合理的。


    # 第三章：功耗分析


    以下是针对这一问题进行的研究生研究：“如果 Microsoft Windows 和 Linux 之间的功耗存在差异会怎样？”


    在下面的图中，猫咪 Jack 和 Mac 正在分析我办公室墙上激光束的功率输出：


    ![](img/tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_7fa1ef6e.jpg)


    研究生研究的一部分涉及计算使用受审查的两个操作系统运行笔记本电脑的实际功耗，特别是 `IBM R50p` 上 SuSE Linux 和 Microsoft
    XP `sp2` 之间的功耗。遗憾的是，我不再拥有那台笔记本电脑，并且认为使用 `Dell D630`或其他硬件再次运行测试对研究没有额外价值。可以通过计算其他硬件上记录的差异来推断这些值，然后使用这些值来计算新版本的相对功耗。但这种方法是不准确的，因为新操作系统与旧硬件的兼容性可能较低。如果这些信息非常重要，则需要在相关硬件上进行电池续航测试，这意味着需要使用笔记本电脑。


    根据研究生研究提供的分析，确定笔记本电脑的功耗如下：


    ### Linux (SuSE) - 16 瓦


    - **XP SP2 - 19 瓦** - 比 Linux 多 3 瓦或功耗增加 16%

    - Vista - 36 瓦 - 比 Linux 多 20 瓦或功耗增加 56%

    - **Win7 - 35 瓦** - 比 Linux 多 19 瓦或功耗增加 55%

    - Win8 - 23 瓦 - 比 Linux 多 7 瓦或功耗增加 31%


    下图显示了图 6，原始研究中的表格：


    ![](img/tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m122b4e8d.png)


    上述总结的部分信息是对原始研究的后续，该研究探讨了在其他硬件类型上是否存在差异的问题。因此，在多个硬件平台上进行测试并分析数据至关重要，以确保差异不仅仅出现在某一种硬件上。下面的研究是在几种硬件类型、型号和品牌上进行的，使用了四种不同的
    CPU，以确认 Linux 相比微软的节电确实与操作系统本身有关，而非硬件。呈现的研究提供了促使我研究生研究的背景细节。提供这些内容是为了证明定量且统计学上有效的数据，以支持
    Linux 比微软系统的成本节约。可以在较新的硬件上使用较版本的操作系统重复测试以使其更具相关性，文中已包含测试方法。


    ## 笔记本电脑上 MICROSOFT WINDOWS XP 与 SUSE LINUX 的功耗对比


    作者：John Edward Meister, Jr.


