    One laptop was chosen from those tested in my research to analyze the actual power
    consumption and calculate the wattage required by the operating systems in their
    quiescent state. An IBM R50p was assigned to the lab I manage and was used to
    compare other operating systems. A summary of that analysis is provided at the
