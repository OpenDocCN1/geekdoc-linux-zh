    ## `security and functionality`


    以下内容在书中是无法实现的，部分：


    ![](img/tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_32b28a.png)


    双方的观点都有道理，这意味着没有任何操作系统对所有人来说都是完美的。这两个系统在性能和功耗方面有明显的优势，本书量化了这些差异，并提供了一些实用的解决方案，以克服与
    UNIX 和 Linux 系统相关的历史局限性。


    考虑到大多数用户使用电脑处理**电子邮件**、**网页浏览**以及如“Word”、“PowerPoint”和“Excel”等**办公工具**，或者更准确地说，文档、演示文和表格。对于普通微软用户来说，可能会让他们震惊的是：**Linux
    用户可以使用完全免费的应用程序**，微软和 Apple MacOS 用户也是如此。这些免费应用程序在三个操作系统上具有相同的功能和命令，并且具有互操作性，这意味着保存的文件可以在其他操作系统上使用，且使用工具的命令也是相同的。


    我使用 **Mozilla Thunderbird** 处理邮件，并享受着 **Microsoft Outlook** 提供的许多相同功能（实际上甚至更多），但无需担心宏病毒。Thunderbird
    有插件可以让我创建与在 Outlook 中相同的的规则，还能够自动从我配置在各个地点的安全摄像头发送的邮件中提取图像。通过在 Linux 中使用 `mencoder`
    等其他免费软件，我能够创建出时间延胶摄影，且大部分是通过这些免费工具自动完成的。


    '
- fmt: '

    I use `Mozilla Firefox` for web-browsing, there are a number of add-ons for Firefox
    that allow me to block script, stop annoying autoplay, protect me from malware,
    scripts, and of course advertisements. There is nothing more annoying than opening
    up a link or two and to start hearing voices, or worse, background music. These
    add-ons stop annoyances and give the user control. Of course Firefox works on
    both Microsoft and Linux, another interoperable tool available that gives users
    more options.


    (UPDATE 2020: Use Oracle''s VirtualBox and install Microsoft in a Virtual Machine!)


    I use `OpenOffice.org`''s `OpenOffice` suite of tools, as well as `LibreOffice`.
    I have also used Microsoft products under `WINE` (Wine is not an emulator, an
    open source tool that allows the native execution of Microsoft applications) in
    Linux, and have used `Codeweavers Crossover` application to run Microsoft applications
    in Linux. The possibilities are manifold, so we are not limited to one platform
    any more. In my upcoming book "**Simply Linux: using Linux in the real world**"
    I will describe how you can move the Mozilla products complete with add-ons between
    Linux computers, and even move them, albeit one way, from Linux to Microsoft,
    or to Linux. Moving them back and forth is a problem because of some of the changes
    Microsoft makes to these products in use, which unfortunately prevents true interoperability.
    But with the tools we have I can easily move between Microsoft `XP`, `Win7` or
    any version of Linux and have the ability to view web pages, edit spreadsheets,
    documents or email. I always use the Microsoft Office 97-2003 format, which is
    also what Smashwords recommends for these books.


    While relevant, security is not addressed in this book, but is of great significance
    and Linux is clearly far more secure, but that may need to be addressed in another
    book to remove the confusion of the `FUD factor`. `FUD – fear, uncertainty and
    doubt`, a marketing tool used by those with a product that really doesn’t have
    a solid benefit. Those selling such a product will seek to casts doubt on the
    competition, or what might happen if you don’t use their product in the absence
    of a competitor, or even a real need. FUD will often attempt to use statistics
    to help make their point sound valid. They will ignore consumer protection laws,
    or basic common sense to sell you something you really don''t need. They will
    use a variety of statistical information to create the need, however one should
    remember Mark Twain’s quoting of the 19th-century British Prime Minister Benjamin
    Disraeli (1804–1881): "**There are three kinds of lies: lies, damned lies, and
    statistics.**" (*Although there is some evidence that Twain is the creator of
    that quote. – see the wiki*) The point being made to show that Microsoft marketers
    will raise the specious argument that because there are more security patches
    available for UNIX and Linux than there is for Microsoft that that makes Microsoft
    more secure. Nothing could be farther from the truth. A casual review of patches
    for UNIX and Linux will quickly reveal that they relate to a variety of components
    that most users never use, will never use and are not even active on any system.
    But these patches actually demonstrate yet another benefit to the Linux and UNIX
    operating systems, continued legacy support! The software is not routinely deprecated
    or made obsolete leaving you with a broken script or tool, it is continued to
    be kept current. If it''s a command you will often see a little message indicating
    that there is a better command available.


    So, the Microsoft FUD marketing tool has pointed out yet another benefit of UNIX
    and Linux! That means that if you wrote a script or an application on Solaris
    1 it would run today with little or no adjustment on the latest version of Solaris
    1 or Linux. The same is simply not true for Microsoft applications which are deprecated
    at almost every release and without warning in order to force the purchase of
    upgraded versions that offer few enhancements and generally only more eye candy.
    These changes also require additional training for Microsoft personnel and new
    certification exams. In UNIX and Linux if you do obtain a certification you will
    not need to go back for additional certification when updates are made, it is
    expected that you are capable of reading the `"man"` pages and other documentation.
    This represents yet another advantage, savings in training of IT staff! Power,
    performance, security, legacy support, reduced training costs... and you bought
    this book only considering two factors!


    You will also find that while there may be fewer patches produced for the Microsoft
    operating systems as the system has many functions built in to the kernel with
    fewer external sub modules, so fewer patches may be used to address far more repairs.
    And what really is of significance is the impact of those required patched vulnerabilities.
    And the secondary issue of testing those changes. The number of lines of code
    involved makes testing a patch very challenging, and often a patch may lead to
    yet more vulnerability. At some point Microsoft gives up on that kernel, deprecates
    it and starts over, leaving legacy applications abandoned and new version launched
    with much fanfare... and disappointment for long time users, and more training
    for the IT staff to learn where they moved the buttons.


    A vulnerability in UNIX or Linux will likely not have an exploit, but even with
    an exploit, and several attack vectors, there may be no damage or loss to those
    without the patch, as evidenced in the recent “Shell Shock” media blitz related
    to the `BASH` shell vulnerability in 2013, and with exploits for two known vulnerability
    paths… yet there were no news headlines about the costs or damages resulting from
    that. Part of this is because of the underlying paradigm of the UNIX and Linux
    Operating Systems [referred to as the Philosophy of Linux, shared in the next
    chapter](#tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX.ch.fixed.fc.tidied)


    Almost any vulnerability in Microsoft has exploits often before anyone realizes
    it, because the hackers figure out the problem and create an exploit, whereas
    in Open Source and Linux it is usually a volunteer programmer who discovers a
    problem and writes a patch for it, submitting it to the community. While the Microsoft
    exploit can result in costly damage and outages before the vendor of the proprietary
    code, Microsoft, is able to analyze and resolve the problem, again, often creating
    new vulnerabilities to be discovered. Attacks like `MSBlaster`, `Love Bug` and
    too many others have cost users millions of dollars in lost time and service.
    Yet the FUD ads work because people don’t examine or understand the details. However,
    this book is about performance and power, and security is a squirrel to chase
    another day.


    The following image shows Mac the cat running, but neither chasing or being chased:


    ![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_63f74807.jpg)


    The author’s intent in this book is to demonstrate quantitatively and with statistically
    valid and repeatable data and methods that the Linux operating system should be
    considered as a better performing and more efficient option to the Microsoft operating
    systems. Combine that with Microsoft’s latest releases having been met with less
    than a positive response and Linux begins to look much more attractive. As a professional
    computer geek, people come to me for computer help, at work, at home, via email,
    via phone calls or when spotted in the neighborhood. It’s not uncommon to be handed
    a shiny new `Windows 8` computer and ask to have it loaded with `XP` or `Win7`
    or `Linux`. Very often I''ll be handed a dying or deceased computer as the last
    hope of recovering files that exist only that computer. The computer quit working
    with Microsoft because of a failing hard drive, virus or system corruption.

    '
