    In the Intel Centrino CPU group, a statistically significant difference existed;
    *t*(22) = 2.77, *p* = 0.0110, Centrino SuSE mean (*![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_6d8649ec.gif)*
    = 226.33 and σ = 42.82) were significantly higher than Centrino Windows XP mean
    (*![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_6d8649ec.gif)* = 179.33
    and σ = 40.38). The overall expected power savings of Linux over Windows using
    a Centrino CPU was 21.14%, (σ = 6.58).


    Levene''s test for equality of variances for the Centrino CPU group was not significant
    (p > .05). The calculated average power savings of Linux for all Centrino CPU
    laptop computers was 21.24%. These data are shown in Table 3.


