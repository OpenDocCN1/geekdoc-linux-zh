    This book is limited to the analysis of only two of the factors that differ in
    the Microsoft and Linux operating systems. There are other factors that could
    be analyzed that would further show the differences of the two operating systems.
    Security would be a book by itself, leaning heavily in favor of the Linux version;
    while an analysis of convenience would likely lean heavily in favor of the Microsoft
    version. If the MacOS were also considered one might find a combination of the
    best and the worst from the other two operating systems. MacOS was tested on the
    Dell hardware, but it was an older version hacked to run on the Dell Latitude
    series and is not an accurate representative of current Mac models. However, after
    using MacOS as a server and as a workstation it is a reasonable representation
    of its overall performance, which is miserable in comparison to a Linux system,
    but possibly better than Microsoft. There really is no way of accurately comparing
    the current version of MacOS on the hardware used for the two tests that are part
    of this book.


    In order to demonstrate the differences clearly it was determined that using the
    same laptop was the only accurate way of conducting this test. The same laptop
    had the different versions of the operating systems loaded and then run the same
    test, as noted in [Chapter Two](#tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX.ch.fixed.fc.tidied.stylehacked.xfixed_split_004.html_C2).
    The test was written in a batch file originally, and then translated to a shell
    script to do this comparison. Both the batch file and the shell script run the
    test three times and records the times of each of those three tests. In order
    to ensure statistically valid data I then ran the tests at least two times for
    each operating system. That provided six data samples of performance. If I noticed
    a variation in the test results I looked at the system to make sure that an application
    hadn’t started during the test, or if something else interfered. In some cases
    I ran the three run test three times to provide over 9 samples. These tests were
    not intended to provide absolute values, nor face the scrutiny of a graduate committee,
    but were simply designed to show any differences between operating systems on
    a specific piece of hardware.


    The devices were not on the network during the tests. No screen saver was activated;
    no power savings features turned on and the system should have been in an idle
    state prior to the tests. On a couple of Microsoft tests it was determined that
    the anti-virus software was interfering with the tests and was turned off and
    the tests conducted again, vastly improving the performance time for the Microsoft
    versions. The poor test performances were excluded from the results. In one set
    of tests on a dual-booted drive the particular hard drive performed poorly with
    both operating systems, it too was excluded from the test results. That means
    more tests than are reported were conducted, and repeated, to ensure reliable
    results. The Linux systems were not running anti-virus or a firewall, were also
    off the network and no other applications were running. If I did use the system
    for something during a test there were slight variations in the results, but if
    they were significant, I''d run more tests without activity to ensure reliable
    samples.


    The second set of tests related to power consumption was to test across a wide
    variety of hardware using XP and SuSE Linux on that hardware using the same disk
    drive and battery. This was done with dual-booting to ensure that the hardware
    was the same and were no differences between drives. Those results are fully described
    in [Chapter Three](#tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX.ch.fixed.fc.tidied.stylehacked.xfixed_split_005.html_C3)
    of this book.


    # Chapter Two: Performance Tests


    In this chapter the issue is how well an Operating System performs a repeated
    test and how long it takes. The test was first developed to test differences between
    Windows XP and Windows 7. It was then used to test Windows 8 and recently Windows
    10. In the picture below there''s a cat running across a field high speed![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m209dc91.jpg).
    The tests used to compare Microsoft versions raised the question about how well
    Linux would perform on the same hardware with the same test. I converted the Windows
    Batch file to a `BASH` shell script, anyone familiar with `UNIX` scripting will
    offer suggestions on improvements, but then the test’t be the same. Microsoft
    Batch files are quite limited in what one can do with them, and in order for performance
    test the batch file was replicated by line, substituting `DOS` commands for comparable
    `Linux` commands. That’s my story and I’m sticking with it, although I am somewhat
    embarrassed by the crudeness of the script, but as I tell students, Simple Always
    Works (`SAW`).


    The following is a Batch file created to exercise Windows on a `Dell D630 laptop`:
    Microsoft Batch file to test OS performance copyright © john meister-LinuxMeister.net
    2014![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m26a12b8c.gif).


    ```

    REM LOAD TEST - for operating systems - batch file

    REM meister - Oct 2012 -updated Oct 2012 -updated Dec 2014

    REM requires a 10MB and 100MB file for testing. 10MBTEST and 100MBTEST

    ######################################

    cls

    set logfile=%COMPUTERNAME%_loadresults.txt

    ECHO %logfile% > %logfile%

    set fulltime=%TIME%

    start taskmgr.exe

    ECHO . >> %logfile%

    ECHO ========================START=== >> %logfile%

    ECHO LinuxMeister.net - LOAD-TEST for Microsoft OS >> %logfile%

    ECHO ================================================ %logfile%

    ECHO test conducted: %DATE% - %fulltime% >> %logfile%

    ECHO The Microsoft version listed below was run on the following system: >> %logfile%

    ver >> %logfile%

    hostname >> %logfile%

    ECHO =================================== >> %logfile%

    ECHO total time: subtract start from stop >> %logfile%

    ECHO ==================================== >> %logfile%

    set startrealtime=%TIME:~3,5

    TYPE C:\TEST\10MBTEST > C:\TEST\BIG

    TYPE C:\TEST\10MBTEST >> C:\TEST\BIG

    TYPE C:\TEST\100MBTEST >> C:\TEST\BIG

    TYPE C:\TEST\100MBTEST >> C:\TEST\BIG

    TYPE C:\TEST\100MBTEST >> C:\TEST\BIG

    TYPE C:\TEST\100MBTEST >> C:\TEST\BIG

    move C:\TEST\BIG C:\TEMP\

    TYPE C:\TEMP\BIG > C:\TEMP\BIGGER

    TYPE C:\TEMP\BIG >> C:\TEMP\BIGGER

    TYPE C:\TEMP\BIG >> C:\TEMP\BIGGER

    TYPE C:\TEMP\BIG >> C:\TEMP\BIGGER

    move C:\TEMP\BIG C:\TEST\

    move C:\TEMP\BIGGER C:\TEST\

    del C:\TEST\BIG

    del C:\TEST\BIGGER

    TYPE C:\TEST\10MBTEST > C:\TEST\BIG

    TYPE C:\TEST\10MBTEST >> C:\TEST\BIG

    TYPE C:\TEST\100MBTEST >> C:\TEST\BIG

    TYPE C:\TEST\100MBTEST >> C:\TEST\BIG

    TYPE C:\TEST\100MBTEST >> C:\TEST\BIG

    TYPE C:\TEST\100MBTEST >> C:\TEST\BIG

    move C:\TEST\BIG C:\TEMP\

    TYPE C:\TEMP\BIG > C:\TEMP\BIGGER

    TYPE C:\TEMP\BIG >> C:\TEMP\BIGGER

    TYPE C:\TEMP\BIG >> C:\TEMP\BIGGER

    TYPE C:\TEMP\BIG >> C:\TEMP\BIGGER

    move C:\TEMP\BIG C:\TEST\

    move C:\TEMP\BIGGER C:\TEST\

    del C:\TEST\BIG

    del C:\TEST\BIGGER

    set realstoptime=%TIME:~3,5

    ECHO ============================================== >> %logfile%

    ECHO FIRST STOP TIME: %realstoptime% >> %logfile%

    ECHO FIRST Start TIME: %startrealtime% >> %logfile%

    ECHO ============================================== >> %logfile%

    set startrealtime=%TIME:~3,5

    TYPE C:\TEST\10MBTEST > C:\TEST\BIG

    TYPE C:\TEST\10MBTEST >> C:\TEST\BIG

    TYPE C:\TEST\100MBTEST >> C:\TEST\BIG

    TYPE C:\TEST\100MBTEST >> C:\TEST\BIG

    TYPE C:\TEST\100MBTEST >> C:\TEST\BIG

    TYPE C:\TEST\100MBTEST >> C:\TEST\BIG

    move C:\TEST\BIG C:\TEMP\

    TYPE C:\TEMP\BIG > C:\TEMP\BIGGER

    TYPE C:\TEMP\BIG >> C:\TEMP\BIGGER

    ```

