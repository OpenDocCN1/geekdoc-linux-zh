    a significant difference in battery life between Microsoft Windows XP and SuSE
    Linux across all of the tested laptop computers.** Eighty-eight tests on eleven
    laptop computers from four different CPU categories were tested. There was a significant
    difference in power consumption between Microsoft Windows XP and SuSE Linux.


    The first CPU group was the Intel Pentium 4. Laptop computers tested in this group
