    # CHAPTER I: INTRODUCTION


    ## Background of the Problem

    The computing industry is facing a power crisis. Andy Karsner, a senior U.S. Energy
    Department official has taken note of the increasing consumption of energy by
    today''s computing equipment (Shankland, 2006).


    The focus of the industry has been on the hardware, and optimizing chips, display
    technology, and other hardware. Intel and IBM are working to reduce leakage current
    in the silicon oxide by using metal in the gates and by shrinking parts of the
    chip to 45 nanometers from the current 65-nanometers to further reduce energy
    loss as the technology shrinks to the atomic scale (Robertson, 2007). With hardware
    technology reaching the limits of physics and materiel science, another option
    that has not been considered: the efficiency of computer software. The primary
    software on any computer system is its operating system (OS). "An operating system
    is a program that manages the computer hardware" (Silberschatz, Galvin, & Gagne,
    2002, p. 3).


    There are two major operating systems that run on laptop computers using Intel
    architecture based CPUs: Microsoft Windows and Linux. Microsoft Windows XP (Microsoft,
    n.d.) is the most widely used version at the time of this research. "Linux is
    a free Unix-type operating system originally created by Linus Torvalds with the
    assistance of developers around the world. Developed under the GNU General Public
    License, the source code for Linux is freely available to everyone" (linux.org,
    n.d.).


    The researcher observed a difference in battery life between Microsoft Windows
    XP and SuSE Linux on the same dual-booted HP Evo N-600C laptop during a round-trip
    flight between Seattle, Washington and Tokyo, Japan. When the laptop was operating
    in Windows XP the researcher realized three hours of battery life. The researcher
    realized five hours of battery life while operating in SuSE Linux. If these differences
    were repeatable and found on other laptop computers, then the potential for power
    savings might benefit others by allowing extended use of their laptop computers
    as they go from meeting to meeting, and also to reduce overall energy costs for
    the corporation and help the environment. When a computer uses power it creates
    heat, that heat is often removed by air conditioning in an office environment.
    If overall computing power consumption could be reduced by using a more efficient
    operating system then there will also be a reduction in energy required to cool
    the office.


    ### The independent variable that was considered in this research is the OS, Microsoft
    Windows XP or SuSE Linux. The dependent variable is battery life.


    ## History

    Microsoft Windows XP was released on October 25, 2001. SuSE Linux was released
    in 1992; it was the first commercial Linux. It has remained one of the most popular
    and stable distributions. Oracle has supported SuSE and other versions of Linux
    since 1998 ("Oracle", 2007). There are hundreds of Linux distributions available
    today, all of them using the same underlying kernel and are compatible with each
    other. According to Distrowatch.com (n.d.), SuSE Linux is in the top ten distributions.
    Linux is a UNIX-like operating system developed by Linus Torvalds in 1991. Gumbel
    (2006 par. 1, 2.) describes Torvalds and Linux:


    Linus Torvalds was just 21 when he changed the world. Working out of his family''s
    apartment in Helsinki in 1991, he wrote the kernel of a new computer operating
    system called Linux that he posted for free on the Internet — and invited anyone
    interested to help improve it.


    Today, 15 years later, Linux powers everything from supercomputers to mobile phones
    around the world, and Torvalds has achieved fame as the godfather of the open-source
    movement, in which software code is shared and developed in a collaborative effort
    rather than being kept locked up by a single owner.


    The independent variables evaluated in this study are Microsoft Windows XP and
    SuSE Linux. The dependent variable under study is battery life. The measurement
    of battery life in minutes would allow the calculation of total power consumption
    by using the laptop battery rated value.


    ## Operating Systems Functions

    An operating system is the software required to operate a computer. It is the
    underlying program upon which applications will run. The efficiency of the operating
    system will affect power consumption and battery life. "Efficiency and functionality
    are key to an operating system''s usefulness. The efficiency sets the stage for
    the performance of all software on a computer" (Nutt, 2003, p. 1).


    ## Researchers Work Role and Setting

    The researcher is the lab manager for a 787 software development and integration
    lab at Boeing, supporting over fifty Windows XP, Windows 2000, Windows 2003 Server,
    Linux and Windows Vista systems. He has experience as an electronics technician,
    circuit designer, and technical supervisor in telecommunications and data centers.
    He has worked as a Systems and Programmer Analyst, and has experience as a Windows,
    Linux and UNIX Systems Administrator. He has worked at Intel, ITT, Intermec, Merck,
    Boeing and the US Army. He has been a technical instructor teaching electronics,
    business management and computer science since 1979. He travels nationwide to
    provide Linux and UNIX training through Clearview Consulting of Snohomish, WA.
    He is adjunct faculty at City University of Seattle in Bellevue, WA, teaching
    Operating Systems and other CS courses. He graduated in 1981 from the University
    of Maryland with a Bachelor of Science degree.


    ## Statement of the Problem

    Battery life, i.e., power consumption, has become a major issue for laptop users
    and corporations faced with escalating energy costs and availability. Workers
    are increasingly mobile, moving from conference room to conference room, and attending
    virtual meetings from all over the world. Battery life is an ongoing issue for
    users who require access to chargers after a few hours of use. The laptop is no
    longer just for the dedicated road warrior, but a common tool for office workers
    in cubicles. Many corporations have replaced desktop systems with laptop computers.
    Roseberry (2006) states that business class desktop replacements have been designed
    more for business users than home users. This provides access flexibility and
    the ability to work "virtually." Kanellos (2005) predicts an eight-hour notebook
    is moving closer to reality, with four hours the current standard, "although that
    allotment remains elusive in real life".


    ## Assumptions

    This study did not consider actual energy costs, as that varies by location. This
    study did not seek to analyze actual power consumption by models. This study was
    intended to determine the difference in the efficiency of the operating systems
    by determining battery life measured in minutes of each OS. Systems were not optimized
    for the tests to eliminate other variables. The assumption for the tests were
    that the vendors had optimized these operating systems for the most stable, efficient
    and useful configuration; therefore, default installations and options were selected
    during installation.


    ## Limitations

