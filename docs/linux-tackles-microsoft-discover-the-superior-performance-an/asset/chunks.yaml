    下面的图片显示了猫 Mac 在雪地中跑步后突然停下：


    ![](img/tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m74315eb5.jpg)


    在下方针对 `Win10` 第一次运行的电子表中，你需要在 `RED MINUTES` 行的 `B8` 单元格输入第一个停止时间的分钟数，即“25”，在 `RED
    SECONDS` 行的 `B9` 单元格输入秒数，“39”。


    第一个开始时间，`GREEN minutes` 行的 `B10` 单元格为“20”分钟，`GREEN start seconds` 行的 `B11` 单元格为“01”秒。对第二次和第三次重复此过程。


    电子表格将使用公式 `=B9/60` 计算浅灰色行停止秒的小数时间，并使用公式 `==B11/60` 计算浅灰色行开始秒的小数时间。这些值被加到 `MINUTES`
    值中，以产生小数形式的 `STOP` 和 `START` 时间。公式 `Cell B14=B8+B12`，或者在下面的示例中，为 `25 + 0.65` 或
    `25.65` 分钟的停止时间；开始时间 `Cell B15=B10+B13`，或者如下所示，为 `20 + 0.02` 或 `20.02` 分钟。


    要获取脚本第一次运行的总时间，`Cell B16=B14-B15` 中的公式减去 `25.65 – 20.02 = 5.63` 分钟。该值与来自 `B26`
    和 `B36` 的值在单元格 `B6` 中共同平均，提供三次负载测试的 5.69 分钟平均值。公式 `B6=AVERAGE(B16,B26,B36)`。


    毫无疑问，可能有更优雅的方法来这样做。但在工程、软件开发、实验室测试和脚本的世界里，快速粗糙、笨拙且笨拙的工作同样有效。最终结果是特定硬件上操作系统之间的相对性能差异。花费
    10 分钟还是 10 小时并不重要，我们试图学习的是一个操作系统与另一个之间的差异（delta）。


    在 Dell D630 笔记本上进行的测试中，SuSE Linux 13.2 于 0.56 分钟 Microsoft Windows 10 版本 6.4 生成
    9841，六次完整负载测试循环平均为 5.6858 分钟。（总分见计算表格下方）。


    `Windows 10` 版本未启用防病毒或任何安全功能，它没有连接网络，也没有安装任何应用程序。它是从 MSDN 新下载到系统的，脚本以及 `10MB`
    和 `100MB` 文件通过优存盘加载。根据对 `DLLs` 和 `EXEs` 的分析，此版本似乎是 32 位版本，这可能解释了与其他微软版本的性能差异，但即使这样也说通，因为测试的
    `XP` 版本也是 32 位。


    下面的图片显示了用于计算批处理文件和脚本输出的电子表格截图，又是一个用于查找结果的简单原始工具：


    ![](img/tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_mdf3531f.png)


    后续图片显示了正确单元格中的 Excel 电子表格公式，在 Office 2003 中，可以通过 `Tools`（工具）、`Options`（选项）并在 `View`（视图）中勾选
    `Formulas:`（公式）来显示公式：


    ![](img/tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m24a06c29.png)


    后续图片显示了两只猫转身一起走走：


    ![](img/tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_57dc6653.jpg)


    最终得分是：


    ### 按负载测试速度（分钟）划分的 OS 评分


    SuSE 13.2_________________0.56 分钟

    Mint 17___________________0.59 分钟

    Centos (RH) 7.0___________0.61 分钟

    SuSE 13.1_________________1.04 分钟

    Win7 - default____________1.24 分钟

    Win8 - default____________1.48 分钟

    Mac OSX (Latitude OSx)____1.74 分钟

    Win7 - corporate__________2.13 分钟

    XP sp3 - corporate________2.73 分钟

    XP sp2 - default__________2.99 分钟

    Win8 - corporate__________4.91 分钟

    Win10 - default___________5.66 分钟


    下面的图片显示了结果表格的截图：


    ![](img/tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_7a828b60.png)


    结果表格显示，在特定硬件上，未启用防病毒等安全功能的情况下，Linux 效率更高。这些测试是在不同硬件上运行的，结果显示 Linux 优于微软。在现实世界中，必须在微软系统上运行防病毒和防火墙等安全措施，因此这些测试结果实际上显示微软在现实世界中表现更好。尽管在分析后期才注意到这种差异，这说明这些测试需要仔细计划，以识别并消除变量。在这种情况下，我不会回去更改这些数据，尽管我可能会安装各种防病毒软件后对
    Win7 默认版本进行测试。这有助于指出 Symantec、McAfee 和 Microsoft Essentials 之间的性能影响。但那是另一个松鼠，我不会去追它。


    下面的图片显示了一只坐在 Tonka 玩具上的猫，看起来非常自得：


    ![](img/tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m278317.jpg)


    我感到有趣的是，SuSE 13.2（最新版本）比微软的版本快了 10 倍。公平地说，Windows 10 是一个测试版且是 32 位。但 SuSE 仍然比
    Windows 8.1 企业版快两倍，后者在测试中关闭防病毒软件时慢了近九倍。问题在于，在现实世界中人们必须运行防病毒、防火墙和其他安全措施，因此这些测试应该在开启这些功能的情况下进行。


    还有其他 Linux 版本可用，最流行的列在 distrowatch.com 上，截至 2014 年 12 月，排名前七的 Linux 版本是 Mint、Ubuntu、Debian、openSUSE、Fedora
    和 CentOS（所示）。这看起来是七个不同的版本，但实际上只有三个。Mint、Ubuntu 和 Debian 彼此密切相关，并使用许多相同的工具。Debian
    是这三者中的原始，Ubuntu 是基于 Debian 的流行更新版本，而 Mint 是为了提供一个利用了 Ubuntu 特性的改进版 Debian。这三者都使用相同的
    `apt-get` 更新工具和仓库。

