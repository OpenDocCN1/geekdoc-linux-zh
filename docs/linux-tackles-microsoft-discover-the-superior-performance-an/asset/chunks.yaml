  trans: '

    建议在 Linux 中配合互操作工具使用，例如 `OpenOffice`、`Mozilla Thunderbird` 和 `Mozilla Firefox`。使用双启动笔记本电脑允许用户在
    `WINE`、`Code Weavers Cross Over`、`VMware` 或 `Citrix` 无法工作或不可用时切换到 `Microsoft Windows`，并在必须使用
    `Microsoft Windows` 专用程序。大型专用程序可以在 `Citrix` 上运行，使用户能够体验 Linux 的节电效果和延长续航时间，同时通过减少许可应用程序的数量来降低整体软件许可成本。


    研究人员建议对使用应用程序时的节能进行研究。`SuSE` 和 `Microsoft Windows` 均使用 `OpenOffice` 程序。使用 `OpenOffice`
    为工作人员提供必要的工具以提高效率，同时保持与 `Microsoft Office` 软件套的互操作性。测试将针对企业环境中使用的特定环境进行定制。将在两个操作系统上监控并测试文件创建、打开、保存和编辑时间的比较，并与
    `Windows` 上的 `Microsoft Office` 进行比较，以查看在功耗和性能方面是否存在可衡量的差异。还将进行额外的测试以确保两个应用程序之间的完全互操作性，以确定在任何一个中创建的文件是否可以在两个应用程序之间打开、编辑和保存而不会发生文件损坏或数据丢失。


    除了 Linux 的节能和延长续航时间外，还应该评估总运营和拥有成本，例如操作系统的获取成本、安装时间、配置操作系统进行有效工作所需的时间、所有所需应用程序的安装时间、处理恶意软件、蠕虫、病毒、`Trojan
    horses` 以及其他破坏性软件并将其恢复正常运行的时间（这些问题目前困扰着 `Microsoft Windows` 操作系统）。


    除了电力成本外，还应监控操作系统的性能。使用 Linux 可能会带来性能收益，因为在这些电池寿命测试中展示的效率也表明用户与应用程序及系统的交互更加敏捷。可以使用已知文件大小的文档或电子表格进行特定测试并计时。文件需要具有足够的大小，以便任何差异都变得明显且可测量。


    研究人员还建议对 `Microsoft Windows Vista` 最新版本与 `SuSE Linux` 之间的差异进行进一步测试，查看使用 `SuSE
    Linux` 是否可以进一步节电，因为考虑到 `Vista` 相比 `XP` 使用了额外的代码行和 `DLLs`，这很可能是事实。


    研究人员对本研究测试中所使用的 `IBM R50p` 进行了两次 `Vista Enterprise Edition` 测试。`Vista` 在一次测试中持续了
    113 分钟，另一次测试持续了 128 分钟。在同一 `IBM R50p` 上 Linux 的平均时间为 `266.2` 分钟，`σ = 14.906`。在
    `IBM R50p` 上对 `Microsoft Vista` 的两次测试表明 `SuSE Linux` 比 `Microsoft Vista` 平均节省了
    57%，而相比 `Microsoft Windows XP` 仅实现了 19% 的节省。`IBM R50p` 上的功耗估计 `SuSE Linux` 为 `16.07`
    瓦，`Microsoft Windows XP` 为 `19.82` 瓦，`Windows Vista Enterprise` 为 `35.49` 瓦（见图
    6，附录 D）。考虑到 `Microsoft` 提出的节能说辞，`Windows Vista` 这种惊且显著的功耗增加令人不安。`SuSE Linux` 比
    `Microsoft Vista` 节省的 57% 超过了使用 `Microsoft XP` 测试的任何系统，并引发了一个问题：在那些比 `Windows
    XP` 显示出更多节能效果的系统上，还可以实现多少额外的节省。这应该是扩展的研究领域。


    许多商业和开源应用程序在 `Microsoft Windows` 和 Linux 上运行方式相同。其中一些应用程序是网络浏览器，如 `Mozilla Firefox`
    和 `Opera`；电子邮件客户端，如 `Mozilla Thunderbird`；当然还有 `OpenOffice` 办公套件（它提供与 `Microsoft
    Office` 类似的免费工具），以及 `StarOffice`（它是比免费的 `OpenOffice` 新一个版本，并通过 `Sun Microsystems`
    购买支持）。某些特定的可用产品允许在 Linux 中直接使用 `Microsoft` 应用程序。`CodeWeavers` 的 "CrossOver" 就是此类产品之一。(CodeWeavers,
    2007)。`Xandros` Linux 发行版包含了 `CodeWeavers` 应用程序 `CrossOver`。(Xandros, 2007)。这些应用程序许多基于
    `Wine` 构建或使用 `Wine`。


    `Wine` 是一个翻译层（程序加载器），能够在 Linux 和其他 `POSIX` 兼容操作系统上运行 Windows 应用程序。在 `Wine` 中运行的
    Windows 程序就像原生程序一样运行，没有模拟器的性能损失或内存使用开销，并且与桌面上的其他应用程序具有相似的外观和感受。


    `Wine` 项目始于 1993 年，作为支持在 Linux 上运行 `Windows 3.1` 程序的方法。Bob Amstadt 是最初的协调员，但他很早就将其交给了
    Alexandre Julliard，从那以后一直由运行。多年来，增加了针对其他 Unix 系统的端口，随着 `Win32` 应用程序的流行，增加了对 `Win32`
    的支持。（`winehq`, n.d.）。


    更新 2020：使用 Oracle 的 `VirtualBox` - 虚拟机安装微软软件！


    有专门网站提供有用的“交叉”信息，其中一个网站是 `groklaw.net` 提供的 `http://www.grokdoc.net/index.php/Application_Crossover_Chart`。`grokdoc.net`
    页面引用道：“Linux 有三种基础办公软件包：针对 `KDE` 的 `KOffice`，针对 `GNOME` 的 `GNOME Office` 或针对 `GNOME`
    的 `OpenOffice` (`OpenOffice.org`, 2007)”。


    研究人员建议进一步研究互操作性和节能问题。另一个研究领域是在 Linux 笔记本电脑上使用 `Citrix` 客户端。这将允许用户在 `Microsoft`
    环境中运行时减少笔记本电脑的功耗。多个用户使用一个服务器将减少多个笔记本的功耗，而对该服务器的功耗增加微乎其微。这将从其他方面受益，例如减少笔记本上的软件支持，因为所有更新都在
    `Citrix` 服务器上进行。笔记本的节能可能无法抵消 `Citrix` 服务器的许可成本，应进行进一步分析。


    观察到的操作系统电池寿命表明程序效率存在差异。应考虑改进应用程序和操作系统代码作为减少功耗的方法。本研究定量地显示了 `SuSE Linux` 相比 `Microsoft
    Windows XP` 的节能。研究人员建议进一步分析在企业环境中使用 Linux 以减少功耗和不必要的热量的同时提高计算效率。


    REFERENCES


    *Application Crossover Chart* (2007, 2 月 2 日) *.* Retrieved 2007 年 3 月 20 日, from
    http://www.grokdoc.net/index.php/Application_Crossover_Chart


