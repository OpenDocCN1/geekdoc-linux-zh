    Using Linux one can rescue many dying drives and saved childhood photos, documents,
    spreadsheets and other important and irreplaceable files. That’s another benefit
    of Linux that would be very hard to quantify, the ability of Linux to read a hard
    drive that Microsoft can not mount or read. If a Microsoft system can’t read a
    drive it’s important to shut that system down immediately and get that drive out
    and onto a USB device to be connected to a Linux system for rescue. If the drive
    is failing mechanically it may help to put the drive in the freezer before attempting
    a rescue.


    But that’s a subject for the next book, “Simply Linux: using Linux in the real
    world” where I go through the steps of mounting drives and using commands like
    `dd` to copy the entire disk block by block, commands unavailable on Microsoft
    operating systems but come with even the slimmest of Linux installs, including
    Live CDs and tools like `Gparted`, a Debian based utility for partitioning and
    managing disks, but also runs on Debian Linux, allowing someone to try Linux without
    installing it. A screen shot of the Debian based `Gparted` is shown below, you
    can see the graphic tool used to define partitions, as well as a terminal window
    opened, with the colors changed. The commands displayed show: `sudo su -` in order
    to gain root access on the "live session". From there you can type `fdisk -l`
    and determine which drive is the one that has issues. You''d create an imaginary
    mount, `/a` by typing `mkdir /a ; mount /dev/sdxx /a` where `sdxx` would be the
    particular partition. Once you have the system mounted you could change to that
    directory and examine files and copy them to the local driver or another externally
    mounted drive.


    The following image shows a screen shot of `Gparted`, a live CD version of Debian
    Linux that would allow you to test your hardware with the tools described in the
    performance test, but only as a test of Debian Linux, and would also allow you
    to rescue files from a failing drive or resize partitions:


    ![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m1aedde4f.jpg)


    Concerning Microsoft’s latest (Win8), I’ve found everyone from teens to folks
    well into their nineties asking me to load XP or Windows 7 on their new systems.
    ([An upcoming book I''m working on will provide recommendations for Microsoft
    systems.](#tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX.ch.fixed.fc.tidied.stylehacked.xfixed_split_018.html_Otherbooks)).
    A few have tried Linux, and now have dual-booted systems. As a result of the dismal
    response to Win8, I''ve found an increasing number of people interested in learning
    Linux, even folks who work or have worked at Microsoft. Several of my students
    over the years have worked at Microsoft and began using Linux through my classes.
    I manage a computer lab testing and developing applications for both Microsoft
    and Linux. The results of testing benefits systems architects, software developers
    and others considering or advocating new tools and applications for use. I often
    test versions of software that are not yet released or even finished. These tests
    serve to satisfy my curiosity about how things work, as I dig into these operating
    systems. I’ve also used related testing for graduate research and included the
    results of the power consumption comparison analysis in [Chapter Three.](#tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX.ch.fixed.fc.tidied.stylehacked.xfixed_split_005.html_C3)
    The material presented in this book should help clarify through metrics some of
    the benefits available by using Linux, or at least showing that there is a difference
    on some hardware, but the reality is that difference may not be significant enough
    to force a change.


    That the Open Source community has created several applications that work on Microsoft,
    Mac and Linux allows users the freedom to choose their platforms. Interoperability
    is something that should be considered and encouraged to help reduce costs and
    allow a user to use the tool that best fits their particular tastes and interests.
    In [“Simply Linux: using Linux in the real world”](#tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX.ch.fixed.fc.tidied.stylehacked.xfixed_split_018.html_Otherbooks)
    I will address interoperability. But for now, let’s examine the two variables
    for this book.


    ## Chapter One: Operating Systems comparisons


    Having worked with computer systems since the 1970’s I’ve experienced a wide variety
    of performance, power consumption and other features among operating systems.
    This book will focus on two of the differences between Microsoft and Linux. These
    differences are [performance (Chapter 2)](#tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX.ch.fixed.fc.tidied.stylehacked.xfixed_split_004.html_C2)
    and [power consumption (Chapter 3)](#tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX.ch.fixed.fc.tidied.stylehacked.xfixed_split_005.html_C3).
    In order to establish what those differences are I created tests to determine
    relative performance and power consumption. I carefully isolated variables to
    provide fair, repeatable tests. Each variable is analyzed in a separate chapter.
    The first variable is performance.


    The picture below shows Mac and analyzing they found:


    ![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_e68ead)


    Operating Systems released by Microsoft have a variety of marketing names, before
    and after release. To determine the version of Microsoft you are using open a
    "command" window, run `cmd.exe` and then type `ver`. Of course if you notice in
    the screen below that the version will appear at the top of the window. In Linux
    we often qualify statements like that with YMMV, meaning that if I publish the
    next release of Microsoft may deprecate that function and you''ll think I was
    making this up. So, remember, when testing these functions and features, YMMV.


    The following image shows the "run" window from Windows XP with `cmd.exe` typed
    in the input box:


    ![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m6a1b7157.png)


    The following image shows the default `cmd.exe` window in XP. The color of this
    window has a black background with gray letters. But as in Linux, one can change
    this to a light background with dark letters, so there''s no need to be "dark
    screen" type. The image shows the path to the command, the version of the software,
    in this case 5.1.2600, or Windows XP, this is SP3. In the window I typed `ver`
    and the result is displayed.


    ![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m756490aa.png)


    The image below provides a listing of versions and the market names of Microsoft
    releases:


    ![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m5998de14.png).


    Windows 8.1 is NT version 6.3, and Windows 10 is 6.4\. When you examine the output
    of the `version` command it provides three pieces of information. The first is
    the **major kernel** release, in the case of recent releases, version 6\. This
    includes Windows Vista through Windows 10\. The second value is the **minor release**,
    with Win7 being 6.1, Win8 as 6.2, and Win8.1 as 6.3. The third value is the **build
    number**. The early release of Windows 10 is showing up as 6.4.9841.

