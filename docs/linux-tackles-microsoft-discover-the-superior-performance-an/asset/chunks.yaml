    在所有收集的数据，存在统计学显著差异；`t`(86) = -3.27, `p` = 0.0015，SuSE Linux 均值（![](img/tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_6d8649ec.gif)`
    = 216.39 和 `σ` = 89.77）显著高于 Windows XP 均值（![](img/tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_6d8649ec.gif)`
    = 159.66 和 `σ` = 71.78）。所有测试过的笔记本电脑中 SuSE Linux 相比 Windows XP 的总体节电量为（![](img/tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_6d8649ec.gif)`
    = 26.88% 和 `σ` = 9.54）。


    # 第五章：讨论


    由于 `p` < 0.5，拒绝原假设；在所有笔记本电脑型号电池续航数据计算得出 `t`(86) = -3.27, `p` = 0.0015。**在所有测试过的笔记本电脑中，微软
    Windows XP 和 SuSE Linux 之间的电池续航时间存在显著差异。** 对来自四种不同 CPU 类的 11 台笔记本电脑进行了 88 次测试。微软
    Windows XP 和 SuSE Linux 之间的功耗存在显著差异。


    第一个 CPU 组是 Intel Pentium 4。在该组中测试的笔记本电脑包括富士通 Lifebook C-2240、东星 Satellite S20-A207
    和 IBM A31p。**第三个 CPU 组 SuSE Linux 的平均节电量为 35.93%，其中东星 Satellite 最低为 26.83%，富士通
    Lifebook 最高为 38.66%。**


    第二个 CPU 组是 Intel Pentium M。在该组中测试的笔记本电脑是两台不同的 Dell 610。第四个 CPU 组 SuSE Linux 的平均节电量为
    20.24%，其中第一台 Dell 610 最低为 18.51%，第二台 Dell 610 最高为 21.98%。


    第三个 CPU 组是 Intel Pentium M。在该组中测试的笔记本电脑是两台不同的 Dell 610。第四个 CPU 组 SuSE Linux 的平均节电量为
    20.24%，其中第一台 Dell 610 最低为 18.51%，第二台 Dell 610 最高为 21.98。（等等，源文本重复了第三组的 Pentium
    M 描述）。根据源文本修正：第三个 CPU 组是 Intel Pentium M。在该组中测试的笔记本电脑是两台不同的 Dell 610。第四个 CPU 组
    SuSE Linux 的平均节电量为 20.24%，其中第一台 Dell 610 最低为 18.51%，第二台 Dell 610 最高为 21.98%。


    第四个 CPU 组是 Intel Pentium III。在该组中测试的笔记本电脑包括富士通 Lifebook C-2240、东星 Satellite S20-A207
    和 IBM A31p。（源文本有不一致之处，保留它们）。第三个 CPU 组是 Intel Pentium M。在该组中测试的笔记本电脑是两台不同的 Dell
    610。第四个 CPU 组 SuSE Linux 的平均节电量为 20.24%，其中第一台 Dell 610 最低为 18.51%，第二台 Dell 610
