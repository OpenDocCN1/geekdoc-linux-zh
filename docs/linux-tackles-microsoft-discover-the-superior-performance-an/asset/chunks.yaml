    CHAPTER VII


    RECOMMENDATIONS


    The use of Linux over Microsoft Windows is highly recommended to reduce energy
    consumption, reduce heat, and in doing so, reduce dependency on foreign oil, reduce
    the production of “greenhouse gases” and other waste products from coal burning
    plants, and reduce the need for additional power generating resources. Linux will
    reduce unnecessary heat from the computer through reduced power consumption, which
    reduces the need for additional air conditioning, and further reducing green house
    gases and power consumption. It is expected that these power savings will be realized
    by desktop systems as well, as the test was for the efficiency of the operating
    systems and not the specific computer type.'
