- fmt: "\nThe population for the study was the laptop computers configured and used\
    \ for testing found in Appendix B. Multiple tests of each OS on selected laptop\
    \ computers were conducted to ensure validity of results. In addition, a wide\
    \ range of laptop computers was tested at least twice in each OS to reduce the\
    \ variability of the hardware. The battery tests are easily replicated on any\
    \ laptop that will operate with `Microsoft Windows` or `Linux`. Due to time and\
    \ resource constraints this study was limited to systems that were accessible\
    \ to the researcher and test volunteers, sufficient numbers were tested to help\
    \ ensure statistical validity. The tester noted the time, removed the battery\
    \ charger or power cord and observed the laptop until the system shut down or\
    \ turned off, then noted the time and recorded the total battery life in minutes\
    \ for the operating system that was tested. The tester reattached the power to\
    \ the system, recharged the battery, and booted into the other operating system.\
    \ Once the battery was fully charged, the tester repeated the process for the\
    \ other operating system. Each laptop computer test cycle has two data points,\
    \ one for `Microsoft Windows XP` and one for `SuSE Linux`.\n\n# The Data Collection\
    \ Device\n\nThe battery life data collected from each laptop computer were collected\
    \ and loaded into a spreadsheet. The data recorded included the laptop make and\
    \ model, the battery life for `Microsoft Windows XP` and `SuSE Linux` in minutes,\
    \ and indicated the differences in percentages between the two operating systems.\
    \ The parametric data from the spreadsheet were analyzed using a `t`-test for\
    \ independent samples to determine if a statistical significance difference existed\
    \ between the two groups.\n\n# Reliability and Validity\n\nEach laptop computer\
    \ had `Microsoft XP` and `SuSE Linux` loaded. Each operating system used the default\
    \ installation for the test. The systems were not tuned for power-savings. Hard\
    \ disks and monitors were not turned off during the tests and the laptop computers\
    \ were not permitted to enter sleep mode. The operating systems operated in their\
    \ quiescent states with no applications running and no user interaction. By conducting\
    \ the tests with no applications and no user interaction, each operating system\
    \ was tested independently and a reasonable comparison can be made. It is also\
    \ expected that, in general practice, users will not modify the system parameters\
    \ and their expected battery life will parallel that of these tests. Multiple\
    \ vendors and models were tested to eliminate the possibility that one model might\
    \ be optimized for one operating system or the other. Testing multiple models\
    \ also eliminated specific hardware features that might benefit one operating\
    \ system over the other. Variables might include memory chips, CPU types, disk\
    \ types and other equipment that were not considered part of this test. By testing\
    \ multiple laptop computers the researcher was able to gather valid and reliable\
    \ data.\n\n# Treatment of the Data and Procedures\n\nThe data gathered on battery\
    \ life were evaluated using a `t`-test for paired samples. (Cooper & Schindler,\
    \ 2006). The level of significance was `p` < .05. The null hypothesis was that\
    \ there is no statistical significant difference in battery life between `Windows\
    \ XP` and `SuSE Linux`.\n\n# CHAPTER IV: RESULTS\n\n**Eighty-eight battery life\
    \ tests were conducted on eleven different laptop computers** identified in Appendix\
    \ B. The laptop computers were categorized into four different CPU types. The\
    \ collected data, in minutes, from each battery test were organized by the independent\
    \ variable, the operating systems `Microsoft Windows XP` and `SuSE Linux`.\n\n\
    Each test was started with a fully charged battery in either `Windows XP` or `SuSE\
    \ Linux`. The tests were conducted without using applications, without user interaction\
    \ and at the same ambient temperature. Static tests in each operating system were\
    \ conducted to ensure that the researcher was not a variable in the depletion\
    \ of the battery. Default configurations were used in both operating systems on\
    \ the laptops to eliminate the variables associated with customization and optimization.\
    \ Screen savers were not used and monitors and disks were not turned off by the\
    \ system. The same ambient temperature was used to eliminate battery temperature\
    \ as a variable.\n\nThe data collected were broken into four CPU types. The first\
    \ CPU group was the `Intel Pentium 4`. Laptop computers tested in this group were\
    \ a `Fujitsu Lifebook C-2240`, a `Toshiba Satellite S20-A207` and an `IBM A31p`.\
    \ The second CPU group was the `Intel Pentium M`. Laptop computers tested in this\
