    the picture below shows Mac the cat coming to an abrupt stop after running in
    snow:


    ![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m74315eb5.jpg)


    On the spreadsheet below for the first run of `Win10`, you’d enter the first stop
    time minutes, i.e. “25” in cell `B8`, on the `RED MINUTES` row, and the seconds
    on the `RED SECONDS` row, “39” in `B9`.


    The first start time, “20” minutes in `B10`, on the `GREEN minutes` row, and “01”
    seconds in `B11`, on the `GREEN start seconds` row. Repeat the process for the
    second and third times.


    The spreadsheet will calculate the fractional time of stop seconds on the light
    gray row using the formula: `=B9/60` and the fractional times of start seconds
    on the light gray row using the formula:==B11/60`. These values are added to the
    `MINUTES` value to produce a `STOP` and `START` time in Decimal. The formula for
    `Cell B14=B8+B12`, or in the example below, `25 + 0.65`, or `25.65` minutes for
    the stop time, and start time for `Cell B15=B10+B13`, or as show below `20 + 0.02`,
    or `20.02` minutes.


    To get the total time for the first run for the script, the formula in `Cell B16=B14-B15`
    subtracts `25.65 – 20.02 = 5.63` minutes. This value, along with the values from
    `B26` and `B36` are then averaged together in cell `B6` to provide a three Load
    Test average of 5.69 minutes. The formula in `B6=AVERAGE(B16,B26,B36)`.


    There is little doubt that a more elegant way of doing this is possible. But in
    the world of engineering, software development, lab testing and scripting, quick
    and dirty, clumsy and klutzy work just as well. The net result is the relative
    performance difference between operating systems on a particular piece of hardware.
    Whether it takes 10 minutes or 10 hours doesn’t matter, it’s the delta between
    one operating system and the other that we’re attempting to learn.


    In the tests conducted on the Dell D630 laptop SuSE Linux 13.2 took 0.56 minutes
    to Microsoft Windows 10, Version 6.4, build 9841, 5.6858 minutes average for six
    full load test cycles. (The total scores are below the image of the calculation
    spreadsheet).


    There were no anti-virus or any security features enabled on the `Windows 10`
    version, it was not connected to the network and no applications were installed.
    It was a fresh download from MSDN onto the system, the script and `10MB` and `100MB`
    files were loaded via a thumbdrive. Based on the analysis of `DLLs` and `EXEs`,
    this version appears to be a 32 bit version which may account for the performance
    difference relative to other Microsoft versions, but even that doesn’t make sense
    as the `XP` versions tested were 32bit as well.


    The image below shows a screen shot of the spreadsheet used to calculate the output
    of the batch file and script, again, a simple and crude tool used to find the
    results:


    ![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_mdf3531f.png)


    The following image displays the excel spreadsheet formulas in the correct cells,
    in Office 2003 one can display the formulas by going to `Tools`, `Options` and
    in `View` check `Formulas:`


    ![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m24a06c29.png)


    The following images shows the two cats turning to walk together:


    ![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_57dc6653.jpg)


    The final score is:


    ### OS rating by speed of load test in Minutes


    SuSE 13.2_________________0.56 minutes

    Mint 17___________________0.59 minutes

    Centos (RH) 7.0___________0.61 minutes

    SuSE 13.1_________________1.04 minutes

    Win7 - default____________1.24 minutes

    Win8 - default____________1.48 minutes

    Mac OSX (Latitude OSx)____1.74 minutes

    Win7 - corporate__________2.13 minutes

    XP sp3 - corporate________2.73 minutes

    XP sp2 - default__________2.99 minutes

    Win8 - corporate__________4.91 minutes

    Win10 - default___________5.66 minutes


    The image below shows a screenshot of the results spreadsheet:


    ![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_7a828b60.png)


    The results show clearly that Linux is the more efficient operating system on
    the hardware tested. These tests have been run on different hardware and the differences
    were comparable with Linux always working more efficiently than Microsoft. Each
    one of these tests were conducted to include at least six to nine load cycle tests.
    The time presented is the average of at least two runs of three runs each. Of
    course these tests are repeatable on other hardware. The conditions are that one
    uses the same hardware for the two operating systems compared, and that the `10MB`
    and `100MB` files are the same for both tests. It is recommended that the files
    not be executable or contain any special characters as this might create an issue
    when working with them. In Linux I used commands to strip non-printable characters
    from the files and used the `vi` editor to make sure that all header and footer
    information was removed from the files so there were no possibilities that the
    system would recognize this as anything other than a large block of ones and zeroes.
    The file used created no issues on any of the operating systems tested. Others
    have used this test and created files without too much challenge.


    The picture below shows a cat with his paw on top of a Jeep Tonka, looking rather
    smug:


    ![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m2783217.jpg)


    What I find interesting is that SuSE 13.2, the latest release, is over 10 times
    faster than Microsoft’s newest release `Win10`… in all fairness Windows 10 is
    a beta release and 32 bit. But SuSE is still twice as fast as Windows 8.1, and
    the corporate version, which I may have forgotten to disable anti-virus and other
    load producing security tools off on, was also nearly nine times slower. The problem
    is in the real world one must run anti-virus, firewalls and other security measures
    on a Microsoft system, so the tests should have been conducted with those safety
    features active, therefore these test results actually show Microsoft performing
    better than they will in the real world. So, I’ve been more than fair in comparing
    these operating systems, actually, I’ve been unfair to Linux and Mac in that Microsoft
    had what may be a significant advantage. Taking notice of this discrepancy this
    late in the analysis also shows that careful planning for these tests is necessary
    in order to identify and eliminate variables. In this case I will not go back
    and change this data, although I may run the tests for Win7 default image after
    installing various anti-virus software. This will also help point out the performance
    impact between Symantec, McAfee and Microsoft Essentials. But that is yet another
    squirrel and I will resist chasing that one for this book.


    There are other Linux versions available, the most popular are listed on distrowatch.com,
    as of December 2014, the top seven Linux versions are Mint, Ubuntu, Debian, openSUSE,
    Fedora and CentOS as show in the image below. While this looks like seven different
    versions, it is really only three. Mint, Ubuntu and Debian are all closely related
    to each other and use many of the same tools. Debian is the original among the
    three, with Ubuntu being a popular updated version based on Debian, with Mint
    being created to provide an improved version of Debian that leveraged some of
    the features of Ubuntu. All three use the same `apt-get` update tool and repositories.
    My preference is MINT with the `MATE` desktop, and that version has been #1 on
    distrowatch for many years. It is the most user-friendly of the Linux distros
    and one I recommend to folks as casual users. You will not be disappointed with
    it.

