    XP / SuSE, 64.07%,


    Linux Power Savings, 35.93%, )


    In the Intel Pentium M CPU group, a statistically significant difference existed;
    *t*(14) = 4.12, *p* = 0.001, Pentium M SuSE mean (*![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_6d8649ec.gif)*
    = 180.25 and σ = 20.25) were significantly higher than Pentium M Windows XP mean
    (*![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_6d8649ec.gif)* = 143.50
    and σ = 15.06). The overall expected power savings of Linux over Windows using
    a Pentium M CPU was 20.25%, (σ = 4.42).


    Levene''s test for equality of variances for the Pentium M CPU group was not significant
    (*p* > .05). The calculated average power savings of Linux for all Pentium M CPU
    laptop computers was 20.24%. These data are shown in Table 2.


    Table 2


