- fmt: '

    Current battery technology has improved the life of many systems, but even today
    the larger notebook systems provide battery life that is not much more than an
    hour. Typical battery life while running `Microsoft Windows` is in the two to
    three hour range. This limits the mobility of workers and requires carrying a
    charger or spare battery. If the operating system could provide additional battery
    life this would not only save energy but benefit the users. In addition, the dangers
    associated with the `Lithium-Ion` batteries contained in most portable computers
    increase with additional power requirements and possible internal shorts ("PC
    Pitstop PC Safety", n.d.). Between 2004 and 2006, `Dell Computers`, along with
    other vendors, had battery recalls due to the danger of defective batteries having
    an internal short, "Under rare conditions, it is possible for these batteries
    to overheat, which could pose a risk of fire" ("Battery", Dell, 2006). `Lithium-Ion`
    is a flammable liquid, and in the event of a short, a chemical reaction occurs
    that can melt the battery or cause it to explode, Kanellos (2006) reports, while
    presenting an argument for the use of zinc-based batteries:


    Lithium ion batteries, which came out in 1990, are the surly child prodigy of
    portable electronics. These batteries can hold far more energy than conventional
    rechargeable batteries and generally weigh less than traditional rechargeables.
    Notebook makers and cell phone manufacturers have used these properties to create
    fairly light devices that can run for several hours on a single battery charge.


    Unfortunately, a short circuit inside a lithium ion battery can lead to what''s
    known in the industry as a "runaway thermal reaction." The reaction can cause
    the battery case to melt and spew hot liquids, or explode due to pressure and
    heat. Injuries have been reported around the globe.


    To make matters worse, manufacturers have continued to increase the energy density--or
    the amount of energy the battery can hold--of lithium ion batteries by thinning
    out separators (which keep the electrodes apart) and changing other components.
    These changes lead to longer run times--something consumers are demanding--but
    also raise the potential that something can go wrong.


    "The root cause is more and more energy required in a limited volume. You aggravate
    the safety issues," said Rick Cooper, vice president of business development at
    `PolyFuel`, which makes membranes for direct methanol fuel cells.


    The use of laptop computer batteries provide a finite source of power by which
    to evaluate the total power consumption and determine which OS is more efficient.
    Reducing power consumption on existing hardware will help to offset the continuing
    growth in power use. The more efficient the operating system, the longer it will
    operate on the same battery and hardware.


    ## Summary


    Both `Microsoft Windows XP` and `SuSE Linux` use similar kernel architecture and
    operate on the same hardware platform. They both have millions of lines of code.


    ### Statement of the Hypothesis


    Based on the review of literature and the experience of the researcher, the following
    hypothesis was posited for this study.


    It is hypothesized that there is no significant statistical difference (`α = .05`)
    in power consumption between `Microsoft Windows XP` and `SuSE Linux` on laptop
    computers.


    ## CHAPTER III: RESEARCH METHODS


    The researcher gathered qualitative and quantitative data to explore the research
    hypothesis. An experimental study was completed to test battery life on laptop
    computers loaded with default installations of `Microsoft Windows XP` and `SuSE
    Linux`.


    ### Research Model


    The differences in battery life between `Microsoft Windows XP` and `SuSE Linux`
    were examined in an experimental study. The test was designed to isolate the one
    dependent variable: battery life. A variety of laptop computer models were tested
    to eliminate any advantage that one model might offer one operating system over
    another. The test design required the use of the same physical hard drive for
    the comparative tests. This ensured no difference in physical I/O, system interfaces
    or physical differences in disk drives.


    To ensure that a valid comparison was made between the two operating systems,
    the laptop computers were configured to "dual-boot", this means that both operating
    systems are loaded and configured to run separately on the same computer and the
    same physical hard drive. This allowed the consistent testing of the dependent
    variable, battery life. By using the same exact hardware the independent variable
    was the only item changed during the test. Battery life is a proxy variable for
    power consumption. The use of a battery provided a finite quantity of energy.
    Both independent variables were tested with the same physical battery. The operating
    system that ran the longest on the same battery was the most efficient.


    Tests conducted on a subject laptop computer used the exact same hardware for
    each test, including but not limited to any attached keyboards, `USB` devices,
    graphical input devices, i.e., mice, or attached video displays. As long as the
    system was tested in the same physical configuration for both tests on each laptop
    computer the battery life data were considered valid. The specific battery type
    or laptop computer model was irrelevant as the test was intended to show the difference
    in overall power consumption between `Microsoft Windows XP` and `SuSE Linux`.


    The only independent variable was the operating system for each laptop computer
    under test. The test of battery life was conducted after the operating system
    was fully loaded on the system and fully operational. Having the operating system
    fully booted and functioning ensured that the battery and computer were at operating
    temperature and that only the quiescent states of the operating systems were compared.
    No applications were loaded or operated during the test cycles. The use of even
    similar applications could not ensure that the same code would be executed, resulting
    in dissimilar system activity and invalidating the test results. Therefore, the
    researcher only tested the operating systems without applications running. User
    interaction during the test was limited to observing the remaining battery life
    by viewing the power meter or battery life indicator in each operating system.


    The quantitative data were gathered from a variety of laptop models and makes
    configured with the default installations of `Microsoft Windows XP` and `SuSE
    Linux`. The operating systems were loaded on the same hardware, including the
    same hard drive, and used the same battery for each test cycle. The battery life
    times in minutes was collected for the study. The independent variable for this
    research project was the operating system. The dependent variable was the battery
    life.


    The battery life test event began when the tester had the operating system up
    and running, was logged in, had turned off all applications, turned off the screen
    saver and opened the power meter or battery indicator utility. Then the tester
    noted the time and removed the power plug from the laptop computer. When the battery
    was discharged so that the laptop computer would no longer function and turned
    off the display, the tester recorded the time. The tester recorded the total time
    of operation in minutes.


