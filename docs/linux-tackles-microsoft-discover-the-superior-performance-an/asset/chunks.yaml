    # Professional Experience


    - Equipment Engineering in R&D wafer fab supporting photolithography systems

    - Senior Electronics Instructor for several colleges and technical institutes.

    - US Army Signal School - Cryptographic Systems Repair Instructor (`32F3H`, `32G`,
    `31S`, `31T`)

    - US Army Signal Corps - Fixed Ciphony Equipment Repair - Staff Sergeant (E-6)
    (`32F3H`)

    - TV repair, electronics technician, auto mechanic, freelance photographer, technical
    instructor.


    # Education


    - MSTM - Embry Riddle Aeronautical University

    - BSc, AA - University of Maryland

    - AA - Central Texas College

    - US Army Signal School - 32F/32G/31S/31T

    - Western Seminary (MDiv CE program - no degree)

    - Cleveland Institute of Electronics (Advanced Electronics and Troubleshooting
    Certificate)

    - Cogswell College North (BSEE program - no degree)


    # Career History


    Worked for: `Intel`, `O''Reilly Media`, `Boeing Electronics`, `Boeing Computer
    Services`, `Boeing Commercial Airplanes`, `ITT Tech`, `AT&T`, `Western Wireless`,
    `T-Mobile`, `Cingular`, `Merck`, `Intermec`, `City University of Seattle`, `Georgia
    Military College`, `Everett Community College`, `Prosoft`, `Develop Intelligence`,
    `New Horizons` and other training companies nationwide.


    # Publications


    Listed in: Who''s Who in Science and Engineering; Who''s Who in America; Who''s
    Who of Emerging Leaders in America; Who''s Who Among Young American Professionals;
    Who''s Who in the West (since 1987), Who''s Who in American Education


    As an `O''Reilly Media` author, John developed and recorded the `Art of Linux
    System Administration` for use in preparation of `LPIC-2` Certification, released
    July 2016 - http://shop.oreilly.com/product/0636920050209.do


    Contact John for customized Linux training.


    # About the Pictures


    The pictures were taken by the author of his two cats `Mac` and `Jack` starting
    around 2010. The book cover shows `Jack` being tackled by `Mac` in the driveway.
    The picture seems well suited to support the title of this book. `Linux tackles
    Microsoft.` The look on `Jack`''s furry face indicates he really wasn''t expecting
    what happened, and I''m thinking most `Microsoft` users aren''t really expecting
    what is happening with both `Microsoft` and `Linux`, with `Microsoft` in decline,
    while `Linux` just keeps getting better.


    `Jack` was one to play with his food and take bizarre risks. I''d watch him fall
    out of trees when he''d just step out onto a twig. It was hard watching `Jack`
    fall out of that `River Birch` overhanging a large boulder... he did a belly flop
    right on to it, got up and sat next to my son''s `Jeep` staring off in space just
    blinking every now and then for quite some time. `Jack` would run at full speed
    off of a two-story roof when startled, landing out in the driveway on his chin.
    `Jack` would get engrossed in playing with things he caught, which likely resulted
    in his being invited to dinner, as the main course. We suspect a coyote got him
    when he was batting a snack around out in the field. Either way he has been missed
    since about 2011. We are still enjoying his brother, `Mac`. And no, `Mac` didn''t
    get his name from the computer, or a Redmond beverage, but rather from a clothing
    product line. My wife named the kittens. `Mac` is a heat-seeking fur ball, so
    I have to leave laptops only partially open and make sure there''s plenty of space
    behind computers for air flow. If we can''t find him we look in the garage on
    the hood of the `Jeeps` where the turbo on the `Diesel` engine sits, on top of
    the `DVR`, near a heated floor or anything else producing heat. If someone leaves
    a laptop with the display open, `Mac` will conduct a `buffer overflow` test...


    Jack: ![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m1abd5617.jpg)![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m50cd7bfa.jpg)![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m626e9af0.jpg)


    Mac: ![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_58116c8b.jpg)![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m3aebe48.jpg)


