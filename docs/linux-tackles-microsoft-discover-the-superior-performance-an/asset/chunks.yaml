    我使用 `Mozilla Firefox` 进行网页浏览，Firefox 有许多插件可以允许我阻止脚本、停止烦人的自动播放，并保护我免受恶意软件、脚本以及广告的侵害。没有什么比打开一两个链接就开始听到声音，或者更糟糕背景音乐更让人烦了。这些插件消除了困扰并将控制权交给用户。当然，Firefox
    可以在 Microsoft 和 Linux 上运行，另一种可用的互操作工具，为用户提供了更多选择。


    （2020 年更新：使用 Oracle 的 VirtualBox 并在虚拟机中安装 Microsoft！）


    我使用 `OpenOffice.org` 的 `OpenOffice` 工具套，以及 `LibreOffice`。我曾在 Linux 下通过 `WINE`（Wine
    并不是模拟器，而是一个允许原生地运行微软应用程序的开源工具）使用过微软产品，并使用 `Codeweavers Crossover` 应用程序在 Linux
    中运行微软应用程序。可能性是无限的，因此我们不再局限于任何一个平台。在我即将出版的书籍《**Simply Linux：在现实世界中使用 Linux**》中，我将描述如何将带有完整插件的
    Mozilla 产品在 Linux 计算机之间移动，甚至可以（尽管是单向地）从 Linux 移动到 Microsoft，或者回到 Linux。来回移动是一个问题，因为微软对这些产品在使用时进行了一些更改，不幸的是，这阻止了真正的互操作性。但有了我们这些工具，我可以轻松地在
    Microsoft `XP`、`Win7` 或任何版本的 Linux 之间切换，并查看网页、编辑电子表格、文档或电子邮件。我始终使用 Microsoft Office
    97-2003 格式，这也是 Smashwords 对这些书籍的建议格式。


    虽然相关，但书中没有涉及安全问题，但安全具有重要意义，且 Linux 显然要安全得多，但这可能需要在另一本书中讨论，以消除 `FUD 因素` 的困扰。`FUD
    – 恐惧、不确定和怀疑`，是那些产品真的没有实质益处的人所使用的营销工具。销售此类产品的人会试图对竞争对手产生怀疑，或者在没有竞争对手甚至没有实际需求的情况下，如果不使用他们的产品会发生什么。FUD
    经常尝试利用统计数据来帮助他们的观点听起来合理。他们会忽略消费者保护法或基本常识来向你推销真正不需要的东西。他们会利用各种统计信息来创造需求，然而，人们应该记住马克·吐温引用
    19 世纪英国首相本杰明·迪斯拉叶（1804–1881）的话：“**世界上有三种谎言：谎言、该死的谎言和统计数据。**”（*尽管某些证据表明吐温是那句引用的创造者——参见
    wiki*）这为了说明，微软的营销人员会提出一个伪善的论点，因为 UNIX 和 Linux 的安全补丁比 Microsoft 多，所以这让微软更安全了。这完全不是事实。简单审阅
    UNIX 和 Linux 的补丁就会很快发现，它们与大多数用户从未使用、永远不会使用、甚至在任何系统中都没有激活的各种组件有关。但这些补丁实际上展示了 Linux
    和 UNIX 操作系统的另一个优势：持续的遗留支持！软件不会被经常废弃或过时而给你留下损坏的脚本或工具，而是被持续保持更新。如果是一个命令，你经常会看到一条小消息，指示有更好的命令可用。


    所以，微软的 FUD 营销工具指出了 UNIX 和 Linux 的另一个优势！这意味着如果你在 Solaris 1 上编写了脚本或应用程序，它今天在最新版本的
    Solaris 1 或 Linux 上运行时只需很少或无需任何调整。微软应用程序的情况则完全不是如此，微软的应用程序几乎在每次发布时都会废弃，且在没有警告的情况下强迫用户购买升级版本，而这些升级版本提供的增强很少，通常只会有更多的视觉效果。这些变化还需要对微软人员进行额外的培训并参加新的认证考试。在
    UNIX 和 Linux 中，如果你获得了证书，当进行更新时，你不需要去获得额外的认证，人们认为你有能力阅读 `"man"` 页面和其他文档。这又代表了另一个优势：节省了
    IT 员工的培训成本！力量、性能、安全、遗留支持、降低培训成本……而你只考虑了两个因素就买了这本书！


    你还会发现，虽然为微软操作系统产生的补丁可能较少，但因为系统在内核中内置了许多功能，外部子模块较少，因此较少的补丁可能用于解决更多的修复。而真正具有意义的是那些要求的补丁漏洞的影响。以及测试这些更改的次要问题。涉及的代码行数使得测试补丁变得极具挑战性，而且一个补丁可能会导致更多的漏洞。在某个时刻，微软会放弃该内核，将其废弃并重新开始，留下被遗弃的遗留应用程序，并隆重其实鼓地发布新版本……让长期用户感到失望，并让
    IT 员工接受更多培训以学习他们把按钮移到了哪里。


    UNIX 或 Linux 中的漏洞可能没有利用程序，但即使有利用程序和多个攻击向量，对于没有打补丁的人来说，可能没有损害或损失，正如 2013 年与 `BASH`
    shell 漏洞相关的近期“Shell Shock”媒体攻势所证明，尽管有两个已知漏洞路径的利用程序……但还没有出现关于由此产生的成本或损害的新闻标题。这部分原因在于
    UNIX 和 Linux 操作系统的底层范式在下一章中分享的“Linux 哲学”]


    几乎任何微软的漏洞在人们意识到之前通常就有利用程序，因为黑客发现了问题并创建了利用程序，而在开源和 Linux 中，通常是志愿者程序员发现了问题并编写了补丁，提交给社区。虽然微软的利用程序在专有代码的供应商分析并解决问题之前可能会导致昂贵的损害和故障，但再次创建了待发现的新漏洞。像
    `MSBlaster`、`Love Bug` 以及其他攻击让用户损失了数百万的时间和服务。然而，FUD 广告起作用了，因为人们不检查或理解细节。然而，这本书是关于性能和力量的，安全是以后再去追的小猫。


    下面的图片显示猫 Mac 正在跑步，但既没有追逐也没有被追逐：


    ![](img/tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_63f74807.jpg)

