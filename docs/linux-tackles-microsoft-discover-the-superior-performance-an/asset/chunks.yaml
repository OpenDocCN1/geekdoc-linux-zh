- fmt: '

    This study was limited to a test of Microsoft Windows XP and SuSE Linux operating
    systems to reduce the variables associated with other distributions of Linux and
    versions of Microsoft Windows. The tests were conducted with the default installations
    of the operating systems, no user interaction and no applications running.


    ## Definition of Terms


    - **Ampere-hour (Ah) capacity**: "The measure of the total quantity of electricity
    which can be delivered by a battery from the fully charged condition until its
    terminal voltage drops to the lowest permitted limit" (Tranter, 1983, p. 27).

    - **Power**: "Power measures the rate at which energy is transformed. The transformation
    of 1 joule of energy in 1 second represents an average power of 1 watt" (Smith,
    1984, p. 8).


    ## Acronyms


    - **CPU**: Central Processing Unit

    - **CS**: Computer Science

    - **DLL**: Dynamic Link Library

    - **GNU**: A recursive acronym meaning: "GNU is Not Unix", the name provided by
    Richard Stallman, founder of the Open Source movement.

    - **I/O**: input/output

    - **IT**: Information Technology

    - **OS**: Operating System

    - **SuSE**: "Software- und System-Entwicklung" was founded in late 1992 as a UNIX
    consulting group.

    - **Wine**: Wine Is Not a (CPU) Emulator. (Wine HQ, n.d., par. 2.2).

    - **XP**: A Microsoft Windows version released in October 2001.


    ## CHAPTER II: REVIEW OF RELEVANT LITERATURE AND RESEARCH


    ### Power Consumption


    "A Google engineer has warned that if the performance per watt of today''s computers
    doesn''t improve, the electrical costs of running them could end up far greater
    than the initial hardware price tag" (Shankland, 2005). "The possibility of computer
    equipment power consumption spiraling out of control could have serious consequences
    for the overall affordability of computing, not to mention the overall health
    of the planet" Barroso, 2005). Bangeman (2007) reports that the EPA will begin
    a six-month study of power consumption in the data center with the goal of encouraging
    the deployment of more energy-efficient hardware.


    Bangeman (2007) identifies the additional power consumption of computers:


    Energy costs can account for up to 30 percent of a company''s IT budget. Power
    consumption figures include not only the servers themselves, but uninterruptable
    (sic) power supplies, switches, NAS devices, and air conditioning. Those energy
    bills have grabbed the attention of enterprise IT managers. At last fall''s Intel
    Developer Forum, Google Fellow Luis Barroso said that his company believed that
    30 to 45 percent of a PSU''s input power is wasted. Given the scope of Google''s
    data centers, that''s a significant figure.


    Bangeman (2007) summarizes the problem and the overall impact:


    With rising energy prices and concerns over the impact of greenhouse gases on
    the Earth''s climate, the private sector is already feeling the need to slash
    IT energy costs. The EPA''s study may serve to reinforce such attitudes in the
    private sector while providing a mandate for federal agencies to cut IT energy
    costs with more energy-efficient equipment.


    In a CNET News.com article, Shankland (2006) reported:


    But it''s in the interest of anyone consuming power to improve efficiency, argued
    Andrew Fanara of the EPA''s Energy Star program. "Companies have to ask themselves,
    ''Am I willing to bet the cost of energy is going to go down?'' That''s the cost
    of doing nothing," Fanara said.


    Power consumption is a major industry concern. The focus has been on the improvement
    of hardware. The operating system and software run on the hardware must also be
    considered.


    ### Computer Operating Systems


    An operating system is part of every computer system. A computer system has four
    major components: the hardware, the operating system, the application programs
    and the users. (Silberschatz, Galvin, & Gagne, 2002).


    ### Computer Hardware


    The hardware components include the CPU, memory, disk drivers, video displays,
    keyboard and graphical user interfaces. (O''Brien, 2002). There are two major
    operating systems available for laptop computers and desktops using Intel architecture:
    Microsoft Windows and Linux. Microsoft Windows and Linux are compatible on the
    same hardware and may be loaded on the same system and on the same disk drive,
    although they can not run concurrently. Having the operating systems loaded on
    the same system in a dual-boot configuration would allow the user to have the
    benefits of both.


    ### Monolithic Kernels


    Both Linux and Windows are monolithic kernels operating systems. "In a monolithic
    kernel, all software and data structures are placed in one logical module…and
    they can be very efficient if they are well implemented" (Nutt, 2004, p. 778).
    Both Windows and Linux have all core operating systems services running in shared
    address space in kernel-mode. (Solomon & Russinovich, 2006). Figure 1 graphically
    represents the similarity of the architectures.


    ![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_me415778.png)


    *Figure 1.* Kernel architectures. *Note.* From Solomon & Russinovich (2006).


    ### Operating Systems Efficiency


    The efficiency of the operating system and the hardware will determine the total
    power consumption. According to Brooks (1995) a software development project will
    grow in size. This growth often translates to increased program size, additional
    lines of code that are executed by the CPU during program execution and as a result
    increased power consumption. Inefficient code and a lack of optimization will
    result in poor user performance, this leads to the acquisition of faster, more
    powerful hardware, which leads to increased power consumption.


    #### Lines of Source Code


    Dvorak (2004) reported that there are now so many lines of code that he was told
    nobody at Microsoft has a handle on it. Lohr and Markoff (2006) estimate that
    Windows XP has more than 20 million lines of code. Wheeler (2004) estimated that
    a GNU/Linux distribution includes well over 17 million lines of code, representing
    4,500 person-years of development time.


    Both operating systems appear to have similar lines of code in their distribution,
    XP with 20 million and Linux with 17 million. However, it may be inferred, based
    on the Linux paradigm, that the code used in Linux having been reviewed by the
    open source community might be more efficient. Linux is designed after the same
    philosophy as UNIX. Because of the modularity of this philosophy, the lines of
    code may not be directly comparable. The lines of code used in XP would be loaded
    with the operating system while much of the code in Linux would sit waiting to
    be called to service as evidenced by the second of the nine precepts put forward
    by Gancarz (1995, 2003) that states that each program should be made to do one
    thing well.


    ### Laptop Batteries and Power Consumption


    The issue of power is of even more concern to the mobile worker. The total time
    that the battery provides power to the portable computer permits the user to engage
    in productive work. Miles (1999) notes:


    As notebooks drop in price and increase in performance, they''ve finally become
    a viable option as a primary computer for millions of users. But those with the
    fanciest chips and multimedia options typically offer less than stellar battery
    life--about an hour for many systems--which leaves many nervous users scrambling
    for an electrical outlet.

