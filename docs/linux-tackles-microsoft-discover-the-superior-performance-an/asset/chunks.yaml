- fmt: '

    OpenSUSE stands alone and is my personal favorite both professionally and personally.
    It is basically the same as `SLES/SLED` - or SuSE Linux Enterprise Server, or
    Desktop. OpenSUSE is developed and released often before the Enterprise version.
    The Enterprise version is highly stable and not updated frequently, making it
    perfect for corporate use. It is one of the two major distributions certified
    for use with Oracle. The other version family suitable for Oracle use is the RedHat
    family, which is represented on this list by `Fedora` - the home version and `CentOS`,
    a version of RedHat Linux supported professionally and is suitable for Oracle.
    The reason that RedHat Enterprise is not listed on `distrowatch.com` is that it
    is expensive and restrictive in its use. RedHat follows a Microsoft-like licensing
    and costs structure, and RedHat''s expensive support and costs is used by Microsoft
    marketing to show how "affordable" Microsoft is. This is another specious / FUD
    argument when you consider we have the option to use the free versions of SUSE
    and `CentOS` Linux, along with Oracle''s Unbreakable Linux to run the Oracle suite
    of tools and still have Oracle certification and support. However if you''re an
    MBA, a newly hired CIO, a regular bean counter, or a Microsoft support person
    and don''t understand the Linux world you''ll likely not know the difference.
    But you do now.


    The following image is a screen shot from `Distrowatch.com` showing distribution
    ratings:


    ![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m44ca1535.png)


    The evidence is clear that while using basic commands on both operating systems
    that there are distinct differences in overall performance, leaving the Linux
    operating system the clear performance leader. This makes sense considering the
    next factor, power consumption, and my initial area of exhaustive testing.


    # Chapter Three: Power Analysis


    The following is the graduate research conducted on the question: “what if there
    is a difference in power consumption between Microsoft Windows and Linux?”


    In the picture below the cats Jack and Mac analyze the power output of a laser
    beam on the wall of my office:


    ![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_7fa1ef6e.jpg)


    Part of the graduate research involved calculating the actual power consumption
    of one laptop using the two operating systems under review, specifically, the
    power consumption between SuSE Linux and Microsoft XP `sp2` on an `IBM R50p`.
    Unfortunately I no longer have that laptop and do not believe there would be added
    value to the research to run the tests again using a `Dell D630` or other hardware.
    One could extrapolate the values by calculating the differences recorded on other
    hardware and then use those values to calculate what the relative power consumption
    would be for the newer versions. But that isn''t an accurate method in that the
    newer OS may be less compatible with the older hardware. If this information were
    important the battery life tests would need to be conducted on the hardware in
    question, which implies the use of a laptop.


    For the analysis provided in the graduate research it was determined that the
    laptop consumed:


    ### Linux (SuSE)- 16 Watts


    - **XP SP2-19 Watts** - 3 watts or 16% more power consumption over Linux

    - Vista - 36 Watts - 20 watts or 56% more power consumption over Linux

    - **Win7-35 Watts** - 19 watts or 55% more power consumption over Linux

    - Win8 - 23 Watts - 7 watts or 31% more power consumption over Linux


    The image below shows Figure 6, the table found in the original research:


    ![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m122b4e8d.png)


    Some of the information summarized above was a follow on to the original research,
    which addressed the question of whether a difference existed across other hardware
    types. Therefore, it was important to test across several hardware platforms and
    analyze the data to ensure that it was not just one hardware type that saw the
    difference. The study below was conducted on several hardware types, models and
    brands, using four different CPUs in order to confirm that the power savings of
    Linux over Microsoft were indeed related to the operating systems alone and not
    the hardware. The research presented provides the background details of what prompted
    my graduate research. It is provided below to demonstrate quantitative and statistically
    valid data to support the costs savings of Linux over Microsoft systems. The tests
    could be repeated on newer hardware using newer versions of the operating system
    to make it more relevant, the testing methodology is included.


    ## A COMPARISON OF POWER CONSUMPTION BETWEEN MICROSOFT WINDOWS XP AND SUSE LINUX
    ON LAPTOP COMPUTERS


    by John Edward Meister, Jr.


    A Technical Management Capstone Project


    Submitted to the ERAU Worldwide in Partial Fulfillment of the Requirements of
    the Degree of Master of Science in Technical Management

    Embry-Riddle Aeronautical University

    Worldwide

    Everett Campus

    June 2007


    This Technical Management Capstone Project was prepared under the direction of
    the candidate’s Project Review Committee Member, Dr. Bobby L. McMasters, Associate
    Professor, ERAU Worldwide, and the candidate’s Project Review Committee Chair,
    Dr. Wayne Harsha, Associate Professor, ERAU Worldwide, and has been approved by
    the Project Review Committee. It was submitted to ERAU Worldwide in partial fulfillment
    of the requirements for the degree of Master of Science in Technical Management.


    ### PROJECT REVIEW COMMITTEE:

    - Bobby L. McMasters, Ed.D, P.E. (Committee Member)

    - Wayne Harsha, Ed.D. (Committee Chair)


    ### ACKNOWLEDGMENTS

    Special thanks to my wife Rebecca for her remarkable patience, her assistance
    in testing laptops and for enduring my studies. Thanks are extended to my fellow
    cohort and friend David Ashby, who graciously loaned two laptops for exhaustive
    testing. Thanks to my daughter, Christine, for allowing dad to dual boot her brand
    new laptop computer and for running battery life tests. Appreciated are the objective
    contributions and reviews of co-workers, friends, peers and fellow cohorts. Recognition
    and appreciation of my committee; heartfelt thanks to two of the finest teachers
    I''ve ever had; thank you for your sincere enthusiasm, encouragement and excellence
    in education.


    ### ABSTRACT

    - **Researcher:** John Edward Meister, Jr.

    - **Title:** A Comparison of Power Consumption Between Microsoft Windows XP and
    SuSE Linux on Laptop Computers

    - **Institution:** Embry-Riddle Aeronautical University

    - **Degree:** Master of Science in Technical Management

    - **Year:** 2007


    This study examines power consumption between Microsoft Windows XP and SuSE Linux
    on laptop computers through the proxy variable battery life. The experimental
    study evaluated battery life tests between the two operating systems on dual-booted
    laptop computers configured to use the same hardware and batteries. The tests
    determined that SuSE Linux is more efficient than Microsoft Windows XP on the
    tested laptop computers, realizing an overall average of 26.88% power savings.
    The researcher offers conclusions that may be useful to determine energy savings
    for organizations and provide mobile workers with longer battery life while maintaining
    interoperability.


