    Introduction


    This book tests and analyzes **performance and power consumption.** It also discusses
    interoperability and ways of making both Linux and Microsoft work. While many
    seem interested in better performance and reducing the costs associated with power
    consumption, the question comes up, how do you quantify the differences? Those
    topics will be addressed in this book as we examine performance differences on
    a single system, and what the power differences are between operating systems
    as examined on multiple systems.


    A brief summary of the [performance results from Chapter 2](#tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX.ch.fixed.fc.tidied.stylehacked.xfixed_split_004.html_C2)
    is shown in the image below, and below that a sampling of power consumption on
    one of the laptops used to test [power comparisons as detailed in Chapter 3](#tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX.ch.fixed.fc.tidied.stylehacked.xfixed_split_005.html_C3).


    ![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_7a828b60.png)


    Linux (SuSE) - 16 Watts


    XP SP2-19 Watts - 3 watts or 16% more power consumption over Linux


    Vista - 36 Watts - 20 watts or 56% more power consumption over Linux


    Win7 - 35 Watts - 19 watts or 55% more power consumption over Linux


    Win8 - 23 Watts - 7 watts or 31% more power consumption over Linux


    The image below shows Figure 6, the table found in the original research:


    ![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_m122b4e8d.png)


    People will often purchase new hardware when seeking an increase in performance
    instead of considering other options such as changing the operating system, adding
    memory or even switching types of hard drives. Sometimes one can simply optimize
    the environment they have and see an improvement in performance. If you need to
    run a Microsoft operating system you may be interested in my upcoming book "**Some
    Practical Suggestions for Microsoft Systems**" where a number of practical settings
    and configurations to optimize performance and reduce issues are identified. These
    recommendations are based on years of supporting software developers, engineers
    and DBA''s working with large amounts of data in CAD/CAM tools or databases.


    Changing the operating system may not be an option if the applications are dependent
    on a particular version. And the idea of switching operating systems can be a
    subjective and controversial topic, shrouded in emotion and ignorance.


    Microsoft users will talk about those **“dark screen folks”,** those in the realm
    of the "**command line interface**", the Linux users. The "dark screen" refers
    to the default terminal windows colors of black background with green text, or
    gray text… for my aging eyes a really useless default that emulates the old console
    terminals and something that almost every UNIX and Linux Sys Admin I know changes.
    I did notice that my son prefers the black screen with light characters as he
    has plunged into the Linux world afresh as a Mechanical Engineering student fed
    up with the eye candy and other issues of the Microsoft world.


    Linux users will refer to the limitations of the "**captive user interfaces**"
    of the Microsoft operating systems as “**clicking and drooling**”. Both potshots
    are good natured jesting, but also point out significant differences in the paradigms
    and reveal significant differences that impact performance, power consumption,
    and other factors that a more complete discussion of are not possible in this
    book, which are in part: **security and functionality**.


    The following picture shows the two cats Mac and Jack battling it out on top of
    the book case in my office:


    ![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_328aa28a.jpg)


    Both groups have valid points, meaning that neither operating system is perfect
    for everyone. There are distinct advantages related to performance and power consumption
    between the two systems and this book quantifies those differences and offers
    a few practical solutions to overcome some of the historical limitations associated
    with the UNIX and Linux systems.


    Considering that most users are using their computers for **email**, **web-browsing**,
    and **office tools** like "Word", "PowerPoint", and "Excel", or better, documents,
    presentations and spreadsheets. It may come as a shock to regular Microsoft users
    that there are **completely free applications available to Linux users**, and
    also to Microsoft and Apple MacOS users. Those free applications have the same
    functions and commands across all three operating systems and are interoperable,
    meaning that the files saved can be used on the different operating systems and
    the commands to use the tools are the same.


    I use **Mozilla Thunderbird** for email and enjoy many of the same features, and
    actually more, that what is provided by **Microsoft Outlook**, but without the
    concerns of macro viruses. There are add-ons for Thunderbird that allow me create
    the same kind of rules I do in Outlook, but also to automatically extract images
    from emails sent from security cameras I have configured in various locations.
    Using other free software like "mencoder" in Linux I have been able to create
    Time Lapse photography, mostly automated using these free tools.'
