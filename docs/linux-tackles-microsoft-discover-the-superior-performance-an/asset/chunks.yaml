    = 26.88% and σ = 9.54).


    CHAPTER V


    DISCUSSION


    The null hypothesis was rejected as *p* < 0.5; a *t*(86) = -3.27, *p* = 0.0015
    was calculated across all laptop computer model battery life data. **There was
    a significant difference in battery life between Microsoft Windows XP and SuSE
    Linux across all of the tested laptop computers.** Eighty-eight tests on eleven
    laptop computers from four different CPU categories were tested. There was a significant
    difference in power consumption between Microsoft Windows XP and SuSE Linux.


    The first CPU group was the Intel Pentium 4\. Laptop computers tested in this
    group were a Fujitsu Lifebook C-2240, a Toshiba Satellite S20-A207 and an IBM
    A31p. **The average power savings of SuSE Linux in the third CPU group was 35.93%,
    with a low of 26.83% on the Toshiba Satellite and a high of 38.66% on the Fujitsu
    Lifebook.**


    The second CPU group was the Intel Pentium M. Laptop computers tested in this
    group were two different Dell 610s. The average power savings of SuSE Linux in
    the fourth CPU group was 20.24%, with a low of 18.51% on the first Dell 610 and
    a high of 21.98% on the second Dell 610.


    The third CPU group was the Intel Centrino. Laptop computers tested in this group
    were a Dell 510, a Sony Vaio PCG-9231 and an IBM R50p. The average power savings
    of SuSE Linux in the first CPU group was 21.24%, with a low of 18.82% on the IBM
    R50p and a high of 30.06% on the Sony Vaio.


    The fourth CPU group was the Intel Pentium III. Laptop computers tested in this
    group were an HP EVO N-600C, and an HP Pavilion N5350 tested with two different
    battery capacity types. The average power savings of SuSE Linux in the second
    CPU group was 27.88%, with a low of 22.64% on the HP N5350 with a 6600 mAH battery
    and a high of 39.98% on the HP N-600C.


    The collected data revealed that the Linux operating system was significantly
    more efficient than Microsoft Windows XP. This efficiency translated to extended
    battery life and reduced power consumption for SuSE Linux on all tested laptop
    computers. The issues of battery life and power consumption affect users and their
    organizations in a multitude of ways. Decreased battery life requires more frequent
    battery changes, more frequent charges, or the purchase of a larger capacity battery
    to make it through a work day or an airplane flight. Increased power consumption
    by Microsoft Windows XP results in higher energy costs, the necessity for additional
    power sources and increased heat.


    The literature review revealed that both operating systems have similar lines
    of code; however, [the Linux philosophy appears to result in better use of those
    lines of code](#tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX.ch.fixed.fc.tidied.stylehacked.xfixed_split_003.html_PhilosophyOfLinux),
    possibly by not loading them into memory until called. **Observations made using
    system tools indicate that Microsoft Windows XP accesses the CPU more often than
    does SuSE Linux while in a quiescent state.** The increased frequency of CPU activity,
    activation of unneeded services, and unused functions loaded into memory, may
    be factors associated with the decreased battery life and increased power consumption
    of Microsoft Windows XP. The Windows operating system appears to use a fixed polling
    schedule to monitor the system, while the Linux operating system may use an interrupt
    method, waiting for a system call by an application or intervention by the user.
    The specific differences in the operating systems would require further analysis
    to determine the specific underlying causes of Microsoft’s increased power consumption
    and decreased battery life.


    CHAPTER VI


    CONCLUSION


    The null hypothesis was rejected as *p* < 0.57\. There is a significant difference
    in battery life between Microsoft Windows XP and SuSE Linux on the tested laptop
    computers. The estimated average savings of SuSE Linux averaging 26.88% was about
    56.4 minutes of additional laptop computer use based on the mean data collected.


    The difference in battery life between Microsoft Windows XP and SuSE Linux was
    significant and revealed the efficiency of Linux over Microsoft. The power savings
    of Linux ranged from 18.51% to 39.98%. Corporations would realize noticeable power
    savings by using Linux over Windows as demonstrated by these tests.


    With the current worldwide political emphasis on reducing greenhouse gases and
    heat, it is clear that the use of SuSE Linux would significantly reduce power
    consumption and especially help to reduce these gases in areas that use coal for
    power production. The reduction of power consumption elsewhere would reduce the
    need for additional power plants and extend the viability of our existing infrastructure.
    The extended battery life of Linux will permit laptop computer users longer periods
    of productive work.


