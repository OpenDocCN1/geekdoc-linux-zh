    chapter.](#tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX.ch.fixed.fc.tidied.stylehacked.xfixed_split_003.html_PhilosophyOfLinux)


    Almost any vulnerability in Microsoft has exploits often before anyone realizes
    it, because the hackers figure out the problem and create an exploit, whereas
    in Open Source and Linux it is usually a volunteer programmer who discovers a
    problem and writes a patch for it, submitting it to the community for inclusion.
    While the Microsoft exploit can result in costly damage and outages before the
    vendor of the proprietary code, Microsoft, is able to analyze and resolve the
    problem, again, often creating new vulnerabilities to be discovered later. Attacks
    like MSBlaster, Love Bug and too many others have cost users millions of dollars
    in lost time and service. Yet the FUD ads work because people don’t examine or
    understand the details. However, this book is about performance and power, and
    security is a squirrel to chase another day.


    The following image shows Mac the cat running, but neither chasing or being chased:


    ![](tmp_043ba0e093f76b4a246696d842eeffaf_pNfMdX_html_63f74807.jpg)


    The author’s intent in this book is to demonstrate quantitatively and with statistically
    valid and repeatable data and methods that the Linux operating system should be
    considered as a better performing and more efficient option to the Microsoft operating
    systems. Combine that with Microsoft’s latest releases having been met with less
    than a positive response and Linux begins to look much more attractive. As a professional
    computer geek, people come to me for computer help, at work, at home, via email,
    via phone calls or when spotted in the neighborhood. It’s not uncommon to be handed
    a shiny new Windows 8 computer and ask to have it loaded with XP or Win7 or Linux.
    Very often I''ll be handed a dying or deceased computer as the last hope of recovering
    files that exist only that computer. The computer quit working with Microsoft
    because of a failing hard drive, virus or system corruption.'
