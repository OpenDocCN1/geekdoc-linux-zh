  md: 'The MODULE_DEVICE_TABLE macro is necessary for user-space hotplug utilities
    to do their work.


    You may have noticed that the callback functions do not refer directly to the
    usb_driver structure, but instead point to a structure of type usb_interface.
    One can go back and forth between the two structures with:


    ```

    struct usb_device *interface_to_usbdev(struct usb_interface *intf);

    void *usb_get_intfata(struct usb_interface *intf);

    void *usb_set_intfata(struct usb_interface *intf);

    ```


    The first function retrieves a pointer to the underlying usb_device.


    The other two functions get set a pointer to the data element within the struct
    device_driver, pointed to in the struct usb_driver pointed by the struct usb_interface.
    With this private data pointer nested deep within the structures, these functions
    are quite useful.


    The no_dynamic_id field lets a driver disable allocation of dynamic device IDs.


    # 27.8 Example of a USB Driver


    In order to see how all fits together, let''s take a look at /usr/src/linux/drivers/usb/misc/rio500.c,
    a relatively simple driver for a type of MP3 device that attaches to the USB port.


    We will look at the part of the driver that handles initializing, registering,
    and probing connecting. The actual data transfer code will of course quite hardware
    dependent. It is composed mostly of entry points pointed to in the file_operations
    jump table.


    Note that one has reference to a file_operations structure as a character device:


    ```

    3.1: 435 static const struct file_operations usb_rio_fops = {

    3.1: 436      .owner = THIS_MODULE,

    3:1: 437      .read = read_io,

    3:1: 438      .write = write_rio,

    3:1: 439      .locked_ioctl = ioctl_rio,

    3:1: 440      .open = open_rio,

    3:1: 441      .release = close_rio,

    3:1: 442      .llseek = noop_llseek,

    3.1: 444

    3.1: 445 static struct usb_class_driver usb_rio_class = {

    3:1: 446      .name = "rio500d",

    3:1: 447      .fops = &usb_rio_fops,

    3:1: 448      .min_base = RIO_MINOR,

    3:1: 449 };

    ```


    The file_operations structure is pointed to by an entry in the struct usb_class_driver,
    which will be associated with the device in the usb_register_dev() function call,
    which is made from the probe() callback.


    There is also a structure of type usb_device_id which points to the callback functions:


    ```

    3.1: 520 static const struct usb_device_id rio_table[] = {

    3.1: 521      { USB_DEVICE(0x0841, 1) },

    3.1: 522      /* Rio 500 * */

    3.1: 523 };  /* Terminating entity */

    3.1: 524

    ```'
