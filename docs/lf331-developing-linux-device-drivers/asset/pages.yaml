- pgno: 203
  md: 'An address bus transmits addresses; on the Pentium address buses are 32-bit
    wide.


    - A control bus transmits control information, such as whether the bus can allow
    data to get between a CPU and RAM, or between a CPU and an I/O device, or whether
    a read or write is to be performed.


    +   - A bus connecting a CPU to an I/O device is called an I/O bus; x86 CPUs use
    32 of address lines to address I/O devices, and 8, 16, or 32 of the 64 lines to
    transfer data. The I/O bus is connected to each I/O device through a combination
    of I/O interfaces, and device controllers.


    +   - The busses can be of various types such as ISA, EISA, PCI, and MCA. We will
    restrict our attention to ISA and PCI.


    +   - Controlling peripheral devices generally involves reading and writing to
    registers on the device. When we talk about I/O ports, we are referring to the
    consecutive addresses, and registers.


    +   - Exactly how these ports are accessed depends on the CPU. All are attached
    to some kind of peripheral bus, but some CPUs, such as the x86 actually have distinct
    read and write lines and special CPUs to access these memory locations. On other
    architectures, memory is memory. Portable code uses the basic functions regardless
    of the architecture, although the implementation of them may differ.


    +   - On the x86 architecture this I/O address space is 64K in length; ports can
    be addressed as individual 8-bit ports, where two consecutive 8-bit ports can
    be treated as a 16-bit port, and four consecutive 8-bit ports can be treated as
    a 32-bit port. Thus, to be more precise, you can have 64K 8-bit ports, or 32K
    16-bit ports, 16K 32-bit ports, or some combination. The 16-bit and 32-bit ports
    should be aligned on 16-bit and 32-bit boundaries.


    # 19.2 Memory Barriers


    +   - Operations on I/O registers differ in some important ways from normal memory
    access. In particular, there may be so-called side-effects. These are generally
    due to compiler and hardware optimizations.


    +   - These optimizations can cause reordering of instructions. In conventional
    memory reads and writes there is no problem; a write always stores a value and
    a read always returns the last value written.


    +   - However, for I/O ports problems can result because the CPU cannot tell when
    a process depends on the order of memory access. In other words, because of reading
    or writing an I/O register, devices may initiate or respond to various actions.


    +   - Therefore, a driver must make no caching is performed and no reordering
    occurs. Other problems which are difficult to diagnose, and are rare or intermittent,
    may result.


    +   - The solution is to use appropriate memory barrier functions when necessary.
    The necessary functions are defined in and indirectly included from /usr/src/linux/arch/x86/asm/system.h
    and are:


    ```

    void barrier (void)

    void rmb (void)

    void wmb (void)

    void mb (void)

    void smmp_rmb (void)

    void smmp_wmb (void)

    void smmp_mb (void)

    ```'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# 19. REGISTERING I/O PORTS


    +   - The Barrier() macro calls the compiler to store in memory all values currently
    modified by a CPU register, to read them later when they are needed. This function
    does not have any effect on the hardware itself.


    +   - The other macros put hardware barriers in the code; how they are implemented
    depends on the platform. rab() forces any reads before the barrier to complete
    before any reads after the barrier; wmb() does the same thing for writes, while
    mb() does it for both reads and writes.


    +   - A simple example of use of a writer barrier would be:


    ```

    io32write(direction, dev->base + OFF_DIR);

    io32write(size, dev->base + OFF_SIZE);

    wmb();

    io32write(value, dev->base + OFF_GO);

    ```


    +   - Most architectures define convenience macros, which combine setting a value
    with invoking a barrier. In the simplest format they look like:


    ```

    #define set_mb(var, value) do { var = value; mb(); } while (0)

    #define set_wmb(var, value) do { var = value; wmb(); } while (0)

    #define set_rmb(var, value) do { var = value; rmb(); } while (0)

    ```


    +   - Memory barriers may cause a performance hit and should be used with care.
    One should only use the specific form needed. For instance on x86 the write memory
    barrier does nothing as writes are not reordered. However, reads may be reordered,
    so one should not use mb() if wmb() would suffice.


    # 19.3 Registering I/O Ports


    +   - Before we can access the I/O ports, the kernel has to register their use,
    although there is nothing at the hardware level to enforce this which can lead
    to many bugs and system crashes.


    +   - Linux uses the following functions, defined in /usr/src/linux/kernel/resource.c
    for requesting and releasing I/O ports:


    ```

    #include <linux/ioport.h>

    ```


    ```

    struct resource *request_region(unsigned long start, unsigned long len, const
    char *name);

    void release_region(unsigned long start, unsigned long len);

    ```


    +   - In these functions the argument is the base address of the I/0 region, the
    argument extent is the number of ports, or addresses, and the argument name is
    the name that will appear in /proc/ioports as having claimed the region.


    +   - These functions are usually called when initializing or unloading a device.
    request_region() will reserve (register) the region, while release_region() will
    free (unregister) it. If any part of the range of I/O ports has already been reserved,
    the request will fail.


    +   - Note: there is no enforcement here; i.e., if you try to access a given I/O
    port without checking or requesting it, nothing will stop you.'
  merge: -1
  img_proc: true
