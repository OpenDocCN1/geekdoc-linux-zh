    on how the next step, merely opening /dev/ttyS? from a user-space application.
    You can also try


    ```

    $ stty -F /dev/tty0 ospeed 1200 ispeed 1200

    ```


    +   • If you hung up on setting the speed, decoding the bytes, the solutions contain
    hint files that contain the code for doing these steps.


    +   • While you can do this exercise under X, it will probably cause fewer headaches
    to do it at a console, X has some ideas about how to handle the mouse.


    +   • EXTRA: Construct a fully functional serial mouse driver, and use it under
    X. Note to do this you''ll have to modify /etc/X11/xorg.conf to point to your
    driver and the protocol. The read entry should deliver the latest raw 3 byte packet,
    and pad with zeros for any more than 3 bytes requested. You''ll have to be careful
    with things making sure the packet is not reset while you are reading, etc.'
