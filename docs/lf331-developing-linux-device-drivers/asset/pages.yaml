    \n# crash\n\n+   - The crash utility is probably provided by your Linux distribution\
    \ and full documentation can be found at http://people.redhat.com/android/.\n\
    - With crash one can examine all data structures in the kernel, do source code\
    \ disassembly, through linked lists, examine and set memory, etc. crash can also\
    \ examine kernel core dump files created by the kdumppackage.\n\n# 9.3 debugfs\n\
    \n+   - The debugfs filesystem first appeared in the 2.6.11 kernel. It can be\
    \ used as a simpler and more modern alternative to /proc filesystem, which has\
    \ an inconvenient interface and which kernel developers have lost their taste\
    \ for.\n\n+   - The main purpose of debugfs is for easy access to debugging information,\
