- pgno: 166
  md: '# 16.6. MEMORY MAPPING


    ```

    #include <linux/pagemap.h>


    char *kbuf = page_address(pages[i]);


    or


    char *kbuf = kmap(pages[i]);


    ...

    kunmap(pages[i]);

    ```


    The second form also handles the case of high memory, but one has to be sure to
    do the unmapping done. (In interrupt handlers, one needs to use the functions
    kmap_atomic(), kunmap_atomic(), but that can''t happen when using get_user_pages()
    since you must be in process context anyway.)


    +   - Note that unless the buffer happens to page-aligned, one only knows the
    user address lies somewhere in the page; the offset is not furnished. One can
    produce page-aligned memory using functions such as posix_memalign(), or use utilities
    which are alignment aware, such as dd. Programs such as cat are not.


    +   - It is also necessary to clean up any modification of the user pages; otherwise
    corruption may ensue as the virtual memory system has been bypassed. This marking
    modified modified pages as dirty and releasing them from the page cache:


    ```

    set_page_dirty_lock(pages[i]);

    page_cache_release(pages[i]);

    ```


    # 16.6 Memory Mapping


    +   - When a file is mapped the file (or part of it) can be associated with a
    range of linear addresses. Input and output operations on the file can be accomplished
    with simple memory references, rather than explicit I/O operations.


    +   - This can also be done on device nodes for direct access to hardware devices;
    in this case the driver must register and implement a proper mmap() entry point.


    +   - This method is not useful for stream-oriented devices. The mapped area must
    be a multiple of PAGE_SIZE in extent, and start on a page boundary.


    +   - Two basic kinds of memory mapping exist:


    +     - In a shared memory map any operation on the memory region is completely
    equivalent to changing the file it represents. Changes are committed to disk (with
    the usual delays) and any process accessing the file or mapping it will see the
    changes.


    +     - In a private memory map any changes are not committed to disk and are
    not seen by any other process. This is more efficient, but by design is used for
    a read only situation, or when the final saving of data is to be done by writing
    to another file.


    Memory mapping can be more efficient than normal disk access, particularly when
    files are being shared by multiple processes, each of whom share access to certain
    pages, thereby minimizing memory usage and speeding access times.'
