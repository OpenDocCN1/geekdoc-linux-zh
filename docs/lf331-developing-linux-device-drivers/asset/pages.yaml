- pgno: 24
  md: '# 2.4 ROLLING YOUR OWN KERNEL


    # written by Jerry Cooperstein (2002-2009)

    # Copyright GPL blah blah blah


    ```

    function get_SOURCE() {

    KERNEL=$1

    TARFILE=$2

    CONFIGFILE=$3

    LKV=linux-$KERNEL

    KONFIG=$LKV/config

    [ ! -f "$TARFILE" ] && echo "$TARFILE, aborting" && exit

    [ ! -f "$CONFIGFILE" ] && echo "$CONFIGFILE, aborting" && exit

    echo "$building: Linux kernel from $TARFILE"

    Using: $CONFIGFILE as the configuration file\n"

    set -x

    Decompress kernel, assumed in bz2 form

    tar xjf $TARFILE

    # Copy over the .config file

    cp $CONFIGFILE $KCONFIG

    Change to the main source directory

    cd $LKV

    set +x

    }

    ```


    # we determine which distribution we are on


    ```

    function get_SYSTEM() {

    [ "$SYSTEM" = "" ] && return

    SYSTEM=

    [ $(grep -i Red Hat. /proc/version) | = "" ] && && SYSTEM-REDHAT && return

    [ $(grep -i Ubuntu /proc/version) | = "" ] && && SYSTEM-UNUNTU && return

    [ $(grep -i debian /proc/version) | = "" ] && && SYSTEM-DEBIAN && return

    [ $(grep -i suse /proc/version) | = "" ] && && SYSTEM-SUSE && return

    [ $(grep -i gently /proc/version) | = "" ] && && SYSTEM-GENTOO && return

    }

    ```


    # find out kernel version this is


    ```

    function get_KERNELVERSION() {

    for FIELD in VERSION PATCHLEVEL SUBLEVEL; do

    eval $(sed -ne "^/$FIELD/s/\\ // Makefile")

    done

    # if there is a local version file?

    [ -f ./localversion-tip ] && &&

    EXTRAVERSION="$EXTRAVERSION$(cat localversion-tip)"

    KERNEL=$VERSION.$PATCHLEVEL.$SUBLEVEL$EXTRAVERSION

    }

    ```


    # determine where to place vmlin, System.map, initrd image, config file


    ```

    function get_BOOT() {

    [ "$BOOT" = "" ] && && BOOT=/boot

    }

    ```


    # parallelize, speed up for multiple CPUs


    ```

    function get_MAKE() {

    NCPUS=$(grep "processor" /proc/cpuinfo | wc -l)

    JOBS=$((3*$NCPUS)/2 + 2))

    MAKE="make -j $JOBS"

    }

    ```'
  merge: -1
  img_proc: true
