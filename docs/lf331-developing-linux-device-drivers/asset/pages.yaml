  md: '# 48 CHAPTER 5. CHARACTER DEVICES


    +   * The driver will go live when one calls:


    ```

    cdev_add (mycdev, first, count);

    ```


    This function should not be called until the driver is ready to handle anything
    that comes its way. The inverse function is


    ```

    cdev_del (mycdev)

