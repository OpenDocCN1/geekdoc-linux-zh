- pgno: 302
  md: '# 31.5. COMPLETELY FAIR QUEUE SCHEDULER


    +   - front_merges:

    - Back merges are more common than front merges as a contiguous request usually
    continues to the next block. Setting this parameter to 0 disables front merges
    and can give a boost if you know they are unlikely to be needed. (Default = 1)


    +   - Some detailed documentation can be found at: /usr/src/linux/Documentation/block/deadline-sched.txt.


    # 31.5 Completely Fair Queue Scheduler


    +   - The cfq (Completely Fair Queue) method has the goal of equal spreading of
    I/O bandwidth among all processes submitting requests.


    +   - Theoretically each process has its own I/O queue, which work together with
    a dispatch queue which receives the actual requests on the way to the device.
    In practice the number of queues is fixed (at 64) and a hash process based on
    the process ID is used to select a queue when a request is submitted.


    +   - Dequeueing of requests is done round robin style on all the queues, each
    of which works in FIFO order. Thus the work is spread out. To avoid excessive
    seeking operations, an entire round is selected and then sorted into the dispatch
    queue before actual I/O requests are issued to the device.


    # Tunables


    +   - quantum

    Maximum queue length in one round of service. (Default = 4);


    +   - queued

    Minimum request allocation per queue. (Default = 8)


    +   - fifo_expire_sync

    FIFO timeout for sync requests. (Default = HZ/2)


    +   - fifo_expire_async

    FIFO timeout for async requests. (Default = 5 * HZ)


    +   - fifo_batch_expire

    Rate at which the FIFO''s expire. (Default = HZ/8)


    +   - back_seek_max

    Maximum backwards seek, in KB. (Default = 16K)


    +   - back_seek_penalty

    Penalty for a backwards seek. (Default = 2)


    # 31.6 Anticipatory I/O Scheduler


    +   - The anticipatory I/O scheduler works off the observation that disk reads
    are often followed by other disk reads of nearby sectors.'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'When a request is made, a timer starts and I/O requests are not forwarded to
    the driver until it expires; i.e., the request queue is plugged momentarily. In
    the meantime, if another request arrives it is serviced immediately.


    The algorithm is adaptive in that is constantly adjusts its concept of close in
    accordance with the actual I/O request load.


    When there are no more close requests, work continues with normal pending I/O
    requests.


    The basic goal is to reduce the per-thread response time. This scheme is similar
    in implementation to the deadline scheduler, and can consider a variation on it.


    # Tunables


    +   * antic_expire:

    Maximum time (in milliseconds) to wait anticipating a good read (close to the
    most recently completed request) before giving up. (Default = HZ/150 = 6)


    +   * read_expire:

    How long (in milliseconds) until a read request expires, as well as the interval
    between serving expired requests. (Default = HZ/8 = 125)


    +   * read_batch_expire:

    How long (in milliseconds) a batch of reads gets before pending writes are served.
    Should be a multiple of read_expire. The higher the value, the more reading is
    favored over writing. (Default = HZ/2=500)


    +   * write_expire and write_batch_expire:

    Serve the same functions for writes. (Defaults = HZ/4 = 250


    +   * est_time:

    Gives some statistics.


    +   * Some detailed documentation can be found at: /usr/src/linux/Documentation/block/as-iosched.txt.


    # 31.7 Labs Comparing I/O schedulers


    # Lab 1: Write a script (or program if you prefer) that cycles through available
    I/O schedulers on a hard disk and does a configurable number of parallel reads
    and writes of a configurable size. You''ll probably want to test reads and writes
    as separate steps.


    +   * To test reads you''ll want to make sure you''re actually reading from disk
    and not from cached pages of memory; you can flush out the cache by


    ```

    $ echo 3 > /proc/sys/vm/drop_caches

    ```


    before doing the reads. You can cat into /dev/null to avoid writing to disk. To
    make sure all reads are complete before you get timing information you can issue
    a wait command under the shell.


    +   * To test writes you can simply copy a file (which is in cached memory after
    the first read) multiple times simultaneously. To make sure you wait for all writes
    to complete before you get timing information you can use a sync command.'
