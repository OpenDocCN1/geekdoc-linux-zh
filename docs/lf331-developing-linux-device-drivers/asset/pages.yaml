  md: '# # Chapter 10


    # # Timing and Timers


    We''ll consider the various methods Linux uses to manage time. We''ll see how
    jiffies are defined and used, and how delays and timing are implemented. We''ll
    discuss kernel timers, showing how they are used and how they are implemented
    in the Linux kernel. We''ll also discuss the hrtimers feature and its high resolution
    implementation.


    | 10.1 Jiffies | 95 |

    | 10.2 Inserting Delays | 97 |

    | 10.3 What are Dynamic Timers? | 98 |

    | 10.4 Timer Functions | 98 |

    | 10.5 Timer Implementation | 99 |

    | 10.6 High Resolution Timers | 100 |

    | 10.7 Using High Resolution Timers | 101 |

    | 10.8 Labs | 103 |


    # ##10.1 Jiffies


    +   - A coarse time measurement is given by the variable unsigned long volatile
    jiffies defined in /usr/src/linux/include/linux/jiffies.h

    - Before kernel 2.6.21 jiffies was simply a counter that is incremented with every
    timer interrupt. However, with the incorporation of tickless kernels one does
    not keep processing timer interrupts when the system is idle. (For full details,
    see http://www.lesswatts.org/projects/tickless.)

    - The default frequency is HZ=1000 on the x86, but is configurable at compile
    time, thus we obtain a resolution between 10 and 1 milliseconds for the jiffies
    value.

    - On ARM the default timer frequency varies for different SoC. OMAP2plus has H
    set to 128, DOVE to 100 and EXYNOS4 to 200.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# CHAPTER 10. TIMING AND TIMERS


    +   - With HZ=1000 jiffies will overflow (and wrap) at about 50 days of uptime;
    if someone has been sloppy,

    what will happen then is unpredictable. If you are writing kernel code it is unlikely
    you will reach that long uptime.


    +   - To avoid any potential problems, the jiffies value is set during boot to
    INITIAL_JIFFIES = -300 Hz, which causes the value to wrap after five minutes.
    As a side effect you may notice that the value of jiffies differs from the number
    of interrupt reads from /proc/interrupts by the value.(Tickless kernels also break
    this equality).


    +   - Useful macros to compare relative jiffies values:


    ```

    time_after(a,b)

    time_before(a,b)

    time_after_eq(a,b)

    time_before_eq(a,b)

    ```


    where the first one is true if a is after time b, and the second one is inverse
    macro. The other two macros also check for equality.


    +   - Note that there exists a variable jiffies_64. On 64-bit platforms this is
    the same as jiffies;

    32-bit platforms jiffies points to its lower 32 bits. Since jiffies_64 won''t
    wrap for almost 600 million years (HZ=1000), one doesn''t need to worry about
    it doing so.


    +   - One has to be careful when using the 64-bit counter (on 32-bit platforms)
    as access to the value is not atomic; so one needs to use


    ```

    u64 get_jiffies_64(void);

    ```


    to read the value. (Note never set a value of course.)


    +   - A number of macros are provided to convert jiffies back and forth to other
    ways of specifying time:


    ```

    #include <linux/jiffies.h>


    unsigned long timespec_to_jiffies(struct timespec *val);

    void jiffies_to_timespec(unsigned long jiffies, struct timespec *val);


    unsigned long timeval_to_jiffies(struct timeval *val);

    void jiffies_to_timeval(unsigned long jiffies, struct timeval *val);


    unsigned int jiffies_to_msecs(const unsigned long j);

    unsigned int msecs_to_usec(const unsigned long j);

    unsigned long msecs_to_jiffies(const unsigned int m);

    un long usecs_to_jiffies(const unsigned int u);

    ```


    where the timeval and timespec structures should be familiar from user-space:


    ```

    struct timeval {

    long tv_sec;      /* seconds *//

    long tv_usec;    /* microseconds *//

    };


    struct timespec {

    long tv_sec;      /* seconds *//

    long tv_nsec;    /* nanoseconds *//

    };

    ```'
