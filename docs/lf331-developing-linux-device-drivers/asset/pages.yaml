  md: '# 6.4. PROCESS CONTEXT


    # 6.4 Process Context


    +   - When the kernel executes code it has full kernel privileges, and is obviously
    in kernel mode. However, there are distinct contexts it can be in.


    +   - In process context the kernel is executing code on behalf of a process.
    Most likely, a system call has invoked and caused entry into the kernel, at one
    of a finite number of entry points. Examples would be:


    +   - An application (or daemon) has issued a read() or write() request, either
    on a special device file, such as a serial port, or on a normal file residing
    on hardware to which the kernel has access to.


    +   - A request for memory has been made from user-space. Once again only the
    kernel can handle such a request.


    +   - A user process has made a system call like getpriority() to examine, or
    set, its priority, or getpid() to find out its process ID.


    +   - When in process context, the kernel is not working on behalf of any particular
    user process. Examples would be:


    +   - The kernel is servicing an interrupt. To do so arrive on an IRQ line, in
    response to data arriving or being ready to send. A mouse click generates three
    or four interrupts. It is up to the kernel to decide what process may desire the
    data and it may have to wake it up to process the data.


    +   - The kernel is executing a task that has been scheduled to run at either
    a specific time or by convenience. Such a function may be queued through a kernel
    timer, a tasklet or another kind of softirq.


    +   - The kernel is initializing, shutting down, or running the scheduler.


    +   - At such times the process context is not defined; although references to
    the current task_struct may not yield obvious errors, they are meaningless. Sometimes
    this situation is called interrupt context, as we have seen it even when interrupts
    are involved


    +   - The kernel context has a lighter weight than that of a user process; swapping
    in and between kernel threads is significantly easier and faster than for full
    process contexts


    +   - Linux also deploys so-called kernel processes, which are much like user
    processes but which are run directly by the kernel.


    +   - Such pseudo-processes are used to manage threads, as the ones maintaining
    the buffer and page caches, which have to synchronize the contents of files on
    disk with memory areas. Other examples are ksoftirqd and kjournald; do ps aux
    and look at processes whose names are surrounded by square brackets.


    +   - These processes are executed like normal processes and are allowed to sleep.
    However, they do not have a true process context and thus cannot transfer data
    back and forth with user-space. In fact they all share the same memory space and
    switching between them is relatively fast.


    +   - You can examine what context any of these macros you are in with:


    ```

    in_irq();              /* in hardware interrupt context */

    in_softirq();          /* in software interrupt context (bh)* */

    in_interrupt();        /* in either hard/soft irq context *

    in_atomic();           /* in preemption-disabled context */

    ```


    +   - Sleeping is disabled if any of these macros evaluate as true.'
  merge: -1
