    ```

    int test_bit(int nr, volatile unsigned long *addr);

    int test_and_set_bit(int nr, volatile unsigned long *addr);

    int test_and_clear_bit(int nr, volatile unsigned long *addr);

    int test_and_change_bit(int nr, volatile unsigned long *addr);

    ```


    ```

    long find_first_zero_bit(const unsigned long *addr, unsigned long size);

    long find_next_zero_bit(const unsigned long *addr, unsigned long size, unsigned
    long offset);

    long find_first_bit(const unsigned long *addr, unsigned long size);

    ```


    ```

    unsigned long fff(unsigned long word);

    unsigned long ffs(int x);

    unsigned long fls(int x);

    ```


    +   - In these functions the type of nr depends on the architecture; for 32-bit
    x86 and ARM it is just an

    integer, while the alpha is an unsigned long. The second argument to the variable
    in

    which bits are going to be examined or modified. It''s types vary among architectures,
    usually

    volatile long.


    +   - The functions give the previous bit value as their return value.


    +   - Note that ff(), ffs() and fls() find the first zero bit, first set bit and
    last set bit in a word (integer),

    while the functions find_first_zero_bit(), find_next_zero_bit() and find_first_bit()
    work on

    a mask of variable length.


    +   - There also exists a set of non-atomic bits, which differ from the above
    by prefixed with

    __;set_bit(). These can be used when locks are already taken and integrity is
    assured, and

    are somewhat far faster than the atomic versions.'
