- pgno: 112
  md: "# 10.2. INSERTING DELAYS\n\n![](img/134c18b05ee9bbbe93ba3f4335720ac1_112_0.png)\n\
    \n+   - The use of jiffies is gradually becoming less and less with the view that\
    \ time is better expressed in actual time units such as seconds, milliseconds,\
    \ nanoseconds, etc.\n\n# 10.2 Inserting Delays\n\n+   - While jiffies can be used\
    \ to introduce busy waiting, e.g.,\n\n```\n#include <linux/sched.h>\n\njiffone\
    \ = jiffies + delay * HZ;\nwhile ( time_before(jiffies,jiffone) )\n{\n    /* do\
    \ nothing */\n}\n```\n\nthis is an idiomatic thing to do; because jiffies is volatile,\
    \ it is reread every time it is accessed. Thus this loop locks the CPU during\
    \ the delay (except that interrupts may be serviced).\n\n+   - For short delays,\
    \ one can use the following functions:\n\n```\n#include <linux/delay.h>\n```\n\
    \n```\nvoid ndlay(unsigned long nanoseconds);\nvoid udelay(unsigned long microseconds);\n\
    void mdelay(unsigned long milliseconds);\n```\n\nOne should not expect true nanosecond\
    \ resolution for ndlay(); depending on the hardware it will probably be closer\
    \ to microseconds.\n\n+   - Another delaying method which does not involve busy\
    \ waiting is to use the functions:\n\n```\nvoid msleep(unsigned int milliseconds);\n\
    unsigned long msleep_interruptible(unsigned int milliseconds);\n```\n\nIf msleep_interruptible()\
    \ returns before the sleep has finished (because of a signal) it returns the number\
    \ of milliseconds left in the requested sleep period."
  merge: -1
  img_proc: true
- pgno: 113
  md: "# 10.3 What are Dynamic Timers?\n\n+   - Dynamic timers (also known as kernel\
    \ timers) are used to delay a function's execution until a specified time interval\
    \ has elapsed. The function will be run on the CPU on which it is submitted.\n\
    \n+   - Because a CPU may not be immediately available when it is time to execute\
    \ the function, you are guaranteed only that the function will not run before\
    \ the timer expires; practically this means it should occur at most a clock tick\
    \ afterwards, unless some greedy high latency task greedies interrupts.\n\n+ \
    \  - While an explicit periodic scheduling function does not exist, it is trivial\
    \ to make a timer function re-install itself recursively.\n\n+   - The function\
    \ will not run in a process context; it will run as a softirq in an atomic context.\
    \ Thus one cannot do anything that cannot be done at interrupt time; i.e., no\
    \ transfer of data and forth with user-space, no memory allocation with GFP_KERNEL,\
    \ no use of semaphores, etc., as these methods go to sleep.\n\n# 10.4 Timer Functions\n\
    \n+   - The important data structure and functions used by kernel timers are:\n\
    \n```\n#include <linux/timer.h>\n\nstruct timer_list {\n    struct list_head entry;\n\
    \    unsigned long expires;\n    void (*function)(unsigned long);\n    unsigned\
    \ long data;\n    struct twec_t_base_s *base;\n};\n\nvoid init_timer(struct timer_list\
    \ *timer)\nvoid add_timer(struct timer_list *timer)\nvoid mod_timer(struct timer_list\
    \ *timer, unsigned long expires)\nint del_timer(struct timer_list *timer)\nint\
    \ del_timer_sync(struct timer_list *timer)\n```\n\n+   - In this entry points\
    \ to the doubly-linked circular list of kernel timers; it should not be touched\
    \ directly. The expires field measured in jiffies and is an absolute value, not\
    \ a relative one. The function to be run is passed as function() and data can\
    \ be passed to it through the pointer argument data.\n\n+   - The init_timer()\
    \ zeroes the previous and next pointers in the list before a timer is queued.\n\
    \n+   - The add_timer() inserts the timer into the global timer list; The mod_timer()\
    \ function can be used to reset the time at which a timer expires.\n\n+   - del_timer()\
    \ can remove a timer before it expires. It returns 1 if it deletes it, or 0 if\
    \ it's too late because the timer function has already started executing. It is\
    \ not necessary to call del_timer() if the timer expires on its own.\n\n+   -\
    \ del_timer_sync() makes sure that upon return the timer function is not running\
    \ on another CPU, and avoids race conditions and is usually preferable."
