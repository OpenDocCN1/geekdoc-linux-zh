  md: '# 5.3 Reserving Major/Minor Numbers


    +   - Adding a new driver to the system (i.e., registering it) assigning a major
    number to it, usually during the device''s initialization routine. For a character
    driver one calls:


    ```

    #include <linux/fs.h>


    int register_chdev_region(dev_t first, unsigned int count, char *name);

    ```


    where first is the first device being requested, of a range of count contiguous
    numbers; usually the minor number part of first would be 0, but that is not required.


    +   - the name is the device name, as it will appear when examining /proc/devices.
    Note it is not the same as the node name in /dev that your driver will use. (The
    kernel decides which driver to invoke based on the major/minor number combination,
    not the name.)


    +   - A return value of 0 indicates success; negative values indicate failure
    and the requested region of device numbers will not be available. Note that mknod
    will still have to run to create the appropriate device node(s).


    +   - It is important when undoing the registration to the association with device
    numbers, once they are no longer needed. This is most done in the device cleanup
    function with:


    Note that this will not remove the node itself.


    +   - If you fail to unregister a device, you''ll get a segmentation fault the
    next time you do /proc/devices. It is pretty hard (although not impossible) to
    recover from this kind of error without a system reboot.'
