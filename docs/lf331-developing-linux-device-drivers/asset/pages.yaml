    \ since tasklets run as software interrupts they have higher priority than any\
    \ other task on the system, and thus can produce uncontrolled latencies in other\
    \ tasks if they are coded poorly.\n\n+   - The idea is to replace almost all tasklet\
    \ with workqueues, which run in a sleepable pseudo-user context, and get scheduled\
    \ like other tasks. A proof of concept implementation in all tasklets were converted\
    \ to work queues with a wrapper did not cause terrible problems.\n\n+   - However,\
    \ there were developers who were very unhappy with the proposed changes, in particular\
    \ those who work on network device drivers. In this case testing becomes very\
    \ laborious.\n\n+   - If history is guide the most likely outcome is that the\
    \ use of tasklets will gradually diminish in that they will be deprecated in new\
