  md: '# 16.2. PUT(GET)_USER() AND COPY_TO(FROM) USER()


    +   - These functions are the only place in the kernel where page faults are resolved
    as they are in user-space, by demand paging or segmentation faults according to
    whether or not they are legal.

    - This occurs only on pages for the user-space pointer; the kernel never swaps
    out pages for its own use and always allocates them with urgency and thus never
    has demand faulting for kernel memory.


    # access_ok()


    +   - type is VERIFY_READ or VERIFY_WRITE depending on what you want to do in
    user-space. For both use VERIFY_WRITE

    - addr is the address to be checked.

    - size is a byte count.

    - Is called by the most of the following functions; thus rarely needs to be called
    directly.

    - Returns 1 (true) if current process is allowed access; 0 on failure.


    # get_user()


    +   - Transfers data from user space to kernel space.

    - Assigns to 1value data retrieved from the pointer ptr.

    - Is implemented as a macro, which depends on the type of ptr.

    - Calls access_ok() internally.

    - Retrieves a single value.

    - Returns 0 for success, -EFAULT otherwise.


    # _get_user()


    +   - Same as get_user() but doesn''t call access_ok(). Use when safety is already
    assured.


    # put_user(), _put_user()


    +   - Transfers data from kernel space to user space.

    - Same as the get_user() functions, except the direction is reversed; Writes expr
    data to user space at ptr.'
