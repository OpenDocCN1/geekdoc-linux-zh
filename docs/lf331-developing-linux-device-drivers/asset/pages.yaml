  md: '# Chapter 17


    # Sleeping and Wait Queues


    We''ll discuss wait queues. We''ll consider how tasks can be put to sleep, and
    how they can be woken up. We''ll also consider the poll() entry point.


    +   17.1 What are Wait Queues? ............................................................
    163

    17.2 Going to Sleep and Waking Up ................................................
    164

    17.3 Going to Sleep Details ........................................................
    166

    17.4 Exclusive Sleeping ...................................................................
    167

    17.5 Waking Up Details ...................................................................
    168

    17.6 Polling .......................................................................................
    169

    17.7 Labs .............................................................................................
    171


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_178_0.png)


    # 17.1 What are Wait Queues?


    +   * Wait queues are used when a task running in kernel mode has reached a condition
    where it needs to wait for some condition to be fulfilled. For instance it may
    need to wait for data to arrive on a peripheral device.


    +   * At some times it is necessary for the task to sleep until whatever condition
    or resource it is waiting for. When the resource becomes available, or the condition
    becomes true (perhaps signalled by the arrival of an interrupt) it will become
    necessary to wake up the sleeping task.


    +   * There can be many wait queues in the system and they are connected in a
    linked list. In addition more than one task can be placed on a given wait queue.


    +   * Another way to understand wait queues is to think of task organization and
    queues. There is a linked list of all tasks that have TASK_RUNNING in state field
    of their task_struct, called the runnable. A task which is scheduled out but would
    like to run as soon as a timeslice is available is not sleeping; it has TASK_RUNNING
    as its state.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# CHAPTER 17. SLEEPING AND WAIT QUEUES


    Sleeping tasks (those with a state of TASK_INTERRUPTIBLE, TASK_UNINTERRUPTIBLE,
    or TASK_KILLABLE) go into one of many possible wait queues, each of which corresponds
    to getting woken by a particular event or class of events, at which the sleeping
    task can go back to runqueue.


    The sleeping and waking functions come in two forms, interruptible and uninterruptible.
    Uninterruptible drivers are not woken by a signal and as such should be rarely
    used, especially in device drivers. It is difficult to get out of a task hung
    in this situation; short of a reboot may be the only way to cause a wake up to
    be terminated by an ancestor process.


    The TASK_KILLABLE state is woken up only a fatal signal (while TASK_INTERRUPTIBLE
    wakes up with any signal). It was introduced in the 2.6.25 kernel.


    When a queue is woken, all tasks on the wait queue are roused (unless an exclusive
    sleep is used, as we shall see.).


    It is very easy to have a system with improper use of wait queues. In particular,
    kernel threads of execution as interrupt service routines should never go to sleep.


    The data structure used by wait queues is of the type wait_queue_head_t, usually
    just a wait queue. It is explicitly declared and initialized with the statements


    ```

    #include <linux/sched.h>


    wait_queue_head_t wq;

    init_wait_queue(&wq);

    ```


    If the wait queue is not allocated at run time it can be declared and initialized
    with the macro


    ```

    DECLARE_WAIT_QUEUE_HEAD(wq);

    ```


    Don''t forget to initialize a wait queue.


    # 17.2 Going to Sleep and Waking Up


    Now that we have set up a wait queue, we need functions for putting a task to
    sleep and for waking it up. These are


    ```

    #include <linux/wait.h>


    wait_event               (wait_queue_head_t wq, int condition)

    wait_event_interruptible  (wait_queue_head_t wq, int condition)

    wait_event_killable      (wait_queue_head_t wq, int condition);

    ```


    ```

    void wake_up               (wait_queue_head_t *wq);

    void wake_up_interruptible  (wait_queue_head_t *wq);

    ```


    The wait_event() calls are actually macros, not functions. They take wq, not *wq,
    as their argument.


    The proper wake call should be paired with the original signal call. (However,
    wait_event_killable() should be paired with wake_up(), which isn''t obvious.)


    In general you will use the interruptible wait functions which return 0 if they
    return due to a wake up call and -ERESTARTSYS if they return due to a signal arrival.
    The other forms are not aborted by a signal and are only used by critical sections
    of the kernel, as while waiting for a swap page to be read from disk.'
  merge: -1
  img_proc: true
- pgno: 180
  md: "# 17.2 GOING TO SLEEP AND WAKING UP\n\n+   - When you signal the interruptible\
    \ forms, you'll always have to check upon awakening whether you woke up because\
    \ a signal arrived, or there was an explicit wake up call. The signal_pending(current)\
    \ macro can be used for this purpose.\n\n+   - The condition test has two important\
    \ purposes:\n\n+   - It avoids the race condition in which a task is designated\
    \ to sleep but the wake up call arrives before the change in state is complete;\
    \ the condition is checked before putting the task to sleep. The condition is\
    \ checked upon waking up and if not the task remains asleep. This helps avoid\
    \ another class of race conditions where a task is put to sleep again before it\
    \ has a chance to wake up.\n\n+   - You will have to call one of the wake_up functions\
    \ using these macros; you do not just set a spinning loop until the argument in\
    \ evaluation evaluates as true (non-zero).\n\n+   - Sometimes we want to ensure\
    \ you don't sleep with a timeout. For this purpose one can use:\n\n```\nwait_event_timeout(wait_queue_head_t\
    \ q, int condition, long timeout);\nwait_event_interruptible(wait_queue_head_t\
    \ q, int condition, long timeout);\n```\n\nwhere the timeout is specified in jiffies.\
    \ If the task returns upon timeout, these functions return 0. If they return early,\
    \ they return the remaining jiffies in the timeout period. If the interruptible\
    \ returns due to a signal, it returns -ERESTARTSYS.\n\n+   - The waking functions\
    \ will run all sleepers on the specified wait queue. There is no guarantee about\
    \ the order in which they will be woken by priority algorithms rather FIFO or\
    \ LIFO. Furthermore, the tasks can be woken up on any CPU. A little more control\
    \ can be obtained with the function:\n\n```\nwake_up_interruptible_sync(wait_queue_head_t\
    \ q);\n```\n\nwhich checks whether the task woken up has a higher priority than\
    \ the currently running one, and if so, invokes the scheduler if possible. However,\
    \ this is rarely done.\n\n+   - Thus a simple use of wait queues would include\
    \ a code fragment like:\n\n```\n#include <linux/sched.h>\nDECLARE_WAIT_QUEUE(wq)\n\
    static int fun1 ( ... ))\n{\n    printk(KERN_INFO, \"task %i (%s) going to sleep\\\
    n\", current->pid, current->comm);\n    wait_event_interruptible(wq, dataready);\n\
    \    printk(KERN_INFO, \"task %i (%s) woken\\n\", current->pid, current->comm);\n\
    \    if (signal_pending(current))\n        return -ERESTARTSYS;\n\n    dataready\
    \ = 0;\n}\n\nstatic int fun2 ( ... ))\n{\n    printk(KERN_INFO, \"task %i (%s)\
    \ awakening sleepers...\\n\", current->pid, current->comm);\n    dataready = 1;\n\
    \    wake_up_interruptible(&wq);\n}\n```\n\n(The variable dataready should probably\
    \ be an atomic one, or protected by some kind of lock.)"
  merge: -1
  img_proc: true
