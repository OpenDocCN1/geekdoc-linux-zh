  md: '# 18.6 THREADED INTERRUPT HANDLERS


    +   - The created thread will run threadfn(data), which will use namefmt and any
    succeeding arguments to create its name as it will appear with the ps command.


    +   - The function kthread_create() initializes the process in a sleeping state;
    usually one want to use the kthread_run() macro which follows this with a call
    to


    ```

    int wake_up_process(struct task_struct *task);

    ```


    +   - However, one might want to call kthread_bind() first, which will bind the
    thread to a particular cpu.


    +   - Terminating the thread is done with kthread_stop(). This sets kthread_should_stop(),
    wakes the thread and waits for it to exit.


    +   - For example one might execute a loop such as:


    ```

    do { ... while (!kthread_should_stop()); }

    ```


    where the loop will probably include sleeping, and issue a call to kthread_stop()
    from an exit runtime.


    +   - Kernel threads can only be created from process context as their implementation
    can block while waiting for resources. Calling from atomic context will lead to
    a kernel crash.


    | An older function |

    | int kernel_thread(int (*fn)(void), void *arg, unsigned long flags); |


    is still used in many places in the kernel. It is more complicated to use and
    requires more work to accomplish successful termination. It should not be used
    in new code.


    # 18.6 Threaded Interrupt Handlers


    +   - The 2.6.30 kernel introduced a new method of writing interrupt handlers
    in which the bottom half is taken by a scheduled thread. This feature arose in
    the realtime kernel tree and surprisingly has its goal reducing latencies and
    the amount of time interrupts to be disabled.


    +   - The API is only slightly different than that used in the normal interrupt
    handler; an IRQ is requested with the function:


    ```

    request_threaded_irq(unsigned int irq, irq_handler_t handler,

    irq_handler_t thread_fn, unsigned long flags, const char *name, void *dev);

    ```


    the new aspect being the third argument, thread_fn is essentially a bottom half.
    There is also a new return value for the top half, IRQ_WAKE_THREAD, that should
    be used when the threaded bottom half is being used.


    +   - Thus the top half is called in a hard interrupt context, and must first
    check whether the interrupt originated in its device. If not it returns IRQ_NONE;
    otherwise returns IRQ_HANDLED if no further processing is required, or IRQ_WAKE_THREAD
    if the thread function needs to be invoked.'
