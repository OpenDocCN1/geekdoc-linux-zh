  md: "# 5.10. MISCELLANEOUS CHARACTER DRIVERS\n\nTable 5.6: inode structure elements\n\
    \n| Field | Meaning |\n|---|--|\n| dev_t i_rdev | Contains the actual device number\
    \ from the major and minor numbers can be extracted. |\n| dev_t i_cdev | Points\
    \ back to the basic character driver structure. |\n\n# 5.10 Miscellaneous Character\
    \ Drivers\n\n+   - For most simple character drivers it makes more sense to take\
    \ advantage of the misc (for miscellaneous) character driver API which takes fewer\
    \ lines of code and automatically interfaces with the udev system to create device\
    \ nodes on the fly. Inventing your own class is rendered unnecessary.\n\n+   -\
    \ All misc drivers share the same major number (10) and can either request a specific\
    \ minor number, or have one generated dynamically. The registration and de-registration\
    \ functions, and the relevant data structure are defined in /usr/src/include/linux/linux/miscdevice.h.\n\
    \n```\n#include <linux/miscdevice.h>\n\nint misc_register(struct miscdevice *misc);\n\
    int misc_deregister(struct miscdevice *misc);\n\nstruct miscdevice {\n\tint minor;\n\
    \tconst char *name;\n\tconst struct file_operations *fops;\n\tstruct list_head\
    \ list;\n\t device *parent;\n\t device *this_device;\n\tconst char *modename;\n\
    \tmode_t mode;\n};\n```\n\n+   - One fills in the miscdevice structure and then\
    \ calls the registration function when the device is loaded and the de-registration\
    \ function when it is unloaded. Both of these functions return 0 on success or\
    \ error codes on failure.\n\n+   - Normally only three fields in the miscdevice\
    \ structure are filled in as:\n\n```\nstatic struct miscdevice my_misc_device\
    \ = {\n\t.minor = MISC_DYNAMIC_MINOR,\n\t.name = MYDEV_NAME,\n\t.fops = kmycydrv_fops,\n\
    };\n```\n\nwhere by using MISC_DYNAMIC_MINOR we are asking the kernel to assign\
    \ us a minor number, the name field gives us device node name (which will appear\
    \ under the /dev directory) and fops is our usual table.\n\n+   - This is all\
    \ lot easier than filling out a full character driver."
