    # 5.6 udev and HAL


    +   * The methods of managing device nodes became clumsy and difficult as Linux
    evolved. The number of device nodes lying in /dev and its subdirectories reached
    the 15,000 - 20,000 range in most installations using the 2.4 kernel series. Nodes
    for all kinds of devices which would never be used on most installations were
    still created by default, as distributors could never be sure exactly which management
    was needed.


    +   * Of many developers and system administrators trimmed the list to what was
    actually needed, especially in embedded configurations, but this was essentially
    a manual and potentially error-prone task.


    +   * Note that device nodes are not normal files and don''t take up significant
    space on the filesystem, having huge directories slow down access to device nodes,
    especially upon first usage. Furthermore, exhaustion of available major and minor
    numbers required a more modern and dynamic approach to the creation and management
    of device nodes.


    +   * Ideally one would like to register devices by name. however, major and minor
    numbers cannot be gotten rid of altogether, as Posix requires them.


    +   * The udev method creates device nodes on the fly as they are. There is no
    need to maintain a count of device nodes that will never be used: The udev stands
    for user, and that most of the work of creating, removing, and modifying nodes
    is in user-space.


    +   * udev handles the dynamical generation of device nodes but it does not handle
    the discovery of devices or management of them. The Hardware Abstraction Layer,
    or HAL, which is a project of freedktop (http://www.freedesktop.org/wiki/hal).


    +   * HAL uses the D-BUS (device) bus infrastructure, as provided by the HAL daemon
    (haldaemon). It maintains a database of all connected hardware devices and is
    closely coupled to the hotplug facility. The command is will dump all the information
    that HAL currently has in its database. There are a number of configuration files
    on the system (in /usr/share/hal and /etc/hal) which control behaviour and set
    exceptions.


    +   * As devices are added or removed from the system, with the hotplug subsystem,
    udev acts upon notification of events to create and remove device nodes. The information
    necessary to create them with the right names, major and minor numbers, permissions,
    etc., are gathered by examination of information already registered in the sysfs
    pseudo-filesystem (mounted at /sys) and a set of configuration files.'
