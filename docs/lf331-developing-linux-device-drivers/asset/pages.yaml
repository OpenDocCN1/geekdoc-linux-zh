    # 18.1 Top and Bottom Halves


    +   * Efficient interrupt handlers often have top halves and bottom halves.

    * In the top half, the driver does what must be done as quickly as possible. This
    may just mean acknowledging the interrupt and getting some data off a device and
    into a buffer.

    * Technically speaking the top half is the interrupt handler. A typical half:


    +   - Checks to make sure the interrupt was generated by the right hardware; this
    is necessary for interrupt sharing.'
