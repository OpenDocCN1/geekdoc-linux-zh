    \ other filesystem, which means standard reading and writing tools can be used.\n\
    \n+   - One can also use sysfs for the same purposes. However, sysfs is intended\
    \ for information used in system administration, and is also meant to be used\
    \ in a coherent way on the system's device tree as mapped out the system buses.\n\
    \n+   - The code for debugfs was developed mainly by Greg Kroah-Hartman. The functions\
    \ used are:\n\n```\n#include <linux/fs.h>\n#include <linux/debugfs.h>\n\nstruct\
    \ *debugfs_create_dir(const char *name, struct directory *parent)\nstruct *debugfs_create_file(const\
    \ char *name, mode_t mode, struct directory *parent,\n    void *data, const struct\
    \ file_operations *fops);\nvoid debugfs_remove(struct entry *entry);\n```"
