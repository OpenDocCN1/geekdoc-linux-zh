- pgno: 219
  md: '• A PCI device may be of many different kinds, such as a network, character,
    or block device. In addition to registering as a PCI device, it will also have
    to register as the particular kind of device it is.


    • This is normally done in the probe() callback function, where one would call
    functions such as register_netdev(), and etc.


    • Likewise, the shutdown() callback function would deregister the device with
    functions such as unregister_netdev().


    # 20.3 Locating PCI Devices


    The header file /usr/src/linux/include/pci.h defines symbolic names for numeric
    values used by PCI functions, for region locations and values. The header file
    /usr/src/linux/include/linux/pci_ids has device and vendor specific definitions
    and is included from pci.h.


    The basic structure describing PCI device is of the type pci_dev defined in /usr/src/linux/include/linux/pci.h.
    This is a long structure and we don''t need to get into the details here.


    Locating devices can be done with:


    ```

    #include <linux/pci.h>


    struct pci_dev *pci_get_device(unsigned int vendor, unsigned int device,

    struct pci_dev *from);

    struct pci_dev *pci_get_dev_reverse(unsigned int vendor, unsigned int device,

    struct pci_dev *from);

    struct pci_dev *pci_get_dev_class(unsigned int class, struct pci_dev *from);

    ```


    and some other functions


    The function pci_get_device() requests information about the device. If vendor/or
    device is specified as PCI_ANY_ID-1, all devices are matched. Before initializing
    a chain of devices, the value of from should be set to NULL. These functions are
    often called in a loop. If from is set to NULL at the beginning, it will return
    NULL at the end.


    If the return value of these functions is not NULL, the data structure describing
    the device is returned, and the reference count for the device is incremented.
    When the device is released (say on module unloading) one must call the function:


    ```

    void pci_dev_put(struct pci_dev *dev);

    ```


    to decrement reference count; otherwise it can''t be removed from the system if
    it is hotpluggable.


    Remember that after finding the device, before you do anything with it, you need
    to call the function pci_enable_device(struct pci_dev *dev) in order to enable
    it.'
  merge: -1
  img_proc: true
- pgno: 220
  md: "# 20.4. ACCESSING CONFIGURATION SPACE\n\n# Example:\n\n+   * To locate and\
    \ enable one particular device:\n\n#include <linux/pci.h>\n\nstruct pci_dev *pdev\
    \ = NULL;\n\nif (!pci_get_device(PCI_VENDOR_ID_INTERG, PCI_DEVICE_ID_INTERG_1682,\
    \ &pdev))\n    return -ENODEV;\npci_enable_device(pdev);\n* If desired, the function\n\
    ```\nchar *pci_name(struct pci_dev *pdev)\n```\ncan be called to get the bus,\
    \ device and function numbers. It doesn't do this by probing hardware, instead\
    \ by traversing the known list of present devices.\n* One can also use the marco:\n\
    ```\nstruct pci_dev *pdev;\nfor_each_pci_dev(pdev) { ... }\n```\nto step through\
    \ all PCI devices.\n\n# 20.4 Accessing Configuration Space\n\n+   * The configuration\
    \ space can be accessed through 8-bit, 16-bit, or 32-bit data transfers.\n\nint\
    \ pci_read_config_byte(struct pci_dev *dev, u8 where, u8 *val);\nint pci_read_config_word(struct\
    \ pci_dev *dev, u8 where, u16 *val);\nint pci_read_config_dword(struct pci_dev\
    \ *dev, u8 where, u32 *val);\nint pci_write_config_byte(struct pci_dev *dev, u8\
    \ where, u8 *val);\nint pci_write_config_word(struct pci_dev *dev, u8 where, u16\
    \ *val);\nint pci_write_config_dword(struct pci_dev *dev, u8 where, u32 *val);\n\
    * These functions read from or write to, to, or from the configuration space of\
    \ the device, identified by dev. The offset from the beginning of the configuration\
    \ space is given by where.\n* Note the use of the types u8, u16, u32, u64. These\
    \ are kernel unsigned types to be used when you must be exactly of the length\
    \ in bits. (There are signed types, s8, s16, s32, s64 which are rarely used).\
    \ You can also use these from user-space as long as you prefix them with a double\
    \ underscore (e.g., _u32) and include linux/types.h.\n* Multi-byte entries in\
    \ the configuration registers are in little-endian, according to the PCI standard,\
    \ which is the convention on x86 platforms. The above data types and functions\
    \ handle any byte ordering to be done transparently, when one is on a system like\
    \ the SPARC, which is big-endian, so you don't have to worry about bit order.\
    \ You should be aware of it. Byte ordering taking care of word and dwarf functions\
    \ (Note some architectures, such as alpha and IA64 are actually bi-endian and\
    \ can be configured either).\n* Configuration variables are accessed using the\
    \ symbolic names defined in /usr/src/linux/include/linux/pci.regs.h, or\npci_read_config_byte(dev,\
    \ PCI_REVISION_ID, &revision);\n* It is also possible to use the setpci utility\
    \ to get set values in the configuration register."
  merge: -1
  img_proc: true
- pgno: 221
  md: "# 20.5 Accessing I/O and Memory Spaces\n\n+   * As mentioned, one will have\
    \ access not only the configuration registers, but also I/O ports and memory regions\
    \ associated with PCI devices. While it is possible to go hunting for these resources\
    \ in the configuration registers, it is easier to use the generic resource management\
    \ functions provided by the kernel.\n\n+   * The relevant functions are:\n\n```\n\
    unsigned long pci_resource_start (struct pci_dev *, int bar);\nunsigned long pci_resource_end\
    \ (struct pci_dev *, int bar);\nunsigned long pci_resource_len (struct pci_dev\
    \ *, int bar);\nunsigned long pci_resource_flags (struct pci_dev *, int bar);\n\
    ```\n\nin which bar stands for Base Address Register.\n\n+   * The first two functions\
    \ return the starting and ending address of one of up to the 6 I/O regions that\
    \ can be found on the device, the parameter bar thus ranges from 0 to 5 and selects\
    \ which one is requested.\n\n+   * The last function returns the flags associated\
    \ with the device, which are defined in /usr/src/linux/include/ioport.h.\n\n+\
    \   * Here's an example of using /usr/src/linux/drivers/net/8139tooc.c:\n\n```\n\
    3.1: 741 static __devint struct net_device *rt8139_init_board(struct pci_dev *pdev)\n\
    3.1: 742 {\n3.1: 767\n\trc = pci_enable_device(pdev);\n3.1: 768\n\tif (rc)\n3.1:\
    \ 769\n\tgotoerr = out_resource;\n3.1: 770\n3.1: 771\n\tmmio_start = pci_resource_start(pdev,\
    \ 0);\n3.1: 772\n\tmio_end = pci_resource_end(pdev, 0);\n3.1: 773\n\tmio_flags\
    \ = pci_resource_flags(pdev, 0);\n3.1: 774\n\tmio_len = pci_resource_len(pdev,\
    \ 0);\n3.1: 775\n3.1: 776\n\tmmio_start = pci_resource_start(pdev, 1);\n3.1: 777\n\
    \tmio_end = pci_resource_end(pdev, 1);\n3.1: 778\n\tmio_flags = pci_resource_flags(pdev,\
    \ 1);\n3.1: 779\n\tmio_len = pci_resource_len(pdev, 1);\n```\n\n# 20.6 PCI Express\n\
    \n+   * PCI was introduced in 1991 and despite some enhancements such as PCI-X,\
    \ it has shown its age. In particular, its bandwidth is limited to 133 MB/s. Furthermore\
    \ this bandwidth is shared among all the devices on the bus, and competition for\
    \ it must be negotiated.\n\n+   * In 1997 a separate AGP (Accelerated Graphics\
    \ Port) was added with its own dedicated bandwidth. But AGP has disappeared in\
    \ new motherboards.\n\n+   * PCI Express (usually denoted as PCIe) was introduced\
    \ in 2004 and is gradually taking over. Its main quality is that it is a point-to-point\
    \ connection; bandwidth is not shared, communication is direct via a switch that\
    \ directs data flow. Furthermore, hot plugging devices is easier, and less power\
    \ is consumed for PCI."
  merge: -1
  img_proc: true
- pgno: 222
  md: '# 20.7. LABS


    +   * Each device communicates through a number of serial lanes each of which
    is bi-directional and has a 250 MB/s rate in each direction for a possible 500
    MB/s total data transfer rate.


    +   * The number of lanes depends on the kind of sort; there are 1, 2, and 16
    lane slots available; the x16 slot, for example, can accommodate up to 8000 MB/s
    and is used by graphic cards. x32 and x64 lane cards and slots are also in the
    standard.


    +   * PCI card will fit and work correctly in any slot that is at least as large
    as it; e.g., you can put an x4 card in an x16 slot, it will just use fewer lanes.


    +   * Device drivers written for PCI will still work for PCIe as the standard
    was designed to cause as little disruption as possible.


    # 20.7 Labs


    Lab 1: PCI Utilities


    +   * The pciutils package (http://mj.ucw.cz/pciutils.html) contains the following
    utilities:


    +   - lspci displays information about PCI buses and connected devices, with many
    options.

    - setpci interrogate and configure properties of PCI devices.

    - update-pciids obtains the most recent copy of the PCI ID database and installs
    it on your system.


    +   * Run update-pciids to update your database. If it fails the URL you pointed
    to or obtaining it directly from http://pci-ids.ucw.cz/. The location of the down-loaded
    file (pci.ids) depends on your distribution, but will be somewhere under /usr/share.
    (Entering pci.ids will tell you.)


    +   * Get more basic information from lspci. You can get details from man lspci
    or lspci-help. For example, to use verbose information about all Intel devices
    on your system you could type lspci -vv -d 0806::*: for AMD devices, lspci -vd
    -d 01022*: Experiment with the -x(xx) options to get detailed dumps of the configuration
    registers.


    +   * Use setpci to evaluate or change specific values in the configuration register.
    If you could find the device identifier for all Intel devices on your system with
    setpci -vd -d 01022*: DEVICE_ID, where the -d option prevents actual changes from
    happening. See the man pages for examples of changing configuration register entries.


    Lab 2: PCI Devices


    +   * Write a module that scan your PCI devices, and gathers information about
    them.


    +   * For each device, read some information from its configuration register.
    (Make sure you read /usr/src/include/linux/pci.regs.h and /usr/src/include/linux/pci.ids.h
    to get symbolic names.) Fields you may wish to obtain could include: PCI_VENDOR_ID,
    PCI_DEVICE_ID, PCI_REVISION_ID, PCI_INTERRUPT_LINE, PCI_LATENCY_TIMER, PCI_COMMAND.


    +   * The information you obtain should agree with obtained from lspci.'
