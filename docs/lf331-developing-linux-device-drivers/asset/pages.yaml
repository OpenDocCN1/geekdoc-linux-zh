    which have the following meanings respectively:


    Table 3.3: printk logging levels


    | Value | Meaning |

    |--- |--- |

    | console_loglevel | Messages with a higher priority than this will be printed
    to the console. |

    | default_message_loglevel | Messages without an explicit priority will be printed
    with this priority. |

    | minimum_console_level | Minimum (highest) value to which the console.loglevel
    can be set. |

    | default_console_loglevel | Default value for console.loglevel.


    * Note that a higher priority means a lower level and processes can dynamically
    alter the console_loglevel; in a kernel fault it raises to 15.

    * Messages go into a circular buffer, with a default length of 128 KB which can
    be adjusted during kernel compilation. The messages can be viewed with the dmesg
    utility; the file /var/log/dmesg contains the buffer''s contents at system boot.

    * The default size of the buffer can be overwritten during system initialization,
    by setting the parameter log_len=n the kernel command line, where n must be a
    power of two.


    * Where messages depends on whether not syslog or klogd are running and how they
    are configured. If you cannot simply do cat /proc/kmesg. Generally they will go
    to /var/log/messages (on some recent Ubuntu systems they go to /var/log/syslog)
    but if you are running X they can''t see them. A good way to see them is to open
    a terminal, and in that type tail /var/log/messages. On a Gnome desktop you can
    access the messages by clicking on System->Administration->System Log or Applications->System
    Tools->Log File Viewer in your menus.


    * Ultimate control of kernel logging is in the hands of the daemons syslog and
    klogd. This can control all aspects of the behaviour, including default levels
    and message destinations, directed by source and severity. There is a manual page
    for syslog which also gives the C-language interface within the kernel.


    * You can alter the various log levels through parameters to syslog, and thus
    an easier method is to exploit the /proc/sys/kernel to write it. The command


    ```

    echo 8 > /proc/sys/kernel/printk

    ```'
