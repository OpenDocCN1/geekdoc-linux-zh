- pgno: 58
  md: '# 5.2 MAJOR MINOR NUMBERS


    +   - One can also use the inline convenience functions:


    ```

    unsigned iminor(struct inode inode); /* = MINOR(inode->i_rdev) */

    unsigned imajor(struct inode inode); /* = MAJOR(inode->i_rdev) */

    ```


    when one needs to work with inode structures.


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_58_0.png)


    +   - In the 2.4 kernel, device numbers were packed in the kdev_t type, which
    was limited to 16 effective bits, even divided between minor and major numbers,
    so each was limited to the range 0 - 255.


    +   - In the 2.4 kernel once a driver registered a major number, no other driver
    could be registered with the same major number, and all minor numbers belonged
    to the driver.


    +   - In the 2.6 kernel, however, one registers a range of minor numbers which
    can be less than all available, and indeed two concurrently loaded drivers can
    have the same major number, as long as they have distinct minor number ranges.


    +   A list of major and minor numbers pre-associated with devices can be found
    in /usr/src/linux/Documentation/devices.txt. (Note the major numbers 42, 120-127
    and 240-254 are reserved for local and experimental use.) Symbolic names for assigned
    major numbers can be found in /usr/src/linux/include/linux/major.h. Any further
    requesting of device number reservations is now prohibited, as more modern methods
    use dynamical allocation.


    +   Note that device numbers mean having in user-space as well; in fact Posix
    system calls as mkknod() and stat() have arguments with the dev_t type, utilize
    structures that do. For example:


    ```

    $ /boot/64/vmlinuz-2.6.35-rc3

    ```


    ```

    File: /boot/64/vmlinuz-2.6.35-rc3

    Size: 370593 Blocks: 7272 IO Block: 1024 regular file

    Device: 802h/2050d Inode: 1856 Links: 1

    Access: (0664/-rw-r--)Uid: (0/root) Gid: (0/root)

    Access: 2010-06-13 08:21:00.000000000 -0500

    Modify: 2010-06-13 08:21:00.000000000 -0500

    Change: 2010-06-13 08:21:00.000000000 -0500

    ```


    shows the file resides on the disk partition with major number 8 and minor number
    2 (/dev/sda2), which is listed at 802h (hexadecimal) and 2050d (decimal).'
