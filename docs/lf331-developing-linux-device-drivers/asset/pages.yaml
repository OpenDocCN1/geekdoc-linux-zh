    \ up to the full bandwidth, but they are sent in periodic polling. If the transfer\
    \ is interrupted, the host controller will repeat the request after a set interval.\n\
    \n+   * Isochronous transfers take up to the full bandwidth, but are not guaranteed\
    \ to be reliable. Multimedia devices, audio, video, use these.\n\n# 27.6 USB under\
    \ Linux\n\n+   * There are three layers in the USB stack under Linux:\n  - Host\
    \ Controller Driver (OHCI, UHCI, EHCI),\n  - USB Core.\n  - Device Drivers.\n\n\
    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_276_0.png)\n\n+   * The USB core has\
    \ APIs for both the controller drivers and the device drivers. It can be thought\
    \ of as a library of common routines that both the controller and the peripherals\
