- pgno: 44
  md: '# Chapter 4


    # Modules I: Basics


    We''ll begin our discussion of modularization techniques under Linux. We''ll define
    what a module is and describe the command level utilities used to manipulate them.
    We''ll discuss how to compile, load, and unload modules, how to pass parameters
    to them, and how they interact with hotplugging.


    | 4.1 | What is a Module? . . . . . . . . . . . . . . . . . | 29 |

    | 4.2 | A Trivial Example - Hello World . . . . . . . | 30 |

    | 4.3 | Module Utilities . . . . . . . . . . . . . . . . | 31 |

    | 4.4 | Passing Parameters . . . . . . . . . . . . . . . | 33 |

    | 4.5 | Compiling a Module . . . . . . . . . . . . . | 34 |

    | 4.6 | Modules and Hot Plug . . . . . . . . . . . | 38 |

    | 4.7 | Labs . . . . . . . . . . . . . . . . . . . . . | 39 |


    # 4.1 What is a Module?


    +   - A kernel module is a component that can be loaded into (and unloaded from)
    an already running kernel. It is a relocatable object file; i.e., it has a .ko
    extension. Once loaded a module has all the capabilities of any other part of
    the kernel.

    - To a rough approximation, a module uses the Linux kernel as a shared library,
    linking in it only through a list of symbols and functions which have been exported
    and thus made available to the module.

    - Modules may depend on other modules and thus the order of loading and unloading
    may need to be done carefully.

    - While many modules are device drivers, many others are not i.e., a device driver
    may be built-in to the kernel and a module may have nothing to do with any hardware
    device.'
  merge: -1
  img_proc: true
- pgno: 45
  md: "Many kernel components are designed so the choice of building them in or having\
    \ them linked as modules\nis a configuration option.\n\nFor the most part no changes\
    \ are required to the source to include the modular option, and it can\nspeed\
    \ up development leave it this even if a facility will almost always be built-in.\
    \ This permits\nthe testing of new features and enhancements by loading and unloading\
    \ modules, without a full kernel\nrecompilation and a reboot, leading to a great\
    \ savings in time.\n\nThe Linux kernel is still technically a monolithic one,\
    \ even when the use of modules is greatly deployed.\nThis term has to do with\
    \ basic architecture and whether or not there is a microkernel. When a module\n\
    is loaded it becomes part of the monolithic kernel.\n\n# A Trivial Example - Hello\
    \ World\n\nHere is an example of a very trivial module. It does nothing but print\
    \ a statement when it is loaded,\nand when it is unloaded.\n\n```\n#include <linux/module.h>\n\
    #include <linux/init.h>\n\nstatic int __init_my_init(void)\n{\n    printk(KERN_INFO\
    \ \"Hello: module loaded at 0x%p\\n\", my_init);\n    return 0;\n}\n\nstatic void\
    \ __exit_my_exit(void)\n{\n    printk(KERN_INFO \"Bye: module unloaded from 0x%p\\\
    n\", my_exit);\n}\n\nmodule_init(my_init);\nmodule_exit(my_exit);\n```\n\nAll\
    \ modules contain callback functions for initialization and cleanup, which are\
    \ specified with the\nmodule_init() and module_exit() macros. These callbacks\
    \ are automatically called when the module\nis loaded and unloaded. A module without\
    \ a cleanup function cannot be unloaded.\n\nIn addition, use of these macros simplifies\
    \ writing drivers (or other code) which can be used either as\nmodules, or directly\
    \ into the kernel. Labeling functions with the attributes __init or __exit is\
    \ a\nrefinement to be discussed later.\n\nAny module which does not contain an\
    \ open source license (as specified with the MODULE_LICENSE()\nmacro) will be\
    \ marked as tainted: it will function normally but kernel developers will be hostile\
    \ to\nhelping with any debugging.\n\nMODULE_AUTHOR(\"A GENIUS\")\nMODULE_LICENSE(\"\
    GPL v2\")"
  merge: -1
  img_proc: true
- pgno: 46
  md: "# 4.3. MODULE UTILITIES\n\n> You will still see modules with the outdated form:\n\
    \n#include <linux/module.h>\n\nint __init init_module(void)\n{\n    printk(KERN_INFO\
    \ \"Hello: init_module loaded at 0x%p\\n\", init_module);\n    return 0;\n}\n\\\
    void __exit cleanup_module(void)\n{\n    printk(KERN_INFO \"Bye: cleanup_module\
    \ loaded at 0x%p\\n\",\n    cleanup_module);\n}\n\nWhile direct use of the callback\
    \ functions (init_module() and cleanup_module()) will still work, using them without\
    \ employing the module_init() and module_exit() macros is deprecated.\n\nMany\
    \ drivers in the kernel will just use the init_module(), cleanup_module() functions;\
    \ it saves a few lines of code, especially for a driver that is always loaded\
    \ as a module. While this is basically harmless, eventually of this form will\
    \ be extinguished.\n\n# 4.3 Module Utilities\n\n+   • The following utilities\
    \ run in user-space and are part of the module-init-tools package. They are not\
    \ directly part of the kernel source. Each has a rather complete man page.\n\n\
    +   • The configuration file /etc/modprobe.conf (as well as any files in the directory\
    \ /etc/modprobe.d) is consulted frequently by the module utilities. Information\
    \ such as paths, aliases, options to be passed to modules, commands to be processed\
    \ whenever a module is loaded or unloaded, are specified therein. The possible\
    \ commands:\n\n```\nalias wildcard modulename\noptions modulename option ...\n\
    install modulename command ...\nremove modulename command ...\ninclude filename\n\
    ```\n\n+   • The install and remove commands can be used as substitutes for the\
    \ default insmod and rmmod commands."
  merge: -1
  img_proc: true
- pgno: 47
  md: '+   - All Linux distributions prescribe a methods for the automatic loading
    of particular modules for system startup. However, the use of udev in modern Linux
    distributions usually obviates such needs.


    +   - Red Hat-based systems the file /etc/rc.modules will be run (if it exists)
    out of /etc/rc.d/sysinit. In any file explicit module loading can be done through
    the full use of the module loading commands.


    +   - Debian-based systems any modules listed in /etc/modules will be loaded.
    (Only the names of the modules go in this file, not loading commands.) on GENTOO
    systems, the same role is played by the files in /etc/modules.autoload.d.


    +   - On SUSE-based systems the file that needs to be modified is /etc/sysconfig/kernel.


    # lsmod


    +   - lsmod gives a listing of all loaded modules. The information given includes
    name, size, use count, and a list of referring modules. The content is the same
    as that in /proc/modules.


    # insmod


    +   - insmod links a loadable module into the running kernel, resolving all symbols.
    The -f option will try to force loading with a version mismatch between kernel
    and module.


    +   - insmod can be used to load parameters into modules. For example,


    ```

    $ /sbin/insmod my_net_driver.ko irq=10

    ```


    # rmmod


    +   - rmmod unloads modules from the running kernel. A list of modules may be
    given as in:


    ```

    $ /sbin/rmmod my_net_driver my_char_driver

    ```


    Note no .ko extension is specified.


    # depmod


    +   - depmod creates a Makefile-like dependency file ( /lib/modules/KERNEL-VERSION-NUMBER
    /modules.dep) based on the symbols contained in the modules explicitly mentioned
    on the command line, or in the default place.


    +   - depmod is vital to the use of modprobe. It is always run during boot. Under
    most circumstances it should be run as


    ```

    $ depmod -ae

    ```'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# 4.4. PASSING PARAMETERS


    +   - For depmod and modprobe to find modules they must be prescribed in places,
    under /lib/modules.

    The file /etc/modprobe.conf is consulted every time a module is loaded or when
    depmod is run.


    +   - When modules are built in external directories and installed with the modules_install
    target, they are

    placed in the extra subdirectory.


    # modprobe


    +   - modprobe can load (or unload with the -r option) a stack of modules that
    depend on each other, and

    can be used instead of insmod.


    +   - It can also be used to try a list of modules, and quit whenever one is first
    found and successfully loaded.

    it is also heavily dependent on /etc/modprobe.conf.


    +   - Whenever there are new modules added, or there is a change in location depmod
    should be run.


    +   - The modutils package requires use of the .ko extension with insmod, but
    modprobe and rmmod

    require extension.


    +   - Parameters can be passed to modprobe in the same way they are passed to
    insmod; i.e., you can do

    some like


    ```

    /sbin/modprobe my_net_driver irq=10

    ```


    # 4.4 Passing Parameters


    +   - Parameters to be passed to modules must be explicitly marked as such and
    type checking is. For.

    example,


    ```

    int irq = 12;

    module_param(irq, int, 0);

    ```


    There are a number of macros which can be used:


    ```

    #include <linux/moduleparam.h>

    ```


    ```

    module_param(name, type, perm);

    module_param_named(name, value, type, perm);

    module_param_array(name, value, type, num, perm);

    module_param_string(name, string, len, perm);

    ```


    +   - In the basic module_param() the name is the variable type can be byte, short,
    ushort,

    int, uint, long, char, pool, involvol.

    - The perm parameter is a permissions mask which is used for an accompanying entry
    in the sysfs files-

    t. If you are not interested in sysfs, a value of 0 will suffice. Typically one
    can use the value S_IRGO

    (0444) for read permission for all users. (See /usr/src/linux/include/linux/stat.h
    for all possibili-

    A permission is given, the parameter may be alerted by writing to the sysfs filesystem

    entry associated with the module, but note that the module will be notified in
    any way the sysfs

    value changed! In this case the permission might be S_IRGO | S_IWUSCR (0644).


    +   - The module_param_named() variation has name as the string used to describe
    the variable when loading,

    which has not to be the same as value (which is the actual value of the parameter
    but rather

    the name of the parameter as used in the module). Note that these macros are,
    and thus argument

    has to appear within code.'
