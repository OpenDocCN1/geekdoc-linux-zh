    # 11.3 Bit Operations


    +   - In order to examine and modify individual bits in various flag and lock
    variables there are a number

    of atomic operation functions provided by the kernel.


    +   - These are accomplished through a single machine operation and thus are very
    fast; on most platforms

    this can be done without disrupting interrupts.


    +   - The functions, not surprisingly, differ somewhat according to architecture.
    They are defined in

    /usr/src/linux/x86/include/asm/bitops.h


    ```

    #include <asm/bitops.h>

