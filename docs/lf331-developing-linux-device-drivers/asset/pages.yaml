- pgno: 28
  md: '# 2.8. STAGING DRIVERS


    +   The project is headed by Greg Kroah-Hartman whose weblog is at http://www.kroah.com/log.
    New volunteers are welcome. Our main web page is at http://linuxdriverproject.org/twiki/bin/view.


    +   A goal of the project is to bring many external drivers into the main kernel
    tree. A list of potential candidates is kept at http://linuxdriverproject.org/twiki/bin/view/Main/OutOfTreeDrivers.
    Also maintained is a list of devices for which Linux drivers exist, which can
    be found at http://linuxdriverproject.org/twiki/bin/view/Main/DriversNeeded.


    +   Beginning with the 2.6.28 kernel a new area in the kernel source was added
    for some staging drivers. It is understood that drivers included in this manner
    are not to be expected to possess the quality of those already included in the
    main kernel tree.


    +   These drivers may or not work, utilize user-space interfaces that are more
    likely to change. It is more possible than some of these drivers will ever come
    under some range of kernel options.


    +   Furthermore, use of these drivers taints the kernel.


    +   The purpose of the staging drivers is to provide a zero-height barrier to
    the kernel source tree, and to expose the to a wider range of developers. This
    is partly intended to silence critics who complain about how hard it is to get
    things accepted by the kernel developers.


    +   Any drivers who do not improve or garner much attention while residing in
    the staging tree will be removed after a period of time.


    +   The original notion of the staging tree has also been expanded to include
    drivers which are on their way out of the Linux kernel, either because they are
    no longer maintained, or have been obsolete by newer drivers. If no developers
    step forward to bring these drivers back up to proper standards, eventually they
    will be removed.


    # 2.9 Documentation and Links


    +   The best source of documentation about the Linux kernel is the source itself.
    In many cases it is the only documentation. Never trust what you see in books
    (including this one) or articles without looking at the source.


    +   The /usr/src/linux/Documentation directory contains many useful items. Some
    of the documentation is produced using the docbook system (see http://www.docbook.org.)
    To produce this you go to /usr/src/linux and type


    ```

    $ make htmldocs | psdocs | pdfdocs

    ```


    the different forms giving you documentation are in either as web-browser, postscript,
    portable document format, or rich text format, which will appear in the /usr/src/linux/Documentation/DocBook
    directory. Warning: producing this documentation can take longer than compiling
    the kernel itself! For this to work properly you may have to install additional
    software on your system, such as jade or latex.'
  merge: -1
  img_proc: true
