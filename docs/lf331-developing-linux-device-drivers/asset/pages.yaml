  md: "```\nstruct pci_dev {\n    ....\n    struct pci_driver *driver;\n    ....\n\
    \    struct device *dev;\n    }\n\nstruct pci_driver {\n    ....\n    struct device_driver\
    \ driver;\n    }\n```\n\nand drivers are registered with the system with\n\n```\n\
    #include <linux/pci.h>\n\nint pci_register_driver (struct pci_dev *);\nvoid pci_unregister_driver\
    \ (struct pci_dev *);\n```\n\nDevices, on the other hand, are registered, or discovered,\
    \ directly by the probe callback function or by pci_find_device().\n\n+   How\
    \ is this connected with the generic infrastructure? Because the generic device\
    \ structure is embedded in the pci_dev structure, and the generic device_driver\
    \ structure is embedded in the pci_driver structure, one must do pointer arithmetic.\n\
    \n+   This is done through use of the macro to_pci_dev() as in:\n\n```\nstruct\
    \ device *dev;\n    ....\nstruct pci_dev *pdev = to_pci_dev(dev);\n```\n\nwhich\
    \ is implemented in terms of the container_of(n) macro:\n\n```\n#define to_pci_dev(n)\
    \ container_of(n, struct pci_dev, dev)\n```\n\n+   Likewise, we can gain access\
    \ to the pci_driver structure from its embedded device_driver structure with:\n\
    \n```\nstruct device_driver *drv;\n    ....\nstruct pci_driver *pdrv = to_pci_driver(drv);\n\
    ```\n\n+   With a few exceptions (such as when doing DMA transfers) device drivers\
    \ do not involve the generic structures and registration functions. For example,\
    \ PCI devices fill in the pci_driver structure, and call pci_register_driver()\
    \ (and some other functions) in order to get plugged into the system. However,\
    \ these functions are written in terms of the underlying device model.\n\n+  \
    \ We peek at how PCI devices hook into the unified device model; we could be the\
    \ same for other kinds of devices, such as USB and network and we would find the\
    \ kind of structural relations and embedded structures. Adding a new kind of device\
    \ is just a question of following along the same path."
