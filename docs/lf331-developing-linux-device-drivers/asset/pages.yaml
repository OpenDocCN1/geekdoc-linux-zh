  md: '# CHAPTER 18. INTERRUPT HANDLING: DEFERRABLE FUNCTIONS AND USER DRIVERS


    +   - Clears an interrupt pending bit on the interface board.


    +   - What needs to be done immediately (usually read or write something to/from
    the device). The / data is usually written to or read from a device-specific buffer,
    which has been previously allocated.


    +   - Sets up the interrupt bottom half, the driver does whatever has been deferred.
    While interrupts / enabled when the bottom half runs, they can be disabled if
    necessary. However, this should / avoided as it goes against the basic purpose
    of having a bottom half.


    +   - The kinds of bottom half behave differently:


    +   - Tasklets can be run in different CPUs, using the same tasklet can only be
    one / at a time. They are never in process context. Tasklets will run only on
    the CPU that scheduled / them. This leads to better cache coherence, serialization,
    as the tasklet can never be before / the handler is done, which leads to better
    avoidance of race conditions.


    +   - Work queues run in process context, and thus sleeping is permitted. Because
    each work queue / its own thread on each CPU, sleeping will not block other tasks.
    A bottom half implemented / in this fashion can run on a different CPU than the
    one that scheduled it.


    +   - Depending on the kind of bottom half, they are launched in different ways:
    work queues are / in other tasks, while tasklets are invoked whenever the system
    checks to see if any are pending after / any kind of exception is handled, including
    interrupts and system calls.


    +   - Another way of implementing a bottom half is through maintaining a kernel
    thread. One starts off the / kernel thread upon device initialization or open,
    and then it sleep until it has work to do. Scheduling / a bottom half when becoming
