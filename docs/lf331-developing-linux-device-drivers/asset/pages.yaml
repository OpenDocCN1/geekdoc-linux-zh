- pgno: 308
  md: '# 32.5 REQUEST HANDLING


    +    * The following functions are used to allocate, configure, and free gendisk
    data structures:


    ```

    #include <linux/genhd.h>


    struct gendisk *alloc_disk (int minors);

    void add_disk(struct gendisk *disk);

    void put_disk(struct gendisk *disk);

    void del_gendisk(struct gendisk *disk);

    void set_disk_ro(struct gendisk *disk);

    ```


    +    * The first step is to generate the gendisk structure. This is done with
    alloc_disk(), whose argument is the largest number of numbers, and thus partitions,
    the disk can accommodate.


    +    * One fills in the various fields, such as the major number, the first minor
    (generally 0), and the capacity (which can be done with the set_capacity(struct
    *gendisk, int nsectors) macro) and point to the request queue and device operations
    table.


    +    * Once needed initializations are done to the device, the function add_disk()
    is called to activate the device. This increases the reference count for the disk;
    the put_disk() should be called when the structure is released to decrement the
    reference count.


    +    * Upon removal of the device, one can call del_gendisk(), although the actual
    removal won''t happen until you call put_disk().


    +    * To put all partitions on the disk in a read-only status, you can use set_disk_ro().


    # 32.5 Request Handling


    +    * Upper levels of the kernel handle the I/O requests associated with the
    device, and group them in an efficient manner and place them on the request queue
    for the device, which causes them to get passed to the driver''s *request function.


    +    * The kernel maintains a request queue for each major number (by default).
    The data structure is of type request_queue and is defined in /usr/src/linux/include/linux/blkdev.h.
    The other major data structure involved is of type request and details each request
    being made to the driver.


    +    * The request queue must be initialized and cleared with the functions:


    ```

    #include <linux/blkdev.h>


    struct request_queue *blk_init_queue(struct request_fn_proc *request, spinlock_t
    *lock);

    void blk_cleanup_queue(struct request_queue *q);

    ```


    and the sector size should be set in this structure with the functions:


    +    * A spinlock has to be passed to the upper layers of the kernel. This will
    be taken out when the request function is called, with code like:


    ```

    static spinlock_t lock;

    ...

    spin_lock_init(&lock);

    ...

    my_request_queue = blk_init_queue(my_request, &lock);

    ```'
  merge: -1
  img_proc: true
- pgno: 309
  md: "The simplest way to see how request handling is to look at a trivial request\
    \ function:\n\n```\nstatic void my_request(struct request_queue *q)\n{\n    struct\
    \ request *rq;\n    int size, res = 0;\n    char *ptr;\n    unsigned nr_sectors,\
    \ sector;\n    printk(KERN_INFO \"entering routine\\n\");\n\n    rq = blk_fetch_request(rq);\n\
    \    while (rq) {\n        if (!blk_fs_request(rq)) {\n            printk(KERN_WARNING\
    \ \"This was not a normal fs request, skipping\\n\");\n            goto done;\n\
    \        }\n\n        nr_sectors = blk_rq_cur_sectors(rq);\n        sector = blk_rq_pos(rq);\n\
    \        ptr = ramdisk + sector * sector_size;\n        size = nr_sectors * sector_size;\n\
    \n        if ((ptr + size) > disk_size) {\n            printk(KERN_WARNING \"\
    tried to go past end of device\\n\");\n            goto done;\n        }\n\n \
    \       if (rq->data_dir(rq)) {\n            printk(KERN_INFO \"writing at sector\
    \ %ld, %ud sectors\\n\", sector, nr_sectors);\n            memcpy(ptr, rq->buffer,\
    \ size);\n        } else {\n            printk(KERN_INFO \"reading at sector %ld,\
    \ %ud sectors\\n\", sector, nr_sectors);\n            memcpy(rq->buffer, ptr,\
    \ size);\n        }\n\n        done:\n        if (!blk_end_request_cur(rq, res))\
    \ {\n            rq = blk_fetch_request(rq);\n        }\n    }\n    printk(KERN_INFO\
    \ \"leaving routine\\n\");\n}\n```\n\nPeeling off the first request from the queue\
    \ is done with blk_fetch_request() which returns NULL when there are no more requests.\
    \ The function blk_fs_request() checks what kind of request is being delivered.\
    \ This evaluates as true for normal filesystem requests, as opposed to diagnostic\
    \ and other kinds of operations.\n\nThe actual copying is done with a simple memcpy().\
    \ Note, however, the use of the function rq_data_dir(), which checks the first\
    \ bit of the flags field of the request structure which is set for writes, and\
    \ cleared for reads."
  merge: -1
