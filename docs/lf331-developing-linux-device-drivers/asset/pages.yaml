  md: "# 23.4. LOADING/UNLOADING\n\nregister_netdev() function invokes a specified\
    \ initialization routine to probe for the network card, and fills in the device\
    \ structure, which includes the interface name (which can be dynamically assigned).\
    \ unregister_netdev() removes the interface from the list of interfaces. Any memory\
    \ associated with it should be freed.\n\nnet_device structure contains all information\
    \ about the device, and we will discuss it in detail. To obtain proper reference\
    \ counting must be avoided and freed dynamically with:\n\n```\nstruct net_device\
    \ *alloc_netdev(int size_priv, const char *name,\n             void (*setup)(struct\
    \ net_device *dev));\nvoid free_netdev(struct net_device *dev);\n```\n\nwhere:\n\
    \n+   - size_priv is the size of the private data in the net_device data structure.\n\
    - name is the name of the device; if a format as \"myneth\" is chosen it will\
    \ be filled dynamically as devices are brought up (mynet0, mynet1, ...).\n- setup()\
    \ points to an initialization function that will set up remaining fields in the\
    \ data structure. For a standard network device the ether_setup() can be used,\
    \ or it can be called from a supplied function.\n\nFor convenience one can call\
    \ the simpler function:\n\n```\nstruct net_device *alloc_ethderdev(int size_priv);\n\
    ```\n\nwhich supplies \"eth0\" for the name and points to ether_setup() for initialization.\n\
    \n+   - One should never access the priv field directly as to do so would inhibit\
    \ performance, flexibility and reference counting. One should use the inline function\
    \ net_dev_priv() as:\n\n```\nstruct my_priv *priv = net_dev_priv(dev);\n```\n\n\
    +   - One has no need to, and never dev to kfree (dev->priv), as the private area\
    \ is allocated with the entire structure, and thus is released at the same time.\n\
    \n+   - It is important to initialize the device properly. First your setup()\
    \ function will get called and then it call ether_setup() which gives standard\
    \ values for an Ethernet device. Then specific elements in the structure can be\
    \ directly initialized. For example:\n\n```\nstatic struct net_device_ops ndo\
    \ = {\n    .ndo_open = my_open,\n    .ndo_stop = my_stop,\n    .ndo_start_xmit\
    \ = my_start_xmit,\n    .ndo_do_ioctl = my_do_ioctl,\n    .ndo_get_stats = my_get_stats,\n\
    \    .ndo_tx_timeout = my_tx_timeout,\n};\n\nstatic void myynet_setup(struct net_device\
    \ *dev) {\n    ...\n    ether_setup(dev);\n    dev->devdev_ops = &ndo;\n    dev->watchdog_timeout\
    \ = timeout;\n}\n```\n\nThere may be other functions that you may need to point\
    \ to as well, if you don't want the defaults installed by ether_setup()."
