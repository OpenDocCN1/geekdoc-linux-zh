  md: "# CHAPTER 18. INTERRUPT HANDLING: DEFERRABLE FUNCTIONS AND USER DRIVERS\n18.3\
    \ Tasklets\n\n+   - Tasklets are used to queue up work which can be done at a\
    \ later time. They are frequently used in interrupt service routines; a typical\
    \ *top half* does whatever needs to be done to get data off or onto a device and\
    \ re-enables interrupts. Further data processing may be done in tasklets while\
    \ the device is ready for new data.\n\n+   - Tasklets may be run on multiple CPU\
    \ systems. However, the same tasklet cannot be run at the same time on more than\
    \ one CPU.\n\n+   - A tasklet is always run on the CPU that scheduled it; among\
    \ other things this optimizes cache usage. (This however can cause delays which\
    \ may not be the cache savings; *work queues* can be used instead.) As a result,\
    \ many kinds of race conditions are naturally avoided; the thread that queued\
    \ the tasklet must complete before the tasklet actually gets.\n\n+   - The tasklet\
    \ code is explained in `/usr/src/kernel/include/linux/interrupt.h`. The important\
    \ data structure is:\n\n```\nstruct tasklet_struct {\n    struct tasklet_struct\
    \ *next;\n    unsigned long state;\n    atomic_t count;\n    void (*func)(unsigned\
    \ long);\n    unsigned long data;\n};\n```\n\n+   - The func entry is a pointer\
    \ to the function that will be run, which can have data passed to it through data.\
    \ The state is used to determine whether or not the tasklet has already been scheduled;\
    \ if it cannot be done so a second time.\n\n+   - The main macros and functions\
    \ involving tasklets are:\n\n```\nDECLARE_TASKLET(name, function, data);\nDECLARE_TASKLET_DISABLED(name,\
    \ function, data);\n\nvoid tasklet_init(struct tasklet_struct *t, void (*func)(unsigned\
    \ long), unsigned long data);\n\nvoid tasklet_schedule(struct tasklet_struct *t);\n\
    void tasklet_enable(struct tasklet_struct *t);\nvoid tasklet_disable(struct tasklet_struct\
    \ *t);\nvoid tasklet_kill(struct tasklet_struct *t);\n```\n\n+   - A tasklet must\
    \ be initialized before being used, either by allocating space for the structure\
    \ and calling tasklet_init(), or by using the `DECLARE_...` macros, which take\
    \ care of both although they must be used in the global scope.\n\n+   - The tasklet_kill()\
    \ is used to kill tasklets that reschedule themselves.\n\n+   - When a tasklet\
    \ is scheduled, the inline function tasklet_schedule() is called as defined in\
    \ `/usr/src/linux/include/linux/interrupt.h:`"
