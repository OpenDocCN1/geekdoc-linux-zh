  md: "# 30.3. LINUX IMPLEMENTATION\n\n* A typical code fragment might have:\n\n```\n\
    struct aiooc *cb = malloc(sizeof struct aiooc);\nchar *buf = malloc(nbytes);\n\
    \nfd = open (...);\ncb->aio_filedes = fd;\ncb->aio_bytes = nbytes;\ncb->aio_offset\
    \ = offset;\ncb->aio_buf = buf;\n...\n\nrc = aio_read (cb);\n\nwhile (aio_error\
    \ (cb) == EINPROGRESS) {\n```\n\nwhere we use the aio_error() function to wait\
    \ for completion of pending requests on the control block.\n\n# 30.3 Linux Implementation\n\
    \n+   * The original AIO implementation for Linux was done by glibc completely\
    \ in user-space. A thread was launched for each file descriptor for which there\
    \ were pending AIO requests.\n\n+   * This approach is costly, if there are large\
    \ numbers, thousands, of such requests; true support within the kernel can lead\
    \ to far better performance. Thus glibc also permits the important parts of the\
    \ implementation to be passed off to the kernel and more efficiently in kernel-space.\n\
    \n+   * The 2.6 kernel contains full support for AIO; in fact I/O is really done\
    \ through the asynchronous method, with normal I/O being read if certain flags\
    \ are set.\n\n+   * A document describing the details of this implementation can\
    \ be found at http://ise.sourceforge.net/io/alionotes.txt.\n\n+   * Network device\
    \ drivers already fully take advantage of the asynchronous implementation. Character\
    \ drivers (rarely require asynchronicity), however, need to be modified specifically\
    \ to take the advantage of the new facility. This supplying new functions in the\
    \ file_operations jump table structure,\n\n```\nssize_t (*aio_read) (struct kioc\
    \ *iocb, struct iovec iov, unsigned long long,\n\tloff_t *pos);\nssize_t (*aio_write)\
    \ (struct kioc *iocb, struct iovec iov, unsigned long long,\n\tloff_t *pos);\n\
    int (*aio_fsync) (struct kioc *iocb, int datasyncync);\n```\n\n+   * As this glibc\
    \ still does not take advantage of full support for AIO for Linux. Thus, even\
    \ if you put such entries in your driver, they will never get hit. (Actually if\
    \ you don't have a normal read and write entries the kernel will call the asynchronous,\
    \ if you want to test them.)\n\n+   * However, there is a native user-space API\
    \ in Linux with new systems that can be used efficiently; it isn't possible. To\
    \ use this you have to have the libaio-dev package installed, and if you want\
    \ to compile code using it the libaio package installed. Your code will have to\
    \ include the header file /usr/include/libaio.h. The basic functions are:"
