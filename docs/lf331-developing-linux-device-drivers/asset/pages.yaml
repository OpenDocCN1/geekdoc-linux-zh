  md: "# 11.6 MUTEXES\n\n- Sleeping is permitted while holding the BKL; it is released\
    \ when sleep begins and grabbed again upon awakening.\n\n+   - Furthermore, with\
    \ kernel preemption turned on it was possible to turn on BKL preemption as a kernel\
    \ configuration option through kernel version 2.6.24; after that it was automatically\
    \ done.\n\n+   - Newcomers are sometimes confused by code:\n\n```\nlock_kernel();\n\
    ...\nspin_lock(&my_lock);\n...\nspin_unlock(&my_lock);\n...\nunlock_kernel();\n\
    ```\n\nin which a finer-grained lock is nested within the BKL. The confusion arises\
    \ because of not understanding that all spinlocks are advisory; i.e., they are\
    \ only effective when code examines a lock status. We are not mandatory locks.\n\
    \n+   - There is an ongoing effort to terminate almost all instances of the BKL,\
    \ as its promiscuous use led to a lot of bottlenecks when code in no ways interacts\
    \ with other code took out the BKL and suspended the other.\n\n+   - Minimizing\
    \ the use of the BKL has been tedious. Each removal requires careful examination\
    \ and testing against unanticipated side effects, but it is a necessary chore\
    \ to accomplish on the way to fully-grained locking. Removal involves replacing\
    \ it with appropriate and narrow locking mechanisms for each particular purpose.\n\
    \n| The 2.6.37 kernel offers complete removal of the BKL as a kernel compilation\
    \ option; in the 2.6.39 kernel it was completely removed. |\n| Any references\
    \ to lock_kernel() and unlock_kernel() will fail to compile as will in any of\
    \ the header file smp_lock.h. |\n\n# 11.6 Mutexes\n\n+   - A mutex (mutual exclusion\
    \ object) is a basic kind of sleepable locking mechanism. While spinlocks are\
    \ also a kind of mutex, they do not permit sleeping.\n\n+   - The elementary data\
    \ structure is defined in /usr/src/linux/include/linux/mutex.h:\n\n```\n#include\
    \ <mutex.h>\n\nstruct mutex {\n    atomic_t        count;\n    spinlock_t    \
    \  wait_lock;\n    struct list_head wait_list;\n};\n```"
