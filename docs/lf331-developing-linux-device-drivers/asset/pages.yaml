- pgno: 42
  md: '# 3.8 Labs


    # Lab 1: Installing a Basic Character Driver


    +   - In this exercise we are going to compile, load (and unload) and test a sample
    driver (provided). In subsequent sections we will discuss each of these steps
    in detail.


    +   - Compiling: First you have to make sure you have the installed kernel source
    for the kernel you are running You can verify this by doing:


    ```

    $ ls -l /lib/modules/$(uname -r)/build

    ```


    and make sure it points to a non-empty directory. If it doesn''t your instructor
    will help you fix this, or ask you to reboot into a different kernel that has
    the appropriate files installed on your system.


    +   - We will discuss in depth how to Makefiles for compiling external kernel
    modules shortly, but for now use the genmake script with the solutions; just do:


    ```

    $ ../genmake

    ```


    and compile the kernel module with:


    ```

    $ make

    ```


    . which will compile your module with all the same options and flags as the kernel
    modules in that source location.


    +   - Monitoring Output: If you are working at a virtual terminal or in non-graphical
    mode, you''ll see the output of your module appear on your screen. Otherwise you''ll
    have to keep an eye on the file /var/log/messages, the system logging directs
    kernel print messages. The best way to do this is to open a terminal, and in it
    type:


    ```

    $ tailf /var/log/messages

    ```


    +   - Loading and Unloading: The easiest way to load and unload the module is
    with:


    ```

    $ /sbin/insmod lab_1_chrdrv.ko

    $ /sbin/rmmod lab_1_chrdrv

    ```


    Try and unload the module. If you look at /proc/devices you should see your driver
    registered, and if you look at /proc/modules (or type Ismod) you should see that
    your module is loaded.


    +   - Creating a Device Node: Before you can actually use the module, you''ll
    have to create the device node with applications interact. You do this with the
    mknod command:


    ```

    $ mknod /dev/mychrdrv 700 0

    ```


    Note that the name of the device node (/dev/mychrdrv) is irrelevant, the kernel
    identifies driver should handle the system calls only by the major number (700
    in this case.) The minor number (0 in this case) is used only within the driver.


    +   - Using the Module: You should be able to test the module with simple commands
    like:


    ```

    $ echo Some Input > /dev/mychrdrv

    $ cat samplefile > /dev/mychrdrv

    $ dd if=/dev/zero of=/dev/mychrdrv count=1

    $ dd if=/dev/mychrdrv count=1

    ```


    We''ve only skimmed the surface; later we will consider the details of each steps.'
