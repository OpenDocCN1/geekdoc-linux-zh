  md: "# 32.6 Labs\n\nLab 1: Building a Block Driver\n\n+   - Write a basic block\
    \ device driver.\n- You'll need to implement at least the open() and release()\
    \ entry points, and include a request function.\n- You can either use an unallocated\
    \ value for the major device number and select a minor device number, or try getting\
    \ a major number dynamically. Assuming you are using udev, the node should be\
    \ made automatically when you load the driver; otherwise you will have to actually\
    \ add the node with the mknod command.\n- Keep track of the number of times the\
    \ node is opened. Permitting multiple opens, or exclusive use.\n- Write a program\
    \ to read (and/write) from the node, using the standard Unix I/O functions open(),\
    \ read(), write(), close(). After loading the module with insmod use this program\
    \ to access the node.\n- NOTE: Make sure you have enough memory to handle the\
    \ ram disk you create; The solution has 128 MB allocated.\n\n# Lab 2: Mountable\
    \ Read/Write Block Driver\n\n+   - Extend the previous exercise in order to put\
    \ an ext3 file system (or other type) on your device.\n- You can place a filesystem\
    \ on the device with\n```\\$ mkfs.ext3 /dev/mybdrv\n$ mount /dev/mybdrv mnt\n\
    ```\n\nwhere you give the appropriate name of the device node and mount point.\n\
    - For an additional enhancement, try partitioning the device with fdisk. For this\
    \ you may need an additional ioctl() for HDIO_GETGEO, and you'll have to include:\
    \ linux/hd.h. This ioctl returns a pointer to the following structure:\n\n```\n\
    struct bd_geometry {\n    unsigned char heads;\n    unsigned char sectors;\n \
    \   unsigned short cylinders;\n    unsigned long start;\n};\n```\n\nRemember the\
    \ total capacity is (sector size ) x (sectors/track) x (cylinders) x (heads).\
    \ You also want to use a value of 4 for the starting sector.\n\n+   - If you are\
    \ using a recent kernel and version of udev, the partition nodes should be made\
    \ automatically when you load the driver; otherwise you will have to actually\
    \ add them manually."
