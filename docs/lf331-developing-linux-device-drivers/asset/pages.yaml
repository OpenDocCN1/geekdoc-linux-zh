    +   • This method has been used to replace tasklets and work queues in many device
    drivers, and adoption is only likely to increase.


    +   • If the kernel is booted with the command line option, threadirqs as in:


    ```

    linux kernel /vmlinuz-.... threadirqs

    ```


    all interrupt handlers will be forced into threading, except those which have
    been explicitly flagged with IRQF_NO_THREAD.


    # 18.7 Interrupt Handling in User-Space


    +   • Device drivers written in user-space may offer certain advantages:


    +   • Of course not everyone would consider each of these properties as an advantage.


    +   • It has long the case that many device drivers are written in user-space
    using the ioperm() or iopers() functions to get access to I/O ports, or are layered
    on top of in-kernel-level drivers such as for the parallel, serial or USB ports.
    This is the case, for example, drivers for printers and scanners.


    +   • What was lacking in infrastructure was a general method of having a user-driver
    handle interrupts. The kinds of drivers mentioned above work in polling modes;
    e.g., the X driver checks for mouse activity times per second by reading I/O ports
    instead of directly responding to interrupts.


    +   • The UIO project (Userspace I/O) was fully integrated into the 2.6.23 kernel
    as a method of handling interrupts from user-space.


    +   • For full documentation see /usr/src/linux/Documentation/DocBook/uio-howto.html,
    or to see it in the pdf produced from kernel sources to: http://training.linuxfoundation.org/materials/LF331/uio-howto.pdf


    +   • The first device created will cause the appearance of the device node /dev/uio0,
    the second /dev/uio1 ... An registration from these device nodes will block until
    an interrupt occurs and can read an unsigned integer from containing the number
    of interrupts. A reading of a blocking device, you can also use select(), poll()
    and sit on the file descriptors and wait for activity.


    +   • If you need to know when an interrupt appears a user-driver alone may suffice.
    It can be written using all available user-space libraries and tools and not have
    an open-source license.


    +   • However, much of the time you will need to write a small kernel driver as
    well, which may be required to do things like mapped regions on the device (which
    you can access from user-space), clear interrupts on device registers. There is
    also a general API for writing a PCI user-space driver, all of which is described
    in the document previously referred to.


    +   • We should note that there are potential difficulties such as the possibilities
    of losing interrupts if interrupts arrive, special problems with sharing interrupts,
    and trying to avoid much polling which disturbs true synchronicity in the interrupt
    system and can lead to unacceptable latencies.


    +   • We will do exercises in which we used the UIO infrastructure, on the one
    hand, and implement one of our own, using a special device node.'
