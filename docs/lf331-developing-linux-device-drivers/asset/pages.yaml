- pgno: 243
  md: '# CHAPTER 23. NETWORK DRIVERS I: BASICS


    # Network Layers


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_243_0.png)


    Figure 23.1: Network Layers


    +   - **Transport Layer:** This describes how data is encapsulation, error checking
    protocols, etc. The two most common examples are streaming (usually TCP (Transmission
    Control Protocol)) connection-oriented; and datagram (usually UDP (User Datagram
    Protocol)) connection. Other examples include SLIP and PPP.


    +   - **Network Layer:** This describes how data is to sent across the network,
    containing routing information etc. The most common protocols are IPv4 (Internet
    Protocol 4) or the newer IPv6, and Unix for local machine communication. Other
    examples include ARP and ICMP


    +   - **Datalink Layer:** This is the hardware part. It includes both the type
    of device (Ethernet, Token Ring, etc.), and the actual device driver for the network
    card.


    +   - Networking applications send and receive information by creating and connecting
    to sockets, which endpoints may be anywhere. Data is sent to and received from
    sockets as a stream. This is true whether or not the underlying transport layer
    deals with connectionless un-sequenced data (such as UDP), or connection-oriented
    sequenced data (such as TCP). Note that various combinations of layers are possible,
    such as TCP/IP or UDP/IP.


    +   - The basic data unit that moves through the networking layers and through
    the network is the packet, which contains the data but also headers and footer
    controlling information. Within the kernel, the packet is described by a socket
    buffer, a data structure of type sk buff.


    +   - These headers and footer contain information such as the source and destination
    of the packet, various options about priority, sequencing, and routing, identification
    of the device driver associated with the'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# 23.1. NETWORK LAYERS AND DATA ENCAPSULATION


    socket, etc.


    +   - When an application writes into a socket, the transport layer creates a
    series of one or more packets and adds control information. It then hands them
    off to the network layer which adds more control information, and decides where
    the packets are going: Packets going out on the network are handed off to the
    datalink layer and the device driver.


    +   - When packets of data are received by the datalink layer, it first sees if
    they are intended for the local machine, and if so it processes them and hands
    off to the network layer, which passes them through the transport layer, which
    sequences the packets, and finally strips out the data and sends it back to the
    application.


    # Data Packet Encapsulation


    | Datalink (Hardware ) Header |

    | (Ethernet, Device Driver) |

    | Network Layer Header |

    | (ipv4, unix socket, etc.) |

    | Transport Layer Header |

    | (TCP, UDP, etc.) |

    | Data Payload |

    | Datalink Footer |


    Figure 23.2: Data Packet Encapsulation


    +   - As packets move up and down through the networking layers, the kernel avoids
    repeated copying by passing pointers to the encapsulated data buffer, or payload,
    in the packet, while modifying headers and footers as necessary.


    +   - The outermost header and footer correspond to the datalink layer, which
    describes the hardware, device driver, and the hardware type of network, as Ethernet
    or Token Ring. For instance, the MAC address will appear here.


    +   - The next layer describes the network protocol, such as IPv4, and the innermost
    header describes the transmission protocol, as TCP or UDP.


    +   - For reasons of optimization, the network and transport layer are not as
    completely separated as they might be in principle. For instance the network layer
    implementations may contain implementations implementations of the transport layer,
    rather than passing always through a common base. For instance, both Internet
    and local Unix sockets have their own datagram (connectionless) code.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# CHAPTER 23. NETWORK DRIVERS I: BASICS


    # 23.2 Datalink Layer


    +   - Applications have no knowledge of the hardware through which the computer
    will be connected to the network, except for specialized programs used for monitoring
    and diagnostic purposes.


    +   - For the instance computer may be connected via Ethernet, Bluetooth or Token
    Ring, each of which has its own kind of network interface card (NIC), or through
    a PPP connection through a serial modem. Even within a given hardware type there
    are many choices; Linux sorts probably hundreds of different kinds of Ethernet
    NIC''s.


    +   - Thus there are hardware components that the kernel needs to deal with; the
    datalink layer (Ethernet etc.) and the device driver which handles the NIC. These
    are not completely independent degrees of freedom as a given NIC will only work
    with a given datalink layer; thus the device drivers are associated with a given
    datalink layer.


    +   - Generally speaking, applications are independent of both these layers as
    well as the network and transport layers.


    # 23.3 Network Device Drivers


    +   - We are going to concentrate on the networking datalink layer, i.e., the
    device driver. We are not going to consider the application layer or the network
    and transport layers except for how they interact with the device drivers.


    +   - As for other classes of devices, network drivers can either be built-in
    or modular.


    +   - Network device drivers are fundamentally different than character and block
    device drivers and have no associated filesystem system. Instead they are identified
    by a name, such as eth0 or ppp0.


    +   - At the kernel level they work with packet transmission and reception, not
    read and write operations. A network driver asks to push incoming packets; other
    drivers are asked to send a buffer towards the kernel.


    +   - To make writing a network driver easier, templates are included in the kernel
    sources. For PCI devices this can be found at /usr/src/linux/drivers/net/pci-skeleton.c.


    # 23.4 Loading/Unloading


    +   - Network drivers are loaded and unloaded:


    ```

    #include <linux/netdev.h>


    int register_netdev (struct net_device *);nvoid unregister_netdev(struct net_device
    *dev);

    ```


    +   - Usually one registers the device in the initialization callback function
    and unregisters it in the exit callback.


    +   - The command


    ```

    $ /sbin/ifconfig interface [aftype] options [address]

    ```


    can be used to start, stop, and configure interfaces.'
