  md: '# CHAPTER 7. INTERRUPTS AND EXCEPTIONS


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_89_0.png)


    +   - The IRQF_DISABLED flag has been deprecated for quite a while and as of kernel
    2.6.35 it no longer has any effect.


    # 7.8 Installing an Interrupt Handler


    +   - Normally device drivers do not directly access the data structures we just
    described. Instead they use the following functions to install and uninstall interrupt
    handlers:


    ```

    #include <linux/interrupt.h>


    request_irq(unsigned int irq,

    irqreturn_t (*handler)(unsigned int irq, void *dev_id),

    unsigned long flags,

    const char *device,

    void *dev_id;

    void synchronize_irq(unsigned int irq);

    free_irq(unsigned int irq, void *dev_id);

    ```


    +   - irq is the interrupt number.


    +   - handler() is the handler to be installed.


    +   - flags is the same bit-mask of options described before; i.e., IRQF_DISABLED
    etc. Requesting when the IRQ has been already registered as non-sharing may generate
    verbose but harmless debugging messages.


    +   - device is the same as the name field in the irqaction structure; it sets
    the identifier appearing in / proc/interrupts:


    +   - dev_id is the same unique identifier used for shared IRQ lines that appeared
    in the irqaction structure. It is often used as a private data area to be passed
    to the handler routine.


    +   - handler() has two arguments:


    +   - irq is useful if more than one IRQ is being serviced.


    +   - dev_id is used for shared interrupts and can also be used as a private data
    pointer.'
