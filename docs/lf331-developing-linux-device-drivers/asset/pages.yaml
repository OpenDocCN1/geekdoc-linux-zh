  md: '# 9.5 Labs


    # Lab 1: Using kprobes


    +   - Place a kprobe at an often executed place in the kernel. A good choice would
    be the do_fork() function, which is executed whenever a child process is born.


    +   - Put in simple handler functions.


    +   - Test the module by loading it and running simple commands which cause the
    probed instruction to execute, such as starting a new shell with bash.


    # Lab 2: Using jprobes


    +   - Test the jprobes facility by instrumenting a commonly used kernel function.


    +   - Keep a counter of how many times the function is called. If you print it
    out each time, be careful not to get overwhelmed with output.


    # Lab 3: Probing a module


    +   - Take an earlier character driver module and write a new module that uses
