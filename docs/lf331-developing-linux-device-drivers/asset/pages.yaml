  md: '#  Chapter 11


    # # Race Conditions and Synchronization Methods


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_120_0.png)


    We''ll consider some of the methods the kernel uses to synchronize and avoid race
    conditions. We''ll discuss atomic functions and bit operations, the use of spinlocks,
    mutexes, semaphores, and completion functions. Finally we''ll see how the kernel
    maintains reference counts.


    +   - 11.1 Concurrency and Synchronization Methods 105

    - 11.2 Atomic Operations 107

    - 11.3 Bit Operations 108

    - 11.4 Spinlocks 109

    - 11.5 Big Kernel Lock 110

    - 11.6 Mutexes 111

    - 11.7 Semaphores 113

    - 11.8 Completion Functions 116

    - 11.9 Reference Counts 116

    - 11.10 Labs 117


    #  11.1 Concurrency and Synchronization Methods


    +   - Kernel execution is asynchronous and unpredictable; interrupts occur at
    any time, system calls can be entered from many different processes, and kernel
    threads of execution will also occupy the CPUs.


    +   - Many kernel resources can be modified in one place while being used in another.
    In some cases the code paths are distinct, while in others the same code is executed
    more than once simultaneously. Either way data corruption is a danger as potential
    race conditions including deadlock.'
  merge: -1
