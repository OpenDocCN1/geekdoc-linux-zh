- pgno: 167
  md: '# 16.7 User-Space Functions for mmap()


    +   * From the user side, memory mapping is done with:


    ```

    #include <unistd.h>

    #include <sys/mman.h>


    void *mmap(void *start, size_t length, int prot, int flags, int fd, off_t offset);

    int munmap(void *start, size_t length);

    ```


    +   * This requests the mapping into memory of length bytes, starting at offset
    offset, from the file specified by fd. The offset must be an integer number of
    pages.


    +   * The address start is a preferred address to map to; if 0 is given (the usual
    case), mmap() will choose the address and put it in the return value.


    +   * prot is the desired memory protection. It has bits:


    # Table 16.2: mmap() Memory Protection Bits


    | Value | Meaning |

    | --- | --- |

    | PROT_EXEC | Pages may be executed. |

    | PROT_READ | Pages may be read. |

    | PROT_WRITE | Pages may be written. |

    | PROT_NONE | Pages may not be accessed. |


    +   * flags specifies the type of mapped object. It has bits:


    # Table 16.3: mmap() flags


    | Value | Meaning |

    | --- | --- |

    | MAP_FIXED | If start can''t be used, fail. |

    | MAP_SHARED | Share the mapping with all other processes. |

    | MAP_PRIVATE | Create a private copy-on-write mapping. |


    Either MAP_SHARED or MAP_PRIVATE must be specified. Remember, a private mapping
    does not change the file on disk. Whatever changes are made will be lost when
    the process terminates.


    +   * Other non-POSIX flags can be specified (see man mmap.). In particular, the
    MAP_ANONYMOUS flag permits a mapping only in memory, without a file association.


    +   * Here is a simple example using anonymous memory mapping to share memory
    between a parent and child:


    ```

    #include <stdlib.h>

    #include <stdio.h>

    #include <unistd.h>

    #include <string.h>

    #include <sys/mman.h>

    ```'
