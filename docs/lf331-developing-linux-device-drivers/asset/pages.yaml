- pgno: 16
  md: '# Chapter 1


    # Introduction


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_16_0.png)


    We lay out our objectives and describe our target audience.


    +   1.1 Objectives 1

    1.2 Who you Are 2


    # 1.1 Objectives


    +   - Developing Linux Device Drivers** is designed to show experienced programmers
    how to develop device drivers for Linux systems, and give them a basic understanding
    and familiarity with the Linux kernel.


    +   - Upon mastering this material, you will be familiar with the different kinds
    of device drivers used under Linux, and know the appropriate APT through which
    devices (both hard and soft) interface with the kernel.


    +   - We will focus primarily on Device Drivers and only secondarily on the Linux
    Kernel. These are impossible to separate, since device drivers are an integral
    part of the kernel. However, most device drivers use only a limited set of kernel
    functions and one need learn everything about how to do a device driver. While
    device drivers do control important kernel features such as scheduling or memory
    management, the more you know about how Linux handles things the better a device
    driver you can write.


    +   - In many operating systems, which are closed source, there is a cleaner separation
    between device driver and the kernel. Because Linux is open source, the device
    driver has full access to all of the kernel.


    +   - While we will discuss kernel internals and algorithms we will examine deeply
    only the functions which are normally used in device drivers. More details on
    things such as scheduling, memory management, etc., belong properly in a higher
    level (or lower level depending on how you define things).'
  merge: -1
  img_proc: true
- pgno: 17
  md: "# CHAPTER 1. INTRODUCTION\n\nDeveloping device drivers is a big subject both\
    \ in depth (from deep inside the kernel to usage) and in breadth (the many types\
    \ of devices.) In order keep things manageable we are going to limit our range\
    \ both vertically and horizontally.\n\nThis means we won't look deeply into the\
    \ kernel's inner plumbing even as it relates to device drivers. And for particular\
    \ types of device drivers we will stop before we get to detailed aspects of particular\
    \ devices or classes of devices and hardware. It also means we are going to just\
    \ ignore whole classes of devices, such as SCSI and wireless, as any treatment\
    \ of these subjects would become huge and specialized.\n\nOur order of presentation\
    \ is not axiomatic; i.e., we will have some forward referencing and digressions.\
    \ The purpose is to get you into coding as quickly as possible. We'll tell you\
    \ early on how to dynamically allocate memory in the simplest way, so we can actually\
    \ write code, and then later cover the subject more thoroughly. Furthermore, the\
    \ order of subjects is somewhat flexible.\n\n# 1.2 Who are you\n\n+   - You are\
    \ interested in how to write device drivers for the Linux operating system. Maybe\
    \ you are just doing this for fun, but more likely you will find this task as\
    \ part of your job. The purpose here is to ease your path and perhaps shorten\
    \ the amount of time it takes to reach a level of basic competence in this endeavor.\n\
    \n+   - How much you get out of this and how-free, efficient, and optimized your\
    \ drivers will depend on how good a programmer you were before you started with\
    \ the present material. There is no intent or time here to teach you the elements\
    \ of good programming or the Linux operating system design in great detail.\n\n\
    +   - You should:\n  - Be proficient in the C programming language.\n  - Be familiar\
    \ with basic Linux (Unix) utilities, such as ls, rm, grep, tar, and have a familiarity\
    \ with command shells and scripts.\n  - Be comfortable using any of the available\
    \ text editors (e.g., vi, emacs).\n  - Know the basics of compiling and linking\
    \ programs, constructing Makefiles; i.e., be comfortable doing application development\
    \ in a Linux or Unix environment.\n  - Have a good understanding of systems programming\
    \ in a Unix or Linux environment, at least from the standpoint of writing applications.\n\
    \n+   - Experience with any major Linux distribution is helpful but not strictly\
    \ required.\n\n+   - If you had some experience configuring and compiling kernels,\
    \ and writing kernel modules and device drivers, you will get much more out of\
    \ this material.\n\n+   - If you have a good grasp of operating system fundamentals\
    \ and familiarity with the insides of any other operating system, you will gain\
    \ much more from this material.\n\n+   - While our material will not be very advanced,\
    \ it will strive to be thorough and complete. It is worth repeating that we are\
    \ not aiming for an expert audience, but instead for a motivated one."
  merge: -1
