  md: "# 27.7. REGISTERING USB DEVICES\n\n+   * id_table points to an identifying\
    \ structure of type usb_device_id, defined in /usr/src/linux/include/linux/devicetree.h:\n\
    \n```\nstruct usb_device_id {\n    /* which fields to match against? */\n    __u16\
    \ match_flags;\n\n    /* Used for product specific matches; range is inclusive\
    \ */\n    __u16 idVendor;\n    __u16 idProduct;\n    __u16 bcdDevice_lo;\n   \
    \ __u16 bcdDevice_hi;\n\n    /* Used for device class matches */\n    __u8 bDeviceClass;\n\
    \    __u8 bDeviceSubClass;\n    __u8 bDeviceProtocol;\n\n    /* Used for interface\
    \ class matches */\n    __u8 bInterfaceClass;\n    __u8 bInterfaceSubClass;\n\
    \    __u8 bInterfaceProtocol;\n\n    /* not matched against */\n    kernel_ulong_t\
    \ driver_info;\n};\n```\n\n+   * match_flags sets which the other fields in the\
    \ structure the device should be matched. Usually this is not set directly; it\
    \ is initialized by the USB_DEVICE macros we discuss.\n\n+   * idVendor is the\
    \ unique USB vendor ID for the device, assigned by the USB controlling body. idProduct\
    \ is the product ID and is set by the vendor.\n\n+   * bcdDevice_lo, bcdDevice_hi\
    \ are the low and high ends of the vendor-determined product number\n\n+   * bDeviceClass,\
    \ bDeviceSubClass, bDeviceProtocol are assigned by the USB controlling body and\
    \ describe the whole device, including all interfaces.\n\n+   * bInterfaceClass,\
    \ bInterfaceSubClass, bInterfaceProtocol describe the individual interface.\n\n\
    +   * driver_info can be used by the driver to distinguish different devices from\
    \ each other when probe() is called.\n\n+   * The usb_device_id table is usually\
    \ initialized with the following macros:\n\n```\nUSB_DEVICE(vendor, product)\n\
    USB_DEVICE_VER(vendor, product, hi)\nUSB_DEVICE_INFO(class, subclass, protocol)\n\
    USB_INTERFACE_INFO(class, subclass, protocol)\n```\n\nin a straightforward way.\
    \ Thus for a simple driver controlling only one device from one you might have:\n\
    \n```\nstatic struct usb_device_id my_usb_id_table = {\n    { USB_DEVICE(MY_VENDOR_ID,\
    \ MY_VENDOR_PRODUCT_ID) },\n    { /* Null terminator (required) */ }\n};\nMODULE_DEVICE_TABLE(usb,\
    \ my_usb_id_table);\n```"
