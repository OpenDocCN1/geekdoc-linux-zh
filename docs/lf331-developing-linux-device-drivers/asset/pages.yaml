  md: '# Chapter 27


    # USB Drivers . . .


    We will discuss USB devices, what they are, the standard that describes them,
    the topology of the connection of hubs, peripherals and host controllers, and
    the various descriptors involved. We''ll consider the different kinds of classes
    and data transfers possible. Then we will see how USB has been implemented under
    Linux. We review registration/deregistration of USB devices. We''ll describe the
    entry points to the driver and some of the main functions and data structures
    in the USB API. Finally, we''ll do a code walkthrough on a simple USB driver.


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_272_0.png)


    | | |

    |---|--|

    | 27.1 | What is USB? | 257 |

    | 27.2 | USB Topology | 258 |

    | 27.3 | Descriptors | 259 |

    | 27.4 | USB Device Classes | 260 |

    | 27.5 | Data Transfer | 260 |

    | 27.6 | USB under Linux | 261 |

    | 27.7 | Registering USB Devices | 262 |

    | 27.8 | Example of a USB Driver | 264 |

    | 27.9 | Labs | 266 |


    # 27.1 What is USB?


    +   * USB stands for Universal Serial Bus. It permits easy connection of multiple
    peripheral devices to one port, and automatic, hotplug, configuration of devices
    attached (and detached) while the computer is running. Virtually any type of peripheral
    (with USB capability) can be connected to a USB port; i.e., scanners, modems,
    network cards, mice, printers, mass storage devices, etc.

    * Version 1.0 of the specification was released in January 1996 by an alliance
    of Compaq, Intel, Microsoft and NEC. Version 1.1 was released in September 1998,
    and version 2.0 was released in 1999.

    * One thing to be careful about when considering the USB 2.0 standard is that
    when the phrase full speed or low speed is used, it stands for USB 1.1. The newer
    standard is described as high speed.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '• Up to 127 devices can be connected simultaneously. The USB cable contains
    four wires; power, ground and two signal wires. In the original standard, the
    ideal total bandwidth was limited to 12 Mbit/s, but overheads limited this to
    something like 8.5 Mbit/s and realistic performance was probably as low as 2 Mbit/s.
    USB 2.0 brought a theoretical speed limit of 480 Mbit/s.


    • Devices may be either low or high speed, or operate in either mode according
    to function. A high speed device hooked up to a USB 1:1 controller or hub will
    be limited to lower capabilities.


    • Power can be delivered either through the USB cable or through a peripheral''s
    own power supply. A total of up to 500 mA can be supplied through each controller.
    When a device is plugged in it can initially grab up to 100 mA and request more
    if limits are not exceeded.


    • The kernel contains a lot of USB-related documentation in the /usr/src/linux/Documentation/usb
    directory.


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_273_0.png)


    +   • Support for the new USB 3.0 standard (also known as XHCI) has been included
    in kernel version 2.6.31, making Linux the first operating system to incorporate
    it.


    +   • USB 3.0 is designed for a transfer rate of up to 5 GBit/s, decreases power
    consumption, and is downward compatible with USB 2.0.


    # 27.2 USB Topology


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_273_1.png)


    Figure 27.1: USB Topology


    +   • USB ports are incorporated in all modern motherboards. In most cases there
    are at least 2 ports. The ports can be connected either directly to devices or
    to hubs, which themselves can be connected to more hubs or devices. There is a
    virtual root hub simulated by the host controller. The total number of ports plus
    hubs is 127.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# 27.3. DESCRIPTORS


    +   - Technically, the physical structure of USB is not that of a bus; it is a
    tree with upstream and downstream nodes. Each device can have only one upstream
    connection (with a type A connector), but a hub node can have more than one downstream
    connection (with a type B connector).


    +   - For USB 1.x, there are two types of host controllers:

    - OHCI (Open Host Controller Interface) from Compaq.

    - UHCI (Universal Host Controller Interface) from Intel.


    UHCI is simpler and thus requires a somewhat complex device driver. Peripherals
    should work equally well with either controller.


    +   - For USB 2.0, the standard is EHCI (Enhanced Host Controller Interface.)


    +   - Upon hooked up to the bus, a peripheral identifies itself as belonging to
    one of several classes. When a particular driver is loaded it will claim the device
    and handle all communication with it.


    # 27.3 Descriptors


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_274_0.png)


    Figure 27.2: USB Descriptors


    +   - Each USB device has a unique device descriptor, assigned to it when the
    peripheral is connected to the bus. In addition it gets a device number assigned
    (an integer ranging from 1 to 127). The descriptor has all pertinent information
    applying to the device and all of its possible configurations.


    +   - A device has one or more configuration descriptors. This has specific information
    about how the device may be used.


    +   - Each configuration points to one or more interface descriptors. Each interface
    might point to various alternate settings about how the device might be used.
    For instance, a video camera could have three alternate settings, which require
    different bandwidths: camera activated, microphone activated, and camera and microphone
    activated.


    +   - Each interface points to one or more endpoint descriptors, which give the
    data source or sink of the device. (All control transfers use an end point of
    zero.)'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# 27.4 USB Device Classes


    If a device plugs into the USB belongs to a well-known device class, it is expected
    to conform to certain standards with respect to device and interface descriptors.
    Thus the same device driver can be used for any device that claims to be a member
    of class. The following classes are defined in the standard:


    Table 27.2: USB Device Classes


    | Base Class | Descriptor Usage | Description | Examples |

    |---|---|---||

    | 00h | Device | Unspecified | Use class information in the interface descriptors
    |

    | 01h | Interface | Audio | speakers, microphones. sound cards |

    | 02h | Both | Communications and CDC Control | network adapters, modems, serial
    port adapters |

    | 03h | Interface | HID (Human Interface Device) | mice, joysticks, keyboards
    |

    | 05h | Interface | Physical | force feedback joystick |

    | 06h | Interface | Image | digital cameras |

    | 07h | Interface | Printer | printers |

    | 08h | Interface | Mass Storage | flash drives, MP3 players, memory card readers
    |

    | 09h | Device | Hub | full and high speed hubs |

    | 0Ah | Interface | CDC-Data | used with CDC Control |

    | 0Bh | Interface | Smart Card | smart card readers |

    | 0Dh | Interface | Content Security | security |

    | 0Eh | Interface | Video | webcams |

    | 0Fh | Interface | Personal Healthcare | healthcare devices |

    | DCh | Both | Diagnostic Device | USB compliance testing devices |

    | E0h | Interface | wireless controller | bluetooth and wi-fi adapters |

    | EFh | Both | Miscellaneous | ActiveSync devices |

    | FEh | Interface | Application Specific | irda bridge |

    | FFh | Both | Vendor Specific | devices needing vendor specific devices |


    Other devices require a fully customized device driver be written.


    # 27.5 Data Transfer


    There are the following types of data transfer to and from USB devices:


    Control transfers are short commands that configure and obtain the state of devices.
    While there may be also specific commands, most or all devices will support the
    following standard set defined in /usr/linux/include/usb/ch9.h:


    | | | |

    |---|---||

    | 3.1: | 79 #define USB_REQ_GET_STATUS | 0x00 |

    | 3.1: | 80 #define USB_REQ_CLEAR_FEATURE | 0x01 |

    | 3.1: | 81 #define USB_REQ_SET_FEATURE | 0x03 |'
