  md: '# # Chapter 8


    # # Modules II: Exporting, Licensing and Dynamic Loading


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_92_0.png)


    We''ll see how symbols are **exported** from the kernel to modules and from one
    module to another. We''ll discuss some aspects of **module licensing**. We''ll
    consider demand and dynamic loading and unloading of modules. We''ll see what
    changes are necessary in order to make a driver part of the kernel proper instead
    of a module.


    | 8.1 | Exporting Symbols | . . . . . . . . . . . . . . | 77 |

    | 8.2 | Module Licensing | . . . . . . . . . . . . . . . . | 78 |

    | 8.3 | Automatic Loading/Unloading of Modules | . . . | 80 |

    | 8.4 | Built-in Drivers | . . . . . . . . . . . . . . | 81 |

    | 8.5 | Labs | . . . . . . . . . . . . . . . . . . . . | 83 |


    # ## 8.1 Exporting Symbols


    +   - In order for built-in kernel code to make a symbol (i.e., a variable or
    function) available for use by modules, it has to properly **export** it. If a
    module has symbols which are to be used by modules which are loaded after it is,
    it also has to export the symbol.

    - This is accomplished with the use of the `EXPORT_SYMBOL()` macro:


    ```

    int my_variable;

    int my_export_fun() { ...... };

    EXPORT_SYMBOL(my_variable);

    EXPORT_SYMBOL(my_export_fun);

    ```


    +   - Note that the symbols will be exported even if they are declared as static.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# CHAPTER 8. MODULES II: EXPORTING, LICENSING AND DYNAMIC LOADING


    It is also possible to export symbols with the macro:


    ```

    EXPORT_SYMBOL_GPL();

    ```


    Exactly how this macro should be used and interpreted has sometimes been controversial.
    Certainly it means quite the symbol can be quartered only to modules which are
    licensed under the GPL; e.g., it can''t be used in binary-drivers. However, some
    feel it should be done only for modules which are used by the kernel for the basic
    functions.


    There are other specialized methods of exporting symbols:


    ```

    EXPORT_PER_CPU_SYMBOL();

    EXPORT_PER_CPU_SYMBOL_GPL();

    EXPORT_SYMBOL_GPL_FUTURE();

    EXPORT_UNUSED_SYMBOL();

    EXPORT_UNUSED_SYMBOL_GPL();

    ```


    Kernels earlier than the 2.6 exported all global symbols in a module unless they
    were explicitly declared as static; that is one reason why we use the static keyword
    so liberally in kernel code, for the purpose of declaring name pollution.


    Note that it still makes sense to declare symbols as static; if the code is compiled
    as built-in would the kernel is just one big program. Indeed the usual rule of
    thumb is that all symbols should be declared static unless there is a need to
    do otherwise.


    # 8.2 Module Licensing


    Modules can be licensed with the MODULE_LICENSE() macro, as in:


    ```

    MODULE_DESCRIPTION("Does Everything")

    MODULE_AUTHOR("Vandals with Handles")

    MODULE_LICENSE("GPL v2");

    ```


    The following licenses are understood by the kernel:


    Table 8.1: Licenses


    | License | Meaning | Tainted? |

    | GPL | GNU Public License, V2 or later | No |

    | GPL v2 | GNU Public License, V2 | No |

    | GPL and additional rights | GNU Public License, V2 rights and more | No |

    | Dual BSD/GPL | GNU Public License, V2 textbier BSD license choice | No |

    | Dual MPL/GPL | GNU Public License, V2 or Mozilla license choice | No |

    | Dual MIT/GPL | GNU Public License, V2 or MIT license choice | No |

    | Proprietary | Non free products (as in freedom, not free beer) | Yes |'
  merge: -1
