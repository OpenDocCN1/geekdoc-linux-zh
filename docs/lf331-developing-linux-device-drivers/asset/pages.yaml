    # 9.1 oops Messages


    +   - oops messages indicate that a fault occurred in kernel mode. Depending on
    the nature of the fault produced the oops, the fault may be fatal, serious, or
    inconsequential.

    - If the oops occurs in process context the kernel will attempt to back out of
    the current task, probably killing it. If it occurs in interrupt context the kernel
    cannot do this and will crash, as will if it occurs in either the idle task (pid=0)
    or init (pid=1).

    - The information provided contains a dump of the processor registers at the time
    of the crash and a call trace indicating where it failed. Sometimes this is all
    one may need.

    - Getting the most out of oops messages, and almost all kernel debugging techniques,
    requires having at least some familiarity with assembly language. For an example
    of how to work through an oops see http://lkml.org/lkml/2008/1/7/406.

    - In order to cause an oops deliberately, one can do'
