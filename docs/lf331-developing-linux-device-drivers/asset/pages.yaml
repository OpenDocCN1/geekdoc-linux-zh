- pgno: 49
  md: '# CHAPTER 4. MODULES I: BASICS


    +   * In the module_param_array() macro the integer variable num gives the elements
    in the array which can be used as the following example:


    ```

    $ /bin/insmod my_project.ko irq=3,4,5

    ```


    +   * The module_param_string() macro is for passing a string directly to a char
    array.


    +   * With this method it is possible to build your own data types; it is extensible.
    For more details see http://lwn.net/Articles/22197/


    +   * A feature of this is that it still works using a driver, or other kernel
    facility, is possible as built-in rather than a module. Kernels earlier 2.6 required
    a separate set of functions (using __setup() macros) to pass parameters to the
    kernel on the boot command. This makes it easier to write code that can be used
    as either a module or built-in without changing the source.


    +   * The way to pass such a parameter to the kernel as a boot parameter is to
    prefix its name with the name of the module and a_; thus the kernel boot command
    line might look like:


    ```

    linux root=LABEL=/ ... my_project.irq=3,4,5 ...

    ```


    A list of all known parameters can be found at /usr/src/linux/Documentation/kernelparameters.txt.


    +   * There are a number of related macros, defined in /usr/src/linux/include/linux/module.h
    that can be used in modules:


    ```

    MODULE_AUTHOR(name);

    MODULE_DESCRIPTION(desc);

    MODULE_SUPPORTED_DEVICE(name);

    MODULE_PARM_DESC(var,desc);

    MODULE_FIRMWARE(filename);

    MODULE_LICENSE(license);

    MODULE_VERSION(version);

    ```


    +   * The information stored there is generated by running the command modinfo.


    # 4.5 Compiling a Module


    +   * In order to compile modules you must have the kernel source installed, or
    at least these parts of it which are required. Those should always be found under
    /lib/modules/$(uname -r)/build.


    +   * The simple-minded way to compile a module would require specifying the flags
    and options, and pointing to the correct kernel headers. However, method has long
    been deprecated and it has now become impossible to compile completely without
    the kernel source tree.


    +   * The compilation of modern modules requires a kernel source which has either
    been through a compilation stage, or at least has through a make modules_prepare,
    as this is required to generate necessary configuration and dependency information.
    Also one, needs of a .config containing the kernel configuration.


    +   * The approved approach is still to work outside the kernel source tree, but
    to jump into it to do the compilation. For you''ll need at least a minimal Makefile
    with at least the following in it:


    ```

    obj-m += trivial.o

    ```


