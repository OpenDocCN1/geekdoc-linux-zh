- pgno: 20
  md: '# 2.2. LINUX DISTRIBUTIONS


    # 2.2 Linux Distributions


    There are many Linux distributions, ranging from very widely to obscure. They
    vary by intended usage, hardware and audience, as well as support level. A very
    comprehensive list can be found at http://lwn.net/distributions/


    We have tried to keep this material as distribution-agnostic as possible and thus
    we will focus on vanilla kernels as obtained from http://www.kernel.org. For all
    but the most specialized distributions this won''t present any inconveniences.


    You should be able to do any of the laboratory exercises provided herein on any
    major distribution using the vendor-supplied kernel, as long as you have the kernel
    source or development packages installed. Furthermore, the supplied solutions
    should compile and as long as the kernel is not too antique; some minor fiddling
    may be necessary for kernels earlier 2.6.26.


    Occasionally which distribution you are using will matter, but this should only
    happen when we (reluctantly) descend into system administration, as when we must
    describe the location of particular files and directories or how to install certain
    required software packages. Fortunately, modern distributions differ much less
    in matters than they did in the early days of Linux and we will rarely have to
    deal with such incursions.


    The material has been developed primarily on Red Hat-based systems, mostly on
    64-bit variants with testing also It has also been tested on a number of other
    distributions. Explicitly we have used:


    +   - Red Hat Enterprise Linux 5, 6

    - Fedora 15

    - CentOS 5, 6

    - Scientific Linux 5, 6

    - Open Suse 11.3

    - Debian Lenny and Squeeze

    - Ubuntu 10.10, 11.04

    - Gentoo


    As far as software installation and control is concerned distributions tend to
    use either RPM-based or deb-based package management. In the above list Red Hat,
    Fedora, CentOS, Scientific and OpenSUSE are RPM-based, Debian and Ubuntu deb-based.
    When necessary we will give required instructions for either of these two families.


    GENTOO is based on neither of this packaging systems, and instead uses the portage/emerge
    system which involves compiling directly from source. If you are a GentOO user,
    and you have successfully accomplished a fully functional installation (which
    is generally not a task for novices) you won''t need detailed instructions on
    how to install software or find things, and so we won''t insult you by offering
    it.


    If you are running any other distribution you shouldn''t have any trouble adapting
    what we are doing to your installation.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 2.3 Kernel Versions


    +   - For this class we have a number of choices to use for our running kernel
    and kernel sources. We will be working with the latest stable Linux kernel series,
    version 2.6.

    - The lab exercise solutions are designed to work with the most recent Linux kernels
    (3.1 as of this writing) and with some minor tweaks (which are incorporated in
    the solutions) as far back as 2.6.26 and even earlier (2.6.18) with a few fewer
    tweaks. They should also work with all major distributor kernels of the same vintage.

    - Because the 2.4 kernel series is still occasionally in usage, we will point
    out important features that have changed. However, differences with the previous
    generations of production kernels (2.2, 2.0) will be mentioned only briefly for
    historical purposes.


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_21_0.png)


    +   - From place to place in this material you find boxes like these, that indicate
    the discussion kernel version dependency.

    - They may highlight kernel features that are new or have been recently modified,
    under development, and marked as deprecated.


    The parts of the source to the Linux kernel that are necessary for external module
    compilation (the kernel-dev package) should already be installed on your system.


    The latest stable releases of the various kernel versions can be obtained from
    http://www.kernel.org, as the latest development kernel, released by Linus Torvalds.
    A number of fusing stores also exist, but are not the same provenance as the main
    kernel web site. For examples there are staging trees for network issues, USB,
    etc.


    One more deserving special mention is the linux-next project, information about
    which is at http://linux-fseidel.de/linux-next/pmwiki/ This kernel accumulates
    patch sets for the next kernel version, i.e., while 3.2 is being developed the
    linux-next collects and debugs material appropriate for 3.3 and shakes out conflicts.


    +   - Hy using the site''s finger server, you can ascertain the latest kernel
    versions:

    $ @kernel.org


