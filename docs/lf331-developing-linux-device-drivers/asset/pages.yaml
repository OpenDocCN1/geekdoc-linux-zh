    # 27.9 Labs


    Lab 1: Installing a USB obuf


    +   - We are going to write a simple USB device driver.

    - The driver should register itself with the USB subsystem upon loading and unregister
    upon unloading.

    - The probe() and disconnect() functions should issue printout whenever the device
    is added or removed from the system.

    - By proper use of the usb_device_id table, you can configure your driver either
    to sense any device plugged, or only a specific one. You can obtain the vendor
    and device ID''s by noting the output when the USB subsystem senses connection.

    - You will have to make sure your kernel has the proper USB support compiled in,
    and that no driver for the device is already loaded, as it may interfere with
    your driver claiming the device.

