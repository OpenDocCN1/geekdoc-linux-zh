  md: "# CHAPTER 16. TRANSFERRING BETWEEN USER AND KERNEL SPACE\n\n# 16.1 Transferring\
    \ Between Spaces\n\n+   - User-space applications in a different (virtual) memory\
    \ space than does the kernel.\n\n+   - When an address is passed to the kernel,\
    \ it is the virtual address in user-space. An example would be the pointer to\
    \ buf in the read() and write() driver entry points.\n\n+   - Any attempt from\
    \ within the kernel to directly access these pointers is a good recipe for disaster.\
    \ As a matter of principle, these addresses may not be meaningful in kernel-space.\n\
    \n+   - One might get away with dereferencing a pointer passed from user-space\
    \ - for a while. If a page gets swapped out, disaster will occur. The moral of\
    \ the story is that one should never directly dereference a user-space pointer\
    \ in kernel-space.\n\n+   - The functions which accomplish the transfer do two\
    \ distinct things:\n\n+   - Verify the user-space address, and handle any page\
    \ faults that may occur if the page is currently not resident in memory.\n\n+\
    \   - Perform a copy between the user and kernel addresses.\n\n+   - Using raw\
    \ I/O or memory mapping can avoid copying.\n\n# 16.2 put(get)user() and copy_to(from)user()\n\
    \n+   - All the following functions can be used only in the context of a process,\
    \ since they must refer to the current process's task_struct data structure in\
    \ order to do the address translation. Calling them from an interrupt routine\
    \ is another good recipe for disaster.\n\n+   - One should never surround the\
    \ following transfers with a spinlock, as they may go to sleep, in which case\
    \ your driver (or even the system) could get hung, as the spinlock might never\
    \ be released.\n\n```\n#include <linux/uaccess.h>\n\naccess_ok(int type, unsigned\
    \ long addr, unsigned long size);\n\nint get_user(lvalue, ptr);\nint    __get_user(lvalue,\
    \ ptr);\n\nint put_user(expr, ptr);\n    __put_user(expr, ptr);\n\nunsigned long\
    \ [_]copy_from_user (\n    void *to,\n    const void __user *from,\n    unsigned\
    \ long n);\n\nunsigned long [_]copy_to_user (\n    void __user *to,\n    const\
    \ void *from,\n    unsigned long n);\n\nlong [_]strncpy_from_user(char *dst, const\
    \ char *src, long count);\nlong strlen_user(const char *str);\nlong strn_user(const\
    \ char *str, long n);\nunsigned long [_]clear_user(void *mem, unsigned long len);\n\
    ```"
