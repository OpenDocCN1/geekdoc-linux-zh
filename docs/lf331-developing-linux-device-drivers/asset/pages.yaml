- pgno: 35
  md: '# 3.2 Mechanism vs. Policy


    +   - Device drivers should maintain a clear distinction between mechanism and
    policy.


    +   - By mechanism, we mean providing flexibly the abilities that the device itself
    can capably perform. By policy, we mean controlling how those capabilities are
    used.


    +   - In other words it is not up to the driver to enforce certain decisions (unless
    there is a hardware limitation) such as:


    +   - How many processes can use the device at once.


    +   - Whether I/O is blocking or non-blocking, synchronous or asynchronous, etc.


    +   - Whether certain combinations of parameters can never occur even if they
    are unwise.


    Often a driver may come with a user-space control program, or daemon, which has
    the capability of controlling device policy. As such, it should provide methods
    of setting parameters and modifying behaviour, perhaps through the use of ioctl(),
    /proc, /sys etc.


    A driver who fails to distinguish between mechanism and policy is a driver destined
    for trouble. Tomorrow''s user may have quite different needs than today''s. Being
    human, the driver developer may even forget why a narrowing of choices was made.
    One should never underestimate the likelihood of a user behaving in an unexpected
    fashion.


    # 3.3 Avoiding Binary Blobs


    +   - There is a method of deploying a Linux device driver which has been promoted
    by certain vendors, with which we strongly disagree.


    +   - The essence of this method is to separate the driver into two parts:


    +   - A binary blob, for which the source is not given. This blob may contain
    all or part of the driver from another operating system (usually from you-know-who.).


    +   - An open-source glue layer, which calls into the binary blob as well as the
    kernel API.


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_35_0.png)


    Figure 3.3: Using Binary Blobs in drivers'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# 3.4. HOW APPLICATIONS USE DEVICE DRIVERS


    +   - Well known examples of this method are employed by the Nvidia graphics drivers
    and ndiswrapper wireless and NIC drivers.


    +   - With this method the driver writer can contain in the binary blob whatever
    has been ported from another operating system, or whatever code is wished to remain
    private; the first reason may be legal under Linux licensing, while the second
    is definitely not.


    +   - When such a driver is loaded the kernel becomes tainted means it is impossible
    to debug properly because there is not source available for all the running code.


    +   - We strongly disapprove of this method for many reasons, but two are sufficient:


    +   - Loading arbitrary binary code into the kernel is a recipe for disaster.


    +   - Manufacturers promote this as Linux support and don''t support the development
    of genuine open-source drivers.


    Thus, we won''t teach this method and we discourage the use of such drivers, much
    less their development.


    +   - Use of binary firmware is not the same as the methods described above. This
    firmware is data that could have been put in memory of the card, but vendors find
    it cheaper to have the operating system load it. Use of firmware does not causing
    taint.


    +   - The line between firmware and binary blobs is gray, and there are Linux
    distributions that have problems distributing drivers with require binary firmware,
    or which don''t distribute the binary firmware itself.


    # 3.4 How Applications Use Device Drivers


    +   - The Unix philosophy is to use a number of elementary methods connected through
    both piping and nesting to accomplish complex tasks.


    +   - User applications (and daemons) interact with peripheral devices using the
    same basic system calls irrespective of the specific nature of the device.


    +   - For the moment we''ll leave networking device drivers out of the mix since
    they are not reached through filesystem entries; we will concentrate on character
    drivers which have thinner layers between the applications and the device driver,
    and between the hardware and the device driver.


    +   - For each one of the limited number of these system calls, there is a corresponding
    entry point in the driver. The main ones for character drivers are:


    ```

    open(), release(), read(), write(), lseek(), ioctl(), mmap()

    ```


    +   - Strictly speaking, the name of the system call and the entry point may differ,
    but in the above list the only one that is the system call close() which becomes
    an entry point. However, the return type of the system call as well as the arguments
    can be quite different from that of the entry point.


    +   - Note that there are other kinds of callback functions that may exist in
    a driver, which are not directly reached by user system:'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# CHAPTER 3. DEVICE DRIVERS


    - Loading and unloading the driver cause initializing and shutting down callbacks
    to get invoked.


    - Higher layers of the kernel may call functions for such things as power management.


    - The driver may execute a deferred task, such as after a given amount of time
    has elapsed, or a condition has become true.


    - Interrupts may cause asynchronous execution of driver code, if the driver is
    registered to handle particular interrupts.


    +   - Once a device driver is loaded, therefore, its methods are all registered
    with the kernel, and it is event-driven; responds to direct entries (which can
    be multiple and simultaneous) from user applications, and it executes code as
    requested by other kernel layers and in response to hardware provocation.


