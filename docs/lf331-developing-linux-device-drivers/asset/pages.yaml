- pgno: 231
  md: "# 21.6 The New Way: Device Trees\n\n+   - A device tree is a textual representation\
    \ of a board's hardware configuration. It can be passed to the kernel at boot\
    \ time.\n\n+   - Device trees can abstract the board-specific differences into\
    \ boot-time data and allow generic kernels to run. Boards are thus no longer bound\
    \ to a single kernel build.\n\n+   - The basic data format is as follows: The\
    \ device tree is a simple tree structure of nodes and properties:\n\n+   - Properties\
    \ are key-value pairs.\n- Nodes may contain both properties and child nodes.\n\
    \n+   - For example, the following is a simple tree in the .dts format:\n\n```\n\
    //\node1 {\n  a-string-property = \"A string\";n  a-list-property = \"first string\"\
    , \"second string\";\n  a-byte-data-property = [0x01 0x23 0x34 0x56];\n  child-node\
    \ {\n    first-child-property;\n    second-child-property = <|>;\n    a-string-property\
    \ = \"Hello, world\";\n  }\n  child-node2 {\n  }\n}\node2 {\n  a-empty-property;\n\
    \  a-cell-cells = <1 2 3 4>; /* each number (cell) is a uint32 */\n  child-node\
    \ {\n  }\n}\n```\n\nSome good references on all can be found at: http://devicree.org/mediawiki/index.php?title=Device\
    \ Tree Usage, https://lkml.org/lkml/2011/06/13/143 and https://lkml.org/lkml/2011/06/16/14.\n\
    \n+   - Here is part of the device tree for the NVIDIA Tegra board.\n\n```\n//\n\
    compatible = \"nvidia,harmony\", \"nvidia,tegra250\";\n#address-cells = <1>;\n\
    #size-cells = <1>;\ninterrupt-parent = <&intc>;\n\nchosen {\n  aliases { };\n\
    }\nmemory {\n  device_type = \"memory\";\n  reg = <0x00000000 0x40000000>;\n}\n\
    \nsoc {\n```"
  merge: -1
