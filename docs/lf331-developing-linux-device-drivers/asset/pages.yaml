- pgno: 19
  md: '# CHAPTER 2. PRELIMINARIES


    +   Lab solutions are made available so you can see at least one successful implementation,
    and have a possible template to begin the next lab exercise if it is a follow
    up. In addition, examples as shown during the exposition are made available as
    part of the SOLUTIONS package, in the EXAMPLES subdirectories. Once you have obtained
    the solutions you can unpack it with:


    ```

    $ tar zxvf LF331_SOLUTIONS*.tar.gz

    ```


    or


    ```

    $ jxvf LF331_SOLUTIONS*.tar.bz2

    ```


    substituting the actual name of the file.


    +   In the main solutions directory, there is a Makefile which will recursively
    compile all subdirectories. It is smart enough to differentiate between kernel
    code, user applications, and whether multi-threading is used.


    +   There are some tunable features; by default all sub-directories are recursively
    compiled against the source of the currently running kernel. One can narrow the
    choice of directories, or pick a different kernel source in the following examples,
    or pick a different architecture:


    ```

    $ MKDIRS=$_22

    $ KOTDIR=/lib/modules/3.1.0/build

    $ MKDIRS=$_0.0*23

    $ KOTDIR=/lib/modules/linux-3.1.0/build

    $ ARCH=i386

    $ ARCH=arm CROSS_COMPILE=arm-toolchain-linux-gnueabi-

    ```


    where KOTDIR points to the kernel source files. On an x86_64 platform, specifying
    i386 will 32-bit modules. To build a kernel for ARM on an x86 host, we need a
    cross-compiler installed and the CROSS_COMPILE flag set. The CROSS_COMPILE flag
    is used to specify the compiler-prefix. The actual prefix by your toolchain may
    vary e.g. arm-linux-eabi-gcc binary will have arm-linux-eabi- as compiler prefix.
    The genmake script in the main directory is very useful for automatically generating
    makefiles, and is worth a perish.


    +   For this to work, the kernel source has to be prepared; in particular it has
    to have a configuration file (.config in the kernel source directory) and proper
    dependencies set up.


    +   One note that we have emphasized clarity and brevity rigor in the solutions;
    e.g., we haven''t tried to catch every possible error or take into account every
    possible kernel configuration option. The code is not bullet-proof; it is meant
    to be pedagogical.


    +   If you have any questions or feedback on this material contact us at: trainingquestions@linuxfoundation.org.


    +   The provided solutions from time to contain functions and features not discussed
    in the main text.


    +   This is done to illustrate methods to do more than the minimum work to solve
    the problem and teach extra material.


    +   If there is anything that must be used and is not covered in the material,
    it is a bug, not a feature, and should be brought to our attention.'
  merge: -1
