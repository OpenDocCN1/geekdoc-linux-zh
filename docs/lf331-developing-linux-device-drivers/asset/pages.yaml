  md: '# Chapter 30


    # Asynchronous I/O**


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_292_0.png)


    We will discuss asynchronous I/O, the functional interface for it, and methods
    of implementation under Linux.


    +   30.1 What is Asynchronous I/O? ... 277

    30.2 The Posix Asynchronous I/O API ... 278

    30.3 Linux Implementation ... 279

    30.4 Labs ... 281


    ** These sections may be considered in part or in whole as optional. They contain
    either background reference material, specialized topics, or advanced subjects.
    The instructor may choose to cover or not cover them depending on classroom experience
    and time constraints


    # 30.1 What is Asynchronous I/O?


    +   * all I/O operations are performed synchronously; an application will block
    until the read or write is completed, successfully or unsuccessfully.


    +   * Note that this doesn''t mean all writes are flushed to disk immediately,
    only that interaction with the virtual file system has been completed.


    +   * But if I/O requests could be queued, and program execution continued in
    parallel with completion of the I/O request? This can be particularly useful on
    SMP systems and when using DMA, which does not involve the CPU. When this is done,
    it is called asynchronous I/O, or AIO.


    +   * In order for this to work properly, there has to be notification when the
    I/O request is complete and code contain synchronization points, or completion
    barriers.


    +   * In addition, policies must be set as whether queued requests are serialized,
    especially when they refer to the same file descriptors.'
  merge: -1
  img_proc: true
- pgno: 293
  md: "+   ■ You can request asynchronous I/O by using the ASYNC flag when opening\
    \ a file, or the -o async option\nto the mount command, but this won't give true\
    \ asynchronous I/O.\n\n# 30.2 The Posix Asynchronous I/O API\n\n+   ■ The POSIX\
    \ 1.b standard defines a basic data structure, the aiocb, which stands for AIO\
    \ control\nblock, and a set of basic functions that can be performed on\n/usr/include/aio.h\
    \ and are provided with glibc.\n\n+   ■ The data structure looks like:\n\n```\n\
    struct aiocb\n{\n    int aio_fildes;           /* File descriptor. */\n    int\
    \ aio_lio_opcode;      /* Operation to be performed. */\n    int aio_reprio; \
    \         /* Request priority offset. */\n    volatile *aio_buf;       /* Location\
    \ of buffer. */\n    size_t aio_nbytes;       /* Length of transfer. */\n    struct\
    \ sigevent aio_sigevent;  /* Signal number and value. */\n    __off64_t aio_offset;\
    \     /* File offset */\n};\n\n```\n\nwhere we have omitted thery members of the\
    \ data structure.\n\n+   ■ aio_fildes can be any valid file descriptor, but it\
    \ must permit one of the seek(1) call.\n■ aio_lio_opcode is used by the lio_listio()\
    \ function and stores information about the type of opera-\nt to be performed.\n\
    ■ aio_reprio is used to control scheduling priorities.\n■ aio_buf points to the\
    \ buffer where the data is to be written or read from.\n■ aio_nbytes is the length\
    \ of the buffer.\n■ aio_sigevent controls how any signal is sent to the I/O calling\
    \ process when the operation completes.\n■ aio_offset gives the offset in the\
    \ file where the I/O should be performed; this is necessary because\ndoing I/O\
    \ operations in parallel voids the concept of a current position.\n\nThe basic\
    \ functions are actually not part of glibc proper, but are part of another library,\
    \ librt. These\nfunctions are:\n\n```\n#include <aio.h>\n\nvoid aio_init(const\
    \ struct aiocb *init);\nint aio_read(struct aiocb *cb);\nint aio_write(struct\
    \ aiocb *cb);\nint aio_exec(int mode, struct aiocb *const cblist[], int n, struct\
    \ sigevent *sig);\nint aio_error(const struct aiocb *cb);\nsize_t aio_return(const\
    \ struct aiocb *cb);\nint aio_fsync(int op, struct aiocb *cb, const cblist[],\
    \ int n,\n              const struct timespec *timeout);\nint aio_cancel(int fd,\
    \ struct aiocb *cb);\n\n```"
