    \ returns 0 for success, a negative number for failure.\n- Before the driver is\
    \ registered the all-important usb_driver structure must be fully initialized.\
    \ It can be found in /usr/src/linux/include/usb.h and usb.h looks like:\n\n```\n\
    struct usb_driver {\nconst char *name;\nint (*probe)(struct usb_interface *int,\
    \ const struct usb_device_id *id);\nvoid (*disconnect)(struct usb_interface *int);\n\
    int (*ioctl)(struct usb_interface *int, unsigned code, void *buf);\nint (*suspend)(struct\
    \ usb_interface *int, pm_message_t *message);\nint (*resume)(struct usb_interface\
    \ *int);\nint (*reset_resume)(struct usb_device_id *int);\nconst struct usb_device_id\
    \ *ids_table;\nstruct usb_dynids *dynids;\nstruct usb_bdrv_wrap drvwrap;\nununsigned\
    \ int no_dynamic_autosuspend;\nunsigned int supports_autosuspend:1;\nunsigned\
    \ int soft_unbind:1;\n};\n```\n\n+   - name: the driver module. It must be unique\
    \ among all USB drivers, and will show up in /sys/bus/usb/drivers when the driver\
    \ is loaded.\n- probe() points to the function used to check for the device, and\
    \ is called when new devices are added to the USB bus. If the driver can claim\
    \ the device (based on the information in the usb_device_id structure passed to\
    \ it), the routine should initialize the device and return zero. If the driver\
    \ does not claim the device, it should return a negative value.\n- disconnect()\
    \ points to the function called when devices are removed from the USB bus, while\
    \ suspend() and resume() point to the functions used for power management.\n-\
    \ ioctl() will get called when a user-space program issues an ioctl() on the usbfs\
