    \        NULL)\n3.1: 178 #define wake_up_interruptible_sync(x)   __wake_up_sync((x),\n\
    \                                                TASK_INTERRUPTIBLE, 1)\n```\n\
    \nwhere\nTASK_NORMAL = TASK_INTERRUPTIBLE | TASK_UNINTERRUPTIBLE\n\n+   The code\
