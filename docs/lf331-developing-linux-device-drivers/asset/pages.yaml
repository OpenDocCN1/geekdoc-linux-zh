- pgno: 22
  md: "# 2.3. KERNEL VERSIONS\n\nThe latest 2.6.36 version of the Linux kernel: 2.6.36.4\n\
    The latest longterm 2.6.35 version of the Linux kernel: 2.6.35.13\nThe latest\
    \ longterm 2.6.34 version of the Linux kernel: 2.6.34.10\nThe latest longterm\
    \ 2.6.33 version of the Linux kernel: 2.6.33.16\nThe latest longterm 2.6.32 version\
    \ of the Linux kernel: 2.6.32.43\nThe latest longterm 2.6.27 version of the Linux\
    \ kernel: 2.6.27.59\n\n+   Kernel version numbering with 3 integers, the first\
    \ two indicating the major release number, and the third minor release number;\
    \ i.e, 2.6.39 or 2.4.33. In addition an extra string may be appended 2.6.33.1-rt11,\
    \ which is not truly part of the kernel version number. For instance, if a kernel\
    \ is\n\n```\nVERSION = 2\nPATCHLEVEL = 6\nSUBLEVEL = 33\nEXTRAVERSION = .1-rt11\n\
    ```\n\nin the main Makefile in the kernel source.\n\n+   The file /usr/src/linux/include/version.h\
    \ provides some macros to make easier:\n\n```\n#define LINUX_VERSION_CODE 132639\n\
    #define KERNEL_VERSION(a,b,c) (((a) << 16) + ((b) << 8) + (c))\n```\n\nwhere LINUX_VERSION_CODE\
    \ is obtained using the KERNEL_VERSION() macro. Not an equivalent statement would\
    \ be:\n\n```\n#define KERNEL_VERSION(a,b,c) ( a ) * 65536 + ( b ) * 256 + ( c\
    \ )\n```\n\nThis header file is constructed during compilation, and won't exist\
    \ on a pristine source.\n\n+   Version-dependent code can be handled in this example:\n\
    \n```\n#include <version.h>\n\nif LINUX_VERSION_CODE < KERNEL_VERSION(2,6,0)\n\
    \    call_usermodehelper(cmd, argv,envp);\nelse\n    call_usermodehelper(cmd,\
    \ argv,envp);\n```\n\n> Such explicit version dependence is frowned upon in the\
    \ official kernel tree. One is supposed to abandon backwards compatibility for\
    \ earlier kernel versions so as to keep things uncluttered and most efficient.\n\
    \n+   This attitude is viewed as inconvenient by external device driver maintainers\
    \ as it makes necessary to maintain different driver sources for older kernels\
    \ if bugs or security holes are patched.\n\n+   Beginning with the 2.6.11, a new\
    \ scheme was adopted in which fourth digit is for small patches that concern serious\
    \ bugs and security matters. Only non-controversial patches are accepted, and\
    \ are numbered as in 2.6.11.1, 2.6.11.2, 2.6.11.3 etc."
  merge: -1
  img_proc: true
- pgno: 23
  md: '# CHAPTER 2. PRELIMINARIES


    +   The idea brought a good measure of stability to the development process and
    quieted some complaints about not having a stable enough kernel for production.
    Rules concerning what sort of patches are accepted for this stable kernel tree
    can be found at /usr/src/linux/Documentation/stable.kernel.rules.txt.


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_23_0.png)


    +   The 3.0 Linux kernel version was released on July 22, 2011. This bump up in
    major number was not intended to reflect major changes or new features.


    +   Kernel numbering will now go back to three majors; major releases will increment
    the second digit, while stable updates will be reflected in the third digit, in
    3.0.1, 3.0.2, etc.


    +   Some tools used to build kernels have been modified to take care of the new
    scheme and others will eventually follow.


    # 2.4 Rolling Your Own Kernel


    +   For purposes of experimentation you may want to try using another kernel,
    in particular you may want to compile and install a vanilla kernel from http://www.kernel.org.
    In order to do this you need two files:


    +   - The compressed kernel source (e.g., linux-3.1.tar.bz2)

    - A configuration file (e.g., config-3.1_x86_64)


    +   The first of these files can be obtained from http://www.kernel.org, and the
    second can be obtained from http://training.linuxfoundation.org/course_materials/LF331.
    (These sample configuration files work properly in all circumstances, but have
    been tested and found to be sufficient in the vast majority of cases.)


    +   The following script (DO_KERNEL.sh), included in your solutions, can take
    care of all necessary steps of unpacking, configuring, and installing. You may
    want to put it in your path, perhaps by copying over to /usr/local/bin.linux-3.1.tar.bz2
    to do everything just type


    ```

    $ /DO_KERNEL.sh linux-3.1.tar.bz2 config-3.1_x86_64

    ```


    +   If the kernel source has already been unpacked and configured, just go to
    the kernel source directory and running the script with no arguments will take
    care of compilation and installation.


    ```

    #!/bin/bash

    ```


    # Script to compile and install the Linux kernel and modules.'
