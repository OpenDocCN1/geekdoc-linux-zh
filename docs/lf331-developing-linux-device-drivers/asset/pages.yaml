  md: '# Memory Zones

    (32-bit x86)


    | | 4 GB |

    |---|---|

    | HIGH | 896 MB |

    | NORMAL | 16 MB |

    | DMA (legacy ISA) | 0 MB |


    Figure 15.2: DMA, Normal and High Memory


    +   - When memory is allocated the kernel examines what flags were associated
    with the request and on that basis constructs a list of memory zones that can
    be used. When the flag GFP_DMA is requested, only pages in the DMA zone are considered.
    If GFP_HIGHMEM is specified, all three zones can be used to get a free page. If
    neither of these flags are given, both the normal and DMA zones are considered.
    On platforms where high memory is not a concept, GFP_HIGHMEM has no effect; i.e.,
    all memory is low, and memory is flat.

    - Linux permits us up to 64 GB of memory to be used on 32-bit systems, the limit
    per process is a less than 3 GB. This is because there is only 4 GB of address
    space (i.e., it is 32-bit limited) and the topmost GB is reserved for kernel addresses.
    The little is somewhat less than 3 GB because of some address space being reserved
    for memory-mapped devices.


    # 15.3 Page Tables


    +   - Memory is broken up pages of fixed size (4 KB on x86). Portable code should
    not depend on a particular page size. To obtain the actual value kernel code can
    use the PAGE_SIZE macro and user-space programs can call the function getpagesize().

    - For 4K pages, the lower 12 bits of the virtual address contain the offset; the
    remaining bits contain the virtual page frame number (PFN).

    - Pages of virtual memory may be in any order in physical memory. The processor
    converts the virtual PFN into a physical one, using page tables. Each entry in
    the page table contains a valid flag, the PFN, and access control information.'
