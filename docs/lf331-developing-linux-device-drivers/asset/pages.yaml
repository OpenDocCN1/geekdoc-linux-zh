    +   While this older API has not been removed, it is now just a wrapper around
    the more general interface, which should be used in any new code.


    # 22.6 DMA Pools


    +   Suppose you need small DMA transfers. For coherent transfers, dma_alloc_coherent()
    has a minimum size of one page. Thus, a good choice would set up a DMA Pool, which
    is essentially a slab cache for use in DMA transfers.


    +   The basic functions are:


    ```

    #include <linux/dmapool.h>


    struct dma_pool *dma_pool_create(const char *name, struct device *dev, size_t
    size,

    size_t align, size_t allocation);

    void dma_pool_destroy(struct dma_pool *dma_pool);

    ```'
