    # I/O Scheduling


    We consider I/O scheduling, and the various algorithms Linux uses.


    +   31.1 I/O Scheduling ........................................................................................
    283

    31.2 Tunables .................................................................................................................
    285

    31.3 noop I/O Scheduler ...................................................................................................
    286

    31.4 Deadline I/O Scheduler ............................................................................................
    286

    31.5 Completely Fair Queue Scheduler .....................................................................
    287

    31.6 Anticipatory I/O Scheduler ................................................................
    287

    31.7 Labs ................................................................................................................................
    288


    # 31.1 I/O Scheduling


    +   - The I/O scheduler provides the interface between the generic block layer
    and low-level physical device drivers. Both the VM and VFS layers submit I/O requests
    to block devices; it is the job of the I/O scheduling layer to prioritize and
    order these requests before they are given to the block devices.

    - Any I/O scheduling algorithm has to satisfy (sometimes conflicting) requirements:

    - Hardware access times should be minimized; i.e., requests should be ordered
    according to physical location on the disk. This leads to an elevator scheme where
    requests are inserted in the pending queue in order.

    - Requests should be merged to the extent possible to get a big contiguous region
    as possible, which also minimizes disk access time.

    - Requests should be satisfied with low a latency as is feasible; indeed in some
    cases determinism (in the sense of deadlines) may be important.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# CHAPTER 31. I/O SCHEDULING


    Write operations can usually wait to migrate from caches to disk without stalling
    processes. Read operations, however, almost always require a process to wait for
    completion before proceeding further. Thus favoring reads over writes leads to
    better parallelism and system responsiveness.


    Processes should share the I/O bandwidth in a fair, or at least consciously prioritized
    fashion; even it means some performance slowdown of the I/O layer, process throughput
    should not suffer incurately.


    +   Since these demands can be conflicting, different I/O schedulers may be appropriate
    for different workloads; e.g., a large database server vs. a desktop system. In
    order to provide flexibility, the 2.6 Linux kernel has an object oriented scheme,
    in which pointers to the various needed functions are supplied in a data structure,
    the particular one of which can be selected at run time. This is done with:


    ```

    linux ... elevator=[anticipatory][cfq][deadline][noop]

    ```


    +   At least one of the I/O scheduling algorithms must be compiled into the kernel.
    We''ll discuss each of the following in some detail:


    +   - Anticipatory Scheduling (AS)

    - Completely Fair Queueing (cfq)

    - Deadline Scheduling

    - noop (A simple scheme)


    +   The default choice is a compile configuration option; for kernels before 2.6.18
    it was AS, while it is now CFQ but distributions may have a different preference.


    +   It is possible to use different I/O schedulers for different devices. The
    choice can be made easily through the command line, or within kernel code by calling
    the function


    ```

    int elevator_init(struct request_queue *q, char *name);

    ```


    For instance the generic block layer calls this function with name set equal to
    NULL so to get the default, while the block device driver calls it with name set
    equal to noop.


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_299_0.png)


    +   The anticipatory scheduler was removed in the 2.6.33 kernel.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# 31.2. TUNABLES


    +   - The gradual introduction of SSD (Solid State Drive) devices which use flash
    memory to emulate hard disks has important implications for I/O scheduling.

    - Such devices do not require an elevator scheme and require wear leveling to
    spread I/O over the devices which have limited write/erase cycles.

    - One can examine /sys/block/<device>/queue/rotational to examine whether or not
    the device is an SSD or not.


    # 31.2 Tunables


    +   - Each of the I/O schedulers exposes parameters which can be used to tune
    behaviour at run time. The parameters are accessed through the sysfs filesystem.


    +   - One can change the scheduler being used for a device:


    ```

    $ cat /sys/block/sda/queue/scheduler

    noop anticipatory deadline [cfq]

    echo noop > /sys/block/sda/queue/scheduler

    $ cat /sys/block/sda/queue/scheduler

    ```


    +   - The actual tunables vary according to the particular I/O scheduler, and
    can be found under:

    /sys/block/<device>/queue/iosched


    For example:

    $ ls -l /sys/block/sda/queue/iosched

    total 0

    -RW-r--r--r 1 root 4096 Mar 29 13:12 back_seek_max

    -RW-r--r--r 1 root 4096 Mar 29 13:12 back_seek_penalty

    -RW-r--r--r 1 root 4096 Mar 29 13:12 fifo_expire_async

    -RW-r--r--r 1 root 4096 Mar 29 13:12 fifo_expire_sync

    -RW-r--r--r 1 root 4096 Mar 29 13:12 group_isolation

    -RW-r--r--r 1 root 4096 Mar 29 13:12 low_latency

    -RW-r--r--r 1 root 4096 Mar 29 13:12 quantum

    -RW-r--r--r 1 root 4096 Mar 29 13:12 slice_async

    -RW-r--r--r 1 root 4096 Mar 29 13:12 slice_async_rq

    -RW-r--r--r 1 root 4096 Mar 29 13:12 slice_idle

    -RW-r--r--r 1 root 4096 Mar 29 13:12 slice_sync


    +   - We''ll discuss some of the tunables for the individual I/O schedulers.'
