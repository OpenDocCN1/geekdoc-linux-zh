  md: '# CHAPTER 15. MEMORY MANAGEMENT AND ALLOCATION


    +   - These create a new memory cache of type struct kmem_cache, with the name
    argument serving to identify it. All objects in the cache (there can be any) are
    size bytes in length, which cannot be more than 1024 pages (4 MB on x86).


    +   - The offset argument indicates alignment, or offset into the page for the
    objects you are allocating; normally you''ll give 0.


    +   - The last argument to kmem_cache_create() points to an optional constructor
    function used to initialize any objects before they are used; the header file
    contains more detailed information about the arguments and flags can be passed
    to this rarely used function.


    +   - The flags argument is a bitmask of choices given in /usr/src/linux/include/slab.h;
    the main ones are:


    Table 15.3: Memory Cache Flags


    | Flag | Meaning |

    |---|---|

    | SLAB_HWCACHE_ALIGN | Force alignment of data objects on cache lines. This improves
    performance but may waste memory. Should be set for critical performance code.
    |

    | SLAB_POTSON | Fill the slab layer with the known value, a5a5a5a5. Good for catching
    access to uninitialized memory. |

    | SLAB_RED_ZONE | Surrounded allocated memory with red zones that scream when
    touched, to detect buffer overflows. |

    | SLAB_PANIC | Cause system panic upon allocation failure. |

    | SLAB_DEBUG_FREE | Perform expensive checks on freeing objects |

    | SLAB_CACHE_DMA | Make sure the allocation is in the DMA zone. |


    +   - When your cache has deployed, name will show under /proc/slabinfo, and will
    show something like:


    ```

    slabinfo - version: 1.1

    kmem_cache             59 78 100 2 2 1

    mycache                0 1 4096 0 1 1

    ip_count              0 11 352 0 1 1

    tcp_tw_bucket           0 0 96 0 0 1

    tcp_bind_bucket         12 113 32 1 1 1


    size-8192(DMA)          0 0 8192 0 0 2

    size-8192               0 1 8192 0 1 2

    ...

    size-32(DMA)            0 0 32 0 0 1

    size-32                 888 8814 32 69 78 1

