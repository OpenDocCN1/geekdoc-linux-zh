- pgno: 263
  md: '# CHAPTER 25. NETWORK DRIVERS III: TRANSMISSION AND RECEPTION


    ```

    mynet_hw_tx(data, len, dev);


    return 0;

    }

    ```


    .ndo_start_xmit = my_start_xmit;


    +   * The driver has to put the data into one or more socket buffers, which are
    then passed off to a hardware-specific function, mynet_hw_tx(which you will have
    to write) which is responsible for actually getting the data onto the device.
    When it finished transmitting an interrupt will be issued and the socket buffers
    can be freed in the interrupt handler


    +   * A timestamp (the jiff value) is placed in the dev->trans_value, and the
    private data section of the structure (dev->priv), which has previously been declared
    to some kind of data structure including a skb file, is also used.


    +   * The above simple function can''t be the whole story. In particular one has
    deal with transmission timeouts, or any condition in which the device fails to
    respond.


    +   * When we initialized the net_device structure, we filled in a value for field
    dev->watchdog_time. Whenever a time value greater than the value has elapsed since
    dev->trans_value, and the socket hasn''t been freed by the hardware transmission
    function, the kernel networking code will cause the tx_timeout() function associated
    with the driver to be called. This function has to do whatever is necessary to
    ensure proper completion of in-progress transactions, and whatever is necessary
    to clear the problem.


    +   * One problem that can develop is that the output device generally has a limited
    amount of memory to store outgoing packets: when memory is filling, the driver
    will have to call netif_stop_queue() to notify the kernel it can''t accept any
    more outgoing data, and then call netif_wake_queue() when it is again ready to
    accept. Whether the number of outgoing packets is as few as one, or is many, drivers
    have to be prepared to deal with this eventuality.


    +   * Occasionally need need disable packet transmission from somewhere else than
    in the ndo_start_xmit() callback function. An example would be response to a re-configuration
    request. Rather than using netif_stop_queue(), one should implement the function:


    ```

    void net_tx_disable(struct net_device *dev);

    ```


    which avoids race conditions by making sure the ndo_start_xmit function is not
    already running on another CPU when it returns. The queue is still up as usual
    with netif_wake_queue().


    # Receiving Data


    +   * The handler will be invoked upon receipt of an interrupt from the network
    device, which will determine if it is being called because data has received,
    or because data has been sent. (Normally it will do this by checking some registers.)


    +   * Either the handler or the transmission routine must allocate (or re-use)
    any necessary socket buffers. Using dev_alloc_skb() for this allocation can be
    done during interrupt since it uses GFP_ATOMIC.


    +   * When the packet has successfully transmitted, the function netif_rx() gets
    to pass the buffer up to the higher network layers in the kernel.


    +   * Here''s a very simple example (without error checking) of a routine which
    would get called out of the interrupt handler, which takes as arguments a pointer
    to the network device, and one to a buffer of known length off the device:'
