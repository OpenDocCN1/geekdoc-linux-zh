  md: '# 15.7. EARLY ALLOCATIONS AND BOOTMEM()


    # 15.7 Early Allocations and bootmem()


    +   The maximum amount of contiguous memory you can obtain through the various
    __get_free_page() functions is 1024 pages (4 MB on x86). If you want more you
    cannot do it from a module, but the kernel does offer some functions for this
    during boot:


    ```

    #include <linux/bootmem.h>


    void *alloc_bootmem(unsigned long size);

    void *alloc_bootmem_low(unsigned long size);

    void *alloc_bootmem_pages(unsigned long size);

    void *alloc_bootmem_low_pages(unsigned long size);

    ```


    +   The functions with pages in their name allocate whole pages; the others are
    not page-aligned. The functions with _low make the memory locations obtained below
    MAX_DMA_ADDRESS. Otherwise, the memory allocation will be above that value.


    +   It is possible to free any memory allocated using these functions. However,
    you have grabbed this large memory chunk you are free to run your own memory allocator
    to re-use the memory as needed.


    +   These functions are primarily intended for critical data structures that are
    allocated early in the boot process and are required throughout the life of the
    system. However, they can be used for other purposes.


    # 15.8 Slabs and Cache Allocations


    +   Suppose you need to allocate memory for an object that is less than a page
    in size, or is not a multiple of a page size, and you don''t want to waste space
    by requesting pages. Suppose you need to create and destroy objects of the same
    size repeatedly, perhaps data structures or data buffers. These may be page size
    multiples or not.


    +   In either case it would be wasteful for the kernel to continually create and
    destroy these objects if they are going to be re-used, and it is additionally
    wasteful to induce the kind of fragmentation from continually reclaiming partial
    pages.


    +   You could allocate your own pool of memory and set up your own cache system,
    but Linux already has a well defined interface for this, and it should. Linux
    uses an algorithm based on the well known slab allocator. As part of this scheme
    you can create a special memory pool, or cache and add and remove objects from
    it (all of the same size) as you need.


    +   The kernel can dynamically shrink the cache if it has memory elsewhere, but
    it will not have to re-allocate a new object every time you need one if there
    are still or partially unused slabs in the cache. Note that more than one object
    can be in a slab, whose size going to be an integral number of pages.


    +   The following functions create, set up, and destroy your own memory cache:

    #include <linux/slab.h>


    ```

    struct kmem_cache *kmem_cache_create (

    const char *name, size_t size,

    size_t offset, unsigned long flags,

    void (*ctor)(void *, struct kmem_cache *, unsigned long flags),

    )

    int kmem_cache_shrink (struct kmem_cache *cache);

    void kmem_cache_destroy (struct kmem_cache *cache);

    ```'
