  md: "# 9.4 kprobes and jprobes\n\n+   The kprobes debugging facility (originally\
    \ contributed by developers at IBM) lets you insert breakpoints into a running\
    \ kernel at any known address. One can examine as well as modify processor registers,\
    \ data structures, etc.\n\n+   Up to four handlers can be installed:\n\n+   -\
    \ The pre-handler is called just before the probed instruction is executed.\n\
    - The post-handler is called just after the probed instruction is executed, if\
    \ no exception is generated.\n- The fault-handler is called whenever an exception\
    \ is generated by the probed instruction.\n- The break-handler is called whenever\
    \ the probed instruction is being single stepped or break-pointed.\n\n+   The\
    \ basic functions and data structures are defined in /usr/src/linux/include/linux/kprobes.h\
    \ and /usr/src/linux/kernel/kprobes.c:\n\n```\n#include <linux/kprobes.h>\n\n\
    int register_kprobe(struct kprobe *p);\nvoid unregister_kprobe(struct kprobe *p);\n\
    \nstruct kprobe {\n    struct hlist_node hlist;\n\n    /* location of the probe\
    \ point */\n    opcode_t *addr;\n\n    /* Allow user to indicate symbol name of\
    \ the probe point */\n    char *symbol_name;\n\n    /* Offset to the symbol */\n\
    \    unsigned int offset;\n\n    /* Called before addr is executed. */\n    kprobe_pre_handler_t\
    \ pre_handler;\n\n    /* Called after addr is executed, unless... */\n    kprobe_post_handler_t\
    \ post_handler;\n/* ... called if executing addr causes a fault (eg. page fault).\n\
    \ * Return 1 if it handled fault, otherwise kernel will see it. */\n    kprobe_fault_handler_t\
    \ fault_handler;\n\n    /* ... called if breakpoint trap occurs in probe handler.\n\
    \ * Return 1 if it handled break, otherwise kernel will see it. */\n    kprobe_break_handler_t\
    \ break_handler;\n\n    /* Saved opcode (which has been replaced with breakpoint)\
    \ */\n    kprobe_opcode_t opcode;\n\n    /* copy of the original instruction */\n\
    \    struct arch_specific_insn ains;\n};\n\ntypedef (*kprobe_pre_handler_t)(struct\
    \ kprobe *, struct pt_regs *);\n```"
  merge: -1
  img_proc: true
- pgno: 107
  md: '# CHAPTER 9. DEBUGGING TECHNIQUES


    ```

    typedef int (*kprobe_break_handler_t) (struct kprobe *, struct pt_regs *);

    typef void (*kprobe_post_handler_t) (struct kprobe *, struct pt_regs *, unsigned
    long flags);

    typef int (*kprobe_fault_handler_t) (struct kprobe *, struct pt_regs *, int trapn);

    ```


    +   Note that the handler receives a pointer to a data structure of pt_regs, which
    contains the contents of the processor registers. This is obviously architecture-dependent,
    and is detailed in /usr/linux/arch/x86/asm/ptrace.h.


    +   The flag argument to the post handler can have the values:


    ```

    KPROBE_FLAG_GONE        /* breakpoint has already gone /

    KPROBE_FLAG_DISABLED   /* probe is temporarily disabled */

    KPROBE_OPTIMIZED      /* probe is really optimized */

    ```


    and is not meant to be set directly by kprobe users. Here optimized means on certain
    architectures the breakpoint instruction for interrupting execution flow can be
    replaced by a jump instruction, which leads to a performance boost. The trapnz
    argument to the fault handler gives which exception caused the fault.


    +   In order to use probes, one must:


    +   - Fill in the kprobe data structure with pointers to supplied handler functions.

    - Supply either the address (addr) or symbolic name (symbol_name with an optional
    offset) where the probe is to be inserted.

    - Call register_kprobe(), with a return value of 0 indicating successful probe
    insertion.


    +   When finished one uses unregister_kprobe(), with an obvious catastrophe being
    the result if one gets to do so.


    +   The only remaining ingredient is to obtain the address of the probed instruction.
    If the symbol is exported, then you can merely point directly to it, as in


    ```

    addr = (kprobe_opcode_t *) mod_timer;

    ```


    Even if the symbol is not exported you can still specify the name directly with
    something as simple as


    ```

    kp.symbol_name = "do_fork";

    ```


    +   One should not set both the address and the symbol, as that will lead to an
    error.'
  merge: -1
  img_proc: true
- pgno: 108
  md: "# 9.4. KPROBES AND JPROBES\n\n+   - One can turn kprobes on and off dynamically,\
    \ even while it is currently in use:\n\n```\n$ ls -l /sys/kernel/debug/kprobes\n\
    total 0\n--rw---- 1 root root 0 Jun 11 08:28 enabled\n-r--r--r-- 1 root root 0\
    \ Jun 11 01:44 list\n```\n\n+   - By echoing each 1 or 0 to enable you can turn\
    \ kprobes on and off. By looking at list you can examine all currently loaded\
    \ probes.\n\n+   - The additional jprobe facility lets you easily instrument any\
    \ function in the kernel. The relevant registration and unregistration functions,\
    \ and the new relevant data structure are:\n\n```\nint register_jprobe(struct\
    \ jprobe *jp);\nvoid unregister_jprobe(struct jprobe *jp);\nvoid jprobe_return(void);\n\
    struct jprobe {\n    struct kprobe kp;\n    kprobe_opcode_t *entry;\n};\n```\n\
    \n+   - In order to use this you have to set up a structure of type jprobe, in\
    \ which the entry field points to a function of the exact same prototype and arguments\
    \ as the function being probed, which should be pointed in the kp.addr field just\
    \ as for kprobes.\n\n+   - The instrumentation function will be called every time\
    \ the probed function is called and must exit with the function jprobe_return().\
    \ It is called before the probed function.\n\n+   - The contents of registers\
    \ and the stack are restored before the function exits. However, changing the\
    \ values of arguments can make a (possibly destructive) difference.\n\n# SystemTap\n\
    \n+   - While kprobes is very powerful, its use requires a relatively low level\
    \ kernel incurs. SystemTap provides an infrastructure built on top of kprobes\
    \ that simplifies writing, compiling and installing kernel modules, and gathering\
    \ up useful output. The SystemTap project can be found at http://sourceware.org/systemtap/"
