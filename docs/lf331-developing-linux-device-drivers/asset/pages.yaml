  md: "# 14.4 Spinlocks\n\n+   - A spinlock is a mechanism for protecting critical\
    \ sections of code. It will spin while waiting for a resource to be available,\
    \ and not to go to sleep.\n\n+   - One can protect the same code section from\
    \ executing on more than one CPU, but more generally protects simultaneous access\
    \ to the same resource, which may be touched by differing code paths, in addition,\
    \ may be in or out of process context\n\n+   - Spinlocks were important only on\
    \ multi-processor systems before kernel preemption was included. This was because\
    \ SMP two CPUs can access a critical section of code simultaneously. Thus before\
    \ kernel preemption was incorporated into the 2.6 kernel, on single processor\
    \ systems, spinlocks were defined as no-ops. However, with a preemptible, hyper-threaded,\
    \ or multi-core system, spinlocks are always operate.\n\n+   - The macros in /usr/src/linux/arch/x86/include/asm/spinlock.h\
    \ (included from /usr/src/linux/include/linux/spinlock.h, when on an SMP system\
    \ contain the basic code for spinlocks.\n\nIn the simplest case you have making\
    \ something like:\n\n```\nspin_t my_lock;\nspin_lock_init(&my_lock);\n\nspin_lock(&my_lock);\n\
    \    critical code ............. \nspin_unlock(&my_lock);\n```\n\nThis guarantees\
    \ code touching the critical resource can't be run on more than one processor\
    \ simultaneously, and does nothing on a single processor system with a non-preemptable\
    \ kernel. However, the above functions should not be used out of process context\
    \ (i.e., in interrupt handlers) as they may cause deadlocks in that case. (See\
    \ /usr/src/linux/Documentation/spinlocks.txt for some further explanation.)\n\n\
    +   - One wants to suspend, or disable, interrupt handling at the same time. In\
    \ this case one does:\n\n```\nunsigned long flags;\nspin_t my_lock;\n\nspin_lock_init(&my_lock);\n\
    \nspin_lock_irqsave(&my_lock,flags);\n    critical code ............. \nspin_unlock_irqrestore(&my_lock,flags);\n\
    ```\n\nOn single processor systems, this is not a no-op, as the interrupt disabling\
    \ and restoring still goes on, and as mentioned these functions should be used\
    \ when out of process-context. These functions take more time than the above 'irq-less'\
    \ versions.\n\n+   - Note that the disabling of interrupts occurs only on the\
    \ current processor; other CPUs are free to handle interrupts while the lock is\
