- pgno: 202
  md: "# Chapter 19\n\n# Hardware I/O\n\n![](img/134c18b05ee9bbbe93ba3f4335720ac1_202_0.png)\n\
    \nWe will see how Linux communicates with data buses and I/O Ports, uses memory\
    \ barriers, how device drivers register and unregister them, read and write to\
    \ them, and slow them down. We will see how to read and write to memory mapped\
    \ devices. We'll also briefly consider how to access I/O Ports from user-space.\n\
    \n| | |\n|---|---||\n| 19.1 | Buses and Ports | 187 |\n| 19.2 | Memory Barriers\
    \ | 188 |\n| 19.3 | Registering I/O Ports | 189 |\n| 19.4 | Resource Management\
    \ | 190 |\n| 19.5 | Reading and Writing Data from I/O Registers | 191 |\n| 19.6\
    \ | Slowing I/O Calls to the Hardware ** | 192 |\n| 19.7 | Allocating and Mapping\
    \ I/O Memory | 194 |\n| 19.8 | Accessing I/O Memory | 195 |\n| 19.9 | Access by\
    \ User - ioperm(), iopctl(), /dev/port | 196 |\n| 19.10 | Labes | 196 |\n\n> **\
    \ These sections may be considered in part or whole as optional. They contain\
    \ either background reference material, specialized topics, or advanced subjects.\
    \ The instructor may choose to cover or not cover them depending on classroom\
    \ experience and time constraints.\n\n# 19.1 Buses and Ports\n\n+   - Computers\
    \ require data paths for the flow of information between the processor, memory,\
    \ and the various I/O devices and other peripherals. These data paths are known\
    \ as the bus, of which there are several kinds as:\n  - A data bus is a group\
    \ of lines that do parallel data transfer; on the Pentium data buses are 64-bit\
    \ wide."
