- pgno: 66
  md: '# 5.8 Driver Entry Points


    +   * struct *owner;


    The only field in the structure that is not a method. Points to the module that
    owns the structure and is used in reference counting and avoiding race conditions
    such as removing the module while the driver is being used. Usually set to the
    value THIS_MODULE.


    +   * loff_t (*llseek)(struct *file, char __loff_t offset, int whence);


    changes the read/write position in a file, returning the new position. Note that
    loff_t is 64-bit on 32-bit architectures.


    If one wants to inhibit seeking on the device (as on device), one can use the
    FMODE_LSEEK bit in file structure (probably during the open()) method) as:


    ```

    file->f_mode = file->f_mode & ~FMODE_LSEEK;

    ```


    +   * ssize_t (*read)(struct *file, char __user *buffer, size_t size, loff_t *offset);


    reads data from the device, returning the number of bytes read. An error is a
    negative value; zero mean end of device is not an error. You may also choose to
    block if data is not ready and the process has set non-blocking flag.


    +   * A simple read() entry point (struct file *file, char __user *buf, size_t
    lbuf, loff_t *ppos)


    ```

    int bytes = lbuf - copy_to_user(buf, kbuf + *ppos, lbuf);

    *ppos += bytes;

    printk(KERN_INFO "An reading function, bytes=%zd, pos=%ld\n", bytes, (long)*ppos);

    return bytes;

    ```


    In this case a read merely copies copies from a kernel-space (kbuf) to a user-space
    (buf.). But one cannot use memcpy() to perform this because it is improper to
    de-reference pointers in kernel-space; the address referred may not point to a
    page memory of the current time, either because it hasn''t allocated or it has
    been swapped out.


    +   * One must use the copy_to_user() and copy_from_user() functions (depending
    on direction) which will take care of these problems. (We''ll see later there
    are more advanced techniques for avoiding the extra copy, including memory mapping,
    raw I/O, etc.)


    +   * The kernel buffer will be dynamically allocated, in the kernel-per-task
    stack is very limited. This might be done with:


    ```

    #include <linux/slab.h>

    char *kbuf = kmalloc(kbuf_size, GFP_KERNEL);


    free(kbuf);

    ```


    where the limit is 1024 pages (4 MB on x86).


    +   * If using the GFP_KERNEL flag, memory allocation will block until resources
    are available; if GFP_ATOMIC is used the request is non blocking. We will discuss
    memory allocation in detail later.


    +   * The position in the device is updated by modifying the value of *ppos which
    points to the current value. The return value is the number of bytes successfully
    read; this is a case where a positive return value is still success.'
  merge: -1
  img_proc: true
