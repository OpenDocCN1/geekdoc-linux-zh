- pgno: 32
  md: '# Chapter 3


    # Device Drivers


    We''ll discuss how device drivers are used and consider the different types of
    devices; i.e., character, block and network. We''ll discuss the difference between
    mechanism and policy. We''ll consider the disadvantages of loading binary blobs.
    We will then take a quick tour of how applications interface with device drivers
    and make system calls. We''ll see how errors are defined, and how to obtain kernel
    output using printk(). We''ll consider all this in detail later.


    +   3.1 Types of Devices ............................................................
    17

    3.2 Mechanism vs. Policy ................................................ 20

    3.3 Avoiding Binary Blobs ........................................................
    20

    3.4 How Applications Use Device Drivers ............................... 21

    3.5 Walking Through a System Call ....................................... 22

    3.6 Error Numbers ..................................................................
    23

    3.7 printk() ................................................................
    24

    3.8 Labs ......................................................................
    27


    # 3.1 Types of Devices


    +   - A device driver is the lowest level of software as it is directly bound
    to the hardware features of the device. The kernel can be considered an application
    running on top of device drivers; each driver manages one or more piece of hardware
    while the kernel handles process scheduling, filesystem access, interrupts, etc.


    +   - Drivers may be integrated directly into the kernel, or can be designed as
    loadable modules. Not all modules are device drivers. A driver can be designed
    as either a modular or a built-in part of the kernel, with little or no change
    of the source.


    +   - In the usual device taxonomy there are three main types:'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Character Devices


    +   - Can be written to and read from a byte at a time.

    - Well represented as streams.

    - Usually permit only sequential access.

    - Can be considered as files.

    - Implement open, close, read, and write functions.

    - Serial/parallel ports, console (monitor and keyboard), etc.

    - Examples: /dev/tty0, /dev/ttyS0, /dev/ttysp0, /dev/lp1


    # Block Devices


    +   - Can be written to and read only from block-size multiples; access is usually
    cached.

    - Permit random access.

    - Filesystems can be mounted on these devices.

    - In Linux block devices can behave like character devices, transferring any number
    of bytes at a time.

    - Hard drives, cdroms, etc.

    - Examples: /dev/sda1, /dev/fd0


    # Network Devices


    +   - Transfer packets of data. Device senses the packets, not the streams.

    - Most often accessed via the BSD socket interface.

    - Instead of read, write, the kernel calls packet reception and transmission functions.

    - Network interfaces are not mapped to the filesystem; they are identified by
    a name.

    - Examples: eth0, ppp0


    # Device Types and User-Hardware Connection


    +   - What differentiates the types of drivers are the methods they use to connect
    the kernel with user-space. Most of time the connection passes through the VFS
    (Virtual File System), and then what methods are invoked depends on whether the
    access is a character device node, block device node, or a socket.

    - Character drivers may or not work on character streams; the essential thing
    is they are most directly connected to the user and to the hardware.

    - Block drivers are connected to the hardware, and to the user through the filesystem,
    caching, and the Virtual File System (VFS).

    - Network drivers are connected to the hardware and to the user through various
    kinds of protocol stacks.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# 3.1. TYPES OF DEVICES


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_34_0.png)


    # Devices with Core and Controller APIs


    +   - There are devices which have another degree of freedom in addition to the
    the character/block/network division (although functionally they can be used for
    any of these three generic classes of peripherals.)

    - SCSI (Small Computers Systems Interconnect) devices share an underlying protocol
    regardless of function. Hard goes into the driver for the controller hardware
    which may run many devices.

    - USB (Universal Serial Bus) devices also share an underlying protocol. Once again
    there is a lower layer of drivers tied to the controller hardware, and then device-specific
    drivers for the various peripherals connected to the bus.


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_34_1.png)


    # User Space Devices


    +   - User-space drivers, such as the video drivers incorporated into X.Org(http://www.x.org),
    reside in user-space but are given privileges to directly address hardware. They
    use the ioperm() and iopl() functions to accomplish this, which we''ll discuss
    when we discuss reading and writing to I/O ports.'
  merge: -1
