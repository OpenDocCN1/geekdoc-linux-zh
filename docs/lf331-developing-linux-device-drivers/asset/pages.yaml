  img_proc: true
- pgno: 81
  md: 'up; only one interrupt of a given type will be serviced, although if another
    interrupt of the same type arrives while it is being serviced, it too be serviced
    in turn.


    +   - There are two distinct kinds of interrupts:


    +   - Synchronous interrupts, often called exceptions, are generated by the CPU.

    - Asynchronous interrupts, often just called interrupts, are generated by other
    hardware devices, and are generally fed through the APIC (Advanced Programmable
    Interrupt Controller.)


    +   - Exceptions may be caused by run time errors such as division by zero, or
    by special conditions such as a page fault. They may also be caused by certain
    instructions, such as the one a system call make to request the CPU enter kernel
    mode to service a device driver. They may occur in or out of process context.
    They often cause a signal to be sent to one or more processes.


    +   - Interrupts generally arise from relatively random events such as a mouse
    click, keyboard press, a packet of data arriving on a network card, etc., or more
    regular events such as a timer interrupt. They are never associated with a process
    context.


    +   - Interrupts are very similar to signals; one might say interrupts are hardware
    signals, or signals are software interrupts. The general lessons of efficient
    and safe signal handling apply equally well to interrupts.


    +   - Handling interrupts is one of the most difficult tasks incurred by device
    drivers. It requires careful design to avoid race conditions and problems with
    non-reentrant code


    +   - Under Linux interrupts may be shared, and when an interrupt is shared, all
    handlers for interrupt must agree to share. Each of them will receive the interrupt
    in turn; i.e., there is no consumption of the interrupt by one of the handlers.


    # 7.2 Exceptions


    +   - Exceptions fall into two categories:


    +   - Processor-detected exceptions are generated when the CPU senses a condition
    during instruction execution. These can be of three types, according to the value
    of the eip register in the kernel mode stack:


    +   - Faults: the register contains the address of the instruction that induced
    the fault; when the exception service routine completes, execution will be resumed
    from that instruction if the handler is to deal with the anomalous condition produced
    by the exception, such as a page fault.


    +   - Traps: the register contains the address of the instruction to be executed
    after the one that induced the trap. Traps are mainly used for debugging and tracing
    methods and there is no need to repeat the instruction that caused the trap.


    +   - Aborts: the register may not contain a meaningful value. There may be a
    hardware failure or an invalid value in system tables. The abort handler will
    terminate the affected process.


    +   - Programmed exceptions are requested by the process through int or int33
    instructions (x86), as when invoking a system call. They may also be triggered
    by the into instruction which checks for overflow, or the bound instruction, which
    checks on address bound, when the checked condition is false. Programmed exceptions
    are handled just like traps and are sometimes called software interrupts.


    +   - On 32-x86 CPUs there are up to 32 exceptions possible, from 0 to 31. The
    exact number depends on the processor. The signal listed in the following table
    is usually sent to the process which triggered the exception.'
  merge: -1
  img_proc: true
