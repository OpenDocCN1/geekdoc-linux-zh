    +   * Historically, semaphores have more often been used as binary mutex rather
    than as counters.

    * A semaphore may be more difficult to debug than a mutex in that it can have
    more than one owner at a time.

    * Any new code should use mutexes unless the counting capability of semaphores
    is really needed. The migration of most existing semaphores to mutexes is gradually
    and carefully being done.

    * From kernel version 2.6.37 on you must use


    DEFINE_SEMAPHORE(name);


    in place of DECLARE_MUTEX(), which is much clearer in intent.


    +   * With kernel 2.6.26 the effort to remove as many semaphores as possible accelerated.
    In fact, it is possible that they will be removed altogether at some point, with
    the last remaining cases converted to the completion API.

