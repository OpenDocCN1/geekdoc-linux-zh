    \ 0 | |\n| MIS: | 0 | |\n\n+   - Note the numbers here are the number of times\
    \ the interrupt line has fired since boot. Only currently installed handlers are\
    \ listed. If a handler is unregistered (say unloading module) and if another handler\
    \ is re-registered, the number will not be zeroed in the process.\n- You will\
    \ also notice two types of interrupts:\n  - Level-triggered interrupts respond\
    \ to an electrical signal (generally a voltage) having a certain value.\n  - Edge-triggered\
    \ interrupts respond to a change in electrical signal, which can be either up\
    \ or down.\n\nIn principle one could miss a level-triggered interrupt if it is\
    \ cleared before the change in condition is noticed.\n- On SMP systems interrupts\
    \ may be serviced on any available CPU (although affinities can be mandated),\
    \ but only one CPU will handle an interrupt of the same kind at the same time.\n\
    \n+   - It is sometimes advantageous to set some IRQ-affinity; for particular\
    \ interrupts to be dealt with only subset of all the CPUs, rather than distributed\
    \ roughly equally.\n- This is done by /proc/irq/IRQ#/affinity. One can turn off\
    \ all CPUs in the mask, and won't work if the physical IRQ controller doesn't\
    \ have the capability to support an affinity selection.\n- The irqbalance daemon\
    \ dynamically adjusts the IRQ affinity in response to system conditions. It takes\
    \ into account performance (latency and cache coherence) and power consumption\
    \ (keeping CPUs no more active than necessary when system load is light).\n- There\
    \ was also an in-kernel IRQ-balancing option, which was deprecated and finally\
    \ removed in kernel version 2.6.29 in favor of the user-space solution. Full documentation\
    \ about the daemon method can be found at http://www.irqbalance.org.\n\n# 7.4\
    \ MSI\n\n+   - In pre-PCI-E(PCI-express) buses interrupts are line-based and are\
    \ now considered as legacy technology. The external pins that signal interrupts\
    \ are wired separately from the main bus lines, producing out of band signalling.\n\
    - PCIe maintains compatibility with older software by emulating this legacy behaviour\
    \ with in-band methods, but these are limited to four lines and often require\
    \ sharing of interrupts among devices.\n- The PCI 2.2 standard added a new mechanism\
    \ known as MSI (for Message-Signaled Interrupts), which was further enhanced by\
    \ the PCI 3.0 to become MSI-X, which is backward compatible with MSI."
