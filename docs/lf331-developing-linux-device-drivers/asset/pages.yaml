    MODULE_AUTHOR(\"Jerry Cooperstein\");\nMODULE_DESCRIPTION(\"Sample Memory Map\
    \ Driver Entry\");\nMODULE_LICENSE(\"GPL v2\");\n```\n\n# 16.9 Relay Channels\
    \ **\n\n+   - One comes up with the need to transfer information between kernel-space\
    \ and user-space, but not all needs are the same. One may or not need bi-directionality,\
    \ efficiency, or promptness. One may be working with or without a device driver,\
    \ and have large or small amounts of data.\n- **The Relay channel interface (formerly\
    \ known as relayfs)** provides a site to use mechanism that works beautifully\
    \ when the direction is one: from kernel to user.\n- Kernel clients fill buffers\
    \ with no constraints on the data form. Users get access to the data with normal\
    \ system calls, generally read() or mmap(), executed on data files (by default\
    \ for each CPU) that are treated much like pipes.\n- For each channel, there is\
    \ one buffer per CPU. In turn, each buffer has one or more sub-buffers.\n- When\
    \ a sub-buffer is full to fit a new chunk of data, or message, the next buffer\
    \ (if available) is used; messages are never split between sub-buffers (so a message\
    \ should not be bigger than a sub-buffer.) User-space can be notified that a sub-buffer\
    \ is full.\n- The buffer can be set up in either overwrite or no-overwrite mode\
    \ (the default); in the second mode, kernel clients will block until readers empty\
    \ the buffer.\n- When the user-space application accesses the data with read()\
    \ calls, any padding at the end of sub-buffers is removed and the buffers are\
    \ drained.\n- When user-space application accesses the data with mmap(), the entire\
    \ buffer (including all sub-buffers) must be mapped and no draining occurs. This\
    \ is more efficient than just using reads, but is also more complex.\n- Here's\
    \ a complete list of the system calls that can be used on a relay channel:\n\n\
    +   - open(), close(): open and close an existing channel buffer. If no other\
    \ process, or kernel client, is still using the buffer, the channel is freed upon\
    \ closing.\n- read(): Consume bytes from the channel. In no-overwrite mode it\
    \ is fine if kernel clients are writing simultaneously, but in overwrite mode\
    \ unpredictable outcomes can happen. Sub-buffer padding is not seen by readers.\n\
    - mmap(): The entire buffer must be mapped and there is no draining.\n- sendfile():\
    \ Drains a read."
