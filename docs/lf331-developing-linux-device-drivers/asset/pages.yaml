    \ void *key)\n3.1:4532 {\n3.1:4533 unsigned long flags;\n3.1:4534 spin_lock_irqsave(&q->lock,\
    \ flags);\n3.1:4535 __wake_common(q, mode, int _exclusive, 0, key);\n3.1:4537\
    \ spin_unlock_irqrestore(&q->lock, flags);\n3.1:4538 }\n3.1:4539 EXPORT_SYMBOL(wake_up);\n\
    which takes out an interrupt blocking lock, and passes the work over to __wake_common():\n\
    3.1:4506 static void __wake_common(queue_head_t *q, unsigned int mode,\n3.1:4507\
    \ int _exclusive, int wake_flags, void *key)\n3.1:4508 {\n3.1:4509 wait_queue_t\
    \ *curr, next *;\n3.1:4510\n3.1:4511 list_for_each_entry(curr, next, &q->task_list,\
    \ task_list) {\n3.1:4512 unsigned flags = curr->flags;\n3.1:4514 if (curr(curr,\
    \ mode, wake_flags, key) &&\n(flags & WQ_FLAG_EXCLUSIVE) && !-nr_exclusive)\n\
    3.1:4516 break;\n3.1:4517 }\n3.1:4518 }\n\n+   The function cycles through the\
