  md: "# 5.3. RESERVING MAJOR/MINOR NUMBERS\n\n![](img/134c18b05ee9bbbe93ba3f4335720ac1_60_0.png)\n\
    \n+   - In the 2.4 kernel only 8-bit major and minor numbers were available, and\
    \ the functions for registering and de-registering were:\n\n```c\n#include <linux/fs.h>\n\
    \nint register_chrdevev(unsigned major, const char *name,\n                  \
    \   const struct file_operations *fops);\nint unregister_chrdevev(unsigned major,\
    \ const char *name);\n```\n\n- Dynamic allocation was accomplished by specifying\
    \ 0 as a major number; the return value gave the supplied major number which was\
    \ obtained by decreasing from 254 until an unused number was found. (When dynamic\
    \ allocation was not requested, the return value upon success was 0, which was\
    \ confusing:)\n\n- We'll discuss the struct file_operations pointer shortly, which\
    \ delineates the methods used by the driver.\n\n- Only one device driver could\
    \ use a given major number at a time; in the 2.6 kernel it is required that only\
    \ major/minor number set is unique.\n\n- This interface, while more limited than\
    \ the new one, is used in some old device drivers and there is no great rush to\
    \ eliminate it. However, any new drivers should always use the more modern methods.\n\
    \n# Dynamic Allocation of Major Numbers\n\n+   - Choosing a unique major number\
    \ may be difficult: dynamic allocation of the device numbers is used to avoid\
    \ collisions. This is accomplished with the function:\n\n```c\n#include <linux/fs.h>\n\
    \n alloc_chrdev_region(dev_t *first, unsigned int firstminor, unsigned int count,\n\
    \                     char *name);\n```\nnwhere first is passed by address as\
    \ it will be filled by the function. The argument, firstminor is obviously the\
    \ first requested minor number, (usually 0.) The de-registration of the device\
    \ numbers is the same with this method.\n\n- The disadvantage of dynamic allocation\
    \ is that the proper node can not be made until the driver is loaded. Furthermore,\
    \ one usually needs scripting around both the module loading and unloading steps.\n\
    \n- While it would be possible to have a module do an exec() to call chmod and\
    \ jump out to user-space, this is never done; kernel developers feel strongly\
    \ that making nodes belongs in user-land, not the kernel."
