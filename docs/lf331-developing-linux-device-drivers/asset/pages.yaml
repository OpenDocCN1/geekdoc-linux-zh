    # 5.2 Major and Minor Numbers


    +   - The major and minor numbers identify the driver associated with the device.

    - The minor number is used only within the device driver to either differentiate
    between instances of the same kind of device, (such as the first and second sound
    card, or hard disk partition) or alternate modes of operation of a given device
    (such as different density floppy media).

    - The major and minor numbers are stored together in a variable of type dev_t,
    which has 32 bits, with 12 bits reserved for the major number, and 20 bits for
    minor.

    - One should always use the following macros to construct (or deconstruct) major
    and minor numbers from a dev_t structure:


    > Table 5.1: Device Node Macros


    | Macro | Meaning |

    | --- | --- |

    | MAJOR(dev_t dev); | Extract the major number. |

    | MINOR(dev_t dev); | Extract the minor number. |

    | MKDEV(int major, int minor); | Return a dev_t built from major and minor numbers
    |'
