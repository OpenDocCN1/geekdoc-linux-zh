  md: '# 18.2. DEFERABLE FUNCTIONS AND SOFIRQS


    +   - There are two main types: softirqs (of which tasklets are one kind) which
    run in interrupt context and are not allowed to go to sleep, and workqueues, which
    run under a pseudo-process context and are not allowed to sleep.


    +   - There are a number of different kinds of softirqs defined. In order of decreasing
    priority they are:


    Table 18.1: Softirq Types


    | Name | Priority | Purpose |

    |---|---|---|

    | HI_SOFTIRQ | 0 | High-priority tasklets. |

    | TIMER_SOFTIRQ | 1 | Scheduled timers. |

    | NET_TX_SOFTIRQ | 2 | Network packet transmission. |

    | NET_RX_SOFTIRQ | 3 | Network packet reception. |

    | BLOCK_SOFTIRQ | 4 | Block device related work. |

    | TASKLET_SOFTIRQ | 5 | Normal-priority tasklets. |

    | SCHED_SOFTIRQ | 6 | Used in the CFS scheduler. |

    | HRTIMER_SOFTIRQ | 7 | Used if high resolution timers are used. |


    +   - The various kinds of deferred functions differ mostly in whether or not
    they operate in process context and their behaviour on multi-processor systems.


    Table 18.2: Deferred Function Types


    | Type | SMP Behaviour | SMP Serialization |

    |---|---|---|

    | softirq | No | Same ones can run on different CPUs simultaneously | Run on the
    CPU that schedules them and must be fully re-entrant. |

    | tasklet | No | Can run simultaneously on different CPUs, but not if they use
    the same tasklet_struct. | Run on the CPU that scheduled them and are thus serialized.
    |

    | workqueue | Yes | Can run on any CPU. | Can be delayed and serialized. |


    Softirqs are called, or consumed in either of two ways:


    +   - After an interrupt is serviced the kernel checks if any softirqs are pending;
    so it executes them in priority order.


    +   - The kernel thread softirq[cpu] is scheduled in other processes, and consumes
    them in like fashion.


    +   - The mechanism is required to prevent priority inversion due to softirq storms,
    which can happen when a softirq resubmits itself, or when softirqs from other
    sources build up before they can run.


    +   - To avoid this function __do_softirq() is allowed to restart only MAX_SOFTIRQ_RESTART=10
    tasks; it is not consumed by then, further processing is deferred and the wake
    up call is issued to the kernel softirq process which can be scheduled in consume
    additional tasks.'
