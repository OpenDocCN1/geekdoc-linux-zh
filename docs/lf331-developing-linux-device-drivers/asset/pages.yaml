- pgno: 304
  md: '# Chapter 32


    # Block Drivers


    We''ll introduce block device drivers. We''ll consider block buffering. We''ll
    talk about what they are and how they are registered and unregistered. We''ll
    discuss the important gendisk data structure. We''ll discuss the block driver
    request function and see how reading and writing block devices is quite different
    than for character devices.


    +   32.1 What are Block Drivers? ..........................................................................................
    289

    32.2 Buffering ...................................................................................................................................
    290

    32.3 Registering a Block Driver .......................................................................................
    290

    32.4 gendisk Structure ................................................................................................................
    292

    32.5 Request Handling ................................................................................................................
    293

    32.6 Labs .......................................................................................................................................
    296


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_304_0.png)


    # 32.1 What are Block Drivers?


    +   * Drivers for block devices are similar in some ways to those for character
    drivers, but differences are many and deep.

    * In normal usage, block devices contain formatted and mountable filesystems,
    which allow random (non-sequential) access. The device driver does not depend
    on the type of files put on the device.

    * While a particular system call may request any number of bytes, the low-level
    read/write requests must be multiples of the block size. All access is cached
    (unless explicitly requested otherwise) which means writes to the device may be
    delayed, and reads may be satisfied from cache.

    * The drivers do not have their own read/write functions. Instead they deploy
    a request function, a callback function which is invoked by the higher levels
    of the kernel in a fluid way that depends on the use of the cache.'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'Block devices may have multiple partitions. In most instances the partition
    number corresponds to the device''s minor number, while the whole device shares
    the same major number. The naming convention for the nodes is:


    # Major — Unit — Partition


    e.g., /dev/hdb4 has a Major of hd, is Unit b (the second), and is Partition 4.
    Details of the partitioning are contained in the gendisk data structure.


    Block devices may also employ removable media such as CD-ROMs and floppy disks.


    # 32.2 Buffering


    +   Files reside on block devices which are organized in fixed size blocks, although
    I/O requests, made with system calls, may be for any number of bytes. Thus block
    devices must be controlled by a buffering/c system, which is shared for all devices.


    +   The blocks are cached through the page cache, and a given page may contain
    more than one block device buffer.


    +   The device itself should only be accessed:


    +   A block not in cache must be loaded on a read request.


    +   A block needs to be written (eventually) if the cache contains no longer match
    on what is the O_SYNC flag. In this case the block must be marked as dirty. Note
    if a file is opened with the O_SYNC flag, no delay is allowed.


    +   At periodic intervals the pdflush system process which modifies all blocks
    that haven''t been used for a certain amount of time, to be flushed back to the
    device. Other events may also trigger the flushing, with the object being to keep
    the number of dirty blocks in the cache at a minimum, and to make sure that most
    important blocks, those deinodes and superblocks, are kept most consistent.


    +   The sync command writes all modified buffer blocks in the cache. The fsync()
    system call writes back all modified buffer blocks for a single file.


    # 32.3 Registering a Block Driver


    +   Registering a block device is generally done during the initialization routine,
    and in most ways is pretty similar to doing it for a character device. Unregistering
    is generally done during the cleanup routine, just as for a character device.
    The functions for this are:


    ```

    #include <linux/fs.h>

    int register_blkdev(unsigned int major, const char *name);

    unregister_blkdev(unsigned int major, const char *name);

    ```


    +   register_blkdev() returns 0 on success and -EBUSY on failure. Supplying a
    major number of 0 generates a dynamic assignment given as the return value. The
    value of major has less than or equal to MAX_BLKDEV=255.


    +   unregister_blkdev() returns 0 on success and -EINVAL on failure. It checks
    that major is valid and that name matches major, but doesn''t check if you are
    the owner of the device you are unregistering.'
  merge: -1
  img_proc: true
