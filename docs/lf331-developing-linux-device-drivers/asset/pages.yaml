  md: '# Chapter 14


    # Firmware


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_148_0.png)


    We''ll discuss binary firmware and how to use it.


    +   14.1 What is Firmware? . . . . . . . . . 133

    14.2 Loading Firmware . . . . . . . . 134

    14.3 Labs . . . . . . . . . . . . . 134


    # 14.1 What is Firmware?


    +   - Firmware consists of instructions and data embedded in a hardware device
    that are necessary for its proper functioning. This binary information can be
    stored in ROM, in rewritable EEPROM, or on flash media. However, vendors often
    find that it is cheaper and more flexible to have the firmware loaded by the operating
    system.

    - There is a gray line between deploying operating system-loaded firmware and
    the use of binary blobs, it is usually clear for a given device which is the more
    appropriate description. Use of firmware does not causing taint of the Linux kernel.
    There are Linux distributions which have problems distributing drivers with require
    binary firmware, or which do not distribute the firmware itself.

    - We''ll leave aside the question of where to obtain the firmware for a given
    device that requires it, as it varies from device to device. Sometimes one even
    has to cut out of the device driver for another operating system, as there be
    no other method.

    - Furthermore, the question of whether firmware should be shipped with the kernel
    itself, and if not it should reside on the filesystem is somewhat contentious
    and has not completely settled down. In some cases it does ship with the kernel,
    and if not the precise location is binary-dependent. For most Linux systems one
    can generally find non-kernel shipped firmware under /lib/firmware.'
  merge: -1
  img_proc: true
- pgno: 149
  md: "# 14.2 Loading Firmware\n\n+   Loading of firmware into drivers can be done\
    \ with:\n\n```\n#include <linux/firmware.h>\n\nstruct firmware {\n    size_t size;\n\
    \    const u8 *data;\n};\nMODULE_FIRMWARE(filename);\n\nint request_firmware(const\
    \ struct firmware **fw, const char *filename, struct device *device);\nvoid release_firmware(const\
    \ struct firmware *fw);\n```\n\nwhere filename is the name of the firmware file\
    \ to be loaded; on any recent Linux system it should be placed under /lib/firmware.\
    \ Upon successful return, request_firmware() places size bytes in the data field\
    \ of the firmware structure.\n\n+   For devices attached to a physical bus as\
    \ PCI, one can easily get a hook into the device structure from the relevant bus-associated\
    \ structure, such as pci_dev. For a pseudo-device (which firmware probably doesn't\
    \ make sense anyway), one would at least have to register the device and fill\
    \ in some parts of the device structure before trying to load/unload the firmware.\n\
    \n+   There is a strong user-space component to how the firmware gets loaded,\
    \ and it will vary among distributions. See /usr/src/linux/Documentation/firmware_class\
    \ for details.\n\n# 14.3 Labs\n\n# Lab 1: Loading Firmware\n\n+   Write a module\
    \ that loads some firmware from the filesystem. It should print out the contents.\n\
    \n+   In order to do this you will need to place a firmware file under /lib/firmware.\
    \ You can use just a text file for the purpose of this demonstration.\n\n+   Since\
    \ this is a pseudo-device, you will have to declare and initialize a device structure.\
    \ Minimally you must set the dev (*release)(struct device *dev) field in this\
    \ structure, and call\n\nint dev_set_name(struct device *dev, const char *fmt,\
    \ ...);\n\nto set the device name, which can be read out with:\n\n```\nconst char\
    \ *dev_name(const struct device *dev);\n```\n\n(You may want to see what happens\
    \ if you neglect setting one of these quantities.)\n\n+   device_register(struct\
    \ device *dev);\ndevice_unregister(struct device *dev);\n\nbefore requesting and\
    \ after releasing the firmware."
