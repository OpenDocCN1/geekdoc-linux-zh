    irq disables */ |

    | 3.1 | 50 unsigned int | depth; |

    | 3.1 | 51 unsigned int | wake_depth; | /* nested wake enables * | |

    | 3.1 | 52 unsigned int | irq_count; | /* detecting broken IRQs * |'
