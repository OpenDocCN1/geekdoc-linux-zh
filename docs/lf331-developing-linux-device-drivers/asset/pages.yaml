  md: "# 5.5 REGISTERING THE DEVICE\n\n```\nint open(const char *pathname, int flags);\n\
    int close(int fd);\nsize_t read(int fd, void *buf, size_t count);\nsize_t write(int\
    \ fd, const void *buf, size_t count);\nint ioctl(int fd, int request, ...);\n\
    off_t lseek(int fd, off_t offset, int whence);\nvoid *mmap(void *start, size_t\
    \ length, int prot, int flags, int fd, off_t offset_offset);\nint poll(struct\
    \ pollfd *fds, int nfds, int timeout);\n```\n\nThese entry points all have man\
    \ pages associated with them.\n\n+   The driver has entry points corresponding\
    \ to these functions; however names and arguments may differ. In the above list,\
    \ for example, the system call close() will lead to the entry point.\n\n+   Remember\
    \ that applications can enter these system calls indirectly; for instance by using\
    \ the standard I/O library functions, fopen(), fclose(), read(), write(), and\
    \ fseek().\n\n# 5.5 Registering the Device\n\n+   So far all we have done is reserve\
    \ a range of device numbers for the exclusive use of our driver. Work has to be\
    \ done before the device can be used.\n\n+   Character devices are associated\
    \ with a cdev structure, as defined in /usr/src/linux/include/linux/cdev.h.\n\n\
    ```\nstruct cdev {\n    struct kobject kobj;\n    struct module *owner;\n    const\
    \ struct file_operations *ops;\n    struct list_head list;\n    dev_t dev;\n \
    \   unsigned int count;\n};\n```\n\n+   Normally you won't work with the internals\
    \ of this structure, but reach it through various functions. In particular, we\
    \ will see how the owner and ops pointers are used.\n\n+   A number of related\
    \ functions are needed to work with character devices are:\n\n```\n#include <linux/cdev.h>\n\
    \nstruct cdev *cdev_alloc(void);\nvoid cdev_init(struct cdev *dev, const struct\
    \ file_operations *ops);\nvoid cdev_put(struct cdev *dev);\nstruct kobject *cdev_get(struct\
    \ cdev *dev);\nint cdev_add(struct cdev *dev, dev_t dev, unsigned int count);\n\
    void cdev_del(struct cdev *dev);\n```\n\n+   These structures should always be\
    \ allocated dynamically, and then initialized with code like:\n\n```\nstruct cdev\
    \ *mycdev = cdev_alloc();\ncdev_init(mycdev, &ops);\n```\n\nThis code allocates\
    \ memory for the structure, initializes it, and sets the owner and ops fields\
    \ to point to the current module, and the proper file_operations table."
