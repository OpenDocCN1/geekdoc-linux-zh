- pgno: 105
  md: "As with /proc you can create your own entry under the debugfs root directory\
    \ by creating a directory with debugfs_create_dir(); supplying NULL for parent\
    \ in the above functions places entries in the root directory. The mode argument\
    \ is the useless permissions mask, and data is an optional parameter that can\
    \ be used to point to a private data structure.\n\nThe fops points to a file_operations\
    \ structure containing a jump table of operations on the entry, as it is used\
    \ in character drivers. One probably needs to supply only the ownership field,\
    \ and reading and writing entry points functions.\n\nFor the read function one\
    \ may want to take advantage of the function:\n\n```\nssize_t simple_read_from_buffer(void\
    \ __user *to, size_t count, loff_t *ppos,\n                const void *from, size_t\
    \ available);\n```\n\nwhich is a function for getting information from the kernel\
    \ buffer pointed to by from into the user buffer (using copy_to_read()) properly),\
    \ where the position ppos is advanced no further than available bytes. An example\
    \ of a read function using this:\n\n```\nssize_t size_t\nmy_read(struct file *file,\
    \ char *buf, size_t count, loff_t *ppos)\n{\n    int nbytes;\n    nbytes=sprintf(kstring,\
    \ \"%d\\n\", val);\n    return simple_read_from_buffer(buf, count, ppos, kstring,\
    \ nbytes);\n}\n```\n\nEven simpler is to use the create functions:\n\n```\nstruct\
    \ dentry debugfs_create_u8 (const char *name, mode_t mode,\n                struct\
    \ dentry *parent, us *val);\nstruct dentry debugfs_create_u16 (const char *name,\
    \ mode_t mode,\n                struct dentry *parent, u16 *val);\nstruct dentry\
    \ debugfs_create_u32 (const char *name, mode_t mode,\n                struct dentry\
    \ *parent, u32 *val);\nstruct dentry debugfs_create_bool (const char *name, mode_t\
    \ mode,\n                struct dentry *parent, u32 *val);\n```\n\nThis create\
    \ entry is denoted by name, under the parent directory, which is used to simply\
    \ read in and out a variable of proper type. The variable is sent back and forth\
    \ as a string. Thus one can with simply one line of code (including the header\
    \ file!) create an entry!\n\nIn order to use the debugfs facility you may have\
    \ to mount the debugfs pseudo-filesystem:\n\n```\n$ mount -t debugfs /sys/kernel/debug\n\
    ```\n\nbut all recent distributions do this automatically and you should be able\
    \ to skip this step.\n\nRegardless of how you create your entries they must be\
    \ removed with debugfs_remove() on the way out, because, as usual, the kernel\
    \ does not garbage collection.\n\nFor a review of debugfs and how to use it http://lwn.org/Articles/334546."
