- pgno: 224
  md: '# Chapter 21


    # Platform Drivers**


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_224_0.png)


    We''ll discuss platform drivers.


    | 21.1 | What are Platform Drivers? | 209 |

    | 21.2 | Main Data Structures | 210 |

    | 21.3 | Registering Platform Devices | 211 |

    | 21.4 | An Example | 211 |

    | 21.5 | Hardcoded Platform Data | 215 |

    | 21.6 | The New Way: Device Trees | 216 |


    ** These sections may be considered in part or in whole as optional. They contain
    either background reference material, specialized topics, or advanced subjects.
    The instructor may choose to cover or not cover them depending on classroom experience
    and time constraints.


    # What are Platform Drivers?


    +   * Devices on well known buses, such as PCI and USB, have well defined methods
    in the Unified Device Model for declaring themselves when they are attached or
    detached from hotplug mechanisms or are discovered during system boot.


    +   * However, may modern SOCs (System On Chips) have peripherals such as host
    controllers and other devices already built in and do not inform the kernel in
    the same way about their presence. Generally such devices have direct addressing
    from a CPU bus, and while they are rarely connected through a segment of some
    other type of bus, their registers will still be directly addressable.


    +   * To handle devices Linux uses the platform driver interface which connects
    to and resembles the unified device model and permits virtual addition and removal
    of devices. Each device gets a unique name and is configurable.'
