    | void | skb_reserve (struct sk_buff *skb, unsigned int len); | Increase the headroom
    of an empty buffer by reducing the tailroom; buffer must be empty. Since Ethernet
    headers are 14 bytes, reserving 2 bytes would align the IP header on a 16 byte
    boundary. |

    | void | skb_trim (struct sk_buff *skb, unsigned int len); | Remove bytes from
    the end of a buffer to make it leen bytes long; if the buffer is already less
    than this, nothing happens. |

    | struct sk_buff * | skb_get (struct sk_buff *skb); | Increment reference counter
    for the buffer and return a pointer to it. |

    | int | skb_shared (struct sk_buff *skb); | True if more than one person refers
    to the buffer |

    | void | skb_orphan (struct sk_buff *skb); | If the buffer is currently owned,
    call the owner''s destructor function and make the buffer unknown; it will still
    exist but is not associated with the former owner |

    | struct sk_buff * | skb_clone (struct sk_buff *skb, gfp_t gfp_mask); | Duplicate
    socket buffer with the clone not owned by any socket. Both copies share the same
    packet data, but not the structure. |

    | struct sk_buff * | skb_copy (const struct sk_buff *skb, gfp_t gfp_mask); | Copy
    a socket buffer including its data, so it can be modified. |


