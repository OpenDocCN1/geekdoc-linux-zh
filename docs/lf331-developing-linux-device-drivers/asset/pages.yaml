- pgno: 121
  md: "# CHAPTER 11. RACE CONDITIONS AND SYNCHRONIZATION METHODS\n\nSuch concurrency\
    \ can be of two types:\n\n+   - True concurrency occurs on SMP systems, when two\
    \ threads of execution on different processors simultaneously access a resource.\n\
    - Pseudo-concurrency occurs even on single processor systems, when one thread\
    \ is pre-empted or interrupted and another accesses an open resource.\n\nA variety\
    \ of mechanisms can be used to ensure integrity of shared resources; let's consider\
    \ the various methods in order of increasing overhead.\n\nThe simplest method\
    \ is the use of atomic functions, which work on specially typed variables which\
    \ are essentially integers and the use of atomic operations. Atomic functions:\n\
    \n+   - Execute in one instruction; i.e., they cannot be interrupted in mid-stream,\
    \ and if two operations are requested simultaneously one must complete before\
    \ the second can proceed.\n- Can be used either in or out of process context.\n\
    - Can never go to sleep.\n Do not suspend interrupts while executing.\n\nIf more\
    \ one operation needs to be performed, one can use spinlocks; these get their\
    \ name because if one attempts to take out a spinlock which is already held, the\
    \ code will spin; i.e., a busy wait, until the lock is available. The spinlocks\
    \ functions:\n\n+   - Can be either in or out of process context, but if used\
    \ in interrupts, the forms which temporarily block interrupts are used when the\
    \ same spinlock is referenced in process context.\n- Can block but do not go to\
    \ sleep; ie., another process cannot be scheduled.\n- Can suspend interrupts while\
    \ being used.\n- Have supplemental read and write forms for the case in which\
    \ one wants to permit simultaneous readers, and writers are relatively rare.\n\
    \nIf one wants the ability to go to sleep if the resource is not available (to\
    \ can call the scheduler and have yield the CPU to another process) one can use\
    \ mutexes (for which the basic operations mutex_lock() and mutex_unlock()) or\
    \ semaphores (for which the basic operations are up() and down()). Whenever possible\
    \ mutexes should be used rather than semaphores in new code.\n\nOne should note:\n\
    \n+   - Can use mutex_lock() and down() only in process context; mutex_unlock()\
    \ should not be used from an interrupt context, while the up() functions can be\
    \ used at any time.\n- The mutex_lock() and down() functions can sleep. The sleep\
    \ may or may not be interruptible by signals, depending on the form used.\n- Interrupts\
    \ are not suspended by these functions.\n- Like spinlocks, the semaphore functions\
    \ have supplemental read and write forms for the case in which one wants to permit\
    \ simultaneous readers when writing is relatively rare.\n\nAs an alternative,\
    \ completion functions can be used in place of semaphores in the case where contention\
    \ is expected to be high.\n\nThe kernel also employs the selock() mechanism, used\
    \ when one has to read a value which is rarely changed, and for which speed is\
    \ essential.\n\nAnother method for similar situations is RCU (for Read-Copy-Update),\
    \ which can lead to great performance."
  merge: -1
  img_proc: true
- pgno: 122
  md: "# 11.2. ATOMIC OPERATIONS\n\n+   - Exactly which mechanism should be used depends\
    \ on:\n- Whether contention is expected to be high or low.\n- Whether one is in\
    \ or out of process context.\n- How many operations have to be performed while\
    \ the lock is held.\n- Whether sleeping is permissible.\n- How often the lock\
    \ needs to be taken.\n\nFor frequent operations, one would generally pick the\
    \ one with the lowest overhead which fits the other requirements.\n\n> - For an\
    \ extremely comprehensive overview of the challenges of parallel programming,\
    \ down-load Paul McKinney’s opus at: http://kernel.org/pub/linux/kernel/people/paulmckney/perfbook/perfbook.2011.01.02a.pdf.\n\
    - All major locking and synchronization mechanisms are discussed from a very experienced\
    \ perspective.\n\n# 11.2 Atomic Operations\n\n+   - Atomic functions (which of\
    \ many are macros) are completed as one single instruction and work on a variable\
    \ of type atomic_t, which is a structure defined as\n\n```\ntypedef struct {\n\
    \    volatile int counter;\n} atomic_t;\n```\n\nUsing a structure helps prevent\
    \ mixing up atomic variables with normal integers that you can’t use atomic functions\
    \ on integers and vice versa without explicit casting.\n\n+   - These in-line\
    \ macros and functions are SMP-safe and depend on the architecture:\n\n```\n#include\
    \ <asm/atomic.h>\n\n#define ATOMIC_INIT(i)    {(i) }\n#define ATOMIC_read(v) \
    \  ((v)->counter)\n#define ATOMIC_set(v,i)  ((v)->counter) = (i))\n\nvoid atomic_add(int\
    \ i, atomic_t *v);\nvoid atomic_sub(int i, atomic_t *v);\nvoid atomic_inc(atomic_t\
    \ *v);\nvoid atomic_dec(atomic_t *v);\n\nint atomic_dec_and_test(atomic_t *v);\n\
    int atomic_inc_and_test_greater_zero(atomic_t *v);\nint atomic_sub_and_test(int\
    \ i, atomic_t *v);\nint atomic_add_negative(int i, atomic_t *v);\nint atomic_sub_return(int\
    \ i, atomic_t *v);\nint atomic_add_return(int i, atomic_t *v);\n```"
