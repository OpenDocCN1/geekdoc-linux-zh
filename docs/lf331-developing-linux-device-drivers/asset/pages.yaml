    +   * handler points to the interrupt service routine, or handler, that is triggered
    when the interrupt arrives. We''ll discuss the arguments later.


    +   * flags is a mask of the main values:


    Table 7.3: IRQ Handler Flags


    | Flag | Meaning |

    | --- | --- |

    | IRQ_DISALLOWED | The handler runs with interrupts disabled; i.e., it is a fast
    handler. The IRQ may be shared with other devices, if they all mutually agree
    to it. |

    | IRQ_SHARED | |

    | IRQ_SAMPLE_RANDOM | The IRQ line may contribute to the entropy pool that the
    system uses to generate random numbers which are used for purposes like encryption.
    This should not be turned on for interrupts arrive at predictable times. |

    | IRQ_PROBE_SHARED | Set when sharing mismatches are expected to occur. |

    | IRQ_TIMER | Set to indicate this is a timer handler. |

    | IRQ_NOBALANCING | Set to exclude this interrupt from irq balancing. |

    | IRQ_POLL | Interrupt is used for polling (only the interrupt that is registered
    first in a shared interrupt is considered for performance reasons) |


    (There are some other possibilities; see /usr/src/linux/include/linux/interrupt.h).


    +   * if the IRQ line is being shared, the IRQ_DISALLOWED flag will be effective
    only if it is specified on the first handler registered for that IRQ line.


    +   * mask indicates that interrupts are blocked while running.


    +   * name points to the identifier that will appear in /proc/interrupts.


    +   * dev_id points to a unique identifier in the address space of the device
    driver (or kernel subsystem) that has registered the IRQ. It is used as a cookie
    to distinguish among handlers for shared IRQ''s and is important for making sure
    the right handler is deregistered when a request is made. Device drivers often
    have it point to a data structure that the handler runtime will have access to.
    If the IRQ is not being shared, NULL can be used.


    +   * next points to the next irqaction structure in the chain that are sharing
    the same IRQ.'
