  md: '# 6.5 Labs


    Lab 1: Using strace.


    strace is used to trace system calls and signals. In the simplest case you would
    do:


    +   * $ strace [options] command [arguments]


    +   * Each system call, its arguments and return value are printed. According
    to the man page:


    +   * "Arguments are printed in symbolic form with a passion."

    and indeed they are. There are a lot of options; read the man page!


    +   * As an example, try


    ```

    $ strace -lRF / 2>&1 | less

    ```


    You need the complicated redirection because strace puts its output on stderr
    unless you use the -o option to redirect it to a file.


    +   * While this is running (paused under less), you can examine more details
    about the ls process, by examining the /proc filesystem. Do


    ```

    $ ps aux | grep ls

    ```


    to find out the process ID associated with the process. Then you can look at the
    pseudo-files


    /proc/<pid>/fd/* are mapped to the underlying files (or pipes), etc.


    to see how the file descriptor is used.'
