  md: "# 16.10 Relay API **\n\n+   - poll(): User applications are notified when a\
    \ sub-buffer boundary is reached, the flags POLLIN, POLLRDNORM, POLLERR are supported.\n\
    \n+   - The work of this mechanism could be done using other methods, such as\
    \ the /proc filesystem, ioctl() commands on either real or pseudo devices, improper\
    \ use of printk() statements, or worst accessing a log file directly from the\
    \ kernel, the use of relay channels offers a clean method.\n\n> > Relay channels\
    \ have never been widely adopted in the Linux kernel, and everything they do is\
    \ fairly available using the newer ftrace facility, for which there is a strong\
    \ ongoing development effort.\n\n> > Thus we present this material for its pedagogical\
    \ value rather than as a recommendation for its use.\n\n# 16.10 Relay API **\n\
    \n+   - Opening and closing a relay channel is done with\n\n```\n#include <linux/relay.h>\n\
    \nstruct rchan *relay_open(const char *base_filename,\n\tdentry *parent,\n\tsize_t\
    \ subbuf_size,\n\tsize_t n_subbuffs,\n\tstruct rchan_callbacks *cb\n\tvoid *private_data);\n\
    void relay_close(struct rchan *chan);\n```\n\nwhich associates a file with the\
    \ channel for each CPU; e.g., if base_filename = \"my-chan\", the files will be\
    \ named mychan0, my_chan1, my_chan2. The associated files will appear in the directory\
    \ pointed to by your parent; if NULL, they will be in the filesystem's root directory.\n\
    \n+   - Each of the n_subbuffs is size of subbuf_size, so the total size of the\
    \ buffer is subbuf_size * n_subbuffs. Writes sent by kernel clients should not\
    \ be bigger than subbuf_size since they can't be split sub-buffers.\n\n+   - When\
    \ one wants to write into a relay channel, it is done with\n\n```\nvoid relay_write(struct\
    \ rchan *chan, const size_t data, size_t length);\n```\n\nand the information\
    \ will appear in the associated pseudofile. The final argument to relay_open()\
    \ is to a table of callbacks:\n\n```\nstruct rchan_callbacks {\n\tintint (*subbuf_start,\
    \ void)(struct rchan_buf *buf,\n\t\tvoid *subbuf,\n\t\tvoid *prev_subbuf,\n\t\t\
    size_t prev_padding);\n\t\tstruct rchan_buf *buf,\n\tvoid (*buf_mapped)(struct\
    \ rchan_buf *buf,\n\t\tstruct file *filp);\n}\n```"
