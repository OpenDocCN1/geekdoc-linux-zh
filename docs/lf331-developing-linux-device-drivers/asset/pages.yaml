- pgno: 307
  md: "# 32.4 gendisk Structure\n\n+   * The gendisk structure is defined in /usr/src/linux/include/linux/genhd.h\
    \ and describes a partitionable device. You'll have to set it up, manipulate it,\
    \ and free it when done.\n\n+   * The gendisk structure is:\n\n```\nstruct gendisk\
    \ {\n\t/* major number of driver */\n\tint major;\n\tint first_minor;\n\tint minors;\n\
    \n\t/* maximum number of minors, =1 for\n\t* disks that can't be partitioned.\
    \ */\n\tchar disk_name[32];\n\t/* name of major driver */\n\tstruct hd_struct\
    \ *part;      /* [indexed by minor] */\n\tint part_uevent_suppress;\n\tstruct\
    \ block_device_operations *fops;\n\tstruct request_queue *queue;\n\tvoid *private_data;\n\
    \tstruct sector_t capacity;\n\n\tintint flags;\n\tstruct device *drivers_dev;\n\
    \tstruct object *kobj;\n\tstruct object *holder_dir;\n\tstruct object *slave_dir;\n\
    \n\tstruct timer_rand_state *random;\n\tint policy;\n\n\tatomic_t sync_io;   \
    \   /* RAID *//\n\tunsigned long stamp;\n\tint in_flight;\n\t#ifdef CONFIG_SMP\n\
    \tstruct disk_stats *dkstats;\n#else\n\tstruct disk_stats dkstats;\n#endif\n};\n\
    ```\n\n+   * major is the major number associated with the device, and first_minor\
    \ is the first minor number for the disk.\n\n+   * disk_name is the disk name\
    \ without partition number; e.g., hdb.\n\n+   * fops points to the block_device_operations\
    \ structure. Putting it in the gendisk structure is how it is associated with\
    \ the device.\n\n+   * request_queue points to the queue of pending operations\
    \ for the disk. Note there there is only one request queue for the entire disk,\
    \ not one for each partition.\n\n+   * private_data points to an object not used\
    \ by the kernel and thus can be used to hold a data structure for the device that\
    \ the driver can use for any purpose.\n\n+   * capacity is the size of the disk\
    \ in 512 byte sectors; even if you have a different sector size, the capacity\
    \ has to be utilized in this way.\n\n+   * flags control the way the device operates.\
    \ Possible values include GENHD_REMOVABLE, GENHD_FL_CD etc."
