  md: "# Chapter 25\n\n# Network Drivers III: Transmission and Reception\n\n![](img/134c18b05ee9bbbe93ba3f4335720ac1_262_0.png)\n\
    \nWe'll study transmission and reception functions for network device drivers,\
    \ and how to get statistics as network driver.\n\n+   25.1 Transmitting Data and\
    \ Timeouts . . . . . . . . . . . 247\n25.2 Receiving Data . . . . . . . . . .\
    \ . . . . . . . . . . 248\n25.3 Statistics . . . . . . . . . . . . . . . . . .\
    \ . 249\n25.4 Labs . . . . . . . . . . . . . . . . . . . . 250\n\n# 25.1 Transmitting\
    \ Data and Timeouts\n\n+   • Here's a simple example of a transmission function:\n\
    \n```\nint my_start_xmit(struct sk_buff *skb, struct net_device *dev)\n{\n   \
    \ int len;\n    char *data;\n    struct my_data *priv = netdev_priv (dev);\n\n\
    \    len = skb->len;\n    data = skb->data;\n    dev->trans_start = jiffies;\n\
    \n    /* so we can free it in interrupt routine */\n    priv->skb = skb;\n```"
