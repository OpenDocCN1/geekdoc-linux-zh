- pgno: 71
  md: "# Module Usage Count\n\n5.11 The kernel needs to keep track of how many times\
    \ a module is referenced by user-space processes.\n(This is unrelated to how many\
    \ times the module is being used by other modules.) It is impossible to remove\
    \ a module with a non-zero reference count.\n\n+   - Once upon a time modules\
    \ were expected to do most of the bookkeeping on their own, incrementing the usage\
    \ count whenever a module was used by a process, and decrementing it when it was\
    \ done. This procedure was difficult to accomplish without incurring errors and\
    \ race conditions.\n\n+   - As an improvement, module usage is not kept track\
    \ by higher levels of the kernel rather than manually. For this work to work we\
    \ need to set the owner field in the appropriate data structure for the type of\
    \ module being considered. For instance a character device driver or a filesystem\
    \ driver, this would be the file_operations structure. One can set this through:\n\
    \n```\nstatic struct file_operations fops = {\n    owner = THIS_MODULE,\n    my_open,\n\
    }\n```\n\nNow the kernel will take care of the bookkeeping automatically. (Note\
    \ for built in kernel code, THIS_MODULE is set to NULL)\n\n+   - Other examples\
    \ of such structures containing tables of callback functions, or entry points,\
    \ with fields include block_device_operations and fs_ops.\n\n+   - If there is\
    \ a need to manually modify a module's usage count (to prevent unloading while\
    \ the module is being used) one can use the functions:\n\n```\nint try_module_get(struct\
    \ module *module);\nvoid module_put(struct module *module);\n```\n\n+   - That\
    \ a call like try_module_get(THIS_MODULE) can fail if the module is in the process\
    \ of being unloaded, in which case it returns 0; otherwise it returns 1. These\
    \ functions are defined to have no effect when module unloading is not allowed\
    \ as a kernel option during configuration.\n\n+   - The reference count is embedded\
    \ in the module data structure and can be obtained with the function\n\n```\n\
    unsigned int module_refcount (struct module *mod);\n```\n\nand would be invoked\
    \ in something like:\n\n```\nprintk(KERN_INFO \"Reference count = %d\\n\", module_refcount(THIS_MODULE));\n\
    ```\n\n# 5.12 Labs\n\n# Lab 1: Improving the Basic Character Device\n\n+   - Starting\
    \ from sample driver.c, extend it to:\n\n+   - Keep track of the number of times\
    \ it has been opened since loading, and print out the counter every time the device\
    \ is opened.\n\n+   - Print the major and minor numbers when the device is opened."
