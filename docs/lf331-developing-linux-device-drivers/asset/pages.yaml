  md: '# 6.3. SCHEDULING ALGORITHMS AND TASK STRUCTURES


    # 6.2 User-Space vs. Kernel-Space


    Execution modes


    +   - user mode


    Applications and daemons execute with limited privileges. (Ring 3 on x86.) This
    is true even if the application has root privileges.


    +   - kernel mode


    Kernel has direct, privileged access to hardware and memory. (Ring 0 on x86.)
    Drivers (and modules) have kernel privileges.


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_76_0.png)


    +   - Execution is transferred from user mode (space) to kernel mode (space) through
    system calls (which are implemented using synchronous interrupts, or exceptions)
    and hardware interrupts (or asynchronous interrupts).


    +   - The mode is a state of each CPU in a multi-processor system rather than
    the kernel itself, as each processor may be in a different execution mode.


    > > When running virtualization kernels the hypervisor runs in Ring 0, while the
    guest (client) kernels may run in Ring 0 or Ring 1 depending on the type of virtualization.

    > If it is Ring 1 a certain amount of trickery and/or emulation is required to
    accomplish this.


    # 6.3 Scheduling Algorithms and Task Structures


    +   - Scheduling is arguably the most important work the kernel does.


    +   - Tasks constantly switch back and forth between kernel mode and user mode
    (where they have lesser privileges.) Scheduling does not directly control these
    mode switches, but it does have to handle the context switching between different
    tasks.


    +   - Under Linux, a task by itself cannot preempt a current running task and
    take over; it must wait its turn for a time-slice. However, the scheduler can
    preempt one task to allow another to run.


    +   - Tasks run until one of the following occurs:'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# 62 CHAPTER 6. KERNEL FEATURES


    +   - They need to wait for some system event to complete (such as reading a file.)

    - The amount of time in their time-slice expires.

    - The scheduler is invoked and finds a more deserving task to run.


    Additionally, the 2.6 kernel has compile-options for a preemptive kernel; when
    configured every a single-processor system can behave like a multi-processor one,
    or lower latency and preempt code when it is in kernel. Thus all code that can
    be preempted this way must be fully-entrant.


    A task''s task_struct is the critical data structure under Linux, and contains
    all the kernel information about a task, and everything to switch in and out.
    It is sometimes called a process descriptor. It is defined in /usr/src/linux/include/sched.h.


    The structure of the current task (on the current CPU) can be referred to with
    the current macro, e.g., current->tg is the process ID and current->pid is the
    current task ID. (These can differ; for a multiple-threaded task each thread shares
    the same process ID but has a unique task (thread) ID.) This data structure contains
    information about signal handling, memory areas used by the process, parent and
    children tasks, etc.


    Within the kernel scheduler processes (or more precisely tasks, or threads) that
    run in user or kernel-space are identified by pointers to a task_struct, not by
    a pid. One can always obtain a pointer from a pid:


    ```

    struct task_struct *task = pid_find(vpid(pid), PIDTYPE_PID);

    ```


    (Note in a multi-threaded process this macro will locate the master thread, whose
    process identifier and thread identifier match.)


    One generally not need to obtain this information from a module and race conditions
    can be problem as pid''s can change during the lifetime of a process.


    While the schedule() function may be called directly (from kernel code, not user
    code), it is more likely reached through an interrupt such as: when the current
    task goes to sleep and is placed to wait; when a context switch occurs; just when
    a task returns to user mode from kernel; or after an interrupt is handled.


    When the scheduler runs it which task should occupy the CPU, and if it is a different
    task the current one, arrives the context switch. It tries to keep tasks on the
    same CPU (to minimize thrashing). When a new task is chosen to run, the state
    of the current task is saved in its task_struct and the new task is switched in
    and made the current.


    The scheduler before the 2.6.23 kernel was called the O(1) scheduler; the time
    to make a scheduling decision independent of the number of running tasks. It was
    designed to scale particularly well with SMP systems and those with many tasks.
    Separate queues maintained for each CPU; these queues were in a priority-ordered
    fashion, rather than having to touchdown search tasks for the right task to run,
    the decision could be made through a quick bit-map consultation.


    The 2.6.23 kernel saw replacement of the O(1) scheduler with an entirely new algorithm,
    which drives the CFS (Completely Fair Scheduler) scheduler.


    The completely fair time is the amount of time the task has been waiting to run,
    by the number of running tasks (with some varying priorities). This time is compared
    with the actual task which has received next


    CFS also includes hierarchical scheduler modules, each of which can be called
    in turn.'
  merge: -1
  img_proc: true
