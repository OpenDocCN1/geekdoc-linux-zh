- pgno: 301
  md: '# noop I/O Scheduler


    # 31.3 noop I/O Scheduler


    +   - This simple scheduler focuses on disk utilization. For a given device, a
    single queue is maintained. For each request it is determined if the request can
    be merged (front or back) with any existing request. If not the request is inserted
    in the queue according to the starting number.


    +   - In order to prevent the request from going stale, an aging algorithm determines
    how many times an I/O request may have been bypassed by newer requests, and a
    threshold prompts the request to be satisfied.


    +   - The noop scheduler is particularly useful for non-disk block devices (such
    as ram disks), as well as for specialized hardware that has its own I/O scheduling
    software and caching, such as some RAID controllers. By letting the custom hardware/software
    combination makes the decisions, this scheduler may actually outperform the more
    complex alternatives.


    # 31.4 Deadline I/O Scheduler


    +   - The deadline I/O scheduler aggressively reorders requests with the simultaneous
    goals of improving overall performance and preventing large latencies for individual
    requests; i.e., starvation.


    +   - With each and every request the kernel associates a deadline. Read gets
    higher priority than write requests.


    +   - Five separate I/O queues are maintained:


    +   - Two sorted lists are maintained, one for reading and one for writing, and
    arranged by starting block.


    +   - Two FIFO lists are maintained, again one for reading and one for writing.
    These lists are sorted by submission time.


    +   - A fifth queue contains the requests that are to be shoveled to the device
    driver itself. This is called the dispatch queue.


    +   - Exactly how the requests are peeled off the first four queues and placed
    on the fifth (dispatch queue) is where the art of the algorithm is.


    # Tunables


    +   - read_expire:


    +   - write_expire:


    +   - writes_starved:


    +   - How many requests should we give preference to reads over writes. (Default
    = 2 )


    +   - fifo_batch:'
