- pgno: 289
  md: '# CHAPTER 29. POWER MANAGEMENT


    +   More often it is because in the rush to getting a device driver operable,
    the power management callback functions are put on the back burner and seen as
    an enhancement or optimization to be done later. Unfortunately they are not coded
    properly or never written.


    +   There has been considerable frustration expressed about this in the kernel
    developer community, and even attempts to deny incorporation of drivers that fail
    to satisfy these callback functions.


    +   The lesswatts (http://www.lesswatts.com) contains a lot of information on
    tools, documentation, and methods for getting Linux to take better control of
    power management and reduce overall consumption.


    # 29.2 ACPI and APM


    +   Virtually all x86 mother boards will support ACPI (Advanced Configuration
    and Power Interface). The older APM (Advanced Power Management) interface is fairly
    obsolete and we won''t say much about it.


    +   The big difference is that APM for the most part leaves power management in
    the hands of the system BIOS, and provides an interface to access it. The newer
    ACPI standard puts the power management directly in the hands of the operating
    system, which leads to far more flexibility and direct control of peripherals.


    +   If both APM and ACPI are turned on the kernel, and if the system is compatible
    with ACPI, it will override and disable APM. You cannot mix and match features
    of both as they will corrupt each other.


    +   Both APM and ACPI require the use of user-space daemons (apmd and acidpid)
    which should be started during the system boot by the usual startup scripts. If
    the system doesn''t support the interface, the daemons will quit quite peacefully.


    +   No matter which power management facility you use, Linux uses the same functions
    in the drivers which simplifies things considerably. The actual interface is (fortunately)
    not very complicated.


    # 29.3 System Power States


    +   Under ACPI there is a detailed delineation of states, with G standing for
    global, and S for sleeping, These states are:


    > Table 29.1: ACPI Power States


    | State | Value | Meaning |

    | --- | --- | --- |

    | Mechanical Off | G3 | Power consumption is zero except for the real-time clock.
    Takes a long time to go back to the Working state, and a restart has to be done
    to get there. | Soft Off | G2/S5 | Minimal power used; no user or system code
    running. | G1 | Small amount of power used, user code not executed, system code
    running but the device appears off; i.e., no display etc. Not a high latency to
    the Working state, but it can depend on how it was put to sleep. The operating
    system does not require a reboot to get going. |'
  merge: -1
  img_proc: true
