    # 17.4 Exclusive Sleeping


    +   * So we have dealt only with so-called non-exclusive sleeping tasks. For instance,
    a number of tasks may be waiting for termination of a disk operation, and once
    it has completed they will all need to wake up and return.

    * If than one task is waiting for exclusive access to a resource (that only one
    can use at a time) then this kind of wake up is inefficient and leads to the thundering
    herd problem, where all sleepers are woken up only one of them can use the resource
    at a time.

    * In this case functions are required. Setting up the wait invokes the inline
    macro function:


    ```

    wait_event_interruptible_exclusive (wait_queue_head_t wq, int condition);

    ```


    (There is no non-interruptible exclusive sleep macro.)In this case only one sleeper
    will be woken up. If control is needed of new wake up functions can be:


    ```

    void wake_up_all               ( wait_queue_head_t *wq);

    void wake_up_interruptible_all ( wait_queue_head_t *wq);

    void wake_up_nr               ( wait_queue_head_t *wq, int nr);

    void wake_up_sync_nr          ( wait_queue_head_t *wq, int nr);

    void wake_up_interruptible_nr  ( wait_queue_head_t *wq, int nr);

    void wake_up_interruptible_sync_nr ( wait_queue_head_t *wq, int nr);

    ```


    +   * The ones with all in the name wake up all tasks in the queue, just as in
    the non-exclusive case, but those with _nr wake only nr tasks (typically nr=1).'
