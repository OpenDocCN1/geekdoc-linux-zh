    peripherals on SOC''s, and for legacy interconnects, where there is no major maintained
    specification such as PCI or USB.


    # 21.2 Main Data Structures


    The main data structures and methods are given in /usr/src/linux/include/linux/platform_device.h,
    with the platform_device structure describing the device:


    ```

    3.1: 19 struct platform_device {

    3.1: 20 const char *name;

    3.1: 21 int id;

    3.1: 22 struct device dev;

    3.1: 23 u32 num_resources;

    3.1: 24 struct resource *resource;

    3.1: 25

    3.1: 26 const struct platform_device_id *id_entry;

    3.1: 28 /* MFD cell pointer */

    3.1: 29 struct mfd_cell *mfd_cell;

    3.1: 30

    3.1: 31 /* arch specific additions */

    3.1: 32 struct pdev_archdata archarchdata;

    3.1: 33 });

    ```


    and contains a pointer to the appropriate device structure.


    The platform_driver structure describes the driver:


    ```

    3.1: 120 struct platform_driver {

    3.1: 121 int (*probe)(struct platform_device *);

    3.1: 122 int (*remove)(struct platform_device *);

    3.1: 123 void (*shutdown)(struct platform_device *);

    3.1: 124 int (*suspend)(struct platform_device *, pm_message_t state);

    3.1: 125 int (*resume)(struct platform_device *);

    3.1: 126 struct device_driver driver;

    3.1: 127 const struct platform_device_id *id_table;

    3.1: 128 };

    ```


    and contains a pointer to the appropriate device structure


    Note that with PCI devices there are macros to go back and forth between the connected
    device and platform_device_structures:


    ```

    3.1: 35 #define platform_device_get_id(pdev) (pdev)->id_entry

    3.1: 36

    3.1: 37 #define_to_platform_device(dev) container_of((dev),

    struct platform_device, dev)

    ```


    As other devices in the unified driver model framework, while discovery and enumeration
    of devices is done outside the actual drivers, one must supply probe() and remove()
    (methods) as well as the usual various power management functions). It is particularly
    important that the probe() method verify the hardware is actually present as platform
    setup code can not always determine this.'
