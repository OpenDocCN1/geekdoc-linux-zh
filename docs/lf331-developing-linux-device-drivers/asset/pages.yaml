    \ 8\n3.1: 369 #define TAINT_WARN 9\n3.1: 370 #define TAINT_CRAP 10\n3.1: 371 #define\
    \ TAINT_FIRMWARE_WORKAROUND 11\n\n> A phrase sometimes heard in the Linux kernel\
    \ developer community is:\n\n+   All binary modules are illegal.\n\n+   A debate\
    \ on this topic was held on the kernel mailing list in late 2006. (See http://lwn.net/Articles/215075\
