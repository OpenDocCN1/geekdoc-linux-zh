  md: '# Chapter 20


    # PCI


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_214_0.png)


    We''ll see how Linux uses PCI devices, and describe the various functions used
    to find and manipulate them.

    We''ll also consider what is PCI Express standard.


    +   20.1 What is PCI? ...................................................................
    199

    20.2 PCI Device Drivers ................................................................
    202

    20.3 Locating PCI Devices ................................................. 204

    20.4 Accessing Configuration Space ............................................
    205

    20.5 Accessing I/O and Memory Spaces ........................................
    206

    20.6 PCI Express .................................................................
    206

    20.7 Labs .................................................................................
    207


    # 20.1 What is PCI?


    +   PCI stands for Peripheral Component Interconnect. It replaces ISA (Industry
    Standard Architecture) with three main goals:


    +   - Better performance transferring data between CPU and peripherals.

    - Platform-independent as possible.

    - Simplify adding and removing peripherals.


    +   Information on the PCI devices currently installed on the system can be obtained
    with the command:


    ```

    $lspci -v

    ```


    ```

    00:00.0 Host bridge: Intel Corporation 4 Series Chipset DRAM Controller

    (rev 02)

    ```'
