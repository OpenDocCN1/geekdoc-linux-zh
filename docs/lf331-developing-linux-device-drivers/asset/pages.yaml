  md: "# CHAPTER 8. MODULES II: EXPORTING, LICENSING AND DYNAMIC LOADING\n\n# 8.3\
    \ Automatic Loading/Unloading of Modules\n\nrequest_module():\n\n+   - A module\
    \ may explicitly request loading of one or more other modules through:\n\n#include\
    \ <linux/kmod.h>\n\nint request_module (constant char *name, ...)\n\n The module\
    \ name will be dynamically loaded (using modprobe) together with any other required\
    \ modules. The name may be the actual name of the module or an alias specified\
    \ in /etc/modprobe.conf. The current process will sleep until the module is loaded.\n\
    - The additional variable number of arguments to request_module() represent a\
    \ formatted list in the manner of printf(). For example one could do:\n\nrequest_module(\"\
    my-device-xd\", device_number);\n\n Dynamic loading can occur only in the context\
    \ of a process; i.e., you will get errors if you call request_module() from an\
    \ interrupt handler. It must be called from a driver entry function.\n- The return\
    \ value of request_module() is not very useful; success implies only that the\
    \ request was properly executed, not that it succeeded. If you crawl through the\
    \ source, you'll see an exec() of modprobe is requested and the error status is\
    \ reported for it. Here the kernel actually makes an excursion to user-space.\n\
    - Note that the requesting module cannot call functions in the module; if that\
    \ were so it would not be able to load in the first place (due to unresolved references.)\
    \ In some sense, therefore, this function is a kind of pre-fetch.\n\n# Demand\
    \ Loading:\n\n+   - A module may require other modules to be loaded in a stack.\
    \ This may be accomplished either by:\n\n- Loading them in the proper order with\
    \ insmod\n- Loading them as a stack with modprobe. (Note that depmod must have\
    \ been run previously, and the modules to demand-loaded must be located in a place\
    \ known to depmod).\n\n# Dynamic Loading:\n\n+   - Often one will want a module\
    \ to be auto-loaded whenever its corresponding device node is accessed by an application.\
    \ An example would be having the sound driver loaded every time /dev/dsp is read\
    \ or written to applications.\n- This can be accomplished by inserting lines in\
    \ /etc/modprobe.conf of the form\n\n```\nalias block-major-254-* mybdrd\nalias\
    \ block-major-254-* mybdrd\n```\n\nwhere we have used a wildcard for the minor\
    \ number. (Note that the 2.4 kernel only took a major number, and that form will\
    \ still work.)"
