    # 5.4 Accessing the Device Node


    +   - Under Unix-like operating systems, such as Linux, applications access peripheral
    devices using the same functions as they would for ordinary files. This is an
    essential part of the everything philosophy. For example: listening to a sound
    would involve reading from the device node associated with the sound card (/dev/audio).


    +   - There are a limited number of entry points into device drivers, and in most
    cases there is a one to mapping of the system calls applications make the entry
    point in the driver where it is exercised when the call is made


    +   - For a given class of devices, such as character or block, the entries are
    the same irrespective of the actual device itself. In the case of character drivers,
    the mapping is relatively direct; in the case of block drivers there is more indirection;
    i.e., several layers of the kernel may intercede between the system call and the
    entry point: a read would involve the virtual filesystem, the actual filesystem,
    and cache layers before requests to get blocks of data on or off a device are
    made to the driver through a read() or write() system call.


