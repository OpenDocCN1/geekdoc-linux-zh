    # 23.1 Network Layers and Data Encapsulation


    +   Networking applications communicate with servers and clients which are also
    networking applications. These applications (or daemons) may either be on remote
    hosts or on the local machine.


    +   For the most part these applications are constructed to be independent of
    the actual hardware, type of network involved, routing, and specific protocols
    involved. This is not a general rule, however, as sometimes the application may
    work at a lower level or require certain features.


    +   Thus networking can always be seen as consisting of a number of stacked layers.
    This stack may be categorized in a number of ways, but a simple description appropriate
    for Linux (in which traffic moves both ways) would be:


    +   Application Layer: This can be familiar programs such as ftp, http and smtp,
    that communicate across the Internet, or programs as X clients and servers that
    communicate either across the Internet or on the local machine, as well as any
    custom network application.'
