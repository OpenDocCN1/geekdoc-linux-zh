    \n# 17.6 Polling\n\n+   - Applications keep their eye on a number of file descriptors\
    \ to see whether or not it is possible to do I/O on one or more of them at any\
    \ given time. The application will either sit and wait for one of the descriptors\
    \ to go active, or perhaps dedicate one for thread while others work.\n- Such\
    \ multiplexed and asynchronous I/O is at the basis of the traditional Posix system\
    \ calls select() and poll(), as well as the Linux-epoll system calls scale the\
    \ best to large numbers of descriptors.\n- In order to make poll() work on a file\
    \ descriptor corresponding to a character device, one needs to add the entry point\
    \ to the file_operations table as usual:\n\n```\nstatic struct file_operations\
    \ mycdrv_fops = {\n    .owner = THIS_MODULE,\n    ...\n    .poll = mycdrv_poll,\n\
    };\n\nstatic unsigned int mycdrv_poll(struct file *file, poll_table * wait);\n\
    ```\n\nWhenever an application calls poll(), select() or uses epoll this method\
    \ will be called.\n\n+   - First one must call the function\n\nvoid poll_wait(struct\
    \ file *filp, wait_head_queue_t *wq, poll_table *wait);\n\nfor each wait queue\
    \ change of status is to be noted.\n\n+   - Secondly one must return a bit-mask\
    \ which can be checked to see which (if any) I/O operations are available. A number\
    \ of flags can be combined in this mask:"
