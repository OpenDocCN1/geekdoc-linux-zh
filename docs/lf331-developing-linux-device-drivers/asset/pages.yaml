- pgno: 90
  md: '# 7.8. INSTALLING AN INTERRUPT HANDLER


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_90_0.png)


    +   - Kernels earlier than 2.6.19 contained a third argument, a data structure
    of type pt_regs, which holds a snapshot of the processor''s context before the
    interrupt. It is used mostly for debugging, and for restoring the register state
    after the interrupt is handled. The precise definition of this structure is CPU-dependent;
    /usr/src/linux/x86/include/asm/ptrace.h

    - The pt_regs argument was removed in the 2.6.19 kernel, as it was rarely used
    in drivers, eliminating it to saved stack space, and boosted performance somewhat.

    - If access to this structure should be needed, the inline function struct pt_regs
    *regs = get_irq_regs(); may be used.


    request_irq() can be called either upon device initialization or when the device
    is first used (open()). Before the introduction of udev it was better to do it
    in open() when the device was first used. However, with udev doesn''t tend to
    pre-load devices. This function should be called before the device is sent an
    instruction to ensure generation of interrupts.


    free_irq() can be called during cleanup or release() (close). This function should
    be called only after the device is instructed not to interrupt the CPU anymore.


    Before calling free_irq() one should call synchronize_irq() which ensures that
    all handlers for this particular IRQ are finished before the request is made.
    One should be careful that this function does not block.


    The interrupt handler returns a value of type irqreturn_t. The three possible
    return values and a convenience macro are:


    Table 7.6: IRQ Handler Return Values


    | Return Value | Meaning |

    |---|---|n| IRQ_NONE | The handler did not recognize the event; i.e., it was due
    to some other device sharing the interrupt, or it was spurious. |

    | IRQ_HANDLED | The handler recognized the event and did whatever was required.
    |

    | IRQ_WAKE_THREAD | Used for threaded interrupt handlers, to be discussed later.
    |

    | IRQ_RETVAL(x) | Evaluates as IRQ_HANDLED if the argument is non-zero; IRQ_NONE
    otherwise. |


    +   - If no registered handler returns IRQ_HANDLED for a given IRQ, it is assumed
    to be spurious and a warning message is printed. Note that there is still no consumption
    of interrupts; all registered handlers are still called for a given IRQ line,
    one or more of them claim to have handled the event.'
  merge: -1
