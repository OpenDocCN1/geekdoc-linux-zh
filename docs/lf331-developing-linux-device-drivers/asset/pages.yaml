- pgno: 150
  md: '# Chapter 15


    # Memory Management and Allocation


    We will see how Linux distinguishes between virtual and physical memory and how
    they work together. We''ll discuss the memory zone allocator scheme. We''ll consider
    how memory is organized into pages and the various algorithms used to control
    and access them. We''ll consider the various methods Linux uses to allocate memory
    within the kernel and device drivers, distinguishing between the kmalloc() and
    valloc() methods, and how to allocate whole pages or ranges of pages at once.
    We''ll also consider how to grab larger amounts of memory at boot.


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_150_0.png)


    +   * 15.1 Virtual and Physical Memory 135

    * 15.2 Memory Zones 136

    * 15.3 Page Tables 137

    * 15.4 kmalloc() 138

    * 15.5 get_free_pages() 139

    * 15.6 valloc() 140

    * 15.7 Early Allocations and bootmem() 141

    * 15.8 Slabs and Cache Allocations 141

    * 15.9 Labs 144


    # 15.1 Virtual and Physical Memory


    +   * Linux uses a virtual memory system (VM), as all modern operating systems:
    the virtual memory is larger than the physical memory.

    * Each process has its own, protected address space. Addresses are virtual and
    must be translated to and from physical addresses by the kernel whenever a process
    needs to access memory.

    * The kernel itself uses virtual addresses; however the translation can be as
    simple as an offset depending on the architecture and the type of memory being
    used.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# CHAPTER 15. MEMORY MANAGEMENT AND ALLOCATION


    +   In the following diagram (for 32-bit platforms) the first 3 GB of virtual
    addresses are used for user-space memory and the upper GB is used for kernel-space
    memory (Other architectures have the same setup, but differing values for PAGE_OFFSET;
    for 64-bit platforms the value is in the stratosphere.)


    | | |

    |---|---|

    | 4 GB | Kernel Addresses |

    | 3 GB | PAGE_OFFSET (C0000000) |

    | 0 GB | User Addresses |


    Figure 15.1: User and Kernel Address Regions


    +   The kernel allows fair shares of memory to be allocated to every running process,
    and coordinates when memory is shared among processes. In addition, mapping can
    be used to link a file directly to a process''s virtual address space. Furthermore,
    certain areas of memory can be protected against writing and/or code execution.


    +   For a comprehensive review of What Every Programmer Should Know About Memory,
    Ulrich Drepper''s long article at http://people.redhat.com/drepper/cpumemory.pdf.
    covers many issues in depth such as proper use of cache, alignment, NUMA, virtualization,
    etc.


    # 15.2 Memory Zones


    +   Linux uses a zone allocator algorithm, which is implemented in /usr/src/linux/mm/page_alloc.c.
    In this scheme, which has an object-oriented flavor, each zone has its own methods
    for basic memory operations such as allocating and freeing pages of memory.


    +   There are three memory zones:


    +   DMA-capable memory must be used for DMA data transfers. Exactly what this
    depends on the platform; for example, on x86 ISA devices it means the memory lie
    below 16 MB.


    +   High memory requires special handling and is meaning only certain platforms.
    It allows access for up to 64 GB of physical memory. On the 32-bit x86 it means
    memory at and above 896 MB.


    +   Normal memory is everything else.


    +   By looking at /proc/zoneinfo one can ascertain usage statistics for each operative
    zone.'
