- pgno: 85
  md: '• Under MSI devices send 16-bit messages to specified memory addresses by sending
    an inbound memory write to the front side bus (FSB). The message value is opaque
    to the device but delivery generates an interrupt. The message is not acknowledged,
    and thus we get an edge-triggered interrupt.


    • Under MSI device can use up to 32 addresses and interrupts, although the operating
    system may not be able to use them all. The address is the same for each message,
    but they are distinguished by modifying low bits of the message data.


    • MSI-X messages become 32-bit and up to 2048 inbound messages can be sent for
    each device. Each MSI-X interrupt uses a different address and data value (unlike
    MSI).


    • There are important advantages of using message-signed interrupts. First, the
    device no longer has to compete for a limited number of IRQ lines; thus there
    is no need to share. Interrupt latency is therefore potentially reduced and getting
    rid of sharing also makes behaviour more predictable and less variable.


    • MSI is optional for PCI 2.3 compliant devices and mandatory for PCI-Express
    devices. Support for MSI and MSI-X must be configured in the kernel to use them;
    only one standard can be used in a particular driver at a time.


    • Details about the Linux implementation are given in /usr/src/linux/Documentation/PCI/MSI-HOWTO.txt,
    which contains details about the API and enumerates important considerations.


    # 7.5 Enabling/Disabling Interrupts


    • Sometimes it is useful for a driver to enable and disable interrupt reporting
    for an IRQ line. The functions for doing this are:


    ```

    #include <asm/irq.h>

    #include <linux/interrupt.h>


    void disable_irq(int irq);

    void disable_irq_nosync(int irq);

    void enable_irq(int irq);

    ```


    These actions are effective only for the CPU on which they are called; other processors
    continue to process the disabled interrupt.


    • Because the kernel automatically disables an interrupt before calling its service
    routine and enables it when done, it makes no sense to use these functions in
    the handler servicing a particular IRQ.


    • Calling disable_irq() ensures any presently executing interrupt handler completes
    before disabling occurs, while disable_irq_nosync() will return instantly. While
    this is faster, race conditions may result. The second form is dangerous. However,
    the first form can lead to deadlock if used while a resource is being held that
    the handler may need; the second form may permit the resource to be freed.


    • It is important to note that the enable/disable functions have a depth; if disable_irq()
    has been called twice, enable_irq() will have to be called twice before interrupts
    are handled again.


    • It is possible to disable/enable all interrupts, in order to protect critical
    sections of code. This is best done with the appropriate spinlock functions:'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# 7.6 WHAT YOU CANNOT DO AT INTERRUPT TIME


    ```

    unsigned long flags;

    spinlock_t my_lock;

    spinlock_init(&my_lock);


    spin_lock_irqsave(&my_lock,flags);

    .... critical code

    spin_unlock_irqrestore(&my_lock,flags);

    ```


    +   - You should be very careful with the use of these functions as you can paralyze
    the system.


    # What You Cannot Do at Interrupt Time


    +   - Interrupts do not run in process context. Thus you cannot refer to current
    to access the fields of the task_struct as they are ill-defined at best. Usually
    current will point to whatever process was running when the interrupt service
    routine was entered, which has no priori connection to the IRQ.

    - Anything which blocks can cause a kernel freeze, at least the processor that
    blocks. In particular you cannot call schedule() or use any of the sleep functions,
    directly or indirectly. Indirect usage would happen for instance if you try to
    allocate memory with the flag GFP_KERNEL which can block memory is not currently
    available, so you have to use GFP_ATOMIC instead.

    - You cannot take out a mutex.

    - You cannot do down() on a semaphore as it can block while waiting for a resource.
    However, you can do an up() or any kind of wake_up().

    - You cannot request loading a module with request_module().

    - You cannot transfer any data from or to a process''s address space; i.e., no
    use of the get_user(), put_user(), copy_to_user(), copy_from_user(). Only these
    functions have the potential to sleep, because there is no real user context one
    also cannot transfer data and from user-space using these functions.


    # 7.7 IRQ Data Structures


    +   - The basic data structures involving IRQ''s are defined in /usr/src/linux/include/linux/irqdesc.h
    and /usr/src/linux/include/linux/interrupt.h.

    - For each IRQ there is a descriptor defined as:


