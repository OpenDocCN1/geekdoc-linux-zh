    - Thus for a write the data should be placed in the buffer before the mapping;
    for a read it should not be touched until after the unmapping (which could be
    done after the device signals, through an interrupt, that it is through the transfer.)


    - A third kind of mapping is a so-called Scatter-gather DMA Mapping. This permits
    several buffers, which may be non-contiguous, to be transferred to or from the
    device at one time.


    - It is also possible to set up a DMA pool, works pretty much like a memory cache.
    We''ll consider that next.


