  md: '# Chapter 28


    # Memory Technology Devices**


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_282_0.png)


    We are going to consider the different types of MTD devices, how they are implemented,
    and the various filesystems used with them.


    | 28.1 What are MTD Devices? ..........................................................................................................................
    | 267 |

    | 28.2 NAND vs. NOR .................................................................................................................................
    . . . . . | 268 |

    | 28.3 Driver and User Modules .................................................................................................................................
    . . . | 269 |

    | 28.4 Flash Filesystems .................................................................................................................................................
    . | 269 |

    | 28.5 Labs .................................................................................................................................................................................
    . . . . . . | 270 |


    > ** These sections may be considered in part or in as optional. They contain
    either background reference material, specialized topics, or advanced subjects.
    The instructor may choose to cover or not cover them depending on classroom experience
    and time constraints.


    # 28.1 What are MTD Devices?


    +   * Memory Technology Devices (MTD) are flash memory devices. They are often
    used in various embedded devices.

    * Such a device may have all of its memory in flash (which functions like a hard
    disk in that its values are preserved upon power off) but often it will have normal
    RAM of some type.

    * Flash memory is a high-speed EEPROM where data is programmed (and erased) in
    blocks, rather than byte by byte as in normal EEPROM.

    * MTD devices are neither character or block in type; in particular they distinguish
    between write and erase operations, which block devices don''t.'
  merge: -1
  img_proc: true
- pgno: 283
  md: "• Normal filesystems are generally not appropriate for use with flash devices\
    \ for a number of reasons, we'll detail later, so special filesystems have been\
    \ designed.\n\n• The Execute in Place, or XIP, method, in which the CPU maps pages\
    \ of memory from the flash-residing application directly to its virtual address\
    \ space, with copying of pages to RAM first, and can be useful in embedded devices.\n\
    \n• Some useful references:\n\n# Table 28.1: MTD Links\n\n| http://www.linux-mtd.infrade.org\
    \ | The main web site for Linux MTD development. |\n|---|---|n| http://www.linuxforddevices.com/articles/A1T7478621147.html\
    \ | A paper by Cliff Brake and Jeff Sutherland about using flash in embedded Linux\
    \ systems. |\n\n# 28.2 NAND vs. NOR\n\n+   • There are two basic kinds of flash\
    \ memory: NOR and NAND.\n\n+   • NOR flash devices are the older variety with\
    \ these features:\n  - A linear addressed device, with individual data and address\
    \ lines; just like DRAM.\n  - Addressed can be directly mapped to the CPU's address\
    \ space and accessed like ROM.\n  - Programming and erase speeds are respectable;\
    \ erase are slower than programs.\n  - Function like RAM, access is random.\n\
    \  - The number of erase cycles is limited, about 100,000 or so.\n  - Recent development\
    \ of MLC (multi-level cell) techniques, in which two bits of memory can be stored\
    \ per cell, with boosted density and reduced manufacturing costs per unit of memory,\
    \ although may come at the cost of reduced performance.\n  - Traditionally these\
    \ devices have been associated with data storage.\n\n+   • NAND flash devices\
    \ are newer, and these have these features:\n  - Addressing is non-linear; data\
    \ and commands are multiplexed on 8 I/O lines. Thus, device drivers are more complex.\n\
    \  - Access is sequential.\n  - Densities are much higher than with NOR devices,\
    \ and the speed is an order of magnitude faster.\n  - Bad blocks can be a problem;\
    \ NAND devices may ship with them, but at any rate, blocks will fail with time,\
    \ and thus drivers have to do block management.\n  - Traditionally these devices\
    \ have been associated with data storage.\n\n+   • Since 1999 NAND has grown from\
    \ one tenth of the total flash market to most of it.\n\n+   • Regardless of which\
    \ method the underlying flash device uses, Linux can use the same basic methods\
    \ to access it.\n\n+   • Here is a table from http://www.linux-mtd.infrade.org/doc/nand.html\
    \ documenting some of the differences between NAND and NOR devices:"
  merge: -1
  img_proc: true
- pgno: 284
  md: '# 28.3. DRIVER AND USER MODULES


    Table 28.2: NOR AND NAND Device Features


    | Interface | NOR | NAND |

    | --- | --- | --- |

    | Interface | Bus | I/O |

    | Cell Size | Large | Small |

    | Cell Cost | High | Low |

    | Read Time | Fast | Slow |

    | Program Time (single byte) | Slow | Slow |

    | Program Time (multi byte) | Slow | Fast |

    | Erase Time | Fast | Fast |

    | Power consumption | High | Low, but requires RAM |

    | Can execute | Yes | No, but newer chips can execute a small loader out of the
    first |

    | Bit twiddling | nearly strict | 1-3 times, also known as “partial page program
    restriction” |

    | Bad blocks at ship time | No | Allowed |


    # 28.3 Driver and User Modules


    +   - MTD subsystem in Linux uses a layered approach, in which the lower hardware
    device driver layer is ignorant of filesystems and storage formats, and need only
    simple entry points for methods like read, write, and erase. Unlike the upper
    layer is ignorant of the underlying hardware but handles all interaction with
    user-space.

    - Thus, there are two kinds of modules comprise the MTD subsystem; user and driver.
    These may or may not be kernel modules; they can be built-in.

    - User modules provide a high level interface to user-space, while Driver modules
    provide the raw access to the flash devices.

    - Implemented User modules includes:


    +   - Raw character: direct byte by byte access, needed to construct a filesystem
    or raw storage.

    - Raw block: used to put normal filesystems on flash. Whole flash blocks are cached
    in RAM.

    - FTL: NTFS (Flash Translation Filesystem)

    - Microsoft Flash Filing System: Read-only for now.

    - Journaling Flash File System (JFFS2): Full read/write, compressed journaling
    filesystems.


    # 28.4 Flash Filesystems


    +   - Filesystems for flash devices pose some important challenges:

    - Block sizes can be relatively large (64 KB to 256 KB). Under present Linux implementations,
    a block device system can not have a block size bigger than a page of memory (4
    KB on x86 and many other platforms.).

    - NOR has a finite limit to the number of erase cycles per block; typically about
    100,000. It is important to use all parts of the device used.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# CHAPTER 28. MEMORY TECHNOLOGY DEVICES**


    +   - There may be bad blocks which must to be locked out.

    - Flash memory is expensive, compressed filesystems are attractive.

    - Journalling is important enhancement; it shortens the power-down procedure.

    - Execution in place is often needed in embedded systems, but it is orthogonal
    to compression.


    +   * A number of different filesystems have been used for flash devices, and
    let''s consider each in them.


    +   * initrd (Initial Ram Disk) was originally developed for floppy based systems,
    and then later to load a basic operating system which could then load essential
    drivers, such as in the case of SCSI systems.


    +   * When used with flash memory, initrd begins by copying a compressed kernel
    from flash to RAM and executes the copy, by which turn decompresses the initrd
    image and mounts it over the ramdisk driver.


    +   * The disadvantages are fixed size, which is wasteful, and loss of changes
    upon reboot. Better approaches are now available.


    +   * cramfs is a compressed readonly filesystem where the compression is done
    at the unit of pages. An image is placed in flash and important filesystems are
    placed there. The filesystem is made with mkcramfs program, and can be checked
    with the cramfs utility.


    +   * jffs and its descendant jff2 are complete read/write, compressed, journaling
    filesystems. jffs was originally developed by Axis Communications in Sweden (http://developer.axis.com/software/jffs),
    and had no compression. jff2 provides compression and is developed by a team led
    by David Woodhouse (http://sourceware.org/jff2).


    +   * The jff2 filesystem consists of a list of nodes (log entries) containing
    file information. When the filesystem is mounted the entire log is scanned to
    figure out how to put together files.


    +   * Nodes are written sequentially from the first block, and when the end is
    reached, the beginning is looped over. This spreads out over the device; i.e.,
    it provides wear-leveling.


    +   * Note that more than one filesystem can be used on a flash device. For instance
    read-only material can be in a cramfs filesystem, frequently changing data can
    be placed on ramfs, and anything requiring read/write access and preservation
    across reboot can be put on jff2.


    # 28.5 Labs


    # Lab 1: Emulating MTD in memory


    +   * If you don''t have any MTD devices on your system, you can emulate them
    in memory, using some built-in kernel features.


    +   * First you''ll have to make you have all the right facilities built into
    the kernel. Go to the kernel source directory, make xconfig and turn on the appropriate
    MTD options, as well as including the jff2 filesystem.


    +   * The important ones are: under MTD, turn on Memory Technology Device Support,
    pick a level of debugging (3 should show all), turn on Direct char device...,
    etc. Also turn on Driver using RAM and MTD emulation using block device. By default
    you''ll get a size of 4 MB with 128 KB erase size. From Filesystems, turn on JFFS(2)
    and pick a verbosity level.'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'If you have done everything as modules you may get away without a reboot, as
    long as you run depmod. At any rate, recompile, reboot, etc., into the kernel
    that now includes MTD and JFFFS2.


    We''ll test the character emulation interface. To do this you have to make sure
    you create the device node:


    ```

    $ mknod -m 666 /dev/mtd0 90 0

    ```


    Before or after this, you''ll have to make sure to


    ```

    $ /sbin/modprobe mtdram total_size=2048 erase_size=8

    ```


    (or leave the options to get the default values you compiled into the kernel.)
    You won''t have to run modprobe if you haven''t done this as modules.


    You can use this as a raw character ram disk, reading and writing to it. Experiment
    using dd, cat, echo, etc.


    # Lab 2: jff2 filesystem and MTD block interface.


    In order to place a jff2 filesystem on a MTD device it is easiest to first make
    a filesystem image on another filesystem, and copy it over. To do this you must
    use the mkfs.jff2 utility, which you can download in source or binary form from
    http://sourceware.org/jff2.


    You''ll need to do


    ```

    $ /sbin/modprobe mtdblock

    ```


    if you haven''t built this the kernel.


    You''ll also have to make the proper device node:


    ```

    $ mknod -m 666 /dev/mtd0 b 31 0

    ```


    (Note that you have to do the previous lab and leave the module loaded for this
    lab to work.)


    Populate a directory tree (say /dir_tree) with some files and subdirectories;
    the total size should be less or equal to the size of MTD ram disk. Put a filesystem
    on it and copy over to the MTD block emulator with:


    ```

    $ mkfs.jff2 -d ./dir_tree -o /dev/mtdblock

    ```


    (You may want to separate these steps so to keep the initial filesystem image;
    i.e., do nothing


    ```

    $ mkfs.jff2 -d ./dir_tree -o jff2.image

    $ dd if=jff2.image of=/dev/mtdblock

    ```


    Now you can mount the filesystem and play with it to your heart''s content:


    ```

    $ mkdir /mnt_jff2

    $ mount -t jff2 /dev/mtdblock /mnt_jff2

    ```


    Note that you can change the contents of the filesystem as you would like, but
    the updates will be lost when you unload the MTD modules or reboot. However, you
    can copy the contents to an image file and save that for restore.'
  merge: -1
  img_proc: true
