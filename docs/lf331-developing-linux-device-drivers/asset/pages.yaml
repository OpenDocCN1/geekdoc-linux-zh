- pgno: 264
  md: "# 25.3 STATISTICS\n\n```\nvoid mynet_rx(struct net_device *dev, int len, unsigned\
    \ char *buf)\n{\n    struct sk_buff *skb;\n    skb = dev_alloc_skb(len+2);\n \
    \   skb_reserve(skb, 2);\n    memcpy(skb_put(skb, len), buf, len);\n    skb->dev\
    \ = dev;\n    skb->protocol = eth_type_trans(skb, dev);\n    skb->ip_summed =\
    \ CHECKSUM_UNNECESSARY;\n    dev->rx_packets++;\n    netif_rx(skb);\n    return;\n\
    }\n```\n\n+   Since the Ethernet header is 14 bytes long, the skb_reserve() function\
    \ is called to pad out so that the Internet header can be put on a word boundary.\
    \ The job of the driver is done when the socket buffer is passed upward and onward\
    \ by netif_rx().\n\n# 25.3 Statistics\n\n+   Statistics are stored in a structure,\
    \ accessed from the type net_device_stats. They are accessed through the dev->net_device_stats\
    \ function field, which should return a pointer to the data structure. For example:\n\
    \n```\n.ndo_get_stats = mynet_stats;\n\nstatic struct net_device_stats *mynet_stats(struct\
    \ net_device *dev)\n{\n    return &dev->stats;\n}\n\n```\n\n+   The net_device_stats\
    \ data structure looks like:\n\n```\nstruct net_device_stats {\n    unsigned long\
