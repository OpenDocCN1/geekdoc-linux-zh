    | Bits | Name | Meaning | Description |

    |---|---|---||

    | 8 | IOC_TYPEBEITS | type | magic number to be used throughout the driver |

    | 8 | IOC_NRBITS | number | the sequential number |

    | 14 | IOC_SIZEBITS | size | of the data transfer |

    | 2 | IOC_DIRBITS | direction | of the data transfer |


    • The direction can be one of the following:


    +   - IOC_NONE

    - IOC_READ

    - IOC_WRITE

    - IOC_READ | IOC_WRITE


    and is seen from point of view of the application.


    • The size and direction information can be used to simplifying data back and
    forth between user-space and kernel-space, using arg as a pointer. Note there
    is no enforcement here; you can send information either way not what direction
    is used to define the command. The largest transfer you can set up this way is
    16 KB, since you have only 14 bits available to encode the size.


    • You are not required to pay attention to the split up of the bits in the command,
    but it is a good idea to do so.


    # Useful macros:


    +   • Encode the ioctl number:


    ```

    IO(type, number)

    IOR(type, number, size)

    IOW(type, number, size)

    IOWR(type, number, size)

    ```


    One has to be careful how the parameter size is used. Rather than passing an integer,
    one passes the actual data structure, which then gets a sizeof() primitive applied
    to it; e.g.,


    ```

    MY_IOCTL = IOWR(''k'', 1, struct my_data_structure);

    ```


    This won''t work if my_data_structure has been allocated dynamically, as in case
    sizeof() will return the size of the pointer.


    +   • Decode the ioctl number:


    +   - IOC_DIR(cmd)

    - IOC_TYPE(cmd)

    - IOC_NR(cmd)

    - IOC_SIZE(cmd)'
