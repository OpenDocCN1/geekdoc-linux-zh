    # 9.2 Kernel Debuggers


    +   - The first thing to understand about using debuggers on the Linux kernel
    is that Torvalds hates them For his explanation of why, see http://lwn.net/2000/0914/a/lt-debugger.php3.
    The short explanation for this attitude is that reliance on debuggers is encouraging
    fixing problems with band-aids rather than brains, leads to root code.


    +   - Linux will tolerate (and even encourage) optional debuggers that either
    check specific known errors (e.g., as I am while holding a spinlock()?), or require
    only an entry point into the kernel, and permit their work to be done through
    modules.


    # gdb


    +   - The gdb debugger can be used to debug a running kernel. One execution line
    would be:


    ```

    $ gdb /boot/vmlinux /proc/kcore

    ```


    where the first argument is the currently uncompressed kernel. One can use ddd
    or other graphical interfaces to gdb. The sections of the kernel being debugged
    must have been compiled with the -g option, to get much useful information. This
    is not for the faint-hearted. It is pretty difficult.


    # kgdb and kdb


    +   - kgdb is an interactive kernel debugger. In its fully capable mode it requires
    two computers to be connected through a null- modem serial cable. On the remote
    host you runs gdb (or a GUI wrapper to it it such as ddd) and then break into
    the kernel on the target system, setting breakpoints, examining data, etc. It
    is possible to stop the target machine kernel during the boot process.


    +   - kgdb was incorporated in the mainline kernel with kernel version 2.6.26.


    +   - Another interactive kernel debugger, kdb, existed for a long time as an
    out-of-tree kernel patch. It had the ability to:'
