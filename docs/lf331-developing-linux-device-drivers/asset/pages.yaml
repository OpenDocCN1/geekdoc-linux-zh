- pgno: 268
  md: '# 26.2 CHANGES IN LINK STATE


    # 26.2 Changes in Link State


    +   - Network connections can go up and down due to external events, such as plugging
    a cable in and out. Almost all network devices have a capability of sensing a
    carrier state; when present it means the hardware is available.


    +   - Linux provides the following functions to notify the other networking layers
    when the state goes up or down to inquire about it:


    ```

    void netif_carrier_on (struct net_device);

    void netif_carrier_off (struct net_device);

    int netif_carrier_ok (struct net_device *);

    ```


    +   - The on and off functions should be called when the driver detects a change
    of state. They may also be called to bracket a major configuration change, or
    reset.


    +   - The final function just checks the net_device structure to sense the state.


    # 26.3 ioctls


    +   - When an ioctl() command is passed to a socket descriptor, the command is
    first compared to those defined in /usr/src/linux/include/linux/sockios.h.


    +   - If the command is a socket configuration command, such as SIOCSIFADDR it
    is directly acted upon by high levels of the networking code.


    +   - The command may be one of the protocol-specific functions defined in the
    header file. In either case, the third argument to ioctl() is cast as a pointer
    to a structure of type struct ifreq, defined in /usr/src/linux/include/linux/if.h.


    +   - If the kernel doesn''t recognize the command, it is passed to the do_ioctl()
    method defined in the driver.

    int (*do_ioctl)(struct net_device *dev, struct ifreq *ifr, int cmd);


    +   - For this purpose 16 commands are seen as private to the device (SIOCDEVPRIVATE
    through SIOCDEVPPRIVATE+15).


    +   - Note that the ifr field actually points to a kernel-space copy of the user-passed
    data structure. Thus the driver can freely use this structure without resort to
    functions copy_to_user().


    # 26.4 NAPI and Interrupt Mitigation


    +   - The straightforward way to write a network driver is to have the arrival
    of each packet accompanied by an interrupt. The interrupt handler does the necessary
    work (including queuing work for deferred processing, perhaps through a tasklet)
    and is then ready for more data.


    +   - For high-bandwidth devices such an approach can cause problems; even if
    the full bandwidth can be maintained, the amount of CPU time spent to keep up
    with it can start to overwhelm the system.


    +   - The 2.6 kernel contains an alternative method, or interface, based on polling
    the device. This interface is called NAPI (New API) for lack of a better name.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# CHAPTER 26. NETWORK DRIVERS IV: SELECTED TOPICS


    +   A device capable of using NAPI must be able to store some number of packets
    (either on board or in-memory DMA buffer). It also must be capable of disabling
    interrupts for packet reception while continuing to issue interrupts for successful
    transmissions (and possibly other events).


    +   These capabilities, a NAPI-based driver turns off reception interrupts, and
    periodically polls for accumulated interrupts. When traffic slows down, normal
    interrupts are turned back on and the driver functions in the old-fashioned way.


    +   One should repeat that while NAPI-based drivers exist for many devices, they
    may not directly improve throughput. However they may significantly cut down on
    CPU load.


    # 26.5 NAPI Details


    +   Assuming one has the necessary hardware capabilities for the device (the ability
    to turn off interrupts for incoming packets and to turn off a sufficient amount
    of data packets).


    +   One has to write a function that will handle the data that has accumulated
    while incoming data interrupts are turned off. A weight parameter indicates how
    much traffic should be accepted through the interface, for 10 MB interfaces it
    should be set to 16; faster interfaces should use 64. The weight parameter should
    not be a meter greater than the number of packets the interface can store.


    +   One must also rewrite the interrupt handler routine so that when an incoming
    packet is received (with incoming interrupts obviously) it should turn off further
    reception interrupts, and hand the packet off to the function netif_rx_schedule(struct
    net_device *) which will induce the poll() method to be called eventually.


    +   When all available packets can be processed reception interrupts are turned
    back on and netif_rx_complete() is called to turn off polling if it returns a
    value of 0. A return value of 1 indicates more packets need to be processed.


    # 26.6 TSO AND TOE


    +   The purpose of TSO (TCP Segmentation Offload) is to allow a buffer larger
    than the usual MTU (maximum transfer unit), which is only 1500 bytes, to be passed
    to the network device.


    +   The breaking down (segmentation) of the large buffer into smaller mtu-sized
    segments can pass through routers, switches, etc., normally done by the CPU before
    data is passed to the device.


    +   With TOE, a 64 KB buffer is broken into 44 mtu-sized segments on the device
    itself. Each fragment, or packet, has attached to it the TCP and IP protocol headers,
    using a template.


    +   The result is a potentially large reduction in the load on the CPU rather
    than an increase of bandwidth, as is the case with many advanced techniques. Generally
    TSO will be important only for high-bandwidth, such as 1 GB or greater network
    devices.


    +   The purpose of TOE (TCP/IP Offload Engine) technology is to move TCP/IP processing
    to an integrated circuit on the network card. As with TSO, the idea is to free
    up the CPU to do other work.


    +   Unlike TSO, the TOE mechanism handles both inbound and outbound traffic. Because
    it is a connection-oriented protocol, the TOE is a lot of complexity involved.


    +   In Linux, kernel developers have rejected inclusion of TOE while they have
    heartily embraced it. One reason is that performance levels are not enough to
    justify the complexity.'
  merge: -1
  img_proc: true
