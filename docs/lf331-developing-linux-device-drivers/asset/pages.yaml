    # 12.1 What are ioctls?


    +   • ioctl''s (input output control) are special functions which are unique to
    a device or class of device. ioctl(1) is both a call from user-space, as well
    as a driver entry point (i.e, like write(), read(), etc.).


    +   • Various commands can be implemented with either to send or receive information
    from a device. One can control device behaviour; i.e, shutdown, reset and modify.
    One can send out-of-band messages even while reads and writes are pending.


    +   • Excessive use of ioctl''s is not favored by Linux kernel developers, as
    by their very nature they are used to do almost anything, including adding what
    are essentially new system calls.


    +   • To use ioctl''s, one has to first open a device using the open() system
    call, and then send the appropriate ioctl(1) command and any necessary arguments.


    ```

    #include <sys/ioctl.h>


    intctl(int fd, int command, ...);

    ```'
