- pgno: 209
  md: '# 19.7 Allocating and Mapping I/O Memory


    +   - Non-trivial peripheral devices are almost always accessed though on-board
    memory which is remapped and made available to the processor over the bus. These
    memory locations can be used as buffers, or behave as I/O ports which side effects
    associated with I/O operations.


    +   - Exactly how these memory regions are accessed is architecture-dependent.
    However, Linux handles the dependence by using a universal interface. While some
    architectures permit direct dereferencing of pointers for these regions, one should
    never attempt this.


    +   - There are three essential steps in using these regions: requesting, remapping,
    and use of the appropriate read/write functions.


    +   - Before such a memory region used it must be requested or reserved (and eventually
    free) with:


    ```

    struct *request_mem_region(unsigned long start, unsigned long len, char *name);

    void release_mem_region(unsigned long start, unsigned long len);

    ```


    which work on a dev, extending from address start, and using name to describe
    the entry created in /proc/iopem. The starting address is a characteristic of
    the device; e.g., for PCI devices may be read from a configuration register, or
    obtained from the function pci_resource_start().


    +   - One cannot directly use the pointer to the start address; instead one must
    remap and eventually unmap it with:


    ```

    #include <linux/iopom.h>

    void iomap(unsigned long phys_addr, unsigned long size);

    void iounmap(void *addr);

    ```


    +   - Furthermore, one should refer to this memory only with the functions to
    be described next, but not direct dereferencing.


    +   - Occasionally, one may find it convenient to use the following functions
    to associate I/O registers, or ports, with I/O memory:


    ```

    #include <asm-generic/iopmap.h>

    void iomap(unsigned long io_port, unsigned int count);

    void iounmap(void *addr);

    ```


    By using these functions I/O ports appear as memory. These ports will be requested
    as usual before this is done. After doing this, access is obtained with the read/write
    functions to be discussed next.


    Once there are bus-specific optional convenience functions, such as


    ```

    void pci_iomap(struct pci_dev *dev, int bar, unsigned long maxlen);

    void pci_iounmap(struct pci_dev *dev, void *iomem *addr);

    ```


    defined in /usr/src/linux/lib/iopmap.c.

    Note functions do not request the memory regions, that must be done separately.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# 19.8 Accessing I/O Memory


    Reading and writing from remapped I/O memory is done with the following functions:


    ```

    #include <linux/io.h>


    unsigned int iread8 (void *addr);

    unsigned int iread16 (void *addr);

    unsigned int iread32 (void *addr);


    void irite8 (u8 val, void *addr);

    void irite16 (u16 val, void *addr);

    void irite32 (u32 val, void *addr);

    ```


    The addr argument should point to an address obtained with ioremap() (with permafs
    an offset), the read functions returning the value read.


    Reading and writing multiple times can be done with


    ```

    void iread8_rep (void *addr, void *buf, unsigned long count);

    void iread16_rep (void *addr, void *buf, unsigned long count);

    void iread32_rep (void *addr, void *buf, unsigned long count);


    void irite8_rep (void *addr, void *buf, unsigned long count);

    void irite16_rep (void *addr, void *buf, unsigned long count);

    void irite32_rep (void *addr, void *buf, unsigned long count);

    ```


    These functions do I/O on address, not to a range of addresses, reading from or
    writing to the kernel address pointed to by.


    64-bit architectures also have 64-bit reads and writes, with the functions:


    ```

    u64 readq (unsigned address);

    void writeq (unsigned long val, address);

    ```


    used in an obvious way, where the q stands for quad. There are no iread64(), iowrite64()
    functions at this time.


    Working directly with a block of memory can be done with


    ```

    void memset_io (void *addr, u8 val, unsigned int count);

    void memcpy_io (void *dest, void *source, unsigned int count);

    void memcpy_to_io (void *dest, void *source, unsigned int count);

    ```


    The above functions do I/O in little-endian order, and any necessary byte-swapping,
    except for the mem... O which simply work with byte streams and no swapping.


    The older I/O functions:


    ```

    unsigned char readb (address);

    unsigned short readw (address);

    unsigned long readl (address);

    ```


    ```

    void writeb (unsigned char val, address);

    void writew (unsigned short val, address);

    void writel (unsigned long val, address);

    ```


    are deprecated, although they will still work. They are not as safe as the newer
    functions as they do not do as thorough type checking.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# 19.9 Access by User - ioperm(), iopl(), /dev/port


    +   - I/O Ports can also be accessed from user-space. This is a technique often
    used by user-space drivers, such as the X-servers. Applications doing this must
    be run as root. Thus they are dangerous to use for stability and security.


    +   - One method is to use the functions:


    ```

    #include <sys/io.h>


    int ioperm(unsigned long from, unsigned long num, int turn_on);

    int iopl(int level);

    ```


    +   - ioperm() gets permissions for individual ports, for num bytes from the port
    address from, enabling if turn_on = i.


    +   - The first 0x3ff ports can be accessed this way; for larger values you have
    to use iopl(), which gives permission for the entire I/O space.


    The argument can range from 0 to 3. Ring levels less than or equal to the value
    will be given access to the I/O Ports; thus a value level=3 lets normal user applications
    (in Ring 3) have access to I/O Ports.


    +   - When using facilities you can use inb(), out() functions from user-space.
    This requires compilation with optimization turned on to ensure expansion of inline
    functions.


    +   - Another method is to use the /dev/port device node. One merely seeks to
    the correct offset and uses normal read and write functions. This back door is
    considered quite dangerous but has often been used in legacy applications.


    # 19.10 Labs


    # Lab 1: Accessing I/O Ports From User-Space


    +   - Look at /proc/ioports to find a free I/O port region. One possibility to
    use the first parallel port, usually at 0x378, where you should be able to write
    a 0 to the register at the base address, and read the register for status information.


    +   - Try reading and writing to these ports using two methods:


    +   - ioperm()

    - /dev/port


    # Lab 2: Accessing I/O Ports


    +   - Look at /proc/ioports to find a free I/O port region.


    +   - Write a simple module that checks if the region is available, and requests
    it.


    +   - Check and see if the region is properly registered in /proc/ioports.


    +   - Make sure to release the region when done.


    +   - The module should send some data to the region, and read some data from
    it. Do the values agree? If not, why?


    +   - Note: there are two solutions given, one for the older region API, one for
    the newer resource API.'
  merge: -1
