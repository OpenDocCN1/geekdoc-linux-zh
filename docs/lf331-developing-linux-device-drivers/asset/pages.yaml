  md: "# 8.2. MODULE LICENSING\n\nYou can see the licenses of loaded modules with\
    \ a script like:\n\n```\n#!/bin/bash\n$cat /proc/modules | awk '{print $1};' \n\
    do echo -ne \"$names\\t\"\nmodinfo $names | grep license\n```\n\nBesides the informational\
    \ content, this macro has important consequences. Any other license causes the\
    \ entire kernel to be tainted, and warning messages appear when the module is\
    \ loaded. For the most part, any system problems, crashes etc. that arise when\
    \ using a tainted kernel are most likely to be ignored by kernel developers. (The\
    \ pseudo-file /proc/sys/kernel/tainted shows your kernel's status.)\n\nThe actual\
    \ value of /proc/sys/kernel/tainted is calculated from a bit mask of the following\
