  md: "# CHAPTER 11. RACE CONDITIONS AND SYNCHRONIZATION METHODS\n\n# 11.8 Completion\
    \ Functions\n\n+   The completion functions give an alternative method of waiting\
    \ for events to take place, and are optimized to work in the case where contention\
    \ is expected, unlike semaphores which are optimized to work in the case of low\
    \ contention expectation.\n\n```\n#include <linux/completion.h>\n\nstruct completion\
    \ {\n    unsigned int done;\n    wait_queue_head wait;\n};\n\nvoid init_completion(struct\
    \ completion *c);\nvoid wait_for_completion(struct completion *c);\nint wait_for_completion_interruptible(struct\
    \ completion *c);\nvoid complete(struct completion *c);\nvoid complete_and_exit(struct\
    \ completion *c, long code);\n```\n\n```\nunsigned long wait_for_completion_timeout(struct\
    \ completion *c, unsigned long timeout);\nunigned long wait_for_completion_interruptible(struct\
    \ completion *c, unsigned long timeout)\n                unsigned long timeout);\n\
    ```\n\n+   The functional variations with timeout in their name will return without\
    \ a wake up if the expiration period is reached without one. Both these and the\
    \ non-interruptible forms have non-void return values and need to be checked.\n\
    \n+   The completion structure can be declared and initialized in either of two\
    \ ways:\n\n```\nDECLARE_COMPLETION(x);\n\nstruct completion x;\nit_completion(&x);\n\
    ```\n\n+   The complete_and_exit() function does not return if success, takes\
    \ an additional argument, code, which is the exit code for the kernel thread when\
    \ terminating. Obviously, this function should only be used in cases as terminating\
    \ a background thread, as it will kill whatever it is doing.\n\n+   The correspondence\
    \ with semaphores is very simple; there is a one to one mapping between the methods:\n\
    \n```\nstruct semaphore <---> struct completion\nsema_init()         ---> init_completion\n\
    down()              <---> wait_for_completion()\nuup()               ---> complete()\n\
    ```\n\n# 11.9 Reference Counts\n\n+   One often needs to maintain a reference\
