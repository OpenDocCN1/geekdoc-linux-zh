    return 0;\n\ndefault:\n    return -EINVAL;\n\n}\n```\n\n# 12.3 Locked and Lockless\
    \ ioctls\n\n+   - From the early days of Linux, the ioctl() entry point actually\
    \ had the following prototype:\n\nint ioctl(struct inode *inode, struct file *filp,\
    \ unsigned int cmd, unsigned long arg);\n\nUnfortunately these locked ioctls calls\
    \ out the BKL (Big Kernel Lock); if they took a long time to run could cause large\
    \ latencies in potentially unrelated areas.\n\n+   - Note, the BKL is allowed\
    \ to sleep under locks and unlike other locks joining a wait queue was not enough\
    \ to block the system; you actually had to do some work that tied up some CPU\
    \ time.\n- The unlocked entry point we have shown was introduced to avoid the\
    \ BKL and if it were present in the file_operations structure, it was used instead\
    \ of the locked variation.\n\n+   - In the 2.6.36 kernel, the locked version of\
    \ the ioctl() entry point was finally removed. Drivers can no longer use it.\n\
    \n+   - Removal of the locked ioctl() system call was part of the active project\
    \ to move the BKL out of the system calls and drivers with the goal of one-by-one\
    \ elimination.\n- It should also be noted that ioctl() is not the only entry point\
    \ that takes out the BKL in character drivers; in particular do open() and fsync().\
    \ Another project is ongoing to eliminate the BKL from all of these entry points\
    \ unless there is a true need for them.\n\n# 12.4 Defining ioctls\n\n+   - Before\
    \ using ioctl() one must choose the numbers corresponding to the integer command\
    \ argument. Just picking arbitrary numbers is a bad idea; they should be unique\
    \ across the system.\n- There are at least two errors could arise:\n\n+   - Two\
    \ device nodes may have the same major number.\n- An application could make a\
    \ mistake, opening more than one device and mixing up the file descriptors, by\
    \ sending the right command to the wrong device.\n\nResults might be catastrophic\
    \ and even damage hardware."
