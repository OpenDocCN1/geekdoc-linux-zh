  md: '# 13.3. REAL DEVICES


    +   After important fields are initialized, the device is registered with and
    unregistered from the system core with:


    ```

    int device_register (struct device *dev);

    void device_unregister (struct device *dev);

    ```


    +   Reference counts for the device are atomically incremented and decremented
    with:


    ```

    struct device *get_device (struct device *dev);

    void put_device (struct device *dev);

    ```


    +   The pointer to a structure of type device_driver describes the driver for
    the device:


    ```

    3.1: 186 struct device_driver {

    3.1: 186 const char *name;

    3.1: 187 struct bus *bus;

    3.1: 188

    3.1: 189 struct module *owner;

    3.1: 190 const char *mod_name; /* used for built-in modules */

    3.1: 191

    3.1: 192 bool_suppress_bind_attr; /* disables bind/unbind via sysfs */

    3.1: 193

    const struct of_device_id *of_match_table;

    3.1: 194

    3.1: 195

    3.1: 196 int (*probe)(struct device *dev);

    3.1: 197 int (*remove)(struct device *dev);

    3.1: 198 void (*shutdown)(struct device *dev);

    3.1: 199 int (*suspend)(struct device *dev, pm_message_t state);

    3.1: 200 int (*resume)(struct device *dev);

    3.1: 201 const struct attribute_group *groups;

    3.1: 202

    3.1: 203 const struct dev_pm_ops *pm;

    3.1: 204

    3.1: 205 struct driver_private *p;

    3.1: 206 };

    ```


    +   Drivers are registered/unregistered with the appropriate bus with:


    ```

    int driver_register (struct device_driver *drv);

    void driver_unregister (struct device_driver *drv);

    ```


    and reference counts are incremented/decremented with:


    ```

    struct device_driver *get_driver (struct device_driver *drv);

    put_driver (struct device_driver *drv);

    ```


    +   Next we consider how this generic infrastructure connects to real devices.


    # 13.3 Real Devices


    +   Actual device drivers work directly with the structures we have so far described;
    rather they are used by the internal code used for each specific type of bus and/or
    device.


    +   For example, PCI devices have two important structures:'
