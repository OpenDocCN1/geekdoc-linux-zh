- pgno: 83
  md: '# 7.3 Asynchronous Interrupts


    There are two kind of asynchronous interrupts:


    +   - Maskable interrupts are sent to the INTR microprocessor pin. They can be
    disabled by appropriate flags set in the eflags register.

    - Nonmaskable interrupts are sent to the NMI microprocessor pin. They cannot be
    disabled and when they occur there is usually a critical hardware failure.


    +   - Any device which issues interrupts has an IRQ (Interrupt &amp;Request) line,
    which is connected to an APIC (Advanced Programmable Interrupt Circuit).


    +   - On the x86 architecture one has a Local APIC integrated into each CPU. Additionally
    one has an I/O APIC used through the system''s peripheral buses.


    +   - On ARM there are IRQ and FIQ (Fast IRQ lines). The IRQ is typically extended
    by an interrupt controller: e.g. GIC (Generic Interrupt Controller) http://intercenter.arm.com/infocenter.com/index.jsp?topic=com.arm.doc.ii0048b/index.html.


    +   - On ARM processors (e.g. Cortex-A8) there is a fixed priority system for
    exceptions (see http://infocenter.arm.com/help/topic/com.arm.doc.dd0344k/Beigeaj.html).


    +   - The I/O APIC routes interrupts to individual APICs, according to a redirection
    table that keeps.


    +   - The Local APIC constantly monitors the IRQ lines it is responsible for and
    when it finds a signal has been raised:


    +   - Which IRQ is involved?

    - Stores it in an I/O port owns it can be read on the data bus.

    - Issues an interrupt by sending a signal to its INTR pin.

    - When the CPU acknowledges the IRQ by writing back to a controller 1/o port it
    clears the INTR pin.

    - Goes back waiting for a new interrupt to arrive.


    A list of currently installed interrupt handlers can be obtained from the command
    /proc/interrupts, which gives something like:


    | CPU0 | CPU1 | CPU2 | CPU3 | IO-APIC-edge | timer |

