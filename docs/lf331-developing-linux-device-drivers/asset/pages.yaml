  md: '# Chapter 7


    # Interrupts and Exceptions


    We''ll take a detailed look at how the Linux kernel handles synchronous interrupts
    (exceptions) and asyn-chronous interrupts. We''ll consider message-signalled interrupts
    (MSI). We''ll show how to enable/disable-nterpts. We''ll have a discussion of
    what you can and can not do in interrupt context. We''ll consider the main data
    structures associated with interrupts and show how to install an interrupt handler,
    or service-routine. Finally we''ll discuss in detail what has to be done in the
    top and bottom halves of such functions.


    +   7.1 What are Interrupts and Exceptions? ..........................................................................
    65

    7.2 Exceptions .....................................................................................................................................
    66

    7.3 Asynchronous Interrupts ..........................................................................................................
    68

    7.4 MSI ................................................................................................................................................
    69

    7.5 Enab/Disabling Interrupts ...................................................................................
    70

    7.6 What You Cannot Do at Interrupt Time ........................................................................
    71

    7.7 IRQ Data Structures ................................................................................................
    71

    7.8 Installing an Interrupt Handler ............................................................................
    74

    7.9 Labs ............................................................................................................................................
    76


    # What are Interrupts and Exceptions?


    +   - An interrupt alters (interrupts) the instruction sequence followed by a
    processor. It is always constant\with an electrical signal stemming from inside
    or outside the processor.

    - When an interrupt arrives the kernel must suspend the thread it is currently
    executing, deal with it by

    inoking one or more service routines (ISR) or handlers) assigned to the specific
    interrupt, and then

    return to the suspended thread, or service another interrupt.

    - Under Linux, interrupts should never be lost; the service routines may be delayed
    according to various

    ocking mechanisms and priorities, but will be invoked eventually. However, interrupts
    are not queued'
