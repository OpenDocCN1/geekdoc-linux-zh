    \ than one place and passed to various subsystems, such a reference count is probably\
    \ required.\n\n+   The kref API should be used for maintaining reference counts,\
    \ rather than having them constructed by hand. The relevant functions are defined\
    \ in /usr/src/linux/include/linux/kref.h"
