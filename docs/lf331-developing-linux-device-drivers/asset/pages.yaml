    # 16.3 Direct transfer - Kernel I/O and Memory Mapping


    +   * There are two complementary methods Linux can use to avoid using the heretofore
    described transfer functions.

    * In the kio method, the kernel is given direct access to user-space memory pointers.
    The memory is locked down while the transfer goes on, making sure no pages swap
    out and the pointers remain valid. When the transfer is over the pinning is based
    on the raw I/O implementation. Note that if a file is opened with the non-standard
    0_DIRECT flag, kio will be used on that file.

    * In the memory mapping method, user-space is given direct access to kernel memory
    buffers, which may be memory regions residing directly on the device. The mmap()
    call is a standard POSIX system call.

    * Both methods avoid any buffering or caching for the data being transferred.
    They require longer to set up and shut down the copying methods previously discussed.
    What is the best method depends on a number of factors, such as the size of the
    transfers, their frequency, the likelihood the data will be re-used, etc.'
  merge: -1
  img_proc: true
- pgno: 164
  md: "# 16.4 KERNEL I/O\n\nIt is desirable to bypass the buffer and page caches entirely,\
    \ and have I/O operations pass directly to the device in raw form. This eliminates\
    \ at least one copy operation. Large data base applications are often users of\
    \ so-called raw I/O operations.\n\nThis can be used to lock down user-space buffers\
    \ and use them directly in the kernel, without the use of copy_to_user(), copy_from_user()\
    \ and related functions.\n\nFrom user-space, one can force the kernel to use this\
    \ direct I/O, by opening a file with the O_DIRECT flag. This is a GNU extension,\
    \ so you will also define the macro _GNU_SOURCE, i.e, you'll need something like:\n\
    \n```\n#define _GNU_SOURCE\n\nfd = open(filename, O_DIRECT | O_RDWR | O_CREATE\
    \ | O_TRUNC, 0666);\n```\n\nWhenever this file descriptor is used, kernel I/O\
    \ will be used.\n\nHere's an example of a short program that copies a file, using\
    \ direct I/O on the output file. We use posix_memalign() (or the other memalign())\
    \ instead of malloc() to ensure sector alignment. All transfers must be sector\
    \ aligned and an integral number of sectors long.\n\n```\n/*\nargs: 1 = output\
    \ file, [3 = chunk size]\n\nusage: %s infile outfile\n%s infile outfile 512\n\
    */\n\n#define _GNU_SOURCE\n#define SECTOR_SIZE 512\n\n#include <unistd.h>\n#include\
