- pgno: 234
  md: '# # Chapter 22


    # # Direct Memory Access (DMA)


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_234_0.png)


    We''ll learn about DMA under Linux. We''ll consider how DMA uses interrupts for
    synchronous and asynchronous transfers, how DMA buffers must be allocated, and
    virtual to physical (and bus) address translation. Then we''ll look in some detail
    how DMA is deployed for the PCI bus, considering both consistent and streaming
    transfers, and the use of DMA Pools. Finally we''ll gather/scatter mappings.


    | 22.1 | What is DMA? | 219 |

    | 22.2 | DMA and Interrupts | 220 |

    | 22.3 | DMA Memory Constraints | 220 |

    | 22.4 | DMA Directly to User | 221 |

    | 22.5 | DMA API | 221 |

    | 22.6 | DMA Pools | 223 |

    | 22.7 | Scatter/Gather Mappings | 224 |

    | 22.8 | Labs. | 225 |


    # ## 22.1 What is DMA?


    +   * Direct Memory Access (DMA) permits peripheral devices to transfer data to
    or from system memory while bypassing CPU control. Proper use of DMA can lead
    to dramatic performance enhancement. Most non-trivial peripherals are likely to
    have DMA capabilities.


    +   * The specifics of DMA transfers are very hardware-dependent, both in the
    sense of the CPU involved (e.g., x86 or Alpha), and the type of data bus (e.g.,
    PCI, ISA, etc.), and to some degree degrees of freedom independent.


    +   * However, since the 2.4 kernel series the goal has to present a unified,
    hardware-independent interface. This was achieved in the 2.6 kernel series, permitting
    one to deal with more abstract methods rather than getting deep into the hardware
    particularities.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# 22.2 DMA Interrupts


    +   - The efficiency of DMA transfers is very dependent on proper interrupt handling.
    Interrupts may be raised when the device acquires data, and are always issued
    when the data transfer is complete.


    +   - Transfers require a DMA-suitable buffer, which must be contiguous and lie
    within an address range the device can reach, and we will discuss how such buffers
    can be allocated and released. In the following we will assume that either: a
    buffer exists before the transfer and is not released but will be re-used in subsequent
    transfers; or must be allocated before the transfer begins and released when it
    is complete.


    +   - Transfers can be triggered synchronously, or directly, such as when an application
    requests or pulls data through a read(), in which case:


    +   - The hardware is told to begin sending data.

    - The calling process is put to sleep.

    - The hardware puts data in the DMA buffer.

    - The hardware issues an interrupt when it is finished.

    - The interrupt handler deals with the interrupt, acquires the data, and awakens
    the process, which can now read the data.


    +   - When an application pushes (or) writes data to the hardware one has a synchronous
    transfer and the steps are similar.


    +   - Transfers can also be triggered asynchronously when the hardware acquires
    and pushes data to the system when there are no readers at present. In this case:


    +   - The driver must keep a buffer to warehouse the data until a read() call
    is issued by an application.

    - The hardware announces the arrival of data by raising an interrupt.

    - The interrupt handler tells the hardware where to send the data.

    - The peripheral device puts data in the DMA buffer.

    - The hardware issues an interrupt when it is finished.

    - The interrupt handler deals with the data, and awakens any waiting processes.


    +   - While while pushes and pulls have many similar steps, the asynchronous transfer
    involves two interrupts for transfer, not just one.


    # 22.3 DMA Memory Constraints


    +   - DMA buffers occupy contiguous memory; you can''t use vmalloc(), only kmalloc()
    and the _get_free_pages() functions. Note that you can also use the abstracted
    allocation functions we will detail shortly.


    +   - If you specify GFP_DMA as the priority the memory will not only be contiguous,
    on x86 it also fall under MAX_DMA_ADDRESS=16 MB.


    +   - For PCI this would be unnecessary and wasteful, there exist PCI devices
    which have addressing limitations (somtimes because they are poorly crafted from
    an ISA device). Thus it is actually necessary to check what addresses are suitable.


    +   - Because the hardware is connected to a peripheral bus which bus addresses
    (both kernel and user code use virtual addresses) are needed. These are used when
    communicating with the Memory Management Unit (MMU) or other hardware connected
    to the CPU''s addresses lines:'
  merge: -1
  img_proc: true
- pgno: 236
  md: "# 22.4. DMA DIRECTLY TO USER\n\n```\n#include <asm/io.h>\n\nunsigned long virt_to_bus\
    \ (volatile void *address);\nvoid *bus_to_virt (unsigned long address);\n\nunsigned\
    \ long virt_to_phys (volatile void *address);\nvoid *phys_to_virt (unsigned long\
    \ address);\n```\n\nYou can look at the header file to see how these macros are\
    \ defined.\n\n+   * On the x86 platform bus and physical addresses are the same\
    \ so these functions do the same\n\n# 22.4 DMA Directly to User\n\n+   * High-bandwidth\
    \ hardware (e.g., a video camera) can obtain lots of speed-up by going straight\
    \ to the user; i/e., without DMA to first get the data to kernel-space and transferring\
    \ to user-space. If one wants to do this by hand it is tricky; the steps are:\n\
    \n+   - Lock down the user pages.\n- Set up a DMA transfer for each page.\n- When\
    \ the DMA is done, unlock the pages.\n\n+   * If these steps seem familiar, it\
    \ is because they are essentially what the get_user_pages() API provides for you;\
    \ you'll of course still have to do the DMA transfers properly.\n\n+   * If one\
    \ has a device with addressing limitations, the first thing to do is to check\
    \ whether DMA transfers to the desired addresses are possible:\n\n```\n#include\
    \ <linux/dma-mapping.h>\nint dma_supported (struct device *dev, u64 mask);\n```\n\
    \n+   * For example, if you have a device that can only 24-bit addresses, one\
    \ could do:\n\n```\nstruct pci_dev *dev;\nif ( dma_supported(dev, 0xffffffff))\
    \ {\n    // do something here\n} else {\n    printk(KERN_WARNING \"DMA not supported\
    \ for the device\\n\");\n    goto device_unsupported;\n}\n```\n\n+   * If the\
    \ device supports 32-bit operations, one need not call dma_supported() or set\
    \ the mask.\n\n+   * In order to set up a DMA transfer one has to make a DMA Mapping,\
    \ which involves two steps; allocating a buffer, and generating an address for\
    \ it that can be used by the device. The details of how this is architecture dependent,\
    \ but the functions for allocating and freeing are the same across platforms:"
  merge: -1
  img_proc: true
- pgno: 237
  md: "```\nvoid *dma_alloc_coherent (struct device *dev, size_t size, dma_addr_t\
    \ *dma_handle, gfp_t flag);\nvoid dma_free_coherent (struct device *dev, size_t\
    \ size, void *vaddr, dma_addr_t dma_handle);\n```\n\nThe allocation function returns\
    \ a kernel virtual address for the buffer, of length size bytes. The third argument\
    \ points to the address on the bus (which is meant to be used optionally). The\
    \ flag argument controls how the memory is allocated, and usually GFP_KERNEL or\
    \ GFP_ATOMIC if sleeping is not allowed as in interrupt context. If the mask requires\
    \ it, GFP can also be allocated. This memory can be freed with `dma_free_coherent()`\
    \ which requires both addresses.\n\n+   - Memory regions with `dma_alloc_coherent()`\
    \ are used for so-called Coherent DMA Maps, which can be considered as synchronous\
    \ or consistent. These have the following properties:\n\n+   - The buffer can\
    \ be accessed in parallel by both the CPU and the device.\n- A write by either\
    \ the device or the CPU can be immediately read by either, without worrying about\
    \ cache problems, or flushing. (However, you may still need to use the various\
    \ memory barriers, as the CPU may reorder I/O instructions to maintain consistent\
    \ memory as it does for normal system memory).\n- The minimum allocation is generally\
    \ a page. In x86 one actually obtains a number of pages is a power of 2, so it\
    \ may be expensive.\n\nSince this method is relatively expensive, it is generally\
    \ used for DMA buffers that persist through the life of the device. A good example\
    \ of it would be for network DMA ring descriptors.\n\n+   - For single operations,\
    \ one sets up coherent Streaming DMA mappings, which can also be considered as\
    \ asynchronous. They are controlled by\n\n```\ndma_addr_t dma_map_single (struct\
    \ device *dev, void *ptr, size_t size,\n\tenum dma_data_direction direction);\n\
    void dma_unmap_single (struct device *dev, dma_addr_t dma_addr, size_t size,\n\
    \tenum dma_data_direction direction);\n```\n\n# Table 22.1: DMA Transfer Direction\
    \ Values\n\n| Value | Meaning |\n| PCI_DMA_TODEVICE | Data going to the device,\
    \ e.g., a write. |\n| PCI_DMA_FROMDEVICE | Data coming from the device, e.g.,\
    \ a read. |\n| PCI_DMA_BIDIRECTIONAL | Data going either way. |\n| PCI_DMA_NONE\
    \ | Used for debugging; any attempt to use the memory causes failure. |\n\n+ \
    \  - Streaming DMA mappings might be used for network packets, filesystem buffers.\
    \ They have the following properties:\n\n+   - The direction of a transfer must\
    \ match the value given during the mapping.\n- After a buffer is mapped, it belongs\
    \ to the device, not the CPU; the driver should not touch the buffer until it\
    \ has been unmapped."
