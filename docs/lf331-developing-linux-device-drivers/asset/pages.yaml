  md: '# # Chapter 26


    # # Network Drivers IV: Selected Topics


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_266_0.png)


    We''ll consider the use of multicasting, changes in the carrier state of the device,
    and the use of ioctl() commands. We''ll also consider the questions of interrupt
    mitigation, TSO and TOE, and MII and ethtool support.


    +   - 26.1 Multicasting ** 251

    - 26.2 Changes in Link State 253

    - 26.3 ioctls 253

    - 26.4 NAPI and Interrupt Mitigation 253

    - 26.5 NAPI Details 254

    - 26.6 TSO and TOE 254

    - 26.7 MII and ethtool ** 255


    > ** These sections may be considered in part or in whole as optional. They contain
    either background reference material, specialized topics, or advanced subjects.
    The instructor may choose to cover or not cover them depending on classroom experience
    and time constraints.


    # ## 26.1 Multicasting **


    +   - A multicast network packet is sent to more than one (but not all) network
    destinations. For this purpose a unique hardware address is assigned to a group
    of hosts; any packet sent to that address will be received by all members of the
    group.

    - For Ethernet requires that the least significant bit in the first byte of the
    destination address is set; at the same time the first bit in the first byte of
    the device hardware address is cleared.

    - Multicast packets look no different than any other packet, and thus a device
    driver need nothing special to transmit them. It is up to the kernel to route
    them to the right hardware addresses.'
  merge: -1
  img_proc: true
- pgno: 267
  md: "# CHAPTER 26. NETWORK DRIVERS IV: SELECTED TOPICS\n\nHowever, reception of\
    \ multicast packets is more complex and can require more or less work from a network\
    \ device, depending on its sophistication.\n\nSome devices have special multicast\
    \ capability. They receive packets that are sent directly to their hardware address,\
    \ or broadcast to all addresses. They receive multicast traffic only by receiving\
    \ packets; this can overwhelm the system. Such a device will not have the IFF_MULTICAST\
    \ flag in its net_device structure.\n\nA second class of device can distinguish\
    \ multicast packets from ordinary ones; they receive every one and let software\
    \ decide whether or is not intended for them and should be taken in. This has\
    \ a lower overhead than the first class.\n\nA third class of device performs multicast\
    \ packet detection in its hardware. This kind of device accepts a list of multicast\
    \ addresses and ignores all others. This is the most efficient class of device\
    \ because it doesn't bother accepting packets and then dropping them. Whenever\
    \ the list of valid multicast addresses is modified, the kernel updates the list\
    \ the device is aware of.\n\nThe method called will use the multicast machine\
    \ addresses the device is associated with changes is:\n\n```\nvoid (*set_multicast_list)(struct\
    \ net_device *dev);\n\n(where dev is the device's net_device_structure). The function\
    \ is invoked whenever dev->flags changes.\nIf the driver can implement this it\
    \ should just supply NULL.\n```\n\nThe data structure gives the linked list of\
    \ all multicast addresses the device deals with:\n\n```\nstruct dev_mc_list {\n\
    \    struct dev_mc_list *next;      /* next address in list */\n    u8 dmi_addr[MAX_ADDR_LEN];\
    \      /* hardware address */\n    unsigned char dmi_addrlen;      /* address\
    \ length */\n    int dmi_users;                   /* # of users */\n    int dmi_groups;\
    \                  /* # of groups */\n};\n```\n\nstruct dev_mc_list *dev->mc_list;\n\
    \nThere are also a few of flags (in dev->flags) which affects behaviour:\n\nTable\
    \ 26.1: Multicasting Flags\n\n| Flag | Meaning |\n|---|---|\n| IFF_MULTICAST |\
    \ If not set, the device won't handle multicast packets. However, the set_multicast_list()\
    \ method will be called whenever the flags change. |\n| IFF_ALLMULTI | Tells the\
    \ driver to retrieve all multicast packets. |\n| IFF_PROMISC | Puts the interface\
    \ in promiscuous mode. All packets are received regardless of what is in dev->mc_list.\
    \ |\n\n+   Corbet, Rubini and Kroah-Hartman give an example of an implementation\
    \ of the set_multicast_list() method."
  merge: -1
