  md: '# 17.3 Going to Sleep Details


    +   Let''s look in detail at the code for entering a wait, or going to sleep.
    The macro wait_event() is defined in /usr/src/linux/include/linux/wait.h:


    ```

    3.1: 217 #define wait_event(wq, condition)

    3.1: 218 do {\n3.1: 219     if (condition)

    3.1: 220         break;

    3.1: 221             __wait_event(wq, condition);

    3.1: 222 } while (0)


    3.1: 192 #define __wait_event(wq, condition)

    3.1: 193 do {\n3.1: 194     DEFINE_WAIT(__wait);

    3.1: 195

    3.1: 196     for (;;) {\n3.1: 197         prepare_to_wait(&wq, &wait, TASK_UNINTERRUPTIBLE);

    3.1: 198         if (condition)

    3.1: 199             break;

    3.1: 200             schedule();\n3.1: 201     }\n3.1: 202     finish_wait(&wq,
    &wait);

    3.1: 203 } while (0)

    ```


    +   The first thing to do is check if condition is true, and so, avoid going to
    sleep at all. This avoids the race condition in which the condition is reset and
    a wake up call is issued after the task is requested to go to sleep before it
    actually does.


    +   One enters the macro where the real work is done, __wait_event(), where the
    first thing to do is DEFINE_WAIT(name), which is equivalent to:


    ```

    wait_queue_t name;

    init_wait(&name);

    ```


    which creates and initializes the wait queue.


    +   The next thing to do is to add the wait queue entry to the task, and reset
    the state of the task, which is by:

    \void prepare_to_wait(wait_queue_head_t *queue, wait_queue_t *wait, int state);


    +   Once again checks condition to avoid a race condition, e.g., a missed wake
    up call, in which case the sleep is again avoided. Assuming this condition is
    not true, all calls schedule() to another task; the current one cannot be scheduled
    because its state is TASK_UNINTERRUPTIBLE.


    +   The lines of code will only be entered after the state has been reset by a
    wake up, and the task is available for scheduling and has been granted a time
    slice. The for() loop makes sure the condition is really true, and it continues
    sleep until


    +   When the sleep is truly finished, one calls:


    void finish_wait(wait_queue_head_t *queue, wait_queue_t *wait);


    which does whatever cleanup is needed.


    +   The wait_event_interruptible() macro is almost the same except that it sets
    the state to TASK_INTERRUPTIBLE and the for() loop is replaced with:'
