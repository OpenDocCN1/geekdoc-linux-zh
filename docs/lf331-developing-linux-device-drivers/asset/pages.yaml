  md: "# CHAPTER 5. CHARACTER DEVICES\n\n+   A new file structure is created whenever\
    \ the open() is invoked on the device, and gets passed to all functions that use\
    \ the device node. This means there can be multiple file structures associated\
    \ with it simultaneously, as most devices perform multiple opens. The structure\
    \ is released and the memory associated with it is freed during the release()\
    \ call.\n\n+   Some important structure members:\n\nTable 5.5: file Structure\
    \ Elements\n\n| Field | Meaning |\n| --- | --- |\n| struct path f_path | Gives\
    \ information about the file directory entry, including a pointer to the inode.\
    \ |\n| const struct file_operations f_op | Operations associated with the file.\
    \ Can be be changed when the method is invoked again. |\n| f_mode_t f_mode | Identified\
    \ by the file FMODE_READ and FMODE_WRITE. Note the kernel checks permissions before\
    \ invoking the driver. |\n| loff_t f_pos | Current position in the file; a 64-bit\
    \ value. The read() and write() entry points usually point to this, the lseek()\
    \ entry should update f_pos, but the read() and write() entry points should update\
    \ the argument. Use of f_pos for this purpose is incorrect because the read()\
    \ and write() system calls use the same read and write methods but not have this\
    \ linkage. |\n| unsigned int f_flags | O_RDONLY, O_NONBLOCK, O_SYNC, etc. Needs\
    \ to be checked for non-blocking operations. | |\n| void * private_data | Can\
    \ be used to point to allocated data. Can be used to preserve state information\
    \ across system calls. The pointer to this is NULL before the open(), so your\
    \ driver can use this to point to whatever it wants, such as an allocated data\
    \ structure. In this case you must remember to free the memory upon release().\
    \ Note there will be a unique instance of this structure for each time your device\
    \ is opened. |\n\n+   Note that a pointer to the file_operations structures lies\
    \ inside the structure. To obtain a pointer to the inode structure you have to\
    \ descend through the f_path element which is a structure of type:\n\n```\nstruct\
    \ path {\n    struct vfsmount *mnt;\n    struct dentry *dentry;\n};\n```\n\nwith\
    \ the inode field contained in the dentry structure. So you'll often see references\
    \ like:\n\n```\nstruct file;\nfile->f_path.dentry->d_inode\n```\n\n+   Unlike\
    \ the file structure, there will only be one inode structure pointing to a given\
    \ device; each open descriptor (and corresponding internal file structure representation)\
    \ on the device will have in turn to point to that same inode.\n\n+   While the\
    \ inode structure contains all sorts of information about the file it points to,\
    \ here happens to be a device node, and very few of the fields are of interest\
    \ for character devices. Two of importance are:"
