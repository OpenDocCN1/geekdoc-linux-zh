- pgno: 114
  md: '# 10.5. TIMER IMPLEMENTATION


    A timer can reinstall itself to set up a periodic timer. This can be done in either
    of two ways:


    ```

    ```

    init_timer(&t);

    t.expires= jiffies + delay;

    add_timer(&t);

    ```

    ```


    or


    ```

    ```

    mod_timer(&t, jiffies+delay);

    ```

    ```


    which is often done as a more compact form. Note that it is very important to
    reinitialize the timer when reinstalling, mod_timer() does this under the hood.


    # Example:


    ```

    ```

    static struct timer_list my_timer;


    init_timer(&my_timer);

    my_timer.function = my_function;

    my_timer.expires = jiffies+ticks;

    my_timer.data = &my_data;


    add_timer(&my_timer);

    ...

    del_timer(&my_timer);


    void my_function(unsigned long var){ };n```

    ```


    # 10.5 Timer Implementation


    +   - The implementation of dynamic timers has to take care of two distinct tasks:


    +   - Functions have to be inserted and removed from the list of timers, or have
    the expiration times modified.

    - Functions have to be executed at the proper time.


    +   - The simplest implementation would be to maintain one linked list of kernel
    timers, and add the newly requested timer function into the list either at the
    tail, or in some kind of sorted fashion, and then when the kernel decides to run
    any scheduled timer functions, can scan the list and run those whose time value
    expired.

    - However, this would be quite inefficient. There may be many, even thousands,
    of whose expiration times needs to be scanned, and the kernel would be strangled
    by this task. Sorting might help the scanning process, but it would be paid for
    by expensive insertion and deletion operations.


    +   - Linux has implemented a very clever method which actually maintains 512
    doubly-linked circular lists, so that the next and prev fields in the timer_list
    struct point only within one of the lists at any given time. Which list depends
    on the value of the expires field.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '• These lists are further partitioned into 5 groups:


    | Group | Ticks | Time (HZ=1000) |

    |---|---|--|

    | tv1 | < 256 | < .256 secs |

    | tv2 | < 2^14 | < 16.4 secs |

    | tv3 | < 2^20 | < 17.5 mins |

    | tv4 | < 2^26 | 18.6 hrs |

    | tv5 | < ∞ | < ∞ |


    # Table 10.2: Timer Groups


    • The tv1 group has a vector of 256 doubly-linked lists, set up so those in the
    first list will expire in the next timer tick, those in the second group will
    expire on the tick after that, and so on. Likewise, the tv2-5 groups each have
    a vector of 64 doubly-linked lists, ordered in time groups.


    • Each time there a timer tick, an index into the tv1 list of vectors is incremented
    by one, and the timer functions needed to be launched are all in one doubly-linked
    list. When this index reaches 256, the first cascade_timers() gets gets, which
    brings the first group of tv2 in replenish tv1, the first group of tv3 in replenish
    tv2, etc.


    # 10.6 High Resolution Timers


    • The Linux kernel approach to dynamic timer implementation, being quite clear
    and efficient, received a great enhancement with the addition of a new approach,
    gradually introduced since the 2.6.16 kernel


    • We begin with the observation that there are really two kind of dynamic timers:


    +   - Timeout functions, found primarily in networking code and device drivers,
    to signal when an event does not happen within a specified window of time, and
    either a task should be dropped or a recovery action initiated.


    +   - Timer functions, expected to accurately run within specified latency and
    sequence.


    • Timeout functions generally be far more numerous than timer ones, and thus in
    the present dynamic timer implementation, removal of a timer before it runs is
    far more frequent than actually running the function.


    • Timeout functions have only a weak precision requirement, which (in principle
    at least) timer functions may have more stringent needs.


    • The original implementation works well for timer functions, particularly because
    it does such a rapid job of timer removal, since only an index look up is required,
    and jiffies-level accuracy is generally fine.


    • The hrtimers (High Resolution Timers) API is designed for dynamic timers actually
    expected to execute.


    • Rather than having a complex set of lists, there is only one (per CPU) sorted
    by time of expiration, using a red-black tree algorithm. While insertion and removal
    may be slower than the original method, there will be no need for a cascade operation
    and there are fewer elements in the list.


    • Expiration periods for the hrtimers are expressed in nanoseconds rather than
    jiffies.'
  merge: -1
  img_proc: true
