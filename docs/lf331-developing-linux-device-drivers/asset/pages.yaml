  md: '# 8.4. BUILT-IN DRIVERS


    +   * This assumes that mydrv.co and mydrv.co can be found in the path searched
    by depmod and that you have accessed the device nodes with a major number. Note
    that the name of the device node is invoked by the application and need not match
    the module name. You may also use such names as arguments to request_module().


    +   * Note that the use of udev has reduced the need for this technique. However,
    the underlying methods are quite different. udev loads driver modules over discovery
    of the device; using these aliases allows them upon first use of the device, which
    should come late, at least for hardware drivers.


    # 8.4 Built-in Drivers


    +   * Device drivers and other facilities can be loaded as an integral part of
    the kernel, or as modules, and many kernel components have the capability of being
    used either way. Inclusion in the kernel requires kernel re-ilation of the entire
    kernel; modularization does not.


    +   * At most minor changes are necessary to the code; most none are required.
    However, the kernel configuration files must deal with all three possibilities;
    built-in, module, or neither.


    +   * It is possible to mark both data and functions for removal after kernel
    initialization. This is done with the keywords __init and __initdata. For example,
    if you have


    ```

    static some_data __initdata = 1;

    void __initsomefunc(void) { ... }

    ```


    the data and code will go into a special initialization section of the kernel
    and will be discarded after execution. One has to be careful that the code or
    data is not referenced after init starts. You may have noticed messages to this
    during the system boot:


    > [0.841689] Freeing unused memory: 424k freed


    +   * The __exit macro does not except group all such labeled material in the
    executable, in an area not likely to be cached.


    +   * If you use the module_init(), module_exit() macro, you should be able to
    avoid using any #ifdef MODULE statements in your code.


    +   * IF MODULE is not defined, any function referenced by the module_exit() macro
    is dropped during compilation, since built-in drivers never get loaded.


    +   * In addition, the kernel arranges loading of all module__init() functions,
    using the following recipe: in /usr/src/linux/include/linux/module.h will create
    a section in the .o file named .initcall. This will contain the address of the
    module''s function.


    +   * Thus all of the .o files are linked together, the final object will contain
    a section called .initcall which becomes, in an array of pointers to all of the
    functions.


    +   * It is possible to assign priorities to initialization calls; the code which
    sets this up in /usr/src/linux/include/init.h:


    | 3.1: 194 __pure_initcall(fn) | __define_initcall("0",fn,0) |

    | 3.1: 195 | |

    | 3.1: 196 __core_initcall(fn) | __define_initcall("1",fn,1) |

    | 3.1: 197 __core_initcall_sync(fn) | __define_initcall("is",fn,is) |

    | 3.1: 198 __postcore_initcall(fn) | __define_initcall("2",fn,2) |'
