  md: '# # Chapter 5


    # ## Character Devices


    We''ll begin our detailed discussion of building character device drivers. We''ll
    talk about device nodes, how to create them, access them, and register them with
    the kernel. We''ll discuss the udev/HAL interface. Then we will describe in detail
    the important file_operations data structure and itemize in detail the driver
    entry it points to. Two other important data structures, the file and inode structures
    are also considered. Finally we show how modules keep track of their usage count,
    and discuss miscellaneous character drivers.


