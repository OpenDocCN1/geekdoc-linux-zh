  md: '# 15.5. _GET_FREE_PAGES()


    A similar macro, in_atomic(), also checks to see if you are in a preemptive context.


    > GFP_ATOMIC allocations are allowed to draw down memory resources more than those
    with GFP_KERNEL to lessen chances of failure; thus they should not be used when
    they are necessary.


    +   * To allocate cleared memory, use

    void *kzalloc(size_t size, gfp_t flags);

    which calls kmalloc(size, flags) and then clears the allocated memory region.

    * One can also resize a dynamically allocated region with:

    void *krealloc(const void *p, size_t new_size, gfp_t flags);

    * kmalloc() will return memory chunks in power of 2 that matches or exceeds len.
    It doesn''t clear memory, and will return NULL on failure, or a pointer to the
    memory on success. The largest allocation that can be obtained is 1024 pages (4
    MB on x86). For somewhat larger requests (more than a few KB) it is better to
    use the __get_free_page() functions.

    * Furthermore kmalloc() always returns physically contiguous memory such as that
    need for DMA transfers.


    # 15.5 - get_free_pages()


    +   * To allocate (and free) entire pages (or multiple pages) of memory in one
    fell sweep one can use:

    #include <linux/mm.h>

    unsigned long get_zeroed_page (gfp_t gfp_mask);

    unsigned long _get_free_page (gfp_t gfp_mask);

    unsigned long _get_free_pages (gfp_t gfp_mask, unsigned long order);

    void free_page (unsigned long addr);

    void free_pages (unsigned long addr, unsigned long order);

    * The GFP_mask argument is used in the same fashion as in kmalloc().

    * order gives the number of pages (as a power of 2). The limit is 1024 pages (4
    MB on x86). There is a function get_order() defined in /usr/src/include/asm-generic/page.h
    which can be used to determine the order by a number of bytes.

    * _get_free_pages() function returns a pointer to the first byte of a memory area
    that is several pages long, and doesn''t zero the area. Note that these pages
    will be physically continuous.

    * _get_free_page() function does not clear the page; it is preferred over get_zeroed_page()
    because clearing the page might take longer than simply getting it.

    * It is important to free pages when they are no longer needed to avoid kernel
    memory leaks.'
