  md: "12\n\nCHAPTER 2. PRELIMINARIES\n\n# 2.5 Platforms\n\n+   - We will try and\
    \ be as platform-independent as possible. However, we will consider the x86 architecture\
    \ explicitly from time to time and won't concentrate on Linux on IA64, Alpha,\
    \ SPARC, PPC, ARM, etc., very much.\n- There are at least three reasons to consider\
    \ the x86 architecture explicitly:\n  - There are parts of the Linux kernel which\
    \ must be platform-dependent, and to understand what is going on some specificity\
    \ will be needed.\n  - You are probably working on an x86 machine right now.\n\
    \  - Most people developing for Linux are concentrating on this platform.\n- We'll\
    \ try to make any platform-dependence explicit. All solutions have been tested\
    \ on 32-bit and 64-bit architectures.\n\n# 2.6 Hardware\n\n+   - Sometimes when\
    \ people teach device drivers they use simple devices hanging off an external\
    \ port. Rather than this we will use the hardware on the machine as network cards\
    \ and input devices, and piggyback device drivers on top of the already installed\
    \ ones using the kernel's ability to share interrupts.\n- Questions often come\
    \ under one of the following variety:\n  - How many I/O ports do my device use,\
    \ and what addresses do they use?\n  - What IRQ?\n  - Do I read bytes or words,\
    \ how many per interrupt, etc?\n  - What standards does the device conform to?\n\
    \n> These questions can be answered only from the hardware's specifications, and\
    \ sometimes with examining the hardware itself. When you are writing a device\
    \ driver you must have such knowledge and if you can't write a driver. (Of course\
    \ it is possible to figure out a lot by probing a device keeps its specifications\
    \ secret, and a lot of drivers have been engineered this way. But as Linux has\
    \ matured this has become much rarer and time and energy are better spent encouraging\
    \ manufacturers to cooperate if they want their devices supported, than in this\
    \ kind of work.\n\n+   - Get as much information as you can from the hardware\
    \ people, but be prepared for some of it to be wrong or out of date, with new\
    \ devices. It is not unusual for the hardware and the specifications to be in\
    \ sync or for a device to fail to completely follow specifications. Sometimes\
    \ this is because device manufacturers are content with making the device works\
    \ adequately under the market-dominant operating system and then stop asking questions\
    \ at that point.\n\n# 2.7 Linux Driver Project **\n\n+   - The Linux Driver Project\
    \ is a group of kernel developers and some project managers that provides open\
    \ source drivers free of charge. The project will work closely with manufacturers\
    \ and when necessary will sign some NDAs (Non-Disclosure Agreements) as long as\
    \ the final work has a proper GPL2 license."
