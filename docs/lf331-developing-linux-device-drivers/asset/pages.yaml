  md: "# Accessing Files from the Kernel\n\n+   - a perennial question is \"How do\
    \ I do I/O from within the kernel?” This is a bad idea. It is full of problems\
    \ involving, stability, race conditions, and security. For an excellent explanation\
    \ of why this operation is only suitable as a learning exercise, see http://www.cs.helsinki.fi/linux-kernel/2003-23/1447.html.\n\
    \n+   - You can't accomplish file I/O without process context; the kernel has\
    \ to borrow one or create one; borrowing is extremely dangerous as you may corrupt\
    \ the context of the loaner; requiring a new kernel thread.\n\n+   - For a similar\
    \ method to what is given below, see the article by Greg Kroah-Hartman at http://www.linuxjournal.com/article/8110.\n\
    \n+   - One must set the address space to a user before dealing with files, and\
    \ reset it when done. The macros for handling this are:\n\n```\nget_ds();\nget_fs();\n\
    set_fs();\n```\n\nThe macro set_fs(x) sets which data segment to use, where x\
    \ can be KERNEL_DS or USER_DS. The macro get_ds() is just a shortcut for KERNEL_DS.\
    \ The full definitions can be found in /usr/src/linux/arch/x86/include/asm/uaccess.h\
    \ on most architectures.\n\nWhile kernel developers have made directly dealing\
    \ with files deliberately, there exists a kernel_read() function that can be used,\
    \ and we'll define a kernel_write() function to go along with it.\n\nNote you\
    \ not use these functions from an atomic context as they may sleep; however no\
    \ use in interrupt handlers, timers, etc.\n\n+   - Here's an example of how to\
    \ do it:\n\n# Example:\n\n```\n#include <linux/module.h>\n#include <linux/init.h>\n\
    #include <linux/uaccess.h>\n#include <linux/slab.h>\n#include <linux/fs.h>\n```\n\
    \n```\nstatic char *filename = \"/tmp/tempfile\";\nmodule_param(filename, char,\
    \ S_IRGO);\n```\n\n```\nint kernel_write(char *file, unsigned long offset,\n \
    \   char *addr, unsigned long count)\n{\n    struct mm_segment_t old_fs;\n   \
    \ loff_t pos = offset;\n    int result;\n```\n\n```\nold_fs = get_fs();\nset_fs(get_ds());\n\
    /* The cast to a user pointer is valid due the set_fs() */\nresult = vfs_write(file,\
    \ void __user *)addr, count, &pos);\n```"
