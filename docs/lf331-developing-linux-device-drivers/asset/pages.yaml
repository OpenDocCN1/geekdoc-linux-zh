  md: "# 20.2. PCI DEVICE DRIVERS\n\n```\n3.1: 557      int (struct pci_dev);\n3.1:\
    \ 558      void (*shutdown) (struct pci_dev *);\n3.1: 559      struct pci_error_handlers\
    \ *err_handler;\n3.1: 560      struct device_driver       driver;\n3.1: 561  \
    \    struct pci_dynmids dynm;\n3.1: 562) };\n```\n\n> /* Device woken up */\n\n\
    +   * Important elements of the data structure:\n\nTable 20.2: pci_driver Structure\
    \ Elements\n\n| Field | Meaning |\n| --- | --- |\n| id_table | Points to a device\
    \ ID's list of interest to the driver. Usually this will be exported with the\
    \ macro MODULE_DEVICE_TABLE(pci,...), and should be set to NULL if you call the\
    \ probe() function to check all PCI devices the system knows about. |\n| probe\
    \ | Points to a probing function which looks for your device. |\n| remove | Points\
    \ to a function that can be called whenever the device is removed, either by de-registration\
    \ or yanking out of a hot-plug slot. |\n| suspend | Used by power management when\
    \ a device goes to sleep. |\n| resume | Used by power management when a device\
    \ wakes up. |\n\n+   * We't get a detailed description of the functions pointed\
    \ to in the above table. Functions which are unnecessary for a particular device\
    \ can be set to NULL.\n* The ID is an array of structures of pci_device_id which\
    \ must end with a NULL entry:\n\n```\n3.1: 17 struct pci_device_id {\n3.1: 18\
    \      __u32 vendor, device;      /* Vendor device ID or PCI_ANY_ID *\n3.1: 19\
    \      __u32 subvendor, subclass;   /* Subsystem ID's or PCI_ANY_ID *\n3.1: 20\
    \      __u32 class, class_mask;    /* (class, subclass,prog-if) triplet *\n3.1:\
    \ 21      kernel_long_t driver_data;  /* Data to the driver * *\n3.1: 22); };\n\
    ```\n\n+   * This table is filled out with the use of the PCI_DEVICE() macro,\
    \ as in:\n\n```\nstatic struct pci_device_id tg3_pci_table[] = {\n  PCI_DEVICE(PCI_VENDOR_ID_BRADADOM,\
    \ PCI_DEVICE_ID_TIGON_3700),\n  PCI_DEVICE(PCI_VENDOR_ID_BRADADOM, PCI_DEVICE_ID_TIGON_3701),\n\
    \n  PCI_DEVICE(PCI_VENDOR_ID_ALTIMA, PCI_DEVICE_ID_ALTIMA_AC9100),\n  PCI_DEVICE(PCI_VENDOR_ID_APPLE,\
    \ PCI_DEVICE_ID_APPLE_TIGON3),\n};\n```\n\n+   * MODULE_DEVICE_TABLE(pci, tg3_pci_table);\n\
    * It is important to enable your driver after you find it, before doing anything\
    \ with it, with the function pci_enable_device(). This switches on the I/O and\
    \ memory regions, allocates any resources that might be needed, and wakes up the\
