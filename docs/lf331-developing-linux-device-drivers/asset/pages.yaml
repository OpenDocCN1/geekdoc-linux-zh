- pgno: 158
  md: '# 15.8. SLABS AND CACHE ALLOCATIONS


    +   - Number of active slabs

    - Total slabs

    - Number of pages per slab


    A dynamic and interactive view of the various caches on the system can be obtained
    using the slabtop utility, where the elements can be sorted in many ways. One
    can make the same information by using the command vmstat -m.


    Now that you have created your memory cache, you can make any number of objects
    associated with it, and free them, with the functions:


    ```

    void kmem_cache_alloc( struct kmem_cache *cache, gfp_t gfp_mask);

    void kmem_cache_free( struct kmem_cache *cache, void * );

    ```


    pointing to the cache you created as the first argument. The gfp_mask argument
    is the same as for --get_free_pages(). (If the memory not already exist in the
    cache, it will be created using these flags). The second argument to kmem_cache_free()
    simply points to where you got from kmem_cache_alloc().


    You can use the function kmem_cache_shrink() to release unused objects. When you
    no longer need your memory cache you must free it with kmem_cache_destroy() (which
    shrinks the cache first); otherwise resources will not be freed. This function
    will fail if any object allocated to the cache has not been released.


    Note it is also possible to set up a memory cache that never drops below a certain
    size using a memory pool, for which the API is found in /usr/src/linux/include/mempool.h.
    Such memory is taken outside of the normal memory management system and should
    be used only for critical purposes.


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_158_0.png)


    +   The 2.6.22 kernel introduced the SLAB allocator as a drop-replacement for
    the older SLAB implementation. Which one to use is a compile option; in the 2.6.23
    kernel SLUB was made the default.


    +   The new allocator has less of the complexity that was in the old one, has
    a smaller memory footprint, some performance enhancements, is better adapted for
    NUMA systems and has easier debugging capabilities.


    +   Eventually SLAB may disappear, but due to the importance of having a stable
    cache allocator, this will only happen after SLUB has withstood the test of large
    scale deployment. Indeed there has also been development of other alternatives
    such as the SLOB and SLQB slab allocators.'
