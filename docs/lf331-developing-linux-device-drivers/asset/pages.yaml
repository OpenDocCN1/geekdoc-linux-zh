  md: "# CHAPTER 11. RACE CONDITIONS AND SYNCHRONIZATION METHODS\n\nand is meant to\
    \ be used opaquely. If count is 1, the mutex is free, if it is 0 it is locked,\
    \ and if it is\nnegative, it is locked and processes are waiting.\n\n+   - Mutexes\
    \ are initialized in an unlocked state with\n\nDEFINE_MUTEX(name);\n\nat compile\
    \ time or\nvoid mutex_init(struct mutex *lock);\n\nat run time.\n- The locking\
    \ primitives come in uninterruptible and interruptible forms but with only one\
    \ unlocking\nfunction:\n\nvoid mutex_lock(struct mutex *lock);\nint mutex_lock_interruptible(struct\
    \ mutex *lock);\nint mutex_lock_killable(struct mutex *lock);\nvoid mutex_unlock(struct\
    \ mutex *lock);\n- Any signal will break a lock taken out with mutex_lock_interruptible()\
    \ while only a fatal signal will\nbreak one taken out with mutex_lock_killable().\
    \ Locks taken out by mutex_lock() are not affected\ns signals.\n- There are some\
    \ important restrictions on the use of mutexes:\n- The mutex must be released\
    \ by the original owner.\n- The mutex cannot be applied recursively.\n- The mutex\
    \ cannot be locked or unlocked from interrupt context.\n- Note however, that violation\
    \ of these restrictions will not be detected without mutex debugging configured\n\
    to the kernel.\n- The owner of the mutex is the task in whose context the mutex\
    \ is taken out. If that task is no longer\\active another may release the mutex\
    \ without triggering debugging warnings.\n- A non-blocking attempt to get the\
    \ lock can be made with\n\nmutex_trylock(struct mutex *lock);\n\nand\n\nint mutex_is_locked(struct\
    \ mutex *lock);\nchecks the state of the lock.\n- Note that mutex_trylock() returns\
    \ 1 if it obtains the lock, akin to spin_trylock() and unlike\ndown_trylock().\n\
    - There are no special reader/writer mutexes such as there are for other exclusion\
    \ devices such as semaphores\n spinlocks."
