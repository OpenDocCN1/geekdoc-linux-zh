  md: '# CHAPTER 23. NETWORK DRIVERS I: BASICS


    +   * While the net_device structure also contains an int init() function pointer
    which will be called (if it exists) by register_netdevice(), this is an older
    usage which has been retained but should not be used in new drivers.


    # 23.5 Opening and Closing


    +   * The opening and closing operations of a network device driver are similar
    to those for character and block devices, although how they are invoked from user-space
    is somewhat different. The callback functions are pointed to in the net_device
    data structure:


    ```

    int (*ndo_open) (struct net_device *dev);

    int (*ndo_stop) (struct net_device *dev);

    ```


    +   * With all the other types of devices, it is generally a good idea not to
    allocate resources until they are needed; one shouldn''t interrupt requests, memory
    or other resources at device initialization, or rather it when the device is first
    opened, or used. Likewise resources may be released after closing, but it is often
    more efficient to let them remain until device unloading in case the network interface
    is removed.


    +   * Remember that there is no filesystem entry for a network device driver,
    and thus they are not opened by an open() call on a device. A program such as
    ifconfig will open and close the device by the use of ioctl() (commands on socket
    descriptors).


    +   * The opening process is generally done by sending two of the commands. The
    first uses the SIOCSIFFADDR command to assign an address. The second senses SIOCSIFFLAGS
    to set the IFF_UP bit in dev->flags to denote turning the interface on.


    +   * The first command (setting the address) is handled entirely by the layers
    above the device driver. The second command (turning the device on) causes the
    invocation of the open() method for the device.


    +   * Similarly, shutting down the device (with ifconfig eth# down) sends the
    SIOCSIFFLAGS command to clear the IFF_UP bit, and invokes the driver''s stop()
    function.


    +   * One of the steps (open()) method must perform to get the hardware MAC address
    into dev->dev_addr, which has a length of ETH_ALEN.


    +   * Another required is to start the transmit_queue for the device. There are
    a number of functions associated with this facility:


    ```

    void netif_start_queue (struct net_device *dev);

    void netif_stop_queue (struct net_device *dev);

    void netif_wake_queue (struct net_device *dev);

    ```


    +   * During opening (or initialization) the function netif_start_queue() starts
    up the transmit queue. The netif_stop_queue() function can be used to mark the
    device as unable to transmit any more packets and should be used in the stop()
    method; the function netif_wake_queue() is used to resume a temporary shutdown.
    There are some auxiliary functions which can be used to inquire about the state
    of the transmit queue; see /usr/src/include/linux/netdevice.h.


    +   * We will return to these functions when we discuss transmission.'
  merge: -1
