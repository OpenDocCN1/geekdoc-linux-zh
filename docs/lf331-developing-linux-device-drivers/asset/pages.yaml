- pgno: 26
  md: '# 24. ROLLING YOUR OWN KERNEL


    # Start of the work


    ```

    NARGS="$##"

    [ "$NARGS" == "3" ] && get_SOURCE $1 $2 $3

    ```


    ```

    get_KERNELVERSION

    get_BOOT

    get_SYSTEM

    get_MAKE

    ```


    echo building: Linux $KERNEL kernel, and placing in: $BOOT on a $SYSTEM system


    # set shell to abort on any failure and echo commands

    set -x


    # Do the main compilation work, kernel and modules

    MAKE


    # Install the modules

    MAKE modules_install


    # Install the compressed kernel, System.map file, config file,

    cp arch/x86/boot/bzImage $BOOT/vmlinuz-$KERNEL

    cp System.map $BOOT/System.map-$KERNEL

    cp .config $BOOT/config-$KERNEL


    # making initrd and updating grub is very distribution dependent


    echo I am building the initrd image and modifying grub config on $SYSTEM


    makeinitrd="$SYSTEM"


    +   - We''ve been sloppy because one should really separate the steps of compiling
    and installing. Any user should be able to compile the kernel, while only the
    superuser should be able to install the kernel and modules. Compiling as superuser
    exposes one potential bugs which can screw up the system; historically this has
    indeed happened on development kernels.


    +   - While the compiling step is distribution-independent the installation steps
    can be quite different in two of the steps; construction of the initrd and initramfs
    image and its naming; and editing the grub (or lilo) configuration file. The above
    script may not work properly in every conceivable circumstance, but it should
    be more than adequate in common installations.'
