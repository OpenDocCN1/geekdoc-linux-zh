  md: "# 18.4 WORK QUEUES\n\n```\nwork_func_t func;\n```\n\n+   - Here func() points\
    \ to the function that will be run when the work is done. The other arguments\
    \ are for internal use and are usually not set directly.\n\n+   - Note that the\
    \ data entry is used like the state entry for tasklets; if multiple identical\
    \ work queues are requested, all the first will be quietly dropped on the floor\
    \ in the same way.\n\n+   - The earliest implementation of workqueues had an explicit\
    \ data pointer that passed to the function. This was modified so that the function\
    \ now receives a pointer to a work_struct data structure.\n\n+   - In order to\
    \ pass data to a function, one needs to embed the work_struct in a user-defined\
    \ data structure and then to pointer arithmetic to recover it. An example would\
    \ be:\n\n```\nstatic struct my_dat\n{\n    int irq;\n    struct work_struct work;\n\
    }\nstatic void w_fun (struct work_struct *w_arg)\n{\n    struct my_dat *data =\
    \ container_of(w_arg, struct my_dat, work);\n    atomic_inc (data->irq);\n}\n\
    };\n```\n\n+   - A work-queue can be declared and initialized at compile time:\n\
    \n```\nDECLARE_WORK(name, void (*function)(void *));\n```\n\nwhere name is the\
    \ name of the structure to queueing up function() to run. A previously initialized\
    \ work queue can be initialized and loaded with the two macros:\n\n```\nINIT_WORK(struct\
    \ work_struct *work, void (*function)(void *));\nPREPARE_WORK(struct work_struct\
    \ *work, void (*function)(void *));\n```\n\nwhere has already been declared as\
    \ a work_struct. The INIT_WORK() macro initializes the list_head linked-list pointer,\
    \ and PREPARE_WORK() sets the function pointer. The INIT_WORK macro needs to be\
    \ called at least once, and in calls PREPARE_WORK() it should not be called while\
    \ a task is in the work queue.\n\n+   - While it is possible to set up your work\
    \ queue for your own tasks, in cases a default work queue (named events) will\
    \ suffice, and is easier to use. Tasks are added to and flushed from this queue\
    \ with the functions:\n\n```\nschedule_work(struct work_struct *work)\nflush_scheduled_work(void\
    \ *);\n```\n\n+   - Note that these are the only work functions that are exported\
    \ to all modules; the others are exported only to GPL-compliant modules. Thus\
    \ creating your own work queue and using it is reserved for GPL-licensed code.\n\
    \n+   - A work-queue can be created and destroyed with:\n\n```\nstruct workqueue_struct\
    \ *create_workqueue(const char *name)\nvoid destroy_workqueue(struct workqueue_struct\
    \ *wq);\n```"
