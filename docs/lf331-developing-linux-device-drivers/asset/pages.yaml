  md: '# 15.4 kmallococ


    +   - If the requested virtual page is not valid, the kernel gets a page fault
    and then tries to get the page into physical memory. Demand Paging will try and
    try to get the page in. The page may have been swapped out to disk.


    +   - If a page has been modified and there are insufficient free pages, a page
    is marked as dirty and will either be discarded if the page corresponds to file-based
    data, or written to the swap file. Pages to be discarded are chosen with a LRU
    (Least Recently Used) algorithm.


    +   - Linux uses a four-level Page Table, even though the 32-bit processors have
    only two levels of page tables. (Before version 2.6.10, Linux used a three-level
    scheme.) This permits using the same functional methods for all architectures;
    traversing the superfluous levels involves fall-through functions.


    +   - If you use the 64 GB option on x86, Linux uses the PAE (Physical Address
    Extension) facility which gives an extra 4 bits of address space. In this uses
    a true three-level scheme, rather than one in


    +   - The most common functions for allocation and freeing memory in the Linux
    kernel are:


    ```

    #include <linux/slab.h>


    void *kmalloc(unsigned int len, gfp_t gfp_mask);

    void kfree(void *ptr);

    ```


    +   - Possible values for the gfp_mask argument are detailed in /usr/src/kernel/include/linux/gfp.h
    and can be:


    | Value | Meaning |

    |---|---|

    | GFP_KERNEL | Block and going to sleep if the memory is not immediately available,
    allowing preemption to occur. This is the normal way of calling kmalloc(). |

    | GFP_ATOMIC | Return immediately if no pages are available. For instance, this
    might be done when kmalloc() is called from an interrupt, where sleep would prevent
    receipt of other interrupts. |

    | GFP_DMA | For buffers to be used with ISA DMA devices; ORed with GFP_KERNEL
    or GFP_ATOMIC. Ensures the memory is contiguous and falls under MAX_DMA_ADDRESS=16
    MB on x86 for ISA devices; for PCI this is unnecessary. The exact meaning of this
    flag is dependent. |

    | GFP_USER | Used to allocate memory for a user. May sleep, and is a low priority
    request. |

    | GFP_HIGUSER | Like GFP_USER, but allocates from high memory |

    | GFP_NOIO | Not to be used for filesystem calls, disables I/O operation. |

    | GFP_NFS | For internal use. |


    Table 15.1: GFP Memory Allocation Flags


    +   - Drivers rarely use the values GFP_KERNEL, GFP_ATOMIC, and GFP_DMA.


    +   - The in_interrupt() macro can be used to check if you are in interrupt or
    process context. For instance:


    ```

    char *buffer = kmalloc(nbytes, in_interrupt) ? GFP_ATOMIC : GFP_KERNEL);

    ```'
