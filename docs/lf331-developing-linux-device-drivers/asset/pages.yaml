  md: '# # Chapter 13


    # # Unified Device Model and sysfs


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_140_0.png)


    We''ll consider the **unified device model**, it''s main data structures and how
    they apply to real devices and examine the **sysfs** pseudo-filesystem.


    +   13.1 Unified Device Model ................................................................
    125

    13.2 Basic Structures .......................................................................................
    126

    13.3 Real Devices ................................................................................................
    127

    13.4 sysfs ........................................................................................................
    129

    13.5 Labs ............................................................................................................
    131


    # ## 13.1 Unified Device Model


    +   - A **unified device model (or integrated device model)** was introduced in
    the 2.6 kernel series. Under this scheme all devices are handled in one framework,
    with similar data structures and functional methods. Additionally, this framework
    is represented as a device tree rooted on the system buses.

    - For the most part, device drivers need not interact directly with this underlying
    model, but register as devices under the type of bus they are connected to, as
    **pci**. Information about the devices is exposed in the **sysfs** filesystem,
    to which drivers can optionally export data for viewing, as a more modern alternative
    to the use of **/proc filesystem and ioctl() commands.

    - At the root of the driver model are **objects**, which contain simple representations
    of data related to any object in a system, such as a name, type, parent, reference
    count, lock, etc. A set of objects identical in type is contained in a kset.

    - The data structures incorporated in the driver model contain information for
    each device such as what driver is used for, what bus they are on, what power
    state they are in and how they suspend and resume. They also map out the structure
    of the system buses, how they are connected to each other and what devices can
    be attached and attached.'
  merge: -1
  img_proc: true
