    ```


    is a jump table of device entry points, with the exception of the first field,
    owner, which is used for module reference counting.


    +   - This structure is used for purposes other than character drivers, such as
    filesystems, and so some of the entries will not be used in this area. This is
    true with the file and inode structures to be discussed shortly.


    +   - The file operations fops is initialized with code like:


    ```

    struct file_operations fops = {

    count = THIS_MODULE,

    open = my_open,

    lease = my_close,

    read = my_read,

    write = my_write,

    unlocked_ioctl = my_unlocked_ioctl,

    };

    ```


    +   - According to the C99 language standard, the order in which fields are initialized
    is irrelevant, and any unspecified elements are NULL-def.


    +   - These operations are associated with the device with the cdev_init() function,
    which places a pointer to the file_operations structure in the parent cdev structure.
    Whenever a corresponding system call is made on the device node owned by the driver,
    the work is passed through the driver; e.g., a call to open on the device node
    causes the my_open() method to be called in the above example.


    +   - If no method is supplied in the file_operations structure, there are two
    possibilities for what will occur if the method is invoked through a system call:


    +   - The method will fail: An example is lseek().

    A generic default method will be invoked: An example is llseek(). Sometimes this
    means the method will always succeed: Examples are open() and release().


    ![](img/134c18b05ee9bbbe93ba3f4335720ac1_65_0.png)'
