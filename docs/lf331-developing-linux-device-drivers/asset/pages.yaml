- pgno: 185
  md: "# Table 17.1: poll() Flags\n\n| Value | Meaning |\n|---|---|n| POLLIN | Normal\
    \ or priority band data can be read without blocking. |\n| POLLRDNORM | Normal\
    \ data can be read. Usually a readable device returns POLLIN | POLLRDNORM |\n\
    | POLLRBAND | Priority band data can be read. (This flag is unused.) |\n| POLLPRI\
    \ | High priority out of band data can be read, causing select() to report an\
    \ exception. |\n| POLLUP | Reaching end of file on device. |\n| POLLERR | An error\
    \ has occurred. |\n| POLLOUT | The device can be written without blocking. |\n\
    | POLLWRNORM | Normal data can be written. Usually a writable device returns POLLOUT\
    \ | POLLWRNORM |\n| POLLWRBAND | Priority band data can be written. |\n\n+   *\
    \ An example of an entry point might look like:\n\n```\nstatic unsigned int mycdrv_poll(struct\
    \ file *file, poll_table * wait)\n{\n    unsigned int revents = 0;\n    poll_wait(file,\
    \ &wq_read, wait);\n    poll_wait(file, &wq_write, wait);\n\n    if (atomic_read\
    \ (&data_ready_to_read))\n        revents |= POLLIN | POLLRDNORM;\n    if (atomic_read\
    \ (&data_ready_to_write))\n        revents |= POLLOUT | POLLWRNORM;\n\n    return\
    \ revents;\n}\n```"
