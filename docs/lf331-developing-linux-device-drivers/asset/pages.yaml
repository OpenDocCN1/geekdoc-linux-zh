  md: "# Semaphores\n\n+   * It is also possible to use counting semaphores to protect\
    \ critical sections of code. These work on data structures of type semaphore and\
    \ rw_semaphore.\n\n+   * The basic functions (defined as macros) can be found\
    \ in /usr/src/linux/include/linux/semaphore.h, and /usr/src/linux/include/linux/rwsemaphore.h.\n\
    \n```\n#include <linux/semaphore.h>\n\nvoid down(struct semaphore *sem);\nint\
    \ down_interruptible(struct semaphore *sem);\nint down_trylock(struct semaphore\
    \ *sem);\nvoid up(struct semaphore *sem);\n\nvoid down_read(struct rw_semaphore\
    \ *sem);\nvoid down_write(struct rw_semaphore *sem);\nvoid up_read(struct rw_semaphore\
    \ *sem);\nvoid up_write(struct rw_semaphore *sem);\n\nstruct semaphore {\n   \
    \ unsigned int count;\n    int sleepers;\n    wait_queue_head_t wait;\n};\n\n\
    struct rw_semaphore {\n    rw_count_t count;\n    spinlock_t lock;\n    struct\
    \ list_head list_head;\n};\n\n```\n\n+   * The down() function checks to see if\
    \ someone else has already entered the critical section; if the value of the semaphore\
    \ is greater than zero, it decrements it and returns. If it is already zero, it\
    \ will sleep and try again later.\n\n+   * The down_trylock() function differs\
    \ in that it can be interrupted by a signal; the other form blocks any signals\
    \ to the process, and should be used only with great caution. However, you will\
    \ have to check to see if a signal arrived if you use this function, so you have\
    \ code like:\n\n```\nif (down_interruptible(&sem)) return -EREARTSYS\n\n```\n\n\
    which tells the system to retry the system call or return -EINTR to the application;\
    \ which does depends on how the system is set up.\n\n+   * The down_trylock()\
    \ form checks if the semaphore is available, and if not, returns, and thus is\
    \ a non-blocking function (which is why it doesn't need an interruptible form.)\
    \ It returns 0 if the lock is obtained. For instance, a typical read entry from\
    \ a driver might contain:\n\n```\nif (file->flags & O_NONBLOCK) {\n    if (down_trylock(&sem))\n\
    \        return -ERAGAIN;\n}\nelse {\n    if (down_interruptible(&sem))\n    \
    \    return -EREARTSYS;\n}\n\n```"
