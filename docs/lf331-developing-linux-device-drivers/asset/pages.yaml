- pgno: 258
  md: '# 24.4. SOCKET BUFFER FUNCTIONS


    Table 24.9: Socket Buffer Functions


    | Type | Function | Use |

    |---|---|---|

    | struct sk_buff * | unsigned int length); | Allocate a new socket buffer, give
    it a reference count of one, and initialize the data, tail, head pointers. |

    | struct sk_buff * | dev_alloc_skb (unsigned int length); | Same as alloc_skb()
    plus the memory is allocated with GFP_ATOMIC, so failure results are not immediately
    available, and some space is reserved between the head and tail fields of the
    packet, for optimization use by kernel networking layers. |

    | void | kfree_skb (struct sk_buff *skb); | Drop the buffer reference count and
    release it if the count is not zero. This form is used by the kernel and is not
    meant to be used by drivers. |

    | void | dev_kfree_skb (struct sk_buff *skb); dev_kfree_skb_irq (struct sk_buff
    *skb); dev_kfree_skb_any (struct sk_buff *skb); | For use in drivers. The three
    forms are non-interrupt-context, or any context. |

    | unsigned char * | skb_put (struct sk_buff *skb, unsigned int len); | Add len
    bytes of data to the end of the buffer, returning a pointer to the first byte
    of the extra data. |

    | unsigned char * | skb_push (struct sk_buff *skb, unsigned int len); | Add len
    bytes of data to the beginning of the buffer, returning a pointer to the first
    byte of the extra data. |

    | unsigned char * | skb_pull (struct sk_buff *skb, unsigned int len); | Remove
    data from the buffer start, returning a pointer to the new start of data. The
    space released will go into headroom. |

    | int | skb_headroom (const struct sk_buff *skb); | Returns the number of bytes
    of free space at the start of the buffer. |

    | int | skb_tailroom (const struct sk_buff *skb); | Returns the number of bytes
    of free space at the end of the buffer. |'
