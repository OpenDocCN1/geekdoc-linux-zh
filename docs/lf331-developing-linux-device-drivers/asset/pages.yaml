  md: 'the difference being that the original mask of enabled interrupts is not saved,
    and all interrupts are restored by the unlocking operation. This is dangerous
    (an interrupt may have been disabled) and generally these functions should not
    be used.


    +   - There are also reader and writer spinlock functions; with these there can
    be more than one reader in a critical region, but in order to make changes exclusive
    write lock must be invoked. In other words, read locks block only a write lock,
    while a write lock blocks everyone. Examples would be:


    ```

    unsigned long flags;

    rwlock_t my_lock;

    rw_lock_init (&my_lock);


    read_lock_irqsave(&my_lock, flags);

    .... critical code , reads only

    unlock_irqrestore(&my_lock, flags);


    write_lock_irqsave(&my_lock, flags);

    .... critical code , exclusive read and write access ...

    write_unlock_irqrestore(&my_lock, flags);

    ```


    +   - There are also faster "irq-lock" versions of these calls for non-interrupt
    contexts.


    +   - These locks favor readers over writers; i.e., if a writer is waiting for
    a lock and more readers come they will get first access. This can cause writer
    starvation and helped the development and use of seqlocks.


    +   - There are a few other spinlock functions:


    ```

    spin_unlock_wait(spinlock *lock);

    int spin_is_locked(spinlock *lock);

    int spin_trylock(spinlock *lock);

    ```


    +   - spin_unlock_wait() waits until the spinlock is free.


    +   - spin_is_locked() returns 1 if it is locked


    +   - spin_trylock() returns 1 if it got the lock; otherwise it returns with 0;
    i.e., it is a non-blocking call.


    # 11.5 Big Kernel Lock


    +   - One locking mechanism that was used throughout the Linux kernel is the so-called
    Big Kernel Lock, or by BKL. It could be invoked simply with


    ```

    lock_kernel();

    ....

    critical code

    unlock_kernel();

    ```


    +   - The BKL was originally a normal spinlock with widespread usage, and as such
    a relic of earlier times when locking was very coarse-grained.


    +   - However, in the 2.6.11 kernel the BKL was converted to a semaphore and really
    should have been renamed the Big Kernel Semaphore. As a result it differed in
    two ways from other locking mechanisms:


    +   - Recursive acquisition could be used within a given thread.'
