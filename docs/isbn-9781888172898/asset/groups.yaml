    **请注意：** 由于 Red Hat Linux 支持在多种不同类型的硬件上进行安装，许多驱动程序（包括 SCSI 适配器、网络卡和许多 CD-ROM 的驱动程序）并未内置于安装过程中使用的
    Linux 内核中；相反，它们作为*模块*存在，并在安装过程中按需加载。在加载这些驱动程序时，你将有机会指定相关选项，实际上，在**启动**提示符下为这些驱动程序指定的选项将会被忽略。有关内置于安装系统中的驱动程序的更多信息，请参阅上文
    2.2.2 节。


    ## 开始安装


    启动后，安装过程首先会询问你是否使用彩色显示器（见图 2.2）。**是**为默认选项；如果你无法区分光标或高亮显示，请按一次 `Tab` 键，然后按 `Enter`
    键继续。接下来会出现一条欢迎消息；按 `Enter` 键开始安装。如果你希望终止安装过程，只需现在弹出启动软盘并重新启动你的机器。


    ![](img/06353bca937b38b02602dcfb58824d72_28_0.png)


    ### 2.4.2 选择键盘布局


    在欢迎对话框之后，安装程序将为你提供选择键盘布局的机会（见图 2.3）。选择你希望在 Red Hat Linux 系统上使用的键盘布局，并按下 **Enter**
    键；你选择的键盘布局将自动加载，既用于安装过程的剩余部分，也用于每次启动你的 Red Hat Linux 系统时。


    如果你希望在启动 Red Hat Linux 系统后更改键盘布局，可以使用 /usr/sbin/kbdconfig 命令。


    ![](img/06353bca937b38b02602dcfb58824d72_29_0.png)


    图 2.3：选择键盘布局


    ### 2.4.3 PCMCIA 支持


    接下来，安装程序会询问你是否需要 PCMCIA 支持。如果你正在使用 PCMCIA 设备进行安装（例如，通过 NFS 安装时使用的 PCMCIA 以太网卡，或从
    CD 安装时使用的 PCMCIA SCSI 卡），你应该回答“是”；安装程序会提示你插入辅助软盘。在插入你的 PCMCIA 卡之前，应等待下一个对话框出现。


    ### 2.4.4 选择安装方法


    你可以通过四种基本方法（参见 2.2.1 节，*安装方法*）中的任意一种来安装 Red Hat Linux，其中一些方法需要使用辅助软盘。总结如下：


    - **CD-ROM** 如果你的 CD 光驱中有 Red Hat Linux CD；不需要辅助软盘。

    - **NFS** 如果你正在从导出 Red Hat Linux CD 或 Red Hat FTP 站点镜像的 NFS 服务器安装；不需要辅助软盘。

    - **硬盘** 如果你已将 Red Hat Linux 文件复制到本地硬盘之一；需要辅助软盘。

    - **FTP** 如果你正在直接从 FTP 服务器安装；需要辅助软盘。

    - **SMB 镜像** 如果你正在从 Microsoft Windows NT 或 Windows 95 共享卷安装；需要辅助软盘。


    下一个对话框询问你希望使用哪种类型的安装方法（见图 2.4）。高亮显示相应的选项并选择 **确定**，或按 `Enter` 键。如果你选择 *FTP* 或
    *硬盘*，且未使用 PCMCIA 支持，安装程序会提示你插入辅助软盘。


    ## CD-ROM 类型


    如果你选择从 CD-ROM 安装 Red Hat Linux/Intel，安装程序会提示你选择 CD-ROM 类型：


    - **IDE (ATAPI)** 大多数适用于基于 Intel 的 PC 的 CD-ROM 都是 IDE（也称为 ATAPI）CD-ROM。安装程序在放弃查找之前，会检查所有可用
    IDE 设备上的 CD-ROM。

    - **SCSI** 如果你的 CD-ROM 连接到受支持的 SCSI 适配器，请选择此项；安装程序会要求你选择 SCSI 驱动程序。选择与你适配器最匹配的驱动程序。如有必要，可以指定驱动程序选项；然而，大多数驱动程序会自动检测你的
    SCSI 适配器。

    - **其他** 如果你的 CD-ROM 既不是 IDE 也不是 SCSI CD-ROM，则属于“其他”。安装程序会列出受支持的 CD-ROM 驱动程序列表；选择一个驱动程序，并如有必要，指定任何驱动程序选项。


    ![](img/06353bca937b38b02602dcfb58824d72_31_0.png)


    图 2.4：选择安装方法


    ### 2.4.5 如果你是通过 NFS 安装


    如果你不是通过 NFS 安装 Red Hat Linux，可以跳至下文 2.4.6 节。


    ## 选择网络驱动程序


    如果你是通过 NFS 安装，计算机中必须已安装受支持的网络卡。安装程序会提示你选择支持你网络卡的驱动程序，并指定驱动程序定位和识别该卡所需的任何选项。大多数时候，驱动程序可以通过探测自动定位该卡；然而，探测你的硬件可能会导致机器挂起。如果发生这种情况，请重新启动机器，再次开始安装，并在到达此步骤时指定额外的驱动程序选项（参见附录
    A）。


    ## 配置 TCP/IP 网络


    在安装程序找到你的网络卡后，它会提供几个对话框来配置 TCP/IP 网络。这些信息仅在安装过程中使用；你以后可以配置永久网络信息。此功能提供了更大的灵活性，如果你希望从不同于机器最终“运行”环境的网络进行安装。图
    2.5 包含了示例网络信息。


    | 字段 | 示例值 |

    |---|---|

    | IP 地址 | 10.0.2.15 |

    | 子网掩码 | 255.255.255.0 |

    | 默认网关 | 10.0.2.254 |

    | 主要名称服务器 | 10.0.2.1 |

    | 域名 | redhat.com |

    | 主机名 | pooh.redhat.com |


    ![](img/06353bca937b38b02602dcfb58824d72_32_0.png)


    第一个对话框要求你提供 IP 和其他网络地址（见图 2.6）。输入你在安装期间使用的 **IP 地址**，并按 `Enter`。安装程序会根据你的 IP 地址尝试猜测你的
    **子网掩码**；如果子网掩码不正确，你可以更改它。按 `Enter`。安装程序会根据你的 IP 地址和子网掩码猜测 **默认网关** 和 **主要名称服务器**
    地址；如果它们不正确，你可以更改它们。选择 **确定** 继续。


    第二个对话框提示你输入域名、主机名和其他网络信息（见图 2.7）。输入你系统的 **域名**，并按 `Enter`；安装程序会将域名传递到 **主机名**
    字段。输入你使用的主机名，置于域名之前，以形成完全限定域名（FQDN）。如果你的网络有一个以上的名称服务器，你可以在 **次要名称服务器** 和 **辅助名称服务器**
    字段中输入额外名称服务器的 IP 地址。选择 **确定** 继续。


    ![](img/06353bca937b38b02602dcfb58824d72_33_0.png)


    图 2.6：配置 TCP/IP


    ## NFS 服务器信息


    下一个对话框要求提供关于 NFS 服务器的信息（见图 2.8）。输入你的 NFS 服务器名称或 IP 地址，以及包含 Red Hat Linux CD 的导出目录的名称。例如，如果
    NFS 服务器将 Red Hat Linux CD 挂载在 `/mnt/cdrom` 上，则在 Red Hat 目录中填入 `/mnt/cdrom`。如果
    NFS 服务器导出的是 Red Hat Linux 安装树的镜像而非 CD，请输入包含 RedHat 目录的目录。例如，如果你的 NFS 服务器包含目录 `/mirrors/redhat/i386/RedHat`，请输入
    `/mirrors/redhat/i386`。


    ### 2.4.6 升级或安装


    在你选择一种安装方法后（如果你是通过 NFS 或 SMB 卷安装，则在配置完网络信息后），安装程序会提示你选择 *安装* 或 *升级*（见图 2.9）。


    ![](img/06353bca937b38b02602dcfb58824d72_34_0.png)


    图 2.7：配置网络


    ## 安装


    通常，你会在干净的磁盘分区或分区组上安装 Red Hat Linux，或者覆盖另一个 Linux 安装。将 Red Hat Linux 安装在另一个 Linux
    安装（包括 Red Hat Linux）之上不会保留先前安装的任何内容。


    如果你希望执行完全安装，请选择 **安装**。


    ## 升级


    Red Hat Linux 4.2 的安装过程包括从基于 RPM 技术的先前版本 Red Hat Linux（2.0、2.1、3.0、3 和 4.0）升级的功能。升级你的系统会安装模块化
    2.0.x 内核以及已安装在你机器上的软件包的最新版本。升级过程使用 `.rpm.save` 扩展名保留现有的配置文件（例如，`sendmail.cf.rpm.save`），并在
    `/tmp/upgrade.log` 中留下记录其采取行动的日志。随着软件的发展，配置文件格式可能会发生变化，因此在你集成更改之前，应仔细比较原始配置文件和新文件。


    如果你希望升级你的 Red Hat Linux/Intel 系统，请选择 **升级**。


