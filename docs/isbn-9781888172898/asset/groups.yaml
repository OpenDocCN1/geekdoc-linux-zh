    \ system administration binaries (those that do not belong in */sbin*), and /src\
    \ is for source code.\n\n### The */usr/local* Directory\n\nThe FSSTND says:\n\n\
    > “The /usr/local hierarchy is for use by the system administrator when installing\
    \ software locally. It needs to be safe from being overwritten when the system\
    \ software is updated. It may be used for programs and data that are shareable\
    \ amongst a group of machines, but not found in /usr.”\n\nThe /usr/local directory\
    \ is similar in structure to the */usr* directory. It has the following subdirectories,\
    \ which are similar in purpose to those in the */usr* directory:\n\n```\n/usr/local\
    \ |- bin |- doc |- etc |- games |- include |- info |- lib |- man |- sbin +- src\n\
    ```\n\n### The */var* directory\n\nSince the FSSTND requires that you be able\
    \ to mount */usr* read-only, any programs that write log files or need spool or\
    \ lock directories probably should write them to the /var directory. The FSSTND\
    \ says */var* is for\n\n> “... variable data files. This includes spool directories\
    \ and files, administrative and logging data, and transient and temporary files.”\n"
  mdcn: "\n\n要获取更多关于文件发现的问题的信息，请双击文件的路径。如图 9.9 所示的窗口会列出存在问题的属性的期望值和当前值。\n\n![](img/06353bca937b38b02602dcfb58824d72_148_0.png)\n\
    \n图 9.9：验证详情\n\n### 9.4.3 安装新软件包\n\n从 glint 安装新的软件包非常简单。首先查看可供安装的软件包（请参阅 9.2.3\
    \ 节了解操作方法）。您可以选择其中任意数量的软件包（如果不确定其用途，可以查询它们）以进行安装（选择方法与您为验证而选择软件包的方式相同）。如果您想安装单个软件包或组，上下文敏感菜单提供了快捷方式。图\
    \ 9.10 显示了一个窗口，其中一些软件包已被选中以进行安装。\n\n开始安装后，会出现如图 9.11 所示的窗口。它跟踪安装的进度，以便您知道正在发生的事情。顶栏显示当前软件包（其名称列在栏内）已安装的部分，而底部图表显示总安装进度已完成的部分。软件包数量、软件包大小和时间估计会持续更新。\n\
    \n如果安装过程中出现问题，将会显示一个窗口列出发生的任何错误。如果发生这种情况，您应解决问题并重试。\n\n![](img/06353bca937b38b02602dcfb58824d72_149_0.png)\n\
    \n图 9.10：已选定的待安装软件包\n\n![](img/06353bca937b38b02602dcfb58824d72_149_1.png)\n\n\
    图 9.11：安装进度\n\n安装完成后，已安装的软件包和组将从可用软件包窗口移至主 glint 窗口，以表明它们已成功安装。\n\n#### 升级软件包\n\
    \n当软件包的新版本发布时，将其安装在您的系统上很容易。以选择待安装软件包相同的方式，从可用软件包窗口中选中要升级的软件包。点击“升级”按钮或上下文敏感菜单都可以开始升级。\n\
    \n升级过程中，您会看到与安装软件包类似的进度指示器。完成后，已安装的软件包将显示在主 glint 窗口中，并且这些软件包的旧版本将被移除。\n\n使用升级选项比先卸载软件包的旧版本再安装新版本要好得多。使用升级可以确保您对软件包配置文件所做的任何更改都能得到妥善保留，而手动操作可能导致这些更改丢失。\n\
    \n如果在安装过程中磁盘空间耗尽，安装将失败。但是，发生错误时正在安装的那个软件包可能会留下一些文件。要清理这些文件，请在腾出更多磁盘空间后重新安装该软件包。\n\
    \n### 9.4.4 卸载软件包\n\n卸载软件包与升级软件包不同。当卸载一个软件包时，该软件包使用的且系统中其他软件包不再需要的文件将被移除。已更改的配置文件会被复制为\
    \ *<filename>*.rpmsove，以便您稍后复用。\n\n与验证和查询软件包一样，您可以通过 glint 窗口右侧的按钮或上下文敏感菜单来移除软件包。请记住，当您从某个组的菜单中进行选择时，操作将应用于该组中的所有软件包，因此务必小心！\n\
    \n一旦开始卸载，glint 会请求确认，显示如图 9.12 所示的窗口。所有即将被卸载的软件包都会列在其中。您应查看所有列出的项，以确保不会误删您想要保留的内容。点击“是”按钮将开始卸载过程。完成后，已移除的软件包和组将从它们所在的任何窗口中消失。\n\
    \n![](img/06353bca937b38b02602dcfb58824d72_151_0.png)\n\n图 9.12：卸载窗口\n\n## 第 10\
    \ 章\n\n## 系统管理\n\n本章概述了 Red Hat Linux 系统。它将说明您可能不了解的系统特性，以及与其他 UNIX 系统略有不同的地方。请注意，大多数系统管理任务是通过控制面板执行的，这在第\
    \ 8 章中有详细介绍。\n\n### 10.1 文件系统结构\n\nRed Hat 软件致力于遵循 Linux 文件系统标准（Filesystem Standard），这是一份协作文档，定义了许多文件和目录的名称及位置。我们将继续跟踪该标准，以保持\
    \ Red Hat 的合规性。\n\n尽管合规意味着许多事情，但其中最重要的两点是与其他合规系统的兼容性，以及以只读方式挂载 */usr* 分区的能力。*/usr*\
    \ 分区包含公共可执行文件，并非旨在由用户修改。因此，*/usr* 分区可以从 CD-ROM 挂载，或通过只读 NFS 从另一台机器挂载。当前的 Linux\
    \ 文件系统标准（FSSTND）文档是任何符合 FSSTND 的文件系统的权威参考，但该标准在许多领域仍留有未定义或可扩展的空间。在本节中，我们提供了标准的概述，并描述了标准未涵盖的文件系统部分。\n\
    \n可以在以下地址查看完整标准：\n\nhttp://www.pathname.com/fhs/\n\n#### 10.1.1 FSSTND 概述\n\n\
    此处提到的目录和文件是 FSSTND 文档所规定内容的一个小子集。请查阅最新的 FSSTND 文档以获取最新且完整的信息。\n\n### /etc 目录\n\
    \n/etc 目录专门用于存放本机本地配置文件。切勿将二进制文件放入 /etc。过去曾放入 /etc 的二进制文件现在应放入 /sbin 或可能的 /bin。\n\
    \nX11 和 skel 目录应该是 /etc 的子目录：\n\n```text\n/etc\n | \\- X11\n +- skel\n```\n\n\
    X11 目录用于存放 X11 配置文件，例如 XF86Config。skel 目录用于存放“骨架”用户文件，这些文件用于在用户首次创建时填充主目录。\n\n\
    ### /lib 目录\n\n/lib 目录应仅包含执行 /bin 和 /sbin 中的二进制文件所需的库。\n\n### /sbin 目录\n\n/sbin\
    \ 目录用于存放仅由 root 用户使用的可执行文件，且仅限于启动和挂载 /usr 以及执行系统恢复操作所需的可执行文件。FSSTND 指出：\n\n> “/sbin\
    \ 通常包含除 /bin 中的二进制文件外，系统启动所必需的文件。任何在 /usr 已知挂载成功（即无异常）后执行的文件都应放置在 /usr/sbin。仅限本地的系统管理二进制文件应放置在\
    \ /usr/local/sbin。”\n\n至少，以下程序应位于 /sbin 中：\n\n```\nclock, getty, init, update,\
    \ mkswap, swapon, swapoff,\nhalt, reboot, shutdown, fdisk, fsck.*, mkfs.*, lilo,\n\
    arlp, ifconfig, route\n```\n\n### /usr 目录\n\n/usr 目录用于存放可在整个站点共享的文件。/usr 目录通常拥有独立的分区，且应可以以只读方式挂载。以下目录应为\
    \ /usr 的子目录：\n\n```\n/usr\n|- X11R6\n|- bin\n|- dict\n|- doc\n|- etc\n|- games\n\
    |- include\n|- info\n|- lib\n|- local\n|- man\n|- sbin\n|- share\n+- src\n```\n\
    \nX11R6 目录用于 X 窗口系统（在 Red Hat Linux 中为 XFree86），bin 用于可执行文件，doc 用于非手册页的随机文档，etc\
    \ 用于全站配置文件，include 用于 C 头文件，info 用于 GNU info 文件，lib 用于库，man 用于手册页，sbin 用于系统管理二进制文件（那些不属于\
    \ */sbin* 的文件），而 /src 用于源代码。\n\n### */usr/local* 目录\n\nFSSTND 指出：\n\n> “/usr/local\
    \ 层次结构供系统管理员在本地安装软件时使用。它需要在系统软件更新时免受覆盖。它可用于组内多台机器共享的程序和数据，但这些内容不出现在 /usr 中。”\n\
    \n/usr/local 目录的结构与 */usr* 目录类似。它包含以下子目录，其用途与 */usr* 目录中的子目录相似：\n\n```\n/usr/local\
    \ |- bin |- doc |- etc |- games |- include |- info |- lib |- man |- sbin +- src\n\
    ```\n\n### */var* 目录\n\n由于 FSSTND 要求能够以只读方式挂载 */usr*，因此任何需要写入日志文件或需要 spool（假脱机）/\
    \ lock（锁）目录的程序，很可能应将它们写入 /var 目录。FSSTND 指出 */var* 用于\n\n> “... 可变数据文件。这包括 spool\
    \ 目录和文件、管理和日志数据，以及临时和即时文件。”\n\n"
