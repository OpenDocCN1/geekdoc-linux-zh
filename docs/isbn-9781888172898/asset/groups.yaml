    \ file may not be “forward compatible” with the new configuration file in the\
    \ package, so RPM saved your original file, and installed a new one. You should\
    \ investigate and resolve the differences between the two files as soon as possible\
    \ to ensure that your system continues to function properly."
  md: "\n## 6.2. Help from the Internet Community\n\nYou can search the archives of\
    \ the redhat-list. Many questions have already been answered there.\n\nThe subscription\
    \ address for each of our lists is:\n\n```\nredhat-list-request@redhat.com\nredhat-digest-request@redhat.com\n\
    redhat-announce-list-request@redhat.com\nredhat-devel-list-request@redhat.com\n\
    rpm-list-request@redhat.com\naxp-list-request@redhat.com\nsparc-list-request@redhat.com\n\
    ```\n\nTo subscribe, send mail to the address of the list you want to subscribe\
    \ to with **subscribe** in the Subject: line.\n\nTo unsubscribe, send mail to\
    \ the address of the list you want to unsubscribe from with **unsubscribe** in\
    \ the Subject: line.\n\nThen to send mail to the list, you just send it to the\
    \ address above without the -request in the name. The only exception to this is\
    \ the **redhat-digest** which is only a digest version the **redhat-list**. In\
    \ that case the address is **redhat-list@redhat.com**.\n\n### 6.2.2 Usenet Newsgroups\n\
    \nAnother good source of help is the comp.os.linux hierarchy on USENET. If you\
    \ are familiar with news, you should check it out.\n\n## Chapter 7 Package Management\
    \ with RPM\n\nRed Hat Package Manager (RPM), is an open packaging system available\
    \ for anyone to use, and works on both Red Hat Linux as well as other Linux and\
    \ UNIX systems. Red Hat Software encourages other vendors to take the time to\
    \ look at RPM and use it for their own products. RPM is distributable under the\
    \ terms of the GPL.\n\nFor the end user, RPM provides many features that make\
    \ maintaining a system far easier than it has ever been. Installing, uninstalling,\
    \ and upgrading RPM packages are all one line commands, and all the messy details\
    \ are taken care of for you. RPM maintains a database of installed packages and\
    \ their files, which allows you to perform powerful queries and verification of\
    \ your system. During upgrades RPM handles configuration files specially, so that\
    \ you never lose your customizations - a feature that is impossible with straight\
    \ .tar.gz files.\n\nFor the developer, RPM allows you to take source code for\
    \ software and package it into source and binary packages for end users. This\
    \ process is quite simple and is driven from a single file and optional patches\
    \ that you create. This clear delineation of “pristine” sources and your patches\
    \ and build instructions eases the maintenance of the package as new versions\
    \ of the software are released.\n\nAt the time of this writing, a book is in the\
    \ works that fully documents RPM, including: building and using packages, configuring\
    \ RPM, using the RPM library in your programs, the RPM file format, and more.\
    \ For more information contact Red Hat Software or check our web page at http://www.redhat.com.\n\
    \n### 7.1 RPM Design Goals\n\nBefore trying to understand how to use RPM, it helps\
    \ to have an idea of what the design goals are.\n\n**Upgradability** With RPM\
    \ you can upgrade individual components of your system without completely reinstalling.\
    \ When you get a new release of an operating system based on RPM (such as Red\
    \ Hat Linux), you don't need to reinstall your machine (as you do with operating\
    \ systems based on other packaging systems). RPM allows intelligent, fully-automated,\
    \ in-place upgrades of your system. Configuration files in packages are preserved\
    \ across upgrades, so you won't lose your customizations.\n\n**Powerful Querying**\
    \ RPM is also designed to have powerful querying options. You can do searches\
    \ through your entire database for packages or just certain files. You can also\
    \ easily find out what package a file belongs to and where it came from. The files\
    \ an RPM package contains are in a compressed archive, with a custom binary header\
    \ containing useful information about the package and its contents, allowing you\
    \ to query individual packages quickly and easily.\n\n**System Verification**\
    \ Another powerful feature is the ability to verify packages. If you are worried\
    \ that you deleted an important file for some package, simply verify the package.\
    \ You will be notified of any anomalies. At that point, you can reinstall the\
    \ package if necessary. Any configuration files that you modified are preserved\
    \ during reinstatement.\n\n**Pristine Sources** A crucial design goal was to allow\
    \ the use of \"pristine\" software sources, as distributed by the original authors\
    \ of the software. With RPM, you have the pristine sources along with any patches\
    \ that were used, plus complete build instructions. This is a big advantage for\
    \ several reasons. For instance, if a new version of a program comes out, you\
    \ don’t necessarily have to start from scratch to get it to compile. You can look\
    \ at the patch to see what you *might* need to do. All the compiled-in defaults,\
    \ and all of the changes that were made to get the software to build properly\
    \ are easily visible this way. This goal may only seem important for developers,\
    \ but it results in higher quality software for end users too. We would like to\
    \ thank the folks from the BOGUS distribution for originating the pristine source\
    \ concept.\n\n### 7.2 Using RPM\n\nRPM has five basic modes of operation (not\
    \ counting package building): installing, uninstalling, upgrading, querying, and\
    \ verifying. This section contains an overview of each mode. For complete details\
    \ and options try `rpm --help`, and see the `rpm` man page and the (previously\
    \ mentioned) RPM book.\n\n#### 7.2.1 Installing\n\nRPM packages typically have\
    \ file names like `foo-1.0-1.i386.rpm`, which includes the package name (*foo*),\
    \ version (*1.0*), release (*1*), and architecture (*i386*). Installing a package\
    \ is as simple as:\n\n```\n$ rpm -ivh foo-1.0-1.i386.rpm\nfoo ##############################\n\
    ```\n\nAs you can see, RPM prints out the name of the package (which is not necessarily\
    \ the same as the file name, which could have been `1.rpm`), and then prints a\
    \ succession of hash marks as the package is installed, as a sort of progress\
    \ meter.\n\nInstalling packages is designed to be simple, but you can get a few\
    \ errors:\n\n**Package Already Installed**\n\nIf the package is already installed,\
    \ you will see:\n\n```\n$ rpm -ivh foo-1.0-1.i386.rpm\n    foo               \
    \               package foo-1.0-1 is already installed\n    error: foo-1.0-1.i386.rpm\
    \ cannot be installed\n```\n\nIf you really want to install the package anyway,\
    \ you can use `--replacepkgs` on the command line, which tells RPM to ignore the\
    \ error.\n\n**Conflicting Files**\n\nIf you attempt to install a package that\
    \ contains a file that has already been installed by another package, you'll see:\n\
    \n```\n# rpm -ivh foo-1.0-1.i386.rpm\n    /usr/bin/foo conflicts with file from\
    \ bar-1.0-1\n    error: foo-1.0-1.i386.rpm cannot be installed\n```\n\nTo cause\
    \ RPM to ignore that error, use `--replacefiles` on the command line.\n\n**Unresolved\
    \ Dependency**\n\nRPM packages can “depend” on other packages, which means that\
    \ they require other packages to be installed in order to run properly. If you\
    \ try to install a package for which there is such an unresolved dependency, you'll\
    \ see:\n\n```\n$ rpm -ivh bar-1.0-1.i386.rpm\n    failed dependencies:\n    foo\
    \ is needed by bar-1.0-1\n```\n\nTo handle this error you should install the requested\
    \ packages. If you want to force the installation anyway (a bad idea since the\
    \ package probably will not run correctly), use `--nodeps` on the command line.\n\
    \n#### 7.2.2 Uninstalling\n\nUninstalling a package is just as simple as installing:\n\
    \n```\n$ rpm -e foo\n```\n\nNotice that we used the package *name* “foo”, not\
    \ the name of the original package *file* “foo-1.0-1.i386.rpm”.\n\nYou can encounter\
    \ a dependency error when uninstalling a package if some other installed package\
    \ depends on the one you are trying to remove. For example:\n\n```\n$ rpm -e foo\n\
    \  removing these packages would break dependencies:\n      foo is needed by bar-1.0-1\n\
    ```\n\nTo cause RPM to ignore that error and uninstall the package anyway (which\
    \ is a bad idea since the package that depend on it will probably fail to work\
    \ properly), use --nodeps on the command line.\n\n#### 7.2.3 Upgrading\n\nUpgrading\
    \ a package is almost just like installing.\n\n```\n$ rpm -Uvh foo-2.0-1.i386.rpm\n\
    foo ########################################################################\n\
    ```\n\nWhat you don’t see above is the fact that RPM automatically uninstalled\
    \ any old versions of the **foo** package. In fact you may want to always use\
    \ -U to install packages, since it works fine even when there are no previous\
    \ versions of the package installed.\n\nSince RPM performs intelligent upgrading\
    \ of packages with configuration files, you may see a message like:\n\n```\nsaving\
    \ /etc/foo.conf as /etc/foo.conf.rpmnew\n```\n\nThis means that your changes to\
    \ the configuration file may not be “forward compatible” with the new configuration\
    \ file in the package, so RPM saved your original file, and installed a new one.\
    \ You should investigate and resolve the differences between the two files as\
    \ soon as possible to ensure that your system continues to function properly.\n"
  mdcn: "\n## 6.2. 来自互联网社区的帮助\n\n你可以搜索 redhat-list 的存档。许多问题在那里已经得到了解答。\n\n每个列表的订阅地址如下：\n\
    \n```\nredhat-list-request@redhat.com\nredhat-digest-request@redhat.com\nredhat-announce-list-request@redhat.com\n\
    redhat-devel-list-request@redhat.com\nrpm-list-request@redhat.com\naxp-list-request@redhat.com\n\
    sparc-list-request@redhat.com\n```\n\n若要订阅，请向你想订阅的列表地址发送电子邮件，并在 Subject: 行中包含\
    \ **subscribe**。\n\n若要取消订阅，请向你想取消订阅的列表地址发送电子邮件，并在 Subject: 行中包含 **unsubscribe**。\n\
    \n然后，若要向列表发送邮件，只需向上述地址（去掉名称中的 -request）发送即可。唯一的例外是 **redhat-digest**，它仅是 **redhat-list**\
    \ 的摘要版本。在这种情况下，地址为 **redhat-list@redhat.com**。\n\n### 6.2.2 Usenet 新闻组\n\n另一个良好的帮助来源是\
    \ USENET 上的 comp.os.linux 层次结构。如果你熟悉新闻组，应该去查看一下。\n\n## 第 7 章 使用 RPM 进行包管理\n\n\
    Red Hat Package Manager (RPM) 是一个可供任何人使用的开放打包系统，它既适用于 Red Hat Linux，也适用于其他 Linux\
    \ 和 UNIX 系统。Red Hat Software 鼓励其他厂商抽出时间研究 RPM，并用于其自己的产品。RPM 在 GPL 条款下可分发。\n\n\
    对于最终用户而言，RPM 提供了许多功能，使得系统维护比以往任何时候都更容易。安装、卸载和升级 RPM 包都是一行命令，所有繁琐的细节都会为你处理妥当。RPM\
    \ 维护着一个已安装包及其文件的数据库，允许你执行强大的查询和系统验证。在升级期间，RPM 会特别处理配置文件，因此你永远不会丢失自定义设置——这是直接使用\
    \ .tar.gz 文件无法实现的功能。\n\n对于开发者而言，RPM 允许你获取软件源代码，并将其打包成供最终用户使用的源包和二进制包。这个过程相当简单，由你创建的一个文件和可选的补丁驱动。这种对“原始”源代码与你的补丁及构建指令的明确划分，简化了在软件发布新版本时的包维护工作。\n\
    \n在撰写本文时，一本全面介绍 RPM 的书正在编写中，内容包括：构建和使用包、配置 RPM、在你的程序中使用 RPM 库、RPM 文件格式等更多细节。如需更多信息，请联系\
    \ Red Hat Software 或访问我们的网页 http://www.redhat.com。\n\n### 7.1 RPM 设计目标\n\n在尝试理解如何使用\
    \ RPM 之前，了解其设计目标会有所帮助。\n\n**可升级性** 使用 RPM，你可以升级系统的单个组件，而无需完全重新安装。当你获得基于 RPM 的操作系统（如\
    \ Red Hat Linux）的新版本时，不需要重新安装机器（像基于其他打包系统的操作系统那样）。RPM 允许对系统进行智能、全自动化、原位的升级。包中的配置文件在升级过程中得以保留，因此你不会丢失自定义设置。\n\
    \n**强大的查询功能** RPM 还设计有强大的查询选项。你可以搜索整个数据库中的包或特定文件。你还可以轻松找出某个文件属于哪个包及其来源。RPM 包包含的文件位于压缩归档中，并带有包含有关包及其内容有用信息的自定义二进制头部，这使得你能够快速轻松地查询单个包。\n\
    \n**系统验证** 另一个强大功能是能够验证包。如果你担心删除了某个包的重要文件，只需验证该包即可。任何异常都会通知你。此时，如有必要，你可以重新安装该包。重新安装期间，你修改的任何配置文件都会得到保留。\n\
    \n**原始源代码** 一个关键的设计目标是允许使用由软件原作者分发的“原始”软件源代码。使用 RPM，你不仅拥有原始源代码，还拥有使用过的所有补丁以及完整的构建指令。这在几个方面具有巨大优势。例如，当程序的新版本发布时，你不必从头开始才能使其编译通过。你可以查看补丁，了解你*可能*需要做什么。所有内置的默认设置以及为使软件正确构建而所做的所有更改，通过这种方式都清晰可见。这一目标看似仅对开发者重要，但它也为最终用户带来了更高质量的软件。我们要感谢\
    \ BOGUS 发行版中的人们开创了原始源代码的概念。\n\n### 7.2 使用 RPM\n\nRPM 有五种基本操作模式（不包括包构建）：安装、卸载、升级、查询和验证。本节概述了每种模式。如需完整详情和选项，请尝试\
    \ `rpm --help`，并参考 `rpm` 的手册页以及（前文提到的）RPM 书籍。\n\n#### 7.2.1 安装\n\nRPM 包的文件名通常类似于\
    \ `foo-1.0-1.i386.rpm`，其中包含包名称（*foo*）、版本（*1.0*）、发布版号（*1*）和架构（*i386*）。安装包非常简单：\n\
    \n```\n$ rpm -ivh foo-1.0-1.i386.rpm\nfoo ##############################\n```\n\
    \n如图所示，RPM 会打印出包名称（不一定与文件名相同，文件名可能是 `1.rpm`），然后在安装包的过程中打印一连串井号作为某种进度指示器。\n\n安装包的设计很简单，但可能会遇到一些错误：\n\
    \n**包已安装**\n\n如果包已安装，你将看到：\n\n```\n$ rpm -ivh foo-1.0-1.i386.rpm\n    foo    \
    \                          package foo-1.0-1 is already installed\n    error:\
    \ foo-1.0-1.i386.rpm cannot be installed\n```\n\n如果你确实想安装该包，可以在命令行中使用 `--replacepkgs`，这将指示\
    \ RPM 忽略该错误。\n\n**冲突文件**\n\n如果你尝试安装一个包含已由其他包安装的文件，你将看到：\n\n```\n# rpm -ivh foo-1.0-1.i386.rpm\n\
    \    /usr/bin/foo conflicts with file from bar-1.0-1\n    error: foo-1.0-1.i386.rpm\
    \ cannot be installed\n```\n\n若要使 RPM 忽略该错误，请在命令行中使用 `--replacefiles`。\n\n**未解析的依赖项**\n\
    \nRPM 包可以“依赖”其他包，这意味着它们需要安装其他包才能正常运行。如果你尝试安装一个存在此类未解析依赖项的包，你将看到：\n\n```\n$ rpm\
    \ -ivh bar-1.0-1.i386.rpm\n    failed dependencies:\n    foo is needed by bar-1.0-1\n\
    ```\n\n要处理此错误，你应该安装请求的包。如果你想无论如何强制安装（这是一个坏主意，因为该包可能无法正确运行），请在命令行中使用 `--nodeps`。\n\
    \n#### 7.2.2 卸载\n\n卸载包与安装一样简单：\n\n```\n$ rpm -e foo\n```\n\n注意，我们使用的是包*名称*“foo”，而不是原始包*文件*的名称“foo-1.0-1.i386.rpm”。\n\
    \n当其他已安装的包依赖于你试图删除的包时，你在卸载包时可能会遇到依赖项错误。例如：\n\n```\n$ rpm -e foo\n  removing these\
    \ packages would break dependencies:\n      foo is needed by bar-1.0-1\n```\n\n\
    若要使 RPM 忽略该错误并卸载该包（这是一个坏主意，因为依赖于该包的包可能会无法正常工作），请在命令行中使用 --nodeps。\n\n#### 7.2.3\
    \ 升级\n\n升级包几乎与安装相同。\n\n```\n$ rpm -Uvh foo-2.0-1.i386.rpm\nfoo ########################################################################\n\
    ```\n\n上述未显示的事实是，RPM 自动卸载了 **foo** 包的旧版本。实际上，你可能总是希望使用 -U 来安装包，因为即使没有安装该包的前版本，它也能正常工作。\n\
    \n由于 RPM 对包含配置文件的包进行智能升级，你可能会看到类似以下的消息：\n\n```\nsaving /etc/foo.conf as /etc/foo.conf.rpmnew\n\
    ```\n\n这意味着你对配置文件的修改可能与包中的新配置文件不“向前兼容”，因此 RPM 保存了你的原始文件，并安装了一个新文件。你应该尽快检查并解决这两个文件之间的差异，以确保系统继续正常运行。\n\
    \n"
