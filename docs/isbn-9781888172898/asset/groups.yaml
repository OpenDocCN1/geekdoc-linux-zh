    ## E.2.4 How do I order from Red Hat Software?


    - Via the Web: `http://www.redhat.com`

    - Via email: `sales@redhat.com`

    - Via fax: +1-919-572-6726

    - Via telephone (toll-free): +1-888-RED-HAT1

    - Via telephone (toll call): +1-919-572-6500


    ## E.2.5 How do I contact Red Hat Software?


    Red Hat Software

    3205 Yortown Ave., Suite 123

