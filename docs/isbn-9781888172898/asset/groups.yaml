  mdcn: "\n\n由于升级实际上是卸载和安装的组合，你可能会遇到这些模式中的任何错误，外加一个额外错误：如果 RPM 认为你试图升级到版本号*较旧*的软件包，你将看到：\n\
    \n```\n$ rpm -Uvh foo-1.0-1.i386.rpm\n  foo     package foo-2.0-1 (which is newer)\
    \ is already installed\n  error: foo-1.0-1.i386.rpm cannot be installed\n```\n\
    \n若要强制 RPM 进行“升级”，请在命令行中使用 `--oldpackage`。\n\n### 7.2.4 查询\n\n通过 `rpm -q` 可以查询已安装软件包的数据库。一个简单的用法是\
    \ `rpm -q foo`，它将打印已安装软件包 `foo` 的软件包名称、版本和发行号：\n\n```\n$ rpm -q foo\nrpm-2.0-1\n\
    ```\n\n除了指定软件包名称外，你还可以使用以下选项配合 `-Q` 来指定要查询的软件包。这些被称为*软件包指定选项*。\n\n- `-a` 查询所有当前已安装的软件包。\n\
    - `-f <文件>` 查询拥有 <file> 的软件包。\n- `-F` 与 `-f` 相同，但通过标准输入（stdin）获取文件名（例如 `find /usr/bin\
    \ | rpm -qf`）。\n- `-p <软件包文件>` 查询软件包 <packagefile>。\n- `-P` 类似于 `-p`，但通过标准输入获取软件包文件名（例如\
    \ `find /mnt/cdrom/RedHat/RPMS | rpm -qP`）。\n\n有多种方式可以指定要显示关于被查询软件包的哪些信息。以下选项用于选择你感兴趣的信息。这些被称为*信息选择选项*。\n\
    \n- `-i` 显示软件包信息，如名称、描述、发行版、大小、构建日期、安装日期、供应商以及其他杂项信息。\n- `-l` 显示软件包“拥有”的文件列表。\n\
    - `-s` 显示软件包中所有文件的状态。只有两种可能的状态：正常和缺失。\n- `-d` 显示标记为文档的文件列表（手册页、info 页、README 等）。\n\
    - `-c` 显示标记为配置文件列表。这些是你安装后修改以适应用户系统的文件（如 sendmail.cf, passwd, inittab 等）。\n\n\
    对于显示文件列表的那些选项，你可以添加 `-v` 到命令行中，以熟悉的 `ls -l` 格式获取列表。\n\n### 7.2.5 验证\n\n软件包验证通过比较从软件包安装的文件信息与原始软件包中的相同信息来进行。除此之外，验证还比较每个文件的大小、MD5\
    \ 校验和、权限、类型、所有者和组。\n\n`rpm -V` 用于验证软件包。你可以使用查询时列出的任何*软件包选择选项*来指定要验证的软件包。一个简单的用法是\
    \ `rpm -V foo`，它验证 foo 软件包中的所有文件是否与其最初安装时保持一致。例如：\n\n- 要验证包含特定文件的软件包：\n  `rpm\
    \ -Vf /bin/vi`\n- 要验证*所有*已安装的软件包：\n  `rpm -Va`\n- 要根据 RPM 软件包文件验证已安装的软件包：\n  `rpm\
    \ -Vp foo-1.0-1.i386.rpm`\n\n如果你怀疑你的 RPM 数据库已损坏，这将非常有用。\n\n如果所有验证都正常，则不会有输出。如果有任何差异，它们将被显示。输出的格式是\
    \ 8 个字符的字符串，可能包含表示配置文件的 \"c\"，然后是文件名。8 个字符中的每一个表示将文件的某个属性与 RPM 数据库中记录该属性的值进行比较的结果。单个\
    \ \".\"（点）表示测试通过。以下字符表示某些测试失败：\n\n- `5` MD5 校验和\n- `S` 文件大小\n- `L` 符号链接\n- `T`\
    \ 文件修改时间\n- `D` 设备\n- `U` 用户\n- `G` 组\n- `M` 模式（包括权限和文件类型）\n\n如果你看到任何输出，请根据你的最佳判断决定你是应该移除还是重新安装该软件包，或者以其他方式修复问题。\n\
    \n## 7.3 使用 RPM 让朋友印象深刻\n\nRPM 是一个非常有用的工具，既用于管理系统，也用于诊断和修复问题。理解所有选项的最好方法是查看一些示例。\n\
    \n- 假设你意外删除了一些文件，但不确定删除了什么。如果你想验证整个系统并查看可能缺失的内容，你可以输入：\n\n  `rpm -Va`\n\n  如果某些文件缺失或看似已损坏，你可能应该重新安装该软件包，或者先卸载再重新安装该软件包。\n\
    \n- 假设你遇到了一个不熟悉的文件。要查看哪个软件包拥有它，你可以输入：\n\n  `rpm -qf /usr/X11R6/bin/xjewel`\n\n\
    \  输出将如下所示：\n\n  `xjewel-1.6-1`\n\n- 我们可以将上述两个例子结合在以下场景中。假设你在 /usr/bin/paste 上遇到了问题。你想验证拥有该程序的软件包，但不知道该软件包是哪个。只需输入：\n\
    \n  `rpm -Vf /usr/bin/paste`\n\n  相应的软件包将被验证。\n\n- 如果你正在使用某个程序并希望了解有关该程序的更多信息，可以输入以下内容以查看“拥有”该程序的软件包附带了哪些文档（在本例中是\
    \ ispell）：\n\n  `rpm -qdf /usr/bin/ispell`\n\n  输出将是：\n\n  /usr/man/man4/ispell.4\n\
    \  /usr/man/man4/english.4\n  /usr/man/man1/unsq.1\n  /usr/man/man1/tryaffix.1\n\
    \  /usr/man/man1/sq.1\n  /usr/man/man1/munchlist.1\n  /usr/man/man1/ispell.1\n\
    \  /usr/man/man1/findaffix.1\n  /usr/man/man1/buildhash.1\n  /usr/info/ispell.info.gz\n\
    \  /usr/doc/ispell-3.1.18-1/README\n\n- 你发现了新的 koules RPM，但你不知道它是什么。要了解有关它的一些信息，请输入：\n\
    \n  `rpm -qip koules-1.2-2.i386.rpm`\n\n  输出将是：\n\n  | 字段       | 值 |\n  | :---------\
    \ | :---- |\n  | 名称       | koules |\n  | 版本       | 1.2 |\n  | 发行号     | 2 |\n\
    \  | 安装日期   | (无) |\n  | 组         | Games |\n  | 大小       | 614939 |\n  | 摘要\
