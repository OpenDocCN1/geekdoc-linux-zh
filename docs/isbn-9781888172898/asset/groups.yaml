    \ Red Hat Linux CD 和一块启动软盘，您需要一个受支持的 CD-ROM 驱动器以及机器上的 3.5 英寸软盘驱动器或可运行的 MS-DOS\
    \ 安装环境，以便运行安装实用程序。如果 CD 中未附带启动软盘，您需要访问一台运行 Linux 或 MS-DOS 的计算机，以便从 CD 创建启动软盘。\n\
    \n**NFS** 如果您希望通过网络安装，您需要在一台支持带有 Rock Ridge 扩展的 ISO-9660 文件系统的机器上挂载 Red Hat Linux\
    \ CD-ROM。该机器还必须支持 NFS。通过 NFS 导出 CD-ROM 文件系统。您需要配置名称服务，或者知道 NFS 服务器的 IP 地址，以及导出\
    \ CD-ROM 的路径。\n\n**FTP** 对于 FTP 安装，您必须拥有启动盘和辅助盘。您需要配置有效的名称服务器，或者知道您将要使用的 FTP 服务器的\
    \ IP 地址。您还需要知道 FTP 站点上 Red Hat Linux 目录根目录的路径。\n\n**SMB 共享卷** 如果您希望从 SMB 共享卷安装，您需要在一台支持共享卷的\
    \ Microsoft Windows NT 或 Windows 95 服务器上挂载 Red Hat Linux CD-ROM。您需要配置名称服务，或者知道服务器的\
    \ IP 地址；您还需要包含 Red Hat Linux CD-ROM 的共享卷的名称，以及访问该卷所需的账户号和密码。\n\n**硬盘** 要从硬盘安装\
    \ Red Hat Linux，您需要与 FTP 安装使用的相同的启动盘和辅助盘。您必须首先在目录树的顶层创建一个 RedHat 目录。您将要安装的所有内容都应放在该目录中。首先复制\
    \ base 子目录，然后复制您想要安装的程序包到一个名为 RPMs 的另一子目录中。您可以使用现有 DOS 分区上的可用空间，或者在安装过程中不需要使用的\
    \ Linux 分区（例如，将用于已安装系统数据存储的分区）。\n\n如果您使用的是 DOS 文件系统，您可能无法使用 RPM 程序包的完整 Linux 文件名。安装过程不关心文件名的样子，但建议您记录它们，以便知道您正在安装什么。\n\
    \n**PCMCIA** 如果您的 CD-ROM、网卡或本地硬盘连接到 PCMCIA 适配器，您必须使用支持 PCMCIA 的方式进行安装。您需要受支持的\
    \ PCMCIA 控制器以及受支持的 PCMCIA SCSI 适配器或网卡。通过 PCMCIA 安装需要使用辅助软盘。\n\n#### 2.2.2 关于内核驱动程序的说明\n\
    \n在 Red Hat Linux 安装过程中，内核对支持的文件系统和其他驱动程序有一些限制。然而，安装完成后，Linux 下可用的所有文件系统都得到支持。安装时，模块化内核支持\
    \ (E)IDE 设备（包括 ATAPI CD-ROM 驱动器）、SCSI 适配器和网卡。此外，支持所有鼠标、SLIP、CSLIP、PPP、PLIP、FPU\
    \ 仿真、控制台选择、ELF、SysV IPC、IP 转发、防火墙和记账、反向 ARP、QIC 磁带和并行打印机。\n\n安装完成后，您可能希望重新构建一个仅支持您硬件的内核。有关如何构建自定义内核的信息，请参阅第\
    \ 5 章第 5.1 节。\n\n#### 2.2.3 磁盘分区\n\n要安装 Red Hat Linux，必须为其提供可用的磁盘空间以“居住”。该磁盘空间需要与您计算机上安装的其他操作系统（例如\
    \ MS-DOS、OS/2、其他版本的 Linux，或另一个我们不便明说的知名操作系统）使用的磁盘空间分开。通过将其划分为*分区*来提供可用磁盘空间。\n\n\
    您可能希望将 Red Hat Linux 安装在其自己的硬盘上，或者甚至安装在一台不包含其他操作系统的计算机上。在这种情况下，您可以使用 Red Hat Linux\
    \ 安装系统来创建所需的磁盘分区。\n\n或者，您可能希望将 Red Hat Linux 安装在一个已经包含来自不同操作系统的软件或数据的磁盘上；创建所需磁盘分区的方法取决于存在其他哪种操作系统。\n\
    \n"
