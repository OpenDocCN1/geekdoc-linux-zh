    # 2.4.17 Configuring the Clock


    Next, the installation program presents a dialog to help you configure your Red
    Hat Linux system''s timezone.


    If you wish to set the hardware (CMOS) clock to GMT (Greenwich Mean Time, also
    known as UTC, or Coordinated Universal Time), select **Hard-**

    **ware clock set to GMT**. Setting your hardware clock to GMT means your Red Hat
    Linux system will properly handle daylight savings time, if your timezone uses
    it. Most networks use GMT.


    Select the timezone your system will be operating in from the list, and press
    `Enter`.


    If you wish to change your timezone configuration after you have booted your Red
    Hat Linux system, you may use the `/usr/sbin/timeconfig` command.


    # 2.4.18 Setting a Root Password


    After you have set up your system''s timezone, the installation program prompts
    you to set a *root password* for your system; this is the password you will use
    to log into your Red Hat Linux system for the first time.


    The root password must be at least six characters long; the password you type
    is not echoed to the screen. You must enter the password twice; if the two passwords
    do not match, the installation program will ask you to enter them again.


    You ought to make the root password something you can remember, but not something
    that is easy for someone else to guess. Your name, your phone number, `qwerty`,
    `password`, `root`, `123456`, and `anteater` are all examples of poor passwords.
    Good passwords mix numerals with upper and lower case letters and do not contain
    dictionary words: `Aard387vark` or `420BtttTNT`, for example. Remember that the
    password is case-sensitive. Write down this password and keep it in a secure place.


    **Please Note:** The *root* user (also known as the *superuser*) has complete
    access to the entire system; for this reason, logging in as the root user is best
    done only to perform system maintenance or administration, so that critical system
    files are not inadvertently changed, moved, or deleted. Please see'
