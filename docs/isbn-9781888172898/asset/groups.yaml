    +   * BITMAP\_BIT\_ORDER

    +   * IMAGE\_BYTE\_ORDER

    +   * GLYPHPADBYTES

    +   * BITMAP\_SCANLINE\_UNIT


    For example, to read SCO SNF fonts, add this line to the `Xconfig` file:


    ```

    SnfFormat 1 0 1 1

    ```


    Or, to read SNF fonts compatible with X11 R4 from Interactive Systems Corporation,
    add this line to the `Xconfig` file:


    ```

    SnfFormat 1 1 4 4

    ```


    **Terminate** Terminate causes the server to exit when the last client disconnects.
    Normally xinit kills the X server when the last client disconnects, before the
    server can reset.


    **Trace <number>** This prints additional debugging information.


    **VideoRam <number>** This specifies the amount of video memory on the graphics
