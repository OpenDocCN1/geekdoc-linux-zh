    *Section 2.3, Preparing to Install*, tells how to create installation floppies
    (if were not included with your copy of Red Hat Linux) and explains how to use
    the installation program.


    *Section 2.4, Step-By-Step Installation*, gives step-by-step instructions for
    completing the entire installation or upgrade process.


    # 2.1 The Red Hat Linux Errata


    Occasionally, we discover problems with a release of Red Hat Linux, some of which
