    ```


    ### 3.6.2 开始安装


    内核启动后，它会提示输入 ramdisk。将 ramdisk 软盘插入软驱并按回车键。


    ### 3.6.3 Linux/Alpha 特有问题


    **磁盘分区**


    Red Hat Linux/Alpha 支持两种硬盘分区方式：


    -   **标准 fdisk 风格分区：** 这种方式具有常见的特性（例如扩展分区），操作方式与 Intel 平台相同（使用 Linux fdisk）。如果你使用的是
    ARC 控制台，则必须使用这种分区方式。

    -   **BSD 风格磁盘标签：** 在带有磁盘标签的硬盘上，通常将第一个分区作为交换分区。除非绝对必要，否则我们不建议使用 BSD 磁盘标签。


    **XFree86 和 TGA**


    如果你拥有配备 TGA 显卡的 Alpha 计算机并选择安装 XFree86，安装程序会提示你选择显卡。请选择未列出的服务器（Unlisted Server）；安装程序将显示可用服务器列表。请选择
