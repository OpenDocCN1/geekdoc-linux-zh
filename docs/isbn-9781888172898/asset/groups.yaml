    ![](img/06353bca937b38b02602dcfb58824d72_158_0.png)\n\n### 10.3.2 Standard Groups\n\
    \nTable 10.3.2 lists the standard groups as set up by the installation process\
    \ (this is essentially the *etc/group* file).\n\n| Group | GID | Members |\n|\
    \ :--- | :--- | :--- |\n| root | 0 | root |\n| bin | 1 | root,bin,daemon |\n|\
    \ daemon | 2 | root,bin,daemon |\n| sys | 3 | root,bin,adm |\n| adm | 4 | root,adm,daemon\
    \ |\n| tty | 5 | |\n| disk | 6 | root |\n| lp | 7 | daemon,lp |\n| mem | 8 | |\n\
    | kmem | 9 | |\n| wheel | 10 | root |\n| mail | 12 | mail |\n| news | 13 | news\
    \ |\n| uucp | 14 | uucp |\n| man | 15 | |\n| games | 20 | |\n| gopher | 30 | |\n\
    | dip | 40 | |\n| ftp | 50 | ftp |\n| nobody | 99 | |\n| users | 100 | |\n\nFigure\
    \ 10.2: Standard Groups\n\n### 10.3.3 User Private Groups\n\nRed Hat Linux uses\
    \ a user private group (UPG) scheme, which makes UNIX groups much easier to use.\
    \ The UPG scheme does not add or change anything in the standard UNIX way of handling\
    \ groups. It simply offers a new convention for handling groups. Whenever you\
    \ create a new user, by default, he or she has a unique group. The scheme works\
    \ as follows:\n\n- **User Private Group** Each user has it's own primary group,\
    \ to which only it is a member.\n\n- **umask = 002** The traditional UNIX umask\
    \ is 022, which prevents other users and *other members of a user’s primary group*\
    \ from modifying a user’s files. Since every user has their own private group\
    \ in the UPG scheme, this “group protection” is not needed. An umask of 002 will\
    \ prevent users from modifying other users’ private files. The umask is set in\
    \ /etc/profile.\n\n- **SGID bit on Directories** If you set the SGID bit on a\
    \ directory (with *chmod g+s directory*), files created in that directory will\
    \ have their group set to the directory’s group.\n\nMost computing sites like\
    \ to create a group for each major project and assign people to the groups they\
    \ need to be in. Managing files traditionally has been difficult, though, because\
    \ when someone creates a file it is owned by the primary group he or she belongs\
    \ to. When a single person works on multiple projects, it becomes hard to make\
    \ the files owned by the group that is associated with that project. In the UPG\
    \ scheme, groups are automatically assigned to files on a project-by-project basis,\
    \ which makes managing group projects very simple.\n\nLet’s say you have a big\
    \ project called *devel*, with many people editing the devel files in a *devel*\
    \ directory. Make a group called *devel*, *chgrp* the *devel* directory to *devel*,\
    \ and add the all the devel users to the *devel* group. Now, all the devel users\
    \ will be able to edit the devel files and create new files in the *devel* directory,\
    \ and these files will always retain their *devel* group. Thus, they will always\
    \ be edit-able by other devel users.\n\nIf you have multiple projects like *devel*,\
    \ and users who are working on multiple projects, these users will never have\
    \ to change their umask or group when they move from project to project. The SGID\
    \ bit on each project’s main directory “selects” the proper group.\n\nSince each\
    \ user’s HOME directory is owned by the user and their private group, it is safe\
    \ to set the SGID bit on the HOME directory. However, by default, files are created\
    \ with the primary group of the user, so the SGID bit would be redundant.\n\n\
    ### User Private Group Rationale\n\nSince the UPG scheme is new, many people have\
    \ questions about it, and they wonder why it is necessary. The following is the\
    \ rationale for the scheme.\n\n- You’d like to have a group of people work on\
    \ a set of files in say, the /usr/lib/emacs/site-lisp directory. You trust a few\
    \ people to mess around in there, but certainly not everyone.\n- So you enter:\n\
    \  ```\n  chown -R root.emacs /usr/lib/emacs/site-lisp\n  ```\n  and you add the\
    \ proper users to the group.\n- To allow the users to actually create files in\
    \ the directory you enter:\n  ```\n  chmod 775 /usr/lib/emacs/site-lisp\n  ```\n\
    - But when a user creates a new file it is assigned the group of the users default\
    \ group (usually users). To prevent this you enter\n  ```\n  chmod 2775 /usr/lib/emacs/site-lisp\n\
    \  ```\n  which causes everything in the directory to be created with the “emacs”\
    \ group.\n- But the new file needs to be mode 664 for another user in the emacs\
    \ group to be able to edit it. To do this you make the default umask 002.\n- Well,\
    \ this all works fine, except that if your default group is “users”, every file\
    \ you create in your home directory will be writable by everybody in “users” (usually\
    \ everyone).\n- To fix this, you make each user have a “private group” as their\
    \ default group.\n\nAt this point, by making the default umask 002 and giving\
    \ everyone a private default group, you can easily set up groups that users can\
    \ take advantage of without doing any magic. Just create the group, add the users,\
    \ and do the above chown and chmod on the group’s directories.\n"
