  - "[PAGE 213]\n\n+   - Noname (Section D.5.7)\n+   - AlphaPC64 (Section D.5.7)\n\
    +   - EB164 (Section D.5.7)\n+   - PC164 (Section D.5.7)\n\n# D.5.7 System Specific\
    \ Information\n\n**AxpPC133 (Noname)**\n\nThe Noname board can load MILO from\
    \ the Windows NT ARC firmware (Section D.5.1), from the SRM Console (Section D.5.6).\
    \ and from a failsafe boot block floppy (Section D.5.4). A flash management utility,\
    \ runnable from MILO is available so that once MILO is running, it can be blown\
    \ into flash (Section D.7). However, be warned that once you have done this you\
    \ will lose the previous image held there as there is only room for one image.\n\
    \nThe way that Noname boots is controlled by a set of jumpers on the board, J29\
    \ and J28. These look like:\n\n```\n```text\n       4\nJ29    2 x x x 6\n    \
    \   1 x x x 5\n\nJ28    2 x x x 6\n       1 x x x 5\n       3\n```\n```\n\nThe\
    \ two options that we're interested in are J28, pins 1-3 which boots the console/loader\
    \ from flash and J29, pins 1-3 which boots the console/loader from a boot block\
    \ floppy. The second option is the one that you need to first boot MILO on the\
    \ Noname board.\n\nOnce you've selected the boot from floppy option via the jumpers,\
    \ put the SRM boot block floppy containing MILO into the floppy and reboot. In\
    \ a few seconds (after the floppy light goes out) you should see the screen blank\
    \ to white and MILO telling you what's going on.\n\nIf you are really interested\
    \ in technical stuff, the Noname loads images off of the floppy into physical\
    \ address 0x104000 and images from flash into"
  - '[PAGE 214]


    # D.5.  **HOW TO LOAD MILO**


    0x100000. For this reason, MILO is built with its PALcode starting at 0x200000.
    When it is first loaded, it moves itself to the correct location (see relocate.S).


    # AlphaPC64 (CabrioleT)


    The AlphaPC64 includes the Windows NT ARC firmware (Section D.5.1), the SRM Console
    (Section D.5.6) and the Evaluation Debug Monitor (Section D.5.3). These images
    are in flash and there is room to add MILO so that you can boot MILO directly
    from flash. A flash management utility, runnable from MILO is available so that
    once MILO is running, it can be blown into flash (Section D.7). This system supports
    MILO environment variables.


    You select between the boot options (and MILO when it is been put into flash)
    using a combination of jumpers and a boot option which is saved in the NVRAM of
    the TOY clock.


    The jumper is J2, SP bits 6 and 7 have the following meanings:


    +   - SP bit 6 should always be out. If this jumper is set then the SROM mini-debugger
    gets booted.

    +   - SP bit 7 in is boot image selected by the boot option byte in the TOY clock.

    +   - SP bit 7 out is boot first image in flash.


    So, with bit 7 out, the Debug Monitor will be booted as it is always the first
    image in flash. With bit 7 in, the image selected by the boot option in the TOY
    clock will be selected. The Debug Monitor, the Windows NT ARC firmware and MILO
    all support setting this boot option byte but you must be very careful using it.
    In particular, you cannot set the boot option so that next time the system boots
    MILO when you are running the Windows NT ARC firmware, it only allows you to set
    Debug Monitor or Windows NT ARC as boot options.


    To get MILO into flash via the Evaluation Board Debug Monitor, you will need a
    flashable image. The build procedures make MILO.rom, but you can also make a rom
    image using the makerom tool in the Debug Monitor software that comes with the
    board:'
  - '[PAGE 215]


    > mak erom -v -i7 -1200000 MILO -o mini. flash


    (type mak erom to find out what the arguments mean, but 7 is a flash image id
    used by the srom and -1200000 gives the load address for the image as 0x200000).


    Load that image into memory (via the Debug Monitor commands fload, netload, and
    so on) at 0x200000 and then blow the image into flash:


    ```

