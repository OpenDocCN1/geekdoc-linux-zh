    同样来自麻省理工学院（MIT），但与自由软件基金会（FSF）无关的是 X 联合体（X Consortium），这是一个由 Unix 行业赞助发起的项目，旨在构建和维护
    X 窗口系统。在此基础上，一个名为 XFree86 项目组（XFree86 Project）的团体承担了将 X 窗口系统移植到 Intel 平台的职责。为了您的方便，我们在此手册的附录中包含了这些许可证的副本。得益于这种全球范围的开发努力，Linux
    正在非常迅速地进步，我们鼓励您和您所在的公司或学校为这一努力做出贡献。


    ## F.3 GNU 通用公共许可证


    Red Hat Software, Inc. 选择将其代码在 GPL 下授权，有两个原因。一个是这样做最省事，因为 Linux 内核就是以此方式授权的，且我们的代码与其他
    GPL 授权的代码有充分的交互，使得任何其他授权方案都难以实施。另一个原因是，就协作开发而言，我们真诚地认为 GPL 实际上是最有效的许可格式。


    GPL 的目的与任何标准版权许可证类似，旨在定义你可以如何使用该产品以及哪些用途是被禁止的。然而，它与商业许可证有着显著的不同，因为它的目的不是限制你软件的使用，而是*保证*你对软件的使用。


    它以任何方式都不限制在 Linux 或其他 GPL 代码上使用标准的商业授权软件。只有你对那些“借自”他人的、且基于 GPL 授权的代码所做出的更改，必须按照
    GPL 定义的那些无限制规则向其他人提供。任何仅使用或在 Linux 之上运行的产品，都可以采用你选择的任何商业规则进行授权。


    有许多领先的商业软件开发者积极支持其在 Linux 上运行的商业产品，这些产品需要购买许可证，例如 OSF 的 Motif、Empress Software
    的 Empress RDBMS、WordPerfect，以及最近的 Applix Inc. 和 Red Hat Software 推出的 Office 套件
    Applixware。你可以在第 G 节找到 GPL 的完整副本。


    ## F.4 Linux 会取代商业操作系统吗？


    Linux 操作系统巨大的开发投入和广泛的分发将确保它作为一个真实、可行且重要的商业受限操作系统的替代方案占据其地位。开放的开发模式、源代码的可用性以及缺乏许可证限制，是
    Linux 操作系统的“特性”，而商业操作系统开发者根本无法提供这些。需要这种模式的软件开发团队包括从政府附属研究机构、学术研究和教学项目，到商业软件应用开发者。


    近年来，新的 Linux 应用数量快速增长，以及这些技术的用户群迅速扩大，导致甚至最大的计算机行业组织也开始认真对待 Linux。即使是 Data-pro（一家
    McGraw-Hill 公司）在其 1996 年 UNIX 行业调查中得出结论：“程序员们正在仔细审视 Linux 在生产平台上的可行性，因为现在的 Linux
    成本比微软低，并具备 UNIX 的额外优势，如出色的性能、固有的强大工具集以及通信能力”。


    Linux、FSF 的 GNU 代码以及其他“可自由分发”软件所代表的新分发和开发模式，是一个已经成功与旧的商业受限模式竞争的新模式。对于您成为这些技术的一部分，我们感到很高兴，这些技术拥有令人兴奋的未来。


    ## F.5 Red Hat Software, Inc. 在 Linux 开发中的角色


    Red Hat Linux 发行版也是基于 GPL 发布的。我们将自己的角色定位为让 Linux 操作系统对于专业开发者、系统管理员和学生来说易于安装、配置和维护。Red
    Hat Linux 可以在互联网上的许多 ftp 站点免费获取，且几乎没有限制（请参阅 GPL）。它也可以通过 Red Hat Software 的 CD
    获取，访问 http://www.redhat.com 或致电 (919) 572-6500，也可以从大多数 Linux 档案 CD 供应商处购买。


    Red Hat Software, Inc. 为 Linux 操作系统用户提供支持，从运行单个工作站的个人到运行数百台联网机器的大型组织，通过各种项目形式提供支持。


    我们要感谢来自 Linux 开发社区的支持，包括 Linus Torvalds、Linux 贡献者列表上的所有人，以及数以千计的其他开发者，是他们帮助 Linux
    成为了今天这样成功的产品。我们还要感谢商业开发者对我们努力所做的日益增长的贡献，包括 Digital Equipment Corporation、O''Reilly
    & Associates、Metro Linux Inc 以及许多其他公司。我们鼓励您使用 Red Hat 的 Linux 发行版，开发并添加功能，或者简单地打包您需要的或认为其他人会欣赏的程序。如果您需要任何帮助，请毫不犹豫地联系我们。


    您可以直接联系 Red Hat Software：info@redhat.com。


    ## F.6 延伸阅读


    关于可用于 Linux 的自由分发软件和商业软件的基于互联网的列表，可以在诸如《Linux 期刊》（Linux Journal）、《商业 HOWTO》（Commercial
    HOWTO）、《Linux 软件地图》（Linux Software Map）以及许多 Linux 供应商（包括 Red Hat Software 的零售部门）的文件中找到。许多第三方和商业产品可以通过
    Red Hat 的网站购买，包括 Motif、数据库开发系统、编辑器等。您可以致电 (919) 572-6726 发送传真请求以获取信息，网站位于 http://www.redhat.com。


    有关 Linux 的更多信息，请参见：


