    \n## 10\n如果您希望将程序的部分纳入其他分发条件不同的自由程序，请写信给作者请求许可。对于由自由软件基金会拥有版权的软件，请写信给自由软件基金会；我们有时会对这种情况做出例外处理。我们的决定将由两个目标指导：保护我们所有自由软件衍生物的自由状态，以及促进软件的一般共享和重用。\n\
