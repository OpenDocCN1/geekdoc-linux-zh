    以太网以及 NCR 810 SCSI 磁盘、软驱、2 个串行端口和一个并行端口。由于其紧凑的尺寸，其扩展能力有限（仅有一个 PCI 插槽）。（关于何时可以使用
    PCI 插槽存在一些限制，但我不记得具体是什么了。）请注意，也有基于 21066A 和 Pentium 的 Multia 版本。


    DEC PC 150 AXP（又称 Jensen）：这是一台非常古老的 Digital 系统——属于第一代 Alpha 系统之一。之所以在此提及，是因为二手市场上似乎有不少这类系统。Jensen
    是一个落地式塔式系统，使用了 150MHz 的 21064（后来的版本使用了更快的 CPU，但我不确定具体频率）。它使用可编程逻辑将 486 EISA I/O
    桥接器与 CPU 进行接口连接。


    其他 21064(A) 系统：大约有 3 或 4 种主板设计（这里不包括 *Digital* 的系统），我所知道的所有设计都源自 EB64+。它们包括：


    - EB64+（一些供应商对主板进行封装并以未修改的状态出售）；AT 外形规格。

    - Aspen Systems 主板：EB64+ 的衍生版本；小 AT（baby-AT）外形规格。

    - Aspen Systems 服务器板：拥有多个 PCI 插槽（包括 PCI 桥接器）。

    - AlphaPC64（又称 Cabrilot），小 AT 外形规格。


    其他 21164(A) 系统：我知道的唯一一个不仅仅只是 EB164 克隆的系统是由 DeskStation 制造的。该系统使用了 Desk Station
    专有的内存和 I/O 控制器。我不知道他们对 Linux 的态度如何。


    ## C.8 字节及相关事项


    当 Alpha 架构引入时，它在 RISC 架构中独树一帜，摒弃了 8 位和 16 位的加载和存储操作。它支持 32 位和 64 位的加载和存储（在 Digital
    的术语中称为长字和四字）。共同架构师（Dick Sites、Rich Witek）通过引用以下优势来证明这一决定的合理性：


    - 在缓存和内存子系统中支持字节往往会导致 32 位和 64 位数据的访问速度变慢。

    - 字节支持使得在缓存/内存子系统中构建高速纠错电路变得困难。


    Alpha 通过提供强大的指令来操纵 64 位寄存器内的字节和字节组来进行补偿。字符串操作的标准基准测试（例如某些字节基准测试）表明，Alpha 在字节操作方面表现非常出色。


    缺乏字节加载和存储指令会影响某些软件信号量，并影响 I/O 子系统的设计。Digital 解决 I/O 问题的方法是使用一些低位地址线在 I/O 传输期间指定数据大小，并将这些线解码为字节使能。这种所谓的稀疏寻址会浪费地址空间，并导致
    I/O 空间不连续（等我着手撰写相关内容时，会详细介绍稀疏寻址的复杂性）。请注意，在此上下文中，I/O 空间指存在于 PCI 总线上的所有系统资源，因此既包括
    PCI 内存空间，也包括 PCI I/O 空间。


    随着 21164A 的引入，Alpha 架构通过工程变更订单（ECO）增加了字节寻址支持。在较早的 CPU 上执行这些新指令会引发 OPDEC PALcode
    异常，以便 PALcode 处理该访问。这会产生性能影响。其影响是，使用这些新指令（在我看来）应仅限于设备驱动程序，而不是应用程序代码。


    这些新的字节加载和存储意味着未来的支持芯片组将能够支持连续的 I/O 空间。


    ## C.9 PALcode 及相关事项


    这是一个关于解释 PALCode 的章节占位符。如果有足够的兴趣，我会编写这部分内容。


    ## C.10 移植


    任何基于 Alpha 的机器运行 Linux 的能力实际上只受限于你获取其内部细节信息的能力。既然已经有针对 E66、EB64+ 和 EB164 主板的 Linux
    移植版本，那么所有基于 21066、21064/APECS 或 21164/ALCOR 的系统都应该能在很少或无需修改的情况下运行 Linux。这些主板之间主要的区别在于它们路由中断的方式。中断有三个来源：


    - 板载设备

    - PCI 设备

    - ISA 设备


    所有系统都使用 Intel 系统 I/O 桥接器（SIO）作为 PCI 和 ISA（主 I/O 总线是 PCI，ISA 总线是用于支持低速和“传统”I/O
    设备的次要总线）之间的桥接器。SIO 包含传统的级联 8259 对。


    一些系统（例如 Noname）将其所有中断通过 SIO 然后路由到 CPU。一些系统具有单独的中断控制器，并将所有 PCI 中断加上 SIO 中断（8259
    输出）通过该控制器路由，而所有 ISA 中断则通过 SIO 路由。系统之间的其他差异包括：


    - 它们拥有多少个插槽

    - 它们拥有哪些板载 PCI 设备

    - 它们使用的是 Flash 还是 EPROM


