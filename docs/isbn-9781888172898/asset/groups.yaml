    \n## 5.6 控制对服务的访问\n\n作为一种安全措施，大多数网络服务都由一个称为 TCP 包装器（TCP wrapper）的保护程序管理。受保护的服务是在\
    \ `/etc/inetd.conf` 中列出的那些指定了 `/usr/sbin/tcpd` 的服务。`tcpd` 可以根据请求的来源以及 `/etc/hosts.allow`\
    \ 和 `/etc/hosts.deny` 中的配置来允许或拒绝访问某项服务。默认情况下，Red Hat Linux 允许所有服务请求。要禁用或限制服务，您可以编辑\
    \ `/etc/hosts.allow`。以下是一个 `/etc/hosts.allow` 文件的示例：\n\n```\nALL: redhat.com *.redhat.com\n\
    in.talkd: ALL\nin.ntalkd: ALL\nin.fingerd: ALL\nin.ftpd: ALL\n```\n\n此配置允许来自 `redhat.com`\
    \ 和 `*.redhat.com` 机器的所有连接。它还允许来自所有机器的 talk、finger 和 ftp 请求。\n\n`tcpd` 使用 `/etc/hosts.allow`\
    \ 和 `/etc/hosts.deny` 的组合，允许更复杂的访问控制。有关完整详情，请阅读 `tcpd(8)` 和 `hosts_access(5)`\
    \ 手册页。\n\n## 5.7 匿名 FTP\n\n设置匿名 FTP 很简单。您所要做的就是安装 `anon-ftp` rpm 包（您可能在安装时已经完成了这一步）。一旦安装完成，匿名\
    \ FTP 即可正常运行。\n\n有几个文件您可能希望编辑以配置您的 FTP 服务器。\n\n- `/etc/ftpass`：此文件定义了您的 ftp 服务器的大部分访问控制。您可以执行的操作包括：设置逻辑“组”以控制来自不同站点的访问，限制同时\
    \ FTP 连接的数量，配置传输日志记录等等。有关完整详情，请阅读 `ftpaccess` 手册页。\n\n- `/etc/ftphosts`：`ftphosts`\
    \ 文件用于允许或拒绝某些账户从各种主机访问。有关详情，请阅读 `ftphosts` 手册页。\n\n- `/etc/ftpusers`：此文件列出了**不允许**通过\
    \ ftp 登录到您当前机器的所有用户。例如，默认情况下 `root` 被列在 `/etc/ftpusers` 中。这意味着您**不能**通过 ftp 登录到当前机器并以\
    \ `root` 身份登录。这是一个良好的安全措施，但一些管理员更喜欢将 `root` 从该文件中移除。\n\n## 5.8 万维网服务器\n\n如果您安装了\
    \ Apache Web 服务器（来自 `apache` 包），那么您的 Web 服务已经在运行了！只需将 Red Baron（或任何其他 Web 浏览器）指向\
    \ `http://localhost` 即可。\n\n显示的默认页面是 `/home/httpd/html/index.html`。您可以按照喜好编辑此文件（或完全替换它）。所有的\
    \ CGI 程序、图标和 html 页面都存储在 `/home/httpd` 中，但可以在 apache 配置文件中更改，所有这些文件都存储在 `/etc/htpd/conf`\
    \ 中。所有 htpd 活动的日志都保存在 `/var/log/htpd` 中。设置您的网站就像在 `/home/htpd/html/` 目录中添加您自己的\
    \ HTML 页面和链接一样简单。有关自定义 Web 服务器的更多信息，我们推荐参考 Chuck Musciano 和 Bill Kennedy 著、由 O’Reilly\
    \ & Associates 出版的 **《HTML: The Definitive Guide》**。\n\n## 5.9 NFS 配置\n\nNFS 代表网络文件系统（Network\
    \ File System），它是一种像文件位于本地硬盘上一样在机器之间共享文件的方式。Linux 既可以充当 NFS 服务器，也可以充当 NFS 客户端，这意味着它可以向其他系统“导出”文件系统，并“挂载”从其他机器导出的文件系统。\n\
    \n### 5.9.1 挂载 NFS 文件系统\n\n使用 mount 命令从另一台机器挂载一个 NFS 文件系统：\n\n```\nmount porky:/mnt/export\
    \ /mnt/local\n```\n\n在此命令中，`porky` 是 NFS 文件服务器的主机名，`/mnt/export` 是 `porky` 正在导出的文件系统，而\
    \ `/mnt/local` 是我本地机器上的一个目录，我希望在此处挂载该文件系统。在运行 mount 命令后（并且假设我从 `porky` 拥有适当的权限）-\
    \ 看哪！- 我可以输入 'ls /mnt/local' 并获取 `porky` 上 `/mnt/export` 中文件的列表。\n\n### 5.9.2\
    \ 导出 NFS 文件系统\n\n控制您希望导出哪些文件系统的文件是 “/etc/exports”。其格式为：\n\n```\ndirectory hostname(options)\n\
    ```\n\n其中 “(options)” 是可选的。例如：\n\n以下操作也可行：\n\n```\nkillall -HUP rpc.nfsd rpc.mountd\n\
    ```\n\n有关更多细节，请参阅以下手册页：`nfsd(8)`、`mountd(8)` 和 `exports(5)`。另一个好的参考资料是 Hal Stern\
    \ 著、由 O'Reilly & Associates 出版的 *《Managing NFS and NIS Services》*。\n\n## 5.10\
    \ 在启动时运行程序\n\n文件 `/etc/rc.d/rc.local` 在启动时执行，在所有其他初始化完成后，以及每次您更改运行级别时都会执行。您可以在此处添加额外的初始化命令。例如，您可能希望启动额外的守护进程，或初始化打印机。此外，如果需要设置串行端口，您可以编辑\
    \ `/etc/rc.d/rc.serial`，它将在启动时自动执行。\n\n默认的 `/etc/rc.d/rc.local` 只是创建一个带有您的内核版本和机器类型的美化登录横幅。\n\
    \n## 5.11 彩色 ls 设置\n\n彩色 ls 现在是标准 `ls` 命令的一部分。要使用 color-ls，只需在 `bash` 中发出以下命令即可：\n\
    \n```\nalias ls='ls --color'\n```\n\n## 5.12 NIS/NYS 设置\n\n本节的基本内容由 Grant Taylor\
    \ 提供。已为清晰度和空间进行了编辑。其他内容由 `redhat-list` 邮件列表中的用户提供。\n\n本文尝试描述 Red Hat Linux 产品中所提供的\
    \ yp、NIS 和 NIS+ 支持。\n\n- 什么是 yp？NIS？NIS+？NYS？这些问题在 NIS-HOWTO 中得到了解答。它随 Red Hat\
    \ Linux 在 ldap 包中以及在 CD 上提供。如果您安装 `ldap` 包，您将在 `/usr/doc/HOWTO` 中找到 NIS-HOWTO。\n\
    \n  简而言之，yp（“黄页”）在英国是电话簿，而 NIS 是一种传统的基于 RPC 的实现，用于在许多机器之间共享 passwd、group、hosts、services\
    \ 以及其他有用的信息。NIS+ 是同一想法更时尚、更安全的实现。NYS 是 NIS 的公共领域版本。\n\n- 提供了什么？Red Hat 在其 libc\
    \ 中附带 NYS 客户端代码，以及普通的 yp/NIS 客户端程序，如 ypcat 和 ypbind。我们附带了一个普通的 NIS 服务器守护进程，因为\
    \ NYS（也称为 NIS+）服务器守护进程尚未准备好用于生产环境。我们的 ypserver 似乎没有编译进 tcp_wrapper 风格的 `/etc/hosts.allow/deny`\
    \ 检查。\n\n- 如何让 ypbind 正常工作？如何设置客户端工作站？libc 中的 NYS 代码完成所有工作。无需运行 ypbind。您可能*确实*需要运行\
    \ domainname（为了普通 NIS 客户端程序的好处，适当设置）。您必须在 `/etc/nsswitch.conf` 中配置从哪里读取哪些映射，并使用\
    \ `/etc/yp.conf` 配置您所在的 NIS 服务器和域。nsswitch.conf 有详细的注释，yp.conf 将看起来像这样：\n\n  ```\n\
    \  domain foo\n  ypserver foo.bar.com\n  ```\n\n  不要在 passwd 或 group 文件的末尾添加常见的\
    \ `+:::` 行。\n\n- 如何运行 ypserver（主服务器）？Red Hat 附带了一个普通的 NIS（也称为 yp）服务器。它与其他任何 ypserver\
    \ 的工作方式相同——按喜好修改 `/var/nis` 中的 Makefile，也许将源文件移动到 `/var/nis/src`，或者也许不移动，运行 make\
    \ 以生成数据库，并运行 ypserver。进一步文档在 `/usr/doc/ypserver/*` 中。\n\n- yppasswd 和 yppasswd\
    \ 在哪里？它们不包含在 Red Hat Linux 中，但您可以获取普通的 NIS 发行版并自行安装，不会太麻烦。可以在 NIS HOWTO 中列出的地方获取。即使\
    \ README 声称它可以使用我们附带的 NYS Makefile，您也必须修改随附的 `pupgate` 脚本。我们也不附带 `rcpserver/yppasswd.h`，尽管我们有\
    \ `.x` 文件。yppasswd 包包含两者，所以这并不重要。应该使用 NYS 定义，但不要使用 `-lssl` 库，因为它已集成到我们的 libc 中。\n\
    \n- 这些信息非常不完整！已经有一个 NIS-HOWTO，它比本文档更好地（或应该更好地）描述了如何设置这些内容。它也随 Red Hat Linux 在\
    \ `ldap` 包中提供。\n\n"
