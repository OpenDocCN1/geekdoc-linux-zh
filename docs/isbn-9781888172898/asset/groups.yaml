- raw:
  - "[PAGE 87]\n\n# Physical Resolution\n\nNot all graphics cards and monitors can\
    \ support all physical resolutions. Only the options for the resolutions supported\
    \ by your hardware will be sensitive in this field. The other options will be\
    \ greyed out.\n\n+   * *Multiple* physical resolutions can be selected. You can\
    \ switch between these resolutions while running Metro-X by pressing a hot-key\
    \ combination:\n+   \t- Press `Ctrl` + `Alt` + `+` to change to the next resolution.\n\
    +   \t- Press `Ctrl` + `Alt` + `-` to change to the previous resolution.\n+  \
    \ * If you want only *one* resolution, make sure only *one Physical Resolution*\
    \ toggle button is selected.\n+   * In some cases the physical resolution(s) you\
    \ choose may limit the selections you can make in *Colors* and *Virtual Resolution*,\
    \ depending on the capabilities of your graphics card.\n+   \t1. The default setting\
    \ is at the lowest value for your card.\n+   \t2. Decide which available resolution(s)\
    \ you want to use.\n+   \t3. Press `Tab` to move to the setting, then press `Enter`\
    \ to select it.\n+   \t4. Press `Tab` to move to the corresponding field to set\
    \ the screen refresh rate (Hz) for that resolution, then use `←` or `→` to select\
    \ a value from the frequency options available. The default setting is the highest\
    \ frequency your monitor supports, and is usually the appropriate choice.\n+ \
    \  \t5. Repeat this procedure for each physical resolution you want to set.\n\n\
    # Multiple-Screen Configuration\n\nMetro-X supports up to four screens which can\
    \ all be controlled simultaneously with a single keyboard and mouse. This allows\
    \ you to run many applications without overlapping windows, and is particularly\
    \ useful for image-processing work. For each screen used, a separate configuration\
    \ must be created for that screen’s monitor and graphics card. See section B.1.4\
    \ for graphics card requirements."
  - '[PAGE 88]


    # Adding a Screen


    Metro-X defaults to a single-screen setup. The first screen configured is labeled
    *Screen 0*. When you add a second screen, all of its configuration default settings
    will duplicate the current settings of Screen 0. So if your hardware is the same
    on all screens, you can save time by configuring Screen 0 before adding the other
    screens. Similarly, as more screens are added, the settings of whichever one is
    currently active when you add another screen will determine the default settings
    of the new screen.


    +   1. Press `Alt-S` to display the *Screen* pull-down menu.

    +   2. Type *A* for *Add*.

    +   3. The *Monitor* and *Graphics Card* icons for Screen 0 become outlines, and
    two full-color icons appear for Screen 1.

    +   4. Refer to the procedures described earlier in this chapter if any changes
    need to be made to the new screen''s configuration.

    +   5. Use the `Page Down` and `Page Up` keys to move to the configuration pages
    of each screen.


    # Deleting a Screen


    When a screen is deleted, all screens with higher screen numbers immediately drop
    down one slot. For instance, if you currently have screens 0, 1, and 2 configured
    and you delete screen 1. That screen and all of its configuration information
    disappears. Screen 2 then becomes screen 1, but retains its own configuration.
    You are left with screens 0 and 1.


    +   1. Use the `Page Down` or `Page Up` key to activate the set of icons for the
    screen you want to delete.

    +   2. Press `Alt-S` to display the *Screen* pull-down menu.

    +   3. Type *D* for *Delete*.

    +   4. One set of *Monitor* and *Graphics Card* icons disappears. Higher-numbered
    screens (if any) immediately fill the gap of the deleted screen.'
  - '[PAGE 89]


    # Screen Layout


    The Screen Layout window lets you specify how the multiple screens are arranged
    in your workspace so mouse movement from screen to screen will be appropriate.


    +   1.  Press **Alt-S** to display the *Screen* pull-down menu.

    +   2.  Type **L** for *Layout*.

    +   3.  The *Screen Layout* window appears.

    +   4.  Press **←** and **→** to view the various layout combinations for your
    number of screens.

    +   5.  When the layout you want is displayed, press **Enter** to select it.


    # Font Path


    If needed, you can edit your font path from within the Metro-X Configuration Utility.
    This will be necessary if you are using a font server instead of or in addition
    to your existing fonts.


    +   1.  Press **Alt-C** to display the *Configuration* pull-down menu, then press
    **Enter**.

    +   2.  The *Font Path* window appears.

    +   3.  Edit the file as necessary for your system.  Metro-X looks for fonts in
    the order in which the directories are listed in this file. If you are using a
    font server, enter this as the first line:

    +       ```

    +       tcp/<fontserver machine>:7000

    +       ```

    +       If your port number is not the default 7000, change it to the appropriate
    port number for your system.

    +   4.  Press **Tab** to move to and amongst the bottom buttons, then press **Enter**
    to select one. If the information is correct, select the *Ok* button. If you want
    to disregard the changes you''ve made, select the *Cancel* button. If you''ve
    edited your font path and want to go back to the original settings, select the
    *Load Defaults* button.'
  - '[PAGE 90]


    # Save and Exit


    +   1. Press **Alt-F** to display the File pull-down menu.

    +   2. Type *S* for *Save and Exit*.

    +   3. Your changes are saved, the Metro-X Configuration Utility closes, and your
    system is now ready to run Metro-X!


    # Quit Without Saving


    +   1. Press **Alt-F** to display the File pull-down menu.

    +   2. Type *Q* for *Quit*.

    +   3. A precautionary dialog box appears: *Save current configuration before
    exiting*?

    +   4. Press **Tab** to move to the *No* button, then press **Enter** to confirm
    that you want to exit the Metro-X Configuration Utility without saving your changes.


    For more details on features of Metro X and the format of the *Xconfig* file see
    Appendix B.


    # 5.4 Mouse configuration


    To configure your mouse (or reconfigure your mouse after installation) enter the
    command */usr/sbin/mouseconfig*. Scroll down the list with the arrow keys until
    your mouse type is highlighted. If you have *any* mouse connected to a PS/2 style
    port you should select “PS/2” as your mouse type. If you have a mouse connected
    to a mouse port on an ATI video card you should select “ATI Bus Mouse”. If you
    have a 2 button mouse and want to emulate the third (middle) mouse button with
    a simultaneous click of the left and right mouse buttons use **Tab** to move the
    cursor to the “Emulate 3 Buttons” checkbox and press **Spacebar** to toggle the
    selection.'
  - '[PAGE 91]


    # ## 5.5 Sendmail


    A default `sendmail.cf` file will be installed in `/etc`. The default configuration
    should work for most SMTP-only sites. It will not work for UUCP sites; you will
    need to generate a new `sendmail.cf` if you need to use UUCP mail transfers. To
    generate a new `sendmail.cf`, you will need to install `m4` and the sendmail source
    package. Read the README file in the sendmail sources for more details on creating
    `sendmail` configuration files. Also, O''Reilly & Associates publishes a good
    sendmail reference entitled *sendmail* by Bryan Costales.


    One common sendmail configuration is to have a single machine act as a mail gateway
    for all the machines on your network. For instance, at Red Hat Software we have
    a machine `mail.redhat.com` that does all our mail. On that machine we simply
    need to add the names of machines for which `mail.mail.redhat.com` will handle
    mail to `/etc/sendmail.cw`. Here is an example:


    ```

    ```

    # sendmail.cw - include all aliases for your machine here.

    torgo.redhat.com

    poodle.redhat.com

    devel.redhat.com

    ```

    ```


    Then on the other machines, torgo, poodle, and devel, we need to edit `/etc/sendmail.cf`
    to “masquerade” as `mail.redhat.com` when sending mail, and to forward any local
    mail processing to `redhat.com`. Find the DH and DM lines in `/etc/sendmail.cf`
    and edit them thusly:


    ```

    ```

    # who I send unqualified names to (null means deliver locally)

    DRmail.redhat.com


    # who gets all local email traffic

    DHmail.redhat.com


    # who I masquerade as (null for no masquerading)

    DMredhat.com

    ```

    ```


    With this type of configuration, all mail sent will appear as if it were sent
    from `redhat.com`, and any mail sent to `torgo.redhat.com` or the other hosts
    will be delivered to `mail.redhat.com`.'
