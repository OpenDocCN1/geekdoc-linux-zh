    ## LILO 的替代方案


    如果您不希望使用 LILO 来引导您的 Red Hat Linux 系统，有几种替代方法：


    **LOADLIN** 可以从 MS-DOS 加载 Linux；不幸的是，它需要 Linux 内核（如果您有 SCSI 适配器，还需要初始 ram 盘）在
    MS-DOS 分区上可用。实现这一点的唯一方法是使用其他方法（例如，从软盘上的 LILO）引导您的 Red Hat Linux 系统，然后将内核复制到 MS-DOS
    分区。**LOADLIN** 可以从 `ftp://sunsite.unc.edu/system/Linux-boot/` 和 sunsite 的各个镜像站点获取。


    **SYSLINUX** 是一个与 **LOADLIN** 非常相似的 MS-DOS 程序；它也可以从 `ftp://sunsite.unc.edu/system/Linux-boot/`
    和 sunsite 的各个镜像站点获取。


    **某些商业引导加载程序**，例如 System Commander，能够引导 Linux（但可能仍然需要在您的 Linux 根分区安装 LILO）。


