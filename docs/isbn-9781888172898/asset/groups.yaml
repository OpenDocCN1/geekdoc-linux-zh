    \ variables. If such a block already exists, the flash management utility will\
    \ tell you where it is. Otherwise, you must use the environment command to set\
    \ a block and initialise it. In the above example, flash block 12 contains MILO's\
    \ environment variables.\n\n# ## D.7.1 The \"help\" command\n\n```\nFWU> help\n\
    \nFWU command summary:\n\nlist\t\t\t\t- List the contents of flash\nprogram\t\t\
    \t- program an image into flash\nquit\t\t\t\t- Quit\nenvironment\t\t- Set which\
    \ block should contain the environment \\\n\t\t\t\t\tvariables\nbootopt num\t\t\
    - Select firmware type to use on next power up\nhelp\t\t\t\t- Print this help\
    \ text\nFWU>\n```\n\n*Note that the environment and bootopt commands are only\
    \ available on the EB66+, the AlphaPC64, EB164 and PC164 systems (and their clones).*\n\
    \n# ## D.7.2 The \"list\" command\n\nThe \"list\" command shows the current usage\
    \ of the flash memory. Where there is more than one flash block, the usage of\
    \ each flash block is shown. In the example below you can see that Windows NT\
    \ ARC is using blocks 4:7 and block 15.\n\n```\nFWU> list\nFlash blocks:  0:DBM\
    \ 1:DBM 2:WNT 4:WNT 5:WNT 6:WNT\n\t\t\t7:WNT 8:MILO 9:MILO 10:MILO 11:MILO 12:MILO\
    \ 13:U 14:U 15:WNT\nListing flash Images\n\tFlash image starting at block 0:\n\
    \tFirmware Id:\t0 (Alpha Evaluation Board Debug Monitor)\n\tImage size is 191248\
    \ bytes (3 blocks)\n\tExecuting at 0x300000\nFlash image starting at block 3:\n\
    ```"
