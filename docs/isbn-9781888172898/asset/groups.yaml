  mdcn: "\n## 4.4 网络安装\n\n你还可以通过 TFTP 传输完整的安装映像（内核和根文件系统）来进行 FTP 安装。除了 `nfsroot` 和内核链接之外，你需要像上面的示例那样执行相同的操作。不要使用\
    \ `kernels/vmlinux`，而是使用 `images/tftpboot.img`。将其放置在 `/home/tftp` 目录中，并创建符号链接：\n\
    \n```bash\ncd /home/tftp\nln -s tftpboot.img C7B718E3.SUN4M\n```\n\n请记住根据你自己的网络编号和机器架构更改\
    \ IP 地址和架构类型。\n\n现在，你只需要从 SPARC 机器进行网络启动，系统应该会通过 TFTP 传输所有内容，启动内核并启动安装程序。然后，你可以从附近的服务器进行\
    \ FTP 安装，或者如果你愿意，也可以进行 NFS、硬盘或 CD-ROM 安装。\n\n## 4.5 使用串行终端安装\n\n你也可以使用串行终端安装 Red\
    \ Hat Linux/SPARC 4.2；任何模拟 VT100 的终端都应该能正常工作。从软盘启动，并在 `SILO` 提示符下输入：\n\n```bash\n\
    linux serial\n```\n\n安装程序运行在第一个串行端口，参数为 `9600,8,N,1`（9600 波特率，8 位数据，无奇偶校验，1 位停止位）。如果你的串行终端支持颜色，安装程序可以以彩色模式运行。\n\
    \n在串行安装过程中的任何提示对话框（任何带有 **OK** 按钮的对话框）中，你可以按 `Ctrl-Z` 启动一个子 shell；要返回安装程序，请在 shell\
    \ 提示符下输入 `exit`。\n\n安装完成后，只需正常启动系统，Red Hat Linux 应该会在你的串行终端上正常运行。\n\n## 4.6 安装：选择系统组件\n\
    \n（关于系统组件的说明，请参阅第 2 章，第 2.4.12 节。）\n\n**重要！** 在为 Red Hat Linux/SPARC 选择要安装的系统组件时，如果选择安装\
    \ **Everything**（所有内容）而没有选择 **Select individual packages**（选择单个软件包），可能会导致 Red\
    \ Hat Linux 系统无法启动。最后安装的内核将是多处理器内核，这在 sun4c 机器上将无法正常工作。此外，默认的 X 服务器最终会变成 XsunMono，这对大多数人来说可能无法使用。如果你确实希望安装\
    \ **Everything**，请同时也选择 **Select individual packages**。然后，除了你希望安装的那个内核（`kernel-sparc`\
    \ 适用于大多数情况）和适用于你硬件的那个 X 服务器（btw20 显卡使用 `XsunMono`，所有 8 位显示器使用 `Xsun`，支持的 24 位显示器使用\
    \ `Xsun24`）之外，取消选择所有内核和 X 服务器。\n\n## 4.7 SILO 配置\n\nSILO 配置与 LILO 配置几乎相同，详情请参见第\
    \ 2.4.19 节。\n\n## 4.8 分区\n\n在为 SPARC 分区硬盘时，有一个额外的步骤。你必须将每个磁盘的第三个分区创建为类型 **Whole\
    \ Disk**（整个磁盘），范围从 0 柱面到磁盘的末尾。它不应被触摸，但应该存在。你仍然可以像通常那样创建其他分区。\n\n此外，磁盘上的第一个分区不应是交换分区，*除非*\
    \ 交换分区从 1 柱面开始。\n\n## 4.9 X 窗口\n\nSPARC 上没有鼠标或 X 窗口配置。默认安装的是 8 位服务器。如果你想使用 24\
    \ 位服务器（用于 TCX 卡），你需要安装 **Xsun24** 软件包。如果你只有 bwtwo 帧缓冲并希望提高性能，请安装 **XsunMono**\
    \ 软件包。安装上述任一软件包都需要你重启 X 窗口。此外，如果你使用上述服务器之一，你可以卸载 Xsun 软件包。\n\n## 第 5 章\n\n# 安装后配置\n\
    \n安装完成后，你的系统已完全功能正常，但你可能仍需要进行一些额外的配置。本章描述了你可能需要执行的一些各种系统配置任务。\n\n## 5.1 构建自定义内核\n\
    \n随着 Linux 2.0.x 内核中模块化的引入，构建自定义内核方面发生了一些重大变化。过去，如果你想访问特定的硬件或文件系统组件，你需要将支持编译到内核中。对于某些硬件配置，内核的大小可能会迅速达到临界水平。要求对仅偶尔使用的项提供就绪支持是系统资源的低效使用。凭借\
    \ 2.0.x 内核的功能，如果某些硬件组件或文件系统使用频率较低，可以为它们加载驱动程序模块以满足需求。有关处理内核模块的信息，请参阅第 8 章，第 8.6\
    \ 节。\n\n### 5.1.1 构建模块化内核\n\n只有 Red Hat Linux/Intel 和 Red Hat Linux/SPARC 支持模块化内核；Red\
    \ Hat Linux/Alpha 用户必须构建单体内核（见下文第 5.1.3 节）。\n\n这些说明提供了利用内核模块化所获得的强大功能和灵活性所需的知识。如果你不希望利用模块化，请参阅第\
    \ 5.1.3 节了解构建和安装单体内核的不同方面的说明。假定你已安装 **kernel-headers** 和 **kernel-source** 软件包，并且从\
    \ `usr/src/linux`/ 目录发出所有命令。\n\n从已知状态开始内核构建非常重要。因此，建议使用命令 **make mrproper** 开始。这将删除任何配置文件以及可能散布在源树中的任何先前构建的残留物。现在你必须创建一个配置文件，以确定新内核中包含哪些组件。根据你的硬件和个人偏好，有三种可用的方法来配置内核。\n\
    \n- **make config** 交互式文本程序。组件会依次呈现，你用 Y（是）、N（否）或 M（模块）回答。\n- **make menuconfig**\
    \ 图形菜单驱动程序。组件在类别菜单中呈现，你以与 Red Hat Linux 安装程序中相同的方式选择所需组件。切换对应项的标签以包含该项：Y（是）、N（否）或\
    \ M（模块）。\n- **make xconfig** X 窗口程序。组件列在不同的菜单级别中，使用鼠标选择组件。再次选择 Y（是）、N（否）或 M（模块）。\n\
    \n**请注意：** 为了使用内核 d（有关详细信息，请参阅第 8.6 节）和内核模块，你必须在配置中回答 **kernel support**（内核支持）和\
    \ **module version (CONFIG_MODVERSIONS) support**（模块版本支持）为 Yes。\n\n**请注意：** 如果你在使用“克隆”处理器的机器上（或为这种机器）构建\
    \ Linux/Intel 内核（例如，由 Cyrix 或 AMD 制造），建议选择 386 的 **Processor type**（处理器类型）。\n\n\
    如果你希望使用已经通过上述方法之一创建好的配置文件（`/usr/src/linux/.config`）来构建内核，你可以省略 `make mrproper`\
    \ 和 `make config` 命令，并使用命令 `make dep` 后跟 `make clean` 来准备源树进行构建。\n\n下一步包括将源代码组件实际编译成你的机器可以用来启动的工作程序。这里描述的方法在发生故障时最容易恢复。如果你对其他可能性感兴趣，可以在\
    \ Kernel-HOWTO 或你 Linux 系统上 `/usr/src/linux` 中的 `Makefile` 中找到详细信息。\n\n- 使用 `make\
    \ boot` 构建内核。\n- 使用 `make modules` 构建你配置的任何模块。\n- 使用以下命令将旧的一组模块移出：\n  ```bash\n\
    \  rm -rf /lib/modules/2.0.29-old\n  mv /lib/modules/2.0.29 /lib/modules/2.0.29-old\n\
    \  ```\n  当然，如果你已升级内核，请将 2.0.29 替换为你正在使用的版本。\n- 使用 `make modules.install` 安装新模块（即使你没有构建任何模块）。\n\
    \n如果你有 SCSI 适配器并且使你的 SCSI 驱动程序模块化，请构建一个新的 `initrd` 映像（见第 5.1.2 节）。注意，在自定义内核中将\
    \ SCSI 驱动程序模块化的实际理由很少。\n\n为了提供冗余的启动源以保护免受新内核中可能出现的错误影响，你应该保留原始内核可用。向 LILO 菜单添加内核就像将\
    \ `/boot` 中的原始内核重命名，将新内核复制到 `/boot`，在 `/etc/lilo.conf` 中添加几行并运行 `/sbin/lilo` 一样简单。以下是\
