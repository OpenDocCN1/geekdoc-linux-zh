    \ 或软盘）或 ISO9660 格式 CD 上有一个 Linux 内核映像。该映像可以经过 gzip 压缩，在这种情况下，MILO 会自动将其解压缩。早期版本的\
    \ MILO 通过 .gz 后缀识别 gzip 文件，但后期的 MILO 查找映像中的魔数。\n\n你应注意，MILO 的版本通常不需要与你加载的 Linux\
    \ 内核版本匹配。你使用以下命令语法启动 Linux：\n\n```\nMILO> boot [-t file-system] device-name:file-name\
    \ \\\n[[boot-option] [boot-option] ...]\n```\n\n其中 `device-name` 是你希望使用的设备名称，file-name\
    \ 是包含 Linux 内核的文件名。文件名后提供的所有参数都直接传递给 Linux 内核。如果你正在安装 Red Hat，则需要指定根设备等内容。因此你可以使用：\n\
    \n```\nMILO> boot fd0:vmlinux.gz root=/dev/fd0 load_ramdisk=1\n```\n\nMILO 将自动包含你配置到\
    \ vmlinux 中的块设备。我测试过软盘驱动程序、IDE 驱动程序和几种 SCSI 驱动程序（例如，NCR 810），它们工作正常。此外，将 SCSI\
    \ 控制器的主机 ID 设置为合理的值也很重要。默认情况下，MILO 会将其初始化为最高可能值（7），这通常工作得很好。但是，如果你愿意，可以通过将环境变量\
    \ SCSIn_HOSTID 设置为适当值来显式设置系统中第 $n$ 个 SCSI 控制器的主机 ID。例如，要将第一个 SCSI 控制器的主机 ID 设置为\
    \ 7，你可以在 MILO 提示符下发出以下命令：\n\n```\nsetenv SCSI0_HOSTID 7\n```\n\n### D.6.3 重启 Linux\n\
    \n你可能想使用 `shutdown -r now` 命令重启正在运行的 Linux 系统。在这种情况下，Linux 内核将控制权返回给 MILO（通过 HALT\
    \ CallPAL 入口点）。MILO 为了这个目的而在内存中保留自身的压缩副本，并检测系统正在通过 HWRPB（硬件重启参数块）中持有的信息进行重启。在这种情况下，它开始使用与上次启动\
    \ Linux 内核时完全相同的命令进行重启。有一个 30 秒的超时时间，允许你中断此过程并以你希望的任何方式启动任何你希望的内核。\n\n### D.6.4\
    \ \"bootopt\" 命令\n\n对于基于闪存的系统，如 AlphaPC64、EB164 和 EB66+，有几种可能的启动选项，这些选项是使用 bootopt\
    \ 命令更改的。它有一个参数，一个十进制数，表示下次系统断电循环或重置时要启动的映像类型。\n\n- 0 启动评估板调试监视器，\n- 1 启动 Windows\
    \ NT ARC 固件。\n\n为了告诉启动代码从闪存启动 MILO 固件，你需要一个意味着启动第 N 个映像的启动选项。为此，你需要 128 加上 N，因此如果\
    \ MILO 是第三个映像，你会使用以下命令：\n\n```\nMILO> bootopt 131\n```\n\n注意：对此命令务必非常小心。一个好的规则是永远不要将\
    \ bootopt 设置为 0（评估板调试监视器），而是使用系统的跳线来实现相同的效果。\n\n## D.7 运行闪存管理实用程序\n\nrun 命令用于运行闪存管理实用程序。在开始之前，你需要一个包含\
    \ updateflash 程序的对 MILO 可用的设备。这（像 vminilux 一样）可以经过 gzip 压缩。你需要使用（run）命令从 MILO\
    \ 运行闪存管理实用程序：\n\n```\nMILO> run fd0:fm.u.gz\n```\n\n一旦加载并初始化，闪存管理实用程序将告诉你一些关于闪存设备的信息，并给你一个命令提示符。同样，help\
    \ 命令最为有用。\n\n```\nLinux MILO 闪存管理实用程序 V1.0\n\n闪存设备是 Intel 28f008SA\n16 个段，每段 0x10000（65536）字节\n\
    正在扫描闪存块的使用情况\n块 12 包含环境变量\nFMU>\n```\n\n注意，在可能存储环境变量且存在多个闪存块的系统（例如，AlphaPC64）上，闪存\n\
    \n"
