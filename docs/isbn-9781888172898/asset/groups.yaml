    ## 附录 F


    # Red Hat 和自由分发软件。


    ## F.0.1 Red Hat 历史


    Linux 与 Unix 本身一样，是一个高度模块化的操作系统。选择、编译、链接和安装完整的 Linux 操作系统所需的各种组件的技能，超出了大多数想要使用
    Linux 的人的经验范围。各种 Linux 发行版在很大程度上解决了普通 Linux 用户的问题，但大多数都没有解决一旦成功安装 Linux 系统后如何进行升级的问题。大多数用户发现，当他们需要升级时，删除整个
    Linux 系统并从头重新安装更容易。


    Red Hat 发行版通过为用户提供高级包管理、图形化（点击即可！）系统安装和控制以及系统管理工具，使 Linux 的安装和维护变得更加容易。


    ## F.1 自由软件模式


    Linux 和 GNU 实用工具（总体）以及 Red Hat Linux（具体而言）可能最好的特性是，它是根据 GNU 通用公共许可证（GPL）条款分发的。这一特性使得研究机构、大学、商业企业和黑客能够合作开发和使用权
    Red Hat Linux 及相关技术，而不必担心他们的工作将来会受到商业供应商的控制或限制。


    简而言之，GPL 将软件开发和分发的模式改变为与我们法律体系及其行业使用的模式非常相似的模式。如果一位律师设计了一项论点并在最高法院赢得了官司，他的奖励不仅是客户支付的律师费，还有他的成就吸引到其执业的其他额外客户。他使用的“论点”可以供其他任何律师无限制地使用，事实上成为我们集体法律遗产的一部分。


    这种新模式已经是一个新的产业，像 Cygnus Support 这样的公司（参见 http://www.cygnus.com）凭借为 GPLv4 和其他“自由分发”软件的大型商业用户提供支持和服务，正在成为数百万美元的企业。Red
    Hat Software, Inc. 的快速增长同样基于我们对 Red Hat Linux 发行版的开发和支持，这是一款我们在全球通过 CD 和互联网依据
    GPL 条款分发的产品。


    ## F.2 “自由软件”的演变


    Unix 操作系统也是由 AT&T 在多家大学和研究机构的积极支持下合作开发的。许多早期的 Unix 贡献者对 AT&T 在 1970 年代末和 1980
    年代开始强制实施 Unix 使用和分发的版权条款感到失望。这最终导致了 AT&T（以及随后在 1991 年从 AT&T 购买 Unix 版权的 Novell）与加州大学伯克利分校之间漫长而激烈的法律纠纷。作为对个别控制公共软件开发项目这一问题的部分回应，位于马萨诸塞州剑桥市的麻省理工学院（MIT）自
    1984 年以来一直支持理查德·斯托曼（Richard Stallman）努力发起一个软件开发社区的运动，以支持自由软件的开发。这导致了自由软件基金会（FSF）及其
    GNU 项目的建立。GNU 名称沿袭了早期 Unix 使用递归缩略语作为程序名称的传统，意为 GNU''s Not Unix（GNU 不是 Unix）。FSF
    继续以 MIT 为总部，并在过去十年中凭借 GNU C、GNU C++、Emacs 等产品取得了惊人的成功，以及

