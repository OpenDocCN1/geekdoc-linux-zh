    ```


    如果根分区是第二块 IDE 硬盘上的第三个分区，则应使用此命令：


    ```

    boot hdb3:vmlinux.gz root=/dev/hdb3

    ```


    关于这些命令以及如何自动化启动过程的信息，请参阅附录 D 中的 MILO HOWTO。


    # 第 4 章


    # 安装 Red Hat Linux/SPARC


    这是针对 SPARC 处理器家族的 *Red Hat Linux/SPARC* 4.2 版本的简要安装说明。本章描述了安装 Red Hat *Linux/SPARC*
    与 Red Hat *Linux/Intel* 之间的差异。有关安装过程的更多细节，请参阅第 2 章。


    ## 4.1 硬件


    Red Hat *Linux/SPARC* 已知在以下硬件上运行正常：


    -   sun4c 架构机器（IPC、SS1 等）

    -   sun4m 架构机器（Classic、SS5、SS10 等）

    -   bwtwo、cg3、cg6、TCX 帧缓冲区（TCX 为 24 位）

    -   cg14 帧缓冲区（在 cg3 模式下）

    -   上述所有机型均支持 SCSI 和以太网

    -   4 型及 5 型键盘和鼠标

    -   外部 SCSI 驱动器

    -   CD-ROM 驱动器（外部和内部）

    -   SCSI/以太网 SBUS 扩展卡

    -   适用于上述帧缓冲区的任何原装 Sun 显示器


    以下部分列表中的硬件*不受支持*：


    -   基于 VME 总线的 sun4m 机器，例如 4/690

    -   sun4d（SS1000、SS2000）

    -   sun4u（UltraSparc1、UltraSparc2、Enterprise UltraSparc 服务器）

    -   sun4 架构

    -   Eurocard sundc 机器，在 Solaris 2.4 及其他系统中称为 ''sun4e''，不受支持。这些是基于 VME 总线的 sun4c
    机器，内核尚未移植到这些机器上。


    ## 4.2 从软盘启动


    ### 4.2.1 制作引导软盘


    如果你的 SPARC 系统配有软驱，你可以从软盘启动 Red Hat Linux 安装程序。引导软盘镜像位于你的 Red Hat CD 的 **images/**
    目录中。


    要制作引导软盘，你可以使用 MS-DOS 下的 **rawrite.exe**（位于你的 Red Hat Linux/SPARC CD 的 **dosutils**
    目录中），或者使用 Linux 或 Unix 下的 **dd**。在 MS-DOS 下，请输入以下命令（假设 CD-ROM 是 d: 盘）：


    ```

    d:

    cd \images

    \dosutils\rawrite.exe

    ```


    ### 4.2.2 启动


    *rawrite* 会先询问软盘镜像的名称；请输入 boot.img。然后它会询问要将镜像写入哪个软驱；请输入 **a:**。


    在 Linux 或 Unix 下，挂载 CD，切换到其挂载目录，并使用以下命令：


    ```

    dd if=images/boot.img of=/dev/fd0

    ```


    > **请注意：** 在 Solaris 下不要使用 /dev/rfd0；它将无法正常工作。请使用 /dev/fd0。


    插入引导软盘，并在 PROM 提示符下输入 `boot floppy`。你将看到 SILO 提示符。如果你希望使用 ramdisk 进行安装（这需要约 2M
    的 RAM，如果内存为 8M 或更多则推荐使用），你可以直接在 SILO 提示符下按回车键。如果你希望进行基于 NFS 根文件系统的安装，则需要在此处提供某些参数。公式如下：


    ```

    linux nfsroot=nfs.server.IP.address:/path/to/RH/image

    ```


    要使此方法正常工作，你需要在网络上配置 rarp 条目或 bootp 条目，以提供你的 SPARC 的 IP 地址。以下内容在下面的 4.3 节中涵盖。


    ## 4.3 从网络启动


    如果你没有软驱，且你的 PROM 版本低于 2，你需要进行网络启动。这相对容易实现，但你需要在本地网络的一台服务器上配置 rarp 条目，以告知目标 SPARC
    其 IP 地址。这可以在一台内核中内置 RARP（或作为模块插入）的 Linux 系统上完成，使用如下形式的命令：


    ```

    rarp -s ip.address.of.sparc hw:address.of:sparc

    ```


    在大多数情况下，你还需要一个 ARP 条目；例如：


    ```

    arp -s ip.address.of.sparc hwaddress.of.sparc

    ```


    现在，你需要在本地网络中设置一个 TFTP 服务器，以便向目标 SPARC 提供内核。这台机器应与上面执行 **rarp** 的机器相同。在 Red Hat
    Linux 中，这可以通过编辑 /etc/inetd.conf 来实现。你需要一个类似于下面的条目：


    ```

    tftp dgram udp wait root /usr/sbin/tcpd in.tftpd /home/tftp

    ```


    现在，你可以将 *kernels/vmlinux* 复制到服务器上的 */home/tftp*，并创建一个符号链接，以便 PROM 获取正确的文件。这个符号链接取决于目标
    SPARC 的 IP 地址和架构。你需要将链接命名为 IP 地址的十六进制值加“.”点加架构。例如，要为 *flanders.redhat.com* 创建一个符号链接，这是一台
    IP 地址为 199.183.24.232 的 sun4m 机器，你需要输入以下命令：


    ```

    cd /home/tftp

    ln -s vmlinux C7B718E8.SUN4M

    ```


    此时，你应该能够在 SPARC 的 PROM 中输入：


    ```

    boot net nfsroot=nfs.server.IP.address:/path/to/RH/image

    ```


    并且它应该从 TFTP 服务器获取 rarp 请求的响应，并开始通过 TFTP 加载内核。然后内核应该启动并开始安装。


    启动安装盘后，你会看到一个带有单个按钮的欢迎屏幕；按 `Enter` 开始安装。


    现在，选择你要使用的安装介质；NFS、硬盘或 FTP。仅当存在带有 EXT2 文件系统的现有分区时，从硬盘安装才能正常工作；从 UFS 安装尚未实现。


