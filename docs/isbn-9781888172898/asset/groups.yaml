    \ adding a few lines in `/etc/lilo.conf` and running `/sbin/lilo`. Here is an\
    \ example of the default `/etc/lilo.conf` file shipped with Red Hat Linux:\n```bash\n\
    boot=/dev/hda\nmap=/boot/map\n```"
  md: "\n## 4.4 Network Installation\n\nYou can also do an FTP install by TFTPing\
