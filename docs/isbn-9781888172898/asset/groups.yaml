    \ sending mail, and to forward any local mail processing to `redhat.com`. Find\
    \ the DH and DM lines in `/etc/sendmail.cf` and edit them thusly:\n\n```\n# who\
    \ I send unqualified names to (null means deliver locally)\nDRmail.redhat.com\n\
    \n# who gets all local email traffic\nDHmail.redhat.com\n\n# who I masquerade\
    \ as (null for no masquerading)\nDMredhat.com\n```\n\nWith this type of configuration,\
    \ all mail sent will appear as if it were sent from `redhat.com`, and any mail\
    \ sent to `torgo.redhat.com` or the other hosts will be delivered to `mail.redhat.com`.\n"
  mdcn: "\n\n## 物理分辨率\n\n并非所有的显卡和显示器都能支持所有物理分辨率。在此字段中，只有您的硬件所支持的分辨率选项处于可用状态。其他选项将被置灰。\n\
    \n- 可以选择*多个*物理分辨率。在运行 Metro-X 期间，您可以按热键组合在这些分辨率之间切换：\n  - 按 `Ctrl` + `Alt` + `+`\
    \ 切换到下一个分辨率。\n  - 按 `Ctrl` + `Alt` + `-` 切换到上一个分辨率。\n- 如果只需要*一个*分辨率，请确保仅选中*一个物理分辨率*切换按钮。\n\
    - 在某些情况下，根据显卡的功能，您选择的物理分辨率可能会限制您在*颜色*和*虚拟分辨率*中可做的选择。\n\n1. 默认设置为您显卡的最低值。\n2. 决定要使用哪些可用分辨率。\n\
    3. 按 `Tab` 键移动到设置项，然后按 `Enter` 键进行选择。\n4. 按 `Tab` 键移动到对应字段以设置该分辨率的屏幕刷新率（Hz），然后使用\
    \ `←` 或 `→` 从可用的频率选项中选择值。默认设置是您的显示器支持的最高频率，通常也是合适的选择。\n5. 对您想要设置的每个物理分辨率重复此过程。\n\
    \n## 多屏配置\n\nMetro-X 支持多达四个屏幕，所有这些屏幕都可以由单个键盘和鼠标同时控制。这允许您运行许多应用程序而不使窗口重叠，对于图像处理工作特别有用。对于每个使用的屏幕，必须为该屏幕的显示器和显卡创建单独的配置。有关显卡要求，请参阅章节\
    \ B.1.4。\n\n## 添加屏幕\n\nMetro-X 默认设置为单屏幕布局。配置的第一个屏幕标记为*屏幕 0*。当您添加第二个屏幕时，其所有配置默认设置将复制屏幕\
    \ 0 的当前设置。因此，如果您的硬件在所有屏幕上都相同，您可以在添加其他屏幕之前先配置屏幕 0 以节省时间。同样地，随着更多屏幕的添加，当您添加另一个屏幕时，当前活动屏幕的设置将决定新屏幕的默认设置。\n\
    \n1. 按 `Alt-S` 显示*屏幕*下拉菜单。\n2. 输入 *A* 代表*添加*。\n3. 屏幕 0 的*显示器*和*显卡*图标变为轮廓，屏幕 1\
    \ 出现两个全色图标。\n4. 如果需要对新屏幕的配置进行任何更改，请参阅本章前面描述的操作步骤。\n5. 使用 `Page Down` 和 `Page Up`\
    \ 键移动到每个屏幕的配置页面。\n\n## 删除屏幕\n\n当删除一个屏幕时，所有具有较高屏幕编号的屏幕立即向下移动一个位置。例如，如果您当前配置了屏幕\
    \ 0、1 和 2，并删除屏幕 1。该屏幕及其所有配置信息将消失。屏幕 2 变为屏幕 1，但保留其自身的配置。最终只剩下屏幕 0 和 1。\n\n1. 使用\
    \ `Page Down` 或 `Page Up` 键激活您要删除的屏幕的图标组。\n2. 按 `Alt-S` 显示*屏幕*下拉菜单。\n3. 输入 *D*\
    \ 代表*删除*。\n4. 一组*显示器*和*显卡*图标消失。编号较高的屏幕（如果有）立即填补被删除屏幕的空缺。\n\n## 屏幕布局\n\n屏幕布局窗口允许您指定多个屏幕在工作区中的排列方式，以便鼠标在屏幕间的移动是恰当的。\n\
    \n1. 按 **Alt-S** 显示*屏幕*下拉菜单。\n2. 输入 **L** 代表*布局*。\n3. *屏幕布局*窗口出现。\n4. 按 **←**\
    \ 和 **→** 查看您的屏幕数量的各种布局组合。\n5. 当您想要显示的布局出现时，按 **Enter** 选择它。\n\n## 字体路径\n\n如果需要，您可以从\
    \ Metro-X 配置工具中编辑您的字体路径。如果您使用字体服务器代替或除了现有字体之外，这将是有必要的。\n\n1. 按 **Alt-C** 显示*配置*下拉菜单，然后按\
    \ **Enter**。\n2. *字体路径*窗口出现。\n3. 根据需要为您的系统编辑文件。Metro-X 按照此文件中列出的目录顺序查找字体。如果您正在使用字体服务器，请将其作为第一行输入：\n\
    \   ```\n   tcp/<fontserver machine>:7000\n   ```\n   如果您的端口号不是默认的 7000，请将其更改为您的系统适用的端口号。\n\
    4. 按 **Tab** 键移动到底部按钮之间，然后按 **Enter** 选择其中一个。如果信息正确，选择*确定*按钮。如果您想忽略所做的更改，选择*取消*按钮。如果您已编辑字体路径并希望返回原始设置，选择*加载默认值*按钮。\n\
    \n## 保存并退出\n\n1. 按 **Alt-F** 显示文件下拉菜单。\n2. 输入 *S* 代表*保存并退出*。\n3. 您的更改已保存，Metro-X\
    \ 配置工具关闭，您的系统现在准备好运行 Metro-X！\n\n## 不保存直接退出\n\n1. 按 **Alt-F** 显示文件下拉菜单。\n2. 输入\
    \ *Q* 代表*退出*。\n3. 出现一个预防性对话框：*退出前保存当前配置*？\n4. 按 **Tab** 键移动到*否*按钮，然后按 **Enter**\
    \ 确认要在不保存更改的情况下退出 Metro-X 配置工具。\n\n有关 Metro X 的功能以及*Xconfig*文件格式的更多详细信息，请参见附录\
    \ B。\n\n### 5.4 鼠标配置\n\n要配置您的鼠标（或在安装后重新配置您的鼠标），输入命令 */usr/sbin/mouseconfig*。使用箭头键向下滚动列表，直到您的鼠标类型被高亮显示。如果您有任何鼠标连接到\
    \ PS/2 风格端口，应选择“PS/2”作为鼠标类型。如果您的鼠标连接到 ATI 视频卡上的鼠标端口，应选择“ATI 总线鼠标”。如果您有一个两键鼠标，并希望用左右键同时点击来模拟第三个（中间）鼠标按钮，请使用\
    \ **Tab** 键将光标移动到“模拟 3 键”复选框，并按 **空格键** 切换选择状态。\n\n### 5.5 Sendmail\n\n默认的 `sendmail.cf`\
    \ 文件将安装到 `/etc`。默认配置应适用于大多数仅使用 SMTP 的网站。它不适用于 UUCP 网站；如果您需要使用 UUCP 邮件传输，则需要生成一个新的\
    \ `sendmail.cf`。要生成新的 `sendmail.cf`，您需要安装 `m4` 和 sendmail 源代码包。阅读 sendmail 源文件中的\
    \ README 文件以获取更多关于创建 `sendmail` 配置文件的详细信息。此外，O'Reilly & Associates 出版了一本名为 *sendmail*\
    \ 的好 sendmail 参考书，作者是 Bryan Costales。\n\n一种常见的 sendmail 配置是让单台机器充当网络上所有机器的邮件网关。例如，在\
    \ Red Hat Software，我们有一台名为 `mail.redhat.com` 的机器处理所有邮件。在那台机器上，我们只需要将 `mail.mail.redhat.com`\
    \ 将处理邮件的机器名称添加到 `/etc/sendmail.cw`。这是一个示例：\n\n```\n# sendmail.cw - 在此包含您机器的所有别名。\n\
    torgo.redhat.com\npoodle.redhat.com\ndevel.redhat.com\n```\n\n然后，在其他机器上，torgo、poodle\
    \ 和 devel，我们需要编辑 `/etc/sendmail.cf` 以在发送邮件时“伪装”为 `mail.redhat.com`，并将任何本地邮件处理转发给\
    \ `redhat.com`。在 `/etc/sendmail.cf` 中找到 DH 和 DM 行并按如下方式编辑：\n\n```\n# 未限定名称发送给谁（null\
    \ 表示本地投递）\nDRmail.redhat.com\n\n# 谁接收所有本地电子邮件流量\nDHmail.redhat.com\n\n# 伪装为谁（null\
    \ 表示不伪装）\nDMredhat.com\n```\n\n使用这种类型的配置，所有发送的邮件看起来好像是从 `redhat.com` 发出的，并且任何发送到\
    \ `torgo.redhat.com` 或其他主机的邮件都将投递给 `mail.redhat.com`。\n\n"
