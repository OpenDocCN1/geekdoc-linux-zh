    \ see:\n\n```\n$ rpm -Uvh foo-1.0-1.i386.rpm\n  foo     package foo-2.0-1 (which\
    \ is newer) is already installed\n  error: foo-1.0-1.i386.rpm cannot be installed\n\
    ```\n\nTo cause RPM to “upgrade” anyway, use `--oldpackage` on the command line.\n\
    \n### 7.2.4 Querying\n\nQuerying the database of installed packages is accomplished\
    \ with `rpm -q`. A simple use is `rpm -q foo` which will print the package name,\
    \ version, and release number of the installed package `foo`:\n\n```\n$ rpm -q\
    \ foo\nrpm-2.0-1\n```\n\nInstead of specifying the package name, you can use the\
    \ following options with `-Q` to specify what package(s) you want to query. These\
    \ are called *Package Specification Options*.\n\n- `-a` queries all currently\
    \ installed packages.\n- `-f <file>` will query the package owning <file>.\n-\
    \ `-F` is the same as `-f` except it takes filenames via stdin (e.g. `find /usr/bin\
    \ | rpm -qf`).\n- `-p <packagefile>` queries the package <packagefile>.\n- `-P`\
    \ is like `-p` except it takes package filenames from stdin (e.g. `find /mnt/cdrom/RedHat/RPMS\
    \ | rpm -qP`).\n\nThere are a number of ways to specify what information to display\
    \ about queried packages. The following options are used to select the information\
    \ you are interested in. These are called *Information Selection Options*.\n\n\
    - `-i` displays package information such as name, description, release, size,\
    \ build date, install date, vendor, and other miscellaneous information.\n- `-l`\
    \ displays the list of files that the package “owns”.\n- `-s` displays the state\
    \ of all the files in the package. There are only two possible states, normal\
    \ and missing.\n- `-d` displays a list of files marked as documentation (man pages,\
    \ info pages, README's, etc).\n- `-c` displays a list of files marked as configuration\
    \ files. These are the files you change after installation to adapt the package\
    \ to your system (sendmail.cf, passwd, inittab, etc).\n\nFor those options that\
    \ display file lists, you can add `-v` to your command line to get the lists in\
    \ a familiar `ls -l` format.\n\n### 7.2.5 Verifying\n\nVerifying a package compares\
    \ information about files installed from a package with the same information from\
    \ the original package. Among other things, verifying compares the size, MD5 sum,\
