    \ DEVELOPMENT LICENSE:\n\nRed Hat Linux Release 4.2 is a POSIX based operating\
    \ system. It features not found on UNIX operating systems: over 10 times as much.\n\
    \nRed Hat Linux comes with complete tools for the entire programming language\
