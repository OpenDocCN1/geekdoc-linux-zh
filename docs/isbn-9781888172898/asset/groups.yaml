    ## 配置实用程序未设置的选项


    以下关键字控制通过配置实用程序未设置的选项，需要手动编辑 Xconfig 文件。


    BackBuffer 此条目告知 X 服务器为 BackBuffer 分配屏幕外内存。


    CursorAdjustX


    CursorAdjustY 如果硬件光标没有正确定位在 X 窗口屏幕上，CursorAdjustX 和 CursorAdjustY 允许你指定一个增量（像素数）来调整光标的左右位置。


    CursorScreenOne 在多屏幕配置中，此设置将光标限制在屏幕 0 上。


    NoBackingStore 此选项关闭后备存储。后备存储是一项服务器功能，允许程序创建复杂的绘图，并由服务器自动处理暴露请求，从而避免冗长的重绘周期。后备存储使用系统内存来保存窗口内容，如果在内存有限的情况下，实际上可能会减慢系统速度。


    NoCursorWrap 在多屏幕配置中，此设置防止光标从屏幕 1 回绕到屏幕 0。


    NoFontCache 此选项关闭字体缓存。


    NoKeyboard 此设置禁止键盘输入。


    NoLEDS 服务器不处理 LED。


    NoPixmapCache 此选项关闭像素图（pixmap）和点画（stipple）缓存。


    NotPrimaryMonitor 不为虚拟终端支持进行控制台处理。这通常用于 X 在并非驱动控制台的显卡上运行时。


    Option <string> 指定传递给服务器的特殊选项。这可能指定显卡型号或通常不使用的特定功能。通常，configX 会在 Xconfig 文件中插入正确的选项。


    Option HardwarePex 在 Xconfig 文件中添加此行以在 Matrox MGA Impression Plus 显卡上使用硬件 Z 缓冲器。此文件条目必须紧跟在
    Driver MGA 条目之后。


    Option NoHardwareCursor 添加此行以禁用硬件光标支持。此文件条目必须紧跟在 Driver 条目之后。


    RemapCursorPad 此配置使 X 服务器为小键盘箭头键和光标垫箭头键返回不同的键码。这是 X 协议的一个轻微违规，但它允许客户端区分这些按键。


    SnfFormat <数字> <数字> <数字> <数字> Metro-X X11.5 可以读取 X11.4 SNF（Server Natural Format）字体。由于没有
    SNF 字体的标准，可以调整以下四个数字以读取大多数 SNF 字体。这四个数字参数代表以下通常内置于服务器编译时的值：


    - BITMAP_BIT_ORDER

    - IMAGE_BYTE_ORDER

    - GLYPHPADBYTES

    - BITMAP_SCANLINE_UNIT


    例如，要读取 SCO SNF 字体，请向 `Xconfig` 文件中添加此行：


    ```

    SnfFormat 1 0 1 1

    ```


    或者，要读取与 Interactive Systems Corporation 的 X11 R4 兼容的 SNF 字体，请向 `Xconfig` 文件中添加此行：


    ```

    SnfFormat 1 1 4 4

    ```


    Terminate Terminate 导致服务器在最后一个客户端断开连接时退出。通常，xinit 会在服务器重置之前，在最后一个客户端断开连接时终止 X
    服务器。


    Trace <数字> 这会打印额外的调试信息。


    VideoRam <数字> 指定显卡上的视频内存量，以 1024 字节单位指定（1 MB 等于 1024）。X 服务器通常检测卡上的内存量。


    VisualClass <数字> 使用 `/usr/include/X11/X.h` 中的默认 VisualClass，并基于下表：


    | 视觉类 | 编号 |

    | --- | :--- |

    | StaticGray | 0 |

    | GrayScale | 1 |

    | StaticColor | 2 |

    | PseudoColor | 3 |

    | TrueColor | 4 |

    | DirectColor | 5 |


    图 B.2：视觉类


    在单色监视器上，应在 Xconfig 文件中添加行


    ```

    VisualClass 1

    ```


    ### B.2.4 模式


    **Xconfig** 文件的最后一部分是模式数据库（**Modes**）。它包含各种分辨率的 VESA 时序规范。默认值适用于大多数显卡，但可以进行调整以在监视器上居中和调整图像大小。大多数
    Metro-X 服务器使用此数据库来配置显卡以进入图形模式。数字表示 DisplayConfig 文件中 CLOCKS 行使用的哪个时钟，并显示水平和垂直时序值。更具体地说，数字的一个示例是：


    ```

    ''1024x768'' 65 1024 1092 1220 1344 768 786 791 810

    ```


    下表显示了之前示例中每个模式数字的定义。


    | 数值 | 含义 |

    | :--- | :--- |

    | "1024X768" | 屏幕分辨率（像素） |

    | 65 | 像素时钟 (MHz) |

    | 1024 | 显示像素 (H) |

    | 1092 | 同步开始 (H) |

    | 1220 | 同步结束 (H) |

    | 1344 | 总计 (H) |

    | 768 | 显示像素 (V) |

    | 786 | 同步开始 (V) |

    | 791 | 同步结束 (V) |

    | 810 | 总计 (V) |


    图 B.3：模式定义


    这些数字代表电子束在每次垂直刷新屏幕时经过的范围。它们决定了图像在屏幕上的位置以及刷新率。


    ## 调整图像位置


    如果屏幕图像未正确居中或充满监视器屏幕，你可以编辑模式数字。确保在拉伸或缩小图像之前先居中图像。你做的任何调整将在重启 X 服务器后生效。


    **图像居中：**


    **显示像素** 数字必须与所需的物理屏幕分辨率匹配。**同步开始** 和 **同步结束** 数字必须同时增加或减少（向左或向右移动；向上或向下移动）相同的量，并且保持在
    **显示** 和 **总计** 值的范围内。


    - 图像太靠右：要调整太靠右的图像，请同等增加 **水平同步开始** 和 **水平同步结束** 值。

    - 图像太靠左：要调整太靠左的图像，请同等减少 **水平同步开始** 和 **水平同步结束** 值。例如，要调整太靠左的图像，你可以从将两个水平时序数字（**同步开始**
    和 **同步结束**）增加 8 开始。确保 **同步结束** 数字不超过 **水平总计** 数字。

    - 相同的技巧适用于垂直定位：

    - 图像太低：要调整太靠下的图像，请同等减少 **垂直同步开始** 和 **垂直同步结束** 值。

    - 图像太高：要调整太靠上的图像，请同等增加 **垂直同步开始** 和 **垂直同步结束** 值。例如，要调整太高的图像，你可以从将两个垂直时序数字（**同步开始**
    和 **同步结束**）增加 8 开始。确保 **同步结束** 数字不超过 **垂直总计** 数字。


    **拉伸或缩小图像：**


    **显示像素** 数字必须与所需的物理屏幕分辨率匹配。**总计** 值增加或减少以拉伸或缩小图像。此外，为了保持中心位置，**同步开始** 和 **同步结束**
    数字必须根据更改后的 **总计** 值差值的一半进行同等增加或减少。例如，如果你向 **水平总计** 值添加了 10，你也应该向 **水平同步开始** 值添加
    5，向 **水平同步结束** 值添加 5。


    '
