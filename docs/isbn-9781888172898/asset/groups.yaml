  md: "\n# 10.5.2 Init Runlevels\n\n- The kernel looks in several places for init\
    \ and runs the first one it finds\n- init runs /etc/rc.d/rc.sysinit\n- rc.sysinit\
    \ does a bunch of necessary things and then runs rc.serial (if it exists)\n- init\
    \ runs all the scripts for the default runlevel.\n- init runs rc.local\n\nThe\
    \ default runlevel is decided in /etc/inittab. You should have a line close to\
    \ the top like:\n\n`id:3:initdefault:`\n\nFrom this, you'd look in the second\
    \ column and see that the default runlevel is 3, as should be the case for most\
    \ systems. If you want to change it, you can edit /etc/inittab by hand and change\
    \ the 3. Be very careful when you are messing with the initab. If you do mess\
    \ up, you can fix it by rebooting and doing:\n\n`LILO boot: linux single`\n\n\
    This should allow you to boot into single user mode so you can fix initab. Now,\
    \ how does it run all the right scripts? If you enter `ls -l` on rc3.d, you might\
    \ see something like:\n\n```\nlrwxrwxrwx 1 root root 17  13:11  S10network ->\
    \ ../init.d/network\nlrwxrwxrwx 1 root root 16  13:11  S30syslog -> ../init.d/syslog\n\
    lrwxrwxrwx 1 root root 14  13:32  S40cron -> ../init.d/cron\nlrwxrwxrwx 1 root\
    \ root 14  13:11  S50inet -> ../init.d/inet\nlrwxrwxrwx 1 root root 13  13:11\
    \  S60nfs -> ../init.d/nfs\nlrwxrwxrwx 1 root root 15  13:11  S70nfsfs -> ../init.d/nfsfs\n\
    lrwxrwxrwx 1 root root 18  13:11  S90lpd -> ../init.d/lpd.init\nlrwxrw-r-x 1 root\
    \ root 11  13:11  S99local -> ../rc.local\n```\n\nWhat you'll notice is that there\
    \ are no real \"files\" in the directory. Everything there is a link to one of\
    \ the scripts in the init.d directory. The links also have an \"S\" and a number\
    \ at the beginning. The \"S\" means to start this particular script and a \"K\"\
    \ would mean to stop it. The number is there just for ordering purposes. Init\
    \ will start all the services based on the order they appear. You can duplicate\
    \ numbers, but it will only confuse you somewhat. You just need to use a two digit\
    \ number only, along with an upper case \"S\" or \"K\" to start or stop the services\
    \ you need to.\n\nHow does init start and stop services? Simple. Each of the scripts\
    \ is written to accept an argument which can be \"start\" and \"stop\". You can\
    \ execute those scripts by hand in fact with a command like:\n\n```\n/etc/rc.d/init.d/httd.init\
    \ stop\n```\n\nto stop the httd server. Init just reads the name and if it has\
    \ a \"K\", it calls the script with the \"stop\" argument. If it has an \"S\"\
    \ it calls the script with a \"start\" argument. Why all these rulelevels? Some\
    \ people want an easy way to set up machines to be multi-purpose. I could have\
    \ a \"server\" runlevel that just runs httd, sendmail, networking, etc. Then I\
    \ could have a \"user\" runlevel that runs xdm, networking, etc.\n\nGenerally,\
    \ Red Hat Linux runs in run level 3–full multiuser mode. The following runlevels\
    \ are used in Red Hat Linux:\n\n- 0 Halt.\n- 1 Single user mode.\n- 2 Multiuser\
    \ mode, without NFS.\n- 3 Full multiuser mode.\n- 6 Reboot.\n\nIf your machine\
    \ gets into a state where it will not boot due to a bad /etc/inittab, or will\
    \ not let you log in because you have a corrupted /etc/passwd or have simply forgotten\
    \ your password, boot into single user mode by typing `linux 1` at the LILO boot\
    \ prompt. A very bare system will come up and you will be given a shell from which\
    \ you can fix things.\n\n## 10.5.3 Shutting Down\n\nTo shutdown Red Hat Linux,\
    \ issue the `shutdown` command. You can read the shutdown man page for complete\
    \ details, but the two most common usages are:\n\n```\nshutdown -h now\nshutdown\
    \ -r now\n```\n\nEach will cleanly shutdown the system. After shutting everything\
    \ down, the first will halt the machine, and the second will reboot.\n\nAvoid\
    \ running the `reboot` or `halt` commands directly in order to prevent damage\
    \ to your filesystem.\n\n# 10.6 Rescue Modes\n\nWhen things go wrong, there are\
    \ several ways to work on fixing them. However, they require that you understand\
    \ the system well. This manual can't teach you what to do, but we will present\
    \ the ways that you can use our products to get into rescue modes where you can\
    \ use your own knowledge to rescue the system.\n\n## 10.6.1 Through LILO\n\nIf\
    \ your system boots, but does not allow you to log in when it has completed booting,\
    \ you can use the **single or emergency boot option**. At the `LILO boot:` prompt,\
    \ type `linux single` in order to boot in single-user mode. In single-user mode,\
    \ your local filesystems will be mounted, but your network will not be activated.\
    \ In emergency mode, almost nothing will be set up. Only the root filesystem will\
    \ be mounted, and it will be mounted read-only.\n\n## 10.6.2 Emergency Boot Floppies\n\
    \nThe installation floppy set can also be used as a rescue disk set. When you\
    \ boot the boot floppy, type `rescue` at the boot prompt (on non-Intel platforms,\
    \ add `rescue` as an option to the kernel you are booting, for example, `linux\
    \ rescue`), and the install process will ask a few questions, request, that you\
    \ insert the second disk, and set up shells on VC 1 and VC 2. The shell that is\
    \ running is `ash`, a minimal bourne shell with no history or command-line editing.\n\
    \nThe `PATH` environment variable is set so that once you have mounted your root\
    \ partition on `/mnt`, binaries from your root partition will be run if they do\
    \ not exist on the floppy. Also, the libraries in `/mnt/lib` and `/mnt/usr/lib`\
    \ will be used if needed. You may wish to change your `PATH` to not include `/bin`\
    \ and `/usr/bin`, leaving `/mnt/bin`, `/mnt/usr/bin`, etc., while you are working\
    \ on repairing your system. If you do that, you will need to use `/bin/umount`\
    \ to unmount `/mnt`.\n\nLimited versions of important utilities are available\
    \ before you mount `/mnt`:\n\n- `mount` The mount command does not require that\
    \ the device node being mounted already exist, and doesn't require the full name\
    \ of the device. It assumes ext2 filesystems unless told otherwise.\n  \n  ```\n\
    \  mount /dev/sda1 /mnt -t ext2\n  ```\n  \n  is functionally equivalent to\n\
    \  \n  ```\n  mount sda1 /mnt\n  ```\n- `ash` The full version\n- `cat` Does not\
    \ accept any options\n- `chmod` The `chmod` command does not accept symbolic mode\
    \ names, only octal ones.\n- `cpio` The full version\n- `e2fsck` The full version\n\
    - `fdisk` The full version\n- `gzip` The full version\n- `gunzip` The full version\n\
    - `insmod` The full version\n- `ls` The full version\n- `lsmod` Does not accept\
    \ any options\n- `mkdir` No GNU long options\n- `mke2fs` The full version\n- `ln`\
    \ The `ln` command does not accept symbolic mode names, only octal ones.\n- `open`\
    \ The full version\n- `rm` No GNU long options\n- `rmmod` The full version\n-\
    \ `sh` Symlink to ash\n\n# Appendix A\n\n# Module parameters\n\nThis appendix\
    \ is provided to illustrate *some* of the possible parameters that *may* be needed\
    \ by certain driver modules. It should be noted that in most cases the use of\
    \ additional parameters is not needed.\n\n## A.1 CD-ROM parameters\n\n| Hardware\
    \ | Parameter |\n| :--- | :--- |\n| Mitsumi CD-ROM | mcd=port,irq |\n| Sony CDU\
    \ 31 or 33 CD-ROM | cdu31a_port=base_addr cdu31a_irq=irq |\n| Aztech CD268 | aztcd=port\
    \ |\n| SB Pro or 16 compatible | sbpcd=io_addr,sb_pro_setting |\n| ATAPI/IDE CD-ROM\
    \ Drives | hrd=cdrom |\n\nExamples of the above would be:\n\n| Configuration |\
    \ Example |\n|---|---|\n| non-IDE Mitsumi CD-ROM on port 340, IRQ 11 | mcd=0x340,11\
    \ |\n| Sony CDU 31 or 33 at port 340, no IRQ | cdu31a_port=0x340 cdu31a_irq=0\
    \ |\n| Aztec CD-ROM at port 220 | aztcd=0x220 |\n| ATAPI CD-ROM, jumpered as master\
    \ on 2nd interface | hdc=cdrom |\n| Panasonic-type CD-ROM on a SoundBlaster at\
    \ port 230 | sbpcd=0x230,1 |\n\n**Please Note:** Most newer Sound Blaster cards\
    \ come with IDE interfaces. You do not need to use sbpcd parameters, only use\
    \ hdc parameters.\n\n## A.2 SCSI parameters\n\n| Hardware | Parameter |\n|---|---|\n\
    | SCSI Seagate ST0x | controller_type=1 base_address=shmemaaddr irq=irq |\n| SCSI\
    \ Future Domain TMC-8xx | controller_type=2 base_address=shmemaaddr irq=irq |\n\
    | SCSI Trantor TI28 | ti28=base_addr,irq |\n| SCSI NCR-5380 Based | ncr5380=port,irq,dma_channel\
    \ |\n| Adaptec 152x, SB SCSI | aha152x=port,irq,scsi_id,reconnect,parity |\n|\
    \ Adaptec 1542 | bases=base_addr |\n| Buslogic | buslogic=base_addr |\n| Pro Audio\
    \ Spectrum / Studio 16 | pas16=port,irq |\n\nSome examples would be:\n\n| Configuration\
    \ | Example |\n|---|---|\n| Adaptec AHA1522 at port 330, IRQ 11, SCSI ID 7 | aha152x=0x330,11,7\
    \ |\n| Adaptec AHA1542 at port 330 | bases=0x330 |\n| Future Domain TMC-800 at\
    \ CA000, IRQ 10 | controller_type=2 base_address=0xca000 irq=10 |\n"
  mdcn: "\n# 10.5.2 启动运行级别\n\n-   内核会在几个位置查找 init，并运行第一个找到的\n-   init 运行 /etc/rc.d/rc.sysinit\n\
    -   rc.sysinit 执行一系列必要操作，然后运行 rc.serial（如果它存在的话）\n-   init 运行默认运行级别的所有脚本\n-  \
    \ init 运行 rc.local\n\n默认运行级别在 /etc/inittab 中决定。你应该在文件顶部附近看到类似如下的行：\n\n`id:3:initdefault:`\n\
    \n根据此，你会查看第二列，发现默认运行级别是 3，这对于大多数系统来说应该是正常的。如果你想改变它，你可以手动编辑 /etc/inittab 并更改 3。在修改\
    \ inittab 时要非常小心。如果你搞乱了，你可以通过重启并执行以下操作来修复：\n\n`LILO boot: linux single`\n\n这将允许你启动到单用户模式，以便你可以修复\
    \ inittab。现在，它是如何运行所有正确的脚本的呢？如果你在 rc3.d 目录下输入 `ls -l`，你可能会看到类似以下内容：\n\n```\nlrwxrwxrwx\
    \ 1 root root 17  13:11  S10network -> ../init.d/network\nlrwxrwxrwx 1 root root\
    \ 16  13:11  S30syslog -> ../init.d/syslog\nlrwxrwxrwx 1 root root 14  13:32 \
    \ S40cron -> ../init.d/cron\nlrwxrwxrwx 1 root root 14  13:11  S50inet -> ../init.d/inet\n\
    lrwxrwxrwx 1 root root 13  13:11  S60nfs -> ../init.d/nfs\nlrwxrwxrwx 1 root root\
    \ 15  13:11  S70nfsfs -> ../init.d/nfsfs\nlrwxrwxrwx 1 root root 18  13:11  S90lpd\
    \ -> ../init.d/lpd.init\nlrwxrw-r-x 1 root root 11  13:11  S99local -> ../rc.local\n\
    ```\n\n你会发现该目录中没有实际的“文件”。那里的一切都是链接到 init.d 目录中脚本之一的链接。链接还在开头有一个“S”和一个数字。“S”表示启动这个特定的脚本，而“K”则表示停止它。数字仅用于排序目的。Init\
    \ 将根据它们出现的顺序启动所有服务。你可以重复数字，但这会稍微让你困惑。你只需要使用两位数数字，配合大写的“S”或“K”来启动或停止你需要的服务即可。\n\
    \nInit 如何启动和停止服务？很简单。每个脚本都编写为接受一个参数，可以是“start”或“stop”。事实上，你可以通过如下命令手动执行这些脚本：\n\
    \n```\n/etc/rc.d/init.d/httd.init stop\n```\n\n以停止 httd 服务器。Init 只是读取名称，如果它带有“K”，它就以“stop”参数调用脚本。如果它带有“S”，它就以“start”参数调用脚本。为什么需要所有这些运行级别？有些人希望有一种简单的方式来设置机器以实现多用途。我可以有一个“server”运行级别，只运行\
    \ httd、sendmail、网络等。然后我可以有一个“user”运行级别，运行 xdm、网络等。\n\n通常，Red Hat Linux 运行在运行级别\
    \ 3–完全多用户模式下。Red Hat Linux 中使用以下运行级别：\n\n- 0 停机。\n- 1 单用户模式。\n- 2 多用户模式，无 NFS。\n\
    - 3 完全多用户模式。\n- 6 重启。\n\n如果你的机器进入了一种无法启动的状态，原因是 /etc/inittab 损坏，或者无法登录，原因是 /etc/passwd\
    \ 损坏或你单纯忘记了密码，请在 LILO 启动提示符处输入 `linux 1` 以进入单用户模式启动。一个非常基本的系统会启动，你会被赋予一个 shell，从中你可以修复问题。\n\
    \n## 10.5.3 关机\n\n要关机 Red Hat Linux，请发出 `shutdown` 命令。你可以阅读 shutdown 手册页获取完整细节，但两种最常用的用法是：\n\
    \n```\nshutdown -h now\nshutdown -r now\n```\n\n每个都会干净地关闭系统。关闭所有服务后，第一个将停止机器，第二个将重启。\n\
    \n为了避免对文件系统造成损坏，请避免直接运行 `reboot` 或 `halt` 命令。\n\n# 10.6 救援模式\n\n当出现问题时，有几种方法可以着手修复。然而，它们需要你很好地理解系统。本手册无法教你该做什么，但我们将会展示如何使用我们的产品进入救援模式，在那里你可以利用自己的知识来救援系统。\n\
    \n## 10.6.1 通过 LILO\n\n如果你的系统可以启动，但在完成启动后不允许你登录，你可以使用**单用户或紧急启动选项**。在 `LILO boot:`\
    \ 提示符处，输入 `linux single` 以单用户模式启动。在单用户模式下，你的本地文件系统将被挂载，但你的网络将不会激活。在紧急模式下，几乎什么也不会设置。只有根文件系统会被挂载，并且是以只读方式挂载。\n\
    \n## 10.6.2 紧急启动软盘\n\n安装软盘组也可用作救援磁盘组。当你启动启动软盘时，在启动提示符处输入 `rescue`（在非 Intel 平台上，将\
    \ `rescue` 作为选项添加到你要启动的内核中，例如 `linux rescue`），安装过程会问几个问题，请求你插入第二张磁盘，并在 VC 1 和\
    \ VC 2 上设置 shell。正在运行的 shell 是 `ash`，一个没有历史记录或命令行编辑的最小 Bourn shell。\n\n`PATH`\
    \ 环境变量被设置，使得一旦你将根分区挂载在 `/mnt` 上，如果你的软盘上不存在根分区上的二进制文件，它们将被运行。此外，如有需要，`/mnt/lib`\
    \ 和 `/mnt/usr/lib` 中的库将被使用。在修复系统时，你可能希望更改你的 `PATH` 以不包含 `/bin` 和 `/usr/bin`，而保留\
    \ `/mnt/bin`、`/mnt/usr/bin` 等。如果你那样做，你需要使用 `/bin/umount` 来卸载 `/mnt`。\n\n在挂载 `/mnt`\
    \ 之前，重要实用程序的有限版本可用：\n\n- `mount` mount 命令不要求被挂载的设备节点已经存在，也不要求设备的完整名称。除非另有说明，否则它假设是\
    \ ext2 文件系统。\n  \n  ```\n  mount /dev/sda1 /mnt -t ext2\n  ```\n  \n  功能等同于\n\
    \  \n  ```\n  mount sda1 /mnt\n  ```\n- `ash` 完整版本\n- `cat` 不接受任何选项\n- `chmod`\
    \ `chmod` 命令不接受符号模式名称，只接受八进制名称。\n- `cpio` 完整版本\n- `e2fsck` 完整版本\n- `fdisk` 完整版本\n\
    - `gzip` 完整版本\n- `gunzip` 完整版本\n- `insmod` 完整版本\n- `ls` 完整版本\n- `lsmod` 不接受任何选项\n\
    - `mkdir` 无 GNU 长选项\n- `mke2fs` 完整版本\n- `ln` `ln` 命令不接受符号模式名称，只接受八进制名称。\n- `open`\
    \ 完整版本\n- `rm` 无 GNU 长选项\n- `rmmod` 完整版本\n- `sh` 指向 ash 的符号链接\n\n# 附录 A\n\n# 模块参数\n\
    \n本附录旨在说明某些驱动程序模块可能需要*的一些*可能的参数。需要注意的是，在大多数情况下，不需要使用额外的参数。\n\n## A.1 CD-ROM 参数\n\
    \n| 硬件 | 参数 |\n| :--- | :--- |\n| Mitsumi CD-ROM | mcd=port,irq |\n| Sony CDU\
    \ 31 或 33 CD-ROM | cdu31a_port=base_addr cdu31a_irq=irq |\n| Aztech CD268 | aztcd=port\
    \ |\n| SB Pro 或 16 兼容 | sbpcd=io_addr,sb_pro_setting |\n| ATAPI/IDE CD-ROM 驱动器\
    \ | hrd=cdrom |\n\n上述的示例包括：\n\n| 配置 | 示例 |\n|---|---|\n| 非 IDE 的 Mitsumi CD-ROM，位于端口\
    \ 340，IRQ 11 | mcd=0x340,11 |\n| Sony CDU 31 或 33，位于端口 340，无 IRQ | cdu31a_port=0x340\
    \ cdu31a_irq=0 |\n| Aztec CD-ROM，位于端口 220 | aztcd=0x220 |\n| ATAPI CD-ROM，跳线设置为第二接口的主设备\
    \ | hdc=cdrom |\n| Panasonic 型 CD-ROM，位于 SoundBlaster，端口 230 | sbpcd=0x230,1 |\n\
    \n**请注意：**大多数较新的 Sound Blaster 声卡都带有 IDE 接口。你不需要使用 sbpcd 参数，只需使用 hdc 参数即可。\n\n\
    ## A.2 SCSI 参数\n\n| 硬件 | 参数 |\n|---|---|\n| SCSI Seagate ST0x | controller_type=1\
    \ base_address=shmemaaddr irq=irq |\n| SCSI Future Domain TMC-8xx | controller_type=2\
    \ base_address=shmemaaddr irq=irq |\n| SCSI Trantor TI28 | ti28=base_addr,irq\
    \ |\n| SCSI NCR-5380 Based | ncr5380=port,irq,dma_channel |\n| Adaptec 152x, SB\
    \ SCSI | aha152x=port,irq,scsi_id,reconnect,parity |\n| Adaptec 1542 | bases=base_addr\
    \ |\n| Buslogic | buslogic=base_addr |\n| Pro Audio Spectrum / Studio 16 | pas16=port,irq\
    \ |\n\n一些示例包括：\n\n| 配置 | 示例 |\n|---|---|\n| Adaptec AHA1522，位于端口 330，IRQ 11，SCSI\
