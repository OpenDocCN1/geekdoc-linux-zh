    \n**Xconfigurator** 是一个全屏菜单驱动的程序，它引导你设置 X 服务器。**XF86Setup** 是随 XFree86 分发的图形设置程序，需要\
    \ VGA 16 色服务器才能运行。**xf86config** 是随 XFree86 分发的基于行的程序。它不像 **Xconfigurator** 那样易于使用，但为了完整性而包含在内。如果这些实用程序无法提供可用的\
