    \ and worry-free. Release 4.2 contains a unique combination of tools that automate\
    \ most of the tasks that make a Linux system harder when installing, uninstalling,\
    \ and upgrading software packages.\n\n## ADVANCED SYSTEM AND NETWORK SECURITY\
    \ FEATURES.\n\nThe flexibility of the RPM system is what has allowed Red Hat Linux\
    \ to earn the reputation as one of the most secure operating systems available.\
    \ Almost as soon as security problems are found on the Internet, Red Hat Software\
    \ releases new or updated packages to cope with the new threat, saving you time\
    \ and reducing the possibility of compromise. Release 4.2 of Red Hat Linux supports\
    \ standard \"UNIX\" password authentication, as well as \"Shadow\" passwords for\
    \ additional security. The Pluggable Authentication Module (PAM) system allows\
    \ additional authentication methods to be written and dynamically added to the\
    \ system to support your special security needs.\n\n## UPGRADE FROM PREVIOUS RELEASES.\n\
    \nBecause Red Hat Linux Release 4.2 is built with advanced RPM technology, your\
    \ system will never become obsolete. As new releases become available you can\
    \ upgrade any or all of your components to the newest versions using a simple\
    \ upgrade program that does all the work for you. Users of Red Hat Linux releases\
    \ 2.0 and higher can upgrade to 4.2 simply and easily.\n\n![](img/06353bca937b38b02602dcfb58824d72_267_0.png)\n\
