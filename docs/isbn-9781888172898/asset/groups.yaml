    ```\n\nSee D.6 for more information on the commands available.\n\nAnother (rather\
    \ sneaky) way of loading MILO via the WNT ARC firmware is to put MILO onto an\
    \ MS-DOS floppy and call it `fwupdate.exe` and then choose the \"Upgrade Firmware\"\
    \ option.\n\n## D.5.2 Loading MILO from the Windows NT AlphaBIOS\n\nWith the introduction\
    \ of the XLT series, Digital changed the system console interface for its NT systems\
    \ from ARC to AlphaBIOS. AlphaBIOS is a screen-oriented interface which should\
    \ be more familiar to PC users. This change in console interface necessitates\
    \ a change in setup procedure for those who wish to run Linux/Alpha on AlphaBIOS-based\
    \ systems.\n\nThe first thing you must do is to install the latest version of\
    \ AlphaBIOS on your system. This can be obtained from Digital's \"System Software\
    \ and Driver Updates\" Web page, `http://www.windows.digital.com/support/syssoft.htp`.\
    \ Download the ZIP file, unzip it, and install it as follows:\n\n- Copy the files\
    \ to a FAT-formatted floppy\n- Turn on the system and insert the floppy. At the\
    \ opening screen, press F2 to go into setup mode\n- Select \"Upgrade AlphaBIOS\"\
    \n- Follow the directions on the screen\n\nOnce your AlphaBIOS is at the latest\
    \ revision level, you can start bootstrapping your system as follows:\n\n- Create\
    \ a FAT-formatted floppy with the following files:\n    - linux.exe (from this\
    \ directory)\n    - milo (the version appropriate to your system)\n- Turn on the\
    \ system and insert the floppy. At the opening screen, press F2 to go into setup\
    \ mode\n- Select \"Utilities->OS Selection Setup...\"\n- Press INSERT to add a\
    \ new operating system selection\n- For \"Boot Name\", enter something like \"\
    Linux\". Press TAB to get over to the next field.\n- Press down-arrow until the\
    \ selection for \"Boot File\" is \"A:\". TAB over to the next field\n- Enter \"\
    linload.exe\". TAB *twice* (i.e. skip the OS Path load device - it's irrelevant)\n\
    - Enter \"\\\\\" for the OS Path load file\n- Press ENTER to add the selection.\n\
    \nAt this point, AlphaBIOS will probably put up a big, unfriendly dialog box labelled\
    \ \"Warning: Operating System Selection not valid\". Ignore this error (it's only\
    \ a problem for NT) and press ENTER to continue.\n\n- Press F10 to save the changes\
    \ you just made; press ENTER to confirm the changes.\n- Press ESC twice to get\
    \ back to the opening screen.\n- Use the up and down arrows to select the boot\
    \ selection you just added, and press ENTER to boot it.\n- AlphaBIOS will load\
    \ linload, which will in turn load MILO. When you get to the MILO prompt, proceed\
    \ as you would for a normal ARC-based system installation.\n\nIf you dedicated\
    \ the first partition of your first disk drive to a small FAT partition for booting\
    \ (as the installation procedure advises you to), then once Linux is installed\
    \ you should copy `linload.exe` and `milo` to this partition. Once you shut down,\
    \ you can then modify the Linux menu selection to load MILO from this partition\
    \ as follows:\n\n- At the opening screen, select F2 to go into setup mode\n- Select\
    \ \"Utilities->OS Selection setup\"\n- Highlight the entry for Linux, then press\
    \ F6 to edit it.\n- TAB over to the device portion of the \"Boot File\" line.\
    \ Use the up and down arrow keys to select the hard-disk partition where linload\
    \ and milo reside (typically \"Disk 1 Partition 1\"). Press ENTER to confirm the\
    \ selection\n- If you wish to auto-boot linux after MILO is loaded, then TAB over\
    \ to the \"OS Options\" line and enter the MILO command to boot the system, e.g.\
    \ \"boot sda2: vmlinuz.gz\". Press ENTER to confirm the selection.\n- Press F10\
    \ to save the changes. Press ENTER to confirm.\n\nOnce you have done this, booting\
    \ and running Linux on an AlphaBIOS based system should be very similar to doing\
    \ so on an ARC system.\n\n## D.5.3 Loading MILO from the Evaluation Board Debug\
    \ Monitor\n\nEvaluation boards (and often designs cloned from them) include support\
    \ for the Alpha Evaluation Board Debug Monitor. Consult your system documentation\
    \ before considering this method of booting MILO. The following systems are known\
    \ to include Debug Monitor support:\n\n- AlphaPC64 (Section D.5.7)\n- EB64+ (Section\
    \ D.5.7)\n- EB66+ (Section D.5.7)\n- EB164 (Section D.5.7)\n- PC164 (Section D.5.7)\n\
    \nBefore you consider this method, you should note that the early versions of\
    \ the Evaluation Board Debug Monitor did not include video or keyboard drivers\
    \ and so you must be prepared to connect another system via the serial port so\
    \ that you can use the Debug Monitor. Its interface is very simple and typing\
    \ `help` shows a whole heap of commands. The ones that are most interesting include\
    \ the word `boot` or `load` in them.\n\nThe Evaluation Board Debug Monitor can\
    \ load an image either via the network (`netboot`) or via a floppy (`floot`).\
    \ In either case, set the boot address to `0x200000` (`> bootaddr 200000`) before\
    \ booting the image.\n\nIf the image is on floppy (and note that only DOS formatted\
    \ floppies are supported), then you will need to type the following command:\n\
    \n```\nAlphaPC64> floot <MILO-image-name>\n```\n\n## D.5.4 Loading MILO from a\
    \ Failsafe Boot Block Floppy\n\nOnly the AxpPCI33 is *known* to include failsafe\
    \ boot block floppy support (Section D.5.7).\n\nIf you do not have a standard\
    \ pre-built MILO `.dd` image, then you may need to build an SRM boot block floppy.\
    \ Once you have built MILO, you need to do the following on Digital Unix box:\n\
    \n```\nfdisk -fm /dev/rfd0a\ncat mboot bootm > /dev/rfd0a\ndisklabel -rw rfd0a\
    \ 'rx23' mboot bootm\n```\n\nOr on a Linux box:\n\n```\ncat mboot bootm > /dev/fd0\n\
    ```\n\nIf you have a standard MILO image available (say MILO.dd) then you would\
    \ build a boot block floppy using the following command:\n\n```\ndd if=MILO.dd\
    \ of=/dev/fd0\n```\n\n## D.5.5 Loading MILO from Flash\n\nThere are a number of\
    \ systems where MILO can be blown into flash and booted directly (instead of via\
    \ the Windows NT ARC firmware):\n\n- AlphaPC64 (Section D.5.7)\n- Noname (Section\
    \ D.5.7)\n- EB66+ (Section D.5.7)\n- EB164 (Section D.5.7)\n- PC164 (Section D.5.7)\n\
    \n## D.5.6 Loading MILO from the SRM Console\n\nThe SRM (short for System Reference\
    \ Manual) Console knows nothing about file systems or disk-partitions, it simply\
    \ expects that the secondary bootstrap loader occupies a consecutive range of\
    \ physical disk sectors starting from a given offset. The information describing\
    \ the secondary bootstrap loader (its size and offset) is given in the first 512\
    \ byte block. To load MILO via the SRM you must generate that structure on a device\
    \ which the SRM can access (such as a floppy disk). This is what `mboot` and `bootm`\
    \ do; `mboot` is the first block (or boot description) and `bootm` is the MILO\
    \ image rounded up to a 512 byte boundary.\n\nTo load MILO from a boot block device,\
    \ either build `mboot` and `bootm` and push them onto the boot device using the\
    \ following command:\n\n```\n$ cat mboot bootm > /dev/fd0\n```\n\nOr, grab the\
    \ appropriate `MILO.dd` from a web site and write it onto the boot device using\
    \ either `RAWRITE.EXE` or `dd`.\n\nOnce you have done that you can boot the SRM\
    \ console and use one of its many commands to boot MILO. For example, to boot\
    \ MILO from a boot block floppy you would use the following command:\n\n```\n\
    >>boot dva0\n(boot dva0 0.0.0.1 -flags 0)\nblock 0 of dva0.0.0.0.1 is a valid\
    \ boot block\nreading 621 blocks from dva0.0.0.0.1\nbootstrap code read in\nbase\
    \ = 112000, image_start = 0, image_bytes = 4da00\ninitializing HWRB at 2000\n\
    initializing page table at 104000\ninitializing machine state\nsetting affinity\
    \ to the primary CPU\njumping to bootstrap code\nMILO Stub: V1.1\nUnzipping MILO\
    \ into position\nAllocating memory for unzip\n####...\n```\n\nThe following systems\
    \ are *known* to have SRM Console support:\n"
