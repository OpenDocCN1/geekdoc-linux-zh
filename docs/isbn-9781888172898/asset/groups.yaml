    要构建单体内核，你遵循与构建模块化内核相同的步骤，但有少数例外。\n\n- 在配置内核时，仅对问题回答 **Yes** 和 **No**（不要将任何内容制作成模块）。\n\
    - 省略以下步骤：\n  - `make modules`\n  - `make modules_install`\n- 编辑文件 `/etc/rc.d/rc.sysinit`\
    \ 并通过在行首插入 “#” 来注释掉 `depmod -a` 这一行。\n\n## 5.2 使用 XFree86 配置 X Window\n\n在你的机器上配置\
    \ XFree86 有四种方法：**Xconfigurator**、**XF86Setup**、**xf86config** 或手动配置。**Xconfigurator**、**XF86Setup**\
