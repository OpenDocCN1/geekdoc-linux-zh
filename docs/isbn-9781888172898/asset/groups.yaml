  mdcn: "\n## 作品的源代码\n作品的源代码是指为了对作品进行修改而首选的形式。对于可执行作品，完整的源代码意味着包含该作品的所有模块的源代码，以及任何相关的接口定义文件，以及用于控制可执行文件的编译和安装的脚本。但是，作为特殊例外，分发的源代码不必包含通常在可执行文件运行的操作系统的主要组件（编译器、内核等）中以（源代码或二进制形式）正常分发的任何内容，除非该组件本身随可执行文件一起分发。\n\
    \n如果通过提供从指定位置复制的访问权限来分发可执行文件或目标代码，那么提供从相同位置复制源代码的等效访问权限也算作源代码的分发，尽管并未强迫第三方将源代码与目标代码一起复制。\n\
    \n## 4\n除本许可证明确提供的情况外，您不得复制、修改、再许可或分发程序。否则复制、修改、再许可或分发程序的任何尝试均无效，并将自动终止您根据本许可证享有的权利。但是，只要接受方完全遵守本许可证，您基于本许可证向其提供的副本或权利并不会使其许可证终止。\n\
    \n## 5\n由于您未签署本许可证，您无需接受本许可证。然而，除此之外，没有任何其他东西授予您修改或分发程序或其衍生作品的权限。如果您不接受本许可证，这些行为将受到法律禁止。因此，通过修改或分发程序（或任何基于程序的作品），您即表示您同意接受本许可证以执行上述操作，并同意本许可证中关于复制、分发或修改程序或基于它的所有作品的条款和条件。\n\
    \n## 6\n每次您重新分发程序（或任何基于程序的作品）时，接收者自动获得原始许可人的授权，根据这些条款和条件复制、分发或修改程序。您不得对接收者行使此处授予的权利施加任何进一步限制。您没有责任强制第三方遵守本许可证。\n\
