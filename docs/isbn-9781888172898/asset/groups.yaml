    \ for them can be loaded on demand. For information on handling kernel modules\
    \ see Chapter 8, Section 8.6.\n\n### 5.1.1 Building a modularized kernel\n\nOnly\
    \ Red Hat Linux/Intel and Red Hat Linux/SPARC support modular kernels; Red Hat\
    \ Linux/Alpha users must build a monolithic kernel (see Section 5.1.3 below).\n\
    \nThese instructions provide you with the knowledge required to take advantage\
