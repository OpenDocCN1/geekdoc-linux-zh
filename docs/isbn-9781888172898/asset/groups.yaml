    启动盘和辅助磁盘映像位于 CD-ROM 和 FTP 站点的 `images` 目录中。如果您进行 CD-ROM 或 NFS 安装，您只需要制作一张启动软盘。所有其他安装方法还需要辅助软盘。您可以使用
    Linux 下的 `dd` 或 DOS 下的 `rawrite.exe`（位于 `dosutils` 目录中）将每个磁盘映像文件写入格式化的高密度（1.44
    MB）3.5 英寸软盘。


    ### 1.4 安装


    要安装红帽 Linux，请将启动软盘插入 A 驱动器，并将 CD 插入您的 CD-ROM 驱动器（对于 CD-ROM 安装），或连接到您的网络（对于 FTP
    或 NFS 安装）。然后重新启动您的机器，并按顺序回答所有问题。如果您是从 PCMIA、FTP 或硬盘安装，当提示时请插入辅助软盘。


    ### 1.5 从早期版本升级


    红帽 Linux 4.2 的安装过程包括从早期版本的红帽 Linux（基于 RPM 技术的 2.0、2.1、3.0.3 和 4.0）升级的功能。升级您的系统会安装模块化的
    2.0.x 内核以及已安装在您机器上的软件包的更新版本。升级过程使用 .rpm save 扩展名保留现有的配置文件（例如，sendmail.cf.rpmsave），并留下一个日志文件，记录它执行的操作，位于
    /tmp/upgradelog。随着软件的发展，配置文件格式可能会发生变化，因此在合并更改之前，您应仔细比较原始配置文件和新文件。


    要升级红帽 Linux 系统，您必须使用启动软盘（以及可能的辅助软盘），就像执行完整安装一样。在选择安装介质（并在需要时设置网络信息）后，安装程序会提示您选择“安装”或“升级”；请选择“升级”。此升级过程在功能上等效于运行红帽
    Linux 早期版本中的升级脚本。


    请注意，某些升级的软件包可能“依赖”于其他可能未安装在您系统上的软件包。升级过程会处理这些依赖关系，但可能需要安装额外的软件包以满足这些依赖关系。


    ### 1.6 为什么我不能直接从 CD 运行？


    早期版本的红帽 Linux 在 CD-ROM 上附带一个“实时文件系统”；这允许用户在不先将它安装到硬盘的情况下直接从 CD-ROM 运行红帽 Linux。不幸的是，由于模块化的
    Linux-2.0.x 内核，添加“实时”启动功能变得过于复杂，不再得到支持。我们对此不便深表歉意。


    '
