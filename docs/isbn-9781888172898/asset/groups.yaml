    ### B.2.4 Modes


    The last section of the **Xconfig** file is the Mode database (**Modes**). It
    contains the VESA timing specifications for various resolutions. The default values
    work for most graphics cards, but they can be tweaked to center the image and
    adjust its size on the monitor. Most of the Metro-X servers use this database
    to configure the card for graphics mode. The numbers indicate which clock to use
