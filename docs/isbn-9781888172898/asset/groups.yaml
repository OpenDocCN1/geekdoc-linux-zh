    \n条款和条件结束\n\n## G.3.3 附录\n### 如何将这些条款应用于您的新程序\n\n如果您开发了一个新程序，并希望它对公众具有最大的用途，实现这一点的最佳方式是将其制作成自由软件，让每个人都能根据这些条款重新分发和修改。\n\
