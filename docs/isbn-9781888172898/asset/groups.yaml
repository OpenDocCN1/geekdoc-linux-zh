    如果你已在系统中配置了影子密码，将有一个“影子管理”按钮，允许你配置密码和账户有效期。默认情况下（显示为空白的字段具有默认值），不会设置有效期。如果你不熟悉影子密码账户管理，建议接受默认设置。编辑完有效期信息后，点击
    **确定**。


    编辑完用户后，点击“编辑用户定义”对话框中的 **确定** 按钮以添加该用户。


    如果该用户尚未拥有主目录（除非你已提前创建，否则通常不会有），系统将会创建一个。


    ### 8.1.2 删除用户


    ![](img/06353bca937b38b02602dcfb58824d72_121_0.png)


    图 8.3：删除用户对话框


    要删除用户，请通过单击在主窗口中选中一个用户，然后点击 **删除**。此时会出现图 8.3 所示的对话框。你可以执行三种类型的操作。你可以*忽略*用户的主目录，保持其不变；可以将其归档并压缩为
    `.tar.gz` 文件；或者将其完全删除。如果你愿意，还可以*删除*用户的邮件池。前两个操作会在你确认删除后立即执行，先于工具接受更多输入。你可以在用户主目录以外的文件系统部分中搜索该用户拥有的文件，并将所有权授予用户
    *nobody* 或删除这些文件。如果你选择搜索用户文件，可以选择*通过邮件*将错误报告发送给 root。这一点很重要，因为搜索会在你继续工作时在后台进行，可能会花费很长时间。要查找由
    *nobody* 拥有的文件，请执行以下命令：


    ```

    find / \( -group nobody -o -user nobody \) -print

    ```


    ### 停用用户


    有时你可能只是想暂时*移除*一个用户，并打算稍后重新激活该用户。**锁定** 和 **解锁** 功能可以处理这种情况。当你停用用户时，会在用户密码前添加一个
    `*` 来锁定密码，从而阻止用户登录。你还可以选择使用 **tar** 和 **gzip** “压缩”用户的主目录，从而节省一些空间。当你重新激活用户时，密码锁定将被移除，如果主目录曾被压缩，它将恢复至正常状态。锁定用户时，你会看到与删除用户时相同的选项，但你不太可能想要删除任何文件。


    ### 8.1.3 创建新组


    要创建新组，首先在顶级窗口中选中 **组** 选项卡，切换到组编辑模式。点击 **添加** 会弹出一个对话框，用于指定组详细信息。首先为新组输入一个名称。与用户名一样，组名不应包含空格或冒号，且长度不应超过
    8 个字符。你可以设置组密码；如果设置了，非该组成员的用户可以通过使用 **newgrp** 程序并提供该密码来假设组成员身份。要将成员添加到组中，请在“用户列表”字段中输入他们的姓名。选定所有组成员后，点击
    **确定**


    ### 8.1.4 编辑现有组


    要编辑现有组，请双击主窗口中的组，或单击组后点击 **查看/编辑**。编辑现有组与创建新组使用的是相同的界面。


    ## 8.2 文件系统配置


    图 8.4 中所示的文件系统配置工具允许你轻松检查和操作文件系统的挂载点、类型、选项等。它对于操作大量文件系统非常有用。除非你是经验丰富的系统管理员，否则你可能不想这样做。如果你知道自己在做什么，那么如何挂载、卸载和添加设备应该比较直接明了。


    **FSM** 菜单中的 **重新加载** 项会使文件系统配置工具从硬盘重新加载 `/etc/fstab`。如果你在文件系统配置工具运行时手动编辑了 `/etc/fstab`（你不应该这样做），你可能需要重新加载。


    要使用窗口底部的按钮，请在主窗口中选择一个文件系统，然后点击其中一个按钮。这些按钮执行以下功能：


    - **信息：** 显示文件系统的信息，包括设备、分区类型、文件系统类型、挂载点和选项、注释、大小、使用百分比等。

    - **检查：** 在分区上执行文件系统检查（fsck）。你只能在*未挂载*的分区上执行此操作——如果分区已挂载，你会收到错误，必须先将其卸载。

    - **挂载：** 挂载选定的文件系统。

    - **卸载：** 卸载选定的文件系统。

    - **格式化**：在选定的分区上创建新的文件系统。这将擦除选定分区上的所有数据！你只能在*未挂载*的分区上执行此操作——如果分区已挂载，你会收到错误，必须先将其卸载。

    - **编辑**：弹出一个对话框，你可以在其中编辑挂载点、挂载选项、注释等。


    ### 8.2.1 添加 NFS 挂载


    要通过 NFS 挂载文件系统，请从 NFS 菜单中选择 **添加挂载**。将会弹出一个对话框，你需要填写以下值：


    - **设备**：输入主机名和路径，用冒号分隔。例如，`foo.bar.com:/usr/exported` 表示 `foo.bar.com` 上的 `/usr/exported`
    目录。

    - **挂载点**：输入你希望在该机器上挂载 NFS 文件系统的目录。例如，`/mnt/foo`。

    - **选项**：输入此文件系统的挂载选项。默认为 `soft,intr,ru`。其中 `ru` 表示文件系统为读写模式，而 `soft,intr` 是在远程服务器宕机时使系统更具韧性的选项。有关可用选项的完整列表，请参见
    mount 手册页。

    - **注释**：此可选字段可用于存储简短的注释。


    正确填写所有内容后，点击 **确定**。此时，该条目已写入你的 `/etc/fstab`，但文件系统实际上尚未挂载。要挂载它，请在主窗口中选中该文件系统，然后点击
    **挂载**。


    ## 8.3 打印机配置


    打印机配置工具（`printtool`）维护 `/etc/printcap`、打印 spool 目录和打印过滤器。这些过滤器允许你打印许多不同类型的文件，包括：


    - 纯文本（ASCII）文件


