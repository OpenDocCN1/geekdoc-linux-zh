    ## 3.6 安装


    ### 3.6.1 启动内核软盘


    要从你上面制作的软盘中启动 Linux/Alpha 内核，请使用 MILO。关于如何从你的 MILO 软盘中加载 MILO 的详细信息，请参阅附录 D，《*Alpha
    Miniloader Howto*（Alpha 迷你加载程序指南）》第 D.5 节。启动至 MILO> 提示符，将内核软盘插入第一个软驱，并给 MILO 输入以下命令：


    ```

    boot fd0:vmlinuz.gz root=/dev/fd0 load_ramdisk=1 prompt_ramdisk=1

    ```


