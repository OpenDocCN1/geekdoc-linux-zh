    2 小时完成安装时，大多数人不会这么做 :-)），否则这通常不会引发任何类型的错误消息。你可能需要重新安装，并做以下两件事之一：

    - 增大你的根分区或 `/usr` 分区

    - 安装更少的软件包


    另外，如果你为 Linux 创建的所有分区都没有满，那你可能只是缺少某些软件包。你需要使用 glist 或 rpm 来安装它们。


    ## E.3.4 我如何挂载我的 CD-ROM？


    如果你是通过 CD-ROM 安装的系统，你应该能够执行以下操作：


    ```

    mount /mnt/cdrom

    ```


    如果你收到错误信息提示挂载点不存在，请执行以下命令：


    ```

    mkdir /mnt/cdrom

    ```


    如果你是通过 NFS 安装的：你需要知道你拥有哪种类型的 CD-ROM。最好的方法是在重启时观察启动信息，或者查看 /var/adm/messages（更多信息请查看
    /var/adm/messages）。你很可能拥有 IDE CD-ROM，它显示为 /dev/hdc 或 /dev/hdd，或者是 Sound Blaster
    类型（/dev/sbpcd），或者是 SCSI 类型（/dev/scd0）。


    无论哪种情况，你可以执行以下操作：


    ```

    mount -t iso9660 /dev/xxxx /mnt/cdrom

    ```


    并将 xxxx 替换为你的设备。然后你可以：`cd /mnt/cdrom` 接着：`ls`，你就会看到 CD-ROM 的内容。


    ## E.3.5 为什么 Linux 只能看到我的一部分 RAM？


    可能有几个地方出了问题。在 *某些* 386 处理器上，你需要在编译内核时启用“将内存限制为 16M？”选项。一些 AMI BIOS 主板有一个内存选项，可以将内存分割为两个部分。我不确定该选项叫什么名字，但它与“linear”（线性）有关。你可以在
    BIOS 设置中找到它。你可能需要在启动时从 lilo 向内核指定内存量。要尝试此操作，请在 lilo 提示符下输入：`linux mem=32M`。如果这有效，你可以将该行添加到
    /etc/lilo.conf 中的 append 部分并重新运行 lilo。上述示例将是：


    ```

    append = "mem=32M"

    ```


    编辑文件后别忘了运行 ‘lilo’。


    ## E.3.6 我如何安装到 DOS 分区？


    你不能。目前的所有 Red Hat 版本都不支持 UMSDOS 安装。如果你有一个驱动器，其中有一个大的 DOS 分区，且你想使用其中的空闲空间，你有两个选择。一是以某种方式备份你的所有
    DOS 数据，然后将驱动器重新分区为较小的分区，再将 DOS 数据恢复到 DOS 分区中。这样你就有一个用于 Linux 的空闲分区。第二个选择是使用 fips。fips
    是一个允许你更改 DOS 分区大小而不破坏其中数据的程序。强烈建议在使用 fips 之前备份你的数据。Red Hat Software 对使用 fips 进行此操作的适用性不作任何保证或声明，也无法保证数据不会受损。我没有听说有人在使用
    fips 时遇到糟糕的经历，但我也不保证。


    ## E.3.7 我如何使用随 RedHat 附带的 NYS/NIS 系统？


    请参阅 NYS-Tips。你可以在 http://www.redhat.com/ 找到它。


    ## E.3.8 为什么安装了 Linux 后我现在无法访问 Unixware？


    你需要使用启动软盘启动 Unixware 并运行 ''fdisk /mbr''。这应该能让你返回 Unixware，但你将无法访问 Linux。


    ## E.3.9 为什么我的 Diamond 显卡在 X Windows 下表现异常？


    如果你在使用 XFree86 和 Diamond 显卡时遇到问题，你可以尝试添加以下内容：


    ```

