    \n现在当系统启动时，如果你在 LILO `boot:` 提示符处按下 Tab 键，将显示两个选项；\n\n```\nLILO boot:\nlinux old\n\
    ```\n\n要启动新内核 (linux)，只需按 Enter 键，或者等待 LILO 超时。如果你想启动旧内核 (old)，只需输入 old 并按 Enter\
    \ 键。\n\n以下是步骤总结；\n\n- `mv /boot/vmlinuz /boot/vmlinuz.old`\n- `cp /usr/src/linux/arch/i386/boot/zImage\
    \ /boot/vmlinuz`\n- `edit /etc/lilo.conf`\n- `run /sbin/lilo`\n\n你可以通过重新启动计算机并观察消息来开始测试你的新内核，以确保你的硬件被正确检测。\n\
    \n### 5.1.2 制作 initrd 映像\n\n加载 SCSI 模块时需要一个 **initrd** 映像。如果满足以下条件，Shell 脚本 `/sbin/mkinitrd`\
    \ 可以为你的机器构建一个合适的 **initrd** 映像：\n\n- 环回块设备可用。\n- `/etc/conf.modules` 文件中有一行用于你的\
