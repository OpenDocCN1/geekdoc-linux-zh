    FMU>


    # D.7.3 The "program" command


    The flash management utility contains a compressed copy of a flash image of MILO.
    The "program" command allows you to blow this image into flash. The command allows
    you to back out, but before you run it you should use the "list" command to see
    where to put MILO. If MILO is already in flash, then the flash management utility
    will offer to overwrite it.


    Wait until it has completed before powering off your system.


    Note: I cannot emphasize just how careful you must be here not to over-

    write an existing flash image that you might need or render your system

    useless. A very good rule is never to overwrite the Debug Monitor.


    # D.7.4 The "environment" command


    This selects a flash block to contain MILO''s environment variables.'
  - '[PAGE 225]


    # D.7.5  The "bootpt" command


    This is just the same as MILO''s "bootpt" command, see (Section D.6.4).


    # D.7.6  The "q uit" command


    This is really pretty meaningless. The only way back to MILO (or anything else)
    once the flash management utility has run is to reboot the system.


    # D.8  Restrictions.


    Unfortunately this is not a perfect world and there, as always, some restrictions
    that you should be aware of.


    MILO is not meant to load operating systems other than Linux, although it can
    load images linked to run at the same place in memory as Linux (which is 0xFFFFC0000310000).
    This is how the flash management utilities can be run.


    The PALCode sources included in miniboot/palcode/blah are correct, however there
    are problems when they are built using the latest gas. They *do* build if you
    use the ancient a.out gas that''s supplied in the Alpha Evaluation Board toolkit
    (and that''s how they were built). I''m trying to get someone to fix the new gas.
    Meanwhile, as a workaround, I have provided pre-built PALCode for the supported
    boards and David Mosberger-Tang has a fixed gas on his ftp site.


    # D.9  Problem Solving.


    Here are some common problems that people have seen, together with the solutions.


    **Reading MS-DOS floppies from the Evaluation Board Debug Monitor.**


    Some of the older versions of the Evaluation Board Debug Monitor (pre-version
    2.0) have a problem with DOS format floppies generated from Linux.'
  - '[PAGE 226]


    Usually, the Debug Monitor can load the first few sectors all right, but then
    goes into an endless loop complaining about "bad sectors." Apparently, there is
    an incompatibility between the DOS file system as expected by the Debug Monitor
    and the Linux implementation of DOSFS. To make the long story short: if you run
    into this problem, try using DOS to write the floppy disk. For example, if loading
    the file MILO.cab doesn''t work, use a DOS machine, insert the floppy and then
    do:


    ```

    copy a:MILO.cab c:

    copy c:MILO.cab a:

    del c:MILO.cab

    ```


    Then try booting from that floppy again. This normally solves the problem.


    # **MILO displays a long sequence of 0> and does not accept input.**


    This usually happens when MILO was built to use COM1 as a secondary console device.
    In such a case, MILO echo output to COM1 and accepts input from there also. This
    is great for debugging but not so great if you have a device other than a terminal
    connected. If this happens, disconnect the device or power it down until the Linux
    kernel has booted. Once Linux is up and running, everything will work as expected.


    # **MILO complains that the kernel image has the wrong magic number**


    Older versions of MILO did not support the ELF object file format and so could
    not recognise an ELF image and this might be your problem. If this is reported,
    upgrade to the latest MILO that you can find. All 2.0.20 and beyond MILOs support
    ELF. On the other hand it could be that the image is indeed damaged. You should
    also note that MILO does not yet automatically distinguish between GZIP''d and
    non-GZIP''d images; you need to add the ".gz" suffix to the file name.


    # **MILO prints ". . . turning on virtual addressing and jumping to the Linux
    Kernel" and nothing else happens**


    One obvious problem is that the kernel image is wrongly built or is built for
    another Alpha system altogether. Another is that the video board is a TGA (Zxlp)
    device and the kernel has been built for a VGA device (or vice versa). It is worth
    building the kernel to echo to COM1 and then connecting a terminal to that serial
    port or retrying the kernel that came with the Linux distribution that you installed.'
  - '[PAGE 227]


    **MILO does not recognise the SCSI device**


    The standard MILO images include as many device drivers as are known to be stable
    for Alpha (as of now that includes the NCR 810, QLOGIC ISP, Buslogic and Adaptec
    2940s and 3940 cards). If your card is not included, it may be that the driver
    is not stable enough on an Alpha system yet. Again, the latest MILO images are
    worth trying. You can tell which SCSI devices a MILO image has built into it by
    using the “show” command.


    # D.10 Acknowledgements.


    I would like to thank:


    +   - Eric Rasmussen and Eileen Samberg the authors of the PALcode,

    +   - Jim Paradis for the keyboard driver, the original MILO interface and the
    AlphaBIOS work,

    +   - Jay Estabrook for his help and bugfixes,

    +   - David Mosberger-Tang for the freeware BIOS emulation and his sup-port and
    encouragement,

    +   - Last (and not least) Linus Torvalds for the timer code and his kernel.


    There are a number of things that still need doing to MILO, if you want to add
    something yourself, then do let me know mailto:david.rusling@reo.mts.dec.com so
    that we do not duplicate our efforts.


    Finally, a big thank you to Digital for producing such a wonderful chip (and paying
    me to do this).'
