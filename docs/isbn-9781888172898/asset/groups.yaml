    \ require serial port setup, you can edit `/etc/rc.d/rc.serial` and it will be\
    \ executed automatically at boot time.\n\nThe default `/etc/rc.d/rc.local` simply\
    \ creates a nice login banner with your kernel version and machine type.\n\n##\
    \ 5.11 Color ls Setup\n\nColor ls is now part of the standard `ls` command. To\
    \ use color-ls simply issue the command (in `bash`):\n\n```\nalias ls='ls --color'\n\
    ```\n\n## 5.12 NIS/NYS Setup\n\nThe basic content of this section was donated\
    \ by Grant Taylor. It was edited for clarity and space. Other content was contributed\
    \ by users on the `redhat-list` mailing list.\n\nThis text attempts to describe\
    \ the yp, NIS, and NIS+ support offered in Red Hat Linux products.\n\n- What is\
    \ yp? NIS? NIS+? NYS? These questions are answered in the NIS-HOWTO. It is included\
    \ with Red Hat Linux in the ldap package and on the CD. If you install the `ldap`\
    \ package, you will find the NIS-HOWTO in `/usr/doc/HOWTO`.\n\n  The quick answer\
    \ is that while yp (\"Yellow Pages\") is the phone book in Britain, NIS is the\
    \ traditional RPC-based implementation for sharing passwd, group, hosts, services,\
    \ and other useful things between many machines. NIS+ is a snazzier, and more\
    \ secure implementation of the same idea. NYS is the public domain version of\
    \ NIS.\n\n- What is offered? Red Hat ships NYS client code in its libc and plain\
    \ yp/NIS client programs like ypcat and ypbind. We ship a plain NIS server daemon,\
    \ since the NYS (aka NIS+) server daemon is not yet ready for prime-time. Our\
    \ ypserver does not appear to have the tcp_wrapper-style `/etc/hosts.allow/deny`\
    \ checking compiled in.\n\n- How do I get ypbind to work properly? How do I set\
    \ up a client workstation? The NYS code in libc does it all. There is no need\
    \ to run ypbind. You probably *do* need to run domainname (appropriately for the\
    \ benefit of plain NIS client programs). You must configure which maps are read\
    \ from where in `/etc/nsswitch.conf`, and which NIS server and domain you are\
    \ in using `/etc/yp.conf`. nsswitch.conf is well commented, and yp.conf will look\
    \ like this:\n\n  ```\n  domain foo\n  ypserver foo.bar.com\n  ```\n\n  Do not\
    \ put the usual `+:::` lines at the end of passwd or group.\n\n- How do I run\
    \ ypserver (master)? Red Hat ships a plain NIS (a.k.a. yp) server. It works just\
    \ like any other ypserver—modify the Makefile in `/var/nis` to taste, perhaps\
    \ move the source files into `/var/nis/src`, or perhaps not, run make to make\
    \ the databases, and run ypserver. Further documentation is in `/usr/doc/ypserver/*`.\n\
    \n- Where are yppasswd and yppasswd? They are not included in Red Hat Linux, but\
    \ you can obtain the regular NIS distribution and install it yourself without\
    \ too much hassle. It is available from the places listed in the NIS HOWTO. You\
    \ have to modify the `pupgate` script that comes with it, even though the README\
    \ claims it works with the NYS Makefile we ship. We also don't ship a `rcpserver/yppasswd.h`,\
    \ although we do have the `.x` file. The yppasswd package comes with both so it\
    \ doesn't matter much. The NYS define should be used, but don't use the `-lssl`\
    \ library since it is built into our libc.\n\n- This information is miserably\
    \ incomplete! There is already an NIS-HOWTO that describes how to set things up\
    \ far better than this document does or should. It is also included with Red Hat\
    \ Linux in the `ldap` package.\n"
