    ## C.4 21064 性能与 21066 性能


    21064 和 21066 拥有相同的 (EV4) CPU 核心。如果同一个程序分别在 21064 和 21066 上运行，且 CPU 速度相同，那么性能差异仅源于系统
    CPU/内存带宽。任何对内部缓存具有高命中率的代码线程都将表现出相同的性能。有两个主要的性能杀手：


    1.  写密集型代码。尽管 21064 和 21066 拥有写缓冲区来吸收部分延迟，但写密集型代码会受到系统总线写带宽的限制。这是因为片上缓存是写通（write-through）的。

    2.  希望将浮点数当作整数处理的代码。Alpha 架构不允许从整数寄存器到浮点寄存器的寄存器间传输。这种转换必须通过内存完成（因此，由于片上缓存是写通的，需通过
    Bcache 完成）。（编者注：似乎 EV4 和 EV45 都可以通过主数据缓存（Dcache）执行转换，前提是内存已经被缓存。在这种情况下，转换序列中的存储操作会更新
    Dcache，随后的加载操作在特定情况下能够读取到更新后的 d-cache 值，从而避免了对 Bcache 的高代价往返。特别是，最好背靠背执行 stq/ldt
    或 stt/ldq 指令，这有点违反直觉。）


    如果你在 21064A 和 21066A 之间进行相同的比较，由于这两颗芯片之间 Icache 和 Dcache 大小不同，还会有一个额外的因素。


    现在，21164 解决了这两个问题：它实现了更高的系统总线带宽（尽管信号引脚数量相同——是的，我知道它的引脚大约是 21064 的两倍，但所有额外的引脚都是电源和地线！（是的，真的！）），并且它拥有回写（write-back）缓存。唯一剩下的问题是回答“成本是多少？”这个问题。


    ## C.5 关于时钟的几点说明


    目前的 Alpha CPU 均使用高速时钟，因为它们的微架构被设计为所谓的短滴答（short-tick）设计。然而，结果并没有要求任何系统总线必须以可怕的速度运行：


    - 在 21066(A)、21064(A)、21164 上，片外缓存（Bcache）时序是完全可编程的，精度达到 CPU 时钟级别。例如，在 275MHz
    的 CPU 上，Bcache 读访问时间可以以 3.6ns 的分辨率进行控制。

    - 在 21066(A) 上，DRAM 时序是完全可编程的，精度达到 CPU 时钟级别（*不是* PCI 时钟，而是 CPU 时钟）。

    - 在 21064(A)、21164(A) 上，系统总线频率是 CPU 时钟频率的亚倍数。大多数 21064 主板使用 33MHz 的系统总线时钟。

    - 使用 21066 的系统可以以相对于 CPU 的任意频率运行 PCI。通常，PCI 运行在 33MHz。

    - 使用 APECS 芯片组（见第 C.6 节）的系统，其 CPU 系统总线始终等于其 PCI 总线频率。这意味着两个总线往往运行在 25MHz 或 33MHz（因为这些是能够向上缩放以匹配
    CPU 频率的频率）。在 APECS 系统中，DRAM 控制器时序在 CPU 系统总线频率方面是软件可编程的。


    **旁白：** 有人建议他们在 21066 上获得糟糕的性能，因为 21066 内存控制器仅运行在 33MHz。实际上，拥有内存控制器“仅”运行在 33MHz
    的超级明星系统是 21064A 系统。


    ## C.6 芯片组


    DS 销售两种 CPU 支持芯片组。2107x 芯片组（又称 APECS）是 21064(A) 的支持芯片组。2117x 芯片组（又称 ALCOR）是 21164
    的支持芯片组。还将有 2117xA 芯片组（又称 ALCOR 2）作为 21164A 的支持芯片组。


    这两种芯片组都为其 CPU 提供内存控制器和 PCI 主机桥。APECS 提供 32 位 PCI 主机桥，ALCOR 提供 64 位 PCI 主机桥，该桥（符合
    PCI 规范的要求）可以支持 32 位和 64 位 PCI 设备。


    APECS 由 6 个 208 引脚芯片组成（4 个 32 位数据切片 (DECADe)、1 个系统控制器 (COMANCHE)、1 个 PCI 控制器 (EPIc)）。它提供
    DRAM 控制器（128 位内存总线）和 PCI 接口。它还完成所有工作，以便当 PCI 设备直接内存访问（DMA）进入（或传出）内存时维持内存一致性。


    ALCOR 由 5 个芯片组成（4 个 64 位数据切片 (Data Switch, DSW) - 208 引脚 PQFP 和 1 个控制 (Control,
    I/O Address, CIA) - 383 引脚塑料 PGA）。它提供 DRAM 控制器（256 位内存总线）和 PCI 接口。它还完成支持外部 Bcache
    以及当 PCI 设备直接内存访问（DMA）进入（或传出）内存时维持内存一致性所需的所有工作。


    没有针对 21066 的支持芯片组，因为内存控制器和 PCI 主机桥功能已集成到芯片中。


    ## C.7 系统


    DS 的应用工程团队使用 CPU 和支持芯片组生产示例设计。这些通常是 PC-AT 尺寸的主板，具有你在高端 Pentium 主板上通常会发现的所有功能。最初，这些示例设计旨在作为第三方生产主板设计的起点。这些第一代设计被称为评估板（EBs）。随着构建主板所需的工程量增加（由于更高速度时钟以及满足射频发射和易感性法规的需求），重点已转向提供适合批量生产的主板。


    Digital 的系统团队生产了几代使用 Alpha 处理器的机器。这些系统中的一些使用由系统团队设计的支持逻辑，另一些则使用来自 DS 的商品芯片组。在某些情况下，系统同时使用了两者。


    各种使用 Alpha 处理器的第三方构建系统。这些公司中有些从头设计系统，有些使用 DS 支持芯片组，克隆/修改 DS 示例设计，或者简单地使用 DS 的构建和测试板来打包系统。


    The EB64：使用 21064 的过时设计，内存控制器使用可编程逻辑实现。I/O 通过使用可编程逻辑接口 486 <> ISA 桥接芯片提供。板载以太网、SuperI/O
    (2S, 1F, FD)、以太网和 ISA。PC-AT 尺寸。从标准 PC 电源供电。


    The EB64+：使用 21064 或 21064A 和 APECS。具有 ISA 和 PCI 扩展（3 个 ISA，2 个 PCI，一对在共享插槽上）。支持
    36 位 DRAM SIMM。ISA 总线由 Intel Saturn/I/O PCI-ISA 桥生成。板载 SCSI (NCR 810 on PCI)、以太网
    (Digital 21040)、KBD、MOUSE (PS2 样式)、SuperI/O (2S, 1F, FD)、RTC/NVRAM。启动 ROM 是 EPROM。PC-AT
    尺寸。从标准 PC 电源供电。


    The EB66：使用 21066 或 21066A。I/O 子系统与 EB64+ 相同。Baby PC-AT 尺寸。从标准 PC 电源供电。EB66 原理图已作为宣传海报发布，宣传
    21066 为“世界上第一个嵌入式 PCI 的微处理器”（对于琐事爱好者：实际上这张海报有 2 个版本——我绘制了第一版中的电路并撰写了文案，一些美国人修改了第二版中的文案）。


    The EB164：使用 21164 和 ALCOR。具有 ISA 和 PCI 扩展（3 个 ISA 插槽，2 个 64 位 PCI 插槽（其中一个与 ISA
    插槽共享）和 2 个 32 位 PCI 插槽。使用即插即用 Bcache SIMM。I/O 子系统提供 SuperI/O (2S, 1F, FD)、KBD、MOUSE
    (PS2 样式)、RTC/NVRAM。启动 ROM 是 Flash。PC-AT 尺寸的主板。需要具有 3.3V 输出的电源。


    The AlphaPC64 (aka Cabriolet)：源自 EB64+，但现在是 baby-AT，带有 Flash 启动 ROM，无板载 SCSI 或以太网。3
    个 ISA 插槽，4 个 PCI 插槽（一对在共享插槽上），使用即插即用 Bcache SIMM。需要具有 3.3V 输出的电源。


    The AXPpci33 (aka NoNAME)：基于 EB66。此设计由 Digital 的技术 OEM (TOEM) 团队生产。它使用运行在 166MHz
    或 233MHz 的 21066 处理器。它是 baby-AT 尺寸，从标准 PC 电源供电。它有 5 个 ISA 插槽和 3 个 PCI 插槽（一对是共享插槽）。有
    2 个版本，键盘分别使用 PS/2 或大 DIN 连接器。


    其他基于 21066 的主板：大多数如果不是全部其他基于 21066 的主板——

    '
