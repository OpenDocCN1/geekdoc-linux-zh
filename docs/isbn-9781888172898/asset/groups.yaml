    # 2.4.19 Installing LILO


    In order to be able to boot your Red Hat Linux system, you usually need to install
    **LILO** (the Linux LOader). You may install **LILO** in one of several places:


    **The Master Boot Record (MBR)** is the recommended place to install **LILO**,
    unless another operating system loader (e.g., System Commander or OS/2’s Boot
    Manager) is already installed there. When your machine boots, LILO starts and
    presents the `boot:` prompt; you can boot Red Hat Linux or any other operating
    system you configure LILO to boot (see below).


    **The first sector of your root partition** is recommended if you are already
    using another boot loader on your system (such as OS/2’s Boot Manager); then you
    can setup that boot loader to start **LILO** and boot Red Hat Linux.


    **The first sector of a floppy diskette** is an alternative either of the above
    options; to boot Red Hat Linux, insert the **LILO** diskette into your machine’s
    floppy drive and reboot. LILO starts from the floppy and presents the `boot:`
    prompt.


    Select the location you wish to install **LILO** and press **OK**. If you do not
    wish to install LILO, press **Skip**.


    # Limitations of LILO


    **LILO** is subject to some limitations imposed by most PC BIOSes. Specifically,
    most BIOSes can’t access more than two hard drives and they can’t access beyond
    cylinder 1023 (the 1024th cylinder) of any drive. Some more recent BIOSes do not
    have these limitations.


    All the things which **LILO** needs to access at boot time (including the kernel)
    are located in the `/boot` directory of your root partition.'
