    ### E.3.1 如何让 SB16 上的 IDE CD-ROM 正常工作？


    Creative Labs 套件中的 IDE 接口默认设置为第三个 IDE 端口（我认为应该是 IDE2）。这在 Linux 下不起作用，因为 Linux
