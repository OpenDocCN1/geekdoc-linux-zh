  mdcn: "\n如果参数中包含逗号，请确保逗号后不要加空格。\n\n## A.3 以太网参数\n\n大多数以太网驱动程序接受参数以指定基础 I/O 地址和中断请求（IRQ），格式如下：\n\
    \n```\nio=base_addr irq=irq\n```\n\n例如，对于一个位于 I/O 地址 210（I/O 地址通常为十六进制）且 IRQ 为\
    \ 10 的 3com 3c509 以太网卡，3c509 驱动程序应使用以下参数：\n\n```\nio=0x210 irq=10\n```\n\n您可以在一台机器中使用多张以太网卡。如果每张卡使用不同的驱动程序（例如\
    \ 3c509 和 DE425），您只需为每张卡在 `/etc/conf.modules` 中添加别名（以及可能的选项）；例如：\n\n```\nalias\
    \ eth0 3c509\noptions 3c509 io=0x210 irq=10\nalias eth1 de4x5\noptions de4x5 io=0\n\
    ```\n\n更多信息请参见第 8.6 节。\n\n但是，如果任意两张以太网卡使用相同的驱动程序（例如两张 3c509，或一张 3c595 和一张 3c905），您需要编译一个内置以太网驱动程序的定制内核。在这种情况下，您需要使用“经典”LILO\
    \ 启动参数，其形式为：\n\n```\nether=irq,base_addr,interface\n```\n\n例如：\n\n```\nLILO boot:\
    \ linux ether=10,0x210,eth0 ether=11,0x300,eth1\n```\n\n（关于使用多张以太网卡的更多信息，请参见 *Multiple-Ethernet*\
    \ 迷你 HOWTO。）\n\n## 附录 B\n\n### Metro X\n\n#### B.1 特殊功能\n\n##### B.1.1 热键退出\n\n\
    Metro-X 支持热键退出。如果 `.xinitrc` 或 `.xsession` 中的最后一个客户端没有提供退出会话的方式，这将有助于终止 X 服务器。退出键组合为\
    \ Ctrl Alt Backspace。\n\n##### B.1.2 热键分辨率切换\n\n在配置 Metro-X 时，您可以选择多种屏幕分辨率。然后，您可以在运行\
    \ X 服务器时通过按下相应的键组合来即时更改分辨率。要切换到下一个分辨率，请按下 Ctrl Alt +。要切换到上一个分辨率，请按下 Ctrl Alt -。\n\
    \n##### B.1.3 硬件平移\n\nMetro-X 支持硬件平移。这允许您将虚拟分辨率设置为高于显示器的物理分辨率。然后，窗口可以扩展到屏幕物理边界之外，并可以通过滚动到扩展区域来查看。\n\
    \n##### B.1.4 多屏幕\n\nMetro-X 最多支持四个屏幕，这些屏幕可以同时通过单个键盘和鼠标控制。这允许您运行许多应用程序而不会窗口重叠，对于图像处理工作特别有用。\n\
    \n在多屏幕配置中，有一个 X 进程、一个鼠标和一个键盘——但有多个屏幕。鼠标/光标可以在不同的屏幕之间移动。客户端通过语法 `-display :0.X`\
    \ 连接到不同的屏幕，其中 X 是屏幕编号。\n\n**支持的显卡**\n\n最多可使用以下列表中的任意一张卡（每张卡最多使用四张）：\n\n- 一张或多张\
    \ Matrox MGA Impression Plus\n- 一张或多张 Matrox MGA Ultima Plus\n- 一张或多张 Matrox MGA\
    \ Millennium\n\n##### B.1.5 国际键盘\n\nMetro-X 使用 X 键盘扩展来支持各种键盘。键盘描述包含关于键盘物理布局、来自键盘的键码以及将键码映射为键符号所需的符号信息。\n\
    \nMetro-X 提供了许多预定义配置，按语言和国家分类。这些配置通过 config.X 选择（第 5.3.3 节）。\n\n### B.2 Metro\
    \ X 配置文件\n\n#### B.2.1 警告\n\nX 服务器的主要配置文件是 Xconfig。如果对此文件进行了不适当的修改，Metro-X 的正常功能将受到影响！除非绝对必要，否则不要编辑\
    \ Xconfig 文件。\n\n#### B.2.2 Xconfig\n\nMetro-X 按以下顺序在以下位置查找 Xconfig 文件：\n\n```\n\
    $HOME/Xconfig\n$HOME/.Xconfig\n/etc/X11/Xconfig (仅在 Linux 上)\n/usr/lib/X11/Metro/Xconfig\n\
    ```\n\n大多数选项是通过配置实用程序（ConfigX，第 5.3.3 节）设置的。可以使用编辑器添加额外选项，并且 ConfigX 将保留这些选项。\n\
    \n#### B.2.3 关键字\n\n以下是 Xconfig 关键字的描述。为了方便起见，这里按字母顺序排列，并在单个条目中标注了顺序依赖性。\n\n**在配置实用程序中设置的选项**\n\
    \n以下 Xconfig 关键字列表是通过 Metro-X 配置实用程序控制的选项。对这些选项的任何修改都应通过实用程序进行，以避免意外损坏 Metro-X\
    \ 的功能。\n\n- **BitsPerPixel** <number>\n  某些 X 驱动程序支持每像素打包 24 位的内存组织。这意味着每个像素占用视频内存的三个字节。在这种情况下，configX\
    \ 插入行：`BitsPerPixel 24`\n\n- **Buttons** <number>\n  这指定鼠标上的按钮数量。此条目必须紧跟在 Xconfig\
    \ 文件中的 Mouse 条目之后。\n\n- **Card** <string>\n  这指定正在使用的显卡型号。这只由 configX 使用。\n\n\
    - **Chipset** <string>\n  这显示服务器使用的芯片组。通常 configX 会将正确的芯片组插入 Xconfig 文件。\n\n-\
    \ **Clocks** <number> <number>...\n  这包含一个数字列表，指定与卡上的时钟发生器相关的频率。数字以 MHz 指定。\n\n\
    - **Depth** <number>\n  这引用屏幕的色彩深度，控制可以显示多少颜色。不同的卡和驱动程序支持不同的深度值：4、8、16、24 或 32。深度\
