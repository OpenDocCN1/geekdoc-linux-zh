    load.exe\nOSLOADPARTITION=multi(0)disk(0)fdisk(0)\nOSLOADFILENAME=\\noname.arc\n\
    OSLOADOPTIONS=\n```\n\n现在您可以启动 MILO（进而启动 Linux）。您可以从 Windows NT 支持的 NTFS 或硬盘上的\
    \ DOS 文件系统等直接加载 `lilo\\load.exe` 和 MILO。\n\n`OSLOADOPTIONS` 的内容会被传递给 MILO，MILO\
    \ 会将其解释为一条命令。因此，为了在 Windows NT 上直接启动 Linux 而不在 MILO 中暂停，您可以在 `OSLOADOPTIONS` 中传入以下内容：\n\
    \n```\nboot sda2:vmlinuz.gz root=/dev/sda2\n```\n\n有关可用命令的更多信息，请参阅 D.6 节。\n\n\
    通过 WNT ARC 固件加载 MILO 的另一种（稍显巧妙）方法是将 MILO 放入 MS-DOS 软盘中，并将其命名为 `fwupdate.exe`，然后选择“升级固件”选项。\n\
    \n## D.5.2 从 Windows NT AlphaBIOS 加载 MILO\n\n随着 XLT 系列的引入，Digital 将其 NT 系统的系统控制台接口从\
    \ ARC 更改为 AlphaBIOS。AlphaBIOS 是一种面向屏幕的接口，对 PC 用户来说可能更加熟悉。这种控制台接口的变化使得希望在基于 AlphaBIOS\
    \ 的系统上运行 Linux/Alpha 的用户需要更改设置过程。\n\n您必须做的第一件事是在系统上安装最新版本的 AlphaBIOS。您可以从 Digital\
    \ 的“系统软件和设备驱动程序更新”网页获取，网址为：`http://www.windows.digital.com/support/syssoft.htp`。下载\
    \ ZIP 文件，解压并按如下步骤安装：\n\n- 将文件复制到格式化为 FAT 的软盘中\n- 开启系统并插入软盘。在启动屏幕上，按 F2 键进入设置模式\n\
    - 选择“升级 AlphaBIOS”\n- 按照屏幕上的指示操作\n\n一旦您的 AlphaBIOS 更新到最新的修订版本，就可以开始引导系统，步骤如下：\n\
    \n- 创建一个格式化为 FAT 的软盘，包含以下文件：\n    - linux.exe（来自当前目录）\n    - milo（适用于您系统的版本）\n\
    - 开启系统并插入软盘。在启动屏幕上，按 F2 键进入设置模式\n- 选择“实用工具->操作系统选择设置...”\n- 按 INSERT 键添加一个新的操作系统选择\n\
    - 在“启动名称”处输入类似“Linux”的内容。按 TAB 键移动到下一个字段。\n- 按向下箭头键直到“启动文件”的选择为“A:”。按 TAB 键移动到下一个字段\n\
    - 输入“linload.exe”。按 *两次* TAB 键（即跳过操作系统路径加载设备 - 这并不相关）\n- 为操作系统路径加载文件输入“\\\\”\n\
    - 按 ENTER 键添加该选择。\n\n此时，AlphaBIOS 可能会弹出一个很大的、不太友好的对话框，标题为“警告：操作系统选择无效”。请忽略此错误（它只是对\
    \ NT 来说是个问题），然后按 ENTER 键继续。\n\n- 按 F10 保存您刚刚所做的更改；按 ENTER 确认更改。\n- 按两次 ESC 返回启动屏幕。\n\
    - 使用向上和向下箭头选择刚刚添加的启动选项，并按 ENTER 启动。\n- AlphaBIOS 将加载 linload，后者进而加载 MILO。当您到达\
    \ MILO 提示符时，请按照正常的基于 ARC 的系统安装步骤操作。\n\n如果您按照安装程序的说明，将第一个硬盘的第一个分区专门用于一个小的 FAT 分区以用于启动，那么一旦安装完\
    \ Linux，您应将 `linload.exe` 和 `milo` 复制到该分区。关机后，您可以按如下方式修改 Linux 菜单选项，以便从该分区加载 MILO：\n\
    \n- 在启动屏幕上，选择 F2 进入设置模式\n- 选择“实用工具->操作系统选择设置”\n- 高亮显示 Linux 条目，然后按 F6 进行编辑。\n\
    - 按 TAB 键移至“启动文件”行的设备部分。使用向上和向下箭头键选择存放 linload 和 milo 的硬盘分区（通常是“Disk 1 Partition\
    \ 1”）。按 ENTER 确认选择\n- 如果您希望在 MILO 加载后自动启动 Linux，请按 TAB 键移至“操作系统选项”行，并输入启动 MILO\
    \ 的命令，例如“boot sda2: vmlinuz.gz”。按 ENTER 确认选择。\n- 按 F10 保存更改。按 ENTER 确认。\n\n完成这些操作后，在基于\
    \ AlphaBIOS 的系统上启动和运行 Linux 的过程应与在 ARC 系统上非常相似。\n\n## D.5.3 从评估板调试监视器加载 MILO\n\
    \n评估板（以及经常由其克隆的设计）都包含对 Alpha 评估板调试监视器（Debug Monitor）的支持。在考虑使用此方法启动 MILO 之前，请查阅您的系统文档。以下已知系统包含调试监视器支持：\n\
    \n- AlphaPC64（见 D.5.7 节）\n- EB64+（见 D.5.7 节）\n- EB66+（见 D.5.7 节）\n- EB164（见 D.5.7\
    \ 节）\n- PC164（见 D.5.7 节）\n\n在考虑使用此方法之前，您应注意早期版本的评估板调试监视器不包含视频或键盘驱动程序，因此您必须准备好通过串行端口连接另一台系统，以便您可以使用调试监视器。其接口非常简单，输入\
    \ `help` 会显示大量命令。其中最有兴趣的命令包括含有单词 `boot` 或 `load` 的那些。\n\n评估板调试监视器可以通过网络（`netboot`）或软盘（`floot`）加载映像。在这两种情况下，在启动映像之前，请将启动地址设置为\
    \ `0x200000`（`> bootaddr 200000`）。\n\n如果映像位于软盘上（请注意，仅支持 DOS 格式的软盘），则需要输入以下命令：\n\
    \n```\nAlphaPC64> floot <MILO-image-name>\n```\n\n## D.5.4 从故障安全启动块软盘加载 MILO\n\
    \n只有 AxpPCI33 *已知* 包含故障安全启动块软盘支持（见 D.5.7 节）。\n\n如果您没有标准的预构建 MILO `.dd` 映像，可能需要构建一个\
    \ SRM 启动块软盘。构建 MILO 后，您需要在 Digital Unix 机器上执行以下操作：\n\n```\nfdisk -fm /dev/rfd0a\n\
    cat mboot bootm > /dev/rfd0a\ndisklabel -rw rfd0a 'rx23' mboot bootm\n```\n\n\
    或者在 Linux 机器上：\n\n```\ncat mboot bootm > /dev/fd0\n```\n\n如果您有标准的 MILO 映像可用（例如\
    \ MILO.dd），则可以使用以下命令构建启动块软盘：\n\n```\ndd if=MILO.dd of=/dev/fd0\n```\n\n## D.5.5\
    \ 从闪存加载 MILO\n\n有一些系统可以将 MILO 吹入闪存并直接启动（而不是通过 Windows NT ARC 固件）：\n\n- AlphaPC64（见\
    \ D.5.7 节）\n- Noname（见 D.5.7 节）\n- EB66+（见 D.5.7 节）\n- EB164（见 D.5.7 节）\n- PC164（见\
    \ D.5.7 节）\n\n## D.5.6 从 SRM 控制台加载 MILO\n\nSRM（System Reference Manual 的缩写）控制台不知道文件系统或磁盘分区，它只是期望二级引导加载程序占据从给定偏移量开始的连续物理磁盘扇区范围。描述二级引导加载程序的信息（其大小和偏移量）包含在第一个\
    \ 512 字节块中。要通过 SRM 加载 MILO，您必须在 SRM 可以访问的设备（例如软盘）上生成该结构。这就是 `mboot` 和 `bootm`\
    \ 的作用；`mboot` 是第一个块（或引导描述），`bootm` 是向上取整到 512 字节边界的 MILO 映像。\n\n要从启动块设备加载 MILO，可以构建\
    \ `mboot` 和 `bootm` 并使用以下命令将它们推送到启动设备：\n\n```\n$ cat mboot bootm > /dev/fd0\n\
    ```\n\n或者，从网站获取适当的 `MILO.dd` 并使用 `RAWRITE.EXE` 或 `dd` 将其写入启动设备。\n\n完成上述操作后，您可以启动\
    \ SRM 控制台并使用其众多命令之一来启动 MILO。例如，要从启动块软盘启动 MILO，您可以使用以下命令：\n\n```\n>>boot dva0\n\
    (boot dva0 0.0.0.1 -flags 0)\nblock 0 of dva0.0.0.0.1 is a valid boot block\n\
    reading 621 blocks from dva0.0.0.0.1\nbootstrap code read in\nbase = 112000, image_start\
    \ = 0, image_bytes = 4da00\ninitializing HWRB at 2000\ninitializing page table\
    \ at 104000\ninitializing machine state\nsetting affinity to the primary CPU\n\
    jumping to bootstrap code\nMILO Stub: V1.1\nUnzipping MILO into position\nAllocating\
    \ memory for unzip\n####...\n```\n\n以下系统 *已知* 具有 SRM 控制台支持：\n\n"
