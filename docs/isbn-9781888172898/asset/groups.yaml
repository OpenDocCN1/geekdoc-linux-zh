    Red Hat Linux 系统启动时自动挂载。选择您希望分配的分区并按 **Enter**（或者选择 *Edit*；然后输入该分区的 *挂载点*，例如 `/usr`（见图
    2.12））。


    ![](img/06353bca937b38b02602dcfb58824d72_41_0.png)


    图 2.12：文件系统配置


    此外，Red Hat Linux 允许您在系统启动时挂载 NFS 卷；这使得目录树可以在网络之间共享。选择 **Add NFS**；然后输入 NFS 服务器的主机名、NFS
    卷的路径以及该卷的本地挂载点（见图 2.13）。


    ## 格式化分区


    下一个安装对话框显示了需要格式化的分区列表。大多数分区应该进行格式化，特别是如果它们是新建的；但是，如果包含您希望保留的数据（例如 `/home` 或 `/usr/local`），则此类分区无需格式化。选择每个要格式化的分区并按
    **Space**。如果您希望在格式化每个文件系统时检查坏块


    ![](img/06353bca937b38b02602dcfb58824d72_42_0.png)


    图 2.13：添加 NFS 挂载


    ，请选择 **Check for bad blocks during format**。按 **OK**。


    ### 2.4.12 选择和安装软件包


    配置和格式化分区完成后，您即可选择要安装的软件包。您可以选择*系统组件*，这些组件根据功能对软件包进行分组；也可以选择单个软件包，或两者的组合。


    #### 选择系统组件


    系统组件根据您的 Red Hat Linux 系统应执行的功能将软件包分组：例如，**C Development**（C 开发）、**Networked Workstation**（网络工作站）或
    **Web Server**（Web 服务器）。选择每个您希望安装的组件并按 `Space`。选择 **Everything**（全部）将安装 Red Hat
    Linux 附带的所有软件包（见图 2.14）。


    如果您希望在系统组件之外选择或取消选择单个软件包，请选择 **Select individual packages**（选择单个软件包）。


    ![](img/06353bca937b38b02602dcfb58824d72_43_0.png)


    #### 选择单个软件包


    选择希望安装的组件后，您可以选择或取消选择单个软件包。安装程序会显示可用软件包组的列表；选择某个组进行检查并按 Enter。安装程序会显示该组中的软件包列表，您可以使用
    Space 键进行选择或取消选择。您可以按 F1 查看软件包的详细描述（见图 2.15）。完成单个软件包的选择后，在“选择组”对话框中按 OK。


    **请注意：** 某些软件包（例如内核和特定的库）是 Red Hat Linux 系统必需的，因此无法选择或取消选择。


    #### 软件包依赖关系


    许多软件包为了正确运行，依赖于系统中安装的其他软件包或库。例如，许多图形化的 Red Hat 系统管理工具需要 python 和 python1ib 软件包。为了确保您的系统具备完全功能所需的所有软件包，Red
    Hat Linux 会在您每次安装或卸载软件包时检查依赖关系。


    ## 2.4. 分步安装


    ![](img/06353bca937b38b02602dcfb58824d72_44_0.png)


    图 2.15：选择软件包


    完成选择要安装的软件包后，安装程序会检查所选软件包列表的依赖关系。如果任何软件包需要您尚未选择安装的其他软件包，程序将显示这些*未解析的依赖关系*列表，并为您提供解决它们的机会（见图
    2.16）。如果您直接按 **OK**，程序将通过将所有必需软件包添加到所选软件包列表来自动解决这些问题。


    #### 软件包安装


    在所有软件包依赖关系解决后，安装程序开始安装软件包；它会在您的 Red Hat Linux 系统的 /tmp/install.log 中留下完整的安装日志。


    ### 2.4.13 配置鼠标


    要配置您的鼠标，请选择最符合您鼠标类型的选项并按 `Enter`。如果您拥有双键鼠标，并希望同时单击左右键来模拟第三个（中间）键，请选择 **Emulate
    3 Buttons**（模拟三键）。


    如果您选择串行鼠标，下一个对话框将提示您输入鼠标连接的串行


    ![](img/06353bca937b38b02602dcfb58824d72_45_0.png)


    图 2.16：未解析的依赖关系


    (COM) 端口。选择正确的端口并按 `Enter`。


    **请注意**：如果您的鼠标连接到 PS/2 鼠标端口，无论鼠标类型如何，都应选择 PS/2 Mouse。


    如果您希望在 Red Hat Linux 系统启动后更改鼠标配置，可以使用 /usr/sbin/mouseconfig 命令。


    ### 2.4.14 配置 X Windows


    设置完鼠标后，如果您安装了 X Windows 软件包，则有机会配置您的 X 服务器。如果您未选择安装 X 窗口系统，可以跳到下面的 2.4.15 节。


    #### 配置 Metro-X 服务器


    如果您正在从官方 Red Hat Linux/Intel CD 安装，您可以安装 MetroLink 的 Metro-X 服务器的一份副本，这是一个用于 Linux
    的高质量商业 X 服务器。请参阅随附于您的 Red Hat Linux CD 的 MetroLink 许可协议（纸质副本）以获取许可信息。如果您选择


    使用 Metro-X，安装程序将启动 Metro-X 配置工具 **configX**；有关如何使用 **configX** 的更多信息，请参阅第 5 章第
    5.3 节。


    #### 配置 XFree86 服务器


    如果您希望使用 XFree86（因为 Metro-X 可能不支持您的视频卡，因为您已在另一台机器上安装了 Metro-X，因为您的 Red Hat Linux/Intel
    副本未包含 Metro-X，或者您只是更喜欢使用 XFree86），安装程序将启动 **Xconfigurator** 工具，该工具在第 5 章第 5.2
    节中有详细说明。


    **Xconfigurator** 首先显示视频卡列表。从列表中选择您的视频卡并按 `Enter`。如果您的视频卡未出现在列表中，XFree86 可能不支持它；但是，如果您对显卡有技术了解，您可以选择
    **Unlisted Card**（未列出的显卡）并尝试进行配置。


    选择视频卡后，安装程序将安装相应的 XFree86 服务器，然后 **Xconfigurator** 显示监视器列表。如果您的监视器出现在列表中，请选择它并按
    `Enter`。否则，请选择 **Custom**（自定义）。如果您选择 **Custom**，**Xconfigurator** 将提示您选择监视器的水平同步范围和垂直同步范围（这些值通常可在随附的监视器文档中，或从您的监视器供应商或制造商处获取）。


    > 请注意：不建议选择“类似”的监视器，除非您确定所选监视器不超过您监视器的能力。如果这样做，可能会导致您的监视器超频并损坏或毁坏它。


    接下来，**Xconfigurator** 提示您输入视频卡上安装的视频内存量。如果您不确定，请查阅随视频卡附带的文档。选择超过可用内存的数量不会损坏您的视频卡，但如果这样做，XFree86
    服务器可能无法正确启动。


