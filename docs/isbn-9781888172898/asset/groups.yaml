    \ MILO 映像的名称，例如输入“noname.arc”后按回车键。\n\n13. 按 ESC 键返回“启动选择菜单”。\n\n14. 选择“设置菜单”（或再次按\
    \ ESC 键），然后选择“辅助菜单，并保存更改”选项。\n\n15. 按 ESC 键将返回“启动菜单”，此时您可以尝试启动 MILO。如果您不希望 Linux\
    \ 作为第一启动选项，可以在“启动选择菜单”中调整启动选项的顺序。\n\n完成以上步骤后，您应该拥有一个类似于以下内容的启动选择配置：\n\n```\nLOADIDENTIFIER=Linux\n\
