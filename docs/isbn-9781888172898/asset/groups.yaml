    ### 2.4.7 SCSI 支持


    选择执行升级还是完全安装后，安装程序会询问您是否有任何 SCSI 适配器。如果您选择**是**，以下对话框将显示 SCSI 驱动程序列表。选择最接近您的 SCSI
    适配器的驱动程序。然后，安装程序将为您提供机会指定所选 SCSI 驱动程序选项；不过，大多数 SCSI 驱动程序会自动检测您的硬件。


    ### 2.4.8 如果您通过 FTP 或 SMB 安装


    如果您不是通过 FTP 或通过 SMB 卷安装 Red Hat Linux，则可以跳至下面的第 2.4.9 节。


    ### 选择网络驱动程序


    如果您是通过 FTP 或通过 SMB 卷安装，您的计算机中必须装有受支持的网络卡。安装程序将提示您选择支持您网络卡的驱动程序，并指定驱动程序定位和识别该卡所需的任何选项。大多数情况下，驱动程序可以通过*探测*自动定位该卡；但是，探测您的硬件可能会导致机器挂起。如果发生这种情况，请重新启动机器，再次启动安装过程，并在到达此步骤时指定额外的驱动程序选项（参见附录
    A）。


    ### 配置 TCP/IP 网络


    在安装程序找到您的网络卡后，它会显示几个用于配置 TCP/IP 网络的对话框。此信息仅在安装过程中使用；之后您将能够配置永久网络信息。如果您想从除机器将“驻留”的网络以外的网络进行安装，此功能可带来更大的灵活性。图
    2.5 包含示例网络信息。


    第一个对话框询问您的 IP 地址和其他网络地址（见图 2.6）。输入您在安装期间使用的**IP 地址**，并按[Enter]。安装程序会根据您的 IP 地址尝试猜测您的**子网掩码**；如果子网掩码不正确，您可以修改它。按[Enter]。安装程序根据您的
    IP 地址和子网掩码猜测**默认网关**和**主名称服务器**地址；如果它们不正确，您可以修改它们。选择**确定**继续。


    第二个对话框提示您输入域名、主机名和其他网络信息（见图 2.7）。输入您系统的**域名**并按[Enter]；安装程序会将域名向下传递到**主机名**字段。输入域名前的主机名以形成完全合格域名
    (FQDN)。如果您的网络有一个以上的名称服务器，您可以在**辅助名称服务器**和**三级名称服务器**字段中输入额外名称服务器的 IP 地址。选择**确定**继续。


    ### FTP 服务器信息


    如果您通过 FTP 安装，下一个对话框将请求关于 FTP 服务器的信息（见图 2.10）。输入您正在从中安装的 FTP 站点的名称或 IP 地址，以及包含您的架构的
    RedHat 目录的目录名称。例如，如果 FTP 站点包含目录 */pub/mirrors/redhat/1386/RedHat*，请输入 */pub/mirrors/redhat/1386*。如果您没有使用匿名
    FTP，或者如果您需要使用代理 FTP 服务器（例如，如果您位于防火墙之后），另一个对话框将请求 FTP 账户或代理信息。


    ### SMB 服务器信息


    如果您通过 SMB 卷安装，下一个对话框将请求关于 SMB 服务器的信息（见图 2.11）。输入您的 SMB 服务器的名称或 IP 地址，包含 Red Hat
    Linux CD 的共享卷的名称，以及该卷的账户名和密码。


    ### 2.4.9 为 Red Hat Linux 创建分区


    在选择是否使用 SCSI 支持之后（并且，如果您通过 FTP 安装，在配置完网络信息之后），安装程序会列出它可以在您系统上找到的硬盘列表，并提示您为 Red
    Hat Linux 预留至少一个磁盘分区。如果您需要创建一个或多个分区，请选择您要分区的磁盘并按 Enter；安装程序将启动 Linux fdisk 实用程序。有关
    Red Hat Linux 分区的建议，请参阅第 2.2.3 节。


    ![](img/06353bca937b38b02602dcfb58824d72_38_0.png)


    ### 使用 fdisk


    fdisk 包含简洁但有用的在线帮助。以下是一些提示：


    - 要列出当前分区表，请使用 `p` 命令。要添加新分区，请使用 `n`。

    - Linux fdisk 默认创建类型为 Linux 原生的分区。创建交换分区时，别忘了使用 `t` 命令将其更改为 Linux 交换类型。

    - Linux 允许在一个磁盘上最多有四个 (4) 分区。如果您希望创建更多的分区，这四个分区中的一个可以是扩展分区，该分区进而包含一个或多个逻辑分区。由于它充当容器，扩展分区必须跨越逻辑分区将占据的所有空间。

    - 在创建每个分区时，记下哪些分区（例如，`/dev/hda2`）用于哪些文件系统（例如，`/usr`）是个好主意。


    ![](img/06353bca937b38b02602dcfb58824d72_39_0.png)


    - **请注意：** 您所做的任何更改在保存并使用 **w** 命令退出 **fdisk** 之前不会生效。您可以随时使用 **q** 命令在不保存更改的情况下退出
    **fdisk**。


    ### 分区编号


    Linux 使用字母和数字的组合来指代磁盘分区，这可能会让缺乏经验的用户感到困惑。以下是摘要：


    - **字母**表示分区所在的设备，例如，`/dev/hda`（第一个 IDE 硬盘）或 `/dev/sdb`（第二个 SCSI 磁盘）。

    - **数字**表示分区。前四个（主或扩展）分区编号为 1 到 4。逻辑分区从 5 开始。例如，`/dev/hda3` 是第一个 IDE 硬盘上的第三个主或扩展分区；`/dev/sdb6`
    是第二个 SCSI 硬盘上的第二个逻辑分区。


    ### 更改分区表


    完成磁盘分区后，请按**完成**；您可能会看到一条消息，指示安装程序需要重新启动。这是在更改磁盘分区数据后的正常现象；如果您创建、更改或删除了任何扩展分区，通常会发生这种情况。按**确定**后，您的机器将重新启动。按照您之前直到**分区磁盘**步骤所做的相同安装步骤进行；然后只需选择**完成**。


    ### 2.4.10 初始化交换空间


    为 Red Hat Linux 创建分区后，安装程序会查找交换分区。如果找到任何分区，它会询问您是否想要初始化它们。使用 Space 选择您希望初始化为交换空间的分区；如果您希望检查分区中是否有坏块，请确保选中**在格式化期间检查坏块**复选框。选择**确定**。


    如果安装程序找不到您的交换分区，请确保已将分区类型设置为*Linux 交换*；参见上面的第 2.4.9 节。


    ### 2.4.11 文件系统配置


    由于 Red Hat Linux 可能分布在几个磁盘分区上，您需要选择哪些磁盘分区与哪个*文件系统*配合使用。


    ### 选择根分区


    如果您正在执行完全安装，安装程序会列出它可以找到的 Linux 分区，并提示您选择一个*根分区*。根分区（或*根文件系统*）是承载启动您的 Red Hat
    Linux 系统所需的所有内容的分区；当您的系统启动时，它挂载在 /（*根目录*）上。选择您希望使用的根分区并按 Enter。


    如果您正在执行升级，安装程序会尝试自动找到您的根分区；如果找到一个，它将进入下一步。


    '
