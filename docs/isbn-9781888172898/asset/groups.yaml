    When you are finished partitioning your disks, press **Done**; you may see a message
    indicating that the installation program needs to reboot. This is a normal occurrence
    after changing a disk''s partition data; it usually happens if you created, changed,
    or deleted any extended partitions. After you press **OK**, your machine will
    reboot. Follow the same installation steps you did up until **Partitioning Disks**;
    then simply choose **Done**.


    ### 2.4.10 Initializing Swap Space


    After creating partitions for Red Hat Linux, the installation program looks for
    swap partitions. If it finds any, it asks whether you want to initialize them.
    Select the partition(s) you wish to initialize as swap space using Space; if you
    wish to check the partitions for bad blocks, make sure the **Check for bad blocks
    during format** box is checked. Choose **OK**.


    If the installation program can''t find your swap partition, make sure you have
    set the partition type to *Linux swap*; see Section 2.4.9 above.


    ### 2.4.11 Filesystem Configuration


    Since Red Hat Linux may be distributed across several disk partitions, you need
    to choose which disk partitions go with which *filesystem*.


    ### Selecting the Root Partition


    If you are performing a full install, the installation program presents a list
    of the Linux partitions it can find and prompts you to choose a *root partition*.
    The root partition (or *root filesystem*) is the one which holds everything necessary
    to boot your Red Hat Linux system; it is mounted on / (the *root directory*) when
    your system boots. Select the root partition you wish to use and press Enter.


    If you are performing an upgrade, the installation program tries to find your
    root partition automatically; if it finds one, it goes on to the next step.

