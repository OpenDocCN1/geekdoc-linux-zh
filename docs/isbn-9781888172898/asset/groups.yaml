    \n如果在特定情况下，本节的任何部分被判定为无效或不可执行，该节的其余部分旨在继续适用，并且该节整体旨在在其他情况下适用。\n\n本节的目的并不是诱导您侵犯任何专利或其他财产权索赔，或质疑此类索赔的有效性；本节的唯一目的是保护自由软件分发系统的完整性，该系统通过公共许可惯例实施。许多人依赖于该系统的持续一致应用，通过该系统向范围广泛的软件做出了慷慨的贡献；由作者/捐赠者决定他或她是否愿意通过其他系统分发软件，被许可人不能强加这一选择。\n\
    \n本节旨在彻底阐明据认为这是本许可证其余部分的结果。\n\n## 8\n如果程序的分发和/或某些国家受到专利或版权接口的限制，将程序置于本许可证下的原始版权持有人可以添加明确的地理分发限制，排除这些国家，以便仅在未被排除的国家内或国家之间允许分发。在这种情况下，本许可证将该限制纳入其中，仿佛它写在本许可证正文中一样。\n\
