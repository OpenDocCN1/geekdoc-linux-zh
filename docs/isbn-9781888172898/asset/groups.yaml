    \n## 安装和管理简便。\n\n借助 RPM™ 打包系统和模块化内核，操作系统的安装从未如此简单。只需选择一个或多个配置选项，您的安装可用于以下用途：\n\
    \n- C 和 C++ 开发\n- 匿名 FTP/Gopher\n- NDIS\n- 新闻服务器\n- 网络管理\n- 豪华工作站\n- 游戏机\n- X\
