    ### C.1 什么是 Alpha


    “Alpha”是 Digital 的 64 位 RISC 架构的名称。Digital 的 Alpha 项目始于 1989 年中旬，旨在为 VAX 客户提供一条高性能的迁移路径。这并不是
    Digital 推出的第一个 RISC 架构，但它是首个进入市场的。当 Digital 于 1992 年 3 月宣布 Alpha 时，它做出了进入商用半导体市场的决定，通过销售
    Alpha 微处理器来实现。Alpha 有时也被称为 Alpha AXP，原因晦涩难懂且不值得深究。简而言之，它们是一样的。


    ### C.2 什么是 Digital Semiconductor


    Digital Semiconductor（DS，http://www.digital.com/info/semiconductor/）是数字设备公司（Digital
    - 我们不喜欢 DEC 这个名称）内部负责在商用市场销售半导体的业务部门。Digital 的产品包括 CPU、支持芯片组、PCI-PCI 桥以及用于通信和多媒体应用的
    PCI 外设芯片。


    ### C.3 Alpha CPUs


    目前有两代 CPU 内核实现了 Alpha 架构：


    - EV4

    - EV5


    关于“EV”代表什么，人们观点不一（编辑注：真实答案当然是“Electro Vlassic”，参见第 C.12 节），但其中的数字代表该内核所使用的 Digital
    CMOS 技术的第一代。因此，EV4 最初是在 CMOS4 中实现的。随着时间推移，CPU 往往会通过光缩小至下一代 CMOS 工艺来获得中期性能提升。因此，EV4S
    就是采用 CMOS5 工艺实现的 EV4 内核。将设计缩小到特定技术与从头开始在该技术中实现设计之间存在巨大差异（但我现在不想深入讨论这一点）。这里还有几个变数：还有
    CMOS4S（在 CMOS4 中进行光缩小）和 CMOS5L。


    真正的技术迷可能会感兴趣的是：CMOS4 是 0.75 微米工艺，CMOS5 是 0.5 微米工艺，而 CMOS6 是 0.35 微米工艺。


    将这些 CPU 内核映射到芯片，我们得到：


    ```

    /21064-150,166/ EV4 (originally), EV4S (now)

    /21064-200/ EV4S

    /2106A-A-233,275.300/ EV45

    /21066/ LCA45 (EV4 core, with EV4 FPU)

    /21066A-233/ LCA45 (EV4 core, but with EV45 FPU)

    /21164-233,300,333/ EV5

    /21164A-417/ EV56

    /21264/ You''ll just have to wait and see...

    ```


    EV4 内核是一个双发射（每个 CPU 时钟可发射 2 条指令）超流水线内核，包含整数单元、浮点单元和分支预测。它是完全旁路的，具有 64 位内部数据通路和紧耦合的
    8Kbyte 缓存，分别用于指令和数据。这些缓存是写穿式的（它们永远不会变脏）。


    EV45 内核对 EV4 内核进行了一些调整：它具有稍经改进的浮点单元，以及 16KB 缓存，分别用于指令和数据（它还具备缓存奇偶校验）。（编辑注：Neal
    Crook 在一封单独的邮件中指出，浮点单元（FPU）的更改提高了除法的性能。EV4 FPU 除法器单次精度除法需要 34 个周期，双精度除法需要 63 个周期（非数据依赖）。相比之下，EV45
    除法器通常单次精度除法需要 19 个周期（最大 34 个周期），双精度除法通常需要 29 个周期（最大 63 个周期）（数据依赖）。）


    EV5 内核是一个四发射内核，同样是超流水线、完全旁路的等等。它具有紧耦合的 8Kbyte 缓存，分别用于指令（I）和数据（D）。这些缓存是写穿式的。它还有一个紧耦合的
    96Kbyte 片上二级缓存（Scache），该缓存为 3 路组相联且写回式（它可以变脏）。EV4 到 EV5 的性能提升超过了仅通过时钟速度提升所达到的幅度。除了更大的缓存和四发射外，还进行了微架构改进，以减少某些路径中生产者/消费者之间的延迟。


    EV56 内核在基本微架构上与 EV5 相同，但它为 8 位和 16 位加载和存储增加了一些新指令（参见第 C.8 节“字节及相关内容”）。这些指令主要用于设备驱动程序。EV56
    内核在 CMOS6 中实现，这是一种 2.0V 工艺。


    21064 于 1992 年 3 月宣布。它使用 EV4 内核，具有 128 位总线接口。总线接口支持轻松连接外部二级缓存，块大小为 256 位（在总线上为
    2 个数据拍）。缓存时序完全由软件可配置。21064 也可以配置为使用 64 位外部总线（但我不确定是否有出货系统使用此模式）。21064 不强制对缓存实施策略，但通常配置为写回缓存。21064
    确实包含钩子，允许外部硬件维护外部缓存与内部缓存之间的一致性，但这很复杂。


    21066 使用 EV4 内核，并集成了内存控制器和 PCI 主机桥。为了节省引脚，内存控制器具有 64 位数据总线（但内部缓存的块大小为 256 位，与
    21064 相同，因此填充一个块需要在总线上进行 4 个拍）。内存控制器支持外部缓存和外部 DRAM。缓存和 DRAM 的时序完全由软件可配置，并且可以精确到
    CPU 时钟周期进行控制。虽然填充缓存块需要 4 个拍的过程听起来不太好，但并不像听起来那么糟糕，因为 DRAM 访问是在页面模式下进行的。不幸的是，内存控制器不支持任何新的奇特
    DRAM（SDRAM、EDO 或 BEDO）或同步缓存 RAM。PCI 总线接口完全符合 rev2.0 规范，运行频率最高为 33MHz。


    21164 具有 128 位数据总线并支持拆分读取，任何时刻最多可有 2 个未完成的读取（这允许在最佳条件下的 100% 利用率，即理论上你可以在每个总线时钟传输
    128 位数据）。21164 支持轻松连接外部三级缓存，并具有所有钩子，允许外部系统维护与所有缓存的完全缓存一致性。因此，对称多处理器设计变得“容易”。


    21164A 于 1995 年 10 月宣布。它使用 EV56 内核。它在名义上与 21164 引脚兼容，但需要分割电源轨；21164 上所有提供 +3.3V
    电源的引脚现在被分为两组；一组向 CPU 内核提供 2.0V 电源，另一组向 I/O 单元提供 3.3V。与较旧的组件不同，21164 的引脚不耐受 5V。这一更改的结果是，21164
    系统通常无法升级到 21164A（尽管请注意，设计一个也能容纳 21164 的 21164A 系统相对简单）。21164A 还有两个新引脚支持新的 8 位和
    16 位加载和存储。它还改进了 21164 对使用同步 SRAM 实现外部缓存的支持。


    '
