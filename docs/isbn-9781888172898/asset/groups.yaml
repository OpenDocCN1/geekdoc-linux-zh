    ## 8.6 Kernel Daemon Configuration


    As discussed in Chapter 5, Red Hat Linux includes **kerneld**, the Kernel Daemon,
    which automatically loads some software and hardware support into memory as it
    is needed, and unloads it when it is no longer being used.


    The tool shown in Figure 8.17 manages the configuration file for kerneld. While
    kerneld can load some things, such as filesystems, without explicit configuration,
    it needs to be told what hardware support to load when it is presented with a
    generic hardware request.


    ![](img/06353bca937b38b02602dcfb58824d72_136_0.png)


    For instance, when the kernel wants to load support for ethernet, kernel need
    to know which ethernet card you have, and if your ethernet card requires special
    configuration, it needs to know about that, too.


    ### 8.6.1 Changing Module Options


    To change the options being given to a module when it is loaded, click on the
    line to select it, then click the **Edit** button. kernelcfg will bring up a window
    which looks like Figure 8.18. The options which kernelcfg knows about them (normally
    all available options) each have their own field. Normally, you will want to ignore
    the **Other arguments** field. Some modules normally take no arguments; just in
    case, they have an **Arguments** field which allows you to enter configuration
    information.


    ### 8.6.2 Changing Modules


    To change which module gets invoked to provide a generic service, such as an ethernet
    card or SCSI host adapter module, you need to delete the old one and add a new
    one. To delete a module, select it by clicking on it, then click on **Delete**.
    Then click on **Add** to add the new module, as explained in the following section.


    If you have changed your SCSI controller (**scsi_hadapter**), remember to make
    a new initial ramdisk with the /sbin/mkinitrd command as documented in section
    5.1.2.


    ![](img/06353bca937b38b02602dcfb58824d72_137_0.png)


    ### 8.6.3 Adding Modules


    To add a module of any type, click on the Add button. You will be presented with
    a dialog box (Figure 8.19) asking you to choose a module type. Ethernet is eth,
    Token Ring is tr, SCSI controllers are scsi_hostadapter, and so on. Click OK to
    continue to the next dialog box. If there is more than one module which can be
    used for the module type you have chosen, you will be presented with a dialog
    box (Figure 8.20) which asks which module you want to use, and may also ask for
    specifics about the type of module; for ethernet, for example, you need to choose
    from eth0, eth1, etc. When you are done, click OK again to continue to specify
    any module options in the next dialog box (Figure 8.20), which is the same as
    the dialog for editing a module.


    ![](img/06353bca937b38b02602dcfb58824d72_137_1.png)


    ![](img/06353bca937b38b02602dcfb58824d72_138_0.png)


    Figure 8.20: Selecting from available modules


    ### 8.6.4 Restarting kerneld


    The changes that you make with the Kernel Daemon Configuration tool will be made
    in the /etc/conf.modules file, which kerneld reads whenever it is started. Once
    you have made changes, you can restart kerneld by clicking on the **Restart kerneld**
    button. This will not cause any modules which are currently in use to be reloaded,
    it will only notify kerneld to use the configuration when it loads more modules
    in the future.


    ## Chapter 9


    # Glint


    Red Hat provides a graphical tool to aid in package installation and removal.
    It’s called glint (Graphical Linux INstallation Tool) and runs under the X Windows
    System. It allows easy installation, uninstallation, upgrading, querying, and
    verification of packages. The interface is similar to the one found in many popular
    file managers and is simple to use.


    Operations are performed in glint by selecting the packages to operate on and
    then selecting the operation to perform via pushbuttons. Installing a package
    places all of the components of that package on your system. Uninstalling one
    removes all traces of the package except for configuration files you have modified.
    Upgrading a package installs the newly available version and uninstalls all other
    versions that were previously installed. This allows quick upgrading to the latest
    releases of packages.


    The query operation lets you examine the details of both installed or available
    package. You can view the description of the package, where and when it was built,
    the files in the package, and other attributes. All of the configuration and documentation
    components of each package are clearly marked as such to reduce the time you spend
    looking for them.


    Using glint to perform all of these operations is the same as using rpm to do
    them from the command line. However, the graphical nature of glint often makes
    these operations easier to perform.


    The normal way to handle glint is to display the available packages and files,
    select the ones you want to operate on, and then press a button or choose a menu
    item that performs the operation. For instance, you can install several packages
    with a few button clicks.


