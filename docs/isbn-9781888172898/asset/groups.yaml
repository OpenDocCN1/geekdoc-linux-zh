    \ X 客户端。\n\n- **DPMSoffDelay** <number>\n  这控制自最后一次用户输入后屏幕进入 DPMS 关闭模式前的秒数。关闭模式提供最大化的电源减少。要激活此模式，X\
    \ 服务器禁用显示器的水平和垂直同步信号。\n\n- **DPMSstandbyDelay** <number>\n  这控制自最后一次用户输入后屏幕进入\
    \ DPMS 待机模式前的秒数。待机模式提供最小化的电源减少。要激活此模式，X 服务器禁用显示器的水平同步信号。\n\n- **DPMSsuspendDelay**\
    \ <number>\n  这控制自最后一次用户输入后屏幕进入 DPMS 挂起模式前的秒数。挂起模式提供显著的电源减少。要激活此模式，X 服务器禁用显示器的垂直同步信号。\n\
    \n- **Driver** <string>\n  这引用驱动程序的名称，通常对应于 X 服务器的名称。例如：\n  ```\n  Driver 8514\n\
