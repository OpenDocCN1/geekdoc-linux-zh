    接下来的段落将更详细地描述这些功能部分。


    可以将 PALCode 视为一个微小的软件层，用于将芯片定制为适应特定的操作系统。它运行在一种特殊模式（PALmode）下，该模式具有限制条件，但它使用标准的
    Alpha 指令集，并额外增加了指令。通过这种方式，Alpha 芯片可以运行 Windows NT、OpenVMS、Digital Unix 以及当然还有
    Linux 等多样化的操作系统。MILO 使用的（因此也是 Linux 本身使用的）PALCode 与 MILO 的其他部分一样，是自由软件。它源自 Digital
    的评估板软件示例 Digital Unix PALCode。不同 PALCode 之间的差异源于不同 Alpha 芯片之间在地址映射和中断处理方面存在的差异（基于
    21066 的系统与 21064+2107x 系统具有不同的 I/O 映射），以及不同 Alpha 架构系统之间的差异。


    为了让 MILO 正常工作，它需要知道可用的内存、Linux 最终将从何处运行，并且必须能够为 Linux 设备驱动程序分配临时内存。该代码维护一个内存映射，其中包含永久分配页和临时分配页的条目。在启动过程中，MILO
    会将自身解压到物理内存中的正确位置。当它将控制权交给 Linux 内核时，它会为自身的压缩版本、PALCode（内核需要此部分）以及一些数据结构预留内存。这为
    Linux 本身留出了系统中大部分内存。


    内存代码的最后一步是设置并开启虚拟寻址，以便 Linux 期望看到的数据结构位于虚拟内存的正确位置。


    MILO 包含视频代码，用于初始化并使用系统的视频设备。如果存在 VGA 设备，它将检测并使用该设备；否则，它将尝试使用 TGa (21030) 视频设备。如果上述尝试均失败，它将假设没有图形设备。标准预构建映像中包含的
    BIOS 模拟是 Digital 自己的 BIOS 模拟，它支持几乎所有（如果不是全部）可用的标准图形设备。


    Linux 设备驱动程序驻留在内核中，并期望内核提供某些服务。其中一些服务由 Linux 内核代码直接提供，例如中断处理；另一些服务则由内核类似例程提供。


    MILO 最强大的功能是可以将未经修改的 Linux 设备驱动程序嵌入其中。这使其具备支持所有 Linux 支持的设备的能力。MILO 包含了构建时所针对的
    Linux 内核中配置的所有块设备，以及大量的块设备代码（例如，`ll_rw_blk()`）。


    MILO 从真实的文件系统加载 Linux 内核，而不是从引导块或其他奇怪的地方加载。它支持 MSDOS、EXT2 和 ISO9660 文件系统。支持 Gzip
    压缩的文件系统，并推荐使用这些系统，特别是当你从速度较慢的软盘加载时。MILO 通过 `.gz` 后缀识别这些文件。


    MILO 内置了一个简单的键盘驱动程序，配合同样简单的视频驱动程序，使其拥有简单的用户界面。该界面允许你列出配置设备上的文件系统、启动 Linux、运行闪存更新工具以及设置控制系统引导的环境变量。像
    LILO 一样，你可以向内核传递参数。


    MILO 必须告知 Linux 内核系统类型、内存容量以及哪部分内存是空闲的。它使用 HWRPB（硬件重启参数块）数据结构及相关内存簇描述信息来实现这一点。这些数据结构在控制权传递给
    Linux 内核之前，被放置在虚拟内存的适当位置。


    ## D.3 预构建的标准 MILO 映像


    如果你计划在标准的基于 Alpha 的系统上运行 Linux，那么可以使用预构建的“标准” MILO 映像。这些文件（连同源代码和其他有趣的内容）可以在 `ftp://gatekeeper.dec.com/pub/Digital/Linux-Alpha/MiniLoader`
    中找到。


    `images` 子目录包含每个标准系统（例如 AlphaPC64）的目录，MILO 映像的命名约定如下：


    - MILO - Miniloader 可执行映像，此映像可以通过多种方式加载，

    - fmu.gz - 闪存管理工具，

    - `MILO.dd` - 引导块软盘映像。这些应使用 `rawrite.exe` 或 Linux 上的 `dd` 进行写入。


    **test-images** 与 **images** 子目录类似，包含每个标准系统的目录。这些映像具有一定的实验性质，但往往包含所有最新功能。


    ## D.4 如何构建 MILO


    你单独构建 MILO，而不是与内核一起构建。由于 MILO 需要内核的部分功能才能运行（例如中断处理），你必须首先配置并构建与你要构建的 MILO 匹配的内核。通常这意味着使用相同的版本号构建内核。因此，`MILO-2.0.25.tar.gz`
    将针对 `linux-2.0.25.tar.gz` 进行构建。MILO 可能针对更高版本的内核构建，但也不一定。此外，由于现在完全支持 ELF 共享库，MILO
    源代码有两个版本。要在 ELF 系统下构建，你必须先解压标准 MILO 源代码，然后使用相同版本号的 ELF 补丁修补这些源代码。在本文其余部分，我假设你的内核源代码和目标文件存储在
    `/usr/src/linux` 的子树中，并且 Linux 内核已通过命令 **make boot** 完全构建。


    要构建 MILO，请更改工作目录到 MILO 源代码目录，并执行以下 make 命令：


    ```

    $ make KSRC=/usr/src/linux config

    ```


    就像 Linux 内核一样，你会被询问一系列问题


    ```

    将输出回显到串口 (MINI_SERIAL_ECHO) [y]

    ```


    如果可以的话，将内核 printk 回显到 `/dev/ttyS0` 是个好主意。如果你可以（并且愿意），请输入 "y"，否则输入 "n"。所有标准预构建的
    MILO 映像都包含使用 COM1 的串口 I/O。


    ```

    使用 Digital 的 BIOS 模拟代码（非自由软件） \

    (MINI_DIGITAL_BIOS_EMU) [y]

    ```


    此代码作为库包含，只要其在基于 Alpha 的系统上使用时，可以自由分发。源代码不可用。如果你回答 n，则构建自由软件的替代 BIOS 模拟。其源代码包含在
    MILO 中。请注意，目前不能在 ELF 系统上选择 Digital 的 BIOS 模拟代码（库尚未准备就绪），因此你必须对这个问题回答 no。


    ```

    从源代码构建 PALCode（警告：这很危险） \n  (MINI_BUILD_PALCODE_FROM_SOURCES) [n]

    ```


    只有当你修改了 PALCode 源代码时，才应该这样做；否则，请使用 MILO 中包含的标准预构建 PALCode。


    现在，你可以构建 MILO 映像本身了：


    ```

    $ make KSRC=/usr/src/linux

    ```


    当构建成功完成后，MILO 映像位于名为 `milo` 的文件中。有很多名为 `milo.*` 的映像，这些应被忽略。


    ## D.5 如何加载 MILO


    加载 MILO 最常见支持的方法是从 Windows NT ARC 固件加载，因为大多数出厂系统都支持此方法。然而，加载 MILO 的方式多种多样。它可以来自：


    - 保险引导块软盘，

    - Windows NT ARC 固件，

    - Windows NT AlphaBIOS，

    - Digital 的 SRM 控制台，

    - Alpha 评估板调试监视器，

    - 闪存/ROM。


    ### D.5.1 从 Windows NT ARC 固件加载 MILO


    大多数（如果不是全部）基于 Alpha AXP 的系统都包含 Windows NT ARC 固件，这是引导 MILO 从而引导 Linux 的首选方法。一旦
    Windows NT 固件运行且你拥有适合你系统的正确 MILO 映像，这种方法就完全通用了。


    Windows NT ARC 固件是一个环境，程序可以在其中运行并回调固件以执行操作。Windows NT OSloader 是一个完全执行此功能的程序。Llnload.exe
    是一个简单得多的程序，它仅执行足够的操作来加载并执行 MILO。它加载适当的映像文件到内存地址 0x00000000，然后对其进行 swap-PAL PALcall。MILO
    与 Linux 一样，使用不同于 Windows NT 的 PALCode，这就是为什么必须发生交换的原因。MILO 将自身重定位到 0x200000，并通过
    PALcode 重置入口点继续，如前所述。


    在添加 Linux 启动选项之前，你需要将 llnload.exe 和你要加载的适当 MILO 复制到 Windows NT ARC 固件可以读取的某个位置。在下面的示例中，我假设你从
    DOS 格式软盘引导：


    1. 在引导菜单中，选择 "Supplementary menu..."（附加菜单...）

    2. 在 "Supplementary menu"（附加菜单）中，选择 "Set up the system..."（设置系统...）

    3. 在 "Setup menu"（设置菜单）中，选择 "Manage boot selection menu..."（管理启动选择菜单...）

    4. 在 "Boot selections menu"（启动选择菜单）中，选择 "Add a boot selection"（添加启动选择）

    5. 选择 "Floppy Disk 0"（软盘 0）

    6. 输入 "llnload.exe" 作为 o loader 目录和名称

    7. 对于操作系统是否与 o loader 在同一分区上，回答 "yes"（是）

    8. 输入 "\" 作为操作系统根目录

    9. 我通常输入 "Linux" 作为此启动选择的名称

    10. 对于是否在引导时初始化调试器，回答 "No"（否）


