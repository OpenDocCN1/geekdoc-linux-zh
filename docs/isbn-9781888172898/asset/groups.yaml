    \ 税务文档格式化\n- 或使用手动配置选项，按照您的需求安装和配置您的 Linux 计算机。\n\n许多功能强大、高级的图形工具可为高级用户节省数小时的时间，并允许新手系统管理员根据需要自定义和定制系统。这套工具涵盖：TCP/IP、PPP、SLIP、文件系统、用户和组、软件包等的配置，以及更多功能。RPM\
    \ 打包系统作为 Linux 用户的入门指南，使系统升级和维护变得简单无忧。Red Hat Linux 4.2 版本包含独特的工具组合，可自动化安装、卸载和升级软件包时使\
    \ Linux 系统变难的许多任务。\n\n## 高级系统和网络安全功能。\n\nRPM 系统的灵活性使得 Red Hat Linux 赢得了作为现有最安全操作系统之一的声誉。几乎每当在互联网上发现安全漏洞时，Red\
    \ Hat Software 就会发布新的或更新的包以应对新威胁，从而为您节省时间并降低被入侵的可能性。Red Hat Linux 4.2 版本支持标准“UNIX”密码认证，同时也支持“Shadow”（影子）密码以提供额外安全性。可插拔认证模块（PAM）系统允许编写额外的认证方法并动态添加到系统中，以满足您的特殊安全需求。\n\
    \n## 从旧版本升级。\n\n由于 Red Hat Linux 4.2 版本采用先进的 RPM 技术构建，您的系统将永远不会过时。当新版本发布时，您可以使用简单的升级程序将任何或所有组件升级到最新版本，该程序将为您完成所有工作。Red\
    \ Hat Linux 2.0 及更高版本的用户可以简单轻松地将系统升级到 4.2。\n\n![](img/06353bca937b38b02602dcfb58824d72_267_0.png)\n\
