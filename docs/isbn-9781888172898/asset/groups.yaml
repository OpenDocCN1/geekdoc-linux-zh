    your system. Please don''t forget to remove the installation floppy from the diskette
    drive.


    At the boot: prompt, press Enter and watch your Red Hat Linux system boot. When
    it presents the login: prompt, enter root; at the Password: prompt, type the root
    password you set for your machine in Section 2.4.18.


    # Chapter 3: Installing Red Hat Linux/Alpha


    ## 3.1 Introduction


    These are brief installation instructions for the Red Hat Linux/Alpha 4.2 release
    for Digital Equipment Corporation''s Alpha series of processors. This chapter
    describes the differences between installing Red Hat Linux/Alpha and Red Hat Linux/Intel.
    For further details on the installation procedure, please see Chapter 2, *Installing
    Red Hat Linux/Intel*.


    ## 3.2 Supported Hardware


    Red Hat Linux/Alpha supports a variety of hardware based on the Alpha processor
    and the PCI bus. Platforms on which this release is known to work include:


    - 1. AlphaPC64 (Cabriolet, Aspen Telluride)

    - 2. AxpPCI33 (Noname)

    - 3. EB64+ (Aspen Alpine)

    - 4. EB66 (NekoTech Mach 1)

    - 5. EB66+

    - 6. Jensen (DEC PC 150, 2000 model 300, Cullean)

    - 7. Universal Desktop Box (UDB, sometimes called Multia). This is just a nomae
    board and is treated as such for the rest of this document.

    - 8. AlphaStation 200, 250, 255, 400 (Avanti machines)

    - 9. EB164 (Aspen Avalanche, Timberline, Summit; Microway Screamer)

    - 10. Platform 2000 machines from Kinetics

    - 11. PC164 machines (Durango)

    - 12. Alcor type machines (AlphaStation 500, 600; Maverick, Brett)

    - 13. Alpha-XL

    - 14. Alpha-XLT (XL 300, XL 366)

    - 15. Mikasa type machines (AlphaServer 1000), 1000A not supported


    All of those platforms except the Jensen include an NCR 810 SCSI controller, though
    BusLogic PCI SCSI controllers (other than the FlashPoint), the Adaptec AHA2940
    SCSI controller, and Qlogic 1020 ISP controllers are also supported. The Jensen
    design uses an AHA1740 SCSI controller and is supported.


    NE2000, DE422, and DE4x5 (PCI) Ethernet cards are supported. This includes the
    UDB’s internal Ethernet hardware. Token ring support is also included in the kernels.


    The X Window System should work on any machine with a S3 based video card except
    the Jensen machines. There is a server available from ftp://ftp.astrarnet.com
    for S3 cards in /pub/linux/axp/jensen. Most of the cards from Orchid and Number
    9 will work. Most Diamond Stealth cards are also supported. Digital TGA cards
    (based on the DC21030 chip) are supported in 8 bit mode, and an X server for Mach64
    cards is also provided.


    More information on Alpha hardware is available in Appendix C.


    ## 3.3 Installation Overview


    Installing Red Hat Linux on an Alpha system is slightly more complex than installing
    Red Hat Linux/Intel, mostly due to differences in machine architecture. For most
    systems, the main steps to a successful install are:


    - 1. Install MILO, the Linux/Alpha miniloader, onto your machine (or onto a floppy
    disk); see Section 3.4, *Installing MILO*.

    - 2. Create a kernel boot disk and a ramdisk from images available on the Red
    Hat CD; see Section 3.5, *Making Boot and Ramdisk Floppies*.

    - 3. Use MILO to boot the appropriate Linux kernel; see Section 3.6.1, *Booting
    the Kernel Floppy*.

    - 4. Load and run the Red Hat Linux/Alpha installation program; see Section 3.6.2,
    *Starting the Install*.


    To perform these steps, you''ll need three (3) blank, formatted 3.5-inch floppies.


    ## 3.4 Installing MILO


    For most systems, the best method of booting Red Hat Linux/Alpha is using the
    MILO, the Linux/Alpha miniloader. You may either load MILO directly from your
    system''s firmware, or use the ARC console to load MILO as an alternate "operating
    system". Details on these procedures are in the MILO HOWTO, which is available
    as Appendix D.


    The full MILO tree is available on the Red Hat CD in the *milo/* directory. It
    contains the latest documentation and MILO images available when this CD was manufactured
    (later versions of MILO are regularly made available at *gatekeeper.dec.com*).
    The *milo/images/* directory also contains floppy disk images that can be used
    with the ARC console to boot directly into MILO. They contain MILO and *linload.ex*.


    ### 3.4.1 Making a MILO Floppy


    To make a MILO floppy, you''ll need to use either the `dd` command on a Linux
    (or Digital Unix) system, or the `rawrite.exe` program (on the Red Hat CD) on
    a Microsoft Windows NT or MS-DOS system. To use `dd`, first mount the CD (e.g.,
    under `/mnt/cdrom/`), choose the appropriate image for your system from `milo/images/`,
    and:


    ```

    cd /mnt/cdrom

    dd if=milo/images/your-image.img of=/dev/fd0

    ```


    To use `rawrite`, choose the appropriate image for your system, and (assuming
    your CD-ROM is drive `d:`):


    ```

    d:

    cd milo/images

    \\dosutils\rawrite.exe

    ```


    `rawrite` first asks you for the name of a diskette image; enter the name of the
    MILO image for your system (e.g., `noname-udb.img`). Then it asks for a diskette
    drive to write the image to; enter `a:`.


    Label the floppy "MILO floppy".


    ### 3.4.2 What if MILO doesn''t work?


    If MILO is not supported on your machine, you need to boot the floppy or the Red
    Hat CD directly from the SRM console. Information on doing this is available from
    the Red Hat Software web site at [http://www.redhat.com/linux-info/alpha/faq](http://www.redhat.com/linux-info/alpha/faq).


    **Please Note:** If you are having trouble with MILO, the first thing to try is
    a newer MILO.


