    ## E.2.6 How do I get new updates to Red Hat as they happen?


    Keep your eye on:


    `http://www.redhat.com/errata`


    for new information we''ve made available since the current CD was pressed. Also
    check the `contrib` directory on our FTP mirrors for packages that users have
    contributed. We also make periodic announcements to the `redhat-announce-list`
    with updates.


    ## E.2.7 What do I do if I have media (manual or CD) problems?


    If you are experiencing problems with the product you received (e.g., your manual
    is missing pages or your CD is scratched), please contact Red Hat Software at
    sales@redhat.com or by phone using the above contact information. The problem
    will be rectified promptly. Please do not report these problems on the redhat-list
    or to Red Hat Support, as they are likely isolated and your product will simply
    need to be replaced.


    (Note: This is not a common problem, but it does happen from time to time.)


    ## E.2.8 What’s the quickest and best way to get support for Red Hat?


    - The Red Hat Software WWW site (http://www.redhat.com)

    - The Red Hat Linux Users’ Mailing Lists; see http://www.redhat.com/mailing-lists/.


    ## E.2.9 How do I report a bug?


    Send email to bugs@redhat.com.


    ## E.2.10 What versions of Red Hat Linux are there?


    There have been several now. Here’s a rundown:


    - Preview (or Beta) - Summer 1994

    - Halloween - Fall 1994

    - Mother’s Day 1.0 - Summer 1995

    - Mother’s Day 1.1 - Late Summer 1995

    - Red Hat Linux 2.0beta - Late Late Summer 1995

    - Red Hat Linux 2.0 - Early Fall 1995

    - Red Hat Linux 2.1 - Late Fall 1995

    - Red Hat Linux/AXP 2.1-Beta - Late Fall 1995

    - Red Hat Linux/AXP 2.1 - January 1996

    - Red Hat Linux 3.0.3 (Picasso) - March 1996

    - Red Hat Linux Rembrandt (beta) - August 1996

    - Red Hat Linux (Intel/Alpha/SPARC) 4.0 - October 1996

    - Red Hat Linux (Intel/Alpha/SPARC) 4.1 - January 1997

    - Red Hat Linux (Intel/Alpha/SPARC) 4.2 - May 1997


    ## E.2.11 What hardware does Red Hat Linux support?


    For a current list of supported hardware, please see:

    http://www.redhat.com/hardware


    ## E.2.12 Why won''t my Adaptec (274x, 284x) work?


    The Adaptec 274x and 284x are supported but may need to be reconfigured to work
    properly. It has been reported that the wide negotiation on these cards is not
    quite working, so it should be disabled.


    ## E.2.13 What applications are there for Red Hat Linux?


    There are many applications for Linux available. Please see http://www.redhat.com/linux-info
    and go to the "Linux Applications and Utilities" section. This section is maintained
    by a private individual that is not related to Red Hat in any way. You will find
    information on nearly every product available for Linux on his pages.


    ## E.2.14 Does Red Hat Linux include source code?


    Yes. We include the exact source that was used to build the distribution. From
    release 2.0 on, Red Hat Linux is built with a packaging system called RPM that
    ONLY uses pristine source (the same as what you’d find at the author’s site) and
    possibly a patch by Red Hat. Complete information on RPM is available on http://www.redhat.com/.


    ## E.2.15 Does Red Hat Linux support UMSDOS installs?


    No. It is not a good performance idea.


    ## E.3 Installation Questions


    ### E.3.1 How do I get my IDE CD-ROM on my SB16 to work?


    The Creative Labs kit comes with the IDE Interface set to the third IDE port by
    default (IDE2, I think). This won’t work under Linux as it only recognizes two
    IDE ports. What you need to do is move a jumper on the card to configure it for
    IDE1 (the secondary IDE port). I’m not sure if you have to make changes under
    DOS for this configuration to work, but your manuals should help with this (it
    will still work, but you may have to edit a file or two).


    You may also have to specify command line parameters like:


    ```

    boot:  linux hdx=cdrrom

    ```


    If you have one IDE drive, X is most likely “b” in this case (ie “linux hdb=cdrrom”).
    If you have two, then it will be “c”.


    ### E.3.2 How do I run the install program again?


    Reboot your machine using the disk that you made for the installation. You will
    most likely need to completely reinstall your system.


    If you just want to reconfigure networking or install more packages, try using
    the control-panel tools.

