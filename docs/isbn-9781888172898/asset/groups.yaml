    \ 和 `doc/HOWTO/mini` 目录下的多个 HOWTO 和 Mini-HOWTO 中找到。\n\n## 需要多少个分区？\n\n如果你愿意，你可以将\
    \ Red Hat Linux 安装在一个大的单一分区中。但是，我们推荐以下设置（**请注意：** 如果你计划安装随 Red Hat Linux 提供的所有软件包，可能需要使用更大的分区）：\n\
    \n- 一个用于虚拟内存的**交换分区（swap partition）**。如果你的计算机内存为 16 MB 或更少，你必须创建一个*交换分区*；即使你有更多内存，也建议使用交换分区。交换分区的大小至少应为\
    \ 16 MB 或等于计算机内存容量，取两者中较大的值。\n\n- 一个**根分区（root partition）**，在你的 Red Hat Linux\
    \ 系统启动时挂载为 `/`（根目录）；它只需要包含启动系统所需的必要文件以及系统配置文件。对于大多数系统，50–80 MB 就足够了。\n\n- 一个**/usr\
    \ 分区**，Red Hat Linux 系统上的大量软件存放于此；根据你的计划安装的软件包数量，此分区应为 200–500 MB。\n\n- 一个**/home\
    \ 分区**，用户的*主目录（home directories）*存放于此；/home 的大小主要取决于你计划在 Red Hat Linux 系统上拥有多少用户，以及他们可能在主目录中存储什么内容。\n\
    \n此外，你可能希望创建以下任一分区：\n\n- 一个用于临时文件的**/tmp 分区**。这对于较大的多用户系统或网络服务器机器来说是个好主意。\n\n\
    - 如果你希望安装 Red Hat Linux 附带的大量源代码，可以创建一个**/usr/src 分区**。\n\n- 创建一个**/usr/local\
    \ 分区**，用于存放你希望与 Red Hat Linux 系统其余部分保持独立的内容，例如无法以 RPM 包形式获得的软件。\n\n### 2.3 安装准备\n\
    \n#### 2.3.1 创建启动盘和辅助软盘\n\n你的 Red Hat Linux/Intel CD 套装可能包含启动软盘和辅助软盘。如果有，你可以跳转到第\
    \ 2.3.2 节。如果没有，你必须创建它们。\n\n如果你通过 CD-ROM 或 NFS 安装 Red Hat Linux，只需要一个启动软盘。如果你从硬盘、通过\
    \ FTP 或从 PCMCIA 设备安装，还需要一个辅助软盘。\n\n要创建启动和辅助软盘，你需要两张空白、已格式化的高密度（1.44 MB）3.5 英寸软盘。磁盘映像位于\
    \ Red Hat Linux CD 或你获取 Red Hat Linux 的 FTP 站点上的 images 目录中。每个映像都是相应软盘的*快照*，你需要将其传输到实际的软盘上；你可以使用\
    \ MS-DOS 或 Linux 来完成此操作。\n\n##### 在 MS-DOS 下制作软盘\n\n要在 MS-DOS 下制作软盘，请使用 Red Hat\
    \ Linux CD 中 dosutils 目录包含的 rawrite 实用程序。首先，给一张已格式化的 3.5 英寸软盘贴上“Boot Diskette”（启动软盘）或类似标签，并将其插入软盘驱动器。然后，使用以下命令（假设你的\
    \ CD 是 d: 盘）：\n\n```\nd: \\\n    cd \\images \\\n    \\dosutils\\rawrite.exe\n\
    ```\n\nrawrite 首先会询问软盘映像的文件名；输入 boot.img。然后它询问要写入映像的软盘驱动器；输入 a:。如果你需要制作辅助软盘，给第二张软盘贴上标签，然后再次运行\
    \ rawrite，使用 supp.img。\n\n##### 在 Linux 下制作软盘\n\n要在 Linux 下制作软盘，你必须拥有写入 /dev/fd0（3.5\
    \ 英寸软盘驱动器）的权限。给一张空白、已格式化的软盘贴上“Boot Diskette”（启动软盘）或类似标签，并将其插入软盘驱动器（但不要挂载它）。在挂载\
    \ Red Hat Linux CD 后，切换到 images 目录并使用以下命令：\n\n```\ndd if=boot.img of=/dev/fd0\
    \ bs=1440k\n```\n\n如果你需要制作辅助软盘，给第二张软盘贴上标签，将其插入软盘驱动器，然后使用以下命令：\n\n```\ndd if=supp.img\
    \ of=/dev/fd0 bs=1440k\n```\n\n#### 不使用启动软盘安装\n\n或者，如果你的计算机上安装了 MS-DOS，你可以直接从\
    \ CD 启动安装系统而无需制作软盘。为此，使用以下命令（假设你的 CD 是 d: 盘）：\n\n```\nd:\n cd \\dosutils\n autoboot.bat\n\
    ```\n\n#### 2.3.2 关于虚拟控制台的说明\n\nRed Hat Linux 安装系统不仅仅是在引导你完成安装过程时呈现的对话框。实际上，安装系统在运行时会呈现几种不同类型的诊断信息，并提供了一种从\
    \ shell 提示符输入命令的方法。它在五个*虚拟控制台*上显示安装对话框、shell 提示符和信息，你可以使用单个按键在这些虚拟控制台之间切换。如果在安装\
    \ Red Hat Linux 时遇到问题，这些虚拟控制台可能非常有帮助；安装日志或系统日志中显示的信息有助于定位问题。请参阅图 2.1，其中列出了虚拟控制台、切换到它们的按键以及它们的内容。\n\
    \n| 控制台 | 按键 | 内容 |\n| :---- | :---- | :---- |\n| 1 | Alt-F1 | 安装对话框 |\n| 2 |\
    \ Alt-F2 | shell 提示符 |\n| 3 | Alt-F3 | 安装日志（来自安装程序的消息） |\n| 4 | Alt-F4 | 系统日志（来自内核等的消息）\
    \ |\n| 5 | Alt-F5 | 其他消息 |\n\n图 2.1：虚拟控制台信息\n\n#### 2.3.3 使用对话框\n\n你可以使用一组简单的按键在安装对话框之间导航。在大多数对话框中，有一个*光标或高亮*，你可以使用箭头键（[⬅][➡][⬆][⬇]，`Tab`）以及\
    \ `Alt`+`Tab` 来移动它。每个屏幕底部都提供了移动命令的摘要。\n\n要“按下”按钮（如 `OK`），`Tab` 到该按钮并按 `Space`。要从列表中选择一个项目，将高亮移动到你想要选择的项目并按\
    \ `Enter`。要从*检查清单*中选择任意数量的项目，将高亮移动到你想要选择的项目并按 `Space` 选择该项目。要取消选择项目，第二次按 `Space`。\n\
    \n按 `F12` 接受当前值并进入下一个对话框；这通常相当于按 `OK` 按钮。\n\n**请注意：** 在安装过程中不要按随机按键；这可能导致不可预测的行为。\n\
    \n## 2.4 分步安装\n\n### 2.4.1 启动安装系统\n\n#### 启动\n\n要开始安装 Red Hat Linux，将刚刚创建的启动软盘插入软盘驱动器并重新启动机器（如果你的机器上安装了\
    \ MS-DOS，你可以直接从 CD-ROM 开始安装；参见上文第 2.3.1 节）。*boot:* 提示符出现；按 `Enter` 启动。观察启动信息，查看\
    \ Linux 内核是否检测到你的硬件。如果未正确检测到你的硬件，你可能需要重新启动并在*boot:* 提示符下输入一些选项，例如：\n\n```\nboot:\
    \ linux hdc=cdrom\n```\n\n按 `Enter` 使用这些选项启动。如果需要指定一些启动选项，请记下它们；稍后将会需要用到。\n\n"
