    ### Choosing a Network Driver


    If you are installing via FTP or via an SMB volume, you must have a supported
    network card installed in your computer. The installation program prompts you
    to choose the driver that supports your network card and to specify any necessary
    options for the driver to locate and recognize the card. Most of the time, the
