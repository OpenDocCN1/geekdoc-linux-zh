    \ 映像，使用这样的参数运行 `/sbin/mkinitrd`：\n\n```\n/sbin/mkinitrd /boot/newinitrd-image\
    \ 2.0.12\n```\n\n其中 `/boot/newinitrd-image` 是用于你的新映像的文件，而 `2.0.12` 是内核版本，其模块（来自\
