    在 boot: 提示符处，按 Enter 键并观察您的 Red Hat Linux 系统启动。当它显示 login: 提示符时，输入 root；在 Password:
    提示符处，输入您在 2.4.18 节中为您的机器设置的 root 密码。


    # 第 3 章：安装 Red Hat Linux/Alpha


    ## 3.1 简介


    这是 Red Hat Linux/Alpha 4.2 版本针对数字设备公司（Digital Equipment Corporation）Alpha 系列处理器的简要安装说明。本章描述了安装
    Red Hat Linux/Alpha 与 Red Hat Linux/Intel 之间的区别。有关安装过程的更多详细信息，请参阅第 2 章，*安装 Red
    Hat Linux/Intel*。


    ## 3.2 支持的硬件


    Red Hat Linux/Alpha 支持基于 Alpha 处理器和 PCI 总线的多种硬件。已知支持此版本的平台包括：


    - 1. AlphaPC64 (Cabriolet, Aspen Telluride)

    - 2. AxpPCI33 (Noname)

    - 3. EB64+ (Aspen Alpine)

    - 4. EB66 (NekoTech Mach 1)

    - 5. EB66+

    - 6. Jensen (DEC PC 150, 2000 model 300, Cullean)

    - 7. Universal Desktop Box (UDB, 有时称为 Multia)。这只是一个 nomae 主板，并在本文档的其余部分按此处理。

    - 8. AlphaStation 200, 250, 255, 400 (Avanti 机器)

    - 9. EB164 (Aspen Avalanche, Timberline, Summit; Microway Screamer)

    - 10. Kinetics 的 Platform 2000 机器

    - 11. PC164 机器 (Durango)

    - 12. Alcor 类型机器 (AlphaStation 500, 600; Maverick, Brett)

    - 13. Alpha-XL

    - 14. Alpha-XLT (XL 300, XL 366)

    - 15. Mikasa 类型机器 (AlphaServer 1000)，不支持 1000A


    除了 Jensen 之外，上述所有平台都包含 NCR 810 SCSI 控制器，但 BusLogic PCI SCSI 控制器（FlashPoint 除外）、Adaptec
    AHA2940 SCSI 控制器和 Qlogic 1020 ISP 控制器也得到支持。Jensen 设计使用 AHA1740 SCSI 控制器并得到支持。


    支持 NE2000、DE422 和 DE4x5 (PCI) 以太网卡。这包括 UDB 的内部以太网硬件。内核中也包含令牌环支持。


    X Window 系统应该在任何使用基于 S3 显卡的机器上都能正常工作，Jensen 机器除外。针对 S3 显卡的 X 服务器可从 ftp://ftp.astrarnet.com
    的 /pub/linux/axp/jensen 目录获取。Orchid 和 Number 9 的大多数显卡都能工作。大多数 Diamond Stealth
    显卡也得到支持。Digital TGA 显卡（基于 DC21030 芯片）在 8 位模式下得到支持，并且还提供了针对 Mach64 显卡的 X 服务器。


    有关 Alpha 硬件的更多信息可以在附录 C 中找到。


    ## 3.3 安装概览


    在 Alpha 系统上安装 Red Hat Linux 比在 Red Hat Linux/Intel 上安装稍微复杂一些，主要是由于机器架构的差异。对于大多数系统，成功安装的主要步骤是：


    - 1. 将 MILO（Linux/Alpha mini 加载器）安装到您的机器上（或软盘上）；参见 3.4 节，*安装 MILO*。

    - 2. 使用 Red Hat CD 上提供的映像创建内核引导盘和 ramdisk；参见 3.5 节，*制作引导盘和 Ramdisk 软盘*。

    - 3. 使用 MILO 引导适当的 Linux 内核；参见 3.6.1 节，*引导内核软盘*。

    - 4. 加载并运行 Red Hat Linux/Alpha 安装程序；参见 3.6.2 节，*启动安装*。


    要执行这些步骤，您需要三（3）张空白的已格式化的 3.5 英寸软盘。


    ## 3.4 安装 MILO


    对于大多数系统，引导 Red Hat Linux/Alpha 的最佳方法是使用 MILO，即 Linux/Alpha mini 加载器。您可以直接从系统固件加载
    MILO，或者使用 ARC 控制台将 MILO 作为替代“操作系统”加载。这些过程的详细信息在 MILO HOWTO 中提供，该文档作为附录 D 提供。


    完整的 MILO 树在 Red Hat CD 的 *milo/* 目录中可用。它包含制作此 CD 时可用的最新文档和 MILO 映像（较新版本的 MILO
    定期在 *gatekeeper.dec.com* 提供）。*milo/images/* 目录还包含可与 ARC 控制台一起用于直接引导进入 MILO 的软盘映像。它们包含
    MILO 和 *linload.ex*。


    ### 3.4.1 制作 MILO 软盘


    要制作 MILO 软盘，您需要在 Linux（或 Digital Unix）系统上使用 `dd` 命令，或者在 Microsoft Windows NT 或
    MS-DOS 系统上使用 `rawrite.exe` 程序（位于 Red Hat CD 上）。使用 `dd` 时，首先挂载 CD（例如，在 `/mnt/cdrom/`
    下），从 `milo/images/` 中为系统选择适当的映像，然后：


    ```

    cd /mnt/cdrom

    dd if=milo/images/your-image.img of=/dev/fd0

    ```


    使用 `rawrite` 时，为系统选择适当的映像，并且（假设您的 CD-ROM 驱动器是 `d:`）：


    ```

    d:

    cd milo/images

    \\dosutils\rawrite.exe

    ```


    `rawrite` 首先询问软盘映像的名称；输入您的系统的 MILO 映像名称（例如，`noname-udb.img`）。然后询问要写入映像的软盘驱动器；输入
    `a:`。


    将软盘标记为“MILO 软盘”。


    ### 3.4.2 如果 MILO 无法工作怎么办？


    如果您的机器不支持 MILO，您需要直接从 SRM 控制台引导软盘或 Red Hat CD。有关如何执行此操作的信息可在 Red Hat 软件网站上获取，网址为
    [http://www.redhat.com/linux-info/alpha/faq](http://www.redhat.com/linux-info/alpha/faq)。


    **请注意：** 如果您在使用 MILO 时遇到麻烦，首先要尝试的是更新版本的 MILO。


