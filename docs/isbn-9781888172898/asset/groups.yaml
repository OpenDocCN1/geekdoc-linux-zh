  md: "\n- Noname (Section D.5.7)\n- AlphaPC64 (Section D.5.7)\n- EB164 (Section D.5.7)\n\
    - PC164 (Section D.5.7)\n\n## D.5.7 System Specific Information\n\n### AXP PC133\
    \ (Noname)\n\nThe Noname board can load MILO from the Windows NT ARC firmware\
    \ (Section D.5.1), from the SRM Console (Section D.5.6), and from a failsafe boot\
    \ block floppy (Section D.5.4). A flash management utility, runnable from MILO,\
    \ is available so that once MILO is running, it can be blown into flash (Section\
    \ D.7). However, be warned that once you have done this you will lose the previous\
    \ image held there as there is only room for one image.\n\nThe way that Noname\
    \ boots is controlled by a set of jumpers on the board, J29 and J28. These look\
    \ like:\n\n```text\n       4\nJ29    2 x x x 6\n       1 x x x 5\n\nJ28    2 x\
    \ x x 6\n       1 x x x 5\n       3\n```\n\nThe two options that we're interested\
    \ in are J28, pins 1-3 which boots the console/loader from flash and J29, pins\
    \ 1-3 which boots the console/loader from a boot block floppy. The second option\
    \ is the one that you need to first boot MILO on the Noname board.\n\nOnce you've\
    \ selected the boot from floppy option via the jumpers, put the SRM boot block\
    \ floppy containing MILO into the floppy and reboot. In a few seconds (after the\
    \ floppy light goes out) you should see the screen blank to white and MILO telling\
    \ you what's going on.\n\nIf you are really interested in technical stuff, the\
    \ Noname loads images off of the floppy into physical address 0x104000 and images\
    \ from flash into 0x100000. For this reason, MILO is built with its PALcode starting\
    \ at 0x200000. When it is first loaded, it moves itself to the correct location\
    \ (see relocate.S).\n\n### AlphaPC64 (CabrioleT)\n\nThe AlphaPC64 includes the\
    \ Windows NT ARC firmware (Section D.5.1), the SRM Console (Section D.5.6) and\
    \ the Evaluation Debug Monitor (Section D.5.3). These images are in flash and\
    \ there is room to add MILO so that you can boot MILO directly from flash. A flash\
    \ management utility, runnable from MILO is available so that once MILO is running,\
    \ it can be blown into flash (Section D.7). This system supports MILO environment\
    \ variables.\n\nYou select between the boot options (and MILO when it has been\
    \ put into flash) using a combination of jumpers and a boot option which is saved\
    \ in the NVRAM of the TOY clock.\n\nThe jumper is J2; SP bits 6 and 7 have the\
    \ following meanings:\n\n- SP bit 6 should always be out. If this jumper is set\
    \ then the SROM mini-debugger gets booted.\n- SP bit 7 in is boot image selected\
    \ by the boot option byte in the TOY clock.\n- SP bit 7 out is boot first image\
    \ in flash.\n\nSo, with bit 7 out, the Debug Monitor will be booted as it is always\
    \ the first image in flash. With bit 7 in, the image selected by the boot option\
    \ in the TOY clock will be selected. The Debug Monitor, the Windows NT ARC firmware\
    \ and MILO all support setting this boot option byte but you must be very careful\
    \ using it. In particular, you cannot set the boot option so that next time the\
    \ system boots MILO when you are running the Windows NT ARC firmware, it only\
    \ allows you to set Debug Monitor or Windows NT ARC as boot options.\n\nTo get\
    \ MILO into flash via the Evaluation Board Debug Monitor, you will need a flashable\
    \ image. The build procedures make MILO.rom, but you can also make a rom image\
    \ using the makerom tool in the Debug Monitor software that comes with the board:\n\
    \n`makerom -v -i7 -l200000 MILO -o mini.flash`\n\n(type `makerom` to find out\
    \ what the arguments mean, but 7 is a flash image id used by the srom and -l200000\
    \ gives the load address for the image as 0x200000).\n\nLoad that image into memory\
    \ (via the Debug Monitor commands `fload`, `netload`, and so on) at 0x200000 and\
    \ then blow the image into flash:\n\n`AlphaPC64> flash 200000 8`\n\n(200000 is\
    \ where the image to be blown is in memory and 8 is the segment number where you\
    \ put the image. There are 16 1024*64 byte segments in the flash and the Debug\
    \ Monitor is at seg 0 and the Windows NT ARC firmware is at seg 4).\n\nSet up\
    \ the image that the srom will boot by writing the number of the image into the\
    \ TOY clock.\n\n`AlphaPC64> bootopt 131`\n\n(131 means boot the 3rd image, 129\
    \ = 1st, 130 = 2nd and so on).\n\nPower off, put jumper 7 on and power on and\
    \ you should see the MILO burst into life. If you don’t then take jumper 7 back\
    \ off and reboot the Debug Monitor.\n\n### EB66+\n\nThe EB66+, like all of the\
    \ Alpha Evaluation Boards built by Digital, contains the Evaluation Board Debug\
    \ Monitor and so this is available to load MILO (Section D.5.3). Quite often (although\
    \ not always) boards whose design is derived from these include the Debug Monitor\
    \ also. Usually, these boards include the Windows NT ARC firmware (Section D.5.1).\
    \ A flash management utility, runnable from MILO is available so that once MILO\
    \ is running, it can be blown into flash (Section D.7). This system supports MILO\
    \ environment variables.\n\nThese systems have several boot images in flash controlled\
    \ by jumpers. The two jumper banks are J18 and J16 and are located at the bottom\
    \ of the board in the middle (if the Alpha chip is at the top). You select between\
    \ the boot options (and MILO when it has been put into flash) using a combination\
    \ of jumpers and a boot option which is saved in the NVRAM of the TOY clock.\n\
    \nJumper 7-8 of J18 in means boot the image described by the boot option. Jumper\
    \ 7-8 of J18 out means boot the Evaluation Board Debug Monitor.\n\nBlowing an\
    \ image into flash via the Evaluation Board Debug Monitor is exactly the same\
    \ procedure as for the AlphaPC64 (Section D.5.7).\n\n### EB64+/Aspen Alpine\n\n\
    This system is quite like the AlphaPC64 except that it does not contain flash\
    \ which MILO can be loaded from. The EB64+ has two ROMs, one of which contains\
    \ the Windows NT ARC firmware (Section D.5.1), and the other contains the Evaluation\
    \ Board Debug Monitor (Section D.5.3).\n\nThe Aspen Alpine is a little different\
    \ in that it only has one ROM; this contains the Windows NT ARC firmware.\n\n\
    ### Universal Desktop Box (Multia)\n\nThis is a very compact pre-packaged 21066\
    \ based system that includes a TGA (21030) graphics device. Although you can just\
    \ fit a half height PCI graphics card in the box you are better off waiting for\
    \ full TGA support in XFree86. It includes the Windows NT ARC firmware and so\
    \ booting from that is the preferred method (Section D.5.1).\n\n### EB164\n\n\
    The EB164, like all of the Alpha Evaluation Boards built by Digital, contains\
    \ the Evaluation Board Debug Monitor and so this is available to load MILO (Section\
    \ D.5.3). Quite often (although not always) boards whose design is derived from\
    \ these include the Debug Monitor also. Usually, these boards include the Windows\
    \ NT ARC firmware (Section D.5.1). The SRM console is also available (Section\
    \ D.5.6). A flash management utility, runnable from MILO is available so that\
    \ once MILO is running, it can be blown into flash (Section D.7). This system\
    \ supports MILO environment variables.\n\nThese systems have several boot images\
    \ in flash controlled by jumpers. The two jumper banks are J1 and J11 (Note: original\
    \ text says J11 later, likely J1 and J11 or similar, keeping original intent)\
    \ located at the bottom of the board on the left (if the Alpha chip is at the\
    \ top). You select between the boot options (and MILO when it has been put into\
    \ flash) using a combination of jumpers and a boot option which is saved in the\
    \ NVRAM of the TOY clock.\n\nJumper SP-11 of J11 in means boot the image described\
    \ by the boot option. Jumper SP-11 of J11 out means boot the Evaluation Board\
    \ Debug Monitor.\n\nBlowing an image into flash via the Evaluation Board Debug\
    \ Monitor is exactly the same procedure as for the AlphaPC64 (Section D.5.7).\n\
    \n### PC164\n\nThe PC164, like all of the Alpha Evaluation Boards built by Digital,\
    \ contains the Evaluation Board Debug Monitor and so this is available to load\
    \ MILO (Section D.5.3). Quite often (although not always) boards whose design\
    \ is derived from these include the Debug Monitor also. Usually, these boards\
    \ include the Windows NT ARC firmware (Section D.5.1). The SRM console is also\
    \ available (Section D.5.6). A flash management utility, runnable from MILO is\
    \ available so that once MILO is running, it can be blown into flash (Section\
    \ D.7). This system supports MILO environment variables.\n\nThese systems have\
    \ several boot images in flash controlled by jumpers. The main jumper block, J30,\
    \ contains the system configuration jumpers and jumper CF6 in means that the system\
    \ will boot the Debug Monitor, the default is out.\n\nBlowing an image into flash\
    \ via the Evaluation Board Debug Monitor is exactly the same procedure as for\
    \ the AlphaPC64 (Section D.5.7).\n\n### XL266\n\nThe XL266 is one of a family\
    \ of systems that are known as Avanti. It has a riser card containing the Alpha\
    \ chip and cache which plugs into the main board at right angles. This board can\
    \ replace the equivalent Pentium board.\n\nSome of these systems ship with the\
    \ SRM console but others, notably the XL266, ship with only the Windows NT ARC\
    \ firmware (Section D.5.1).\n"
  mdcn: "\n\n- Noname（第 D.5.7 节）\n- AlphaPC64（第 D.5.7 节）\n- EB164（第 D.5.7 节）\n- PC164（第\
    \ D.5.7 节）\n\n## D.5.7 系统特定信息\n\n### AXP PC133 (Noname)\n\nNoname 主板可以从 Windows\
    \ NT ARC 固件（第 D.5.1 节）、SRM 控制台（第 D.5.6 节）以及包含应急启动块的软盘（第 D.5.4 节）中加载 MILO。提供一个可从\
    \ MILO 运行的闪存管理实用程序，因此一旦 MILO 正在运行，就可以将其写入闪存（第 D.7 节）。然而，请注意，一旦执行此操作，您将丢失那里保留的旧镜像，因为只有一个镜像的空间。\n\
    \nNoname 的启动方式由主板上一组跳线 J29 和 J28 控制。它们看起来像这样：\n\n```text\n       4\nJ29    2 x\
    \ x x 6\n       1 x x x 5\n\nJ28    2 x x x 6\n       1 x x x 5\n       3\n```\n\
    \n我们感兴趣的两个选项是 J28 的引脚 1-3（从闪存启动控制台/加载程序）和 J29 的引脚 1-3（从启动块软盘启动控制台/加载程序）。第二个选项是您需要在\
    \ Noname 主板上首先启动 MILO 时必须设置的。\n\n一旦您通过跳线选择了从软盘启动的选项，请将包含 MILO 的 SRM 启动块软盘插入软驱并重新启动。几秒钟后（在软盘指示灯熄灭后），您应该看到屏幕变为空白变白，并且\
    \ MILO 会告诉您正在发生什么。\n\n如果您真的对技术细节感兴趣，Noname 将图像从软盘加载到物理地址 0x104000，将从闪存加载图像到 0x100000。因此，MILO\
    \ 被构建为其 PALcode 从 0x200000 开始。当它首次加载时，它会将自己移动到正确的位置（参见 relocate.S）。\n\n### AlphaPC64\
    \ (CabrioleT)\n\nAlphaPC64 包含 Windows NT ARC 固件（第 D.5.1 节）、SRM 控制台（第 D.5.6 节）和评估调试监视器（第\
    \ D.5.3 节）。这些镜像位于闪存中，并且有足够的空间添加 MILO，以便您可以直接从闪存启动 MILO。提供一个可从 MILO 运行的闪存管理实用程序，因此一旦\
    \ MILO 正在运行，就可以将其写入闪存（第 D.7 节）。此系统支持 MILO 环境变量。\n\n您使用跳线组合以及保存在 TOY 时钟 NVRAM 中的启动选项，在启动选项之间（以及当\
    \ MILO 已放入闪存时）进行选择。\n\n跳线是 J2；SP 位 6 和 7 具有以下含义：\n\n- SP 位 6 应始终断开。如果此跳线被设置，则\
    \ SROM 迷你调试器将被启动。\n- SP 位 7 连接时，启动由 TOY 时钟中的启动选项字节选择镜像。\n- SP 位 7 断开时，启动闪存中的第一个镜像。\n\
    \n因此，当位 7 断开时，调试监视器将被启动，因为它始终是闪存中的第一个镜像。当位 7 连接时，将选择由 TOY 时钟中启动选项指定的镜像。调试监视器、Windows\
    \ NT ARC 固件和 MILO 都支持设置此启动选项字节，但在使用时必须非常小心。特别是，当运行 Windows NT ARC 固件时，您不能将启动选项设置为下次系统启动\
    \ MILO，它只允许您将调试监视器或 Windows NT ARC 设置为启动选项。\n\n要通过评估板调试监视器将 MILO 写入闪存，您需要一个可闪写的镜像。构建过程生成\
    \ MILO.rom，但您也可以使用随主板提供的调试监视器软件中的 makerom 工具创建 rom 镜像：\n\n`makerom -v -i7 -l200000\
    \ MILO -o mini.flash`\n\n（输入 `makerom` 以了解参数含义，但 7 是 srom 使用的闪存镜像 ID，-l200000\
    \ 将镜像的加载地址指定为 0x200000）。\n\n将该镜像加载到内存中（通过调试监视器命令 `fload`、`netload` 等），在 0x200000\
    \ 处，然后将图像写入闪存：\n\n`AlphaPC64> flash 200000 8`\n\n（200000 是要写入的镜像在内存中的位置，8 是放置镜像的段号。闪存中有\
    \ 16 个 1024*64 字节的段，调试监视器位于 seg 0，Windows NT ARC 固件位于 seg 4）。\n\n通过将镜像编号写入 TOY\
    \ 时钟来设置 srom 将要启动的镜像。\n\n`AlphaPC64> bootopt 131`\n\n（131 意味着启动第 3 个镜像，129 = 第\
    \ 1 个，130 = 第 2 个，依此类推）。\n\n关机，打开跳线 7 并开机，您应该会看到 MILO 充满活力。如果没有，则取下跳线 7 并重新启动调试监视器。\n\
    \n### EB66+\n\nEB66+ 与所有由 Digital 制造的 Alpha 评估板一样，包含评估板调试监视器，因此可以使用它来加载 MILO（第\
    \ D.5.3 节）。通常情况下（尽管并非总是如此），由这些设计派生的板卡也包含调试监视器。通常，这些板卡包含 Windows NT ARC 固件（第 D.5.1\
    \ 节）。提供一个可从 MILO 运行的闪存管理实用程序，因此一旦 MILO 正在运行，就可以将其写入闪存（第 D.7 节）。此系统支持 MILO 环境变量。\n\
    \n这些系统有多个位于闪存中的启动镜像，由跳线控制。两个跳线组是 J18 和 J16，位于主板的底部中央（如果 Alpha 芯片在顶部）。您使用跳线组合以及保存在\
    \ TOY 时钟 NVRAM 中的启动选项，在启动选项之间（以及当 MILO 已放入闪存时）进行选择。\n\nJ18 的跳线 7-8 连接意味着启动由启动选项描述的镜像。J18\
    \ 的跳线 7-8 断开意味着启动评估板调试监视器。\n\n通过评估板调试监视器将图像写入闪存的过程与 AlphaPC64 完全相同（第 D.5.7 节）。\n\
    \n### EB64+/Aspen Alpine\n\n此系统与 AlphaPC64 非常相似，但它不包含 MILO 可以从中加载的闪存。EB64+ 有两个\
    \ ROM，其中一个包含 Windows NT ARC 固件（第 D.5.1 节），另一个包含评估板调试监视器（第 D.5.3 节）。\n\nAspen Alpine\
    \ 有点不同，它只有一个 ROM；其中包含 Windows NT ARC 固件。\n\n### Universal Desktop Box (Multia)\n\
    \n这是一个非常紧凑的预包装基于 21066 的系统，包括 TGA (21030) 图形设备。虽然您可以在机箱中安装半高 PCI 显卡，但最好等待 XFree86\
    \ 中对完整 TGA 的支持。它包含 Windows NT ARC 固件，因此从该固件启动是首选方法（第 D.5.1 节）。\n\n### EB164\n\n\
    EB164，与所有由 Digital 制造的 Alpha 评估板一样，包含评估板调试监视器，因此可以使用它来加载 MILO（第 D.5.3 节）。通常情况下（尽管并非总是如此），由这些设计派生的板卡也包含调试监视器。通常，这些板卡包含\
    \ Windows NT ARC 固件（第 D.5.1 节）。SRM 控制台也可用（第 D.5.6 节）。提供一个可从 MILO 运行的闪存管理实用程序，因此一旦\
    \ MILO 正在运行，就可以将其写入闪存（第 D.7 节）。此系统支持 MILO 环境变量。\n\n这些系统有多个位于闪存中的启动镜像，由跳线控制。两个跳线组是\
    \ J1 和 J11（注意：原文后文提到 J11，可能为 J1 和 J11 或类似，保留原意），位于主板底部左侧（如果 Alpha 芯片在顶部）。您使用跳线组合以及保存在\
    \ TOY 时钟 NVRAM 中的启动选项，在启动选项之间（以及当 MILO 已放入闪存时）进行选择。\n\nJ11 的跳线 SP-11 连接意味着启动由启动选项描述的镜像。J11\
    \ 的跳线 SP-11 断开意味着启动评估板调试监视器。\n\n通过评估板调试监视器将图像写入闪存的过程与 AlphaPC64 完全相同（第 D.5.7 节）。\n\
    \n### PC164\n\nPC164，与所有由 Digital 制造的 Alpha 评估板一样，包含评估板调试监视器，因此可以使用它来加载 MILO（第\
