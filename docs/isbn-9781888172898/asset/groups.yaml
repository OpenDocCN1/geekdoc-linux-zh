    # C.10 Porting


    The ability of any Alpha-based machine to run Linux is really only limited by
    your ability to get information on the gory details of its innards. Since there
    are Linux ports for the E66, EB64+ and EB164 boards, all systems based on the
    21066, 21064/APECS or 21164/ALCOR should run Linux with little or no modification.
