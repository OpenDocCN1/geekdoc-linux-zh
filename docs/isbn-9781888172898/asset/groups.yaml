    \ <http://www.xfree86.org> 获取关于 XFree86 的信息，查看 <http://www.metrolink.com> 获取关于\
    \ Metro-X 的信息。\n\n### 5.2.1 X 服务器\n\n假设你在安装时选择了正确的视频卡，你应该已经安装了正确的 X 服务器。之后运行 Xconfigurator\
    \ 或 xf86config 时，你需要确保选择相同的视频卡，否则自动探测将失败。\n\n如果你认为为你的视频卡安装了错误的 X 服务器，你将必须在配置之前安装正确的服务器。例如，如果\
    \ CD 挂载在 `/mnt/cdrom`，并且你需要安装 S3 服务器，输入以下命令：\n\n```\ncd /mnt/cdrom/RedHat/RPMS\n\
    rpm -ivh XFree86-S3-3.1.2-1.i386.rpm\nln -sf .../usr/X11R6/bin/XF86_S3 /etc/X11/X\n\
    ```\n\n这将安装 S3 服务器并创建正确的符号链接。\n\n### 5.2.2 Xconfigurator\n\n要配置 X Windows，你必须首先选择你的视频卡。向下滚动支持的卡列表，直到找到你机器中的卡。5.2.2\
    \ 节可能帮助你确定与你的硬件匹配的视频服务器。如果你的卡未列出，它可能不受 XFree86 支持。在这种情况下，你可以尝试列表上的最后一个卡条目（Unlisted\
    \ Card）或商业 X Windows 服务器，例如 Metro X。下一步是选择你的显示器。如果你的显示器未列出，你可以选择其中一个通用显示器条目或“Custom”并输入你自己的参数。自定义显示器配置仅建议那些对\
    \ CRT 显示内部工作原理有深入了解的人使用。普通用户最好使用列表中的通用选项之一。选择显示器后，你需要告诉 Xconfigurator 你有多少视频内存。将高亮移动至适当的列表条目，然后按\
    \ <Enter> 或 <F12> 继续。对于下一步，建议选择默认项（No Clockchip Setting），但经验丰富的用户可能希望选择特定的时钟芯片。\n\
    \n#### 选择你的服务器\n\n如果你不确定你拥有什么芯片组，了解它的最好方法通常是查看显卡。图 5.1 列出了哪些芯片组和板卡需要哪些服务器。选择最匹配你硬件的一项。\n\
    \n| 服务器 | 芯片组 |\n| :--- | :--- |\n| VGA16 | 所有具有 256K 内存的 VGA 板（仅限 16 色） |\n|\
    \ SVGA | Trident 8900 & 9400, Cirrus Logic, C & T, ET4000, 其他 |\n| Mach8 | 使用\
    \ Mach8 芯片组的 ATI 板 |\n| Mach32 | 使用 Mach32 芯片组的 ATI 板 |\n| Mach64 | 使用 Mach64\
    \ 芯片组的 ATI 板 |\n| 8514 | IBM 8514/A 板卡和真正的克隆 |\n| S3 | #9 板卡，大多数 Diamonds，一些 Orchids，其他\
    \ |\n| AGX | 所有 XGA 显卡 |\n| P9000 | Diamond Viper（但不是 9100）和其他 |\n\n*图 5.1：X 服务器*\n\
    \n#### 完成\n\n如果之后你想增加显示器的刷新率，你可以手动编辑配置文件，或者再次运行 `Xconfigurator` 并从我们的列表中选择一个更贴近你显示器规格的显示器。\n\
    \n最后的配置步骤包括选择你想包含在 `XF86config` 文件中的视频模式。使用箭头键在每种颜色深度（8、16 和 24 位）下的列表中上下移动光标。使用\
    \ `Spacebar` 选择单个分辨率，使用 `Tab` 键在颜色深度字段之间移动。当你选择好要使用的视频模式后，将光标移动到 “OK” 按钮并按 `Enter`，或使用\
    \ `F12` 快捷键。一个信息屏幕将提供关于选择视频模式、启动和停止 X 服务器的最新信息。\n\n## 5.3 使用 Metro-X 配置 X Window\n\
    \n通过特别安排，安装单个 Metro-X 增强型 X 服务器的许可证包含在官方 Red Hat Linux/Intel CD 中。请注意，与 XFree86\
    \ 服务器（也包含在内）不同，Metro-X 是商业许可软件。在安装之前，你应该审阅并接受其许可条款。Metro-X 支持许多 XFree86 不支持的显卡。配置实用程序可以以图形模式\
    \ (configX) 或文本模式 (configX.curses) 运行。\n\n### 5.3.1 系统需求\n\n最少 8 兆字节内存；建议 16 兆字节。基础服务器包需要\
    \ 12 兆字节磁盘空间。\n\n### 5.3.2 configX.curses\n\n**configX.curses** 是一个简单的图形配置工具，用于配置\
    \ Metro-X。**configX.curses** 实用程序不支持配置多屏幕或选择鼠标按钮数量。如果你需要这些功能，你必须使用 **configX**。要运行\
    \ **configX.curses**，输入命令：\n\n```\nconfigX.curses\n```\n\n起始屏幕包含关于 Metro Link,\
    \ Inc. 的信息以及配置 Metro-X 所需内容的简要说明。按 **Enter** 键开始配置。屏幕顶部将显示当前配置信息，底部显示配置菜单。使用箭头键上下移动菜单中的高亮项，并使用\
    \ **Enter** 键选择高亮项。\n\n#### 显卡\n\n当你从配置菜单中选择 **Graphics Card** 时，将显示支持的卡列表。如上所述选择你的视频卡。在\n\
    \n"
