  mdcn: "\n\n## 5.1 构建自定义内核\n\n现在你必须更新 `/etc/lilo.conf`。如果你构建了新的 initrd 映像，你必须告诉 LILO\
    \ 使用它。在这个 `/etc/lilo.conf` 的示例中，我们在文件底部添加了四行，以指示另一个用于启动的内核。我们将 `/boot/vmlinuz`\
    \ 重命名为 `/boot/vmlinuz.old`，并将其标签更改为“old”。我们还为新内核添加了一行 `initrd`：\n\n```\nboot=/dev/hda\n\
    map=/boot/map\ninstall=/boot/boot.b\nprompt\ntimeout=100\nimage=/boot/vmlinuz\n\
    \    label=linux\n    initrd=/boot/initrd\n    root=/dev/hda1\n    read-only\n\
