  - '[PAGE 176]


    # ## Appendix B


    # ## Metro X


    # ### B.1 Special Features


    # #### B.1.1 Hot-Key Exit


    Metro-X supports a hot-key exit. This is useful for terminating the X server if
    the last client in your .xinitrc or .xsession does not provide a way to exit the
    session. The exit key combination is Ctrl Alt Backspace .


    # #### B.1.2 Hot-Key Resolution Switching


    When configuring Metro-X you can select several screen resolutions. You can then
    change resolutions on the fly while running your X server by pressing the appropriate
    key combination. To switch to the next resolution, press Ctrl Alt + . To switch
    to the previous resolution, press Ctrl Alt . .


    # #### B.1.3 Hardware Panning


    Metro-X supports hardware panning. This lets you set the virtual resolution higher
    than the monitor’s physical resolution. Windows can then ex-'
  - '[PAGE 177]


    tend beyond the screen''s physical boundaries and can be viewed by scrolling into
    the extended area.


    # B.1.4 Multiple Screens


    Metro-X supports up to four screens which can all be controlled simultaneously
    with a single keyboard and mouse. This allows you to run many applications without
    overlapping windows, and is particularly useful for image-processing work.


    In a multiple screen configuration there is one *X process, one mouse, and one
    keyboard - but several screens. The mouse/cursor can be moved between the different
    screens. Clients connect to the different screens with the syntax -display :0.X
    where X is the screen number.


    # Supported Cards


    Use up to four of any one card from the following list:


    +   * One or more Matrox MGA Impression Plus

    +   * One or more Matrox MGA Ultima Plus

    +   * One or more Matrox MGA Millennium


    # B.1.5 International Keyboards


    Metro-X uses the *X Keyboard extension to support various keyboards. The keyboard
    description contains information about the physical layout of a keyboard, the
    key codes that come from the keyboard, and the symbol information needed to map
    the keycodes into keysyms.


    Metro-X provides many predefined configurations, sorted by language and country.
    These configurations are selected through *config.X* (section 5.3.3.'
  - '[PAGE 178]


    # B.2 Metro X Configuration File


    # B.2.1 Warning


    The primary configuration file for the X server is Xconfig. If inappropriate changes
    are made to this file, the proper functioning of Metro-X will be impaired! Do
    not edit the Xconfig file unless absolutely necessary.


    # B.2.2 Xconfig


    Metro-X looks for the Xconfig file in the following locations and in the following
    order:


    ```

    $HOME/Xconfig

    $HOME/.Xconfig

    /etc/X11/Xconfig (on Linux only)

    /usr/lib/X11/Metro/Xconfig

    ```


    Most options are set with the configuration utility (ConfigX, section 5.3.3).
    Additional options can be added using an editor, and ConfigX will preserve these.


    # B.2.3 Keywords


    Descriptions of the Xconfig keywords are listed below. They are alphabetized here
    for your convenience and any order dependencies are noted within the individual
    entries.


    # Options Set In Configuration Utility


    The following list of Xconfig keywords are options controlled via the Metro-X
    Configuration Utility. Any changes to these options should be made through the
    utility to avoid accidental damage to the function of Metro-X.


    BitsPerPixel <number> Some X drivers support packed 24 bits per pixel memory organization.
    This means that each pixel takes up three bytes of video memory. In this case,
    configX inserts the line: BitsPerPixel 24'
  - '[PAGE 179]


    **Buttons** <number> This specifies the number of buttons on the mouse. This entry
    must immediately follow the Mouse entry in the Xconfig file.


    **Card** <string> This designates the model of the graphics card in use. This
    is only used by configX.


    **Chipset** <string> This displays the chipset used by the server. Normally configX
    inserts the correct chipset into the Xconfig file.


    **Clocks** <number> <number>... This contains a list of numbers specifying the
    frequencies associated with the clock generator on the card. The numbers are specified
    in MHz.


    **Depth** <number> This references the color depth of the screen, which controls
    how many colors can be displayed. Different cards and drivers support different
    depth values: 4, 8, 16, 24, or 32. Depth 4 supports 16 colors and depth 32 supports
    16 million colors.


    **Dimensions** <width> <height> This keyword represents the dimensions of the
    screen in millimeters, which is passed to X clients upon request.


    **DPMSoffDelay** <number> This controls the number of seconds after the last user
    input before the screen enters DPMS off mode. Off mode provides maximum power
    reduction. To activate this mode, the X server disables both the horizontal and
    vertical sync signals to the monitor.


    **DPMSstandbyDelay** <number> This controls the number of seconds after the last
    user input before the screen enters DPMS standby mode. Standby mode provides minimal
    power reduction. To activate this mode, the X server disables the horizontal sync
    signal to the monitor.


    **DPMSsuspendDelay** <number> This controls the number of seconds after the last
    user input before the screen enters DPMS suspend mode. Suspend mode provides significant
    power reduction. To activate this mode, the X server disables the vertical sync
    signal to the monitor.


    **Driver** <string> This references the name of the driver, which usually corresponds
    to the name of the X server. For example:


    ```

    Driver 8514

    ```


    initiates the section for defining the 8514 driver.


    **Emulate3Buttons** This entry is used when a two-button mouse is emulating a
    three-button mouse. This entry must immediately follow the Mouse entry.'
  - '[PAGE 180]


    in the Xconfig file.


    **FontPath** *<string>* FontPath is followed by a comma-delimited string of font
    directories. A font directory is any directory which contains fonts and a fonts.dir
