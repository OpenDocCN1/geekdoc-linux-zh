    ## 3.5.1 Making a Kernel Floppy


    Using `dd` (under Linux or Unix):


    ```

    cd /mnt/cdrom

    dd if=images/your-image.img of=/dev/fd0

    ```


    Using *rawrite* (under Microsoft Windows NT or MS-DOS):


    ```

    d:

    cd images

    \dosutils\rawrite.exe

    ```


    *rawrite* first asks you for the name of a diskette image; enter the name of the
    kernel image for your system (e.g., noname.img). Then it asks for a diskette drive
    to write the image to; enter **a:**.


    Label the floppy “Kernel floppy”.


    ## 3.5.2 Making a Ramdisk Floppy


    The ramdisk image is located on the Red Hat CD as images/ramdisk.img.

    You can use *dd* or *rawrite* to write the image to a diskette, much as for

    the MILO floppy and the boot floppy. Using *dd* (under Linux or Unix):


    ```

    cd /mnt/cdrom

    dd if=images/ramdisk.img of=/dev/fd0

    ```


    Using *rawrite* (under Microsoft Windows NT or MS-DOS):


    ```

    d:

    cd images

    \dosutils\rawrite.exe

    ```


    *rawrite* first asks you for the name of a diskette image; enter ramdisk.img.

    Then it asks for a diskette drive to write the image to; enter **a:**.


    Label the floppy “Ramdisk floppy”.


    ## 3.6 Installing


    ### 3.6.1 Booting the Kernel Floppy


    To boot the Linux/Alpha kernel from the diskette you made above, use MILO. See
    Appendix D, *Alpha Miniloader Howto*, Section D.5 for detailed information about
    how to load MILO from your MILO floppy. Boot to the MILO> prompt, insert your
    kernel floppy in the first floppy drive, and give MILO the following command:


    ```

    boot fd0:vmlinuz.gz root=/dev/fd0 load_ramdisk=1 prompt_ramdisk=1

    ```


    MILO reads the Linux kernel from your boot disk and runs it.


    If you are using the SRM console to load the kernel instead of MILO, you need
    to give the following arguments to the kernel:


    ```

    load_ramdisk=1 prompt_ramdisk=1

    ```


    ### 3.6.2 Starting the Install


    After the kernel boots, it prompts for a ramdisk. Insert the ramdisk floppy into
    the floppy drive and press Enter.


    ### 3.6.3 Issues Specific to Linux/Alpha


    **Disk Partitioning**


    Red Hat Linux/Alpha supports two varieties of hard drive partitioning:


    -   **Standard fdisk-style partitioning:** this has the usual oddities (such as
    extended partitions) and is done in the same way as on Intel platforms (using
    Linux fdisk). This is the partitioning style you must use if you are using the
    ARC console.

    -   **BSD-style disk-labelling:** It is normal to make the first partition on
    a disk-labelled hard drive the swap partition. We don''t recommend using BSD disk-labelling
    unless it is absolutely necessary.


    **XFree86 and TGA**


    If you have an Alpha with a TGA card and you choose to install XFree86, the installation
    program prompts you to choose a video card. Choose Unlisted Server; the installation
    program displays a list of available servers. Choose the TGA server.


    ### 3.6.4 Finishing Up


    After the install is finished and your system is fully configured, you will be
    asked to reset your computer. This indicates that your system has been successfully
    installed.


    ## 3.7 Booting your Red Hat Linux/Alpha system


    To boot Red Hat Linux from MILO, you must use the boot command. The command differs
    slightly depending on where your root partition is. For example, if your root
    partition is the second partition on your first SCSI hard drive, you would boot
    as follows:


    ```

    boot sda2:vmlinux.gz root=/dev/sda2

    ```


    If instead your root partition is the third partition on your second IDE drive,
    you would use this command:


    ```

    boot hdb3:vmlinux.gz root=/dev/hdb3

    ```


    For information on these commands and on automating the boot process, please read
    the MILO HOWTO in Appendix D.


    # Chapter 4


    # Installing Red Hat Linux/SPARC


    These are brief installation instructions for the *Red Hat Linux/SPARC* 4.2 release
    for the SPARC family of processors. This chapter describes the differences between
    installing Red Hat *Linux/SPARC* and Red Hat *Linux/Intel*. For further details
    on the installation procedure, please see Chapter 2.


    ## 4.1 Hardware


    Red Hat *Linux/SPARC* is known to function on the following hardware:


    -   sun4c architecture machines (IPC, SS1, etc)

    -   sun4m architecture machines (Classic, SS5, SS10, etc)

    -   bwtwo, cg3, cg6, TCX framebuffers (24 bit on the TCX)

    -   cg14 framebuffer (in cg3 mode)

    -   SCSI and Ethernet on all of the above

    -   type 4 and type 5 keyboards and mice

    -   external SCSI drives

    -   CD-ROM drives (external and internal)

    -   SCSI/Ether SBUS expansion cards

    -   Any original equipment Sun monitor for the above framebuffer


    A partial list of *unsupported* hardware:


    -   VME based sun4m machines, such as the 4/690

    -   sun4d (SS1000, SS2000)

    -   sun4u (UltraSparc1, UltraSparc2, Enterprise UltraSparc servers)

    -   sun4 architecture

    -   Eurocard sundc machines, called the ''sun4e'' under Solaris2.4 and others,
    are not supported. These are VME-bus sun4c machines, to which the kernel has not
    been ported yet.


    ## 4.2 Booting from Floppy


    ### 4.2.1 Making a Boot Floppy


    If your SPARC system has a floppy drive, you can boot the Red Hat Linux installation
    program from a floppy diskette. The boot floppy image is located on the **images/**
    directory on your Red Hat CD.


    To create the boot floppy, you can use **rawrite.exe** under MS-DOS (located on
    your Red Hat Linux/SPARC CD in the **dosutils** directory), or you can use **dd**
    under Linux or Unix. Under MS-DOS, you would enter the following commands (assuming
    the CD-ROM is drive d:):


    ```

    d:

    cd \images

    \dosutils\rawrite.exe

    ```


    ### 4.2.2 Booting


    *rawrite* first asks you for the name of a diskette image; enter boot.img. Then
    it asks for a diskette drive to write the image to; enter **a:**.


    Under Linux or Unix, mount the CD, change to the directory it is mounted under,
    and use the following command:


    ```

    dd if=images/boot.img of=/dev/fd0

    ```


    > **Please Note:** Do not use /dev/rfd0 under Solaris; it will not work. Use /dev/fd0
    instead.


    Insert the boot diskette, and at the PROM prompt enter `boot floppy`. You will
    be presented with a SILO prompt. If you wish to do your install using a ramdisk
    (it will use about 2M of RAM and is recommended if you have 8M or more of RAM),
    you can simply press Enter at the SILO prompt. If you wish to do an NFS-rooted
    install, you will need to supply some parameters here. The formula is as follows:


    ```

    linux nfsroot=nfs.server.IP.address:/path/to/RH/image

    ```


    For this to work you will need a rarp entry or a bootp entry on your network that
    will give your SPARC its IP address. This is covered in Section 4.3 below.


    ## 4.3 Booting from a Network


    If you do not have floppy drive, and your PROM is less than version 2, you will
    need to do a network boot. This is fairly easy to do, but you will need a rarp
    entry on a server on your local network to tell the target SPARC what its IP address
    is. This can be done on a Linux system that has RARP built into the kernel (or
    inserted as a module), using a command of this form:


    ```

    rarp -s ip.address.of.sparc hw:address.of:sparc

    ```


    You also need an ARP entry in most cases; for example:


    ```

    arp -s ip.address.of.sparc hwaddress.of.sparc

    ```


    Now you need to setup a TFTP server on your local network to serve the kernel
    to the target SPARC. This should be the same machine that is doing the **rarp**
    above. Under Red Hat Linux, this can be done by editing /etc/inetd.conf. You need
    an entry that looks similar to:


    ```

    tftp dgram udp wait root /usr/sbin/tcpd in.tftpd /home/tftp

    ```


    You can now copy the *kernels/vmlinux* to */home/tftp* on your server and create
    a symbolic link so that the PROM can get the proper file. This symbolic link is
    conditional based on the IP address and architecture of the target SPARC. You
    need to make the link be the hex value of your IP address “.” dot the architecture.
    For example, to create a symbolic link for *flanders.redhat.com*, a sun4m machine
    with IP address 199.183.24.232, you would enter the command:


    ```

    cd /home/tftp

    ln -s vmlinux C7B718E8.SUN4M

    ```


    At this point you should be able to go to the PROM on your SPARC and type:


    ```

    boot net nfsroot=nfs.server.IP.address:/path/to/RH/image

    ```


    and it should get its rarp request from the TFTP server fulfilled and start loading
    the kernel via TFTP. The kernel should then boot and start the install.


    After booting the installation disk you will be greeted by a welcome screen with
    a single button; press `Enter` to begin the installation.


    Now, choose the medium you will be installing from; NFS, Hard Disk or FTP. Installing
    from hard disk will work if you have an existing partition with an EXT2 filesystem
    only; installation from UFS is not yet implemented.


