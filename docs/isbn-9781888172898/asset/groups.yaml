    \n```\n/var\n|- log\n|- catman\n|- lib\n|- local\n|- named\n|- nis\n|- preserve\n\
    |- run\n|- lock\n|- tmp\n+- spool\n    |- at\n    |- cron\n    |- lpd\n    |-\
    \ mail\n    |- mqueue\n    |- rwho\n    |- smail\n    |- uucp\n    +- news\n```\n\
    \nSystem log files such as wtmp and lastlog go in /var/log. The /var/lib directory\
    \ also contains the RPM system databases. Formatted man pages go in /var/catman,\
    \ and lock files go in /var/lock. The /var/spool directory has subdirectories\
    \ for various systems that need to store data files.\n\n# 10.1.2 /usr/local in\
    \ Red Hat Linux\n\nIn Red Hat Linux, the intended use for /usr/local is slightly\
    \ different from that specified by the FSSTND. The FSSTND says that /usr/local\
    \ should be where you store software that is to remain safe from system software\
    \ upgrades. Since system upgrades from Red Hat Software are done safely with the\
    \ RPM system and Glint, you don’t need to protect files by putting them in /usr/local.\
    \ Instead, we recommend you use /usr/local for software that is local to your\
    \ machine."
  - '[PAGE 157]


    For instance, let''s say you have mounted `/usr` via read-only NFS from *beavis*.
    If there is a package or program you would like to install, but you are not allowed
    to write to *beavis*, you should install it under `/usr/local`. Later perhaps,
    if you''ve managed to convince the system administrator of *beavis* to install
    the program on `/usr`, you can uninstall it from `/usr/local`.


    # 10.2 Special Red Hat File Locations


    In addition to the files pertaining to the RPM system that reside in `/var/lib/rpm`
    (see chapter 7), there are two other special locations that are reserved for Red
    Hat Linux configuration and operation.


    The control-panel and related tools put lots of stuff in `/usr/lib/rhs`. There
    is probably nothing here that you would want to edit. It is mostly small scripts,
    bitmaps and text files.


    The other location, `/etc/sysconfig`, stores configuration information. The major
    users of the files in this directory are the scripts that run at boot time. It
    is possible to edit these by hand, but it would be better to use the proper control-panel
    tool.


    # 10.3 Users, Groups and User-Private Groups


    Managing users and groups has traditionally been tedious. Red Hat Linux has a
    few tools and conventions that make user and groups easier to manage, and more
    useful.


    The easiest way to manage users and groups is through the Users and Groups module
    of the control-panel (see section 8 for details on the control-panel and section
    8.1 for details on the Users and Groups module).


    You can also use `adduser` to create a new user from the command line.


    # 10.3.1 Standard Users


    Table 10.3.1 lists the standard users set up by the installation process (this
    is essentially the `/etc/passwd` file). The group id (GID) in this table is the'
  - '[PAGE 158]


    *primary group* for the user. See section 10.3.3 for details on how groups are
    used.


    | User | UID | GID | Home Directory | Shell |

    | :--- | :--- | :--- | :--- | :--- |

    | root | 0 | 0 | /root | /bin/bash |

    | bin | 1 | 1 | /bin |

    | daemon | 2 | 2 | /sbin |

    | adm | 3 | 4 | /var/adm |

    | lp | 4 | 7 | /var/spool/lpd |

    | sync | 5 | 0 | /sbin | /bin/sync |

    | shutdown | 6 | 0 | /sbin | /sbin/shutdown |

    | halt | 7 | 0 | /sbin | /sbin/halt |

    | mail | 8 | 12 | /var/spool/mail |

    | news | 9 | 13 | /var/spool/news |

    | uucp | 10 | 14 | /var/spool/uucp |

    | operator | 11 | 0 | /root | /bin/bash |

    | games | 12 | 100 | /usr/local/games |

    | gopher | 13 | 30 | /usr/lib/gopher-data |

    | ftp | 14 | 50 | /usr/ths/ftp |

    | nobody | 99 | 99 | /root |


    ![](img/06353bca937b38b02602dcfb58824d72_158_0.png)


    # 10.3.2 Standard Groups


    Table 10.3.2 lists the standard groups as set up by the installation process (this
    is essentially the *etc/group* file).


    # 10.3.3 User Private Groups


    Red Hat Linux uses a user private group (UPG) scheme, which makes UNIX groups
    much easier to use. The UPG scheme does not add or change anything in the standard
    UNIX way of handling groups. It simply offers a new convention for handling groups.
    Whenever you create a new user, by default, he or she has a unique group. The
    scheme works as follows:


    **User Private Group** Each user has it''s own primary group, to which only it
    is a member.'
  - '[PAGE 159]


    | Group | GID | Members |

    | :--- | :--- | :--- |

    | root | 0 | root |

    | bin | 1 | root,bin,daemon |

    | daemon | 2 | root,bin,daemon |

    | sys | 3 | root,bin,adm |

    | adm | 4 | root,adm,daemon |

    | tty | 5 | |

    | disk | 6 | root |

    | lp | 7 | daemon,lp |

    | mem | 8 | |

    | kmem | 9 | |

    | wheel | 10 | root |

    | mail | 12 | mail |

    | news | 13 | news |

    | uucp | 14 | uucp |

    | man | 15 | |

    | games | 20 | |

    | gopher | 30 | |

    | dip | 40 | |

    | ftp | 50 | ftp |

    | nobody | 99 | |

    | users | 100 | |


    Figure 10.2: Standard Groups'
  - '[PAGE 160]


    **umask = 002** The traditional UNIX umask is 022, which prevents other users
    and *other members of a user’s primary group* from modifying a user’s files. Since
    every user has their own private group in the UPG scheme, this “group protection”
    is not needed. An umask of 002 will prevent users from modifying other users’
    private files. The umask is set in /etc/profile.


    **SGID bit on Directories** If you set the SGID bit on a directory (with *chmod
    g+s directory*), files created in that directory will have their group set to
    the directory’s group.


    Most computing sites like to create a group for each major project and assign
    people to the groups they need to be in. Managing files traditionally has been
    difficult, though, because when someone creates a file it is owned by the primary
    group he or she belongs to. When a single person works on multiple projects, it
    becomes hard to make the files owned by the group that is associated with that
    project. In the UPG scheme, groups are automatically assigned to files on a project-by-project
    basis, which makes managing group projects very simple.


    Let’s say you have a big project called *devel*, with many people editing the
    devel files in a *devel* directory. Make a group called *devel*, *chgrp* the *devel*
    directory to *devel*, and add the all the devel users to the *devel* group. Now,
    all the devel users will be able to edit the devel files and create new files
    in the *devel* directory, and these files will always retain their *devel* group.
    Thus, they will always be edit-able by other devel users.


    If you have multiple projects like *devel*, and users who are working on multiple
    projects, these users will never have to change their umask or group when they
    move from project to project. The SGID bit on each project’s main directory “selects”
    the proper group.


    Since each user’s HOME directory is owned by the user and their private group,
    it is safe to set the SGID bit on the HOME directory. However, by default, files
    are created with the primary group of the user, so the SGID bit would be redundant.


    # User Private Group Rationale


    Since the UPG scheme is new, many people have questions about it, and they wonder
    why it is necessary. The following is the rationale for the'
  - '[PAGE 161]


    scheme.


    +   You’d like to have a group of people work on a set of files in say, the /usr/lib/emacs/site-lisp
    directory. You trust a few people to mess around in there, but certainly not everyone.


    +   So you enter:


    ```

    chown -R root.emacs /usr/lib/emacs/site-lisp

    ```


    and you add the proper users to the group.


    +   To allow the users to actually create files in the directory you enter:


    ```

    chmod 775 /usr/lib/emacs/site-lisp

    ```


    +   But when a user creates a new file it is assigned the group of the users default
    group (usually users). To prevent this you enter


    ```

    chmod 2775 /usr/lib/emacs/site-lisp

    ```


    which causes everything in the directory to be created with the “emacs” group.


    +   But the new file needs to be mode 664 for another user in the emacs group
    to be able to edit it. To do this you make the default umask 002.


    +   Well, this all works fine, except that if your default group is “users”, every
    file you create in your home directory will be writable by everybody in “users”
    (usually everyone).


    +   To fix this, you make each user have a “private group” as their default group.


    At this point, by making the default umask 002 and giving everyone a private default
    group, you can easily set up groups that users can take advantage of without doing
    any magic. Just create the group, add the users, and do the above chown and chmod
    on the group’s directories.'
