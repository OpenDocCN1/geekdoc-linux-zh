- pgno: 267
  md: '# Red Hat Linux   Release 4.2


    Official* Red Hat 4.2 includes all the latest Linux tools and utilities including
    the improved networking and hardware support of the latest 2.0 kernel. This manual
    is the Official* Manual for the installation and management of your Red Hat Linux
    system. Whether you downloaded Red Hat off of a site on the Internet, or purchased
    Red Hat from Red Hat Software or as part of some other product or CD-Rom set,
    this manual will make your use of this advanced technology easier and more enjoyable.
    Red Hat’s biggest advantage is that so many of the packages and tools require
    little or no configuration... Red Hat is overall the most sophisticated and commercial
    release of Linux. Information Technology The POSIX based, advanced, easy-to-administer
    operating system allows your PC to function as a UNIX workstation effectively
    and reliably for advanced computing tasks. Perfect for applications ranging from
    setting up an internet web or FTP server, intranet applications, research work,
    software development, even advanced computer game playing.


    # EASY TO INSTALL AND MANAGE.


    With the RPM™ packaging system and the modular kernel, installation of an operating
    system has never been easier. Simply choose one or more configuration options
    and your installation can be used for the following:


    +   * C and C++ Development

    +   * Anonymous FTP/Gopher

    +   * NDIS

    +   * News Server

    +   * Network Management

    +   * Dellux Workstation

    +   * Game Machine

    +   * X Window System

    +   * Web Server

    +   * Print Server


    +   * NFS Server

    +   * Networked Workstation

    +   * DOS/Windows

    +   * Connectivity

    +   * Multimedia Machine

    +   * Tax Document Formatting

    +   * or use the manual configuration option to install and configure your Linux
    computer to your needs.


    A number of powerful, high-level graphical tools save advanced users hours of
    time and enable the novice system administrators to custom configure and tailor
    the system to their needs. The set of tools covers: configuration of TCP/IP, PPP,
    SLIP, file systems, users and groups, software packages, and more, and the RPM
    packaging system, a gateway Linux users, makes upgrading and maintaining your
    system painless and worry-free. Release 4.2 contains a unique combination of tools
    that automate most of the tasks that make a Linux system harder when installing,
    uninstalling, and upgrading software packages.


    # ADVANCED SYSTEM AND NETWORK SECURITY FEATURES.


    The flexibility of the RPM system is what has allowed Red Hat Linux to earn the
    reputation as one of the most secure operating systems available. Almost as soon
    as security problems are found on the Internet, Red Hat Software releases new
    or updated packages to cope with the new threat, saving you time and reducing
    the possibility of compromise. Release 4.2 of Red Hat Linux supports standard
    "UNIX" password authentication, as well as "Shadow" passwords for additional security.
    The Pluggable Authentication Module (PAM) system allows additional authentication
    methods to be written and dynamically added to the system to support your special
    security needs.


    # UPGRADE FROM PREVIOUS RELEASES.


    Because Red Hat Linux Release 4.2 is built with advanced RPM technology, your
    system will never become obsolete. As new releases become available you can upgrade
    any or all of your components to the newest versions using a simple upgrade program
    that does all the work for you. Users of Red Hat Linux releases 2.0 and higher
    can upgrade to 4.2 simply and easily.


    ![](img/06353bca937b38b02602dcfb58824d72_267_0.png)


    ![](img/06353bca937b38b02602dcfb58824d72_267_1.png)


    # REVOLUTIONARY SOFTWARE DEVELOPMENT LICENSE:


    Red Hat Linux Release 4.2 is a POSIX based operating system. It features not found
    on UNIX operating systems: over 10 times as much.


    Red Hat Linux comes with complete tools for the entire programming language all
    the compilers, libraries, utilities. Windows, Systems.


    The source of this amazing value is the OS Technology the cooperative license
    that allows users of the Red Hat Linux technologies. The under technologies are
    copywritten, which enables worldwide contributions to software development without
    the overhead of commercial control and restrictions.


    ![](img/06353bca937b38b02602dcfb58824d72_267_2.png)


