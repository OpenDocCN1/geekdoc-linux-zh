    timeout=100\nimage=/boot/vmlinuz\n    label=linux\n    initrd=/boot/initrd\n \
    \   root=/dev/hda1\n    read-only\nimage=/boot/vmlinuz.old\n    label=old\n  \
    \  root=/dev/hda1\n    read-only\n```\n\nNow when the system boots and you press\
    \ Tab at the LILO boot: prompt two choices will be shown;\n\n```\nLILO boot:\n\
    linux old\n```\n\nTo boot the new kernel (linux) simply press Enter, or wait for\
