- pgno: 60
  md: '# 3.5 Making Boot and Ramdisk Floppies


    # 3.5.1 Making a Boot Floppy


    After you''ve made a MILO floppy, you need to make a boot floppy containing the
    appropriate Linux/Alpha kernel for your machine. The kernel images are on the
    Red Hat CD in the `images/` directory; also there is a README file containing
    more information about the kernel images.


    Available boot images include:


    +   1. `cab.img` (AlphaPC64, Cabriolet)

    +   2. `noname.img` (AxpPCI33, Noname, Universal Desktop Box)

    +   3. `eb64p.img` (EB64+, Aspen Timberlines)

    +   4. `eb66.img` (EB66)

    +   5. `eb66p.img` (EB66+)

    +   6. `jensen.img` (Jensens)

    +   7. `avanti.img` (AlphaStation 200, 250, 400)

    +   8. `xl.img` (Alpha XL)

    +   9. `xtl.img` (Alpha XTL)

    +   10. `eb164.img` (EB164 based machines)

