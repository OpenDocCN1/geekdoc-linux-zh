- pgno: 91
  md: '# ## 5.5 Sendmail


    A default `sendmail.cf` file will be installed in `/etc`. The default configuration
    should work for most SMTP-only sites. It will not work for UUCP sites; you will
    need to generate a new `sendmail.cf` if you need to use UUCP mail transfers. To
    generate a new `sendmail.cf`, you will need to install `m4` and the sendmail source
    package. Read the README file in the sendmail sources for more details on creating
    `sendmail` configuration files. Also, O''Reilly & Associates publishes a good
    sendmail reference entitled *sendmail* by Bryan Costales.


    One common sendmail configuration is to have a single machine act as a mail gateway
    for all the machines on your network. For instance, at Red Hat Software we have
    a machine `mail.redhat.com` that does all our mail. On that machine we simply
    need to add the names of machines for which `mail.mail.redhat.com` will handle
    mail to `/etc/sendmail.cw`. Here is an example:


    ```

    ```

    # sendmail.cw - include all aliases for your machine here.

    torgo.redhat.com

    poodle.redhat.com

    devel.redhat.com

    ```

    ```


    Then on the other machines, torgo, poodle, and devel, we need to edit `/etc/sendmail.cf`
    to “masquerade” as `mail.redhat.com` when sending mail, and to forward any local
    mail processing to `redhat.com`. Find the DH and DM lines in `/etc/sendmail.cf`
    and edit them thusly:


    ```

    ```

    # who I send unqualified names to (null means deliver locally)

    DRmail.redhat.com


    # who gets all local email traffic

    DHmail.redhat.com


    # who I masquerade as (null for no masquerading)

    DMredhat.com

    ```

    ```


    With this type of configuration, all mail sent will appear as if it were sent
    from `redhat.com`, and any mail sent to `torgo.redhat.com` or the other hosts
    will be delivered to `mail.redhat.com`.'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Please be aware that if you configure your system to masquerade as another
    any email sent from your system to your system will be sent to the machine you
    are masquerading as. For example, in the above illustration, log files that are
    periodically sent to root@poodle. redhat. com by the cron daemon would be sent
    to root@mail. redhat. com


    # 5.6 Controlling Access to Services


    As a security measure, most network services are managed by a protective program
    called a TCP wrapper. The protected services are those listed in /etc/inetd. conf
    that specify /usr/sbin/tcpd. tcpd can allow or deny access to a service based
    on the origin of the request, and the configuration in /etc/hosts. allow and /etc/hosts.
    deny. By default Red Hat Linux allows all service requests. To disable or limit
    services you can edit /etc/hosts. allow. Here is an example /etc/hosts. allow
    file:


    ```

    ALL: redhat. com . redhat. com

    in. talkd: ALL

    in. ntalkd: ALL

    in. fingerd: ALL

    in. ftpd: ALL

    ```


    This configuration allows all connections from redhat. com and *. redhat. com
    machines. It also allows talk, finger, and ftp requests from all machines.


    tcpd allows much more sophisticated access control, using a combination of /etc/hosts.
    allow and /etc/hosts. deny. Read the tcpd(8) and hosts_access(5) man pages for
    complete details.


    # 5.7 Anonymous FTP


    Setting up anonymous FTP is simple. All you need to do is install the anon-ftp
    rpm package (which you may have already done at install time). Once it is installed,
    anonymous FTP will be up and running.


    There are a few files you might wish to edit to configure your FTP server.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '`/etc/ftpass` This file defines most of the access control for your ftp server.
    Some of the things that you can do are: set up logical “groups” to control access
    from different sites, limit the number of simultaneous FTP connections, configure
    transfer logging, and much more. Read the ftpaccess man page for complete details.


    `/etc/ftphosts` The ftphosts file is used to allow or deny access to certain accounts
    from various hosts. Read the ftphosts man page for details.


    `/etc/ftpusers` This file lists all the users that are **not** allowed to ftp
    into your machine. For example, `root` is listed in `/etc/ftpusers` by default.
    That means that you can **not** ftp to your machine and log in as `root`. This
    is a good security measure, but some administrators prefer to remove `root` from
    this file.


    # 5.8 World Wide Web Server


    If you installed the Apache web server (from the `apache` package), then your
    Web service is already up and running! Just point Red Baron (or any other web
    browser) at `http://localhost`.


    The default page shown is `/home/httpd/html/index.html`. You can edit this file
    (or completely replace it) to your liking. All the CGI programs, icons, and html
    pages are stored in `/home/httpd`, but this can be changed in the apache configuration
    files, all of which are stored in `/etc/htpd/conf`. Logs of all htpd activity
    are kept in `/var/log/htpd`. Setting up your web site is as easy as adding your
    own HTML pages and links to the `/home/htpd/html/` directory. For more information
    on customizing your web server we recommend a reference such as **HTML: The Definitive
    Guide** by Chuck Musciano & Bill Kennedy, published by O’Reilly & Associates.


    # 5.9 NFS Configuration


    NFS stands for Network File System, and is a way to share files between machines
    as if they were on your local hard drive. Linux can be both an NFS server and
    an NFS client, which means that it can “export” filesystems to other systems,
    and “mount” filesystems exported from other machines.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# ## 5.9.1 Mounting NFS Filesystems


    Use the mount command to mount a NFS filesystem from another machine:


    ```

    mount porky:/mnt/export /mnt/local

    ```


    In this command, porky is the hostname of the NFS files e rver, /mnt/export is
    the filesystem that porky is exporting, and /mnt/local is a directory on my local
    machine where I want to mount the filesystem. After the mount command runs (and
