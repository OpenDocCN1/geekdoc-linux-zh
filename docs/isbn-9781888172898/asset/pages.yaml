    You may also select, unselect, or verify a package while querying it by using
    the buttons provided. Click on the Close button when you are finished looking
    at the packages.


    # ### 9.4.2 Verifying Packages


    Verifying a package checks all of the files in the package to insure they match
    the ones present on your system. The checksum, file size, permissions, and owner
    attributes are all checked against the database. This check can be'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# 134 CHAPTER 9. GLINT


    used when you suspect that one of programs files has become corrupted due to the
    installation of new programs.


    Choosing the packages to verify is the same as choosing the packages to query.
    Select the packages and use the **Verify** button or choose the **Verify** entry
    from a context sensitive menu. A window opens like the one in figure 9.7.


    ![](img/06353bca937b38b02602dcfb58824d72_147_0.png)


    ![](img/06353bca937b38b02602dcfb58824d72_147_1.png)


    The three columns in this window describe the package with a problem in it, the
