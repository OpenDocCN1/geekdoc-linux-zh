    # 8.4.3  Adding a Networking Interface


    If you have added a networking interface to your machine since installing Red
    Hat Linux, or you didn’t configure your ethernet card at install time, you can
    configure it with a few clicks of a mouse.


    **Please Note:** You may need to configure **kernel**d to load a driver for the
