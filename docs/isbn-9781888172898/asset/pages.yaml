- pgno: 75
  md: "```\ninstall=/boot/boot.b\nprompt\ntimeout=100\nimage=/boot/vmlinuz\n    label=linux\n\
    \    root=/dev/hda1\n    read-only\n```\n\nNow you must update /etc/lilo.conf.\
    \ If you built a new initrd image you must tell LILO to use it. In this example\
