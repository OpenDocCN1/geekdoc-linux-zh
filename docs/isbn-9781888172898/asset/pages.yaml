- pgno: 218
  md: "Here is my list of compatible systems:\n\n+   - AlphaStation 400 (Avanti),\n\
    +   - AlphaStation 250,\n+   - AlphaStation 200 (Mustang),\n+   - XL. There are\
    \ two flavours, XL266 and XL233 with the only difference being in processor speed\
