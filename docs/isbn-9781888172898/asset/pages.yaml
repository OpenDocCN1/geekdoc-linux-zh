    \ to select it.\n+   \t4. Press `Tab` to move to the corresponding field to set\
    \ the screen refresh rate (Hz) for that resolution, then use `←` or `→` to select\
    \ a value from the frequency options available. The default setting is the highest\
    \ frequency your monitor supports, and is usually the appropriate choice.\n+ \
    \  \t5. Repeat this procedure for each physical resolution you want to set.\n\n\
    # Multiple-Screen Configuration\n\nMetro-X supports up to four screens which can\
    \ all be controlled simultaneously with a single keyboard and mouse. This allows\
    \ you to run many applications without overlapping windows, and is particularly\
    \ useful for image-processing work. For each screen used, a separate configuration\
    \ must be created for that screen’s monitor and graphics card. See section B.1.4\
    \ for graphics card requirements."
