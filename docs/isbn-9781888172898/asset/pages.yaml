- pgno: 88
  md: '# Adding a Screen


    Metro-X defaults to a single-screen setup. The first screen configured is labeled
    *Screen 0*. When you add a second screen, all of its configuration default settings
    will duplicate the current settings of Screen 0. So if your hardware is the same
    on all screens, you can save time by configuring Screen 0 before adding the other
    screens. Similarly, as more screens are added, the settings of whichever one is
    currently active when you add another screen will determine the default settings
    of the new screen.


    +   1. Press `Alt-S` to display the *Screen* pull-down menu.

    +   2. Type *A* for *Add*.

    +   3. The *Monitor* and *Graphics Card* icons for Screen 0 become outlines, and
    two full-color icons appear for Screen 1.

    +   4. Refer to the procedures described earlier in this chapter if any changes
    need to be made to the new screen''s configuration.

    +   5. Use the `Page Down` and `Page Up` keys to move to the configuration pages
    of each screen.


    # Deleting a Screen


    When a screen is deleted, all screens with higher screen numbers immediately drop
    down one slot. For instance, if you currently have screens 0, 1, and 2 configured
    and you delete screen 1. That screen and all of its configuration information
    disappears. Screen 2 then becomes screen 1, but retains its own configuration.
    You are left with screens 0 and 1.


    +   1. Use the `Page Down` or `Page Up` key to activate the set of icons for the
    screen you want to delete.

    +   2. Press `Alt-S` to display the *Screen* pull-down menu.

    +   3. Type *D* for *Delete*.

    +   4. One set of *Monitor* and *Graphics Card* icons disappears. Higher-numbered
    screens (if any) immediately fill the gap of the deleted screen.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Screen Layout


    The Screen Layout window lets you specify how the multiple screens are arranged
    in your workspace so mouse movement from screen to screen will be appropriate.


    +   1.  Press **Alt-S** to display the *Screen* pull-down menu.

    +   2.  Type **L** for *Layout*.

    +   3.  The *Screen Layout* window appears.

    +   4.  Press **←** and **→** to view the various layout combinations for your
    number of screens.

    +   5.  When the layout you want is displayed, press **Enter** to select it.


    # Font Path


    If needed, you can edit your font path from within the Metro-X Configuration Utility.
    This will be necessary if you are using a font server instead of or in addition
    to your existing fonts.


    +   1.  Press **Alt-C** to display the *Configuration* pull-down menu, then press
    **Enter**.

    +   2.  The *Font Path* window appears.

    +   3.  Edit the file as necessary for your system.  Metro-X looks for fonts in
    the order in which the directories are listed in this file. If you are using a
    font server, enter this as the first line:

    +       ```

    +       tcp/<fontserver machine>:7000

    +       ```

    +       If your port number is not the default 7000, change it to the appropriate
    port number for your system.

    +   4.  Press **Tab** to move to and amongst the bottom buttons, then press **Enter**
    to select one. If the information is correct, select the *Ok* button. If you want
    to disregard the changes you''ve made, select the *Cancel* button. If you''ve
    edited your font path and want to go back to the original settings, select the
    *Load Defaults* button.'
  merge: -1
