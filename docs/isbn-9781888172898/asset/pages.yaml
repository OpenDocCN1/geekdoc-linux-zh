- pgno: 160
  md: '**umask = 002** The traditional UNIX umask is 022, which prevents other users
    and *other members of a user’s primary group* from modifying a user’s files. Since
    every user has their own private group in the UPG scheme, this “group protection”
    is not needed. An umask of 002 will prevent users from modifying other users’
    private files. The umask is set in /etc/profile.


    **SGID bit on Directories** If you set the SGID bit on a directory (with *chmod
    g+s directory*), files created in that directory will have their group set to
    the directory’s group.


    Most computing sites like to create a group for each major project and assign
    people to the groups they need to be in. Managing files traditionally has been
    difficult, though, because when someone creates a file it is owned by the primary
    group he or she belongs to. When a single person works on multiple projects, it
    becomes hard to make the files owned by the group that is associated with that
    project. In the UPG scheme, groups are automatically assigned to files on a project-by-project
    basis, which makes managing group projects very simple.


    Let’s say you have a big project called *devel*, with many people editing the
    devel files in a *devel* directory. Make a group called *devel*, *chgrp* the *devel*
    directory to *devel*, and add the all the devel users to the *devel* group. Now,
    all the devel users will be able to edit the devel files and create new files
    in the *devel* directory, and these files will always retain their *devel* group.
    Thus, they will always be edit-able by other devel users.


    If you have multiple projects like *devel*, and users who are working on multiple
    projects, these users will never have to change their umask or group when they
    move from project to project. The SGID bit on each project’s main directory “selects”
    the proper group.


    Since each user’s HOME directory is owned by the user and their private group,
    it is safe to set the SGID bit on the HOME directory. However, by default, files
    are created with the primary group of the user, so the SGID bit would be redundant.


    # User Private Group Rationale


    Since the UPG scheme is new, many people have questions about it, and they wonder
    why it is necessary. The following is the rationale for the'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'scheme.


    +   You’d like to have a group of people work on a set of files in say, the /usr/lib/emacs/site-lisp
    directory. You trust a few people to mess around in there, but certainly not everyone.


    +   So you enter:


    ```

    chown -R root.emacs /usr/lib/emacs/site-lisp

    ```


    and you add the proper users to the group.


    +   To allow the users to actually create files in the directory you enter:


    ```

    chmod 775 /usr/lib/emacs/site-lisp

    ```


    +   But when a user creates a new file it is assigned the group of the users default
    group (usually users). To prevent this you enter


    ```

    chmod 2775 /usr/lib/emacs/site-lisp

    ```


    which causes everything in the directory to be created with the “emacs” group.


    +   But the new file needs to be mode 664 for another user in the emacs group
    to be able to edit it. To do this you make the default umask 002.


    +   Well, this all works fine, except that if your default group is “users”, every
    file you create in your home directory will be writable by everybody in “users”
    (usually everyone).


    +   To fix this, you make each user have a “private group” as their default group.


    At this point, by making the default umask 002 and giving everyone a private default
    group, you can easily set up groups that users can take advantage of without doing
    any magic. Just create the group, add the users, and do the above chown and chmod
    on the group’s directories.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# ### 10.4 User Authentication with PAM


    Programs which give users access to privileges of any sort need to be able to
    authenticate the users. When you log into a system, you provide your name and
    password, and the login process uses those to authenticate the login—to verify
    that you are who you say you are. Other forms of authentication than passwords
    are possible, and it is possible for the passwords to be stored in different ways.


    PAM, which stands for “Pluggable Authentication Modules”, is a way of allowing
    the system administrator to set authentication policy without having to recompile
    programs which do authentication. With PAM, you control how the modules are plugged
    into the programs by editing a configuration file.


    Most Red Hat Linux users will never need to touch this configuration file. When
    you use RPM to install programs that need to do authentication, they automatically
    make the changes that are needed to do normal password authentication. However,
    you may want to customize your configuration, in which case you need to understand
    the configuration file.


    # #### 10.4.1 Modules


    There are four types of modules defined by the PAM standard. auth modules provide
    the actual authentication, perhaps asking for and checking a password, and set
    “credentials” such as group membership or kerberos “tickets”. account modules
    check to make sure that the authentication is allowed (the account has not expired,
    the user is allowed to log in at this time of day, etc.). password modules are
    used to set passwords. session modules are used once a user has been authenticated
    to make it possible for them to use their account, perhaps mounting the user’s
    home directory or making their mailbox available.


    These modules may be *stacked*, so that multiple modules are used. For instance,
    login normally makes use of at least two authentication methods: if “rhopts” authentication
    succeeds, it is sufficient to allow the connection; if it fails, then standard
    password authentication is done.


    New modules can be added at any time, and PAM-aware applications can then be made
    to use them. For instance, if you have a one-time-password'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'calculator system, and you can write a module to support it (documentation
    on writing modules is included with the system). PAM-aware programs can use the
    new module and work with the new one-time-password calculators without being recompiled
    or otherwise modified in any way.


    # ### 10.4.2 Services


    Each program which uses PAM defines its own “service” name. The login program
    defines the service type `login`, ftpd defines the service type `ftp`, etc. In
    general, the service type is the name of the program used to **provide** the service,
    not (if there is a difference) the program used to **access** the service.


    # ### 10.4.3 The Configuration Files


    The directory `/etc/pam.d` is used to configure all PAM applications. (This used
    to be `/etc/pam.conf` in earlier PAM versions; while the pam.conf file is still
    read if no /etc/pam.d/ entry is found, its use is deprecated.) Each application
    (really, each **service**) has its own file. A file looks like this:


    ```

    #%PAM-1.0


    auth required /lib/security/pam_securtty.so

    auth required /lib/security/pam_pwd.b.so shadow nullok

    auth required /lib/security/pam_nologin.so

    account required /lib/security/pam_pwd.b.so

    password required /lib/security/pam_cracklib.so

    password required /lib/security/pam_pwb.b.so shadow nullok use_authok

    session required /lib/security/pam_pwd.b.so

    ```


    The first line is a comment. Any line that starts with a `#` character is a comment.
    The next three lines stack up three modules to use for login authorization. The
    first line makes sure that if the user is trying to log in as root, the tty on
    which they are logging in is listed in the `/etc/securtty` file *if* that file
    exists. The second line causes the user to be asked for a password and the password
    checked. The third line checks to see if the file `/etc/nologin` exists, and if
    it does, displays the contents of the file, and if the user is not root, does
    not let him or her log in.'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'Note that all three modules are checked, even if the first module fails. This
    is a security decision—it is designed to not let the user know why their au-\n--\n--\n--\n--


    The fifth line causes any necessary accounting to be done. For example, if shadow
    passwords have been enabled, the pam_pwd.so module will check to see if the account
    has expired, or if the user has not changed his or her password and the grace
    period for changing the password has expired.


    The sixth line specifies that if the login program changes the user''s pass-\nword,
    it should use the pam_pwd.so module to do so. (It will do so only if an auth module
    has determined that the password needs to be changed—for example, if a shadow
    password has expired.)


    The final line specifies that the pam_pwd.so module should be used to manage the
    session. Currently, that module doesn''t do anything; it could be replaced (or
    supplemented by stacking) by any necessary module.


    Note that the order of the lines within each file matters. While it doesn''t really
    matter much in which order required modules are called, there are other control
    flags available. While optional is rarely used, and never used by default on a
    Red Hat Linux system, sufficient and requisite cause order to become important.


    Let''s look at the auth configuration for rlogin:


    ```

    auth    required    /lib/security/pam_security.so

    auth    sufficient  /lib/security/pam_rhosts_auth.so

    auth    required    /lib/security/pam_pwd.so shadow nullok

    auth    required    /lib/security/pam_nologin.so

    ```


    That looks almost like the login entry, but there''s an extra line specifying
    an extra module, and the modules are specified in a different order.


    First, pam_security.so keeps root logins from happening on insecure ter-\nminals.
    This effectively disallows all root login attempts. If you wish to allow them
    (in which case we recommend that you either not be internet-\nconnected or be
    behind a good firewall), you can simply remove that line.


    Second, pam_nologin.so checks /etc/nologin, as specified above.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'Third, if `pam_rhosts_auth.so` authenticates the user, PAM immediately returns
    success to `rlogin` without any password checking being done. If `pam_rhosts_auth.so`
    fails to authenticate the user, that failed authentication is ignored.


    Finally (if `pam_rhosts_auth.so` has failed to authenticate the user), the `pam_pwdb.so`
    module performs normal password authentication.


    Note that if you do not want to prompt for a password if the `secretty` check
    fails, you can change the `pam_security.so` module from `required` to `requisite`


    # ### 10.4.4 Shadow Passwords


    The default `pam_pwdb.so` module can support shadow passwords. In order to convert
    your system to shadow passwords, use these commands:


    ```

    ```

    cd /etc

    pwconv5

    chmod 600 passwd- shadow-

    ```

    ```


    The `pam_pwdb.so` module will automatically detect that you are using shadow passwords
    and make all necessary adjustments.


    # ### 10.4.5 More Information


    This is just an introduction to PAM. More information is included with the system
    in `/usr/doc/pam*`, including a *System Administrators'' Guide*, a *Module Writers''
    Manual*, an *Application Developers'' Manual*, and the PAM standard, DCE-RFC §6.0.
    In addition, documentation is available from the Red Hat web site, at `http://www.redhat.com/linux-info/pam/`.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# 10.5 The Boot Process, Init, and Shutdown


    # 10.5.1 System V Init


    This section is a brief description of the internals of the boot process. It basically
    covers in detail how the machine boots using SysV Init and the differences between
    the original init used in older Linux releases.


    Init is the program that gets run by the kernel at boot time. It is in charge
    of starting all the normal processes that need to run at boot time. These include
    the gettys that allow you to log in, NFS daemons, FTP daemons, and anything else
    you want to run when your machine boots.


    SysV Init is fast becoming the standard in the Linux world to control the startup
    of software at boot time. This is because it is easier to use and more powerful
    and flexible than the traditional BSD init.


    SysV init also differs from BSD init in that the config files are in a subdirectory
    of /etc instead of residing directly in /etc. This directory is called **rc.d**.
    In there you will find **rc.sysinit** and the following directories:


    +   * init.d

    +   * rc0.d

    +   * rc1.d

    +   * rc2.d

    +   * rc3.d

    +   * rc4.d

    +   * rc5.d

    +   * rc6.d


    **init.d** contains a bunch of scripts. Basically, you need one script for each
    service you may need to start at boot time or when entering another runlevel.
    Services include things like networking, nfs, sendmail, httpd, etc. Services do
    not include things like setserial that must only be run once and then exited.
    Things like that should go in **rc.local** or **rc.serial**.


    If you want **rc.local**, it should be in /etc/rc.d. Most systems include one
    even though it doesn’t do much. You can also include an rc.serial in /etc/rc.d
    if you need to do serial port specific things at boot time.


    The chain of events is as follows:'
  merge: -1
  img_proc: true
- pgno: 167
  md: '+   • The kernel looks in several places for init and runs the first one it
    finds

    +   • init runs /etc/rc.d/rc.sysinit

    +   • rc.sysinit does a bunch of necessary things and then runs rc.serial (if
    it exists)

    +   • init runs all the scripts for the default runlevel.

    +   • init runs rc.local


    The default runlevel is decided in /etc/initab. You should have a line close to
    the top like:


    id:3:initdefault:


    From this, you''d look in the second column and see that the default runlevel
    is 3, as should be the case for most systems. If you want to change it, you can
    edit /etc/initab by hand and change the 3. Be very careful when you are messing
    with the initab. If you do mess up, you can fix it by rebooting and doing:


    LILO boot: linux single


    This should allow you to boot into single user mode so you can fix initab. Now,
    how does it run all the right scripts? If you enter ls -l on rc3.d, you might
    see something like:


    +   lrwxrwxrwx 1 root root 17  13:11  S10network -> ../init.d/network

    +   lrwxrwxrwx 1 root root 16  13:11  S30syslog -> ../init.d/syslog

    +   lrwxrwxrwx 1 root root 14  13:32  S40cron -> ../init.d/cron

    +   lrwxrwxrwx 1 root root 14  13:11  S50inet -> ../init.d/inet

    +   lrwxrwxrwx 1 root root 13  13:11  S60nfs -> ../init.d/nfs

    +   lrwxrwxrwx 1 root root 15  13:11  S70nfsfs -> ../init.d/nfsfs

    +   lrwxrwxrwx 1 root root 18  13:11  S90lpd -> ../init.d/lpd.init

    +   lrwxrw-r-x 1 root root 11  13:11  S99local -> ../rc.local


    What you''ll notice is that there are no real "files" in the directory. Everything
    there is a link to one of the scripts in the init.d directory. The'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'links also have an "S" and a number at the beginning. The "S" means to start
    this particular script and a "K" would mean to stop it. The number is there just
    for ordering purposes. Init will start all the services based on the order they
    appear. You can duplicate numbers, but it will only confuse you somewhat. You
    just need to use a two digit number only, along with an upper case "S" or "K"
    to start or stop the services you need to.


    How does init start and stop services? Simple. Each of the scripts is written
    to accept an argument which can be "start" and "stop". You can execute those scripts
    by hand in fact with a command like:


    ```

    /etc/rc.d/init.d/httd.init stop

    ```


    to stop the httd server. Init just reads the name and if it has a "K", it calls
    the script with the "stop" argument. If it has an "S" it calls the script with
    a "start" argument. Why all these rulelevels? Some people want an easy way to
    set up machines to be multi-purpose. I could have a "server" runlevel that just
    runs httd, sendmail, networking, etc. Then I could have a "user" runlevel that
    runs xdm, networking, etc.


    # 10.5.2 Init Runlevels


    Generally, Red Hat Linux runs in run level 3–full multiuser mode. The following
    runlevels are used in Red Hat Linux:


    +   * 0 Halt.

    +   * 1 Single user mode.

    +   * 2 Multiuser mode, without NFS.

    +   * 3 Full multiuser mode.

    +   * 6 Reboot.


    If your machine gets into a state where it will not boot due to a bad /etc/inittab,
    or will not let you log in because you have a corrupted /etc/passwd or have simply
    forgotten your password, boot into single user mode by typing linux 1 at the LILO
    boot prompt. A very bare system will come up and you will be given a shell from
    which you can fix things.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# ### 10.5.3 Shutting Down


    To shutdown Red Hat Linux, issue the `shutdown` command. You can read the shutdown
    man page for complete details, but the two most common usages are:


    ```

    ```

    shutdown -h now

    shutdown -r now

    ```

    ```


    Each will cleanly shutdown the system. After shutting everything down, the first
    will halt the machine, and the second will reboot.


    Avoid running the `reboot` or `halt` commands directly in order to prevent damage
    to your filesystem.


    # ## 10.6 Rescue Modes


    When things go wrong, there are several ways to work on fixing them. However,
    they require that you understand the system well. This manual can''t teach you
    what to do, but we will present the ways that you can use our products to get
    into rescue modes where you can use your own knowledge to rescue the system.


    # ### 10.6.1 Through LILO


    If your system boots, but does not allow you to log in when it has completed booting,
    you can use the **single or emergency boot option**. At the `LILO boot:` prompt,
    type `linux single` in order to boot in single-user mode. In single-user mode,
    your local filesystems will be mounted, but your network will not be activated.
    In emergency mode, almost nothing will be set up. Only the root filesystem will
    be mounted, and it will be mounted read-only.


    # ### 10.6.2 Emergency Boot Floppies


    The installation floppy set can also be used as a rescue disk set. When you boot
    the boot floppy, type `rescue` at the boot prompt (on non-Intel'
