  md: "# 2.4. STEP-BY-STEP INSTALLATION\n\n![](img/06353bca937b38b02602dcfb58824d72_38_0.png)\n\
    \nto set aside at least one disk partition for Red Hat Linux. If you need to create\
    \ one or more partitions, select the disk you wish to partition and press Enter;\
    \ the installation program starts the Linux fdisk utility. Please see Section\
    \ 2.2.3 for recommendations about partitions for Red Hat Linux.\n\n# Using fdisk\n\
    \nfdisk includes online help which is terse but useful. Here are a few tips:\n\
    \n+   - To list the current partition table, use the p command. To add a new partition,\
    \ use n.\n+   \n+   - Linux fdisk creates partitions of type Linux native by default.\
    \ When you create a swap partition, don't forget to change it to type Linux swap\
    \ using the t command.\n+   \n+   - Linux allows up to four (4) partitions on\
    \ one disk. If you wish to create more than that, one of the four may be an extended\
    \ partition, which in turn contains one or more logical partitions. Since it acts\
    \ as a container, the extended partition must span all of the space that the logical\
    \ partitions will take up.\n+   \n+   - It's a good idea to write down which partitions\
