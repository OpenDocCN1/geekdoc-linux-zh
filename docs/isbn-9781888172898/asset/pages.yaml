- pgno: 134
  md: '+   • Device: This is determined by netconfig based on the devices already
    configured.


    +   • IP Address: Enter an IP address for your network device.


    +   • Netmask: Enter the network mask for your network device.

    +   The network and broadcast addresses are calculated automatically based on
    the IP address and netmask you enter.


    +   • Activate interface at boot time: If you want the device to be configured
    automatically when your machine boots select this by clicking on the box.


    +   • Allow any user to (de)activate interface: Check this if you want any user
    to be able to activate or deactivate the interface.


    +   • Interface configuration protocol: If you have a BOOTP or DHCP server on
    your network and would like to use it to configure the interface, choose the appropriate
    option; otherwise, choose none.


    After providing the configuration information for your new device, click Done.
    The device should appear in your Interfaces list as an inactive device. (The active
    column should have a label of no). To activate the new device, first select it
    with a mouse click and then choose on the Activate button. If it does not come
    up properly, you may need to reconfigure it by choosing on Edit.


    # 8.4.4 Managing Routes


    In the Routes management screen you have the ability to add, edit, or remove static
    networking routes. Adding or editing an entry involves identical actions, just
    like the Hosts panel. An edit dialog box will appear, simply type the new information
    and click Done when you are finished. See figure 8.16 for an example.


    # 8.5 Time and Date


    The time machine allows you to change the time and date by clicking on the appropriate
    part of the time and date display and clicking on the arrows to change the value.'
