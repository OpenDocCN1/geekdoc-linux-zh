    +   • The Free Software Foundation (ftp://prep.ai.mit.edu/pub/gnu or gnu@prep.ai.mit.edu)


    +   • The X Consortium (http://www.x.org) and XFree86 (http://www.xfree86.org)


    +   • For general Unix questions, please see the full line of O''Reilly & Associates
