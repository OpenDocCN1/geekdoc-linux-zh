    # 2.2.1  Installation Methods


    You can install or upgrade Red Hat Linux/Intel via any of several basic

    methods. Depending on the method you use, you need either one or two

    formatted high-density (1.44 MB) 3.5-inch diskettes.


    Installing from CD-ROM or via NFS requires only a boot diskette. In-

    stalling from a hard drive, via FTP, from an SMB volume, or from a PCM-

    CIA device (including PCMCIA-based CD-ROMs) requires both a boot

    diskette and a supplemental diskette. Section 2.3.1 below explains how to

    create boot and supplemental diskettes.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'CD-ROM If you have a Red Hat Linux CD and a boot diskette you will need a supported
    CD-ROM drive and either a 3.5 inch floppy drive or an operational installation
    of MS-DOS on your machine in order to run the installation utility. If a boot
    diskette did not accompany your CD, you will need access to a computer running
    either Linux or MS-DOS to create a boot diskette from the CD.


    NFS If you wish to install over a network, you will need to mount the Red Hat
    Linux CD-ROM on a machine that supports ISO-9660 file systems with Rock Ridge
    extensions. The machine must also support NFS. Export the CD-ROM file system via
    NFS. You will need to have nameservices configured, or know the NFS server’s IP
    address, and the path to the exported CD-ROM.


    FTP For an FTP install, you must have a boot disk and supplemental disk. You will
    need to have a valid nameserver configured or the IP address of the FTP server
    you will be using. You will also need the path to the root of the Red Hat Linux
    directory on the FTP site.


    SMB Shared Volume If you wish to install from an SMB shared volume, you will need
    to mount the Red Hat Linux CD-ROM on a Microsoft Windows NT or Windows 95 server
    that supports shared volumes. You will need to have nameservices configured, or
    know the server’s IP address; you will also need the name of the shared volume
    containing the Red Hat Linux CD-ROM and the account number and password to use
    to access the volume.


    Hard Drive To install Red Hat Linux from a hard drive you will need the same boot
    and supplemental disks used by the FTP install. You must first create a RedHat
    directory at the top level of your directory tree. Everything you will install
    should be placed in that directory. First copy the base subdirectory, then copy
    the packages you want to install to another subdirectory called RPMs. You can
    use available space on an existing DOS partition or a Linux partition that is
    not required in the install procedure (for example, a partition that would be
    used for data storage on the installed system).


    If you are using a DOS filesystem, you may not be able to use the full Linux filenames
    for the RPM packages. The installation process does not care what the filenames
    look like, but it is a good idea that you keep track of them so you will know
    what you are installing.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 2.2. BEFORE YOU BEGIN


    **PCMCIA** If your CD-ROM, ethernet card, or local hard disk is connected to a
    PCMCIA adapter, you must install with PCMCIA support. You need a supported PCMCIA
    controller and a supported PCMCIA SCSI adapter or ethernet card. Installing via
    PCMCIA requires the use of a supplemental diskette.


    # 2.2.2 A Note About Kernel Drivers


    During installation of Red Hat Linux, there are some limits placed on the filesystems
    and other drivers supported by the kernel. However, after installation there is
    support for all file systems available under Linux. At install time the modularized
    kernel has support for (E)IDE devices, (including ATAPI CD-ROM drives), SCSI adapters,
    and network cards. Additionally, all mice, SLIP, CSLIP, PPP, PLIP, FPU emulation,
    console selection, ELF, SysV IPC, IP forwarding, firewalling and accounting, reverse
    ARP, QIC tape and parallel printers, are supported.


    After the installation is complete you may want to rebuild a kernel that includes
    support only for your hardware. See Chapter 5, Section 5.1 for information on
    how to build a customized kernel.


    # 2.2.3 Disk Partitions


    To install Red Hat Linux, you must have disk space available for it to “live”
    in. This disk space needs to be separate from the disk space used by other operating
    systems you may have installed on your computer (e.g., MS-DOS, OS/2, a different
    version of Linux, or another well-known operating system which we won’t name).
    The way to make disk space available is by dividing it into *partitions*.


    You may wish to install Red Hat Linux on its own hard disk, or even on a computer
    which contains no other operating system. In that case, you can use the Red Hat
    Linux installation system to create the disk partitions you need.


    Alternatively, you may wish to install Red Hat Linux on a disk which already contains
    software or data from a different operating system; how to create the disk partitions
    you need depends on what other operating system is present.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Disk Partitions and MS-DOS


    Most MS-DOS systems, as they come from the vendor, have one hard disk which contains
    one large partition. In order to install Red Hat Linux, you need to make that
    partition smaller, and then create a partition for Red Hat Linux in the space
    that''s left. There are two ways to accomplish this:


    **Destructive Repartitioning** This procedure destroys any data in the disk partition(s)
    you are resizing; you should make a complete, reliable backup of everything you
    wish to keep from the disk you are repartitioning. Then, use the MS-DOS disk partitioning
    utility, called `fdisk`, to delete the large partition and create a smaller MS-DOS
    partition. Restore your data to the new partition from your backup.


    **Non-Destructive Repartitioning** This procedure is not supposed to destroy data
    in the disk partition(s) you are resizing; however, we recommend making reliable
    backups of data you wish to keep in any case. You can use the `fips` utility,
    included on the Red Hat Linux CD in the `dosutils` directory, to resize your MS-DOS
    partition; we highly recommend reading the `fips` documentation, located the `fipsdoccs`
    subdirectory, before doing so.


    After repartitioning, you can use the Red Hat Linux installation system to create
    partitions for your Red Hat Linux system as described in *Step-By-Step Installation*.


    # Disk Partitions and Other Operating Systems


    Information on creating disk partitions to be compatible with other operating
    systems is available in several HOWTOs and Mini-HOWTOs, available on the Red Hat
    Linux CD in the `doc/HOWTO` and `doc/HOWTO/mini` directories.


    # How Many Partitions?


    If you wish to, you can install Red Hat Linux in a single large partition. However,
    we recommend the following (**Please Note:** If you plan to install all the software
    packages accompanying Red Hat Linux, you may need to use even larger partitions):'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'A **swap partition** for virtual memory. If your computer has 16 MB of memory
    or less, you must create a *swap partition*; even if you have more memory, a swap
    partition is recommended. The size of your swap partition should be at least 16
    MB or the same as the amount of memory in your computer, whichever is larger.


    A **root partition** to be mounted as ` / ` (the root directory) when your Red
    Hat Linux system boots; it only needs to contain things necessary to boot your
    system, as well as system configuration files. 50–80 MB works well for most systems.


    A **/usr partition**, where much of the software on a Red Hat Linux system lives;
    this partition should be 200–500 MB, depending on how many packages you plan to
    install.


    A **/home partition**, where users’ *home directories* go; the size of /home depends
    mostly on how many users you plan to have on your Red Hat Linux system and what
    they might store in their home directories.


    Additionally, you may wish to create any of the following:


    A **/tmp partition** for temporary files. This is a good idea for larger, multiuser
    systems or network server machines.


    A **/usr/src partition** if you wish to install a large amount of the source code
    included with Red Hat Linux.


    A **/usr/local partition** to hold things you wish to keep separate from the rest
    of your Red Hat Linux system, such as software that is not available as an RPM
    package.


    # # 2.3 Preparing to Install


    # ## 2.3.1 Creating the Boot and Supplemental Floppies


    Your Red Hat Linux/Intel CD set may include a boot diskette and supplemental diskette.
    If so, you may skip to Section 2.3.2. If not, you must create them.'
  merge: -1
  img_proc: true
- pgno: 25
  md: "You need only a boot diskette if you are installing Red Hat Linux from CD-ROM\
    \ or via NFS. You also need a supplemental diskette if you are installing from\
    \ a hard disk, via FTP, or from a PCMCIA device.\n\nTo create the boot and supplemental\
    \ floppies, you need two blank, formatted, high-density (1.44 MB), 3.5-inch diskettes.\
    \ The diskette images are located in the images directory on the Red Hat Linux\
    \ CD or the FTP site where you got Red Hat Linux. Each image is a *snapshot* of\
    \ the appropriate floppy diskette, which you need to transfer onto an actual floppy;\
    \ you can do this using either MS-DOS or Linux.\n\n# Making Floppies Under MS-DOS\n\
    \nTo make floppies under MS-DOS, use the rawrite utility included on the Red Hat\
    \ Linux CD in the dosutils directory. First, label a formatted 3.5-inch floppy\
    \ “Boot Diskette” or something similar and insert it into the floppy drive. Then,\
    \ use the following commands (assuming your CD is drive d:):\n\n```\nd: \\\n \
    \   cd \\images \\\n    \\dosutils\\rawrite.exe\n```\n\nrawrite first asks you\
    \ for the filename of a diskette image; enter boot.img. Then it asks you for a\
    \ diskette drive to write the image to; enter a:. If you need to make a supplemental\
    \ floppy, label a second diskette and then run rawrite again, using supp.img.\n\
    \n# Making Floppies Under Linux\n\nTo make floppies under Linux, you must have\
    \ permission to write to /dev/fd0 (the 3.5-inch floppy drive). Label a blank,\
    \ formatted diskette “Boot Diskette” or something similar and insert it into the\
    \ floppy drive (but don’t mount it). After mounting the Red Hat Linux CD, change\
    \ to the images directory and use the following command:\n\n```\ndd if=boot.img\
    \ of=/dev/fd0 bs=1440k\n```"
  merge: -1
  img_proc: true
- pgno: 26
  md: "# 2.3. PREPARING TO INSTALL\n\nIf you need to make a supplemental floppy, label\
    \ a second diskette, insert it in the floppy drive, and then use the following\
    \ command:\n\n```\ndd if=supp.img of=/dev/fd0 bs=1440k\n```\n\n# Installing Without\
    \ Using a Boot Floppy\n\nAlternatively, if you have MS-DOS installed on your computer,\
    \ you can boot the installation system directly from the CD without making floppies.\
    \ To do this, use the following commands (assuming your CD is drive d:):\n\n```\n\
    d:\n cd \\dosutils\n autoboot.bat\n```\n\n# 2.3.2 A Note About Virtual Consoles\n\
    \nThe Red Hat Linux installation system is more than simply the dialog boxes it\
    \ presents as it guides you through the installation procedure. In fact, the installation\
    \ system presents several different kinds of diagnostic messages while running,\
    \ and it gives you a means to enter commands from a shell prompt. It presents\
    \ the installation dialogs, shell prompt, and messages on five *virtual consoles*\
    \ which you can switch between using a single keystroke. These virtual consoles\
    \ can be very helpful if you encounter a problem while installing Red Hat Linux;\
    \ messages displayed on the install log or system log can help to pinpoint the\
    \ problem. Please see Figure 2.1 for a listing of the virtual consoles, the keystrokes\
    \ to switch to them, and their contents.\n\n| Console | Keystroke | Contents |\n\
    | :---- | :---- | :---- |\n| 1 | Alt-F1 | installation dialog |\n| 2 | Alt-F2\
    \ | shell prompt |\n| 3 | Alt-F3 | install log (messages from install program)\
    \ |\n| 4 | Alt-F4 | system log (messages from kernel, etc.) |\n| 5 | Alt-F5 |\
    \ other messages |\n\nFigure 2.1: Virtual Console Information"
  merge: -1
  img_proc: true
- pgno: 27
  md: '# 2.3.3 Using the Dialog Boxes


    You can navigate around the installation dialogs using a simple set of keystrokes.
    In most dialog boxes there is a *cursor or highlight* which you can move using
    the arrow keys ([⬅][➡][⬆][⬇], `Tab`), and `Alt`+`Tab`. A summary of movement commands
    is presented at the bottom of each screen.


    To “press” a button (such as `OK`), `Tab` to the button and press `Space`. To
    select an item from a list of items, move the highlight to the item you wish to
    select and press `Enter`. To select any number of items from a *checklist*, move
    the highlight to the item you wish to select and press `Space` to select an item.
    To deselect an item, press `Space` a second time.


    Pressing `F12` accepts the current values and proceeds to the next dialog; it
    is usually equivalent to pressing the `OK` button.


    **Please Note:** Do not press random keys during the installation process; it
    may result in unpredictable behavior.


    # 2.4 Step-By-Step Installation


    # 2.4.1 Starting the Installation System


    #### Booting


    To begin installing Red Hat Linux, insert the boot floppy you just created into
    the floppy drive and reboot the machine (if you have MS-DOS installed on your
    machine, you can start installing directly from the CD-ROM; see Section 2.3.1
    above). The *boot:* prompt appears; press `Enter` to boot. Watch the boot messages
    to see whether the Linux kernel detects your hardware. If it does not properly
    detect your hardware, you may need to reboot and enter some options at the *boot:*
    prompt, e.g.:


    ```

    boot: linux hdc=cdrom

    ```


    Press `Enter` to boot using those options. If you do need to specify some boot
    options, please make note of them; they will be needed later.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '**Please Note:** Because Red Hat Linux supports installation on many different
    types of hardware, many drivers (including those for SCSI adapters, network cards,
    and many CD-ROMs) are not built into the Linux kernel used during installation;
    rather, they are available as *modules* and loaded as you need them during the
    installation process. You will have the chance to specify options for such drivers
    at the time they are loaded, and in fact these drivers will ignore any options
    you specify for them at the **boot**: prompt. Please see Section 2.2.2 above for
    more information about drivers built into the installation system.


    # Beginning the Installation


    After booting, the installation process begins by asking if you are using a color
    monitor (see Figure 2.2). **Yes** is the default; if you can’t distinguish a cursor
    or highlight press `Tab` once, and then `Enter` to proceed. Next it presents a
    welcome message; press `Enter` to begin the installation. If you wish to abort
    the installation process, you may simply eject the boot floppy now and reboot
    your machine.


    ![](img/06353bca937b38b02602dcfb58824d72_28_0.png)'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 2.4.2 Selecting a Keymap


    After the welcome dialog, the installation program gives you an opportunity to
    select a keyboard map (see Figure 2.3). Select the keymap you wish to use on your
    Red Hat Linux system and press **Enter**; the keymap you select will be loaded
    automatically both for the remainder of the installation process and each time
    you boot your Red Hat Linux system.


    If you wish to change your keymap after you have booted your Red Hat Linux system,
    you may use the /usr/sbin/kbdconfig command.


    ![](img/06353bca937b38b02602dcfb58824d72_29_0.png)


    Figure 2.3: Selecting a Keymap


    # 2.4.3 PCMCIA Support


    Next, the installation program asks you whether you need PCMCIA support. If you
    are using a PCMCIA device for installation (for example, a PCMCIA ethernet card
    for installing via NFS, or PCMCIA SCSI card for installing from CD) you should
    answer Yes; the installation program prompts you to insert the supplemental diskette.
    You should wait until the next dialog appears before inserting your PCMCIA card.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# 2.4.4   Selecting an Installation Method


    You can install Red Hat Linux via any of four basic methods (see Section 2.2.1,
    *Installation Methods*), some of which require the use of a supplemental diskette.
    To summarize:


    +   - **CD-ROM** If you have a CD-ROM drive with the Red Hat Linux CD; does not
    require a supplemental diskette.


    +   - **NFS** If you are installing from an NFS server which is exporting either
    the Red Hat Linux CD or a mirror of Red Hat Linux from the Red Hat FTP site; does
    not require a supplemental diskette.


    +   - **Hard Drive** If you copied the Red Hat Linux files to one of your local
    hard drives; requires a supplemental diskette.


    +   - **FTP** If you are installing directly from an FTP server; requires a supplemental
    diskette.


    +   - **SMB image** If you are installing from a Microsoft Windows NT or Windows
    95 shared volume; requires a supplemental diskette.


    The next dialog asks what type of installation method you wish to use (see Figure
    2.4). Highlight the appropriate choice and select **OK**, or press `Enter`. If
    you select *FTP*, or *hard drive*, and you''re not using PCMCIA support, the installation
    program prompts you to insert the supplemental diskette.


    # CD-ROM Type


    If you choose to install Red Hat Linux/Intel from CD-ROM, the installation program
    prompts you for the type of CD-ROM:


    +   - **IDE (ATAPI)** Most CD-ROMs available for Intel-based PCs are IDE (also
    known as ATAPI) CD-ROMs. The install program checks for a CD-ROM on all available
    IDE devices before giving up.


    +   - **SCSI** Select this if your CD-ROM is attached to a supported SCSI adapter;
    the installation program asks you to choose a SCSI driver. Choose the driver that
    most closely resembles your adapter. You may specify'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'options for the driver if necessary; however, most drivers detect your SCSI
    adapter automatically.


    Other If your CD-ROM is neither an IDE nor a SCSI CD-ROM, it''s an “other”. The
    installation program presents a list of drivers for supported CD-ROMs; choose
    a driver and, if necessary, specify any driver options.


    ![](img/06353bca937b38b02602dcfb58824d72_31_0.png)


    Figure 2.4: Selecting an Installation Method


    # 2.4.5 If You Are Installing via NFS


    If you are not installing Red Hat Linux via NFS, you may skip to Section 2.4.6
    below.


    # Choosing a Network Driver


    If you are installing via NFS, you must have a supported network card installed
    in your computer. The installation program prompts you to choose the driver that
    supports your network card and to specify any options necessary for the driver
    to locate and recognize the card. Most of the time, the driver can locate the
    card automatically by probing; however, it is possible that probing your hardware
    might cause your machine to hang. If'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'this happens, reboot the machine, start the installation again, and specify
    additional driver options when you get to this step (see Appendix A).


    # Configuring TCP/IP Networking


    After the installation program has found your network card, it presents several
    dialogs for configuring TCP/IP networking. This information is only used during
    the installation process; you will be able to configure permanent networking information
    later. This feature allows greater flexibility if you want to install from a network
    other than the one where the machine will “live”. Figure 2.5 contains example
    networking information.


    | Field | Example Value |

    |---|---|

    | IP Address | 10.0.2.15 |

    | Netmask | 255.255.255.0 |

    | Default Gateway | 10.0.2.254 |

    | Primary Nameserver | 10.0.2.1 |

    | Domain Name | redhat.com |

    | Hostname | pooh.redhat.com |


    ![](img/06353bca937b38b02602dcfb58824d72_32_0.png)


    The first dialog asks you for IP and other network addresses (see Figure 2.6).
    Enter the **IP address** you are using during installation and press `Enter`.
    The installation program attempts to guess your **netmask** based on your IP address;
    you may change the netmask if it is incorrect. Press `Enter`. The installation
    program guesses the **Default gateway** and **Primary nameserver** addresses from
    your IP address and netmask; you may change them if they are incorrect. Choose
    **OK** to continue.


    The second dialog prompts you for a domain name, a hostname, and other networking
    information (see Figure 2.7). Enter the **Domain name** for your system and press
    `Enter`; the installation program carries the domain name down to the **Host name**
    field. Enter the hostname you are using in front of the domain name to form a
    fully qualified domain name (FQDN). If your network has more than one nameserver,
    you may enter IP addresses for additional nameservers in the **Secondary nameserver**
    and **Tertiary nameserver** fields. Choose **OK** to continue.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '![](img/06353bca937b38b02602dcfb58824d72_33_0.png)


    Figure 2.6: Configuring TCP/IP


    # NFS Server Information


    The next dialog requests information about the NFS server (see Figure 2.8). Enter
    the name or IP address of your NFS server, and the name of the exported directory
    that contains the Red Hat Linux CD. For example, if the NFS server has the Red
    Hat Linux CD mounted on `/mnt/cdrom`, enter `/mnt/cdrom` in Red Hat directory.
    If the NFS server is exporting a mirror of the Red Hat Linux installation tree
    instead of a CD, enter the directory which contains the RedHat directory. For
    example, if your NFS server contains the directory `/mirrors/redhat/i386/RedHat`,
    enter `/mirrors/redhat/i386`.


    # 2.4.6 Upgrading or Installing


    After you choose an installation method (and, if you’re installing via NFS or
    SMB volume, after you configure networking information), the installation program
    prompts you to either *install* or *upgrade* (see Figure 2.9).'
  merge: -1
  img_proc: true
- pgno: 34
  md: '![](img/06353bca937b38b02602dcfb58824d72_34_0.png)


    Figure 2.7: Configuring Networking


    # Installing


    You usually install Red Hat Linux on a clean disk partition or set of partitions,
    or over another installation of Linux. Installing Red Hat Linux over another installation
    of Linux (including Red Hat Linux) does not preserve any of the prior installation.


    If you wish to perform a full install, choose **Install**.


    # Upgrading


    The installation process for Red Hat Linux 4.2 includes the ability to upgrade
    from prior versions of Red Hat Linux (2.0, 2.1, 3.0,3, and 4.0) which are based
    on RPM technology. Upgrading your system installs the modular 2.0.x kernel as
    well as updated versions of the packages which are installed on your machine.
    The upgrade process preserves existing configuration files using a `.rpm.save`
    extension (e.g., `sendmail.cf.rpm.save`) and leaves a log telling what actions
    it took in `/tmp/upgrade.log`. As software evolves, configuration file formats
    can change, so you should carefully compare your original configuration files
    to the new files before integrating your changes.


    If you wish to upgrade your Red Hat Linux/Intel system, choose **Upgrade**.'
  merge: -1
  img_proc: true
