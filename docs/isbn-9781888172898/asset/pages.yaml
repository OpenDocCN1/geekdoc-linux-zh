- pgno: 113
  md: 'This can be useful if you suspect that your RPM databases are cor- rupt.


    If everything verified properly there will be no output. If there are any discrepancies
    they will be displayed. The format of the output is a string of 8 characters,
    a possible "c" denoting a configuration file, and then the file name. Each of
    the 8 characters denotes the result of a comparison of one attribute of the file
    to the value of that attribute recorded in the RPM database. A single "" (period)
    means the test passed. The following characters denote failure of certain tests:


    +   5 MD5 checksum


    +   S File size


    +   L Symbolic link


    +   T File modification time


    +   D Device


    +   U User


    +   G Group


    +   M Mode (includes permissions and file type)


    If you see any output, use your best judgment to determine if you should remove
    or reinstall the package, or somehow fix the problem.


    # 7.3 Impressing Your Friends with RPM


    RPM is a very useful tool for both managing your system and diagnosing and fixing
    problems. The best way to make sense of all the options is to look at some examples.


    +   • Let''s say you delete some files by accident, but you aren''t sure what
    you deleted. If you want to verify your entire system and see what might be missing,
    you would enter:'
