    +   * **Please Note:** None of the changes you make take effect until you save
    them and exit **fdisk** using the **w** command. You may quit **fdisk** at any
    time without saving changes using the **q** command.


    # Numbering Partitions


    Linux refers to disk partitions using a combination of letters and numbers which
    may be confusing to inexperienced users. Here is a summary:


    **The letters** denote the device the partition is on, e.g., `/dev/hda` (the first
    IDE hard disk) or `/dev/sdb` (the second SCSI disk).


    **The number** denotes the partition. The first four (primary or extended) partitions
    are numbered 1 through 4. Logical partitions start at 5. E.g., `/dev/hda3` is
    the third primary or extended partition on the first IDE hard disk; `/dev/sdb6`
    is the second logical partition on the second SCSI hard disk.


