    \ an XL266 and so this is the only one that I can guarantee will work. However,\
    \ technically, all of the above systems are equivalent; they have the same support\
    \ chipsets and the same interrupt handling mechanisms.\n\n# Platform2000\n\nThis\
    \ is a 233Mhz 21066 based system.\n\n# D.6 MILO's User Interface\n\nOnce you have\
    \ correctly installed/loaded/run MILO you will see the MILO (for MILOader) prompt\
    \ displayed on your screen. There is a very simple interface that you must use\
    \ in order to boot a particular Linux kernel image. Typing `help` is a good idea\
    \ as it gives a useful summary of the commands.\n\n# D.6.1 The “help” Command\n\
    \nProbably the most useful command that MILO has:\n\n```\nMILO> help\nMILO command\
    \ summary:\n\nls [-t fs] [dev:[dir]]\t\t\t - List files in directory on device\n\
    boot [-t fs] [dev:file] [boot string]\n```"
  merge: -1
