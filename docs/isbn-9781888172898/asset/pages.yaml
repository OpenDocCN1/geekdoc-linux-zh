  md: 'should be added to the Xconfig file.


    # B.2.4 Modes


    The last section of the **Xconfig** file is the Mode database (**Modes**). It
    contains the VESA timing specifications for various resolutions. The default values
    work for most graphics cards, but they can be tweaked to center the image and
    adjust its size on the monitor. Most of the Metro-X servers use this database
    to configure the card for graphics mode. The numbers indicate which clock to use
    from the DisplayConfig file''s CLOCKS line, and also show the horizontal and vertical
    timing values. More specifically, an example of the numbers are:


    ```

    ''1024x768'''' 65 1024 1092 1220 1344 768 786 791 810

    ```


    The following table shows the definition of each Modes number from the prior example.


    | VALUE | Meaning |

    | --- | --- |

    | "1024X768" | Screen Resolution in Pixels |

    | 65 | Pixel Clock (MHz) |

    | 1024 | Pixels Displayed (H) |

    | 1092 | Sync Start (H) |

    | 1220 | Sync End (H) |

    | 1344 | Total (H) |

    | 768 | Pixels Displayed (V) |

    | 786 | Sync Start (V) |

    | 791 | Sync End (V) |

    | 810 | Total (V) |


    Figure B.3: Modes Definitions


    These numbers represent the ranges the electron beam traverses per one vertical
    refresh of the screen. They determine where the image is positioned on the screen,
    and what the refresh rate is.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Adjusting the Image Position


    You can edit the Modes numbers if the screen image does not properly center or
    fill the monitor screen. Be sure to center the image before stretching or shrinking
    it. Any adjustments you make will go into effect after restarting the X server.
    **Centering the Image:** The **Pixels Displayed** numbers must match the desired
    physical screen resolution. The **Sync Start** and **Sync End** numbers must be
    increased or decreased (to move left or right; up or down) at the same time and
    by the same amount, and stay within the range of the **Displayed** and **Total**
    values.


    +   - Image too far right: To adjust an image that is too far to the right, increase
    the **Horizontal Sync Start** and **Horizontal Sync End** values equally.


    +   - Image too far left: To adjust an image that is too far to the left, decrease
    the **Horizontal Sync Start** and **Horizontal Sync End** values equally. For
    example, to adjust an image that is too far to the left, you could begin the process
    by adding 8 to the two horizontal timing numbers (**Sync Start** and **Sync End**).
    Make sure that the **Sync End** number does not exceed the **Horizontal Total**
    number. The same technique applies for vertical positioning:


    +   - Image too low: To adjust an image that is too far to the bottom, decrease
    the **Vertical Sync Start** and **Vertical Sync End** values equally.


    +   - Image too high: To adjust an image that is too far to the top, increase
    the **Vertical Sync Start** and **Vertical Sync End** values equally. For example,
    to adjust an image that is too high, you could begin the process by adding 8 to
    the two vertical timing numbers (**Sync Start** and **Sync End**). Make sure that
    the **Sync End** number does not exceed the **Vertical Total** number.


    **Stretching or Shrinking the Image:** The **Pixels Displayed** numbers must match
    the desired physical screen resolution. The **Total** value is increased or decreased
    to stretch or shrink the image. In addition, to hold the center position, the
    **Sync Start** and **Sync End** numbers must be increased or decreased equally,
    based on one-half of the difference in the changed **Total** value. For instance,
    if you added 10 to the **Horizontal Total** value, you would also add 5 to the
    **Horizontal Sync Start** value and 5 to the **Horizontal Sync End** value.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '+   • Image too narrow horizontally: To stretch an image that is too narrow
    horizontally (extra space appears on the left and right), increase the **Horizontal
    Total** by amount x, then add one-half of x to both the **Horizontal Sync Start**
    and **Horizontal Sync End** values.

    +   • Image too narrow vertically: To stretch an image that is too narrow vertically
    (extra space appears on the top and bottom), increase the **Vertical Total** by
    amount x, then add one-half of x to both the **Vertical Sync Start** and **Vertical
    Sync End** values.

    +   • Image too wide horizontally: To shrink an image that is too wide horizontally
    (the image extends beyond the left and right edges), decrease the **Horizontal
    Total** by amount x, then subtract one-half of x from both the **Horizontal Sync
    Start** and **Horizontal Sync End** values.

    +   • Image too tall vertically: To shrink an image that is too tall vertically
    (the image extends beyond the top and bottom edges), decrease the **Vertical Total**
    by amount x, then subtract one-half of x from both the **Vertical Sync Start**
    and **Vertical Sync End** values.


    # Extensions


    Extensions are configured in the **/usr/lib/X11/Metro/Extensions** file. Most
    extensions are dynamically loaded; that is, if they are needed they are loaded
    automatically without any additional manual configuration. An extension that is
    “ON” is loaded at server startup and never unloaded. An extension that is “DY''N”
    is dynamically loaded on request by an X client **XQueryExtension** call. These
    extensions display with **XlistExtensions** or **xdpyinfo**. An extension that
    is “OFF” can not be used, nor is it displayed with **XlistExtensions** or **xdpyinfo**.


    # Special Notes


    +   • **Multi-Buffering** and **DOUBLE-BUFFER** can not be dynamically loaded.
    They must be set to “ON” or “OFF”.

    +   • **GLX** (OpenGL) can be dynamically loaded, however **GLX** depends on **DOUBLE-BUFFER**
    being “ON”. Therefore, to use **GLX**, set **DOUBLE-BUFFER** to “ON” and **GLX**
    to “DY''N”.'
  merge: -1
  img_proc: true
- pgno: 187
  md: +   • **X3D-PEX** (PEX) can be dynamically loaded, however **X3D-PEX** depends
    on **Multi-Buffering** being “ON”. Therefore, to use **X3D-PEX**, set **Multi-Buffering**
    to “ON” and **X3D-PEX** to “**DY**N**”.
