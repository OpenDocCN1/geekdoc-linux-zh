    | Problem | Description |

    | missing | The file is no longer on your system |

    | mode | permission bits have changed |

    | size | file’s size has changed |

    | uid | owner’s uid has changed |

    | gid | owner’s gid has changed |

    | md5 | the md5 checksum has changed |

