- pgno: 62
  md: '# ## 3.6 Installing


    # ### 3.6.1 Booting the Kernel Floppy


    To boot the Linux/Alpha kernel from the diskette you made above, use MILO. See
    Appendix D, *Alpha Miniloader Hownto*, Section D.5 for detailed information about
    how to load MILO from your MILO floppy. Boot to the MILO> prompt, insert your
    kernel floppy in the first floppy drive, and give MILO the following command:


    ```

    boot fd0:vmlinuz.gz root=/dev/fd0 load_ramdisk=1 prompt_ramdisk=1

    ```


    MILO reads the Linux kernel from your boot disk and runs it.


    If you are using the SRM console to load the kernel instead of MILO, you need
    to give the following arguments to the kernel:


    ```

    load_ramdisk=1 prompt_ramdisk=1

    ```


    # ### 3.6.2 Starting the Install


    After the kernel boots, it prompts for a ramdisk. Insert the ramdisk floppy into
    the floppy drive and press Enter.


    # ### 3.6.3 Issues Specific to Linux/Alpha


    # **Disk Partitioning**


    Red Hat Linux/Alpha supports two varieties of hard drive partitioning:


    +   - **Standard fdisk-style partitioning:** this has the usual oddities (such
    as extended partitions) and is done in the same way as on Intel platforms (using
    Linux fdisk). This is the partitioning style you must use if you are using the
    ARC console.


    +   - **BSD-style disk-labelling:** It is normal to make the first partition on
    a disk-labelled hard drive the swap partition. We don''t recommend using BSD disk-labelling
    unless it is absolutely necessary.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# XFree86 and TGA


    If you have an Alpha with a TGA card and you choose to install XFree86, the installation
    program prompts you to choose a video card. Choose Unlisted Server; the installation
    program displays a list of available servers. Choose the TGA server.


    # 3.6.4  Finishing Up


    After the install is finished and your system is fully configured, you will be
    asked to reset your computer. This indicates that your system has been successfully
    installed.


    # 3.7  Booting your Red Hat Linux/Alpha system


    To boot Red Hat Linux from MILO, you must use the boot command. The command differs
    slightly depending on where your root partition is. For example, if your root
    partition is the second partition on your first SCSI hard drive, you would boot
    as follows:


    ```

    boot sda2:vmlinux.gz root=/dev/sda2

    ```


    If instead your root partition is the third partition on your second IDE drive,
    you would use this command:


    ```

    boot hdb3:vmlinux.gz root=/dev/hdb3

    ```


    For information on these commands and on automating the boot process, please read
    the MILO HOWTO in Appendix D.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Chapter 4


    # Installing Red Hat Linux/SPARC


    These are brief installation instructions for the *Red Hat Linux/SPARC* 4.2 release
    for the SPARC family of processors. This chapter describes the differences between
    installing Red Hat *Linux/SPARC* and Red Hat *Linux/Intel*. For further details
    on the installation procedure, please see Chapter 2.


    # 4.1 Hardware


    Red Hat *Linux/SPARC* is known to function on the following hardware:


    +   • sun4c architecture machines (IPC, SS1, etc)

    +   • sun4m architecture machines (Classic, SS5, SS10, etc)

    +   • bwtwo, cg3, cg6, TCX framebuffers (24 bit on the TCX)

    +   • cg14 framebuffer (in cg3 mode)

    +   • SCSI and Ethernet on all of the above

    +   • type 4 and type 5 keyboards and mice'
  merge: -1
  img_proc: true
- pgno: 65
  md: "+   - external SCSI drives\n+   - CD-ROM drives (external and internal)\n+\
    \   - SCSI/Ether SBUS expansion cards\n+   - Any original equipment Sun monitor\
    \ for the above framebuffer\n\nA partial list of *unsupported* hardware:\n\n+\
    \   - VME based sun4m machines, such as the 4/690\n+   - sun4d (SS1000, SS2000)\n\
    +   - sun4u (UltraSparc1, UltraSparc2, EnterPrise UltraSparc servers)\n+   - sun4\
    \ architecture\n+   - Eurocard sundc machines, called the 'sun4e' under Solaris2.4\
    \ and others, are not supported. These are VME-bus sun4c machines, to which the\
    \ kernel has not been ported yet.\n\n# ### 4.2 Booting from Floppy\n\n# #### 4.2.1\
    \ Making a Boot Floppy\n\nIf your SPARC system has a floppy drive, you can boot\
    \ the Red Hat Linux installation program from a floppy diskette. The boot floppy\
    \ image is located on the **images/** directory on your Red Hat CD.\n\nTo create\
    \ the boot floppy, you can use **rawrite.exe** under MS-DOS (located on your Red\
    \ Hat Linux/SPARC CD in the **dosutils** directory), or you can use **dd** under\
    \ Linux or Unix. Under MS-DOS, you would enter the following commands (assuming\
    \ the CD-ROM is drive d:):\n\n```\nd:\n cd \\images\n \\dosutils\\rawrite.exe\n\
    ```"
  merge: -1
