- pgno: 122
  md: 'To remove a user, select a user in the main window by clicking on it, and then
    click on **Remove**. You will be presented with the dialog box presented in Figure
    8.3. There are three types of action you may take. You may *ignore* the user’s
    home directory, leaving it alone, you can archive and compress it into a `.tar.gz`
    file, or you can delete it completely. You can *delete* the user’s mail spool
    if you like. These first two actions will take place immediately after you confirm
    the deletion, before the tool accepts more input. You can search for files owned
    by the user on parts of the filesystem other than the user’s home directory and
    either give ownership to the user *nobody* or delete them. If you choose to search
    for the user’s files, you have the option of *mailing* a report of the errors
    to root. This is important because the searching will be done in the background
    as you continue to work; it may take a long time. To find files owned by *nobody*,
    execute the following command:


    ```

    find / \( -group nobody -o -user nobody \) -print

    ```


    # Deactivating a User


    Sometimes you may just want to temporarily *remove* a user, with the intention
    of reinstating the user later. The **Lock** and **Unlock** functions handle this.
    When you deactivate a user, the user’s password is locked by prepending a `*`
    to it, preventing the user from logging in. You also have the option of “collapsing”
    the user’s home directory with **tar** and **gzip**, which can save some space.
    When you reactivate a user, the password locking is removed, and if the home directory
    was collapsed, it is expanded back to normal. When you lock a user, you are presented
    with the same options as when you delete a user, but you are unlikely to want
    to delete any files.


    # 8.1.3 Creating a New Group


    To create a new group, first switch to group editing mode by selecting the **Groups**
    tab at the top of the main window. Clicking on **Add** brings up a dialog box
    to specify the group details. First enter a name for the new group. Just like
    a user name, the group name should have no spaces or colons, and should be no
    longer than 8 characters. You can set a group password; if you do, users who are
    not members of the group may assume group membership by using the **newgrp** program
    and providing it with the'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'password. To add members to the group, enter their names in the User list field.
    When you have selected all the group members, click **Done**


    # ### 8.1.4 Editing an Existing Group


    To edit an existing group, double-click on the group in the main window, or click
    on the group and then on **View/Edit**. The same interface is used to edit an
    existing group as to create a new group.


    # ## 8.2 File System Configuration


    The file system configuration tool shown in Figure 8.4 allows you to easily examine
    and manipulate file system mount points, types, options, etc. It is very useful
    for manipulating a large number of file systems. You probably don''t want to do
    this unless you are an experienced system administrator. If you do know what you
    are doing, it should be fairly straightforward as to how to mount, unmount, and
    add devices.


    The **Reload** entry in the **FSM** menu causes the file system configuration
    tool to re-load `/etc/fstab` from your hard drive. If you edit `/etc/fstab` by
    hand while the file system configuration tool is running (which you shouldn''t
    do), you probably want to reload.


    To use the buttons along the bottom of the window, select a filesystem in the
    main window, and click on one of the buttons. The buttons perform the following
    functions:


    +   * **Info:** Displays information on the filesystem, including the device,
    partition type, filesystem type, mount point and options, comment, size, percent
    used, etc.


    +   * **Check:** Performs a filesystem check (fsck) on the partition. You can
    do this only on *unmounted* partitions — if the partition is mounted, you will
    get an error and you will have to unmount it first.


    +   * **Mount:** Mounts the selected filesystem.


    +   * **Unmount:** Unmounts the selected filesystem.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# 8.3. PRINTER CONFIGURATION


    +   • **Format**: Creates a new filesystem on the selected partition. This will
    erase all data on the selected partition! You can do this only on *unmounted*
    partitions — if the partition is mounted, you will get an error and you will have
    to unmount it first.


    +   • **Edit**: Brings up a dialog box where you can edit the mount point, mount
    options, comment, etc.


    # 8.2.1 Adding NFS Mounts


    To mount a filesystem via NFS, select **Add Mount** from the NFS menu. A dialog
    box will appear and you will have to fill in the following values:


    +   • **Device**: Enter the host name and path, separated by a colon. For example,
    `foo.bar.com:/usr/exported` indicates the `/usr/exported` directory on `foo.bar.com`.


    +   • **Mount Point**: Enter the directory on your machine where you want to mount
    the NFS filesystem. For example, `/mnt/foo`.


    +   • **Options**: Enter the mount options for this filesystem. The default is
    `soft,intr,ru`. The `ru` means the filesystem is read-write, and `soft,intr` are
    options that make your system a little more resilient when the remote server goes
    down. See the mount man page for a complete list of available options.


    +   • **Comment**: This optional field can be used to store a small comment.


    After filling everything out properly, click on **OK**. At this point the entry
    is made in your `/etc/fstab`, but the filesystem is not actually mounted. To mount
    it, select it in the main window and click on **Mount**.


    # 8.3 Printer Configuration


    The printer configuration tool (`printtool`) maintains `/etc/printcap`, print
    spool directories, and print filters. The filters allow you to print many different
    types of files, including:


    +   • plain text (ASCII) files'
  merge: -1
  img_proc: true
- pgno: 125
  md: '![](img/06353bca937b38b02602dcfb58824d72_125_0.png)


    Figure 8.4: File System Configuration Panel


    +   • PostScript files

    +   • TeX .dvi files

    +   • GIF, JPEG, TIFF, and other graphics formats

    +   • RPMs


    Simply printing a GIF or RPM file using lpr does “the right thing”.


    ![](img/06353bca937b38b02602dcfb58824d72_125_1.png)


    Figure 8.5: Print Tool


    In order to create a new print queue, choose Add. Then, select what type of printer
    is being added. There are 3 types of print queues which can be configured with
    printtool:'
  merge: -1
