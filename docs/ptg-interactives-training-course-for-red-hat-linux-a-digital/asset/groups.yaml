    the client has does not match that the server has provided. This can be an indication
    that the key has changed, or a rogue host is trying to pass itself off as the
    server.


    +   - The global configuration files are located in /etc. These files are /etc/sshd_config
    for server configuration and /etc/ssh_config for SSH configuration. The options
    for these files are listed in the man pages for SSH and SSHd.'
