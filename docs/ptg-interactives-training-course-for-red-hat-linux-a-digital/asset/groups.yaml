- md: '

    # Restricting the Use of CGI


    - The <Directory> directive, coupled with Linux user and group permissions, can
    exercise very fine control over who can do what in areas of your web space.


    - In general, you will likely not want CGI to be executable from arbitrary directories.


    - Additionally, you will likely want to prohibit browsers from roaming through
    the filesystem, be it a particular user''s or the root filesystem.


    - To make the entire filesystem off-limits to the server, a directive like this
    is placed in httpd.conf:


    ```apache

    <Directory />

    AllowOverride None

    Order deny,allow

    Deny from all

    Options None

    </Directory>

    ```


    - You tell Apache what directories it can serve pages from by adding a statement
    like the following to allow you to serve user files.


    ```apache

    <Directory /home/**/public_html>

    Order allow,deny

    Allow from all

    AllowOverrides IncludesNOEXEC

    </Directory>

    ```


    - This lets you serve pages from your users'' public_html directories and lets
    them use SSI that doesn''t execute external programs or CGI scripts.


    - Some companies have a policy that user pages cannot be seen outside the company
    for legal reasons.


    - In this event, you can assign authentication as shown previously, or limit access
    to those within a specific domain or network range using “Allow From”.


    - In our example above, you can see that it is set to “All”, meaning anyone can
    access the file. Changing this to something like “Allow From .wayga.org” will
    allow only hosts in the domain .wayga.org to access the personal pages.


    ```apache

    <Directory /var/www/html>

    Order deny,allow

    Allow from all

    AllowOverrides All

    </Directory>

    ```


    - * The above lets you serve pages from the document root for the server and allows
    all of the restrictions to be overridden.

    - Now you can set up CGI directories in this tree. You can do this with additional
    <Directory> directives.

    - If you want to turn on CGI in a directory, assuming it can be overridden, using
    .htaccess, you need to add "Options ExecCGI".


    # Notes:


    # PHP


    - PHP is a scripting language with syntax similar to Perl and C.

    - It is embedded within HTML, set off by a variation on the comment-tag.

    - The code within the tag is parsed, and the output, if any, replaces the tag.

    - Typically, a special extension (.php) is used for PHP files to tell Apache to
    parse the file before sending it to the client.

    - You can install the PHP module in your system using the php-4.0.4pl1-9.i386.rpm
    located on the CD-ROM.

    - A sample HTML page that gives information about PHP and its configuration settings
    is seen below.


    Sample PHP file


    ```html

    <HTML>

    <HEAD>

    <TITLE>

    PHP Information

    </TITLE>

    </HEAD>

    <BODY>

    <?php echo phpinfo(); ?>

    </BODY>

    </HTML>

    ```


    - PHP pages are run as the user that Apache runs under.

    - PHP can connect to and extract information from various databases, including
    PostgreSQL, and MySQL.

    - Other database support, such as Oracle and Solid, is available but not as modules.

    - It has very powerful support for Netscape cookies, file upload, and the GD library
    for working with images.


