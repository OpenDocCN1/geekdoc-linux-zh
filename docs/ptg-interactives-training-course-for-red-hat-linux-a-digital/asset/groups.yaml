    \n# LECTURE 4\n\n## Installing New Packages in Red Hat\n\n## Objectives\n\n+ -\
    \ Understanding the Advantages of RPM\n- Building RPM Files from Source\n- Using\
    \ RPM Utilities\n\n## Lesson 4.1\n\n## Working with Binary RPM Files\n\n+ - Precompiled\
