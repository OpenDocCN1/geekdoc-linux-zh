    # Delivery and Alias Files


    +   - By default, e-mail is delivered to /var/spool/mail. E-mail is named for
    the user who is receiving it.


    +   - Creating mail aliases allows incoming mail to get routed to a different
    user or program, even if there is no user account with that name on the system.


    Example 8-2. Sample /etc/aliases File


    ```

    MAILER-DAEMON: postmaster

    postmaster: root


    # General redirections for pseudo accounts.

    bin: root

    daemon: root

    games: root

    nobody: root

    uucp: root


    # Well-known aliases.

    manager: root

    operator: root


    # Person who should get root''s mail

    root: mkomarinski


    # User aliases

    mfk: mkomarinski

    b: brenda

    bdk: brenda

    ```


    +   - Alias entries are simple: the original address, colon, redirect account.


    +   - The first sets of entries are concerned with system accounts-MAILER-DAEMON
    for mailer errors, postmaster, bin, games, and so on.


    +   - At the bottom are some user aliases. These allow someone to have shorter,
    or more easily remembered, names that will be directed to an actual account.


    +   - User aliases are also useful for making sure that sent to a user reaches
    him or her if it is misaddressed in a logical way. For instance, if user John
    Smith has the actual account name'
  - '[PAGE 128]


    # LECTURE 8 E-MAIL


    JS11108, aliases would allow mail sent to “js”, “john”, and “john smith” to all
    be sent to JS11108, even though none of those other three names exist on the system.


