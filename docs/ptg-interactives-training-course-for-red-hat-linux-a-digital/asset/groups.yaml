  - '[PAGE 193]


    # tcpdump


    +   - The tcpdump program puts the Ethernet card into promiscuous mode.

    - All packets seen by the card are displayed on the screen.

    - Filters exist to see only the data that you want to see.

    - Here are a few packets related to ARP:


    ```

    21:49:12.480000 arp who-has myachine.insidehost.com tell

    gateway.insidehost.com

    21:49:12.480000 reply myachine.insidehost.com is-at

    00:0c:01:b4:4f:dc

    ```


    +   - The first line is a request from gateway asking for the Ethernet address
    for my machine.

    - The next line is a reply with the MAC address.

    - This is fairly common, since ARP caches do not last all that

    long.


    +   - Here are some ICMP-related packets:


    ```

    21:50:05.510000 myachine.insidehost.com >

    ping.outsidehost.com: icmp:

    echo request

    21:50:05.650000 ping.outsidehost.com >

    myachine/insidehost.com: icmp:

    echo reply

    ```


    +   - Here we see a ping going from my machine out to a remote site called ping.outsidehost.com.

    - About 140ms later (6500000 minus 510000), the ping is answered with a reply.

    - Since a ping is really asking the remote side to echo data, this

    is how tcpdump reports it.


    +   - Below, tcpdump is run on the second Ethernet port (also known as eth1):


    **Using tcpdump on other interfaces**


    ```

    # /usr/sbin/tcpdump -i eth1

    tcpdump: listening on eth1

    23:12:59.510000 192.168.1.15.listen > hudson.telnet: . ack

    76005909 win 78432 (DF)

    23:12:59.510000 hudson.telnet > 192.168.1.15.listen:

    P 1:29(28) ack 0 win 32736 (DF)

    ```'
  - "[PAGE 194]\n\n# LECTURE 13 SYSTEM AND NETWORK MONITORING\n\n```\n23:12:59.710000\
    \ 192.168.1.15.listen > hudson.telnet: . ack 29\nwin 7814 (DF)\n23:12:59.710000\
    \ hudson.telnet > 192.168.1.15.listen: P\n29:199(170) ack 0 win 32736 (DF)\n```\n\
    \n4 packets received by filter\n0 packets dropped by kernel\n#\n\n+   This example\
    \ looks a bit messy, since the machine in question is logged on via the second\
    \ Ethernet port. What we're seeing is the data from tcpdump being sent over the\
    \ Ethernet line through the telnet window. \n\n+   Let's examine the second and\
    \ third packets:\n\n```\n23:12:59.510000 hudson.telnet > 192.168.1.15.listen:\
    \ P\n1:29(28) ack 0\nwin 32736 (DF)\n23:12:59.710000 192.168.1.15.listen > hudson.telnet:\
    \ . ack 29\nwin 7814\n(DF)\n```\n\n+   - The first line is a packet leaving the\
    \ telnet TCP port on server (the machine connected via telnet) and going to 192.168.1.15\
    \ on the listen TCP port.\n- The timestamp indicates that the time is almost 11:13\
    \ AM (11:12:59.510000, to be precise).\n- After the data represents, special TCP/IP\
    \ flags are mentioned. In this case, the P represents \"Push\". This could also\
    \ be S (Syn), F (Fin), R (Rst) or a period (.), meaning no flags.\n- Next comes\
    \ the data sequence number (1:29(28)). This allows the IP layer to reassemble\
    \ packets as they come in.\n- Next is the ack 0, meaning that it's expecting acknowledgment.\n\
    - The win refers to the size of the remaining receive buffer.\n- The second line\
    \ is the acknowledgment packet from the target machine.\n- Since tcpdump attempts\
    \ to use names instead of IP addresses, you may see a lot of traffic from your\
    \ own machine trying to find out who everyone else is. If you want to turn this\
    \ off, use the -n option."
