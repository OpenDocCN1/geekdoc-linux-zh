  - '[PAGE 46]


    # Installing and Upgrading Binary RPM Files


    +   - The -i switch to the rpm command, followed by a filename or list of files,
    indicates that the file is going to be installed.

    - If an older version of the package already exists, you''ll get an error.

    - If you use the -U switch, this indicates an upgrade.

    - The -F switch, which stands for “freshen”, tells RPM to upgrade the package,
    but only if an older version has been installed.

    - Each of these switches can also use the -h switch, which shows hash marks (#)
    as the install progresses.

    - Any of these may fail if dependencies are not met.

    - There may be a case where you know the dependency is met, but RPM does not know
    about it. In this case, you can add the --nodeps switch to tell RPM to ignore
    dependency checks.

    - To install a package, use this command, assuming example-1.0-1.i386.rpm is in
    the current directory: # rpm -i example-1.0-1.i386.rpm.


    Notes:'
  - '[PAGE 47]


    # Removing RPMs from the System


    +   - Remove RPMs from your system with the -e switch (for erase) followed by
    the name of the RPM.

    - You may not remove packages that have other packages depend on it. In order
    to remove packages that have dependency issues, you must remove the other packages
    first.

    - To remove a package from a system, you do not need to know the version, build,
    or architecture.


    Notes:'
  - '[PAGE 48]


    # Querying RPMs


    +   - To find out what files would be installed if you installed a binary package,
    you can use `rpm -qip package-1.0-1.i386.rpm`. This gives a list of files that
    are in the package and where they will be installed.

    - `rpm -qip_package-1.0-1.i386.rpm` will give a list of the package name, description,
    build information, size of the installed package, and other information.

    - For packages that are already installed, you can get a list of the files that
    are in a package with `rpm -ql package`.

    - If there is a file on the system, and you want to see what package owns the
    file, you can use `rpm -qf filename`.

    - You can get a list of all the packages installed on the system using `rpm -qa`.


    Notes:'
  - '[PAGE 49]


    # Verifying RPMs


    +   - You can use the -V option to rpm to verify packages. This option will let
    you quickly see if a file has been erased or modified since you installed it.


    +   - If you find a problem, you can reinstall the package from its original package
    off the CD-ROM you received from Red Hat.


    +   - You can verify all packages on your system with the command rpm -Va. If
    the verification passes, you won''t see any output. If a particular test fails,
    you will get a possible list of eight characters, followed by a “c” if it''s a
    configuration file, followed by the name of the file. The possible eight characters
    are: 5 (MD5 checksum failed), S (File size), L (Symbolic link), T (File modification
    time), D (Device file), U (User (file owner)), G (Group (group owner)), and M
    (File mode).


    +   - If you modified a configuration file, such as for Apache, you can expect
    to see at least one or more of the above failures.


    +   - If you see this on a file like /bin/su or /bin/login, it may indicate a
    break-in.


    +   - This is an added layer of defense for verifying your system is clean, and
    can be used in conjunction with a program like tripwire.


    Notes:'
