  - "[PAGE 64]\n\n# LECTURE 5 NETWORKING WITH LINUX\n\n# DHCP Configuration\n\n# Server\
    \ Configuration\n\n+   - Decide on whether to use dynamic or static IP addressing.\n\
    \  - Static IP addresses allow you to use your existing DNS configuration and\
    \ not have to worry about setting up a dynamic DNS server.\n  - It is advisable\
    \ to leave 5 or 10 addresses available dynamically allocated so that you can get\
    \ a machine on the network temporarily.\n- There are two programs to give you\
    \ access to DHCP services: the server software dhcpd and client software pump.\n\
    - There should be only one DHCP server on a network\n- The DHCP server also provides\
    \ BOOTP services; turn off any existing BOOTP servers and use dhcpd instead.\n\
    - The configuration file that dhcpd uses is /etc/dhcpd.conf. This file contains\
    \ MAC addresses, IP information, and router/WINS/nameserver information. An example\
    \ of this file is below.\n\nSample DHCP configuration file\n\n```\n# What's the\
    \ DNS name of this server?\nserver-identifier hudson.wayga.org;\n\n#Also identify\
    \ the DNS domain that clients will be under\noption domain-name \"wayga.org\"\
    ;n\n#What DNS servers should look at? (put at least 2)\noption domain-name-servers\
    \ shaft.wayga.org, hudson.wayga.org;\n\n# Define a Class C network (192.168.1.0->192.168.1.255)\n\
    subnet 192.168.1.0 netmask 255.255.255.0 {\n\n# Set the network mask (again)\n\
    option subnet-mask 255.255.255.0;\noption domain-name \"wayga.org\";noption domain-name-servers\
    \ shaft.wayga.org, hudson.wayga.org;\n\n# Define how long a lease for an IP address\
    \ should be.\ndefault-lease-time 600;\n\n#Max lease time, in case that's what\
    \ the\n# client requests.\nmax-lease-time 7200;\n```"
- md: "\n# Specify the default router.\noption routers 192.168.1.142;\n\n# The below\
    \ IP range will be dynamically\n# allocated to clients whose MAC address\n# doesn't\
    \ match any of the following hosts.\n# range 192.168.1.46 192.168.1.50;\n\n# A\
    \ printer (called lpipc)\n\n```\nhost lpipc {\n  #MAC address for lpipc\n  hardware\
    \ Ethernet 0:60:b0:0fc:0ca9;\n  #It's FQDN dns knows what its IP is\n  # We could\
    \ have used a plain IP address here, but why?\n  fixed-address lpipc.auroratech.com;\n\
    }\n```\n\n```\n#PC host\n  host camille {\n    hardware Ethernet 0:0:bc:0f:12:d6;\n\
    \    fixed-address camille.auroratech.com;\n  }\n```\n\n```\n# PC host using a\
    \ different default router.\n  host cyrus {\n    hardware Ethernet 0:10:4b:a2:e2:4b;\n\
    \    fixed-address cyyrus.auroratech.com;\n    option routers 192.168.1.95;\n\
    \  }\n```\n\n- Two other files that get created when dhcpd is running are /etc/dhcpd.leases\
    \ and /etc/dhcpd.pid.\n- The .pid file contains the PID of the running dhcpd to\
    \ make stopping or restarting dhcpd easier.\n- The .leases file is used if you\
    \ have dynamic IP addresses being used in a network. It contains information about\
    \ who is being leased IP addresses, and how long the lease last.\n- In the event\
    \ of a reboot or restart of dhcpd, the dhcpd.leases file should not be deleted,\
    \ as it is re-read on the startup of dhcpd to know what dynamic IP addresses have\
    \ already been assigned.\n\n# Client Configuration\n\n- Using netcfg, set the\
    \ IP configuration to be DHCP and activate the Ethernet card.\n- linuxconf can\
    \ also be configured to start up an Ethernet interface with DHCP.\n- Windows machines\
    \ can merely be set for DHCP configuration via the Network Control Panel.\n- Other\
    \ UNIX machines (such as Solaris) may come with DHCP client software already installed,\
    \ or you can download and compile the ISC DHCP distribution available at http://www.isc.org/.\n\
    - If you choose to use all dynamic IP addresses on your network, you can use a\
    \ program like lanlord (http://linux.uhw.com/software/lanlord/) to view what IP\
    \ addresses have been assigned.\n\nNotes:\n\n# PPP\n\n- The Point-to-Point Protocol\
    \ (PPP) is the way to connect to the Internet or a TCP/IP network via a dial-up\
    \ line.\n- PPP is designed to work between two machines and two machines only.\
    \ This makes it ideal for dial-up applications, or even connecting remote locations\
    \ via a leased line.\n- PPP depends on one machine running pppd server on one\
    \ end of the phone line, and a pppd client running on the machine dialing up.\n\
    - You have to configure the software differently depending on whether you're the\
    \ client or the server.\n- PPP doesn't quite have the overhead of Ethernet since\
    \ no MAC addresses are used.\n\nNotes:\n\n# LECTURE 5 NETWORKING WITH LINUX\n\n\
    # PPP Client\n\n- Setting up a PPP client requires a modem, phone line, a PPP\
    \ server, and a phone number to call.\n- The quick way of verifying that a PPP\
    \ connection works is by doing something similar to the following:\n\n```\n# pppd\
    \ connect 'chat -v \"+\" ATDTphone CONNECT \" login: login\nword: password' \\\
    > /dev/cu1 3840 debug crctscts modem defaultroute\n```\n\n- phone, login, and\
    \ password are assigned to you by whoever is providing the PPP account.\n- Change\
    \ /dev/cu1 to be the location of your modem. Remember that /dev/cu1 under Linux\
    \ is the same as COM2: under DOS and Windows.\n- The chat command is used to dial\
    \ the modem and provide the login and password information.\n- Once chat makes\
    \ a successful connection, PPP takes over the line and starts a connection.\n\
    - The server and client negotiate settings like Maximum Transmit Units (MTU),\
    \ compression, and a few other settings.\n- This configuration can be filled out\
    \ in scripts using the Red Hat Network Configuration Manager by entering the phone\
    \ number, line speed, modem, login, and password.\n\n# PPP Server\n\n- To get\
    \ the PPP server software running, you must have IP-forwarding and PPP turned\
    \ on. This allows Linux to act as an ARP proxy and answer ARP requests for an\
    \ Ethernet address.\n- Assign a bank of IP addresses that are not in use and will\
    \ not be in use. These will be the addresses used for incoming connections, and\
    \ there should be at least as many available as you have phone lines.\n- Create\
    \ new accounts for each user that will be connecting via PPP. Many places use\
    \ the name of the user with a P prepended to it. Have the user information in\
    \ /etc/passwd look something like this: Pmark:x:500:500:PPP user:/home/mark/usr/local/bin/pppd.\n\
    - In the home directory of that user, create a .ppprc file and add the text from\
    \ the example below:\n\nSample .ppprc file\n\n```\n-detach\nmodem\ncrctscts\n\
    lock\n192.55.123.100:192.55.123.111\nproxyarp\n```\n\n- --detach says to not detach\
    \ from the console.\n- modem says to monitor the CD (Carrier Detect) line and\
    \ terminate if CD drops.\n- lock will lock the device, preventing anyone else\
    \ from using that serial port.\n- The two IP addresses are the address of the\
    \ server (waiting for the call) followed by a colon and the IP address to assign\
    \ to the client when it dials in.\n- proxyarp allows the server to put the PPP\
    \ client in its ARP cache and respond to packets that are supposed to go to the\
    \ client.\n- Set up getty to monitor the serial ports.\n- The pppstats command\
    \ can give a running total of packets in and out for the line.\n\n- If you choose\
    \ to use dynamic IP addresses instead of static IPs to save on IP addresses, create\
    \ a /etc/ppp/options.ttyXX file for each tty file that is attached to a modem,\
    \ where xx is the name of the serial port.\n- The content of the options.ttyXX\
    \ file is the same as the .ppprc file listed above, with the exception that the\
    \ IP address is changed for each file.\n\n# Notes:\n\n# Lesson 5.2\n\nxinetd\n\
    \n- The xinetd meta-daemon is used to start programs automatically when a request\
    \ comes in on a specific TCP/IP port.\n\nNotes:\n\n# /etc/services\n\n- The /etc/services\
    \ file contains information about a TCP/IP port number, and a name for the specified\
    \ port which is later used in the /etc/inetd.conf file.\n\nSample /etc/services\
    \ file\n\n```\nftp-data      20/tcp\nftp             21/tcp\ntelnet          23/tcp\n\
    smtp            25/tcp timserver\ntime            37/tcp timserver\ntime     \
    \       37/udp resource\nrlp             39/udp nameserver\nname            42/udp\
    \ nameserver\nwhois           43/tcp nicname # usually to sri-nic\ndomain    \
    \      53/tcp\ndomain          53/udp\n```\n\n- The first entry in the line is\
    \ the service name. This is followed by the port number and the protocol (TCP\
    \ or UDP), which are then followed by any aliases.\n- The port where email comes\
    \ in a name in is the smtp port; it is located on port 25, and its alias is mail.\n\
    \nNotes:\n\n# /etc/xinetd.d\n\n- The /etc/xinetd.d directory contains a list of\
    \ files that xinetd reads and uses to know what ports to monitor. The following\
    \ example contains the configuration file xinetd uses to monitor the port used\
    \ by finger.\n\n# Configuration file for finger\n\n```\n# default: on\n# description:\
    \ The finger server answers finger requests.\nFinger is\n# a protocol that allows\
    \ remote users to see\ninformation such as\n# login name and last login time for\
    \ local users.\nservice finger\n{\n    socket_type = stream\n    wait = no\n \
    \   user = nobody\n    server = /usr/sbin/in.fingerd\n    disable = yes\n}\n```\n\
    \n- The service line indicates the name of the service that is being defined,\
    \ which is finger in this case. There are several additional parameters set within\
    \ the service section:\n\n- socket_type, which is set to stream, meaning that\
    \ we're using TCP instead of UDP.\n- The wait option allows xinetd to either start\
    \ new processes of this service as needed, or run only one service at a time.\n\
    - The user option lists the username that the command will run as, if any.\n-\
    \ server lists the command that will run when activated.\n- disable shows whether\
    \ or not this service is disabled.\n\n- Some high-throughput programs (apache\
    \ and sendmail prime examples), you do not want to have constantly restarting\
    \ since it takes a lot of time; these will fork off or spawn new processes as\
    \ needed.\n"
