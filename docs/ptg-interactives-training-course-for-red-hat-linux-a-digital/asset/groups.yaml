    \ for more information on tuning Samba for high-performance environments.\n- The\
    \ printing option allows you to select a print server type.\n\n## Browse WINS\
    \ Options\n\n- When an SMB network is set up on a local network, each of the machines\
    \ in that network sees the others and has an election to see who will handle browse\
    \ requests from clients.\n- The os is a number in the election on the local network\
    \ and can be between 0 and 255. Windows 95 and 98 clients have an NT server has\
    \ a level of 32. Anything higher than this will win a local election, except against\
    \ other Samba.\n- If local master is set, then Samba will participate in elections,\
    \ with the os level specified earlier.\n- The domain master option option selects\
    \ whether Samba will try to allocate a special NetBIOS name to collect workgroup\
    \ information across subnets.\n  - If you have a PDC, you should set this to No,\
