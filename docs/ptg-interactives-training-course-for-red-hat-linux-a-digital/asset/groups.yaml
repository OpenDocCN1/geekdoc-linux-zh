- md: "\n## LECTURE 2 LINUX BOOT AND SHUTDOWN\n\n## Lesson 2.3\n\n### What's a Runlevel?\n\
    \n- The runlevel of a machine determines what functionality the system should\
    \ be providing.\n- UNIX has a single-user safe mode, plus other configurations\
    \ available.\n- You do not need to reboot to move between runlevels. For instance,\
    \ you can start Linux in single user mode to fix a bootup problem, then continue\
    \ in multiuser mode without restarting the kernel.\n- The first script that gets\
    \ run by `init` no matter what runlevel you are using is the `/etc/rc.d/rc.d`\
