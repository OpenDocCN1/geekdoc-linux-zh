    +   - The IMAP server is included with Red Hat in the imap-4.5 RPM and is configured
    to get files from /var/spool/mail.


    +   - Client setup requires you to set the server name and the username/password.


    +   - One option that you will need to look at is the server directory option,
    which tells the client what directory on the server contains the mail folders.
    If the user shares home directories via Samba or NFS, you''ll want to change the
    server directory to something like ~user/Mail.


    +   - The downside is that you have to set it each time you configure someone
    for IMAP.


    +   - The benefit is that your users won''t confuse their e-mail with their regular
    files.


    +   - By default, mbox (mail that was read and not put in another mail folder)
    is stored in ~user/mbox, which is actually the same file used by the UNIX mail
    program.


    +   - New mail is checked for in /var/spool/mail.


    +   - If you need to change this, you''ll have to recompile the software.'
