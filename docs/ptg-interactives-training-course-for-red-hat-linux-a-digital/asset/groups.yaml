- md: '

    ## LECTURE 12 WORKING WITH THE RED HAT LINUX KERNEL 179


    ## Building the Kernel


    - After configuration, you can build the kernel.

    - The first thing you should take a look at if you want to store the kernel configuration
    is to get `/usr/src/linux/.config`, as it has the output from the configuration
    options selected previously.

    - The `make dep` command sets up the dependencies needed so the kernel can be
    built. This is a crucial step; the kernel will not compile without it.

    - Use `bzip2` for building the kernel, as it makes a much smaller kernel than
    `gzip` or uncompressed.

    - Build a bzip2 kernel by using `make bzImage`. The compressed image is built
    and put into `/usr/src/linux/arch/i386/`.

    - You may want to just use `make bzImage` to put the kernel into `/` and run lilo
    to let you boot the new kernel.

    - Some users may not want their kernel in `/`, since many distributions create
    a small `/boot` partition that contains the kernel and enough space to boot the
    kernel. In this event, you will want to copy the kernel into `/boot`.

    - If you will be using modules, you will also need to run `make modules` and `make
    modules_install`.


    ## Notes:


    ## Lesson 12.3


    ## Tuning a Running Linux System


    ## The /proc Filesystem


    - In the event of serious memory or hardware issues, you can sometimes get a change
    depending on the kernel revision, but is generally arranged in different classes.

    - `Processes` contains information about each of the running processes, organized
    by PID. Each process has its own directory of information.

    - `bus` contains information about the system busses.

    - `cpuinfo` holds information about the CPU(s) installed in your system.

    - `filesystems` has a list of the filesystems that the kernel currently knows
    about.

    - `ide` contains information about the IDE devices that are in your system. It
    is organized by IDE channels that are available.

    - `meminfo` has the raw memory information that you would normally see as output
    of `free`.

    - `modules` gives a listing of the modules, size of the module, and dependencies
    for the module.

    - `partitions` has a list of all the disk partitions that are known to Linux,
    including those not mounted or listed in /etc/fstab.

    - `pci`: This file may go away in the long term, in favor of /proc/bus/pci, `/proc/pci`
    is more human readable, listing the device type, vendor, and device name.

    - `scsi` is much the same as for IDE, listing chains, followed by devices on each
    chain.

    - `swaps` lists all mounted swap partitions (or files) mounted.

    - `version` contains version information of the kernel you are using. It''s very
    helpful in that it has the user and host that the kernel was compiled on, GCC
    version used to compile the kernel, date and time this kernel was compiled.

    - Not listed above is /proc/sys. This directory is where most of the runtime changes
    to the kernel take place.


    ## LECTURE 12 WORKING WITH THE RED HAT LINUX KERNEL 181


    - Access to this used to be done manually, using cat and echo to view or change
    settings of a running kernel. If you wanted runtime settings to be changed each
    time the machine booted, you had to add commands to the rc.local file for each
    setting.

    - An easier way to manage these settings is via the use of sysctl.


    ```

    sysctl [-n variable] [-w variable=value] [-a]

    ```


    - If you use an argument of just variable, you will get the current value of /proc/sys/variable.

    - You can set a value by using the -w switch and by adding an equal sign and value.

    - You can get a list of what is available along with their current values by using
    -a.

    - If you use the -n switch, you only get the value back and not the text of the
    variable, making it easier to work with shell scripts.


    - As part of the Linux boot sequence on more modern distributions, sysctl is called
    with -p, which reads settings from /etc/sysctl.conf.

    - This file can be edited by a text editor and contains a list of lines of the
    form variable=value.


    ```

    Sample of sysctl.conf

    #

    #/etc/sysctl.conf - Configuration file for setting system variables

    # See sysctl.conf (5) for information.

    #

    #kernel.domainname = example.com

    #net/ipv4/icmp_echo_ignore_broadcasts=1

    net.ipv4.conf.all.hidden = 1

    net.ipv4.conf.lo.hidden=1

    ```


    - Security for viewing or setting all /proc files is handled by regular file permissions.


    ## Using powertweak


    - Another way to change options of a running kernel is **powertweak**.

    - powertweak also runs on startup of Linux, using a daemon called powertweak to
    issue changes to the kernel.

    - Configuration files are stored in the kernel in XML format.

    - An advantage of using **powertweak** over **sysctl** is that powertweak has
    a graphical interface.

    - Security for viewing or setting all /proc files is handled by regular file permissions.


    ## Lesson 12.4


    ## Summary


    - There are three ways to configure the kernel: config, sysctl, and powertweak.

    - The `/proc` filesystem can give information about system.

    - Tuning the kernel allows you to improve performance or increase security.


    ## Notes:


    ## Lecture 13


    ## System and Network


    ## LECTURE 13 SYSTEM AND NETWORK MONITORING


    ## Lesson 13.1


    ## Syslog


    - Non-comment lines are entries and consist of two fields. The first field lists
    the facility, or type of program generating the event. The second part is the
    priority or severity of the event.

    - The syslog program gets started at boot-time and uses /etc/syslog.conf to know
    what to do.


    ```

    Sample of syslogd.conf

    #

    #/etc/syslog.conf - Configuration file for setting system variables

    # See syslogd.conf (5) for information.

    #

    # Log all kernel messages to the console.

    kern.*  /console


    # Log anything (except mail) of level info or higher.

    *.info;mail.none /log/messages


    # The authpriv file has restricted access.

    authpriv.* /log/secure


    # Log all the mail messages in one place.

    mail.* /log/mail


    # Everybody gets emergency messages on another machine.

    *


    # Save mail and news errors of level err and higher in a special file.

    uucp.news.crit /log/spool

    ```


    - There are 20 facilities available: 12 system facilities and 8 assigned for local
    use.

    - There are eight priorities available ranging in severity from debug (low severity)
    to emerg (high severity).

    - The facility/priority combination you list will report all the messages that
    get sent to for that priority and higher.

    - Replacing either the facility or priority with an asterisk (*) will report for
    all facilities or all priorities, depending on where you put the asterisk (before
    or after the period).

    - The man pages for the particular programs you want to monitor will list what
    facilities the program uses.


    - The second field lists where message should be sent. This can be a file (if
    the destination starts with /), a remote host (if the destination starts with
    @), all logged-in users (if the destination is *), or a specific user (if it starts
    with none of the previous characters).

    - Using remote host logging can finalize a group of computers to log all their
    messages to one machine.

    - How you log depends on what you want to log.

    - For an initial setup, you should probably start by logging about everything.

    - As the system becomes stable and is working correctly, change the priority to
    something like warn or err to keep out regular debugging information.

    - You may also choose to have different files for different facilities. This can
    make it easier to separate problems if they arrive.


