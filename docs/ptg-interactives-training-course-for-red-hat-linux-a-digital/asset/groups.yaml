    \ provide the output now).\n\n[content]\nPrint servers are dedicated boxes with\
    \ one or two parallel ports and a 10/100 Ethernet connection that cost about $100US.\
    \ Print servers usually have support for LPD and come with drivers that support\
    \ Windows printing over the network.\n\n- For ease of use, you should configure\
    \ a Linux box as a central place for print requests to go. Configure this box\
    \ to accept print requests via LPR, IPP (CUPS), and SMB printing from Windows\
    \ machines. You can then have this machine talk to the print server.\n\n## Notes:\n\
    \n## Lesson 6.3\n\n### Configuring LPRng\n\n- Red Hat Linux uses LPRng, which\
    \ is the next generation of the Line Printer Daemon.\n- The initial versions of\
    \ LPR had little or no support for authentication, load balancing, and failover.\
    \ LPRng adds this support while being lightweight enough to not consume too many\
    \ resources.\n- The main access to configuration of printers is through **printconf**.\
    \ This application only works if you have a graphical window working already.\n\
    \  - When you start **printconf**, you will get a list of printers that the local\
    \ system knows about. If this is the first time you have run it, there will be\
    \ no printers listed.\n- The interface makes it easy to add printers.\n\nNotes:\n\
    \n## LECTURE 6 PRINTING AND PRINT SHARING 91\n\n### Managing Print Queues\n\n\
    - Print queues are FIFO (First In First Out), so the first one in line gets to\
    \ have access to the printer.\n- The commands you will want to know about to manage\
    \ the print queues are `lpc`, `lprm`, and `lpq`.\n- The `lpq` command shows what\
    \ is in the queue and gives the current status of the printer; some printers will\
    \ be able to tell `lpd` that they are out of paper or that the connection is down,\
    \ and these errors will show up in the `lpq` listing.\n- The `lprm` command will\
    \ remove jobs from the queue.\n- By default, only root and the person who submitted\
    \ the print job can remove a job from the queue.\n- Most printers have an internal\
    \ buffer, so removing the job if it is already printing may not cause the printer\
    \ to immediately stop.\n- The `lpc` command is the “lpc control.” It can activate\
    \ and deactivate queues and printers, rearrange jobs in the queue, and get a status\
    \ of any printer listed in `/etc/printcap`.\n- `lpc` can be run interactively,\
    \ or you can put the commands directly on the `lpc` command line.\n\nNotes:\n\n\
    ## Printers on the Network!\n\n- Since Linux supports both lpd and SMB for print\
    \ sharing, most computers on your network will be able to print to your printer\
    \ with little trouble.\n- When talking over the network to LPRng, you should have\
    \ drivers for printers loaded on the client side before you start up.\n- Print\
    \ jobs that come from the network get passed to the printer port directly without\
    \ being processed by the local print drivers.\n\nNotes:\n\n## LECTURE 6 PRINTING\
    \ and PRINT SHARING\n\n### Access from Other LPD (UNIX) Systems\n\n- To permit\
    \ access from specified hosts with LPRng, create a list of users and hosts allowed\
    \ to submit jobs, delete jobs, and manage printers.\n- The control file is located\
    \ in /etc/lpd.perms.\n- By default, any user on any host can submit jobs, only\
    \ the user or root can remove jobs, and anyone can get queue status, with root\
    \ being able to control print queues.\n- To prevent malicious outside outside\
    \ of your printers, be sure that TCP/IP port 515 is blocked at your firewall and\
    \ configure /etc/lpd.perms to accept jobs only from hosts or users you specify.\n\
    - The /etc/lpd.perms file contains a few samples for access control:\n\n```\n\
    # REJECT SERVICE=X NOT REMOTEIP=130.191.0.0/255.255.0.0\n# REJECT SERVICE=X NOT\
    \ REMOTEHOST=engpc\n```\n\n- These lines show two methods of blocking remote hosts.\n\
    - The first line rejects IP addresses that are not in the 130.191 network.\n-\
    \ The second line rejects hosts that start with “engpc”.\n- If two reject statements\
    \ were activated, only machine names that start with “engpc” and have IP addresses\
    \ starting with 130.191 would be able to connect.\n- Once you have made the changes\
    \ to /etc/lpd.conf, restart LPRng using service lpd restart as the root user.\n\
    - If you want to talk to a printer that exists on the network and is compatible\
    \ with the LPD protocol, enter the IP address and type of printer to printconf.\n\
    \n### Access via SMB (Windows Networking)\n\n- The best way to get a Linux printer\
    \ seen on a Windows network is to run Samba.\n- Samba should be configured to\
    \ use the /etc/printcap file and BSD-style printing.\n- Be sure to install a print\
    \ driver under Windows for the kind of printer you have installed, as the print\
    \ filter on Linux should just pass the data along to the printer.\n- Windows NT\
    \ and 2000 can handle serving and printing via LPD, so you may want to use it\
    \ instead.\n\nNotes:\n\n## LECTURE 6 PRINTING AND PRINT SHARING\n\n### Lesson\
    \ 6.4\n\n### CUPS\n\n- CUPS (the Common UNIX Printing System) is not a part of\
    \ Red Hat Linux, and it is more complicated for new users to set up.\n- CUPS has\
    \ some advantages that make it worth using instead of LPR.\n- CUPS includes a\
    \ web interface, browsing, and auditing.\n- CUPS supports HP and inkjet printers.\n\
    - CUPS is available at http://cups.org/.\n- CUPS is designed to act as a client.\n\
    - CUPS allows you to print from this machine or remote machines that support IPP.\n\
    - (The OCR text is highly repetitive; I will provide the unique content blocks).\n\
    \n### CUPS Client\n- From a program like Mozilla that gives you the option of\
    \ a command to use, use xpp instead of lp or lpr.\n- When you print, xpp will\
    \ get the print job, then pop up a menu of available printers.\n- You can select\
    \ a printer to send the job to along with changing print settings for this job.\
    \ A text-only print job can be submitted with low print quality, while a digital\
    \ image can be printed with higher resolution.\n\n- You can get a copy of xpp\
    \ at http://cups.sourceforge.net/xpp/.\n\n### CUPS Interface\n- To add a printer\
    \ using the web interface, select “printers” from the top of the page.\n- Select\
    \ “add printer”. You will be asked to authenticate as either the root user or\
    \ a user is a member of the ipadmin group.\n- Once authenticated, you will go\
    \ through a printer setup wizard to configure the printer.\n- With that, the printer\
    \ is now set up. You can now send print jobs to the printer from this machine\
    \ or remote machines that support IPP.\n\n### CUPS Server Configuration\n- The\
    \ configuration file for CUPS server (called cupsd) is located in /etc/cups/cupsd.conf.\n\
    - After the “Allow” line, you can add lines:\n- This access gives any host in\
    \ the domain to submit or view print jobs. The root user can connect and change\
    \ printer settings, but any local user that is in the ipadmin group can also add,\
    \ delete, and modify printers.\n- Note that usernames and passwords are sent in\
    \ the clear when talking to the web server. This method should never be used over\
    \ an insecure network.\n"
  mdcn: "\n打印服务器是专用设备，具有一两个并行端口以及 10/100 以太网连接，价格约为 100 美元。打印服务器通常支持 LPD，并配有支持 Windows\
    \ 网络打印的驱动程序。\n\n- 为了方便起见，你应该配置一台 Linux 机器作为打印请求的中心。配置该机器以接受来自 Windows 机器通过 LPR、IPP\
    \ (CUPS) 和 SMB 的打印请求。然后，你可以让这台机器与打印服务器通信。\n\n## 注意：\n\n## 课程 6.3\n\n### 配置 LPRng\n\
    \n- Red Hat Linux 使用 LPRng，它是行打印机守护进程（Line Printer Daemon）的下一代。\n- LPR 的初始版本对认证、负载均衡和故障转移的支持较少或没有支持。LPRng\
    \ 增加了这些支持，同时足够轻量，不会消耗过多资源。\n- 配置打印机的主要方法是通过 **printconf**。该应用程序只有在你已经运行了图形化窗口的情况下才能工作。\n\
    \  - 当你启动 **printconf** 时，你将获得本地系统已知的打印机列表。如果这是第一次运行它，将不会列出任何打印机。\n- 该界面使得添加打印机变得简单。\n\
    \n注意：\n\n## 讲座 6 打印与打印共享 91\n\n### 管理打印队列\n\n- 打印队列是 FIFO（先入先出），因此排在队中的第一个可以访问打印机。\n\
    - 你需要了解管理打印队列的命令有 `lpc`、`lprm` 和 `lpq`。\n- `lpq` 命令显示队列中的内容并提供打印机的当前状态；某些打印机能够告诉\
    \ `lpd` 它们缺纸或连接已断开，这些错误将出现在 `lpq` 列表中。\n- `lprm` 命令将从队列中删除作业。\n- 默认情况下，只有 root\
    \ 用户和提交打印作业的人可以从队列中删除作业。\n- 大多数打印机都有内部缓冲区，因此如果作业已经在打印，删除该作业可能不会导致打印机立即停止。\n- `lpc`\
    \ 命令是“lpc 控制”。它可以激活和禁用队列及打印机，重新排列队列中的作业，并获取 `/etc/printcap` 中列出的任何打印机的状态。\n- `lpc`\
    \ 可以以交互方式运行，你也可以直接将命令放在 `lpc` 命令行上。\n\n注意：\n\n## 网络上的打印机！\n\n- 既然 Linux 同时支持 lpd\
    \ 和 SMB 进行打印共享，你网络上的大多数计算机都能轻松地打印到你的打印机。\n- 在通过网络与 LPRng 通信时，你应该在启动之前在客户端加载打印机驱动。\n\
    - 来自网络的打印作业将直接传递到打印机端口，而不经过本地打印驱动程序的处理。\n\n注意：\n\n## 讲座 6 打印与打印共享\n\n### 从其他 LPD\
    \ (UNIX) 系统访问\n\n- 要允许指定主机通过 LPRng 访问，请创建一个允许提交作业、删除作业和管理打印机的用户和主机列表。\n- 控制文件位于\
    \ /etc/lpd.perms。\n- 默认情况下，任何主机上的任何用户都可以提交作业，只有用户或 root 可以删除作业，任何人都可以获取队列状态，而\
    \ root 能够控制打印队列。\n- 为了防止打印机外部的恶意攻击，请确保在防火墙上拦截 TCP/IP 端口 515，并配置 /etc/lpd.perms\
    \ 仅接受来自你指定的主机或用户的作业。\n- /etc/lpd.perms 文件包含几个访问控制的示例：\n\n```\n# REJECT SERVICE=X\
    \ NOT REMOTEIP=130.191.0.0/255.255.0.0\n# REJECT SERVICE=X NOT REMOTEHOST=engpc\n\
    ```\n\n- 这些行显示了两种阻止远程主机的方法。\n- 第一行拒绝不在 130.191 网络中的 IP 地址。\n- 第二行拒绝以“engpc”开头的主机。\n\
    - 如果激活了两个 reject 语句，则只有以“engpc”开头且 IP 地址以 130.191 开头的机器名称能够连接。\n- 一旦你对 /etc/lpd.conf\
    \ 了更改，请作为 root 用户使用 `service lpd restart` 重启 LPRng。\n- 如果你想访问网络上且兼容 LPD 协议的打印机，请向\
    \ printconf 输入 IP 地址和打印机类型。\n\n### 通过 SMB 访问 (Windows 网络)\n\n- 让 Windows 网络看到\
    \ Linux 打印机的最佳方法是运行 Samba。\n- Samba 应该配置为使用 /etc/printcap 文件和 BSD 风格的打印。\n- 确保为你安装的打印机类型在\
