  - '[PAGE 201]


    # Lesson 14.2


    dump and restore do literal dumps and restores of the entire filesystem.


    +   * dump and restore do literal dumps and restores of the entire filesystem.

    * dump cannot back up non-ext2fs filesystems, like NFS.

    * Assigning a dump level to each filesystem controls incremental backups. Dump
    levels range from 0 to 9, and when a dump of a certain level N is performed, all
    files that have changed since the last dump of level N-1 or lower are sent to
    the tape. A level 0 dump will dump the entire filesystem.

    * The dump program strongly suggests you know the length and density of the media
    being used for the backup.


    Notes:'
  - "[PAGE 202]\n\n# LECTURE 14 BACKING UP YOUR DATA\n\n# Lesson 14.3\n\n# Backup\
    \ Strategies\n\n+   - How often you make what kind of backup depends on several\
    \ factors.\n- In general, if more than twenty percent of a particular filesystem\
    \ is changing daily, you should perform incremental backups every day or two,\
    \ a lower-level backup weekly, and a full backup monthly.\n- Lower activity levels\
    \ mean you can space this out more, though there is really no excuse for not performing\
    \ a full backup at least once a month.\n- Another method is to perform a full\
    \ backup every night.\n  - Keep 28 tapes so that you have a total of four weeks\
    \ worth of data at any one time.\n  - Cycle tapes every six months or so.\n  -\
    \ Heavy use of tapes can cause them to deteriorate; replace them regularly.\n\
    This allows you to store information for an indefinite amount of time.\n- This\
    \ is at a higher cost, however, since you have to buy a lot of tapes and you may\
    \ not have enough storage on the tapes.\n- Buy lots of your specific backup media.\n\
    - For very active systems, which more or less cannot be taken off-line, invest\
    \ in a backup utility that can perform live backups during periods of low traffic.\n\
    - More complicated databases are problematic when it comes to live backups.\n\
    \  - Fortunatelyately, most databases can create a snapshot of themselves, and\
    \ that can be placed in your archive.\n  - Failing this, the database will have\
    \ to be taken off-line before being backed up.\n- Keep some backups off-site in\
    \ case of a big disaster."
