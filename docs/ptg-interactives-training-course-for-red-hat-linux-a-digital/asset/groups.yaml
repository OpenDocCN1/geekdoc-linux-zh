- md: "\n## LECTURE 11 SECURING LINUX 167\n\n- To have a completely closed off system\
    \ (from the perspective of tcpd), start with ALL:ALL in /etc/hosts.deny. This\
    \ will deny access for all tcpd services to all hosts.\n- Next, you can start\
    \ opening the system up by adding ALL:LOCAL to /etc/hosts.allow, which allows\
    \ all local machines to have access to all tcpd services.\n\n## Notes:\n\n![](img/82fbcc74bc25eeea437e17c816ad0621_172_0.png)\n\
    \n## Lesson 11.3\n\n## Denial of Service Attacks\n\n- Denial of service means\
    \ that a user may be doing valid things, such as pinging your host or sending\
    \ email, but doing them in a way that prevents others from using the same service.\n\
    - DDOS attacks (called Distributed Denial Of Service) is when a cracker breaks\
    \ into a large number of machines around the Internet and coordinate a simultaneous\
    \ attack against a single host or network.\n  - Since there are a large number\
    \ of machines involved, it is difficult to discriminate between valid and malicious\
    \ requests.\n  - In many cases, there is no choice but to shut the link to the\
    \ Internet down until the attack subsides.\n- Another type of attack involves\
    \ sending so much email that it floods the mail partition.\n- You can find out\
    \ more about the current state of cracks at sites like www.cert.org and www.rootshell.com.\n\
    \n## Notes:\n\n## LECTURE 11 SECURING LINUX\n\n## Lesson 11.4\n\n## Network Security\n\
    \n- Network security covers how to set up your network and data so it is more\
    \ secure.\n- For a small office setting, it's probably best to have a single host\
    \ to interact with the outside world.\n- Protect the rest of the network using\
    \ Linux's built-in packet filtering iptables.\n- Monitor the anonymous FTP and\
    \ WWW logs for break-ins. These logs are found at /var/log.\n- The security files\
    \ you'll want to look at are located in /var/log/security.\n- For users that require\
    \ only email, you can have that email forwarded to an external account.\n- Be\
    \ aware of who is on vacation or other types of leave, and make sure they're not\
    \ logged in.\n- This gives a bit of balance to the security and convenience issues.\
    \ Internal employees can go out to the rest of the Internet without using proxies.\n\
    - All the traffic that goes in or out of the router first passes through the firewall.\n\
    - Programs like TripWire run on all hosts. TripWire can monitor system files like\
    \ /etc/passwd and know when these files change. If a file is changed, it sends\
    \ an alert that a potential crack is in progress.\n- For incoming services, anything\
    \ that requires authentication from a user must be encrypted to prevent a rogue\
    \ host from sniffing passwords.\n\n## Lesson 11.5\n\nSummary\n\n- Security is\
    \ a process. Be sure to keep up to date with security releases from Red Hat.\n\
    - Physical security is just as important as network security.\n- Use encryption\
    \ tools to secure passwords and keep sensitive data private.\n\n## Notes:\n\n\
    ## Lecture 12\n\n## Working with the Red Hat Linux Kernel\n\n**Objectives**\n\n\
    - Compile a Version of the Kernel Specific to Your Chipset\n- Add in a New Driver\
    \ or Security Patch\n- Compile a Kernel with Modules Compiled into the Kernel\n\
    \n## Lesson 12.1\n\n## Kernel versions\n\n- There are a few things to consider\
    \ when deciding what kernel revision you should be using in a production environment.\n\
    - Stable releases have an even number as their minor number. These are considered\
    \ by Linux to be stable enough for production use.\n- Development releases have\
    \ experimental drivers or changes to them and can cause crashes if used in production\
    \ environments. However, these releases will be more likely to support newer hardware.\n\
    - Most Linux distributions start with a base of a stable kernel, then add in some\
    \ newer drivers. The resulting kernel is then tested to make sure it is stable,\
    \ then released.\n- As a generalization, stable kernels are good for production\
    \ use, while development kernels may have better performance.\n\n## Notes:\n\n\
    ## LECTURE 12 WORKING WITH THE RED HAT LINUX KERNEL 173\n\n## Lesson 12.2\n\n\
    ## Compiling the Linux Kernel\n\n- There is a specific order to getting your kernel\
    \ compiled.\n- There is nothing preventing you from having multiple kernels and\
    \ modules on the same system. This allows you to boot test kernels while keeping\
    \ a known stable kernel in case you have trouble.\n- Boot loaders like LILO will\
    \ allow you to select a kernel at bootup.\n- The easiest place to pick up the\
    \ latest kernels is http://www.kernel.org. Unpack and untar the kernel. For packages\
    \ compressed bzip2, the process is: # tar -jxvf linux-2.2.19.tar.bz2.\n- This\
    \ will create all the header files and source code for the kernel.\n- There are\
    \ three methods for configuring the kernel to compile; all methods require the\
    \ C compiler.\n- If you already have another Linux kernel installed under /usr/src/linux,\
    \ you can move the directory to another location and store it in case you need\
    \ it.\n\n## Notes:\n\n## Using make config\n\n- The first compile method is to\
    \ use make config from within /usr/src/linux.\n- This method can be tedious since\
    \ you will have to answer every question manually.\n- An advantage of make config\
    \ is that it does not require any other development tools to be installed in order\
    \ to use it.\n\n## Notes:\n\n## Using make menuconfig\n\n- The next level of kernel\
    \ configuration involves using a character-based menu system, `make menuconfig`.\n\
    - For systems that have only a text console or ssh access, this is an easier way\
    \ to configure a kernel.\n- It requires both ncurses and its development libraries\
    \ to be installed for this to work.\n- Use `rpm` to check for the ncurses and\
    \ ncurses-devel packages.\n- With an on-screen menu, it is easier to organize\
    \ and select the options you want to compile in. Help menus are available as well.\n\
    \n## Notes:\n\n## Using make xconfig\n\n- The most user friendly method is the\
    \ **make xconfig** option for configuring the kernel.\n- This requires most of\
    \ the X libraries to be installed, along with Tcl and Tk, and thus is far more\
    \ resource intensive than either of the other choices.\n\n## Notes:\n\n## Options\
    \ for configuring the kernel\n\n- Selecting the right options involves making\
    \ choices that balance your needs for performance, memory consumption, compatibility,\
    \ and security.\n- Selecting the right processor family for your CPU is one of\
    \ the best things to do. Each processor family has its own way of handling memory\
    \ and some CPU-specific options and optimizations.\n- If your hardware setup is\
    \ going to be stable, you can compile in drivers for various hardware for slightly\
    \ better performance and prevent trojan modules from being loaded.\n- Selecting\
    \ DMA access for IDE devices under “Block devices” will automatically turn on\
    \ DMA, reducing CPU load.\n- If your box will be configured as a router without\
    \ firewalling, you can enable “IP: optimize as router not host” under “Networking\
    \ options”.\n- Bonding device support under “Network device support” will enable\
    \ bonding multiple network devices together to create one large pipe to other\
    \ bonded Linux boxes or Cisco routers.\n- If you plan on having a large number\
    \ of users logging in and you need a large number of pseudo terminals (PTYs),\
    \ you can enter a number in “Maximum number of Unix98 PTYs in use (0-2048)” under\
    \ “Character devices”.\n- For systems that will not be onsite and require high\
    \ availability, you can enable “watchdog timer support”.\n\n## Kernel Modules\
    \ and You\n\n- For those who want hard core, as-uncrackable-as-possible systems,\
    \ you may want to consider removing module support from your system. One of the\
    \ more advanced methods of covering a cracker's tracks is to insert a kernel module\
    \ that hides much of their activity.\n- Another tactic is to replace an existing\
    \ module with a trojan horse.\n- Another reason to remove modules from your system\
    \ is to create a smaller size kernel.\n- Notes: information out of Linux.\n\n\
    The /proc hierarchy\n\nNotes:\n\n![](img/82fbcc74bc25eeea437e17c816ad0621_183_0.png)\n"
  mdcn: "\n\n## 第 11 课：加固 Linux 167\n\n- 要实现一个完全隔离的系统（从 tcpd 的角度来看），请从 `/etc/hosts.deny`\
