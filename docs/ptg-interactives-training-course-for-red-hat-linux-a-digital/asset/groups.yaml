- md: "\n# PTG Interactive's Training Course Workbook for RED HAT LINUX by Mark Komarinski,\
    \ RHCE\n\n# PTG Interactive’s Training Course for Red Hat Linux Workbook\n\nMARK\
    \ KOMARINSKI\n\nPrentice Hall PTR \nUpper Saddle River, New Jersey 07458\nCopyright\
    \ © 2002 Prentice Hall PTR\n\n# Contents\n\n- Lecture 1 Installation 1\n- Lecture\
    \ 2 Linux Boot and Shutdown 12\n- Lecture 3 Account Administration 26\n- Lecture\
    \ 4 Installing New Packages in Red Hat 39\n- Lecture 5 Networking with Linux 51\n\
    - Lecture 6 Printing and Print Sharing 86\n- Lecture 7 Samba 103\n- Lecture 8\
    \ E-mail 117\n- Lecture 9 Web Servers 135\n- Lecture 10 X Windowing System 148\n\
    - Lecture 11 Securing Linux 161\n- Lecture 12 Working with the Red Hat Linux Kernel\
    \ 171\n- Lecture 13 System and Network Monitoring 184\n- Lecture 14 Backing Up\
    \ Your Data 192\n\n## Lecture 1 Installation\n\n### Objectives\n\n- Understand\
    \ the Need for Linux\n- Choices for Red Hat Linux\n- Prepare to Install Linux\n\
    - Install Linux\n\n## Lesson 1.1 Understanding the Need for Linux\n\n- Red Hat\
    \ is one of the best Linux distributions; the 7.1 release of Red Hat adds a number\
    \ of new features:\n  - The latest 2.4 kernel.\n  - Three default configurations,\
    \ \"workstation\", \"server\", and \"laptop\", plus a custom that allows for a\
    \ more personalized configuration.\n  - XFree86 version 4.0, which includes new\
    \ features like integrated OpenGL support for most 3D cards, and better support\
    \ for watching DVDs.\n  - Support for many common USB peripherals.\n  - Built-in\
    \ firewall configuration to help secure your machine.\n  - Improved support for\
    \ laptops.\n- If you have an existing Red Hat system and want to upgrade, check\
    \ the section on upgrading later in this course.\n\nNotes:\n\n## LECTURE 1 INSTALLATION\n\
    \n### Lesson 1.2 About Linux\n\n### What is Linux, and why should you use it?\n\
    \nNotes:\n\n### Lesson 1.3 Before the Install\n\n### Getting Linux\n\n- Red Hat\
    \ has a number of versions; these vary in availability, price, and support options.\n\
    - The Standard version contains two OS CDs, 30 days of web-based technical support,\
    \ and 30 days access to the Red Hat Network Support Manager for one system.\n\
    - The Deluxe version includes more printed manuals, 60 days support via telephone\
    \ or web, and 60 days access to the Red Hat Network Support Manager for five systems.\n\
    - The Professional version increases the support to 90 days for telephone and\
    \ web, and 90 days access to the Red Hat Network Support Manager for 10 systems.\n\
    - A more complete list of the differences between each version can be found on\
    \ Red Hat's web site at http://www.redhat.com/products/software/linux/rhl_compare.html.\n\
    - Users new to Linux should get the Deluxe version, as it includes support.\n\
    - These versions can be found at larger stores like CompUSA and Best Buy.\n- Red\
    \ Hat makes a free version of their distribution available on their FTP site and\
    \ various mirrors.\n- This release is free to distribute.\n- Since Red Hat does\
    \ not sell this, there is no manual, application CD, or support.\n- You may also\
    \ choose this method if you want to perform an installation over the Internet\
    \ or LAN via FTP or NFS.\n- The 7.1 release now comprises two CDs, so there is\
    \ more to download and burn if you wish to take this route.\n\n### Preparing to\
    \ Install\n\n- The CD-ROM supplied from Red Hat is bootable and thus you do not\
    \ need to make boot floppies. Check the documentation with your system or motherboard\
    \ to determine how to boot from the CD-ROM.\n- Gather all the information you\
    \ can get about the hardware in your system.\n- The Red Hat installer will usually\
    \ automatically detect what hardware you have.\n- If the installer does not recognize\
    \ the hardware, it will prompt you for hardware parameters which can be found\
    \ in the appropriate manuals.\n- Have your network configuration information on\
    \ hand.\n\nNotes:\n\n### Kickstart\n\n- Red Hat’s kickstart installation allows\
    \ you to pre-configure an installation and create a single boot floppy with it\
    \ on it. This speeds up installations considerably.\n- The kickstart feature is\
    \ available only for local CD-ROM and NFS installs.\n- Read doc/README.ks file\
    \ for information on performing kickstart installs.\n\nNotes:\n\n## LECTURE 1\
    \ INSTALLATION\n\n### Performing the Install\n\n- Insert the first CD into the\
    \ CD-ROM drive.\n- Choose the installation method.\n  - The default method is\
    \ the graphical installer, which is best for most beginners.\n  - The text installation\
    \ method uses a character-based install, good for servers that do not have video\
    \ cards supported by Red Hat Linux.\n  - The \"nofb\" selection uses SVGA without\
    \ framebuffer.\n  - The \"rescue\" selection allows you to attempt recovery from\
    \ Linux.\n  - The \"Custom\" option is good for precise control over the installation\
    \ process.\n- Most hardware will work with the standard install.\n- Select your\
    \ installation language; the default is English.\n- Select your keyboard layout.\
    \ The default is 105-key.\n- Set your mouse in the next screen.\n- The Windowing\
    \ system assumes mice have three buttons.\n- If you have an older version of Red\
    \ Hat installed, you can select \"Upgrade\".\n- For new installations, you can\
    \ select three pre-configured setups: server, workstation, and laptop.\n\nA workstation\
    \ installation will clear all partitions and use up unpartitioned space; other\
    \ operating systems will remain untouched.\n\nA server installation will clear\
    \ all partitions from all hard drives and will not install the X Windows system.\n\
    \nThis installation method should be used with caution, as any data on the system\
    \ will be removed.\n\nThe Laptop installation is similar to the Workstation install,\
    \ but adds PCMCIA support.\n\nThe remaining option is \"Custom\", which is good\
    \ for precise control. The remainder of this course will cover the Custom System\
    \ install.\n"
  mdcn: "\n\n# PTG Interactive 的 RED HAT LINUX 培训课程手册，作者：Mark Komarinski, RHCE\n\n\
    # PTG Interactive 的 Red Hat Linux 培训课程手册\n\nMARK KOMARINSKI\n\nPrentice Hall PTR\
    \ \n新泽西州上萨德尔河 07458\nCopyright © 2002 Prentice Hall PTR\n\n# 目录\n\n- 第 1 节 安装\
    \ 1\n- 第 2 节 Linux 启动与关机 12\n- 第 3 节 账户管理 26\n- 第 4 节在 Red Hat 中安装新软件包 39\n- 第\
    \ 5 节 Linux 网络配置 51\n- 第 6 节 打印与打印共享 86\n- 第 7 节 Samba 103\n- 第 8 节 电子邮件 117\n\
    - 第 9 节 Web 服务器 135\n- 第 10 节 X 窗口系统 148\n- 第 11 节 加固 Linux 161\n- 第 12 节使用 Red\
    \ Hat Linux 内核 171\n- 第 13 节 系统与网络监控 184\n- 第 14 节 备份数据 192\n\n## 第 1 节 安装\n\n\
    ### 目标\n\n- 理解使用 Linux 的需求\n- Red Hat Linux 的选择\n- 准备安装 Linux\n- 安装 Linux\n\n\
    ## 第 1.1 节理解 Linux 的需求\n\n- Red Hat 是最好的 Linux 发行版之一；Red Hat 的 7.1 版本增加了许多新功能：\n\
    \  - 最新的 2.4 内核。\n  - 三种默认配置：“工作站 (workstation)”、“服务器 (server)”和“笔记本电脑 (laptop)”，以及一个允许更个性化配置的自定义。\n\
    \  - XFree86 版本 4.0，包含了针对大多数 3D 显卡的集成 OpenGL 支持，以及对观看 DVD 的更好支持。\n  - 支持许多常见的\
    \ USB 外设。\n  - 内置防火墙配置可帮助保护您的机器。\n  - 改进了对笔记本电脑的支持。\n- 如果您已有一个 Red Hat 系统并想进行升级，请查看课程稍后关于升级的章节。\n\
    \n笔记：\n\n## 第 1 节 安装\n\n### 第 1.2 节 关于 Linux\n\n### 什么是 Linux，你为什么应该使用它？\n\n笔记：\n\
    \n### 第 1.3 节安装前的准备\n\n### 获取 Linux\n\n- Red Hat 有多个版本；这些版本在可用性、价格和支持选项上有所不同。\n\
    - 标准版 (Standard) 包含两张操作系统 CD、30 天网络技术支持，以及针对一个系统的 30 天 Red Hat 网络支持管理器 (Red Hat\
    \ Network Support Manager) 权限。\n- 豪华版 (Deluxe) 包含更多印刷版手册、60 天电话或网络支持，以及针对 5 个系统的\
    \ 60 天 Red Hat 网络支持管理器访问权限。\n- 专业版 (Professional) 将电话和网络支持增加到 90 天，并为 10 个系统提供\
    \ 90 天 Red Hat 网络支持管理器访问权限。\n- 关于每个版本之间差异的更完整列表，可以在 Red Hat 网站上找到：http://www.redhat.com/products/software/linux/rhl_compare.html。\n\
    - Linux 初手用户应该购买豪华版，因为它包含了支持。\n- 这些版本可以在 CompUSA 和 Best Buy 等大型商店找到。\n- Red Hat\
    \ 在其 FTP 站点和各种镜像站上提供免费的发行版。\n- 此版本可以免费分发。\n- 由于 Red Hat 不销售此版本，因此没有手册、应用程序 CD\
    \ 或支持。\n- 如果您想通过 Internet 或 LAN 通过局 FTP 进行安装，也可以选择这种方法。\n- 7.1 版本现在包含两张 CD，因此如果您选择此方案，会有更多内容需要下载和刻录。\n\
    \n### 准备安装\n\n- Red Hat 提供的 CD-ROM 可启动的，因此您不需要制作启动软盘。请检查您的系统或主板文档，以确定如何从 CD-ROM\
    \ 启动。\n- 尽可能收集有关您系统硬件的所有信息。\n- Red Hat 安装程序通常会自动检测您拥有的硬件。\n- 如果安装程序无法识别硬件，它会提示您输入参数，这些参数可以在手册中找到。\n\
    - 准备好您的网络配置信息。\n\n笔记：\n\n### Kickstart（自动安装）\n\n- Red Hat 的 Kickstart 安装允许您预配置安装并创建一个包含它的启动软盘。这大大提高了安装速度。\n\
    - Kickstart 功能仅适用于本地 CD-ROM 和 NFS 安装。\n- 阅读 doc/README.ks 文件了解执行 kickstart 安装。\n\
    \n笔记：\n\n## 第 1 节 安装\n\n### 执行安装\n\n- 将第一张 CD 插入 CD-ROM 驱动器。\n- 选择安装方法。\n  - 默认方法是图形化安装程序，最适合初学者。\n\
    \  - 文本安装方法使用基于字符的安装，适用于不支持 Red Hat Linux 显卡的服务器。\n  - “nofb” 选择使用不带帧缓冲 (framebuffer)\
    \ 的 SVGA。\n  - “rescue (救援)” 选择允许您尝试从 Linux 恢复。\n  - “Custom (自定义)” 适用于对安装过程进行精确控制。\n\
    - 大多数硬件都适用于标准安装。\n- 选择您的安装语言；默认是英语。\n- 选择您的键盘布局。默认是 105 键。\n- 在下一个屏幕设置您的鼠标。\n\
    - 窗口系统假设鼠标有三个按钮。\n- 如果您已经安装了旧版本的 Red Hat，可以选择“Upgrade (升级)”。\n- 对于新安装，可以选择三种预配置的设置：服务器、工作站和笔记本电脑。\n\
    \n工作站安装将清除所有分区并使用所有未分区空间；其他操作系统将不受影响。\n\n服务器安装将清除所有硬盘上的所有分区，并且不会安装 X Windows 系统。\n\
    \n使用此安装方法时应谨慎，因为系统上的任何数据将被删除。\n\n笔记本电脑安装与工作站安装类似，但增加了 PCMCIA 支持。\n\n"
