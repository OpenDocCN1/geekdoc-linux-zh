    # Notes:'
  - "[PAGE 75]\n\n# Lesson 5.3\n\n# Network Applications\n\n# DNS\n\n+   - The nameserver\
    \ is the program that matches an IP address (192.168.1.1) to a hostname (www.wayga.org).\n\
    \  - Since a nameserver looks up and caches DNS requests from client machines,\
    \ it can be used at one end of a slow link to reduce the amount of DNS traffic\
    \ across the link.\n  - The nameserver has provisions for forwarding e-mail addressed\
    \ from one host to another and can provide backups for particular hosts in case\
    \ one Web server is busy while another is idle.\n- When connecting to a TCP/IP\
    \ network, use DNS for hostname resolution by putting these lines in the /etc/resolv.conf\
    \ file, substituting your domain name and IP address for “wayga.org” and “192.168.1.1”\
    \ respectively:\n\n```\ndomain wayga.org\nnameserver 192.168.1.1\n```\n\n+   -\
    \ There can be multiple nameserver entries here, which will be tried in order\
    \ until a successful DNS connection is made.\n- If you plan on running named (the\
    \ DNS server software) locally, you should change the IP address to read 127.0.0.1.\
    \ Be sure to have a few other IP addresses in there in case named goes down."
  - "[PAGE 76]\n\n# Should You Be a DNS Server?\n\n+   * You should run the DNS server\
    \ only in the following cases:\n  - You own a domain and want to control the DNS.\
    \ While many ISPs will handle DNS serving for you, it may be easier for you to\
    \ handle if your environment has frequent changes of machines.\n  - You run a\
    \ large network over a slow link. named can act as a cache to store frequently\
    \ used hosts, and this will reduce some of the traffic.\n  - You have no connection\
    \ to the Internet.\n* If you don't match any of these conditions, you probably\
    \ don't need a DNS server running.\n\nNotes:"
  - "[PAGE 77]\n\n# Configuring the Berkeley Internet Name Daemon 9.1 (BIND)\n\n+\
    \   - To be a DNS server, you need to get (possibly compile) and configure bind.\n\
    - It's very likely that named was installed when Linux was installed; if not,\
    \ you can install the bind package and bind-devel package from the CD-ROM or the\
    \ Red Hat Updates site.\n- The basic configuration file is /etc/named.conf. It\
    \ has four types of statements: one controlling access, one describing the logging,\
    \ describing the more general options, and one or more describing the zone(s)\
    \ it is a server for. Comments in the file start with a hash mark (#).\n\n```\n\
    Sample /etc/named.conf\n\noptions {\n    directory \"/var/named\";\n    // If\
    \ we want to read files, take them from /var/named.\n}\n\nzone \".\" {\n    type\
    \ hint;\n    file \"named.ca\";\n}\n\nzone \"0.0.127.IN-ADDR.ARPA\" {\n    type\
    \ master;\n    file \"named.local\";\n}\n\nzone \"1.168.192.in-addr.arpa\" {\n\
    \    type master;\n    file \"named.192.168.1\";\n}\n\nzone \"wayga.org\" {\n\
    \    type master;\n    file \"named.wayga\";\n    notify yes;\n}\n\nzone \"wayga.org\"\
    \ {\n    type slave;\n    masters { 192.168.1.1; }\n};\n```"
  - '[PAGE 78]


    # LECTURE 5 NETWORKING WITH LINUX


    - The options statement describes what IPs to listen for and what port to use.
    The working directory for named here, /var/named, is fairly widely used. The zone
    files and any other files specified in various statements will live here in the
    absence of any domain information.


    - The logging statement controls the verbosity of the logging and where log messages
    are sent.


    - The acl statement controls which clients your server will answer queries from.


    - zone statements describe what zones the server serves, either as a master or
    a slave (we ignore the stub type here).


    +   * A master is the master authority for information in that domain (zone).


    +   * A slave is a secondary disseminator of zone information, but no changes
    can be made at the slave.


    +   * There is one special type used when specifying the nameservers. It is called
    a hint because named.ca really just supplies a list of servers, some of which
    will have the current list of root nameservers.


    +   * For a slave zone, you must specify at least one master from which bind can
    transfer the zone records.


    This example has a total of five entries for domains.


    - The special domain “.\”, represents the root domain, where to look when nothing
    else is found. The root domain usually points to the list of root servers for
    the entire Internet.


    - The second and third zones are special domains that allow you to determine the
    name of a host if given its IP address; note that the IP addresses are listed
    in reverse order (0.0.127-in-127.0.0).


    - The fourth zone for wayga.org indicates that this server is a master server
    and the zone file is located in named.wayga.


    +   * The notify statement tells bind to tell the slave servers the configuration
    for master changes.


    - The final zone for wayga.org indicates that this server is a slave server; there
    are no configuration files for wayga.org on this server, but it can get the configuration
    from the master, located at 192.168.1.1.'
  - "[PAGE 79]\n\nThe named.wayga file contains DNS information about the hosts in\
    \ the wayga.org domain. This file can define a lot of things, the most important\
    \ being the hostname to IP address mapping.\n\n# Sample named.wayga file\n\n```\n\
    $TTL 10800      IN SOA wayga.org.\n@               mkolarinski.wayga.org. ( \n\
    \                               200012717 ; refresh\n                        \
    \       3600             ; retry\n                               900         \
    \    ; expire\n                               120600           ; default_ttl\n\
    \                               10800 )\n\n@               IN NS 192.168.1.1\n\
    @               IN MX 10 wayga.org.\nwayga.org.      IN A 192.168.1.1\nfuzzy.wayga.org.\
    \ IN A 192.168.1.2\nwww.            IN CNAME wayga.org.\nkryten          IN CNAME\
    \ wayga.org.\nmojoojoj         IN CNAME wayga.org.\n```\n\n+   - Starting off\
    \ each domain record is the SOA, or Start Of Authority.\n  - The Start Of Authority\
    \ starts with the SOA header information, followed by the domain name this SOA\
    \ is for, and a contact name.\n  - Since a @ cannot be in the contact name, replace\
    \ it with a pe-period, as shown in the first line.\n  - The serial number is a\
    \ unique number that usually contains the date and number within the day.\n- The\
    \ remainder of the entries are all in units of seconds.\n  - refresh indicates\
    \ the amount of time before the domain should be refreshed.\n  - retry is the\
    \ amount of time before a failed refresh should be attempted again.\n  - expire\
    \ is the amount of time before a caching name server should purge its information.\n\
    \  - minimum_ttl is the minimum amount of time that this information is good.\n\
    - The MX record is where mail should be sent to; the MX record takes a number\
    \ which indicates how preferable this particular record is for accepting mail,\
    \ useful if you have multiple MX records for a"
  - '[PAGE 80]


    domain. The lower number of the preference, the more likely it will be used.


    +   - The A record indicates a direct hostname to IP address relationship.


    +   - The CNAME record is an alias for hosts, allowing one IP address to have
    multiple names.


    # Notes:'
  - '[PAGE 81]


    # dig


    +   - The dig program interacts with the nameserver to give IP information about
    a host or domain.

    - This program will also allow you to to examine things like A, MX, or CNAME records.

    - When run with an option of hostname, dig will contact the local DNS host and
    return information on that host.

    - If you wanted to get more specific information about a host, you can follow
    the domain or host name with a type.

    - You can also directly request information from a remote server using dig. To
    do this, use the form dig@server domain.

    - Reverse lookups allow you to locate a domain or owner of a set of IP addresses
    from an IP address. Not all sites provide reverse lookup information, but if it
    is available, you can easily get it using dig -x ip_address.


    Notes:'
  - '[PAGE 82]


    # NFS


    +   - The Network File System (NFS) allows a server to export a directory to other
    systems.


    +   - If NFS isn''t started on bootup, start up rpc.mountd and rpc.nfsd on startup.
    This is a script in the /etc/rc.d/rc3.d directory.


    +   - The /etc/exports file lists what directories can be exported to other machines,
    which must exist before NFS can be used.


    +   - Entries in the /etc/exports file have the format directory options, where
    directory is the directory to be exported, and options are any additional options
    to work on that export.


    +   - There are many different options for controlling access to the mounted drives.


    +   - Options can be prefaced with a hostname to apply them to only that host.


    +   - Unless you have a firewall or packet filter, all NFS access will be TCP/IP-wide,
    unless you specify a host or group of hosts that can access that particular NFS
    directory.


    +   - To mount an NFS directory, use a command of the following format: # mount
    -t nfs host:/directory /mnt/directory, where host is the host machine of the NFS
    directory you wish to mount, and directory is that directory''s name.


    +   - To have directories mount automatically on startup, use linuxconf to add
    the mounts.


    +   - If the NFS server goes down, or the network connection between the client
    and server is broken, the client will appear to stop while trying to do file access.'
- md: "\n## Lesson 5.4\n## Network Information Services (NIS)\n\n- NIS is a set of\
    \ programs for managing users and various network services from one master server.\n\
    - NIS stores its information in a set of directories and GDBM (GNU Database Management)\
    \ files rooted in /var/yp. NIS refers to these files as “maps”.\n- Maps are then\
    \ made available to other machines in the NIS domain via RPC (Remote Procedure\
    \ Calls).\n- NIS also allows for secondary slave servers.\n- Each subnet should\
    \ have one (and only one) NIS server on it.\n- The NIS maps are built from the\
    \ various setup files found mostly in /etc: passwd, group, hosts, services, aliases,\
    \ and so on. It is not necessary to use every map. Often only the password and\
    \ group maps are used, since most of the other files change frequently.\n- One\
    \ of the biggest problems with NIS is the security hole opened by broadcasting\
    \ NIS requests.\n\nNotes:\n\n## LECTURE 5 NETWORKING WITH LINUX\n\n- Red Hat includes\
    \ two scripts for working in an NIS network environment: /etc/rc.d/ypbind and\
    \ /etc/rc.d/autofs. The second script is only needed if you have automount maps\
    \ in your NIS server.\n- Edit /etc/ypbind.conf file to reflect your NIS domain\
    \ settings.\n- By default, ypbbind will send an IP broadcast through the network\
    \ to find a NIS server. You can manually specify a NIS server to use. Edit the\
    \ /etc/yp.conf file and add the hostname for the server, making sure the host\
    \ is listed in /etc/hosts.\n- Make sure that the portmapper is starting. If you're\
    \ using NFS, then the portmapper is already started.\n- If not, use /etc/rc.d/init.d/portmap\
    \ start to get it started.\n- Finally, you can start ypbind: /etc/rc.d/init.d/ypbind\
    \ start.\n- The /etc/nsswitch.conf file determines the lookup order for all NIS\
    \ information (unlike /etc/host.conf, which is only for host lookups).\n- The\
    \ automounter will automatically mount partitions on NFS based on an NIS map.\
    \ The two typical maps used are auto.home and auto.vol, which mount off of /home\
    \ and /vol, respectively. You can start the Linux autofofs using the command:\n\
    \n```\n# service autofofs start.\n```\n- CD-ROMs, floppy disks, local volumes,\
    \ and NFS filesystems can be automatically mounted when the user changes to a\
    \ certain directory.\n\n## Configuring an NIS Master Server\n\n- The NIS Master\
    \ Server sits on a network and responds to NIS queries on the network.\n- There\
    \ can be only one master server per physical network.\n- You can set up slave\
    \ servers that synchronize with the master server, and reduce the load from clients.\n\
    - Slave servers can be located on separate subnets.\n- Make sure that you have\
    \ the yserv package installed.\n- Edit /var/yp/Makefile to add or remove the maps\
    \ you will be serving. The line starting with all: contains the list of maps.\n\
    - Edit /var/yp/securenets and /etc/ypserv.conf. The first defines the IPs from\
    \ which the server will answer requests. The following shows how the /var/yp/securenets\
    \ file could look.\n\nSample /var/yp/securenets\n\n```\n#\n# Sample /var/yp/securenets\n\
    #\n# Allow localhost access. This is necessary!\n# host 127.0.0.1\n\n# Allow access\
    \ from machines on the local network\n255.255.255.0 10.10.10.0\n\n# Access from\
    \ two class C networks 209.1.2.0 and 209.1.3.0\n255.255.254.0 209.1.2.0\n```\n\
    \nThe host line allows ypserv to respond to specific hosts. Since the localhost\
    \ must be able to access the server, that host is listed. Examples of allowing\
    \ subnets are on the other two example lines.\n- The /etc/ypserv.conf file lets\
    \ you customize the server's behavior at the host or network level on a per-map\
    \ basis.\n- There are two types of entries: options and access rules.\n\n## LECTURE\
    \ 5 NETWORKING WITH LINUX 81\n\n- Options have the simple format of <option>:\
    \ yes|no, i.e., the option is either on or off. An option that is commonly turned\
    \ on is dns.\n- Access rules have the format host : map : security : passwd_mangle.\
    \ Access rules are read until a match is found for the host and map being requested,\
    \ then the rule is applied.\n\nNotes:\n\n## Lesson 5.5\n## Routing with Linux\n\
    \n- Routing allows you to connect two Ethernet networks with the Linux machine\
    \ in the center.\n- To start routing with Linux, you first have to have two TCP/IP\
