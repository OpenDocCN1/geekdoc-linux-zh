    \ mode = 0666\n\n[accounting]\npath = /home/bob/shared\nvalid users = fred bob\n\
    # Only fred and bob can access this share.\npublic = no\nonly guest = no\nbrowseable\
    \ = no\nwritable = yes\ncreate mask = 0777\n```\n"
