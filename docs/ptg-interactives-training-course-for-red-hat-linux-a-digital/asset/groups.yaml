- md: "\n## LECTURE 10 X WINDOWING SYSTEM\n\n## Lesson 10.3\n\n### gdm\n\n- You can\
    \ start a graphical login using gdm, the GNOME Display manager.\n- The gdm program\
    \ is started automatically when in runlevel 5, and you can select at install time\
    \ if you want gdm started or not.\n- You can also have gdm configured to reboot\
    \ or halt the machine without requiring a user to log in.\n- If you are using\
    \ gdm on the local machine only, there is no need to configure gdm to get it to\
    \ run so long as X is already working properly.\n- The most recent version of\
    \ gdm is network aware, allowing you to have slower X clients connect to your\
    \ Red Hat server.\n- The protocol to allow you to do this is called XDMCP.\n-\
    \ If you are using gdm as an XDMCP server, you do not need to configure X on your\
    \ server. Just make sure that the applications are installed.\n- The configuration\
    \ files for gdm are located in /etc/X11/gdm, and the main configuration file is\
    \ /etc/X11/gdm/gdm.conf.\n- Edit this file, changing the following:\n- the [xdmcp]\
    \ section, change Enable=0 to Enable=1.\n- Change HonorIndirect from 0 to 1. Without\
    \ Honor-Indirect, an XDMCP client would have to know the IP address of the XDMCP\
    \ server before starting.\n- The other options under [xdmcp] are for regulating\
    \ the number of clients that are connected to the server. This is to prevent some\
    \ forms of Denial of Service attacks against your servers.\n- If you are using\
    \ gdm server only, and don't want to run X on the console, skip forward to the\
    \ [servers] section, and make sure all lines are commented out.\n- If gdm is already\
    \ running, stop and restart it by going to runlevel 3, then back to runlevel 5.\n\
    - For XDMCP clients, make sure that X works.\n- Shut down X and restart it with\
    \ the command xinit --broadcast.\n- You'll be given a list of XDMCP broadcast\
    \ servers that are available. Select one, and you'll be presented with the gdm\
    \ login screen for that host.\n- If you want to talk to a single machine, use\
    \ xinit --query hostname.\n- As a security precaution, you should block TCP/IP\
    \ port 177 at your firewall. This is the port used by gdm.\n\nNotes:\n\n## LECTURE\
    \ 10 X WINDOWING SYSTEM\n\n## Lesson 10.4\n\nUsing X Window Managers\n\n- The\
    \ window manager places a border around the window and can provide maximize and\
    \ minimize buttons; in addition, it allows you to resize, move, or kill windows.\
    \ The window manager provides for menus and the general “look and feel” of the\
    \ X display.\n- X has a clear separation between a client application like the\
    \ terminal emulator and the window manager that allows the client to be moved\
    \ and resized.\n- You can insert commands between the two parts via the desktop\
    \ environment.\n- The desktop environment gives a set of libraries that applications\
    \ can be compiled against to make writing applications easier.\n- The desktop\
    \ environment can be configured so that all applications that use the environment\
