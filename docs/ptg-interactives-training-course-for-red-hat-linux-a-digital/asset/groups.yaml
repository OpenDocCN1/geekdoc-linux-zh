  - '[PAGE 94]


    Print servers are dedicated boxes with one or two parallel ports and a 10/100
    Ethernet connection that cost about $100US. Print servers usually have support
    for LPD and come with drivers that support Windows printing over the network.


    +   - For ease of use, you should configure a Linux box as a central place for
    print requests to go. Configure this box to accept print requests via LPR, IPP
    (CUPS), and SMB printing from Windows machines. You can then have this machine
    talk to the print server.


    # Notes:'
  - "[PAGE 95]\n\n# Lesson 6.3\n\n# Configuring LPRng\n\n+   - Red Hat Linux uses\
    \ LPRng, which is the next generation of the Line Printer Daemon.\n  - The initial\
    \ versions of LPR had little or no support for authentication, load balancing,\
    \ and failover. LPRng adds this support while being lightweight enough to not\
    \ consume too many resources.\n- The main access to configuration of printers\
    \ is through **printconf**. This application only works if you have a graphical\
    \ window working already.\n  - When you start **printconf**, you will get a list\
    \ of printers that the local system knows about. If this is the first time you\
    \ have run it, there will be no printers listed.\n- The interface makes it easy\
    \ to add printers.\n\nNotes:"
  - '[PAGE 96]


    # LECTURE 6 PRINTING AND PRINT SHARING 91


    # Managing Print Queues


    +   * Print queues are FIFO (First In First Out), so the first one in line gets
    to have access to the printer.


    +   * The commands you will want to know about to manage the print queues are
    `lpc`, `lprm`, and `lpq`.


    +   - The `lpq` command shows what is in the queue and gives the current status
    of the printer; some printers will be able to tell `lpd` that they are out of
    paper or that the connection is down, and these errors will show up in the `lpq`
    listing.


    +   - The `lprm` command will remove jobs from the queue.


    +   ✧ By default, only root and the person who submitted the print job can remove
    a job from the queue.


    +   ✧ Most printers have an internal buffer, so removing the job if it is already
    printing may not cause the printer to immediately stop.


    +   - The `lpc` command is the “lpc control.” It can activate and deactivate queues
    and printers, rearrange jobs in the queue, and get a status of any printer listed
    in `/etc/printcap`.


    +   ✧ `lpc` can be run interactively, or you can put the commands directly on
    the `lpc` command line.


    Notes:'
  - '[PAGE 97]


    # Printers on the Network!


    +   * Since Linux supports both lpd and SMB for print sharing, most computers
    on your network will be able to print to your printer with little trouble.


    +   * When talking over the network to LPRng, you should have drivers for printers
    loaded on the client side before you start up.


    +   * Print jobs that come from the network get passed to the printer port directly
    without being processed by the local print drivers.


    Notes:'
  - "[PAGE 98]\n\n# LECTURE 6 PRINTING and PRINT SHARING\n\n# Access from Other LPD\
    \ (UNIX) Systems\n\n+   - To permit access from specified hosts with LPRng, create\
    \ a list of users and hosts allowed to submit jobs, delete jobs, and manage printers.\n\
    — The control file is located in /etc/lpd.perms.\n— By default, any user on any\
    \ host can submit jobs, only the user or root can remove jobs, and anyone can\
    \ get queue status, with root being able to control print queues.\n- To prevent\
    \ malicious outside outside of your printers, be sure that TCP/IP port 515 is\
    \ blocked at your firewall and configure /etc/lpd.perms to accept jobs only from\
    \ hosts or users you specify.\n— The /etc/lpd.perms file contains a few samples\
    \ for access control:\n\n```\n# REJECT SERVICE=X NOT REMOTEIP=130.191.0.0/255.255.0.0\n\
    # REJECT SERVICE=X NOT REMOTEHOST=engpc\n```\n\n+   - These lines show two methods\
    \ of blocking remote hosts.\n    - The first line rejects IP addresses that are\
    \ not in the 130.191 network.\n    - The second line rejects hosts that start\
    \ with “engpc”.\n    - If two reject statements were activated, only machine names\
    \ that start with “engpc” and have IP addresses starting with 130.191 would be\
    \ able to connect.\n\n+   - Once you have made the changes to /etc/lpd.conf, restart\
    \ LPRng using service lpd restart as the root user.\n- If you want to talk to\
    \ a printer that exists on the network and is compatible with the LPD protocol,\
    \ enter the IP address and type of printer to printconf."
  - '[PAGE 99]


    # Access via SMB (Windows Networking)


    +   - The best way to get a Linux printer seen on a Windows network is to run
    Samba.

    - Samba should be configured to use the /etc/printcap file and BSD-style printing.

    - Be sure to install a print driver under Windows for the kind of printer you
    have installed, as the print filter on Linux should just pass the data along to
    the printer.

    - Windows NT and 2000 can handle serving and printing via LPD, so you may want
    to use it instead.


    Notes:'
  - '[PAGE 100]


    # LECTURE 6 PRINTING AND PRINT SHARING


    # Lesson 6.4


    # CUPS


    +   - CUPS (the Common UNIX Printing System) is not a part of Red Hat Linux, and
    it is more complicated for new users to set up.

    - CUPS has some advantages that may make it worth using instead of LPRng.

    - CUPS includes a web interface, browsing for printers within a network, and password
    security and auditing for users who access a printer.

    - The GPL version of CUPS only supports HP printers and some dot matrix and inkjet
    printers.

    - The gimp-print package adds drivers to CUPS and allows you to use most printers
    with CUPS for free.

    - CUPS is available at http://www.cups.org, and gimp-print can be picked up at
    http://gimp-print.sourceforge.net/.

    - Download and install CUPS and gimp-print according to their directions.

    - CUPS is designed to act as a print client, server, or both.

    - In the case of a client, print jobs will be sent to a remote server and not
    queued locally.

    - A server queues print jobs locally and sends them to the printer or another
    server when it is ready.

    - It is advisable to run both the client and server, since queuing locally allows
    you to print jobs even if the printer is not available.'
  - '[PAGE 101]


    # CUPS Client Configuration


    +   - Edit the /etc/cups/client.conf and add a line like Server-Name server


    +   - All jobs will then be sent to server.


    Notes:'
  - '[PAGE 102]


    # CUPS Server Configuration


    +   - Most of the configuration can be done from the web page.

    - By default, only the root user on the local machine can connect and manage printers
    and queues.

    - Anyone on the local machine can submit jobs or see the status of printers.

    - The configuration file for the CUPS server (called cupsd) is located in /etc/cups/cupsd.conf.

    - To allow other hosts to print to the CUPS server, look for lines like the following:


    ```

    <Location />

    Order Deny,Allow

    Deny From All

    Allow From 127.0.0.1

    </Location>

    ```


    After the “Allow” line, you can add lines with any of the following formats:


    ```

    Allow From 192.168.1.*

    Allow From 192.168.1.0/255.255.255

    Allow From .wayga.org

    ```


    +   - In the first line, any host with an IP address starting with “192.168.1.”
    is given access.

    - In the second line, any host in the 192.168.1. network is given access.

    - The third line only works if “HostNameLookups” is set to On; it allows any host
    with a name in the wayga.org domain access.

    - This access gives any host in the domain access to submit or view print jobs.
    The root user can connect and change printer settings, but any local user that
    is in the ipadmin group can also add, delete, and modify printers.

    - Note that usernames and passwords are sent in the clear when talking to the
    web server. This method should never be used over an insecure network.'
  - '[PAGE 103]


    To add a printer using the web interface, select “printers” from the top of the
    page.


    Select “add printer”. You will be asked to authenticate as either the root user
    or a user that is a member of the lpadmin group.


    Once authenticated, you will go through a printer setup wizard to configure the
    printer.


    With that, the printer is now set up. You can now send print jobs to the printer
    from this machine or remote machines that support IPP.


    There are few applications that you can use to pass configuration information
    to CUPS each time you submit a print job; one of these is xpp.


    +   - From a program like Mozilla that gives you the option of a command to use,
    use xpp instead of lp or lpr.


    +   - When you print, xpp will get the print job, then pop up a menu of available
    printers.


    +   - You can select a printer to send the job to along with changing print settings
    for this job. A text-only print job can be submitted with low print quality, while
    a digital image can be printed with higher resolution.


    +   - You can get a copy of xpp at http://cups.sourceforge.net/xpp/.


