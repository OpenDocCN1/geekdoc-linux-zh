    \ be only one WINS server per subnet.\n"
  mdcn: "\n\n# 红帽 Linux 培训课程手册\n\n- 启动后，转到 SMB 客户端并进行网络浏览。你应该能从机器列表中看到你的 Linux 机器。\n\
    \n- 如果没有，你可以检查位于 /var/log 目录下的日志。每个客户端机器、samba 进程和 nmb 进程都有它们自己的日志文件（samba-log.machineame、samba-log.smb\
    \ 和 samba-log.nmb）。\n\n- 如果你在浏览列表中看到了 Linux 机器，那么你需要连接到一个共享目录。\n\n- 公有连接（Public\
    \ connections）不需要有效的登录，是测试工作情况的一种简单方法。这类连接很容易建立，但安全性很低。\n\n- 如果你选择执行这样做，请在共享的配置中设置\
    \ `public=yes` 选项。\n\n- 有三种方法可以验证用户以访问非公有连接。\n\n- 第一种是 `user`，在 `/etc/passwd`\
    \ 中对用户名和密码进行验证。这种连接方法要求 Linux 上的用户名与 SMB 客户端匹配。\n\n- 第二种方法是将认证请求转发到另一台服务器。这被称为服务器认证，你必须信任你转发请求的这台机器。\n\
    \n- 第三种认证方法称为 `share`，它不需要 Linux 上的用户名与 SMB 客户端匹配。\n\n- SMB 允许使用加密和未加密的密码。\n\n\
    - 加密密码增加了安全性，但由于它是使用单向哈希进行加密的，这与 `/etc/passwd` 中存储密码的方式不兼容。\n\n- NT 4 Service\
    \ Pack 3、Windows 98 以及 Windows 2000 及更高版本默认发送加密密码，调整此设置唯一方法是在注册表（Registry）中。\n\
    \n- 有两种更好的方法来处理这个问题。\n\n- 如果你有一个有的 PDC（主域控制器），请设置 Linux 机器将密码转发给 PDC。\n  - 通过将\
    \ `password server` 指向 PDC 并设置 `security=user` 来实现（这两个设置都在 `[Global]` 下）。\n\n\
    # 第 7 节 SAMBA\n\n如果你没有 PDC，请设置 Linux 机器来处理加密密码。阅读 `/usr/doc/samba*/ENCRYPTION.txt`\
    \ 文件以了解处理加密密码时需要执行的操作。\n\n- 设置你的 Samba 实例以原生处理加密密码，你需要创建一个存储 SMB 密码的第二个密码文件。\n\
    \n- 将其命名为 `/etc/smbpasswd`，这是 Samba 的默认文件。\n\n- 你可以使用随 samba RPM 提供的 `mksmbpasswd.sh`\
    \ 程序来协助此类转换：\n\n```bash\n# cat /etc/smbpasswd | /usr/bin/mksmbpasswd.sh = /etc/smbpasswd\n\
    ```\n\n- 该文件将包含如下所示的行：mkomarin-ski:500:XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX:[U:LCT-00000000:mkomarinski\n\
    \n- SMB 密码长度恰好为 32 字节（因此有 32 个 X）。\n\n- 默认情况下，这些 X 会禁用访问，在任何人可以使用之前必须更改密码条目，可以通过两种方式完成：\n\
    \n- 第一种是将第一组的前 11 个 X 替换为字符串 `NO PASSWORD`。\n\n- 如果你这样做，请在 `/etc/samba/smb.conf`\
    \ 中启用 `null passwords=true` 选项。\n\n- 另一种方法是使用 `smbpasswd` 为用户设置一个临时密码。\n\n- 一旦设置了密码且最初需要\
    \ root 权限访问，请告诉用户该密码是什么，然后使用 `smbpasswd` 命令将其更改以符合其需求。\n\n- 你可能想要考虑的一个选项是“sync\
    \ unix passwd”，它位于 `Globals` 下的 `SWAT`。将其设置为 `Yes` 将在用户下次更改密码时同步 UNIX 密码文件和 `smbpasswd`\
    \ 文件。\n\n- 此外，“Encrypt Passwords” 选项默认设置为 `No`。你需要将其设置为 `Yes` 以让 Samba 开始使用 `/etc/smbpasswd`。\n\
    \n#  7.3 \n\n## 连接到 SMB 共享\n\n- Linux 有一个虚拟文件系统 (VFS)，它为挂载文件系统提供通用接口。\n\n- 我们不使用\
    \ `mount`，而是使用 `smbmount`（它是 Samba-client 包的一部分）来挂载 SMB 共享。\n\n```bash\n# smbmount\
    \ service\nmount-point options\n```\n\n- `service` 是你想要的 SMB 共享的 NetBIOS 名称，将\
    \ `\\` 替换为 `/`。\n\n- `mount-point` 是 Linux 层级结构中的本地挂载点。\n\n- 由于你必须以 root 身份使用\
    \ `smbmount`，而你的 NT 服务器上可能没有 root 用户，因此你需要利用选项 `-U` 指定用户进行验证，并使用 `-c` 列出你客户端的\
    \ NetBIOS 名称；否则将发送的是 FQDN（完全限定域名）。\n\n- `client.domain.org`（无论 FQDN 是什么）都不是有效的\
    \ NetBIOS 名称，添加 `-c client` 告诉服务器客户端的名字只是 `client`。\n\n- 如果客户端的 NetBIOS 名称无法解析，则无法连接。\n\
    \n# 第 7 节 SAMBA\n\n# 7.4\n\n## Samba Web 管理工具 (SWAT)\n\n- SWAT 是一个用于远程管理 Samba\
    \ 配置的 Web 界面。\n\n  - 由于你必须以 root 身份使用 `smbmount`，而你的 NT 服务器上可能没有 root 用户，因此你需要利用选项\
    \ `-U` 指定用户进行验证，并使用 `-c` 列出你客户端的 NetBIOS 名称；否则将发送的是 FQDN。\n\n  - `client.domain.org`（无论\
    \ FQDN 是什么）都不是有效的 NetBIOS 名称，添加 `-c client` 告诉服务器客户端的名字只是 `client`。\n\n  - 如果客户端的\
    \ NetBIOS 名称无法解析，则无法连接。\n\n# 第 7 节 SAMBA\n\n# 7.4\n\n## Samba Web 管理工具 (SWAT)\n\
    \n- SWAT 是一个用于远程管理 Samba 配置的 Web 界面。\n\n  - 由于你必须以 root 身份使用 `smbmount`，而你的 NT\
    \ 服务器上可能没有 root 用户，因此你需要利用选项 `-U` 指定用户进行验证，并使用 `-c` 列出你客户端的 NetBIOS 名称；否则将发送的是\
    \ FQDN。\n\n  - `client.domain.org`（无论 FQDN 是什么）都不是有效的 NetBIOS 名称，添加 `-c client`\
    \ 告诉服务器客户端的名字只是 `client`。\n\n  - 如果客户端的 NetBIOS 名称无法解析，则无法连接。\n\n"
