  - '[PAGE 137]


    # GNU Privacy Guard (GPG)


    +   - The GNU Privacy Guard (GPG) is designed as a replacement for the commercial
    PGP.

    - Cryptography serves a similar purpose to the envelope of a letter—it''s the
    envelope for your e-mail and other personal files.

    - As an added benefit, GPG can allow others to authenticate that you actually
    sent an e-mail instead of an impostor.

    - GPG has been designed to be free of patent restrictions, making it suitable
    for anyone to download. You can get the latest copy in RPM format from `http://www.gnupg.org/`.

    - Once you have the RPM downloaded and installed, you can generate your secret/public
    key pair.

    - To generate your public/private key pair, use `gpg --gen-key`. You will need
    to run it twice, the first time `gpg` copies files into your `.gnupg` directory.
    The second time you run it, you will be allowed to create your key.

    - First, select the kind of key you want. You can sign, encrypt, or other.

    - Next you''re asked for a bit length. This is the strength of the key, with lower
    numbers being weaker and larger numbers being stronger.

    - You can then set an expire time on your key. This allows you to expire keys
    much like you would a password. After the time has passed, you have to generate
    a new key and distribute the public section to your friends again.

    - Next you''re asked for your real name, then your e-mail address, followed by
    a comment. A comment is the name that shows up on your key that you give to friends.

    - Next you''re asked for a passphrase.

    - After a bit of processing, you will have your very own GPG key, suitable for
    signing e-mails or encrypting files.

    - You can sign a file using `gpg --clearsign filename`. A result file created
    with a `.asc` extension is created that contains the original file with its digital
    signature.

    - Before you can have others verify your signature, you need to distribute your
    public key. Make sure it''s in a way that the recipients know that the public
    key came from you.'
- md: '

    ## LECTURE 8 E-MAIL


    - The gpg -export -armor command will extract your public key to the screen. You
    can enter a filename to have the key sent there.

    - You can then send this public key to your friends.

    - Once they get it, they have to import the key with gpg -import filename.

    - They have to sign it, which verifies that they know the key came from a reputable
    source, with gpg -edit-key command.

    - With the key signed by your friends, you can then send the file containing a
    digital signature.

    - The recipient can then just send the file with the signature in it to the gpg
    command. They will then be told if the digital signature, contents of the message,
    and your key all match.

    - You can encrypt files such that only the recipient can open the file. To do
    this, you need to have the recipient''s public key first.

    - You can encrypt a file example using the command


    ```bash

    $ gpg -output example.gpg -encrypt -armor

    -recipient markk@wayga.org example

    ```


    - The resulting file, example.gpg, can only be read by the person that has the
    secret key for markk@wayga.com.

    - You can then e-mail him the resulting file. He will take the contents of the
    e-mail message and run it through the decryption process:


    ```bash

    $ gpg -decrypt example.gpg

    ```


    - And the contents of the file will be printed.

    - You can find out more about key servers, key management, validating keys, fingerprints,
    and many other concepts from the GNU Privacy web site at http://www.gnupg.org.


    ## Lesson 8.6


    ## Summary


    - sendmail is the default way of sending e-mail.

    - Aliases, .forward, and procmail can change the destination of incoming e-mail.

    - mailman allows you to quickly set up a mailing list.

    - POP and IMAP allow you to get your e-mail from remote locations.


    Notes:


    ## Lecture 9


    ### Web Servers


    **Objectives**


    - Install and Configure Apache Web Server

    - Set Up Some Security for User Access

    - Configure and Test the PHP Interpreter for Apache

    - Set Up an SSL-Enabled Server for Security


    ## Lesson 9.1


    ### Apache


    - Apache is freely available with source code and provides an API. These two features
    allow for a great deal of customization and extensibility.

    - Additionally, Apache is HTTP 1.1-compliant.

    - Reports from netcraft.com, the authoritative site for web server usage, indicate
    that Apache and its derivatives run more than 60% of all the web servers in the
    world.

    - You can add new modules to Apache without taking the server down for a long
    time. Red Hat has compiled many common modules and has included them on the CD
    as RPM packages ready to add to your system.


    Notes:


    ## LECTURE 9 WEB SERVERS


    ### Getting Started


    - There are a few things you need to consider before setting up your web server.

    - Where are the web files to be located? By default, Red Hat Linux uses /var/www/html.

    - Where are the configuration files? In a Red Hat setup, /etc/httpd/conf is the
    location of the configuration files.

    - Do you want to have a SSL server? Adding SSL prevents others from snooping into
    the contents of the page, increasing security.

    - What extra functionality do you need? If you want to use SSL or the Perl or
    PHP languages in your server, you will have to add the RPMs to your system before
    continuing.

    - There are many items that can be specified at run-time in the .conf files, httpd.conf
    and srm.conf. These two files control parameters, such as aliases for directories,
    aliases for icons, images, CGI scripts/programs, virtual host directives, the
    document root directory, the file to be served from a directory if no other file
    is specified in the URL, and various access control and authentication directives.


    Notes:


    ## Configuring Apache


    ### Web Pages for Your Users


    - By default, pages for particular users are located under the `public_html/`
    directory of the user''s home directory.

    - In some situations, this can cause a security problem, as other users can see
    the files (but not the contents) of other users.

    - To avoid this, set the properties of the user''s home directory to be executable,
    but not readable, which would make an octal value of 0711.

    - Set the `public_html/` directory to be world readable and executable, which
    would be 0755. The web server can then access the contents of `public_html` without
    knowing the other contents of the home directory.

    - To change the UserDir directive for users to access these files, you can change
    the directive in `/etc/httpd/httpd.conf` to whatever you like. It is set to `public_html`
    by default.

    - Some users will likely be interested in setting up a home page for themselves.

    - Serving static HTML pages poses no security concerns beyond those of the server
    itself.

    - This is not necessarily true of CGI and other web technologies.

    - The `.htaccess` file and `<Directory>` directives in Apache allow you to control
    access to these kinds of tools.


    ### Configuring Virtual Servers


    - Virtual servers are servers that have multiple names or IP addresses. The server
    is sent a name of the virtual server that is trying to be contacted, reads it,
    then is able to serve the correct page based on the virtual server the browser
    thinks it is looking at, all while using a single real IP address.

    - A server for `http://www.wayga.com` on port 80 with its own cgi-bin and document
    root is:


    ```apache

    <VirtualHost www.wayga.com>

    ServerName www.wayga.com

    DocumentRoot /var/www/waygacom/html

    ScriptAlias cgi-bin/ /var/www/waygacom/cgi-bin/

    </VirtualHost>

    ```


    - You would probably want to set the "DocumentRoot" for wayga.org to be something
    like "/var/www/waygaorg/html" and also set "ScriptAlias" the same way.


    ### Access Restrictions


    - There are two ways to modify access of all types for directory trees.

    - <Directory> directives typically reside in the /etc/httpd/conf/httpd.conf file.

    - The .htaccess file resides in the directory tree of HTML documents.

    - In both instances, directives placed in the directories are recursively effective
    for all the files and subdirectories.


    ```apache

    Example: Enforcing security on directories

    AuthType Basic

    UserFile /var/www/etc/passwd

    AuthGroupFile /dev/null

    AuthName Realm of Kazoos

    <LIMIT> GET POST PUT

    require valid-user

    </LIMIT>


    or in a <Directory> directive:


    <Directory /var/www/html/secure>

    AuthType Basic

    UserFile /var/www/etc/passwd

    AuthGroupFile /dev/null

    AuthName Realm of Kazoos

    <LIMIT> GET POST PUT

    require valid-user

    </LIMIT>

    </Directory>

    ```


    - The <LIMIT> directive tells the server what HTTP methods require a valid user.

    - The password file contains the username, colon, and an encrypted password. The
    password is in crypt format, and you can create and add users using the passwd
    command with Apache.


    ```bash

    passwd [-c] [-m] [-b] {passwdfile} {username} [password (if -b is used)]

    ```


    - The -c option will create a new password file (called passwordfile).

    - The -m option forces MD5 encryption of the password instead of the standard
    crypt encryption.

    - MD5 is much more secure, but you will need to change the “AutType Basic” line
    to read "AuthType Digest".

    - The -b option reads a password from the command line, otherwise, you will be
    prompted for a password for username.

    - You must have write access to the file or location where password-file is to
    be located or updated, and only the owner and web server should have read access
    to the file.

    - There are additional modules for Apache that allow you to authenticate in other
    ways, from using SMB passwords on an NT server to the local /etc/passwd to one
    time passwords.

    - These may allow passwords to transmit in the clear between client and server.


    Notes:


    ## LECTURE 9 WEB SERVERS


    ### Lesson 9.2


    ### CGI


    - The Common Gateway Interface (CGI) is the best way to execute external programs.

    - CGI is designed to both receive and send information from and to the server.

    - The most popular languages for writing CGI are PHP, Python, and Perl. You can
    write CGI in any language you want, hence the “Common” part of CGI.


