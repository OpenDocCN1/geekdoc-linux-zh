- md: "\n# LECTURE 8 E-MAIL\n\n## Mailman\n\n- The mailman program is becoming the\
    \ standard for mailing lists in Linux.\n- mailman handles much of its functionality\
    \ through the web server.\n- You can get the Mailman RPM from the Powertools CD\
    \ or from Red Hat's FTP site.\n- Download and install the Mailman RPM, which will\
    \ perform much of the installation for you.\n- There are a few extra actions you\
    \ must take before you start using mailman on your system.\n- The first thing\
    \ you must do is configure the administrator password for mailman. This allows\
    \ you to manage the entire system from the web site.\n- Next, edit /var/mailman/Mailman/mm_cfg.py.\
    \ You will only need to edit the DEFAULT_HOST_NAME and DEFAULT_URL to be your\
    \ local machine, which would look something like this:\n\n```\nDEFAULT_HOST_NAME\
    \ = 'wayga.org'\nDEFAULT_URL      = 'http://wayga.org/mailman/'\n```\n\n- Check\
    \ /etc/sysconfig/sendmail and make sure that DAEMON is set to yes.\n- Finally,\
    \ you will need to configure and restart your web server.\n- Edit /etc/httpd/conf/httpd.conf\
    \ and add this at the end of the file:\n\n```\nScriptAlias /mailman/ /var/mailman/cgi-bin/\n\
    Alias /pipermail/ /var/mailman/archives/public/\n<Directory /var/mailman/archives>\n\
    \  Options +FollowSymlinks\n</Directory>\n```\n\n- The applications for configuring\
    \ mailman are located at /var/mailman/bin.\n- To create a new list, run /var/mailman/bin/newlist\n\
    \nnewlist example:\n\n```\n[root@hudson mkomarinski]# /var/mailman/bin/newlist\n\
    Enter the name of the list: test\n```\n\nEnter the email of the person running\
    \ the list:\nmkomarinski@wayga.org\nInitial test password:\nEntry for aliases\
    \ file:\n\n```\n# test mailing list\n# created: 13-Aug-2001 mkomarinski\ntest:\
    \ \"/var/mailman/mail/wrapper post test\"\ntest-admin: \"/var/mailman/mail/wrapper\
    \ mailowner\"\ntest-request: \"/var/mailman/mail/wrapper mailcmd test\"\ntest-owner:\
    \ test-admin\n```\n\nHit enter to continue with test owner notification...\n[root@hudson\
    \ mkomarinski]#\n\n- Take the part indicated (namely, the lines that start with\
    \ test) and copy it into /etc/aliases.\n\nNotes:\n\n## Lesson 8.4 \n\n### Remote\
    \ E-mail (POP and IMAP)\n\n- POP (Post Office Protocol) and IMAP (Internet Message\
    \ Access Protocol) are the two standards for receiving e-mail from a remote machine.\n\
    - Each protocol has strengths, weaknesses, and assorted Mail User Agents (MUAs)\
    \ that support them.\n- Both are available in a Red Hat install setup ready to\
    \ run.\n- Authentication of e-mail is done by the same PAM scheme that is used\
    \ to log in.\n- One of the advantages of using POP or IMAP is that little user\
    \ setup is required.\n\nNotes:\n\n### POP\n\n- POP is rather simple. You can get,\
    \ list, and delete mail, and that's it.\n- The downside to POP is that the e-mail\
    \ on the server is often deleted once it is sent to you.\n- Netscape, Outlook,\
    \ and most PC-based Internet e-mail programs handle POP.\n- Due to its easy implementation,\
    \ POP support in clients is much more prevalent than IMAP.\n- The POP server (popper)\
    \ is included in a typical Red Hat distribution.\n- To use it, configure the client\
    \ software so that the server matches the Linux box. The username and password\
    \ are the same as in /etc/passwd.\n- Remember that any e-mail downloaded gets\
    \ stored on the local machine. One option to look at is the “Don't delete from\
    \ server” option.\n- If you have two locations where you want to read your e-mail\
    \ from (work and home), you can leave this option off on the office e-mail system\
    \ and turn it on at home. This way, all your e-mail gets downloaded at work, and\
    \ you can only get new e-mail from home.\n- However, IMAP is a much better solution\
    \ to this problem.\n\nNotes:\n\n### IMAP\n\n- IMAP is somewhat more complex than\
    \ POP but has several advantages.\n- All e-mail will be backed up with the server.\n\
    - IMAP can be accessed from anywhere, without any special preparations.\n- IMAP\
    \ is also lightweight; large attachments are replaced by small headers describing\
    \ the sender, type, and size of the files. The entire-attachment is only downloaded\
    \ if the user requests it.\n- E-mail can be stored in different files (often called\
    \ folders).\n- These folders remain on the server side and can be accessed by\
    \ the client software at any time.\n- Another big feature of IMAP is disconnected\
    \ mode.\n- If the client supports it, you can have the client download one or\
    \ more folders to your local machine. You can read, modify, delete, reply, and\
    \ so on without being connected to a network.\n- The IMAP server is included with\
    \ Red Hat in the imap-4.5 RPM and is configured to get files from /var/spool/mail.\n\
    - Client setup requires you to set the server name and the username/password.\n\
    - One option that you will need to look at is the server directory option, which\
    \ tells the client what directory on the server contains the mail folders. If\
    \ the user shares home directories via Samba or NFS, you'll want to change the\
    \ server directory to something like ~user/Mail.\n- The downside is that you have\
    \ to set it each time you configure someone for IMAP.\n- The benefit is that your\
    \ users won't confuse their e-mail with their regular files.\n- By default, mbox\
    \ (mail that was read and not put in another mail folder) is stored in ~user/mbox,\
    \ which is actually the same file used by the UNIX mail program.\n- New mail is\
    \ checked for in /var/spool/mail.\n- If you need to change this, you'll have to\
    \ recompile the software.\n\n### SSL with IMAP and POP\n\n- To get IMAP over SSL\
    \ working, you need to have the OpenSSL packages and IMAP server packages installed.\n\
    - The IMAP server that ships with Red Hat 7.1 comes bundled with IMAP over SSL\
    \ support.\n- Generate an SSL key that will work with the IMAP server.\n- Go to\
    \ /usr/share/ssl/certs and run make imapd.pem.\n- The most important question\
    \ you have to look at is the one regarding your common name. This must be set\
    \ to the FQDN of the host to which users will be connecting.\n\nNotes:\n\n## Lesson\
    \ 8.5\n\n### E-mail clients\n\n- There are a variety of e-mail clients available\
    \ for Linux.\n- The choice of which to use comes down to personal preference.\n\
    - Some use the Emacs editor, others use mutt or pine, which run only in character\
    \ mode.\n- Netscape and Mozilla provide readers that allow for graphical and HTML\
    \ attachments, and support encrypted IMAP and POP all over SSL.\n\nNotes:\n\n\
    ### GNU Privacy Guard (GPG)\n\n- The GNU Privacy Guard (GPG) is designed as a\
    \ replacement for the commercial PGP.\n- Cryptography serves a similar purpose\
    \ to the envelope—it's the envelope for e-mail and other files.\n- As an added\
    \ benefit, GPG can allow others to authenticate that you actually sent an e-mail\
    \ instead of an impostor.\n- GPG has been designed to be free of patent restrictions,\
    \ making it suitable for anyone to download. You can get the latest copy in RPM\
    \ format from http://www.gnupg.org/.\n- Once you have the RPM downloaded and installed,\
    \ you can generate your secret/public key pair.\n- To generate your public/private\
    \ key pair, use `gpg --gen-key`. You will need to run it twice, the first time\
    \ `gpg` copies files into your `.gnupg` directory. The second time you run it,\
    \ you will be allowed to create your key.\n- First, select the kind of key you\
    \ want. You can sign, encrypt, or other.\n- Next you're asked for a bit length.\
    \ This is the strength of the key, with lower numbers being weaker and larger\
    \ numbers being stronger.\n- You can then set an expire time on your key. This\
    \ allows you to expire keys much like you would a password. After the time has\
    \ passed, you have to generate a new key and distribute the public section to\
    \ your friends again.\n- Next you're asked for your real name, then your e-mail\
    \ address, followed by a comment. A comment is the name that shows up on your\
    \ key that you give to friends.\n- Next you're asked for a passphrase.\n- After\
    \ a bit of processing, you will have your very own GPG key, suitable for signing\
    \ e-mails or encrypting files.\n- You can sign a file using `gpg --clearsign filename`.\
    \ A result file created with a `.asc` extension is created that contains the original\
    \ file with its digital signature.\n- Before you can have others verify your signature,\
    \ you need to distribute your public key. Make sure it's in a way that the recipients\
    \ know that the public key came from you.\n"
  mdcn: "\n\n# 第 8 课 电子邮件\n\n## Mailman\n\n- mailman 程序正成为 Linux 邮件列表的标准工具。\n- mailman\
    \ 的大部分功能通过 Web 服务器处理。\n- 你可以从 Powertools CD 或 Red Hat 的 FTP 站点获取 Mailman RPM。\n\
    - 下载并安装 Mailman RPM，它将替你完成大部分安装工作。\n- 在系统上开始使用 mailman 之前，你还必须执行一些额外操作。\n- 你必须执行的第一件事是为\
    \ mailman 配置管理员密码。这允许你从网站管理整个系统。\n- 接下来，编辑 `/var/mailman/Mailman/mm_cfg.py`。你只需要将\
    \ `DEFAULT_HOST_NAME` 和 `DEFAULT_URL` 修改为你的本地机器，看起来如下所示：\n\n```\nDEFAULT_HOST_NAME\
    \ = 'wayga.org'\nDEFAULT_URL      = 'http://wayga.org/mailman/'\n```\n\n- 检查 `/etc/sysconfig/sendmail`\
    \ 并确保 `DAEMON` 被设置为 `yes`。\n- 最后，你需要配置并重启你的 Web 服务器。\n- 编辑 `/etc/httpd/conf/httpd.conf`\
    \ 文件末尾添加以下内容：\n\n```\nScriptAlias /mailman/ /var/mailman/cgi-bin/\nAlias /pipermail/\
    \ /var/mailman/archives/public/\n<Directory /var/mailman/archives>\n  Options\
    \ +FollowSymlinks\n</Directory>\n```\n\n- 配置 mailman 的应用程序位于 `/var/mailman/bin`。\n\
    - 创建新列表，运行 `/var/mailman/bin/newlist`\n\nnewlist 示例：\n\n```\n[root@hudson mkomarinski]#\
    \ /var/mailman/bin/newlist\nEnter the name of the list: test\n```\n\n输入运行列表的邮箱：\n\
    mkomarinski@wayga.org\n初始测试密码：\nEntry for aliases file:\n\n```\n# test mailing\
    \ list\n# created: 13-Aug-2001 mkomarinski\ntest: \"/var/mailman/mail/wrapper\
    \ post test\"\ntest-admin: \"/var/mailman/mail/wrapper mailowner\"\ntest-request:\
    \ \"/var/mailman/mail/wrapper mailcmd test\"\ntest-owner: test-admin\n```\n\n\
    按回车继续测试所有者通知...\n[root@hudson mkomarinski]#\n\n- 提取指定的部分（即以 test 开头的行）并将其复制到 `/etc/aliases`\
    \ 中。\n\n备注：\n\n## 第 8.4 节 \n\n### 远程电子邮件 (POP 和 IMAP)\n\n- POP（邮局局递协议）和 IMAP（互联网消息访问协议）是从远程机器接收电子邮件的两种标准。\n\
    - 每个协议都有其优缺点，以及支持它们的各种邮件用户代理 (MUA)。\n- Red Hat 安装设置环境中已提供这两个协议并可以直接运行。\n- 电子邮件的身份验证通过与登录相同的\
    \ PAM 方案完成。\n- 使用 POP 或 IMAP 的优势之一是用户设置非常少。\n\n备注：\n\n### POP\n\n- POP 非常简单。你可以获取、列出和删除邮件，仅此而已。\n\
    - POP 的缺点是，一旦邮件发送给你，服务器上的邮件通常会被删除。\n- Netscape、Outlook 以及大多数基于 PC 的网络电子邮件程序都处理\
    \ POP。\n- 由于实现简单，客户端对 POP 支持比 IMAP 普及得多。\n- POP 服务器 (popper) 包含在典型的 Red Hat 发行版中。\n\
    - 要使用它，请配置客户端使服务器与 Linux 机器匹配。用户名和密码与 `/etc/passwd` 中的相同。\n- 记住任何下载的电子邮件都会存储在本地机器上。可以考虑的选项是“不要从服务器删除\
    \ (Don't delete from server)”。\n- 如果你有两个想要读取邮件的地方（公司和家里），你可以在办公室邮件系统上关闭此选项，而在家里开启它。这样，你所有的邮件在工作时都会下载，而你只能在家里获取新邮件。\n\
    - 然而，IMAP 是解决此问题的更好方案。\n\n备注：\n\n### IMAP\n\n- IMAP 比 POP 稍微复杂，但具有许多优势。\n- 所有电子邮件都将在服务器上进行备份。\n\
    - 可以从任何地方访问 IMAP，无需任何特殊准备。\n- IMAP 也是轻量级的；大型附件会被替换为描述发送者、类型和文件大小的小标头。只有当用户请求时，才会下载整个附件。\n\
    - 电子邮件可以存储在不同的文件中（通常称为文件夹）。\n- 这些文件夹保留在服务器端，客户端软件可以随时访问。\n- IMAP 的另一个大功能是离线模式。\n\
    - 如果客户端支持，你可以让客户端将一个或多个文件夹下载到本地机器。你可以在不连接网络的情况下读取、修改、删除、回复等。\n- IMAP 服务器包含在 Red\
    \ Hat 的 `imap-4.5` RPM 软件包中，并配置为从 `/var/spool/mail` 获取文件。\n- 客户端设置需要你设置服务器名称和用户名/密码。\n\
    - 你需要查看的选项之一是服务器目录选项，它告诉客户端服务器上的哪个目录包含邮件文件夹。如果用户通过 Samba 或 NFS 共享家目录，你可能需要将服务器目录更改为类似\
    \ `~user/Mail` 之类的。\n- 缺点是，你每次为某人配置 IMAP 都必须设置它。\n- 优点是你的用户不会将电子邮件与普通文件混淆。\n-\
    \ 默认情况下，mbox（已读但未放入其他邮件文件夹的邮件）存储在 `~user/mbox`，这实际上是 UNIX 邮件程序使用的同一个文件。\n- 新邮件会在\
    \ `/var/spool/mail` 中检查。\n- 如果你需要更改此项，将必须重新编译软件。\n\n### 带有 IMAP 和 POP 的 SSL\n\n\
    - 要让通过 SSL 的 IMAP 工作，你需要安装 OpenSSL 软件包和 IMAP 服务器软件包。\n- Red Hat 7.1 附带的 IMAP 服务器带有\
    \ SSL IMAP 的支持。\n- 生成一个与 IMAP 服务器兼容的 SSL 密钥。\n- 进入 `/usr/share/ssl/certs` 并运行\
    \ `make imapd.pem`。\n- 需要关注的最重要的问题关于通用名称 (common name) 的。这必须设置为用户将连接的主机的完全限定域名\
    \ (FQDN)。\n\n备注：\n\n## 第 8.5 节\n\n### 电子邮件客户端\n\n- Linux 有多种电子邮件客户端。\n- 使用哪一个取决于个人偏好。\n\
    - 有人使用 Emacs 编辑器，其他人使用 mutt 或 pine，这些程序仅在字符模式下运行。\n- Netscape 和 Mozilla 提供了支持图形和\
    \ HTML 附件的阅读器，并支持全 SSL 加密的 IMAP 和 POP。\n\n备注：\n\n### GNU 隐私卫 (GPG)\n\n- GNU 隐私卫\
    \ (GPG) 设计用于替代商业版 PGP。\n- 加密的作用与信封类似——它是电子邮件和其他文件的信封。\n- 额外的好处是，GPG 允许他人验证邮件确实是你发送的，而不是冒充者。\n\
    - GPG 被设计为没有专利限制，适合任何人下载。你可以从 http://www.gnupg.org/ 获取最新的 RPM 格式副本。\n- 一旦下载并安装\
    \ RPM，你就可以生成公私密钥对。\n- 要生成公私密钥对，使用 `gpg --gen-key`。你需要运行两次，第一次 `gpg` 将文件复制到 `.gnupg`\
    \ 目录。第二次运行时它将允许你创建密钥。\n- 首先，选择你想要的密钥类型。可以选择签名、加密或其他。\n- 接下来询问位长度。这是密钥的强度，数字越小越弱，越大越强。\n\
    - 然后你可以为密钥设置有效期。这允许你像管理密码一样过期密钥。过期后，你必须生成新密钥并再次分发公共部分。\n- 接下来询问你的姓名，然后是邮箱地址，最后是注释。注释是你给朋友的密钥上显示的名称。\n\
    - 接下来询问口令。\n- 经过一些处理，你将拥有自己的 GPG 密钥，适用于签名电子邮件或加密文件。\n- 你可以使用 `gpg --clearsign\
    \ filename` 签名文件。会创建一个扩展名为 `.asc` 的文件，其中包含原始文件及其数字签名。\n- 在他人验证你的签名之前，你需要分发你的公密钥。确保接收者知道该公密钥来自你。\n\
    \n"
