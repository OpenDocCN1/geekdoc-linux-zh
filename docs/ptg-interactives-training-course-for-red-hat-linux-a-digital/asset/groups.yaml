  - '[PAGE 126]


    # LECTURE 8 E-MAIL


    # # Procmail


    +   * Procmail is used to process mail as it comes in.

    * Procmail is set up to be the default local mail handler.

    * Create a .procmailrc file in your home directory and start adding rules for
    procmail to filter.


    ```

    Sample .procmailrc File


    PATH=/bin:/usr/bin:/usr/bin

    MAILDIR=$HOME/Mail #Mail that gets sorted out by procmail

    will # be sent to a directory called Mail

    in your home # directory.

    LOGFILE=$MAILDIR/log #Log errors or diagnostic messages to this file.

    0:

    * ^From.*mark

    from_me

    0:

    * ^Subject:.*Flame

    dev/null

    ```


    +   * There are three sections to matching a line and performing some action on
    it, also called a recipe.

    - A recipe starts with a line that has at least :0.

    - After the :0, you can include flags (e.g., H will only scan the headers).

    - Pattern matching is done for any lines that start with an asterisk (*). The
    rest of the line is sent to egreg.

    - If all of the lines match, the appropriate action is taken. If not, it moves
    on to the next recipe.

    - There can only one that does not start with * or :.

    - An action starting with ! will forward the program to the specified user.

    - An action starting with | will start a shell and pipe the e-mail to that program
    for processing.

    - Anything else will be assumed to be a filename to append (or create if it doesn''t
    already exist).'
