  - '[PAGE 21]


    # Sample lilo.conf


    ```

    # Tell LILO to install itself as the primary boot loader

    /dev/hda

    boot = /dev/hda

    # The boot image to install; you probably shouldn''t change this

    install = /boot/boot.b


    # The stanza for booting Linux

    image = /boot/vmlinuz

    label = linux

    root = /dev/hda2


    vga = ask


    #The stanza for booting MS-DOS

    other = /dev/hdb1

    label = dos

    table = /dev/hdb

    # The kernel is in /boot/vmlinuz

    # Give it the name "linux"

    # Use /dev/hda2 (first drive,

    second partition)

    # as the root filesystem

    # Prompt for VGA mode

    # This is the MS-DOS partition

    # Give it the name "dos"

    # The partition table for the

    second drive

    ```


