    \n- The nameserver is the program that matches an IP address (192.168.1.1) to\
    \ a hostname (www.wayga.org).\n- Since a nameserver looks up and caches DNS requests\
    \ from client machines, it can be used at one end of a slow link to reduce the\
    \ amount of DNS traffic across the link.\n- The nameserver has provisions for\
    \ forwarding e-mail addressed from one host to another and can provide backups\
    \ for particular hosts in case one Web server is busy while another is idle.\n\
    - When connecting to a TCP/IP network, use DNS for hostname resolution by putting\
    \ these lines in the /etc/resolv.conf file, substituting your domain name and\
    \ IP address for “wayga.org” and “192.168.1.1” respectively:\n\n```\ndomain wayga.org\n\
    nameserver 192.168.1.1\n```\n\n- There can be multiple nameserver entries here,\
    \ which will be tried in order until a successful DNS connection is made.\n- If\
    \ you plan on running named (the DNS server software) locally, you should change\
    \ the IP address to read 127.0.0.1. Be sure to have a few other IP addresses in\
    \ there in case named goes down.\n\n## Should You Be a DNS Server?\n\n- You should\
