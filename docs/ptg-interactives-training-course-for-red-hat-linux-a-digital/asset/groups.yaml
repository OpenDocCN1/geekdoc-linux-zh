    \ --query hostname`。\n- 作为安全预防措施，你应该在防火墙上拦截 TCP/IP 端口 177。这是 gdm 使用的端口。\n\n笔记：\n\
    \n## 课程 10 X 窗口系统\n\n## 课程 10.4\n\n使用 X 窗口管理器\n\n- 窗口管理器在窗口周围绘制边界，并提供最大化和最小化按钮；此外，它还允许你调整窗口大小、移动或杀死窗口。窗口管理器提供了菜单以及\
    \ X 显示通用“外观和感受”。\n- X 在像终端模拟器之类的客户端应用程序与窗口管理器之间有清晰的隔离，这允许客户端被移动和调整大小。\n- 你可以通过桌面环境在这两个部分之间插入命令。\n\
