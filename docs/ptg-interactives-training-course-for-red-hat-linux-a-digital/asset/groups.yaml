    \ 5.4\n## Network Information Services (NIS)\n\n- NIS is a set of programs for\
    \ managing users and various network services from one master server.\n- NIS stores\
    \ its information in a set of directories and GDBM (GNU Database Management) files\
    \ rooted in /var/yp.\n- Maps are then made available to other machines in the\
    \ NIS domain via RPC (Remote Procedure Calls).\n- NIS also allows for secondary\
    \ slave servers.\n- Each subnet should have one (and only one) NIS server on it.\n\
    - The NIS maps are built from the various setup files found mostly in /etc: passwd,\
    \ group, hosts, services, aliases, and so on. It is not necessary to use every\
    \ map. Often only the password and group maps are used, since most of the other\
    \ files change frequently.\n- One of the biggest problems with NIS is the security\
    \ hole opened by broadcasting NIS requests.\n\nNotes:\n\n## LECTURE 5 NETWORKING\
    \ WITH LINUX\n\n- Red Hat includes two scripts for working in an NIS network environment:\
    \ /etc/rc.d/ypbind and /etc/rc.d/autofs. The second script is only needed if you\
    \ have automount maps in your NIS server.\n- Edit /etc/ypbind.conf file to reflect\
    \ your NIS domain settings.\n- By default, ypbbind will send an IP broadcast through\
    \ the network to find a NIS server. You can manually specify a NIS server to use.\
    \ Edit the /etc/yp.conf file and add the hostname for the server, making sure\
    \ the host is listed in /etc/hosts.\n- Make sure that the portmapper is starting.\
    \ If you're using NFS, then the portmapper is already started.\n- If not, use\
    \ /etc/rc.d/init.d/portmap start to get it started.\n- Finally, you can start\
    \ ypbind: /etc/rc.d/init.d/ypbind start.\n- The /etc/nsswitch.conf file determines\
    \ the lookup order for all NIS information (unlike /etc/host.conf, which is only\
    \ for host lookups).\n- The automounter will automatically mount partitions on\
    \ NFS based on an NIS map. The two typical maps used are auto.home and auto.vol,\
    \ which mount off of /home and /vol, respectively. You can start the Linux autofofs\
    \ automounter using the command:\n\n```\n# service autofofs start.\n```\n- CD-ROMs,\
    \ floppy disks, local volumes, and NFS filesystems can be automatically mounted\
    \ when the user changes to a certain directory.\n\n## Configuring an NIS Master\
    \ Server\n\n- The NIS Master Server sits on a network and responds to NIS queries\
    \ on the network.\n- There can be only one master server per physical network.\n\
    - You can set up slave servers that synchronize with the master server, and reduce\
    \ the load from clients.\n- Slave servers can be located on separate subnets.\n\
    - Make sure that you have the yserv package installed.\n- Edit /var/yp/Makefile\
    \ to add or remove the maps you will be serving. The line starting with all: contains\
    \ the list of maps.\n- Edit /var/yp/securenets and /etc/ypserv.conf. The first\
    \ defines the IPs from which the server will answer requests. The following shows\
    \ how the /var/yp/securenets file could look.\n\nSample /var/yp/securenets\n\n\
