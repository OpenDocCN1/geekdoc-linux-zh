    \ IP 地址已经被分配。\n\n# 客户端配置\n\n- 使用 netcfg 将 IP 配置为 DHCP 并激活以太网卡。\n- 也可以配置 linuxconf\
    \ 使用 DHCP 启动以太网接口。\n- Windows 机器只需通过网络控制面板设置为 DHCP 配置即可。\n- 其他 UNIX 机器（如 Solaris）可能已经安装了\
    \ DHCP 客户端，或者你可以从 http://www.isc.org/ 下载并编译 ISC DHCP 分发。\n- 如果你选择使用网络上的所有动态 IP\
    \ 地址，可以使用像 lanlord (http://linux.uhw.com/software/lanlord/) 的程序来查看分配了哪些 IP 地址。\n\
    \n注意：\n\n# PPP\n\n- 点对点协议（PPP）是通过拨号线路连接互联网或 TCP/IP 网络的方法。\n- PPP 设计为仅在两台机器之间工作。这使其成为拨号应用、甚至通过租用线路连接远程位置的理想选择。\n\
    - PPP 依赖于在电话线的一端运行 pppd 服务器，在另一端即拨号的机器上运行 pppd 客户端。\n- 你必须根据自己是客户端还是服务器来不同的配置软件。\n\
    - PPP 没有像以太网那样的开销，因为没有使用 MAC 地址。\n\n注意：\n\n# 第 5 节：LINUX 上的网络\n\n# PPP 客户端\n\n\
    - 设置 PPP 客户端需要调制解调器、电话线、一个 PPP 服务器和一个用于拨号的号码。\n- 验证 PPP 连接是否工作的快速方法是执行类似以下的操作：\n\
    \n```\n# pppd connect 'chat -v \"+\" ATDTphone CONNECT \" login: login\nword:\
    \ password' \\> /dev/cu1 3840 debug crctscts modem defaultroute\n```\n\n- 电话、登录名和密码由提供\
    \ PPP 账户的人分配给你。\n- 将 /dev/cu1 修改为调制解调器的位置。记得 Linux 下的 /dev/cu1 与 DOS 和 Windows\
    \ 下的 COM2。\n- chat 命令用于拨号调制解调器并提供登录和密码信息。\n- 一旦 chat 成功建立连接，PPP 将接管线路并开始连接。\n\
    - 服务器和客户端会协商诸如最大传输单元（MTU）、压缩以及其他几个设置。\n- 此配置可以使用 Red Hat 网络配置管理器通过输入电话号码、线路速度、调制解调器、登录名和密码在脚本完成。\n\
    \n# PPP 服务器\n\n- 要让 PPP 服务器软件运行，必须开启 IP 转发和 PPP。这允许 Linux 充当 ARP 代理并为以太网地址响应 ARP\
    \ 请求。\n- 分配一组未使用且以后不会被使用的 IP 地址。这些将用于入站连接的地址，可用数量至少要与你的电话线数量一样。\n- 为每个通过 PPP 连接的用户创建新账户。许多地方会在用户名前面加一个字母\
    \ P。让 /etc/passwd 中的用户信息看起来像这样：Pmark:x:500:500:PPP user:/home/mark/usr/local/bin/pppd。\n\
    - 在该用户的家目录下创建一个 .ppprc 文件，并添加下方示例中的文本：\n\n示例 .ppprc 文件\n\n```\n-detach\nmodem\n\
    crctscts\nlock\n192.55.123.100:192.55.123.111\nproxyarp\n```\n\n- --detach 表示不从控制台分离。\n\
    - modem 表示监控 CD（载波检测）线路，并在 CD 信号掉落时终止。\n- lock 将锁定设备，防止他人使用该串口端口。\n- 两个 IP 地址是服务器地址（等待来电），后面跟着一个冒号，然后是拨号时分配给客户端的\
    \ IP 地址。\n- proxyarp 允许服务器将 PPP 客户端放入其 ARP 缓存，并对本应发送给客户端的数据包做出响应。\n- 设置 getty\
    \ 以监控串口端口。\n- pppstats 命令可以给出线路进出数据包的运行总量。\n\n- 如果你选择使用动态 IP 地址而不是静态 IP 来节省 IP\
    \ 地址，请为每个连接到调制解调器的 tty 文件创建一个 /etc/ppp/options.ttyXX 文件，其中 xx 是串口名称。\n- options.ttyXX\
    \ 文件的内容与上述 .ppprc 文件相同，不同之处每个文件的 IP 地址已更改。\n\n# 注意：\n\n# 课程 5.2\n\nxinetd\n\n\
    - xinetd 元守护进程用于在特定 TCP/IP 端口收到接收请求时自动启动程序。\n\n注意：\n\n# /etc/services\n\n- /etc/services\
    \ 文件包含有关 TCP/IP 端口号的信息以及指定端口的名称，该名称稍后用于 /etc/inetd.conf 文件。\n\n示例 /etc/services\
    \ 文件\n\n```\nftp-data      20/tcp\nftp             21/tcp\ntelnet          23/tcp\n\
    smtp            25/tcp timserver\ntime            37/tcp timserver\ntime     \
    \       37/udp resource\nrlp             39/udp nameserver\nname            42/udp\
    \ nameserver\nwhois           43/tcp nicname # 通常到 sri-nic\ndomain          53/tcp\n\
    domain          53/udp\n```\n\n- 行的第一个项目是服务名。后面是端口号和协议（TCP 或 UDP），然后是任何别名。\n-\
    \ 接收邮件的端口名为 smtp 端口；它位于 25 端口，其别名是 mail。\n\n注意：\n\n# /etc/xinetd.d\n\n- /etc/xinetd.d\
    \ 目录包含一组 xinetd 读取并使用的文件列表，用于确定监控哪些端口。以下示例包含了 xinetd 使用来监控 finger 用端口的配置文件。\n\n\
    # finger 的配置文件\n\n```\n# default: on\n# description: finger 服务器响应 finger 请求。\n\
    Finger 是\n# 一种允许远程用户查看\n# 信息协议，例如\n# 本地用户的登录名和最后登录时间。\nservice finger\n{\n   \
    \ socket_type = stream\n    wait = no\n    user = nobody\n    server = /usr/sbin/in.fingerd\n\
    \    disable = yes\n}\n```\n\n- service 行表示正在定义的服务名称，在本例中为 finger。服务部分内还设置了几个额外参数：\n\
    \n- socket_type 设置为 stream，意味着我们正在使用 TCP 而不是 UDP。\n- wait 选项允许 xinetd 根据需要启动该服务的新进程，或者一次只运行一个服务。\n\
    - user 选项列出了命令将以哪个用户运行的用户名（如果有的话）。\n- server 列出了在激活时将运行的命令。\n- disable 显示此服务是否被禁用。\n\
    \n- 对于某些高吞吐程序（apache 和 sendmail 是很好的例子），你不希望它们不断重启，因为这需要大量时间；这些程序将根据需要派生或产生新进程。\n\
    \n"
