  - '[PAGE 110]


    # What Are Workgroups and Domains?


    +   * A workgroup is a logical collection of users that may be within the same
    subnet.

    * A subnet breaks us up physically.

    * A workgroup is a more logical breakdown; you can have accounting, manufacturing,
    and sales all on the same subnet but all in different workgroups.

    * Workgroups have no central location for verifying passwords.

    * This means you will need to synchronize password and user lists across multiple
    Windows and Linux machines.

    * It can be difficult to synchronize passwords across Windows machines due to
    the proprietary nature of the password files that Microsoft uses.

    * A Windows NT domain has a central password server that authenticates users when
    they log into their Windows machines.

    * Windows NT workstation, since it has a list of authorized users who can log
    in (instead of Windows 98, where anyone can log in), requires either synchronizing
    user lists across machines who or using a domain.

    * Using a domain reduces congestion on the Primary Domain Controller when a Samba
    machine is used.


