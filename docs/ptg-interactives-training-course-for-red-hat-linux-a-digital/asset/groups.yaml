- md: "\nNotes:\n\n## tcpdump\n\n- The tcpdump program puts the Ethernet card into\
    \ promiscuous mode.\n- All packets seen by the card are displayed on the screen.\n\
    - Filters exist to see only the data that you want to see.\n- Here are a few packets\
    \ related to ARP:\n\n```\n21:49:12.480000 arp who-has myachine.insidehost.com\
    \ tell gateway.insidehost.com\n21:49:12.480000 reply myachine.insidehost.com is-at\
    \ 00:0c:01:b4:4f:dc\n```\n\n- The first line is a request from gateway asking\
    \ for the Ethernet address for my machine.\n- The next line is a reply with the\
    \ MAC address.\n- This is fairly common, since ARP caches do not last all that\
    \ long.\n\n- Here are some ICMP-related packets:\n\n```\n21:50:05.510000 myachine.insidehost.com\
    \ > ping.outsidehost.com: icmp: echo request\n21:50:05.650000 ping.outsidehost.com\
    \ > myachine.insidehost.com: icmp: echo reply\n```\n\n- Here we see a ping going\
    \ from my machine out to a remote site called ping.outsidehost.com.\n- About 140ms\
    \ later (6500000 minus 510000), the ping is answered with a reply.\n- Since a\
    \ ping is really asking the remote side to echo data, this is how tcpdump reports\
    \ it.\n\n- Below, tcpdump is run on the second Ethernet port (also known as eth1):\n\
    \n**Using tcpdump on other interfaces**\n\n```\n# /usr/sbin/tcpdump -i eth1\n\
    tcpdump: listening on eth1\n23:12:59.510000 192.168.1.15.listen > hudson.telnet:\
    \ . ack 76005909 win 78432 (DF)\n23:12:59.510000 hudson.telnet > 192.168.1.15.listen:\
    \ P 1:29(28) ack 0 win 32736 (DF)\n```\n\n## LECTURE 13 SYSTEM AND NETWORK MONITORING\n\
    \n```\n23:12:59.710000 192.168.1.15.listen > hudson.telnet: . ack 29 win 7814\
    \ (DF)\n23:12:59.710000 hudson.telnet > 192.168.1.15.listen: P 29:199(170) ack\
    \ 0 win 32736 (DF)\n```\n\n- 4 packets received by kernel\n- 0 packets dropped\
    \ by filter\n\nThis example looks a bit messy, since the machine in question is\
    \ logged via the second Ethernet port. What we're seeing is the data from tcpdump\
    \ being sent over the Ethernet line.\n\nLet's examine the second and third packets:\n\
    \n```\n23:12:59.510000 hudson.telnet > 192.168.1.15.listen: P 1:29(28) ack 0 win\
    \ 32736 (DF)\n23:12:59.710000 192.168.1.15.listen > hudson.telnet: . ack 29 win\
    \ 7814 (DF)\n```\n\n- The first line is a packet leaving the telnet port on server\
    \ (the machine connected via telnet) and going to 192.168.1.15 on the listen port.\n\
    - The timestamp indicates that the time is almost 13:12:59.510000, to be precise.\n\
    - After the data represents, special/IP flags are mentioned. In this case, P represents\
    \ \"Push\". This could also be S (Syn), F (Fin), R (Reset), meaning no flags.\n\
    - Next comes the data sequence number (29(28)). This allows the IP layer to reassemble\
    \ packets as they come in.\n- Next is ack 0, meaning that's expecting acknowledgment.\n\
    - The win refers to the size of the remaining receive buffer.\n- The second line\
    \ is the acknowledgment packet from the target machine.\n- Since tcpdump attempts\
    \ to use names instead of IP addresses, you may find out who else is. If you want\
    \ to turn this off, use the -n option.\n\nAnother option available to tcpdump\
    \ is filtering. For example, to filter out all telnet traffic and get information\
    \ about who is browsing the web you'd use something like this:\n\n```\n$ /usr/sbin/tcpdump\
    \ -i eth0 port\n```\n\nSince tcpdump only sees traffic on the local Ethernet,\
    \ you'll be able to see traffic on your segment. You won't be able to see traffic\
    \ on the other side of a router, firewall, or even a switch unless it's broadcast.\n\
    \nNotes:\n\n## LECTURE 13 SYSTEM AND NETWORK MONITORING\n\n### Lesson 13.3 Summary\n\
    \n- The syslog program helps track issues on a system.\n- Network monitoring programs\
    \ let you track the network from your desktop.\n- Specific network monitoring\
    \ distributions exist to help you track issues anywhere in your network.\n\nNotes:\n\
    \n## Lecture 14 Backing Up Your Data\n\n### Objectives\n\n- Use tar and mt to\
    \ Back Up Your Data\n- Use tar to Back Up Your Data\n- Use dump and restore\n\
    - Plan Your Backup Strategy\n- Understand RAID and Disk Mirroring\n\n### Lesson\
    \ 14.1\n\nUsing tar and mt are the most basic ways, and probably the oldest of\
    \ backing up data.\n- The mt command is known mostly now as a UNIX version of\
    \ the zip command.\n- The mt program controls magnetic tape drives and can be\
    \ used in conjunction with tar to control your backups.\n- Using tar in a basic\
    \ fashion, you can create a cron job that compresses and archives all of your\
    \ filesystems and network volumes to a tape drive every night or every few nights.\
    \ There are a couple drawbacks to this method.\n- First, only a small fraction\
    \ of the filesystem changes over the course of even a week.\n- Second, it's very\
    \ possible that you could have more data to back up than the capacity on your\
    \ tape.\n- If your backups are small enough you may want to put more than one\
    \ on a single tape, and then you may need some way to access a particular archive\
    \ at some later point.\n\nNotes:\n\n## Using tar\n\n- The tar command has three\
    \ major functions: create a tar file, list the contents of a tar file, and extract\
    \ files from an existing tar file.\n- Other commonly used switches include f for\
    \ filename, v for verbose, and z to enable gzip (de)compression.\n- If multiple\
    \ switches that require arguments are used, you can line up both the switches\
    \ followed by the arguments, or list a switch by its argument:\n\n```\n$ tar -cvf\
    \ foo.tar file1 file2 file3\n$ tar -cf file1 file2 file3 -vf foo.tar\n```\n\n\
    - If the -z switch were added, the tar would also compress the data stream with\
    \ gzip. Typically, compressed tar files are named foo.tar.gz.\n- You can decompress\
    \ archives with the command: $ tar zkvf foo.tar.gz\n- Read a compressed archive\
    \ from a SCSI tape device with: # tar zkvf /dev/nst0.\n- Using tar, you must know\
    \ the block size when backing up and restoring files. Get the block size wrong,\
    \ and you won't be able to read the files you backed up.\n- Increasing the block\
    \ size decreases the amount of overhead when writing to the tape and can increase\
    \ the performance and decrease the write time to the tape.\n- The block size is\
    \ added with a -B blocksize option to tar, where blocksize is multiplied by 512.\n\
    - tar can archive files that are not currently needed.\n- tar is commonly used\
    \ to create packages or distributions of documentation, source code, or precompiled\
    \ software.\n- tar can be used to transfer directory trees around your filesystem.\
    \ Its many line options let you control preservation of permissions, modification\
    \ dates, and the following of symbolic links.\n- In general, it is not a good\
    \ idea to follow symbolic links unless you know where the links in the tree are\
    \ pointing.\n\n## Using mt\n\n- The mt program is used to control tape devices.\n\
    - Since tar starts at the beginning of a block and adds an EOF (end of file) at\
    \ the end of each block, you can use mt -f device fsf count to advance sections\
    \ of tape.\n For example, if you had five tar files on a tape and wanted to add\
    \ a sixth, you would first advance the tape with mt -f /dev/nst0 fsf 5 to get\
    \ to the next block after the fifth end-of-file marker.\n- You would then use\
    \ tar -cvf /dev/nst0 file to write new information. You would use tar -xvf /dev/nst0\
    \ to restore the data from tape.\n- Using the /dev/nst0 device name will tell\
    \ the tape device to not rewind after completing; use this when advancing the\
    \ tape with mt, or else the tape will rewind after being advanced!\n- /dev/st0\
    \ will rewind after the command is completed and can be used after a restore to\
    \ automatically rewind the tape.\n- The mt command also supports an explicit rewind,\
    \ and if the tape device supports it, it can also eject the tape. These commands\
    \ are mt -f /dev/st0 rewind and mt -f /dev/st0 offline, respectively.\n- Other\
    \ commands to mt include re-tension (forward to the end of the tape, then rewind),\
    \ status (to give a status of a tape drive), erase (to erase the tape), and a\
    \ number of SCSI-options relating to hardware compression, buffering, density,\
    \ and others.\n"
