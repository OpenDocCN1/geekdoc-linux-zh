    # Apache and SSL


    - There are many reasons to want to keep data secure.

    - Setting up an SSL server is not legal everywhere; check the laws in your area
    before configuring and using a SSL server.

    - SSL uses an algorithm to create a key. This key is then used to encrypt the
    data that goes between the client and server so that only the client and server
    can decrypt the data easily.

    - To further increase security, SSL implements certificate authorities, also known
    as CAs. These counters a key, which means they know that the server giving you
    the key is who it says it is.

    - CA signing costs money and lasts a limited amount of time, but commercial companies
    should consider spending the money for the added security CA gives.

    - Get the mod_ssl RPM from the CD-ROM and install it on the system.

    - The mod_ssl documentation is at http://localhost/manual/mod/mod_ssl/.

    - A document describing how to generate keys can be found in /usr/share/doc/mod_ssl-2.8.1/SSL-Certificate-Creation.

