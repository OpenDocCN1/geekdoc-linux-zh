    # Lesson 11.4


    # Network Security


    +   - Network security covers how to set up your network and data so it is more
    secure.

    - For a small office setting, it''s probably best to have a single host to interact
    with the outside world.

    - Protect the rest of the network using Linux''s built-in packet filtering iptables.

    - Monitor the anonymous FTP and WWW logs for break-ins. These logs are found at
    /var/log.

    - The security files you''ll want to look at are located in /var/log/security.

    - For users that require only email, you can have that email forwarded to an external
    account.

    - Be aware of who is on vacation or other types of leave, and make sure they''re
    not logged in.

    - This gives a bit of balance to the security and convenience issues. Internal
    employees can go out to the rest of the Internet without using proxies.

    - All the traffic that goes in or out of the router first passes through the firewall.

    - Programs like TripWire run on all hosts. TripWire can monitor system files like
    /etc/passwd and know when these files change. If a file is changed, it sends an
    alert that a potential crack is in progress.

    - For incoming services, anything that requires authentication from a user must
    be encrypted to prevent a rogue host from sniffing passwords.'
