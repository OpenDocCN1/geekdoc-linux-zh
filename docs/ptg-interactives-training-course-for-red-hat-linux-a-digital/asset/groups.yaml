    Notes:"
  - '[PAGE 93]


    # Lesson 6.2


    # Types of Printers Supported by Linux


    +   - Parallel ports are the most common connection methods for printers.

    - The advantages of using parallel ports for printing are that there are no configuration
    settings to worry about and the speed is higher than a serial port.

    - The disadvantages of parallel ports are its distance limitations and higher
    cost for cabling. Parallel ports can only run about 20 feet, or about 7 meters.

    - Serial and Ethernet printers can run from 50 feet to a half mile (1 kilometer).

    - Serial printers are fairly uncommon for consumer-grade printers.

    - Most of the higher-end printers for workgroups or print servers have serial
    connections as well, or they are options available after the purchase.

    - Serial printing is the most complex printing method; avoid this unless there
    are no alternatives.

    - Support for USB printers under Red Hat Linux is limited but growing.

    - Many printers that support USB also have parallel ports. This allows you to
    use parallel ports now, then upgrade to USB as the drivers mature.


    +   - One problem with USB printers is that you can never guarantee that a USB
    printer will be in the same place. Under Red Hat Linux 7.1, the first attached
    USB printer shows as /dev/usb/lp0, no matter what vendor or printer style. The
    second printer is /dev/usb/lp1, and so on for each printer. If you disconnect
    both printers and reattach, the printers may have reordered locations.

    - Ethernet connections are available on some printers.

    - As long as the Ethernet printer supports the LPD protocol, and most do, you
    can print directly to the printer via Linux, Windows, or other UNIX workstations.

    - Many network printers can be configured via DHCP so that you do not need to
    install extra drivers to get access to them.'
- md: "\nPrint servers are dedicated boxes with one or two parallel ports and a 10/100\
    \ Ethernet connection that cost about $100US. Print servers usually have support\
    \ for LPD and come with drivers that support Windows printing over the network.\n\
    \n- For ease of use, you should configure a Linux box as a central place for print\
    \ requests to go. Configure this box to accept print requests via LPR, IPP (CUPS),\
    \ and SMB printing from Windows machines. You can then have this machine talk\
    \ to the print server.\n\n## Notes:\n\n## Lesson 6.3\n\n### Configuring LPRng\n\
    \n- Red Hat Linux uses LPRng, which is the next generation of the Line Printer\
    \ Daemon.\n- The initial versions of LPR had little or no support for authentication,\
    \ load balancing, and failover. LPRng adds this support while being lightweight\
    \ enough to not consume too many resources.\n- The main access to configuration\
    \ of printers is through **printconf**. This application only works if you have\
    \ a graphical window working already.\n  - When you start **printconf**, you will\
    \ get a list of printers that the local system knows about. If this is the first\
    \ time you have run it, there will be no printers listed.\n- The interface makes\
    \ it easy to add printers.\n\nNotes:\n\n## LECTURE 6 PRINTING AND PRINT SHARING\
    \ 91\n\n### Managing Print Queues\n\n- Print queues are FIFO (First In First Out),\
    \ so the first one in line gets to have access to the printer.\n- The commands\
    \ you will want to know about to manage the print queues are `lpc`, `lprm`, and\
    \ `lpq`.\n- The `lpq` command shows what is in the queue and gives the current\
    \ status of the printer; some printers will be able to tell `lpd` that they are\
    \ out of paper or that the connection is down, and these errors will show up in\
    \ the `lpq` listing.\n- The `lprm` command will remove jobs from the queue.\n\
    - By default, only root and the person who submitted the print job can remove\
    \ a job from the queue.\n- Most printers have an internal buffer, so removing\
    \ the job if it is already printing may not cause the printer to immediately stop.\n\
    - The `lpc` command is the “lpc control.” It can activate and deactivate queues\
    \ and printers, rearrange jobs in the queue, and get a status of any printer listed\
    \ in `/etc/printcap`.\n- `lpc` can be run interactively, or you can put the commands\
    \ directly on the `lpc` command line.\n\nNotes:\n\n## Printers on the Network!\n\
    \n- Since Linux supports both lpd and SMB for print sharing, most computers on\
    \ your network will be able to print to your printer with little trouble.\n- When\
    \ talking over the network to LPRng, you should have drivers for printers loaded\
    \ on the client side before you start up.\n- Print jobs that come from the network\
    \ get passed to the printer port directly without being processed by the local\
    \ print drivers.\n\nNotes:\n\n## LECTURE 6 PRINTING and PRINT SHARING\n\n### Access\
    \ from Other LPD (UNIX) Systems\n\n- To permit access from specified hosts with\
    \ LPRng, create a list of users and hosts allowed to submit jobs, delete jobs,\
    \ and manage printers.\n- The control file is located in /etc/lpd.perms.\n- By\
    \ default, any user on any host can submit jobs, only the user or root can remove\
    \ jobs, and anyone can get queue status, with root being able to control print\
