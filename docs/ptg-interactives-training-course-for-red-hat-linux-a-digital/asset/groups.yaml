  mdcn: "\n\n- 像 telnetd 或 ftppd 这样的程序不需要大量的启动时间，因此 xinetd 可以根据需要处理启动新实例。\n\n## 注意事项：\n\
    \n## 第 5.3 \n\n## 网络应用\n\n## 网络应用\n\n### DNS\n\n- 域名服务器是将 IP 地址（192.168.1.1）匹配到主机名（www.wayga.org）的程序。\n\
    - 由于名称服务器会查找并缓存来自客户端机器的 DNS 请求，因此它可以用于慢速链路的一端，以减少跨链路的 DNS 流量。\n- 名称服务器提供了将从一个主机的邮件转发到另一个主机的功能，并且当某个\
    \ Web 服务器忙而另一个空闲时，为特定主机提供备份。\n- 在连接到 TCP/IP 网络时，通过将以下行写入 `/etc/resolv.conf` 文件来使用\
    \ DNS 进行主机名解析，请分别将“wayga.org”和“192.168.1.1”替换为你的域名和 IP 地址：\n\n```\ndomain wayga.org\n\
    nameserver 192.168.1.1\n```\n\n- 这里可以有多个名称服务器条目，将按顺序尝试直到建立成功的 DNS 连接。\n- 如果你计划在本地运行\
    \ named（DNS 服务器软件），你应该将 IP 地址更改为 127.0.0.1。请确保在其中还有其他几个 IP 地址，以防 named 宕机。\n\n\
    ## 你应该充当 DNS 服务器吗？\n\n- 只有在以下情况下你才运行 DNS 服务器：\n  - 你拥有一个域名并想要控制 DNS。虽然许多 ISP 会为你处理\
    \ DNS 服务，但如果你的环境频繁变动机器，由你来处理可能会更简单。\n  - 你在慢速链路上运行大型网络。named 可以作为缓存存储经常使用的主机，这将减少部分流量。\n\
    \  - 你没有连接到互联网。\n- 如果你不符合上述任何条件，你可能不需要运行 DNS 服务器。\n\n## 注意事项：\n\n## 配置伯克利互联网名称守护进程\
    \ 9.1 (BIND)\n\n- 要成为 DNS 服务器，你需要获取（可能需要编译）并配置 bind。\n- named 很可能在安装 Linux 时已经安装了；如果没有安装，你可以从\
    \ CD-ROM 或 Red Hat 更新站点安装 `bind` 包和 `bind-devel` 包。\n- 基础配置文件是 `/etc/named.conf`。它有四种类型的语句：一个控制访问，一个描述日志，一个描述更通用的选项，以及一个或多个描述它作为服务器所属的区域（zone）。文件中的注释以井号\
    \ (#) 开头。\n\n```\nSample /etc/named.conf\n\noptions {\n    directory \"/var/named\"\
    ;\n    // 如果我们要读取文件，请从 /var/named 读取。\n}\n\nzone \".\" {\n    type hint;\n   \
    \ file \"named.ca\";\n}\n\nzone \"0.0.127.IN-ADDR.ARPA\" {\n    type master;\n\
    \    file \"named.local\";\n}\n\nzone \"1.168.192.in-addr.arpa\" {\n    type master;\n\
    \    file \"named.192.168.1\";\n}\n\nzone \"wayga.org\" {\n    type master;\n\
    \    file \"named.wayga\";\n    notify yes;\n}\n\nzone \"wayga.org\" {\n    type\
    \ slave;\n    masters { 192.168.1.1; }\n};\n```\n\n## 讲座 5 结合 LINUX 的网络\n\n- `options`\
    \ 语句描述了监听哪些 IP 以及使用哪个端口。这里 named 的工作目录 `/var/named` 被广泛使用。在没有任何域名信息的情况下，各种语句中指定的区域文件和任何其他文件将存储在此处。\n\
    - `logging` 语句控制日志的详细程度以及日志消息发送到哪里。\n- `acl` 语句控制你的服务器响应哪些客户端的查询。\n- `zone` 语句描述了服务器提供哪些区域，无论是作为主（master）还是作为从（slave）（我们在这里忽略\
    \ stub 类型）。\n- 主服务器（master）是该域（区域）信息的权威权威。\n- 从服务器（slave）是区域信息的次级传播者，但不能在从上进行任何更改。\n\
    - 在指定名称服务器时使用一种特殊类型。它被称为提示（hint），因为 `named.ca` 实际上只是提供服务器列表，其中一些拥有根名称服务器的当前列表。\n\
    - 对于从区域，你必须指定至少一个主服务器，bind 可以从那里传输区域记录。\n\n此示例总共有五个域条目。\n\n- 特殊域名“`.\\`”代表根域，即在找不到其他任何内容时在此处查找。根域通常指向整个互联网的根服务器列表。\n\
    - 第二和第三个区域是特殊域名，允许你在给定 IP 地址的情况下确定主机的名称；注意 IP 地址是按反序列出的（0.0.127-in-127.0.0）。\n\
    - 第四个区域 `wayga.org` 区域表示该服务器是主服务器，且区域文件位于 `named.wayga`。\n- `notify` 语句告诉 bind\
    \ 通知从服务器主服务器更改的配置。\n- 最后的 `wayga.org` 区域表示该服务器是从服务器；此服务器上没有 wayga.org 的配置文件，但它可以从位于\
    \ 192.168.1 的主服务器获取配置。\n\n"
