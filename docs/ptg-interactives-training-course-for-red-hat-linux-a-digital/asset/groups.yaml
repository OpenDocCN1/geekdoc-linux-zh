    # .forward file


    +   * When mail comes in, the ~/.forward file in the user''s home directory is
    checked.

    * If the file exists, the e-mail is sent to the address listed in the file.

    * .forward allows people with multiple e-mail addresses to arrange for all their
    e-mail to go to one address.

    * Instead of an e-mail address, .forward can contain a command.

    * The vacation program, which is not installed by default, but is located on the
    CD-ROM, allows you to put a program in the .forward file. When an e-mail arrives,
    vacation stores the e-mail and then sends a custom message back to the e-mail
    sender.


