  - '[PAGE 32]


    # LECTURE 3 ACCOUNT ADMINISTRATION


    # Lesson 3.1


    # Adding Users


    +   - User data and group information are usually stored in three files: /etc/passwd,
    /etc/shadow and /etc/group.

    - The /etc/passwd file stores usernames, real names, and other user information
    in this format: markk:x:500:500:Mark F. Komarinski:/home/markk:/bin/tcsh.

    - Fields are delimited by columns.

    - In order, these fields are the username, encrypted password, user ID (UID),
    primary group (GID), real name, home directory, and login shell. An “x” in the
    “encrypted password” field indicates the use of shadow passwords (stored in /etc/shadow).

    - The /etc/shadow file stores information related to user passwords, such as the
    encrypted password and time information about when the password was last changed,
    and when it should be changed in the future. A typical /etc/shadow entry is markk:$1$cnfQYft$z4Wevfsfq2ge9Rfihki/:11517:0:9999:7::

    - In order, the fields are user name, encrypted password, number of days since
    the Epoch that the password was last changed, number of days before the password
    may be changed, number of days before it must be changed, number of days warning
    before password expires, number of days after expiration before account is disabled,
    number of days after Epoch that the account will be disabled, and one additional
    field reserved for use.

    - The Epoch is the common name for January 1, 1970, the start of the known UNIX
    age.

    - Only users who get access to the system will be warned that their password will
    expire. Users who only get access through network services like Samba or e-mail
    will not receive notification that their password will expire.

    - This file is only accessible via root, and therefore is more secure than the
    /etc/password file.

    - The /etc/group file stores group information and lists the groups the user is
    in. A typical entry for /etc/group is doc:x:50:markk, bdk, pkomarinski.'
- md: "\n— The fields in this entry are, in order, name of the group, password for\
    \ someone to become a member of that group, group ID, and a list of other users\
    \ that are also members of that group.\n\n— Group passwords are rarely used and\
    \ thus typically set to x to prevent anyone not explicitly authorized from accessing\
    \ the group.\n\n+ * The easiest way to create users is adduser. The only option\
    \ required by this program is the username you wish to create.\n\n+ * By default,\
    \ adduser sets the defaults for /etc/shadow as listed above. You can use adduser\
    \ to change these defaults, or set timeout and expire permission on a per-user\
    \ basis.\n\nNotes:\n\n# LECTURE 3 ACCOUNT ADMINISTRATION\n\n## Lesson 3.2\n\n\
    ## Group and File Permissions\n\n+ * The three levels of access for Linux files\
    \ are user, group, and world.\n  - User is for the individual user who owns the\
    \ file.\n  - Group is the group the file and user belong to.\n  - World is everyone\
    \ else.\n* Groups and GIDs are used to collect logical groups of people together.\n\
    * To make a file accessible to anyone in a given group, make sure the file is\
    \ resident in that group.\n* `# chgrp groupname filename` would assign the file\
    \ filename to the group `groupname`.\n* Use the chmod command to grant or deny\
    \ access to a file.\n\nNotes:\n\n## Lesson 3.3\n\n## Deleting or Disabling Users\n\
    \n+ - To disable a user account (that is, prevent the user from logging in again),\
    \ replace the password in the `/etc/shadow` file with an asterisk (\\*) or some\
    \ other character.\n\n+ - To delete a user, such that it no longer exists on the\
    \ system at all, use `userdel`.\n\n+ - If you add a `-r` to `userdel`, the home\
    \ directory for `user` is also removed.\n\n+ - If you disable an account, the\
    \ account technically still exists. That user can still receive mail, has a home\
    \ directory that other people can access if the permissions are correct, and has\
    \ all the rights of any other account. The user just can not log in.\n\n+ - When\
    \ an account is deleted, the system will bounce any mail that comes to that user,\
    \ and all files owned by the former user will now be owned by the UID that the\
    \ user had.\n\nNotes:\n\n## When to Disable and When to Delete\n\n+ - If the user\
    \ has data in their home directory that others would want or need to access, disable\
    \ the account.\n- Once the files needed by the disabled account have been moved\
    \ to other locations, delete the account.\n- If the account has no information\
    \ needed by other users, back up the home directory and any other files the user\
    \ owns and delete the account.\n\nNotes:\n\n## Lesson 3.4\n\n## Using PAM\n\n\
    + PAM (the Pluggable Authentication Module) creates independent modules that handle\
    \ passwords and tell the appropriate program that the entered password is correct.\n\
    \n+ PAM verifies passwords from a variety of sources, from NIS to an LDAP server.\n\
    \n+ PAM also handles changing passwords and can apply methods to passwords.\n\n\
    + PAM can increase security; for instance, it can tell passwd that a given password\
    \ is too easy to guess.\n\nNotes:\n\n# LECTURE 3 ACCOUNT ADMINISTRATION\n\n##\
    \ PAM Configuration\n\n+ - The configuration files used by PAM are stored under\
    \ /etc/pam.d/ directory.\n- Older systems have a /etc/pam.conf, but its use is\
    \ deprecated.\n- In /etc/pam.d/, each filename is the name of the program that\
    \ will use PAM.\n- If a service requests PAM authentication and no specific configuration\
    \ file exists, PAM will check /etc/pam.d/other.\n\nDefault PAM configuration file\n\
    \n```\n1. auth #PAM-1.0\n2. auth required /lib/security/pam_securetty.so\n3. auth\
    \ required /lib/security/pam_stack.so\nservice=system-auth\n4. auth required /lib/security/pam_nologin.so\n\
    5. account required /lib/security/pam_stack.so\nservice=system-auth\n6. password\
    \ required /lib/security/pam_stack.so\nservice=system-auth\n7. session required\
    \ /lib/security/pam_stack.so\nservice=system-auth\n8. session optional /lib/security/pam_console.so\n\
    ```\n\n+ - PAM configuration files contain up to four items per line: module-type,\
    \ flag, module, and arguments.\n- The module-type lists what kind of module will\
    \ be defined in this entry. There are four types of modules: Authentication, Account,\
    \ Session, and Password.\n\n+ * Authentication is used to authenticate an entered\
    \ user. This is the section that checks a given password.\n* Account can restrict\
    \ account access based on (for example) time of day or location.\n* Session is\
    \ used to start external events before the service starts. Extra information can\
    \ be logged to a file or to syslog, for example.\n* Password is used to change\
    \ the “authentication token”, which is a fancy name for password, and (as in the\
    \ example) also used to test whether a new password will be easy to crack.\n\n\
    control-flag defines what to do on the success or failure of the module. If an\
    \ authentication module succeeds, will another module be checked, or will a user\
    \ be given immediate access to that service? There are four types: Required, Requisite,\
    \ Sufficient, and Optional.\n\n+ * Required modules must succeed for the user\
    \ to be granted access.\n* If this module fails, do not immediately report failure,\
    \ but continue to the next module if it exists.\n* This prevents a program like\
    \ login from telling you that a user name is invalid. Instead, it asks for a username\
    \ and password, then fails without telling you why it failed.\n* If a requisite\
    \ module fails, PAM immediately stops and reports failure.\n* Sufficient modules\
    \ will immediately stop and report success if they succeed.\n* Optional modules\
    \ are not required—they may pass or fail.\n\nmodule is the name of the module\
    \ that will be used. These files are stored by default under /lib/security.\n\n\
    arguments are options that may need to be passed to the module.\n\nNotes:\n\n\
    ## Lesson 3.5\n\n## linuxconf\n\n+ - You can use linuxconf to configure your Red\
    \ Hat system with an easy-to-use interface. You can even access this configuration\
    \ remotely through a web interface.\n- Since accessing linuxconf over the web\
    \ is a possible security risk, web access is turned off by default. You should\
