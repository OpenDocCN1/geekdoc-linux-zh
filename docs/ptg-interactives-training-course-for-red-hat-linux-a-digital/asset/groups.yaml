- md: "\n## Installing and Upgrading Binary RPM Files\n\n- The -i switch to the rpm\
    \ command, followed by a filename or list of files, indicates that the file is\
    \ going to be installed.\n- If an older version of the package already exists,\
    \ you'll get an error.\n- If you use the -U switch, this indicates an upgrade.\n\
    - The -F switch, which stands for “freshen”, tells RPM to upgrade the package,\
    \ but only if an older version has been installed.\n- Each of these switches can\
    \ also use the -h switch, which shows hash marks (#) as the install progresses.\n\
    - Any of these may fail if dependencies are not met.\n- There may be a case where\
    \ you know the dependency is met, but RPM does not know about it. In this case,\
    \ you can add the --nodeps switch to tell RPM to ignore dependency checks.\n-\
    \ To install a package, use this command, assuming example-1.0-1.i386.rpm is in\
    \ the current directory: `# rpm -i example-1.0-1.i386.rpm`.\n\nNotes:\n\n## Removing\
    \ RPMs from the System\n\n- Remove RPMs from your system with the -e switch (for\
    \ erase) followed by the name of the RPM.\n- You may not remove packages that\
    \ have other packages depend on it. In order to remove packages that have dependency\
    \ issues, you must remove the other packages first.\n- To remove a package from\
    \ a system, you do not need to know the version, build, or architecture.\n\nNotes:\n\
    \n## Querying RPMs\n\n- To find out what files would be installed if you installed\
    \ a binary package, you can use `rpm -qip package-1.0-1.i386.rpm`. This gives\
    \ a list of files that are in the package and where they will be installed.\n\
    - `rpm -qip package-1.0-1.i386.rpm` will give a list of the package name, description,\
    \ build information, size of the installed package, and other information.\n-\
    \ For packages that are already installed, you can get a list of the files that\
    \ are in a package with `rpm -ql package`.\n- If there is a file on the system,\
    \ and you want to see what package owns the file, you can use `rpm -qf filename`.\n\
    - You can get a list of all the packages installed on the system using `rpm -qa`.\n\
    \nNotes:\n\n## Verifying RPMs\n\n- You can use the -V option to rpm to verify\
    \ packages. This option will let you quickly see if a file has been erased or\
    \ modified since you installed it.\n\n- If you find a problem, you can reinstall\
    \ the package from its original package off the CD-ROM you received from Red Hat.\n\
    \n- You can verify all packages on your system with the command `rpm -Va`. If\
    \ the verification passes, you won't see any output. If a particular test fails,\
    \ you will get a possible list of eight characters, followed by a “c” if it's\
    \ a configuration file, followed by the name of the file. The possible eight characters\
    \ are: 5 (MD5 checksum failed), S (File size), L (Symbolic link), T (File modification\
    \ time), D (Device file), U (User (file owner)), G (Group (group owner)), and\
    \ M (File mode).\n\n- If you modified a configuration file, such as for Apache,\
    \ you can expect to see at least one or more of the above failures.\n\n- If you\
    \ see this on a file like /bin/su or /bin/login, it may indicate a break-in.\n\
    \n- This is an added layer of defense for verifying your system is clean, and\
    \ can be used in conjunction with a program like tripwire.\n\nNotes:\n\n## LECTURE\
    \ 4 INSTALLING NEW PACKAGES IN RED HAT\n\n### Lesson 4.2\n\n### Source RPM (SRPM)\n\
    \n- Source RPMs contain the source code for an application that either must be\
    \ compiled prior to installation, or allow you to modify source code or pre-compile\
    \ options before installing the software.\n- The directory structure for building\
    \ source RPMs is in `/usr/src/redhat`. Underneath this directory are the following:\n\
    \  - SPECS: contains specification files used to build RPMs from source code\n\
    \  - BUILD: base directory where source code is built\n  - SOURCE: location of\
    \ the .tar.gz and any patch files\n  - RPMS: contains the resulting RPM files\n\
    - SRPM: You can also build SRPMs, and the built SRPMs are located here. To build\
    \ a SRPM (example called `package-2.1`) to a binary, do the following:\n  - Install\
    \ the source RPM file (`rpm -Uvh package-2.1.rpm`).\n  - Go to the SPECS directory\
    \ (`cd /usr/src/redhat/SPECS`).\n  - Create a binary RPM from the source spec\
    \ (`rpmsbuild -bb --clean package-2.1.spec`).\n  - Install the binary RPM (`cd\
    \ /usr/src/redhat/RPMS/i386; rpm -UVH package-2.1-1.i386.rpm`).\n  - Uninstall\
    \ the source RPM (`cd /usr/src/redhat/SPECS; rpm -rmssource package-2.1.spec`).\n\
    \  - Remove the source RPM (`rm package-2.1.src.rpm`).\n- Many third party open\
    \ source applications do not distribute SRPM files, but instead distribute a `.spec`\
    \ file within the source `.tar.gz`. You can automatically build a binary RPM:\
    \ `# rpmsbuild -bt example.tar.gz`.\n\n### SPEC files\n\n- The specification,\
    \ or .spec file tells rpm how to build and install code that will eventually be\
    \ in an RPM, what files should be placed in the binary RPM, where they should\
    \ be installed to, and information about the RPM itself (who made the source,\
    \ etc.).\n\n- Sample specification file for a source RPM:\n```\n1. Summary: Example\
    \ package\n2. Name: example\n3. Version: 1.0\n4. Release: 1\n5. Copyright: GPL\n\
    6. Group: Applications\n7. Source: http://www.example.com/source/example-1.0.tar.gz\n\
    8. BuildRoot: /var/tmp/build\n9. description: This is just a test program for\
    \ how easy it is to build your own RPM files from source code. It allows you to\
    \ add extra software to your RedHat machine while still using the power of RPM.\n\
    10. %prep\n11. %setup\n12. %build\n13. make\n14. %install\n15. rm -rf $BuildRoot\n\
    16. mkdir -p $BuildRoot/usr\n17. install -m 755 example $BuildRoot/usr\n18. install\
    \ -m 600 example.conf $BuildRoot/etc\n19. %clean\n20. rm -rf $BuildRoot\n21. %files\n\
    22. %doc\n23. /usr/example\n24. /etc/example.conf\n25. %changelog\n** Mon Dec\
    \ 20 1999 Markinski <mark@example.com>\n26. First pass of example\n```\nLines\
    \ 1 through 8 contain information about the entire package. %description, a textual\
    \ notation on what the package is, takes up lines 9 and 10.\n\n### LECTURE 4 INSTALLING\
    \ NEW PACKAGES IN RED HAT\n\n- %prep is line 11. The %prep section performs anything\
    \ that has to happen before compiling, so any patch files would be applied in\
    \ this section.\n- The software is built at line 13. In this case, it only requires\
    \ make command at line 14.\n- The software is then installed in a safe location,\
    \ /var/tmp/example-buildroot in case, at lines 15 through 20.\n- %clean, in lines\
    \ 21 and 22, is run before and after building.\n- %files lists the files that\
    \ will be placed into the binary RPM.\n- %doc, at line 24, indicates documentation\
    \ files that would go into /usr/doc/example-1.0/, and the remaining files are\
    \ listed from the perspective of the example-buildroot earlier.\n- From lines\
    \ 27 to the end is a changelog to show changes in the .spec file.\n\nNotes:\n\n\
    - Querying lists the files used by the RPM where they are located.\n\n- Deleting\
    \ the RPM removes it from the system.\n- Clicking on a package makes it selected,\
    \ and clicking on it again unselects it.\n- You can also install RPMs.\n\nNotes:\n\
    \n## Lesson 4.4: Summary\n\n- RPM provides a useful way of managing system files.\n\
    - Source RPM files allow you to compile programs from source with the management\
    \ of RPM.\n- Numerous utilities exist to assist with .rpm file installation and\
    \ management.\n\nNotes:\n\n## Lecture 5: Networking with Linux\n\n### Objectives\n\
    \n- Connect to an Ethernet Network\n- Configure Dynamic Host Configuration Protocol\n\
    - Configure a Client/Server with the Point-to-Point Protocol\n- Use Network Applications\n\
    - Manage Users and Services from One Server\n- Use Linux as a Router\n- Summary\n\
    \n### Lesson 5.1: TCP/IP\n\n- The Transmission Control Protocol / Internet Protocol\
    \ (TCP/IP) is the way that UNIX (and other Internet-capable) machines talk to\
    \ each other.\n- Each machine that wants to talk TCP/IP to another machine must\
    \ have an IP address assigned.\n- An IP address is a 32-bit number that has to\
    \ be unique on the network. This number is split into four 8-bit bytes; for example,\
    \ 192.168.1.100.\n  - IP addresses can be split into two parts, a subnet address\
    \ and a host address. In the example, the subnet address is 192.168.1, and the\
    \ host address is 100.\n  - IP addresses can also be referred as names to make\
    \ them easier to remember. The Domain Name Service, or DNS, maps names to IP addresses.\n\
    \  - DNS is set up in a hierarchical format, with one central root server that\
    \ is then split into top level domains (like .com, .gov, and so on) and further\
    \ by domains (like example.com or white.gov).\n  - A host on the Internet that\
    \ has a full DNS name is also known as a FQDN, or a Fully Qualified Domain Name.\n\
    - At an application or system level, TCP/IP has over 65,000 ports available for\
    \ connecting. This allows for FTP, telnet, e-mail, WWW, DNS, and hundreds of other\
    \ functions to happen all at the same time, and separate from each other.\n  -\
    \ A list of the known ports and their uses is kept in /etc/services.\n  - For\
    \ security reasons, ports lower than 1024 can be opened by root only.\n- TCP/IP\
    \ has three main packet types that you will probably run into: UDP (User Datagram\
    \ Protocol), TCP (Transmission Control Protocol), and ICMP.\n  - UDP is a connectionless\
    \ protocol. The packets are usually small, and interaction between the client\
    \ and server really consists of a number of openings and closings of network connections.\n"
  mdcn: "\n\n## 安装和升级二进制 RPM 文件\n\n- `rpm` 命令的 `-i` 切换开关，后面跟一个文件名或文件列表，表示该文件将被安装。\n\
    - 如果已存在该软件包的旧版本，你将收到一个错误。\n- 如果你使用 `-U` 切换开关，这表示升级。\n- `-F` 切换开关代表“刷新（freshen）”，它告诉\
    \ RPM 升级软件包，但仅在已安装了旧版本时才执行。\n- 这些切换开关中的每一个都可以配合 `-h` 切换开关使用，它会在安装过程中显示哈希标记（#）。\n\
    - 如果不满足依赖关系，这些操作中的任何一个可能会失败。\n- 可能会出现一种情况：你知道依赖关系已满足，但 RPM 却不知道。在这种情况下，你可以添加 `--nodeps`\
    \ 切换开关来告诉 RPM 忽略依赖检查。\n- 要安装软件包，使用此命令，假设 `example-1.0-1.i386.rpm` 在当前目录下：`# rpm\
    \ -i example-1.0-1.i386.rpm`。\n\n备注：\n\n## 从系统中移除 RPM\n\n- 使用 `-e` 切换开关（代表 erase\
    \ 删除）后跟 RPM 的名称，从系统中移除 RPM。\n- 你可能无法移除被其他软件包所依赖的软件包。为了移除有依赖问题的软件包，你必须先移除其他软件包。\n\
    - 要从系统中移除软件包，不需要知道其版本、构建版本或架构。\n\n备注：\n\n## 查询 RPM\n\n- 要找出如果安装二进制软件包，将安装哪些文件，你可以使用\
    \ `rpm -qip package-1.0-1.i386.rpm`。这会列出软件包中的文件以及它们将安装的位置。\n- `rpm -qip package-1.0-1.i386.rpm`\
    \ 将给出包名、描述、构建信息、已安装软件包的大小以及其他信息的列表。\n对于 对于已经安装的软件包，你可以通过 `rpm -ql package` 获取软件包包含的文件列表。\n\
    - 如果系统中存在一个文件，而你想查看哪个软件包拥有该文件，可以使用 `rpm -qf filename`。\n- 你可以使用 `rpm -qa` 获取系统上所有已安装软件包的列表。\n\
    \n备注：\n\n## 验证 RPM\n\n- 你可以使用 rpm 的 `-V` 选项来验证软件包。此选项将让你快速查看文件自安装以来是否被删除或修改。\n\
    \n- 如果你发现了一个问题，可以从从 Red Hat 收到的 CD-ROM 上的原始软件包中重新安装该软件包。\n\n- 你可以使用命令 `rpm -Va`\
    \ 验证系统上的所有软件包。如果验证通过，你不会看到任何输出。如果某个测试失败，你将得到一个可能的八位字符列表，如果是配置文件，则后面会跟一个“c”，然后是文件名。可能的八位字符是：5（MD5\
    \ 校验和 失败）、S（文件大小）、L（符号链接）、T（文件修改时间）、D（设备文件）、U（用户（文件所有者））、G（组（组所有者））和 M（文件模式）。\n\
    \n- 如果你修改了配置文件（例如 Apache），你可以预期看到上述至少一个或多个失败。\n\n- 如果你在像 `/bin/su` 或 `/bin/login`\
    \ 这样的文件看到此内容，可能表明发生了入侵。\n\n- 这是验证系统是否纯净的额外防御层，可以与 tripwire 等程序配合使用。\n\n备注：\n\n\
    ## 第 4 课：在 RED HAT 中安装新软件包\n\n### 课程 4.2\n\n### 源 RPM (SRPM)\n\n- 源 RPM 包含应用程序的源代码，这些代码在安装前必须经过编译，或者允许你在安装软件之前修改源代码或预编译选项。\n\
