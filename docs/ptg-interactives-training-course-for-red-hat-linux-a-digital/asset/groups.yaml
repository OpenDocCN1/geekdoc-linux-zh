    \ via xinetd.\n- The easiest way to get into linuxconf to configure the web connection\
    \ is to use the text-based interface.\n\nNotes:\n\n## The Linuxconf Screen\n\n\
    + - The initial screen gives two menu items (Config and Control) and three menu\
