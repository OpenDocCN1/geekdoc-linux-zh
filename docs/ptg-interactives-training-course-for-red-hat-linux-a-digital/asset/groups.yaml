    - The PC can boot an OS (DOS) that can fit on a floppy, plus contain programs\
    \ on it to completely ruin a hard drive.\n- A virus can infect the MBR of a hard\
    \ drive, which is what Linux needs to boot.\n- A user can bring their own Linux\
    \ boot floppy to get root access.\n- Here are a few suggestions for keeping a\
    \ publicly available Linux machine for safe:\n- Protect the Basic Input/Output\
    \ System (BIOS)—This is the first thing you need to do, as many of the other protections\
    \ depend on this.\n- Password-protect access to the BIOS. Most modern ones will\
    \ allow this.\n- Be sure that no one can open the case. Locks are available for\
    \ many cases.\n- In the event that you forget the password, you can disconnect\
    \ the on-board battery or reset it.\n\n## Lesson 2.6\n\n### Summary\n\n- The runlevel\
    \ of a machine determines what functionality the system should be providing.\n\
    - UNIX has a single-user safe mode, plus other configurations available.\n- You\
    \ do not need to reboot to move between runlevels. For instance, you can start\
    \ Linux in single user mode to fix a bootup problem, then continue in multiuser\
    \ mode without restarting the kernel.\n- The first script that gets run by `init`\
    \ no matter what runlevel you are using is the `/etc/rc.d/rc.d` script, which\
    \ runs all the programs that would be required no matter what runlevel you would\
    \ be.\n- Once the `/etc/rc.d/rc.d` script completes successfully, `init` goes\
    \ on and calls it with an option of the runlevel to enter (0-6).\n\n## LECTURE\
    \ 3\n\n### ACCOUNT ADMINISTRATION\n\n### Objectives\n\n- Add Users and Groups\n\
    - Add and Delete Users\n- Disable Users\n- Use Shadow Passwords\n- Use Pluggable\
    \ Authentication Module (PAM)\n\n## Lesson 3.1\n\n### Adding Users\n\n- User data\
    \ and group information are usually stored in three files: /etc/passwd, /etc/shadow\
    \ and /etc/group.\n- The /etc/passwd file stores usernames, real names, and other\
    \ user information in this format: markk:x:500:500:Mark F. Komarinski:/home/markk:/bin/tcsh.\n\
    - Fields are delimited by columns.\n- In order, these fields are the username,\
    \ encrypted password, user ID (UID), primary group (GID), real name, home directory,\
    \ and login shell. An “x” in the “encrypted password” field indicates the use\
    \ of shadow passwords (stored in /etc/shadow).\n- The /etc/shadow file stores\
    \ information related to user passwords, such as the encrypted password and time\
    \ information about when the password was last changed, and when it should be\
    \ changed in the future.\n"
  mdcn: "\n## 第 2 ：Linux 启动与关机\n\n## 第 2.3 \n\n### 什么是运行级别（Runlevel）？\n\n- 机器的运行级别决定了系统应该提供哪些功能。\n\
    - UNIX 有一种单用户安全模式，以及其他可用配置。\n- 在不同运行级别之间切换不需要重启。例如，你可以在单用户模式启动 Linux 以修复启动问题，然后在多用户模式下继续运行而无需重启内核。\n\
    - 无论你使用哪种运行级别，`init` 运行的第一个脚本都是 `/etc/rc.d/rc.d` 脚本，它会运行任何运行级别下都需要的所有程序。\n- 一旦\
    \ `/etc/rc.d/rc.d` 脚本成功完成，`init` 将继续调用它，并传入要进入的运行级别选项（0-6）。\n    - 在 `/etc/rc.d`\
    \ 目录下有六个名为 `rc.[0-6].d` 的目录。\n    - 每个目录包含若干脚本，脚本名以“K”或“S”开头，后跟两位数字和程序名。\n   \
    \ - “S”代表启动特定于运行级别的程序；“K”代表杀死脚本（kill scripts），用于杀死（停止）任何当前运行级别未使用的程序。\n    - 先执行该运行级别的杀死脚本，然后执行该运行级别的启动脚本。\n\
    \    - 数字越小的脚本越先执行，这允许网络软件（例如）在 NFS 守护进程尝试启动之前先初始化以太网。\n    - 名称是对用户提供的描述性名称。\n\
    \    - 当每个脚本运行时，红帽（Red Hat）会报告启动脚本的成功或失败。\n    - 脚本执行成功将以绿色显示 OK；失败则将以红色显示 FAILED。\n\
    - 所有这些脚本都是 `/etc/init.d` 目录的链接，该目录包含了所有脚本的主文件。\n\n## 第 2.4\n\n### 当出现问题时\n\n在启动序列中，只有少数地方会导致内核无法完成加载。这些包括：\n\
    - 无法挂载根分区。内核可能缺少正确的驱动程序，或者正尝试加载错误的分区。\n- 无法使用 `fsck` 自动检查文件系统错误。如果出现这种情况，系统会发出警告并让你进入单用户模式。\n\
    - 内核被告知在运行级别 1 启动。\n- 加载驱动程序时的其他错误。\n- 启动脚本错误。\n\n备注：\n\n## 红帽救援镜像（Red Hat Rescue\
    \ Image）\n\n- 红帽在其 CD-ROM 上提供了一个救援镜像，如果你启动 Linux 遇到问题，可以使用它启动。\n- 救援系统会创建一个 Linux\
    \ 的小型内存驻版本，你可以用它修复损坏的安装。\n- 修复 LILO 最简单的方法是在安装时创建并使用启动软。。如果没有磁盘，可以使用救援镜像。\n- 从救援镜像中使用\
    \ `lilo` 比正常操作要困难。使用救援镜像时，内核和 lilo 配置文件的位置不在系统根目录下。\n- 启动救援镜像后，确保 `/mnt` 目录存在，然后将包含根和\
    \ `/etc` 的分区挂载到 `/mnt`，将包含 `/boot` 的分区挂载到 `/mnt/boot`。\n- 现在你可以访问 `/mnt/etc/lilo.conf`。编辑它并修复你发现的问题（或复制一份已知的良好的\
    \ lilo.conf）。\n- 最后，使用 `lilo -r /mnt` 安装修复后的 `lilo.conf` 文件。\n\n备注：\n\n## 第 2.5\n\
    \n### 系统关机与重启\n\n- 关机最安全的方法是 `sync; sync; sync; /sbin/halt`。\n- 如果你选择重启系统，可以将\
    \ `halt` 替换为 `reboot` 或 `telinit 6`。\n- 以上所有命令用于立即关机系统。如果你选择计划关机，并希望给用户留出完成工作并有序退出，你应该使用\
    \ `shutdown` 命令。\n\n备注：\n\n## CTRL+ALT+DELETE\n\n- CTRL+ALT+DELETE 将关闭 Linux。`init`\
    \ 进程会监控此操作，如果接收到该信号，将关闭机器。默认设置为立即运行 `reboot` 命令。\n- 下一节将显示如何禁用 CTRL+ALT+DELETE\
    \ 重启。\n\n备注：\n\n## 防止 PC 免受重启影响\n\n- 在重启期间，Linux 机器的安全性非常低。\n    - PC 可以启动一个可以放在软盘上的操作系统\
    \ (DOS)，并在其中包含可以完全破坏硬盘的程序。\n    - 病毒可以感染硬盘的主引导记录 (MBR)，这是 Linux 启动所需要的。\n    -\
    \ 用户可以自带 Linux 启动软盘来获取 root 权限。\n- 以下是保持公共 Linux 机器安全的若干建议：\n    - 保护基本输入输出系统\
    \ (BIOS)——这是你需要做的第一件事，因为许多其他保护措施依赖于此。\n    - 为 BIOS 访问设置密码。大多数现代 BIOS 都支持此功能。\n\
    \    - 确保没有人能打开机箱。许多机箱都有锁。\n    - 如果忘记了密码，可以断开板载电池或将其重置。\n\n备注：\n\n## 第 2.6\n\n\
    ### 总结\n\n- 机器的运行级别决定了系统应该提供哪些功能。\n- UNIX 有单用户安全模式，以及其他可用配置。\n- 在不同运行级别之间切换不需要重启。例如，你可以在单用户模式启动\
    \ Linux 以修复启动问题，然后在多用户模式下继续运行而无需重启内核。\n- 无论你使用哪种运行级别，`init` 运行的第一个脚本都是 `/etc/rc.d/rc.d`\
    \ 脚本，它会运行任何运行级别下都需要的所有程序。\n\n## 第 3\n\n### 账户管理\n\n### 目标\n\n- 添加用户和组\n- 添加和删除用户\n\
    - 禁用用户\n- 使用影子密码 (Shadow Passwords)\n- 使用可插认证模块 (PAM)\n\n## 第 3.1\n\n### 添加用户\n\
    \n- 用户数据和组信息通常存储在三个文件中：`/etc/passwd`、`/etc/shadow` 和 `/etc/group`。\n- `/etc/passwd`\
    \ 文件按格式存储用户名、真实和其他和其他用户信息：`markk:x:500:500:Mark F. Komarinski:/home/markk:/bin/tcsh`。\n\
    - 字段由列分隔。\n- 字段顺序依次为：用户名、加密密码、用户 ID (UID)、主组 ID (GID)、真实姓名、主目录和登录 shell。“加密密码”字段中的“x”表示使用影子密码（存储在\
    \ `/etc/shadow` 中）。\n- `/etc/shadow` 文件存储与密码相关的信息，如加密密码以及密码最后修改的时间和未来何时需要修改的信息。\n\
    \n"
