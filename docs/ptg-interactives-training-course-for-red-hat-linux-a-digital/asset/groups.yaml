  - '[PAGE 35]


    # Lesson 3.3


    Deleting or Disabling Users


    +   - To disable a user account (that is, prevent the user from logging in again),
    replace the password in the `/etc/shadow` file with an asterisk (\*) or some other
    character.


    +   - To delete a user, such that it no longer exists on the system at all, use
    `userdel`.


    +   - If you add a `-r` to `userdel`, the home directory for `user` is also removed.


    +   - If you disable an account, the account technically still exists. That user
    can still receive mail, has a home directory that other people can access if the
    permissions are correct, and has all the rights of any other account. The user
    just can not log in.


    +   - When an account is deleted, the system will bounce any mail that comes to
    that user, and all files owned by the former user will now be owned by the UID
    that the user had.


    Notes:'
  - '[PAGE 36]


    # When to Disable and When to Delete


    +   - If the user has data in their home directory that others would want or need
    to access, disable the account.

    - Once the files needed by the disabled account have been moved to other locations,
    delete the account.

    - If the account has no information needed by other users, back up the home directory
    and any other files the user owns and delete the account.


    Notes:'
  - '[PAGE 37]


    # Lesson 3.4


    # Using PAM


    +   PAM (the Pluggable Authentication Module) creates independent modules that
    handle passwords and tell the appropriate program that the entered password is
    correct.


    +   PAM verifies passwords from a variety of sources, from NIS to an LDAP server.


    +   PAM also handles changing passwords and can apply methods to passwords.


    +   PAM can increase security; for instance, it can tell passwd that a given password
    is too easy to guess.


    Notes:'
  - '[PAGE 38]


    # LECTURE 3 ACCOUNT ADMINISTRATION


    # PAM Configuration


    +   - The configuration files used by PAM are stored under /etc/pam.d/ directory.

    - Older systems have a /etc/pam.conf, but its use is deprecated.

    - In /etc/pam.d/, each filename is the name of the program that will use PAM.

    - If a service requests PAM authentication and no specific configuration file
    exists, PAM will check /etc/pam.d/other.


    Default PAM configuration file


    ```

    1. auth #PAM-1.0

    2. auth required /lib/security/pam_securetty.so

    3. auth required /lib/security/pam_stack.so

    service=system-auth

    4. auth required /lib/security/pam_nologin.so

    5. account required /lib/security/pam_stack.so

    service=system-auth

    6. password required /lib/security/pam_stack.so

    service=system-auth

    7. session required /lib/security/pam_stack.so

    service=system-auth

    8. session optional /lib/security/pam_console.so

    ```


    +   - PAM configuration files contain up to four items per line: module-type,
    flag, module, and arguments.

    - The module-type lists what kind of module will be defined in this entry. There
    are four types of modules: Authentication, Account, Session, and Password.


    +   * Authentication is used to authenticate an entered user. This is the section
    that checks a given password.

    * Account can restrict account access based on (for example) time of day or location.

    * Session is used to start external events before the service starts. Extra information
    can be logged to a file or to syslog, for example.

    * Password is used to change the “authentication token”, which is a fancy name
    for password, and (as in the example) also be used to test whether a new password
    will be easy to crack.'
  - '[PAGE 39]


    control-flag defines what to do on the success or failure of the module. If an
    authentication module succeeds, will another module be checked, or will a user
    be given immediate access to that service? There are four types: Required, Requisite,
    Sufficient, and Optional.


    +   * Required modules must succeed for the user to be granted access.

    * If this module fails, do not immediately report failure, but continue to the
    next module if it exists.

    * This prevents a program like login from telling you that a user name is invalid.
    Instead, it asks for a username and password, then fails without telling you why
    it failed.

    * If a requisite module fails, PAM immediately stops and reports failure.

    * Sufficient modules will immediately stop and report success if they succeed.

    * Optional modules are not required—they may pass or fail.


    module is the name of the module that will be used. These files are stored by
    default under /lib/security.


    arguments are options that may need to be passed to the module.


