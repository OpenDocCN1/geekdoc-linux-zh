    \ to control the DNS. While many ISPs will handle DNS serving for you, it may\
    \ be easier for you to handle if your environment has frequent changes of machines.\n\
    \  - You run a large network over a slow link. named can act as a cache to store\
    \ frequently used hosts, and this will reduce some of the traffic.\n  - You have\
    \ no connection to the Internet.\n- If you don't match any of these conditions,\
    \ you probably don't need a DNS server running.\n\n## Notes:\n\n## Configuring\
