    \n(Wait, let me re-provide the clean merged text properly).\n\n- Edit /etc/ypbind.conf\
    \ file to reflect your NIS domain settings.\n- By default, ypbbind will send an\
    \ IP broadcast through the network to find a NIS server. You can manually specify\
    \ a NIS server to use. Edit the /etc/yp.conf file and add the hostname for the\
    \ server, making sure the host is listed in /etc/hosts.\n- Make sure that the\
    \ portmapper is starting. If you're using NFS, then the portmapper is already\
    \ started.\n- If not, use /etc/rc.d/init.d/portmap start to get it started.\n\
    - Finally, you can start ypbind: /etc/rc.d/init.d/ypbind start.\n- The /etc/nsswitch.conf\
    \ file determines the lookup order for all NIS information (unlike /etc/host.conf,\
    \ which is only for host lookups).\n- The automounter will automatically mount\
    \ partitions on NFS based on an NIS map. The two typical maps used are auto.home\
    \ and auto.vol, which mount off of /home and /vol, respectively. You can start\
    \ the Linux autofofs automounter using the command:\n\n```\n# service autofofs\
    \ start.\n```\n- CD-ROMs, floppy disks, local volumes, and NFS filesystems can\
    \ be automatically mounted when the user changes to a certain directory.\n\n##\
    \ Configuring an NIS Master Server\n\n- The NIS Master Server sits on a network\
    \ and responds to NIS queries on the network.\n- There can be only one master\
    \ server per physical network.\n- You can set up slave servers that synchronize\
    \ with the master server, and reduce the load from clients.\n- Slave servers can\
    \ be located on separate subnets.\n- Make sure that you have the yserv package\
    \ installed.\n- Edit /var/yp/Makefile to add or remove the maps you will be serving.\
    \ The line starting with all: contains the list of maps.\n- Edit /var/yp/securenets\
    \ and /etc/ypserv.conf. The first defines the IPs from which the server will answer\
    \ requests. The following shows how the /var/yp/securenets file could look.\n\n\
    Sample /var/yp/securenets\n\n```\n#\n# Sample /var/yp/securenets\n#\n#\n# Allow\
    \ localhost access. This is necessary!\n# host 127.0.0.1\n\n# Allow access from\
    \ machines on the local network\n255.255.255.0 10.10.10.0\n\n# Access from two\
    \ class C networks 209.1.2.0 and 209.1.3.0\n255.255.254.0 209.1.2.0\n```\n\nThe\
    \ host line allows ypserv to respond to specific hosts. Since the localhost must\
    \ be able to access the server, that host is listed. Examples of allowing subnets\
    \ are on the other two example lines.\n- The /etc/ypserv.conf file lets you customize\
    \ the server's behavior at the host or network level on a per-map basis.\n- There\
    \ are two types of entries: options and access rules.\n\n- Options have the simple\
    \ format of <option>: yes|no, i.e., the option is either on or off. An option\
    \ that is commonly turned on is dns.\n- Access rules have the format host : map\
    \ : security : passwd_mangle. Access rules are read until a match is found for\
    \ the host and map being requested, then the rule is applied.\n\n## Lesson 5.5\n\
