    由于 tcpdump 只能看到本地以太网上的流量，你将能够看到你所在网段的流量。你无法看到路由器、防火墙甚至交换机另一侧的流量，除非它是广播。\n\n笔记：\n\
    \n## 第 13 节系统与网络监控\n\n### 第 13.3 节总结\n\n- syslog 程序帮助跟踪系统上的问题。\n- 网络监控程序允许你从桌面跟踪网络。\n\
    - 存在特定的网络监控发行版，帮助你跟踪网络中任何地方的问题。\n\n笔记：\n\n## 第 14 节备份你的数据\n\n### 目标\n\n- 使用 tar\
