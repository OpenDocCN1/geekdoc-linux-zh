- md: "\n## LECTURE 6 PRINTING AND PRINT SHARING\n\n### Using Authentication with\
    \ CUPS\n\n- Since IPP and CUPS were designed to allow users to send print jobs\
    \ from anywhere to a IPP server, there has to be a method for users to authenticate\
    \ users who wish to send print jobs.\n- The basic method is the same as passwords\
    \ used by HTTP, so the passwords can be sniffed fairly easily, but is good enough\
    \ for a small network.\n- To set up basic method authentication, edit `/etc/cups/cupsd.conf`,\
    \ find `<Location/>`, and insert the following lines:\n  ```\n  AuthType Basic\n\
    \  AuthClass User\n  ```\n\n- “digest” authentication requires using `lpasswd`\
    \ to add authorized users and passwords to `/etc/cups/passwd.md5`.\n- This increases\
    \ the amount of administration, since this password file does not sync with the\
    \ `/etc/passwd` that Red Hat Linux uses to administer users.\n- If you want to\
    \ use Digest authentication, change `/etc/cups/cupsd.conf` to read `AuthType Digest`\
    \ instead of `AuthType Basic`.\n- To improve security, use SSL to encrypt print\
    \ jobs and passwords as they go over the network.\n- First, you need to create\
    \ a location for the SSL keys, which should be `/etc/cups/ssl/`.\n- Then generate\
    \ the keys and protect them. The file ENCRYPTION.txt that is included with the\
    \ source code explains how to do this:\n  ```\n  # openssl req -new -x509 -keyout\
    \ /etc/cups/ssl/server.key \\\n    -out /etc/cups/ssl/server.crt -days 365 \\\n\
    \    -nodes\n  # chmod 600 /etc/cups/ssl/server.*\n  ```\n\n- The first two lines\
    \ are actually a command for `openssl` to create the keys.\n- The last line allows\
    \ only the root user access to the file.\n\n- As written, this key will be active\
    \ for 365 days.\n- The information you enter is optional, except for the common\
    \ name. This should be the name of the host to which people will be printing.\n\
    - If this entry and the host name do not match, web pages that access the print\
    \ server via SSL will give you an alert.\n- Find two lines in `/etc/cups/cupsd.conf`\
    \ that refer to ServerCertificate and ServerKey and are commented out. Uncomment\
    \ them.\n- Restart CUPS with `/etc/init.d/cups restart` and use `lpq -E` to force\
    \ SSL security.\n- If you are using authentication, you will be asked for a password,\
    \ and you will then get queue information for the default printer.\n\n## LECTURE\
    \ 6 PRINTING AND PRINT SHARING 101\n\n### Printing Over the Network with CUPS\n\
    \n#### Printing from Windows Machines\n\n- If Samba is already running, in the\
    \ /etc/smb.conf file, set the line printing = cups.\n- Samba will then look to\
    \ CUPS for the printers that are available.\n\n#### Printing from Other UNIX Machines\
    \ Running LPR/LPD\n\n- Since IPP and LPR/LPD are not compatible, you cannot have\
    \ functions like encryption or authentication of a user when printing from a LPR\
    \ client to a CUPS server.\n- A better setup would be CUPS clients with an LPR\
    \ server.\n- The best setup is CUPS for both the client and server.\n- If CUPS\
    \ is set up properly, you can open port 631 to the Internet and allow clients\
    \ to submit print jobs securely.\n- If you do want to use CUPS as a server to\
    \ an LPR client, you will need to create an entry for xinetd (see Lecture 5).\n\
    \n## Lesson 6.5\n\n### Summary\n\n- Serial, parallel, USB, and Ethernet printers\
    \ all have their relative advantages, depending on your printing needs.\n- Red\
    \ Hat Linux uses `printconf` and `LPRng` to configure printers.\n- Linux can talk\
    \ to printers across a network, and Samba allows Windows machines to network with\
    \ a Linux printer.\n- The `lpr`, `lprm`, and `lpc` programs are used to manage\
    \ printers and print queues.\n- The CUPS implementation of IPP is a good alternative\
    \ for printing over the Internet.\n\n## Lecture 7\n\n### Samba\n\n### Objectives\n\
    \n- Set Up a Microsoft Windows Network\n- Install Samba\n- Access SMB Shares from\
    \ Linux\n- Administer Samba Configurations Remotely with Samba Web Administration\
    \ Tool\n- Install Linux Printers on Windows\n\n## Lesson 7.1\n\n### Setting Up\
    \ an MS Windows Network\n\n#### What You Will Need\n\n- Install Ethernet cards\
    \ and drivers.\n- The best available networking scheme for the money is 10-BaseT.\n\
    - There are fewer problems that can cause the entire network to go down using\
    \ this method of networking.\n- It is more expensive than some alternatives but\
    \ generally worth the extra cost.\n- Make sure that each Windows user has an account\
    \ on the Linux server.\n- If you want users to be able to change their passwords,\
    \ set the shell to be /bin/passwd. Be sure to add /bin/true and /bin/passwd to\
    \ /etc/shells.\n- If you have an existing NT server that has passwords for user\
    \ accounts, you can have Samba authenticate passwords against the NT server and\
    \ not need to create user accounts.\n- Decide if you want to set up.\n- For larger\
    \ networks, it's a domain.\n\n### What Are Workgroups and Domains?\n\n- A workgroup\
    \ is a collection of users on the same subnet.\n- A workgroup is a logical group\
    \ of computers. \n- A domain requires a central server.\n\n## Lesson 7.2\n\n###\
    \ Installing Samba\n\nSamba is installed if you selected from Red Hat.\n\nThe\
    \ following is a sample smb.conf:\n\n```ini\n[global]\n# The above sets options\
