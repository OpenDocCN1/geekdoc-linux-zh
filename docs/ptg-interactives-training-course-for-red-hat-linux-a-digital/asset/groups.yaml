    # LECTURE 10 X WINDOWING SYSTEM


    # Lesson 10.4


    Using X Window Managers


    +   - The window manager places a border around the window and can provide maximize
    and minimize buttons; in addition, it allows you to resize, move, or kill windows.
    The window manager provides for menus and the general “look and feel” of the X
    display.

    - X has a clear separation between a client application like the terminal emulator
    and the window manager that allows the client to be moved and resized.

    - You can insert commands between the two parts via the desktop environment.

    - The desktop environment gives a set of libraries that applications can be compiled
    against to make writing applications easier.

    - The desktop environment can be configured so that all applications that use
    the environment have a common look and feel in terms of colors (what would be
    called themes in Windows).

    - Even though the environments look different, they perform many of the same functions.


