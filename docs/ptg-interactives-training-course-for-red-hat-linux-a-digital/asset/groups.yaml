    \ 和 Enlightenment 是 GNOME 最流行的两个窗口管理器。\n- GNOME 在对象代理、拖放、文档和 3D 编程方面使用通用的开放标准。\n\
    - GNOME 使用 GTK+ 作为其工具包。\n- GTK+ 的“可主题性”允许你在不重新编译的情况下更改 GTK+ 的外观和感受。\n- GNOME 使用符合\
    \ CORBA 标准的对象模型 Bonobo 进行组件之间的互操作性。\n\n## GNOME 界面\n\n- 首次启动 GNOME 时，你会看到一些与 Microsoft\
    \ Windows 环境中类似的概念。\n- 屏幕底部的面板有 GNOME 替代的开始按钮，看起来像一个脚印。\n- 其他各种图标可以启动应用程序、激活菜单，或作为通常所的小组件（applets）。\n\
