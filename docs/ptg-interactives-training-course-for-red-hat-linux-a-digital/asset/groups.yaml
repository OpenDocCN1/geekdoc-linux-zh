    ## Shares\n\n- The shares section provides configuration of the Samba shares.\n\
    - The default share available for configuration is the Homes section. Create new\
    \ shares by entering a new share next to Create Share and clicking the Create\
    \ Share button.\n- Once created, a share can be selected from the Choose Share\
    \ list.\n- Clicking Delete Share will remove the share.\n- Once you have a share\
    \ selected, you can start to change the configuration from the defaults.\n- The\
    \ defaults are directory is /tmp, no comment to appear in the share listing, read-only\
    \ access, and guest (non-authenticated user) is denied access to the share. In\
    \ addition, the share is available (authenticated users can access it), and the\
    \ share will show up in browse lists.\n- The hosts allow and hosts deny entries\
    \ are tab-, colon-, or space-separated lists of hosts to allow or deny access\
    \ to this share, respectively.\n- This is the same option as in the Global section,\
    \ but it only applies to this share.\n- The browseable option means that the share\
    \ shows up in browse lists of the machine.\n- Available indicates if a share is\
    \ to be activated by Samba.\n\nNotes:\n\n## LECTURE 7 SAMBA\n\n### Lesson 7.5\n\
    \n### Installing Linux Printers on Windows\n\n- Any printer you can get to from\
    \ Linux will be available from Samba.\n- Sophisticated print drivers that demand\
    \ to talk directly to the printer may cause you some problems.\n- If possible,\
    \ get a printer that supports either PCL or PostScript. This way, you can at least\
    \ send data to the printer.\n\nNotes:\n\n## Lesson 7.6\n\n### Summary\n\n- Samba\
    \ is an easy way to share drive space and printers with Windows 98 and NT machines.\n\
    - Linux can use smbfs to use SMB servers.\n- Workgroups have no central password\
    \ authentication, while domains use a central password server.\n- SWAT allows\
    \ you to easily administer your Samba configuration.\n\nNotes:\n\n## Lecture 8\n\
    \n### E-mail\n\n### Objectives\n\n- Set Up Sendmail\n- Forward Mail\n- Set Up\
    \ Simple Mailing Lists\n- Set Up Remote Connections Using POP and IMAP\n\n## Lesson\
    \ 8.1\n\n### Setting up Sendmail\n\n- The Mail Transport Agent (or MTA) for Red\
    \ Hat Linux is sendmail.\n- Sendmail is the standard for most Linux installations,\
    \ although there are others available.\n- A majority of the e-mail that travels\
    \ around the world travels through a sendmail server.\n- When e-mail is sent from\
    \ sendmail, it goes from the mail client to the server, where it is held in a\
    \ queue.\n- When the e-mail gets to the head of the queue, sendmail attempts to\
    \ send the e-mail to the recipient.\n- Sendmail cannot connect to the remote SMTP\
    \ server, it keeps the message in the queue and attempts to send the e-mail every\
    \ hour.\n- There are a number of reasons why an e-mail message would be held in\
    \ a queue.\n  - One is that there is the network between you, and the remote machine\
    \ is down.\n  - Another is that your local server is not on the Internet all the\
    \ time.\n  - The mailq command will list what sendmail has in queue and the reason\
    \ why an e-mail message is stuck in the queue.\n  - If there is a lot of e-mail\
    \ in the queue, you may have a network or configuration problem.\n- Verify that\
    \ sendmail is running by connecting to TCP port 25.\n\n```\n[kmomarinski@hudson\
    \ mkomarinski]$ telnet localhost 25\nTrying 127.0.0.1...\nConnected to localhost.\n\
    Escape character is '^'.\n220 hudson.wayga.org SMTP Sendmail 8.11.2/8.11.2; Sun,\
