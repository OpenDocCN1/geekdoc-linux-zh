  - '[PAGE 156]


    # LECTURE 10 X WINDOWING SYSTEM


    # Lesson 10.3


    gdm


    +   - You can start a graphical login using gdm, the GNOME Display manager.

    - The gdm program is started automatically when in runlevel 5, and you can select
    at install time if you want gdm started or not.

    - You can also have gdm configured to reboot or halt the machine without requiring
    a user to log in.

    - If you are using gdm on the local machine only, there is no need to configure
    gdm to get it to run so long as X is already working properly.

    - The most recent version of gdm is network aware, allowing you to have slower
    X clients connect to your Red Hat server.

    - The protocol to allow you to do this is called XDMCP.

    - If you are using gdm as an XDMCP server, you do not need to configure X on your
    server. Just make sure that the applications are installed.

    - The configuration files for gdm are located in /etc/X11/gdm, and the main configuration
    file is /etc/X11/gdm/gdm.conf.

    - Edit this file, changing the following:

    - the [xdmcp] section, change Enable=0 to Enable=1.

    - Change Honor Indirect from 0 to 1. Without Honor Indirect, an XDMCP client would
    have to know the IP address of the XDMCP server before starting.

    - The other options under [xdmcp] are for regulating the number of clients that
    are connected to the server. This is to prevent some forms of Denial of Service
    attacks against your servers.

    - If you are using gdm server only, and don''t want to run X on the console, skip
    forward to the [servers] section, and make sure all lines are commented out.

    - If gdm is already running, stop and restart it by going to runlevel 3, then
    back to runlevel 5.

    - For XDMCP clients, make sure that X works.

    - Shut down X and restart it with the command xinit --broadcast.'
  - '[PAGE 157]


    +   - You''ll be given a list of XDMCP broadcast servers that are available. Select
    one, and you''ll be presented with the gdm login screen for that host.

    - If you want to talk to a single machine, use xinit --query hostname.

    - As a security precaution, you should block TCP/IP port 177 at your firewall.
    This is the port used by gdm.


