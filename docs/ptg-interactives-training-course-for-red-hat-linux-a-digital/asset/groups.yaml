  - "[PAGE 73]\n\n# /etc/xinetd.d\n\n+   The /etc/xinetd.d directory contains a list\
    \ of files that xinetd reads and uses to know what ports to monitor. The following\
    \ example contains the configuration file xinetd uses to monitor the port used\
    \ by finger.\n\n# Configuration file for finger\n\n```\n# default: on\n# description:\
    \ The finger server answers finger requests.\nFinger is \\\n# a protocol that\
    \ allows remote users to see\ninformation such \\\n# as login name and last login\
    \ time for local users.\nservice finger\n{\n    socket_type = stream\n    wait\
    \ = no\n    user = nobody\n    server = /usr/sbin/in.fingerd\n    disable = yes\n\
    }\n```\n\n+   The service line indicates the name of the service that is being\
    \ defined, which is finger in this case. There are several additional parameters\
    \ set within the service section:\n\n+   - socket_type, which is set to stream,\
    \ meaning that we're using TCP instead of UDP.\n- The wait option allows xinetd\
    \ to either start new processes of this service as needed, or run only one service\
    \ at a time.\n- The user option lists the username that the command will run as,\
    \ if any.\n- server lists the command that will run when activated.\n- disable\
    \ shows whether or not this service is disabled.\n\n+   Some high-throughput programs\
    \ (apache and sendmail prime examples), you do not want to have constantly restarting\
    \ since it takes a lot of time; these will fork off or spawn new processes as\
    \ needed."
