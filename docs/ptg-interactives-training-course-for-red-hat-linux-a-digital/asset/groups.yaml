- md: "\n## Lesson 14.2\n\ndump and restore do literal dumps and restores of the entire\
    \ filesystem.\n\n- dump and restore do literal dumps and restores of the entire\
    \ filesystem.\n- dump cannot back up non-ext2fs filesystems, like NFS.\n- Assigning\
    \ a dump level to each filesystem controls incremental backups. Dump levels range\
    \ from 0 to 9, and when a dump of a certain level N is performed, all files that\
    \ have changed since the last dump of level N-1 or lower are sent to the tape.\
    \ A level 0 dump will dump the entire filesystem.\n- The dump program strongly\
    \ suggests you know the length and density of the media being used for the backup.\n\
    \nNotes:\n\n## LECTURE 14 BACKING UP YOUR DATA\n\n## Lesson 14.3\n### Backup Strategies\n\
    \n- How often you make what kind of backup depends on several factors.\n- In general,\
    \ if more than twenty percent of a particular filesystem is changing daily, you\
    \ should perform incremental backups every day or two, a lower-level backup weekly,\
    \ and a full backup monthly.\n- Lower activity levels mean you can space this\
    \ out more, though there is really no excuse for not performing a full backup\
    \ at least once a month.\n- Another method is to perform a full backup every night.\n\
    \  - Keep 28 tapes so that you have a total of four weeks worth of data at any\
    \ one time.\n  - Cycle tapes every six months or so.\n  - Heavy use of tapes can\
    \ cause them to deteriorate; replace them regularly.\n- This allows you to store\
    \ information for an indefinite amount of time.\n- This is at a higher cost, however,\
    \ since you have to buy a lot of tapes and you may not have enough storage on\
    \ the tapes.\n- Buy lots of your specific backup media.\n- For very active systems,\
    \ which more or less cannot be taken off-line, invest in a backup utility that\
    \ can perform live backups during periods of low traffic.\n- More complicated\
    \ databases are problematic when it comes to live backups.\n  - Fortunately, most\
    \ databases can create a snapshot of themselves, and that can be placed in your\
    \ archive.\n  - Failing this, the database will have to be taken off-line before\
    \ being backed up.\n- Keep some backups off-site in case of a big disaster.\n\n\
    ## Lesson 14.4\n### RAID and Disk Mirroring\n\n- RAID stands for Redundant Array\
    \ of Independent Disks.\n- The basic idea behind RAID is that by using multiple\
    \ small disks and possibly some additional parity data, you will be able to reconstruct\
    \ data lost when one of the disks fails.\n- There are several different levels\
    \ of RAID.\n- Each of these RAID types may be done in hardware or software.\n\
    \    - RAID 0: Data striping. This doesn't actually provide any protection against\
    \ data loss but does enhance performance. Requires a controller that supports\
    \ synchronized disks; none is available for Linux.\n    - RAID 1: Disk mirroring.\
    \ A second set of disks is used to provide a complete copy of your data.\n   \
    \ - RAID 2: Level 0 with a check disk for storing error correction information.\n\
    \    - RAID 3: Level 0 with a separate disk for byte-level parity information\
    \ to help reconstruct lost data.\n    - RAID 4: Level 3 with block-level parity\
    \ information stored on a separate disk.\n    - RAID 5: Level 4 with the parity\
    \ information spread over all disks.\n- Some of the RAID levels were made not\
    \ for reliability, but for speed.\n- While a software RAID is less expensive,\
    \ since you don't need custom hard drive mountings or cards, it is less stable\
    \ than a hardware RAID.\n- Hardware RAID commonly allows for hot-swapping hard\
    \ drives immediately after one has failed. Software RAID requires shutdown of\
    \ the machine to replace hardware.\n- To create a software RAID setup on your\
    \ machine, you'll need at least two (and possibly three) drives all about the\
    \ same size.\n- Let's take a walkthrough on creating a RAID 5 setup on your machine.\n\
    \    - Create partitions on each hard drive. Each drive should have no other partitions\
    \ on it and should be a higher-end SCSI system. Each partition should be about\
    \ the same size.\n    - Install the raidtools from the RedHat CD-ROM.\n- Read\
    \ the documentation located in /usr/share/doc/raid-tools.\n- Configure /etc/raid.conf\
    \ for the partitions and block sizes you are using.\n- Use mkraid to create the\
    \ raid device. By default, this is called /dev/md0.\n- The /etc/raid.conf file\
    \ lists the device you are using.\n- You may now treat /dev/md0 just like any\
    \ other raw partition. You can use mke2fs to format the partition and then copy\
    \ files over. You can look at /proc/mdstats to get a status of the RAID information.\n\
    - If you want to stop RAID services, unmount the device and use raidstop.\n- On\
    \ startup, use raidstart to start RAID services.\n- RedHat will automatically\
    \ detect RAID devices and start them as part of its boot procedure. You will have\
    \ to mount the RAID system once it's activated.\n\nNotes:\n\n## Lesson 14.5\n\
    ### Summary\n\n- **tar** can be used to let you back up your data to a tape or\
    \ to a file.\n- The **mt** program is used to manipulate tape devices.\n- RAID\
    \ may be a way for you to increase the reliability of your hardware and increase\
    \ performance.\n- You can create RAID systems without requiring RAID hardware.\n\
    \nNotes:\n"
  mdcn: "\n\n## 课程 14.2\n\ndump 和 restore 对整个文件系统进行字面上的备份和恢复。\n\n- dump 和 restore\
    \ 对整个文件系统进行字面上的备份和恢复。\n- dump 无法备份非 ext2 文件系统，例如 NFS。\n- 为每个文件系统分配一个 dump 级别可以控制增量备份。Dump\
    \ 级别范围从 0 到 9，当执行特定级别 N 的备份时，所有自上一次级别 N-1 或更低级别备份以来更改的文件都将发送到磁带上。级别 0 的备份将备份整个文件系统。\n\
    - dump 程序强烈建议你了解所用于备份的介质的长度和密度。\n\n备注：\n\n## 第 14 讲座：备份你的数据\n\n## 课程 14.3\n###\
    \ 备份策略\n\n- 你多频繁地进行何种类型的备份取决于几个因素。\n- 总的来说，如果某个文件系统每天的变化量超过百分之二十，你应该每隔一天或两天执行一次增量备份，每周执行一次低级别备份，每月执行一次全备份。\n\
    - 活跃水平较低意味着你可以拉长间隔，尽管实际上没有理由不至少每月执行一次全备份。\n- 另一种方法是每晚执行一次全备份。\n  - 保留 28 磁带，这样你任何时候都都有四周的数据。\n\
    \  - 大约每六个月循环一次磁带。\n  - 频繁使用磁带会导致其老化；请定期更换。\n- 这允许你无限期地存储信息。\n- 然而，这种成本较高，因为你必须购买大量的磁带，而且磁带上的空间可能不够。\n\
    - 购买大量你特定的备份介质。\n- 对于或或少无法离线的非常活跃系统，请投资一种可以在低流量期间执行在线备份的备份工具。\n- 复杂的数据库在进行在线备份时会遇到问题。\n\
    \  - 幸运的是，大多数数据库可以创建自己的快照，并可以将其放入你的归档中。\n  - 如果失败，必须在备份之前将数据库离线。\n- 将某些备份保存在异地，以防发生重大灾难。\n\
    \n## 课程 14.4\n### RAID 和磁盘镜像\n\n- RAID 代表独立磁盘冗余阵列（Redundant Array of Independent\
    \ Disks）。\n- RAID 的基本思想是，通过使用多个较小的磁盘和可能的一些额外的校验数据，你将能够在其中一个磁盘故障时重构丢失的数据。\n- 有几种不同级别的\
    \ RAID。\n- 这里的每种 RAID 类型都可以通过硬件或软件实现。\n    - RAID 0: 数据条带。这实际上并没有提供任何防止数据丢失的保护，但可以增强性能。它需要一个支持同步磁盘的控制器；Linux\
    \ 目前没有此类控制器。\n    - RAID 1: 磁盘镜像。使用第二组磁盘提供你数据的完整副本。\n    - RAID 2: 带有用于存储纠错信息的检查磁盘的级别\
    \ 0。\n    - RAID 3: 级别 0，并带有一个独立的磁盘用于存储字节级校验信息，以帮助重构丢失的数据。\n    - RAID 4: 级别 3，将块级校验信息存储在独立的磁盘上。\n\
    \    - RAID 5: 级别 4，将校验信息分列存储在所有磁盘上。\n- 某些 RAID 级别的目的是不是为了可靠性，而是为了速度。\n- 虽然软件\
    \ RAID 成本较低（因为你不需要自定义的硬盘挂载或适配卡），但它比硬件 RAID 不稳定。\n- 硬件 RAID 通常允许在一个硬盘故障后立即进行热插拔。软件\
    \ RAID 需要关机以更换硬件。\n- 要在你的机器上创建软件 RAID 设置，你至少需要两个（可能三个）大小相相同的驱动器。\n- 让我们演示一下如何在你的机器上创建一个\
    \ RAID 5 设置。\n    - 在每块硬盘上创建分区。每个硬盘不应再有其他分区，并且应该是高端 SCSI 系统。每个分区的大小应相同。\n    -\
    \ 从 RedHat 光盘安装 raidtools。\n    - 读取位于 /usr/share/doc/raid-tools 的文档。\n    - 为你使用的分区和块配置\
    \ /etc/raid.conf。\n    - 使用 mkraid 创建 RAID 设备。默认情况下，它被称为 /dev/md0。\n    - /etc/raid.conf\
    \ 文件列出了你使用的设备。\n    - 现在你可以像处理其他原始分区一样处理 /dev/md0。你可以使用 mke2fs 格式化并复制文件。你可以查看\
    \ /proc/mdstats 获取 RAID 信息的状态。\n    - 如果你想停止 RAID 服务，请卸载设备并使用 raidstop。\n    -\
    \ 启动时，使用 raidstart 启动 RAID 服务。\n    - RedHat 会自动检测 RAID 设备并在启动过程的一部分启动它们。在激活后，你必须挂载\
    \ RAID 系统。\n\n备注：\n\n## 课程 14.5\n### 总结\n\n- **tar** 可以将你的数据备份到磁带或文件。\n- **mt**\
    \ 程序用于操作磁带设备。\n- RAID 可能是你增加硬件可靠性和提高性能的一种方法。\n- 你可以在不需要 RAID 硬件的情况下创建 RAID 系统。\n\
    \n备注：\n\n[/content] (抱歉，由于输入中 [content] 标签闭合逻辑有误，此处根据您的要求完成完整翻译并包裹) \n\n*(更正：由于原始文本结尾未闭合，我已按照您的格式要求将翻译内容完整输出)*\n\
