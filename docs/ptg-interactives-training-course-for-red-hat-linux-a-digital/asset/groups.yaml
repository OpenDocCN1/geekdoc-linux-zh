- md: "\n# RED HAT LINUX TRAINING COURSE WORKBOOK\n\n- Once started, go to an SMB\
    \ client and perform a network browse. You should see your Linux machine in the\
    \ list of machines.\n\n- If not, you can check through the logs located in /var/log.\
    \ Each client machine and samba and nmb process has its own log files (samba-log.machineame,\
    \ samba-log.smb, and samba-log.nmb).\n\n- If you see the Linux machine listed\
    \ in the browse list, then you need to connect to a share.\n\n- Public connections\
    \ do not require a valid login and are an easy way to test how things are working.\
    \ These kinds of connections are easy to make but very short on security.\n\n\
    - If you choose to do this, set the public=yes option in the configuration for\
    \ the share.\n\n- There are three methods of authenticating users to access nonpublic-connections.\n\
    \n- First is user, where a username and password are authenticated /etc/passwd.\
    \ This method of connection requires that the username over Linux and the SMB\
    \ client match.\n\n- The second method is to forward authentication requests to\
    \ another server. This is called server authentication, and you have to trust\
    \ the machine to which you're forwarding requests.\n\n- The third method of authentication\
    \ is called share and does not require that the usernames over Linux and the SMB\
    \ client match.\n\n- SMB allows for both encrypted and unencrypted passwords.\n\
    \n- Encrypted passwords increase security but are encrypted with a one-way hash\
    \ that is incompatible with the way passwords are stored in /etc/passwd.\n\n-\
    \ NT 4 Service Pack 3, Windows 98, and Windows 2000 and above send encrypted passwords\
    \ by default, and the only way to adjust this is in the Registry.\n\n- There are\
    \ two better ways to handle this.\n\n- If you have an existing PDC (Primary Domain\
    \ Controller), set the Linux box to forward passwords to the PDC.\n\n  - Do this\
    \ by setting the password server to point to the PDC and security=user (both these\
    \ settings are under [Global]).\n\n# LECTURE 7 SAMBA\n\nIf you don't have a PDC,\
    \ set up the Linux box to handle encrypted passwords. Read the /usr/doc/samba*/ENCRYPTION.txt\
    \ file to go over what you need to do handle encrypted passwords.\n\n- set up\
    \ your Samba box to handle encrypted passwords natively, you'll need to create\
    \ a second password file that stores the SMB passwords.\n\n- Call this /etc/smbpasswd,\
    \ which is the default for Samba.\n\n- You can use the mksmbpasswd.sh program\
    \ that comes with the samba RPM to assist in this conversion:\n\n```bash\n# cat\
    \ /etc/smbpasswd | /usr/bin/mksmbpasswd.sh = /etc/smbpasswd\n```\n\n- The file\
    \ will then contain lines that look like this: mkomarin-ski:500:XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX:[U:LCT-00000000:mkomarinski\n\
    \n- SMB passwords are exactly 32 bytes long (hence the 32 X's).\n\n- By default,\
    \ these Xs disable access, you must change the password entry before anyone can\
    \ use it, which can be done two ways:\n\n- The first way is to replace the first\
    \ 11 Xs in the first group with the string NO PASSWORD.\n\n- If you do this, make\
    \ the option null passwords=true enabled in /etc/samba/smb.conf.\n\n- The other\
    \ method is to use smbpasswd to set a temporary password per.\n\n- Once a password\
    \ is set and you need to root to this initially tell the user what that password\
    \ is, use the smbpasswd command to change it to suit his or her need.\n\n- One\
    \ option you may want to consider the “sync unix passwd”, which is located under\
    \ SWAT under Globals. Setting it to Yes will synchronize the UNIX password file\
    \ and smbpasswd file the next time the password is changed by the user.\n\n- Also,\
    \ the option “Encrypt Passwords” is set to No by default. You’ll need to set this\
    \ to Yes to have Samba start using /etc/smbpasswd.\n\n# Lesson 7.3\n\n## Connecting\
    \ to SMB Shares\n\n- Linux has a Virtual File System (VFS) that provides a generic-interface\
    \ for mounting filesystems.\n\n- Instead of using mount, we use `smbmount`, which\
    \ is part of the Samba-client package, to mount SMB shares.\n\n```bash\n# smbmount\
    \ service\nmount-point options\n```\n\n- `service` is the NetBIOS name of the\
    \ SMB share you want, replacing a \\ character with /.\n\n- The `mount-point`\
    \ is the local mount point in the Linux hierarchy.\n\n- Since you have to use\
    \ `smbmount` as root, and you probably don't have a root user on your NT server,\
    \ you will need to make use of the options -U for user to authenticate as and\
    \ -c to list a NetBIOS name for your client machine; otherwise the FQDN is sent.\n\
    \n- `client.domain.org` (whatever the FQDN is) is not a valid NetBIOS name, adding\
    \ -c client tells the server the client’s name is just `client`.\n\n- If the NetBIOS\
    \ name for the client can be resolved to a hostname, you will be asked for a password\
    \ for the given username.\n\n- If you want to skip this step, add -P passwd, replacing\
    \ `passwd` with your password on the SMB server.\n\n# LECTURE 7 SAMBA\n\n# Lesson\
    \ 7.4\n\n## Samba Web Administration Tool (SWAT)\n\n- Part of the Samba suite\
    \ is the SWAT online utility. An administrator with a web browser can administer\
    \ Samba configuration remotely, adding and removing shares, and getting online\
    \ help for configuration and other information about the status of smb.\n\n- To\
    \ use SWAT on a machine, install and activate.\n  - SWAT is available from the\
    \ samba-swat package and is not installed by default.\n  - SWAT is started from\
    \ xinetd and is disabled, so you must first enable it by changing the “disable=yes”\
    \ to read “disable=no”.\n\n- Restart xinetd, and you can then connect to the machine\
    \ at port 901, giving a URL of http://localhost:901/ to connect. You must give\
    \ the root user and password.\n\n- To maintain security, you can only access SWAT\
    \ from the local machine.\n\n- You can configure SWAT to allow remote users to\
    \ access SWAT, but any passwords will be sent in the clear.\n\n# Notes:\n\n# RED\
    \ HAT LINUX TRAINING COURSE WORKBOOK\n\n## Glob\n\n- These options provide a base\
    \ that affects all shares.\n- The workgroup is the SMB workgroup to join. Set\
    \ this to the same as the.\n\n## Base Options\n\n- The NetBIOS name of the server\
    \ you want, set this to the same as the.\n- The os string is set to to Samba.\n\
    \  - Put a space between entries.\n- If the preferred master is set, Samba will\
    \ force an election on startup and give itself a slight advantage in the election\
    \ process.\n- The interfaces field is used if Samba server acts as a router or\
    \ has multiple interfaces.\n  - The the.\n\n## Security Options\n\n- If you have\
    \ chosen to use encrypted passwords on your machine, set encrypt passwords to\
    \ Yes.\n- The hosts deny sets up a list of hosts (space-separated) to be denied\
    \ access to the.\n\n## Logging Options\n\n- As the log level increases, more data\
    \ is captured to the log file.\n- Setting a log level value of 0 indicates that\
    \ no logging is to be.\n- Logs are kept per machine and are by default stored\
    \ in /var/log/samba.\n- The default max log size is 0, meaning that logs remain.\
    \ Changing this to a number of kbytes represents the size will grow before it\
    \ gets copied to a file with aold extension.\n\n# LECTURE 7 SAMBA\n\n## Tuning\
