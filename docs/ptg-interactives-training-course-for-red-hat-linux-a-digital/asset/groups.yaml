- md: "\n## Lesson 10.5\n## Using Remote Displays\n\n- X can send the output of a\
    \ program to another X server.\n- Since X separates the client from the server,\
    \ client applications can be run over a network to a remote server that is running\
    \ X.\n- Three things are required for remote displays to work.\n  - There must\
    \ be a TCP/IP connection between the two machines.\n  - The X server has to know\
    \ that a client wants to send a display. This can be done with `xhost`.\n    -\
    \ `xhost +` will allow connections to your X server from anywhere.\n    - Running\
    \ `xhost +host` adds `host` to the list of machines that can access your display.\n\
    \    - You can deny access using `xhost -host`.\n  - The client program needs\
    \ to know where to send the display. This can be done using `-display` or by setting\
    \ the DISPLAY environment variable.\n  - Displays are set with two items: the\
    \ host to display on and the X server running on that host to display. The server\
    \ itself is broken into two parts: the server number and display number. Since\
    \ X can handle multiple monitors at the same time, you will need to specify to\
    \ which host, X server, and monitor to send the client program.\n\n- The XFree86\
    \ server also allows multiple X servers per machine, each on different virtual\
    \ clients. The first X server is located at Virtual Console 7, which you can access\
    \ by pressing ALT-F7. You can start more X servers by using gdm and adding lines\
    \ to /etc/X11/gdm/gdm.conf. At the end of the file is a section called `[servers]`.\
    \ The section looks like this:\n\n```ini\n[servers]\n0=/usr/bin/X11/Xvt vt7 -deferoglyphs\
    \ 16\n```\n\n- Here we see that server 0 is running on virtual terminal 7. If\
    \ you want to start another server on virtual console 8, use the following:\n\n\
    ## LECTURE 10 X WINDOWING SYSTEM\n\n```ini\n[servers]\n0=/usr/bin/X11/Xvt7 -deferglyphs\
    \ 16\n1=/usr/bin/X11/Xvt8 -deferglyphs 16\n```\n\n- The server and monitor always\
    \ begin counting at 0, making the first X server 0.0. The second server is called\
    \ 1.0 and so on.\n\n## Lesson 10.6\n## Summary\n\n- X is the most popular standard\
    \ for graphics display on Linux and UNIX.\n- The separation that X gives between\
    \ client and server gives users a high amount of configurability.\n- GNOME and\
    \ KDE are the two most popular desktop environments for Linux.\n- You can send\
    \ windows across the network with X.\n\n## Lecture 11\n## Securing Linux\n###\
    \ Objectives\n\n- Protect Hardware\n- Protect Software\n- Protect Your Network\n\
    - Configure Packet Filtering\n\n## Lesson 11.1\n## Physical Security\n\n- The\
    \ easiest and most overlooked form of security is physical.\n- For machines that\
    \ are in public or semi-public areas, you may want to do some of the following:\n\
    \  - Lock the BIOS and set the BIOS to boot only from the first hard drive.\n\
    \  - Do not use LILO or at least make it boot directly into Linux.\n  - Do not\
    \ have DOS or any other OS on the machine.\n  - Lock the PC case.\n  - You should\
    \ also have people on hand to assist with problems and prevent anyone from having\
    \ the chance to take a computer apart.\n- Server machines should always be behind\
    \ locked doors, with very limited access to keys.\n\n## LECTURE 11 SECURING LINUX\n\
    ## Lesson 11.2\n## Software Security\n\n- Programs like COPS, TripWire, and LIDS\
    \ (Linux Intrusion Detection System) allow you to routinely monitor your system\
    \ to detect possible holes or to detect some forms of break-ins.\n- A program\
    \ like SATAN will monitor an entire network and report on possible holes.\n- Tripwire\
    \ is part of the PowerTools CD-ROM. The idea behind Tripwire is that you create\
    \ hashes of files and store the hashes in a read-only place (such as a floppy\
    \ disk).\n- Periodically, Tripwire compares the hashes against the files and notes\
    \ any differences. If you did not authorize any changes, this may indicate a crack\
    \ attempt, or a trojan horse program.\n- The list of files that TripWire checks\
    \ is listed in /etc/tw.config.\n- For the most part, these are system directories,\
    \ including /etc, /bin, /sbin, and /dev.\n- Once you have the /etc/tw.config file\
    \ to your liking, run `tripwire -initialize`. This will create an initial database\
    \ hash of the files you wish to monitor. This database file is located in /etc/spool/tripwire.\n\
    - When the database is set up, running the tripwire program itself will perform\
    \ a check against the database.\n\n## Secure Shell (SSH)\n\n- Most break-ins occur\
    \ when machines have insecure services such as telnet and FTP running.\n- The\
    \ Secure Shell (SSH) was developed as a response to both telnet and FTP, allowing\
    \ for file transfers and shell access over an encrypted link.\n- The SSH program\
    \ encrypts the entire transaction of the link.\n- SSH also does some checking\
    \ to verify the host you are connecting from and the host you are connecting to.\n\
    - Commercial versions of SSH for Linux are available.\n- The SSH program encrypts\
    \ the entire transaction of the link.\n- SSH also does some checking to verify\
    \ the host you are connecting from and the host you are connecting to.\n- Commercial\
    \ versions of SSH for Linux are available.\n- The SSH program encrypts the entire\
    \ transaction of the link.\n- SSH also does some checking to verify the host you\
    \ are connecting from and the host you are connecting to.\n- Commercial versions\
    \ of SSH for Linux are available.\n- The SSH program encrypts the entire transaction\
    \ of the link.\n- SSH also does some checking to verify the host you are connecting\
    \ from and the host you are connecting to.\n- Commercial versions of SSH for Linux\
    \ are available.\n- The SSH program encrypts the entire transaction of the link.\n\
    - SSH also does some checking to verify the host you are connecting from and the\
    \ host you are connecting to.\n- Commercial versions of SSH for Linux are available.\n\
    - The SSH program encrypts the entire transaction of the link.\n- SSH also does\
    \ some checking to verify the host you are connecting from and the host you are\
    \ connecting to.\n- Commercial versions of SSH for Linux are available.\n- The\
    \ SSH program encrypts the entire transaction of the link.\n- SSH also does some\
    \ checking to verify the host you are connecting from and the host you are connecting\
    \ to.\n- Commercial versions of SSH for Linux are available.\n- The SSH program\
    \ encrypts the entire transaction of the link.\n- SSH also does some checking\
    \ to verify the host you are connecting from and the host you are connecting to.\n\
    - Commercial versions of SSH for Linux are available.\n- The SSH program encrypts\
    \ the entire transaction of the link.\n- SSH also does some checking to verify\
    \ the host you are connecting from and the host you are connecting to.\n\n- Users\
    \ can create their own RSA keys using `ssh-keygen`.\n- If regular password authentication\
    \ is not used, the RSA key generated by `ssh-keygen` is used.\n- The public key\
    \ (located in ~/.ssh/) should be added to ~/.ssh/authorized_keys of all the machines\
    \ you want to log in.\n\n## tcpd\n\n- The tcpd program can cut off your site from\
    \ a bad site and specify sites can come in.\n- The tcpd program matches up incoming\
    \ IP address with a table.\n  - If the IP address is listed in /etc/hosts.allow,\
    \ the connection is allowed.\n  - If it is listed in /etc/hosts.deny, the connection\
    \ is refused.\n  - If the IP address does not match an entry in either file, then\
    \ access is denied.\n- The tcpd program works only with programs that are typically\
    \ started with inetd — telnet, finger, FTP, talk, and a few others.\n- When setting\
    \ up tcpd for allowing or disallowing connections, the access control is the same.\n\
    \n```text\ndaemon_list : client_list\n[ : shell_command ]\n```\n\n- The daemon_list\
    \ is the name of the program that is running (telnet, ftppd, etc.). The client_list\
    \ can be any of the following:\n  - Strings beginning with a period (.) are assumed\
    \ to be part of a domain.\n  - Strings ending with a period (.) are assumed to\
    \ be an IP address or subnet.\n  - A string starting with @ is assumed to be a\
    \ NIS netgroup.\n  - n.n.n/n.m.m.m is a net and mask pair. This gives finer control\
    \ for matching IP addresses. Using this method over n.n.n is preferred, since\
    \ you are explicitly listing the network addresses allowed.\n- There are also\
    \ a few special keywords such as ALL, LOCAL, UNKNOWN, and so on.\n  - shell_command\
    \ is optional and is sent to /bin/sh for processing. This should be a secure script\
    \ that sets its PATH and other environment variables.\n"
  mdcn: "\n\n## Lesson 10.5 \n## 使用远程显示器\n\n- X 可以将程序的输出发送到另一个 X 服务器。\n- 由于 X 将客户端与服务器分离，客户端应用程序可以通过网络运行在正在运行\
    \ X 的远程服务器上。\n- 远程显示器工作需要满足以下三个条件：\n  - 两台机器之间必须有 TCP/IP 连接。\n  - X 服务器必须知道某个客户端想要发送显示。这可以通过\
    \ `xhost` 实现。\n    - `xhost +` 将允许从任何地方向你的 X 服务器建立连接。\n    - 运行 `xhost +host`\
    \ 会将 `host` 添加可以访问你显示器的机器列表中。\n    - 你可以使用 `xhost -host` 拒绝访问。\n  - 客户端程序需要知道将显示发送到哪里。这可以使用\
    \ `-display` 参数或设置 `DISPLAY` 环境变量来实现。\n  - 显示由两个项设置：要在哪个主机上显示，以及在该主机上运行用于显示的 X\
    \ 服务器。服务器本身被分为两部分：服务器编号和显示器编号。由于 X 可以同时处理多个显示器，你将需要指定将客户端程序发送到哪个主机、哪个 X 服务器以及哪个显示器。\n\
    \n- XFree86 服务器还允许每台机器运行多个 X 服务器，每个服务器位于不同的虚拟客户端上。第一个 X 服务器位于虚拟控制台 7（Virtual Console\
    \ 7），你可以通过 ALT-F7 访问。你可以使用 gdm 并向 /etc/X11/gdm/gdm.conf 中添加行来启动更多的 X 服务器。文件的末尾有一个名为\
    \ `[servers]` 的部分。该部分所示：\n\n```ini\n[servers]\n0=/usr/bin/X11/Xvt vt7 -deferoglyphs\
    \ 16\n```\n\n- 在这里看到服务器 0 运行在虚拟终端 7 上。如果你想在虚拟控制台 8 上启动另一个服务器，请使用以下命令：\n\n## 第10讲课\
    \ X 窗口系统\n\n```ini\n[servers]\n0=/usr/bin/X11/Xvt7 -deferglyphs 16\n1=/usr/bin/X11/Xvt8\
    \ -deferglyphs 16\n```\n\n- 服务器和显示器始终从 0 开始计数，因此第一个 X 服务器是 0.0。第二个服务器称为 1.0，以此类推。\n\
    \n## Lesson 10.6\n## 总结\n\n- X 是 Linux 和 UNIX 上最流行的图形显示标准。\n- X 在客户端和服务器之间的分离为用户提供了很高的可性。\n\
    - GNOME 和 KDE 是 Linux 上最流行的两个桌面环境。\n- 你可以使用 X 跨网络发送窗口。\n\n## 第11讲\n## Linux 的安全防护\n\
    ### 目标\n\n- 保护硬件\n- 保护软件\n- 保护你的网络\n- 配置数据过滤\n\n## Lesson 11.1\n## 物理安全\n\n- 最简单且最容易忽视的安全性形式是物理安全。\n\
    - 对于位于公共或半公共区域的机器，你可能想要执行以下操作：\n  - 锁定 BIOS，并将 BIOS 设置为仅从第一个硬盘启动。\n  - 不要使用 LILO，或者至少让它直接进入\
    \ Linux。\n  - 上不要安装 DOS 或任何其他操作系统。\n  - 锁定 PC 机箱。\n  - 你还应该有人员在现场协助解决问题并防止任何人有机会拆解计算机。\n\
    - 服务器机器应始终放在锁好的门后，对钥匙的访问权限非常有限。\n\n## 第11讲 Linux 安全防护\n## Lesson 11.2\n## 软件安全\n\
    \n- 像 COPS、TripWire 和 LIDS（Linux 入侵检测系统）程序允许你定期监控系统，以检测可能的漏洞或检测某些形式的入侵。\n- 像 SATAN\
    \ 的程序会监控整个网络并报告可能的漏洞。\n- Tripwire 是系统的一部分，允许你定期监控系统以检测可能的漏洞或检测某些形式的入侵。\n"
