    # host 127.0.0.1\n\n# Allow access from machines on the local network\n255.255.255.0\
    \ 10.10.10.0\n\n# Access from two class C networks 209.1.2.0 and 209.1.3.0\n255.255.254.0\
    \ 209.1.2.0\n```\n\nThe host line allows ypserv to respond to specific hosts.\
    \ Since the localhost must be able to access the server, that host is listed.\
    \ Examples of allowing subnets are on the other two example lines.\n- The /etc/ypserv.conf\
    \ file lets you customize the server's behavior at the host or network level on\
    \ a per-map basis.\n- There are two types of entries: options and access rules.\n\
    \n- Options have the simple format of <option>: yes|no, i.e., the option is either\
    \ on or off. An option that is commonly turned on is dns.\n- Access rules have\
    \ the format host : map : security : passwd_mangle. Access rules are read until\
    \ a match is found for the host and map being requested, then the rule is applied.\n\
