  - "[PAGE 57]\n\n# Lesson 5.1\n\n# TCP/IP\n\n+   - The Transmission Control Protocol\
    \ / Internet Protocol (TCP/IP) is the way that UNIX (and other Internet-capable)\
    \ machines talk to each other.\n- Each machine that wants to talk TCP/IP to another\
    \ machine must have an IP address assigned.\n- An IP address is a 32-bit number\
    \ that has to be unique on the network. This number is split into four 8-bit bytes;\
    \ for example, 192.168.1.100.\n    - IP addresses can be split into two parts,\
    \ a subnet address and a host address. In the example, the subnet address is 192.168.1,\
    \ and the host address is 100.\n    - IP addresses can also be referred as names\
    \ to make them easier to remember. The Domain Name Service, or DNS, maps names\
    \ to IP addresses.\n    - DNS is set up in a hierarchical format, with one central\
    \ root server that is then split into top level domains (like .com, .gov, and\
    \ so on) and further by domains (like phtpr.com or white.gov).\n    - A host on\
    \ the Internet that has a full DNS name is also known as a FQDN, or a Fully Qualified\
    \ Domain Name.\n- At an application or system level, TCP/IP has over 65,000 ports\
    \ available for connecting. This allows for FTP, telnet, e-mail, WWW, DNS, and\
    \ hundreds of other functions to happen all at the same time, and separate from\
    \ each other.\n    - A list of the known ports and their uses is kept in /etc/services.\n\
    \    - For security reasons, ports lower than 1024 can be opened by root only.\n\
    - TCP/IP has three main packet types that you will probably run into: UDP (User\
    \ Datagram Protocol), TCP (Telnet Control Protocol), and ICMP.\n    - UDP is a\
    \ connectionless protocol. The packets are usually small, and interaction between\
    \ the client and server really consists of a number of openings and closings of\
    \ network connections."
- md: "\n— TCP is a connection-based protocol. The client talks to the server, the\
    \ port is opened, and the connection begins. When the connection closes, it should\
    \ be because both programs have finished their need for the network.\n\n— The\
    \ third type of packet (ICMP) can be thought of as a traffic reporter. If there\
    \ is an error in routing a packet, an ICMP packet is sent to report. ICMP is also\
    \ used as part of **ping** to test for connection delays between two hosts.\n\n\
    # Notes:\n\n# Ethernet\n\n- Ethernet was developed in the 1970s as a broadcast-style\
    \ network. If one host is talking to another, all other hosts will have the information,\
    \ and no other host will be able to communicate at the same time.\n\n- The more\
    \ common forms of Ethernet use a star configuration, where a cable from each machine\
    \ runs into a switch or hub.\n  - One advantage of the star-style network is that\
    \ all the members of the network do not have to contend for access to the network\
    \ at all. The hub or switch is much faster than negotiating traffic.\n  - In addition,\
    \ if the cable to one host goes down, none of the other hosts on the network will\
    \ fall off the network.\n\n- Each Ethernet adapter has a unique address (Media\
    \ Access Connector or MAC address) assigned to it by the Ethernet adapter manufacturer.\n\
    \  - When an Ethernet adapter wants to talk to another Ethernet adapter, it sends\
    \ a message containing its own MAC address, as well as the receiving MAC address.\
    \ If the receiving MAC address is on that run of cable, it gets the message.\n\
    \n- Collisions occur when two Ethernet adapters try to transmit at the same time.\
    \ If this happens, both adapters stop transmission, wait a random amount of time,\
    \ and retransmit.\n\n- Having too many collisions indicates a network that has\
    \ very heavy traffic and is running inefficiently. To correct this, you may want\
    \ to split the network into two networks or use a switch instead of a hub.\n\n\
    - Each Ethernet packet has to and from Ethernet addresses along with IP to and\
    \ from addresses, followed by the data, and finally some error-checking data to\
    \ verify that a packet arrives complete.\n\n- Even though all the other adapters\
    \ on a cable see a packet, they do not answer or respond. The only message that\
    \ all Ethernet adapters should receive is an Ethernet broadcast.\n\n- For a packet\
    \ to get from one subnet to another, a router is used. If the router knows that\
    \ a particular packet needs to be forwarded to another subnet, it forwards the\
    \ packet.\n\n# LECTURE 5 NETWORKING WITH LINUX\n\n- The Address Resolution Protocol\
    \ (or ARP) cache allows Linux (and TCP/IP) to make connections between an Ethernet\
    \ address and an IP address.\n  - Linux first sends an Ethernet broadcast asking\
    \ for a mapping from an IP address to a MAC address.\n  - The receiving end with\
    \ that IP address responds with an ARP reply, giving the IP address and its MAC\
    \ address.\n  - Linux stores MAC address in an ARP cache for future use.\n- There\
    \ is an option for TCP/IP packets to set the maximum size of the IP packets.\n\
    \  - Each physical medium has its own Maximum Transmission Unit based on a balance\
    \ of latency (the amount of time it takes a packet to cross the medium) and the\
    \ amount of data that can be sent.\n  - Small packets have lower latency, but\
    \ decreased performance, since a larger percentage of the packet is header and\
    \ footer information. Large packets send more data efficiently, but have a higher\
    \ latency.\n\nNotes:\n\n# Connecting to an Ethernet Network\n\n- Install an Ethernet\
    \ card in your machine and reboot.\n- Red Hat's Kudzu utility will recognize the\
    \ card when you reboot and ask you to configure the card. You may choose to configure\
    \ the card at this time, or continue on and configure it later using **netcfg**.\n\
    - To add networking for this Ethernet card, you first have to initialize and set\
    \ up the IP interface, then you have to set up routing for that interface.\n-\
    \ The `/sbin/ifconfig` program will register the Ethernet card with the TCP/IP\
    \ services. The typical syntax is `# /sbin/ifconfig IPAddress`\n  - The mask and\
    \ broadcast addresses are given, followed by the IP address for the interface.\
    \ The interface is automatically brought up if you give it an IP address.\n- The\
    \ method of routing we use here is to set up a default gateway. This tells Linux\
    \ that any packets destined for another network get forwarded to the gateway,\
    \ which will hopefully know where to send it from. This is done via the command\
    \ `# route add default gw IPAddress`\n- **netcfg** is an excellent tool for setting\
    \ up your network devices. Get your IP address, nameserver information, gateway,\
    \ mask Under the Names section, verify the hostname, domain, and IP address for\
    \ your nameservers.\n  - The Hosts section lists what IP addresses and hostnames\
    \ you have in your `/etc/hosts` file. This should contain at least your IP address\
    \ and hostname.\n  - If you are not using DNS you will need to list all the hosts\
    \ you want to talk to along with their IP addresses under the Hosts section.\n\
    \  - The Interfaces section lists which interfaces are available to you. The LO\
    \ interface is the loopback interface and is used to route TCP/IP packets to the\
    \ local machine.\n  - The loopback interface always has an IP address of 127.0.0.1\
    \ and is required for many programs under Linux to work properly.\n\n- Next add\
    \ the Ethernet interface and give the IP address and netmask.\n\n- Don’t turn\
    \ on Configure Interface with BOOTP, but you can turn on Activate Interface at\
    \ boot time.\n\n- BOOTP is a protocol intended to dynamically assign IP addresses\
    \ at boot time. The DHCP server should be configured at boot time, use the network.\n\
    \nNotes:\n\n# DHCP\n\n- DHCP stands for Dynamic Host Configuration Protocol.\n\
    - When a machine using DHCP brings up its interface, it sends an Ethernet broadcast\
    \ requesting host. A server responds with:\n  - Hostname, routing, nameserver\
    \ information.\n  - The biggest advantage of DHCP is configurability. One central\
    \ location stores networking information for entire subnet.\n  - As new machines\
    \ are added to a network, they can be quickly put on the network, then changed\
    \ to use static IP address.\n\nNotes:\n\n# LECTURE 5 NETWORKING WITH LINUX\n\n\
    # DHCP Configuration\n\n# Server Configuration\n\n- Decide on whether to use dynamic\
    \ or static IP addressing.\n  - Static IP addresses allow you to use your existing\
    \ DNS and not have to worry about setting up a dynamic server.\n  - It is advisable\
    \ to leave 5 or 10 addresses available dynamically so that you can get a machine\
    \ on the.\n- There are two programs to give you access to DHCP services: the server\
    \ software dhcpd and client software pump.\n- There should be only one DHCP server\
    \ on a network\n- The DHCP server also provides BOOTP services; turn off any BOOTP\
    \ servers and use dhcpd instead.\n- The configuration file that dhcpd uses is\
    \ /etc/dhcpd.conf. This file contains MAC addresses, IP information, and router/WINS/nameserver\
    \ information. An example of this file is below.\n\nSample DHCP configuration\n\
    \n```\n# What's the DNS name of this server?\nserver-identifier hudson.wayga.org;\n\
    \n#Also identify the DNS domain that clients will be under\noption domain-name\
    \ \"wayga.org\";\n\n#What DNS servers should look at? (put at least 2)\noption\
    \ domain-name-servers shaft.wayga.org, hudson.wayga.org;\n\n# Define a Class C\
    \ network (192.168.1.0->192.168.1.255)\nsubnet 192.168.1.0 netmask 255.255.255.0\
    \ {\n\n# Set the network mask (again)\noption subnet-mask 255.255.255.0;\noption\
    \ domain-name \"wayga.org\";\noption domain-name-servers shaft.wayga.org, hudson.wayga.org;\n\
    \n# Define how long a lease for an IP address should be.\ndefault-lease-time 600;\n\
    \n#Max lease time, in case that's what the\n# client requests.\nmax-lease-time\
    \ 7200;\n```\n```\n"
  mdcn: "\n\n— TCP 是一种基于连接的协议。客户端与服务器通信，打开端口并建立连接。当连接关闭时，通常是因为两个程序都已完成对网络的需求。\n\n\
    — 第三种数据包（ICMP）可以被视为流量报告员。如果在路由数据包时发生错误，会发送一个 ICMP 包进行报告。ICMP 也用作 **ping** 的一部分，测试两个主机之间的连接延迟。\n\
    \n# 注意：\n\n# 以太网\n\n- 以太网开发于20世纪世纪70年代，是一种广播式网络。如果一个主机正在与另一个主机通信，所有其他主机都会收到该信息，并且没有其他主机可以同时通信。\n\
    \n- 更常见的以太网形式使用星型拓扑，每台机器的电缆都连接到交换机或集器器。\n  - 星型网络的一个优势是网络的所有成员完全不需要竞争访问网络。集器器或交换机的速度比流量协商快得多。\n\
    \  - 此外，如果连接某个主机的电缆故障，网络上的其他主机都不会掉线。\n\n- 每个以太网适配器都有一个由以太网适配器制造商分配的唯一地址（介质访问控制器或\
    \ MAC 地址）。\n  - 当以太网适配器想要与另一个以太网适配器通信时，它会发送一条包含自己的 MAC 地址以及接收方 MAC 地址的消息。如果接收方\
    \ MAC 地址在该电缆上，它就会接收该消息。\n\n- 当两个以太网适配器尝试同时传输时，就会发生冲突。如果发生这种情况，两个适配器都会停止传输，等待随机时间，然后重新传输。\n\
    \n- 过多的冲突表明网络流量非常大且运行效率低下。为了纠正这一点，你可能需要将网络分成两个网络，或者使用交换机代替集器器。\n\n- 每个以太网包都必须包含源和目的以太网地址，以及源和目的\
    \ IP 地址，随后是数据，最后是用于验证数据包完整到达的错误检查数据。\n\n- 尽管电缆上的所有其他适配器都能看到包，但它们不会回答或响应。所有以太网适配器应该收到的唯一消息是以太网广播。\n\
    \n- 数据包从一个子网传输到另一个子网需要使用路由器。如果路由器知道某个数据包需要转发到另一个子网，它就会转发该数据包。\n\n# 第 5 节 带有 Linux\
    \ 的网络\n\n- 地址解析协议（或 ARP）缓存允许 Linux（以及 TCP/IP）在以太网地址和 IP 地址之间建立连接。\n  - Linux 首先发送一个以太网广播，请求\
    \ IP 地址到 MAC 地址的映射。\n  - 拥有该 IP 地址的接收端用 ARP 响应回复，提供 IP 地址和 MAC 地址。\n  - Linux\
    \ 将 MAC 地址存储在 ARP 缓存中供以后使用。\n- TCP/IP 数据包有一个选项可以设置 IP 包的最大尺寸。\n  - 每个物理介质都有其自己的最大传输单元（MTU），这是基于延迟（数据包跨越介质所需的时间）和可发送数据量的平衡。\n\
    \  - 小包的延迟较低，但性能会降低，因为数据包中较大比例是头部和尾部信息。大包发送数据的效率更高，但延迟也更高。\n\n笔记：\n\n# 连接到以太网网络\n\
    \n- 在你的机器上安装以太网卡并重启。\n- Red Hat 的 Kudzu 工具会在你重启时识别该卡并要求你配置网卡。你可以在此时选择配置网卡，或者继续并在稍后使用\
    \ **netcfg** 进行配置。\n- 为此以太网卡添加网络，你必须先初始化并设置 IP 接口，然后必须为该接口设置路由。\n- `/sbin/ifconfig`\
    \ 程序会将以太网卡注册到 TCP/IP 服务。典型语法是 `# /sbin/ifconfig IPAddress`\n  - 给出掩码和广播地址，随后是接口的\
    \ IP 地址。如果你给它 IP 地址，接口会自动启动。\n- 我们在这里使用的路由方法是设置默认网关。这告诉 Linux 任何通往其他网络的数据包都将转发到网关，网关可能会知道从哪里发送。这是通过命令\
    \ `# route add default gw IPAddress` 实现的。\n- **netcfg** 是设置网络设备的优秀工具。获取你的 IP 地址、域名服务器信息、网关、掩码。在\
    \ Names 部分下，验证你域名服务器的主机名、域名和 IP 地址。\n  - Hosts 部分列出了你在 `/etc/hosts` 文件中的哪些 IP\
    \ 地址和主机名。这至少应该包含你的 IP 地址和主机名。\n  - 如果你不使用 DNS，你需要在 Hosts 部分列出所有你想要通信的主机及其 IP 地址。\n\
    \  - Interfaces 部分列出了你可用的哪些接口。LO 接口是环回接口，用于将 TCP/IP 包路由到本地机器。\n  - 环回接口的 IP 地址始终为\
    \ 127.0.0.1，Linux 下许多程序正常运行需要它。\n\n- 接下来添加以太网接口并给出 IP 地址和子掩码。\n\n- 不要开启“使用 BOOTP\
    \ 配置接口”，但你可以开启“启动时激活接口”。\n\n- BOOTP 是一种旨在启动时动态分配 IP 地址的协议。DHCP 服务器应在启动时配置，使用网络。\n\
    \n笔记：\n\n# DHCP\n\n- DHCP 代表动态主机配置协议。\n- 当使用 DHCP 的机器启动接口时，它会发送一个请求主机的以太网广播。服务器响应：\n\
    \  - 主机名、路由、域名服务器信息。\n  - DHCP 最大优势是可配置性。一个中心位置存储整个子网的网络信息。\n  - 当新机器加入网络时，可以快速进入网络，改为静态\
    \ IP 地址。\n\n笔记：\n\n# 第 5 节 带有 Linux 的网络\n\n# DHCP 配置\n\n# 服务器配置\n\n- 决定使用动态还是静态\
    \ IP 划分。\n  - 静态 IP 地址允许你使用现有的 DNS 而不必担心设置动态服务器。\n  - 建议留出 5 到 10 个动态地址，以便让机器进入。\n\
    \  - 有两个程序提供访问 DHCP 服务：服务器软件 dhcpd 和客户端软件 pump。\n  - 网络上应该只有一个 DHCP 服务器；关闭任何 BOOTP\
    \ 服务器并改用 dhcpd。\n  - dhcpd 使用的配置文件是 /etc/dhcpd.conf。该文件包含 MAC 地址、IP 信息以及路由器/WINS/域名服务器信息。该文件的示例。。示例\
    \ DHCP 配置\n\n```\n# 服务器的 DNS 名称是什么？\nserver-identifier hudson.wayga.org;\n\n#\
    \ 还要识别客户端所处的 DNS 域名\noption domain-name \"wayga.org\";\n\n# 应该查看哪些 DNS 服务器？（至少2\
    \ 个）\noption domain-name-servers shaft.wayga.org, hudson.wayga.org;\n\n# 定义一个\
    \ C 类网络 (192.168.1.0->192.168.1.255)\nsubnet 192.168.1.0 netmask 255.255.255.0\
    \ {\n\n# 设置网络掩码（再次）\noption subnet-mask 255.255.255.0;\noption domain-name \"\
    wayga.org\";\noption domain-name-servers shaft.wayga.org, hudson.wayga.org;\n\n\
    # 定义 IP 地址的租约时间为多久。\ndefault-lease-time 600;\n\n# 最大租约时间，以防客户端请求的。\nmax-lease-time\
    \ 7200;\n}\n```\n"
