    \ a Runlevel?\n\n+   - The runlevel of a machine determines what functionality\
    \ the system should be providing.\n- UNIX has a single-user safe mode, plus other\
    \ configurations available.\n- You do not need to reboot to move between runlevels.\
    \ For instance, you can start Linux in single user mode to fix a bootup problem,\
