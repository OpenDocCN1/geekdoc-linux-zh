    read time = 15

    workgroup=WORKGROUP

    mangled map=(*.html,*.htm)

    lock directory = /var/lock/samba

    share modes = yes

    os os level = 33

    domain master = yes


    [homes]

    comment = Home Directories

    browseable = no

    read only = no

    create mode = 0750

    read size = 8192

    max xmit = 8192

    # the two above try to write and read in 8kB blocks.


