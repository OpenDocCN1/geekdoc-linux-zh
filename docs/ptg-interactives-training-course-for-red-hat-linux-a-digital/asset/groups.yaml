  - "[PAGE 12]\n\n# LECTURE 1 INSTALLATION\n\n# Performing the Install\n\n+   * Insert\
    \ the first CD into the CD-ROM drive.\n* Choose the installation method.\n  -\
    \ The default method is the graphical installer, which is best for most beginners.\n\
    \  - The text installation method uses a character-based install, good for servers\
    \ that do not have video cards supported by Red Hat Linux.\n  - The \"nofb\" selection\
    \ uses a generic SVGA installation for types of video cards without framebuffer\
    \ support.\n  - The \"rescue\" selection allows you to attempt recovery from a\
    \ corrupted install of Linux; it starts the Linux kernel from the CD-ROM, giving\
    \ you access to the system so you can find the problem and fix it.\n  - The last\
    \ option is for some newer devices or kernels that did not make it to the CD-ROM.\n\
    * Most modern hardware will work with the standard graphical install, you can\
    \ use that as your base.\n* Starting the install process from CD-ROM takes a few\
    \ seconds.\n* Select your installation language; the default is English.\n* Select\
    \ your keyboard layout. The default is a generic 105-key keyboard.\n* Set your\
    \ mouse in the next screen.\n  - USB keyboards and mice are automatically detected,\
    \ as PS/2 mice.\n  - Select the kind of mouse you use, or one of the generic selections.\n\
    \  - If you are using a serial mouse, you must select the tty port (known as the\
    \ COM port in DOS) that the mouse is attached to.\n  - The X Windowing system\
    \ assumes that mice have three keys (left, middle, and right). If you have a two-button\
    \ mouse and want to use this feature, select \"Emulate 3 buttons\" on the screen.\n\
    * If you have an older version of Red Hat Linux installed on your system already,\
    \ you can select “Upgrade” to update your system.\n* For new installations, you\
    \ can select three pre-configured setups: server, workstation, and laptop."
  - '[PAGE 13]


    A workstation installation will clear all Linux partitions and use up any unpartitioned
    space available; other operating systems will remain untouched.


    A server installation will clear all partitions from all hard drives and will
    not install the X Windows system.


    This installation method should be used with caution, as any remaining data on
    the system will be removed.


    The Laptop installation is similar to the Workstation install, but adds PCMCIA
    support.


    The remaining option is “Custom”, which is good for precise control over the installation
    process. The remainder of this course will cover the Custom System install.


    +   - If you select Custom System, you will get a screen asking for partitions:

    - The default is to automatically partition, removing any Linux partitions.

    - The second option is to use the disk drive program to manually configure the
    hard drive.

    - The fdisk utility is recommended for experts only.


    +   - Disk drive shows the currently used partitions on a hard drive and the kind
    of partitions they are.


    +   - Create new partitions with the “Add . . .” button:

    - Enter a mount point, or select one using the drop down menu.

    - Select a minimum size for the partition; select “Use remaining space” to allocate
    any and all remaining free space to the new partition.

    - The partition type for Linux data drives is “Linux native”.

    - One partition must be configured as swap, and should be 2× the amount of memory
    you have available on the system.

    - You can also create RAID partitions if your hardware supports it, or DOS FAT
    partitions.

    - Once you click “OK”, the partition is created.

    - Make at least one swap partition, and at least one Linux partition, which has
    a mount point of /.


    +   - Select “Next” and choose which partitions you want to format:

    - If you have partitions you want to keep (like /home), deselect the checkbox.'
- md: "\n## LECTURE 1 INSTALLATION\n\n- The bottom of the screen has an option “check\
    \ for bad blocks,” which is recommended for new hard drives, or for drives of\
    \ questionable quality.\n- This adds a lot of time to partitioning, but can prevent\
    \ data loss.\n- LILO is the boot manager for Red Hat Linux and gives you a graphical\
    \ screen to select an OS to start at boot time.\n- “linear mode” is selected,\
    \ leave it, and leave any parameters alone.\n- If you have an IDE CD-R or CD-RW\
    \ drive and use “hbc-ide-scsi” or a similar string in the kernel parameters, Red\
    \ Hat has identified your CD-R/W.\n- The checked box indicates the default OS,\
    \ which is the Linux installation. You can change this by selecting another OS,\
    \ then clicking on “Default Boot Image”.\n- If you have an Ethernet card and it\
    \ is detected, you can configure it at the next server. By default, the device\
    \ starts at boot time, and uses DHCP to configure your Ethernet address and settings.\n\
    - If you do not have a DHCP server, deselect the DHCP and enter the information\
    \ as provided to you by your network administrator.\n\nThe next screen gives access\
    \ to the Red Hat’s firewall configuration.\n\n- You can now configure the languages\
    \ available for the system. The default will be the one you used for installation.\n\
    - The time zone and location information is next.\n- UNIX (and Linux) like to\
    \ use Universal Coordinated Time as the time reference.\n- Other operating systems\
    \ expect the time on the system to be of that local and not UTC. If you will be\
    \ using the system for Linux only, you can select “System clock uses UTC” then\
    \ set the time appropriately later.\n- Select the continent you are followed by\
    \ selecting on the map your general location to set the time zone information.\n\
    - System security is important, so Red Hat has you a root password, with allowing\
    \ you to configure user accounts now.\n- We will cover MD5 and shadow passwords\
    \ later; unless otherwise, you should leave the options on this screen as is.\n\
    \nThere are many packages available for Red Hat Linux.\n- They can be selected\
    \ as groups of packages that have dependencies already set up.\n- Many of the\
    \ packages tell you what they are (Games, for example).\n- You can scroll to the\
    \ bottom of the list and select \"Everything\", or click on \"select individual\
    \ packages\" to install specific packages.\n\nThe X Windowing system is now going\
    \ to be configured. If you have a standard video card, it has already been recognized\
    \ and identified; verify that the model is correct and the amount of onboard RAM\
    \ is also correct.\n- The next screen has also identified your monitor, if available.\
    \ If not, select \"Generic\" and choose the monitor that is closest to yours.\n\
    \n- Set the color depth and default resolution. The defaults depend on your monitor\
    \ and video card combination.\n- You can test the settings as given and see if\
    \ it looks correct.\n- If you have selected the KDE and GNOME desktop environments,\
    \ you get a choice of environment to use by default.\n- Select a text-based login,\
    \ or a user-friendly graphical login.\n\n## Notes:\n\n## Lesson 1.4\n\n## Summary\n\
    \n- If you have a newer system with fairly standard hardware and plan on only\
    \ running Linux on it, installing Red Hat is very straightforward.\n- The disk\
    \ druid program can be used to partition your hard drive.\n- Consider the version\
    \ of Red Hat that meets your needs, including availability of support.\n\nNotes:\n\
    \n## Lecture 2\n\n## Linux Boot and Shutdown\n\n### Objectives\n\n- Analyze the\
    \ Boot Process\n- Change Runlevels\n- Troubleshoot the Boot\n- Shutdown/Restart\
    \ Properly\n\n## Lesson 2.1\n\n### Configuring the Linux Loader\n\n- LILO allows\
    \ you to send boot parameters to the kernel before it starts.\n\nNotes:\n\n##\
    \ The Boot Prompt\n\n- After installing Linux, starting your machine will probably\
    \ bring up a graphical window allowing you to choose which OS to boot.\n- The\
    \ default is “linux” and it will boot before after a few seconds if you do not\
    \ make a selection.\n- Linux relies on being able to pass options to the kernel,\
    \ so LILO makes this easy to do.\n- You can add many of these options to the LILO\
    \ configuration file.\n- If you need to pass extra options to the Linux kernel\
    \ before bootup, you can press CTRL-X to access the text interface to LILO; this\
    \ is the only way to pass extra parameters to the Linux kernel at startup time.\n\
    - From the text interface, there are a number of configuration parameters that\
    \ you can add to the end of the name you use to start Linux. By default, this\
    \ is just “linux”. These parameters allow you to do many things, including changing\
    \ the root partition, deciding whether the root filesystem is read-only or read-write,\
