    These will be the addresses used for incoming connections, and there should be
    at least as many available as you have phone lines.


    +   - Create new accounts for each user that will be connecting via PPP. Many
    places use the name of the user with a P prepended to it. Have the user information
    in /etc/passwd look something like this: Pmark:x:500:500:PPP user:/home/mark/usr/local/bin/pppd.


    +   - In the home directory of that user, create a .ppprc file and add the text
    from the example below:


    Sample .ppprc file


    ```

    -detach

    modem

    crtscts

    lock

    192.55.123.100:192.55.123.111

    proxyarp

    ```


    +   - --detach says to not detach from the console.

    - modem says to monitor the CD (Carrier Detect) line and terminate if CD drops.

    - lock will lock the device, preventing anyone else from using that serial port.

    - The two IP addresses are the address of the server (waiting for the call) followed
    by a colon and the IP address to assign to the client when it dials in.

    - proxyarp allows the server to put the PPP client in its ARP cache and respond
    to packets that are supposed to go to the client.


    +   - Set up getty to monitor the serial ports.


    +   - The pppstats command can give a running total of packets in and out for
    the line.'
  - '[PAGE 70]


    +   If you choose to use dynamic IP addresses instead of static IPs to save on
    IP addresses, create a /etc/ppp/options.ttyXX file for each tty file that is attached
    to a modem, where xx is the name of the serial port.


    +   The content of the options.ttyXX file is the same as the .ppprc file listed
    above, with the exception that the IP address is changed for each file.


    # Notes:'
  - '[PAGE 71]


    # Lesson 5.2


    xinetd


    +   - The xinetd meta-daemon is used to start programs automatically when a request
    comes in on a specific TCP/IP port.


    Notes:'
  - '[PAGE 72]


    # /etc/services


    +   The /etc/services file contains information about a TCP/IP port number, and
    a name for the specified port which is later used in the /etc/inetd.conf file.


    Sample /etc/services file


    ```

    ftp-data      20/tcp

    ftp             21/tcp

    telnet          23/tcp

    smtp            25/tcp timserver

    time            37/tcp timserver

    time            37/udp resource

    rlp             39/udp nameserver

    name            42/udp nameserver

    whois           43/tcp nicname # usually to sri-nic

    domain          53/tcp

    domain          53/udp

    ```


    +   The first entry in the line is the service name. This is followed by the port
    number and the protocol (TCP or UDP), which are then followed by any aliases.


    +   The port where email comes in a name in is called the smtp port; it is located
    on port 25, and its alias is mail.


