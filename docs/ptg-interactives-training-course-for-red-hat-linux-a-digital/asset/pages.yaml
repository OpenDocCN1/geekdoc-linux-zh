  md: '# Lesson 7.3


    # Connecting to SMB Shares


    +   Linux has a Virtual File System (VFS) that provides a generic-interface for
    mounting filesystems.


    +   Instead of using mount, we use `smbmount`, which is part of the Samba-client
    package, to mount SMB shares.


    ```

    # smbmount service

    mount-point options

    ```


    +   `service` is the NetBIOS name of the SMB share you want, replacing a \ character
    with /.


    +   The `mount-point` is the local mount point in the Linux hierarchy.


    +   Since you have to use `smbmount` as root, and you probably don''t have a root
    user on your NT server, you will need to make use of the options -U for user to
    authenticate as and -c to list a NetBIOS name for your client machine; otherwise
    the FQDN is sent.


    +   `client.domain.org` (whatever the FQDN is) is not a valid NetBIOS name, adding
    -c client tells the server the client’s name is just `client`.


    +   If the NetBIOS name for the client can be resolved to a hostname, you will
    be asked for a password for the given username.


    +   If you want to skip this step, add -P passwd, replacing `passwd` with your
    password on the SMB server.'
