  md: "# tcpd\n\n+   - The tcpd program can cut off your site from a bad site and\
    \ specify sites can come in.\n- The tcpd program matches up an incoming IP address\
    \ with a table.\n  - If the IP address is listed in /etc/hosts.allow, the connection\
    \ is allowed.\n  - If it is listed in /etc/hosts.deny, the connection is refused.\n\
    \  - If the IP address does not match an entry in either file, then access is\
    \ granted.\n- The tcpd program works only with programs that are typically started\
    \ with the inetd program — telnet, finger, FTP, talk, and a few others.\n- When\
    \ setting up tcpd for allowing or disallowing connections, the access control\
    \ is the same.\n\n```\ndaemon_list : client_list\n[ : shell_command ]\n```\n\n\
    +   - The daemon_list is the name of the program that is running (telnet, ftppd,\
    \ etc.). The client_list can be any of the following:\n  - Strings beginning with\
    \ a period (.) are assumed to be part of a domain.\n  - Strings ending with a\
    \ period (.) are assumed to be an IP address or subnet.\n  - A string starting\
    \ with @ is assumed to be a NIS netgroup.\n  - n.n.n/n.m.m.m is a net and mask\
    \ pair. This gives finer control for matching IP addresses. Using this method\
    \ over n.n.n is preferred, since you are explicitly listing the network addresses\
    \ allowed.\n- There are also a few special keywords such as ALL, LOCAL, UNKNOWN,\
    \ and so on.\n  - shell_command is optional and is sent to /bin/sh for processing.\
    \ This should be a secure script that sets its PATH and other environment variables."
  merge: -1
