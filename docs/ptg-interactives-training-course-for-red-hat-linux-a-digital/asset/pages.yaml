  md: '# Lesson 5.4


    # Network Information Services (NIS)


    +   - NIS is a set of programs for managing users and various network services
    from one master server.

    - NIS stores its information in a set of directories and GDBM (GNU Database Management)
    files rooted in /var/yp. NIS refers to these files as “maps”.

    - Maps are then made available to other machines in the NIS domain via RPC (Remote
    Procedure Calls).

    - NIS also allows for secondary slave servers.

    - Each subnet should have one (and only one) NIS server on it.

    - The NIS maps are built from the various setup files found mostly in /etc: passwd,
    group, hosts, services, aliases, and so on. It is not necessary to use every map.
    Often only the password and group maps are used, since most of the other files
    change frequently.

    - One of the biggest problems with NIS is the security hole opened by broadcasting
    NIS requests.


    Notes:'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# LECTURE 5 NETWORKING WITH LINUX


    +   - Red Hat includes two scripts for working in an NIS network environment:/etc/rc.d/ypbind
    and /etc/rc.d/autofs. The second script is only needed if you have automount maps
    in your NIS server.


    +   - Edit /etc/ypbind.conf file to reflect your NIS domain settings.


    +   - By default, ypbbind will send an IP broadcast through the network to find
    a NIS server. You can manually specify a NIS server to use. Edit the /etc/yp.conf
    file and add the hostname for the server, making sure the host is listed in /etc/hosts.


    +   - Make sure that the portmapper is starting. If you''re using NFS, then the
    portmapper is already started.


    +   - If not, use /etc/rc.d/init.d/portmap start to get it started.


    +   - Finally, you can start ypbind:/etc/rc.d/init.d/ypbind start.


    +   - The /etc/nsswitch.conf file determines the lookup order for all NIS information
    (unlike /etc/host.conf, which is only for host lookups).


    +   - The automounter will automatically mount partitions on NFS based on an NIS
    map. The two typical maps used are auto.home and auto.vol, which mount off of
    /home and /vol, respectively. You can start the Linux autofofs automounter using
    the command


    ```

    # service autofofs start.

    ```


    +   - CD-ROMs, floppy disks, local volumes, and NFS filesystems can be automatically
    mounted when the user changes to a certain directory.'
