  md: "# LECTURE 6 PRINTING and PRINT SHARING\n\n# Access from Other LPD (UNIX) Systems\n\
    \n+   - To permit access from specified hosts with LPRng, create a list of users\
    \ and hosts allowed to submit jobs, delete jobs, and manage printers.\n— The control\
    \ file is located in /etc/lpd.perms.\n— By default, any user on any host can submit\
    \ jobs, only the user or root can remove jobs, and anyone can get queue status,\
    \ with root being able to control print queues.\n- To prevent malicious outside\
    \ outside of your printers, be sure that TCP/IP port 515 is blocked at your firewall\
    \ and configure /etc/lpd.perms to accept jobs only from hosts or users you specify.\n\
    — The /etc/lpd.perms file contains a few samples for access control:\n\n```\n\
    # REJECT SERVICE=X NOT REMOTEIP=130.191.0.0/255.255.0.0\n# REJECT SERVICE=X NOT\
    \ REMOTEHOST=engpc\n```\n\n+   - These lines show two methods of blocking remote\
    \ hosts.\n    - The first line rejects IP addresses that are not in the 130.191\
    \ network.\n    - The second line rejects hosts that start with “engpc”.\n   \
    \ - If two reject statements were activated, only machine names that start with\
    \ “engpc” and have IP addresses starting with 130.191 would be able to connect.\n\
    \n+   - Once you have made the changes to /etc/lpd.conf, restart LPRng using service\
    \ lpd restart as the root user.\n- If you want to talk to a printer that exists\
    \ on the network and is compatible with the LPD protocol, enter the IP address\
    \ and type of printer to printconf."
