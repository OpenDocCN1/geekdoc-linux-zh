  md: '# Querying RPMs


    +   - To find out what files would be installed if you installed a binary package,
    you can use `rpm -qip package-1.0-1.i386.rpm`. This gives a list of files that
    are in the package and where they will be installed.

    - `rpm -qip_package-1.0-1.i386.rpm` will give a list of the package name, description,
    build information, size of the installed package, and other information.

    - For packages that are already installed, you can get a list of the files that
    are in a package with `rpm -ql package`.

    - If there is a file on the system, and you want to see what package owns the
    file, you can use `rpm -qf filename`.

    - You can get a list of all the packages installed on the system using `rpm -qa`.


