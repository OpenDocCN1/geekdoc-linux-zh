  md: '# LECTURE 13 SYSTEM AND NETWORK MONITORING


    # Lesson 13.1


    # Syslog


    +   - The syslog program monitors kernel and user events and routes messages based
    on what you want to do.

    - The syslog program gets started up at boot-time and uses /etc/syslogd.conf file
    to know what to do.


    ```

    Sample /etc/syslogd.conf file

    # Log all kernel messages to the console.

    # Logging much else clutters up the screen.

    /kern.*


    # Log anything (except mail) of level info or higher.

    # Don''t log private authentication messages!

    *.info;mail.none;authpriv.none

    /var/log/messages


    # The authpriv file has restricted access.

    authpriv.*

    /var/log/secure


    # Log all the mail messages in one place.

    mail.*

    /var/log/mailillog


    # Everybody gets emergency messages, plus log them on another

    # machine.

    *.emerg  *


    # Save mail and news errors of level err and higher in a

    # special file.

    uucp.news.crit

    /var/log/spool

    ```


    +   - Non-comment lines are entries and consist of two fields. The first field
    lists the events to monitor. The second field lists what to do once an event has
    occurred.

    - Each event is defined in two parts, separated by a period. The first part is
    the facility, or type of program generating the event. The second part is the
    priority or severity of the event, ranging from debug to emerg.

    - There are 20 facilities available: 12 system facilities and 8 as-igned for local
    use.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# RED HAT LINUX TRAINING COURSE WORKBOOK


    — There are eight priorities available ranging in severity from debug (low severity)
    to emerg (high severity).


    — The facility/priority combination you list will report all the messages that
    get sent to syslog for that priority and higher.


    — Replacing either the facility or priority with an asterisk (*) will report for
    all facilities or all priorities, depending on where you put the asterisk (before
    or after the period).


    — The man pages for the particular programs you want to monitor will list what
    facilities the program uses.


    +   • The second field lists where a message should be sent. This can be a file
    (if the destination starts with a /), a remote host (if the destination starts
    with an @), all logged-in users (if the destination is an *), or a specific user
    (if it starts with none of the previous three characters).


    +   • Using remote host logging can finalize a group of computers to log all their
    messages to one machine.


    +   • How you log depends on what you want to log.


    +   • For an initial setup, you should probably start by logging about everything.


    +   • As the system becomes stable and is working correctly, change the priority
    to something like warn or err to keep out regular debugging information.


    +   • You may also choose to have different files for different facilities. This
    can make it easier to separate problems if they arrive.


