- img_proc: true
  md: "# Keeping a PC Safe from Reboots\n\n+   - During a reboot, a Linux box has\
    \ very low security.\n  - The PC can boot an OS (DOS) that can fit on a floppy,\
    \ plus contain programs on it to completely ruin a hard drive.\n  - A virus can\
    \ infect the MBR of a hard drive, which is what Linux needs to boot.\n  - A user\
    \ can bring their own Linux boot floppy to get root access.\n- Here are a few\
    \ suggestions for keeping a publicly available Linux machine for safe.\n  - Protect\
    \ the Basic Input/Output System (BIOS)—This is the first thing you need to do,\
    \ as many of the other protections depend on this.\n  - Password-protect access\
    \ to the BIOS. Most modern ones will allow this.\n  - Be sure that no one can\
    \ open the case. Locks are available for many cases.\n  - In the event that you\
    \ forget the password, you can disconnect the on-board battery or make a jumper\
    \ connection on the motherboard and the BIOS will be set to its default values.\n\
    \  - Prevent booting from the floppy drive.\n  - Use Linux only—Booting into DOS\
    \ or Windows can cause trouble.\n  - Don't use DILO unless you have to.\n  - If\
    \ necessary, disconnect the reset and power switches.\n  - Do not give out the\
    \ root password.\n  - Disable CTRL+ALT+DELETE in /etc/initabb.\n    - The line\
    \ you'll want to look for is similar to: ca:ctrlaltdel:/sbin/shutdown -t3 -r is\
    \ now.\n    - Inserting a # before this line will prevent reboots using CTRL+ALT+DELETE.\n\
    \    - Restart init using the command kill -1 1.`\n- Once you have your machine\
    \ secure against reboots, you can set the machine up in a lab for public use."
  merge: -1
  pgno: 29
