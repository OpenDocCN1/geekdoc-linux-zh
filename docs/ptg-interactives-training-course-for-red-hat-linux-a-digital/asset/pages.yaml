  md: '# PPP


    +   * The Point-to-Point Protocol (PPP) is the way to connect to the Internet
    or a TCP/IP network via a dial-up line.

    * PPP is designed to work between two machines and two machines only. This makes
    it ideal for dial-up applications, or even connecting remote locations via a leased
    line.

    * PPP depends on one machine running pppd server on one end of the phone line,
    and a pppd client running on the machine dialing up.

    * You have to configure the software differently depending on whether you''re
    the client or the server.

    * PPP doesn''t quite have the overhead of Ethernet since no MAC addresses are
    used.


    Notes:'
  merge: -1
