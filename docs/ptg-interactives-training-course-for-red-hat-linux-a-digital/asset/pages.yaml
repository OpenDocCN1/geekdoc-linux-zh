- img_proc: true
  md: '# LECTURE 5 NETWORKING WITH LINUX


    # PPP Client


    +   - Setting up a PPP client requires a modem, phone line, a PPP server, and
    a phone number to call.


    +   - The quick way of verifying that a PPP connection works is by doing something
    similar to the following:


    ```

    # pppd connect ''chat -v "+" ATDTphone CONNECT " login: login

    word: password'' \\> /dev/cu1 3840 debug crtscts modem defaultroute

    ```


    +   - phone, login, and password are assigned to you by whoever is providing the
    PPP account.


    +   - Change /dev/cu1 to be the location of your modem. Remember that /dev/cu1
    under Linux is the same as COM2: under DOS and Windows.


    +   - The chat command is used to dial the modem and provide the login and password
    information.


    +   - Once chat makes a successful connection, PPP takes over the line and starts
    a connection.


    +   - The server and client negotiate settings like Maximum Transmit Units (MTU),
    compression, and a few other settings.


    +   - This configuration can be filled out in scripts using the Red Hat Network
    Configuration Manager by entering the phone number, line speed, modem, login,
    and password.'
  merge: -1
