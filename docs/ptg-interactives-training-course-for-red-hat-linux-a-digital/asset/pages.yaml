  md: 'Another option available to tcpdump is filtering. For example, to filter out
    all telnet information and get information about who is browsing the web you''d
    use something like this:


    ```

    $ /usr/sbin/tcpdump -i eth0 port http

    ```


    +   Since tcpdump only sees traffic on the local Ethernet, you''ll be able to
    see Ethernet traffic on your segment. You won''t be able to see traffic on the
    other side of a router, firewall, or even a switch unless it''s an Ethernet broadcast.


