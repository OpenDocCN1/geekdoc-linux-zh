  md: '# LECTURE 2 LINUX BOOT AND SHUTDOWN


    # Lesson 2.2


    # init


    +   - init is the first process that Linux kicks off once the kernel hasnentered
    memory and the root (/) partition is mounted.

    - The init process is always process number 1. Killing this process will do the
    same thing as running halt or shuttingdown.

    - The init program reads its configuration file and then starts theprocedure of
    bringing up the Linux OS.

    - The /etc/inittab file is read by init, which tells it what initlevel to start
    out on and what processes to start. This would in-clude programs like getty; other
    scripts are run based on whatrunlevel you''ve entered.

    - An entry in the /etc/inittab file has four fields.


    Notes:'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Sample entry in /etc/inittab


    ```

    10:0:wait:/etc/rc.d/rc 0

    ```


    +   - Fields are delimited by colons.

    - The first field is one unique to the file and is just an arbitrary two-letter
    (or -digit) sequence.

    - The second field tells init what runlevel to reference this field on.

    - The third field is an option to init on what to do while the script is running;
    wait prevents problems with multiple run-level change scripts going at once by
    forcing init to let the current script finish before starting others; other options
    include respawn and once.

    - The fourth field lists the script or process to run.


    +   * When init has completed the startup scripts, Linux is now ready for use.

    * init continues to run, restarting some programs as necessary, and starting or
    stopping other programs if runlevels are changed.


    # Notes:'
  merge: -1
  pgno: 23
- img_proc: true
  md: "# LECTURE 2 LINUX BOOT AND SHUTDOWN\n\n# Lesson 2.3\n\n# What's a Runlevel?\n\
    \n+   - The runlevel of a machine determines what functionality the system should\
    \ be providing.\n- UNIX has a single-user safe mode, plus other configurations\
    \ available.\n- You do not need to reboot to move between runlevels. For instance,\
    \ you can start Linux in single user mode to fix a bootup problem, then continue\
    \ in multiuser mode without restarting the kernel.\n- The first script that gets\
    \ run by `init` no what runlevel you are using the `/etc/rc.d/rc.d` script, which\
    \ runs all the programs that would be required no matter what runlevel you would\
    \ be.\n- Once the `/etc/rc.d/rc.d` script completes successfully, `init` goes\
    \ on and calls it with an option of the runlevel to enter (0-6).\n    - Under\
    \ the /etc/rc.d directory are six directories to look at called rc.[0-6].d`.\n\
    \    - Each directory has a number of scripts that start with a “K” or an “S”,\
    \ a two-digit number, and a program name.\n    - The “S” is for starting up programs\
    \ that are specific to that runlevel; the “K” is for kill scripts, which kill\
    \ (stop) any programs that are not in a runlevel.\n    - Kill scripts for a runlevel\
    \ are executed first, then the start scripts for the runlevel are executed.\n\
    \    - Scripts with a lower number are executed first, allowing the networking\
    \ software to (for instance) initialize the Ethernet card before the NFS daemons\
    \ try to start.\n    - The name is a descriptive one for the user.\n    - As each\
    \ script runs, Red Hat will report the success or failure of startup scripts.\n\
    \    - A successful script will display OK in green; failure will display FAILED\
    \ in red.\n- All these scripts are links to the `/etc/init.d` directory, which\
    \ contains the master of all the scripts."
  merge: -1
  pgno: 24
- img_proc: true
  md: "# Lesson 2.4\n\n# When Something Goes Wrong\n\n+   There are only a few places\
    \ in the boot sequence that will cause the kernel to not finish loading. These\
    \ include:\n  - Can't mount the root partition. The kernel may not have the right\
    \ drivers or it may be trying to load the wrong partition.\n  - Can't automatically\
    \ check the filesystem for errors using fsck. If this is the case, the system\
    \ will give you a warning and drop you into single-user mode.\n  - Kernel was\
    \ told to start up in Runlevel 1.\n  - Other errors loading drivers.\n  - Bad\
    \ startup scripts.\n\nNotes:"
  merge: -1
