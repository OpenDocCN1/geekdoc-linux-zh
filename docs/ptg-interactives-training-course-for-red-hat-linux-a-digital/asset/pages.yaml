  md: '# Options for configuring the kernel


    +   Selecting the right options involves making choices that balance your needs
    for performance, memory consumption, compatibility, and security.


    +   Selecting the right processor family for your CPU is one of the best things
    to do. Each processor family has its own way of handling memory and some CPU-specific
    options and optimizations.


    +   If your hardware setup is going to be stable, you can compile in drivers for
    various kinds of hardware for slightly better performance and to prevent trojan
    modules from being loaded.


    +   Selecting DMA access for IDE devices under “Block devices” will automatically
    turn on DMA access, reducing CPU load.


    +   If your box will be configured as a router without firewalling, you can enable
    “IP: optimize as router not host” under “Net-working options”.


    +   Bonding device support under “Network device support” will enable bonding
    multiple network devices together to create one large pipe to other bonded Linux
    boxes or Cisco routers.


    +   If you plan on having a large number of users logging in and you would need
    a large number of pseudo terminals (PTYs), you can enter a number in “Maximum
    number of Unix98 PTYs in use (0-2048)” under “Character devices”.


    +   For systems that will not be onsite and require high availability, you can
    enable “watchdog timer support”.'
