  md: '# SPEC files


    +   - The specification, or .spec, file tells rpm how to build and install code
    that will eventually be in an RPM file, what files should be placed in the binary
    RPM, where they should be installed to, and information about the RPM itself (who
    made the source RPM, etc.).


    +   - Sample .spec file that would create an RPM called example.


    Sample specification file for a source RPM


    ```

    1.Summary: Example package

    2.Name: example

    3.Version: 1.0

    4.Release: 1

    5.Copyright: GPL

    6.Group: Applications/Text

    7.Source: http://www.nosuch.com/source/example-1.0.tar.gz

    8.BuildRoot: /var/tmp{%name}-buildroot

    9.%description

    10.This is just a test program for how easy it is to build your own RPM files
    from source code. It allows you to add extra software to your RedHat machine,
    while still using the power and flexibility of RPM.

    11.%prep

    12.%setup

    13.%build

    14.make

    15.%install

    16.rm -rf $RPM_BUILD_ROOT

    17.mkdir -p $RPM_BUILD_ROOT/usr

    18.install -s -m 755 example $RPM_BUILD_ROOT/usr

    19.install -m 600 example.conf $RPM_BUILD_ROOT/etc

    20.%clean

    21.rm -rf $RPM_BUILD_ROOT

    22.%files

    23.%doc example.txt COPYING

    24./usr/example

    25./etc/example.conf

    26.%changelog

    ** Mon Dec 20 1999 Mark Komarinski <markk@wayga.com>

    27.- First pass of example.spec

    ```


    Lines 1 through 8 contain information about the entire package itself.


    %description, a textual notation on what the package is, takes up lines 9 and
    10.'
