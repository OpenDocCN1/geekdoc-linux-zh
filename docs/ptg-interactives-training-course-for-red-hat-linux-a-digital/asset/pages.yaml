  md: '# The Red Hat Rescue Image


    +   - Red Hat provides a rescue image on their CD-ROM that starts Linux if you
    have problems booting Linux.


    +   - The rescue creates a small memory-resident version of Linux you can use
    to repair a corrupted install.


    +   - The easiest way to repair LILO is to create and use the boot diskette at
    installation time. If the diskette is not available, you can use the rescue image.


    +   - Using lilo from a rescue image is harder to do than normal. The location
    of the kernel and lilo configuration files are not the system root when you use
    a rescue image.


    +   - Once you boot the rescue image, be sure the /mnt directory exists, then
    mount the partition with root and /etc on /mnt, and the partition with /boot on
    /mnt/boot.


    +   - You can now access lilo.conf in /mnt/etc/lilo.conf. Edit it and fix the
    problem you have found (or copy a known good copy of lilo.conf).


    +   - Finally, install the fixed lilo.conf file using lilo -r /mnt.


    Notes:'
  merge: -1
  pgno: 26
- img_proc: true
