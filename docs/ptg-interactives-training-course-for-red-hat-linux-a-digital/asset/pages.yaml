  md: '# CTRL+ALT+DELETE


    +   - CTRL+ALT+DELETE will shut down Linux. The init process is watching for this
    and will shut the machine down if it receives this signal. The default setting
    is to run the reboot command immediately.


    +   - The next section shows how to disable rebooting via CTRL+ALT+DELETE.


    Notes:'
