  md: '# LECTURE 11 SECURING LINUX


    # Lesson 11.2


    # Software Security


    +   - Programs like COPS, TripWire, and LIDS (Linux Intrusion Detection System)
    allow you to routinely monitor your system to detect possible holes or to detect
    some forms of break-ins.

    - A program like SATAN will monitor an entire network and report on possible holes.

    - Tripwire is part of the PowerTools CD-ROM. The idea behind Tripwire is that
    you create we hashes of files and store the hashes in a read-only place (such
    as a floppyette).

    - Periodically, Tripwire compares the hashes against the files and notes any differences.
    If you did not authorize any changes, this may indicate a crack attempt, or a
    trojan horse program.

    - The list of files that TripWire checks is listed in /etc/tw.config.

    - For the most part, these are system directories, including /etc,/bin /sbin,
    and /dev.

    - Once you have the /etc/tw.config file to your liking, run tripwire -initialize.
    This will create an initial database hash of the files you wish to monitor. This
    database file is located in /etc/spool/tripwire.

    - When the database is set up, running the tripwire program itself will perform
    a check against the database.


