  md: '# LECTURE 10 X WINDOWING SYSTEM


    # Lesson 10.1


    # Set Up X Using Xconfigurator


    +   - X is a client/server setup. The server is really an X protocol server on
    the user''s console, which handles the display to the screen. The server then
    talks to clients, such as a window manager and applications, and puts them on
    the screen.

    - The configuration file for Free8 is called XF86config and it is located in /etc/X11/xF86Config-4.

    - Red Hat''s Xconfigurator program gives a simple text-based interface for setting
    up X.

    - Before running Xconfigurator, make sure that your mouse is set through Red Hat.

    - Xconfigurator can be started by the root user as /usr/bin/X11/Xconfigurator.
    If your video card can be detected, it will be listed; otherwise, you will get
    a list of supported cards, and you can select the card that most resembles yours.

    - Next you will be asked about the type of monitor you have. If yours is not on
    the list, select something close to what you have and see if it works—you can
    always re-run Xconfigurator in case your first test does not work.

    - Next, you will select the amount that you have. You''ll be asked to select whatever
    video modes you want to use as a combination of resolution and color depth. Eight-bit
    color depth is 256 unique colors, 16-bit is 65,536 colors, and 24-bit is true
    color (16 million colors).

    - X will start in the lowest resolution and color depth listed unless you tell
    it at startup to change to a different color mode.

    - Once the program completes, there will be XF86ConfigF86config-4 files in /etc/X11.
    You can edit this file to make changes about the mouse you have or modify other
    settings.

    - The XF86Config file is used by XFree86 3.x, which is still available. The XF86Config-4
    file is used for XFree86 4.x, which is the more advanced and default server for
    Red Hat.'
