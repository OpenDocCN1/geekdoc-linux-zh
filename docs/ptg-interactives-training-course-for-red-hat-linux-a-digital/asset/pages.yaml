  md: "# LECTURE 1 INSTALLATION\n\n# Performing the Install\n\n+   * Insert the first\
    \ CD into the CD-ROM drive.\n* Choose the installation method.\n  - The default\
    \ method is the graphical installer, which is best for most beginners.\n  - The\
    \ text installation method uses a character-based install, good for servers that\
    \ do not have video cards supported by Red Hat Linux.\n  - The \"nofb\" selection\
    \ uses a generic SVGA installation for types of video cards without framebuffer\
    \ support.\n  - The \"rescue\" selection allows you to attempt recovery from a\
    \ corrupted install of Linux; it starts the Linux kernel from the CD-ROM, giving\
    \ you access to the system so you can find the problem and fix it.\n  - The last\
    \ option is for some newer devices or kernels that did not make it to the CD-ROM.\n\
    * Most modern hardware will work with the standard graphical install, you can\
    \ use that as your base.\n* Starting the install process from CD-ROM takes a few\
    \ seconds.\n* Select your installation language; the default is English.\n* Select\
    \ your keyboard layout. The default is a generic 105-key keyboard.\n* Set your\
    \ mouse in the next screen.\n  - USB keyboards and mice are automatically detected,\
    \ as PS/2 mice.\n  - Select the kind of mouse you use, or one of the generic selections.\n\
    \  - If you are using a serial mouse, you must select the tty port (known as the\
    \ COM port in DOS) that the mouse is attached to.\n  - The X Windowing system\
    \ assumes that mice have three keys (left, middle, and right). If you have a two-button\
    \ mouse and want to use this feature, select \"Emulate 3 buttons\" on the screen.\n\
    * If you have an older version of Red Hat Linux installed on your system already,\
    \ you can select “Upgrade” to update your system.\n* For new installations, you\
    \ can select three pre-configured setups: server, workstation, and laptop."
