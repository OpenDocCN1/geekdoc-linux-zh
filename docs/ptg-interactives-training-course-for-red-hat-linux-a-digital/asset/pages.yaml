  md: '# Lesson 8.4


    Remote E-mail (POP and IMAP)


    +   - POP (Post Office Protocol) and IMAP (Internet Message Access Protocol) are
    the two standards for receiving e-mail from a remote machine.

    - Each protocol has strengths, weaknesses, and assorted Mail User Agents (MUAs)
    that support them.

    - Both are available in a Red Hat install setup ready to run.

    - Authentication of e-mail is done by the same PAM scheme that is used to log
    in.

    - One of the advantages of using POP or IMAP is that little user setup is required.


