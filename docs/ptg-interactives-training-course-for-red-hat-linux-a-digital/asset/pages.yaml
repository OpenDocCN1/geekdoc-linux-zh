  md: "# LECTURE 6 PRINTING AND PRINT SHARING\n\n# Using Authentication with CUPS\n\
    \n+   * Since IPP and CUPS were designed to allow users to send print jobs from\
    \ anywhere to a IPP server, there has to be a method for users to authenticate\
    \ users who wish to send print jobs.\n* The basic method is the same as passwords\
    \ used by HTTP, so the passwords can be sniffed fairly easily, but is good enough\
    \ for a small network.\n  * To set up basic method authentication, edit `/etc/cups/cupsd.conf`,\
    \ find `<Location/>`, and insert the following lines:\n    ```\n    AuthType Basic\n\
    \    AuthClass User\n    ```\n\n+   * “digest” authentication requires using `lpasswd`\
    \ to add authorized users and passwords to `/etc/cups/passwd.md5`.\n  * This increases\
    \ the amount of administration, since this password file does not sync with the\
    \ `/etc/passwd` that Red Hat Linux uses to administer users.\n  * If you want\
    \ to use Digest authentication, change `/etc/cups/cupsd.conf` to read `AuthType\
    \ Digest` instead of `AuthType Basic`.\n* To improve security, use SSL to encrypt\
    \ print jobs and passwords as they go over the network.\n  * First, you need to\
    \ create a location for the SSL keys, which should be `/etc/cups/ssl/`.\n  * Then\
    \ generate the keys and protect them. The file ENCRYPTION.txt that is included\
    \ with the source code explains how to do this:\n    ```\n    # openssl req -new\
    \ -x509 -keyout /etc/cups/ssl/server.key \\\n      -out /etc/cups/ssl/server.crt\
    \ -days 365 \\\n      -nodes\n    # chmod 600 /etc/cups/ssl/server.*\n    ```\n\
    \n+   * The first two lines are actually a command for `openssl` to create the\
    \ keys.\n* The last line allows only the root user access to the file."
