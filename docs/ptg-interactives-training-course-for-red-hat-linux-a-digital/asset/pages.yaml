  md: '# Lesson 5.5


    # Routing with Linux


    +   - Routing allows you to connect two Ethernet networks with the Linux machine
    in the center.


    +   - To start routing with Linux, you first have to have two TCP/IP connections;
    usually this would be two Ethernet cards, but it could be one Ethernet and one
    PPP, for instance. Assuming you have a 3Com 3c503 and a Digital 21140-based card,
    the /etc/conf.modules looks like this:


    ```

    Sample /etc/conf.modules

    alias eth0 tulip

    alias eth1 3c503 options eth1 xcvr=1

    ```


    eth0 (the first Ethernet port) is going to be the tulip (which is the name for
    the Digital/Intel chip).\-

    The second Ethernet port is the 3C503 card.\-

    The section starting with options passes xcvr=1 to the module when loading the
    3c503 module. This allows us to use the AUI port instead of the coax port on the
    card.


