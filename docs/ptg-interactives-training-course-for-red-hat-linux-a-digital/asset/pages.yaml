  md: '# Secure Shell (SSH)


    +   - Most break-ins occur when machines have insecure services such as telnet
    and FTP running.


    +   - The Secure Shell (SSH) was developed as a response to both telnet and FTP,
    allowing for file transfers and shell access over an encrypted link.


    +   - The SSH program encrypts the entire transaction of the link.


    +   - SSH also does some checking to verify the host you are connecting from and
    the host you are connecting to.


    +   - Commercial versions of SSH for Windows and other platforms are available,
    allowing all the clients on the network to have secure connections.


    +   - The SSH implementation used in Red Hat Linux is OpenSSH; the name of the
    application is ssh.


    +   - Setting up ssh requires that you run it on the machines you will be talking
    between.


    +   - Let''s call the client (your personal machine) jackie.wayga.org, and the
    server (where you want to connect) jackie.wayga.org.


    > > You need to install and start sshd on hudson. You can get sshd from the “OpenSSH-server”
    package, which should already be installed.


    +   - On the client side, jackie only requires the “OpenSSH-client” package to
    be installed.


    +   - Once installed, you can use OpenSSH to connect to hudson: ssh -l markk hudson.


    +   - The first time you connect, hudson and jackie exchange keys; you will be
    notified that the key is not known and asked if you want to add the key to your
    local database.


    +   - In the future, if you reinstall OpenSSH, you may get an error that the key
    the client has does not match that the server has provided. This can be an indication
    that the key has changed, or a rogue host is trying to pass itself off as the
    server.


    +   - The global configuration files are located in /etc. These files are /etc/sshd_config
    for server configuration and /etc/ssh_config for SSH configuration. The options
    for these files are listed in the man pages for SSH and SSHd.'
