  md: '# Removing RPMs from the System


    +   - Remove RPMs from your system with the -e switch (for erase) followed by
    the name of the RPM.

    - You may not remove packages that have other packages depend on it. In order
    to remove packages that have dependency issues, you must remove the other packages
    first.

    - To remove a package from a system, you do not need to know the version, build,
    or architecture.


