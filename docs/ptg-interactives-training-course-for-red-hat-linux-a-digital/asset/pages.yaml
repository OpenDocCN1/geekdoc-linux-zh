  md: "# Connecting to an Ethernet Network\n\n+   * Install an Ethernet card in your\
    \ machine and reboot.\n* Red Hat's Kudzu utility will recognize the card when\
    \ you reboot and ask you to configure the card. You may choose to configure the\
    \ card at this time, or continue on and configure it later using **netcfg**.\n\
    * To add networking for this Ethernet card, you first have to initialize and set\
    \ up the IP interface, then you have to set up routing for that interface.\n*\
    \ The `/sbin/ifconfig` program will register the Ethernet card with the TCP/IP\
    \ services. The typical syntax is `# /sbin/ifconfig IPAddress`\n    — The mask\
    \ and broadcast addresses are given, followed by the IP address for the interface.\
    \ The interface is automatically brought up if you give it an IP address.\n* The\
    \ method of routing we use here is to set up a default gateway. This tells Linux\
    \ that any packets destined for another network get forwarded to the gateway,\
    \ which will hopefully know where to send it from. This is done via the command\
    \ `# route add default gw IPAddress`\n* **netcfg** is an excellent tool for setting\
    \ up your network devices. Get your IP address, nameserver information, gateway,\
    \ mask Under the Names section, verify the hostname, domain, and IP address for\
    \ your nameservers.\n    — The Hosts section lists what IP addresses and hostnames\
    \ you have in your `/etc/hosts` file. This should contain at least your IP address\
    \ and hostname.\n    — If you are not using DNS you will need to list all the\
    \ hosts you want to talk to along with their IP addresses under the Hosts section.\n\
    \    — The Interfaces section lists which interfaces are available to you. The\
    \ LO interface is the loopback interface and is used to route TCP/IP packets to\
    \ the local machine.\n    — The loopback interface always has an IP address of\
    \ 127.0.0.1 and is required for many programs under Linux to work properly."
