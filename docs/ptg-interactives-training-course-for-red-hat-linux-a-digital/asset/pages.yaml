  md: "# DHCP\n\n+   - DHCP stands for Dynamic Host Configuration Protocol.\n- When\
    \ a machine using DHCP brings up its interface, it sends an Ethernet broadcast\
    \ requesting host information. A DHCP server responds with an Ethernet packet\
    \ containing:\n  - Dynamic host setup—You don't need to know what every machine's\
