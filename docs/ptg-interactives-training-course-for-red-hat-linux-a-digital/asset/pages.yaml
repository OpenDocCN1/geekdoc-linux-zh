  md: '# LECTURE 3 ACCOUNT ADMINISTRATION


    # Lesson 3.1


    # Adding Users


    +   - User data and group information are usually stored in three files: /etc/passwd,
    /etc/shadow and /etc/group.

    - The /etc/passwd file stores usernames, real names, and other user information
    in this format: markk:x:500:500:Mark F. Komarinski:/home/markk:/bin/tcsh.

    - Fields are delimited by columns.

    - In order, these fields are the username, encrypted password, user ID (UID),
    primary group (GID), real name, home directory, and login shell. An “x” in the
    “encrypted password” field indicates the use of shadow passwords (stored in /etc/shadow).

    - The /etc/shadow file stores information related to user passwords, such as the
    encrypted password and time information about when the password was last changed,
    and when it should be changed in the future. A typical /etc/shadow entry is markk:$1$cnfQYft$z4Wevfsfq2ge9Rfihki/:11517:0:9999:7::

    - In order, the fields are user name, encrypted password, number of days since
    the Epoch that the password was last changed, number of days before the password
    may be changed, number of days before it must be changed, number of days warning
    before password expires, number of days after expiration before account is disabled,
    number of days after Epoch that the account will be disabled, and one additional
    field reserved for use.

    - The Epoch is the common name for January 1, 1970, the start of the known UNIX
    age.

    - Only users who get access to the system will be warned that their password will
    expire. Users who only get access through network services like Samba or e-mail
    will not receive notification that their password will expire.

    - This file is only accessible via root, and therefore is more secure than the
    /etc/password file.

    - The /etc/group file stores group information and lists the groups the user is
    in. A typical entry for /etc/group is doc:x:50:markk, bdk, pkomarinski.'
  merge: -1
