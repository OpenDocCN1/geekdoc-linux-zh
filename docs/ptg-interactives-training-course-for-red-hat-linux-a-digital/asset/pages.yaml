  md: '# Lesson 4.1


    # Working with Binary RPM Files


    +   - Precompiled RPM files typically have the following filename syntax: package-1.0-1.i386.rpm.
    This syntax tells you the following four things:

    - package: The name of the package, which is the same name as the RPM package
    name.

    - 1.0: Version number of the source package.

    - 1: Release number of the package. This along with the version of the package
    gives the version number of the RPM package.

    - i386: Architecture for the build. You''ll typically see i386, sparc, or alpha.


    Notes:'
