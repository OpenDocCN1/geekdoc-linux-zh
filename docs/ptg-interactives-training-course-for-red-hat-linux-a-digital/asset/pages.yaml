  md: '# tcpdump


    +   - The tcpdump program puts the Ethernet card into promiscuous mode.

    - All packets seen by the card are displayed on the screen.

    - Filters exist to see only the data that you want to see.

    - Here are a few packets related to ARP:


    ```

    21:49:12.480000 arp who-has myachine.insidehost.com tell

    gateway.insidehost.com

    21:49:12.480000 reply myachine.insidehost.com is-at

    00:0c:01:b4:4f:dc

    ```


    +   - The first line is a request from gateway asking for the Ethernet address
    for my machine.

    - The next line is a reply with the MAC address.

    - This is fairly common, since ARP caches do not last all that

    long.


    +   - Here are some ICMP-related packets:


    ```

    21:50:05.510000 myachine.insidehost.com >

    ping.outsidehost.com: icmp:

    echo request

    21:50:05.650000 ping.outsidehost.com >

    myachine/insidehost.com: icmp:

    echo reply

    ```


    +   - Here we see a ping going from my machine out to a remote site called ping.outsidehost.com.

    - About 140ms later (6500000 minus 510000), the ping is answered with a reply.

    - Since a ping is really asking the remote side to echo data, this

    is how tcpdump reports it.


    +   - Below, tcpdump is run on the second Ethernet port (also known as eth1):


    **Using tcpdump on other interfaces**


    ```

    # /usr/sbin/tcpdump -i eth1

    tcpdump: listening on eth1

    23:12:59.510000 192.168.1.15.listen > hudson.telnet: . ack

    76005909 win 78432 (DF)

    23:12:59.510000 hudson.telnet > 192.168.1.15.listen:

    P 1:29(28) ack 0 win 32736 (DF)

    ```'
