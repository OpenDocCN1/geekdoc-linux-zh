  md: "# LECTURE 4 INSTALLING NEW PACKAGES IN RED HAT\n\n# Lesson 4.2\n\n# Source\
    \ RPM (SRPM)\n\n+   - Source RPMs contain the source code for an application that\
    \ either must be compiled prior to installation, or allow you to modify source\
    \ code or pre-compile options before installing the software.\n- The directory\
    \ structure for building source RPMs is in `/usr/src/redhat`. Underneath this\
    \ directory are the following:\n  - SPECS: contains specification files used to\
    \ build RPMs from source code\n  - BUILD: base directory where source code is\
    \ built\n  - SOURCE: location of the .tar.gz and any patch files\n  - RPMS: contains\
    \ the resulting RPM files\n- SRPM: You can also build SRPMs, and the built SRPMs\
    \ are located here. To build a SRPM (example called `package-2.1`) to a binary,\
    \ do the following:\n  - Install the source RPM file (`rpm -Uvh package-2.1.rpm`).\n\
    \  - Go to the SPECS directory (`cd /usr/src/redhat/SPECS`).\n  - Create a binary\
    \ RPM from the source spec (`rpmsuild -bb -clean package-2.1.spec`).\n  - Install\
    \ the binary RPM (`cd /usr/src/redhat/RPMS/i386; rpm -UVH package-2.1-1.i186.rpm`).\n\
    \  - Uninstall the source RPM (`cd /usr/src/redhat/SPECS; rpm -rmssource package-2.1.spec`).\n\
    \  - Remove the source RPM (`rm package-2.1.src.rpm`).\n- Many third party open\
    \ source applications do not distribute SRPM files, but instead distribute a `.spec`\
    \ file within the source `.tar.gz`. You can automatically build a binary RPM file:\
    \ `# rpmsbuild -bt example.tar.gz."
