    employees can go out to the rest of the Internet without using proxies.

    - All the traffic that goes in or out of the router first passes through the firewall.

    - Programs like TripWire run on all hosts. TripWire can monitor system files like
    /etc/passwd and know when these files change. If a file is changed, it sends an
    alert that a potential crack is in progress.

    - For incoming services, anything that requires authentication from a user must
    be encrypted to prevent a rogue host from sniffing passwords.'
