  md: '# RED HAT LINUX TRAINING COURSE WORKBOOK


    +   - Once started, go to an SMB client and perform a network browse. You should
    see your Linux machine in the list of machines.


    +   - If not, you can check through the logs located in /var/log. Each client
    machine and samba and nmb process has its own log files (samba-log.machename,
    samba-log.smb, and samba-log.nmb).


    +   - If you see the Linux machine listed in the browse list, then you need to
    connect to a share.


    +   - Public connections do not require a valid login and are an easy way to test
    how things are working. These kinds of connections are easy to make but very short
    on security.


    +   - If you choose to do this, set the public=yes option in the configuration
    for the share.


    +   - There are three methods of authenticating users to access nonpublic-connections.


    +   - First is user, where a username and password are authenticated /etc/passwd.
    This method of connection requires that the username over Linux and the SMB client
    match.


    +   - The second method is to forward authentication requests to another server.
    This is called server authentication, and you have to trust the machine to which
    you''re forwarding requests.


    +   - The third method of authentication is called share and does not require
    that the usernames over Linux and the SMB client match.


    +   - SMB allows for both encrypted and unencrypted passwords.


    +   - Encrypted passwords increase security but are encrypted with a one-way hash
    that is incompatible with the way passwords are stored in /etc/passwd.


    +   - NT 4 Service Pack 3, Windows 98, and Windows 2000 and above send encrypted
    passwords by default, and the only way to adjust this is in the Registry.


    +   - There are two better ways to handle this.


    +   - If you have an existing PDC (Primary Domain Controller), set the Linux box
    to forward passwords to the PDC.


    +   ✧ Do this by setting the password server to point to the PDC and security=user
    (both these settings are under [Global]).'
