  md: "# Lesson 8.1\n\n# Setting up Sendmail\n\n+   * The Mail Transport Agent (or\
    \ MTA) for Red Hat Linux is sendmail.\n* Sendmail is the standard for most Linux\
    \ installations, although there are others available.\n* A majority of the e-mail\
    \ that travels around the world travels through a sendmail server.\n* When e-mail\
    \ is sent from sendmail, it goes from the mail client to the server, where it\
    \ is held in a queue.\n* When the e-mail gets to the head of the queue, sendmail\
    \ attempts to send the e-mail to the recipient.\n* Sendmail cannot connect to\
    \ the remote SMTP server, it keeps the message in the queue and attempts to send\
    \ the e-mail every hour.\n* There are a number of reasons why an e-mail message\
    \ would be held in a queue.\n  * One is that there is the network between you,\
    \ and the remote machine is down.\n  * Another is that your local server is not\
    \ on the Internet all the time.\n  * The mailq command will list what sendmail\
    \ has in queue and the reason why an e-mail message is stuck in the queue.\n \
    \ * If there is a lot of e-mail in the queue, you may have a network or configuration\
    \ problem.\n* Verify that sendmail is running by connecting to TCP port 25.\n\n\
    ```\n```[kmomarinski@hudson mkomarinski]$$ telnet localhost 25\nTrying 127.0.0.1...\n\
    Connected to localhost.\nEscape character is '^'.\n220 hudson.wayga.org SMTP Sendmail\
    \ 8.11.2/8.11.2; Sun, 12 Aug 2001 21:37:26 -0400n```\n```\n\n+   * The configuration\
    \ options for sendmail are typically located in /etc/sendmail.cf. Do not change\
    \ anything unless you know"
