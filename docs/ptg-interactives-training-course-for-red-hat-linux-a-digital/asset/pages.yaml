- img_proc: true
  md: '# The Boot Prompt


    +   * After installing Linux, starting your machine will probably bring up a graphical
    window allowing you to choose which OS to boot.

    * The default is “linux” and it will boot before after a few seconds if you do
    not make a selection.

    * Linux relies on being able to pass options to the kernel, so LILO makes this
    easy to do.

    * You can add many of these options to the LILO configuration file.

    * If you need to pass extra options to the Linux kernel before bootup, you can
    press CTRL-X to access the text interface to LILO; this is the only way to pass
    extra parameters to the Linux kernel at startup time.

    * From the text interface, there are a number of configuration parameters that
    you can add to the end of the name you use to start Linux. By default, this is
    just “linux”. These parameters allow you to do many things, including changing
    the root partition, deciding whether the root filesystem is read-only or read-write,
    specifying memory size, and so on.


    Notes:'
  merge: -1
  pgno: 19
- img_proc: true
  md: "# LECTURE 2 LINUX BOOT AND SHUTDOWN\n\n# Configuring LILO\n\n+   - You can\
    \ configure LILO to use favorite options each time you boot.\n- /etc/lilo.conf\
    \ file contains information that LILO uses at startup. This is also where the\
    \ operating systems you want to boot are configured.\n- Below is an example lilo.conf\
    \ file.\n  - The boot line tells LILO where to install. Since it's the first drive,\
    \ LILO gets configured as the primary bootloader.\n  - If you have another bootloader,\
    \ you can configure LILO to use the Linux root partition to be a secondary bootloader.\n\
    \  - The section for Linux handles many of the configuration options mentioned\
    \ in the previous section. The label, root partition, and VGA setting are all\
    \ configured.\n  - One important line here is the image section. This line tells\
    \ LILO which kernel to boot. A feature of the image line is you can boot multiple\
    \ versions of the kernel all using the same Linux Linux installation.\n\nNotes:"
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Sample lilo.conf


    ```

    # Tell LILO to install itself as the primary boot loader

    /dev/hda

    boot = /dev/hda

    # The boot image to install; you probably shouldn''t change this

    install = /boot/boot.b


    # The stanza for booting Linux

    image = /boot/vmlinuz

    label = linux

    root = /dev/hda2


    vga = ask


    #The stanza for booting MS-DOS

    other = /dev/hdb1

    label = dos

    table = /dev/hdb

    # The kernel is in /boot/vmlinuz

    # Give it the name "linux"

    # Use /dev/hda2 (first drive,

    second partition)

    # as the root filesystem

    # Prompt for VGA mode

    # This is the MS-DOS partition

    # Give it the name "dos"

    # The partition table for the

    second drive

    ```


    +   * Once /etc/lilo.conf is configured to your liking, you must run /sbin/lilo
    as root to install your configuration file.

    * To remove LILO from your system:

    * From DOS (and Windows 98 as well) use the fdisk /mbr command. From Linux, the
    lilo -u command will uninstall LILO.


    # Notes:


    ![](img/82fbcc74bc25eeea437e17c816ad0621_21_0.png)'
  merge: -1
