  md: '# LECTURE 14 BACKING UP YOUR DATA 199


    +   - Install the raidtools from the RedHat CD-ROM.

    - Read the documentation located in /usr/share/doc/raid-tools.

    - Configure /etc/raid.conf for the partitions and block sizes you are using.

    - Use mkraid to create the raid device. By default, this is called /dev/md0.

    - The /etc/raid.conf file lists the device you are using.


    +   - You may now treat /dev/md0 just like any other raw partition. You can use
    mke2fs to format the partition and then copy files over. You can look at /proc/mdstats
    to get a status of the RAID information.

    - If you want to stop RAID services, unmount the device and use raidstop.

    - On startup, use raidstart to start RAID services.

    - RedHat will automatically detect RAID devices and start them as part of its
    boot procedure. You will have to mount the RAID system once it''s activated.


    Notes:'
