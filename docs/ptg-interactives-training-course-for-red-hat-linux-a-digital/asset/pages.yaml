  md: "# Lesson 12.3\n\n# Tuning a Running Linux System\n\n# The /proc Filesystem\n\
    \n+   - In the event of serious memory or hardware issues, you can sometimes get\
    \ a change depending on the kernel revision, but is generally arranged in different\
    \ classes.\n  - `Processes` contains information about each of the running processes,\
    \ organized by PID. Each process has its own directory of information.\n  - `bus`\
    \ contains information about the system busses.\n  - `cpuinfo` holds information\
    \ about the CPU(s) installed in your system.\n  - `filesystems` has a list of\
    \ the filesystems that the kernel currently knows about.\n  - `ide` contains information\
    \ about the IDE devices that are in your system. It is organized by IDE channels\
    \ that are available.\n  - `meminfo` has the raw memory information that you would\
    \ normally see as output of `free`.\n  - `modules` gives a listing of the modules,\
    \ size of the module, and dependencies for the module.\n  - `partitions` has a\
    \ list of all the disk partitions that are known to Linux, including those not\
    \ mounted or listed in /etc/fstab.\n  - `pci`: This file may go away in the long\
    \ term, in favor of /proc/bus/pci, /proc/pci is more human readable, listing the\
    \ device type, vendor, and device name.\n  - `scsi` is much the same as for IDE,\
    \ listing chains, followed by devices on each chain.\n  - `swaps` lists all mounted\
    \ swap partitions (or files) mounted.\n  - `version` contains version information\
    \ of the kernel you are using. It's very helpful in that it has the user and host\
    \ that the kernel was compiled on, GCC version used to compile the kernel, date\
    \ and time this kernel was compiled.\n- Not listed above is /proc/sys. This directory\
    \ is where most of the runtime changes to the kernel take place."
