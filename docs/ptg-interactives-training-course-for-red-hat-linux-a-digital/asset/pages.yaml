  md: '# POP


    +   * POP is rather simple. You can get, list, and delete mail, and that''s it.

    * The downside to POP is that the e-mail on the server is often deleted once it
    is sent to you.

    * Netscape, Outlook, and most PC-based Internet e-mail programs handle POP.

    * Due to its easy implementation, POP support in clients is much more prevalent
    than IMAP.

    * The POP server (popper) is included in a typical Red Hat distribution.

    * To use it, configure the client software so that the server matches the Linux
    box. The username and password are the same as in /etc/passwd.

    * Remember that any e-mail downloaded gets stored on the local machine. One option
    to look at is the “Don''t delete from server” option.

    * If you have two locations where you want to read your e-mail from (work and
    home), you can leave this option off on the office e-mail system and turn it on
    at home. This way, all your e-mail gets downloaded at work, and you can only get
    new e-mail from home.

    * However, IMAP is a much better solution to this problem.


    Notes:'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# LECTURE 8 E-MAIL 129


    # IMAP


    +   - IMAP is somewhat more complex than POP but has several advantages.


    +   - All e-mail will be backed up with the server.


    +   - IMAP can be accessed from anywhere, without any special preparations.


    +   - IMAP is also lightweight; large attachments are replaced by small headers
    describing the sender, type, and size of the files. The entire-attachment is only
    downloaded if the user requests it.


    +   - E-mail can be stored in different files (often called folders).\n  - These
    folders remain on the server side and can be accessed by the client software at
    any time.


    +   - Another big feature of IMAP is disconnected mode.\n  - If the client supports
    it, you can have the client download one or more folders to your local machine.
    You can read, modify, delete, reply, and so on without being connected to a network.


    +   - The IMAP server is included with Red Hat in the imap-4.5 RPM and is configured
    to get files from /var/spool/mail.


    +   - Client setup requires you to set the server name and the username/password.


    +   - One option that you will need to look at is the server directory option,
    which tells the client what directory on the server contains the mail folders.
    If the user shares home directories via Samba or NFS, you''ll want to change the
    server directory to something like ~user/Mail.


    +   - The downside is that you have to set it each time you configure someone
    for IMAP.


    +   - The benefit is that your users won''t confuse their e-mail with their regular
    files.


    +   - By default, mbox (mail that was read and not put in another mail folder)
    is stored in ~user/mbox, which is actually the same file used by the UNIX mail
    program.


    +   - New mail is checked for in /var/spool/mail.


    +   - If you need to change this, you''ll have to recompile the software.'
