    +   - Call this /etc/smbpasswd, which is the default for Samba.


    +   - You can use the mksmbpasswd.sh program that comes with the samba RPM to
    assist in this conversion:


    ```

    # cat /etc/smbpasswd | /usr/bin/mksmbpasswd.sh =

    /etc/smbpasswd

    ```


    +   - The file will then contain lines that look like this: mkomarin-ski:500:XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX:[U
    :LCT-00000000:mkomarinski


    +   - SMB passwords are exactly 32 bytes long (hence the 32 X''s).


    +   - By default, these Xs disable access, you must change the password entry
    before anyone can use it, which can be done two ways:


    +   - The first way is to replace the first 11 Xs in the first group with the
    string NO PASSWORD.


    +   - If you do this, make the option null passwords=true enabled in /etc/samba/smb.conf.


    +   - The other method is to use smbpasswd to set a temporary password per.


    +   - Once a password is set and you need to root to this initially tell the user
    what that password is, use the smbpasswd command to change it to suit his or her
    need.


    +   - One option you may want to consider the “sync unix passwd”, which is located
    under SWAT under Globals. Setting it to Yes will synchronize the UNIX password
    file and smbpasswd file the next time the password is changed by the user.


    +   - Also, the option “Encrypt Passwords” is set to No by default. You’ll need
    to set this to Yes to have Samba start using /etc/smbpasswd.'
