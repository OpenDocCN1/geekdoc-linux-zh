- img_proc: true
  md: '# Installing and Upgrading Binary RPM Files


    +   - The -i switch to the rpm command, followed by a filename or list of files,
    indicates that the file is going to be installed.

    - If an older version of the package already exists, you''ll get an error.

    - If you use the -U switch, this indicates an upgrade.

    - The -F switch, which stands for “freshen”, tells RPM to upgrade the package,
    but only if an older version has been installed.

    - Each of these switches can also use the -h switch, which shows hash marks (#)
    as the install progresses.

    - Any of these may fail if dependencies are not met.

    - There may be a case where you know the dependency is met, but RPM does not know
    about it. In this case, you can add the --nodeps switch to tell RPM to ignore
    dependency checks.

    - To install a package, use this command, assuming example-1.0-1.i386.rpm is in
    the current directory: # rpm -i example-1.0-1.i386.rpm.


    Notes:'
  merge: -1
