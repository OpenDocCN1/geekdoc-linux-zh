  md: "# Ethernet\n\n+   - Ethernet was developed in the 1970s as a broadcast-style\
    \ network. If one host is talking to another, all other hosts will have the information,\
    \ and no other host will be able to communicate at the same time.\n\n+   - The\
    \ more common forms of Ethernet use a star configuration, where a cable from each\
    \ machine runs into a switch or hub.\n  - One advantage of the star-style network\
    \ is that all the members of the network do not have to contend for access to\
    \ the network at all. The hub or switch is much faster than negotiating traffic.\n\
    \  - In addition, if the cable to one host goes down, none of the other hosts\
    \ on the network will fall off the network.\n\n+   - Each Ethernet adapter has\
    \ a unique address (Media Access Connector or MAC address) assigned to it by the\
    \ Ethernet adapter manufacturer.\n  - When an Ethernet adapter wants to talk to\
    \ another Ethernet adapter, it sends a message containing its own MAC address,\
    \ as well as the receiving MAC address. If the receiving MAC address is on that\
    \ run of cable, it gets the message.\n\n+   - Collisions occur when two Ethernet\
    \ adapters try to transmit at the same time. If this happens, both adapters stop\
    \ transmission, wait a random amount of time, and retransmit.\n\n+   - Having\
    \ too many collisions indicates a network that has very heavy traffic and is running\
    \ inefficiently. To correct this, you may want to split the network into two networks\
    \ or use a switch instead of a hub.\n\n+   - Each Ethernet packet has to and from\
    \ Ethernet addresses along with IP to and from addresses, followed by the data,\
    \ and finally some error-checking data to verify that a packet arrives complete.\n\
    \n+   - Even though all the other adapters on a cable see a packet, they do not\
    \ answer or respond. The only message that all Ethernet adapters should receive\
    \ is an Ethernet broadcast.\n\n+   - For a packet to get from one subnet to another,\
    \ a router is used. If the router knows that a particular packet needs to be forwarded\
    \ to another subnet, it forwards the packet."
  merge: -1
  pgno: 59
- img_proc: true
  md: "# LECTURE 5 NETWORKING WITH LINUX\n\n+   - The Address Resolution Protocol\
    \ (or ARP) cache allows Linux (and TCP/IP) to make connections between an Ethernet\
    \ address and an IP address.\n  - Linux first sends an Ethernet broadcast asking\
    \ for a mapping from an IP address to a MAC address.\n  - The receiving end with\
    \ that IP address responds with an ARP reply, giving the IP address and its MAC\
    \ address.\n  - Linux stores MAC address in an ARP cache for future use.\n- There\
    \ is an option for TCP/IP packets to set the maximum size of the IP packets.\n\
    \  - Each physical medium has its own Maximum Transmission Unit based on a balance\
    \ of latency (the amount of time it takes a packet to cross the medium) and the\
    \ amount of data that can be sent.\n  - Small packets have lower latency, but\
    \ decreased performance, since a larger percentage of the packet is header and\
    \ footer information. Large packets send more data efficiently, but have a higher\
    \ latency.\n\nNotes:"
  merge: -1
