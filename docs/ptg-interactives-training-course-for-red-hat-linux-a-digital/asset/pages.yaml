  md: '# LECTURE 11 SECURING LINUX


    # Lesson 11.4


    # Network Security


    +   - Network security covers how to set up your network and data so it is more
    secure.

    - For a small office setting, it''s probably best to have a single host to interact
    with the outside world.

    - Protect the rest of the network using Linux''s built-in packet filtering iptables.

    - Monitor the anonymous FTP and WWW logs for break-ins. These logs are found at
    /var/log.

