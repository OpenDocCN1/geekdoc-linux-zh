  md: '# Restricting the Use of CGI


    +   The <Directory> directive, coupled with Linux user and group permissions,
    can exercise very fine control over who can do what in areas of your web space.


    +   In general, you will likely not want CGI to be executable from arbitrary directories.


    +   Additionally, you will likely want to prohibit browsers from roaming through
    the filesystem, be it a particular user''s or the root filesystem.


    +   To make the entire filesystem off-limits to the server, a directive like this
    is placed in httpd.conf:


    ```

    <Directory />

    AllowOverride None

    Order deny,allow

    Deny from all

    Options None

    </Directory>

    ```


    +   You tell Apache what directories it can serve pages from by adding a statement
    like the following to allow you to serve user files.


    ```

    <Directory /home/**/public_html>

    Order allow,deny

    Allow from all

    AllowOverrides IncludesNOEXEC

    </Directory>

    ```


    +   This lets you serve pages from your users'' public_html directories and lets
    them use SSI that doesn''t execute external programs or CGI scripts.


    +   Some companies have a policy that user pages cannot be seen outside the company
    for legal reasons.


    +   In this event, you can assign authentication as shown previously, or limit
    access to those within a specific domain or network range using “Allow From”.


    +   In our example above, you can see that it is set to “All”, meaning anyone
    can access the file. Changing this to something like “Allow From .wayga.org” will
    allow only hosts in the domain .wayga.org to access the personal pages.'
  merge: -1
