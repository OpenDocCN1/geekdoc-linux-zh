  md: "# Configuring the Berkeley Internet Name Daemon 9.1 (BIND)\n\n+   - To be a\
    \ DNS server, you need to get (possibly compile) and configure bind.\n- It's very\
    \ likely that named was installed when Linux was installed; if not, you can install\
    \ the bind package and bind-devel package from the CD-ROM or the Red Hat Updates\
    \ site.\n- The basic configuration file is /etc/named.conf. It has four types\
    \ of statements: one controlling access, one describing the logging, describing\
    \ the more general options, and one or more describing the zone(s) it is a server\
    \ for. Comments in the file start with a hash mark (#).\n\n```\nSample /etc/named.conf\n\
    \noptions {\n    directory \"/var/named\";\n    // If we want to read files, take\
    \ them from /var/named.\n}\n\nzone \".\" {\n    type hint;\n    file \"named.ca\"\
    ;\n}\n\nzone \"0.0.127.IN-ADDR.ARPA\" {\n    type master;\n    file \"named.local\"\
    ;\n}\n\nzone \"1.168.192.in-addr.arpa\" {\n    type master;\n    file \"named.192.168.1\"\
    ;\n}\n\nzone \"wayga.org\" {\n    type master;\n    file \"named.wayga\";\n  \
    \  notify yes;\n}\n\nzone \"wayga.org\" {\n    type slave;\n    masters { 192.168.1.1;\
    \ }\n};\n```"
  merge: -1
  pgno: 77
- img_proc: true
  md: '# LECTURE 5 NETWORKING WITH LINUX


    - The options statement describes what IPs to listen for and what port to use.
    The working directory for named here, /var/named, is fairly widely used. The zone
    files and any other files specified in various statements will live here in the
    absence of any domain information.


    - The logging statement controls the verbosity of the logging and where log messages
    are sent.


    - The acl statement controls which clients your server will answer queries from.


    - zone statements describe what zones the server serves, either as a master or
    a slave (we ignore the stub type here).


    +   * A master is the master authority for information in that domain (zone).


    +   * A slave is a secondary disseminator of zone information, but no changes
    can be made at the slave.


    +   * There is one special type used when specifying the nameservers. It is called
    a hint because named.ca really just supplies a list of servers, some of which
    will have the current list of root nameservers.


    +   * For a slave zone, you must specify at least one master from which bind can
    transfer the zone records.


    This example has a total of five entries for domains.


    - The special domain “.\”, represents the root domain, where to look when nothing
    else is found. The root domain usually points to the list of root servers for
    the entire Internet.


    - The second and third zones are special domains that allow you to determine the
    name of a host if given its IP address; note that the IP addresses are listed
    in reverse order (0.0.127-in-127.0.0).


    - The fourth zone for wayga.org indicates that this server is a master server
    and the zone file is located in named.wayga.


    +   * The notify statement tells bind to tell the slave servers the configuration
    for master changes.


    - The final zone for wayga.org indicates that this server is a slave server; there
    are no configuration files for wayga.org on this server, but it can get the configuration
    from the master, located at 192.168.1.1.'
  merge: -1
  pgno: 78
- img_proc: true
  md: "The named.wayga file contains DNS information about the hosts in the wayga.org\
    \ domain. This file can define a lot of things, the most important being the hostname\
    \ to IP address mapping.\n\n# Sample named.wayga file\n\n```\n$TTL 10800     \
    \ IN SOA wayga.org.\n@               mkolarinski.wayga.org. ( \n             \
    \                  200012717 ; refresh\n                               3600  \
    \           ; retry\n                               900             ; expire\n\
    \                               120600           ; default_ttl\n             \
    \                  10800 )\n\n@               IN NS 192.168.1.1\n@           \
    \    IN MX 10 wayga.org.\nwayga.org.      IN A 192.168.1.1\nfuzzy.wayga.org. IN\
    \ A 192.168.1.2\nwww.            IN CNAME wayga.org.\nkryten          IN CNAME\
    \ wayga.org.\nmojoojoj         IN CNAME wayga.org.\n```\n\n+   - Starting off\
    \ each domain record is the SOA, or Start Of Authority.\n  - The Start Of Authority\
    \ starts with the SOA header information, followed by the domain name this SOA\
    \ is for, and a contact name.\n  - Since a @ cannot be in the contact name, replace\
    \ it with a pe-period, as shown in the first line.\n  - The serial number is a\
    \ unique number that usually contains the date and number within the day.\n- The\
    \ remainder of the entries are all in units of seconds.\n  - refresh indicates\
    \ the amount of time before the domain should be refreshed.\n  - retry is the\
    \ amount of time before a failed refresh should be attempted again.\n  - expire\
    \ is the amount of time before a caching name server should purge its information.\n\
    \  - minimum_ttl is the minimum amount of time that this information is good.\n\
    - The MX record is where mail should be sent to; the MX record takes a number\
    \ which indicates how preferable this particular record is for accepting mail,\
    \ useful if you have multiple MX records for a"
