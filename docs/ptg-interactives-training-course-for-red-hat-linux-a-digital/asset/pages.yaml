  md: '# Preparing to Install


    +   - The CD-ROM supplied from Red Hat is bootable and thus you do not need to
    make boot floppies. Check the documentation with your system or motherboard to
    determine how to boot from the CD-ROM.

    - Gather all the information you can get about the hardware in your system.

    - The Red Hat installer will usually automatically detect what hardware you have.

    - If the installer does not recognize the hardware, it will prompt you for hardware
    parameters which can be found in the appropriate manuals.

    - Have your network configuration information on hand.


    Notes:'
