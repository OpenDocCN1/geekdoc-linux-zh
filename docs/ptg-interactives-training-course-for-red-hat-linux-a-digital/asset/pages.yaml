  md: "# Routing by Hand\n\n+   * These commands, entered by hand, will allow you\
    \ to route between two networks:\n\n```\n# /sbin/ifconfig eth0 192.168.1.10\n\
    # /sbin/route add -net 192.168.1.0\n# /sbin/ifconfig eth1 192.168.2.10\n# /sbin/route\
    \ add -net 192.168.2.0\n# /sbin/route add default gateway 192.168.1.15\n```\n\n\
    +   * If you use these in a file like rc.local, it will work, but it is not compatible\
    \ with the way that linuxconf or netcfg stores its routing information. Make sure\
    \ you're not conflicting with these other methods.\n\n+   * The above example\
    \ assumes two networks, 192.168.1.0 and 192.168.2.0 respectively. Substitute the\
    \ appropriate network addresses for your own routing.\n  - ifconfig activates\
    \ the module (if necessary) and configures the device.\n  - route tells the networking\
    \ section to pass packets for each kind of network to the specified Ethernet Card.\n\
    \  - The final route designates a default location for packets that don't match\
    \ any other route to go.\n\n+   * This example only shows how to use static routing.\
    \ There are other methods of automatic routing.\n\n+   * If you replace eth0 with\
    \ ppp0, you now have a routing PPP dialin. The Linux machine is dialed into another\
    \ machine, and is able to route data between the local Ethernet network and the\
