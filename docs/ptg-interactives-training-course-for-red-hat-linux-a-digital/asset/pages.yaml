- img_proc: true
  md: '# Lesson 14.1


    Using tar and mt are the most basic ways, and probably oldest

    * tar and mt are the most basic ways, and probably the oldest, of backing up data.

    * The mt command is known mostly now as a UNIX version of the zip command.

    * The mt program controls magnetic tape drives and can be used in conjunction
    with tar to control your backups.

    * Using tar in a basic fashion, you can create a cron job that compress and archive
    all of your filesystems and network volumes to a tape drive every night or every
    few nights. There are a couple of drawbacks to this method.

    * First, only a small fraction of the filesystem changes over the course of even
    a week.

    * Second, it''s very possible that you could have more data to back up than the
    capacity on your tape.

    * If your backups are small enough you may want to put more than one on a single
    tape, and then you may need some way to access a particular archive at some later
    point.


    Notes:'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# Using tar


    +   The tar command has three major functions: create a tar file, list the contents
    of a tar file, and extract files from an existing tar file.


    +   Other commonly used switches include f for filename, v for verbose, and z
    to enable gzip (de)compression.


    +   If multiple switches that require arguments are used, you can line up both
    the switches followed by the arguments, or list a switch followed by its argument:


    ```

    $ tar -cvf foo.tar file1 file2 file3

    $ tar -c f file1 file2 file3 -vf foo.tar

    ```


    +   If the -z switch were added, the tar would also compress the data stream with
    gzip. Typically, compressed tar files are named foo.tar.gz.


    +   You can decompress archives with the command:$ tar zkvf foo.tar.gz


    +   Read a compressed archive from a SCSI tape device with: # tar zkvf /dev/nst0.


    +   Using tar, you must know the block size when backing up and restoring files.
    Get the block size wrong, and you won''t be able to read the files you backed
    up.


    +   Increasing the block size decreases the amount of overhead when writing to
    the tape and can increase the performance and decrease the write time to the tape.


    +   The block size is added with a -B blocksize option to tar, where blocksize
    is multiplied by 512 foo.tar to get the block size in bytes.


    +   tar can archive files that are not currently needed or take a snapshot of
    a project.


    +   tar is commonly used to create packages or distributions of documentation,
    source code, or precompiled software.


    +   tar can be used to transfer directory trees around in your filesystem. Its
    many command line options let you control preservation of permissions, modification
    dates, and the following of symbolic links.


    +   In general, it is not a good idea to follow symbolic links unless you know
    where all the links in the tree are pointing.'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# Using mt


    +   * The **mt** program is used to control tape devices.


    +   * Since **tar** starts at the beginning of a block and adds an EOF (end of
    file) at the end of each block, you can use **mt -f** device **fsf count** to
    advance sections of tape.


    +   * For example, if you had five tar files on a tape and wanted to add a sixth,
    you would first advance the tape with **mt -f** /dev/nst0 **fsf 5** to get to
    the next block after the fifth end-of-file marker.


    +   * You would then use **tar -cvf** /dev/nst0 **file** to write new information.
    You would use **tar -xvf** /dev/nst0 to restore the data from tape.


    +   * Using the /dev/nst0 device name will tell the tape device to not rewind
    after completing; use this when advancing the tape with **mt**, or else the tape
    will rewind after being advanced!


    +   * /dev/st0 will rewind after the command is completed and can be used after
    a restore to automatically rewind the tape.


    +   * The **mt** command also supports an explicit rewind, and if the tape device
    supports it, it can also eject the tape. These commands are **mt -f** /dev/st0
    **rewind** and **mt -f** /dev/st0 **offline**, respectively.


    +   * Other commands to **mt** include **re-tension** (forward to the end of the
    tape, then rewind), **status** (to give a status of a tape drive), **erase** (to
    erase the tape), and a number of SCSI-options relating to hardware compression,
    buffering, density, and others.


    Notes:'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# Lesson 14.2


    dump and restore do literal dumps and restores of the entire filesystem.


    +   * dump and restore do literal dumps and restores of the entire filesystem.

    * dump cannot back up non-ext2fs filesystems, like NFS.

    * Assigning a dump level to each filesystem controls incremental backups. Dump
    levels range from 0 to 9, and when a dump of a certain level N is performed, all
    files that have changed since the last dump of level N-1 or lower are sent to
    the tape. A level 0 dump will dump the entire filesystem.

    * The dump program strongly suggests you know the length and density of the media
    being used for the backup.


    Notes:'
  merge: -1
  pgno: 201
- img_proc: true
  md: "# LECTURE 14 BACKING UP YOUR DATA\n\n# Lesson 14.3\n\n# Backup Strategies\n\
    \n+   - How often you make what kind of backup depends on several factors.\n-\
    \ In general, if more than twenty percent of a particular filesystem is changing\
    \ daily, you should perform incremental backups every day or two, a lower-level\
    \ backup weekly, and a full backup monthly.\n- Lower activity levels mean you\
    \ can space this out more, though there is really no excuse for not performing\
    \ a full backup at least once a month.\n- Another method is to perform a full\
    \ backup every night.\n  - Keep 28 tapes so that you have a total of four weeks\
    \ worth of data at any one time.\n  - Cycle tapes every six months or so.\n  -\
    \ Heavy use of tapes can cause them to deteriorate; replace them regularly.\n\
    This allows you to store information for an indefinite amount of time.\n- This\
    \ is at a higher cost, however, since you have to buy a lot of tapes and you may\
    \ not have enough storage on the tapes.\n- Buy lots of your specific backup media.\n\
    - For very active systems, which more or less cannot be taken off-line, invest\
    \ in a backup utility that can perform live backups during periods of low traffic.\n\
    - More complicated databases are problematic when it comes to live backups.\n\
    \  - Fortunatelyately, most databases can create a snapshot of themselves, and\
    \ that can be placed in your archive.\n  - Failing this, the database will have\
    \ to be taken off-line before being backed up.\n- Keep some backups off-site in\
    \ case of a big disaster."
  merge: -1
  pgno: 202
- img_proc: true
  md: "# Lesson 14.4\n\n# RAID and Disk Mirroring\n\n+   - RAID stands stands for\
    \ Redundant Array of Independent Disks.\n- The basic idea behind RAID is that\
    \ by using multiple small disks and possibly some additional parity data, you\
    \ will be able to reconstruct data lost when one of the disks fails.\n- There\
    \ are several different levels of RAID.\n- Each of these RAID types may be done\
    \ in hardware or software.\n    - RAID 0: Data striping. This doesn't actually\
    \ provide any protection against data loss but does enhance performance. Requires\
    \ a controller that supports synchronized disks; none is available for Linux.\n\
    \    - RAID 1: Disk mirroring. A second set of disks is used to provide a complete\
    \ copy of your data.\n    - RAID 2: Level 0 with a check disk for storing error\
    \ correction information.\n    - RAID 3: Level 0 with a separate disk for byte-level\
    \ parity information to help reconstruct lost data.\n    - RAID 4: Level 3 with\
    \ block-level parity information stored on a separate disk.\n    - RAID 5: Level\
    \ 4 with the parity information spread over all disks.\n- Some of the RAID levels\
    \ were made not for reliability, but for speed.\n- While a software RAID is less\
    \ expensive, since you don't need custom hard drive mountings or cards, it is\
    \ less stable than a hardware RAID.\n- Hardware RAID commonly allows for hot-swapping\
    \ hard drives immediately after one has failed. Software RAID requires shutdown\
    \ of the machine to replace hardware.\n- To create a software RAID setup on your\
    \ machine, you'll need at least two (and possibly three) drives all about the\
    \ same size.\n- Let's take a walkthrough on creating a RAID 5 setup on your machine.\n\
    \    - Create partitions on each hard drive. Each drive should have no other partitions\
    \ on it and should be a higher-end SCSI system. Each partition should be about\
    \ the same size."
  merge: -1
  pgno: 203
