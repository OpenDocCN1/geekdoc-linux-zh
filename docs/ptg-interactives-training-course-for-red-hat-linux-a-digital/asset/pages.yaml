    \ and it's configured with a pool of dynamic IP addresses, it will give those\
    \ IPs out.\n  - Hostname, routing, log host, nameserver, and WINS information.\n\
    - DHCP works with Windows and Linux.\n- DHCP “leases” expire after a set time.\n\
    \  - If you change a machine's configuration during that time, it will use the\
    \ new configuration without a reboot.\n- The biggest advantage of DHCP is configurability.\
    \ One central location stores networking information for an entire subnet.\n \
    \ - As new machines are added to a network, they can be quickly put on the the\
