  md: '# Lesson 12.1


    # Kernel versions


    +   - There are a few things to consider when deciding what kernel revision you
    should be using in a production environment.

    - Stable releases have an even number as their minor number. These are considered
    by Linux to be stable enough for production use.

    - Development releases have experimental drivers or changes to them and can cause
    crashes if used in production environments. However, these releases will be more
    likely to support newer hardware.

    - Most Linux distributions start with a base of a stable kernel, then add in some
    newer drivers. The resulting kernel is then tested to make sure it is stable,
    then released.

    - As a generalization, stable kernels are good for production use, while development
    kernels may have better performance.


