  md: '# LECTURE 1 INSTALLATION


    +   - The bottom of the screen has an option “check for bad blocks,” which is
    recommended for new hard drives, or for drives of questionable quality.


    +   - This adds a lot of time to partitioning, but can prevent data loss.


    +   - LILO is the boot manager for Red Hat Linux and gives you a graphical screen
    to select an OS to start at boot time.


    +   - “linear mode” is selected, leave it, and leave any parameters alone.


    +   - If you have an IDE CD-R or CD-RW drive and use “hbc-ide-scsi” or a similar
    string in the kernel parameters, Red Hat has identified your CD-R/W.


    +   - The checked box indicates the default OS, which is the Linux installation.
    You can change this by selecting another OS, then clicking on “Default Boot Image”.


    +   - If you have an Ethernet card and it is detected, you can configure it at
    the next server. By default, the device starts at boot time, and uses DHCP to
    configure your Ethernet address and settings.


    +   - If you do not have a DHCP server, deselect the DHCP and enter the information
    as provided to you by your network administrator.


    +   The next screen gives access to the Red Hat’s firewall configuration.


    +   - You can now configure the languages available for the system. The default
    will be the one you used for installation.


    +   - The time zone and location information is next.


    +   - UNIX (and Linux) like to use Universal Coordinated Time as the time reference.


    +   - Other operating systems expect the time on the system to be of that local
    and not UTC. If you will be using the system for Linux only, you can select “System
    clock uses UTC” then set the time appropriately later.


    +   - Select the continent you are followed by selecting on the map your general
    location to set the time zone information.


    +   - System security is important, so Red Hat has you a root password, with allowing
    you to configure user accounts now.


    +   - We will cover MD5 and shadow passwords later; unless otherwise, you should
    leave the options on this screen as is.'
