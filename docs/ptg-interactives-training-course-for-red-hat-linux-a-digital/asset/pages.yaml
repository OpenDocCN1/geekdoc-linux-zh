    \ > hudson.telnet: . ack 29\nwin 7814 (DF)\n23:12:59.710000 hudson.telnet > 192.168.1.15.listen:\
    \ P\n29:199(170) ack 0 win 32736 (DF)\n```\n\n4 packets received by filter\n0\
    \ packets dropped by kernel\n#\n\n+   This example looks a bit messy, since the\
    \ machine in question is logged on via the second Ethernet port. What we're seeing\
    \ is the data from tcpdump being sent over the Ethernet line through the telnet\
    \ window. \n\n+   Let's examine the second and third packets:\n\n```\n23:12:59.510000\
    \ hudson.telnet > 192.168.1.15.listen: P\n1:29(28) ack 0\nwin 32736 (DF)\n23:12:59.710000\
    \ 192.168.1.15.listen > hudson.telnet: . ack 29\nwin 7814\n(DF)\n```\n\n+   -\
    \ The first line is a packet leaving the telnet TCP port on server (the machine\
    \ connected via telnet) and going to 192.168.1.15 on the listen TCP port.\n- The\
    \ timestamp indicates that the time is almost 11:13 AM (11:12:59.510000, to be\
    \ precise).\n- After the data represents, special TCP/IP flags are mentioned.\
    \ In this case, the P represents \"Push\". This could also be S (Syn), F (Fin),\
    \ R (Rst) or a period (.), meaning no flags.\n- Next comes the data sequence number\
    \ (1:29(28)). This allows the IP layer to reassemble packets as they come in.\n\
    - Next is the ack 0, meaning that it's expecting acknowledgment.\n- The win refers\
    \ to the size of the remaining receive buffer.\n- The second line is the acknowledgment\
    \ packet from the target machine.\n- Since tcpdump attempts to use names instead\
    \ of IP addresses, you may see a lot of traffic from your own machine trying to\
    \ find out who everyone else is. If you want to turn this off, use the -n option."
