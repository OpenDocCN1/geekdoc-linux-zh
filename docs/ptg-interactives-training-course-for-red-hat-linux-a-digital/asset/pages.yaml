  md: '# Configuring an NIS Master Server


    +   - The NIS Master Server sits on a network and responds to NIS queries on the
    network.

    - There can be only one master server per physical network.

    - You can set up slave servers that synchronize with the master server, and reduce
    the load from clients.

    - Slave servers can be located on separate subnets.

    - Make sure that you have the yserv package installed.


    +   - Edit /var/yp/Makefile to add or remove the maps you will be serving. The
    line starting with all: contains the list of maps.

    - Edit /var/yp/securenets and /etc/ypserv.conf. The first defines the IPs from
    which the server will answer requests. The following shows how the /var/yp/securenets
    file could look.


    Sample /var/yp/securenets


    ```

    #

    # Sample /var/yp/securenets

    #

    #

    # Allow localhost access. This is necessary!

    # host 127.0.0.1


    # Allow access from machines on the local network

    255.255.255.0 10.10.10.0


    # Access from two class C networks 209.1.2.0 and 209.1.3.0

    255.255.254.0 209.1.2.0

    ```


    The host line allows ypserv to respond to specific hosts. Since the localhost
    must be able to access the server, that host is listed. Examples of allowing subnets
    are on the other two example lines.


    +   - The /etc/ypserv.conf file lets you customize the server''s behavior at the
    host or network level on a per-map basis.

    - There are two types of entries: options and access rules.'
