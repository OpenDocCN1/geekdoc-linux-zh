    Many government agencies or high-end security organizations use passive attacks
    for non-malicious purposes. However, it has been found that actively attacking
    by gathering information using a passive attack is more targeted, making it difficult
    for the user to see that their information and data are being used to create a
    targeted attack.


    # DIFFERENT TYPES OF MORE ADVANCED HACKS


    Whenever a criminal tries to hack into a network, he tries to use the most common
    hacking techniques that have proven effective on many occasions.


    He just tries not to reinvent the wheel and to optimize the existing techniques
    and perform more sophisticated and complex attacks. The cybersecurity attacks
    that make headlines today are usually one of the following:


    ## Phishing


    Phishing accounted for 90% of the data breaches and the number of phishing attacks
    increased by 65% in 2018 alone. The worst thing about phishing attacks is that
    they develop quickly. Every new month, 1.5 million new phishing sites are identified.


    As a legitimate source, hackers use social engineering and various types of hacking
    techniques to trick victims into action that can range from clicking the link
    to downloading an attachment with a malicious link. Email is the most known channel
    for phishing attacks. Some types of highly targeted phishing attacks that are
    most commonly used are:


    ### harpoon Fishing


    A well-planned attack in which information about the target group is collected
    and investigated in order to achieve a higher success rate. Disguised as a legitimate
    source, spear phishing email is not a random message that can be questioned. These
    are designed so that the victims trust them and cause a jerky reaction of the
    knee. Mostly these attacks occur during the holiday season, when email traffic
    is very high and the victims are lured into emergencies.


    After the victim clicked on a malicious link, she used the login and password
    to log in. Then the hacker searched. Harpooning can be very dangerous.


    ### Whaling


    The whaling attacks are directed against the mailboxes of the leaders of a particular
    organization. CEOs and CFOs are most targeted. Since this management position
    still has access to confidential information, attacking this information is more
    beneficial for hackers. These include very targeted attacks. Individuals and organizations
    are all at risk.


    ### Viruses, trojans, worms


    Software that enters the victim''s system or network and continuously monitors
    or modifies the data and information transmitted. Viruses or Trojans are malicious
    and can track user data or encrypt the user''s files by requesting the ransom
    to pass the decryption key.


    Viruses, worms, Trojans and bots infect the computer system in other ways, but
    the effects depend on the kind of sophistication with which it is created.


    ### Cookie Theft


    The theft of cookies is about imitating the cookie of a victim on the same network.
    By using these cookies, a hacker can gain access to websites that have already
    been visited by the victims, and malicious attacks can be carried out.


    A cookie theft occurs when a hacker accesses unencrypted session data with which
    he acts as a real user. A user is exposed to cookies when browsing on trusted
    websites in public networks.


    ## Computer Fraud and Security


    Hacking always leads to computer fraud where hackers try to access the user''s
    personal information. The information can include email address, phone numbers,
    user IDs, passwords and even ID theft.


    By accessing information on a personal level, hackers attempt to gain unauthorized
    access to bank accounts, social media accounts, and more to increase the damage.
    If it is not the direct route ID / direct password, the hacker tries to encrypt
    files, push malware and ransomware to extort the victim''s money.


    The development of the Internet was a game of good, evil and ugly, and "hacking"
    is the ugliest part. If you also want to become a cybersecurity expert, take the
    cybersecurity course and step up to a higher level of your career.


    ## Firewalls and Protection


    Most home and business offices now have a firewall that separates your internal
    computer network from the wild west of the Internet. The good news is that the
    firewalls have been configured more sophisticated and correct. This is a great
    job for backing up devices on your internal computer network. Modern firewalls
    now include detecting and preventing intruders, filtering emails, and blocking
    websites.


    Most can tell who did what and when. Not only do they block criminals outside
    your network, they also prevent internal users from accessing inappropriate resources
    on the Internet. Employees may be prevented from visiting Web sites that waste
    your business or violate certain security requirements. The main working time
    is really not the time to update your Facebook page! Organizations do not want
    their healthcare and financial services staff to talk to a stranger via an instant
    messaging service.


    The firewall is the electronic equivalent of the "gateway" to your computer network.
    There are a variety of potential perpetrators who paint their doors and windows,
    tirelessly searching for a way to get in. A properly configured, managed, and
    regularly updated firewall can effectively protect your computer network in the
    office and at home. Behind the firewall, desktops and desktop servers must have
    software-based firewalls based on local software that also provides antivirus
    protection. If anything goes beyond the firewall, then it''s hoped that internal
    antivirus and desktop firewall solutions will provide an additional layer of security.


    Firewalls are reasonable and adequate, but here are the bad news. Most of what
    you hear and read now is not caused by criminals crossing your firewall! The real
    damage is caused by those who are in your network! Malicious users and dishonest
    employees are always a boon. Unscrupulous employees give out credit card information
    or provide security information for money. The real danger, however, is that users
    will ignore the sophisticated security holes of today. The most honest employee
    may unknowingly become the source of a serious breach of security that results
    in the loss of your own personal information or your customers'' personal and
    financial information.


    ## Internal Threats and Mobile Attacks


    Take the example of an average laptop user. How many times have you been to Starbucks
    and set yourself up? Have a nice day, open air, sun and broadband internet connection,
    cordless phone and the business runs as usual! If I tell you how stressless it
    is to organize an attack on Starbucks through a "middleman," you''ll give up coffee
    for the rest of your life. You think you''re on Starbucks Wi-Fi, but in reality,
    this kid on the back of the Starbucks, with the wireless access point connected
    to his USB port, gives the impression that he''s your gateway to the Internet.
    It monitors every key on your laptop since you logged in. In fact, he now has
    your username, password, and almost everything else on your computer. If you return
    to the office and sign up now, you have just unlocked a bot on the corporate network,
    which will be available again this evening.


    If laptops are not enough, everyone now runs with a smartphone! Did you know that
    your smartphone holds a list of all the Wi-Fi networks you''ve recently used?
    Do you remember when you waited at Starbucks for the cup of coffee and checked
    your emails? Now your phone sends a tag request anywhere that looks like "Starbucks
    WiFi, are you there?" in the hope that it will get an answer and automatically
    connect you to the internet. Do you remember the child we talked about? He decided
    to make your tag request with a "Yes, I''m here, hop!" To answer. Just another
    `MITM` attack and what it can do on your smartphone, especially the androids that
    make your laptop look like Fort Knocks!

    '
