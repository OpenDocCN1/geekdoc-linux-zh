- fmt: "\nWhat to tell your family: Set private pages, update security settings regularly,\
    \ delete unknown people, and avoid sharing your location information. When traveling,\
    \ remember to wait for your return home before publishing the photos.\n\n## 5.\
    \ Start cyber security against travelers\n\nStaying away from social networks\
    \ as you leave the city can help protect your home while you're on the move. What\
    \ can you do to protect your information when the plane lands? Just as there are\
    \ hackers at home, there are also hackers abroad - and travelers are simple and\
    \ unsuspecting targets.\n\nSuppose you stay in a hotel and want to get some emails\
    \ for work. You open your laptop and see several Wi-Fi options: `Hotel-1`, `Hotel-guest`\
    \ and `Hotel_publicwifi`. Pick the wrong one, and you might be in a fraudulent\
    \ Wi-Fi hotspot exposing your information to an unpleasant character who is responsible\
    \ for the trap.\n\nCriminals set up dummy access points and wait for you to log\
    \ in so they can see everything you do on the Internet, for example, by logging\
    \ into your online banking account. The more visitors there are, the greater the\
    \ risk:\n\nDisney, Paris, New York, the Walk of Fame, and the Las Vegas Strip\
    \ are teeming with deceptive Wi-Fi hotspots.\n\nProtect your family against cyber\
    \ attacks by sticking to personal hotspots or introducing a clean device (a device\
    \ that does not contain any of your information) instead of a computer with years\
    \ of financial data.\n\nAlso, take precautions when using cards. Flying over counters\
    \ may seem like an old story, but it's on the rise again. Criminals can use keyboard\
    \ overlays or place card collectors on the actual DAB card reader. However, they\
    \ usually place cameras over the keyboard so they can see your PIN. Bank-linked\
    \ ATMs are usually safe as the bank can register regularly. If possible, stick\
    \ to them and cover your hand when entering a PIN. It does not hurt to shake the\
    \ card reader as well. If it's loose, you might be dealing with a card skimmer.\n\
    \nOlder children and adults who do not know the technology are likely to make\
    \ these slight mistakes while traveling. Make sure that the whole family understands\
    \ the risks.\n\nWhat to say to your family: Be careful when traveling by using\
    \ a device or a credit / debit card. Store them at bank-connected ATMs and shake\
    \ hands when entering a PIN code. Do not connect to the public Wi-Fi network and\
    \ instead use Wi-Fi hotspots or personal information (or, even better, store devices\
    \ and enjoy your vacation).\n\n## And now?\n\nMost compromises come in minutes,\
    \ but only 3% are discovered so quickly. The detection of attacks on two-thirds\
    \ takes months and is almost always discovered by third parties. It may seem like\
    \ a big effort, but it is much easier to prevent an attack than to recognize it\
    \ and reverse the damage as soon as it happens. That's why it's so important for\
    \ you to share online security with your entire family.\n\nHere are some of other\
    \ mistakes you may be making that leave you vulnerable to cyber attacks:\n\n###\
    \ 1. Open emails from unknown persons\n\nE-mail is the preferred form of business\
    \ communication. According to the Radicati Group, the average person receives\
    \ 235 e-mails every day. With so many e-mails, it goes without saying that some\
    \ are frauds. Opening an unknown email or attachment in an email can trigger a\
    \ virus that opens a backdoor for cybercriminals in your company's digital home.\n\
    \n**Solutions:**\n- Advise employees not to open e-mails from people they do not\
    \ know.\n- Advise employees never to open attachments or unknown links.\n\n###\
    \ 2. Have weak credentials and passwords\n\nMashable reported that 81% of adults\
    \ use the same password for everything. Repeated passwords that use personal information\
    \ such as a nickname or a street are a problem. Cybercriminals have programs that\
    \ extract public profiles for combinations of potential passwords and logon opportunities\
    \ until one of them appears. They also use dictionary attacks that automatically\
    \ try different words until they match.\n\n**Solutions:**\n- Employees must use\
    \ unique passwords.\n- Add numbers and symbols to a password for added security.\
    \ For example, replace \"London\" with \"L0nD0N\".\n- Create rules that require\
    \ employees to create unique complex passwords of at least 12 characters. and\
    \ change them if there is reason to believe that they have been compromised.\n\
    - Reduce the problem by using password management software to automatically generate\
    \ secure individual passwords for multiple applications, Web sites, and devices.\n\
    \n### 3. Leave passwords on sticky notes\n\nHave you ever gone to the office and\
    \ found a reminder with passwords on a screen? It happens more often than you\
    \ think. Although you want a degree of confidence in your organization, it is\
    \ too risky to leave passwords visible.\n\n**Solutions:**\n- If employees need\
    \ to enter their passwords, request that the printouts be kept in locked drawers.\n\
    \n### 4. Have access to everything\n\nIn some cases, companies do not subdivide\
    \ the data. In other words, everyone, from the trainee to the board member, can\
    \ access the same company files. By giving everyone the same access to data, you\
    \ increase the number of people who can flee, lose information or manipulate information.\n\
    \n**Solutions:**\n- Set hierarchical access levels and grant permission only to\
    \ those who need them at each level.\n- Limit the amount of people who can change\
    \ system configurations.\n- Do not give your employees administrator rights on\
    \ their devices unless they need such a configuration. Also, employees with administrative\
    \ rights should use them only when needed, not routinely.\n- Apply a double signature\
    \ before payments over a certain amount can be processed to combat tax fraud.\n\
    \n### 5. Lack of effective employee training\n\nResearch shows that the majority\
    \ of businesses offer cybersecurity training. However, only 25% of executives\
    \ believe that training is effective.\n\n**Solutions:**\n- Annual cybersecurity\
    \ awareness. Topics could be:\n    - Reasons and importance of cybersecurity training\n\
    \    - Phishing and online scams\n    - Lock the computer\n    - Password Management\n\
    \    - How to manage mobile devices\n    - Relevant examples of situations\n\n\
    ### 6. Do not update the antivirus software\n\nYour company needs to provide antivirus\
    \ software as a safeguard, but it is not up to the staff to update it. In some\
    \ organizations, people are encouraged to perform updates, and they can decide\
    \ whether to perform updates or not. Employees are likely to reject updates when\
    \ they're in the middle of a project because many updates force them to shut down\
    \ programs or restart computers.\n\nAntivirus updates are important, have to be\
    \ processed quickly and should not be left to the employees.\n\n**Solutions:**\n\
    - Automatically configure all system updates after hours.\n- No employee, regardless\
    \ of title, should subscribe to this company policy.\n\n### 7. Use of unsecured\
    \ mobile devices\n\nDo your employees have a cell phone, tablet or laptop? If\
    \ so, did you set up a protocol to back up these devices? Many companies are careless\
    \ about mobile devices, but they are an easy target for cybercriminals.\n\n**Solutions:**\n\
    - Each device must be password protected.\n- If a device is misplaced or stolen,\
    \ contact a contact point to report it and specify the steps to remotely disable\
    \ it.\n- Use endpoint security solutions to remotely manage mobile devices.\n\
    - Do not conduct confidential transactions over an unreliable public Wi-Fi network.\n\
    \nEmployees are human and digital accidents can happen. However, taking steps\
    \ to protect equipment and train employees can help prevent cyber threats.\n\n\
    Of course, cybersecurity in your business goes beyond employee training. Protecting\
    \ the digital footprint of a business and managing threats requires the help of\
    \ a reputable cybersecurity company.\n\n# BENEFITS OF ETHICAL HACKING\n"
  raw: 'What to tell your family: Set private pages, update security settings regularly,
    delete unknown people, and avoid sharing your location information. When traveling,
    remember to wait for your return home before publishing the photos.


    5\. Start cyber security against travelers


    Staying away from social networks as you leave the city can help protect your
    home while you''re on the move. What can you do to protect your information when
    the plane lands? Just as there are hackers at home, there are also hackers abroad
    - and travelers are simple and unsuspecting targets.


    Suppose you stay in a hotel and want to get some emails for work. You open your
    laptop and see several Wi-Fi options: Hotel-1, Hotel-guest and Hotel_publicwifi.
    Pick the wrong one, and you might be in a fraudulent Wi-Fi hotspot exposing your
    information to an unpleasant character who is responsible for the trap.


    Criminals set up dummy access points and wait for you to log in so they can see
    everything you do on the Internet, for example, by logging into your online banking
    account. The more visitors there are, the greater the risk:


    Disney, Paris, New York, the Walk of Fame, and the Las Vegas Strip are teeming
    with deceptive Wi-Fi hotspots.


    Protect your family against cyber attacks by sticking to personal hotspots or
    introducing a clean device (a device that does not contain any of your information)
    instead of a computer with years of financial data.


    Also, take precautions when using cards. Flying over counters may seem like an
    old story, but it''s on the rise again. Criminals can use keyboard overlays or
    place card collectors on the actual DAB card reader. However, they usually place
    cameras over the keyboard so they can see your PIN. Bank-linked ATMs are usually
    safe as the bank can register regularly. If possible, stick to them and cover
    your hand when entering a PIN. It does not hurt to shake the card reader as well.
    If it''s loose, you might be dealing with a card skimmer.


    Older children and adults who do not know the technology are likely to make these
    slight mistakes while traveling. Make sure that the whole family understands the
    risks.


    What to say to your family: Be careful when traveling by using a device or a credit
    / debit card. Store them at bank-connected ATMs and shake hands when entering
    a PIN code. Do not connect to the public Wi-Fi network and instead use Wi-Fi hotspots
    or personal information (or, even better, store devices and enjoy your vacation).


    And now?


    Most compromises come in minutes, but only 3% are discovered so quickly. The detection
    of attacks on two-thirds takes months and is almost always discovered by third
    parties. It may seem like a big effort, but it is much easier to prevent an attack
    than to recognize it and reverse the damage as soon as it happens. That''s why
    it''s so important for you to share online security with your entire family.


    Here are some of other mistakes you may be making that leave you vulnerable to
    cyber attacks:


    1\. Open emails from unknown persons


    E-mail is the preferred form of business communication. According to the Radicati
    Group, the average person receives 235 e-mails every day. With so many e-mails,
    it goes without saying that some are frauds. Opening an unknown email or attachment
    in an email can trigger a virus that opens a backdoor for cybercriminals in your
    company''s digital home.


    Solutions:


    Advise employees not to open e-mails from people they do not know.


    Advise employees never to open attachments or unknown links.


    2\. Have weak credentials and passwords


    Mashable reported that 81% of adults use the same password for everything. Repeated
    passwords that use personal information such as a nickname or a street are a problem.
    Cybercriminals have programs that extract public profiles for combinations of
    potential passwords and logon opportunities until one of them appears. They also
    use dictionary attacks that automatically try different words until they match.


    Solutions:


    Employees must use unique passwords


    Add numbers and symbols to a password for added security. For example, replace
    "London" with "L0nD0N".


    Create rules that require employees to create unique complex passwords of at least
    12 characters. and change them if there is reason to believe that they have been
    compromised.


    Reduce the problem by using password management software to automatically generate
    secure individual passwords for multiple applications, Web sites, and devices.


    3\. Leave passwords on sticky notes


    Have you ever gone to the office and found a reminder with passwords on a screen?
    It happens more often than you think. Although you want a degree of confidence
    in your organization, it is too risky to leave passwords visible.


    Solutions:


    If employees need to enter their passwords, request that the printouts be kept
    in locked drawers.


    4\. Have access to everything


    In some cases, companies do not subdivide the data. In other words, everyone,
    from the trainee to the board member, can access the same company files. By giving
    everyone the same access to data, you increase the number of people who can flee,
    lose information or manipulate information.


    Solutions:


    Set hierarchical access levels and grant permission only to those who need them
    at each level.


    Limit the amount of people who can change system configurations.


    Do not give your employees administrator rights on their devices unless they need
    such a configuration. Also, employees with administrative rights should use them
    only when needed, not routinely.


    Apply a double signature before payments over a certain amount can be processed
    to combat tax fraud.


    5\. Lack of effective employee training


    Research shows that the majority of businesses offer cybersecurity training. However,
    only 25% of executives believe that training is effective.


    Solutions:


    · Annual cybersecurity awareness. Topics could be:


    Reasons and importance of cybersecurity training


    Phishing and online scams


    Lock the computer


    Password Management


    How to manage mobile devices


    Relevant examples of situations


    6\. Do not update the antivirus software


    Your company needs to provide antivirus software as a safeguard, but it is not
    up to the staff to update it. In some organizations, people are encouraged to
    perform updates, and they can decide whether to perform updates or not. Employees
    are likely to reject updates when they''re in the middle of a project because
    many updates force them to shut down programs or restart computers.


    Antivirus updates are important, have to be processed quickly and should not be
    left to the employees.


    Solutions:


    Automatically configure all system updates after hours.


    No employee, regardless of title, should subscribe to this company policy.


    7\. Use of unsecured mobile devices


    Do your employees have a cell phone, tablet or laptop? If so, did you set up a
    protocol to back up these devices? Many companies are careless about mobile devices,
    but they are an easy target for cybercriminals. 


    Solutions:


    Each device must be password protected.


    If a device is misplaced or stolen, contact a contact point to report it and specify
    the steps to remotely disable it.


    Use endpoint security solutions to remotely manage mobile devices.


    Do not conduct confidential transactions over an unreliable public Wi-Fi network.


    Employees are human and digital accidents can happen. However, taking steps to
    protect equipment and train employees can help prevent cyber threats.


    Of course, cybersecurity in your business goes beyond employee training. Protecting
    the digital footprint of a business and managing threats requires the help of
    a reputable cybersecurity company.


