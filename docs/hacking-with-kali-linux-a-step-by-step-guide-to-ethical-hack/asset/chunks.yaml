    # INTRODUCTION


    Does the word hacking scare you? Generally, hacking has earned a negative reputation
    and has become associated with cyberattacks and breaches in cybersecurity. But
    this is not always true. If this is your first book on hacking, you will become
    more acquainted with the world of hacking as this book gives a simple overview
    of ethical hacking.


    The term "ethical hacker" emerged in the late 1970s when the US government hired
    expert groups called "red teams" to hack their own computer system. Hackers are
    cyber-experts who lawfully or illegally hack. You enter the security system of
    a computer network to retrieve or recollect information.


    Technology and the Internet have facilitated the creation and growth of network
    issues such as viruses, virus protection, hacking, and ethical hacking. Piracy
    is the modification of a hardware and software computer system. An illegal break
    in a computer system is a criminal offence. Recently, a wave of hacking has opened
    several courses on ethical hacking.


    A White Hat Hacker is a moral hacker who performs intrusion tests and penetration
    tests. Ethical hacking involves lawfully hacking a computer system and entering
    its database. Its purpose is to hedge the shortcomings and drawbacks of a company''s
    cybersecurity system. Legal hacking experts are typically certified ethical hackers
    who are hired to prevent potential threats to the computer security system or
    network. Ethical hacking courses are very popular and are considered by many as
    a serious profession. Ethical hacking courses have triggered huge reactions worldwide.


    Moral hacking experts run multiple programs to secure corporate networks.


    A moral hacker has legal permission to violate a company''s software system or
    database. The company that approves an investigation of its security system must
    give its written consent to the School of Moral Piracy.


    Moral hackers only deal with security issues in the enterprise and try to protect
    system vulnerabilities.


    The hacker school performs a vulnerability analysis to address the vulnerabilities
    of the internal computer (PC) network. Also, they run software security programs
    as a necessary preventive action against illegal hacking.


    Legal hacking experts identify security holes in a system that makes it easier
    for cybercriminals to get into it. They mainly perform these tests to ensure that
    the hardware and software programs are effective enough to prevent unauthorized
    access.


    Moral experts carry out this test by simulating a cyberattack on the network to
    understand how powerful it is at interfering with the network.


    The vulnerability test must be carried out regularly or annually. The company
    must record the results in full and review the references below.'
