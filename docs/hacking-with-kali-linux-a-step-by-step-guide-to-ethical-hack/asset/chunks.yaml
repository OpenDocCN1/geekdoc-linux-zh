  trans: '

    此安全工具用于扫描 Web 服务器并在指定的远程主机上执行各种类型的测试。其简洁简单的命令行界面使得您能够轻松地在目标机器上启动漏洞测试，如下方的截图所示：


    Nikto 的主要功能包括：

    - 检测每个操作系统上的标准安装文件

    - 识别过时的软件应用程序

    - 运行 XSS 漏洞测试

    - 根据告警启动暴力破解攻击

    - 将结果导出为文本、CSV 或 HTML 文件

    - 使用 `LibWhisker` 绕过入侵检测系统 (IDS)

    - 与 `Metasploit Framework` 集成


    ## 8. SQLMap


    `SQLmap` 是一种用 Python 开发的网络安全工具，允许安全研究人员在远程主机上运行 SQL 注入测试。通过 `SQLMap`，你可以发现并测试不同类型的
    SQL 漏洞，以增强应用程序和服务器的安全性，或向不同的公司报告漏洞。


    SQL 注入技术包括：

    - 基于查询的 UNION

    - 基于时间的盲注

    - 基于布尔的盲注

    - 基于错误的注入

    - 堆叠查询

    - 带外查询


    主要功能：

    - 支持多种数据库服务器：Oracle、PostgreSQL、MySQL 和 MSSQL、MS Access、DB2 或 Informix

    - 自动代码输入

    - 密码识别

    - 基于字典的密码破解

    - 用户枚举

    - 获取密码哈希

    - 查看用户权限和数据库

    - 提升数据库用户权限

    - 关于转储表的信息

    - 运行远程 SQL SELECT


    ## 9. SQLNinja


    `SQLNinja` 是另一个随 Kali Linux 发行版提供的 SQL 漏洞扫描器。该工具旨在针对使用 `MS SQL Server` 作为主数据库服务器的
    Web 应用程序。`SQLNinja` 用 Perl 编写，可在多个安装了 Perl 解释器的 Unix 发行版中运行。它支持以下操作系统：

    - Linux

    - Mac OS X 和 iOS

    - FreeBSD


    `SQLninja` 可以以不同的模式执行，例如：

    - 测试模式

    - 详细模式

    - 远程指纹数据库模式

    - 使用词列表进行暴力破解

    - 直接 壳和反向 壳

    - 出站端口扫描器

    - 反转 ICMP Shell

    - DNS 隧道 Shell


    ## 10. Wapiti


    `Wapiti` 是一个免费的 Python 开源命令行漏洞扫描器。虽然它不是该领域最流行的工具，但它可以检测许多 Web 应用程序中的安全漏洞。


    使用 `wapiti`，你可以发现安全漏洞，包括：

    - XSS 攻击

    - SQL 注入

    - XPath 注入

    - XXE 注入

    - CRLF 注入

    - 伪造服务端请求


    其他功能还包括：

    - 以冗余模式工作

    - 可以停止并继续分析

    - 在终端中高亮显示漏洞

    - 生成报告并将其导出为 HTML、XML、JSON 和 TXT

    - 启用和禁用多个攻击模块

    - 清除某些 URL 的参数

    - 在攻击期间排除 URL

    - 忽略 SSL 证书验证

    - JavaScript URL 提取器

    - 为大型扫描设置时间限制

    - 设置自定义的 HTTP 和 user-agent 头部


    ## 11. Maltego


    `Maltego` 是在目标进行初始分析期间收集信息和识别数据的理想工具。


    在这种情况下，人、姓名、电话号码、电子邮件、公司、组织和社交网络个人资料之间的关系可以被关联并确定。


    除了 `whois` 数据、`DNS` 记录、社交网络、搜索引擎、地理位置服务和在线 API 服务等在线资源外，它还可以用于调查互联网基础设施之间的关联，包括：

    - 域名

    - DNS 服务器

    - 网络区块

    - IP 地址

    - 文件夹

    - Web 页面


    主要功能包括：

    - 图形化界面

    - 每个图表分析最多 10,000 个对象

    - 广泛的关联可能性

    - 实时数据交换

    - 关联数据的图形生成器

    - 将图形导出为 `GraphML`

    - 生成实体列表

    - 可以复制（复制和粘贴）信息


    该应用程序适用于 Windows、Linux 和 Mac OS。唯一的软件要求是安装 `Java 1.8` 或更高版本。


    ## 12. Air Crack-ng


    `Air Crack-ng` 是一个受推誉的家庭安全和企业安全套件。它对 `802.11 WEP` 和 `WPA-PSK` 网络提供完全支持，并捕获网络包。然后对其进行分析并利用它们中断
    wifi 访问。


    `AirCrack-ng` 为传统的安全专业人员提供了优雅的终端界面和其他一些有趣的特性。


    主要功能：

    - 完整的文档（wiki，manpages）

    - 活跃的社区（论坛和 IRC 通道）

    - 支持 Linux、Mac 和 Windows 的 WLAN 探测

    - 启动 PTW、WEP 和碎片攻击

    - 支持 WPA 迁移模式

    - 快速破解速度

    - 支持多个无线卡

    - 与第三方工具集成


    作为奖励，它包含了许多 Wifi 审计工具，包括：

    - `Air Force Base`

    - `Aircrack`

    - `airdecap-ng`

    - `airdecloak-ng`

    - `airdriver-ng`

    - `aireplay-ng`

    - `Air-ng`

    - `airodump-ng`

    - `airolib-ng`

    - `AirServ-ng`

    - `airtun-ng`

    - `easside-ng`

    - `paquetforge-ng`

    - `tkiptun-ng`

    - `Wesside-ng`

    - `airdecloak-ng`


    ## 13. Reaver


    `Reaver` 是 `Aircrack-ng` 的极佳开源替代方案，允许您检查带有 `WPA / WPA2` 密码的任何 Wi-Fi 网络的安全性。它使用暴力
    Wi-Fi 攻击技术（如 `Pixie''s dust attacks`），由于常见的安全漏洞和 Wi-Fi 漏洞破坏 WiFi 保护的设施。


    根据路由器上无线安全的配置，有效的暴力破解可能需要 3 到 10 小时才能得出结果。


    直到最近，`Reaver` 的原始版本托管在 `Google Cloud` 上。在版本 `1.6` 发布后，Github 上发布了分支的社区版。一些主要功能包括：

    - 构建依赖项：必要的构建

    - `libpcap-dev`

    - 运行时依赖项

    - `Pixiewps`（Pixiedust 攻击所需）


    它在大多数 Linux 发行版上运行良好。


    ## 14. Ettercap


    `Ettercap` 是一个用于局域网（LAN）的网络接收器和数据包嗅探器。它支持主动和被动扫描，以及各种协议，包括 SSH 和 HTTPS 等加密协议。其他功能包括网络和主机分析（例如操作系统指纹）以及对已建立连接的网络操作。这使其成为测试安全攻击的合适工具。拦截器类型。


    主要属性：

    - 主动和被动协议分析

    - 过滤器取决于 IP 源和目的、MAC 和 ARP 地址

    - 向现有连接注入数据

    - 基于 SSH 和 HTTPS 加密的协议

    - 嗅探 GRE 隧道中的远距离流量

    - 可通过插件扩展

    - 支持的协议包括 Telnet、FTP、Imap、SGB、MySQL、LDAP、NFS、SNMP、HTTP 等

    - 确定操作系统的名称和版本

    - 可以终止建立的局域网连接

    - DNS 劫持


    ## 15. Canvas


    `Canvas` 是 `Metasploit` 的绝佳替代方案，提供了超过 800 个漏洞用于测试远程网络。


    它的主要功能包括：

    - 远程网络

    - 针对不同类型的系统

    - 针对特定的地理区域

    - 远程系统的截图

    - 下载密码

    - 修改系统中的文件

    - 提升权限以获取管理员访问


    通过此工具你还可以使用其平台编写新的漏洞，或使用其著名的 shellcode 生成器。它包含一个名为 `scanrand` 的 `nmap` 替代品，这对于在中大型网络中扫描端口和检测主机特别有用。


    支持的平台有：

    - Linux

    - MacOSX（需要 `PyGTK`）

    - Windows（需要 `Python` 和 `PyGTK`）


    软件供应商正在利用自动化伦理黑客工具和入侵测试工具来日常提高系统安全性。

