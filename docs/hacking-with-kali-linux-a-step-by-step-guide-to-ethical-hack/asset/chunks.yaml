    The term "hacker" was coined in MIT''s KI laboratories in the 1960s, and by the
    1970s, the types of hacking attacks were already out of control.


    Overall, these hacking techniques have become more sophisticated and targeted
    over the years. Computer hacking continued to be a major contributor to data breaches
    in 2018, accounting for 57.1 percent.


    The threats continue to increase!


    To understand what hacking is all about and how the various types of hacking have
    developed, let''s look at it from the beginning to the day it became dangerous.


    ## Different Types of Hacking Over the Years


    ### Beginning of hacking (1960-1970)


    All, because the term was invented in the 1960s, we regard it as the decade of
    the beginning of hacking. However, the fact is that the chronology of the computer
    security history of hackers points to some notable events as early as 1903, when
    the inventor Nevil Maskelyne disrupted the public use of Marconi''s wireless telegraphy
    technology.


    He sent insulting messages in Morse code and ignored the projector in the auditorium.
    Hacking took on a concrete form in the 1960s as programmers tried to hack systems
    for better results.


    Those who did, turned against him and led to one of the worst types of hacking
    attacks of that time, when AT & T''s wide-range change was broken off by whistle.
    high tone for free calls. The effects were so serious that the FBI had to intervene
    to crack the hacker network.


    In 1979, Kevin Mitnick broke into his Ark computer system of Digital Equipment
    Corporation.


    ### Middle Ages of Piracy (1980s)


    With the introduction of PCs by IBM, every site was the subject of a hacker attack.
    From one million computer units in 1980 to 30 million in 1986, the PCs and networks
    they use have opened up new hacker opportunities. The gravity tip is acquired.


    The Great Hacker War was announced by the Legion of Doom (`LOD`) and the Masters
    of Deception (`MOD`) hacker groups. Both groups worked as rivals by infiltrating
    private computers and computer networks, encrypting phone lines and monitoring
    calls illegally.


    After the intervention of the Federal Criminal Police Office, arrests took place,
    the groups disbanded and the citizens learned about hacking.


    ### Piracy Intersects with Internet Walls (1990s)


    This is the time when hackers have been refined and adapted to the Web. The simple
    types of hacking programs have moved from BBS to hacking sites.


    It began as a joke by computer programming addicts and has become a $ 2 trillion
    industry. Every computer and every computer network is a threat to attacks such
    as Denial of Service (`DoS`), Distributed Denial of Service (`DDoS`), `MitM` (Intermediate),
    Phishing and Spear phishing attacks. Password, SQL Injection Attacks, Cross-Site
    Scripting (`XSS`), etc.


    Hacking attacks that have damaged the US Department of Justice, the CIA, the US
    Air Force, nuclear program systems, credit card websites, and all sorts of digital
    interaction sites have raised the question of what piracy is and what potential
    damage can be caused.


    ## Possible damage due to hacking


    This section discusses some of the types of hacking techniques you might encounter
    in 2019 as well as examples of these techniques. It explores the damages that
    may occur as a result of hacking.


    Every personal information has become digital and our digital footprints have
    increased excessively. Unethical hackers attempt various types of hacking techniques
    to access data or computer systems that cause the damage.


    ### Denial of Service (`DoS` `DDoS`)


    GitHub, the open source coding development platform, was destroyed in 2018 with
    massive traffic of 1.35 terabits per second. This was the highest record she had
    ever received, and the platform was not ready to handle it.


    A denial-of-service (`DoS`) is therefore designed to saturate the traffic of a
    website or network server far beyond what can cause a crash. Real users are faced
    with a denial of service. These are the most common types of hacking techniques.


    As network owners continue to worry about troubleshooting traffic issues, sometimes
    a small malware program is introduced that takes several days to detect before
    the potential damage is done. Botnets are designed to automate the attack sending
    multiple requests, packets, or messages, which is overwhelming for the system.


    A few years ago, distributed `DDoS` or `DoS` attacks were very simple. However,
    over the years `DDoS` toolkits have been able to launch both infrastructure and
    application attacks. It has been found that `DDoS` attacks from the application
    layer are very targeted.


    ### Key logger


    A keylogger or system monitor is software used to monitor and record keystrokes
    of a user on the keyboard or touchpad. The keystrokes are then retrieved to create
    the user''s login ID and passwords without his knowledge.


    The keylogger can be software or hardware that steals personal information (`PII`).
    Anti-keylogging software can be used to detect the introduction of a keylogger
    program or keylogger hardware. The banking sector and other financial institutions
    are highly exposed to keylogger attacks.


    ### Public WiFi Fake WAP


    An ordinary public WiFi user is the victim of a fake WAP attack in a café, an
    airport and in local shopping malls. The hacker creates a fake Wifi point, which
    is then connected to the free official WAP.


    This is the simplest type of hacking attack that is possible, as a hacker must
    download simple software or know the "hot spot" feature of the mobile phone to
    create a fake WAP. The problem starts when hackers start to use a special data-gathering
    tool when the user connects to those spoofed WAPs.


    With Fake WAP, an attacker attempts to steal your credentials or simulate a man-in-the-middle
    attack, such as `Ettercap`, that detects live connections or the `Metasploit`
    project from which the attacker completely controls the device. the WAP user.


    Fake WAP WiFi Source Public - IamWire


    ### Attack of water points


    Using a "hacker" hacking technique, the hacker tries to attack a certain group
    of internet users. This is achieved by identifying the website, which is mainly
    visited by the group.


    The site is infected with viruses, worms, malware or malicious advertisements
    that allow an attacker to gain access to the user''s computer system after the
    user has started the site. This is a kind of clickbait attack in which popular
    niche sites target users of the site. These are core attacks that infect a legitimate
    Web site, computer systems, or audience devices.


    These types of attacks are committed in large companies, on bank websites, on
    government websites and in public places by setting false WAP and other methods.


    The hacker constantly monitors the popular website with vulnerabilities. These
    sites contain malicious code that redirects the visitor to a malware web site
    waiting to infect the systems.


    Waterhole attacks target organizations where employees, providers, or site users
    use less secure wireless networks to receive access. Although these attacks are
    not so common, they remain undetectable for a long time.


    Attack of spring water points - Trend Micro


    Often referred to as espionage attacks, a passive attack involves hacking that
    allows the hacker to listen to and easily monitor the transmitted information.
    In no case does a hacker attempt to change the user''s data or system settings.
    It is a kind of espionage activity.


    What is hacking like that? From a simpler point of view, this is the exact opposite
    of an active attack in which the hacker tries to enter the system by introducing
    malicious software and then changing the data. Although passive attack does not
    appear to be a major threat compared to an active attack, the damage can be significant
    if the hacker provides practical information such as your bank ID and password.

