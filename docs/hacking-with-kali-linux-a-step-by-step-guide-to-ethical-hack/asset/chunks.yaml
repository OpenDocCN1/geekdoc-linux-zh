  trans: '


    许多政府机构或高级安全组织会出于非恶意目的使用被动攻击。然而，人们发现，通过被动攻击收集信息并进行主动攻击更具针对性，这使得用户难以察觉到他们的信息和数据正被用于创建针对性攻击。


    # 不同类型的高级黑客攻击


    每当犯罪分子试图入侵网络时，他总是会尝试使用那些在许多情况下证明有效的最常用黑客技术。


    他只是试图避免重复轮子，而是优化现有技术并执行更高级、更复杂的攻击。今天登上新闻头条的网络安全攻击通常是以下类型之一：


    ## 钓鱼攻击


    钓鱼攻击占了数据泄露的 90%，仅在 2018 年一年中，钓鱼攻击的数量就增加了 65%。钓鱼攻击最糟糕的一点是它们发展非常快。每个月都会识别出 150 万个新的钓鱼网站。


    作为一个合法来源，黑客利用社会工程和各种类型的黑客技术欺骗受害者采取行动，范围范围从点击链接到下载带有恶意链接的附件。电子邮件是钓鱼攻击最为人知的渠道。最常用的某些高针对性钓鱼攻击类型包括：


    ### 鱼叉式钓鱼 (harpoon Fishing)


    一种精心策划的攻击，通过收集和调查目标群体的信息来获得更高的成功率。鱼叉式钓鱼邮件伪装成合法来源，并非可以质疑的随机信息。这些邮件的设计目的是让受害者信任它们，并使其产生本能反应。此类攻击大多发生在假期期间，此时邮件流量非常大，受害者会被诱导进入紧急状态。


    在受害者点击恶意链接后，她使用了用户名和密码登录。然后黑客就开始了搜索。鱼叉式攻击可能非常危险。


    ### 鲸鱼攻击 (Whaling)


    鲸鱼攻击针对特定组织领导者的邮箱。首席执行官（CEO）和首席财务官（CFO）目标目标。由于这些管理职位仍然拥有机密信息的权限，攻击这些信息对黑客来说更有利。这包括非常有针对性的攻击。个人和组织都面临风险。


    ### 病毒、木马、蠕虫


    进入受害者系统或网络并持续监控或修改传输的数据和信息的软件。病毒或木马是恶意的，可以跟踪用户数据或通过索要赎金解密密钥来加密用户文件。


    病毒、蠕虫、木马和机器人通过其他方式感染计算机系统，但其影响取决于创建时的复杂程度。


    ### Cookie 窃取


    Cookie 窃取是指模仿同一网络受害者的 Cookie。通过使用这些 Cookie，黑客可以访问受害者访问过的网站，并实施恶意攻击。


    当黑客访问未加密的会话数据并模拟真实用户时，就会发生 Cookie 窃取。用户在公共网络浏览信任网站时会被暴露。


    ## 计算机欺诈与安全


    黑客总是会导致计算机欺诈，黑客试图访问用户的个人信息。这些信息可能包括电子邮件地址、电话号码、用户 ID、密码甚至身份盗用。


    通过访问个人层的信息，黑客试图未经授权访问银行账户、社交媒体账户等以增加损害。如果不是直接获取 ID 或直接密码，黑客会尝试加密文件、推送恶意软件和勒索软件来勒索受害者的钱。


    互联网的发展是一场善、恶与丑的博，而“黑客行为”是最丑的部分。如果你也想成为网络安全专家，请参加网络安全课程，将你的职业提升到更高水平。


    ## 防火墙与保护


    大多数家庭和办公室现在都有防火墙，将你的内部计算机网络与互联网的“荒西部”隔离开。好消息是，防火墙的配置变得更加复杂和正确。对于备份内部计算机网络上的设备来说，这是一项工作。现代防火墙现在包含了检测和防止入侵者、过滤电子邮件以及阻止网站。


    大多数防火墙都能记录谁在何时做了什么。它们不仅阻止网络外的犯罪分子，还防止内部用户访问互联网上的不当资源。员工可能会被阻止访问浪费公司业务或违反某些安全要求的网站。主要工作时间真的不是更新你
    Facebook 页面的时间！组织不希望他们的医疗和财务服务人员通过即时消息服务与陌生人交流。


    防火墙是你网络“网关”的电子等物。有各种潜在的入侵者粉刷着门窗，不力地寻找进入的方法。一个配置当、管理并定期更新的防火墙可以有效保护办公室和家中的计算机网络。在防火墙之后，桌面和桌面服务器必须具有基于本地软件的软件防火墙，它同时也提供杀病毒保护。如果任何东西越过了防火墙，希望内部杀病毒和桌面防火墙解决方案能提供额外的安全保障。


    防火墙是合理且足够的，但这里有一个坏消息。你现在听到的和读到的大部分内容并不是由犯罪分子跨越你的防火墙造成的！真正的损害是由那些在你网络内部的人造成的！恶意用户和不诚实的员工一直是祸患。不道德的员工为了金钱泄露信用卡信息或提供安全信息。然而，真正的危险是用户会忽视如今复杂的安全漏洞。最诚实的员工可能在不经意间成为严重安全泄露的源头，导致你个人信息或客户个人及财务信息的丢失。


    ## 内部威胁与移动攻击


    以普通笔记本电脑用户为例。你有多少次去星巴克并坐下？祝你有美好的一天，户外、阳光、宽带互联网连接、无线电话，业务如常运行！如果我告诉你是通过“中间人”组织对星巴克的攻击是多么么没有压力，你余生都会放弃咖啡。你认为你连接了星巴克的
    Wi-Fi，但实际上，星巴克后面那个将无线接入点连接到他 USB 接口的孩子，给了他是你上网网关的印象。自你登录以来，他就监控了你笔记本电脑上的每一个按键。事实上，他现在有了你的用户名、密码以及计算机上的几乎所有内容。如果你回到办公室并在现在注册，你就在公司网络中解锁了一个机器人，它在今天晚上再次可用。


    如果笔记本电脑还不够，每个人现在都随身带着智能手机！你知道你的手机存储了你最近使用过的 Wi-Fi 网络列表吗？你记得上次在星巴克等咖啡时检查邮件吗？现在你的手机会在任何看起来像“星巴克
    WiFi，你在吗？”的地方发送标签请求，希望它得到回答并自动连接到互联网。你还记得我们谈过的那个孩子吗？他决定用“是的，我在，跳过来！”来回答你的标签请求。这又是一个
    `MITM` 攻击，以及它在你的智能手机上能做什么，尤其是那些让你的笔记本电脑看起来像金库堡一样的安卓系统！


