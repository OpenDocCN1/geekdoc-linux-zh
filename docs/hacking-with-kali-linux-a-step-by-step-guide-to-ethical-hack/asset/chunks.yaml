    You''ve probably already heard about the basics of cybersecurity. These include
    constantly changing passwords and utilizing a password manager, running periodic
    software updates, and refraining from opening a password attachments of people
    you do not know. While cybersecurity experts learn to prevent attacks, criminals
    are only inventing new ones. So let us identify some of the new ways in which
    hackers break in and how you can preserve your family from cyber-attacks. Two
    thirds of the cyber attacks cases are not solved.


    ## 1. More and more sophisticated phishing scams


    Most people believe that they are not attacked by a cyberattack, but two-thirds
    of the attacks are not targeted. That''s why cyber security is so important to
    families. Email phishing scams is a great example. In fact, 92% of cybersecurity
    issues start with emails, so the whole family needs to take precautions, especially
    when sharing computers.


    End the time of obvious phishing. Do not expect princes from exotic countries
    to send you an e-mail asking for money. Now hackers mimic us by claiming to be
    the ones we trust - banks, mobile companies, governments, and even friends and
    family. When opening emails, be aware of the following warning signs:


    ### 2. Request private information


    If you''re asked for bank account numbers, passwords, or other sensitive information
    by email, it''s probably a phishing scam. Scammers know that e-mail comes from
    authoritative sources such as the `IRS`, but organizations like the `IRS` do not
    send e-mails or request further information in the event of a problem. will contact
    you by US post or come directly to your door.). If you''re not sure who the email
    or caller is, look up his number on `Google` (do not use the ones listed in the
    suspicious email) and call him to find out.


    **Note:** If you receive harassing phone calls or emails from someone claiming
    to be in the `IRS` or any other government agency, report it.


    ### 3. Exceptional emails


    If a friend''s email account is compromised, a hacker can contact you by email
    and see if he or she can access your accounts. If you receive an e-mail from someone
    you know you do not expect, just call the person - a hacker might be able to impersonate
    someone in an e-mail, but it''s unlikely that he pretends to be be a voice, not
    to mention the phone''s access to his victim.


    #### Unusual language, typos and account changes


    Be careful with subtle hints, such as emails from `jane.doe@gmail.com`, if your
    contact is listed as `jane-doe@gmail.com`. Business emails are unlikely to contain
    typos or strange words. A sentence that you do not know well from someone you
    know well may be a red flag. Please read it carefully.


    #### You may be asked to click on an attachment or link


    You might have heard that, but it''s worth repeating. If you do not know what
    you are opening, do not open it until you talk to the person who sent it. If an
    e-mail comes from your bank asking you to connect using a link provided, protect
    it - avoid the link in the e-mail and simply log in to your online bank account
    in the usual way. Why? Because you never know what that stubbornness might be.
    You could very well download malware that can access the entire hard drive. If
    you work on a shared computer, you are putting all users at risk.


    **What to say to your family:** Trust, but check and call before you click. A
    call takes two minutes. Eliminating the damage caused by a cyberattack can take
    years, even if you recover completely.


    ## 2. Steal the identity of children


    We hear a lot about cyber security among seniors. They always seem to be victims
    of phishing scams by email and phone. But when it comes to identity theft, the
    likelihood of children being affected is much higher. Why are children a preferred
    destination? Think about it. Children do not have to check their creditworthiness
    before the age of 18. Criminals can take credit cards in their name and live big.
    You will accumulate unrecognized debts until your child is denied a student loan
    because it has about $ 1 million in your pocket.


    The red flags for these can be easily recognized. If you receive a letter from
    the `IRS` stating that your 8-year-old has not paid any taxes or has collected
    calls for items that you have not purchased, follow these instructions to learn
    the steps to take if your child''s identity is stolen becomes. Courtesy of the
    `FTC`. However, since cybercriminals often wait several years before using the
    information they receive, you may not notice red flags. Remember to check your
    children''s annual free credit reports to make sure everything looks good. In
    addition, you can specify a credit stop (also known as a safety stop) in the credit
    reports of all your children. Freezing credit is one of the easiest ways to protect
    children from identity theft. This free tool prevents anyone from accessing a
    credit report. Since most new accounts will not be approved without this report,
    identity thieves will find it much harder to use your information.


    **What to say to your family:** Tell your children that you will freeze (or at
    least monitor) their report to prevent cybersecurity issues from affecting them
    in the future. When you review your credit report, involve them in the process
    to familiarize yourself with financial management.


    ## 3. Access confidential information using unsecured devices connected to the
    Internet


    Does anyone care what you put in your Wi-Fi-connected slow cooker? Of course not,
    but that does not mean it will not get hacked. Intelligent home appliances are
    incredible, but the benefits come with risks.


    The Internet of Things is a cybersecurity risk, because if a hacker can access
    a single device, they can access your entire network. This application-controlled
    baby video monitor can be a serious drawback to your digital armor. Many of the
    common cybersecurity policies apply here. Use passwords that you regularly change,
    try multi-factor authentication, perform security updates, and avoid using public
    `WLAN`. However, whenever possible, avoid connecting to the Internet with devices
    that can be used safely. Ask yourself if this device really needs to connect to
    the Internet, and in that case, try placing it on a different network.


    **What you have to say to your family:** Sorry, kids, we do not have a Wi-Fi compliant
    refrigerator, but we have a password manager.


    ## 4. Enjoy social sharing on social media


    It is quite normal to want to talk about your vacation. This is exciting, you
    will create many memories, take lots of pictures and it is not something you do
    every day. But if you reveal on `Facebook` that you are leaving the city for two
    weeks, you may also have a sign saying "Please, steal my house" hanging on your
    door.


    It''s okay to have public social media sites like yours. However, avoid sharing
    personal information on these pages. Keep personal pages private and review your
    friends list from time to time. Are you really in contact with 1,000 people? Remove
    people you do not know, personalize your security settings to limit the number
    of people seeing your information, or stop sharing personal information in that
    profile. This may seem like patanoid steps to take but they are not any less valid.
    One of the popular ways hackers use to break into security systems is simply looking
    through the social media accounts of their targets.


    Please note that with every security update, `Facebook` will reset your default
    settings to the lowest security setting. Check the settings regularly and use
    secure passwords. Many social platforms even offer multifactor authentication.
    This means that you will need to use your password and one or more additional
    verification forms to access an account. For example, this could be a one-way
    code sent to your phone or a fingerprint - anything a hacker may not be able to
    use.

