    ## 6. Less privileged access management


    When evaluating the tools your team uses, make sure you''ve taken the time to
    define access permissions to team members, roles, levels, or roles. In short,
    ensure that only your administrators have access to all the features of a tool,
    system or network.


    The rest of the mmebers of staff should only have access to functions, data and
    areas related to their work. When an attacker gains access to a person''s credentials,
    the damage he or she can cause is limited to rights that are defined only for
    that person.


    ## 7. Physical security


    When you focus on backing up your digital assets, you should not neglect the importance
    of securing your physical environment. In many cases, on-site attackers and physically
    entering buildings or data centers have access to credentials, trade secrets,
    infrastructure schemata, and other useful and actionable information.


    Use proven security methods such as passport access, camera surveillance, and
