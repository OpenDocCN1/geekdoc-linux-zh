    a small malware program is introduced that takes several days to detect before
    the potential damage is done. Botnets are designed to automate the attack sending
    multiple requests, packets, or messages, which is overwhelming for the system.


    A few years ago, distributed DDoS or DoS attacks were very simple. However, over
    the years DDoS toolkits have been able to launch both infrastructure and application
    attacks. It has been found that DDoS attacks from the application layer are very
    targeted.


    Key logger


    A keylogger or system monitor is software used to monitor and record keystrokes
    of a user on the keyboard or touchpad. The keystrokes are then retrieved to create
    the user''s login ID and passwords without his knowledge.


    The keylogger can be software or hardware that steals personal information (PII).
    Anti-keylogging software can be used to detect the introduction of a keylogger
    program or keylogger hardware. The banking sector and other financial institutions
    are highly exposed to keylogger attacks.


    Public WiFi Fake WAP


    An ordinary public WiFi user is the victim of a fake WAP attack in a café, an
    airport and in local shopping malls. The hacker creates a fake Wifi point, which
    is then connected to the free official WAP.


    This is the simplest type of hacking attack that is possible, as a hacker must
    download simple software or know the "hot spot" feature of the mobile phone to
    create a fake WAP. The problem starts when hackers start to use a special data-gathering
    tool when the user connects to those spoofed WAPs.


    With Fake WAP, an attacker attempts to steal your credentials or simulate a man-in-the-middle
    attack, such as Ettercap, that detects live connections or the Metasploit project
    from which the attacker completely controls the device. the WAP user.


    Public WiFi Fake WAP


    Fake WAP WiFi Source Public - IamWire


    Attack of water points


    Using a "hacker" hacking technique, the hacker tries to attack a certain group
    of internet users. This is achieved by identifying the website, which is mainly
    visited by the group.


    The site is infected with viruses, worms, malware or malicious advertisements
    that allow an attacker to gain access to the user''s computer system after the
    user has started the site. This is a kind of clickbait attack in which popular
    niche sites target users of the site. These are core attacks that infect a legitimate
    Web site, computer systems, or audience devices.


    These types of attacks are committed in large companies, on bank websites, on
    government websites and in public places by setting false WAP and other methods.


    The hacker constantly monitors the popular website with vulnerabilities. These
    sites contain malicious code that redirects the visitor to a malware web site
    waiting to infect the systems.


    Waterhole attacks target organizations where employees, providers, or site users
    use less secure wireless networks to receive access. Although these attacks are
    not so common, they remain undetectable for a long time.


    Attack of spring water points - Trend Micro


    Often referred to as espionage attacks, a passive attack involves hacking that
    allows the hacker to listen to and easily monitor the transmitted information.
    In no case does a hacker attempt to change the user''s data or system settings.
    It is a kind of espionage activity.


    What is hacking like that? From a simpler point of view, this is the exact opposite
    of an active attack in which the hacker tries to enter the system by introducing
    malicious software and then changing the data. Although passive attack does not
    appear to be a major threat compared to an active attack, the damage can be significant
    if the hacker provides practical information such as your bank ID and password.'
