    你可能已经听过关于网络安全的基础知识。这些包括不断更改密码和使用密码管理器、定期运行软件更新，以及避免打开来自陌生人的带有密码的附件。当网络安全专家学习如何防止攻击时，罪分子正不断发明新的攻击手段。因此，让我们来识别黑客入侵的一些新方式，以及你如何保护你的家人免受网络攻击。三分之二的网络攻击案例尚未得到解决。


    ## 1. 越发复杂的钓鱼诈骗


    大多数人认为自己不会受到网络攻击的侵害，但三分之二的攻击并不是针对性的。这就是为什么网络安全对家庭如此重要。电子邮件钓鱼诈骗就是一个很好的例子。事实上，92%
    的网络安全问题始于电子邮件，因此全家人都需要采取预防措施，特别是在共享电脑时。


    结束显而易见的钓鱼时代吧。不要指望来自异国的王子会发邮件向你索钱。现在，黑客通过冒充我们信任的人——银行、移动公司、政府，甚至朋友和家人来模仿我们。在打开邮件时，请注意以下警告信号：


    ### 2. 请求私有信息


    如果你被电子邮件要求提供银行账户、、密码或其他敏感信息，那可能是一个钓鱼诈骗。诈骗者知道电子邮件来自 `IRS` 这样的权威来源，但像 `IRS` 这样的组织在出现问题时不会发送电子邮件或要求进一步信息（他们会通过美国邮政联系你或直接上门）。如果你不确定邮件或来电者是谁，请在
    `Google` 上查询其号码（不要使用可疑邮件中列出的号码）并致电核实。


    **注意：** 如果你收到自称来自 `IRS` 或任何其他政府机构的人的骚扰电话或邮件，请进行举报。


    ### 3. 异常电子邮件


    如果朋友的电子邮件账户被盗，黑客可以通过电子邮件联系你，并查看他她是否可以访问你的账户。如果你收到一封来自你意料的人的邮件，直接给那个人打电话——黑客可能在邮件中冒充某人，但不太可能伪装声音，更不用说通过电话访问受害者了。


    #### 异常语言、拼写错误和账户更改


    注意细微的线索，例如来自 `jane.doe@gmail.com` 的邮件，而你的联系人显示为 `jane-doe@gmail.com`。商务邮件不太可能包含拼写错误或奇怪的词汇。你熟悉的人发来的一句你不熟悉的句子可能是一个红灯信号。请仔细阅读。


    #### 你可能被要求点击附件或链接


    你可能听过这些，但值得重复一遍。如果你不知道正在打开什么，在与发送者交之前不要打开它。如果收到一封来自银行的邮件要求你使用提供的链接进行连接，请保护好自己——避免邮件中的链接，直接以通常的方式登录你的在线银行账户。为什么？因为你永远不知道那种固执会导致什么。你很可能会下载可以访问整个硬盘的恶意软件。如果你在共享电脑上工作，你让所有用户都处于风险之中。


    **你应该对家人说：** 信任，但要在点击之前检查并打电话。打个电话只需两分钟。而消除网络攻击造成的损害可能需要多年，即使你完全恢复。


    ## 2. 窃取儿童身份


    我们经常听到关于老年人网络安全的话。他们似乎总是电子邮件和电话钓鱼诈骗的受害者。但在涉及身份盗定时，儿童受影响的概率要高。为什么儿童是首选目标？想一下。孩子在
    18 岁之前不需要检查他们的信用信誉。罪分子可以用他们的名义办理信用卡并挥霍。你将积累未被察觉的债务，直到你的孩子申请学生贷款被拒绝，因为你的口袋里已经有了大约
    100 万美元。


    这些问题的红灯很容易识别。如果你收到一封来自 `IRS` 的信，说你 8 岁的孩子没有交过任何税，或者收到了你未购买物品的催款，请遵循这些指令了解在孩子身份被盗用时要采取的步骤（由
    `FTC` 提供）。然而，由于网络罪犯通常会在收到信息后等几年才使用，你可能注意不到红灯信号。记得检查你子女的年度免费信用报告，以确保一切正常。此外，你可以在所有子女的信用报告中指定信用冻结（也称为安全停止）。冻结信用是保护儿童免受身份盗窃简单的方法之一。这个免费工具可以防止任何人访问信用报告。由于大多数新账户在没有报告的情况下将无法通过，身份窃取者会发现使用你的信息将变得困难得多。


    **你应该对家人说：** 告诉你的孩子，你将冻结（或至少监控）他们的报告，以防止网络安全问题在未来影响他们。当你查看信用报告时，让他们参与进来，以便他们熟悉财务管理。


    ## 3. 使用连接到互联网的不安全设备访问机密信息


    有人会在你在连接 Wi-Fi 的慢炖锅里放了什么吗？当然不会，但这并不意味着它不会被破解。智能家居是不可思议的，但收益伴随着风险。


    物联网是一项网络安全风险，因为如果黑客可以访问单个设备，他们就可以访问你的整个网络。这个由应用程序控制的婴儿视频监控器可能成为你数字装甲的严重短板。许多常见的网络安全策略适用于这里。使用经常更改的密码，尝试多因素身份验证，执行安全更新，并避免使用公共
    `WLAN`。然而，尽可能避免使用可以安全使用的设备连接到互联网。问问自己，该设备是否真的需要连接互联网，如果是的话，尝试将其放在不同的网络上。


    **你应该对家人说：** 抱歉，孩子们，我们没有符合 Wi-Fi 标准的冰箱，但我们有一个管理器。


    ## 4. 在社交媒体上享受社交分享


    想谈论你的假期是非常正常的。这很令人兴奋，你会创造许多记忆，拍很多照片，这不是你每天都会做的事。但如果你在 `Facebook` 上透露你要离开城市两周，你的门上可能挂着一个写着“请偷我的房子”的牌子。


    拥有像你这样的公共社交媒体网站是可以的。但避免在这些页面上分享个人信息。将个人页面设为私密，并经常检查好友列表。你真的和 1000 个人联系吗？删除你不认识的人，个性化你的安全设置以限制看到你信息的人数，或者停止在该个人资料中分享个人信息。这些看起来可能是是偏执的步骤，但它们并没有那么无效。黑客用来破解安全系统的一种流行方法是是查看其目标的社交媒体账户。


    请注意，每次进行安全更新，`Facebook` 都会将你的默认设置重置为最低安全设置。定期检查设置并使用安全密码。许多社交平台甚至提供多因素身份验证。这意味着你需要密码和一个或多个额外的验证形式来访问账户。例如，这可以是发送到手机的单次代码或指纹——黑客可能无法使用的任何东西。


