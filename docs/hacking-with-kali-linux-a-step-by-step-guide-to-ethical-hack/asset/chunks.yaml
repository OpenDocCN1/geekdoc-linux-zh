    # They will see if the program can be exploited in anyway and then return it to
    the programmers along with a list of the vulnerabilities found. This is just one
    of the benefits of ethical hacking. The program can then be fixed, or strengthened,
    and sent back again to the hackers to confirm whether there are still any problems
    with it.


    The aforementioned is just one example of the benefits in carrying out hacking.
    Did you know that there are actually sources being taught on this subject as the
    demand for hackers has actually increased? As the world becomes ever more reliant
    on computers, the potential damage that can be caused by a hacker, or groups of
    hackers, has grown to whole new levels. This is not something large companies
    can afford to ignore.


    As learning how to be a hacker can lead to a very promising career indeed, working
    for one of the many major companies. As discussed, there are several good reasons
    for ethical hacking to be carried out "in-house" and all of them can help companies
    potentially save millions of dollars, and minimize the risk of ruining their hard
    earned reputation with their customers and peers. It is not only the companies
    who benefit but the people who buy their programs as well.


    A team of good hackers can make sure that a program is as safe as possible, making
    the work of any would-be hacker that many times harder, often forcing them to
    move on to easier targets. This makes sure that any programs in wide circulation
    will rarely be tampered with and help protect the privacy and integrity of the
    computers of people all around the world.


    ## Infrastructure


    Infrastructure equals money. In order to scale, you need a flexible infrastructure
    to handle the growth. With that said, when centralized infrastructure turns into
    bureaucracy and slow response, the company becomes lethargic. Hacking work examines
    these problems from the workers standpoint and outlines things you can do to get
    your work done by working smart.


    ## Why is this important to me?


    I am not doing this summary to waste your time. It is my vision to provide concise
    action steps that you can adopt right now to reach your entrepreneurial goals.
    Most companies today trust their vendors and customers more than their employees.
    This is a real problem because brilliant results require team work and you cannot
    have a cohesive team if there is no trust. Companies want transparency and centralization
    similar to command and control systems. This is not a bad thing until it takes
    a sales man 2 hours to enter an order or if the company blocks Facebook, twitter
    and LinkedIn. Stupid actions like this kill results.


    Results are the name of the game. If you do not get results NOW, you are dead.
    The hub and spoke model for business is not a bad model just as long as the spokes
    have autonomy to deliver to the customers and are not tied up by bureaucracy.


    ## Hacking Work


    Hacking work is broken down into four sections. For the sake of time, I will highlight
    one point from each section.


    1. **Engaged Team Members**: This point sums up the whole book and separates great
    businesses crappy ones. Engaged team members are four times more productive and
    profitable than disconnected team members. This statistic if focused can transform
    any business.

    2. **Slaves to Infrastructure**: I understand the need for procedures and infrastructure
    because you cannot scale without it. With that said, I know that larger companies
    handcuff employees employees ridiculous rules and procedures that ultimately kill
    the creative spirit. Hacking Work is all about working around these ridiculous
    rules and procedures. A simple example of this would be locking down file access
    from one computer to the next. People today can have access to everything outside
    their work from their phone.

    3. **Three Types of Hackers**: Black Hacks are the ones that steal, cheat and
    create havoc. This book does not advocate black hacks. Grey Hacks and White Hacks
    are what are necessary to get the job done. These types of hacks are simply clever
    around allow workers to use their creative freedom for profit and customers.

    4. **Clarity**: This one is a big deal. Take a look at the stats: one, three of
    the top five time wastes all relate to communication. Two, information in companies
    doubles every 550 days. Three, once every three minutes, the average dweller accepts
    an interruption and shifts focus, consuming 28% of the day. Creating clarity and
    simple communication and information sharing networks can sure all of this.


    ## Do not go yet; One last thing to do


    If you enjoyed this book or found it useful I’d be very grateful if you’d post
    a short review on it. Your support really does make a difference and I read all
    the reviews personally so I can get your feedback and make this book even better.


    Thanks again for your support!

