    But how did the malware infect the server and POS devices? If we believe security
    researchers, the vulnerability probably comes from within. In the absence of an
    internal saboteur, a careless target employee, probably from the IT department,
    was misled by a link in an official e-mail - apparently from his bank, manager,
    or management. or visit a correspondent. attractive website - to reveal important
    permission information that has been passed on to the hacker. Or maybe someone
    has convinced a helpful employee to print a small document from a USB stick.


    And now bankers are calling and investigating people to collect even more compromising
    information from unsuspecting victims as the second wave of social hacking.


    Although there are sophisticated hackers (such as the author of the malicious
    software that eventually integrated them into Target''s devices), this is the
    weakest link and therefore the least viable method for hackers is the reckless
    individual.


    In 2008, 10 million carefree Americans had their credit card information stolen.
    In 2012 it was 15 million. In the last month of 2013 more than 100 million. Now
    some normative words in the wise:


    DO NOT share your Social Security number, especially not by phone or email, and
    do not use it as an identifier. As a rule, it is sufficient to give it to your
    employer, your financial institution and the authorities.


    With a few exceptions, when you''re there, you DO NOT click on links embedded
    in e-mails - especially links from people you do not know. It''s probably a good
    idea not to click on the links of people you know. It''s safer to manually enter
    URL or domain information into a browser. Do not share your passwords with third
    parties. Even the technical support would not need that. And do not be the helpful
    person who prints a person''s CV by accidentally infecting the entire network.


    There are courses that train ethical and unethical pirates in social engineering,
    and books like Hadnagy''s "Social Engineering: The Art of Human Piracy" on the
    same topic. Many thousands of unethical characters take these lessons and are
    now looking for helpful souls like you. Take precautionary measures and do not
    let social engineers annoy you.


    # HOW HACKERS WORK


    A hacker or ethical hacker uses intrusion testing techniques to test a company''s
    IT security and identify vulnerabilities. IT security personnel use the results
    of these intrusion tests to fix vulnerabilities, improve security, and reduce
    business risk factors.


    Penetration testing is never an occasional task. This requires a lot of planning,
    including the explicit approval of management to conduct tests and then run tests
    that are as safe as possible. These tests often involve the same techniques that
    attackers use to actually break into a network.


    ## Background and training required


    White hat hacking involves a lot of problem solving as well as communication skills.
    A white-hat hacker also needs a balance between intelligence and common sense,
    strong technical and organizational skills, proper judgment, and the ability to
    remain under pressure.


    At the same time, a white-hatred hacker must think like a black-hatred hacker
    with all his evil goals, abilities, and sneaky behavior. Some of the best white-hatred
    hackers are former black-hatted hackers who, for various reasons, have decided
    to leave a life of crime and use their skills in a positive (and legal) way.


    There are no official training criteria for a white hacker - any organization
    can set their own requirements for this job - but a bachelor''s or master''s degree
    in information security, computer science or even mathematics provides a solid
    foundation.


    For those who are not affiliated with the university, military training, especially
    in the field of intelligence, can help ensure that your resume is noted by human
    resource managers. Military service is also an asset to employers who want or
    need to hire people who already have a security clearance.


    ## Relevant certifications


    Many security certifications and security hackers can make it easier for a candidate
    to get started, even without much practical experience.


    The `CEH` certification (Certified Ethical Hacker) by the European Council is
    a recommended starting point. `CEH` is a vendor-neutral title, and `CEH`-certified
    professionals are in high demand. According to PayScale, the common salary of
    an ethical hacker is close to $ 80,000, and the upper range can reach more than
    $ 100,000\. On the consultant side, the European Council states that `CEH` professionals
    can expect between $ 15,000 and $ 45,000 per contract or short-term mission.


    Medium level `CEH` credentials focus on system piracy, enumeration, social engineering,
    SQL injection, Trojans, worms, viruses and other forms of attacks, including denial
    of service. Applicants must also have in-depth knowledge of cryptography, penetration
    testing, firewalls, honeypots, and more.


    The European Council recommends a five-day `CEH` training course for candidates
    without previous work experience. To pass the course, participants must have knowledge
    of `Windows` and `Linux` system administration, knowledge of `TCP / IP`, and basic
    knowledge of virtualization platforms. However, there are also opportunities for
    self-study to assist candidates in passing the required individual exam. Please
    note that the `EU Council` requires applicants to have at least two years of information
    security experience and to pay a registration fee of US $ 100.


    Becoming a certified White Hat hacker also means staying on the legal side of
    hacking, never hacking illegally or unethically, and always protecting the intellectual
    property of others. As part of the certification procedure, applicants must agree
    with the `EC Code of Conduct` and never contact hackers or malicious activities.


    Besides the `CEH`, the `SANS GIAC` program deserves a look. The organization has
    so far given more than 81,000 references. Candidates starting with the `GIAC Cyber
    Defense Forums` may be better able to complete active, respected, and comprehensive
    safety training. The `GIAC Penetration Tester` (`GPEN`) as well as the `GIAC Exploit
    Search Tester` and the `Advanced Penetration Tester` (`GXPN`) are notable arguments
    for aspiring hackers.


    Another set of ethical hacking certifications comes from `mile2`. The organization''s
    cybersecurity certification roadmap includes the `Certified Vulnerability Evaluator`
    (`CVA`), followed by the `Certified Professional Ethical Hacker` (`CPEH`), the
    `Certified Penetration Testing Engineer` (`CPTE`), and the `Advanced Level Consultant
    for Certified Penetration Testing` (`CPTC`). In addition, eligible US veterans
    can use their IG Bill benefits to earn cybersecure certifications.


    ## Related Certifications in Forensic Science


    It is always advisable to be tempted by computer forensics for those working in
    the field of information security. For those interested in the safety investigation
    component, continue with the `EC-Conseil Certification List`, then discuss the
    title of `Computer Hacking Forensic Investigator` (`CHFI`) certification.


    `CHFI` focuses on the forensic investigation process and uses the appropriate
    tools and techniques to obtain evidence and computer data. As part of the `CHFI`
    certification training, candidates also learn how to recover deleted files, decode
    passwords, analyze network traffic, and use various forensic investigation tools
    to collect information.


    Other notable forensic certificates include the forensically-certified `GIAC Forensic
    Analyst` (`GCFA`), the `Forensic Forensic Technician`, and the `Computer Crime
    Researcher` for the `High Tech Crime Network`.


    ## The physical side of the penetration tests

