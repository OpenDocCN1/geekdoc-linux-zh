    A regular look at ethical hacking in general and practitioner David Jacquet of
    Mainebiz show the rise of ethical piracy and explain why these people are in demand.
    The agonizing question concerns the boundaries between white, gray and black.
    The world of hacking is so exact, specialised and mysterious. How can companies
    be sure that the hacker they invite to attack their networks is really ethically
    correct? How do companies know that any weaknesses found have been reported to
    the customer?


    Presumably, it''s about reputation and trust. At the same time, it is a pretty
    difficult assumption.


    Automated tools now determine the Internet. You can find some to expand your social
    networks, others to automatically respond to emails, and even robots to help your
    customers online. Of course, hacking has evolved too: today there are many automated
    `OSINT` tools that can help anyone carry out security investigations and information
    detection in a way that was not possible 20 years ago.


    # 15 ETHICAL HACKING TOOLS YOU SHOULD NOT MISS


    1. `John the Ripper`

    2. `Metasploit`

    3. `Nmap`

    4. `Wireshark`

    5. `OpenVAS`

    6. `IronWASP`

    7. `Nikto`

    8. `SQLMap`

    9. `SQLNinja`

    10. `Wapiti`

    11. `Maltego`

    12. `Air Cracking ng`

    13. `Reaver`

    14. `Ettercap`

    15. `15th screen`


    In recent decades, few security experts have conducted hacking tests and ethical
    intrusion tests. Now almost anyone can report security incidents. Using ethical
    hacking tools, you can analyze, search, and discover vulnerabilities and weaknesses
    in a company to increase the security of systems and applications (as described
    in the current `CVE` article for wild state released a few weeks ago).


    Now, we will examine the best ethical hacking tools used by modern security researchers.
    We have compiled some of the well-known intrusion testing tools to help you in
    the early stages of a safety investigation. Here you will find classic tools that
    seem to have always existed, and new tools that may not be familiar to you.


    ## 1. John the Ripper


    `John the Ripper` is one of the known password crackers of all time. It''s also
    one of the best available security tools to test password security in your operating
    system or to remotely monitor it.


    This password hijacker automatically detects the type of encryption used in almost
    all passwords and changes the password test algorithm accordingly. This makes
    it one of the several popular password hacking tools. Pass the smartest of all
    times.


    This ethical hacking tool uses brute-force technology to decrypt passwords and
    algorithms such as:

    - `Des`, `MD5`, `Blowfish`

    - `Kerberos AFS`

    - `Hash LM` (Lan Manager), the system used in Windows `NT / 2000 / XP / 2003`

    - `MD4`, `LDAP`, `MySQL` (with third-party modules)


    Another advantage is that `JTR` Open Source, cross-platform and fully available
    for `Mac`, `Linux`, `Windows` and `Android`.


    ## 2. Metasploit


    `Metasploit` is an open source cybersecurity project that enables information
    professionals to use a variety of penetration testing tools to detect security
    vulnerabilities in remote software. It also acts as a development platform for
    operating modules.


    One of the best-known results of this project is `Ruby`''s `Metasploit` framework,
    which lets you easily develop, test, and run exploits. The framework includes
    a number of security tools that allow you to:

    - Run systems for detecting hacking

    - Perform security vulnerability scans

    - Run remote attacks

    - List networks and hosts


    `Metasploit` offers three different versions of its software:

    - `Pro`: Ideal for intrusion testing and IT security teams.

    - `Community`: Used by `Infoec` small businesses and students.

    - `Framework`: The best for application developers and security researchers.


    Supported platforms are:

    - `Mac OS X`

    - `Linux`

    - `the window`


    ## 3. Nmap


    `Nmap` (Network Mapper) is a free, legal open source security tool that allows
    `Infosec` experts to manage and monitor the security of networks and operating
    systems for local and remote hosts.


    Although it is one of the oldest existing security tools (introduced in 1997),
    it continues to be actively updated and receives new enhancements every year.
    It is also known as one of the most efficient network imagery on the market, known
    for its speed and efficiency in delivering comprehensive results across all security
    investigations.


    What can you do with `Nmap`?

    - Audit of the safety device

    - Identify open ports on remote hosts

    - Network mapping and enumeration

    - Find vulnerabilities in every network

    - Start extensive `DNS` queries on domains and subdomains


    Supported platforms are:

    - `Mac OS X`

    - `Linux`, `OpenBSD` and `Solaris`

    - `Microsoft Windows`


    ## 4. Wireshark


    `Wireshark` is free open source software that lets you analyze network traffic
    in real time. With its detection technology, `Wireshark` is widely recognized
    for its ability to detect security issues in any network and efficiently solve
    common network problems.


    Detecting the network enables you to catch and read the results in a human-readable
    format, making it easier to identify potential issues (such as low latency), threats,
    and vulnerabilities.


    Main features:

    - Saves the scan for offline review

    - Package Browser

    - Powerful graphical interface

    - Rich VoIP analysis

    - Check and uncompress gzipped files

    - Reads other capture file formats, including: `Sniffer Pro`, `tcpdump` (`libpcap`),
    `Microsoft Network Monitor`, `Cisco Secure IDS iplog`, and more.


    Supported network ports and devices: `Ethernet`, `IEEE 802.11`, `PPP / HDLC`,
    `ATM`, `Bluetooth`, `USB`, `Token Ring`, `Frame Relay`, `FDDI`.

    Protocol decryption includes, but not limited to, `IPsec`, `ISAKMP`, `Kerberos`,
    `SNMPv3`, `SSL / TLS`, `WEP`, and `WPA / WPA2`.

    Exports the results in `XML`, `PostScript`, `CSV`, or plain text format.


    `Wireshark` holds up to 2000 different network protocols and is free on all major
    operating systems, including:

    - `Linux`

    - `Microsoft windows`

    - `Mac OS X`

    - `FreeBSD`, `NetBSD`, `OpenBSD`


    ## 5. OpenVAS


    `OpenVAS` (also known as "Nessus") is an open source network scanner that detects
    remote vulnerabilities of all hosts. One of the most popular network weakness
    scanners, it is popular with administrators and professionals of `DevOps` and
    `Infosec` systems.


    Main Features:

    - Powerful web interface

    - +50,000 network susceptibility tests

    - Simultaneous analysis of multiple hosts

    - Ability to quit, pause, and resume analysis tasks

    - False positive management

    - Scheduled scans

    - Creation of graphics and statistics

    - Exports test results to plain text, `XML`, `HTML`, or `LateX`

    - Strong `CLI` available

    - Fully integrated with the `Nagios` monitoring software


    The web interface makes it possible to work from any operating system. However,
    there is also a command-line interface suitable for `Linux`, `Unix`, and `Windows`
    operating systems. The free version can be gotten from the `OpenVAS` website.
    However, a commercial corporate license is also available on the `Greenbone Security`
    (parent) Web site.


    ## 6. IronWASP


    If you''re thinking about ethical hacking, `IronWASP` is another great tool. It''s
    free, open source and cross-platform and perfect for anyone who needs to monitor
    their web servers and public apps.


    One of the most interesting aspects of `IronWASP` is that you do not have to be
    an expert to manage its main functions. Everything is based on a graphical interface,
    and complete analysis can be done in just a few clicks. If you start with ethical
    hacking tools, this is a great way to get started. Some of its key features include:

    - Powerful graphical interface

    - Ability to record the web analytic sequence

    - Exports the results in `HTML` and `RTF` format

    - Over 25 different vulnerabilities in the web

    - Wrong positive and negative management

    - Full support for `Python` and `Ruby` for the script engine

    - Can be extended with modules designed in `C #`, `Ruby` and `Python`


    Hosted platforms: `Windows`, `Linux` with `Wine` and `MacOS` with `CrossOver`


    ## 7. Nikto


    `Nikto` is another favourite known as part of `Kali Linux Distribution`. Other
    popular Linux distributions, such as `Fedora`, are already shipping with `Nikto`,
    which is available in their software repositories.

