  trans: '

    但恶意软件是如何感染服务器和 POS 设备的？如果我们相信安全研究人员的话，该漏洞可能源于内部。在没有内部破坏者的情况下，可能是一个疏忽的目标员工（可能来自
    IT 部门）被官方电子邮件中的一个链接误导——该邮件显然来自他的银行、经理或管理层，或者是联系人——去访问了一个极吸引力的网站，从而泄露了重要的权限信息，这些信息随后被传递给了黑客。又可能是有人说服了一位热心的员工从
    USB 盘中打印一份小文档。


    现在，银行家正在通过打电话和调查人员，从毫无防备的受害者身上收集更多具有破坏性的信息，作为第二波社会工程攻击。


    尽管存在高明的黑客（例如最终将他们整合到 Target 设备的恶意软件作者），但最薄弱的环节、因此也是对黑客来说最可行的方法就是那些鲁莽的个人。


    2008 年，1000 万名毫无防心的美国人的信用卡信息被盗。2012 年这个数字是 1500 万。在 2013 年的最后一个月，超过了 1 亿。现在智者有了一些规范准则：


    **不要**分享你的社会安全号码，特别是不要通过电话或电子邮件，并且不要将其作为标识符。通常情况下，只需将其交给你的雇主、你的金融机构和当局即可。


    在少数例外情况下，当你在那里时，**不要**点击电子邮件嵌入的链接——尤其是来自你不认识的人的链接。不点击认识的人提供的链接可能是一个好主意。在浏览器中手动输入
    URL 或域名信息更安全。不要与第三方共享密码。即使是技术支持也不需要这些。不要成为那个在打印他人简历时不小心感染整个网络的热心人。


    有一些课程专门培训社会工程学领域的道德和不道德盗徒，并有像 Hadnagy 的《社会工程学：人类盗窃艺术》等此类主题书籍。成千上万个不道德的人学习了这些课程，现在正在寻找像你这样热心的灵魂。采取预防措施，不要让社会工程工程师骚扰你。


    # 黑客是如何工作的


    黑客或道德黑客使用入侵测试技术来测试公司的 IT 安全并识别漏洞。IT 安全人员利用这些入侵测试的结果来修复漏洞、提高安全性并减少业务风险因素。


    渗透测试绝不是一项偶然的任务。这需要大量的计划，包括管理层对进行测试的明确批准，然后运行尽可能安全的测试。这些测试通常涉及攻击者实际破入网络时使用的相同技术。


    ## 背景和所需的培训


    白帽黑客涉及大量的问题解决以及沟通技巧。白帽黑客还需要智能与常识之间的平衡、强大的技术和组织能力、恰当的判断力以及在压力下保持冷静的能力。


    同时，白帽黑客必须像黑帽黑客一样思考，具备他们邪恶的目标、能力和狡猾的行为。一些最好的白帽黑客是以前黑帽黑客，由于各种原因决定离开犯罪生活，并以积极（合法）的方式使用他们的技能。


    白帽黑客没有官方的培训标准——任何组织都可以对这项工作设定自己的要求——但信息安全、计算机科学甚至数学的学士或硕士学位可以提供坚实的基础。


    对于那些没有所属大学的人来说，军事训练（特别是情报领域）可以帮助确保你的简历获得人力资源经理的关注。对于想要或需要雇用已获得安全审查人员的雇主来说，兵役也是一项资产。


    ## 相关认证


    许多安全认证和安全黑客证书可以使候选人更容易入门，即使没有很多实践经验。


    欧洲委员会颁发的 `CEH` 认证（认证道德黑客）是一个推荐的起点。`CEH` 是一个厂商中立的称号，获得 `CEH` 认证的的需求很大。根据 PayScale
    的数据，道德黑客的平均工资接近 80,000 美元，上限可以超过 100,000 美元。在顾问方面，欧洲委员会表示，`CEH` 专业人员每个合同或短期任务可以获得
    15,000 至 45,000 美元的报。


    中级 `CEH` 证书侧重于系统破解、枚举、社会工程学、SQL 注入、木马、蠕虫、病毒和其他形式的攻击，包括拒绝服务。申请人还必须具备密码学、渗透测试、防火墙、蜜罐等深入知识。


    欧洲委员会建议没有以前工作经验的候选人参加为期五天的 `CEH` 培训。要通过课程，参与者必须具备 `Windows` 和 `Linux` 系统管理知识、`TCP
    / IP` 知识以及虚拟化平台的基础。然而，也有自学的机会帮助候选人通过所需的个人考试。请注意，`EU Council` 要求申请人至少具有两年信息安全经验，并支付
    100 美元的注册费。


    成为一名认证的白帽黑客也意味着留在黑客行为的一侧，绝不进行非法或不道德的攻击，并始终保护他人的产权。作为认证程序的一部分，申请人必须同意 `EC 代码准则`
    并绝不接触黑客或恶意活动。


    除了 `CEH` 之外，`SANS GIAC` 程序值得关注。该组织到目前已提供了 81,000 多份参考。从 `GIAC Cyber Defense Forums`
    开始的候选人可能更好地完成活跃、受尊重且全面的安全培训。`GIAC Penetration Tester` (`GPEN`) 以及 `GXPN` 是对于职业黑客的显著论据。


    另一组道德黑客认证来自 `mile2`。该组织的网络安全认证路线图包括认证漏洞评估员（`CVA`），然后是认证专业道德黑客（`CPEH`）、认证渗透测试工程师（`CPTE`）和认证渗透测试高级顾问（`CPTC`）。此外，符合条件的美国退伍军人可以使用他们的
    GI 法案福利获得网络安全认证。


    ## 取证科学中的相关认证


    对于在信息安全领域工作的人来说，对计算机取证感兴趣总是建议的。对安全调查部分感兴趣的人，可以继续查看 `EC-Conseil 认证列表`，然后讨论计算机入侵取证调查员（`CHFI`）认证。


    `CHFI` 侧重于取证调查过程并使用适当的工具和技术获取证据和计算机数据。作为 `CHFI` 认证培训的一部分，候选人还学习了如何恢复删除的文件、解码密码、分析网络流量以及使用各种取证调查工具收集信息。


    其他值得的取证证书包括取证认证的 `GIAC 取证分析师` (`GCFA`)、取证技术人员以及高科技犯罪网络的计算机犯罪研究员。


