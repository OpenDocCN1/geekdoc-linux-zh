    对道德黑客行为的常规观察以及 Mainebiz 的从业者 David Jacquet 展示展示了道德盗版的兴起，并解释了为什么这些人需求量巨大。令人痛苦的问题在于白、灰、黑之间的界限。黑客世界是如此精确、专业且神秘。公司如何确保他们邀请攻击其网络的黑客真的是符合道德规范的？公司如何知道发现的任何漏洞已报告给客户？


    推测，这关乎声誉和信任。同时，这是一个相当困难的假设。


    自动化工具现在主宰着互联网。你可以找到一些来扩展社交网络，另一些自动回复邮件，甚至还有机器人帮助你的在线客户。当然，黑客技术也在进化：今天有很多自动化的 `OSINT`
    工具可以帮助任何人进行安全调查和信息检测，而这在 20 年前是不可能的。


    # 你不应该错过的 15 道德黑客工具


    1. `John the Ripper`

    2. `Metasploit`

    3. `Nmap`

    4. `Wireshark`

    5. `OpenVAS`

    6. `IronWASP`

    7. `Nikto`

    8. `SQLMap`

    9. `SQLNinja`

    10. `Wapiti`

    11. `Maltego`

    12. `Air Cracking ng`

    13. `Reaver`

    14. `Ettercap`

    15. `15th screen`


    在过去的几十年里，很少有安全专家进行黑客测试和道德入侵测试。现在几乎任何人都可以报告安全事件。使用道德黑客工具，你可以分析、搜索并发现公司的漏洞和弱点，以提高系统和应用程序的安全（正如几周前发布的关于
    wild state 的 `CVE` 文章描述的那样）。


    现在，我们将检查现代安全研究人员使用的最佳道德黑客工具。我们编译了一些著名的入侵测试工具，以帮助你在安全调查的早期阶段工作。在这里你将找到似乎一直存在的经典工具，以及你可能并不熟悉的新工具。


    ## 1. John the Ripper


    `John the Ripper` 是历史上最著名的密码破解器之一。它也是测试操作系统密码安全性或对其进行远程监控的可用最佳安全工具之一。


    这个密码劫持程序会自动检测几乎所有密码使用的加密类型，并据此更改密码测试算法。这使其成为几种流行的密码黑客工具之一。史上最聪明的工具。


    这个道德黑客工具使用暴力破解技术解密密码和算法，例如：

    - `Des`, `MD5`, `Blowfish`

    - `Kerberos AFS`

    - `Hash LM` (Lan Manager)，Windows `NT / 2000 / XP / 2003` 中使用的系统

    - `MD4`, `LDAP`, `MySQL`（带有第三方模块）


    另一个优势是 `JTR` 开源、跨平台，并完全适用于 `Mac`、`Linux`、`Windows` 和 `Android`。


    ## 2. Metasploit


    `Metasploit`是一个开源网络安全项目，使信息人员可以使用各种渗透测试工具检测远程软件的安全漏洞。它还作为模块开发的开发平台。


    该项目最著名的成果之一是 `Ruby` 的 `Metasploit` 框架，它可以让你轻松开发、测试和运行漏洞。该框架包含了许多安全工具，允许你：

    - 运行检测黑客的系统

    - 执行安全漏洞扫描

    - 运行远程攻击

    - 列出网络和主机


    `Metasploit` 提供了其软件的三个版本：

    - `Pro`：入侵测试和 IT 安全团队的理想选择。

    - `Community`：供 `Infoec` 小企业和学生使用。

    - `Framework`：应用程序开发者和安全研究人员的最佳选择。


    支持的平台有：

    - `Mac OS X`

    - `Linux`

    - `the window`


    ## 3. Nmap


    `Nmap`（Network Mapper）是一个免费、法的开源安全工具，允许 `Infosec` 专家管理和监控本地及远程主机的网络和操作系统的安全性。


    尽管它是最老的安全工具之一（于 1997 年引入），但它仍在积极更新，并每年接收新的增强。它也被认为是市场上效率最高的网络映射工具之一，以其在所有安全调查中提供全面结果的速度和效率而闻名。


    你可以用 `Nmap` 做什么？

    - 安全设备审计

    - 识别远程主机上的开放端口

    - 网络映射和枚举

    - 发现每个网络中的漏洞

    - 对域名和子域名启动广泛的 `DNS` 查询


    支持的平台有：

    - `Mac OS X`

    - `Linux`, `OpenBSD` 和 `Solaris`

    - `Microsoft Windows`


    ## 4. Wireshark


    `Wireshark` 是免费的开源软件，让你实时分析网络流量。凭借其检测技术，`Wireshark` 因能够检测任何网络中的安全问题并高效解决常见的网络问题而获得广泛认可。


    检测网络允许你以人类可读的格式捕捉并读取结果，更容易识别潜在问题（如低延迟）、威胁和漏洞。


    主要功能：

    - 保存扫描结果供离线查看

    - 数据包浏览器

    - 强大的图形界面

    - 丰富的 VoIP 分析

    - 检查并解压缩 gzipped 文件

    - 读取其他捕获文件格式，包括：`Sniffer Pro`, `tcpdump` (`libpcap` ), `Microsoft Network Monitor`,
    `Cisco Secure IDS iplog` 等。


    支持的网络端口和设备：`Ethernet`, `IEEE 802.11`, `PPP / HDLC`, `ATM`, `Bluetooth`, `USB`,
    `Token Ring`, `Frame Relay`, `FDDI`。

    协议解密包括但不限于：`IPsec`, `ISAKMP`, `Kerberos`, `SNMPv3`, `SSL / TLS`, `WEP`, 和 `WPA
    / WPA2`。

    将结果导出为 `XML`, `PostScript`, `CSV` 或纯文本格式。


    `Wireshark` 支持多达 2000 种不同的网络协议，并在所有主流操作系统上免费，包括：

    - `Linux`

    - `Microsoft windows`

    - `Mac OS X`

    - `FreeBSD`, `NetBSD`, `OpenBSD`


    ## 5. OpenVAS


    `OpenVAS`（也称为“Nessus”）是一个开源网络扫描器，用于检测所有主机的远程漏洞。作为最流行的网络弱点扫描器之一，深受 `DevOps` 和 `Infosec`
    系统管理员及专业人员的喜爱。


    主要功能：

    - 强大的 Web 界面

    - +50,000 网络敏感性测试

    - 同时分析多个主机

    - 退出、暂停和恢复分析任务的能力

    - 误报管理

    - 计划扫描

    - 创建图表和统计数据

    - 将测试结果导出为纯文本、`XML`, `HTML` 或 `LateX`

    - 提供强大的 `CLI`

    - 与 `Nagios` 监控软件完全集成


    Web 界面使得从任何操作系统工作成为可能。然而，也有适用于 `Linux`、`Unix` 和 `Windows` 操作系统的命令行界面。免费版本可以在 `OpenVAS`
    网站获取。此外，`Greenbone Security`（母公司）网站也提供商业企业许可。


    ## 6. IronWASP


    如果你在考虑道德黑客，`IronWASP` 是另一个很棒的工具。它是免费、开源跨平台的，非常适合任何需要监控其 Web 服务器和公共应用程序的人。


    `IronWASP` 最有趣的的方面之一是，你不需要成为专家就能管理它的主要功能。一切都基于图形界面，只需点击几次即可完成完整分析。如果你从道德黑客工具开始，这是一个很好的入门方式。它的一些关键功能包括：

    - 强大的图形界面

    - 记录 Web 分析序列的能力

    - 将结果导出为 `HTML` 和 `RTF` 格式

    - Web 中超过 25 种不同的漏洞

    - 误报和漏报管理

    - 完全支持用于脚本引擎的 `Python` 和 `Ruby`

    - 可以用 `C #`, `Ruby` 和 `Python` 设计的模块进行扩展


    托管平台：`Windows`, `Linux` (带 `Wine`) 和 `MacOS` (带 `CrossOver`)


    ## 7. Nikto


    `Nikto` 是另一个受欢迎的工具，作为 `Kali Linux 发行版`的一部分。其他流行的 Linux 发行版（如 `Fedora`）已经配备了 `Nikto`，它可以在其软件仓库中找到。


    '
- fmt: '

    This security tool is useful for scanning Web servers and performing various test
    types on the specified remote host. The clean and simple command-line interface
    makes it easy to start vulnerability testing on your target, as shown in the screenshot
    below:


    The main features of Nikto include:

    - Detects standard installation files on each operating system

    - Recognizes outdated software applications.

    - Run the XSS vulnerability tests

    - Starts brute-force attacks based on a warning

    - Exports the results to text, CSV or HTML files

    - Bypassing the Intrusion Detection System with `LibWhisker`

    - Integration with the `Metasploit Framework`


    ## 8. SQLMap


    `SQLmap` is a cyber security tool developed in Python that allows security researchers
    to run SQL injection tests on remote hosts. With `SQLMap`, you can discover and
    test different types of SQL-based vulnerabilities to strengthen your applications
    and servers or report vulnerabilities to different companies.


    The SQL injection techniques include:

    - UNION is based on a query

    - blind based on time

    - blind based on boolean

    - based on the error

    - stacked queries

    - outside the band


    Main features:

    - Supports multiple database servers: Oracle, PostgreSQL, MySQL and MSSQL, MS
    Access, DB2 or Informix.

    - Automatic code entry

    - Password recognition

    - Password cracking based on a dictionary

    - Enumeration of users

    - Get password hashes

    - View user rights and databases

    - Increase database user rights

    - Information about the dump table

    - Run Remote SQL SELECTS


    ## 9. SQLNinja


    `SQLNinja` is another SQL vulnerability scanner that ships with the Kali Linux
    distribution. This tool is intended for targeting and running web applications
    that use `MS SQL Server` as the primary database server. `SQLNinja` was written
    in Perl and is available in several Unix distributions on which the Perl interpreter
    is installed. It is supported on the following operating systems:

    - Linux

    - Mac OS X and iOS

    - FreeBSD


    `SQLninja` can be executed in different modes, eg.

    - Test mode

    - Detailed mode

    - Remote fingerprint database mode

    - Brute force attack with a word list

    - Direct hull and inverted hull

    - Scanner for outgoing ports

    - Invert the ICMP shell

    - DNS Tunnel Shell


    ## 10. Wapiti


    `Wapiti` is a free Python open source command line vulnerability scanner. Although
    not the most popular tool in the field, it can detect security vulnerabilities
    in many web applications.


    Using `wapiti`, you can discover security holes, including:

    - XSS attacks

    - SQL injections

    - Injections of XPath

    - XXE injections

    - CRLF injections

    - Fake a server-side request


    Some other features include:

    - Works in verbose mode

    - Possibility to stop and continue analyzes.

    - Highlights vulnerabilities in the terminal

    - Generate reports and export them to HTML, XML, JSON and TXT

    - Enable and disable multiple attack modules

    - Clears the parameters of some URLs

    - Exclude URLs during an attack

    - Ignore the SSL certificate validation

    - JavaScript URL Extractor

    - Set a time limit for large scans

    - Sets custom HTTP and user agent headers


    ## 11. Maltego


    `Maltego` is the ideal tool for collecting information and recognizing data during
    the initial analysis of your goal.


    In this case, relationships between people, names, phone numbers, e-mail addresses,
    companies, organizations, and social network profiles can be correlated and determined.


    In addition to online resources such as `whois` data, `DNS` records, social networks,
    search engines, geolocation services, and online API services, this can also be
    used to investigate the correlation between Internet infrastructures. including:

    - Domain name

    - DNS server

    - Netblocks

    - IP addresses

    - Folder

    - Web pages


    The main features include:

    - Graphical surface

    - Analyze up to 10,000 objects per diagram

    - Extensive correlation possibilities

    - Real-time data exchange

    - Graphical generator for correlated data

    - Exports graphics to `GraphML`

    - Generate entity lists

    - Can reproduce (copy and paste) information


    This application is readily available for Windows, Linux and Mac OS. The only
    software requirement is the installation of `Java 1.8` or higher.


    ## 12. Air Crack-ng


    `Air Crack-ng` is a respected home security and enterprise security security suite.
    It provides full support for `802.11 WEP` and `WPA-PSK` networks and captures
    network packets. He then analyzes them and uses them to interrupt the wifi access.


    `AirCrack-ng` offers old-school security professionals an elegant terminal-based
    interface and some other interesting features.


    Main features:

    - Complete documentation (wiki, manpages)

    - Active Community (forums and IRC channels)

    - Supports WLAN detection of Linux, Mac and Windows

    - Starts PTW, WEP, and fragmentation attacks

    - Supports WPA migration mode

    - Fast cracking speed

    - Support for multiple wireless cards

    - Integration with third-party tools


    As a bonus, many Wifi Audit tools are included, including:

    - `Air Force Base`

    - `Aircrack`

    - `airdecap-ng`

    - `airdecloak-ng`

    - `airdriver-ng`

    - `aireplay-ng`

    - `Air-ng`

    - `airodump-ng`

    - `airolib-ng`

    - `AirServ-ng`

    - `airtun-ng`

    - `easside-ng`

    - `paquetforge-ng`

    - `tkiptun-ng`

    - `Wesside-ng`

    - `airdecloak-ng`


    ## 13. Reaver


    `Reaver` is a great open source alternative to `Aircrack-ng` that lets you check
    the security of any Wi-Fi network with `WPA / WPA2` passwords. It uses brute force
    Wi-Fi attack techniques such as `Pixie''s dust attacks` to destroy WiFi-protected
    installations due to common security vulnerabilities and vulnerabilities in Wi-Fi.


    Depending on the configuration of the wireless security on the router, it may
    take between 3 and 10 hours for the effective brute force to reach a cracking
    result.


    Until recently, the original version of `Reaver` was hosted in `Google Cloud`.
    After the release of version `1.6`, a forked community edition was released in
    `Github`. Some of the main features include:

    - Build up dependencies: essential construction

    - `libpcap-dev`

    - Runtime dependencies

    - `Pixiewps` (required for Pixiedust Attack)


    It works well on most Linux distributions.


    ## 14. Ettercap


    `Ettercap` is a network receiver and packet sniffer for LANs. It supports active
    and passive scanning as well as various protocols, including encrypted protocols
    such as `SSH` and `HTTPS`.


    Other features include network and host analysis (such as the fingerprint of the
    operating system) and network manipulation over established connections. This
    makes it a proper tool for testing security attacks. Interceptor type.


    Main Attributes:

    - Active and passive protocol analysis

    - Filters depend on IP source and destination, Mac and ARP addresses

    - Inject data into existing connections

    - Protocols based on `SSH` and `HTTPS` encryption

    - Smells on long-distance traffic in the `GRE` tunnel

    - Expandable with plugins

    - Supported protocols are `Telnet`, `FTP`, `Imap`, `SGB`, `MySQL`, `LDAP`, `NFS`,
    `SNMP`, `HTTP` etc.

    - Determine the name and version of the operating system

    - Can terminate established LAN connections

    - DNS hijacking


    ## 15. Canvas


    `Canvas` is a great alternative to `Metasploit` and offers more than 800 exploits
    to test remote networks.


    Its main features include:

    - Remote networking

    - To target different types of systems

    - Target of selected geographic regions

    - Take screenshots of remote systems

    - Download passwords

    - Change the files in the system

    - escalate permissions to gain administrator access


    With this tool you can also use its platform to write new exploits or use its
    famous shellcode generator. It also includes an alternative to `nmap` called `scanrand`,
    which is especially useful for scanning ports and detecting hosts in medium to
    large networks.


    Supported platforms are:

    - Linux

    - MacOSX (requires `PyGTK`)

    - Windows (requires `Python` and `PyGTK`)


    Software vendors are leveraging automated ethical hacking tools and intrusion
    testing utilities to increase system security on a daily basis.

    '
