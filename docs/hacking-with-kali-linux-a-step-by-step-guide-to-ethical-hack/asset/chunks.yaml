    如果黑客对你的业务发起网络攻击，会发生什么？他们会成功吗？你还能轻松访问公司的机密信息吗？还是说他们的尝试会失败？信不信，网络安全不仅仅关乎大企业。这是小企业也需要警惕的事。。


    请考虑以下关于小型企业安全的统计数据：


    - 43% 的网络攻击针对的是小型企业。

    - 仅 14% 的小型企业认为他们缓解网络风险、漏洞和攻击的能力非常有效。

    - 60% 的小型企业在遭受网络攻击六个月内停止了运营。

    - 48% 的数据泄露是由恶意行为造成的。其余的由人为错误或系统故障引起。


    如果你拥有一家小型企业，你就不能忽视这些统计数据。你不希望自己的业务因为没有采取适当的保护措施而遭受损失。


    你付出了这么多努力，不应该让公司受到黑客的威胁，对吧？在本文，你将了解到为什么关注网络安全如此重要。你还将学习如何维护和保护你的业务。


    # 为什么小型企业应该担心网络安全？


    我知道你在想什么。你认为你的业务太小了，没人会想黑它。很容易想象，一家小型企业永远不会面临网络安全问题。这很有道理，对吧？如果你听到某公司被黑，那通常是像
    `Target` 或 `Sony` 这样的大品牌。


    然而，这些并不是唯一的目标。


    这可能很难置信，但黑客也会针对小型企业。你只是没有听到相关消息，因为媒体不会谈论涉及小型企业的盗版或攻击。黑客攻击小型企业有几个原因，包括：


    - **小型企业不重视网络安全**：让我们诚实吧。大多数小型企业主并不重视网络安全。他们认为自己太小，不会吸引黑客的注意。然而，这是小型企业被黑客的主要原因之一。黑客知道大多数小型企业主没有在网络安全上投入资金。为什么？因为小型企业主认为他们没有什么值得被偷的。这使其成为一个简单的目标。黑客很有可能正在寻找某些东西：客户的支付信息。


    - **他们拥有黑客想要的信息**：你的公司可能没有 `Target` 或 `Starbucks` 那么大……但没关系。你为你的产品和服务付费了，对吧？这意味着你拥有黑客想要的东西。你有客户的支付信息。你有来自员工的信息。


    优秀商业局协会揭露，7.4% 的小型企业主曾被欺骗。作为企业主，你拥有关于客户和员工的信息。这些信息对黑客来说就像黄金一样珍贵。如果你的系统不安全，这些黑客可能会获取支付信息和社会安全号码。你必须确保这些信息得到保护。


    # 如何保护你的小型企业免受网络攻击


    所以我已经向你展示了，小型企业并不意味着你就不可能被黑客攻击。但如果你很聪明——我知道你是——你可能在想如何保护你公司的信息。这就是本文下一部分的内容。


    ## 购买网络保险


    保险不仅仅是为了你的汽车、房子或医疗账单。你也可以为你的业务购买保险。事实上，每家企业都应该购买某种商业保险。


    但还有网络安全保险。如果你是一家小型企业，你需要它。当然，我们都希望不会发生安全泄露。但希望是不够的。你必须确保你的业务受到了保障。


    网络责任保险旨在防止你的业务遭受各种网络安全威胁。在发生安全泄露和公司责任之后，你可能被要求向法院支付巨额资金。这会让大多数小型企业陷入瘫痪。如果你有网络责任保险，你就不必担心这个问题。如果你购买了正确的保险类型，你的法律费用将被涵盖。


    ## 制定密码策略


    许多网络攻击的发生是因为你的员工使用的密码太简单。如果你的团队没有经过培训，他们可能会使用太容易破解的密码。这种情况经常发生。


    出于这个原因，你需要创建并建立一个有效的密码策略。你可能无法阻止任何攻击，但你完全可以减慢顽固黑客的速度。如果你的系统不容易被破解，它可以让攻击者望而却步。你会转向另一个不像你这么聪明的小企业主！


    幸运的是，这很容易。你需要确保你的团队成员的密码包含大写字母和小写字母、数字和符号。是的，我知道这可能很痛苦，但业务的安全是值得的。此外，你必须要求员工每月重置一次密码。


    ## 使用虚拟数据室 (VDRs)


    虚拟数据室是保护你业务信息的极佳方式。它们方便了你的员工进行敏感数据的交换。虚拟数据室是一个公司可以在其中存储数据的在线库。它们通常用于财务交易。对于攻击者来说，访问存储在
    `VDR` 中的信息将非常困难。


    公司可以在 `VDR` 中存储多种类型的信息：


    - 财务信息

    - 法律文件

    - 税务文件

    - 关于知识产权的信息


    VDR 是确保你的敏感信息安全的绝佳方法。


    - **与专家交流**

    是的，大多数企业都避免这样做。但你不应该这样做。聘请计算机安全顾问的费用可能看起来有点贵。但这是一项伟大的投资。


    如果你的家里漏水，水积聚在浴室里，你会尝试自己修理吗？可能不会。你可能会找工人，对吧？为什么？因为像我们大多数人一样，你并不懂管道。同样的原理适用于计算机安全。


    如果你担心网络安全（你确实应该担心），请考虑咨询专家。


    '
- fmt: '

    If you own a small business, you need to take your cyber security seriously. Do
    not assume that your business is not an end just because you''re not a big company.


    You owe it to your team and your customers to ensure the safety of your company.
    Preventing cyber attacks should be amongst your top priorities. If you take the
    right action, you do not have to worry about putting your business at risk.


    Businesses of all sizes are now the target of cybercriminals. According to Verizon
    2018 DBIR, 58% of victims of data breaches are small businesses. In addition,
    it is shocking that, according to the National Cyber Security Alliance, 60% of
    small businesses are closed within six months of an attack. What makes these small
    businesses vulnerable to cyber attacks? It is probably the lack of resources due
    to the limited budget and the false conviction that only large organizations are
    attacked by pirates.


    However, businesses of all sizes must defend themselves against cyber attackers.
    I''ve developed some useful preventative measures to protect your business from
    cyberattacks.


    ### Train your employees

    Your employees are your greatest tool, but also the biggest security risk. Your
    main action should therefore be to make your employees aware of safety. This helps
    to minimize cases of accidental or intentional data loss. An important point to
    keep in mind is that training your staff is not a one-time task. This should be
    carried out regularly to ensure that your employees are kept up to date on the
    latest cyber threats. This helps them cautiously handle security vulnerabilities
    and threats.


    ### Manage your passwords

    Your passwords are the access to your company''s confidential information. It''s
    important to follow some basic rules for creating and managing passwords for your
    business.


    - Always change the default passwords to very unique passwords

    - Avoid creating and using the same password for different accounts

    - Make sure your passwords are securely stored. Use a `password manager`. Never
    write your passwords on paper that others have access to.

    - Follow the instructions to create a strong password. Use a concoction of uppercase
    and lowercase letters, numbers, symbols, and so on.


    ### Keep your technology in shape

    The operating system and enterprise system applications must be up-to-date, as
    this ensures the installation of the latest security patches. In addition, a firewall
    and virus protection must be installed on each system. Make sure they are both
    active, up-to-date, and installed with the correct settings. Microsoft operating
    systems have a standard firewall. You have to activate it. However, it is highly
    recommended to invest in reliable and advanced PC antivirus software. After all,
    buying an antivirus program costs much less than being a victim of a cyberattack.


    ### Keep backups to limit losses

    With the increasing number of ransomware attacks, the importance of data protection
    became clear. It''s best to keep a copy of your data instead of taking the risk
    of paying a ransom to the hackers. A business can resume normal business after
    an attack if a backup is available. Perform regular backups of your company data
    as this facilitates recovery from a current point in time. Backups must always
    be kept on a separate system.


    ### Have periodic tests for your coding

    The code and hosting of your website is an important aspect of the security of
    your business. Have your website completely tested by your internal information
    security team for security errors or rent one. Incorrect or outdated code can
    help hackers access your website and cause damage. Also, make sure that your website
    hosting is from a reliable hosting company. Remember to get a security certificate
    for your website because it protects harmful content on the web at a reasonable
    price.


    ### Obtain an Endpoint Security Solution (EPS)

    Complete endpoint protection gives you peace of mind that you have control over
    device, application, and web security. An `EPS` file provides protection for all
    endpoints in your enterprise that attackers use to begin malware. `EPS` preventive
    solutions for small and medium businesses require a small investment. As a business,
    however, you must consider the value of the security that such a solution offers.


    ## WHAT TO DO IN CASE OF INFRINGEMENTS?


    If you have already been cyber-attacked, you must do the following:


    ### Do a check of everything

    First of all. You need to know the type of data lost or stolen during the data
    breach. Is it a generic form of data such as addresses, names, etc.? Is it more
    sensitive data such as e-mail addresses, credit / debit card numbers? Or are the
    lost data extremely sensitive, such as: For example, passwords, online banking
    credentials, credit / debit card security codes, etc.?


    ### Make the changes immediately. Take action

    Depending on the type of data loss, you need to take action. For example, if passwords
    are lost, you must immediately change all system credentials, the `Web`, and other
    credentials. Ensure that you do not repeat the passwords for two accounts and
    that they are completely different from the lost accounts. To add an additional
    level of protection, you can use `two-factor authentication`. Even if a cyber
    thief has the correct password, he can only enter if the security code is generated
    by `two-factor authentication`. If the lost information contains online banking
    credentials, it is important to notify the bank or the card issuing authority
    as they may suspend your card to prevent unauthorized transactions. In addition,
    they could release a new card to ensure your safety.


    ### Inform about the violation

    Your customers should be aware of the violation of their business. So once you
    know that your business data has been compromised, share it with your customers.
    Tell them what kind of data has been compromised, what the company is doing to
    limit the losses, and what security measures can be taken.


    ### Perform a gap check

    It is essential to conduct a post-breach audit to identify the root cause (eg
    inadequate security at the terminals) and identify the cause of the violation.
    You can hire an `InfoSec` reviewer to help you understand the depth and depth
    of the attack, and provide recommendations for improving your data processing
    practices.


    ### Last but not least - do not panic

    Violations are certainly stressful events and panic is a natural reaction to such
    incidents. But I recommend that you do not panic. This will take a lot of time,
    which is better spent on planning actions.


    Since it is predicted that cybercrime will cost the world about $6 trillion by
    2021, it is necessary to consider the security practices outlined above for your
    company''s security.


    ## Cyber security for the whole family: Five surprising ways to get hacked by
    children and adults


    # PROTECTING YOUR FAMILY FROM CYBER ATTACKS


    Cyber security is a risk for children and adults. Learn how you can protect your
    family from identity theft and cyber-attacks at home and abroad.


    When you are online, you are visible around the world. With more than 10 billion
    devices connected to the Internet, there are plenty of hackers. In 2017 alone,
    179 million records were uncovered and today one in 15 people are victims of identity
    theft, including children.


    Do you have online accounts? `Wi-Fi` compatible devices? A social security number?
    In that case, it''s a good idea to pay attention to your back as hackers could
    choose you and your family. But do not panic for now. Knowing what to search for
    can drastically reduce the risk of cyberattacks.

    '
