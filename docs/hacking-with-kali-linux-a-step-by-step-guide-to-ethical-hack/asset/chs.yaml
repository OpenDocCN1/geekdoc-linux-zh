- "# Kali Linux 破解：道德黑客分步指南、计算机工具以及使用网络安全基础知识保护家庭和企业免受网络攻击\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n# 结论\n\n## 引言\n\n“黑客攻击”这个词让你感到恐惧吗？通常，黑客攻击赢得了负面声誉，并与网络攻击联系。但事实并非如此。如果这是你第一本关于黑客攻击的书，你将更熟悉黑客的世界。\n\
  \n“道德黑客”一词出现于 20 世纪 70 年代，当时美国政府雇用被称为“红队”的专家小组来攻击自己的计算机系统。黑客是指合法或非法进行攻击的网络专家。你进入计算机网络的安全系统以检索或收集信息。\n\
  \n技术和互联网促进了病毒、防病毒、黑客攻击和道德黑客攻击等网络问题的产生。盗版是对硬件和软件计算机系统的修改。非法入侵计算机系统是犯罪行为。近期，由于黑客攻击的热潮开启了多门道德黑客攻击课程。\n\
  \n\n\n\n道德黑客技术是网络安全不可或缺的一部分。全球化导致组织日益庞大的业务活动引发了许多安全担忧，如果这些问题被忽视，可能会导致系统完整性的巨大损失，从而引发数据窃取。每一个成功的组织都非常理解信息安全的重要性。因此，经过认证的道德黑客在整个场景中具有至关作用。\n\
  \n# 什么是道德黑客？\n\n我们都知道并听过黑客行为，它本质上是臭名昭著的。恶意黑客破坏并利用系统。道德黑客也做同样的事情，但出于合法且具有建设性的目的，即寻找系统中的漏洞并保护其免受攻击和潜在威胁。道德黑客提供信息安全保障，并帮助企业提高系统安全性。\n\
  \n# 为什么组织需要道德黑客\n\n持续的网络攻击已经造成了巨大的数据损失和高昂的恢复成本。CE-Conseil 作为一家领先的网络安全认证计划的 IT 机构，自\
  \ 9/11 恐怖袭击以来首次引入了道德黑客的概念。到为止，道德黑客在混合计算世界中获得了认可，因为它对于保护系统和网络更有用。道德黑客的思维与恶意黑客一样，通过识别威胁和漏洞来阻止非法活动。\n\
  \n对安全专家或认证道德黑客的需求比以往任何时候都迫切。网络威胁让道德黑客时刻保持警惕，以有效保护网络和系统。没有任何公司能够负担起丢失机密数据的损失。尽管道德黑客的概念最近已进入视野，但安全担忧已经出现，组织也对此进行了纠正。然而，由于组织的活动变得越来越重要，现在迫切需要弥补这些缺陷。\n\
  \n在整个行业中，道德黑客可以成为企业的救星。道德黑客帮助组织完成以下工作：\n\n- 备份系统，通过构建防止非法访问的万无一的计算机系统保护信息不受攻击\n\
  - 道德黑客管理预防措施以防止黑客威胁\n- 创建安全意识\n- 定期进行网络测试以实现周期性防御\n\n如今，在线进行业务或个人活动并非没有深层挑战。用户现在开始访问其他网站和账户，以伪造重要信息以及收集数据。这种隐蔽行为被称为“黑客攻击”，必须制止！为了防止他人登录你的账户，你应该定期检查。这是道德黑客的工作。出于这个原因，全球对道德黑客技术培训的需求日益增长。\n\
  \n## 谁是道德黑客？\n\n在计算机术语中，带有不同目的进入他人账户的人被识别为戴着不同颜色帽子！在这方面，道德黑客是戴白帽的人。受过计算机黑客训练的人员主要功能是进入系统以验证现有计算机系统的安全性和保护。这些白帽黑客是计算机安全专家，经过训练可以渗透公司或个人的系统，这些系统包含了所有重要且极其敏感的信息。需要注意的是，此类外部系统看起来非常安全，但仍然面临着欺诈手段的危险。\n\
  \n为了接受这项活动，候选人接受道德黑客培训。公司使用其中一人或一个小组来验证系统的可靠性。当团队工作时，他们被称为红队或虎队。通过对黑客进行道德训练，他们学习了攻击系统的各种方法，并利用这些方法潜入漏洞并进行验证。许多组织现在都为黑客提供道德培训计划。\n\
  \n# 黑客的道德培训具有什么意义？\n\n许多公司仍然不服从需要道德黑客审查的系统。他们认为没有人会黑入他们的系统。无知可能会导致公司损失数百万美元。然而，如果系统没有经过专家检查而信息被坏人窃取，非常重要且关键的信息可能会落入他人手中。因此，聘佣受过认证黑客培训的专家或内部培训员工是非常必要的。这些个人帮助识别并解决系统中的问题，并保护数据不受欺诈使用。\n\
  \n当这些作弊者暴露给黑客时，他们还会攻击员工的文件并将病毒下载到系统中，导致整个网络关闭和受损。此类攻击的后果可能导致重要秘密信息的丢失。如果许多客户不再信任重要信息，对公司来说可能是代价昂的。这些只是聘佣接受过道德黑客培训的人员对公司及其员工健康至关重要的部分原因。毕竟，你的\
  \ IT 健康在你自己手中！\n\n随着计算机和互联网使用的增加，用户面临着越来越多需要注意的问题。道德黑客培训是为了保护网站免受操纵主要内容和敏感数据的欺诈尝试。\n\
  \n你想让你的公司拥有安全的系统吗？通过联系受尊敬的信息安全专家，保护他们免受想要窃取机密文件的入侵。你可以为 PCI 行业提供道德黑客、渗透测试、培训和咨询服务。了解更多关于它以及它能为你的业务做什么。\n\
  \n# 什么是信息安全专家？\n\n信息安全专家的另一个名称是计算机安全专家。这种专家有资格保护计算机系统免受危险。这些威胁可能是内部或外部的。除了私营公司，专家还为公共当局教育机构提供服务。\n\
  \n对这些专业人士的需求继续增长。事实上，计算机系统和网络的威胁正随着技术的发展而迅速进化。因此，技术人员必须进一步提高其知识。还需要扩展其工具、应用程序和有用系统的库。\n\
  \n基本的安全措施涉及密码控制。IT 安全专家可以要求公司成员频繁更改密码。这减少了未经授权访问机密程序、网络或数据库的机会。## 我应该保护业务免受什么侵害？\n\
  \n计算机网络最危险的威胁通常来自外部。专家为黑客设置防火墙。定期安装尝试入侵系统的自动报警程序。你甚至可以找到高科技程序，通过识别入侵者的 IP 地址来定位黑客。\n\
  \n计算机科学家提供的流行的 IT 服务是道德黑客和渗透测试。\n\n# 道德黑客与渗透测试 101\n\n合格的 IT 专业人员通常执行道德黑客。他们利用编程技能来理解计算机系统的弱点。当你发现不道德黑客出于个人原因滥用漏洞时，道德黑客会进行评估并发出，然后提出更改以加强系统。IT\
  \ 专业人员通过他们的道德黑客服务提供系统和信息安全。\n\n大多数计算机科学家将黑客行为视为纯黑客行为，因为他们总是利用计算机系统的知识植入或入侵它们。大多数业务主认为它是道德的，因为其目的是增加系统的安全性。\n\
  \n\n\n\n# 渗透测试与道德黑客攻击\n\n另一方面，渗透测试是对计算机系统进行的一种安全评估。人员会尝试破解系统。此项服务的目的是确定恶意个人是否能够进入系统。渗透测试可以检测出黑客进入系统后即可访问的程序或应用程序。许多企业和在线业务都提供渗透测试。这是被高度推荐的，因为修复敌对攻击对计算机系统造成的损害可能是昂贵的。\n\
  \n大多数公司都必须进行渗透测试。遵循标准最初可能看起来很难，但有很多公司拥有经验，可以满足各个层次的需求。\n\n## 理解道德黑客攻击\n\n如果你正在寻找道德黑客攻击的示例，请继续阅读！\n\
  \n这很有趣，因为发起一种基本上是道德层面的进攻性攻击的想法确实改变了人们对盗版的理解。人们倾向于立即将其与负面行为和意图联系，因为他们只知道负面影响。简而言之，大多数人会认为这几乎没有或积极的应用，但事实并非如此。当黑客技术被恰当使用时，它是好的！\n\
  \n作为改进个人或公司在线防御的手段，我们发现这种“恶意行为”非常有益。通过破坏或绕过在线系统或网络来暴露弱点以供未来改进是完全符合道德的（你也可以借此赚钱）。\n\
  \n## 道德黑客攻击示例\n\n道德黑客攻击的示例包括利用或打开网站以发现其弱点。然后报告你的结果并让相关人员修复这些漏洞。如果他们未来受到攻击，他们就会安全一些。事实上，它通过消除可能被用来利用的区域，为你做好了应对真实攻击任何威胁的准备。\n\
  \n道德黑客攻击的示例有很多，包括计算机运行初期的的一个案例。那时，美国空军利用它们来评估操作系统的安全性。通过这种方式，他们能够检测到诸如硬件、软件和流程安全等漏洞。他们发现，即使花费相对较少的精力，安全性也可以被绕过，入侵者会带走宝贵信息。\n\
  \n通过道德黑客攻击，他们能够防止此类事件的发生。负责此任务的人将情况视作他们真的是真正的敌人，并尽全力渗透系统。这样，他们就能准确地看到自己的系统有多安全。这可能是道德黑客攻击最伟例子之一，因为它获得了创建在线系统的负责者的认可。他们意识到这种措施的必要性，因为他们知道有很多人可以做同样的事情或对他们的系统造成同样的损害。\n\
  \n## 行业实践与防御\n\n在所有的道德黑客攻击示例中，你可能明确指的是今天使用的已知操作系统实践。这些操作系统的制造商在向公众展示产品之前会进行自己的道德黑客攻击。这是为了避免黑客可能的攻击。这是系统开发阶段的一种质量控制，以确保其操作系统向公众营销时，所有漏洞都得到了覆盖。道德黑客攻击是防御你宝贵的在线系统的一种非常有效的方法。利用`White\
  \ Hat`（白帽）黑客的能力和潜力，你可以对抗并防止真实黑客造成的损害。\n\n当人们第一次听到黑客攻击时，他们通常认为这种想法是负面的。事实上，黑客一直是为了利用网站或未保护或保护薄弱的系统来获取个人的利益。正因为如此，其他（通常是公司）想要改进其在线系统保护的人转向专业人士。这些专业黑客（有时被称为“白帽”）使用道德黑客攻击方法来加强对实际黑客威胁的防御。通过系统地“攻击”系统，他们可以快速识别漏洞，然后制定应急计划来阻止、防止或消除真实的黑客攻击。\n\
  \n## 道德黑客攻击方法论\n\n道德黑客攻击方法表明并非所有的黑客行为都是坏的。以道德方式进入系统以暴露真实盗版者或“黑帽”（由于意图不那么科学）可以利用的潜在漏洞，这有助于防止收入损失或声誉受损。事实上，许多公司现在寻求能够执行此任务的人员，因为他们理解对熟练黑客的唯一方法就是聘用另一个熟练的黑客！\n\
  \n对计算机系统有深入了解的人可以执行这些服务。考虑到道德黑客攻击方法涉及渗透在线系统，今天许多白帽可能拥有他们自己的黑帽经验！\n\n只要你的行为获得了系统所有公司的授权，你在黑客攻击过程中造成的破坏或干扰将对公司产生完全有益，前提是这些漏洞得到了跟踪和消除。\n\
  \n## 道德黑客的角色\n\n道德黑客要么是作为黑帽黑客成名的职业专业人士，要么是具有足够知识执行任务的真实公司员工。\n\n他们既不是好黑客也不是坏黑客，没有白帽或黑帽之分。最终，这关乎社会利益以及对其可能包含的敏感数据的保护。如果你有一个不完美的过去（黑帽），但决定为系统工作而不是反对它，那么你现在部署的服务将得到良好的照顾。\n\
  \n道德黑客攻击的方法是产生保护在线系统免受破坏性攻击的结果。你只关心保护你的资产和利益，只有当你像一个真正的绑架犯一样思考和行动时，你才能做到。\n\n这无疑是保护自己免受在线威胁的有效有效方法。如果你是一家公司，不要犹豫聘请一位拥有知识和技能对抗另一个黑客威胁的白帽黑客。另一方面，如果你自己攻击自己，你是否考虑过从事在另一方的工作的职业？\n\
  \n这一过程由被称为道德黑客或白帽的计算机和网络专家执行。这些个人分析并攻击公司的安全系统，以发现可以被黑客利用的漏洞。需要重要的是，与黑客不同，道德黑客获得了主管机构的许可，进一步测试其信息系统的安全性。破解者（Crackers）会给组织带来损害和损失，并影响信息系统的完整性、可用性和机密性。道德黑客的概念是如何产生的，它是如何运作的？\n\
  \n\n\n\n\n道德黑客领域在计算机世界已经存在很久。今天，由于计算机资源和互联网的可用性及其日益增加的使用，这一话题引起了广泛关注。IT 基础设施的增长和扩张为互动提供了另一个机会，吸引了大型企业和政府机构。这些机构希望充分利用技术来提高其客户的服务质量。例如，公司希望利用互联网进行电子商务和广告。此外，政府也希望利用这些资源向其公民发布信息。尽管他们希望利用这种新技术增强的潜力，但安全需求是必不可少的的。公司担心他们的计算机系统会被破解，未经授权的人员能够访问。另一方面，这些服务的潜在消费者和用户则担心他们被提供的信息的安全性。他们担心信用卡号、社会安全码、个人地址和联系方式等信息可能被入侵者或外部人员获取，并将其数据用于预期之外的其他目的。这扰乱了他们的隐私，而对于许多人（如果不是所有人）来说，这是不受欢迎的。\n\
  \n出于上述原因，机构一直在寻找解决和应对这个问题的方法。他们发现，限制和控制未经授权人员对安全系统威胁的最佳方法之一，是请独立的安全专家对系统实施安全措施。在这种方法中，黑客使用与入侵者相同的设备和技术，但他们不会破坏系统也不会偷取系统。他们评估系统，并通知所有者系统暴露的漏洞。他们还建议需要对系统进行哪些操作以使其更加安全。\n\
  \n正如我们上面看到的，道德黑客与安全性的增强紧密相连。尽管这对安全问题的增加有显著贡献，但仍有许多工作要做。获得绝对的安全是不可能的，即使它是危险且不受欢迎的，但为了计算机的安全也无能为力。\n\
  \n许多人读到道德黑客的优点将感到惊讶。对他们来说，这种概念并不存在，因为盗版被自动认为是不道德的或非法的。事实上，黑客行为通常涉及消除为人类保护和安全而设置障碍。当然，谈论此类行为的益处对人类来说是非常陌生的（至少在开始）。\n\
  \n最初，黑客本质上是指违反法律并访问某些人通常无法访问的信息。但生活从未像我们最初感知的那样非黑即白。这就是为什么很多人会对像 `IBM`、`Microsoft`\
  \ 和 `Apple` 这样的大型 IT 公司拥有一支大型黑客团队感到惊讶。是的，你读没错！\n\n然而，他们并没有违反相关法律。不，这类黑客是有正当理由的。他们被用作所有类型程序的测试员。基本上，每当一家公司提供程序时，它都会将其告知其黑客团队，然后由他们测试（`hack`）以确定程序中安全漏洞的数量。\n\
  \n你可以看到程序是否仍然可以被利用，然后将发现的弱点列表返回给程序员。这只是道德黑客的优点之一。程序随后可以被纠正或加强，并返回给黑客以确认是否仍然存在问题。\n\
  \n以上只是计算机盗版益处的一个例子。你知道吗，随着对黑客的需求增加，该主题的课程也正在提供中？随着世界日益依赖计算机，黑客或黑客组织可以造成的破坏达到了新的高度。大公司无法忽视这一点。\n\
  \n学习成为一名黑客可以带来一个大有广阔的职业，你可以为许多大公司之一工作。正如之前讨论的，有许多正当理由在“内部”进行道德黑客攻击。他们可以帮助公司节省数百万美元的潜在资金，并最大限度地降低破坏他们在客户和同事面前辛苦经营的声誉的风险。这不仅有利于公司，也有利于购买他们程序的人。\n\
  \n一个高效的黑客团队可以确保程序尽可能安全，可能阻碍任何黑客的工作，并经常迫使他访问更简单的目标。这确保了广泛程序很少被操纵，帮助保护世界各地人士的计算机隐私和完整性。\n\
  \n## 黑客 (HACKER)\n\n使用“黑客”（hacker）一词来指代恶意计算机专家是不恰当的。黑客是指具有高计算机素养的人，无论他如何使用它。黑客有三种：黑帽、白帽和灰帽。黑帽当然很常见；白帽是好黑客；而灰帽，正如其名所示，在两个阵营之间穿梭。\n\
  \n`USA Today` 对渗透测试员（`pen`）感兴趣，也被称为道德盗。他们越来越多地被公司和安全公司聘用，看看哪些方法有效，哪些无效。这篇文章提供了一个很好的总结。文章最有趣的部分涉及内部和外部黑客攻击客户办公室的相对成功率。专家说，他几乎在\
  \ 100%的时间内都能管理对公司内部系统的访问，成功率从 80% 到 90%。相反，当从防火墙另一侧开始时，强大的边界防御机制会将通过率降低 20 到 30%。不仅如此，它还表明近年来对边界防御的关注已取得成效。\n\
  \n入侵测试周围的潜在收益和重大问题在 `SC Magazine` 的最新文章中被强调，该文章列出了美国标准与技术研究院（`NIST`）的建议，应将这些程序作为常用的联邦工具。优点是显而易见的：渗透测试可用于检测和消除犯罪分子或恐怖分漏洞。\n\
  \n缺点是培训人们这样做就像武器训练一样：无法保证知识不会传递出去。事实上，文章的大部分描述了必须对这些操作以及执行操作的人员施行的控制。`NIST` 建议引入外部人员，以确保机构不会淡化问题并减少不满的前员工组织攻击的风险。建议将在月底定稿，并根据报道于\
  \ 3 月发布。\n\n这显然是一个有趣且热门的领域。看起来渗透测试的质量各不相同，且该领域竞争非常激烈。这是 `Free Information Technology\
  \ Tips` 对道德黑客的极佳概述。首先，作者描述了一个被称为“保释卡”的合同，因为它免除了黑客的任何刑事责任。这是必要的，因为黑客的大部分行为都是犯罪性的。对于机构来说，在聘用负责任的黑客之前咨询律师是非常重要的。一个明显的问题：如果公司免除了黑客的诉讼责任，那么如果客户起诉或黑客犯错导致数据丢失，责任是否仍然存在？\n\
  \n文章描述了他试图寻找的三个件事：黑客可以获取什么信息，这些信息会发生什么，以及机构是否会自动知道是否有“真正的”黑客策划了威胁。\n\n\n\n\n\n对道德黑客行为的常规观察以及\
  \ Mainebiz 的从业者 David Jacquet 展示展示了道德盗版的兴起，并解释了为什么这些人需求量巨大。令人痛苦的问题在于白、灰、黑之间的界限。黑客世界是如此精确、专业且神秘。公司如何确保他们邀请攻击其网络的黑客真的是符合道德规范的？公司如何知道发现的任何漏洞已报告给客户？\n\
  \n推测，这关乎声誉和信任。同时，这是一个相当困难的假设。\n\n自动化工具现在主宰着互联网。你可以找到一些来扩展社交网络，另一些自动回复邮件，甚至还有机器人帮助你的在线客户。当然，黑客技术也在进化：今天有很多自动化的\
  \ `OSINT` 工具可以帮助任何人进行安全调查和信息检测，而这在 20 年前是不可能的。\n\n# 你不应该错过的 15 道德黑客工具\n\n1. `John\
  \ the Ripper`\n2. `Metasploit`\n3. `Nmap`\n4. `Wireshark`\n5. `OpenVAS`\n6. `IronWASP`\n\
  7. `Nikto`\n8. `SQLMap`\n9. `SQLNinja`\n10. `Wapiti`\n11. `Maltego`\n12. `Air Cracking\
  \ ng`\n13. `Reaver`\n14. `Ettercap`\n15. `15th screen`\n\n在过去的几十年里，很少有安全专家进行黑客测试和道德入侵测试。现在几乎任何人都可以报告安全事件。使用道德黑客工具，你可以分析、搜索并发现公司的漏洞和弱点，以提高系统和应用程序的安全（正如几周前发布的关于\
  \ wild state 的 `CVE` 文章描述的那样）。\n\n现在，我们将检查现代安全研究人员使用的最佳道德黑客工具。我们编译了一些著名的入侵测试工具，以帮助你在安全调查的早期阶段工作。在这里你将找到似乎一直存在的经典工具，以及你可能并不熟悉的新工具。\n\
  \n## 1. John the Ripper\n\n`John the Ripper` 是历史上最著名的密码破解器之一。它也是测试操作系统密码安全性或对其进行远程监控的可用最佳安全工具之一。\n\
  \n这个密码劫持程序会自动检测几乎所有密码使用的加密类型，并据此更改密码测试算法。这使其成为几种流行的密码黑客工具之一。史上最聪明的工具。\n\n这个道德黑客工具使用暴力破解技术解密密码和算法，例如：\n\
  - `Des`, `MD5`, `Blowfish`\n- `Kerberos AFS`\n- `Hash LM` (Lan Manager)，Windows\
  \ `NT / 2000 / XP / 2003` 中使用的系统\n- `MD4`, `LDAP`, `MySQL`（带有第三方模块）\n\n另一个优势是 `JTR`\
  \ 开源、跨平台，并完全适用于 `Mac`、`Linux`、`Windows` 和 `Android`。\n\n## 2. Metasploit\n\n`Metasploit`是一个开源网络安全项目，使信息人员可以使用各种渗透测试工具检测远程软件的安全漏洞。它还作为模块开发的开发平台。\n\
  \n该项目最著名的成果之一是 `Ruby` 的 `Metasploit` 框架，它可以让你轻松开发、测试和运行漏洞。该框架包含了许多安全工具，允许你：\n- 运行检测黑客的系统\n\
  - 执行安全漏洞扫描\n- 运行远程攻击\n- 列出网络和主机\n\n`Metasploit` 提供了其软件的三个版本：\n- `Pro`：入侵测试和 IT 安全团队的理想选择。\n\
  - `Community`：供 `Infoec` 小企业和学生使用。\n- `Framework`：应用程序开发者和安全研究人员的最佳选择。\n\n支持的平台有：\n\
  - `Mac OS X`\n- `Linux`\n- `the window`\n\n## 3. Nmap\n\n`Nmap`（Network Mapper）是一个免费、法的开源安全工具，允许\
  \ `Infosec` 专家管理和监控本地及远程主机的网络和操作系统的安全性。\n\n尽管它是最老的安全工具之一（于 1997 年引入），但它仍在积极更新，并每年接收新的增强。它也被认为是市场上效率最高的网络映射工具之一，以其在所有安全调查中提供全面结果的速度和效率而闻名。\n\
  \n你可以用 `Nmap` 做什么？\n- 安全设备审计\n- 识别远程主机上的开放端口\n- 网络映射和枚举\n- 发现每个网络中的漏洞\n- 对域名和子域名启动广泛的\
  \ `DNS` 查询\n\n支持的平台有：\n- `Mac OS X`\n- `Linux`, `OpenBSD` 和 `Solaris`\n- `Microsoft\
  \ Windows`\n\n## 4. Wireshark\n\n`Wireshark` 是免费的开源软件，让你实时分析网络流量。凭借其检测技术，`Wireshark`\
  \ 因能够检测任何网络中的安全问题并高效解决常见的网络问题而获得广泛认可。\n\n检测网络允许你以人类可读的格式捕捉并读取结果，更容易识别潜在问题（如低延迟）、威胁和漏洞。\n\
  \n主要功能：\n- 保存扫描结果供离线查看\n- 数据包浏览器\n- 强大的图形界面\n- 丰富的 VoIP 分析\n- 检查并解压缩 gzipped 文件\n\
  - 读取其他捕获文件格式，包括：`Sniffer Pro`, `tcpdump` (`libpcap` ), `Microsoft Network Monitor`,\
  \ `Cisco Secure IDS iplog` 等。\n\n支持的网络端口和设备：`Ethernet`, `IEEE 802.11`, `PPP / HDLC`,\
  \ `ATM`, `Bluetooth`, `USB`, `Token Ring`, `Frame Relay`, `FDDI`。\n协议解密包括但不限于：`IPsec`,\
  \ `ISAKMP`, `Kerberos`, `SNMPv3`, `SSL / TLS`, `WEP`, 和 `WPA / WPA2`。\n将结果导出为 `XML`,\
  \ `PostScript`, `CSV` 或纯文本格式。\n\n`Wireshark` 支持多达 2000 种不同的网络协议，并在所有主流操作系统上免费，包括：\n\
  - `Linux`\n- `Microsoft windows`\n- `Mac OS X`\n- `FreeBSD`, `NetBSD`, `OpenBSD`\n\
  \n## 5. OpenVAS\n\n`OpenVAS`（也称为“Nessus”）是一个开源网络扫描器，用于检测所有主机的远程漏洞。作为最流行的网络弱点扫描器之一，深受\
  \ `DevOps` 和 `Infosec` 系统管理员及专业人员的喜爱。\n\n主要功能：\n- 强大的 Web 界面\n- +50,000 网络敏感性测试\n\
  - 同时分析多个主机\n- 退出、暂停和恢复分析任务的能力\n- 误报管理\n- 计划扫描\n- 创建图表和统计数据\n- 将测试结果导出为纯文本、`XML`,\
  \ `HTML` 或 `LateX`\n- 提供强大的 `CLI`\n- 与 `Nagios` 监控软件完全集成\n\nWeb 界面使得从任何操作系统工作成为可能。然而，也有适用于\
  \ `Linux`、`Unix` 和 `Windows` 操作系统的命令行界面。免费版本可以在 `OpenVAS` 网站获取。此外，`Greenbone Security`（母公司）网站也提供商业企业许可。\n\
  \n## 6. IronWASP\n\n如果你在考虑道德黑客，`IronWASP` 是另一个很棒的工具。它是免费、开源跨平台的，非常适合任何需要监控其 Web\
  \ 服务器和公共应用程序的人。\n\n`IronWASP` 最有趣的的方面之一是，你不需要成为专家就能管理它的主要功能。一切都基于图形界面，只需点击几次即可完成完整分析。如果你从道德黑客工具开始，这是一个很好的入门方式。它的一些关键功能包括：\n\
  - 强大的图形界面\n- 记录 Web 分析序列的能力\n- 将结果导出为 `HTML` 和 `RTF` 格式\n- Web 中超过 25 种不同的漏洞\n-\
  \ 误报和漏报管理\n- 完全支持用于脚本引擎的 `Python` 和 `Ruby`\n- 可以用 `C #`, `Ruby` 和 `Python` 设计的模块进行扩展\n\
  \n托管平台：`Windows`, `Linux` (带 `Wine`) 和 `MacOS` (带 `CrossOver`)\n\n## 7. Nikto\n\n\
  `Nikto` 是另一个受欢迎的工具，作为 `Kali Linux 发行版`的一部分。其他流行的 Linux 发行版（如 `Fedora`）已经配备了 `Nikto`，它可以在其软件仓库中找到。\n\
  \n\n\n\n此安全工具用于扫描 Web 服务器并在指定的远程主机上执行各种类型的测试。其简洁简单的命令行界面使得您能够轻松地在目标机器上启动漏洞测试，如下方的截图所示：\n\
  \nNikto 的主要功能包括：\n- 检测每个操作系统上的标准安装文件\n- 识别过时的软件应用程序\n- 运行 XSS 漏洞测试\n- 根据告警启动暴力破解攻击\n\
  - 将结果导出为文本、CSV 或 HTML 文件\n- 使用 `LibWhisker` 绕过入侵检测系统 (IDS)\n- 与 `Metasploit Framework`\
  \ 集成\n\n## 8. SQLMap\n\n`SQLmap` 是一种用 Python 开发的网络安全工具，允许安全研究人员在远程主机上运行 SQL 注入测试。通过\
  \ `SQLMap`，你可以发现并测试不同类型的 SQL 漏洞，以增强应用程序和服务器的安全性，或向不同的公司报告漏洞。\n\nSQL 注入技术包括：\n- 基于查询的\
  \ UNION\n- 基于时间的盲注\n- 基于布尔的盲注\n- 基于错误的注入\n- 堆叠查询\n- 带外查询\n\n主要功能：\n- 支持多种数据库服务器：Oracle、PostgreSQL、MySQL\
  \ 和 MSSQL、MS Access、DB2 或 Informix\n- 自动代码输入\n- 密码识别\n- 基于字典的密码破解\n- 用户枚举\n- 获取密码哈希\n\
  - 查看用户权限和数据库\n- 提升数据库用户权限\n- 关于转储表的信息\n- 运行远程 SQL SELECT\n\n## 9. SQLNinja\n\n`SQLNinja`\
  \ 是另一个随 Kali Linux 发行版提供的 SQL 漏洞扫描器。该工具旨在针对使用 `MS SQL Server` 作为主数据库服务器的 Web 应用程序。`SQLNinja`\
  \ 用 Perl 编写，可在多个安装了 Perl 解释器的 Unix 发行版中运行。它支持以下操作系统：\n- Linux\n- Mac OS X 和 iOS\n\
  - FreeBSD\n\n`SQLninja` 可以以不同的模式执行，例如：\n- 测试模式\n- 详细模式\n- 远程指纹数据库模式\n- 使用词列表进行暴力破解\n\
  - 直接 壳和反向 壳\n- 出站端口扫描器\n- 反转 ICMP Shell\n- DNS 隧道 Shell\n\n## 10. Wapiti\n\n`Wapiti`\
  \ 是一个免费的 Python 开源命令行漏洞扫描器。虽然它不是该领域最流行的工具，但它可以检测许多 Web 应用程序中的安全漏洞。\n\n使用 `wapiti`，你可以发现安全漏洞，包括：\n\
  - XSS 攻击\n- SQL 注入\n- XPath 注入\n- XXE 注入\n- CRLF 注入\n- 伪造服务端请求\n\n其他功能还包括：\n- 以冗余模式工作\n\
  - 可以停止并继续分析\n- 在终端中高亮显示漏洞\n- 生成报告并将其导出为 HTML、XML、JSON 和 TXT\n- 启用和禁用多个攻击模块\n- 清除某些\
  \ URL 的参数\n- 在攻击期间排除 URL\n- 忽略 SSL 证书验证\n- JavaScript URL 提取器\n- 为大型扫描设置时间限制\n-\
  \ 设置自定义的 HTTP 和 user-agent 头部\n\n## 11. Maltego\n\n`Maltego` 是在目标进行初始分析期间收集信息和识别数据的理想工具。\n\
  \n在这种情况下，人、姓名、电话号码、电子邮件、公司、组织和社交网络个人资料之间的关系可以被关联并确定。\n\n除了 `whois` 数据、`DNS` 记录、社交网络、搜索引擎、地理位置服务和在线\
  \ API 服务等在线资源外，它还可以用于调查互联网基础设施之间的关联，包括：\n- 域名\n- DNS 服务器\n- 网络区块\n- IP 地址\n- 文件夹\n\
  - Web 页面\n\n主要功能包括：\n- 图形化界面\n- 每个图表分析最多 10,000 个对象\n- 广泛的关联可能性\n- 实时数据交换\n- 关联数据的图形生成器\n\
  - 将图形导出为 `GraphML`\n- 生成实体列表\n- 可以复制（复制和粘贴）信息\n\n该应用程序适用于 Windows、Linux 和 Mac OS。唯一的软件要求是安装\
  \ `Java 1.8` 或更高版本。\n\n## 12. Air Crack-ng\n\n`Air Crack-ng` 是一个受推誉的家庭安全和企业安全套件。它对\
  \ `802.11 WEP` 和 `WPA-PSK` 网络提供完全支持，并捕获网络包。然后对其进行分析并利用它们中断 wifi 访问。\n\n`AirCrack-ng`\
  \ 为传统的安全专业人员提供了优雅的终端界面和其他一些有趣的特性。\n\n主要功能：\n- 完整的文档（wiki，manpages）\n- 活跃的社区（论坛和\
  \ IRC 通道）\n- 支持 Linux、Mac 和 Windows 的 WLAN 探测\n- 启动 PTW、WEP 和碎片攻击\n- 支持 WPA 迁移模式\n\
  - 快速破解速度\n- 支持多个无线卡\n- 与第三方工具集成\n\n作为奖励，它包含了许多 Wifi 审计工具，包括：\n- `Air Force Base`\n\
  - `Aircrack`\n- `airdecap-ng`\n- `airdecloak-ng`\n- `airdriver-ng`\n- `aireplay-ng`\n\
  - `Air-ng`\n- `airodump-ng`\n- `airolib-ng`\n- `AirServ-ng`\n- `airtun-ng`\n- `easside-ng`\n\
  - `paquetforge-ng`\n- `tkiptun-ng`\n- `Wesside-ng`\n- `airdecloak-ng`\n\n## 13.\
  \ Reaver\n\n`Reaver` 是 `Aircrack-ng` 的极佳开源替代方案，允许您检查带有 `WPA / WPA2` 密码的任何 Wi-Fi\
  \ 网络的安全性。它使用暴力 Wi-Fi 攻击技术（如 `Pixie's dust attacks`），由于常见的安全漏洞和 Wi-Fi 漏洞破坏 WiFi 保护的设施。\n\
  \n根据路由器上无线安全的配置，有效的暴力破解可能需要 3 到 10 小时才能得出结果。\n\n直到最近，`Reaver` 的原始版本托管在 `Google Cloud`\
  \ 上。在版本 `1.6` 发布后，Github 上发布了分支的社区版。一些主要功能包括：\n- 构建依赖项：必要的构建\n- `libpcap-dev`\n\
  - 运行时依赖项\n- `Pixiewps`（Pixiedust 攻击所需）\n\n它在大多数 Linux 发行版上运行良好。\n\n## 14. Ettercap\n\
  \n`Ettercap` 是一个用于局域网（LAN）的网络接收器和数据包嗅探器。它支持主动和被动扫描，以及各种协议，包括 SSH 和 HTTPS 等加密协议。其他功能包括网络和主机分析（例如操作系统指纹）以及对已建立连接的网络操作。这使其成为测试安全攻击的合适工具。拦截器类型。\n\
  \n主要属性：\n- 主动和被动协议分析\n- 过滤器取决于 IP 源和目的、MAC 和 ARP 地址\n- 向现有连接注入数据\n- 基于 SSH 和 HTTPS\
  \ 加密的协议\n- 嗅探 GRE 隧道中的远距离流量\n- 可通过插件扩展\n- 支持的协议包括 Telnet、FTP、Imap、SGB、MySQL、LDAP、NFS、SNMP、HTTP\
  \ 等\n- 确定操作系统的名称和版本\n- 可以终止建立的局域网连接\n- DNS 劫持\n\n## 15. Canvas\n\n`Canvas` 是 `Metasploit`\
  \ 的绝佳替代方案，提供了超过 800 个漏洞用于测试远程网络。\n\n它的主要功能包括：\n- 远程网络\n- 针对不同类型的系统\n- 针对特定的地理区域\n\
  - 远程系统的截图\n- 下载密码\n- 修改系统中的文件\n- 提升权限以获取管理员访问\n\n通过此工具你还可以使用其平台编写新的漏洞，或使用其著名的 shellcode\
  \ 生成器。它包含一个名为 `scanrand` 的 `nmap` 替代品，这对于在中大型网络中扫描端口和检测主机特别有用。\n\n支持的平台有：\n- Linux\n\
  - MacOSX（需要 `PyGTK`）\n- Windows（需要 `Python` 和 `PyGTK`）\n\n软件供应商正在利用自动化伦理黑客工具和入侵测试工具来日常提高系统安全性。\n\
  \n\n\n\n自动化工具正在改变黑客技术的演变方式，使得道德渗透测试比以往任何时候都更容易、更快且更可靠。入侵测试和报告活动现在在识别与远程或本地软件相关的安全漏洞方面发挥着重要作用。这使得所有者能够迅速防止安全漏洞在互联网上扩散。\n\
  \n能力使你能够在现有的时间资源内实现所需的目标。作为一名黑客，你需要开发能够帮助你完成工作的技能。这些技能包括学习编程、使用互联网、解决问题以及使用现有的安全工具。\n\
  \n# 每个黑客都需要的技能\n\n在本节中，我们将向你展示作为黑客所需的常用编程语言和技能。\n\n### 什么是编程语言？\n\n### 为什么你应该学习编程？\n\
  \n## 你应该学习哪些编程语言？\n\n### 什么是编程语言？\n编程语言是一种用于开发计算机程序的语言。开发的程序范围从操作系统到通过网络解决方案的数据驱动应用程序。\n\
  \n### 为什么你应该学习编程？\n黑客是工具的创造者和问题的解决者。学习编程有助于你实现问题的解决方案。它还能让你与脚本小子（script kiddies）区分开来。\n\
  \n通过以黑客身份编写程序，你可以自动化许多通常需要长时间才能完成的任务。编写程序还可以帮助你识别并利用你目标应用程序中的编程错误。\n\n没有必要不断重复轮子，而且有很多易用的开源程序。你可以根据需要自定义现有的应用程序并添加你自己的方法。\n\
  \n### 我应该学习哪些编程语言？\n这个问题的答案将取决于你的计算机系统和平台。某些编程语言仅用于开发特定平台。例如，`Visual Basic Classic`（3,\
  \ 4, 5 和 6.0）用于编写运行在 Windows 操作系统上的应用程序。如果你的目标是入侵 Linux 系统，那么学习如何在 `Visual Basic\
  \ 6.0` 中编程是不合逻辑的。\n\n## 黑客使用的编程语言\n\n### 1 HTML\n用于编写网页的语言。多平台 Web 攻击。\n登录表和其他在\
  \ Web 上输入数据的方法使用 `HTML` 表单来获取数据。编写和解释 `HTML` 的能力使得检测和利用代码漏洞变得容易。\n\n### 2 JavaScript\n\
  客户端脚本语言。跨平台 Web 攻击。\n`JavaScript` 代码在客户端导航时执行。你可以使用它读取注册的 Cookie 并在网站之间执行脚本等。\n\n\
  ### 3 PHP\n服务器端脚本语言。多平台 Web 攻击。\n`PHP` 是最知名且应用的 Web 编程语言之一。它用于接收 `HTML` 表单并执行其他自定义任务。你可以用\
  \ `PHP` 编写自定义应用程序来更改 Web 服务器的设置使其容易受到攻击。\n\n### 4 SQL\n与数据库通信的语言。多平台 Web 攻击。\n使用\
  \ `SQL Injection` 绕过 Web 程序的弱连接算法，从数据库中删除数据等。\n\n### 5 Python\n高级编程语言。跨平台创建工具和脚本。\n\
  当你需要开发脚本和自动化工具时，它们非常有用。获得的洞察也可以用于理解和适应已有的工具。\n\n### 6 C & C++\n高级编程。多平台编写利用程序、shell\
  \ 代码等。\n如果你需要编写自己的 shell 代码、利用程序、rootkit 或理解并开发现有的工具，它们将非常有用。\n\n### 7 Java\n###\
  \ 8 CSharp\n### 9 Visual Basic\n### 10 VBScript\n\n## 其他提示\n`Java` 和 `CSharp` 是多平台的。`Visual\
  \ Basic` 是 Windows 特有的。这些语言的有效性取决于你的场景。\n\n*   多平台意味着用相应语言开发的程序可以部署在不同的操作系统上，如 Windows、Linux、MAC\
  \ 等。\n\n## 黑客可能需要的其他技能\n\n除了编程技能，一个优秀的黑客还必须具备以下技能：\n\n- 知道如何有效地使用互联网和搜索引擎收集信息。\n\
  - 获取一个基于 `Linux` 的操作系统并掌握每个 `Linux` 用户都应该知道的基本命令。\n- 熟能生巧，一个优秀的黑客应该努力工作并为黑客社区做出积极贡献。这有助于开发开源程序、回答黑客论坛的问题等。\n\
  - 编程技能对于成为一名有效的黑客至关重要。\n- 网络技能对于成为一名有效的黑客至关重要。\n- `SQL` 技能对于成为一名有效的黑客很重要。\n\n黑客工具是能够更容易检测和利用计算机系统漏洞的程序。\n\
  \n随着时间的推移，随着我们开发技术并像蜜蜂一样工作，我们能够开发并大大提高技术水平。然而，随着技术的发展，遗留问题仍然存在，这变成了技术的弱点和漏洞，可能导致在互联网上可以访问重要信息和数据的黑客情况。盗窃、篡改或破坏等。因此，这些黑客变成了信息系统中焦躁不安的天才，他们可以在其中战斗并破坏你设备上激活的安全性，让你处于危险之中。\n\
  \n最近，信息安全的需求也增加了，因为个人可以帮助防止这种情况的发生并避免末日时刻。这些人是他们不道德同事的敌人，他们帮助我们确保信息的主动安全，并防止我们失眠。他们确保我们的数据和信息的安全，并保护它们免受灾难。我们称他们为“道德黑客”。那么成为一名道德黑客听起来怎么样？它诱惑你吗？如果是的话，你还需要考虑和理解一些点才能成为一名专业黑客。\n\
  \n你需要识别并理解可以分为白帽、灰帽和不道德黑客的不同黑客类型。你必须对这三者进行评估以充分理解它们。只有彻底的知识才能对抗信息系统的违规或未经访问。此外，你可以在识别系统漏洞的同时确保系统的主动安全。健全的知识和强大的技能可以帮助你成为一名道德黑客。\n\
  \n你必须确定成为道德黑客的基本要求。无论你需要课程、文凭还是不同的执照。确保你做好功课，然后进行练习。\n\n\n\n\n最后但同样重要的是：确定你程序的业务属性。发现职业前景或展示你自己的形象。市场中（无论是私营部门还是公共部门）有很多丰厚的工作和职位，你可以通过提供服务来维持生。一旦完成这一步，任务就完成了。\n\
  \n恭喜你！你正处于成为专业黑客的道路上。去吧，去拯救世界。\n\n## 黑客\n\n计算机黑客是对话中使用的术语之一，用于证明管理层面临着计算机安全问题。计算机安全漏洞每天都有报道，而且在严格控制的环境中也会发生，因为用户没有经过充分培训来识别这些问题，或者关键系统至关重要。如果你认为已经采取了所有预防措施，但如果有人为了犯罪而窃取重要信息，你的操作将会受到干扰。\n\
  \n直到 2008 年 11 月，据报道，一名囚犯可以通过非互联网计算机访问带有个人信息的在线员工文件。程序员表示已经阻止了对互联网的访问。然而，当使用集成计算机系统时，“禁止”并不意味着什么，因为黑客会找到绕过受保护门户的方法。这就像锁上建筑的前门和后门，却让侧窗保持开启状态。\n\
  \n### 理解问题\n\n在囚犯的案例中，他使用瘦客户端访问了监狱服务器上的员工文件。虽然服务器没有程序访问互联网，但该囚犯利用从员工文件中窃取的用户名和密码信息，并发现了囚犯用于法律研究目的软件中的门户，巧妙地进入了互联网。\n\
  \n如果一个囚犯可以黑入设计用于保护公众的复杂安全系统的执法系统，那么必须有多级安全措施来警告监控系统的人员正在尝试攻击。目标是在信息被访问之前检测并停止错误。换句话说，一个良好的安全系统具有两个特征：\n\
  \n- 安全系统防止入侵\n- 经过培训的员工具备必要的知识来识别黑客尝试的迹象和可能的黑客入侵点。\n\n你可以使用互联网安全服务来评估你的安全性，并设计一种防止入侵的应用程序。然而，经常使用系统的员工需要了解黑客是如何工作的，以及使用了哪些方法来检测和利用黑客利用漏洞系统。\n\
  \n### 你必须如何工作\n\n基本上，你是在教你的员工成为黑客以防止黑客。旨在让员工熟悉网络安全系统的课程解释了黑客如何操作系统以及如何检测他们。他们还学习了反击措施如何工作，并回到工作岗位实施组织措施来保护计算机系统。\n\
  \n如果监狱设置了安全级别，能够提供有人尝试通过软件访问员工文件的通知并阻止访问，那么就不会发生违规行为。让你的员工能够识别潜在漏洞、检测黑客尝试、学习如何使用业务工具并采取反击措施是至关重要的。\n\
  \n黑客通常会全过程提供机密信息，因为员工无法识别黑客行为。有一句老话：“你必须认识它，才能识别它。”在黑客世界中，一个高水平的黑客需要认识一个黑客。然而，这种培训的处处不可估量，因为公司的资产得到了保护。\n\
  \n黑客服务通过提供世界级的渗透测试和伦理黑客风险管理服务，帮助保护你的网络安全。\n\n## 企业的黑客风险\n\n对于一家普通公司来说，黑客带来的风险是什么？如果你拥有一家小型企业，你认为自己可能受到威胁吗？\n\
  \n人们很容易认为，真正能被黑客攻击的只有银行、大型富裕机构甚至是政府机构。但没有什么比这更偏离事实了。\n\n虽然经验丰富且认黑客攻击较大的目标，但仍有许多入侵者攻击较小的目标，因为他们知道攻击和破坏这些目标可能更容易。如果你不采取所有必要的步骤来对抗黑客攻击，你所做的等同于上班时把前门打开，并把所有财物放在餐桌上。\n\
  \n不幸的是，在身份欺诈中普遍存在的这种无知有时也涉及黑客行为。我们都希望相信这永远不会发生在我们身上。你坐在一个舒适、温暖且安全的家庭办公室里在自己的电脑上修改网站，这对于黑客来说并不重要，他们可以在世界的另一端感到很舒服，同时给你带来巨大的麻烦。\n\
  \n黑客有几种类型，但他们都可能危及你的业务。有些人会试图窃取客户的个人信息或进行欺诈交易，而另一些只想通过在邮件中附加病毒并发送给尽可能的人来制造尽可能的问题。如果你工作的员工打开了此附件，这可能是问题的开始，让你的业务陷入困境直到问题得到解决。\n\
  \n简而言之，黑客行为是一门生意。这意味着如果你不承认自己处于危险之中，你的业务可能会受到严重威胁。永远不要犯你没有风险的错误，因为你没有通过网站管理支付，甚至没有提供任何黑客可以访问的会员区域。每个人在某种程度上都面临风险。\n\
  \n确保你的业务对自己的安全负责是你的工作。你可能已经实施了一些基础安全措施（`firewall`、`anti-spyware` 和 `anti-virus`），并且在打开附件时必须意识到警惕。但这并不能让你的业务变得安全。\n\
  \n考虑请专家来评估你的潜在风险区域以及如何应对它们。了解你和你的公司如何合作对抗黑客是迈向改进的重要一步，希望这些改进能让黑客无法逾越。\n\n## 将伦理黑客作为职业\n\
  \n拒绝服务攻击、入侵检测和黑入 Web 服务器是你的娱乐活动吗？如果是这样，那么成为信息安全专业人士或伦理黑客是一个正确的职业选择。伦理黑客也被称为白帽黑客，他们通过合法工作来控制计算机或网络的漏洞。通过专业认证\
  \ - 认证伦理黑客（`CEH`），你可以在组织层面变得非常受青待。\n\n### 什么是认证伦理黑客（CEH）？\n\n`CEH` 是一种识别网络漏洞并采取预防措施防止数据丢失的伦理黑客。由国际电子商业委员会（`EC\
  \ Council`）颁发的“认证伦理黑客证书”证明了信息安全专家的专业知识。该证书是厂商中性的，并且在全球范围内获得认可。\n\n### 谁能从中获益？\n\n\
  该课程对于网站管理员、安全专业人员、审计师以及拥有网络基础设施的专业人士非常有用。\n\n### 如何获得 CEH？\n\n欧洲委员会建议的获得此认证两种方法是：\n\
  \n- 认证培训中心（`ATC`）：任何人都可以参加其中中心之一提供的为期五天的在线或现场培训课程。在过程结束，学生或候选人可以在互联网上参加 `Prometric\
  \ Prime` 考试。\n\n\n\n\n自学：您可以尝试搜索所提供的自学材料进行考试，并由雇主证明您具有至少两年的信息安全经验。如果不符合此情况，我们可以向您发送培训详情并请求考虑。\n\
  \n## 如何注册？\n\n申请此认证的步骤如下：\n\n-   在获得雇主确认后填写表格。\n-   附上政府批准的护照复印件（如护照）。\n-   发送表格和文件的扫描件。\n\
  -   提交 100.00 美元的不可退还报名费。\n\nEC Council 的审批时间通常持续两周。\n\n## 考试详情\n\n第 8 版本是 2013\
  \ 年底发布的最后一个证书。\n\n通过 ATC 考试模式的候选人将获得考试代码 `312-50`。参加自学计划的候选人可以在 Prometric 授权测试中心\
  \ (`APTC`) 参加 `EC0-350` 考试。\n\n考试由 125 道选题组成。在四个四小时的考试中，候选人需要对系统进行扫描、测试、黑客攻击和加固。候选人必须获得\
  \ 70% 的分数才能出色地展现自己的水平。一旦候选人获得认证，欢迎套装将在四周后到达。\n\n# 职场中的计算机伦理\n\n无论你是高技能专业人士还是计算机实习生，都必须遵守职场计算机伦理。计算机伦理与任何伦理实践一样，是一套既定的行为准则。否则，它可能会伤害他人并在工作和法律上给你带来麻烦。IT\
  \ 伦理由许多机构产生和监管，包括美国的计算机伦理学院（1992）以及世界各地的政府。尽管大多数准则自 20 世纪 90 年代以来未修改，尽管技术已经演变，它们在今天仍然适用。以下是与当今计算机的一些关键伦理问题。\n\
  \n### 复制软件\n\n在过去的十年里，非法复制软件、CD 和 DVD 已成为一种常态，但这样做仍然是非法的。在不支付费用的情况下购买你没有许可复制或使用的软件是不道德的，因为你没有为自己付出，却通过窃取创人的知识产权而剥夺了创作者应得的尊重。\n\
  \n### 知识产权\n\n获取他人的成果并将其据为己有是不道德的，因为他人的知识产权。在编写副本和知识产权伦理中，这意味着销售产品仅属于他们，如果你将其归功于自己，就等于盗窃。\n\
  \n### 黑客攻击\n\n无论是攻击账户还是用户 ID，在伦理上都是站不住脚的。在工作中，通常会有许多计算机或多用户凭据网络，其盗版内容违反了伦理和保密权。计算机黑客攻击会导致许多问题，因为计算机本质上是一个被故意设计为私密的设备。\n\
  \n### 数据泄露和破坏\n\n未经许可操纵、处理或故意破坏第三方数据是不道德的，因为这将故意伤害用户。如果你还伪造数据或盗取个人信息，你不仅违反了伦理准则，还违反了法律。\n\
  \n### 病毒\n\n今天，我们的大部分时间都在避免破坏或更改你计算机的可怕病毒。未经许可损坏计算机（无论是软件、数据还是另一台计算机）都是非法行为。根据英国的《计算机滥用法》，将面临监禁或巨罚款。\n\
  \n理解并维护良好的计算机伦理不仅可以防止你违反法律，还有助于维护计算机安全。理解本伦理准则有助于每位学员理解，在存储私人信息的职场中，保护计算机及其包含的数据是至关重要的。\n\
  \n## 道德黑客\n\n道德黑客的形成听起来几乎像是一个矛盾体。一个人如何能既是合道德的又是海盗呢？你需要了解什么是道德黑客、他是如何接受培训的以及他做什么，才能充分理解这种职位的天才之处。\n\
  \n这个职位是独特的。培训教授了每个黑客都会尝试渗透计算机系统的相同技术。区别在于，他们这样做是为了在漏洞被实际利用之前发现它们。在漏洞开放给公众之前发现它们可以防止对系统的实际入侵。发现这些漏洞只是测试系统安全性的方法之一。\n\
  \n尽管黑客能力是相同的，但意图决定了差异。尽管这些人可以一直尝试入侵系统以获得该系统内部功能的控制权，但他们这样做是为了寻找该弱点的方法。他们识别出渗透区域以加强它们。要阻止黑客，你必须像黑客一样思考。\n\
  \n这样的人接受的培训必须是详尽的。需要深入理解黑客入侵系统的方法，以便所采取的防御措施足以阻止任何真实的黑客。如果你忘记了系统中的一个漏洞，你可以肯定会有那种不道德的人来利用这个漏洞。\n\
  \n他们提供多种课程来促进这种培训。全面的网络安全课程可以为有兴趣的人开展工作做好准备。这种对攻击和防御措施的理解对于该职位至关重要。这包括在发生系统违规时做什么、调查攻击尝试以及追踪网络犯罪。\n\
  \n公司聘请道德黑客来测试其网络的渗透性。在一个与先进技术相关的犯罪日益流行的世界上，他们的努力为信息和系统的安全做出了贡献。发现网络漏洞并非易事，因为在这个水平，攻击和防御技术不断变化演变。\n\
  \n六个月前安全的东西现在可以被轻易破解。对最新的黑客技术非常精通。它一直在变化。这些高技能的人执行风险分析，并帮助不同的协作领域确保整个系统的高水平安全。接受培训的人甚至开发新软件，一旦识别出漏洞并采取预防措施，软件将立即实施。\n\
  \n随着越来越多的商务人士无意或有意地访问公开的计算机系统，道德黑客培训领域将不断扩大。企业信息、银行信息和个人安全的取决于保护这些信息免受外部攻击的能力。这种培训引导人们像外部渗透者一样思考，比游戏领先一步，并保护他们受雇保护的信息。谁知道还有种好的黑客呢？\n\
  \n# 黑客攻击类型及如何预防\n\n你是一个有抱负的黑客并想了解更多关于不同类型的黑客攻击吗？\n\n本节涵盖了所有类型的黑客攻击及其预防方法。\n\nIan\
  \ Murphy、Kevin Mitnick、Johan Helsinguis 和 Robert Morris。你记得这些名字是为了什么吗？\n\n关键在于，他们是世界历史上一些最大黑客攻击背后的天才。\n\
  \nIan Murphy（也被称为 Captain Zip）是第一个在攻击 AT & T 计算机网络并更改内部时钟以衡量计费率后被定罪的计算机黑客。\n\n从这些微小的变化到大规模的利用，各种类型的黑客攻击随着时间的推移破坏了互联网、企业、公共网络等。\n\
  \n没有人受到困扰——Sony、Adobe、Target、Equifax、Yahoo、Marriot、eBay、JP Morgan Chase、LinkedIn\
  \ 以及一系列无尽的大小玩家都收到了影响。\n\n### 数据丢失\n\n班加罗尔数字营销课程来源 - Csoonline\n\n\n\n\n“黑客”（hacker）一词于\
  \ 20 世纪 60 年代于麻理工学院的 KI 实验室，到 70 年代，各种黑客攻击类型已经失去了控制。\n\n总体来说，多年来这些黑客技术变得越来越复杂且具有针对性。2018\
  \ 年，计算机黑客攻击仍然是数据泄露的主要原因，占比 57.1%。\n\n威胁仍在增加！\n\n为了理解黑客攻击的本质以及各种黑客攻击是如何发展的，让我们从开始到其变得危险的过程来观察。\n\
  \n## 多年来不同类型的黑客攻击\n\n### 黑客之初期（1960-1970）\n\n由于该词发明于 20 世纪 60 年代，我们将其视为黑客起源的十年。然而，事实是，黑客计算机安全历史年表可以追溯到\
  \ 1903 年的一些重大事件，当时发明家内维尔·马斯凯林（Nevil Maskelyne）破坏了马可尼无线电报技术的公共使用。\n\n他用摩斯密码发送了辱性信息，并忽略了礼堂里的投影仪。黑客行为在\
  \ 20 世纪 60 年代形成了具体形式，当时程序员试图破解系统以获得更好的结果。\n\n那些这样做的人转而反对他，并导致了当时最糟糕的黑客攻击之一，当时 AT\
  \ & T 的广域变更因吹哨高音以获取免费通话而中断。其影响非常严重，以至于 FBI 必须干预以破解黑客网络。\n\n1979 年，凯文·米特尼克（Kevin\
  \ Mitnick）入侵了数字设备公司（Digital Equipment Corporation）的 Ark 计算机系统。\n\n### 盗版中世纪（1980\
  \ 代）\n\n随着 IBM 引入个人电脑，每个场所都成了黑客攻击的目标。从 1980 年的一百万台计算机单元到 1986 年的 3000 万台，他们使用的 PC\
  \ 和网络开启了新的黑客机会。严重性日益增加。\n\n“毁灭之军”（`LOD`）和“欺骗大师”（`MOD`）黑客组织宣布了“大黑客大战”。这两个小组作为竞争对手工作，通过渗透私人计算机和计算机网络、加密电话线和非法监控通话。\n\
  \n在联邦刑事警察局的干预后，发生了逮捕，小组解散，公民们了解了黑客攻击。\n\n### 盗版与互联网墙的交叉（1990 代）\n\n这是黑客被精炼并适应 Web\
  \ 的时代。简单的黑客程序类型从 BBS 移动到了黑客网站。\n\n它始于计算机编程爱好者的玩笑，现已变成了一项价值 2 万亿美元的产业。每台计算机和每个计算机网络都是遭受拒绝服务（`DoS`）、分布式拒绝服务（`DDoS`）、`MitM`（中间人）、钓鱼和鱼叉式钓鱼攻击等威胁的对象。密码、SQL\
  \ 注入攻击、跨站脚本（`XSS`）等。\n\n损害美国司法部、中央情报局（CIA）、美国空军、核计划系统、信用卡网站以及各种数字互动网站的黑客攻击引发了关于什么是盗版以及可能造成多大损害的问题。\n\
  \n## 黑客攻击可能的损害\n\n本节讨论了你可能在 2019 年遇到的一些黑客技术类型以及这些技术的示例。它探索了黑客攻击可能造成的损害。\n\n每个个人信息都已数字化，我们的数字足迹过度增加。不道德的黑客尝试各种黑客技术来访问数据或计算机系统并造成损害。\n\
  \n### 拒绝服务（`DoS` `DDoS`）\n\nGitHub 这一开源代码开发平台在 2018 年因每秒 1.35 太比特的海量流量而遭到破坏。这是它收到的最高记录，而该平台并未准备好处理它。\n\
  \n因此，拒绝服务（`DoS`）的设计目的是使网站或网络服务器的流量饱和到远超其导致崩溃的程度。真实用户面临拒绝服务。这些是最常见的黑客技术类型。\n\n当网络所有者继续担心排除流量问题时，有时会引入一个小型恶意软件程序，在造成损害之前需要几天时间才能被发现。僵尸网络（Botnets）旨在自动化攻击，发送多个请求、数据包或消息，这对系统来说是致命的。\n\
  \n年前，分布式 `DDoS` 或 `DoS` 攻击非常简单。然而，多年来 `DDoS` 工具箱已经能够发起基础设施攻击和应用攻击。发现来自应用层的 `DDoS`\
  \ 攻击非常有针对性。\n\n### 键盘记录器\n\n键盘记录器或系统监控器是用于监控和记录用户在键盘或触控板上击键的软件。然后检索这些击键，以在用户不知情的情况下创建用户的登录\
  \ ID 和密码。\n\n键盘记录器可以是软件或硬件，用于窃取个人信息（`PII`）。反键盘记录软件可用于检测键盘记录器程序或记录器硬件的引入。银行业和其他金融机构极易受到键盘记录器攻击。\n\
  \n### 公共 WiFi 伪造 WAP\n\n普通的公共 WiFi 用户是咖啡馆、机场和当地购物场内伪造 WAP 攻击的受害者。黑客创建一个伪造 WiFi 点，然后将其连接到免费的官方\
  \ WAP。\n\n这是最简单的黑客攻击类型，因为黑客只需下载简单的软件或知道手机的“热点”功能即可创建伪造 WAP。当黑客在用户连接到这些伪造 WAP 时开始使用特殊的数据收集工具时，问题就开始了。\n\
  \n通过伪造 WAP，攻击者试图窃取你的凭据或模拟中间人攻击，例如 `Ettercap`（它可以检测实时连接）或 `Metasploit` 项目，后者可以完全控制设备。WAP\
  \ 用户。\n\n伪造 WAP WiFi 来源 - IamWire\n\n### 鱼穴攻击\n\n利用“黑客”黑客技术，黑客试图攻击特定的互联网用户。这是通过识别该群体主要访问的网站实现的。\n\
  \n网站被病毒、蠕虫、恶意软件或恶意广告感染，允许攻击者在用户启动网站后访问其计算机系统。这是一种点击钓鱼攻击，目标是网站的用户。这些核心攻击感染合法的网站、计算机系统或受众设备。\n\
  \n这些类型的攻击在大型公司、银行网站、政府网站和公共场所通过设置错误 WAP 和其他方法实施。\n\n黑客持续监控有漏洞的热点。这些网站包含恶意代码，将访问者重定向到等待感染系统的恶意网站。\n\
  \n鱼穴攻击针对员工、供应商或网站用户使用不安全的无线网络接入的组织。虽然这些攻击并不常见，但在很长一段时间内无法被检测。\n\n水点攻击 - Trend Micro\n\
  \n\n\n\n\n许多政府机构或高级安全组织会出于非恶意目的使用被动攻击。然而，人们发现，通过被动攻击收集信息并进行主动攻击更具针对性，这使得用户难以察觉到他们的信息和数据正被用于创建针对性攻击。\n\
  \n# 不同类型的高级黑客攻击\n\n每当犯罪分子试图入侵网络时，他总是会尝试使用那些在许多情况下证明有效的最常用黑客技术。\n\n他只是试图避免重复轮子，而是优化现有技术并执行更高级、更复杂的攻击。今天登上新闻头条的网络安全攻击通常是以下类型之一：\n\
  \n## 钓鱼攻击\n\n钓鱼攻击占了数据泄露的 90%，仅在 2018 年一年中，钓鱼攻击的数量就增加了 65%。钓鱼攻击最糟糕的一点是它们发展非常快。每个月都会识别出\
  \ 150 万个新的钓鱼网站。\n\n作为一个合法来源，黑客利用社会工程和各种类型的黑客技术欺骗受害者采取行动，范围范围从点击链接到下载带有恶意链接的附件。电子邮件是钓鱼攻击最为人知的渠道。最常用的某些高针对性钓鱼攻击类型包括：\n\
  \n### 鱼叉式钓鱼 (harpoon Fishing)\n\n一种精心策划的攻击，通过收集和调查目标群体的信息来获得更高的成功率。鱼叉式钓鱼邮件伪装成合法来源，并非可以质疑的随机信息。这些邮件的设计目的是让受害者信任它们，并使其产生本能反应。此类攻击大多发生在假期期间，此时邮件流量非常大，受害者会被诱导进入紧急状态。\n\
  \n在受害者点击恶意链接后，她使用了用户名和密码登录。然后黑客就开始了搜索。鱼叉式攻击可能非常危险。\n\n### 鲸鱼攻击 (Whaling)\n\n鲸鱼攻击针对特定组织领导者的邮箱。首席执行官（CEO）和首席财务官（CFO）目标目标。由于这些管理职位仍然拥有机密信息的权限，攻击这些信息对黑客来说更有利。这包括非常有针对性的攻击。个人和组织都面临风险。\n\
  \n### 病毒、木马、蠕虫\n\n进入受害者系统或网络并持续监控或修改传输的数据和信息的软件。病毒或木马是恶意的，可以跟踪用户数据或通过索要赎金解密密钥来加密用户文件。\n\
  \n病毒、蠕虫、木马和机器人通过其他方式感染计算机系统，但其影响取决于创建时的复杂程度。\n\n### Cookie 窃取\n\nCookie 窃取是指模仿同一网络受害者的\
  \ Cookie。通过使用这些 Cookie，黑客可以访问受害者访问过的网站，并实施恶意攻击。\n\n当黑客访问未加密的会话数据并模拟真实用户时，就会发生 Cookie\
  \ 窃取。用户在公共网络浏览信任网站时会被暴露。\n\n## 计算机欺诈与安全\n\n黑客总是会导致计算机欺诈，黑客试图访问用户的个人信息。这些信息可能包括电子邮件地址、电话号码、用户\
  \ ID、密码甚至身份盗用。\n\n通过访问个人层的信息，黑客试图未经授权访问银行账户、社交媒体账户等以增加损害。如果不是直接获取 ID 或直接密码，黑客会尝试加密文件、推送恶意软件和勒索软件来勒索受害者的钱。\n\
  \n互联网的发展是一场善、恶与丑的博，而“黑客行为”是最丑的部分。如果你也想成为网络安全专家，请参加网络安全课程，将你的职业提升到更高水平。\n\n## 防火墙与保护\n\
  \n大多数家庭和办公室现在都有防火墙，将你的内部计算机网络与互联网的“荒西部”隔离开。好消息是，防火墙的配置变得更加复杂和正确。对于备份内部计算机网络上的设备来说，这是一项工作。现代防火墙现在包含了检测和防止入侵者、过滤电子邮件以及阻止网站。\n\
  \n大多数防火墙都能记录谁在何时做了什么。它们不仅阻止网络外的犯罪分子，还防止内部用户访问互联网上的不当资源。员工可能会被阻止访问浪费公司业务或违反某些安全要求的网站。主要工作时间真的不是更新你\
  \ Facebook 页面的时间！组织不希望他们的医疗和财务服务人员通过即时消息服务与陌生人交流。\n\n防火墙是你网络“网关”的电子等物。有各种潜在的入侵者粉刷着门窗，不力地寻找进入的方法。一个配置当、管理并定期更新的防火墙可以有效保护办公室和家中的计算机网络。在防火墙之后，桌面和桌面服务器必须具有基于本地软件的软件防火墙，它同时也提供杀病毒保护。如果任何东西越过了防火墙，希望内部杀病毒和桌面防火墙解决方案能提供额外的安全保障。\n\
  \n防火墙是合理且足够的，但这里有一个坏消息。你现在听到的和读到的大部分内容并不是由犯罪分子跨越你的防火墙造成的！真正的损害是由那些在你网络内部的人造成的！恶意用户和不诚实的员工一直是祸患。不道德的员工为了金钱泄露信用卡信息或提供安全信息。然而，真正的危险是用户会忽视如今复杂的安全漏洞。最诚实的员工可能在不经意间成为严重安全泄露的源头，导致你个人信息或客户个人及财务信息的丢失。\n\
  \n## 内部威胁与移动攻击\n\n以普通笔记本电脑用户为例。你有多少次去星巴克并坐下？祝你有美好的一天，户外、阳光、宽带互联网连接、无线电话，业务如常运行！如果我告诉你是通过“中间人”组织对星巴克的攻击是多么么没有压力，你余生都会放弃咖啡。你认为你连接了星巴克的\
  \ Wi-Fi，但实际上，星巴克后面那个将无线接入点连接到他 USB 接口的孩子，给了他是你上网网关的印象。自你登录以来，他就监控了你笔记本电脑上的每一个按键。事实上，他现在有了你的用户名、密码以及计算机上的几乎所有内容。如果你回到办公室并在现在注册，你就在公司网络中解锁了一个机器人，它在今天晚上再次可用。\n\
  \n如果笔记本电脑还不够，每个人现在都随身带着智能手机！你知道你的手机存储了你最近使用过的 Wi-Fi 网络列表吗？你记得上次在星巴克等咖啡时检查邮件吗？现在你的手机会在任何看起来像“星巴克\
  \ WiFi，你在吗？”的地方发送标签请求，希望它得到回答并自动连接到互联网。你还记得我们谈过的那个孩子吗？他决定用“是的，我在，跳过来！”来回答你的标签请求。这又是一个\
  \ `MITM` 攻击，以及它在你的智能手机上能做什么，尤其是那些让你的笔记本电脑看起来像金库堡一样的安卓系统！\n\n\n\n\n当我坐在机场候机室的门前消遣打发时，我有时会扫描\
  \ WLAN，看看有多少手机、电脑和 iPad 正在在线并连接。别说我会真的这么做，但我想你可以在不到五分钟内运行 `Netbios` 攻击？人们在移动时，竟然有这么多人都把打印机网络共享选项留着，这真是令人惊讶。在标准配置下，甚至更多的人留下了他们的“网络环境”设置！探索过程总是一样的：映射网络以查看哪些主机已连接；对已知漏洞进行端口分析；使用漏洞工具箱，剩下的工作对于伦理黑客来说就变得无味了。额，另一边是信用卡小偷了。\n\
  \n在保护隐私方面，你的网络浏览器可能是你最大的敌人。你访问的每一个网站、发送的每一封邮件以及点击的每一个链接，都有数百家公司在追踪。你不相信我吗？如果你在使用\
  \ `Firefox`，请安装一个名为 `DoNotTrackme` 的插件，看看发生了什么。假设你是一个普通用户，在不到 72 小时内，你就拥有一份超过 100\
  \ 家公司的列表，他们追踪你在互联网上的每一个举动！这些公司并不为 `NSA` 工作，而是将你的“数字画像”卖给那些愿意为信息付费的人。你的 `GPS` 在哪里？你访问了哪些网站，看了哪些电影，买了哪些产品，选择了哪些关键词？这一切都是由你和你毫无防备的员工刻意报告的。你是否想过，你的竞争对手是否想知道你在网上看到了什么？\n\
  \nIP 电话（语音）系统提供了一套全新的安全漏洞，无耻的分子会利用这些漏洞！最近，我们作为付费入侵检测和入侵测试顾问，在获得客户许可的情况下向一家律师事务所展示了如何通过互联网基于会议室的整个会议，让远处的观察者秘密地监听整个律师办公室。事实上，捕获语音包进行阅读是黑客学校孩子学到的第一个笑话！\n\
  \n`VoIP`、`Bluetooth`、`WiFi`、`GPS`、`RFID`、文件和打印共享，甚至是“云”，构成了可以被轻易利用的漏洞列表。你能做什么？你必须自我教育，并开发你自己的安全计算最佳实践。随着我们变得越来越“布线”和移动化，你需要教育员工和同事我们每天面临的各种漏洞。聘请一名胜任计算机网络安全专家对你的组织网络和防火墙进行“入侵”测试。聘请专业人士进行“黑客攻击”比在被攻击后再修复要容易得多！记住，如果我们可以触及你的网络，我们就会拥有它！\n\
  \n伦理黑客的形成几乎像是一个矛盾体。一个人如何可能既是伦理的又是海盗呢？你需要理解什么是伦理黑客、他是如何接受训练的，以及他在做什么，才能完全理解这种职位的天才之处。\n\
  \n这个职位是独特的。培训教授了每个黑客都会尝试渗透计算机系统的技术。区别在于，他们这样做是为了在漏洞被利用之前发现它们。在漏洞向公众开放之前发现它们可以防止对系统的实际入侵。揭示这些漏洞只是测试系统安全性的方法之一。\n\
  \n尽管黑客攻击能力是相同的，但意图决定了区别。尽管这些人可以一直尝试入侵系统以获得对系统内部功能的控制，但他们这样做是为了寻找保护该弱点的方法。他们识别出渗透区域以便加强它们。要阻止一个黑客，你必须像黑客一样思考。\n\
  \n这样的人所接受的培训必须是广泛的。需要深入理解黑客入侵系统的方式，以便所采取的防御措施足以阻止任何真正的黑客。如果你忘记了系统中的一个漏洞，你可以肯定会有某种不道德之徒会利用这个漏洞。\n\
  \n他们提供多种课程来促进这种培训。一个全面的网络安全课程可以为感兴趣的人从事实地工作做好准备。这种对攻击和防御措施的理解对于该职位至关重要。这包括知道在系统被侵入时该做什么、调查攻击尝试以及追踪网络犯罪。\n\
  \n伦理黑客受公司聘佣来测试其网络的渗透性。在一个与先进技术相关的犯罪日益频繁的世界里，他们的努力有助于信息和系统的安全。发现网络漏洞并不是一项简单的任务，因为在这一层面，攻击和防御技术正在不断变化和演变。\n\
  \n六个月前还是安全的，现在可以轻松解决。对最新黑客技术的掌握已如指掌。它总是在变化。这些熟练的人执行风险分析，并帮助不同的协作领域以确保整个系统的高水平安全。接受培训的人甚至致力于开发新软件，一旦识别出漏洞并采取了预防措施，软件就会被实施。\n\
  \n随着越来越多的商界人士无意或有意地访问公共可用的计算机系统，伦理黑客的培训领域将不断扩大。企业信息、银行信息和个人信息的安全基于保护这些信息免受外部攻击的能力。这种培训引导一个人像外部渗透者一样思考，比游戏领先一步，并保护他们被聘佣保护的信息。谁知道还有一种好黑客呢？\n\
  \n## 黑客攻击 (HACKING)\n\n社会工程学 / 黑客攻击都可以作为破坏个人或公司隐私数据的手段，也可以作为后续破坏的手段。\n\n常用的攻击方法之一是让某人在连接网络的计算机上使用受感染的\
  \ `USB` 优盘。两天前我刚做过一次（没有恶意软件）。我拨了酒店前台电话，询问是否可以给他们发一份可以打印的文件，因为我忘记带一份用于法庭法医证词的简历副本了。“不，”收银员说，“但你有启动盘吗？”然后她将我的闪存器插入了两个不同的电脑中，并将屏幕转向我的方向，以便我可以要求她打开各种文件进行打印。\n\
  \n同样，伊朗核研究设施曾有一台连接到本地计算机的受感染的未经授权 `USB` 读卡器，读卡器上装载了恶意软件（`Stuxnet`）。虽然据测有一名以色列特工实际上向该处插入了一个或多个\
  \ `USB` 优盘，但并不知道那个人留下了几个，还是他/她插入了硬盘本身。在任何情况下，配置计算机不识别连接到 `USB` 端口的闪存器是非常容易。被认为第一次成功的网络战争行动可能仅仅是这种结果，导致另一个人可以拿到另一个吸引人的设备，并在一个极缺乏保护的系统中单独使用它。\n\
  \n在写本文时，Target 商店正处于全面的声誉修复模式，因为其销售点刷读器中约有 1 亿张信用卡遭到破解。连续几周，黑客每天晚上都冲向一个目标服务器，下载数千条信用卡记录。\n\
  \n\n\n但恶意软件是如何感染服务器和 POS 设备的？如果我们相信安全研究人员的话，该漏洞可能源于内部。在没有内部破坏者的情况下，可能是一个疏忽的目标员工（可能来自\
  \ IT 部门）被官方电子邮件中的一个链接误导——该邮件显然来自他的银行、经理或管理层，或者是联系人——去访问了一个极吸引力的网站，从而泄露了重要的权限信息，这些信息随后被传递给了黑客。又可能是有人说服了一位热心的员工从\
  \ USB 盘中打印一份小文档。\n\n现在，银行家正在通过打电话和调查人员，从毫无防备的受害者身上收集更多具有破坏性的信息，作为第二波社会工程攻击。\n\n\
  尽管存在高明的黑客（例如最终将他们整合到 Target 设备的恶意软件作者），但最薄弱的环节、因此也是对黑客来说最可行的方法就是那些鲁莽的个人。\n\n2008\
  \ 年，1000 万名毫无防心的美国人的信用卡信息被盗。2012 年这个数字是 1500 万。在 2013 年的最后一个月，超过了 1 亿。现在智者有了一些规范准则：\n\
  \n**不要**分享你的社会安全号码，特别是不要通过电话或电子邮件，并且不要将其作为标识符。通常情况下，只需将其交给你的雇主、你的金融机构和当局即可。\n\n\
  在少数例外情况下，当你在那里时，**不要**点击电子邮件嵌入的链接——尤其是来自你不认识的人的链接。不点击认识的人提供的链接可能是一个好主意。在浏览器中手动输入\
  \ URL 或域名信息更安全。不要与第三方共享密码。即使是技术支持也不需要这些。不要成为那个在打印他人简历时不小心感染整个网络的热心人。\n\n有一些课程专门培训社会工程学领域的道德和不道德盗徒，并有像\
  \ Hadnagy 的《社会工程学：人类盗窃艺术》等此类主题书籍。成千上万个不道德的人学习了这些课程，现在正在寻找像你这样热心的灵魂。采取预防措施，不要让社会工程工程师骚扰你。\n\
  \n# 黑客是如何工作的\n\n黑客或道德黑客使用入侵测试技术来测试公司的 IT 安全并识别漏洞。IT 安全人员利用这些入侵测试的结果来修复漏洞、提高安全性并减少业务风险因素。\n\
  \n渗透测试绝不是一项偶然的任务。这需要大量的计划，包括管理层对进行测试的明确批准，然后运行尽可能安全的测试。这些测试通常涉及攻击者实际破入网络时使用的相同技术。\n\
  \n## 背景和所需的培训\n\n白帽黑客涉及大量的问题解决以及沟通技巧。白帽黑客还需要智能与常识之间的平衡、强大的技术和组织能力、恰当的判断力以及在压力下保持冷静的能力。\n\
  \n同时，白帽黑客必须像黑帽黑客一样思考，具备他们邪恶的目标、能力和狡猾的行为。一些最好的白帽黑客是以前黑帽黑客，由于各种原因决定离开犯罪生活，并以积极（合法）的方式使用他们的技能。\n\
  \n白帽黑客没有官方的培训标准——任何组织都可以对这项工作设定自己的要求——但信息安全、计算机科学甚至数学的学士或硕士学位可以提供坚实的基础。\n\n对于那些没有所属大学的人来说，军事训练（特别是情报领域）可以帮助确保你的简历获得人力资源经理的关注。对于想要或需要雇用已获得安全审查人员的雇主来说，兵役也是一项资产。\n\
  \n## 相关认证\n\n许多安全认证和安全黑客证书可以使候选人更容易入门，即使没有很多实践经验。\n\n欧洲委员会颁发的 `CEH` 认证（认证道德黑客）是一个推荐的起点。`CEH`\
  \ 是一个厂商中立的称号，获得 `CEH` 认证的的需求很大。根据 PayScale 的数据，道德黑客的平均工资接近 80,000 美元，上限可以超过 100,000\
  \ 美元。在顾问方面，欧洲委员会表示，`CEH` 专业人员每个合同或短期任务可以获得 15,000 至 45,000 美元的报。\n\n中级 `CEH` 证书侧重于系统破解、枚举、社会工程学、SQL\
  \ 注入、木马、蠕虫、病毒和其他形式的攻击，包括拒绝服务。申请人还必须具备密码学、渗透测试、防火墙、蜜罐等深入知识。\n\n欧洲委员会建议没有以前工作经验的候选人参加为期五天的\
  \ `CEH` 培训。要通过课程，参与者必须具备 `Windows` 和 `Linux` 系统管理知识、`TCP / IP` 知识以及虚拟化平台的基础。然而，也有自学的机会帮助候选人通过所需的个人考试。请注意，`EU\
  \ Council` 要求申请人至少具有两年信息安全经验，并支付 100 美元的注册费。\n\n成为一名认证的白帽黑客也意味着留在黑客行为的一侧，绝不进行非法或不道德的攻击，并始终保护他人的产权。作为认证程序的一部分，申请人必须同意\
  \ `EC 代码准则` 并绝不接触黑客或恶意活动。\n\n除了 `CEH` 之外，`SANS GIAC` 程序值得关注。该组织到目前已提供了 81,000 多份参考。从\
  \ `GIAC Cyber Defense Forums` 开始的候选人可能更好地完成活跃、受尊重且全面的安全培训。`GIAC Penetration Tester`\
  \ (`GPEN`) 以及 `GXPN` 是对于职业黑客的显著论据。\n\n另一组道德黑客认证来自 `mile2`。该组织的网络安全认证路线图包括认证漏洞评估员（`CVA`），然后是认证专业道德黑客（`CPEH`）、认证渗透测试工程师（`CPTE`）和认证渗透测试高级顾问（`CPTC`）。此外，符合条件的美国退伍军人可以使用他们的\
  \ GI 法案福利获得网络安全认证。\n\n## 取证科学中的相关认证\n\n对于在信息安全领域工作的人来说，对计算机取证感兴趣总是建议的。对安全调查部分感兴趣的人，可以继续查看\
  \ `EC-Conseil 认证列表`，然后讨论计算机入侵取证调查员（`CHFI`）认证。\n\n`CHFI` 侧重于取证调查过程并使用适当的工具和技术获取证据和计算机数据。作为\
  \ `CHFI` 认证培训的一部分，候选人还学习了如何恢复删除的文件、解码密码、分析网络流量以及使用各种取证调查工具收集信息。\n\n其他值得的取证证书包括取证认证的\
  \ `GIAC 取证分析师` (`GCFA`)、取证技术人员以及高科技犯罪网络的计算机犯罪研究员。\n\n## 渗透测试的物理侧面\n\n\n\n最后一点：渗透测试的所有方面并不都是数字化的，而且并不总是基于数字追踪方法或手段。安全专家通常指的是网站或设施的安全特性，以及与进入或个人使用设施或设备相关的**物理访问控制**，即“物理安全”章节。一次全面的渗透测试还会尝试危及或绕过**物理安全**。\n\
  \n受过训练的入侵测试员可能会尝试穿过大门，在尝试绕过读卡器或键盘访问控制系统时让别人关上门，或使用其他形式的社会工程学来绕过物理安全控制和障碍。由于在攻击自身的安全防护和物理安全之前首先需要对设备进行装备，因此物理安全以及相关的控制、程序和安全规则与安全屏障数字侧的类似措施同样重要。\n\
  \n大多数信息安全认证，包括 `CISSP`、`CISM` 和 `Security +`，都包含了候选人在准备测试期间必须学习和理解的物理安全通用知识。对于对物理安全特别感兴趣的人，ASIS\
  \ International 的 `PSP`（物理安全专业人员）证书可能是物理安全认证的终极奥义。对于那些希望了解全面渗透测试方法、途径和技术的人（特别是物理安全领域的人）来说，咨询他们是值得的。\n\
  \n想要信息安全（InfoSec）工作并具备相关先知识和一两个认证的候选人，在立即寻找黑客工作方面不会遇到困难。随着时间的推移，你将从持续教育和认证中受益，引导你的职业生涯走向你想去的地方。\n\
  \n从信息安全分析师到安全经理，网络安全职业的需求非常大。特别是这种职业被无数大公司看好。\n\n让黑客来吧！黑客和“伦道德”黑客工作中的行为之间存在细微差别。我们所知的黑客非法入侵并通过利用系统的错误和弱点来破坏系统。大多数黑客都有从中获利的狡猾动机。\n\
  \n另一方面，“伦道德”黑客正试图渗透系统以帮助他们工作的组织，改进安全措施，修复漏洞并修复系统弱点。所以，戴上你的“白帽”，看看成为“伦道德”黑客的五个顶级建议。\n\
  \n# 学习知识\n\n探索技术世界，从学习不同编程语言的编码，到理解操作系统和网络的运行。作为一名伦道德黑客，这些常见技能都是所需的且需要不断提高。\n\n\
  通过工作获得经验。多年的工作自然会提高你的技能并培养你在黑客领域的专业精神。记住，经验需要耐心和努力才能实现你的最终目标。\n\n## 你能力的有益处\n\n\
  成为一名伦道德黑客不仅需要手动技能。黑客需要了解破坏防火墙和加密代码的不同方法。网络安全是一个工作风险较高的领域。你必须依靠的不仅仅知识和经验。黑客必须向“系统之外”思考才能进入系统。通过这种方式，正在采取改进和安全措施来保护网络，并使系统变得更加无不可摧。\n\
  \n## 始终尝试中断代码\n\n每次你通过渗透测试，都是向改进安全迈一步，也是向创建一个无不可摧的系统迈一步。这对大众有好处。\n\n## 获得认证\n\n\
  如果你不知道你的资质，没有人会雇佣你，即使你有处理系统的技能。我那些渴望成为黑客的人中没有一个写信我要求同样的事情。“成为一名优秀的黑客需要什么技能？”\n\n\
  黑客技术是信息技术中要求最高的学科之一，需要广泛的技术和计算技术知识。要真正成为一个大黑客，你必须掌握许多技能。如果你不具备这里列出的所有技能，请不要气馁，而是将此列表作为你近期需要学习和掌握的起点。\n\
  \n这里是我进入精英殿堂所需的技能概列表。我将技能分为三类，以便从之前的一行移动到下一行——基础、中级和软技能——并提供了指向零字节以上的文章链接，你可以熟悉它们。\n\
  \n### 基础知识\n\n这些是每个黑客在尝试破解之前应该知道的基础提示。如果你理解了本节的所有内容，就可以进入中级阶段。\n\n### 1. 基础计算机技能\n\
  \n无需解释，你必须具备基础计算机技能才能成为黑客。这些能力超越了创建 Word 文档或浏览网页的能力。你需要的是能够访问 Windows 命令行、更改注册表并配置你的网络设置。\n\
  \n许多这些常见技能可以通过如 `A+` 等计算机技能课程获得。\n\n### 2. 网络能力\n\n你需要了解网络操作的基础知识，如下：\n\n- `DHCP`\n\
  - `NAT`\n- `subnet`（子网掩码）\n- `IPv4`\n- `IPv6`\n- 公网与私人 IP\n- `DNS`\n- 路由器和交换机\n\
  - `VLAN`\n- `OSI 模型`\n- `MAC 地址`\n- `ARP`\n\n你对这些技术工作原理的理解越深，你就越成功。请注意，我没有写以下两个指南，但它们非常有启发性，并涵盖了上述某些网络基础知识。\n\
  \n- 黑客基础：两个标准的故事\n- 全球网络数据包转发指南\n\n### 3. LINUX 技能\n\n开发 Linux 技能对于成为黑客至关重要。我们使用的几乎所有的工具都是为\
  \ Linux 设计的，Linux 给了我们 Windows 上没有的功能。如果你需要提升 Linux 技能，或者你是 Linux 新手，可以阅读网上任何 Linux\
  \ 入门教程。\n\n### 4. WIRESHARK 或 TCPDUMP\n\n`Wireshark` 是最常用的嗅探/协议分析器，而 `tcpdump` 是一个命令行嗅探/分析器。两者对于分析流量和\
  \ TCP/IP 攻击都非常有用。\n\n- Wireshark 简介与 OSI 模型\n- 适用于监听器的 Wireshark\n\n### 5. 虚拟化\n\
  \n你需要掌握一个虚拟化软件包，如 `VirtualBox` 或 `VMWare Workstation`。通常，你需要在现实世界之外在一个安全环境中进行练习。虚拟环境为你提供了一个安全的环境，用于测试和调整你的攻击手段。\n\
  \n### 6. 概念与安全技术\n\n优秀的黑客能够识别并理解安全概念和技术。绕过安全管理员设置的障碍的唯一方法就是了解它们。黑客必须包括公钥基础设施 (`PKI`)、安全套层、入侵检测系统\
  \ (`IDS`) 和防火墙。缺乏经验的黑客可以通过基础安全课程获得许多此类技能，例如：`B. Security +`。\n\n- 阅读和编写 `Snort`\
  \ 规则以逃逸 IDS\n\n### 7. 无线技术\n\n要破解无线，你必须了解它是如何工作的。例如加密算法（`WEP`、`WPA`、`WPA2`）、四次握手和\
  \ WPS。此外，你必须了解连接和认证协议以及无线技术的法规要求。\n\n想要了解更多不同类型的加密算法以及使用无线网络术语和技术的示例，请阅读我们关于破解 Wi-Fi\
  \ 的指令集。\n\n- Wi-Fi 术语和技术的入门\n- 黑客破解 WLAN 的指令\n\n\n\n这将非常有趣，并且让你对自己的黑客技巧有一个直观的认识。如果你了解所有这些信息，将获得更直观的攻击手段，每一击都能命中，而不是像另一个黑客那样。\n\
  \n# 8 脚本编写\n\n如果没有脚本技能，黑客必须使用其他黑客的工具。这限制了你的效率。随着安全管理员采取防御措施，每天都会有新的工具失去效力。\n\n要开发你自己的工具，你必须至少掌握一种脚本语言，包括\
  \ `BASH` 壳。这应该包括 `Perl`、`Python` 或 `Ruby`。\n\n# 9 知识基础\n\n如果你想能够破解数据库，你需要理解数据库及其工作原理。这包括\
  \ `SQL` 语言。我还会建议使用领先的数据库管理系统之一，例如 `SQL Server`、`Oracle` 或 `MySQL`。\n\n在开始之前你需要了解的先决条件和技术\n\
  \n# 10 Web 应用程序\n\nWeb 应用程序可能是近年来黑客最肥沃的土壤。你对 Web 应用及其支持的数据库的工作原理理解得越深，成功率就越高。此外，你可能还需要创建自己的网站，用于钓鱼或其他有害目的。\n\
  \n# 11 取证学\n\n你不为了被捕而成为一名优秀的黑客！你无法成为在监狱里坐 5 年的职业黑客。你对数字取证了解得越多，就越能避免检测并规避它。\n\n\
  # 12 高级 TCP / IP\n\n缺乏经验黑客需要理解 `TCP / IP` 的基础，但要达到中间水平，你需要理解熟悉的栈细节和 `TCP / IP` 协议字段。这包括\
  \ `TCP` 和 `IP` 数据包中的每个字段（`flags`、`windows`、`df`、`tos`、`seq`、`ack` 等）如何被操纵并用于攻击受害者系统（例如中间人攻击）。\n\
  \n# 13 密码学\n\n虽然你不成为密码学家也能成为一名优秀的黑客，但你对自己的优缺点了解越深，克服任何加密算法的机会就越大。此外，黑客可以使用密码学隐藏他们的活动并避免检测。\n\
  \n# 14 反向工程\n\n反向工程允许你打开恶意软件并使用额外的功能对其进行重建。就像软件开发一样，没有人会从零创建一个应用程序。几乎每个新漏洞或恶意软件都会使用其他现有恶意软件的组件。\n\
  \n此外，反向工程允许攻击者恢复现有的漏洞并更改其签名以绕过 `IDS` 和 `AV` 检测。更改 `metasploit` 有效负载的签名以避免音视频识别。\n\
  \n### 无形技能\n\n除了所有这些计算机技能外，成功的黑客必须具备非物质技能。其中一些技能涉及以下内容：\n\n# 15 创造性思考\n\n破解系统**总是**有方法的，也有多种实现方式。优秀的黑客可以针对同一个攻击目标从多种方法进行创造性思考。\n\
  \n# 16 解决问题的能力\n\n黑客仍然面临看似不可解决的问题。这要求黑客习惯于分析性思考和解决问题。这通常要求黑客准确诊断错误，然后将问题拆分为各个组件。这是通过大量小时练习才能获得的技能之一。解决问题是黑客的一项基本技能。\n\
  \n# 17 耐力\n\n黑客必须坚持。如果你在开始时失败了，请尝试。如果仍然失败，请提出一个新方法并再次尝试。只有拥有体力，你才能破解最安全的系统。\n\n\
  还没有决定是否学黑客吗？这本书提供了大量信息，作为你进入以太黑客世界需要学习和掌握内容的指南，并为你提供保护自己免受网络攻击的信息。\n\n# 保护企业免受网络犯罪影响\n\
  \n网络犯罪变得日益有利，利润超过了其他犯罪形式。不幸的是，市场准入门槛很少，勒索软件甚至作为订阅服务可用。被捕获的概率也很低，因此严重后果的风险并不是一种有效的威慑。随着业务日益数字化，日益脆弱的系统支撑并管理着关键服务以及我们日常生活的各个方面。\n\
  \n攻击面和网络安全后果持续令人震惊地增长。威胁格局带来了一个适用于组织所有层的重要问题。你如何保护你的业务免受网络安全威胁？\n\n企业的威胁包括来自经验丰富的高级者的攻击。然而，仍然有大量的恶意软件、勒索软件、病毒、机会性攻击、社交工程和许多常见威胁的尝试。这对许多组织来说将是一场灾难。\n\
  \n无论你目前的安全计划状况如何，都有办法加强防御以应对这些尝试或减轻潜在损害。\n\n## 1. 网络安全评估\n\n如果你不知道自己现在在哪里，就不可能建立充分的防御。定期进行网络安全评估是任何良好安全计划的关键部分，因为它们突出了你正在建立的优势和你可以改进的短处。\n\
  \n从评估开始将让你清楚地了解如何保护你的环境，这样你可以优先考虑资源，避免浪费精力而浪费时间和金钱。如果你已经掌握了标准的差距分析，请继续使用风险管理方法进行下次网络安全评估。设定正确的优先级并分析你可以纠正的元素。\n\
  \n## 2. 员工培训\n\n你的强度取决于你最缺乏知识的员工。攻击者知道如何找到进入其系统和网络的入口。这可能是一个密码脆弱且毫无防备的员工，也可能是对钓鱼或社交工程充满热情的员工。确保你的团队学习网络罪分子如何胜过他们，如何识别电子邮件或可疑电话，特别是当他们是合法的朋友或其他服务时。告诉他们如何保护组织免受这些尝试。\n\
  \n记住制定与网络安全最佳实践一致的强大政策，并确保你的团队熟悉它们。此外，作为意识提升计划的一部分，培养团队氛围。鼓励所有团队成员互相帮助，成为你安全团队的延伸。\n\
  \n## 3. 保持软件更新\n\n公司使用的任何软件必须是最新版本。旧应用程序容易受到零日攻击和漏洞的影响，这些可能会窃取信息、渗透网络并造成严重损害。\n\n\
  虽然杀病毒软件会自动更新，但其他程序可能没有此功能。至少每两周检查一次所有主要软件程序。考虑实施漏洞管理流程，寻找缺失的补丁和漏洞。然后确保应用了所需的补丁和更新。\n\
  \n## 4. 对威胁的持续监控\n\n攻击可能随时随随地发生。实施 24/7 监控以保持警惕，并在攻击造成损害之前捕捉它们。安全事件和故障监控 (`SEIM`)\
  \ 软件可以提醒你可疑的用户活动或数据异常，这些可能表明正在进行攻击。运营中心的安全服务通过安全分析师提供额外支持，这些人员接受过解释警报和识别报告事件人员的培训。此外，他们知道如何迅速行动以停止攻击。\n\
  \n## 5. 应急计划\n\n在你实施的所有防御和保护功能中，全球策略的一部分是假设它们永远不会 100% 有效。一个设计良好且全面的事件响应计划允许你在组织遭受成功攻击时快速有效地做出反应。\n\
  \n\n\n一个良好的应急预案定义了适当的升级路径。一旦发生问题，配备最完备设备的团队成员将立即收到通知。这将确保每个人都理解所需的步骤、谁负责响应的哪个部分，以及在需要时如何与公司高管、外部利益相关者和公众进行通信。\n\
  \n## 6. 低特权访问管理\n\n在评估你的团队使用的工具时，请确保你已经花时间为团队成员、角色、级别或特定角色组定义了访问权限。简而言之，确保只有你的管理员才能访问工具、系统或网络的所有功能。\n\
  \n其他员工应仅能访问与其工作相关的功能、数据和区域。当攻击者获取了某人的凭据时，他们能造成的损害将局限于仅针对该人员定义的权限。\n\n## 7. 物理安全\n\
  \n当你专注于备份数字资产时，不应忽视保护物理环境的重要性。在许多情况下，现场攻击者以及物理进入建筑或数据中心的人员可以访问凭据、商业秘密、基础设施架构图和其他有用且可操作的信息。\n\
  \n使用经过证明的安全方法，如护照访问、摄像头监控和访客监控策略。此外，还要让你的员工在办公室外注意保护自己的环境，例如在旅行或访问当地咖啡店时注意远程办公。当员工位于家庭办公室的安全区域之外时，保持通话和对话以及在这些外部环境中保持屏幕隐私，是你应该考虑的提示之一。\n\
  \n## 8. 外部网络情报\n\n虽然使用网络安全评级来不断寻找盲点是无价的，但必须实现相关功能，以便在发生入侵或干扰时持续监控你的系统、网络和环境。可疑活动对于监控网络同样重要，而且外部环境可能会影响到你。\n\
  \n网络情报是有效网络安全计划的重要部分。通过暗网监控和其他网络情报方法，你可以更好地了解正在计划哪些攻击、哪些犯罪网络可能针对你，以及他们计划如何实施。你还可以识别可能已经存在地下市场的凭据或信息。凭借这些知识，你可以制定精确的防御策略。\n\
  \n## 9. 评估第三方的风险\n\n许多影响全球主要品牌的重要安全漏洞事件都始于攻击者在小型供应商和第三方供应商发现的漏洞。如果你想与供应商合作，请确保网络安全实践是你的验证流程的一部分。你正在做什么来保护和维护你的网络、系统和数据？你们的数据销策略是什么？你是否遵循适用于你的规则？在控制员工方面，你是否像在其他方面一样警觉？为主要供应商实施安全审查流程、定期更新评分，并尽可能与事件协调和威胁监控集成，将有助于确保他们维持市场份额而不会让其业务数据处于风险安全状态。\n\
  \n## 10. 警惕设备被盗\n\n如果你的业务通过 BYOD（（自带设备）策略使用笔记本电脑、平板电脑或其他移动设备，你就有了一种远程保护数据的方法。在最好的情况下，你需要跟踪设备；在最坏的情况下，当设备被盗时关闭连接选项。至少确保使用加密来保护可以存储在设备上的信息。虽然网络犯罪主要涉及互联网上的数字信息，但设备丢失始终是一个可能。攻击者可以从一个被盗的设备访问各种信息。请对此类事件做好准备。\n\
  \n保护你的业务免受威胁需要用心和有效的策略。不仅要尝试防止违规，还要确保在发生违规时尽快通知公司，这至关重要。时间紧迫。及时更新安全软件补丁。定期维护操作系统的安全性对于其随时间的有效性至关重要。\n\
  \n对于勒索，网络犯罪分子可能会威胁关闭计算机系统或删除数据、用病毒感染公司、发布关于客户或员工的机密信息，或发起安全攻击 `denial-of-service\
  \ attack`（拒绝服务）或控制社交媒体账号。\n\n企业可以采取以下十一步骤保护自己免受勒索：\n\n### 了解你的数据\n在了解数据的性质和数量之前，企业无法确切知道风险是什么。创建文件备份、以及带宽保护功能。这有助于公司在发生勒索时留存其信息。\n\
  \n### 培训员工识别危害\n所有员工都必须学会定期保护他们所处理的信息，这是重要的。对员工进行背景检查。员工背景检查可以帮助确定他们是否有犯罪记录。限制系统的管理权限和社交足迹。访问机密信息的员工越少越好。\n\
  \n### 确保系统具有足够的防火墙和防病毒技术\n在安装适当的软件后，评估软件、浏览器和电子邮件程序的安全设置。选择最符合你公司需求且不增加风险的系统选项。\n\
  \n### 拥有防止数据泄露的工具，包括入侵检测\n确保人员确实在监控检测工具。不仅要尝试防止违规，还要确保在发生时尽快通知公司，这至关重要。\n\n### 包含\
  \ DDoS 安全功能\n能够避免或防御可能击垮或影响你系统的攻击是非常重要的。制定一个处理数据泄露的计划。在发生违规时，应制定一个清晰的协议以识别事件响应小组及其角色和职责。\n\
  \n### 使用专为处理网络风险设计的保险范围保护你的业务\n网络保险通常针对数据泄露和勒索相关的数据。正确的保险计划还能让合格的专业人士从头到尾参与事件。\n\
  \n\n\n\n如果黑客对你的业务发起网络攻击，会发生什么？他们会成功吗？你还能轻松访问公司的机密信息吗？还是说他们的尝试会失败？信不信，网络安全不仅仅关乎大企业。这是小企业也需要警惕的事。。\n\
  \n请考虑以下关于小型企业安全的统计数据：\n\n- 43% 的网络攻击针对的是小型企业。\n- 仅 14% 的小型企业认为他们缓解网络风险、漏洞和攻击的能力非常有效。\n\
  - 60% 的小型企业在遭受网络攻击六个月内停止了运营。\n- 48% 的数据泄露是由恶意行为造成的。其余的由人为错误或系统故障引起。\n\n如果你拥有一家小型企业，你就不能忽视这些统计数据。你不希望自己的业务因为没有采取适当的保护措施而遭受损失。\n\
  \n你付出了这么多努力，不应该让公司受到黑客的威胁，对吧？在本文，你将了解到为什么关注网络安全如此重要。你还将学习如何维护和保护你的业务。\n\n# 为什么小型企业应该担心网络安全？\n\
  \n我知道你在想什么。你认为你的业务太小了，没人会想黑它。很容易想象，一家小型企业永远不会面临网络安全问题。这很有道理，对吧？如果你听到某公司被黑，那通常是像\
  \ `Target` 或 `Sony` 这样的大品牌。\n\n然而，这些并不是唯一的目标。\n\n这可能很难置信，但黑客也会针对小型企业。你只是没有听到相关消息，因为媒体不会谈论涉及小型企业的盗版或攻击。黑客攻击小型企业有几个原因，包括：\n\
  \n- **小型企业不重视网络安全**：让我们诚实吧。大多数小型企业主并不重视网络安全。他们认为自己太小，不会吸引黑客的注意。然而，这是小型企业被黑客的主要原因之一。黑客知道大多数小型企业主没有在网络安全上投入资金。为什么？因为小型企业主认为他们没有什么值得被偷的。这使其成为一个简单的目标。黑客很有可能正在寻找某些东西：客户的支付信息。\n\
  \n- **他们拥有黑客想要的信息**：你的公司可能没有 `Target` 或 `Starbucks` 那么大……但没关系。你为你的产品和服务付费了，对吧？这意味着你拥有黑客想要的东西。你有客户的支付信息。你有来自员工的信息。\n\
  \n优秀商业局协会揭露，7.4% 的小型企业主曾被欺骗。作为企业主，你拥有关于客户和员工的信息。这些信息对黑客来说就像黄金一样珍贵。如果你的系统不安全，这些黑客可能会获取支付信息和社会安全号码。你必须确保这些信息得到保护。\n\
  \n# 如何保护你的小型企业免受网络攻击\n\n所以我已经向你展示了，小型企业并不意味着你就不可能被黑客攻击。但如果你很聪明——我知道你是——你可能在想如何保护你公司的信息。这就是本文下一部分的内容。\n\
  \n## 购买网络保险\n\n保险不仅仅是为了你的汽车、房子或医疗账单。你也可以为你的业务购买保险。事实上，每家企业都应该购买某种商业保险。\n\n但还有网络安全保险。如果你是一家小型企业，你需要它。当然，我们都希望不会发生安全泄露。但希望是不够的。你必须确保你的业务受到了保障。\n\
  \n网络责任保险旨在防止你的业务遭受各种网络安全威胁。在发生安全泄露和公司责任之后，你可能被要求向法院支付巨额资金。这会让大多数小型企业陷入瘫痪。如果你有网络责任保险，你就不必担心这个问题。如果你购买了正确的保险类型，你的法律费用将被涵盖。\n\
  \n## 制定密码策略\n\n许多网络攻击的发生是因为你的员工使用的密码太简单。如果你的团队没有经过培训，他们可能会使用太容易破解的密码。这种情况经常发生。\n\
  \n出于这个原因，你需要创建并建立一个有效的密码策略。你可能无法阻止任何攻击，但你完全可以减慢顽固黑客的速度。如果你的系统不容易被破解，它可以让攻击者望而却步。你会转向另一个不像你这么聪明的小企业主！\n\
  \n幸运的是，这很容易。你需要确保你的团队成员的密码包含大写字母和小写字母、数字和符号。是的，我知道这可能很痛苦，但业务的安全是值得的。此外，你必须要求员工每月重置一次密码。\n\
  \n## 使用虚拟数据室 (VDRs)\n\n虚拟数据室是保护你业务信息的极佳方式。它们方便了你的员工进行敏感数据的交换。虚拟数据室是一个公司可以在其中存储数据的在线库。它们通常用于财务交易。对于攻击者来说，访问存储在\
  \ `VDR` 中的信息将非常困难。\n\n公司可以在 `VDR` 中存储多种类型的信息：\n\n- 财务信息\n- 法律文件\n- 税务文件\n- 关于知识产权的信息\n\
  \nVDR 是确保你的敏感信息安全的绝佳方法。\n\n- **与专家交流**\n是的，大多数企业都避免这样做。但你不应该这样做。聘请计算机安全顾问的费用可能看起来有点贵。但这是一项伟大的投资。\n\
  \n如果你的家里漏水，水积聚在浴室里，你会尝试自己修理吗？可能不会。你可能会找工人，对吧？为什么？因为像我们大多数人一样，你并不懂管道。同样的原理适用于计算机安全。\n\
  \n如果你担心网络安全（你确实应该担心），请考虑咨询专家。\n\n\n\n\n如果你拥有一家小型企业，你必须认真对待网络安全。不要因为你的公司不是大公司就认为你的业务不是目标。\n\
  \n你对你的团队和客户有确保确保公司安全的义务。防止网络攻击应该是你的首要任务之一。如果你采取了正确的行动，就不必担心让业务面临风险。\n\n现在，各种规模的企业都是网络犯罪分子的目标。根据威疆\
  \ 2018 年数据入侵调查报告（DBIR），58% 的数据泄露受害者是小型企业。此外，令人震惊的是，根据国家网络安全联盟的数据，60% 的小型企业在遭受攻击后六个月内关闭了。是什么让这些小企业容易受到网络攻击呢？可能是由于预算限制导致资源匮乏，以及认为只有大型组织会被黑客攻击的错误观念。\n\
  \n然而，各种规模的企业都必须抵御网络攻击者。我开发了一些实用的预防措施来保护你的业务免受网络攻击。\n\n### 培训你的员工\n员工是你最大的工具，但也是最大的安全风险。因此，你的首要行动应该是提高员工的安全意识。这有助于减少意外或故意数据丢失的情况发生。需要记住的一个重要点是，培训员工不是一项一次性的任务。这应该定期进行，以确保你的员工了解最新的网络威胁。这有助于他们谨慎地处理安全漏洞和威胁。\n\
  \n### 管理你的密码\n密码是访问公司机密信息的钥匙。在为业务创建和管理密码时，遵循一些基本规则是非常重要的。\n\n- 始终将默认密码更改为非常独特的密码\n\
  - 避免为不同账户创建并使用相同的密码\n- 确保你的密码被安全存储。使用 `password manager`（密码管理器）。永远不要将密码写在他人可以接触到的纸上。\n\
  - 按照指令创建强密码。使用大写字母、小写字母、数字、符号等的组合。\n\n### 保持你的技术处于状态\n操作系统和企业系统应用程序必须保持最新更新，因为这确保了安装最新的安全补丁。此外，每个系统都必须安装防火墙和病毒防护软件。确保它们都处于激活状态、已更新，并以正确的设置安装。微软操作系统带有标准的防火墙，你必须激活它。然而，强烈建议投资可靠且先进的\
  \ PC 杀毒软件。毕竟，购买杀毒软件的成本远低于成为网络攻击的受害者。\n\n### 保持备份以限制损失\n随着勒索软件攻击数量的增加，数据保护的重要性变得显而易见。最好的方法是数据的副本，而不是冒向黑客支付赎金的风险。如果有备份，企业在遭受攻击后可以恢复正常。定期对你的公司数据进行备份，因为有助于从当前时间点进行恢复。备份必须始终保留在独立的系统中。\n\
  \n### 对你的代码进行定期测试\n你网站的代码和托管是业务安全的一个重要方面。让你的内部信息安全团队对你的网站进行全面测试以检查安全错误，或者租用专业人员。错误或过时的代码可以帮助黑客访问你的网站并造成损害。此外，确保你的网站托管来自可靠的托管公司。记住为你的网站获取安全证书，因为它能以合理的价格保护网络上的有害内容。\n\
  \n### 获取终端安全解决方案 (EPS)\n完整的终端防护让你放心，因为你拥有对设备、应用程序和网络安全的控制权。`EPS` 文件为你企业中所有攻击者用来启动恶意软件的终端提供保护。针对中小企业的\
  \ `EPS` 预防解决方案需要少量的投资。但作为企业，你必须考虑此类解决方案提供的安全价值。\n\n## 发生侵害时该怎么办？\n\n如果你已经遭受了网络攻击，你必须采取以下行动：\n\
  \n### 检查一切\n首先，你需要知道在数据泄露期间丢失或被盗的数据类型。是通用形式的数据，如地址、姓名等吗？是更敏感的数据，如电子邮件地址、信用卡/借记卡号吗？还是丢失的数据极其敏感，例如：密码、网银凭据、信用卡/借记卡安全代码等？\n\
  \n### 立即更改。采取行动\n根据数据丢失的类型，你需要采取行动。例如，如果密码丢失，你必须立即更改所有凭据、`Web` 以及其他凭据。确保两个账户不重复使用密码，并且它们与丢失的账户完全不同。为了增加额外的保护，你可以使用\
  \ `two-factor authentication`（双因子身份验证）。即使网络窃窃拥有正确的密码，只有通过 `two-factor authentication`\
  \ 生成的安全才能进入。如果丢失的信息包含网银凭据，通知银行或发卡机构非常重要，因为他们可能会暂停你的卡以防止未经授权的交易。此外，他们可能会发放新卡以确保你的安全。\n\
  \n### 通报违规情况\n你的客户应该意识到他们的业务受到了侵害。因此，一旦你发现你的业务数据遭到破坏，请与你的客户分享。告诉他们是什么类型的数据被破坏了，公司正在做什么来限制损失，以及可以采取哪些安全措施。\n\
  \n### 执行差距检查\n进行事后审计至关重要，以识别根源（例如终端安全性不足）并确定违规的原因。你可以聘请一名 `InfoSec`（信息安全）审查员来帮助你理解攻击的深度，并为改进你的数据处理实践提供建议。\n\
  \n### 最后但同样重要——不要恐慌\n违规无疑是压力巨大的事件，恐慌是对此类事件的自然反应。但我建议你不要恐慌。这将花费大量时间，而这些时间最好花在规划行动上。\n\
  \n预测到 2021 年网络犯罪将给全球带来约 6 万亿美元的损失，有必要为你公司的安全考虑上述安全实践。\n\n## 全家网络安全：儿童和成人被黑的五种意外方式\n\
  \n# 保护你的家庭免受网络攻击\n\n网络安全对孩子和成人都是风险。学习如何在国内外保护你的家人免受身份盗窃和网络攻击。\n\n当你在线时，你在全世界都是可见的。随着超过\
  \ 100 亿设备连接到互联网，有大量的黑客。仅在 2017 年，就有 1.79 亿记录被破解，今天每 15 人中就有一个身份盗窃的受害者，其中包括儿童。\n\n\
  你有在线账户吗？兼容 `Wi-Fi` 的设备吗？社会安全号码吗？如果是这样，注意你的背后是一个好主意，因为黑客可能会选择你和家人。但现在不要恐慌。知道要搜索什么可以大幅降低网络攻击的风险。\n\
  \n\n\n\n你可能已经听过关于网络安全的基础知识。这些包括不断更改密码和使用密码管理器、定期运行软件更新，以及避免打开来自陌生人的带有密码的附件。当网络安全专家学习如何防止攻击时，罪分子正不断发明新的攻击手段。因此，让我们来识别黑客入侵的一些新方式，以及你如何保护你的家人免受网络攻击。三分之二的网络攻击案例尚未得到解决。\n\
  \n## 1. 越发复杂的钓鱼诈骗\n\n大多数人认为自己不会受到网络攻击的侵害，但三分之二的攻击并不是针对性的。这就是为什么网络安全对家庭如此重要。电子邮件钓鱼诈骗就是一个很好的例子。事实上，92%\
  \ 的网络安全问题始于电子邮件，因此全家人都需要采取预防措施，特别是在共享电脑时。\n\n结束显而易见的钓鱼时代吧。不要指望来自异国的王子会发邮件向你索钱。现在，黑客通过冒充我们信任的人——银行、移动公司、政府，甚至朋友和家人来模仿我们。在打开邮件时，请注意以下警告信号：\n\
  \n### 2. 请求私有信息\n\n如果你被电子邮件要求提供银行账户、、密码或其他敏感信息，那可能是一个钓鱼诈骗。诈骗者知道电子邮件来自 `IRS` 这样的权威来源，但像\
  \ `IRS` 这样的组织在出现问题时不会发送电子邮件或要求进一步信息（他们会通过美国邮政联系你或直接上门）。如果你不确定邮件或来电者是谁，请在 `Google`\
  \ 上查询其号码（不要使用可疑邮件中列出的号码）并致电核实。\n\n**注意：** 如果你收到自称来自 `IRS` 或任何其他政府机构的人的骚扰电话或邮件，请进行举报。\n\
  \n### 3. 异常电子邮件\n\n如果朋友的电子邮件账户被盗，黑客可以通过电子邮件联系你，并查看他她是否可以访问你的账户。如果你收到一封来自你意料的人的邮件，直接给那个人打电话——黑客可能在邮件中冒充某人，但不太可能伪装声音，更不用说通过电话访问受害者了。\n\
  \n#### 异常语言、拼写错误和账户更改\n\n注意细微的线索，例如来自 `jane.doe@gmail.com` 的邮件，而你的联系人显示为 `jane-doe@gmail.com`。商务邮件不太可能包含拼写错误或奇怪的词汇。你熟悉的人发来的一句你不熟悉的句子可能是一个红灯信号。请仔细阅读。\n\
  \n#### 你可能被要求点击附件或链接\n\n你可能听过这些，但值得重复一遍。如果你不知道正在打开什么，在与发送者交之前不要打开它。如果收到一封来自银行的邮件要求你使用提供的链接进行连接，请保护好自己——避免邮件中的链接，直接以通常的方式登录你的在线银行账户。为什么？因为你永远不知道那种固执会导致什么。你很可能会下载可以访问整个硬盘的恶意软件。如果你在共享电脑上工作，你让所有用户都处于风险之中。\n\
  \n**你应该对家人说：** 信任，但要在点击之前检查并打电话。打个电话只需两分钟。而消除网络攻击造成的损害可能需要多年，即使你完全恢复。\n\n## 2. 窃取儿童身份\n\
  \n我们经常听到关于老年人网络安全的话。他们似乎总是电子邮件和电话钓鱼诈骗的受害者。但在涉及身份盗定时，儿童受影响的概率要高。为什么儿童是首选目标？想一下。孩子在\
  \ 18 岁之前不需要检查他们的信用信誉。罪分子可以用他们的名义办理信用卡并挥霍。你将积累未被察觉的债务，直到你的孩子申请学生贷款被拒绝，因为你的口袋里已经有了大约\
  \ 100 万美元。\n\n这些问题的红灯很容易识别。如果你收到一封来自 `IRS` 的信，说你 8 岁的孩子没有交过任何税，或者收到了你未购买物品的催款，请遵循这些指令了解在孩子身份被盗用时要采取的步骤（由\
  \ `FTC` 提供）。然而，由于网络罪犯通常会在收到信息后等几年才使用，你可能注意不到红灯信号。记得检查你子女的年度免费信用报告，以确保一切正常。此外，你可以在所有子女的信用报告中指定信用冻结（也称为安全停止）。冻结信用是保护儿童免受身份盗窃简单的方法之一。这个免费工具可以防止任何人访问信用报告。由于大多数新账户在没有报告的情况下将无法通过，身份窃取者会发现使用你的信息将变得困难得多。\n\
  \n**你应该对家人说：** 告诉你的孩子，你将冻结（或至少监控）他们的报告，以防止网络安全问题在未来影响他们。当你查看信用报告时，让他们参与进来，以便他们熟悉财务管理。\n\
  \n## 3. 使用连接到互联网的不安全设备访问机密信息\n\n有人会在你在连接 Wi-Fi 的慢炖锅里放了什么吗？当然不会，但这并不意味着它不会被破解。智能家居是不可思议的，但收益伴随着风险。\n\
  \n物联网是一项网络安全风险，因为如果黑客可以访问单个设备，他们就可以访问你的整个网络。这个由应用程序控制的婴儿视频监控器可能成为你数字装甲的严重短板。许多常见的网络安全策略适用于这里。使用经常更改的密码，尝试多因素身份验证，执行安全更新，并避免使用公共\
  \ `WLAN`。然而，尽可能避免使用可以安全使用的设备连接到互联网。问问自己，该设备是否真的需要连接互联网，如果是的话，尝试将其放在不同的网络上。\n\n**你应该对家人说：**\
  \ 抱歉，孩子们，我们没有符合 Wi-Fi 标准的冰箱，但我们有一个管理器。\n\n## 4. 在社交媒体上享受社交分享\n\n想谈论你的假期是非常正常的。这很令人兴奋，你会创造许多记忆，拍很多照片，这不是你每天都会做的事。但如果你在\
  \ `Facebook` 上透露你要离开城市两周，你的门上可能挂着一个写着“请偷我的房子”的牌子。\n\n拥有像你这样的公共社交媒体网站是可以的。但避免在这些页面上分享个人信息。将个人页面设为私密，并经常检查好友列表。你真的和\
  \ 1000 个人联系吗？删除你不认识的人，个性化你的安全设置以限制看到你信息的人数，或者停止在该个人资料中分享个人信息。这些看起来可能是是偏执的步骤，但它们并没有那么无效。黑客用来破解安全系统的一种流行方法是是查看其目标的社交媒体账户。\n\
  \n请注意，每次进行安全更新，`Facebook` 都会将你的默认设置重置为最低安全设置。定期检查设置并使用安全密码。许多社交平台甚至提供多因素身份验证。这意味着你需要密码和一个或多个额外的验证形式来访问账户。例如，这可以是发送到手机的单次代码或指纹——黑客可能无法使用的任何东西。\n\
  \n\n\n\n\n要告诉你的家人：设置隐私页面、定期更新安全设置、删除陌生人，并避免分享位置信息。旅行时，请记住回到家后再发布照片。\n\n## 5. 针对旅行者开启网络安全防护\n\
  \n离开城市时远离社交网络有助于在你外出期间保护家园。当飞机着陆时，你可以做什么来保护你的信息？就像家里有黑客，国外也有黑客——而旅行者是简单且毫无防备的目标。\n\
  \n假设你住在酒店并想处理一些工作邮件。你打开笔记本电脑，看到几个 Wi-Fi 选项：`Hotel-1`、`Hotel-guest` 和 `Hotel_publicwifi`。如果选错了，你可能会处于一个欺骗性的\
  \ Wi-Fi 热点，将你的信息暴露给负责设置陷阱的不愉快之徒。\n\n分子设立虚假的访问点并等待你登录，这样他们就能看到你在互联网上进行的一切，例如通过登录你的在线银行账户。访问者越多，风险越大：\n\
  \n迪士尼、巴黎、纽约、名声大道和拉斯维加斯大道街到处充斥着欺骗性的 Wi-Fi 热点。\n\n通过坚持使用热点或引入一台干净设备（一个不包含你任何信息的设备）而不是存有多年财务数据的电脑，来保护你的家人免受网络攻击。\n\
  \n此外，在使用卡片时要采取预防措施。在柜台上方飞过似乎像是个老掉牙，但这种情况正在再次上升。分子可以使用键盘覆盖层或在实际的 DAB 读卡器上放置采集器。然而，他们通常会在键盘上方安装摄像头以便看到你的\
  \ PIN 码。连接银行的 ATM 通常是安全的，因为银行可以定期注册。如果可能，坚持使用它们并在输入 PIN 码时遮住手。摇摇读卡器也无妨。如果它是松的，你可能遇到了读卡器扫描器。\n\
  \n不了解技术的年长孩子和成年人在旅行时可能会犯这些细微错误。确保全家人都理解这些风险。\n\n要告诉你的家人：旅行时使用设备或信用卡/借记卡要小心。在连接银行的\
  \ ATM 处存放卡片，输入 PIN 码时要遮挡。不要连接到公共 Wi-Fi 网络，而是使用 Wi-Fi 热点或个人信息（或者更好，把设备收起来好享受假期）。\n\
  \n## 现在呢？\n\n大多数入侵发生在几分钟内，但只有 3% 的入侵能如此快被发现。三分之二攻击的检测需要几个月，而且几乎总是由第三方发现的。这似乎是一项巨大的工程，但预防攻击比在攻击发生后立即识别并扭转损害要容易得多。这就是为什么你与全家人分享网络安全意识是如此重要。\n\
  \n以下是你可能正在犯的某些错误，这些错误使你容易受到网络攻击：\n\n### 1. 打开来自未知人士的邮件\n\n电子邮件是业务通信的首选形式。根据 Radicati\
  \ Group 的数据，平均每个人每天接收 235 封电子邮件。有这么多邮件，不言而喻，其中一些是诈骗。打开未知邮件或邮件中的附件可能会触发病毒，在你们公司的数字家园中为网络犯罪分子打开后门。\n\
  \n**解决方案：**\n- 建议员工不要打开来自陌生人士的邮件。\n- 建议员工永远不要打开附件或未知链接。\n\n### 2. 使用薄弱的凭据和密码\n\n\
  Mashable 报告说，81% 的成年人对所有事情都使用同一个密码。使用昵号或街道名称等个人信息的重复密码是一个问题。网络犯罪分子拥有程序，可以提取公开资料以生成潜在密码和登录机会的组合，直到其中一个出现为止。他们还使用字典攻击，自动尝试不同的单词直到匹配成功。\n\
  \n**解决方案：**\n- 员工必须使用唯一的密码。\n- 在密码中添加数字和符号以增加安全性。例如，将 \"London\" 替换为 \"L0nD0N\"\
  。\n- 创建规则，要求员工创建至少 12 个字符的唯一复杂密码，并在理由相信密码已泄露时更改密码。\n- 使用密码管理软件为多个应用程序、网站和设备自动生成安全的个人密码，以减少这一问题。\n\
  \n### 3. 将密码写在便利签上\n\n你是否去过办公室，发现屏幕上有一张写有密码的提醒？这种情况发生的频率比你想象的要高。尽管你对组织有一种程度的信任，但让密码可见的风险太大了。\n\
  \n**解决方案：**\n- 如果员工需要输入密码，要求将打印件保存在锁好的抽屉里。\n\n### 4. 拥有所有访问权限\n\n在某些情况下，公司不对数据进行细分。也就是说，从实习生到董事会成员，每个人都可以访问相同的公司文件。通过给每个人相同的数据访问权限，你增加了可以逃离、丢失或操纵信息的人数。\n\
  \n**解决方案：**\n- 设置分级访问级别，并仅向每个级别需要的人授予权限。\n- 限制可以更改系统配置的人数。\n- 除非员工需要此类配置，否则不要给予其设备管理员权限。此外，具有管理权限的员工应仅在需要时使用，而不是常规使用。\n\
  - 在处理超过金额的付款之前应用双签名以打击税务欺诈。\n\n### 5. 缺乏有效的员工培训\n\n研究显示，大多数企业都提供网络安全培训。然而，只有 25%\
  \ 的高管认为培训是有效的。\n\n**解决方案：**\n- 年度网络安全意识培训。主题可以是：\n    - 网络安全培训的原因和重要性\n    - 网络钓鱼和在线诈骗\n\
  \    - 锁定电脑\n    - 密码管理\n    - 如何管理移动设备\n    - 相关情况示例\n\n### 6. 不更新杀毒软件\n\n你的公司需要提供杀毒软件作为保障，但更新它并不由员工负责。在某些组织中，人们被鼓励进行更新，他们可以自己决定是否执行。当员工在项目进行期间时，他们可能会拒绝更新，因为许多更新会强制他们关闭程序或重启电脑。\n\
  \n杀毒更新是非常重要的，必须快速处理，并且不应交给员工处理。\n\n**解决方案：**\n- 在下班时间后自动配置所有系统更新。\n- 无论职位如何，没有任何员工应遵守此公司政策。\n\
  \n### 7. 使用不安全的移动设备\n\n你的员工是否有手机、平板电脑或笔记本电脑？如果是的话，你是否设置了备份这些设备的协议？许多公司对移动设备掉以轻心，但它们是网络犯罪分子的目标。\n\
  \n**解决方案：**\n- 每个设备必须经过密码保护。\n- 如果设备丢失或被盗，请联系联系人报告并指定远程禁用的步骤。\n- 使用终端安全解决方案远程管理移动设备。\n\
  - 不要通过不可靠的公共 Wi-Fi 网络进行机密交易。\n\n\n\n\n\n为了进一步了解道德产品黑客，需要探索黑客和渗透测试人员的态度、工具以及应对策略，以学习如何识别、分类和修复软件及计算机网络中的安全漏洞。道德产品黑客的研究对于各种角色的员工都有用，包括网络法律专家、风险管理、软件开发人员、质量保证、管理和法律审查人员。此外，持续的道德产品黑客培训和认证可能对那些寻求新职位或为组织展示技能和价值的人大有益。\n\
  \n## 理解黑客的心态\n\n学习道德黑客最实用的益处在于，它能够告知并改进企业网络的防御方式。企业网络安全最大的威胁是黑客：了解黑客如何操作，可以帮助网络法律专家识别、分类、确定优先级，并决定如何处理潜在威胁的最佳方法。\n\
  \n网络维护者在黑客面前处于极度劣势的。黑客只需识别并利用漏洞即可获得网络立足点，而防御者在理论上必须识别并解决任何潜在的内部安全和网络边界漏洞。\n\n在实践中，很难完全消除网络的所有风险，防御者必须能够评估每个潜在威胁的利用可能性和预期影响，并分配有限的资源以最小化攻击的可能性。要成功，防御者必须能够像黑客一样思考。道德黑客培训可以帮助网络维护者培养这种心态。\n\
  \n## 开发与质量保证\n\n道德黑客与质量保证测试员的角色有很大重叠。在这两种情况下，测试人员都必须确保软件在正常和极端条件下正常运行。在当今快速的开发周期下，安全测试往往被忽视，导致软件变得脆弱。一个合格的道德黑客可以成为开发团队的重要资源，他们能够利用行业内的最佳实践快速、高效且全面地进行安全测试，而不是开发过度强调某些方面而忽略其他方面的内部方法。\n\
  \n除了学习安全最佳实践外，从工具的角度来看，学习道德黑客也有帮助。许多网络防御律师、质量保证测试人员和黑客已经开发了工具，以加速识别和解决常见的安全漏洞。当开发者熟悉并掌握这些工具时，他们就学会了应该避免哪些编码错误，以及如何对代码中的安全漏洞进行有效测试。\n\
  \n## 符合法律法规\n\n最近的法规在企业数据泄露责任方面采取了强硬立场。《通用数据保护条例》（`DSGVO`）的新规定简化了法律并对侵权行为处以罚款。\n\
  \n随着新法规的实施，确保软件和网络没有安全漏洞变得越来越重要。道德黑客的研究有助于该领域的各种职能。网络维护者和软件开发人员可以学习识别并防范常见漏洞。经理和战略规划者可以通过探索常见的攻击方法及其影响，并将这些信息纳入风险管理计划中，从而从中获益。\n\
  \n## 职业发展\n\n合格的网络安全从业人员需求与可用人才库之间存在巨大且日益增长的差距。在美国估计有 35 万个网络安全工作岗位，这个数字预计到 2021\
  \ 年将增长十倍。虽然这通常是一个坏消息，但对于寻求员工的公司和员工来说，这使他们能够在该领域定位，以留住网络安全人才。\n\n学习道德产品黑客是进入网络安全领域的绝佳方式，并让自己能够利用技能短缺（以及相关的薪资差距）优势。无论你是在寻找第一份工作、在相关领域进行专业化和晋升，还是考虑换工作，学习道德黑客都是获得你心仪工作的良好起点。\n\
  \n## 寻找工作\n\n如果你在寻找一个新领域的初级职位，你通常会与其他几乎或完全没有实战经验的入门级候选人竞争。任何你能证明自己技能的努力都能让你与其他候选人区分开来，并帮助你完成工作。\n\
  \n如果你想进入网络安全领域，最好获得相关认证以证明你的知识和经验。网络安全领域的各种专业方向和经验水平通过认证得到了很好的体现。\n\n常见的网络安全认证之一是\
  \ `EC Council` 提供的“认证道德黑客”（`Certified Ethical Hackers`）认证。`认证道德黑客`考试测试候选人对黑客、入侵者和网络法律专家所用工具和技术的了解。\n\
  \n获得此证书证明了申请人努力工作的意愿，他的成功表明他拥有完成其职位任务所需的知识。对于那些在该领域经验有限或想提高技能的人来说，参加营地式的培训是一个升级技能的快捷方法。\n\
  \n## 道德黑客的优点\n\n道德黑客的大多数优点是显而易见的，但许多被忽视了。其益处范围从简单的阻止恶意攻击到阻止国家安全泄露不等。益处包括：\n\n- 反击恐怖主义和国家安全攻击\n\
  - 拥有一个阻止恶意黑客获取访问权限计算机系统\n- 拥有满意的预防措施来检查安全泄露\n\n## 道德黑客的缺点\n\n正如所有带有阴暗面的活动一样，会有肆无忌耻的人制造障碍。道德黑客的可能缺点包括：\n\
  \n- 道德黑客利用他们获得的信息进行恶意黑客活动\n- 允许公司的商业和银行细节被查看\n- 道德黑客可能会在计算机系统中创建和/或放置恶意代码、病毒、恶意软件和其他破坏性和伤害性物品\n\
  - 大规模安全泄露\n\n这些并不受欢迎；但这是所有公司在使用道德黑客服务时都应该考虑的因素。\n\n# 结论\n\n许多人读到关于道德黑客益处的内容会感到困惑。对他们来说，这种概念并不存在，因为黑客行为本身被自动视为不道德或非法的。事实上，黑客通常就是打破为了保护人们安全而设置的障碍。因此，谈论此类行为的益处对人们来说自然是非常疏远的（至少是如此）。\n\
  \n最初，黑客行为完全是为了违反法律并获取某些群体通常不应被访问的信息。但生活并不像我们最初感知的那样非黑即白。因此，许多人可能会惊讶，发现 `IBM`、`Microsoft`\
  \ 和 `Apple` 等几家大型计算机公司都有一支庞大且专门的黑客团队。是的，你读得没错。\n\n然而，就目前所知，他们并没有违反任何法律。不，这类黑客的存在完全出于正当理由。他们被用作各种程序的安全测试员。基本上，每当一家公司开发程序时，他们通常会把它带给黑客团队，由该团队进行尝试破解（“hack”），以查看该程序有多少安全漏洞。\n\
  \n\n\n\n\n# 他们将检查程序是否可以以任何方式被利用，然后将其返回给程序员，并附上一份发现的漏洞列表。这只是伦理黑客的好处之一。随后可以对程序进行修复或加强，并再次发送给黑客，以确认是否仍然存在问题。\n\
  \n上述只是进行黑客活动的好处的一个例子。你知道吗，随着对黑客需求的实际增加，实际上已经有专门教授这一主题的资源？随着世界越来越依赖计算机，黑客或黑客群体可能造成的潜在损害已经增长到全新的水平。这是大公司无法负担起忽视代价的。\n\
  \n由于学习如何成为一名黑客确实可以通向一个非常有前景的职业，即为许多大公司之一工作。正如所讨论的，在“内部”进行伦理黑客有几个充分的理由，所有理由都能帮助公司可能节省数百万美元，并最大限度地减少在客户和同行面前毁掉辛苦经营的声誉的风险。不仅是公司获益，购买他们程序的人也获益。\n\
  \n一支优秀的黑客团队可以确保程序尽可能安全，让任何潜在黑客的工作变得困难许多倍，通常迫使他们转向更容易的目标。这确保了任何广泛流通的程序很少被篡改，并帮助保护全球范围内计算机的隐私和完整性。\n\
  \n## 基础设施\n\n基础设施等同于资金。为了扩大规模，你需要一个灵活的基础设施来处理增长。尽管如此，当中心化的基础设施变成官僚主义和响应缓慢时，公司就会变得萎靡。黑客工作从工作者的角度检查了这些问题，并概述了你可以通过智能工作来完成工作所做的事情。\n\
  \n## 为什么对我很重要？\n\n我做这个总结不是为了浪费你的时间。我的愿景是提供简洁的行动步骤，你现在就可以采纳它们以实现你的创业目标。如今大多数公司对供应商和客户的信任超过对员工的信任。这是一个真正的问题，因为卓越的结果需要团队合作，如果没有信任，你就无法拥有凝聚力。公司想要类似于指挥和控制系统的透明度和集中化。这并不是坏事，直到销售人员需要\
  \ 2 小时才能输入一个订单，或者公司封锁了 Facebook、Twitter 和 LinkedIn。这种愚蠢的行为会扼杀结果。\n\n结果是游戏的规则。如果你**现在**得不到结果，你就死定了。业务的枢纽模型不是一个坏模型，只要辐辐具有向客户交付的自主权且不被官僚主义束缚。\n\
  \n## 黑客工作\n\n黑客工作分为四个部分。为了时间起见，我将重点介绍每个部分一点。\n\n1. **投入的团队成员**：这一点总结了整本书，并将优秀的企业与糟糕的企业区分开来。投入的团队成员比脱节的团队成员效率高四倍。这一数据可以转化任何业务。\n\
  2. **基础设施的奴隶**：我理解程序和基础设施的需求，因为没有它们就无法扩展。尽管如此，我知道大公司用愚蠢的规则和程序束缚员工，最终杀死了创造精神。黑客工作就是关于绕过这些愚蠢的规则和程序。一个简单的例子就是限制计算机之间的文件访问。如今的人可以通过手机访问工作之外的一切。\n\
  3. **三种类型的黑客**：黑客客是那些偷窃、欺骗和制造混乱的人。本书并不主张黑客行为。灰黑客和白黑客是完成工作所必要的。这些类型的黑客只是巧妙地让员工利用他们的创造自由为利润和客户服务。\n\
  4. **清晰度**：这一点非常重要。看看这些数据：第一，前五个时间浪费源中的三个都与沟通有关。第二，公司中的信息每 550 天翻一倍。第三，每三分钟，平均居住者就会接受一次干扰并转移注意力，消耗全天\
  \ 28%的时间。创建清晰度和简单的沟通和信息共享网络可以解决这一切问题。\n\n## 先别走；最后一件要做的事\n\n如果你喜欢这本书或觉得它有用，如果你能在上面发表一条简短的评论，我将将不胜感激。你的支持确实意义重大，我会亲自阅读所有的评论，以便获得你的反馈并使这本书变得更好。\n\
  \n再次感谢你的支持！\n\n"
