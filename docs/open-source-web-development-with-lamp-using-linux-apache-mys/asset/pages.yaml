  md: '# CHAPTER 10 Embperl (HTML::Embperl) 299


    # Embperl Language Notes


    There is not a [$ for ... $] metacamand in Embperl. The [$ while ...] command
    can be used instead (as can in every other language with those constructs also).


    There is a [$ do $] ... [$ until condition $] metacamand. We don''t use it much—we
    rarely find application for do ... while or do ... until loops in HTML pages.
    If you care to, you can read about these things at the Embperl web site, http://perl.apache.org/embperl/embperl.pod.cont.html,
    or perdoc HTML::Embperl.


    # 10.6 POSTED DATA AND %fdat


    Posted data—that is, data posted to the server by the client browser (this data
    was obtained using the param() function in the CGI and mod_perl chapters)—is accessed
    by Embperl programs through the variable %fdat. Each widget name is a key in %fdat,
    and the widget value is the value of that key.


    Here''s a simple example. First, there''s a form to collect some text (/var/www/embperl/fdat1.html):


    ```

    <html>

    <head>

    <title>Form to Demonstrate %fdat</title>

    </head>

    <body bgcolor="#ffffff">


    <h1>A Form to Demonstrate %fdat2.html</h1>


    <form action="embperl/fdat2.html" method="post">

    Name: <input type="text" name="name" <br>

    Age: <input type="text" name="age"> <br>

    Phone: <input type="text" name="phone"> <br>

    <input type="submit">

    </form>


    </body>

    </html>

    ```


    There is nothing new about this; it is simply a form with three input fields.
    No Embperl here. Still, Apache processes it with HTML::Embperl because it is under
    the /embperl subdirectory of the /var/www/html/directory.'
