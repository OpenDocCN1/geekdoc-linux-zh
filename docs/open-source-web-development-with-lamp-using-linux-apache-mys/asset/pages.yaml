  md: "# 96\n\n# PART I Structural\n\nFH is a filehandle variable. By convention,\
    \ all filehandles are named with uppercase letters. The less-than symbol (<) indicates\
    \ that the file is to be opened in read mode. Read mode happens to be the default,\
    \ if the less-than symbol is not used, the file will still be opened in read mode.\
    \ Some consider it good programming practice to explicitly open in read mode (it\
    \ is more secure; we talk about this in Chapter 7), so we do that in this book,\
    \ but if you choose to drop the less-than symbol, it will work just the same.\n\
    \nThe open() function returns true if successful, false if it fails. If open()\
    \ returns false, we should handle this as a serious error, and in Perl, when serious\
    \ errors occur, we die (serious business, this programming stuff). The following\
    \ code will die() if the file fails to open.¹\n\n```\nif (! open (FH, `<test.txt`)\
    \ {\n    die(\"Can't open test.txt: !\");\n}\n```\n\nThe open() function takes\
    \ its argument, prints to standard error output, cleans up, and exits with a nonzero\
    \ exit status. The funny-looking variable $! contains the error status of why\
    \ the open failed. Although the code works, it is more Perl-like to write it this:\n\
    \n```\nopen(FH, `<test.txt` or die \"Can't open test.txt: !\");\n```\n\nWe will\
    \ discuss the logic of the operator or in a bit, when we talk about short-circited\
    \ evaluation. If you can't wait for that discussion, then this logic means if\
    \ the file test.txt can't be opened, the program will die.\n\n```\n#! /usr/bin/perl\
    \ -w\n# file: file1.pl\n\nuse strict;\nmy $line;\nopen(FH, `<test.txt` or die\
    \ \"Can't open test.txt: !\");\nwhile ($line = <FH>) {\n    print \"Line is: $line\"\
    ;\n}\n```\n\nclose(FH);\n\n> ¹Death, when programming Perl, is not inherently\
    \ bad, except when programming CGIs. CGI programs need to die in a more acceptable\
    \ fashion—we talk about this in Chapter 7."
