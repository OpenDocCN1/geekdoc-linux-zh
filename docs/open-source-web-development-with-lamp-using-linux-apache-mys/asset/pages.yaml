  md: '# CHAPTER 11 Mason (HTML::Mason) 355


    ![](img/9b05e38e58495be06a08eeb2b6906346_390_0.png)


    Figure 11.10 Serving up Mason components


    prove this, by trying the URL http://localhost/mason/_header. You''ll see Figure
    11.10. D''oh! Our Mason component source code is being served up on a platter,
    thereby making our Mason component source code available. A cracker may be able
    to learn something about how our site works and perhaps leverage that knowledge
    in an attack.


    There are several ways of securing the Mason components (see www.masonhq.com/docs/manual/admin.html#securing_top_level_components).
    One method, that we''ll use, is to deny access to files in the Mason directory
    that start with the underscore character (_foo.bar). Now our Mason files are named
    with a leading underscore character, we used the underscore character, but one
    could also choose to prefix the files with ". The advantage of the underscore
    is that files still show up with the standard ls command—a is not necessary to
    see the Mason files in the directory.


    To implement this security measure, modify the Apache configuration for Mason:


    ```

    PerSetVar MasonCompRoot /var/www/html/mason

    PerSetVar MasonDataDir /var/www/misc/mason

    PerModule HTML::Mason::ApacheHandler

    <Directory /var/www/html/mason>*

    ```'
  merge: -1
  pgno: 390
- img_proc: true
  md: "# 356 PART IV Embedded\n\n```\nSetHandler perl-script\nPerlHandler HTML::Mason::ApacheHandler\n\
    <Files ~ \"_*\">\n  SetHandler perl-script\n  PerlInitHandler Apache::Constants::NOT_FOUND\n\
    </Files>\n</Directory>\n```\n\nHere the <Files> directive is added. This directive\
    \ instructs Apache to handle all files that begin with an underscore and to send\
    \ the response that file is not found.\n\nAlternatively, access to the file could\
    \ have simply been denied by identifying the preceding Apache configuration as\
    \ follows:\n\n```\n<Files ~ \"_*\">\n  Order allow,deny\n  Deny from all\n</Files>\n\
    ```\n\nThis directive tells Apache to deny access, which is fine because it doesn't\
    \ serve up the file, but it tells the user that the file is there and they cannot\
    \ access it. But why tell a would-be cracker that the component actually exists\
    \ at all? Instead, trick them into thinking that the component is not found, and\
    \ give no information about the component's state of existence.\n\nSo, we will\
    \ stick with this:\n\n```\n<Files ~ \"_*\">\n  SetHandler perl-script\n  PerlInitHandler\
    \ Apache::Constants::NOT_FOUND\n</Files>\n```\n\nAfter changing the configuration\
    \ file, restart Apache:\n\n```\n# /etc/init.d/httpd graceful\n```\n\nNow, loading\
    \ the URL http://localhost/mason/_header produces Figure 11.11.\n\n> This sort\
    \ of \"reject rather than deny\" approach is good practice in many applications\
    \ of security. If a cracker is trying to probe your system, make them wait for\
    \ a time-out or a file-not-found message rather than send a message that they've\
    \ hit the right thing but simply don't have the right access—too much information."
