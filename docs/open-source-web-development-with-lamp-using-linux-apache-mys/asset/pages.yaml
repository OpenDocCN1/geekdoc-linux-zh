    # config Directive


    The config directive can be used to change the configuration of SSI output. If
    an error occurs during the processing of an SSI directive (for instance, including
    a file that does not exist), the following default error output is displayed:


    [an error occurred while processing this directive]


    This output can be changed with the config directive:


    ```

    <--config errmsg="Error, contact webmaster@opensourcewebbook.com"-->

    ```


    Earlier in this section, we changed the default output of the size directive.
    The default behavior of many of the directives can be similarly changed. For instance,
    the time format can also be changed in a number of ways:


    ```

    <--config timefmt="format--

    ```'
