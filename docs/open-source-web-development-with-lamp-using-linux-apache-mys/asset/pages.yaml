  md: '# CHAPTER 6 Website META Language 143


    # 6.4.2 The use Statement


    As the WML system gets more complicated, it''s easy to imagine that a file could
    be included more than once if the programmer were to lose track of things.


    To preclude this situation, one can implement the #use directive instead of the
    #include. The statement:


    ```

    #include "foo.wml"

    ```


    is written with #use as:


    ```

    #use wml::foo

    ```


    Similarly, this statement:


    ```

    #include "directory/file.wml" name="John Doe"

    ```


    is written with #use as:


    ```

    #use wml::directory::file name="John Doe"

    ```


    Since use is more useful, we''ll forget about include for everything else we do
    with WML.


    # Standard Includes


    WML comes with many standard files for commonly used functions. They are usually
    used like this:


    ```

    #use wml::std::info

    ```


    This specifies the file info.wml in the standard WML system include-directory/usr/local/lib/wml/include/std/.
    This particular file includes definitions of information about the page. The information
    is made available by using the <info> tag. This standard include file allows us
    to include comments in the file, such as who wrote the file.


    An example of wml::std::info is just around the corner.


    # File Information


    Other information can be added to the HTML file, such as the filename (__FILE_)
    and the line number in the file (_LINE_). This information is'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'useful for debugging but less so for security. Think carefully before advertising
    the name of the file to all the possible crackers out there.


    # Comments


    Comments are begun with the pound sign (#), with the obvious exception of statements
    such as #include and #use. The end-of-line ends ends the comments, so each new
    line of the comment must begin with a new # Lines that have a pound sign only
    after whitespace are comments, too. if the # occurs anywhere except at the beginning
    of the line or after whitespace, it is not treated as a comment. For example:


    +   # here is a comment

    # another comment


    # here is a comment preceded by only whitespace

    is is not a comment and will be compiled by WML


    You can also add a marker to the file (__END_) that indicates that the WML code
    is finished. Any text that follows is thus a comment and not compiled as WML code.

    To illustrate all these concepts, let''s look at another variation of “hello,
    world!” The header file is /var/www/html/wml/head3.wml:


    ```

    # std/info.wml so we can use

    # the <info> tag


    #use wml::std::info


    <html>

    <head>


    <info style=comment domainname="opensourcewebhook.com"

    right="2002 James Lee, Brent Ware

    http://www.opensourcewebhook.com/">


    <title>$(title)</title>

    </head>

    <body bgcolor=$(#ffffff)>

    <h3>Header Stuff</h3>

    File: <b>__FILE__</b><br>

    Line: <b>__LINE__</b></body>

    ```


    This header uses wml::std::info so we can use the <info> tag. The tag includes
    information about the file using the comment style (all the information is within
    an HTML comment). This file also prints the filename'
  merge: -1
