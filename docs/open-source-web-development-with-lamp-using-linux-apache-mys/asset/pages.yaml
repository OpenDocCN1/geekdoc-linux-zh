    This modifies the default nature of ls (-F) by adding some helpful information
    to the typical list, by using markers (-F) and colors (if you have a color xterm,
    directories, devices, etc., will all have different colors). In bash, command-line
    arguments to the command are passed along automatically to the alias. If you simply
    type ls, you get ls -F--color. If you type ls -a -B foo\*.bar\*, the qualifiers
    and wildcards are passed into the plain ls to use as usual, in addition to the
    -F --color switches already defined.


