  md: '# Post-Version 4.1.0


    Version 4.1.0 adds a new, improved, and strongly suggested approach to grabbing
    the posted data. Because Red Hat version 7 does not include PHP version 4.1.0,
    we will only discuss it here—the remaining examples use the pre-4.1.0 method.
    In the future, you should use the new way.


    PHP version 4.1.0 has added several new global variables:


    +   * $_GET—an array of the data sent with GET (replaces $_HTTP_GET_VARS)

    * $_POST—an array of the data sent with POST (replaces $_HTTP_POST_VARS)

    * $_COOKIE—HTTP cookie variables

    * $_REQUEST—a merge of the GET, POST, and cookie data


    Version 4.1.0 introduces some other helpful variables:


    +   * $_SERVER—the Apache server environment variables, such as REMOTE_ADDR

    * $_ENV—the environment variables

    * $_SESSION—data registered by the session module


    Therefore, the preceding example could change to this:


    ```

    Using $_GET:

    <b><?php echo $_GET["var1"]; ?> </b>

    <b><?php echo $_GET["var2"]; ?> </b></b>

    ```


    or this:


    ```

    Using $_REQUEST:

    <b><?php echo $_REQUEST["var1"]; ?> </b>

    <b><?php echo $_REQUEST["var2"]; ?> </b></b>

    ```


