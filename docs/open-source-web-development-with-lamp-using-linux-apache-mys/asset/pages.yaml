  md: '# CHAPTER 9 Server Side Includes 279


    .html suffix are preprocessed, so don''t name normal non-SSI HTML files with the
    .html extension—that only slows down the webserver, because it will preprocess
    files that do not require it.


    As always, if you change the Apache configuration file, restart the server.


    # 9.1.3 Tutorial


    SSI is relatively simple to learn, and we can give a short tutorial of its important
    aspects in just a few pages. SSI consists of a few directives, which implement
    its functionality.


    # echo Directive


    The echo directive instructs the server to insert (echo) the value of a variable
    at that point in the HTML file. It has its syntax:


    ```

    <!--#echo var="variable"-->

    ```


    The variables that can be echoed


    +   - DOCUMENT_NAME—the name of the document

    - DOCUMENT_URI—the virtual path to the document

    - DATE_LOCAL—the local date and time

    - DATE_GMT—the date and time in Greenwich Mean Time

    - LAST_MODIFIED—the last modification date for the document

    - QUERY_STRING_UNESCAPED—an decoded query string with all shell metacharacters
    escaped with a backslash


    Let''s show an example. First, make a directory for the SSI work, giving it the
    proper permissions:


    ```

    $ cd /var/www/html

    $ mkdir ssi

    $ chmod a+rx ssi

    $ cd ssi

    ```


    Call this example echo.html and make it is readable (with chmod a+r) echo.html—be
    sure to do this for all the examples in this chapter). Put the following code
    in it:'
