  md: '# 12.1 INTRODUCTION


    PHP is one of the Ps in LAMP (Perl and PHP). Its function is similar to that of
    HTML::Embperl and HTML::Mason—it uses executable code embedded in HTML to create
    dynamic web pages. In the last chapter, we compared Embperl and Mason, and saw
    that they are similar in purpose. Both can handle most any situation one would
    come across when developing a web site. Whether one chooses PHP over Embperl or
    Mason is a matter of personal preference. There are differences, and we try to
    point them out. The choice is yours. TMTOWTDI (not just with Perl, but with LAMP
    and Open Source in general). Choice is good!


    PHP is another of those recursive initialisms believed of a certain portion of
    the hacker community¹; it''s short for PHP: Hypertext Preprocessor. It was developed
    by Rasmus Lendorf, Zeev Suraski, Andi Gutmans, and others. The first version was
    released in 1994; PHP is currently up to version 4.1.1 (as of this writing), while
    the version released with Red Hat 7 is version 4.0.4.


    PHP has many built-in functions that perform important and common requests: it
    can connect to databases (many types, including MySQL, which we cover here), send
    e-mail, create PDFs, and more is widely used², and there are plenty of tutorials,
    examples, and help available on the Web. The syntax is similar to Perl, C, and
    C++, so learning it is not a stretch for the experienced programmer. The ubiquitous
    flow-control constructs (if, switch, while, for, and foreach, among others) are
    available. Grabbing


    > ¹Re: GNU: GNU''s Not Unix.\²Especially in Europe, where LAMP stands for Linux,
    Apache, MySQL and PHP. In the states, due to the popularity of www.onlamp.com,
    it is usually more broadly taken to be Linux, Apache, MySQL and Perl–PHP.'
