  md: '# mysql_close()—Close a MySQL Server Connection


    This functions closes the connection to the MySQL server:


    ```

    <? mysql_close($mysql); ?>

    ```


    # mysql_db_query()—Execute a Query


    This function executes a query for the specified database. It returns a result
    identifier on success or fails on error. The result identifier is used to retrieve
    the result from the query:


    ```

    $result = mysql_db_query($db, $query)

    ```


    # mysql_num_rows()—Return the Number of Rows Selected


    This function returns the number of rows selected by a query:


    ```

    <? echo mysql_num_rows($result); ?>

    ```


    # mysql_fetch_row()—Fetch a Row as an Enumerated Array


    This function returns the next row as an enumerated array. Each column is stored
    as an array element, indexing starting with 0:


    ```

    <? $array = mysql_fetch_row($result);

    echo "First column: $array[0];"

    echo "First column: $array[1];"; ?>

    ```


    # mysql_errno() and mysql_error()—Return MySQL Errors


    The mysql_errno() returns the error number of the most recent function call or
    0 if there was no error. The mysql_error() function returns the error text of
    the most recent function call or the empty string if there was no error:


    ```

    <? $result = mysql_db_query($db, $query)

    or or die("query failed - " . mysql_errno() . ": " . mysql_error());\ ?>

    ```


