    # 10.4 A QUICK EXAMPLE


    Let''s start with a quick example to display "hello, world! with Embperl (what
    else?). Create the file /var/www/html/embperl/index.html with the following contents
    (remember to chmod a+r index.html3):


    ```

    [-n$msg = "hello, world!";

    ]

    <html>

    <head>

    <title>hello, world with Embperl</title>

    </head>

    <body bgcolor="#ffffff">

    [+ $msg +]

    </body>

    </html>

    ```


    To see the result of this page, or www.opensourcewebook.com/embperl/. You should
    see something like Figure 10.1.


    The first part of index.html is an Embperl command denoted by [- -]. We decide
    this later in this chapter, but for now suffice to say that the code within this
    command is executed as Perl code. In this example, $msg is set to a familiar message
    that is included in the HTML within the <body> tags.


    To include the contents of the variable $msg, use the Embperl command [+ $msg
    +]. This command is replaced by the value of the variable $msg. This value is
    then displayed in the browser.


    > ^3In general, if you have any problems, check your permissions. Don''t make
    us say this again.'
