  md: '# Introduction


    # xxxi


    supported by Apple or Microsoft either, so you still have to do research.

    Caveat empt.


    Some Open Source companies provide technical support for a fee, but with many
    programs and distributions, it''s up to the administrator (you) to check for updates;
    be aware of security bugs by following Bugraq (www.securityfocus.com), or the
    program''s web site, or Slashdot (www.slashdot.org); and upgrading when necessary.
    Then again, some people might consider being vigilant about maintaining their
    computer good thing, no matter what the operating system.


    At the basic level, you are your own sys and webmaster—you are responsible for
    watching logs, maintenance, dealing with problems. You may have to roll out your
    software; configure it for your system, which may not be the same as the default;
    and actually have to RTFM. The documentation that you get may be out of date or
    inaccurate; but then, all drawbacks are also inherent in closed-source software—you
    can''t just turn your computer on and ignore security updates, patches, and upgrades.
    The nicely formatted and printed documentation is often wrong and/or date. Generally,
    the patches and upgrades come at a price, either dollars or time.


    You may not be able to run all of the applications that you can use on your Windows
    or Mac system, although we''ve found that there are translators, emulators, or
    equivalents for most things. For us, this has not been a limitation in Linux,
    even though sometimes it is a timesink. It is not a limitation that closed-source
    systems are immune to however. One of this book''s authors spent hours writing
    while trying to convince one Mac program to read data from another, and more hours
    installing an FTP server on a Windows NT box so that he could copy large amounts
    of data without transferring it to an intermediate medium—no FTP server installed
    by default!? And, there''s no native secure copy at all.


    It''s also the norm in Linux to install and to upgrade software without having
    to reboot, and for systems to be inherently stable—no blue screen


