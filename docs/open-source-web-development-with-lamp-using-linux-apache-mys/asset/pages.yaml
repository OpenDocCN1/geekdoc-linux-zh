  md: '# Preface


    # Is This Book for You?


    This book’s target audience is the person who wants to get an interactive database-based
    web site up and running without spending a whole bunch of money on a large stack
    of books and software. That person might be a technically competent Linux user
    who is not necessarily a Perl or a CGI whiz; a graphic designer, with a technical
    bent, who wants to build a web site without wading through them, picking out some
    knowledge needed to a certified computer whiz; or an MCSE who has heard rumors
    that there might be another way to do things.


    Up to now, these folks would have had to purchase four or thick books and wade
    through them, picking out the knowledge needed to accomplish necessary tasks.
    It’s likely they would accomplish this in a less than optimal way, picking up
    some things and missing others, reviving and redoing as they learn new things
    without being aware of the security considerations to keep their site and safe.
    The goal of this book is to summarize much of the information about Open Source
    in one place and to do so in a manner that will get the prospective web developer
    up running safely and efficiently, including pointers to other resources when
    it becomes necessary to have more knowledge than provided here.


    Our target audience, ideally, would have some familiarity with Unix, some sort
    of modern programming language (C, FORTRAN, Perl, Pascal, C++—most anything will
    do), and HTML. The scope here, and the sheer constraints on its size, force us
    to limit explanations and assume some background knowledge; we touch on a lot
    of things, enough so that you ought to be able to ask the right questions on a
    search engine. If you don’t have any Unix experience, or if you are not a seasoned
    programmer, this book can still be useful, with motivation and, perhaps, the purchase
    of a few other computer books.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# What It Will Do


    In this book, we introduce you to the pillars of LAMP—Linux, Apache, MySQL, and
    Perl and PHP, with mod_perl, Emberyl, Mason, and WML tossed in good measure. We
    are biting a lot with this book, and this is what we intended to do. We need to
    cover as much ground as possible and present you with various approaches for programming
    a web site with Open Source products. The goal is to point out the part of each
    of these Open Source approaches that provides the most functionality.


    Another goal is to make you aware of current techniques and standards: What is
    easily possible, what might be possible with more work, which tool is appropriate
    for which task. Just important as how to discern the things you need from those
    you don''t, or don''t need just yet. Least of all is how to do these things in
    secure a fashion as possible. After all, you are opening your box to the world
    with these techniques and should be wary of those with impure motives.


    Based on experience, we believe that 80 percent of the utility of any complicated
    tool is the result of knowing 20 percent of the uses of that tool, whether that
    tool is software, hardware, mechanical, or electronic. Swiss Army knives are elegant
    and versatile tools, but most of the time, you just use the blade or the screwdriver.


    The purpose of this book is to introduce you to that 20 percent—the blade and
    the screwdriver—opens up the most functionality, and to make you aware of the
    remaining 80 percent so that you can use the other tools when appropriate.


    And to teach you to not use the blade as a screwdriver.


    # Four Parts


    The book is divided into four parts:

    Part 1, Structural: Linux, Apache, MySQL, Perl—the structural foundations on which
    LAMP is built and the other programs run.


    +   - Linux is the operating system this is all based on. We touch only lightly
    on Linux because it''s a big subject and one that doesn''t need to be dealt with
    much after it''s installed.


    +   - Apache is the webserver software that serves web pages to clients and decides
    how requests for documents, forms, and so on will be processed.

    Chapter 1 talks about the basics of configuring and setting up a web site.'
  merge: -1
  pgno: 21
