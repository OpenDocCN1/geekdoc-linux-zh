    # 4.3.11 Making Operating System Calls


    Perl includes some convenient functions and operators to perform system calls.
    We look at only two of these, so see the Camel Book [Wall+00] for more.


    # The system() Function


    The system() function takes its argument and executes it as if it were a system
    command typed into the shell. The output of the command is sent to standard output
    for the program.


    This code:


    ```

    system "/bin/ls";

    ```


    executes /bin/ls system command, showing the files in the current directory in
    sorted order, much as if you had entered that command to the shell. The output
    of the system() function, here a listing of all files in the current directory,
    is sent to STDOUT just as if you executed from the shell.


    The system() function can be called by giving it a list of arguments. This invocation
    is more secure than having only one argument, because system() is written so that
    it does not interpret the shell metacharacters (such as *) and anything special.
    For instance, let''s say we have this code:


    ```

    system "/bin/ls $user_supplied_input";

    ```


    Imagine if $user_supplied_input had the value; rm -rf /. This would be like executing:


    ```

    system "/bin/ls; rm -rf /\";"

    ```'
