  md: '# 1.1.2 Serving Up Dynamic Data


    A more complex way of generating HTML is to execute a server-side program that
    dynamically generates the HTML that is sent to the browser. There are many flavors
    of server-side programming, including tried-and-tried CGI (Chapter 7) and the
    more flexible and powerful mod.perl (Chapter 8). The program generally does some
    sort of server-side processing, such as reading from a database or executing some
    other server-side program.


    Dynamic web pages should not be confused with dynamic HTML, a term usually used
    when discussing web pages that exhibit dynamic behavior such as pop-up windows,
    image rollovers, dynamic clickable menus, and similar super-duper fancy candy
    edge. Dynamic HTML is often implemented with JavaScript and the Document Object
    Model (DOM).


    Dynamic content is illustrated in Figure 1.3. If the user enters the URL www.example.com/cgi-bin/a.cgi,
    the server (www.example.com) receives a request to execute a program named a.cgi
    (the server knows it is an executable program because of the cgi-bin in the URL).
    The server locates the file on its local drive, perhaps at /var/www/cgi-bin/a.cgi,
