  md: '# 12.7.2 MySQL Functions, Part 2


    mysql_select_db()—Select a Database


    One might grow weary of specifying the database each time it''s called; luckily
    the developers of PHP did also. This function selects a database that is used
    by all subsequent mysql_query() function calls. The function returns true if successful,
    false on error:


    ```

    mysql_select_db("books")

    die("select failed - " . mysql_errno() . ": " . mysql_error());

    ```


    mysql_query()—Query a Selected Database


    This function queries the currently selected database and returns true if successful,
    false on error:


    ```

    mysql_query("SELECT * FROM books")

    die("query failed - " . mysql_errno() . ": " . mysql_error());

    ```


    mysql_fetch_array()—Fetch a Row as an Associative Array


    This function returns the next row as an associative array with the table field
    names as the array keys and the table values. It returns the fetched row or false
    if there are no more rows. Each column is stored as an array element, where the
    field name is used as the key:


    ```

    ?

    $array = mysql_fetch_array($result)

    echo "ISBN: " . $array["isbn"]

    echo "Title: " . $array["title"]


    ?>

    ```


    mysql_affected_rows()—Return the Number of Affected Rows


    This function returns the number of affected rows from the last INSERT, UPDATE,
    or DELETE MySQL query:


    ```

    ?

    $result = mysql_query("DELETE FROM books WHERE isbn = ''0596001320''")

    echo "This should be 1: " . mysql_affected_rows($result);


    ?>

    ```'
