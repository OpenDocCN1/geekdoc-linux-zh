  md: '# # Apache Web Server


    # ##3.1 INTRODUCTION


    The web pages you see when you surf the Web (quit slacking, you!) are served up
    via the HyperText Transfer Protocol (HTTP) by an httpd daemon—the “d” at the end
    means daemon, programs that are always running in the background.


    Currently, Apache is the webserver of choice, and not just for Open Source bigots.
    As of this writing, Apache has more than 60 percent of the active site webserver
    market share (see www.netcraft.com/survey/). Because it is so widely used, it
    is widely tested, and when a bug is discovered or a new Web feature is implemented,
    bug fixes and updates are almost instantaneous. Apache is a BSD-type Open Source
    license, making it attractive for both commercial and noncommercial applications.
    Its modular architecture makes it feasible to tailor Apache to the environment
    you want to serve. Examples of major sites using Apache are Amazon and Yahoo—people
    who know how to handle Web traffic.


    Apache originated, did many things Web, as an indirect offshoot of the National
    Center for Supercomputing (NCSA) at the University of Illinois Urbana-Champaign
    (UIUC).^3


    > ^1In distributions, the daemon is called apache instead of http.

    2Tim Berners-Lee invented the World Wide Web at CERN, the European high-energy
    physics (HEP) research. One of us is a high-energy physicist, and WWW was invented
    so that large HEP collaborations involving hundreds of scientists at dozens of
    locations could communicate results, data, software. The Open Source applications
    most of us today, Netscape and Apache originated from NCSA in one or more.

    3The NCSA webserver was widely used, but eventually NCSA stopped supporting it.
    Many people began creating patches to add functionality and fix bugs (it was Open
    Source, after all). Eventually, developers decided to make a full-blown non-NCSA
    project Apache because it was based on a “patchy” bit of code. It is also a good
    story from these origins about Mosaic, Netscape, failed dotcoms, and monopolistic
    rulings over software companies. But not here, now ...'
