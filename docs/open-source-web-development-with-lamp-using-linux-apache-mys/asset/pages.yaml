  md: '# The Web Explained


    The World Wide Web may seem like magic, until you understand how it works. In
    this chapter, we offer a brief introduction of what happens when you click a link,
    enter a URL into the location box, or otherwise request a web page. This description
    is necessary to understand how the different components of the Web fit together
    and how the tools presented in this book fit into the Web''s framework.


    # 1.1 HOW IT WORKS


    To give you a clear picture of how the parts discussed in this book interrelate,
    Figure 1.1 shows a pictorial overview of the Web. The Web is usually accessed
    through a browser, the most well known of which are Netscape/Mozilla and Internet
    Explorer. There are many alternative browsers, including Galeon, Konquerer, OmniWeb,
    and Opera, and also text-based options such as Lynx, links, and w3.


    When you click a link or type a URL into the location box (for instance, www.example.com),
    the browser makes a socket connection (also known as a network connection) to
    the server www.example.com. The name www.example.com maps to an Internet address,
    which is a number in the form 1.2.3.4—an IP, or dotted quad. The browser connects
    to www.example.com using port 80, the port the server operating system opens for
    such HTTP requests. This port is standardized. Other ports are used for other
    Internet connections: 22 for SSH, 23 for Telnet, and so on. (SSH and Telnet are
    addressed in Chapter 2.) It should be clear that IP port numbers are not related
    to the physical ports of the machine (COM1 and COM2, USB, Firewire, parallel printer
    port, etc.).'
  merge: -1
