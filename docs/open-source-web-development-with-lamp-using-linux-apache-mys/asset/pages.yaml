  md: '# 208 PART III Dynamic


    The program''s name is followed by a question mark (?). The question mark is then
    followed by this funny looking text:


    ```

    username=J.+Random=Lucy+age=55

    ```


    This data is called URL encoded data and is passed into the CGI program through
    the query string. It is the data from the form that is encoded into a format that
    can be sent to the webserver through the URL.


    > If we wanted to look at this data in the program, we could get the query string
    information by executing query_string(). But usually we don''t grab the data directly.
    Instead, we let CGI.pm care of things for us.


    The query string format is a collection of form widget name/value pairs separated
    by the equal sign (=), each pair separated from the next by an ampersand (&).
    So in the example, there are two name/value pairs:


    ```

    username=J.+Random+Luser

    ageage=55

    ```


    The text that is posted may contain text that is not legal in a URL (such as a
    space). This text is encoded before being sent to the server. Spaces are replaced
    with the plus sign (+), as shown in the example, and other disallowed characters
    are replaced with a percent character hexadecimal representation of that character''s
    ASCII value. For instance, the exclamation point character (!) is replaced with
    %21.


    The URL contains the posted data following the “?” because the form was created
    with method="GET". The GET method passes the data through the URL in the query
    string. The alternative is to use method="POST". This method passes the data to
    the CGI program through its standard input instead of through the URL. Either
    way, CGI.pm handles the data passed in. These are the contents of nameage.cgi:


    ```

    #!/usr/bin/perl

    # nameage.cgi


    use strict;

    use CGI `:standard`;


    my $name = param(`username`) || `John Doe`;

    my $age param(`age`) || 0;

    my @params = param();

    ```'
