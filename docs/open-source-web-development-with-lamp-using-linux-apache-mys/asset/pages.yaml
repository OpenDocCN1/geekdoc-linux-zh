    PART I Structural


    # 3.5 CREATE THE WEB SITE


    The best way to learn is by doing, so you''ll build an example web site on your
    machine as we go along. After you''re done, you''ll have installed and configured
    the sections you''re interested in, and you can use this as a model for your own
    system, then delete it when you''re confident you understand what''s going on.
    This way, you can practice cgi-bin, mod_perl, PHP, dynamic web content, etc.,
    in the privacy of your own home before you unleash your server on the World (Wide
    Web).


    There are two approaches you can take to experiment with the examples in this
    book: Either download the entire web site, including all of the examples, or you
    can create the examples yourself using your favorite editor.¹10


    # 3.5.1 Downloading the Examples


    If you follow the lazy approach to programming, you understand the importance
    of copy-paste. If you choose to download all the examples, go to www.opensourcewebbook.com/sourcecode/.
    Follow the instructions on how to obtain a username/password. You will need the
    password to download the source-tar.gz and view all the examples. Once you''re
    ready, click the link for source.tar.gz/password. Save the tarball in a convenient
    place, say in /tmp.


    Now, as root, execute the following commands:


    ```

    # mv /var/www /var/www.old

    # mkdir /var/www

    # chown jrl /var/www

    # cd /var/www

    # tar xzvf /tmp/source.tar.gz

    # find . -exec chown jrl { \ }

    ```


    First, the web site that came with Red Hat is moved to /var/www.old. Then, a new
    directory is made for the downloaded source, and this new directory is to be modified
    by jrl (select a user that you created


    ¹⁰Microsoft Word and its ilk are not suitable for much of the editing you will
