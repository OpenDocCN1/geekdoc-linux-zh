- img_proc: true
  md: '# PART I Structural


    ![](img/9b05e38e58495be06a08eeb2b6906346_39_0.png)


    # Client


    +   - Render HTML images, etc.

    - Execute JavaScript

    - Execute Java applets

    - Send data to server using CGI protocol


    # Server


    +   - Serve up content

    - HTML

    - Images

    - Documents, etc.

    - Process data received from client


    Figure 1.1 How the Web works


    Based on what the client requests, the server serves up, or delivers, information
    to the client. The type of data the server serves up includes plain text (this
    includes HTML), images, Java applets, various types of documents, PDFs, etc. This
    content that the server delivers can be generated by the server in one of several
    ways: static, dynamic, or embedded (each of these is discussed later).


    The client''s job is to receive from the server a stream of text, images, Java
    applets, documents, and so on and render, or appropriately display, them. The
    client also executes any JavaScript code and Java applets that are served up.¹
    The client can send data to the server using the Common Gateway Interface (CGI)
    protocol (see Chapter 7). The server can then process this data in whatever it
    chooses. There are two sides to the processing that goes on: the client side and
    the server side. These two terms mean pretty exactly what they seem to mean. The
    cool thing about this, with many other things Web, is that once protocols are
    established,


    > ¹JavaScript should not be confused with Java; they are two different types.
    JavaScript, originally called LiveScript, is a language created by Netscape (www.netscape.com)
    that executes within the browser to create things like pop up windows, image rollers,
    and other nifty client-side things. Java is a platform-independent programming
    language created by Sun Microsystems (www.sun.com) that is often used to create
    applets that are downloaded and executed within the browser.'
  merge: -1
