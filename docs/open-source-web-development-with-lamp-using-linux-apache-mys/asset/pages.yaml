  md: '# CHAPTER 12 PHP 379


    We are not using XML in these examples, so we don''t need to use the <?php ...
    ?> syntax. Also, because our favorite HTML editors are we and emacs, we don''t
    need the <script> syntax (we don''t use FrontPage or other HTML editors—if you
    do, plan accordingly). We use the first style in our examples.


    # 12.3 CONFIGURATION


    If you installed Linux as suggested in Chapter 2, Apache is already configured
    for PHP. To use PHP, simply name the PHP files with the .php extension.


    You might note that this approach is contrary to that used for Emberry and Mason,
    where we decided against using a separate extension for those files. The logic
    was not to provide much information about our site and to keep a clean URL look
    throughout the site (all pages are accessed through an .html extension). But because
    Apache is configured to use .php files out of the box, we will stick with it of
    sheer laziness (one of the desirable properties of a good programmer).


    There is a way to configure Apache so that all .html files in a directory are
    processed by PHP. See the docs for more information.


    # 12.4 A COUPLE OF QUICK EXAMPLES


    We''ll start with two quick examples. Create a new directory for PHP work and
    cd into it:


    ```

    $ mkdir /var/www/html/php

    $ chmod a+rx /var/www/html/php

    $ cd /var/www/html/php

    ```


    Create a PHP file named hello.php:⁴


    ```

    <html>

    <head>

    <title>Hello, world! with PHP</title>

    </head>

    <body bgcolor="#ffffff">

    <?php echo "hello, world!" ?>

    </body>

    </html>

    ```


    > ⁴Remember the permissions, 644.'
