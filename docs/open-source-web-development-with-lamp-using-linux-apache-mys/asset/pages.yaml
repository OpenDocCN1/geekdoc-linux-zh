    # 10.5.2 [ - Perl Code -]


    In the however examples, we''ve used the construct [- ... -] repeatedly. This
    command executes the Perl code, but the return value of the code isn''t printed
    into the HTML, as is with the [+ ... +] construct. However, if you print() within
    the [- ... -], that printed text finds its way onto the HTML page. The easy way
    to remember this is that the results of whatever you put inside the [+ ... +]
    end up in the browser, while that inside [- ... -] doesn''t (unless you print()).


    Here is one example we have seen:


    ```

    [-]

    $msg = hello, world!;

    ]

    ```


    This assigns a value to the variable $msg but doesn''t generate any output that
    would be displayed by the browser.


    This command can be used to execute arbitrary code, as:


    ```

    [-]


    # connect to a MySQL database

    use DBI;


    $user = ''someuser'';

    $pass = ''password'';


    $dbh = DBI->connect(''DBI:mysql:somedb'', $user, $pass);

    ]

    ```


    That code a lot of database things that might need to be done, it does not generate
    any HTML that is sent to the browser.


    # 10.5.3 [ ! Perl Code !]


    This command is the same as [- ... -] except that the Perl code within is executed
    only the first time the page is requested (or when the page is modified). Recall
    that in Embperl, the page is compiled the first time it is requested, and then
    it is cached for quick execution for all following requests.'
