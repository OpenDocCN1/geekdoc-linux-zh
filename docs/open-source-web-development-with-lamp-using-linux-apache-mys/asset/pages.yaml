    # 12.8 PROJECT


    The PHP project is a simple journal-entry manager. Several PHP pages are implemented:
    a launching point, a page to add an entry, a page to view the last ten entries
    with the option of searching for matching entries, and a page to view the details
    about a specific entry. The journal entries are stored in MySQL database and dynamically
    displayed in the PHP pages.


    # 12.8.1 Journal MySQL Database


    First, the database is created. The database is named journal, and there is one
    table named entries. The entries table has four fields:


    +   - id—This is a unique integer to identify the entry that the user wants to
    see displayed; it is an auto_increment field (discussed later) and the key into
    the table.

    - date—This is the date and time the item was entered into the table; we discuss
    this data type later.

    - title—This is the title of the entry, a 60-character text field.

    - text—This is the text of the entry, a BLOB.


    The id is defined as an auto_increment integer. This is a special type of integer
    that does not need to be assigned a value when a row is entered in the table—it
    automatically takes the value of the most recent (or highest) value in the table
    plus 1.


    For instance, when the first record is added, id is automatically assigned 1.
    When the second record is added, it is assigned 2, and so on for all the records.
    This data type ensures a sane value for each key entered into the table, and the
    programmer doesn''t have to do any extra work to ensure that it receives a good
    value.


    The date is defined as a datetime data type, which is a string that resembles
    2002-04-19 07:36:09, or the year-month-day:hour:minute:second. Each record is
    stamped with the time that it was entered into the database, so the most recent
    entries can easily be grabbed by selecting them ordered'
