  md: '# CHAPTER 9 Server Side Includes


    If you want to know more about all the possible configurations of the timefmt
    directive, check out man strftime.


    # set Directive


    The set directive allows us to create variables. Its syntax is:


    ```

    <!--#set var="varname" value="varvalue"-->

    ```


    Here is an example:


    ```

    <!--#set var="name" value="Ron"-->

    Name is: <!--#echo var="name"-->

    ```


    This SSI produces the text "Name is: Ron."


    # if Directive


    Simple conditional expressions are available with the if/elsif/else/endif.

    This is the syntax:


    ```

    <!--#if expr="expression1"-->

    text generated if expression1 is true

    <!--#elseif expr="expression2"-->

    text generated if expression2 is true

    <!--#else-->

    text generated if expression1 is false and expression2 is false

    <!--#endif-->

    ```


    Here is a simple example that tests whether the $DATE_LOCAL SSI variable contains
    the text "AM" (if so, it is morning):


    ```

    <!--#config timefmt="%p" -->

    <!--#if expr="$DATE_LOCAL = /AM/"-->

    <p>Good Morning!</p>

    <!--#endif ---->

    ```


    First, the time format is configured to display "AM" or "PM". Then, the variable
    $DATE_LOCAL is checked to see whether it matches the regular expression /AM/,
    and if so, the expression is true. We could have checked to see whether the variable
    did not match the regular expression /PM/ with:


    ```

    <!--#if expr="$DATE_LOCAL != /PM/"-->

    ```'
