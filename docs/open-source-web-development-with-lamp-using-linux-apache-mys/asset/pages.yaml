  md: '# CHAPTER 1 The Web Explained


    # 1.1.3 Serving Up Content with Embedded HTML


    Another, more flexible way to create dynamic web pages is to use embedded HTML,
    or executable code embedded within an HTML file. This is a good approach when
    working on the web site are from disparate backgrounds. For instance, if a person
    who knows HTML but is not a programmer builds the template for the web page, a
    programmer can come behind them and add executable code directly into the HTML
    file to make the page come alive. Not static, not quite dynamic, embedded web
    pages provide a measure of flexibility.


    This enables a Web designer—perhaps an artist or a graphic designer rather than
    the stereotypical artist challenged nerd (like us)—to create a web site that is
    usable and eye-pleasing instead of average and plain. Then, after the artist has
    created the look and feel, the programmers can come in and add executable code
    right into the HTML to change the static content into dynamic content, livening
    a good-looking but static site. Of course, one of the target audiences of this
    book is the graphic designers and artists who design web page look and feel, potentially
    cutting out the necessity for nerds entirely. Not versa, though, because it''s
    easier to learn programming than to graphical design.


    Figure 1.4 shows how this type of processing works. Let''s say the user enters
    the URL which grabs the HTML file, perhaps /var/www/html/a.html, and preprocesses
    it in some way, generating HTML by executing the code within the original HTML
    file; the result is then sent to the client.


    We examine four approaches to embedded programming:


    +   * SSI (Server Side Includes; see Chapter 9)—a simple solution that is built
    into Apache, using a syntax that is unique to SSI

    * Embperl (see Chapter 10)—a Perl module that enables an HTML file to have Perl
    code embedded within it

    * Mason (see Chapter 11)—another Perl module that, like Embperl, enables an HTML
    file to have Perl code.embedded within it

    * PHP (see Chapter 12)—a language unto itself, Perl-like in providing a rich collection
    of built-in functions to perform various tasks


    > ³An example of the former is this book''s web site—www.opensourcewebbook.com—designed
    by the excellent artistic folks at BDGI (www.bdgi.com). An example of the latter
    can be found at www.1fokr.org.'
