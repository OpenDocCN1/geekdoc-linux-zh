    command man is a good place to start. Most man pages use examples and further
    links at the bottom. You can use man -k foo when you don''t know exactly what
    you are looking for.


    cd Change directory. It operates either on a fixed path (cd /usr/share/misc) or
    on a relative path (cd bin would take you to the bin directory below your current
    working directory, if that directory exists). The following are a few standard
    shortcuts:


