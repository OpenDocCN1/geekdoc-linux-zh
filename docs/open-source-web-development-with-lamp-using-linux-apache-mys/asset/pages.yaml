  md: "# CHAPTER 4 Perl 99\n\n# 4.3.10 Additional Perl Constructs\n\nPerl allows you\
    \ to write code that reads a lot like English. It also allows you to write code\
    \ that's completely unreadable, but that's another issue.¹12\n\n# The unless Statement\n\
    \nThe unless is like the if, except the logic is reversed. The basic syntax is:\n\
    \n```\nunless (condition) {\n  statements\n}\n```\n\nThe condition is tested,\
    \ and if it is false, the statements are executed. Thus, this if statement:\n\n\
    ```\nif ($done) {\n  print \"keep working!\\n\"\n}\n```\n\ncan be written as:\n\
    \n```\nunless ($done) {\n  print \"keep working!\\n\"\n}\n```\n\n# The until Loop\n\
    \nThe until loop is like the while loop, except the logic is reversed. The basic\
    \ syntax is:\n\n```\nuntil (condition) {\n  statements\n}\n```\n\nThe condition\
    \ is tested, and if it is false, the statements are executed. Then the condition\
    \ is tested, and if it is false... Thus, this while loop:\n\n```\nwhile (not $done)\
    \ {\n  keep_working();\n}\n```\n\n> ¹²The Perl Journal (www.tpj.com/) conducts\
    \ the annual Obfuscated Perl Coding Contest—an enlightenment, if somewhat frightening,\
    \ experience."
