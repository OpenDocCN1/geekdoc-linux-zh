    foo\");\n```\n\n$a receives the value \"foo\", but $b receives its default value,\
    \ 4, and $c receives its default value, 6. If the function is called as:\n\n```\n\
    default_args();\n```\n\neach variable receives its default value.\nArguments can\
    \ be dropped only at the end of the list, not at the beginning. Thus default_args(\"\
    bar\"); is a syntax error. You must provide the value for the first argument:\n\
    \n```\ndefault_args(\"bar\");\n```\n\nLet's look at a complete example. It illustrates\
    \ the two preceding concepts it shows that a function can receive its argument\
    \ array variable. The example can be found in /var/www/html/php/function3.php:\n\
    \n```\n?\nfunction no_default_args($a, $b, $c) {\n    echo \"<hr>\";\n    echo\
    \ \"no_default_args(): \\$a <br>\";\n    echo \"no_default_args(): \\$b <br>\"\
    ;\n    echo \"no_default_args(): \\$c <br>\";\n}\n\n// this function is defined\
    \ so that the arguments\nave have default values\ndef default_args($a = 2, $b\
