  md: "# 270\n\n# PART III Dynamic\n\n```\n# check for nastiness - first, is\n# the\
    \ query string too big?\nif (length($query_string) > 100) {\n    return OK;\n\
    }\n\n# now check to see if the query string\n# contains anything besides word\
    \ characters\n# ([a-zA-Z0-9_-]) or the equal sign (=)\nunless ($query_string ~\
    \ /^\\[w-]+\\$/) {\n    return OK;\n}\n```\n\nThe program then does something\
    \ crucial—it does a sanity check of the data to make sure someone is not calling\
    \ our program with less honorable intent. First it checks that the query string\
    \ is not huge—makes sure a dev person hasn't invoked this program with a giant\
    \ query string (which could fill our e-mail spool file quite rapidly). Then it\
    \ checks to see that the query string contains valid characters (word characters\
    \ or \"=\"). These measures are important! Even though we haven't put them in\
    \ every example we've discussed, every working program you write should contain\
    \ similar precautions.\n\n```\n# ok so far, open a pipe to sendmail,\n# and if\
    \ it opens ok, send text into it -\n# this text will be an e-mail message\nif\
    \ (open SM, '/usr/sbin/sendmail -t -oi') {\n    print SM <<EOM;\nFrom: mod_perl\
