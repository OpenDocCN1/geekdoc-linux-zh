  md: '# 378 PART IV Embedded


    posted data is simple, so form data can be processed easily. The syntax is a bit
    simpler than Perl. Like Perl, PHP is object oriented, so you can create classes,
    methods, etc.


    PHP has some limitations. For one thing, PHP requires that you learn YAPL.³ Although
    PHP has numerous built-in functions to do most things we would need to do, it
    is not Perl based, as are Embperl and Mason. With Embperl and Mason, you can download
    and install modules from CPAN and then use them, making Embperl and Mason programs
    more flexible and extensible. PHP is more self-contained and slightly more limited
    than Perl (that’s a bit of an understatement—no reflection on PHP, but Perl is
    a big language with which one can literally do anything related).


    Hard-core Perl programmers are likely to stay with Embperl and Mason. Others may
    choose PHP. Try them all and make your own choice.


    # 12.2 EMBEDDING PHP INTO HTML


    There are several ways to embed PHP code into HTML documents. One way is to put
    the PHP code within the tags <? ?>:


    ```

    <? echo "hello, world!"; ?>

    ```


    Most PHP programmers choose this syntax. If PHP is combined with XML, however,
    there are conflicts in this syntax. In XML the <...> construct is a special thing
    called a *processing instruction*. If PHP and XML are needed in the same file,
    one can use the alternative PHP tag <?php ... ?>:


    ```

    <?php echo "hello, world!"; ?>

    ```


    Some HTML editors (as from FrontPage) don’t like processing instructions, so another
    alternative is to use the <SCRIPT> tag. The syntax is: <SCRIPT LANGUAGE="php">
    echo "hello, world!";</SCRIPT>


    And last but not least, the final way is to use a style similar to one in Mason:
    the <% ... %> tag:


    ```

    <% echo "hello, world!"; %>

    ```


    > ³ Another Programming Language—but for us nerds, learning another language is
    a good thing. Imagine how much better your resume would look if you added PHP!'
