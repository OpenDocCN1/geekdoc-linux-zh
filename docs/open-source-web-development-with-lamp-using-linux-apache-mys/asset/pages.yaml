  md: '# 10


    # # Embperl (HTML :: Embperl)


    # ## 0.1 INTRODUCTION


    HTML :: Embperl (aka Embperl) is a Perl module that allows the execution of server-side
    programming code by embedding Perl code into HTML files. Embperl, written and
    maintained by Gerald Richter, can be found at http://perl.apache.org/embperl/


    A powerful feature of Embperl is that it is hooked into mod.perl. Most mod.perl
    features apply to Embperl, so if you know mod.perl, you need only a bit more to
    use Embperl. As in mod.perl, the code in the page is compiled only the first time
    it is called (or when the file is modified), as is the case with Apache::Request
    programs with mod.perl.


    The result of the compilation is cached so that the next time the page is requested,
    the Perl code does not need to be recompiled. It is the Perl code compilation
    that is cached, not the generated HTML code. This means that the next time the
    page is requested, the Perl code reexecutes (but does not recompile) a recompile
    is forced, but that is a good thing because we want the changes to take effect.
    After the recompile, the Perl code is again cached. This makes for efficient execution
    also as in mod.perl, the internals of Apache are available to use if we want them,
    so Embperl can hook into Apache''s different phases (such as authentication and
    logging) if the application warrants it.


    Embperl is basically Perl code—and you know how we feel about Perl. You can write
    Perl server-side programs embedded within HTML files. Mmmm, Perl...'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# 10.2 INSTALLING EMBPERL


    Embperl does not come standard on Red Hat (yet), so you need to install it. Get
    the latest source from http://ftp.dev.ecos.dev/pub/perl/embperl/. As of this writing,
    the latest beta release is 2.0b3,so the file we want is HTML-Embperl-2.0b3.tar.gz.
    Save it in /tmp.


    Change directory to /tmp and do the following:


    ```

    $ cd /tmp

    $ tar xzf HTML-Embperl-2.0b3.tar.gz

    $ cd HTML-Embperl-2.0b3

    $ perl Makefile.PL

    ```


    You will then be prompted for some site-specific information. The important information
    you need is the locations of the following files:


    +   * httpd-located at /usr/include/apache/httpd

    * httpd-located at /usr/sbin/httpd

    * mod.env.so-located at /usr/lib/apache/mod.env.so


    Check these files can be found at these locations on your machine. If you find
    them in a different location, make the necessary adjustments in the following
    responses (wrapped for readability):


    Build with support for Apache mod_perl?(y/n) [y]y

    Searching for Apache sources...

    Look at

    Look at ../src

    Look at ../src

    Apache sources not found, enter path name or q to quit

    [/usr/include/apache

    Searching for Apache sources...

    Look at /usr/include/apache

    Use /usr/include/apache as Apache source(y/n) [y]y

    Will use /usr/include/apache for Apache Headers

    Enter path and file to start as http [/usr/include/apache/httpd]

    [/usr/sbin/httpd

    Apache Version Server version: Apache/1.3.19 (Unix) (Red-Hat/Linux)

    Library for mod.env.c not found, please enter path to mod.env.so

    [/usr/lib/apache]


    > The latest stable release was 1.3.4, but the new release, version 2, will probably
    be the stable release when this book is printed, so we will install version 2.'
  merge: -1
