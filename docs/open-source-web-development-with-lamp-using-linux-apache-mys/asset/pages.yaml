  md: '# 7.6.2 Named Parameters versus Ordered Arguments


    When we executed start.html(), we used named parameters—for example, -title and
    -bgcolor. CGI.pm provides this way of invoking functions so that we can pass a
    lot of data into them in a readable, maintainable way. But there is another way
    of calling CGI.pm functions, which is based on the order of arguments.


    For instance, we could invoke start.html() as:


    ```

    print start_html(-title => `My Title`);

    ```


    or by order, as in:


    ```

    start_html(`My Title`);

    GI.pm is written so that if named parameters are not used, it knows the order
    of the arguments. We know that the first argument to start.html() is the title.
    This invites the question, What is the second argument? This difficult-to-remember
    detail is obtainable by quickly skimming the documents (perdoc CGI).

    ```


    # 7.7 INFORMATION RECEIVED BY THE CGI PROGRAM


    A CGI program receives three types of information from the server:


    +   * Client request information

    * Path information

    * Posted data


    We look at each of these in turn.


    # 7.7.1 Request Information


    The webserver makes available to the CGI script information about the current
    request called session information. This information can be retrieved with several
    provided methods.


    Client information consists of the following:


    +   * remote_host()—the name of the client machine

    * user_name()—the name of the user if authenticated'
