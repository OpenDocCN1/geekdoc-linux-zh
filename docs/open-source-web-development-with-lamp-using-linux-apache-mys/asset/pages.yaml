  md: "# CHAPTER 8 mod.perl 271\n\nIf everything is fine with this data, the program\
    \ opens a pipe into the sendmail program. A pipe is a connection to a program,\
    \ such as sendmail, that reads from its standard input. For this application,\
    \ sendmail is invoked with a few options: -t means the To: list will be read from\
    \ the header, and -oi means lines with a single period on them will not terminate\
    \ the input. The program then builds the mail header, followed by an all-important\
    \ blank line, before the body of the e-mail is built. The e-mail is sent to the\
    \ recipient(s) when the pipe is closed(close).\n\nApache needs to be configured\
    \ to use this code during the logging phase. To do that, the /booklisting/ and\
    \ /bookdetail/ sections of /etc/conf/http.conf must be modified to have the following\
    \ content:\n\n```\n<Location /booklisting>\n  SetHandler perl-script\n  PerHandler\
    \ BookListing\n  PerLogHandler BookMailLog\n</Location>\n```\n\n```\n<Location\
    \ /bookdetail>\n  SetHandler perl-script\n  PerHandler BookDetail\n  PerLogHandler\
    \ BookMailLog\n</Location>\n```\n\nThe addition of the PerlLogHandler lines tells\
    \ Apache to use this module during the logging phase. Normally, the logging phase\
    \ simply logs to the access_log file, but we are adding functionality to send\
    \ an e-mail. We can add just about anything in the logging phase: log to another\
    \ file, execute system programs, or add data to an SQL database.\n\nRemember to\
    \ reload the new Apache configuration file by restarting the server. When this\
    \ page is requested, e-mail is sent. Here is an example of what might be sent\
