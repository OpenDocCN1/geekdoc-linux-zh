  md: '# 12 PART I Structural


    them). Paying for a CD both gives the prospective user the documentation and usually
    some degree of technical support, and supports the companies that propagate and
    improve Linux.


    Many individuals, organizations, and companies make Linux distributions for different
    purposes and with different philosophies. The following is a quick list of the
    main ones, in no particular order (see www.distrowatch.com to keep up with them):


    +   - Debian Debian GNU/Linux is developed and maintained entirely by volunteers.
    The Advanced Package Tool (apt) is very powerful and highly esteemed—many people
    think this is the best updater around. It is one of the easiest distributions
    to keep up to date. The apt-get mechanism handles package dependencies nearly.


    +   - Red Hat This is probably the most popular Linux distribution in the United
    States. Red Hat has worked with a number of vendors to provide Red Hat Linux preinstalled
    on PCs. Red Hat is feature and application rich, and easy for new Linux users
    to learn. Red Hat created the Red Hat Package Manager (RPM) system, a similar
    system to apt to keep software up to date, which is used by many distributions.
    The Red Hat update mechanism provides a package dependency resolution similar
    to apt-get. For what it''s worth, apt-get has been ported to Red Hat, and you
    can update your distribution in that manner. Red Hat boasts a number of high-profile
    Open Source software employees.


    +   - Slack One of the first distributions, Slack is still used by many hard-core
    Linux users. It contains user-friendly interfaces similar to other Linux distributions,
    but it generally goes for "power over pretty."


    +   - SuSE The most popular distribution in Europe, especially Germany, SuSE has
    become more popular in the United States as well. It uses a variant of the RPM
    package format and includes a sophisticated configuration tool called YaST (Yet
    another Setup Tool) to make administration easier. SuSE supports many types of
    hardware and many configurations not available in other distributions, and includes
    several security scripts and tools that can run to inform you of problems.


    Mandrake took the Red Hat distribution, an easy-to-use installer, and changed
    the default desktop from Gnome to KDE, thus arriving at one of the more popular
    distributions. It has a reputation for being easy to use, easy to install, and
    cutting-edge.'
