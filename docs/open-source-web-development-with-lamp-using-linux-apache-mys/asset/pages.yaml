    # 7.6 CGI.pm HTML SHORTCUTS


    In addition to the methods discussed previously, CGI.pm has functions for most
    of the commonly used HTML tags, including headings (h1(), h2(), h3(), etc.), paragraph
    breaks (p()), lists (li(), dl(), ul(), dd(), etc.), and text-formatting commands
    (i(), em(), blockquote()).  See the CGI.pm documentation for details of all the
    shortcuts available.


    # 7.6.1 Using HTML Shortcuts


    Using these shortcuts is as straightforward as the previous example. Printing
    a heading:


    ```

    <h1>Welcome to www.opensourcewebebook.com/</h1>

    ```


    becomes:


    ```

    $server_name = `/bin/hostname`;

    print h1("Welcome to $server_name")

    ```


    > An HTML paragraph, <P>, is formatted as print p(); (no arguments), while


    ```

    print p(`This is a new paragraph`);

    ```


    is equivalent to this:


    ```

    <P>This is a new paragraph</P>

    ```


    A list of arguments gets concatenated. This CGI.pm code:


    ```

    $name = `John Doe`;

    print p(`hello `, $name, `, how are you?`);

    ```


    results in this:


    ```

    <P>hello John Doe, how are you?</P>

    ```'
  merge: -1
