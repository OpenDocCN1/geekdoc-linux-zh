  md: '# 5.2.3 The CREATE TABLE AND SHOW TABLES Commands


    Each table within the database must be defined and created. This is done with
    the CREATE TABLE command.


    Create a table name age_information to contain an individual''s first name, last
    name, and age. MySQL needs to know what kind of data can be stored in these fields.
    In this case, the first name and the last name are character strings of up to
    20 characters, and the age is an integer:


    ```

    mysql> CREATE TABLE age_information (

    -> lastname CHAR(20),

    -> firstName CHAR(20),

    -> age INT

    -> );

    Query OK, 0 rows affected (0.00 sec)

    ```


    It appears that the table was created properly (it says OK after all), but this
    can be checked by using the SHOW TABLES command. If an error is made, the table
    can be removed with DROP TABLE.


    When a database in MySQL is created, a directory is created with the same name
    as the database (people, in this example):


    ```

    # ls -l /var/lib/mysql

    total 3

    drwx-xr-x 2 mysql mysql 1024 Dec 12 15:28 mysql

    srwxrwxrxr-x 1 mysql mysql 0 Dec 13 07:19 mysql.sock

    drwx-xr-x 2 mysql mysql 1024 Dec 13 07:24 people

    drwx-xr-x 2 mysql mysql 1024 Dec 12 15:28 test

    ```


    Within that directory, each table is implemented with three files:


    ```

    # ls -l /var/lib/mysql/people

    total 10

    -rw-rw-rw- 1 mysql mysql 8618 Dec 13 07:24 age_information.frm

    -rw-rw-rw- 1 mysql mysql 0 Dec 13 07:24 age_information.MYD

    -rw-rw-rw- 1 mysql mysql 1024 Dec 13 07:24 age_information.MYI

    ```


    ```

    mysql> SHOW TABLES;

    +----------------------+

    | Tables_in_people |

    +----------------------+

    | age_information |

    +----------------------+

    1 row in set (0.00 sec)

    ```


    This example shows two MySQL datatypes: character strings and integers. Other
    MySQL data types include several types of integers'
