  md: '# Linux—The Choice of a GNU Generation


    # 2.1 INTRODUCTION


    Linux is an Open Source version of Unix developed by Linus Torvalds to port Unix
    to the Intel x86 processor [Torvalds+ 01]. This made Unix available on the most
    ubiquitous computer hardware that has ever existed, and therefore available to
    almost everyone. Linux has since been ported to almost every processor and function
    one could imagine, including gameboxes, personal digital assistants (PDAs), personal
    digital video recorders, and IBM mainframes, expanding the original concept of
    Unix for x86 to Unix for everything. Linux isn''t the only version of Unix available
    to most people (also notable are the various BSD variants, also Open Source),
    but it''s by far the most popular.


    In this chapter, we discuss how to get Linux, how to install it, and some of the
    basic commands. Here are we caught in a familiar bind: If you are familiar with
    Linux, this will be too simplistic, and if you are not, it will not be nearly
    enough. If you are in the former category, you can skim or skip this chapter;
    if the latter, we try to point you in the right direction.


    # 2.1.1 Linux Distributions


    Although Linux is free and Open Source, and you can download individual packages
    and compile them all yourself, that''s rather masochistic. Most people get Linux
    as a packaged distribution from a vendor, either by paying for a CD or downloading
    it. The distribution route is fast and easy and resolves many hardware and software
    dependency issues (though not all of'
