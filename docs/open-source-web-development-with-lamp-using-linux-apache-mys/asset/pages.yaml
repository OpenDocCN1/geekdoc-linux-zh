    \w word character [a-zA-Z0-9_]

    \W nonword character

    \s space character [ \r\n\t\f]

    \S nonspace


    The phone-number-matching regex could be rewritten:

    \d\d\d\s\d\d\d\s\d\d\d/


    That is, three digits followed by one space character, followed by three digits,
