  md: "# 3.4.5 .htaccess\n\nYou can allow access control of individual directories\
    \ with the following configuration module:\n\n```\nAccessFileName .htaccess\n\
    <Files ~\"\\.ht*\">\n  Order allow,deny\n  Deny from all\n</Files>\n```\n\nThe\
    \ AccessFileName directive defines the name of the file Apache looks at to determine\
    \ whether the client can view your web page or other parts of your site. The Files\
    \ directive says that files beginning with .ht can't be seen by anyone even if\
    \ they type the filename into their browser. Order and Deny determine how access\
    \ is controlled. Sequence is important; the last command takes precedence. The\
    \ rule is to deny everything except specifically allowed, a good rule of thumb.\
    \ More on .htaccess later.\n\n# 3.4.6 Remove server-status and server-info\n\n\
    The following directives allow clients to find out about your machine and server.\
    \ There's no reason to give crackers any more information than necessary. Comment\
    \ this out for now:\n\n```\n#Location /server-status\n# SetHandler server-status\n\
    # Order deny,allow\n# Deny from all\n# Allow from .your_domain.com\n#</Location>\n\
    ```\n\nand this:\n\n```\n#Location /server-info\n# SetHandler server-info\n# Order\
    \ deny,allow\n# Deny from all\n# Allow from .your_domain.com\n#</Location>\n```\n\
    \nIf you decide to allow this information to be given out (perhaps for debugging\
    \ from a remote site), change .your_domain.com to the specific sites you want\
    \ to have access."
