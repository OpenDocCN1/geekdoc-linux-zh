  md: '# CHAPTER 2 Linux—The Choice of a GNU Generation 19


    By convention, most Unix root accounts use the hash character (#also known as
    the pound sign) in the shell prompt to make it immediately clear that this is
    a root shell. When Red Hat is installed, root has a system prompt that resembles
    the following (assuming you are in root''s home directory):


    ```

    [root@localhost]#

    ```


    We use the following convention in this book: If you see the hash as the system
    prompt, the command that is shown to be executed by root. So, when you see this:


    # it means you are logged in as root, and you should be careful. Don''t do things
    as root that aren''t necessary.


    users can be added later. As a general practice, you should not log in root but
    as a user; then su to a root account.


    The Red Hat installer creates several other users for specific purposes: Apache
    will be owned by the apache user, Squid under squid, etc. This is part of a strategy
    to keep powerful daemons that run on low ports walled away from the root account.
    Ports numbered under 1024 are owned by root, and by accessing one of these, a
    cracker could compromise your system. Apache runs on port 80 and thus must have
    this sort of access, but it can be walled off from an actual root account by running
    under its own user, which has certain powers but isn''t root.


    When a non-root user is created in Red Hat, a default system prompt is given that
    resembles the following (assuming the user jrl is in their home directory):


    ```

    [jrl@localhost jrl]#

    ```


    The important distinction is that jrl normal, non-root user has as their system
    prompt the dollar sign ($), not the hash. By convention in this book, when you
    see examples of Unix commands executed and the prompt is the dollar sign, the
    command is to be executed by a non-root account. Don''t be root for these commands!'
