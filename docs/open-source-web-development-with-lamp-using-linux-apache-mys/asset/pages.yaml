    are the username and password to connect. Here user apache and the supersecret
    password are passed. If successful, connect() returns a database handle that is
    assigned to $dbh.


    > If one day decide that we want to migrate to another database, such as Oracle,
    we merely need to change mysql to oracle, and the rest of the scripts stays exactly
    the same, assuring the script is not executing a query that is specific to that
    database server—certainly the case with the scripts in this book. Design for portability!


    If connect() returns false, the script dies, printing the error string returned
    by the errstr() method. If the script doesn''t die, it prints a message stating
    that all is well. This gives us a warm, fuzzy feeling for maximum fuzzy feeling,
    perhaps we should have printed “hello, world"

    The last thing done is to execute the disconnect() method, allowing the Perl script
    and database to properly shut down the connection. This is only polite, and if
    you don''t call disconnect(), the script may generate an error message, and the
    MySQL server will not like you.'
