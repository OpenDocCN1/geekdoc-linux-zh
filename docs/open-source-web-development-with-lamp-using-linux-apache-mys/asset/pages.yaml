  md: '# 4


    # Perl


    # 4.1 INTRODUCTION


    The fourth letter in the LAMP acronym stands for Perl (along with the other Ps).
    Although you don''t *have* to understand any Perl to build a web site, it helps
    (Python and PHP work too). In many examples that follow throughout this book,
    we use the basics of Perl extensively.


    The purpose of this chapter is to familiarize the Perl novice with the basics.
    If you already know a C-like language, much of this will be familiar. If not,
    this chapter should introduce you to the concepts we use throughout the rest of
    the book. If you already know Perl, good for you! But this will be a rehash—feel
    free to move on.


    Perl has become a popular all-purpose programming language because of its power
    and ease of use. Once you have mastered the language rules, you can do a lot with
    a little. One of the mottos of Perl is *Perl Makes Easy Tasks Easy and Hard Tasks
    Possible*. Another is *There''s More Than One Way To Do It—MTOWTDI*, pronounced
    “Tim-Toe-Di."


    Perl originated as a text processing language.¹ Larry Wall, the creator, needed
    a language to manage and manipulate a database of text files. He designed Perl
    to be a language with built-in text processing by incorporating regular expressions
    and providing a number of text processing functions. There are have many other
    text processing languages: REXX, awk, sed, etc. But Perl has struck a chord, and
    not only with Open Source developers—it has been ported to all major operating
    systems and many minor ones. It has been (lovingly) referred to as the duct tape
    that holds the Internet together. One of the happy reports of Perl is


    > ¹There are histories of Perl at www.perl.org/press/history.html and history.perl.org.'
