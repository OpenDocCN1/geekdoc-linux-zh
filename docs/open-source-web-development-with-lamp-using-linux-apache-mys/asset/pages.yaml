    # 8.3 TURNING CGIS INTO mod.perl PROGRAMS


    One immediate benefit of mod_perl is to cache the compilation of CGI programs.
    They are compiled once and thereafter executed from memory, hence the speed of
    these programs increases substantially. Now we can use the benefits of mod_perl
    to execute our current CGI programs as they are written. The good news is that
    the CGI programs do not need to be modified—all it takes is an Apache configuration
    change.


    There are two approaches to using mod_perl to run CGI programs: Apache::Registry
    and Apache::PerlRun.


    # 8.3.1 Apache::Registry


    The beauty of the Apache::Registry module is that it takes plain-Jane CGI programs,
    like those written in Chapter 7, and automatically makes them mod_perl programs
    by compiling the programs the first time they are called, caching the compilation
    for subsequent executions. In other words, CGI programs become sort of like function
    calls because the code is compiled and ready to execute. The only thing that needs
    to be done to apply the Apache::Registry module to the CGI programs is to alter
    the Apache configuration.


    To illustrate that existing CGI programs can run under mod_perl, as usual the
    first step is to create a new directory to hold these CGI programs, /var/www/perl:


    ```

    # mkdir /var/www/perl

    # chmod a+rx /var/www/perl

    # cd /var/www/perl

    ```'
