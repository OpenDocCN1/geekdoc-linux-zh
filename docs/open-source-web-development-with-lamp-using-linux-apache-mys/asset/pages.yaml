- img_proc: true
  md: "Like C, C++, and Java, PHP allows one to break out of a loop with break and\
    \ go to the next iteration with the continue statement.\n\n# do ... while Loop\n\
    \nPHP also has a do ... while loop:\n\n```\ndo {\n  statements\n} while (condition);\n\
    ```\n\n# for Loop\n\nPHP has a C-like for for loop with two syntax options:\n\n\
    ```\nfor (start_expr; condition; step_expr) {\n  statements\n}\n```\n\nand:\n\n\
    ```\nfor (start_expr; condition; step_expr) :\n  statements\nendfor;\n```\n\n\
    # foreach Loop\n\nPHP has a Perl-like foreach loop, which iterates through arrays\
    \ in two distinct ways. Each foreach method has two syntax variations.\n\nThe\
    \ first method returns only the value and is used to iterate through enumerated\
    \ arrays.\n\n```\nforeach (array_expr as variable) {\n  statements\n}\n```\n\n\
    or:\n\n```\nforeach (array_expr as variable) :\n  statements\nendforeach;\n```\n\
    \nThese constructs loop through the array represented by array_expr, assigning\
    \ the variable variable the value of that element. The following is an example:"
