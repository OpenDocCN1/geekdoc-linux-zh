  md: '# CHAPTER 3 Apache Web Server


    # 3.4 SECURING APACHE


    As we go through the book, we discuss security issues involved with giving people
    access to a low port on your machine, but we can''t go into all the details—that
    would result in an almost 600-page book Hacking Linux Exposed [Hatch+ 02].


    Most of the configuration directives are optional; you can do as you wish for
    your setup, but you should be aware of the choices you''re making. Remember, no
    decision is also a decision.


    # 3.4.1 Set User and Group


    Make sure the user and group are set to:


    +   User apache

    Group apache


    The user and group could be apache or bozo or whatever. The important thing is
    that Apache doesn''t run as root, which, if Apache were cracked, could allow someone
    to crack your box from the root Apache account (this is called rooting your box
    is as bad as it gets). Red Hat defaults to apache. You could instead create a
    new user with useradd, with a locked account to run Apache, if you wish. For now,
    we recommend that you use with the default.


    # 3.4.2 Remove Online Manuals


    If you did the default Red Hat install (as suggested in Chapter 2), the Apache
    manuals were installed in the html directory /var/www/html/manual/, which can
    be accessed via file:///var/www/html/manual/ or http://localhost/manual/, or www.your_website.com/manual/.


    If you leave on your machine, a cracker could gain information about your machine
    and installation (such as the server version) by simply hitting this directory.
    It''s a good idea to move the manuals someplace out of the web path:


    ```

    # mv /var/www/html/manual /usr/doc/apache-1.3.24/

    ```


    > You might notice that if you do a ps aux | grep httpd, the first process listed
    is by root—this process binds the low port and spawns the apache-owned processes
    that actually handle the requests.'
