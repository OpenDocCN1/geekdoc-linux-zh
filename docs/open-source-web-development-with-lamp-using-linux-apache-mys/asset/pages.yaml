  md: '# 4.3.9 File I/O


    Since the Web is interactive, Perl scripts which don''t interact with the outside
    world will be of limited use. The scripts have to be able to accept input and
    write output. This is where file input/output comes in, or File I/O.


    # Standard Output


    We have already sending text to standard output (probably right on the terminal
    you''re looking at now) using the print() function:


    ```

    print "hello, world\n";

    ```


    # Standard Input


    You can imagine how it might be useful to be able to read data from the outside
    world. This can be done using standard input, <STDIN>, which is typically the
    keyboard, though it can be redirected to be a file or something else.


    To read input into a scalar variable, up to and including the newline character
    \n, you need only to add $line = <STDIN>;


    More usefully, this example reads the next line of data into $line, including
    the newline character:


    ```

    #! /usr/bin/perl -w

    # file: stdin.pl


    use strict;


    print "Enter your name: ";

    my $name = <STDIN>;


    print "Hello $name!\n";

    ```


    Executing program produces:


    ```

    $ ./stdin.pl

    Enter your name: J. Random Luser

    Hello J. Random Luser

    !

    ```'
