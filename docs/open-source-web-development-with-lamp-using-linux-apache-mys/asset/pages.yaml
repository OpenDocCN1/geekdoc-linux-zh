    # 2.2.6 Basic Filesystem Essentials


    For a complete explanation of where things go and why they go there, see www.pathname.com/fhs/.
    Here we give a brief list of directories that you''ll visit and what they are.
    The various versions of Unix each do things slightly differently, so there are
    no hard-and-fast rules. By the way, looking in all these directories to see what
    there''s is an excellent learning exercise.


    +   /home User directories. Your directory will be under /home/your_name_goes_here.


    +   /root The home directory of root.


    +   /usr/bin The main executables are here. This should be in your path.


    +   /bin Boot-level executables are here, and this should be in your path.


    +   /usr/sbin The main superuser commands. This should be in the root path but
    not in a user path.


    +   /sbin Basic superuser commands. Ditto.


    +   /usr/lib Contains dynamic libraries and static files for the executables in
    /usr/bin and /usr/sbin.


    +   /lib Contains libraries for the executables in /bin and /sbin.


    +   /usr/src Kernel source.


    +   /local/, /opt This is optional (local) software is installed.


    +   /usr/X1R6 Windows commands and libraries.


    +   /tmp Temporary files are stored here. In most Unices, cron runs a daemon that
    eventually deletes anything here, and some systems delete these every time the
    system is rebooted.'
