    # 7.5 CGI.pm INTRODUCED


    So far, this has been pretty thin gruel. To do more complicated things in an

    easier fashion, we introduce the Perl/CGI programmer''s friend: CGI.pm.

    CGI.pm is a Perl module written by Lincoln Stein. Our discussion of

    CGI.pm is just an introduction. Much more documentation is available.

    We recommend that you check out Lincoln Stein''s Official Guide to Pro-gramming
    with CGI.pm [Stein 98]. You can also check out the CGI.pm

    documentation with perdoc CGI.


    To use CGI.pm, tell Perl that you want to use it with the pragma:


    ```

    use CGI;

    ```


    After Perl executes this statement, your program has access to all the

    methods that CGI.pm provides. The module can be further refined by

    sifying a more convenient programming style, called the standard style:


    ```

    use CGI "standard";

    ```'
