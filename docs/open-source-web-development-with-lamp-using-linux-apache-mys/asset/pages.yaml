    # 8.3.3 Apache::PerlRun


    Apache::Registry speeds things up because programs are compiled only once, the
    first time they are executed, but there are other issues besides speed to worry
    about. As we mentioned, if the program is badly (or sloppily) written, you can
    still get into trouble.


    One typical problem seen in ill-considered mod.perl CGI programs is the use of
    global variables. When the CGI program is compiled the first, the program remains
    in memory inside Apache, and any global variables are reused each time that instance
    of httpd is used. Usually, this is not such a good idea, because the variable
    value persists from one execution to another.


    You might have some legacy CGI programs that are written somewhat sloppily (although
    we would expect you to admit it), but you still want to use them and have them
    run as fast as possible. The solution is Apache::PerlRun. It compiles the script
    each time it runs, and all variables exist only for the life of the script.


    You may think, "Hey, if the program is compiled each time, then how can using
    Apache::PerlRun be faster than plain-Jane CGI?" The answer to this good question
    is that Perl is already within Apache, loading Perl is not necessary. Also, the
    CGI program can use preloaded modules that we add to script.pl without loading
    for each execution of the script.


    To apply Apache::PerlRun to a directory of CGI programs, create a directory and
    add something similar to this to /etc/httpd/conf/httpd.conf:'
