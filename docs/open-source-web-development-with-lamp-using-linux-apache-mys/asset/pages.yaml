  md: '# CHAPTER 9 Server Side Includes


    # include Directive


    The include directive allows you to include the contents of another file in the
    current document. This is convenient if you want every page to have the same header
    and/or footer. Let''s say we have this HTML in the file header.html:


    ```

    <html>

    <head>

    <title>Server Side Includes: include Directive</title>

    </head>

    <body bgcolor="#ffffff">

    <h1>You are at www.opensourcewebbook.com</h1></h1>

    ```


    and this HTML in the file footer.html:


    ```

    <hr>

    <a href="http://www.opensourcewebbook.com/">\nhttp://www.opensourcewebbook.com/</a>

    <br>

    Date: <!--#echo var="DATE_LOCAL"-->

    </body>

    </html>

    ```


    We can wrap header and footer around any HTML (include.html):


    ```

    <!--#include file="header.html"-->

    ```


    Here is the stuff between what was included.


    ```

    <!--#include file="footer.html"-->

    ```


    Load this page by going to one of these URLs: http://localhost/ssi/include.html
    or www.opensourcewebbook.com/ssi/include.html. The result is Figure 9.3. Notice
    that footer filename, footer.html, ends in .html, which caused it to be preprocessed
    as well, showing the local date.


    # fsize and lastmod Directives


    The fsize directive inserts the size of the file specified. This is its syntax:


    ```

    <!--#fsize file="filename"-->

    ```


    By default, the size is rounded to the next kilobyte. To change the output format,
    use the config directive:'
