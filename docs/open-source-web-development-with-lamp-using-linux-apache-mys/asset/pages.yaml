    might be clearer if written as this:


    ```

    <?

    $title = "PHP is cool";necho "<title> $title</title>";

    ?>

    ```


    Variable names in PHP are case-sensitive—sa is different from $SA. Function names
    (including user-defined functions) are case-insensitive—rose() is equivalent to
    ROSE() and Rose().'
