  md: '# APACHE LOG FILES


    # 3.6 APACHE


    Apache keeps detailed logs of accesses to your web site, errors, and more. The
    Apache logs are located at /var/log/http/access_log and /var/log/http/error_log.
    These locations are configurable in httpd.conf.


    It’s a good idea to have a log monitor program running, such as swatch or logwatch,
    to keep an eye on these files for security violations and problems—It’s also a
    good idea to rotate these files regularly via logrotate, because they’ll get big
    otherwise.


    Of course, the most important use of the logs is to look at when there is a problem
    to figure out what went wrong. An access_log entry might look like this:


    ```

    192.168.1.12 - [21/May/2001:14:10:05 -0600]

    "GET /HTTP/1.0" 200 43

    "http://www.onsight.com/ "Mozilla/4.77 [en]

    (X11; U; Linux 2.4.2-i686; Nav)"

    ```


    Earlier in the chapter, we discussed how to select the information that is displayed
    in the Apache log file (we suggested the combined output). Most of these entries
    should be clear: the IP address of the requester, the date and time of the request,
    the browser user (though clever programs as Opera let tell you the server you
    want, and you can define this to be anything you want if you change the headers
    and recompile Apache, the language [en]), and some system details of the requester.
    "GET /HTTP/1.0" 200 43 means an HTTP request, and no errors (200), and 43 bytes
    were seen. (A list of errors can be found at www.ietf.org/rfc/2616.txt).


    # 3.6.1 Access Control with .htaccess


    Earlier we discussed how to enable .htaccess files in your configuration. Now
    we’ll show you how they’re used. This is useful for restricting access to certain
    portions of your web site, either by allowing access only from specific IP addresses
    or domains or by password control. In httpd.conf, for the line Directory /var/www/html
    (or whatever the directory is), there you will see:


    AllowOverride None


    Change to this:


    AllowOverride AuthConfig'
