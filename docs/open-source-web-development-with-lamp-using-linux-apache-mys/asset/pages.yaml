- img_proc: true
  md: '# 306


    # PART IV Embedded


    +   2. Use WML (see Chapter 6) to create a static look and feel—better, but not
    dynamic.


    +   3. Use CGI (see Chapter 7)—a little better; easy to do, certainly.


    +   4. Use mod.perl (see Chapter 8)—better still, but a bit too complicated, perhaps.


    +   5. Use Embperl and write functions to return top and bottom—much better.


    +   6. Use Embperl and EmbperObject—best!


    # Method 1: Hard-Code HTML Files


    All pages can be hard-coded with the same HTML. Although this seems like the simplest
    thing to do, it isn''t a great idea—if any content in the common parts, such as
    adding a link or changing the placement of a logo, every page has to be modified.
    Yuck. Good programmers are lazy, so a little work up front can save a lot of work
    later.


    # Method 2: Use WML to Create HTML Files


    Using WML, as in Chapter 6, is much better than hard-coding HTML files. Creating
    a template for a look and feel is possible, so when (not if) changes to the look
    and feel occur, the changes only be made once and will apply to all the HTML files.
    This is fine for static pages.


    WML can be used with Embperl because WML has the <protect> tag, which makes WML
    ignore all the content inside. Therefore, the WML files can be used to generate
    HTML, and that HTML can also contain Embperl code. We don''t discuss this here
    because, in practice, wrapping <protect> around all the Embperl code can cause
    us to have dozens of protected blocks, that is not pleasant. We don''t go into
    this except to mention it, but keep in mind that you can use WML and Embperl TMTTWDI
    in all LAMPS.


    # Method 3: Use CGI


    We can certainly use CGI to create dynamic web sites; we did so in Chapter 7.
    Just take the HTML created by the web designers, a bunch of print() functions,
    add our code to do the dynamic stuff (such as reading from a database), and we
    can solve the problem. This requires us to transform the HTML files into Perl
    programs. Sometimes this is more work than we want—remember, good programmers
    are lazy.


    # Method 4: Use mod.perl


    mod.perl, discussed in Chapter 8, is great for many uses, especially if we want
    to access Apache directly or if we want to speed up the CGIs. But,'
