    if ever, need to run this manually.

    - wmk: Website META Language Make A high-level front end for wml. This program
    is usually used to invoke wml with command-line options.

    - wmd: Website META Language Documentation Browser Use it to browse the WML documentation.

    - wmu: Website META Language Upgrade Utility This is a nifty tool to automatically
    upgrade WML, if necessary, by fetching the file via'
