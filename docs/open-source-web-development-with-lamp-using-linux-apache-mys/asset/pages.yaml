    # PART I Structural


    This can cause a problem. If we instead use system as a list, like this: system
    "/bin/ls", User_supplied_input; then the metacharacter ; is not treated as anything
    special—in other words, ls tries to list the file named simply ; Then it tries
    to list the files rm, -rf and /

    Use a list of arguments to system() if appropriate.


    Backquotes

    Backquotes, ``, are similar to the system() function, except the standard output
    of the command is brought into the program. For instance:

    $my_working_directory = `/bin/pwd`;

    Now $my_working_directory contains a value that resembles `/home/jrl\n`**


    The output ends in the newline character (just as it does when executed from the
    shell). Using chop()—chomp($my_working_directory = `/bin/pwd`), you can remove
    it.


    When using system() and backquotes, be sure to use full pathnames (for example,
    /bin/ls) instead of relying on the user''s PATH variable (for example, ls). Who
    knows the user''s PATH is set to? If you want them to execute the official ls,
    say it explicitly.


    # 4.4 A QUICK INTRODUCTION TO OBJECT-ORIENTED PROGRAMMING


    There is no way to avoid it—we have to talk about object-oriented programming
    (OOP) using Perl. Object-oriented programming is not a big deal though; it is
    just to give an object (a thing) actions (behaviors, also known as *methods*).
    Let''s say we have an object named *$car*. We can drive the car by executing object''s
    *drive()* method, using the nifty arrow notation: *$car->drive()*. Easy, eh? Well,
    of course it is not so easy, so we suggest that if you want an excellent discussion
    of all things OOP in Perl, see Object-Oriented Perl [Conway 99].'
