    before the HTML is processed, yet have it be physically after said HTML?

    The answer is the &lt;init&gt; block.


    The &lt;init&gt; ...&lt;/init&gt; block is a block of Perl code that is executed

    first, before anything else in the file is processed. If you want to have a

    block of Perl code that to be executed first but have it at the bottom

    of the file, this can be used. The .footer file can be rewritten as:


    ```

    <hr>

    Website: <a href="$url">&lt;$url&gt;</a>

    <br>

    Comments: <a href="mailto:$email">&lt;$email&gt;</a>

    </body>

    </html>



    &lt;init&gt;

    my $url = ''http://www.opensourcewebbook.com/'';

    my $email = ''webmaster@opensourcewebbook.com'';

    &lt;/init&gt;

    ```


    # 11.7.3 The &lt;once&gt; ... &lt;/once&gt; Section


    The &lt;once&gt; ...&lt;/once&gt; tag defines a block of code that is executed
    only

    once, when the component is first loaded. Variables and functions that are

    declared/defined in this block can be seen in all the component’s code and

    pers for the entire life of the component in the http process. This block

    is useful for declaring persistent component-scoped lexical variables and for

    defining functions. For example:


    ```

    &lt;once&gt;

    my $var = ''this is a test'';


    sub important {

    ...

    }

    &lt;/once&gt;

    ```


