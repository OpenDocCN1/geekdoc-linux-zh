    Here a tag named <link> is defined. Again, WML will remove superfluous characters.
    The attributes to the tag (here href and text) are passed into the tag through
    the variable %attributes, so the line indicates that the current definition should
    be used. In WML, tag attributes are kept in a stacklike data structure, so before
    the attributes in the tag can be used, the current values must be preserved with
    <preserve href> and <preserve text>. This means taking the current values of these
    two variables, if there are any, and saving them for later use, clearing their
    values for use with <get-var href> and <get-var text>, the previous values of
    the variables can be restored with <restore href> and <restore text>.


