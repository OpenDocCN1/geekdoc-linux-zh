  md: '# 7.7.2 Path Information


    The path information is text that is passed into the CGI program if it exists
    in the URL after the CGI program name and before the question mark (we talk about
    the question mark next, when we discuss processing posted form data). This data
    can be used for a variety of reasons: as information about a path, data that causes
    the CGI program to perform in a specific manner, or about anything that you need.


    For instance, let''s say we are writing a messaging system allowing the user to
    post and read from message boards. There are a number of boards and in each board
    a number of messages. We could pass the board that the user is browsing and the
    message they are reading through the path information, as in this URL:


    ```

    http://www.example.com/cgi-bin/messageboard/programming/19312

    ```


    In this example, the name of the program is messageboard (it could be named messageboard.cgi,
    but this is a matter of preference), the board user is browsing webprogramming,
    and the message is number 19312 (perhaps message about this book?).


    So the path information can be just about any information that you choose to pass
    in to the CGI program. The path information can be obtained from %ENV, the hash
    that contains the CGI program''s environment.


    ```

    $Env_path = $ENV{PATH_INFO} || '''';

    ```


    or using the CGI method path_info(),


    ```

    $Smethod_path = path_info() || '''';

    ```


