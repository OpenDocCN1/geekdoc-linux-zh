    - filefield()—tag for a file upload widget (must use start_multipart_form())

    - hidden()—tag for a hidden field

    - image_button()—tag for an image button

    - button()—tag for a generic button


    See the CGI.pm documents for further information.


    # 7.9 CGI SECURITY CONSIDERATIONS


    Although CGI programming is not inherently insecure, insecure CGI programs are
    easy to write. In this section, we discuss some of the most common security issues
    with CGI programs. If you heed these suggestions, you will be a long way toward
    being secure, or at least you will not be an easy target.


    # 7.9.1 Avoid Shipped and Downloaded CGI Programs


    We mentioned this before in Chapter 3, but it deserves mention again: Do not trust
    preshipped CGIs. Before developing your own CGI scripts, remove all the ones you
    find in cgi-bin, or if you want to keep them around, change their permissions
    so that they are not executable.'
  merge: -1
  pgno: 253
- img_proc: true
  md: "# CHAPTER 7 The Common Gateway Interface 219\n\nAnd never download CGI programs\
    \ from source code sites. Many contain serious problems. Besides, now that you\
    \ know how to write them, you don't need to download them. Why should you deprive\
    \ yourself of the fun of writing them yourself? At the very least, be very sure\
    \ you understand any CGI script you download, in detail, before you use it.\n\n\
    # 7.9.2 Never Assume Anything\n\nIt is very easy for a savvy cracker (or a not\
    \ so savvy script kiddy, for that matter) to pass to your CGI program fields that\
    \ you did not expect. As an example, this script executes the nameage.cgi script\
    \ and passes it an an unexpected field.⁶\n\n```\n# /usr/bin/perl\nuse HTTP::Request::Common\
    \ `POST`;\nuse LWP::UserAgent;\n```\n\n```\nuse struct;\n\nmy $ua = LWP::UserAgent->new();\n\
    my $req = POST `http://www.opensourcewebhook.com/cgi-bin/nameage.cgi` \n[ nameage\
    \ => 'John Doe', age => 95, baddata => 'gotcha' ];\n\nmy $content = $ua->request($req)->as_string;\n\
    ```\n\nThe bogus field name \"baddata\" is sent with the bogus data \"gotcha.\"\
    \ Easy to do, and all the time.⁷ Don't assume that you get only you expect.\n\n\
    # 7.9.3 Always Check Data, Including the Length\n\nTo quote a former president,\
    \ \"Trust, but verify.\" He was speaking of the former USSR and nuclear weapons,\
    \ but the philosophy is the same. The Cold War is now between you and crackers.\
    \ To deal with that reality\n\n> ⁶The code may look a bit complex to you, but\
    \ we could figure out how to take its content and modify it a bit to abuse your\
    \ favorite CGI program. But we know you would not do this maliciously. We certainly\
    \ don't suggest you do it.\n\n> ⁷In the example, sending this data to nameage.cgi\
    \ is not a big deal, because it is essentially ignored; but you can see how easy\
    \ it would be to send bogus posted data to a CGI program."
  merge: -1
  pgno: 254
- img_proc: true
  md: "you should never trust what you receive, always verify what you have. For instance,\
    \ if you expect a valid first name, you should verify that you get one:\n\n```\n\
    if ($firstname = ~ /^[\\w\\ ]+/) {\n  # all is well\n} else {\n  # there is a\
    \ problem\n}\n```\n\nThis regular expression checks to see if $firstname contains\
    \ only word characters ([a-zA-Z0-9_-]), spaces, or periods. No other characters\
    \ are allowed.\n\nChecking the length of the data is a snap:\n\n```\n$name = param('name')\
    \ || 'John Doe';\nif (length($name) > 60) {\n  # someone is being nasty\n}\n```\n\
    \n# 7.9.4 Never Trust Hidden Fields\n\nThis distrust of what you receive applies\
    \ to hidden fields as well. Let’s say that a form to purchase a new pair of shoes\
    \ has the name of the shoes and the price of the shoes in hidden fields:\n\n```\n\
    <input type=\"name\" price=\"NewShoes\">\n<input type=\"hidden\" price=\"149.00\"\
    >\n```\n\nA cracker (or someone who wants a deal on a new pair of shoes, and don’t\
    \ we all?) could post the price as:\n\n```\n$req = POST 'http://www.example.com/cgi-bin/checkout.cgi',\n\
    \  [ price => '0.00', name => 'NewShoes' ];\n```\n\nThat is a good price!^8\n\n\
    > A similar scam has been worked on PayPal even though this kind of exploit is\
    \ extremely well known."
  merge: -1
  pgno: 255
- img_proc: true
  md: '# CHAPTER 7 The Common Gateway Interface 221


    One of the most common exploits in practice today, and not just of CGI scripts,
    buffer overflows. If you write a CGI program that expects a name, you might write
    that name to a database (see Chapter 5). If someone were to send you 50MB of data
    for a name, putting that data in the database would use excessive amounts of disk
    space or worse. A number of exploits of many different programs have relied on
    buffer overflows to start their nastiness. Programmers of every stripe must learn
    to check input data for reasonable lengths in every application—don''t be lazy.
    Do it not just in this application, but everywhere in this book where you accept
    data from the outside world.


    # 7.9.5 Don''t Trust Filenames


    The issue is magnified many times when it comes to filenames. Never trust data
    you receive if you are using data to open files. A classic example is that of
    “magic opens”—for example, a remote mail reader that does not open MAIL, "/var/mail/$USERNAME".
    This sort of thing has caused many exploits because of applications opening attachments,
    as you probably know.


    # 7.9.6 Don''t Trust Referer Headers


    The referer information is sent in through the header. The header can be constructed
    to be whatever the evil person wants, don''t trust it. Referer information is
    useful when you want to know from whence a user is coming, but don''t put too
    much trust into it.


    # 7.9.7 Don''t Trust Cookies or JavaScript Preprocessing


    Cookies are small tokens of information that reside on the client computer and
    send information back to the server. Examples are the cookie that remembers your
    password for the New York Times and the cookie that tells Amazon who you are so
    that you can get back to the half-finished order you started yesterday—very convenient,
    but also powerful and insecure.


    Because they are sent in the header, they can be constructed to be whatever a
    less than honorable person wants. Don''t trust them completely. On the server
    side, always double-check cookie information.'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'JavaScript preprocessing of data is nice, but don''t assume it has taken place.
    Always check your data.


    > Be Paranoid. That says all. If you are going to put your server out in the big
    bad world and accept bits from the maddening crowds, don''t blindly accept what
    they send you. Be cautious, paranoid, and expect to not think of everything. Check
    your logs. Watch the skies!


    # 7.10 A NOTE ABOUT die()


    In Chapter 4, we learned that things go disastrously wrong in a Perl program,
    the situation should be dealt with by terminating the program with the die() function.
    This function prints a message to the standard error output, cleans up nicely,
    and exits the program with a nonzero exit status.


    In CGI programs, if the die() function is executed, we may think that the string
    passed to it is sent up in the browser. However, standard error output is not
    sent to the client that requested the CGI program; instead, it is written to the
    error log file (here, `/var/www/logs/error_log`). For instance, if the CGI program
    test.cgi contains this line:


    ```

    open FH, `/var/www/data/mydata.dat` or die "File not opened: $\$"

    ```


    Let''s say the file `/var/www/data/mydata.dat` doesn''t exist. When the client
    tries to open it, the open() fails, causing the die() function to be executed.
    The die() generates text that resembles the following:


    ```

    File not opened: No such file or directory at `/var/www/cgi-bin/test.cgi`nline
    10.

    ```


    At first glance, one would think that this output would be sent to the client,
    informing it of our problem. However, this is not true. A quick check of the log
    file would show that output was sent there.


    So if you want to handle error conditions cleanly with CGI programs, don''t use
    die() to do it. Instead, consider rolling your own error handler, as we do in
    the following project.'
  merge: -1
  pgno: 257
- img_proc: true
