  md: "# CHAPTER 11 Mason (HTML::Mason) 373\n\n```\n<%cleanup>\n$dbh->disconnect();\n\
    </%cleanup>\n```\n\nThis is equivalent to having a <%perl> ...</perl> tag at the\
    \ end of the file.\n\n# The <%shared> Tag\n\nThe <%shared> ...</shared> tag is\
    \ similar to <%once> in all variables declared within it can be seen in the entire\
    \ component, but <%shared>, unlike <%once>, is executed for each request.\n\n\
    # 11.9.2 Session Handling\n\nThe hash session is a global variable that can contain\
    \ the session information for the current user. If you assign a value to %session,\
    \ a session is created for this user (the Apache::Session module must be installed\
    \ for this work).\n\nA session ID is a commonly used value placed in the %session\
    \ hash and accessed on the user's next visit. You can ensure that the user has\
    \ a session ID with code like this:\n\n```\nunless ($session{session_id}) {\n\
    \  $session{session_id} = generate_new_session_id();\n}\n```\n\n# 11.9.3 Request\
    \ API\n\nMason provides an extensive API for the Mason Request object. This API\
    \ allows you to access and change cache information, examine the component call\
    \ stack, call components directly (for example, $m->comp()), use the long version\
    \ of the &...&, and much more. For details, www.masonhq.com/docs/manual/Request.html.\n\
    \n# 11.9.4 Component Class API\n\nMason provides methods to examine and report\
    \ on the components that are used in the generation of the web page. See www.masonhq.com/docs/manual/Component.html\
    \ for details."
