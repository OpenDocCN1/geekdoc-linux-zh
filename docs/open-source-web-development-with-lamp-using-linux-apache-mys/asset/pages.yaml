  md: '# Introduction


    # xxix


    You can make changes and submit them for others to look at. You can design a widget
    to emulate a feature or a program that you liked on a different system, or to
    do something entirely new because you, using the available Open Source software,
    can look at the code that drives Linux™, or Apache™, or the Gimp™, or OpenOffice™,
    or Mozilla™,. You can write code to use it, to improve it, to hook it to, and/or
    to make it do almost anything else. Then changes can be shared with others as
    they did with you; with Open Source it''s not only OK to copy, to improve, to
    use, and to return the source code to the community of users, and it is expected.


    You may never do this; you may use Linux and Apache and Perl and never look a
    line of code, never change a default in a configuration file. But, could if you
    wanted—you don''t have to live with someone else is decided.


    The philosophy of Open Source software, among other things, is that many hands
    and eyes make for good software, unlike too many spoil the broth. Bugs are more
    likely to be caught, and more important, fixed, if everyone has access to the
    source. In cryptography, closed systems cannot be proved to be free of flaws or
    errors. While it''s no guarantee that no bugs exist, open systems can be examined
    for flaws;(security through obscurity). It''s the unknown unknowns that can bite
    you.⁴


    As anyone''s ever participated in design or code review knows, only by getting
    other people to look at your system or code you have any hope of finding the bugs—everyone
    has blind spots. The more eyes that look at the source, the better. With Open
    Source, it''s not just a few people in a suburb east of Seattle who eyeball the
    code, but hundreds if not thousands of people all over the world. When, not if,
    a bug is discovered, anyone can fix it without depending on a software company
    to do cost analysis of whether to issue a new service pack or to include the update
    in the next dot revision and charge $99.95 for it.


    Another tenant of the Open Source philosophy is giving back to the community.
    Most Open Source software falls under some form of a license. The various Open
    Source licenses are listed at www.opensource.org. Among


    > ⁴Unknown unknowns are the problems that you don''t know about. When you start
    something new, know that some things are going to be a problem and can anticipate
    other things that could be a problem. But then there are the "unknown unknowns”—the
    problems you aren''t even aware until they jump up and bite you, with customers
    standing in the room during a demo. One of the best engineers we ever knew, Duane
    Sanner, called them "unk-unks.".'
