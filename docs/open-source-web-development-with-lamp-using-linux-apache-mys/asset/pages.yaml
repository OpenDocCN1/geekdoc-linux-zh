  md: '# CHAPTER 12 PHP


    # 12.5.2 Data Types


    Primitive Data Types

    PHP has three primitive data types: integers, floats, and strings.


    +   - Integers: long ints (32 bits)

    - Decimal: 10

    - Hexadecimal: 0x2A

    - Octal: 025


    ```

    <?

    // these all represent the same value

    $myint = 69; // decimal

    $myint = 0x45; // hexadecimal

    $myint = 0105; // octal

    ?>

    ```


    +   - Standard: 4.745

    - Scientific: 12.3E-4


    ```

    <?

    // these both represent the same value

    $myfloat = 169.345;

    $myfloat = 1.69345e2;

    ?>

    ```


    +   - Strings (like Perl):

    - Single quotes:


    ```

    <?

    $os = ''Linux'';

    echo "Favorite OS\tsos\tos\n";n// outputs: Favorite OS\tos\tos

    ?>

    ```


    +   - Double quotes:


    ```

    <?

    $os = "Linux";

    echo "Favorite OS\tsos\n";n// outputs: Favorite OS<tab>Linux<ret>

    ?>

    ```


    +   - Escape characters:


    ```

    \n newline

    \t tab

    \r carriage return

    \\slash

    $\ dollar sign

    ```'
