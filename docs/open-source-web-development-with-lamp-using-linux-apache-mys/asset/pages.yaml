  md: "# 396\n\n# PART IV Embedded\n\n```\n<?\n$array = array(2, 4, 6, 8);\nforeach\
    \ ($array as $value) {\n    echo \"$value\";\n}\n// // echoes \"2 4 6 8\"\n?>\n\
    ```\n\nHere, $value takes on each value of the array $array, and the body is executed\
    \ for each of those values. The variable $value is first 2, then 4, then 6, and\
    \ finally 8.\nThe second foreach method returns both the key and the value, which\
    \ is used to iterate through associative arrays. It has this syntax:\n\n```\n\
    foreach (array.expr as key => value) {\n    statements\n}\n```\n\nor:\n\n```\n\
    foreach (array.expr as key => value) :\n    statements\nendforeach;\n```\n\nUnlike\
    \ in Perl, key/value arrays are not stored in an apparent random order (based\
    \ on how the keys hash). They are stored in the order created. This version of\
    \ foreach loops through array.expr, assigning the next key/value pair to key,\
    \ value. Here is an example:\n\n```\n<?\n$array = array(\n    \"name\" => \"John\
    \ Doe\",n    \"age\" => 39,\n    \"phone\" => \"555-1234\"\n);\nforeach ($array\
    \ as $k => $sv) {\n    echo \"\\$k: \\t\\sv \\n\";\n}\n// // echoes:\n// // name:\
    \ John Doe\n// // age: 39\n// // phone: 555-1234\n?>\n```"
