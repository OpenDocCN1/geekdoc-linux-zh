    | Permissions | Owner | Group | Size | Date | Time | Name |

    | --- | --- | --- | --- | --- | --- | --- |

    | -rw-rw-r-- | 1 | | | jrl | 27 | Jan 8 | 13:11 | junk.txt |

    | -rw-r------ | 1 | | | staff | 1160 | Jan 10 | 15:31 | foo.html |

    | -rwxrxr-x | 1 | | | staff | 1160 | Jan 9 | 09:31 | bar.cgi |

    | drwxrwxr-x | 9 | jrl | jrl | 4096 | Jan 8 | 15:42 | bin/ |


    The ownership of a file can be changed using the chown command, and the permissions
    changed by chmod. A typical thing to do would be chmod a+x bar.cgi, which would
    change the permissions to allow all to execute it. Similarly, one could change
    the permissions via chmod go-r junk.txt to allow only the owner to read the file.

    Old-School Unix types like to use the octal numeric mode to change file permissions,
    thus leading to such commands as chmod 666 foo.bar. The value 666 is an octal
    number representing the three permission groups: user/group/world. If the value
    of one of the groups is 6, the permissions are “read on, write on, execute off,”
    represented as rw-rw--. Therefore, 666 represents rw-rw-. The value 751 would
    be rwxr-x--. Other file attributes, such as the sticky bit, can be changed with
    these commands; use man chmod to see all the possibilities.


    # 2.2.3 Processes


    Every object in Unix is a file; everything that runs in the background is a daemon.
    Each process runs once and quit; each process has an owner and a process ID (PID).
    The owner is important because that’s who controls the process—J. Random User
    can’t kill processes because root can kill JRL’s processes. There are also subtle
    issues with process ownership—processes that run under root are vulnerable to
    being cracked and allowing the cracker to gain root access (which is very bad).'
