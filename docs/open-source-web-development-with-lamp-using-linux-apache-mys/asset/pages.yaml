    # Increment and Decrement


    Perl has the following autoincrement and autodecrement operators:


    +   ++ autoincrement

    -- autodecrement


    These operators provide a simple way to add 1 to a variable (++) or subtract 1
    from a variable (--). The location of the operator is important. If placed on
    the left side of the variable, it increments before the variable is used (preincrement);
    on the right side, it increments after the variable is used (postincrement). For
    example:


    ```

    #! /usr/bin/perl -w

    # file: increment.pl

    ```


    use strict;


    ```

    my $si = 10;

    my $sj = ++$si;

    print "\$si = $si, \$sj\n";

    ```


    ```

    $si = 10;

    $sj = ++$si;

    print "\$si = $si, \$sj\n";

    ```


    Executing that code gives:


    ```

    $ ./increment.pl

    $si = 11, $sj = 11

    $si = 11, $sj = 10

    ```


    To illustrate pre- and postincrements, consider the statement:


    $sj = ++$si;


    $sj is assigned the result of ++$si. This preincrement (since the ++ is on the
    left side of $si) causes the variable $si to be incremented first to 11; then
    the value of $si is assigned to $sj. The result is that both $si and $sj have
    the value 11.'
