    # 10.8.2 Creating a Consistent Look and Feel


    Before we get into the nitty-gritty of the project, let''s talk in general some
    options we can use to create a web site with a consistent look and feel (such
    as www.opensourcewebbooking.com/).


    There are several ways to create such a web site with a consistent look and feel
    to all the web pages.


    +   1. Hard-code all the HTML pages—bad idea; it''s static and hard to maintain.'
