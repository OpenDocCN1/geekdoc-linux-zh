- img_proc: true
  md: '# 11.9.5 Top-Level Components


    Mason has a feature that enables a web page to be created even though the requested
    page, or even the directory, does not exist. In other words, let''s say the user
    requests www.example.com/reports/2002/March/. Under normal conditions, Apache
    would serve the file index.html under the directory reports/2002/March/. However,
    in this example, the directory 2002 doesn''t exist. Moreover, neither does Mason.
    So, what happens?


    Mason, properly configured, searches for the index.html and if it is not found,
    it then begins for dhandlers, or default handlers, in the desired directory and
    up the directory tree. For instance, with the preceding directory Mason looks
    for, in order, the following:


    ```

    /reports/2002/March/index.html

    /reports/2002/dhandler

    /reports/dhandler

    /dhandler

    ```


    The first file found is the one used. Let''s say that the files /reports/2002/March/index.html
    and /reports/2002/dhandler are not found, and the first file found is /reports/dhandler.
    That file is used to generate the HTML. Its contents could be this:


    ```

    <_ _header %>

    <h1>Report for %$month %, %$year %></h1>

    <% $report_contents %>

    <_ _footer %>

    ```


    ```

    <init>

    # get the path, or the stuff asked for

    my arg = $m->handler_arg;

    # split on the /, getting the year and the month

    my($year,$month) = split("/",arg); # split out pieces


    # do whatever is necessary to get the report content,

    # perhaps reading from a database, assign it to $report_contents

    my $report_contents = ''All the good content of the report'';

    </init>

    ```


    The <init> section, the first code executed, grabs the contents of the path below
    /reports/—in this case, 2002/March. This text is stored in $arg, which is then
    split on the slash and stored in $month. Then, by some means (perhaps a database
    is queried or a text file is), the contents of the March 2002 report are read
    and stored in $report_contents.'
  merge: -1
  pgno: 409
- img_proc: true
  md: '# CHAPTER 11 Mason (HTML ::Mason) 375


    Then, at the top of the file, we call the _header component to build

    the header; then we create an <h1> tag with the month and year in ques-

    The contents of the report are included with <% $report_contents %,

    followed by the _footer component.

    As this example shows, depending on the report contents read, we can

    have the same default handler take care of all the following URLs and

    then some:


    ```

    http://www.example.com/reports/2002/March/

    http://www.example.com/reports/2002/February/

    http://www.example.com/reports/2002/January/

    http://www.example.com/reports/2001/December/

    http://www.example.com/reports/2001/November/

    ```


    For more information on default handlers, see the Mason documents at

    .masonhq.com/docs/manual/Bevel.html/top_level1_components.


    # 11.10 SUMMARY


    Mason is similar to Embperl—it enables executable code to be placed into

    HTML pages to transform static web pages into live ones. Most things that

    can be done with Embperl can be done with Mason, and vice versa. Why

    have both? TMTOWTDI, of course! All this may not be necessary if you

    are just building your own web site. You can just pick one of these, stick

