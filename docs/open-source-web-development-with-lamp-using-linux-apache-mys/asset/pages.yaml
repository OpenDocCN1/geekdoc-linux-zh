    # 2.2.1 Shell


    You have many choices for your shell interface. This is a Good Thing, because
    we all have different preferences. Many, if not most, people go with bash as their
    shell interpreter (largely because bash is the default shell when Red Hat is installed).
    Others prefer tsh, a variation on the original csh. There are also zsh and ksh.
    You can pick and choose. If you are new to this, go with the default on your system
    until you know enough to have a preference.


    You can change the shell with the chsh command, which asks for a password.


    # 2.2.2 Owner, Groups, Permissions, Ownership


    Everything in Unix is a file, and each of the files has associated with an owner
    and a group. If you do an -l in a directory, you might see something like Table
    2.2, though it won''t have column titles like those shown here.


    The long listing shows that J. Random Luser (jrl) owns three files (junk.txt,
    foo.html, and bar.cgi) and one directory (bin) in this directory. The permissions
    of junk.txt are such that the owner of the file (jrl) and the group associated
    with the file (jrl) can read and write the file, and the rest of the world can
    read it. The file foo.html is a bit more private, and only jrl can alter it, though
    staff members may view its contents. cannot see it at all. The file bar.cgi appears
    to be an executable, and J. Random Luser can change it, staff can view it, and
    both staff and can execute it.'
