  md: '# CHAPTER 5 MySQL


    # 5.2.1 The SHOW DATABASES and CREATE DATABASE Commands


    First, we need to create the new database. Check the current databases to make
    sure a database of that name doesn''t already exist; then create the new one,
    and verify the existence of the new database:


    ```

    mysql> SHOW DATABASES;

    +----------+

    | Database |

    +----------+

    | mysql    |

    | test    |

    +----------+

    2 rows in set (0.00 sec)

    ```


    ```

    mysql> CREATE DATABASE people;

    Query OK, 1 row affected (0.00 sec)

    ```


    ```

    mysql> SHOW DATABASES;

    +----------+

    | Database |

    +----------+

    | mysql    |

    | people  |

    | test    |

    +----------+

    3 rows in set (0.00 sec)

    ```


    SQL commands and subcommands (in the previous example, CREATE is a command; DATABASE
    is its subcommand) are case-insensitive. The name of the database (and table and
    field) are case sensitive. It''s a matter of style whether one uses uppercase
    or lowercase, but traditionally the SQL commands are distinguished by uppercase.


    One way to think of a database is a container for related tables. A table is a
    collection of rows, each row holding data for one record, each record containing
    chunks of information called fields.


    # 5.2.2 The Use Command


    Before anything can be done with the newly created database, MySQL has to connect
    to it. That''s done with the USE command:


    ```

    mysql> USE people;

    ```'
