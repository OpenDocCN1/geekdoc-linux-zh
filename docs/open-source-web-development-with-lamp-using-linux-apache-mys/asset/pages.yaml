    %ENV and path_info(). Place this code in the file /var/www/cgi-bin/path.info.cgi:


    ```

    # /usr/bin/perl

    # path_info.cgi


    use strict;

    use CGI : '':standard'';


    # get the path from %ENV, then from the

    ```'
