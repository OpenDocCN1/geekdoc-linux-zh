  md: 'In the preceding example, the first two IP addresses are special local networks.
    Although most IP addresses are assigned by ICANN and distributed by DNS, the 192.168
    and 10.0 IP subnets are not unique and are used for internal networks behind a
    firewall. The third IP address, 127.0.0.1, is a special IP address, that of localhost.
    Everyone''s computer assigns this IP to itself, in addition to any external IP
    address. If you point your web browser to localhost or 127.0.0.1, it will serve
    the default page of the local Apache host. Your localhost is not the same as the
    fellow- in the next cubicle, though.


    You can combine passwords and IP verification for additional security.


