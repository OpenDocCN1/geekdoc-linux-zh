    # 11.8 MASON PROJECT


    In the Embperl chapter, we did a project that displayed a list of products and
    filtered that list based on the manufacturer''s city, name, or product type. We
    will now develop a Mason back end that enables the addition and modification of
    manufacturers and their products.


    This back end will consist of three pages: one to allow the user to select an
    action (add a manufacturer, modify a manufacturer, add a product, or modify a
    product), one to allow the user to enter the data for either a manufacturer or
    a product, and one that thanks the user for the addition or modification and allows
    them to select another action.


    Before we show each of the three pages, we need to discuss the components involved
    in creating our familiar look and feel.

    The first component generates the top HTML for our pages and is named, believe
    it or not, _top. Its contents can be found in the file /var/www/mason/productbackend/_top
    online at http://localhost/mason/productbackend/_top or www.opensourcecookbook.com/mason/productbackend/.
    The filename in URLs is top_top. We copied into top so that the webserver would
    serve it, allowing you to view its contents as examples. Remember, Apache is configured
    to not serve up files in this part of the document tree whose names begin with
    the underscore.'
