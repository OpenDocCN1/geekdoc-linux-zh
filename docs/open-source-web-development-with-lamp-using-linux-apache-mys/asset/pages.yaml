    # 10.5 EMBPERL COMMANDS


    As we saw earlier, Embperl commands start with a “[" and end with a \]". Because
    “[" has a special meaning, to put a “[" on your web page, you must write it as
    "[[[]]".


    # 10.5.1 [+ Perl Code + ]


    The code within [+ ... +] is executed, and the result is that the command is replaced
    with what the code evaluates to. Thus [+"hello! +] is the same as print "hello!"
    in a normal CGI program. For example:


    ```

    <p>Hello [$name +]</p>

    ```


    If the value of $name is "Gerald Richter", the result of the previous command
    after Embperl is processing it through this:


    ```

    <p>Hello Gerald Richter</p>

    ```


    A command can contain any Perl expression, including array elements, hash elements,
    and function calls:


    +   + $i+1 +

    + Sa[$i] +

    + $sinfo{name} +

    + generate_link() +'
