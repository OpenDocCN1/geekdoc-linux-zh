- img_proc: true
  md: '# CHAPTER 10 Embperl (HTML :: Embperl)


    Now make, test, and install:


    ```

    $ make

    $ make test

    $ su

    # make install

    ```


    That''s it, assuming no errors—Embperl is installed. Make sure by checking the
    online documentation:


    ```

    $ perldoc HTML::Embperl man

    ```


    You should see the HTML::Embperl page.


    # 10.3 APACHE CONFIGURATION


    Apache needs to be reconfigured to use Embperl to process HTML files. This requires
    a decision about how to use this module: whether to process every file with Embperl
    or to tag Embperl files with a special extension (.ep1 is commonly used) so that
    only those files are processed.


    Processing only the files with the different filename extension is more efficient.
    The drawbacks are that the extension gives information about the server, and URLs
    aren''t uniform, which presents a human factors issue—people remember .html and
    don''t remember .ep1.


    There is another good reason not to use special filenames. Suppose you have a
    page that has no Embperl and is linked everywhere in your site. If you decide
    that page needs Embperl, it must be renamed, and all references to that file changed
    everywhere on your site. If that page is linked externally, it will be wrong on
    all the search engines.


    If you do decide to create a special filename extension such as .ep1, add this
    to Apache''s configuration:


    ```

    <Files *.ep1>

    SetHandler perl-script

    PerlHandler HTML::Embperl

    Options ExecCGI

    </Files>

    ```


    ```

    AddType text/html .ep1

    ```


    We choose not to use a special extension. Instead, we''ll limit the use of Embperl
    to a certain directory within the web document tree for only HTML files (files
    ending in .html).'
  merge: -1
