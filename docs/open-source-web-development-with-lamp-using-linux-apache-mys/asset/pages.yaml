    # 1.2.3 It''s Not Just for Linux


    Although the focus here is on Linux and how LAMP programs interact with Linux,
    much of this is directly applicable to many operating systems, especially Unix
    variants (+nix). For the most part, the configurations are independent of the
    platform, and this software runs on many platforms. If you run Solaris on Sun,
    or YDL on PPC, or OS X on a Mac, or any version of BSD, of the things we talk
    about are generally applicable to your system. The information here should be
    useful not only to the Linux user but also to +nix users. In fact, this book was
    written on Apple PowerBook G4 laptops using BSD-based OS X, an Apple G4 running
    LinuxPPC, and several different x86 running Red Hat 7.


    This book was written entirely with Open Source software: emacs, vi, LaTeX, CVS,
    Ghostview, cvvi, ps2pdf, xpdf, and dipdf on Linux and OS X. Frankly we couldn''t
    imagine writing something of this length and complexity in Word. Shudder!


