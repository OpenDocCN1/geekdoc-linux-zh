    # 12.5 LANGUAGE SYNTAX


    Like the other languages we''ve studied (and most easy-to-use languages), PHP
    is whitespace-insensitive. Therefore, this statement:


    ```

    <$title="PHP is cool";echo <title> $title</title>; ?>

