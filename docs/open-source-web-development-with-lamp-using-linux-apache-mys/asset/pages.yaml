    # 6.6 DIVERSION


    In the process of making the HTML files, WML implements a text diversion filter.
    That bit of jargon means that a section of text can be created in one place in
    a, or in a completely separate file, and then included'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# CHAPTER 6 Website META Language


    somewhere else within the HTML. This is most helpful with templates, because a
    template is an HTML file that usually defines the outer HTML (the top, sides,
    and bottom), and the inner HTML (the page contents) is in a separate file.


    This is one syntax to create a diversion:


    ```

    ..DVERSION>>This is the diversion text..

    ```


    The marker ..DVERSION>> begins the text. The name DVERSION is all up-ercase by
    convention. The diversion does not have to be named DVERSION; it can be named
    anything you want the name begins with an alpha is followed by zero or more alphas,
    digits, or underscores, upper- lowercase. The text in the diversion continues
    until the end-of-diversion marker <<. is found.


    To use the diversion later (or even before its definition) use this:


    ```

    <<DVERSION>>

    ```


    This causes the text in the definition to be included at this point.


    An example can be found in /var/www/html/wml/diversion.wml.


    ```

    ..NAME>>John Doe..

    Hello <<NAME>>!

    <br>

    Here is my message: <<MSG>>

    ..MSG>>

    WML is cool!

    ..

    ```


    > The example starts with a diversion definition for NAME, "John Doe." The next
    line uses the diversion <<NAME>> in the text:


    Hello <<NAME>>!


    This line becomes this, after WML is finished processing.


    Hello John Doe!


    The definition of NAME comes before its use. That’s fine. The next line, however,
    uses a diversion not defined:


    Here is my message: <<MSG>>'
