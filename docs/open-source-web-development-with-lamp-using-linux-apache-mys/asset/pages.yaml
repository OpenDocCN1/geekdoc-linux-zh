    First, the use DBI method tells Perl to use the DBI module. This allows us to
    use all the methods in this class.

    Calling the connect() method causes the Perl script to connect to the MySQL database
    using the Perl DBI class. The first argument to this method is the database to
    which you want to connect. In this example, the string DBI:mysql:people indicates
    that it should connect with the DBI module to the database people, which is housed
