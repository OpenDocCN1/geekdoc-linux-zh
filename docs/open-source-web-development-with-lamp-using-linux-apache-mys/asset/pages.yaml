    # 3.3 CONFIGURATION


    Apache was designed to be modular, so you can run as lean, or bloated, a webserver
    as you like. We discuss the basic configuration and some minor tweaks; all the
    directives are described at http://apache.org/docs/mod/directives.html, but during
    your Linux installation, the documents were placed in /var/www/manual/mod/directives.html.
    You can reach them via the link on the default web page (for the time being, anyway,
    because we will be moving these documents later): http://localhost/manual/mod/directives.html.


    # 3.3.1 Modifying the Default Configuration


    Apache''s configuration file is /etc/httpd/conf/httpd.conf. We''ll start with
    the default configuration file from Apache version 1.3.24. There are many comments
    in httpd.conf; read them! This is a great way to get a feel for how the Apache
    configuration file works. Most of it''ll leave unchanged, but the comments will
    familiarize you with the available capabilities. First, change the following:


    ```

    ServerAdmin root@webserver.example.com

    ```


    to:


    ```

    ServerAdmin webmaster@example.com

    ```


    or whoever you want to get all the comments (and complaints) about your web site.
    You may want joe.user@example.com to be your e-mail address or, more preferably,
    a webmaster e-mail alias. It should be someone who


    > Configuration files evolve over time, so don''t worry too much if this stuff
    isn''t exactly the same—it won''t be. By the way, as of this writing, 1.3.24 is
    the latest Red Hat version, but 1.3.27 had already been released, and version
    2.0 is in beta.'
