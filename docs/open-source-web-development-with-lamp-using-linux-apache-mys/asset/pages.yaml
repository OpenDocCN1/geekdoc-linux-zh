  md: 'Open Source technologies are providing contemporary developers with a range
    of cost-effective and robust software for building dynamic, data-driven Web applications.
    This guide presents a comprehensive survey of LAMP (Linux, MySQL, Perl, and PHP)
    and shows how these solutions can be implemented efficiently and securely while
    improving reliability and dramatically cutting costs.


    # Open Source Web Development with LAMP focuses on the most important material
    necessary so that developers can "hit the ground running" right away. This book
    presents a balanced overview of LAMP technologies and allows the reader to decide
    which tool may be appropriate for the particular task at hand. After a general
    overview of Open Source technologies, the book presents an overview of Web before
    moving on to cover structural, state, dynamic, and embedded technologies. The
    coverage provides a description of the strengths and weaknesses of each Source
    technology and also acts as a reference guide for each application.


    +   * Web site META Language (WML)

    * Common gateway interface (CGI) and mod_perl

    * Server Side Includes (SSI). Emperl, and Mason

    * PHP syntax and functions


    In addition to the discussions in the book, a companion Web site—opensourcewebbook.com—contains
    supplemental information, including tools, source code, help links to additional
    resources, and errata as needed.


    Complete and practical in presentation, Open Source Web Development with LAMP
    utilizes the tools and technologies today''s developers need to create workable,
    dynamic, and secure Web sites using Open Source technologies.


    +   * A comprehensive survey of Open Source technologies

    * Static and dynamic data and embedded HTML on the Web

    * Linux and Unix distributions, installations, and commands

    * Apache Web Server, Perl, and MySQL


    James Lee is founder and CEO of Onsight Inc., an Open Source training and development
    company. He has developed a number of Web sites using Linux, Apache, MySQL, mod_perl,
    Emperl, and related technologies. A contributor to Linux Journal. He is the co-author
    of Hacking Linux Exposed (McGraw-Hill/Osborne, 2001).


    Brent Ware holds a Ph.D. in physics and an M.S. in chemical engineering and is
    currently a student at NASA/Caltech''s Propulsion Labs in Pasadena, California.
    He has been a system administrator of Linux, Unix, and Mac OS X systems and also
    contributed to Hacking Linux


    http://www.awprofessional.com

