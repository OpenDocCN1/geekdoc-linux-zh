  md: '# 6.7 A BETTER TEMPLATE


    In order to have a header and footer HTML in the previous examples, we used two
    separate files. It is preferable to maintain one template file—it''s simpler and
    easier to maintain, and there are fewer opportunities to induce bugs. Both the
    header and footer HTML can be folded into one file with the following syntax:


    ```

    # put all the HTML for the top of the page here

    <<PAGE_BODY>>


    # put all the HTML for the bottom of the page here

    ..PAGE_BODY>>


    # the syntax above means to take all the next stuff and stuff

    # into the <<PAGE_BODY>> section

    ```


    The diversion PAGE_BODY (again, the name PAGE_BODY is arbitrary; it could have
    been named just about anything) is included between the HTML for the top of the
    page and the HTML for the bottom of the page. Then, the last noncomment line of
    the file is ..PAGE_BODY>>, which means everything that follows is the definition
    of the PAGE_BODY diversion that is to be included above.


    What follows? In this file, nothing, nothing, but this file will be used by another
    WML file, so the contents of that file are what follows. This is possible because
    that file, the one that uses this file, has an implicit <<.. terminating PAGE_BODY
    definition.


    Here is a real, albeit simple, example. This template file is stored in /var/www/html/wml/template1.wml:


    ```

    #

    # define the head of the template

    #

    <html>

    <head>

    <title>Our Template</title>

    </head>

    <body bgcolor="#ffffff">

    <h1>Welcome to www.opensourcewebbook.com!</h1>


    # here we end the code, and add the body with

    # <<PAGE_BODY>>, then start the footer

    #

    ```'
  merge: -1
  pgno: 200
