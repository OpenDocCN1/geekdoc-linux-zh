  md: '# 58


    # PART I Structural


    its portability; if created properly, Perl scripts will run on many operating
    systems with only minor changes, if any.


    The name Perl is an uncapitalized acronym for Practical Extraction and Report
    Language, or Pathologically Eclectic Rubbish—TMTOWTDI.


    As it evolved, Perl grew (some would say mutated) from a text processing language
    into a powerful, multipurpose object-oriented programming language used to solve
    all kinds of real-world problems: system administration, network programming,
    database management, and CGI programming.


    Perl''s syntax is C-like.2 Its operators, constructs, and lexical conventions
    are similar to those of C. However, some of the language rules, especially regular
    expressions, can be a bit overwhelming at first. It''s common for eyes to cross
    a bit when looking at one of the ubiquitous punctuation marks representing a regular
    expression: /^(?:To):\s(\S*$/—not comic strip elephants, the coin of the Perl
    realm. However, by concentrating on the basic rules, you can quickly learn to
    use the language to solve real problems—this is the beauty of the language. Of
    course, then you are suckered in and become yet another Perl acolyte.


    We give only a basic overview here; the Camel Book [Wall+00] is the bible for
    Perl. Perl is the big, top-of-the-line Swiss Army knife. We don''t talk about
    all the nifty gadgets, only the major functionality. We can''t teach you programming
    in this short chapter, so this is a high-level introduction. Again, we assume
    you know the basics of programming: variables, flow constructs (if statements,
    while loops), functions, reading from writing to files, and so on.


    # 4.2 PERL DOCUMENTATION


    A wealth of information is available for Perl both on your Linux machine and online.
    There are several pages:


    +   $ man perl


    +   $ man perlop


    +   $ man perls


    > 2Collectively, the trinity of C, C++, and Java are referred to as C-like languages.'
