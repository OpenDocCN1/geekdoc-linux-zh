  md: '# CHAPTER 12 PHP


    To add elements to the left side, use array_shift(). Use array_shift() to remove
    the leftmost element. Here is an example:


    ```

    <?php

    $languages = array("C", "C++", "Java");


    $lang1 = array_pop($languages);

    // $lang1 is: "Java"

    // $languages is now: ("C", "C++")


    array_push($languages, "Perl");

    // $languages is now: ("C", "C++", "Perl")


    $lang2 = array_shift($languages);

    // $lang2 is: "C"

    // $languages is now: ("C++", "Perl")


    array_shift($languages, "PHP", "Python");

    // $languages is now: ("PHP", "Python", "C++", "Perl")

    ?>

    ```


    # sort() and rsort()


    These functions sort an enumerated array in ASCII ascending order (sort()) and
    ASCII descending order (rsort())


    ```

    $names = array("Ryan", "Christian", "Madeline", "Reegan");

    sort($names);

    // $names is now: ("Christian", "Madeline", "Reegan", "Ryan")


    $numbers = array(10, 3, 49, 4, 1, 30, 22);

    rsort($numbers);

    // $numbers is now: (49, 30, 22, 10, 4, 3)

    ```


    As you can see, these functions sort numerically if the elements are numeric.
    You can force these functions to sort in a specific way using either SORT_REGULAR,
    SORT_NUMERIC, or SORT_STRING as the second argument:


    ```

    rsort($numbers, SORT_STRING);

    ```


