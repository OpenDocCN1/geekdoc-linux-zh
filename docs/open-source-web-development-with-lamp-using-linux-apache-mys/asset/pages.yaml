    # 3.1.1 Apache Explained


    Figure 3.1 depicts what happens when a user requests a web page from the Apache
    webserver.


    The webserver recognizes an HTTP request by the URL of the thing requested or
    by the filename extension. For instance, if the URL www.example.com/content/chapter1/
    were loaded into a browser, the webserver contacted (www.example.com) would receive
    a request that might look like this:4


    ```

    GET /content/chapter1 HTTP/1.0

    ```


    The server determines that the thing requested is underneath the document root,
    a directory where the HTML files resides. For the examples in this book, that
    is /var/www/html. The text /content/chapter1/ directs Apache to navigate to those
    directories underneath the document root and grab the HTML file named index.html
    (by default, the server looks for the file with this name, but this is configurable,
    as most things related to Apache).


    The result is that the server grabs the file /var/www/html/content/chapter1/index.html,
    which is a simple file. It takes the content


    > 4This example demonstrates the simpler HTTP protocol version 1.0. It is more
    likely that the version used will be 1.1, but 1.0 works, and because it is simpler,
    we use it here.'
