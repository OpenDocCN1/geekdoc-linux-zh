  md: '# Introduction


    It seems that now we''ve finally reached the era that has been promised for decades,
    since the advent of the mass-produced personal computer. Hardware is cheap and
    powerful. Bandwidth is available to almost everyone. Even our parents, in such
    disparate locales as rural Texas and suburban Los Angeles, have fast Internet
    connections using satellite and cable. Unless you''re a serious gamer, the cheapest
    home computer will serve most every forseeable purpose.¹ Moore''s Law has outrun
    feature creep, for now.


    At the time this book was being written, a barebones GigaHertz (GHz) x86 box could
    be found for roughly $200—at Walmart, no less. That stripped-down machine has
    almost certainly gotten cheaper and faster in the interval between your writing
    and your reading. Or you can dumpolive one out of the trash of some failed dotcom
    for free, or cage one out from a friend who just upgraded²


    If you''re willing to spend roughly the same amount for DSL or a cable modem (and
    soon enough, WiFi) for your TV bill, you or anyone, can have a constant Internet
    connection, send e-mail, and surf the Web. Hosting a website is bit more expensive
    and complicated, but not rocket science—you need a static Internet protocol (IP)
    address, a registered domain, and probably will have to give your Internet service
    provider (ISP) a bit more money. Cheap computing and reasonable bandwidth are
    available to almost everyone. It''s only knowledge, or lack thereof, that keeps
    one from setting up a website, home business, dotcom, or consulting firm. There''s
    really no reason for a “digital divide” to exist, at least in the United States;
    any home that can afford a television and cable can afford a computer and cable
    modem -


    > ¹Okay, we haven''t reached computer nirvana yet—computers are not easy to use
    as they ought to be. Too much of the Web is a tradeoff of personal versus ease
    of use. Our parents still have trouble installing their peripherals, and so do
    we, among others.


    > ²On the other hand, as some famous once said, the computer you want costs $3,000—always
    will.'
