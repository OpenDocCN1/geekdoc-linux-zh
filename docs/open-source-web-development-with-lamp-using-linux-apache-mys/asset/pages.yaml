  md: '# 236


    # PART III Dynamic


    Copy the CGI programs written in Chapter 7 into the new directory:


    # cp ../cgi-bin/ .


    Configure Apache to run these programs using mod.perl by adding this to the httpd.conf
    file:


    ```

    Alias /perl/ /var/www/perl/

    <Location /perl>

    SetHandler perl-script

    PerlHandler Apache::Registry

    PerlSendHeader On

    Options +ExecCGI

    </Location>

    ```


    Now if Apache sees a URI starting with /perl/, it will look for that file in /var/www/perl/.
    Then, with the <Location> directive, Apache knows that anything accessing in the
    /perl directory should be handled by the perl-script handler—in other words, executed
    by Perl built into Apache. Apache::Registry is set to be the module that handles
    requests for files in part of the document tree. Because this module is applied
    to this directory, each program within it is compiled as the body of a Perl subroutine
    and then executed. Each Apache child process compiles the program first time it
    is executed, caching it for later executions. If the file is changed on disk,
    it is recompiled for each child process that executes it, being cached again after
    the first compilation.


    The PerlSendHeader is set to On, which tells mod.perl to intercept anything that
    looks like a header and turn it into a formatted header line. The +ExecCGI option
    is used by Apache::Registry to make sure you really know what you are doing. It
    requires that all programs in the directory are executable—an added step you have
    to take to make sure this works.


    Load the changed Apache configuration file by restarting it:


    # /etc/init.d/httpd graceful


    Now it is time to try one of the CGI programs. Load one of these URLs into your
    browser: http://localhost/perl/hello.cgi or www.opensourcewebook/perl/hello.cgi.
    You should see Figure 8.3.


    Although Apache::Registry is magic when it comes to existing CGI programs, instantly
    converting them to mod.perl programs, existing scripts'
