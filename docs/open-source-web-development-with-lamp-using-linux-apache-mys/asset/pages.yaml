  md: '# mod_perl


    # 8.1 INTRODUCTION


    mod_perl is another, better way to create dynamic web pages. It is faster and
    far more flexible than CGI and has the advantage of being based on Perl. Thus
    it provides the dual benefit of building on the knowledge base you''ve gained
    by studying Perl, and taking advantage of the entire Perl base.


    mod_perl is a fully functional Perl interpreter embedded in the Apache webserver,
    making the Perl interpreter always available for CGI programs—there is no extra
    step to load Perl into memory. Also, mod_perl is smart enough to cache CGI programs
    in memory, so if a CGI program is run multiple times, it is compiled only once.
    The result is a considerable improvement in speed.


    Speed is not the only advantage of mod_perl. It also gives you increased power,
    flexibility, and the ability to customize Apache. Because Perl is built into Apache,
    Perl is available to the server at all times. So you can write Perl code that
    performs customized processing during any phase of Apache''s processing, from
    the request phase to the authentication phase to the logging phase (to just name
    a few).


    Another feature of mod_perl is that with the Apache ::Registry module, you can
    instantly turn your existing CGI programs into mod_perl programs. Your existing
    CGI programs will run considerably faster, with no rewriting.


    You can also write pure mod_perl programs (“pure”) meaning using the mod_perl
    API instead of the CGI.pm module). These programs generally run faster than CGI
    programs because they use the native mod_perl API instead of a module.'
