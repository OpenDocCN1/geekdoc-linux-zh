    ```


    And don''t download CGI scripts from the Web. Whether they are malicious

    or simply badly written, CGI scripts are an excellent way to get your system

    cracked. In Chapter 7, you''ll learn to write your own scripts and how to

    avoid common problems with them, so that even if you do use a script

    from someplace like the Comprehensive Perl Archive Network (CPAN)

    at www.cpan.org, you can vet it for security.


    # Reload the Configuration File


    Now that we are finished securing Apache, let''s reload the configuration

    file as follows:


    ```

    # /etc/init.d/httpd graceful

    ```'
