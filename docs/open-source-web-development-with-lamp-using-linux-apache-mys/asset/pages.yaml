  md: '# CHAPTER 4 Perl 105


    Most of the time, when we do OOP in Perl, we will use objects that others have
    defined. In Chapter 7, when we learn how to do CGI programming with Perl, we will
    use a module, or object class definition, named CGI.pm. We will use this module
    with a pragma named (believe it or not) use, as in:


    use CGI;


    A Perl pragma is a message to the compiler to behave in a way that is not the
    default—in the use pragma, we are telling the compiler to use a specific Perl
    module that it does not normally include, telling Perl to locate the module file
    CGI.pm and do some OOP magic, making all the methods, or object functions, available
    to us. For instance, in the CGI module, a method named header() is defined, and
    because we told Perl we want to use the CGI module, we can call this method.


    Once we have used a module, we can then usually create an object of that type
    by executing new, which is a method that is defined to construct the object:


    ```

    $obj = new CGI;

    ```


    Once an object is created, methods can be invoked by using the arrow notation:


    ```

    $obj->header();

    $obj->pre();

    $obj->b();

    ```


    This syntax means execute the header() (or pre() or b()) method using the object
    named $obj, which is an object of class CGI.


    Hundreds of modules are available for Perl. You can find them all for free at
