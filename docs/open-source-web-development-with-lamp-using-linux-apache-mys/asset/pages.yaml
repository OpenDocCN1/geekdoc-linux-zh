- img_proc: true
  md: '286


    PART IV Embedded


    # 9.2 SECURITY CONSIDERATIONS


    SSI directives are as secure as you are. Don''t execute any commands that might
    do bad things or provide too much information. We suggest that directives like
    this not be included:


    ```

    <!--exec cmd="/bin/cat /etc/passwd"-->

    ```


    On the other hand, SSI doesn''t let the client do anything not specifically allowed
    by the server, so it''s relatively harmless. But don''t do anything stupid, anyway.


    # 9.3 SUMMARY


    SSI is a simple way to embed executable code within HTML. There are other ways
    (Ember, Mason, and PHP), which trade the simplicity of this method for power,
    speed, and flexibility at the price of complexity. SSI is commonly found in the
    wild, so this chapter should also help you understand the syntax if you see it
    in someone else''s web page.


    # 9.4 RESOURCES


    Books


    +   [Hofstadter 99] Hofstadter, Douglas R. Gödel, Escher, Bach: An Eternal Golden
    Braid, Twentieth Anniversary Edition.

    [Stein 97] Stein, Lincoln D. How to Set Up and Maintain a Web Site, Second Edition.
    One of the best books written about creating and maintaining a web site.


    Web Sites


    The official Apache SSI page: http://apache.org/docs/howto/ssi.html

    An extensive tutorial from Bignosebird.com: www.bignosebird.com/ssi.shtml

    A tutorial from the folks at NCSA: hohoo.ncsa.uiuc.edu/docs/tutorials/includes.html'
