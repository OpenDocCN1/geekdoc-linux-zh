  md: '# 94 PART I Structural


    The exclamation point (!) appeared on the next line after the name.

    That is because <STDIN> reads up to and including the newline character,

    $name contains the text "J. Random User\n." To remove the newline character, chomp($it):


    ```

    $name = <STDIN>;nchomp($name);

    ```


    Or:


    ```

    chomp($name = <STDIN>);

    ```


    For example:


    ```

    # /usr/bin/perl -w

    # file: stdin2.pl


    use strict;


    my $name;


    print "Enter your name: ";

    chomp($name = <STDIN>);

    nprint "Hello $name!\n";

    ```


    Executing that code produces:


    ```

    $ ./stdin2.pl

    Enter your name: J. Random User

    Hello J. Random Luser!

    ```


    You can also read the input into an array variable:


    ```

    @all_lines = <STDIN>;

    ```


    That reads all remaining lines of standard input into the array @all_lines.

    Each line (the newline character) is now an element of @all_lines. This behavior,
    reading until the end of the file in one statement, is so important that it has
    a special term: a STDIN slurp.


    ```

    # /usr/bin/perl -w

    # stdin3.pl


    use strict;

    ```'
