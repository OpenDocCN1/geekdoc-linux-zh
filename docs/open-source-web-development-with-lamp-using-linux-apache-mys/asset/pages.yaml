  md: '# CHAPTER 6 Website META Language


    done with WML. For example:



    WML also makes it easy to assign an attribute to multiple cells at once. At the
    top of the <table> definition, the following could be placed to provide an attribute
    for every cell in the first row:


    (1,2) align=right

    second - data


    That generates <td align="right">second - data</td>.


    (1,*) valign=top


    The text (*) tells WML to apply the attribute to all columns in the first row.
    The "*" is a wildcard meaning all elements. For all these columns in the specified
    row, valign="top" is set.

    Similarly, (*,1) align=left does the same thing for rows. In the first column
    of every row, WML applies the attribute align="left".

    One can get even more complicated; the formulation (*,2|3) align=right means for
    every row, the second and third columns get the attribute align="right".

    An example that illustrates all these concepts can be found in /var/www/html/wml/xtable2.wml.
    This example creates two tables. The first table creates a border (using border="1\
    Every element in the first row, (*), is given the attribute valign="top". The
    first column in all rows, (*,1), is granted align="left". For all rows, the second
    and third columns, (*,2|3), are align="right". A table of three rows and three
    columns is created.

    The second table is given a little spacing and padding with cellpadding="5" and
    cellspacing="5". Then all columns in all rows (*,*) valign="top". We then define
    a table with three rows and two columns.

    Here is the example:


