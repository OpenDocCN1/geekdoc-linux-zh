  md: "# CHAPTER 8 mod.perl 239\n\nis the output of the CGI program, is stored in\
    \ $content. But we don't care too much about the output in this program, so we\
    \ simply ignore it. Then the end time is computed and printed, and the difference\
    \ between the start time and end time is reported. This action is repeated for\
    \ the mod.perl program.\n\nHere is the output of this program on one of our machines\
    \ (a dual 450MHz server with 512MB of memory):\n\n```\n$ ./hitit.pl\nStart CGI:\
    \ 1017758223\nEnd CGI: 1017758259\nCGI difference: 36\nStart mod.perl: 1017758259\n\
    End mod.perl: 1017758265\nmod.perl difference: 6\n```\n\nThirty-six seconds for\
    \ CGI, six for mod.perl—not Bad. Of Course, YMMV.3\n\nSince TMTOWTDI, here is\
    \ another Perl program that times the execution of 1,000 get() calls for both\
    \ the CGI and mod.perl URLs. It is called hitit.pl.\n\n```\n#!/usr/bin/perl\n\
    use LWP::Simple;\nuse Benchmark;\n```\n\n```\n# The URLs to request\n$CGIURL =\
    \ `http://localhost/cgi-bin/hello.cgi`;\n$MODPERLURL = `http://localhost/perl/hello.cgi`;\n\
    ```\n\n```\ntimethese(1000,\n    CGI => q $content = get($CGIURL);\n    MODPERL\
    \ => q $content = get($MODPERLURL);\n);\n```\n\nThis program uses the Benchmark\
