    # PART III Dynamic


    “<< can be virtually any string of characters, including no characters. EOHTML
    stands for the End Of HTML. We could have used EOS—End Of Stuff, for instance.
    The here document, and the text that is to be printed, continues until the marker,
    EOHTML, is on a line by itself—that means it starts in the first column, and nothing
    follows it. This last bit is important. It can not be in the second column, and
    nothing can follow it, not even whitespace.


    Another advantage of the here format, besides the text being more readable, is
    that the double quotes no longer need be be escaped, as shown in the <body> tag.


