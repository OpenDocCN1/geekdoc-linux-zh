  md: '# 6


    # Website META Language


    # 6.1 INTRODUCTION


    Website META Language (WML) is a programming language created by Ralf Engelschall
    to build HTML code—thus a *metalanguage* (see www.thew1.org). It provides a convenient
    way to create and maintain complex web sites (as opposed to the dynamic web sites
    we''ll create later with CGI, mod_perl, Embperl, Mason, etc.). It''s especially
    useful for maintaining a consistent look and feel across the web site. As such,
    it''s a step up from plain HTML for building a web site, but is easier to use
    and less complex than the dynamic tools we''ll study in later chapters.


    If your site serves a large number of static web pages, with WML you can change
    all the pages by changing one template and then executing a make-like command.
    Another advantage of using WML is that after compilation, there''s no server-side
    processing; in contrast, the dynamic languages we''ll discuss later have to be
    executed on the server when they are called. In addition, with WML the client-side
    browser gains a advantage from being able to cache the static pages.


    The distinction here is something like that of a compiled language versus an interpreted
    one, with WML being the former and Embperl, Mason, et al., being the latter.


    As you go through this chapter, remember that in using WML, you should edit only
    the .wml files, *not* the .html files. The latter are the output of the former.'
