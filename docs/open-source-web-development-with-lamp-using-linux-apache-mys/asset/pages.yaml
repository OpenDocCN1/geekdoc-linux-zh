    sub handler {

    # shift the argument into $r

    my $r = shift;


    # get the date/time

    my $date = localtime();


    # get some of the request information

    # including the remote host, the URI,

    # the query string and the number of

    # bytes sent to the mod_perl program

    my $remote_host = $r->get_remote_host();

    my $uri = $r->uri();

    my $query_string = $r->query_string();

    my $num_bytes = $r->bytes_sent();


    To e-mail information about the request, the program calls rather obvious methods
    to learn about who and what asked for the information. These methods include get_remote_host();
    uri(); query_string() (gets the query string—all the stuff after the "?"); and
    bytes_sent(). Most of these are self-explanatory.'
