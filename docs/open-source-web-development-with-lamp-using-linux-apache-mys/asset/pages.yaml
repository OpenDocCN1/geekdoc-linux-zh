    Apache logs every hit to the webserver (see the section on log files later in
    this chapter). Some of the information that can be written to the log includes
    the following:


    +   - The client (Web surfer) IP address

    - The date

    - The URI requested (all the stuff after www.example.com/)

    - The referer—the web page the client was at when they clicked the link to take
    them to our web page

    - The user agent (the browser the client is using)


    There are various predefined CustomLog options, logging more or less information.
    The default logged in /var/log/httpd includes some of this information (the client
    IP address, the date, and a few others). Until your site is running smoothly (and
    may even after), you''ll want more information, so use the format that includes
    the most information. Change the following:


    ```

    CustomLog /var/log/httpd/logs/access_log common

    ```


    to:


    ```

    CustomLog /var/log/httpd/logs/access_log combined

    ```


    Other options include


    ```

    CustomLog /var/log/httpd/logs/access_log agent

    CustomLog /var/log/httpd/logs/access_log referer

    ```


    But the combined format includes this information, as you might expect from the
    name. Using combinations of these options, you can customize your logging experience.


    > ⁷Yes, it''s misspelled—it was misspelled in the original spec, and we continue
    to do so in honor of our forefathers. Or maybe because it''s just too much work
