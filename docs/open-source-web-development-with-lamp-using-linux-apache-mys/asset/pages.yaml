  md: '# 5.3 DATABASE INDEPENDENT INTERFACE


    Running MySQL commands from the shell is well and good first 12 times it has to
    be done. After that, the typical lazy programmer starts thinking of ways to automate
    the process. Here, the answer is Perl and the DataBase Independent interface (DBI).
    DBI enables to write programs to automate database maintenance and to write other
    scripts to interface with MySQL.


    DBI is a Perl module that provides methods to manipulate SQL databases. With DBI,
    one can connect to a database within a Perl script and issue all kinds of queries,
    including SELECT, INSERT, and DELETE. For now, we create Perl scripts that can
    be run from shell. Later, we will use CGI, mod.perl, Emperl, Mason, and PHP to
    hook database independent interfaces into web programs.


    First, a quick example. We put all these DBI examples in a directory that is under
    /var/www/ so the examples are downloadable from www.opensourcewebbook.com. In
    the real world, we do not suggest creating a directory /var/www/ to create arbitrary
    Perl programs, but for our purposes, it just makes easier when downloading all
    the examples. Create the directory and go there:


    ```

    $ mkdir /var/www/bin

    $ cd /var/www/bin

    ```


    The first example demonstrates how to connect to a database. This code is stored
    in the file /var/www/bin/connect.pl and online at http://localhost/mysql/connect.pl
    or www.opensourcewebbook.com/mysql/connect.pl. The content of connect.pl is:


    ```

    #!/usr/bin/perl -w

    # connect.pl


    # use the DBI module

    use DBI;


    # use strict, it is a Good Idea

    use strict;


    # connect to the database, assigning the result to $dbh

    my $dbh = DBI->connect(''DBI:mysql:people'', ''apache'', ''LampIsCool'');

    ```'
