    # 8.1.1 How It''s Faster


    Figure 8.1 depicts what happens when a CGI program is executed, as explained in
    Chapter 7. When the request for the CGI program, made for a.cgi, the httpd child
    process that is handling the request discovers that the CGI program is to be executed
    by Perl (it learns this from the first line of a.cgi: #!/usr/bin/perl). Therefore,
    the child process first loads perl into memory (this takes some work and time
    to do). Then, the perl process executes a.cgi by first compiling it into an internal
    byte-code representation (this compilation takes some work and time to do) and
    then executing it.


    a.cgi is executed multiple times a day (let''s say a million, for a nice round
    number), this loading of Perl/compilation/execution must be repeated multiple
    times a day. This is inefficient. Instead, wouldn''t it be nice to eliminate the
    first two steps by loading Perl only once and compiling a.cgi only once, leaving
    only the execution of a.cgi? If this could be done, the execution of a.cgi could
    be sped up significantly. mod.perl can do this!


    When you want to use mod_perl to execute a.cgi, the scenario looks like Figure
    8.2. With mod_perl, the httpd child process has Perl embedded within it, so there
    is no need to load Perl when a.cgi is to be executed,'
