  md: '# 336


    # PART IV Embedded


    ![](img/9b05e38e58495be06a08eeb2b6906346_371_0.png)


    Figure 11.1 Mason example


    We notice right away that our first Mason example is not “hello, world!”. We apologize
    for the inconsistency.

    At the top of this file is % $name = `John Doe`; The character “%” indicates that
    this file is Perl code to be executed. The variable $name is defined using the
    my() function. Global variables in Mason must be my() variables—if they are not
    declared with my(), a syntax error is generated.

    The Perl code within < ... > is executed, and what that code evaluates to is replaced
    in the HTML file (much like Embperl''s [+ ... +]). Therefore, <$name> is replaced
    with the value John Doe, and % 2 + 3 % is replaced with the result 5.

    Try this by loading either of the following URLs: http://localhost/mason/test.html
    or www.opensourcewebhook.com/mason/test.html. This should display a page similar
    to Figure 11.1.


    # 11.5 INLINE PERL SECTIONS


    There are several ways to embed Perl code into the Mason pages: <% ... % > sections,
    “%” lines, and <%perl> ... </perl> blocks. The next sections explore these.


    > For lines that begin with “,%” that “%” must be the first character in the line.'
