  md: 'PerlModule HTML::Mason::ApacheHandler

    <Directory /var/www/html/mason

    SetHandler perl-script

    PerlHandler HTML::Mason::ApacheHandler

    </Directory>


    The first line sets the Mason component root directory to /var/www/html/mason.
    This tells Mason where to find the components (on these later). The data directory
    is set to /var/www/misc/mason. The Mason data directory should not be under the
    HTML root directory (/var/www/html/), because we want to hide the Mason data files
    from the Web surfer operating site. The data directory contains files that Mason
    uses, so we have picked an innocuous place for Mason to put them. You do not have
    to create this directory; and all of its subdirectories are magically created
    for you.


    Apache directives should be defined for the directory /var/www/html/mason. they
    tell Apache to set the handler to perl-script and to use the HTML::Mason::ApacheHandler
    module for all files in the /var/www/html/mason directory.


    Load the altered Apache configuration file:


    ```

    # /etc/init.d/httpd graceful

    ```


    # 11.4 A QUICK EXAMPLE


    Let''s show an example. We create the file /var/www/html/mason/test.html and placing
    the following contents within it:


    ```

    % my $name = `John Doe`;


    <html>

    <head>

    <title>Mason Example</title>

    </head>

    <body bgcolor="#ffffff">


    Hello, <% $name %>!

    <br>2 + 3 = <% 2 + 3 %>


    </body>

    </html>

    ```


    > Set the permissions to 644, but you already knew that, right?'
