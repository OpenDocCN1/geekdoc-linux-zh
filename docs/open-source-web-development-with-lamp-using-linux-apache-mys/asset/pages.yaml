    # 5.4.4 wml::fmt::xtable


    If you''ve written HTML, you know how tedious it is to create tables using the
    `<table> ... </table>` tags. If you haven''t, take our word for it. All the `<tr>`
    and `</tr>` tags must be included in the proper order, not to mention the `<th>`,
    `</th>`, `<td>`, and `</td>` tags. When you make a mistake in table tags, finding
    the place where you failed to open or close a cell can be a nightmare. WML provides
    a new solution in wml::fmt::xtable.


    The include file wml::fmt::xtable defines <<table> ... </table> tags to ameliorate
    these headaches. Other tags for table headers, table data, and can more also be
    defined.


    Let''s start with a simple example, which can be found in /var/www/html/wml/xtable1.wml
    or online at http://localhost/wml/xtable1.wml or'
