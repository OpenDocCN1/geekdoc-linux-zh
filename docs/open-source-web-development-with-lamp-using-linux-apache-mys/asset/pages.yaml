  md: '# Mason (HTML ::Mason)


    # 11.1 INTRODUCTION


    HTML::Mason (aka Mason—see www.masonhq.com/) is a Perl module created by Jonathan
    Swartz. Its function is similar to Embperl: to include Perl code within an HTML
    page. The following are some of the features of Mason:


    +   - Simple embedded Perl syntax—An HTML file can harness the power of Perl,
    including variables (scalar, arrays, hashes, etc.), complex data types, and flow-control
    constructs.

    - Modular pages with components—Create subroutine-like code, known as components,
    to generate headers, footers, menus, and so on.

    - Parameter handling—It provides easy access to GET/POST parameters, including
    assigning default values and triggering error conditions.

    - Templates and filters—A template can be created and applied to the entire site
    or a portion of the site.

    - Object-oriented techniques—The power of Perl and its object-oriented features
    can be used.

    - Caching—When the code on the page or component is cached, the next page or component
    is requested, the cached version is executed.

    - Previewing—A built-in previewer can be used to review a page, using a number
    of client and request conditions.

    - Staging/production modes—Mason can be configured to use a staging server or
    staging area for development.'
  merge: -1
  pgno: 366
- img_proc: true
  md: '# 11.1.1 Mason Compared with Embperl


    Mason and Embperl are similar: Both embed Perl code directly into HTML pages.
    This allows the creation of a web page to be divided into two parts: the web designers
    (graphic artists) can concentrate on creating the page with static (and easy to
    use) HTML, and the programmers can focus on  adding the programming code.


    Both Embperl and Mason allow the use of Perl variables, complex data types, and
    Perl classes and objects (if we want to use Perl''s object-oriented features).
    Both provide an interface to Apache::Session to create user sessions and the ability
    to create templates to apply to the entire site or portions of the web site. Both
    cache the compiled Perl code within the HTML, recompiling only when the file timestamp
    changes.


    Why both? The answer is TMWTOTDI. One of the benefits of Open Source is that we
    have choices, so again we have the choice of Embperl or Mason (or Apache: ASP,
    or perl, or . . .)


    We try to point out some differences between these two approaches, but we think
    the most important difference lies in this simple idea: it is a matter of style
    and preference. Because almost every situation encountered in developing a web
    site is solvable by either Embperl or Mason, the choice comes down to which you
    prefer. Given that, here are differences between the two.


    Embperl''s focus is on easily generating HTML. It is known for its speed and ease-of-use
    Apache::Session interface. It is tightly integrated with HTML, allowing the programmer
    to dynamically create tables and escape HTML and URLs (with Sescape), and its
    form widgets are sticky.


    Mason is geared toward a more sitwide approach—it is more than a template tool.
    Mason''s approach aims less learning toward easy to use and more toward a system
    that is more flexible and allows the programmers to code "my way" at the cost
    of being a bit more complicated. An example is that the interface to Apache::Session
    is not built in—programmers must add the code to hook into this module; but that
    enables programmers to do what they want with Mason instead of relying on Mason
    to do it for them. Mason can be a bit more complicated and intimidating to new
    users, but good online documentation and a helpful community go a long toward
    helping new programmers learn the rich feature set.'
  merge: -1
  pgno: 367
- img_proc: true
  md: '# CHAPTER 11 Mason (HTML::Mason) 333


    An important feature of Mason is that with a special syntax tag (<Kinit>more on
    this later), executable code can exist at the bottom of the HTML page, yet will
    be executed first thing. The model here is that in a web design shop, HTML is
    created by graphic designers; then programmers come in and add code. With Mason,
    much of that can simply be added at the bottom of the HTML file, so when the graphic
    designers update the HTML, they don''t have to contend with the Mason code.


    # 11.2 INSTALLATION


    Mason is not installed on many distributions, including Red Hat (yet), so we''ll
    go through the drill of installing it manually. First though, two other modules
    must be installed: MLDBM (Multi-Level Database Manager) and Params::Validate.
    MLDBM is a Perl module that allows the storage and retrieval of multidimensional
    data structures. Mason uses MLDBM to store its cache files.


    To install MLDBM, get the latest version (as of the writing of this book, 2.00)
    from www.cpan.org/modules/by-module/MLDBM/. Save MLDBM-2.00.tar.gz to /tmp. Then,
    as root:


    ```

    # cd /tmp

    # xvzf MLDBM-2.00.tar.gz

    # cd MLDBM-2.00

    # perl Makefile.PL

    # make

    # make test

    # make install

    ```


    Next install Params::Validate. Mason uses this module to validate function calls
    arguments. Get the latest version available (as of this writing, version 0.07)
    from www.cpan.org/modules/by-authors/id/D/DR/DROSKY/. Next, download Params-Validate-0.07.tar.gz,
    and save it to /tmp. Then, as root:


    ```

    # cd /tmp

    # xvzf Params-Validate-0.07.tar.gz

    # cd Params-Validate-0.07

    # perl Makefile.PL

    # make

    # make test

    # make install

    ```


    Now your system is prepped for HTML::Mason. The latest version (as of this writing,
    version 1.04) can be found at www.cpan.org/modules/'
