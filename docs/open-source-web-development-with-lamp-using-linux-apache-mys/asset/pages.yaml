    The first line of this file is package HelloWorld;. This creates a package (also
    known as a namespace in some languages) named HelloWorld. This line makes sure
    that any variables and subroutines we define will not clash with those from other
    mod_perl programs. All mod_perl programs are created as modules. This package
    begins with the first line and extends to the end of the file. This file will
    be called HelloWorld.pm.


    It''s always a good idea to use strict in modules. This enforces good programming
    style by forcing the declaration of all the variables as my variables (hence no
    globals), thus eliminating pesky problems caused by global variables. Global variables
    have their uses, but one should think carefully before using them.


    The Apache::Constants module contains some useful constant values (such as OK).
    When Apache receives a request that is associated with a mod_perl program, it
    invokes the handler() method, passing it an Apache request object that is stored
    in $r. This object is available to it many methods defined in the mod_perl API.


    The first request object executed is content_type(), which tells Apache that the
    content type is text/html. The HTTP header is sent with send_header(). The HTML
