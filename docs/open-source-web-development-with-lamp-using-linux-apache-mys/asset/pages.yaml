  md: '# 120 PART I Structural


    Recall that the MySQL user is not the same as a Linux user. The mysqladmin command
    changes the password for the MySQL user only, not the Linux user. For security
    reasons, we suggest that the MySQL password never be the same as the password
    used to log in to the Linux machine. Also, the password IAMGod, which is clever,
    is a bad password for many reasons, including the fact that it is used as an example
    in this book. For a discussion on what makes a password good or bad, we suggest
    you Hacking Linux Exposed [Hatch+ 02].


    ```

    $ mysql -u root -p

    Enter password:

    Welcome to the MySQL monitor. Commands end with ; or \g.

    Your MySQL connection is 15 to server version: 3.23.36

    Type \help; or \h for help. Type \c to clear the buffer

    mysql>

    ```


    Doing all the SQL queries in the people database by the MySQL root user is a Bad
