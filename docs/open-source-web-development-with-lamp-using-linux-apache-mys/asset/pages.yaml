    \ if where each conditional expression compares the same variable against a value.\
    \ An if statement:\n\n```\n<?php if ($i == 0) {\n  statements0\n} elseif ($i ==\
    \ 1) {\n  statements1\n} elseif ($i == 2) {\n  statements2\n} elseif ($i == 3)\
    \ {\n  statements3\n} elseif ($i == 4) {\n  statements4\n} ?>\n```\n\ncan be rewritten\
    \ as a switch:\n\n```\n<?php switch ($i) {\ncase 0:\n  statements0\n  break;\n\
    case 1:\n  statements1\n  break;\ncase 2:\n  statements2\n  break;\ncase 3:\n\
    \  statements3\n  break;\ncase 4:\n  statements4\n  break;\n} ?>\n```\n\n# while\
    \ Loop\n\nPHP's while loop is C-like, and as one might expect, also has two syntaxes:\n\
    \n```\nwhile ($condition) {\n  statements\n}\n```\n\nand the second one:\n\n```\n\
    while ($condition) :\n  statements\nendwhile;\n```"
