    #use wml::std::page

    #use wml::fmt::xtable


    # get the standard page html

    <page>


    <h3>Table with a border</h3>


    <xtable border="1">

    (1,*) valign=top

    (*,1) align=left

    (*,2|3) align=right

    (1,1))

    ```'
