  md: '# 5


    # MySQL


    # 5.1 INTRODUCTION


    Many of the applications that a Web developer wants to use can be made easier
    by the use of a standardized database to store, organize, and access information.
    MySQL is an Open Source (GPL) Standard Query Language (SQL) database that is fast,
    reliable, easy to use, and suitable for applications of any size. SQL is the ANSI-standard
    database query language used by most databases (though all have their nonstandard
    extensions).


    MySQL can easily be integrated into Perl programs by using the Perl DBI (DataBase
    Independent interface) module. DBI is an Application Program Interface (API) that
    allows Perl to connect to and query a number of SQL databases (among them MySQL,
    mSQL, PostgreSQL, Oracle, Sybase, and Informix).


    If you installed Linux as suggested in Chapter 2, MySQL and DBI are already installed.


    # 5.2 TUTORIAL


    Following the Swiss Army knife theory (20 percent of the functions give you 80
    percent of the utility), a few SQL commands go a long way to facilitate learning
    MySQL/Perl/DBI.


    To illustrate this, we create a simple database containing information about some
    (fictional) people. Eventually, we''ll show how to enter this information from
    a form on the Web (see Chapter 7), but for now we interface with SQL directly.'
