  md: '# CHAPTER 10 Embperl (HTML::Embperl) 311


    simple modifications to the HTML in the templates take effect immediately—there
    is no reason to restart the server.


    It works like this: When an .html file is requested, a base file (call it base.html,
    configured in httpd.conf) is searched for in the directory contains the file requested.
    This base.html contains HTML for the look and feel of the web site—the top, left
    rail, and bottom HTML. If base.html is not found in that directory, EmbperlObject
    looks in directories up the tree until it finds named base.html. If EmbperlObject
    searches up the directory root (/var/www/html/, in these examples) and does not
    find a base.html, the user sees a “Not Found” error.


    We start with a simple example to illustrate the concepts and move on to implement
    a project. First we must create a new directory because the examples and project
    must be told to the EmbperlObject module. Create a new directory:


    ```

    # mkdir /var/www/html/embperlproject

    # chmod a+rx /var/www/html/embperlproject

    ```


    Next, reconfigure Apache so it knows about the new part of the web site. As root,
    add the following to the bottom of Apache’s configuration file:


    ```

    <Directory /var/www/html/embperlproject>

    PerSetEnv EMBPERL_OBJECT_BASE base.html

    <Files .html>

    SetHandler PerlHandler HTML::EmbperlObject

    Options ExecCGI

    </Files>

    </Directory>

    ```


    This directive tells Apache that under the directory /var/www/html/embperlproject,
    the EmbperlObject base file, or template file, is named base.html. Then, for all
    files that end in .html, process them with the handler HTML::EmbperlObject. As
    mentioned before, this directory is configured this way because Apache serves
    up .txt, from this directory as normal files. See the docs (perDoc HTML::Embperl)
    for all the different ways to configure this directory.


    When this is done, load the altered Apache configuration file:


    ```

    # /etc/init.d/httpd graceful

    ```'
  merge: -1
  pgno: 346
