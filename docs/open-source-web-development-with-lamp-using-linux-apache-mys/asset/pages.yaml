    # Array Functions


    Perl has a variety of functions that implement commonly performed array functions,
    saving you from having to write your own.


    push() and pop() The push() and pop() functions modify the right side of an array.
    The push() function adds elements to the right, and pop() removes the rightmost
    element:


    ```

    #!/usr/bin/perl -w

    # file: pushpop.pl


    use strict;


    my @a = (2, 4, 6, 8);

    print "before: @a\n";n

    push(@a, 10, 12);

    print "after push: @a\n";n

    my $element = pop(@a);

    print "after pop: @a\n"

    print "element popped: $element\n";

    ```


    That code changes the array in the following fashion:


    before: 2 4 6 8

    after push: 2 4 6 8 10 12

    after pop: 2 4 6 8 10

    element popped: 12


    unshift() and shift() These functions are similar to push() and pop() except that
    they operate on the left side of the array.


    ```

    #!/usr/bin/perl -w

    # file: unshiftshift.pl


    use strict;


    my @a = (2, 4, 6, 8);

    print "before: @a\n";

    ```'
