  md: "# CHAPTER 4 Perl\n\nThe while and until loops work this way as well:\n\n```\n\
    while ($tired) {\n  sleep();\n}\n```\n\ncan be written as:\n\n```\nsleep() while\
    \ $tired;\n```\n\nThis until loop:\n\n```\nuntil ($done) {\n  cook_the_burgers();\n\
    }\n```\n\ncan be written as:\n\n```\ncook_the_burgers() until $done;\n```\n\n\
    Expression modifiers can be used only when the body of the construct is a simple\
    \ statement. In other words, the body cannot be an if or while or any other multistatement\
    \ body. For instance, this is illegal in Perl (but possible in reality):\n\n```\n\
    print \"rebooting...\" if $ne `Linux` until end_of_time;\n```\n\n# Short-Circuited\
    \ Logic Operators\n\nThe logic operators &&, and, || or are short-circuited—if\
    \ the entire result of the operator can be established at any point, the rest\
    \ of the expression is not evaluated, because it doesn't need to be. With the\
    \ logical and operator, if the first operand is false, we know that the result\
    \ of the operand is false (because \"false and false\" is false and \"false and\
    \ true\" is false). Therefore, in expression1 && expression2, if expression1 is\
    \ false, expression2 is not evaluated because of this short-circuited nature.\
    \ If expression1 is true, expression2 must be evaluated to determine the result\
    \ of the && operator. Thus, the && is logically equivalent to the if statement.\
    \ This code:\n\n```\nexpression1 && expression2\n```\n\nis equivalent to this:\n\
    \n```\nif (expression1) {\n  expression2\n}\n```"
