  md: "# Preface\n\n# xxi\n\n+   - MySQL is an SQL database program. It is “the world’s\
    \ most popular\nOpen Source Database” (it says so on their web site).\n\n+   -\
    \ Perl is the programming language of choice for interacting with text files,\n\
    shell scripts, and a million things. (Python is similar to Perl in\nfunctionality;\
    \ however, we chose Perl for our purposes because we know\nitter better and like\
    \ it.)\n\nPart II, Static: WML is a set of programs that facilitates building\
    \ and\nmanaging large-scale static web sites using HTML files.\n\nPart III, Dynamic:\
    \ CGI and mod_perl are the programs with which to\ndynamic web sites.\n\n+   -\
    \ CGI is the tried-true way of generating dynamic content.\n\n+   - mod_perl is\
    \ a better, faster, and stronger way of generating dynamic\ncontent; mod_perl\
    \ combines two pillars of Source: Apache and Perl.\n\nPart IV, Embedded: SSI,\
    \ Embperl, Mason, and PHP are embedding pro-\ngrams to use within HTML pages.\n\
    \n+   - Server Side Includes (SSI) is built into Apache. Its job is to preprocess\n\
    HTML files, turning SSI directives into HTML text; it allows well\nprogrammers\
    \ to embed executable code into HTML files.\n\n+   - Embperl and Mason are Perl\
    \ modules for building embedded web content.\n\n+   - PHP is another way to embed\
    \ executable code with HTML files. PHP does\nEmbperl and Mason do, just differently.\n\
    \nSo why have many choices? Read on, gentle reader, and you will\ndisco that a\
    \ myriad of choices is the Open Source way!\n\n# This Does Free Software Come\
