    \    WHERE title LIKE '%$search%'\n    OR text LIKE '%$search%'\n    ORDER BY\
    \ date DESC\n    LIMIT 10\";\n} else {\n    $query = \"SELECT id,date,title\n\
    \    FROM entries\n    ORDER BY date DESC\n    LIMIT 10\";\n}\n// execute the\
    \ MySQL query, grab the result in $result\n$result = mysql_query($query);\n (!$result)\
    \ die(\"query failed - \" . mysql_error());\n```\n\nFirst, $search is assigned\
    \ the search string (if any) entered into the search string widget. Then a connection\
    \ is made to the server, and the journal database is selected.\n\nIf a search\
    \ string is entered and stored in $search, a query is made that includes WHERE\
    \ title LIKE '%$search%' OR text LIKE '%$search%'. This query uses the WHERE ...\
    \ Like case. If we say WHERE LIKE '%$search%', the LIKE pattern works just like\
    \ a shell glob, where \"%*\" is like \"*. So, %foo means \"any text followed by\
    \ foo by any text,\" as much as we would say in the shell as *foo\".\n\nTherefore,\
    \ our LIKE clause reads as \"where the field title matches the pattern '%$search%',\
    \ or any text followed by the value of the variable $search somewhere in it. Or,\
    \ more simply, match a title that contains our search somewhere in it.\n\nThe\
    \ search string in the text field is also checked. If either of those fields contains\
    \ the search pattern, the item is selected.\n\nThis query returns the ten (with\
    \ LIMIT 10) most recent (with ORDER date DESC) entries. If no search string is\
    \ stored in $search, the query simply returns the most recent codes.\n\nLater\
    \ in the page you see this code:\n\n```\nif ($search) {\n    print \"<p>Search\
    \ string: <b>\" . $search . \"</b></p>\";\n}\n```"
