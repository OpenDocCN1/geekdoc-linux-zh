  md: '# Server Side Includes


    # 9.1 INTRODUCTION


    Server Side Includes (SSI) provides a simple way to embed executable code into
    a web page. The advantages of SSI are that it is simple to use and easy to learn,
    and sometimes simplicity is its own reward. The main drawback of SSI is that because
    of its simplicity, it is limited in what it can do.


    SSI is not CGI (see Chapter 7)—that is, it is not a program that is executed to
    generate HTML text, so one needn''t be Perl hacker to use it. Rather, SSI is a
    collection of directives that can be embedded in an HTML file and processed by
    Apache. A directive has this form:


    ```

    <#directive param1="value" param2="value"...-->

    ```


    which is simply an HTML comment with a "# escape to SSI. Among other things, SSI
    allows you to


    +   * Display variables

    * Include contents of files

    * Display information such as the date and filename

    * Execute programs or commands

    * Create variables

    * Use simple conditional expressions


    SSI is not intended to be used to perform sophisticated programming tasks. It
    is mainly used to do simple includes (thus the name) of basic information.


    > ¹Gödel raises his head again [Hofstadter 99].'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# 278


    # PART IV Embedded


    http://www.example.com/a.shtml


    www.example.com


    N GET /a.shtml HTTP/1.0


    ![](img/9b05e38e58495be06a08eeb2b6906346_313_0.png)


    Figure 9.1 How SSI works


    For anything more complex, other things you learn about elsewhere in this book
    are better choices. But you don''t need a cannon to kill a gnat, so SSI has some
    useful applications if gnats are what we need to be swatted.


    # 9.1.1 How It Works


    As Figure 9.1 shows, when the user requests a file that ends in the .shtml extension,
    the Apache server runs the text through the Server Side Includes preprocessor.
    This processes the SSIs, converting all SSI directives into the appropriate text.
    The resulting text is then sent back to the browser.


    # 9.1.2 Configuration


    If you installed Linux as suggested in Chapter 2, Apache should already be configured
    to support SSI. To check, make sure these two lines of the Apache configuration
    file (/etc/httpd/conf/httpd.conf) are uncommented:


    ```

    AddType text/html .shtml

    AddHandler server-parsed .shtml

    ```


    These directives add a type of file with the suffix .shtml, whose content is to
    be treated as HTML and whose file is to be server-parsed, or preprocessed, by
    the Apache server before being served up. All files with the'
  merge: -1
