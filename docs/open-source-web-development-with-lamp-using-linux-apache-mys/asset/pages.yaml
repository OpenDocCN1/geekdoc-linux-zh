    # 6.5.3 wml::des::navbar


    Let’s say you want to create a nifty navigation bar of the type often seen on
    web sites: When you roll over one of the links, the image becomes highlighted,
    hence the name “image rollover.” A perfect example can be see at www.hackinglinuxexposed.com/,
    shown in Figure 6.5.


    You can see the navigation bar along the left rail, showing links to the About
    page, the Contents page, and so on. When the mouse is moved over a link, the image
    changes to another image, one that is a different color, usually brighter, which
    basically says, “Hey, you are now over this link; click here and go somewhere
    important.”


    It happens that www.hackinglinuxexposed.com/ is built with WML, so we can peek
    at a subset of the WML code that built navigation.'
