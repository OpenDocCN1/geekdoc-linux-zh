    # 4.3.3 Declaring Variables with use strict:


    Perl, as a scripting language, has looser rules than other “real” programming
    languages like C and Java. One such quality is the ability to create variables
    by simply using them, much as in shell programming. Still, it is considered good
    style to declare them. Doing so can preclude the silly typo problems that everyone
    is likely to incur from time to time:


    ```

    $food = "pizza";

    print "I am hungry for $food!\n";

    ```


    The variable $food is assigned, but $food will be printed. Perl allows this without
    a syntax error because neither variable has to be declared.'
