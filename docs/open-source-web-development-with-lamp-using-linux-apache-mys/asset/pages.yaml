  md: '# CHAPTER 1 The Web Explained


    # Server

    Disk


    www.example.com


    ![](img/9b05e38e58495be06a08eeb2b6906346_40_0.png)


    Figure 1.2 Serving static data


    This happens on the client side or the server side is independent. If the client
    wants to block pop-up ads, there isn''t much the server can do about it. If someone
    develops a new server-side application or improves an old one, the client doesn''t
    care, as long as protocols are adhered to.


    # ## 1.1.1 Serving Up Static Data


    The simplest thing for the server to do is to serve static data, or data that
    is the same for every client and changes only when an HTML programmer changes
    the source file. The server accomplishes this by locating an HTML (or image or
    PDF or ...) file on the local hard drive and sending that content back to the
    client unchanged. This requires no server programming—the Apache web server does
    all the work.


    This is illustrated in Figure 1.2. Let''s say the user enters the URL www.example.com/.
    The server.example.com is contacted, and a request is made that causes the server
    to locate a file (/var/www/html/index.html) on its local drive. The file is located
    and sent back, as is, the client.


    We discuss static content when we talk about how to set up and use the Apache
    web server (see Chapter 3). We also discuss how to easily create and manage a
    large (or small, for that matter) static Web site using the Website META Language
    (WML)—see Chapter 6.


    > Actually, the server prepends some information, called the header, to the content
    and sends the header followed by the contents of index.html. More on this in Chapter
    3.'
