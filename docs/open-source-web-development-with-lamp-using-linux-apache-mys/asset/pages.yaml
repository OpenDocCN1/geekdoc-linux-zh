    # 2.1.3 Decisions, Decisions


    Before you start the installation, you must make some important decisions about
    your installation. Do you want to have a dual Windows/Linux boot or strictly Linux?
    If you dual boot, do you want to put both operating systems on one disk, or do
    you want to install another hard drive for Linux? Is this going to be a workstation
    in addition to being a server, or strictly a command line interface (CLI) accessed
    server?


    One advantage of dual booting is that you get to keep all the nonmonopolistic
    practices software that make it easy for you to buy a computer without a Microsoft
    operating system preinstalled (scasm alert!). With dual booting, you can even
    run Windows under an emulator in Linux.


    But if this machine is a full-time webserver, not a user machine, you may want
    to keep things simple and with Linux as your only operating system. This makes
    installation much simpler.


    If you decide to go strictly with Linux, you can''t go back to Windows without
    reformatting your hard disk and reinstalling Windows.


    As always, before you start any major system task like this—you can lose everything
    when you starting with fundamental things like disk partitions. At the very least,
    copy your important files to another computer, a CD-ROM, a tape, or an external
    disk. Therefore, there are several installation options.


