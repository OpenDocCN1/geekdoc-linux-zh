  md: '# 110 PART I Structural


    First, try to make a connection to our MySQL server as the root MySQL user:


    ```

    mysql -u root

    ```


    The MySQL root user is different from the Linux root user. The MySQL root user
    is used to administer the MySQL server only.


    If you see the following output:


    ```

    ERROR 2002: Can''t connect to local MySQL server through socket `/var/lib/mysql/mysql.sock`(2)

    ```


    it likely means the MySQL server is not running. If your system is set up securely,
    it shouldn''t be running, because you had no reason, before now, for it to be
    running. Use chconfig as root to make sure it starts the next time you machine
    the clocks, and start it by hand as follows:


    ```

    # chconfig mysql MYSQL --user=password

    # /etc/init.d/mysql start

    ```


    Now you should be able to connect (not logged in as the Linux root user):


    ```

    mysql -u root

    ```


    If not, see the MySQL log file at /var/log/mysqld.log. If so, you''ll see a welcome
    message and the MySQL prompt:


    Welcome to the MySQL monitor. Commands end with ; or \g.

    Your MySQL connection id is 3 to server version: 3.23.36


    Type ''help;'' or ''\h'' for help. Type ''\c'' to clear the buffer


    ```

