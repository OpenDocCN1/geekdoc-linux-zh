  md: '# #7 The Common Gateway Interface


    # ##7.1 INTRODUCTION


    Thus far we have dealt with static web pages, which are simply HTML text files
    that don''t change except when the file is edited by hand or generated by WML.
    In this chapter, we learn about dynamic web pages, which contain content that
    is created when requested. Now all the Perl that you learned in Chapter 4 and
    the MySQL that you learned in Chapter 5 will come in handy.


    In this chapter, we discuss the basic way to create dynamic web pages: the Common
    Gateway Interface (CGI), a standard for communication between a client and the
    server. CGI scripts can be written in almost any language; we like Perl. Perl
    is well suited to the types of text processing common for many tasks, such as
    search engines and forms interfaces. Other benefits of Perl include portability,
    ease of programming, and overall computational power and performance. To top it
    off, the module CGI.perl is a useful way to make Perl CGI script writing quick
    and easy.


    CGI scripts can do simple things that require no input from the client, such as
    displaying the current time or a random banner when a web page is accessed. Or
    they can do more complicated tasks involving posted data from the client, such
    as entering a credit card number, searching a database and returning the information,
    and filling out a form. In Chapter 8, you''ll find that mod.perl is equally suitable
    for this purpose, and in many cases, mod.perl is faster, so why not learn CGI
    scripts at all?


    First, the basics of how data is passed from server to server and from server
    to browser are same using either CGI or mod.perl. CGI scripting is easy. There
    are a wealth of examples to draw from. Apache is probably'
  merge: -1
  pgno: 222
- img_proc: true
  md: 'Many web sites have Perl CGI programs available for free download. There are
    too many to mention here, and we wouldn''t anyway because it has been our experience
    that many of the CGI programs available for download—both free and payable packages—are
    poorly written at best and serious risks at worst. Therefore, allow us to go on
    record as saying that although scripts online can be useful for learning, suggest
    that you avoid them without careful examination. But you wouldn''t use a program
    that you downloaded from Joe Schmoe''s web site without looking over it, would
    you? Caveat emptor.


    already configured for CGI.¹ mod_perl often requires you to restart the server
    when a program changes, but CGI changes do not. The rest of the world uses CGI.
    And you already know Perl. The main reason to use CGI is that it''s common, and
    at some point in the webmaster career, you''ll need to understand how CGI works
    because you or one of your clients will want to use an existing script. And most
    everything you learn here will be applicable for mod_perl in some way or another.


    # 7.1.1 CGI Explained


    Figure 7.1 depicts what happens during the request and execution of a CGI program.
    The webserver recognizes a CGI request by the location of the thing requested
    (or by the filename extension). For instance, if you load the URL www.example.com/cgi-bin/a.cgi
    into the browser, the webserver contacted, www.example.com, receives a request
    as follows:


    ```

    GET /cgi-bin/a.cgi HTTP/1.0

    ```


    The server notices the directory that contains the thing requested cgi-bin. It
    is configured to take the object requested, here a.cgi, which is a program located
    on the server, and execute it as a stand-alone program. The program generates
    standard output (in Perl, we would use print() ). This output is in an important
    format: a header, a blank line, and the body.


    > ¹It is if you installed Linux as we suggested in Chapter 2.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# CHAPTER 7 The Common Gateway Interface 189


    http://www.example.com/cgi-bin/a.cgi www.example.com


    ![](img/9b05e38e58495be06a08eeb2b6906346_224_0.png)


    Figure 7.1 CGI explained


    The header is a very important piece of information that is sent back to the browser
    because it tells the browser how to render the data that follows. The primary
    piece of information that is sent in the header is the Content-type. If the header
    contains Content-type: text/plain, the browser displays the data that follows
    as plain text. If the header contains Content-type: text/html, the browser treats
    the data that follows as HTML and renders it appropriately. And this is what really
    important: Programs must output the header, then a blank line, and then the content
    to be displayed. The blank line is essential—it tells the browser that the header
    is complete and the body is to begin.


    It is easy to see the header, blank line, and body output from a CGI program by
    using a shell and telnetting to a server. The following code is an example of
