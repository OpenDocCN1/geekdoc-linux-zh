  md: 'to pass a parameter to this program using the name/value pair that we

    want, as in:


    ```

    http://localhost/php/big_security_hole.php?authenticated=true

    ```


    Doing this would magically set $authenticated to true. Therefore,

    even if something.important() returned false, the very important flag

    $authenticated would be assigned true—very bad.


    Therefore, we strongly suggest that you turn this off for PHP.

    You can do so for the entire site or for a specific directory. Because this

    is a nasty problem, we suggest that you turn it off for the whole site by

    adding this line to /etc/httpd/conf/httpd.conf.


    ```

    php_flag_register_globals Off

    ```


    To turn it off for only a specific directory in the web document tree, add

    this to the configuration file:


    ```

    <Directory /var/www/html/php

    php_flag_register_globals Off

