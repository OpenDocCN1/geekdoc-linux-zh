  md: '# CHAPTER 12 PHP


    First, the ID number for the journal entry is in $sid. Then, if there is an ID
    number and it is greater than 0, we connect to the server, select the journal
    database, and grab the title, text, and date from the record for the given id.
    Then, we make sure we have a record, and if so, the data is stored in $Array and
    the flag is set to true. Then the connection is cleaned up.


    Later in the page, there is this code:


    ```

    <? if ($found) ?>

    <table border="0" cellpadding="0">

    <tr><td valign="top">Date:</td><td><?php echo $array["date"]; ?></td></tr>

    <tr><td valign="top">Title:</td><td><?php echo $array["title"]; ?></td></tr>

    <tr><td valign="top">Text:</td><td><?php echo $array["text"]; ?></td></tr>

    </table>

    <?php else : ?>

    <p>Sorry, id <?b<? <b><?php echo $id; ?></b> was not found.</p>

    <?php endif; ?>

    ```


    This code checks to see whether a record was found. If so, a table is built displaying
    the date, title, and text values for that entry, each of which is stored in the
    variable $array. If the record was not found, the user is told, sorry, better
    luck next time.


