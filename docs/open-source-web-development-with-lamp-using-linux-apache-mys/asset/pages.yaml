- img_proc: true
  md: '# CHAPTER 6 Website META Language


    ```

    <navbar:button id-contents url=contents/ txt="Contents"

    img=nv_contents_.gif

    <navbar:button id-foreword url=foreword/ txt="Foreword"

    img=nv_foreword_.gif

    <navbar:button id-reviews url=reviews/ txt="Reviews"

    img=nv_reviews_.gif

    <navbar:button id-authors url=authors/ txt="Authors"

    img=nv_authors_.gif


    # bar footer

    <navbar:footer>This is the Footer</navbar:footer>

    </navbar:define>

    ```


    In the navigation bar definition, there are several obvious attributes: name is
    the name of the navigation bar, imgbase is the base URI for the image locations,
    and url is the starting point for the URLs for the buttons. The other attribute,
    imgstar, might not be so obvious. It is a string of three values, each separated
    by a colon: The first part is the suffix for the image displayed normally (no
    mouse over the item). The second is the suffix of the image to be displayed when
    a mouse hovers over the button. The third is the suffix of the image displayed
    when it is selected (being clicked by the mouse).⁴


    For instance, if the image is called foo.gif, the first part of imgstar, the empty
    string, is the suffix of the image, so the result is foo.gif. When the image is
    hovered over, foo_on.gif is displayed (because _on is the second part of imgstar).
    When the button is clicked, the client sees foo.gif (because _on is the third
    part of imgstar).


    The next is <navbar:header>, which defines a header for the collection of buttons.
    The next comes <navbar:prolog>, <navbar:footer>, the footer text.


    The tag <navbar:prolog>, which is not used in this example, enables the navigation
    bar to have HTML that comes before each button, <navbar:epilog>, which is used,
    enables the navigation bar to have HTML that comes after each button.


    Then each button is defined, given an id, url, and txt, which are displayed in
    the browser status bar they are hovered over, and img, which uses imgstar because
    it has the asterisk, or star character, in the names.


    > All this is moot if the browser is Lynx or something, and you should design
    your web site that there are reasonable defaults for using such text-based browsers.
    Aside from old-fashioned geeks like us who use Lynx, the visually impaired use
    text-based browsers as the input for word-to-speech programs. And some people
    just like to turn off JavaScript and images because they are on a slow connection.'
