  md: 'Not so good, eh? Having an error occur by default is bad behavior. This error
    can be prevented by providing defaults for elements that may not be supplied by
    the browser. Providing defaults may not be necessary in all instances, but it''s
    usually good practice to think about the consequences of incorrectly posted data.
    Here''s an example:


    ```

    <args>

    $city

    $phone => `847-555-1234`

    </args>

    ```


    The default is indicated by the => `847-555-1234` syntax. If the parameter named
    phone is posted to the program, that value is used; otherwise, the default 847-555-1234
    is used. So any or all of the variables declared can be made defaults within the
    `<args>` tag:


    ```

    <args>

    $name

    $address

    $city => `Chicago`

    $state => `IL`

    $zip => `60601-0001`

    $phone => `847-555-1234`

    </args>

    ```


    This example provides defaults for the last four variables. The default values
    are overridden when the values for those parameter names are posted.


    Now we have the basics of Mason—embedding Perl code into our pages and retrieving
    the posted form data—and we can move on one of the more powerful features of Mason:
    components.


