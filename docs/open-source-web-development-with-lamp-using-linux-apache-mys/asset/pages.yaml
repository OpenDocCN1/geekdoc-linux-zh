  md: 'xxii


    Preface


    If you''ve installed Linux from a distribution, much of the documentation is likely
    sitting on your hard drive. In an ideal world, you would just read it—that''s
    what we did. Excellent resource though it is, it leaves something to be desired
    as a learning method. Much of it was written for reference, not instruction. Some
    of the documentation has not been updated along with the software. (Hey, these
    folks work for free. In any case, this is a problem to which closed-source software
    is not immune.)


    # The Old Bait and Switch


    For all our talk of being self-contained, realistically, two books that you can''t
    escape hiding by Hacking Linux Exposed and Unix System Administration Handbook—or,
    more generically, a book on security and another on system administration. These
    two are our favorites (hereafter known as HLE and USAH). Each of these subjects
    is much larger than can be covered here, and both are unavoidable (but also fun).
    Get them, read them, grok them.


    # Companion Web Site


    In this book, you are shown examples of how to do all the things we discuss on
    an active web site (www.opensourceceebook.com/) so that you can see the code and
    the results, and be pointed to additional resources. We''re striving to be self-contained,
    but we like books, and often tell you which other ones you might want to look
    at. The entire web site can also be downloaded from www.opensourceceebook.com/sourcecode.'
  merge: -1
