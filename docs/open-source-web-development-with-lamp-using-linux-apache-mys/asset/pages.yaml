  md: '# CHAPTER 8 mod.perl


    ![](img/9b05e38e58495be06a08eeb2b6906346_272_0.png)


    may need to be modified slightly if they are written "sloppily." This is because
    a "normal" CGI program has a short life span: from when it is requested to when
    it finishes executing.


    This is in contrast to a mod.perl program, which has a life span the same as the
    Apache child process. For instance, using global variables in plain-Jane CGIs
    is no big deal, once the program finishes executing, the globals go away. For
    a mod.perl CGI program using Apache::Registry, the global variables live as long
    as the Apache child process lives, which can cause serious bugs (imagine a variable''s
    value persisting from one execution of the CGI to the next, without designing
    it way).


    So, the rule of thumb is, if you use Apache::Registry, your script may need to
    be modified slightly, but it will run quicker! Or if you are lazy and don''t want
    to modify the scripts that you have (yes, we understand), see Section 8.3.3, Apache::PerRun,
    later in the chapter.


