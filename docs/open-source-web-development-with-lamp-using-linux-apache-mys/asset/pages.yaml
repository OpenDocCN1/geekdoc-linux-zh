  md: 'The output of the program will be “I am hungry for !” because $foo is undeclared
    and has no value. Perl will warn about this sort of thing if the -w flag is set,
    as it should be.


    Another alternative to this situation is to force declaration of all variables
    before use, just as in the more strict, prescriptive compiled languages. For example:


    ```

    use strict;

    ```


    With this, variables must be declared before use, and this is done with the my()
    function as follows:


    ```

    my $a;

    my $b;

    ```


    Variables can be declared and initialized at the same time:


    ```

    my $a = 5;

    my $b = 6;

    ```


    More than one variable can be declared at the same time (the parentheses are required):


    ```

    my($a, $b, $c);

    ```


    If we do a use strict; and declare the variables, the earlier food example becomes:


    ```

    use strict;

    my $food = ''pizza'';

    print "I am hungry for $foo!\n";

    ```


    > Since $foo is not declared with my(), the use of $foo returns a syntax error,
    forcing the correction of the typo before the program can execute. We recommend
    use strict;it catches many common errors, requires a more disciplined programming
    mind-set, and is in general just good practice—so the examples from this point
    on use it. However, TMTOWTDI.'
