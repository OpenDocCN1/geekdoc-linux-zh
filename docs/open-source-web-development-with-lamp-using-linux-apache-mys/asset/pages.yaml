  md: '# CHAPTER 10 Embperl (HTML :: Embperl)


    ![](img/9b05e38e58495be06a08eeb2b6906346_344_0.png)


    A First Stab at Our Embperl Project

    This is a test of the Embperl Project Take 1


    will go out, find the file in question (the embperl_template.pl file containing
    the top() and bottom() function definitions), source that file, and compile the
    functions. Then, we see escmode = 0.


    This is an important statement and deserves some discussion. When Embperl generates
    output, as with the top(), Embperl automatically generates HTML- and URL-escapes
    it. In other words, if the Embperl code generates `<hr>`, it is escaped to `&lt;hr&gt;`,
    which is displayed in the browser as the characters hr>, not as the horizontal
    rule we wanted. There are several solutions to this problem, including escaping
    the characters we don''t want to be HTML-escaped or URL-escaped with the backslash,
    as in `\hr>`. You can imagine that this could become a real drag if a whole mess
    of HTML is generated.


    The better solution is to assign escmode the value 0, which turns off this HTML-
    and URL-escape behavior. If this is turned off, when <hr> is generated, it indeed
    becomes a horizontal rule.


    But there is a drawback to using require in this manner. Before we describe the
    problem click the Reload button on the browser a couple of times to reload this
    page (so that many of the httpd processes will be read and compile the top() and
    bottom() functions).


    Modify the top() function to add more HTML. Change the definition of top() to:


    ```

    ##

