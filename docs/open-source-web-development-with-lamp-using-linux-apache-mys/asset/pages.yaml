    # 7.3 A FIRST CGI PROGRAM


    CGI using Perl is straightforward. If you can write a Perl program to print “hello,
    world!” you’re halfway there. So, to be consistent with previous first examples
    (and because we haven’t chanted the mantra in a while), let’s start with “hello,
    world!”. Change to the proper directory that contains the server’s CGI programs:


    ```

    $ cd /var/www/cgi-bin, which contains the following text:²

    ```


    ```

    #!/usr/bin/perl

    # hello.cgi


    print "Content-type: text/plain\n"

    print "\n"

    print "hello, world!";

    ```


    The program must be executable by all users:³


    ```

    $ chmod a+rx hello.cgi

    ```


    Point your browser to one of these URLs, depending on whether you are following
    the bouncing ball or not: http://localhost/cgi-bin/hello.cgi or www.opensourcewebook.com/cgi-bin/hello.cgi.
    In either of these, you should end up seeing something very similar to Figure
    7.2.


    The first line of this “hello, world!” is the usual directive telling the script
    to run Perl. Because this is a Perl script, the second line is a comment, prefixed
    with # just as in regular Perl scripts. The rest of this CGI program is simply
    a series of print() function calls.


    > ²The extension is a matter of style or we use .cgi for the CGI programs in this
    book. Another option might be the .pl extension, because the program is Perl,
    but we’ll maintain a somewhat artificial distinction between plain-Jane Perl scripts
    and CGI web scripts.

    ³Hereafter, we will assume that you will make all the following CGI programs executable
    by all'
