    Note the use of double parentheses on ((ROW, COL)). The text for the element is
    on the next line after the double-parentheses pair, as in the example:


    ```

    ((1,1))

    first - header

    ```


    ```

    (ROW, COL)

    data text

    ```


    Now notice the use of single parentheses. Again, the text to be put in this cell
    is provided on the next line. Thus in our example:


    ```

    (1,2)

    second - data

    ```


    In HTML tables, cells can be formatted with different attributes—the elements
