    # 5.2.7 The UPDATE Command


    Since the database is about people, information in it can change (people are unpredictable
    like that). although a person''s birthday is static, their age changes. To change
    the value in an existing record, we can UPDATE the table. Let''s say the fictional
    Larry Wall has turned 47:


    ```

    mysql> SELECT * FROM age.information;

    +----------+----------+----+

    | lastname | firstname | age |

    +----------+----------+----+

    | Wall     | Larry     | 46 |

    | Torvalds | Linus     | 31 |

    | Raymond | Eric      | 40 |

    +----------+----------+----+

    3 rows in set (0.00 sec)

    ```


    ```

    mysql> UPDATE age_information SET age = 47

    -> WHERE lastname = ''Wall'';

    Query OK, 1 row affected (0.00 sec)

    Rows matched: 1 Changed: 1 Warnings: 0

    ```


    ```

    mysql> SELECT * FROM age_information;

    +----------+----------+----+

    | lastname | firstname | age |

    +----------+----------+----+

    | Wall     | Larry     | 47 |

    | Torvalds | Linus     | 31 |

    | Raymond | Eric      | 40 |

    +----------+----------+----+

    3 rows in set (0.00 sec)

    ```


    Be sure to use that WHERE clause; otherwise, if we had only entered UPDATE age_information
    SET age = 47, all the records in the database would have been given the age of
    47!'
