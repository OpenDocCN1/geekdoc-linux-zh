- img_proc: true
  md: '# CHAPTER 7 The Common Gateway Interface 201


    Like HTML commands, the shortcuts can be nested inside one another:


    <P>Here is some <B>bold</B> text</P>


    The previous statement can be programmed in CGI.pm as


    print p(`Here is some `, `bold()`, ` text`);


    We can use one example to show many of these methods. The following program uses
    these shortcuts and others as well as a Perl built-function (localtime()) and
    a CGI.pm method (server_name()). In the end, with all this fancy Perl programming,
    this program creates the same web page created in the earlier example (see Figure
    7.5) but in a much more flexible way:


    ```

    #!/usr/bin/perl

    # info3.cgi


    use strict;


    use CGI:`standard`;


    my $host = server_name();

    my $date = localtime();


    header(

    start_html(-title => ''System Information'',

    -bgcolor => ''#520063'',

    -text => ''#ffffff''),


    h1("Hello from $host!"),

    "The current time is now: $date",

    end_html());

    ```


    CGI.pm is used, the program gets the local time and the host-name, in the earlier
    example. The server_name() function, provided by CGI.pm, returns the name of the
    webserver. The localtime() function is a Perl built-in function that determines
    the local time on the machine; when assigned to a scalar, $date, it returns the
    time in a nice, readable format. After these dynamic values are obtained, the
    HTML is printed, using the just-obtained values of $host and $date.'
