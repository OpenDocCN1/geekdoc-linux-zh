  md: '64 PART I Structural


    One must take care with quotes and scalar variables in Perl.


    First, there is a difference between a tick (\`) and a backtick (`), and a double
    quote ("). Mostly, we use ticks and double quotes—the backtick has a special purpose
    in Perl, which we will talk about later. To show how these affect scalar variables
    within quotes, you should assume that $name has a value:


    $name = ''Larry Wall'';


    Because scalar variables are replaced with their values within double-quoted strings,
    the string "Hello $name!" Hello, Larry Wall! If the $name is escaped with the
    backslash, "Hello \name!", the value is Hello $name!. Single quotes do not replace
    the variable with its value, so ''Hello $name!'' has the value Hello $name!.


    # Array Variables


    An array is an ordered collection of scalars. Array names begin with the @character:


    ```

    @data = (''Joe'', 39, "Test data", 49.3);

    ```


    Like scalars, @data can be declared with my(), as in:


    ```

    my @data = (''Joe'', 39, "Test data", 49.3);

    ```


    The data in this array includes strings, an integer, and a floating number. Unlike
    many languages, Perl allows the scalars in an array to have different types (they
    are all really the same data type: scalars). This example shows printing an array
    variable:


    ```

    #!/usr/bin/perl

    # file: array1.pl


    use strict;


    @data = (''Joe'', 39, "Test data", 49.3);


    print "Within double quotes: @data\n";nprint "Outside any quotes: ", @data, "\n";nprint
    "Within single quotes: @data", "\n";

    ```


    This is what prints:


    ```

    $ ./array1.pl

    Within double quotes: Joe 39 Test data 493

    ```'
