  md: "# 402\n\n# PART IV Embedded\n\n```\nfunction no_default_args($sa, $sb, $sc)\
    \ {\n  echo \"<hr>\";\n  echo \"no_default_args(): \\$sa : $sa <br>\";\n  echo\
    \ \"no_default_args(): \\$sb : $sb <br>\";\n  echo \"no_default_args(): \\$c :\
    \ $sc <br>\";\n}\n```\n\nThis function is called no_default_args solely because\
    \ it does not have default argument values. It accepts three arguments: $sa, $sb,\
    \ and $sc. It then prints an <hr> tag, followed by the value of the three variables.\
    \ As all variables within a function, the three variables in this function are\
    \ by default locally scoped.\n\nTo call this function, simply put the arguments\
    \ within the parentheses:\nno_default_args(\"foo\", $variable_name, 4.9485);\n\
    \nIf this function was called with fewer than three arguments, a warning message\
    \ would be displayed, and the function would execute with the variables that were\
    \ not passed a value given the value of the empty string. If this function were\
    \ called with more than three arguments, the extra arguments would be ignored.\n\
    \nThis invites the question, \"Can a function be written so that the arguments\
    \ are given default values if values are not provided?\" The answer is, of course.\
    \ In this sort of application, in which unknown users will be passing information\
    \ into your system, all values should have default, sane values.\n\nTo provide\
    \ default arguments to a function, simply assign the variable within the parentheses\
    \ in the function definition:\nfunction default_args($sa = 2, $sb = 4, $sc = 6)\
    \ {\n  echo \"<hr>\";\n  echo \"default_args(): \\$sa : $sa <br>\";\n  echo \"\
    default_args(): \\$sb : $sb <br>\";\n  echo \"default_args(): \\$sc : $sc <br>\"\
    ;\n}\n\nIn this function, $sa accepts the value of the argument passed to it,\
    \ or defaults to 2 if no value is given. If the function is called as:\n\n```\n\
    default_args(\"foo\", \"bar\", 10.4985);\n```\n\n> ^7Perhaps you saw this coming,\
    \ given the name of the last example: no_default_args()."
