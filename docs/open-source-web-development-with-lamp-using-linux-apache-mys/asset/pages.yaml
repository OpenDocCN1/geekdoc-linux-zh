    PART II Static


    # 6.1.1 A Note about Apache and This Chapter


    Our web site, www.opensourcewebbook.com/, serves up the WML examples in this chapter.
    The examples are stored in files named with the .wml extension. For you to read
    the WML sources properly, Apache must be configured to serve these types of files
    as plain text, so, as root, we added the following line to /etc/httpd/httpd.conf:


    AddType text/plain .wml


    You probably do not want to make your WML source files available for general perusal,
    just out of general paranoia. You can add the following Files directive to the
    bottom of the Apache configuration file (/etc/httpd/httpd.conf) to deny access
    to these files. For all files that end in .wml, deny access from all clients.


    ```

    <Files ~ ".wml">

    Order allow,deny

    Deny from all

    </Files>

    ```


    If you modified Apache''s configuration file, be sure to restart httpd:


    # /etc/init.d/httpd graceful


