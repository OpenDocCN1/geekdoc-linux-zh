  md: '# 44 PART I Structural


    # Disallow Symbolic Links


    Allowing symbolic links from within your web document tree to other directories
    can cause content control problems. We suggest that you do not allow symbolic
    links unless you have to.^9 To disallow symbolic links, be sure that the Options
    directive do not include FollowSymLinks.


    # Do Not Allow Directory Indexes


    If you add Indexes to the Options directive, clients can access directory listings
    if they type in a directory with no index.html—for example, www.example.com/directory/.
    This is generally a bad idea because it lets people look at the directory structure,
    perhaps to see files that you didn''t serve up—old, versions, backups. Better
    to let them see only the files that you decided to serve via the web page. Be
    sure Indexes is not part of your Options directive.


    # Don''t Be a Proxy Unless You Want to Be


    If you don''t want to be a proxy server (if you don''t know this means, you don''t
    want to be a proxy server), make sure the following sections are commented out:


    ```

    #LoadModule proxy_module modules/libproxy.so


    and:


    #AddModule mod_proxy.c


    and:


    #<IfModule mod_proxy.c>

    # ProxyRequests On

    #<Directory proxy:

    # Order deny,allow

    # Deny from all

    # Allow from .your_domain.com

    #</Directory>


    # Enable/disable the handling of HTTP/1.1 "Via:" headers.

    ```


    > ^9Symbolic links are good for making large files instead of having multiple
    copies, but because J. Random Luser could make a link to a sensitive file—for
    instance, /etc/passwd. Disk space is cheap. Make copies.'
