    # 6.4.1 Varying the Template Files


    Although all this is static HTML, not every page will have the same title.

    WML allows you to pass parameters to the files:

    #include "head.wml" title="Just Say Hello"

    Then, in the WML file head1.wml, the value passed is available as $(title) (these
    WML variables look just like those in a shell program). Those parentheses are
    important. It is $(title), not $title.

    The new header file using the passed parameter is /var/www/html/wml/head2.wml.
    Between the <title> tags value of $(title) is evaluated. In this example, the
    background color is also passed into the file through $(bgcolor).


    ```

    <html>

    <head>

    <title>$(title)</title>

    </head>

    <body bgcolor=$(bgcolor:-\#ffffff")

    ```'
