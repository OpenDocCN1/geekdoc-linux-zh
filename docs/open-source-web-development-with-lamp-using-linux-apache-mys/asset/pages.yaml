    right rails, etc., look the same on every page:


    ```

    #include "header.wml"

    #include "banner.wml"

    ```


    WML makes an important distinction between single and double

    quotes. Single quotes mean that the file is loaded from the current working

    directory only, which can be used to force the loading of the local file. If

    double quotes are used, WML searches for the file in all the directories

    lafter the -I option (include). By default, the current working direc-

    tory is searched first. Next, if the file is not found, directories are searched

    in the order specified by the -I option, and the first filename

    is used. In the previous example, if there is a banner.wml in the current

    working directory, it is the one used.


    Let’s start with a simple example that includes a header and a footer.

    Just for a change, the body of the file prints “hello, world!” The header file'
