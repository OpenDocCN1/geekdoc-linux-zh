    WML source files are named with a .wml extension (e.g., example.wml). These files
    are not HTML but the WML code that is used to generate the HTML that the browser
    interprets. To create the HTML from the wml code, use the WML make program wmk.


    ```

    $ wmk example.wml

    wml -n -o example.html example.wml

