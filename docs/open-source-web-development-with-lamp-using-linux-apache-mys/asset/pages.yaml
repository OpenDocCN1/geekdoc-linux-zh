  md: "# 310\n\n# PART IV Embedded\n\n```\nsub top {\n  return <<EOHTML;\n<html>\n\
    <head>\n<title>Emperl Project Take 1</title>\n</head>\n<body bgcolor=\"ffffff\"\
    >\n<h1>A First Stab at Our Emper Project/</h1>\nHere is some text followed by\
    \ a horizontal\n<hr>\nEOHTML\n\n```\n\nWe simply added some text followed by a\
    \ <hr> tag. Reload taki.html, then reload several more times. Chances are that\
    \ sometimes you will see the new HTML, and sometimes the old. Why?\n\nWhen new\
    \ http processes started, they compile the new definition. But the existing http\
    \ processes do not recompile them, Emperl has cached the compiled code. Emperl\
    \ recompiles the Perl code if the Emperl file (take1.html) has changed, but in\
    \ our case it hasn't—only the template file embed_template.pl has changed. Moreover,\
    \ once the Apache child process has compiled embed_template.pl, it won't recompile\
    \ even if its contents change—the only file that is compiled is the page that\
    \ requested (in our example, taki.html), not the pages that require. Remember,\
    \ because this speeds up execution time, this is one of the advantages of Emperl!\n\
    \nHow do force the existing versions of httpd to recompile the changed functions?\
    \ Reload Apache. This is not ideal, because one has to be root to reload, which\
    \ makes it a pain during code development.\n\nTo prove this actually solves the\
    \ problem, reload Apache (as root, of course):\n\n```\n# /etc/init.d/httpd graceful\n\
    ```\n\nNow, reload the page as many times as you like, and you will see the new\
    \ content on all the pages. All the versions of httpd have the new definition\
    \ of top().\n\n# Method 6: Use HTML :EmperlObject\n\nThere's a more powerful way\
    \ to build a web site with Emperl HTML::EmperlObject, aka EmperlObject. This Perl\
    \ module allows the creation of templates for the entire web site or for portions\
    \ thereof,"
  merge: -1
