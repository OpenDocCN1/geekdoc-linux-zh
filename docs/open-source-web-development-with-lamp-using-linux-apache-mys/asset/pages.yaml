  md: 'xxviii


    Introduction


    # 1.1 THE BEST OF ALL POSSIBLE WORLDS...


    Using free Open Source programs, a web site can be created for the truly amazing
    price of $0.00—zero, nada, zilch.³ You can download Linux, Apache, MySQL and Perl/PHP
    to develop world-class, powerful, and use-ful sites—thus the acronym, and the
    LAMP that will light up our way. Of course, you could spend as much money as you
    like and get a web site running with commercial software, but we think there are
    good reasons, aside from initial and going expenses, to use free Open Source solutions.

    One common criticism of Open Source as a solution is it''s only free if your time
    isn''t worth anything. This is true in one sense, but not in another. All software—free
    or commercial, Open Source or closed—takes time and effort to learn and to apply.

    The following are several reasons this book should be a valuable resource as you
    turn to Open Source software:


    +   - It distills the essential knowledge needed to create a good, secure, standards-compliant,
    Open Source web site in one place.

    - It provides alternatives to commercial solutions.

    - It documents widely used Open Source programs.

    - It shares the fun we''ve had using Open Source software.


    # 1.2 OPEN SOURCE SOFTWARE


    First, what is Open Source? What does that mean? Open Source means that, unlike
    most of the software you might buy shrink-wrapped down at Bob''s Computer Hut,
    you have access to the raw source code—the human-readable C, C++, Perl, etc.—files
    that get compiled down into the binary that is executed by the computer. This
    executable binary—.exe is all you get from closed-source proprietary solutions.
    Should you so desire, you can view the files to see why that darn error message
    keeps popping up, or how to make that widget default to a different directory,
    or how to add a new function. Once you start looking at the source, you''ve started
    down the path of becoming an Open Source programmer. That''s the beauty of Open
    Source.


    ³Well, no cash outlay and a bunch of mental elbow grease, anyway; and, of course,
    there are obvious issues to take up with your ISP should your web site become
    popular.'
  merge: -1
