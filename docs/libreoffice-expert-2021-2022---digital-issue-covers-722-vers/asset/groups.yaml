    workspace (center), where you can create and manipulate objects. To the left of
    the workspace, the new pane shows thumbnails of all created pages. On the left,
    the toolbar contains all necessary tools for object creation. And on the right,
    the Properties sidebar allows selected object''s attributes. You will need both
    the toolbar and the Properties sidebar to use freely


