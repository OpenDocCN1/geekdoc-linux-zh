    但如果你想创建更多样式，包括创建属于你自己的样式！那么，侧边栏派上什么用呢？如果你按照描述打开它（或前往“视图 | 侧边栏”），并点击右侧的样式图标，你将看到所有的样式。


    要创建一个新样式，通过点击侧边栏面板上的图标之一来选择样式类别（例如段落或字符），点击弹出菜单右侧的箭头。你会发现你的新样式已链接到


