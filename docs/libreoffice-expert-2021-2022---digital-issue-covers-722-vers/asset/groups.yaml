    When software is forced to adapt its format to a product that is not based on
    open standards, the dominant vendor can use this power to influence the market.
    The often dominant product becomes de facto standard that has never been vetted
    or is merely adopted by the market out of necessity. Any flaws in the product
    are exposed to the whole industry. For instance, the 40-year-old “leaf year bug,”
    which was inherited from VisiCalc and Lotus 1-2-3 as Excel, caused the market-led


    spreadsheets to represent the year 1900 as a leap year, which can cause errors
    for applications that count days or measure time ranges. Developers of other office
    suites had to replicate the bug for compatibility. According to Microsoft, the
    faulty state has to be maintained, even across new releases of the product, because
    fixing it caused too many problems. So users are encouraged to keep their spreadsheets,
