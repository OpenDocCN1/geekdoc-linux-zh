    With LibreOffice Draw, you can create attractive and informative vector-based
    drawings. By Thomas Krumbein


    LibreOffice Draw [1], a free vector-based mathematical program, helps you create
    anything from the simplest sketch to a complex diagram. Draw''s foundation is
    the page, which begins as an empty workspace, and you create your drawing by putting
    objects on that page. In contrast to LibreOffice Calc (an electronic spreadsheet),
    Draw''s page offers more freedom.


    Draw''s objects are vector graphics, which use lines and curves defined by mathematical
    vectors. Vectors describe lines, ellipses, and polygons bounded by their geometry.
    Vector graphics allow you to stretch, turn, or scale your objects without loss
    of information.


    All objects have individual properties. To manipulate an object''s property, you
    first create and place the object within the page borders. Once placed, you can
    move the objects within these borders.


    Draw documents contain several pages, each with different layers and each layer
    containing different objects. As a result, final Draw document can be a complex
    creation, but it is a compilation of simple objects.


    When you have created a graph with Draw, you can use it in other LibreOffice applications
    without suffering loss. When it comes time to rework or modify your graphic, you
    don''t need to go back to the original Draw document. Instead, you can edit your
    drawing directly in the current LibreOffice application (Writer, Calc, or Impress)
    using the same tools originally provided in Draw. You can also insert objects
    as tables, charts, and formulae, in created other LibreOffice Draw document.


