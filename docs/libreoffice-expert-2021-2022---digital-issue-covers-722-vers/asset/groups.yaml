    \ basics under your belt, you'll move on to a few advanced features: workspace\
    \ views, master slides, and the Presenter Console.\n\nFigure 3: Use the sidebar\
    \ to create appropriate layouts for the text, with extra boxes for text and/or\
    \ images.\n\nFigure 4: Impress provides a wide range of background options for\
    \ shapes - such as solid colors, gradients, and bitmaps.\n\n# ## WORKSPACE VIEWS\n\
    \nUnder the Menu, you'll find various options - each of them is designed to ensure\
