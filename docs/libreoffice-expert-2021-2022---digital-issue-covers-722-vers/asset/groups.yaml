    \ document, the macro simply inserts the Doc-Path value into a string, which is\
    \ then pushed to the shell:\n\n```basic\nPutCommand=\"upload/\" & FileName & \"\
    \ /\" & DocPath\nShell(\"aws put\", 1, PutCommand)\n```\n\nThat's all there is\
    \ to it. You can see the entire macro in all by Listing 2. Although the macro\
    \ does its job, a few features can be improved. For example, the name of the bucket\
    \ is specified in the macro, which makes it less flexible. If you want to use\
    \ different buckets for different LibreOffice documents, you might want to tweak\
    \ the macro so it uses the InputBox to display an input box where you enter the\
    \ name of the bucket:\n\n### LIST 3: Timestamping a File Name\n\n```basic\n01\
    \ Timestamp(Year(Now), \"0000\") & \n02 Format(Month(Now), \"00\") & \"-\" & \n\
    03 Format(Day(Now), \"00\") & \"-\" & \n04 Format(Hour(Time), \"00\") & \"-\"\
    \ & \n05 Format(Minute(Time), \"00\") & \"-\" & \n06 Format(Second(Time), \"00\"\
    ) & \"\"\n07 BucketName=InputBox(\"Enter bucket name\", \"Bucket name\")\n08 PutCommand=BucketName\
    \ & \" /\" & Timestamp & FileName & \" \" & DocPath\n```\n\n```basic\nBucketName=InputBox(\"\
    Enter bucket name\", \"Bucket name\")\nPutCommand=BucketName & \" /\" & Timestamp\
    \ & FileName\nFileName & \" \" & DocPath\n```\n\n### LIST 4: Shortening a URL\n\
    \n```basic\n01 ShortenedURL()\n02 ThisDoc=ThisComponent\n03 ThisText=Doc.Text\n\
    04 SelectedURL=ThisDoc.CurrentController.getView\n05 LongURL=SelectedURL.String\n\
    06 If LongURL=\"\" Then \n07 MsgBox(\"Select URL first.\", 16, \"Error!\")\n08\
    \ End If\n09 FileName=FileNew\n10 Open(\"http://api.php?url=\" & LongURL) As FileName\n\
    11 While Not EOF(FileName)\n12 Line=Input(FileName)\n13 If Line<> Then\n14 StringBuffer=Line\n\
    15 End If\n16 Close FileName\n17 ShortURL=StringBuffer\n18 End Sub\n```\n\nIf\
    \ you want to keep multiple backup of the current document, you can modify the\
    \ macro so it attaches a timestamp to the file name (Listing 3). The code generates\
    \ a timestamp in yyyymdd-mmss format and returns it to the file name.\n\n### SHORTENING\
    \ URLs\nWorking with long URLs can be a real menace. One way to fix this problem\
    \ is to shorten URLs. However, instead of converting long URLs with shorts you\
    \ can create a macro that does this job (Listing 4). To perform URL shortening,\
    \ the macro uses an HTTP-based API. The macro first gets the currently selected\
    \ text fragment containing a long URL and turns it into a string. A simple conditional\
    \ statement checks whether a selection has made, and it displays an error message\
    \ if it aborts the selection and is supported by several Linux editors. However,\
    \ if you use LibreOffice Writer as your preferred writing tool, you can easily\
    \ create LibreOffice Markdown macro that converts Unicode to Markdown-formatted\
    \ files. The macro itself roughly divided into two parts. The first part parses\
    \ the text and marks headings, text, and URLs. The second part handles the file\
    \ name and saves it as plain text with the .md extension. To shorten the URL returned\
    \ by the API call, the macro uses a simple trick: it then reads the first line\
    \ of the file and assigns its value to StringBuffer variable, which replaces the\
    \ long URL with the shortened one obtained. The macro in List 5 can handle headings,\
    \ bold, and italics. To perform this operation, the macro relies on three functions:\
    \ MarkupHeadings finds headings in the current document, MarkupText searches for\
    \ text, bold, and italics, and MarkupFunc finds hyperlinks in the document. Thanks\
    \ to its modular structure, you can easily adapt the macro for other formats.\
    \ All you have to do is replace start and end tags in the main part of the document\
    \ and the MarkupFunc function (4-8). For example, if you want to apply HTML formatting,\
    \ the relevant lines of the macro and the function should look like the code in\
    \ List 6.\n\n### MARKDOWN FORMATTING\nMarkdown is a lightweight format for users\
    \ and developers alike,\n\n### List 5: Markdown Formatting Macro\n\n| | |\n|---|---|\n\
    | 01 Sub Markdown() | 33 End |\n| 02 Dim Arg() As New com.sun.star.beans.Property\
    \ | 34 Wend |\n| 03 ThisDoc.Component | 35 Wend |\n| 04 MarkupHeadings(\"Heading\
    \ 1\", \"# \") | 36 Function |\n| 05 MarkupHeadings(\"Heading 2\", \"## \") |\
    \ 37 |\n| 06 MarkupHeadings(\"Heading 3\", \"### \") | 38 MarkupTextFunc(SearchAttr,AllAttr,ReplaceStr)\
    \ |\n| 07 MarkupText(\"Charset\", com.sun.star.Font.) | 39 Dim SearchAttribute()\
    \ |\n| 08 MarkupText(\"Character\", com.sun.star.Font.) | 40 As New com.sun.star.beans.Property\
    \ |\n| 09 MarkupItalic() | 41 SearchAttributes(0).Name=SearchAttrName |\n| 10\
    \ If (GlobalScope.Basics.isLibraryLoaded(\"Tools\")) | 42 SearchAttributes(0).Value=SearchValue\
    \ |\n| 11 GlobalScope.Library.LoadLibrary(\"Tools\") | 43 ReplaceDoc(ThisDoc,ReplaceDescriptor\
    \ |\n| 12 End | 44 ReplaceAll.SearchRegularExpression=true |\n| 13 ThisDoc.getURL()\
    \ | 45 ReplaceAll.SearchStyles=false |\n| 14 DocDir.DirectoryNameof(DocPath.URL(),\"\
    /\") | 46 ReplaceAll(all) |\n| 15 FileName=Left(DocPath.URL(),0,Len(DocPath.URL())-6)\
    \ | 47 SetAttributes(SearchAttributes) |\n| 16 Args(\"Name\")=\"Text\" | 48 ReplaceAll(SearchString=\"\
    \\*\") |\n| 17 Args(0).Value=Text | 49 ReplaceAll(ReplaceString,ReplaceObj) |\n\
    | 18 TextFilePath.ConvertToURL(DocURL,\"file://\" & FileName & \".md\") | 50 ThisDoc.replace(Replace)\
    \ |\n| 19 StoreDoc.StoreURL(TextFilePath,Args) | 51 End |\n| 20 End Sub | 52 |\n\
    | 21 Function MarkupHeadings(StyleName, StartTag, EndTag) | 53 MarkupURLFunc |\n\
    | 22 ThisDoc.Component | 54 |\n| 23 Text-ThisDoc.text | 55 |\n| 24 Para-Text.createEnumeration\
    \ | 56 |\n| 25 While Paragraph.hasMoreElements | 57 |\n| 26 Para-Paragraph.nextElement\
    \ | 58 |\n| 27 PortionEnum=Para.createEnumeration | 59 |\n| 28 While Paragraph.hasMoreElements\
    \ | 60 |\n| 29 While Paragraph.nextElement | 61 If Paragraph.HyperLink=\"< >\"\
    \ then |\n| 30 Portion.paragraphName=StyleName then | 62 String.String=\"*\" +\
    \ Paragraph.String + \"*\" |\n| 31 If.paragraphName=StyleName | 63 End |\n| 32\
    \ StartTag=Paragraph.String + EndTag | 64 End |\n| 33 | 65 Wend |\n| 34 | 66 Wend\
    \ |\n| 35 | 67 End Sub |\n"
