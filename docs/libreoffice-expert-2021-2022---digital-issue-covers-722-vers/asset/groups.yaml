    LibreOffice 是一个全球性项目。LibreOffice 的许多功能由在 LibreOffice 生态系统中工作的认证开发者实现，例如 Collabora、altolib
    和红帽公司（Red Hat）。这些公司使用并基于 LibreOffice 制作产品，并提供该套件的长期支持版本。当这些公司对 LibreOffice 进行改进时，得益开源许可证，他们也会向社区做出贡献。


    虽然大部分编程“脏力活”是由这些开发者完成的，但在更广泛的社区中还有数百人从事其他方面：本地化（翻译用户界面）、设计、文档编写、处理 Bug 等等。每个人都参与了社区（比你想象的要多），并帮助改进
    LibreOffice 以及持续构建。


    LibreOffice 社区最大的活动是世界大会，近年来该大会在西班牙、阿尔巴尼亚、捷克等等地举行。2020 年和 2021 年由于疫情影响，会议必须转为线上，但它仍然成功吸引了数百人来展示他们的工作成果并享受其中时光！


    那么，社区在过去的几年里做了了什么来让 LibreOffice 保持蓬勃发展？显然，由于上述疫情，面对面的会议变得困难，但请继续阅读以了解过去几年的活动，并看看你可以如何参与。


    ## 中部库尔德语


    2021 年，LibreOffice 增加了对中部库尔德语的支持，Jivitar Ali（见本文中的他的采访）提供了该软件套件用户界面（UI）的实时翻译。此外，还创建了一个
    Telegram 群，供社区成员讨论即将开展的项目并吸引负责翻译字符串的新志愿者。一年来，中部库尔德语团队努力在 2021 年底完成所有翻译，并为该语言提供了临时词典。


