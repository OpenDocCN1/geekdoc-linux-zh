    ## 开放文档格式 (Open Document Format)


    | 文件类型 | 扩展名 |

    | --- | --- |

    | 文本 | .odt |

    | 电子表格 | .ods |

    | 演示文 | .odp |

    | 绘图 | .odg |

    | 图表 | .odc |

    | 公式 | .ods |

    | 图像 | .svg |

    | 数据库 | .odb |


    ## 标准与伪标准


    当软件被迫将其格式去适应一个未基于开放标准的适应时，主导供应商可以利用这种权力影响市场。通常占据主导地位的产品变成了事实上的标准，而这些标准从未经过审核，或者仅仅是由于需要而被市场采纳的。该产品中的任何缺陷都会暴露给整个行业。例如，拥有
    40 年历史的“闰年漏洞”，该 bug 是从 VisiCalc 和 Lotus 1-2-3 继承到 Excel 中的，它导致市场主导的电子表格将 1900
    年表示为闰年，这会导致计算日期或测量时间范围的应用程序出现错误。其他办公套件的开发者为了兼容，不得不复制这个漏洞。根据微软的说法，这种错误状态必须维护，即使在产品的新版本中也是如此，因为修复它会导致太多的问题。因此，用户被鼓励保留他们的电子表格，尽管支付了软件许可的用户的需求，但这保护了他们的利益。


    ## ODF 简史


    讨论 ODF 标准的首次会议于 2002 年 12 月 16 日举行。


    ODF 1.0 于 2005 年 5 月 1 日发布，并于 2005 年 11 月 16 日提交给 ISO/IEC 技术委员会 (JTC 1)。在公开可用规范
    (PAS) 审查期间，2006 年 5 月 3 日，OpenDocument 在 JTC 1 (ISO/IEC JTC/34) 中通过了为期六月的国际草案标准
    (IDS) 投票，并有广泛参与，随后以 ISO/IEC 26300:2006 的名称“批准发布为 ISO 和 IEC 国际标准”。ODF 1.2 已于 2015
    年 6 月 17 日批准为 ISO/IEC 26300-2015，其创建过程涉及其中。在过程结束时，文件必须保持其完整性和特性，最重要的是——这些特性是独立于应用程序保留的。


    ODF 并不是办公生产力套件所需的各种类型格式的集合。请参见表 1 的 ODF 类型和扩展名列表。


    ## 忙得没时间浏览？


    我们的 ADMIN 网站提供了您在 2019 年纸质杂志中看不到的额外新闻和技术文章。


    立即订阅以获取我们的免费 ADMIN Update 通讯邮件，并接收：


