    bit.ly/HPC-ADMIN-Update


    ## ODF 的未来


    在一个大多数文档以数字格式交换的世界里，开放标准应该是学校和所有教育机构的重中之重。政府需要在教育和公共部门采纳开放标准方面采取更积极的角色。软件组织正在尽一切努力填补这一空白，但开放标准的空白需要积极的努力。文档基金会
    (Document Foundation) 在其他自由软件产品、公司和社区的支持下，重新启动了 ODF 采用委员会 (2)。对开放标准的持续投资将帮助用户和开发者解决多样性、互操作性和效率问题。


    开放文档格式 1.3 已由 OASIS 委员会于 2020 年 1 月 21 日批准，并将于 6 月作为完整的 OASIS 标准支持其新功能，以及基于 OpenPGP
    的加密，外在更改跟踪等领域进行了改进，增加了辅助访问功能、基于 RDF 的元数据、基于 OpenXML 的电子表格公式（用于数字签名）以及公众建议的功能。


    我们正引领在公共领域采用 ODF，其他政府也在探索中。


