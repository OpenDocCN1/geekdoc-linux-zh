- md: "\n## GET PRODUIVE\n\n## Libre Macros\n\n### BASE DATABASES\nThe Base application\
    \ lets you create advanced databases for storing all kinds of data, and LibreOffice\
    \ macros can integrate databases with LibreOffice applications. See how this works\
    \ in practice, I'll create a simple database for text storage snippets and create\
    \ a macro that saves text snippets from the current writer in the document.\n\n\
    The first order is to create a database that has a single table containing two\
    \ fields: id (INTEGER field that is the primary key), and snippet VARCHAR.\n\n\
    When creating the database, tick the Yes, register the database for check-box\
    \ the database is ready to go, you can start working on the macro (Listing 7).\n\
    \nTo establish a connection to the database, the base uses the connectDatabase\
    \ function (line 5). This approach is more flexible because it allows to establish\
    \ a connection from any macro needed. The function (lines 10-16) includes a simple\
    \ error-handler function (19) that returns the database name and displays a message\
    \ when the macro fails to establish a connection to the database (lines 28-29).\n\
    \n## LISTING 6: HTML Formatting\n\n```\n0 MarkUpingsFunc(\"Heading 1\", \"<h1>...</h1>\"\
    )\n0 MarkUpingsFunc(\"Heading 2\", \"<h2>...</h2>\")\n0 MarkUpingsFunc(\"Heading\
    \ 3\", \"<h3>...</h3>\")\n07 MarkUpTextFunc(\"CharPointer\", com.sun.star.awt.FontWeight.BOLD,\
    \ \"<b>...</b>\")\n8 MarkUpTextFunc(\"CharPointer\", com.sun.star.awt.FontItalic.ITALIC,\
    \ \"<i>...</i>\")\n      63 Portion.String = \"<a HREF=\" + Portion.HyperLink\
    \ + \">\" + \n                                     Portion.Snippet + \"</a>\"\
    ;\n```\n\n## LISTING 7: Database Table Macro\n\n```\n01 InsertSnippet()\n02 Db\
    \ As Object\n03 ThisAsThisComponent\n04 TextSnippet=Database.GetCurrentController().Selection.getByIndex(0).GetString()\n\
    05 Get()\n06 Database=ConnectToDatabase(\"snippet\")\n07 Snippet=Split(Snippet,\
    \ \", \")\n08 SQL=\"INSERT INTO \" + snippet + \" VALUES ('\" + Snippet + '\\\
    ')\"\n09 Statement=Database.CreateStatement()\n10 Result=Statement.Execute(SQLQuery)\n\
    11 Database.Close()\n12 Database.dispose()\n13 MsgBox(\"Text snippet has been\
    \ saved.\", 6, \"Result\")\n14 End\n15 \n16 Function ConnectToDatabase(DBName\
    \ As String) As Object\n17 Dim Database As Object, com.sun.star.base.PropertyValue\n\
    18 DbContext=CreateNewEmbeddedService(\"com.sun.star.db.DatabaseContext\")\n19\
    \ On Error GoTo ErrHandler\n20 DataSource=Database.GetByName(DBName)\n21 ConnectToDatabase=DataSource.Connect(\"\
    **\")\n22 DatabaseFile=String\n23 DatabasePath=DatabaseFile.URL\n24 DatabaseObject(0).Name\
    \ = \"Hidden\"\n25 DatabaseObject(0).Value = True\n26 DatabaseFile=StarDesktop.loadComponentFromURL(DatabasePath,\
    \ \"_blank\", \n                                                 0, Array())\n\
    27 Exit Function\n28 ErrHandler:\n29 MsgBox(\"Failed to establish a connection.\"\
    , 16, \"Error\")\n30 End Function\n```\n\n## FINAL WORD\n\nThese examples are\
    \ a few of the things you can do with LibreOffice. By learning several building\
    \ blocks you can easily reuse in your own projects. Of course, coding doesn't\
    \ have to stop here although LibreOffice Base is not as flexible and powerful\
    \ as many other programming languages, it can handle practically any database-related\
    \ task you throw at. Once you've mastered these basics, you can unleash the full\
    \ potential of the LibreOffice productivity suite.\n\n- [1] LibreOffice Shell\
    \ function: https://help.libreoffice.org/latest-en-us/text/basic/shared/0313050.html\n\
    - [2] S3: https://aws.amazon.com/s3/\n- [3] AWS Perl script for GitHub: https://github.com/timkay/aws\n\
    \n## CLEAR OFF YOUR BOOKSHELF WITH DIGITAL ARCHIVES\n\nComplete your collection\
    \ of Linux Magazine and ADMIN Network & Security with our Digital Archive Bundles.\n\
    \nYou get a full year of issues in PDF format to access at any time from any device.\n\
    \n![](img/732294c5ae254da1d40bd7a4d47042d7_58_0.png)\n\nhttps://bit.ly/archive-bundle\n\
    \n2021 Archives Available Now!\n\n## GET PRODUCTIVE\nDigital Signatures\n\n##\
    \ Using Digital Signatures\n\n## Secure Documents\n\n![](img/732294c5ae254da1d40bd7a4d47042d7_59_0.png)\n\
    \nBy adding a digital signature, you can boost your document's security. By Bruce\
    \ Byfield\n\ndigital signature verifies a document's trustworthiness, it guarantees\
    \ that the sender is who they claim to be, and the document has not been edited\
    \ since it was signed. Ordinary file sharing may not require one, but if privacy\
    \ is important – particularly in business or when financial matters are discussed\
    \ – then a digital signature is one of the main ways to safeguard a file's contents.\n\
    \nOriginal signature created by a third-party certificate manager, which offered\
    \ a certificate guaranteeing the document's integrity. LibreOffice continues to\
    \ use the same cryptographic method; however for digital signatures, GPG [1] is\
    \ a cross-platform method of encryption which is installed by defaults. A third-party\
    \ service refers to certificates and GPG refers to keys, both operate in a similar\
    \ manner.\n\n## SETTING UP CERTIFICATE\n\nBy adding a digital signature, you can\
    \ boost your document's security. By Bruce Byfield\n\ndigital signature verifies\
    \ a document's trustworthiness, it guarantees that the sender is who they claim\
    \ to be, and the document has not been edited since it was signed. Ordinary file\
    \ sharing may not require one, but if privacy is important – particularly in business\
    \ or when financial matters are discussed – then a digital signature is one of\
    \ the main ways to safeguard a file's contents.\n\nOriginal signature created\
    \ by a third-party certificate manager, which offered a certificate guaranteeing\
    \ the document's integrity. LibreOffice continues to use the same cryptographic\
    \ method; however for digital signatures, GPG [1] is a cross-platform method of\
    \ encryption which is installed by defaults. A third-party service refers to certificates\
    \ and GPG refers to keys, both operate in a similar manner.\n\n## USING GPG\n\n\
    GPG is a cross-platform method of encryption which is installed by defaults. A\
    \ third-party service refers to certificates and GPG refers to keys, both operate\
    \ in a similar manner.\n\nTo generate keys with GPG, you will run the command:\n\
    \n```\ngpg --full-key\n```\n\nGPG takes five steps to create a key: asking for\
    \ name and email, creating a passphrase, choosing the algorithm, and setting an\
    \ expiration date. If you are unsure about the possible choices, you can simply\
    \ accept the defaults.\n\nAs a last step, you will create a certificate so that\
    \ you can make the new key creates by using the following command:\n\n![](img/732294c5ae254da1d40bd7a4d47042d7_60_0.png)\n\
    \n```\ngpg --output YOURNAME.gpg gpg\n--export KEY-EMAIL\n```\n\nOnce the certificate\
    \ is used, you can send out the public key to the intended recipients of your\
    \ signed files\n\nor as a plain text file with the following format:\n\n```\n\
    gpg --output YOURNAME.gpg gpg\n--export KEY-EMAIL\n```\n\nFrom LibreOffice, the\
    \ key can be found from Files | Digital Signature | Digital Signature... by navigating\
    \ to the directory where it is stored.\n\nRecipients of the file who have your\
    \ public key can verify it with you using:\n\n```\nA third-party service refers\
    \ to certificates and GPG refers to keys, both operate in a similar manner.\n\n\
    To generate keys with GPG, you will run the command:\n\n```\ngpg --full-key\n\
    ```\n\n![](img/732294c5ae254da1d40bd7a4d47042d7_60_1.png)\n\nbbnanday$: gpg --full-key\n\
    gpg (GPG) 2.1.1; Copyright (2017) Free Software Foundation, Inc. This is free\
    \ software: you are free to create and redistribute it. There is NO WARRANTY,\
    \ to the extent permitted by law.\n\nPlease select what kind of key you want:\n\
    \n- (1) RSA and RSA (default)\n(2) DSA and Elgalman\n(3) DSA (sign only)\n(4)\
    \ RSA (sign only)\n(5) selection?\n"
  mdcn: "\n\n## 提高效率\n\n## Libre 宏\n\n### 基础数据库\nBase 应用程序允许你创建高级数据库来存储各种数据，而 LibreOffice\
    \ 宏可以将数据库与 LibreOffice 应用程序集成。让我们看看这在实践中是如何运作的：我将创建一个用于存储文本片段的简单数据库，并创建一个宏，用于从当前\
    \ Writer 文档中保存文本片段。\n\n首要任务是创建一个包含单个表的数据库，该表包含两个字段：id（作为主键的 INTEGER 字段）和 snippet（VARCHAR\
    \ 字段）。\n\n在创建数据库时，勾选“是，注册数据库”复选框，这样数据库就准备绪了，你可以开始编写宏（列表 7）。\n\n要建立与数据库的连接，base\
    \ 使用 `connectDatabase` 函数（第 5 行）。这种方法更灵活，因为它允许从任何需要的宏建立连接。该函数（第 10-16 行）包含一个简单的错误处理函数（19\
    \ 行），当宏无法建立到数据库连接时（第 28-29 行），它会返回数据库名称并显示消息。\n\n## 列表 6：HTML 格式\n\n```\n0 MarkUpingsFunc(\"\
    Heading 1\", \"<h1>...</h1>\")\n0 MarkUpingsFunc(\"Heading 2\", \"<h2>...</h2>\"\
    )\n0 MarkUpingsFunc(\"Heading 3\", \"<h3>...</h3>\")\n07 MarkUpTextFunc(\"CharPointer\"\
    , com.sun.star.awt.FontWeight.BOLD, \"<b>...</b>\")\n8 MarkUpTextFunc(\"CharPointer\"\
    , com.sun.star.awt.FontItalic.ITALIC, \"<i>...</i>\")\n      63 Portion.String\
    \ = \"<a HREF=\" + Portion.HyperLink + \">\" + \n                            \
    \         Portion.Snippet + \"</a>\";\n```\n\n## 列表 7：数据库表宏\n\n```\n01 InsertSnippet()\n\
    02 Db As Object\n03 ThisAsThisComponent\n04 TextSnippet=Database.GetCurrentController().Selection.getByIndex(0).GetString()\n\
    05 Get()\n06 Database=ConnectToDatabase(\"snippet\")\n07 Snippet=Split(Snippet,\
    \ \", \")\n08 SQL=\"INSERT INTO \" + snippet + \" VALUES ('\" + Snippet + '\\\
    ')\"\n09 Statement=Database.CreateStatement()\n10 Result=Statement.Execute(SQLQuery)\n\
    11 Database.Close()\n12 Database.dispose()\n13 MsgBox(\"Text snippet has been\
    \ saved.\", 6, \"Result\")\n14 End\n15 \n16 Function ConnectToDatabase(DBName\
    \ As String) As Object\n17 Dim Database As Object, com.sun.star.base.PropertyValue\n\
    18 DbContext=CreateNewEmbeddedService(\"com.sun.star.db.DatabaseContext\")\n19\
    \ On Error GoTo ErrHandler\n20 DataSource=Database.GetByName(DBName)\n21 ConnectToDatabase=DataSource.Connect(\"\
    **\")\n22 DatabaseFile=String\n23 DatabasePath=DatabaseFile.URL\n24 DatabaseObject(0).Name\
    \ = \"Hidden\"\n25 DatabaseObject(0).Value = True\n26 DatabaseFile=StarDesktop.loadComponentFromURL(DatabasePath,\
    \ \"_blank\", \n                                                 0, Array())\n\
    27 Exit Function\n28 ErrHandler:\n29 MsgBox(\"Failed to establish a connection.\"\
    , 16, \"Error\")\n30 End Function\n```\n\n## 结语\n\n这些示例是你可以使用 LibreOffice 完成的一些工作。通过学习几个构建模块，你可以轻松地在自己的项目里复用它们。当然，编程不必止于此，尽管\
    \ LibreOffice Base 没有许多其他编程语言那样灵活和强大，但它可以处理你扔给它的几乎任何数据库相关的任务。一旦你掌握了这些基础知识，就可以释放\
    \ LibreOffice 办公套件的所有潜力。\n\n- [1] LibreOffice Shell 函数: https://help.libreoffice.org/latest-en-us/text/basic/shared/0313050.html\n\
    - [2] S3: https://aws.amazon.com/s3/\n- [3] 用于 GitHub 的 AWS Perl 脚本: https://github.com/timkay/aws\n\
    \n## 使用数字存档清空你的书架\n\n通过我们的数字存档包，完善你的《Linux Magazine》和《ADMIN Network & Security》杂志收藏。\n\
    \n你将获得整年的 PDF 格式杂志，可以随时从任何设备访问。\n\n![](img/732294c5ae254da1d40bd7a4d47042d7_58_0.png)\n\
    \nhttps://bit.ly/archive-bundle\n\n2021 存档现已发布！\n\n## 提高效率\n数字签名\n\n## 使用数字签名\n\
    \n## 安全文档\n\n![](img/732294c5ae254da1d40bd7a4d47042d7_59_0.png)\n\n通过添加数字签名，你可以提高文档的安全性。作者：Bruce\
    \ Byfield\n\n数字签名验证文件的可信度，它确保发送者确实是其所称的，并且文档在签名后没有被编辑过。普通的文件共享可能不需要签名，但如果隐私很重要——特别是在商务场合或讨论财务事务时——数字签名是保护文件内容的主要方法之一。\n\
    \n原始签名由第三方证书管理器创建，该管理器提供了一个保证文档完整性的证书。LibreOffice 继续使用相同的加密方法；然而，对于数字签名，GPG [1]\
    \ 是一种默认安装的跨平台加密方法。第三方服务指的是证书，而 GPG 指密钥，两者的工作方式相似。\n\n## 设置证书\n\n通过添加数字签名，你可以提高文档的安全性。作者：Bruce\
    \ Byfield\n\n数字签名验证文件的可信度，它确保发送者确实是其所称的，并且文档在签名后没有被编辑过。普通的文件共享可能不需要签名，但如果隐私很重要——特别是在商务场合或讨论财务事务时——数字签名是保护文件内容的主要方法之一。\n\
    \n原始签名由第三方证书管理器创建，该管理器提供了一个保证文档完整性的证书。LibreOffice 继续使用相同的加密方法；然而，对于数字签名，GPG [1]\
    \ 是一种默认安装的跨平台加密方法。第三方服务指的是证书，而 GPG 指密钥，两者的工作方式相似。\n\n## 使用 GPG\n\nGPG 是一种默认安装的跨平台加密方法。第三方服务指的是证书，而\
    \ GPG 指密钥，两者的工作方式相似。\n\n要用 GPG 生成密钥，你需要运行命令：\n\n```\ngpg --full-key\n```\n\nGPG\
    \ 创建密钥需要五个步骤：请求名称和电子邮件、创建密码、选择算法以及设置有效期。如果你对可能的选择不确定，可以直接接受默认值。\n\n作为最后一步，你将使用以下命令创建一个证书：\n\
    \n![](img/732294c5ae254da1d40bd7a4d47042d7_60_0.png)\n\n```\ngpg --output YOURNAME.gpg\
    \ gpg\n--export KEY-EMAIL\n```\n\n一旦证书被使用，你可以将公钥发送给目标接收者，或者以如下格式的纯文本文件发送：\n\n\
    ```\ngpg --output YOURNAME.gpg gpg\n--export KEY-EMAIL\n```\n\n在 LibreOffice 中，可以通过“文件\
    \ | 数字签名 | 数字签名...”导航到存储目录来找到密钥。\n\n拥有你公钥的文件接收者可以使用以下方式与你一起验证：\n\n```\n第三方服务指的是证书，而\
    \ GPG 指密钥，两者的工作方式相似。\n\n要用 GPG 生成密钥，你需要运行命令：\n\n```\ngpg --full-key\n```\n\n![](img/732294c5ae254da1d40bd7a4d47042d7_60_1.png)\n\
    \nbbnanday$: gpg --full-key\ngpg (GPG) 2.1.1; Copyright (2017) Free Software Foundation,\
    \ Inc. 这是一个自由软件：你可以自由地创建和分发它。在法律允许范围内不提供担保。\n\n请选择你想要的密钥类型：\n\n- (1) RSA 和 RSA\
    \ (默认)\n(2) DSA 和 Elgalman\n(3) DSA (仅限签名)\n(4) RSA (仅限签名)\n(5) 选择？\n```\n\n"
