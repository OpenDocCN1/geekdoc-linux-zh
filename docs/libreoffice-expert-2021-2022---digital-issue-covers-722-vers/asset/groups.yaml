    # ## 入门指南


    LibreOffice Impress


    ### 创建相册


    你可以使用 Impress 根据一组图像创建相册，通常每张照片占一张。此相册可以使用带有图形和图像的多媒体源，或者将最新的布局整合到一个单一的演示文文件中。要执行此操作，首先打开一个现有的或空白的演示文，然后点击**插入
    媒体 | 图片 | 创建相册**。会弹出一个对话框；点击“添加”来选择你的图像并浏览文件系统。在操作系统中如何选择多张图像？通常是按住 Shift 或 Ctrl
    键的同时点击。


    选择好图像后，Impress 提供了一些额外选项（见图 2）。最重要的选项之一是**链接图像**，这意味着图像数据不会直接复制到演示文中，而是在查看演示文时根据需要从文件系统加载图像。这可以节省磁盘空间，因为你没有重复大量数据。但是，如果你从驱动器中删除了图像，演示文将无法显示它！完成后点击“插入幻灯片”，你就可以按照需要继续编辑和展示演示文。


    图 2：创建相册时，你可以指定每张幻灯片显示的图像数量。


    也可以点击并拖拽它们添加到你的演示文中。你还会发现许多此类幻灯片和对象可以在侧边栏中快速访问。你可以添加幻灯片并设置对象的透明度。检查图库（图 5），它位于侧边栏中，选择右侧面板从右起的第二个图标。点击它可以查看各种图像——你只需点击并将其拖过去即可。对于所有其他形状，如果你点击形状使其高亮，你将看到绿色的手柄，你可以点击并拖动它们来调整大小。


    所以，你拥有了幻灯片、布局、文本框、格式和图形——这些都是创建演示文要素。还有一点需要考虑：切换（即从一张幻灯片到另一张幻灯片的动画）。从左侧面板进行选择，然后从右侧侧边栏选择幻灯片切换器（它是从顶部开始第三个图标）。


    要更改幻灯片或文本框的背景，点击它并选择**区域**，你将看到图 4 所示的对话框。你可以使用此对话框更改演示文背景！在侧边栏的主部分，你有很多切换效果以及描述它们的小图像。请尽管探索——只需点击切换效果查看它是如何工作的。许多切换效果都有额外选项，包括持续时间（秒）和额外的声音。你还可以使用侧边栏的这部分让演示文在等待几秒后自动移动——参见“切换幻灯片”选项。在掌握基础知识后，你将进入一些高级功能：工作区视图、母幻灯片和演讲者控制台。


    图 3：使用侧边栏为文本创建适当的布局，并带有用于文本和/或图像的额外框。


    图 4：Impress 为形状提供了多种背景选项 - 如实色、渐变和位图。


    # ## 工作区视图


    在菜单下，你将找到各种选项 - 每种选项旨在确保任务的完成。例如，侧边栏是处理单个幻灯片的主要视图。使用此视图进行设计格式化并添加文本、图形和动画效果。


    然后是大纲视图，它包含按顺序编号的演示文幻灯片（图 6）。**大纲视图**显示标题、带项目符号和编号的列表，以及大纲格式的每张幻灯片的列表。默认框中包含的文本也在大纲形式显示，因此它包含了文本框或绘制对象以外的其他幻灯片；此视图中的对象将不会显示。


    备注视图允许你向幻灯片添加备注。这些备注供你参考，在展示演示文时观众不可见。同时，母版视图用于设置打印的幻灯片布局。点击侧边栏中的“属性”选项卡，你可以在“布局”部分选择每页打印一、二、三、四、六或九张幻灯片。此外，这允许你在页眉和页脚部分添加自定义字段，例如当前日期。


    # ## 母幻灯片


    首先：母幻灯片被用作其他幻灯片的模板。它类似于 Writer 中的页面样式，控制你所有所有幻灯片的基本格式。它可以有多个母幻灯片。此外，母幻灯片可以具有不同的特性，包括背景、渐变以及其他对象（如
    Logo、线条和文本）。


    图 5：通过侧边栏访问的图库提供了许多形状和文本。


    所以，你拥有了幻灯片、布局、文本框、格式和图形——这些都是创建演示文要素。还有一点需要考虑：切换（即从一张幻灯片到另一张幻灯片的动画）。


    要创建一个新的母幻灯片，点击左侧的空白区域并选择“新建母版”。对其进行修改以符合你的需求。建议也重命名此母版。在幻灯片面板中右键点击幻灯片，从菜单中选择“重命名母版”。完成母幻灯片的创建后，点击顶部工具栏上的“关闭母版视图”返回普通模式。现在你可以创建一个新幻灯片并使用该母版进行设计（见图
    8）。点击右侧面板中的“母幻灯片”图标，然后更改顶部的设计。


    图 6：使用大纲视图查看你演示文的结构。


    图 7：大纲视图显示演示文的层级。


    母幻灯片可以具有不同的特性，包括背景、渐变以及其他对象（如 Logo、线条和文本）。这些可以包括页眉和页脚。


    图 8：使用母幻灯片图标访问母模板。


    # ## 演讲者控制台


    Impress 包含了演讲者控制台功能，当你的电脑连接了额外的演示文幻灯片时可以使用。此演讲者控制台通过在电脑和幻灯片上使用不同的视图对幻灯片提供额外的控制。你在电脑上看到的视图包含了当前幻灯片、任何幻灯片和演讲者备注。注意，演讲者控制台仅在支持多显示器的操作系统上工作，且仅在连接了两个显示器时工作（例如内置显示器）。


    Linux| LibreOffice | 偏好设置 (Mac, OS)，选择左侧的 LibreOffice Imp 通用。启用演讲者控制台按钮并点击确定。现在，你可以连接外部显示器并开始演示，你应该在一个屏幕上看到主演示文，在另一个屏幕上看到演讲者控制台（见图
    9）。如果不起作用，说明第二个屏幕正在镜像第一个屏幕，你需要在操作系统中更改显示设置。


    图 9：演讲者控制台视图，显示幻灯片和备注。


