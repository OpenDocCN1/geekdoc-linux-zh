    # Dive into LibreOffice


    # Hidden Gems


    Discover hidden and lesser known features in LibreOffice to help you work faster
    and smarter (and gain extra geek points). By Mike Saunders


    ![](img/732294c5ae254da1d40bd7a4d47042d7_69_0.png)


    If you''ve been following the development of LibreOffice since it was for OpenOffice
    in 2010, you''ll know that a great deal of effort has been put into improving
    the source code. This has made the suite easier to compile, and easier for new
    contributors to get involved. Along the way, new features have been added and
    Microsoft Office compatibility has been improved, but by large, the look and feel
    haven''t changed much since then.


    That''s a good thing, of course users tend to demand value consistency and stability
    rather than shiny widgets with every release. But there are some new features
    that could take LibreOffice up a level. After you''ve got them out of the box,
    with a bit of tweaking, you can use them. In this article, I will show you some
    tips and tricks to get more out of LibreOffice, using features you may not have
    come before.


    # THE NOTEBOOKBAR


    In recent years, LibreOffice users have been looking for a "modern" user interface
    to replace the regular toolbar. However, implementing such a thing is no easy
    task. The LibreOffice community has constantly demanded various types of themes—some
    who think them want to resist and change anything, and others who want the software
    to look and feel more like Microsoft Office. What does the design team seem to
    be doing?


    That means lots of things to be considered when making large-scale changes to
    GUI, potentially breaking your workflow. In December 2016, the profile entity
    was introduced to LibreOffice, announced at TDF, the "My User Friendly Interface"
    [2]. This concept was introduced in LibreOffice 5.3 with new (but optional) user
    interfaces:


    +   * The standard layout with two toolbars at the top

    * A single toolbar to save screen space


    +   * A single toolbar with a pop-out to provide extra functionality


    +   * The new NotebookBar


    You may be thinking at this point: Why so many options? Couldn''t the design team
    just focus on one layout and make it perfect? Well, that would be one approach,
    but it risks alienating a hunk of users. The LibreOffice community has to keep
    long time users (who want to stick with what they know) satisfied, while welcoming
    new users who want a more "modern" design. The Document Foundation is financed
    by donations from end users, so it makes sense to have as many as possible, happy
    if the end result is interfaces.


    One thing to be mentioned is that the NotebookBar made its first appearance in
    LibreOffice 5.3 as an experimental feature and then rolled out for all users in
    LibreOffice 6.2. The NotebookBar was developed by the community as a way to "evolve"
    toolbars [3]. Essentially, it''s a layout that gives users the freedom to do what
    they want with it.


    To quote the design team: "With a bit of flexibility, a designer can place any
    UI element on a toolbar without a tab label to identify the group of controls,
    or even-advanced widgets like tags. We also have the ability to define dimensions
    for any toolbar, so as a virtual actor, and all together have a larger log of
    controls to choose from that can''t found in standard toolbars. Furthermore, they
    can define the main features be hidden, or whether it should have a particular
    icon or text instead."


    What''s especially interesting here is the the use of contextual groups. Some
    may contain sections of the NotebookBar are disabled when you are doing certain
    tasks. For example, you always want access to buttons for loading and saving files
    and performing undo and redo


