    ## Dive into LibreOffice


    ### Hidden Gems


    Discover hidden and lesser known features in LibreOffice to help you work faster
    and smarter (and gain extra geek points). By Mike Saunders


    ![](img/732294c5ae254da1d40bd7a4d47042d7_69_0.png)


    If you''ve been following the development of LibreOffice since it was for OpenOffice
    in 2010, you''ll know that a great deal of effort has been put into improving
    the source code. This has made the suite easier to compile, and easier for new
    contributors to get involved. Along the way, new features have been added and
    Microsoft Office compatibility has been improved, but by large, the look and feel
    haven''t changed much since then.


    That''s a good thing, of course, users tend to demand value consistency and stability
    rather than shiny widgets with every release. But there are some new features
    that could take LibreOffice up a level. After you''ve got them out of the box,
    with a bit of tweaking, you can use them. In this article, I will show you some
    tips and tricks to get more out of LibreOffice, using features you may not have
    come before.


    ## THE NOTEBOOKBAR


