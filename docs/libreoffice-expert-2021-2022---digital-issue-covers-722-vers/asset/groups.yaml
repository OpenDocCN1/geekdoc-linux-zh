    LibreOffice''s native format is the Open Document, and it saves others with .odt
    (Open Document Text). This is a fully standard format, but many other programs,
    so not the best way to work of. Of course, you may come across (or receive) documents
    in other formats. LibreOffice does a great job of opening, but those files are
    often infrequent or poorly documented chunks of data, so LibreOffice has to struggle
    with them. If Microsoft sends you a .doc or .docx file it won''t look right in
    your LibreOffice installation, try to save them in Open Document Format


    For saving, LibreOffice can export in many different formats, including the aforementioned
    .doc and .docx. Just go to File | Save As, and you will see the drop-down list.
    You can then save as HTML or text, but


    a lot of the formatting will disappear. Dispar, use File | Export, you can save
    in EPUB format for e-readers or as PDF – if you''re using a PDF that is only needed
    to be viewed or printed, but not edited. (When exporting as a PDF, you can choose
    the Hybrid version, which also embeds a copy of the original, edit for later if
    necessary).


    If you have a lot of work with Microsoft Office documents and need to save in
    to by default, go to File | Open, then select Save As on the left. Then, on the
    right-hand side, you can choose Always as to save to the default format.


    # ## CONCLUSIONS


    LibreOffice gives you tools to format your documents and make changes via the
    styles system. Not only does it allow you to maintain consistency across the document
    (and documents), it also saves you from wasting time manually aligning all paragraphs
    (or even events). For even further time, check the "Keyboard Shortcuts" box! ---


