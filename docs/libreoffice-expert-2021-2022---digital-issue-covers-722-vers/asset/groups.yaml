    \nYou can use Impress to create a photo album from a set of images, with usually\
    \ one per photo. This photo album can use multimedia sources with graphics and\
    \ images or collect the latest layout into a single presentation file. To do this,\
    \ first open an existing or blank presentation, and then **Insert Media | Photo\
    \ | Create Photo Album**. The dialog box appears; click Add to select your images\
    \ and browse your filesystem. How do you select multiple images in your operating\
    \ system? Usually by holding Shift or Ctrl keys while clicking.\n\nAfter you have\
    \ chosen your images, Impress offers some extra options (see Figure 2). One of\
    \ the most important is **Link Images**, which means image data won't be copied\
    \ directly into the presentation, but rather the images be loaded from the filesystem\
    \ on demand when you watch the presentation. save disk space, as you don't duplicate\
    \ much data. However, if you remove the image from your drive, the presentation\
    \ won't have it! Click Insert Slides when you're done, and you can continue to\
    \ edit and show the presentation as you like.\n\nFigure 2: When creating a photo\
    \ album, you can specify how many images appear on each slide.\n\nAlso click and\
    \ drag to add them to your presentation. You'll also notice that many of these\
    \ slides and objects are available in the sidebar for quick access. You can add\
    \ shows and set the transparency of objects. Check the Gallery (Figure 5), which\
    \ is located in the sidebar, select the second icon from the right-hand panel.\
