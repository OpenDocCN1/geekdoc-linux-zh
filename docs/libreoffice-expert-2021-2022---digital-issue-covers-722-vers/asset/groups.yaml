    # 公式与格式


    LibreOffice Math 软件包允许你显示简单和复杂的公式。由 Franz Böhm 和 Paul Brown 编写。


    Math 编辑器可以作为独立程序运行，也可以从其他 LibreOffice 模块调用，并将完美格式化的公式嵌入到文本文档、电子表格、演示文稿、积分、函数，甚至是整个方程组或矩阵中。


    要在独立窗口中启动 Math，点击“文件 | 新建 | 公式”。要在 Writer、Calc、Impress 或 Draw 中包含公式，选择“插入 | 对象
    | 公式”。公式将成为文档中的一个嵌入对象，你可以对其进行拖放和缩放。使用三窗格布局的 Math 编辑器非常简单。左侧是侧边栏，底部是命令面板，通常可以通过按住
    Ctrl 并双击框架来将其停靠或取消停靠。命令面板上方是预览区域，显示公式在文档中显示的样式。点击“视图 | 元素 (View | Elements)”会在小窗口中显示帮助工具，这对于初学者来说特别有用，可以更方便地输入公式。请注意，公式编辑器不执行计算。Math
    专门用于编写和显示公式。


    # 空格


