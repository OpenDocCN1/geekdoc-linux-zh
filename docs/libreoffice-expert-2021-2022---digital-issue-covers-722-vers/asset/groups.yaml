    on? Here''s an update on what''s happening in the global LibreOffice community.
    By Mike Saunders


    LibreOffice is a worldwide project. Many of LibreOffice''s features are implemented
    by certified developers who are working in the LibreOffice ecosystem such as Collabora,
    altolib, and Red Hat. These companies use and make products based on LibreOffice
    and offer long-term versions of the suite. When these companies make improvements
    to LibreOffice, they also contribute to the community, thanks to the open source
    license.


    While much of the programming "grunt work" is done by these developers, there
    are hundreds of people in the wider community who work on other aspects: localization
    (translating the user interface), design, documentation, handling bugs, and much
    more. Everyone is involved with the community (more than you might think) and
    helps to improve LibreOffice and building along.


    The biggest event in the LibreOffice community is the world conference, which
    in recent years has taken place in Spain, Albania, the Czech Republic, and others.
    For 2020 and 2021, the conference had to move online because of the pandemic,
    but it still managed to bring hundreds of people to present what they''ve been
    working on, and have fun!


    So, what has the community been doing in the past couple of years to keep LibreOffice
    going from strength to strength? Obviously, face-to-face meetings have been difficult
    because of the aforementioned pandemic, but read on to learn all about the activities
