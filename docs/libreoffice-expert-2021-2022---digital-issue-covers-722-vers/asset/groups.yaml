    TDF（文档基金会）邀请了两位社区成员 Jiwari Ali（“成功故事：Atriy box”）和 Celia Palacio（“成功故事”），分享了真实的案例，介绍你可以如何加入社区并帮助全球数百万用户改进
    LibreOffice。你还可以做很多事情，例如确认错误（bugs）、在 Ask LibreOffice 上帮助其他用户、设计团队以及维护项目基础设施。要了解更多信息，请访问
