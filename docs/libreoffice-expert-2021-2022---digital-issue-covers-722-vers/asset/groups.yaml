    Thanks to its modular structure, you can easily adapt the macro for other markup
    formats. All you have to do is replace start and end tags in the main part of
    the document and the MarkupFunc function (53-67). For example, if you want to
    apply HTML formatting, the relevant lines 4-8, 63 of the macro and the function
    should look like the code in List 6.


