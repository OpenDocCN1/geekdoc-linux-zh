    要在执行项中添加数据区域，你需要打开导航器 (9)。在打开的对话框中，右键点击“表单 (Forms)”并选择“新建 | 表单”。然后，新表单会被添加到 MainForm
    中。


    通过内容菜单打开此表单的属性。在“数据 (Data)”选项卡中，在“内容 (Content)”下拉菜单中选择。选择“循环 | 活动”尤为重要。图 10 中的其余设置确保了表单被设置为始终可编辑和更改。


