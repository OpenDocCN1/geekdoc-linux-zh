    ## 键盘快捷键


    我可以在此指南中包含一个巨大的表格，列出 Writer 中的每一个快捷键，但这已经在网上可以了 [1]。每个人都有不同的流程和工作流，因此最好的办法是找到对你最有用的功能！使用任何菜单（或右键点击）并查找条目。键盘快捷键，你应该能在右侧（图9）看到它们。如果你的操作系统默认显示这些内容，请前往“工具
    | 选项”（在 macOS 上为“LibreOffice | 偏好设置”）——然后在左侧选择“选择”，并启用右键菜单中的图标和快捷键。


    图 8：在侧边栏中，你有额外的控制控件，包括创建新样式的能力。双击样式以应用它。


    ## 加载、保存与导出


    LibreOffice 的原生格式是 OpenDocument（开放文档），并以 .odt（OpenDocument Text）保存其他。这是一个完全标准的格式，但许多其他程序不支持，因此不是工作的最佳方式。当然，你可能会遇到（或收到）其他格式的文档。LibreOffice
    在打开文件方面做得很好，但这些文件通常是低频率或文档不全的数据块，因此 LibreOffice 必须费力处理它们。如果微软给你发送一个 .doc 或 .docx
    文件，它在你的 LibreOffice 安装中看起来可能不对，请尝试将它们保存为 OpenDocument 格式。


    保存，LibreOffice 可以导出许多不同的格式，包括上述的 .doc 和 .docx。只需前往“文件 | 另存为”，你就会看到下拉列表。你可以将其保存为
    HTML 或文本，但很多格式将会消失。相反，使用“文件 | 导出”，你可以保存为 EPUB 格式供电子阅读器使用，或保存为 PDF——如果你使用的 PDF
