  md: '# # GETTING STARTED


    LibreOffice Calc


    # ## CONDITIONAL FORMATTING

    If formatting clues do not provide visual clues, you can add others from the Format
    | Conditional For-


    matting. Conditional formatting allows the general data trends to be recognized
    at a glance, but shows nothing of the specific data. For example, you can use


    emotions ranging from a smile to a neutral face to indicate cell contents. Alternatively,
    data can be color-coded (Figure 7).


    | Tool | Description |

    | --- | --- |

    | Right-click | Hide Columns/Hide Rows | Simplifies displays, and reduces the
    amount of information presented. Note that hiding does not protect information.
    For example, if you have a list of items in Euros and US dollars and hide the
    column with Euros, a viewer can deduce that a column displayed because some entries
    will be blank in the American columns. |

    | Data | Group and Outline | Group | Creates a set of tree-like controls in the
    column and row for expanding or collapsing the display. If you, you may need groups
    within a group. |

