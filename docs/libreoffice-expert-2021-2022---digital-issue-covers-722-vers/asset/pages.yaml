    # THE ART OF THE PRESENTATION


    Regardless of your opinion on Steve Jobs, there''s no doubt he was excellent at
    presenting new products. If you''ve never seen any of his presentations, head
    to YouTube and search iPhone and MacBook Air as two classics examples. His presentations
    weren''t presented with text and extensive detail, but in simple, high-quality
    images of the devices and occasional speeches. He spoke to the slides with his
    words, and let them carry him into an impressive presentation.


    Course, presentation style isn''t appropriate in every situation. Demonstrating
    flashy visuals to motivate journalists is different from updating your status
    on slides by showing photos to family (Creating a Photo Album). But here there
    are some general tips of what to keep in mind:


    > Get off to a start. No one likes a long presentation. Instead of starting with
    "I" begin with an exciting fact, data, or story. Catch your audience''s


    tension straight away and gives them that hope that the presentation will be interesting.


