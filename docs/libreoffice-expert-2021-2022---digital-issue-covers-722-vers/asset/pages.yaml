    # A universal sketching tool


    # Sketch Artist


    ![](img/732294c5ae254da1d40bd7a4d47042d7_31_0.png)


    With LibreOffice Draw, you can create attractive and informative vector-based
    drawings. By Thomas Krumbein


    LibreOffice Draw [1], a free vector-based mathematical program, helps you create
    anything from the simplest sketch to a complex diagram. Draw''s foundation is
    the page, which begins as an empty workspace, and you create your drawing by putting
    objects on that page. In contrast to LibreOffice Calc (an electronic spreadsheet),
