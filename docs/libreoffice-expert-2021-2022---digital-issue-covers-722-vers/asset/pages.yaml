    # ## USING GPG


    GPG is a cross-platform encryption tool that is available under a variety of implementations.
    Using it for digital certificates has the advantage of being free, requiring no
    registration, and configuration. Because GPG keys are a self-contained system,
    they do not need to be registered on a web server — you only need to send your
    public GPG key to those who will verify your signature.


    To generate keys with GPG, you will run the command:


    +   Apply the certificate to a file File | Signature | Digital Signatures... and
    then restart Writer. You will need the passphrase for the Key (Figure 2).


    ```

    gpg --full-generate-key

    ```


    GPG takes five steps to create a key: asking for name and email, creating a passphrase,
    choosing the algorithm, and setting an expiration date. If you are unsure about
    the possible choices, you can simply accept the defaults. These aren''t always
    the highest level of security, but they should be adequate for most. If you want
    the highest security, you can always research the keys as you encounter them (Figure
    3).


    As a last step, you will create a certificate so that you can make the new key
    it creates by using the following command:


    ![](img/732294c5ae254da1d40bd7a4d47042d7_60_0.png)


    ```

    gpg --output YOURNAME.gpg gpg

    --export KEY-EMAIL

    ```


    Once the certificate is used, you can send out the public key to the intended
    recipients of your signed files


    or as a plain text file with the following format:


    ```

    gpg --output YOURNAME.gpg gpg

    --export KEY-EMAIL

    ```


    From LibreOffice, the key can be found from Files | Digital Signature | Digital
    Signature... by navigating to the directory where it is stored.


    Recipients of the file who have your public key can verify it with you using:


    ```

    gpg --fingerprint KEY-EMAIL

    ```


