    If you wish to write in another language or translate it into the relevant native
    language, see the LibreOffice website for more details [7].

    - If you don''t feel confident about your skills or your knowledge of LibreOffice
    itself, writing a help topic or a guide chapter is a great way to start. We provide
    the information using LibreOffice. Are you ready?


    # SUCCESS STORY: Jwtiyar Ali


    Jwtiyar Ali helps with localizing LibreOffice into Kurdish. TFS told him about
    himself.


    To start, tell us about yourself!


    Hey! I live in the Kurdistan, in the north of Iraq - Sulemaniyah. I have an MSc
    in Physics, but I love software. I currently work in Quality Control Department
    of LibreOffice as a test chemist.


    I do translations for many open source projects like Umibint, Firefox, etc., translating
    them. My hobbies are following new open source projects and seeing how they can
    be competitive.


    What are the opportunities and challenges for translating/using free software
    and LibreOffice in your region?


    In my country, promoting open source apps and software is a very challenge because
    most people-90 percent use proprietary apps, they don''t hear about or know open
    source alternatives.


    So we in the team chwag.org decided to make a website to introduce many open source
    projects. We created a platform and a forum for reason - now we have Facebook
    groups and pages.


    In my opinion, it''s an opportunity to provide people with more guides and make
    a comparison between LibreOffice with other apps. Show what LibreOffice-Office
    can do that others cannot


    ![](img/732294c5ae254da1d40bd7a4d47042d7_94_0.png)


    can''t, also show that LibreOffice can do some things - or even with their daily
    work, and send them to educate others about the software.


    What are you doing in LibreOffice right now what was the experience like?


    I translate LibreOffice made in English in my language - that would be perfect.
    Also, I want to help users to interact with LibreOffice more often than before.


    How did you get involved in LibreOffice, and what was the big community behind
    it? Being in the community made me feel - I didn''t know what part of the world
    around me could benefit from what I do. The experience was amazing, because I
    didn''t know had that we have a great app like LibreOffice.


    Anything else you want to add?


    I want to thank everyone who helped me in this great community. Passion for LibreOffice
    has no borders, and I hope to see other open source projects grow faster than
    ever. The best part of the community is that we all trust in open source and teamwork.


    These days, I am promoting LibreOffice to my colleagues and friends. I hope to
    fix any problems that they face during installing or when using the suits.


    LIBREOFFICE EXPERT - 2022 EXHIBITION


