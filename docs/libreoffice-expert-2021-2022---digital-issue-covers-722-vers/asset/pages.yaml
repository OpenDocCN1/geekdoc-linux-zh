  md: '# Formulas and Formats


    The LibreOffice Math package lets you display simple and complex formulas. By
    Franz Böhm and Paul Brown


    The Math editor works either as a standalone program or from the other LibreOffice
    modules and embeds perfectly formatted formulas into text documents, spreadsheets,
    presentations, integrals, functions, and even whole systems of equations or matrices.


    To start Math in a separate window, click File | New | Formula. To include a formula
    in Writer, Calc, Impress, or Draw, select Insert | Object | Formula. The formula
    becomes an embedded object in the document that you can drag and scale up or down.
    Working with the three-pane Math editor is easy.


    On the left is a sidebar and at the bottom is the Commands pane, which normally
    can be docked or redocked by pressing Ctrl and double-clicking on the frame. Above
    the Commands pane is a preview area that shows the formula as it will appear in
    the document. Clicking View | Elements displays helpers in a small Elements window


    that is especially useful for Math beginners, making it easier to enter formulas.


    Note that the formula editor does not perform calculations. Math is used exclusively
    for writing and displaying formulas.


    # WORKSPACE


    When you start Math, the workspace is empty. To begin, select one of the nine
    categories from the sidebar drop-down or from the top two rows of icons in the
    Elements window. The categories include:


    +   - Unary/Binary Operations

    - Relations

    - Set Operations

    - Functions

    - Operators

    - Attributes

    - Brackets

    - Formats

    - Others


    ![](img/732294c5ae254da1d40bd7a4d47042d7_41_0.png)'
