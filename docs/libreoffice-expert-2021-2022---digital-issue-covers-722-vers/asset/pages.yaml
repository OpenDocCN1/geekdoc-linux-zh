    LibreOffice Calc offers the functionality of Excel with added benefits. By Brucefield


    Calc is LibreOffice''s spreadsheet module. The equivalent of Microsoft Excel,
    Calc is designed to be compatible with it. Each worksheet (Figure 1) is capable
    of handling 1,024 columns and 1,048 rows, more than enough for most purposes.
    If you need more, or if a spreadsheet crashes on a memory-challenged machine,
    consider creating a database in LibreOffice Base.


    If you are a complete beginner, spreadsheets like Calc are more or less a sophisticated
    version of the tables found in text documents. In fact, LibreOffice Writer, Calc
    can be used to set up a few simple spreadsheets. The spreadsheet is name by worksheet.
    On each worksheet, columns are designated by uppercase letters, and rows by numbers.
    The first cell on the upper left is A1, an identification that can be used to
    call upon the information when manipulating data.


    The program includes features for displaying and manipulating data. These features
    include filtering lists, a full array of functions for all sorts of data, and
    miscellaneous additional tools. If you have used Excel, you probably become familiar
    with Calc very quickly. Both functions and names are similar in the two spreadsheet
    applications, although a few are in diff


    ferent locations. Perhaps the greatest difference is that Calc uses styles just
    like LibreOffice Writer: Cell styles for formatting any spreadsheet, and page
    styles for producing a hard copy of a spreadsheet. Once defined, both of these
    kinds of styles save you time and allow you to concentrate on data entry rather
    than formatting.


    # PLANNING SPREADSHEETS


    Spreadsheets have a way of growing, which is probably why they are used most often.
    However, if you take the time to design a spreadsheet template ahead of time,
    you will be able to find your data more easily. Using default spreadsheet templates...
    One important consideration is the number of sheets in each spreadsheet. LibreOffice
    Calc, for example, lets you have colored sheets for different types of employees.
    You may also want a separate spreadsheet for the pivot tables (new views of already
    existing data).


    Most spreadsheets will fill one of two categories: lists and collections of numerical
    data, or data arrays. Lists are the simplest type of spreadsheet. They include
