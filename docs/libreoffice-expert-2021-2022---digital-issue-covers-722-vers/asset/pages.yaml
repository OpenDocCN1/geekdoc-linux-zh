    Need to impress your boss with the latest sales stats? Or just show off some holiday
    photos in an eye-catching format? Impress is the tool you need. By Mike Saunders


    The term "PowerPoint" has become synonymous with presentations in general, even
    if the file was made in a different program. Presentation software dates back
    to the early 1980s with tools such as TypeVision, which lets users add images
    to text and slideshow.

    LibreOffice''s presentation component is called Impress, and it is an immensely
    versatile tool with features and special effects. Let''s dive into it!

    Start LibreOffice and choose a New Presentation (or if you''re already running
    the app, go File | New | Text Presentation in the menu).

    You''ll be presented with a list of preinstalled templates, please choose one
    you like, and a new Impress document will open displaying the following features:


    +   1. Toolbar: Most commonly used features are just one click away here. If you''re
    unsure of what an icon does, simply mouse over the icon for a tooltip. You can
    also right-click on the toolbar and choose Visible Buttons or Customize Toolbar
    for finer control over the layout.


    ![](img/732294c5ae254da1d40bd7a4d47042d7_25_1.png)


    Figure 1: A new Imp document: toolbar (1), slide thumbnails (2), slide content
    (3), sidebar (4), sidebar options (5), position and size (6), and level (7).


