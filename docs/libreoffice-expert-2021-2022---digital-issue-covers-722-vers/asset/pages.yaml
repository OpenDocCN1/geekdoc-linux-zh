    digital signature verifies a document''s trustworthiness, it guarantees that the
    sender is who they claim to be, and the document has not been edited since it
    was signed. Ordinary file sharing may not require one, but if privacy is important
    – particularly in business or when financial matters are discussed – then a digital
    signature is one of the main ways to safeguard a file''s contents.

