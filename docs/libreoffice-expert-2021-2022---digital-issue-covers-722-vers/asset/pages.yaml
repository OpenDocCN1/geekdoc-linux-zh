    # PRINTING AND EXPORT


    Printing your drawings is easy. Select your printer, and start the printing. Make
    sure your page settings match your printer''s requirements. You can also export
    your drawing into file formats, like PDF, PNG, or SVG. SVG is a vector-based format,
    while PNG is pixel-based.


    LibreOffice Draw also has one restriction when it comes to printing: it does not
    support color-separation (CMYK mode), which is necessary for offset printing.
    If you require CMYK mode, the final product must be reworked with a preprint tool,
    and colors must be changed to the required quality profile.


    # CONNECTORS


    Another feature of Draw is connectors for linking objects. Connectors use groups,
    on the object''s body, to connect to another object. Other objects are connected
    via guides, moving one also moves the other. Typical use cases are charts or organizational
    charts (Figure 7). Connectors allow you to move items while preserving the chart''s
