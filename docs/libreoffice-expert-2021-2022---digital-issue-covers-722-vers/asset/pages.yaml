  md: '# IMPORTING AND EXPORTING


    Impress does a good job of presentation in PowerPoint format, although there may
    be some limitations or differences regarding complicated animations and effects.
    If someone wants to send you a Microsoft presentation that you need to modify,
    ask them to save in .pptx format rather than a slightly more documented, but still
    with restrictions. In an ideal world, all software would use a fully open and
    standardized format like .odt (Open Document Presentation, as used by LibreOffice),
    but one can dream!


    Meanwhile, Impress saves you in a wide range of formats. Go to File | Save As
    and look at the File type drop-down list that opens. You can choose Microsoft
    formats, HTML, or even plain text. Further options are available under File |
    Export As. Here you can choose to save your presentation in PDF or EPUB format
    (the latter being for ebook readers).


