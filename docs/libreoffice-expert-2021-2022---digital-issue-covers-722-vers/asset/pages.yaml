    # ## INSIDE ODF


    An ODF file is typically stored and distributed in a ZIP container, which includes
    XML files and associated metadata, images or other media. Each ODF file contains
    four embedded XML files: /content.xml, /table.xml, /metadata.xml, and /styles.xml,
    with definitions for all the document''s content. ODF provides a flexible container
    that can hold almost any digital object and be used in any office. If you want
    to see what an ODF file really looks like, use LibreOffice Writer and change the
    .odt extension at the end of the file to .zip. Then use a ZIP archive tool to
    look inside the container (Figure 1).


