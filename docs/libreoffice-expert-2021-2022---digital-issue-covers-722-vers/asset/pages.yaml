    of a hundredth, or 1/120th of an inch.


    Similarly, for some cases, letter combinations make awkward spacing, such as ““
    or ”” (Figure 4). We have few letters redesigned as a single character by Inserting
    Special character. In LibreOffice, you can select Pair | Kerning in a paragraph
    to have Office automatically attempt to approve letter spacing.


