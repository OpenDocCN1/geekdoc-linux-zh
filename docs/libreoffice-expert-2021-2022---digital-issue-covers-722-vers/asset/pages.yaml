    # ## LINE SPACING, KERNING, AND HYPHENATION


    Writers'' customization tools include many features found in little programs.
    Most word processors, when you give default spacing to lines that are single or
    double spaced and works well for many people, this default makes the text appear
    too light or too dark. When Writers gives you the elective of clicking Indents
