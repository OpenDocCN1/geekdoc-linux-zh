    ODF XML


    # Inspecting the XML Code inside LibreOffice Files


    # # Digging Deep


    You may have heard that LibreOffice files are "XML-based" or "use XML," but when
    you want to open a Writer document in a text editor, you only see a binary blob.
    Learn how to access and modify the hidden XML content using scripts. By Hans-Georg
    Efler


    imagine that you hold a talk at your company''s recycling event last year, you
    created a presentation and a handout to give with your talk – the old year 2018
    and the new year 2019. Now you''re asked to do it again, so you want to reuse
    many of the LibreOffice – slides and start searching and replacing.

    Want to skip this manual work? This article shows you how to do it, but there
    is a learning curve. I will be talking about XML, Bash, and Python – three possible
    new languages (one for data, two for code). At the end, you will be able to search,
    analyze, and modify LibreOffice files automatically. For example, Figure 1 shows
    all occurrences of “Linux” were highlighted. Opening a Writer, Calc or Impress
    in a text editor yields an uninspiring collection of seemingly random characters
    – there''s no content. But once you learn that files are zip-compressed archives,
    they start to make sense. In order to peek inside such, rename the file (or make
    a copy) so that the file name ends with .zip. Then you


    can use your favorite archive tool (or the command line tool zip) to unpack the
    archive, and you will find a whole hierarchy of files (Figure 2).


    The most important file is content.xml, which sits in the top folder: it contains
    the data or tree within the LibreOffice application, and there are also elements
    (typically images). You can open content.xml and edit it in a text editor.


    Now, would you want to inspect the XML code so thoroughly? There are a multitude
    of practical applications that could. For example, imagine you write a document
    that contains source code listings in programming language, and you would like
    to have keywords highlighted. The quickest way to do this is to take a screenshot
    of a text editor in which the code is displayed with highlighting, and then paste
    that into the document, which will prevent copying and pasting code from the document.
    It would be much easier to simply format the code version and then format it automatically.
    By doing this, you avoid looking at (and modifying) the XML, but that''s actually
    would require generating a new text structure from style and adding new nodes
    to the XML tree.


    For this article, I will stick with two tasks: searching for keys in documents
    and automatically making small modifications to documents.


    A “HELLO WORLD” DOCUMENT

    in order to get started, you create a Writer document and just paste one line
    of text into it: "Hello World." Or not any styles or other format, and save the
    document to hello-world.odt. Not the we


