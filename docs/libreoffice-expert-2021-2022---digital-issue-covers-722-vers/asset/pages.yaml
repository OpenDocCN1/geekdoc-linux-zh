    #  Introducing LibreOffice

    ## Document Foundation


    Over the following years, Sun and the OpenOffice.org community worked on new releases
    of the software, but there was ongoing concern that a large company had a lot
    of sway in the project. Some ideas were brought up by the community, such as an
    independent foundation to oversee OpenOffice.org development, but nothing came
    of it.


    # 11 YEARS OF


    LibreOffice was announced in September 2010. Discover our community and certified
    developers have achieved in 10 years...


    ![](img/732294c5ae254da1d40bd7a4d47042d7_10_0.png)


    # 22 MAJOR RELEASES


    New releases arrive like clockwork, every months. They include new features, bugfixes
    and compatibility improvements.


    Until 2009, that was purchased by Oracle, a vendor of database software and other
    enterprise tools. There was immediate concern among the OpenOffice.org community,
    volunteers who contributed a lot to the project: What happens now? Will Oracle
    care about OpenOffice.org? Is Oracle a friend of free and open source software?


    ![](img/732294c5ae254da1d40bd7a4d47042d7_10_1.png)


    # OVER 200 MILLION USERS


    LibreOffice is used by over 200 million people around the globe, in addition it''s
    available in 114 languages thanks to our localisation communities.


    There was much discussion at the time, and a bunch of community members made a
    big decision in 2010: It was finally time for a completely independent, non-profit
    entity to provide a future for the office suite. This was known as The Document
    Foundation (TDF), and the software was called LibreOffice.


    LibreOffice began as a "fork" of the OpenOffice.org project. Because OpenOffice.org
    is open source, anyone could take the source code and use it to start another
    project. The vast majority of community members in OpenOffice.org joined the LibreOffice
    project straight away. LibreOffice was the future of the same code, but it built
    with a new brand, and new


    # ELEVEN CONFERENCES


    Yearly conferences have taken place in Altena, Tirana, Brno, Aarhus, Bonn, Mainz,
    Toronto, Sofia, and online. And there are more!


    ![](img/732294c5ae254da1d40bd7a4d47042d7_10_2.png)


    # MAJOR DEPLOYMENTS


    LibreOffice is being used in enterprises and governments around the world. See
    tdf.org/migrations for more details. Professional support is available too.


    ![](img/732294c5ae254da1d40bd7a4d47042d7_10_3.png)


    # COMMERCIAL ECOSYSTEM


    Companies offer LibreOffice-based products, develop new features, and contribute
    code back to the project and community.


    ![](img/732294c5ae254da1d40bd7a4d47042d7_10_4.png)


    Figure 7: OpenDocument is the native format of LibreOffice, and it is a fully
    open and standardized format, for long-term storage of your work.


    Let''s make the next 11 years great too! tdf.org/joinous


    LIBREOFFICE EXPERT - 2022 EDITION'
