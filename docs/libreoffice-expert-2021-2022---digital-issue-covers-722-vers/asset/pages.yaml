    ready system, you are asked whether you want to

    overwrite it. Click OK to continue.

    4. A confirmation dialog asks whether you want to install the

    extension for all users on the system, or only for yourself.

    To install for all users, you must be log in as root.

    Choose two options.

    5. You may be asked to edit the license. Read and scroll

    to the end of the license and click to accept it.

    6. Click the Options button in the Extension Manager and

    customize it. Not all extensions have options.

    7. Close and restart LibreOffice, and the extension is ready for

    use.


