    # # WORKSPACE VIEWS


    Under the Menu, you''ll find various options - each of them is designed to ensure
    the completion of tasks. For instance, the Sidebar is the main view to work with
    individual slides. Use this view to format design and add text, graphics, and
    animation effects.


    Then there''s the Outline view, which contains the presentation slides numbered
    sequentially (Figure 6). **Outline view** shows titles, bulleted and numbered
    lists, lists for each slide in the outline format. The text contained in the default
    boxes is also shown in outline, so it includes other slides except text boxes
    or drawing objects, the objects in this view will not be displayed.


    The Notes view lets you add notes to a slide. These notes are for your information
    and not seen by the audience when the presentation is shown. Meanwhile, the Master
    view is for setting up the layout of your slides for printing. Click the Properties
    tab in the sidebar, and you can choose to print one, two, three, four, six, or
    nine slides per page in the Layout section. In addition, this lets you add custom
    fields into the header and footer sections, such as the current date - one of
