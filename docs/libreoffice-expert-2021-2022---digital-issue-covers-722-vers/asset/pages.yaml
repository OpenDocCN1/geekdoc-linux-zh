    # Document formatting made easy


    # Model Document


    LibreOffice templates can save you time with formatting documents, so you can
    focus on the important stuff. By Bruce Byfield


    formatting documents is time-consuming. Even with styles, formatting can still
    take a lot of effort - effort that can be spent developing content. In addition,
    if more than one person is working on a series of documents, you do not want to
