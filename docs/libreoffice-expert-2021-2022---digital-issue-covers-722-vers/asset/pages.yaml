    \ and versions\n\n# Keep It Open\n\n Open Document Format standard is an important\
    \ reason for the success of LibreOffice. By Italo Vignoli and Joe Casad\n\nThe\
    \ Open Document Format (ODF) is the native format for LibreOffice word processing\
    \ files, spreadsheets, charts, and presentations. ODF is an open format developed\
    \ as a standard for office applications. ODF was released by a Technical Committee\
    \ (TC) at the Organization for the Advancement of Stru\n\ntured Information Standards\
    \ (OASIS) consortium in 2005 and approved as an ISO/IEC International Standard\
    \ in 2006 as ISO/IEC 26300:2006.\n\nAt the time the most popular format for office\
    \ documents was the MS Office format set. At the time, the MS formats were costly\
    \ and proprietary, yet they were so common that they became a pseudo-standard\
    \ for saving, sharing, and transmitting data. (See the exit Standards and Pseudo-Standards.)\
    \ The widespread use of these proprietary file formats increased Microsoft's power\
    \ over the market, allowing them to dominate and eliminate competitions.\n\nOpen\
    \ Document Format evolved from the XML specification for the OpenOffice.org suite,\
    \ a forerunner to LibreOffice. The OpenOffice developers wanted a free and open\
    \ format that could compete with Microsoft's formats. Since then, ODF became popular\
    \ throughout the world as a free alternative for storing and transmitting data.\
    \ Legal issues, and competition from other formats caused Microsoft to bring more\
    \ openness to their once-hidden formats. The Microsoft Office XML format (OOXML\
    \ or MOX) is open enough to see and write programs with, but Microsoft continues\
    \ to maintain control over the standard.\n\nOpen Document Format, on the other\
    \ hand, is independent of LibreOffice or any other software project. The open\
    \ standard means that ODF is not supported by dozens of other office tools in\
    \ LibreOffice.\n\n# WHAT IS IT?\n\nA document describes the structure for data\
    \ saved in a document file. The data inside a modern document consists of more\
    \ than letters and numbers. The document must store information on fonts, character\
    \ tags, paragraph tags, and pagination, as well as headers and footers, notes,\
    \ tables of contents, and revision tracking. The format records information on\
    \ document encryption, digital signatures, and macros. In addition, the format\
    \ must be resilient, because each file can be read and edited multiple times by\
    \ different applications, including applications that\n\n![](img/732294c5ae254da1d40bd7a4d47042d7_73_0.png)\n\
    \n74\n\nLIBREOFFICE EXPERT — 2022 EDITION"
