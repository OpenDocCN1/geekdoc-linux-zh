  md: 'When you suspect that you may be dealing with a virus or worm, you can usually
    find out all you need to know about the threat by performing an Internet search
    for the symptoms. Once you identify the virus or worm you are dealing with, you
    can research it and learn how to fight it.


    # Covert Information


    covertinfo.pcap In this scenario you''re just the network security officer at
    a large multinational corporation. You have just been alerted by your superior
    that an employee overheard two other employees discussing the possibility of sneaking
    off with some of the company''s assets. Your task in this scenario is to monitor
    the computers of the two suspect employees to see if you can figure out their
    plans.


    # What We Know


    This scenario is based on the speculation of another employee. While we can''t
    verify if what he overheard was true or if it was just taken out of context, we
    know that the two employees in question are very computer savvy, so our observations
    should be conducted with the utmost care.


    # Tapping into the Wire


    Because we don''t want our tech-savvy employees to know that we''re onto them,
    we want to make absolutely sure that the computers are monitoring no signs of
    being watched. For this reason, we''ll use port mirroring, even though we are
    within our network. A separate mirror and capture have to be set up for each computer
    being monitored.


    # Analysis


    Throughout the course of these two employees'' daily work, a lot of packets are
    generated. In most cases, these packets are legitimate, so the first step is to
    search for traffic that could be suspicious. Display filters make it easy to search
    for traffic such as DCEPRC, NetBIOS, or ICMP, which we should not see under normal
    circumstances. I applied this filter to the covertinfo.pcap capture; the result
    is two packets from one employee''s computer, as shown in Figure 9-13.


    | No. | Source | Destination | Protocol | Info |

    |---|---|---|---||}{

    | 1 | 0000000 | 10.100.17.48 | ICMP | Echo (ping) request |

    | 2 | 0000015 | 10.100.17.48 | ICMP | Echo (ping) reply |


    Figure 9-13: ICMP? Why would these two employees be pinging each other?


    These packets may look like standard ICMP packets, the source and destination
    addresses belong to the computers of our two suspect employees. Why would they
    be pinging each other during the middle of the day?'
