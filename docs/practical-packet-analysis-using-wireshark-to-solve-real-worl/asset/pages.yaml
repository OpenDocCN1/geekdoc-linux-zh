- img_proc: true
  md: 'Because this problem is only occurring on Jeff''s computer, conclude that it
    must be isolated there, rather than on the network''s router. After further investigation,
    we find that his new computer was configured with the wrong subnet mask.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_130_0.png)


    Figure 8-17: The TTL values of these packets are not equal, which points to a
    routing problem.


    # Summary


    If a machine is configured with the wrong subnet mask, the result can be a multitude
    of problems, including preventing misconfigured computer from communicating at
    all. In this case, every packet from Jeff''s computer bounced back, essentially
    doubling the amount of traffic the computer had to deal with and slowing communication
    tremendously during peak times.


