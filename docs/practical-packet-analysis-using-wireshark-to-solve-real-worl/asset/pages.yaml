  md: 'There are hundreds of ways to filter your captured wireless traffic. You can
    view many of these wireless capture filters on the Wireshark wiki at http://wiki.wireshark.org.


    # # A Bad Connection Attempt


    Now let''s take a look at a specific scenario related to wireless packet analysis.
    In this scenario, Justin is trying to configure his laptop to access the wireless
    network at his office. Unfortunately, it just isn''t working.


    Successful-WEPAuth.pcap and Failed-WEPAuth.pcap


    # # What We Know


    The network Justin is trying to connect uses the shared authentication method
    with WEP encryption on channel one. Justin should simply be able to enter these
    settings in his wireless client to connect, but when he does, the connection fails.


    # # Tapping into the Wire Air


    In this situation, capturing packets from the air requires the same thought process
    as capturing packets on a wired connection. Because the process seems to fail
    when Justin tries to connect to the wireless network, we''ll capture packets at
    that time. The best way to do this is by using the AirPcap device, set to channel
    one.


    # # Analysis


    Since we have yet to look at any captures, we don''t know what a successful wireless
    authentication and association sequence looks like. Let''s look at a capture file
    of this process when it''s working correctly—open the example file SuccessfulWEPAuth.pcap,
    which shows a successful sequence on Justin''s network.


    The wireless on Justin''s network is set up WEP shared-key security. A Wired Equivalent
    Privacy (WEP) key is a hexadecimal or alphanumeric code that serves as a type
    of password used to encrypt the communication between a WAP and a wireless client
    (i.e., the user attempting to connect to the wireless network). In order to connect
    to a WAP, the wireless client must first complete a challenge and response with
    the WAP to verify that the correct WEP key is being used. This challenge response
    appears in packet 4 of the capture file, as shown in 10-12.


    | Challenge text |

    | Tag Number: 16 (Challenge text) |

    | Tag length: 128 |

    | Tag Interpretation: Challenge text: D4ABB816F5B86C6FC17C48B95A5389E7D341CCD87A2F9F9...
    |


    Figure 10-12: The WAP issues challenge text to the wireless client.'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'The WAP responds to the connection attempt by sending a challenge statement
    to the client. This statement is an encrypted string of text that must be decrypted
    by the client (with the appropriate WEP key) and then sent back to the WAP, as
    shown in Figure 10-13.


    ```

    WEP parameters

    Initialization vector: 0xc0cf9e

    Key index: 1

    WEP key: 0x409d2512 (not verified)

    Data (147 bytes)

    ```


    Figure 10-13: The wireless client sends the unencrypted challenge text back to
    the WAP.


    In packet 6 the wireless client sends the unencrypted challenge text, and the
    WAP replies with a message stating that the authentication process was successful,
    as shown in Figure 10-14.


    ```

    Fixed parameters (6 bytes)

    Authentication Algorithm: Shared key (1)

    Authentication SEQ: 0x0004

    Status code: Successful (0x0000)

    ```


    Figure 10-14: The WAP alerts the client that authentication was successful.


    Finally, after a successful authentication, the client can transmit an association
    request, receive an acknowledgment, and connect, as shown in Figure 10-15.


    | No. | Source | Destination | Protocol | Info |

    |---|---|---|---|--|

    | 10 | 0.145466 | Genemetke_30:bo:1af | Entry_ab:68:30 | IEEE 8 Association Request,
    SN=44,FN=0, SSID: DENVEROFFICE |

    | 11 | 0.153859 | Entry_ab:60:27:18 | Data:30:00 | IEEE 8 Data, SN=190,FN=0 |

    | 12 | 0.148466 | Entry_ab:68:18 | Broadcast | IEEE 8 Association Response, SN=1391,FN=0
    |

    | 14 | 0.149464 | Entry_ab:68:30 | Entry_ab:68:30 | IEEE 8 Acknowledgment |


    Figure 10-15: The authentication process is followed by a simple association request
    and response.


    Now that we know how to connect to a WAP should look like, let''s look at the
    capture file from Justin''s connection attempt. (shown in Figure 10-16), the WAP
    sends challenge text to Justin''s, so we know that the two devices can each respond.


    ```

    IEEE 802.11 wless management frame

    Fixed parameters (6 bytes)

    Authentication Algorithm: shared key (1)

    Authentication SEQ: 0x0000

    Tagged parameters (130 bytes)

    - challenge test

    Tag number: 16 (challenge text)

    Tag length: 128

    Tag interpretation: challenge text: DEFC7D30DC6C57CC58B5FE1687FAC65528E4D06198BF581...

    ```


    Figure 10-16: The WAP sends challenge text to Justin''s.


    Packet 5 (in 10-17) shows how the wireless client sends its response to the server,
    which tells us which devices are communicating.'
  merge: -1
  pgno: 170
- img_proc: true
  md: 'Destination address: Enetary_6b:6b:30 (00:11:88:6b:30)

    Source address: GemekteK30:b0:af (00:14:a5:30:b0:af)

    BSS ID: Enetary_6b:6b:30 (00:11:88:6b:30)

    Fragments number: 0

    Sequence number: 43

    WEP parameters

    Initialization vector: 0x26709d

    Key index: 0

    WEP ICV: 0xc800a5b7 (not verified)

    Data (147 bytes)


    # Figure 10-17: Justin''s computer sends its response to the challenge

    text back to the WAP.


    At this point in the process, we should see a response from the

    WAP confirming that the authentication process was successful. But instead,

    we see something else, as shown in Figure 10-18. The authentication fails.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_171_0.png)


    Figure 10-18: Apparently, the authentication wasn''t successful.


    The message sent from the WAP to Justin''s computer tells us exactly

    what is going on: The sequence numbers are out of order. This means that

    the response Justin''s computer gave to the challenge text was not correct—

    therefore, the WEP key used to decrypt the challenge text has either

    been entered or has been entered incorrectly.


    # Summary


    The sad truth about troubleshooting wireless network problems is that wireless

    client software usually doesn''t report specific problems: The client either

    connects or it doesn''t. Luckily, wireless packet analysis techniques allow us

    to see exactly what is going on and to more efficiently troubleshoot wireless

    networks.


    # Final Thoughts


    Wireless networks are becoming a staple in the corporate environment.

    As focus shifts to wireless, we must be able to troubleshoot both wired and

    wireless networks. The skills and concepts taught in this chapter should help

    y to understand the intricacies of troubleshooting a wireless network with

    packet analysis.'
  merge: -1
