    # # Viewing Endpoints


    An endpoint is the place where communication ends on a particular protocol. For
    instance, there are two endpoints in TCP/IP communication: the IP addresses of
    the systems sending and receiving data, 192.168.1.5 and 192.168.0.15. An example
    on Layer 2 would be the communication place between two physical NICs and their
    MAC addresses. The NICs sending and receiving data have addresses of 01:00:5e:00:00:16
    and 01:00:5e:01:01:06, making those addresses the endpoints of communication.
    You can see a graphical representation of this concept in Figure 5-7.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_78_0.png)


    Figure 5-7: A graphical representation of endpoints on a network


    When analyzing traffic, you may find that you can narrow down a problem to a specific
    endpoint on a network. Wireshark''s dialog (Statistics > Endpoints) shows several
    helpful statistics for each endpoint (Figure 5-8), including the addresses of
    each as well as the number of packets and bytes transmitted and received by. The
    tabs at the top of the window'
