    | No. | Time | Source | Destination | Protocol | Info |

    |---|---|---|---|---|---|

    | 28 | 0.000000 | 67.161.32.69 | 67.161.32.69 | TCP | http h > 1783 [RST] Seq=0
    Len=0 |

    | 29 | 0.0534680 | 130.575.32.69 | 130.575.32.65 | TCP | < 1782 http [RST, ACK]
    Seq=0 win=0 len=0 |


    Figure 8-19: Packets 28 and 29 present a problem.


    The server has ceased to communicate with the client, and we have to find out
    why. We could go through the entire capture step and examine each packet, but
    that would be an incredibly and tedious process. Instead, we''ll take the easy
    way out.


    Since we are dealing with an HTTP transaction, the TCP stream should be incomplete
    unless we are waiting for some form of user input. After 9 seconds, the server
    can no longer transmit the data it needs to send back to the client, so it sends
    a RST packet to terminate the connection. Our client hasn''t given up yet, and
    it adds an additional 5 seconds (as shown in Figure 8-19) before acknowledging
    the request.


    Looking at this traffic, do you see anything other than normal HTML being transferred?
    If you browse down to the second section of traffic coming from our client, we
    see a request for a Flash applet from the Novel server, as shown in Figure 8-20.
    This is where the problem lies. The web page Owen is trying to view is apparently
    making a request for a Flash object; this kind of request can be very easily blocked
    by a pop-up blocker. That''s what is happening here.'
