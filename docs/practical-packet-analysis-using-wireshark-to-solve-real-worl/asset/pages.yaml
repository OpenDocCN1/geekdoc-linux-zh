    insight.


    # Summary


    While we haven''t stopped the influx of SPOOLS packets in this scenario, we have
    used Wireshark to quickly find the source of our mysterious printer. Having identified
    the source, we can find out why this information is being sent to the printer.
    (Most likely, client 10.100.17.47 on our network has been compromised in some
    way).


    # FTP Break-In


    ftp-crack.pcap


    FTP is one of the most commonly means of transferring large amounts of data. The
    company we be looking at now has an internal FTP server that it uses to maintain
