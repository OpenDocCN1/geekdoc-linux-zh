    # Keeping Things in Order


    Since a device can receive multiple data streams at once, IP allows for an offset
    value so receiving systems know the order in which sequence fragmented packets.


    To view the offset of a fragmented packet, for you look under the IP section of
    the Packet Details pane. In the example file, you will see an offset value of
    0. This tells you that this is the first packet in a series of fragmented packets.'
