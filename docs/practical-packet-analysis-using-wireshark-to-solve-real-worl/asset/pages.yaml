  md: '# What We Know


    The first thing you should allow when troubleshooting a problem make a list of
    what you know about the issue. In this case, we know that Barry and Beth are both
    using identical, brand new computers. We also know that both computers have network
    connectivity we assigned them IP addresses yourself and made sure that you could
    ping them from another computer on that network segment. Finally, we know that
    everything has been configured on both computers should be exactly the same, since
    you configured one after the other.


    # Tapping into the Wire


    Once we have established what we know about the issue, it is time to devise a
    plan to figure out what we don''t know. By figuring out what type of traffic captures
    we need to take and where we need to place our analyzer on the network to get.


    The problem is being able to access the Internet, so the logical choice is to
    capture packets while Beth''s computer is trying to access a website. The network
    Barry and Beth are connecting to one we aren''t extremely familiar with, for the
    purposes of comparison, we will capture packets from Barry''s computer, as well.
    We will end up with two capture files: one that works and one doesn''t. Comparing
    the two should help us determine the problem. This process is baselining. We''ll
    install Wireshark directly on both machines.


    # Analysis


    Let''s begin looking at the trace file Barry''s computer successfully accessing
    the Internet (bethcomputer.pcap). When you open the trace file, the first thing
    you will see is a request HTTP transaction.


    As you can see in Figure 7-12, you will find an ARP broadcast looking for the
    Layer 2 address of default gateway, 192.168.0.10. Once Barry''s computer receives
    a reply to this request, it initiates a TCP handshake with the remote server.
    Once this is complete, data transfer from the server to the client begins.


