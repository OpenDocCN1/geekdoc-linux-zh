- img_proc: true
  md: 'Looking at the packets, your first course of action might be to track down
    the remote IP addresses and see where they are located, typically by performing
    a WHOIS lookup on each IP address. However, in this case you would quickly find
    that most of these IP addresses do not point to any companies even to the same
    general area, but rather to different locations around the world.


    To further evaluate the packets, you could see whether the TCP stream holds valuable
    information. In this case, following the TCP stream proves useless—the data is
    gibberish, as you can see in Figure 8-23.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_134_0.png)


    Figure 8-23: The TCP stream doesn''t provide anything of real value.


    When these highly technical things fall down, what are you to do? How about simply
    down the list of packets, one by one, and look for something significant.


    As you scroll through the packets in the capture, you will eventually find yourself
    at packet 9, shown in Figure 8-24. This packet identifies the culprit by querying
    remote BitTorrent servers, as shown in the Info field. This popular peer-to-peer
    file transfer is the source of our problem and all of these connections.


    | No. | Time | Source | Destination | Protocol | Info |

    |---|---|---|---|---|---|

    | 99 | 0.74636 | 192.168.0.193 | 224.0.0.251 | MDNS | Standard query_ptr_BitTorrent-e7393164158de2fac0f58a13aff
    |


    Figure 8-24: Steering how individual packets lead us to the culprit, BitTorrent.


    # Summary


    In this case, a user installed BitTorrent on his workstation and configured to
    allow both incoming and outgoing connections at an unlimited rate. This high amount
    of bandwidth allowed one workstation to monopolize all of the company''s Internet
    traffic.


    This case reminds us that when doing analysis, it is common to use some of the
    advanced features to quickly solve the problem; however, sometimes the quickest
    solution is to simply examine individual packets.'
