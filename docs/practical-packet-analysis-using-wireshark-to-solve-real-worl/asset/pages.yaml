  md: '# DON''T JUST STARE

    AT CAPTURED

    PACKETS.

    ANALYZE THEM.


    Download the capture files

    used in this book from

    www.nostarch.com/packet


    It''s easy enough to install Wireshark and begin capturing packets off the wire—or
    from the air. How do you interpret those packets once you''ve captured them? And
    how can those packets help you better understand what''s going on under the hood
    of your network?


    Practical Packet Analysis shows how to use Wireshark to capture and then analyze
    packets as you take an in-depth look at real-world packet analysis and network
    troubleshooting. The way pros do it.


    Wireshark (derived from the Ethereal project), has become the world''s most popular
    network sniffing application. But while Wireshark comes with documentation, there''s
    not a whole lot of information to show how to use it in real-world scenarios.
    *Practical Packet Analysis* shows you how:


    +   * Use packet analysis to tackle common network problems, such as loss of connectivity,
    slow networks, malware infections, and more


    +   * Build customized capture and display filters


    +   * Tap into live network communication


    +   * Graph traffic patterns to visualize the data flowing across your network


    +   * Use advanced Wireshark features to understand confusing packets


    +   * Build statistics and reports to help you explain technical information to
    non-technical users


    Because net-centric computing requires a deep understanding of network communication
    at the packet level, *Practical Packet Analysis* is a must for any network technician,
    administrator, or engineer troubleshooting network problems of any kind.


    # ABOUT THE AUTHOR


    Chris Sanders is the network administrator for Graves County Schools in Kentucky,
    where he manages more than 1,800 workstations, 20 servers, and a user base of
    nearly 5,000. His website, ChrisSanders.org, offers tutorials, guides, and technical
    commentary, including the very popular Packet School 101. He is also a staff writer
    for WindowsNetworking.com and WindowsDevCenter.com. He uses Wireshark for packet
    analysis almost.


    # TECHNICAL REVIEW BY GERALD COMBS, CREATOR OF WIRESHHARK


