    # No Connectivity


    Now we''ll use Wireshark for the first time to analyze and troubleshoot a real
    network problem. In this scenario we have two users, Barry and Beth, who sit next
    to each other in an office. After a budget increase (yeah, right!), the IT department
    has just purchased new computers for Barry and Beth. You are in charge of installing
    these new computers and making sure they are working properly. After unpacking,
    plugging in, and configuring both computers, you begin to test them to make sure
    everything is working. However, you quickly run into a problem. Barry is working
    perfectly, but for some reason, Beth is unable to access the Internet. Your goal
    is to find out why Beth is unable to connect to the Internet and then fix the
    problem.


    Basic Case Scenarios 83'
