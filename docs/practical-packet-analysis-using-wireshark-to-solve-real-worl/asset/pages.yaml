    Figure-20: This request is the source of our problem.


    # Summary


    After a bit of research into the Flash data being called from the Novell site,
    you learn that the Flash stream attempts to open its new content in the Flash
    window, where Eric''s pop-up blocker in Internet Explorer is blocking. While the
    browser was unable to give us any useful information about the problem (other
    than a connection timeout message), we used WiFi, some basic packet analysis concepts,
    and a little patience to pinpoint the exact spot where the communication process
    was hindered.


    # A Torrential Downfall


    In this next scenario, one of our network users has just called the help desk
    complaining that the network is running extremely slowly. He can''t access the
    Internet or any centric applications at a reasonable speed, and he''s getting
    really behind in his work. What''s slowing things down?


    # What We Know


    After surveying other network users learn that the Internet problem is widespread.
    All users report that the Internet is so slow that it is almost unusable. The
    edge router indicates high processor utilization, showing that it is handling
    very substantial traffic, both outbound and inbound.


    > The edge router describes the location of a router on a network. An edge router
    sits on the network and connects that to the outside world.


    # Tapping into the Wire


    Because the edge router handles all traffic between the local network and the
    Internet, and because it shows high processor load, the edge router is the best
    point of analysis here.'
