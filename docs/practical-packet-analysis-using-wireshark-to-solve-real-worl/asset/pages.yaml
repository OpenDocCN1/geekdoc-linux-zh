    # Summary


    The technology used in this scenario is referred to as Loki; it is means of sending
    information across the wire via hidden methods. The term Loki comes from the first
    project that ever embedded data into ICMP packets. In our scenario, ICMP was used
    as the carrier to transmit messages between our two employees with malicious intent.


    The use of covert channels of communication is not a new technology, but it is
    constantly evolving. It is uncommon to find data hidden in other types of packets
    as well, as TCP headers and ARP packets. Always remember the Packet Bytes pane—while
    you may not use it, it''s the only way to see what secrets packet may contain.


    # A Hacker''s Point of View


    hackersview .pcap Throughout this book, we have looked at things from the point
    of view of a network administrator. But what happens when a hacker with some packet
    analysis knowledge decides to take a peek at what''s on the wire? In this scenario
    we assume the identity of a hacker attempting to access sensitive information
    from his local company network.


    # What We Know


    Even though you''re an employee of the company you are trying to break into, you
    have limited access to network resources. The network is a run-of-mill Ethernet
    network, and it utilizes a few switches and routers. All of the computers on the
    network are running various versions of Windows with access privileges defined
    on a per-user basis.


