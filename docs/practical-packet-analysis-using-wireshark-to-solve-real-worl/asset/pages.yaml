    # Installing on Linux Systems


    The first step when installing Wireshark on a Linux system is to download the
    appropriate installation package. Not every version of Linux is supported, don’t
    be surprised if your specific distribution doesn’t have its own install package.


    # RPM-based Systems


    To install Wireshark on RPM-based distributions, such as Red Hat, do the following:


    +   1. Download the appropriate installation package from the Wireshark web page.


    +   2. Open a console window and type rpm -ivh wireshark-0.99.3.i386.rpm, substituting
    the filename of your downloaded package as appropriate.


    +   3. If any dependencies are missing, install them and repeat the previous step.


    # DEB-based Systems


    To install Wireshark on a DEB-based distribution such as Debian or Ubuntu, do
    the following:


    +   1. Download the appropriate installation package from the Wireshark web page.


    +   2. Open a console window and type apt-get install wireshark.


    # Wireshark Fundamentals


    Once you have successfully installed Wireshark on your system, you can begin to
    familiarize yourself with it. Now you finally get to open your fully functioning
    packet sniffer and see . . absolutely nothing!


    The fact is, Wireshark isn’t very interesting when you first open it. In order
    to really get exciting, you have to get some data.


    # Your First Packet Capture


    In order to get packet data into Wireshark, you’ll perform your first packet capture.
    You may be thinking, “How am I going to capture packets when nothing is wrong
    on the network?” There are two things wrong with this statement. The first thing
    is that there is always something on the network. If you don’t believe me, go
    ahead and send an email to all of your employees and let them know that everything
    is working perfectly.'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'Secondly, there doesn''t have to be something wrongs in order for you to perform
    packet analysis. In fact, most packet spend more time analyzing problem-free traffic
    than traffic they are troubleshooting; you need a baseline to compare to in order
    to be able to effectively troubleshoot traffic. For example, if you ever hope
    to solve a problem with DHCP analyzing your traffic, you must understand what
    the working of DHCP traffic looks like. More broadly, in order to find anomalies
    in daily network activity, you must know what normal network activity looks like.
    When your network is running smoothly, you can set a baseline so that you will
    know what its traffic looks like in a normal state.


    We''ve covered the basics. Now let''s capture some packets!


    +   1. Open Wireshark.


    +   2. From the main drop-down menu, select Capture and Interfaces. You should
    see a dialog listing the various interfaces that can be used to capture packets,
    along with their IP addresses. Choose the interface you wish to use, and Capture
    (Figure 3-3).


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_53_0.png)


    Figure 3-3: Selecting an interface on which to perform your packet capture


    +   3. Your packet capture should begin and Wireshark should show the active packet
    capture window. This window displays a brief summary of the type of traffic being
    captured, as well as the duration of the current packet (Figure 3-4).


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_53_1.png)


    Figure 3-4: The Capture window shows a brief summary of the packets being captured.


