    MSS=1460 |

    | 3 | 6.033374 | 192.168.0.193 | 192.168.0.182 | TCP | 1637 - ftp [SYN] Seq=Len=0
    MSS=1460 |


    # Server


    | No. | Time | Source | Destination | Protocol | Info |

    |---|---|---|---|---||

    | 1 | 0.000000 | 192.168.0.193 | 192.168.0.182 | TCP | 1637 - ftp [SYN] Seq=Len=0
    MSS=1460 |

    | 2 | 2.992275 | 192.168.0.193 | 192.168.0.182 | TCP | 1637 - ftp [SYN] Seq=Len=0
    MSS=1460 |

    | 3 | 6.033158 | 192.168.0.193 | 192.168.0.182 | TCP | 1637 - ftp [SYN] Seq=Len=0
    MSS=1460 |


    Figure 7-20: The client and server trace are almost identical.


    There are three main reasons why the server will reject packets sent to it:


    +   * The service that is supposed to be accepting packets is not running. Because
    we know that the FTP server software is running and ready to accept connections,
    this can''t be our problem.

    * The server is experiencing a very high amount of traffic. In these situations
    the server''s buffer can become filled so that it is unable to communicate with
    all clients. Once again, this can''t be the cause of our problem, because the
    server has just been set up and is under no load whatsoever.

    * The packets are being intentionally blocked. What would intentionally block
    packets from being received by a computer? Something that is doing exactly what
    it is supposed to! After closer examination of the server, we find that the Windows
    firewall is enabled on and is blocking all traffic on FTP ports.'
