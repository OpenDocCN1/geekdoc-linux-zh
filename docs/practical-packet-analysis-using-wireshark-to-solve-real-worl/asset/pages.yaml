  md: '| No. | Time | Source | Destination | Protocol | Info |

    | --- | --- | --- | --- | --- | --- |

    | 1 | 0.000000 | 10.2.10.2 | 10.4.88.88 | ICMP | Echo (ping) request |


    Figure 7-5: A standard ping request from 10.2.10.2 to 10.4.88.88


    Examining packet 2 in Figure 7-6, you can see that it is not a type 0 packet,
    but rather a type 3 packet, which is returned when a destination you are trying
    is unreachable.


    ```

    Internet Control Message

    Type: 3 (destination unreachable)

    Code: 1 (host unreachable)

    Checksum: 0xa2 [correct]

    Internet Protocol, Src: 10.2.10.2 (10.2.10.2), Dst: 10.4.88.88 (10.4.88.88)

    Internet Control Message

    ```


    Figure 7-6: This ICMP type 3 packet is not what we expected.


    NOTE If ICMP identified the type packet, it wouldn''t give us useful information.
    But fortunately, it gives us a code number too, Code: 1 (Host unreachable). (Several
    types of ICMP packets offer codes with a bit more specific information about the
    packet.) Notice that the source IP address in packet 2 is not the size the ping
    was destined for. This is a sure sign that your request didn''t make it to its
    destination.


    The listed ICMP code (1) tells us that the ping request made to the upstream router
    or switch, but not to the destination host. When a host is unreachable, you will
    also see an ARP broadcast sent from the router or switch. A lack of response to
    this ARP broadcast means that the sending device cannot find the destination device,
    so it sends a packet back to the source computer with ICMP type 0, code 1 packet.


    # Unreachable Port


    Another task when troubleshooting is to ping a device on a specific port to ensure
    that ports that are required for certain services to run are open and accepting
    incoming communication.


    For example, you can ensure that FTP is accessible by pinging a remote computer
    on port 21. If for some reason the remote computer is not accepting incoming communication
    on port 21, it will return an ICMP type 0, code 2 packet, which means that the
    destination port is unreachable.


    Since you will most likely be using ICMP very often in your day-to-day network
    maintenance routine, you should familiarize yourself with it and some of its more
    common types and codes. (I keep a business card-sized reference in my desk; it
    never hurts to have something like that in hand.)'
