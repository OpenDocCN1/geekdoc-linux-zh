    # # The Main Window


    You''ll spend most of your time in the Wireshark main window. This is where all
    of the packets you capture are displayed and broken down into an understandable
    format. Using the packet capture you just made, let''s take a look at Wireshark''s
    main window (Figure 3-5), which contains three panes.

    The panes in the main window depend upon one another. In order to view the details
    of an individual packet in the Packet Details pane, you must first select that
    packet by clicking on it in the Packet List pane. Once you''ve selected your packet,
    you can see the exact bytes that comprise certain portion of the packet in the
    Packet Bytes pane when you click that portion of the packet in the Packet Details
    pane.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_54_0.png)


    Figure 3-5: The Wireshark main window uses a three-pane design.


    # # Packet List Pane


    The top pane, known as the *Packet List* pane, displays a table containing all
    packets in the current capture file. You''ll see columns containing the packet
    number, the relative time the packet was captured, the source and destination
    of the packet, its protocol, and some general information found in the packet.


    # # Packet Details Pane


    The middle pane, known as the *Packet Details* pane, contains a hierarchical display
    of information about a single packet. This can be collapsed and expanded to show
    all of the information collected from an individual packet.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# Packet Bytes Pane


    The lower pane, and perhaps the most confusing, is the Packet pane. This pane
    displays a packet in its raw, unprocessed form—that is, it shows the packet looks
    like as it travels across the wire. This is raw information with nothing warm
    or fuzzy to make it easier to follow.


    It is very important to understand how these different panes work with each other,
    since you will be spending most of your time working with them in the main window.


    # The Preferences Dialog


    Wireshark has several preferences that can be customized to meet your needs. Let''s
    look at some of the Wireshark''s preferences, select Edit from the drop-down menu
    and click Preferences. This would call the Preferences dialog, which contains
    several customizable options (Figure 3-6).


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_55_0.png)


    Figure 3-6: You can customize Wireshark in the Preferences dialog.


    These preferences are divided into five major sections: user interface, capture,
    printing, name resolution, and protocols.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# User Interface


    The user interface preferences determine how Wireshark presents data. You can
    change most options here according to your personal preferences, including whether
    or not to save window positions, the layout of the three main panes, the placement
    of the scrollbar, the placement of the Packet List pane columns, the fonts used
    to display the captured data, and the background and foreground colors.


    # Capture


    The capture preferences allow you to specify options related to the way packets
    are captured, including your default capture interface, whether or not to use
    promiscuous mode by default, and whether or not to update the Packet List pane
    in real time.


    # Printing


    The printing preferences section allows you to specify various options to the
    way Wireshark prints your data.


    # Name Resolution


    The preferences in the name resolution section allow you to activate features
    of Wireshark that allow it to resolve addresses into more recognizable names (including
    MAC, network, and transport name resolution) and specify the maximum number of
    concurrent name resolution requests.


    # Protocols


    The preferences in the protocols section allow you to manipulate options related
    to the capturing and display of the various protocols Wireshark is capable of
    decoding. Not every protocol has configurable preferences, but some have several
    things that can be changed. These options are best left unless you have a specific
    reason for doing so, however.


    # Packet Color Coding


    If you are like me, you may have an aversion to shiny objects and pretty colors.
    If that is the case, the first thing you probably noticed when you opened Wireshark
    were the different colors of the packets in the Packet List pane (Figure 3-7).
    It may seem like these are randomly assigned to each individual packet, but this
    is not the case.


    > NOTE Whenever I refer to traffic, you can assume I am referring to all of the
    packets displayed in the Packet List pane. More specifically, when I refer to
    it in the context of DNS traffic, I am talking about all of the DNS protocol packets
    in the Packet List pane.'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'Each packet is displayed as a certain color for a reason. For example, you
    may notice that all DNS traffic is blue and all HTTP traffic is green. The color
    coding allows you to quickly differentiate among various protocols so that you
    do not have to read the protocol field in the Packet List pane for each individual
    packet. You will find that this speeds up the time to browse through large files.


    | No. | Time | Source | Destination | Protocol | Info |

    |---|---|---|---|---|--|

    | 1 | 0000000 | 10.10.17.47 | 10.10.16.15 | DCRPC | DCRPC Request: call_id: 95
    opm_id: 09 ctx_id: 0 |

    | 3 | 0001946 | 10.10.17.47 | 10.10.16.15 | DCRPC | DCRPC Request: call_id: 96
    opm_id: 26 ctx_id: 0 |

    | 4 | 0002034 | 10.10.16.15 | 10.10.17.47 | DCRPC | DCRPC Response: call_id: 96
    ctx_id: 0 |


    Figure 3-7: Wireshark''s color coding allows for quick protocol identification.


    Wireshark makes it easy to see which colors are assigned to each protocol through
    the Coloring Rules window. In this window, follow these steps:


    +   1. Open Wireshark.


    +   2. Select **View** from the main drop-down menu.


    +   3. Click **Coloring Rules**. The Coloring Rules window should appear (Figure
    3-8), displaying a complete list of all the coloring rules defined within Wireshark.
    You can define your own coloring rules and modify existing ones.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_57_0.png)


    Figure 3-8: The Coloring Rules dialog allows you to view and modify the coloring
    of packets.'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'For example, to change the color used as the background for HTTP traffic from
    the default green to lavender, follow these steps:


    +   1. Open Wireshark and access the Coloring Rules dialog (**View \> Coloring
    Rules**).


    +   2. Find the HTTP coloring rule in the coloring rules list, and select it by
    clicking once.


    +   3. Click the **Edit** button.


    +   4. Click the **Background Color** button (Figure 3-9).


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_58_0.png)


    Figure 3-9: When editing a color filter, you can modify both foreground and background
    color.


    +   5. Select the color you wish to use on the color wheel and click **OK**.


    +   6. Click **OK** twice more to accept the changes and return to the main window.


    +   7. The main window should then reload itself to reflect the updated color
    scheme.


    As you work with Wireshark on your network, you will begin to notice that you
    work with certain protocols more than others. Here''s where color-coded packets
    can make your life a bit easier. For example, if you think there is a rogue DHCP
    server on your network handing out IP addresses, you could simply modify the coloring
    rule for the DHCP protocol so that it shows up in bright yellow or some other
    easily identifiable color. This would allow you to pick out all DHCP traffic much
    more quickly and make your packet analysis more efficient.'
