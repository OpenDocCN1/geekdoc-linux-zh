  md: '# What We Know


    This scenario presents the same case as our earlier BitTorrent example. As such,
    we know this problem is widespread and is affecting other users, as well. however,
    the other users are only reporting slow speeds when dealing with the Internet
    and net-centric applications. The edge router on our network is reporting high
    processor utilization and a large amount of inbound and outbound traffic.


    # Tapping into the Wire


    In this case, all of the symptoms of the affected computers are consistent with
    our BitTorrent example, with the exception of Tina''s computer. Not only are her
    net-centric applications slow, but her computer is dragging a bit in general.


    Because her computer is showing unique symptoms, we assume that the problem is
    related to her computer, so''s where we begin our analysis. However, with Tina''s
    computer running slowly, installing Wireshark directly on it might not be the
    best idea—her computer''s sluggishness could cause packets to be lost in the capture
    process. We''ll use port mirroring.


    # Analysis


    This capture (gnutella.pcap) is long, but looks like the BitTorrent capture, for
    the most part. As you can see in Figure 8-28, Tina''s computer, 10.1.4.176, are
    trying to communicate with different hosts outside of our network. Most of these
    attempts come back unanswered after the initial SYN or are denied by the client
    with a RST packet.


