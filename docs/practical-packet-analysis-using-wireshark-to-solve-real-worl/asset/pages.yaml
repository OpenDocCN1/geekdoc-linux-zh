  md: '# Tapping into the Wire


    Some hackers want to capture the passwords of network administrators to gain administrative
    access to a network. Others simply want to bring a network to its knees. If we
    want to access a router on the network and then do some damage. Network administrators
    are always tinkering with things, so it would be simple enough to monitor the
    communication between a network admin and a router to intercept a password.


    # Analysis


    After a while, we manage to get a capture file that contains the telnet traffic
    of the network administrator logging into the router. For the sake of this scenario,
    Figure 95 shows only the traffic relating to this particular session.


    Figure 9-15: It appears that we have found what we are looking for.


    When we discussed in Chapter 6, we noted that it typically used cleartext in its
    transmission of data. Telnet is commonly used to remotely switches, servers, and
    routers, as is here. Most of these devices have features that enable us to log
    securely, usually via SSH, but this is something that system administrators often
    neglect. Since the communication is happening in the clear, we are able to find
    the login credentials for this router with a little patience.


    Telnet is a sequential protocol, meaning that everything happens in a set series.
    Therefore, the best way to locate the login process is stepping through the Telnet
    data packets by one. As we do, we see the beginning of the authentication process
    in chapter 8, as shown in Figure 9-16.


    | Frame 8 (64 bytes on wire, 64 bytes captured) |

    | Ethernet II, Src: Ethere_31:44:a4:f0 (00:11:34:a4:f0), Dst: de37:e1:c1 (00:15:c5:37:e1:c1)
    |

    | Internet Protocol, Src: 10.100.16.1 (10.100.16.1), Dst: 10.100.18.5 (10.100.18.5)
    |

    | Transmission Control Protocol, Src port: telnet (23), Dst port: 3756 (3756),
    Seq: 6, Ack: 4, Len: 10 |

    | Telnet |


    Data: Username:


    Figure 9-16: To begin the authentication process, this packet requests a username.'
