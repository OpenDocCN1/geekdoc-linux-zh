  md: '# Summary


    You will find that many computer and network problems are not the fault of a particular
    computer or network, but rather the software running on it. In this scenario,
    a weather-tracking program had been installed on Chad''s computer, causing him
    to think it was "possessed" because his browser''s home page changed after every
    restart. By capturing and examining packets with Wireshark, we were able to uncover
    this program running silently in the background.


    Examining problems at the packet level makes troubleshooting easier because so
    little is hidden.


    # Incoming FTP


    ```

    ftpclientdenied.pcap

    ftpserverdenied.pcap

    ```


    In this scenario, let''s imagine you have just set up a new FTP server for your
    company. Clients will be connecting to this FTP server both internally and externally
    to download and upload large amounts of data. You have set up the FTP server software
    and created a generic username and password for all employees. However, for some
    reason you are trying to test the server from a remote machine, you are unable
    to access it through FTP client software.


    # What We Know


    We know that this server is brand new and has just been set up Windows Server
    2003, with all of the latest updates and service packs installed. We have verified
    that the FTP software is set correctly and is active. We have also verified that
    the client trying to connect to the FTP server is using the appropriate IP address
    and login credentials.


    # Tapping into the Wire


    Because this problem involves both a server and a client machine, we will take
    a capture file from both computers. The capture from the client will be done when
    the FTP client software tries to connect to the server. The capture from the server
    will be done at the moment the client is trying to connect to the FTP software.
    By capturing the files in this fashion, we will be able to determine whether the
    problem originates with the client or the server; then we can proceed with further
    investigation. We will install Wiresh directly on these two machines for the purpose
    of these captures.


    # Analysis


    Let''s start with the client to make sure it is initiating communication as it
    should be. Looking at the capture file ftpclientdenied.pcap (Figure 7-19), we
    see that it is doing exactly what it is doing. Being the TCP handshake process
    by issuing a SYN packet to the remote server, 192.168.0.182. However, the server
    does not respond, the client issues two more SYN packets to try and establish
    communication.'
