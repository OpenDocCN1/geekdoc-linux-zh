    our capture filter doesn''t allow it to be


    The second packet is an ARP packet that we call gratuitous ARP. A gratuitous ARP
    is an ARP broadcast-type packet that is used to ensure that no other machine on
    the network has the IP address as the machine. If you see only gratuitous ARP
    reply, that means another computer on the network has your IP address. In this
    capture we only see requests, so we are in good shape.


