  md: 'By default, the Expert Info window shows all warning, error, note, and chat
    traffic from our capture file. Since chat traffic is not usually suspect (at least
    for this purpose) we will modify the default box by selecting Error+Warn+Note
    from the drop-down box next to the Severity filter. Our new Expert Info window
    will look like Figure 8-3.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_122_0.png)


    Figure 8-3: The Expert Info window (sans chats) summarizes all of the problems
    with our download.


    Notice in Figure 8-3 that an abundance of packets in our capture file are TCP
    Window update packets. The transmission rate of data over a network is determined
    by the size of the TCP receive window. When clients are transferring data, they
    will constantly send TCP Window update packets to each other as they receive receive
    data speeds up or slows down. These packets are used to notify a client that it
    needs to increase or decrease the size of the data being transmitted. You can
    think of this as someone pressing the button on a water fountain. If the button
    is pressed too much, you will not be able to catch all of the water in your mouth,
    you must instruct the person to decrease the pressure on the button. On the flip
    side, if the person is not pressing the button hard enough, you won''t be drinking
    as much water as you could be.


    Next, we see our first problematic packets. As the download starts, we begin to
    see many TCP Previous segment lost packets, as shown in Figure 8-4.'
