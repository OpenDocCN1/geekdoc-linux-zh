  md: '# Analysis


    When you open http-client-refcap (shown in Figure 8-18) you should be able to
    immediately identify it as HTTP communication, since there is an HTTP request
    right after the initial TCP handshake. In fact, this HTTP request looks normal
    until packets 28 and 29, as you''ll see below. Step through and we can pinpoint
