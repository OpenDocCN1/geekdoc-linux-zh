    # Domain Name System


    The Domain Name System (DNS, RFC 1034) translates one of address into another—specifically,
    it translates addresses, such as www.google.com or MARKETING-PC1, into its corresponding
    IP addresses. Some form of address translation is a requirement, since Layer 3
    of the OSI model can only locate a client if it has its IP address.


    DNS translation is a very simple process, and it gets the job done using only
    two packets. The first packet is a request to your network''s local DNS server,
    and what is the IP address of www.google.com? The second packet is the response
    from that DNS server, saying that www.google.com resides on a server with an IP
    address XX.XX.XX.XXX.


    Let''s take a look at DNS in (see Figure 6-12). In DNS packet from server 192.168.0.114
    is requesting the IP address of http://www.chrissanders.org from destination 205.152.257.23.
