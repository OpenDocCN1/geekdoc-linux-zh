    |


    Figure 7-4: Windows will retransmit if five times by default.


    Now a closer look at the packets when being retransmitted in Figure 7-4. Notice
    that their sequence number (SEQ=5840) matches the ACK number of packet five at
    the bottom of Figure 7-1 (ACK=5840).


    As learned in Chapter 6, TCP relies on SEQ and ACK numbers to keep a TCP stream
    in order. Because the SEQ number in the retransmissions matches the ACK number
    of packet 5, you know that packet 5 is the packet that was lost and is now being
    retransmitted. The ability to locate the exact packet at which a TCP retransmission
    attempt begins may lead you to clues that explain exactly why a loss of connectivity
    occurred.


    # Unreachable Destinations and ICMP Codes


    When for network connectivity, one of the most commonly used tools is the ICMP
    ping utility. If you are lucky, the target will ping back successful. Unfortunately,
    you won''t get a ping response back when you''re troubleshooting; you''ll receive
    a Destination unreachable message instead. Using a packet sniffer in conjunction
    with an ICMP utility can give you a little more information than ICMP alone. Let''s
    see if we can get inside this ICMP error message to isolate the problem.


    # Unreachable Destination


    When you open the unreachable.pcap file, you''ll notice that the first packet
    in the capture is your Echo (ping) request packet (also known as an ICMP type
    8 packet) from 10.2.10.2 to 10.4.88.88, as shown in Figure 7-5.


    To verify this, look at the ICMP section of the Packet Details pane—you should
    see this packet identified as Echo (ping). Typically, you would want to receive
    an Echo (ping) reply packet (also known as an ICMP type 0 packet) in response
    to your ping.'
