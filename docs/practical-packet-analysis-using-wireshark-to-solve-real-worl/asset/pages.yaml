  md: '# 1


    # # PACKET ANALYSIS AND

    NETWORK BASICS


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_22_0.png)


    A million different things can go wrong with a computer network on any given day—from
    a simple spyware infection to a complex router configuration error—and it is impossible
    to solve every problem immediately. The best we can hope to do is be fully prepared
    with the knowledge and the tools it takes to respond to these types of issues.
    All network problems stem from the packet level, where even the prettiest-looking
    applications can reveal their horrible implementations and seemingly trustworthy
    protocols can prove malicious. To better understand and solve network problems,
    we go to the packet level where nothing is hidden from us, where nothing is obscured
    by misleading menu structures, eye-catching graphics, and untrustworthy employees.
    Here there are no secrets, and the more we can do at the packet level, the more
    we can control our network and solve problems. This is the world of packet analysis.


    This book dives into the world of packet analysis headfirst before we delve into
    network communication, so you can gain some of the basic background you''ll need
    to examine different'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'scenarios. You''ll learn how to use the features of the Wireshark packet analysis
    tool to tackle slow network communication, identify application bottlenecks, and
    track hackers through some real-world scenarios. By the time you have finished
    reading this book, you should be able to implement advanced packet analysis techniques
    that will help you solve the most difficult problems in your network.


    # # What Is Packet Analysis?


    Packet analysis, often referred to as packet sniffing or protocol analysis, describes
    the process of capturing and interpreting live data as it flows across a network
    in order to better understand what is happening on network. Packet analysis is
    typically performed by a packet sniffer, a tool used to capture raw data going
    across the network. Packet analysis can help you understand network characteristics,
    learn who is on a network, determine who or what is utilizing available bandwidth,
    identify peak network usage times, identify possible attacks or malicious activity,
    and find unsecured and bloated applications.


    There are various types of packet sniffing programs, including both free and commercial
    ones. Each program is designed with different goals in mind. A few of the more
    popular packet analysis programs are tcpdump (a command-line program), OmniPeek,
    and Wireshark (both GUI-based sniffers).


    # # Evaluating a Packet Sniffer


    There are several types of packet sniffers. When selecting the one you''re going
    to use, you should consider the following variables:


    +   - Supported protocols

    - User friendliness

    - Cost

    - Program support

    - Operating system support


    # ## Supported Protocols


    All packet sniffers can interpret various protocols. Most sniffers can interpret
    all of the most common protocols such as DHCP, IP, and ARP, but not all can interpret
    some of the more nontraditional protocols. When choosing a sniffer, make sure
    that it supports the protocols you''re going to use.


    # ## User Friendliness


    Consider the packet sniffer''s program layout, ease of installation, and general
    flow of standard operations. The program you choose should fit your level of expertise.
    If you have little packet analysis experience, you may want to avoid the more
    advanced command-line packet sniffers like tcpdump. On the contrary, if you have
    a wealth of experience, you may find a more advanced program to be a better choice.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Cost


    The great thing about packet sniffers is that there are lots of free ones that
    rival any commercial product. You should never have to pay for a packet sniffing
    application.


    # Program Support


    Even once you have mastered the basics of a sniffing program, you will still need
    occasional support to solve new problems as they arise. When evaluating available
    support, look for things such as developer documentation, public forums, and mailing
    lists. Although there may be a lack of developer support for free packet sniffing
    programs like Wireshark, the communities that use these applications will often
    make up for this. These communities of users and contributors provide discussion
    boards, wikis, and blogs designed to help you to get more out of your packet sniffer.


    # Operating System Support


    Unfortunately, not all packet sniffers support every operating system. Make sure
    that the one you choose to learn will work on all the operating systems that you
    need to support.


    # How Packet Sniffers Work


    The packet sniffing process can be broken down into three steps: collection, conversion,
    and analysis.


    # Collection


    In the first step, the packet sniffer switches the selected network interface
    into promiscuous mode. In this mode the network card can listen for all network
    traffic on its particular network segment. The sniffer uses this mode along with
    low-level access to the interface to capture the raw binary data from the wire.


    # Conversion


    In this step, the captured binary data is converted into a readable format. This
    is where the most advanced command-line driven packet sniffers stop. At this point,
    the network data is in a form that can be interpreted only on a very basic level,
    leaving the majority of the analysis to the end user.


    # Analysis


    The third and final step involves the actual analysis of captured and converted
    data. In this step the packet sniffer takes the network data, verifies its protocol
    based on the information extracted, and begins its analysis of that protocol''s
    specific features.


    Further analysis is performed by comparing multiple packets as well as various
    other network elements.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# # How Computers Communicate


    In order to fully understand packet analysis, you need to understand exactly how
    computers communicate with each other. In this section we''ll examine the basics
    of network protocols, the OSI model, network data frames, and the hardware that
    supports it.


    # ## Networking Protocols


    Modern networks are made up of a variety of different systems running on many
    platforms. To aid this communication, we use a set of common languages called
    network protocols that govern network communication. Common network protocols
    include TCP, IP, ARP, and DHCP. A protocol stack is a logical grouping of protocols
    that work together.


    A network protocol can be extremely simple or highly complex, depending on its
    function. Although the various network protocols are often drastically different,
    most have to address the following issues:


    +   - Flow control The generation of messages by the receiving system that instruct
    the sending system to speed up or slow down its transmission of data

    - Packet acknowledgment The transmission of a return message from the receiving
    system to the sending system to acknowledge the receipt of data

    - Error detection The use of codes by the sending system to verify that the data
    wasn''t damaged during transmission

    - Error correction The retransmission of data that was lost or damaged during
    the initial transmission

    - Segmentation The division of long streams of data into smaller ones for more
    efficient transfer

    - Data encryption A function that uses cryptographic keys to protect data transmitted
    across a network

    - Data compression A method for reducing the size of data transmitted across a
    network by eliminating redundant information


    # ## The Seven-Layer OSI Model


    Protocols are separated based on their functions using an industry-standard reference
    model called the Open Systems Interconnections (OSI) reference model. This model
    was originally published in 1983 by the International Organization for Standardization
    (ISO) as a document called ISO 7498.


    The OSI model divides the network communications into seven distinct layers:


    +   - Application (Layer 7)

    - Presentation (Layer 6)

    - Session (Layer 5)

    - Transport (Layer 4)

    - Network (Layer 3)

    - Data link (Layer 2)

    - Physical (Layer 1)'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'The seven layers in the hierarchical OSI model (Figure 1-1) make it much easier
    to understand network communication. The application layer at the top represents
    the actual programs we use to access network resources. The bottom layer is the
    physical layer, through which the actual network data travels. The protocols at
    each layer work together to package the data for the next layer.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_26_0.png)


    **NOTE** *The OSI model is no more than an industry-recommended standard; protocol
    developers are not required to follow it exactly. As a matter of fact, the OSI
    model is not the only networking model that exists—for example, some people prefer
    the Department of Defense (DoD) model. We''ll work around the concepts of the
    OSI model in this book, so we won''t cover the DoD model here.*


    Let''s take a broad look at the functions of each of the OSI model''s layers as
    well as some examples of the protocols used in.


    Figure 1-1: A hierarchical view of the seven layers of the OSI model


    # The Application Layer


    The *application layer*, the topmost layer on the OSI model, provides a means
    for users to actually access network resources. This is the only layer typically
    seen by end users, as it provides the interface that is the base for all of their
    network activities.


    # The Presentation Layer


    The *presentation layer* transforms the data it receives into a format that can
    be read by the application layer. The data encoding and decoding done here on
    the application layer protocol depends on is sending or receiving the data. This
    layer also handles several forms of encryption and decryption used for securing
    data.


    # The Session Layer


    The *session layer* manages the *dialog*, or session between two computers; it
    establishes, manages, and terminates this connection among all communicating devices.
    The session layer is also responsible for establishing whether a connection is
    duplex or half-duplex and for gracefully closing a connection between hosts, rather
    than dropping it abruptly.


    # The Transport Layer


    The primary purpose of the *transport layer* is to provide reliable data transport
    services to lower layers. Through features including flow control'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'and desegmentation, error control, the transport layer makes sure data gets
    from point to point error free. Because reliable transportation can be extremely
    cumbersome, the OSI model devotes an entire layer to it. The transport layer provides
    its services to both connection-oriented and connectionless protocols. Firewalls
    and proxy servers operate at this layer.


    # The Network Layer


    The network layer is responsible for routing data between physical networks, and
    it is one of the most complex OSI layers. It is responsible for the logical addressing
    of network hosts (for example, an IP address), and it also handles packet segmentation,
    protocol identification, and in some cases, error detection. Routers operate at
    this layer.


    # The Data Link Layer


    The data link layer provides a means of transporting data across a physical network.
    Its primary purpose is to provide an addressing scheme that can be used to identify
    physical devices and provide error-checking features to ensure data integrity.
    Bridges and switches are physical devices that operate at this layer.


    # The Physical Layer


    The physical layer at the bottom of the OSI model is the physical medium through
    which network data is transferred. This layer defines the physical and electrical
    nature of all hardware used, including voltages, hubs, network adapters, repeaters,
    and cabling specifications. The physical layer establishes and terminates connections,
    provides a means of sharing communication resources, and converts signals from
    digital to analog and vice versa.


    Table 1-1: Typical Protocols Used in Each Layer of the OSI Model


    | Layer | Protocol |

    | --- | --- |

    | Application | HTTP, SMTP, FTP, Telnet |

    | Presentation | ASCII, MPEG, JPEG, MIDI |

    | Session | NetBIOS, SAP, SDP, NWLink |

    | Transport | TCP, UDP, SPX |

    | Network | IP, ICMP, ARP, RIP, IPX |

    | Data Link | Ethernet, Token Ring, FDDI, AppleTalk


    # Protocol Interaction


    How does data flow up and down the OSI model? The initial data flow on a network
    begins at the application layer of the transmitting system. Data works its down
    the seven layers of the OSI model until it reaches the physical layer, at which
    point the physical layer of the transmitting system'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'sends data to the receiving system. The receiving system picks up the data
    at its physical layer, and the data proceeds to the remaining layers of the receiving
    system to the application layer at the top.

    Services provided by various protocols at given level of OSI model are not redundant.
    For example, if a protocol at one layer provides a particular service, then no
    other protocol at any other layer will provide this service. Protocols at corresponding
    layers on the sending and receiving computers are complementary. If a protocol
    on layer seven of the sending computer is responsible for encrypting the data
    being transmitted, then the corresponding protocol on layer seven of the receiving
    machine is expected to be responsible for decrypting that data. Figure 1-2 shows
    a graphical representation of the OSI model as it relates to two communicating
    clients. Here you can see communication going from top to bottom on one client
    and then reversing when it reaches the second client.


    | Application | Application |

    |--- | --- |

    | Presentation | Presentation |

    | Session | Session |

    | Transport | Transport |

    | Network | Network |

    | Data Link | Data Link |

    | Physical | Physical |


    Figure 1-2: Protocols working at the same layer on both the sending and receiving
    systems


    Each layer in the OSI model is only capable of communicating with the layers directly
    above and below it. For example, layer two can only send and receive data from
    layers one and three.


    # Data Encapsulation


    The protocols on different layers communicate with the aid of data encapsulation.
    Each layer in the stack is responsible for adding a header or footer to the data
    being communicated, and these extra bits of information allow the layer to communicate.
    For example, when the transport layer receives data from the session layer, it
    adds its own header information to that data before passing it to the next layer.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# The Protocol Data Unit


    The encapsulation process creates a protocol data unit (PDU), which includes the
    data sent and all header or footer information added to it.


    As data moves down the OSI model, the PDU changes and grows as header and footer
    information from various protocols is added to it. The PDU is in its final form
    once it reaches the physical layer, at which point it is sent to the destination
    computer. The receiving computer strips the protocol headers and footers from
    the PDU as the data climbs up the OSI layers. Once the PDU reaches the top layer
    of the OSI model, only the original data remains.


    NOTE The term packet is associated with the term Protocol Data Unit (PDU). When
    I use the word packet, I am referring to a complete PDU that includes header and
    footer information from all layers of the OSI model.


    # Network Hardware


    Now it''s time to look at network hardware, where all of the dirty work is done.
    We''ll focus on a few of the most common pieces of network hardware—specifically,
    hubs, switches, and routers.


    # Hubs


    A hub is generally no more than a box with multiple RJ-45 ports, like the Netgear
    hub shown in Figure 1-3. Hubs range from very small four-port hubs to larger 48-port
    ones designed for rack mounting in a corporate environment. Hubs are designed
    to connect network devices so that they can communicate.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_29_0.png)


    Figure 1-3: A typical four-port Ethernet hub


    A hub is nothing more than a repeating device operating on the physical layer
    of the OSI model. A repeating device simply takes packets from one port and transmits
    (repeats) to every other port on the device. For example, if a computer on port
    one of a four-port hub needs to send data to a computer on port two, the hub sends
    those packets to ports one, two, three, and four. The clients connected to ports
    three and four ignore the data because it''s not for them, and they drop (discard)
    the packets. The result is a lot of unnecessary network traffic.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'Imagine you are sending an email to the employees of a company. The email has
    the subject line Regarding all marketing staff, but instead of sending it to only
    those people who work in the marketing department, you send it to every employee
    in the company. The employees who work in marketing will know it is for them,
    and they will open it. The other employees, however, will see that it is not for
    them, and will discard it. You can see how this would result in a lot of unnecessary
    communication and wasted time—exactly how a hub functions.


    Figure 1-4 provides a graphical display of what is going on. In this figure, computer
    A is transmitting data to computer B. However, when computer A sends data to computer,
    all computers connected to the hub receive it. Only computer B actually accepts
    the data; the other computers discard it.


    One last note about hubs is that they are only capable of operating in half-duplex—that
    is, they cannot send and receive data at the same time. This differentiates them
    from switches, which are full-duplex devices that can send and receive data synchronously.


    While you won’t typically see hubs used in most modern or high-density networks
    (switches are used instead, as discussed below), you should know how hubs work,
    since they will be very important to packet analysis.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_30_0.png)


    Figure 1-4: The flow of traffic when computer A transmits data to computer B through
    a hub


    # Switches


    The best alternatives to hubs in a production or high-density network are devices
    called switches. Like a hub, a switch is designed to repeat packets, but it does
    so very differently; also like a hub, a switch provides a communication path for
    devices, but it does so more efficiently. Rather than broadcasting data to every
    individual port, a switch sends only data to the computer for which the data is
    intended. Physically speaking, a switch looks identical on the front, you may
    have trouble knowing exactly which one it is (Figure 1-5).'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'Several of the larger switches on the market are manageable via specialized,
    vendor-specific software or web interfaces. These switches are commonly referred
    to as managed switches and provide several features that can be useful in network
    management. This includes the ability to enable or disable switch ports, view
    port specifics, make configuration changes, and remotely reboot the switch.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_31_0.png)


    Figure 1-5: A rack-mountable 24-port Ethernet switch


    Switches have advanced functionality in handling transmitted packets. In order
    to be able to communicate directly with specific devices, switches must be able
    to uniquely identify devices by their addresses. All this means that they must
    operate on the data link layer of the OSI model.


    Switches store the Layer 2 address of every connected device in a CAM table, which
    acts as a kind of traffic cop. When a packet is transmitted, the switch reads
    the Layer 2 header information in the packet and, using the CAM table as reference,
    determines which port(s) to send the packet to. Switches only send packets to
    specific ports, which greatly reduces network traffic.


    Figure 1-6 shows a graphical representation of traffic flow through a switch.
    In this figure, computer A is once again sending data to computer B. In this instance,
    the computers are connected through a switch that allows computer A to send data
    directly to computer B without the other devices on the network being aware of
    this communication. Moreover, multiple conversations can happen at the same time.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_31_1.png)


    Figure 1-6: The flow of traffic when computer A transmits data to computer B through
    a switch'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Routers


    A router is an advanced network device with a much higher level of functionality
    than either a switch or a hub. A router can take many shapes and forms, but most
    have several LED indicator lights on the front and a few network ports on the
    back, depending on the size of the network (Figure 1-7). Routers operate at Layer
    3 of the OSI model, where they are responsible for forwarding packets between
    two or more networks. The process use routers to direct the flow of traffic is
    called routing.


    There are several types of routing protocols that dictate how different types
    of packets are routed to other networks. Routers commonly use Layer 3 addresses
    (such as IP addresses) to uniquely identify devices on a network.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_32_0.png)


    An way to illustrate the concept of routing is to think of a neighborhood with
    a network of streets; each street has houses on, and each house has its own address
    (Figure 1-8). You live on a street, so you can move among all houses on the street.
    This is very similar to the operation of a switch that allows communication among
    computers on a network segment. To communicate with a neighbor on another street,
    however, a person must follow the street to that neighbor’s house.


    Let’s work through an example of communication across streets. Using Figure 1-8,
    let’s say I am sitting at 503 Vine Street, and I need to get to 202 Dogwood Lane.
    In order to do this, I must cross onto Oak Street, and then onto Dogwood Lane.
    Think of this as crossing network segments. If the device at 192.168.0.3 needs
    to communicate with the device at 192.168.0.54, it must cross a router to get
    to the 10.100.1.1 network, then the destination network segment’s router before
    it can get to the destination network.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_32_1.png)


    Figure 1-8: Comparison of a routed network to neighborhood streets'
  merge: -1
  pgno: 32
- img_proc: true
  md: Multicast is a means of transmitting a packet from a single source to multiple
    destinations simultaneously. The goal of multicast is to make this process as
    simple as possible by using little bandwidth as possible. The optimization of
    this traffic lies in the number of times a stream of data is replicated in order
    to get its destination. The exact handling of multicast traffic is highly dependent
    upon its implementation in individual protocols. The primary method of implementing
    multicast is by using a special addressing
  merge: -1
  pgno: 33
- img_proc: true
  md: 'scheme that joins the packet recipients to a multicast group; this is how IP
    multicast works. This addressing scheme ensures that the packets are not capable
    of being transmitted to computers they are not destined for.


    # Unicast Traffic


    A unicast packet is transmitted from one computer directly to another. The details
    of how unicast functions depend upon the protocol you using.


    # Broadcast Domains


    Recall that a broadcast packet is one that is sent to every device on a particular
    segment. In large networks with multiple hubs or switches connected via different
    mediums, broadcast packets transmitted from one switch all the way to the ports
    on the other switches on the network, as they are repeated from switch to switch.


    The extent to which broadcast packets travel is called the broadcast domain—it
    is the network segment where any computer can directly transmit to another computer
    without going through a router. Figure 1-10 shows an example of two broadcast
    domains on a small network. Because each broadcast domain extends until it reaches
    the router, broadcast packets circulate only within this specified broadcast domain.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_34_0.png)


    Figure 1-10: A broadcast domain extends to everything behind the current routed
    segment.


    Our earlier example describing how routing relates to a neighborhood also provides
    good insight into how broadcast domains works. You can think of a broadcast domain
    as being like a neighborhood street. If you stand on your porch and yell, only
    the people on your street will be able to hear you. If you want to talk to someone
    on a different street, you have to find a way to speak to that person directly,
    rather than broadcasting (yelling) from your porch.


    The things you have learned are the absolute basics of packet analysis. You must
    understand what is going on at this level of network before you can begin troubleshooting
    network issues. In the next chapter we will build on these concepts and discuss
    more advanced network communication principles.'
  merge: -1
  pgno: 34
- img_proc: true
  md: <!-- no content -->
  merge: -1
