- img_proc: true
  md: '# 10


    # # SNIFFING INTO THIN AIR


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_156_0.png)


    The world of wireless networking is completely different from traditional (wired)
    networking. When considering wireless networking, we need to take into account
    issues like frequencies, standards, and unique security questions. Given these
    extra considerations, you can bet that the sniffing process changes completely.


    This chapter is devoted to explaining the wireless sniffing process on both Windows-
    and Unix-based systems. As we discuss what makes wireless sniffing unique, we''ll
    look at a few examples showing it in action.


    # ## Sniffing One Channel at a Time


    The first thing to understand about sniffing wireless traffic is that you can
    only sniff one wireless channel at a time. Wireless networks in the United States
    can operate on one of eleven different channels (more are available'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'internationally). Therefore, before you capture the traffic from a wireless
    client or access point, you must first identify the channel it is broadcasting
    on (Figure 10-1).


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_157_0.png)


    **Figure 10-1:** Sniffing wirelessly can be tedious, since it can only be done
    one channel at a time.


    The best way to find out which channel is being used is to channel hop. When you
    channel hop, you simply start a packet capture and switch rapidly from channel
    to channel until you see data that relates to what you are looking for. Although
    channel hopping isn''t the most technical of solutions, it works.


    # # Wireless Signal Interference


    Unfortunately, sometimes we can''t rely on the integrity of wireless communication.
    Because data is sent through the air, it is very likely that something will interfere
    with the signal. Wireless networks include features to handle interference, but
    they don''t always work. Therefore, when capturing packets over a wireless network,
    pay close attention to your environment to ensure that there are no large sources
    of interference, such as large reflective surfaces, microwaves, 2.4 GHz wireless
    phones, thick walls, and high-density surfaces.


    Along these lines, try to get as close as possible to the device you are analyzing.
    You can''t hope to capture all of the packets sent by a device you are one floor
    above it.


    # # Wireless Card Modes


    For sniffing wireless packets, it is a good idea to familiarize yourself with
    the different modes in which a wireless card can operate.


    Most users use wireless cards in managed or ad-hoc modes, but other modes include
    master mode and monitor mode. I will cover each mode below; a graphical representation
    of the way each one operates is shown in Figure 10-2.'
  merge: -1
  pgno: 157
- img_proc: true
  md: '![](img/ae85f2fa699ec68c8cd6b402e11c40d7_158_0.png)


    # Ad-Hoc Mode


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_158_1.png)


    # Master Mode


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_158_2.png)


    # Monitor Mode


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_158_3.png)


    Figure 10-2: The different wireless card modes


    # Managed mode


    Managed mode is used when your wireless client connects directly to a wireless
    access point (WAP). In these cases, the driver associated with the wireless NIC
    relies on the WAP to manage the entire communications process.


    # Ad-Hoc mode


    Ad-hoc mode is used when you have a wireless network setup in which devices connect
    directly to each other. In this mode two wireless clients want to communicate
    with each other share the responsibilities that a WAP would normally handle.


    # Master mode


    Some higher-end wireless network cards also support master mode. Master mode allows
    the wireless NIC to work in conjunction with specialized driver software in order
    to allow the computer to act as a WAP for other devices.'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# Monitor mode


    This is the most important mode for our purposes. *Monitor mode* is used when
    you want your wireless client to stop transmitting and receiving data and only
    listen to the packets flying through the air. In order for Wire-shark to capture
    packets, your wireless NIC and accompanying driver must support monitor mode.
    If you purchase a wireless network card for the purpose of analysis, be sure that
    it supports monitor mode (also known as RFMON mode).


    # Sniffing Wirelessly in Windows


    Even if you have a wireless NIC that supports monitor mode, most Windows-based
    NIC drivers won''t allow you to change into this mode. You''ll need a little extra
    hardware to get the job done.


    # Configuring AirPcap


    AirPcap (from CACE Technologies, http://www.cacetech.com) is designed to overcome
    the limitations that Windows places on wireless packet analysis. *AirPcap* is
    a small USB device (Figure 10-3) resembling a Flash drive that is designed to
    capture wireless traffic. AirPcap uses the WinPcap driver discussed in Chapter
    3 and a special client configuration utility.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_159_0.png)


    The AirPcap configuration program is simple to use; it has only a few configurable
    options. As shown in Figure 10-4, the AirPcap Control Panel gives you the following
    options:


    # Interface


    You can select the device you are using for your capture here. Some advanced analysis
    scenarios may require you to use more than one AirPcap device to sniff simultaneously
    on multiple channels.'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# Blink Led


    Clicking this button will make the LED lights on the AirPcap device blink. This
    is primarily used to identify the specific adapter you are using, if you are using
    multiple AirPcap devices.


    # Channel


    In this field, you select the channel you want AirPcap to listen on.


    # Include 802.11 FCS in Frames


    By default, some systems strip the last four checksum bits from wireless packets.
    This checksum, known as a Frame Check Sequence (FCS), is used to ensure that packets
    have not been corrupted during transmission. Unless you have a specific reason
    to do otherwise, check this box to include the FCS checksums.


    # Capture Type


    The two options are 802.11 Only and 802.11 + Radio. The 802.11 Only option includes
    the standard 802.11 packet header on all capture packets. The 802.11 + Radio option
    includes this header and also prepend it with a radiotap header, which contains
    additional information about the packet, such as data rate, frequency, signal
    level, and noise level. Choose 802.11 + Radio in order to see all available packet
    information.


    # FCS Filter


    Even if you unchecked the box next to the Include 802.11 FCS in Frames, this option
    lets you filter packets that FCS determines are corrupted. Use the Valid Frames
    option to show only those packets that can be received successfully.


    # WEP Configuration


    This area (accessible on the Keys tab) allows you enter WEP decryption keys for
    the networks you are sniffing. In order to interpret data encrypted by WEP, you
    will have to enter the correct WEP keys into this field.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_160_0.png)


    Figure 10-4: The AirPcap configuration program'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# Capturing Traffic with AirPcap


    Once you have AirPcap installed and configured, the capture process will be familiar
    to you. Just follow these steps:


    +   1. In Wireshark, select Capture ▷ Options.

    2. Select your AirPcap device in the Interface selection box, as shown in Figure
    10-5.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_161_0.png)


    Everything on this screen should look familiar to you except for the Wireless
    Settings button. Clicking this button will give you the same options that the
    AirPcap utility gave you, as shown in Figure 10-6. Because Wireshark is completely
    integrated with AirPcap, anything configured in the client can also be configured
    from Wireshark.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_161_1.png)


    140 Chapter 10'
  merge: -1
  pgno: 161
- img_proc: true
  md: '+   3. Once you have everything configured to your liking, begin capturing
    packets by clicking the Start button.


    # # Sniffing Wirelessly in Linux


    Sniffing in Linux is simply a matter of enabling monitor mode on the wireless
    NIC and firing up Wireshark. Unfortunately, the procedure for enabling monitor
    mode differs with each model of wireless NIC, so I can''t offer a definitive guide
    for it. Your best bet is to do a quick Internet search for your NIC model for
    specific details.


    One of the more common ways to enable monitor mode in Linux is through its-in
    wireless extensions. You can access these wireless extensions with the iwconfig
    command. If you type iwconfig over the console, you should see results like this:


    ```

    $ iwconfig

    Eth0 no wireless extensions

    Lo0 no wireless extensions

    Eth1 IEEE 802.11g SSID:"Tesla Wireless Network"

    Mode:Managed Frequency:2.462 GHz Access Point:00:02:2D:8B:70:2E

    Rate:54 Mb/s Tx-Power=20 dBm Sensitivity=8/0

    Retry Limit:7 RTS thr:off Fragment thr:off

    Power Management:off

    Link Quality:75/100 Signal level=-71 dB Noise level=-86 dB

    Rx invalid hw:0 Rx invalid crypt:0 Rx invalid frag:0

    Tx excessive retries:0 Invalid misc:0 Missed beacon:2

    ```


    The output of the iwconfig command shows that the Eth1 interface can be configured
    wirelessly. This is apparent because it shows data for the 802.11g protocol, whereas
    the interfaces Eth0 and Lo0 return the phrase no wireless extensions.


    Along with all of the information this command provides, as the wireless card
    mode and frequency, notice that the second line under Eth1 shows that the mode
    is currently set to Managed. This is what we want to change.


    In order to change the Eth1 interface to monitor mode, you must be logged in as
    the root user, either directly or via the switch user (su) command, shown here.


    ```

    $ su

    Password:<enter root password here>

    ```


    Once you''re root, you can type commands to configure the wireless interface options.
    To configure Eth1 to operate in monitor mode, type


    ```

    $ iwconfig eth1 mode monitor

    ```'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'Once monitor mode, running the iwconfig command again should reflect your changes.
    Now ensure that the Eth1 interface is operational by typing


    ```

    # iwconfig eth1 up

    ```


    We''ll also use the iwconfig command to perform the channel-hopping process discussed
    earlier in this chapter. Change the channel of the Eth1 interface by typing


    ```

    # iwconfig eth1 channel 3

    ```


    You can do this on-the-fly as you are capturing packets, so don''t hesitate to
    change channels at all. This command can also be scripted using various Linux
    scripting languages to make the process easier.


    Once you have completed these configurations, start Wireshark and begin your packet
    capture.


    # 802.11 Packet Extras


    8021traffic.pcap


    The main difference between the packet structure of a wireless packet and that
    of a standard packet is the addition of an 802.11 header. This header contains
    extra information about the packet and the medium used to transmit it, as shown
    in Figure 10.


    | Frame 1 (132 bytes by wire, 112 bytes captured) |

    | --- |

    | IEEE 802.11 |

    | Type/Subtitle: Beacon frame (8)

    | Frame control: 0x0080 (Normal)

    | Duration: 0

    | Destination address: Broadcast (ff:ff:ff:ff:ff:ff)

    | BSS ID: D-Link:00:ff:22:ba (00:13:46:08:22:ba)

    | Sequence number: 1352

    | Fragment number: 0

    | IEEE 802.11 wireless management frame


    Figure 10-7: The 802.11 header contains extra wireless information about the packets.


    To examine the packet shown in Figure 10-7 more closely, open the 8021traffic.pcap
    example file. Let''s look at some of the interesting items in this header:


    **Type/Subtitle** specifies the type or subtype of the 802.11 packet shown. The
    type can be either management, data, or control.


    Each type can also have a subtype. For example, the subtype of management packets
    can be beacon frame, authentication request, or disassociation notice.'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'Destination Address, Source Address, and BSS Id These fields contain the source,
    destination, and BSS addresses of the packet.


    Fragment Number and Sequence Number These numbers are used to place the wireless
    packets in the appropriate order, similar to the way TCP assembles streams.


    # 802.11 Flags


    The 802.11 header packet also contains a Flags section with even more wireless-specific
    information, as shown in Figure 10-8.


    ```

    FLAGS:0x0

    DS status: Not leaving DS or network is operating in AD-HOC mode

    0.. = More Fragments: This is the last fragment

    0... = Retry: Frame is not retransmitted

    0... = PWR MGT: Sta will stay up

    0.. = More Data: No data buffered

    0.. = Protected Flag: Data is not protected

    0... = Order Flag: Not strictly ordered

    ```


    Figure 10-8: The Flags section contains more wireless-specific information.


    The Flags section includes these fields:


    **DS Status** The distribution status (DS) field is used to determine which the
    packet is traveling. If the From DS is 1 and the To DS is 0, the packet is traveling
    from the WAP to the wireless client. If the values are the reverse, the packet
    is traveling from the wireless client to the WAP. If both numbers are 0, that
    usually means the packet is being broadcast from the WAP.


    **More Fragments** This field is used when additional packets are required in
    order to read the packet being sent.


    **Retry** The Retry option indicates whether or not the packet being transmitted
    is from the original transmission attempt (0) or a retransmission (1).


    **PWR MGT** This field indicates whether or not a client is going into a power-saving
    state.


    **More Data** This field is used by a WAP to inform a client that more packets
    are waiting to be sent to it.


    **Protected Flag** This field is used to show whether or not a packet is using
    data encryption.


    **Order Flag** The Order field is used to inform the recipient that the packet
    must be kept in a particular order, which prevents the recipient from reorganizing
    packets in order to increase throughput performance.


    # The Beacon Frame


    The beacon frame is one of the most informative packets in a wireless transmission.
    A beacon frame is sent as a broadcast packet from a WAP across a wireless channel
    to notify any listening wireless clients that the WAP is'
  merge: -1
  pgno: 164
- img_proc: true
  md: 'available and define the parameters that must be set in order to connect it
    to. Therefore, this type of broadcast packet contains a lot of useful information,
    as shown in Figure 10-9.


    | Frame 1 (132 bytes bytest, 132 bytes captured) |

    | IEEE 802.11 |

    | Type/Subtype: Beacon frame (8)

    Frame Control: 0x0080 (normal)

    Duration: 0

    Destination address: broadcast (ff:ff:ff:ff:ff:ff)

    Source address: D-Link_0b:22ba (00:13:36:02:22ba)

    SSID: d-Link_0b:22ba (00:13:36:02:22ba)

    Fragment number: 0

    Sequence number: 1352

    IEEE 802.11 wireless LAN management frame |


    Figure 10-9: This beacon frame tells you everything you ever want to know about
    the WAP.


    Some of the information that you might see in a beacon frame includes the following:


    +   **SSID parameter set** This is the SSID that the WAP is broadcasting.

    **Supported rates** This lists the supported rates of throughput provided by the
    WAP and specifies whether the protocol used is 802.11b or 802.11g.

    **DS parameter set** This shows the channel the WAP is broadcasting on.

    **Extended supported rates** This shows other supported rates provided by the
    WAP.

    **Vendor-specific information** This section shows vendor-specific information
    about the WAP, including the chipset manufacturer, tag number, and tag length.
    (Note that the chipset manufacturer is not always the same as the WAP manufacturer.)


    # # Wireless-Specific Columns


    Wireshark typically shows six individual columns in the Packet List pane, all
    of which should look familiar to you. However, due to the added overhead when
    analyzing and interpreting wireless packets, Wireshark displays two very useful
    columns: RSSI and Tx Rate. The Received Signal Strength Indication (RSSI) column
    shows the radio frequency (RF) signal strength of a captured packet, while the
    Tx Rate column shows the data rate of a captured packet, as shown in Figure 10-10.
    Both indicators can be of great help when you are troubleshooting wireless connections.
    In fact, even if your client software shows you excellent signal strength, doing
    a capture with these columns enabled can show you a number that may or not support
    that claim.


    | No.- | Time | Source | Destination | Protocol | Tx Rate RSSI |


    Figure 10-10: These two additional columns make a big difference in how you look
    at things during analysis.'
  merge: -1
  pgno: 165
- img_proc: true
  md: 'To add these columns to the Packet List pane, follow these steps:


    +   1. Choose **Edit ▸ Preferences**.

    2. Navigate to the Columns section and click New.

    3. Type **RSSI** in the Title field, and select **IEEE 802.11 RSSI** in the Format
    drop-down box.

    4. Repeat this process for the TX Rate column, titling it appropriately and selecting
    **IEEE 802.11 TX Rate** in the Format section. Figure 10-11 shows what this window
    would look like after you added information for both columns.

    5. Click **OK** in the Preferences dialog to save your changes.

    6. Restart Wireshark to display the new columns.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_166_0.png)


    Figure 10-11: Adding the IEEE wireless-specific columns to the Packet List pane


    # Wireless-Specific Filters


    We discussed the benefits of capture filters in Chapter 4. In a wired infrastructure,
    it is easier to filter the traffic you want to capture, since each device has
    its own dedicated channel. In a wireless network, all traffic generated by wireless
    clients coexists on shared channels, which means that a capture of any one channel
    may contain traffic from clients. This section is devoted to some packet filters
    that can be used to help find the traffic you want.'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'Each WAP in a network has a unique identifying name called its Basic Service
    Set Identifier (BSS Id). This name is sent in every wireless management and data
    frame the access point transmits. (See “802.11 Packet Extras” on page 142.)


    Once you know the name of the BSS Id you want to examine, you all really have
    to find a packet that has been sent from that particular WAP. Wireshark shows
    the transmitting WAP in the Info column of the Packet List, so finding this information
    is typically pretty easy.


    Once you have a packet from the particular WAP you want, find its BSS Id field
    in the 802.11 header, as shown in Figure 10-9. This is the address you will filter
    on.


    After you have found the BSS MAC address (listed in the Packet Details pane) you
    can use the filter wlan.bssid.eq 00:11:23:44:55:66 to show only the traffic flowing
    through that particular WAP.


    Earlier in this chapter, we discussed the different types of wireless packets
    you can see on a network. You will often need to be able to filter based upon
    these types and subtypes. Use Table 10-1 as a reference to help you build the
    filters you need.


    Although management packets are very important for some types of analysis, analysis
    may only require looking at the data being passed through the air—for instance,
    if we need to track rogue wireless clients or identify the possibility of unwanted
    information disclosure over the wireless network. Therefore, we need to know how
    to filter only data packets.


    To filter out all but the data packets in a capture file, use the filter wlan.fc.type
    eq 2. (If you reference Table 10-1, you will see that a packet of type 2 will
    show all data pertaining to the data frames.)


    The only downside to using this filter is that it still allows for display of
    NULL packets. These packets are used by certain WAPs and wireless NICs to alert
    the network that they are about to switch channels. If you don''t need to see
    these NULL packets, filter them out by expanding the filter we created earlier
    and removing the NULL packet subtype. The filter looks like this completed:


    Differentiating between unencrypted and encrypted data is a great way to identify
    rogue WAPs on a network or to determine whether sensitive information is being
    sent in cleartext.'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# Table 10-1; Wireless Types/Subtypes and Associated Filter Syntax


    | Frame Type/Subtype | Filter Syntax |

    |---|---|

    | Management frames | wlan.fc.type eq 0 |

    | Control frames | wlan.fc.type eq 1 |

    | Data frames | wlan.fc.type eq 2 |

    | Association request | wlan.fc.type_subtype eq 0 |

    | Association response | wlan.fc.type_subtype eq 1 |

    | Reassociation request | wlan.fc.type_subtype eq 2 |

    | Reassociation response | wlan.fc.type_subtype eq 3 |

    | Probe request | wlan.fc.type_subtype eq 4 |

    | Probe response | wlan.fc.type_subtype eq 5 |

    | Beacon | wlan.fc.type_subtype eq 8 |

    | Disassociate | wlan.fc.type_subtype eq 10 |

    | Authentication | wlan.fc.type_subtype eq 11 |

    | Deauthentication | wlan.fc.type_subtype eq 12 |

    | Action frames | wlan.fc.type_subtype eq 13 |

    | Block ACK requests | wlan.fc.type_subtype eq 24 |

    | Block ACK | wlan.fc.type_subtype eq 25 |

    | Power save poll | wlan.fc.type_subtype eq 26 |

    | Request to send | wlan.fc.type_subtype eq 27 |

    | Clear to send | wlan.fc.type_subtype eq 28 |

    | ACK | wlan.fc.type_subtype eq 29 |

    | Contention free period end | wlan.fc.type_subtype eq 30 |

    | NULL data | wlan.fc.type_subtype eq 36 |

    | QoS data | wlan.fc.type_subtype eq 40 |

    | Null QoS data | wlan.fc.type_subtype eq 44 |


    Recall the Protected flag from the section "802.11 Flags" on page 143; it is the
    flag to identify a packet as being encrypted or unencrypted. We base our filter
    on this flag.

    Recall that the Protected flag bit is set to 0 when no encryption is being used
    and is set to 1 if the packet is encrypted with a protocol such as WEP, TKIP,
    and so on. Therefore, using a filter of


    ```

    wlan.fc.protected eq 0

    ```


    will us all packets that are not encrypted. By the same token, a filter of


    ```

    wlan.fc.protected eq 1

    ```


    will show only encrypted traffic.'
