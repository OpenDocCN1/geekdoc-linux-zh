    # Summary


    The errors you run into will be fine due to misconfigurations. When possible,
    compare a machine that works properly with the one that doesn''t to see if you
    can pinpoint the exact problem. In the preceding scenario we were able to pinpoint
    the packet in which things did not match up. Once you can narrow down your problem,
    you will have a much easier time fixing it.


    # The Ghost in Internet Explorer


    hauntedbrowser.pcap This scenario begins with a disturbing call to the help desk
    from a user on your network Chad. According to Chad, his computer has recently
    been host to a demonic possession. Despite his efforts, the home page on his Internet
    browser keeps changing itself to point to various weather sites. Even if he manually
    changes it back to what it should be, his changes are reversed after he reboots
    his computer. Your goal is to get to the bottom of this “possession” and to perform
    an exorcism of the ghosts that have invaded Chad''s computer.


    # What We Know


    Chad has been with our company quite a while and he does not have a great deal
    of technical expertise. In fact, he usually does more harm than good. (I don''t
    suppose you know any users like that, do you?) From a technical standpoint, we
    know that Chad''s computer is about two years old, runs the Windows XP operating
    system, and uses Internet Explorer 6 as his browser.


    # Tapping into the Wire


    Because this problem occurs on only Chad''s computer, we know that the only machine
    we should have to capture packets from Chad''s. Also, because it seems that Chad''s
    home page resets every time he reboots his computer, we''ll perform our capture
    at boot time.


    In this case, we can''t install Wireshark directly onto Chad''s machine and capture
    the packets we need, so hubbing out is a good method to use. If you don''t remember
    how this technique is administered, please refer to our discussion about it in
    “Hubbing Out” on page 19. The capture will start as soon as the computer is turned
    on and will stop as soon as it is completely booted up; no user interaction is
    required.'
