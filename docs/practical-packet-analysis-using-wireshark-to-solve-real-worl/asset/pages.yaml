- img_proc: true
  md: '# # 4

    # WORKING WITH CAPTURED PACKETS


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_60_0.png)


    Now that you''ve performed your first packet capture, we''ll cover a few more
    basic concepts that you need to know about working with those captured packets
    in Wireshark. This includes finding and marking packets, saving capture files,
    merging capture files, printing packets, and changing time display formats.


    # ## Finding and Marking Packets


    Once you really get into doing packet analysis, you will eventually encounter
    scenarios involving a very large number of packets. As the number of these packets
    grows into the thousands and even millions, you will need to be able to navigate
    through packets more efficiently. This is the reason Wireshark allows you to find
    and mark packets that match certain criteria.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# Finding Packets


    To find packets that match particular criteria, open the Find Packet dialog (shown
    in Figure 4-1) by selecting **Edit** from the main drop-down menu and then clicking
    **Find Packet** or pressing CTRL-F on your keyboard.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_61_0.png)


    Figure 4-1: Finding packets in Wireshark based on specified criteria


    This dialog offers three options for finding packets: display filter, hex value,
    or string. The display filter option allows you to enter an expression-based filter
    that will only find packets that satisfy that expression (this will be covered).
    The hex and string value searches for packets with a hexadecimal or text you specify;
    you can see examples of all these in Table 4-1. Other options include the ability
    to select the window in which you want to search, the character set to use, and
    the direction in which you wish to search.


    Table 4-1: Examples of Various Search Types for Finding Packets


    | Search Type | Example |

    |--- | : |

    | Display filter | not ip, ip address=192.168.0.1, arp |

    | Hex value | 00:ff:ff:00:ab:b1:f0 |

    | String | Workstation1, UserB, domain |


    Once you''ve made your selections, enter your search string in the text box, and
    click **Find** to find the first packet that meets your criteria. To find the
    next matching packet, press CTRL-N, or find the previous matching packet by pressing
    CTRL-B.


    # Marking Packets


    Once you have found the packets that match your criteria, you can mark them of
    particular interest. Marked packets stand out with a black background and white
    text, as shown in Figure 4-2. You can also sort out marked packets when saving
    packet captures.) There are several reasons you might want to mark a packet, including
    being able to save those packets separately, or to be able to find them quickly
    based upon the coloration.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '| No. | Time | Source | Destination | Protocol | Info |

    |---|---|---|---|---||

    | 1 | 0.000000 | 10.100.17.47 | 10.100.16.15 | ICMP | Request: call_id: 95; 69
    ctx_id: 0 |

    | 2 | 0.000361 | 10.100.16.15 | 10.100.17.47 | ICMP | Response: call_id: 93 ctx_id:
    0 |


    Figure 4-2: Comparison of a marked packet to an unmarked packet. They will be
    highlighted in different colors on your screen. In this example, packet 1 is marked.


    To mark a packet, right-click in the Packet List pane and choose Mark Packet from
    the pop-up, or single click a packet in the Packet List pane and press CTRL-M
    to mark it. To unmark a packet, toggle this setting off using CTRL-M again. You
    may mark as many packets as you wish in a capture. You can jump forward and backward
    between marked packets by pressing SHIFT-CTRL-N and SHIFT-CTRL-B, respectively.


    # # Saving and Exporting Capture Files


    As you perform packet analysis, you will find that a good portion of the analysis
    you do happen after your capture. Usually, you will perform several captures at
    various times, save them, and analyze them all at once. Therefore, Wireshark allows
    you to save your captures to be analyzed later.


    # ## Saving Capture Files


    To save a packet capture, select File from the drop-down menu and click Save As,
    or press SHIFT-CTRL-hyphen. You should see the Save File As dialog (Figure 4-3).
    Here you will be prompted for a location to save your packet capture and for the
    file format you wish to use. If you do not specify a file format, Wireshark will
    use the default .pcap file format.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_62_0.png)


    Figure 4-3: The Save File As dialog allows you to save your packet captures.


    Working with Captured Packets 41'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'One of the more powerful features of the Save As File dialog is the ability
    to save a specific packet range. You can choose to save only packets in a specific
    number range, marked packets, or packets visible as the result of a display filter.
    This is a great way to thin bloated packet captures.


    # Exporting Capture Data


    You can export your capture capture into several different formats for viewing
    in other mediums or for importing into other packet-analysis tools. Forms include
    plaintext, PostScript, comma-separated value (CSV), and XML. To export your packet
    capture, choose File > Export, and it will prompt you with a Save As window containing
    options related to that specific format.


    # Merging Capture Files


    Certain types of analysis require the ability to merge multiple capture files,
    and luckily, Wireshark provides two different methods for doing this.

    to merge a capture file, follow these steps:


    +   1. Open one of the capture files you want to merge.

    2. Choose File > Merge to merge the Merge with Capture File dialog (Figure 4-4).

    3. Select the new file you wish to merge into the already open file, and then
    select the selected file to the currently open file, append it, or merge the selected
    files chronologically based on their timestamps.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_63_0.png)


    Chapter 4'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'Alternately, if you want to merge several files quickly in chronological order,
    consider using drag and drop. To do so, open the first capture file in Windows
    Explorer (or whatever preferred file browser may be). Then browse to the second
    file, click it, and drag it into the Wireshark window.


    # Printing Packets


    Although most analysis will take place on the computer screen, you will still
    find the need to print captured data. To print captured packets, open the Print
    dialog by choosing File Print from the main menu (Figure 4-5).


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_64_0.png)


    Figure 4-5: The Print dialog allows you to print the packets you specify.


    You can print the captured data as plaintext, PostScript, or to print an output
    file. With the Save File As dialog, you can specify that it print a specific packet
    range, marked packets only, or packets displayed as the result of a filter. You
    can also select which of Wireshark''s three main panes to print for each packet.
    Once you have selected the options you want, simply click Print.


    # Time Display Formats and References


    Time is the essence—especially in packet analysis. Everything that happens on
    a network is time sensitive, and you will need to examine trends and latency in
    nearly every capture file. Wireshark recognizes the importance of time and supplies
    us with several configurable options relating to it. We take look at time display
    formats and references.


    # Time Display Formats


    Each packet that Wireshark captures is given a timestamp, which is applied to
    the packet by the operating system. Wireshark can show the absolute timestamp
    as well as the time in relation to the last captured packet and the beginning
    and end of the capture.'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'The options related to the time display are shown under the View Heading on
    the main menu. The Time Display Format section (shown in Figure 4-6) lets you
    configure the presentation format as well as the precision of the time display.
    The presentation format option lets you choose various options to Automatic or
    by setting such as seconds, milliseconds, microseconds, and so on. We will be
    changing these options very often later in the book, you should familiarize yourself
    with them soon.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_65_0.png)


    Figure 4-6: We will revisit the time display format options.


    # Packet Time Referencing


    Packet time referencing allows you to configure a certain packet so that subsequent
    calculations are done in relation to that specific packet. This feature is particularly
    handy when you are examining multiple requests in one capture file and to see
    times in reference to each individual request.


    To set a reference for a packet, select the reference packet in the Packet List,
    then choose **Edit + Set Reference** from the main menu. Or, select the reference
    packet and press CTRL-T on your keyboard. To remove a reference from a certain
    packet, select the packet and complete the aforementioned process second.


    When you use a reference on a particular packet, the time column in the Packet
    List will display "REF" (Figure 4-7).


    Chapter 4'
  merge: -1
  pgno: 65
- img_proc: true
  md: '| No. | Time | Source | Destination | Info |

    | --- | --- | --- | --- | --- |

    | 3 | 0.001263 | 10.100.18.5 | 10.100.16.1 | TCP, 3756 > telnet [ACK] Seq=1 win=65535
    len=0 |

    | 4 * REQ | | | | |

    | 5 | 0.000558 | 10.100.18.5 | 10.100.16.1 | TELNET Data |

    | 6 | 0.001018 | 10.100.16.1 | 10.100.18.5 | TELNET Telnet Data ... |


    Figure 4-7: A packet with the packet time reference enabled


    > NOTE

    Setting a packet time reference is only useful when the time display format of
    a capture is set to display the time relation to the beginning of the capture.
    Any other setting will produce no usable results and create a set of times that
    can be very confusing.


    # # Capture and Display Filters


    Earlier we discussed saving packets based on filters. Filters allow us to show
    only particular parts in a given capture. We can create and use an expression
    to find exactly what we want in the largest of capture files. An expression is
    no more than a string of text that tells Wireshark how to show and what not to
    show.


    Wireshark offers two types of filters: capture filters and display filters.


    # ## Capture Filters


    Capture filters are used during the actual packet capturing process, and are applied
    by WinPcap. Knowledge of their syntax can be useful in other network analysis
    programs, as well. You can configure them in the Capture Options dialog where
    you can specify which traffic you want or don''t want to be captured.


    One way to use a capture filter would when capturing traffic on a server with
    multiple nodes. For example, suppose you are troubleshooting an issue with a service
    running on port 262. If the server is running several different services on a
    variety of ports, finding and analyzing only the traffic on port 262 can be a
    job in itself. To capture only the port 262 traffic, you can use a capture filter.
    Just follow these steps:


    +   1. Open the Capture Options dialog (Figure 4-8), select the interface you
    wish to capture packets on, and choose a capture filter.

    2. You can apply the capture filter by typing an expression next to the Capture
    Filter button or by clicking the button itself, which will start the capture filter
    expression builder that will aid you in creating your filter. We want our filter
    to show only traffic inbound and outbound to port 262, so we type `port 262`,
    as shown in Figure 4-8.

    3. Once you have set your filter, click Start to begin the capture. After collecting
    an adequate sample, you should now only see the port 262 traffic and be able to
    more efficiently analyze this particular data.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '![](img/ae85f2fa699ec68c8cd6b402e11c40d7_67_0.png)


    Figure 4-8: Creating a capture filter in the Capture Options dialog


    # # Display Filters


    A display filter is it that is applied to a capture file once it has been created,
    that it tells it to display only packets that match that filter. You can enter
    a display filter in the filter text box above the Capture List pane.


    Display filters are more commonly used than capture filters because they allow
    you to filter packet data without actually omitting the rest of the data in the
    capture file. That way, if you need to revert back to the original capture, you
    can simply clear the filter expression.


    You might use a display filter to clear irrelevant broadcast traffic from a capture
    filter—for instance, to clear ARP broadcasts from the Packet List pane when these
    packets don''t relate to the current problem being analyzed, However, because
    those ARP broadcast packets may be useful later, it''s better to filter them temporarily
    than to delete them altogether.


    To filter out all ARP packets in the capture window, follow these steps:


    +   1. Navigate to the top of the Capture List pane and place your cursor in the
    Filter text box.


    +   2. Type **arp** and press ENTER to remove all ARP packets from the Packet
    List pane (Figure 4-9). To remove the filter, clear the textbox and press ENTER
    again.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_67_1.png)


    Figure 4-9: Creating a display filter using the Filter text box above the Packet
    List pane.'
  merge: -1
  pgno: 67
- img_proc: true
  md: '# The Filter Expression Dialog (the Easy Way)


    The Filter Expression dialog (Figure 4-10) is a feature that makes it easy for
    novice Wireshark users to capture and display filters. To access this dialog,
    click the **Capture Filter** button in the Capture Options dialog and then click
    the **Expression** button.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_68_0.png)


    Figure 4-10: The Filter Expression dialog allows for easy creation of filters
    in Wireshark.


    The first thing you will notice in the Filter Expression dialog is a list of all
    possible protocol fields on the left side of the window. These fields specify
    all possible filter criteria. To create a filter, follow these steps:


    +   - To view the specific fields associated with a protocol, expand that protocol
    by clicking the plus (+) symbol next to. Once you find the criteria to base your
    filter on, select it by clicking it.

    - Select the field that you have selected to have the criteria value you specify.
    This relation is specified in terms of equal to, greater than, less than, and
    so on.

    - Create your filter expression by specifying a criteria value that will relate
    to the field you selected. You can define this value or select it from pre-defined
    values programmed into Wireshark.

    - Once you have done this, click **OK** to view the completed text-only version
    of the filter you have just created.


    # The Filter Expression Syntax Structure (The Hard Way)


    The Filter Expression dialog is great for novice users, but once you get the hang
    of things, you will find that manually typing filter expressions increases their
    efficiency.'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'The display filter expression syntax structure is very simple, yet it is extremely
    powerful. This language is specific to Wireshark. Let''s look at how this filter
    syntax works and some examples of what we can do with it.


    # Filtering Specific Protocols


    You will often use a capture or display filter to filter based on a specific protocol.
    For example, say you are troubleshooting a TCP problem and you want to see only
    TCP traffic in a capture file. If so, simply using a filter of tcp will get the
    job done.


    Now let''s look at things from the other side of the fence. Imagine that in the
    course of troubleshooting your TCP problem, you have used the ping utility a bit,
    thereby generating a lot of ICMP traffic. You could remove this ICMP traffic from
    your capture file with the filter icmp.


    # Comparison Operators


    Comparison operators allow us to compare values. For example, when troubleshooting
    TCP/IP networks, they will allow you to view all packets referencing a particular
    IP address. In a case like this, the equals (==) comparison operator allow you
    to create a filter showing all packets with an IP address of 192.168.0.1 using
    a filter expression ip.addr==192.168.0.1.


    Or, consider this advanced example of a comparison operator. Imagine a scenario
    where we need to view the packets less than 128 bytes in length. We can use the
    less or equal to (<=) operator to accomplish this goal in a filter expression
    like frame.pkt_len <= 128.


    You''ll find a complete list of Wireshark''s comparison operators in Table 4-2.


    Table 4-2: Wireshark Filter Expression Comparison Operators


    | Operator | Description |

    |---|---|

    | == | Equal to |

    | != | Not equal to |

    | > | Greater than |

    | < | Less than |

    | >= | Greater than or equal to |

    | <= | Less than or equal to |


    # Logical Operators


    Logical operators allow us to combine multiple filter expressions into one single
    statement. You can use logical operators to dramatically increase the effectiveness
    of your filters.


    For example, consider our previous example of displaying only packets referencing
    a certain IP address, and now assume we are interested in two IP addresses. We
    can use the or operator to create one expression that will'
  merge: -1
  pgno: 69
- img_proc: true
  md: 'display packets containing either IP address. The syntax of this expression
    would be ip.addr=192.168.0.1 or ip.addr=192.168.0.2. You''ll find a complete list
    of Wireshark''s logical operators in Table 4-3.


    # Table 4-3: Wireshark Filter Expression Logical Operators


    | Operator | Description |

    | --- | --- |

    | and | Both conditions must be true |

    | or | Either one of the conditions must be true |

    | xor | One and only one condition must be true |

    | not | Neither one of the conditions is true |


    # Sample Filter Expressions


    Although the concepts related to creating filter expressions are fairly simple,
    you will need to reference several specific keywords and operators when creating
    filters for various problems. Because this book is not intended as a Wireshark
    user manual, we won''t cover all of those expressions and operators, but you will
    find information on them at the Wireshark website. Table 4-4 gives you an idea
    of some sample filter expressions.


    # Table 4-4: Sample Capture and Display Filter Expressions


    | Expression | Description |

    | --- | --- |

    | host www.example.com | Displays all traffic from the host www.example.com |

    | host www.example.com and not (port 80) | Displays all non-web traffic from the
    host www.example.com |

    | dns | Shows everything except DNS traffic |

    | not broadcast and not multicast | Only shows unicast traffic |

    | ip.dst=192.168.0.1 | Shows all traffic destined for 192.168.0.1 |


    # Saving Filters


    Once you begin creating lots of capture and display filters, you will find that
    you use certain ones frequently. Fortunately, you don''t need to type these in
    each time you want to use them; Wireshark lets you save for later use.


    To save your custom filter, follow these steps:


    +   1. Select **Capture Filters** to open the Display Filter dialog (Figure 4-11).

    2. Create a new filter by clicking the **New** button on the left side of the
    screen.

    3. Type a name for your filter in the box next to the words *Filter name*.

    4. Type the actual filter in the box next to the words *Filter string*.'
  merge: -1
  pgno: 70
- img_proc: true
  md: '+   5. Once you have finished, click the Save button to save your filter expression
    in the list.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_71_0.png)


    Wireshark also includes several built-in filters, but these are just to give you
    an example of what a filter should look like. You will want to use them when you
    are creating your own filters, however, because they are great for reference purposes.'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# 5


    # ADVANCED WIRESHARK

    FEATURES


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_72_0.png)


    Once you master the basic concepts of Wireshark, you will probably want to delve
    further into some of its more advanced features. In this chapter we''ll look at
    some of these powerful features, including name resolution, protocol dissection,
    and packet reassembly.


    # Name Resolution


    Network data is transported via various alphanumeric addressing systems that are
    often too long or complicated to remember, as the physical hardware address 00:16:CE:6E:8B:24.
    Name resolution (also called name lookup) is the process a protocol uses to convert
    one identifying into another. For example, a computer might have the physical
    address 00:16:CE:6E:8B:24, the DNS and ARP protocols allow us to see its name
    as Marketing-2. By associating easy-to-read names with these cryptic addresses,
    we make them easier to remember and identify.'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'We can leverage various name resolution tools to make our capture files more
    readable and to save a lot of time in certain situations. For example, we can
    use DNS name resolution to help readily identify the name of a computer we are
    trying to pinpoint the source of a particular packet.


    # Types of Name Resolution Tools in Wireshark


    There are three types of name resolution available in Wireshark: MAC name resolution,
    network name resolution, and transport name resolution.


    # MAC Name Resolution


    MAC name resolution uses the ARP protocol to attempt to convert Layer 2 MAC addresses,
    such as 00:09:5B:01:02:03, into Layer 3 addresses, such as 100.10.12.1. If attempts
    at these conversions fail, Wireshark''s last resort is to convert the first three
    bytes of the MAC address into the device''s IEEE-specified manufacturer name,
    such as Netgear:01:02:03.


    # Network Name Resolution


    Network name resolution attempts to convert a Layer 3 address, such as the IP
    address 192.168.1.50, into an easy-to-read DNS name such as MarketingPC1.


    # Transport Name Resolution


    Transport name resolution attempts to convert a port number into a name associated
    with it. An example of this would be to display port 80 as http.


    # Enabling Name Resolution


    To enable name resolution, open the Capture Options dialog (shown in 5-1) either
    by choosing Capture > Options or by pressing CTRL-K.


    | Name Resolution |

    |---||

    | [x] Enable MAC name resolution |

    | [ ] Enable network name resolution |

    | [ ] Enable transport name resolution |

    | | Start | Cancel |


    > Figure 5-1: Enabling name resolution features in the Capture Options dialog


    # Potential Drawbacks to Name Resolution


    Given its benefits, using name resolution may seem like a no-brainer, but there
    are some potential drawbacks, including the following:


    +   - Sometimes name resolution fails. This may be simply because the name is
    unknown by the name server the query was sent to.'
  merge: -1
  pgno: 73
- img_proc: true
  md: '+   Name resolution must take place every time you open a specific capture
    file because this information is not saved in the file. This means that if the
    servers a file''s name resolution depends upon are not available, name resolution
    will fail.


    +   DNS may add additional packets to the capture file, silently and without warning.
    The resulting traffic to resolve all DNS-based addresses will cloud your capture
    file.


    +   Name resolution requires additional processing overhead. If you are dealing
    with a very large capture file and are running low on memory, you may want to
    forgo the name resolution feature in order to conserve system resources.


    # Protocol Dissection


    A protocol dissector allows Wireshark to break down a protocol (ICMP, example)
    into various sections so it can be analyzed. The ICMP protocol dissector allows
    Wireshark to take the raw data off the wire and format it as an ICMP packet. You
    can think of a dissector as the translator between the raw data flowing across
    the wire and the Wireshark program. In order for a protocol to be supported by
    Wireshark, it must have a dissector built into it.


    Wireshark uses several dissectors in union to interpret each packet. It determines
    which dissectors to use by using its programmed logic and making a very well-educated
    guess.


