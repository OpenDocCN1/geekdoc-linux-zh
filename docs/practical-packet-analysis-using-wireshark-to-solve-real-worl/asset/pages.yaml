    **NOTE** As a final note on ARP cache poisoning, you should be aware of the roles
    of the systems you implement for this process. For instance, do not use this technique
    when the target device is something with very high network utilization, such as
    a fileserver with a 1Gbps link to the network (especially if your analyzer system
    only provides 100Mbps link). When you perform this rerouting of traffic, all transmitted
    and received by the target system must first go through your analyzer system,
    making your analyzer the bottleneck in the communication process. This can create
    a DoS-type effect on the machine you are analyzing, which will result in degraded
    network performance and faulty data analysis.


    # # Sniffing in a Routed Environment


    All of the techniques for tapping into the wire on a switched network are available
    on routed networks, as well. The only major consideration when dealing with routed
    environments is the importance of sniffer placement when you are troubleshooting
    a problem that spans multiple network segments.


    As you learned earlier, a device''s broadcast domain extends until it reaches
    a router. At this point the traffic is handed off to the next upstream router
    and you lose communication with the packets being transmitted until you receive
    an acknowledgment of their receipt. In situations like this where data must traverse
    multiple routers, it is important to analyze the traffic on all sides of the router.


    For example, consider the communications problem you might encounter in a network
    with several network segments connected by a variety of routers. In this network,
    each segment communicates with an upstream segment in order to store and retrieve
    data. The problem we''re trying to solve is that a downstream subnet, network
    D, cannot communicate with any devices on network A (Figure 2-11).'
  merge: -1
  pgno: 45
- img_proc: true
  md: '![](img/ae85f2fa699ec68c8cd6b402e11c40d7_46_0.png)


    **Figure 2-11: A computer on network D can''t communicate with one on network
    A.**


    Your gut might tell you to sniff the traffic of a device on segment D. When you
    do, you can clearly see data being transmitted to segment A, but without traffic
    acknowledgments. When sniffing the next upstream network segment to find the source
    of the problem, you find that traffic is dropped by the router of network B. Eventually
    this leads you to a router configuration problem that, when corrected, solves
    your larger dilemma. This is a prime example of why it is often necessary to sniff
    the traffic of multiple devices on multiple segments in order to pinpoint a problem.


    # # Network Maps


    In our discussion about network placement, we have already looked at several different
    network maps. A network map or network diagram is a diagram showing all technical
    resources on a network and how they are connected.

    There is no better way to determine the placement of your packet sniffer than
    to be able to visualize the network clearly. If you have a network map available
    to you, I would highly recommend keeping it handy, as it will become a valuable
    asset in the troubleshooting and analysis process. You may even want to make a
    detailed network map of your own network. Remember, sometimes half the battle
    in troubleshooting is pinpointing the problem.'
