    Len=0 |

    | 5 | 0.015167 | 12.23.14.63 | 12.23.14.55 | TCP | 1093 > 424 (SYN) Seq=0 MSS=1460
    |

    | 6 | 0.018641 | 12.23.14.55 | 12.23.14.63 | TCP | 424 > 1093 [ACK] Seq=0 Ack=win1460
    Len=0 |


    Figure 8-14: You''re seeing double—every packet is repeated!


    Fighting a Slow Network 107'
