    # Summary


    The Gnutella network is commonly used for the downloading and distribution of
    various file types. This idea may sound great at, but unfortunately, it has resulted
    in a large peer-to-peer network of pornography as well as pirated software, movies,
    and music.


    In this scenario, it seems that Tina, or someone using Tina, has installed some
    form of Gnutella client in order to download pornographic material.


    # Final Thoughts


    If you look at each of these scenarios were resolved, you will notice that most
    of the problems were not actually related there. This is pretty comfy when it
    comes to about a slow network. Typically, it isn''t the network that is slow,
    but rather problems with individual computers or applications that make users
    perceive it that way.'
