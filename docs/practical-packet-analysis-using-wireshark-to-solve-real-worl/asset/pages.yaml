  md: '# Fragmented Packets


    **pcap** Internet Protocol is used for the bulk of data transfer across a network,
    but we often overlook the fact that only so much data can fit on the wire at a
    time. In order to address these lower layer limitations, IP features a technology
    called fragmentation. IP fragmentation allows the protocol to break large amounts
    of data into chunks that can be sent across the wire and reassembled on the receiving
    system.


    In this section, we''ll look at a stream of data that has been fragmented by IP.


    The trace file ipfragments.pcap consists of 24 packets that show a ping request
    and response. From our previous experience, we know that a typical ICMP ping-and-response
    sequence only takes eight. Why do we have so many here? Because in this case,
    each request and reply require three packets instead of one, so there are three
    more than usual, as you will see in Figure 7-7.


    | No. | Time | Source | Destination | Protocol | Info |

    |---|---|---|---|---|-|

    | 1 | 0.000000 | 192.168.0.114 | 192.168.0.193 | IP | Fragmented IP protocol (proto-ICMP
    0x01, off=0) |

    | 2 | 0.000085 | 192.168.0.193 | 192.168.0.114 | IP | Fragmented IP protocol (proto-ICMP
    0x01, off=140) |

    | 3 | 0.000156 | 192.168.0.114 | 192.168.0.193 | ICMP | echo |

    | 4 | 0.000244 | 192.168.0.193 | 192.168.0.114 | IP | Fragmented IP protocol (proto-ICMP
    0x01, off=0) |

    | 5 | 0.000312 | 192.168.0.114 | 192.168.0.193 | IP | Fragmented IP protocol (proto-ICMP
    0x01, off=140) |

    | 6 | 0.000423 | 192.168.0.193 | 192.168.0.114 | ICMP | echo (ping) reply |


    Figure 7-7. This ping requires three packets rather than one because the data
    is transmitted above average size.


    These are the packets you would see if you were to capture a ping whose data size
    was larger than the default. By default, a ping only sends 32 bytes of data to
    its destination in Windows. However, as you can see, the ping in this trace file
    is transmitting 3,072 bytes of data to the client. This presents a problem because
    Ethernet is only designed to handle 1500 bytes in a single packet. Therefore,
    IP must fragment the packets into a data stream, which is what you see in this
    trace file.


    # Determining Whether a Packet Is Fragmented


    How can you tell if a packet has been fragmented? Luckily, all we need to do is
    look at the Packet Details pane in ipfragments.pcap. Here''s how to do it:'
