    Using specialized port-scanning software, a hacker can attempt to connect to a
    device on a specified array of ports, such as 21 (FTP) and 80 (HTTP). With the
    information received from these scans, an attacker can find ports that could allow
    access to your network. Think of an open port as a tunnel into a well-guarded
    castle. Once a hacker knows about one of these tunnels, they may be able to get
    by the right bag of tricks. See Figure 9-2,


