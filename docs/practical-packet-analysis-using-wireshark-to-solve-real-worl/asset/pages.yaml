  md: '# A Slow Route


    **icmp-tracer-slow.pcap** The first step in solving any slow network problem is
    to determine the source of the problem. In the following scenario, the help desk
    has just received a call from Owen, who is complaining that his Internet connection
    is extremely slow.


    # What We Know


    There isn''t a whole lot that we need to know before we can begin to address this
    fairly straightforward complaint. We verify that the slow Internet issue persists
    regardless of the website visited. And, after further investigation, we learn
    that every machine on the same network as Owen is experiencing the problem.


    # Tapping into the Wire


    Since Owen was the first to complain about this issue, we will perform the analysis
    from his computer (though probably any computer on the network would suffice).
    We''ll install Wireshark directly on his machine to get the packet we need.


    Since the problem is affecting multiple computers, we know that it isn''t a problem
    with Owen''s computer specifically; a capture of just his computer trying to access
    the Internet won''t give us the information we need. Instead, we use the ICMP
    tracer utility to get a better idea of where the problem lies.


    traceroute is an ICMP-based diagnostic tool (UDP-based Unix) that sends packets
    to every router along a path, progressing until it reaches a specified destination
    traceroute will report some basic information about any delays (as shown in the
    output of Figure 8-7), but to get a real grasp of where the bottleneck is, we
    will capture the results of the traceroute with Wireshark.


    I have included an image of a sample traceroute output in Figure 8-7. Each line
    represents the time it takes to cross a network in the route to the destination.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_125_0.png)


    Figure 8-7: Standard traceroute output


    Chapter 8'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# Analysis


    Looking at the capture file (icmp-traceroute-slow.pcap, Figure 8-8), the first
    thing we see are Echo (ping) request packets being sent from Owen''s-computer
    to a remote host.


    | No. | Time | Source | Destination | Protocol | Info |

    | 1 | 0.000000 | 24.6.126.218 | 198.173.244.32 | ICMP | Echo (ping) request |

    | 2 | 3.363482 | 24.6.126.218 | 198.173.244.32 | ICMP | Echo (ping) request |

    | 3 | 6.726964 | 24.6.126.218 | 198.173.244.32 | ICMP | Echo (ping) request |

    | 4 | 9.371704 | 24.6.126.218 | 198.173.244.32 | ICMP | Echo (ping) request |


    Figure 8-8: Echo (ping) request packets being sent from Owen''s computer to a
    remote host


    These packets differ from regular ping packets in one important way, as you will
    see if you look the TTL value in the IP section of the Packet Details pane. The
    difference is that the time-to-live value in these packets is set to one, as seen
    in Figure 8-9.


    ```

    Protocol, Src: 24.6.126.218 (24.6.126.218), Dest: 198.173.244.32 (198.173.244.32)

    Version:4 Header: 20 bytes

    Differentiated Services Field: 0x00 (OSCP 0x00; Default; ECN: 0x00)

    Total Length: 92

    Identification: 0xb5f6 (46582)

    Flags: 0x00

    Fragment: offset: 0

    Time to live: 1

    Protocol: ICMP (1)

    Header Checksum: 0xb1fc [correct]

    Source: 24.6.126.218 (24.6.126.218)

    Destination: 198.173.244.32 (198.173.244.32)

    ```


    Figure 8-9: The ping packet has a time-to-live value of one.


    The time-to-live (TTL) value is a numerical value that determines how many times
    a packet can hop from one router to another across a network. A value of one means
    that traceroute will send a packet to the destination device, but the packet will
    expire once it hits the first router along the route; at that time, an ICMP TTL
    expired packet will be sent back. traceroute will send another packet with a TTL
    of two, which will cause an ICMP TTL expired packet to be sent back once the packet
    hits the second router along the route. This process continues until a packet
    has a TTL that is just enough to reach the destination, as illustrated in Figure
    8-10.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_126_0.png)


    Figure 8-10: The TTL value increases as more routers are route to a destination.'
  merge: -1
  pgno: 126
- img_proc: true
  md: 'Appying our newfound knowledge of TTL to our current situation, we can immediately
    see a problem with the first packet sent. This packet has a TTL value of one,
    so it should have immediately hit the internal router back to our network and
    reported to us—but it did not.


    Since Owen''s computer doesn''t receive an immediate response to the first packet
    with value one, it waits about three seconds (as shown in Wireshark''s Time field
    in Figure 8-11) and then sends another request.


    | No. | Time | Source | Destination | Protocol | Info |

    |---|---|---|---|---||

    | 2 | 3638126 | 24.6.126.218 | 198.173.244.32 | ICMP | Echo (ping) |

    | 3 | 3681276 | 24.6.126.218 | 198.173.244.32 | ICMP | Echo (ping) |


    Figure 8-11: Owen''s computer sends an input request, receives response, and sends
    another request three seconds later.


    When''s computer receives no response to this second attempt, it waits about three
    more seconds and sends one last packet to the router, which also proves unsuccessful,
    as shown in Figure 8-12.


    | No. | Time | Source | Destination | Protocol | Info |

    |---|---|---|---|---||

    | 3 | 3638126 | 24.6.126.218 | 198.173.244.32 | ICMP | Echo (ping) |

    | 4 | 3931704 | 24.6.126.218 | 198.173.244.32 | ICMP | Echo (ping) |


    Figure 8-12: After receiving no response yet again, the computer makes one more
    attempt.


    At this point, traceroute gets a reply from the first router, so its next packet
    (packet four) has a TTL value of two. This packet reaches the router successfully,
    and Owen''s computer receives the expected ICMP type 1, code 0 packet, which has
    the Time-to-live exceeded message, shown in Figure 8-13.


    | No. | Time | Source | Destination | Protocol | Info |

    |---|---|---|---|---||

    | 5 | 3939304 | 12.244.25.161 | 24.6.126.218 | ICMP | Time-to-live exceeded (Time
    to live exceeded in transit) |


    Figure 8-13: Time-to-live exceeded message is expected.


    This process continues through the rest of the capture; the TTL value continually
    increased until the destination is reached.


    What can we determine from this traceroute analysis? Our problem lies with our
    network''s internal router because we were never able to receive an ICMP response
    from it. Routers quite aren''t ever going to delve into the semantics of exactly
    what is wrong with the router. The point is that we have successfully determined
    where the problem resides: in our network''s internal router.


    # ##Summary


    Once again, Wireshark has saved countless hours of troubleshooting allowing us
    to quickly pinpoint the source of our problem. While Wireshark won''t tell us
    what is wrong with our router or how to fix it, we need enough to turn our attention
    to the router''s configuration to learn more about the problem.'
  merge: -1
  pgno: 127
- img_proc: true
  md: 'We''ve also learned a few things about ICMP, as well as how to work with the
    traceroute utility. (traceroute has several other configurable options and uses;
    you can find out about them by doing a quick Internet search.)


    # Double Vision


    In this scenario, you have installed and configured a brand new computer for Jeff,
    the newest company employee. Usually, when you install a new computer, you expect
    it to be faster than the rest of the devices on your network. However, after only
    a short while, Jeff reports that times of peak usage, his computer is experiencing
    severe slowness to the point that certain network services become unavailable.


    # What We Know


    First of all, we know that Jeff''s computer is brand new, so it should be running
    at optimal performance. Aside from that, there are no reports of network slowness,
    during either peak or off-peak usage times. We also know that Jeff is a high bandwidth
    user. Most of his tasks are network related, and he often runs multiple net-centric
    applications at once. These applications, along with Internet and email clients,
    create an above-average load of traffic, but one that our network should be able
    to handle easily.


    # Tapping into the Wire


    Because this problem is related only to Jeff''s computer, we will install Wireshark
    directly on it. The best time to analyze this problem is when it is happening,
    during peak usage times. We want Jeff to be able to perform his daily routine,
    so we will start the capture file, let it run for a few minutes while Jeff is
    doing, and then stop and look at the collected data.


    # Analysis


    The title of this scenario really becomes clear when you first open the trace
    file, double-vision.pcap. Immediately, you will notice that of everything—every
    packet in this capture file is repeated, as you can see in the details of the
    capture in Figure 8-14. This is definitely not normal.


    > For the sake of simplicity, we will only look at six packets, since that is
    all that is required for our purposes. Remember that all packets are duplicated
    for all communications from Jeff''s computer.


