    **Figure 7-37:** Mandy''s computer requests to download a file from the virtumonde
    server in this packet.


    If you do an Internet search for this file, you will see that it is associated
    with spyware, browser hijacking, and perhaps much more other than what you can
    think of. You have successfully found the problem affecting Mandy''s computer.


    # Summary


    In this scenario we learned that the reason Mandy''s computer was doing strange
    things was related to a spyware application that was being downloaded to her computer
    via a background RPC service. But what was the point of going through all that
    just to find out we knew?'
  merge: -1
  pgno: 118
- img_proc: true
  md: 'We went through this analysis process so that we could better understand what
    was happening on the network. If Mandy''s computer was able to be infected with
    this spyware, chances are it could happen to somebody else, as well. Learning
    the ports and services used in this communication process will allow us to block
    them at the firewall level to prevent problems in the future. Even if a problem
    may seem like it has a very simple fix, going the extra mile to find out exactly
    why it is happening can be very useful in the future.


    # Final Thoughts


    The scenarios provided in this chapter are very simple, but they are also very
    important in helping you familiarize yourself with Wireshark, packet analysis,
    and network troubleshooting in general. The rest of the book will be written in
    much the same format but will focus on different areas of real-world packet analysis.'
  merge: -1
