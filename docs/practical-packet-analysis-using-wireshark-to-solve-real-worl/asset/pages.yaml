  md: '# Summary


    Packet analysis won''t always point you straight to your problem. In fact, in
    this scenario nothing specific in the captures identified the firewall as the
    problem. However, this analysis allowed us to narrow down the problem specifically
    to the server.


    Sometimes you must troubleshoot problems that affect dozens or even hundreds of
    systems. If you can use packet analysis in those situations to narrow down your
    problem to a specific computer, then you have saved yourself a tremendous amount
    of time.


    # It''s Not My Fault!


    ```

    http-fault-post.pcap

    ```


    Some network users are absolutely impossible. Have you ever had a user who always
    blames the IT department for every little problem he or she? Erin is exactly that
    kind of user. Any time the network is running the least bit below an optimal state,
    she is always glad to let you know.


    # What We Know


    We know Erin has never been able to successfully send data through the web form
    in question, but she can submit any other web form she needs to without a hitch.
    Looking at the source code of the website in question, we see that it is using
    a standard HTML form with nothing flashy attached to.


    # Tapping into the Wire


    Installing Wireshark on Erin''s computer is the easiest way to get the capture
    file we need. Once it''s installed, we can begin the capture process and Erin
    then attempt to fill out and submit her form, at which point we will begin the
    analysis process.


    # Analysis


    The trace file (http-fault-post.pcap) begins with a standard TCP handshake between
    Erin''s computer, 24.4.97.251, and the remote webserver, 216.23.168.114, as shown
    in Figure 7-21.'
