  md: 'There are two common causes for duplicate packets in a capture file:

    inconsistencies in routing and improperly configured port mirroring. Before

    we get down to the nitty gritty and try to determine the cause here, let''s make

    sure the packets we are looking at are true duplicates of one another.


    One way to determine whether packets are identical is to look at the ID

    IP identification number of each in its IP header. You''ll find this

    IP section of a packet in the Packet Details pane. You will see that the first

    and second packets have the same identification number, Octc509, as shown

    in Figure 8-15.


    ```

    Internet Protocol, Src: 12.234.13.89 (12.234.13.89), Dst: 12.234.14.63 (12.234.14.63)

    Version: 4

    Header Length: 20 bytes

    Differentiated Services Field: 0x00 (DSCP: 0x00; Default; ECN: 0x00)

    Total Length: 40

    Identification: Octc509 (50441)

    Flags: 0x00

    Fragment offset: 0

    Time to live: 27

    Protocol: TCP (0x06)

    Header checksum: 0915b [correct]

    Source: 12.234.13.89 (12.234.13.89)

    Destination: 12.234.14.63 (12.234.14.63)

    ```


    Figure 8-15: The first two packets have the same identification number.


    Same is the true for the third and fourth packets, which have a base

    transaction ID of Octaca, as shown in Figure 8-16. Continuing down the line,

    we find that the same is for every pair of packets in the capture file.


    ```

    Internet Protocol, Src: 12.234.14.63 (12.234.14.63), Dst: 12.234.13.89 (12.234.13.89)

    Version: 4

    Header Length: 20 bytes

    Differentiated Services Field: 0x00 (DSCP: 0x00; Default; ECN: 0x00)

    Total Length: 40

    Identification: Octaca* (44199)

    Flags: 0x00

    Fragment offset: 0

    Time to live: 128

    Protocol: TCP (0x06)

    Header checksum: 058bd [correct]

    Source: 12.234.14.63 (12.234.14.63)

    Destination: 12.234.13.89 (12.234.13.89)

    ```


    Figure 8-16: The third and fourth packets also have the same identification number.


    Now that all of the packets are exact as far as that

    load is concerned, we can begin to try to determine of which two

    possible solutions is most likely to be correct—inconsistent routing or mis-

    port mirroring. To that end, we will look at the TTL values of the

    packets. If these differ, it signals an internal routing problem; if they

    are the same, then we probably have a port routing problem.


    As shown in Figure 8-17, we find that the TTL value of packet 1 is 47,

    and the value of packet 2 is 46. This tells us that we definitely have an

    internal routing problem. The fact that it went a router somewhere and was bounced

    ack to our machine.'
