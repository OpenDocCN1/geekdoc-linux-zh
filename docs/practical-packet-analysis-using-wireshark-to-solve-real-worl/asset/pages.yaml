- img_proc: true
  md: '# 2


    # TAPPING INTO THE WIRE


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_36_0.png)


    We can now move on to the final step of preparation before we begin to capture
    live packets on the network. This last step is to figure out the most appropriate
    place to put a sniffer on the network''s cabling system. This is most often referred
    by packet analysts as getting on the wire, tapping into the wire. Simply put,
    it is the process of placing a packet sniffer on the network in the correct physical
    location.


    Unfortunately, sniffer packets are not as simple as plugging in a laptop to a
    network port and capturing traffic (Figure 2-1). In fact, it is sometimes more
    difficult to place a packet sniffer on a network''s cabling system than it is
    to actually analyze the packets.


    The challenge with sniffer placement is that there is a large variety of networking
    hardware that is used to connect devices. Because the three main devices on a
    modern network (hubs, switches, and routers) all handle traffic very differently,
    you must be aware of the physical setup of the network you are analyzing.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '![](img/ae85f2fa699ec68c8cd6b402e11c40d7_37_0.png)


    Figure 2-1: Placing your sniffer on the network is sometimes the biggest challenge
    you will face.


    The goal of this chapter is to help you develop an understanding of packet sniffer
    placement in a variety of different network topologies. We will look at various
    real-world network setups as we determine the best way to capture packets in hub-,
    switch-, and router-based environments. As a precursor to understanding sniffer
    placement, we''ll also take a more in-depth look at promiscuous mode network cards,
    how they work, and why they are a necessity for packet analysis.


    # # Living Promiscuously


    Before you sniff packets on a network, you need a network interface card (NIC)
    that supports a promiscuous mode driver. *Promiscuous mode* allows an NIC to view
    all of the packets crossing the cabling system.


    When an NIC is not in promiscuous mode, it generally sees a large amount of broadcast
    and other traffic that is not addressed to it, which it will drop. When it is
    in promiscuous mode, it captures everything and passes traffic it receives to
    the CPU, basically ignoring the information it finds in a packet''s Layer 2 addresses.
    Your packet sniffing application grants those packets to give you a complete and
    accurate account of all packets on the system.


    > **NOTE** operating systems (including Windows) will not let you use a network
    card in promiscuous mode unless you have elevated user privileges. If you cannot
    obtain these privileges on a system, chances are that you should not be performing
    any type of packet sniffing on that particular network.


    # # Sniffing Around Hubs


    Sniffing on a network that has hubs installed is a dream for any packet analyst.
    As you learned earlier, traffic sent through a hub is sent to every port connected
    to that hub. Therefore, to analyze a computer on a hub, all you have to do is
    plug in a packet sniffer to an empty port on the hub, and you can see all communication
    to and from all computers connected to that hub. As illustrated in Figure 2-2,
    your visibility window is limitless when your sniffer is connected to a hub network.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '![](img/ae85f2fa699ec68c8cd6b402e11c40d7_38_0.png)


    Figure 2-2: Sniffing on a hub network provides a limitless visibility window.


    **NOTE** The visibility window, as shown in various diagrams throughout this book,
    shows the devices on the network whose traffic you are able to see with a packet
    sniffer.


    Unfortunately for us, hub-based networks are pretty rare because of the headache
    they cause network administrators. Hubs tend to slow network traffic because only
    one device can use the hub at any time; therefore, a device connected to a hub
    must compete for bandwidth with the other devices also trying to communicate through
    it. When two or more devices communicate at the same time, packets collide (as
    shown in Figure 2-3) and transmitted packets are lost and have to be retransmitted.


    As collisions increase, network performance can decrease dramatically. As the
    level of traffic and collisions increase, devices may have to transmit a packet
    three or four times, which is why modern networks of any size use switches.


    The other concern you have to consider when sniffing the traffic of an individual
    computer on a hub network is the volume of traffic in your capture. Since an NIC
    in promiscuous mode sees all traffic going to and from all devices on a hub, you
    will have a very large amount of data to sort through, the bulk of which will
    be irrelevant. In the next chapter you will learn how to leverage the power of
    capture and display filters in order to perform your analysis more efficiently.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_38_1.png)


    Figure 2-3: Collisions occur on a hub network when two devices transmit at the
    same time.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Sniffing in a Switched Environment


    A switched environment is the most common type of network you will be working
    on. Switches provide an efficient means of transporting data via broadcast, unicast,
    and multicast traffic. (For more on these topics see Chapter 1.) As a bonus, switches
    allow full-duplex communication, meaning that machines can send and receive data
    simultaneously through a switch. Unfortunately for packet analysts, switches add
    a whole new level of complexity to a packet analyst''s job. When you plug a sniffer
    to a port on a switch, you can only see broadcast traffic and the traffic transmitted
    and received by your machine, as shown in Figure 2-4.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_39_0.png)


    Figure 2-4: The visibility window on a switched network is limited to the port
    you are plugged into.


    There are three primary ways to capture traffic from a target device on a switched
    network: port mirroring, ARP cache poisoning, and hubbing out.


    # Port Mirroring


    Port mirroring, or port spanning it is often called, is perhaps the easiest way
    to capture the traffic from a target device on a switched network. In this type
    of setup, you must have access to the command-line interface of the switch on
    which the target computer is located. Also, the switch must support port mirroring
    and have an empty port into which you can plug your analyzer.


    When port mirroring, you log into the command-line interface for your switch and
    enter a command that forces the switch to copy all traffic on a certain port to
    another port (Figure 2-5). For instance, to capture the traffic from a device
    on port three of a switch, you could simply plug your analyzer into port four
    and mirror port three to port four. This would allow you to see all traffic transmitted
    and received by your target device.


    The exact command you will type to set up port mirroring will vary depending on
    the manufacturer of the switch you are using. You''ll find a list of common commands
    in Table 2-1.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '![](img/ae85f2fa699ec68c8cd6b402e11c40d7_40_0.png)


    **Figure 2-5:** Port mirroring allows you to expand your visibility of the ports
    you are on a switched network.


    When port mirroring, be aware of the throughput of the ports you are mirroring.
    Some manufacturers allow you to mirror multiple ports to one individual port,
    which may be very useful when analyzing the communication between two or more
    devices on a single switch. However, consider what will will happen when using
    some basic math. For instance, if you have a 24-port switch and you mirror 23
    full-duplex 100Mbps to one port, you could potentially have 4,600Mbps flowing
    to that. This is obviously well beyond the physical threshold of a single port
    and can cause packet loss or network slowdowns if the traffic reaches a certain
    level. In these situations switches have been known to completely drop excess
    packets or “pause” their backbone, preventing communication altogether. Be sure
    that this type of situation doesn''t occur when you are trying to perform your
    capture.


    **Table 2-1:** Commands Used to Enable Port Mirroring for Different Manufacturers''
    Switches


    | Manufacturer | Port Mirroring Command |

    | --- | --- |

    | Cisco | set span <source port> <destination port> |

    | Enterasys | set port mirroring create <source port> <destination port> |

    | Nortel | port-mirroring-port <source port> monitor-port <destination port> |


    # # Hubbing Out


    Another very simple way of capturing the traffic through a target device on a
    switched network is hubbing out. *Hubbing out* is a technique in which you localize
    the target device and your analyzer system on the same network segment by plugging
    them directly into a hub.


    Many people think of hubbing out as cheating, but it''s really a perfect solution
    in situations where you can''t perform port mirroring but still have physical
    access to the switch the target device is plugged into.'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'In order to hub out, all you need is a hub and a few network cables. Once you
    have your hardware, go to the switch the device resides on and unplug the target
    from the network. Then plug the target''s network cable into your hub, and plug
    in another cable connecting your analyzer. Next, connect your hub to the network
    by plugging in to the network switch. Now you have basically pulled the target
    device and your analyzer into the same broadcast domain, and all traffic from
    your target device will be broadcast so that the analyzer can capture those packets
    (Figure 2-4).


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_41_0.png)


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_41_1.png)


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_41_2.png)


    Figure 2-6: Hubbing out isolates your target device and analyzer on their own
    broadcast domain.


    In most situations, hubbing out will reduce the duplex of the target device from
    full to half. While this method isn''t the cleanest way to tap into the wire,
    it''s sometimes your only option when a switch does not support port mirroring.


    NOTE As a reminder, it is usually a nice gesture to alert the user of the device
    that you are unplugging it, especially if that user happens to be the company
    CEO!


    When hubbing out, be sure that you are using a true hub and not a falsely labeled
    switch. Several networking hardware vendors have a bad habit of marketing and
    selling a device as a hub when it actually functions as a low-level switch. If
    you aren''t working with a proven, tested hub, you will only see your own traffic,
    not that of the target device. When you find a hub, test it to make sure it''s
    is really a hub—if it is, it''s a keeper! The best way to determine whether or
    not the device you are using is a true hub is to hook a pair of computers up to
    it and if one can sniff the other''s traffic. If you so, have a true hub in your
    possession.


    # ARP Cache Poisoning


    Recall from Chapter 1 that the two main types of packet addressing are at Layers
    2 and 3 of the OSI model. These Layer 2 addresses, or MAC addresses, are used
    in conjunction with whichever Layer 3 addressing system you are'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'using. In the case of this book (and the industry standard), I refer to the
    Layer 3 addressing system as the Internet Protocol (IP) addressing system.


    All devices on a network communicate with each other on Layer 3 IP addresses.
    Because switches operate on Layer 2 of the OSI model, they may be able to translate
    Layer 2 MAC addresses into Layer 3 addresses and vice versa to be able to forward
    traffic to the appropriate device. This translation process is done through a
    Layer 3 protocol known as the Address Resolution Protocol (ARP).


    When one computer needs to send data to another, it sends an ARP request to the
    switch it is connected to. The switch sends an ARP broadcast packet to all the
    computers connected to it, asking each computer it reaches if it has the IP address
    of the computer trying to be reached. When the destination computer sees this,
    it identifies itself by giving its MAC address. The switch now has a route established
    to that destination computer, and any device that wishes to communicate with use
    the route. This newly obtained information is stored in the switch''s ARP cache
    so that the switch does not have to send a new ARP broadcast every time it needs
    to send data to a computer.


    ARP poisoning is a more advanced form of tapping into a switched network. It is
    commonly used by hackers to falsely address addressed packets to client systems
    in order to intercept traffic or cause denial of service (DoS) attacks on a target,
    ARP cache poisoning can still be a legitimate way to capture the packets of a
    target machine on a switched network.


    ARP cache poisoning, sometimes referred to as ARP spoofing, is the process of
    sending ARP messages to an Ethernet switch or router with fake MAC (Layer 2) addresses
    in order to intercept the traffic of another computer (Figure-2).


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_42_0.png)


    Figure-2: ARP cache poisoning allows you to intercept the traffic of your target
    computer.


    # Using Cain & Abel


    When attempting to poison the ARP cache, the first step is to download the required
    tools and collect some necessary information. We''ll use the popular security
    tool Cain & Abel from Oxid.it (http://www.oxid.it). We go ahead and install it
    now.'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'Once you have installed Cain & Abel software, you need to collect some additional
    information including the IP addresses of your analyzer system, the remote system
    you wish to capture the traffic from, and the router that the remote system is
    downstream.


    When you open Cain & Abel, you will notice a series of tabs near the top of the
    window. (ARP cache poisoning is only one of a variety of Cain & Abel''s features.)
    For our purposes, we''ll be working in the Sniffer tab. When you click this tab,
    you will see an empty table (Figure 2-8).


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_43_0.png)


    Figure 2-8: The Sniffer tab in the Cain & Abel main window


    In order to fill this table you will need to activate the program''s built-in
    sniffer and scan your network for hosts. To do so, follow these steps:


    +   1. Click the second icon on the toolbar, which resembles a network card. The
    first time you do this you will be asked to select the interface you wish to sniffer.
    This interface will be the one that is connected to the network you will be performing
    your ARP cache poisoning.

    2. Once you''ve selected this interface, click OK to activate Cain & Abel''s built-in
    sniffer.

    3. To build a list of available hosts on your network, click the icon that resembles
    a (+) symbol, and click OK (Figure 2-9).


    The once-empty grid should be filled with a list of all the hosts on your attached
    network, along with their MAC addresses, IP addresses, and vendor identifying
    information. This is the list you will work from when setting up ARP cache poisoning.


    At the bottom of the program window, you will see a set of tabs that will take
    you to other windows under the Sniffer heading. Now that you will have your host
    list, you will be working from the APR tab. Switch to the APR window by clicking
    the tab.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '![](img/ae85f2fa699ec68c8cd6b402e11c40d7_44_0.png)


    Figure 2-9: The Cain & Abel network discovery tool


    Once in the APR, you are presented with two empty tables: an upper and a lower
    one. When you set them up, the upper table will show the devices involved in your
