    Figure 8-28: Most TCP connection attempts are failures.


    Several TCP connections could be causing these to fail, but before we investigate
    further what we are contending with so that we can determine the extent of the
    problem. A good way to do this is to look at the Conversations dialog to see how
    many individual TCP and IP conversations are going on, as seen in Figure 8-29.


    The Conversations window shows that this trace file contains 81 IP conversations
    and 243 TCP conversations in the tabs at the top of Figure 8-29. This large number
    of conversations is usually acceptable if you are viewing traffic captured from
    a server, but this workstation; it’s not normal to see this many conversations
    over such a short period of time.'
