  md: "# INTRODUCTION\n\nI got my first computer when I was nine years old. \nAs things\
    \ go with technology, it broke within about a year. It was enough of a stretch\
    \ for my family to afford a computer in the first place, and paying for it to\
    \ be fixed was just financially impossible. However, after a little reading and\
    \ experimentation, I fixed the computer, and that's where my interest in technology\
    \ began.\n\nThat interest evolved into a passion through high school and college,\
    \ and as that passion grew, so did my abilities, naturally leading me to situations\
    \ in which I really needed to dig further into network and computer problems.\
    \ This is when I stumbled upon the Wireshark project (it was called Ethereal at\
    \ the time). This software allowed me to enter a completely new world. Being able\
    \ to analyze problems in new ways and having the ability to see protocols on the\
    \ wire gave me limitless power in computer and network troubleshooting."
  merge: -1
  pgno: 18
- img_proc: true
  md: 'The great thing about packet analysis is that it has become an increasingly
    popular method of solving problems and learning more about networks. Thanks to
    the advent of user groups, wiks, and blogs, the techniques covered in this book
    are becoming prerequisite knowledge for some jobs. Packet analysis is a requirement
    for managing today''s networks, and this book will give you the jump you need
    in learning how it all works.


    # # Why This Book?


    You may find yourself wondering why you should buy this book as opposed to any
    other book about packet analysis. The answer lies right in the title: *Packet
    Analysis*. Let''s face it—nothing beats real-world experience, and the closest
    you can come to that experience in a book is through practical examples of packet
    analysis with real-world case scenarios. The first half of this book gives you
    the prerequisite knowledge you will need to understand packet analysis and Wireshark.
    The second half of the book is devoted entirely to practical case scenarios that
    you could easily encounter in day-to-day network management.


    Whether you are a network technician, a network administrator, a chief information
    officer, a desktop technician, or simply a help desk worker, you will have to
    go to understanding and using packet analysis techniques.


    # # Concepts and Approach


    I am generally a laid-back guy, so when I teach a concept, I try to do so in a
    really laid-back way. This holds true for the language used in this book. It is
    very easy to get lost in technical jargon dealing with a technical concept, but
    I have tried my best to keep things as casual as possible. I''ll make all definitions
    clear, straightforward, and to the point, without any added fluff.


    If you really want to learn packet analysis, you should make it a point to master
    the concepts in the first several chapters—they are integral to understanding
    the rest of the book. The second half of help is purely conceptual. You may not
    see these exact scenarios in your work, but you should be able to apply the concepts
    you learn from them in the situations you encounter.


    Here is a breakdown of the chapters of this book.


    # ### Chapter 1: Packet Analysis and Network Basics


    What is packet analysis? How does it work? How do you do it? This chapter covers
    the basics of network communication and packet analysis.


    # ### Chapter 2: Tapping into the Wire


    This chapter covers the different techniques you can use to place a packet sniffer
    on your network.'
  merge: -1
  pgno: 19
- img_proc: true
  md: "# Chapter 3: Introduction to Wireshark\n\nHere we'll look at the basics of\
    \ Wireshark—where to get it, how to use it,\nwhat it does, why it's great, and\
    \ all of that stuff.\n\n# Chapter 4: Working with Captured Packets\n\nOnce you\
    \ get Wireshark up and running, you will want to know the\nbbasics of interacting\
    \ with captured packets. This is where you'll learn.\n\n# Chapter 5: Advanced\
    \ Wireshark Features\n\nOnce you have learned to crawl, it's time to take off\
    \ running with the\nadvanced Wireshark features. This chapter delves into these\
    \ features and\ngoes under the hood to show you things that aren't always apparent.\n\
    \n# Chapter 6: Common Protocols\n\nThis chapter shows some of the most common\
    \ network communication\nprotocols look like at the packet level. In order to\
    \ understand\nhow these protocols can malfunction, you have to understand how\n\
    they work.\n\n# Chapter 7: Basic Case Scenarios\n\nThis chapter contains the first\
    \ set of real-world case scenarios. Each\nscenario is presented in an easy-to-follow\
