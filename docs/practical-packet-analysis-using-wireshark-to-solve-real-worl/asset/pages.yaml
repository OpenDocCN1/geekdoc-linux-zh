- img_proc: true
  md: 'Now we start to look at each communication stream see if anything abnormal
    is going on.


    The great thing about a POP packet is that if you want to view the contents of
    the email message it contains, all you have to view the TCP stream associated
    with it. For example, if you do this for packet 1, you''ll see that this email
    includes text as an attachment, document_9446.pif, as shown in 8-27.


    ```

    Follow TCP Stream

    Stream Content

    This is a multipart message in MIME format

    --NextPart_000_04289FA

    Content-type:text/plain;

    charset=us-8;

    Transfer-Encoding:7bit


    Please see the attached file for details.

    --NextPart_000_04289FB

    Content-type:application/octet-stream;

    name="9446.pif"

    Transfer-Encoding:base64

    Content-Disposition:attachment;

    Filename="9446.pif"

    Save Jr Print Enter conversion (310692bytes) ASCII EBCDIC Hex Dump C Arrays Raw


    Close  Filter Out Stream

    ```


    8-27: The details of packet 1 show information about the email being sent.


    Looking further through this stream, we see another message from another suspicious-looking
    email address; it also has a PIF file attached to. A quick search for PIF files
    will tell you that these are Program Files—not you would typically see coming
    through email. Not only that, these files tend to be very large executables. Over
    the course of this capture file, these files just keep coming in, from multiple
    sources.


    What we have is an influx of spam (and possibly virus or worm-containing) email
    that is overloading our server and slowing email traffic across the network.


    # Summary


    Our server is being overwhelmed by a high volume of spam with large attachments.
    This condition is very common when monitoring email server performance. As an
    organization grows, the amount of spam received grows with it. In the case of
    our network, the users can either be patient or ride the sidelines, or the organization
    can invest in some sort of spam-filtering solution.


    # Here''s Something Gnu


    gnutella.pcap This scenario is along the same lines as our earlier BitTorrent
    scenario. Tina, a user on our network, calls and complains that her computer is
    running incredibly slowly, whether she''s doing something locally, over the local
    network, or over the Internet.'
