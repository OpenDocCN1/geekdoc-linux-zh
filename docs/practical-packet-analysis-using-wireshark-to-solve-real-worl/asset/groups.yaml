    # 9

    ## 基于安全的分析


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_142_0.png)


    在本章中，我们将深入研究几种与安全相关的网络场景，并结合使用 Wireshark 对其进行分析。在黑客、身份窃取者和企业数据窃取威胁迫在眉睫的今天，你无法承受*不具备在数据包级别分析网络安全的后果。


    ## 操作系统指纹识别


    **osfingerprinting .pcap** 操作系统（OS）指纹识别*是黑客用来识别远程计算机操作系统的一种技术，目的是获取可能用于破解的有用信息。操作系统指纹识别的工作原理是使用远程机器向目标计算机发送各种命令。当远程机器接收到这些命令的响应时，它可以解释这些响应，从而对目标计算机正在使用的操作系统做出有推断的推测。了解你想要利用的计算机的操作系统，可以让你快速找到针对该操作系统的特定漏洞。


    当你打开指纹识别 pcap 文件时，你将看到几种类型的 ICMP 流量，如图 9-1 所示。其中一些流量，如 Echo（ping）请求和 Echo（ping）响应，是常见的，不应引起引起。然而，像时间戳请求/响应、地址掩码请求和信息请求之类的流量是不常的。


    | No. | Time | Source | Destination | Protocol | Info |

    |---|---|---|---|---|---|

    | 11 | 11.863030 | 10.0.0.29 | 10.0.0.2 | ICMP | Timestamp request |

    | 12 | 11.862328 | 10.0.0.2 | 10.0.0.29 | ICMP | Timestamp request |

    | 13 | 11.736941 | 10.0.0.2 | 10.0.0.29 | ICMP | Timestamp reply |

    | 14 | 14.869039 | 10.0.0.2 | 10.0.0.29 | ICMP | Address mask request |

    | 15 | 15.241112 | 10.0.0.29 | 10.0.0.2 | ICMP | Information request |

    | 16 | 16.742531 | 10.0.0.29 | 10.0.0.2 | ICMP | Echo (ping) |

