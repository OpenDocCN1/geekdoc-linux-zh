    As you can see in Figure 9-2, there are quite few packets traveling between 10.100.25.14
    (the local machine) and 10.100.18.12 (a remote computer). When you take a closer
    look at these packets, you will see exactly why they are so suspicious.


    Our trace file shows that every packet sent from the remote computer is being
    sent to a different port number on the local machine (for example, 21 and 1028).


    But more importantly, these ports happen to be commonly exploited ones, such as
    telnet, microsoft-ds, FTP, and SMTP. When you see a remote computer sending multiple
    packets to commonly exploited ports, you can typically assume that a port scan
    is taking place.


    # The Flooded Printer


    Even the smallest organizations can have several networked printers. Factor the
    cost of paper, ink, and maintenance, and the total cost of ownership for even
    a low-volume network printer can add quickly.


    In this scenario one the higher-volume network printers on our network has been
    begun printing complete garbage, and nobody knows the source of it. Our goal is
    to find the source of these mystery documents and put an end to it.


    # What We Know


    Our printer is a high-volume network printer shared through a server. It has no
    special permissions assigned to it nor any extra logging capabilities. The problem
    is constant. Even when we clear the printer''s queue, it fills up immediately
    and starts printing again.


    # Tapping into the Wire


    Because the problem printer is installed on a server, there will be a lot of traffic
    flowing around the wire, and we''ll have a lot of data to sort through. Regardless,
    installing Wireshark directly on the server is the best way to go. Since the problem
    seems to be constant, we can capture packets at any time.


    # Analysis


    The capture file printerproblem.pcap is a pretty good example of what traffic
    to a printer looks like. As you can see in Figure 9-3, our server, 10.100.16.15,
    is receiving a massive influx of SPOOLS packets from a client within our network,
    10.100.17.47.


    ```

    printerproblem.pcap

    ```'
  - '[PAGE 145]


    Figure 9-3: All of the SPOOLS traffic is going to the printer.


    It''s easy enough to identify the source of the traffic in this case, but we still
    haven''t solved the problem. To learn more about what''s happening, let''s use
    the TCP stream of data being sent to the printer. When you do, you''ll see that
    the data is being printed from Microsoft Word and the username of the person printing
    it is csanders (Figure 9-4).


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_145_0.png)


    Figure 9-4: Viewing the TCP stream of data being sent to a printer can give good
    insight.


    # Summary


    While we haven''t stopped the influx of SPOOLS packets in this scenario, we have
    used Wireshark to quickly find the source of our mysterious printer. Having identified
    the source, we can find out why this information is being sent to the printer.
    (Most likely, client 10.100.17.47 on our network has been compromised in some
    way).


    # FTP Break-In


    ftp-crack.pcap


    FTP is one of the most commonly means of transferring large amounts of data. The
    company we be looking at now has an internal FTP server that it uses to maintain
    all of its pre-release software. Later, the IT technician in charge of maintaining
    and monitoring this server has noticed a large amount of traffic on the server
    after hours. Unfortunately, the FTP server software doesn''t have functionality,
    so the only way to get a good grasp of what is going on is to get a packet capture.
    We want to identify the reason for the server''s increase in bandwidth and eliminate
    the source.'
