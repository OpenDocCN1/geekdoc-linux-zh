    |

    | 6 | 0.204513 | Intel_b2:f5 | Broadcast | ARP | who are 24.625.127? Gratuitous
    ARP |


    Figure 7-25: Packets 3 and 5 come too early for the first to receive them.


    At this point in the initialization process, no machines should be trying to communicate
    with Mandy''s computer, since it isn''t even ready to receive communication. Therefore,
    Mandy''s computer simply drops the packet and goes on with its startup process.
    Another packet in packet 5 of the capture file, this time, the packet has changed
    the ports it is using and tries to connect to port 9898, as shown in Figure 7-26.
    Very tricky.'
