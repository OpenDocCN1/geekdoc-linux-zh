- md: '

    When you suspect that you may be dealing with a virus or worm, you can usually
    find out all you need to know about the threat by performing an Internet search
    for the symptoms. Once you identify the virus or worm you are dealing with, you
    can research it and learn how to fight it.


    ## Covert Information


    covertinfo.pcap In this scenario you''re just the network security officer at
    a large multinational corporation. You have just been alerted by your superior
    that an employee overheard two other employees discussing the possibility of sneaking
    off with some of the company''s assets. Your task in this scenario is to monitor
    the computers of the two suspect employees to see if you can figure out their
    plans.


    ## What We Know


    This scenario is based on the speculation of another employee. While we can''t
    verify if what he overheard was true or if it was just taken out of context, we
    know that the two employees in question are very computer savvy, so our observations
    should be conducted with the utmost care.


    ## Tapping into the Wire


    Because we don''t want our tech-savvy employees to know that we''re onto them,
    we want to make absolutely sure that the computers are monitoring no signs of
    being watched. For this reason, we''ll use port mirroring, even though we are
    within our network. A separate mirror and capture have to be set up for each computer
    being monitored.


    ## Analysis


    Throughout the course of these two employees'' daily work, a lot of packets are
    generated. In most cases, these packets are legitimate, so the first step is to
    search for traffic that could be suspicious. Display filters make it easy to search
    for traffic such as DCERPC, NetBIOS, or ICMP, which we should not see under normal
    circumstances. I applied this filter to the covertinfo.pcap capture; the result
    is two packets from one employee''s computer, as shown in Figure 9-13.


    | No. | Source | Destination | Protocol | Info |

    |---|---|---|---|---|

    | 1 | 0000000 | 10.100.17.48 | ICMP | Echo (ping) request |

    | 2 | 0000015 | 10.100.17.48 | ICMP | Echo (ping) reply |


    Figure 9-13: ICMP? Why would these two employees be pinging each other?


    These packets may look like standard ICMP packets, the source and destination
    addresses belong to the computers of our two suspect employees. Why would they
    be pinging each other during the middle of the day?


    Next, as the previous scenario, we''ll look at the Packet Byte pane to see if
    we can find anything interesting in this ping packet. Upon doing so, we see something
    alarming, as shown in Figure 9-14.


    | 0000 | 00 15 c5 37 e0 61 00 0b db 71 09 38 00 04 45 00 |

    | 0010 | 00 a8 52 87 52 00 01 81 af d1 04 64 11 30 0a 64 |

    | 0020 | 12 03 00 01 1c 27 a4 a3 68 64 65 72 65 72 30 30 |

    | 0030 | 00 20 20 20 20 20 42 6c 20 20 20 20 20 20 20 20 |

    | 0040 | 2e 31 30 20 32 30 31 27 34 38 20 20 25 20 72 61 |

    | 0050 | 65 66 76 73 75 65 64 74 72 60 61 63 63 65 75 65 |

    | 0060 | 20 66 75 65 64 73 74 72 60 61 63 63 65 75 65 65 |

    | 0070 | 20 63 6f 74 65 72 20 20 20 31 31 39 38 32 38 38 |

    | 0080 | 32 32 31 30 20 20 20 20 20 20 20 20 20 20 20 20 |

    | 0090 | 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 |

    | 00a0 | 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 |

    | 00b0 | 20 20 20 20 20 20 |


    Figure 9-14: This is not a normal packet. This ping packet is far from standard.
    As a matter of fact, it''s carrying a secret payload more than our employees could
    use for us to know!


    ## Summary


    The technology used in this scenario is referred to as Loki; it means sending
    information across the wire. The term Loki comes from the first project that ever
    embedded data into ICMP packets. In our scenario, ICMP was used as the carrier
    to transmit messages between two employees with intent. The use of covert channels
    is not a new technology, but it is constantly evolving. It is uncommon to find
    data in other types of packets as well, as TCP headers—while you may not use it,
    it''s the only way to see what secrets contain.


    ## A Hacker''s Point of View


    Throughout this book, we have looked at things from the point of view of a network
    administrator. But what happens when a hacker decides to peek at what''s on the
    wire? In this scenario we assume the identity of a hacker attempting to access
    sensitive information.


    ## What We Know


    Even though you''re an employee of the company you are trying to break into, you
    have limited access to resources. The network utilizes a few switches and routers.
    All of the computers on the network are running various versions of Windows with
    access defined on a per-user basis.


    ## Tapping into the Wire


    Some hackers want to capture passwords of network administrators to gain administrative
    access. Others simply want to bring the network to its knees. Network administrators
    are always tinkering with things, so it would be simple enough to monitor the
    communication between a network and a router. After a while, we manage to get
    a capture file that contains the telnet traffic of the network administrator.
    For the sake of this scenario, Figure 9-15 shows only the traffic relating to
    this particular session. When we discussed in Chapter 6, we noted that Telnet
    typically used cleartext in its transmission. Telnet is commonly used to remotely
    switches, servers and routers. Most of these devices have features that enable
    us to log securely via SSH, but this is something that system administrators neglect.
    Since the communication is happening in the clear, we are able to find the login
    credentials for this router with a little patience. Telnet is a sequential protocol,
    meaning that everything happens in a set. Therefore, the best way to locate the
    login process is stepping through the Telnet data by one. As we do, we see the
    beginning of the authentication process as shown in Figure 9-16.


    | Frame 8 (64 bytes on wire, 64 bytes captured) |

    |---|---|

    | Ethernet II, Src: 31:44:a4:f0 (00:11:34:a4:f0), Dst: 37:e1:c1 (00:15:c5:37:e1:c1)
    |

    | Internet Protocol, Src: 10.100.16.1 (10.100.16.1), Dst: 10.100.18.5 (10.100.18.5)
    |

    | Transmission Control Protocol, Src port: telnet (23), Dst port: 3756 (3756),
    Seq: 6, Ack: 4, Len: 10 |

    | Telnet |

    | Data: Username: |


    Figure 9-16: To begin the authentication process, this packet requests a username.


    If you look in the Packet Details pane in the Telnet field, you will see that
    the data being passed from the server is the request for a username. The packet
    replying to the server should contain the username, but it''s a bit trickier than
    that. As you can see in Figure 9-17, 10 contains the letter a. This doesn''t sound
    like a typical username, and it isn''t.


    | 0000 | 00 11 28 31 4a f0 00 15 | c5 37 e1 c1 08 45 00 00 | ..13,. ..7, ..E.
    |

    | 0010 | 00 29 50 9c 42 00 80 06 | 73 65 0a 64 12 05 0a 64 | ..J).P.0.. sb..d..d
    |

    | 0020 | 10 01 0e ac 00 17 24 0f | 27 9a e0 a9 10 7d 50 18 | ..S$.... |P. |

    | 0030 | ff fc cc 7a 03 00 00 | | ..Z.. |


    Figure 9-17: This packet contains the first piece of the puzzle, to give us another
    piece, an.


    The next packet sent from the server to give us another piece of the puzzle, the
    letter d, as shown in Figure 9-18. We''re seeing the packets coming over the wire
    that gives us one packet at a time. This eventually spells out the word.


    | Frame 24 (64 bytes on wire, 64 bytes captured) |

