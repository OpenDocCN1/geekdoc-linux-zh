    # Fragmented Packets


    **pcap** Internet Protocol is used for the bulk of data transfer across a network,
    but we often overlook the fact that only so much data can fit on the wire at a
    time. In order to address these lower layer limitations, IP features a technology
    called fragmentation. IP fragmentation allows the protocol to break large amounts
    of data into chunks that can be sent across the wire and reassembled on the receiving
    system.


    In this section, we''ll look at a stream of data that has been fragmented by IP.


    The trace file ipfragments.pcap consists of 24 packets that show a ping request
    and response. From our previous experience, we know that a typical ICMP ping-and-response
    sequence only takes eight. Why do we have so many here? Because in this case,
    each request and reply require three packets instead of one, so there are three
    more than usual, as you will see in Figure 7-7.


    | No. | Time | Source | Destination | Protocol | Info |

    |---|---|---|---|---|-|

    | 1 | 0.000000 | 192.168.0.114 | 192.168.0.193 | IP | Fragmented IP protocol (proto-ICMP
    0x01, off=0) |

    | 2 | 0.000085 | 192.168.0.193 | 192.168.0.114 | IP | Fragmented IP protocol (proto-ICMP
    0x01, off=140) |

    | 3 | 0.000156 | 192.168.0.114 | 192.168.0.193 | ICMP | echo |

    | 4 | 0.000244 | 192.168.0.193 | 192.168.0.114 | IP | Fragmented IP protocol (proto-ICMP
    0x01, off=0) |

    | 5 | 0.000312 | 192.168.0.114 | 192.168.0.193 | IP | Fragmented IP protocol (proto-ICMP
    0x01, off=140) |

    | 6 | 0.000423 | 192.168.0.193 | 192.168.0.114 | ICMP | echo (ping) reply |


    Figure 7-7. This ping requires three packets rather than one because the data
    is transmitted above average size.


    These are the packets you would see if you were to capture a ping whose data size
    was larger than the default. By default, a ping only sends 32 bytes of data to
    its destination in Windows. However, as you can see, the ping in this trace file
    is transmitting 3,072 bytes of data to the client. This presents a problem because
    Ethernet is only designed to handle 1500 bytes in a single packet. Therefore,
    IP must fragment the packets into a data stream, which is what you see in this
    trace file.


    # Determining Whether a Packet Is Fragmented


    How can you tell if a packet has been fragmented? Luckily, all we need to do is
    look at the Packet Details pane in ipfragments.pcap. Here''s how to do it:'
- md: '

    ```

    Internet Protocol, Src: 192.168.0.114 (192.168.0.114), Dst: 192.168.0.193 (192.168.0.193)

    Version: 4

    Header Length: 20 bytes

    Differentiated Services Field: 0x00 (DSCP 0; ECN: 0x00)

    Total Length: 1500

    Identification: 0xd6d1 (55041)

    Flags: 0x02 (More Fragments)

    - ... = Reserved bit: Not Set

    - ... = Don''t Fragment: Not Set

    - ... = More Fragments: Set

    Fragment offset: 1480

    Time to live: 128

    Protocol: ICMP (0)

    Header checksum: 0xa303 [correct]

    Destination: 192.168.0.193 (192.168.0.193)

    Reassembled IP in frame: 3

    Data: (1480 bytes)

    ```


    Figure 7-8: If the More Fragments flag has a value of 1, you can expect more packets
    to come with it.


    - 3. Look at the same section for packet 2; you should see that it has the same
    value in the More Fragments field:


    - 4. Look at the More Fragments field for packet 3, you see in Figure 7-9. Unlike
    packets 1 and 2, this packet has a 0 in the More Fragments field. A value of 0
    tells us that this packet is the end of the data stream and there are no more
    fragments following. The only values for this are 1 and 0.


    ```

    Internet Protocol, Src: 192.168.0.114 (192.168.0.114), Dst: 192.168.0.193 (192.168.0.193)

    version: 4

    Differentiated Services Field: 0x00 (DSCP 0; ECN: 0x00)

    Total length: 1440

    Identification: 0xd6d1 (55041)

    Flags:

    - ... = Reserved bit: Not Set

    - ... = Don''t Fragment: Not Set

    - ... = More Fragments: Set

    Fragment offset: 1260

    Time to live: 128

    Protocol: ICMP (0)

    Header checksum: 0xa5a4 [correct]

    Source: 192.168.0.114 (192.168.0.114)

    Destination: 192.168.0.193 (192.168.0.193)

    [IP fragments (3080 bytes): #1(1480), #2(1480), #3(120)] Internet Control Message
    Protocol

    ```


    Figure 7-9: A More Fragments flag set to 0 indicates that this packet is the end
    of this particular data stream.


    # Keeping Things in Order


    Since a device can receive multiple data streams at once, IP allows for an offset
    value so receiving systems know the order in which sequence fragmented packets.


    To view the offset of a fragmented packet, for you look under the IP section of
    the Packet Details pane. In the example file, you will see an offset value of
    0. This tells you that this is the first packet in a series of fragmented packets.


    If you know the second packet, you will get a dramatic change in this number (Figure
    7-10): it rises to 1,480. The reason for this change is that the offset value
    of every fragmented packet following the first one is determined by the payload
    (data) size of the packet (minus the size of the IP header, which is 20 bytes).
    In the case of packet 2, this packet takes the previous offset, which is 0, and
    adds the size (in bytes) of the previous packet to be, 1,480.


    | Protocol: IP; Src: 192.168.0.114 (192.168.0.114), Dst: 192.168.0.193 (192.168.0.193)
    |

    | :--- |

    | Version: 4 |

    | Header Length: 20 bytes |

    | Differentiated Services Field: 0x00 (DSCP 0; ECN: 0x00) |

    | Total Length: 1480 |

    | Identification: 0x6d01 (28041) |

    | Flags: 0x02 (More Fragments) - Reserved: Not Set |

    | 0... .. Don''t Fragment: Not Set |

    | 1 .. More Fragments: Set |

    | Fragment offset: 1480 |

    | Time to live: 128 |

    | Protocol: ICMP |

    | Header Checksum: 0xd03 [correct] |

    | Source: 192.168.0.114 (192.168.0.114) |

    | Destination: 192.168.0.193 (192.168.0.193) |

    | Reassembled IP in Frame: 3 |

    | Data (bytes: 0) |


    Figure 7-10: Packet 2 has an offset value based on the payload of the previous
