    In order to hub out, all you need is a hub and a few network cables. Once you
    have your hardware, go to the switch the device resides on and unplug the target
    from the network. Then plug the target''s network cable into your hub, and plug
    in another cable connecting your analyzer. Next, connect your hub to the network
    by plugging in to the network switch. Now you have basically pulled the target
    device and your analyzer into the same broadcast domain, and all traffic from
    your target device will be broadcast so that the analyzer can capture those packets
    (Figure 2-4).


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_41_0.png)

    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_41_1.png)

    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_41_2.png)


    Figure 2-6: Hubbing out isolates your target device and analyzer on their own
    broadcast domain.


    In most situations, hubbing out will reduce the duplex of the target device from
    full to half. While this method isn''t the cleanest way to tap into the wire,
    it''s sometimes your only option when a switch does not support port mirroring.


    NOTE As a reminder, it is usually a nice gesture to alert the user of the device
    that you are unplugging it, especially if that user happens to be the company
    CEO!


    When hubbing out, be sure that you are using a true hub and not a falsely labeled
    switch. Several networking hardware vendors have a bad habit of marketing and
    selling a device as a hub when it actually functions as a low-level switch. If
    you aren''t working with a proven, tested hub, you will only see your own traffic,
    not that of the target device. When you find a hub, test it to make sure it''s
    really a hub—if it is, it''s a keeper! The best way to determine whether or not
    the device you are using is a true hub is to hook a pair of computers up to it
    and if one can sniff the other''s traffic. If you so, have a true hub in your
    possession.


    # ARP Cache Poisoning


    Recall from Chapter 1 that the two main types of packet addressing are at Layers
    2 and 3 of the OSI model. These Layer 2 addresses, or MAC addresses, are used
    in conjunction with whichever Layer 3 addressing system you are using. In the
    case of this book (and the industry standard), I refer to the Layer 3 addressing
    system as the Internet Protocol (IP) addressing system.


    All devices on a network communicate with each other on Layer 3 IP addresses.
    Because switches operate on Layer 2 of the OSI model, they may be able to translate
    Layer 2 MAC addresses into Layer 3 addresses and vice versa to be able to forward
    traffic to the appropriate device. This translation process is done through a
    Layer 3 protocol known as the Address Resolution Protocol (ARP).


    When one computer needs to send data to another, it sends an ARP request to the
    switch it is connected to. The switch sends an ARP broadcast packet to all the
    computers connected to it, asking each computer it reaches if it has the IP address
    of the computer trying to be reached. When the destination computer sees this,
    it identifies itself by giving its MAC address. The switch now has a route established
    to that destination computer, and any device that wishes to communicate with use
    the route. This newly obtained information is stored in the switch''s ARP cache
    so that the switch does not have to send a new ARP broadcast every time it needs
    to send data to a computer.


    ARP poisoning is a more advanced form of tapping into a switched network. It is
    commonly used by hackers to falsely address addressed packets to client systems
    in order to intercept traffic or cause denial of service (DoS) attacks on a target,
    ARP cache poisoning can still be a legitimate way to capture the packets of a
    target machine on a switched network.


    ARP cache poisoning, sometimes referred to as ARP spoofing, is the process of
    sending ARP messages to an Ethernet switch or router with fake MAC (Layer 2) addresses
    in order to intercept the traffic of another computer (Figure-2).


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_42_0.png)


    Figure-2: ARP cache poisoning allows you to intercept the traffic of your target
    computer.


