    heard by IT staff is that the network is slow. However,

    just because someone says that the network is running

    slowly does not mean that a network problem is

    blame.


    Therefore, before you begin to tackle a slow network problem, you first

    have to determine whether the network is, in fact, running slowly. In this

    chapter we will look at several different scenarios in which a user is complainin-

    ing that the network is slow.'
