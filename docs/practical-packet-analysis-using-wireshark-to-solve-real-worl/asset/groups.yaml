    # # The IO Graphs Window


    One of the best ways to visualize trends is to view them graphically. Wireshark''s
    IO Graphs window allows you to graph the throughput of data on a network. You
    might use this feature to look for spikes or hulls in the throughput of specific
    protocols over the course of a day on your network.


    Let''s look at an IO graph of an individual computer as it downloads a file from
    the Internet. Open the trace file Download.dmp, and then select **Statistics IO
    Graphs**. Here you can see the low number of bytes per second early in the capture,
    until the graph spikes up for a brief amount of time while the file is being downloaded
    (Figure 5-10).


    You can customize several features of this graph. The most important two things
    we will be modifying the settings for the x-axis and y-axis of the graph, which
    allow you to modify the intervals and units used for displaying the throughput
    information.'
