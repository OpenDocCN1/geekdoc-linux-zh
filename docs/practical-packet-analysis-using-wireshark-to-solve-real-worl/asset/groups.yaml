    \ 150\n\n# 11 FURTHER READING 151\n\n# AFTERWORD 154\n\n# INDEX 155\n\n# ACKNOWLEDGMENTS\n\
    \nFirst and foremost, I would like to thank God for giving me the strength and\
    \ fortitude it took to complete this project. When my to-do list grew longer and\
    \ longer and there was no end in sight, he was the one who helped me through all\
    \ of the stressful times.\n\nI want to thank Bill, Tyler, Christina, and the rest\
    \ of the team at No Starch Press for giving me the opportunity to write this book\
    \ and allowing me the creative freedom to do it my way. I would also like to thank\
    \ Gerald Combs for having the drive and motivation to maintain the Wireshark program,\
    \ as well as perform the technical edit of this book. Special thanks out to Laura\
    \ Chappell, as well, for providing some of the best packet analysis training materials\
    \ you will find, including several of the captures used here.\n\nPersonally speaking,\
    \ I would like to thank Tina Nance, Eddy Wright, and Paul Fletcher for helping\
    \ me along the path that has led me to this high point in my career. You guys\
    \ have been great spiritual and professional mentors as well as great friends.\
    \ Along with that, I have several amazing friends who managed to put up with me\
    \ while I was writing this book, which is an accomplishment in itself. I would\
    \ like to extend a very special thank you to Mandy, Barry, Beth, Chad, Jeff, Sarah,\
    \ and Brandon. I couldn't have done it without you guys behind me.\n\nMostly,\
    \ however, I want to thank my loving parents, Kenneth and Judy Sanders. Dad, even\
    \ though you never laid hands on a computer, your constant support and nurturing\
    \ is the reason all of this was possible. Nothing makes me more than the desire\
    \ to hear that you are proud of me. Mom, you have been gone from us for five years\
    \ as of the writing of this book, and although you couldn't be around to see this\
    \ achievement, you are always in my heart, and that is my true driving force.\
    \ The passion you showed for living life is what has inspired me to be so passionate\
    \ in what I do. This book is every bit as much your accomplishment as it is mine.\n\
    \n# INTRODUCTION\n\nI got my first computer when I was nine years old. \nAs things\
    \ go with technology, it broke within about a year. It was enough of a stretch\
    \ for my family to afford a computer in the first place, and paying for it to\
    \ be fixed was just financially impossible. However, after a little reading and\
    \ experimentation, I fixed the computer, and that's where my interest in technology\
    \ began.\n\nThat interest evolved into a passion through high school and college,\
    \ and as that passion grew, so did my abilities, naturally leading me to situations\
    \ in which I really needed to dig further into network and computer problems.\
    \ This is when I stumbled upon the Wireshark project (it was called Ethereal at\
    \ the time). This software allowed me to enter a completely new world. Being able\
    \ to analyze problems in new ways and having the ability to see protocols on the\
    \ wire gave me limitless power in computer and network troubleshooting.\n\nThe\
    \ great thing about packet analysis is that it has become an increasingly popular\
    \ method of solving problems and learning more about networks. Thanks to the advent\
    \ of user groups, wikis, and blogs, the techniques covered in this book are becoming\
    \ prerequisite knowledge for some jobs. Packet analysis is a requirement for managing\
    \ today's networks, and this book will give you the jump you need in learning\
