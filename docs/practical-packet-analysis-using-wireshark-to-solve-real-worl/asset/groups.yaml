    | Null QoS data | wlan.fc.type_subtype eq 44 |


    Recall the Protected flag from the section "802.11 Flags" on page 143; it is the
    flag to identify a packet as being encrypted or unencrypted. We base our filter
    on this flag.

    Recall that the Protected flag bit is set to 0 when no encryption is being used
    and is set to 1 if the packet is encrypted with a protocol such as WEP, TKIP,
    and so on. Therefore, using a filter of


    ```

    wlan.fc.protected eq 0

    ```


    will us all packets that are not encrypted. By the same token, a filter of


    ```

    wlan.fc.protected eq 1

    ```


    will show only encrypted traffic.'
