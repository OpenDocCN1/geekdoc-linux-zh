    Now we start to look at each communication stream see if anything abnormal is
    going on.


    The great thing about a POP packet is that if you want to view the contents of
    the email message it contains, all you have to view the TCP stream associated
    with it. For example, if you do this for packet 1, you''ll see that this email
    includes text as an attachment, document_9446.pif, as shown in 8-27.


    ```

    Follow TCP Stream

    Stream Content

    This is a multipart message in MIME format

