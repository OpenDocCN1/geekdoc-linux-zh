    # The Filter Expression Dialog (the Easy Way)


    The Filter Expression dialog (Figure 4-10) is a feature that makes it easy for
    novice Wireshark users to capture and display filters. To access this dialog,
    click the **Capture Filter** button in the Capture Options dialog and then click
    the **Expression** button.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_68_0.png)


    Figure 4-10: The Filter Expression dialog allows for easy creation of filters
    in Wireshark.


    The first thing you will notice in the Filter Expression dialog is a list of all
    possible protocol fields on the left side of the window. These fields specify
    all possible filter criteria. To create a filter, follow these steps:


    +   - To view the specific fields associated with a protocol, expand that protocol
    by clicking the plus (+) symbol next to. Once you find the criteria to base your
    filter on, select it by clicking it.

    - Select the field that you have selected to have the criteria value you specify.
    This relation is specified in terms of equal to, greater than, less than, and
    so on.

    - Create your filter expression by specifying a criteria value that will relate
    to the field you selected. You can define this value or select it from pre-defined
    values programmed into Wireshark.

    - Once you have done this, click **OK** to view the completed text-only version
    of the filter you have just created.


    # The Filter Expression Syntax Structure (The Hard Way)


    The Filter Expression dialog is great for novice users, but once you get the hang
    of things, you will find that manually typing filter expressions increases their
