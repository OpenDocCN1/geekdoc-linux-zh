    # Summary


    Packet analysis won''t always point you straight to your problem. In fact, in
    this scenario nothing specific in the captures identified the firewall as the
    problem. However, this analysis allowed us to narrow down the problem specifically
    to the server.


    Sometimes you must troubleshoot problems that affect dozens or even hundreds of
    systems. If you can use packet analysis in those situations to narrow down your
    problem to a specific computer, then you have saved yourself a tremendous amount
    of time.


    # It''s Not My Fault!


    ```

    http-fault-post.pcap

    ```


    Some network users are absolutely impossible. Have you ever had a user who always
    blames the IT department for every little problem he or she? Erin is exactly that
    kind of user. Any time the network is running the least bit below an optimal state,
    she is always glad to let you know.


    # What We Know


    We know Erin has never been able to successfully send data through the web form
    in question, but she can submit any other web form she needs to without a hitch.
    Looking at the source code of the website in question, we see that it is using
    a standard HTML form with nothing flashy attached to.


    # Tapping into the Wire


    Installing Wireshark on Erin''s computer is the easiest way to get the capture
    file we need. Once it''s installed, we can begin the capture process and Erin
    then attempt to fill out and submit her form, at which point we will begin the
    analysis process.


    # Analysis


    The trace file (http-fault-post.pcap) begins with a standard TCP handshake between
    Erin''s computer, 24.4.97.251, and the remote webserver, 216.23.168.114, as shown
    in Figure 7-21.


    # Figure 7-21: So far, so good. A standard TCP handshake begins communication
    with Erlang’s computer and the remote server.


    Shortly thereafter, HTTP communication begins between the client and server. Notice
    in the Info column (Figure 7-22) that it doesn''t take too long before the client
    receives the HTTP 403 message from the server, which is the source of the complaint.


    | No. | Time | Source | Destination | Protocol | Info |

    |---|---|---|---|---|---|

    | 1 | 0.000000 | 216.23.168.114 | 24.47.95.121 | TCP | |

    | 2 | 0.027956 | 216.23.168.114 | 24.47.95.121 | TCP | http -> 2379 [SYN] Ack=0
    Seq=Win=16384 Len=0 |

    | 3 | 0.028045 | 24.47.95.121 | 216.23.168.114 | TCP | 2579 -> [ACK] Ack=1 Win=65535
    Len=0 |


    # Figure 7-22: The HTTP 403 message comes pretty quickly.


    The 403 error happens in packet 9. Because this is really the only stream of data
    in the capture we are concerned with, right-click and it ** **Follow TCP Stream**
    to see the clear resemblance of the HTTP transaction, as is shown in Figure 7-23.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_112_0.png)


    # Figure 7-23: The TCP stream of the HTTP transaction that results in the 403
    message should be all the proof you need.


    Looking at this TCP stream, we first see the form data sent from our client to
    the server. At this point we should see a response from the server with something
    saying the data from the form was accepted, but instead we see the 403 response.
    This is enough to prove that the problem lies with the remote server and not on
    your network.


    # Summary


    Packet analysis is often a great tool to use when you must prove that you actually
    know what you''re doing. Not only do you sometimes have to prove your assumptions
    to management, but sometimes you have to prove to yourself.


    In this case, the plaintext interpretation of the TCP stream can be shown to your
    supervisor to put an end to Erin''s training against the IT department.


    # An Evil Program


    This scenario is much like the situation with Chad''s hacked computer. In this
    case, however, we have a little more going on. Mandy is another user on our network
    who is complaining about strange things happening in her browser. The browser
    keeps changing her home page to a faux website at random times throughout the
    day. Not only that, she is seeing quite a few pop-ups and her computer is generally
    sluggish.


    # What We Know


    We don''t need to know a whole lot to solve this particular problem. We know that
    Mandy''s computer is operating very slowly and constantly. Her computer is running
    virus-scanning software, so viruses shouldn''t be too much of a concern for us.


    # Tapping into the Wire


    When troubleshooting spyware-related problem, it is always a good idea to begin
    your trace file when the computer boots up. Most spyware tend to "phone home"
    to check for updates and such when an infected computer starts up.


    We''ll begin our capture file as soon as the computer boots up and continue capturing
    packets until a minute or after the start process has completed. In this case,
    hubbing out or ARP cache poisoning are the best methods to intercepting this machine''s
    packets. Since there is a lot of traffic flowing on our network, we''ll create
    the capture file using a capture filter that only catches traffic to and from
    Mandy''s.


    # Analysis


    This is a pretty big capture file, so we''ll start at the beginning. The first
    two packets (shown in Figure 7-24) are pretty common sights when a computer starts
    up and begins to initialize its TCP/IP stack.


    | No. | Time | Source | Destination | Protocol | Info |

    |---|---|---|---|---|---|

    | 1 | 0.000000 | 0.0.0.0 | 255.255.255.255 | DHCP | DHCP Request - Transaction
    ID 0x9a71fd19 |

    | 2 | 0.210908 | Intel_b2:f5 | Broadcast | ARP | who are 24.6.25.127 |


    # Figure 7-24: The first two packets Mandy''s computer gets its IP address and
    sure there are IP conflicts.


    The first packet shows the computer asking the DHCP server for its lease. Typically,
    this is a response to that DHCP server, but since this is a broadcast packet,
    our capture filter doesn''t allow it to be. The second packet is an ARP packet
    that we call gratuitous ARP. A gratuitous ARP is an ARP-type packet used to ensure
    no other machine on the network has the IP address. If you see only gratuitous
    ARP reply, it means in good shape. The third packet in the capture is one we should
    concerned about. At this point in the computer''s startup, TCP/IP has to fully
    initialize: You can see that it is still sending out ARP packets, as shown in
    Figure 7-25.


    | No. | Time | Source | Destination | Protocol | Info |

    |---|---|---|---|---|---|

    | 1 | 0.000000 | 0.0.0.0 | 255.255.255.255 | DHCP | DHCP Request - Transaction
    ID 0x9a71fd19 |

    | 2 | 0.210908 | Intel_b2:f5 | Broadcast | ARP | who are 24.6.25.127 |

    | 3 | 0.210908 | Intel_b2:f5 | Broadcast | ARP | who are 24.6.25.127 |

    | 4 | 0.020358 | Intel_b2:f5 | Broadcast | ARP | who are 24.6.25.127 |

    | 5 | 0.067836 | Intel_b2:f5 | 24.6.25.127 | UDP | Windows - 1440

    | 6 | 0.204513 | Intel_b2:f5 | Broadcast | ARP | who are 24.6.25.127 |


    # Figure 7-25: Packets 3 and 5 come too early for the first to receive them. At
    this point in the initialization process, no machines should be trying to communicate
    with Mandy''s since it isn''t even ready to receive. Therefore, Mandy''s computer
    simply drops the packet and goes on with its startup process. Another packet in
    packet 5 of the capture file, this time the packet has changed the ports it is
    using and tries to connect to port 9898, as shown in Figure 7-26. Very tricky.


    # Figure 7-26: Another remote connection is made by Mandy''s computer is ready
    for it. Once again, Mandy''s computer is not ready for communication and simply
    drops the packet. Once Mandy''s computer is ready to finally accept communication,
    it receives another of these packets at packet 10. Mandy does not have any services
    on the requested port that can accept, so it replies to the remote computer with
    a RST packet, terminating as shown in Figure 7-27.


    | No. | Time | Source | Destination | Protocol | Info |

    |---|---|---|---|---|---|

    | 10 | 55:564839 | 203.101.426 | 24.6.25.139 | TCP | 760 > 4899 (SYN) Seq=0 Mss=1460
    |

    | 11 | 52:564850 | 24.6.25.139 | 203.101.426 | TCP | 4899 > 760 (RST, ACK) Seq=Ack+1
    Win=Len=0 |

    | 12 | 57:562937 | 24.6.25.139 | 203.101.426 | TCP | 4899 > 760 (RST, ACK) Seq=Ack+1
    Win=Len=0 |

    | 13 | 57:572935 | 24.6.25.139 | 203.101.426 | TCP | 4899 > 760 (RST, ACK) Seq=Ack+1
    Win=Len=0 |

    | 14 | 57:532857 | 24.6.25.139 | 203.101.426 | TCP | 4899 > 760 (RST, ACK) Seq=Ack+1
    Win=Len=0 |


    # Figure 7-27: Another connection attempt is made, and this time Mandy''s computer
    is ready for it; however, it doesn''t have a use for the connection, so it simply
    sends a RST to end the connection.


    This process repeats throughout the next several series of packets. Mandy''s computer
    is doing exactly what it is supposed to be doing by refusing this communication.


    # Filtering out the Good


    If you continue to scroll down to packet 68, you will see the first legitimate
    communication, as shown in Figure 7-28.


    | No. | Time | Source | Destination | Protocol | Info |

    |---|---|---|---|---|---|

    | 68 | 113:632271 | 24.6.25.139 | 216.148.227 | DNS | Standard query A updatekeepalive.mcafee.com
    |

    | 69 | 113:658710 | 216.148.227 | 24.6.25.139 | DNS | Standard query response
    216.49.88.118 |


    # Figure 7-28: This packet shows the beginning of the process of updating virus-scanning
    software.


    > NOTE  Hopefully you remember how to create filters from our previous discussion.

    The filter you want to hide any traffic to or from the McAfee server is !ip.addr=216.49.88.118.

