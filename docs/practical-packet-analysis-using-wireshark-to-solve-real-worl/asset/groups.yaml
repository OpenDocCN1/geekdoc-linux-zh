  - '[PAGE 82]


    # # 6

    # COMMON PROTOCOLS


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_82_0.png)


    This chapter is an overview of some of the more common protocols that appear in
    Wireshark. We will look at sample trace files containing working examples of several
    different protocols and then discuss how each one functions.


    My goal here is to help you understand each of these protocols and give you a
    baseline for comparison when analyzing protocols that you suspect are not working
    correctly. This chapter contains some very important basic protocol information.
    Skipping it would be like watching part two of a movie without seeing part one—the
    following chapters just won''t make sense.


    I wont go into great detail about the design of each individual protocol; instead,
    I have provided the associated RFC number for each. An RFC, or request for comments,
    is the official document that defines the implementation standards for protocols
    in the TCP/IP stack. You can search for RFC documentation at the RFC Editor home
    page, http://www.rfc-editor.org.'
  - '[PAGE 83]


    # Address Resolution Protocol


    **arp.pcap** We''ll start with Address Resolution Protocol (ARP) because it is
    one of the simpler protocols, requiring only a few packets to complete its entire
    operation. *ARP (RFC 8266)* is used to translate Layer 3 (IP) addresses to Layer
    2 (MAC) addresses, allowing devices (such as switches and routers) to determine
    which other devices are located on each port.


    The funny thing about ARP is that it actually provides service to two different
    layers of the OSI model: the network layer and the data link layer.


    When a computer transmits data to another computer, it must first know where that
    computer is. This is done with the aid of the switch or router connecting the
    two computers and the ARP protocol.


    Now take a look at our capture file, as shown in Figure 6-1. Note that in the
    first packet, our source computer (01:cc:ce:6e:8b:24) is sending a packet to ff:ff:ff:ff:ff:ff
    asking Who has 192.168.0.1.


    | No. | Time | Destination | Protocol | Info |

    | --- | --- | --- | --- | --- |

    | 1 | "REQ" | 00:16:ce:6e:8b:24 | ff:ff:ff:ff:ff:ff | ARP | who has 192.168.0.1?
    Tell 192.168.0.114 |

    | 2 | 00:04:08 | 00:13:46:02:22:ba | 01:cc:ce:6e:8b:24 | ARP | 192.168.0.1 is
    at 00:13:46:02:22:ba |


    Figure 6-1: The ARP process only involves two packets—a request and a reply.


    As you learned earlier, ARP only operates on Layer 2; it has no knowledge of a
    computer''s Layer 3 address. What does the computer do, then? What do you do when
    you don''t know the first name of Smith you want to call? You call Smith in the
    phone book until you reach the right one!


    ARP provides the functionality to find the client''s Layer 3 address by allowing
    the transmitting computer to send an ARP broadcast. This broadcast is a packet
    sent to the Layer 2 address ff:ff:ff:ff:ff:ff, the standard broadcast address;
    the packet is forwarded to every computer in that''s switch domain.


    This packet''s only function is to ask every computer whether it contacts or not
    it has an IP of 192.168.0.1. With a different IP address will simply drop the
    packet, the one that it will identify itself by sending a response containing
    its Layer 2 address back to the transmitting computer.


    The second packet (also shown in Figure 6-1) shows the destination computer''s
    ARP response to the first packet. The response is a straightforward one: 192.168.0.1
    is at 00:13:46:02:22:ba. From this point forward, the transmitting computer will
    know the Layer 2 address of the destination computer and will be able to send
    data directly to it.


    # Dynamic Host Configuration Protocol


    **dhcp.pcap** Dynamic Host Configuration Protocol (DHCP) is another fairly simple
    protocol. *DHCP (RFC 2131)* automatically provides clients with network-related
    configuration information, such as a domain name, NTP server

    address, or a unique Layer 3 (IP) address. The DHCP communication'
  - '[PAGE 84]


    process is a client/server communication type in which the client computer requests
    an IP address from a DHCP server and the server acknowledges it by giving it one.


    The basic functionality of DHCP is a simple four-step process. The process begins
    with packet 1 when the client computer sends a DHCP Discover packet to the broadcast
    IP address 255.255.255.255 (as shown in Figure 6-2).


    | No. | Time | Source | Destination | Protocol | Info | Transaction ID |

    |---|---|---|---|---|---||

    | 1 | 0.000000 | 0.0.0.0 | 255.255.255.255 | DHCP | DHCP Discovery | 0xd3d...


    Figure 6-2: DHCP begins with a DHCP Discover packet, as shown here.


    When a client wants to obtain an IP address on a network, it must first locate
    a valid DHCP server on that network. It does so by sending a broadcast packet
    to locate any valid DHCP servers on the network. When a valid DHCP server receives
    one of these packets, it sends a response to the client in a DHCP Offer packet,
    as seen in packet 2 (Figure 6-3). This packet contains the IP address that the
    DHCP server wants to assign to the client and any other information the server
    is configured to supply.


    | No. | Time | Source | Destination | Protocol | Info | Transaction ID |

    |---|---|---|---|---|---||

    | 2 | 0.000295 | 192.168.0.1 | 192.168.0.10 | DHCP | DHCP Offer | 0xd3d0...


    Figure 6-3: The DHCP Offer packet is the server’s response to client.


    Once the client receives this packet, it requests the addressing information from
    the server by sending a DHCP Request packet, which is packet 3 in our sample file.
    Since the client has not yet configured itself with the given IP address, this
    packet is once again sent as a broadcast; this tells the server that the client
    has accepted its offer and notifies all other DHCP servers on the network that
    it is no longer accepting offers. Once the server receives this packet, it assigns
    this IP address to the client and sends a DHCP ACK packet back to the client,
    as seen in packet 4 (Figure 6-4), signifying the end of the DHCP transaction.


    | No. | Time | Source | Destination | Protocol | Info | Transaction ID |

    |---|---|---|---|---|---||

    | 1 | 0.000000 | 192.168.0.1 | 192.168.0.10 | DHCP | DHCP ACK | 0xd3xd...


    Figure 6-4: The Packet Details pane show all of the details for this DHCP ACK
    packet.


    Notice that each DHCP transaction has a specific Transaction ID that can be seen
    under the Info heading in the Packet List pane. These Transaction IDs allow the
    DHCP server to identify and separate each DHCP transaction. It is important because
    it allows you to keep each transaction separate in the analysis process.


    Though we’ve covered only four, you may find out different types of DHCP packets
    in a capture file. (For more on these and other DHCP functions, read the DHCP
    RFC.)'
  - '[PAGE 85]


    # TCP/IP and HTTP


    TCP/IP is the basis for almost all of the communication we will discuss in book.
    Because it is the most widely used network protocol, we will focus on it. Hypertext
    Transfer Protocol (HTTP, RFC 2616) is the server/client-based protocol used to
    transfer web pages across a network. A simple HTTP transaction is a good example
    of TCP/IP communication. Every time you search the Internet with Google, check
    the weather, or even check your fantasy sports teams, you are transferring data
    via TCP/IP using HTTP.


    # TCP/IP


    The TCP/IP protocol is really a stack of protocols, consisting of several different
    protocols on both Layers 3 and 4 of the OSI model. These protocols include TCP,
    IP, ARP, DHCP, ICMP, and many others. Transmission Control Protocol (TCP, RFC
    793) is a Layer 4 protocol that is commonly used because it provides an efficient
    method of transparent, reliable, and bi-directional communication between devices.
    Bi-directional communication means data that can be transmitted and received simultaneously
    from a single host.


    All of the various benefits and features of TCP are made possible through different
    types of TCP packets and flags. In the next paragraphs we will look at these different
    types of packets and what they do.


    Internet Protocol (IP, RFC 791) is the Layer 3 protocol that provides the addressing
    system that allows communication on a network. IP is a connectionless protocol,
    which means that it requires the functionality of TCP bundled with it to ensure
    the reliability of transmitted data.


    The traffic in the capture file begins with the establishment of a TCP/IP session,
    followed by the request and transmission of HTTP data and the termination of the
    session. Stepping through this simple communication between client and server
    is to help us in understanding how TCP and IP work.


    # Establishing the Session


    Before you can transfer data to or from another computer, the sender and receiver
    need to complete a TCP handshake. A TCP handshake is a three-step process where
    the transmitting computer (the client, in this example) establishes a connection
    with the destination computer (the server). We can see the handshake in the first
    three packets of our capture file, and it is detailed visually in Figure 6-5.


    Now is a good time to go ahead and establish our client and server computers.
    The client computer is shown in the first packet with IP address 145.254.160.237.
