    # 802.11 Packet Extras


    8021traffic.pcap


    The main difference between the packet structure of a wireless packet and that
    of a standard packet is the addition of an 802.11 header. This header contains
    extra information about the packet and the medium used to transmit it, as shown
    in Figure 10.


    | Frame 1 (132 bytes by wire, 112 bytes captured) |

    | --- |

    | IEEE 802.11 |

    | Type/Subtitle: Beacon frame (8)

    | Frame control: 0x0080 (Normal)

    | Duration: 0

    | Destination address: Broadcast (ff:ff:ff:ff:ff:ff)

    | BSS ID: D-Link:00:ff:22:ba (00:13:46:08:22:ba)

    | Sequence number: 1352

    | Fragment number: 0

    | IEEE 802.11 wireless management frame


    Figure 10-7: The 802.11 header contains extra wireless information about the packets.


    To examine the packet shown in Figure 10-7 more closely, open the 8021traffic.pcap
    example file. Let''s look at some of the interesting items in this header:


    **Type/Subtitle** specifies the type or subtype of the 802.11 packet shown. The
    type can be either management, data, or control.


    Each type can also have a subtype. For example, the subtype of management packets
    can be beacon frame, authentication request, or disassociation notice.'
  - '[PAGE 164]


    Destination Address, Source Address, and BSS Id These fields contain the source,
    destination, and BSS addresses of the packet.


    Fragment Number and Sequence Number These numbers are used to place the wireless
    packets in the appropriate order, similar to the way TCP assembles streams.


    # 802.11 Flags


    The 802.11 header packet also contains a Flags section with even more wireless-specific
    information, as shown in Figure 10-8.


    ```

    FLAGS:0x0

    DS status: Not leaving DS or network is operating in AD-HOC mode

    0.. = More Fragments: This is the last fragment

    0... = Retry: Frame is not retransmitted

    0... = PWR MGT: Sta will stay up

    0.. = More Data: No data buffered

    0.. = Protected Flag: Data is not protected

    0... = Order Flag: Not strictly ordered

    ```


    Figure 10-8: The Flags section contains more wireless-specific information.


    The Flags section includes these fields:


    **DS Status** The distribution status (DS) field is used to determine which the
    packet is traveling. If the From DS is 1 and the To DS is 0, the packet is traveling
    from the WAP to the wireless client. If the values are the reverse, the packet
    is traveling from the wireless client to the WAP. If both numbers are 0, that
    usually means the packet is being broadcast from the WAP.


    **More Fragments** This field is used when additional packets are required in
    order to read the packet being sent.


    **Retry** The Retry option indicates whether or not the packet being transmitted
    is from the original transmission attempt (0) or a retransmission (1).


    **PWR MGT** This field indicates whether or not a client is going into a power-saving
    state.


    **More Data** This field is used by a WAP to inform a client that more packets
    are waiting to be sent to it.


    **Protected Flag** This field is used to show whether or not a packet is using
    data encryption.


    **Order Flag** The Order field is used to inform the recipient that the packet
    must be kept in a particular order, which prevents the recipient from reorganizing
    packets in order to increase throughput performance.


    # The Beacon Frame


    The beacon frame is one of the most informative packets in a wireless transmission.
    A beacon frame is sent as a broadcast packet from a WAP across a wireless channel
    to notify any listening wireless clients that the WAP is'
  - '[PAGE 165]


    available and define the parameters that must be set in order to connect it to.
    Therefore, this type of broadcast packet contains a lot of useful information,
    as shown in Figure 10-9.


    | Frame 1 (132 bytes bytest, 132 bytes captured) |

    | IEEE 802.11 |

    | Type/Subtype: Beacon frame (8)

    Frame Control: 0x0080 (normal)

    Duration: 0

    Destination address: broadcast (ff:ff:ff:ff:ff:ff)

    Source address: D-Link_0b:22ba (00:13:36:02:22ba)

    SSID: d-Link_0b:22ba (00:13:36:02:22ba)

    Fragment number: 0

    Sequence number: 1352

    IEEE 802.11 wireless LAN management frame |


    Figure 10-9: This beacon frame tells you everything you ever want to know about
    the WAP.


    Some of the information that you might see in a beacon frame includes the following:


    +   **SSID parameter set** This is the SSID that the WAP is broadcasting.

    **Supported rates** This lists the supported rates of throughput provided by the
    WAP and specifies whether the protocol used is 802.11b or 802.11g.

    **DS parameter set** This shows the channel the WAP is broadcasting on.

    **Extended supported rates** This shows other supported rates provided by the
    WAP.

    **Vendor-specific information** This section shows vendor-specific information
    about the WAP, including the chipset manufacturer, tag number, and tag length.
    (Note that the chipset manufacturer is not always the same as the WAP manufacturer.)


    # # Wireless-Specific Columns


    Wireshark typically shows six individual columns in the Packet List pane, all
    of which should look familiar to you. However, due to the added overhead when
    analyzing and interpreting wireless packets, Wireshark displays two very useful
    columns: RSSI and Tx Rate. The Received Signal Strength Indication (RSSI) column
    shows the radio frequency (RF) signal strength of a captured packet, while the
    Tx Rate column shows the data rate of a captured packet, as shown in Figure 10-10.
    Both indicators can be of great help when you are troubleshooting wireless connections.
    In fact, even if your client software shows you excellent signal strength, doing
    a capture with these columns enabled can show you a number that may or not support
    that claim.


    | No.- | Time | Source | Destination | Protocol | Tx Rate RSSI |


    Figure 10-10: These two additional columns make a big difference in how you look
    at things during analysis.'
