    想象你正在向一家公司的员工发送封电子邮件。这封邮件的主题是“关于所有营销人员”，但你并没有只将其发送给那些在营销部门工作的人，而是发送给了公司的每一位员工。在营销部门工作的员工会知道这封邮件是给他们的，并会打开它。然而，其他员工会看到这不是给他们的，并将其丢弃。你可以看到这将导致许多不必要的通信和时间浪费——这正是集线器（hub）的工作原理。


    图 1-4 提供了该过程的图形化显示。在图中，计算机 A 正在向计算机 B 发送数据。然而，当计算机 A 向集线器发送数据时，所有连接到集线器的计算机都会接收到它。只有计算机
    B 实际上接受了数据；其他计算机都将其丢弃了。


    关于集线器的最后一点是，它们只能半双工模式工作——也就是说它们不能同时发送和接收数据。这使得它们区别于交换机，交换机是全双工设备，可以同步发送和接收数据。


    虽然你通常在大多数现代或高密度网络中看不到集线器（下文将讨论到使用的是交换机），但你应该了解集线器的工作原理，因为它们对数据包分析非常重要。


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_30_0.png)


    图 1-4：计算机 A 通过集线器向计算机 B 发送数据时的流量


    ## 交换机


    在生产或高密度网络中，集线器的最佳替代方案是被称为交换机（switches）的设备。与集线器一样，交换机设计用于重复数据包，但其方式非常不同；像集线器一样，交换机为设备提供通信路径，但效率更高。交换机不是将数据广播到每个单独端口，而是将数据发送到目标计算机。从物理上讲，交换机的正面的看起来完全相同；你可能很难准确判断具体是哪一个（图
    1-5）。


    市场上的几种较大的交换机可以通过专门的特定特定软件或 Web 界面进行管理。这些交换机通常被称为托管交换机，提供了多项对网络管理非常有用的功能。这包括启用或禁用交换机端口、查看端口特定信息、更改配置以及远程重启交换机。


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_31_0.png)


    图 1-5：一个机架式 24 口以太网交换机


    交换机在处理传输数据包具有先进的功能。为了能够与特定设备直接通信，交换机必须能够通过地址唯一标识设备。这意味着它们必须在 OSI 模型的数据链路层上运行。


    交换机将每个连接设备的第 2 地址存储在 CAM 表中，该表充当了交通警察的角色。当传输数据包时，交换机读取数据包中的第 2 层头部信息，并以 CAM 表为参考，确定将数据包发送到哪些端口。交换机仅将数据包发送到特定端口，这大大减少了网络流量。


    图 1-6 显示了通过交换机的流量的图形化表示。在图中，计算机 A 再次向计算机 B 发送数据。在这种情况下，计算机通过交换机连接，交换机允许计算机 A 直接向计算机
    B 发送数据，而网络上的其他设备感知不到这种通信。此外，多个对话可以同时发生。


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_31_1.png)


    图 1-6：计算机 A 通过交换机向计算机 B 发送数据时的流量


    ## 路由器


    路由器（router）是一种高级网络设备，其功能层次远高于交换机或集线器。路由器可以有各种形状，但根据网络的大小，大多数路由器前面有几个 LED 指示灯，后面有几个网络端口（图
    1-7）。路由器运行在 OSI 模型的第 3 层，负责在两个或多个网络之间转发数据包。路由器用于引导流量的过程被称为路由（routing）。


    有几种类型的路由协议，规定了不同类型的数据包如何被路由到其他网络。路由器通常使用第 3 层地址（如 IP 地址）来唯一标识网络上的设备。


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_32_0.png)


    说明路由概念的方法是将一个拥有街道网络的社区；每条街道都有房子，每栋房子都有自己的地址（图 1-8）。你住在一条街道上，所以你可以在这条街道上的所有房子之间移动。这与交换机允许网络网段内的计算机进行通信非常相似。然而，要与另一条街道上的邻居通信，必须沿着街道走到邻居的家里。


    让我们来看一个跨街道通信的示例。使用图 1-8，假设我坐在 Vine Street 503 号，我需要去往 Dogwood Lane 202 号。为了做到这一点，我必须跨越到
    Oak Street，然后进入 Dogwood Lane。将此想象为跨越网络网段。如果 192.168.0.3 的设备需要与 192.168.0.54 的设备通信，它必须跨越路由器到达
    10.100.1.1 网络，然后到达目标网络段的路由器。


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_32_1.png)


    图 1-8：路由网络与社区的对比


    组播（Multicast）是一种从单一源向多个终点传输数据包的方法。组播的目标是通过尽可能少使用带宽来使此过程尽可能简单。这种流量的优化取决于数据流为了到达目的地而复制的次数。组播的具体处理高度取决于其实现。实现组播的主要方法是使用特殊的地址方案将数据接收者加入组播组；这就是
    IP 组播的工作原理。单播（unicast）数据包从一台计算机直接传输到另一台。单播功能的细节取决于你使用的协议。你学到的是数据包分析的基础。在开始排除网络问题之前，你必须理解此层级的情况。在下一章中，我们将基于这些概念并讨论更高级的网络通信原理。


    广播域


    回广播包是指发送到特定网段内所有设备的包。在通过不同介质连接多个集线器或交换机的大型网络中，从交换机发出的广播包会传输到网络上其他交换机的端口，因为它们在交换机之间进行中。广播包传输的范围被称为广播域（broadcast
    domain）——它是任何计算机无需通过路由器即可直接向另一个传输的网络网段。图 1-10 显示了小型网络上两个广播域的示例。由于每个广播域都延伸到路由器，广播包仅在指定的广播域内循环。


    ![](img/ae85f2fa699ec68ccd6b402e11c40d7_34_0.png)


    图 1-10：广播域延伸到当前路由网段之后的所有区域。

    '
