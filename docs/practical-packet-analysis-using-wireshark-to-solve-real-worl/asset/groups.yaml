    The server has ceased to communicate with the client, and we have to find out
    why. We could go through the entire capture step and examine each packet, but
    that would be an incredibly and tedious process. Instead, we''ll take the easy
    way out.


    Since we are dealing with an HTTP transaction, the TCP stream should be incomplete
    unless we are waiting for some form of user input. After 9 seconds, the server
