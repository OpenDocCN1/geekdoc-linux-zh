    The seven layers in the hierarchical OSI model (Figure 1-1) make it much easier
    to understand network communication. The application layer at the top represents
    the actual programs we use to access network resources. The bottom layer is the
    physical layer, through which the actual network data travels. The protocols at
    each layer work together to package the data for the next layer.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_26_0.png)


    **NOTE** *The OSI model is no more than an industry-recommended standard; protocol
    developers are not required to follow it exactly. As a matter of fact, the OSI
    model is not the only networking model that exists—for example, some people prefer
    the Department of Defense (DoD) model. We''ll work around the concepts of the
    OSI model in this book, so we won''t cover the DoD model here.*


    Let''s take a broad look at the functions of each of the OSI model''s layers as
    well as some examples of the protocols used in.


    Figure 1-1: A hierarchical view of the seven layers of the OSI model


    ## The Application Layer


    The *application layer*, the topmost layer on the OSI model, provides a means
    for users to actually access network resources. This is the only layer typically
    seen by end users, as it provides the interface that is the base for all of their
    network activities.


    ## The Presentation Layer


    The *presentation layer* transforms the data it receives into a format that can
    be read by the application layer. The data encoding and decoding done here on
    the application layer protocol depends on is de sending or receiving the data.
    This layer also handles several forms of encryption and decryption used for securing
    data.


    ## The Session Layer


    The *session layer* manages the *dialog*, or session between two computers; it
    establishes, manages, and terminates this connection among all communicating devices.
    The session layer is also responsible for establishing whether a connection is
    duplex or half-duplex and for gracefully closing a connection between hosts, rather
    than dropping it abruptly.


    ## The Transport Layer


    The primary purpose of the *transport layer* is to provide reliable data transport
    services to lower layers. Through features including flow control and desegmentation,
    error control, the transport layer makes sure data gets from point to point error
    free. Because reliable transportation can be extremely cumbersome, the OSI model
    devotes an entire layer to it. The transport layer provides its services to both
    connection-oriented and connectionless protocols. Firewalls and proxy servers
    operate at this layer.


    ## The Network Layer


    The network layer is responsible for routing data between networks, and it is
    one of the most complex layers. It handles logical addressing, and in some cases,
    fragmentation and de-fragmentation of packets. For example, routers operate at
    this layer.


    ## The Data Link Layer


    The data link layer provides a means of transporting data across networks. Its
    purpose is to ensure data integrity. It handles framing, media access, and error
    detection. Bridges and switches operate at this layer.


    ## The Physical Layer


    The physical layer is at the bottom of the OSI model, through which data is transmitted.
    This layer defines physical specifications, including voltages, cabling, and hardware.
    It converts digital data into signals and vice versa.


    ## Protocol Interaction


    How does data flow through the OSI model? The data starts at the application layer
    and moves down the physical layer.


    Table 1-1: Typical Protocols Used in Each Layer


    | Layer | Protocol |

    | :--- | :--- |

    | Application | HTTP, FTP, Telnet |

    | Presentation | ASCII, JPEG, MIDI |

    | Session | NetBIOS, SAP, MPEG |

    | Transport | TCP, UDP |

    | Network | IP, ICMP, RIP |

    | Data Link | Ethernet, Token Ring, FDDI |

    | Physical | AppleTalk, IPX |


    ## Data Encapsulation


    The protocols on different layers communicate through data encapsulation. Each
    layer in the stack is responsible for adding header or footer to data. For example,
    when the transport layer receives data from the session layer, it adds its own
    header.


    ## Protocol Data Unit


    The encapsulation process creates a protocol data unit (PDU), which includes the
    data and header information. As data moves down the OSI model, the PDU changes
    and grows as header information from various protocols is added to it. The PDU
    is in its final form once it reaches the physical layer, at which point it is
    sent to the destination. The receiving computer strips protocol headers and footers
    from the PDU as data climbs up the layers.


    NOTE The term packet is associated with the term Protocol Data Unit (PDU). When
    I use the word packet, I am referring to a complete PDU that includes header and
    footer information from all layers.

