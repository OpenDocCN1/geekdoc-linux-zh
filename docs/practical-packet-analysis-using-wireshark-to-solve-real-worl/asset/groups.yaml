    merging capture files, printing packets, and changing time display formats.


    Once you really get into doing packet analysis, you will eventually encounter
    scenarios involving a very large number of packets. As the number of these packets
    grows into the thousands and even millions, you will need to be able to navigate
    through packets more efficiently. This is the reason Wireshark allows you to find
    and mark packets that match certain criteria.


    To find packets that match particular criteria, open the Find Packet dialog (shown
    in Figure 4-1) by selecting **Edit** from the main drop-down menu and then clicking
    **Find Packet** or pressing CTRL-F on your keyboard.


    This dialog offers three options for finding packets: display filter, hex value,
    or string. The display filter option allows you to enter an expression-based filter
    that will only find packets that satisfy that expression (this will be covered).
    The hex and string value searches for packets with a hexadecimal or text you specify;
    you can see examples of all of these in Table 4-1. Other options include the ability
    to select the window in which you want to search, the character set to use, and
    the direction in which you wish to search.


    ### Saving Capture Files


    One of the more powerful features of the Save As dialog is the ability to save
    a specific range. To save your capture, choose File > Save As, and it will prompt
    you for a location to save. If you do not specify a format, Wireshark will use
    the default .pcap format.


    ### Exporting Data


    You can export the captured data into several formats. Forms include plaintext,
    PostScript, comma-separated value (CSV), and XML. To export your capture, choose
    File > Export, and then select the format.


    ### Merging Capture Files


    Certain types of analysis require you to merge multiple files. To merge a capture,
    follow these steps:


    - 1. Open one of the capture files you want to merge.

