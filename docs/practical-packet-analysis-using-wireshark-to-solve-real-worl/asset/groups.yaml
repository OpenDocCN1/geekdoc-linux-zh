    ## What We Know


    The FTP server is running very old software with no decent functionality. All
    major developers within the company have usernames and accounts that allow them
    full access to all files on the server. This server is also configured so that
    it may be accessed from outside of the network so that developers can work from
    home.


    ## Tapping into the Wire


    Since this is on our network, installing Wireshark on it may seem like the best
    method to use. However, since the server is experiencing a very high traffic load,
