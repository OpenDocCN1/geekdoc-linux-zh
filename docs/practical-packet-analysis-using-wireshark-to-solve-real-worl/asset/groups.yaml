    # Final Thoughts


    The goal of this chapter is to introduce you to using Wireshark to analyze capture
    files and to use capture files to show how some common protocols work. Although
    we only briefly covered some of the more advanced protocols, I highly recommend
    reading their RFCs and studying them in depth. As the book continues on various
