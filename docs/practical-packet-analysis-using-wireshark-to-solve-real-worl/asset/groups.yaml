    # 9

    ## SECURITY-BASED ANALYSIS


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_142_0.png)


    In this chapter we''ll dive into several security-related network scenarios and
    work through them with Wireshark. With looming threats of hackers, identity thieves,
    and corporate data theft, you can''t afford *not* to be able to analyze the security
    of your network at the packet level.


    ## OS Fingerprinting


    **osfingerprinting .pcap** Operating system (OS) fingerprinting* is a technique
    used by hackers to identify a remote computer''s operating system in order to
    gain information that could be useful for breaking into it. OS fingerprinting
    works by using a remote machine to send various commands to a target computer.
    When the remote machine receives the responses to these commands, it can interpret
    those responses to make an educated guess at the operating system the target computer
    is using. Knowing the operating system of a computer you wish to exploit allows
    you to quickly find exploits specific to that operating system.


    When you open fingerprinting pcap, you will see several types of ICMP traffic,
    as shown in Figure 9-1. Some of this traffic, like Echo (ping) request and Echo
    (ping) reply, are common and should not be cause for alarm. However, traffic like
    Timestamp request/reply, Address mask request, and Information request is unusual.


    | No. | Time | Source | Destination | Protocol | Info |

    |---|---|---|---|---|---|

    | 11 | 11.863030 | 10.0.0.29 | 10.0.0.2 | ICMP | Timestamp request |

    | 12 | 11.862328 | 10.0.0.2 | 10.0.0.29 | ICMP | Timestamp request |

    | 13 | 11.736941 | 10.0.0.2 | 10.0.0.29 | ICMP | Timestamp reply |

    | 14 | 14.869039 | 10.0.0.2 | 10.0.0.29 | ICMP | Address mask request |

    | 15 | 15.241112 | 10.0.0.29 | 10.0.0.2 | ICMP | Information request |

    | 16 | 16.742531 | 10.0.0.29 | 10.0.0.2 | ICMP | Echo (ping) |

    | 17 | 17.006258 | 10.0.0.29 | 10.0.0.2 | ICMP | Echo (ping) request |

    | 18 | 18.704623 | 10.0.0.29 | 10.0.0.2 | ICMP | Echo (ping) reply |

    | 19 | 19.354823 | 10.0.0.29 | 10.0.0.2 | ICMP | Echo (ping) request |

    | 20 | 20.113005 | 10.0.0.29 | 10.0.0.2 | ICMP | Echo (ping) |

    | 21 | 21.359669 | 10.0.0.2 | 10.0.0.29 | ICMP | Echo (ping) request |

    | 22 | 21.398162 | 10.0.0.2 | 10.0.0.29 | ICMP | Echo (ping) reply |


    Figure 9-1: This is the kind of ICMP traffic you don''t want to see.


    The unusual ICMP request that we see in Figure 9-1 shows that our system is the
    target of an attacker using ICMP-based OS fingerprinting scans. An attacker sends
    these requests and uses the target system''s response (if there is any) to determine
    the operating system running on.


    NOTE Because we should never see ICMP types 13, 15, or 17 under normal circumstances,
    we can create a filter that only shows those types of traffic we can check for
    it quickly. This filter is icmp.type=13 || icmp.type=15 || icmp.type=17.


    ## A Simple Port Scan


    Attackers can use port scans to learn very critical information about a network.
    Using specialized port-scanning software, a hacker can attempt to connect to a
    device on a specified array of ports, such as 21 (FTP) and 80 (HTTP). With the
    information received from these scans, an attacker can find ports that could allow
    access to your network. Think of an open port as a tunnel into a well-guarded
    castle. Once a hacker knows about one of these tunnels, they may be able to get
    by the right bag of tricks. See Figure 9-2,


    portscan.pcap


    | No. | Time | Source | Destination | Protocol | Info |

    |---|---|---|---|---|---|

    | 7 | 7.607512 | 10.10.25.14 | 10.10.18.12 | TCP | 16748 - [telnet] [SYN] |

    | 8 | 7.650334 | 10.10.25.14 | 10.10.18.12 | TCP | 660 - [SYN] |

    | 9 | 8.008340 | 10.10.25.14 | 10.10.18.12 | TCP | 30382 - 6000 [SYN] |

    | 10 | 9.004939 | 10.10.25.14 | 10.10.18.12 | TCP | 29766 - 1925 [SYN] |

    | 11 | 9.53333 | 10.10.25.14 | 10.10.18.12 | TCP | 25437 - [SYN] |

    | 12 | 11.10883 | 10.10.25.14 | 10.10.18.12 | TCP | 6729 - 39 [SYN] |

    | 13 | 11.50956 | 10.10.25.14 | 10.10.18.12 | TCP | 29919 - 1 |

    | 14 | 14.30771 | 10.10.25.14 | 10.10.18.12 | TCP | 24305 - 9100 [SYN] |

    | 15 | 15.702512 | 10.10.25.14 | 10.10.18.12 | TCP | 17838 - 1 |

    | 16 | 16.312738 | 10.10.25.14 | 10.10.18.12 | TCP | 10983 - finger [SYN] |


    Figure 9-2: a port scan shows multiple connection attempts on various ports.


    As you can see in Figure 9-2, there are quite few packets traveling between 10.100.25.14
    (the local machine) and 10.100.18.12 (a remote computer). When you take a closer
    look at these packets, you will see exactly why they are so suspicious.


    Our trace file shows that every packet sent from the remote computer is being
    sent to a different port on the local machine (for example, 21 and 28).


    But more importantly, these ports happen to be commonly exploited, such as telnet,
    FTP, and SMTP. When you see a remote computer sending multiple packets to commonly
    exploited ports, you can typically assume that a port scan is taking.


    ## The Flooded Printer


    Even the smallest organizations can have several networked printers. Factor the
    cost of paper, ink, and maintenance, and the total cost of ownership for even
    a low-volume network printer can add quickly.


    In this scenario the higher-volume network printers on our network has begun printing
    complete garbage, and nobody knows the source of it. Our goal is to find the source
    of these mystery documents and put an end to it.


    ## What We Know


    Our printer is a high-volume network printer shared through a server. It has no
    special permissions assigned to it nor any extra logging capabilities. The problem
    is constant. Even when we clear the printer''s queue, it fills up immediately
    and starts printing again.


    ## Tapping into the Wire


    Because the problem printer is installed on a server, there will be a lot of traffic
    flowing around the wire, and we''ll have a lot of data to sort through. Regardless,
    installing Wireshark directly on the server is the best way to go. Since the problem
    seems to be constant, we can capture packets at any time.


    ## Analysis


    The capture file printerproblem.pcap is a pretty good example of what traffic
    to a printer looks like. As you can see in Figure 9-3, our server, 10.100.16.15,
    is receiving a massive influx of SPOOLS packets from a client within our network,
    10.100.17.47.


    ```

    printerproblem.pcap

    ```


    Figure 9-3: All of the SPOOLS traffic is going to the printer.


    It''s easy enough to identify the source of the traffic in this case, but we still
    haven''t solved the problem. To learn more about what''s happening, let''s use
    the TCP stream of data being sent to the printer. When you do, you''ll see that
    the data is being printed from Microsoft Word and the username of the person printing
    it is csanders (Figure 9-4).


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_145_0.png)


    Figure 9-4: Viewing the TCP stream of data being sent to a printer can give good
    insight.


    ## Summary


    While we haven''t stopped the influx of SPOOLS packets in this scenario, we have
    used Wireshark to quickly find the source of our mysterious printer. Having identified
    the source, we can find out why this information is being sent to the printer.
    (Most likely, client 10.100.17.47 on our network has been compromised in some
    way).


    ## FTP Break-In


    ftp-crack.pcap

