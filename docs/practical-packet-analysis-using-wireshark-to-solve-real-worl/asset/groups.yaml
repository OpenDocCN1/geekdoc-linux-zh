    ## Sniffing Wirelessly in Linux


    Sniffing in Linux is simply a matter of enabling monitor mode on the wireless
    NIC and firing up Wireshark. Unfortunately, the procedure for enabling monitor
    mode differs with each model of wireless NIC, so I can''t offer a definitive guide
    for it. Your best bet is to do a quick Internet search for your NIC model for
    specific details.


    One of the more common ways to enable monitor mode in Linux is through its built-in
    wireless extensions. You can access these wireless extensions with the iwconfig
    command. If you type iwconfig over the console, you should see results like this:


    ```

    $ iwconfig

    Eth0 no wireless extensions

    Lo0 no wireless extensions

    Eth1 IEEE 802.11g SSID:"Tesla Wireless Network"

    Mode:Managed Frequency:2.462 GHz Access Point:00:02:2D:8B:70:2E

    Rate:54 Mb/s Tx-Power=20 dBm Sensitivity=8/0

    Retry Limit:7 RTS thr:off Fragment thr:off

    Power Management:off

    Link Quality:75/100 Signal level=-71 dB Noise level=-86 dB

    Rx invalid hw:0 Rx invalid crypt:0 Rx invalid frag:0

    Tx excessive retries:0 Invalid misc:0 Missed beacon:2

    ```


    The output of the iwconfig command shows that the Eth1 interface can be configured
    wirelessly. This is apparent because it shows data for the 802.11g protocol, whereas
    the interfaces Eth0 and Lo0 return the phrase "no wireless extensions".


    Along with all of the information this command provides, as the wireless card
    mode and frequency, notice that the second line under Eth1 shows that the mode
    is currently set to Managed. This is what we want to change.


    In order to change the Eth1 interface to monitor mode, you must be logged in as
    the root user, either directly or via the switch user (su) command, shown here.


    ```

    $ su

    Password:<enter root password here>

    ```


    Once you''re root, you can type commands to configure the wireless interface options.
    To configure Eth1 to operate in monitor mode, type


    ```

    $ iwconfig eth1 mode monitor

    ```


    Once in monitor mode, running the iwconfig command again should reflect your changes.
    Now ensure that the Eth1 interface is operational by typing


    ```

    # iwconfig eth1 up

    ```


    We''ll also use the iwconfig command to perform the channel-hopping process discussed
    earlier in this chapter. Change the channel of the Eth1 interface by typing


    ```

    # iwconfig eth1 channel 3

    ```


    You can do this on-the-fly as you are capturing packets, so don''t hesitate to
    change channels at all. This command can also be scripted using various Linux
    scripting languages to make the process easier.


    Once you have completed these configurations, start Wireshark and begin your packet
    capture.


    ## 802.11 Packet Extras


    The main difference between the packet structure of a wireless packet and that
    of a standard packet is the addition of 802.11 header. This header contains extra
    information about the packet and the medium used to transmit it, as shown in Figure
    10-7.


    | Frame 1 (132 bytes, 112 bytes captured) |

    | :--- |

    | IEEE 802.11 |

    | Type/Subtitle: Beacon frame (8) |

    | Frame control: 0x080 (Normal) |

    | Duration: 0 |

    | Destination address: Broadcast (ff:ff:ff:ff:ff) |

    | BSS ID: D-Link:00:22:ba (00:13:46:08:22:ba) |

    | Sequence number: 1352 |

    | Fragment number: 0 802.11 wireless management frame |


    Figure 10-7: The 802.11 header contains extra information about the packets. To
    examine the packet shown in Figure 10-7 more closely, open traffic.pcap file.
    Let''s look at some of the interesting items in this header:


    - **Type/Subtitle** specifies the type or subtype of the 802.11 packet shown.
    can be either management, data, or control. Each type can also have a subtype.
    For example, the subtype of management packets can be beacon frame, authentication
    request, or disassociation.

    - **Destination Address, Source Address, and BSS** These fields contain the source,
    destination, and BSS addresses of the packet.

    - **Fragment Number and Sequence Number** These numbers are used to place the
    wireless packets in the appropriate order, similar to the way TCP assembles streams.


    ## 802.11 Flags


    The 802.11 header also contains a Flags section with more wireless-specific information,
    as shown in Figure 10-8.


    ```

    FLAGS:0x0

    DS status: Not operating in ADHOC mode

    0 = More Fragments: This is the last fragment

    0 = Retry: Frame is not retransmitted

    0 = PWR MGT: Sta will stay up

    0 = More Data: No data buffered

    0 = Protected Flag: Data is not protected

    0 = Order Flag: Not strictly ordered

    ```


    Figure 10-8: The Flags section contains more wireless-specific information. The
    Flags section includes these fields:


    - **DS Status** The distribution status (DS) field is used to determine which
    the packet is traveling. If From DS is 1 and To DS is 0, the packet is traveling
    from the WAP to the wireless client. If the values are the reverse, the packet
    is traveling from the wireless client to the WAP. If both numbers are 0, that
    usually means the packet is broadcast from the WAP.

    - **More Fragments** This field is used when additional packets are required in
    order to read the packet being sent.

    - **Retry** The Retry option indicates whether or not the packet being transmitted
    is from the original attempt (0) or a retransmission (1).

    - **PWR MGT** This field indicates whether or not a client is going into a power-saving
    state.

    - **More Data** This field is used by WAP to inform a client that more packets
    are waiting to be sent to it.

    - **Protected Flag** This field is used to show whether or not a packet is using
    data encryption.

    - **Order Flag** The Order field is used to inform the recipient that the packet
    must be kept in a particular order, which prevents the recipient from reorganizing
    packets in order to increase throughput performance.


    ## The Beacon Frame


    The beacon frame is one of the most informative packets in a wireless transmission.
    A beacon frame is sent as a broadcast packet from a WAP across a wireless channel
    to notify any listening wireless clients that the WAP is available and define
    the parameters that must be set in order to connect it to. Therefore, this type
    of broadcast packet contains a lot of useful information, as shown in Figure 10-9.


    | Frame 1 (132 bytes, 132 bytes captured) |

    | :--- |

    | IEEE 802.11 |

    | Type/Subtype: Beacon frame (8) |

    | Frame Control: 0x080 (normal) |

    | Duration: 0 |

    | Destination address: broadcast (ff:ff:ff:ff:ff:ff) |

    | Source address: D-Link_0b:22ba (00:13:36:02:22ba) |

    | SSID: d-Link_0b:22ba (00:13:36:02:22ba) |

    | Fragment number: 0 |

    | Sequence number: 1352 |

    | IEEE 802.11 wireless LAN management frame |


    Figure 10-9: This beacon frame tells you everything you ever want to know about
    the WAP.


    Some of the information that you might see in a beacon frame includes the following:


    - **SSID parameter set** This is the SSID that the WAP is broadcasting.

    - **Supported rates** This lists the supported rates of throughput provided by
    the WAP and specifies whether the protocol used is 802.11b or 802.11g.

    - **DS parameter set** This shows the channel the WAP is broadcasting on.

    - **Extended supported rates** This shows other supported rates provided by the
    WAP.

    - **Vendor-specific information** This section shows vendor-specific information
    about the WAP, including the chipset manufacturer, tag number, and tag length.


    ## Wireless-Specific Columns


    Wireshark typically shows six individual columns in the Packet List pane, all
    of which should look familiar to you. However, due to the added overhead when
    analyzing and interpreting wireless packets, Wireshark displays two useful columns:
    RSSI and Tx Rate. The Received Signal Strength Indication (RSSI) column shows
    the radio frequency (RF) signal strength of a captured packet, while the Tx Rate
    column shows the data rate of a captured packet, as shown in Figure 10-10. Both
    indicators can be of great help when you are troubleshooting wireless connections.
    In fact, even if your client software shows you excellent signal strength, doing
    a capture with these columns enabled can show you a number that may or not support
    that claim.


    | No.- | Time | Source | Destination | Protocol | Tx Rate RSSI |


    Figure 10-10: These two additional columns make a big difference in how you look
    at things during analysis.

    '
