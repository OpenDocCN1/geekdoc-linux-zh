    is working. However, you quickly run into a problem. Barry is working perfectly,
    but for some reason, Beth is unable to access the Internet. Your goal is to find
    out why Beth is unable to connect to the Internet and then fix the problem.


    # What We Know


    The first thing you should allow when troubleshooting to make a list of what you
    know. In this case, we know that Barry and Beth are both using brand new computers.
    We also know that both computers have assigned IP addresses and made sure that
