    # WORKING WITH CAPTURED PACKETS


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_60_0.png)


    Now that you''ve performed your first packet capture, we''ll cover a few more
    basic concepts that you need to know about working with those captured packets
    in Wireshark. This includes finding and marking packets, saving capture files,
    merging capture files, printing packets, and changing time display formats.


    ## Finding and Marking Packets


    Once you really get into doing packet analysis, you will eventually encounter
    scenarios involving a very large number of packets. As the number of these packets
    grows into the thousands and even millions, you will need to be able to navigate
    through packets more efficiently. This is the reason Wireshark allows you to find
    and mark packets that match certain criteria.


    ### Finding Packets


    To find packets that match particular criteria, open the Find Packet dialog (shown
    in Figure 4-1) by selecting **Edit** from the main drop-down menu and then clicking
    **Find Packet** or pressing CTRL-F on your keyboard.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_61_0.png)


    Figure 4-1: Finding packets in Wireshark based on specified criteria


    This dialog offers three options for finding packets: display filter, hex value,
    or string. The display filter option allows you to enter an expression-based filter
    that will only find packets that satisfy that expression (this will be covered).
    The hex and string value searches for packets with a hexadecimal or text you specify;
    you can see examples of all of these in Table 4-1. Other options include the ability
    to select the window in which you want to search, the character set to use, and
    the direction in which you wish to search.


    Table 4-1: Examples of Various Search Types for Finding Packets


    | Search Type | Example |

    | :--- | :--- |

    | Display filter | not ip, ip address=192.168.0.1, arp |

    | Hex value | 00:ff:ff:00:ab:b1:f0 |

    | String | Workstation1, UserB, domain |


    Once you''ve made your selections, enter your search string in the text box, and
    click **Find** to find the first packet that meets your criteria. To find the
    next matching packet, press CTRL-N, or find the previous matching packet by pressing
    CTRL-B.


    ### Marking Packets


    Once you have found the packets that match your criteria, you can mark them of
    particular interest. Marked packets stand out with a black background and white
    text, as shown in Figure 4-2. You can also sort out marked packets when saving
    packet captures. There are several reasons you might want to mark a packet, including
    being able to save those packets separately, or to be able to find them quickly
    based upon the coloration.


