    # How to Use This Book


    I have intended this book to be used in two ways. The first is, of course, as
    an educational text that you will read through, chapter by chapter, in order to
    gain an understanding of packet analysis. This means paying particular attention
    to the real-world scenarios in the last several chapters. The other use of this
    book is a reference resource. There are some features of Wireshark that you will
    not use very often, so you may forget how they work. Because of this, *Practical
    Packet Analysis* is a great book to have on your bookshelf should you need a quick
    refresher after how to use a specific feature.


    # About the Example Capture Files


    All of the capture files used in this book are available at http://www.nostarch.com/packet.htm.
    In order to maximize the potential of this book, I would highly recommend you
    download these files and use them as you follow along with the book.


    Several of these capture files were contributed by Laura Chappell of the Packet
    Analysis Institute and Wireshark University. Those captures are as follows:


    - blaster.pcap

