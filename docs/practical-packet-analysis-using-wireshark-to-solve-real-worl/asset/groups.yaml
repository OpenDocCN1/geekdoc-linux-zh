    | No. | Time | Source | Destination | Protocol | Info |

    | --- | --- | --- | --- | --- | --- |

    | 1 | 0.000000 | 10.2.10.2 | 10.4.88.88 | ICMP | Echo (ping) request |


    Figure 7-5: A standard ping request from 10.2.10.2 to 10.4.88.88


    Examining packet 2 in Figure 7-6, you can see that it is not a type 0 packet,
