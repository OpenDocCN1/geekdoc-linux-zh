    8-27: The details of packet 1 show information about the email being sent.


    Looking further through this stream, we see another message from another suspicious-looking
    email address; it also has a PIF file attached to. A quick search for PIF files
    will tell you that these are Program Files—not you would typically see coming
    through email. Not only that, these files tend to be very large executables. Over
    the course of this capture file, these files just keep coming in, from multiple
    sources.


    What we have is an influx of spam (and possibly virus or worm-containing) email
    that is overloading our server and slowing email traffic across the network.


    # Summary


    Our server is being overwhelmed by a high volume of spam with large attachments.
    This condition is very common when monitoring email server performance. As an
    organization grows, the amount of spam received grows with it. In the case of
    our network, the users can either be patient or ride the sidelines, or the organization
    can invest in some sort of spam-filtering solution.


