    SYN 数据包相同。它用于传输一个客户端系统可以用来确认的序列号。


    # 最终的 ACK 数据包


    最后，客户端向收到其 SYN/ACK 数据包的服务器发送 ACK 数据包。在过程的第二步中，序列号加 1 并作为确认号发送给服务器。一旦接收到最后一个数据包，通信即可开始。


    # 流数据的开始


    一旦握手建立，客户端和服务器之间此会话中的所有数据包将使用序列号来确保它们顺序正确。然而，从现在起，这些数据包将根据传输的数据帧的大小进行增加，而不是加 1。（要了解更多关于
    TCP 数据包如何保持有序，请参考 RFC 793。）


    # HTTP 请求与传输


    一旦通信会话建立，就可以对你尝试查看的网页进行实际请求和传输。这涉及到 HTTP 和 TCP。


    过程始于第 4 个数据包，这是我们的第一个 HTTP 数据包，它请求服务器将网页发送给客户端。继续展开“数据包详情”面板中此数据包的章节，以查看与其相关的协议信息（如图
    6-7 所示）。


    ```

    GET /download.html HTTP/1.1

    Request Method: GET

    Request URI: /download.html

    Host: www.ereal.com

    User-agent: Mozilla/5.0 (Windows NT 6.1; Win64; x64) Gecko/20101011 Firefox/114.0

    Accept: text/xml,application/xml,text/html;q=0.9,text/plain,image/*

    Accept-Language: en,q=0.5

    Accept-Charset: ISO-8859-1,utf-8;q=0.7

    Keep-alive: 300

    connection: keep-alive

    Refer: http://www.ereal.com/development.html

    ```


    图 6-7: 数据包详情面板显示了你对该请求感兴趣的所有信息。


    如你所示，此数据包为域名 www.ereal.com 上的网页 /download.html 发起了一个 GET 命令（Request Method: GET）。（Request
    URI: /download.html 和 Host: www.ereal.com）。你还会注意到其他可能有用的信息，例如字符编码（Accept-Charset:
    ISO-8859-1）和引用页（Referrer: http://www.ereal.com/development.html）。


