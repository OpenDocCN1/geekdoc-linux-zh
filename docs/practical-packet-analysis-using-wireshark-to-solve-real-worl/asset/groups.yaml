    The display filter expression syntax structure is very simple, yet it is extremely
    powerful. This language is specific to Wireshark. Let''s look at how this filter
    syntax works and some examples of what we can do with it.


    # Filtering Specific Protocols


    You will often use a capture or display filter to filter based on a specific protocol.
    For example, say you are troubleshooting a TCP problem and you want to see only
    TCP traffic in a capture file. If so, simply using a filter of tcp will get the
    job done.


    Now let''s look at things from the other side of the fence. Imagine that in the
    course of troubleshooting your TCP problem, you have used the ping utility a bit,
    thereby generating a lot of ICMP traffic. You could remove this ICMP traffic from
    your capture file with the filter icmp.


    # Comparison Operators


    Comparison operators allow us to compare values. For example, when troubleshooting
    TCP/IP networks, they will allow you to view all packets referencing a particular
    IP address. In a case like this, the equals (==) comparison operator allow you
    to create a filter showing all packets with an IP address of 192.168.0.1 using
    a filter expression ip.addr==192.168.0.1.


    Or, consider this advanced example of a comparison operator. Imagine a scenario
    where we need to view the packets less than 128 bytes in length. We can use the
    less or equal to (<=) operator to accomplish this goal in a filter expression
    like frame.pkt_len <= 128.


    You''ll find a complete list of Wireshark''s comparison operators in Table 4-2.


    Table 4-2: Wireshark Filter Expression Comparison Operators


    | Operator | Description |

    |---|---|

    | == | Equal to |

    | != | Not equal to |

    | > | Greater than |

    | < | Less than |

    | >= | Greater than or equal to |

    | <= | Less than or equal to |


    # Logical Operators


    Logical operators allow us to combine multiple filter expressions into one single
    statement. You can use logical operators to dramatically increase the effectiveness
    of your filters.


    For example, consider our previous example of displaying only packets referencing
    a certain IP address, and now assume we are interested in two IP addresses. We
    can use the or operator to create one expression that will'
- md: '

    display packets containing either IP address. The syntax of this expression would
    be ip.addr=192.168.0.1 or ip.addr=192.168.0.2. You''ll find a complete list of
    Wireshark''s logical operators in Table 4-3.


    ## Table 4-3: Wireshark Filter Expression Logical Operators


    | Operator | Description |

    | --- | --- |

    | and | Both conditions must be true |

    | or | Either one of the conditions must be true |

    | xor | One and only one condition must be true |

    | not | Neither one of the conditions is true |


    ## Sample Filter Expressions


    Although the concepts related to creating filter expressions are fairly simple,
    you will need to reference several specific keywords and operators when creating
    filters for various problems. Because this book is not intended as a Wireshark
    user manual, we won''t cover all of those expressions and operators, but you will
    find information on them at the Wireshark website. Table 4-4 gives you an idea
    of some sample filter expressions.


    ## Table 4-4: Sample Capture and Display Filter Expressions


    | Expression | Description |

    | --- | --- |

    | host www.example.com | Displays all traffic from the host www.example.com |

    | host www.example.com and not (port 80) | Displays all non-web traffic from the
    host www.example.com |

    | dns | Shows everything except DNS traffic |

    | not broadcast and not multicast | Only shows unicast traffic |

    | ip.dst=192.168.0.1 | Shows all traffic destined for 192.168.0.1 |


    ## Saving Filters


    Once you begin creating lots of capture and display filters, you will find that
    you use certain ones frequently. Fortunately, you don''t need to type these in
    each time you want to use them; Wireshark lets you save for later use.


    To save your custom filter, follow these steps:


    - 1. Select **Capture Filters** to open the Display Filter dialog (Figure 4-11).

    - 2. Create a new filter by clicking the **New** button on the left side of the
    screen.

    - 3. Type a name for your filter in the box next to the words *Filter name*.

    - 4. Type the actual filter in the box next to the words *Filter string*.

    - 5. Once you have finished, click the Save button to save your filter expression
    in the list.


    Wireshark also includes several built-in filters, but these are just to give you
    an example of what a filter should look like. You will want to use them when you
    are creating your own filters, however, because they are great for reference purposes.


    # 5. ADVANCED WIRESHARK FEATURES


    Once you master the basic concepts of Wireshark, you will probably want to delve
    further into some of its more advanced features. In this chapter we''ll look at
    some of these powerful features, including name resolution, protocol dissection,
    and packet reassembly.


    ## Name Resolution


    Network data is transported via various alphanumeric addressing systems that are
    often too long or complicated to remember, as the physical hardware address 00:16:CE:6E:8B:24.
    Name resolution (also called name lookup) is the process a protocol uses to convert
    one identifying into another. For example, a computer might have the physical
    address 00:16:CE:6E:8B:24, the DNS and ARP protocols allow us to see its name
    as Marketing-2. By associating easy-to-read names with these cryptic addresses,
    we make them easier to remember and identify.


    We can leverage various name resolution tools to make our capture files more readable
    and to save a lot of time in certain situations. For example, we can use DNS name
    resolution to help readily identify the name of a computer we are trying to pinpoint
    the source of a particular packet.


    ## Types of Name Resolution Tools in Wireshark


    There are three types of name resolution available in Wireshark: MAC name resolution,
    network name resolution, and transport name resolution.


    ## MAC Name Resolution


    MAC name resolution uses the ARP protocol to attempt to convert Layer 2 MAC addresses,
    such as 00:09:5B:01:02:03, into Layer 3 addresses, such as 100.10.12.1. If attempts
    at these conversions fail, Wireshark''s last resort is to convert the first three
    bytes of the MAC address into the device''s IEEE-specified manufacturer name,
    such as Netgear:01:02:03.


    ## Network Name Resolution


    Network name resolution attempts to convert a Layer 3 address, such as the IP
    address 192.168.1.50, into an easy-to-read DNS name such as MarketingPC1.


    ## Transport Name Resolution


    Transport name resolution attempts to convert a port number into a name associated
    with it. An example of this would be to display port 80 as http.


    ## Enabling Name Resolution


    To enable name resolution, open the Capture Options dialog (shown in 5-1) either
    by choosing Capture > Options or by pressing CTRL-K.


    | Name Resolution |

    | --- |

    | [x] Enable MAC name resolution |

    | [ ] Enable network name resolution |

    | [ ] Enable transport name resolution |

    | | |


    ## Potential Drawbacks to Name Resolution


    Given its benefits, using name resolution may seem like a brainer, but there are
    some drawbacks:


    - Sometimes name resolution fails.

    - Name resolution must take place every time you open the file.

    - Name resolution requires additional overhead.


    ## Protocol Dissection


    A protocol dissector allows Wireshark to break down packets into sections. Wireshark
    uses several dissectors to interpret packet. Unfortunately, Wireshark does not
    always make the right choices when selecting a dissector.


    For example, open the trace file wrongsector.dmp. Notice that this file contains
    a bunch of NetBIOS communication. However, there is something wrong here. If you
    click one of the packets, you can actually see a username and password being sent
    from one computer. After a little investigation, we find that the computers are
    actually using FTP (note the words FTP Server at the right side of Figure 5-2).
    Wireshark thinks this is NetBIOS traffic because the server and client are configured
    to use FTP on port 137, the default port for NetBIOS.


    To fix this problem, we use a process called a *forced decode*:


    - 1. Right-click one of the packets and select **Decode As**. This will bring
    up a dialog in which you can select the dissector you wish to use (Figure 5-3).

    - 2. Tell Wireshark to decode all TCP source port 137 traffic using the FTP dissector
    by selecting **source (137)** from the drop-down menu and selecting **FTP** under
    the Transport tab.

    - 3. Once you have made your selections, click **OK** to save the changes immediately
    applied to the capture file. You will see the data newly decoded so that you can
    analyze it from the Packet List pane without having to dig deep into its individual
    bytes.

