    为了进行“集线器接入”（hubbing out），你只需要一个集线器和几根网线。一旦准备好硬件，前往设备所在的交换机，并将目标设备从网络上拔下。然后，将目标设备的网线插入你的集线器，并插入另一根网线连接到你的分析器。接下来，通过将集线器插入网络交换机，将其连接到网络。现在，你基本上将目标设备和你的分析器拉到了同一个广播域，目标设备的所有流量都将被广播，以便分析器可以捕获这些数据包（图
    2-4）。


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_41_0.png)

    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_41_1.png)

    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_41_2.png)


    图 2-6：集线器接入将你的目标设备和分析器隔离在它们自己的广播域中。


    在大多数情况下，集线器接入会将设备的双工模式从全双工降为半双工。虽然这种方法不是接入链路最干净的方法，当交换机不支持端口镜像时，它有时是你的唯一选择。


    注意：提醒一下，在拔掉设备之前通知设备用户通常是一种友好的做法，特别是该用户恰好是公司的 CEO！


    在进行集线器接入时，请确保你使用的是真正的集线器，而不是标签虚假的交换机。几家网络硬件供应商都有一个坏习惯，将实际上功能为低级交换机的设备营销并销售为集线器。如果你使用的不是经过验证和测试的集线器，你将只能看到自己的流量，而看不到目标设备的流量。当你找到一个集线器时，测试它以确保它是真正的集线器——如果是，就可以留着！判断你正在使用的设备是否为真集线器的最佳方法是将其连接两台电脑，看一台是否能嗅到另一台的流量。如果是，说明你拥有了一个真正的集线器。


    # ARP 缓存毒


    回想第 1 章，数据包内容的两种主要类型位于 OSI 模型的第 2 层和第 3 层。这些二层地址（或 MAC 地址）与你使用的任何第3层地址系统结合使用。在本书（以及行业标准）中，我将第3层地址系统称为互联网协议（IP）地址系统。


    网络上的所有设备都通过第3层 IP 地址相互通信。由于交换机工作在 OSI 模型的第 2 层，它们可能将二层 MAC 地址转换为第3层地址，反之亦然，以便将流量转发到适当的设备。这种转换过程通过称为地址解析协议（ARP）的第3层协议完成。


    当一台计算机需要向另一台计算机发送数据时，它向连接的交换机发送 ARP 请求。交换机向连接到它的所有计算机发送 ARP 广播包，询问到达的每台计算机是否具有要访问的计算机的
    IP 地址。当目标计算机看到此时，它通过提供自己的 MAC 地址来识别身份。现在交换机建立了通往目标计算机的路由，任何想要与之通信的设备都可以使用该路由。新获得的信息存储在交换机的
    ARP 缓存中，这样交换机每次需要向计算机发送数据时就无需再次发送 ARP 广播。


    ARP 毒是接入交换式网络的更高级的形式。它通常被黑客用于伪造地址将数据包发送到客户端系统，以便拦截流量或对目标实施拒绝服务（DoS）攻击。在交换式网络上，ARP
    缓存毒仍然是捕获目标机器数据包的合法方法。


    ARP 缓存毒（有时称为 ARP 欺骗）向以太网交换机或路由器发送带有伪造 MAC（二层）地址的 ARP 消息，以便拦截另一台计算机的流量（图 2-2）。


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_42_0.png)


    图 2：ARP 缓存毒允许你拦截目标计算机的流量。


    # 使用 Cain & Abel


    在尝试投毒 ARP 缓存时，第一步是下载所需的工具并收集必要信息。我们将使用来自 Oxid.it (http://www.oxid.it) 的流行的安全工具
    Cain & Abel。我们现在安装它。


    一旦安装了 Cain & Abel 软件，你需要收集一些额外信息，包括你的分析器系统的 IP 地址、你想要捕获流量的远程系统，以及远程系统下游的路由器。


    当你打开 Cain & Abel 时，你会注意到窗口顶部有一系列标签。（ARP 缓存毒只是 Cain & Abel 众多功能之一）。为了我们的目的，我们将在
    Sniffer（嗅探器）标签页中工作。当你点击此标签时，你将看到一个空表（图 2-8）。


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_43_0.png)


    图 2-8：Cain & Abel 主窗口中的 Sniffer 标签页。


    为了填充此表，你需要激活程序内置的嗅探器并扫描网络中的主机。要这样做，请遵循以下步骤：


    - 1. 点击工具栏上类似于网卡的图标。第一次执行此操作时，系统会要求你选择要嗅探的接口。这将是你执行投毒的接口。

    - 2. 选择接口后，点击 OK 激活 Cain & Abel 的内置嗅探器。

    - 3. 为了构建主机列表，点击类似于 (+) 符号的图标，然后点击 OK（图 2-9）。


    原本的网格应该填充网络上所有主机的列表，以及它们的 MAC 地址、IP 地址和供应商信息。这是你在设置 ARP 毒时将使用的列表。


    在程序底部，你会看到一组标签，它们将带你进入其他窗口。现在你有了主机列表，将在 ARP 标签页工作。通过点击标签切换到 ARP 窗口。


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_44_0.png)

    图 2-9：Cain & Abel 主窗口中的 Sniffer 标签页。


    # 在路由环境中进行嗅探


    在交换式网络上接入链路的所有技术在路由网络上同样可用。在处理路由环境时，主要的考虑因素是在解决跨多个网络段的问题时，嗅探器放置位置的重要性。


    正如你之前学过的，设备的广播域一直延伸到路由器。在这一点上，流量被交给下一个上游路由器，在收到接收确认之前，你将无法与传输的数据包通信。在这些数据必须跨越多个路由器的情况下，分析路由器各侧的流量是非常重要的。


    例如，考虑你在由各种路由器连接的多个网络段中可能遇到的通信问题。在这个网络中，每个段都与上游段通信以存储和检索数据。我们正在尝试解决的问题是下游子网 D 无法与网络
    A 任何设备通信（图 2-11）。


