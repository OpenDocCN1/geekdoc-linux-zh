    # Summary


    The sad truth about troubleshooting wireless network problems is that wireless

    client software usually doesn''t report specific problems: The client either

    connects or it doesn''t. Luckily, wireless packet analysis techniques allow us

    to see exactly what is going on and to more efficiently troubleshoot wireless

    networks.


    # Final Thoughts


    Wireless networks are becoming a staple in the corporate environment.

    As focus shifts to wireless, we must be able to troubleshoot both wired and

    wireless networks. The skills and concepts taught in this chapter should help

    y to understand the intricacies of troubleshooting a wireless network with

    packet analysis.'
  - '[PAGE 172]


    # 11


    # FURTHER READING


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_172_0.png)


    Although Wireshark is the only tool required for packet analysis in most cases,
    several other tools and websites may come in handy when you''re performing packet
    analysis.


    Cain & Abel (http://www.oxid.it)

    You may remember Cain & Abel from our discussion of ARP cache poisoning in Chapter
    2. Along with being able to perform ARP cache poisoning, Cain & Abel also has
    several other great features including password sniffing and recovery, VoIP recording,
    and general network information gathering capabilities.


    # PingPlotter


    This program is an extension of the ICMP ping utility and allows you to take the
    text output you would normally get from a ping and graph it that you can better
    analyze trends in network connectivity. This capability comes in handy when you
    want to do long-term analysis. You can download PingPlotter from http://www.pingplotter.com/download.html.'
  - '[PAGE 173]


    # Superscan 4


    Superscan 4 is a simple network scanning utility. The main draw is its incredible
    scanning speed; Superscan scans efficiently and quickly when you are in a hurry
    to get the information you need. You''ll find a lot of use for this tool when
    collecting information about a host or network. You can download Superscan from
    http://www.foundstone.com/resources/proddesc/superscan.htm.


    # RUMINT


    RUMINT (pronounced room-inf) is a freely distributed application that you can
    use to visualize captured packet data. It provides quite detailed graph and visualization
    options to help you understand and model the packets you have captured. You can
    read more about RUMINT at http://www.rumint.org.


    # Engage Packet Builder (http://www.engagescurity.com/products/engagepacketbuilder)


    The Engage Packet Builder by Engage Security (shown in Figure 11-1) allows you
    to construct and transmit your own customized packets. You might use these packets
    for educational purposes or to test firewalls, intrusion detection systems, or
    devices susceptible to flooding attacks.


    You can use Engage Packet Builder to craft individual packets with numerous options,
    and you can use scripts to automate certain aspects of packet creation.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_173_0.png)


    Figure 11-1: Engage Security''s Engage Packet Builder


    Chapter 11'
  - '[PAGE 174]


    # IANA (http://www.iana.org)


    The Internet Assigned Number Authority (IANA) oversees the allocation of IP addresses
    and protocol number assignments for North America. Its website offers valuable
    reference tools, such as the ability to look up port numbers, view information
    related to top-level domain names, and browse companion sites to find and view
    RFCs.


    # Wireshark Wiki and Mailing List (http://www.wireshark.org)


    Since Wireshark is a community-driven project, the Wireshark wiki and mailing
    list are Wireshark’s primary means of support.


    # Wireshark University (http://www.wiresharktraining.com)


    Wireshark University was launched in March 2007 by several key players in the
    Wireshark and packet analysis community, including Gerald Combs (author of Wireshark),
    Laura Chappell (Senior Protocol Analyst of the Packet Analysis Institute), John
    Bruno (co-founder of CACE technolologies), and Loris Degioanni (author of WinPcap).


    Wireshark University is the premier Wireshark training resource. In addition to
    its self-paced video training offerings, it also offers a Wireshark certification
    program.'
  - '[PAGE 175]


    # AFTERWORD


    I hope that you have managed to get everything out of this book that I have put
    into it. Packet analysis is both a science and an art, similar to medicine—the
    network is the patient and you are the physician. Just as a doctor knows the human
    anatomy and the science behind medicine, a network administrator knows the elements
    of network architecture and the protocols behind. Still, regardless of how much
    of the science you understand something, you can''t be the best until you truly
    understand how it works and have some experience behind it. This is why seasoned
    doctors are the go-to people when it comes to complex cases. The same applies
    for network administrators.


    The main goal of this book has been to introduce you to the tools and concepts
    that you must master in order to learn how to get a feel for a network. The more
    you use packet analysis and the more real-world experience you gain, the more
    effectively you will be able to solve even the most complex network problems.
    I challenge you to use Wireshark to go out and explore your own network and others
    (with permission, of course) and examine communication at the packet level. It
    is only there you will really learn what it means to delve into a network and
    see exactly what is happening on the wire. This is the essence of practical analysis.'
  - '[PAGE 176]


