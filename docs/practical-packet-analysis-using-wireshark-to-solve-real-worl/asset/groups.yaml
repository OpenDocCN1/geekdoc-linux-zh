    connections to a list of systems outside our network. More ominously, most of
    that traffic is lost with the TCP SYN flag, on which a receiving computer is sent
    its buffer and push that traffic through, ahead of any other traffic. This is
    always a bad sign.


    Still, most of these connections are already past the TCP handshake phase, meaning
    they are actively transferring data to and from our client. You can see how many
    of connections are taking place at the Conversations dialog in Figure 8-22.


