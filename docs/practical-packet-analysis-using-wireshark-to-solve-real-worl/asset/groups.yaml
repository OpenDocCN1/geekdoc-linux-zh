    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_120_0.png)


    As a network administrator, much of your time will be spent fixing computers and
    services that are running more slowly than they should be. The most common complaint
    heard by IT staff is that the network is slow. However, just because someone says
    that the network is running slowly does not mean that a network problem is to
    blame.


    Therefore, before you begin to tackle a slow network problem, you first have to
    determine whether the network is, in fact, running slowly. In this chapter we
    will look at several different scenarios in which a user is complaining that the
    network is slow.


