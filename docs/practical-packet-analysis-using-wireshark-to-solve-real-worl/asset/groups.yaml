    [PSH, ACK] Seq=5840 win=8760 Len=648 |


    Figure 7-2: These TCP retransmissions are a sign of a weak or dropped connection.


    By design, when TCP sends a packet and does not get a reply, it waits a specified
    amount of time then retransmits the original packet. If a response is still not
    received, the source (transmitting) computer doubles the amount of time it waits
    for a response before sending another transmission. The concept of a TCP retransmission
    is illustrated in Figure 7-3.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_99_0.png)


    Figure 7-3: Too many TCP retransmissions are usually a sign of a connectivity
    problem.


    As shown in Figure 7-3, the TCP retransmission process repeats until five retransmission
    attempts are completed, which always takes approximately 9.6 seconds under its
    Windows implementation. Once retransmission attempts have failed, the connection
    has completely failed and the data in the transmission is lost.


    If you select your Wireshark display format to show the time that has elapsed
    since the previously captured packet (View ► Time Format ► Seconds Since Capturing),
    you can visualize the increasing of time between packets (Figure 7-4).


    | Time | Description | Protocol | Info |

    | --- | --- | --- | --- |

    | 5.000000 | 10.30.10 | TCP | TCP Retransmission | 1068 < 1043 FSH, Ack=8760 Len=648
    |

    | 6.000000 | 10.30.10 | TCP | TCP Retransmission | 1068 > 1043 FSH, Ack=8760 Len=648
    |

    | 7.000000 | 10.30.10 | TCP | TCP Retransmission | 1068 > 1043 FSH, Ack=8760 Len=648
    |

    | 8.000000 | 10.30.10 | TCP | TCP Retransmission | 1068 > 1043 FSH, Ack=8760 Len=648
    |

    | 9.400000 | 10.30.10 | TCP | TCP Retransmission | 1068 > 1043 FSH, Ack=8760 Len=648
    |


    Figure 7-4: Windows will retransmit if five times by default.


    Now a closer look at the packets when being retransmitted in Figure 7-4. Notice
    that their sequence number (SEQ=5840) matches the ACK number of packet five at
    the bottom of Figure 7-1 (ACK=5840).


    As learned in Chapter 6, TCP relies on SEQ and ACK numbers to keep a TCP stream
    in order. Because the SEQ number in the retransmissions matches the ACK number
    of packet 5, you know that packet 5 is the packet that was lost and is now being
    retransmitted. The ability to locate the exact packet at which a TCP retransmission
    attempt begins may lead you to clues that explain exactly why a loss of connectivity
    occurred.


