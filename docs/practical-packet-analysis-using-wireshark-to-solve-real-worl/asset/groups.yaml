    # 缓慢的路径


    **icmp-tracer-slow.pcap** 解决任何网络缓慢问题的第一步是确定问题的根源。在以下场景中，帮助热线刚接到 Owen 的电话，他抱怨他的互联网连接极其缓慢。


    # 我们所知的信息


    在开始处理这个相当直观的投诉之前，我们不需要了解太多信息。我们确认了，无论访问哪个网站，网络缓慢的问题都一直存在。经过进一步调查，我们获知与 Owen 处于同一网络上的每台机器都遇到了这个问题。


    # 接入线路线


    由于 Owen 是第一个对此问题提出投诉的人，我们将从他的电脑进行分析（尽管网络上的任何一台电脑可能都足够了）。我们直接在他的机器上安装 Wireshark，以获取我们所需的的数据包。


    由于该问题影响了多台电脑，我们知道这并不是 Owen 电脑的特定性问题；仅捕获他那台电脑尝试访问互联网的数据包将无法提供我们所需的信息。相反，我们使用 ICMP
    跟踪工具来更好地了解问题所在的位置。


    traceroute 是一种基于 ICMP 的诊断工具（基于 UDP 的 Unix），它会向路径上的每个路由器发送数据包，直到到达指定的目的地。traceroute
    将报告关于任何延迟的一些基本信息（如图 8-7 的输出所示），但为了真正掌握瓶颈在哪里，我们将使用 Wireshark 捕获 traceroute 的结果。


    我在图 8-7 中包含了一张示例 traceroute 输出图像。每行代表在通往目的地路由中跨越网络所需的时间。


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_125_0.png)


    图 8-7：标准的 traceroute 输出


    # 分析


    查看捕获文件（icmp-traceroute-slow.pcap，图 8-8），我们首先看到从 Owen 电脑发送到远程主机的 Echo (ping) 请求数据包。


    | 序号 | 时间 | 源 | 目的地 | 协议 | 信息 |

    |---|---|---|---|---|---|

    | 1 | 0.000000 | 24.6.126.1 | 198.173.244.32 | ICMP | Echo (ping) request |

    | 2 | 0.363482 | 24.6.126.1 | 198.173.244.32 | ICMP | Echo (ping) request |

    | 3 | 0.726964 | 24.6.126.1 | 198.173.244.32 | ICMP | Echo (ping) request |

    | 4 | 1.371704 | 24.6.126.1 | 198.173.244.32 | ICMP | Echo (ping) request |


    图 8-8：从 Owen 电脑发送到远程主机的 Echo (ping) 请求


    这些数据包与普通的 ping 数据包有一点不同，如果你查看 IP 部分的 TTL 值就能发现。不同之处在于这些数据包中的生存时间（time-to-live）值为
    1，如图 8-9 所示。


    ```

    协议：ICMP，源：24.6.126.1，目的：198.173.244.32

    版本：4，头部：20 字节

    区分服务字段：0x00，默认；ECN：0x00

    总长度：92

    标识：0xb5f6 (46582)

    标志：0x00

    分片偏移：0

    生存时间：1

    协议：ICMP (1)

    头部校验和：0xb1fc [正确]

    源：24.6.126.1

    目的：198.173.244.32

    ```


    图 8-9：ping 数据包的生存时间值为 1。


    生存时间（TTL）值是一个数值，决定了数据包从一个路由器到另一个路由器可以跳数的次数。值为 1 意味着 traceroute 向目的地发送数据包，但数据包一旦遇到路由上的第一个路由器就会过期；此时将返回一个
    ICMP TTL 过期包。traceroute 会发送另一个 TTL 为 2 的数据包，当数据包遇到路由上的第二个路由器时将返回一个 ICMP TTL 过期包。这个过程一直持续，直到数据包的
    TTL 正好足够到达目的地，如图 8-0 所示。


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_126_0.png)


    图 8-10：TTL 值随着路由到目的地而增加。


    将我们发现的新知识应用于当前情况，我们可以立即看到第一个数据包的问题。该数据包的 TTL 值为 1，它应该立即命中内部路由器并向我们报告——但它并没有。由于
    Owen 的电脑没有收到值为 1 的第一个数据包的立即响应，它等待了大约三秒（如图 8-11 中的 Time 字段所示），然后发送了另一个请求。


    | 序号 | 时间 | 源 | 目的地 | 协议 | 信息 |

    |---|---|---|---|---|---|

    | 2 | 3638126 | 24.6.126.1 | 198.173.244.32 | ICMP | Echo (ping) |

    | 3 | 3681276 | 24.6.126.1 | 198.173.244.32 | ICMP | Echo (ping) |


    图 8-11：Owen 的电脑发送请求，未收到响应，并在三秒后发送了另一个请求。


    当电脑没有收到第二次尝试的响应时，它又等待了大约三秒并向路由器发送了最后一个数据包，结果证明也是失败的，如图 8-12 所示。


    | 序号 | 时间 | 源 | 目的地 | 协议 | 信息 |

    |---|---|---|---|---|---|

    | 3 | 3638126 | 24.6.126.1 | 198.173.244.32 | ICMP | Echo (ping) |

    | 4 | 3931704 | 24.6.126.1 | 198.173.244.32 | ICMP | Echo (ping) |


    图 8-12：再次没有收到响应后，电脑再次尝试一次。


    此时，traceroute 到了来自第一个路由器的回复，因此它的下一个数据包（第四个数据包）的 TTL 值为 2。该数据包成功到达了路由器，Owen 的电脑收到了预期的
    ICMP 类型 1、代码 0 数据包，该包包含“生存时间超时”的消息，如图 8-13 所示。


    | 序号 | 时间 | 源 | 目的地 | 协议 | 信息 |

    |---|---|---|---|---|---|

    | 5 | 3939304 | 24.6.126.1 | 198.173.244.32 | ICMP | Time-to-live exceeded |


    图 8-13：生存时间超时消息。


    值为 1 意味着 traceroute 会向目的地发送一个数据包，但数据包一旦遇到路由上的第一个路由器就会过期；这种过程持续，直到数据包的生存时间足够目的地。


    我们将新发现的知识应用于当前情况，我们可以立即看到第一个数据包的问题。该数据包的 TTL 值为 1，它应该立即命中内部路由器并向我们报告——但它并没有。由于
    Owen 的电脑没有收到值为 1 的第一个数据包的立即响应，它等待了大约三秒（如图 8-11 中的 Time 字段所示），然后发送了另一个请求。


    总结：再次，Wireshark 为我们节省了大量的排障时间。


    '
