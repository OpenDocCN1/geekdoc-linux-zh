    # 7


    # # BASIC CASE SCENARIOS


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_98_0.png)


    Now we’ve arrived at the real meat and bones of this book—we are ready to use
    Wireshark and packet analysis to actually analyze network problems.


    We''ll begin with a look at some simple scenarios in which our ability to analyze
    packets will help us to better understand what''s going behind the scenes. Then
    we''ll look at some simple real-world troubleshooting scenarios that you could
    very possibly encounter on a daily basis. Let''s dive in.


    # ## A Lost TCP Connection


    One of the most common problems we encounter when troubleshooting is a loss of
    network connectivity. For now, we’ll ignore the reasons why that loss of connectivity
    might occur and take a look at what that loss actually looks like at the packet
    level, so you can identify this type of problem when troubleshooting.'
