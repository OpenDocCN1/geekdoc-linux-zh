    # Domain Name System


    The Domain Name System (DNS, RFC 1034) translates one of address into another—specifically,
    it translates addresses, such as www.google.com or MARKETING-PC1, into its corresponding
    IP addresses. Some form of address translation is a requirement, since Layer 3
    of the OSI model can only locate a client if it has its IP address.


