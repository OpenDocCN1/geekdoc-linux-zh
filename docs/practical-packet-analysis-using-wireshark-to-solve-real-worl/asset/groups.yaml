    # Summary


    In this case, a user installed BitTorrent on his workstation and configured to
    allow both incoming and outgoing connections at an unlimited rate. This high amount
    of bandwidth allowed one workstation to monopolize all of the company''s Internet
    traffic.


    This case reminds us that when doing analysis, it is common to use some of the
    advanced features to quickly solve the problem; however, sometimes the quickest
    solution is to simply examine individual packets.'
