    # 总结


    数据包分析并不总是能直接指向问题所在。事实上，在当前场景中，抓包文件中没有任何特定的内容能识别出防火墙是问题所在。然而，这项分析使我们能够将问题范围缩小到特定的服务器。


    有时，你必须排除影响几十甚至上百个系统的故障。如果你在这些情况下可以使用数据包分析将问题缩小到某台特定的计算机，那么你就节省了自己大量的时间。


    # 不是我的错！


    ```

    http-fault-post.pcap

    ```


    有些网络用户简直没法理喻。你是否遇到过这样的人的人：他们总是把每一个小问题都归咎于 IT 部门？Erin 就是这样一种用户。每当网络运行低于最佳状态一点点时，她总是乐意通知你。


    # 我们已知的情况


    我们知道 Erin 从未成功通过上述 Web 表单发送过数据，但她可以毫无故障地提交她需要的任何其他 Web 表单。查看该网站的源代码，我们看到它使用的是标准的
    HTML 表单，没有带有任何花哨的功能。


    # 接入线路


    在 Erin 的电脑上安装 Wireshark 是获取我们所需的抓包文件最简单的方法。安装完成后，我们就可以开始抓包过程，然后 Erin 尝试填写并提交她的表单，此时我们就会开始分析过程。


    # 分析


    追踪文件（http-fault-post.pcap）始于 Erin 的电脑（24.4.97.251）与远程 Web 服务器（216.23.168.114）之间的标准
    TCP 握手，如图 7-21 所示。


    # 图 7-21：到目前为止正常。标准的 TCP 握手开始了 Erin 电脑与远程服务器之间的通信。


    此后，客户端和服务器之间开始了 HTTP 通信。注意 Info 列（图 7-22），客户端没过多久就接收到了服务器发出的 HTTP 403 消息，这就是投诉的源头。


    | No. | Time | Source | Destination | Protocol | Info |

    |---|---|---|---|---|---|

    | 1 | 0.000000 | 216.23.168.114 | 24.47.95.121 | TCP | |

    | 2 | 0.027956 | 216.23.168.114 | 24.47.95.121 | TCP | http -> 2379 [SYN] Ack=0
    Seq=Win=16384 Len=0 |

    | 3 | 0.028045 | 24.47.95.121 | 216.23.168.114 | TCP | 2579 -> [ACK] Ack=1 Win=65535
    Len=0 |


    # 图 7-22：HTTP 403 消息来得很快。


    403 错误发生在第 9 个数据包。由于这是我们关心的抓包文件中唯一的数据流，右键点击并选择 **Follow TCP Stream**（跟踪 TCP 流），即可看到
    HTTP 事务的清晰呈现，如图 7-23 所示。


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_112_0.png)


    # 图 7-23：导致 403 消息的 HTTP 事务 TCP 流应该是你需要的全部证据。


    查看此 TCP 流，我们首先看到从客户端发送到服务器的表单数据。此时，我们本应该看到来自服务器的响应，显示表单数据已被接收，但我们看到的却是 403 响应。这足以证明问题出在远程服务器上，而不是你的网络上。


    # 总结


    当你必须证明自己确实知道自己在做什么时，数据包分析通常是一个极佳的工具。你不仅有时向管理层证明你的假设，有时你还必须向自己证明。


    在这种情况下，可以将 TCP 流的明文解释展示给你的主管，以结束 Erin 对 IT 部门的无理指责。


    # 一个恶意程序


    这个场景与 Chad 的电脑被黑客攻击的情况非常相似。然而在这种情况下，情况要复杂一些。Mandy 是我们网络上的另一个用户，她抱怨浏览器中发生了奇怪的事情。浏览器在全天任何随机时间将她的主页更改为一个伪造网站。不仅如此，她还看到了很多弹出窗，而且她的电脑整体运行非常缓慢。


    # 我们已知的情况


    解决这个特定问题不需要了解太多。我们知道 Mandy 的电脑运行非常缓慢且持续如此。她的电脑正在运行病毒扫描软件，所以病毒对我们来说不太需要担心。


    # 接入线路


    在排故障与间谍软件相关的问题时，在电脑启动时开始追踪文件始终是一个好主意。大多数间谍软件倾向于受感染电脑启动时“拨回家”以检查更新等。


    我们将在电脑启动后立即开始抓包，并持续捕获数据包直到启动过程完成后一分钟后。在这种情况下，集线器法（hubbing out）或 ARP 缓存中毒是拦截该机器数据包的最佳方法。由于我们网络上的流量很大，我们将创建一个只捕获
    Mandy 进出流量的抓包过滤器。


    # 分析


    这是一个很大的抓包文件，我们将从开始查看。前两个数据包（如图 7-24 所示）是计算机启动并初始化其 TCP/IP 栈时常见的现象。


