    # ADVANCED WIRESHARK

    FEATURES


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_72_0.png)


    Once you master the basic concepts of Wireshark, you will probably want to delve
    further into some of its more advanced features. In this chapter we''ll look at
    some of these powerful features, including name resolution, protocol dissection,
    and packet reassembly.


    # Name Resolution


    Network data is transported via various alphanumeric addressing systems that are
    often too long or complicated to remember, as the physical hardware address 00:16:CE:6E:8B:24.
    Name resolution (also called name lookup) is the process a protocol uses to convert
    one identifying into another. For example, a computer might have the physical
    address 00:16:CE:6E:8B:24, the DNS and ARP protocols allow us to see its name
    as Marketing-2. By associating easy-to-read names with these cryptic addresses,
    we make them easier to remember and identify.'
  - '[PAGE 73]


    We can leverage various name resolution tools to make our capture files more readable
    and to save a lot of time in certain situations. For example, we can use DNS name
    resolution to help readily identify the name of a computer we are trying to pinpoint
    the source of a particular packet.


    # Types of Name Resolution Tools in Wireshark


    There are three types of name resolution available in Wireshark: MAC name resolution,
    network name resolution, and transport name resolution.


    # MAC Name Resolution


    MAC name resolution uses the ARP protocol to attempt to convert Layer 2 MAC addresses,
    such as 00:09:5B:01:02:03, into Layer 3 addresses, such as 100.10.12.1. If attempts
    at these conversions fail, Wireshark''s last resort is to convert the first three
    bytes of the MAC address into the device''s IEEE-specified manufacturer name,
    such as Netgear:01:02:03.


    # Network Name Resolution


    Network name resolution attempts to convert a Layer 3 address, such as the IP
    address 192.168.1.50, into an easy-to-read DNS name such as MarketingPC1.


    # Transport Name Resolution


    Transport name resolution attempts to convert a port number into a name associated
    with it. An example of this would be to display port 80 as http.


    # Enabling Name Resolution


    To enable name resolution, open the Capture Options dialog (shown in 5-1) either
    by choosing Capture > Options or by pressing CTRL-K.


    | Name Resolution |

    |---||

    | [x] Enable MAC name resolution |

    | [ ] Enable network name resolution |

    | [ ] Enable transport name resolution |

    | | Start | Cancel |


    > Figure 5-1: Enabling name resolution features in the Capture Options dialog


    # Potential Drawbacks to Name Resolution


    Given its benefits, using name resolution may seem like a no-brainer, but there
    are some potential drawbacks, including the following:


    +   - Sometimes name resolution fails. This may be simply because the name is
    unknown by the name server the query was sent to.'
  - '[PAGE 74]


    +   Name resolution must take place every time you open a specific capture file
    because this information is not saved in the file. This means that if the servers
    a file''s name resolution depends upon are not available, name resolution will
    fail.


    +   DNS may add additional packets to the capture file, silently and without warning.
    The resulting traffic to resolve all DNS-based addresses will cloud your capture
    file.


    +   Name resolution requires additional processing overhead. If you are dealing
    with a very large capture file and are running low on memory, you may want to
    forgo the name resolution feature in order to conserve system resources.


    # Protocol Dissection


    A protocol dissector allows Wireshark to break down a protocol (ICMP, example)
    into various sections so it can be analyzed. The ICMP protocol dissector allows
    Wireshark to take the raw data off the wire and format it as an ICMP packet. You
    can think of a dissector as the translator between the raw data flowing across
    the wire and the Wireshark program. In order for a protocol to be supported by
    Wireshark, it must have a dissector built into it.


    Wireshark uses several dissectors in union to interpret each packet. It determines
    which dissectors to use by using its programmed logic and making a very well-educated
    guess.


    Unfortunately, Wireshark does not always make the right choices when selecting
    the correct dissector to use on a packet. This is especially true when it is using
    a protocol on the network in a nonstandard configuration, as luckily we can change
    the way Wireshark implements certain dissectors.


    For example, open the trace file wrongdissector.dmp. Notice that this file contains
    a bunch of NetBIOS communication between two computers. However, there is something
    something wrong here. If you click one of the packets, you will notice some data
    in the Packet Bytes pane that definitely does not look like NetBIOS traffic. In
    fact, if you look at packets 6 and 7, you can actually see a username and password
    being sent from one computer to the other.


    After a little investigation, we find that the computers we are actually analyzing
    via FTP (note the words FTP Server at the right side of Figure 5-2). Wireshark
    thinks that this is NetBIOS traffic because the server and client are configured
    to use FTP on port 137, the default port for NetBIOS communication.'
  - '[PAGE 75]


    Figure 5-2: FTP server software? This can''t be used with NetBIOS traffic!



    To fix this problem, we force Wireshark to use the FTP protocol dissector on these
    packets, a process referred to as a *forced decode*. To perform this process,
    follow these steps:


    +   1. Right-click one of the packets and select **Decode As**. This will bring
    up a dialog in which you can select the dissector you wish to use (Figure 5-3).

    2. Tell Wireshark to decode all TCP source port 137 traffic using the FTP dissector
    by selecting **source (137)** from the drop-down menu and selecting **FTP** under
    the Transport tab.

    3. Once you have made your selections, click **OK** to save the changes immediately
    applied to the capture file. You will see the data newly decoded so that you can
    analyze it from the Packet List pane without having to dig deep into its individual
    bytes.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_75_0.png)


    Figure 5-3: The Decode As dialog allows you to create forced decodes.


    > **NOTE** The changes you make when creating a forced decode are not saved when
    you save the capture file. You must recreate your forced decodes every time you
    open the capture file.'
