    包分析的伟大之处在于，它已成为一种日益流行的解决问题和学习更多网络知识的方法。得益于用户组、维基（wiki）和博客的出现，书中涵盖的技术正在成为某些工作的先决知识。包分析是管理当今网络的要求，而这本书将为你学习其所有运作原理提供你所需的跨越。


