    of setup, you must have access to the command-line interface of the switch on
    which the target computer is located. Also, the switch must support port mirroring
    and have an empty port into which you can plug your analyzer.


    When port mirroring, you log into the command-line interface for your switch and
    enter a command that forces the switch to copy all traffic on a certain port to
    another port (Figure 2-5). For instance, to capture the traffic from a device
    on port three of a switch, you could simply plug your analyzer into port four
    and mirror port three to port four. This would allow you to see all traffic transmitted
    and received by your target device.


    The exact command you will type to set up port mirroring will vary depending on
    the manufacturer of the switch you are using. You''ll find a list of common commands
    in Table 2-1.'
  - '[PAGE 40]


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_40_0.png)


    **Figure 2-5:** Port mirroring allows you to expand your visibility of the ports
    you are on a switched network.


    When port mirroring, be aware of the throughput of the ports you are mirroring.
    Some manufacturers allow you to mirror multiple ports to one individual port,
    which may be very useful when analyzing the communication between two or more
    devices on a single switch. However, consider what will will happen when using
    some basic math. For instance, if you have a 24-port switch and you mirror 23
    full-duplex 100Mbps to one port, you could potentially have 4,600Mbps flowing
    to that. This is obviously well beyond the physical threshold of a single port
    and can cause packet loss or network slowdowns if the traffic reaches a certain
    level. In these situations switches have been known to completely drop excess
    packets or “pause” their backbone, preventing communication altogether. Be sure
    that this type of situation doesn''t occur when you are trying to perform your
    capture.


    **Table 2-1:** Commands Used to Enable Port Mirroring for Different Manufacturers''
    Switches


    | Manufacturer | Port Mirroring Command |

    | --- | --- |

    | Cisco | set span <source port> <destination port> |

    | Enterasys | set port mirroring create <source port> <destination port> |

    | Nortel | port-mirroring-port <source port> monitor-port <destination port> |


    # # Hubbing Out


    Another very simple way of capturing the traffic through a target device on a
    switched network is hubbing out. *Hubbing out* is a technique in which you localize
    the target device and your analyzer system on the same network segment by plugging
    them directly into a hub.


    Many people think of hubbing out as cheating, but it''s really a perfect solution
    in situations where you can''t perform port mirroring but still have physical
    access to the switch the target device is plugged into.'
