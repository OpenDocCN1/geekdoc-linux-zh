    ### CWD Command


    As you can see, packet 15 shows a CWD command being sent from the client to the
    server. CWD stands for *change directory*, and this command is invoked every time
    you tell an client to move to a different directory on the server. Notice in this
    example that the CWD command includes requests to change the directory to /, which
    is the root directory of the FTP server. When you first log into a server, the
    CWD command is issued to change to the root directory /. The server tells the
    client that / is now the working directory.


