    ## 表 10-1；无线类型/子类型及相关过滤器语法


    | 帧类型/子类型 | 过滤器语法 |

    |---|---|

    | 管理帧 (Management frames) | wlan.fc.type eq 0 |

    | 控制帧 (Control frames) | wlan.fc.type eq 1 |

    | 数据帧 (Data frames) | wlan.fc.type eq 2 |

