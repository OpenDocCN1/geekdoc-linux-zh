    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_166_0.png)


    Figure 10-11: Adding the IEEE wireless-specific columns to the Packet List pane


    # Wireless-Specific Filters


    We discussed the benefits of capture filters in Chapter 4. In a wired infrastructure,
    it is easier to filter the traffic you want to capture, since each device has
    its own dedicated channel. In a wireless network, all traffic generated by wireless
    clients coexists on shared channels, which means that a capture of any one channel
    may contain traffic from clients. This section is devoted to some packet filters
    that can be used to help find the traffic you want.'
  - '[PAGE 167]


    Each WAP in a network has a unique identifying name called its Basic Service Set
    Identifier (BSS Id). This name is sent in every wireless management and data frame
    the access point transmits. (See “802.11 Packet Extras” on page 142.)


    Once you know the name of the BSS Id you want to examine, you all really have
    to find a packet that has been sent from that particular WAP. Wireshark shows
    the transmitting WAP in the Info column of the Packet List, so finding this information
    is typically pretty easy.


    Once you have a packet from the particular WAP you want, find its BSS Id field
    in the 802.11 header, as shown in Figure 10-9. This is the address you will filter
    on.


    After you have found the BSS MAC address (listed in the Packet Details pane) you
    can use the filter wlan.bssid.eq 00:11:23:44:55:66 to show only the traffic flowing
    through that particular WAP.


    Earlier in this chapter, we discussed the different types of wireless packets
    you can see on a network. You will often need to be able to filter based upon
    these types and subtypes. Use Table 10-1 as a reference to help you build the
    filters you need.


    Although management packets are very important for some types of analysis, analysis
    may only require looking at the data being passed through the air—for instance,
    if we need to track rogue wireless clients or identify the possibility of unwanted
    information disclosure over the wireless network. Therefore, we need to know how
    to filter only data packets.


    To filter out all but the data packets in a capture file, use the filter wlan.fc.type
    eq 2. (If you reference Table 10-1, you will see that a packet of type 2 will
    show all data pertaining to the data frames.)


    The only downside to using this filter is that it still allows for display of
    NULL packets. These packets are used by certain WAPs and wireless NICs to alert
    the network that they are about to switch channels. If you don''t need to see
    these NULL packets, filter them out by expanding the filter we created earlier
    and removing the NULL packet subtype. The filter looks like this completed:


    Differentiating between unencrypted and encrypted data is a great way to identify
    rogue WAPs on a network or to determine whether sensitive information is being
    sent in cleartext.'
  - '[PAGE 168]


    # Table 10-1; Wireless Types/Subtypes and Associated Filter Syntax


    | Frame Type/Subtype | Filter Syntax |

    |---|---|

    | Management frames | wlan.fc.type eq 0 |

    | Control frames | wlan.fc.type eq 1 |

    | Data frames | wlan.fc.type eq 2 |

    | Association request | wlan.fc.type_subtype eq 0 |

