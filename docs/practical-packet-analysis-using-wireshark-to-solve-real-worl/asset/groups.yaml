    This is a great opportunity to use a filter to show only those packets that represent
    an FTP login attempt, like so:


    ```

    ftp.request.command == "USER" || ftp.request.command == "PASS"

    ```


    Figure 9-8 shows the result of this filter.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_147_0.png)


    Figure 9-8: The short display filter entered into the Filter window helps to show
    only relevant traffic.


    Now, if we look in the Info column of each login attempt, we can see that the
    passwords being used are in alphabetical order—that is, the attacker is stepping
    through each letter of the alphabet in succession. This is a tell sign that someone
    is trying to guess the password of an account using a dictionary-style attack.
    A dictionary attack is one in which passwords are guessed based upon a user- or
    machine-created dictionary of words. If you look at the time between each attempt,
    you can also see that these attempts to guess the password are happening too quickly
    to be entered by a human; they''re most likely launched by a cracking tool. We
    have successfully found the source of our high-bandwidth utilization.'
