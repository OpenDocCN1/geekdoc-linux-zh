    # # 3


    # # INTRODUCTION TO WIRESHARK


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_48_0.png)


    There are several different packet sniffing applications available for performing
    network analysis, but we''ll be using Wireshark throughout this book. This chapter
    discusses the history of Wireshark, as well as its benefits, installation, and
    basic use.


    # ## A Brief History of Wireshark


    Wireshark has a very rich history. Gerald Combs, a computer science graduate of
    the University of Missouri at Kansas City, originally developed it out of necessity.
    The very first version of Combs'' application, called Ethereal, was released in
    1998 under the GNU Public License (GPL).


    Eight years after releasing Ethereal, Combs left his job to pursue other career
    opportunities. Unfortunately, his employer at that time had full rights to the
    Ethereal trademarks, and Combs was unable to reach an agreement that would allow
    him to control the Ethereal "brand." Instead, Combs and the rest of the development
    team rebranded the project as Wireshark in mid-2006.'
  - '[PAGE 49]


    Wireshark has grown dramatically in popularity, and its collaborative development
    team now boasts over 500 contributors. The program as it exists under the Ethereal
    name is no longer being developed.


    # The Benefits of Wireshark


    Wireshark offers several benefits that make it appealing for everyday use. It
    is aimed at both the journeyman and the expert packet analyst and offers a variety
    of features to entice each. Let''s examine Wireshark according to the criteria
    I defined in Chapter 1 for selecting a packet sniffing.


    # Supported Protocols


    Wireshark excels in the number of protocols that it supports—over 850 of its writing.
    These protocols run from common ones like IP and DHCP to more advanced proprietary
    protocols like AppleTalk and BitTorrent. Because Wireshark is developed under
    an open source model, new protocol support is added with each update. If there
    is a protocol that Wireshark doesn''t support, you can code to support yourself
    and submit your code to the Wireshark developers for inclusion in the application
    (if your code is accepted, of course). That said, there is really almost no protocol
    that Wireshark isn''t capable of supporting.


    # User Friendliness


    The Wireshark interface is one of the easiest to understand of any packet sniffing
    application. Wireshark is a GUI-based application with very clearly written menus
    and a straightforward layout. It also provides several features designed to enhance
    usability, as protocol-based color coding and detailed graphical representations
    of raw data. Unlike some of the more complicated command-line driven alternatives
    like tcpdump, the Wireshark GUI is great for those who are just entering the world
    of protocol analysis.


    # Cost


    Since it is open source, Wireshark''s pricing can''t be beat. Wireshark is released
    as free software under the GPL. You can download and use Wireshark for any purpose,
    whether personal or commercial.


    # Program Support


    A software package''s level of support can make or break it. When dealing with
    freely distributed software as Wireshark, there is often no formal support, which
    is why the open source community relies on its user to provide support. Luckily
    for us, the Wireshark community is one of the best and most active of any open
    source project. The Wireshark web page links directly to several forms of support,
    including online documentation,'
  - '[PAGE 50]


    a support development wiki, FAQs, and a place to sign up for the Wireshark mailing
    list, which is monitored by most of the program''s top developers. These developers,
    along with Wireshark''s massive user base, provide support that leaves no question
    unanswered.


    # Operating System Support


    Wireshark supports all major modern operating systems, including Windows Mac OS
    X, and Linux-based platforms. You can view a complete list of supported operating
    systems on the Wireshark home page.


    # Installing Wireshark


    The Wireshark installation process is surprisingly simple. In this section we
    will look at Wireshark''s system requirements and then go through the steps involved
    in installing Wireshark on both Windows and Linux.


    # System Requirements


    Before you install Wireshark, you must make sure that your system meets the following
    requirements:


    +   * A 400 MHz processor or faster

    * At least 60MB of available storage space

    * An NIC that supports promiscuous mode

    * The WinPcap capture driver


    The WinPcap capture driver is the Windows implementation of the Pcap packet capturing
    interface application programming interface (API). Simply put, this driver interacts
    with your OS to capture raw packet data, apply filters, and switch the NIC in
    and out of promiscuous mode. You can find the installation package for this driver
    at http://www.winpcap.org.


    > NOTE Although you can download WinPcap separately, it is built into the Wireshark
    installation package. It is typically better to install WinPcap from the Wireshark
    installation package because the included version of WinPcap has been tested to
    work with Wireshark.


    # Installing on Windows Systems


    The first step when installing Wireshark under Windows is to obtain the latest
    installation build from the official Wireshark web page, http://www.wireshark.org.
    Navigate to the Downloads section on the website, and choose a mirror to download
    from. Once you''ve downloaded the package, follow these steps:


    +   * Double-click the .exe file to begin installation, and then click Next in
    the introductory window.

    * Read the licensing agreement and click I Agree if you agree.'
  - '[PAGE 51]


    +   3. Select the components of Wireshark you wish to install. For our purposes,
    you can accept the defaults by clicking Next (Figure 3-1).


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_51_0.png)


    Figure 3-1: Choosing the Wireshark components you wish to install


    +   4. **Next** in the Additional Tasks window.

    5. Select the location where you wish to install Wireshark, and click **Next**.

    6. When the dialog asks whether or not you want to install WiPcap, make sure the
    box next to the words *Install WiPcap* is checked, and click **Install** (Figure
    3-2). The installation process should begin.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_51_1.png)


    Figure 3-2: Selecting the option to install the WiPcap driver


    +   7. About halfway through the Wireshark installation, the WiPcap installation
    should start. When it does, click **Next** in the introductory window. Then read
    the licensing agreement and click **I Agree** if you do.


    30 Chapter 3'
  - '[PAGE 52]


    8. WinPcap should install on your computer. Once it has finished, click Finish.


    9. Wireshark should complete its installation. Once this is done, click Next.


    10. Once the installation confirmation window appears, click Finish.


    # Installing on Linux Systems


    The first step when installing Wireshark on a Linux system is to download the
    appropriate installation package. Not every version of Linux is supported, don’t
    be surprised if your specific distribution doesn’t have its own install package.


    # RPM-based Systems


    To install Wireshark on RPM-based distributions, such as Red Hat, do the following:


    +   1. Download the appropriate installation package from the Wireshark web page.


    +   2. Open a console window and type rpm -ivh wireshark-0.99.3.i386.rpm, substituting
    the filename of your downloaded package as appropriate.


    +   3. If any dependencies are missing, install them and repeat the previous step.


    # DEB-based Systems


    To install Wireshark on a DEB-based distribution such as Debian or Ubuntu, do
    the following:


    +   1. Download the appropriate installation package from the Wireshark web page.


    +   2. Open a console window and type apt-get install wireshark.


    # Wireshark Fundamentals


    Once you have successfully installed Wireshark on your system, you can begin to
    familiarize yourself with it. Now you finally get to open your fully functioning
    packet sniffer and see . . absolutely nothing!


    The fact is, Wireshark isn’t very interesting when you first open it. In order
    to really get exciting, you have to get some data.


    # Your First Packet Capture


    In order to get packet data into Wireshark, you’ll perform your first packet capture.
    You may be thinking, “How am I going to capture packets when nothing is wrong
    on the network?” There are two things wrong with this statement. The first thing
    is that there is always something on the network. If you don’t believe me, go
    ahead and send an email to all of your employees and let them know that everything
    is working perfectly.'
- md: '

    Secondly, there doesn''t have to be something wrong in order for you to perform
    packet analysis. In fact, most packets spend more time analyzing problem-free
    traffic than traffic they are troubleshooting; you need a baseline to compare
    to in order to be able to effectively troubleshoot traffic. For example, if you
    ever hope to solve a problem with DHCP analyzing your traffic, you must understand
    what the working of DHCP traffic looks like. More broadly, in order to find anomalies
    in daily network activity, you must know what normal network activity looks like.
    When your network is running smoothly, you can set a baseline so that you will
    know what its traffic looks like in a normal state.


    We''ve covered the basics. Now let''s capture some packets!


    - 1. Open Wireshark.

    - 2. From the main drop-down menu, select Capture and Interfaces. You should see
    a dialog listing the various interfaces that can be used to capture packets, along
    with their IP addresses. Choose the interface you wish to use, and Capture (Figure
    3-3).


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_53_0.png)


    Figure 3-3: Selecting an interface on which to perform your packet capture


    - 3. Your packet capture should begin and Wireshark should show the active packet
    capture window. This window displays a brief summary of the type of traffic being
    captured, as well as the duration of the current packet (Figure 3-4).


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_53_1.png)


    Figure 3-4: The Capture window shows a brief summary of the packets being captured.


    - 4. Wait about a minute or so, and when you are ready to stop the capture and
    view your data, click **Stop.**


    Once you have completed these steps and finished the capture process, the Wireshark
    main window will come alive with data. As a matter of fact, you might be overwhelmed
    by the amount of data that appears, and it will all start to make sense very quickly
    as we break down the main window of Wireshark one piece at a time.


    ## The Main Window


    You''ll spend most of your time in the Wireshark main window. This is where all
    of the packets you capture are displayed and broken down into an understandable
    format. Using the packet capture you just made, let''s take a look at Wireshark''s
    main window (Figure 3-5), which contains three panes.


    The panes in the main window depend upon one another. In order to view the details
    of an individual packet in the Packet Details pane, you must first select that
    packet by clicking on it in the Packet List pane. Once you''ve selected your packet,
    you can see the exact bytes that comprise certain portion of the packet in the
    Packet Bytes pane when you click that portion of the packet in the Packet Details
    pane.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_54_0.png)


    Figure 3-5: The Wireshark main window uses a three-pane design.


    ## Packet List Pane


    The top pane, known as the *Packet List* pane, displays a table containing all
    packets in the current capture file. You''ll see columns containing the packet
    number, the relative time the packet was captured, the source and destination
    of the packet, its protocol, and some general information found in the packet.


    ## Packet Details Pane


    The middle pane, known as the *Packet Details* pane, contains a hierarchical display
    of information about a single packet. This can be collapsed and expanded to show
    all of the information collected from an individual packet.


    ## Packet Bytes Pane


    The lower pane, and perhaps the most confusing, is the Packet pane. This pane
    displays a packet in its raw, unprocessed form—that is, it shows the packet looks
    like as it travels across the wire. This is raw information with nothing warm
    or fuzzy to make it easier to follow.


    It is very important to understand how these different panes work with each other,
    since you will be spending most of your time working with them in the main window.


    ## The Preferences Dialog


    Wireshark has several preferences that can be customized to meet your needs. Let''s
    look at some of the Wireshark''s preferences, select Edit from the drop-down menu
    and click Preferences. This would call the Preferences dialog, which contains
    several customizable options (Figure 3-6).


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_55_0.png)


    Figure 3-6: You can customize Wireshark in the Preferences dialog.


    These preferences are divided into five major sections: user interface, capture,
    printing, name resolution, and protocols.


    ## User Interface


    The user interface preferences determine how Wireshark presents data. You can
    change most options here according to your personal preferences, including whether
    or not to save window positions, the layout of the three main panes, the placement
    of the scrollbar, the placement of the Packet List pane columns, the fonts used
    to display the captured data, and the background and foreground colors.


    ## Capture


    The capture preferences allow you to specify options related to the way packets
    are captured, including your default capture interface, whether or not to use
    promiscuous mode by default, and whether or not to update the Packet List pane
    in real time.


    ## Printing


    The printing preferences section allows you to specify various options to the
    way Wireshark prints your data.


    ## Name Resolution


    The preferences in the name resolution section allow you to activate features
    of Wireshark that allow it to resolve addresses into more recognizable names (including
    MAC, network, and transport name resolution) and specify the maximum number of
    concurrent name resolution requests.


    ## Protocols


    The preferences in the protocols section allow you to manipulate options related
    to the capturing and display of the various protocols Wireshark is capable of
    decoding. Not every protocol has configurable preferences, but some have several
    things that can be changed. These options are best left unless you have a specific
    reason for doing so, however.


    ## Packet Color Coding


    If you are like me, you may have an aversion to shiny objects and pretty colors.
    If that is the case, the first thing you probably noticed when you opened Wireshark
    were the different colors of the packets in the Packet List pane (Figure 3-7).
    It may seem like these are randomly assigned to each individual packet, but this
    is not the case.


    > NOTE: Whenever I refer to traffic, you can assume I am referring to all of the
    packets displayed in the Packet List pane. More specifically, when I refer to
    it in the context of DNS traffic, I am talking about all of the DNS protocol packets
    in the Packet List pane.


    Each packet is displayed as a certain color for a reason. For example, you may
    notice that all DNS traffic is blue and all HTTP traffic is green. The color coding
    allows you to quickly differentiate among various protocols so that you do not
    have to read the protocol field in the Packet List pane for each individual packet.
    You will find that this speeds up the time to browse through large files.


    | No. | Time | Source | Destination | Protocol | Info |

    |---|---|---|---|---|---|

    | 1 | 0000000 | 10.10.17.47 | 10.10.16.15 | DCRPC | DCRPC Request: call_id: 95
    opm_id: 09 ctx_id: 0 |

    | 3 | 0001946 | 10.10.17.47 | 10.10.16.15 | DCRPC | DCRPC Request: call_id: 96
    opm_id: 26 ctx_id: 0 |

    | 4 | 0002034 | 10.10.16.15 | 10.10.17.47 | DCRPC | DCRPC Response: call_id: 96
    ctx_id: 0 |


    Figure 3-7: Wireshark''s color coding allows for quick protocol identification.


    Wireshark makes it easy to see which colors are assigned to each protocol through
    the Coloring Rules window. In this window, follow these steps:


    - 1. Open Wireshark.

    - 2. Select **View** from the main drop-down menu.

    - 3. Click **Coloring Rules**. The Coloring Rules window should appear (Figure
    3-8), displaying a complete list of all the coloring rules defined within Wireshark.
    You can define your own coloring rules and modify existing ones.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_57_0.png)


    Figure 3-8: The Coloring Rules dialog allows you to view and modify the coloring
    of packets.

