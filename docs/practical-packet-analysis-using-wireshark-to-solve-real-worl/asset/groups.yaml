    Wireshark 最实用的分析功能之一是能够以应用层的视角查看 TCP 流。此功能允许你整合所有与数据包相关的信息，并向你展示数据包传递给终端用户所看到的应用程序的数据。TCP
    流功能不是以分块的形式查看从客户端发送到服务器的数据，而是对数据进行排序，使其易于可见。


