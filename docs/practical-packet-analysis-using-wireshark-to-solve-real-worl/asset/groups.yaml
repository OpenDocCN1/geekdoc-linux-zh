    Notice in Figure 8-3 that an abundance of packets in our capture are Window update
    packets. The transmission rate of data over a network is determined by the size
    of the TCP window. When clients are transferring data, they will constantly send
    Window update packets to each other as they receive data speeds up or slows down.
    These packets are used to notify a client that it needs to increase or decrease
    the size of the data being transmitted. You can think of this as pressing the
    button on a water fountain. If the button is pressed too much, you will not be
    able to catch all of the water in your mouth, you must instruct the person to
    decrease the pressure on the button. On the flip side, if the person is not pressing
    the button enough, you won''t be drinking as much water as you could.


