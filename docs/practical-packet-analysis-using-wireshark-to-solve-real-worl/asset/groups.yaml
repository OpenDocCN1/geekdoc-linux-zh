    # Double Vision


    In this scenario, you have installed and configured a brand new computer for Jeff,
    the newest company employee. Usually, when you install a new computer, you expect
    it to be faster than the rest of the devices on your network. However, after only
    a short while, Jeff reports that times of peak usage, his computer is experiencing
    severe slowness to the point that certain network services become unavailable.


    # What We Know


    First of all, we know that Jeff''s computer is brand new, so it should be running
    at optimal performance. Aside from that, there are no reports of network slowness,
    during either peak or off-peak usage times. We also know that Jeff is a high bandwidth
    user. Most of his tasks are network related, and he often runs multiple net-centric
    applications at once. These applications, along with Internet and email clients,
    create an above-average load of traffic, but one that our network should be able
    to handle easily.


