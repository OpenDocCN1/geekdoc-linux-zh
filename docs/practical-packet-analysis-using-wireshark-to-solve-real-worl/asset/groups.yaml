    ## Capture and Display Filters


    Earlier we discussed saving packets based on filters. Filters allow us to show
    only particular parts in a given capture. We can create and use an expression
    to find exactly what we want in the largest of capture files. An expression is
    no more than a string of text that tells Wireshark how to show and what not to
    show.


    Wireshark offers two types of filters: capture filters and display filters.


    ### Capture Filters


    Capture filters are used during the actual packet capturing process, and are applied
    by WinPcap. Knowledge of their syntax can be useful in other network analysis
    programs, as well. You can configure them in the Capture Options dialog where
    you can specify which traffic you want or don''t want to be captured.


    One way to use a capture filter would be when capturing traffic on a server with
    multiple nodes. For example, suppose you are troubleshooting an issue with a service
    running on port 262. If the server is running several different services on a
    variety of ports, finding and analyzing only the traffic on port 262 can be a
    job in itself. To capture only the port 262 traffic, you can use a capture filter.
    Just follow these steps:


    - 1. Open the Capture Options dialog (Figure 4-8), select the interface you wish
    to capture packets on, and choose a capture filter.

    - 2. You can apply the capture filter by typing an expression next to the Capture
    Filter button or by clicking the button itself, which will start the capture filter
    expression builder that will aid you in creating your filter. We want our filter
    to show only traffic inbound and outbound to port 262, so we type `port 262`,
    as shown in Figure 4-8.

    - 3. Once you have set your filter, click Start to begin the capture. After collecting
    an adequate sample, you should now only see the port 262 traffic and be able to
    more efficiently analyze this particular data.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_67_0.png)


    Figure 4-8: Creating a capture filter in the Capture Options dialog


    ### Display Filters


    A display filter is one that is applied to a capture file once it has been created,
    that it tells it to display only packets that match that filter. You can enter
    a display filter in the filter text box above the Capture List pane.


    Display filters are more commonly used than capture filters because they allow
    you to filter packet data without actually omitting the rest of the data in the
    capture file. That way, if you need to revert back to the original capture, you
    can simply clear the filter expression.


    You might use a display filter to clear irrelevant broadcast traffic from a capture
    filter—for instance, to clear ARP broadcasts from the Packet List pane when these
    packets don''t relate to the current problem being analyzed. However, because
    those ARP broadcast packets may be useful later, it''s better to filter them temporarily
    than to delete them altogether.


    To filter out all ARP packets in the capture window, follow these steps:


    - 1. Navigate to the top of the Capture List pane.

    - 2. Type **arp** in the filter box.

    - 3. Once you have set your filter, click Start to begin the capture.


