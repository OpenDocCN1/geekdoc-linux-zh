    # Telnet Protocol


    telnet.pcap

    The Telnet protocol (RFC 854) is an unsecured, text-based way for a server and
    client to communicate. It is often used to remotely administer servers, switches,
    routers, and other network devices.

    In this capacity you will see an example of a client (192.168.0.2) connecting
    to a telnet server (192.168.0.1). As you begin to step through the data being
    transmitted, notice that everything is in clear text. For this reason, the telnet
    protocol should not be used to transmit sensitive data.


    > You can be more secure by forgetting telnet and using SSH instead.


    What type of communication is occurring in this exchange between server and client?
    Starting at the top, we can immediately draw several conclusions. The first several
    packets confirm that we are defining telnet traffic, telnet-specific settings
    are being communicated between these two devices, as shown in Figure 6-21.

