    # Following TCP Streams


    One of Wireshark''s most useful analysis features is its ability to view TCP streams
    as the application layer sees them. This feature allows you to combine all the
    information related to packets and shows you the data that packets are handing
    off to the applications the end user sees. Rather than viewing data being sent
    from client to server in a bunch of chunks, the TCP Stream feature sorts the data
    to make it easily visible.


    You could use this tool when capture and decode instant messages sent by an employee
    who is suspected of giving away corporate accounting information. To see how this
    would work, open the example file suspectemployeeechat.dmp. In this file you will
    see a large amount of traffic generated by the popular IM MSN Messenger. (You
    can identify this as MSN Messenger traffic by the MSNMS that appears in the protocol
    field in the Packet pane.)


    If you examine the details of each packet, you can see bits of text being transmitted
    in each one. We could spend a lot of time writing down the information from each
    packet and combining it to find out what is being said in the chat, but that isn''t
    too practical. Instead, we will use the TCP Stream window to get a better picture
    of what is going on.


