    # Blaster Worm


    blaster.pcap The looming threat of viruses and worms spreading across the Internet
    is one that frightens system administrators and end users alike. In this scenario,
    Eddy calls the help desk with concerns that his computer has been infected with
    a virus. Every time he starts his computer, he receives a message that it will
    shut down in 60 seconds. Once this 60-second timer expires, the computer shuts
    down as stated. This process repeating continuously and he is not able to access
    his computer for more than 60 seconds at a time.


    # What We Know


    We know that Eddy tends to be afraid about security, so spyware isn’t an immediate
    concern. Our company uses virus-scanning software; however it is decentralized
    and most likely user managed.


    # Tapping into the Wire


    Any time you suspect that a virus or worm may be the cause of a computer problem,
    it is not usually a wise idea to install a sniffer directly on that machine. Malicious
    programs can often work against packet sniffers by not allowing them to run properly
    or at all. Our best approach is to use port mirroring. The capture will begin
    as soon as the computer boots up and finish when the computer shuts itself down
    after the sixty-second timer expires.


    # Analysis


