    # File Transfer Protocol


    *ftp.pcap* The File Transfer Protocol (FTP, RFC 959) is a Layer 7 protocol that
    is used to transfer data between a client and server. Operating on ports 20 and
    21, FTP is a client/server protocol, all communication in the client file involves
    back-and-forth traffic between a client computer and a server computer. As all
    TCP processes, FTP begins with a TCP handshake, as shown with packet 1 in Figure
    6-13.


    | No. | Time | Source | Destination | Protocol | Info |

    |---|---|---|---|---||

    | 1 | 0.000000 | 192.168.0.114 | 192.168.0.193 | TCP | 1137 - FTP (syn) Seq=0
    Len=0 MSS=146 |

    | 2 | 0.000519 | 192.168.0.193 | 192.168.0.114 | TCP | 1138 - FTP (syn-ack) Seq=0
    Ack=1 Len=0 MSS=1452 |

    | 3 | 0.002338 | 192.168.0.114 | 192.168.0.193 | TCP | 1137 - FTP Seq=1 Ack=1
    Len=0 |


    Figure 13: The TCP handshake is prevalent in communication types.


