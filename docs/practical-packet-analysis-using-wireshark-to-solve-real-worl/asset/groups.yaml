    # POP Goes the Email Server


    email-troubles .pcap In terms of importance, email ranks right up there with the
    Internet in the eyes of employees. Being that case, when it''s not working, you
    are going to hear about it.


    In this scenario, all of the users on your network are complaining that their
    email is taking an extremely long time to reach its destination. This is sometimes
    the case with email sent to other domains, even when they send to fellow employees
    within the same organization is taking forever. Let''s get to the bottom of this.


    # What We Know


    All in our company is managed through one mail server. After doing some research,
    we confirm that this problem exists for all of the email clients in our network.
    Whereas a typical intra-office email would be delivered instantaneously, delivery
    is now taking from 10 to 15 minutes. The same delay is for the receipt of external
    mail.


    # Tapping into the Wire


    Because our problem relates to a service that is hosted on one machine, the mail
    server, we''ll place our analyzer there. The problem has so far consistent throughout
    the work day, when is a good time to capture packets.


    # Analysis


    When you look at the results of the capture (email-troubles.pcap) you will see
    exactly what You should see on an email server: email packets. There are a whole
    lot of Post Office Protocol (POP) packets coming into our mail server (see Figure
    8-25), but just how many and what rate? Perhaps our mail server is overloaded.


    Figure 8-25: This capture includes a lot of POP packets.


