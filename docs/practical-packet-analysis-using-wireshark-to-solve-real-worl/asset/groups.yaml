    ## 网络地图


    在关于网络部署的讨论中，我们已经查看了若干种不同的网络地图。网络地图或网络拓扑图显示网络上所有技术资源及其连接方式的图表。


    确定你的数据包嗅探器放置位置最好的方法，就是能够清晰地可视化网络。如果你手里有一张网络地图，我强烈建议你随身备用，因为它将成为故障排除和分析过程中宝贵的资产。你甚至可能想为自己的网络制作一份详细的网络地图。记住，有时在故障排除中，成功的一半在于定位问题。


