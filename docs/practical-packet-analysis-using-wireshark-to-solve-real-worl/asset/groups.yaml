    # 总结


    到此时，我们已经拥有攻痪该网络所需的一切。一旦进入路由器配置，我们就可以删除子网、更改 `ip helper-addresses`，并进行各种会让网络管理员感到极其头疼不已的恶作作剧。


    这个场景的目的不是为了向你展示如何激怒你的网络工程师，而是为了证明一个略懂知识并配备数据包嗅探器的人所拥有的巨大力量。通过 Wireshark 和其他几个简单工具，我们实际上找到了一种完全终止该网络所有功能的方法。


    # 10

    ## 空中嗅探


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_156_0.png)


    无线网络的世界与传统的（有线）网络完全不同。在考虑无线网络时，我们需要考虑到频率、标准和独特的安全问题等因素。由于这些额外的考虑因素，你可以确信嗅探过程会发生完全变化。


    本章专门介绍基于 Windows 和基于 Unix 的系统的无线嗅探过程。当我们讨论无线嗅探的独特之处时，我们将查看几个展示其实际运行的示例。


    ### 一次嗅探一个通道


    理解无线流量嗅探的第一点是，你一次只能嗅探一个无线通道。在美国，无线网络可以在 11 个不同通道之一运行（国际上可以使用更多通道）。因此，在从无线客户端或访问点采集流量之前，你必须首先识别它正在广播的通道（图
    10-1）。


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_157_0.png)


    **图 10-1：** 无线嗅探可能是枯燥的，因为一次只能在一个通道上进行。


    发现正在使用哪个通道的最佳方法是信道跳（channel hop）。当你进行信道跳时，只需开始数据包捕获并在通道之间快速切换，直到你看到与你要寻找的内容相关的数据。虽然信道跳不是技术性最高的解决方案，但它确实有效。


    ### 无线信号干扰


    遗憾的是，有时我们无法依赖无线通信的完整性。因为数据是通过空气发送的，极有可能有东西干扰信号。无线网络包含了处理干扰的功能，但它们并不总是有效。因此，在无线网络上捕获包时，请密切关注你的环境，确保没有大型干扰源，例如大型反射面、微波炉、2.4
    GHz 无线电话、厚墙和高密度表面。


    沿着这一点，尽量尽可能靠近你正在分析的设备。你不能指望在设备楼上捕获到它发送的所有数据包。


    ### 无线网卡模式


    为了嗅探无线数据包，熟悉无线网卡运行的不同模式是一个好主意。


    大多数用户在管理模式（managed）或自接模式（ad-hoc）下使用无线网卡，但其他模式包括主机模式（master mode）和监控模式（monitor
    mode）。我将在下面介绍每种模式；图 10-2 显示了每种操作方式的图形表示。


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_158_0.png)


    # 自接模式 (Ad-Hoc Mode)


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_158_1.png)


    # 主机模式 (Master Mode)


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_158_2.png)


    # 监控模式 (Monitor Mode)


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_158_3.png)


    图 10-2：不同的无线网卡模式


    ### 管理模式 (Managed mode)


    当你的无线客户端直接连接到无线访问点 (WAP) 时使用管理模式。在这些情况下，与无线 NIC 关联驱动依赖 WAP 来管理整个通信过程。


    ### 自接模式 (Ad-Hoc mode)


    当你设置了一个设备直接相互连接的无线网络时，使用自接模式。在这种模式下，两个想要通信的无线客户端将共享通常由 WAP 处理的责任。


    ### 主机模式 (Master mode)


    一些高端无线网络网卡还支持主机模式。主机模式允许无线 NIC 与特殊的驱动程序协同工作，以便让计算机充当其他设备的 WAP。


    ### 监控模式 (Monitor mode)


    这是对我们而言最重要的模式。*监控模式*用于你希望你的无线客户端停止传输和接收数据，只监听在空气中飞过的数据包。为了让 Wireshark 捕获包，你的无线
    NIC 及其配套驱动程序必须支持监控模式。如果你是为了分析而购买无线网络网卡，请确保它支持监控模式（也称为 RFMON 模式）。


    ### 在 Windows 中无线嗅探


    即使你有一个支持监控模式的无线 NIC，大多数基于 Windows 的 NIC 驱动也不允许你切换到此模式。你需要额外的硬件来完成任务。


    ### 配置 AirPcap


    即使你有一个支持监控模式的无线 NIC，大多数基于 Windows 的 NIC 驱动程序也不允许你切换到此模式。你需要额外的硬件来完成任务。


    AirPcap 是一个 USB 无线适配器，允许 Windows 在监控模式下捕获流量。这克服了标准驱动程序的限制。


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_159_0.png)


    AirPcap 的配置非常简单；它具有以下选项：


    - **Interface (接口)**：选择你使用的 AirPcap 设备。

    - **Blink (闪烁)**：点击此项会让 AirPcap 上的 LED 灯闪烁。

    - **Channel (通道)**：在此字段中，选择你想让 AirPcap 监听的通道。

    - **Include 802.11 Frames (包含 802.11 帧)**：默认情况下，某些系统会剥离无线包的最后四位。这个校验和被称为 FCS，用于确保包没有损坏。除非你有特定理由，否则勾选此框以包含
    FCS。

    - **Capture Type (捕获类型)**：有两种 802.11 Only 和 802.11 + Radio。802.11 Only 选项对所有包包含标准的
    802.11 包头。802.11 + Radio 选项包含此头，并在前面添加了一个 radiotap 头，该头包含了关于数据速率、频率和信号电等额外信息。

    - **FCS Filter (FCS 过滤器)**：即使取消了 802.11 Frames 旁边的框，此选项也可以让你过滤掉 FCS 确定为损坏的包。使用
    Valid Frames 选项仅显示那些接收到的包。

    - **WEP Configuration (WEP 配置)**：此区域（通过 Keys 标签页访问）允许为你正在嗅探的网络输入 WEP 解密密钥。为了解释由
    WEP加密的数据，你必须在此字段输入正确的 WEP 密钥。


    ### 使用 AirPcap 捕获流量


    一旦安装并配置了 AirPcap，捕获过程将对你来说。只需遵循以下步骤：


    1. 在 Wireshark 中，选择 Capture -> Options。

    2. 在接口选择框中选择你的 AirPcap 设备，如图 10-5 所示。


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_161_0.png)


    除了 Wireless Settings 按钮，屏幕上的所有内容对你来说都是熟悉的。点击此按钮将给你与 AirPcap 工具相同的选项，如图 10-6 所示。由于
    Wireshark 与 AirPcap 完全集成，在客户端中配置的任何内容都可以从 Wireshark 进行配置。


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_161_1.png)


    图 10-4：AirPcap 配置程序


