    | xor | 且仅有一个条件为真 |

    | not | 两个条件都不为真 |


    ## 示例过滤器表达式


    虽然创建过滤器表达式的概念相当简单，但在为各种问题创建过滤器时，你可能需要引用一些特定的关键字和运算符。由于本书并不是作为 Wireshark 用户手册，我们不会涵盖所有这些表达式和运算符，但你可以在
    Wireshark 网站上找到它们的信息。表 4-4 为你提供了一些示例过滤器表达式的思路。


    ## 表 4-4：示例捕获和显示过滤器表达式


    | 表达式 | 描述 |

    | --- | --- |

    | host www.example.com | 显示所有来自主机 www.example.com 的流量 |

    | host www.example.com and not (port 80) | 显示来自主机 www.example.com 的所有非网络流量 |

    | dns | 显示 DNS 流量以外的所有内容 |

    | not broadcast and not multicast | 仅显示单播流量 |

    | ip.dst=192.168.0.1 | 显示所有指向 192.168.0.1 的流量 |


    ## 保存过滤器


    一旦你开始创建大量的捕获和显示过滤器，你会发现自己经常使用某些特定的。幸运的是，你不需要在每次使用它们时都输入；Wireshark 允许你将其保存以备后用。


    要保存你的自定义过滤器，请遵循以下步骤：


    - 1. 选择 **Capture Filters**（捕获过滤器）打开过滤器对话框（图 4-11）。

    - 2. 点击屏幕左侧的 **New**（新建）按钮创建一个新过滤器。

    - 3. 在 *Filter name*（过滤器名称）旁边的框中为你的过滤器输入名称。

    - 4. 在 *Filter string*（过滤器字符串）旁边的框中输入实际的过滤器。

    - 5. 完成后，点击 Save（保存）按钮将你的过滤器表达式保存到列表中


    Wireshark 还包含了几个内置过滤器，但这些只是为了给你提供过滤器应该是什么样的示例。然而，当你创建自己的过滤器时，你可能想要使用它们，因为它们非常具有参考价值。


    # 5. 高级 WIRESHARK 特性


    一旦你掌握了 Wireshark 的基本概念，你可能想进一步研究它一些更高级的功能。在本章中，我们将查看其中一些强大的功能，包括名称解析、协议分析和数据包重组。


    ## 名称解析


    网络数据通过各种字母数字地址系统传输，这些系统通常太长或复杂而难以记住，例如物理硬件地址 00:16:CE:6E:8B:24。名称解析（也称为名称查找）是协议用于将一种标识符转换为另一种的过程。例如，一台计算机可能具有物理地址
    00:16:CE:6E:8B:24，DNS 和 ARP 协议允许我们将其名称显示为 Marketing-2。通过将易读的名称与这些加密的地址相关联，我们使它们更容易记忆和识别。


    我们可以利用各种名称解析工具来使我们的捕获文件更具读性性并在某些情况下节省大量时间。例如，我们可以使用 DNS 名称解析来帮助识别我们正尝试追踪特定数据包源的计算机名称。


    ## Wireshark 中的名称解析工具类型


    Wireshark 提供三种类型的名称解析：MAC 名称解析、网络名称解析和传输层名称解析。


    ## MAC 名称解析


    MAC 名称解析使用 ARP 协议尝试将第 2 层 MAC 地址（例如 00:09:5B:01:02:03）转换为第 3 层地址（例如 100.10.12.1）。如果转换尝试失败，Wireshark
    的最后手段是将 MAC 地址的前三个字节转换为设备的 IEEE 指定的制造商名称，例如 Netgear:01:02:03。


    ## 网络名称解析


    网络名称解析尝试将第 3 层地址（例如 IP 地址 192.168.1.50）转换为易读的 DNS 名称（例如 MarketingPC1）。


    ## 传输层名称解析


    传输层名称解析尝试将端口转换为与其关联的名称。一个示例是将端口 80 显示为 http。


    ## 启用名称解析


    要启用名称解析，通过选择 Capture > Options 或按下 CTRL-K 打开捕获选项对话框（如图 5-1 所示）。


    | Name Resolution |

    | --- |

    | [x] Enable MAC name resolution |

    | [ ] Enable network name resolution |

    | [ ] Enable transport name resolution |

    | | |


    ## 名称解析的潜在缺点


    鉴于其优点，使用名称解析似乎是理所当然的，但它存在一些缺点：


    - 有时名称解析会失败。

    - 每次打开文件时必须进行名称解析。

    - 名称解析需要额外的开销。


    ## 协议分析


    协议解析器允许 Wireshark 将数据包分解为若干部分。Wireshark 使用多个解析器来解释数据包。遗憾的是，Wireshark 在选择解析器时并不总是做出正确的选择。


    例如，打开跟踪文件 wrongsector.dmp。注意此文件包含大量的 NetBIOS 通信。然而，这里有些问题。如果你点击其中一个数据包，你实际上可以看到从一台计算机发送的用户名和密码。经过一番调查，我们发现计算机实际上正在使用
    FTP（注意图 5-2 右侧的 FTP Server 字样）。Wireshark 认为这是 NetBIOS 流量，因为服务器和客户端配置为在 NetBIOS
    的默认端口 137 上使用 FTP。要解决这个问题，我们使用称为*强制解码*（forced decode）的过程：


    - 1. 右键点击一个数据包并选择 **Decode As**（解码为）。这将弹出一个对话框，你可以在其中选择想要使用的解析器（图 5-3）。

    - 2. 通过下拉菜单选择 **source (137)** 并在 Transport 标签下选择 **FTP**，告诉 Wireshark 使用 FTP
    解析器解码所有 TCP 源端口 137 的流量。

    - 3. 完成选择后，点击 **OK**，将更改立即应用到捕获文件中。你将看到新解码的数据，这样就可以从数据包列表面板进行分析，而无需深入挖掘其单个字节。


