    ## Packet Time Referencing


    Packet time referencing allows you to configure a certain packet so that subsequent
    calculations are done in relation to that specific packet. This feature is particularly
    handy when you are examining multiple requests in one capture file and to see
    times in reference to each individual request.


    To set a reference for a packet, select the reference packet in the Packet List,
    then choose **Edit + Set Reference** from the main menu. Or, select the reference
    packet and press CTRL-T on your keyboard. To remove a reference from a certain
    packet, select the packet and complete the aforementioned process second.


    When you use a reference on a particular packet, the time column in the Packet
    List will display "REF" (Figure 4-7).


