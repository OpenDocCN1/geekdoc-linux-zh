    ## File Transfer Protocol (FTP)


    331 Password required.

    Response code: user okay (331)

    Response arg: Password required.


    > Figure 9-7: Packet 10 shows an attempt to log in to the admin account.


    This is a great opportunity to use a filter to show only those packets that represent
    an FTP login attempt, like:


    ```

    ftp.request.command == "USER" || ftp.request.command == "PASS"

    ```


    Figure 9-8 shows the result of this filter.


    > Figure 9-8: The short display filter into the window helps to show only relevant
    traffic.


    Now, if we look in the Info column of each login attempt, we can see that the
    passwords being used are in alphabetical order—that is, the attacker is stepping
    through each letter in succession. This is a tell that someone is trying to guess
    the password using a dictionary-style attack. A dictionary attack is one in which
    passwords are guessed upon a machine-created dictionary of words. If you look
    at the time between each attempt, you can also see that these attempts to guess
    the password are happening too quickly to be entered by a human; they''re most
    likely launched by a cracking tool. We have successfully found the source of our
    high-bandwidth utilization.


    ## Summary


    We have confirmed that a machine within our network is being attacked by a cracking
    program designed to perform a dictionary attack on the FTP server. But our job
    isn''t done. At this point you must determine whether the employee machine launching
    the attack is responsible for it or if the machine has been compromised from the
    outside.


    ## Blaster Worm


    blaster.pcap The looming threat of viruses and worms spreading across the Internet
    is one that frightens system administrators and end users alike. In this scenario,
    Eddy calls the help desk concerns his computer has been infected with a virus.
    Every time he starts his computer, he receives a message that it will shut down
    in 60 seconds. Once this 60-second timer expires, the computer shuts down. This
    process repeating continuously he is not able to access his computer for more
    than 60 seconds at a time.


    ## What We Know


    We know that Eddy tends to be afraid about security, so spyware isn’t an immediate
    concern. Our company uses virus-scanning software; however it is decentralized
    and most likely managed.


    ## Tapping into the Wire


    Any time you suspect that a virus or worm may be the cause of a computer problem,
    it is not usually a wise idea to install a sniffer directly on that machine. Malicious
    programs can often work against packet sniffers by not allowing them to run properly
    or at all. Our best approach is to use port mirroring. The capture will begin
    as soon as the computer boots up and finish when the computer shuts itself after
    the sixty-second timer expires.


    ## Analysis


    The capture file blaster.pcap, shown in Figure 9-9, records each TCP packets being
    transmitted from our suspect computer to another on the local network via ports
    1793 and 4444. These packets are captured at a time when nothing is active on
    the machine other than the sixty-second timer, so this activity is suspicious.


