    ## Viewing Endpoints


    An endpoint is the place where communication ends on a particular protocol. For
    instance, there are two endpoints in TCP/IP communication: the IP addresses of
    the systems sending and receiving data, 192.168.1.5 and 192.168.0.15. An example
    on Layer 2 would be the communication place between two physical NICs and their
    MAC addresses. The NICs sending and receiving data have addresses of 01:00:5e:00:00:16
    and 01:00:5e:01:01:06, making those addresses the endpoints of communication.
    You can see a graphical representation of this concept in Figure 5-7.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_78_0.png)


    Figure 5-7: A graphical representation of endpoints on a network


    When analyzing traffic, you may find that you can narrow down a problem to a specific
    endpoint on a network. Wireshark''s dialog (Statistics > Endpoints) shows several
    helpful statistics for each endpoint (Figure 5-8), including the addresses of
    each as well as the number of packets and bytes transmitted and received by. The
    tabs at the top of the window show all supported and recognized endpoints in the
    current capture file. Click a tab to narrow the list of endpoints to specific
    protocols. Check the box next to the words Name Resolution to use name resolution
    within the endpoints dialog.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_79_0.png)


    Figure 5-8: The Endpoints dialog lets you view each of the endpoints


    ## Conversations


    A conversation on a network, like a conversation between two people, describes
    the communication that takes place between two hosts (endpoints). For example,
    whereas Jim and Sally’s conversation might consist of “Hey, how are you?” “I’m
    great! Yourself?” “Couldn’t be better!” a conversation between 192.168.1.5 and
    192.168.0.8 might look like “SYN/ACK,” and “ACK.” (We’ll look at the TCP/IP communication
    process in more detail in Chapter 6.)


    Wireshark provides a Conversations dialog (Statistics Conversations), shown in
    Figure 5-9. You will see the addresses of the endpoints involved in the conversation
    listed as Address A and Address B as well as columns displaying the packets and
    bytes transmitted to from each device.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_80_0.png)


    Figure 5-9: The Conversations window you interact with each conversation


    ## The IO Graphs Window


    One of the best ways to visualize trends is to view them graphically. Wireshark''s
    IO Graphs window allows you to graph the throughput of data on a network. You
    might use this feature to look for spikes or hulls in the throughput of specific
    protocols over the course of a day on your network.


    Let''s look at an IO graph of an individual computer as it downloads a file from
    the Internet. Open the trace file Download.dmp, and then select **Statistics IO
    Graphs**. Here you can see the low number of bytes per second early in the capture,
    until the graph spikes up for a brief amount of time while the file is being downloaded
    (Figure 5-10).


    You can customize several features of this graph. The most important two things
    we will be modifying the settings for the x-axis and y-axis of the graph, which
    allow you to modify the intervals and units used for displaying the throughput
    information.

