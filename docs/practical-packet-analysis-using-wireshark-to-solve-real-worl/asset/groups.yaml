    Figure 5-10: The IO graph for our capture file shows valuable trending information.


    Notice that the majority of the configurable options consist of an area where
    you can create filters. You can create up to five unique filters (using the same
    syntax as a display or capture filter) and specify display colors for those filters.
    For instance, you could create filters to show ARP and DHCP traffic and display
