    Eric complains that he cannot access a part of the Novell website to download
    some necessary software. Each time he visits the site, his browser loads and loads
    but nothing happens. It must be a problem with the network, right?


    ## What We Know


    After a thorough check of the network, we determine that Internet access is normal
    for all machines except Eric''s. Therefore, the problem must be specific to Eric''s
    workstation. His computer is running Windows, and it''s completely up to date
    with all of the latest service packs and patches. Upon further investigation,
    we find that the only problem is with one particular section of the Novell website.


