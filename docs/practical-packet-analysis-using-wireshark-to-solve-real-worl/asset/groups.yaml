    # Summary


    At this point, we have everything we need to bring down this network. Once inside
    the router''s configuration, we can delete subnets, change ip helper-addresses,
    and do all sorts of other mischievous things that will cause the network administrator
    severe headaches.


    The point of this scenario is not to show you how to anger your network guys,
    but rather to demonstrate the power someone with a little knowledge and a packet
    sniffer can have. With Wireshark and a few other simple tools, we have effectively
    found a way to completely terminate all function on this network.


    # 10

    ## SNIFFING INTO THIN AIR


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_156_0.png)


    The world of wireless networking is completely different from traditional (wired)
    networking. When considering wireless networking, we need to take into account
    issues like frequencies, standards, and unique security questions. Given these
    extra considerations, you can bet that the sniffing process changes completely.


    This chapter is devoted to explaining the wireless sniffing process on both Windows-
    and Unix-based systems. As we discuss what makes wireless sniffing unique, we''ll
    look at a few examples showing it in action.


    ### Sniffing One Channel at a Time


    The first thing to understand about sniffing wireless traffic is that you can
    only sniff one wireless channel at a time. Wireless networks in the United States
    can operate on one of eleven different channels (more are available internationally).
    Therefore, before you capture the traffic from a wireless client or access point,
    you must first identify the channel it is broadcasting on (Figure 10-1).


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_157_0.png)


    **Figure 10-1:** Sniffing wirelessly can be tedious, since it can only be done
    one channel at a time.


    The best way to find out which channel is being used is to channel hop. When you
    channel hop, you simply start a packet capture and switch rapidly from channel
    to channel until you see data that relates to what you are looking for. Although
    channel hopping isn''t the most technical of solutions, it works.


    ### Wireless Signal Interference


    Unfortunately, sometimes we can''t rely on the integrity of wireless communication.
    Because data is sent through the air, it is very likely that something will interfere
    with the signal. Wireless networks include features to handle interference, but
    they don''t always work. Therefore, when capturing packets over a wireless network,
    pay close attention to your environment to ensure that there are no large sources
    of interference, such as large reflective surfaces, microwaves, 2.4 GHz wireless
    phones, thick walls, and high-density surfaces.


    Along these lines, try to get as close as possible to the device you are analyzing.
    You can''t hope to capture all of the packets sent by a device you are one floor
    above it.


    ### Wireless Card Modes


    For sniffing wireless packets, it is a good idea to familiarize yourself with
    the different modes in which a wireless card can operate.


    Most users use wireless cards in managed or ad-hoc modes, but other modes include
    master mode and monitor mode. I will cover each mode below; a graphical representation
    of the way each one operates is shown in Figure 10-2.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_158_0.png)


    # Ad-Hoc Mode


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_158_1.png)


    # Master Mode


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_158_2.png)


    # Monitor Mode


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_158_3.png)


    Figure 10-2: The different wireless card modes


    ### Managed mode


    Managed mode is used when your wireless client connects directly to a wireless
    access point (WAP). In these cases, the driver associated with the wireless NIC
    relies on the WAP to manage the entire communications process.


    ### Ad-Hoc mode


    Ad-hoc mode is used when you have a wireless network setup in which devices connect
    directly to each other. In this mode two wireless clients want to communicate
    with each other share the responsibilities that a WAP would normally handle.


    ### Master mode


    Some higher-end wireless network cards also support master mode. Master mode allows
    the wireless NIC to work in conjunction with specialized driver software in order
    to allow the computer to act as a WAP for other devices.


    ### Monitor mode


    This is the most important mode for our purposes. *Monitor mode* is used when
    you want your wireless client to stop transmitting and receiving data and only
    listen to the packets flying through the air. In order for Wireshark to capture
    packets, your wireless NIC and accompanying driver must support monitor mode.
    If you purchase a wireless network card for the purpose of analysis, be sure that
    it supports monitor mode (also known as RFMON mode).


    ### Sniffing Wirelessly in Windows


    Even if you have a wireless NIC that supports monitor mode, most Windows-based
    NIC drivers won''t allow you to change into this mode. You''ll need a little extra
    hardware to get the job done.


    ### Configuring AirPcap


    Even if you have a wireless NIC that supports monitor mode, most Windows-based
    NIC drivers won''t allow you to change into this mode. You''ll need a little extra
    hardware to get the job done.


    AirPcap is a USB wireless adapter that allows Windows to capture wireless traffic
    in monitor mode. This overcomes the limitations of standard Windows drivers.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_159_0.png)


    The AirPcap configuration is simple to use; it has the following options:


    - **Interface**: Select the AirPcap device you are using.

    - **Blink Led**: Clicking this will make the LED lights on the AirPcap blink.

    - **Channel**: In this field, you select the channel you want AirPcap to listen
    on.

    - **Include 802.11 Frames**: By default, some systems strip the last four bits
    from wireless packets. This checksum, known as Frame Check Sequence (FCS), is
    used to ensure that packets have not been corrupted. Unless you have a specific
    reason to do otherwise, check this box to include the FCS.

    - **Capture Type**: Two options are 802.11 Only and 802.11 + Radio. The 802.11
    Only option includes the standard 802.11 packet header on all packets. The 802.11
    + Radio option includes this header and also prepends it with a radiotap header,
    which contains additional information about the packet such as data rate, frequency,
    and signal level.

    - **FCS Filter**: Even if you unchecked the box next to Include 802.11 Frames,
    this option lets you filter packets that FCS determines are corrupted. Use the
    Valid Frames option to show only those packets that can be received.

    - **WEP Configuration**: This area (accessible on the Keys tab) allows you enter
    WEP decryption keys for the networks you are sniffing. In order to interpret data
    encrypted by WEP, you will have to enter the correct WEP keys into this field.


    ### Capturing Traffic with AirPcap


    Once you have AirPcap installed and configured, the capture process will be familiar
    to you. Just follow these steps:


    1. In Wireshark, select Capture -> Options.

    2. Select your AirPcap device in the Interface selection box, as shown in Figure
    10-5.


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_161_0.png)


    Everything on this screen should look familiar to you except for the Wireless
