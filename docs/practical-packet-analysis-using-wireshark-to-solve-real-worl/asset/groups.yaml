    ## WIRESHARK 简介


    ![](img/ae85f2fa699ec68c8cd6b402e11c40d7_48_0.png)


    目前有多种不同的包嗅探应用程序可用于网络分析，但在本书中，我们将一直使用 Wireshark。本章将讨论 Wireshark 的历史及其优势、安装方法以及基本用法。


    ### Wireshark 简史


    Wireshark 拥有非常丰富的历史。Gerald Combs 是密苏里大学堪萨斯市分校的计算机科学毕业生，他最初是因为需要而开发它的。Combs 程序的第一个版本称为
    Ethereal，于 1998 年根据 GNU 通用公共许可证 (GPL) 发布。


    在发布 Ethereal 八年后，Combs 辞去了工作去追求其他的职业机会。遗憾的是，他当时的雇主拥有 Ethereal 商标的完整权利，Combs 无法达成允许他控制
    Ethereal “品牌”的协议。相反，Combs 和开发团队的其他成员在 2006 年年中将项目重新命名为 Wireshark。


    Wireshark 的流行程度大幅增长，其协作开发团队现在拥有超过 500 名贡献者。以 Ethereal 名称存在的该程序已不再继续开发。


    ### Wireshark 的优势


    Wireshark 提供了许多使其在日常使用中极具吸引力的优势。它既针对初级也针对专家级包分析师，并提供了各种功能来吸引每一类用户。让我们根据我在第 1 章中定义的选择包嗅探的标准来审视
    Wireshark。


    ### 支持的协议


    Wireshark 在支持的协议数量方面表现卓越——其支持的协议超过 850 种。这些协议涵盖了从 IP 和 DHCP 等常见协议到 AppleTalk 和
    BitTorrent 等更高级的专用协议。由于 Wireshark 是基于开源模型开发的，每次更新都会添加对新协议的支持。如果某个 Wireshark 不支持的协议，你可以编写代码来支持它，并将代码提交给
    Wireshark 开发者以纳入应用程序中（当然，如果你的代码被采用的话）。话虽如此，实际上没有任何协议是 Wireshark 不能支持的。


    ### 用户友好性


    Wireshark 的界面是所有包嗅探应用程序中最容易理解的之一。Wireshark 是一个基于 GUI 的应用程序，菜单编写非常清晰，布局直观。它还提供了许多旨在增强易用性的功能，例如基于协议的颜色编码和原始数据的详细图形化表示。与
    tcpdump 等一些更复杂的、由命令行驱动的备选方案相比，Wireshark 的 GUI 非常适合那些刚进入协议分析世界的人。


    ### 成本


    由于它是开源的，Wireshark 的价格是无可比拟的。Wireshark 以 GPL 免费软件的形式发布。你可以出于任何目的（个人或商业）下载和使用 Wireshark。


    ### 程序支持


    软件软件包的支持水平可以决定它的成败。在处理像 Wireshark 这样免费分发的软件时，通常没有正式支持，这就是为什么开源社区依靠用户来提供支持。幸运的是，Wireshark
    社区是所有开源项目中最好、最活跃的社区之一。Wireshark 网页直接链接到多种形式的支持，包括在线文档、支持开发 wiki、常见问题解答 (FAQs)
    以及注册 Wireshark 邮件列表的地方，该列表由该程序的大多数顶尖开发者监控。这些开发者以及 Wireshark 海量的用户群提供的支持让没有任何问题悬而未决。


    ### 操作系统支持


    Wireshark 支持所有主流现代操作系统，包括 Windows、Mac OS X 和基于 Linux 的平台。你可以在 Wireshark 主页查看支持的操作系统的完整列表。


