- - '#'
  - 图 7-24：前两个数据包 Mandy 的电脑获取 IP 地址并确保没有 IP 冲突。第一个数据包显示向 DHCP 服务器请求租约。通常这是对 DHCP 服务器的响应，但由于这是一个广播包，我们的抓包过滤器允许它。第二个数据包是一个免费
    ARP（gratuitous ARP）。免费 ARP 是用于确保网络上没有其他机器使用该 IP 地址。如果你只看到免费 ARP 回复，意味着状态良好。第三个数据包是抓包中我们关注的。在计算机启动的这一点，TCP/IP
    必须完全初始化：你可以看到它仍在发送 ARP 数据包，如图 7-25 所示。
- - '#'
  - 图 7-25：数据包 3 和 5 对于第一个接收来说太早了。在初始化过程的这一点，由于 Mandy 的电脑还没准备好接收，不应该通信。因此，Mandy 的电脑丢弃了数据包并继续其启动过程。抓包中的另一个数据包，这次包更改了正在使用的端口并尝试连接到端口
    9898，如图 7-26 所示。非常棘手。
- - '#'
  - 图 7-26：Mandy 的电脑发起了另一个连接，这次 Mandy 的电脑已准备就。再次，Mandy 的电脑没有准备好通信并直接丢弃了数据包。当 Mandy
    的电脑最终准备好接受通信时，它在第 10 个数据包接收到了此类数据包。Mandy 在请求的端口上没有可以接受的任何，因此它向远程电脑发送一个 RST 包以终止连接，如图
    7-27 所示。
- - '#'
  - 图 7-27：发起了另一个连接尝试，这次 Mandy 的电脑已准备就绪；然而，它不需要该连接，所以它直接发送 RST 来结束连接。
