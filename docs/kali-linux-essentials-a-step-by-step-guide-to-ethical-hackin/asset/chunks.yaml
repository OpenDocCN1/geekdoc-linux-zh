    The root directory is the top-level directory in the file system hierarchy. It
    contains all other directories and files on your system. When you log in, you
    start at the root directory.


    2\. Navigating Directories


    Use the cd command (change directory) to navigate through directories. Here are
    some key commands:


    ●     cd directory_name: Move to a specified directory.


    ● cd ..: Move up one directory (to the parent directory).


    ●     cd /: Move to the root directory.


    ●     cd ~: Move to your home directory.


    3\. Listing Files and Directories


    Use the ls command to list the contents of a directory:


    ●     ls: List files and directories in the current directory.


    ● ls -l: List with detailed information (permissions, owner, size, etc.).


