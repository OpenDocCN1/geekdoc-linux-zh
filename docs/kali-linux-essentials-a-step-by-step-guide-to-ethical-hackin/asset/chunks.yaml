    ## 11. 安装虚拟化工具（可选）

    安装你选择的虚拟化软件提供的虚拟化工具。这些工具增强了宿主机与虚拟机操作系统之间的集成，提高了性能和功能。


    ## 12. 为虚拟机创建快照

    为你新安装的 Kali Linux 虚拟机创建一个快照。此快照将作为一个基准，以便在出现问题或实验失败时恢复到它。


    ### 结论：你的道德黑客乐场

    在虚拟机上安装 Kali Linux 为你提供了一个安全且受控的环境，用来磨练道德黑客技能。通过虚拟化设置，你可以练习各种技术、模拟攻击并探索漏洞，而不会有损害真实系统的风险。这一过程让你能够创建一个动态且多用途的道德黑客乐场，支持你在网络安全领域的学习、实验和成长。


    # 2.3 原生安装与双启动选项

    虽然在虚拟机上安装 Kali Linux 提供了一个受控的环境，但某些道德黑客更倾向于通过原生安装 Kali Linux 或设置双启动系统来获得更浸式的体验。本节将探索原生安装和双启动的选项，让你可以将
    Kali Linux 直接集成到你的硬件和工作流中。


    ## 1. Kali Linux 的原生安装

    原生安装 Kali Linux 将其直接安装在你的硬件上，与你现有的操作系统一起。此选项提供了 Kali Linux 的完整功能，但需要对你的数据进行仔细考虑和备份。


    **原生安装步骤：**

    ● a. 从官网下载 Kali Linux ISO 镜像。

    ● b. 使用 `Rufus` 或 `Etcher` 等工具创建可启动 USB 盘。

    ● c. 从 USB 盘启动电脑并按照安装过程操作。

    ● d. 安装期间，选择“引导式 – 使用整个磁盘”选项或手动分区。


    **原生安装的优势：**

    ● 充分利用硬件能力。

    ● 无虚拟化开销。

    ● 与你的硬件和环境无缝集成。


    **考虑因素：**

    ● 潜在的数据丢失；安装前请备份数据。

    ● 与虚拟机相比，环境隔离性较低。

    ● 可能需要磁盘分区的高级知识。


    ## 2. Kali Linux 的双启动设置

    双启动设置允许你在启动电脑时在多个操作系统之间选择。此选项提供了在主操作系统和 Kali Linux 之间切换的灵活性。


    **双启动设置步骤：**

    ● a. 备份你的数据并创建一个可启动的 Kali Linux USB 盘。

    ● b. 从 USB 盘启动并按照安装过程操作。

    ● c. 安装期间，选择“手动”分区选项。

    ● d. 为 Kali Linux 创建一个独立分区且不影响你的主操作系统。


    **双启动的优势：**

    ● 在使用主操作系统的同时访问 Kali Linux。

    ● 利用硬件的完整功能。

    ● 与虚拟化相比，具有更浸式的体验。


    **考虑因素：**

    ● 如果分区不正确，可能会导致潜在的数据丢失。

    ● 管理多个操作系统可能需要技术知识。

    ● 意外损坏分区或启动配置的风险。


    ### 选择适合你的选项

    在原生安装和双启动之间做决定取决于你对高级安装程序、数据备份的熟悉程度以及你渴望的集成水平。如果你准备好投入硬件资源并优先考虑浸式体验，原生安装或双启动可能是合适的。


    ### 结论：定制你的设置

    原生安装和双启动为与 Kali Linux 的更深度集成体验提供了选项。每个选项都提供了优势和注意事项，因此请考虑你的目标、技术专长以及管理潜在复杂性的意愿。无论你选择虚拟机、原生安装还是双启动设置，目标都是创建一个支持你的道德黑客之旅的环境，并使你能够开发加强数字防御的技能。


    # 2.4 为你的实验室配置网络设置

    有效的网络配置对于创建一个功能齐全且安全的实验室至关重要。无论你是使用虚拟机、原生安装还是双启动设置，正确配置网络设置都能确保适当的连接、隔离和受控测试。本节将引导你完成为道德黑客实验室配置网络设置的过程。


    ## 1. 网络分

    将你的实验室环境划分为不同的网络段，以隔离不同类型的流量和活动。常见的分段包括生产、测试、开发和隔离网络。这种分段防止了系统之间的意外交互，并有助于模拟真实场景。


    ## 2. 虚拟网络设置（针对虚拟机）

    如果你使用虚拟机，请在虚拟化软件内设置虚拟网络。配置每台虚拟机连接到适当的虚拟网络。这种方法确保同一网段内的虚拟机可以通信，同时保持不同网段之间的隔离。


    ## 3. IP 地址分配与子网划分

    为实验室内的每个系统分配 IP 地址。使用 `RFC 1918` 定义的私有 IP 地址范围，防止与公共 IP 地址冲突。子网划分允许你将网络进一步分为更小的地址范围以便高效管理。


    ## 4. DHCP 和静态 IP 地址

    对于动态 IP 分配，在实验室内设置 `DHCP`（动态主机配置协议）服务器。该服务器会在设备连接到网络时自动为其分配 IP 地址。或者，为关键系统或需要固定地址的系统分配静态
    IP 地址。


    ## 5. 防火墙与网络分段（针对原生或双启动）

