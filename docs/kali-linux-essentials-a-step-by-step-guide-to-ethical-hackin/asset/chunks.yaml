    Kali Linux 的核心组件，阐明其在网络安全领域的架构、工具和用途。


    ### Kali Linux 的起源与目的


    Kali Linux 最初源于 `Debian` 发行版，其诞生源于对能够满足道德黑客和渗透测试员需求的特殊操作系统的需求。它的主要目标提供一个全面的工具箱，涵盖用于渗透测试、漏洞评估和数字取证各个阶段的各种工具和实用程序。与通用操作系统不同，Kali
