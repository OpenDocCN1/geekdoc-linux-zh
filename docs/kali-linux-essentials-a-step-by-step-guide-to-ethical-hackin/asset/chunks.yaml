    \ measures. It exploits psychological traits like trust, fear, authority, and\
    \ curiosity.\n2. **Types of Social Engineering**:\n   - **Phishing**: Deceptive\
    \ emails, messages, or websites that lure victims into divulging sensitive information\
    \ or downloading malware.\n   - **Pretexting**: Creating a fabricated scenario\
    \ to extract information or gain access.\n   - **Baiting**: Offering something\
    \ enticing to trick individuals into taking actions that compromise security.\n\
    \   - **Tailgating**: Gaining unauthorized physical access to a restricted area\
