    ## OWASP 前十大：漏洞的路线图

    开放 Web 应用安全项目（`OWASP`）前十大概述了最关键的 Web 应用安全漏洞。从注入攻击、跨站脚本到不安全的反序列化，这些漏洞构成了伦理黑客必须熟练识别和处理的风险。在本章中，你将探索
    `OWASP` 前十大的每种漏洞，获得评估和缓解这些常见威胁的技能。


