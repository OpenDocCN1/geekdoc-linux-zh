    Kali Linux 的分步指南。


    #### 1. 选择你的虚拟化软件


    选择虚拟化软件，例如 `VMware Workstation`、`VirtualBox` 或 `Hyper-V`。这些平台允许你在宿主机操作系统上创建和管理虚拟机。


