    Visit the official Kali Linux website and download the ISO image of the Kali Linux
    distribution. Choose either the 32-bit or 64-bit version based on your system
    architecture.


    ## 3. Create a New Virtual Machine

    Open your chosen virtualization software and create a new virtual machine. Follow
    the software''s prompts to specify the VM''s settings, including memory allocation,
    processor cores, and networking options.


    ## 4. Install Kali Linux

    ● a. When prompted for an installation source, select the option to use the downloaded
    Kali Linux ISO image.

    ● b. Follow the installation wizard to choose your preferred language, keyboard
    layout, and timezone.

    ● c. Configure network settings, hostname, and domain name as needed.


    ## 5. Disk Partitioning

    ● a. Choose "Guided – Use the entire disk" to let the installer automatically
    partition the virtual disk.

    ● b. Select the disk where you want to install Kali Linux.


    ## 6. Choose a Partitioning Scheme

    Choose the appropriate partitioning scheme based on your preferences and use case.
    If you''re new to partitioning, the default scheme should suffice.


    ## 7. Configure Package Manager

    Select a mirror for package installation. If you''re unsure, choose the default
    mirror provided by the installer.


    ## 8. Install GRUB Boot Loader

    Install the GRUB boot loader to the master boot record (MBR) of the virtual disk.


    ## 9. Complete the Installation

    Follow the prompts to complete the installation process. Once the installation
    is finished, reboot the virtual machine.


    ## 10. First Boot and Setup

    After rebooting, log in to your Kali Linux system using the credentials you set
    during the installation. Update the package repository and install any available
    updates using the package manager.


    ## 11. Install Virtualization Tools (Optional)

    Install the virtualization tools provided by your chosen virtualization software.
    These tools enhance the integration between the host and guest operating systems,
    improving performance and functionality.


    ## 12. Snapshot Your VM

    Take a snapshot of your newly installed Kali Linux VM. This snapshot will serve
    as a baseline that you can revert to in case of any issues or experimentation
    gone awry.


