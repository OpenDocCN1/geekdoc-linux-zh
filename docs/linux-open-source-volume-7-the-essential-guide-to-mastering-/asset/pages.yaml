  md: '# # Ultimate Distro & Fuzz Guide


    # BEST DISTRO FOR...


    # # Security


    While the mainstream media worries its readers over black-hats, security-focused
    distributions are a vital tool for the good guys


    # # Kali Linux


    For years, BackTrack Linux was the king of Linux distributions for those doing
    security audits and penetration testing.


    Kali Linux, Created and maintained by Mati Ahanarai and Devon Coans of Offensive
    Security, is a ground-up rewrite of BackTrack and a worthy successor.


    Based on Debian, unlike the Ubuntu origins, Kali includes pre-installed copies
    of the most popular security utilities, including network sniffer Wireshark, port-scanning
    tool nmap, password cracked...


    Join the Roper and even the Airc-ng suite for penetration of wireless networks.
    Its repositories have plenty more choices available, in addition to more applications
    and utilities. Where Kali differs from them in compatibility is: it is 32-bit
    compatible and has worked to bring Kali to the more popular ARM-based platforms
    it uses. Builds are available as deis for the Raspberry Pi, with more builds arriving
    on a regular basis for the very low cost of these devices. Kali''s support helps
    lower the barrier to enter cybersecurity tasks which require more expertise to
    handle.


    Perhaps the most impressive feature, however, is the Kali sub-project dubbed NetHunter.
    With support for Google Android smartphones and NetHunter provides wireless penetration
    tools usable directly from the device without having to use an alt-lo-top octopus
    router.


    Combined with options to install a hard drive as well as run from an memory and
    attackless USB, Kali is the obvious choice for anyone interested in network security-despite
    its reputation as a script-kiddie''s thing, it''s actually pretty on the front.


    ### Kali has everything you need for full security testing


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_13_0.png)


