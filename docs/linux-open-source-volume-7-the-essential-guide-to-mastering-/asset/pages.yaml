    # Letter from The Linux Foundation


    Linux adapts faster than any other operating system because it is open, by a global
    community of developers and creators. From mobile and embedded devices to supercomputers,
    Linux is-the fastest-growing platform in the world.


    The demand for Linux talent is fast and growing. Linux is highly prevalent in
    many areas such as the cloud, servers, embedded devices, and in some additions
    it is visible everywhere except in the automotive industry.


    So should not be surprised that we need more qualified administrators and engineers
    who can support Linux-based systems and enterprises. In fact, our need is increasingly
    desperate. The latest Linux Jobs Report (July/2016) says that eight out of ten
    managers are hiring Linux talent, yet most are having a difficult time finding
    them. Although Linux has known more candidates, 64 percent say they qualified
    on Linux because of its pervasiveness in modern-day infrastructure.


    According to the annual Linux Jobs Report from The Linux Foundation, 70% of companies
    on their list in 2015, up to 76% in 2016, are hiring or in plans to hire Linux
    talent in the cloud, servers, embedded devices, and the automotive industry.


    The Linux certification is performance-based, testing proficiency through a terminal-based
    environment. Browser-based testing lacks the advantage of the accreditation scheme
    - and are administered by means of live connection between the candidate and invigilator,
    with a two-hour limit for each. Terminal-based certification is exactly what we
    need.


    Many organizations in the Linux community are involved in research and collaboration.
    The Linux Foundation certifies SysAdmins and Engineers. These exams are administered-virtual
    with a webcam and internet connection, connecting to many people around the world
    to receive a certification seamlessly due to geography and time zones.


    To address this industry shortage in the number of qualified professionals that
