  md: '# NETWORKING FIXES


    Tips to fix your network issues and create stabler LAN


    # 18 SET A STATIC IP


    While a router will tend to do out DHCP addresses to the same interfaces every
    time, it''s not consistent. When you have port forwards active or very specific
    connection addresses set around your home network, it can be best to set a static
    IP.


    In developing environments there will be a graphical network manager which let
    you set manual settings for IP, gateway, subnet mask and DNS. You can open /network/interfaces
    using nano and add it manually.


    +   - dig www.google.com


    And look at the answer section for the DNS addresses.


    # 19 TEST YOUR WEB ACCESS


    If you''re having trouble loading a page or two, you might be struggling to connect
    to the Internet. Or the server you''re trying to contact may be having problems.
    To help and differentiate between a bad connection and a busy server, you can
    use the ping command to see if communications are getting through properly. Open
    up the terminal and ping google:


    ```

    $ ping www.google.com

    ```


    It will send small packets to Google asking for a response and record the response
    time. It''s also worth trying a different website if Google is showing you you''re
    having problem.


    # 20 QUERY DNS VERSION


