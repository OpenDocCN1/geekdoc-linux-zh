  md: '# LEARN TO FIX 50 OF THE MOST IMPORTANT LINUX PROBLEMS


    +   One of the updates to using Linux is its vast hardware compatibility that''s
    built into the kernel, with countless modules to help you boot and run on any
    piece of computing hardware the last 20 years. It''s also fairly rock-solid and
    continually supported by a massive community to improve and make it better and
    better.


    +   Having said that there are always little problems. Some may lie in software
    bugs or quirks in the kernel, problems with packages and, even random defects
    caused by the hardware itself. Like any complicated piece of equipment, Linux
    and its distros can go wrong in many ways. Learning how to fix these problems
    can be challenging for some.


    +   In this feature, we''ve compiled what we deem 50 of the most common problems
    and solutions to your day-to-day issues - so you can deal with either the inevitable
    happens or you are simply helping out with some troubleshooting.


    # RESOURCES


    +   GParted

    The graphical partition editor that we recommend, it''s an easy way to manage,
    delete and change your hard drive setup. It comes installed by default on all
    of OSs and there''s also a specific release of the software that has a few extra
    drive management features available.


    +   Unetboot

    When creating boot media and live discs, you might also consider using USB stick
    for it. Having an easily portable, live booting USB stick can be very useful for
    fixing problems, as boot issues or hardware and driver errors, it doesn''t need
    to actually load up into the installed Linux distro.


    +   Wireresh

    Network troubles might be quite far reaching in your network, and Wireresh is
    an excellent piece of software for going through your network and seeing where
    problems and faults may be arising locally. It works on individual machines and
    servers and includes a web frontend for ease of use.


    +   Bacula

    Backing up is an important thing to do and a safety net if you''re having irreparable
    problems on your system, Bacula is one of the best pieces of software for this,
    as it includes comprehensive backup solutions with included scheduling and networking
    features.'
