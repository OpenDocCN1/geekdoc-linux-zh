    | Name | Comment | Path | Read only | Browsable | Guest | Intent permissions |
    Recycle bin | Hidden fold | Shadow Copy | Share Copy format |

    | --- | --- | --- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | NASFREE | | NASFREE share | Path to share: | [ ] Read only If it is checked,
    users may not create or modify files in the share. | [ ] Browsable This particular
    share is seen in the list of available shares in a view and in the browser. |
    [ ] Guest controls whether this share is accessible by guest account. | [ ] Intent
    permissions The permissions on this folder are normally created by owner and mask
    marked but the intent permissions override them. This can be particularly useful
    for each user. | [ ] Recycle bin This creates a recycle folder on the share. |
    [ ] Hidden fold This prevents files with the hidden attribute being shown as hidden
    files. | [ ] Shadow Copy This property controls shadow copy created automatically
    by VSS. | [ ] Share Copy format format The custom format of the snapshot for shadow
    copy can be specified. The default is \?\Name\%0% for VSS auto snapshot.|


    # ## BitTorrent client


    # ### Your NAS box handle all your torrents


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_53_1.png)


    Another neat feature of NAS4Free is its built-in BitTorrent client. From the web
    gui to Services/Torrent and click Enable. Add the downloads and directories, click
    Add, Save and Restart. Now, whenever you add a torrent to the folder (from any
    connected PC), your NAS4Free server will start downloading from the bottom of
    the BitTorrent client to check progress. You may need to get your router to forward
    the port used


    #  09 Add disk


    Go to Disk Management and click ''+'' on the right. When you have the hard disk
    from de-mount, then select the file system for a format - if it is not, you cannot
    use it DiskFormat. Click Add at the bottom, then Apply Changes.


    #  10 Add mount point


    You need to add a mount point for the disk. Go to Disk/Mount Point and click ''+''.
    Choose your drive from the drop-down, select UFS file system partition number
    1 and then add a mount point. Click Add, Changes.


    # 11 Enable sharing


    Go to Services/OS/SMB and click Enable. Click the Shares tab, then ''Add'' and
    enter a name and connection string. Click Add, then select your mount point from
    the pop-up. Click Add, then Apply Changes. Click the Settings tab, then Save and
    Restart.


    # 12 Remote access


    You can access the shared folder by browser of another - Browse network:WindowsNETWORK:NAS4FREE:shared
    folder. Create a subfolder in it to separate them from shared files and media.


    #  13 Set up sync


    On the web gui, go to Services:Rsync; Click the Modules tab, then enter a name
    and comment. Click the Path ''...'', select your mount point and Backups subfolder.
    Click OK, Add, Apply Changes. Click Settings tab, enable, then Save and Restart.'
