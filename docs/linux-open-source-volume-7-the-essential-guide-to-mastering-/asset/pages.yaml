    # 01 What is PGP? How does it work?


    Sending messages has been attempted for centuries. Secrecy has been of around
    importance in times of war, finance or great deals. Despite this, there are always
    caveats to sending secrets—how can we be sure of the messages? Are we certain
    that only the person we intended the message for has actually received and decrypted
    it? How do we encrypt something that can only be decrypted by the people you have
    selected?


    Phil Zimmermann had a crack at answering these questions back in the early Nineties
    and PGP was his solution. PGP is little different than other security methods
    other than password-keys encrypt and decrypt a file or message, PGP has two keys.
    These two keys are public and private keys. The public key is used to encrypt
    information and can be shared with anybody. The private key is the one that you,
    as the creator of these keys, keep to yourself. When combined with the public
    key, the private key can decrypt the information that was encrypted with the public-key.


