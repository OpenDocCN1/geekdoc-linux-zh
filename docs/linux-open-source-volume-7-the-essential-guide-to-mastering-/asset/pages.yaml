  md: '# Tips & Tricks


    Install MediaGoblin

    You need to create a working directory for MediaGoblin. This is where the git
    repository will be downloaded. Create the directory using:


    ```

    sudo mkdir -p /usr/share -HR mediagoblin/srv/mediagoblin.example

    ```


    As you can see, create the directory with privileges (root) and then change the
    owner to our underprivileged mediagoblin user. Now clone the MediaGoblin folder.
    Switch to the mediagoblin user and then change the directory to where you created:


    ```

    cd ~/mediagoblin.example

    ```


    Now starting:


    ```

    git clone git://gitlab.org/mediagoblin/mediagoblin.git

    ```


    Move to the mediagoblin folder - cd mediagoblin. Initialize the repo and then
    fetch data:


    ```

    git submodule init git submodule update

    ```


    You''ll need to take the code from stable revision but not the master branch of
    the git repository. MediaGoblin is under rapid development so it makes sense to
    use the master, at least until a release:


