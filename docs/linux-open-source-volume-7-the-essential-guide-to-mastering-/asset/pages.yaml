    SpagoBI has the database and browser folder together, so there is no need to download
    anything. Note that SpagoBI uses the default PostgreSQL database. If you have
    problems check if Java is installed. If you have not installed Java on Linux,
    you will need to execute the command `java -version` in the terminal. If you get
    a response with that command, go to it. If the command returns something like
    ''java version'', then you have all the necessary packages; then install Java
    using `sudo apt-get install default-java` (on Ubuntu). If you do this, continue
    the process.


