  md: '# Dig


    We''ve used the -n option in this tutorial, as DNS issues can easily cloud other
    problems. Once you''ve cleared suspected DNS problems on your machine with the
    resolver, it''s time to reach through the hierarchical world of DNS servers to
    check everything as it should be. Wireshark could host for simple searches, but
    dig is the best tool available.


    # Wireshark


    Like tcpdump, Wireshark can dump packets from the network, but it also provides
    interactive analysis – wisely over the top for minor networking problems, but
    handy for handling bottlenecks in the system. It has the GUI (GUI) version, with
    the console version packaged ashore. Try them both so you can adapt to whichever
    is best when trouble strikes.


    # 01 Address search


    lookup may be useful for resolving an address or checking that you can, but for
    useful information about DNS and its recursive connections across the Internet,
    if dig, whose flexibility means that it repays a little time to know some of its
    options.


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_110_0.png)


    # 01 Powertool


    Despite having being number of options available, starting is a simple matter
    of selecting interfaces from the Capture menu. To see your interfaces and overviews
    it may, use Capture Protocol Overlays at wiki.wireshark.org.


    # 02 Portable tools


    As Wireshark is useful for detecting many problems with packet loss, latency and
    won''t be installed everywhere, you can carry around super permissions on a USB
    live drive.


    # 02 Names served


    By default, dig returns A records, but it can be used to check other types such
    MX (mail servers). In the screenshot above we have used NS to find the names for
    a named domain.


    Wireshark packet details table


    # 03 Hierarchical


    DNS is hierarchical, with the TLD (top level domain), as .com or .org will return
    the first name. With With searches there''s plenty of room for errors or attacks.
    dig “trace” shows the hierarchical steps of your query.


    # 03 Filter


    Looking at the data is overwhelming and if the filter is too large, you can right-click
    a selection and use that as the filter, or do the same from new views. Wireshark
    is looking for a protocol filter, perhaps something encrypted – say DNS, or TLS
    – so you just put that in the filter toolbox.


    # 04 Command line shark


    On your VPS, other non-GUI box tools, tshark is functionally equivalent to Wireshark.
    It''s worth installing after Wireshark and then getting familiar with, so if you
    are prepared for ever need it.


    # 04 +shortoption


    Hierarchical searches show a lot of information you probably don''t need—even
    from a standard DNS lookup you may only want the IP address. The +short option
    gives you just an abbreviated output, which is very useful in scripting searches.


    # “Looking at the new data is overwhelming”'
