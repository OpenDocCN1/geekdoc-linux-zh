  md: '# # Tips & Tricks


    # # Real-time log monitoring with Swatch


    Get notifications from predefined log events by setting Swatch to monitor for
    certain keywords


    # ## Advisor


    Swayam Prakasha

    Has a degree in computer engineering. He has been working in the industry for
    many years, focusing on areas like operating systems, network security and electronic
    commerce


    Swatch https://github.com/TKONIDb


    Swatch stands for Simple Watcher or syslog, depending on whom you ask. Either
    way, Swatch is a helpful program that does your log watching and notifies you
    only when you are specifically looking for log event. Note that Swatch reads the
    main log files and looks for keywords you can define. It can run in two ways:
    in the background as a daemon or as a cron job. You can configure the messages
    or syslog log files that might indicate a security problem. Swatch can also be
    used to flag just about any kind of activity: a certain program being, a particular
    user or anything else that might appear in a log file. Swatch can be configured
    to watch application-specific log files instead of the general log that it does


    by default, Swatch is a Linux tool that helps in monitoring the log files as they
    are being written to and it takes necessary action if it finds something that
    it is configured to look for. This tool can be used as a way to proactively log
    files in real time for various activities, error messages or specific syslog-keywords.


    In Brief, Swatch basically started out as a simple watchdog for actively monitoring
    the log files produced by UNIX''s syslog facility. Since then, it has been used
    for any type of log. You can consider Swatch as a command line utility that can
    be started with various settings following note that events that are logged have
    a great significance from a security standpoint. The default items that Swatch
    looks for are good start:


    ```

    ```bash

    swatch help

    swatch --help

    bash: ''swatch'' is currently not installed. You can install it by typing:

    sudo apt-get install swatch

    swatch@-log-

    ```

    ```


    You may already have Swatch installed, so check with swatch --help'
