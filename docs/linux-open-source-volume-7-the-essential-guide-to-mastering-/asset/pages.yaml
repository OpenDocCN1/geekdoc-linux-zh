    # System Administrator


    How is Linux Engineer different from a System Administrator?


    In a few months, several thousand people have earned a Linux certification. This
    has also promoted many opportunities for Linux-related skills for registering
    for the LF520, which is now bolstered with SysAdmin certification at the end.
    And to help ensure-more organizations have the opportunity to become proficient
    in Linux, the Linux Foundation has prepared courses for the SysAdmin exam.


    What exactly does Linux Foundation Certified do?


    A Linux Foundation Certified System Administrator (LFCS) is able to intermediate
    system administration from the command line for running Linux. Linux Foundation
    Certified Sysadmins handle the operational support of Linux systems and services.
    They are responsible for first line troubleshooting and analysis, and decide when
    to escalate issues to engineering teams.


    A Linux Foundation Certified Engineer (LFCE) possesses a wider range and depth
    of skills than the LFCS. The Linux Foundation Certified Engineers are responsible
    for the design and implementation of system architecture. They manage the deployment
    path and serve as Matter Experts (SMEs) for the next generation of system administration.


    There is still more to be done, training and certification to demonstrate them
