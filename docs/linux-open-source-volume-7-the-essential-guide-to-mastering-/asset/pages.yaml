    # Easy back up with NAS4Free CFS/SMB


    You can access your NAS4Free CFS/SMB folder by PC joining (your NAS4Free IP address)
    in the Explorer. While you could back up using sync, it is easier to use the NAS4Free
    Backup feature for option one. Go to Backup & Restore Setup, then click the ''Save
    on Network'' button. Browse to your NAS4Free shared folder, then choose backup
    settings and set the schedule for them.


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_52_3.png)


    # 01 Download NAS4Free


    You can find the latest NAS4Free at SourceForge, either as a Live CD or USB IMG
    image, depending on whether you want to boot from CD or USB. Also, select the
    correct version for your PC (x64 or x86).


    # 02 Boot it


    After setting the BIOS on your old PC to boot from first device (CD or USB), insert
    your live disk and boot. NAS4Free will go through the boot process, which may
    take a while to complete.


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_52_4.png)


    # 03 Choose install


    You''ll come to use the Console Menu. Enter 9 to install from your live USB. In
    then, choose 2 to install on the PC hard disk (or 1 if you want to run the OS
    from a USB flash drive).


    # 04 Install to disk


    Hit OK to select the destination media, then say No to swap partition (unless
    you have little RAM). NAS4Free will then be installed on the chosen disk. Note
    the DATA partition parameters.


    # 05 Configure LAN interface


    Remove the live USB/CD and reboot the computer. After the boot process, you will
    end up at the Console Menu. Then, enter 1 to select: Ethernet (internet perhaps
    or just one).


    # 06 Configure IP


    At the Console Menu, enter 2 to configure the network IP. Say No to DHCP and enter
    a static IP. Press Enter to accept the subnet mask. Use your router''s IP as gateway
    and your DNS.


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_52_5.png)


    # NAS4Free Web Login


    Username: admin


    Password: *****


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_52_6.png)


    # 07 Access web GUI


    With the basic setup, you can now access your NAS4Free server from another PC.
    Enter its IP address in a web browser and you''ll see the NAS4Free web GUI. The
    default username is ''admin'', with password ''nas4free''.


    # Back up your Mac via AFP


    Again, you could use sync, but to use Time Machine just share your NAS4Free drive
    via AFP. In the web GUI, go to Settings & Shares, Click ''+'', add the fields,
    and Apply Changes. Click ''Users+'' in the fields, as the primary NAS4Free shared
    folder you want to back up. Go to Backup & Restore Setup, then click the ''Save
    on Network'' button. Browse to your NAS4Free shared folder, then choose backup
    settings and set the schedule for them.


    Linux & Open Source Genius Guide'
