  md: "# # Developer guide\n\n## 07 The signal() function\nThe signal() function,\
    \ which takes two arguments. The first argument is the name or number of the signal.\
    \ The second argument is a function name: signal handler. If the value is SIG_DFL,\
    \ default handling for signal will successfully occur. However, if the value is\
    \ SIG_IGN, you must provide a valid function name that will be called when the\
    \ signal occurs - in the case of our example, you should use use() instead of\
    \ signal().\n\n```\n```c\n#include <signal.h>\n#include <unistd.h>\n#include <stdio.h>\n\
    \nvoid signal_handler(int sig) {\n    printf(\"Received signal %d\\n\", sig);\n\
    }\n\nint main() {\n    signal(SIGINT, signal_handler);\n    printf(\"Wait 10 seconds\
    \ or press Ctrl+C to break\\n\");\n    sleep(10);\n    printf(\"Exiting program\\\
    n\");\n    return 0;\n}\n```\n```\n\n# ## 09 Handling two signals\n\nThe code\
    \ of our example \"handlerfunc\" shows many different ways to handle a signal.\
    \ In this code, the program uses two different handlers for each signal. The problem\
    \ is that if you want to add more signals you want to support, especially if you\
    \ are learning on programming, there is no easy way to do it. You will learn to\
    \ handle multiple signals in Step 14.\n\n![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_163_0.png)\n\
    \n# ## 12 How Apache handles signals\n\nThe Apache parent process can handle TERM\
    \ USUSR, SIGHUP and WINCH signals. The TERMUSR signal ends the Apache process\
    \ in a bad way and should be avoided in extreme situations.\n\nThe USR signal\
    \ causes the Apache process to advise the children to exit after receiving their\
    \ request. If all the children are done, the parent reloads its configuration\
    \ files and restarts them. The new Apache configuration will not restart.\n\n\
    The JVM does the same as the USR signal but with a difference. Instead of waiting\
    \ for the children to finish their current request, it stops the running process\
    \ without waiting.\n\nThe WINCH signal causes the Apache process to advise the\
    \ children to exit after serving their current request, remove the PID file and\
    \ stop the process without waiting. After the completion of all, it restarts.\
    \ This is very helpful when you are debugging Apache, but it can cause deadlocks\
    \ and race conditions.\n\nOn a Debian 7 system, the process of the Apache process\
    \ can be found in /var/apache2.pid.\n\n# ## 08 The signal system\n\nImagine that\
    \ you have a program that takes user input, but for some reason, the user does\
    \ not know what type of input to give or how to provide it. The fastest way is\
    \ to send a signal to the program.\n\nThe solution is to use signals. The signal\
    \ system is a real time timer that allows you to receive SIGSIGNAL in a preconfigured\
    \ number of seconds (SIGALRM).\n\nConsider the following code for the purpose:\n\
    \n```\n```c\n# gcc -o signalalarmRM signalalarm.c\n\nnYou have only 10 seconds\
    \ to type your name:\nToo late... Please try again...\nToo late... try again...\n\
    Mihalis\nMihalis\n```\n```\n\n# ## 10 The (raise) function\n\nA process can send\
    \ a signal to itself with the help of this function. Its usage is simple and you\
    \ should have no problem including it in your programs. In the signal system,\
    \ the raise function takes two arguments: just the name of the signal (see raise).\n\
    \n# ## 11 Real work with signal handler\n\nThe most important task of a signal\
    \ handler is to make sure the signal does not do any damage to data. Think of\
    \ it as an object destructor in object-oriented programming. The most common job\
    \ of a signal handler is to close files and close connections, write data to disk\
    \ and then allow a program to exit.\n\n# ## 13 The signal(s) system call\n\nThe\
    \ signal system has the same basic effect as any other. If signal comes comes\
    \ while executing it adds complexity. In particular, you can set you specific\
    \ flags to control when the signal is handled. Once a signal handler is installed,\
    \ it remains installed until another signal() system call is made.\n\n```\n```c\n\
    #include <signal.h>\n#include <unistd.h>\n#include <stdio.h>\n\nstruct sigaction\
    \ {\n    void (*sa_handler) (int);\n    sigset_t sa_mask;\n    int sa_flags;\n\
    };\\struct sigaction;\n\nvoid signal_handler(int sig) {\n    printf(\"Received\
    \ signal %d\\n\", sig);\n}\n\nint main(int argc, char *argv[]) {\n    struct sigaction\
    \ sa;\n    sigemptyset(&sa.sa_mask);\n    sa.sa_handler = signal_handler;\n  \
    \  sa.sa_flags = 0;\n    sigaction(SIGINT, &sa, NULL);\n    while (1) {\n    \
    \    sleep(1);\n    }\n    return 0;\n}\n```\n```\n\n164 Linux & Open Source Genius\
    \ Guide"
