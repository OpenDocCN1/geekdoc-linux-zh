  md: '# Faster better servers


    # BUILD A WEB SERVER


    # Host your web servers on a dedicated server that you control


    Your web server can be a useful addition to any system. If you don''t have massive
    loads to worry about about it, then you can install your own custom-built server,
    or if you have a lot of scalable server space then you can build it there with
    a very similar software.


    We are going to use Ubuntu Server for this, we follow our advice on the previous
    pages on how to set it up and get to a point where we can start adding Apache.
    You could have the server both a file and web server in this way.


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_23_0.png)


    # It works!


    This is the default web page for this server.

    The web server service is running but no content has been added, yet.


    # 01 Install


    Once you''ve got your server set up and SSH in it, it''s time to install the Apache
    web server. Do that using the following:


    ```

    $ sudo apt-get install apache2

    ```


    It will automatically set the domain address to following: 127.0.0.1


    Above Give your web server once you''ve installed Apache


    # 02 Test server


    If you have to install a GUI onto your server, you can test out that Apache is
    working by going to a browser in it and navigating to 127.0.0.1. Otherwise, from
    an external system, navigate to the IP address of your system in your browser
    and it should show the Apache confirmation page-screen.


    > “With a web server you can now use it to host a website or to access storage
    from the server remotely over the Internet”


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_23_1.png)


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_23_2.png)


    # 03 Install FTP


    With a web server you now use it to host a website or to access storage from the
    server remotely over the Internet. We can set up the latter FTP, or in our case
    we use VSFTP install it to your system:


    ```

    $ sudo apt-get install vsftpd

    ```


    # 04 Configure FTP


    We can access the configuration file for FTP by nano to open /etc/vsftpd.conf
    (sudo nano /etc/vsftpd.conf) to match our ours, but first it is necessary that
    we increase the security just before using it properly as an FTP server, just
    to be on the safe side.


    # 05 Secure your FTP


    The main change to make the FTP secure is to turn off anonymous users. In the
    config file, look for the line with ‘anonymous,enable’. We want to change this
    to NO if it isn''t already there, just to make sure that it is bit more secure
    for the FTP server and all of your content is kept private.


    Linux & Open Source Genius Guide'
