  md: '# Masterclass


    # COMMON PROBLEMS


    Routine solutions to solve widely-faced issues


    # 01 SWITCHING FROM WINDOWS


    Moving to Linux from Windows can be a hurdle to overcome for a lot of people.
    Even if you just need to adjust some things it''s a good thing to know the ways
    to make the transition as smooth as possible.


    First of all, remember that Windows is quite unique and such will work on Linux
    is a good step. If you are using office software like Microsoft or Media Player
    for examples, LibreOffice and VLC on Linux can do just as fine. For a lot of people,
    this transition is a major jump.


    For software that does not have a Linux equivalent or requires Linux, using Wine
    may be an option. If it''s not guaranteed to work, it might be something that
    is worth looking into. A sure way is to create a Linux virtual machine on the
    system that you have and experiment the software until you find a perfect solution
    but it can be better than just using Windows all the time. The first jump isn''t
    as daunting as you first thought.


    > “It’s not a perfect solution but it can be better for some”


    # 02 FILE AND FOLDER PERMISSIONS


    Sometimes you might hit a problem where you can''t create, delete or edit files
    without using a root account or sudo. While this is fine for working in the terminal,
    when it can be an issue. If you''ve tried to create folders and files using sudo
    they don''t require-only access, the best option is to change permissions. For
    files and folders you''ll need to use sudo to change what it is, for example:


    ```

    $ sudo chmod directory

    ```


    # 03 HARDWARE PROBLEMS


    Not every piece will automatically work on Linux, but usually it''s just because
    you need to turn something on. Using sudo lusb and lsusb you will have the devices
    connected to your system. Each device will add an address, something like 01-0.1.
    Check this for the problem and use sudo lusb/lsusb -v for more info.


    This should tell you which module has been loaded for the device. It''s probably
    not the right one, so do again using a live disk and check which module it shows.
    If it''s different, go to your installed system and use:


    ```

    $ modprobe -v [module]

    ```


    # 04 LACK OF SOFTWARE IN FEDEDORA


    Fedora is a Linux distro and one of its core principles is to use only free software.
    This means you might not be able to get Chrome or other popular apps for media.
    For those that don''t mind restricted or non-free software, the RPM Fusion gives
    you the ability to install more software. Users can go to the Rufus site http://rpmfusion.org/
    and download the file to sort. If you need to do it in the terminal, use:


    ```

    sudo dnf localinstall --nogpgcheck http://download.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm
    -E fedora).rpm http://download.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm
    -E fedora).rpm#

    ```


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_83_0.png)'
