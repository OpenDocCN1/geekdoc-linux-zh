    06 The gl.drawArrays function

    The WebGL function used for drawing is called drawArrays.

    The first argument to the gl.drawArrays function specifies the drawing mode. If
    you want to draw a solid triangle, you can use glLINES and gl.POINTS for drawing
    lines and points respectively. The third argument of the function is really important
    because it declares the number of points that will get as input. When you have
    problems with your output, check this parameter first.


