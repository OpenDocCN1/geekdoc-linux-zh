  md: '# PASSWORD SECURITY


    One of the most important steps in keeping anything secure is to create a very
    strong password that is difficult to crack. While movies will tell you to enter
    your office to figure out your password ("it''s his son''s name-easy”), the most
    common method of password cracking is a brute force attack on the server and usernames.


    Under a brute force attack, unmodified dictionary words and common top password
    lists will succumb quickly. In terms of length of password versus time needed
    to crack it, hours and days needed to successfully discover a password are always
    going down to advancements in CPU speed and powerful processors, even if it''s
    as long as they can.


    Let''s start with a password and modify it - a non-dictionary word, reasonably
    long. Plucked out of the air we have:


    dwanton


    +   - Eight characters, alphanumeric numeric

    - Seven characters, lower and upper case


    # Time to crack: two seconds


    When it''s short, even if it''s online, requiring a minimum of eight characters,
    a letter and a number increases the quality of the password, both off and online.
    A basic modification would be:


    Dwanton1


    +   - Eight characters, alphanumeric

    - lower and upper case


    # “Using simple alphanumeric passwords are increasingly insecure”


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_118_0.png)


    | Length |

    | Character Combination |

    | Possible Combinations |


    # Creating an invincible password is the first step to securing everything


    # HOW SECURE IS MY PASSWORD?


    # Time to crack: 15 hours


    Do a lot better! The password is exponentially more secure, 15 hours is not too
    long. You can do better by adding a symbol to it in an easy-to-remember location:


    Dwanton1


    +   - Eight characters, alphanumeric and symbol mixture


    # Time to crack: 3 days


    Bring another big number to it. Theory people would do well with that, but not
    as well as adding a suffix. We may be as secure as we can be with an eight-character
    password in terms of brute force, and the ‘’ at the end is a bit basic. Just


    # PASSWORD DO''S & DON''TS


    +   DO

    - Use capitals, numbers and symbols

    - Reset online ones every six months

    - Make it at least nine characters

    DON''T

    - Use personal information

    - Use common numbers

    - Use numbers such as your two-digit birth year

    - Use password everywhere

    - Write them down

    - Make them too


    making a two digit number can twice increase the time to crack:


    # Time to crack: 275 years


    275 years is a while, but it''s doable for persistent crackers. Adding a symbol
    or number to the end of your password will increase this time to 580 years. That
    is a massively long time to crack your password without using hardware and software
    about it. It''s here an example of an excellent start password idea:


    Dwanton12*


    We say that, while this is an excellent password, you shouldn''t be using it on
    every account you have. If a list of passwords is leaked to someone, it doesn''t
    matter how long your password will take to brute-force if they already know what
    it is. If there''s a leak of characters, change your password immediately.'
