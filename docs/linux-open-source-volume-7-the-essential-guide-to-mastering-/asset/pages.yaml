    # 10 About shaders


    There are two kinds of shaders: vertex and fragment. The vertex shader gets first
    and the fragment shader gets second.


    Vertex shaders are used for controlling the points or vertices on a surface. In
    order to rotate an object in space, the vertex shader is responsible for applying
    a user-defined matrix to rotate your coordinates.


    Fragment shaders are used to define the color, texture mapping, and lighting.
    The fragment shader determines which pixels of the screen to draw on, and gl_FragColor
    defines the color it should be.


    The programming language used for fragment shaders looks like C. You can write
    your shader code using files and include it in your JavaScript code. Both kinds
    of shaders run entirely on the GPU of hardware; therefore you want to keep the
    GPU as busy as possible in order to let the CPU do other work.


