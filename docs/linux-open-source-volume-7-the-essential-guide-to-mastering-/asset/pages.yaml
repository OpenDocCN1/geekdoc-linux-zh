    # # Turn an old PC into a NAS box


    # ### Advisor


    Phil King Since starting out on CRASH magazine in 1998, veteran videography and
    technology journalist dealt with all sorts of hardware and reviewed hundreds of
    apps and games.


    # ## Repurpose old hardware with NAS4Free to use as a NAS server for backups and
    more


    The fast pace of technological progress is great, but does it mean hardware becomes
    redundant? This poses the question: what do you do with your old PC? Apart from
    selling it away, another option is to turn it into a network-attached server for
    storing files, media and backups.


    512MB of RAM to work, but you may be able to get away with little as 256MB for
    the Full version. We''ll show you how to install NAS4Free on your old PC and then
    configure it remotely from a client PC via the web-based GUI. You can then schedule
    regular backups using rsync and cron to Backup or Cloud drives. We also cover
    other uses including UPnP media streaming and downloading torrents (using the
    built-in hosting to set up your own hosting). So dust off that old PC and let''s
    get it working for you!


    # ## Resources


    Spare with at least 512MB of RAM


    # ### NASFree


    sourceforge.net/projects/nas4free/files


    # ### Home network'
