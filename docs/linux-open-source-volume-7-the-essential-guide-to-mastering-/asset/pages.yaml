  md: '# Fix network problems


    Using these four apps will help you pin down and fix a number of networking issues


    # (Telnet) to Netcat


    Netcat does everything the telnet does much more, but you may find yourself on
    a box without netcat, so we will start with an example from old-school telnet.


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_109_0.png)


    +   01 If you started using computers after the Telnet was replaced by SSH in
    a suddenly less secure world, you might have dismissed it as a relic of the past.
    But now a useful diagnostic tool again distro, connecting to specific ports to
    see what''s open and working.


    +   02 Entercat If you can install netcat (nc) then you will fall back on netcat,
    which combines the simple testing of telnet with abilities to do anything with
    TCP, UDP or Unix-sockets: open TCP connections, send UDP packets, listen for arbitrary
    TCP/UDP ports and port scan.


    +   03 Portscan It''s not good to check every port on one''s machine to see what''s
    left open


    +   04 Pass the port One useful trick is to quickly set up an impromptu server
    listening on a particular port, to check there is nothing indicating a connection
    between you and yours. In the image above, we set as a one-off web server and
    read info from the host that connects to.


    # Traceroute


    You might not know how the Internet works while you are using it, traceroute puts
    the lid on your eyes by showing the time packets take to reach each gateway machine
    between you and the server.


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_109_1.png)


    number of hosts and port scan, you can adjust


    ```

    traceroute -m 255 wikipedia.org

    ```


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_109_2.png)


    +   01 follow the hops Traceroute tests each hop between you and the destination.
    Although not always conclusive, output shows which problems might be occurring.
    When the screen shows the default:


    +   02 Journey times The times displayed in the map are round trip times to each
    host for three packets sent. Adjust the number of packets with -q for example,
    if -q sends just a single packet. A time from the UK could be a channel hop.


    +   04 Blocked ICMP As we mentioned with ping, some administrators block ICMP,
    so you won''t traceroute. Traceroute provides a traceroute through instead of
    ICMP.


    A set of asterisks is an unreachable host but metr provides a continuous traceroute
    to detect intermittent problems. You might be able to help them by knowing where
    the problem could lead to generate around fix.'
