    #  17 Use the Quick Mask


    So we''ve removed some basic blemishes, but you can also smooth out the skin a
    little using the Quick Mask tool. To Select and then Toggle Quick Mask to cover
    the image in a layer of red. Don''t panic, we''ll be removing the red areas we
    have done.


    # 15 Clean up the photo


    The Heal tool can do more than just remove a mole. In this example we''ve removed
    the necklace from our model''s neck. On a larger scale it can be used to clean
    up the background of a photo bit more naturally than out or guessing profiles.
    It''s a perfect tool as it can estimate, but it''s still very smart and gets better
    all the time.


    # 16 Enhance the details


    The Unsharp Mask works well on photos with small details or where the mask is
    key. Go to Filters/Enhance to select the tool, which will automatically bring
    out the details in the photo. Small values and adjustment; it only needs to be
    subtle.


    # 18 Do some preparation


    Use the Eraser tool to remove the red areas from the skin, avoiding the eyes and
    mouth out. After that''s done you turn off the mask and it will reveal a selection
    of what you desired, without the Joker-esque look that occurred when the mask
    was on.


    # 19 Gaussian Blur


    The final step to smooth out the skin is to use the Selective Gaussian Blur in
    Filters/Blur. Play with the layers again try and keep trying. Go too far and you
    can make the skin look like plastic.


    # 20 Beautiful photos


    With a bit of practice and some creatives, you can make any picture look better
    than the original, without overdoing or giving the model completely different
    appearance.


