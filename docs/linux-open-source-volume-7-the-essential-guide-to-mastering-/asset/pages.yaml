  md: '# 05 NEED TO KILL A TASK


    A program might be running and taking up a lot of resources, and sometimes you
    can''t turn it off the normal way. This calls for the kill command in the terminal
    - first find out what the PID of the process is. Simply run the top command in
    the terminal and it will show up—press k to quit out and then.


    ```

    $ sudo kill [PID]

    ```


    # 08 KEYBOARD IS IN THE WRONG LANGUAGE


    Sometimes during installation, the installer won''t properly set the right keyboard,
    or maybe you''ve got a new layout and it''s not working properly. This can be
    easily changed in the settings, but in LXDE you can set multiple keyboards and
    switch between them with Ctrl Space.


    # 06 ACCESS LOGS TO VIEW ERRORS


    A good way to figure out a problem is to access the log files on your system to
    see if an error may have been spat out. This might be in a major log file or one
    specific to the software, and they can be found in the /var/log folder – navigate
    there in a file manager or look them up in the terminal.


    > “A way to figure out a problem is to access the log files to see if an error
    message has been spat out”


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_84_0.png)


    # Our apps

    Come and explore our favourites


    # 09 IDENTIFYING PACKAGE MANAGER


    Not every version of Linux uses apt or the command to install and manage packages.
    You should be able to identify which package manager your distro uses what is.
    Fedora and Red Hat use yum, openSUSE uses a mixture of YAST, package manager and
    apt. Slackware uses dock. Gentoo uses ports and the Portage manager and Arch uses
    pacman. The better two are more complicated than the other distros, so sometimes
    it takes a little longer to install.


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_84_1.png)


    File Edit View Search Terminal Help


    ```

    robz@ubuntu:~$ apt install -t

    Thermal 0: acpi, 520 degrees C

    robz@ubuntu:~$

    ```


    # 07 CAN''T FIND CINNAMAM DESKTOP


    The Cinnamon desktop is a lot more popular but it''s not quite everywhere – the
    most notable omission is from the repos of Ubuntu. There is no officially maintained
    repository for the Ubuntu build of Cinnamon, but there is a third-party one you
    can use. Open up a terminal and add the PPA with:


    ```

    $ sudo add-apt-repository ppa:linux-cinnamon

    ```


    # 10 TEMPERATURE


    If your system is running a bit hot, you can check the temperature to see and
    when it''s getting a bit toasted. For this need we need to install acpi, so open
    up the terminal and use.


    ```

    $ sudo apt-get install acpi

    ```


    Then you can check the temperature with:


    ```

    $ acpi -t

    ```


    Now install by doing an apt-get update and apt-install cinnamon.


