    # 06 Control eye levels


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_28_0.png)


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_28_1.png)


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_28_2.png)


    # 07 Vary highlights and shadows


    Photos will have a range of colours at different levels, from the lighter to the
    darker shadows. Use a histogram to adjust these settings by looking at Levels
    on a 255 point scale: 0 is the darkest and 255 is the lightest.


    01 Install GIMP

    GIMP is installed on Linux distros by default, searching for Graphics in your
    menus to find it. Otherwise, it can be installed using software package manager
    such as GIMP. If else fails, head to gimp.org/downloads for the installation files.


    04 Use the rule of thirds

    The rule of thirds is used to position an image in such a way that certain aspects
    of a photo take a third of the composition. This helps to make your photos more
    dynamic and draw the eye to particular features. Play around to see what you want
    to highlight.


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_28_3.png)


    02 Work with RAWs

    Some DSLRs allow you to work with the JPEGs, but others will give you RAWs with
    which you can play around with light and other fine details. GIMP can''t edit
    these, so you may also need to use URaw to properly import them.


    05 Remove red eyes

    A common problem you may face with improper lighting is red-eye. Luckily GIMP
    has a tool for that. Use the Rectangle tool to select one eye at a time and in
    the enhanced-menu Filters to fix it.


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_28_4.png)


    03 Crop the image

    Not for every image, but if you weren''t shooting with a rule-of-thirds approach,
    you can also see if the image would look better with one applied. Click on the
    rectangle select tool and set the Guides to Rule of Thirds.


    06 Contrast red-eye levels

    Tweak the slider to remove levels as much as possible without losing focus. You
    can refocus the selection to be smaller or larger to get a better result. It sometimes
    help to do both eyes at once.


    08 Adjust the overall range

    Here you can see that the histogram doesn''t cover the entire graph. A quick fix
    and then will increase image quality, is to draw the shadow until the beginning
    of the histogram. In this case it might help to pick out some details.


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_28_5.png)


    * Linux & Open Source Genius Guide 29'
