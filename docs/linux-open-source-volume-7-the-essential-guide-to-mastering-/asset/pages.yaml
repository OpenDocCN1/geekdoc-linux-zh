    # 01 Choosing your hardware


    What''s going to drive your TV - a custom-build machine or a more expensive PC?

    A Mini PC might be less likely to be, but you can still make pretty small systems.
    You can also use a Raspberry Pi if you''re going to concentrate on more traditional
    x86 systems.


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_68_0.png)


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_68_1.png)


    # 02 Mini PCs


    There are many Mini PCs to choose for the task - in past we''ve used CompulLab''s
    range of InsensePCs and MiniBox, the Zotac and Gigabyte offers are also to include
    a drive as Blu-ray or any other disc capable of playing your favorite games.


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_68_2.png)


    # 07 Repurposing old parts


    If you have components lying around, you may be able to put together a similar
    system without the need for brand new kit. The minimum requirements are to have
    the graphics cards of an Nvidia 8500 GPU and better, or that you should be able
    to run Kodi code.


    # 03 Getting a case


    If you want to build a HYPE setup, a small case is not essential. When using old
    parts and cases is a good way to do this quickly and cheaply, the resulting product
    will need a lot of room. Check out slim, mini-ITX cases for an easy way to get
    a slimline system that you can readily find for.


    # 04 Motherboard options


    Mini ITX boards are relatively cheap and you can get enough ones very easily from
    your local retailer. We recommend looking for AMD chips that handle graphics -
    these are perfect for 1080p videos, to have more codecs and hardware decoding.


    # 05 Other components


    You also need a RAM and a GPU - for at least an SSD, though you should prioritize
    the RAM over the CPU in the graphics will will do most of the heavy lifting in
    the system.


    # 06 Power Supply


    Look for green power supplies. It is better than skipping on quality if you can.
    A unit like this will have low idle draw but decoding high-quality content it
    might need a lot more than usual. This also allows you to upgrade in the future.


    # 08 Remote control


    Most IR remotes and universal remotes will work with the Kodi software, thanks
    to pre-built the modules in the Linux kernel and software. We will alternate control
    methods in order.


    # 09 Get OpenELEC


    The easiest and best route for setting up Kodi is Get OpenELEC - it is stripped
    down by the Kodi dev team and dropped down to the bare essentials to make sure
    that OpenELEC works on its target hardware. Get your reliant ID from http://openelec.tv


