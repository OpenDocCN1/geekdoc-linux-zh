    # 11 BOOT LOCATION


    If your system boots from a CD or USB stick when you turn it on, look for the
    boot menu during the first screens. You may need to press an F key to fail, change
    the boot order selection so that your hard drive is lower in the process.


    # BOOT ISSUES


    # Get GRUB working and boot back into Linux


    # 15 ADD OTHER OPTIONS


    The beauty of GRUB is that you can add options to it - either ways to boot your
    distro, or adding other options if you multi-boot. For multi-booting, the quick
    way is to use the pre-installed probe (operating system probe) in GRUB, all you
    need to do is check what is installed and add to the grubcfg. Otherwise, you can
    create custom installation options files in /etc.d/ named in order you want them
    to boot.


    # 16 GRUB CANNOT BE FOUND


    This one doesn''t happen out of the blue - usually there''s a reason, you''ve
    installed another system to your distro, for example. We''ve run on a laptop once
    or twice and it''s happened, again. Either way, don''t panic as you can easily
    restore GRUB.

    First, of getting a live medium of your preferred distro - Ubuntu, all you need
    to do is try to install GRUB on Fedora or other Live CD, to solve the problem
    for you to load the live environment.


    Once you''re in the system, mount the hard drive where your distro is installed
    to the file manager and open the terminal. Make sure GRUB is installed by trying
    to install the GRUB package (Ubuntu, apt-get install grub; Fedora is yum install
    grub). Still, in the system, use fdisk -l to figure out the location of your hard
    drive (dev/sda). When you have that type:


    # 12 BOOT AFTER WINDOWS INSTALL


    Windows won''t let unlike GRUB, which enables you to do both. After a dual-boot
    install, you''ll have to restore GRUB to boot. Then you just need to run update-grub
    to boot to Windows.


    # 13 CHANGE GRUB OPTION


    There are two ways to do it - by just using the other systems, you can change
    the order of the OS profile file in /etc/grub to be the main Linux file and change
    the default selection in root/grub.cfg.


    # 14 REMOVE SPLASH SCREEN


    One way to find out more issues is to see what happens during boot - but hits
    the splash screen. In GRUB, you can turn off the splash screen by going to /etc/default/grub
    and the ''quiet'' answer in the GRUB_COMMANDLINE_DEFAULT LINUX option.


    # 17 NEED TO MANUAL BOOT


    This is not an easy - you may get a boot prompt at GRUB asking you to manually
    type the boot command. If you can''t reinst for GRUB for some reason, or don''t
    want to, you''ll have to know the following pieces of information: version of
    the kernel and the UUID of the drive. These can be quite long, so you''ll need
    to write them down. Once you have that, you can boot by something like:


    ```

    $ linux /boot/vmlinuz-(kernel version) generic root=[UUID of drive] quiet splash

    ...and...

    $ initrd /boot/initrd.img-(kernel version) generic

    ```


