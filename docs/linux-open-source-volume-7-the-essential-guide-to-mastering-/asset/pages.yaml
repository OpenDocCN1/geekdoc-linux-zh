    \ The kill command\n\nThe kill command sends the TERM signal by default. The following\
    \ two commands are equivalent:\n\n+   - kill <process_id>\n- kill <process_id>\n\
    \nYou should avoid sending the SIGKILL when running a process unless it is necessary.\
    \ SIGKILL is noncatcher and nonignorable signal that violates process policy allowing\
    \ it to clean up.\n\nIf you use a command followed by the -1 option it will return\
    \ the signal name. Similarly, if you give a signal name, it will return the signal\
    \ number.\n\n# 03 The most common\n\nYou have process use Ctrl-C in order to stop\
    \ a program from running; Ctrl-C sends the SIGINT; SIGINT is the most commonly\
    \ used signal.\n\nAnother signal is SIGHUP, which happens when you use a process,\
    \ the kill -9. As you will use in the next step, SIGKILL is a special kind of\
    \ signal.\n\nAnother signal is called SIGHUP, which is commonly used to notify\
    \ server processes to reread their configuration flags.\n\n```\n#include <stdio.h>\n\
    #include <signal.h>\n\nstatic void handle_usr1(int sign) {\n    if (sign == SIGUSR1)n\
    \        printf(\"Received SIGUSR1\\n\");\n    } else // This should not happen\
    \ {\n        printf(\"Unknown signal\\n\");\n    }\n    return;\n}\n\nint main(int\
    \ argc, char **argv) {\n    if (signal(SIGUSR1, handle_usr1) == SIG_ERR {\n  \
    \      printf(\"There was an error handling the SIGUSR1 signal\\n\");\n      \
    \  return -1;\n    }\n    while (1) {\n    }\n    return 0;\n}\n```\n\n# \"THE\
    \ KILL signal is similar to unplugging the machine\"\n\n# 04 Handling signal\n\
    \nA program cannot handle all signals because some are noncatcher and nonignorable.\
    \ SIGKILL cannot be caught, blocked or ignored. This is the only signal that you\
    \ cannot provide the root and the user to stop the process of stopping.\n\nThe\
    \ effect of the SIGKILL signal is it still in conditions where you need to act\
    \ fast, so it is the only signal that is usually called because it is the number\
    \ that you should use.\n\n# 05 Handling user signal\n\nOur example program 'handleone\
    \ handles the SIGUSR1 signal. SIGUSR1 is a user-defined\n\nsignal for in programs\
    \ and its default action is 'terminating'. By handling it, you can use its default\
    \ behavior.\n\nApart from the USR1 signal that is specifically handled, all of\
    \ the other signals will use their behaviour. You can use Ctrl+C to stop the program\
    \ or kill it another terminal.\n\n# 06 Explain the code\n\nThe code is easy to\
    \ understand. The signal function, the handle_usr1 function will be called when\
    \ a SIGUSR1 signal occurs. You need to see it either by name or by your code,\
    \ and it is better to use the name to make your code easier to read.\n\nThe endless\
    \ loop is used for making the program run in order to be able to test signal handling\
    \ and usually, server processes will have a similar code."
