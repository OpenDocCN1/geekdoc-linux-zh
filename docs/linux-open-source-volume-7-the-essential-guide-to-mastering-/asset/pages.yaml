    # Sprites


    # ## We created custom artwork for our game


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_141_1.png)


    Background Our background, which is repeated horizontally is 148x168 pixel design,
    making it appear

    to move smoothly as Tux moves.


    Objects Our character is a 30x30 pixel sprite. We will make many enemy sprites
    for the next part of this guide

    - check FlibSprite.


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_141_2.png)


    # ## Advisor


    > Finn Hanna has been in the business since the Palm Ills. Journalist, tutor,
    speaker and author, he has seen every aspect of the Pebble market more than


    Under a superficial examination, the Pebble doesn''t look like an ideal device;
    if we look at its 800MHz processor, which is paired with a monochrome screen,
    it not only lacks the ability to display colour but is furthermore not particularly
    suited to frequently updating content. The Pebble also has limited API which cannot
    be accessed by third-party applications.


    Paradoxically, the Pebble is deeply rooted in its approach to smartwatch design:
