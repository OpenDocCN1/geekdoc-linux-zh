  md: '# Developer guide


    # Visualising Chrome''s history file


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_159_0.png)


    # Add titles and labels


    Sooner or later, it''s likely that you will want to add a title to the output.
    Adding a main title is just what you need to make of labs) The previously barred
    plot can be modified with inclusion of the following command at the end:


    ```

    ggplot(L, aes(x=RAM, y=SSD) + geom_bar(stat="identity") + labs(title="This is
    a Title")

    ```


    Adding X and Y labels can be done by entering the following:


    ```

    ggplot(L, aes(x=RAM, y=SSD) + geom_bar(stat="identity") + labs(title="This is
    a Title", x="RAM-Label", y="SSD-Label"))

    ```


    # More about titles and labels


    As well as that, you can also change the appearance, font, and colour of all the
    labels. The command makes the title blue and its size using the following function:


    ```

    ggplot(L

    ```


    To change the X and Y axes, use the following function:


    ```

    ggplot(L, aes(x=RAM, y=SSD) + geom_bar(stat="identity") + labs(title="This is
    a Title", x="RAM-Label", y="SSD-Label")) + theme(plot.title=element_text(size=22),
    color="blue", axis.line=element_line(size=3), color="red", linetype="dotted"))

    ```


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_159_1.png)


    # Create histograms


    Generate histograms using the geom_histogram(), similar to the geom_bar(), and
    change the number of bars using binwidth argument. Plot a simple histogram using
    the following command:


    > ggplot(L, aes(y=density)) + geom_histogram(binwidth=1, color="gray")


    Using the geom_density() you can draw a density plot on the same plot:


    ```

    ggplot(L, aes(y=density)) + geom_histogram(binwidth=2, color="white") + geom_density(color="red")

    ```


    Draw a histogram and a density plot is using:


    > ggplot(L, aes(y=density)) + geom_histogram(binwidth=2, color="white") + geom_density(color="red")


    If you put the geom_density() command first, the histogram will be on top of the
    density plot and the density plot will not be visible.


    # Add layers


    Another type of layer is the smoother layer. It doesn''t display data, but a statistical
    transformation of the data.


    The method="loess" parameter generates a linear regression line (LOESS local polynomial
    fitting), which is default for samples with less than 100 observations. The produced
    plot was generated with the following commands:


    ```

    ggplot(L, aes(x=RAM, y=SSD)) + q_geom_point() + geom_smooth() > q_geom_point()
    + geom_smooth(method="loess")

    ```


