    # Add Auto-Levels


    There is an Auto Levels tool that will automatically do any corrections on the
    photo for you. For some people and photos, this may be all you need to do to enhance
    your photo. Sometimes, though, you might need to do a little less order to ensure
    maximum quality.


    # “Use the Eraser tool to remove the red areas from the skin”


    # Clean blemishes


    There''s a big debate going on right now the industry''s use of airbrush to make
    models look perfect. We''re not ready to debate that in Linux User & Developer,
    but it''s fine to have a look at at covering the skin blemishes if you need to.


    # Set up the image


    Grab the healing tool and zoom in the picture. Select a patch of skin next or
    very near the blemish - change the brush size if you need, depending on the size
    of patch and blemish. Hold Ctrl before clicking. This selection will move with
    your painting to vary the healing tool''s colours.


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_29_1.png)


    # Alter the colour range


    Back on the levels editor, find the colour selector. Editing these individually
    can create a slightly better tone profile across the picture. You can also edit
    the Blue or Red levels to make the image colour order, or correct the white balance.


    # Use the healing tool


    With blemishes like red patches, and freckles you can easily cover them using
    the Healing tool. This takes one area of a photo and uses it to create a natural
    gradient. It''s the plaster symbol on the tools.


    # Heal blemishes


    Paint the blemish as you would normally use any other colour using the paintbrush
    tool. You may need to reset the initial point of copy to points to avoid using
    the background or another part of the picture to cover up the target area.


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_29_2.png)


