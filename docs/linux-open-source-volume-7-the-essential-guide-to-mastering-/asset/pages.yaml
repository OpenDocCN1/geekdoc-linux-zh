    Each shape has its own color. This method is particularly useful as it shows how
    to create autonomous functions that generate objects based on user-defined parameters.
    This means that you can create your own JavaScript library of useful functions
    that you can reuse. The secret is to fill the WebGL buffer with data - it is the
    shapes you want - until you finish drawing them and then display the buffer on
    screen!


