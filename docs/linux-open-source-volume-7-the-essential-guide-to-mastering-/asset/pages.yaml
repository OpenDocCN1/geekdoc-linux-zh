  md: '# Ultimate Distro & Foss Guide


    # BEST DISTRO FOR...


    # Lightweight


    A lightweight Linux distro can help you get the most out of an old or underpowered
    system by using relatively fewer resources


    # Lubuntu


    You can define lightweight in a number of ways these days. While the graphical
    part of a distro could be the most resource intensive, the kernel also takes power
    away from CPUs. While Ubuntu and other Linux distros LXDE don''t come close to
    it, the desktop itself can be a huge resource on older systems.


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_9_0.png)


    That''s why Lubuntu is worth the prize. While minimal, the desktop has features
    of Unity, which makes it an incredibly solid and relatively easy-to-use system
    that makes a good desktop environment where you can really get done


    > Lubuntu has an excellent Software Centre to make package downloads easier


    LXDE is not only lightweight - it comes quite a different feel compared to XFCE
    or MATE – (very importantly!) as well-featured as most modern desktops. But with
    Ubuntu''s impressive software and packages you''ve got a lightweight distro that
    doesn''t sacrifice stability and still has access to all your favourites.


    As lightweight, Lubuntu comes with a quick set of default apps compared to its
    siblings. A selection of basics like Firefox, Diction, and Abiward are all you
    need. It''s enough to get started and thanks to the full Ubuntu repos you can
    start building upon the excellent desktop environment that Linux is known for.


    It''s not the lightest distro around but it''s certainly the best distro that
    comes with the lightweight browser.


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_9_1.png)


