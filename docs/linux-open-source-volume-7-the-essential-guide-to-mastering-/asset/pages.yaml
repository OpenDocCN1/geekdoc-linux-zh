    # 12 First boot


    OpenLEC will boot in Kodi/XBMC and now it''s time to configure things. First you
    should look at the internet options in the OpenLEC Configuration Utility located
    in the Addon section. This will let you set up wireless as well as a few other
    things.


    # 14 Enjoy your shows!


    Once your network is set up, and your media is added from the network, you can
    start listening or watching whatever you want. It doesn''t take much time to set
    up a PC with Kodi, and Plus, you don''t need to do much more than weekly maintenance
    to keep it running. This Kodi has a lot of great extra features too, so continue
    on for ways to get the most out of your HTPC.


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_69_2.png)


    # 15 Internal storage


    Keeping files on internal storage is a good way to have frequent access to especially
    those that you watch regularly or in your household (like kids with cartoons,
    will watch over and over). These will be automatically added to your list without
    needing to prompt in Kodi for their location.


    # 10 Liveclick


    Unzip the files and open the OpenLEC folder, then insert the stick you want to
    use to create the live stick. Find out how to install it using sudo - and set
    it up with:


    ```

    $ sudo ./codec_install /dev/sd

    ```


    # 11 Installation


    Once the live media is running, you need to insert it into your HTPC and switch
    it on, looking for the option to boot from the stick. You will be asked how to
    install OpenLEC - use the Quick Install, assuming this is a just, completely untouched
    system, and follow the prompts to reboot.


    # 13 Added media network


    Go to Movies/Music tab and find the Files option - here you can add media from
    networked sources like Samba, UHP or a direct address to something like NFS partition.
    You can choose a chooser that will add and names to any files you may have available.


    # 16 USB storage


    Accessing the internal storage may be a little difficult for some, but a USB stick
    or drive will hard easily connect to the system and will be instantly added to
    your video library like anything from the internal storage as well.


