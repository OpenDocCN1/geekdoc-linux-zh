  md: "FastCGI is a protocol to interface interface\nprograms with a server - it is\
    \ an improvement\nover CGI (common gateway interface). CGI is\neasy to implement\
    \ but fails in scaling since\nseparate processes are created for each web\nrequest\
    \ - a heavy overhead on the host. FastCGI\nsolves this by using persistent processes\
    \ to\nserve multiple web requests; however, these processes\nare not owned by\
    \ the web server. This decouples the web and\nFastCGI server, allowing effortless\
    \ scaling. Now\nthat servers support FastCGI, using it for\nMediaBlogs is a good\
    \ option because of easy\nconfiguration and setup.\n\n```\nSERVER {\n###########################################\n\
    \    # default config options, but ignore them :=\n###########################################\n\
    \    include /etc/nginx/mime.type;\n###########################################\n\
    \n    fastcgi_params;\n    default_type application/octet-stream;\n    sendfile\
    \ on;\n    tcp_nopush;\n    fastcgi_buffer_length 1024;\n    fastcgi_buffers 4\
