    # ## UPnP streaming


    Stream music, videos and photos


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_54_1.png)


    You can also use your NAS backup as source. Make a folder for your UPnP media
    server on the shared disk, via a client''s browser or SSH, and subscribe to it.
    Go to Services/DLNA/UPnP in the TrueNAS web GUI, enable and choose your new folder
    as the database directory. For subfolders, click OK, then Add. Choose a profile
    for your UPnP device. Enable transparency. If needed select the temporary directory.


    # # “For extra security, you can change the username and password”


    ![](img/eeb9cf1dced40aa94ad8c78e7ef5dd20_54_2.png)


    # ## 16 SSH login


    Setting up SSH key authentication (see bit.ly/Yfgaug) is done from the command
    line. First, open a terminal and enter:


    ```

    ssh -l root [NAS4Free IP]

    ```


    Type yes, then enter the password to log in to your NAS.


    # ## 18 Rename public key


    Rename your public key with:


    ```

    mv ~/.ssh/id_rsa.pub ~/.ssh/authorized_keys

    ```


    Then log out with:


    +   - exit


    Copy the public key to your client PC:


    ```

    - scp -p root@[NAS4Free IP]:~/.ssh/authorized_keys .

    ```


    Enter the password, then SSH in (step 16) and not be asked for a password.


    # ## 14 Start up SSH


    We''ll want to use rsync with SSH to backup files from the computer to our NAS4Free
    server. In the web GUI, go to Services/SSH and enable. Pick the root password
    then Save and Restart.


    # ## 15 Back with rsync


    You''ll need a manual backup from the PC. While you can run rsync from the command
    line, using ''rsync'' a GUI front is end of use, particularly when choosing options.
    Choose the folder to back up, then set the destination: @NAS4Free:month/backups.
    The gears icons and dial will prompt you for a passphrase: enter NAS4Free password
    (is nas4free). The backup will then process. This is for manual backups, but for
    automated ones we''ll to set up SSH passwordless rsync, key authentication.


    # ## 17 Generate SSH key


    Now we generate a SSH key pair, by bytering:


    ```

    ssh-key-keygen

    ```


    Press Enter to accept the file location, then enter an empty passphrase and Enter
    to confirm. Your SSH key pair will be generated.


    # ## 19 Automate backups


    You can automate backups with cron. In the terminal:


    +   - crontab


    Copy and paste your rsync command into a new line at the bottom, preceded by the
    time and date fields - * * * * daily backup at that time, for a 2pm daily backup
    you use.


    ```

    00 14 * * *

    ```


