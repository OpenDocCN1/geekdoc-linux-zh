  ## 引言


  如果你在计算机技术领域花费过任何时间，你几乎肯定多次遇到过 `Linux` 这个术语。你可能听过 `Linux` 是开源且免费下载的，但这些信息并不能充分描述
  `Linux` 到底是什么。本书将为你学习 `Linux` 提供坚实的基础，使你能够更好地在该主题的知识海洋中穿行。


  ### 关于 Linux 的误解


  `Linux` 基本上就是一个操作系统。“操作系统”可能是一个你经常使用的短语，但大多数人并不真正理解 `OS` 到底是什么。


  你计算机上所有的软件和硬件都是通过 `OS` 运行的。这就是为什么，如果你有一部 Android 手机，你就必须下载 Android 应用；如果你有一部 iPhone，你就必须下载
  Apple 应用。不同的操作系统对硬件和软件都有不同的要求，而你必须遵守这些要求，你计算机上的程序才能正常工作。大多数计算机都预装了 `OS`，使用户能够立即开始访问其计算机的信息和功能。如果你使用的是苹果电脑或手机，会预装一个
  `Mac OS`，以便在其上运行 Mac 软件。大多数其他计算机都预装了 `Windows OS`。它们让你能够立即开始使用计算机。


  `OS` 是允许你与计算机上的信息进行交互的界面。最早的操作系统使用命令行界面，这意味着用户必须输入代码才能访问程序。最常见的是 `MS-DOS`，它是微软在
  1981 年发布的。如今的操作系统使用图形用户界面，或称 `GUI`。这意味着你可以物理性地以图像的形式看到你想要访问的不同应用程序和程序。你只需要点击图标，它们就会打开。不同的操作系统使用不同的
  `GUI`，因此从一个 `OS` 切换到另一个 `OS` 最初可能会引起困惑。外观和感受会有不同，可能需要一些时间来适应。


  操作系统必须不断更新，以跟上软件和硬件不断增长的改进。如果你尝试使用最新版本的 `Microsoft Word`（或其他任何程序）并发现它与你的计算机不兼容，你可能经历过这种挫败感。问题不在于你的计算机故障了，而是你的操作系统不够先进，无法处理最新版本的软件。你需要更新你的
  `OS`，或者使用你尝试访问的程序的旧版本。更新 `OS` 可能会占用大量内存，因此拥有一个最新的 `OS` 可能意味着需要一台拥有内存的计算机。如果你落后得太远，你可能甚至要在购买一台新计算机或使用过时的
  `OS` 之间做出选择。


  `Linux` 是运行在计算机上的操作系统 (`OS`)。通常情况下，`Linux` 由三部分组成：内核 (kernel)、`GNU` 用户界面 (`GUI`)
  和应用程序软件。内核是操作系统的核心部分，负责分配资源和管理任务。`GNU` 用户界面是用户在显示器上看到的内容，它控制屏幕显示的内容，如菜单、图标和窗口。应用程序是执行各种功能的软件程序，例如文字处理或网页浏览。`Linux`
  内核和 `GNU` 用户界面是操作系统最重要的两个部分；没有它们，`Linux` 将无法运行。


  学习 `Linux` 的最佳方法是下载一个副本并安装。根据用途，有许多 `Linux` 发行版供选择。你可以从互联网获取 `Windows` 版本或源代码形式的发行版。无论你使用哪种
  `OS`，操作系统的内核代码本质上是相同的。这就是为什么你可以在 PC 上安装 `Linux` 内核并运行它，就像你运行 `Windows 95` 或 `Windows
  98` 一样。


  一旦你在计算机上安装了 `Linux` 内核、`GNU` 用户界面和应用程序，你就了一个工作的 `Linux` 操作系统。然而，有很多方法可以使用免费或开源的软件来定制你的
  PC。你可以访问许多提供免费软件下载的网站，也可以在网上购买各种 `Linux` 发行版。这些程序大部分都带有自己的说明文档，解释了如何使用它们以及它们将在你的计算机上执行什么。


  例如，`Windows Server 2003` 的许多更改需要重启后才能生效，而且通常很难跟踪谁正在使用服务器上的哪些资源。相比之下，`Linux` 可以配置为一段时间后要求输入密码，这样人们就无法一直登录服务。此外，由于在
  `Linux` 的 `X Windows System` 之上没有运行的窗口，让大量程序平滑运行要容易得多。


  最后，`Linux` 内核、`GNU` 用户界面和数千个应用程序在互联网上都是免费提供的。每个人都可以下载这些部分并使用它们来创建他们自定义的 `Linux`
  版本。事实上，你可以从 `http://www.gentoo.org/` 下载名为 `Gentoo` 的所谓 Linux 主流版本的完整副本。然而，尽管 `Linux`
  内核是免费使用的，但许多硬件供应商要求客户购买自己的 `Linux` 副本并支付支持费用。


  ### 为什么要使用 Linux？


  `Linux` 只要你能够熟练掌握它，它就会在一天中持续运行并处理它的职责。你应该考虑 `Linux` 的工作便利性，无论它是用于 `Apache` Web 服务器、`MySQL`
  数据库服务器、虚拟化服务器还是电子邮件服务器等。


  ## 第一章：什么是 Linux？


  ### Linux 基础知识





  对于大多数人来说，Linux 涵盖了广泛的概念；虽然有些人认为 Linux 是一个指令复杂的棘手系统，或者是一个仅供专业人士使用的操作系统，但我们更倾向于将其视为一种基础操作系统，类似于
  Windows 或 Mac OS X。它让你能够像在 Windows 下一样进行工作，只是操作方式有所不同。多年来，由于使用简单，Windows 操作系统比 Linux
  流行得多，但这种情况已经发生了变化。Linux 现在拥有了与 Windows 操作系统一样吸引人、舒适且易用的图形用户界面。命令已经过简化，当前版本（发行版）还进行了其他增强，以提升用户体验。


  虽然大多数人将 Linux 视为一个独立的操作系统，但实际上，Linux 几乎无处不在。Linux 无处不在，几乎所有的设备都运行在上面，从你的安卓手机到智能冰箱，甚至还有军用级步枪。Linux
  通常被称为 `kernel`（内核），负责整个操作系统的功能。它的功能是执行脏累活，如内存管理、外设访问（硬盘、CD-ROM 读器、键盘、鼠标和显卡等）、网络管理以及在应用程序之间进行微处理器的时间共享（多任务处理）。


  与强制你使用其图形用户界 Windows 不同，Linux 支持多种不同的图形用户界面，其中最著名的是 Gnome、KD 和 XFC。即使在没有图形用户界面的情况下操作
  Linux，或者只在需要时打开 GUI 也是可行的。因此，Linux 让你对 GUI 有完全控制权，这对于喜欢折腾事物的人来说非常有吸引力。提到操作系统，最经常提到的是
  Windows 和 Mac OS。它们是两个最流行的系统，并且已经以多种形式存在了长期。它们之所以流行，主要是因为它们预装在计算机系统中，大多数人仅仅是因为方便才使用它们。虽然这两个操作系统占据着主导地位，但第三者正在计算机世界大有一席之地：Linux
  操作系统。


  Linux 主要出现在移动设备上，如智能手机和平板。然而，由于 Linux 是开源且免费的，越来越多拥有电脑和笔记本电脑的人开始将其作为自己的操作系统。由于 Linux
  与嵌入式系统的兼容性，它在移动设备、电脑、可穿戴设备、路由器、游戏机、控制器甚至电视上都非常有帮助。


  Linux 的设计简洁，许多程序员都欣赏这一点。它简单直接，具备其他操作系统的许多功能，但操作起来更加容易。由于它是开源的，它迅速成为大量程序员的主要选择，这意味着他们可以根据自己的意愿使用或修改它，因为它包含了程序员对桌面、移动设备等可能需要的所有功能。


  ## Linux 的历史


  Linux 的历史始于 UNIX 操作系统，它是由 AT&T 贝尔实验室在 20 世纪 70 年代开发的。Linus Torvalds（林纳斯·债券）当时是赫尔辛基大学的学生，他打算根据
  Minix 的优点创建一个自己的操作系统，但让它对普通大众更容易用。他的发明当然是 Linux。


  微软的流行在 20 世纪 90 年飙升，他们的 Windows 操作系统取代了笨拙的 DOS 系统。


  此后，苹果在 21 世纪初像凤凰一样从灰烬中崛起，并令其用户感到非常高兴。iPhone 和 iPad 通过其极强的便携性改变了计算和访问访问。苹果在过去二十年里非凡的成功使其成为闭环环境产品的代名词，这意味着
  Apple 产品与任何其他事物都不兼容，但它们共同运行得完美无缺；如果你有一台 Apple PC、iPhone 或 iPad，它们将完全同步。


  值得注意的是，由于 Apple iOS 的发布，Linux 近年来遭受了挫折。尽管如此，Linux 在操作系统和社区方面都继续扩张。接下来的下一节将探讨 Linux
  社区、其核心理念，以及它与其他技术爱好者社区的区别。


  Linux 于 1991 年首次发布。它最初旨在为基于 Intel x86 的个人计算机提供一个免费的操作系统。然而，它很快被修改为更具协作性的努力，源代码免费提供。根据操作系统的许可规则，它可以出于非商业目的和商业目的进行更新和分发。由于符合
  `POSIX`（或可移植操作系统接口），它是一个相当可靠的操作系统。


  ## Linux 的组件


  你会遇到 Linux 的七个主要组件。它们包括：Shell（壳）、Daemons（守护进程）、桌面环境、应用程序可用性、图形服务器、Kernel（内核）和 Boot
  Loader（引导加载）。


  ### 桌面环境

  桌面环境指的是与用户交互的许多组件。Enlightenment、Cinnamon、Unity 和 GNOME 只是这些桌面环境的几个例子。每一个都将包含一套自己的网络浏览器、计算器、文件管理器、设置工具和其他内置功能。


  ### 守护进程 (Daemons)

  守护进程是提供后台服务的 Linux 组件。这包括调度、打印和音频。这些将在两个点之一启动：启动期间或你登录桌面后。


  ### 应用程序的可用性

  Linux 预装了成千上万的应用程序。一旦安装 Linux 系统，你可以安装你选择的任何数量的应用。将 Linux 应用程序比作 App Store 或 Windows
  Store，你可以在那里浏览并选择想要使用的程序。在进行一些研究并找到所需的应用程序后，你可以在 Linux 系统上下载并安装它们。


  ### 图形服务器 (Graphical Server)

  这将是 Linux 子系统。你将注意到的主要特征是图形服务器将在你的屏幕上显示各种视觉效果。它被称为 `X server` 或简单称为 `X`。


  ### 引导加载程序 (The Boot Loader)

  有时，你需要验证系统是否正常启动。引导加载程序会在 Linux 管理环境下接管启动过程。它通常显示为启动屏幕。一旦你看到这个启动屏幕，计算机将缓慢开始启动过程。


  ### 内核 (Kernel)

  `kernel` 是你在 Linux 操作系统中遇到的主要组件。这本质上是 Linux 的核心。它控制 Linux 操作的 CPU、外设设备和内存管理。


  ### 外壳 (Shell)

  在 Linux 中，`shell` 将作为命令行。它将根据用户在界面输入的指令实现各种控制。这是你输入想要发送给计算机的代码和指令的地方。我们的计算机被编程为理解特定的语言。


  `Binary`（二进制）是这种语言的名字，由 0 和 1 组成。当计算机出现时，指令是以这种语言提供的，由于它不是每个人都能读读或写的语言，导致了复杂性。为了解决这个问题，我们有了
  `shell`，它包含在每个操作系统中。`shell` 负责解释人类命令，以便 `kernel` 能够读取并处理它们。





  Shell 是一个用户界面环境或用户应用程序。它是一个命令解释器，用于翻译并执行从输入设备（如键盘或文件）获取命令。当你打开终端或登录系统时，Shell 就会启动。虽然它不是
  Linux 系统内核的组件，但它大量利用内核进行文件创建、应用程序执行以及各种其他任务。Linux 用户有许多 Shell 可用，包括：


  - `BASH`——一种免费的开源 Shell 脚本语言，在 Linux 中使用最广泛。

  - `CSH`——在用法和语法上与 C 语言语言相似。

  - `KSH`—— POSIX shell 标准要求的基础。


  每个 Shell 执行相同的工作，但每个 Shell 都能理解不同的语法并提供一组独特的函数。


  ## Linux 的独特性


  Linux 最优越的特性是它是开源且免费的，这可能解释了为什么有这么多的人转向它。Mac OSX 和 Windows 的获取成本都很昂贵，用户必须自己购买这些程序，或者让别人在他们的电脑上安装程序。考虑到各种操作系统所需的升级次数，这可能会变得非常贵。由于
  Linux 是一个免费的操作系统，你可以随时进行更新而无需支付任何费用。


  开源模型使程序员和普通 Linux 用户均受益。程序员可以利用库中的大量代码来生成新代码并将其发布供他人使用。Linux 用户受益于更快的更新、更现代的功能等，这一切都归功于多名程序员同时在系统上工作的能力。


  Linux 操作系统架构下的每个模型都管理硬件组件、分发和管理应用程序，并提供某种形式的图形用户界面。由于开发领域的巨大和传输手段的广泛，几乎任何任务都有相应的
  Linux 版本，它已经渗透到各种计算领域。


  例如，Linux 已经成为流行的 Web 服务器操作系统（如 `Apache`），以及网络活动、需要大型图形分组的逻辑处理任务、运行数据集以及运行操作系统版本的手机（如
  `Android`）。


  所有这一切使 Linux 成为显而易见的选择，特别是在未来，因为它也兼容手机和平板电脑。


  ## Linux 社区


  考虑到这些，人们可能会得出结论：Linux 社区大多是热于这一特定操作系统的技术爱好者。他们拒绝一切反对该系统的东西，即使这些东西更强大或具有更高的商业价值。此外，他们喜欢坐在父母的地下室里，在网络聊天室中花几个小时时间讨论一些深奥的话题，例如操作系统以及
  `Netscape` 和 `Internet Explorer` 之间的网络大战。如果你是这样假设的，你就完全错了。


  然而，Linux 运动确实大多是由技术爱好者发起的，因为它始于个人电脑还不常见的时期。在 20 世纪 90 年代，很少有人意识到个人电脑的必要性。大多数计算机由公司所有，主要用于业务目的。然而，随着个人电脑在
  20 世纪 90 年代的爆炸式增长，越来越多的人对 Linux 是什么以及作为 `Microsoft` 垄断可行替代方案的意义感兴趣。个人电脑变得无处不在，那些以前对技术一切无所谓的人突然需要掌握计算机使用的基础知识。虽然大多数人仍然停留在电脑预装的
  `Windows` 操作系统上，但也有人想要深入探索 `Microsoft` 提供之外的内容，发现还有哪些其他选择。这些人为 Linux 运动奠定了基础。


  Linux 社区不仅是一群花费时间争论各种操作系统优点的电脑极客集合。相反，Linux 社区是一场个人运动，他们希望看到计算机技术从垄断和偶尔有害的企业行为中解放出来。


  在在这方面，`Microsoft` 和 `Apple` 取得了巨大的成功，它们对过去二十年里计算机技术的许多进步负有责任。同时，它们建立了资金漏斗，人们认为自己有义务购买这些公司提供的产品。考虑到
  `iPhone`，很少有人真正需要 `iPhone`，更少的人需要最新、最先进的版本。然而，每当新手机发布时，就有成千上万的消费者渴望交出他们功能完美但有些旧的型号，以换取新的改进的型号。


  因此，他们花费数千美元购买他们认为能改善生活并带给他们快乐的改进技术。光环很快就会消失，人们开始期待下一个 `iPhone` 的到来。


  `iPhone` 狂热并非仅限于 `iPhones`。在 20 世纪 90 年代，当 `Microsoft` 每隔几年发布一次改进版本的操作系统，且人们认为在个人电脑领域没有
  `Windows` 的替代品时，在新操作系统发布前的几个晚上会发生骚乱。个人会打破意图销售该系统的商店玻璃窗。他们会互相抢跑，冲向装有安装新操作系统所需硬件的闪眼展示盒。考虑一下你最糟糕的黑色星期五噩梦变成现实的可能性。


  这种个人抢购最新、最强大 `iPhone` 的现象是所谓的“从众心理”或“群体思维”的例子。人们渴望他人未拥有的东西，并不是因为他们看到了自己的有利处，而是因为每个人都有。他们没有停下来考虑可能对他们真正有用且符合他们需要的选项。


  声称 Linux 社区的每个人都对从众心理免疫并独立思考是夸张的。然而，事实是，Linux 为由 `Microsoft` 和 `Apple` 领导的企业企业提供了一种替代方案。Linux
  是一个免费开源的操作系统，将在下一章中详细讨论。这意味着每个人（而不只是硅谷的少数电脑极客精英）都可以下载它并为其开发做出贡献。你永远不需要为最新最好的版本花费数百美元，你也不会被践踏（好吧，90
  年代已经过去了，所以这种情况不太可能再次发生）。Linux 是主导大多数软件行业的企业所引发的狂热之后的一种更冷静的替代方案。


  Linux 社区由反对这些新产品产生的狂热和炒作的人组成。他们是去中心化的代理人。当权力集中少数个人手中时（无论是政治独裁者还是 CEO），就会发生中心化。去中心化是将自己远离权威并将权力重新分配给普通人的过程。他们认为计算软件不应为了利润出售，而应作为一种能够以新颖方式将人们聚集在一起的功能，因此应该自由传播。像
  `Ubuntu` 开发者 `Mark Shuttleworth` 这样的个人已经根据这一原则建立了他们的帝国，并致力于致力于推进开放计算技术的发展。简单来说，Linux
  社区是由致力于计算技术领域社会和经济公正的人组成的。




  通过观察 Ubuntu 来思考社区是如何实现其目标的。Ubuntu 是一个南非概念，它承认个人在人际关系中的价值，并为和解提供了了路线图。它是最受欢迎的 Linux
  发行版之一（一种从 `Linux kernel` 生成的程序）。


  ## Linux 发行版


  使用“发行版”（distribution）一词是因为该操作系统由各种来源的软件软件包（程序）组成。每个发行版的大部分软件包都从存储它们的源宿主机（或仓库）获取。仓库可以由几个不同的来源组成，包括私有、公共和开源文件。仓库背后的理念是提供一个中心位置来查找软件，而无必担心单个软件包的来源。发行版仓库中包含的软件包随后使用包管理工具进行组织。


  Linux 发行版是功能多样的工具集合，可用于创建、管理和自定义 Linux 操作系统。发行版有许多类型，包括最常见的桌面发行版，它提供了基础的用户界面（`GUI`）和桌面环境。其他发行版还包括服务器版本，提供了各种管理和安全功能。还有一些专注于特定领域的特种发行版，例如多媒体和游戏。


  ## 如何选择 Linux 发行版


  本节讨论如何选择适当的 Linux 发行版。Linus Torvalds 在 1991 年创建 `Linux` 后预见到了要休息一下。因此，他让他新功能框架的源代码完全对所有人开放。这使得地球上的任何人，特别是
  PC 极客、专家和其他人士，都能随心意欲地开始尝试和修改 Linux 操作系统。


  将 Linux 源代码免费引发了许多人所谓的“课程”或“发行版”的发展。发行版随着时间推移创建的 `Linux` 的众多分支。目前有许多 Linux 发行版。不同的任务需要不同的能力。当需要选择使用哪种
  Linux 发行版时，你应该首先评估你的 PC 使用 Linux 需要做什么。


  由于所有发行版都基于 `Linux`，它们往往非常相似，因此可以相互替换。例如，`Ubuntu` 因其易用性以及为用户抽象化微配置任务的能力而最流行的发行版。另一方面，`Arch
  Linux` 不提供相同的功能，如果你想对系统有更多控制权并能够根据特定需求对其进行定制，它更合适。


  如果你是 Linux 的完全初学者，我们建议使用基于 Debian 的发行版，如 `Ubuntu` 或 `Linux Mint`；然而，本书也支持基于 Arch
  的发行版，如 `Manjaro`。请不要将此建议解释为这些发行版是针对初者的。本书推荐这些发行版是因为它们为新手用户提供了一个熟悉的环境。


  加州大学伯克利分校的个人被选中开始开发他们自己的 Linux 版本。此外，中国公民也开始开发自己的 Linux 版本。来自世界各地不同基金会的个人开始开发自己的
  Linux 变体以满足独特的需求。今天，你可以从 `Red Hat Linux`、`Ubuntu Linux` 和 `Google Android` 等中选择。


  在呈现 Linux 工作框架之前，从根本上说，理解你需要 PC 做做什么更为。使用 `Microsoft Windows` 时，你基本上是先呈现它，然后担心以后如何管理你的工作。在
  Linux 中，每一次部署都尝试在优先级列表顶端带有特定目标地完成任务。


  例如，一个名为 `Trustix` 的 Linux 发行版被广泛认为是最安全的 Linux 操作系统。它就像一个正方形。你安装 `Trustix Linux`，只要你不做任何完全不寻常的事情，任何人就不可能黑入它，任何污染也不会进入。它由单一可靠且安全的工人组成。无论如何，在继续接收该特定分配提供给工人之前，你必须认为你需要一个稳定且安全的工人。


  因此，如果你需要一台 PC 来运行某些办公应用或浏览网页，你可能需要 `Ubuntu Linux` 的工作领域解释。如果你想要一个极其安全的 PC，可能需要 `Trustix
  Linux`。如果你需要大规模的业务支持，并认为你必须使用有专门帮助台协助你的 Linux 发行版，如有必要，你可以选择使用 `Red Hat Linux`。最终，你必须选择最适合当前任务的特定
  Linux 发行版。


  ## 第二章：Linux 与其他操作系统的相比


  Linux 无疑是世界上最流行的操作系统之一。除了开源和相比其他操作系统的许多优势外，Linux 还提供了强大的支持网络、简单的安装过程，以及比任何其他选项都更好的旧硬件兼容性。


  与市场上的其他操作系统（如 `Windows` 或 `Mac OS`）相比，Linux 有许多从长远来看会让你的生活变得容易许多优势。今天，我将 Linux 与
  `Windows`、`Mac OS` 和 `Chrome` 操作系统进行比较。我将从易用性、性能、安全性以及它们的价格方面对这些操作系统进行比较。


  ### Linux 是开源的


  Linux 有各种发行版，每种都有不同的目的。最大且最流行的是 `Ubuntu`、`Debian`、`Fedora`、`OpenSUSE` 和 `Arch Linux`。Linux
  的好处在于你可以根据需求选择发行版。例如，如果你喜欢视频游戏，你可以在 `Ubuntu` 上安装 `Steam` 并享受一些迄为止创建的最棒的游戏！一个发行版用于家庭，另一个用于商业——选择有很多。


  这些发行版中的某些被设计为在特定的硬件系统或目的运行。例如 `Fedora`，它旨在作为服务器操作系统。它们对驱动程序有不同的方法并以不同的方式支持每个设备。`Arch
  Linux` 是极简且轻量级的，而 `Ubuntu` 适用于配置较低的计算机。`Debian` 支持跨平台的服务器、桌面和类似设备。


  另一方面，Linux 作为服务器和客户端系统都非常棒。与要求你在设置时提交 `Microsoft` 账户的 `Windows` 不同，Linux 不需要那种要求。所有上述
  Linux 发行版都是开源的。这意味着每个人都可以访问源代码，并且可以由任何人修改。


  所有这些 Linux 发行版都是免费、开源的，并由志愿者社区开发。如果你感兴趣查看它是如何运作的以及是什么让它运行的，可以在互联网上找到每个发行版的源码。


  ### Linux 在你的机器上易于安装




  购买新电脑时，首先需要了解的是它是否带有用于安装操作系统的 CD/DVD 或 USB 驱动器。第二点，也是很多人会忘记的一点，是这个操作系统并不会预装任何 CD
  或 DVD。这意味着你需要某种方法让电脑从 USB 闪盘启动以安装操作系统。Linux 提供了实现这一点的最简单的方法之一。你可以从任何销售 Linux 的网站购买预先安装好操作系统的
  USB 闪盘。这个 USB 闪盘本质上是一张安装光盘，其中包含一个 Linux 安装程序，允许你将 Linux 安装到电脑的硬盘上。只要你能够访问互联网下载操作系统，安装过程就会简单又快速。


  ### Linux 快速且稳定


  当你考虑购买新电脑时，必须查看它的运行有多快。对于 Linux 也不例外，因为 Linux 既快速又稳定。Linux 之所以如此快速的原因是它拥有一个由林纳斯·托瓦兹（Linus
  Torvalds）设计的优化内核。内核包含了计算机运行所需的所有关键部分，如设备、驱动程序、内存设置和中断。内核处理的所有部分都决定了计算机的运行速度。如果你想看看一台新机器有多快，可以将其与
  Linus 内核进行比较。Linus 内核包含了针对大多数计算机的最优设置，这使得它非常稳定。这意味着如果你使用 Linux，你的电脑将运行飞快，而且不会像其他操作系统那样频繁崩溃。


  ### Linux 非常安全


  Linux 是安全且没有病毒的。Linux 使用完全虚拟化的文件系统，这在其他操作系统上是不可能实现的。这种文件系统使得即使你安装了相同的操作系统，无法访问另一个用户的文件内容。这意味着你无法在他们的操作系统上安装病毒并从他们的文件中窃取信息。你也可以访问自己的文件内容，而不会受到任何方式的影响或干扰。Linux
  不会将病毒或其他恶意软件带到你的电脑上，因此你的电脑将获得比大多数其他操作系统更好的保护。


  Linux 之所以安全，是因为任何人都可以查看源代码，从而验证操作系统在开发过程中可能出现的任何错误。此外，有如此不同的 Linux 发行版，你实际上可以找到完美符合你需求的版本。例如，如果你需要安全性的东西，很容易找到提供高水平安全性的发行版。


  对于许多人来说，安全不仅仅关乎免受病毒和恶意软件的侵害，因为人们通常往往比较粗心。许多人在公共交通工具上或他人使用信用卡支付的地方使用笔记本电脑。


  此外，Linux 对于想要保护隐私和安全的个人来说也是一个极佳的操作系统，因为它不需要用户披露可能用于追踪他们甚至侵犯其隐私的个人信息。另一方面，所有的 Linux
  发行版都能防止被黑客攻击，因此不太泄露可能用于追踪你甚至侵犯你隐私的个人信息。


  ### Linux 操作系统免费使用和更新


  这意味着用户可以随自己的意愿、在任何时候使用 Linux。像 Microsoft Windows 这样的其他操作系统并不是免费使用和更新的。每当用户尝试更新他们的操作系统时，他们必须支付数百美元。但使用
  Linux，完全不需要任何费用。这意味着用户可以在他们需要的任何时候使用 Linux，并在需要时收到更新，这是意义重大的。


  Linux 延长了旧电脑硬件的寿命。许多用户拥有的电脑已经落满了灰尘。但通过 Linux，用户使用旧电脑的时间可以比使用 Microsoft Windows 操作系统长得得多。这是一个巨大的优势，因为很多电脑用户并不喜欢扔掉任何东西。他们让旧电脑一直运行，直到好到可以把它们处理掉（卖掉或丢掉）为止。但有了
  Linux，就不有这种需要了。


  ### Linux 为独立开发者提供了机会


  Linux 为自雇开发者提供了机会，因为它是一个免费提供的、开源操作系统，运行在大多数电脑上。Linux 根据 GNU 通用公共许可证（GNU General
  Public License）的条款免费使用和创建。该软件不需要开发者或平台用户支付任何费用或版税。此外，该操作系统为网络功能提供了强有力的支持。


  ### 更低的硬件要求


  Linux 变得如此受欢迎的最原因之一是它对硬件的要求比其他操作系统少。这意味着使用 Linux 的人可以延长其旧电脑硬件的寿命，因为他们不需要升级一切。人们选择
  Linux 是因为这个原因，也因为它的稳定性和安全特性。


  ### Linux 适用于几乎任何设备


  Linux 优于其他操作系统以及人们选择 Linux 的另一个原因是，它几乎可以在任何设备上运行。你可以将 Linux 下载到你的台式电脑、笔记本电脑，也可以下载到手机或平板电脑上，以便随时随地访问。大多数人还放弃了市面手机，而在上面使用
  Linux，这比零售价购买要便宜得多。


  ### 对网络功能的强力支持


  Linux 为客户端和服务器系统等网络功能提供了强力支持。这是 Linux 的一个伟大特性。通过使用 `Samba`，Linux 用户可以毫无问题地将他们的操作系统连接到网络。他们还可以与其他
  Linux 电脑连接并共享文件。如果别人有安装了 Linux 的电脑并想通过 `Samba` 连接，他们将完全没有问题。


  ### Linux 在多任务方面非常强大


  Linux 的另一个伟大特性是，你可以同时在电脑上运行多个应用程序或程序。对于喜欢在浏览器中使用多个标签页或在屏幕上运行多个程序的人来说，这也是一个优势。Linux
  还具有结合移动和桌面工作环境的能力，这是在其他操作系统中很少见的内置优势。


  ### Linux 是不可破解的（Unbreakable）


  Unbreakable Linux 是一个更安全、加固的开源 Linux 版本。它包含在 Purism 笔记本电脑上，这些电脑在美国制造，尊重隐私，并带有硬件开关。


  通过硬件开关，当摄像头和麦克风被黑客攻击或感染恶意软件时，你可以关闭它们。通过像 Unbreakable Linux 这样的自由软件，你可以在不牺牲隐私或自由的情况下在线更安全。


  Unbreakable Linux 并不是为了云服务而构建。相反，它是作为 Windows 或 Mac OS 的独立操作系统构建的。它运行在笔记本电脑、台式电脑、服务器甚至嵌入式硬件上，如
  `BeagleBone Black`。


  综上所述，Linux 易于安装、快速稳定、安全、无病毒、为独立开发者提供机会、适用于几乎任何设备，并且价格亲民。这些 Linux 变得如此受欢迎的原因，正是它对许多人具有吸引力并与市场上的其他操作系统不可比拟的原因。




  Linux 是一个开源且免费的操作系统，让任何具备编程技能的人都可以修改和开发他们自己的操作系统。多年来，它已经演变得更加易于使用，并实现了多种功能，包括与服务器配合使用，而且极其可靠。


  ## 安装前选择 Linux 版本


  在这一章中我们应该提到的这一点是，Linux 有不同的发行版和版本。由于 Linux 是一个开源操作系统，多年来许多不同的程序员和开发者都在该系统上工作，添加了功能并对其进行了修改以改进系统。因此，你会发现有几种不同的
  Linux 发行版。这对你是有益的，因为你可以选择对你帮助最大的版本、拥有你最喜欢的功能的版本等等。在 Linux 系统中，你可以选择的一些版本和发行版包括：


  ### i) Souls

  第一种被称为 Souls。它发布于 2012 年，比其他版本更具现代感。虽然使用起来很愉快，但请记住它还比较年轻，这意味着还没有那么多社区仍致力于于它的维护。如果你遇到问题，可能需要自己解决。


  ### ii) Ubuntu

  这是分发最广泛的 Linux 版本，大多数获取 Linux 操作系统的人都会拥有这个版本。它受欢迎是因为使用方法简单，并且拥有大多数人在操作系统中寻找的大量功能。Ubuntu
  具有极高的定制性。它非常适合媒体和创意从业者，安装你选择的应用程序非常简单。然而，请记住，与其他某些 Linux 发行版相比，Ubuntu 对于移动设备并不是最好的。


  ### iii) Mint Cinnamon

  另一个选项是 Mint Cinnamon。这是一个基础 Linux 发行版。它的视觉效果通常是黑灰色，如果你想探索 Linux 但不想让应用程序占用计算机太多的空间，这是一个极佳的选择。你会发现它包含了许多你从
  Linux 中想要和需要的各种功能，但不要预期会有太多的额外功能。


  ### iv) Arch Linux

  这是大多数专业人士使用的发行版，因为它在定制化方面需要投入精力。要使用这个版本，你需要对 Linux 系统的运作原理有一定的了解。当你明确知道自己将用 Linux
  操作系统做什么，并且对自己的 Linux 能力有信心时，可以使用这个。


  ### v) Elementary OS

  这被认为是最具美学吸引力的 Linux 版本之一，但它也具有与 Mac OS 匹配的高功能性。通常，当你想要更改机器上的 Mac 或 Windows 操作系统时，会使用这个版本。


  ### vi) Chrome OS

  这个版本因其是 Linux 发行版中最稳定的而迅速闻名。它最初的设计与原始的 GNU/Linux 相似，但经过了重建和修改，以便与特定的 Google Apps
  优化运行。此外，它的运行速度很快，即使是某些经常占用大量磁盘空间的繁琐应用程序。这个版本在离线状态下运行更好，所以如果你一直连接互联网，它可能不是最佳选择。


  你可以选择你想要运行的 Linux 系统类型和版本，而且所有选项都是完全免费的！如你所见，有多个选项可供选择，作为使用者，选择最适合你需求和技能水平的版本至关重要。每一个都是很棒的，你能够找到小组来帮助你学习如何使用它们，理解与其相关的某些额外优势，并确保你能够最大限地发挥每个操作系统的潜能。因此，在这个阶段，最关键的选项仅仅是为你的机器选择哪一个。


  使用 Linux 操作系统并不一定难以理解或适应。这个操作系统偶尔会引起困惑，因为它看起来与我们习惯的 Mac OS 和 Windows 版本如此不相似。然而，它仅仅是另一个操作系统，一个运行良好且通常比其他操作系统更可靠的。一旦你确定了要使用的版本并熟悉了
  `Shell`，一切都是可能的！


  ## 安装 Linux


  通常，当你购买计算机时，已经安装好了一个操作系统。通常通常是 Microsoft Windows。此外，还有 Mac OS 机器。另一方面，购买以 Linux
  作为默认操作系统的 PC 是相当少见的现象。当你第一次启动新电脑时，你不知道它将引导到哪个操作系统。你主要关心的是计算机能启动并且你可以立即使用它。安装 Linux
  最简单的方法是让成为硬盘上唯一的操作系统。


  然而，当涉及到与其他操作系统共存时，情况会变得复杂一些。大多数人会告诉你，你可以在 Windows 旁安装 Linux，并且两者可以交替使用。我们并不否认这一点，只是你会在过程中遇到一两个小障碍。


  首先，Linux 通常通过 DVD 或 USB 闪盘分发。通常，这种发行版可以从发行版的官方网站免费下载，或者某些地方销售包含发行版的 Linux 安装 USB
  盘。


  其次，虽然寻找程序很容易，但挑战可能在于选择最适合你机器的发行版。如果你明确地询问搜索引擎“我应该选择哪种 Linux 发行版？”然后阅读网站回复的评论，你可能会感到困惑，并且可能无法获得你这种情况的正确答案。


  然而，我们建议你测试许多流行的发行版，看看哪一个最适合你。这个列表极具争议，对其他人来说无疑会有不同。尽管 Linux 社区尽一切努力为你提供最好的产品，但它们并不总是能获取计算机组件制造商的所有基本信息来为这些组件创建驱动程序，而且在少数情况下，选定的发行版只能与你的机器部分兼容。


  例如，对于未分类的网卡或新创建的显卡，可能不存在驱动程序来让它们正常工作。然而，Linux 的主要优势之一是你可以根据需要下载任意下载，并使用你喜欢的版本制作任意数量的
  `LiveDVD` 或 `LiveUSB` 媒介。


  所选择的分发方法取决于某些条件。考虑以下因素：


  - 你的 PC 是旧型号还是新型号？

  - 在处理器、`RAM`、显卡和硬盘等组件方面，你的 PC 是性能相当强大的机器还是不是？

  - 你对办公室的布局有偏好吗？（有多种桌面环境可用，包括 `Unity`、`KDE`、`Mate`、`LXD`、`XFC` 和 `Cinnamon`。）


  在处理非常老的机器时，人们会选择支持 32 位的发行版。对于现代计算机，64 位更佳。如果你的 PC 相当强大，你不会注意到轻量和深色桌面环境之间的差异。`KD`
  和 `Unity` 都具有比 `XFC` 或 `LXD` 使用更多资源的潜力。




  简而言之，发现哪种发行版最有效且理想的方法，是在考虑你的需求和使用的机器类型的情况下尝试所有的发行版。然而，对于新手，我们建议从以下发行版开始：


  - `Ubuntu` 的所有形式，如 `Mate`、`Budgе`、`XFC`、`KD` 等

  - `Linux Mint` 及其衍生版本，包括 `Cinnamon`、`Mate`、`XFC` 和 `KD` 等

  - `PCLinuxOS`

  - `Magеіa`

  - `Zorin`


  # 如何安装 Linux


  第 1 步：选择你想要 Linux 发行版。


  第 2 步：开始下载 `ISO` 镜像。


  第 3 步：下载完成后，镜像通常位于硬盘的“下载”目录中。


  第 4 步：将 Linux 写入 USB 闪盘或 DVD。


  根据所选择的位数（32 位或 64 位），网上可以找到多种免费工具用于制作 USB 启动盘或 DVD。例如，`UnеBootIn` 可能适用于 32 位电脑，而
  `Rufus` 适用于 64 位发行版。


  第 5 步：你需要刻录 `ISO` 镜像并在 USB 密钥上安装所需的发行版。


  第 6 步：一旦 USB 闪盘或 DVD 准备就绪，你就可以提示 PC 开始安装程序。


  在旧电脑上，这通过更改 `bios` 设置来实现；在较新的 PC 系统上，通过在电脑启动时立即按下任何键盘键来实现。


  # 安装 Linux 非常简单


  一旦你进入发行版的界面，你将看到一个用于在硬盘上执行 Linux 安装的图标。在安装之前，你应该意识到，在整个硬盘上安装 Linux **将会破坏 DISK 上的所有数据**。因此，请确保你的机器已专门用于
  Linux 安装，或者你已经对你的驱动器创建了完整的备份。


  幸运的是，所有发行版的安装方法都是相同的。唯一的例外是 `Linux Mint`，它要求你在安装之前擦化驱动器。


  `Virtual Box` 是一个最初由太阳微系统公司开发的虚拟机，现在由甲骨文公司所有。它模拟了一台独立电脑，每台虚拟机都有自己的一套程序、操作系统以及一系列功能。`VirtualBox`
  是在 Windows 或 Mac OS 机器上尝试其他操作系统（在本例中为 Linux）的优秀工具。


  通过这种方式使用 Linux，你避免了对现有系统进行永久性更改。我们将检查如何在 Windows 和 Mac 上安装 `VirtualBox`。


  ### Windows


  - 导航到 `VirtualBox` 下载页面并选择最新版本。

  - 在下一页，找到并下载扩展名为 `.exe` 的文件。

  - 记住你将它存储在计算机的位置。

  - 一旦下载了安装程序，双击 `.exe` 文件并按照屏幕上的指示将其安装到 Windows 上——注意，由于安装了虚拟网络适配器，在安装过程中你可能会短暂失去网络连接。

  - 现在重启你的电脑，`VirtualBox` 应该出现在你的应用程序中。然后你可以运行它并安装你选择的任何其他操作系统。


  ### Apple 的 Mac OS


  - 导航到 `VirtualBox` 下载页面并下载最新版本的 Mac 应用程序。

  - 将 `.dmg` 文件保存到容易记忆的位置——注意获取 `OS X` 主机版本。

  - 使用可执行文件定位并安装该文件。

  - 重启电脑，你就可以使用 `VirtualBox` 了。


  ## 使用 VirtualBox 镜像安装 Linux


  ### Windows


  在你按照上述说明在电脑上安装 `VirtualBox` 后，你需要下载 `Ubuntu` Linux 磁盘镜像。


  - 首先，如果你的电脑上尚未安装 `BitTorrent` 客户端，请立即安装——`BitTorrent` 是一种点对点 (P2P) 工具，允许从其他用户下载，极大减轻了
  `Ubuntu` 服务器的压力。

  - 现在，导航到 `Ubuntu` 发布页面并下载最新的发布版本。**不要**点击任何桌面 CD 链接。在页面底部，你会看到完整的链接列表；务必点击带有 `.iso.torrent`
  扩展的文件。将其保存在你会记得的地方。

  - 现在，将该文件夹的内容传输到可启动 USB 驱动器。


  这里有一个警告——如果你安装了 `WinRAR`，它会立即与你下载的文件关联，并提示你使用 `WinRAR` 提取内容。


  免责声明：不要使用 `WINRAR` 或提取 `iso`。


  ## 为你的 Linux 系统创建网络连接


  如果你想将你的 Linux 机器连接到网络，必须使用协议，例如安全 Shell。`SSH` 是最网络协议之一的缩写。`SSH` 的目标是让你能够安全地连接到网络上的远程机器。


  将你的 Linux 机器连接到网络，请遵循以下步骤：


  - Windows——利用 `PuTTY`。

  - Mac 和 Linux 用户应使用 `SSH` 命令行实用。


  ### Windows


  - 转到浏览器的下载部分并下载 `PuTTY`。

  - 启动 `PuTTY` 并在相应字段中输入 IP 地址或主机名。

  - 如果未指定端口号，使用默认值 `22`。

  - 选择 `Data`，然后选择 `Auto-Login User name`——输入你的用户名。

  - 要保存会话，在 `Saved Sessions` 框中输入名称，然后点击 `Save`。以后你可以通过双击保存会话来加入。

  - 点击 `Open` 连接。当你首次连接服务器时，`PuTTY` 会询问是否缓存主机密钥——选择 `Yes`。


  ### Mac 和 Linux


  Linux 和 Mac 都提供了 `SSH` 客户端。要访问它，在终端中使用：


  - Macintosh——`Applications` 目录

  - Linux——打开终端 (Terminal)


  启动终端后，使用 `ssh` 命令建立连接。请记住指令是区分大小写的；因此，仅使用小写。输入 `ssh` 后跟 Linux 服务器的用户名。


  当你首次连接服务器时，你必须验证主机密钥。要继续连接，输入 `yes` 然后点击 `Enter`。建立连接后，输入你的密码。


  要终止连接，输入 `exit` 或 `logout`。


  ## 第四章：Linux Shell 与 Linux 中的脚本


  Shell 是一个用于与 Linux 系统交互的程序。Shell 允许你执行诸如遍历文件系统、运行命令或对系统进行修改的任务。




  Linux 提供了许多 Shell，包括 `bash`、`ksh`、`tcsh`、`zsh` 和 `sh`。虽然每个 Shell 都有独特的特性，但重要的是记住它们都遵循相同的脚本基本结构。例如：变量、源文件以及适用于任何
  Shell 的语法。因此，当你开始编写脚本时，将轻松地编写脚本而无需重新学习语法。


  ### Linux 界面


  你所使用的 Shell 类型取决于你会在电脑上安装的 Linux 版本。许多 Linux 版本都提供了这些软件，以便你可以在操作系统中导航。关于 CLI（命令行用户界面），美好的一点在于，你可以编写想要运行的代码和其他功能，而不仅仅是点击。


  你所处理的 Shell 类型有时会根据你使用的 Linux 版本而变化。有两种 Linux 版本：桌面版（Desktop）和服务器版（Server），它们的工作方式略有不同。服务器版本是精简版的
  Linux 系统，而桌面版将为你提供 GUI 以及其他你所需的特性。通常情况下，桌面版是最佳选择，因为由于 Linux 是一个命令处理器，可以用于与文本命令行进行交互，它为管理计算机、脚本和程序提供了强大的功能，例如通过作业控制、图形用户界面菜单、保存和加载文本文件，以及隐式变量。


  提示符改变了你与系统交互的方式。当你进入不同的目录、运行命令或编译程序时，这些信息将在命令行中显示。在本章中，我们还将讨论提示符如何工作以及如何根据你的需求对其进行自定义。


  ### Lisa Linux Shell 和脚本概念


  在继续之前，让我向你介绍一些基础 Linux Shell 和脚本概念。我喜欢将这些称为成功的“配方”（recipes）。以下是帮助你使用 Linux 脚本的一组配方定义：


  第一个配方是 `PATH`。在计算机术语中，`PATH` 代表搜索路径。每当你在 Linux 中运行命令时，它都会沿着 `PATH` 进行搜索。


  ### 脚本


  在学习脚本之前，让我们简单了解一下。脚本是一个告诉计算机在特定间隔执行什么操作的程序。它是计算机运行的命令列表，可用于自动化任务、执行特定事件以及许多事情。你可以使用两种编程语言在
  Linux 中创建脚本：Shell 语言（称为 `bash`）或 `Python`（一种面向对象的脚本语言）。在这里将介绍如何使用 `bash` Shell 语言创建脚本。


  ### 如何创建脚本？


  首先，你需要在电脑上安装一个文本编辑器。你可以使用 `nano`、`vi` 和 `gedit` 等程序。如果你的电脑上已经安装了文本编辑器，太好了！你可以跳过这一步继续阅读。如果没有，你需要找到一个符合你要求的编辑器。我更喜欢
  `nano`，因为它非常简单易用。我只需按下键盘上的控制键，右键点击终端程序并点击“用 Nano 编辑”。这将打开一个空白编辑器窗口，我可以在其中开始编写脚本。


  第一步是创建启动脚本。你必须编写想要计算机运行的命令，设置运行它们的频率，并包含循环处理任何数据（如文件）的特定命令。这一步我决定了计算机何时运行某些命令，例如
  `ls -la`、`echo` 或 `wget`。你还可以设置你的脚本在电脑后台作为守护进程（daemon）运行。`sleep` 命令就用于此。你可以使用其他命令，但我习惯使用
  `sleep`，因为它简化了创建脚本时的操作。


  你还可以使用 `while` 语句在后台运行带有特定变量的系列命令。例如，你可以通过更改 `ls -la` 命令来对目录中的每个文件名运行命令：


  ```

  while [[ "$directory" != ''.'' && "$directory" != ''..'' ]] do ls -la "$directory"
  done

  ```


  这个 `while` 命令将对目录中的文件运行 `ls` 命令。


  ### Linux 脚本


  每个 Linux Shell 脚本实际上都是在你执行脚本时由 Shell 运行的一系列命令（称为 `bash` 脚本）。单个命令也可以写在一行，只要你用分号分隔每个命令即可（例如
  `echo "Hello World !"`）。每个 `if...then` 语句都是一个脚本命令，当你执行脚本时，`bash` Shell 会运行该命令。


  ### 脚本中的语句


  以下是 `bash` Shell 脚本中的一些基础语句：


  - `printenv`：列出所有已设置的 `bash` 环境变量。

  - `function functionName() { ... }`：定义一个你可以在脚本后后调用的函数。

  - `read`：从标准输入（STDIN）读取一行并将其赋值给变量 `"$1"`。这基本上是嵌入代码中的子程序，你还可以使用 `$2` 和 `$3` 等来赋值每一行的值。

  - `if [ "$1" = something ]; then`：测试变量是否等于某个值。如果相同，它将继续执行 `if` 语句内部的内容。

  - `fi`：结束 `if` 语句；否则你会得到无限循环。

  - `while`：循环执行一系列命令直到满足特定条件。例如，如果你想对目录中的所有文件运行命令，将 `ls -la` 命令更改为：`while [[ "$directory"
  != ''.'' && "$directory" != ''..'' ]] do ls -la "$directory" done`

  - `export VARIABENAME=value` 或直接使用 `VARIABENAME=value`：让你定义脚本变量。这就像为某些值设置占位符。但是，你必须在其他操作之前定义变量。语法是
  `export VARIABENAME=value`；注意变量名全大写，且单词之间没有空格，因为这两个特性都非常重要。以 `export DIRECTORY=`
  为例，你会定义一个名为 `directory` 的变量并将其值设为空字符串（即 `""`），然后像这样赋值脚本：


  ```bash

  $export DIRECTORY=""

  ```


  现在当你执行脚本时，它将从 STDIN 读取一行并赋值给你的变量 `"directory"`。

  - `return [value]`：结束函数或子程序。它将停止 `bash` Shell 并输出随之传递的内容。


  ### Linux 脚本输出


  Linux 脚本的输出非常简单。只需在你的命令前输入 `echo`，它就会打印你告诉它的任何内容。例如，如果你想在脚本中打印当前目录，你可以这样输入：


  ```bash

  echo "Current Directory: $PWD"

  ```




  你也可以在 `echo` 语句内部使用变量。例如，如果你想设置名为 `something` 的变量值并同时将其作为输出打印出来，你可以输入：`echo "Something
  is $something"`（确保 `$something` 和 “Something is” 之间有一个空格）。这样做将打印出变量 `something`
  中的内容（即 `my_hard_disk`）。


  ## 在 Linux 中跟踪脚本


  有几种方法可以跟踪你的脚本。最简单的方法是直接从命令行运行脚本。输入 `cat file`，它将列出名为 `file` 的文件的内容。这对于调试脚本和识别脚本中的错误非常有用。一种更好的方法是使用
  `bash` 内置调试器。你可以在 `\bash` 找到它，并且在运行程序之前，必须在脚本的每一行之后输入 `set -x`，这样它才会真正为你执行。要做到这一点，只需在执行程序之前，在控制台提示符处输入
  `set -x` 即可。


  ### 示例：


  ```bash

  #!/bin/bash set -x directory=""" while [ "$directory" != ''.'' && "$directory" !=
  ''..'' ] do ls -la "$directory" done echo "Current Directory: $PWD"

  ```


  执行此脚本将输出类似以下的内容：


  ```bash

  -bash-3.00$ /home/John/testfile.sh

  -bash-3.01$

  ```


  换句话说，跟踪脚本会显示你在每一步中执行的每一个命令。你可以用它来跟踪长脚本或在脚本中查找某些命令（例如 `ls -la`）。如果你想获取你使用的所有参数及其值的列表，那么在脚本中使用
  `set -x` 也会很有帮助。


  值得注意的是，在 Linux 中，最好将代码放在单独的脚本文件中，或者创建一个新目录并将你的 `bash` 脚本放在其中。如果你不这样做，当你从命令行运行它们时，它们将无法正常执行。这是因为
  `bash` 是按行执行的。如果你不创建一个目录来执行你的代码，每一行都将像独立的命令一样被执行。


  ## Linux Shell


  可以通过通过在提示符处输入其名称或将其放置在适当的文件中将脚本或程序提供给 Shell。Shell 可以解释命令并将其存储在特殊文件中以便日后调回。只有在 Shell
  需要它时命令才会执行，这简化了重复命令。某些较新的 Shell 变体使用名为 `KornShell` 的不同文件格式。


  某些软件（如某些版本的 `Emacs` 和 `vi`）允许用户将系统中编写的命令与其他系统中编写的命令混合使用。UNIX Shell 源于更早的 `Bourne
  shell`，后者最初用于数字设备公司的计算机（DEC PDP-11s）。`Bourne shell` 于 1979 年引入，并在 90 90 年初移植到 Linux。UNIX
  Shell 使用命令行界面，要求用户通过键盘输入命令来与计算机交互。大多数 UNIX 命令由一个动词和一个对象组成，可以在前面加上修饰符，例如管道或从系统中的其他文件或程序导入/重定向。这些组合由对应特定操作的关键字表示（例如
  `Mv`、`cp`、`vi`）。


  Linux Shell 比 `Bourne shell` 更强大，因为它提供了更快的操作系统访问速度和额外的强大功能。1974 年，贝尔实验室的 Dennis
  Ritchie 出版了一篇名为《过程化语言》的文章，他在文中描述了后来广为人知的 `C shell`，这是一种编程语言，后后被包含在所有版本的 UNIX 中。几年后，`C
  shell` 发展成为带有命令提示符的完整编程语言。这种新语言被称为 `Korn Shell` 或简称 `ksh`，是为了支持贝尔实验室的 UNIX 而开发的。`ksh`
  程序现在是 GNU 项目的一部分，如今在贝尔实验室之外的 UNIX 版本中仍被广泛使用。Linux 版本的 `ksh` 程序于 1991 年出现，并从 1997
  年开始包含在 Linux 发行版中。这种版本的 Shell 被称为 `Bourne-Again Shell` 或 `BASH` shell，命名是因为遵循了原始的
  `Bourne shell`。


  `BASH` 的原始创建者是自由软件基金会的 Brian Fox。1991 年，他向公众发布了他的 shell，被许多 Linux 用户认为是其最大的贡献者之一。用户可以修改为
  Bash 编写的脚本中的值、变量和其他方面，大多数脚本也与 Korn 兼容。


  某些 Unix 类操作系统（如 Linux 和 Mac OS X）将 `bash` shell 作为登录 shell。原始的 `BASH` 使用 `Bourne
  Again Shell`（或 `Bourne shell`）作为底层命令语言。其他一些 Shell——例如 `tcsh`——也使用这种命令语言，尽管由于这些 Shell
  采用了 C-shell 语法，它们现在已经过时了。


  ### Linux Shell 的变体


  最流行的 Shell 变体之一用于 Linux。第一个是 `ksh`，代表 `Korn Shell`。后一个是 `ksh` 的增强版本，还有 `tcsh`，它代表
  `C Shell`，是对对原始 `Bourne Shell` 的新尝试。


  `bash` shell 自 1991 年首次出现以来已用于许多用途。它曾被用作脚本语言，也曾用于运行应用程序。这最流行的原因是它可以作为系统的接口，允许用户修改脚本中的值，并使用命令行工具创建新脚本。


  Bash 和 `ksh` 之间的主要区别是脚本语言的语法。Bash 不使用 C shell 语法，而 `ksh` 在语法上非常接近 `tcsh` shell，而后者是
  C shell 的派生版本。


  ### Bash


  运行 `bash` shell 是启动和使用 shell 程序的地方，可以用于运行单个命令或进行交互操作。命令行解释器（如 `Bash`）可以从许多不同的目录运行。它搜索
  Bash 的默认位置是 `/bin/bash`（当此文件不存在时，它将搜索 `/bin/sh`、`/bin/csh` 和 `/bin/ksh`）。Bash shell
  不要与 `Bourne shell` 混淆，后者是完全不同的东西。


  ### Korn


  `ksh` 命令是一种快速且强大的命令语言解释器，用于 shell 中运行命令或命令序列，然后这些命令被存储在文件中供操作系统使用。它还可以作为接口，从文件中读取并执行命令。它还是一个交互式
  shell，这意味着它可以在连接到终端的同时接受并执行来自键盘的命令。Korn shell 是为贝尔实验室的 UNIX 开发的，尽管它现在随 GNU 软件发行。


  ### C Shell (tcsh)


  C shell 通常称为 `tcsh`，是基于 BSD Unix 的原始 C 语言解释器开发的。它包含了使其比其他 UNIX shell 更像原始 C 语言的功能。它可以作为交互式
  shell，也可以作为编程语言来创建用于命令解释器的脚本。它具有额外的功能，如参数化搜索、从文件执行命令的能力以及数组变量。它的语法与 C 语言相似。


  ### Bourne Again Shell (bash)


  Bourne Again Shell 或 `bash` 是 `ksh` 的增强版本。该 shell 包含与其他 shell 类似的相似的功能，并改进了 `ksh`
  的类 C 语法。它是为 Bourne shell 设计的，但可以作为 GNU 项目的一部分作为其合法的替代品。


  以下是 Unix shell 中常用的命令。这些是一些基础的 shell 命令：


  - `cp`: 复制文件并可选地重命名副本。

  - `mv`: 移动或重命名文件。如果配合 `-t` 使用，则源文件将被重命名。





  ## 常用命令


  - `ln`: 创建文件的链接，这些链接类似于指向其他对象（通常是文件）的别名。链接的作用是在原始文件不可用时作为文件的别名。在 Bash 和其他现代 shell
  中，它默认创建硬链接；设置 `-s` 则创建符号链接（软链接）。

  - `rm`: 删除文件。如果该文件是一个目录，它将递归地删除。正如你可以想象的，当此命令使用不当时，它是危险的。如果你不小心，很容易无意删除关键文件。

  - `mv`: 重命名文件或将它们移动到目录树中的新位置，前提是你拥有相应的权限。`mv` 通常与 `cd` 和 `ls` 配合使用，用于当你需要快速高效地重命名多个文件时。

  - `ls`: 列出所选区域中可以找到的所有内容。此命令产生的输出可能非常详细，取决于你使用了哪些标志位。

  - `pine`: 一种用于 Unix 系统的流行电子邮件应用程序。它实际上是多个应用程序的集合，用于发送或接收邮件、管理邮箱以及阅读新闻组。`pine` 应用程序在
  Unix shell 环境的单个程序中包含了所有这些工具，这是它的主要优势。


  ## 第五章：使用 Linux 命令行


  Linux 是一种计算机操作系统，允许用户控制自己的计算机。与微软 Windows 和苹果的 Mac OS 不同，Linux 为那些想要对自己的计算体验拥有更多控制权并完全避免支付许可费用的用户提供了一种替代方案。


  作为一名 Linux 用户，你需要学习一些基础知识以充分发挥它的潜力。由于缺乏图形用户界面，Linux 并不是最易使用的操作系统，因此你将学习命令行以发挥其最大价值。


  首先，什么是命令行（Command Line Interface 的缩写 CLI）？“命令行”一词指的是计算机用户和开发者使用的一系列命令。这些命令组专门用于
  UNIX 和 Linux 操作系统。


  对于初学者来说，命令行界面是令人畏畏、困惑的，而且他们计算机操作系统的很大一部分。但别担心！我将为你提供一份分步指南，帮助你开始 Linux 上的命令行体验。


  以下是你需要了解的一些命令行基础知识的简单大纲。每个 Linux 系统都有自己的命令行，尽管来自一个 Linux 系统的命令可以在另一个系统上通过很少或不进行更改即可使用。如果你在
  Windows 操作系统下运行 Linux，建议你先学习如何使用命令行。这样如果出现问题，你可以获得一个更具可控的环境。


  基础 Linux 命令是对大小敏感的，这意味着字符的大小写非常重要。例如，在 Linux 中，名为 "hello" 的文件与名为 "Hello" 的文件不同。为了避免这种情况，几乎所有的命令都可以后跟一个名为
  `-lowercase` 的选项，以便它们都变为小写字母。


  为了使用命令行界面，你需要在在使用之前让计算机上的命令行运行。要做到这一点，请打开终端窗口并输入 `startx`。这将加载 X Window 系统，为你提供图形用户界面（GUI）。


  一个典型的 Linux 系统由数百个不同的命令组成，每个命令执行不同的不同的任务。它们被列在分为主题或类别的目录中。你可以通过输入 `ls` 命令（list 的缩写）随时查看你
  Linux 系统中的文件目录。以下是目录中最一些常用的 Linux 命令列表。


  ### Linux 中使用的命令行类型


  #### which : 命令行

  `which`: 此命令查找文件并显示完整路径名。例如，如果你输入 `which ls`，它将显示 `ls -l`。`-c` 选项告诉它以易读的格式在终端窗口中列出这些路径，类似于
  DOS 命令 `dir` 的工作方式。


  #### cd : 命令行

  `cd`: 此命令允许你更改目录。例如，输入 `cd /home/jack` 将将你的当前目录更改为 `/home/jack`。然后你可以通过输入 `cd username`
  进入新目录，即用户名文件夹所在的位置。


  #### cp : 命令行

  `cp`: 将文件从一个目录复制到另一个目录。然而，复制将与原始文件具有相同的名称。它基本上是在相同目录中创建一个文件的副本，但使用不同的扩展名。


  #### cp-i : 命令行

  `cp -i`: 将所有文件和文件夹复制到目标目录，包括它们的内容。`-i` 选项告诉它复制所有文件和文件夹及其内容。


  #### cd .. : 命令行

  `cd ..`: 这本质上带你进入目录树层次结构的上一级（从 `/home/jack` 到 `/home/jack/username`）。或者你也可以直接输入
  `cd ..` 向上移动一级到层次结构（从 `/home/jack` 到 `/home/jack`）。


  #### mv: 命令行

  `mv`: 用于将文件从一个区域移动到另一个区域。`-i` 选项告诉它复制目标目录中所有文件和文件夹的内容。`-r` 选项告诉它不要覆盖任何现有文件。


  #### less : 命令行

  `less`: 此命令用于以更具可读性的格式查看文本文件（如 README 文件）。默认，，less` 将你的光标置于文本文件的最后一行。要浏览文本文件，你可以使用键盘上的方向键。例如，要向上移动一行，你需要按上方向键。如果你不知道对于特定任务应该使用什么命令，输入
  `less filename` 将在终端窗口中显示 `filename` 的内容。如果你遇到不认识的扩展名的文件，这非常有用。


  #### more: 命令行

  `more`: 此命令一次显示一个屏幕。要滚动查看你正在查看的文本，输入 `< 回到上一行，然后按 `>` 到下一行。


  #### rm: 命令行

  `rm`: 此命令从你的 Linux 系统中删除文件或文件夹。如果你不知道输入什么来删除文件，输入 `rm filename` 将以更易于理解的格式显示你需要的信息。`-i`
  选项告诉它删除所有文件和文件夹及其内容。


  #### mkdir: 命令行

  `mkdir`: 此命令创建一个文件夹，除非该目录已存在。`-i` 选项告诉它创建所有文件夹及其内容。要删除文件夹，你应该使用 `rm` 命令。


  上述只是为了让你的 Linux 系统高效有效地运行而需要了解的许多命令中的一部分。如果你是初学者，上述命令已经足够让你上手了！


  ## 结论


  Linux OS 是世界上最受欢迎的操作系统之一，有非常充分的理由。Linux 是开源的，这意味着任何人都可以使用和修改它，而无需支付一分钱。它几乎不受受网络安全威胁的影响，而且由于它不是像苹果或微软那公司，系统中几乎没有任何广告。


  然而，与 Windows 对应品相比，Linux 在普通大众中并不流行。通常，最大的原因是它需要一定的熟悉程度才能及时投入运行。在不到小时内从零开始设置 Windows
  PC 并不困难，但取决于你的技能水平，让 Linux 运行可能需要几天或几周。





  Linux 操作系统稳定且可靠。它不会像 Windows 有时那样崩溃。Linux 也不会像 Windows 那样随着时间的推移而变慢（Windows 这会导致软件运行得越来越慢）。在过去，Linux
  很难安装和使用，但得益于 `Red Hat` 等公司，用户可以购买预先定制的 Linux 版本，其中已经安装了各种应用程序，让你开箱即用。


  Linux 是一个提供了许多其他操作系统无法比拟的功能操作系统。它拥有先进的用户界面、更多的可用编程语言（`Forth`、`Perl`、`Ruby`、`PHP`、`Python`），并且是免费的。Linux
  在 IT 领域拥有大量的追随者。Linux 还是开源软件。它允许任何人修改源代码并分发他们的更改。这使你能够安装在互联网上可以下载的任何类型的程序。Linux
  最受欢迎的应用程序包括 `Firefox`、`Evolution` 和 `OpenOffice.org`。


  Linux 有许多发行版，它们都基于于一个名为 `GNU` 操作系统的公共内核，该内核由 `Free Software Foundation` 维护。你可以选择
  `Debian`（德国）、`Red Hat`（美国）、`Ubuntu`（英国）和 `Fedora`（意大利）。每个发行版命名的项目也让我们对它们的国家认同和理想有了了解，例如
  `Ubuntu`，它在祖鲁语中意思是“对他人的仁”。


  Linux 可以免费下载，但使用并不是免费的。它和其他任何其他计算机操作系统一样。你必须购买许可证才能使用该软件。目前，Linux 正在经历大量的开发，并且每几个月就会发布新版本。因此，如果你正在寻找稳定的系统，选择桌面
  Linux 不会出错的。

