  md: "# # Install Apps via the Terminal – Part 2\n\nMost of the time you'll get to\
    \ install apps from the Terminal using the standard aptget command. However, sometimes\
    \ an app demands a little more work. This means installing an app from its source\
    \ code, which isn't as scary as it first sounds.\n\n# ## FROM THE SOURCE\n\nThe\
    \ commands you need to be familiar with here are Configure, Make and Install.\
    \ You'll find a lot of apps using from source, so it's certainly a worth investing\
    \ time in.\n\nSource code files for Linux usually come in the form .TAR.gz or\
    \ .TAR.BZ. Both compressed files holding all the code files needed to `make` the\
    \ app. Start off this tutorial by creating a new folder in Home: `mkdir vim`.\n\
    \nwget command retrieves content from the internet, in the BZ2 file for Vim. According\
    \ to Mint's file system colour, the compressed file should be displayed in red.\n\
    \n# ### STEP 1\n\n```\nFile Edit View Search Terminal Help\ndaviddavid-mint ~\
    \ $ mkdir vim\ndaviddavid-mint ~ $ \n```\n\n![](img/9eddebb0cf792a0bbe16478be74a68e1_51_0.png)\n\
    \n# ### STEP 2\n\nVim, by the way, is an advanced text editor which we'll use\
    \ as an example to install. Enter the folder, cd Vim, and then within the new\
    \ Vim folder, enter the following command into the Terminal: `wget ftp://ftp.vim.org/pub/vim/unix/vim-7.tar.bz2`\n\
    \nWe need to uncompress the contents of the file now so: type `tar -xf vim-7.tar.bz2`\
    \ and press the Tab key to auto-fill the remaining name.\n\n```\nFile Edit View\
    \ Search Terminal Help\ndaviddavid-mint ~ $ tar -xf vim-7.tar.bz2\ndaviddavid-mint\
