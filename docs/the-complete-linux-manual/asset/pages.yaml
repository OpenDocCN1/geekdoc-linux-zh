  md: "# # User Interaction\n\nThere's nothing quite as satisfying as creating a program\
    \ that responds to you. This basic user interaction is one of the most taught\
    \ aspects of any language and with it you're ready to do much more than simply\
    \ greet the user by name.\n\n# ## HELLO, DAVE\n\nYou have already used cout, the\
    \ standard output stream, throughout our code. Now you're going to be using cin,\
    \ the standard input stream, to prompt a user response.\n\n+   Anything that you\
    \ want the user to input into the system memory needs to be stored somewhere in\
    \ it. Therefore, any input must be declared as a variable, so it's ready to be\
    \ used by the user. Start by creating a C++ file with headers.\n\n+   The cin\
    \ command works in the opposite way from the cout command. With the first cout\
    \ line 'what is your age?' to the screen, as indicated with the chevrons. Cin\
    \ uses opposite facing chevrons, indicating an input. The input is put into the\
    \ integer variable and again in the second command. Build and run the code.\n\n\
    ```\nuserinteraction.cpp\n#include <iostream>\nusing namespace std;\n\nint main()\
    \ {\n    int age;\n    cout << \"What is your age: \";\n    cin >> age;\n\n  \
    \  cout << \"You are \" << age << \" years old.\\\\n\";\n}}\n```\n\n| File Edit\
    \ Tabs Help |\n| what is your age: 45 |\n| You are 45 years old. |\n\n> (program\
