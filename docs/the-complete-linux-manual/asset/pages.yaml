    At the Rufus interface you will find confusing but don''t worry, it''s quite simple.
    To begin with, click the SELECT button next to the ''Disk or ISO Image'' select-down.
    This launches a Windows window where you can choose and select the Linux ISO.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_20_4.png)


    STEP 6

    The ISO is now transferred to the USB flash drive. The process shouldn''t take
