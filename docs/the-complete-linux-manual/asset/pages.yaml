  md: '# Creating a Linux Installer on Windows


    # USB BOOTABLE MEDIA


    USB media is faster than a DVD and even more convenient, most modern PCs don''t
    have an optical drive installed. The process of transferring the image is easy
    just by using a third-party app and USB flash drive of 4GB or more.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_20_0.png)


    STEP 1

    Open up a web browser and go to rufus.ie. Scroll down the page and you will come
    to a Download heading for the latest version of Rufus. Click the link to start
    the download.


    When you''re ready, click on the Start button at the bottom of the Rufus window.
    This may open another dialog box asking you to use new version of SysLinux. SysLinux
    is one of best boot loaders, to allow your modern PC to access and boot from a
    USB flash drive. It is necessary, so if asked then click ''continue''.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_20_1.png)


    This image uses SysLinux 6.03/20152 which also includes the installations for
    SysLinux 6.03/2014-06.

    As new versions of SysLinux are compatible with one another, you don''t need to
    search for the old version of Rufus for it. If you need additional own files,
    they must be downloaded from ''Idlinux''s'' and ''Syslinux'':

    Select ''Next'' to continue


    Note: The files will be downloaded in the current directory and will be reassembled
    if necessary.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_20_2.png)


    STEP 2

    Downloaded the Rufus executable and select Yes to the Windows system question
    and Yes to checking for updates. With Rufus launched, you have already identified
    your inserted USB flash drive; if not, remove and restart.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_20_3.png)


    The next steps ask which mode you want the Linux ISO to boot from. In both methods
    work for different situations but generally, the recommended ISO Image Mode is
    the more popular. Make sure you select this and click OK to continue, followed
    by OK to confirm the action


    The image you selected is ''ISOHybrid'' image. This means it can be written to
    ISO image (file mode) or DD image (image mode). Rufus remembers the last mode
    used, so that you will have access to the drive after writing.

    If you encounter errors during booting, you can try writing this image in DD mode
    instead.


    +   - Write in ISO Mode (Recommended)

