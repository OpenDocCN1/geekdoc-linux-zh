  md: '# # Installing a Virtual Environment


    A Virtual Environment is a simulated computer system. Using a Virtual Machine,
    you can mimic a standard PC and install another operating system on it without
    affecting the one installed on your computer. It''s a great way to test and use
    Linux, while still having Windows 10 as your main OS.


    # GOING VIRTUAL


    Using a Virtual Machine (VM) takes resources from your: memory, hard drive space,
    processor usage and so on. Make sure you have enough of each commencing.


    +   **STEP 1** We''re using VirtualBox in this instance, as it''s one of the easiest
    virtual environments to get grips with. Enter virtualbox.org and click on ''Download
    VirtualBox''. This takes you to the main download page. Locate the correct host
    for your system: Windows, Mac or Linux, Host being the installed operating system,
    and click the link to begin the download.


    +   **STEP 3** With the correct packages downloaded, and before you install them,
    you need to make sure the computer you''re using is able to host a VM. Reboot
    the computer and enter the BIOS. When the computer starts up, press F2 or F1 which
    is necessary to Enter Setup.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_23_0.png)


    +   **STEP 2** Next, while still at the VirtualBox download page, locate the VirtualBox
    Extension Pack. The Extension packs support USB devices as well as numerous extras
    that can help make the VM environment, even more like experience of a ''real''
    computer.


    +   **STEP 4** Each BIOS is laid out differently and it''s very difficult to assess
    where to look in each personal example. However, as a general rule of thumb, you''re
    looking for: Virtualisation, or simply Virtualisation, found within the Advanced
    section of the BIOS. When you''ve located it, Enable the settings, exit the BIOS
    and reboot the computer.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_23_1.png)


