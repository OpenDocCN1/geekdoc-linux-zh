  md: "# # Creating and Removing Directories\n\nSTEP 5 The command to create directories\
    \ is quite logical, directories within directories. However, if you want to create\
    \ a directory and all subdirectories in a single command make sure you're using\
    \ `mkdir -p Temp/finances`. Now `cd Temp/` and `ls` to list the new directory.\n\
    \nSTEP 8 Now that we've created some directories, let's see about removing them.\
    \ By start entering the directory and listing it: `cd testdir` then `ls`. The\
    \ previously created reports sub-directory is present. Now way to remove it is:\
    \ `rm -rf reports`, then `ls` to confirm it's not there.\n\n```\ndavid@david-mint\
    \ ~ -Temp\ndavid@david-mint $ mkdir -p Temp/finances\ndavid@david-mint $ cd Temp/finances\n\
    david@david-mint $ ls\n```\n\n```\nFile View Edit Search Help\ndavid@david-mint\
    \ ~ -testdir\ncd testdir\nmkdir reports\ndavid@david-mint $ rm -rf reports reports\n\
    david@david-mint ~ -testdir\n```\n\nSTEP 6 The -p option is what enables mkdir\
    \ to create the sub-directory as well as the parent directory. In Linux, commands\
    \ always follow the structure: Command, Option, and Argument. In the previous\
    \ example, command (mkdir), option (-p), and argument (Temp/finances).\n\nSTEP\
    \ 9 A quick warning: removing a directory in the Terminal doesn't place it in\
    \ the Mint Rubbish Bin, via for any files, if you remove a directory from the\
    \ Terminal it's gone for good.\n\n```\nFile View View Search Help\ndavid@david-mint\
    \ $ mkdir -p p Temp/finances\n```\n\n![](img/9eddebb0cf792a0bbe16478be74a68e1_58_0.png)\n\
    \nSTEP 7 If you want to drill into the various options of mkdir, command `mkdir\
    \ --help` in the Terminal. This will provide a quick guide about the options and\
    \ how the command structure.\n\nSTEP 10 Rmdir will only remove empty directories,\
    \ to remove sub-directories, and even files, you'll need to use the rm command\
    \ with the -R option. For example, to delete the Test folder, use `rm -R Test`.\
