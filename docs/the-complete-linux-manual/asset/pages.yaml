    widgets that can be customised and placed on the desktop, others instead for a
    clean, sharp look to keep everything running as fast as possible. Let''s see what
    the Cinnamon desktop has to offer.


    # A TOUCH OF SPICE


    The Cinnamon desktop environment is a great deal of style and performance. There''s
    lots to love about it, which is why it''s a popular DE.


    +   **STEP 1** Begin exploring the Cinnamon desktop by double-clicking the Computer.
    This brings Nemo, the file manager used in Cinnamon. The Computer icon opens the
    root level file system, with access to the optical drive (if you have one installed),
    hard drive and core Linux file system.


    +   **STEP 3** Nemo has many different features, views and ways so that you can
    view and manipulate files and folders. For example, if you have images in the
    Pictures folder, you can select the icon level for the images by using the slider
    located in the bottom right of Nemo, labelled Adjust Zoom Level.


