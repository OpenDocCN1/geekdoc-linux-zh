  md: '# # Which Distro?


    Up to now we''ve looked mainly at Linux Mint but there are other Linux distributions
    out there to try. In truth there are hundreds of Linux distros to download and
    install, which one should you decide on use?


    # ## DISTRO HOPPING


    Distro hopping is a term used by the community for people who never stick to a
    single distribution. Instead, they hop from one to the other and back again, testing
    each until they move on to another or a newly released distro.


    There''s nothing wrong with distro hopping, as it''s a good way to grips with
    what''s out there and discover the elements of one distro over another that may
    not appeal to your tastes. The problem of which one should you use is up to you.


    For example, Linux Mint is an ideal starting place. It''s easy to install and
    use distro, has all the software you would normally use on a day-to-day basis
    already installed out-of-the-box and gently eases you into the unique world of
    Linux and how it works and performs.


    Ubuntu offers much the same experience but it does this in a slightly different
    way. There''s generally less perceived with Ubuntu than with Mint. Another point
    worth considering is the sheer volume of content and help available when Ubuntu
    users get stuck, you''re never too far from a solution to the problem.


    Moving on, as you begin to grow more confident with Linux, you may test the likes
    of Fedora or Debian. These are all excellent distros and each offer the user a
    different perspective on how the systems run. Some are more demanding, in terms
    of Linux skills, than others, but each has its own value and something to offer
    to the user.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_15_0.png)


    While distro hopping is a fun, it''s not exactly a stable way to enjoy Linux and
    get the best from it. We''re not saying you should stick to one and never look
    elsewhere, as you might be missing a lot of great content out there, but we recommend
    you find a home and slowly progress there based on your increasing Linux skills.


    You may find yourself moving to a particular distro because it offers something
    radically different from the one. Tails, for example, is a distro designed for
    total anonymity. It contains complex and military grade encryption tools as well
    as browsers that help you to browse the web without ever being detected, tracked
