  md: "# # Basics of the Terminal\n\nMost operating systems use two kinds of interface,\
    \ the GUI, which is the desktop that Windows, macOS and Linux Mint boot into the\
    \ command line. While modern operating systems shy away from the command line,\
    \ Mint uses the Terminal to give the user greater control of the system.\n\n##\
    \ TAKING COMMAND\nThe command line, or Terminal, is an extremely powerful interface.\
    \ Everything you can do on the desktop can be done within the Terminal. Let's\
    \ start by seeing how it works.\n\n+   **STEP 1** The Terminal can be accessed\
    \ by either clicking on the Terminal icon on the Panel, located between the Firefox\
    \ and Files icons or by opening the Menu and selecting It from the left-hand quick\
    \ launch strip.\n\n+   **STEP 3** What you currently see in the Terminal is your\
    \ login name followed by the name of the computer; as named it during setup when\
    \ you first installed Mint. The line ends with the folder name; at first this\
    \ is just a tilde ~, means your Home folder.\n\n![](img/9eddebb0cf792a0bbe16478be74a68e1_45_0.png)\n\
    \n+   **STEP 2** The Terminal gives you access to the Linux Mint Shell, Bash,\
    \ which gives you access to the underlying operating system. Everything in Mint,\
    \ including the desktop and GUI, is a module running from the command line.\n\n\
    +   **STEP 4** The flashing cursor at the very end of the line is where your text-based\
    \ commands are entered. You can begin to experiment with a simple command, Print\
    \ Working Directory (pwd), which outputs the current folder you're in to the screen.\
    \ Type pwd and press Enter.\n\n```\ndavid@david-mint ~ $ \ndavid@david-mint ~\
    \ $ pwd\n/home/david\ndavid@david-mint ~\n```"
  merge: -1
  pgno: 45
- img_proc: true
  md: "# Basics of the Terminal\n\nSTEP 5 All the commands you enter work in the same\
    \ manner: you enter the command, include any parameters to extend the use of the\
    \ command and press Enter to execute the command you've entered. Type into the\
    \ Terminal: username -a and press Enter. This displays system information regarding\
    \ Mint.\n\nSTEP 8 View and Search options let you alter the sizing of the Terminal\
    \ window and of course search within any particular key words.\n\n```\nFile Edit\
    \ View Search Terminal Help\ndavidd-mint - \ndavidd-david Q Find... Shift+Ctrl+F\n\
    davidd-mint - \ndavidd-david- Shift+Ctrl+F\nFind Next Shift+Ctrl+H\nFind Previous\
    \ Shift+Ctrl+H\n```\n\nSTEP 6 Before we start entering commands, let's take a\
    \ moment to see what menus the Terminal has to offer. The File menu allows you\
    \ to open a new Terminal, create a new profile, where you can alter the size,\
    \ colours and behaviour of the Terminal, add a new tab, and close all active sessions.\n\
    \nSTEP 9 The Terminal entry enters the profile editing and sizing allows you to\
    \ alter the character encoding. Interestingly, you can also set it to a Read Only\
    \ mode, which stops you from entering any commands into the Terminal This is good\
    \ for when you need to permanently display the terms.\n\n```\nFile Edit View Search\
    \ Terminal Help\ndavidd-mint - \nOpen Terminal Shift+Ctrl+N\nOpen Tab Shift+Ctrl+T\n\
    Open New Profile\nClose Terminal Shift+Ctrl+W\nClose All Terminals Shift+Ctrl+W\n\
    ```\n\n```\nFile Edit View Search Terminal Help\ndavidd-mint - \ndavidd-david\
    \ \nChange Profile\nCharacter Encoding\nRead Only\nReset\nReset and Clear\n1.\
    \ 80x24\n2. 102x43\n3. 128x43\n```\n\nSTEP 7 The Edit option lets you copy and\
    \ paste commands from and to the Terminal and other sources; help when you want\
    \ to copy a very long and complex command from a web page. It allows you to edit\
    \ color preferences.\n\nSTEP 10 Finally, the Help option displays the help contents\
