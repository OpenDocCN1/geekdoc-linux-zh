  md: "# # Creating Bash Scripts \\– Part 1\n\nEventually, as you advance with Linux\
    \ Mint, you will start creating your own automated tasks and programs. These are\
    \ essentially scripts, Bash Shell scripts to be exact, and they work in the same\
    \ way as a DOS Batch file, or by any other programming language.\n\n# ## GET SCRIPTING\n\
    \nA bash script is simply a series of commands that Mint will run through to complete\
    \ a certain task. They can be remarkably complex, it all depends on the situation.\n\
    \n+   - STEP 1 You'll be working within the Terminal and a text editor throughout\
    \ the coming pages. There are alternatives to the text editor, which we will look\
    \ at in a moment for the sake of ease, we'll be doing our examples in Xed. Before\
    \ you begin, however, run through the custom update: `sudo apt-get update sudo\
    \ apt-get upgrade`.\n\n+   - STEP 3 To begin with, and before you start to write\
    \ your scripts, you need to create a folder where you can put all your scripts\
    \ inside. Start with `mkdir scripts`, `cd scripts/`, and enter the folder `cd\
    \ scripts`. This will be our working folder and from here you can create sub-folders\
    \ if you want to of each script you create.\n\n```\ndaviddavid-mint $ sudo apt-get\
    \ update sudo apt-get upgrade\n(sudo) password for david: \nHit1: http://archive.ubuntu.com/launchpad/ubuntu-nocal\n\
    Hit2: http://archive.ubuntu.com/mirrors/ubuntu-nocal\nHit3: http://ppa.ubuntu.com/blender/ubuntu-nocal\n\
    Hit4: http://ppa.ubuntu.com/thomas-schies/ubuntu-nocal\nHit5: http://archive.ubuntu.com/ubuntu-nocal\
    \ main\nHit6: http://www.mirrors.service.org/sites/linux.mint\nHit7: http://archive.ubuntu.com/ubuntu-nocal-updates\n\
    Hit8: http://archive.ubuntu.com/ubuntu-nocal-security\nHit9: http://repository.spotify.com\
    \ stable InRelease\n```\n\n+   - STEP 2 There are several text editors we can\
    \ use to create a bash script: Xed, Vi, Nano, Vim, GNU Commands and so on. In\
    \ the end it comes down to personal preference. The use of Xed is purely for making\
    \ it easier to read the script in the screenshots you see.\n\n+   - STEP 4 Windows\
    \ will be aware that in order for a batch file to work, as it is executed and\
    \ follow the programming within, it needs to have a BAT file extension. Linux\
    \ is an extension-less operating system but the convention is to give scripts\
    \ a .sh extension.\n\n```\ndaviddavid-mint ~ mkdir scripts\ndaviddavid-mint ~\
    \ cd scripts/\ndaviddavid-mint ~ touch script2.sh script3.sh\ndaviddavid-mint\
