  md: '# Getting to Know Linux


    # Becoming Anonymous Online


    The digital age has led to many great advances in communications; however, it
    has also brought on a new age of spying and snooping. Most of us are strangers
    to the frequent news stories of governments, secret organisations and underground
    hackers breaking our privacy but how can you combat this?


    # ANONYMITY WITH MINT


    While it''s virtually impossible to become totally anonymous, you can take measures
    to ensure your privacy is at its best.


    +   - STEP 1 Starting with the basics, use HTTPS instead of the standard HTTP
    when browsing. This means anything that''s transmitted over HTTPS is secure (hence
    the S at the end) and encrypted.


    +   - STEP 3 Although using Google may seem the obvious choice for a modern Internet
    search, the company does track all searches made by an individual. Instead, consider
    an alternative search engine, such as DuckDuckGo, a search engine that doesn''t
    store personal data or track you.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_41_0.png)


    +   - STEP 2 When you''re browsing, consider the Incognito or Private browsing
    modes in a browser. This disables your web history and cache, allowing you to
    browse without the details stored for later scrutiny by someone else. However,
    it doesn''t stop any data or search tracking.


    +   - STEP 4 If you''re regularly on the Internet then consider enhancing your
    privacy by installing some of the browser plugins. For example, for Firefox, use
    Ghostery, NoScript and AdBlock Plus to block trackers, and other data mining techniques.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_41_1.png)


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_41_2.png)


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_41_3.png)'
