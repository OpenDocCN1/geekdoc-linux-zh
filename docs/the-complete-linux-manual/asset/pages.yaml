    \ directories as needed\n  --mode=MODE         set file mode (default: use umask)\n\
    \  -v, --verbose       show make target dirs\n  --setfile          set attributes\
    \ newly created directory\n  --context=CONTEXT   like -z if CONTEXT is specified\
    \ for the SELinux\n  --help              display help\n  --version           output\
    \ version information and exit\n```\n\n![](img/9eddebb0cf792a0bbe16478be74a68e1_58_1.png)\n\
    \nGNU coreutils help: http://www.gnu.org/software/coreutilsnFull list of options\
