  md: "# Variables\n\nSTEP 5 You can assign a value to a variable as soon as you declare\
    \ it. The code you've typed in today could look like\n\nSTEP 8 The previous steps\
    \ create variable StartLives, which is a global variable. In a game, for example\
    \ a player's lives go up or down depending on how well or bad they're doing. When\
    \ the player restarts the game, the StartLives returns to its default value: 3.\
    \ Here we have assigned 3 lives, subtracting lives left.\n\n```\nint a = 10;\n\
    int b = 5;\nint result = a + b;\n```\n\n```\n#include <iostream>\nusing namespace\
    \ std;\nint StartLives = 3;\n\nint main() {\n    StartLives += 1;\n    cout <<\
    \ StartLives;\n    return 0;\n}\n```\n\n```\ncout << result;\n```\n\n![](img/9eddebb0cf792a0bbe16478be74a68e1_132_0.png)\n\
    \n![](img/9eddebb0cf792a0bbe16478be74a68e1_132_1.png)\n\nSTEP 6 Specific to C++,\
    \ you can also use the following to assign values to a variable as soon as you\
    \ declare:\n\nSTEP 9 The modern C++ compiler is far more intelligent than most\
    \ programmers you think. While declaring variables, you can in fact use its feature:\n\
    \n```\nint a(10)\n b(5);\n```\n\n```\n#include <iostream>\nusing namespace std;\n\
    auto pi = 3.14159;\n\nint main() {\n    double radius = 1.5;\n    double area\
    \ = pi * radius * radius;\n    cout << area;\n}\n```\n\nThen, from the C++ 2011\
    \ standard, using braces:\n\n```\nint result{a + b};\n```\n\n![](img/9eddebb0cf792a0bbe16478be74a68e1_132_2.png)\n\
    \n![](img/9eddebb0cf792a0bbe16478be74a68e1_132_3.png)\n\nSTEP 7 You can create\
    \ global variables, which are declared outside any function and used in any function\
    \ within the entire code. What you've used so far are local variables used inside\
    \ the function. For example:\n\nAlthough we ignore the steps in Step 8, there's\
    \ a difference between a variable and an error. In this case, it's a simple warning.\
    \ The new data type, double, double-precision floating point value, which makes\
    \ the code accurate. The result should be 7.06858. Essentially, you can work with\
    \ it but not an error.\n\n> #include <iostream>\nusing namespace std;\nint StartLives\
    \ = 3;\n\n```\nStartLives = StartLives + 1;\ncout << StartLives;\n```\n\n```\n\
    #include <iostream>\nusing namespace std;\nint StartLives = 3;\n\nint main() {\n\
    \    StartLives += 1;\n    cout << StartLives;\n    return 0;\n}\n```\n\n![](img/9eddebb0cf792a0bbe16478be74a68e1_132_4.png)\n\
