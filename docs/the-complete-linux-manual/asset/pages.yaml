    +   **STEP 2** The Linux file system can appear confusing to a former Windows
    user, so you''re a little more knowledgeable on how it all works, we recommend
    you concentrate on the Home icon on the desktop. In here is everything relating
    to your user account: where you store Pictures, Videos, Music, Documents items
    etc.


