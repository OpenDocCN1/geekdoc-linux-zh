  md: '# # Getting Started with Linux


    # # Installing Linux on a PC


    Most distros come as a Live Environment. This means you can boot into an actual,
    fully-working distro from the DVD or USB that you created. Let''s see how it works
    and how you can go about installing Linux.


    # ## UEFI BIOS


    The Unified Extensible Firmware Interface (UEFI) is used to identify and protect
    a PC during its boot-up process. It replaces the traditional BIOS but can cause
    issues when installing Linux.


    +   **STEP 1** Insert your DVD or USB flash-drive into your PC, and if you haven''t
    already, shutdown Windows. In this instance we''re using the USB media but the
    process is virtually identical. Start the PC and when prompted press keys to enter
    the BIOS or SETUP, which for example: F2, Del or F12,


    +   **STEP 3** With UEFI turned to Legacy modes, there are two ways of booting
    into the Live Environment. The first is via the BIOS you''re already in. Locate
    the Boot Sequence and change the first boot device from its original setting,
    using internal HDD or similar; USB Storage Device for the USB media, or DVD Drive
    for the media option.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_21_0.png)


    +   **STEP 2** There are different versions of UEFI BIOS, covering them all you''ll
    need. What you''re looking for is a section that details the Boot Sequence or
    Boot Mode. Here you have the option to turn off UEFI and choose Legacy or Secure
    Boot. Most distros work with UEFI but it can be a tricky to install it to.


    +   **STEP 4** Alternatively use the Boot Menu. With this you can press F12 (or
    something similar) to display a list of boot options; from there, you can choose
    the appropriate boot media. After you can Save and Exit the BIOS by navigating
    to the Save & Exit option and choosing ''Save Changes and''


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_21_1.png)'
