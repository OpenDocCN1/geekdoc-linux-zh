  md: '# Variables


    Variables differ slightly when using C++ as opposed to Python. In Python, you
    can simply state that ''a'' equals 10 and a variable is assigned. However, in
    C++ a variable must be declared with its type before it can be used.


    # THE DECLARATION OF VARIABLES


    You can declare a C++ variable by using statements in the code. There are several
    distinct types of variable you can declare. Here''s how it works.


    +   **STEP 1** Open a new, blank C++ file and enter the usual code headers:


    ```

    #include <iostream>

    using namespace std;

    int main() {

    }

    ```


    +   **STEP 3** You can build and run the code but it won''t do much, other than
    store the variables 10 and 5 to the integers a and still works. Ignore the warnings
    about variables set but not used, the code output the contents of the variables,
    add:


    ```

    cout << a;

    cout << "\n";ncout << b;

    ```


    The cout << "\n"; part simply place a new line between the output of 10 and 5.


    ```

    #include <iostream>

    using namespace std;

    int main() {

    int a;

    int b;

    a = 10;

    b = 5;

    cout << a;

    cout << b;

    }

    ```


    +   **STEP 2** Start simple creating two variables, a and b, with one having a
    value of 10 and the other 5. You can use the data type int to declare these variables.
    Within the curly brackets:


    ```

    int a;

    int b;

    a = 10;

    b = 5;

    ```


    +   **STEP 4** Naturally you can declare a new variable, call it result and output
    some simple arithmetic:


    ```

    int result;

    result = a + b;

    cout << result;

    ```


    Insert the above into the code as the screenshot.


    ```

    #include <iostream>

    using namespace std;

    int main() {

    int a;

    int b;

    a = 10;

    b = 5;

    int result;

    result = a + b;

    cout << result;

    }

    ```


