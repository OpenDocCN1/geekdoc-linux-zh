  md: '# MORE LOOPING


    You can loop over data using the FOR, WHILE and UNTIL statements. These can be
    handy if you''re batch naming, copying or running a script where a counter is
    needed.


    **STEP 1** Create a new script called count.sh. Enter the text in the screenshot
    below, save and make it executable. The script creates the variable ''count''
    which at the beginning of the script equals zero. Start the WHILE loop, WHICH
    count is less than (the LT part) 0 will print the current value of count in the
    echo command.


    **STEP 4** The UNTIL loop works much the same way as the WHILE loop only, more
    often than not, in would be: **until [ $count -gt 100 ];** The difference being,
    UNTIL count is greater than (the gt part) one hundred, keep on looping.


    ```

    count.sh

    File Edit View Search Tools Documents Help

    count.sh x

    !/bin/bash

    count=0

    while [ $count -lt 100 ];

    echo $count

    let count=$count+1

    done

    ```


    **STEP 2** Executing the script count.sh will result in the numbers 0 to 99 listing
    the Terminal screen; when it reaches 100 it will end. Modifying the script with
    the FOR statement makes it much easier to use. In this case enter the text from
    the screenshot below to count.sh.


    **STEP 5** You''re not limited to numbers to one hundred. You can, within whatever
    set of commands you like execute them as many times as you want the loop to run
    for. Renaming files, creating fifty folders – for example, this script will create
    folders named folder1 through folder10 using the FOR loop.


    ```

    count.sh

    File Edit View Search Tools Documents Help

    count.sh x

    !/bin/bash

    for count in {0..100}; do

    echo $count

    let count=$count+1

    done

    ```


    **STEP 3** {0..100}; do: Means FOR variable ''count'' in the numbers from zero
    to one hundred, then start the loop. The rest of the script is the same. Run this
    script, and the same output appears in the Terminal.


    **STEP 6** Using the FOR loop to execute the sequence once more, we are manipulating
    the (0-100) part. This section of the code actually means (START,END.,INCREMENT).
    If there''s no increment then it''s just a single digit to the END. For example,
    you could use the loop to count up to 1000 two''s: for Count in {0..1000;2}; do


    ```

    count.sh

    File Edit View Search Tools Documents Help

    count.sh x

    !/bin/bash

    for count in {0..1000;2}; do

    echo $count

    let count=$count+1

    done

    ```'
