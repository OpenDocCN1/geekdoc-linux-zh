  md: '# Python on Linux


    # # How to Set Up Python in Linux


    While the Raspberry Pi''s operating system contains the latest, stable version
    of Python, other distros don''t come with Python 3 preinstalled. If you''re not
    going down the Pi route, then here''s how to check and install Python for Linux.


    # PYTHON PENGGUIN


    Linux is a versatile operating system that it''s often difficult to nail down
    one way of doing something. Different distributions about installing software
    in different ways, so we''re sticking with Linux Mint for this particular tutorial.


    +   - **STEP 1** First need to ascertain which version of Python is currently
    installed in your Linux system. To begin, drop into a Terminal session from your
    desktop or hit the Ctrl+Alt+T keys.


    +   - **STEP 3** In our case we have both Python 2 and 3 installed; as long as
    Python 3.x is installed, then the code is worth checking to see if the distro
    has been updated with the latest versions, so enter: `sudo apt-get update && sudo
    apt-get upgrade` to update the system.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_89_0.png)


    ```

    File Edit View Search Terminal Help

    david@david-Mint:~ $ python --version

    Python 2.7.15

    david@david-Mint:~ $ python3 --version

    Python 3.6.7

    ```


    +   - **STEP 2** Next enter `python --version` in the Terminal. You should have
    the output deailing version 2.x of the Python. By default, most distros come with
    Python 2 and 3, so there''s plenty of code out there available for Python 2. Now
    enter: `python3 --version`.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_89_1.png)


    ```

    File Edit View Search Terminal Help

    david@david-Mint:~ $ python --version

    Python 2.7.15

    david@david-Mint:~ $ python3 --version

    Python 3.6.7

    ```


    Once the update and upgrade are complete, `python3 --version` to verify if Python
    3.x is installed or updated; as long as you have Python 3.x, you''re running the
    most recent version. After the numbers after 3, check for patches and future updates.
    If you''re uncertain but check for new elements.


