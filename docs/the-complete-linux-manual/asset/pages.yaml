  md: '# # Creating a Linux Installer on Windows


    You need to transfer the downloaded Linux ISO to either a DVD or a USB key before
    being able to install it onto a computer. This will be a live environment, which
    allows you to test the OS prior to installation, but first you need to create
    the bootable media.


    # ## DVD BOOTABLE MEDIA


    We''re using a Windows 10 PC here to transfer the ISO to a DVD. If you''re using
    a version of Windows 7 onward the process is extremely easy.


    +   - **STEP 1** First locate the ISO image of Linux you''ve already downloaded.
    You can usually find it in the Downloads folder in Windows 7, 8.1 and 10 computers,
    unless you specified a different location when saving it.


    +   - **STEP 3** Burn the Linux ISO and from the menu select Burn Disc Image.
    Depending on the speed of the PC, it may take a few seconds before anything happens.
    Don''t worry too much, unless it takes more a minute, in which case it might be
    worth restarting your PC and trying again. With luck, the Windows Disc Image Burger
    should launch.


    | Quick access | Name | linuxmint-19.1-cinnamon-64bit |

    |---|---|---|

    | Dropbox (Team BDM) | | |

    | OneDrive | | |

    | This PC | | |

    | CD Drive (E): HiSuite | | |

    | Network | | |


    +   - **STEP 2** Next insert a recordable DVD disc into your computer''s optical
    drive. After a few seconds, while the disc is read, Windows displays a pop-up
    message asking what to do with the newly inserted disc, as we''re going to use
    the built-in burning function.


    +   - **STEP 4** With the Windows Disc Image Burger dialogue box open, click on
    the ''Verify disc after burning'' box then the Burn button. This process will
    take a few minutes, depending on the speed of your PC''s optical drive. Once it
    runs through the verification stage and when the optical drive should auto-select
    the disc for you.


