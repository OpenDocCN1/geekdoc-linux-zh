  md: '# Creating a File Using the Terminal


    Using the Terminal, you''re able to create folders, files and even execute Linux
    Mint apps. In truth, if you didn''t have the GUI at hand, you could still accomplish
    the same from the Terminal.


    # MORE TERMINAL WORK


    Creating content using the Terminal isn''t quite as strenuous as it may first
    appear. Yes, the Terminal can look a daunting place for the newcomer, but once
    mastered it''s really quite intuitive.


    +   STEP 1

    Home folder. If not use the cd - command to return you to the Home folder from
    wherever you''re currently located.


    +   STEP 3

    Your command line should change to the Test Folder and if you enter ls (List folder
    contents) there will be nothing within the folder; as you just created. The mkdir
    command is fairly self-explanatory: Make Directory followed by your name of choosing.


    ```

    File Edit View Search Terminal Help

    david@david-mint ~ cd -

    david@david-mint ~ - $

    ```


    ```

    File Edit View Search Terminal Help

    david@david-mint ~ mkdir Test

    david@david-mint ~ cd Test

    david@david-mint ~ ls -l

    david@david-mint ~ ~ls -l $

    ```


    +   STEP 2

    Let''s start by creating a new folder within Home, and call it Test. The command
    you''ll need mkdir Test. Press Enter to create the folder when you''ve typed in
    the command, cd Test and press Enter. This will Change Directory (hence) cd to
    the newly created folder.


    +   STEP 4

    To create an empty file, called Test.txt, enter in the Terminal: touch Test.txt.
    You can use ls to view the file in folder. Touch is a standard Linux command that
    allows the creation of files without the need to open a text editor, then, close
    the editor.


    ```

    File Edit View Search Terminal Help

    david@david-mint ~ mkdir Test

    david@david-mint ~ cd Test

    david@david-mint ~ ls -l

    david@david-mint ~ ~ls -l $

    ```


    ```

    File Edit View Search Terminal Help

    david@david-mint ~ mkdir Test

    david@david-mint ~ cd Test

    david@david-mint ~ touch Test.txt

    david@david-mint ~ ls -l

    david@david-mint ~ ~ls -l $

    david@david-mint ~ Test.txt ~ls $

    ```'
