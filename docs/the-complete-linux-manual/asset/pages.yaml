  md: '# Desktop Environments


    # A DASH OF CINNAMON


    Cinnamon has many benefits beyond its look and feel, although they are important
    factors. Here, we outline a couple of features to help you decide if it''s the
    DE for you.


    # FAB FEATURE 1


    It performs excellently on more modern systems but is a lot, more stable than
    it used to be, and not quite the resource hog it once was. Therefore, don''t be
    off Cinnamon if you''re using an older cubuntu or install best Linux Mint.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_14_0.png)


    # FAB FEATURE 2


    Cinnamon features configurable Hot Corners, where each of the desktop can be clicked
    to perform a certain task, such as display the Workspaces, Show all Windows or
    Run a Command. The Hot Corners allow you to switch between different views and
    help make the desktop a more efficient environment.


    # MATE


    MATE is a simple and intuitive DE''s fast and stable. In comparison to Cinnamon
    it looks a little antiquated but that''s only on the surface. There''s plenty
    to like with MATE.


    # FAB FEATURE 2


    MATE is an excellent desktop environment for older computers. It works better
    with a larger number of hardware components that Cinnamon generally does but is
    also just as capable of delivering a great looking desktop as well as advanced
    customisations.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_14_1.png)


    # CHOLESTER FREE DESKTOP


    Xfce started its life as the Common Desktop Environment (CDE) in 1996. Since then
    it changed a few times and is now simply Xfce, with the nickname ''Cholesterol
    Free Environment''.


    # FAB FEATURE 1


    Xfce is really a quick desktop and brings out the best in Linux as a fast operating
    system. In fact, it takes us to this point from the top of the page to install
    it onto a new computer; a few hundred words written and we''re using a new OS.
    Not bad.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_14_2.png)


    # FAB FEATURE 2


    Because it''s quick and lightweight it doesn''t mean Linux Mint. Xfce isn''t a
    complete desktop operating system. Just like the other environments on offer,
    you get the latest Firefox, Libreoffice, VLC, Gimp, chat apps and even a bit torrent
    client.'
