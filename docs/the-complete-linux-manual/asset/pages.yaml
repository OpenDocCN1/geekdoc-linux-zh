  md: '# # The Best Linux Distributions


    There are lots of versions of Linux available, known as Distributions. Each has
    a different ethos and approach. Here are five great distributions to try and where
    you can get them.


    # ## GOING LINUX


    The installation process for most distributions is similar. You download a disk
    image from the website and burn it to an optical disc or create a USB Flash Drive
    installer. Just be careful to get the right distribution for your hardware and
    follow the instructions carefully.


    By far the most popular Linux distro (distribution) is Linux Mint. Mint began
    life in 2006, as an alternative to the most popular distro, Ubuntu. Based on Ubuntu''s
    Long Term Support build, Linux Mint took a different direction and offered the
    user a better overall experience.


    Linux Mint has three main desktops available with each new version of the core
    OS. This may seem confusing at first but it''s quite simple. Currently, Linux
    Mint uses the Cinnamon Environment as its flagship model, but other environments
    are also available.


    Cinnamon is a graphically rich desktop environment, MATE uses less fancy graphics,
    and is more stable on a variety of desktop systems, and XFCE is an extremely streamlined
    desktop environment that''s built for speed and agility.


    Throughout this title we''ll be using the Cinnamon environment; however can try
    any of the other desktops as you wish. In fact, it is recommended that you spend
    some time trying different environments, and even different ones, to see which
    suits you and your computer best.


    ```

    www.linuxmint.com

    ```


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_9_0.png)


    The most popular distro available is Ubuntu, which is an African word known for
    "humanity to others". Ubuntu''s popularity has fluctuated over its fourteen year.
    At one time, it was the most used Linux-based system in the world but with some
    choices along the way with regards to its presentation, and some unfavorable,
    particularly involving privacy, sadly saw it tumble from the number one spot.


    That, Ubuntu has made amends and is slowly crawling its way back up the Linux
    leader board. The latest versions of the OS use the GNOME 3 desktop environment,
    an impressive improvement, although it can be a bit confusing for Windows users
    and is a little heavy on resources, especially if you''re planning on installing
    it on an older computer.


    Ubuntu, for all its faults, is a good Linux distro to start experimenting with
    it''s a clean interface, easy to use and install and offers the user a complete
    experience.


    **ubuntu.com**


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_9_1.png)'
