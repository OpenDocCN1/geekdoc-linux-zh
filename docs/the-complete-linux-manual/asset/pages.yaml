  md: '# Common Coding Mistakes


    When you start something you''re inevitably going to make mistakes, this is purely
    down to inexperience and those mistakes are great teachers in themselves. However,
    even experts make the occasional mishap. It is, to learn from them as best you
    can.


    # X=MISTAKE, PRINT Y


    There are many pitfalls for the programmer to be aware of, far too many to be
    listed here. Being able to recognize a mistake and fix it when you start to move
    into more advanced territory, and become a better coder. Everyone mistakes, even
    coders over thirty years'' experience. Learning from these common mistakes help
    build a better coding foundation.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_143_0.png)


    # SMALL CHUNKS


    It would be wonderful to work like Neo from The Matrix movies. Simply ask, your
    operator loads it into your memory and you instantly know everything about the
    subject. Sadly though we can''t do that. The major pitfall is someone trying to
    learn too much, too quickly. So coding in small pieces and take your time.


    # EASY VARIABLES


    Meaningful naming for variables is a must to eliminate common coding mistakes.
    Having letters of the alphabet is fine but what happens when the code states a
    problem with x variable. It''s not too difficult to name lives, player 1 and so.


    ```

    1 var points = 1023;

    2 var lives = 3;

