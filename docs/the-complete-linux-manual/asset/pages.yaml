  md: '# Equipment You Will Need


    The system requirements for successfully installing Linux Mint on to a PC are
    surprisingly low, so even a computer’s several years old will happily run this
    distro. However, it''s worth checking you you have everything in place before
    proceeding.


    # MINTY INGREDIENTS


    Before we start working our way through this book, here’s what you need to install
    and run Linux Mint. You have several choices available, so take your time and
    see which works best for you.


    # SYSTEM REQUIREMENTS


    The minimum system requirements for Linux Mint are follows:


    CPU – 700MHz

    RAM/Memory – 512MB

    Hard drive space – 9GB (20GB recommended)

    Display – 1024 x 768 resolution


    Obviously the better the system you have, the better the experience will be and
    quicker too.


    # USB INSTALLATION


    You can install Linux Mint onto your computer via USB or DVD. We look into each
    a later on but if you’re already familiar with the process, thinking of USB and
    just gathering hardware you need, then a minimum 4GB USB flash drive to store
    the Linux Mint ISO.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_11_0.png)


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_11_1.png)


    # DVD INSTALLATION


    DVD installation of Linux Mint simply requires a blank DVD-R disc of course, you
    also need an optical drive (a DVD Writer drive) before you’re able to transfer
    or burn the ISO image to the disc.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_11_2.png)'
