  md: "# C++ Linux\n\n# Data Types\n\nVariables, as you seen, store information that\
    \ the programmer can then call up, and manipulate if required. Variables are simply\
    \ memory locations that store the values the programmer assigns, depending on\
    \ the data type used.\n\n# THE VALUE OF DATA\n\nThere are many different data\
    \ types available for the programmer in C++, such as an integer, float, Boolean,\
    \ character and so on. It is widely accepted that there are seven basic types,\
    \ often called Primitive Built-in Types; however, you can create your own data\
    \ types should need arise within your code.\n\n| Type | Command |\n|---|---|n|\
    \ Integer | int |\n| Floating Point | float |\n| Character | char |\n| Boolean\
    \ | bool |\n| Double Floating Point | double |\n| Wide Character | wchar_t |\n\
    | No Value | void |\n\nThese basic types can be extended using the following modifiers:\
    \ Long, Short and Unsigned. This means the modifiers can expand the minimum and\
    \ maximum range values for each data type. For example, the int data type has\
    \ a default value of -2147483648 to 2147483647, a fair value, you would agree.\n\
    \nthat adding a count,precision() function and adding a value inside the brackets\
    \ then you're still limited by the accuracy of the double data type. For example,\
    \ try this:\n\n```\n#include <iostream>\nusing namespace std;\ndouble PI = 3.14159265358979238463;\n\
    ```\n\n```\nint main() {\n    cout << PI;\n}\n```\n\n```\nDataTypes.cpp\n#include\
    \ <iostream>\nusing namespace std;\ndouble PI = 3.14159265358979238463;\n```\n\
    \n```\nint main() {\n    cout << PI;\n}\n```\n\nNow, if we were to use int for\
    \ 0, the others range\n\n+   -unsigned int = 0 to 4294967295\nSigned int = -2147483648\
