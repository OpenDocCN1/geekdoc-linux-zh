  md: "# # Pi x Linux = \nThe Perfect Combination\n\nThe Raspberry Pi is a remarkable\
    \ piece of hardware, and to help drive its potential it needs a remarkable operating\
    \ system. Frankly, Linux is the default and recommended OS of choice for the Pi,\
    \ and they make a winning team.\n\nWhen the Raspberry Pi was in its developmental\
    \ stages its designers needed to ensure that they were creating a piece of hardware\
    \ that could offer much more than a cheap, small, computer.\n\nThe Pi needed to\
    \ be flexible with what it could do, it needed to have room to grow into more\
    \ ambitious project concepts and ideas, and the goal was to do so in as easy to\
    \ use as fashion to create a universal learning platform, that students of any\
    \ age could tinker with while learning new concepts such as programming, electronics,\
    \ and computing. Naturally, once the hardware was developed, the only real choice\
    \ of operating system was Linux.\n\nThe versatility of Linux is legendary. This\
    \ incredible core OS is so malleable that it can be steered toward any aspect\
    \ of computing, from supercomputing to robotics, the space industry to more terrestrial\
    \ engineering; education and science, manufacturing and the Internet. Think of\
    \ an industry, and you will likely find a Linux installation in the background\
    \ keeping it all together.\n\n![](img/9eddebb0cf792a0bbe16478be74a68e1_77_0.png)\n\
    \nRaspbian is the recommended operating system for the Raspberry Pi, a customised\
    \ Debian-based distribution that comes with a collection of useful tools for coding,\
    \ electronics, and general desktop computing duties. Alongside the apps are preloaded\
    \ to help you get the most out of the programming languages you decide to learn,\
    \ as well as hardware modules that enable you to use the hardware specific items\
    \ unique to the Pi. For example, there are Python modules that interact with the\
    \ Raspberry Pi's 40-pin GPIO, allowing you to create content for any of the Hardware\
    \ Attached on Top devices.\n\nThis combination is what makes the Raspberry Pi\
    \ an excellent base for operations to learn not only coding, but also Linux in\
    \ general. Raspbian, being Debian-based, will be able to run any of the Terminal\
    \ commands listed in this book, as Linux Mint,, and Ubuntu are also Debian-based.\
    \ And with very little setup, you'll be able to have your regular, Windows or\
    \ macOS computers, and have a Raspberry Pi as a headless (a powered device that\
    \ doesn't need a keyboard, mouse or monitor, as you can connect to it remotely)\
    \ computer from which you can connect and learn how to use Linux and how to code.\n\
    \n![](img/9eddebb0cf792a0bbe16478be74a68e1_77_1.png)"
