  md: '# Which Distro?


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_16_0.png)


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_16_1.png)


    tools preinstalled, that a user can run for penetration testing against their
    network. There was once a Hannah Montana Linux distribution but the less we talk
    about the better. The point being, there''s a distro out there for you.


    Oddly enough, much higher-end technical users find themselves back at square one,
    using a distro like Mint. The main reason is usually because it''s easy to use,
    and it''s a stable environment. Once you know the system inside out, doesn''t
    you always want to be fixing potential issues? Most of us would the logical choice
    would be to choose a distro that''s simple, yet powerful enough to do everything
    you want it to be, hence Linux.


    Needless to say, once you have mastered Linux to a relatively high degree, probably
    a power user, then you will want to expand your skills and build your own Linux
    distro based on Arch, Debian or one of the other distros. Doing so involves a
    lot of command line knowledge, as well as knowledge on how the Linux system works
    and interacts with the hardware in the computer. You will need to partition, install,
    configure, improve, and eventually install the apps and programs you want. Doing
    so takes time and there are a lot of skills you''re going to learn.


    In the end, it''s purely down to you, your personal choice. You may find that
    after going through the tutorials in this title you don''t like Mint or the Cinnamon
    desktop. You may prefer Ubuntu, Debian or openSUSE; that is the beauty of Linux.
    The freedom to change what you want, to hop from one to another without being
    penalised by cost or lack of access.


    Eventually you consider yourself a technical Linux user but never consider yourself
    an expert, after all we''re always learning something new. You can build your
    own distro from scratch, help other Linux users out with problems, which might
    even contribute to the improvement of a distro during its testing phase or beyond.
