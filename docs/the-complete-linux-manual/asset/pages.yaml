  md: '# # Command Line Quick Reference


    When you start using Linux full time, you will quickly realise that the graphical
    interfaces of Ubuntu, Mint, etc. are great for many tasks but not great for all.
    Understanding how to use the command line not only builds your understanding of
    Linux but also improves your knowledge of coding and programming in general. Our
    command line quick reference guide is designed to help you master Linux quicker.


    # ## TOP 10 COMMANDS


    These may not be the most common commands used by everyone but they will certainly
    feature frequently for many users of Linux and the command line.


    | cd | The cd command is one of the commands you will use the most at the command
    line in Linux. It allows you to change your working directory. You use it to move
    around within the hierarchy of your file system. You can also use cddir. | | The
    mv command moves a file to a different location or renames a file. For example
    mv file subnames the original file to sub. mv sub~Desktop moves the file ''sub''
    to your desktop directory but does not rename it. You must specify a new filename
    to rename it. | | | The ls command shows the files in your current directory.
    Used with certain options, it lets you see file sizes, when files were created
    and permissions. For example, ls ~shows you the files that are in your home directory.
    | The chown changes the user and group ownership of each file. If only one owner
    (a name or numeric ID) is given, that changes the owner of each file, and the
    files'' group. | | | The cp command is used to make copies of files and directories.
    For example, cp file sub makes an exact copy of the file you named and renames
    the copy but the first file will still exist with its original name. | The chmod
    command changes the permissions on the files listed. Permissions are based on
    a fairly simple model. You can set permissions for user, group and world and you
    can set whether each can read, write and execute. | | | The pwd command prints
    the full pathname of the current working directory (pwd stands for “printing directory”).
    Note that the gnome terminal also displays this information in the title bar of
    its window. | The rm command removes (deletes) files or directories. The removal
    process unlocks aのである in a filesystem from a storage device and marks it as available
    for space. In other words, removing files increases the amount of available space
    on your disk. | | | The clear command clears your screen if it is possible. It
    lets in the environment for the terminal type and then in the terrific database
    to figure out how to clear the screen. It is equivalent to typing Control-L when
    using the bash shell. | Short for “make directory”, mkdir is used to create directories
    on a file system, if the directory does not already exist. For example, mkdir
    works a create directory. More than one directory may be specified when calling
    mkdir. |'
