  md: '# Install Apps via the Terminal – Part 1


    There are different ways to install apps and programs on Linux. You can opt for
    the graphical route, using a Software Manager, or you can use the Terminal. Often,
    the Terminal provides better control over the software being installed and sometimes,
    you may have no choice in the matter.


    # COMMAND LINE INSTALLS


    Installing an app with the Terminal may require some nifty keyboard work but you
    get a better sense of what''s installed and where.


    +   STEP 1 Installing apps from the Terminal is often relatively simple. First,
    do that you need to make sure your system is up to date. Do this up in the Terminal
    and enter: `sudo apt-get update && sudo apt-get upgrade`. Enter your password
    and accept any updates.


    +   STEP 3 You need to enter y to confirm the installation, which takes up around
    5.5MB of storage in the system. Once Stella installed, you can see that Mint has
    automatically generated the Games category in the Menu as well as the shortcut.


    ```

    File Edit View Search Terminal Help

    daviddavid-midint ~ %

    $ sudo apt-get update && sudo apt-get upgrade

    $ sudo add-apt-repository ppa:stella-ppa:peter-levi/ppa

    $ sudo apt-get update

    $ sudo apt-get install stella

    ```


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_49_0.png)


    +   STEP 2 Just''ve seen, sudo apt-get update/upgrade and so are on design upgrade
    the software that''s already installed on the system. Do you install more apps
    though? It is so happens that it''s extraordinarily simple. First, you need an
    app to install, let''s use Stella. Enter: `sudo apt-get install stella`.


    +   STEP 4 Sometimes, when installing software, you need to add the app''s Repository.
    The repository, or repo, is simply the remote server where the software is held,
    along with all its dependencies (the vital libraries and books it needs to function).
    Start by this: `sudo add-apt-repository ppa:peter-levi/ppa` Press Enter to add
    and add the PPA (Personal Package Archive).


    ```

    File Edit View Search Terminal Help

    daviddavid-midint ~ %

    $ sudo add-apt-repository ppa:peter-levi/ppa

    Contains packages for the variety wallpaper changer

    More info: https://launchpad.net/~peter-levi/ubuntu/ppa

    Press Enter to continue or to cancel.

    ```'
