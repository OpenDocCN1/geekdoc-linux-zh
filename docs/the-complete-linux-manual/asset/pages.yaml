  md: '# Creating Bash Scripts - Part 1


    STEP 5 Let''s start with a simple script to output something to the Terminal.
    Exec will launch X and create a file called helloworld.sh. In X, enter the following:
    #bin/bash, then on a new line: `echo Hello World.`


    STEP 8 When you enter again, you can see that the helloworld.sh has now turned
    from white to green, making that it''s not an executable file. To run the script,
    in other words make it the things you''ve typed into it, `./helloworld.sh`


    ```

    File Edit View Search Terminal Help

    daviddavid-mint --scripts $ x helloworld.sh

    daviddavid-mint --scripts $ ls

    helloworld.sh

    ```


    ```

    File Edit View Search Terminal Help

    daviddavid-mint --scripts $ x helloworld.sh

    daviddavid-mint --scripts chmod +x helloworld.sh

    daviddavid-mint --scripts $ ls

    helloworld.sh

    daviddavid-mint --scripts ./helloworld.sh

    ```


    ```

    File Edit View Search Tools Documents Help

    # helloworld.sh

    !/bin/bash

    echo Hello World!

    ```


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_68_0.png)


    STEP 6 #!/bin/bash line tells the system what Hello (# denotes a comment line,
    one you''re going to be, in this case. The Bash command exclamation mark (!) means
    that it is ignored by the script, the comment is bypassed and will force the script
    to execute the line as a command. This is also known as a Hash-Bang.


    STEP 9 Although it''s not terribly exciting, the ''Hello World'' would now be
    displayed in the Terminal. The echo command is for responding with other variables
    in the Terminal, as we move on you use the echo command to other outputs.


    ```

    File Edit View Search Tools Documents Help

    # helloworld.sh

    !/bin/bash

    echo Hello World!

    ```


    ```

    File Edit View Search Tools Documents Help

    # helloworld.sh

    !/bin/bash

    echo Hello World! This is my first script in Linux Mi

    ```


    STEP 7 You can save this file, clicking File > Save, and exit back to the Terminal.
    Entering ls, will reveal the script in file. To make it executable, and able to
