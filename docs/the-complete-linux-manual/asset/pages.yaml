    choose Linux (Ubuntu 64-bit) as the Version; if not use the drop-down boxes to
    select the correct settings (remember Mint is based on Ubuntu). Click Next when
    you''re ready to proceed.


    +   STEP 4 This section is where you start to create the virtual hard disk that
    the VM uses to install Mint on. The default option, ''Create a virtual hard disk'',
