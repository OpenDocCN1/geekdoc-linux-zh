  md: '# Desktop Environments


    Linux Mint comes in several different versions, or flavours: Cinnamon, MATE and
    Xfce; there are 32-bit and 64-bit versions of these too. What does it mean though
    and which version should you choose for your installation?


    # WHICH MINT?


    A Desktop Environment is the graphical interface which you use to interact with
    the Linux system. Just as the graphical desktop for Windows 10 is also called
    Fluent Design.


    Linux Mint offers the user a choice of versions of the distro: Cinnamon, MATE
    and Xfce. While that may sound a little confusing for the newcomer, essentially
    each of the versions contains the same Linux structure and kernel, the kernel
    is the core of the operating system, that handles all the instructions between
    the software and hardware.


    Each version is a different desktop environment, the Graphical User Interface
    (GUI) that you use to interact with the operating system. Each of the desktop
    environments uses different apps to access or use the system, such as the file
    manager to browse the operating system''s file structure or when it launches other
    apps. Again though, the core availability productivity, video and graphics suites
    are the same, and function in the same way.


    Why bother then with a different desktop environment? Simply put, it''s down to
    personal taste. Some users prefer MATE, as MATE is a fork of the classic GNOME
    2 environment and is a little more menu-centric and a more modern environment
    that works well on recent hardware and features some modern edge. Xfce is a lightweight
    desktop environment that works well on older hardware due to its extremely low
    use of the system resources.


    In short, Cinnamon is the flagship desktop environment for Linux Mint. MATE is
    more compatible with a wider variety of hardware. Where Windows, for example,
    only offers one desktop environment to work in, Linux offers many. Linux Mint
    has therefore opted to bring the user a wealth of choice.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_13_0.png)'
  merge: -1
