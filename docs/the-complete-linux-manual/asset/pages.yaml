  md: '# # 10 Things to do After Installing Linux Mint


    Linux Mint is a polished distro out of the box, but with most Linux distros, there
    are some tweaks that can be applied to improve the way it works. Although these
    are Mint-specific tweaks, most can be applied to other distros.


    # ## LINUS TWEAKS


    Some of these post-installation actions are highly recommended, while others are
    just handy additions and simply tweak the system or add a customised.


    **STEP 1** The first, and most important, post-installation action is to update
    the system. Click on the icon in the Panel, Found at the bottom right of the desktop
    next to the time and date. This launches the Update Manager.


    **STEP 3** Click the OK button and you can see a couple of updates ready for installation.
    Before you update them, click on the blue OK button to switch to a Local Mirror.
    This opens the Software Sources option. On the Main and Base drop-down menus select
    a server closest to your current location.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_33_0.png)


    | Software Sources | Mirrors |

    | --- | --- |

    | PPA | Main (USA) | http://archive.ubuntu.com/ubuntu/main/packages |

    | Additional Repositories | Base (USA) | http://archive.ubuntu.com/ubuntu |

    | Authentication Keys | |

    | Maintenance | |

    | Optional Sources | Debug symbols

    | | Unstable packages (cran) |


    **STEP 2** Linux Mint offers the user a three level approach to updates: Don''t
    Break My Computer, Optimise Stability and Security and Always Update Everything.
    The recommended option is the Optimise Stability and Security, which only updates
    safe, essential patches that do not impact critical elements of the core OS. Read
    the descriptions below but choose the middle, and remember.


    **STEP 4** Click the Update cache and button from the Software Sources window.
    In the Update Manager, click on Install Updates and enter your password. The updates
    automatically themselves and relaunch Update Manager, with time a little more
    wait for updates, click Install Updates, any messages and wait for them to finish.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_33_1.png)


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_33_2.png)'
