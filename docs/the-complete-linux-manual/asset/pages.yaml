  md: "# Structure of a C++ Program\n\nCOMMENTS Lines that begin with a double slash\
    \ are comments. means they won't be executed in the code and are ignored by the\
    \ compiler. Comments are designed to help you, or another programmer looking at\
    \ your code, and explain what's going on. There are two types of comment: // multiple\
    \ line comments and // a single line.\n\n// The chevrons used here are insertion\
    \ operators. This means whatever follows the chevrons is inserted into the std::cout\
    \ statement. In this case they're the 'Hello, world!' which is to be displayed\
    \ on the screen when compile and execute the code.\n\n```\nhelloworld.cpp\n#include\
    \ <iostream>\nint main() {\n    // My first C++ program\n}\n```\n\n```\nhelloworld.cpp\n\
    #include <iostream>\nusing namespace std;\nint main() {\n    // My first C++ program\n\
    cout << \"Hello, world!\";\n}\n```\n\nSTD stands for something quite different,\
    \ in C++ it means Standard. It is part of the Standard Namespace in C++, which\
    \ covers a number of different statements and commands. You can leave the std::\
    \ part of the code but it must be declared at the start with using namespace std,\
    \ not both. For example:\n\nOUTPUTS Leading on, \"Hello, world! is what you want\
    \ to appear on the screen when the code is executed. You can enter whatever you\
    \ like, as long as it's inside the quotation marks. Sometimes brackets are needed,\
    \ depending on the compiler. The \\n part inserts a new line to be inserted.\n\
    \n```\nhelloworld.cpp\n#include <iostream>\nint main() {\n    // My first C++\
    \ program\nstd::cout << \"Hello, world!\\n\";\n}\n```\n\n```\n// My first C++\
    \ program\ncout << \"Hello, world!\\nn\"\n```\n\nCOUT In this example we're using\
    \ cout, which is a part of the Standard Namespace, hence why it's there, as you're\
    \ to use it for particular namespace. Use std::cout which displays, or prints\
    \ something to the screen. If you leave it out you have to declare it at the start\
    \ of the code, as mentioned previously.\n\n; AND) Finally you can see that lines\
    \ within a function block (except comments) end with a semicolon. This marks the\
    \ end of the statement; all statements in C++ must have one at the end or the\
    \ compiler fails to build the code. The very last has the curly brace to indicate\
    \ the end of the function main.\n\n```\nhelloworld.cpp\n#include <iostream>\n\
    using namespace std;\nint main() {\n    // My first C++ program\ncout << \"Hello,\
