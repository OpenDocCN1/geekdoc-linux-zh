    - **步骤 2** 下载 Rufus 执行文件并在系统问题上选择“是”，并在更新时选择“是”。Ruf 启动后，你已经识别了 USB 闪盘；如果没有，请拔掉并重启。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_20_1)


    后续步骤询问你想从哪个模式启动 Linux ISO。两种方法适用于不同的情况，但通常推荐的 ISO 模式更流行。确保你选择此项并点击“确定”，然后确认操作。你选择的镜像是“ISOHybrid”镜像。这意味着它可以写入
    ISO 镜像（文件模式）或 DD 镜像（镜像模式）。Rufus 会记住上次使用的模式，这样你在写入后就可以访问驱动器。如果在启动过程中遇到错误，可以尝试用
    DD 模式写入此镜像。


    - ISO 模式（推荐）

