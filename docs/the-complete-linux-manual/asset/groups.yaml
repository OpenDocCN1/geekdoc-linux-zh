    # Creating and Removing Directories


    As with creating files in the Terminal, you can also create and delete directories,
    or folders if you prefer. Directories form the structure of your file system,
    without logical directories the filing system would be in utter chaos.


    # MANAGING FOLDERS


    Learning how to create and delete folders in the Terminal is an important Mint,
    and indeed Linux overall, skill to master. Here''s the basics for you to try out.


    +   With the Terminal open enter cd – make sure you''re in your own Home directory.
    Now enter is to view the current folders you have housed in the Home directory.
    You''ll notice that folders are labelled in cyan (light blue). Let''s start creating
    a new one. Enter: mkdir testdir.


    If you enter the command again, mkdir testdir, you''ll receive a message stating:
    mkdir already exists without saying then, you''re only able to have one uniquely
    named within the current directory. However, as Linux is case-sensitive, you cannot
    have testdir, Testdir and so on.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_57_0.png)


    If you now enter again, you''ll see that the new directory, testdir, has been
    created alongside the other directories in the Home area. Obviously the command
    mkdir is what creates the directory, and now you''ve already guessed it stands
    for Make Directory.


    You can create directories within directories you''ve already created with cd
    testdir/ For example, enter the testdir/ to list the folder structure. Naturally
    there is present, as you''ve just created the directory. Now back drop to Home
    with cd – and enter mkdir testdir/reports. Go back to the terminal, cd testdir/,
    and ls is again.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_57_1.png)


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_57_2.png)'
