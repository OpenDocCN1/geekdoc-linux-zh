    \ Make and Install. You'll find a lot of apps using from source, so it's certainly\
    \ a worth investing time in.\n\nSource code files for Linux usually come in the\
    \ form .tar.gz or .tar.bz2. Both compressed files holding all the code needed\
    \ to `make` the app. Start this tutorial by creating a new folder in Home: `mkdir\
    \ vim`. `wget` command retrieves content from the internet. According to Mint's\
    \ file system, the compressed file should be displayed in red.\n\n### STEP 1\n\
    \n```\ndavid-mint $ mkdir vim\n```\n\n### STEP 2\n\nVim, by the way, is an advanced\
    \ text editor which we'll use as an example to install. Enter the folder, `cd\
    \ vim`, and then within the new folder, enter the following command into the Terminal:\
    \ `wget ftp://ftp.vim.org/pub/vim/vim-7.tar.bz2`. We need to decompress the contents\
    \ of the file now: `tar -xf vim-7.tar.bz2` and press the Tab key to auto-fill\
    \ the remaining name.\n\n```\ndavid-mint $ tar -xf\n```\n\n### STEP 5\n\nIf you\
    \ enter `ls`, you'll notice that a new folder has been created: vim74; representing\
    \ a folder in Mint. It's always wise to create root folders for the main app,\
    \ as upgrade apps through this method individual versions will have their own.\n\
    \n### STEP 8\n\nYou may need to keep installing dependencies. After each new dependency\
    \ is installed, re-run `./configure` and it doesn't report back with an error\
    \ you can continue to the next stage of installation. Note: you may need to search\
    \ online for some errors.\n\n```\ndavid-mint ~ ./vim\n```\n\n```\ndavid-mint ~\
    \ ./configure\nchecking for gcc... gcc\nchecking for cc... gcc\nchecking for make...\
    \ make\nchecking for readline... yes\nchecking for terminfo... yes\nchecking for\
    \ ncurses... yes\nchecking for ncurses_wide... yes\nchecking for python3... yes\n\
    checking for ptrace... yes\nchecking for zlib... yes\nchecking for iconv... yes\n\
    checking for autoconf... yes\nchecking for features... yes\nchecking for gettext...\
    \ yes\nchecking for permissions... yes\nchecking for prefix... yes\n```\n\n###\
    \ STEP 6\n\nType `cd vim` to enter the folder, and ls to view its contents. There\
    \ will be a number of files present; most are the app's core files, while others\
    \ will be README or INSTALL. It is always wise to read these files before you\
    \ provide any information during the installation.\n\n### STEP 9\n\nWith a successful\
