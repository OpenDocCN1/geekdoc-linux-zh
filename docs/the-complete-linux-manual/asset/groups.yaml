    # 为什么选择 Linux？


    对于许多用户来说，Linux 意味着自由。摆脱其他操作系统那种“围墙花园”式的限制，可以随心所欲地更改和扩展操作系统，并且免于任何形式的许可费用或付费。Linux
    的魅力远比你想象的要多。


    # 免费且开源


    对于那些与与众的人来说，Linux 是完美的选择。系统的效率、应用程序的可用性和稳定性只是其中的原因之一。


    你首先需要了解的是，并没有一种名为 Linux 的操作系统。事实上，Linux 是操作系统内核，是每个操作系统的核心组件。当我们谈论 Linux 时，我们指的是许多发行版（distros），例如
    Ubuntu、Fedora、openSESE、Debian、Raspberry Pi 等。这些发行版每一个都为用户提供略有不同的特性。虽然每个发行版都以 Linux
    内核为核心，但它们为用户提供了不同的桌面界面、不同的软件包管理器，以及启动和安装更多应用的不同方式，并在整个系统中提供了略有不同的视觉和操作感受。核心在于
    Linux，这就是为什么我们称其为 Linux。


    Linux 的工作方式与 Windows 或 macOS 大不同。它是免费的：免费安装在任意数量的计算机上，免费使用无限期，并且免费创建应用程序。这种“免费使用”是吸引开发者的最大动力之一。你可以对其进行更深度的自定义，而用户——无论是开发者、游戏玩家，还是想使用旧电脑的人——都可以快速下载一个发行版并在几分钟内开始工作。


    除了免费使用外，还有根据个人需求对系统进行自定义的自由。互联网上每个可用的发行版都有特定的“特色”（spin）。


    Linux 是一个开始编程的绝佳系统。


    # 为什么选择 Linux？


    在 Linux 下，程序员有成千上万的免费软件包可用。


    在某些其他发行版中，它们提供了更高的安全性、华丽的桌面、游戏空间或专为学生定制的功能。这种灵活性使 Linux 成为我们可靠的工具，包括用于许多不同语言的
    IDE，如 Python、C++、Java 等；或者可以为匿名性创建基础，例如作为 Minecraft 服务器、媒体中心等。


    对于那些想要学习代码的人来说，另一个显著优势是 Linux 内置了大多数流行的环境。绝大多数 Linux 发行版都预装了 Python 和 C++，这意味着你只要安装了系统并首次使用它，就可以开始编程了。


    总的来说，Linux 占用的资源没有 Windows 或 macOS 那么多；我们说的资源指的是硬盘空间和 CPU 性能。Linux 代码非常紧凑，这释放了系统资源。更高效的代码意味着为编码、测试以及你最终创建的程序提供了更多资源。资源的使用意味着你可以在旧硬件上运行
    Linux，这些硬件通常难以或拒绝运行最新版本的 Windows 或 macOS；与其扔掉旧电脑，不如用 Linux 发行版重利用。


    每个发行版都为用户提供独特的内容，但都以 Linux 为核心。


    这不仅仅关于 C++、Python 或任何其他常用的编程语言。通过使用 Linux 的命令行（也称为终端），你可以创建 Shell 脚本，这些程序设计用于从命令行运行，用于在特定操作后方便地处理用户的某些形式的输入输出。


    最后，我们还有许多可以列出的优势，并且有成千上万的免费程序涵盖了知识的几乎每一个方面。已知软件包（在编写本文时），仅 Linux Mint 就有 8,700
    多个特定的编程应用程序，以及令人惊叹的 62,000 多从抽象到 WWW 的各种类别。


    Linux 是一个编程的极佳资源和环境。它非常适合开发者，并且在不断改进和演变。如果你认真想要投入编程，或者想尝试新事物，请尝试一下 Linux，看看它是否适合你。


