    # Getting to Know Linux


    # Becoming Anonymous Online


    The digital age has led to many great advances in communications; however, it
    has also brought on a new age of spying and snooping. Most of us are strangers
    to the frequent news stories of governments, secret organisations and underground
    hackers breaking our privacy but how can you combat this?


    ## ANONYMITY WITH MINT


    While it''s virtually impossible to become totally anonymous, you can take measures
    to ensure your privacy is at its best.


    - STEP 1: Starting with the basics, use HTTPS instead of the standard HTTP when
    browsing. This means anything that''s transmitted over HTTPS is secure (hence
    the S at the end) and encrypted.


    - STEP 3: Although using Google may seem the obvious choice for a modern Internet
    search, the company does track all searches made by an individual. Instead, consider
    an alternative search engine, such as DuckDuckGo, a search engine that doesn''t
    store personal data or track you.


    - STEP 2: When you''re browsing, consider the Incognito or Private browsing modes
    in a browser. This disables your web history and cache, allowing you to browse
    without the details stored for later scrutiny by someone else. However, it doesn''t
    stop any data or search tracking.


    - STEP 4: If you''re regularly on the Internet then consider enhancing your privacy
    by installing some of the browser plugins. For example, for Firefox, use Ghostery,
    NoScript and AdBlock Plus to block trackers, and other data mining techniques.


    ## VPNS AND TOR


    The previous steps can aid you online privacy but to remain anonymous you will
    need a Virtual Private Network and Tor.


    STEP 1: A VPN is a network server, or cluster of servers, that establishes a connection
    with your computer. The result is that your computer''s identity on the Internet
    is hidden behind the VPN remote server; so you could use it in the UK but have
    an IP address (computer online identity) belonging to Iceland.


    STEP 4: When the download has finished, drop into the Terminal and enter the Downloads
    folder, `cd Downloads ls` to check if the tar.xz Tor file is present, then run:
    `tar -xvf tor-browser-linux64-8.0.4.tar.xz` (X is updated, if your version is
    different Press tab to autocomplete the tor-browser-filename). When the files
    are unpacked, use `cd tor-browser-en-US/` to enter the new folder.


    ## How VPN works?


    ```

    download@mid$ cd tor-browser-en-US

    download@mid$ ls -la

    download@mid$ tar -xvf tor-browser-linux64-8.0.4.tar.xz

    download@mid$ ls -la

    download@mid$ cd tor-browser

    download@mid$ cd tor-browser-en-US

    download@mid$ ls -la

    download@mid$ cd tor-browser-en-US

    download@mid$ ls -la

    ```


    - STEP 2: Most good VPNs charge a monthly or annual fee but it''s worth the expense.
    We use CyberGhost, cyberghost.com, which provides VPN connections for Windows,
    Mac, Mint (as any other Linux distribution), Android and iOS devices. Details
    for each OS can be found at www.cyberghost.com/hz/en-us/articles/213190329-Read-me-first-


    - STEP 5: A quick setup reveals a couple of things: folder Browser and a file
    ''start-browser.desktop''. To start the setup, run `./start-browser.desktop`.
    This command launches the setup, and you are offered two options: Connect or Configure.
    For most users, the Connect option will suffice. Click when you''re ready.


    - STEP 3: Another option is to use Tor. Tor is an open network that you can connect
    to to hide your IP address behind corners around the world. It is available for
    Windows, Mac and Linux computers and is easy to use. Start by navigating to projectproject.org/download/linux-easy/
    and clicking on the Download Linux 64-bit version.


    - STEP 6: After the connection is established, the Tor Browser launches. It is
    a customised version of Firefox and from here you can securely browse the Internet
    without being viewed or tracked. Mixing both VPN and Tor makes for an extremely
    secure and private connection to the online.


    ## Using the Terminal


    The Linux command line, the Terminal, is an incredibly powerful environment. From
    it, you can bring the OS to its knees, or update it to something spectacular.
    You can hack into remote computers, look at an animated ASCII campfire, install
    new apps and programs, watch Star Wars played out from a server in the Netherlands,
    and code indicate automated scripts.


    # "Linux: the operating system with a CLUE... Command Line User Environment."


    — Anonymous (Posted on comp.software.testing)


    In this section you will explore the intricacies of the Terminal, and how it works
    with Linux. You will learn how to manipulate the Linux file system from the Terminal,
    and you will discover some odd, but fun things you can do in the Terminal.


    The Terminal rules supreme in the world of Linux. Learn how it works, and you
    can access.

