    # Equipment You Will Need


    The system requirements for successfully installing Linux Mint on to a PC are
    surprisingly low, so even a computer’s several years old will happily run this
    distro. However, it''s worth checking you you have everything in place before
    proceeding.


    # MINTY INGREDIENTS


    Before we start working our way through this book, here’s what you need to install
    and run Linux Mint. You have several choices available, so take your time and
    see which works best for you.


    # SYSTEM REQUIREMENTS


    The minimum system requirements for Linux Mint are follows:


    CPU – 700MHz

    RAM/Memory – 512MB

    Hard drive space – 9GB (20GB recommended)

    Display – 1024 x 768 resolution


    Obviously the better the system you have, the better the experience will be and
    quicker too.


    # USB INSTALLATION


    You can install Linux Mint onto your computer via USB or DVD. We look into each
    a later on but if you’re already familiar with the process, thinking of USB and
    just gathering hardware you need, then a minimum 4GB USB flash drive to store
    the Linux Mint ISO.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_11_0.png)


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_11_1.png)


    # DVD INSTALLATION


    DVD installation of Linux Mint simply requires a blank DVD-R disc of course, you
    also need an optical drive (a DVD Writer drive) before you’re able to transfer
    or burn the ISO image to the disc.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_11_2.png)'
  - '[PAGE 12]


    # Equipment You Will Need


    # VIRTUAL ENVIRONMENT


    Installation to a virtual environment is a favourite method of testing and using
    Linux distributions. Linux Mint works exceedingly well when used in a virtual
    environment but more on later. There are many different virtual environment apps
    available; however, VirtualBox, from Oracle, is one of the easiest to into. You
    can find the latest version at www.virtualbox.org.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_12_0.png)


    # INTERNET CONNECTION


    It goes without saying really, that an Internet connection is vital for making
    sure that Linux Mint is up to date with the latest updates and patches, as well
    as the installation of further software. Although you don''t need an Internet
    connection to use Linux Mint, you''ll miss out on a world of free software available
    for the distro.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_12_1.png)


    # MAC HARDWARE


    Although Linux Mint can be installed onto a Mac, there''s a school of thought
    that recommends Mac users use a virtual environment, such as VirtualBox or Parallels;
    and why not, macOS''s already a splendid operating system. If you''re wanting
    to breathe new life into an older Mac, make sure it''s an Intel CPU model and
    Beware though, it''s not as pain free as installing on to a PC.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_12_2.png)'
  - '[PAGE 13]


    # Desktop Environments


    Linux Mint comes in several different versions, or flavours: Cinnamon, MATE and
    Xfce; there are 32-bit and 64-bit versions of these too. What does it mean though
    and which version should you choose for your installation?


    # WHICH MINT?


    A Desktop Environment is the graphical interface which you use to interact with
    the Linux system. Just as the graphical desktop for Windows 10 is also called
    Fluent Design.


    Linux Mint offers the user a choice of versions of the distro: Cinnamon, MATE
    and Xfce. While that may sound a little confusing for the newcomer, essentially
    each of the versions contains the same Linux structure and kernel, the kernel
    is the core of the operating system, that handles all the instructions between
    the software and hardware.


    Each version is a different desktop environment, the Graphical User Interface
    (GUI) that you use to interact with the operating system. Each of the desktop
    environments uses different apps to access or use the system, such as the file
    manager to browse the operating system''s file structure or when it launches other
    apps. Again though, the core availability productivity, video and graphics suites
    are the same, and function in the same way.


    Why bother then with a different desktop environment? Simply put, it''s down to
    personal taste. Some users prefer MATE, as MATE is a fork of the classic GNOME
    2 environment and is a little more menu-centric and a more modern environment
    that works well on recent hardware and features some modern edge. Xfce is a lightweight
    desktop environment that works well on older hardware due to its extremely low
    use of the system resources.


    In short, Cinnamon is the flagship desktop environment for Linux Mint. MATE is
    more compatible with a wider variety of hardware. Where Windows, for example,
    only offers one desktop environment to work in, Linux offers many. Linux Mint
    has therefore opted to bring the user a wealth of choice.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_13_0.png)'
  - '[PAGE 14]


    # Desktop Environments


    # A DASH OF CINNAMON


    Cinnamon has many benefits beyond its look and feel, although they are important
    factors. Here, we outline a couple of features to help you decide if it''s the
    DE for you.


    # FAB FEATURE 1


    It performs excellently on more modern systems but is a lot, more stable than
    it used to be, and not quite the resource hog it once was. Therefore, don''t be
    off Cinnamon if you''re using an older cubuntu or install best Linux Mint.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_14_0.png)


    # FAB FEATURE 2


    Cinnamon features configurable Hot Corners, where each of the desktop can be clicked
    to perform a certain task, such as display the Workspaces, Show all Windows or
    Run a Command. The Hot Corners allow you to switch between different views and
    help make the desktop a more efficient environment.


    # MATE


    MATE is a simple and intuitive DE''s fast and stable. In comparison to Cinnamon
    it looks a little antiquated but that''s only on the surface. There''s plenty
    to like with MATE.


    # FAB FEATURE 2


    MATE is an excellent desktop environment for older computers. It works better
    with a larger number of hardware components that Cinnamon generally does but is
    also just as capable of delivering a great looking desktop as well as advanced
    customisations.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_14_1.png)


    # CHOLESTER FREE DESKTOP


    Xfce started its life as the Common Desktop Environment (CDE) in 1996. Since then
    it changed a few times and is now simply Xfce, with the nickname ''Cholesterol
    Free Environment''.


    # FAB FEATURE 1


    Xfce is really a quick desktop and brings out the best in Linux as a fast operating
    system. In fact, it takes us to this point from the top of the page to install
    it onto a new computer; a few hundred words written and we''re using a new OS.
    Not bad.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_14_2.png)


    # FAB FEATURE 2


    Because it''s quick and lightweight it doesn''t mean Linux Mint. Xfce isn''t a
    complete desktop operating system. Just like the other environments on offer,
    you get the latest Firefox, Libreoffice, VLC, Gimp, chat apps and even a bit torrent
    client.'
  - '[PAGE 15]


    # # Which Distro?


    Up to now we''ve looked mainly at Linux Mint but there are other Linux distributions
    out there to try. In truth there are hundreds of Linux distros to download and
    install, which one should you decide on use?


    # ## DISTRO HOPPING


    Distro hopping is a term used by the community for people who never stick to a
    single distribution. Instead, they hop from one to the other and back again, testing
    each until they move on to another or a newly released distro.


    There''s nothing wrong with distro hopping, as it''s a good way to grips with
    what''s out there and discover the elements of one distro over another that may
    not appeal to your tastes. The problem of which one should you use is up to you.


    For example, Linux Mint is an ideal starting place. It''s easy to install and
    use distro, has all the software you would normally use on a day-to-day basis
    already installed out-of-the-box and gently eases you into the unique world of
    Linux and how it works and performs.


    Ubuntu offers much the same experience but it does this in a slightly different
    way. There''s generally less perceived with Ubuntu than with Mint. Another point
    worth considering is the sheer volume of content and help available when Ubuntu
    users get stuck, you''re never too far from a solution to the problem.


    Moving on, as you begin to grow more confident with Linux, you may test the likes
    of Fedora or Debian. These are all excellent distros and each offer the user a
    different perspective on how the systems run. Some are more demanding, in terms
    of Linux skills, than others, but each has its own value and something to offer
    to the user.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_15_0.png)


    While distro hopping is a fun, it''s not exactly a stable way to enjoy Linux and
    get the best from it. We''re not saying you should stick to one and never look
    elsewhere, as you might be missing a lot of great content out there, but we recommend
    you find a home and slowly progress there based on your increasing Linux skills.


