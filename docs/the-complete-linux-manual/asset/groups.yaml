    - **步骤 3** 在 Rufus 界面你会感到困惑，但不用担心，它很简单。首先，点击“磁盘或 ISO 镜像”旁“选择”按钮。这会启动一个 Windows
    窗口，你可以在其中选择 Linux ISO。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_20_2)


    - **步骤 6** ISO 现在已传输到 USB 闪盘。该过程不需要花费太长时间，取决于你找到的 USB 盘的速度。在过程中，Rufus 在 Windows
    资源管理器中自动启动 USB 盘；不用担心，如果你想的话可以关闭它。当过程完成后，点击“关闭”按钮。


