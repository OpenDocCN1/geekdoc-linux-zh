    file, accurately by using the app''s **File > Save As** from its top menu bars.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_56_0.png)


    ### STEP 6 You''ll notice that the cursor is flashing below the `cat > Test2.txt`
    command, with the usual prompt. This will allow you to enter the text into the
    file. Enter your content, then press Ctrl+D to exit and save the contents to the
    file.


    ### STEP 9 if, you prefer remaining in the terminal to edit/create files, you
    can use Nano. Nano is a Simple-based text editor. To try it, use the example:
    `nano Test2.txt`. There''s a menu at the bottom of the screen. To save and exit
    any content in Nano, press **Ctrl+X** and the on-screen instructions.


