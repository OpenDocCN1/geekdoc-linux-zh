    | Character | char |\n| Boolean | bool |\n| Double Floating Point | double |\n\
    | Wide Character | wchar_t |\n| No Value | void |\n\nThese basic types can be\
    \ extended using the modifiers: Long, Short and Unsigned. This means the modifiers\
    \ can expand the minimum and maximum range for each data type. For example, the\
