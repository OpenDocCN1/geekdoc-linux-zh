    \n```cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    int a;\n\
    \    int b;\n    a = 10;\n    b = 5;\n    int result;\n    result = a + b;\n \
    \   cout << result;\n}\n```\n\n## Variables\n\nSTEP 5 You can assign a value to\
    \ a variable as soon as you declare it. The code you've typed in today could look\
    \ like:\n\n```cpp\nint a = 10;\nint b = 5;\nint result = a + b;\n```\n\nSTEP 6\
    \ Specific to C++, you can also use the following to assign values to a variable\
    \ as soon as you declare:\n\n```cpp\nint a(10), b(5);\n```\n\nThen, from the C++\
    \ 2011 standard, using braces:\n\n```cpp\nint result{a + b};\n```\n\nSTEP 7 You\
    \ can create global variables, which are declared outside any function and used\
    \ in any function within the entire code. What you've used so far are local variables\
    \ used inside the function. For example:\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nint StartLives = 3;\n\nint main() {\n    StartLives += 1;\n\
    \    cout << StartLives;\n    return 0;\n}\n```\n\nSTEP 8 The previous steps create\
    \ variable StartLives, which is a global variable. In a game, for example a player's\
    \ lives go up or down depending on how well or bad they're doing. When the player\
    \ restarts the game, the StartLives returns to its default value: 3. Here we have\
    \ assigned 3 lives, subtracting lives left.\n\nSTEP 9 The modern C++ compiler\
    \ is far more intelligent than most programmers you think. While declaring variables,\
    \ you can in fact use its feature:\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nauto pi = 3.14159;\n\nint main() {\n    double radius = 1.5;\n    double\
    \ area = pi * radius * radius;\n    cout << area;\n}\n```\n\nAlthough we ignore\
    \ the steps in Step 8, there's a difference between a variable and an error. In\
    \ this case, it's a simple warning. The new data type, double, double-precision\
