    # Command Line Quick Reference


    When you start using Linux full time, you will quickly realise that the graphical
    interfaces of Ubuntu, Mint, etc. are great for many tasks but not great for all.
    Understanding how to use the command line not only builds your understanding of
    Linux but also improves your knowledge of coding and programming in general. Our
    command line quick reference guide is designed to help you master Linux quicker.


    ## TOP 10 COMMANDS


    These may not be the most common commands used by everyone but they will certainly
    feature frequently for many users of Linux and the command line.


    | Command | Description |

    | :--- | :--- |

    | cd | The cd command is one of the commands you will use the most at the command
    line in Linux. It allows you to change your working directory. You use it to move
    around within the hierarchy of your file system. You can also use cddir. |

    | mv | The mv command moves a file to a different location or renames a file.
    For example mv file sub names the original file to sub. mv sub ~/Desktop moves
    the file ''sub'' to your desktop directory but does not rename it. You must specify
    a new filename to rename it. |

    | ls | The ls command shows the files in your current directory. Used with certain
    options, it lets you see file sizes, when files were created and permissions.
    For example, ls ~ shows you the files that are in your home directory. |

    | chown | The chown changes the user and group ownership of each file. If only
    one owner (a name or numeric ID) is given, that changes the owner of each file,
    and the files'' group. |

    | cp | The cp command is used to make copies of files and directories. For example,
    cp file sub makes an exact copy of the file you named and renames the copy but
    the first file will still exist with its original name. |

    | chmod | The chmod command changes the permissions on the files listed. Permissions
    are based on a fairly simple model. You can set permissions for user, group and
    world and you can set whether each can read, write and execute. |

    | pwd | The pwd command prints the full pathname of the current working directory
    (pwd stands for “printing directory”). Note that the gnome terminal also displays
    this information in the title bar of its window. |

    | rm | The rm command removes (deletes) files or directories. The removal process
    unlocks a block in a filesystem from a storage device and marks it as available
    for space. In other words, removing files increases the amount of available space
    on your disk. |

    | clear | The clear command clears your screen if it is possible. It lets in the
    environment for the terminal type and then in the terrific database to figure
    out how to clear the screen. It is equivalent to typing Control-L when using the
    bash shell. |

    | mkdir | Short for “make directory”, mkdir is used to create directories on a
    file system, if the directory does not already exist. For example, mkdir works
    a create directory. More than one directory may be specified when calling mkdir.
    |


    # Command Line Quick Reference


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_80_0.png)


    The following commands are useful for when you are trying to learn more about
    the system or program you are working with in Linux. You might not need them every
    day, but when you do, they will be invaluable.


    ## USEFUL HELP/INFO COMMANDS


    The free command displays the total amount of free and used physical and swap
    memory in the system. For example, free --m gives the information using megabytes.


    The sed command opens a stream editor. A stream editor is used to perform transformations
    on an input stream: file or input.


    The df command displays filesystem usage for all partitions. The command df-h
    is probably the most useful (df-h means human-readable).


    The adduser command adds a new user to the system. Similarly, the group command
    adds a new group to the system.


    The top program provides a real-time view of a running system. It can display
    system information as well as a list of processes.


    The deluser command removes a user from the system. To remove the user''s files
    and home directory, you need to add option.


    The uname command with -a provides all system information, including machine name,
    version and a few other details.


    The delgroup command removes a primary group of users.


    The ps command allows you to view all processes running on the machine. Every
    operating system''s ps is slightly different but all do the same thing.


    The man command brings up manual entry for the man command, which is a great place
    to start using it.


    The grep command allows you to search inside files for a particular pattern and
    then matching lines.


    The man intro command is especially useful. It displays a brief introduction to
    the Linux command line.


    ## A-Z of Linux Commands


    There are literally thousands of commands, so this is not a complete A-Z. You
    will probably need using a smaller set of commands again but having overall knowledge
    is still useful.


