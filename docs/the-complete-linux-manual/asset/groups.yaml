    ## 导航 Cinnamon 桌面


    每个桌面环境的行为都各不相同。有些桌面环境（DE）提供了自定义并放置在桌面上的组件，而另一些则追求简洁、利落的外观，以保持所有程序运行尽可能快。让我们来看看
    Cinnamon 桌面提供了哪些功能。


    ## 独特的风味


    Cinnamon 桌面环境兼顾了风格与性能。它有许多迷之处，这也是它成为受欢迎的桌面环境的原因。


    - **第 1 步** 双击“计算机”开始探索 Cinnamon 桌面。这将打开 Nemo，它是 Cinnamon 中使用的文件管理器。“计算机”图标打开根目录文件系统，可以访问光驱器（如果你安装了的话）、硬盘和
    Linux 核心文件系统。


    - **第 2 步** 对于以前用 Windows 用户来说，Linux 文件系统可能看起来很困惑，因此为了让你更了解它的工作原理，我们建议你关注桌面上的“主”图标。这里包含了与你的用户账户相关的所有内容：你存储图片、视频、音乐、文档等的地方。


    - **第 3 步** Nemo 具有许多不同的功能、视图和方式，方便你查看和操作文件及文件夹。例如，如果你在“图片”文件夹中有图片，可以使用 Nemo 右下角标记为“调整缩放级别”的滑块来选择图片的图标级别。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_31_0.png)


    - **第 4 步** 就像任何优秀的文件管理器一样，如果你右键点击内部的任何文件或文件夹，就会获得丰富的选项。在 Cinnamon 中，默认允许你根据文件类型查看文件，并进行复制、剪切、删除、压缩、重命名、通过电子邮件发送以及查看属性。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_31_1.png)


    - **第 5 步** 桌面底部是面板（Panel），我们已经看过了面板的一个部分：菜单。如果你在面板上右键点击（而不是面板应用上），你会看到一个菜单，允许你以不同的方式编辑或向面板添加内容。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_32_0.png)


    - **第 6 步** 在桌面右键点击弹出上下文菜单，选择“自定义”，然后点击新打开窗口底部的“桌面设置”链接。这会打开一个新窗口，你可以在其中编辑桌面图标。如果你连接了多个显示器的设置，还可以选择由哪个显示器显示图标。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_32_1.png)


    - **第 7 步** 例如，如果你点击“修改面板”选项，可以移除组件、移除面板、添加新面板，并清除所有当前存在的所有小应用（Applets）。顺便提一下，小应用是设计用于运行并适配到
    Cinnamon 面板的应用程序。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_32_2.png)


    - **第 8 步** 点击菜单和系统设置图标，打开对应的设置图标。在这里，你可以控制并编辑 Linux Mint Cinnamon 的外观和工作方式，还可以添加新用户、管理防火墙并启用辅助功能选项。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_32_3.png)


    - **第 9 步** 如果你在桌面任何地方右键点击，你会看到一组选项，允许你进一步添加或查看桌面内容。这与 Windows 非常相似，这就是为什么 Mint
    是前 Windows 用户的一个良好选择。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_32_4.png)


    - **第 10 步** 简而言之，Linux Mint 可以配置得看起来非常非凡。有许多关于它可以变得多好以及可以实现什么的示例。你可以根据自己的需要保持简单或复杂，添加不同的组件和调整，或者仅仅保持其朴素易读。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_32_5.png)


    ## 安装 Linux Mint 后做的 10 件事


    Linux Mint 是一个开箱即用的非常精良的发行版，但与大多数 Linux 发行版一样，可以通过一些调整来改进它的工作方式。虽然这些是针对 Mint 的特定调整，但大多数可以应用于其他发行版。


    ## LINUS 调整


    这些安装后的操作中有是强烈建议的，而另一些只是方便的补充，用于微调系统或添加自定义内容。


    **第 1 步** 第一个也是最重要的安装后操作是更新系统。点击桌面右下角时间和日期旁边的面板上的图标。这将启动“更新管理器”。


    **第 2 步** Linux Mint 为用户提供了三级更新方法：不要弄坏我的电脑、优化稳定性和安全性、以及始终更新一切。推荐的选项是“优化稳定性和安全性”，它只更新安全的、必要的补丁，而不会影响核心内核的关键元素。


    **第 3 步** Linux 文件系统对于以前 Windows 用户来说可能令人困惑，为了让你更了解它的工作原理，我们建议你关注桌面上的“主”图标。优化稳定性和安全性选项只更新安全的、必要的补丁。


    | 选项 |

    | :--- | :--- |

    | 不要弄坏我的电脑 | |

    | 优化稳定性和安全性 | |

    | 始终更新一切 | |


    **第 4 步** 在“更新管理器”中，点击更新按钮。


    **第 5 步** 在“软件源”中，选择距离你当前位置最近的服务器。


    | 软件源 |

    | :--- | :--- |

    | 主 (美国) | http://archive.ubuntu.com/ubuntu |

    | 附加存储库 (美国) | |

    | 维护 | |

    | 可选 | |

    | 不稳定软件包 | |


    **第 6 步** 在“更新管理器”中，点击安装更新，输入你的密码。更新完成后，你可能需要重启 Linux Mint。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_33_0.png)


    **第 7 步** 点击“驱动管理器”，它会分析可用的内容并向你展示检测到的硬件驱动。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_33_1.png)


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_33_2.png)


    **第 8 步** 点击菜单，找到“终端”图标，然后输入 `sudo apt-get install libdvd-pkg`，按回车并输入密码。这将启用 DVD
    播放。


    **第 9 步** 这一调整有助于内存小于 4GB 的系统提高速度。滚动到你刚刚打开的文件末尾，添加以下新行：


    ```

    # 将交换分区积极性降低到一个合理的水平

    vm.swappiness=10

    ```

    点击“文件 > 保存”，然后点击“退出”。重启 Linux Mint，你应该能注意到性能的轻微提升。


    **第 10 步** 在这个数字时代，安全是一个关注点。Linux Mint 是一个安全的系统，建议始终尝试改进它。点击菜单搜索“防火墙”，打开“防火墙配置”图标并输入密码。在防火墙窗口中，将滑块拨到“开启”。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_34_3.png)


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_34_4.png)


