- md: "\n## Structure of a C++ Program\n\nC++ has a very defined structure and way\
    \ of doing things. Miss something out, even as small as a semicolon, and your\
    \ entire program will fail to be compiled and executed. Many professional programmers\
    \ have fallen foul of sloppy structure.\n\n## #INCLUDE <iostream>\n\nLearning\
    \ the basics of programming, you begin to understand the structure of a program.\
    \ The commands may be different from one language to the next but you can start\
    \ to see how the code works.\n\n```\nC++ was invented by Danish student Bjarne\
    \ Stroustrup in 1979, as a part of his PhD thesis initially C with Classes, it\
    \ was called C++, which added features to the already popular C programming language,\
    \ while making it more user-friendly environment through a new structure.\n```\n\
    \n```\nBjarne Stroustrup,\ninventor of C++.\n```\n\n```\nint main() initiates\
    \ the declaration of a\nfunction, which is a group of code statements\nunder the\
    \ name \"main\". All C++ code begins at the main function,\nregardless of where\
    \ it actually lies within the code.\n```\n\n```\nhelloworld.cpp\n1 #include <iostream>\n\
    2 int main()\n```\n\nThe structure of a C++ program is quite precise. Every C++\
    \ code begins with a directive: #include. The directive instructs the pre-processor\
    \ to include a section of the standard C++ code. For example: #include <iostream>\
    \ includes the header file to support input/output operations.\n\n**BRACES** The\
    \ open brace (curly brackets) is something that you may not have come before,\
    \ especially if you're used to Python. The open brace indicates the beginning\
    \ of the function and contains all the code that belongs to that function.\n\n\
    ```\nhelloworld.cpp\n1 #include <iostream>\n2 int main()\n3 {\n4\n5\n6\n7\n8}\n\
    ```\n\n**COMMENTS** Lines that begin with a double slash are comments. This means\
    \ they won't be executed in the code and are ignored by the compiler. Comments\
    \ are designed to help you, or another programmer looking at your code, and explain\
    \ what's going on. There are two types of comment: // multiple line comments and\
    \ // a single line.\n\n> // The chevrons used here are insertion operators. This\
    \ means whatever follows the chevrons is inserted into the std::cout statement.\
    \ In this case they're the 'Hello, world!' which is to be displayed on the screen\
    \ when compile and execute the code.\n\n```\nhelloworld.cpp\n#include <iostream>\n\
    int main() {\n    // My first C++ program\n}\n```\n\n```\nhelloworld.cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n    // My first C++ program\n\
    cout << \"Hello, world!\";\n}\n```\n\n**STD** stands for something quite different,\
    \ in C++ it means Standard. It is part of the Standard Namespace in C++, which\
    \ covers a number of different statements and commands. You can leave the std::\
    \ part of the code but it must be declared at the start with `using namespace\
    \ std`, not both. For example:\n\n**OUTPUTS** Leading on, \"Hello, world!\" is\
    \ what you want to appear on the screen when the code is executed. You can enter\
    \ whatever you like, as long as it's inside the quotation marks. Sometimes brackets\
    \ are needed, depending on the compiler. The \\n part inserts a new line to be\
    \ inserted.\n\n```\nhelloworld.cpp\n#include <iostream>\nint main() {\n    //\
    \ My first C++ program\nstd::cout << \"Hello, world!\\n\";\n}\n```\n\n```cpp\n\
    // My first C++ program\ncout << \"Hello, world!\\n\"\n```\n\n**COUT** In this\
    \ example we're using cout, which is a part of the Standard Namespace, hence why\
    \ it's there, as you're to use it for particular namespace. Use std::cout which\
    \ displays, or prints something to the screen. If you leave it out you have to\
    \ declare it at the start of the code, as mentioned previously.\n\n**; AND )**\
    \ Finally you can see that lines within a function block (except comments) end\
    \ with a semicolon. This marks the end of the statement; all statements in C++\
    \ must have one at the end or the compiler fails to build the code. The very last\
    \ has the curly brace to indicate the end of the function main.\n\n```\nhelloworld.cpp\n\
    #include <iostream>\nusing namespace std;\nint main() {\n    // My first C++ program\n\
    cout << \"Hello, world!\\n\";\n}\n```\n\n## Compile and Execute\n\nYou've created\
    \ your first C++ program and you now understand the basics behind the structure\
    \ of one. Let's get things moving and compile and execute, or run if you prefer,\
    \ the program and see how it looks.\n\n## GREETINGS FROM C++\n\nCompiling and\
    \ executing code from within Geany is remarkably simple and just a matter of clicking\
    \ a couple of icons and seeing the result. Here's how you do it.\n\n- STEP 1:\
    \ Open Geany, if you haven't already, and load up the previously saved Hello World\
    \ you created. Ensure that there are no visible errors, such as a missing semicolon\
    \ at the end of the code-line:\n- STEP 2: If you are ready, click the menu bar\
    \ to the top of the Geany window. Note that midway along the line of icons there's\
    \ a red brick icon. This is Build, which clicked runs through the code, checking\
    \ the C++ standards to see if there are any errors that stop it from running.\n\
    - STEP 3: When you click the Icon, the pane at the bottom of the Geany interface\
    \ dials some results. If all is well, you will see a successful compilation, if\
    \ not Geany issues an error along with the line error was found.\n- STEP 4: With\
    \ the code successfully built, it's now time to execute it. Next to the Build\
    \ icon there's a airplane icon, this is the Run icon. You can't run code that\
    \ hasn't been previously built or has an error in place. Click the Run icon.\n\
    \n```cpp\nhelloworld.cpp\n#include <iostream>\n\nint main() {\n\n    // My first\
    \ C++ program\n    std::cout << \"Hello, world!\\n\";\n}\n```\n\n```cpp\nhelloworld.cpp\n\
    #include <iostream>\n\nint main() {\n    // My first C++ program\n    std::cout\
    \ << \"Hello, world!\\n\";\n}\n```\n\n## Compile and Execute\n\n- **STEP 5**:\
    \ When you run, the code executes and a simple window appears displaying the results.\
    \ In this simple example you can see your output between the quotes.\n- **STEP\
    \ 6**: Press the Enter command closes the box, returning to Geany. Lately after\
    \ the #include line, enter `using namespace std;`.\n- **STEP 7**: In order to\
    \ apply the changes you need to save the file before just execute it again. Go\
    \ through the file by clicking the Icon.\n- **STEP 8**: As mentioned previously,\
    \ you don't need to have std:: declared at the start of the code. Now create a\
    \ deliberate mistake to see what happens. Remove the semicolon from the `cout`\
    \ line.\n- **STEP 10**: Replace the semicolon under the `cout` line, enter a new\
    \ line to Build and Run the code to display your output.\n\n```cpp\nhelloworld.cpp\n\
    #include <iostream>\n\nint main() {\n    // My first C++ program\n    std::cout\
    \ << \"Hello, world!\\n\";\n}\n```"
  mdcn: "\n\n## C++ 程序的结构\n\nC++ 具有非常明确的结构和处理方式。漏掉任何内容，即使是一个微小的分号，你的整个程序将无法编译和执行。许多专业程序员都曾在这疏忽的结构上吃过亏。\n\
    \n## #INCLUDE <iostream>\n\n在学习编程基础时，你开始理解程序的结构。命令在不同语言之间可能有所不同，但你可以开始看到代码是如何运作的。\n\
    \n```\nC++ 是由丹麦学生 Bjarne Stroustrup 于 1979 年发明的，最初作为他博士论文的一部分称为“带类的 C 语言”，后来被称为\
    \ C++，它在已经流行的 C 编程语言的基础上添加了功能，同时通过新的结构使其具有更加用户友好的环境。\n```\n\n```\nBjarne Stroustrup,\n\
    C++ 的发明者。\n```\n\n```\nint main() 启动了一个函数的声明，它是名为 \"main\" 的的一组代码语句。所有的 C++ 代码都从\
    \ main 函数开始，无论它实际上位于代码的哪个位置。\n```\n\n```\nhelloworld.cpp\n1 #include <iostream>\n\
    2 int main()\n```\n\nC++ 程序的结构非常精确。每段 C++ 代码都以一个指令：#include 开始。该指令指示预处理器包含一段标准的\
    \ C++ 代码。例如：#include <iostream> 包含了支持输入/输出操作的头文件。\n\n**大括号（BRACES）** 左括号（大括号）是你之前可能没见过的东西，特别是如果你习惯了\
    \ Python 的话。左括号表示函数的开始，并包含了属于该函数的所有代码。\n\n```\nhelloworld.cpp\n1 #include <iostream>\n\
    2 int main()\n3 {\n4\n5\n6\n7\n8}\n```\n\n**注释（COMMENTS）** 以双斜杠开头的行是注释。这意味着它们不会在代码中执行，并且会被编译器忽略。注释的设计是为了帮助你或查看你代码的其他程序员，并解释正在发生什么。注释有两种类型：//\
    \ 多行注释和 // 单行注释。\n\n> // 在这里使用的尖括号是插入运算符。这意味着尖括号后的任何内容都会插入到 std::cout 语句中。在这种种情况下，它们是\
    \ 'Hello, world!'，它将在编译和执行代码时显示在屏幕上。\n\n```\nhelloworld.cpp\n#include <iostream>\n\
    int main() {\n    // 我的第一个 C++ 程序\n}\n```\n\n```\nhelloworld.cpp\n#include <iostream>\n\
    using namespace std;\nint main() {\n    // 我的第一个 C++ 程序\ncout << \"Hello, world!\"\
    ;\n}\n```\n\n**STD** 代表一个完全不同的含义，在 C++ 中它意味着“标准”（Standard）。它是 C++ 标准命名空间（Standard\
    \ Namespace）的一部分，涵盖了许多不同的语句和命令。你可以省略代码中的 std:: 部分，但它必须在开头用 `using namespace std`\
    \ 声明，不能两者都用。例如：\n\n**输出（OUTPUTS）** 接下来，\"Hello, world!\" 是你希望在代码执行时出现在屏幕上的内容。你可以输入任何喜欢的内容，只要它在引号内即可。取决于编译器，有时需要括号。\\\
    n 部分会插入一个换行。\n\n```\nhelloworld.cpp\n#include <iostream>\nint main() {\n    //\
    \ 我的第一个 C++ 程序\nstd::cout << \"Hello, world!\\n\";\n}\n```\n\n```cpp\n// 我的第一个\
    \ C++ 程序\ncout << \"Hello, world!\\n\"\n```\n\n**COUT** 在这个例子中，我们正在使用 cout，它是标准命名空间的一部分，这就是为什么它在那里的，因为你要为特定的命名空间使用它。使用\
    \ std::cout 在屏幕上显示或打印某些内容。如果你省略了它，如之前提到的，你需要在代码开头声明它。\n\n**分号 ; 和括号 )** 最后你可以看到函数块内的行（注释除外）都以分号结尾。这标记了语句的结束；C++\
