    # Python on Linux


    ## How to Set Up Python in Linux


    While the Raspberry Pi''s operating system contains the latest, stable version
    of Python, other distros don''t come with Python 3 preinstalled. If you''re not
    going down the Pi route, then here''s how to check and install Python for Linux.


    Linux is a versatile operating system that it''s often difficult to nail down
    one way of doing something. Different distributions [go] about installing software
    in different ways, so we''re sticking with Linux Mint for this particular tutorial.


    - **STEP 1** First need to ascertain which version of Python is currently installed
    in your Linux system. To begin, drop into a Terminal session from your desktop
    or hit the Ctrl+Alt+T keys.


    - **STEP 2** Next enter `python --version` in the Terminal. You should have the
    output detailing version 2.x of the Python. By default, most distros come with
    Python 2 and 3, so there''s plenty of code out there available for Python 2. Now
    enter: `python3 --version`.


    ```

    File Edit View Search Terminal Help

    david@david-Mint:~ $ python --version

    Python 2.7.15

    david@david-Mint:~ $ python3 --version

    Python 3.6.7

    ```


    - **STEP 3** In our case we have both Python 2 and 3 installed; as long as Python
    3.x is installed, then the code is worth checking to see if the distro has been
    updated with the latest versions, so enter: `sudo apt-get update && sudo apt-get
    upgrade` to update the system.


    Once the update and upgrade are complete, `python3 --version` to verify if Python
    3.x is installed or updated; as long as you have Python 3.x, you''re running the
    most recent version. After 3, check for patches and future updates. If you''re
    uncertain but check for new elements.


    ```

    File Edit View Search Terminal Help

    david@david-Mint:~ $ python --version

    Python 2.7.15

    david@david-Mint:~ $ python3 --version

    Python 3.6.7

    ```


    ```

    ubuntu@ubuntu-linux:~ $ sudo apt-get upgrade

    Reading package lists...Done

    Building dependency list from http://archive.ubuntu.com/ubuntu bionic In

    Reading security information from http://security.ubuntu.com/ubuntu bionic InRelease

    All packages are up to date.

    The following packages were UPGRADED:

    libarchive-dev (3.7.2-ubuntu1 -> 3.7.2-ubuntu2)

    libbz2-dev (1.0.8-ubuntu2 -> 1.0.8-ubuntu5)

    libncurses-dev (5.4-2-ubuntu1 -> 5.4.2-ubuntu2)

    libncursesw5 (5.4-2-ubuntu1 -> 5.4.2-ubuntu2)

    libsqlite3-dev (3.9.0-06 -> 3.9.0-ubuntu2)

    libsqlite3 (3.9.0-06 -> 3.9.0-ubuntu2)

    6 packages upgraded, 0 new installed, 0 to remove and 0 upgraded.

    15.4 MB archive will be downloaded.

    After this operation, you may need to run ''sudo apt-get upgrade'' to handle any
    remaining updates.

    ```


    ## How to Set Up Python in Linux


    - **STEP 5** However, if you want the latest edge version, you need to build Python
    from source. Start by entering these commands into the Terminal:

    ```bash

    sudo apt-get install build-essential

    sudo apt-get install readline-dev libncursesw5-dev libssl-dev libsqlite3-dev libdbm-dev
    libdbm5-dev libdb6-dev

    ```

    ```bash

    Edit View Search Help

    david-david@ubuntu-desktop:~ sudo apt-get install build-essential

    Building tree...

    Reading package lists...Done

    Reading the latest version (1).

    The following new packages will be installed

    0 to upgrade, 0 to install, 0 to remove and 0 upgraded.

    After this operation, 428 MB of additional space will be used. Do you want to
    continue? [Y]

    ```


    - **STEP 6** Open your Linux web browser and go to the Python page: https://www.python.org/.
    Downloads the version you want under the Source button. This opens a download
    page; choose a location and download the source tar.


    - **STEP 7** In the Terminal, cd to the downloaded tar. Then unpack the Python
    source code with: `tar -xvf python-3.7.y.tar.gz`. Then cd to the newly unpacked
    folder with `cd Python-3.7.y/`.


    - **STEP 8** Within the Python folder, enter:

    ```bash

    ./configure

    sudo make install

    ```

    This could take a while depending on the speed of your computer. Once finished,
    use `python3.7 --version` to check the installation. You now have Python 3.7 installed
    alongside older Python 3.x and Python 2.


    If you want a build with all stable optimizations (PIC, etc.), run `./configure
    --enable-optimizations`.


    ```text

    Checking against OpenSSL... no

    checking for OpenSSL... yes

    checking for readline... yes

    configuring... done

    checking for libncurses... yes

    checking for zlib... yes

    checking for libsqlite3... yes

    checking for libdbm... yes

    checking for libdb6... yes

    creating shared libraries... done

    creating setup.cfg

    creating Makefile

    ```


    - **STEP 9** For the IDLE, you need to enter the command in the Terminal:

    ```bash

    sudo apt-get install idle3

    ```

    The IDE will now be started with the command idle3. Note that IDLE runs from the
    one you installed from source.


    - **STEP 10** You also need PIP (Pip Installs Packages) which is a tool to help
    install modules and extras.

    ```bash

    sudo apt-get install pip3

    ```

    When finished, close the Terminal and Python 3.x will be available via the Programming
    section in your system''s.


    ```bash

    Edit View Search Help

    david-david@ubuntu-desktop:~ sudo apt-get install pip3

    Building tree...

    Reading package lists...Done

    Reading the latest version (1).

    The following new packages will be installed

    pip3 python3-setuptools python3-wheel

    pip-pywheel-python3-libncurses5-dev libpython3-dev

    0 to upgrade, 4 to install, 0 to remove and 0 upgraded.

    After this operation, 428 MB of additional space will be used. Do you want to
    continue? [Y]

    ```


    ## Starting Python for the First Time


    We''re going to use the Raspberry Pi as our hardware platform. The latest version
    of Raspbian comes preinstalled with Python 3, version 3.4.2, so long as we have
    version 3, all our code will work. We''re not to get into the details of getting
    the Raspberry Pi up and running; however, once you''re ready, fire up your Pi
    and get coding.


    1. With the Raspberry desktop loaded, click on the Menu > Programming > Python
    3 IDLE. This opens the Shell. Windows and Mac users can find the Shell via Finder.

    2. For example, in the Shell after pressing Enter, the next line displays the
    answer. Basically, Python has taken ''code'' and produced the relevant output.
    The Shell is where you enter code and see the responses of code you''ve programmed
    into. It is a kind of sandbox where you''re able to try out simple code. The Shell
    acts very much like a calculator since code is basically a series of mathematical
    interactions with the system. Integers, which are infinite sequence of numbers
    can be easily edited, subtracted, multiplied and so on.


    - **STEP 6** This is a little more like it, if you''ve just printed your first
    bit of code. The Print command is fairly self-explanatory. it prints things. Python
    3 requires the brackets as well as order to output to the screen, in this case
    let the "Hello everyone" be:


    ```

    >>> print("Hello everyone!")

    Hello everyone!

    ```


    - **STEP 8** The Python IDE is a configurable environment. If you don''t like
    the way colors are represented, you can then change them via Options -> Configure
    IDE and clicking on the Highlighting tab. However, we recommend that, as you''re
    not seeing with the screen as our screenshots, enter it into the IDE as you view
    in previous steps.


    - **STEP 9** Just like most programs, regardless of the operating system, there
    are numerous shortcuts We don''t have room for all here but using the Options
    -> Configure IDE and under Keys tab, you can see a list of current bindings.


    - **STEP 7** You may have noticed the coding within the Python IDE. The colours
    represent different elements of Python that change:


    - Black - Data and Variables

    - Blue - User Functions

    - Green - Strings

    - Red - Comments

    - Purple - Functions

    - Light - Error Messages

    - Orange - Commands


    - **STEP 10** The Python IDE is a power interface and that''s actually been built
    in Python using all of the Shell, if you want to know more we recommend a few
    minutes to www.python.org/library/idle.html, which details many of the IDE''s
    features.


    ## IDLE Colour


    | Color | Use for | Examples |

    |---|---|---|

    | Black | Data & variables | 23.4 area |

    | Green | Strings | "Hello World" |

    | Purple | Functions | print() |

    | Orange | Commands | get_args() |

    | Red | Comments | # Variable |

    | Light red | Error messages | SyntaxError: |

