    # 在虚拟环境中安装 Linux


    随着 Oracle VirtualBox 运行就绪，接下来的任务是创建一个虚拟机（VM）环境，并在其中安装 Linux。此过程不会影响你当前安装的操作系统，这正是为什么虚拟机是一个很棒的选择。


    ## 创建虚拟机


    创建虚拟机有许多选项可以选择。不过现在，让我们设置一个足够运行 Mint Cinnamon 且运行良好的虚拟机。


    - 步骤 1：在 VirtualBox 打开的情况下，点击应用程序右上角的“新建”图标。这将打开新的虚拟机向导。

    - 步骤 2：在接下来的“名称”框中，输入 Linux Mint，VirtualBox 应该自动选择 Linux (Ubuntu 64-bit) 作为“版本”；如果没有，请使用下拉框选择正确的设置（记住
    Mint 是基于 Ubuntu 的）。准备好后点击“下一步”。

    - 步骤 3：下一部分定义了分配给虚拟机的系统内存（或 RAM）。这部分内存取自计算机上安装的可用内存，因此不要给虚拟机分配过多内存。例如，我们安装了 8GB
    内存，分配了 2GB 给虚拟机。准备好后，点击“下一步”。

    - 步骤 4：此部分是你开始创建虚拟机用于安装 Mint 的虚拟硬盘的地方。默认选项“创建虚拟硬盘”正是我们想要的。点击“下一步”进行创建。

    - 步骤 5：点击“创建”后，会弹出一个窗口，它会询问你想要创建什么种的虚拟硬盘。我们将使用默认的 VDI（虚拟磁盘镜像），因为其他格式用于将虚拟机从一个应用程序移动到另一个。确保选择了
    VDI 并点击“下一步”。

    - 步骤 6：关于使用“动态大小”还是“固定大小”虚拟磁盘的问题对于初学者来说可能有些困惑。动态分配的硬盘是一个更灵活的选项，不会在你的虚拟硬盘中占用过多空间。确保选择了“动态”并点击“下一步”。

    - 步骤 7：虚拟硬盘是一个单一文件夹，最大到你在本节中指定的尺寸。该位置有足够的可用空间。例如，我们将在 D:\ 驱动上使用更大的存储选项，命名为 Linux
    Mint，并为虚拟硬盘分配 25.50GB 的空间。

    - 步骤 8：虚拟机的初始设置完成后；你现在应该看到 VirtualBox 应用程序。在开始之前，点击“设置”按钮，并在“常规”部分点击“高级”选项卡。使用下拉菜单，将“共享剪贴板”和“拖放”设置为“双向”。

    - 步骤 9：点击“系统”部分，然后点击“处理器”选项卡。根据你的 CPU，你可以为主机系统分配任意数量的核心：例如两个 CPU。现在在“显示”部分滑动调整“显存”，然后勾选“启用
    3D 加速”。点击“确定”提交并进入下一步。

    - 步骤 10：点击“启动”按钮，并在“选择启动项”窗口中使用“浏览”按钮（绿色箭头）加载已下载的 Mint ISO 镜像；然后点击“使用 Linux Mint
    运行环境启动”。你现在可以使用标准要求安装 Linux 了。


    ## 了解 Linux


    “任何人都可以构建快速处理器。秘诀在于构建一个快速的系统。” 西摩尔·克雷（Seymour Cray，电气工程师，超级计算机创始人）


    我们在这里使用 Linux Mint 作为指南，因为对于 Windows 用户来说，它是一个易用的发行版。它也是最完善、文档最全的 Linux发行版之一，并拥有极佳的选择。在本节中，我们将介绍
    Mint 菜单和桌面环境、它的工作原理以及你可以做什么。想要创建另一个用户或发现如何上线吗？请继续读下去。


    | 页面 | 主题 |

    | :--- | :--- |

    | 30 | Cinnamon 菜单简介 |

    | 32 | 在 Cinnamon 桌面中导航 |

    | 34 | 安装 Linux 后要做的 10 件事 |

    | 36 | 你知道吗... |

    | 38 | 创建用户 |

    | 40 | 自定义桌面 |

    | 42 | 上线 |


    ## Cinnamon 菜单简介


    现在你已经安装了 Linux，是时候环顾看看了。不过，如果你正在使用 VirtualBox，你将收到一个关于“软件渲染”的通知；这里是修复方法。


    ## CINNAMON VIRTUALBOX 修复方案


    你已经查看了一些功能、插入和删除操作，但还有一些功能可以应用于字符串。


    - 步骤 1：在我们开始之前，我们假设你是在 VirtualBox 中遇到了这个问题。“软件渲染”消息出现在桌面的右上角。要修复此问题，点击 VirtualBox
    中的“设备”，然后点击“插入增强功能...”。

    - 步骤 2：增强功能光盘包含 VirtualBox 的驱动程序，包括视频硬件。当它加载时，你会收到一个“软件需要运行”的通知，带有两个选项：“取消”和“运行”。点击“运行”按钮并输入你的
    Linux 密码。

    - 步骤 3：过了一会儿后，你会自动进入一个名为“终端”的命令行。这详细说明了新 VirtualBox 驱动程序的安装、旧驱动程序的删除以及最新版本的安装。这过程不会花费很长时间，完成后，你将被提示进入终端。


    ```

    $ ./VBoxAdditions.run Guest Additions for Linux...

    Decompressing VirtualBox-1 Guest Additions...

    Installing modules...

    VBoxAdditions: Starting the Guest Additions.

    Press return to close this window.

    ```

    - 步骤 4：增强功能光盘在桌面上，因此右键点击它，然后滚动到菜单。你现在可以通过点击菜单、左下角的“重启”按钮来重启 Linux。这样问题就解决了。


    ## 菜单中的 CINNAMON


    现在 VirtualBox 的软件渲染问题已经解决了，让我们看看 Mint 菜单及其工作原理。记住，这是针对 Cinnamon 的，其他发行版看起来和行为会有不同。


    - 步骤 1：首先，你可能已经注意到了登录 Linux 时弹出的欢迎屏幕。花点时间浏览一下选项，阅读“初学”等。浏览完后点击窗口角的“X”关闭它。

    - 步骤 2：你已经使用过 Mint 菜单重启了系统，当你第一次使用运行环境时，点击菜单按钮并将鼠标悬停在中间列的“办公”项上。这将更改右侧列中显示的图标，详细列该部分下安装的应用程序。

    - 步骤 3：从菜单启动任何应用程序只需找到并点击即可。例如，在“办公”部分下，点击“LibreOffice”。Writer 是 Linux Mint 预装的文字处理器。它可以以
    Microsoft Word 格式打开和保存，且功能几乎相同。

    - 步骤 4：再次打开菜单，但这次将鼠标指针悬停在“图形”上，然后点击“GNU 操控程序 (GIMP)”。GIMP 是一个强大的处理程序，效果可能与 Photoshop
    相当，但需要更多努力才能获得想要的结果。不过，它值得花时间去掌握。

    - 步骤 5：如果你正在寻找特定的功能或应用程序（例如设置打印机），点击 Mint 菜单顶部的搜索框。开始输入你想要的应用程序或功能（例如“打印机”），Mint
    菜单会在下方显示相关选项。这适用于现代 Linux 菜单，无论是哪种发行版。

    - 步骤 6：悬停在右侧列出的任何应用程序上并右键点击，将出现选项列表：“添加到桌面”、“添加到收藏”和“卸载”。大多数这些选项在这种情况下都是显而易见的。只需“添加到收藏”即可将应用程序放在左侧的快速访问列中。


