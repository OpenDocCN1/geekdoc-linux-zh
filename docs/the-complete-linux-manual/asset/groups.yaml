    ## TERMINAL VS UPDATE MANAGER


    Why use the terminal? There are different ways to install apps and programs on
    Linux. You can opt for the graphical route, using Software Manager, or you can
    use the Terminal. Often, the Terminal provides better control over the software
    being installed and sometimes, you may have no choice. By using the terminal,
    apt-get handles dependencies between versions, so you''re up to date. From the
    point of user, if you update Mint regularly, you will be up to date. If you''re
    looking for latest packages, then it''s best to opt for the Software Manager instead.


    ## Install Apps via the Terminal – Part 1


    ### COMMAND LINE INSTALLS


    - **STEP 1** Installing apps from the Terminal is often relatively simple. First,
    do you need to make sure your system is up to date. Do this in the Terminal and
    enter: `sudo apt-get update && sudo apt-get upgrade`. Enter your password and
    accept any updates.

    - **STEP 2** Just''ve seen, `sudo apt-get update/upgrade` and so on to upgrade
    the software that''s already installed on the system. Do you install more apps
    though? It so happens that it''s extraordinarily simple. First, you need an app
    to install, let''s use Stella. Enter: `sudo apt-get install stella`.

    - **STEP 3** You need to enter y to confirm the installation, which takes up around
    5.5MB of storage. Once Stella installed, you can see that Mint has automatically
    generated the Games category in the Menu as well as the shortcut.

    - **STEP 4** Sometimes, when installing software, you need to add the app''s Repository.
    The repository, or repo, is simply the remote server where the software is held,
    along with all its dependencies (the vital libraries and books it needs to function).
    Start by this: `sudo add-apt-repository ppa:peter-levi/ppa` Press Enter to add
    and add the PPA (Personal Package Archive).


    ```

    File Edit View Search Terminal

    davidhavd-mint ~ %

    $ sudo add-apt-repository ppa:peter-levi for the variety wallpaper changer

    More info: https://launchpad.net/~peter-levi/ubuntu/ppa

    Press Enter to continue or to cancel.

    ```

