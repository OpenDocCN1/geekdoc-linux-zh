    ## 选择哪个发行版？


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_16_0.png)


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_16_1.png)


    预装了许多工具，用户可以对自己的网络进行渗透测试。曾经有一个名为“汉娜·蒙娜”（Hannah Montana）的 Linux 发行版，但我们越少提越好。重点是，总有一个适合你的发行版。


    奇怪的是，很多高端技术用户发现自己又回到了起点，使用像 Mint 这样的发行版。主要原因通常是因为它易于使用，而且环境稳定。一旦你彻底了解了系统，难道你不想一直去修复潜在的问题吗？对于我们大多数人来说，逻辑选择是选择一个简单但强大到足以实现你所有要求的发行版，这就是
    Linux 的意义。


    不言说，一旦你掌握了相当高水平的 Linux（可能是一个高级用户），你就会想要扩展技能，并基于 Arch、Debian 或其他发行版构建自己的 Linux
    发行版。这样做涉及大量的命令行知识，以及关于 Linux 系统如何工作以及如何与计算机硬件交互的知识。你需要分区、安装、配置、改进，并最终安装你需要的应用程序和程序。这需要时间，而且你将学到很多技能。


    最后，这完全取决于你，取决于个人选择。你可能会发现，在学习了本书的教程后，你不喜欢 Mint 或 Cinnamon 桌面。你可能更喜欢 Ubuntu、Debian
    或 openSUSE；这就是 Linux 的魅力所在。你可以自由地改变你想要的东西，在不同发行版之间切换，而不会受到成本或访问限制的惩罚。


    最终，你认为自己是一个技术型 Linux 用户，但从不认为自己是专家，毕竟我们一直在学习新知识。你可以从零开始构建自己的发行版，帮助其他 Linux 用户解决问题，这甚至可能有助于发行版在测试阶段或此后的改进。下一次什么时候？


    关于“哪个发行版”这个问题的答案是：任何喜欢的都可以；它可以根据你的需要变得复杂或简单，只要它能实现你想做的功能，就是完美的。


