    correctly, compare a set of instructions and simply work out IF something is present,
    THEN do something else. Create a new script `greeting2.sh` and enter the text
    in the script editor below


    +   - STEP 3 The next line, ELSE, is what happens if the variable doesn''t equal
    ''David''. In this case it simply outputs to the screen now named ''Hello...''.
    The line, the fi statement, is what will end the loop. If you have an if command
