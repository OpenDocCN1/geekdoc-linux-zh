    >> 3

    >> True

    >> 6

    >> True

    >> 7

    >> False

    >> 8

    >> False

    >> 9

    >> False

    >> 10

    >> False

    >> bin(3)

    ```


    # STEP 10


    Execute the code from Step 9, and you can see the result of True or False statements,
    depending on the defining values: 6 and 7. It''s an extension of what you''ve
    learned, an important part of programming.


