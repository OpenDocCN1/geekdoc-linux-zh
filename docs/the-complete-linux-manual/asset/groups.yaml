    ## Update Mint via the Terminal


    Up to now you''ve used the shield icon to launch Mint Update Manager and in order
    to update your system and upgrade the currently installed apps, tools and other
    elements. However, you can also accomplish a complete system update and upgrade
    from the Terminal.


    ## USING APT-GET


    To update and upgrade the Terminal you use the APT (Advanced Packaging Tool) it''s
    a powerful command and combines different elements on its use.


    - **STEP 1** Start by opening a new Terminal or if you already have one, clear
    its contents with the command. This starts off with a clean state to work on.

    - **STEP 3** Apt-get is used to upgrade the software in Mint, as well as Ubuntu
    and other Debian-based distros. Using Update element retrieves new packages and
    updates the list of source files. Upgrade and downloads them to the latest versions
    of those Files. To start the Update and Upgrade process, enter: `sudo apt-get
    update`, followed by your password.

    - **STEP 2** Enter, `apt-get` into the Terminal. This brings up a list of the
    most used apt-get commands, along with a brief description of what the command
    does. If it doesn''t make any sense at this time.

    - **STEP 4** Notice the ask of the sudo command. The sudo once means Substitute
    User: Do It means it''s more appropriate as administrative user (super User) uses
    APT (Advanced Packaging Tool) to get Updates. Now run: `sudo apt-get upgrade`.


    - **STEP 5** Depending on the state of your updates, if you have already been
    installed, if you want to apply the results of the sudo apt-get upgrade command.
    You can press Y to accept and continue. What is happening here is that apt-get
    has some updated software to install for Mint, and you''re asking it okay.

    - **STEP 7** Essentially, that your system is now up to date according to the
    available list of packages from the apt-get update command. You can run through
    the process one more time, just if you see everything you want. To recap, enter:
    `sudo apt-get update`, press Enter, then type: `sudo apt-get upgrade` Press.

    - **STEP 6** There''s likely to be a long list of things which don''t worry. The
    files for the upgrade have been downloaded, unpacked, processed, installed and
    set up. There''s likely being when you perform an update, with the smallest package.

    - **STEP 8** Interestingly, Linux, among others, offers you the chance to share
    changes with others, in this example, we can use `sudo apt-get update && sudo
    apt-get upgrade`. The double amass is capable of handling the changes and works
