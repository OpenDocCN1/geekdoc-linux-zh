    Hello\")\nfirstname=input(\"What is your first name?\")\nprint(\"Thanks.\")\n\
    surname=input(\"And is your surname?\")\n```\n\n- 步骤 2 保存并执行代码，正如你毫无疑问猜到的那样，在\
    \ IDLE Shell 中，程序会询问你的名字，并将其存储在变量中（firstname, surname）：\n\n- 步骤 3 现在由于我们已经将用户的名字存储在两个变量中，我们可以随时随地调用它们：\n\
    \n```python\nprint(\"Welcome\", firstname, surname, \". I hope you're well today.\"\
    )\n```\n\n- 步骤 4 运行代码，你会发现一个小问题，姓氏后面的句号留了一个空格。为了消除这个问题，我们可以在逗号处添加一个加号，代码如下：\n\n\
    ```python\nprint(\"Welcome\", firstname, surname + \". I hope you're well today.\"\
    )\n```\n\n- 步骤 5 你并不总是需要在 input 命令中包含引号文本。例如，你可以询问用户名字，并在行中留空输入：\n\n```python\n\
    print(\"Hello. What's your name?\")\nname=input()\n```\n\n- 步骤 6 上一步的代码通常被认为比在\
    \ input 命令中带有固定长度的文本要更好一点，但这不是一个板成不变的规则，因此在这些情况下你可以根据自己的喜好操作。扩展代码如下如下：\n\n```python\n\
