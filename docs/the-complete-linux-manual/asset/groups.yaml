  - "[PAGE 130]\n\n# C++ COMMENTS\n\nCommenting in C++ involves using a double forward\
    \ slash '// or a forward slash and an asterisk '*'. You've already seen brief\
    \ examples but this is how it works.\n\nUsing the Hello World code as an example,\
    \ you can easily comment on different sections of the code using the forward slash:\n\
    \nBe careful when commenting, especially with block comments - it's very easy\
    \ to forget to add the closing asterisk and forward slash to negate any code that\
    \ falls inside the comment block.\n\n```\n// My first C++ program cout << \"Hello,\
    \ world!\"\nhelloworld.cpp\n#include <iostream>\nusing namespace std;\nint main()\
    \ {\n    // My first C++ program\n    cout << \"Hello, world!\"\n    cout << \"\
    Greetings from C++\"\\n    return 0;\n}\n```\n\n```\nhelloworld.cpp x\n#include\
    \ <iostream>\nusing namespace std;\nint main() {\n    // My first C++ program\n\
    \    cout << \"Hello, world!\" // This line outputs the words 'Hello, world.'\n\
    // Comment several lines\n// without the need to add more slashes\n    cout <<\
    \ \"Greetings from C++\"\n    return 0;\n}\n```\n\nHowever, you can add comments\
    \ to the end of a line of code, to describe in a better way what is going:\n\n\
    cout << \"Hello, world!\" // This line outputs the words 'Hello, world.' \\n denotes\
    \ a new line.\n\nObviously if you try and execute the code it errors out ['] to\
    \ finish off the block of code. If you've made a mistake few times, then it can\
    \ be tempting to go back and rectify. Frankly, colouring in Geanty identifies\
    \ comments from code\n\nNote, you don't have to put a semicolon at the end of\
    \ a comment. This is because it's in the code that's ignored by the compiler.\n\
    \n```\nhelloworld.cpp\n#include <iostream>\nusing namespace std;\nint main() {\n\
    \    // My first C++ program\n    cout << \"Hello, world!\" // This line outputs\
    \ the words 'Hello, world.' \\n denotes a new line.\n    return 0;\n}\n```\n\n\
    You can comment out lines by using the forward slash and asterisk:\n\n> /* This\
    \ comment can\ncover several lines\nwithout the need to add more slashes */\n\n\
    Just remember to finish the block comment with the opposite asterisk and forward\
    \ slash.\n\nWith block comments, it's good practice in C++ to add an asterisk\
    \ to each new line of the comment block. Before commenting with the code:\n\n\
    > /* This comment can\ncover several lines\nwithout the need to add more slashes\
    \ */\n\n```\nhelloworld.cpp\n#include <iostream>\nusing namespace std;\nint main()\
    \ {\n    // My first C++ program\n    cout << \"Hello, world!\" // This line outputs\
    \ the words 'Hello, world.' \\n denotes a new line.\n    /* This comment can\n\
    \    without the need to add more slashes */\n    return 0;\n}\n```\n\nThankfully,\
    \ Geanty does this automatically but when using other IDEs.\n\n> /* This comment\
    \ can\ncover several lines\nwithout the need to add more slashes */"
- md: "\n## Variables\n\nVariables differ slightly when using C++ as opposed to Python.\
    \ In Python, you can simply state that 'a' equals 10 and a variable is assigned.\
    \ However, in C++ a variable must be declared with its type before it can be used.\n\
