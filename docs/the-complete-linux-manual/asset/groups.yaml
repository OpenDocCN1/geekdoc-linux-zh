    \n## 选择与循环\n让我们引入另一个命令 `CHOICE`，以及一些嵌套的 `IF` 和 `ELSE` 语句。首先创建一个新脚本 `mychoice.sh`。\n\
    \n![](img/9eddebb0cf792a0bbe16478be74a68e1_73_0.png)\n\n`mychoice` 脚本看起来变得复杂多了。当我们有四个选项列表时，如果用户提供了正确的选项键，将显示三个、Mint\
    \ 和 Awesome。如果不是，菜单将重复第四个选项。\n\n```bash\nif [ $choice -eq 1 ]; then\n    echo\
    \ \"Mint\"\nelif [ $choice -eq 2 ]; then\n    echo \"Mint\"\nelif [ $choice -eq\
    \ 3 ]; then\n    echo \"Mint\"\nelif [ $choice -eq 4 ]; then\n    echo \"Awesome\"\
    \nelse\n    echo \"Please choose an option (1, or 3)\"\nfi\n```\n\n![](img/9eddebb0cf792a0bbe16478be74a68e1_73_1.png)\n\
    \n`mychoice` 脚本开始看起来复杂得多。如果你遵循脚本，就能理解正在发生什么。通过 `IF` 和 `ELSE`，`until` 语句将运行，直到你选了正确的选项。\n\
    \n![](img/9eddebb0cf792a0bbe16478be74a68e1_73_2.png)\n\n你当然可以增加选项的数量，但你需要确保数量与\
    \ `IF` 语句匹配。脚本可以很快变得非常忙碌。这个长脚本是显示菜单的另一种方式，这次带有特殊的方案。\n\n![](img/9eddebb0cf792a0bbe16478be74a68e1_73_3.png)\n\
