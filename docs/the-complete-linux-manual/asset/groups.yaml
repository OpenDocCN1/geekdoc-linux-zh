    # STEP 3


    The previous script entries you entered to create a Time Stamp, now when you know
    the backup file location define a ''dest'' variable, where the backup file will
    be created ~/backups. You can now add a line of code to check if the /backups
    folder exists, if then it creates it.


    ```

    #!bin/bash

    clear

