- md: "\n# Apollo 11\n\nDID YOU KNOW... July 20th 1969 is remembered as a turning\
    \ point in human history, when mankind first stepped on the moon. The software\
    \ that helped the crew make pivotal voyage didn't exist at the time and had to\
    \ be developed from scratch. Using a new method of storing programs called Rope\
    \ Memory, the engineers at MIT Instrumentation Laboratory populated the memory\
    \ with a special version of assembly.\n\nIncredibly, that code is freely available\
    \ to view on GitHub. Uploaded by a researcher in 2003, you can view the code by\
    \ visiting www.github.com/chrisgararry/Apollo-11/. Look out for code snippets,\
    \ such as Burn, Baby_Burn, in particular 925 with the comment \"Goodbye. come\
    \ soon.\"\n\nHave a look through, and see what else you can find.\n\n| NAME |\
    \ TC | SIZE |\n| --- | --- | --- |\n| PUBLIC | MANCALL | 700 |\n| PUBLIC | DISK\
    \ | 500 |\n| PUBLIC | TEST | 400 |\n| TECT | TURBO | 1200 |\n| TECT | FLASHER\
    \ | 800 |\n| TECT | GETTER | 600 |\n| TECT | SETTER | 600 |\n| CAP | BUFFER |\
    \ 900 |\n| CAP | CHECK | 300 |\n| CAP | EXCLUDE | 400 |\n| CAP | EXTERN | 500\
    \ |\n| FUNCTION | PUBLISH | 700 |\n| FUNCTION | SUBSCRIBE | 600 |\n| FUNCTION\
    \ | SEND | 500 |\n| FUNCTION | STOP | 300 |\n| SERVICE | DISCONNECT | 400 |\n\
    | SERVICE | START | 600 |\n| PUBLIC | BANK | 700 |\n| PUBLIC | LIST | 500 |\n\
    | PUBLIC | FIND | 400 |\n\n```\n/* BOILERPLATE BEGINS HERE */\n/* SUBSCRIBE TO\
    \ PANCE CONTROLS */\n/* _______________________________ */\n/* _________________________________________\
    \ */\n/* EXITS ARE NOT ON PANCE POWER AUTO */\n/* ARE ON THE DEFAULT STATUS */\n\
    \n/* DE-AUTO-TITLE-HIDE - RETURN */\n/* POSITIVE VALUES RETURN PERFOR */\n/* NEGATIVE\
    \ VALUES ON PANCE KTE */\n/* SIZE TERNSITE */\n\n/* BOILERPLATE ENDS HERE */\n\
    ```\n\nProgrammers aren't without a sense of humour. See what else is in there.\n\
    \n![](img/9eddebb0cf792a0bbe16478be74a68e1_35_0.png)\n\n# One giant leap for mankind,\
    \ and coding.\n\n![](img/9eddebb0cf792a0bbe16478be74a68e1_36_0.png)\n\nCredit:\
    \ Apollo 11/NASA\n\n# Getting to Know Linux\n\n## Creating Users\n\nWhen you install\
    \ Linux Mint it is configured for you. While sharing a user account with the entire\
    \ family is fine, there may come a time when you need to create separate users\
    \ with their own unique Home Folders.\n\n## NEW USERS\n\nHaving different users\
    \ means each user has access to or his own areas on the system. Documents, pictures,\
    \ videos and so on are separate, with multiple users on other operating systems.\n\
    \n- STEP 1 Click on the Linux Mint Menu and type 'users' to begin searching for\
    \ the relevant console. Choose Users and Groups and enter your password. The Users\
    \ and Groups console is quite basic looking, and thankfully easy to use. At first,\
    \ you can just see your own username when you installed Linux Mint.\n\n- STEP\
    \ 3 Enter the new user's Full Name, followed by the Username they need when logging\
    \ into Linux Mint. Make sure the username is all in lower case, a-z and 0-9 characters\
    \ only. You can have full stops, underscores or hyphens if you wish. Click the\
    \ Add button when you're ready to continue.\n\n![](img/9eddebb0cf792a0bbe16478be74a68e1_37_0.png)\n\
    \n- STEP 2 To add a new user, click the Add button at the bottom of the console.\
    \ There are two types of user you can create, Standard and Administrator. Unless\
    \ the user needs to install new apps or access parts of the file system beyond\
    \ their Home Folder, then opt for the Standard account type. Otherwise, use the\
    \ Administrator account type.\n\n- STEP 4 The new user appears in the list of\
    \ current Linux Mint users, in alphabetical order. At present, there is no password\
    \ set click the user in the list of current users, click the No Password Set option\
    \ under the user's username.\n\n![](img/9eddebb0cf792a0bbe16478be74a68e1_37_1.png)\n\
    \n![](img/9eddebb0cf792a0bbe16478be74a68e1_37_2.png)\n\n# Creating Users\n\nSTEP\
    \ 5 You can enter a password for the new user or click the curled arrow at the\
    \ end of the New TextBox to generate a password for you, as well as displaying\
    \ it. Naturally, it's a good idea to come up with a password as possible. When\
    \ you're done, click the Change button.\n\nSTEP 7 Once logged in the new user\
    \ is required to set up their desktop wallpaper, icons, Panel, Menu and so on.\
    \ Depending on what Account Type you set up for, Standard or Administrator, they\
    \ won't be able to install any new apps. This screenshot is from a Standard user\
