  - '[PAGE 50]


    # Install Apps via the Terminal - Part 1


    # STEP 5


    This adds the repo for the app Variety Wallpaper Changer, as changes the wallpaper
    automatically. An Ubuntu-based app that works in Mint and the installation. Now
    that the reppo is installed, enter: sudo-get update, to update the new information
    and add contents to the package manager.


    # STEP 6


    Now to install Variety, enter: sudo apt-get install variety. Press y to accept
    and continue the installation. Once installed, you can vary the type to run the
    app.


    ```

    sudo apt-get-repository ppa:variety/ppa

    sudo apt-get update

    sudo apt-get install variety


    # If you get an error about apt-get-repository, install:

    sudo apt-get install software-properties-common

    # Then run:

    sudo apt-get-repository ppa:variety/ppa

    sudo apt-get update

    sudo apt-get install variety

    ```


    ```

    Reading package lists ...nBuilding dependency tree ...nReading state information
    ... Done

    The following NEW packages will be installed

    variety 1.2.1-1 ubuntu-focal [612 KB]

    libavcodec58:2.8.18-0ubuntu0.0 [2.1 MB]

    libavformat58:5.8.53-0ubuntu0.0 [1.1 MB]

    libavscale5:5.8.100-0ubuntu0.0 [1100 KB]

    4 new packages will be installed, 4.3 MB of additional disk space will be used.

    Do you want to continue? [Y/n] y

    Unpacking...

    Selecting previously selected variety 1.2.1-1 ubuntu-focal (612 KB)

    Setting up libavcodec58 (2.8.18-0ubuntu0.0) (2.1 MB).nSetting up libavformat58
    (5.8.53-0ubuntu0.0) (1.1 MB).nSetting up libavscale5 (5.8.100-0ubuntu0.0) (1100
    KB).nSetting up variety (1.2.1-1 ubuntu-focal) (612 KB).

    Variety 1.2.1 is now the version.

    ```


    # REMOVING APPS


    In addition to installing, the apt command can also be used to remove any apps
    and keep your system tidy and free up resources.


    # STEP 1


    To uninstall, remove the Variety app enter following: sudo apt-get remove variety.
    Enter y to continue with the uninstall of the app; notice also how much space
    you''re freeing up on your hard drive as a result of removing it.


    ```

    daviddavid-mint $ sudo apt-get remove variety

    Reading package lists ...nBuilding dependency tree ...nReading state information
    ... Done

    The following packages will be REMOVED:

    variety 1.2.1-1 ubuntu-focal [612 KB]

    0 upgraded, 0 newly installed, 1 to remove and 0 not to upgrade.

    After this process, 612 KB of disk space will be freed.

    Do you want to continue? [Y/n] y

    ```


    # STEP 3


    When you remove apps from the system some packages automatically installed are
    no longer required. You already saw in the process above that you can find them
    using the command sudo apt-get autoremove, followed by pressing y.


    ```

    daviddavid-mint $ sudo apt-get autoremove

    Reading package lists ...nBuilding dependency tree ...nReading state information
    ... Done

    The following packages will be REMOVED:

    libboost-system-dev1.74.0-1ubuntu2.20.4 [1.1 MB]

    0 upgraded, 0 newly installed, 1 to remove and 0 not to upgrade.

    After this operation, 1,100 KB disk space will be freed.

    Do you want to continue? [Y/n] y

    ```


    # STEP 2


    While the ''apt-get'' command uninstalls an app, it doesn''t remove the extra
    files that comes with an app, such as configuration and library files. To remove
    the remover, enter: sudo apt-get purge variety.


    ```

    daviddavid-mint $ sudo apt-get purge variety

    Reading package lists ...nBuilding dependency tree ...nReading state information
    ... Done

    The package is not installed, so not removed

    0 upgraded, 0 newly installed, 0 to remove and 0 not to upgrade.

    ```


    # STEP 4


    Finally, to tidy up all the unused packages in the system, and to remove the elements
    that the autoremove command deleted, you can enter: sudo apt-get autoremove. Mint
    set up good working order and trim off the unnecessary packages.


    ```

    daviddavid-mint $ sudo apt-get autoremove

    Reading package lists ...nBuilding dependency tree ...nReading state information
    ... Done

    The following packages will be REMOVED:

    0 upgraded, 0 newly installed, 0 to remove and 0 not to upgrade.

    ```


