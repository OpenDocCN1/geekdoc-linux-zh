  - '[PAGE 135]


    # Strings


    Strings are objects that represent and hold sequences of characters. For example,
    you could have a universal greeting in your code ''Welcome'' and assign that as
    a string to be called up wherever you like in the program.


    # STRING THEORY


    There are different ways in which you can create a string of characters, which
    historically are all carried over from the original C language and supported by
    C++.


    To create a string, use the char function. Open a new C++ file and begin with
    the usual:


    ```

    #include <iostream>

    using namespace std;


    int main() {


    }

    ```


    Build and run the code and ''Welcome'' appears on the screen. While this is perfectly
    fine, it''s not a string. A string is a class, which defines objects that can
    be represented as a stream of characters and doesn''t need to be terminated like
    an array. The code can therefore be represented as:


    ```

    #include <iostream>

    using namespace std;


    int main() {


    char greet[] = "Welcome"

    cout << greet << "\n";n

    }

    ```


    It''s easy to confuse a string with an array. Here''s an array, which can be terminated
    with a null character:


    ```

    #include <iostream>

    using namespace std;


    int main() {


    char greet[8] = {''W'', ''e'', ''l'', ''l'', ''c'', ''o'', ''m'', ''\0''};

    cout << greet << "\n";n

    }

    ```


    In C++, there''s also a string, which works in the same way. Using the greeting
    code,


    ```

    #include <iostream>

    using namespace std;


    int main() {


    string greet = "Welcome"

    cout << greet << "\n";n

    }

    ```'
