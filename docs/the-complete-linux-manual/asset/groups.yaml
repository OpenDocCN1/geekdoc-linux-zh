    ## 通过终端更新 Mint


    到为止，你一直在使用盾牌图标启动 Mint 更新管理器（Mint Update Manager），来更新系统并升级当前安装的应用程序、工具和其他元素。然而，你也可以从终端（Terminal）完成整个系统的更新和升级。


    ## 使用 APT-GET


    更新和升级终端需要使用 APT（高级软件包工具），它是一条强大的命令，并在使用上结合了不同的元素。


    - **第 1 步** 首先打开一个新的终端，或者如果你已经打开了一个，使用该命令清除其内容。这将让你从一个干净的状态开始工作。

    - **第 3 步** Apt-get 用于升级 Mint 软件，以及 Ubuntu 和其他基于 Debian 的发行版中的软件。使用 Update（更新）元素会获取新软件包并更新源文件列表。Upgrade（升级）则会将它们下载到这些文件的最新版本。要启动更新和升级过程，输入：`sudo
    apt-get update`，然后输入你的密码。

    - **第 2 步** 在终端输入 `apt-get`。这会列出最常用的 apt-get 命令列表，以及对每个命令功能的简要描述。如果现在看起来它没什么意义也没关系。

    - **第 4 步** 注意 sudo 命令的提示。sudo 的意思是“替换用户执行”（Substitute User: Do It），这意味着以管理员用户（超级用户）身份使用
    APT（高级软件包工具）来获取更新。现在运行：`sudo apt-get upgrade`。


