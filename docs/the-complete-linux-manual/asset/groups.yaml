  mdcn: "\n\n## 为什么选择 C++？\n\nC++ 是今天最流行的编程语言之一。它最初被称为“带有类的 C++”，随后在 1983 年更命名为 C++。它是原始\
    \ C 语言的扩展，是一个通用的面向对象（OOP）环境。## 关于 C 的一切\n\n由于该语言的复杂性以及其强大的功能和性能，C++ 通常用于开发游戏、程序、设备驱动程序甚至整个操作系统。\n\
    \nC++ 追溯到 1979 年，那是个人计算黄金时代的开始。C++ 或称为带类的 C，是丹麦计算机科学家比雅尼·斯特斯特普（Bjarne Stroustrup）在读博士学位期间使用原始\
    \ C 语言时发明的。C 语言自 70 年代初以来被广泛应用于计算实验室以及无法访问主机和大型计算数据中心的普通人。\n\nC++ 证明了在 80 年代的开发者中非常受欢迎，因为它是一个更容易上手，更重要的是，它与原始\
    \ C 语言有 99% 的兼容性。这意味着它可以被应用于主流之外领域。\n\nC++ 在数字世界中的应用是巨大的。许多程序、应用程序、游戏甚至操作系统都是使用\
    \ C++ 编写的。例如，Adobe 的所有应用程序（如 Photoshop、Indie 等）都是用 C++ 编写的。你会发现你用来上网的浏览器是用 C++\
    \ 编写的，Windows TI、Microsoft Office 以及 Google 搜索引擎的后端也是。Apple 的 macOS 是用 C++ 编写的，并包含一些\
    \ C++ 代码。\n\n- C++ 代码运行比 Python 快得多。\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nvoid main() {\n    char ch;\n    cout<<\"Enter a character to check it\
    \ is vowel or not\";\n    cin>>ch;\n    switch (ch) {\n        case 'a': case\
    \ 'A':\n            cout<<ch<<\" is a Vowel\";\n            break;\n         \
    \   case 'e': case 'E':\n            cout<<ch<<\" is a Vowel\";\n            break;\n\
    \            case 'i': case 'I':\n            cout<<ch<<\" is a Vowel\";\n   \
    \         break;\n            case 'o': case 'O':\n            cout<<ch<<\" is\
    \ a Vowel\";\n            break;\n            case 'u': case 'U':\n          \
    \  cout<<ch<<\" is a Vowel\";\n            break;\n        default:\n    }\n}\n\
