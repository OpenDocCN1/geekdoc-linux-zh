    |---|---|---|

    | Dropbox | | |

    | OneDrive | | |

    | 此电脑 | | |

    | 光驱 (E): | | |

    | 网络 | | |


    - **步骤 4** 打开 Windows 刻录对话框，点击“刻录后验证”框然后点击“刻录”按钮。这个过程将需要几分钟，取决于你 PC 光驱的速度。一旦运行验证阶段，光驱应该会自动选择光盘。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_19_0.png)


    | Windows 刻录 | linuxmint-19.1-cinnamon-64bit.iso |

    |---|---|

    | 光盘镜像: | |

