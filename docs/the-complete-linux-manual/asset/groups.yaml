    \ 1800 万行代码。对于一个现在运行着纽约证券交易所、并为美国国防部的核潜艇舰队提供服务的大学项目来说，这并不简单。\n\n## 使用终端创建文件\n\n\
    使用终端，你可以创建文件夹、文件，甚至运行 Linux Mint 应用程序。事实上，如果你手边没有图形界面（GUI），你仍然可以在终端完成相同的操作。\n\n\
    ## 更多终端操作\n\n使用终端创建内容并不像初看起来看起来那么辛苦。是的，终端对于新学者来说可能是一个令人生畏的地方，但一旦掌握了它，它其实非常直观。\n\
    \n- 步骤 1\n主目录（Home folder）。如果没有，使用 `cd -` 命令从你所在的任何位置返回主目录。\n\n- 步骤 2\n让我们先在 Home\
    \ 中创建一个新文件夹，并将其命名为 Test。你需要命令是 `mkdir Test`。输入命令后按回车创建文件夹，然后输入 `cd Test` 并按回车。这将切换目录（Change\
    \ Directory，简称 `cd`）。\n\n```\nFile Edit View Search Terminal Help\ndavid@david-mint\
