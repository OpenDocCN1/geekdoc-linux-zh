    # Using Comments


    While comments may seem like a minor to the many lines of code to make a game,
    an application or even an entire operating system, in fact they''re probably one
    of the most important factors.


    # THE IMPORTANCE OF COMMENTING


    Comments inside code are basically human readable descriptions that detail what
    the code is doing at that point. They sound especially important but without comments
    it is one of the frustrating areas of programming, regardless of whether you''re
    a professional or just starting out.


    In short, code should be commented in such a manner as to effectively describe
    the purpose of a line, section or individual elements. You should get into the
    habit of commenting as much as possible so someone who doesn''t know about programming
    can pick up your code and understand what it''s going to do by reading your comments.


    In a professional environment, comments are vital to the success of the code and
    ultimately, the company or project. In an organisation, many programmers work
    alongside engineers, developers and analysts. If any part of the team that''s
    writing a piece piece of software for the company, then your comments save a lot
    of time when something going wrong and another team member has to pick up and
    follow the trail to pinpoint.


    The best comments are always concise and link the code logic, detailing happens
    when the program hits a line or section. You don''t need to comment on every line.
    Something along the lines of: if x equals zero then do something; that is going
    to be obvious to the reader. If x is something that drastically changes the program
    or if we run out of lines, it certainly needs to be commented.


    Even if the code is your own, you should write comments if you are going to share
    it with others. This way you can return to code and understand what it did or
    where it went wrong, or what worked brilliantly.


    Comments are good practice and you understand how to add a comment when it''s
    needed so on.


    Place yourself in the shoes of someone''s job it is to find out what''s wrong
    with your program. The program has excess of 800 lines of code, spread across
    several different modules. You may also need for a little help from the original
    programmers in the form of a good comment.


