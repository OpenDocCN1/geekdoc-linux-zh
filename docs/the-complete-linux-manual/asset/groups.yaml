    # 了解 Linux


    # 成为匿名用户


    数字时代带来了通信领域的巨大进步；然而，它也开启了监视和窥探的新时代。我们大多数人对政府、秘密组织和地下黑客侵犯我们隐私的频繁新闻感到很陌生，但你该如何对抗这些呢？


    ## 在 MINT 中保持匿名


    虽然完全匿名化几乎是不可能的，但你可以采取措施来确保你的隐私处于最佳状态。


    - 步骤 1：从基础开始，浏览时使用 HTTPS 代替标准的 HTTP。这意味着通过 HTTPS 传输的任何内容都是安全的（因此结尾是 S）并且经过加密的。


    - 步骤 3：尽管使用 Google 似乎是现代互联网搜索的显而之选，但该公司会跟踪个人进行的所有搜索。相反，请考虑替代搜索引擎，例如 DuckDuckGo，这是一种不存储个人数据或跟踪你的用户的搜索引擎。


    - 步骤 2：浏览时，考虑使用浏览器的“无痕”或“隐私”浏览模式。这将禁用你的网络历史和缓存，让你在浏览时不会将细节存储起来供他人以后审查。然而，它并不能阻止数据或搜索跟踪。


    - 步骤 4：如果你经常上网，可以考虑通过安装一些浏览器插件来增强隐私。例如，对于 Firefox，使用 Ghostery、NoScript 和 AdBlock
    Plus 来拦截跟踪器和其他数据挖掘技术。


    ## VPN 和 TOR


    之前的步骤可以帮助保护你的在线隐私，但要保持完全匿名，你需要一个虚拟专用网络（VPN）和 Tor。


    步骤 1：VPN 是一个网络服务器或服务器集群，它与你的计算机建立连接。结果是你的计算机在互联网上的身份隐藏在 VPN 远程服务器之后；因此你可以在英国使用它，但拥有属于冰岛的
    IP 地址（计算机在线身份）。


    步骤 4：下载完成后，进入终端（Terminal）并进入 Downloads 文件夹，输入 `cd Downloads ls` 检查是否存在 tar.xz
    Tor 文件，然后运行：`tar -xvf tor-browser-linux64-8.0.4.tar.xz`（X 为更新的版本，如果你的版本不同，按 tab
    键自动补全 tor-browser-filename）。文件解压后，使用 `cd tor-browser-en-US/` 进入新文件夹。


    ## VPN 是如何工作的？


    ```

    download@mid$ cd tor-browser-en-US

    download@mid$ ls -la

    download@mid$ tar -xvf tor-browser-linux64-8.0.4.tar.xz

    download@mid$ ls -la

    download@mid$ cd tor-browser

    download@mid$ cd tor-browser-en-US

    download@mid$ ls -la

    download@mid$ cd tor-browser-en-US

    download@mid$ ls -la

    ```


    - 步骤 2：大多数优秀的 VPN 会收取月费或年费，但这笔支出是值得。我们使用 CyberGhost (cyberghost.com)，它为 Windows、Mac、Mint（以及任何
    Linux 发行版）、Android 和 iOS 设备提供 VPN 连接。每个系统的详细信息可以在 www.cyberghost.com/hz/en-us/articles/213190329-Read-me-first-
    找到。


    - 步骤 5：快速设置会显示两个东西：文件夹 Browser 和一个文件 ''start-browser.desktop''。要启动设置，运行 `./start-browser.desktop`。该命令会启动设置，并为你提供两个选项：连接（Connect）或配置（Configure）。对于大多数用户来说，连接选项就足够了。准备好后点击。


    - 步骤 3：另一个选项是使用 Tor。Tor 是一个开放网络，你可以连接它并通过世界各地角落的节点隐藏你的 IP 地址。它适用于 Windows、Mac
    和 Linux 计算机，且易使用。首先访问 projectproject.org/download/linux-easy/ 并点击 Download Linux
    64-bit 版本。


    - 步骤 6：连接建立后，Tor 浏览器启动。它是 Firefox 的定制版本，从这里你可以安全地浏览互联网而不被查看或跟踪。同时使用 VPN 和 Tor可以建立一个极其安全且私密的在线连接。


    ## 使用终端


    Linux 命令行——终端（Terminal）是一个极其强大的环境。通过它，你可以让操作系统瘫痪，也可以将其更新到令人惊叹的状态。你可以黑入远程计算机，查看动画
    ASCII 篝火，安装新的应用程序和程序，观看从荷兰服务器播放的《星球大战》，并编写指示自动化脚本。


    # "Linux：一个带有线索的操作系统... 命令行用户环境。"


    — 匿名发布者（发布于 comp.software.testing）


    在本节中，你将探索终端的复杂性以及它是如何与 Linux 协同工作的。你将学习如何从终端操作 Linux 文件系统，并将发现一些在终端中可以做的奇特但有趣的事情。


    终端在 Linux 世界中处于至高无地位。学习它是如何运作的，你就能掌握它。


    '
