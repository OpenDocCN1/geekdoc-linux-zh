- md: "\n## Using the Terminal\n\n```\nKernel command line: block2mtd.mtd=mtd=/dev/hda2,131072.rootfs\
    \ root=/mtd\nblock0 rootype=jffs2 init=/etc/preinit noinitrd console=tty0 console=ttyS0,3840\
    \ reboot-bios\nFound and enabled local APIC:\nEnabling FPU save and restore...\
    \ done.\nEnabling unmasked SIMD FPU exception support... done.\nInitializing CPU0\n\
    PID hash table entries: 32 (order: 5, 128 bytes)\nDetected i486 G7+ MHz processor.\n\
    Console: colour VGA+0x25\nconsole [tty0] enabled\nconsole [tty0] enabled\nDentry\
    \ cache hash table entries: 1024 (order: 0, 4096 bytes)\nInode-cache hash table\
    \ entries: 1024 (order: 0, 4096 bytes)\nMemory: 512K/8128K available (1497k kernel\
    \ code, 2624k reserved, 597k data, 196\nk init, Ok highmem)\nvirtual kernel memory\
    \ layout:\nfixmap: 0xffbff000 - 0xffffff (280 KB)\nvmalloc: 0xc0100000 - 0xfffb7000\
    \ (1007 MB)\nlowmem: 0xc0000000 - 0xc07f0000 (7 MB)\n.init: 0xc0313000 - 0xc0344000\
    \ (196 KB)\n.data: 0xc027653c - 0xc030bcfc (597 KB)\n.text: 0xc0100000 - 0xc027653c\
    \ (1497 KB)\nChecking if this processor honours the WP bit in supervisor mode...Ok.\n\
    Calibrating delay using timer specific routine., 4047.64 BogoMIPS (lp)=20238210\n\
    ```\n\n## Linux Kernel 0.01\n\n```\nconsole.c\n\n* This module implements the\
    \ console functions\n* int main(void) {\n  struct tty_tty_queue *queue = NULL;\n\
    \  Hopefully this will be a complete VT12 implementation.\n}\n/*\n* NOTE!!! We\
    \ sometimes disable and enable interrupts for a short\n* (to put on video IO),\
    \ but this will work even for keyboard\n* interrupts, which aren't enabled when\
    \ getting a keyboard\n* interrupt, as we use trap-gates. Hopefully all is well.\n\
    \ */\n\n#include <linux/sched.h>\n#include <linux/tty.h>\n#include <asm/io.h>\n\
    #include <asm/system.h>\n\n#define SCREEN_START 0x8000\n#define SCREEN_END 0x0000\n\
    #define LINES 25\n#define COLUMNS 80\n\nextern void keyboard_interrupt(void) {\n\
    \  static unsigned long origin=SCREEN_START;\n  static unsigned long end=SCREEN_START+LINES*COLUMNS;\n\
    \  static unsigned long x=0;\n  static unsigned long line=COLUMNS;\n  static unsigned\
    \ long state=0;\n  static unsigned long ques=0;\n  static unsigned char attr=0x07;\n\
    ```\n\nDID YOU KNOW... that the first Linux kernel, programmed by Linus Torvalds,\
    \ only occupied 65KB of memory? And since version 0.01, the Linux kernel now boasts\
    \ over 18 million lines of code. Not bad for a university project that now runs\
    \ the New York Stock Exchange, and powers the US Department of Defence's fleet\
    \ of nuclear submarines.\n\n## Creating a File Using the Terminal\n\nUsing the\
    \ Terminal, you're able to create folders, files and even execute Linux Mint apps.\
    \ In truth, if you didn't have the GUI at hand, you could still accomplish the\
    \ same from the Terminal.\n\n## MORE TERMINAL WORK\n\nCreating content using the\
    \ Terminal isn't quite as strenuous as it may first appear. Yes, the Terminal\
    \ can look a daunting place for the newcomer, but once mastered it's really quite\
    \ intuitive.\n\n- STEP 1\nHome folder. If not use the cd - command to return you\
    \ to the Home folder from wherever you're currently located.\n\n- STEP 2\nLet's\
    \ start by creating a new folder within Home, and call it Test. The command you'll\
    \ need mkdir Test. Press Enter to create the folder when you've typed in the command,\
    \ cd Test and press Enter. This will Change Directory (hence) cd to.\n\n```\n\
    File Edit View Search Terminal Help\ndavid@david-mint ~ cd -\ndavid@david-mint\
    \ ~ - $\n```\n\n```\nFile Edit View Search Terminal Help\ndavid@david-mint ~ mkdir\
    \ Test\ndavid@david-mint ~ cd Test\ndavid@david-mint ~ ls -l\ndavid@david-mint\
    \ ~ ~ls -l $\n```\n\n- STEP 3\nYour command line should change to the Test Folder\
    \ and if you enter ls (List folder contents) there will be nothing within the\
    \ folder; as you just created. The mkdir command is fairly self-explanatory: Make\
    \ Directory followed by your name of choosing.\n\n- STEP 4\nTo create an empty\
    \ file, called Test.txt, use touch.\n\n```\nFile Edit View Search Terminal Help\n\
    david@david-mint ~ touch Test.txt\ndavid@david-mint ~ ls -l\ndavid@david-mint\
    \ ~ ~ls -l $\n```\n\n```\nFile Edit View Search Terminal Help\ndavid@david-mint\
    \ ~ touch Test.txt\ndavid@david-mint ~ cd Test\ndavid@david-mint ~ ls -l\ndavid@david-mint\
    \ ~ ~ls -l $\n```\n\n## Creating and Removing Directories\n\nAs with creating\
    \ files in the Terminal, you can also create and delete directories, or folders\
    \ if you prefer. Directories form the structure of your file system, without logical\
    \ directories the filing system would be in chaos.\n\n## MANAGING FOLDERS\n\n\
    Learning how to create and delete folders in the Terminal is an important Mint,\
    \ and indeed Linux overall, skill to master. Here's the basics for you to try.\n\
    \n- With the Terminal open enter – make sure you're in your own Home directory.\
    \ Now enter is to view the current folders you have in the Home directory. You'll\
    \ notice that folders are labelled in cyan (light blue). Let's start creating\
    \ a new one. Enter: mkdir testdir.\n\nIf you enter the command again, mkdir testdir,\
    \ you'll receive a message stating: mkdir already exists without saying then,\
    \ you're only able to have one uniquely named within the current directory. However,\
    \ as Linux is case-sensitive, you cannot have testdir, Testdir and so on.\n\n\
    You can create directories within directories you've already created with cd testdir/\
    \ For example, enter the testdir/ to list the folder structure. Naturally there\
    \ is present, as you've just created the directory. Now back drop to Home with\
    \ cd – and enter mkdir testdir/reports. Go back to the terminal, cd testdir/,\
    \ and ls is again.\n"
