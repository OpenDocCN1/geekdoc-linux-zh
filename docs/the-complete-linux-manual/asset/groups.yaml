    ## 终端 VS 更新管理器


    为什么使用终端？Linux 上安装应用程序和程序有多种方法。你可以选择图形界面路线使用软件管理器，也可以使用终端。通常，终端对安装的软件提供更好的控制，有时你没有选择。通过使用终端，apt-get
    会处理版本之间的依赖关系，因此你可以保持最新。从用户角度来说，如果你在寻找最新的软件包，最好使用软件管理器。


    ## 通过终端安装应用 - 第一部分


    ### 命令行安装


    - **第 1 步** 从终端安装应用程序通常相对简单。首先，你需要确保系统是最新的。在终端中执行此操作并输入：`sudo apt-get update &&
    sudo apt-get upgrade`。输入你的密码并接受任何更新。

    - **第 2 步** 正如所示，使用 `sudo apt-get update/upgrade` 等命令可以升级系统中已安装的软件。你想安装更多应用吗？事实证明这非常简单。首先，你需要一个要安装的应用，我们用
    Stella 吧。输入：`sudo apt-get install`。

    - **第 3 步** 你需要输入 y 来确认安装，这将占用约 5.5MB 的存储空间。Stella 安装完成后，你可以看到 Mint 在菜单中自动生成了“游戏”类别以及快捷方式。

    - **第 4 步** 有时在安装软件时，你需要添加应用的仓库（Repository）。仓库（简称 repo）就是存放软件的远程服务器，以及它所有的依赖项（它运行所需要的关键库和书籍）。从这里开始：`sudo
    add-apt-repository ppa:peter-levi/ppa` 按回车添加该 PPA（个人软件包存档）。


    ```

    File Edit View Search Terminal

    davidhavd-mint ~ %

    $ sudo add-apt-repository ppa:peter-levi for the variety wallpaper changer

    More info: https://launchpad.net/~peter-levi/ubuntu/ppa

    Press Enter to continue or to cancel.

    ```




