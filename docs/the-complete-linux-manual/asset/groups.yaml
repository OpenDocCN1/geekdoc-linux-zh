    \n# 步骤 3\n\n之前的脚本可以修改以包含选择和用户交互。脚本的其余部分相同。\n\n```bash\n#!/bin/bash\nclear\n# time\n\
    day=$(date +%d)\nmonth=$(date +%B)\nyear=$(date +%Y)\n# Folders\ndest=~/backups\n\
    source=~/Documents\nif [ ! -d $source ]; then\n    echo \"Backup folder does not\
    \ exist! I'm now creating...\"\n    mkdir -p $source\nfi\necho \"Press any key\
    \ to continue...\"; read -n 1\necho \"Backup file created $day/$month/$year\"\n\
    ```\n\n# 步骤 6\n\n使用 `FOR` 循环再次执行该序列，我们正在操作 (0-100) 部分。这部分代码实际上意味着（开始，结束，增量）。如果没有增量，则只是到结束的单个数字。例如，你可以使用循环按两位计数到\
    \ 1000：`for count in {0..1000;2}; do`\n\n```bash\n#!/bin/bash\nfor count in {0..1000;2};\
    \ do\n    echo $count\ndone\n```\n\n最后，你可以添加一条消息：“备份完成。”\n\n```bash\n#!/bin/bash\n\
    for count in {0..1000;2}; do\n    echo $count\ndone\n```\n\n# 创建 Bash 脚本 – 第 5\
