    # 了解 Linux


    ## 创建用户


    当你安装 Linux Mint 时，它已经为你配置好了。虽然全家人共享一个用户账户没有问题，但将来某时刻，你可能需要创建具有独立主目录的单独用户。


    ## 新用户


    拥有不同的用户意味着每个用户都可以访问或拥有自己的系统区域。与其它操作系统上的多个用户情况类似，文档、图片、视频等都是分开的。


    - 第 1 步点击 Linux Mint 菜单并输入“users”以开始搜索相关的终端。选择“用户和组”（Users and Groups）并输入密码。用户和组终端看起来非常基础，谢天易于使用。起初，你只能看到安装
    Linux Mint 时的自己的用户名。


    - 第 3 步输入新用户的全名，紧接着输入他们登录 Linux Mint 时需要的用户名。确保用户名全部全小写，仅包含 a-z 和 0-9 字符。如果你需要，可以使用点、下划线或连字符。准备好继续时，点击“添加”按钮。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_37_0.png)


    - 第 2 步要添加新用户，点击终端底部的“添加”按钮。你可以创建两种类型的用户：标准用户（Standard）和管理员（Administrator）。除非用户需要安装新应用或访问其主目录之外的文件系统部分，否则请选择标准账户类型。否则，使用管理员账户类型。


    - 第 4 步新用户将按字母顺序出现在当前 Linux Mint 用户列表中。目前尚未设置密码，点击当前用户列表中的用户，点击用户名下方的“未设置密码”（No
    Password Set）选项。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_37_1.png)


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_37_2.png)


    # 创建用户


    第 5 步你可以为新用户输入密码，或者点击新文本框末尾的弯曲箭头为你生成并显示密码。自然地，想出一个尽可能复杂的密码是个好主意。完成后，点击“更改”。


    第 7 步登录后，新用户将被要求设置桌面壁纸、图标、面板、菜单等。取决于你设置的账户类型（标准或管理员），他们将无法安装任何新应用。此截图来自标准用户账户类型。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_37_0.png)


    第 6 步登录后，新用户将被要求设置桌面壁纸、图标、面板、菜单等。取决于你设置的账户类型（标准或管理员），他们将无法安装任何新应用。此截图来自标准用户账户类型。


