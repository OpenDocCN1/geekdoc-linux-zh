    \ you can go about installing Linux.\n\n### UEFI BIOS\n\nThe Unified Extensible\
    \ Firmware Interface (UEFI) is used to identify and protect a PC during its boot-up\
    \ process. It replaces the traditional BIOS but can cause issues when installing\
    \ Linux.\n\n- **STEP 1** Insert your DVD or USB flash-drive into your PC, and\
    \ if you haven't already, shutdown Windows. In this instance we're using the USB\
    \ media but the process is virtually identical. Start the PC and when prompted\
    \ press keys to enter the BIOS or SETUP, which for example: F2, Del or F12,\n\
    - **STEP 3** With UEFI turned to Legacy modes, there are two ways of booting into\
    \ the Live Environment. The first is via the BIOS you're already in. Locate the\
    \ Boot Sequence and change the first boot device from its original setting, using\
    \ internal HDD or similar; USB Storage Device for the USB media, or DVD Drive\
    \ for the media option.\n![](img/9eddebb0cf792a0bbe16478be74a68e1_21_0.png)\n\
    - **STEP 2** There are different versions of UEFI BIOS, covering them all you'll\
    \ need. What you're looking for is a section that details the Boot Sequence or\
    \ Boot Mode. Here you have the option to turn off UEFI and choose Legacy or Secure\
    \ Boot. Most distros work with UEFI but it can be a tricky to install it to.\n\
    - **STEP 4** Alternatively use the Boot Menu. With this you can press F12 (or\
    \ something similar) to display a list of boot options; from there, you can choose\
    \ the appropriate boot media. After you can Save and Exit the BIOS by navigating\
    \ to the Save & Exit option and choosing 'Save Changes and' \n![](img/9eddebb0cf792a0bbe16478be74a68e1_21_1.png)\n\
    \n## INSTALLING LINUX\n\nOnce the Live Environment has booted, you use the option\
    \ to install the distro to your computer. You have a look around and when you're\
    \ ready, look for the Install option on the desktop.\n\n- **STEP 1** Providing\
    \ you are connected to the internet (if not, then do so) and you're in the Live\
    \ Environment, start the installation process by double-clicking on the Install\
    \ Mint icon on the desktop. Other distros display their own name, of course, but\
    \ the process is the same. Click Continue when you're ready.\n![](img/9eddebb0cf792a0bbe16478be74a68e1_22_0.png)\n\
    - **STEP 4** Before the installation process begins, you're asked if you chose\
    \ the name making sure the erasure of the hard drive. This is your last chance\
    \ to back out. If you're certain you won't wipe everything and starting again\
    \ with Linux Mint, click Continue. If you need to back up your files to USB, reboot\
    \ and start again.\n- **STEP 2** While the installation process is very similar\
    \ to most Linux distros, some offer different questions during the installation.\
