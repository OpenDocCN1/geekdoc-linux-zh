    ## USER ERROR


    User input is often a paralysing mistake in code. For example, when the user is
    supposed to enter a number for there and instead enter it in letters. Often a
    user can enter so much input that it overflows internal buffer, thus causing the
    code [to] crash. Watch those user inputs and clearly state what are needed from
    them.


    ```

    Enter an integer number

    You have entered wrong input

    You have entered wrong input

    Error:

    You have entered wrong input

    sdf2213213123

    1232293293292329

    You have entered wrong input

    The number is: 12

    Process returned (0x0) execution time : 21.49 s

    Press any key to continue.

    ```


    ## Common Coding Mistakes


    ### BACKUPS


    Always make a backup of your work, with a secondary backup for all changes you''ve
    made. Mistakes can be rectified if there''s a good backup in place to prevent
    losing your work. If something goes wrong, the easier it is to start where you
    left off, rather than starting from scratch.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_144_0.png)


    ## RE-INVENTING THE WHEEL


    You can easily spend days to fathom out section of code to achieve a result and
    it''s frustrating and often time-wasting. While it''s equally rewarding to solve
    the problem yourself the same code is out there on the Internet. Don''t reinvent
    the wheel, look to if someone else has done it.


    ## SECURE DATA


    If you''re writing code to deal with usernames and passwords, or other sensitive
    data, ensure the data isn''t cleartext. Learn how to create a function to encrypt
    sensitive data before feeding it into a routine that can transmit or store where
    everyone may be able to view.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_144_1.png)


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_144_2.png)


    ## HELP!


    Asking for help has most of us struggled with the past. Will the people be laughing
    at us? Is it everyone''s time? It''s a common mistake for someone to suffer in
    silence. As long as you have the correct method, obey any forum rules and be polite,
    then your question isn''t silly.


    ## MATHS


    If you make multiple calculations then you need to ensure that the maths behind
    is sound. There are thousands of instances where people have offered incorrect
    data based on poor Mathematical coding, which can have disastrous effects impacting
    what the code is set to. In short, double check your equations.


