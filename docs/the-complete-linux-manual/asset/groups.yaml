    # Installing Linux in a Virtual Environment


    With Oracle VirtualBox now up and running, the next task is to create the Virtual
    Machine (VM) environment into which you install Linux. This process won''t affect
    your currently installed operating system, which is why a VM is a great choice.


    ## CREATING THE VM


    There are plenty of options to choose from creating a VM. For now though, let''s
    set up a VM adequate to run Mint Cinnamon and perform well.


    - STEP 1: With VirtualBox open, click on the New Icon in top right of the app.
    This opens the new VM Wizard.

    - STEP 2: In the next box Name, type Linux Mint and VirtualBox should automatically
    choose Linux (Ubuntu 64-bit) as the Version; if not, use the drop-down boxes to
    select the correct settings (remember Mint is based on Ubuntu). Click Next when
    you''re ready to proceed.

    - STEP 3: The next section defines the amount of system memory, or RAM, the VM
    has allocated. This memory is taken from the available memory installed on your
    computer, so don''t give the VM too much. For example, we have 8GB of memory installed
    and we''re giving 2GB to the VM. When you''re ready, click Next:

    - STEP 4: This section is where you start to create the virtual hard disk that
    the VM uses to install Mint on. The default option, ''Create a virtual hard disk'',
    is the one we want. Click Next to create.

    - STEP 5: The pop-up window appears after Creating asks you what type of virtual
    hard disk you want to create. We''re going to use the default VDI (Virtual Disk
    Image) as the others are used to move VMs from one application to next. Make sure
    VDI is selected and click Next.

    - STEP 6: The question of whether to use Dynamically or Fixed size virtual disks
    may come as somewhat confusing to the newcomer. A Dynamically allocated hard disk
    is a more flexible option and won''t take up much space in your virtual hard disk.
    Ensure Dynamically is selected and click Next.

    - STEP 7: The virtual hard disk is a single folder, up to the size you want to
    state in this section. The location has enough free space available. For example,
    we will use a bigger storage option on our D:\ drive, named it Linux Mint and
    allocated 25.50GB of space to the virtual hard disk.

    - STEP 8: After the initial setup of the VM is complete; now you should be looking
    at the VirtualBox Application. Before you begin, click the Settings button and
    within the General section click the Advanced tab. Using the pull-down menus,
    choose Bidirectional for Shared Clipboard and Drag ''n''Drop.

    - STEP 9: Follow by clicking on the System section, then the Processor tab. Depending
    on your CPU, you may allocate as many cores as you want to your host system: for
    two CPUs. Now slide the Video Memory on the Display section, then ''Enable 3D
    Acceleration''. Click OK to commit to the next.

    - STEP 10: Click on the Start-up button and use the explorer button (a green arrow)
    in ''Select Start-up'' window to load the downloaded ISO of Mint; then click Boot
    with the Linux Mint Live Environment. You can now install Linux using standard
    requirements.


    ## Getting to Know Linux


    "Anyone can build a fast processor. The trick is to build a fast system." Seymour
    Cray (Electrical Engineer, and founder of Supercomputers)


    We''ve used Linux Mint as a guideline here, as it''s an easy to use distro for
    Windows users. It''s also one of the most developed and documented Linux distros
    as well as having fantastic options. In this section, we introduce the Mint Menu
    and Desktop Environment, how it works and what you can do. Want to create another
    user or discover how to become online? Then read on.


    | Page | Topic |

    | :--- | :--- |

    | 30 | Introduction to the Cinnamon Menu |

    | 32 | Navigating the Cinnamon Desktop |

    | 34 | 10 Things to do After Installing Linux |

    | 36 | Did You Know... |

    | 38 | Creating Users |

    | 40 | Customising the Desktop |

    | 42 | Becoming Online |


    ## Introduction to the Cinnamon Menu


    Now that you have Linux installed it''s time to have a look around. First though,
    if you''re using VirtualBox you''ll have a notification regarding Software Rendering;
    here''s how to fix it.


    ## CINNAMON VIRTUALBOX FIX


    You''re already looked at some functions, insert, and remove but there are functions
    that can be applied to strings.


    - STEP 1: Before we begin, we''re assuming you''re having this within VirtualBox.
    The Software Rendering message appears in the top right of the desktop. To fix
    this, click on Devices in VirtualBox followed by Insert Guest Additions...

    - STEP 2: The Guest Additions CD contains drivers for VirtualBox including the
    video hardware. When it''s loaded, you get a ''software needs running'' notification
    with two options: Cancel and Run. Click the Run button and enter your Linux password.

