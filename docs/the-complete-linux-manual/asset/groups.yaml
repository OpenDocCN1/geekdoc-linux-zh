    ## Navigating the Cinnamon Desktop


    Each desktop environment behaves differently to that of the next. Some DEs offer
    widgets that can be customised and placed on the desktop, others instead for a
    clean, sharp look to keep everything running as fast as possible. Let''s see what
    the Cinnamon desktop has to offer.


    ## A TOUCH OF SPICE


    The Cinnamon desktop environment is a great deal of style and performance. There''s
    lots to love about it, which is why it''s a popular DE.


    - **STEP 1** Begin exploring the Cinnamon desktop by double-clicking the Computer.
    This brings Nemo, the file manager used in Cinnamon. The Computer icon opens the
    root level file system, with access to the optical drive (if you have one installed),
    hard drive and core Linux file system.


    - **STEP 2** The Linux file system can appear confusing to a former Windows user,
    so you''re a little more knowledgeable on how it all works, we recommend you concentrate
    on the Home icon on the desktop. In here is everything relating to your user account:
    where you store Pictures, Videos, Music, Documents items etc.


    - **STEP 3** Nemo has many different features, views and ways so that you can
    view and manipulate files and folders. For example, if you have images in the
    Pictures folder, you can select the icon level for the images by using the slider
    located in the bottom right of Nemo, labelled Adjust Zoom Level.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_31_0.png)


    - **STEP 4** Just like any good file manager, if you right-click any of the files
    or folders within you get a wealth of options. In the case of Cinnamon, the defaults
    allow you to view a file depending on what type of file it is and copy, cut, delete,
    compress, rename, send via email and view it its properties.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_31_1.png)


    - **STEP 5** At the bottom of the desktop there''s the Panel, We''ve already looked
    at one section of the Panel, the Menu. If you right-click on the Panel, other
    than on a Panel app, you see a menu allowing you to edit, add up to the Panel
    in a different way.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_32_0.png)


    - **STEP 6** From that desktop right-click, context menu, select Customise, followed
    by the Desktop Settings link to the bottom of the newly opened window. This opens
    a new window where you''re able to edit desktop icons. If you''re using a setup
    with multiple monitors attached, you can also choose which monitor displays icons.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_32_1.png)


    - **STEP 7** For example, if you click the option Modify Panel, you can remove,
    remove the Panel, add a new one and clear it of all Applets that are currently
    present. An Applet, by the way, is an app that is designed to work and fit into
    the Cinnamon Panel.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_32_2.png)


    - **STEP 8** Click on the Menu and system settings icons to opening the result
    icon. Here you''re able to control and edit the way Linux Mint Cinnamon looks
    and works as well as you add new users, manage the firewall and enable accessibility
    options.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_32_3.png)


    - **STEP 9** If you right-click anywhere desktop you see a set of options that
    allows you to further add to, or view the desktop content. it''s very similar
    to that of Windows, which is why Mint is a good choice for ex-Windows users.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_32_4.png)


    - **STEP 10** In short, Linux Mint can be configured to look quite extraordinary.
    There are many examples of how good it can be and what can be achieved. You can
    go as simple or as complex as you want, adding different components and adjustments
    or just keeping it plain and easy to read.


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_32_5.png)


    ## 10 Things to do After Installing Linux Mint


    Linux Mint is a polished distro out of the box, but with most Linux distros, there
    are some tweaks that can be applied to improve the way it works. Although these
    are Mint-specific tweaks, most can be applied to other distros.


    ## LINUS TWEAKS


    Some of these post-installation actions are highly recommended, while others are
    just handy additions and simply tweak the system or add a customised.


