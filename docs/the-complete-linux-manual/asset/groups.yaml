    \ {\n}\n```\n\n- **STEP 2** Start simple creating two variables, a and b, with\
    \ one having a value of 10 and the other 5. You can use the data type int to declare\
    \ these variables. Within the curly brackets:\n\n```cpp\nint a;\nint b;\na = 10;\n\
