  mdcn: "\n\n# 通过终端安装应用 - 第一部分\n\n## 步骤 5\n\n这为 Variety 壁纸切换器应用添加了软件仓库，它可以自动更换壁纸。这是一个基于\
    \ Ubuntu 的应用程序，可以在 Mint 中运行并安装。现在仓库已安装，输入：`sudo apt-get update` 以更新新信息并将内容添加到包管理器。\n\
    \n## 步骤 6\n\n现在安装 Variety，输入：`sudo apt-get install variety`。按 y 接受并继续安装。安装完成后，你可以更改类型来运行该程序。\n\
    \n```\nsudo apt-add-repository ppa:variety/ppa\nsudo apt-get update\nsudo apt-get\
    \ install variety\n\n# 如果遇到关于 apt-get-repository 的错误，请安装：\nsudo apt-get install\
    \ software-properties-common\n# 然后运行：\nsudo apt-add-repository ppa:variety/ppa\n\
    sudo apt-get update\nsudo apt-get install variety\n```\n\n```\nReading package\
    \ lists ...\nBuilding dependency tree ...\nReading state information ... Done\n\
    The following NEW packages will be installed\nvariety 1.2.1-1 ubuntu-focal [612\
    \ KB]\nlibavcodec58:2.8.18-0ubuntu0.0 [2.1 MB]\nlibavformat58:5.8.53-0ubuntu0.0\
    \ [1.1 MB]\nlibavscale5:5.8.100-0ubuntu0.0 [1100 KB]\n4 new packages will be installed,\
    \ 4.3 MB of additional disk space will be used.\nDo you want to continue? [Y/n]\
    \ y\nUnpacking...\nSelecting previously selected variety 1.2.1-1 ubuntu-focal\
    \ (612 KB)\nSetting up libavcodec58 (2.8.18-0ubuntu0.0) (2.1 MB).\nSetting up\
    \ libavformat58 (5.8.53-0ubuntu0.0) (1.1 MB).\nSetting up libavscale5 (5.8.100-0ubuntu0.0)\
    \ (1100 KB).\nSetting up variety (1.2.1-1 ubuntu-focal) (612 KB).\nVariety 1.2.1\
    \ is now the version.\n```\n\n# 移除应用\n\n除了安装之外，apt 命令还可以用于移除任何应用，保持系统整洁并释放资源。\n\
    \n## 步骤 1\n\n要卸载并移除 Variety 应用，输入以下内容：`sudo apt-get remove variety`。输入 y 继续卸载应用；同时注意由于移除该应用，你的硬盘上释放了多少空间。\n\
    \n```\ndaviddavid-mint $ sudo apt-get remove variety\nReading package lists ...\n\
    Building dependency tree ...\nReading state information ... Done\nThe following\
    \ packages will be REMOVED:\nvariety 1.2.1-1 ubuntu-focal [612 KB]\n0 upgraded,\
    \ 0 newly installed, 1 to remove and 0 not to upgrade.\nAfter this process, 612\
    \ KB of disk space will be freed.\nDo you want to continue? [Y/n] y\n```\n\n##\
    \ 步骤 3\n\n当你从系统中移除应用时，某些自动安装的包将不再需要。你已经在上面的过程中看到，可以使用命令 `sudo apt-get autoremove`\
    \ 找到它们，然后按 y。\n\n```\ndaviddavid-mint $ sudo apt-get autoremove\nReading package\
    \ lists ...\nBuilding dependency tree ...\nReading state information ... Done\n\
    The following packages will be REMOVED:\nlibboost-system-dev1.74.0-1ubuntu2.20.4\
    \ [1.1 MB]\n0 upgraded, 0 newly installed, 1 to remove and 0 not to upgrade.\n\
    After this operation, 1,100 KB disk space will be freed.\nDo you want to continue?\
    \ [Y/n] y\n```\n\n## 步骤 2\n\n当 'apt-get' 命令卸载应用时，它不会移除随应用一起的额外文件，例如配置和库文件。要彻底移除卸载程序，输入：`sudo\
    \ apt-get purge variety`。\n\n```\ndaviddavid-mint $ sudo apt-get purge variety\n\
    Reading package lists ...\nBuilding dependency tree ...\nReading state information\
    \ ... Done\nThe package is not installed, so not removed\n0 upgraded, 0 newly\
    \ installed, 0 to remove and 0 not to upgrade.\n```\n\n## 步骤 4\n\n最后，为了清理系统中所有未使用的包，并移除\
    \ autoremove 命令删除的元素，你可以输入：`sudo apt-get autoremove`。Mint 设置了良好的运行状态并剪除了不必要的包。\n\
    \n```\ndaviddavid-mint $ sudo apt-get autoremove\nReading package lists ...\n\
    Building dependency tree ...\nReading state information ... Done\nThe following\
    \ packages will be REMOVED:\n0 upgraded, 0 newly installed, 0 to remove and 0\
    \ not to upgrade.\n```\n\n# 通过终端安装应用 – 第二部分\n\n大多数情况下，你将使用标准的 apt-get 命令从终端安装应用。然而，有时某个应用需要额外工作。这意味着从源代码安装应用，这听起来并没有想象中那么可怕。\n\
    \n## 从源码安装\n\n在这里你需要熟悉的命令是 Configure、Make 和 Install。你会发现很多应用都是从源码使用的，因此这绝对值得投入时间。\n\
    \nLinux 源代码文件通常以 .tar.gz 或 .tar.bz2 的形式出现。两种压缩文件都包含了 `make` 应用所需的代码。通过在主目录创建一个新文件夹开始此教程：`mkdir\
    \ vim`。`wget` 命令从互联网获取内容。根据 Mint 的文件系统，应该显示压缩文件。\n\n### 步骤 1\n\n```\ndavid-mint\
    \ $ mkdir vim\n```\n\n### 步骤 2\n\nVim 是一种高级文本编辑器，我们将用它作为示例。进入文件夹 `cd vim`，然后在新文件夹中终端输入以下命令：`wget\
    \ ftp://ftp.vim.org/pub/vim-7.tar.bz2`。我们需要解压文件内容：`tar -xf vim-7.bz2` 并按 Tab 键自动全名称。\n\
    \n```\ndavid-mint $ tar -xf\n```\n\n### 步骤 5\n\n如果你输入 `ls`，你会发现创建了一个名为 vim74 的文件夹；这代表\
    \ Mint。通过这种方法升级的应用版本将有它们自己的。\n\n### 步骤 8\n\n你可能需要继续安装依赖项。在安装每个新依赖后，重新运行 `./configure`，如果没有报告错误，就可以继续下一个安装阶段。注意：你可能需要在网上搜索某些错误。\n\
    \n```\ndavid-mint ~ ./vim\n```\n\n```\ndavid-mint ~ ./configure\nchecking for\
    \ gcc... gcc\nchecking for cc... gcc\nchecking for make... make\nchecking for\
    \ readline... yes\nchecking for terminfo... yes\nchecking for ncurses... yes\n\
