    # # Creating Bash Scripts – Part 4


    One of the most well used examples of Bash scripting is the creation of a backup
    routine, one that automates the task as adding some customisations along the way.


    A basic backup script would look something along the lines of: `/bin/bash, then
    tar cvf ~/backups/my-backup.tg ~/Documents/ will create a compressed file of the
    /Documents folder, with everything in it, and put it in a folder called /backups
    with the name my-backup.tg.


    # STEP 4


    Once the /backups folder is created, we can now create a new subfolder within
    it at the beginning. `mkdir -p $S$/$day $Month $year*` It''s in here that you
    put the backup file to date/month/year.


    ```

    #!bin/bash

    clear

    # time

    day=$(date +%d)

    month=$(date +%B)

    year=$(date +%Y)

    # Folders

    dest=~/backups

    source=~/Documents

    if [ ! -d $source ]; then

    echo "Backup folder does not exist! I''m now creating..."; mkdir -p $source

    fi

    echo "Press any key to continue..."; read -n 1

    echo "Backup file created $day/$Month/$year"

    ```


    # STEP 5


    While perfectly fine, we can make the script a lot more interactive. Let''s begin
    defining some variables. Enter the text in the screenshot into a new backup script.
    Note that we''ll misspell: ''source'' as ''sauce'', because there''s a built-in
    command called ''source'' here the different spelling on our part.


    With everything ready, you can now enter the actual backup routine, based on the
    tar command from Step 5. With the variables, we use `tar cvf $S$/$day $Month $yearDocumentsbackup.tg`.
    In the screenshot, we added a handy "Backup up..."


