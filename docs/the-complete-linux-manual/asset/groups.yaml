- md: "\n## Strings\n\nStrings are objects that represent and hold sequences of characters.\
    \ For example, you could have a universal greeting in your code 'Welcome' and\
    \ assign that as a string to be called up wherever you like in the program.\n\n\
    ## STRING THEORY\n\nThere are different ways in which you can create a string\
    \ of characters, which historically are all carried over from the original C language\
    \ and supported by C++.\n\nTo create a string, use the char function. Open a new\
    \ C++ file and begin with the usual:\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n\n}\n```\n\nBuild and run the code and 'Welcome' appears\
    \ on the screen. While this is perfectly fine, it's not a string. A string is\
    \ a class, which defines objects that can be represented as a stream of characters\
    \ and doesn't need to be terminated like an array. The code can therefore be represented\
    \ as:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n\n\
    \    char greet[] = \"Welcome\";\n    cout << greet << \"\\n\";\n}\n```\n\nIt's\
    \ easy to confuse a string with an array. Here's an array, which can be terminated\
    \ with a null character:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main() {\n\n    char greet[8] = {'W', 'e', 'l', 'l', 'c', 'o', 'm', '\\\
    0'};\n    cout << greet << \"\\n\";\n}\n```\n\nIn C++, there's also a string,\
    \ which works in the same way. Using the greeting code,\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n\n    string greet = \"Welcome\";\n    cout\
    \ << greet << \"\\n\";\n}\n```\n\n## Strings\n\nSTEP 5: There are also many different\
