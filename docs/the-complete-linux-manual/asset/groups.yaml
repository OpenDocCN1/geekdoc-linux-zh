  mdcn: "\n\n# 更多循环\n\n你可以使用 `FOR`、`WHILE` 和 `UNTIL` 语句对数据进行循环。如果你需要批量命名、复制或运行需要计数器的脚本，这些语句非常有用。\n\
    \n**步骤 1** 创建一个名为 `count.sh` 的新脚本。输入下方截图中的文本，保存并赋予执行权限。该脚本创建了变量 `count`，在脚本开始时等于零。启动\
    \ `WHILE` 循环，当 `count` 小于（`LT` 部分）0 时，在 echo 命令中打印 `count` 的当前值。\n\n**步骤 4** `UNTIL`\
    \ 循环的工作方式与 `WHILE` 循环非常相似，只是通常会是：**`until [ $count -gt 100 ];`**。区别在于，直到 `count`\
    \ 大于（`gt` 部分）一百，继续循环。\n\n```bash\ncount.sh\n#!/bin/bash\ncount=0\nwhile [ $count\
    \ -lt 100 ]; do\n    echo $count\n    let count=$count+1\ndone\n```\n\n**步骤 2**\
    \ 执行脚本 `count.sh` 将导致数字 0 到 99 列在终端屏幕；当达到 100 时将结束。使用 `FOR` 语句修改脚本使其更易用。在这种情况下，将截图中的文本输入\
    \ `count.sh`。\n\n**步骤 5** 你的限制并不限于数字一百。你可以在任何喜欢的命令集中执行你想要循环运行的任意次数。重命名文件、创建五个文件夹——例如，此脚本将使用\
    \ `FOR` 循环创建名为 `folder1` 到 `folder10` 的文件夹。\n\n```bash\ncount.sh\n#!/bin/bash\n\
    for count in {0..100}; do\n    echo $count\n    let count=$count+1\ndone\n```\n\
    \n**步骤 3** `{0..100}; do:` 意味着 `FOR` 变量 `count` 取从零到一百的数字，然后开始循环。脚本的其余部分相同。运行此脚本，终端中会出现相同的输出。\n\
    \n**步骤 6** 使用 `FOR` 循环再次执行该序列，我们正在操作 (0-100) 部分。这部分代码实际上意味着（开始，结束，增量）。如果没有增量，则只是到结束的单个数字。例如，你可以使用循环按两位计数到\
    \ 1000：`for count in {0..1000;2}; do`\n\n```bash\ncount.sh\n#!/bin/bash\nfor count\
    \ in {0..1000;2}; do\n    echo $count\n    let count=$count+1\ndone\n```\n\n#\
