    ![](img/9eddebb0cf792a0bbe16478be74a68e1_33_1.png)


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_33_2.png)


    ## 10 Things to do After Mint


    **STEP 5** The updates are graded by level, level 5, being a dangerous one.


    **STEP 6** Click the Driver Manager app appears as a result of the search and
    enter your password. Mint takes a moments to analyze what is available and presents
