    ## Linux 入门


    ## 在 PC 上安装 Linux


    大多数发行版都以运行环境（Live Environment）的形式提供。这意味着你可以从创建的 DVD 或 USB 启动一个真实的、功能齐全的发行版。让我们看看它是如何工作的，以及你如何安装
    Linux。


    ### UEFI BIOS


    统一可扩展固件接口（UEFI）用于在电脑启动过程中识别和保护 PC。它取代了传统的 BIOS，但在安装 Linux 时可能会导致问题。


    - **步骤 1** 将你的 DVD 或 USB 闪存盘插入 PC，如果尚未关闭 Windows，请将其关闭。在本例中，我们使用 USB 介质，但过程几乎相同。启动
    PC，并在提示时按键进入 BIOS 或 SETUP，例如：F2、Del 或 F12。

    - **步骤 3** 在将 UEFI 切换到 Legacy（遗留）模式后，有两种方法进入运行环境。第一种方法是通过你已经进入的 BIOS。找到启动顺序（Boot
    Sequence），并将第一个启动设备从原始设置（使用内部硬盘或类似设备）更改为 USB 介质对应的“USB Storage Device”，或 DVD 介质对应的“DVD
    Drive”。

    ![](img/9eddebb0cf792a0bbe16478be74a68e1_21_0.png)

    - **步骤 2** UEFI BIOS 有多个版本，涵盖了你需要的所有内容。你正在寻找一个详细说明启动顺序或启动模式的区域。在这里，你有关闭 UEFI 并选择
    Legacy 或 Secure Boot（安全启动）的。大多数发行版支持 UEFI，但在其上安装可能会有些复杂。

    - **步骤 4** 或者使用启动菜单（Boot Menu）。通过它，你可以按 F12（或类似的按键）显示启动选项列表；从那里你可以选择合适的启动介质。之后，可以通过
    Save & Exit（保存并退出）选项并选择“Save Changes and”保存 BIOS。

    ![](img/9eddebb0cf792a0bbe16478be74a68e1_21_1.png)


    ## 安装 Linux


    一旦运行环境启动，你就可以使用选项将发行版安装到你的电脑上。浏览一下，准备好后，在桌面上寻找“Install”（安装）选项。


    - **步骤 1** 只要你已连接到网络（如果没有，请连接）并处于运行环境中，只需双击桌面上的“Install Mint”图标即可开始安装过程。当然，其他发行版会显示自己的名称，但过程是相同的。准备好后点击“Continue”（继续）。

    ![](img/9eddebb0cf792a0bbe16478be74a68e1_22_0.png)

    - **步骤 4** 在安装过程开始之前，系统会询问你选择的名称，以确保硬盘被擦除。这是你最后一次退出的机会。如果你确定不会抹除所有内容并重新开始 Linux
    Mint，请点击“Continue”。如果你需要将文件备份到 USB，请重启并重新开始。

    - **步骤 2** 虽然安装过程与大多数 Linux 发行版非常相似，但某些发行版在安装过程中会有不同的问题。这些问题并不困难，没有很技术性的内容，但某些如“安装第三方软件...”等问题可能会让人困惑。万你点击了继续但不确定，请准备好一台连接了网络的设备以便咨询任何问题。

    - **步骤 5** 最终，系统会要求你设置用户名和密码。输入你的名称开始，并设置计算机名称（Computer Name），这是网络上的标识。接下来选择用户名，然后设置一个良好的密码。你可以点击“Login
    Automatic”（自动登录）选项，但暂时先留过“Enter Home Folder”（进入主文件夹）选项。

    ![](img/9eddebb0cf792a0bbe16478be74a68e1_22_1.png)

    ![](img/9eddebb0cf792a0bbe16478be74a68e1_22_2.png)

    - **步骤 6** 安装过程可能很快，可能会有更多问题回答，或者它可能只是根据你之前的回答安装 Linux。无论如何，你最终会被要求是继续运行运行环境还是重启到新安装的操作系统；如果你已准备好使用
    Linux，请点击“Restart Now”（立即重启）。

    ![](img/9eddebb0cf792a0bbe16478be74a68e1_22_3.png)

    ![](img/9eddebb0cf792a0bbe16478be74a68e1_22_4.png)


    ## 安装虚拟环境


    虚拟环境是一个模拟的计算机系统。使用虚拟机（Virtual Machine），你可以模仿标准 PC 并在上面安装另一个操作系统，而不会影响电脑上安装的系统。这是测试和使用
    Linux 的极佳方法，同时仍将 Windows 10 作为主操作系统。


    ## 进入虚拟化


    使用虚拟机（VM）会消耗你的资源：内存、硬盘空间、处理器占用等。开始前请确保每项都有足够的量。


    - **步骤 1** 本例中我们使用 VirtualBox，因为它是最容易掌握的虚拟环境之一。进入 virtualbox.org 并点击“Download
    VirtualBox”。这将带你进入主下载页。找到你系统的正确宿主机：Windows、Mac 或 Linux（Host 指已安装的操作系统），并点击链接开始下载。

    - **步骤 2** 仍然在 VirtualBox 下载页面，找到“Extension Pack”（扩展包）。这些扩展包支持 USB 设备以及许多可以帮助虚拟机的额外功能。

    - **步骤 3** 在你开始安装包之前，由于你点击了下载的包，你需要确保电脑可以运行。重启电脑。在电脑启动时，提示按键进入 BIOS。

    ![](img/9eddebb0cf792a0bbe16478be74a68e1_23_0.png)

    - **步骤 4** 每个 BIOS 布局不同。你正在寻找的是关于“Virtualisation”（虚拟化）的设置，它位于 BIOS 的 Advanced（高级）部分中。当你找到它时，启用该设置，退出
    BIOS 并重启。

    ![](img/9eddebb0cf792a0bbe16478be74a68e1_23_1.png)


    ## 安装虚拟环境


    - **步骤 5** VirtualBox 运行后，你现在可以安装扩展包。点击“Next”。在 VirtualBox 激活补丁时，可能会暂时断开网络。点击“Install”开始过程。

    - **步骤 6** 此此可以保持默认设置，除非你正在处理虚拟机。点击“Next”将带你进入下一个屏幕。

    - **步骤 7** VirtualBox 的默认安装位置应该满足大多数用户，如果你有特殊需求，点击“Browse”按钮更改位置。

    - **步骤 8** 在你开始安装扩展包之前，Windows 会询问你接受安全通知。点击“Yes”并接受安装。

    - **步骤 9** 安装完成后，点击“Finish”按钮启动 VirtualBox。


    '
