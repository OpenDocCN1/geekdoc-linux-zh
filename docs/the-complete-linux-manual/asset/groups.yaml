  mdcn: '


    ## 你需要的设备


    在 PC 上成功安装 Linux Mint 的系统要求低得令人惊人，因此即使是几年前的电脑也能轻松运行这个发行版。然而，在继续之前，检查你是否已经准备好了一切是值得的。


    ## MINT 的配要素


    在我们开始学习这本书之前，这里是你安装和运行 Linux Mint 所需要的内容。你有多种选择，请花些时间看看哪种最适合你。


    ## 系统要求


    Linux Mint 的最低系统要求如下：


    - CPU – 700MHz

    - 内存/RAM – 512MB

    - 硬盘空间 – 9GB（推荐 20GB）

    - 显示器 – 1024 x 768 分辨率


    显然，你拥有的系统越好，体验越佳，速度也越快。


    ## USB 安装


    你可以通过 USB 或 DVD 在电脑上安装 Linux Mint。我们稍后会详细介绍，但如果你已经熟悉该流程，只需考虑使用 USB 并收集所需的硬件，即一个至少
    4GB 的 USB 闪存盘来存储 Linux Mint 的 ISO 镜像。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_11_0.png)


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_11_1.png)


    ## DVD 安装


    DVD 安装 Linux Mint 只需要一张空白 DVD-R 光盘，当然，在将 ISO 镜像传输或刻录到光盘之前，你还需要一个光驱（DVD 刻录机）。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_11_2.png)


    ## 虚拟机


    在虚拟机环境中测试和使用 Linux 发行版的常用方法。Linux Mint 在虚拟机环境中运行效果非常好，但这一点稍后会说。有很多不同的虚拟机应用可用；然而，来自
    Oracle 的 VirtualBox 是最上手的之一。你可以在 www.virtualbox.org 找到最新版本。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_12_0.png)


    ## 网络连接


    不言而喻，网络连接对于确保 Linux Mint 能够获取最新的更新和补丁，以及安装更多软件至关重要。虽然使用 Linux Mint 不需要网络连接，但你将错过该发行版所提供的许多免费软件。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_12_1.png)


    ## MAC 硬件


    虽然 Linux Mint 可以安装在 Mac 上，但有一种观点认为 Mac 用户使用虚拟机环境，例如 VirtualBox 或 Parallels；而且为什么不此呢，macOS
    本身已经是一个很棒的操作系统了。如果你想为旧款 Mac 注入新生命，请确保它是 Intel CPU 型号，但要小心，这不像安装在 PC 上那么顺畅。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_12_2.png)


    ## 桌面环境


    Linux Mint 有几个不同的版本或或“口味”：Cinnamon、MATE 和 Xfce；这些版本也有 32 位和 64 位之分。这意味着什么？你安装时应该选择哪一个版本？


    ## 哪种 MINT？


    桌面环境是你用于与 Linux 系统交互的图形界面。就像 Windows 10 的图形桌面一样，它被称为“流体设计”（Fluent Design）。Linux
    Mint 为用户提供了多个版本选择：Cinnamon、MATE 和 Xfce。虽然这听起来可能让新手有些困惑，但每个版本都包含相同的 Linux 结构和内核，内核是操作系统的核心，处理软件和硬件之间的指令。


    每个版本都是不同的桌面环境，即你用于与操作系统交互的图形用户界面 (GUI)。每个桌面环境使用不同的应用程序来访问或使用系统，例如文件管理器用于浏览操作系统结构或启动其他程序。再次，可用性、视频和图形套件是相同的，工作方式也相同。


    为什么要费力尝试不同的桌面环境？简单来说，取决于个人喜好。有些用户偏爱 MATE，因为 MATE 是经典 GNOME 2 环境的分支，更注重菜单，在现代硬件上运行良好并具有一些现代特性。Xfce
    是一个轻量级桌面环境，由于其资源占用极低，在旧硬件上运行良好。


    简而言之，Cinnamon 是 Linux Mint 的旗舰桌面环境。MATE 兼容更广泛的硬件。在 Windows 等系统中只提供一种桌面环境，而 Linux
    Mint 则为用户提供了丰富的选择。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_13_0.png)


    ## CINNAMON 的特点


    Cinnamon 除了外观和感受之外还有许多优点，尽管这些都是重要因素。在这里，我们列了一些特性，帮助你判断它是否适合你。


    ### 特性 1

    它在现代系统上表现出色，并且比以前稳定得多，不再是资源大户了。因此，如果你在使用或安装 Linux Mint，不要放弃 Cinnamon。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_14_0.png)


    ### 特性 2

    Cinnamon 具有可配置的热角，点击桌面的每个角落即可执行特定任务，例如工作区、显示所有或运行命令。热角允许你在不同的视图之间切换，让桌面更高效。


    ## MATE


    MATE 是一种简单直观的 DE，快速且稳定。与 Cinnamon 相比，它看起来有些过时，但这只是表面。MATE 有许多值得喜欢的地方。


    ### 特性 2

    MATE 是旧电脑的极佳桌面环境。它对硬件组件的兼容性比 Cinnamon 更好，但同样提供美观的桌面以及高级定制功能。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_14_1.png)


    ## XFCE 桌面


    Xfce 起于 1996 年的 Xt 桌面环境 (XDE)。从那以后它更改了几次，现在简单称为 Xfce，绰号为“XFree 环境”。


    ### 特性 1

    Xfce 确实是一个快速的桌面，并发挥了 Linux 作为操作系统的最佳性能。事实上，我们从页面顶部开始将其安装到新电脑上，写几百个字也不坏。


    ### 特性 2

    因为它快速且轻量，并不意味着它不属于 Linux Mint。与其他环境一样，你也可以获得最新的 Firefox、LibreOffice、Gimp、应用程序甚至一个
    Torrent 客户端。


    ## 哪种发行版？


    到目前为止，我们主要关注 Linux Mint，但还有其他发行版可以尝试。事实上，有数百种 Linux 发行版可以下载和安装，你应该决定哪一个？


    ## 发行版跳（Distro Hopping）


    “发行版跳”是社区对那些不固定单一发行版的人使用的术语。相反，他们在它们之间跳跃，测试每一个，直到转向另一个或新发布的发行版。


    发行版跳并没有错，它是了解现有产品的好方法，并发现某个发行版比另一个更符合你口味的元素。你应该使用哪一个的问题这取决于你自己。


    例如，Linux Mint 是一个理想的起点。它易于安装和使用，开箱即用包含了你日常所需的所有软件，并让你轻松地进入 Linux 的独特世界及其工作和表现。


    Ubuntu 提供了类似的体验，但方式略有不同。Ubuntu 的感知度通常比 Mint 少。另一个值得考虑的点是，当 Ubuntu 用户遇到困难时，有海量的内容和帮助，你离解决方案并不远。


    接下来，随着你对 Linux 变得越来越自信，你可能会尝试 Fedora 或 Debian。这些都是非常优秀的发行版，每个都为用户提供了关于系统运行的不同视角。就
    Linux 而言，某些发行版比其他版本要求更高，但每个都有自己的价值并能为用户提供什么。


    ![](img/9eddebb0cf792a0bbe16478be74a68e1_15_0.png)


    虽然发行版跳很有趣，但它并不是一种享受 Linux 并获取最大价值的稳定方式。我们不是说你应该固守某一个且永不看别处，因为你可能会错过很多优秀内容，但我们建议你找到一个家，并根据你不断增长的技能在那里进步。


    你可能会发现自己转向某个特定的发行版，因为它提供了完全不同的东西。例如，Tails 是一个为完全匿名设计的发行版。它包含了复杂的军事级加密工具，以及可以让你在不被检测、追踪或监控的情况下浏览的浏览器。Kali
    Linux 是为安全专业人士设计的，包含了各种伦理黑客工具。


