    \nwww.bdmpublic.com 129\n\n## 使用注释\n\n虽然在制作游戏、应用程序甚至整个操作系统时，与数行代码相比，注释似乎是微不足道的，但实际上，它们可能是最重要的因素之一。\n\
    \n## 注释的重要性\n\n代码内部的注释基本上是人类可读的描述，详细说明了代码在某一点正在做什么。它们听起来似乎特别重要，但如果没有注释，无论你是专业人士还是初学者，这都是编程中最令人沮丧的领域之一。\n\
    \n简而言之，对代码的注释方式应该有效地描述一行代码、一个部分或单个元素的目的。你应该养成尽可能多注释的习惯，这样不了解编程的人也可以通过阅读你的注释来拿起你的代码并理解它将要做什么。\n\
    \n在专业环境中，注释对于代码的成功以及最终公司或项目的成功至关重要。在一个组织中，许多程序员与工程师、开发者和分析师一起工作。如果团队中任何部分在为公司编写软件，那么当出现问题需要另一位团队成员接手并追踪线索以确定问题时，你的注释将节省大量时间。\n\
    \n最好的注释总是简洁的，并将代码逻辑联系起来，详细说明程序运行到某一行或某一部分时发生的情况。你不需要注释每一行。类似“如果 x 等于零则执行某操作”这样的内容对读者来说显而易见。如果\
    \ x 是一个彻底改变程序的值，或者我们的行用完了，那么它确实需要注释。\n\n即使代码是你自己的，如果你要将其分享给其他人，也应该编写注释。这样你就可以返回代码，理解它做了什么，哪里出错了，或者哪里运行得非常好。\n\
    \n注释是良好的习惯，并且你知道何时需要添加注释等等。\n\n设身于某人的立场，他的工作是找出你程序中的错误。该程序有超过800行代码，分布在几个不同的模块中。你可能还需要原始程序员通过良好的注释来提供一点点帮助。\n\
