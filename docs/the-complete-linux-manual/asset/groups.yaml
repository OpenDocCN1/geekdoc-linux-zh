    \ will return the line: The value of A is 10 to the IDLE Shell window, which is\
    \ what we expect. Now, add some of the comments you'd normally see within code:\n\
    ```python\n# Set the value of A to 10\na=10\n# Print the current value of A\n\
    print(\"The value of A is,\", a) \n```\n\n- STEP 3 Save the code and execute it.\
    \ You can see that the output in the IDLE Shell is still the same as before, despite\
    \ the extra lines being added. Simply, put the hash symbol (#) denotes a line\
