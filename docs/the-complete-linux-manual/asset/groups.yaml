- md: '

    # Why Linux?


    For many of its users, Linux means freedom. Freedom from the walled garden approach
    of other operating systems, freedom to change and extend the OS as you please
    and freedom from any form of licensing or payment. There''s a lot more to Linux
    than you might think.


    # FREE AND OPEN


    Linux is a fantastic fit for those who want something different. The efficiency
    of the system, the availability of applications and stability are just a few reasons.


    The first thing you need to know is that there is no operating system called Linux.
    Linux is in fact the operating system kernel, the core component of each. When
    talking about Linux what we mean, we are referring to one of the many distributions,
    distros, such as Ubuntu, Fedora, openSE, Debian, Raspberry Pi, the list goes on.
    Each of these distros offers something a little different for the user. While
    each has the Linux kernel at its core, they provide the user with a different
    looking desktop, different package managers, and different ways in which to start
    and get more apps installed and a slightly different look and feel throughout
    the entire system. At heart, there lies Linux, which is why we say Linux.


    Linux works considerably differently to Windows or macOS. It''s free for a start;
    free to install on as many computers as you like, free for an unlimited amount
    of time and free to create applications. This free to use is one of the biggest
    draws for the developers. You can customise it much more and a user, be a developer,
    a gamer or someone who wants to use an older computer, can quickly download a
    distro and get to work in a matter of minutes.


    Alongside the free to use comes a level of freedom to customise and the system
    to your own needs. Each of the available distros available on the Internet have
    a certain ''spin''.


    Linux is a great system on which to start coding.


    # Why Linux?


    There are thousands of free packages available for programmers under Linux.


    In some other, offer increased security, a fancy desktop, a gaming space or something
    dreamed toward students. This flexibility makes Linux a dependable tool for us,
    including many different kinds of IDEs for the likes of Python, C++, Java and
    so on; or create a base for anonymity, perhaps as a Minecraft server, a media
    center, and more.


    Another remarkable advantage for those looking to learn code, is that Linux comes
    with most of the popular environments built in. Both Python and C++ are preinstalled
    in a high percentage of Linux distros, which means you can start to program as
    soon as you install the system and use it for the first time.


    Generally speaking, Linux doesn''t take up many resources as Windows or macOS;
    by resources we mean, hard drive space and CPU power. The Linux code is compact,
    which frees those systems resources. A more efficient system of code means more
    resources for the coding and testing and the programs you eventually create. Use
    of resources also means you can use Linux on older hardware that normally struggle
    or refuse to run the latest versions of Windows or macOS; so than throwing away
    an old computer, it can be reused with a Linux distro.


    Each distro offers something unique to the user but all have Linux at the core.


    It''s not about C++, Python or any of the other popular programming languages
    used. Using the command line of Linux, also called the Terminal, you are able
    to create Shell scripts, which are programs that are designed to run from the
    command line and used to easily after the user some form of input and output for
    a certain operation.


    Finally, there are many more advantages we can list, and there are hundreds and
    thousands of free programs available that cover nearly every aspect of knowing.
    Known packages, there are (at the time of writing) over 8,700 specific programming
    applications just on Linux Mint and an incredible 62,000+ categories ranging from
    Abstract to WWW.


    Linux is, a great resource and environment for programming. It''s perfectly suited
    for developers and is continually improving and evolving. If you''re serious about
    getting into coding, or if you want to try something new, give Linux a try and
    see how it works for you.


    A Linux programming environment can be as simple or complex as you want it to:


    ```bash

    # Example of a simple bash script

    #!/bin/bash

    echo "What is your name?"

    read name

    echo "Hello, $name!"

    ```


    # The Best Distributions


    There are many versions of Linux available, each has a different approach. Here
    are some great ones to try:


    The installation process for most distributions is similar. You download the image
    from the website and burn it to an optical disc or create a USB drive.


    The most popular distro is Linux Mint, which began in 2006 and is based on Ubuntu.
    Linux Mint has three main environments: Cinnamon, MATE, and XFCE. Cinnamon is
