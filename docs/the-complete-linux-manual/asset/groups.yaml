- md: "\n# User Interaction\n\nThere's nothing quite as satisfying as creating a program\
    \ that responds to you. This basic user interaction is one of the most-taught-aspects\
    \ of any language and with it you're ready to do much more than simply greet the\
    \ user by name.\n\n## HELLO, DAVE\n\nYou have already used cout, the standard\
    \ output stream, throughout our code. Now you're going to be using cin, the standard\
    \ input stream, to prompt a user response.\n\n- Anything that you want the user\
    \ to input into the system memory needs to be stored somewhere in it. Therefore,\
    \ any input must be declared as a variable, so it's ready to be used by the user.\
    \ Start by creating a C++ file with headers.\n\n- The cin command works in the\
    \ opposite way from the cout command. With the first cout line 'what is your age?'\
    \ to the screen, as indicated with the chevrons. Cin uses opposite facing chevrons,\
    \ indicating an input. The input is put into the integer variable and again in\
    \ the second command. Build and run the code.\n\n```cpp\nuserinteraction.cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main() {\n    int age;\n    cout\
    \ << \"What is your age: \";\n    cin >> age;\n\n    cout << \"You are \" << age\
    \ << \" years old.\\n\";\n}\n```\n\n| File Edit Tabs Help |\n| :--- |\n| what\
    \ is your age: 45 |\n| You are 45 years old. |\n\n> (program exited with code:\
    \ 0)\n> press return to continue\n\nThe data type of the variable must also match\
    \ the type of input you want from the user. For example, to ask them their age,\
    \ you would use an integer like this:\n\nIf you're asking, you need to store the\
    \ input as a string; to ask them their name, you would:\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n    int age;\n    cout << \"What is your\
    \ age: \";\n    cin >> age;\n\n    cout << \"You are \" << age << \" years old.\\\
    n\";\n}\n```\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\
    \ {\n    string name;\n    cout << \"What is your name: \";\n    cin >> name;\n\
    \n    cout << \"Hello, \" << name << \" I hope you're well today!\\n\";\n}\n```\n\
    \n# User Interaction\n\nSTEP 5 The principal works are the same as the previous.\
    \ The user's input, name, is stored in a string, because it contains multiple\
    \ characters, and retrieved in the second cout line. As long as the variable 'name'\
    \ doesn't change, then you can recall it whenever you like.\n\nSTEP 8 While cin\
    \ works well for most input tasks, it does have a limitation. Cin always considers\
    \ spaces as single words not multiple words. However, getline takes as the first\
    \ word and the variable as the second:\n\n```\nwhat is your name: David:\nmills,\
    \ David. I hope you want the user today-\n```\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main () {\n  string mystr;\n  cout << \"Enter a sentence:\
    \ \\n\";\n  getline(cin, mystr);\n  cout << \"Your sentence is: \" << mystr.length()\
    \ << \" characters long.\\n\";\n}\n```\n\n```\nprogram executed with code: 0\n\
    return to console.\n```\n\nSTEP 6 You can chain input requests to the user but\
    \ make sure you have a valid variable to store the input. Let's assume you want\
    \ the user to enter two numbers:\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main () {\n  int num1, num2;\n  cout << \"Enter two numbers: \\\
    n\";\n  cin >> num1 >> num2;\n  cout << \"You entered \" << num1 << \" and \"\
    \ << num2 << \" \\n\";\n}\n```\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main () {\n  int num1, num2;\n  cout << \"Enter two numbers: \\\
    n\";\n  cin >> num1 >> num2;\n  cout << \"You entered \" << num1 << \" and \"\
    \ << num2 << \" \\n\";\n}\n```\n\nSTEP 7 Likewise, data can be manipulated once\
    \ you have stored it in a variable. For instance, ask the user for two numbers\
    \ and do maths on:\n\nSTEP 9 Build and execute the code, then enter a sentence\
    \ with spaces. If you've read the code replace the getline line with cin >> and\
    \ try again, the result displays the characters up to the first space.\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main () {\n  float num1, num2;\n\
    \  cout << \"Enter two numbers: \\n\";\n  cin >> num1 >> num2;\n  cout << \"\"\
    \ << num1 << \" + \" << num2 << \" is: \" << num1 + num2 << \" \\n\";\n}\n```\n\
    \nSTEP 10 getline is a command that C++ programmers forget to use. The terminating\
    \ white space is annoying when you're figuring out why your code isn't working.\
    \ In short, it's best to use getline(cin, variable) in function:\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main () {\n  string name;\n  cout <<\
    \ \"Enter your full name: \\n\";\n  getline(cin, name);\n  cout << \"Hello, \"\
    \ << name << \" \\n\";\n}\n```\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main () {\n  int num1, num2;\n  cout << \"Enter two numbers: \\\
    n\";\n  cin >> num1 >> num2;\n  cout << \"\" << num1 << \" + \" << num2 << \"\
    \ is: \" << num1 + num2 << \" \\n\";\n}\n```\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main () {\n  string name;\n  cout << \"Enter your\
    \ full name: \\n\";\n  getline(cin, name);\n  cout << \"Hello, \" << name << \"\
    \ \\n\";\n}\n```\n\n# The Hobbit\n\nDID YOU KNOW...\n\nThe Hobbit released in\
    \ 1982 for various platforms, Melbourne House's Hobbit was a coding work of genius.\
    \ Developed by Philip Mitchell and Veronika, The Hobbit was uniquely coded using\
    \ a parser called 'Inquis' which allowed the player to enter full sentences, such\
    \ as “Take sword from Gandalf, and fight goblin.”\n\nFurthermore, each object\
    \ in the game had size and solidity; if you sat on or picked up or threw it, your\
    \ character would be taken along with it. Also, in early versions of the game,\
    \ non-playing characters would often move around and capture each other before\
    \ the player had reached that stage. There was even a random event in place with\
    \ the start of the game, where any character could pick up an object from any\
    \ location. This meant that, potentially, it was possible for Thorin to pick you\
    \ up and carry you for the entire adventure. Remarkable for a game that took up\
    \ less than 8KB of memory you are in a narrow place with a dreadful drop into\
    \ a valley. No time to sit down and start singing about Thorin.\n\n# Sinclair\
    \ 48K Spectrum\n\n# The Hobbit\n\nThe Hobbit is a super program that is a milestone\
    \ in computer software. You will face dangers and adventure in words and graphics.\
    \ Meet all the characters from The Hobbit and talk to them in ordinary English!\
    \ The Hobbit program brings you into an exciting and challenging fantasy!\n\n\
    # Melbourne House\n\nThe Hobbit, a marvel in advanced coding from 1982.\n\n# Common\
    \ Coding Mistakes\n\nWhen you start something you're inevitably going to make\
    \ mistakes, this is purely down to inexperience and those mistakes are great teachers\
    \ in themselves. However, even experts make the occasional mishap. It is to learn\
    \ from them as best you can.\n\n# Small Chunks\n\nThere are many pitfalls for\
    \ the programmer to be aware of, far too many to be listed here. Being able to\
    \ recognize a mistake and fix it when you start to move into more advanced territory\
    \ will become a better coder. Even coders over thirty years' experience. Learning\
    \ from these common mistakes helps build a better coding foundation.\n\nIt would\
    \ be wonderful to work like Neo from The Matrix movies. Simply ask, your operator\
    \ loads it into your memory and you instantly know everything about the subject.\
    \ Sadly though we't do that. The major pitfall is someone trying to learn too\
    \ much, too quickly. So coding in small pieces and take your time.\n\n# Easy Variables\n\
    \nMeaningful naming for variables is a must to eliminate common coding mistakes.\
    \ Having letters of the alphabet is fine but what happens when the code states\
    \ a problem with x variable. It's not too difficult to name lives, player 1 and\
    \ so.\n\n```\nvar points = 1023;\nvar lives = 3;\nvar totalTime = 45;\nwrite(\"\
    Points: \" + points);\nwrite(\"Lives: \" + lives);\nwrite(\"Total Time: \" + \"\
    totaltime\" + \")\");\nwrite(\"\");\nvar totalScore = 0;\nwrite(\"Your Total Score\
    \ is \" + totalScore);\n```\n\n# Comments\n\nUse comments, it's a simple concept\
    \ but commenting your code saves so many problems when you come next to it. Inserting\
    \ comment lines helps you quickly sift through blocks of code that are causing\
    \ problems; also useful if you need to review an older piece of code.\n\n```\n\
    orig = 2;\ntarget = 2;\nn = 5;\n{\n};\n#endif\nif (n == 0)\n  return;\n}\n\n//\
    \ Loop until, here be danger.\n\n// (n - (-3)) is the greatest multiple of 4\n\
    // In the while loop, orig will move out\n// line (a element of the frame)\n//\
    \ ends our marker for not falling out\nchar const end = orig + 2 * (n - (-3));\n\
    \n// See if we're aligned for writing in 64 or\nif (end & 64 == 0)\n// {defined}\
    \ (end && 64) // defined (x86_64)\n```\n\n# Plan Ahead\n\nWhile it's great to\
    \ work up one morning and decide to code a classic text, it's not always practical\
    \ without a good plan. Snippets of code can be written without too much thought\
    \ and planning but longer and in depth code requires a good working plan to stay\
    \ and hit out the bugs.\n"
