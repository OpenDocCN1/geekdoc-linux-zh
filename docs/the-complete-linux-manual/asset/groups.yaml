    - STEP 4: The Guest Additions CD is on the desktop, so right-click it and then
    scroll down to the menu. You can now restart Linux by clicking the Menu, the bottom
    icon on the left, the Restart button. This reboots Mint and the problem is fixed.


    ## CINNAMON ON THE MENU


    Now the Software Rendering Issue for VirtualBox is out of the way, let''s take
    a look at the Mint Menu and how it works. Remember, this is for Mint Cinnamon,
    others distros look and behave differently.


    - STEP 1: First off, you may have already noticed the Welcome Screen that pops
