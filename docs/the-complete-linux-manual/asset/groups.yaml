    # STEP 5


    You can also use an operation to test the remainder left over from division. For
    example:


    # 10/3


    Will display 3.333333333, which is of course 3-recurring. If you now enter:


    # 10%3


    This will display 1, which is the remainder left over from dividing 10 into 3.


    ```

    23796012129175024

    >> 5/2

    >> 2.5

    >> 2*3

    >> 6

    >> (1+2)*(3^4)

    >> 81

    >> 6/2

    >> 3

    >> 10/2

    >> 5

    >> 3.3333333333333335

    >> 2*3

    >> 6

    >> 10*10

    >> 100

    ```


    # STEP 8


    This will be displayed as ''01'', converting the integer into binary and the prefix
    0b to. If you want to remove the 0b prefix, then you can use:


    # format(3, ''b'')


    The format converts a value, the number 3, to a formatted representation as controlled
    by the format specification, the ''b'' part.


    ```

    >> 2**2

    >> 4

    >> (1+2)*(3^4)

    >> 81

    >> 15/2

    >> 7.5

    >> 6/2

    >> 3

    >> 3.3333333333333335

    >> 2*3

    >> 6

    >> 10*10

    >> 0b1010000010

    ''11''

    ```


    # STEP 6


    Next we have the power operator, or exponentiation if you want to be technical.
    To work out the power of something you can use a double multiplication or double-star
    on the keyboard.


    # 2**3

    10**10


    It''s essentially 2^3 but you already know the behind math operators. This is
    how you would work it out in Python.


    ```

    >> 6/2

    >> 3

    >> 2**3

    >> 8

    >> (1+2)*(3^4)

    >> 81

    >> 1/2

    >> 0.5

    >> 10/2

    >> 5

    >> 3.3333333333333335

    >> 2*3

    >> 6

    >> 10*10

    >> 1000000000

    ```


    # STEP 9


    A Boolean logical is a statement that is either true or false. We can use these
    to compare data and test if it''s equal, less to or greater than. This in a New
    File:


    ```

    a = 6

    b = 7

    print(1, a = 6)

    True

    print(2, a = 7)

    print(3, a = 6 and b = 7)

    False

    print(4, a = 7 and b = 7)

    True

    print(5, not a = 7 and b = 7)

    False

    print(6, a = 7 or b = 7)

    True

    print(7, a = 7 or b = 6)

    True

    print(9, not (a = 7 and b = 6))

    False

    ```


    # STEP 7


    Numbers and expressions don''t stop there. Python has builtin functions to work
    out of numbers, absolute values, complex numbers and a host of mathematical expressions
    and Pythagorean-twisters. To convert, to binary, use:


    # bin(3)


    ```

    >> 1/2

    >> 0.5

