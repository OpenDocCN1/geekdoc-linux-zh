    used by security professionals for security auditing and assessment.


    To use Nessus for port scanning, you can create a custom scan policy that specifically
    focuses on port scanning. Here are the steps to create a custom scan policy for
    port scanning in Nessus:


    Log in to the Nessus UI.


    Click on the "Policies" tab.


    Click the "New Policy" button.


    Give your policy a name and select "Custom" as the policy template.


    In the "Plugins" section, select "Port scans" and configure the desired port scan
    options, such as the range of ports to scan and the scan speed.


