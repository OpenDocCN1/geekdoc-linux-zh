    on a target network, including their IP addresses, operating systems, and open
    ports.


    Customizable scans: Netdiscovery allows users to customize their scans to meet
    their specific needs, by selecting the type of scan, the range of IP addresses
    to be scanned, and the type of information to be gathered.


    Multi-threaded: Netdiscovery is multi-threaded, allowing it to scan multiple IP
    addresses at the same time, making the scanning process faster and more efficient.


