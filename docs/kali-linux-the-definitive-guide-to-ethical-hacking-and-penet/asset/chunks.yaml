    ## Vulnerability Scanners


    Vulnerability scanners: Vulnerability scanners can be used to detect and assess
    the vulnerabilities present on a network. This information can be used to identify
    and prioritize the patches and fixes needed to prevent exploits.


    Endpoint security software: Endpoint security software can detect and prevent
    exploits by monitoring system activity, checking files for signs of malware, and
    blocking malicious traffic.


    Network security devices: Network security devices such as firewalls, intrusion
    prevention systems, and network access control systems can help detect and prevent
    exploits by monitoring network traffic and controlling access to systems.


    Security Information and Event Management (SIEM) systems: `SIEM` systems collect,
    correlate, and analyze security-related data from various sources to detect potential
    security threats, including exploits.


    Continuous monitoring: Regular monitoring and assessment of systems and networks
    can help detect exploits in real time. This can include monitoring for unusual
    network traffic patterns, changes in system configurations, and new processes
    or files on systems.


    Regular patching: Regularly patching systems and software can help prevent exploits
    by addressing known vulnerabilities.


    Vulnerability assessment and exploitation are important phases of penetration
    testing, and `Kali Linux` provides various tools for both. Understanding how to
    use these tools is essential for performing effective penetration tests and identifying
    weaknesses in the target system or network.


    ![](image_rsrc58C.jpg)


    ## 7. Wireless hacking and penetration testing


    Wireless networks have become a widespread technology in our daily lives, providing
    convenient access to the internet and other online resources. Despite their widespread
    use, wireless networks are not immune to security vulnerabilities. Penetration
    testing is a security assessment process that simulates real-world attacks to
    uncover potential security risks.


    `Kali Linux` provides a comprehensive toolset for penetration testing and ethical
    hacking. It is widely used by security professionals, ethical hackers, and researchers
    to assess the security of a target system.


    ### Wireless Network Fundamentals


    Before diving into wireless hacking and penetration testing, it is important to
    have a solid knowledge of wireless network fundamentals. Wireless networks operate
    using radio waves and communicate using protocols such as `Wi-Fi`, `ZigBee`, and
    `Bluetooth`. These protocols provide communication between devices and allow data
    to be transmitted between them.


    ### Wireless Hacking


    Wireless hacking is the act of compromising the security of a wireless network
    to gain unauthorized access to sensitive information or resources.


    There are several common methods of wireless hacking, including:


    - **Wi-Fi cracking**: This involves capturing the authentication handshake between
    a client device and the wireless access point, and then cracking the password
    using specialized tools and techniques.

    - **Rogue access point**: This involves creating a fake access point that appears
    to be legitimate, tricking users into connecting to it and capturing their information.

    - **Man-in-the-Middle (MitM) attacks**: This involves intercepting and altering
    the communication between two devices, giving the attacker the ability to steal
    sensitive information or inject malicious code.


    ### Penetration Testing with Kali Linux


    Penetration testing is the process of evaluating a target system''s security by
    attempting to penetrate it. The objective of a pen testing is to identify an attack
    on a system or network in order to identify and evaluate any security vulnerabilities.


    `Kali Linux` provides range of tools for wireless penetration testing, including:


    - `Aircrack-ng`: This tool is used for cracking `Wi-Fi` passwords and performing
    wireless security assessments.

    - `Wireshark`: This tool is used for capturing and analyzing network traffic.

    - `Reaver`: This tool is used for cracking `WPS` (`Wi-Fi Protected Setup`) passwords
    on wireless access points.

    - `Metasploit`: This tool is used for exploiting vulnerabilities in target systems.


    ### Wireless Hacking Methodology


    `Wi-Fi` cracking is using `Kali Linux` tools. Example of the steps:


    1. Put the card into monitor mode: `airodmon-ng <interface>`

    2. Scan for available networks: `airodump-ng <interface>`

    3. Select the target: `airodump-ng --channel <channel> --bssid <BSSID> -w <output>
    <interface>`

    4. Capture the handshake: `airodump-ng --wshake -r <output>`

    5. Crack the password: `aircrack-ng -w <wordlist> <file>`


    The output shows:

    ```

    airodump-ng --channel <channel> --bssid <BSSID> -w <output> <interface>

    ```

    The following `airodump-ng` output appears when `airodmon-ng` is running:

    ```

    airodump-ng

    ```

