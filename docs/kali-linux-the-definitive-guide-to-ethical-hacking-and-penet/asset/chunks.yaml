    ## 什么是跳转（Pivoting）？


    `跳转（Pivoting）`是渗透测试中使用的一种技术，用于将攻击范围从被攻破的主机扩展到同一网络上的其他系统。`跳转`的目标是获取那些无法从攻击者机器直接访问、但可以通过被攻破系统访问的系统的权限。


