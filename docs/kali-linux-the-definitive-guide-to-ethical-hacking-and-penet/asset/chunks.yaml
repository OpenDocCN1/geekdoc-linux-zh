    Examples of how to use Zenmap for network scanning:


    Scan a single host: In the "Target" field, enter the IP address or hostname of
    the system you want to scan. Select a profile, then click the "Scan" button.


    Scan multiple hosts: In the "Target" field, enter a range of IPs or a list of
    hostnames separated by a space. Select a profile, then click the "Scan" button.


    Scan using a custom Nmap command: In the "Target" field, enter the IP address
