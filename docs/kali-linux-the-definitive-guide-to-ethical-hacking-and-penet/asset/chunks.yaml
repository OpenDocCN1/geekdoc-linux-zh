  trans: "\n\n## 与其他工具集成\nMimikatz 可以与其他工具集成，例如密码破解工具和渗透测试框架，以增强你的工具包的功能。\n\n开源：Mimikatz\
    \ 是一个开源工具，允许安全研究人员和开发者修改并改进代码，以满足他们的特定需求。\n\n## dsniff\ndsniff 是一套用于网络审计和渗透测试的工具。它被用于监控和拦截网络流量，并识别目标网络中的安全漏洞。\n\
    \n- `arpspoof`: 用于通过投毒目标系统上的 ARP 缓存来拦截和更改网络流量的工具。\n- `dnsspoof`: 用于通过伪造 DNS 响应来拦截和更改\
    \ DNS 流量的工具。\n- `filesnarf`: 用于捕获网络传输文件的工具。\n- `mailsnarf`: 用于捕获网络传输的电子邮件的工具。\n\
    - `msgsnarf`: 用于捕获网络传输的即时消息对话的工具。\n- `sshmitm`: 用于通过伪造 SSH 服务器来拦截和更改 SSH 流量的工具。\n\
    - `webmitm`: 用于通过伪造 Web 服务器来拦截和更改 HTTP 流量的工具。\n\n## Netdiscovery\nNetdiscovery\
    \ 是一种网络发现工具，用于收集网络上设备的信息。它设计用于扫描目标网络并识别连接到其上的设备，包括它们的 IP 地址、操作系统和开放端口。\n\nNetdiscovery\
    \ 使用多种技术（如 ping 扫描、端口扫描和操作系统指纹识别）来收集目标网络上设备的信息。Netdiscovery 收集的信息可以用于识别目标网络中的潜在安全漏洞，并帮助规划和执行网络渗透测试。\n\
    \n### Netdiscovery 的核心特性\n- **快速高效的扫描**：Netdiscovery 的设计目标是快速且高效，允许安全专业人员快速收集目标网络上设备的信息。\n\
    - **详细信息**：Netdiscovery 提供目标网络上设备的详细信息，包括它们的 IP 地址、操作系统和开放端口。\n- **可自定义扫描**：Netdiscovery\
    \ 允许用户自定义扫描以满足其特定需求，通过选择扫描类型、扫描的 IP 地址范围以及要收集的信息类型。\n- **多线程**：Netdiscovery 是多线程的，允许它同时扫描多个\
    \ IP 地址，使扫描过程更快、更高效。\n\n## Impacket-scripts\nImpacket-scripts 是一组 Python 脚本，用于网络安全评估和渗透测试。这些脚本构建在\
    \ `Impacket` 库之上，该库提供了一系列底层的 Python 类，用于处理网络协议和服务。\n\n`Impacket-scripts` 集合包含了许多可用于各种用途的工具，例如：\n\
    - **密码破解**：`packet-scripts` 中包含了几个可以破解密码的脚本。例如，`GetNPUsers.py` 可用于提取目标网络上用户的密码哈希值。\n\
    - **网络侦察**：有多个脚本可用于收集目标网络的信息，例如 `smbserver.py`，它可以用于创建虚假的 SMB 服务器并收集有关客户端连接的信息。\n\
    - **漏洞利用**：有多个脚本可用于利用目标网络中的漏洞，例如 `wmiexec.py`，它可以在目标 Windows 系统上执行任意命令。\n- **横向移动**：有多个脚本可以在目标网络内进行横向移动，例如\
    \ `psexec.py`，可以在远程系统上执行命令。\n\n## Kali Linux\nKali Linux 提供的工具包为网络和安全评估、渗透测试和取证分析提供了一个全面的平台。其友好的界面和广泛的文档使得资深人士和新手用户都能轻松上手。频繁的更新和社区驱动的开发确保了该工具包能够与最新的安全威胁和漏洞保持同步。无论是用于专业目的还是教育目的，Kali\
    \ Linux 都是一个宝贵的资源，提供了为了领先于潜在安全威胁并确保网络和系统安全所需的工具和知识。\n\n![](img/image_rsrc58A.jpg)\n\
    \n## 5. 网络扫描与侦察\n网络扫描和侦察是渗透测试过程的第一步，渗透测试是评估计算机系统或网络安全的过程。网络扫描和侦察的目标是收集目标网络及其系统的信息，旨在识别潜在的安全漏洞和弱点。\n\
    \n### 网络扫描\n网络扫描：这是使用自动化工具搜索连接到目标网络的设备的过程，包括它们的 IP 地址、操作系统、开放端口和其他信息。通过网络扫描收集的信息用于构建目标网络及其系统的映射，然后可以使用它来规划和执行进一步的安全测试。\n\
    \nKali Linux 中一些常用的网络扫描工具包括：\n\n- **Nmap**：Nmap 是一种广泛使用的网络映射工具，可用于扫描目标网络上的主机、开放端口和其他信息。\n\
    \  - **扫描主机**：要扫描目标网络上的主机，你可以在终端中使用以下命令：\n    ```\n    nmap [target IP range or\
    \ hostname]\n    ```\n  - **扫描开放端口**：要扫描目标主机上的开放端口，你可以使用以下命令：\n    ```\n    nmap\
    \ -p [port range] [target IP or hostname]\n    ```\n  - **扫描服务**：要扫描目标主机上运行的服务，你可以使用以下命令：\n\
    \    ```\n    nmap -sV [target IP or hostname]\n    ```\n  - **操作系统指纹识别**：要确定目标主机上运行的操作系统，你可以使用以下命令：\n\
    \    ```\n    nmap -O [target IP or hostname]\n    ```\n\n- **Zenmap**：Zenmap\
    \ 是 Nmap 的图形用户界面 (GUI)，使其对非技术用户更容易使用。\n- **Nessus**：Nessus 是一个全面的漏洞扫描器，可识别目标网络中的漏洞。\n\
    \n### 使用 Zenmap 进行网络扫描的示例：\n- **扫描单个主机**：在“Target”字段中，输入要扫描的系统的 IP 地址或主机名。选择一个配置，然后点击“Scan”按钮。\n\
    - **扫描多个主机**：在“Target”字段中，输入 IP 范围或用空格分隔的主机名列表。选择一个配置，然后点击“Scan”按钮。\n- **使用自定义\
    \ Nmap 命令扫描**：在“Target”字段中，输入要扫描的系统的 IP 地址或主机名。在“Profile”部分选择“Custom command”。在“Command”字段中，输入自定义的\
    \ Nmap 命令。例如：`nmap -p- -A`。点击“Scan”按钮开始扫描。\n- **保存扫描结果**：扫描完成后，点击“File”菜单并选择“Save”。选择一个目标路径来保存文件并选择一种文件格式（例如\
    \ Nmap XML）。\n\n- **OpenVAS**：OpenVAS 是一个漏洞评估系统，可用于扫描目标网络中的漏洞。\n  - **扫描单个主机**：在“Targets”部分，点击“New\
    \ Target”。输入要扫描的系统的 IP 地址或主机名。点击“Create”。在列表中选择目标并点击“Start Scan”。\n  - **扫描多个主机**：在“Targets”部分，点击“New\
    \ Target”。输入 IP 地址范围或用空格分隔的主机名列表。点击“Create”。在列表中选择目标并点击“Start Scan”。\n  - **使用特定的扫描配置扫描**：在“Configurations”部分，选择一个扫描配置。在“Targets”部分，选择你要扫描的节点。点击“Start\
    \ Scan”。\n\n"
- fmt: '

    ### Schedule a recurring scan

    In the "Targets" section, select the target you want to scan. Click "Schedule".
    Enter a name for the schedule, select a frequency (e.g. daily), and select a start
    time. Click "Create".


    ### Scan a single host

    Run the following command:


    ```

    openvas-scanner -n <target_ip>

    ```


    ### Scan multiple hosts

    Run the following command:


    ```

    openvas-scanner -n <target_ips>

    ```


    where `<target_ips>` is a list of IP addresses separated by a space.


    ### Scan using a specific scan configuration

    Run the following command:


    ```

    openvas-scanner -n <target_ip> -c <config_id>

    ```


    where `<config_id>` is the ID of the scan configuration you want to use.


    ### Generate a report

    After the scan is complete, run the following command to generate a report:


    ```

    openvas-report-generate -f <format> -d <report_directory> <task_id>

    ```


    where `<format>` is the format of the report (e.g. "pdf"), `<report_directory>`
    is the directory where the report will be saved, and `<task_id>` is the ID of
    the scan task.


    ### Angry IP Scanner

    Angry IP Scanner is a simple and fast IP scanner that can be used to scan for
    hosts on a target network.


    ```

    ipscan [options] <target_ip>

    ```


    where `<target_ip>` is the IP address or range of IP addresses you want to scan,
    and `[options]` are any optional parameters you want to include.


    For example, to scan a single host with a range of ports, you could run the following
    command:


    ```

    ipscan -p 20-80 <target_ip>

    ```


    To scan multiple hosts, you can specify a range of IP addresses as the target:


    ```

    ipscan -p 20-80 192.168.1.1-192.168.1.255

    ```


    ### Advanced IP Scanner

    Advanced IP Scanner is a fast and reliable IP scanner that can be used to scan
    for hosts, services, and other information on a target network.


    ```

    AdvancedIPScanner.exe [options] <target_ip>

    ```


    where `<target_ip>` is the IP address or range of IP addresses you want to scan,
    and `[options]` are any optional parameters you want to include.


    To scan a single host with a range of ports, you could run the following command:


    ```

    AdvancedIPScanner.exe -p 20-80 <target_ip>

    ```


    To scan multiple hosts, you can specify a range of IP addresses as the target:


    ```

    AdvancedIPScanner.exe -p 20-80 192.168.1.1-192.168.1.255

    ```


    ### Fping

    Fping is a simple ping tool that can be used to test the connectivity of a target
    network. These are just a few of the network scanning tools included in Kali Linux.
    The tools are powerful and flexible and can be utilized to gather information
    about a target network and its systems, as well as to identify potential security
    vulnerabilities and weaknesses.


    ```

    fping [options] <target_ips>

    ```


    where `<target_ips>` is a list of IP addresses separated by a space, and `[options]`
    are any optional parameters you want to include.


    To ping a single host, you could run the following command:


    ```

    fping <target_ip>

    ```


    To ping multiple hosts, you can specify a list of IP addresses as the target:


    ```

    fping 192.168.1.1 192.168.1.2 192.168.1.3

    ```


    ### Port Scanning

    Port scanning is a type of network scanning that focuses on identifying open ports
    and services on a target system. Port scanning is used to identify potential targets
    for exploitation and to find weaknesses in a target system''s security. Kali Linux
    comes with a variety of tools for port scanning. the most commonly used port scanning:


    #### Nmap

    Nmap (Network Mapper) It can be used to scan a network and identify open ports,
    as well as to perform various other tasks such as OS detection, host discovery,
    and vulnerability assessment.


    **Nmap port scanning commands:**


    Scan a single host for open ports:

    ```

    nmap <target_ip>

    ```


    Scan multiple hosts for open ports:

    ```

    nmap <target_ip1> <target_ip2> <target_ip3>

    ```


    Scan a range of IPs for open ports:

    ```

    nmap 192.168.1.1-255

    ```


    Scan a subnet for open ports:

    ```

    nmap 192.168.1.0/24

    ```


    Scan a host for specific port numbers:

    ```

    nmap -p <port_numbers> <target_ip>

    ```


    Fast scan:

    ```

    nmap -F <target_ip>

    ```

    This option will scan only the most common ports, which speeds up the scanning
    process.


    OS detection:

    ```

    nmap -O <target_ip>

    ```

    This option will attempt to determine the operating system of the target host.


    Version detection:

    ```

    nmap -sV <target_ip>

    ```

    This option will attempt to determine the version of the services running on open
    ports.


    Stealth scan:

    ```

    nmap -sS <target_ip>

    ```

    This option performs a stealth scan, which is less likely to be detected by firewalls
    and intrusion detection systems.


    Specifying the source IP address:

    ```

    nmap --source-port <port_number> <target_ip>

    ```

    This option allows you to specify the source IP address and port that Nmap will
    use for the scan


    #### Zenmap

    Zenmap is a graphical frontend for Nmap. It provides a user-friendly interface
    that makes it easy to perform network scans and view the results.


    #### Nessus

    Nessus is a commercial vulnerability scanner that provides in-depth information
    about hosts, including open ports, services, and vulnerabilities. It is widely
    used by security professionals for security auditing and assessment.


    To use Nessus for port scanning, you can create a custom scan policy that specifically
    focuses on port scanning. Here are the steps to create a custom scan policy for
    port scanning in Nessus:


    1. Log in to the Nessus UI.

    2. Click on the "Policies" tab.

    3. Click the "New Policy" button.

    4. Give your policy a name and select "Custom" as the policy template.

    5. In the "Plugins" section, select "Port scans" and configure the desired port
    scan options, such as the range of ports to scan and the scan speed.

    6. In the "Scan Options" section, select "Host discovery" and configure the options
    as desired.

    7. Save.

