    # File Ownership Management


    To modify the owner of a file to the user `johndoe` and the group to `users`:


    ```bash

    chown johndoe:users file.txt

    ```


    To modify the owner of a directory and all its contents:


    ```bash

    chown -R johndoe:users directory

    ```


    To modify the owner of multiple files and directories:


    ```bash

    chown johndoe:users file1.txt file2.txt directory1 directory2

    ```


    To modify the owner of a file to the user with the user ID `1000`:


    ```bash

    chown 1000 file.txt

    ```


    # Cron


    `cron` - schedule commands to run at specified times:


    To list the current cron jobs for a user:


    ```bash

    crontab -l

    ```


    To edit the cron jobs for a user:


    ```bash

    crontab -e

    ```


    To add a cron job to run a script every Monday at 5 PM:


    ```bash

    crontab -e # Add the following line to the file 0 17 * * 1 /path/to/script.sh

    ```


    To add a cron job to run a script every hour:


    ```bash

    crontab -e # Add the following line to the file 0 * * * * /path/to/script.sh

    ```


    To remove all cron jobs for a user:


    ```bash

    crontab -r

    ```


    # Sed


    `sed` - a stream editor used for filtering and transforming text:


    To change all occurrences of the word `old` with the word `new` in a file:


    ```bash

    sed ''s/old/new/g'' file.txt

    ```


    To replace the first occurrence of the word `old` with the word `new` in a file:


    ```bash

    sed ''s/old/new/'' file.txt

    ```


    To replace the word `old` with the word `new` only in line 3 of a file:


    ```bash

    sed ''3 s/old/new/'' file.txt

    ```


    To delete line 5 in a file:


    ```bash

    sed ''5d'' file.txt

    ```


    To delete all empty lines in a file:


    ```bash

    sed ''/^$/d'' file.txt

    ```


    To insert a new line after line 5 in a file:


    ```bash

    sed ''5a\

    This is a new line'' file.txt

    ```


    # Awk


    `awk` - pattern scanning and processing language:


    To print the first and third fields of every line in a file:


    ```bash

    awk ''{print $1, $3}'' file.txt

    ```


    To print every line that contains the word "error" in a log file:


    ```bash

    awk ''/error/ {print}'' logfile.log

    ```


    To print the sum of the second column of a file:


    ```bash

    awk ''{sum+=$2} END {print sum}'' file.txt

    ```


    To print the average of the values in the second column of a file:


    ```bash

    awk ''{sum+=$2; count++} END {print sum/count}'' file.txt

    ```


    To modify the values in the second column of a file by adding 10:


    ```bash

    awk ''{$2+=10; print}'' file.txt

    ```


    # Ping


    `ping` - test network connectivity:


    Ping a website to check if it''s reachable.


    ```bash

    ping google.com

    ```


    Ping a website and limit the number of packets sent:


    ```bash

    ping -c 4 google.com

    ```


    Ping a website and set the packet size:


    ```bash

    ping -s 1000 google.com

    ```


    Ping a website and display only summary information:


    ```bash

    ping -q google.com

    ```


    Ping a website and continuously until stopped with `CTRL + C`:


    ```bash

    ping -t google.com

    ```


    # Netstat


    `netstat` - display network connections, routing tables, and statistics:


    To display all active network connections and listening ports:


    ```bash

    netstat -an

    ```


    To display all TCP connections:


    ```bash

    netstat -at

    ```


    To display all UDP connections:


    ```bash

    netstat -au

    ```


    To display both listening and established network connections:


    ```bash

    netstat -anp

    ```


    To display statistics for all protocols:


    ```bash

    netstat -s

    ```


    To display information about all active Internet connections:


    ```bash

    netstat -i

    ```


    To display routing table information:


    ```bash

    netstat -r

    ```


    # NSlookup


    `nslookup` - query the DNS to obtain domain name or IP address mapping:


    To find the IP address of a website.


    ```bash

    nslookup google.com

    ```


    To look up the name server for a website:


    ```bash

    nslookup -a google.com

    ```


    To look up the mail exchange (MX) record for a domain:


    ```bash

    nslookup -q=mx google.com

    ```


    To look up the IP address of a specific name server:


    ```bash

    nslookup -ns=ns1.google.com google.com

    ```


    To use a specific DNS server to resolve a query:


    ```bash

    nslookup google.com 8.8.8.8

    ```


    # Traceroute


    `traceroute` - trace the network path to a remote host:


    To trace the route to a website:


    ```bash

    traceroute google.com

    ```


    To specify the number of hops to search for:


    ```bash

    traceroute -m 20 google.com

    ```


    To use a specific port number:


    ```bash

    traceroute -p 80 google.com

    ```


    To use the IP address instead of domain name:


    ```bash

    traceroute 216.58.194.174

    ```


    To use a specific network interface:


    ```bash

    traceroute -i eth0 google.com

    ```


    # Ifconfig


    `ifconfig` - configure network interfaces:


    To display information about all network interfaces:


    ```bash

    ifconfig

    ```


    To display information about a specific network interface:


    ```bash

    ifconfig eth0

    ```


    To configure an IP address:


    ```bash

    ifconfig eth0 192.168.0.100 netmask 255.255.255.0

    ```


    To bring up a network interface:


    ```bash

    ifconfig eth0 up

    ```


    To bring down a network interface:


    ```bash

    ifconfig eth0 down

    ```


    To display the MAC address of a network interface:


    ```bash

    ifconfig eth0 | grep HWaddr

    ```


    # Route


    `route` - show/manipulate the IP routing table:


    To display the routing table:


    ```bash

    route -n

    ```


    To add a default gateway:


    ```bash

    route add default gw 192.168.0.1

    ```


    To add a static route:


    ```bash

    route add -net 192.168.2.0 netmask 255.255.255.0 gw 192.168.0.1

    ```


    To delete a static route:


    ```bash

    route del -net 192.168.2.0 netmask 255.255.255.0 gw 192.168.0.1

    ```


    To display the routing information for a specific network:


    ```bash

    route -n get 192.168.0.1

    ```


    # Iables


    `iptables` - configure Linux kernel firewall:


    To display the current iptables firewall rules:


    ```bash

    iptables -L

    ```


    To allow incoming SSH connections:


    ```bash

    iptables -A INPUT -p tcp --dport 22 -j ACCEPT

    ```


    To block incoming connections from an IP address:


    ```bash

    iptables -A INPUT -s 192.168.0.100 -j DROP

    ```


    To allow incoming HTTP traffic:


    ```bash

    iptables -A INPUT -p tcp --dport 80 -j ACCEPT

    ```


    To save the current iptables rules:


    ```bash

    iptables-save > /etc/iptables/rules.v4

    ```


    To load saved iptables rules:


    ```bash

    iptables-restore < /etc/iptables/rules.v4

    ```


    # Dig


    `dig` - query DNS servers for information:


    To look up the IP address for a domain:


    ```bash

    dig google.com

    ```


    To modify the values in the second column of a file by adding 10:


    ```bash

    awk ''{$2+=10; print}'' file.txt

    ```


    To find the MX record for a domain:


    ```bash

    dig google.com MX

    ```


    To find the NS record for a domain:


    ```bash

    dig google.com NS

    ```


    To find the SOA record for a domain:


    ```bash

    dig google.com SOA

    ```


    To find the TXT record for a domain:


    ```bash

    dig google.com TXT

    ```


    To find the CNAME record for a domain:


    ```bash

    dig google.com CNAME

    ```


    To find the A record for a domain:


    ```bash

    dig google.com A

    ```


    To find the AAAA record for a domain:


    ```bash

    dig google.com AAAA

    ```


    To find the ANY record for a domain:


    ```bash

    dig google.com ANY

