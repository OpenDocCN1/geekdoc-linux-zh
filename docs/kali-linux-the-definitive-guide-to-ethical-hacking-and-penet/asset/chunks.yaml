    # nmap - Perform various network scans and tasks:


    - `-sS` for a stealth (`SYN` ) scan, which is a common default scan option.

    - `-sV` for service and version detection, to identify the services running on
    the target and their versions.

    - `-oA` followed by a file name, to output the scan results in multiple formats.


    ```bash

    nmap -sS -sV -oA scan_results 192.168.0.1

    ```


    This will perform a stealth (`SYN` ) scan and service and version detection of
    the target host `192.168.0.1` and save the results in multiple formats to the
    scan results file.


    - `-O` to perform operating system detection, to identify the type and version
    of the operating system running on the target.

    - `-A` to enable OS detection, version detection, script scanning, and traceroute,
    all in one option.

    - `-T[0-5]` to set the timing template, where 0 is the slowest and 5 is the fastest.
    The default value is 3.

    - `-iL` followed by a file name, to specify a list of targets to scan. The file
    should contain one target per line.

    - `-p-` to scan all 65535 TCP ports, which is useful for a comprehensive scan
    of a target.

    - `--top-ports` followed by a number, to scan the most common ports. For example,
    `--top-ports 100` will scan the 100 most common ports.

    - `--open` to only show open ports, which can make the output easier to read.

    - `--script` followed by a script name or category, to run a Nmap script on the
    target. Nmap comes with many built-in scripts, or you can write your own.

    - `--host-timeout` followed by a time in seconds, to set the maximum time to wait
    for a response from a target host.

    - `--scan-delay` followed by a time in seconds, to set the minimum time between
    probes to a target.


    ```bash

    nmap -sS -sV -O -A -oA scan_results -v --top-ports 100 192.168.0.1-192.168.0.255

    ```


    This will perform a stealth (`SYN` ) scan, service and version detection, operating
    system detection, and script scanning of all 256 hosts in the range `192.168.0.1`
    to `192.168.0.255`. The results will be saved in multiple formats to the `scan_results`
    file, and verbose output will be displayed on the console. The scan will only
    focus on the 100 most common ports.


    Where `[target]` can be a hostname, IP address, or range of addresses.


    ```bash

    nmap google.com

    nmap 192.168.1.1

    nmap 192.168.1.1-100

    ```


    You can also specify multiple targets separated by spaces:


    ```bash

    nmap google.com 192.168.1.1

    ```


    # OUTPUT


    ```text

    Starting Nmap 7.80 ( https://nmap.org ) at 2022-12-15 11:10 EST


    Nmap scan report for google.com (216.58.194.174)

    Host is up (0.16s latency).

    rDNS record for 216.58.194.174: lhr25s15-in-f14.1e100.net

    Not shown: 998 filtered ports


    PORT    STATE  SERVICE

    80/tcp  open    http

    443/tcp open    https


    Nmap scan report for 192.168.1.1

    Host is up (0.00043s latency).

    Not shown: 998 filtered ports


    PORT    STATE  SERVICE

    80/tcp  open    http

    443/tcp open    https

    ```


    In this example, `nmap` has scanned both `google.com` and `192.168.1.1`, and it
    reports that both hosts are up and responsive. For each host, `nmap` lists the
    IP address and the reverse DNS record. It also shows the state and service of
    the ports that are open on each host. In this case, both `google.com` and `192.168.1.1`
    have ports `80` and `443` open and running HTTP and HTTPS services, respectively.


