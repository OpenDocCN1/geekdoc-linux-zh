    ## Metasploit


    Metasploit is for developing, testing, and executing exploits. It includes a variety
    of tools for port scanning, as well as for exploiting discovered vulnerabilities.


    You can use Metasploit to perform port scanning using the `auxiliary/scanner/portscan/`
    module. Here are the steps to use Metasploit for port scanning:


    1. **Start the Metasploit Console**: Open a terminal and run the command `msfconsole`
    to start the Metasploit Console.

    2. **Load the Port Scanning module**: In the Metasploit Console, type `use auxiliary/scanner/portscan/tcp`
    to load the TCP port scanning module.

    3. **Set the target**: Type `set RHOSTS <target_ip>` to set the target IP address.
    Replace `<target_ip>` with the IP address of the target you want to scan.

    4. **Set the port range**: Type `set PORTS <port_range>` to set the range of ports
    to scan. Replace `<port_range>` with the desired range of ports, such as 1-1024.

    5. **Start the scan**: Type `run` to start the scan.


    The results of the scan will be displayed in the Metasploit Console, indicating
    which ports are open, closed, or filtered. You can also use other Metasploit modules
    to perform more advanced scans, such as a version scan or a vulnerability scan.


    ### Example of using Metasploit for port scanning


    ```

    msf5 > use auxiliary/scanner/portscan/tcp

    msf5 auxiliary(scanner/portscan/tcp) > set RHOSTS 192.168.1.100

    RHOSTS => 192.168.1.100

    msf5 auxiliary(scanner/portscan/tcp) > set PORTS 1-1024

    PORTS => 1-1024

    msf5 auxiliary(scanner/portscan/tcp) > run

    [+] 192.168.1.100:22 Open SSH

    [+] 192.168.1.100:80 Open HTTP

    [+] 192.168.1.100:443 Open HTTPS

    [-] 192.168.1.100:631 Closed Printer

    [-] 192.168.1.100:3389 Closed Remote Desktop

    ...

    ```


    In this example, the Metasploit Console is started and the TCP port scanning module
    is loaded. The target IP address is set to `192.168.1.100`, and the range of ports
    to scan is set to `1-1024`. The scan is then started by typing `run`. The results
    show that ports 22, 80, and 443 are open on the target, while ports 631 and 3389
    are closed.


    ### Example of using Metasploit for a more advanced scan, including service and
    version detection


    ```

    msf5 > use auxiliary/scanner/ssl/openssl_heartbleed

    msf5 auxiliary(scanner/ssl/openssl_heartbleed) > set RHOSTS 192.168.1.100

    RHOSTS => 192.168.1.100

    msf5 auxiliary(scanner/ssl/openssl_heartbleed) > set PORTS 443

    PORTS => 443

    msf5 auxiliary(scanner/ssl/openssl_heartbleed) > set THREADS 10

    THREADS => 10

    msf5 auxiliary(scanner/ssl/openssl_heartbleed) > run

    [+] 192.168.1.100:443 OpenSSL Heartbleed (CVE-2014-0160) Vulnerability

    [+] Server: Apache

    [+] SSL Version: TLSv1.0

    [+] Cipher: ECDHE-RSA-AES128-SHA

    ...

    ```


    In this example, a different Metasploit module is loaded, `auxiliary/scanner/ssl/openssl_heartbleed`,
    which is specifically designed to detect the Heartbleed vulnerability. The target
    IP address is set to `192.168.1.100`, and the range of ports to scan is set to
    `443`. The number of threads to use during the scan is set to `10`. The scan is
    then started by typing `run`. The results show that the target is vulnerable to
    the Heartbleed vulnerability, and also indicate the web server software and SSL/TLS
    version and cipher in use.


    ## Operating System Fingerprinting


    Operating system fingerprinting is a technique used to identify the operating
    system running on a target system. This information can be utilized to determine
    the potential vulnerabilities of a target system, as well as the appropriate tools
    and techniques to use in further security testing.


    Kali Linux uses the `p0f` tool for operating system fingerprinting. `p0f` is a
    passive OS fingerprinting tool that can be used to determine the operating system,
    vendor, and version of a target system by analyzing network traffic.


    To use `p0f` in Kali Linux, you can simply open a terminal and type `p0f` followed
    by the target IP address. For example:


    ```

    p0f 192.168.1.100

    [+] Listening on eth0 (up)

    [*] 192.168.1.100 - Windows 7 or 2008 R2 - 6.1 (64-bit)

    ```


    In this example, `p0f` is used to analyze network traffic to the target IP address
    `192.168.1.100` and the results indicate that the target is operating on Windows
    7 or Windows Server 2008 R2, version 6.1 in 64-bit mode.


    In addition to `p0f`, there are several other tools that can be used for operating
    system fingerprinting:


    - **Nmap**: A popular open-source network scanner that can be used to perform
    operating system fingerprinting. `Nmap` uses a database of known network signatures
    to identify the operating system of a target system.


    ```

    nmap -O [target IP or hostname]

    ```


    For example:


    ```

    nmap -O 192.168.1.100

    ```


    This command will scan the target IP address `192.168.1.100` and attempt to determine
    the operating system. For more advanced usage of Nmap for operating system fingerprinting,
    you can use the following options:


    - `-T[0-5]`: This option sets the timing template for the scan, where 0 is the
    slowest and 5 is the fastest. The default value is 3.

    - `--osscan-limit`: This option limits the number of resources that Nmap will
    use for operating system fingerprinting.

    - `--osscan-guess`: This option enables Nmap to guess the operating system even
    if the fingerprint is not 100%.

    - `--version-all`: This option enables version detection for all open ports, not
    just those that have a known service.


    Example of a more advanced command for Nmap operating system fingerprinting:


    ```

    nmap -O -T4 --osscan-limit --osscan-guess --version-all 192.168.1.100

    ```


    This command will scan the target IP address `192.168.1.100` with a timing template
    of `4` , limit the resources used for operating system fingerprinting, enable
    Nmap to guess the operating system even if the fingerprint is not 100%, and enable
    version detection for all open ports.


    - **Xprobe2**: An open-source tool for active operating system fingerprinting.
    `Xprobe2` sends specially crafted packets to the target system and analyzes the
    responses to determine the operating system.


    The basic command to use `Xprobe2` for operating system fingerprinting is:


    ```

    xprobe2 [target IP or hostname]

    ```


    For example:


    ```

    xprobe2 192.168.1.100

    ```


    This command will scan the target IP address `192.168.1.100` and attempt to determine
    the operating system running on the target. `Xprobe2` uses active techniques to
    perform operating system fingerprinting.


    You can use the following options to modify the behavior of `Xprobe2`:


    - `-v`: This option enables verbose output, which will display additional information
    about the target system.

    - `-t [number]`: This option sets the timeout value for the scan, where the number
    is the number of seconds to wait for a response from the target system.


    Here is an example of a more advanced command for `Xprobe2` operating system fingerprinting:


    ```

    xprobe2 -v -t 5 192.168.1.100

    ```


    This command will scan the target IP address `192.168.1.100` with verbose output
    enabled and a timeout value of 5 seconds.

