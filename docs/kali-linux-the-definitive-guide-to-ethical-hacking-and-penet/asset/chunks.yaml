    # Navigation:


    - `.` refers to the current directory.

    - `..` refers to the parent directory.

    - `~` refers to the current user’s home directory.

    - `/` refers to the root directory.


    **Tab completion**: You can use the `Tab` key to auto-complete files and directory
    names.

    If you have a directory named `example_dir` and you type `cd ex` and then press
    `Tab`, the terminal will automatically fill in the rest of the name to `cd example_dir/`.


    Utilizing the up and down arrow keys cycle through previously executed commands
    using the up and down arrow keys for easy repetition or modification of past commands.


    **Wildcards**: You can use wildcards such as `*` and `?` to match multiple files
    or directories. For example, `ls *.txt` will list all Text files in the current
    directory with a `.txt` extension.


    **alias**: You can create shortcuts for commonly used commands by using the `alias`
    command. Create shortcuts for frequently used commands using the `alias` command.
    E.g., to create an alias for the `ls` command with options `-l` and `--color`,
    run `alias ll=''ls -l --color''`.


    **history**: You can view a list of previously run commands by using the `history`
    command. This is a useful way to find and repeat a command you used earlier.


    **| (pipe)**: You can use the pipe operator `|` to redirect the output of one
    command as the input to another command. For example, `ls -l | less` will display
    the output of the `ls -l` command.


    **Environment variables**: Environment variables are utilized to store information
    that can be used by commands. For example, `PATH` environment variable contains
    a list of directories that are searched when you run a command.


