    # hping3


    `hping3` is a network testing, fingerprinting, and packet crafting tool that is
    used to test the security of networks and applications. It is commonly used during
    penetration testing and vulnerability assessments, as well as during network security
    assessments.


    `hping3` works by allowing you to create custom packets and send them to a target
