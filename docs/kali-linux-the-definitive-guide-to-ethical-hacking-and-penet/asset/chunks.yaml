    Type the following command to perform a basic Nmap scan for open ports on the
    target system with IP address 10.0.0.1:


    nmap 10.0.0.1


    To perform a more comprehensive scan, including service and version detection,
    you can use the following command:


    nmap -sS -sV 10.0.0.1


    To scan for specific vulnerabilities, you can use Nmap''s NSE (Nmap Scripting
    Engine) scripts. For example, to scan for known vulnerabilities in the SSL/TLS
    protocol, you can use the following command:


    nmap --script ssl-enum-ciphers 10.0.0.1


    To scan for vulnerabilities in specific services or protocols, you can use Nmap''s
    NSE scripts. For example, to scan for vulnerabilities in Microsoft''s Remote Desktop
    Protocol (RDP), you can use the following command:


    nmap --script rdp-enum-encryption 10.0.0.1


    Using OpenVAS for vulnerability scanning:


    Open a terminal or command prompt window in Kali Linux.


    Launch the OpenVAS services by typing the following command:


    openvas-start


    Open a web browser and navigate to https://localhost:9392 to access the OpenVAS
    web interface.


    Log in to the OpenVAS web interface using the default credentials (Username: admin,
    Password:   admin).


    Once logged in, you will be able to create and manage scans, view scan results,
    and configure scan settings.


    To start a new scan, click on the "Tasks" tab in the OpenVAS web interface, then
    click on the "New Task" button.


    In the "New Task" window, provide a name for the task and select the target to
    scan (either an IP address or a hostname). You can also configure the scan settings
    such as the plugins to use, the maximum number of hosts to scan concurrently,
    and the maximum number of plugins to run concurrently.


    Click on the "Create" button to start the scan.


    Once the scan is complete, you can view the results in the OpenVAS web interface
    by clicking on the “Results" tab. The results will show a list of vulnerabilities
    and the associated risk levels.


    Using Nessus for vulnerability scanning:


    Nessus is a commercial vulnerability scanner and is not included with Kali Linux
    by default. You can either purchase a license from Tenable or use the free version
    of the scanner available at https://www.tenable.com/products/nessus-home.


    If you have a Nessus installation, here''s an example of how to use it for vulnerability
    scanning:


    Open a terminal or command prompt window in Kali Linux.


    Launch the Nessus client by typing the following command:


    nessus


    Open a web browser and navigate to https://localhost:8834 to access the Nessus
    web interface.


    log in to the Nessus web interface using the credentials you provided during the
    installation process.


    Once logged in, you will be able to create and manage scans, view scan results,
    and configure scan settings.


    To start a new scan, click on the "Scans" tab in the Nessus web interface, then
    click on the "New Scan" button.


    In the "New Scan" window, provide a name for the scan, select the target to scan
    (either an IP address or a hostname), and select the policies to use for the scan.
    You can also configure the scan settings such as the plugins to use, the maximum
    number of hosts to scan concurrently, and the maximum number of plugins to run
    concurrently.


    Click on the "Save" button to start the scan.


    Once the scan is complete, you can view the results in the Nessus web interface
    by clicking on the "Reports" tab. The results will show a list of vulnerabilities
    and the associated risk levels.


    Metasploit for vulnerability scanning:


    1.  Start the Metasploit Framework console.


    2.  Load the SMB version scanner module by running the following command:


    use auxiliary/scanner/smb/smb_version


    3.  Configure the options for the SMB version scanner by running the following
    command:


    set RHOSTS 192.168.1.0/24


    4.  Launch the SMB version scan by running the following command:


    run


    5.  The scan will run and show the results in real time. An example output might
    look like this:


    [*] 192.168.1.1:445 - Host is likely VULNERABLE to MS08-067!


    [*] 192.168.1.2:445 - Host is likely VULNERABLE to MS17-010!


    [*] 192.168.1.3:445 - Host is NOT vulnerable.


    The output shows that the first two systems (192.168.1.1 and 192.168.1.2) have
    SMB versions that are vulnerable to the MS08-067 and MS17-010 exploits, respectively.
    The third system (192.168.1.3) is not vulnerable.


    The first system (192.168.1.1) is likely vulnerable to the MS08-067 exploit. This
    exploit targets a vulnerability in the SMB service of older versions of Windows,
    which can allow an attacker to execute arbitrary code refers to any code that
    can be executed, regardless of whether it is authorized or not.


    The second system (192.168.1.2) is likely vulnerable to the MS17-010 exploit.
    This exploit targets a vulnerability in the SMB service of newer versions of Windows,
    which can allow an attacker to execute code on the system or spread malware to
    other systems on the network..


    The third system (192.168.1.3) is not vulnerable. This means that the SMB service
    on this system has a version or configuration that is not vulnerable to the MS08-067
    and MS17-010 exploits.


    Just because a system is not vulnerable to the exploits tested in this scan, it
    doesn''t mean that it''s secure. There may be other vulnerabilities that exist
    on the system that were not tested. Additionally, the SMB service may have been
    disabled, or the system may have been configured in such a way that the service
    is not accessible from the network.'
