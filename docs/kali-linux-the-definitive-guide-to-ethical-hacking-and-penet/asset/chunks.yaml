- fmt: '

    If you want to use Kali Linux with a graphical user interface, you''ll need to
    install a desktop environment. The most common desktop environment for Kali Linux
    is `Gnome`, but there are others such as `Xfce`, `Mate`, and `KDE`. To install
    `Gnome`, run the following command in the terminal:


    ```bash

    sudo apt-get install kali-desktop-gnome

    ```


    ### Install Gnome Tweaks


    `Gnome Tweaks` to change the font size, enable/disable desktop icons, or install
    and manage `Gnome Shell` extensions. `Gnome Tweaks` provides an easy-to-use interface
    for accessing advanced configuration options that are not available through the
    normal desktop settings.


    ```bash

    sudo apt install gnome-tweaks

    ```


    ### Install Tor Browser


    Download the Tor Browser Bundle: Go to the Tor Project website ([https://www.torproject.org/download/](https://www.torproject.org/download/))
    and download the latest version of the Tor Browser Bundle for your system.


    Extract the Tor Browser Bundle: After downloading the Tor Browser Bundle, extract
    it to a directory of your choice. For example:


    ```bash

    tar -xvJf tor-browser-linux64-9.5.2_en-US.tar.xz

    ```


    Launch the Tor Browser: Go to the directory where you extracted the Tor Browser
    Bundle and double-click on the `start-tor-browser` script. This will launch the
    Tor Browser.


    Connect to the Tor Network: The first time you launch the Tor Browser, you will
    be prompted to connect to the Tor network. Simply click the "Connect" button to
    start using the Tor Browser.


    ### Install Software Center


    ```bash

    sudo apt install software-center

    ```


    The `Software Center` is a graphical application that provides an easy-to-use
    interface for managing the software installed on your system. With the `Software
    Center`, you can browse and install new software, view information about installed
    software, and manage the software updates for your system.


    When you run the `sudo apt install software-center` command, the `Software Center`
    package will be installed on your system. After installation, you can launch the
    `Software Center` by searching for "Software Center" in the application menu or
    by running the following command in a terminal:


    ```bash

    software-center

    ```


    Once launched, you can use the `Software Center` to browse the available software,
    view information about individual packages, and install new software with a single
    click. The `Software Center` also provides a convenient way to manage software
    updates, making it easier to keep your system up-to-date with the latest security
    patches and bug fixes.


    ### Install GDebi Package Manager


    ```bash

    sudo apt install gdebi

    ```


    `gdebi` is a simple yet powerful package manager that is used to install `.deb`
    (Debian) packages, which are the standard package format for Debian-based systems.
    Unlike the standard package manager, `apt`, `gdebi` can automatically install
    all of the required dependencies for a package, making it easier to install complex
    packages that have multiple dependencies.


    When you run the `sudo apt install gdebi` command, `gdebi` will be installed on
    your system, and you can use it to install `.deb` packages. To use `gdebi`, you
    simply run the `gdebi` command followed by the name of the `.deb` package that
    you want to install, for example:


    ```bash

    sudo gdebi my-package.deb

    ```


    `gdebi` will then automatically download and install the required dependencies
    for the package and install the package itself. If any conflicts or errors occur
    during the installation process, `gdebi` will alert you and provide information
    about how to resolve the issue.


    ### Install Katoolin


    Open a terminal window and execute the following command to download the Katoolin
    script:


    ```bash

    wget https://github.com/LionSec/katoolin/raw/master/katoolin.py

    ```


    Make the script executable:


    ```bash

    chmod +x katoolin.py

    ```


    Run the script:


    ```bash

    sudo ./katoolin.py

    ```


    The `Katoolin` menu will now be displayed. From the menu, you can choose to install
    all of the Kali Linux tools, and specific tools, update the package list, remove
    Kali Linux tools, or quit the script.


    For the installation of all tools from Kali Linux, select option 1. To install
    specific tools, select option 2 and then select the individual tools you want
    to install.


    To update the package list, select option 3. To remove the Kali Linux tools, select
    option 4. To quit the script, select option 0.


    Proceed with the instructions displayed on the screen to finish the installation.


    ```bash

    sudo apt install git

    sudo git clone https://github.com/LionSec/katoolin.git

    sudo cp katoolin/katoolin.py /usr/bin/katoolin

    sudo chmod +x /usr/bin/katoolin

    sudo katoolin

    ```


    ### VirtualBox Extension Pack


    When setting up a virtual environment using `VirtualBox`, you may need to install
    the `VirtualBox Extension Pack` in order to enable support for USB devices and
    other advanced features.


    To install the `VirtualBox Extension Pack`, you can follow these steps:


    1. Download the Extension Pack from the VirtualBox website.

    2. Start `VirtualBox` and select the Kali Linux virtual machine.

    3. Go to the File menu and choose Preferences.

    4. In the Preferences window, select Extensions.

    5. Click the Add Package button and select the Extension Pack file that you just
    downloaded.

    6. Follow the instructions to install the Extension Pack.

    7. Restart `VirtualBox` for the changes to take effect.


    You can also install the `VirtualBox Extension Pack` using the command line. Here
    are the steps to do so:


    1. Download the Extension Pack file and note its location.

    2. Start a terminal in Kali Linux.

    3. Run the following command to install the `VirtualBox Extension Pack`:


    ```bash

    sudo VBoxManage extpack install [extension pack file].vbox-extpack

    ```


    4. Replace `[extension pack file].vbox-extpack` with the name of the Extension
    Pack file you downloaded.

    5. You will be prompted to confirm the installation, type `y`, and press Enter.

    6. The Extension Pack will be installed, and a message indicating a successful
    installation will be displayed.

    7. Restart `VirtualBox` for the changes to take effect.


    ### Troubleshooting


    Steps you can try if your Kali Linux installation is failing in a virtual machine
    (VM):


    - **Check the virtual machine configuration**: Make sure that the virtual machine
    has sufficient resources such as `RAM`, `CPU`, and disk space to run Kali Linux.
    The virtual machine should be allocated a minimum of 2GB of `RAM` and 20GB of
    disk space.

    - **Ensure compatibility with the virtualization platform**: Kali Linux is compatible
    with various virtualization platforms like `VirtualBox`, `VMware`, and `Hyper-V`.
    Make sure that the virtualization platform you are using is compatible with Kali
    Linux and has the latest updates installed.

    - **Verify the ISO image**: Before installing Kali Linux in a virtual machine,
    make sure the ISO image is not corrupted. You can verify the checksum of the ISO
    image using the following command:


    ```bash

    sha256sum kali-linux-<version>-<architecture>.iso

    ```

    - **Set the virtual machine to boot from the installation media**: Make sure that
    the virtual machine is set to boot from the ISO image or the installation media.
    You have to modify the boot order in the virtual machine settings to boot from
    the ISO image.

    - **Install with the correct settings**: During the installation process, make
    sure to select the correct partitioning scheme, file system, and installation
    location.

    - **Check for network connectivity**: Make sure that the virtual machine has network
    connectivity during the installation process. This is necessary for downloading
    and installing packages and updates.

    - **Update the virtual machine''s firmware**: If the virtual machine is running
    on a host machine with `UEFI` firmware, make sure that the virtual machine''s
    firmware is updated to the latest version.

    - **Check for hardware virtualization support**: Make sure that the host machine
    has hardware virtualization support enabled in the BIOS or `UEFI` settings. This
    is necessary for running virtual machines.

    - **Use a clean virtual machine**: If you have installed Kali Linux in the virtual
    machine previously and the installation failed, try creating a new virtual machine
    and starting the installation process from scratch.

