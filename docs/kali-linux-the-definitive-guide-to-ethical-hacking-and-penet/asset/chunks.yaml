    # O scan

    `O scan`: A tool that uses active techniques to perform operating system fingerprinting.
    `O scan` sends a series of packets to the target system and analyzes the responses
    to determine the operating system.


    The basic command to use `oscanner` for operating system fingerprinting is:


    ```

    oscanner [target IP or hostname]

    ```


    For example:


    ```

    oscanner 192.168.1.100

    ```


    This command will scan the target IP address `192.168.1.100` and attempt to determine
    the operating system running on the target. `Oscanner` uses active techniques
    to perform operating system fingerprinting.


    You can use the following options to modify the behavior of `Oscanner`:


    - `-p`: This option specifies a specific port to target with the scan.

    - `-t`: This option sets the timeout value for the scan.

    - `-v`: This option enables verbose output, which will display additional information
    about the target system.


    Here is an example of a more advanced command for `Oscanner` operating system
    fingerprinting:


    ```

    oscanner -p 80 -t 5 -v 192.168.1.100

    ```


    This command will scan the target IP address `192.168.1.100` on port `80` with
    a timeout value of `5` seconds and verbose output enabled.


    # Winfingerprint

    `Winfingerprint`: A Windows-based tool that can be used to perform operating system
    fingerprinting on Windows systems. `Winfingerprint` uses a database of known network
    signatures to identify the operating system of a target system.


    `Winfingerprint` is a Windows-based tool for operating system fingerprinting and
    does not have a command-line interface. To use `Winfingerprint`, you must run
    the tool from a Windows machine and have administrative privileges.


    ### Steps to use Winfingerprint:

    1. Download and install `Winfingerprint` on a Windows machine.

    2. Open the `Winfingerprint` application.

    3. In the `"Target"` section, enter the IP address or hostname of the target system
    you want to scan.

    4. In the `"Scan Options"` section, select the type of scan you want to conduct
    (e.g., OS fingerprint, TCP banner grab, etc.).

    5. Click the `"Start Scan"` button to initiate the scan.

    6. `Winfingerprint` will perform the scan and display the results in the `"Results"`
    section.


    # Vulnerability Scanning

    Vulnerability Scanning is the process of using automated tools to identify known
    vulnerabilities in a target system. This information can be used to prioritize
    remediation efforts and to ensure that critical vulnerabilities are addressed
    in a timely manner.


    ### Using Nmap for vulnerability scanning

    1. Open a terminal or command prompt window in Kali Linux.

    2. Type the following command to perform a basic `nmap` scan for open ports on
    the target system with IP address `10.0.0.1`:

    ```

    nmap 10.0.0.1

    ```

    3. To perform a more comprehensive scan, including service and version detection,
    you can use the following command:

    ```

    nmap -sS -sV 10.0.0.1

    ```

    4. To scan for specific vulnerabilities, you can use `Nmap`''s `NSE` (Nmap Scripting
    Engine) scripts. For example, to scan for known vulnerabilities in the SSL/TLS
    protocol, you can use the following command:

    ```

    nmap --script ssl-enum-ciphers 10.0.0.1

    ```

    5. To scan for vulnerabilities in specific services or protocols, you can use
    `Nmap`''s `NSE` scripts. For example, to scan for vulnerabilities in Microsoft''s
    Remote Desktop Protocol (RDP), you can use the following command:

    ```

    nmap --script rdp-enum-encryption 10.0.0.1

    ```


    ### Using OpenVAS for vulnerability scanning

    1. Open a terminal or command prompt window in Kali Linux.

    2. Launch the `OpenVAS` services by typing the following command:

    ```

    openvas-start

    ```

    3. Open a web browser and navigate to `https://localhost:9392` to access the `OpenVAS`
    web interface.

    4. Log in to the `OpenVAS` web interface using the default credentials (Username:
    `admin`, Password: `admin`).

    5. Once logged in, you will be able to create and manage scans, view scan results,
    and configure scan settings.

    6. To start a new scan, click on the `"Tasks"` tab in the `OpenVAS` web interface,
    then click on the `"New Task"` button.

    7. In the `"New Task"` window, provide a name for the task and select the target
    to scan (either an IP address or a hostname). You can also configure the scan
    settings such as the plugins to use, the maximum number of hosts to scan concurrently,
    and the maximum number of plugins to run concurrently.

    8. Click on the `"Create"` button to start the scan.

    9. Once the scan is complete, you can view the results in the `OpenVAS` web interface
    by clicking on the `"Results"` tab. The results will show a list of vulnerabilities
    and the associated risk levels.


    ### Using Nessus for vulnerability scanning

    `Nessus` is a commercial vulnerability scanner and is not included with Kali Linux
    by default. You can either purchase a license from Tenable or use the free version
    of the scanner available at `https://www.tenable.com/products/nessus-home`.


    If you have a `Nessus` installation, here''s an example of how to use it for vulnerability
    scanning:

    1. Open a terminal or command prompt window in Kali Linux.

    2. Launch the `Nessus` client by typing the following command:

    ```

    nessus

    ```

    3. Open a web browser and navigate to `https://localhost:8834` to access the `Nessus`
    web interface.

    4. Log in to the `Nessus` web interface using the credentials you provided during
    the installation process.

    5. Once logged in, you will be able to create and manage scans, view scan results,
    and configure scan settings.

    6. To start a new scan, click on the `"Scans"` tab in the `Nessus` web interface,
    then click on the `"New Scan"` button.

    7. In the `"New Scan"` window, provide a name for the scan, select the target
    to scan (either an IP address or a hostname), and select the policies to use for
    the scan. You can also configure the scan settings such as the plugins to use,
    the maximum number of hosts to scan concurrently, and the maximum number of plugins
    to run concurrently.

    8. Click on the `"Save"` button to start the scan.

    9. Once the scan is complete, you can view the results in the `Nessus` web interface
    by clicking on the `"Reports"` tab. The results will show a list of vulnerabilities
    and the associated risk levels.


    ### Metasploit for vulnerability scanning

    1. Start the `Metasploit Framework` console.

    2. Load the SMB version scanner module by running the following command:

    ```

    use auxiliary/scanner/smb/smb_version

    ```

    3. Configure the options for the SMB version scanner by running the following
    command:

    ```

    set RHOSTS 192.168.1.0/24

    ```

    4. Launch the SMB version scan by running the following command:

    ```

    run

    ```

    5. The scan will run and show the results in real time. An example output might
    look like this:

    ```

    [*] 192.168.1.1:445 - Host is likely VULNERABLE to MS08-067

    [*] 192.168.1.2:445 - Host is likely VULNERABLE to MS17-010

    [*] 192.168.1.3:445 - Host is NOT vulnerable

    ```


    The output shows that the first two systems (`192.168.1.1` and `192.168.1.2`)
    have SMB versions that are vulnerable to the `MS08-067` and `MS17-010` exploits,
    respectively. The third system (`192.168.1.3`) is not vulnerable.


    The first system (`192.168.1.1`) is likely vulnerable to the `MS08-067` exploit.
    This exploit targets a vulnerability in the SMB service of older versions of Windows,
    which can allow an attacker to execute arbitrary code, regardless of whether it
    is authorized or not.


    The second system (`192.168.1.2`) is likely vulnerable to the `MS17-010` exploit.
    This exploit targets a vulnerability in the SMB service of newer versions of Windows,
    which can allow an attacker to execute code on the system or spread malware to
    other systems on the network.


    The third system (`192.168.1.3`) is not vulnerable. This means that the SMB service
    on this system has a version or configuration that is not vulnerable to the `MS08-067`
    and `MS17-010` exploits.


    Just because a system is not vulnerable to the exploits tested in this scan, it
    doesn''t mean that it''s secure. There may be other vulnerabilities that exist
    on the system that were not tested. Additionally, the SMB service may have been
    disabled, or the system may have been configured in such a way that the service
    is not accessible from the network.

