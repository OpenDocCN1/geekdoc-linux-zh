    an entity and listed the entities. Finally, the user ran the dns.subdomains transform
    to gather information about the subdomains of the domain example.com.


    You can detect and prevent network scanning and reconnaissance, reducing the risk
    of a security breach and protecting sensitive information and systems by following
    these steps:


    Firewall: deploy a firewall to control incoming and outgoing network traffic,
    and restrict access to only trusted sources.


    Access control: implement access control measures such as authentication, authorization,
    and encryption to ensure that only authorized users and devices have access to
    sensitive information and systems.


    Intrusion Detection System (IDS): utilize an IDS to monitor network activity for
    signs of unauthorized access or suspicious behavior.


    Network Segmentation: divide the network into smaller segments to limit the potential
    impact of a security breach and make it more difficult for attackers to access
    sensitive information.


    Regular scans: conduct regular network scans using tools like Nessus, OpenVAS,
    or Qualys to identify vulnerabilities and potential threats.


    Keep software updated: regularly update all software and systems to ensure that
    known security vulnerabilities are patched.


    Monitor logs: monitor logs for unusual activity, such as repeated failed login
    attempts, and take appropriate action when necessary.


    Employee training: educate employees on the dangers of network scanning and reconnaissance,
    and the importance of being vigilant and reporting suspicious activity.


    ![](image_rsrc58B.jpg)


    6\. Vulnerability assessment and exploitation


    Vulnerability assessment and exploitation are two important aspects of penetration
    testing, which are performed to identify and exploit weaknesses in the target
    system or network. Kali Linux is a popular operating system that is widely used
    for ethical hacking and penetration testing. In this chapter, we will discuss
    the various tools and techniques used for vulnerability assessment and exploitation
    in Kali Linux.


    ➢ Vulnerability Assessment: The Vulnerability Assessment involves identifying
    and evaluating the risks or weaknesses present in a system or network. This is
    done to understand the potential risk of the target and to determine the mitigation
    strategies. Kali Linux provides various tools for vulnerability assessment, including
    Nmap, OpenVAS, and Nessus.


    Nmap: Nmap is a popular open-source tool used for network exploration and security
    auditing. It can be used to perform a comprehensive scan of a target system or
    network to identify open ports, services, and other information.


    Open the terminal in Kali Linux and type "nmap" to launch the Nmap command-line
    interface.


    To perform a basic scan of a target host, type "nmap <target IP or hostname>".


    For example:


    nmap 192.168.1.1


    To perform a comprehensive scan of a target host, including service and operating
    system detection, type "nmap -A <target IP or hostname>". For example:


    nmap -A 192.168.1.1


    This will perform a comprehensive scan of the target host at IP address 192.168.1.1.


    *   The scan results will be displayed on the console, including information about
    open ports, services, and the operating system of the target host.


    *   The results will show the open ports, their associated services, and their
    versions. For example:


    PORT STATE SERVICE VERSION


    22/tcp  open  ssh        OpenSSH 7.9p1 Debian 10 (protocol 2.0)


    80/tcp  open  http       Apache httpd 2.4.38 ((Debian))


    The results will also show the operating system of the target host. For example:


    OS detection performed


    Nmap scan report for 192.168.1.1


    Host is up (0.0029s latency).


    Not shown: 998 filtered ports


    PORT   STATE SERVICE VERSION


    22/tcp open  ssh     OpenSSH 7.9p1 Debian 10 (protocol 2.0)


    80/tcp open  http    Apache httpd 2.4.38 ((Debian))


    Device type: general purpose


    Running: Linux 3.X|4.X


    OS CPE: cpe:/o:linux:linux_kernel:3 cpe:/o:linux:linux_kernel:4


    OS details: Linux 3.2 - 4.9


    The Nmap scan results show that the target host at IP address 192.168.1.1 is up
    and has two open ports, 22 and 80\. Port 22 is open and running ssh, and port
    80 is open and running http. The operating system of the target host is Linux,
    with a kernel version between 3.2 and 4.9.


    To perform a scan of a target network, specify the range of IP addresses. For
    example:


    nmap 192.168.1.0/24


    To save the results of the scan to a file, add the "-oN" option followed by the
    file name. For example:


    nmap -A 192.168.1.1 -oN scan_results.txt


    OpenVAS: OpenVAS is an open-source vulnerability scanner that is used to scan
    a target system or network for vulnerabilities. It provides a comprehensive report
    of the vulnerabilities found and provides recommendations for mitigation.


    Nessus: Nessus is a vulnerability scanner that is widely used for vulnerability
    assessment. It provides a detailed report of the vulnerabilities found, including
    the risk level and recommendations for mitigation.


    ➢ Exploitation: Exploitation is the process of exploiting the vulnerabilities
    found during the vulnerability assessment phase. Kali Linux provides various tools
    for exploitation, including Metasploit, msfconsole, and ExploitDB.


    Metasploit: Metasploit is a popular open-source framework used for exploitation.
    It provides a wide range of exploits and payloads that can be used to penetrate
    the target system or network.


    msfconsole: msfconsole is the command-line interface of Metasploit, which can
    be used to launch exploits and interact with the target system.'
