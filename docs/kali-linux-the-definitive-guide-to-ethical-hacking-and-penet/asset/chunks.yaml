    target(s) and the customs policy you just created. The results of the port scan
    will be displayed in the Nessus UI once the scan is complete.


    You can use this command for port scanning:


    nessuscli scan new --policy-name="<policy_name>" --targets="<target_ip>" --scan-type="host"


