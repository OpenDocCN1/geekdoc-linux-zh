    # Change the file or directory name


    You can also use the `mv` command, to change an existing file or directory name
    to a new name. The syntax structure is the same as the one to move a file or directory.
    The key difference is that the 2nd argument should be a name that you want to
    use for the file or directory.


    For example, if you run the same command as in the previous example when there
    is no `dir_a` directory, the file name of `file_a` becomes `dir_a`.


    # Moving a file or changing a file name


    Depending on the directory situation, the same command can create different results.


    When there is no directory whose name is the same as the intended new file name,
    the `mv` command changes the file name as illustrated below.


    ![](img/87e31443ff747018655a0f4f95ee6187_68_0.png)


    When there is a directory whose name is the same as the intended new file name,
    the `mv` command moves the file to the directory as illustrated below.'
