    This chapter covers key concepts and commands of SSH remote login and secure file
    transfer. In this course, example demonstrations are mostly done on the local
    computer. We assume that you''ll use Terminal on Mac or use Powers on Windows.


    ![](img/87e31443ff747018655a0f4f95ee6187_251_0.png)


    We also explain how to use VS Code for the SSH remote login.


    The following topics are covered in this chapter.


    ## TOPICS


