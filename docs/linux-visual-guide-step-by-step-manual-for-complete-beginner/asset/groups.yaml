    # Chapter 6

    Commands for Command Management


    This chapter covers commands used for command management, such as creating shortcuts
    for commands, displaying the command manual, and installing new commands.


    The following topics are covered in this chapter.


    - TOPICS

    1. history (Check Command History)

    2. alias (Create Command Shortcuts)

    3. man (Display Manual)

    4. type, which and whereis (Display Command Information)

    5. Package Manager Command

    6. tree (Display Directory Tree)


    # history (Check Command History)


    history [number of commands to display]


    | Description | Command |

    | :--- | :--- |

    | Display all command history (up to 1,000) | $ history |

    | Display latest commands | $ history n |

    | e.g., history 4 displays the past four commands | |

    | Display specific commands (e.g., sudo commands) | $ history | grep sudo |


    The history command is used to display commands you run on the shell. This command
    is useful when you want to check what you have done before or reuse the same command
    you executed before.


    # Display a command history


    To display a history of commands, run history without any argument. The history
    command will display up to 1,000 commands.


    # Command Line - INPUT


    ```bash

    ubuntu $ | history

    ```


    # Command Line - RESPONSE


    ```

    :

    563 echo $ABC

    564 sudo chmod u+x variable_parent.sh

    565 sudo chmod u+x variable_child.sh

    566 ./variable_parent.sh

    567 echo $ABC

    568 source variable_parent.sh

    569 echo $ABC

    570 env

    571 env | grep ABC=

    572 history

    ```


    # Display a limited number of commands


    If you want to display only the past four commands, run history 4.


    # Command Line - INPUT


    ```bash

    ubuntu $ | history 4

    ```


    # Command Line - RESPONSE


    ```

    570 env

    571 env | grep ABC=

    572 history

    573 history 4

    ```


    # Use grep to display certain commands


    If you want to show only commands with certain strings, use the grep command.
    For example, if you want to display sudo commands only, run history | grep sudo.


    # Command Line - INPUT


    ```bash

    ubuntu $ | history | grep sudo

    ```


    # Command Line - RESPONSE


    ```

    :

    207 sudo chmod u+x test_child.sh

    219 sudo chmod u+x variable_parent.sh

    220 sudo chmod u+x variable_child.sh

    :

    ```


    # alias (Create Command Shortcuts)


    alias [alias name]=[command]

    unalias [alias name]


    alias is shortcut of command(s)


    Create new alias


    | original | shortcut |

    | :--- | :--- |

    | `</>` | `</>` |

    | ls -a | la |

    | alias la="ls -a" | |


    $ alias [name]=[command]


    Display existing aliases


    $ alias


    Connect multiple commands with ; (semicolon)


    $ alias [name];[command]


    Delete existing aliases


    $ unalias [name]


    The alias command is used to create command shortcuts. You can use the command
    to shorten your typing for frequently commands or complex commands. You can even
    combine multiple commands into one alias.


    # Display registered alias


    By running the alias command without any argument, you can display prere alias.
    For example, when you run the alias command on Ubuntu OS on Lightsail, you can
    see registered aliases.


    # Command Line - INPUT


    ```bash

    ubuntu $ | alias

    ```


    # Command Line - RESPONSE


    ```

    alias egrep=''egrep --color=auto''

    alias fgrep=''fgrep --color=auto''

    alias grep=''grep --color=auto''

    alias l1=''ls -CF''

    alias la1=''ls -A''

    alias ll11=''ls -alF''

