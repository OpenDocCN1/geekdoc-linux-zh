    ## chmod Command with Numbers


    - [xx] argument


    ```

    chmod [access mode number] [file or directory path]

    ```


    | Permission | Number |

    |---|---|

    | r | 4 (rwx) |

    | w | 2 (rw-) |

    | x | 1 (r-x) |

    | | 3 (r--) |

    | | 0 (-wx) |

    | To define unique access mode, add numbers of each permission | 1 (--) |

    | | 0 (---) |


    | Owner User | Owner Group | Others |

    |---|---|---|

    | 7 (rwx) | 4 (r--) | 4 (--) |


    - - Owner user has full permission

    - Owner group and others have only read permission


    To manage the many combinations and define the access mode of each file or directory
    in a more efficient way, the assigned numbers are also used for the access mode
    setting. The numbers are assigned for each permission as shown below.


    - - r : 4

    - w : 2

    - x : 1

    - - : 0


    Using the sum of all numbers, you can represent all access modes with a single
    digit for one user type. To cover the three user types, you need only three digits.
    Here are some examples.


    755 : typical access mode when the superuser creates a directory


    - - Owner User : rwx

    - Owner Group : r-x

    - Others : r--


    775 : typical access mode when a normal user creates a directory


    - - Owner User : rwx

    - Owner Group : rwx

    - Others : r--


    644 : typical access mode when the superuser creates a directory


    - - Owner User : rw-

    - Owner Group : r--

    - Others : r--


    664 : typical access mode when a normal user creates a directory


    - - Owner User : rw-

    - Owner Group : rw-

    - Others : r--


