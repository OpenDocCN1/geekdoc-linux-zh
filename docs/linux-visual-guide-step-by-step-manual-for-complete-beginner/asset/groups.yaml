    | bin dev home lib32 libx32 media opt root srv tmp var |

    | boot etc lib lib64 lib64 last+found mnt proc run snap sys usr |


    Then, run the `ls` command while piping the `grep` command to list only the directories
    with r in their name.


    Command Line - INPUT'
