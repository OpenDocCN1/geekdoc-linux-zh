    # Light and fast text editor


    Vim is very lightweight software, which doesn''t consume a lot of computer resources.
    As Vim is largely keyboard-operated, it requires some time to master; however,
    once you master all short-cut commands, your coding speed can be much faster.


    # How to launch Vim?


    Type vim followed by a file path. If the file doesn''t exist in the specified
    path, Vim creates a new file. If you edit a file named sample.txt under the current
    working directory, the command you can use is shown below.


    Command Line - INPUT


    ```

    ubuntu $ | vim sample.txt

    ```


    > Note: Practicing Vim on Mac OS and Windows OS


    As is preinstalled on Mac OS, you can practice using it by launching it from Terminal.


    For Windows OS, you need to install it. You can download Vim from this site Downloading
    Vim.


    ## Normal, Insert and Visual Mode


    ![](img/87e31443ff747018655a0f4f95ee6187_106_0.png)


    Vim has three different modes. 1) Normal mode, 2) Insert mode, 3) Visual mode.


    ### Normal mode


    In this mode, you cannot add text; however, you can do many things like


    - Move the cursor around a document

    - Delete text

    - Copy and paste text

    - Undo the previous action

    - Search phrase

    - Replace phrase

    - Save file

    - Exit (quit) Vim


    Normal mode is sometimes called Command mode, especially after pressing f on your
    keyboard, f : When you press f : letter words in the bottom left corner of the
    screen. You can run some commands e.g., replace words, save file, exit Vim. By
    pressing the esc key, you can stop Command mode.


    # Insert mode


    By pressing the i key on your keyboard, Vim changes to Insert mode, in which you
    can add text. You can launch the Insert mode with other letters such as I, a,
    o, and O; however, the cursor position is different when you launch the Insert
    mode. By pressing the esc key, you can move back to Normal mode.


    # Visual mode


    By pressing the v key on your keyboard, Vim changes to Visual mode, in which you
    can select text as a block. You can launch Visual mode with the v key. When you
    use the v key, you can select text by word block. When you use the v key, you
    can select text by line. In this mode, you can delete, copy, and modify the selected
    block of text.


    # Normal Mode (1) - Move Cursor


    ![](img/87e31443ff747018655a0f4f95ee6187_108_0.png)


    In order to effectively move your cursor, many ways of moving it are available
    in Vim. Here are the most important ones.


    # Arrows


    Using arrows on your keyboard is the most basic way to move your cursor. In the
    Normal mode, you can also use the k, j, l, and n keys. By using these keys, you
    don''t need to move your fingers much to move the cursor.


    - i or k: up by one line

    - i or j: down by one line

    - i or l: left by one character

    - l : right by one character


    # Jump to a certain location


    - gg : beginning of the first line

    - G : beginning of the last line

    - :n : beginning of line n

    - : : beginning of the current line

    - S : end of the current line


    # Change page


    - Ctrl + f : move to the next page

    - Ctrl + b : move to the previous page


    > Tips: Moving the cursor in Insert mode


    In Insert mode, you can use only arrow keys for moving your cursor as other key
    inputs are recognized as text input.


    # Normal Mode (2) - Delete


    | Current cursor | 1 box | 1 character | Deleted character |

    | :--- | :--- | :--- | :--- |

    | x or backspace | | | the character under the cursor |

    | dd | | | The line under the cursor |

    | ndd | | | multiple lines (current line and lines below) example: 2dd |


    ![](img/87e31443ff747018655a0f4f95ee6187_110_0.png)

    ![](img/87e31443ff747018655a0f4f95ee6187_110_1.png)

    ![](img/87e31443ff747018655a0f4f95ee6187_110_2.png)


    - d* delete the characters from the beginning of the line to the current character

    - dS delete the characters from the current character to the end of the line

    - dG delete lines from the current line to the last line


    ![](img/87e31443ff747018655a0f4f95ee6187_110_3.png)

    ![](img/87e31443ff747018655a0f4f95ee6187_110_4.png)

    ![](img/87e31443ff747018655a0f4f95ee6187_110_5.png)


    There are several ways to delete characters in Normal mode.


    - x or backspace (delete + fn on Mac) : delete the character under the cursor

    - dd : delete the line under the cursor

    - ndd : delete multiple lines (current line and lines below). n is the number
    of lines that you want to delete. For example, if you want to delete the current
    line and the line below, type 2dd.

    - d* : delete characters from the beginning of the line to the current character

    - dS : delete characters from the current character to the end of the line

    - DG : delete lines from the current line to the last line


    # Tips: Deleting actions in Insert mode


    - In Insert mode, you cannot use these delete keyboard actions except `backspace`
    + `delete` + `fn` on Mac).

    - In Normal mode, you cannot use the `delete` key; however, you can use it in
    the Insert mode


    ## Normal Mode (3) - Copy and Paste


    ![](img/87e31443ff747018655a0f4f95ee6187_112_0.png)


    In Normal mode, you can copy text and paste the copied text in a certain location
    in the same document.


    ### Copy - y (yank) command


    - yy: copy the line under the cursor

    - nyy: copy multiple lines (current line and lines below)


    ### Copy - p (paste) command


    - p: paste copied text in the line below the current line

    - P : paste copied text in the line above the current line


    # Normal Mode (4) - Undo and Redo


    ![](img/87e31443ff747018655a0f4f95ee6187_114_0.png)


    When you reverse your action, you can use the undo command by pressing the `u`
    key. If you want to do the same action (reverse undo action), use the redo command
    by pressing `Ctrl + r`.


    # Normal Mode (5) - Search


    Search phrase in the forward direction Search phrase in the backward direction


    ```

    / search phrase

    ```


    ```

    ? search phrase

    ```


    In Normal mode, you can search for a phrase. Use / for forward direction and ?
    for backward direction. After typing a search phrase, hit the enter key, Vim will
    enter Search mode. Under Search mode, you can use n to move to the next phrase
    and N to move to the previous one.


    # Normal Mode (6) - Replace Phrase


    ```

    [:search area]s/[search phrase]/[option]


    ```


    %: the entire document

    n: line n

    g: replace all

    c: with confirmation


    In Normal mode, you can search for a phrase and replace it with a new phrase using
    the command below.


    Command Line - INTERACTIVE


    ```

    [:search area]s/[search phrase]/[option]

    ```


    # Search area


    - % you can search and replace a phrase in the entire document

    - n: you can search and replace a phrase under line n


    # Option


    - g: you can replace all phrases in the selected search area. If you select the
    entire document, option g is the default setting.

    - c : you can make confirmations for replacement one by one


    # Examples


    Replace the first A with B in line 3 (no confirmation)


    Command Line - INTERACTIVE

    ```

    :3s/A/B

    ```


    Replace all A with B in line 3 (no confirmation)


    Command Line - INTERACTIVE

    ```

    :3s/A/B/g

    ```


    Replace all A with B in line 3 (one-by-one confirmation)


    Command Line - INTERACTIVE

    ```

    :3s/A/B/gc

    ```

