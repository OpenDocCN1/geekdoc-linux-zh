  mdcn: "\n\n# su (切换用户)\n\n![](img/87e31443ff747018655a0f4f95ee6187_140_0.png)\n\n\
    su [用户名]\n临时切换到另一个用户\n\n普通用户 A -> 普通用户 B\n\n- - - 选项\n- 在切换到另一个用户时更改用户环境（例如，用户的家目录）\n\
    - 退出\n- 切换回原始用户\n\nsudo su\n临时切换到超级用户\n\n普通用户 A -> 超级用户\n\n![](img/87e31443ff747018655a0f4f95ee6187_140_1.png)\n\
    \nsu 命令用于临时切换到另一个用户。你也可以切换到超级用户。切换到超级用户在设置新服务器时特别有用，因为需要几项新设置，例如添加新用户、密码、组以及其他若干系统配置。\n\
    \n## 切换到另一个普通用户：su [用户名]\n\n当运行命令时指定用户名，就可以切换到该用户。在切换到该用户之前，你需要先添加该用户，这将在后文中解释。\n\
    \n## 切换到超级用户：sudo su\n\n当你运行 `su` 命令时不带任何用户名时，就可以切换到超级用户。由于普通用户通常没有切换到超级用户的权限，因此在运行\
    \ `su` 命令时需要加上 \"sudo\" 前缀。\n\n## 更改用户环境：\" - -\" 选项\n\n通过添加 `- -` 选项，你也可以更改用户环境。例如，当使用\
    \ `-` 选项切换到超级用户时，你的命令行当前工作目录将更改为 `/root`（root用户的家目录）。\n\n## 切换回原始用户：exit\n\n要切换回原始用户，你可以运行\
    \ `exit` 命令。如果你运行了多次 `su` 命令，则需要运行相同次数的 `exit` 命令回到原始用户。\n\n![](img/87e31443ff747018655a0f4f95ee6187_141_0.png)\n\
    \n你可以看到用户名已变为 root，且 $ 符号变为了 #。此外，你可以看到在 # 之前显示的当前目录路径发生了变化，尽管当前目录的位置没有变。这是因为你的家目录发生了变化。\n\
    \n## 命令行 - 输入\n\n```\nroot:/home/ubuntu/dir_a# | |\n```\n\n要检查状态，运行 `cd ~` 命令进入家目录。\n\
    \n## 命令行 - 输入\n\n```\nroot:/home/ubuntu/dir_a# | cd ~\n```\n\n```\nroot:~# | |\n\
    ```\n\n使用 `pwd` 命令检查当前工作目录。你可以看到家目录变成了 /root（但不再是在 ubuntu 下了）。\n\n## 命令行 - 输入\n\
    \n```\nroot:~# | pwd\n```\n\n## 命令行 - 响应\n\n```\n/root\n```\n\n## 2. sudo su -\n\
    \n首先，通过运行 `exit` 命令退出 sudo 状态。你会看到用户已切换回 ubuntu，当前工作目录已移回原始位置。\n\n## 命令行 - 输入\n\
    \n```\nroot:~# | exit\n```\n\n```\nubuntu:~/dir_a$ |\n```\n\n运行带有 `-` 选项的 `sudo\
    \ su` 命令。你可以看到用户已切换到 `root`，且当前工作目录已更改为新的家目录。\n\n## 命令行 - 输入\n\n```\nubuntu:~/dir_a$\
    \ | sudo su -\n```\n\n```\nroot:~# |\n```\n\n运行 `pwd` 命令。你可以确认家目录已更改为 `/root`。\n\
    \n## 命令行 - 输入\n\n```\nroot:~# | pwd\n```\n\n## 命令行 - 响应 \n\n```\n/root\n```\n\n\
    ## useradd (添加用户)\n\n[参数]\n\n```\nuseradd -m [用户名]\n```\n\n![](img/87e31443ff747018655a0f4f95ee6187_144_0.png)\n\
    \nuseradd 命令用于创建一个新用户。通常，useradd 命令带有 `-m` 选项，用于为用户创建家目录。通过此命令，超级用户（或 sudoers\
    \ 用户）可以控制用户的登录（例如，锁定和解锁用户账户、删除或覆盖用户密码、设置密码有效期）。（注：此处原文存在大量重复段落，已按要求去重处理）\n\nuseradd\
    \ 命令用于创建一个新用户。\n\n要切换到超级用户，请运行以下命令。\n\n## 命令行 - 输入\n\n```\nroot:~# | exit\n```\n\
    \n"
