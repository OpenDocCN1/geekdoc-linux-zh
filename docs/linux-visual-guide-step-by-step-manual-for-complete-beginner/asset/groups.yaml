    # chmod (Change Access Mode)


    ![](img/87e31443ff747018655a0f4f95ee6187_178_0.png)


    The chmod (CHange access MODe) command is used to change the access mode of files
    and directories.


    # Three types of users and permissions


    As already explained in the beginning of this chapter, there are three types of
    users with different permissions. In this command, alphabets are assigned for
    each user type and all users.


    +   * u: owner user

    * g: owner group users

    * o: other users

    * a: all users


    Also, there are three types of permissions.'
  - '[PAGE 179]


    +   • r : Read

    • w : Write

    • x : Execute


    # Change operators


    To change the access mode of each file or directory, you can combine a user type
    and a permission type with three types of symbols to set a change logic.


    +   • + : add permission

    • - : remove permission

    • = : overwrite permission


    Here are some examples


    +   • g+w : add w (write) permission to group owner user (g)

    • u-w : remove w (write) permission from owner user (u)

    • o=r : give only r (read) permission to other users (o)

    • a=r : give only r (read) permission to all users (a)


    # Set permissions for multiple user types and permissions


    You can set permissions for multiple user types at the same time by simply combining
    the characters in the examples below


    +   • ug=rwx : give all permissions to owner user and owner group users

    • go=r : give only read access to owner group users and other users


    # Set permissions for an entire directory recursively


    To change permissions of an entire directory including sub-directory and files
    underneath, you can use the -R option.'
  - '[PAGE 180]


    For example, to change the permissions of the directory tree of dir_a1 in a way
    that grants read only permission to the group owner and other users, run the following
    command.


    # Command Line - INPUT


    ```

    root:/home/user_a# | chmod -R go=r dir_a1

    ```


    Check the owner status of dir_a1 and dir_a2 by running the ls -l command. You
    can see that the group owner and other users have read only permission for both
    directories (dir_a1 and dir_a2). (Previously, the group owner and other users
    had execution permission for both directories. You can check their former statuses
    in the previous section.)


    # Command Line - INPUT


    ```

    root:/home/user_a# | ls -l

    ```


    # Command Line - RESPONSE


    ```

    drwx--r-- 3 user_a user_a 4096 Jan 2 15:31 dir_a1

    ```


    # Command Line - INPUT


    ```

    root:/home/user_a# | ls -l dir_a1

    ```


    # Command Line - RESPONSE


    ```

    drwx--r-- 2 user_a user_a 4096 Jan 2 15:31 dir_a2

    ```


    > Note: Permission Conflict


    If the group owner''s permission exceeds the owner user''s permission, the group
    owner''s permission will be restricted to one set for the owner user. In the example
    below, as the owner doesn''t have the read and write permission, the owner group
    user also cannot read and write although they have permission.'
