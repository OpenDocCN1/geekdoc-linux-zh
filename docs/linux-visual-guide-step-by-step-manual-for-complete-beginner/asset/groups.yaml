- md: '

    - [Unit]: This section is used to describe general directives that are not unit-type
    specific. Directives in this section include dependencies, order of unit file
    executions, conflicting units, etc.


    - [Service]: This section includes directives for commands to be triggered when
    the unit is started, stopped, or reloaded. It also covers unit behaviors when
    the process is completed.


    - [Install]: This section is an optional section and is used to set the behavior
    of a unit when it is enabled.


    This is an example of a unit file for sshd.


    ## sshd.service


    ```

    [Unit]

    Description=OpenBSD Secure Shell server

    Documentation=man:sshd(8) man:sshd_config(5)

    After=network.target audit.service

    ConditionPathExists=/etc/ssh/sshd_not_to_be_run


    [Service]

    EnvironmentFile=-/etc/default/ssh

    ExecStartPre=/usr/bin/sshd -t

    ExecStart=/usr/bin/sshd -t $SSHD_OPTS

    ExecReload=/usr/bin/sshd -HUP $MAINPID

    KillMode=process

    Restart=on-failure

    RestartPreventExitStatus=255

    Type=notify

    RuntimeDirectory=sshd

    RuntimeDirectoryMode=0755


    [Install]

    WantedBy=multi-user.target

    Alias=sshd.service

    ```


    ## Example of Unit X''s unit file


    Explaining unit file syntax is complicated as there are many interdependent units
    that are related to the unit defined by the unit file. For a clearer explanation,
    we will refer to the unit defined by the unit file as ''Unit X''.


    ![](img/87e31443ff747018655a0f4f95ee6187_329_0.png)


    ## [Unit] section


    This section is used to describe common directives including:


    - Description: a description of this unit.

    - Documentation: URI (Uniform Resource Identifier) of this unit document

    - After: units'' start order information. Unit X starts only after the units listed
    here are active


    ![](img/87e31443ff747018655a0f4f95ee6187_329_1.png)


    - Before: units'' start order information. Unit X should be active before the
    units listed here start.


    Before

    e.g., Before=unitA.service


    ![](img/87e31443ff747018655a0f4f95ee6187_330_0.png)


    Unit X needs to start first ...then Unit A can start


    - Requires: units'' dependency information. Unit X is dependent on the units listed
    here. If one of the units listed here fails to be activated, Unit X won''t be
    activated.


    Requires

    e.g., Requires=unitA.service


    ![](img/87e31443ff747018655a0f4f95ee6187_330_1.png)


    - Wants: units'' dependency information. Unit X is less strictly dependent on
    the units listed here. Unit X can be activated even though the units listed here
    are not activated.


    Wants

    e.g., Wants=unitA.service


    ![](img/87e31443ff747018655a0f4f95ee6187_331_0.png)


    - Conflicts: the units listed here cannot be started when Unit X running.


    ## [Service] section


    This section covers unit-specific directives. If the unit is a socket unit or
    a timer unit, directive contents will be different from the directive contents
    described below. This section includes:


    - Type: the unit process startup type

    - EnvironmentFile: files listed here are used to support loading environment variables

    - ExecStart: commands listed here will be executed when Unit X started

    - ExecStop: commands listed here will be executed when Unit X stopped

    - ExecReload: commands listed here will be executed when Unit X reloaded

    - Restart: set restart options - always, on-success, on-failure, etc.


    ## [Install] section


    This section is an optional section and is used to set the behavior of a unit
    when it is enabled. This section includes:


    - RequiredBy: when *Unit X* is enabled, this unit''s symbolic link is created
    under the `.requires` directory of the units listed here, meaning that when the
    units listed here try to start, *Unit X* will be called.


    RequiredBy

    e.g., RequiredBy=unitA.service


    ![](img/87e31443ff747018655a0f4f95ee6187_332_0.png)


    - WantedBy: when *Unit X* is enabled, this unit''s symbolic link is created under
    the `.wants` directory of the units listed here, meaning that when the units listed
    here try to start, *Unit X* will be called.


    WantedBy

    e.g., WantedBy=unitA.service


    ![](img/87e31443ff747018655a0f4f95ee6187_332_1.png)


