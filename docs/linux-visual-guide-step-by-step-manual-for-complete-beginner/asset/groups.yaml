    # Standard Input Output and Redirection


    Standard Input, Output and Error Output


    ![](img/87e31443ff747018655a0f4f95ee6187_194_0.png)


    # Standard Input, Output and Error Output


    In general, computer commands or programs process input and generate output. Standard
    input and output define where data come from and where processed data go to.


    # Standard Input (Stdin)


    Standard input defines where input data comes from. Linux OS''s preset standard
    input is generally the keyboard. When you type in the command line, the typed
    string becomes the input of the command.


    # Standard Output (Stdout)


    Standard output defines where output data are generated. Linux OS''s preset standard
    output is generally command-line (terminal).'
- md: '

    # Standard Error (Stderr)


    Linux OS''s preset standard error output is generally command-line (terminal).


    Here is the summary of the above.


    | Standard Streams | Default |

    |---|---|

    | Standard Input (Stdin) | Keyboard |

    | Standard Output (Stdout) | Terminal Display |

    | Standard Error (Stderr) | Terminal Display |


    # Redirection


    Redirection is used to change Stdin, Stdout, or Stderr. In programming, the most
    frequently used redirection option is redirection via a text file.


    # Redirection of stdin (<)


    To redirect standard input, use < after a command followed by new standard input.


    ```

    command < file path for input

    ```


    For example, if you want to sort the file_a contents, run the command below.


    Command Line - INPUT


    ```

    ubuntu $ | sort < file_a

    ```


    # Redirection of stdout (> >>)


    To redirect standard output, use > or >> after a command followed by a new standard
    output.


    When you use >, the output will overwrite the existing contents while you use
    >>, the output will be added at the end of the existing contents.


    | overwrite contents: | command > file path for output |

    | append contents: | command >> file path for output |


