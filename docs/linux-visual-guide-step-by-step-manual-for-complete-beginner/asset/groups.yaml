    Here are some key OS functionalities.


    # ## Process Management


    Multiple applications are running on the computer simultaneously. The OS can handle
    various jobs of each application and the OS itself. Through the OS, you can launch,
    control, and exit applications.'
  - '[PAGE 17]


    # Device Management


