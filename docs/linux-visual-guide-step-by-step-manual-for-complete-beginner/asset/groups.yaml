    738, Wade, Warren, Grapes,3,$38

    130, Jerome, Bell, Grapes,6,$45.6

    185, Esther, Howard, Bananas,4,$16.8

    426, Robert, Fox, Bananas,6,$55.2

    877, Cameron, William, Apple,7,$22.4

    556, Annette, Black, Grapes,4,$30.4

    ```


    Using this data set, if you want to change the delimiter (a symbol that separates
    strings), (comma) to a space, run the following command.


    # Command Line - INPUT


    ```

    ubuntu $ | cat purchase.txt | tr '','' ""

    ```


    You can see the following result in your command line.


    # Command Line - RESPONSE


    ```

    274 Theresa Webb Apple $19.2

    357 Guy Hawkins Orange 3 $6.6

    703 Devon Lane Apple 4 $12.8

