    # Typical Mistakes


    There are two typical mistakes you might make when you run the scp command.


    - 1. Forgetting to add : (colon)


    When you forget to add : (colon), the command will have a different meaning. The
    command will create a file copy on your local computer. For example, if you run
    the following command (without a colon at the end), you''ll create a file named
    ubuntu@18.143.143.190 in the same directory.


    # Command Line - INPUT


    ```

    % scp -i ~/.ssh/id_rsa sample.txt

    ubuntu@18.143.143.190

    ```


    # Command Line - RESPONSE


    > ubuntu@18.143.143.190


    # 2. Misusing spacing


    Omitting or adding an extra space is also a common mistake. Check spaces when
    you encounter an error message in your command line.


