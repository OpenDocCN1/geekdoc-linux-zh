    # 第 4 章

    用户、组与权限


    本章涵盖了如何在 Linux 上管理用户、组和权限。


    本章主要涵盖了以下主题。


    ### 主题


    1. Linux 中的用户、组和权限是什么？

    2. 按所有者状态划分的权限（访问模式）

    3. 超级用户（Root 用户）与普通用户

    4. sudo（以超级用户权限运行命令）

    5. su（切换用户）

    6. useradd（添加用户）

    7. passwd（设置密码）

    8. userdel（删除用户）

    9. 组 - 主组和附加组

    10. groupadd（添加组）

    11. usermod（修改账户信息）

    12. gpasswd（向组添加和删除用户）

    13. groupdel（删除组）

    14. chown（更改文件和目录的所有者）

    15. chgrp（更改文件和目录的组）

    16. chmod（更改访问模式）

    17. 使用数字的 chmod 命令

    18. w 和 who（检查当前登录状态）

    19. id 和 groups（检查用户 ID 和组）

    20. getent（显示用户和组数据）


    # Linux 中的用户、组和权限是什么？


    ![](img/87e31443ff747018655a0f4f95ee6187_127_0.png)


    - 所有文件和目录根据用户状态拥有权限设置（访问模式）

    - 超级用户（root）拥有所有文件和目录的权限


    # 超级用户（root 用户）与普通用户


    在 Linux 中有两种类型的用户：**超级用户**和**普通用户**。超级用户是一个用于系统管理的特殊账户。超级用户拥有所有 Linux 系统资源的权限，而普通用户根据每个文件和目录的权限设置，对
    Linux 系统资源的访问权限有限。


    # 文件和目录所有者


    每个文件或目录都有一个所有者。通常，创建文件或目录的用户就是其所有者。


    # 组


    在 Linux 中，你可以通过组来管理用户。当用户注册在组中时，文件和目录的权限管理会更高效。组有两种：**主组**和**附加组**。主组在创建新文件时使用。


    # 所有者状态


    文件或目录有三种所有者状态。


    1. **所有者（文件或目录）**：通常创建文件或目录的用户是所有者。你可以通过运行 `chown` 命令更改所有者。

    2. **所有者组**：通常，所有者的主组成为文件或目录的所有者组。你可以通过运行 `chgrp` 命令更改所有者组。

    3. **其他**：不在文件或目录所有者组的用户。


    # 权限（访问模式）


    根据文件或目录的所有者状态，文件或目录的可访问性可能不同。这被称为**权限**或**访问模式**。当你带有 `-l` 选项运行 `ls` 命令时，你可以看到按用户状态划分的访问模式。


    ```

    drwxr-xr-x 3 usr_a staff 4096 Jul 16 2020 media

    -drwxr-xr-x 15 usr_b staff 3180 Dec 21 12:53 sample.txt

    ```


    # 按所有者状态划分的权限（访问模式）


    ```

    drw-r-x 3 usr_a staff 4096 Jul 16 2020 media

    ```


    ![](img/87e31443ff747018655a0f4f95ee6187_129_0.png)


    ls -l 命令提供了目录或文件的访问模式信息。以下是读取信息的关键点。


    # 三种用户类型


    根据三种所有者状态，每种类型的访问模式都不同。通过运行 ls -l 命令，你会看到定义访问模式的 9 个字符。


    - 前三个字母：所有者的访问模式

    - 间三个字母：所有者组的访问模式

    - 最后三个字母：其他用户的访问模式


    # 读 (r)、写 (w) 和执行 (x) 权限


    有三种权限（访问模式）：读 (r)、写 (w) 和执行 (x)。权限的含义对于文件和目录略有不同。


    对于文件：


    - 读 (r)：读取文件

    - 写 (w)：编辑文件

    - 执行 (x)：运行文件中定义的命令


    对于目录：


    - 读 (r)：列出目录下的文件和目录名称（读取目录内容）

    - 写 (w)：在目录中创建和删除文件并重命名文件

    - 执行 (x)：将该目录设置为当前工作目录 (CWD)


    '
