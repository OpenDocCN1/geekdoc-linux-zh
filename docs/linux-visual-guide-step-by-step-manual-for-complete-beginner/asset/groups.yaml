    # cat (Display File Content)


    ![](img/87e31443ff747018655a0f4f95ee6187_72_0.png)


    The cat (conatenate) command is used to display the contents of a file without
    opening it. The command can be used to create a new file with redirection of standard
    output (->). To know more about redirection of standard output, check Chapter
    5 Standard Input Output and Redirection.


    # Display the content of a file


    To display the content of a file, use the file path as an argument of the cat
    command.


    For example, if you want to display the content of file_a under your working directory,
    run the command below.


    # Command Line - INPUT


    ```

    ubuntu $ | cat file_a

    ```'
