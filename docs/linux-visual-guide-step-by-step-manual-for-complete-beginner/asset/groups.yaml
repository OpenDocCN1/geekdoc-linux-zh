    # SFTP (Secure File Transfer Protocol)


    ```

    Without SSH config file

    sftp -i [key file path] [user name]@[IP address]

    With SSH config file

    sfpt [SSH host name]

    ```


    ![](img/87e31443ff747018655a0f4f95ee6187_295_0.png)


    SSH is used not only for remote login but also for file transfer in a secure way.
    There are two protocols to transfer files with SSH - SCP (Secure Copy Protocol)
    and SFTP (Secure File Transfer Protocol). In this section, we''ll explain SFTP.


    # SFTP session and sub-commands


    Unlike SCP, after running the SFTP command, the SFTP session continues until you
    exit the session. Once the SFTP session is established, you can run sub-commands
    prepared for SFTP.


    # Establish SFTP session


    There are two approaches to establishing an SFTP session - 1) without the SSH
    config file, and 2) with the SSH config file. The syntax is almost the same as
    the one of SSH. You can simply replace `ssh` with `sftp`.'
- md: '

    Without the SSH config file, you need to specify the private key file path, user
    name, and IP address of the remote server.


    ## Command Line - INPUT


    ```

    $ sftp -i ~/.ssh/id_rsa ubuntu@54.169.91.239

    ```


    With the SSH config file, the command is much simpler. Just type ssh and the SSH
    host name in your config file (the example below uses ssh_test as the SSH host
    name).


    ## Command Line - INPUT


    ```

    % sftp ssh_test

    ```


    Once the SFTP session is established, the command line changes to the one below.


    ## Command Line - INPUT


    ```

    sftp> |

    ```


    ## SFTP sub-commands


    During an SFTP session, you can run several SFTP sub-commands.


    ## Check and change directories


    SFTP provides sub-commands to check and change directories under both the remote
    server and the local computer. Here are the examples.


    | Action | Remote | Local |

    |---|---|---|

    | Check current directory path | pwd | lpwd |

    | List files and directories | ls | lls |

    | Change directories | cd | lcd |


    ## get command - download a file or directory from the remote server


    Once you set the current working directory on both the local computer and remote
    server, you can download the file from the remote server to the local computer
    with the get command.


    For example, by running the command below, you''ll transfer the sample.txt file
    under the current working directory on the remote server to the current working
    directory of your local computer.


    ## Command Line - INPUT


    ```

    sftp> | get sample.txt

    ```


    This is the illustration of the file transfer.


    ![](img/87e31443ff747018655a0f4f95ee6187_297_0.png)


    If you want to download a directory, use the -r option.


    ## Command Line - INPUT


    ```

    sftp> | get -r sample_dir

    ```


    ## put command - upload a file or directory to the remote server


    To upload a file or directory from your local computer to the remote server, you
    can run the put command.


    For example, running the command below, you''ll transfer the test.txt file under
    the current working directory on your local computer to the current working directory
    of the remote server.


    ## Command Line - INPUT


    ```

    sftp > | class="code"put test.txt

    ```


    ## exit (bye) command - stop the SFTP session


    To end the session, run the exit (or bye) command.


    ## Command Line - INPUT


    ```

    sftp > | exit

    ```


    ## help command - check SFTP sub-commands


    If you want to know more about SFTP sub-commands, the help command can be useful.
    It gives you a list of available SFTP sub-commands.


    > Note: Difference between SCP and SFTP


    One of the major differences between SCP and SFTP is while the SFTP protocol can
    resume data transfer which was stopped for some reason, SCP cannot resume it.
    To resume data transfer with SFTP, use the re command.


    For example, if you want to resume the sample_dir transfer, you can run the command
    below.


    ## Command Line - INPUT


    ```

    sftp > | reget -r sample_dir

    ```


    ## Other File Transfer Commands


    ![](img/87e31443ff747018655a0f4f95ee6187_299_0.png)


    ![](img/87e31443ff747018655a0f4f95ee6187_299_1.png)


    ![](img/87e31443ff747018655a0f4f95ee6187_299_2.png)


    There are other file transfer commands that do not use ssh. FTP is the most classic
    file transfer protocol and command. Wget and Curl are commands that use multiple
    communication protocols to get files, especially from websites.


    ## FTP


    FTP (File Transfer Protocol) is a standard network protocol used to transfer files
    to and from a remote network. As FTP traffic is not encrypted, it is highly recommended
    to use SCP or SFTP for a secure data transfer. To use FTP on Linux OS, you can
    use the ftp command. The command design is similar to the sftp command. You can
    establish an FTP session and use sub-commands to manage a file transfer.


    ## Wget


    wget is a command-line utility used to download web pages that use various internet
    protocols, including HTTP, HTTPS, and FTP. Wget is often used as a web crawler
    protocol because of its usability for downloading web content.


    Its command syntax is simple. By running the wget command with a URL, you can
    download the website''s HTML file. If you use the -p option, you can also download
    all the contents of the website including image files. With the -r option, you
    can also download the website recursively (including the links to the website).


    ## cURL


    cURL means client for URL. It is a command line tool that enables data transfer
    over various network protocols including HTTP, HTTPS, FTP, and other internet
    protocols. cURL communicates with a web or application server by specifying a
    relevant URL and the data that needs to be sent or received. Different from wget,
    the curl command is also used to upload data to a server.


    ## Chapter 8: Process Management


    This chapter covers process management. In this chapter, we will learn about processes
    and how to manage them.


    ### What is a process?


    A process is a program in execution. While a program is a static file on the disk,
    a process is an active entity that runs in memory. Each process has its own memory
    space, which includes the code, data, and stack.


    ### Process states


    Processes can go through several states during their lifecycle:


    - New: The process is being created.

    - Ready: The process is waiting to be assigned to a processor.

    - Running: The process is being executed.

    - Waiting (Blocked): The process is waiting for some event (such as I/O completion).

    - Terminated: The process has finished execution.


    ### Managing processes in Linux


    In Linux, there are several tools available to manage processes. The most common
    ones are:


    - `ps`: Lists currently running processes.

    - `top`: Provides a real-time view of running processes.

    - `kill`: Sends a signal to a process, usually to terminate it.

    - `nice`: Sets the priority of a process.

    - `renice`: Changes the priority of an already running process.


    ### Examples


    #### Listing processes


    To list all processes for the current user, use:


    ```

    ps -u username

    ```


    To list all processes running on the system, use:


    ```

    ps aux

    ```


    #### Terminating a process


    To kill a process, you need its Process ID (PID). You can find the PID using `ps`.
    Once you have the PID, use:


    ```

    kill PID

    ```


    To force a process to stop, use the -9 flag:


    ```

    kill -9 PID

    ```


    #### Changing priority


    To start a process with a specific priority, use `nice`:


    ```

    nice -n 10 command

    ```


    To change the priority of a running process, use `renice`:


    ```

    renice +5 PID

    ```

