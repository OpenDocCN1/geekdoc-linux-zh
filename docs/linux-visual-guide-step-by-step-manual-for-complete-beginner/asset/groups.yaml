    \ for this command. Simply run the command as shown below.\n\nCommand Line - INPUT\n\
    \n```\npwd\n```\n\nIf your Working Directory is the *etc* directory under the\
    \ root directory, the command line returns the following result.\n\nCommand Line\
    \ - RESPONSE\n\n```\n/etc\n```\n\n# cd (Change Directory)\n\n```\ncd [directory\
    \ path]\n```\n\n![](img/87e31443ff747018655a0f4f95ee6187_52_0.png)\n\nThe cd (Change\
    \ Directory) command is used to change the working directory. On the GUI, you\
    \ can use your mouse to select a directory or file through Finder on Mac or Explorer\
    \ on Windows. On the CLI, you need to use your keyboard to move your Working Directory\
    \ to a different location with the cd command.\n\n## Special Characters to specify\
    \ directories\n\nBefore explaining the cd command syntax, it is important to learn\
    \ some special characters used for specifying certain directories.\n\n![](img/87e31443ff747018655a0f4f95ee6187_53_0.png)\n\
    \n- / (slash): root directory\n- . (dot): working directory\n- .. (double dot):\
    \ parent directory\n- ~ (tilde): user's home directory\n\n# The cd command\n\n\
    As you can see below, the command syntax is simple. You can use both an absolute\
    \ path and a relative path to specify the directory path.\n\nCommand Line - INPUT\n\
    \n```\nubuntu $ | cd [directory path]\n```\n\nHere are some examples of the cd\
    \ command\n\n### To go to the **root directory**\n\nCommand Line - INPUT\n\n```\n\
    ubuntu $ | cd /\n```\n\n### To go to the **parent directory**\n\nCommand Line\
    \ - INPUT\n\n```\nubuntu $ | cd ..\n```\n\n### To go to the **home directory**\n\
    \nCommand Line - INPUT\n\n```\nubuntu $ | cd ~\n```\n\nIf you don't add a directory\
    \ path, your working directory goes to the home directory as well.\n\nCommand\
    \ Line - INPUT\n\n```\nubuntu $ | cd\n```\n\n### To go to the child directory\
    \ named *directory_a*\n\nCommand Line - INPUT\n\n```\nubuntu $ | cd directory_a\n\
    ```\n\n# ls (List Contents of Directory)\n\n```\nls [directory path]\n```\n\n\
    No option: list directories and files\napplication media sample.txt\n\n- a option:\
    \ list with hidden files\n.hidden_file application media sample.txt\n\n- l option:\
    \ list with detailed information\n\n| drxr-xr-x | 3 | usr_a staff | 4096 | Jul\
    \ 16 2020 | - |\n|---|---|---|---|---|---|\n| rwxr-xr-x | 15 | usr_b staff | 3180\
    \ | Dec 21 12:53 | sample.txt |\n\nThe **ls (List directory)** command is used\
    \ to list the contents of a directory. In the GUI (Graphic User Interface), you\
    \ can see what directories and files are contained under a directory. On the CUI\
    \ (Character User Interface), you need to use your keyboard to list up the directory\
    \ contents.\n\n## List up Working Directory contents\n\nWhen you run the `ls`\
    \ command without specifying a directory path, you get a list of the contents\
    \ of your working directory like the one below.\n\nCommand Line - INPUT\n\n```\n\
    ls\n```\n\nCommand Line - RESPONSE\n\n```\napplication media sample.txt\n```\n\
    \n## List up directory contents under a specific location\n\nYou can specify a\
    \ file path to execute the ls command. This is an example of listing up the root\
    \ directory contents.\n\nCommand Line - INPUT\n\n```\nls /\n```\n\nCommand Line\
    \ - RESPONSE\n\n```\nbin dev home lib32 libx32 media opt root ....\n```\n\n###\
    \ -a option\n\nWith the -a option, you can list up directory contents including\
    \ hidden files.\n\nCommand Line - INPUT\n\n```\nls -a\n```\n\nCommand Line - RESPONSE\n\
    \n```\n.. .bash_history .bash_logout .bashrc .cache .profile .ssh\n```\n\n###\
    \ -l option\n\nWith the -l option, you can list directory contents with detailed\
    \ information.\n\nCommand Line - INPUT\n\n```\nls -l\n```\n\nCommand Line - RESPONSE\n\
    \n```\ndrwxr-xr-x 3 usr_a staff 4096 Jul 16 2020 media\n-drwxr-xr-x 15 usr_b staff\
    \ 3180 Dec 21 12:53 sample.txt\n```\n\nHere is the list of information\n\n- 1.\
    \ Directory or file (d = directory, - = file)\n- 2. Access mode or permission\
    \ (r = read, w = write, x = execute)\n  - The first three letters: owner's access\
    \ mode\n  - Next three letters: owner group's access mode\n  - The last three\
    \ letters: others' access mode\n- 3. Number of hard links\n- 4. Owner of the directory\
    \ or file\n- 5. Owner group of the directory or file\n- 6. The latest date and\
    \ time of modification\n- 7. Name of directory or file\n\nNote: To learn about\
    \ the access mode, check Permission (Access Mode) by Owner Status.\n\n# mkdir\
    \ (Make Directory)\n\n[path] argument\n\n```\nmkdir [directory path]\n```\n\n\
    - -p option: create new directories with a tree structure\n\n![](img/87e31443ff747018655a0f4f95ee6187_58_0.png)\n\
    \nTo create a new directory, you can use mkdir (Make Directory) command while\
    \ specifying the directory path and including the new directory name at the end\
    \ of the path.\n\n## Create a new directory with the relative path\n\nTo create\
    \ a new directory named dir_a under your working directory, run the command below.\n\
    \nCommand Line - INPUT\n\n```\nubuntu $ | mkdir dir_a\n```\n\nIf you want to create\
    \ a new directory named dir_b under the parent directory, run the command below.\n\
    \nCommand Line - INPUT\n\n```\nubuntu $ | mkdir dir_b\n```\n\n## Create a new\
    \ directory with the absolute path\n\nYou can use the absolute path to create\
    \ a new directory. To create dir_c under the ubuntu directory, you can run the\
    \ command below.\n\nCommand Line - INPUT\n\n```\nubuntu $ | mkdir /home/ubuntu/dir_c\n\
    ```\n\n## -p option\n\nIf you want to create multiple directories with a tree\
    \ structure, you can use the -p option. To create three directories like dir_3\
    \ under dir_2 under dir_1 under your home directory, you can run the command below.\n\
    \nCommand Line - INPUT\n\n```\nubuntu $ | mkdir -p ~/dir_1/dir_2/dir_3\n```\n\n\
    # rmdir (Remove Directory)\n\n```\nrmdir [directory path]\n```\n\n![](img/87e31443ff747018655a0f4f95ee6187_60_0.png)\n\
    \n> Note:\n> * Cannot delete a directory if it is not empty\n> * Use the rm command\
    \ with the -r option to delete a non-empty directory\n\n## When a directory is\
    \ empty\n\nYou can delete an empty directory using the rmdir (Remove Directory\
    \ command.\n\nFor example, to delete an empty directory named dir_a under a working\
    \ directory, run the command below.\n\nCommand Line - INPUT\n\n```\nubuntu $ |\
    \ rmdir dir_a\n```\n\n## When a directory is not empty\n\nThe rmdir command won't\
    \ work for a non-empty directory. You need to use the rm command with the -r option\
    \ like in the command below.\n\nCommand Line - INPUT\n\n```\nubuntu $ | rm -r\
    \ dir_a\n```\n\nThe rm command will be explained later.\n\n# touch (Create File)\n\
    \n| [path] argument | |\n|---|---|\n| touch [file name] | Change existing file\
    \ or directory timestamp. The touch command is also used to change existing file\
    \ or directory's timestamp (e.g., last modified date and time) |\n| -d option:\
    \ specify date and time | touch -d [date and time] [file name] |\n| -r (--reference)\
    \ option: apply another file's time | touch -r [reference] [target] |\n\n![](img/87e31443ff747018655a0f4f95ee6187_62_0.png)\n\
    \nUsing the touch command, you can create a new file. You can also use the touch\
    \ command to change the time stamp of the existing file.\n\n## Creating a new\
    \ file\n\nSimply run the command with a file path with a new file name at the\
    \ end of the path. For example, to create a new file named new_file_a under your\
    \ working directory, run the command below.\n\nCommand Line - INPUT\n\n```\nubuntu\
    \ $ | touch new_file_a\n```\n\n## Change the timestamp of an existing file or\
    \ directory\n\nWe'll explain how to change the timestamp of an existing file or\
    \ directory using the two files shown.\n\nCommand Line - INPUT\n\n```\nubuntu\
    \ $ | ls -l\n```\n\nCommand Line - RESPONSE\n\n```\n-rw-rw-r-- 1 ubuntu ubuntu\
    \ 0 Oct 11 2018 reference.txt\n-rw-rw-r-- 1 ubuntu ubuntu 0 Dec 29 04:57 sample.txt\n\
    ```\n\n## -d option : specify date and time\n\nTo change the timestamp of the\
    \ sample.txt to \"2021-11-12 06:00\", run the command below.\n\nCommand Line -\
    \ INPUT\n\n```\nubuntu $ | touch -d \"2021-11-12 06:00\" sample.txt\n```\n\nYou\
    \ can see the timestamp changed below.\n\nCommand Line - INPUT\n\n```\nubuntu\
    \ $ | ls -l\n```\n\nCommand Line - RESPONSE\n\n```\n-rw-rw-r-- 1 ubuntu ubuntu\
    \ 0 Oct 11 2018 reference.txt\n-rw-rw-r-- 1 ubuntu ubuntu 0 Nov 12 2021 sample.txt\n\
    ```\n\n## -r (-reference) option : apply another file's timestamp\n\nTo change\
    \ the timestamp of sample.txt to the same timestamp as reference.txt, run the\
    \ command below.\n\nCommand Line - INPUT\n\n```\nubuntu $ | touch -r reference.txt\
    \ sample.txt\n```\n\nYou can see the timestamp changed as shown below.\n\nCommand\
    \ Line - INPUT\n\n```\nubuntu $ | ls -1\n```\n\nCommand Line - RESPONSE\n\n```\n\
    -rw-rw-r-- 1 ubuntu ubuntu 0 Oct 11 2018 reference.txt\n```\n"
  mdcn: "\n\n# pwd (打印工作目录)\n\n```\npwd\n```\n\n![](img/87e31443ff747018655a0f4f95ee6187_51_0.png)\n\
    \n**pwd (Print Working Directory)** 命令是一个用于打印当前工作目录的完整路径（绝对路径）的命令。此命令不需要任何参数。只需按照如下所示运行命令即可。\n\
    \n命令行 - 输入\n\n```\npwd\n```\n\n如果你的工作目录是根目录下的 *etc* 目录，命令行将返回以下结果。\n\n命令行 - 响应\n\
    \n```\n/etc\n```\n\n# cd (切换目录)\n\n```\ncd [directory path]\n```\n\n![](img/87e31443ff747018655a0f4f95ee6187_52_0.png)\n\
    \ncd (Change Directory) 命令用于更改工作目录。在图形化用户界面 (GUI) 中，你可以使用鼠标通过 Mac 上的 Finder 或\
    \ Windows 上的资源管理器选择目录或文件。在命令行界面 (CLI) 中，你需要使用键盘通过 cd 命令将工作目录移动到不同的位置。\n\n## 指定目录的特殊字符\n\
    \n在解释 cd 命令语法之前，学习一些用于指定特定目录的特殊字符是非常重要的。\n\n![](img/87e31443ff747018655a0f4f95ee6187_53_0.png)\n\
    \n- / (斜杠)：根目录\n- . (点)：当前目录\n- .. (双点)：父目录\n- ~ (波浪号)：用户家目录\n\n# cd 命令\n\n如下所示，命令语法非常简单。你可以同时使用绝对路径和相对路径来指定目录路径。\n\
    \n命令行 - 输入\n\n```\nubuntu $ | cd [directory path]\n```\n\n以下是 cd 命令的一些示例：\n\n\
    ### 进入**根目录**\n\n命令行 - 输入\n\n```\nubuntu $ | cd /\n```\n\n### 回到**父目录**\n\n命令行\
    \ - 输入\n\n```\nubuntu $ | cd ..\n```\n\n### 回到**家目录**\n\n命令行 - 输入\n\n```\nubuntu\
    \ $ | cd ~\n```\n\n如果你不添加目录路径，你的工作目录也会进入家目录。\n\n命令行 - 输入\n\n```\nubuntu $ | cd\n\
    ```\n\n### 进入名为 *directory_a* 的子目录\n\n命令行 - 输入\n\n```\nubuntu $ | cd directory_a\n\
    ```\n\n# ls (列出目录内容)\n\n```\nls [directory path]\n```\n\n无选项：列出目录和文件\napplication\
    \ media sample.txt\n\n- a 选项：列出隐藏文件\n.hidden_file application media sample.txt\n\
    \n- l 选项：列出详细信息\n\n| drxr-xr-x | 3 | usr_a staff | 4096 | Jul 16 2020 | - |\n\
    |---|---|---|---|---|---|\n| rwxr-xr-x | 15 | usr_b staff | 3180 | Dec 21 12:53\
    \ | sample.txt |\n\n**ls (List directory)** 命令用于列出目录的内容。在 GUI（图形用户界面）中，你可以看到目录下包含哪些目录和文件。在\
    \ CUI（字符用户界面）中，你需要使用键盘列出目录内容。\n\n## 列出工作目录内容\n\n当你不指定目录路径运行 `ls` 命令时，你将获得工作目录内容的列表，如下所示。\n\
    \n命令行 - 输入\n\n```\nls\n```\n\n命令行 - 响应\n\n```\napplication media sample.txt\n\
    ```\n\n## 列出特定位置下的目录内容\n\n你可以指定文件路径来执行 ls 命令。这是一个列出根目录内容的示例。\n\n命令行 - 输入\n\n```\n\
    ls /\n```\n\n命令行 - 响应\n\n```\nbin dev home lib32 libx32 media opt root ....\n\
    ```\n\n### -a 选项\n\n使用 -a 选项，你可以列出包括隐藏文件的目录内容。\n\n命令行 - 输入\n\n```\nls -a\n```\n\
    \n命令行 - 响应\n\n```\n.. .bash_history .bash_logout .bashrc .cache .profile .ssh\n\
    ```\n\n### -l 选项\n\n使用 -l 选项，你可以列出带有详细信息的目录内容。\n\n命令行 - 输入\n\n```\nls -l\n```\n\
