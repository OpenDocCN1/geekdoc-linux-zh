    # 轻量快速的文本编辑器


    Vim 是一款非常轻级的软件，不会消耗大量的计算机资源。由于 Vim 大程度上通过键盘操作，因此需要花费时间掌握；然而，一旦你掌握了所有的快捷键命令，你的编码速度将会快得多。


    # 如何启动 Vim？


    输入 `vim` 后跟文件路径。如果指定路径下不存在该文件，Vim 将创建一个新文件。如果你在当前工作目录下编辑名为 `sample.txt` 的文件，使用的命令如下所示。


    命令行 - 输入


    ```

    ubuntu $ | vim sample.txt

    ```


    > 提示：在 Mac OS 和 Windows OS 上练习 Vim


    由于 Mac OS 预装了 Vim，你可以通过终端（Terminal）启动它来练习。


    对于 Windows OS，你需要安装它。你可以从这个网站下载 Vim：[下载 Vim](https://www.vim.org/download.php)。


    ## 普通模式、插入模式和视觉模式


    ![](img/87e31443ff747018655a0f4f95ee6187_106_0.png)


    Vim 有三种不同的模式：1) 普通模式（Normal mode），2) 插入模式（Insert mode），3) 视觉模式（Visual mode）。


    ### 普通模式


    在此模式下，你无法添加文本；但你可以进行许多操作，例如


    - 在文档中移动光标

    - 删除文本

    - 复制和粘贴文本

    - 撤销上一次操作

    - 搜索短语

    - 替换短语

    - 保存文件

    - 退出 Vim


    普通模式有时被称为命令模式，特别是在按下键盘上的 `:` 之后。当你按下 `:` 时，屏幕左下角会出现字母提示。你可以运行一些命令，例如替换单词、保存文件、退出
    Vim。按下 `esc` 键可以停止命令模式。


    # 插入模式


    按下键盘上的 `i` 键，Vim 会切换到插入模式，可以在其中添加文本。你可以使用其他字母如 `I`、`a`、`o` 和 `O` 来启动插入模式；但启动插入模式时，光标的位置是不同的。按下
    `esc` 键可以返回普通模式。


    # 视觉模式


    按下键盘上的 `v` 键，Vim 会切换到视觉模式，可以在其中作为块选择文本。你可以使用 `v` 键启动视觉模式。当你使用 `v` 键时，按单词块选择文本。当你使用
    `V` 键时，按行选择文本。在此模式下，你可以删除、复制和修改选中的文本块。


    # 普通模式 (1) - 移动光标


    ![](img/87e31443ff747018655a0f4f95ee6187_108_0.png)


    为了有效地移动光标，Vim 提供了许多移动方法。以下是最重要的方法。


    # 箭头键


    使用键盘上的箭头键是移动光标的基础方法。在普通模式下，你也可以使用 `h`、`j`、`k` 和 `l` 键。通过使用这些键，你不需要移动手指即可移动光标。


    - `h` 或 `k`: 向上一行

    - `j` 或 `j`: 向下一行

    - `h` 或 `l`: 向左移动一个字符

    - `l`: 向右移动一个字符


    # 跳到特定位置


    - `gg`: 到第一行开头

    - `G`: 到最后一行开头

    - `:n`: 第 `n` 行开头

    - `:0`: 当前行开头

    - `$`: 当前行末尾


    # 翻页


    - `Ctrl + f`: 到下一页

    - `Ctrl + b`: 翻到上一页


    > 提示：在插入模式下移动光标


    在插入模式下，你只能使用箭头键移动光标，因为其他键输入会被识别为文本输入。


    # 普通模式 (2) - 删除


    | 当前光标 | 1 格 | 1 个字符 | 删除的字符 |

    | :--- | :--- | :--- | :--- |

    | `x` 或 `backspace` | | | 光标下的字符 |

    | `dd` | | | 光标所在的行 |

    | `ndd` | | | 多行（当前行及下方行）例如：`2dd` |


    ![](img/87e31443ff747018655a0f4f95ee6187_110_0.png)

    ![](img/87e31443ff747018655a0f4f95ee6187_110_1.png)

    ![](img/87e31443ff747018655a0f4f95ee6187_110_2.png)


    - `d*` 删除从行首到当前字符的字符

    - `dS` 删除从当前字符到行尾的字符

    - `dG` 删除从当前行到最后行的行


    ![](img/87e31443ff747018655a0f4f95ee6187_110_3.png)

    ![](img/87e31443ff747018655a0f4f95ee6187_110_4.png)

    ![](img/87e31443ff747018655a0f4f95ee6187_110_5.png)


    在普通模式下有几种方法删除字符的方法：


    - `x` 或 `backspace` (Mac 上为 `delete` + `fn`): 删除光标下的字符

    - `dd`: 删除光标所在的行

    - `ndd`: 删除多行（当前行及下方行）。`n` 是你想删除的行数。例如，如果你想删除当前行和下一行，输入 `2dd`。

    - `d*`: 删除从行首到当前字符的字符

    - `dS`: 删除从当前字符到行尾的字符

