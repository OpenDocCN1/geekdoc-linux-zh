    ```\n\nWhen you run the command, you may see a result like the one below. In this\
    \ case, bash is the current shell. Usually, the shell is under the /bin directory.\n\
    \n## Command Line - RESPONSE\n\n```\n/bin/bash\n```\n\n## Current Working Directory\n\
    \nDirectory Tree and Current Working Directory on GUI\n\n![](img/87e31443ff747018655a0f4f95ee6187_28_0.png)\n\
    \nCurrent Working Directory on CUI\n\n```bash\n$ ubuntu dir_a $ \n```\n\nIn a\
    \ GUI (Graphic User Interface) like Windows or Mac desktop, what you are operating\
    \ on your computer is very obvious from the desktop screen. However, in a CUI\
    \ (Character User Interface), you may need to pay more attention to what you are\
    \ operating. In other words, it is very important to understand where you are\
    \ on your computer.\n\n**Current Working Directory** (CWD) is the location where\
    \ you are on your command-line-operated computer. Current Working Directory is\
    \ also called **Working Directory** or **Current Directory.**\n\nCurrent Working\
    \ Directory is shown in your command line. It is displayed just before the command\
    \ prompt symbol.\n\n## Linux Directory Structure\n\n![](img/87e31443ff747018655a0f4f95ee6187_29_0.png)\n\
    \nIt is important to understand a basic Linux directory structure as you may use\
    \ some of the directories or files already prepared by Linux OS.\n\nThe Linux\
    \ directory structure starts with the **root** (/) directory. Usually, there are\
    \ around 10-20 directories under the root directory but the structure can differ\
    \ by distribution.\n\nAs a normal user, usually, you have your own home directory\
    \ which is created under the **home** directory. You may need to be careful when\
    \ you call \"home directory\", it can be a user's home directory or the directory\
    \ named home, which is the parent directory of each user's home directory.\n\n\
    Here are the major directories which you may often access when you use Linux OS.\n\
    \n- bin: contains essential user binary files\n- boot: contains files used to\
    \ boot the system\n- dev: contains files related to device management\n- etc:\
    \ contains system-wide configuration files\n- lib: contains libraries needed by\
    \ the essential binary files\n- root: root user's home directory\n- sbin: contains\
    \ essential system administration binary files\n- srv: contains data for services\
    \ e.g., website files for a web server\n- usr: contains users' applications and\
    \ files\n\n## Note: Text File and Binary File\n\nIn a simplified explanation,\
    \ there are two types of files - binary files and text files.\n\nBinary files\
    \ are not human-readable and require a special program or hardware processor that\
    \ can read the data inside the file.\n\nText files are human-readable and text\
    \ line-based files that you can directly edit with text editors.\n\n## Binary\
    \ File\n\n```bash\n#!/bin/bash\n\n#shell variable\nabc=2023\n\n#environmental\n\
    variable\nexport\nABC=1988\n:\n```\n\n## Text File\n\n## Absolute Path and Relative\
    \ Path (Linux OS)\n\n![](img/87e31443ff747018655a0f4f95ee6187_32_0.png)\n\nThere\
    \ are two approaches to writing a file path - **absolute path and relative path**.\
    \ The absolute path structure can be different by OS. The main figure illustrates\
    \ the absolute path structure on Linux OS.\n\n(For the Mac OS example, you can\
    \ check [Absolute Path vs. Relative Path](#))\n\nUnderstanding these concepts\
    \ is very important for setting up links to files properly. The key concepts are\
    \ shown in the illustration below.\n\n![](img/87e31443ff747018655a0f4f95ee6187_33_0.png)\n\
    \n### 1. Absolute Path\n\nThe absolute path is a path specifying the location\
    \ of a file or directory starting from the root directory. The absolute path is\
    \ also called the full path. The absolute path identifies the location of a file\
    \ or directory regardless of the current working directory. Thus, the absolute\
    \ path is useful when the file location is fixed.\n\n### The root directory (/)\n\
    \nThe root directory is the topmost directory in the computer file system hierarchy.\
    \ Its symbol is /. The root directory name was initially used in Unix operating\
    \ systems, but now it is also largely used in other operating systems.\n\n###\
    \ Absolute URL\n\nThe absolute path is used for both local and internet environments.\
    \ The path is written starting from / (root directory) to access files on a local\
    \ computer. If you want to access resources or files on the internet, the path\
    \ is written starting from `http:` or `https:` . The absolute path written in\
    \ the URL format is called the **absolute URL.**\n\n### 2. Relative Path\n\nThe\
    \ relative path is a path specifying the location of a file or directory starting\
    \ from the current working directory.\n\n### Two symbols for the relative path\n\
    \nYou need to use two symbols to describe the relative path.\n\n- Current directory:\
    \ dot (.)\n- Parent directory: double-dot (..)\n\n### Relative path to a descendant\
    \ directory or file\n\nPointing to a descendant directory or file is straightforward.\
    \ You just need to describe the path to the file or descendant directory as follows:\n\
    \n> directory name a / directory name b / file name.\n\n### Relative path to an\
    \ ancestor directory or file\n\nTo point to an ancestor directory or file, you\
    \ need to use a double-dot (..).\n\nTo describe a file path under the parent directory,\
    \ you can write ../file name.\n\nTo go to a further higher directory, repeat ...\n\
