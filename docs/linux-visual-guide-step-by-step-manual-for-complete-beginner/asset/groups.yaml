    SHELL=/bin/bash

    PWD=/home/ubuntu

    LOGNAME=ubuntu

    XDG_SESSION_TYPE=tty

    MOTD_SHOW=pam

    HOME=/home/ubuntu

    ```


    You can use the `grep` command to find a specific environmental variable. For
