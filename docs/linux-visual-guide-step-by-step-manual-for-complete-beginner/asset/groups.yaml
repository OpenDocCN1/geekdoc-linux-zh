    # 命令行 - 输入


    ```

    root@ip-172-26-0-53:~# | ufw delete 2

    ```


    # 命令行 - 交互


    正在删除：

    allow from 111.65.0.0/16 to any port 80

    是否继续操作？(y|n)? y

