    Returns path of commands\n\n```\nwhereis [command name]\n```\n\nReturns path of\
    \ command and related documents of the command such as manuals\n\nThere are several\
    \ Linux commands that give you information about Linux commands besides the command.\n\
    \n## type - displays the type of a command\n\nThe type command returns types of\
