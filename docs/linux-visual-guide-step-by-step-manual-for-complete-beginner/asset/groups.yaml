    Systemctl is a command-line tool used to monitor and control systemd and units.
    It has several sub-commands used to show the statuses of unit files and active
    units or control and monitor specific units.


    ## Commands for controlling a specific unit


    There are sub-commands to control a specific unit (or unit file). If you are not
    logged in as the superuser, add the sudo prefix to the command.


    ## systemctl start [unit name]


    When you want to start a unit named unit_a.service, use this command.


    ## systemctl stop [unit name]


    When you want to start a unit named unit_a.service, use this command.


    ```bash

    sudo systemctl stop unit_a

    ```


    ## systemctl restart [unit name]


    When you want to start a unit named unit_a.service, use this command.


    ```bash

    sudo systemctl restart unit_a

    ```


    ## systemctl reload [unit name]


    When you want to start a unit named unit_a.service, use this command.


    ```bash

    sudo systemctl reload unit_a

    ```


    ## systemctl enable [unit name]


    When you want to start a unit named unit_a.service, use this command.


    ```bash

    sudo systemctl enable unit_a

    ```


    ## systemctl disable [unit name]


    When you want to start a unit named unit_a.service, use this command.


    ```bash

    sudo systemctl disable unit_a

    ```


    ## systemctl status [unit name]


    When you want to start a unit named unit_a.service, use this command.


    ```bash

    systemctl status unit_a

    ```

