    ![](img/87e31443ff747018655a0f4f95ee6187_135_0.png)


    # ## What is sudo?


    The sudo (Super DO) command enables users to run programs with the security privileges
    of the superuser. Normal users don''t have execution permission for some commands,
    for example, installing a new library.


    Logging into the system as the superuser frequently may increase security risks
    such as password breaches. By using the sudo command, you can execute those commands
    without switching to the superuser.


    # ## Who can run the sudo command? - sudoers'
  - '[PAGE 136]


    Not all users can execute the sudo command. The users who can execute the sudo
    command have to be members of the sudo group in Ubuntu OS. For CentOS, wheel group
    members can execute the sudo command. As the users in the sudo or wheel group
    can act as the superuser, you can manage system administrator users of a server
    by editing users of the groups. On Ubuntu, you can also use the admin group instead
    of the sudo group.


    # Note: Add users to sudo or wheel group


    Give users permission to run the sudo command, include the users in the sudo group
    (on Ubuntu OS) or wheel group (on CentOS) by running the usermod command. You
    need to be careful because the order of arguments is different between the two
    commands. In usermod, you need to specify the group first while you need to specify
    the user first in gpasswd. The details of usermod and gpasswd will be explained
    later. Here are example commands.


    # Example for Ubuntu OS


    **Command Line - INPUT**


    ```

    ubuntu $ | sudo usermod -aG sudo user_a

    ```


    or


    **Command Line - INPUT**


    ```

    ubuntu $ | sudo gpasswd -a user_a sudo

    ```


    # Example for CentOS


    **Command Line - INPUT**


    ```

    ubuntu $ | sudo usermod -aG wheel user_a

    ```'
