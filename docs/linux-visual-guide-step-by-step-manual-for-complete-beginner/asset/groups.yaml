    # Tips: Sudoers and visudo command


    The configuration file for sudo is /etc/sudoers. You can check the document using
    sudo cat /etc/sudoers command; however, when you edit the file, you need to use
    the sudo visudo command. The visudo command performs a format check of the file
    before you save it.


    Run the following command to check the /etc/sudoers file.


    # Command Line - INPUT


    ```

    ubuntu $ | sudo visudo

    ```


    This is an example of Ubuntu OS (20.04 LTS) on AWS Lightsail. The command opens
    the file with the GNU text editor in this case. GNU nano is a built-in text editor
    for Unix-like computing systems. Key commands to operate the file are displayed
    at the bottom. "-" means the Ctrl key. For example, press the Ctrl + x to exit.'
