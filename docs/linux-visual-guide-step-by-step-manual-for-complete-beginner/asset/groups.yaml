    ## SSH (Secure Shell)


    ![](img/87e31443ff747018655a0f4f95ee6187_253_0.png)


    ## SSH 使用场景


    SSH (Secure Shell) 是一种网络通信协议，允许两台计算机以安全的方式进行通信。SSH 同时使用密码认证和公钥认证。通常情况下，用户验证是通过公钥认证完成的。用户验证完成后，SSH
    会切换到密码认证。


    ## 公钥认证


    传统的加密技术仅使用单一密钥进行加密和解密（对称加密），而公钥认证使用密钥对（用于异步加密的私钥和公钥）。在公钥认证中，公钥可以与任何人共享，而私钥必须保持秘密（私钥也称为密钥）。消息或数据的加密使用公钥完成，而只有私钥可以解密该消息或数据。


    ![](img/87e31443ff747018655a0f4f95ee6187_254_0.png)


    ## SSH 使用场景 - 远程登录和安全文件传输


    SSH 有两个主要用场景：**远程登录**和**安全文件传输**。SSH 远程登录广泛用于远程管理服务器。它也用于 AWS、Azure 和 GCP 等云服务。你可以使用
    SSH 连接到 GitHub 等 git远程仓库服务。SSH 也用于更安全的方式进行文件传输。使用 SSH 执行文件传输有两个主要命令——**SCP** 和
    **SFTP**。


    ## 定位 .ssh 目录


    ![](img/87e31443ff747018655a0f4f95ee6187_255_0.png)


    了解本地计算机上的 .ssh 目录对于启动 SSH 远程登录非常重要。通常，密钥对、已建立的主机信息文档和配置文件保在此目录下。


    ## .ssh 目录的位置


    .ssh 目录位于你的用户目录下。


    > .ssh 目录在 Mac 上是隐藏的。为了显示该目录，你需要在 Mac OS 上按下 shift + command 键。


    ## .ssh 目录下的密钥文件


    最初，该目录下没有文件；但是该目录下会创建三种类型的重要文件。


    ## 密钥文件


    在生成密钥对（公钥和私钥）的情况下，通常密钥对会在此目录下生成，除非你在生成密钥对时指定了其他路径。RSA（一种加密技术）的默认文件名为 id_rsa（私钥）和
    id_rsa.pub（公钥）。你可以更改密钥对的名称以管理多个密钥对。


    此外，当你从服务器或云服务下载私钥时，通常会将密钥保存在此目录下。密钥文件类型可能与你在计算机上生成的密钥文件类型不同。例如：xxx.pem。


    ## 配置文件


    配置文件非常有用。你可以编写多个 SSH 配置，以便通过简单的命令快速访问每个 SSH 服务器。如何编写该配置文件将在稍后解释。


    ## known_hosts


    known_hosts 文件是一个自动生成的文件。一旦你建立了新的 SSH 远程连接，公钥信息就会记录在该文件中，并用于随后的认证过程。


    ## SSH 远程登录 (1) - 使用服务器生成的密钥对


    ![](img/87e31443ff747018655a0f4f95ee6187_257_0.png)


    本课程介绍如何在本地计算机和远程服务器之间建立 SSH 远程连接。


    建立 SSH 远程连接有两种主要方法：


    - 1) 使用服务器生成的密钥对

    - 2) 使用客户端生成的密钥对


    ![](img/87e31443ff747018655a0f4f95ee6187_258_0.png)


    ## SSH 步骤


    在生成密钥对（公钥和私钥）的情况下，通常密钥对会在此目录下生成，除非你在生成密钥对时指定了其他路径。RSA（一种加密技术）的默认文件名为 id_rsa（私钥）和
    id_rsa.pub（公钥）。你可以更改密钥对的名称以管理多个密钥对。


