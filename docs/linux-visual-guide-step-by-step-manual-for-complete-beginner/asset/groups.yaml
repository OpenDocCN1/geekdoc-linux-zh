    # Web 服务器


    ![](img/87e31443ff747018655a0f4f95ee6187_357_0.png)


    Web 服务器是一种通过 Internet 使用 HTTP 客户端请求的软件（或安装了 Web 服务器软件的硬件）。在 Linux 体系中，Web 服务器作为服务或守护进程运行。


    当浏览器向服务器发送带有 URL（统一资源定位符）的 HTTP 请求时，Web 服务器会处理这些请求并创建带有指定网站资源的 HTML 响应，这些资源包括
    HTML、CSS 和 Javascript 文档以及所需的图像和媒体文件。


    # Apache 和 Nginx


    Linux 操作系统有两个主要的 Web 服务器 - Apache 和 Nginx。它们都是开源软件并可免费使用。根据 W3Techs.com 的数据，截至
    2023 年 2 月，全球超过 60% 的网站运行在在这两个 Web 服务器上。


    # Apache


    Apache 曾是世界上最广泛使用的 Web 服务器软件，直到 2021 年 Nginx 取代了它。Apache 采用模块系统。通过 Apache 模块，用户可以轻松地添加或删除功能并自定义他们的服务器。Apache
    可以同时处理静态和动态内容，而无需额外的应用程序服务器。虽然 Apache 涵盖的功能比 Nginx 多，但 Apache 的速度通常比 Nginx 慢且消耗更多的
    RAM 空间。


    # Nginx


    Nginx 的设计和开发是为了解决 C10K 问题，这指的是服务器无法扩展到大量（1万）客户端或连接（C）。Nginx 专注于静态内容处理，比 Apache
    更具可扩展性且速度更快。Nginx 相比 Apache 的一个主要缺点是 Nginx 无法处理动态内容，需要另一个应用程序服务器来处理动态。对于 Nginx，有一个名为
    Nginx Plus 的企业版本，涵盖了企业级功能。


    # 启动 Apache Web 服务器


    | 步骤 1 | 步骤 2 | 步骤 4 | 步骤 3 |

    |---|---|---|---|

    | 安装 Apache | 启用并启动 Apache | 放置网站文件 | 防火墙设置 |

    | - 使用包管理器（例如用于 Ubuntu 系统的 apt）安装 Apache | - 使用 systemctl 命令启用 apache2 | - 在 /var/www/html
    目录下创建并编辑 html 文件 | - 启用防火墙（例如 ufw）并允许 ssh 端口（80 和 22） |


    Ubuntu 系统的命令示例


    ```bash

    $ sudo apt update

    $ sudo sudo apt -y install apache

    $ sudo systemctl enable apache2

    $ cd /var/www/html

    $ sudo vim index.html

    ```


