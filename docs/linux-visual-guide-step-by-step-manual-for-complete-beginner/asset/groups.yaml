    # systemctl daemon-reload


    When you edit a unit file already recognized by systemd, you need to reload it
    for systemd to recognize the changes. For example, if you edit service_a''s unit
    file and check its status, you''ll see a warning like the one below.


    # Command Line - INPUT


    ```

    ubuntu@ip-172-26-0-53~:$ | systemctl status service_a

    ```


    # Command Line - RESPONSE


    > Warning: The unit file, source configuration file or drop-ins of service_a.service
    changed on disk. Run ''systemctl daemon-reload'' to reload units.


    To make systemd recognize the change, run the command like shown below. Use sudo
    to avoid the authentication error if you are not logged in as the superuser.


    # Command Line - INPUT


    ```

    ubuntu@ip-172-26-0-53~:$ sudo systemctl daemon-reload

    ```


    # systemctl list-dependencies


    systemd manages multiple units in parallel. When the system starts, default.target
    is activated and dependent units are also activated. There is a tree of dependencies
    of the unit. By running this sub-command, you can see the dependencies in the
    tree structure.'
- md: "\n# Command Line - INPUT\n\n```\nubuntu@ip-172-26-0-53:-$ systemctl list-dependencies\n\
    ```\n\n# Command Line - RESPONSE\n\n```\ndefault.target\n  accounts-daemon.service\n\
    \  multi-user.target\n  apache2.service\n  apport.service\n  atd.service\n  wpa_supplicant.service\n\
    \  basic.target\n  -.mount\n  sockets.target\n  acpid.socket\n  sysinit.target\n\
    \  apparmor.service\n  blk-availability.service\n  timers.target\n  apt-daily-upgrade.timer\n\
    ```\n\n# systemctl get-default\n\nThe default target unit is used as a starting\
    \ point for system boot. The default target is represented by the /etc/systemd/system/default.target\
    \ file. This is a symbolic link to the original .target file in another location.\
    \ To check the original target file, you can use this sub-command.\n\n# Command\
    \ Line - INPUT\n\n```\nubuntu@ip-172-26-0-53:-$ systemctl get-default\n```\n\n\
    # Command Line - RESPONSE\n\n```\ngraphical.target\n```\n\n# Create custom unit\
    \ and start at boot\n\n![](img/87e31443ff747018655a0f4f95ee6187_338_0.png)\n\n\
    You can create your custom unit file and run your designed processes at boot.\
    \ On this topic page, we'll explain how Linux OS starts multiple processes at\
    \ boot and how to create a custom unit file that can autostart at boot.\n\n# default.target\
    \ and multi-user.target\n\nBy using the functionalities of systemd, we can build\
    \ programs that auto-start at boot. As explained briefly in the previous sections,\
    \ when Linux OS starts, systemd triggers default.target. In the default.target\
    \ unit file, which is a symbolic link to another target, e.g., graphical.target,\
    \ you can see that multi-user.target is set under the Requires directive. This\
    \ means default.target triggers multi-user.target at boot.\n\nBelow is the unit\
    \ file named graphical.target, which is set as default.target in this example.\n\
    \ngraphical.target\n\n```\n[Unit]\nDescription=Graphical Interface\nDocumentation=man:systemd.special(7)\n\
    Requires=multi-user.target\nWants=display-manager.service\nConflicts=rescue.service\
    \ rescue.target\nAfter=multi-user.target rescue.service rescue.target display-manager.service\n\
    AllowIsolate=yes\n```\n\nBy default, default.target and **multi-user.target**\
    \ are stored under the /usr/lib/systemd/system directory.\n\n# .wants directory\n\
    \nA target or unit may have its .wants directory, which is used to trigger other\
    \ units with **want dependencies**. Basically, the unit files stored in the .wants\
    \ directory will be run when the unit owning the .wants directory is started.\n\
    \nUnit files under the .wants directories are generated when another unit specifies\
    \ the target or unit in the WantedBy directive, and the unit file is enabled by\
    \ the systemctl enable command. When systemctl enable command is executed, the\
    \ unit file's symbolic link is created under the .wants directory whose target\
