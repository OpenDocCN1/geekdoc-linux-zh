    ## Wildcard


    Wildcard is useful when you forget the exact name of a file or directory. Please
    see the next section on how to use the wildcard in the find command.


    ## Wildcard


    > Wildcard

    > symbol (or set of symbols) representing other characters


    The most commonly used wildcard


    ![](img/87e31443ff747018655a0f4f95ee6187_96_0.png)


    ![](img/87e31443ff747018655a0f4f95ee6187_96_1.png)


    - any single or multiple characters

    - any single character


    - Example: ca*

    - c?t

    - "cat", "can", "caterpillar", "capital", etc.

    - "cat", "cut", "cot", etc.


    Wildcard is a symbol (or a set of symbols) representing other characters. It is
    generally used for substituting any string or character.


    ## Wildcard vs. Regular Expression


    Wildcard and regular expression look similar but they are different things. The
    definition of wildcard characters can differ by software while the definition
    of meta-characters in the regular expression is typically the same across different
    software.


    * (asterisk) and ? (question mark)


    + * (asterisk) and ? (question mark) are the most commonly used wildcards. * represents
    any single or multiple characters while ? represents any single character.


    For example,


    - ca\*: "cat", "can", "caterpillar", "capital", etc.

    - c?t*: "cat", "cut", "cot", etc.


    ## Wildcard Use Cases on Linux


    ### Shorten file or directory names in the command execution


    You can use the wildcard to specify a file or directory with a long name. For
    example, when there is a file named wildcard_regular_expression_differences.txt
    and there are no other files starting with "w" in the same directory, you can
    use w* to specify the file. Below is an example of a command that specifies the
    file name to locate with w*.


    ### Command Line - INPUT


    ```bash

    ubuntu $ | cat w*

    ```


    ## Find command


    The wildcard can be useful when you forget the entire name of a file and want
    to locate it.


    For example, to search the documents whose name starts with "sample", run the
    following command.


    ### Command Line - INPUT


    ```bash

    ubuntu $ | find ~ -name sample*

    ```


    If you run the command in the same directory structure as was used in the previous
    section, the results will be like the one below.


    ### Command Line - RESPONSE


    ```bash

    /home/ubuntu/test/sample_1.txt

    /home/ubuntu/test/test_sub/sample_2.txt

    ```


    ## In (Create Link to File and Directory)


    | Type | Command |

    | :--- | :--- |

    | Symbolic link | ln -s [file or directory path] [link name] |

    | Hard link | ln [file or directory path] [link name] |


    ![](img/87e31443ff747018655a0f4f95ee6187_98_0.png)


    The in (LINK) command is used to create links to files or directories. There are
    two types of links in Linux - **symbolic link** and **hard link.**


    ## Symbolic Link


    The symbolic link is an alias on Mac OS or a shortcut on Windows OS. It is linked
    with the original file or directory. Thus, when you delete the original file or
    directory, the symbolic link no longer works.


    ## Creating a symbolic link


    To create a symbolic link, use the `ln` command with the `-s` option. To see an
    example, create `file_a` first using the cat command.


    ### Command Line - INPUT


    ```bash

    ubuntu $ | cat > file_a

    ```


    ### Command Line - INTERACTIVE


    ```bash

    test test test

    ```


    After quitting the typing mode with `Ctrl+C` and running the `ln` command to create
    a symbolic link to `file_a`.


    ### Command Line - INPUT


    ```bash

    ubuntu $ | ln -s file_a file_symbolic

    ```


    When you run the `ls -l` command, you can see file details. The first letter in
    the second row shows that it is a symbolic link and you can see that `file_symbolic`
    is linked with `file_a` under the name column.


    ### Command Line - RESPONSE


    | total 0 |

    | :--- |

    | -rw-rw-r-- 1 ubuntu ubuntu 0 Jan 9 06:47 file_a |

    | rwxrwxr-wx 1 ubuntu ubuntu 6 Jan 9 11:37 file_symbolic -> file_a |


    ## Hard Link


    The concept of the hard link is a bit more complex. In the Linux file system,
    the actual data of each file is stored in a certain location on the hard disk.
    The location is described in the `inode` of each file. When you create a hard
    link of `file_a`, the link is connected to the inode.


    ## Creating a hard link


    To create a hard link, use the `ln` command. Thus, when you delete the original
    file or directory, the hard link still exists.


    ### Command Line - INPUT


    ```bash

    ubuntu $ | ln file_a file_hard

    ```


    When you run the `ls -l` command, you can see file details. The first letter in
    the second row shows the number of hard links. You can also see that it is a hard
    link.

