    # Create and edit a file with the cat command


    Before explaining how to create or edit a file with the `cat` command, let''s
    check how the `cat` command works without any argument.


    When running the `cat` command without any argument, the cursor moves to the beginning
    of the line below and the command line waits for your input. After typing some
    words and hitting the enter key...


    # Command Line - INTERACTIVE


    ```

    ubuntu $ | cat

    test test

    ```


    ... you''ll see that the command line returns the same text as the one you typed.


    # Command Line - INTERACTIVE


    ```

    ubuntu $ | cat

    test test

    test test

    ```


    You stay in the typing mode until you quit it by pressing `Ctrl` + `C` or `Ctrl`
    + `D`


    # Redirecting standard output


    You can redirect the output to a new file or an existing file using the redirection
    special character (`>` or `>>`) followed by the file name.


    There are differences between `>` and `>>`.


    > : overwrite contents


    >> : add contents


    Note: Redirection and standard output will be explained in Chapter 5 [Standard
    Input Output and Redirection].'
