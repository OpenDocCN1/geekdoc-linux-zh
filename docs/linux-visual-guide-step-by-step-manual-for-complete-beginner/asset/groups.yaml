    # Ctrl Z 和 Ctrl C


    Ctrl Z 和 Ctrl C 也是信号。它们可以用于前台进程。Ctrl Z 用于停止（挂起）进程。Ctrl C 用于终止进程。


    # 创建、停止和终止作业


    ![](img/87e31443ff747018655a0f4f95ee6187_317_0.png)


    该图描述了一个作业的生命周期。以下是对该生命周期的总结说明。


    # 创建作业


    - 当你运行命令时不带 `&` 时，该命令将作为前台作业运行。

    - 当你运行命令并带有 `&` 时，该命令将作为后台作业运行。


    # 停止作业


    - 你可以使用 `ctrl + Z` 停止（挂起）一个作业


    # 终止作业


    - 要终止正在运行的前台作业，你可以使用 `Ctrl+C`

    - 要终止后台作业或已停止的前台作业，可以使用 `kill` 命令配合进程 ID 或作业 ID。


    # 守护进程 (Daemon Processes)


    ![](img/87e31443ff747018655a0f4f95ee6187_319_0.png)


    # 什么是守护进程？


    守护进程是在后台持续或不断运行的进程，而不是由用户通过 CUI（字符用户界面）或 GUI（图形用户界面）交互式控制。守护进程通常在操作系统启动时启动，并一直运行到操作系统关闭。操作系统启动时启动的守护进程被称为
    systemd，它将在下一节中解释。


    # 守护进程示例


    网络程序、安全程序、时间管理器、日志记录和其他在操作系统后台运行的进程都是守护进程。通常，守护进程的名字以 -d 结尾。例如，`sshd` 是 ssh 连接的守护进程，`firewalld`
    是 Linux 防火墙管理工具的守护进程。`httpd` 是用于 Apache HTTP Server 的守护进程。


    # Linux 上的服务 (Service)


    - Linux 上的服务

    - 服务通常由其他系统进程调用，用于管理计算机资源

    - 服务通常以守护进程的形式运行

    - 服务可以在没有任何人工干预的情况下相互交互


    服务插图


    ![](img/87e31443ff747018655a0f4f95ee6187_321_0.png)


    “服务”这一术语与守护进程相似。服务是通常在后台运行并响应来自同一系统其他进程或通过网络连接的进程请求的进程。许多服务通常以守护进程的形式运行。


    服务可以在没有任何人工输入的情况下调用另一个服务。在一个服务调用另一个服务后，这些服务可以相互交互（无需任何人工干预）。服务的行为由其配置文件决定。在 Linux
    操作系统上，它通常保存为 `/usr/lib/systemd/system` 或 `/etc/systemd/system` 下特定目录中的单元文件（unit
    file）。细节将在下一节解释。


    # Systemd


    ![](img/87e31443ff747018655a0f4f95ee6187_322_0.png)


    # 什么是 systemd？


    systemd 是一个为 Linux 操作系统管理其他守护进程的守护进程（或服务）。当 Linux 操作系统启动或重启时，systemd 也会启动并持续运行，集中控制其他守护进程直到操作系统关闭。你可以通过运行
    `pstree` 命令查看 systemd 在 Linux 操作系统中的位置。`pstree` 命令以层级结构显示当前在上运行的进程。


    # 命令行 - 输入


    ```

    ubuntu@ip-172-26-0-53:~$ | pstree

    ```


    # 命令行 - 响应


    ```

    systemd—accounts-daemon—2*[(accounts-daemon)]

    └acpid

    └2*[agetty]

    └amazon-ssm-agent—ssm-agent-worke—8*[[ssm-agent-worke]]

    ```


