    # Step 1. Install Apache


    To install Apache, use a package manager. In this case, we use apt. To maintain
    proper dependencies and install the right version of the program, run the "apt
    update" command first before setting up the Apache web server. This process may
    take a few minutes.


    Command Line - INPUT


    ```

    ubuntu@ip-172-26-0-53:- | sudo apt update

    ubuntu@ip-172-26-0-53:- | sudo apt -y install apache2

    ```


    # Step 2. Enable and Start Apache


    Once Apache is installed, you can enable it using the systemctl enable command.
    To start Apache right away, use the --now option as shown in the command below.


    Command Line - INPUT


    ```

    ubuntu@ip-172-26-0-53:- | sudo systemctl enable --now apache2

    ```


