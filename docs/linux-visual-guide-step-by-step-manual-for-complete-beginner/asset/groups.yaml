    ```


    Next, create a shell script for the child process.


    # Command Line - INPUT


    ```

    ubuntu $ | vim variable_child.sh

    ```


    In the variable_child.sh file, add the echo commands to call the two variables
    declared in the parent script.


    # variable_child.sh


    ```bash

    #!/bin/bash

    echo "A shell variable in the child script"

    echo abc=$abc

    echo "An environmental variable in the child script"

    echo ABC=$ABC

    ```


    Add execution permissions to these files and execute the parent script.


    # Command Line - INPUT


    ```

    ubuntu $ | sudo chmod +x variable_parent.sh

    ubuntu $ | sudo chmod +x variable_child.sh

    ubuntu $ | ./variable_parent.sh

    ```


    You can see that the values (2023 and 1988) assigned to both variables (abc and
    ABC) in the parent script shell are properly returned; however, the value assigned
    to abc (shell variable) in the child script is blank, while the value assigned
    to ABC (environmental variable) is properly returned.


    # Command Line - RESPONSE


    ```

    A shell variable in the parent shell script

    abc=2023

    an environmental variable in the parent shell script

    ABC=1988

    A shell variable in the child script

    abc=

    An environmental variable in the child script

    ABC=1988

    ```


    From this example, you can see that shell variables are only working within the
    same process, while environmental variables are inherited in child processes.


    # source (Execute Shell Script and Refresh Environmental Variables)


    ```bash

    source [shell script]

    ```


    ![](img/87e31443ff747018655a0f4f95ee6187_230_0.png)


    The source command is used to execute shell scripts and refresh environmental
    variables.


    # Running shell script with the source command


    If you run a shell script with an absolute address like demonstrated in the previous
    section, variables are not properly registered in the OS. When you run the same
    shell script with the source command, you can use the variable set of that shell
    script for another process.


    For example, you can run the shell script with the absolute path.


    ```bash

    shell script absolute path e.g., ./variable_parent.sh

    ```


    # Command Line - INPUT


    ```bash

    ubuntu $ | ./variable_parent.sh

    ```


    # Command Line - RESPONSE


    ```

    A shell variable in the parent shell script

    ab=2023

    An environmental variable in the parent shell script

    ABC=1988

    A shell variable in the child script

    ab=

    An environmental variable in the child script

    ABC=1988

    ```


    Then, try to call $ABC in the command line, but there will be no response from
    the shell.


    # Command Line - INPUT


    ```bash

    ubuntu $ | echo $ABC

    ```


    Next, run the same script with the source command. The command line displays the
    same results as the one without the source.


    > source [script path] e.g., source variable_parent.sh


    # Command Line - INPUT


    ```bash

    ubuntu $ | source variable_parent.sh

    ```


    # Command Line - RESPONSE


    ```

    A shell variable in the parent shell script

    ab=2023

    An environmental variable in the parent shell script

    ABC=1988

    A shell variable in the child script

    ab=

    An environmental variable in the child script

    ABC=1988

    ```


    However, when you call $ABC in the command line, you''ll get an assigned value.


    # Command Line - INPUT


    ```bash

    ubuntu $ | echo $ABC

    ```


    # Command Line - RESPONSE


    ```

    1988

    ```


    This is because the `source` command properly registered ABC in the environmental
    variable.


    > ### Tips: env command


