    The groupadd command is used to create a new user group. The group data is recorded
    under the /etc/group file. To execute this command, you need to run it with superuser
    privileges.


    # Create a new group


    To create a new group is simple, run the groupadd command followed by a new group
    name. For example, to create group_a, run the command below.


