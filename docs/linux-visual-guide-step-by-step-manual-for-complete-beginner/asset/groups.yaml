    The chown (ChangeOWNer) command is used to change the owner of or or directories.
    With the -R option, you can change the owner of all files and directories under
    the specified directory.


    To demonstrate the chown command, we''ll create some directories and

    file under the user_a home directory under superuser privileges.


    # Command Line - INPUT


    ```

    root # | cd /home/user_a

    root # | mkdir -p dir_a1/dir_a2

