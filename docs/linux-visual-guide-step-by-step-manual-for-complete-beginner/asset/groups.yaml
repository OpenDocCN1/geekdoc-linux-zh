    # Read (r), Write (w) and Execute (x) permissions


    There are three types of permissions (access modes). Read (r), Write (w) and Execute
    (x). The meaning of permissions is slightly different for files and directories.


    For files,


    +   - Read (r) : Be able to read the file

    - Write (w) : Be able to edit the file

    - Execute (x) : Be able to run the command defined in the file


    For directories,


    +   - Read (r) : Be able to list file and directory names under the directory
    (read the contents of the directory)

    - Write (w) : Be able to create and remove files, and change the name of files
    in the directory

    - Execute (x) : Be able to set the directory as the current working directory
    (CWD)'
