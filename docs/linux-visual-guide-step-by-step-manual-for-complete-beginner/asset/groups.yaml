    > Note: Changing the file name (or directory name) is applicable only when there
    is no directory whose name is the same as the intended new file name. If such
    directory exists, the mv command moves the file (or directory) under it without
    changing the file''s (directory''s) name.


    Move a file or directory


    The mv (Move) command is used to move a file or directory to another path.


    # Move a file or directory


    There are two key arguments in the mv command.


    +   * 1st argument: file or directory path

    * 2nd argument: destination directory path (existing directory path)


    For example, if you want to move file_a under your working directory to dir_a
    under your working directory, run the command below.


    Command Line - INPUT


    ```

    ubuntu $ | mv file_a dir_a

    ```'
