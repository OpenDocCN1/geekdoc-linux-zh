    \ is different from the upstream configuration, and is split into several files\
    \ for interaction with modules. The configuration is fully documented in /var/share/apache2/README.Debian.gz.\
    \ Refer to this file for documentation about the server, which can be found by\
    \ accessing the manual if the apache2-package was installed on the server.\n\n\
    The configuration layout for an Apache2 server installation on Ubuntu systems\
    \ is as follows:\n\n```\n/etc/apache2/\n  ├── ports.conf\n  ├── modules-enabled/\n\
    \  │    └── dir.conf\n  ├── conf-enabled/\n  │    └── apache2.conf\n  └── sites-enabled/\n\
    \       └── 000-default.conf\n  ports.conf\n```\n\n+   * apache2.conf is the main\
