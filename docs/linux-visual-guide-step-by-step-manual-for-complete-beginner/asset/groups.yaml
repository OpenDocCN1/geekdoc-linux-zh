    \ ORANGE\n7 He likes the GRAPES\n8 He likes the BANANAS\n9 She likes the APPLE\n\
    ```\n\n## -n option\n\nWhen you search data in a file, you may want to know the\
    \ line number of data. The -n option gives you line number along with search results.\n\
    \nFor example, to search \"apple\" in sample_1.txt, with its line number, run\
