    To specify file input,


    cat [file path] | tr ["original string"]["new string"]


    tr ["original string"]["new string"] < [file path]


    tr (TRTranslate) command is used to replace a string with another string. As the
    command doesn''t have a file input argument, it is often used with the pipe or
    redirection.


    # tr command syntax


    The tr command syntax itself is tr ["original string"]["new string"]. The original
    and new strings should be quoted with " " or ''\''; however, the command doesn''t
    work on its own as it needs standard input.


    # tr command with pipe


    To make an input to the tr command, you can use the cat command and connect it
    with the tr command.'
