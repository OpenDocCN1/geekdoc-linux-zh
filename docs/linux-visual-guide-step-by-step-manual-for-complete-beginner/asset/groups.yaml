    # Foreground and Background Jobs


    +   Background Jobs

    - Jobs running in the background

    - Multiple jobs can be running at the same time

    - Run a command with & at the end to start a job


    +   Foreground Job

    - Jobs running on a terminal

    - Only one job can be running at the same time

    - Run a command in a usual way to start a job


    ![](img/87e31443ff747018655a0f4f95ee6187_306_0.png)


    There are two types of jobs. Oe is a job running as it connects with a terminal
    - called a foreground job. The other is a job running in the background called
    a background job. Understanding the concepts is important for managing multi-tasking
    jobs.


    # Foreground Job


    When you run a command on a terminal, usually it is executed as a foreground job.
    As one terminal has only one command line, only one job can be running at the
    same time.


    When you execute only a single command, usually the computer completes the process
    within a second. This makes it harder for us to see the difference between foreground
    jobs and background jobs. To see the difference clearly, try a practice task below.'
- md: "\n# Practice 1\n\nObjective:\nUnderstand how the foreground job works\n\n##\
    \ 1. Create a shell script\n\nFirst, let's create a shell script that requires\
    \ a longer processing time. The shell script (loop.sh file) below counts down\
    \ numbers from 1,000,000.\n\nUse vim to create a shell script named loop.sh.\n\
    \nCommand Line - INPUT\n\n```\nubuntuip-172-26-0-53:- | mkdir dir_ch8\nubuntuip-172-26-0-53:-\
    \ | cd dir_ch8\nubuntuip-172-26-0-53:- | vim loop.sh\n```\n\nPress the i key to\
    \ switch to the insert mode. Next, copy the code below and paste it into the file.\
    \ After pasting the code, press the esc key followed by the : key and save the\
    \ file by pressing the w + q keys. To learn how to use Vim, check Chapter 3. Vim\
    \ Editor.\n\nloop.sh\n\n```bash\n#!/bin/bash\ncount=5000000\nwhile [ $count -ge\
    \ 0 ]\ndo\n  echo \"countdown $count\"\n  count=$((count - 1))\ndone\n```\n\n\
    ## 2. Run the shell script\n\nTo run the shell script, adjust access mode and\
    \ run the shell script with the file path.\n\nCommand Line - INPUT\n\n```\nubuntu@ip-172-26-0-53:$\
    \ | sudo chmod+x loop.sh\nubuntu@ip-172-26-0-53:$ | ./loop.sh\n```\n\nWhen you\
    \ run this as a foreground job, you'll see the countdown on your terminal. Until\
    \ the countdown is completed, your command line is occupied and you cannot create\
    \ another job.\n\nCommand Line - RESPONSE\n\n```\n:countdown 920071\ncountdown\
    \ 920070\ncountdown 920069\n:\n```\n\nTo suspend or stop the job, press Ctrl +\
    \ Z or Ctrl + C.\n\nEven when you redirect the standard output to a text file,\
    \ the job is still running as a foreground job and you cannot make another job.\n\
    \nCommand Line - INPUT\n\n```\nubuntu@ip-172-26-0-53:$ | ./loop.sh > countdown.txt\n\
    ```\n\n# Background Job\n\nAs you cannot make a new job when a foreground job\
    \ is running, if a program requires a lengthy process, it is good to run it as\
    \ a background job. You can run multiple background jobs at the same time as they\
    \ are running in the background. To start a background job, run a command with\
    \ & at the end of the command.\n\n# Practice 2\n\nObjective:\nUnderstand how background\
    \ job works\n\n## 1. Run the shell script multiple times as a background job\n\
