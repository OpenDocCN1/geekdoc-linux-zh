    \ Line - INPUT\n\n```\nubuntu $ | grep -v g test/sample_1.txt\n```\n"
  mdcn: "\n\n使用 **Ctrl+C** 退出输入模式并运行 `cat` 命令后，你可以确认文件已被你输入的内容覆盖。\n\n## 命令行 - 输入\n\
    \n```\nubuntu $ | cat sample_cat.txt\n```\n\n## 命令行 - 响应\n\n```\noverwrite text\n\
    overwrite text\n```\n\n## sort (排序文件内容)\n\n![](img/87e31443ff747018655a0f4f95ee6187_77_0.png)\n\
    \nsort 命令用于对对文件内容进行排序。该命令通常与标准输出重定向配合使用，将输出保存到另一个文件中。\n\n## 在命令行中排序文件内容\n\n如果你不将命令的输出重定向到文件，命令将把输出返回到屏幕上。\n\
    \n例如，假设你有一个名为 `sample_sort.txt` 的文件，内容如下。\n\n命令行 - 输入\n\n```\nubuntu $ | cat sample_sort.txt\n\
    ```\n\n命令行 - 响应\n\n```\nbanana\napple\norange\ngrapes\n```\n\n当你对 `sample_sort.txt`\
    \ 文件运行 `sort` 命令时，排序后的内容将如如下所示在命令行中显示。\n\n## 命令行 - 输入\n\n```\nsort sample_sort.txt\n\
    ```\n\n## 命令行 - 响应\n\n```\napple\nbanana\ngrapes\norange\n```\n\n## -r 选项：反序排序\n\
    \n当你使用 -r 选项时，排序顺序会反转。\n\n例如，使用相同的 `sample_sort.txt` 文件运行 `sort -r` 命令。命令行返回按字母反序排列的项目列表，如下所示。\n\
    \n命令行 - 输入\n\n```\nubuntu $ | sort -r sample_sort.txt\n```\n\n## 命令行 - 响应\n\n\
    ```\norange\ngrapes\nbanana\napple\n```\n\n## 将输出重定向到另一个文件\n\nsort 命令不会改变文件的内容。它只是在命令行中作为标准输出提供排序输出。\n\
    \n例如，你可以通过运行 `cat` 命令确认 `sample_sort.txt` 的内容与原始保持一致。\n\n命令行 - 输入\n\n```\nubuntu\
    \ $ | cat sample_sort.txt\n```\n\n命令行 - 响应\n\n```\nbanana\napple\norange\ngrapes\n\
    ```\n\n要将输出保存到文件中，你可以使用标准输出重定向（请参考第 5 章 标准输入输出与重定向）。例如，你可以运行下面的命令来创建一个带有排序输出的新文件\
    \ `sample_sorted.txt`。\n\n命令行 - 输入\n\n```\nubuntu $ | sort sample_sort.txt > sample_sorted.txt\n\
    ```\n\n通过运行 `cat` 命令，你可以确认创建了一个包含排序内容的新文件。\n\n命令行 - 输入\n\n```\nubuntu $ | cat\
    \ sample_sorted.txt\n```\n\n命令行 - 响应\n\n```\napple\nbanana\ngrapes\norange\n```\n\
    \n> 注意\n\n> 当你对 `sort` 命令使用重定向时，不能对标准输出使用相同的文件名。如果你使用同一个文件，文件内容将被擦除。\n\n![](img/87e31443ff747018655a0f4f95ee6187_80_0.png)\n\
    \n## grep (全局正则表达式打印)\n\n```\ngrep [搜索模式] [文件或目录路径]\n短语或正则表达式\n```\n\n| xxxAAXXX\
