    \ your productivity. Although it is a remote environment, you can operate as if\
    \ it were a local environment with high visibility of directory structure and\
    \ an advanced text editor environment. Here are the steps for establishing SSH\
    \ remote login with VS Code.\n\n## STEP 1. Install Remote Development Extension\n\
    \nOpen VSC and select the extension icon from the left sidebar. Search for the\
    \ **Remote Development** extension and click on the Install button.\n\nRemote\
    \ Development includes the following extensions:\n\n- Remote - SSH\n- Remote -\
    \ SSH: Editing Configuration Files\n- Remote Explorer\n- WSL\n- Dev Containers\n\
    \n# STEP 2. Establish SSH Remote Connection\n\n### 1. Select the remote login\
    \ icon on the left sidebar in the Remote Explorer\n\n![](img/87e31443ff747018655a0f4f95ee6187_276_0.png)\n\
    \n### 2. Click the setting icon to select the SSH config file\n\n![](img/87e31443ff747018655a0f4f95ee6187_277_0.png)\n\
    \n### 3. Select your SSH config file\n\n![](img/87e31443ff747018655a0f4f95ee6187_277_1.png)\n\
    \nWhen you select the file, you'll see the config file contents in the right window.\
    \ (Please refer to the previous section about how to make the config file.)\n\n\
    ```config\nUsers > user_a > .ssh > config\nHost ssh_test\n  Hostname 18.143.143.190\n\
    \  User ubuntu\n  IdentityFile ~/.ssh/lightsailDefaultKey-ap-southeast-1.pem\n\
    ```\n\n### 4. Click on the arrow or window icon of the SSH host name.\n\nBy clicking\
    \ on the arrow icon, you can connect to the host in the same window. When you\
    \ click on the window icon, a new VS Code window opens and establish the SSH connection\
    \ in the new window.\n\n**Note:** VS Code may also ask for the platform (OS) of\
    \ the host server. Select Linux if asked.\n\n### 5. If you set a passphrase for\
    \ the private key, you need to enter the passphrase to move forward.\n\n![](img/87e31443ff747018655a0f4f95ee6187_278_0.png)\n\
    \n### 6. Once VS Code is connected to the remote server, you'll see the status\
    \ at the bottom left corner of the VS Code window.\n\n![](img/87e31443ff747018655a0f4f95ee6187_278_1.png)\n\
    \n### 7. To open directories in the remote server, select the file icon on the\
    \ left and press the Open Folder button.\n\n### 8. Select the highest directory\
    \ hierarchy to display in the VS Code editor\n\nIf you want to show only your\
    \ home directory (/home/ubuntu/), press the / ok button. You can also change the\
    \ highest directory. If you want to show the entire directory tree, and press\
    \ the OK button.\n\n![](img/87e31443ff747018655a0f4f95ee6187_279_0.png)\n\n###\
    \ 9. If you set a passphrase for the private key, VS Code will ask for the passphrase.\n\
    \n![](img/87e31443ff747018655a0f4f95ee6187_279_1.png)\n\n### 10. On the first\
    \ access, VSC will ask if you trust the folder.\n\nSelect the Yes button to connect\
    \ to the folder.\n\n![](img/87e31443ff747018655a0f4f95ee6187_280_0.png)\n\n# STEP\
    \ 3. Open a Terminal and connect the SSH Remote Environment on VS Code\n\nTo open\
    \ a Terminal in the VSC window, select Terminal on the menu bar and click New\
    \ Terminal.\n\n![](img/87e31443ff747018655a0f4f95ee6187_280_1.png)\n\nNow you\
    \ can work on the remote server as if it were in the local environment.\n\n![](img/87e31443ff747018655a0f4f95ee6187_281_0.png)\n\
    \n# STEP 4. Close SSH Remote Connection\n\nPress the bottom left SSH icon and\
    \ find the \"Close Remote Connection\" menu in the search bar at the top. Click\
    \ the \"Close Remote Connection\" menu to close the connection.\n\n![](img/87e31443ff747018655a0f4f95ee6187_281_1.png)\n\
    \n# Tips: Use Terminal\n\nIf you cannot establish the SSH remote connection in\
    \ VS Code the first time, try the remote connection using the Terminal application\
    \ (see the previous section). You can use VSC starting from the second connection\
    \ to the remote server.\n\n![](img/87e31443ff747018655a0f4f95ee6187_282_0.png)\n\
    \n# SCP (Secure Copy Protocol)\n\n| Local to Remote | Remote to Local |\n| :---\
    \ | :--- |\n| scp -i ① ② ③ 3b 3c | scp -i ① ② 2a 2b 2c ③ |\n| key info destination\
    \ | key info source |\n| ① Private key path (local) | ① Private key path (local)\
    \ |\n| ② Source file path (remote) | 2a User name (remote) |\n| ③ User name (remote)\
    \ | 2b IP address (remote) |\n| 3b IP address (remote) | 2c Source file path (remote)\
    \ |\n| 3c Destination directory path (remote) | ③ Destination directory path (local)\
    \ |\n\n![](img/87e31443ff747018655a0f4f95ee6187_283_0.png)\n\nSSH can be used\
    \ not only for remote login but also for file transfer in a secure way. There\
    \ are two protocols for transferring files with SSH - **SCP (Secure Copy Protocol)**\
    \ and SFTP (Secure File Transfer Protocol). In this section, we'll explain SCP.\n\
    \n## Transferring from local to remote\n\nTo transfer a file from the local computer\
    \ to the remote server, the following five sets of information are needed for\
    \ the SCP command.\n\n## Key file\n\n- **Private key file path** on your local\
    \ computer (usually, under the .ssh directory)\n\n## Source file\n\n- Source file\
    \ path on your local computer\n\n## Destination\n\n- User name of the remote server\n\
    - IP address of the remote server\n- Destination directory path on the remote\
    \ server. If you want to transfer the file to the user's home directory of the\
    \ remote server, you can skip this argument.\n\nFor a better understanding, please\
    \ go through the following practice section.\n\n## Practice 1\n\nObjective:\n\
    Transfer a file from the local computer to the remote server\n\nThe following\
    \ are the paths of the file to be transferred and the destination directory.\n\
    \n- File to be transferred: ~/dir_ch7_local/sample.txt (on the local computer)\n\
    - Destination directory: ~/dir_ch7_remote (on the remote server)\n\nNote: For\
    \ this practice, open two terminals (command lines). One for a local operation\
    \ and another one for a remote operation.\n\n# 1. Create a directory on the remote\
    \ server\n\nCreate a directory for receiving a file.\n\nFor this operation, use\
    \ the terminal connected to the remote server.\n\nCommand Line - INPUT (Remote)\n\
    \n```bash\nubuntu@ip-172-26-0-53 $ | cd\nubuntu@ip-172-26-0-53 $ | ~ mkdir dir_ch7_remote\n\
    ```\n\n# 2. Create a sample file on the local computer\n\nCreate a sample file\
    \ for transferring to the remote server.\n\nFor this operation, use the local\
    \ terminal that is not connected to the remote server.\n\nCommand Line - INPUT\
    \ (Local)\n\n```bash\n% | cd\n% | ~ mkdir dir_ch7_local\n% | cd dir_ch7_local\n\
    % | touch sample.txt\n```\n\n# 3. Transfer the file\n\nRun the scp command with\
    \ the private key path, source file path, and destination directory path.\n\n\
    Command Line - INPUT (Local)\n\n```bash\n% | scp -i ~/.ssh/id_rsa sample.txt\n\
    ubuntu@18.143.143,190:dir_ch7_remote\n```\n\nCommand Line - RESPONSE\n\n| sample.txt\
    \ 100% 0 |\n| 0.0KB/s 00:00 |\n"
  mdcn: "\n\n# SSH 配置文件\n\n![](img/87e31443ff747018655a0f4f95ee6187_273_0.png)\n\n\
    SSH 配置文件是一个加速 SSH 远程登录过程的极其有工具。通过在配置文件写入以下信息，你可以缩短 SSH 命令。\n\n# 步骤 1. 在 .ssh 目录下的配置文件中描述\
    \ SSH 远程登录密钥信息\n\n在配置文件中描述以下信息。如果配置文件不存在，你可以创建一个新的。\n\n- **Host** (SSH 名称)：你可以使用任何名称来标识此\
    \ SSH 配置\n- **Hostname**：要连接的服务器的公网 IP 地址\n- **User**：服务器的用户名\n- **IdentityFile**：SSH\
    \ 远程登录私钥文件的完整路径\n\n# 步骤 2.运行 SSH 命令\n\n使用你创建的名称运行 SSH 命令\n\n```bash\n% | ssh [ssh\
    \ name]\n```\n\n# 练习\n\n如果你还没有配置文件，请在 .ssh 目录中创建它。对于 Windows PowerShell，请使用 `New-Item`\
    \ 命令代替 `touch` 命令。\n\n命令行 - 输入 (本地)\n\n```bash\n% | cd ~/ssh\n% | touch config\n\
    ```\n\n打开文件并添加如下所示必要信息。\n\nconfig\n\n```\nHost ssh_test\nHostname 18.143.143.190\n\
    User ubuntu\nIdentityFile ~/.ssh/id_rsa\n```\n\n保存文件后，运行以下命令。\n\n命令行 - 输入 (本地)\n\
    \n```bash\n% | ssh ssh_test\n```\n\n如果设置了短语（passphrase），命令行可能会提示你输入短语。输入你设置的短语后，即可建立\
    \ SSH 连接。如果你没有设置短语，将立即建立 SSH 连接。\n\n命令行 - 输入 (远程)\n\n```bash\nubuntu@ip-172-26-0-53:-$\
    \ |\n```\n\n# 使用 Visual Studio Code 进行 SSH 远程登录\n\n![](img/87e31443ff747018655a0f4f95ee6187_275_0.png)\n\
    \n使用 Visual Studio Code (VS Code) 进行 SSH 远程登录可以显著提高你的效率。尽管这是一个远程环境，但你可以像操作本地环境一样进行操作，具有极高的目录结构可见性和高级文本编辑器环境。以下是使用\
    \ VS Code 建立 SSH 远程登录的步骤。\n\n## 步骤 1. 安装远程开发\n\n打开 VSC，选择左侧边栏的扩展图标。搜索 **Remote\
    \ Development** 扩展并点击安装按钮。\n\nRemote Development 包含以下扩展：\n\n- Remote - SSH\n-\
    \ Remote - SSH: Editing Configuration Files\n- Remote Explorer\n- WSL\n- Dev Containers\n\
    \n# 步骤 2. 建立 SSH 远程连接\n\n### 1. 在 Remote Explorer 的左侧边栏中选择远程登录图标\n\n![](img/87e31443ff747018655a0f4f95ee6187_276_0.png)\n\
    \n### 2. 点击设置图标选择 SSH 配置文件\n\n![](img/87e31443ff747018655a0f4f95ee6187_277_0.png)\n\
    \n### 3. 选择你的 SSH 配置文件\n\n![](img/87e31443ff747018655a0f4f95ee6187_277_1.png)\n\
    \n当你选择文件时，你将在右窗口看到配置文件的内容。（请参考上一节关于如何创建配置文件的部分。）\n\n```config\nUsers > user_a\
    \ > .ssh > config\nHost ssh_test\n  Hostname 18.143.143.190\n  User ubuntu\n \
    \ IdentityFile ~/.ssh/lightsailDefaultKey-ap-southeast-1.pem\n```\n\n### 4. 点击\
    \ SSH 主名的箭头或窗口图标。\n\n通过点击箭头图标，你可以在当前窗口中连接到主机。点击窗口图标时，将打开一个新的 VS Code 窗口并在新窗口中建立\
    \ SSH 连接。\n\n**注意：** VS Code 可能会询问主机服务器的平台（操作系统）。如果被询问，请选择 Linux。\n\n### 5. 如果你为私钥设置了短语，你需要输入该短语才能继续。\n\
    \n![](img/87e31443ff747018655a0f4f95ee6187_278_0.png)\n\n### 6. 一旦 VS Code 连接到远程服务器，你将在\
    \ VS Code 窗口左下角看到状态。\n\n![](img/87e31443ff747018655a0f4f95ee6187_278_1.png)\n\n\
    ### 7. 要打开远程服务器中的目录，选择左侧的文件图标并点击“打开文件夹”（Open Folder）按钮。\n\n### 8. 选择要在 VS Code\
    \ 编辑器中显示的最高层级目录\n\n如果你只想显示主目录 (/home/ubuntu/)，请按 OK 按钮。你也可以更改最高目录。如果你想显示整个目录树，点击\
    \ OK 按钮。\n\n![](img/87e31443ff747018655a0f4f95ee6187_279_0.png)\n\n### 9. 如果你为私钥设置了短语，VS\
    \ Code 将要求输入短语。\n\n![](img/87e31443ff747018655a0f4f95ee6187_279_1.png)\n\n###\
    \ 10. 在首次访问时，VSC 会询问是否信任该文件夹。\n\n选择 Yes 按钮连接文件夹。\n\n![](img/87e31443ff747018655a0f4f95ee6187_280_0.png)\
    \ # 步骤 3. 在 VS Code 中打开终端并连接远程环境\n\n要在 VSC 窗口中打开终端，选择菜单栏上的“终端”（Terminal）并点击“新建终端”（New\
    \ Terminal）。\n\n![](img/87e31443ff747018655a0f4f95ee6187_280_1.png)\n\n现在你可以像在本地环境一样在远程服务器上工作。\n\
    \n![](img/87e31443ff747018655a0f4f95ee6187_281_0.png) # 步骤 4. 关闭 SSH 远程连接\n\n\
    点击左下角的 SSH 图标，在顶部找到“关闭远程连接”（Close Remote Connection）菜单。点击“关闭远程连接”菜单关闭连接。\n\n![](img/87e31443ff747018655a0f4f95ee6187_281_1.png)\
    \ # 提示：使用终端\n\n如果首次在 VS Code 中无法建立 SSH 远程连接，请尝试使用终端应用程序（见前节）进行远程连接。\n\n![](img/87e31443ff747018655a0f4f95ee6187_282_0.png)\
    \ # SCP（安全复制协议）\n\n| 本地到远程 | 远程到本地 |\n| :--- | :--- |\n| scp -i ① ③ 3b 3c | scp\
    \ -i ② 2a 2c ③ |\n| 密钥信息 | 密钥信息 |\n| ① 私钥路径 (本地) | ① 私钥路径 (本地) |\n| ② 文件路径 (远程)\
    \ | 2a 用户名 (远程) |\n| ③ 用户名 (远程) | 2b IP 地址 (远程) |\n| 3b IP 地址 (远程) | 2c 文件路径 (远程)\
    \ |\n| 3c 目录路径 (远程) | ③ 目录路径 (本地) |\n\n![](img/87e31443ff747018655a0f4f95ee6187_283_0.png)\n\
    \nSSH 不仅用于远程登录，还用于安全地传输文件。有两种使用 SSH 传输文件的协议：**SCP（安全复制协议）** 和 SFTP（安全文件传输协议）。在本节中我们将解释\
    \ SCP。\n\n## 从本地传输\n\n要从本地计算机传输文件到远程服务器，SCP 命令需要以下五组信息。\n\n## 密钥\n\n- 本地计算机上的私钥文件路径（通常在\
    \ .ssh 目录下）\n\n## 源文件\n\n- 本地计算机的文件路径\n\n## 目标\n\n- 远程服务器的用户名\n- 远程服务器的 IP 地址\n\
    - 远程服务器上的目录路径。如果你想将文件传输到远程服务器的用户目录，可以跳过此参数。\n\n为了更好地理解，请完成以下练习。\n\n## 练习 1\n\n\
    目标：\n从本地计算机传输文件到远程服务器\n\n以下是待传输的文件和目标目录的路径：\n\n- 传输的文件：~/dir_ch7_local/sample.txt\
    \ (本地计算机)\n- 目标目录：~/dir_ch7_remote (远程服务器)\n\n注意：此此练习请打开两个终端（命令行）。一个用于本地操作，另一个用于远程操作。\n\
    \n# 1. 在远程服务器上创建目录\n\n创建一个接收文件的目录。\n此项操作请使用连接到远程服务器的终端。\n\n命令行 - 输入 (远程)\n\n```bash\n\
    ubuntu@ip-172-26-0-53 $ | cd\nubuntu@ip-172-26-0-53 $ | ~ mkdir dir_ch7_remote\n\
    ```\n\n# 2. 在本地计算机上创建示例文件\n\n创建一个要传输到远程服务器的示例文件。\n此操作请使用未连接到远程服务器的本地终端。\n\n命令行\
    \ - 输入 (本地)\n\n```bash\n% | cd\n% | ~ mkdir dir_ch7_local\n% | cd dir_ch7_local\n\
    % | touch sample.txt\n```\n\n# 3. 传输文件\n\n使用私钥路径、源文件路径和目标目录路径运行 scp 命令。\n\n命令行\
    \ - 输入 (本地)\n\n```bash\n% | scp -i ~/.ssh/id_rsa sample.txt\nubuntu@18.143.143,190:dir_ch7_remote\n\
    ```\n\n命令行 - 响应\n\n| sample.txt 100% 0 |\n| 0.0KB/s 00:00 |\n\n"
