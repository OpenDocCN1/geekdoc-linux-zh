    The cp (CoPy) command is used to copy a file or directory. You can specify the
    destination directory to create a copy of the file or directory. You can also
    use the -r option to create a copy of a directory.


    # Copy a file with the same name


    There are two key arguments in the cp command.


    +   * 1st argument: source file path

    * 2nd argument: destination directory path (existing directory path)


    For example, if you want to make a copy of file_a under your working directory
    to dir_a under your working directory, run the command below.


    Command Line - INPUT'
