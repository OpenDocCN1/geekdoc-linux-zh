    # 6. 删除策略


    可以使用 `ufw delete` 命令删除列出的策略。执行此命令时，你需要指定想要删除的策略编号。你可以使用 `ufw status numbered`
    命令来检查策略编号。如果你的策略不多，也可以从上往下数来找到你想要删除的策略编号。


    在 UFW 启用状态下，运行 `ufw status numbered` 命令来检查策略编号。


    # 命令行 - 输入


