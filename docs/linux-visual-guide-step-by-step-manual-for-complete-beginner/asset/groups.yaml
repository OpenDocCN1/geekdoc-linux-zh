    ## Firewall


    ![](img/87e31443ff747018655a0f4f95ee6187_348_0.png)


    ## Firewall


    | Firewall Hardware | Firewall Software on server |

    | :--- | :--- |


    A firewall is a network security hardware device or software that monitors incoming
    and outgoing network traffic and permits or blocks data packets based on a set
    of security rules. Basically, you want to block malicious access or unnecessary
    access to avoid network security risks while allowing safe and legitimate traffic.
    In the Linux OS context, a firewall is a part of Linux services or a daemon process.


    ## Four Types of Firewalls


    Firewalls can be categorized into four groups depending on their approaches to
    managing data traffic.


    - 1. Packet Filtering

    - 2. Circuit Gateways

    - 3. Application Gateways

    - 4. MAC Layer Firewalls


    The most well-known approach is Packet Filtering. It mainly covers the Internet
    Layer but it can identify traffic based on the Transport Layer as well. Circuit
    Gateways cover the Transport Layer, and Application Gateways cover the Application
    Layer while MAC Layer Firewalls cover the Network Interface Layer.


    ![](img/87e31443ff747018655a0f4f95ee6187_349_0.png)


    ## Netfilter


    Linux Kernel has its own traffic management framework called Netfilter. Netfilter
    can be used for several purposes - such as security enhancement and general network
    configurations - by managing network traffic, including packet filtering.


    ## Netfilter backend tools


    As Netfilter is a framework (a set of rules), you need a tool to be able to utilize
    it. The most commonly used tool is iptables. An alternative to iptables is nftables.
    However, both tools are not easy to use.


    ## Netfilter frontend tools


    To support backend tools, there are several frontend tools which are more user-friendly.
    The frontend tools differ by Linux distribution. For example, CentOS provides
    firewalld while Ubuntu provides UFW (Uncomplicated Firewall). Both programs run
    on Linux OS as a service or daemon process.


    ## UFW (Uncomplicated Firewall)


    | UFW Key Commands argument |

    | :--- | :--- |

    | 1. Check UFW Status | ufw status | ufw status verbose |

    | 2. Enable and Disable UFW | ufw enable | ufw disable |

    | 3. Default Policy | ufw default [allow or deny] |

    | 4. Allow or Deny Ports | ufw allow [port number] | ufw deny [port number] |

    | 5. Allow or Deny IP Addresses | ufw allow from [IP address] to [IP address or
    any] [port number] |

    | 6. Delete | ufw delete [rule number] |


    The Linux kernel provides a packet filtering system called netfilter. Netfilter
    is usually controlled by iptables. Using iptables, you can manage Netfilter in
    a flexible way; however, iptables are not easy to use. UFW (Uncomplicated Firewall)
    is a frontend program for iptables that provides an easy-to-use interface for
    people who are not familiar with firewall concepts.


    ## Overview of UFW


    There are six types of `ufw` commands.


    - 1. Check UFW Status

    - 2. Enable and Disable UFW

    - 3. Default Policy Setting

    - 4. Allow or Deny Ports

    - 5. Allow or Deny IP Addresses

    - 6. Delete Policies


    To run ufw commands, you needuser privilege. For better operational efficiency,
    switch to the superuser for this section.


    ## Command Line - INPUT


    ```

    ubuntu@ip-172-26-0-53:~$ sudo su -

    ```


    ## 1. Check UFW Status


    As a default setting, UFW is not enabled yet, although the ufw service daemon
    process may already be running. Check UFW status by running the ufw status command.


    ## Command Line - INPUT


    ```

    root@ip-172-26-0-53:~$ ufw status

    ```


    ## Command Line - RESPONSE


    ```

    Status: inactive

    ```


    ## 2. Enable and Disable UFW


    To enable UFW, use the ufw enable command. There will be an alert about ssh connection.


    ## Command Line - INPUT


    ```

    root@ip-172-26-0-53:~$ ufw enable

    ```


    ## Command Line - RESPONSE


    ```

    Command may disrupt existing connections. Proceed with operation (y/n)? y

    Firewall is active and enabled on system startup

    ```


    ## IMPORTANT


    As VPS or servers on the cloud are usually managed through SSH, you need to carefully
    manage the settings. The existing SSH session can continue; however, as soon as
    the session ends, the firewall setting will be applied and there is a risk that
    you will not be able to connect to the server anymore.


    To avoid this risk, you need to allow SSH port 22 as soon as you enable UFW.


    Once UFW is enabled, you can check its status. Check the status using the ufw
    status verbose command. This command will give you a more detailed status, including
    default policy status, which will be explained in the next section.


    ## Command Line - INPUT


    ```

    root@ip-172-26-0-53:~$ ufw status verbose

    ```


    ## Command Line - RESPONSE


    ```

    Status: active

    Logging: on (low)

    Default: deny (incoming), allow (outgoing), disabled (routed)

    New profiles: skip

    ```


    If you want to disable UFW, run the ufw disable command like shown below.


    ## Command Line - INPUT


    ```

    root@ip-172-26-0-53:~$ ufw disable

    ```


    ## Command Line - RESPONSE


    ```

    Firewall stopped and disabled on system startup

    ```


    ## 3. Default Policy Setting


    The default policy is applied to all ports. As an initial setting, the incoming
    firewall policy is set as `deny`. This means all traffic to this server is denied
    regardless of ports. On the other hand, the outgoing traffic initial firewall
    policy is `allow`, which means outgoing traffic is allowed regardless of the ports.


    The default setting can be updated using the `ufw default` command. If you want
    to change the default policy to `allow`, run the command below.


    ## Command Line - INPUT


    ```

    root@ip-172-26-0-53:~$ ufw default allow

    ```


    ## Command Line - RESPONSE


    ```

    > Default incoming policy changed to ''allow''

    (be sure to update your rules accordingly)

    ```


    If you want to switch back to `deny`, run the command below.


    ## Command Line - INPUT


    ```

    root@ip-172-26-0-53:~$ ufw default deny

    ```


    ## Command Line - RESPONSE


    ```

    > Default incoming policy changed to ''deny''

    (be sure to update your rules accordingly)

    ```


    ## 4. Allow or Deny Ports


    If the default is `deny`, you can list up ports (whitelist) using the `ufw allow`
    command. For example, if you want to `allow` port 22 for ssh, run the command
    below.


    ## Command Line - INPUT


    ```

    root@ip-172-26-0-53:~$ ufw allow 22

    ```


    ## Command Line - RESPONSE


    ```

    > Rules updated

    Rules updated (v6)

    ```

