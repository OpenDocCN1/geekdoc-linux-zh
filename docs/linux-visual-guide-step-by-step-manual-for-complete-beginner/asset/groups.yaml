    # Chapter 1

    Linux Basics


    In this chapter, we''ll give you an overview of Linux OS including basic knowledge
    of CUI (Character-based User Interface), different types of Linux OS (Linux distributions),
    Linux command syntax, and special characters.


    The following topics are covered in this chapter.


    - TOPICS

    1. What Is OS?

    2. CUI and GUI

    3. Linux Distributions

    4. Package Manager

    5. Kernel and Shell

    6. Current Working Directory

    7. Linux Directory Structure

    8. Absolute Path and Relative Path (Linux OS)

    9. Linux Command Syntax


    ## 10. Special Characters and Escape Character


    ## What Is OS?


    ![](img/87e31443ff747018655a0f4f95ee6187_16_0.png)


    The OS (operating system) is the most critical software on the computer. The OS
    controls hardware and software resources on the computer. The OS provides multitasking
    capabilities to the computer so that users can manage multiple applications simultaneously.
    Here are some key OS functionalities.


    ### Process Management


    Multiple applications are running on the computer simultaneously. The OS can handle
    various jobs of each application and the OS itself. Through the OS, you can launch,
    control, and exit applications.


    ### Device Management


    The OS manages I/O (Input and Output) of the hardware. It receives requests from
    the devices, handles tasks based on the requests, and communicates back to the
    devices.


    ### File Management


    The OS keeps track of information about the creation, deletion, transfer, copy,
    and storage of files in an organized way. It also maintains the integrity of the
    data stored in these files, including the file directory structure.


    ### Security Management


    The OS assures the integrity and confidentiality of user data by protecting the
    computer resources against unauthorized access, detecting and removing computer
    viruses, etc.


    ## CUI and GUI


    | CUI (Character User Interfaces) | GUI (Graphic User Interfaces) |

    | --- | --- |

    | ![CUI Image](image_url1) | ![GUI Image](image_url_2) |

    | Less intuitive | More intuitive |

    | Faster | Slower |

    | Suitable for engineers or programmers | Suitable for regular users |


    Most computer users are familiar with GUIs (**Graphic User Interfaces**) provided
    by the Windows or Mac computer but may not be familiar with CUIs (**Character
    User Interfaces**).


    In the GUI, users mostly use a mouse to select files, directories, or tasks to
    control the operating system supported by the keyboard to make character inputs
    into the OS.


    In the CUI, the mouse doesn''t play a role. All actions by users should be done
    through the keyboard including the selection of files and directories. The **terminal**
    or **command line** in Linux OS and Mac OS or the **command prompt** in Windows
    OS are CUI-based.


    On personal computers, CUI-based systems run on GUI-based systems. For example,
    when you use Terminal in Mac OS or connect to a Linux OS remote server through
    your laptop, you are using a CUI application on your GUI-based system. Thus, you
    can still get some assistance with your mouse from the GUI, but the mouse assistance
    is not supported by the CUI itself.


    Because of its nature, the GUI-based system is more intuitive; however, it consumes
    more computer resources and is slower than the CUI-based system. On the other
    hand, the CUI-based system uses limited computer resources, which means it''s
    faster.


    It may take time to get used to handling a computer on CUI but your work can be
    faster once you master it.


    ## Linux Distributions


    ![](img/87e31443ff747018655a0f4f95ee6187_20_0.png)


    Linux was initially designed by Linus Torvalds for improving Unix OS, and later
    various open-source projects were initiated on the basis of Linux. Unlike Windows
    OS or Mac OS, Linux is not managed by a single organization. There are many organizations
    and programmers managing their versions of Linux called Linux distributions.


    Each distribution includes the Linux kernel (the foundation of the operating system),
    GNU shell utilities (the terminal interface and commands), and a package management
    system. Distributions have many common features; however, there are several differences
    across them.


    There is a history of Linux distribution developments. As each distribution was
    created as a derivative of another distribution, understanding the history is
    useful. If the mother distribution of two derivatives is the same, the commands
    in those derivatives tend to be the same.


    There are two major groups in Linux distributions based on a package manager (see
    the next section to learn more about package managers).


    ### Debian-based


    - Debian: one of the oldest operating systems based on the Linux kernel, first
    released in 1993. The current developer is the Debian project.

    - Ubuntu: a mostly free Debian-based Linux distribution developed in 2004. The
    current main developer is Canonical Ltd.


    ### RPM-based


    RPM was originally called Red Hat Package Manager


    - Red Hat Enterprise Linux (RHEL): a commercial Linux distribution developed by
    American software company Red Hat, first released in 2000.

    - CentOS: a free Linux distribution based on RHEL, first released in 2004. It
    was supported by Red Hat but is currently being developed by the CentOS project.

    - Fedora: RPM-based Linux distribution developed by the Fedora project, released
    in 2003.

    - OpenSUSE: RPM-based Linux distribution developed by the openSUSE project, released
    in 2005.


    ## Package Manager


    - Automate the process of installation, upgrading, configuring, or removing of
    programs

    - Trigger the process with commands (apt, yum, rpm, etc.)


    ![](img/87e31443ff747018655a0f4f95ee6187_22_0.png)


    A package manager is a tool for automating the process of installing, upgrading,
    configuring, or removing programs in a consistent manner.


    ### Role of package managers


    A computer system consists of many sets of software or libraries which are being
    updated regularly. And those sets of software or libraries are dependent on each
    other (a program is referring to another program for its execution).


    In order to keep a computer up-to-date or install necessary tools that are not
    installed on the computer, you need to have properly organized sets of compatible
    software or libraries.


    Managing this process manually is very troublesome due to the complexity of interdependencies
    and the number of programs that need to be handled. Package managers help to solve
    the computer update issue by automating the process.


    ### How do package managers update a computer?


    In the CUI environment, you can use package managers by running their unique commands.
    When you run the commands, the package managers start to communicate with their
    repositories, retrieve updated versions of programs, and install them onto your
    computer. Key commands used to run package managers will be explained later.


    ## Linux OS package managers


    For Linux OS, there are two types of package managers based on distributions -
    Debian-based and RPM-based. The commands used to launch each package manager are
    different. Below are key package manager tools.


    | Category | Distributions | Package Manager Tools (Commands) |

    | --- | --- | --- |

    | Debian-based | Debian, Ubuntu | apt, apt-get, dpkg |

    | RPM-based | RHEL, CentOS, Fedora, OpenSUSE | rpm, yum, dnf |


    > Note Package managers are used in many other programs. For example, homebrew
    is a package manager for Mac OS X, **pip** is for Python and **npm** is for Node.js.

    '
