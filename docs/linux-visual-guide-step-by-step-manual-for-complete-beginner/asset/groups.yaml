    # Practice 1


    Objective:

    Understand how the foreground job works


    # 1. Create a shell script


    First, let''s create a shell script that requires a longer processing time. The
    shell script (loop.sh file) below counts down numbers from 1,000,000.


    Use vim to create a shell script named loop.sh.


    Command Line - INPUT


    ```

    ubuntuip-172-26-0-53:- | mkdir dir_ch8

    ubuntuip-172-26-0-53:- | cd dir_ch8

    ubuntuip-172-26-0-53:- | vim loop.sh

    ```


    Press the i key to switch to the insert mode. Next, copy the code below and paste
    it into the file. After pasting the code, press the esc key followed by the :
    key and save the file by pressing the w + q keys. To learn how to use Vim, check
    Chapter 3. Vim Editor.


    loop.sh


    ```

    #!/bin/bash

    count=5000000

    while [ $count -ge 0 ]

    do

    echo "countdown $count"

    count=$((count - 1))

    done

    ```


