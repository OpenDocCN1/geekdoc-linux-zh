    | root@ip-172-26-0-53:~# | ufw status numbered |


    # 命令行 - 响应


    | 目标 (To) | 动作 (Action) | 源自 (From) |

    | --- | --- | --- |

    | [1] 22 | ALLOW IN | 任何 |

    | [2] 80 | ALLOW IN | 111.65.0.0/16 |

    | [3] 22 (v6) | ALLOW IN | 任何 (v6) |


