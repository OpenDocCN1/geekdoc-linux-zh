    如果没有 SSH 配置文件，你需要指定私钥文件路径、用户名以及远程服务器的 IP 地址。


    ## 命令行 - 输入


    ```

    $ sftp -i ~/.ssh/id_rsa ubuntu@54.169.91.239

    ```


    有了 SSH 配置文件，命令会变得简单得多。只需输入 ssh 加上你在配置文件中的 SSH 主机名（下面的示例使用 `ssh_test` 作为 SSH 主机）。


    ## 命令行 - 输入


    ```

    % sftp ssh_test

    ```


    一旦建立 SFTP 会话，命令行将变为如下所示。


    ## 命令行 - 输入


    ```

    sftp> |

    ```


    ## SFTP 子命令


    在 SFTP 会话期间，你可以运行多个 SFTP 子命令。


    ## 检查和切换目录


    SFTP 提供了子命令来检查和切换远程服务器以及本地计算机下的目录。以下是示例。


    | 操作 | 远程 | 本地 |

    |---|---|---|

    | 检查当前目录路径 | pwd | lpwd |

    | 列出文件和目录 | ls | lls |

    | 切换目录 | cd | lcd |


    ## get 命令 - 从远程服务器下载文件或目录


    一旦你设置了本地计算机和远程服务器的当前工作目录，就可以使用 get 命令从远程服务器下载文件到本地计算机。


    例如，通过运行下面的命令，你将远程服务器当前工作目录下的 `sample.txt` 文件传输到本地计算机的当前工作目录。


    ## 命令行 - 输入


    ```

    sftp> | get sample.txt

    ```


    这是文件传输的插图。


    ![](img/87e31443ff747018655a0f4f95ee6187_297_0.png)


    如果你想下载一个目录，请使用 -r 选项。


    ## 命令行 - 输入


    ```

    sftp> | get -r sample_dir

    ```


    ## put 命令 - 向远程服务器上传文件或目录


    要从本地计算机上传文件或目录到远程服务器，你可以运行 put 命令。


    例如，运行下面的命令，你会将本地计算机当前工作目录下的 `test.txt` 文件传输到远程服务器的当前工作目录。


    ## 命令行 - 输入


    ```

    sftp > | class="code"put test.txt

    ```


    ## exit (bye) 命令 - 停止 SFTP 会话


    要结束会话，运行 exit（或 bye）命令。


    ## 命令行 - 输入


    ```

    sftp > | exit

    ```


    ## help 命令 - 检查 SFTP 子命令


    如果你想了解更多关于 SFTP 子命令的信息，help 命令非常有用。它会提供可可用 SFTP 子命令列表。


    > 注意：SCP 和 SFTP 的区别


    SCP 和 SFTP 的主要区别之一是，SFTP 协议可以恢复因某些原因停止的数据传输，而 SCP 不能恢复。要使用 SFTP 恢复数据传输，请使用 re
    命令。


    例如，如果你想恢复 `sample_dir` 的传输，可以运行下面的命令。


    ## 命令行 - 输入


    ```

    sftp > | reget -r sample_dir

    ```


    ## 其他文件传输命令


    ![](img/87e31443ff747018655a0f4f95ee6187_299_0.png)


    ![](img/87e31443ff747018655a0f4f95ee6187_299_1.png)


    ![](img/87e31443ff747018655a0f4f95ee6187_299_2.png)


    还有其他不使用 ssh 的传输命令。FTP 是经典的文件传输协议和命令。Wget 和 Curl 是使用多种通信协议获取文件的命令，特别是从网站获取文件。


    ## FTP


    FTP（文件传输协议）是一种用于在远程网络和本地之间传输文件的标准网络协议。由于 FTP 流量是不加密的，强烈建议使用 SCP 或 SFTP 进行安全数据传输。在
    Linux 系统上使用 FTP，可以使用 `ftp` 命令。该命令的设计与 `sftp` 命令类似。你可以建立 FTP 会话并使用子命令管理文件传输。


    ## Wget


    wget 是一个用于下载各种互联网协议（包括 HTTP、HTTPS 和 FTP）网页的命令行实用。由于其在下载网页内容方面的实用性，wget 经常用作网络爬虫协议。


    它的命令语法简单。通过运行带有 URL 的 wget 命令，你可以下载网站的 HTML 文件。如果你使用 -p 选项，你还可以下载网站的所有内容，包括图片文件。使用
    -r 选项，你还可以递归下载网站（包括指向网站的链接）。


    ## cURL


    cURL 的意思是 "client for URL"。它是一个通过各种网络协议（包括 HTTP、HTTPS、FTP 和其他互联网协议）传输数据的命令行工具。cURL
    通过指定相关的 URL 和需要发送或接收的数据与 Web 或应用程序服务器通信。与 wget 不同，curl 命令也用于向服务器上传数据。


    ## 第 8 章：进程管理


    本章涵盖了进程管理内容。在本章中，我们将学习进程以及如何管理它们。


    ### 什么是进程？


    进程是执行中的程序。虽然程序是磁盘上的静态文件，但进程是运行在内存中的活动实体。每个进程都有自己的内存空间，包括代码、数据和栈。


    ### 进程状态


    进程在生命周期内可以经历几种状态：


    - 新建 (New)：进程正在创建。

    - 就绪 (Ready)：进程正在等待分配给处理器。

    - 运行 (Running)：进程正在执行。

    - 等待/阻塞 (Waiting/Blocked)：进程等待某些事件（例如 I/O 完成）。

    - 终止 (Terminated)：进程已完成执行。


    ### 在 Linux 中管理进程


    在 Linux 中，有多种工具可以管理进程。最常用的有：


    - `ps`：列出当前运行的进程。

    - `top`：提供运行进程的实时视图。

    - `kill`：向进程发送信号，通常用于终止它。

    - `nice`：设置进程的优先级。

    - `renice`：更改已运行进程的优先级。


    ### 示例


    #### 列出进程


    列出当前用户的所有进程，使用：


    ```

    ps -u username

    ```


    列出系统中运行的所有进程，使用：


    ```

    ps aux

    ```


    #### 终止进程


    要杀死一个进程，你需要它的进程 ID (PID)。你可以使用 `ps` 找到 PID。一旦有了 PID，使用：


    ```

    kill PID

    ```


    要强制停止进程，请使用 -9 标记：


    ```

    kill -9 PID

    ```


    #### 更改优先级


    要以特定优先级启动进程，使用 `nice`：


    ```

    nice -n 10 command

    ```


    要更改运行进程的优先级，使用 `renice`：


    ```

    renice +5 PID

    ```

