    \ the APPLE\n- 10. She likes the ORANGE\n- 11. She likes the GRAPES\n- 12. She\
    \ likes the BANANAS\n\n## Basic grep\n\nTo run grep command, you need to specify\
    \ a search phrase (or pattern) by a file.\n\nFor example, to search \"apple\"\
    \ in sample_1.txt.\n\nCommand Line - INPUT\n\n```\nubuntu $ grep apple sample_1.txt\n\
    ```\n\nCommand Line - RESPONSE\n\n```\n1 I like apples and he likes oranges\n\
    4 I like bananas and she likes apples\n5 He likes apples and she likes oranges\n\
    8 He likes bananas and I like apples\n9 She likes apples and I likes oranges\n\
    ```\n\n## Options\n\nThere are many useful options for grep.\n\n## -r (recursive)\
    \ option\n\nWith the -r option, you can search a string in multiple files under\
    \ a specified directory.\n\nFor example, to search \"He\" in the directory, run\
