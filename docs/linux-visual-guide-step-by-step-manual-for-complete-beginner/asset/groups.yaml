    root # | touch file_a

    ```


    By running the commands above, you can create the following directory

    tree under the user_a''s home directory.


    ```

    user_a

    | dir_a1

    ```


    ```

    dir_a2

    dir_b1

    dir_b2

    file_a

    ```


    ```


    # Check owner statuses


    As the directories and the file are created by the superuser, the owner and owner
    group of the directories and the file are set as root.


    ## Command Line - INPUT


    ```

    root:/home/user_a# | ls -l

    ```


    ## Command Line - RESPONSE


    | | | | size | date | time | name |

    |---|---|---|---|---|---|---|

    | drwxr-xr-x | 3 | root | 4096 | Jan 2 | 15:31 | dir_a1 |

