- md: '

    # rm (Remove File)


    [xx] argument


    # rm [file path]


    | -r (recursive) option |

    | delete a directory with contents (directories and files) |

    | You cannot delete directories without the w (write) permission even if you are
    using the -r option. |


    ![](img/87e31443ff747018655a0f4f95ee6187_65_0.png)


    The rm (ReMove) command is used for deleting files. It is also used for deleting
    directories with the -r (recursive) option.


    # Delete an existing file


    Simply run the command with an existing file path. For example, to delete file_a
    under your working directory, run the command below.


    Command Line - INPUT


    ```

    ubuntu $ rm file_a

    ```


    # -r (recursive) option


    The -r (recursive) option is used to delete an existing directory with contents
    (directories or files). As the rmdir command cannot be used for a directory with
    files, this command is useful to remove a directory with files underneath.


    If you want to delete *dir_a* under your working directory, run the command below.


    # Command Line - INPUT


    ```

    ubuntu $ rm -r dir_a

    ```


    > IMPORTANT


    Files or directories deleted by the `rm` command won''t be recovered. This is
    different from the case where you put your files into the Trash Bin on Mac or
    Recycle Bin on Windows. (More precisely, there is a way to recover the deleted
    files or directories but it may not be successful. It is better to be careful
    before deleting any critical files with the `rm` command.)


    # mv (Move File and Directory)


    ```

    [xx] argument

    mv [file or directory path] [destination path]

    ```


    Change existing file or directory name

    mv command is also used to change file or directory name.


    ![](img/87e31443ff747018655a0f4f95ee6187_67_0.png)


    > Note: Changing the file name (or directory name) is applicable only when there
    is no directory whose name is the same as the intended new file name. If such
    directory exists, the mv command moves the file (or directory) under it without
    changing the file''s (directory''s) name.


    Move a file or directory


    The mv (Move) command is used to move a file or directory to another path.


    # Move a file or directory


    There are two key arguments in the mv command.


    - 1st argument: file or directory path

    - 2nd argument: destination directory path (existing directory path)


    For example, if you want to move file_a under your working directory to dir_a
    under your working directory, run the command below.


    Command Line - INPUT


    ```

    ubuntu $ mv file_a dir_a

    ```


    # Change the file or directory name


    You can also use the `mv` command, to change an existing file or directory name
    to a new name. The syntax structure is the same as the one to move a file or directory.
    The key difference is that the 2nd argument should be a name that you want to
    use for the file or directory.


    For example, if you run the same command as in the previous example when there
    is no `dir_a` directory, the file name of `file_a` becomes `dir_a`.


    # Moving a file or changing a file name


    Depending on the directory situation, the same command can create different results.


    When there is no directory whose name is the same as the intended new file name,
    the `mv` command changes the file name as illustrated below.


    ![](img/87e31443ff747018655a0f4f95ee6187_68_0.png)


    When there is a directory whose name is the same as the intended new file name,
    the `mv` command moves the file to the directory as illustrated below.


    ![](img/87e31443ff747018655a0f4f95ee6187_69_0.png)


    # cp (Copy File and Directory)


    ![](img/87e31443ff747018655a0f4f95ee6187_70_0.png)


    The cp (CoPy) command is used to copy a file or directory. You can specify the
    destination directory to create a copy of the file or directory. You can also
    use the -r option to create a copy of a directory.


    # Copy a file with the same name


    There are two key arguments in the cp command.


    - 1st argument: source file path

    - 2nd argument: destination directory path (existing directory path)


    For example, if you want to make a copy of file_a under your working directory
    to dir_a under your working directory, run the command below.


    Command Line - INPUT


    ```

    ubuntu $ cp file_a dir_a

    ```


    # Copy a file with a different name


    To make a copy with a new name, you can add the new file name in the 2nd argument
    after the directory path.


    For example, if you want to make a copy of file_a with a new name file_a_cp to
    dir_a, run the command below.


    Command Line - INPUT


    ```

    ubuntu $ cp file_a dir_a/file_a_cp

    ```


    # Copy a directory


    To make a copy of a directory, use the -r option.


    For example, if you want to make a copy of dir_a located under dir_b with a new
    name dir_a_cp, run the command below.


    Command Line - INPUT


    ```

    ubuntu $ cp -r dir_a dir_b/dir_a_cp

    ```


    # cat (Display File Content)


    ![](img/87e31443ff747018655a0f4f95ee6187_72_0.png)


    The cat (conatenate) command is used to display the contents of a file without
    opening it. The command can be used to create a new file with redirection of standard
    output (->). To know more about redirection of standard output, check Chapter
    5 Standard Input Output and Redirection.


    # Display the content of a file


    To display the content of a file, use the file path as an argument of the cat
    command.


    For example, if you want to display the content of file_a under your working directory,
    run the command below.


    Command Line - INPUT


    ```

    ubuntu $ cat file_a

    ```


    # Command Line - RESPONSE


    ```

    file_a content

    ```


    # Create and edit a file with the cat command


    Before explaining how to create or edit a file with the `cat` command, let''s
    check how the `cat` command works without any argument.


    When running the `cat` command without any argument, the cursor moves to the beginning
    of the line below and the command line waits for your input. After typing some
    words and hitting the enter key...


    # Command Line - INTERACTIVE


    ```

    ubuntu $ cat

    test test

    ```


    ... you''ll see that the command line returns the same text as the one you typed.


    # Command Line - INTERACTIVE


    ```

    ubuntu $ cat

    test test

    test test

    ```


    You stay in the typing mode until you quit it by pressing `Ctrl` + `C` or `Ctrl`
    + `D`


    # Redirecting standard output


    You can redirect the output to a new file or an existing file.


    There are differences between `>` and `>>`.


    > : overwrite contents


    >> : add contents


    Note: Redirection and standard output will be explained in Chapter 5.

