    | systemctl enable [unit name] | |

    | systemctl disable [unit name] | |


    Systemctl 是一个命令行工具，用于监控和控制 systemd 以及单元。它有多个子命令，用于显示单元文件和激活单元的状态，或控制和监控特定单元。


    ## 控制特定单元的命令


    有子命令用于控制特定单元（或单元文件）。如果你没有以超级用户身份登录，请在命令前添加 sudo 前缀。


    ## systemctl start [unit name]


    当你想要启动一个名为 unit_a.service 的单元时，使用此命令。


    ## systemctl stop [unit name]


    当你想要停止一个名为 unit_a.service 的单元时，使用此命令。


    ```bash

    sudo systemctl stop unit_a

    ```


    ## systemctl restart [unit name]


    当你想要重启一个名为 unit_a.service 的单元时，使用此命令。


    ```bash

    sudo systemctl restart unit_a

    ```


    ## systemctl reload [unit name]


    当你想要重载一个名为 unit_a.service 的单元时，使用此命令。


    ```bash

    sudo systemctl reload unit_a

    ```


    ## systemctl enable [unit name]


    当你想要启用一个名为 unit_a.service 的单元时，使用此命令。


    ```bash

    sudo systemctl enable unit_a

    ```


    ## systemctl disable [unit name]


    当你想要禁用一个名为 unit_a.service 的单元时，使用此命令。


    ```bash

    sudo systemctl disable unit_a

    ```


    ## systemctl status [unit name]


    当你想要查看一个名为 unit_a.service 的单元的状态时，使用此命令。


    ```bash

    systemctl status unit_a

    ```


