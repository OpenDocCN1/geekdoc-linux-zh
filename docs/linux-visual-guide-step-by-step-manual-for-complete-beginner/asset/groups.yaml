    # Setting Up Linux Environment on AWS


    ![](img/87e31443ff747018655a0f4f95ee6187_43_0.png)


    Nowadays, **Cloud Computing** is very popular. Previously, to experience Linux
    OS, you needed to install Linux OS on your computer; however, it became easier
    to set up the Linux environment on **public cloud infrastructure** or **VPS**
    (Virtual Private Server). Throughout this course, we''ll be using Ubuntu OS on
    AWS Lightsail service to demonstrate Linux operations. AWS Lightsail is a VPS
    to setup. AWS Lightsail is a light version of AWS EC2. Without detailed configuration,
    you can set up the Linux OS environment very quickly. As AWS Lightsail offers
    the first three months free, you can use Linux OS at no additional cost.


    Here are the key steps to set up the Linux OS environment on AWS Lightsail.


    # Set up an AWS account


    If you don''t have an AWS account, create it first. It only takes a few minutes.


    # Go to the AWS website (https://aws.amazon.com/).


    ![](img/87e31443ff747018655a0f4f95ee6187_44_0.png)


    # Click on the orange Sign In to the Console button.


    ![](img/87e31443ff747018655a0f4f95ee6187_44_1.png)


    # Fill in the following information and verify your email address


    - Root user email address

    - AWS account name


    By following the instructions, you can create an AWS account. The remaining steps
    are listed below.


    - Create your password

    - Add your contact information

    - Add a payment method

    - Verify your phone number

    - Choose an AWS plan


    # Start using Lightsail


    When you log in to your AWS account, start at AWS Console Home. Select Services
    on the left and click on Compute. You can find Lightsail in the menu. Click on
    Lightsail to go to Lightsail Home.


    On Lightsail Home, press the Create Instance button.


    ![](img/87e31443ff747018655a0f4f95ee6187_46_0.png)


    Select Linux/Unix as platform and select Ubuntu (20.04 LTS) under OS selection.


    ![](img/87e31443ff747018655a0f4f95ee6187_47_0.png)


    Scroll down to choose an instance plan. Select one of the free plans. Higher plans
    provide better machine specs. To create an instance, click on **Create instance**
    at the bottom.


