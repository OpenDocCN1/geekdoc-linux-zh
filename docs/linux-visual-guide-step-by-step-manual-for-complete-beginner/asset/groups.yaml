    ## usermod (修改用户信息)


    [xx] 参数


    ```

    usermod [option] [option argument] [user name]

    ```


    | 主组 | usermod -g [Primary Group ID] [user] |

    | :--- | :--- |

    | 附加组 | usermod -aG [Secondary Group ID] [user] |

    | 用户 ID | usermod -u [User ID] [user] |

    | 用户注释 | usermod -c ["用户注释" ] [user] |

    | 主目录 | usermod -d [directory path] [user] |


    **usermod (USER MODify)** 命令用于修改用户配置文件。用户配置包括主组、附加组、用户 ID、用户注释和主目录路径等。


    ## 检查用户状态


    当你更改用户配置文件时，需要检查其状态。`/etc/passwd` 文件包含了大多数用户信息数据，但它不包含用户所属的附加组。为了获得全面的视图，你需要运行
    `groups` 或 `id` 命令，或者检查 `/etc/group` 文件。


    ## 1. 检查 /etc/passwd 信息


    有几种方法可以检查 `/etc/passwd` 文件。


    - grep [user name] /etc/passwd

    - getent passwd [user name]

    - cat /etc/passwd


    由于 `cat` 命令显示文档中包含的所有数据，因此 `grep` 或 `getent` 命令更高效。


    例如，要检查 user_a 的用户信息，你可以运行下面的任意命令之一。


    ### 命令行 - 输入


    ```

    ubuntu $ | grep user_a /etc/passwd

    ```


    或者


    ```

    ubuntu $ | getent passwd user_a

    ```


    你将得到下所示的信息。


    ### 命令行 - 响应


    ```

    user_a:x:1001:1001::/home/user_a:/bin/sh

    ```


    此结果显示了如下：


    - 用户 ID: 1001

    - 主组 ID: 1001

    - 用户注释: n/a

    - 主目录路径: /home/user_a

    - 默认 Shell: /bin/sh


    ## 2. 检查组信息


    有几种方法可以检查用户所属的所有组。


    - groups [user name]

    - id [user name]

    - 通过 grep, getent 或 cat 命令检查 /etc/group 文件


    运行 `groups` 或 `id` 命令是获取必要信息的更快方法。


    例如，要检查 user_a 的组信息，你可以运行如下所示的 `groups` 命令。


    ### 命令行 - 输入


    ```

    ubuntu $ | groups user_a

    ```


    ### 命令行 - 响应


    ```

    user_a : user_a

    ```


    此结果显示 user_a 仅属于其私有组。


    ## 修改用户主组 (-g 参数)


    要更改用户的主组，请以管理员身份运行 `usermod -g [group ID 或名称][user name]`。例如，要将 user_a 的主组改为 group_a，请运行下面的命令。


    ### 命令行 - 输入


    ```

    $ sudo su -

    ```


    ```

    root # | usermod -g group_a user_a

    ```


    要检查主组状态，请运行下面的命令。


    ### 命令行 - 输入


    ```

    root # | grep user_a /etc/passwd

    ```


    你可以看到主组 ID 变成了 1003，这正是 group_a 的组 ID。


    ### 命令行 - 响应


    ```

    user_a:x:1003::/home/user_a:/bin/sh

    ```


    ## 添加到附加组 (-aG 参数)


    要添加新组，请以超级用户身份运行 `usermod -aG [group ID 或名称] [user name]`。例如，要将 sudo 组添加到 user_a
    的附加组，请运行下面的命令。


    ### 命令行 - 输入


    ```

    root # | usermod -ag sudo user_a

    ```


    要检查组状态，请运行 `groups` 命令。


    ### 命令行 - 输入


    ```

    root # | groups user_a

    ```


    你可以看到 sudo 组已添加到 user_a 的附加组中。


    ### 命令行 - 响应


    ```

    user_a : group_a_sudo

    ```


    ![](img/87e31443ff747018655a0f4f95ee6187_165_0.png)


    > 注意

    如果你只使用 -G 参数，它将覆盖现有的组设置。这意味着你可能会误删现有的设置并进行覆盖。除非你想列出用户所有的组，否则请使用 aG 参数。要在 -G 参数中列出所有组，你可以用逗号（,）连接组名，如下所示。


    ### 命令行 - 输入


    ```

    root # | usermod -G group_a,group_b,group_c user_a

    ```


    通过运行 `groups` 命令，你可以看到 group_a、group_b 和 group_c 已添加，而 sudo 组被移除。


    ### 命令行 - 输入


    ```

    root # | groups user_a

    ```


    ### 命令行 - 响应


    ```

    user_a : group_a group_b group_c

    ```


    ## 修改用户 ID (-u 参数)


    要更改用户 ID，请以超级用户身份运行 `usermod -u [user ID] [user name]` 命令。例如，要将 user_a 的用户 ID
    更改为 2001，请运行下面的命令。


    ### 命令行 - 输入


    ```

    root # usermod -u 2001 user_a

    ```


    要检查 user_a 的用户 ID，请检查 `/etc/passwd` 文件。你可以看到用户 ID 已变为 2001。


    ### 命令行 - 输入


    ```

    root # | grep user_a /etc/passwd

    ```


    ### 命令行 - 响应


    ```

    user_a:x:2001:1003::/home/user_a:/bin/sh

    ```


    ## 修改用户注释 (-c 参数)


    要更改用户注释，请以超级用户身份运行 `usermod -c "Comment" [User name]` 命令。例如，要将 user_a 的注释改为“comment
    for user_a”，请运行下面的命令。


    ### 命令行 - 输入


    ```

    root # | usermod -c "comment for user_a" user_a

    ```


    要检查 user_a 的用户注释，请检查 `/etc/passwd` 文件。你可以看到新注释已添加到文件中。


    ### 命令行 - 输入


    ```

    root # | grep user_a /etc/passwd

    ```


    ### 命令行 - 响应


    ```

    user_a:x:2001:1002:comment for user_a:/home/user_a:/bin/sh

    ```


    注：注释通常用于用户的全名或其他与用户相关的信息。


    ## 修改用户主目录 (-d 参数)


    要更改用户的主目录，请以超级用户身份运行 `usermod -d [directory path] [user name]` 命令。例如，要将 user_a
    的主目录改为 /home/normal_user/user_a，请运行下面的命令。


    ### 命令行 - 输入


    ```

    root # | mkdir -p /home/normal_user/user_a

    root # | usermod -d /home/normal_user/user_a user_a

    ```


    要检查 user_a 的主目录路径，请切换到 user_a 并运行命令。


    ### 命令行 - 输入


    ```

    root # | cd user_a

    root # | pwd

    ```


    ```

    /home/normal_user/user_a

    ```


