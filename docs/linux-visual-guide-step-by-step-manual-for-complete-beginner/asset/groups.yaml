    # # Pipe syntax


    Using pipes is simple - you just need to connect two commands with the pipe symbol
    "|—" or "| ".


    To demonstrate how the pipe works with a simple example, combine the `ls` command
    and the `grep` command to display a list of directories under /(root) that contain
    a certain character in their name.


    First, run the `ls` command without the pipe to see the difference.


