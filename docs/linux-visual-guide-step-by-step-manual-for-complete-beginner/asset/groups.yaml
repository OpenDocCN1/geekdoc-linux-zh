    # Chapter 4

    User, Group and Permission


    This chapter covers how to manage users, groups, and permissions on Linux.


    The following topics are covered in this chapter.


    ### TOPICS


    1. What Are User, Group And Permission in Linux?

    2. Permission (Access Mode) by Owner Status

    3. Superuser (Root User) vs. Normal User

    4. sudo (Run Command with Superuser Privileges)

    5. su (Switch User)

    6. useradd (Add User)

    7. passwd (Set Password)

    8. userdel (Delete User)

    9. Group - Primary Group and Secondary Group

    10. groupadd (Add Group)

    11. usermod (Modify User Account Information)

    12. gpasswd (Add and Delete Users to Group)

    13. groupdel (Delete Group)

    14. chown (Change Owner of File and Directory)

    15. chgrp (Change Group of File and Directory)

    16. chmod (Change Access Mode)

    17. chmod Command with Numbers

    18. w and who (Check Current User Login Status)

    19. id and groups (Check User ID and Group)

    20. getent (Display User and Group Data)


    # What Are User, Group And Permission in Linux?


    ![](img/87e31443ff747018655a0f4f95ee6187_127_0.png)


    - All files and directories have permission settings (access modes) by user status

    - Superuser (root) has permissions for all files and directories


    # Superuser (root user) vs. Normal user


    In Linux, there are two types of users - a **superuser** and a **normal user**.
    The superuser is a special user account used for system administration. The superuser
    has permissions for all Linux system resources while normal users have limited
    access to Linux system resources depending on the permission setting for each
    file and directory.


    # File and Directory owner


    Each file or directory has an owner. Generally, the user who created the file
    or directory is the owner of the file or directory.


    # Group


    In Linux, you can manage users by group. File and directory permissions can be
    more efficient when users are registered in a group. There are two types of groups
    - **primary group** and **secondary group**. The primary group is used when a
    new file is created.


    # Owner Status


    There are three owner statuses of a file or directory.


    1. **Owner (of the file or directory)**: generally, the user who created the file
    or directory is the owner. You can change the owner by running the `chown` command.

    2. **Owner group**: generally, the owner''s primary group becomes the owner group
    of the file or directory. You can change the owner group by running the `chgrp`
    command.

    3. **Others**: users who are not in the owner group of the file or directory.


    # Permission (Access Mode)


    Depending on the owner status of a file or directory, the accessibility of the
    file or directory can be different. This is called **permission** or **access
    mode**. When you run the `ls` command with the `-l` option, you can see the access
    mode by user status.


    ```

    drwxr-xr-x 3 usr_a staff 4096 Jul 16 2020 media

    -drwxr-xr-x 15 usr_b staff 3180 Dec 21 12:53 sample.txt

    ```


    # Permission (Access Mode) by Owner Status


    ```

    drw-r-x 3 usr_a staff 4096 Jul 16 2020 media

    ```


    ![](img/87e31443ff747018655a0f4f95ee6187_129_0.png)


    The ls -l command gives you the access mode information of a directory or file.
    Here are the key points of how to read the information.


    # Three User Types


    Based on the three owner statuses, the access mode is different for each one.
    By running the ls -l command, you''ll see 9 characters defining the access mode.


    - The first three letters: owner''s access mode

    - Next three letters: owner group''s access mode

    - The last three letters: others'' access mode


    # Read (r), Write (w) and Execute (x) permissions


    There are three types of permissions (access modes). Read (r), Write (w) and Execute
    (x). The meaning of permissions is slightly different for files and directories.


    For files,


    - Read (r) : Be able to read the file

    - Write (w) : Be able to edit the file

    - Execute (x) : Be able to run the command defined in the file


    For directories,


    - Read (r) : Be able to list file and directory names under the directory (read
    the contents of the directory)

    - Write (w) : Be able to create and remove files, and change the name of files
    in the directory

    - Execute (x) : Be able to set the directory as the current working directory
    (CWD)

