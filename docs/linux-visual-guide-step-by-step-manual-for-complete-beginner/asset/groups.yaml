  raw:
  - '[PAGE 140]


    # su (Switch User)


    ![](img/87e31443ff747018655a0f4f95ee6187_140_0.png)


    su [user name]

    Temporarily switch to another user


    Normal User A -> Normal User B


    +   * -* option

    * change user environment (e.g., user''s home directory) when switching to another
    user

    * exit

    * switch back to the original user


    sudo su

    Temporarily switch to the superuser


    Normal User A -> superuser


    ![](img/87e31443ff747018655a0f4f95ee6187_140_1.png)


    The su command is used to switch to another user temporarily. You can also switch
    to the superuser. Switching to the superuser is useful especially when you set
    up a new server which requires several new settings such as adding new users,
    passwords, groups, and several other system configurations.


    # Switch to another normal user : su [user name]


    When you specify the username when you run the command, you can switch to the
    user. You need to add a user before switching to the user, which will be explained
    later.


    # Switch to the superuser : sudo su'
  - '[PAGE 141]


    When you run the `su` command without any username, you can switch to the superuser.
    As the normal user usually doesn''t have the privilege to switch to the superuser,
    you need to add the "sudo" prefix when you run the `su` command.


    # Change user environment: " - - " option


    By adding the `- -` option, you can also change the user environment. For example,
    when you switch to the superuser with the `-` option, your command line''s current
    working directory changes to `/root` (root user''s home directory).


    # Switch back to the original user : exit


    To switch back to the original user, you can run the `exit` command. If you run
    the `su` command multiple times, you need to run the `exit` command the same number
    of times to go back to the original user.


    ![](img/87e31443ff747018655a0f4f95ee6187_141_0.png)'
  - '[PAGE 142]


    You can see that the username changed to root and $ changed to #. Also, you can
    see that the displayed path of the current directory shown before # has changed
    although the current directory position hasn''t. This is because your home directory
    has changed.


    # Command Line - INPUT


    ```

    root:/home/ubuntu/dir_a# | |

    ```


    To check the status, go to the home directory by running the cd ~ command.


    # Command Line - INPUT


    ```

    root:/home/ubuntu/dir_a# | cd ~

    ```


    ```

    root:~# | |

    ```


    Check the current working directory with the pwd command. You can see that the
    home directory becomes /root (but not on ubuntu anymore).


    # Command Line - INPUT


    ```

    root:~# | pwd

    ```


    # Command Line - RESPONSE


    ```

    /root

    ```


    # 2. sudo su -


    First, exit from the sudo status by running the exit command. You''ll see that
    the user has switched back to ubuntu and the current working directory has moved
    back to its original position.


    # Command Line - INPUT


    ```

    root:~# | exit

    ```'
  - '[PAGE 143]


    ```

    ubuntu:~/dir_a$ |

    ```


    Run the `sudo su` command with the `-` option. You can see that the user has switched
    to `root` and the current working directory has changed to the new home directory.


    # Command Line - INPUT


    ```

    ubuntu:~/dir_a$ | sudo su -

    ```


    ```

    root:~# |

    ```


    Run the `pwd` command. You can confirm that the home directory has changed to
    `/root`.


    # Command Line - INPUT


    ```

    root:~# | pwd

    ```


    # Command Line - RESPONSE


    ```

    /root

    ```'
  - '[PAGE 144]


    # useradd (Add User)


    [xx] argument


    ```

    useradd -m [user name]

    ```


    ![](img/87e31443ff747018655a0f4f95ee6187_144_0.png)


    The useradd command is used to create a new user. Usually, the useradd command
    comes with the -m option, which can create the home directory for the new user
    under the path of /home with the user name. To run this command, you need to run
    it with superuser privileges.


    # Create a new user with its home directory


    Adding a user is a privilege of the superuser. When you run the command, you need
    to run it as root or with the sudo command. If you run the command as a normal
    user without sudo, you''ll see a permission error like the one below.


    Command Line - INPUT


    ```

    ubuntu~$ useradd user_a

    ```


    Command Line - RESPONSE'
  - '[PAGE 145]


    ```

    useradd: Permission denied.

    useradd: cannot lock /etc/passwd; try again later.

    ```


    To create a new user, switch to the superuser and run the useradd command. Use
    the -m option to create the home directory for the new user.


    # Command Line - INPUT


    ```

    ubuntu:~$ | sudo su -

    ```


    ```

    root:/# | useradd -m user_a

    ```


    # Check the user data


    The user is recorded under the /etc/passwd file. To check the file, run the following
    command.


    # Command Line - INPUT


    ```

    root:/# | cat /etc/passwd

    ```


    You can see that a new user is added at the bottom of the file.


    # Command Line - RESPONSE


    ```

    root:x:0:0:root:/root:/bin/bash

    daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin

    :

    systemd-coredump:x:999:999:systemd Core

    Dumper:/x:/usr/sbin/nologin

    ubuntu:x:1000:1000:Ubuntu:/home/ubuntu:/bin/bash

    lxd:x:999:100::/var/lib/common/lxd:/bin/false

    user_a:x:1001:1001::/home/user_a:/bin/sh

    ```


    In this file, the following information is covered (left to right):


    +   1. user name

    2. user password (x) (actual encrypted user passwords are saved in a different
    file named /etc/shadow)

    3. user ID'
  - '[PAGE 146]


    +   4. primary group ID

    5. user comment or full name (it''s blank in the example above)

    6. user''s home directory

    7. login shell


    You can also use the grep command to see only the necessary part of the user data.
    For example, what we need to know is the user data which has a string with "user"
    in it. Run the following command to get the data.


    # Command Line - INPUT


    ```

    root:/| grep user /etc/passwd

    ```


    You''ll get the result like the one below.


    # Command Line - RESPONSE


    ```

    user_a:x:1001:1001::/home/user_a:/bin/sh

    ```


    # Options


    There are several options for the useradd command. You can use these options to
    customize user data.


    +   -u: specify user ID

    -g: specify primary group ID

    -c: specify user''s comment

    -s: specify login shell

    -d: specify home directory path


    > Practice (1): Create new users


    For purposes, let''s create three users: user_a, user_b, and user_c. First, switch
    to the superuser.


    Command Line - INPUT'
  - '[PAGE 147]


    ```

    ubuntu~$ | sudo su

    ```


    Run the useradd commands three times.


    # Command Line - INPUT


    ```

    root:/home/ubuntu# | useradd -m user_a

    root:/home/ubuntu# | useradd -m user_b

    root:/home/ubuntu# | useradd -m user_c

    ```


    Check the user data with the grep command.


    # Command Line - INPUT


