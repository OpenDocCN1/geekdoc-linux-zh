    is usually controlled by the **iptables** commands. Using iptables, you can manage
    Netfilter in a flexible way; however, iptables are not easy to use. **UFW** (Uncomplicated
    Firewall) is a frontend program for iptables that provides an easy-to-use user
    interface for people who are not familiar with firewall concepts.


    # ## Overview of UFW


    There are six types of `ufw` commands.


    +   1. Check UFW Status

    2. Enable and Disable UFW'
  - '[PAGE 352]


    +   3. Default Policy Setting

    4. Allow or Deny Ports

    5. Allow or Deny IP Addresses

    6. Delete Policies


    To run ufw commands, you need the superuser privilege. For better operational
    efficiency, switch to the superuser for this section.


    # Command Line - INPUT


    ```

    ubuntu@ip-172-26-0-53:~# | sudo su -

    ```


    # 1. Check UFW Status


    As a default setting, UFW is not enabled yet, although the ufw.service daemon
    process may already be running. Check UFW status by running the ufw status command.


    # Command Line - INPUT


    ```

    root@ip-172-26-0-53:~# | ufw status

    ```


    # Command Line - RESPONSE


    ```

    Status: inactive

    ```


    # 2. Enable and Disable UFW


    To enable UFW, use the ufw enable command. There will be an alert about ssh connection.


    # Command Line - INPUT


    ```

    root@ip-172-26-0-53:~# | ufw enable

    ```


    # Command Line - RESPONSE


    ```

    Command may disrupt existing ssh connections. Proceed with operation (y|n)? y

    Firewall is active and enabled on system startup

    ```'
  - '[PAGE 353]


    # IMPORTANT


    As VPS or servers on the cloud are usually managed through SSH, you need to carefully
    manage the settings. The existing SSH session can be continued; however, as soon
    as the session ends, the firewall setting will be applied and there is a risk
    that you will not be able to connect to the server anymore.


    To avoid this risk, you need to allow SSH port 22 as soon as you enable UFW.


    Once UFW is enabled, you can check its status. Check the status using the ufw
    status verbose command time. This command will give you a more detailed status,
    including default policy status, which will be explained in the next section.


    # Command Line - INPUT


    ```

    root@ip-172-26-0-53:~ | ufw status verbose

    ```


    # Command Line - RESPONSE


    Status: active

    Logging: on (low)

    Default: deny (incoming), allow (outgoing), disabled (routed)

    New profiles: skip


    If you want to disable UFW, run the ufw disable command like shown below.


    # Command Line - INPUT


    ```

    root@ip-172-26-0-53:~ | ufw disable

    ```


    # Command Line - RESPONSE


    Firewall stopped and disabled on system startup


    # 3. Default Policy Setting'
  - '[PAGE 354]


    The default policy is applied to all ports. As an initial setting, the incoming
    firewall policy is set as `deny`. This means all traffic to this server is denied
    regardless of ports. On the other hand, the outgoing traffic initial firewall
    policy is `allow`, which means outgoing traffic is allowed regardless of the ports.


    The default setting can be updated using the `ufw default` command. If you want
    to change the default policy to `allow`, run the command below.


    # Command Line - INPUT


    ```

    root@ip-172-26-0-53:~# | ufw default allow

    ```


    # Command Line - RESPONSE


    > Default incoming policy changed to ''allow''

    (be sure to update your rules accordingly)


    If you want to switch back to `deny`, run the command below.


    # Command Line - INPUT


    ```

    root@ip-172-26-0-53:~# | ufw default deny

    ```


    # Command Line - RESPONSE


    > Default incoming policy changed to ''deny''

    (be sure to update your rules accordingly)


    # 4. Allow or Deny Ports


    If the default is `deny`, you can list up ports (whitelist) using the `ufw allow`
    command. For example, if you want to `allow` port 22 for ssh, run the command
    below.


    # Command Line - INPUT


    ```

    root@ip-172-26-0-53:~# | ufw allow 22

    ```


    # Command Line - RESPONSE


    > Rules updated

    Rules updated (v6)


    You can also use a protocol name like `ssh` as an argument.'
