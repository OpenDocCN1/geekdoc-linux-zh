    There are characters with special meanings assigned by Linux OS called **special
    characters**. You cannot use the characters in a file name or normal text sentence.
    If you want to use them without having a special meaning in a sentence, you need
    to use an **escape character**.


    In bash, **\backslash** is used as an escape character.


    For example, if you want to display the following sentence with the echo command,
    you may have difficulty showing "" (double quotes).


    He said "I''m learning Linux OS".


