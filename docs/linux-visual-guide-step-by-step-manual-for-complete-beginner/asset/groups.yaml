    ## Regular Expression


    ![](img/87e31443ff747018655a0f4f95ee6187_88_0.png)


    | Meta-Character | description |

    | :--- | :--- |

    | ^ | begin with |

    | $ | end with |

    | [ | matches anything contained |

    | ] | matches anything NOT contained |

    | ^ | matches any character |

    | * | character(s) specified before * or no occurrence |


    **Regular Expression** is widely used in many programming languages. It is also
    called **regex** or **regexp**. Basically, it defines the pattern of strings with
    meta characters to effectively identify specific data in a data set.


    The **grep** command uses **regex** to specify a search string pattern. In this
    section, we''ll explain selected meta characters using the `grep` command. We
    use the same data set used in the previous section to show some examples.


    ## ^ : begin with


    - - defines data that begins with a specified string after ^. For example, to
    search the lines that begin with "I like a" in the data set prepared in the previous
    section, run the following command.


    **Command Line - INPUT**


    ```

    ubuntu $ | grep -r ^"I like a" test

    ```


    The command returns a line like the one below. The result doesn''t include the
    lines with "I like a" in the middle of the sentence.


    ## Command Line - RESPONSE


    ```

    test/sample_1.txt:I like apples and he likes oranges

    ```


    ## $ end with


    defines data that ends with a specified string before $. For example, to search
    the lines that end with "s bananas" in the data set prepared in the previous section,
    run the following command.


    ## Command Line - INPUT


    ```

    ubuntu $ | grep -r "s bananas" test

    ```


    The command returns a result like the one below. The result doesn''t include the
    lines with "s bananas" in the middle of the sentence.


    ## Command Line - RESPONSE


    ```

    test/sample_1.txt:I like grapes and he likes bananas

    test/sample_1.txt:He likes grapes and she likes bananas

    ```


    ## [] matches anything contained


    - - defines one character that matches anything contained within the bracket.
    For example,


    - [A-Z] : any uppercase alphabet character

    - [a-z] : any lowercase alphabet character

    - [0-9] : any single digit number


    For the data set prepared in the previous section, run the command below to see
    how [] works.


    ## Command Line - INPUT


    ```

    ubuntu $ | grep -r [AE]S test

    ```


    The command returns a result like the one below. The result includes the lines
    with AS or ES.


    ## Command Line - RESPONSE


    ```

    test/test_sub/sample_2.txt:I like the GRAPES

    test/test_sub/sample_2.txt:I like the BANANAS

    test/test_sub/sample_2.txt:He likes the GRAPES

    test/test_sub/sample_2.txt:He likes the BANANAS

    test/test_sub/sample_2.txt:She likes the GRAPES

    test/test_sub/sample_2.txt:She likes the BANANAS

    ```


    ## [] : matches anything NOT contained


    [^] defines any character that matches NOT contained in the bracket. For example,
    to search the lines with "es" but excluding "kes", "ges" and "pes", run the following
    command.


    ## Command Line - INPUT


    ```

    ubuntu $ | grep -r [^kg]es test

    ```


    The result will be like the one below.


    ## Command Line - RESPONSE


    ```

    test/sample_1.txt:I likes apples and he likes oranges

    test/sample_1.txt:I likes bananas and she likes apples

    test/sample_1.txt:He likes apples and she likes oranges

    test/sample_1.txt:He likes bananas and I like apples

    test/sample_1.txt:She likes apples and I likes oranges

    test/sample_1.txt:She likes bananas and he likes apples

    ```


    ## . : matches any one character


    (dot) defines any character. Run the following command to search the lines with
    a string of five characters that begin with "l" and end with "a".


    ## Command Line - INPUT


    ```

    ubuntu $ | grep -r l1...a test

    ```


    The result will be like the one below.


    ## Command Line - RESPONSE


    ```

    test/sample_1.txt:I like app.es and he likes oranges

    test/sample_1.txt:He likes app.es and she likes oranges

    test/sample_1.txt:She likes apples and I likes oranges

    ```


    - * (asterisk) matches any character(s) or no occurrence


    - (asterisk) defines character(s) specified before * or no occurrence. example,
    AP*D means AND, APPD, APPPD, or AD.


    To see how * works in the data set prepared, run the following command.


    ## Command Line - INPUT


    ```

    ubuntu $ | grep -r AP*L*E test

    ```


    The command searches for a string that matches all the criteria below


    - * begins with A

    - ends with E

    - P, L, or no character between A and E


    The result will be like the one below.


    ## Command Line - RESPONSE


    ```

    test/test_sub/sample_2.txt:I like the APPLE

    test/test_sub/sample_2.txt:I like the GRAPES

    test/test_sub/sample_2.txt:He likes the APPLE

    test/test_sub/sample_2.txt:He likes the GRAPES

    test/test_sub/sample_2.txt:She likes the APPLE

    test/test_sub/sample_2.txt:She likes the GRAPES

    ```


    ![](img/87e31443ff747018655a0f4f95ee6187_91_0.png)


    The meaning of * (asterisk) is different in a regular expression and a wildcard.
    In a wildcard, * means any character(s). In a regular expression, * has a relation
    with the character before it. For example, A* means A, AA, AAA, or no occurrence.


    ## find (File and Directory)


    ```

    find [path to start] -name [file or directory]

    ```


    ![](img/87e31443ff747018655a0f4f95ee6187_93_0.png)


    | Other Options | |

    | :--- | :--- |

    | -type | specify file type (e.g., f: normal file, d: directory, l: symbolic link,
    s: hard link) |

    | -size | search with size |

    | -empty | search empty document |

    | -o | or (combine two search criteria) |


    The `find` command is used to locate files or directories under the specified
    path.


    ## Find with File or Directory Name


    Using a file or directory name is one of the frequently used approaches in the
    `find` command. Specify the file or directory after the `-name` option.


    For example, to find the ssh key file named `authorized_keys`, you can run the
    command below.


    ## Command Line - INPUT


    ```

    ubuntu $ | find -name authorized_keys

    ```


    The command returns the file path of the file like the one below.


    ## Command Line - RESPONSE


    ```

    /home/ubuntu/.ssh/authorized_keys

    ```


    ## Find with Other Options


    There are many other approaches to finding files or directories. Here are the
    selected options for the find command.


    ### -type option


    You can specify what type of files or directories you are searching. To use the
    option, add the document type after the -type option. These are examples of the
    document type.


    - f: normal file

    - d: directory

    - l: symbolic link

    - s: hard link


    For example, to find a symbolic link whose name starts with "file" run the command
    below.


    ## Command Line - INPUT


    ```

    ubuntu $ | find file* -type l

    ```


    ### -size option


    You can also search files with the document data size. Specify the size that you
    are looking for.


    - -size +10M: size is 10M or more than 10M

    -size 10M: size is 10M

    -size -10M: size is 10M or less than 10M


    ### -empty option


    With this option, you can find empty documents only.

